    - ref: >-
        ideas/catalogue-20260805/A1-index-calculus.md (entries A1-2, A1-7, A1-9,
        A1-13)
      provenance: internal
      claim: >-
        A1-2 derives the algebra-free meet-in-the-middle exponent N^{1/2+1/m} at
