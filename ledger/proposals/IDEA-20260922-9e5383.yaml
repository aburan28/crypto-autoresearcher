      - Poor-n toy cell (e.g. n = 41 as a d = 1, k' = 41 poor-structure comparison, since 41 is prime and ord_41(2) = 20 gives a moderately rich but different lattice; included only if budget allows).
    required_metrics:
      - field_size_gap_and_ratio_per_pair (Stage 0, already computed)
      - ord_17_4_verification (Stage 0, already computed)
      - wdsat_conflicts_composite_arm_primary_cell
