    - id: H-9e5383-0
      statement: >-
        NONE FOR (A)'s ARITHMETIC OR (C)'s ORDER COMPUTATION. Both are exact
        finite computations. Recorded so the absence is explicit.
      rigorous_support: Direct subtraction/division (A); exhaustive modular exponentiation (C).
      validation_plan: Independent hand recomputation, as invited in falsification_conditions.
    - id: H-9e5383-1
      statement: >-
        NEAREST-NEIGHBOUR PAIRING IS A REASONABLE DEFAULT. Using absolute
        field-degree distance to select the null-object neighbour imitates
        the general "matched field size" principle already stated as
        mandatory in RQ-FROB-7d8dd4's constraints; it is a design choice
        applied here for the first time to the specific BINSTD five-curve
        spread against the four available c2tnb degrees.
      rigorous_support: None beyond the general matched-size principle already adopted elsewhere in this program; the specific pairing is not unique.
      validation_plan: >-
        A reviewer re-running (A) with a different distance metric (e.g.
        weighting by subgroup bit-length rather than field degree) and
        checking whether the resulting pairing differs; not performed here.
  heuristic_note: >-
    Both hard computations in this record (the ratio table and ord_17(4))
    carry no heuristic; the one design choice (nearest-neighbour pairing)
    is named as such and is not dressed up as a derived fact. The a-priori
    expectation for Stage 2, stated before any run: consistent with
    IDEA-20260920-b9f0c5's own prior, the composite arm's WDSat conflict
    ratio is expected to sit near 1 (basis-blind), and the null arm's
    structural absence of any stable subspace is expected to hold trivially
    -- so the primary informative outcome of running this cell is either a
    confirmed, doubly-controlled negative (stronger than b9f0c5's d = 1
    result alone, because it adds the "precondition absent" null on top of
    the within-curve control) or a genuine surprise requiring independent
    review.
