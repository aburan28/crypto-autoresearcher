  assumptions:
    - >-
      "Nearest c2tnb neighbour" is defined by absolute field-degree distance,
      not by any other similarity measure (e.g. cofactor structure); a
      different distance metric could reassign some pairs, most plausibly
      c2pnb208w1 and c2pnb304w1, which sit roughly equidistant from two
      c2tnb neighbours.
    - >-
      Toy (d,k) selection prioritises k prime and d dividing a power of 2
      (mirroring 16 | m's structure) over exact ratio match; the resulting
      ratio errors (up to 10 percentage points at pair 3) are accepted and
      disclosed rather than resolved by relaxing d | 2^a or k prime, which
      would break the analogy to the deployed structure this record exists
      to triangulate.
