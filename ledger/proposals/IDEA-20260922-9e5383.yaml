  proof_search_map:
    bottleneck: >-
      Whether a Frobenius-stable subspace at toy scale (d, k) produces a
      measurable WDSat conflict-ratio effect, and whether that effect (if
      any) is genuinely tied to stability rather than to field size or arity
      alone -- exactly IDEA-20260920-b9f0c5's open question, now asked on a
      pair whose field-size RATIO is deliberately matched to a deployed row
      rather than chosen independently of the BINSTD population.
    baseline_embedding:
      parameter_slice: >-
        Setting d = 1 recovers IDEA-20260918-9abf42's and IDEA-20260920-
        b9f0c5's own F_2-base-field ladder exactly (k = 41 or 43 there); this
        record's contribution is entirely in the d > 1 generalisation and the
        deployed-triangulated parameter choice, not in the base measurement,
        which is unmodified.
      reproduction_check: >-
        On the (d,k) = (2,17) primary cell, the closed-form count (32 stable
        subspaces, dimension set {0,1,4,5,8,9,12,13,16,17}) must match an
        independent factorisation of T^17 - 1 over F_4 (four irreducible
        quartic-or-smaller factors over F_4, degree pattern summing to 16,
        consistent with ord_17(4) = 4 giving four degree-4 irreducible
        factors of Phi_17 over F_4); a disagreement refutes the ord_17(4) = 4
        computation in (C).
    observation_collision:
      observable: >-
        WDSat conflict ratio (b9f0c5's metric) on the composite arm's
        richest stable subspace, and the STRUCTURAL absence of any candidate
        subspace on the null arm.
      distinct_preimage_search: >-
        A composite-arm ratio below 1 could arise from (a) genuine
        Frobenius-stability pruning (the treatment effect this record is
        designed to detect) or (b) an unrelated property of THIS SPECIFIC
        toy curve's arithmetic (e.g. an accidentally easy factor base for
        reasons unconnected to stability). The within-curve non-stable
        control from IDEA-20260922-6cf862's Part 2 (reused, not restated) is
        the distinguishing preimage: if a SIZE-MATCHED NON-STABLE subspace
        on the SAME composite curve shows the same ratio drop, (b) is
        indicated and this record's null-arm result (structural absence) is
        not sufficient alone to credit stability -- both controls are
        needed together, and this record states so rather than claiming its
        own null arm suffices in isolation.
    constructive_transforms:
