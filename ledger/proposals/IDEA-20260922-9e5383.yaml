idea:
  id: IDEA-20260922-9e5383
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-22'
  status: proposed
  approved_by: null
  title: >-
    THE PRIME-DEGREE c2tnb CURVES ARE THE FORCED NULL OBJECT FOR THIS LANE,
    BUT NO TOY LADDER IN THIS PROGRAM HAS EVER TRIANGULATED TO THE FIVE
    DEPLOYED FIELD-SIZE GAPS: A MATCHED d-K' LADDER THAT PRESERVES THE
    "16-times-PRIME" STRUCTURE AT dk <= 41, WITH THE STATED EXTRAPOLATION
    DISTANCE TO EACH OF THE FIVE ROWS, AND THE ONE WDSat MEASUREMENT THAT
    DISCRIMINATES "SUBFIELD STRUCTURE HELPS RELATION COLLECTION" FROM
    "IT DOES NOT" ON A PAIR NEITHER CURVE ALONE CAN SHOW
  class: measurement
  claim: >-
    THE GAP THIS RECORD FILLS. RQ-BINSTD-b6f698 mandates a null object "the
    pseudorandom curve of the same field and group-order magnitude... as the
    nearby-object control for anything the subfield structure appears to
    buy," and names the prime-degree ANSI curves (c2tnb191v1/v2/v3,
    c2tnb239v1/v2/v3, c2tnb359v1, c2tnb431r1) as the natural candidates for
    the composite-degree c2pnb rows. But the FIELD SIZES DO NOT MATCH:
      c2pnb176v1 (176) has no c2tnb neighbour within 15 bits (c2tnb191v1 at
        191, gap 15)
      c2pnb208w1 (208) sits between c2tnb191v1 (191, gap 17) and c2tnb239v1
        (239, gap 31)
      c2pnb272w1 (272) sits between c2tnb239v1 (239, gap 33) and c2tnb359v1
        (359, gap 87)
      c2pnb304w1 (304) sits between c2tnb239v1 (239, gap 65) and c2tnb359v1
        (359, gap 55)
      c2pnb368w1 (368) sits between c2tnb359v1 (359, gap 9) and c2tnb431r1
        (431, gap 63)
    (gaps computed here from the audited field degrees, trivial subtraction).
    Every deployed-scale null-object comparison in this lane is therefore
    ALREADY a comparison across mismatched field sizes, a confound RQ-FROB-
    7d8dd4's own constraint ("matched size, matched subgroup order, matched
    factor-base size") exists to prevent, and NEITHER IDEA-20260922-d11575
    NOR IDEA-20260922-6cf862 measures anything at deployed scale -- both are
    arithmetic on published parameters, with their TOY verification cells
    chosen for convenience (dk <= 41) rather than to preserve the deployed
    field-size relationship to the nearest prime-degree neighbour. This
    record proposes the missing ladder: TOY CELLS THAT PRESERVE THE RATIO
    OF EACH DEPLOYED c2pnb ROW TO ITS NEAREST c2tnb NEIGHBOUR, at executable
    scale, together with the ONE differential measurement (a Frobenius-
    stable-subspace WDSat conflict-ratio contrast, reusing IDEA-20260920-
    b9f0c5's instrument) that a matched PAIR can show and neither curve
    alone can.

    (A) THE TRIANGULATED LADDER, COMPUTED HERE. For each deployed pair
    (c2pnb row, nearest c2tnb row), pick (d, k) for the composite arm with
    dk <= 41 and d*k' as close as possible in RATIO to (16k)/(c2tnb degree),
    and a MATCHED PRIME n for the null arm with n close to d*k' in absolute
    size (not ratio, since the null has no "d" factor to preserve):
      pair 1: c2pnb176v1 (176) / c2tnb191v1 (191), ratio 0.921. Toy:
        (d,k) = (4,9)? 9 not prime. Use (d,k)=(4,7), dk=28; matched null
        n = 31 (ratio 28/31 = 0.903, within 2% of the target 0.921).
      pair 2: c2pnb208w1 (208) / c2tnb191v1 (191), ratio 1.089. Toy:
        (d,k)=(4,9) invalid (9 not prime); (d,k)=(2,17), dk=34; matched null
        n = 31 (ratio 34/31 = 1.097, within 1% of 1.089).
      pair 3: c2pnb272w1 (272) / c2tnb239v1 (239), ratio 1.138. Toy:
        (d,k)=(4,9) invalid; (d,k)=(2,19), dk=38; matched null n = 33
        (not prime -- use n = 37: ratio 38/37 = 1.027, off by 10 points from
        1.138; flagged below as the ladder's weakest cell).
      pair 4: c2pnb304w1 (304) / c2tnb359v1 (359), ratio 0.847. Toy:
        (d,k)=(4,7), dk=28; matched null n = 33 (not prime -- use n = 31:
        ratio 28/31 = 0.903, off by 6 points from 0.847).
      pair 5: c2pnb368w1 (368) / c2tnb359v1 (359), ratio 1.025. Toy:
        (d,k)=(2,19), dk=38; matched null n = 37: ratio 38/37 = 1.027,
        within 0.2 points of 1.025 -- THE BEST-MATCHED CELL IN THE LADDER,
        and the one this record's minimal test runs first.
    Every (d,k) pair uses k prime and d | 16 as the composite side requires
    (mirroring the real curves' m = 16k structure at toy scale with d in
    place of 16); every n is prime. The ratio mismatches (worst at pair 3,
    10 percentage points) are DISCLOSED, not hidden, and are exactly the
    kind of triangulation error a toy ladder at dk <= 41 cannot avoid when
    matching a five-way deployed spread with prime-only null candidates --
    this record's contribution is COMPUTING that error explicitly rather
    than choosing a ladder ad hoc and leaving the mismatch unstated.

    (B) THE DIFFERENTIAL MEASUREMENT NEITHER CURVE ALONE CAN SHOW. Reusing
    IDEA-20260918-9abf42's closed-form Frobenius-stable-subspace count and
    IDEA-20260920-b9f0c5's WDSat conflict-ratio instrument: on the composite
    arm (d, k), a Frobenius-stable F_{2^d}-subspace lattice exists (per
    IDEA-20260922-6cf862's generalisation of 9abf42 to base field F_{2^d}),
    with dimension set governed by ord_k(2^d); on the null arm (prime n),
    NO nontrivial stable subspace exists by construction (divisor lattice of
    a prime is {1, n}), so the WDSat conflict-ratio measurement CANNOT even
    be attempted there in its treatment form -- the null arm's role is not
    "run the same measurement and get a different number," it is "confirm
    the measurement's precondition is ABSENT," which is a structurally
    different and stronger null than a same-shape-different-value contrast.
    Concretely: measure the WDSat conflict ratio on the composite arm's
    richest available stable subspace (per pair, computed from ord_k(2^d))
    against the orbit-naive null 2^{ml}/m! (b9f0c5's instrument, unmodified);
    on the null arm, confirm by construction that no stable subspace of
    intermediate dimension exists to measure at all. TWO outcomes, BOTH
    reportable: (i) the composite arm's conflict ratio sits near 1 (basis-
    blind, per b9f0c5's own primary prediction) -- then the pair confirms
    that even where subfield structure is DENSEST at toy scale (k = 17
    row's toy analogue, see (C)), it buys nothing at the search-step level,
    strengthening the negative reading across the whole lane; or (ii) the
    ratio sits materially below 1 -- then the pair is the FIRST evidence
    anywhere in this program that Frobenius stability reaches the solving
    step, and the null arm's structural absence of the precondition is what
    certifies the effect is genuinely about stability, not an artefact of
    field size or arity alone.

    (C) WHICH PAIR TO RUN FIRST, AND WHY. Reusing IDEA-20260922-6cf862's
    ord_k(2^16) census (d = 5, 3, 1, 9, 11 for k = 11, 13, 17, 19, 23), the
    ANALOGOUS toy quantity ord_k(2^d) for the chosen (d, k) pairs governs
    lattice richness the same way. Pair 2, (d,k) = (2,17): ord_17(4) = ?
    (computed here) 4^1=4, 4^2=16, 4^4=256=1 mod 17 (256 = 15*17+1): so
    ord_17(4) = 4, giving f = 1 + 16/4 = 5, 32 stable subspaces, dimension
    set {0,1,4,5,8,9,12,13,16,17} -- a RICH lattice, the toy analogue of the
    deployed c2pnb272w1 row's own richness (d = 1 there, f = 17, even
    richer, but 272-bit scale is not executable; this toy cell is the
    nearest reachable proxy). This record recommends pair 2 (best available
    proxy for the richest deployed row) OVER pair 5 (best RATIO match but a
    poorer analogue of any specific deployed row's richness) as the primary
    cell, and states both selections so a reviewer can choose either
    criterion.

    Representation class R1 (RQ-ECDLP-623a32). Attack stage: relation-search
    system count (the same stage IDEA-20260920-b9f0c5 targets), measured on
    a pair constructed specifically to triangulate the deployed field-size
    gaps this lane's null-object mandate otherwise leaves unquantified.
  mechanism: >-
    OBJECT FRAME. Representation: R1, x-coordinates restricted to a
    Frobenius-stable F_{2^d}-subspace, exactly IDEA-20260922-6cf862's (C)
    object, generalised to toy scale. Operation set Sigma: translation by
    factor-base elements together with <phi>, phi the F_{2^d}-power
    Frobenius -- identical trichotomy placement to 6cf862 (partial-action,
    Class I), cited and not re-derived. WHAT THIS RECORD ADDS is not a new
    object or a new lossy-projection argument (both are 6cf862's, cited
    verbatim) but the SPECIFIC TOY PARAMETER SELECTION that ties the
    executable ladder to the deployed field-size structure of this
    particular lane's five rows and their nearest null neighbours, which no
    record in RQ-FROB-7d8dd4 (whose toy ladders are chosen for their own
    reasons, unconnected to the BINSTD population) or in this lane has done.

    THE ARITHMETIC, SHOWN. Field-size gaps in (A) are plain subtraction of
    the audited/published extension degrees. Ratios are plain division. The
    order computation ord_17(4) = 4 in (C) is shown step by step: 4^1 = 4
    mod 17, 4^2 = 16 mod 17, 4^4 = 16^2 = 256 mod 17 = 256 - 15*17 =
    256 - 255 = 1 -- confirming ord_17(4) divides 4 and is not 1 or 2
    (checked: 4^1=4, 4^2=16, neither 1), so ord_17(4) = 4 exactly. f =
    1 + (17-1)/4 = 1 + 4 = 5, giving 2^5 = 32 stable subspaces (mirroring
    IDEA-20260918-9abf42's formula with n = 17, q = 4 in place of q = 2).

    WHY THE NULL OBJECT'S ROLE IS STRUCTURAL, NOT COMPARATIVE. On a prime-
    degree curve there is no proper subfield and hence (by the divisor-
    lattice correspondence, 9abf42/6cf862) NO nontrivial Frobenius-stable
    subspace at all -- the null arm cannot even be asked the treatment
    question. This is a STRONGER null-object design than "same measurement,
    different value" (IDEA-20260901-863e36's ordinary matched-null pattern):
    it is "the treatment's PRECONDITION is verifiably absent," which rules
    out an entire class of confound (a size- or field-characteristic-driven
    WDSat conflict-count difference unrelated to stability) more cheaply
    than running the measurement on a size-matched non-stable subspace of
    the SAME curve would (which IDEA-20260922-6cf862's Part 2 minimal test
    already proposes as a within-curve control, "kind: matched_dimension_
    non_stable" -- this record's null arm is a DIFFERENT, CURVE-LEVEL
    control, not a duplicate of that within-curve one, and both should be
    run if resources allow).

    F2 (factor-base decomposition, via the WDSat/relation-search stage) is
    the declared component, reusing IDEA-20260920-b9f0c5's instrument
    without modification. What is added: the deployed-triangulated
    parameter selection (A), the richness proxy computation (C), and the
    explicit accounting of the ratio-matching error the triangulation
    incurs, which a ladder chosen without this record's discipline would
    leave silent.
