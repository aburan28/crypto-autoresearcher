  minimal_test:
    design: >-
      STAGE 0 (arithmetic, no run, already performed above): the (A) gap/
      ratio table and the (C) ord_17(4) computation, independently
      reproducible by hand. STAGE 1 (minutes): construct the primary toy
      pair, composite E/F_4 over F_{4^17} (field size 34 bits) and null
      E'/F_{2^37} (37 bits, prime, no proper subfield), matched as closely
      as the ratio table allows; verify point counts and prime-subgroup
      orders exactly. STAGE 2 (hours, reusing b9f0c5's instrument
      unmodified except for the base field): build the Weil-descent PDP
      instance on the composite arm's richest stable subspace (one of the
      four degree-4-kernel subspaces from the f = 5 lattice), certify UNSAT
      on at least 3 fresh targets, run WDSat, compute the conflict ratio
      against 2^{ml}/m!. STAGE 3 (hours): the within-curve non-stable
      control (size-matched random F_4-subspace of the composite curve) and
      the d = 1 cross-check cell (reuse b9f0c5's own n = 41 result if
      already run, or run it fresh). STAGE 4 (minutes): confirm the null
      arm (E'/F_2^37) has no nontrivial stable subspace by exhaustive
      divisor check of T^37 - 1 over F_2 (trivially {1,37} since 37 is
      prime). CHEAPEST VALID DISCRIMINATOR: Stage 0 plus Stage 4 costs
      nothing and already establishes the structural half of the null-
      object argument; Stage 2's single WDSat run on the primary cell is
      the cheapest cell that adds a genuine new measurement beyond what
      b9f0c5 already proposes at d = 1.
    controls:
