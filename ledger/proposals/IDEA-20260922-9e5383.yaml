  falsification_conditions:
    - Any arithmetic error in the (A) gap/ratio table or the (C) ord_17(4) = 4 computation, found by independent recomputation.
    - A prime n exhibited with a nontrivial Frobenius-stable F_2-subspace (contradicts the divisor-lattice correspondence at the heart of the null arm's structural role; would also refute 9abf42/6cf862).
    - >-
      Random-V and stable-V conflict ratios on the composite arm disagree by
      less than 10% while both near 1 (per b9f0c5's own falsification
      condition, reused): "basis-blind" must be re-scoped, not asserted.
    - >-
      Composite-arm stable ratio shows material pruning (<=0.5) but the
      within-curve non-stable control ALSO shows it: the effect is not
      specific to stability and this record's central claimed discriminator
      fails.
  confounders:
    - >-
      The toy field sizes (28-38 bits) are themselves far smaller than any
      deployed row (161-353 bits); this record's contribution is a matched
      NULL-OBJECT PROTOCOL, not a transfer claim, and no result here bears on
      deployed curves without a stated extrapolation assumption this record
      does not make.
    - >-
      Ratio-matching errors up to 10 percentage points (pair 3) mean the toy
      ladder is an IMPERFECT triangulation; any finding is reported per cell
      with its own ratio error stated, never averaged across cells as if
      they were equally well matched.
    - >-
      d = 2 or 4 toy base fields have their own small-field artefacts (e.g.
      F_4 has very few elements, so "richness" at d = 2 may behave
      differently than richness at d = 16 in ways unrelated to k);
      IDEA-20260922-6cf862's confounders list ("a stable subspace and a
      random subspace of the same dimension differ in more than stability
      at very small d") applies here unmodified and is not re-derived.
  interpretation_limits:
    - Proposal only. No experiment, no run, no approval, no result exists here.
    - >-
      This record supplies a PROTOCOL and a computed parameter table, not a
      measurement; Stage 2 onward is unrun.
    - >-
      The (d,k)-versus-n pair selection in (A) is a design choice with
      disclosed ratio errors, not a unique or provably optimal triangulation;
      a reviewer preferring a different distance metric may reasonably
      choose different pairs.
    - >-
      Nothing here re-derives IDEA-20260920-b9f0c5's WDSat instrument or
      IDEA-20260922-6cf862's lossy-projection argument; both are cited and
      reused, not re-proved.
