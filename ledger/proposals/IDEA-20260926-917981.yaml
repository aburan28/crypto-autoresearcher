        structured sets, whose lower parts are S_3's.
      validation_plan: >-
        SAMPLE all 144 targets per set; COMPARE the per-set M_4 rate with the
        saturation prediction; TAIL: any target refuted at M_4 with a
        non-saturated count, or unrefuted with a saturated one, is listed by
