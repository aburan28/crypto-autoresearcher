    - Proposition F's amortisation is the known GGMP 1/n and is unavailable on ECC2K-130's linear factor bases; it is recorded as a control, not a lever.
    - KN-OPEN-020 class of every V here is the scoped-out linear-subspace class.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Saturation predicts M_4.) For each V-set the plain M_4 refutation
        rate on unsatisfiable targets is 1 where the tensor's saturation count
