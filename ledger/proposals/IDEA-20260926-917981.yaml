  assumptions:
    - The RC-1 curve, modulus and the 144 archived targets of RUN-CERTBIN-c417e0 are reused as literal inputs; nothing is re-sampled.
    - A normal element of F_{2^17} is found by the standard search in pure Python (test that the conjugates are linearly independent); no Gaussian-normal-basis existence condition is needed.
    - The 9-dimensional Frobenius-stable V is F_2 + ker g(sigma) for one octic factor g of Phi_17 over F_2; both octics are tried.
    - >-
      OFF-LIMITS COMPONENT DECLARED (docs/object-frame-ideation.md section 2):
      F2 as the family; F6 (automorphism orbit) as a component in Proposition
      F only, with the gain stated as the known 1/n.

  proof_search_map:
    bottleneck: >-
      Whether any representation-level choice other than the set V can move a
      closure outcome (Proposition B says no), and whether W_4 sees the set at
      all on structured V (measured).
    baseline_embedding:
      parameter_slice: >-
        The RC-1 cell itself (polynomial V, archived labels: M_4 324/386,
        W_4 386/386) is the exact slice; arm (a) below must reproduce it.
      reproduction_check: >-
        Arm (a): re-descend the 144 archived targets in a NORMAL field basis
        and with a random basis of the polynomial V, run M_4 and W_4, and
        reproduce every archived label, iteration count and dimension exactly
        (Proposition B predicts 144/144 agreement; any disagreement is either
        an instrument defect or a counterexample to the proposition and is
        the headline).
    observation_collision:
      observable: The triple (M_4 label, W_4 label, first iteration containing 1) per target per V-set.
      distinct_preimage_search: >-
        Two V-sets with equal kappa but different tensors could give
        different rates (kappa is not the object); the polynomial V and the
        stable V both have kappa = 17 at l = 9, n = 17, so a rate difference
        between them exhibits exactly this collision and says the finer
        tensor invariant is the object.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The closure outcome as a function of (set V, x_R) only, with the bases quotiented out by the automorphism argument.
        predicted_gain: Removes one confound from every closure-based measurement at zero compute; no cost gain.
      - transform: observable_fiber
        proposed_object: Three V-sets of dimension 9 at the same 144 targets, with the archived polynomial V as the reference fibre.
        predicted_gain: Decides E-SET against E-POLY for W_4 and reads the M_4 rate as a saturation-count consequence per set.
    quantifier_order: >-
      Propositions B and F: FORALL n, V, x_R, D, FORALL bases (and, for F,
      FORALL Frobenius-stable V): exact equalities. The empirical claim: FOR
      the 144 archived targets and the three named V-sets, the W_4 and M_4
      rates are as measured.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Closure outcomes are basis-invariant (proved); on the RC-1 targets
        the W_4 rate is r_poly, r_norm, r_stab and the M_4 rate is as measured
        per set; on the stable set one certificate per Frobenius orbit
        transfers and verifies 17-fold." Nothing about SAT engines, about
        n = 19 or 131, or about cost.
      nearby_object_control: >-
        The n = 19 cell as the object where Proposition F has no stable V to
        act on (control for the amortisation arm: the transfer must be
        impossible there by construction, and the record predicts nothing
        else changes).
    proof_obligations:
      - claim: Linear substitution v -> Tv is a degree-preserving ring automorphism of B in characteristic 2.
        responsibility: correctness
      - claim: Recombining equations by an invertible matrix leaves rowspace(M_D) and W_D unchanged.
        responsibility: correctness
      - claim: The squaring map on a stable V induces such an automorphism and maps the system for x_R to the system for x_R^2.
        responsibility: correctness
      - claim: The stable 9-dimensional V at n = 17 exists and is computed exactly (kernel of g(sigma)).
        responsibility: feasibility
      - claim: Transferred certificates verify under the separate-process verifier on every conjugate.
        responsibility: correctness
    not_applicable_reason: null

  predictions:
    - metric: label agreement between the archived RC-1 closures and the re-descended arm (a), over 144 targets x {M_4, W_4}
      direction: same
      minimum_effect: 'exactly 288/288 by Proposition B; any disagreement is the headline.'
    - metric: W_4 refutation rate on the unsatisfiable archived targets, normal-coordinate V and Frobenius-stable V (CP95)
      direction: different
      minimum_effect: 'E-SET iff both >= 0.90; E-POLY iff either <= 0.50; MIXED otherwise.'
    - metric: M_4 refutation rate on the same targets, per V-set
      direction: different
      minimum_effect: >-
        Predicted from the saturation count of each set's tensor, computed
        first (seconds); a measured rate contradicting its own saturation
        prediction is reported as a break of KN-FIND-7c1e94's counting rule.
    - metric: transferred-certificate verification count on the stable V, 17 conjugates per refuted target
      direction: same
      minimum_effect: 'exactly 17/17 per target by Proposition F; any failure is an instrument or proposition defect.'

  minimal_test:
    design: >-
      CELL. RC-1: n = 17, f = t^17 + t^3 + 1, m = 2, l = 9, curve A = 97044,
      B = 126251, the 144 archived x(2E) targets (U62, S62, C20) of
      RUN-CERTBIN-c417e0. ARMS. (a) Coordinate change only: polynomial V with
      a random basis of V, and the equations descended in a normal field
      basis; prediction exact agreement. (b) Normal-coordinate set
      V_N = span of nine conjugates of a normal element. (c) Frobenius-stable
      set V_S = F_2 + ker g(sigma), both octic factors of Phi_17. (d) One
      random 9-dimensional V (RC-4's object) as the shape-matched null.
      For each set: rebuild x_R-conditioned unsatisfiability (oracle A over
      that set, 512 root-findings), then M_4, W_4 and the saturation count of
      the tensor; on (c), transfer each certificate to the 16 conjugate
      targets and verify. INSTRUMENT. experiments/EXP-CERTBIN-e94b27/impl/
      (closure.py generic; macaulay.py's descent extended to take an
      arbitrary basis of V and of the field; oracles_rc1.py's oracle A with a
      general basis; verifier/verify_cert.py). Nothing `missing`. SEEDS: one
      stream for the random basis and the random V, recorded. METRICS.
      Agreement counts (arm a); W_4 and M_4 rates with CP95 per set; first
      iteration per instance; saturation count per set (dimension);
      transferred-certificate verification count. CONTROLS. Arm (a) as the
      identity control; satisfiable archived controls (S62) on every set (0
      refutations); arm (d) as the random-label null of the same shape; no
      relabelled Z/NZ control (no group-structure claim). OUTCOME TABLE.
      POSITIVE (arm a exact, E-SET): the descent basis is retired as a
      confound for closure-based CERTBIN measurements and W_4 is read as
      set-blind at this cell; the stable-V amortisation verifies as the known
      1/n. NEGATIVE (arm a exact, E-POLY): W_4 refutation is polynomial-
      set-specific; every quoted W_4 rate acquires the qualifier "on the
      polynomial subspace", and KN-OPEN-3c8f51 item (A) sharpens to the
      convolution tensor. ARTIFACT (arm a not exact, or any satisfiable
      control refuted, or a transferred certificate failing): the instrument
      or a proposition is broken; nothing else is read until localised.
      FALSIFICATION THRESHOLD. Proposition B falsified by one verified
      disagreement in arm (a) after the instrument is checked; E-SET
      falsified iff either structured set's W_4 rate <= 0.50. COST (estimate):
      implementation low to medium (general-basis descent, about 150 lines);
      compute about one CPU-hour (M_4 2924 x 4048 and W_4 on 144 x 4 sets).
    controls:
      - Arm (a) identity control, exact agreement required.
      - S62 satisfiable controls on every set; any refutation voids the run.
      - Arm (d) random V of matched dimension as the shape null.
      - Saturation count per set computed before any closure runs (pre-data predictor of M_4).
      - Separate-process certificate verification, including all transferred certificates.
    required_metrics:
      - agreement counts for arm (a)
      - W_4 and M_4 rates with CP95 per V-set, unsatisfiable arm
      - first iteration containing 1 per instance per set
      - saturation count per set
      - transferred-certificate verification counts

  falsification_conditions:
    - 'Proposition B falsified by any verified label disagreement in arm (a) once the instrument regression passes.'
    - 'Proposition F falsified by any transferred certificate that fails verification while the source certificate verifies.'
    - 'E-SET falsified iff the W_4 rate on V_N or V_S is <= 0.50; E-POLY falsified iff both are >= 0.90.'
    - 'Instrument falsified (void) by any refuted satisfiable control.'

  confounders:
    - A random basis of V is not a random SET; arm (a) tests bases only and must not be read as a set effect.
    - The two octic factors of Phi_17 give two stable sets; both are run and reported separately.
    - Oracle A must be rerun per set, since unsatisfiability is set-relative; archived sat flags do not transfer.
    - One curve and one n; at n = 19 no stable set exists, so arm (c) has no counterpart there.

  interpretation_limits:
