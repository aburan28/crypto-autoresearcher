idea:
  id: IDEA-20260926-917981
  question_id: RQ-CERTBIN-836ce2
  added: '2026-09-26'
  status: proposed
  approved_by: null
  title: >-
    NORMAL-BASIS VERSUS POLYNOMIAL-BASIS DESCENT IS A CHANGE OF COORDINATES
    FOR MACAULAY AND MUTANT CLOSURES, NOT A CONFOUND: the closure outcome
    depends only on the set V and on x_R (Proposition B), so the live
    confound is the multiplication tensor of V; tested on the RC-1 targets
    with polynomial, normal-coordinate and Frobenius-stable V, the last with
    exact Frobenius-orbit certificate transfer (Proposition F)
  class: control

  claim: >-
    CEILING FIRST. No cost claim; m = 2 at the measured cell, where oracle A
    and rho dominate; m-uniform as a statement about the instrument. The
    record bears on every arity only by removing a confound from every
    closure-based cost law, and on ECC2K-130 only negatively (Proposition F's
    amortisation needs a Frobenius-stable V, which F_{2^131} has at no
    index-calculus dimension, IDEA-20260918-9abf42 / KN-OPEN-095df5).

    PROPOSITION B (exact, zero compute). Let V be an F_2-subspace of F_{2^n},
    x_R fixed, and let the descended system be built (i) in any F_2-basis of
    F_{2^n} for the equations and (ii) in any basis of V for the unknowns.
    Then for every D the row spaces M_D and the mutant closures W_D obtained
    from two such choices are images of each other under a degree-preserving
    ring automorphism of B = F_2[v]/(v_i^2 + v_i), and in particular
    "1 in M_D" and "1 in W_D" are the same for both. Proof. (i) Changing the
    field basis replaces the equations f_k by invertible F_2-linear
    combinations, which leaves rowspace(M_D) unchanged and hence W_D unchanged.
    (ii) Changing the basis of V substitutes v -> T v with T in GL(l, F_2). In
    characteristic 2 squaring is linear, so (T v)_i^2 = sum_j T_ij v_j^2 =
    (T v)_i in B: the substitution is a ring automorphism of B, it preserves
    degree, it maps B_{<= D} onto itself, it maps multiplier monomials to
    products of linear forms lying in B_{<= deg mu}, and it maps the set
    {v_j} onto a spanning set of the linear forms; therefore it maps M_D onto
    a space with the same row space as the transformed M_D and W_D onto the
    transformed W_D, and it fixes the constant 1. QED. CONSEQUENCE: the
    "normal-basis versus polynomial-basis descent" confound of HOLD-I
    (IDEA-20260922-cdca3a and its consolidated records) is absent for the
    closure instrument, and the ONLY basis-adjacent quantity that can move a
    closure outcome is the SET V, through the multiplication tensor
    V x V -> F_{2^n} (the object IDEA-20260922-37e02e's kappa(V) summarises
    coarsely). KN-FIND-7c1e94 section 3 already shows the set matters at M_4
    (a random 9-dimensional V' takes the M_4 rate from 144/144 to 0/25 while
    W_4 stays 25/25).

    PROPOSITION F (exact, zero compute). If V is Frobenius-stable (V^2 = V),
    then W_D(x_R^2) is the image of W_D(x_R) under the automorphism induced by
    squaring, because S_3 has F_2-coefficients so S_3(x_1^2, x_2^2, x_R^2) =
    S_3(x_1, x_2, x_R)^2 and the induced map on Boolean coordinates is a
    ring automorphism of B as in (ii). Hence one closure per Frobenius orbit
    of targets, and a degree-disciplined certificate for x_R transfers to
    x_R^{2^i} by applying the automorphism to every multiplier mu and the
    squaring matrix to every equation index k. This is the closure-level form
    of IDEA-20260906-a77711 Lemma A1 (equivariance between conjugate targets,
    never a symmetry of one system) and it buys exactly the 1/n on
    polynomial systems that GGMP already credits (KN-LIT-796, abstract level):
    a known constant, not a new gain. At n = 17, ord_17(2) = 8 so F_{2^17}
    has stable subspaces of dimensions 0, 1, 8, 9, 16, 17 and a 9-dimensional
    stable V exists; at n = 19, ord_19(2) = 18 and none exists; at n = 131
    none exists (IDEA-20260918-9abf42). Representation class R1; attack stage:
    the per-attempt solve; cost changed: none (that is the finding).

    THE TWO READINGS. E-SET: the W_4 refutation is a property of the tensor
    neighbourhood (KN-FIND-c3a917) and stays at its ceiling on every
    9-dimensional V, structured or random, while the M_4 rate is set by the
    saturation count of the tensor (KN-FIND-7c1e94). E-POLY: the W_4 refutation
    is specific to the polynomial subspace {deg < 9} and its convolution
    tensor, and drops on the normal-coordinate and Frobenius-stable sets.
    Both are decidable from counts on the 144 archived RC-1 targets.

  mechanism: >-
    OBJECT FRAME. Representation R1 (Boolean coordinates of x_i in a basis of
    V; equations in an F_2-basis of the field). The relation-search object is
    Class I partial-action, unchanged. The solver-side object is the pair
    (set V, x_R) that Proposition B shows the closure actually depends on;
    the operation set Sigma is the D-bounded ring action of B together with
    (for Proposition F) the Frobenius orbit action on targets. TRICHOTOMY:
    the closure outcome is COORDINATE-INDEPENDENT by Proposition B, which is
    why the record is a control: the thing HOLD-I asks to control is proven
    to be a change of coordinates, and the residual object (the set V) is
    placed as a design variable, not a projection of the group. LOSSY-
    PROJECTION TEST: the map (basis of field, basis of V, set V, x_R) ->
    (set V, x_R) discards the two bases; the discard is Sigma-compatible
    because both act as ring automorphisms of B that commute with the
    D-bounded action (Proposition B); it is lossy in the representation used
    (many bases per set). A projection that discards the SET V too would be
    a change of coordinates only if all V of a dimension behaved alike, which
    KN-FIND-7c1e94 section 3 refutes at M_4; hence the set is the object.
    THE ONE OPEN NUMBER: whether W_4 (as opposed to M_4) sees the set at all
    on structured V, measured as three rates on the same 144 targets. WHAT
    THIS IS NOT: it is not a solver-agnostic statement. For SAT/DPLL engines
    the basis is a live confound (IDEA-20260904-3c7a91's no-above-leaf law,
    IDEA-20260922-7ab503's normal-basis symmetry constraint), because those
    engines branch on coordinates; Proposition B says nothing about them.

