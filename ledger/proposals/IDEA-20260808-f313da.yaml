idea:
  id: IDEA-20260808-f313da
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  title: The three successive minima of the trace-zero lattice are NOT independent -- Aubry-Oyono-Vincent's
    own Gram identity forces p/4 <= N1 N2 N3 <= p/2 -- so Remark 1's multiplicity gain is
    computable exactly by a two-dimensional integral over the constraint surface, and it is
    skewed rather than a factor 3.
  class: theory
  claim: 'Every treatment of Remark 1 in this corpus, including catalogue C1-3''s Siegel-Rogers
    pricing, models the short vectors as independent draws. They are not: the campaign''s
    own transcription of AOV eq. (7) records p = 4 det N with 0 <= x, y <= N1, |z| <= N2 and,
    as a consequence, p/4 <= N1 N2 N3 <= p/2. CLAIM: writing u_i = log N_i / log B, this forces
    u_1 + u_2 + u_3 = log(p) / log(B) + O(1/log B) = 3u + O(1/log B) with u = log(p^{1/3})/log
    B, so the three smoothness parameters lie on a simplex rather than being free. CONSEQUENCES,
    all derivable at the whiteboard: (a) the probability that at least one of the three minima
    is B-smooth is E[1 - prod_i (1 - rho(u_i))] over the induced law on the simplex, NOT 1
    - (1 - rho(u))^3; (b) since u -> u log u is convex, the sum sum_i rho(u_i) is MAXIMISED
    at unequal u_i, so the multiplicity gain is concentrated on curves with an unusually small
    first minimum -- exactly the curves the Lemma-3.5 bound already treats best -- and is
    correspondingly SMALLER than the naive factor 3 on typical curves; (c) therefore Section
    4.1''s own caveat that its numbers "may be OVERESTIMATING the factor 1/P0 (see Remark
    1)" is correct in sign but the magnitude is less than a factor 3, and it is computable.'
  mechanism: 'The constraint is a determinant identity, not a heuristic: a rank-3 lattice
    of determinant p/4 has N1 N2 N3 between det and gamma-corrected multiples of it, and AOV''s
    explicit Gram parameterisation pins the constants. Given the constraint, the joint law
    of (N1, N2, N3) is the random-lattice law conditioned to the surface, which for a rank-3
    lattice is a classical two-parameter family. Integrating 1 - prod(1 - rho(u_i)) against
    it is a two-dimensional numerical integral with no free parameters once B is fixed.'
  why_not_a_renamed_known_approach: Catalogue C1-3 prices Remark 1 against the Siegel-Rogers
    short-vector count, which is a COUNT and treats vectors as a Poisson process -- i.e. it
    assumes exactly the independence this record refutes. Catalogue B1-2 measures the successive-minima
    profile empirically without deriving the constraint's consequence for smoothness. S1-01
    of S1.yaml uses the count law at a larger radius and inherits the same independence assumption
    (HA-2), so this record is a CORRECTION to S1-01 as much as to the frozen source, and that
    is stated rather than hidden.
  predictions:
  - observable: the constraint on the fitted minima
    metric: N1 N2 N3 / p over crypto-scale Deuring samples
    predicted: In [0.25, 0.5] for every sample, with zero exceptions. This is a FORCED value;
      a single exception falsifies the transcription of AOV eq. (7) that this campaign relies
      on throughout.
  - observable: the multiplicity gain
    metric: measured P0 divided by rho(u_1), i.e. the gain over the single-minimum bound
    predicted: Strictly between 1 and 3, and closer to the low end on typical curves; the
      record must produce the number by numerical integration BEFORE the measurement, so the
      comparison is a prediction and not a fit.
  - observable: the skew
    metric: correlation between (multiplicity gain) and (N1 / p^{1/3})
    predicted: NEGATIVE -- curves with small N1 get more gain. A positive or zero correlation
      falsifies the convexity argument.
  minimal_test: 'STAGE 0, zero compute: derive the simplex constraint and perform the two-dimensional
    integral numerically for the source''s own B, producing a predicted gain factor. STAGE
    1, crypto scale and nearly free: on the SAME Deuring samples S1-01 and S1-02 require,
    record all three minima (not just the first), verify the forced constraint, and compare
    the empirical gain to the predicted one. STAGE 2, toy: cross-check against exhaustive
    AOV-style computation at p <= 10^4.'
  controls:
  - 'FORCED-VALUE CONTROL (can fail): N1 N2 N3 / p in [0.25, 0.5] on every sample. This is
    the check that the lattice being sampled is the one the theory describes, and it is not
    tautological because a wrong normalisation would break it.'
  - 'NULL OBJECT: random integral ternary forms of determinant p/4 that are not ideal forms;
    the constraint must hold there too (it is pure lattice geometry), which isolates any ARITHMETIC
    deviation as the interesting residual.'
  - 'INDEPENDENCE NULL: recompute the gain under the (false) independence model and report
    both, so the size of the correction is visible rather than asserted.'
  - 'TOY GROUND TRUTH: exhaustive AOV-style delta computation at p <= 10^4.'
  confounders:
  - The o(1/log B) slack in u_1 + u_2 + u_3 = 3u is not negligible at realisable p, where
    log B is a small number; the record must carry the slack explicitly rather than taking
    the simplex as exact.
  - 'Non-cyclic vectors: the second and third minima may be imprimitive, in which case the
    relevant isogeny is a smaller cyclic one and the u_i are not the right variables. The
    primitivity of each minimum must be recorded per sample.'
  - Lemma 3.4's split argument was proved for the MINIMAL isogeny, using minimality to get
    cyclicity. Using the second or third minimum requires re-checking cyclicity, and that
    check is an obligation of this record, not an assumption.
  falsification_conditions:
  - Any sample violates N1 N2 N3 / p in [0.25, 0.5] -- the campaign's transcription of AOV
    eq. (7) is then wrong and much of the exponent budget must be re-derived.
  - The measured gain exceeds 3 or is below 1, contradicting the derivation.
  - The gain-versus-N1 correlation is non-negative, falsifying the convexity mechanism.
  interpretation_limits: An o(1)-level correction, like S1-01, and not an exponent move. Its
    importance is that it CORRECTS a factor that S1-01, C1-3 and the frozen source's own Section
    4.1 caveat all treat loosely, and that it does so with a forced-value control that can
    fail. Conditional on Heuristic 1; SC-3 forbids quoting a bit figure.
  assumptions:
  - AOV eq. (7) as transcribed in research/P13-HEUR-001 section 1 item 3 (CITED-NOT-VERIFIED;
    AOV has not been read line by line by this program).
  - Cyclicity of the second and third minima must be checked, not assumed (listed as an obligation
    above).
  heuristic_assumptions:
  - id: HB-9
    statement: CONSTRAINED SMOOTHNESS INDEPENDENCE. Conditioned on (N1, N2, N3) lying on the
      constraint surface, the events {N_i is B-smooth} are independent, so P0 = E[1 - prod_i
      (1 - rho(u_i))] over the induced law.
    rigorous_ingredient: The determinant identity p/4 <= N1 N2 N3 <= p/2, which is a theorem
      about the lattice and not a modelling choice, plus Canfield-Erdos-Pomerance for each
      individual N_i.
    distribution_imitated: Dickman-de Bruijn rho for each minimum, exactly as Heuristic 1
      does for the first -- the record extends the source's own heuristic to the second and
      third minima rather than inventing a new one, and pairs it with a rigorous constraint
      the source does not use.
    validation_route: CRYPTO SCALE via the paper's own Section 4.2 Deuring sampler, extended
      to record all three minima and factor all three norms. 100,000 samples at p = 5*2^248-1
      and 10,000 at p = 27*2^500-1. Compare the empirical joint smoothness pattern against
      the constrained-independence prediction and against the unconstrained-independence null.
    tail_checks: The 500 smoothest samples, exactly the subsample the source zooms on in Figures
      1-2, are where the constrained and unconstrained models differ most and are the designated
      tail check.
  target_complexity:
    time_exponent: p^{1/3+o(1)}, unchanged. The record corrects a multiplicative factor strictly
      between 1 and 3 inside the o(1) and, by correcting S1-01's HA-2, may reduce S1-01's
      claimed saving.
    memory_exponent: Unchanged.
    best_known_baseline: p^{1/3+o(1)} time and memory conditional on Heuristic 1 (plus GRH
      for Isogeny, SC-1); p^{1/2}(log p)^{O(1)} unconditional.
    hidden_overhead_disclosure: The record's whole subject is a factor inside the disclosed
      superpolynomial o(1). It does not remove it and does not claim to.
    time_memory_tradeoff: Unchanged; the correction multiplies the attempt count and moves
      along the existing curve rather than changing it.
  sota_delta: 'Zero on the exponent. On the accuracy axis: replaces an independence assumption
    used by the corpus''s own Remark-1 pricing with a derivation from a determinant identity,
    and predicts the direction (gain below 3, skewed to small-N1 curves) before measuring
    it.'
