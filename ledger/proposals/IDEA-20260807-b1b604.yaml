idea:
  id: IDEA-20260807-b1b604
  question_id: RQ-VOLC-f6253b
  added: '2026-08-07'
  title: >-
    A SAGE-FREE TOY VOLCANO CERTIFIER AND ITS TWO-DIRECTIONAL NULL: level labels
    from ell-division-polynomial root counting plus Velu plus Fouquet-Morain
    descent for ell in {2, 3}, emitting a re-verifiable path certificate, and
    validated by THREE MUTUALLY INDEPENDENT LABELLERS (isogeny walking, the
    rational ell-torsion criterion, LLL on j) that must agree -- with the
    height-zero class as the null it must fail to label and a CM-descended curve
    as the planted signal it must detect
  class: tooling

  claim: >-
    (A) THE PROBLEM. Every other proposal in lane L2 stratifies a measurement by
    "the volcano level". No code in this repository computes a volcano level:
    grepping harness/ for isogeny construction returns only
    endomorphism_la.py's CM endomorphism phi(x, y) = (zeta_3 x, y), which is an
    endomorphism of ONE curve and not an isogeny between two. Sage is
    unavailable. WITHOUT THIS INSTRUMENT EVERY LEVEL LABEL IN THE LANE IS AN
    ASSERTION, and a stratified null computed from asserted labels is worthless
    in both directions -- it can neither confirm nor refute anything.

    (B) WHAT IS BUILDABLE IN PURE PYTHON, EXACTLY. For ell = 2 the rational
    2-isogeny kernels are in bijection with the roots of x^3 + a x + b in F_p, so
    the count is 0, 1 or 3 and needs only root finding. For ell = 3 the rational
    3-isogeny kernels are in bijection with the roots of
    psi_3 = 3x^4 + 6 a x^2 + 12 b x - a^2 in F_p -- NOTE, roots of psi_3, not
    rational 3-torsion POINTS: a subgroup {O, Q, -Q} is Galois-stable as soon as
    x_Q lies in F_p, since -Q shares that x, and Velu's quantities
    u_Q = 4(x_Q^3 + a x_Q + b) and t_Q = 6 x_Q^2 + 2a then lie in F_p even when
    y_Q does not. Getting this distinction wrong undercounts rational isogenies
    and mislabels the entire volcano, which is exactly why it is written out
    here. Velu then gives the codomain y^2 = x^3 + (a - 5t) x + (b - 7w) with
    t = sum t_Q and w = sum (u_Q + t_Q x_Q) over kernel representatives, and the
    same formulas transport points. FOR ell >= 5 THE KERNEL IS A DEGREE-(ell-1)/2
    FACTOR OF psi_ell RATHER THAN A ROOT, so root finding no longer suffices and
    a factor-search or Kohel-style kernel identification is required; the
    instrument is therefore SCOPED TO ell in {2, 3} with ell = 5 as declared
    future work, and no proposal in this lane may assume ell >= 5 labels exist.

    (C) THE THREE INDEPENDENT LABELLERS, AND WHY THREE. A single instrument that
    is wrong is indistinguishable from a lane with no signal. Three labellers
    with disjoint failure modes are proposed and REQUIRED TO AGREE:
      (L-walk) ISOGENY WALKING. Count rational ell-isogenies at the vertex
        (ell+1 off the floor, 1 at the floor when the height is positive,
        1 + (D_K/ell) when the height is zero), then Fouquet-Morain descent to
        measure the distance to the floor. Fails if Velu is buggy or if the
        kernel count is wrong.
      (L-tors) THE RATIONAL ell-TORSION CRITERION of IDEA-20260807-cbe8c1:
        in a class with ell | c and ell | (m - 1), E(F_p)[ell] is (Z/ell)^2 if and
        only if E is off the ell-floor. Computed from the group structure alone,
        with no isogenies. Fails if the criterion's derivation is wrong or if the
        class condition is misevaluated.
      (L-lll) THE LATTICE DETECTOR of IDEA-20260807-a6fb2a: the minimal degree of
        a small-coefficient integer polynomial annihilating j mod p equals
        h(D_K f^2). Sees the SCALAR conductor, so it cross-checks the product of
        the coordinates rather than any one of them. Fails if the coefficient
        bound or LLL quality is inadequate.
    THE THREE SHARE NO CODE AND NO MATHEMATICAL DEPENDENCY. Pairwise agreement on
    every vertex of a test volcano is the instrument's acceptance criterion, and a
    disagreement is a finding that must be resolved before any L2 measurement is
    trusted -- including, notably, the possibility that cbe8c1's criterion or
    a6fb2a's detector is the thing that is wrong.

    (D) THE NULL, IN BOTH DIRECTIONS, WHICH IS WHAT MAKES THIS A CONTROL AND NOT
    JUST CODE.
      NEGATIVE DIRECTION -- THE HEIGHT-ZERO CLASS. Choose a class with
        v_ell(c) = 0. Then the ell-volcano is a single vertex, there are no levels,
        and the instrument MUST report height 0 and level 0 for every curve, with
        the rational ell-isogeny count equal to 1 + (D_K/ell) in {0, 1, 2} rather
        than ell+1. An instrument that manufactures levels in a height-zero class
        is producing the exact artifact docs/inventor-protocol.md section 3 warns
        about, and every stratified result downstream of it is void.
      NEGATIVE DIRECTION -- THE FOREIGN CURVE. Feed the instrument a curve from a
        DIFFERENT isogeny class (different trace). Every Velu codomain must fail
        the trace check, and the instrument must REFUSE to place the curve rather
        than returning a level. A silent placement is a hard failure.
      POSITIVE DIRECTION -- THE PLANTED SIGNAL. In a class with D_K = -3 (so
        h(D_K) = 1 and the crater is the single curve j = 0) and v_ell(c) >= 3,
        construct the crater curve directly from j = 0 and descend i times by Velu
        for i = 0, 1, 2, 3. The instrument must return level exactly i, for every
        i, by all three labellers. AN INSTRUMENT THAT CANNOT DETECT A PLANTED
        LEVEL IS NOT ENTITLED TO REPORT A NULL, and this program's own
        H-ENDO-001 record already treats a missing planted-positive control as a
        run-invalidating condition rather than a negative.

    (E) THE CERTIFICATE. Every level label ships with a re-verifiable artifact per
    docs/claims-and-verification.md: the ordered path of (a, b) pairs from E to a
    floor vertex, each step carrying its kernel polynomial, its claimed direction,
    the codomain trace, and the transported images of P and Q. An INDEPENDENT
    verifier -- sharing no code with the labeller -- recomputes every Velu step,
    checks every trace equals t, checks every transported point lies on its
    codomain, checks order(P) = N throughout, and checks the terminal vertex has
    exactly one rational ell-neighbour. Verification is O(h) Velu steps against
    O(ell h^2) to produce, so the certificate carries a real asymmetry
    (IDEA-20260807-4f43ac measures it).

  resource_label: 'audit: consumes no resource (instrument for acquiring R3/R4 labels)'
  admissibility: admissible
  admissibility_argument: >-
    An instrument consumes no resource and mounts no attack. It computes curve-only
    data -- isogeny counts, codomain equations, group structure, j-invariant
    relations -- and touches G only to TRANSPORT (P, Q), which by
    IDEA-20260807-5cabfc is an isomorphism on G and therefore confers nothing. The
    instrument is admissible for the same reason it is useless as an attack: it is
    entirely about curves.

  discriminated_from:
    - >-
      harness/endomorphism_la.py. That module computes a CM ENDOMORPHISM
      phi(x, y) = (zeta_3 x, y) on a single j = 0 curve. It never leaves the curve
      and constructs no isogeny. Nothing in it is reusable here beyond the curve
      arithmetic in harness/toycurve.py.
    - >-
      IDEA-20260807-bb03d3 (B-rough ascent). That record is an ALGORITHM with a
      cost model and a normal-form claim; it CONSUMES this instrument. This record
      is the instrument plus its validation protocol. They are separated so that a
      failure of the algorithm's cost claim does not invalidate the labels, and a
      failure of the labels does not spuriously refute the algorithm.
    - >-
      IDEA-20260807-a6fb2a and IDEA-20260807-cbe8c1. Each contributes ONE of the
      three labellers. This record's contribution is the DEMAND THAT THEY AGREE,
      which neither of them can make about itself, plus the two-directional null
      and the certificate format. Cross-validation between records is the only way
      this lane gets trustworthy labels, and it costs nothing beyond running all
      three.
    - >-
      EXP-ECTD-9e4248 (approved, per DEC-20260806-160175). Its assumption list
      includes "Conductor and endomorphism-ring index are computed correctly from
      each curve's own (a, b, p) via Kohel-style volcano identification" and
      "Vertical isogenies of prime degree q are constructed via Velu's formulas
      and independently verified to preserve the group order N" -- i.e. it assumes
      precisely this instrument, at prime q >= 17 where the kernel is NOT a root of
      a division polynomial and this record's ell in {2,3} scope does not reach.
      That gap is worth flagging to the Coordinator: the approved experiment needs
      a harder instrument than this one supplies, and this record does not claim to
      supply it.

  object_first_candidate:
    tracked_object: >-
      THE CERTIFIED LEVEL LABEL (E, ell, i, h, path, verifier verdict) -- the
      instrument's output, tracked as a first-class artifact rather than as a
      number attached to a row of a results table.
    lossiness: >-
      LOSSY: the label discards j, (a, b), the horizontal position and the group.
      It is not a change of coordinates -- the fibre over a label is the whole
      Cl(O_f)-orbit. COMPATIBILITY: the label's propagation under an isogeny step
      is fully specified (+/- 1 in one coordinate, 0 in others), which is what
      makes it a legitimate tracked object rather than a bookkeeping tag, and which
      is what the certificate attests to step by step.
    propagation: >-
      Deterministic and verifiable per step, which is the entire design goal: the
      certificate exists precisely so that the propagation is checkable by a party
      that did not compute it.
    survival_score: >-
      Survives for ell in {2, 3} at any height reachable within budget; dies at
      ell >= 5 where kernel identification is no longer root finding, and dies at
      large p where point counting to get t becomes the binding cost. Both death
      points are stated as scope limits rather than discovered later.

  mechanism: >-
    STEP 1 -- CURVE AND CLASS SETUP. Extend harness/toycurve.py with: j-invariant
    computation, curve-from-j construction (with j = 0 and j = 1728 handled
    separately for their extra twists), quadratic twist, and the trace t from the
    existing order routines.
    STEP 2 -- HEIGHTS WITHOUT FACTORING. Implement
    v_ell(c) = floor(v_ell(t^2 - 4p)/2) for odd ell and the 2-adic case split, per
    IDEA-20260807-3c6bd8, and mass-check it against full factorization at toy
    scale. This gives the volcano height before any isogeny is built.
    STEP 3 -- KERNELS AND VELU. Root finding for x^3 + a x + b (ell = 2) and psi_3
    (ell = 3) over F_p via sympy; Velu codomain and point images as in claim (B).
    VALIDATION, mandatory before any label is emitted: (i) every codomain has trace
    exactly t; (ii) phi-hat composed with phi acts as multiplication by ell on ten
    random points; (iii) transported points satisfy the codomain equation;
    (iv) order(phi(P)) = N.
    STEP 4 -- LEVEL BY DESCENT. Count rational ell-isogenies; if the count is 1 and
    the height is positive, the vertex is the floor. Otherwise walk down, at each
    step excluding the edge just traversed, until a dead end; the number of steps
    is h - i, giving i. Emit the path as the certificate.
    STEP 5 -- THE OTHER TWO LABELLERS. Implement L-tors (group structure via the
    ell-part of E(F_p), computed by finding the ell-Sylow structure with random
    points at toy scale) and L-lll (a small LLL over the powers of j). Require
    pairwise agreement on every vertex of every test volcano and REPORT THE
    DISAGREEMENT RATE as a headline metric rather than as a footnote.
    STEP 6 -- THE NULLS AND THE PLANT of claim (D), run before the instrument is
    released for use by any other record.
    STEP 7 -- THE INDEPENDENT VERIFIER, written against the certificate format
    only, sharing no functions with the labeller.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Grep tool (ripgrep) on 2026-08-07 over harness/ for
      "velu|Vélu|modular polynomial|Phi_|isogeny" (case-insensitive) and over
      ledger/ and knowledge/ for "Velu", "Fouquet", "division polynomial",
      "kernel polynomial". Read in full: harness/toycurve.py, harness/semaev.py,
      harness/endomorphism_la.py (header and phi code), H-ECTD-19017a,
      EV-ECTD-14f9a2, DECOMPOSITION.md (L14).
    results: >-
      harness/ contains NO isogeny construction; the only "phi" hits are
      endomorphism_la.py's CM endomorphism on j = 0 curves. "Velu" and "Fouquet"
      return ZERO hits in ledger/ and knowledge/. H-ECTD-19017a ASSUMES a Velu
      implementation exists ("Vertical isogenies of prime degree q are constructed
      via Vélu's formulas and independently verified to preserve the group order
      N") and EV-ECTD-14f9a2 records that no experiment has been executed. The
      DECOMPOSITION's L14 lane states the general requirement -- "the instrument
      must fail to detect a signal in a matched random object, and must detect a
      planted signal -- both directions" -- which claim (D) instantiates for
      volcano levels specifically.
    verdict: >-
      ADAPTATION. Velu's formulas, division polynomials and Fouquet-Morain descent
      are classical; no novelty is claimed for any of them. What is new to this
      repository is that the code does not exist, that the ell = 3 rational-kernel
      subtlety is written down before it is implemented wrongly, and that three
      independent labellers are required to agree rather than one being trusted.

  null_object_control: >-
    THE NULLS ARE THE PROPOSAL, so they are listed as first-class deliverables
    rather than as an afterthought.
    (N1) HEIGHT-ZERO CLASS: v_ell(c) = 0. Instrument must report height 0, level 0,
      and an isogeny count of 1 + (D_K/ell) in {0, 1, 2}. Manufacturing levels here
      voids every stratified result in the lane. BLOCKING.
    (N2) FOREIGN CURVE from a different class: every codomain fails the trace
      check and the instrument REFUSES. A silent placement is a hard failure.
      BLOCKING.
    (N3) PLANTED SIGNAL: a CM-constructed crater (j = 0 at D_K = -3) descended i
      times; the instrument must return level i for i = 0..3 by all three
      labellers. BLOCKING -- without it, no null this instrument produces may be
      cited.
    (N4) SUPERSINGULAR INPUT (t = 0): must be detected and rejected, since the
      ordinary volcano theory does not apply and End(E) is non-commutative.
    (N5) THREE-LABELLER DISAGREEMENT RATE: reported as a headline metric. A rate
      above 5 percent means the lane has no reliable labels.
    DECAY PARAMETER for the instrument's own validation: the volcano height h. The
    instrument's ability to distinguish levels must IMPROVE with h (more levels to
    tell apart) and must vanish identically at h = 0. An instrument whose reported
    level distribution looks the same at h = 0 and h = 3 is broken in the most
    basic possible way and the test costs minutes.

  assumptions:
    - >-
      Kohel's stratification and the rational-isogeny counts per level
      (ell+1 off the floor; 1 at a floor of positive height; 1 + (D_K/ell) when
      the height is zero). RECALLED, UNVERIFIED (KN-LIT-360, not read). THE
      INSTRUMENT'S FIRST JOB IS TO CHECK THIS EMPIRICALLY on an enumerated toy
      class rather than to assume it, and a mismatch is a finding about the
      recalled theorem's statement, not a bug to be patched away.
    - >-
      Velu's formulas as written in claim (B). Standard; validated by the dual
      isogeny check in Step 3.
    - >-
      Rational 3-isogeny kernels correspond to roots of psi_3 in F_p, with y_Q not
      required rational. Derived in claim (B) and checked by comparing counts
      against the enumerated class.
    - >-
      sympy root finding over F_p is exact at toy scale. Checked by substituting
      each claimed root back.
    - >-
      Point counting for t is the dominant cost at toy scale: O(p) naive or
      O(sqrt p) by Hasse search in harness/toycurve.py. This caps p at about 2^16
      for class enumeration and is the instrument's real budget constraint, stated
      up front.
    - >-
      ell >= 5 is OUT OF SCOPE. Any lane record needing an ell >= 5 label must say
      so and treat it as unavailable.

  proof_search_map:
    bottleneck: >-
      Kernel identification. At ell in {2, 3} it is root finding and is trivial; at
      ell >= 5 it is a factor search in psi_ell of degree (ell^2-1)/2 and is the
      exact step that stops the instrument. Removing it -- for instance via Kohel's
      kernel-polynomial algorithm or precomputed modular polynomials -- is what
      would extend the instrument's range, and would also be what
      EXP-ECTD-9e4248's q >= 17 design requires.
    baseline_embedding:
      parameter_slice: >-
        The height-zero class is the degenerate slice: the instrument must reduce
        to "count rational ell-isogenies, report 1 + (D_K/ell), report no levels".
        The j = 0, D_K = -3 crater is the classical slice with a known answer.
      reproduction_check: >-
        Frozen fixture: a specific (p, t, ell) with a hand-verified volcano, all
        vertices enumerated, all levels assigned by hand, committed as a regression
        file. The instrument must reproduce it exactly, forever.
    observation_collision:
      observable: >-
        The rational ell-isogeny count at a vertex.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, which is why walking is needed at all:
        every non-floor level has the SAME count ell+1, so the count alone cannot
        distinguish level 0 from level 1. The collision is intrinsic and it is
        precisely what Fouquet-Morain descent resolves. Naming it here prevents the
        cheaper-but-wrong instrument -- "count the neighbours and call that the
        level" -- from being built.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "the level" as an asserted attribute by "a verified path to the
          floor" as an artifact, so that a level claim becomes an exact statement
          about a checkable object rather than about a computation nobody can
          re-run.
        predicted_gain: >-
          Every downstream stratified result becomes independently auditable at
          O(h) Velu steps per label, and a mislabelled curve becomes detectable by
          a reviewer rather than only by the original author.
      - transform: stronger_invariant
        proposed_object: >-
          Store the whole level VECTOR and the whole certified path set, not the
          single ell being studied, since the extra coordinates cost almost nothing
          to compute and are exactly what IDEA-20260807-a2b59a's factorial needs.
        predicted_gain: >-
          The factorial control becomes runnable on already-collected data rather
          than requiring a second pass.
    quantifier_order: >-
      CLAIMED: FORALL ordinary toy curves E with ell in {2, 3} and a computable
      trace, THERE EXISTS a certified level label produced in O(ell h^2) Velu steps
      and verifiable in O(h), such that all three labellers agree.
      NOT CLAIMED: that the instrument works for ell >= 5, for supersingular
      curves, or at crypto scale. Each exclusion is enforced by an explicit
      refusal rather than by silence.
    method_ceiling:
      strongest_certifiable_claim: >-
        "This curve is at level i of the ell-volcano of this class, and here is a
        path to the floor that anyone can re-verify." It can never certify anything
        about the difficulty of the ECDLP on that curve, and a level certificate
        must never be presented as an attack artifact.
      nearby_object_control: >-
        A SUPERSINGULAR CURVE over F_p. Its endomorphism ring is non-commutative,
        the volcano picture does not apply, and the instrument must refuse rather
        than emit a plausible-looking level. A tool that happily labels a
        supersingular curve has not identified the structure it claims to measure.
    proof_obligations:
      - claim: Rational ell-isogeny counts per level match Kohel.
        responsibility: baseline
      - claim: Rational 3-kernels are roots of psi_3 with y_Q possibly irrational.
        responsibility: correctness
      - claim: Velu codomains have trace t and the dual composes to [ell].
        responsibility: correctness
      - claim: Fouquet-Morain descent returns the true distance to the floor.
        responsibility: correctness
      - claim: The three labellers agree on every vertex of the fixture.
        responsibility: soundness
      - claim: The instrument refuses foreign and supersingular inputs.
        responsibility: soundness
      - claim: The planted level is recovered for i = 0..3.
        responsibility: success_probability
      - claim: Verification costs O(h) against O(ell h^2) to produce.
        responsibility: runtime
      - claim: ell >= 5 is out of scope and refused.
        responsibility: scope

  predictions:
    - metric: >-
        rational ell-isogeny counts per vertex on a fully enumerated toy class,
        against Kohel's predicted pattern
      direction: different
      minimum_effect: >-
        100 percent match. A mismatch is either a bug or a misstatement of the
        recalled theorem, and the two must be separated before proceeding, not
        after.
    - metric: >-
        per-level vertex counts against h(D_K f^2)
      direction: different
      minimum_effect: >-
        Exact equality at every level. This ties the instrument to the class-number
        formula already machine-checked at 180 cells in IDEA-20260805-38aebb and is
        the strongest single check available.
    - metric: >-
        three-labeller pairwise disagreement rate over the fixture
      direction: lower
      minimum_effect: >-
        Below 1 percent for release; above 5 percent means the lane has no usable
        labels and every stratified proposal is blocked until it is resolved.
        Reporting this number is mandatory in every downstream record that uses a
        level label.
    - metric: >-
        instrument output on the height-zero null (N1)
      direction: different
      minimum_effect: >-
        Height 0 and level 0 on 100 percent of vertices, with isogeny counts in
        {0, 1, 2}. A single reported level > 0 voids the instrument.
    - metric: >-
        recovered level on the planted CM-descended curve (N3)
      direction: different
      minimum_effect: >-
        Exactly i for i = 0, 1, 2, 3, by all three labellers. Failure means the
        instrument cannot detect a level that is there by construction, and NO NULL
        FROM IT MAY BE CITED.
    - metric: >-
        certificate verification time against label production time
      direction: lower
      minimum_effect: >-
        At least 3x cheaper at h >= 2. If not, the certificate is not carrying its
        asymmetry and IDEA-20260807-4f43ac's claim (A) is weakened.

  minimal_test:
    design: >-
      STAGE 1 (days of implementation): Velu for ell in {2, 3} with the four
      validation checks. This is the batch's critical path and every other L2
      proposal that touches curves waits on it.
      STAGE 2 (hours): the frozen fixture -- one hand-verified volcano, committed
      as a regression file, never edited.
      STAGE 3 (hours): the three labellers and their agreement rate.
      STAGE 4 (hours): all five nulls, N1-N5, with N1, N2, N3 blocking.
      STAGE 5 (hours): the independent verifier, written from the certificate
      format alone by someone who has not read the labeller.
      RELEASE GATE: the instrument is not usable by any other record until N1, N2,
      N3 pass and the disagreement rate is below 1 percent.
    controls:
      - height-zero class (N1, blocking)
      - foreign curve from another class (N2, blocking)
      - planted CM-descended level (N3, blocking)
      - supersingular input (N4)
      - three-labeller cross-agreement (N5)
      - dual-isogeny check on ten random points per edge
      - per-level counts against h(D_K f^2)
      - the frozen fixture as a permanent regression test
    required_metrics:
      - rational ell-isogeny count per vertex
      - assigned level and height per vertex, per labeller
      - pairwise labeller disagreement rate
      - per-level vertex counts against the class-number formula
      - Velu validation pass rate (trace, dual, on-curve, order)
      - certificate size, production time, verification time
      - refusal rate on N2 and N4 inputs (must be 100 percent)

  falsification_conditions:
    - >-
      Rational isogeny counts not matching Kohel's pattern on an enumerated class.
      Either the implementation or the recalled theorem statement is wrong; the
      lane stops until it is known which.
    - >-
      The instrument assigning nonzero levels in the height-zero null. It
      manufactures structure; every stratified result downstream is void.
    - >-
      The instrument placing a foreign or supersingular curve instead of refusing.
      Same disposition.
    - >-
      Failure to recover the planted level. The instrument cannot see a level that
      is there; no null it produces may be cited, and this is an instrument
      failure rather than a mathematical negative (AGENTS.md rule 5).
    - >-
      Three-labeller disagreement above 5 percent. At least one of walking, the
      torsion criterion, or the lattice detector is wrong -- which would be a
      substantive finding against IDEA-20260807-cbe8c1 or IDEA-20260807-a6fb2a and
      must be reported as such rather than resolved by majority vote.

  confounders:
    - >-
      j = 0 AND j = 1728 have extra automorphisms and extra twists, so
      curve-from-j and twist bookkeeping differ there. Since the planted-signal
      control USES j = 0, this is not a corner case but the main path, and it must
      be handled explicitly and tested.
    - >-
      2-TORSION IN VELU. A kernel point of order 2 has y = 0 and is its own
      negative, so the representative-set convention differs from the odd case.
      Getting it wrong silently produces a curve that is not 2-isogenous, which the
      trace check catches only if the trace happens to differ.
    - >-
      At toy p the volcano height is often 0 or 1, so a fixture with h >= 3 may
      require searching many traces. The search cost is reported, and a fixture with
      h < 2 cannot validate the descent logic at all.
    - >-
      The three labellers are independent in their mathematics but will share the
      same trace t and the same curve arithmetic. A bug in harness/toycurve.py's
      point counting corrupts all three identically and the agreement check would
      not catch it. An independent trace check -- for instance verifying
      #E * random point = O for two independent points -- is therefore mandatory
      and is separate from the three-labeller agreement.
    - >-
      L-tors requires the class condition ell | (m - 1); in classes where it fails,
      that labeller is simply unavailable and the agreement check degrades to two
      labellers. The availability rate must be reported.

  interpretation_limits:
    - >-
      This is an instrument. It produces no mathematical result and its outputs are
      labels and certificates, never evidence about the ECDLP.
    - >-
      Scoped to ell in {2, 3}, ordinary curves, p up to about 2^16. It does NOT
      supply what EXP-ECTD-9e4248 assumes at q >= 17, and that gap is flagged
      rather than papered over.
    - >-
      A clean set of nulls does not make downstream results correct; it makes them
      interpretable. The distinction is the whole content of
      docs/inventor-protocol.md section 3.
    - >-
      Recalled statements (Kohel's counts, Velu's formulas) are checked at toy
      scale only. Agreement there is not a proof of the general theorem.

  reachability_gate: >-
    THE INSTRUMENT IS WHAT MAKES REACHABILITY MEASURABLE RATHER THAN ASSERTED. Every
    reachability claim in this lane -- IDEA-20260807-bb03d3's O(B^2 log^2 p) ascent,
    IDEA-20260807-cbe8c1's "off-floor is detected in one step",
    IDEA-20260807-a2b59a's cell population -- is a claim about walks in a graph this
    instrument constructs. Without it those claims are untested cost models. With
    it, each becomes a measured step count with a certificate. The instrument itself
    needs to reach nothing: it enumerates neighbours locally and never searches for
    a specified curve, so it never touches the hard side of T5.

  target_complexity:
    time_exponent: >-
      NO ATTACK, NO EXPONENT. Instrument costs: root finding O(ell log^2 p) per
      vertex; Velu O(ell) field operations per edge; descent O(ell h) edges per
      level identification and O(ell h^2) per label; verification O(h). Dominating
      everything at toy scale is the trace computation, O(p) naive or O(sqrt p) by
      Hasse search in the current harness, and that is stated as the binding cost
      rather than omitted because it is uninteresting.
    memory_exponent: >-
      O(h) curves per certificate; O(sqrt p) curves if a whole class is enumerated.
      Negligible.
    best_known: >-
      Sage and Magma implement all of this and more, at every ell, with SEA point
      counting. THIS INSTRUMENT IS STRICTLY WORSE THAN THE STANDARD TOOLS IN EVERY
      RESPECT EXCEPT AVAILABILITY, and that is the honest comparison: it exists
      because the harness constraint is pure Python with sympy and numpy, not
      because it improves on anything.
    hidden_overhead: >-
      Disclosed: (i) trace computation dominates and caps p; (ii) ell >= 5 is not
      supported and the lane must not assume otherwise; (iii) L-tors is unavailable
      in classes failing its class condition; (iv) the three labellers share the
      trace computation, so an independent trace check is required on top of their
      agreement.
    tradeoff_note: >-
      Not a cryptanalytic tradeoff. The engineering tradeoff is real and stated:
      three labellers cost roughly three times one, and buy the only defence this
      lane has against silently wrong labels.

  dominated_by: >-
    AS AN ATTACK: mounts none; dominated on every axis by parallel rho at
    0.886 sqrt(N) time and O(1) memory (KN-TECH-001, KN-TECH-006), by
    automorphism-discounted rho (KN-TECH-018), by BSGS at 2 sqrt(N) time and
    sqrt(N) memory (KN-TECH-031), and by toy Semaev index calculus
    (KN-FIND-f8c290). Checked across time, memory and data/queries.
    AS A TOOL: strictly dominated by Sage and Magma on every axis except
    availability in this harness. Stated plainly rather than dressed up. Within the
    harness's constraints it is not dominated, because nothing here computes an
    isogeny at all.
  sota_delta: >-
    Zero speedup against any attack baseline. Instrument delta, stated as numbers:
    converts N asserted level labels into N certified ones at O(ell h^2) Velu steps
    each and O(h) to verify; supplies three independent labellers where the lane
    currently has zero; and supplies the two-directional null (height-zero class,
    planted CM descent) without which no L2 negative is citable under
    docs/inventor-protocol.md section 3. Against Sage the delta is negative on every
    axis and the record says so.

  estimated_cost:
    implementation: high
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.85 that a correct ell in {2, 3} Velu and descent implementation is achieved
    at the stated effort; the named risks are the 2-torsion representative
    convention and the psi_3 rational-kernel subtlety, both written out above
    precisely because they are where implementations go wrong. 0.9 that the
    height-zero and foreign-curve nulls pass once the trace check is in place.
    0.8 that the planted CM-descent control passes. 0.6 that the three labellers
    agree below the 1 percent threshold on the first attempt -- and a disagreement
    is a genuinely informative outcome, since it would falsify either
    IDEA-20260807-cbe8c1's torsion criterion or IDEA-20260807-a6fb2a's lattice
    detector at no extra cost. HIGHEST PRIORITY ON THE CRITICAL PATH: five of the
    nine proposals in this lane cannot produce an interpretable number without it.

