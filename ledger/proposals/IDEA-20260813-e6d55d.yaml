idea:
  id: IDEA-20260813-e6d55d
  question_id: RQ-QALG-74bf20
  goal_id: GOAL-QALG-001
  added: '2026-08-13'
  proposed_by: idea-generator
  status: proposed
  title: >-
    Zero-noise specialization of Simon 2026's Hadamard-erasure DCP mechanism
    against CSIDH-scale exact dihedral coset instances
  class: algorithm

  claim: >-
    Whether Simon 2026's (KN-LIT-e204ab) claimed noise-tolerant erasure
    mechanism for the Dihedral Coset Problem, specialized to the zero-fault-rate
    limit a(n) -> infinity (exactly the error-free regime CSIDH's class-group
    hidden-shift instances present), (i) remains a well-defined instantiation of
    the paper's own stated theorem and proof sketch rather than an extrapolation
    beyond its proven parameter range, and (ii) if so, yields a concrete
    time/query cost at CSIDH-standardized class-group orders (log2(N)
    approximately 256 to 9000 bits, per SQALE KN-LIT-129) smaller than the best
    published Kuperberg-type sieve's own concretely re-derived
    2^{O(sqrt(log N))} figure at the same order. Both (i) and (ii) are
    open, unresolved questions this proposal is designed to audit, not assumed
    conclusions.

  mechanism: >-
    In the error-free limit every DCP sample is a valid Regev-form coset
    state. Simon's construction (KN-TECH-d1bc4f) partitions Q = k*n^{c+1}
    samples into groups of c*log(n), Hadamard-measures the b_i register of
    each group, discards groups with nonzero measurement outcome, and
    reconstructs a phase-carrying bit h* from the surviving groups' partial
    subset sums. Because no sample is faulty in this limit, the
    faulty-sample bookkeeping the proof relies on collapses to a degenerate
    case; the discriminating question is whether the paper's own stated
    theorem covers a(n)=infinity as an included boundary case of "up to
    1/O(log n)" noise tolerance, or whether some step (e.g. the corollary's
    rescaling argument, or the unquantified bias claim flagged in
    KN-LIT-e204ab) implicitly requires a nonzero noise rate to close.

  novelty_status: unverified
  novelty_screen: >-
    crypto-kb MCP tools were not available in this session's tool set (see
    retrieval-screen.yaml); WebSearch returned a backend model error on every
    query attempted this session (see retrieval-screen.yaml) and could not be
    used either. Screening therefore rests on direct grep of knowledge/ and
    ledger/proposals/ (a fresh grep found no prior RQ-QALG-74bf20 filings and
    no KN-* entry addressing this specific specialization) plus the two most
    relevant corpus entries read in full, KN-LIT-e204ab and KN-TECH-d1bc4f,
    both of which explicitly flag the CSIDH noise-free application as
    unassessed: "a genuine advance on DCP would have to be assessed against
    CSIDH-type targets too, where the noise-free Kuperberg regime is the
    relevant one" (KN-TECH-d1bc4f). This proposal is exactly that assessment.
    Absence of a corpus hit is not treated as evidence of novelty; novelty
    remains unverified pending an actual literature/web check this session
    could not perform.

  assumptions:
    - >-
      Simon 2026's construction (KN-LIT-e204ab) is treated as an unverified,
      three-day-old preprint whose load-bearing Lemma 3 is a sketch; this
      proposal does not attempt to verify Lemma 3 itself, only to check
      whether the zero-noise specialization is a legitimate instance of the
      paper's own stated claim and whether it would be practically relevant
      if Lemma 3 later verifies.
    - >-
      CSIDH's hidden-shift instance (via the Childs-Jao-Soukharev reduction,
      KN-LIT-071) supplies exact, error-free coset samples, matching the
      a(n)=infinity limit exactly.

  proof_search_map:
    bottleneck: >-
      The exact step whose resolution decides the proposal: does measuring
      x2 have an analogue here -- more precisely, does Simon's Lemma 3
      ("well-behaved" phase-cancellation across A-side subset sums) and its
      corollary's rescaling from failure probability O(2^-n) to O(1/n)
      remain valid, and does Lemma 1's group-count derivation (a = n/log n
      expected all-zero groups, requiring k>=c) still hold, when a(n) is
      taken to infinity rather than left finite -- since some of these bounds
      may implicitly assume a nonzero faulty-sample fraction contributes to
      a counting argument that the zero-noise case does not supply.
    baseline_embedding:
      parameter_slice: >-
        Kuperberg's original sieve (KN-LIT-2c8264), 2^{O(sqrt(log N))} time
        and query count, error-free samples, is the exact old-method
        boundary; N is CSIDH's class-group order at standardized parameter
        sets per SQALE (KN-LIT-129), itself requiring independent
        re-derivation before being adopted as a number, per this RQ's own
        constraints.
      reproduction_check: >-
        Not performed this session (no implementation authorized). Required
        before Coordinator-approved compute: symbolically re-derive
        Kuperberg's own stated time/query formula 2^{c*sqrt(log2 N)} with
        its published constant c, cross-checked against Peikert's classical
        simulator experiments (KN-LIT-127) at the group orders actually run
        there, not adopted from memory.
    observation_collision:
      observable: >-
        The recovered bit h* (Simon's construction) and the recovered
        coset-representative label c mod N (Kuperberg's sieve) are the same
        abstract certificate: the shift value d mod N solving the CSIDH
        secret-key-recovery hidden-shift instance.
      distinct_preimage_search: >-
        On a toy dihedral instance (small N, exhaustively enumerable),
        search for two DISTINCT true shift values d, d' for which the
        zero-noise-specialized construction, run to completion on
        independently sampled coset states for each, reports the SAME h*
        sequence -- a direct falsifier of identifiability, independent of
        any noise-tolerance question. (A mere disagreement between Simon's
        and Kuperberg's recovered labels on the same sample set is expected
        and uninformative by itself, since the two constructions are not
        obviously the same computation under a change of coordinates.)
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Rewrite Simon's b_i-erasure construction as a statement over
          Z_2^Q parameterized by a(n) as a free real parameter, so
          a(n) -> infinity is an explicit limit of a family of theorems
          rather than a separately argued special case.
        predicted_gain: >-
          If the limit is well-defined and the failure-probability bound
          remains o(1) as a(n) -> infinity, the reduction chain converts the
          paper's finite-noise theorem into a corollary at a(n)=infinity
          with no new proof obligations; if the limit is singular (a term
          diverges), that is a clean, cheap, symbolic falsifier.
    quantifier_order: >-
      As stated by Simon 2026: for all n, for all fixed noise-tolerance
      target a(n) <= O(log n), there exists a sample complexity Q(n,a) and a
      measurement procedure recovering d_n with probability significantly
      greater than 1/2. This proposal requires: for all n in the
      CSIDH-relevant range [256, 9000], in the a(n) -> infinity limit, does
      the SAME existential Q(n) and procedure exist with failure probability
      o(1) -- i.e. is the witness uniform across the noise-rate parameter, or
      does a smaller a(n) supply structure (e.g. a nonzero rate of
      genuinely-random samples used in a counting argument) that the
      zero-noise limit removes, making the existential claim false exactly
      at the boundary this proposal needs.
    method_ceiling:
      strongest_certifiable_claim: >-
        At best, if every step specializes cleanly, this could certify an
        unconditional o(1)-error polynomial-time (in n = log2 N) algorithm
        for the exact dihedral hidden-shift problem underlying CSIDH -- a
        genuine exponent-moving replacement for Kuperberg's
        2^{O(sqrt(log N))} sieve, since Theta(n^13) polynomial versus
        2^{Theta(sqrt n)} subexponential is a change in functional form,
        not a constant-factor gain.
      nearby_object_control: >-
        Apply the identical specialization to a toy dihedral group with
        log2 N <= 24 (within RQ-QALG-74bf20's own toy-instance discipline),
        where both Simon's zero-noise construction and Kuperberg's sieve can
        be run by direct classical simulation (Peikert's classical-simulator
        methodology, KN-LIT-127, is the precedent instrument). If the
        zero-noise construction's sample-complexity floor (Q >= 12*n^13 at
        the paper's own stated minimal c=k=12) already exceeds Kuperberg's
        simulated cost at this toy size by many orders of magnitude, that is
        the nearby-object control showing the method's ceiling is not
        reached at any size this program can simulate, and the crossover
        point (if any) must be computed symbolically, not simulated.
    proof_obligations:
      - claim: >-
          The zero-noise limit of Simon's construction is a legitimate
          specialization of the paper's own stated theorem, not an
          extrapolation beyond its proven range.
        responsibility: scope
      - claim: >-
          Lemma 1's group-count / sample-budget arithmetic remains valid
          and a(n)-independent.
        responsibility: size
      - claim: >-
          The failure-probability bookkeeping (Lemma 4 plus the flagged n
          versus n^{3/2} amplitude-bound discrepancy in KN-LIT-e204ab)
          closes at c>=12 for a(n)=infinity with the same or better constant.
        responsibility: success_probability
      - claim: >-
          The resulting complexity Q(n)=12*n^13, evaluated at n=log2(N) in
          [256,9000], is smaller than Kuperberg's concretely re-derived cost
          at the same N.
        responsibility: runtime
    not_applicable_reason: null

  predictions:
    - metric: >-
        recovered-bit success bias of the zero-noise-specialized Simon
        construction on toy CSIDH-shaped dihedral instances (log2 N <= 24)
      direction: higher
      minimum_effect: >-
        bias >= 1/n above 1/2 (any inverse-polynomial bias keeps the
        recursion polynomial per KN-LIT-e204ab's own accounting); explicitly
        predicted as UNRESOLVED by symbolic audit alone since Lemma 3 is the
        load-bearing unverified step -- the minimal test's job is to
        determine whether the bias survives specialization, not to assume it.
    - metric: >-
        crossover order N* at which 12*n^13 (Simon zero-noise sample floor,
        n=log2 N) first drops below Kuperberg's concrete cost at the same N
      direction: lower
      minimum_effect: >-
        N* predicted to fall far ABOVE any standardized CSIDH parameter
        (galactic-algorithm regime); this is a directional prediction
        falsified if N* falls inside the [2^256, 2^9000] class-group-order
        range this program's target parameters actually use.

  minimal_test:
    design: >-
      Two-stage audit, no cryptographic-scale computation. Stage 1
      (symbolic): re-derive Simon's Lemma 1, Lemma 4, and the final assembly
      bookkeeping as functions of a(n), take the a(n) -> infinity limit
      termwise, and record whether every term remains finite and whether the
      stated failure-probability bound remains o(1). Stage 2 (toy
      simulation, log2 N <= 24): using Peikert's classical-simulator
      methodology as precedent instrument, simulate Simon's zero-noise
      construction at its minimal stated parameters (c=k=12) against
      Kuperberg's sieve on the same toy instances, and separately compute the
      crossover order N* between 12*n^13 and Kuperberg's re-derived
      concrete-cost formula.
    controls:
      - >-
        Kuperberg's sieve itself, run on the identical toy instances, as a
        positive control that the harness is correctly implemented.
      - >-
        Simon's construction unspecialized, at a stated finite a(n) matching
        the paper's own worked parameters, as a second positive control that
        the harness reproduces the paper's claimed behavior before
        specializing to a(n)=infinity.
      - >-
        A null instance: d fixed but coset samples corrupted with a
        return-random-state oracle at a known, high rate, confirming the
        harness reports failure where failure is expected.
    required_metrics:
      - per-sample-group all-zero measurement rate versus Lemma 1's predicted a = n/log n
      - empirical bias of the recovered h* bit versus the predicted >= 1/n floor
      - crossover order N* (symbolic, from the closed-form comparison, not simulated)
      - Kuperberg-sieve re-derived concrete cost at the same toy N, from this session's own reproduction

  falsification_conditions:
    - >-
      The a(n) -> infinity limit of any term in Simon's stated bounds
      diverges or requires a(n) bounded above by a finite quantity, placing
      the zero-noise case outside the paper's own proven range -- this
      falsifies the specialization without evaluating Lemma 3 at all.
    - >-
      On toy instances the zero-noise-specialized construction's measured
      bias is statistically indistinguishable from 1/2 under the paper's own
      stated minimal parameters (c=k=12), matching a same-shape null.
    - >-
      The symbolic crossover order N* exceeds every standardized CSIDH
      parameter (256 to 9000 bits) by more orders of magnitude than any
      credible parameter growth this program tracks, closing the practical
      relevance of the mechanism even if Lemma 3 eventually verifies.

  confounders:
    - >-
      KN-LIT-e204ab's own re-derivation already found an internal
      inconsistency (n versus n^{3/2} amplitude bound) in the finite-noise
      case; any zero-noise finding inherits this ambiguity and must not be
      reported as a clean pass or fail without resolving which bound is
      correct.
    - >-
      Toy-scale simulation cannot distinguish an asymptotically-polynomial-
      but-galactic algorithm from a genuinely non-competitive one; the
      crossover order N* must be computed symbolically, since no simulation
      at n=256..9000 (n^13-scale sample counts) is feasible.
    - >-
      The parent paper is a three-day-old unrefereed preprint with sketched
      proofs; any specialization inherits its base-rate concerns (the Yilei
      Chen 2024 precedent, retracted after roughly ten days) and must not be
      treated as more credible than the parent claim.

  interpretation_limits:
    - >-
      No claim about CSIDH's security level. No claim that Simon's
      construction is correct at any noise rate -- that remains
      KN-LIT-e204ab's open, unverified status.
    - >-
      A toy-scale (log2 N <= 24) result, positive or negative, is
      hypothesis-generating only and is never reported as a statement about
      standardized CSIDH parameters.
    - >-
      If the falsification conditions are not met, that is NOT a positive
      finding of a break; it only clears this proposal for the next-stage
      audit (Lemma 3's own verification, which this proposal explicitly does
      not attempt).

  heuristic_assumptions:
    - id: H1
      statement: >-
        Simon's construction's stated per-recursion-level bias on d_n
        ("significantly greater than 1/2") behaves, in the zero-noise
        limit, like an unconditionally bounded-away-from-1/2 Bernoulli bias
        whose deviation is Omega(1/n), uniformly for n in [256, 9000]
        class-group-order bit-lengths.
      rigorous_support: >-
        Imitates the style of Lemma 3's corollary in KN-LIT-e204ab (an
        unproved "well-behaved" phase-cancellation bound); there is no
        independent rigorous bound in this corpus to compose it with -- H1
        is explicitly a placeholder assumption pending Lemma 3's own
        resolution, not a derived heuristic in the Wesolowski A2 sense, and
        is disclosed as such rather than dressed up as one.
      validation_plan: >-
        Sample toy dihedral instances at log2 N in {8,12,16,20,24} (the
        largest sizes at which both mechanisms can be classically simulated
        within this program's compute budget), measure the empirical bias of
        h* across at least 10^4 independent random d and sample-ordering
        seeds per size, and compare against the predicted Omega(1/n) floor
        with an explicit tail check (does the WORST observed bias across
        seeds still exceed the predicted floor, not just the average).
        Record whether the bias trend as n grows is consistent with
        Omega(1/n) or decays faster, which would directly falsify H1's
        extrapolation to CSIDH-scale n.

  target_complexity:
    time_exponent: >-
      Claimed conditionally on H1 and on Lemma 3 eventually verifying:
      poly(n) = O(n^13) time and query count, n = log2(N) -- an
      exponent-moving claim relative to Kuperberg's 2^{O(sqrt(n))}. Whether
      this is achievable is exactly what the falsification conditions above
      test; it is NOT yet audited.
    memory_exponent: >-
      O(n^13) qubits/classical storage for the sample set (same order as the
      query count); no claimed memory reduction over Kuperberg's sieve.
    best_known: >-
      2^{O(sqrt(log N))} time and query (Kuperberg's sieve, KN-LIT-2c8264),
      with the collimation-sieve variant (KN-LIT-127) achieving the same
      time order with exponentially reduced quantum memory.
    hidden_overhead: >-
      O(n^13) is polynomial but with a very large fixed exponent (c>=12
      required by the paper's own stated condition k>c) -- the predicted
      galactic-algorithm risk above. Kuperberg's own o(1) additionally hides
      a genuinely superpolynomial term per target-result-profile.md A8, so
      an honest comparison requires the concrete-cost table this proposal's
      minimal_test stage 2 is designed to produce, not the two asymptotic
      forms alone.
    tradeoff_note: >-
      No time-memory tradeoff is proposed here; both mechanisms are compared
      at their own reported operating points. If Simon's mechanism survives
      the audit, its usefulness is entirely determined by the crossover
      order N*, which is why the minimal test computes it explicitly rather
      than reporting the asymptotic comparison alone.

  estimated_cost:
    implementation: medium
    compute: low

  recommended_priority: high

  dominated_by: >-
    Kuperberg's dihedral-HSP sieve (KN-LIT-2c8264), 2^{O(sqrt(log N))} time
    and query, error-free samples -- and its collimation-sieve
    generalization with exponentially reduced quantum memory at the same
    time order (Peikert 2020, KN-LIT-127) -- dominate this proposal on every
    checked axis (time, memory, and maturity/verification status) as of
    this session: this proposal is an unimplemented, unverified
    specialization of a three-day-old unrefereed preprint whose own
    load-bearing lemma (Lemma 3) is explicitly flagged as an unverified
    sketch. No row of the CSIDH-relevant frontier known to this corpus
    (Kuperberg 2005, Peikert 2020 c-sieve, Bonnetain-Schrottenloher 2020,
    SQALE 2022) is dominated by this proposal at present.

  sota_delta: >-
    0x / no measured improvement. No experiment has been run under this
    proposal. The only quantitative content available pre-audit is the
    structural comparison of functional forms (O(n^13) polynomial versus
    2^{O(sqrt n)} subexponential), favorable in the limit n -> infinity but
    explicitly flagged above as likely to fall in a galactic-algorithm
    regime at CSIDH's actual parameter range (n in [256, 9000]); the minimal
    test's crossover computation is required before any numeric sota_delta
    can be stated.

