idea:
  id: IDEA-20260816-4ea533
  question_id: RQ-POLYMAC-7c89e4
  added: '2026-08-16'
  title: 'Build the paired exhaustive forgery oracle as the deliverable and measure its own validity:
    a field-size ladder that tests whether the measured-to-bound ratio is scale-invariant, because
    if it is not, every scaled-down analogue in this campaign is disqualified from extrapolation and
    that disqualification is the result'
  class: tooling
  claim: '(A) Every measurement in this bucket rests on one instrument: a scaled-down analogue whose
    forgery probability is obtained by exhaustion. The instrument''s validity for any statement beyond
    its own parameters rests on an unexamined premise - that the measured-to-bound ratio does not
    itself depend on the field size. The claim is that this premise is TESTABLE, cheaply, and before
    any of the campaign''s substantive runs. (B) The test is a ladder: compute the ratio at bit widths
    6, 8, 10, 12, 14, 16, 18, 20 in both fields at fixed L and q, and fit the ratio''s dependence
    on width. If the ratio is flat within the instrument''s own resolution across a factor of 2^14
    in key-space size, the analogue supports a labelled projection. If the ratio drifts monotonically,
    then no scaled-down measurement in this campaign licenses any statement about larger fields, and
    the drift''s magnitude quantifies exactly how much is lost per doubling. (C) The second deliverable
    is the instrument''s RESOLUTION FLOOR: the smallest ratio difference the harness can distinguish
    at each width, computed from the discreteness of the exhaustive counts (a root-set cardinality
    is an integer, so the ratio takes values on a lattice whose spacing is known exactly). Every other
    entry in this bucket must report its effects against this floor, and effects below it must not
    be interpreted. (D) The pairing claim: the ladder runs in both fields, and a drift present in
    one field and not the other is itself a finding about which analogue is trustworthy. (E) WHAT
    IS NOT CLAIMED: no attack; no statement that any bound is tight or loose; no claim that a flat
    ladder licenses extrapolation to n = 128, since eight widths up to 20 constrain behaviour only
    over the tested range and the record says so; and no claim that the resolution floor is a security
    quantity - it is a property of the harness.'
  mechanism: 'STAGE 1 computes, at each of eight widths, the exact optimal forgery probability at
    a fixed (L, q) in both fields, using the shared enumeration module. STAGE 2 instantiates the pinned
    bound at each width and forms the ratio, producing two eight-point curves. STAGE 3 computes the
    exact lattice spacing of the achievable ratio values at each width from the integer nature of
    the root-set counts and the bound''s value, giving the resolution floor with no error bars because
    it is arithmetic. STAGE 4 fits the ratio against width under three declared models - constant,
    linear in n, linear in 1/2^n - and reports which is consistent with the data given the resolution
    floor, refusing to select a model when the floor cannot distinguish them. STAGE 5 runs the random-function
    null on the identical ladder: the null''s ratio has a known analytic width-dependence, so the
    null verifies that the ladder can detect a drift when one exists, which is the only way to know
    that a flat signal ladder means flatness rather than blindness. STAGE 6 emits the floor table
    that every other contract in this bucket must cite. Refutation: if the null ladder does not reproduce
    its known analytic drift, the ladder cannot detect drift at all and no conclusion about the signal
    ladder''s flatness is available.'
  novelty_status: unverified
  novelty_screen:
    method: Greps for POLYMAC, GHASH, Poly1305 as recorded; greps for scaling rule, extrapolation,
      projection, analogue and instrument across ledger/proposals and ledger/questions; read RQ-POLYMAC-7c89e4's
      constraints block, which requires the scaling rule be declared before measurement and extrapolation
      be labelled a projection; read RQ-INSTR-f8faa0's title and scope to confirm this is not the
      blacklisted cost-model audit.
    results: RQ-POLYMAC-7c89e4's constraints require that the scaled-down analogue's scaling rule
      be declared before measurement and that extrapolation be labelled a projection, but no record
      anywhere TESTS whether the analogue's central quantity is scale-invariant - the constraint is
      procedural, not empirical. RQ-INSTR-f8faa0 carries 15+ instrument proposals, all about this
      program's own cost model, machine variance and single-machine timing; this record measures no
      wall clock as a primary quantity and is a different object. No proposal in the ledger computes
      a resolution floor from count discreteness. No hypothesis or evidence record contains a field-size
      ladder for any MAC quantity.
    verdict: 'UNVERIFIED. No literature claim is made. What is claimed new WITHIN THIS REPOSITORY:
      the ladder as a pre-registered validity test of the campaign''s own instrument, and the arithmetic
      resolution floor derived from count discreteness as a mandatory citation for every other contract
      in the bucket. What is assembled from known parts: the enumeration is shared with the ratio-surface
      entry and not re-claimed; the idea that an instrument should be validated before use is program
      policy under the inventor protocol''s section 3 and is applied here rather than invented.'
  object_first_candidate:
    tracked_object: The RATIO AS A FUNCTION OF FIELD SIZE - a single curve per field, with the exact
      lattice of achievable ratio values attached at each width. The object followed is not any individual
      measurement but the width-dependence of the measurement, together with the granularity that
      limits what the width-dependence can show.
    lossiness: 'Lossy. It discards message length, query count, the identity of every key and every
      polynomial, and both fields'' internal structure, retaining one number and one lattice spacing
      per width. This is compatible with the target operation because the question is about scaling
      and nothing else, and because the discarded axes are held fixed by construction. It is not a
      change of coordinates: the ratio at a single width carries no information about scaling, and
      only the curve does, so the projection creates the object it studies rather than renaming an
      existing one.'
    propagation: One step - incrementing the width n by one - doubles the key space, doubles the number
      of achievable difference polynomials at fixed degree, and changes the bound by whatever its
      field-size dependence is. The tracked object propagates as the quotient of those two rates,
      and the whole test is whether that quotient is one. The resolution floor propagates as roughly
      a halving per width increment, since the lattice spacing of the ratio scales inversely with
      the key-space size, so the ladder gets sharper as it climbs - which is why the top of the ladder
      carries most of the inferential weight and why the contract requires the top two widths be completed
      or the ladder be reported as truncated.
    survival_score: 'The curve survives across the full eight-width ladder by construction. It DISSOLVES
      upward at the width where exhaustive enumeration stops fitting in budget - stated as n = 20
      to 22 for this instrument - and that is a hard boundary of the whole campaign, not just this
      contract. It also dissolves downward: at n = 6 and 8 the resolution floor is coarse enough that
      the ratio can take only a handful of values, so the bottom of the ladder constrains almost nothing
      and the contract reports the floor alongside every point precisely so that this is visible rather
      than averaged away.'
  null_object_control: 'The random-function null runs on the identical ladder in the same invocation
    and is the load-bearing control here, because its width-dependence is known analytically: its
    optimal forgery probability is the generic one and its ratio to the bound therefore varies with
    width in a computable way. The null must reproduce that computed drift to within the resolution
    floor at every width. If it does, the ladder is proven capable of detecting a drift of that size,
    and a flat signal ladder is then informative. If it does not, the ladder is blind and the entire
    campaign''s extrapolation premise remains untested regardless of what the signal arms show. A
    second control injects a synthetic drift of exactly one resolution unit per width into a copy
    of the signal data and confirms the fitting stage flags it, establishing the smallest drift the
    analysis can name.'
  discriminated_from:
  - 'RQ-INSTR-f8faa0''s 15+ instrument proposals (blacklisted): those audit this program''s cost model,
    machine variance and single-machine timing. This record''s primary quantities are counted cardinalities
    and an arithmetic lattice spacing, and no wall clock enters any conclusion.'
  - 'The ratio-surface entry in this batch: that varies L and q at fixed width; this varies width
    at fixed L and q, and produces a validity verdict rather than a substantive measurement.'
  - 'The tight-region entry in this batch: that thresholds a surface; this tests whether any point
    on that surface may be spoken about outside its own width.'
  - 'A generic statement that toy results may not extrapolate: true and untestable as stated. The
    content here is a measured drift rate per doubling and a numeric floor.'
  - 'IDEA-20260809-4719b8, the commitment test harness proposal under RQ-AEADC-8db132: also a tooling
    record, but its deliverable is a certificate-or-derivation harness for a different predicate,
    and it contains no scale ladder and no resolution floor.'
  assumptions:
  - The bound instantiates at every width on the ladder. If it degenerates below some width, the ladder
    starts there and the truncation is reported.
  - Holding L and q fixed while varying n isolates the width dependence. This is checked by repeating
    the ladder at a second (L, q) point.
  - The resolution floor computed from count discreteness is the binding resolution limit, rather
    than some other source of granularity. This is checked by confirming that observed ratio values
    actually lie on the predicted lattice.
  - Eight widths spanning 2^6 to 2^20 is enough range to distinguish the three declared models given
    the floors. If it is not, the contract reports model non-identifiability rather than choosing.
  predictions:
  - metric: null-arm ratio versus width, compared to its analytic prediction
    direction: different
    minimum_effect: agreement within one resolution unit at every width; failure means the ladder
      cannot detect drift and no signal conclusion is available
  - metric: observed ratio values lying on the predicted discreteness lattice
    direction: different
    minimum_effect: every observed value must lie exactly on the lattice; an off-lattice value is
      a code fault
  - metric: signal-arm ratio drift per width doubling, both fields
    direction: different
    minimum_effect: the contract pre-commits to calling the ladder flat only if the total drift across
      the eight widths is below the resolution floor at the largest width; no drift magnitude is pre-committed
      as expected, because none can be derived without the bound this record deliberately does not
      hold
  - metric: synthetic one-unit-per-width drift detection by the fitting stage
    direction: higher
    minimum_effect: flagged in at least 95 percent of 100 injections, or the analysis stage's sensitivity
      is reported as worse than one unit per width
  minimal_test:
    design: 'Fix L = 4 and q = 1 and run the ladder at widths 6, 8, 10, 12, 14, 16 in both fields
      - dropping 18 and 20 for the minimal version, since they carry the most weight but also all
      the cost. At each width compute the exhaustive optimum, instantiate the bound, form the ratio,
      and compute the lattice spacing exactly. Run the random-function null on the same widths and
      compare to its analytic prediction. This is minutes of pure-Python work up to width 16. The
      discrimination is one plot and one table: does the null reproduce its known drift within a resolution
      unit, and is the signal ladder flat within the floor at width 16? Three readings. Null fails
      to reproduce its drift: the instrument is blind and the campaign''s extrapolation premise stays
      untested, which is a hard and immediately actionable result. Null reproduces and signal is flat:
      scaled-down analogues in this bucket support labelled projections over the tested range, with
      the range stated. Null reproduces and signal drifts: the drift rate per doubling is the measured
      obstruction, and every other contract in this bucket must carry it in its interpretation limits.'
    controls:
    - Random-function null on the identical ladder with a known analytic width-dependence.
    - Synthetic drift injection of one resolution unit per width, 100 draws, to establish the fitting
      stage's sensitivity.
    - 'Lattice-membership check: every observed ratio must lie exactly on the predicted discreteness
      lattice.'
    - Second (L, q) point repeated across the whole ladder to confirm the width-dependence is not
      an accident of the chosen slice.
    - Both fields run through one code path with the field as a parameter.
    required_metrics:
    - exact optimal forgery probability per (field, width)
    - instantiated bound per (field, width)
    - ratio per (field, width)
    - resolution floor (lattice spacing of achievable ratios) per (field, width)
    - total drift across the ladder, in units of the largest width's floor
    - null-arm ratio versus its analytic prediction, per width
  falsification_conditions:
  - The null arm does not reproduce its analytic width-dependence within one resolution unit.
  - Any observed ratio lies off the predicted discreteness lattice.
  - The synthetic drift injection is not detected at the 95 percent rate, so the fitting stage cannot
    name a one-unit-per-width drift.
  - The three declared models are not distinguishable given the floors, in which case model selection
    is refused and reported as non-identifiability.
  - The bound fails to instantiate across enough of the ladder to fit anything, in which case the
    validity test cannot run and the campaign's premise stays untested - which is itself the reportable
    outcome.
  - The second (L, q) slice shows a qualitatively different width-dependence, so the ladder measures
    the slice and not the instrument.
  confounders:
  - The prime chosen at each width changes the arithmetic; without the five-prime spread a drift could
    be a sequence of prime accidents.
  - The achievable-difference family grows with width, so a drift could reflect the enumeration reaching
    its cap at large widths rather than a real scaling effect - the cap-hit count is a required metric
    for exactly this reason.
  - Matched log-cardinality between arms leaves a residual mismatch that itself varies with width.
  - Fixing L while varying n changes the ratio of degree to field size, which is arguably the real
    scaling variable; the second slice partially addresses this and the contract states that it does
    not fully resolve it.
  - The resolution floor improves with width, so a flat ladder at small widths and a drift at large
    widths would look like a late-onset effect when it may simply be the moment the instrument became
    able to see.
  interpretation_limits:
  - A flat ladder over widths 6 to 20 constrains behaviour over widths 6 to 20. It does not license
    extrapolation to 128 or 130, and the contract states this in the same sentence as any flatness
    finding.
  - The resolution floor is a property of this harness at these widths and is not a security quantity.
  - A drift measured in one field and not the other says which analogue is less trustworthy; it does
    not say why, and this contract cannot say why.
  - If the ladder runs in only one field, it validates the instrument for that field alone and the
    record must say so.
  target_complexity:
    time_exponent: No attack exponent is claimed. Instrument cost is the sum over the ladder of O(A
      * 2^n) field operations, dominated by the largest width, which is what sets the campaign's hard
      ceiling near n = 20 to 22.
    memory_exponent: No attack memory exponent is claimed. O(2^n) bits per bitmap at the largest width,
      a few megabytes.
    best_known: The incumbent is the procedural constraint already written into RQ-POLYMAC-7c89e4
      - declare the scaling rule, label the extrapolation a projection - which is a discipline rather
      than a measurement. Nothing in this repository tests scale-invariance empirically for this construction.
    hidden_overhead: The top two widths cost more than the rest of the ladder combined and carry most
      of the inferential weight, so any budget cut lands exactly where the information is. Human overhead
      hides in deriving the null's analytic width-dependence correctly, without which the control
      is decorative.
  dominated_by: 'n/a (no result claimed). Pareto check performed across every polymac-relevant row
    in this repository (KN-LIT-4060, KN-LIT-5652, KN-LIT-7035, KN-LIT-1337, KN-LIT-4188, KN-LIT-1445,
    the nine RQ-AEADC-8db132 proposals) and the RQ-INSTR-f8faa0 instrument family: none of them is
    an algorithm this record competes with on time, memory or queries, and this record produces a
    validity verdict, not an attack. No frontier position is occupied.'
  sota_delta: No attack; instrument-validity contribution only. Delta is from an untested scale-invariance
    premise underlying every scaled-down measurement in this bucket to an eight-point ladder per field
    with an analytic null, an arithmetic resolution floor, and a stated drift rate per doubling.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'By part. That the ladder runs and the resolution floors are computed
    exactly: about 0.9, since both are arithmetic. That the null''s analytic width-dependence can
    be derived correctly and is reproduced: about 0.7 - this is the step most likely to be got wrong
    and it is the one everything else depends on. That the signal ladder comes out flat within the
    floor: about 0.4, and honestly a drift is at least as likely, given that the ratio of polynomial
    degree to field size is itself changing across the ladder. That the result changes how other contracts
    in this bucket are written: about 0.85 either way, because both outcomes are directly actionable,
    which is why this entry is recommended high despite a low prior on any particular result.'
