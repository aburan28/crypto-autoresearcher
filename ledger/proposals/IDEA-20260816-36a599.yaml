idea:
  id: IDEA-20260816-36a599
  question_id: RQ-NTRU-9015ee
  added: '2026-08-16'
  title: 'Ask what a transition exponent fitted on a bounded dimension window can possibly identify:
    enumerate candidate laws for the transition location, compute the smallest dimension at which
    each pair becomes separable at a stated measurement precision, and report the window this program
    would need before an exponent means anything'
  class: theory
  claim: '(A) A statement of the form the transition sits at q equal to n to the power c is a claim
    about a log-log slope. Any such claim obtained by fitting over a bounded window of dimensions
    is identified only up to the family of laws that are indistinguishable over that window at the
    achievable measurement precision. That family is computable exactly, with no lattice experiment,
    given the window and the precision, and computing it is a prerequisite for interpreting any fitted
    exponent this program might produce.

    (B) The claim under test is quantitative and pre-committable: for a declared list of candidate
    laws, all of the form log q star as a function of n with free constants, and for a declared per-point
    uncertainty on log2 q star, there exists for each pair a minimum upper window edge n_hi at which
    the best fits of the two laws are separated by at least three standard errors given a stated number
    of dimension points. The deliverable is the full pairwise table of those minimum edges, plus the
    identification of which pairs are not separable at any n this program could reach.

    (C) The value is directional and cheap. If pairs that differ materially in their extrapolation
    to large n require a window well beyond what this program can measure, then any fitted exponent
    produced here is a description of the measured window and must be reported as such rather than
    extrapolated, and the table says exactly how far the extrapolation may honestly run. If instead
    separation is achievable within reach, the table is a design specification saying which dimensions
    to spend budget on.

    (D) What is NOT claimed: nothing about where any transition sits, nothing about which candidate
    law is correct, and nothing about what any published fit reports, since this program cannot read
    external work and asserts nothing about it. It is not claimed that the candidate list is complete;
    it is declared, and the table''s conclusions are scoped to it. It is not claimed that separability
    implies correctness: a window that separates two laws still says nothing about whether either
    is the truth, and the entry states that limitation rather than eliding it.'
  mechanism: 'Stage 1: declare the candidate family. Each candidate is a function log2 q star = F(n;
    theta) with free parameters theta, drawn from forms that differ in their large-n behaviour but
    can look alike over a decade: a pure power law, a power law with a logarithmic correction, a power
    law with a bounded multiplicative correction that vanishes as n grows, and a stretched-exponential
    form. The list is declared before anything is computed and is part of the record.

    Stage 2: fix a measurement model. A dimension window is a set of n values; at each, the measured
    log2 q star carries an uncertainty sigma that stands for the transition''s own width plus estimation
    error. Sigma is a parameter of the audit, swept rather than guessed, because the honest answer
    depends on it and pretending to know it would be the central error this entry exists to avoid.

    Stage 3: for each pair of candidates and each (window, sigma), compute separation. Generate data
    from candidate A at its nominal parameters, fit both A and B by weighted least squares over the
    window, and compute the difference in residual chi-squared, converting it to a separation in standard
    errors. Repeat over many noise realisations to get a distribution rather than a point.

    Stage 4: invert. For each pair and each sigma, find the smallest upper window edge n_hi, at a
    fixed number of log-spaced points, at which median separation reaches three standard errors. Tabulate.

    Stage 5: the internal null. Include in the pair list two parameterisations of the identical law.
    Their separation must be zero at every window and sigma; if the machinery reports separation there,
    it is measuring its own fitting artifacts and no other row in the table can be trusted.'
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-NTRU-9015ee, whose motivation states that the transition's constant is fitted
      on small-dimension experiments and inherited. Read all nine of its proposals by title and class,
      with IDEA-20260809-26de01 and IDEA-20260809-263751 read closely since both concern the fitted
      law. grep -ril 'identifiability', 'model selection', 'exponent fit', 'confidence interval',
      'extrapolation' over ledger/proposals/ and ledger/hypotheses/. Checked the blacklist entries
      on program self-audits to confirm this is not one.
    results: RQ-NTRU-9015ee's constraints already require that a fitted exponent be quoted with its
      confidence interval, which is the requirement this entry supplies the machinery for. IDEA-20260809-26de01
      measures the transition width, which enters this entry as the sigma parameter rather than as
      a competing measurement. IDEA-20260809-263751 asks whether the exponent transfers across rings,
      a question that presupposes the exponent is identifiable, which is what this audit tests. No
      proposal found that computes pairwise law separability as a function of window and precision.
      The program's self-audit proposals under RQ-INSTR-f8faa0 and the blacklisted false-positive-rate
      and cost-model audits concern the program's own conduct, not the identifiability of a scientific
      law, so this entry is outside that space.
    verdict: 'UNVERIFIED. No claim about external literature; identifiability analysis and model discrimination
      are standard statistics and the technique is certainly not new in general. What is claimed new
      relative to this repository is its application as a gate on this specific goal''s headline quantity,
      producing a pairwise minimum-window table that any later fit must be checked against, and the
      inclusion of a reparameterisation pair as an internal null that must show exactly zero separation.
      Assembled from known parts: weighted least squares, chi-squared differences, and the width measurement
      that IDEA-20260809-26de01 would supply as sigma.'
  object_first_candidate:
    tracked_object: The separation function Sep(A, B; window, sigma), measured in standard errors,
      for each ordered pair of candidate laws. Followed through the operation of extending the window's
      upper edge.
    lossiness: 'Lossy: Sep collapses two entire functional forms and a whole fitting procedure to
      one number per configuration, discarding where in the window the laws differ, the direction
      of the difference, and the fitted parameters themselves. Two very different pairs of laws can
      share a Sep value. The retained part propagates compatibly with the operation of extending the
      window because Sep is monotone non-decreasing in the upper edge for nested windows at fixed
      point count and sigma, which is checked numerically rather than assumed, so extending the window
      can only help and the inversion in Stage 4 is well posed. The discarded information, notably
      where the laws diverge, is retained separately in the artifacts because it tells a designer
      which dimensions are worth measuring.'
    propagation: 'One step of the target operation extends the window''s upper edge from n_hi to n_hi
      times a fixed factor, holding the number of log-spaced points fixed. Under it Sep grows, and
      the growth rate is itself the useful output: a pair whose Sep grows slowly with window extension
      is one that no achievable budget will separate, and that is a statement about the question rather
      than about the budget.'
    survival_score: 'Survives to arbitrary n because it is pure numerics on analytic forms, so there
      is no computational dissolution point at all. It dissolves as a claim about reality immediately:
      it says what a fit could distinguish, never what is true, and it is entirely contingent on the
      declared candidate list, so its survival as a scientific statement is bounded by that list and
      nothing else.'
  null_object_control: 'The reparameterisation null: two algebraically identical laws written with
    different free parameters, for instance a power law parameterised by (C, c) and the same law parameterised
    by (log C, c). Sep must be exactly zero, to numerical tolerance, at every window and sigma. If
    it is not, the fitting or the chi-squared conversion is producing artifacts and no row of the
    table is admissible. A second null in the opposite direction: two laws that differ by a factor
    growing like n, which must separate at a small window and thus confirm the machinery has power
    at all. Both nulls run in the same invocation as the table and gate its release.'
  discriminated_from:
  - IDEA-20260809-26de01 measures the transition's width from data; this entry consumes a width as
    its sigma parameter and produces a design constraint, so it is upstream of that proposal and downstream
    of nothing.
  - IDEA-20260809-263751 asks whether a fitted exponent transfers between rings, which presupposes
    that the exponent is identifiable on each ring; this entry tests that presupposition and would
    tell that proposal how wide a window it needs.
  - IDEA-20260809-2976d8 scores the lattice estimator against certified recoveries, an empirical calibration
    of a tool; this is an analytic statement about what any fit could distinguish, involves no tool
    and no data, and would apply equally if the estimator were perfect.
  - The blacklisted program self-audits concern this program's false-positive rate, cost model and
    promotion gates; this entry audits a scientific law's identifiability and makes no statement about
    the program's conduct.
  - A routine confidence interval on a fitted exponent reports uncertainty within one model; the entire
    content here is between models, which a confidence interval cannot see.
  assumptions:
  - Weighted least squares on log2 q star with homoscedastic sigma is an adequate fitting model; heteroscedastic
    alternatives are included as a secondary arm because the transition's width may itself grow with
    n.
  - Three standard errors is the separation threshold, a convention declared in advance and swept
    as a sensitivity.
  - The candidate list, though declared incomplete, spans forms that differ materially in extrapolation,
    which is the property that makes the table useful.
  - Nominal parameters for data generation are chosen to be plausible; the table is recomputed at
    several nominal parameter choices because separability can depend on them and reporting one choice
    would overstate the result.
  predictions:
  - metric: Sep for the reparameterisation null at every window and sigma
    direction: different
    minimum_effect: forced value 0 to numerical tolerance; nonzero invalidates the whole table
  - metric: Sep for the deliberately divergent pair at the smallest window
    direction: higher
    minimum_effect: 3
  - metric: minimum n_hi separating a pure power law from a power law with a logarithmic correction
      at sigma = 0.25 log2 units and eight log-spaced points
    direction: higher
    minimum_effect: 500
  - metric: number of candidate pairs that fail to separate at any n_hi up to 10000
    direction: higher
    minimum_effect: 1
  minimal_test:
    design: Entirely analytic, minutes of compute, no lattice touched. Declare five candidate laws
      and their nominal parameters. Declare a grid of windows with lower edge fixed at n = 32 and
      upper edges from 64 to 10000, each with eight log-spaced points. Declare sigma in {0.1, 0.25,
      0.5, 1.0} log2 units. For each ordered pair, window and sigma, generate 500 noise realisations
      from the first law, fit both by weighted least squares, compute the chi-squared difference and
      convert to a separation in standard errors, and take the median. Invert to the minimum n_hi
      reaching three standard errors. Run the two nulls first and gate on them. Report the pairwise
      table, the list of pairs unseparable within reach, and a sensitivity sweep over the threshold
      and over nominal parameters. The discriminating output is the set of pairs whose minimum n_hi
      exceeds any dimension this program can measure, since every one of those is a law this program's
      data cannot exclude however clean the measurement.
    controls:
    - Reparameterisation null with forced zero separation, gating the table.
    - Deliberately divergent pair with forced separation at a small window, confirming the machinery
      has power.
    - Sensitivity sweep over the three-standard-error threshold.
    - Sensitivity sweep over nominal parameter choices for the data-generating law.
    - Heteroscedastic secondary arm where sigma grows with n, since the transition's width may not
      be constant.
    required_metrics:
    - Sep median and interquartile range per (pair, window, sigma)
    - minimum n_hi per pair and sigma
    - count of pairs unseparable within the maximum window
    - null separations, forced values
    - sensitivity of the table to threshold and nominal parameters
  falsification_conditions:
  - The reparameterisation null shows nonzero separation, invalidating the table.
  - The divergent-pair null fails to separate at a small window, meaning the machinery has no power
    and the table is meaningless.
  - Every pair separates within n_hi = 128, refuting the premise that identifiability is a live constraint
    at this program's scale and licensing exponent fits over small windows.
  - Sep is non-monotone in window extension for nested windows, falsifying the propagation claim and
    invalidating the inversion.
  - The table changes qualitatively under a modest change of nominal parameters, meaning the result
    is an artifact of the chosen nominal values rather than of the laws.
  confounders:
  - The choice of nominal parameters can make any pair look separable or not, which is why the sweep
    over them is mandatory rather than optional.
  - Homoscedastic sigma is convenient and probably wrong, since a transition's width plausibly grows
    with n; the heteroscedastic arm bounds the effect.
  - Log-spaced points favour the large end of the window, so the point placement is itself a design
    choice that changes the answer and must be reported as declared rather than optimised.
  - Using chi-squared differences for non-nested models is an approximation, and the entry uses simulation-based
    separations precisely to avoid relying on an asymptotic distribution.
  interpretation_limits:
  - Separability says what a fit could distinguish, never which law is true; a table full of separations
    would not make any candidate correct.
  - The result is scoped entirely to the declared candidate list and would change if a sixth form
    were added.
  - Nothing here bears on NTRU, on any lattice, or on any parameter set; it is a statement about fitting.
  target_complexity:
    time_exponent: No attack exponent is claimed and no attack is involved. The audit's own cost is
      seconds to minutes.
    memory_exponent: No attack memory exponent is claimed; memory is negligible.
    best_known: 'There is no incumbent identifiability analysis in this repository. RQ-NTRU-9015ee''s
      own constraint that a fitted exponent be quoted with a confidence interval is the closest existing
      requirement, and this entry supplies what that requirement cannot: the between-model part.'
    hidden_overhead: 'The declared candidate list is where all the content hides: a table computed
      over a badly chosen list is precise and useless, and choosing the list well requires exactly
      the domain judgement the audit cannot supply. The human cost is in resisting the temptation
      to add forms after seeing which ones separate.'
  dominated_by: 'n/a (no result claimed). Frontier check across time, memory and data: no attack quantity
    is produced and no computation is being made faster than any other, so no frontier row applies.'
  sota_delta: No attack; measurement-design contribution only. The delta is that this program would
    know, before spending a reduction budget, which dimension window an exponent claim requires, where
    at present it would fit whatever window it could afford and quote the result.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'That both nulls pass and the machinery is sound: 0.9, since it is standard
    numerics. That at least one candidate pair fails to separate at any window up to n = 10000: 0.8,
    because power laws with slowly varying corrections are notoriously hard to separate. That the
    minimum window for the power-law versus log-corrected pair exceeds 500: 0.7. That the table is
    stable under the nominal-parameter sweep: 0.5, and this is the real risk, since separability can
    be strongly parameter-dependent and an unstable table is nearly useless. Joint prior for a stable,
    usable table: about 0.4.'
