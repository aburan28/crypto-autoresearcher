idea:
  id: IDEA-20260815-f2d15e
  question_id: RQ-CLGP-b99df5
  added: '2026-08-15'
  title: >-
    CLASS GROUPS ARE PROPOSED AS TRUSTLESS HIDDEN-ORDER GROUPS ON THE
    STRENGTH OF AN ASYMPTOTIC; MEASURE THE ACTUAL COST CURVE OF CERTIFIED
    CLASS-NUMBER COMPUTATION AT THE DISCRIMINANT SIZES BEING PROPOSED
  class: measurement

  claim: >-
    Class groups of imaginary quadratic fields are attractive because they
    need no trusted setup, and their security rests on class-number
    computation being subexponential-but-hard. Deployment proposals cite
    asymptotics. The decision-relevant quantity is the measured cost of a
    CERTIFIED class-number computation at the exact discriminant sizes
    proposed, which is not the same as an asymptotic and has not been
    measured here.

  mechanism: >-
    Run certified class-number computation across a discriminant-size
    ladder, recording wall clock, memory and certification cost separately.
    Fit the cost curve and extrapolate to proposed sizes with an explicit
    statement of the extrapolation's range.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of GOAL-CLGRP-001 objective; grep 'class group' (80), 'class
      number', 'certified computation', 'hidden order'.
    results: >-
      The goal asks for exactly this cost curve. Class-group cryptography
      and class-number algorithms are published; a measured certified-cost
      ladder in this program is absent.
    verdict: >-
      ADAPTATION. The algorithms are published; the contribution is a
      measured certified-cost ladder at deployment-relevant sizes.

  object_first_candidate:
    tracked_object: >-
      THE COST OF A CERTIFIED CLASS-NUMBER COMPUTATION as a function of
      discriminant size.
    lossiness: >-
      A single cost curve discards the distinction between heuristic and
      certified computation, which is why certification cost is a separate
      counter.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while certified computation is feasible at the smaller
      ladder sizes; sizes beyond budget are reported unreached rather than
      extrapolated silently.

  null_object_control: >-
    NULL 1 -- discriminants with known class numbers, which must be
    recovered exactly; a mismatch means the computation is wrong. NULL 2 --
    heuristic (uncertified) computation at the same sizes, isolating the
    certification premium, which is the quantity a security estimate must
    include and usually omits.

  discriminated_from:
    - >-
        Published class-number algorithm analyses, which are asymptotic;
        this measures certified cost at specific sizes.
    - >-
        The RSA-modulus hidden-order alternative, which needs trusted
        setup; this record measures the cost of avoiding it and does not
        compare security.

  assumptions:
    - >-
        Certified computation is feasible at the lower ladder sizes within
        budget.
    - >-
        The certification step is separable from the computation, so its
        premium is measurable; if not, the record reports a combined cost
        and says so.

  predictions:
    - metric: >-
        known-class-number recovery
      direction: different
      minimum_effect: >-
        FORCED exact; a mismatch voids the ladder.
    - metric: >-
        certification premium over heuristic computation
      direction: higher
      minimum_effect: >-
        Predicted positive and reported explicitly, since security
        estimates that omit it are optimistic.
    - metric: >-
        fitted cost curve extrapolated to proposed discriminant sizes
      direction: different
      minimum_effect: >-
        Reported with the extrapolation range stated; extrapolating far
        past the measured ladder is flagged as unjustified.

  minimal_test:
    design: >-
      Four discriminant sizes spanning the feasible range, with known-
      class-number controls and the heuristic comparison at each.
    controls:
      - >-
          Known-class-number recovery at every ladder rung.
      - >-
          Heuristic-versus-certified comparison at matched sizes.
      - >-
          Unreached sizes reported, never silently extrapolated.
      - >-
          Certification cost counted separately.
    required_metrics:
      - >-
          Wall clock, memory and certification cost per size,
          separately.
      - >-
          Certification premium as a ratio.
      - >-
          Fitted curve with its stated extrapolation range.
      - >-
          Artifact manifest with hashes and rebuild receipt.

  falsification_conditions:
    - >-
        A known class number is not recovered. Computation wrong; ladder
        void.
    - >-
        Certification is not separable. Report combined cost rather than
        inventing a split.
    - >-
        The curve extrapolates to a cost far below proposed security
        levels. A deployment-relevant negative needing review.
    - >-
        Only one ladder rung is reachable. No curve can be fitted and the
        record must say so rather than fit two points.

  confounders:
    - >-
        EXTRAPOLATION REACH: fitting at feasible sizes and extrapolating
        to proposed ones spans a large gap, and the fit's form dominates
        the answer.
    - >-
        IMPLEMENTATION MATURITY: an unoptimised implementation overstates
        cost in the direction that flatters the proposal.

  interpretation_limits:
    - >-
        Measures computation cost; makes no security claim about class-
        group constructions.
    - >-
        Scoped to the tested discriminant sizes and implementation.
    - >-
        Extrapolation past the measured ladder is explicitly unjustified
        and is reported as such.

  heuristic_assumptions:
    - id: HEUR-CLGRP-EXT-1
      statement: >-
        The measured certified-computation cost curve extrapolates from
        feasible discriminant sizes to the sizes proposed for
        deployment.
      rigorous_support: >-
        Rigorous ingredient: the published subexponential complexity of
        class-number computation gives the functional form. THE GAP: the
        constants and the sub-leading terms dominate at the sizes
        actually reachable, so a fit over a narrow feasible range does
        not pin the curve where deployment sits, and this is the
        record's central weakness rather than an aside.
      falsification_condition: >-
        A ladder rung whose measured cost departs from the fitted form
        beyond its interval.
      validation_plan: >-
        SAMPLE: >= 4 sizes, >= 3 discriminants each. COMPARISON: fit
        against the published subexponential form. TAIL CHECK: the
        largest reached size, which drives the extrapolation, reported
        separately. TRANSFER ASSUMPTION: stated and unjustified.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is one certified class-number computation per
      ladder rung per discriminant.
    memory_exponent: >-
      Computation working set, recorded per rung.
    best_known: >-
      Incumbents are the published class-number algorithms and their
      asymptotic analyses, measured here and not improved.
    hidden_overhead: >-
      Certification can cost more than the computation it certifies, which
      is exactly why it gets its own counter.
    tradeoff_note: >-
      Larger discriminants buy relevance and cost superlinearly; the
      record reports what it reached and flags the extrapolation gap.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As algorithm analysis: dominated by the
    published literature. As a measured certified-cost ladder: none exists
    here. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: a measured certified-cost
    ladder with the certification premium separated, and an explicit
    statement of how far the fit is being extrapolated to reach proposed
    deployment sizes.

  estimated_cost:
    implementation: medium
    compute: high
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.75 that several ladder rungs are reachable. 0.9 that known class
    numbers are recovered. 0.5 that the certification premium is separable.
    0.3 that the extrapolation gap is small enough for the curve to inform a
    deployment decision at all.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
