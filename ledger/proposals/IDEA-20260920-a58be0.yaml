  falsification_conditions:
    - "The off-spectrum mass computation is wrong, or theta = 1/(4 sqrt b) does not force nonemptiness. (B2) fails and the record collapses to (B1) alone, which is a restatement of Cauchy-Schwarz and is not a contribution."
    - "A branching partition with b <= M/2 is exhibited whose fibre spectra are pairwise disjoint above 1/(4 sqrt b). (B2) is refuted outright; this is the minimal counterexample the RQ's decision_target invites and it is cheap to hunt."
    - "The composite control Z/(a*a') does not return fraction 1, or the random-partition null does return a common frequency. The derivation is broken and every number is void."
    - "(B2)'s frequency disagrees with Vosper's common difference on the exact critical pair. The Fourier and combinatorial routes then contradict each other at the one point where both apply, and at least one is wrong."
    - "A witness cannot be produced for one of the two sides of (B5). Then the 390ccc relationship is NOT settled, the record must say so, and the honest status of that clause is unverified."
    - "The residual pigeonhole is shown to be improvable to all M fibres by a known bound. That is not a falsification -- it is the STRONGEST possible outcome, it fully discharges a5757d's debt, and it routes the constant-b closure of a5757d (D) to review-breakthrough as a threshold-free theorem."

  confounders:
    - "THE FACTOR 4 IN theta. At 1/(2 sqrt b) the argument fails silently -- the two halves can cover the whole -- and the conclusion still LOOKS derived. This is the single most likely error and is why STEP 1 makes the failing substitution explicit."
    - "FRACTION VERSUS ALL. (B3) gives a 1/(16b) fraction. Reading it as 'all fibres' turns a soft structure statement into the rectification conclusion a5757d wanted and would silently claim the debt is fully paid. It is not."
    - "WHICH GROUP THE SPECTRUM LIVES IN. Lambda_i is a set of characters of the group the partition lives in -- Z/n, Z/(a*a'), F_2^{3m}, or (Z/n)^m in IDEA-20260920-6f7416. It is never a set of characters of F_p^*. The lane has already produced one merged record whose forced values switched codomain mid-sentence."
    - "SIGN CLOSURE. x(-R) = x(R) forces A_i = -A_i for x-derived fibres, hence Ahat_i real and Lambda_i symmetric under xi -> -xi. This halves the effective pigeonhole space and improves (B3) by a factor 2; it must be stated, not silently absorbed."
    - "EQUAL FIBRES. (B1)'s lower bound uses |A_i| = |A_j| = n/M. With unequal fibres the bound becomes weighted and the constants move; the exponent does not, but the stated constants do and must be recomputed rather than reused."

  interpretation_limits:
