      STEP 5 (archive check, zero compute). Record the exact sentence of
      IDEA-20260920-a5757d's proof_search_map naming the common-difference
      debt, and the exact sentences of IDEA-20260829-390ccc this record
      separates from. No status change is proposed to either.
      REQUIRING A SCOPE EXTENSION AND NOT PROPOSED HERE: any FFT measurement of
      Lambda_i on a curve or on Z/n. It would be cheap and the Coordinator
