    - "NO EXPONENT IS CLAIMED AND NO ALGORITHM IS PROPOSED. (B3) is a structure statement about partitions; its only algorithmic consequence runs through IDEA-20260920-b6ad24's floor and IDEA-20260920-6f7416's cascade."
    - "The debt is REDUCED, not discharged. a5757d's (D) closure of the constant-b end still depends on upgrading M/(16b) fibres to all fibres, or on the rectification route with its vacuous-at-P-256 threshold."
    - "No factor base is introduced; KN-OPEN-020 is not engaged."
    - "(B5) is a statement about two committed records' hypotheses as written. It does not evaluate whether either record's conclusion is true."

  heuristic_assumptions:
    - id: H1
      statement: >-
        PIGEONHOLE SUFFICIENCY. The bound |Lambda_i(1/(4 sqrt b))| <= 16 M b
        from Parseval is within a constant factor of the truth for the
        partitions that matter, so the fraction M/(16b) in (B3) is not an
        artifact of a lossy counting step that a sharper argument would remove
        entirely.
      rigorous_support: >-
        The Parseval bound itself is rigorous and tight for an AP (whose large
        spectrum is a Bohr-type set of the predicted size) and for a subgroup
        coset (where Lambda is exactly the annihilator, of size M - 1, which is
        16b times smaller than the bound at b = 1 -- so the bound is LOOSE by
        exactly the constant on the one exact object). It imitates the standard
        large-spectrum bound used in the Bogolyubov-Ruzsa lineage. The
        heuristic content is only that no partition of interest has a large
        spectrum pathologically larger than an AP's.
      validation_plan: >-
        SYMBOLIC. Compute |Lambda_i(theta)| exactly for the four fixtures of
        reproduction_check as a function of theta, and plot the Parseval bound
        M/theta^2 against each; record the ratio at theta = 1/(4 sqrt b).
        COMPARISON: the AP case (expected ratio O(1) up to logs) and the
        subgroup case (expected ratio exactly 16b). TAIL CHECK: whether any
        fixture's ratio exceeds 1, which would mean the Parseval bound is
        violated and the derivation is wrong. TRANSFER ASSUMPTION: none; this
        is a per-object symbolic check and asserts nothing about cryptographic
        n. A SAMPLING ROUTE at 24 to 34 bits by exact FFT exists and WOULD
        REQUIRE A SCOPE EXTENSION; it is not proposed.
    - id: H2
      statement: >-
        NO HIDDEN PAIRWISE-INTERSECTING CONSTRUCTION. There is no family of M
        subsets of Z/n, each of size at most 16Mb, pairwise intersecting, with
        maximum element-degree o(M/b), that is realisable as the large spectra
        of a branching partition. Equivalently, (B3)'s pigeonhole fraction
        cannot be shown optimal by an explicit construction.
      rigorous_support: >-
        NONE SUPPLIED, and this is stated as the record's open direction rather
        than as support. Abstractly, pairwise-intersecting families with small
        maximum degree DO exist (projective-plane-type constructions), so the
        pigeonhole fraction is not improvable by pure counting; whether such a
        family can be REALISED by a branching partition is exactly the residual
        debt. The classical statement it imitates is the gap between
        pairwise-intersecting and sunflower-free families.
      validation_plan: >-
        LITERATURE AND CONSTRUCTION, no compute. Record the best known bounds
        for pairwise-intersecting families of bounded size and bounded maximum
        degree; then attempt, by hand on a small prime, to build a branching
        partition whose spectra realise one. A SUCCESSFUL CONSTRUCTION IS THE
        RECORD'S MOST VALUABLE NEGATIVE OUTCOME -- it would show the debt
        cannot be fully discharged by this route and would redirect the lane
        back to rectification with its threshold. TRANSFER ASSUMPTION: a
        small-prime construction refutes but never confirms.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. The record's quantitative content is a
      structure threshold, not a cost: theta = 1/(4 sqrt b) and a served
      fraction 1/(16b). Its only route to an exponent is through
      IDEA-20260920-b6ad24's floor T >= n^{(4-2 lambda)/11}, which it does not
      change; what it changes is the STATUS of a5757d's (D), from conditional
      on a rectification threshold that is vacuous at n = 2^256 to conditional
      on a finite pigeonhole with no threshold at all.
    memory_exponent: "Not applicable; no algorithm. The tracked object Lambda_i(theta) occupies at most 16 M b log n bits per fibre, which is recorded for completeness and is never on an attack's critical path."
    best_known: >-
      Pollard rho 0.886 sqrt(n) time, O(1) memory; BSGS (n^{1/2}, n^{1/2}); van
      Oorschot-Wiener total work n^{1/2}; Shoup's generic Omega(sqrt n). As a
      STATIC result the incumbents are IDEA-20260829-390ccc (AP containment,
      constant doubling, below the Green-Ruzsa density threshold) and
      IDEA-20260901-d77aa8 (a scalar tau_max threshold for key-matching leaf
      joins).
    hidden_overhead: >-
      Three disclosures. (i) The served fraction is 1/(16b), not 1 -- the
      constant 16 is not optimised and the gap to "all fibres" is the residual
      debt. (ii) (B1)'s lower bound is vacuous once b > M/2, so the theorem
      says nothing about the information-free end, which is correct but must
      not be misread as a closure there. (iii) Nothing here is superpolynomial
      and nothing hides in an o(1), because no asymptotic cost is claimed.
    tradeoff_note: "Not applicable to an attack. Pareto content: this record occupies no point on any ECDLP cost axis and adds no memory, time, or query cost to any existing route."

