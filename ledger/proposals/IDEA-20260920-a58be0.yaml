  assumptions:
    - "A1. Equal fibre sizes |A_i| = n/M. The unequal case is treated in IDEA-20260920-6f7416 (C3) and changes constants, not the structure of (B2)."
    - "A2. b <= M/2, which is implied by the beat-rho condition b < sqrt(M) whenever M >= 4. Outside that range (B1)'s lower bound is vacuous and the record says nothing."
    - "A3. sigma is a PARTITION, not a cover. Multivalued keys are IDEA-20260920-6f7416 (C4)."
    - "A4. The theorem is about the abstract group; the curve enters only through the requirement that sigma be coordinate-computable, which is used nowhere in (B1)-(B3) and only in (B4)'s pricing."
    - "A5. No exact nontrivial quotient of a prime-order group is assumed anywhere; (B1)-(B3) are inequalities, not structure claims."

  proof_search_map:
    bottleneck: >-
      The step whose removal changes the theorem is the choice of theta. At
      theta = 1/(2 sqrt b) the off-spectrum mass is one half of the lower bound
      on each side, which is NOT enough to force a nonempty intersection (two
      halves can cover the whole). At theta = 1/(4 sqrt b) it is one eighth on
      each side, and one quarter total, which does force it. THE FACTOR 4 IS
      LOAD-BEARING AND IS THE ENTIRE CONTENT OF (B2); a derivation that writes
      2 there has an off-by-a-constant that destroys the conclusion, and this
      is the first thing a reviewer must check.
    baseline_embedding:
      parameter_slice: >-
        SLICE 1, b = 1. (B1) gives sum over xi != 0 of |Ahat_i|^2|Ahat_j|^2 >=
        |A|^4(M-1), and since each |Ahat| <= |A| this forces at least M-1
        frequencies where both are near-maximal -- the annihilator of a
        subgroup of index M. On prime n no such subgroup exists, so the slice
        is empty, recovering KN-FIND-ffe1df Theorem C, and on Z/(a*a') with
        sigma = reduction mod a it is EXACTLY realised with Lambda_i = Lambda_j
        = the full annihilator for every i, j, so xi_0 is shared by ALL M
        fibres and (B3)'s fraction is 1 rather than 1/(16b).
        SLICE 2, the exact critical case. For A_i, A_j intervals in Z/n of the
        SAME length with |A_i + A_j| = |A_i| + |A_j| - 1, Vosper gives a common
        difference; (B2) must return a nonempty intersection containing the
        frequency dual to that difference, and the two conclusions must agree.
        This is the single point where (B5) says the hypotheses meet, and
        agreement there is a hard gate.
      reproduction_check: >-
        SYMBOLIC AND EXACT, each value with its group named. (i) Z/(a*a'),
        sigma = reduction mod a: b = 1 EXACTLY, Lambda_i(theta) = the
        annihilator of the subgroup for every theta <= 1, IDENTICAL across all
        i, |Lambda_i| = a - 1 exactly, and (B3)'s fraction is 1. (ii) interval
        partition of Z/N into M equal intervals, integer representatives in
        [0, N), N prime, M dividing N: b = 2 EXACTLY, and xi_0 = 1 (the
        frequency dual to difference 1) lies in Lambda_i(theta) for EVERY i
        with |Ahat_i(1)|/|A| = |sin(pi/M)|/(pi/M) + O(1/N) -> 1, so (B3)'s
        fraction is 1 and its guaranteed floor M/32 is met with room to spare.
        (iii) Wagner's low-bits key on Z/N, integer representatives in [0, N),
        N prime: b = 2 EXACTLY, and the fibres are APs of common difference
        2^k, so the shared heavy frequency is the one dual to 2^k -- a
        DIFFERENT xi_0 from case (ii) at the same (N, M, b), which is the
        rescaling ambiguity (B5) predicts and must be reported, not treated as
        an inconsistency. (iv) uniformly random balanced partition of Z/n:
        max |Ahat_i|/|A| = O(sqrt(M log n / n)), so Lambda_i(1/(4 sqrt b)) is
        EMPTY for every b < M/2 up to constants, hence (B2) forces b >= M/2 and
        the theorem degrades to vacuity exactly as it must on an
        information-free partition.
    observation_collision:
      observable: "The large spectrum Lambda_i(theta) of each fibre indicator, as a SUBSET of the dual group, together with (M, b)."
      distinct_preimage_search: >-
        THE COLLISION IS REAL. Cases (ii) and (iii) of reproduction_check --
        the interval partition and Wagner's low-bits partition of the same Z/N
        at the same M and the same b = 2 -- have DIFFERENT Lambda_i and are
        distinct ground-truth objects on the same side of the conclusion. More
        generally every rescaling by a unit d permutes the dual and preserves
        (M, b), so the observable determines xi_0 only up to the unit group,
        which is precisely the "the witness d may depend on sigma" clause of
        a5757d's quantifier order. HARMLESS for (B3), which asserts existence
        of some xi_0. NOT HARMLESS for any successor that wants to IDENTIFY
        xi_0 from (M, b) alone: it cannot be done, and a successor that assumes
        it can has an identifiability failure. A collision ACROSS the
        conclusion -- two partitions with the same Lambda profile, one
        branching and one not -- is not excluded and is the open item.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace the scalar tau_max of IDEA-20260901-d77aa8, and the scalar
          doubling constant of IDEA-20260829-390ccc, by the SET-VALUED
          invariant Lambda_i(theta) -- the theta-large spectrum retained as a
          subset of the dual group rather than collapsed to its maximum. This
          is strictly more state than either incumbent, and it is the state a
          COMMON-difference statement consumes, because "common" is a statement
          about intersection and a maximum cannot express it.
        predicted_gain: >-
          Converts a5757d's named unpaid debt from "find a 3k-4 theorem for
          distinct summands and a compatibility argument" into a pigeonhole on
          a family of sets of size 16Mb, with no density threshold; and settles
          the 390ccc relationship as orthogonality rather than containment.
      - transform: representation_reduction
        proposed_object: >-
          Move the hypothesis from sumset cardinality (|A_i + A_j| <= b|A|) to
          the exact identity sum over xi of |Ahat_i|^2|Ahat_j|^2 = n E(A_i,A_j).
          ENCODING exact; COMPLETENESS every branching pair yields the bound;
          SOUNDNESS the converse fails and is unused; TRANSFER to E(F_p) by the
          group isomorphism to Z/n, non-constructive but only required to
          exist; COST LOSS none.
        predicted_gain: "Removes the density threshold that makes the rectification route vacuous at cryptographic n, which is the only reason a5757d's window was open at constant b."
      - transform: observable_fiber
        proposed_object: >-
          Hold (M, b) = (M, 2) fixed and vary the partition: interval versus
          low-bits on the same prime N. The distinguishing intrinsic invariant
          is the common difference, equivalently the location of xi_0 in the
          dual group.
        predicted_gain: "Exhibits the rescaling ambiguity concretely and bounds what any (M, b)-based instrument can ever identify."
    quantifier_order: >-
      (B2): FOR ALL finite abelian H of order n, FOR ALL equal-fibre partitions
      sigma into M fibres, FOR ALL b <= M/2 such that sigma has one-step
      additive branching b, FOR ALL pairs (i, j): THERE EXISTS a nontrivial
      character xi with |Ahat_i(xi)| >= |A|/(4 sqrt b) AND
      |Ahat_j(xi)| >= |A|/(4 sqrt b). The witness xi is allowed to depend on
      (i, j).
      (B3): ... THERE EXISTS a single nontrivial xi_0, depending on H, sigma
      and b but NOT on i, that is (1/(4 sqrt b))-heavy for at least M/(16b)
      fibres. NOT CLAIMED, and the distinction is the whole residual debt: that
      xi_0 works for ALL i. A reader who reads (B3) with "all" has read the
      quantifier backwards.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "for every finite abelian group and every equal-fibre
        branching partition with b <= M/2, the fibre spectra pairwise
        intersect above level 1/(4 sqrt b), and one frequency serves a
        1/(16b) fraction of fibres". IT CANNOT CERTIFY: that all fibres share a
        frequency; that the fibres are APs; that any common difference exists
        in the a5757d sense; that sigma is uncomputable; any statement about
        unequal fibres, covers, or pair-defined propagation; or any exponent.
      nearby_object_control: >-
        Z/(a*a') with sigma = reduction mod a, where the desired conclusion
        HOLDS IN ITS STRONGEST FORM (all fibres share the whole annihilator)
        and no contradiction arises -- so the method cannot be used to argue
        that branching partitions do not exist, only to constrain them.
        SECOND CONTROL, where the conclusion must be VACUOUS: the uniformly
        random balanced partition, for which every Lambda_i(1/(4 sqrt b)) is
        empty at b < M/2 and the theorem correctly asserts nothing. A method
        that produced a common frequency for a random partition would be
        refuted on the spot.
    proof_obligations:
      - claim: "|A_i + A_j| <= b|A| for all i,j follows from one-step additive branching with equal fibres"
        responsibility: correctness
      - claim: "E(A_i,A_j) >= |A_i|^2|A_j|^2/|A_i+A_j| by Cauchy-Schwarz"
        responsibility: correctness
      - claim: "sum over xi of |Ahat_i|^2|Ahat_j|^2 = n E(A_i,A_j) exactly"
        responsibility: correctness
      - claim: "the off-spectrum mass bound theta^2|A|^3 n and the factor-4 choice of theta"
        responsibility: strictness
      - claim: "|Lambda_i(theta)| <= M/theta^2 by Parseval"
        responsibility: size
      - claim: "the pigeonhole yielding xi_0 heavy for at least M/(16b) fibres"
        responsibility: correctness
      - claim: "the b = 1 slice returns the subgroup annihilator and is empty on prime n"
        responsibility: baseline
      - claim: "the exact-critical slice agrees with Vosper's common difference"
        responsibility: baseline
      - claim: "the random-partition slice returns empty large spectra and the theorem is vacuous there"
        responsibility: scope
      - claim: "(B5): neither 390ccc's soundness hypothesis nor the branching hypothesis implies the other, with a witness on each side"
        responsibility: strictness
    not_applicable_reason: null

