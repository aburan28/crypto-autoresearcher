  minimal_test:
    design: >-
      PAPER-LEVEL DISCRIMINATOR, ZERO COMPUTE, INSIDE THE RQ CLAIM BOUNDARY.
      STEP 1. Write (B1) and (B2) with every constant explicit, and in
      particular derive the theta = 1/(4 sqrt b) threshold from the requirement
      that the off-spectrum mass on each side be at most one eighth of the (B1)
      lower bound. Verify by substitution that theta = 1/(2 sqrt b) does NOT
      suffice. This single substitution is the cheapest falsifier of the whole
      record and takes one line.
      STEP 2. Evaluate (B2)-(B3) exactly on the four fixtures of
      reproduction_check, by hand, in exact arithmetic, with the group and the
      character codomain named on every line.
      STEP 3. Write (B5) as a two-sided separation with an explicit witness on
      each side: a branching partition that is not a sound fibre system for any
      accepted set of density 1/L (the interval partition of Z/n at M = L,
      whose fibre sumsets land in TWO different fibres, not inside one D), and
      a sound fibre system that is not a branching partition (390ccc's
      A_c = B_c = G with D = G, sigma = N, which is a cover with one rectangle
      and no partition-closure property at all). Both witnesses are one line
      each and both are required; producing only one side does not settle the
      relationship.
      STEP 4. State the residual debt precisely as the finite combinatorial
      problem it has become: given M sets of size at most 16Mb inside a group
      of order n, pairwise intersecting, how large a sub-family must share an
      element -- and record the known bounds for pairwise-intersecting families
