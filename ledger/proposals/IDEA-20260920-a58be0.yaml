  id: IDEA-20260920-a58be0
  id_allocation_provenance: >-
    Minted by the top-level session with `python3 tools/allocate_id.py --next
    idea --date 20260920` and confirmed free with `--check` on 2026-09-20.
    Not derived by scanning state. Authored by the idea-generator subagent
    dispatched against RQ-ECDLP-160d89; filed unmodified except for this
    identifier block and the substitution of the minted identifiers for the
    provisional A-D labels the four sibling records used to cross-reference
    one another.
  proposed_by: idea-generator
  proposed_at: '2026-09-20'
  question_id: RQ-ECDLP-160d89
  goal_id: null
  added: '2026-09-20'
  status: proposed
  proposed_by: idea-generator
  proposed_at: '2026-09-20'
  title: >-
    THE COMMON-DIFFERENCE DEBT IS DISCHARGEABLE IN FOURIER, NOT IN FREIMAN.
    IDEA-20260920-a5757d names "all fibres are APs with a COMMON difference" as
    its unpaid mathematical debt and expects a 3k-4 statement for distinct
    summands; the cross-sumset bound |A_i + A_j| <= b|A| plus ONE Parseval
    identity gives instead, with no density threshold and no rectification and
    at every b <= M/2, that Lambda_i(1/(4 sqrt b)) meets Lambda_j(1/(4 sqrt b))
    for EVERY pair of fibres and carries at least three quarters of the
    nonzero cross-energy, hence by pigeonhole a SINGLE nontrivial frequency
    xi_0 is (1/(4 sqrt b))-heavy for at least M/(16b) fibres -- and this
    settles, as a theorem rather than a vocabulary question, that
    IDEA-20260829-390ccc's Cauchy-Davenport/Vosper rigidity and the branching
    condition b < sqrt(M) are NOT the same statement
  class: mechanism

  claim: >-
    REPRESENTATION CLASS AND ATTACK STAGE: R1 of RQ-ECDLP-623a32 (x(R) in F_p
    with O(1) postprocessing) when instantiated on a curve; the underlying
    theorem is representation-free and is about partitions of Z/n. The attack
    stage is COLLISION STRUCTURE.

    (B1) THE CROSS-ENERGY IDENTITY AND ITS CONSEQUENCE. Let sigma partition a
    finite abelian group H of order n into M equal fibres A_1..A_M of size
    |A| = n/M with one-step additive branching b <= M/2. For any i, j,
    |A_i + A_j| <= b|A|, so the cross energy E(A_i, A_j) = sum over g of
    r_{A_i + A_j}(g)^2 satisfies E(A_i, A_j) >= |A|^4/(b|A|) = |A|^3/b. The
    exact identity sum over all characters xi of |Ahat_i(xi)|^2 |Ahat_j(xi)|^2
    = n E(A_i, A_j) then gives, after removing the trivial character's
    contribution |A|^4,
        sum over xi != 0 of |Ahat_i(xi)|^2 |Ahat_j(xi)|^2 >= |A|^4 (M/b - 1)
        >= |A|^4 M / (2b).

    (B2) THE PAIRWISE COMMON FREQUENCY (rigorous). Define the theta-large
    spectrum Lambda_i(theta) = { xi != 0 : |Ahat_i(xi)| >= theta |A| }. Taking
    theta = 1/(4 sqrt b), the mass of the left side of (B1) carried by
    frequencies OUTSIDE Lambda_j(theta) is at most
    theta^2 |A|^2 * sum over xi of |Ahat_i(xi)|^2 = theta^2 |A|^3 n =
    |A|^4 M/(16 b), which is one eighth of the lower bound in (B1). The same
    holds with i and j exchanged. Hence at least three quarters of the nonzero
    cross-energy sits on Lambda_i(theta) INTERSECT Lambda_j(theta), and in
    particular THAT INTERSECTION IS NONEMPTY FOR EVERY PAIR (i, j).

    (B3) THE COMMON FREQUENCY (rigorous, with its honest fraction). Parseval
    gives |Lambda_i(theta)| <= n|A| / (theta^2 |A|^2) = M/theta^2 = 16 M b.
    Fix any i_0. By (B2) every one of the M fibres contributes at least one
    element of the set Lambda_{i_0}(theta), which has at most 16 M b elements,
    so by pigeonhole THERE EXISTS a single nontrivial frequency xi_0 that is
    (1/(4 sqrt b))-heavy for at least M/(16 b) fibres. Since the beat-rho
    condition of IDEA-20260920-a5757d is b < sqrt(M), that fraction is at
    least sqrt(M)/16 fibres and tends to infinity with M.

    (B4) WHAT THIS DISCHARGES, EXACTLY. IDEA-20260920-a5757d's proof_search_map
    names as "THE RECORD'S REAL MATHEMATICAL DEBT" the step from "every fibre
    is contained in a short AP" to "all fibres are APs with a COMMON
    difference", and expects to need a 3k-4-type statement for distinct
    summands (Bilu-Lev-Ruzsa / Grynkiewicz) plus a compatibility argument
    across M fibres. (B2)-(B3) pay that debt in a WEAKER CONCLUSION over a
    STRICTLY LARGER PARAMETER RANGE: not "all fibres, common difference d, up
    to a bounded correction, for b below an absolute constant B_0 and |A| below
    the Green-Ruzsa density threshold", but "a 1/(16b) fraction of fibres share
    one heavy frequency, for EVERY b <= M/2 and EVERY density". The trade is
    explicit and is the deliverable: the rectification route gives a rigid
    structure inside a window that is empty at cryptographic size (the
    classical Freiman 2.4 threshold is |A| < n/10^{35}, so at n = 2^256 and
    M = n^{1/3} the fibres of size 2^170 are far above it, as a5757d's own H1
    concedes); the Fourier route gives a soft structure everywhere.

    (B5) THE 390ccc RELATIONSHIP, SETTLED. IDEA-20260829-390ccc's hypothesis is
    SOUNDNESS of a predeclared fibre system {(A_c, B_c)} against an accepted
    set D, i.e. a rectangle-cover condition on the acceptance relation, plus a
    scan budget forcing balance. The branching hypothesis of
    IDEA-20260920-a5757d is a PARTITION-CLOSURE condition: every A_i + A_j is
    covered by at most b blocks of the SAME partition. These are different
    hypotheses over different objects and NEITHER IMPLIES THE OTHER.
    (a) Branching does not imply soundness: there is no accepted set anywhere
    in a5757d's model, and a branching partition supplies rectangles A_i x A_j
    whose sumsets land in b DIFFERENT fibres, not inside one predeclared D.
    (b) Soundness does not imply branching: 390ccc's fibre system need not be a
    partition, need not cover the group, and imposes nothing on A_c + B_{c'}
    for c != c'. (c) THEY MEET AT ONE POINT ONLY: the exact critical case
    |A + B| = |A| + |B| - 1, where Vosper forces a common difference and
    branching is b = 2 on an interval partition. Off that point the containment
    is orthogonal, not nested: 390ccc's conclusion is strictly stronger (AP
    containment) inside a strictly smaller region (constant doubling, density
    below the rectification threshold); (B3)'s conclusion is strictly weaker
    (one shared heavy frequency, a fraction of fibres) over the whole range.
    ANY CLAIM THAT THE TWO ARE "THE SAME THEOREM IN TWO VOCABULARIES" IS FALSE
    AND THIS RECORD IS THE COUNTEREXAMPLE ON BOTH SIDES.

    (B6) NOT CLAIMED. (B3) does NOT say all fibres share xi_0; it does NOT say
    the fibres are APs; it does NOT recover a common difference d in the sense
    a5757d wanted; and it claims no algorithm and no exponent. The residual
    debt -- upgrading "M/(16b) fibres" to "all fibres" -- is named and is now
    a combinatorial statement about a pairwise-intersecting family of M sets of
    size at most 16Mb inside the dual group, which is a strictly smaller and
    purely finite problem than the one a5757d inherited.

  mechanism: >-
    OBJECT FRAME. REPRESENTATION: R1 (x(R) in F_p with O(1) F_p-arithmetic
    postprocessing) for the curve instantiation; the theorem itself is stated
    for an arbitrary finite abelian group and is representation-free, which is
    what lets IDEA-20260920-6f7416 lift it.
    OPERATION SET SIGMA: pair addition on <P> at depth exactly 2. Sigma
    contains the full translation action, so THIS IS A BRANCHING OBJECT and is
    declared as such.
    TRICHOTOMY (IDEA-20260806-c5d183): CLASS II, BRANCHING. Reason: the tracked
    object's propagation is set-valued of size b > 1; at b = 1 (B1) degenerates
    to the subgroup case and the cell is empty on prime order by
    KN-FIND-ffe1df Theorem C.
    LOSSY-PROJECTION TEST AGAINST SIGMA. The tracked object here is NOT the
    fibre index but the LARGE SPECTRUM Lambda_i(theta) of a fibre indicator -- a
    set of at most 16Mb frequencies retained from a set of n/M group elements.
    DISCARDED: the phases, the small coefficients, and the fibre's actual
    element list. COMPATIBLE WITH SIGMA: convolution on the group is
    multiplication on the dual, so the cross-energy of a fibre PAIR is
    controlled by the retained spectra of the two fibres -- the discard
    propagates with a stated quantitative loss rather than exactly, which is
    the Class-II form of compatibility. LOSSY IN THE REPRESENTATION ACTUALLY
    USED: yes, emphatically -- 16Mb frequencies do not determine a set of n/M
    elements once b < M/2, and nothing is recoverable, so this is not the
    (Delta, Pi) failure of inventor-protocol section 2.
    PRICED OPEN NUMBER: the branching b of IDEA-20260802-002's (L, b) meter,
    now priced against a SECOND number that (B3) makes meaningful -- the size
    16Mb of the large spectrum, which is the exact quantity controlling how far
    the pigeonhole in (B3) can be pushed toward "all fibres".
    WHAT IS ADDED BEYOND IDEA-20260901-d77aa8: d77aa8's (E2) is a
    system-aggregate Parseval bound with a Cauchy-Schwarz loss of K, derived
    from the CONCENTRATION exponent s of a key-matching join, and it concludes
    a single tau_max threshold. This record's (B1) is a PAIRWISE cross-energy
    identity derived from BRANCHING, and it concludes a SHARED-SUPPORT
    statement about the large spectra of two fibres -- a set intersection, not
    a scalar threshold. d77aa8 contains no b, no cross-sumset hypothesis, and
    no statement about any pair of fibres sharing a frequency.
    OFF-LIMITS COMPONENTS USED, NAMED: none as a lens. F1 appears only inside
    the imported cost model M1 when (B4) is priced. No factor base.

