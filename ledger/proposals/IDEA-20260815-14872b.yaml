idea:
  id: IDEA-20260815-14872b
  question_id: RQ-PROP-24458b
  added: '2026-08-15'
  title: >-
    THE AUXILIARY-STATE ESCAPE CLOSES BY A ONE-LINE COROLLARY OF THE RIGIDITY
    THEOREM ITSELF -- any side data a(R) that restores EXACT propagation to a
    lossy statistic v must satisfy |image(a)| >= N/|image(v)|, so it carries back
    essentially every bit v discarded and (v,a) is not a lossy projection at all;
    which leaves exactly one unexamined cell in the whole escape list, BOUNDED
    STATE WITH PROBABILISTIC PROPAGATION, and that cell is precisely where
    differential cryptanalysis lives on the symmetric side
  class: theory

  claim: >-
    (A) THE ESCAPE AS ITS OWNER STATED IT. IDEA-20260807-df906f's escape E2 reads:
    "AUXILIARY STATE. v propagates only when supplemented by extra data a(R); then
    the real object is (v, a) and the question is whether (v, a) is still lossy.
    The elliptic-net construction (KN-TECH-009, Stange KN-LIT-018) is exactly this
    pattern and is the named prior art." The escape was recorded and left open.

    (B) THE COROLLARY, WHICH NEEDS NO NEW MATHEMATICS. Let G have prime order N,
    let v: G -> S and a: G -> A, and suppose the PAIR (v, a) propagates exactly --
    i.e. there is F with (v,a)(R + R') = F((v,a)(R), (v,a)(R')) for all R, R'. The
    rigidity theorem applies verbatim to the map R |-> (v(R), a(R)), because that
    theorem assumes NOTHING about the target set: it concludes that any exactly
    propagating map out of a prime-order group is injective or constant. If (v,a)
    is constant the object is empty. If (v,a) is injective then
    |S| * |A| >= N, hence
        |A| >= N / |S|.
    THAT IS THE WHOLE ARGUMENT. Its content: the auxiliary state must be at least
    as large as the information v threw away. You cannot discard log(N/s) bits and
    buy exact propagation back with fewer than log(N/s) bits of side data. The
    "lossy object plus a little help" pattern -- which is what makes E2 look like
    an escape -- IS NOT AVAILABLE AT ALL in the exact regime.

    (C) WHY THIS IS A CLOSURE AND NOT A FATIGUE REPORT. docs/inventor-protocol.md
    section 4 demands a named obstruction, an argument, and a redirection. The
    obstruction is the rigidity theorem's indifference to its target set -- the
    same indifference that makes it strong is what makes it apply to the enlarged
    object. The argument is (B). The redirection is (D). NOTHING HERE SAYS
    AUXILIARY-STATE CONSTRUCTIONS ARE USELESS; it says they cannot be lossy while
    exactly propagating, which is a statement about a specific pattern in a
    specific regime.

    (D) THE CONSISTENCY CHECK AND THE REDIRECTION, WHICH IS THE POINT OF THE
    RECORD. Elliptic nets (KN-TECH-009, Stange) are the named prior art for E2, and
    they are CONSISTENT with (B) rather than a counterexample to it: a net carries
    unbounded state -- a whole array of values -- and correspondingly propagates
    exactly. The corollary predicts precisely that, and predicting the known
    inhabitant correctly is the cheapest evidence the argument is not vacuous. What
    (B) then leaves is a single cell, and it is a cell nobody in this program has
    entered:
        BOUNDED AUXILIARY STATE + PROBABILISTIC PROPAGATION.
    |A| small (say poly(log N) bits, so the pair is still genuinely lossy) and
    propagation holding only with probability q < 1. THIS IS EXACTLY THE SHAPE OF
    DIFFERENTIAL CRYPTANALYSIS: a differential is a bounded object (an input/output
    difference pair) that propagates with a probability, not a certainty, and the
    auxiliary state is the round position. The symmetric analogy that KN-OPEN-019
    says does not obviously port ports EXACTLY HERE and nowhere else, because every
    other cell is closed by (B) or by the rigidity theorem itself.

    (E) WHAT THE CELL COSTS TO ENTER, AND THE HONEST WARNING ATTACHED. The cell is
    not obviously non-empty. It is bounded on one side by (B) -- push q to 1 and
    the state must blow up -- and on the other by IDEA-20260815-f558e4's ceiling --
    push the state to nothing and q collapses to the 1/s baseline for anything
    efficiently computable. THE HONEST POSSIBILITY, STATED IN ADVANCE, IS THAT THE
    CELL IS EMPTY AND THAT THE TWO BOUNDS MEET. That would be the completion of the
    escape list and a genuine closure of the exact-and-near-exact regime, and it
    would be reported as such. The measurement that decides it is a two-dimensional
    sweep -- state size against propagation probability -- which no record in this
    program has run in either dimension jointly.

  mechanism: >-
    STAGE 1 (SYMBOLIC, CHEAP, DECISIVE FOR (B)). Write the corollary with the
    degenerate cases handled explicitly: constant (v,a); a that depends on more
    than R (e.g. on the pair being combined, which is a DIFFERENT and weaker
    notion and must be separated, not conflated); and the case where a is allowed
    to be partial or undefined on some inputs. THE THIRD CASE IS WHERE A REAL
    COUNTEREXAMPLE WOULD LIVE and Stage 1 must chase it rather than assume it away.
    STAGE 2 (THE PRIOR-ART CHECK). Verify against elliptic nets concretely: state
    the net's actual state size for a toy curve and check it against the N/|S|
    bound. If a net propagates exactly with state SMALLER than the bound, the
    corollary is FALSE and Stage 1 has an error -- this is a real test, not a
    formality, and it is the cheapest available refutation route.
    STAGE 3 (THE TWO-DIMENSIONAL SWEEP INTO THE OPEN CELL). On prime-order
    subgroups of toy curves, for state budgets |A| in {1, 2, 4, 8, 16, 32} and
    statistic sizes s in {2,...,8}, search for pairs (v, a) maximising the majority
    propagation probability q_maj of the pair. Search by local optimisation over
    labelings, seeded both randomly and from structured starts (coordinate buckets,
    division-polynomial characters, isogeny-kernel labels). Report the achieved
    frontier q_maj(|A|, s) against the two matched nulls.
    STAGE 4 (THE FRONTIER, AND THE DECISION). Plot the achieved frontier against
    (B)'s exact-regime bound and against f558e4's zero-state ceiling. Either the
    frontier interpolates strictly between them -- the cell is non-empty, and every
    point on it is a candidate object with a bounded description, which routes to a
    separate proposal with its own exponents -- or it hugs the nulls, and the cell
    is empty within the tested budget and the escape list is complete in the tested
    scope.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Grep over ledger/proposals, ledger/hypotheses and knowledge/ for "auxiliary
      state", "side information", "elliptic net", "Stange", "state size", "bounded
      state", "E2", and a full read of IDEA-20260807-df906f's escape list and of
      KN-TECH-009. Also checked whether any record runs a joint state-size versus
      propagation-probability sweep.
    results: >-
      Elliptic nets are present as KN-TECH-009 with KN-LIT-018 as the source, and
      df906f names them as E2's prior art. NO record states the |A| >= N/|S| bound,
      no record applies the rigidity theorem to an enlarged (v,a) object, and NO
      record sweeps state size against propagation probability in either dimension,
      let alone jointly. The bounded-state-plus-probabilistic cell is named nowhere.
    verdict: >-
      UNVERIFIED, and deliberately modest. THE COROLLARY IS NOT NEW MATHEMATICS --
      it is three lines from a theorem this program already owns, and anyone who
      had asked the question would have got the same answer; the contribution is
      ASKING it and thereby removing a cell from the escape list. The genuinely new
      object is the two-dimensional frontier of Stage 3. Novelty at `unverified`
      until a reviewer confirms that no existing record or external source states
      the state-size bound.

  object_first_candidate:
    tracked_object: >-
      THE PAIR (v, a) -- a bounded statistic together with a bounded auxiliary
      register -- treated as one object, with the register's SIZE promoted to the
      indexed parameter. The program has studied statistics (df906f, f558e4) and
      has one unbounded-state inhabitant (nets); it has never treated the state
      budget as a dial.
    lossiness: >-
      Lossy exactly when |S| * |A| < N, which is the record's operative definition
      and is where (B) bites. At |S| * |A| >= N the object is not a projection at
      all but a re-encoding, and the lossy-projection test of
      docs/inventor-protocol.md section 2 rejects it as a change of coordinates --
      the same verdict that test gives the (Delta, Pi) example it is illustrated
      with.
    propagation: >-
      EXACT: impossible while lossy, by (B). PROBABILISTIC: the open cell, bounded
      above by IDEA-20260815-f558e4's ceiling at |A| = 1 and unbounded-below by
      nothing yet.
    survival_score: >-
      Survives exactly as far as prime order and the group law, inheriting both
      boundaries from the rigidity theorem. On E[ell] (escape E3) the corollary
      does not apply, because that group is not of prime order -- which is
      consistent with genuine lossy quotients existing there.

  null_object_control: >-
    NULL 1 -- RANDOM (v, a) at matched (|S|, |A|), >= 200 samples per cell. Any
    achieved q_maj must beat this empirical distribution, not the analytic 1/s.
    NULL 2 -- RANDOM-FUNCTION statistic via a seeded PRF on the point encoding:
    efficiently computable, curve-blind. Separates cheapness from structure.
    NULL 3 -- COMPOSITE-ORDER control at matched size, where (B) must FAIL because
    the rigidity theorem needs prime order. A pipeline reporting the same bound on
    composite order is measuring the wrong thing.
    PLANTED POSITIVE -- an (v, a) built from the DL coordinate directly (v = the
    high bits, a = the next bits), which must saturate propagation and which the
    search must find. If local search cannot recover a planted optimum, Stage 3's
    negative results mean nothing and must not be reported as an empty cell.
    STRUCTURAL TELL, per docs/inventor-protocol.md section 3: any achieved q_maj
    must DECAY as N grows at fixed (|S|, |A|). A propagation excess flat in N is
    the signature of an artifact, exactly as a round-flat excess is on the
    symmetric side.

  discriminated_from:
    - >-
      IDEA-20260807-df906f. This record does not restate the rigidity theorem; it
      APPLIES it to an object the original did not consider, namely the enlarged
      pair. The original explicitly left E2 open and named the prior art; this
      closes the exact half of it and names what remains. The dependency is total
      and is acknowledged rather than minimised -- if theorem (A) is wrong, this
      record is worthless.
    - >-
      IDEA-20260815-f558e4 (the propagation ceiling). SIBLING AND BOUNDARY: that
      record is the |A| = 1 edge of this record's two-dimensional sweep. They must
      agree there, and Stage 3 must reproduce f558e4's numbers at |A| = 1 as a
      cross-check. A disagreement is a bug in one of the two pipelines and blocks
      both.
    - >-
      KN-TECH-009 and elliptic nets. NOT A CRITIQUE OF NETS: nets are the
      consistency check, not the target. The record predicts their behaviour and
      would be refuted by finding a net that propagates exactly on bounded state.
    - >-
      The Hidden Number Problem and leakage lanes (KN-OPEN-011, KN-OPEN-018).
      DIFFERENT SETTING ENTIRELY: there the auxiliary data is LEAKED BY AN ORACLE
      and is not computable from the public instance; here a(R) must be computable
      by anyone from (E, R). The distinction is the admissibility criterion and is
      enforced mechanically. Named because "extra data about a point" describes
      both and an index scan would confuse them.
    - >-
      IDEA-20260807-053a55 and IDEA-20260807-1d9c5f (curve-level E3 objects). NOT
      THAT CELL: those live on E[ell] and are curve-level; this is point-level on
      the prime-order subgroup, which is exactly the domain where the rigidity
      theorem bites and they escape it.

  assumptions:
    - >-
      The rigidity theorem of IDEA-20260807-df906f is correct as stated. TOTAL
      DEPENDENCE, and the proof there is four lines and was re-read in preparing
      this record. Independent re-derivation is a Stage 1 duty rather than an
      assumption to carry.
    - >-
      "Auxiliary state" means a function of the point alone, a: G -> A. IF THE
      STATE MAY DEPEND ON THE PAIR BEING COMBINED, OR ON A HISTORY, THE COROLLARY
      DOES NOT APPLY AS WRITTEN -- and that is a genuinely different and weaker
      notion which Stage 1 must treat separately rather than fold in. This is the
      most likely way (B) is quietly overclaimed and it is flagged here rather than
      discovered later.
    - >-
      N prime. Load-bearing, inherited, and enforced by protocol rather than
      assumed of the curve.
    - >-
      Local search over labelings finds near-optima at the tested sizes. NOT
      GUARANTEED; the planted-positive control is the only defence and a failure
      there voids Stage 3's negatives.

  proof_search_map:
    bottleneck: >-
      NOT THE COROLLARY, WHICH IS THREE LINES, BUT THE STAGE 3 SEARCH. Claiming
      the open cell is empty requires having searched it competently, and a
      negative from a weak optimiser is a fatigue report wearing a plot. The
      planted-positive recovery control is therefore blocking, not advisory.
    baseline_embedding:
      parameter_slice: >-
        |A| = 1, s = 3, prime N = 23 -- the exact cell IDEA-20260815-f558e4 uses
        as its own frozen fixture.
      reproduction_check: >-
        Stage 3 at |A| = 1 must reproduce f558e4's q_maj = 0.5369 for the interval
        partition by exact rational arithmetic. Identical numbers or the pipelines
        disagree; this shared fixture is what makes the two records comparable at
        all, and neither may report a frontier until it passes.
    observation_collision:
      observable: >-
        The pair (state size, achieved propagation probability).
      distinct_preimage_search: >-
        The falsifier to hunt is TWO STRUCTURALLY DIFFERENT (v,a) PAIRS AT THE SAME
        FRONTIER POINT, one curve-derived and one arbitrary. If the frontier is
        achieved equally by objects that see the curve and objects that do not,
        then the frontier is a fact about the SIZES and not about elliptic curves,
        and no curve-specific conclusion may be drawn from it. This is the single
        most important audit in the record and it is cheap: run the same
        optimisation on Z/N directly, with no curve at all, and compare.
    constructive_transforms:
      - transform: stronger_compositional_invariant
        proposed_object: >-
          Carry the auxiliary register alongside the statistic and treat the pair
          as the invariant, because the pair is what must survive one group
          operation. ENCODING: (v,a) as a labeling of G by S x A. COMPLETENESS:
          exact -- every bounded-state object is such a labeling. SOUNDNESS: (B)
          bounds the exact regime for all of them. TRANSFER: to E(F_p) by the
          group isomorphism, non-constructively, exactly as in f558e4.
          COST LOSS: none in the exact regime; the Stage 3 search cost is the
          price of the probabilistic regime.
        predicted_gain: >-
          Removes one escape from the list at zero compute and localises the whole
          remaining question to a two-dimensional frontier that can be plotted.
    quantifier_order: >-
      THE CLAIM IS: FOR ALL prime N, FOR ALL v, FOR ALL a, IF (v,a) propagates
      exactly THEN |S| * |A| >= N. The witness does not depend on v or a, which is
      what makes it a bound rather than a screen. THE TRAP, NAMED: the converse --
      that |S| * |A| >= N SUFFICES for exact propagation -- IS FALSE (take a
      injective but v,a jointly propagating in no useful way), and the record must
      never state or imply it. The bound is necessary, not sufficient.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "in the exact regime the state-size bound holds by the cited
        theorem; and within the tested budgets, statistic families, prime-order
        toy curves and search effort, the achieved probabilistic frontier is
        [these numbers] against [these nulls]." IT CANNOT SHOW THE OPEN CELL IS
        EMPTY IN GENERAL -- only that a bounded search did not find an inhabitant,
        which is a statement about the search unless the two analytic bounds are
        shown to meet.
      nearby_object_control: >-
        Z/N WITH NO CURVE AT ALL, run through the identical Stage 3 pipeline. If
        the frontier is the same, the method has not identified anything about
        elliptic curves and every curve-flavoured reading of the result is void.
        This control costs one extra column and is mandatory.
    proof_obligations:
      - claim: exactly propagating (v,a) on prime-order G satisfies |S|*|A| >= N.
        responsibility: correctness
      - claim: the pair-dependent and partial-state variants are treated separately.
        responsibility: scope
      - claim: elliptic nets satisfy the bound at toy scale.
        responsibility: correctness
      - claim: local search recovers the planted (v,a) optimum.
        responsibility: interface
      - claim: the |A| = 1 edge reproduces f558e4's fixture exactly.
        responsibility: interface
      - claim: the curve-free Z/N control is reported alongside every frontier point.
        responsibility: scope

  predictions:
    - metric: state size of any exactly propagating lossy (v, a), toy exhaustive
      direction: higher
      minimum_effect: >-
        FORCED: |S| * |A| >= N with no exception at prime N. A single
        counterexample refutes (B) and, given the argument's brevity, would more
        likely indicate a definitional slip in what "propagates" means -- which is
        itself worth finding.
    - metric: elliptic-net state size against the N/|S| bound at toy scale
      direction: higher
      minimum_effect: >-
        Predicted to SATISFY the bound comfortably (nets carry unbounded state).
        A violation refutes (B) outright.
    - metric: achieved q_maj on the (|A|, s) frontier versus matched random nulls
      direction: higher
      minimum_effect: >-
        NO THRESHOLD IS PRE-COMMITTED, because any number stated here would be
        invented to be passed. The frontier is reported with both nulls and the
        curve-free control on the same axes. What IS pre-committed is the
        structural tell: any excess must decay with N, and a flat excess is
        recorded as an artifact rather than a finding.
    - metric: frontier of the curve-free Z/N control versus the curve frontier
      direction: different
      minimum_effect: >-
        Predicted IDENTICAL within null fluctuation -- meaning the frontier is
        about sizes, not curves. A curve frontier significantly ABOVE the
        curve-free one is the record's positive outcome and the only result that
        would justify a follow-on proposal.
    - metric: planted-positive recovery by local search
      direction: different
      minimum_effect: >-
        FORCED: recovered at every (|A|, s). Failure voids all Stage 3 negatives.
    - metric: "|A| = 1 edge against f558e4's frozen fixture"
      direction: different
      minimum_effect: >-
        FORCED EXACT EQUALITY (0.5369 at N = 23, s = 3, interval partition).
        Disagreement blocks both records.

  falsification_conditions:
    - >-
      An exactly propagating lossy (v,a) with |S| * |A| < N at prime N. Refutes
      (B); Stage 1 has an error and the record stops.
    - >-
      An elliptic net violating the bound at toy scale. Same consequence, reached
      more cheaply.
    - >-
      Local search fails to recover the planted optimum. Stage 3 produces no
      admissible negative and the open cell stays open, reported as untested rather
      than empty.
    - >-
      The curve frontier matches the curve-free Z/N frontier. Then nothing
      curve-specific has been found, and the record must say so plainly instead of
      presenting the frontier as an elliptic-curve result.
    - >-
      The |A| = 1 edge disagrees with f558e4. Pipeline bug; both records blocked.
    - >-
      Any achieved excess is flat in N. Artifact per docs/inventor-protocol.md
      section 3; recorded as a controlled null, not a finding.

  confounders:
    - >-
      DEFINITIONAL DRIFT ON "AUXILIARY STATE". Point-function state, pair-dependent
      state, and history-dependent state are three different notions and (B) covers
      only the first. Conflating them would make the closure look stronger than it
      is. THIS IS THE RECORD'S PRIMARY OVERCLAIM RISK and Stage 1 must fix the
      definitions in writing before Stage 3 runs.
    - >-
      SEARCH WEAKNESS READ AS EMPTINESS. A negative from a bounded local search is
      a fatigue report unless the planted control passes and the effort is
      reported. Search effort must be recorded per cell, not summarised.
    - >-
      BASELINE FLUCTUATION. Inherited from f558e4: random (v,a) achieves
      1/s + O(N^-1/2), and at toy N that fluctuation exceeds any plausible real
      excess. Comparisons are against the empirical null distribution only.
    - >-
      SIZE-VERSUS-STRUCTURE CONFUSION. A frontier in (|A|, s) may be entirely
      explained by counting, with no curve content. The curve-free control is the
      only defence and must be reported on the same axes rather than in an
      appendix.

  interpretation_limits:
    - >-
      This closes the EXACT half of ONE escape (E2). E1 is bounded separately by
      IDEA-20260815-f558e4, E3 and E4 are untouched, and KN-OPEN-019 is not closed
      by any of it.
    - >-
      No attack, no exponent, no cost claim. A frontier point would be a candidate
      OBJECT, and converting one into an algorithm needs a separate proposal with
      its own cost table per docs/target-result-profile.md A8.
    - >-
      Everything is scoped to prime-order subgroups under the group law. The
      corollary is FALSE on composite order, which is not a defect but the content
      of the Pohlig-Hellman cell.
    - >-
      Toy scale throughout; claim_tier capped at toy. The corollary is a
      `derivation` artifact per docs/claims-and-verification.md, never "proved".

  heuristic_assumptions:
    - id: HEUR-AUX-B1
      statement: >-
        For prime N, any pair (v,a): G -> S x A that propagates exactly under the
        group law and is non-constant satisfies |S| * |A| >= N.
      rigorous_support: >-
        NOT A HEURISTIC BUT A COROLLARY, recorded here because the record rests on
        it entirely. The rigorous ingredient is the rigidity theorem of
        IDEA-20260807-df906f, whose proof assumes nothing about the target set and
        therefore applies to the product target unchanged; the counting step is
        pigeonhole. The one genuine gap is the definitional scope of "auxiliary
        state" recorded in assumptions, which is a matter of what is being claimed
        rather than of whether the argument is valid.
      falsification_condition: >-
        One exhibited non-constant exactly propagating pair with |S| * |A| < N at
        prime N.
      validation_plan: >-
        SAMPLE: exhaustive over all labelings for N in {11, 13, 17, 23}, |S| and
        |A| in {2,3,4} with |S|*|A| < N -- small enough to enumerate completely, so
        this is a decision rather than an estimate. TAIL CHECK: report every
        near-miss (pairs propagating on > 99% of inputs) since those are where a
        definitional slip would surface. TRANSFER ASSUMPTION: none needed; the
        claim is derived, and the enumeration is a check on the derivation rather
        than evidence for an extrapolation.
    - id: HEUR-AUX-B2
      statement: >-
        The achievable probabilistic frontier q_maj(|A|, s) over efficiently
        computable curve-derived pairs coincides, within null fluctuation, with the
        frontier achievable over arbitrary labelings of Z/N at the same sizes.
      rigorous_support: >-
        The rigorous ingredient is the Weil-type character-sum bound invoked in
        IDEA-20260815-f558e4 (E), which caps curve-derived Fourier structure at the
        N^-1/2 scale; the distributional ingredient is the same majority-advantage
        expansion used there. THE COMPOSITION IS UNWRITTEN and this is genuinely a
        heuristic, not a corollary -- it is the assumption that adding a bounded
        register does not create curve structure the register-free case lacks.
      falsification_condition: >-
        A curve-derived frontier point exceeding the curve-free Z/N frontier at the
        same (|A|, s) by more than the null fluctuation, reproducibly across >= 3
        prime orders.
      validation_plan: >-
        SAMPLE: both frontiers on the identical grid, >= 6 prime orders spanning a
        6x range, >= 200 random restarts per cell. COMPARISON: paired per-cell
        difference with the empirical null spread. TAIL CHECK: the 10 cells with
        the largest curve-versus-curve-free gap, reported with whether they share a
        statistic family or a small s. TRANSFER ASSUMPTION, STATED AND
        UNJUSTIFIED: that toy-scale coincidence persists at cryptographic N.
        NOTHING SUPPORTS THAT and it is recorded as an open extrapolation.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; the record proposes no algorithm for the
      ECDLP. Stated explicitly rather than omitted. Its own costs: the corollary is
      free; the exhaustive check of HEUR-AUX-B1 is O(N^2) per labeling over a
      complete enumeration at N <= 23, which is minutes; Stage 3's search is the
      only real expense and is bounded by the declared restart budget.
    memory_exponent: >-
      O(N) words for a labeling and O((|S|*|A|)^2) counters. Kilobytes throughout.
    best_known: >-
      For the ECDLP the incumbent remains Pollard rho at O(sqrt(N)) and NOTHING
      HERE COMPETES WITH IT. For the state-size question there is no incumbent
      bound in this repository (see novelty_screen); whether one exists externally
      is UNVERIFIED and is a Stage 1 search obligation. For the probabilistic
      frontier the only neighbouring bound is IDEA-20260815-f558e4's |A| = 1 edge,
      which this record must reproduce rather than improve.
    hidden_overhead: >-
      The real hidden cost is interpretive: a two-dimensional frontier plot invites
      reading a smooth curve as a law. The frontier is a finite set of measured
      points at toy N with a search budget attached, and every use of it must carry
      that budget.
    tradeoff_note: >-
      The record makes explicit the tradeoff the whole tracked-object programme
      turns on -- STATE SIZE against PROPAGATION PROBABILITY. (B) pins the
      exact-propagation end: bounded state is unavailable there at any price.
      f558e4 pins the zero-state end: probability collapses to baseline for
      anything computable. WHETHER ANYTHING LIVES BETWEEN THEM IS THE OPEN
      QUESTION, and stating the tradeoff in those two anchored endpoints is the
      record's main structural contribution.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. AS AN ATTACK: n/a (no result claimed) -- no attack,
    so no row of the ECDLP frontier applies. AS A STRUCTURAL RESULT IN THE EXACT
    REGIME: strictly DOWNSTREAM of IDEA-20260807-df906f's rigidity theorem, which
    is the stronger statement and from which (B) is a corollary; this record does
    not improve it and claims only to have applied it somewhere it had not been
    applied. AS A BOUND ON THE PROBABILISTIC REGIME: IDEA-20260815-f558e4 is
    sharper at |A| = 1 and this record defers to it there entirely, adding only the
    |A| > 1 dimension. AS AN AUXILIARY-STATE CONSTRUCTION: elliptic nets
    (KN-TECH-009) are a real construction and this record builds nothing, so they
    dominate on every constructive axis. Null is NOT claimed on any axis.
  sota_delta: >-
    No attack, no speedup, no exponent. CONTENT DELIVERED: the explicit bound
    |A| >= N/|S| for exact propagation with auxiliary state, which removes the
    exact half of escape E2 from the open list at zero compute; a prediction that
    correctly retrodicts the cell's only known inhabitant (elliptic nets carry
    unbounded state, as the bound requires); the identification of BOUNDED STATE
    WITH PROBABILISTIC PROPAGATION as the sole remaining unexamined cell in the
    escape list, together with the observation that it is the exact shape of
    differential cryptanalysis and therefore the one place the symmetric analogy
    ports; and a two-dimensional frontier protocol with a curve-free control that
    can decide whether that cell is inhabited. Against the prior state of E2 --
    recorded, named, and left open with one inhabitant -- the delta is the bound,
    the retrodiction, and the localisation of what remains.

