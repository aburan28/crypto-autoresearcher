idea:
  id: IDEA-20260805-19990a
  question_id: RQ-MAYO-001
  added: '2026-08-05'
  title: >-
    IMPLEMENTATION CLASS, NOT A BREAK OF THE MAP -- the forced signature
    count for oil-space recovery under a repeated vinegar seed is
    1 + ceil(o/k), which is TWO signatures at three of the four recalled
    MAYO parameter sets
  class: implementation

  claim: >-
    FILED EXPLICITLY AS AN IMPLEMENTATION-CLASS PROPOSAL, per
    GOAL-MAYO-001's next_action: 'proposals that attack the implementation must
    be filed as a separate class from proposals that attack the map; do not let
    a fault result be scored as a break of the mathematics.' Nothing in this
    record is evidence about the whipped map's mathematical security, and any
    downstream citation that treats it as such is a scope violation.
    THE CLAIM. If two MAYO signatures are produced under the SAME vinegar
    value -- through a repeated or fixed seed, a fault that forces one, a
    counter reset, a VM snapshot rollback, or any other loss of vinegar
    freshness -- then their difference lies ENTIRELY in the whipped oil space
    O^k, and therefore each of its k blocks lies in the underlying oil space O.
    A single repeated-vinegar pair thus hands the attacker k vectors of O at
    once. Since dim O = o, the FORCED SIGNATURE COUNT for full oil-space
    recovery is
      N* = 1 + ceil(o / k),
    which under the recalled parameter sets is 2 for MAYO Level I
    (k = 9, o = 8), 6 for MAYO Level II-shape (k = 4, o = 18), 2 for Level III
    (k = 11, o = 10) and 2 for Level V (k = 12, o = 12). The recovered space is
    CERTIFIABLE in the sense docs/claims-and-verification.md requires -- a
    candidate oil space either annihilates the public map or it does not, and
    the check is independent of however it was found. The deliverable is
    therefore a derived, certificate-backed statement of exactly what MAYO's
    randomness discipline must guarantee: not 'seeds should be fresh' but 'a
    single seed repetition is sufficient for key recovery at three of four
    parameter sets', which is a materially stronger requirement than the
    qualitative fault-attack reports the research question relays.

  object_first_candidate:
    tracked_object: >-
      The DIFFERENCE of two signatures produced under a common vinegar,
      followed blockwise: s - s' in (F_q^n)^k, then its k projections
      pi_1(s - s'), ..., pi_k(s - s') in F_q^n, then the F_q-span of all such
      projections accumulated over signature pairs. The object is a subspace of
      F_q^n and the measurement is its dimension against the forced value
      min(k (N - 1), o).
    established_families_off_limits: >-
      Off-limits as the primary lens: every attack on the MAP -- Kipnis-Shamir,
      reconciliation, intersection, MinRank, direct Groebner, underdetermined
      MQ, and the emulsifier-defect object of IDEA-20260805-74e78c. This
      proposal deliberately uses NO structural weakness of the whipped map; it
      uses only the definitional facts that O^k is the whipped oil space and
      that a signature is vinegar plus an oil correction. That is why it is
      filed in a separate class: if it succeeded it would say nothing whatever
      about the hardness of the underlying MQ problem.
    newness_score: >-
      The mechanism class is NOT new and this record does not pretend it is.
      RQ-MAYO-001's motivation already relays that 'fault attacks that fix or
      disturb the vinegar seed recover the secret key' and that a
      fault-assisted man-in-the-middle on key generation is reported to recover
      the oil matrix from a single faulty execution -- both NOT READ, relayed
      through the research question. What is new here is the QUANTITY: a
      derived, parameter-explicit forced count N* = 1 + ceil(o/k) with an exact
      success probability from the q-binomial spanning formula, a graded
      partial-reuse prediction, and a matched null. Qualitative 'seed reuse is
      fatal' statements do not tell an implementer whether the margin is two
      signatures or two thousand, and that number is the whole content.
    testability_score: >-
      Maximal. Everything is exact linear algebra over F_16 at toy parameters,
      implementable in pure Python with log/exp tables -- numpy 2.4.6 is present
      in this container and no computer-algebra system is, which this design
      accommodates rather than assumes away. A toy MAYO can be built, signed
      with, and attacked in seconds, and the recovered oil space carries a
      certificate that a verifier recomputes independently.
    survival_score: >-
      The mechanism survives to full parameters unchanged, because it uses no
      approximation and no size-dependent heuristic beyond genericity of the
      recovered vectors. What does NOT survive is any claim about deployed
      systems: whether a real implementation can be made to repeat a vinegar is
      an engineering and fault-injection question this program does not test
      and must not assert.

  mechanism: >-
    DERIVED HERE. Signing structure is RECALLED, UNVERIFIED and is Stage 0's
    reading task; the algebra is unconditional given that structure.

    SIGNING (RECALLED, UNVERIFIED). To sign a digest t in F_q^m, MAYO samples a
    vinegar vector v = (v_1,...,v_k) in (F_q^n)^k, expanded from a seed, and
    then solves for an oil correction x in O^k. Because P* vanishes on O^k,
      P*(v + x) = P*(v) + P*'(v, x) + P*(x) = P*(v) + P*'(v, x),
    where P*' is the polar form of P*, so the signing equation
      P*'(v, x) = t - P*(v)
    is LINEAR in x. That linearity is the entire reason MAYO whips: the system
    has k o unknowns and m equations, and k o >= m is what makes it solvable,
    whereas the underlying map alone offers only o < m unknowns. The signature
    published is s = v + x (plus a salt).

    THE DIFFERENCE IS PURE OIL (DERIVED, ONE LINE). Let s = v + x and s' = v +
    x' be two signatures produced under the SAME v, for digests t and t'. Then
      s - s' = x - x',
    and x, x' both lie in O^k, which is an F_q-subspace, so s - s' lies in O^k.
    Writing pi_i for the projection onto the i-th block, EVERY ONE OF THE k
    BLOCKS pi_i(s - s') LIES IN O. One repeated-vinegar pair therefore yields
    k vectors of the o-dimensional secret oil space, not one.
    NOTE WHAT IS NOT USED: the targets t and t' may be completely different,
    the solver's particular-solution rule is irrelevant, no fault in the
    arithmetic is needed, and no property of the emulsifier or of P beyond
    O^k being the oil space enters. This is why the count is so small.

    THE FORCED COUNT (DERIVED). From N signatures sharing one vinegar, form the
    N - 1 differences against the first and collect all k (N - 1) block
    projections. Each lies in O, dim O = o. Under the genericity heuristic
    HEUR-MAYO-VIN-1 below, the span of j uniformly distributed vectors of O has
    dimension min(j, o), so the accumulated span reaches O as soon as
      k (N - 1) >= o,  i.e.  N >= 1 + ceil(o / k) = N*.
    Recalled parameter sets give N* = 2, 6, 2, 2. The EXACT success probability
    at j >= o vectors is the standard q-binomial spanning probability
      Pr[j uniform vectors span F_q^o] = prod_{i = 0}^{o - 1} (1 - q^{i - j}),
    which at q = 16, o = 8, j = 9 is prod_{i=0}^{7} (1 - 16^{i-9}) and evaluates
    to approximately 0.9331 -- A NUMBER TO BE RECOMPUTED IN THE EXPERIMENT, NOT
    TAKEN FROM THIS RECORD. So even the marginal case k = o is a
    better-than-nine-in-ten single-pair recovery, and a second pair makes it
    overwhelming.

    FROM O^k BACK TO THE PRIVATE KEY (DERIVED, WITH ITS LIMIT STATED). O is the
    oil space of the underlying map P, and knowledge of O is what a UOV-type
    key recovery means: with O in hand the attacker can sign, because the
    signing linear system is constructible from O and the public map alone.
    THE PRECISE STATEMENT THIS RECORD MAKES IS 'RECOVERS O', NOT 'RECOVERS THE
    SERIALISED PRIVATE KEY', and the two are not identical -- reconstructing the
    exact byte-level secret key format is an implementation matter that is not
    claimed.

    THE CERTIFICATE (REQUIRED, NOT OPTIONAL). A candidate oil space W of
    dimension o is accepted only if, under independent re-verification with
    code that did not produce it: P(w) = 0 for every w in a basis of W, and
    P'(w, w') = 0 for every basis pair. Both are direct evaluations of the
    PUBLIC map. A universal forgery demonstration -- sign a fresh challenge
    digest using only W and the public key, then verify -- is the stronger
    certificate and is the one the experiment should target, because it is
    checkable by the verification routine itself.

    PARTIAL REUSE, WHICH IS THE REALISTIC CASE AND THE GRADED CONTROL. Suppose
    only a subset S of the k vinegar blocks is shared between the two signing
    calls, |S| = j. Then for i in S, pi_i(s - s') = pi_i(x - x') lies in O as
    before, while for i not in S the block difference contains a vinegar
    difference and does NOT lie in O. So the yield is j vectors of O per pair
    rather than k, and the forced count becomes N*(j) = 1 + ceil(o / j) for
    j >= 1, diverging as j -> 0. That is a monotone, parameter-explicit,
    three-plus-interior-point prediction, and its j = 0 endpoint is exactly the
    matched null: with no shared block, ZERO vectors of O are obtained and the
    recovered span must have dimension 0. A measurement that recovers oil
    vectors at j = 0 means the harness is leaking the secret through some other
    path and no number in the study is trustworthy.

  novelty_status: unverified

  literature_context:
    - >-
      RQ-MAYO-001's own motivation relays that fault attacks fixing or
      disturbing the vinegar seed recover the MAYO secret key, and that a
      fault-assisted man-in-the-middle on key generation is reported to recover
      the oil matrix from a single faulty execution plus public-key correction.
      NOT READ -- relayed by the research question, which itself states that
      every per-scheme technical claim in it is unverified secondary reporting.
      This proposal does not rest on those reports and does not confirm them; it
      derives its own count from the signing equation's shape.
    - >-
      RELAYED, from the session ANGLE-BRIEF section F8: ePrint 2025/1895 is
      described as differential fault attacks on MQOM. Not MAYO, and not read.
      Recorded only to note that fault work in this family is active.
    - >-
      NO MAYO SPECIFICATION HAS BEEN READ. Whether the signature published is
      the full s = v + x for all k blocks, whether MAYO derives the vinegar
      deterministically from the message and a secret seed (a design choice that
      would make ACCIDENTAL repetition impossible while leaving FAULT-INDUCED
      repetition live), and whether any nonce-misuse-resistance countermeasure
      exists, are all Stage 0 reading tasks. Every one of them changes the
      threat model without changing the algebra.
    - >-
      knowledge/techniques contains no entry on vinegar-reuse or on
      randomness-discipline bounds for MQ signatures; ledger/proposals contains
      no implementation-class MAYO proposal. IDEA-20260801-013, the only prior
      MAYO record, is map-class.

  lossy_projection_identifiability_audit:
    projection: >-
      Two signatures (each an element of (F_q^n)^k, plus salts and digests)
      --> their difference --> its k blocks --> the F_q-span of the blocks in
      F_q^n --> a single integer, the dimension of that span.
    what_is_discarded: >-
      The vinegar itself, the digests, the salts, the solver's
      particular-solution choice, and the whole affine offset. Only a linear
      subspace survives.
    why_genuinely_lossy: >-
      Genuinely lossy: v is unrecoverable from s - s', and every pair of
      signatures with the same difference maps to the same point. The fibre is
      the full set of vinegar values.
    why_compatible_with_the_operations: >-
      Compatible in the strongest available sense, and it is a THEOREM not a
      hope: the discarded part (the vinegar) cancels EXACTLY in the difference
      because it enters the signature additively and identically in both calls.
      The retained part propagates deterministically -- it lands in O^k, a fixed
      subspace independent of the digests -- which is precisely the
      'propagates deterministically' condition the lossy-projection test asks
      for.
    is_it_only_a_change_of_coordinates: >-
      CHECKED AGAINST BOTH FAILURES. (1) Not the (Delta, Pi) failure: the
      projection is not invertible and no algebraic identity reconstructs the
      pair (s, s') from the difference. (2) Not the mirror failure either --
      the retained quantity is NOT constant across instances, and the
      comparator spread is designed in: the measured span dimension takes the
      values 0 (null arm, no shared vinegar), min(k(N-1), o) (full reuse), and
      min(j(N-1), o) (graded arm), so the instrument is required to produce at
      least three distinct values or it is not measuring anything. The
      dangerous constant here would be a span dimension that stays at o
      regardless of the arm, which would indicate the oil space is leaking
      through the harness rather than through the reuse -- and the j = 0 null
      is exactly the test that catches it.

  assumptions:
    - >-
      That a signature reveals s = v + x for all k blocks. If MAYO's signature
      encoding omits or compresses blocks, the yield per pair drops from k to
      the number of recoverable blocks and N* rises correspondingly. Stage 0
      settles it; the formula's shape is unchanged.
    - >-
      That O^k is the whipped oil space and is an F_q-subspace. Definitional.
    - >-
      That an attacker can obtain two signatures under one vinegar. THIS IS THE
      ENTIRE THREAT-MODEL ASSUMPTION AND IT IS NOT TESTED HERE. This program
      does not perform fault injection, does not claim any deployed
      implementation is faultable, and reports the result as a conditional
      requirement on the randomness discipline, never as an attack on MAYO.

  predictions:
    - metric: >-
        span_dimension_staircase: dim of the accumulated span of block
        projections of signature differences, as a function of the number N of
        signatures sharing one vinegar, at toy parameters
      direction: higher
      minimum_effect: >-
        EXACTLY min(k (N - 1), o) at every N, an exact integer staircase
        derived before any run, with the plateau at o reached at N = N* =
        1 + ceil(o/k). Deviations below the staircase falsify the genericity
        heuristic; deviations above it are impossible and would indicate a bug.
    - metric: >-
        recovery_success_rate at N = N* over independent toy instances
      direction: higher
      minimum_effect: >-
        At least the q-binomial spanning probability
        prod_{i=0}^{o-1} (1 - q^{i-j}) with j = k (N* - 1), COMPUTED IN THE
        EXPERIMENT AND NOT TAKEN FROM THIS RECORD, minus a stated sampling
        tolerance. A rate materially below it means the block projections are
        not behaving like uniform vectors of O and HEUR-MAYO-VIN-1 is refuted --
        which would be a genuinely interesting structural fact about the
        signing solver.
    - metric: >-
        certificate_pass_rate: fraction of recovered candidate spaces W that
        satisfy P(w) = 0 and P'(w, w') = 0 for all basis vectors and pairs,
        re-verified independently
      direction: higher
      minimum_effect: >-
        1.00. A recovered space that fails its certificate is an invalid
        measurement, never a negative result (docs/claims-and-verification.md).
    - metric: >-
        forgery_verification_rate: fresh challenge digests signed using only W
        and the public key, then checked by the ordinary verification routine
      direction: higher
      minimum_effect: >-
        1.00 at toy parameters once W = O. This is the strong certificate and
        it is the success criterion the experiment should be judged on.
    - metric: >-
        null_arm_span_dimension: same measurement with FRESH vinegar for every
        signature (no shared block, j = 0)
      direction: lower
      minimum_effect: >-
        EXACTLY 0 oil vectors recovered, and every block projection must FAIL
        the oil test P(pi_i(d)) = 0 except with probability about q^{-m} per
        test, which at toy q = 16, m = 6 is 16^{-6} = 6e-8 and is negligible.
        A nonzero null recovery invalidates the entire study.
    - metric: >-
        graded_partial_reuse: N*(j) measured for j shared vinegar blocks,
        j = 1, 2, ..., k
      direction: lower
      minimum_effect: >-
        MONOTONE NON-INCREASING in j and equal to 1 + ceil(o/j) at every j.
        At least three interior points are required. A graded arm that is flat
        in j means the shared-block count is not what drives the leak and the
        mechanism is misidentified.

  minimal_test:
    design: >-
      Cheapest decisive stage first; stage 1 is pen-and-paper and can end the
      line.
      STAGE 0 (reading): obtain the Round-3 specification; quote the signing
      procedure, the vinegar derivation (deterministic from message and secret
      seed, or randomised, or hybrid), and the signature encoding. Record
      exactly which sources were tried and what each returned.
      STAGE 1 (algebra, no compute): re-derive the difference identity and the
      forced count against the quoted procedure. If the vinegar is derived
      deterministically from the message, accidental repetition is impossible
      and the threat model narrows to induced repetition -- a narrowing that
      must be recorded in the record's own scope, not discovered later.
      STAGE 2 (toy end-to-end, seconds to minutes, pure Python + numpy over
      GF(16) with hand-rolled log/exp tables): build toy MAYO instances with
      k o >= m, sign under the four arms (full reuse, graded partial reuse,
      fresh-vinegar null, and a positive control), recover W, certify it, and
      forge.
    controls:
      - >-
        MATCHED NULL (same shape, forced value derived pre-run, CAN FAIL):
        fresh vinegar for every signature, identical everything else --
        identical instance, identical digests, identical solver, identical
        recovery code. Forced value: recovered oil dimension 0, and each block
        projection failing the oil test except with probability about q^{-m}.
        This null can fail loudly (if the harness leaks O by any other route it
        shows here) and it is the arm that must be run and committed FIRST.
      - >-
        POSITIVE CONTROL / THE EFFECT MUST APPEAR: full vinegar reuse at
        N = N* + 2 signatures, where the staircase says the span must have
        saturated at o and the forgery must verify. If recovery fails there,
        the instrument is broken and NO negative result from any other arm may
        be reported.
      - >-
        SECOND POSITIVE CONTROL, PLANTED AND INDEPENDENT OF THE MECHANISM: hand
        the recovery and certification code the TRUE oil space directly. The
        certificate must pass and the forgery must verify, 20/20. This isolates
        'the certifier and forger work' from 'the reuse leak works', so a
        failure can be localised instead of leaving a bare negative.
      - >-
        GRADED CONTROL, >= 3 INTERIOR POINTS, MONOTONICITY REPORTED: shared
        block count j = 1..k as in the predictions, with N*(j) compared against
        1 + ceil(o/j) at every j.
      - >-
        VERDICT-ON-THE-NULL-FIRST: the decision rule is executed and committed
        on the fresh-vinegar null before any reuse arm is looked at. If the rule
        emits the same label on both, it discriminates nothing and must be
        rewritten before the reuse arm is read.
      - >-
        ARCHIVE CHECK: no prior run, experiment or evidence record exists in
        area MAYO. Recorded as unavailable, not as a passed check.
    required_metrics:
      - span dimension per N per arm, against the forced staircase
      - recovery success rate per arm with seeds
      - certificate results, with the verifier stated to be independent of the recovery code
      - forgery verification results on fresh challenge digests
      - the recomputed q-binomial spanning probability with its formula
      - the graded N*(j) table

  falsification_conditions:
    - >-
      The measured span dimension is below min(k(N-1), o) at toy parameters.
      The genericity heuristic fails and the forced count is wrong -- report the
      measured law instead, because a solver whose corrections lie in a
      predictable proper subspace is itself a finding.
    - >-
      The null arm recovers any oil vector. The study is invalid; nothing may be
      reported except the harness defect.
    - >-
      The planted positive control fails to certify or to forge. Instrument
      failure; no negative may be reported.
    - >-
      Stage 0 shows the signature does not reveal all k blocks, or the vinegar
      is derived in a way that makes repetition unreachable in the stated threat
      model. The count survives as algebra but its scope narrows, and the record
      must say so rather than keep the broader phrasing.

  confounders:
    - >-
      CLASS CONFUSION -- the confounder this record exists to prevent. A
      successful toy recovery here says NOTHING about the hardness of the
      whipped map. GOAL-MAYO-001's next_action forbids scoring a fault result as
      a break of the mathematics, and any evidence record arising from this
      proposal must carry that sentence.
    - >-
      THREAT MODEL NOT TESTED. Whether any real implementation can be induced to
      repeat a vinegar is outside this program's scope and is not claimed. The
      deliverable is conditional: IF repetition occurs, THEN N* signatures
      suffice.
    - >-
      TOY IS TOY. The algebra is size-independent but the measurements are at
      toy (q, n, m, o, k). Claim tier toy for every measured number; the derived
      count is a derivation and is tiered as such.
    - >-
      SOLVER DEPENDENCE. The distribution of the block projections depends on
      how the signer chooses a particular solution of the linear system. A
      deterministic pseudo-inverse and a randomised solution give different
      distributions, and both must be run as separate cells rather than one
      being assumed representative.

  interpretation_limits:
    - >-
      IMPLEMENTATION CLASS. This record may never be cited as evidence for or
      against any statement about MAYO's mathematical security, the whipping
      map, or the underlying MQ problem.
    - >-
      A recovery at toy parameters is a toy-tier result. It transfers as an
      ALGEBRAIC statement (the difference identity is exact at all sizes) and
      NOT as an empirical one.
    - >-
      The deliverable is a requirement on the randomness discipline, phrased as
      a number, and the honest form of the conclusion is: 'under the tested toy
      parameter shape and the stated threat model, a single vinegar repetition
      is sufficient for oil-space recovery whenever k >= o, and 1 + ceil(o/k)
      signatures suffice in general.'
    - >-
      No countermeasure is proposed or evaluated. Whether deterministic vinegar
      derivation, per-signature seed diversification, or a fault-detection
      countermeasure closes the route is a separate question this record does
      not answer.

  heuristic_assumptions:
    - id: HEUR-MAYO-VIN-1
      statement: >-
        The k(N-1) block projections pi_i(s^{(j)} - s^{(1)}) behave, for the
        purpose of spanning, like independent uniform vectors of O, so that
        their span has dimension min(k(N-1), o) with the q-binomial probability
        prod_{i=0}^{o-1}(1 - q^{i-j}).
      random_model_justification: >-
        The oil corrections solve a linear system whose right-hand sides are
        essentially uniform digests, so their differences are expected to be
        spread over the solution structure. THE ARGUMENT IS NOT AIRTIGHT AND
        THE RECORD SAYS SO: if the signer uses a fixed linear right-inverse,
        the differences all lie in the image of that right-inverse, a subspace
        of O^k of dimension at most m -- which is still far more than o at the
        recalled parameters, so the conclusion is robust, but the DISTRIBUTION
        is not uniform and the spanning probability is then a different number.
        Both solver rules are run as separate cells for exactly this reason.
      supporting_results: >-
        The q-binomial spanning probability is elementary and is derived in the
        experiment rather than cited.
      validation_experiment_ids: []
      falsification_condition: >-
        Measured span dimension strictly below the forced staircase at any N in
        the toy sweep, at more than the stated sampling tolerance.
    - id: HEUR-MAYO-VIN-2
      statement: >-
        A recovered subspace W of dimension o that annihilates the public map is
        the oil space O, i.e. the certificate is sound.
      random_model_justification: >-
        For a UOV-type map the totally isotropic subspaces of dimension o are
        expected to be exactly O for a random instance, but 'expected' is doing
        work here and a spurious isotropic subspace of the same dimension is
        possible in principle. The FORGERY certificate does not depend on this
        heuristic at all -- a forged signature that verifies is proof of
        signing capability whatever W is -- which is why forgery, not
        annihilation, is the experiment's success criterion.
      supporting_results: >-
        None cited; none read.
      validation_experiment_ids: []
      falsification_condition: >-
        A recovered W that annihilates the public map but from which no valid
        signature can be produced. That would be a real and reportable
        structural fact about the whipped map.

  target_complexity:
    time_exponent: >-
      No exponent is moved and no asymptotic claim is made. The cost of the
      route, given the signatures, is a single Gaussian elimination on at most
      k(N-1) vectors in F_q^n -- polynomial, negligible, and irrelevant to any
      hardness statement. What the record supplies is a COUNT (signatures), not
      a complexity.
    memory_exponent: >-
      Negligible: O(k n) field elements. Stated so that no downstream table
      leaves the column blank.
    best_known: >-
      Not applicable in the usual sense -- the comparison object is the
      qualitative fault-attack literature relayed by RQ-MAYO-001 (NOT READ). No
      published forced count for MAYO is known to this session, and the honest
      statement is that this program has not looked for one beyond the corpus.
    hidden_overhead: >-
      The threat-model assumption (obtaining the repeated-vinegar signatures)
      is the whole cost and it is not quantified here. That is the largest
      hidden term in the proposal and it is named rather than buried.
    tradeoff_note: >-
      Signatures traded against certainty: N* gives the q-binomial spanning
      probability, and each additional pair drives the failure probability down
      by roughly q^{-k}.

  dominated_by: >-
    n/a on the attack frontier -- no mathematical attack is claimed and the
    route requires an assumption (repeated vinegar) that the map-class attacks
    do not need, so it is not comparable to them on any axis. Rows checked
    across time, memory, and data/queries: the corpus has NO MAYO cost record
    of any kind on any axis (ledger/proposals IDEA-20260801-013..018,
    RQ-MAYO-001, RQ-UOV-001, GOAL-MAYO-001, GOAL-UOV-001, KN-LIT-1205,
    KN-LIT-1818, KN-LIT-7620, knowledge/techniques). On the DATA/QUERY axis
    specifically -- the only axis where this record has a number -- the
    comparison object would be a published signature-count bound for a
    vinegar-reuse attack on MAYO, and NO SUCH NUMBER IS IN THIS CORPUS; the
    relayed fault-attack reports in RQ-MAYO-001 are qualitative. That is a weak
    screen against the external literature and is declared as one.
  sota_delta: >-
    Quantitatively: converts a qualitative relayed statement ('fixing the
    vinegar seed recovers the key') into the derived count N* = 1 + ceil(o/k),
    equal to 2 signatures at three of four recalled MAYO parameter sets and 6 at
    the fourth, with an exact success probability and a certificate. Zero delta
    on time, memory, and every map-class axis.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: >-
    0.85 that the difference identity and the forced count N* = 1 + ceil(o/k)
    survive Stage 0 and the toy measurement. It is high because the derivation
    uses only that O^k is a subspace on which P* vanishes and that the vinegar
    cancels in the difference -- two facts that follow from the construction
    rather than from any parameter choice. It is not higher because the
    signature encoding may not expose all k blocks, because the signing
    procedure is recalled rather than read, and because a deterministic
    right-inverse changes the spanning distribution (though not the
    conclusion). It is not lower because no step depends on an unverified
    external claim. SEPARATELY AND MUCH LOWER: the probability that this tells
    anyone anything they did not already know about fault attacks on MAYO is
    perhaps 0.3 -- the class is known and relayed; the number is what is new,
    and a number is worth having only if implementers did not have it.
