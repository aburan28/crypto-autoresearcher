idea:
  id: IDEA-20260906-a77711
  question_id: RQ-FROB-7d8dd4
  goal_id: null
  added: '2026-09-06'
  title: >-
    THE FROBENIUS GAIN ON THE DECOMPOSITION STEP IS A DIMENSION GAIN, NOT A
    SYMMETRY GAIN. On a subfield curve E/F_q attacked over F_{q^n}, the
    q-Frobenius is an EQUIVARIANCE between the n conjugate descended Semaev
    ideals I_R, I_{R^pi}, ..., never a symmetry of one of them, and it acts
    freely on the union of their solutions; so an invariant-ring rewriting of
    the orbit system has the plain system's Bezout count and needs generators
    of degree n, and no solving-degree drop is predicted (arm A, a closure
    with a named obstruction). The Frobenius object that can move an exponent
    is the trace-zero variety T_n = ker(1 + pi + ... + pi^(n-1)), an abelian
    variety of dimension n - 1 over F_q that contains the prime-order subgroup
    G; a factor base cut out inside T_n decomposes with n - 1 summands, and
    Gaudry's abelian-variety exponent reads q^(2 - 2/(n-1)) on the object
    against q^(2 - 2/n) on the matched non-subfield null at the same N
    (arm B, predicted exponent difference 2/(n(n-1)) in q, toy-testable as a
    measured ratio at n = 3 and n = 5)
  class: mechanism

  claim: >-
    SETTING. E/F_q ordinary, q a prime power, n an odd prime, G a subgroup
    of E(F_{q^n}) of prime order N with G not contained in E(F_{q^d}) for any
    d < n. The q-Frobenius pi acts on G as a scalar mu with mu^n = 1 and
    mu != 1, so ord(mu) = n and every Frobenius orbit in G has exactly n
    points. Because G meets E(F_q) only in O, a target R in G is NEVER a sum
    of F_q-rational points, so the factor base of a subfield-curve index
    calculus cannot be E(F_q) itself. Write F_{q^n} in a normal basis
    theta, theta^q, ..., theta^(q^(n-1)); in that basis pi is the cyclic
    shift of F_q-coordinates.

    ARM A (OBSTRUCTION, ZERO COMPUTE). Let F_V = {P in E(F_{q^n}) with x(P)
    in V} for a pi-stable F_q-subspace V (the only pi-stable subspaces of
    F_{q^n} are the F_q[T]/(T^n - 1)-submodules, i.e. those cut out by the
    factorisation of (T^n - 1)/(T - 1) over F_q; for q a primitive root
    mod n they are 0, F_q, the trace-zero hyperplane and everything). Let
    I_R be the ideal of the Weil-descended system S_{m+1}(x_1, ..., x_m,
    x(R)) = 0, x_i in V. LEMMA A1 (EQUIVARIANCE). Since S_{m+1} has
    coefficients in F_q, the coordinate shift sigma induced by pi satisfies
    sigma(I_R) = I_{R^pi}. LEMMA A2 (FREENESS). For R in G, V(I_R) and
    V(I_{R^pi}) are disjoint (a common decomposition tuple would force
    R = R^pi = [mu]R, impossible), hence the cyclic group C_n generated by
    sigma acts freely on V(I_orb), I_orb = intersection over k of
    I_{R^(pi^k)}, and the quotient variety has exactly |V(I_R)| points.
    CONSEQUENCE A3. Any rewriting of I_orb in the invariant ring
    F_q[c]^{C_n} yields a zero-dimensional system whose degree equals that of
    the plain single-target system, while the invariant ring of a cyclic
    permutation action needs a generator of degree n (recalled; Noether
    bound attained by an orbit product). PREDICTION A. The solving degree
    and variable count of the invariant-rewritten orbit system are NOT lower
    than those of I_R at the same (q, n, m); the same construction applied
    to the null object (n unrelated targets on a curve E'/F_{q^n} not
    defined over a subfield) gives the same numbers within instrument
    noise. The Frobenius contribution to the decomposition STAGE of the
    plain pipeline is therefore a constant (n relations per solve, and n
    fewer unknowns when V is pi-stable), matching the reported factors of
    eprint 2020/1315, and the RQ's option (a) is the predicted verdict for
    the symmetry lens.

    ARM B (THE OBJECT THAT CAN MOVE THE EXPONENT). The trace map
    Tr = 1 + pi + ... + pi^(n-1) is an F_q-endomorphism of the Weil
    restriction Res_{F_{q^n}/F_q}(E) precisely because E is defined over
    F_q (on the null object pi maps E' to its conjugate E'^(q) and no such
    endomorphism exists). Its kernel T_n is an abelian variety of dimension
    n - 1 over F_q, and G is inside T_n(F_q) since Tr acts on G as
    (mu^n - 1)/(mu - 1) = 0. Index calculus on an abelian variety of
    dimension g over F_q with a one-dimensional factor base decomposes with
    g summands and, with double large primes, costs q^(2 - 2/g) up to
    polylog factors (Gaudry, recalled; applied to T_n at n = 3 and n = 5 by
    Gorla and Massierer, existence retrieved, exponent recalled). On the
    object g = n - 1; on the null object the smallest F_q-abelian variety
    containing G' is Res(E') itself, g = n. CLAIM B. At matched field size
    q^n, matched subgroup order N of magnitude q^(n-1), and matched
    factor-base size of magnitude q, the charged index-calculus cost on the
    object scales in q with exponent 2 - 2/(n-1) and on the null with
    exponent 2 - 2/n, a difference of 2/(n(n-1)); the decomposition system
    on the object uses the summation polynomial S_n (arity n - 1) plus n - 1
    trace-zero membership conditions, against S_{n+1} (arity n) on the null.
    The Frobenius-class Pollard rho baseline on the object costs
    sqrt(pi N / (4n)) group operations in expectation (classes of size 2n
    under negation and pi), against sqrt(pi N / 4) on the null. At n = 3
    the object's index-calculus exponent 1 equals the rho exponent
    (N of magnitude q^2), so n = 3 is the boundary case where no crossover
    is predicted; n = 5 is the first case where a crossover in q is
    predicted (1.5 against 2).

    WHAT EACH OUTCOME MEANS. (a) Arm A shows no degree or variable drop on
    the object and none on the null, and arm B shows the measured solve
    counts and stage costs scaling with the predicted exponent gap across
    the toy ladder, then the RQ's Frobenius gain is a constant on every
    stage of the PLAIN pipeline and an exponent on the decomposition stage
    only through the change of tracked object from Res(E) to T_n. (b) Arm A
    shows a replicated degree drop on the object absent on the null, then
    Lemma A2 or the instrument is wrong and that is the headline. (c) Arm B
    shows no exponent gap between object and null at matched N, then either
    H1 (trace-zero factor-base density) or H3 (solve cost flat in q) fails
    at toy scale, and which one is read off the stage-by-stage charges.

  mechanism: >-
    ARM A rests on two facts. First, S_{m+1} for a curve over F_q has
    F_q-coefficients, so Frobenius on the coordinates commutes with the
    descended system up to relabelling the target; this is why the object's
    n descended equations are the n cyclic shifts of ONE polynomial in the
    normal basis while the null's are n genuinely different conjugates.
    Second, a free action of a group of order n on a finite solution set
    divides the count by n and nothing else; the orbit system has n times
    the solutions of I_R, so the quotient has the same number, and the
    price of describing the quotient is the invariant ring, whose
    generators reach degree n. No degree can be saved by a symmetry that
    permutes n copies of the same problem. ARM B rests on the splitting of
    the Weil restriction of a subfield curve up to isogeny as
    E x T_n over F_q, so the prime-order subgroup lives in a variety one
    dimension smaller than on the null; Gaudry's abelian-variety index
    calculus is a statement about the dimension of the variety the factor
    base lives in, so the exponent moves with the dimension. The Frobenius
    is exploited twice in arm B and only as constants in arm A. The trace
    condition Tr(P) = O on a point with x(P) in V_2 is a single
    F_q-codimension-one condition (T_n(F_q) has index about q in
    E(F_{q^n})), so the factor base {P in T_n with x(P) in V_2} for a
    2-dimensional V_2 has about q points and one free dimension, which is
    what Gaudry's algorithm needs.

  novelty_status: unverified

  novelty_screen:
    method: >-
      THE crypto-kb INDEX WAS EMPTY THIS SESSION (':memory:', verified by
      the orchestrator); search_knowledge was NOT called. Screening by
      direct reads of RQ-FROB-7d8dd4, KN-LIT-010, KN-LIT-007, KN-LIT-090,
      KN-LIT-6987, KN-LIT-449, KN-LIT-1402, KN-LIT-3685, RQ-PFDR-ae2fba,
      RQ-SBRG-f31cb2, RQ-ECTD-001, the claim section of
      IDEA-20260807-45a69f, and a ripgrep over ledger/proposals for
      'Frobenius-invariant', 'invariant ring', 'Koblitz', 'subfield curve',
      'Frobenius orbit' (61 files matched; the matches concern
      prime-field automorphism orbits, Balasubramanian-Koblitz, xedni and
      isogeny-graph records; IDEA-20260807-45a69f and IDEA-20260807-9ecc6f
      are the only ones that discuss subfield-curve factor bases, both as
      comparison rows for prime-field records). Two external sources were
      opened with WebFetch this session: the abstract page of eprint
      2020/1315 and the arXiv abstract page of 1405.1059. The full texts
      were NOT read.
    results: >-
      eprint 2020/1315 (abstract, retrieved) claims exactly the constants
      of arm A's prediction (1/n on polynomial systems, n^2 on linear
      algebra, Frobenius for symmetry breaking) with experiments, and
      states this 'gives an answer' to how Frobenius speeds up index
      calculus on subfield curves. Gorla-Massierer (abstract, retrieved)
      apply Gaudry's abelian-variety index calculus to T_n at n = 3 and 5
      with a prototype; their exponent is recalled, not read. No ledger
      record states Lemma A2 (free C_n action, hence no invariant-ring
      degree gain) or compares T_n index calculus against a matched
      non-subfield null at matched N with a Frobenius-class rho row.
    verdict: >-
      UNVERIFIED. Arm B's algorithm is prior art (Gaudry; Gorla-Massierer)
      and is NOT claimed new; what is claimed new to this program is the
      pairing of the two arms as a single discriminating design against
      the RQ's mandatory null object, and the closure argument of arm A.
      Whether 2020/1315 or Gorla-Massierer already contain Lemma A2 or a
      matched-null comparison could not be checked without the full
      texts; a referee should read both before any novelty upgrade.

