  heuristic_assumptions:
    - id: H1
      statement: >-
        TRACE-ZERO DENSITY. For a uniformly random 2-dimensional F_q-subspace
        V_2 of F_{q^n}, the number of P in E(F_{q^n}) with Tr(P) = O and
        x(P) in V_2 is q (1 + o(1)) as q grows at fixed n.
      rigorous_support: >-
        T_n(F_q) has index #E(F_q) (about q) in E(F_{q^n}) (recalled
        structure theorem); the heuristic is that membership in this
        index-q subgroup is equidistributed over the q^2 x-values of V_2,
        imitating equidistribution of a codimension-one subgroup over the
        fibres of a linear family (Lang-Weil for the curve cut out in the
        Weil restriction, whose genus is the risk).
      validation_plan: >-
        Exact counts at n = 3 for q up to 2^9 and 509, and at n = 5 for q
        up to 2^5 and 29, over 20 random V_2 per cell; compare the ratio
        count/q to 1 with its spread; tail check on the smallest ratio.
        Sampled parameters are the ladder's; no transfer beyond it.
    - id: H2
      statement: >-
        DECOMPOSITION PROBABILITY. A uniformly random R in G is a sum of
        n - 1 factor-base points of the T_n base with probability
        1/(n-1)! (1 + o(1)).
      rigorous_support: >-
        Gaudry's abelian-variety heuristic (recalled), imitating the
        expected number of solutions of a zero-dimensional system whose
        expected count is 1 and whose solutions are unordered.
      validation_plan: >-
        Exact enumeration of all decompositions for 200 targets at n = 3
        (q up to 2^7) and Groebner counts at n = 5 (q up to 2^4); compare
        the empirical success rate to 1/(n-1)!; tail check on the maximum
        multiplicity observed.
    - id: H3
      statement: >-
        SOLVE COST FLAT IN q. At fixed n the cost of one decomposition
        solve on the T_n system grows at most polylogarithmically in q.
      rigorous_support: >-
        Gaudry's and Diem's fixed-n analyses (recalled) treat the system as
        of bounded size; KN-LIT-010 and RQ-DREG-001 show the Groebner
        behaviour is delicate, so this is the assumption most likely to
        fail at toy scale and is measured directly.
      validation_plan: >-
        d_reg and wall time per solve across the q ladder at n = 3 and 5,
        object and null; a slope in log q above 1 on the object but not on
        the null refutes H3 for the object.

  target_complexity:
    time_exponent: >-
      Arm B object, conditional on H1-H3 and treated as reported:
      q^(2 - 2/(n-1) + o(1)) at fixed n, i.e. N^((2 - 2/(n-1))/(n-1)) in
      the subgroup order; at n = 5 this is q^1.5 = N^0.375. Arm A: no
      exponent claim (constants n and n^2).
    memory_exponent: >-
      Linear algebra on about q/n unknowns with sparse rows, memory about
      q; the large-prime graph adds memory about q^(1 + o(1)).
    best_known: >-
      Frobenius-class Pollard rho with negation at sqrt(pi N/(4n)) group
      operations and O(1) memory, N of magnitude q^(n-1), i.e. q^((n-1)/2);
      Gaudry index calculus on Res(E') at q^(2 - 2/n) for the null;
      Gorla-Massierer T_n index calculus at n = 3, 5 for the object (the
      same exponent as arm B, since it is the same algorithm).
    hidden_overhead: >-
      Everything in n: the summation polynomial S_n has size 2^O(n^2)
      bits, the trace membership condition has degree exponential in n,
      there are (n-1)! solves per relation, and the o(1) hides the
      large-prime and Groebner factors; none of this is uniform in n, so
      the exponent is meaningless for n growing with the field.
    tradeoff_note: >-
      Relation collection is embarrassingly parallel; linear algebra is
      the memory bottleneck at q/n; rho parallelises linearly with O(1)
      memory and dominates whenever n is not fixed and small.

