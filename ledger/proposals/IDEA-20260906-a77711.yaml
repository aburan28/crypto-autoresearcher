  assumptions:
    - n an odd prime, q a prime power, G of prime order N not in any proper subfield; deployed Koblitz parameters are never instances.
    - The plain pipeline is Gaudry-style with a 1-dimensional V and m = n, or Joux-Vitse-style with m = n - 1; arm A applies to both.
    - Toy scale only (q^n between 2^16 and 2^40); every exponent statement is conditional on H1-H3 and treated as reported until the ladder is measured.
    - The GHS comparison row is run only where KN-LIT-449's applicability condition holds and its genus is recorded per curve.

  proof_search_map:
    bottleneck: >-
      Arm A: Lemma A2 (disjointness of V(I_R) and V(I_{R^pi}) for R in G),
      which is what makes the C_n action free; if a decomposition of R
      could coincide with one of R^pi the quotient would be smaller. Arm B:
      the claim that the trace-zero factor base has about q points and
      that its membership condition does not raise the solving degree above
      the null's by more than a constant in q (H1, H3).
    baseline_embedding:
      parameter_slice: >-
        Arm A at k = 1 (a single target, no orbit) is the plain system and
        must reproduce the program's Groebner-degree instrument on the same
        curve. Arm B on the null object is Gaudry's algorithm on Res(E')
        unchanged; on the object at n = 3 it is the Gorla-Massierer
        setting and must reproduce their reported behaviour once their
        text is read.
      reproduction_check: >-
        Frozen fixture: one subfield curve and one null curve at n = 3,
        q = 2^5 and q = 31; exhaustive enumeration of all decompositions of
        20 targets over the factor base, cross-checked against the
        Groebner solution count; exact orbit counts n per relation.
    observation_collision:
      observable: Solving degree and variable count of the orbit-invariant system (arm A); solve count and total charged cost against q at fixed n (arm B).
      distinct_preimage_search: >-
        Arm A: the null object's 'n random targets' intersection has the
        same shape and the same predicted numbers; agreement is the
        predicted collision and confirms the constant-only reading. Arm B:
        a null curve whose N is matched but whose cofactor structure
        differs could mimic the object's solve-count ratio through
        factor-base density alone; the density is charged separately
        (stage 1) so the collision is separable.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The trace-zero variety T_n replacing Res(E) as the variety the factor base lives in; membership is an exact kernel condition.
        predicted_gain: Dimension n - 1 in place of n, hence 2 - 2/(n-1) in place of 2 - 2/n, conditional on H1-H3.
      - transform: observable_fiber
        proposed_object: The orbit-invariant system on the object versus the same construction on unrelated targets of the null.
        predicted_gain: None (that is the point); a measured difference would falsify Lemma A2.
    quantifier_order: >-
      Arm A: FOR ALL E/F_q, FOR ALL odd primes n, FOR ALL pi-stable V,
      FOR ALL m, FOR ALL R in G: sigma(I_R) = I_{R^pi} and
      V(I_R) is disjoint from V(I_{R^pi}). Unconditional. Arm B: FOR ALL
      fixed odd prime n >= 5, THERE EXISTS a factor-base construction inside
      T_n such that, assuming H1-H3, the expected charged cost is
      q^(2 - 2/(n-1) + o(1)) as q grows; the o(1) and the constants depend
      on n and are not uniform in n.
    method_ceiling:
      strongest_certifiable_claim: >-
        'On subfield curves the Frobenius contributes constants n and n^2 to
        the plain decomposition pipeline and no solving-degree change, while
        the trace-zero variety gives an exponent 2 - 2/(n-1) against the
        null's 2 - 2/n at fixed n, measured at toy scale as a ratio.' It
        certifies nothing for n growing with the field (the deployed Koblitz
        regime, q = 2), nothing at cryptographic size, and nothing about
        prime-field curves.
      nearby_object_control: >-
        Where arm B's conclusion fails by construction: (i) n = 3, where
        the object exponent 1 ties Frobenius-class rho and no crossover is
        predicted; (ii) q = 2 with large n, where the 2^O(n) summation
        polynomial and (n-1)! solves make the exponent statement void;
        (iii) the null object, where T_n does not exist. All three are
        reported, never fitted.
    proof_obligations:
      - claim: Lemma A1 equivariance in a normal basis.
        responsibility: correctness
      - claim: Lemma A2 disjointness and free C_n action on V(I_orb).
        responsibility: strictness
      - claim: The invariant ring of the cyclic permutation action needs a degree-n generator.
        responsibility: size
      - claim: T_n has dimension n - 1 and contains G (recalled literature; to be checked on the fixture by exact point counts).
        responsibility: baseline
      - claim: Factor-base size about q inside T_n with x in V_2 (H1).
        responsibility: feasibility
      - claim: Charged cost exponent 2 - 2/(n-1) under H1-H3 (reported).
        responsibility: runtime
      - claim: Every number is scoped to toy (q, n) and the declared solver.
        responsibility: scope
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: >-
      Arm A: the C_n-orbit of a decomposition tuple (the unordered set of
      its n Frobenius conjugates together with the orbit of the target).
      Arm B: the trace-zero variety T_n and the factor base inside it.
    established_families_off_limits: >-
      Off-limits as the primary lens: Frobenius-orbit relation
      multiplication and n^2 linear-algebra gains (eprint 2020/1315, arm A
      predicts them, does not rediscover them); GHS Weil descent and its
      isogeny extensions (KN-LIT-007, 090, 6987, 449); Frobenius-class rho
      as an attack (baseline only); tau-adic Frobenius expansions of a
      single factor-base point (a table of known multiples, closed by
      IDEA-20260807-45a69f's incidence-oracle argument).
    lossiness: >-
      Arm A: the projection tuple -> C_n-orbit is genuinely lossy (it
      forgets which conjugate, n to 1) and propagates deterministically
      under the operation set {pi on all summands and target, S_m
      permutation, negation}; it does NOT propagate under translation by a
      factor-base point (that changes the target outside its orbit).
      Trichotomy: partial-action, the same class as index calculus itself
      (IDEA-20260806-c5d183). Arm B: the projection E(F_{q^n}) -> Res(E)/E
      (i.e. modulo the E(F_q) summand up to isogeny) is lossy (forgets the
      F_q-rational component, q to 1) and is compatible with translation
      inside T_n, which is exactly why G survives it.
    propagation: >-
      Arm A: exact under pi, S_m and negation; canonicalisation costs n
      shifts plus a sort, O(nm) field operations per tuple. Arm B: exact,
      T_n is a subgroup.
    survival_score: >-
      Arm A survives every subfield curve and every pi-stable V, and yields
      only constants (that is its predicted content). Arm B survives at
      fixed n as long as H1-H3 hold; it dies when n grows with the field.

  null_object_control: >-
    NULL OBJECT, BLOCKING, MATCHED (RQ-FROB-7d8dd4 constraint 1): a curve
    E'/F_{q^n} whose j-invariant generates F_{q^n} over F_q (so E' is not
    isomorphic over F_{q^n} to any curve over a proper subfield, twists
    included), with a subgroup G' of prime order N' with |log2 N' - log2 N|
    <= 1, at the same q and n, with the same factor-base size (about q) and
    the same m; run through the identical solver, the identical orbit
    bookkeeping code (which on E' finds orbits of size 1 and must report
    the gain 1) and the identical rho with negation only. Recipe recorded
    per curve: random (a, b) over F_{q^n}, point count by the harness's
    exact counter, rejection until the cofactor is about q and N' prime.
    DECAY PARAMETER (arm A): k in {1, ..., n}, the number of conjugate
    targets whose ideals are intersected before invariant rewriting; the
    predicted solution count is k times the plain count and the predicted
    solving degree is non-decreasing in k; k = 1 must reproduce the plain
    instrument exactly. DECAY PARAMETER (arm B): the fraction f in {0, 1/4,
    1/2, 3/4, 1} of factor-base points required to be trace-zero (f = 0 is
    an ordinary V_2 base with arity n - 1, underdetermined by n - 2 and
    reported as such); the object's solve-count advantage over the null
    must vanish at f = 0 and appear only at f = 1. A gain flat in k or in
    f is the artifact tell of docs/inventor-protocol.md section 3.
    PLANTED CONTROL: a subfield curve with a pi-stable V of the wrong kind
    (V = F_q), on which zero decompositions of any R in G exist; the
    instrument must report zero relations, not a solver error.

  discriminated_from:
    - >-
      eprint 2020/1315 (Galbraith-Granger-Merz-Petit) -- NEAREST PRIOR ART.
      Frobenius-invariant factor bases, 1/n on polynomial systems, n^2 on
      linear algebra, Frobenius symmetry breaking, experiments on solving
      cost. EXACT DELTA: this record predicts their constants as the
      outcome of a closure argument (Lemma A2) rather than measuring them
      afresh, adds the matched non-subfield null and the Frobenius-class rho
      row, and locates the exponent-relevant Frobenius object in T_n
      rather than in the factor base. Whether their paper already contains
      a matched-null comparison is unknown (abstract only).
    - >-
      Gorla-Massierer 2015 (arXiv 1405.1059) -- NEAREST ALGORITHM for arm
      B. They run Gaudry's index calculus in T_n at n = 3, 5. DELTA: this
      record adds no algorithm; it adds the object-versus-null comparison
      at matched N, the stage-by-stage charging, the rho-class row, and the
      f-decay control; their exponent is a reported number here.
    - >-
      GHS Weil descent (KN-LIT-007, KN-LIT-090, KN-LIT-6987, KN-LIT-449).
      Descends to the Jacobian of a covering curve; applicability governed
      by genus. DELTA: arm B descends to an abelian subvariety of the Weil
      restriction (no covering curve, no genus condition); GHS is a
      comparison row at n in {3, 5, 7} only, with its genus recorded.
    - >-
      IDEA-20260807-45a69f. Prime-field endomorphism orbits reduce to BSGS;
      notes that a Frobenius-stable factor base is cut out by a low-degree
      condition. DELTA: this record is on the subfield curve itself, states
      why the orbit trick gives constants only (free action) and names the
      trace-zero variety as the non-constant object.
    - >-
      RQ-DREG-001 / KN-FIND-006 line (binary Weil-descent Semaev degree
      deficits). DELTA: those curves are defined over F_{2^n}, not over a
      subfield; the deficit measured there is the null-object arm of this
      record's arm A, not its object.
    - >-
      RQ-PFDR-ae2fba, RQ-SBRG-f31cb2, RQ-ECTD-001 exclude Weil descent or
      subfield structure by scope; nothing here bears on prime-field curves.

  predictions:
    - metric: >-
        A1 -- Groebner solving degree d_reg (and first-fall degree d_ff,
        recorded separately per RQ-SBRG constraint) of the invariant-
        rewritten orbit system at k = n versus the plain system at k = 1,
        object arm, at (n, q) in {(3, 2^5), (3, 31), (5, 2^3), (5, 11)}
      direction: different
      minimum_effect: >-
        PREDICTED NO DROP -- d_reg(k = n) >= d_reg(k = 1) on every cell.
        A drop of at least 1 in d_reg or of at least one variable after
        elimination, replicated on two curves and absent on the null,
        falsifies Lemma A2 and is the headline.
    - metric: A2 -- solution count of the orbit system at each k, exact enumeration
      direction: different
      minimum_effect: FORCED, exactly k times the plain count on the object; exactly the sum of k independent counts on the null.
    - metric: A3 -- object-minus-null difference of d_reg at matched (n, q, m, k)
      direction: different
      minimum_effect: PREDICTED ZERO within instrument resolution (one degree step); a replicated nonzero difference is reported as a finding either way.
    - metric: B1 -- factor-base size of {P in T_n with x(P) in V_2} divided by q, exact count
