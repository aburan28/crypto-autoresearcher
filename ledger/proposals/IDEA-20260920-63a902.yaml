idea:
  id: IDEA-20260920-63a902
  question_id: RQ-GFPN-4ab8c7
  added: '2026-09-20'
  status: proposed
  approved_by: null
  title: >-
    SafeCurves-style certificate audit for EcMasFp5 (and EcGFp5 control),
    recomputing the 101.93-bit twist self-report
  class: measurement
  claim: >-
    EcMasFp5's design note self-reports "Twist security (Pollard-Rho): 101.93
    bits" (KN-LIT-47d541). A SafeCurves-style certificate pack that independently
    recomputes twist order, embedding degree, rho cost, and related criteria
    either confirms that figure or replaces it with a sourced certificate.
    EcGFp5 is the matched control.
  mechanism: >-
    Reuse the program's SCURVE certificate machinery where it exists. For each
    curve compute and certify: field, equation, base point, rho, transfer /
    embedding degree, CM discriminant, twist order and twist-rho, ladder /
    completeness / indistinguishability as applicable to short-Weierstrass
    models. Compare every cell to the design-note self-report without copying it.
  novelty_status: unverified
  origin:
    kind: user_supplied_idea
    date: '2026-09-20'
    scope: GFPN intake medium priority; token 63a902 fixed by user.
    overlap_review: >-
      Method overlaps GOAL-SCURVE-* campaigns; object is new (EcMasFp5 / EcGFp5).
      Does not reopen GRUMPY/FROB/QSP.
  citations:
    - ref: inputs/ECMASFP5-HACKMD-2025/note_fulltext.md
      provenance: retrieved
      claim: Self-reports twist security 101.93 bits and ~142-bit field security inheritance.
      verified_by: KN-LIT-47d541
    - ref: inputs/PORNIN-2022-274-ECGFP5/paper_fulltext.md
      provenance: retrieved
      claim: EcGFp5 security argument and embedding-degree discussion as control source.
      verified_by: KN-LIT-8aff72
    - ref: ledger/goals/GOAL-SCURVE-137bd9/goal.yaml
      provenance: internal
      claim: Existing SafeCurves-style certificate campaign pattern in this program.
      verified_by: repository
  citation_note: 101.93 is a self-report comparison target, not a verified level.
  assumptions:
    - Public curve parameters only.
    - Certificates are checkable by a verifier that shares no code with the producer.
  proof_search_map:
    bottleneck: Whether the self-reported twist security survives independent recomputation.
    baseline_embedding:
      parameter_slice: Design-note self-report 101.93 bits.
      reproduction_check: Recompute twist order from the Weierstrass equation before comparing.
    observation_collision:
      observable: Certified twist-rho bits vs 101.93.
      distinct_preimage_search: EcMasFp5, EcGFp5, and a known SafeCurves control curve.
    constructive_transforms:
      - transform: baseline_reproduction
        proposed_object: Independent SafeCurves-style certificate pack.
        predicted_gain: Replace self-report with a checkable certificate.
    quantifier_order: Produce certificates before any pass/fail against the note.
    method_ceiling:
      strongest_certifiable_claim: Parameter audit; not an ECDLP algorithm.
      nearby_object_control: A SafeCurves curve with published twist bits.
    proof_obligations:
      - claim: Twist order factors are certified.
        responsibility: correctness
      - claim: Producer and verifier share no code.
        responsibility: correctness
  predictions:
    - metric: twist_security_bits_certified
      direction: different
      minimum_effect: Certified value equals 101.93 ± 0.1 or a discrepancy is reported with certificates.
  minimal_test:
    design: Compute the full criterion pack for EcMasFp5 and EcGFp5; verify with an independent checker; diff against the design-note table.
    controls:
      - One previously audited SCURVE subject as regression.
    required_metrics:
      - twist_order_bits
      - twist_rho_bits
      - embedding_degree
      - rho_bits
  falsification_conditions:
    - Independent certificate matches 101.93 and all other SafeCurves ECDLP cells pass (audit becomes documentation).
    - Producer/verifier disagreement unresolved (infrastructure, not math).
  confounders:
    - Copying the note's figure into the certificate.
    - Using Pollard-rho constants inconsistent with SafeCurves.
  interpretation_limits:
    - A low twist figure is a protocol-risk finding, not an ECDLP break on the prime-order group.
  heuristic_assumptions: []
  heuristic_note: Parameter audit; no complexity heuristic.
  target_complexity:
    time_exponent: Not applicable.
    memory_exponent: Not applicable.
    best_known: Self-report 101.93-bit twist (KN-LIT-47d541).
    hidden_overhead: Verifier engineering.
    tradeoff_note: null
  estimated_cost:
    implementation: medium
    compute: low
    qualification: Reuses SCURVE tooling where available.
  dominated_by: unchecked
  sota_delta:
    time: Unmeasured.
    memory: Unmeasured.
    data_queries: Unmeasured.
  frontier_check:
    status: pending
    note: Object-new relative to existing SCURVE goals.
  recommended_priority: medium
  priority_rationale: Self-reported twist security is below the advertised ~128-bit story and is unchecked.
  first_deliverable: Independent twist-order certificate for EcMasFp5.
  next_gate: /design-experiment reusing SCURVE certificate format.
