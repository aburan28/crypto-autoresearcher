idea:
  id: IDEA-20260920-63a902
  question_id: RQ-GFPN-c01af8
  added: '2026-09-20'
  status: proposed
  approved_by: null
  title: Certificate-bearing SafeCurves-style parameter audit of EcGFp5 and EcMasFp5
  class: audit
  claim: >-
    Both deployed F_{p^5} curves carry self-reported security properties that
    this program's SCURVE lane routinely recomputes with certificates for
    standard curves: order and cofactor, embedding degree, CM discriminant,
    twist order and twist security, rigidity of the parameter search, and --
    specific to this lane -- the provenance of the "142-bit" field-security
    figure, which the Hermez note inherits from the EcGFp5 note as if it were a
    property of F_{p^5} rather than a raw-system floor. EcMasFp5 self-reports
    twist security of 101.9 bits, which fails the SafeCurves twist criterion
    for any x-only or ladder implementation. The audit records what is
    verified, what is inherited, and what is simply asserted.
  mechanism: >-
    Recompute every SafeCurves criterion from the published equations with
    independent point counting (SEA via PARI/Sage) and factorization
    certificates; reproduce the parameter search scripts (EcGFp5's b = c z^i
    search, EcMasFp5's B = c z^i search) to confirm rigidity; extract the
    security section of each note and tag each figure as computed / inherited /
    asserted.
  novelty_status: unverified
  origin:
    kind: user_supplied_idea
    date: '2026-09-20'
    scope: SCURVE-style audit filed under the GFPN question because the curves' extension-field structure is the point.
    overlap_review: SCURVE covers the SafeCurves list and Ed448-Goldilocks; neither F_{p^5} curve is in it.
  citations:
    - ref: https://eprint.iacr.org/2022/274.pdf
      provenance: recalled
      claim: EcGFp5 parameters, order 2n, embedding degree (n-1)/5 checked, search procedure b = c z^i.
    - ref: https://hackmd.io/@Wimet/S1R3RAY5yx
      provenance: recalled
      claim: EcMasFp5 parameters, prime order, embedding degree n-1, CM discriminant 323 bits, twist security 101.93 bits, inherited 142-bit field claim.
  citation_note: Recalled; freeze both.
  assumptions:
    - Public parameters only.
    - Certificates (factorizations, point counts) are regenerated, not copied.
  proof_search_map:
    bottleneck: None; the audit is bounded work.
    baseline_embedding:
      parameter_slice: One SCURVE curve already audited, re-run as the instrument control.
      reproduction_check: The instrument reproduces that curve's certificate byte-for-byte.
    observation_collision:
      observable: Per-criterion pass/fail with certificate; per-figure provenance tag.
      distinct_preimage_search: Not applicable.
    constructive_transforms: []
    quantifier_order: For each criterion there exists a regenerated certificate or an explicit "not verifiable from the note".
    method_ceiling:
      strongest_certifiable_claim: A certificate-bearing audit table for two curves.
      nearby_object_control: The SCURVE control curve.
    proof_obligations:
      - claim: Point counts and factorizations are independently regenerated.
        responsibility: correctness
  predictions:
    - metric: criteria_verified
      direction: higher
      minimum_effect: All SafeCurves criteria decided with certificates for both curves.
    - metric: inherited_or_asserted_figures
      direction: higher
      minimum_effect: At least the 142-bit figure tagged "inherited raw-system floor" on EcMasFp5.
  minimal_test:
    design: Run the SCURVE audit pipeline on both curves plus the twist computations; produce the provenance table.
    controls:
      - SCURVE control curve reproduced.
    required_metrics:
      - order_certificate
      - cofactor
      - embedding_degree
      - cm_discriminant_bits
      - twist_order_factorization
      - twist_security_bits
      - rigidity_reproduced
      - figure_provenance_table
  falsification_conditions:
    - A self-reported figure does not reproduce (then that is the finding).
  confounders:
    - Different curve models between the note and the implementation repository.
  interpretation_limits:
    - Audit only; no attack cost is derived here.
  heuristic_assumptions: []
  heuristic_note: None.
  target_complexity:
    time_exponent: Not applicable.
    memory_exponent: Not applicable.
    best_known: Not applicable.
    hidden_overhead: Not applicable.
    tradeoff_note: Documentation value; feeds a639a1 and 10547b with verified parameters.
  estimated_cost:
