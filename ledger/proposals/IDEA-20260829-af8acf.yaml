idea:
  id: IDEA-20260829-af8acf
  question_id: RQ-MCE-e65b3c
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    The 2026 line's abstract says the object is MATRICES OF RANK 2 in the code
    of quadratic relations, so stop measuring that code's DIMENSION and measure
    its RANK HISTOGRAM -- with the decisive null being a random matrix code of
    the SAME dimension, which separates 'the rank-2 solutions exist because the
    space is big' from 'they exist because the code is Goppa', and which no
    dimension-based measurement in this bucket can do.
  class: measurement

  claim: >-
    (A) THE OBJECT, taken from primary text fetched this session. The abstract
    of iacr:2026/1232 (KN-LIT-7c4620) states the attack is 'based on a new
    algebraic modeling for finding as in [CMT23,M25,BLT26] matrices of rank 2 in
    the code of quadratic relations related to the Goppa code that is attacked',
    and that 'such matrices are then used to recover the secret algebraic
    structure of the code'. Every structural measurement filed against this
    question so far tracks the DIMENSION of a square code or of its defect. The
    dimension of the quadratic-relations matrix code IS that defect -- it is the
    kernel of the multiplication map from symmetric pairs of dual basis vectors
    to the square code -- so the 14 prior proposals are measuring the SIZE of
    exactly the space the 2026 attack searches, and none of them measures what
    is IN it.
    (B) THE CLAIM. The attack-relevant quantity is not the dimension delta of
    the quadratic-relations matrix code M but the population N_2 of its nonzero
    elements of F_2-rank at most 2, and the two can move independently. For a
    uniformly random subspace of Sym_s(F_2) of the same dimension delta, the
    expected population is (R_2(s) - 1)(2^delta - 1)/(2^Dim - 1) with
    Dim = s(s+1)/2 and R_2(s) the number of symmetric s-by-s matrices over F_2
    of rank at most 2 -- a quantity that is exponentially small in s for any
    delta well below Dim. Measuring N_2 for a Goppa-derived M against a random
    matrix code of MATCHED dimension therefore separates two explanations that
    no dimension measurement can separate.
    (C) THE DISCRIMINATION, declared before the run. E1, POPULATION EXPLAINED BY
    DIMENSION: N_2 for the Goppa arm agrees with the matched-dimension random
    arm within an order of magnitude. Then the rank-2 solutions are a
    consequence of the space being large, the attack is exploiting the same
    square-code defect the distinguisher line already measures, and its regime
    should coincide with the distinguisher's regime. E2, POPULATION EXCEEDS
    DIMENSION: N_2 exceeds the matched-dimension prediction by a factor growing
    with n -- for example scaling like n, which would be consistent with one
    rank-2 solution per support coordinate. Then the rank-2 locus carries
    structure beyond dimension, the attack's regime is not tied to the
    distinguisher's, and the whole 'distance to the distinguisher threshold'
    framing that this goal has been using is measuring the wrong quantity. E1
    and E2 have different consequences for what this program should compute
    next, which is what makes this a discrimination rather than a look.
    (D) NOT CLAIMED. No attack is implemented, no complexity from
    iacr:2026/1232 is reproduced, no claim is made about that paper's modeling
    (its body was NOT fetched -- only the abstract page), no distinguisher is
    built, and nothing is asserted about Classic McEliece's security in either
    direction. The construction of M used here is THIS PROGRAM'S OWN, stated
    explicitly, and the record does not claim it coincides with the one those
    authors use.
    (E) THE CHEAP NEGATIVE THAT WOULD END IT. If the Goppa arm's N_2 is zero at
    every toy cell, then either the construction of M is not the right space or
    rank-2 elements only appear above the toy range, and the record says so and
    stops -- a controlled null under docs/inventor-protocol.md section 3, not a
    finding about Goppa codes.

  mechanism: >-
    STAGE 0, the construction, written down before anything runs. Fix the public
    code C, let D be a shortening of C^perp at a declared set of coordinates,
    with basis d_1..d_s. Define M as the space of symmetric matrices Q over F_2
    with sum over a,b of q_ab (d_a componentwise-times d_b) equal to zero.
    DECLARED CONVENTION, and it is load-bearing in characteristic 2: over F_2 a
    vector's componentwise square is itself, so the diagonal terms are not
    independent of the linear span and the diagonal convention must be fixed in
    the contract. Both conventions -- diagonal free, and diagonal forced to zero
    with M taken inside the alternating subspace -- are computed and reported,
    because choosing one silently is exactly how a char-2 measurement becomes
    uninterpretable.
    STAGE 1, the histogram. For each instance compute the full rank histogram of
    M by exhaustive enumeration where 2^delta is at most 2^22, and by uniform
    sampling with a reported confidence interval above that. Report the whole
    histogram, never only N_2, because the shape is what distinguishes a
    structured space from a large one.
    STAGE 2, the four arms, all at matched (n, k) and all in one invocation.
    (i) GOPPA. (ii) RANDOM ALTERNANT of degree 2t at matched (n, k). (iii)
    RANDOM BINARY CODE at matched (n, k). (iv) THE DECISIVE ONE -- a uniformly
    random subspace of Sym_s(F_2) of dimension exactly equal to the Goppa arm's
    measured delta, which shares the Goppa arm's dimension and nothing else.
    STAGE 3, the genericity prediction. Compute R_2(s) exactly by the classical
    rank enumerator for symmetric matrices over F_2 for s up to the exhaustible
    range, verify it against brute-force counts at s <= 6, and compare arm (iv)
    against it. Arm (iv) agreeing with the formula is the positive control on
    the whole apparatus; if it disagrees, no other arm is interpretable.
    STAGE 4, the two structural sweeps that turn a number into a mechanism.
    (a) Vary the rate by varying t at fixed (m, n) and report N_2 and delta
    together, so the two can be seen to move independently or not.
    (b) Apply the puncturing chain of IDEA-20260829-afa314 and report N_2 as a
    function of puncture depth. If N_2 collapses at the escape depth s*, the
    rank-2 population is caused by the same surplus the deficit budget tracks
    and the two records are measuring one phenomenon; if N_2 survives past s*,
    it is an independent structure and the escape of afa314 does not escape it.
    That single cross-check is the highest-information cell in the design.
    STAGE 5, the cost reading, stated conservatively. Report
    log2(2^delta / N_2), the expected number of uniform draws from M needed to
    hit a rank-2 element, per cell and per arm. This is an EXHAUSTIVE-SEARCH
    exponent and is an upper bound on the algebraic method's cost, not an
    estimate of it; the record says so wherever the number appears.

  novelty_status: unverified
  novelty_screen:
    method: >-
      Read RQ-MCE-e65b3c, RQ-MCE-3f7c02 and RQ-MCE-f8fca0 in full; the prior-art
      list of all 14 proposals on this question and the full text of four of
      them; the titles and claim openings of the seven proposals on
      RQ-MCE-b38a8b and RQ-MCEQ-fcb504. Grepped knowledge/ for 'quadratic
      relation', 'MinRank', 'rank 2' and 'rank-2' (20+ files, none in the
      McEliece line, none defining a quadratic-relations matrix code) and for
      'matrix code of quadratic', '2310.20497' and 'quadratic relationships'
      (NO MATCHES). Fetched the abstract of iacr:2026/1232 on 2026-08-29 and ran
      one web search that returned a paper titled 'On the matrix code of
      quadratic relationships for a Goppa code' at arXiv:2310.20497.
    results: >-
      The corpus contains NO entry for the matrix code of quadratic
      relationships, which is the object the fetched abstract names as the
      attack's setting. Of the 14 priors, IDEA-20260808-3d3be9,
      IDEA-20260816-023239 and IDEA-20260816-ef56f2 all measure the square-code
      dimension defect, which is the DIMENSION of that matrix code and not its
      contents. The three proposals on RQ-MCEQ-fcb504 (IDEA-20260808-0b3072,
      IDEA-20260808-d935d1, IDEA-20260816-e36836) concern matrix code
      EQUIVALENCE and invariant-based distinguishers for it -- a different
      question, filed elsewhere, and this record neither uses nor duplicates
      their instrument.
    verdict: >-
      UNVERIFIED, and the external picture is that the object is well studied by
      others: the fetched abstract cites [CMT23, M25, BLT26] for finding rank-2
      matrices in this space, and a search listing shows a 2023 paper devoted to
      the matrix code of quadratic relationships for a Goppa code. NO EXTERNAL
      NOVELTY IS CLAIMED FOR THE OBJECT. What is claimed is local and specific:
      this repository holds no rank histogram of anything, and the
      matched-dimension random-matrix-code null -- the arm that separates
      'because the space is big' from 'because the code is Goppa' -- is not
      present in any of the 14 priors, all of which compare against random CODES
      rather than against random SPACES of the same dimension.

