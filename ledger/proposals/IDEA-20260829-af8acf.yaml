  object_first_candidate:
    established_families_off_limits: >-
      Off-limits as the primary lens: information-set decoding; square-code
      DIMENSION measurement, which is the lane of IDEA-20260808-3d3be9,
      IDEA-20260816-023239 and IDEA-20260816-ef56f2 and is deliberately used
      here only as a normaliser; support splitting; matrix code EQUIVALENCE
      invariants, which belong to RQ-MCEQ-fcb504; side-channel and fault
      attacks.
    tracked_object: >-
      The rank histogram of the quadratic-relations matrix code M -- the vector
      (h_0, h_1, ..., h_s) counting elements of each F_2-rank -- with N_2 =
      h_1 + h_2 as the attack-relevant summary and delta = dim M as the
      normaliser.
    lossiness: >-
      Genuinely lossy and compatibly so. The projection discards the basis of M,
      the code, the support, the polynomial and the permutation, retaining
      s + 1 counters. The retained part propagates deterministically under the
      target's operations for a specific reason: a coordinate permutation and
      F_2-scaling of the public code induce a change of basis on D, which acts
      on M by congruence Q -> P^T Q P with P invertible, and CONGRUENCE
      PRESERVES RANK. So the histogram is exactly invariant under the group the
      public key is scrambled by, while the individual matrices are not. That is
      the discard-compatibility the lossy-projection test asks for, and it is
      the reason the histogram is a legitimate object rather than a summary
      statistic.
      NOT a change of coordinates: from s + 1 counters nothing about the code is
      recoverable, and two very different matrix codes can share a histogram --
      which is precisely why the matched-dimension null is required and why a
      histogram match is a controlled null rather than an identification.
    propagation: >-
      One step of the operation of interest -- puncturing the public code, per
      IDEA-20260829-afa314 -- changes D, hence M, hence the histogram, in a way
      that is NOT closed-form and must be measured. That is a genuine weakness
      and it is stated: the histogram propagates deterministically under the
      isometry group (by congruence) but not under puncturing, so stage 4(b) is
      a measurement rather than a prediction. The design compensates by
      pre-registering only the DIRECTION of the effect (collapse at s* or
      survival past it) and by treating both outcomes as informative.
    survival_score: >-
      The object survives while M is enumerable or reliably samplable, i.e.
      while delta is at most about 22 for exhaustive counting and while N_2 is
      large enough for sampling to find any at all. At toy cells m in {4,5,6}
      with high rate, s is small and delta is small, so exhaustive enumeration is
      available; the object dissolves the moment delta grows past the sampling
      range, which at m = 13 it certainly does. That is the honest survival
      limit and it is why nothing here is claimed at crypto scale.

  null_object_control: >-
    Four arms and the fourth is the whole point. (1) RANDOM BINARY CODE at
    matched (n, k): its M should have the generic dimension, i.e. delta at or
    near zero, and essentially no rank-2 elements. (2) RANDOM ALTERNANT of
    degree 2t at matched (n, k): the arm that decides whether anything measured
    is Goppa-specific or merely alternant. (3) MATCHED-DIMENSION RANDOM MATRIX
    CODE: a uniformly random subspace of Sym_s(F_2) whose dimension is set to
    the Goppa arm's MEASURED delta. This is the decisive null -- it shares the
    dimension and nothing else, so any excess of N_2 over it is structure rather
    than size. No prior proposal in this bucket has this control, because none
    of them tracks anything but dimension. (4) FORMULA CONTROL: the exact rank
    enumerator prediction for arm (3), verified against brute force at s <= 6.
    Arm (3) failing to match arm (4) voids the entire run, since it means the
    sampling or the enumeration is wrong.

  discriminated_from:
    - >-
      IDEA-20260808-3d3be9, IDEA-20260816-023239, IDEA-20260816-ef56f2. All
      three measure the square-code dimension defect, as a mean, as a per-key
      distribution, or along a ladder of nulls. That defect is dim M. This
      record takes dim M as given and measures what lives inside M. The two are
      separable by a single number: two codes can share dim M and differ in N_2
      by orders of magnitude, and arm (3) is constructed to exhibit exactly that.
    - >-
      IDEA-20260816-e36836, IDEA-20260808-0b3072, IDEA-20260808-d935d1, all on
      RQ-MCEQ-fcb504. Those concern matrix code EQUIVALENCE and whether
      invariant-based distinguishers survive the two-sided action. This record
      is not about equivalence, uses no equivalence invariant, and is filed
      against RQ-MCE-e65b3c.
    - >-
      IDEA-20260808-b9a74c. Refines a per-coordinate signature with the
      Schur-square defect. Same underlying defect, different use: a coordinate
      signature versus a rank population.
    - >-
      IDEA-20260829-afa314 and IDEA-20260829-2d6d63. Those track a dimension
      deficit under an operation; this tracks a rank population. Stage 4(b) is
      the deliberate cross-check between them and is the cell that would tell
      the program whether it is looking at one phenomenon or two.

  assumptions:
    - >-
      The construction of M stated in stage 0 is a reasonable stand-in for the
      space the 2026 abstract names. NOT ASSERTED to coincide with it; the body
      was not fetched and the modeling was not seen. If they differ, this record
      measures its own object and must say so on the face of every table.
    - >-
      The characteristic-2 diagonal convention is a declared choice, not a fact,
      and both conventions are computed.
    - >-
      Rank over F_2 is the relevant rank. The abstract says 'rank 2' without
      naming a field in the fetched text; if the intended rank is over the
      extension field the measurement changes and the record must be superseded.
      This is a real and stated risk of building on an abstract.
    - >-
      The classical rank enumerator for symmetric matrices over F_2 is as
      recalled; it is verified by brute force before use.

  proof_search_map:
    baseline_reproduction: >-
      The exact bottleneck named by the fetched abstract is FINDING MATRICES OF
      RANK 2 in M. The baseline this record must reproduce is not that paper's
      algorithm but the generic count: on a uniformly random subspace of
      Sym_s(F_2) of dimension delta, the measured N_2 must match the exact rank
      enumerator prediction, verified against brute force at s <= 6, before any
      Goppa number is reported. That is the frozen-fixture reproduction, and a
      histogram that merely 'looks similar' to the prediction is not one.
    observation_collision: >-
      The observable is the rank histogram. THE COLLISION IS BUILT IN AND
      ACKNOWLEDGED: two structurally unrelated matrix codes can share a
      histogram, so a histogram match between the Goppa arm and the matched
      -dimension random arm establishes only a controlled null and never an
      identification. The collision to hunt on the other side is a random
      ALTERNANT code whose histogram matches the Goppa code's, which would show
      that everything measured is alternant structure -- arm (2) is exactly that
      search, and finding the collision there forbids any Goppa-specific reading.
    quantifier_order: >-
      For each cell (m, t, n) and each arm, there exists a measured histogram;
      the claim is about the DIFFERENCE of means and tails between arms at
      matched dimension, over the sampled instances, at the stated cell. No
      uniformity over m is claimed and none may be inferred: a trend over
      m in {4,5,6} is three points and is reported as three points. The
      quantifier that must not slip is the one on delta -- arm (3) is matched to
      the Goppa arm's MEASURED delta per instance, not to a nominal one, because
      matching to a nominal delta would silently reintroduce the dimension
      effect this record exists to remove.
    method_ceiling_and_nearby_object_control: >-
      CEILING. Under ideal tuning this method can show that the rank-2
      population of a Goppa-derived matrix code exceeds, or does not exceed, the
      matched-dimension generic prediction at toy parameters. It cannot bound
      the cost of any algebraic method for finding those matrices -- the search
      exponent it reports is for exhaustive search and is an upper bound only --
      and it cannot say anything at m = 13, where M is not enumerable.
      NEARBY OBJECT WHERE THE CONCLUSION MUST FAIL. The matched-dimension random
      matrix code, arm (3): it has the same delta and no algebraic origin, so
      any method that reported the same structural verdict for it has identified
      nothing. Second nearby object: a random alternant code of degree 2t, where
      the hoped-for Goppa-specific conclusion must also fail if the phenomenon
      is really Goppa-specific.

  predictions:
    - metric: >-
        Measured N_2 of the matched-dimension random matrix code arm versus the
        exact rank-enumerator prediction, as a ratio
      direction: different
      minimum_effect: >-
        1.0 within the sampling confidence interval, at every cell. This is the
        positive control; a failure voids the run and no other arm may be
        reported.
    - metric: >-
        log2(N_2 Goppa arm) minus log2(N_2 matched-dimension random arm), at the
        largest toy cell where M is exhaustively enumerable
      direction: higher
      minimum_effect: >-
        Predicted at least 3, i.e. an eightfold excess, as the threshold
        separating E2 from E1. A difference below 1 is reported as E1, a
        controlled null, and is a genuine and useful outcome: it would mean the
        attack's search space advantage is entirely explained by the square-code
        defect this program already measures.
    - metric: >-
        Scaling of N_2 for the Goppa arm against n at fixed m and t, fitted
        exponent
      direction: higher
      minimum_effect: >-
        No magnitude is pre-committed beyond the sign, and inventing one would
        be fabrication since no formula was read. The pre-registered hypothesis
        to be tested is the specific and falsifiable guess N_2 proportional to n
        -- one rank-2 element per support coordinate -- with the alternative
        hypotheses 'constant' and 'exponential in s' both distinguishable from
        it over the toy range.
    - metric: log2(N_2) of the random ALTERNANT arm minus log2(N_2) of the Goppa arm
      direction: different
      minimum_effect: >-
        A difference within 1 means everything measured is alternant structure
        and every table must be relabelled accordingly. A difference above 2 in
        favour of the Goppa arm is the Goppa-specific reading and is the only
        condition under which the word Goppa may appear in the conclusion.
    - metric: N_2 of the Goppa arm as a function of puncture depth, at and past s* = tm/(m-1)
      direction: lower
      minimum_effect: >-
        The pre-registered discrimination is qualitative and sharp - either N_2
        falls to the matched-dimension generic level at or before s*, in which
        case the rank population and the deficit budget of IDEA-20260829-afa314
        are one phenomenon, or it does not, in which case they are two and the
        family escape does not escape the rank structure. Both outcomes are
        recorded with the measured curve.
    - metric: Exhaustive-search exponent log2(2^delta / N_2), per arm and per cell
      direction: lower
      minimum_effect: >-
        Reported as a curve, not a threshold. It is an UPPER BOUND on the cost
        of the algebraic method and must be labelled so wherever it appears.

  minimal_test:
    design: >-
      One cell, exhaustively, in an afternoon. Take m = 5, t = 3, n = 32 and
      shorten C^perp so that s is small enough that Dim = s(s+1)/2 is at most
      about 45 and the measured delta is at most 20, making M fully enumerable
      at 2^20 elements. Build 20 Goppa keys from the certified fixture, 20
      matched random alternant codes, 20 matched random binary codes, and for
      each Goppa instance one uniformly random subspace of Sym_s(F_2) of exactly
      its measured delta. Enumerate M in each case, compute the full rank
      histogram, and print four histograms side by side with the exact
      rank-enumerator prediction as a fifth column. THE DISCRIMINATION IS ONE
      SUBTRACTION: log2 N_2 for the Goppa arm minus log2 N_2 for the
      matched-dimension random arm. If the arms agree, the record is a
      controlled null and the 2026 attack's search advantage is dimensional; if
      the Goppa arm is orders of magnitude richer, the rank locus carries
      structure the entire dimension-based programme in this bucket cannot see.
      Verify the rank enumerator against brute force at s <= 6 first, in the
      same invocation. Compute is seconds to minutes with bit-parallel rank over
      F_2; there is no solver, no Sage, and no network.
    controls:
      - Exact rank-enumerator formula verified against brute force at s <= 6 before any use.
      - Matched-dimension random matrix code, dimension set per instance from the measured delta.
      - Random alternant arm at matched (n, k), the competing family explanation.
      - Random binary code arm at matched (n, k), the generic baseline.
      - >-
        Congruence-invariance check - apply a random invertible change of basis
        to D and confirm the histogram is unchanged, since a histogram that
        moves under congruence is not being computed correctly.
      - >-
        Both characteristic-2 diagonal conventions computed and reported
        separately.
      - Ordering control - all null arms computed, hashed and committed before the Goppa arm is examined.
    required_metrics:
      - full rank histogram per instance per arm, not just N_2
      - measured delta per instance, and the dimension used for the matched random arm
      - exact rank-enumerator prediction and its brute-force verification at s <= 6
      - log2 N_2 differences between arms with sampling confidence intervals
      - N_2 against puncture depth for the Goppa arm, with s* marked
      - exhaustive-search exponent log2(2^delta / N_2) per arm and cell, labelled as an upper bound
      - congruence-invariance pass rate, required 1.0
      - both diagonal conventions, reported side by side

  falsification_conditions:
    - The matched-dimension random arm does not match the rank-enumerator prediction; the apparatus is wrong and nothing may be reported.
    - The histogram changes under a congruence change of basis; the computation is wrong.
    - >-
      N_2 is zero for the Goppa arm at every toy cell. The construction of M is
      not the right space at this scale, or rank-2 elements appear only above
      it; recorded as a controlled null with the cells tested, never as a
      statement about Goppa codes.
    - >-
      The Goppa arm and the matched-dimension random arm agree within a factor
      of 2. Outcome E1: the rank-2 population is explained by dimension alone,
      and the claim that the rank histogram sees something dimension cannot is
      falsified at the tested cells.
    - >-
      The random alternant arm matches the Goppa arm. Everything measured is
      alternant structure; no Goppa-specific statement is permitted.
    - >-
      The two diagonal conventions give qualitatively different answers. The
      construction is convention-dependent, the object is not well defined
      without the body of the source, and the record must be superseded rather
      than patched.

  confounders:
    - >-
      BUILT ON AN ABSTRACT. The entire framing comes from one fetched abstract
      page. The modeling, the exact space, the field over which rank is taken,
      and the shortening pattern are all unseen, and a mismatch on any of them
      makes this a measurement of a different object. This is the dominant
      confounder and no control removes it; only fetching the body does.
    - >-
      SMALL s. At toy cells s is small, so rank at most 2 is a large fraction of
      all ranks and the generic prediction is not small -- the very regime where
      the discrimination is weakest. Cells must be chosen to maximise s subject
      to enumerability, and cells where the generic N_2 exceeds a stated
      fraction of |M| are reported as uninformative rather than analysed.
    - >-
      HIGH RATE. Every toy cell is high rate, the regime where the square-code
      defect and hence delta is largest, so nothing transfers to deployed
      parameters.
    - >-
      SAMPLING BIAS above the exhaustive range. Uniform sampling of a subspace
      finds rare elements poorly; any cell reported from sampling carries a
      confidence interval and a statement of how many rank-2 elements were
      actually observed, not just an extrapolated count.
    - >-
      INHERITED DEPENDENCY on the certified fixture and on the square-code
      routine of the earlier proposals; a bug in either produces a spurious
      histogram difference.

  interpretation_limits:
    - >-
      TOY claim tier, unchanged, and RQ-MCE-e65b3c's own constraint that no
      experiment be designed before KN-LIT-7c4620's primary text is obtained is
      only PARTLY discharged - the abstract page was fetched on 2026-08-29 and
      the body was not. This record is a proposal; the Coordinator must record
      the abstract transcription and the body's continued unavailability, with
      routes tried, before approving anything derived from it.
    - >-
      A rank-2 population is not an attack, not a distinguisher, and not a
      complexity result. The exhaustive-search exponent reported here is an
      upper bound on one search strategy and says nothing about the algebraic
      modeling the source actually uses.
    - >-
      Nothing here reproduces, confirms or contradicts any figure in
      iacr:2026/1232. Its practical demonstrations, its conjectured
      subexponential complexity and its challenge results are quoted from an
      abstract and are not reproduced by this program.
    - >-
      RQ-MCE-f8fca0 records that the arXiv:2304.14757 Goppa exclusion and its
      qualification transfer to NO other paper, including this one. Nothing in
      this record may be read through that exclusion in either direction.
    - >-
      Measurements at m in {4,5,6} do not extrapolate. The only structural
      statement that transfers is the congruence-invariance of the histogram,
      which is an algebraic fact independent of scale.

  heuristic_assumptions:
    - id: HA-1
      statement: >-
        For a uniformly random F_2-subspace M of Sym_s(F_2) of dimension delta,
        the expected number of nonzero elements of rank at most 2 is
        (R_2(s) - 1)(2^delta - 1)/(2^Dim - 1), where Dim = s(s+1)/2 and R_2(s)
        is the exact number of symmetric s-by-s matrices over F_2 of rank at
        most 2; and the observed count concentrates around this mean with
        variance controlled by the second moment over pairs.
      rigorous_support: >-
        Pairs a rigorous count with a classical distribution statement, as the
        target profile requires. RIGOROUS INGREDIENT - the exact rank enumerator
        for symmetric matrices over a finite field, which gives R_2(s) in closed
        form; RECALLED, no author, year or theorem number asserted, and verified
        by brute force at s <= 6 before use. DISTRIBUTION STATEMENT IMITATED -
        the standard first-moment count for a uniformly random subspace meeting
        a fixed set, i.e. the same genericity reasoning that gives the expected
        number of low-weight codewords in a random linear code.
      validation_plan: >-
        Brute-force verification of R_2(s) at s <= 6; then 200 uniformly random
        subspaces per (s, delta) cell with the empirical mean and variance of
        N_2 compared against the first- and second-moment predictions. Tail
        check - the 10 subspaces with the largest N_2 are reported individually,
        since a heavy right tail in the NULL arm would make any Goppa excess
        uninterpretable. Sampled parameters and seeds recorded per cell.
    - id: HA-2
      statement: >-
        For a binary Goppa code at high rate, the population N_2 of the
        quadratic-relations matrix code grows proportionally to n at fixed
        (m, t), i.e. there is a bounded number of rank-2 elements per support
        coordinate.
      rigorous_support: >-
        NONE. This is a GUESS, labelled as such, motivated only by the fetched
        abstract's statement that such matrices 'are then used to recover the
        secret algebraic structure of the code' -- a per-coordinate recovery
        would need on the order of n of them. It is stated as a numbered
        heuristic precisely so it can be falsified cheaply rather than
        functioning as an unexamined intuition.
      validation_plan: >-
        Measured directly by sweeping n at fixed (m, t) across the toy range and
        fitting log N_2 against log n, with 'constant' and 'exponential in s'
        as the pre-registered alternative hypotheses. A fit that supports either
        alternative falsifies HA-2 and is reported as such. Transfer assumption,
        stated - a fit over a toy range of n is not an asymptotic and is not
        extrapolated to m = 13.
    - id: HA-3
      statement: >-
        The space M constructed in stage 0 is, up to the declared diagonal
        convention, the space the fetched abstract calls the code of quadratic
        relations.
      rigorous_support: >-
        NONE, and this is the record's central exposure. The body was not
        fetched. The construction is this program's own and is stated in full so
        that a later session holding the body can check it in one reading.
      validation_plan: >-
        Fetch or otherwise obtain arXiv:2310.20497 and the body of
        iacr:2026/1232, compare the construction, and supersede this record if
        they differ. Until then every table carries the label 'this program's
        construction, not verified against the source'.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. The quantity produced is
      log2(2^delta / N_2), the expected number of uniform draws from M to hit a
      rank-2 element, which is an UPPER BOUND on the cost of one naive search
      strategy and is not an estimate of the algebraic method's cost. The
      measurement itself costs O(2^delta s^3) bit operations for exhaustive
      enumeration, which is why cells are chosen with delta at most about 22.
    memory_exponent: >-
      O(s^2) bits per matrix and O(delta s^2) bits for a basis; negligible.
      Exhaustive enumeration is streamed and stores only counters, so memory is
      O(s) counters regardless of 2^delta.
    best_known: >-
      NOT REPRODUCED. iacr:2026/1232's abstract conjectures that its attack's
      complexity is 'of the same nature as the distinguisher, namely
      subexponential in the security parameter', and reports practical results
      on challenges quoted at 83, 89, 119, 166, 210 and 248 bit security plus a
      CFS key at 74.9 bits in 14 hours and 24GB. Those are quoted from an
      abstract, are not verified here, and no exponent is extracted from them by
      this record.
    hidden_overhead: >-
      Two. First, the exhaustive-search exponent hides the entire difference
      between naive search and algebraic modeling, which is the whole content of
      the source's contribution and is unknown here. Second, the measurement is
      only available where M is enumerable, so every reported exponent comes
      from cells that are by construction the easiest ones, and the direction of
      that bias is not known.
    tradeoff_note: >-
      For the naive search there is a clean time-memory tradeoff worth stating
      because it is the shape of every rank-search problem - a meet-in-the-middle
      over M would look for a collision between two halves of a rank
      decomposition, trading 2^delta time against 2^(delta/2) memory, and
      whether the rank-2 locus admits such a split is a question this record
      does NOT answer and flags as the natural successor if E2 is observed.

  dominated_by: >-
    DOMINATED, decisively and by the object of study itself. Frontier rows
    checked. TIME: iacr:2026/1232 (abstract fetched 2026-08-29) claims a full
    key-recovery attack that already finds these rank-2 matrices by algebraic
    modeling and reports practical results on challenges quoted up to 248 bit
    security; a population count of the space it searches is dominated by an
    algorithm that searches it successfully. MEMORY: this record's measurement
    uses O(s) counters, which is less than any attack, but a memory figure for a
    measurement is not a frontier position. DATA/QUERIES: the measurement
    consumes only public keys it generates itself; the axis is empty.
    PREPROCESSING: none. EXTERNALLY ON THE OBJECT: the space is the subject of a
    2023 paper listed as 'On the matrix code of quadratic relationships for a
    Goppa code' plus the [CMT23, M25, BLT26] line the abstract cites, none of
    which this program has read, so domination on the structural axis must be
    assumed rather than checked and is recorded that way. WITHIN THIS
    REPOSITORY: nothing dominates, since no record measures a rank histogram.
  sota_delta: >-
    No attack; measurement contribution, stated quantitatively. Before: this
    repository holds zero rank histograms, zero entries on the matrix code of
    quadratic relationships (grep for 'matrix code of quadratic',
    'quadratic relationships' and '2310.20497' returns NO MATCHES), and every
    structural measurement in the McEliece bucket compares against a random CODE
    rather than a random SPACE of matched dimension. After: full rank histograms
    on four arms including a matched-dimension null, a verified generic
    prediction, a measured log2 N_2 gap with a pre-registered 3-bit
    discrimination threshold, and a measured curve of N_2 against puncture depth
    that cross-checks IDEA-20260829-afa314's deficit budget. Against the
    published state of the art the delta is zero and is expected to be zero: the
    object belongs to others and this record claims none of it.

  estimated_cost:
    implementation: medium
    compute: medium
    basis: >-
      Bit-parallel F_2 rank over up to 2^22 matrices per instance, times four
      arms times roughly 20 instances times a handful of cells; order 10^4 to
      10^5 core-seconds, still one machine and no dependency beyond pure Python
      with bit tricks. The medium implementation cost is the enumeration and the
      two diagonal conventions, not the linear algebra.
  recommended_priority: medium
  honest_prior_of_survival: >-
    P(the rank-enumerator formula verifies against brute force at s <= 6) = 0.85;
    it is recalled, and the risk is the symmetric-versus-alternating distinction
    in characteristic 2, which is also the record's declared convention hazard.
    P(the matched-dimension null matches the prediction) = 0.85. P(the Goppa arm
    shows a log2 N_2 excess of at least 3 over the matched-dimension null at
    some toy cell) = 0.5 -- the attack's existence suggests structure, but toy
    cells with small s are exactly where the generic count is not small and the
    discrimination is weakest. P(the random alternant arm is indistinguishable
    from the Goppa arm, forcing an alternant-only reading) = 0.45, which would
    itself be a clean and useful outcome. P(this program's construction of M
    coincides with the source's) = 0.4, and that is the number that should
    govern how much weight anyone puts on the result before the body is obtained.

