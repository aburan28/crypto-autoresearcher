idea:
  id: IDEA-20260820-d1ec89
  question_id: RQ-SQISIGN-001
  added: '2026-08-20'
  title: Algebraic Stein operators for verifier-admissible SQIsign transcript neighborhoods
  class: simulator_diagnostic
  claim: >-
    A family of zero-expectation Stein operators defined on public,
    verifier-admissible transcript neighborhoods may provide a falsifiable test
    of a proposed SQIsign transcript simulator. This is a proposed diagnostic,
    not evidence that real SQIsign transcripts are distinguishable or that any
    secret, ideal, or endomorphism data can be recovered.
  mechanism: >-
    Construct public neighbor transitions that preserve the verifier's syntax
    and acceptance predicate. For each bounded test function f, subtract its
    conditional expectation under the proposed simulator transition kernel to
    obtain an operator whose simulator expectation is exactly zero. Evaluate a
    preregistered finite operator family on held-out transcripts. A controlled
    planted positive tilts one admissible transition probability by epsilon
    while renormalizing within the same public acceptance fiber.
  novelty_status: unverified
  status: proposed
  corrects: IDEA-20260820-c69c74
  supersedes: IDEA-20260820-c69c74
  correction: >-
    Preserves the predecessor's algebraic Stein mechanism, genuine-simulator
    null, and epsilon transition-tilt positive. Repairs citation provenance by
    binding each internal source to this task and removes the unsupported claim
    that a GRH boundary is attached. The inherited reductions and heuristics in
    KN-TECH-058 remain unverified and are not used to support this diagnostic.
  source_refs:
    - ref: IDEA-20260820-c69c74
      provenance: internal
      verified_by: TASK-20260820-5f47b5
      use: immutable predecessor whose mechanism is corrected here
    - ref: KN-TECH-057
      provenance: kb
      verified_by: TASK-20260820-5f47b5
      use: conditional SQIsign analysis context only; no security claim imported
    - ref: KN-TECH-058
      provenance: kb
      verified_by: TASK-20260820-5f47b5
      use: baseline caveats; reductions and heuristic assumptions remain inherited and unverified
    - ref: RQ-SQISIGN-001
      provenance: internal
      verified_by: TASK-20260820-5f47b5
      use: research-question scope
  predictions:
    - id: P1
      statement: >-
        Under independently generated genuine-simulator transcripts, each
        standardized operator mean has absolute z-score at most 3 after the
        preregistered multiplicity correction in at least 95% of 100 null
        repetitions at each tested sample size.
    - id: P2
      statement: >-
        For an epsilon transition tilt calibrated to yield expected aggregate
        noncentrality at least 4, the same frozen test rejects in at least 80%
        of 100 planted-positive repetitions.
    - id: P3
      statement: >-
        If the statistic is structural rather than a finite-sample artifact,
        its normalized effect remains within 25% when the sample size doubles.
  controls:
    true_simulator_null: >-
      Generate transcripts solely from the declared simulator, apply identical
      admissibility filtering and analysis, and require calibrated false-positive
      frequency no greater than 0.05 plus Monte Carlo error.
    planted_positive: >-
      Tilt one public admissible-neighbor transition by epsilon, renormalize
      inside the same acceptance fiber, and require detection power at least 0.80.
    observation_collision: >-
      Pair distinct hidden construction paths with the same public transcript;
      the statistic must be identical because it may depend only on public data.
    nearby_object: >-
      Run the operator on a degree-matched synthetic regular graph with no
      SQIsign semantics; any equally strong residual there invalidates a
      SQIsign-specific interpretation.
  falsification_conditions:
    - Genuine-simulator null rejection exceeds 0.05 beyond Monte Carlo error.
    - The frozen test has less than 0.80 power against the calibrated positive.
    - The operator cannot be computed from public verifier-admissible data alone.
    - The effect disappears by more than 25% under sample doubling.
  confounders:
    - Monte Carlo error in conditional expectations
    - nonstationary or nonreversible neighbor construction
    - acceptance filtering that changes the intended null law
    - multiple-testing leakage from operator selection
  interpretation_limits:
    - Passing only validates the finite operator family at tested parameters.
    - Rejection may identify simulator misspecification, not SQIsign leakage.
    - No EndRing, OneEnd, path-finding, key-recovery, or forgery conclusion follows.
  heuristic_assumptions:
    - Conditional expectations can be estimated with bounded error on tested fibers.
    - The frozen public neighbor kernel covers the preregistered observable support.
    - KN-TECH-058 reductions and heuristic assumptions remain inherited and unverified.
  target_complexity:
    time: O(q * m * d)
    memory: O(m + d)
    data: q public transcripts
    scope: q samples, m operators, maximum public neighbor degree d
  cost_model:
    time: q*m*d public transition evaluations
    memory: m accumulators plus one degree-d neighborhood
    data: q independent public transcripts per condition
    preprocessing: freeze neighbor rules, operator family, and multiplicity correction
    oracle_access: none beyond the declared transcript source
    verification: replay verifier acceptance and recompute every operator from public fields
  proof_search_map:
    exact_baseline_reproduction: Reproduce zero expectation exactly on an enumerated toy simulator fiber.
    observation_collision_search: Enumerate hidden-path collisions and verify public-statistic equality.
    quantifier_order_statement: Freeze operators and transition kernel before drawing evaluation transcripts.
    method_ceiling: Bound conclusions to the chosen operator span and tested public fibers.
    nearby_object_control: Apply the same operator family to a degree-matched synthetic regular graph.
  nearest_neighbors:
    - IDEA-20260820-c69c74
    - IDEA-20260820-a0649e
  dominated_by: n/a (no result claimed)
  sota_delta:
    metric: claimed SQIsign security exponent improvement
    baseline: 0
    proposed: 0
    delta: 0
    units: exponent
    rationale: diagnostic proposal only
  recommended:
    next_test: Enumerated-fiber null calibration followed by frozen epsilon-tilt power test.
    stopping_rule: Stop after 100 repetitions per condition or the preregistered precision target, whichever occurs first.
    required_artifacts: [operator_specification, simulator_generator, seeds, raw_statistics, calibration_report]

