      'def meter|def top_form|def macaulay_homog|def trivial_koszul|def
      semireg_Dreg|load(' to locate meter implementations. No web search for
      this corner.
    results: >-
      (1) round005_meter_validation.sage, which EXP-ALPF-011 load()s, is NOT
      archived under any experiments/EXP-ALPF-*/source/ directory; functionally
      equivalent inline copies of top_form / macaulay_homog / trivial_koszul /
      semireg_Dreg / meter exist in EXP-ALPF-009/source (round005_exp008) and
      EXP-ALPF-010/source (round005_exp009), and the gated meter meter_local /
      meter_gated in EXP-ALPF-013/source and EXP-ALPF-017/source. The meter is
