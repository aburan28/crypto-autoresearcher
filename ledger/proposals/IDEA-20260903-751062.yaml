      - 'kernel dimension at d_ff per arm'
      - 'Q1 and vdim per cell, planted and random targets'
      - 'archived-cell reproduction table (16 e-ring, 16 power-sum, 16 x-ring)'
      - 'meter cross-check agreement per cell'
      - 'the frozen Stage-0 prediction file and signed residuals'

