idea:
  id: IDEA-20260903-751062
  question_id: RQ-PFDR-ae2fba
  handoff_id: TASK-20260903-22c36b
  added: '2026-09-03'
  title: >-
    THE ONE RECORDED PRIME-FIELD EARLY FALL IS A CLOSED-FORM MEMBERSHIP
    ARTIFACT AND ITS OWN ARCHIVE ALREADY SAYS SO - EV-ALPF-001 and
    RQ-PFDR-ae2fba quote the EXP-ALPF-011 auto-verdict 'POSITIVE (SURVIVED)',
    but section 8 of the archived result file overturns it, EXP-ALPF-013's
    localization gate fails the e-ring and power-sum fires (on reconstructed
    leading forms, with the exact-builder re-run left undone), and the
    mechanism is derivable at zero compute: reducing t^k modulo
    t^3 - e_1 t^2 + e_2 t - e_3 gives membership constraints whose top forms
    are e_1^{k-3} (e_1, -e_2, e_3), so three non-Koszul syzygies sit at degree
    |FB| - 1 in the membership block for every curve, every p and every target,
    reproducing all 16 archived cells (3 at |FB| = 4, 4 at |FB| = 5) and
    predicting d_ff = |FB| - 1 against D_reg growing at slope 3/2 - a
    superseding measurement contract that separates four mechanisms (genuine
    S-involving fall, membership-only shared-factor syzygy, CRT/unit-ideal
    degeneracy, reduced-basis output-degree proxy) on the exact archived
    builders and states that, under the derivation, NO prime-field early fall
    involving S_{m+1} has been recorded in this program
  class: control

  claim: >-
    (A) WHAT THE LEDGER SAYS AND WHAT THE ARCHIVE SAYS. EV-ALPF-001's
    observation line for EXP-ALPF-011 reads 'POSITIVE (SURVIVED) -- at least
    one PRIME-FIELD m=3 representation genuinely early-falls (d_ff < D_reg)
    under the validated meter'; RQ-PFDR-ae2fba's motivation (iv) and this
    handoff's B2 text repeat it as 'the one recorded prime-field early fall,
    never replicated'. The archived source file experiments/EXP-ALPF-011/
    source/round006_exp010_validated_resweep_result.md carries, in its
    section 8 ('RED-TEAM CORRECTION'), the opposite verdict: the (B) e-ring and
    (C) power-sum fires (16/16 cells each) are 'a COORDINATE ARTIFACT
    shared-factor syzygy - the three FB-membership leading forms all carry the
    factor e1', 'living entirely in the FB constraints, NOT in S4', with a
    generic twin on the identical degree profiles NOT firing, and a corrected
    verdict 'FAILED (BANKABLE NEGATIVE)'. The (A) x-ring baseline never fired
    (0/16, d_ff = D_reg = 10 and 12). The imported EV-ALPF-001 line is the
    Section-5 auto-verdict, not the file's final verdict. Separately, the
    evidence record's EXP-ALPF-001 line ('d_ff ... stays bounded (flat) ...
    strictly below D_reg', the m = 2 symmetric arm) reads d_ff and D_reg off
    the MINIMUM and MAXIMUM total degree of the reduced Groebner basis
    (round001_exp1_firstfall.sage, run_semaev_experiment, 'degs_sym[0]' and
    'degs_sym[-1]'), with a factor base of exactly m = 2 elements - the
    reduced-basis output-degree proxy Q1 of IDEA-20260807-899c5e, with the CRT
    degeneracy of IDEA-20260829-bdca13 / IDEA-20260830-cb8e46 making the
    output basis low-degree by construction. Neither archived arm is a
    replicated prime-field early fall of the summation polynomial.
    (B) THE MECHANISM, DERIVED. In the e-ring representation the factor-base
    constraint is F(t) = prod_{v in FB} (t - v), degree k = |FB|, reduced
    modulo M(t) = t^3 - e_1 t^2 + e_2 t - e_3 to a quadratic in t whose three
    coefficients are the membership generators. Write t^j = A_j t^2 + B_j t +
    C_j mod M; the recurrence A_{j+1} = e_1 A_j + B_j, B_{j+1} = -e_2 A_j +
    C_j, C_{j+1} = e_3 A_j with (A_3, B_3, C_3) = (e_1, -e_2, e_3) gives, by
    induction on j in the standard grading deg e_i = 1, top(A_j) = e_1^{j-2},
    top(B_j) = -e_1^{j-3} e_2, top(C_j) = e_1^{j-3} e_3 (degree j - 2 each).
    Lower powers of t contribute lower e-degree, so the three membership
    generators have top forms h_A, h_B, h_C = e_1^{k-3} (e_1, -e_2, e_3) of
    degree k - 2, all divisible by e_1^{k-3} and proportional to one fixed
    vector. Hence e_2 h_A + e_1 h_B = 0, e_3 h_A - e_1 h_C = 0, e_3 h_B + e_2
    h_C = 0 are three linearly independent non-Koszul syzygies at degree
    k - 1 (Koszul pairs sit at 2(k - 2)). So d_ff = k - 1 exactly, with
    nontrivial kernel dimension 3 at that degree, for EVERY curve, prime and
    target, involving no row of S_4: at k = 4 the S_4 top form (degree 4)
    cannot produce a row at degree 3, and at k >= 5 its rows exist but are not
    needed. ARCHIVE CHECK, ZERO COMPUTE: k = 4 gives d_ff = 3 and k = 5 gives
    d_ff = 4, matching all 16 archived e-ring cells; EXP-ALPF-013's gate table
    records nontriv_full = nontriv_fb = 3 at d_ff = 3 for the e-ring - the
    predicted three syzygies. D_reg for the profile [k-2, k-2, k-2, 4] in 3
    variables from (1 - t^{k-2})^3 (1 - t^4)/(1 - t)^3: k = 4 -> 4, 5 -> 5,
    6 -> 7, 7 -> 8, 8 -> 10 (first non-positive coefficient, computed by hand
    in this record); so the gap D_reg - d_ff is 1, 1, 2, 2, 3 - the 'flat'
    reading of the archive is flatness in p at fixed |FB| (nothing in the
    construction depends on p), not flatness in the factor-base size. The
    power-sum arm is the same mechanism through Newton's identities
    (profile [k-2, k-1, k, 12]) and is not derived separately here.
    (C) THE FOUR MECHANISMS AND THE CELL THAT SEPARATES THEM. For a reported
    d_ff < D_reg on a prime-field representation: M1 GENUINE - a non-Koszul
    syzygy at d_ff with nonzero support on the summation-polynomial rows,
    absent from a support-matched random null; M2 MEMBERSHIP-ONLY - the
    syzygy lives in the membership block (shared factor), present with S_4
    replaced by a random polynomial of the same degree, predicted by (B); M3
    CRT/UNIT-IDEAL - an ideal-invariant reading (reduced basis, vdim,
    staircase) that is trivial because the ideal is radical of dimension equal
    to the decomposition count, often the unit ideal on a random target
    (EXP-ALPF-011's own Discriminator 3 found every toy cell to be the unit
    ideal); M4 OUTPUT-DEGREE PROXY - Q1 of 899c5e, a lower bound on the
    solving degree with no upper information. The separating cell is ONE
    invocation on the EXACT archived builders (build_S4_poly,
    rewrite_S4_in_e_coords, build_fb_constraints_e_ring of the ALPF-011 Sage
    source) at |FB| in {4,5,6,7,8}, with: (i) the shrink test of EXP-ALPF-013
    (nontriv_full versus nontriv_fb at d_ff), (ii) the S_4-scrambled null
    (S4sym replaced by a random degree-4 polynomial in e_1, e_2, e_3, same
    membership generators), (iii) planted decomposable targets so the ideal
    is not the unit ideal, and (iv) the reduced-basis degrees Q1 recorded
    alongside. M1 is the unique pattern 'shrink test positive AND null does
    not fire'; M2 is 'd_ff = |FB| - 1, shrink test zero, null fires
    identically'; M3 is 'Q1 low with unit or near-unit ideal'; M4 is 'Q1 low
    while the Macaulay d_ff is at D_reg'.
    (D) WHY THIS IS A SUPERSEDING MEASUREMENT AND NOT A RE-RUN. Nothing in the
    immutable EXP-ALPF-011 package is edited; the archived numbers stand as
    what they measured. What is missing from the ledger is (1) the evidence
    line reflecting the archive's own final verdict, (2) the closed form (B),
    (3) the exact-builder localization run that EXP-ALPF-013 lists as its
    own unfinished check ('re-run meter_gated on the exact round006 e-ring/
    power-sum builders'), and (4) a |FB| ladder showing d_ff = |FB| - 1
    grows. The deliverable is a new measurement record under a validated
    meter with a matched null, citing the old one, and a proposed correction
    of the RQ's premise: there is no recorded prime-field early fall of the
    summation polynomial; the degree column of RQ-PFDR-ae2fba is, as of this
    record, empty of positives.

  mechanism: >-
    TRACKED OBJECT. The pair (d_ff, localization bit) of the top-form
    syzygy module - the first degree with a non-Koszul syzygy and whether any
    such syzygy has nonzero support on the summation-polynomial rows - the
    object EXP-ALPF-013 defined as gate_meaningful. LOSSY-PROJECTION TEST.
    From the full leading-form Macaulay module the projection keeps one
    integer and one bit and discards the syzygies themselves, the curve, the
    target and the coefficients; it propagates deterministically under the
    Macaulay degree step (the kernel at degree D+1 contains the shifted kernel
    at D, so the localization bit is monotone once set); it is not a change of
    coordinates (the fibre over (3, false) contains every e-ring instance at
    |FB| = 4 on every curve). What it cannot see is the solving degree; that
    is stated as its horizon.
    WHY THE FOUR MECHANISMS ARE SEPARABLE IN ONE RUN. M2 is a statement about
    membership top forms only, so scrambling S_4 leaves it fixed; M1 is a
    statement about S_4's rows, so scrambling S_4 destroys it; M3 and M4 are
    statements about the ideal and the reduced basis, which are blind to the
    generating set (IDEA-20260830-cb8e46 part A, arity-universal), so they are
    detected by comparing Q1 and vdim against the Macaulay d_ff on the same
    instance with a planted target (vdim >= 1) and a random target (vdim = 0
    with probability about 1 - 8 |FB|^3 / p at m = 3).
    THE DECAY CHECK (protocol section 3). Under M2 the gap D_reg - d_ff grows
    with |FB| (1, 1, 2, 2, 3 at |FB| = 4..8) while d_ff itself is |FB| - 1;
    under M1 the gap should also change with the S_4 structure and must
    survive the null; a gap constant in |FB| would be the artifact tell of
    an instrument, not of either mechanism, and is reported first.

