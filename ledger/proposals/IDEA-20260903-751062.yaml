  proof_search_map:
    bottleneck: >-
      The step 'a prime-field representation early-falls under a validated
      meter, therefore the degree column of the RQ has a positive'. This
      record claims the step is invalid for both archived arms and that the
      correct reading of the archive is an empty degree column.
    baseline_embedding:
      parameter_slice: >-
        The archived 16 e-ring cells (k = 4, 5) must reproduce d_ff = 3, 4
        and D_reg = 4, 5 exactly on the exact builders, and the archived
        x-ring cells must reproduce d_ff = D_reg = 10, 12; EXP-ALPF-013's
        gate values (nontriv_full = nontriv_fb = 3 at k = 4) must reproduce
        on the exact builders rather than on reconstructions.
      reproduction_check: >-
        Symbolic: the recurrence in (B) evaluated at k = 4 gives top forms
        (e_1^2, -e_1 e_2, e_1 e_3), matching section 8's h3 = e1^2, h2 =
        -e1*e2, h1 = e1*e3 literally. Frozen: seed 42, the archived curve
        list (13-bit Solinas p = 4079 is named in section 8), the archived FB
        pool.
    observation_collision:
      observable: >-
        The bit 'fires' (d_ff < D_reg) on a homogeneous leading-form meter.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED: the S_4-scrambled null (random
        degree-4 polynomial in e-coordinates with the same membership
        generators) is a distinct ground truth with the same observable
        (fires, d_ff = k - 1, kernel 3). The collision proves that 'fires'
        alone does not identify a Semaev early fall, which is the archive's
        section-8 point made exact.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Reduce the question 'does the e-ring early-fall' to the exact
          statement 'the membership block's top forms are e_1^{k-3} times a
          fixed vector', a divisibility condition checkable by hand.
        predicted_gain: >-
          Replaces 16 measured bits with one two-line induction and a
          per-k prediction.
      - transform: observable_fiber
        proposed_object: >-
          Hold 'fires' fixed and vary the summation polynomial (Semaev versus
          random degree-4); the invariant that separates the fibre is the
          localization bit.
        predicted_gain: >-
          A one-bit certificate that any future prime-field fire must carry.
    quantifier_order: >-
      CLAIMED: FOR ALL k >= 4, FOR ALL p > 3, FOR ALL curves and targets, the
      e-ring membership block has three non-Koszul syzygies at degree k - 1
      and none below, hence d_ff <= k - 1 with equality whenever S_4's rows
      contribute no lower non-Koszul syzygy (which at k = 4 is forced by
      degree). NOT CLAIMED: that S_4 never contributes a syzygy at some k >= 5
      - that is exactly what the shrink test measures.
    method_ceiling:
      strongest_certifiable_claim: >-
        'On the exact archived builders at |FB| in 4..8, three primes and
        three curves, the e-ring and power-sum fires are membership-only
        (shrink test zero, null fires identically) and d_ff = |FB| - 1; the
        m = 2 symmetric arm's flat reading is a reduced-basis proxy; no
        archived prime-field representation carries a summation-involving
        early fall.' It cannot certify anything about representations not in
        the archive, about F4 behaviour, or about any cost.
      nearby_object_control: >-
        The Weil-restricted S_3 over F_{p^2} (EXP-ALPF-013's POS-C), where the
        gate PASSES: the method must distinguish it from the e-ring. A second
        nearby object built for this record: the e-ring with the membership
        constraints replaced by three random quadrics (no shared factor) and
        the genuine S4sym kept - predicted NOT to fire, isolating the shared
        factor as the sole cause.
    proof_obligations:
      - claim: top(A_j, B_j, C_j) = e_1^{j-3} (e_1, -e_2, e_3) for j >= 3 under deg e_i = 1.
        responsibility: correctness
      - claim: The three displayed syzygies are non-Koszul and independent at degree k - 1.
        responsibility: strictness
      - claim: D_reg of [k-2, k-2, k-2, 4] in 3 variables is 4, 5, 7, 8, 10 at k = 4..8.
        responsibility: baseline
      - claim: The exact builders reproduce the archived profiles and integers.
        responsibility: baseline
      - claim: The S_4-scrambled null fires identically (M2) and the random-quadric membership null does not.
        responsibility: interface
      - claim: The evidence supersession changes no immutable record and proposes no status change.
        responsibility: scope

