  heuristic_assumptions:
    - id: H1
      statement: >-
        For a uniformly random affine target and a random factor base of k
        on-curve x-coordinates at m = 3, the e-ring decomposition ideal is
        the unit ideal with probability 1 - 8 k^3 / p (1 + O(t/p)), so the
        archived ALPF-011 cells (k <= 5, p >= 2^13) were unit ideals with
        probability at least 0.87 each and jointly with high probability.
      rigorous_support: >-
        RIGOROUS: KN-FIND-a8990a Theorem C fixes 4 candidate last coordinates
        per pair (complete splitting on the factor-base locus) and the exact
        mean of KN-FIND-007 fixes the expected count; the e-ring ideal is the
        symmetrisation of the direct ideal and is the unit ideal iff the
        direct one is. CLASSICAL DISTRIBUTION IMITATED: Poisson occupancy of
        the 2^{m-1} k^{m-1} candidates in a set of size about p/2 - the same
        imitation as IDEA-20260830-cb8e46's H1.
      validation_plan: >-
        SAMPLE: 200 random targets per (k, p) cell at k in {4..8}, p in {2^13,
        2^17}, three curves; record the unit-ideal indicator by an
        enumeration over k^3 triples with no Groebner call. COMPARISON: the
        closed form per cell, exact binomial test at the 1 percent level.
        TAIL CHECK: the number of failing cells reported rather than the best
        cell. TRANSFER: none; toy only. Used only to justify the planted-target
        arm, never as evidence about yield.

