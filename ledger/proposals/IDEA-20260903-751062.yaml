      and proposing that RQ-PFDR-ae2fba's motivation (iv) be read with the
      correction. THE CHEAPEST VALID DISCRIMINATOR is Stage 0's archive check
      (d_ff = |FB| - 1 reproduces 16/16 integers from a two-line induction)
