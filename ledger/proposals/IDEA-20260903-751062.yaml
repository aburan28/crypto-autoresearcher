      - POS-C and synthetic gate-POS as positive controls for the gate (blocking)
      - meter cross-check inline ALPF copy versus macaulay.py F_p port on every cell
      - archived-cell reproduction, 16/16 integers, before any new cell is read
      - planted versus random target arm with certificates verified by harness/semaev.py's verifier
      - weighted-grading arm (deg e_i = i) reported separately as a convention check
    required_metrics:
