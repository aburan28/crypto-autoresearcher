idea:
  id: IDEA-20260816-5552b8
  question_id: RQ-SIMSPK-f6a6c0
  added: '2026-08-16'
  title: 'One constant set, five measures, one honest number: build the joint null distribution of
    the MAXIMUM standardized rank across the whole computable portfolio by scoring random constant
    sets through the identical pipeline, so that anomalous under some measure is tested as one test
    rather than five, and report the standardized triple''s multiplicity-corrected position.'
  class: composition
  claim: '(A) The RQ asks whether the standardized constants are anomalous under any ONE measure.
    That question, asked naively, is a guarantee of a false positive: with five measures and 4096
    constants, the most extreme rank across measures is extreme by construction, and the more measures
    the portfolio adds the more extreme it becomes. A per-measure percentile is not an answer to the
    RQ''s question, and reporting five percentiles and pointing at the smallest is the exact statistical
    error the campaign is set up to make. (B) The claim is that the correct object is the score VECTOR
    of a constant set, the tuple of its standardized ranks across the portfolio, and the correct statistic
    is a single summary of that vector, specifically T = max over measures m of z_m, where z_m is
    the constant''s rank under measure m rescaled to a common scale. The claim is that T''s null distribution
    is not analytically available, because the measures are correlated in unknown ways, but IS directly
    obtainable by running the identical pipeline on constant sets drawn uniformly at random and recording
    their T values. (C) The claim is that this construction has a property the naive procedure lacks:
    it is monotone-safe under portfolio growth. Adding a sixth measure can only increase T, but it
    increases every null draw''s T identically, so the corrected percentile does not drift upward
    merely because the campaign computed more things. This is the specific property that makes the
    RQ''s any-measure question answerable at all. (D) The claim is that the deliverable is one number
    with an interval, the standardized triple''s corrected percentile of T, plus the identity of the
    measure attaining the maximum, reported separately because the corrected percentile does not license
    a claim about which measure. (E) NOT CLAIMED: that T is the optimal statistic; that the measures
    in the portfolio are the right ones or are complete; that a corrected percentile in either tail
    means anything about design, intent or security; that the null draws are exchangeable with the
    standardized triple in any respect beyond having the same shape; and no attack, distinguisher
    or security consequence.'
  mechanism: 'STAGE A, pipeline freeze: fix the portfolio membership, the per-measure scoring procedure,
    the word size, the round counts and the standardization map from raw measure value to z, and hash
    the whole specification before any constant is scored. The standardization map is the load-bearing
    choice: because measures are integer-valued with heavy ties, z_m is defined as the mid-rank percentile
    within the null family rather than as a mean-and-variance z-score, which is distribution-free
    and immune to a measure''s arbitrary units. STAGE B, null draws: draw N constant sets uniformly
    from the constant space, score each through every measure in the portfolio, and record its full
    score vector. This must run BEFORE the standardized triple is scored, and the run record must
    show the ordering, because a null built after seeing the signal is not a null. STAGE C, empirical
    null of T: for each null draw compute T = max_m z_m using leave-one-out standardization so a draw
    is not standardized against itself, and assemble the empirical distribution of T with its order
    statistics. STAGE D, signal: score the standardized triple through the identical pipeline, compute
    its T against the same standardization, and report its position in the null distribution of T
    as a corrected percentile with a binomial interval reflecting N. STAGE E, decomposition: report
    the per-measure z vector alongside, and the identity of the argmax measure, explicitly labelled
    as descriptive rather than inferential. STAGE F, portfolio-growth check: recompute the corrected
    percentile with each measure held out in turn, showing how much of T depends on any single measure,
    which is the sensitivity analysis the whole construction exists to make possible.'
  novelty_status: unverified
  novelty_screen:
    method: grep -ril SIMSPK over ledger/proposals, ledger/hypotheses and experiments, returning nothing;
      grep -ril 'multiplicity correction' over ledger/proposals with the title block of IDEA-20260813-ebda50
      read; grep -ril 'family-wise' over ledger/proposals with hits enumerated and IDEA-20260807-bd5d91,
      IDEA-20260811-444b45 and IDEA-20260813-ebda50 inspected by filename and area; grep -ril 'max
      statistic|maximum statistic' over ledger; read RQ-SIMSPK-f6a6c0's decision_target, which asks
      whether the constants are anomalous under a specific NAMED measure with a null family deciding
      what the measurement can distinguish; read GOAL-SIMSPK-001's completion criteria and its scoring-table
      requirement.
    results: 'No prior proposal under this question. The ''family-wise'' and ''multiplicity correction''
      hits are numerous but every one inspected sits in another area: IDEA-20260813-ebda50 is titled
      around simulator-coupled pathwise divergence localization and is a measurement proposal in a
      different domain; the others fall in AES, ECDLP and lattice areas. None constructs a max-statistic
      null over a cipher parameter space, and none addresses the specific structure here, which is
      that the portfolio''s measures are correlated by construction because they are computed from
      the same round function. RQ-SIMSPK-f6a6c0 poses the any-measure question directly and its decision_target
      names the null family as what decides which of the two answers the measurement can even distinguish,
      but neither the RQ nor GOAL-SIMSPK-001 states how five per-measure percentiles are to be combined
      into one statement, which is the gap this proposal fills.'
    verdict: 'UNVERIFIED. No claim is made about what any external publication contains. Assembled
      from known parts: max-statistic permutation and resampling nulls are standard multiple-comparison
      practice; leave-one-out standardization is standard; rank-based distribution-free standardization
      is standard. Claimed new only in combination and only locally: applying a max-statistic null
      to a CIPHER PARAMETER SPACE where the correlated measures are all derived from one round function,
      so the correlation structure is inherited rather than assumed, and making the portfolio-growth
      monotonicity property an explicit design requirement so that the campaign cannot manufacture
      significance by computing more measures.'
  object_first_candidate:
    tracked_object: 'The score vector of a constant set: the tuple (z_diff, z_lin, z_imp, z_div, z_rx)
      of its standardized ranks across the portfolio, a point in the five-dimensional rank cube, together
      with the scalar summary T = max_m z_m. What is followed is the vector and its maximum coordinate;
      the object of interest is the joint distribution of these vectors over constant sets, which
      is what carries the measures'' correlation structure.'
    lossiness: 'Genuinely lossy at the summary step and deliberately so. T discards which measure
      attained the maximum, the values of all other coordinates, and the entire dependence structure
      among them. That discard is compatible with the target operation, which is asking one question
      about a whole portfolio, precisely because the null is generated by the same pipeline on the
      same object shape: the correlation T discards from the signal it also discards from every null
      draw, so correlated measures do not inflate the corrected percentile the way five independent
      tests would. The projection from vector to scalar is the only step where information is lost,
      and the argmax identity is carried alongside as a separately reported, explicitly non-inferential
      label so nothing is silently thrown away.'
    propagation: 'The target operation is adding one measure to the portfolio. Under it, T is monotone
      nondecreasing for every constant set, signal and null alike: T_{k+1} = max(T_k, z_{new}). The
      corrected percentile therefore does not drift upward under portfolio growth, because both the
      signal''s T and every null draw''s T are raised by the same operation. One step of the operation
      acts on the null distribution of T by shifting it rightward by an amount determined by the new
      measure''s marginal and its dependence on the existing ones, and that shift is directly observable
      by comparing the distributions before and after, which is what STAGE F reports.'
    survival_score: 'The construction survives as long as the null family is exchangeable with the
      signal in the respects the standardization uses, and it dissolves when it is not. The concrete
      number reported is the leave-one-measure-out stability of the corrected percentile: the maximum
      absolute change in the standardized triple''s corrected percentile across the five hold-out
      recomputations. A stability below a declared band means the conclusion does not rest on any
      single measure; a large value means it does, and the record must then say which measure carries
      it. A second survival number is the effective resolution of T, the number of distinct T values
      among N null draws, below which the corrected percentile is quantized so coarsely that no interval
      statement is possible.'
  null_object_control: 'The null object is a rotation constant set drawn uniformly at random from
    the same constant space, of the same shape as the standardized set, scored through the IDENTICAL
    pipeline with the identical round counts, budgets and censoring rules, in the same invocation.
    The null is not a robustness check here, it is the statistic''s definition: without it T has no
    scale. What the null must show for the signal arm to mean anything: first, that each per-measure
    marginal rank is approximately uniform over the null family, which is a direct check that the
    standardization is doing its job and is falsified by a measure whose ties concentrate mass at
    a few ranks; second, that the empirical distribution of T has at least a declared number of distinct
    values so a percentile can be stated with an interval; and third, that leave-one-out standardization
    changes no null draw''s T by more than a declared tolerance, confirming that the standardization
    is not dominated by any single draw. If any of the three fails, no corrected percentile may be
    reported for the standardized triple at all.'
  discriminated_from:
  - A per-measure percentile table, which is what GOAL-SIMSPK-001's scoring-table criterion literally
    asks for. That table is a required deliverable and this entry does not replace it; it adds the
    one number that the table cannot supply, namely what the smallest of five percentiles means when
    five were computed.
  - IDEA-20260813-ebda50 and the other multiplicity-correction hits in this corpus apply correction
    machinery in other domains and to other objects; none constructs a null over a cipher parameter
    space or inherits a correlation structure from a shared round function.
  - A Bonferroni or Holm correction applied to five per-measure p-values, which would be valid but
    wildly conservative here precisely because the five measures are strongly dependent, all deriving
    from the same round function. The resampling null retains that dependence and is strictly more
    powerful at the same error rate, and the two are computed side by side so the gap is visible.
  - The random-constant null family required by RQ-SIMSPK-f6a6c0's fourth target and by GOAL-SIMSPK-001's
    second completion criterion, which establishes per-measure spread. That null answers what spread
    a measure produces; this entry uses the same draws to answer a different question, what the JOINT
    extreme looks like, and the two must not be conflated.
  - Any claim of the form the constants are anomalous under measure X. This entry deliberately produces
    a statement that does not name a measure, and reports the argmax identity as description only,
    because a corrected percentile licenses one claim about the portfolio and no claim about any member.
  assumptions:
  - The portfolio's per-measure scoring procedures are validated by their own contracts before this
    one runs; a corrected percentile computed over unvalidated measures is a percentile of instrument
    artifacts.
  - Null draws and the standardized set are scored under identical round counts, budgets, censoring
    rules and word size. Any asymmetry, including a longer budget spent on the signal because it was
    interesting, invalidates the null.
  - Rank-based standardization is preferred to mean-and-variance standardization because the measures
    are integer-valued with heavy ties and no common units; this is a stated modelling choice, not
    a neutral one, and the alternative is computed as a robustness arm.
  - Censored cells are handled identically in both arms by a frozen rule, and the censoring rate is
    reported per arm; differential censoring between signal and null would be a direct confound.
  - Orbit representatives from the symmetry-quotient contract are used for both the null draws and
    the signal where available, since drawing null constants uniformly from the raw grid oversamples
    large orbits and is not exchangeable with a representative-based signal.
  predictions:
  - metric: per-measure marginal rank uniformity over the null family, measured as the maximum deviation
      of the empirical rank distribution from uniform
    direction: lower
    minimum_effect: 'forced qualitative requirement rather than a value: each marginal must be uniform
      up to tie quantization, and a measure whose ties concentrate more than a declared fraction of
      mass at one rank is excluded from the portfolio for this statistic and the exclusion is reported'
  - metric: number of distinct values of T among N null draws
    direction: higher
    minimum_effect: 20
  - metric: corrected percentile of the standardized triple's T in the null distribution of T
    direction: different
    minimum_effect: 'explicit refusal to pre-commit: predicting where the standardized triple lands
      would be predicting the answer to the RQ''s central question, which the campaign has no basis
      for. What IS pre-committed is that the percentile is reported with a binomial interval reflecting
      N, that it is reported whatever it is, and that no threshold for calling it notable is chosen
      after the value is seen.'
  - metric: gap between the resampling-based corrected percentile and a Bonferroni correction of the
      five per-measure percentiles
    direction: different
    minimum_effect: 0
  - metric: leave-one-measure-out stability, the maximum absolute change in the corrected percentile
      across the five hold-out recomputations
    direction: lower
    minimum_effect: 'explicit refusal to pre-commit a bound: the stability depends on the measures''
      unknown dependence structure. What is pre-committed is that all five hold-out values are reported
      alongside the headline number, so a conclusion resting on one measure is visible rather than
      hidden.'
  minimal_test:
    design: 'The statistic can be exercised end to end before any expensive measure exists, using
      cheap surrogates, and that is the right minimal test because the thing under test here is the
      STATISTIC, not the cryptanalysis. Fix word size n = 8 and replace the five portfolio measures
      with five cheap surrogates computed from the round function directly: the one-round differential
      weight of a fixed difference, the one-round linear correlation of a fixed mask pair, the support-saturation
      round count, the algebraic degree after two rounds, and a deliberately redundant sixth surrogate
      that is a monotone function of the first, included on purpose so the construction is tested
      against a known-dependent pair. Draw N = 2000 uniform constant sets, score all, compute T with
      leave-one-out standardization, assemble the null, and score the standardized triple. Run the
      Bonferroni comparison and the five hold-out recomputations. Total cost is seconds. The discriminating
      outputs are the marginal-uniformity check, the number of distinct T values, and above all the
      redundant-surrogate check: adding a measure that is a monotone function of an existing one must
      leave the corrected percentile essentially unchanged, and if it does not, the construction is
      broken and must not be used on real measures.'
    controls:
    - 'Redundant-surrogate control: a measure that is a deterministic monotone function of another
      is added to the portfolio, and the corrected percentile must not move materially; movement indicates
      the construction manufactures significance from correlated measures.'
    - Bonferroni comparison computed on the same five per-measure percentiles, reported alongside
      so the power gained by retaining dependence is a visible number.
    - Leave-one-measure-out recomputation, all five, reported as a set rather than summarized.
    - 'Permuted-signal control: replace the standardized triple with a randomly drawn constant set
      and recompute the corrected percentile 200 times; the resulting percentiles must be approximately
      uniform on [0,1], which is the direct check that the whole procedure is calibrated.'
    - 'Ordering audit: the run record must show null draws scored before the standardized triple,
      since a null assembled after the signal is not a null.'
    required_metrics:
    - corrected percentile of the standardized triple's T with binomial interval and N
    - the full per-measure z vector for the standardized triple, and the argmax measure identity,
      labelled non-inferential
    - empirical distribution of T over the null family, with its number of distinct values and order
      statistics
    - per-measure marginal rank uniformity deviation over the null family
    - leave-one-measure-out corrected percentiles, all five
    - Bonferroni-corrected percentile for comparison
    - distribution of corrected percentiles from the 200 permuted-signal calibration draws
    - censoring rate per measure per arm, and wall-clock seconds per stage
  falsification_conditions:
  - The permuted-signal calibration control producing a visibly non-uniform distribution of corrected
    percentiles, which means the procedure is miscalibrated and no reported percentile may be believed.
  - The redundant-surrogate control moving the corrected percentile materially, which shows the construction
    inflates with correlated measures and defeats its own purpose.
  - Fewer than 20 distinct values of T among N null draws, which quantizes the percentile so coarsely
    that no interval statement is possible at that word size.
  - Any per-measure marginal concentrating more than the declared fraction of null mass at a single
    rank, which means the standardization cannot place that measure on a common scale.
  - Differential censoring rates between the signal and null arms, which breaks exchangeability and
    invalidates the null outright.
  - A run record that cannot demonstrate the null was scored before the signal, which invalidates
    the null regardless of the numbers.
  confounders:
  - 'Drawing null constants uniformly from the raw grid while scoring the signal as an orbit representative
    is a subtle exchangeability break: large orbits are oversampled in the null and the standardized
    triple''s stabilizer is not accounted for. Both arms use representatives, or both use the raw
    grid, and the record states which.'
  - Heavy ties quantize the rank standardization so that z_m takes few values, which compresses T
    and makes the corrected percentile coarse; the number of distinct T values is reported precisely
    to expose this.
  - A measure with a much larger censoring rate than the others contributes a z that is partly a ranking
    of solver budget; the per-measure censoring rates are reported per arm and a measure exceeding
    a declared ceiling is excluded from the portfolio with the exclusion recorded.
  - 'Portfolio membership is itself a researcher degree of freedom: choosing which five measures to
    include after seeing per-measure percentiles would invalidate everything, which is why STAGE A
    freezes and hashes membership before any scoring.'
  - The standardized triple is one point, so the corrected percentile has irreducible resolution 1/(N+1)
    and cannot be made arbitrarily precise by cleverness, only by increasing N.
  interpretation_limits:
  - A corrected percentile is a statement about the portfolio as a whole. It licenses no claim about
    any individual measure, and the reported argmax identity is descriptive only.
  - An extreme corrected percentile is a position in a distribution under named measures at a named
    word size and round count. It is not a backdoor, not a trapdoor, not evidence of intent, and may
    not be written as though it were, per RQ-SIMSPK-f6a6c0's fifth constraint.
  - A non-extreme corrected percentile is not a clearance and not an endorsement. It states that the
    tested measures at the tested budget did not separate the standardized constants from random ones.
  - The result is conditional on portfolio membership, which is a choice; a different portfolio is
    a different test and its result is not comparable without recomputing the null.
  - Everything is scoped to the word size, round counts and censoring rules actually run, and none
    of it transfers to deployed word sizes without the separate transfer measurement.
  target_complexity:
    time_exponent: No attack exponent is claimed. Instrument cost is N times the cost of one full
      portfolio scoring, so it is a constant factor N on top of whatever the portfolio costs; with
      N = 2000 and cheap surrogates this is seconds, and with real measures it is N times the per-constant
      scoring cost, which is the dominant budget line and is why the null family is drawn at the smallest
      word size where every measure has resolution.
    memory_exponent: No attack memory exponent is claimed. Storage is N score vectors of five values
      each, 10000 numbers at N = 2000, kilobytes; the pipeline streams rather than holding any measure's
      internal state across draws.
    best_known: The incumbent is reporting five per-measure percentiles and pointing at the smallest,
      which is what the RQ's any-measure question invites and what GOAL-SIMSPK-001's scoring-table
      criterion literally produces. That incumbent has no error control at all. The alternative incumbent
      is Bonferroni correction, which is valid but conservative under the strong dependence present
      here; it is computed alongside so the difference is measured rather than argued.
    hidden_overhead: The dominant hidden cost is that the null must be scored through the full portfolio,
      so the corrected percentile costs N times a portfolio evaluation, and any measure too expensive
      to run N times cannot be in the portfolio at all. That constraint silently determines portfolio
      membership and must be declared in STAGE A rather than discovered in STAGE B. The human overhead
      is freezing membership before seeing per-measure results, which is exactly when the temptation
      to adjust it is strongest.
  dominated_by: 'n/a (no result claimed). A real Pareto check was performed across time, memory and
    data/queries: this proposal produces no attack, no distinguisher and no query-bounded procedure,
    so no frontier row exists on any axis. Among statistical procedures, the resampling null dominates
    Bonferroni on power at equal error control under dependence and is dominated by it on cost, since
    Bonferroni is free and the null costs N portfolio evaluations; both are computed and the gap is
    reported.'
  sota_delta: no attack; conceptual/measurement contribution only. The quantitative deliverables are
    the corrected percentile with its binomial interval at resolution 1/(N+1), the measured gap between
    the resampling and Bonferroni corrections, the five leave-one-out percentiles, and the calibration
    check's departure from uniformity over 200 permuted-signal draws. No time, memory or data complexity
    is compared against any cryptanalytic frontier because none is produced.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'Part (A), that reporting the smallest of five per-measure percentiles
    is an error the campaign would otherwise make: 0.9, since the RQ''s question is literally posed
    as any-measure and the goal''s scoring table produces exactly those five numbers. Part (B), that
    a resampling max-statistic null is constructible here at reachable cost: 0.75, with the main risk
    being that a real portfolio measure is too expensive to run N times, in which case the portfolio
    shrinks and the record says so. Part (C), the portfolio-growth monotonicity property: 0.95, since
    it follows from the definition of a maximum and the null being regenerated. Part (D), that the
    construction passes its own calibration check on first implementation: 0.6, because leave-one-out
    standardization with heavy ties is fiddly and the permuted-signal control is likely to catch a
    first-pass error, which is cheap and is the point of running it. That the standardized triple''s
    corrected percentile lands anywhere notable: deliberately not predicted, and any prior stated
    here would be a prior about the RQ''s answer rather than about this instrument.'
