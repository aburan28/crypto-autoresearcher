idea:
  id: IDEA-20260815-bfb2f2
  question_id: RQ-ECDLP-002
  added: '2026-08-15'
  title: >-
    THE CERTIFICATE CONTRACT IS THE CAMPAIGN'S LOAD-BEARING INTEGRITY CLAIM
    AND HAS NEVER BEEN ADVERSARIALLY TESTED: submit deliberately invalid
    solves and confirm the verifier rejects every one
  class: control

  claim: >-
    AGENTS.md rule 4 requires every claimed solve or relation to carry a
    certificate that the run wrapper re-verifies independently. The whole
    campaign's trustworthiness rests on that verifier. A verifier nobody has
    attacked is an assumption, not a control. This record submits
    deliberately malformed, near-miss and adversarially crafted certificates
    and reports what gets through.

  mechanism: >-
    Construct invalid certificates across classes: wrong point, point off
    curve, correct point wrong scalar, valid relation for a different
    instance, replayed certificate, and off-by-one scalar. Submit each and
    record the verifier's verdict.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Grep 'certificate' across the corpus and read docs/claims-and-
      verification.md; check for any record testing the verifier
      adversarially.
    results: >-
      The certificate contract is stated and used throughout; no record
      attacks the verifier with invalid submissions.
    verdict: >-
      ADAPTATION. Negative testing is elementary; that the campaign's
      central integrity control has not received it is the finding this
      record acts on.

  object_first_candidate:
    tracked_object: >-
      THE VERIFIER'S VERDICT on deliberately invalid certificates.
    lossiness: >-
      A verdict is one bit and discards the reason, which the record
      captures separately where the verifier reports one.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while the verifier is callable in isolation; classes it
      cannot even parse are reported rather than counted as rejections.

  null_object_control: >-
    NULL 1 -- valid certificates, which must all be accepted; a verifier
    that rejects everything is trivially sound and useless. NULL 2 -- a
    certificate valid for a different instance, which is the most likely
    real-world confusion and must be rejected.

  discriminated_from:
    - >-
        The run wrapper's existing use of the verifier, which exercises
        the accepting path only.
    - >-
        The evidence-integrity rules in AGENTS.md, which state the
        requirement; this record tests whether the implementation meets
        it.

  assumptions:
    - >-
        The verifier is callable in isolation with constructed inputs.
    - >-
        The invalid classes are constructible; a class that cannot be
        constructed is reported rather than assumed handled.

  predictions:
    - metric: >-
        valid-certificate null
      direction: different
      minimum_effect: >-
        FORCED all accepted; a verifier rejecting valid certificates is
        broken in the other direction.
    - metric: >-
        each invalid class
      direction: different
      minimum_effect: >-
        FORCED all rejected. A single acceptance is a critical finding
        about the campaign's integrity control.
    - metric: >-
        cross-instance certificate
      direction: different
      minimum_effect: >-
        FORCED rejected; this is the likeliest real confusion and the
        most important single cell.

  minimal_test:
    design: >-
      All invalid classes plus both nulls against the current verifier.
    controls:
      - >-
          Valid-certificate acceptance null.
      - >-
          Cross-instance rejection null.
      - >-
          Unconstructible classes reported rather than silently omitted.
    required_metrics:
      - >-
          Verdict per invalid class, with reason strings where
          available.
      - >-
          Valid-certificate acceptance rate.
      - >-
          List of unconstructible classes.

  falsification_conditions:
    - >-
        Any invalid certificate is accepted. Critical: every evidence
        record resting on that verifier is suspect and the Coordinator
        must be notified before anything else.
    - >-
        Valid certificates are rejected. The verifier is broken in the
        permissive-blocking direction.
    - >-
        The verifier cannot be called in isolation. It is untestable,
        which is itself a serious finding about the control.

  confounders:
    - >-
        FALSE ASSURANCE: passing this test shows the verifier rejects the
        classes tested, not that it is sound; the class list's
        completeness is not claimed.
    - >-
        VERSION BINDING: the result is about one verifier version and must
        be re-run when it changes.

  interpretation_limits:
    - >-
        Tests one control; establishes nothing mathematical.
    - >-
        A pass is scoped to the constructed classes only.
    - >-
        A failure invalidates evidence resting on the verifier and must be
        escalated rather than filed.

  heuristic_assumptions:
    - id: HEUR-CERT-COV-1
      statement: >-
        The constructed invalid classes cover the ways a wrong
        certificate could be produced by a buggy or adversarial
        executor.
      rigorous_support: >-
        Rigorous ingredient: the classes are read off the certificate's
        fields, so each field's corruption is enumerable. THE GAP:
        coverage of ADVERSARIAL construction is not provable, and an
        executor designed to fool the verifier would target exactly what
        nobody enumerated.
      falsification_condition: >-
        An acceptance of an invalid certificate outside the constructed
        classes.
      validation_plan: >-
        SAMPLE: all constructed classes plus an adversarial attempt to
        craft an accepted invalid certificate. TAIL CHECK: any near-
        acceptance, reported in detail. TRANSFER: none beyond the tested
        verifier version.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is one verifier call per constructed
      certificate.
    memory_exponent: >-
      Negligible.
    best_known: >-
      No incumbent verifier test exists here; the run wrapper's accepting
      path is the only exercise the verifier currently gets.
    hidden_overhead: >-
      Constructing genuinely adversarial certificates is much harder than
      constructing malformed ones, and only the former tests the control
      properly.
    tradeoff_note: >-
      Negative testing is cheap and bounded; its value is entirely in the
      completeness of the class list, which cannot be established.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As cryptanalysis: nothing is mounted. As a
    control test: none exists here for the campaign's central integrity
    mechanism. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: an adversarial test of the
    verifier every evidence record in this campaign depends on, with per-
    class verdicts and an explicit statement that class coverage is not
    claimed.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.9 that the verifier is callable in isolation. 0.85 that it rejects all
    malformed classes. 0.2 that some near-miss or cross-instance class is
    accepted, which would be a critical finding and is the reason to run
    this at high priority despite its simplicity.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
  source_refs:
    - RQ-ECDLP-002
    - GOAL-ECDLP-001
    - docs/claims-and-verification.md
    - KN-TECH-056
    - KN-TECH-080
    - docs/inventor-protocol.md
  id_allocation_provenance: >-
    Minted with `python3 tools/allocate_id.py --next idea --date 20260815`
    and verified free with `--check` before use; no state was scanned for a
    "next free number".
