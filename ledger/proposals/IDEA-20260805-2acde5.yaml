idea:
  id: IDEA-20260805-2acde5
  question_id: RQ-SQISIGN-39f231
  added: '2026-08-05'
  title: >-
    Where the confidence actually rests: audit the two sentences in SQIsign's
    own Section 10 that carry the post-SIDH argument -- the unreduced
    non-smooth-degree residual in Section 10.2.3, and the Section 10.2.1
    best-known-attack figure that this repository already holds a 2026 result
    against
  class: control

  claim: >-
    If the audit of IDEA-20260805-c4ae3d holds, the headline claim about
    SQIsign is TRUE: no torsion image of the secret isogeny is published. That
    outcome is only useful if the audit then says where the load actually sits,
    because a verified true sentence can still be the wrong sentence to have
    verified. Reading Chapter 10 of the specification rather than the status
    report about it locates two places, and both are cheap to audit and neither
    is in this corpus. FIRST, Section 10.2.3 concedes in its own words that
    signature forgery reduces to "the endomorphism ring problem with hints",
    that a reduction to the plain problem WOULD follow if all the hint degrees
    were smooth, that in SQIsign they are not, and that "this prevents a
    reduction between the two problems" -- and then defends the gap by observing
    that "the best known attack against the endomorphism ring problem with hints
    disregards the additional information." That is the argument form whose
    failure in 2022 is the entire content of KN-OPEN-015: an absence-of-attack
    record standing in for a reduction, on exactly the axis of auxiliary
    published structure. SECOND, Section 10.2.1 states the best-known attack as
    Otilde(p^{1/2}) classical with "low memory requirements" and Otilde(p^{1/4})
    quantum -- and this repository already holds, frozen and read, a 2026 result
    whose own concrete-cost table has rows LABELLED "SQIsign NIST-I / III / V"
    at time >= 2^106.5 / 2^157.5 / 2^204.2 with memory >= 2^92.5 / 2^138.6 /
    2^181.3. The claim of this proposal is that both audits are pen-and-paper,
    both produce numbers, and the honest result of the second is a PARETO TRADE
    rather than a break -- which is precisely the kind of result the program's
    own cost-honesty rules say must be recorded and which nobody has recorded
    for this scheme.

  object_first_candidate:
    tracked_object: >-
      THE DEGREE-ANNOTATED ISOGENY LEDGER. For a fixed public key, the multiset
      of pairs (isogeny handed to the adversary by the published surface, what
      the surface says about its degree), accumulated over Q signatures. Each
      entry is tagged with three bits of structure: is the source or target
      curve secret-bearing; is the degree smooth; is the EXACT degree determined
      by the surface. The tracked object is that ledger, and the question is
      which entries the specification's own reduction argument covers and which
      it concedes it does not.
    established_families_off_limits: >-
      Off-limits as the primary lens: Kani / higher-dimensional embedding, which
      is IDEA-20260805-c4ae3d's lens and is deliberately not reused here;
      lattice reduction; generic claw search; side channels; hash-function
      attacks. ALSO EXPLICITLY OFF-LIMITS AS A TARGET, by this goal's
      non_duplication block: the hardness of the endomorphism ring problem and
      of isogeny path-finding, and the KN-TECH-057 matched baselines, which are
      GOAL-SSI-001's property. THIS PROPOSAL COSTS NO HARD PROBLEM AND CLAIMS
      NOTHING ABOUT ONE. It audits two sentences in a published specification and
      compares one stated figure against a result already frozen in this
      repository. Likewise off-limits: transcript-versus-simulation
      distinguishing (GOAL-SQISIGN-001). The Section 10.2.4 zero-knowledge
      assumption is NOT audited here and is named only to say it is not.
    newness_score: >-
      Auditing a load-bearing constant in a submission's own security chapter is
      the move the 2026-08-05 scouting sweep found this program has left alone
      most often; it has never been applied to any isogeny submission here, and
      area SQISIGN has zero records of any kind. The specific comparison -- a
      Round-3 candidate's stated best-known-attack figure against a 2026 result
      whose own table names that candidate's parameter sets, held frozen in this
      repository since 2026-07-24 -- is available to this program and has not
      been made. The Section 10.2.3 audit is a quantifier-and-reduction reading
      of a paragraph; that is not a new technique, but the paragraph has not been
      read here before.
    testability_score: >-
      The Section 10.2.1 comparison is arithmetic on figures already in the
      repository and takes minutes. The Section 10.2.3 audit is a careful read
      plus an enumeration derived from Algorithms 4.2 and 4.9, and its
      quantitative half -- how many non-smooth-degree isogenies per signature,
      of what size, with what degree knowledge -- is derivable without any
      computation.
    survival_score: >-
      The isogeny ledger survives the whole transcript and grows linearly in the
      number of signatures, which is what makes it worth tracking: the
      specification's own argument is about what accumulates. It dissolves at the
      point where one asks what an attacker could DO with the accumulation, which
      is where this proposal stops and says so.

  mechanism: >-
    SOURCES. Specification facts from "SQIsign Algorithm specifications and
    supporting documentation, Version 2.0.1", July 7 2025, fetched 2026-08-06
    from https://sqisign.org/spec/sqisign-20250707.pdf, extracted with a
    pure-zlib stream extractor (no working PDF tooling in this container).
    Wesolowski figures from docs/target-result-profile.md section A8, which
    tabulates them from the frozen full text at
    inputs/P13-WESOLOWSKI-2026/paper_fulltext.md. THE WESOLOWSKI PAPER ITSELF WAS
    NOT READ IN THIS SESSION; the figures are taken from an in-repository
    analysis document that states it read it, and re-reading the frozen text is a
    declared experiment stage.

    PART A -- THE SECTION 10.2.3 RESIDUAL.
    What the specification says, in substance and closely following its wording:
    forging a signature requires breaking a version of the endomorphism ring
    problem WITH HINTS, in which the adversary is given a target curve E and a
    list of isogenies from E of varying degrees. If the degrees were all smooth,
    the hints would provide no additional information, because anyone can sample
    random smooth-degree isogenies from any curve, and the two problems would be
    equivalent. In SQIsign the hints also contain isogenies of NON-SMOOTH degree,
    which PREVENTS a reduction between the two problems, because sampling
    non-smooth-degree isogenies without knowing the starting curve's
    endomorphism ring is generally believed to be hard -- indeed a recent
    proposal bases its security on that. The section then argues it is unlikely
    that non-smooth degrees help, conceptually, and observes that the best known
    attack disregards them, so the best known attack costs the same as for the
    generic problem.
    THE AUDIT, IN THREE STEPS, ALL PEN-AND-PAPER.
    (1) QUANTIFIER READING. Write the reduction the paragraph offers with
    explicit quantifiers. The smooth case is: FOR ALL adversaries A against the
    hinted problem THERE EXISTS a simulator S that produces the hint list from
    the target curve alone, so the hinted problem reduces to the plain one. The
    simulator's existence is CONSTRUCTIVE and unconditional for smooth degrees.
    The paragraph then states that the non-smooth case admits no such simulator
    and substitutes a DIFFERENT statement, of the form: the best known attack
    does not use the hints. That is a statement about the current state of the
    art, quantified over KNOWN attacks, not over all adversaries. The audit's
    deliverable is that substitution, written out, with the two quantifier
    prefixes side by side. This is inventor-protocol section 8 audit 3 applied to
    a published security argument and it costs one careful read.
    (2) THE ENUMERATION. From Algorithm 4.2 and Algorithm 4.9, list what one
    signature hands an adversary who holds pk. The challenge isogeny phi_chl :
    E_pk -> E_chl with kernel <[2^{n_bt}](P_pk + [chl] Q_pk)> has degree
    2^{f - n_bt}, which is SMOOTH and moreover self-samplable: anyone may pick a
    fresh chl' and walk the same construction, so by the paragraph's own argument
    it is free. The response isogeny phi_rsp : E_com -> E_chl has degree d_rsp =
    q_rsp * 2^{r_rsp} with q_rsp odd, bounded by 2^{e_rsp}; its odd part is
    NON-SMOOTH in general and it is exactly the entry the paragraph concedes it
    cannot simulate. E_aux carries the Kani complement of degree
    2^{e'_rsp} - d_rsp. The FORCED COUNT, derived before any run: per signature,
    exactly ONE entry of the ledger has non-smooth degree, and it is
    phi_rsp; over Q signatures the residual is Q such entries, with pairwise
    distinct commitment curves. Two integers are published in the clear that
    describe it: n_bt and r_rsp, one byte each (Section 4.6), which give the
    backtracking length and the dyadic valuation of the response degree
    directly.
    (3) THE ITEM THE INVENTORY MUST SETTLE AND THIS RECORD DOES NOT. Is the EXACT
    value of d_rsp determined by the published surface? The verifier never needs
    it: Algorithm 4.9 computes only e'_rsp = e_rsp - n_bt - r_rsp and runs a
    (2,2)-chain of that length. So the surface may hand over a non-smooth-degree
    isogeny WITHOUT its exact degree, which matters because the Kani template
    needs the degree and the specification's own hint problem is stated in terms
    of isogenies "of varying degrees". THIS IS FLAGGED AS AN OPEN INVENTORY ITEM,
    NOT ANSWERED. It is the sharpest single question the enumeration produces and
    it is cheap.

    PART B -- THE SECTION 10.2.1 FIGURE.
    Stated in the specification: the best algorithm for finding one non-scalar
    endomorphism of a random supersingular curve runs in O((log p)^2 p^{1/2}),
    i.e. Otilde(p^{1/2}), with LOW MEMORY REQUIREMENTS; quantumly Otilde(p^{1/4})
    with low memory; and since p is approximately 2^{2 lambda} the best known
    attack costs Otilde(2^lambda) classically and Otilde(2^{lambda/2})
    quantumly. Held in this repository, frozen since 2026-07-24 and analysed in
    docs/target-result-profile.md section A8: a p^{1/3+o(1)} time-AND-memory
    algorithm whose concrete-cost table has rows explicitly labelled with
    SQIsign's parameter sizes --
      log2 p ~ 256 (labelled SQIsign NIST-I):   time >= 2^106.5, memory >= 2^92.5,  previous ~2^128, negligible memory
      log2 p ~ 384 (labelled SQIsign NIST-III): time >= 2^157.5, memory >= 2^138.6, previous ~2^192
      log2 p ~ 512 (labelled SQIsign NIST-V):   time >= 2^204.2, memory >= 2^181.3, previous ~2^256
    THE ARITHMETIC, AND IT IS THE WHOLE OF PART B: the stated time figures sit
    21.5, 34.5 and 51.8 bits below the specification's Otilde(2^lambda) framing.
    THE HONEST READING, WHICH IS THE DELIVERABLE AND IS NOT A BREAK CLAIM:
    (i) the specification is dated 2025-07-07 and the result is later, so this is
    a staleness finding about anyone evaluating the document today, not a defect
    in it; (ii) the comparison is NOT a domination but a PARETO TRADE, because
    the incumbent has negligible memory and the new point needs 2^92.5 or more,
    so under any full-cost or area-time model the ranking may reverse and MUST be
    recomputed rather than assumed -- this is the exact move the program's own
    cost-honesty rules require and the one docs/target-result-profile.md flags in
    its own exemplar; (iii) the o(1) in p^{1/3+o(1)} hides a SUPERPOLYNOMIAL
    overhead, which the source itself states, and the concrete table is flagged
    by its own author as making optimistic assumptions; (iv) the table's rows are
    at log2 p = 256 / 384 / 512 while SQIsign's actual primes are 250.32 / 382.02
    / 504.75 bits, so the rows are near-neighbours, not the parameter sets, and
    interpolating is a further step that must be shown rather than assumed.
    The deliverable is therefore a (time, memory) table for SQIsign's three
    parameter sets carrying BOTH points and an explicit statement of which
    dominates under which cost model -- the memory column the specification's
    Section 10.2.1 does not carry.

  novelty_status: unverified

