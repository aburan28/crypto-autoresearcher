      specification's, not this program's. Resolving it matters, because it is
      the one external support the paragraph offers for its own concession.
    - >-
      NOT READ -- relayed claim. NIST IR 8610's SIKE-resilience sentence, and its
      recommendation that future effort prioritise study of SQIsign's security
