  lossy_projection_identifiability_audit:
    projection: >-
      Full signature transcript over Q signatures --> the ledger of
      (curve-pair, degree-class, degree-known) triples, discarding every
      coordinate and every matrix entry and keeping only smoothness and
      degree-knowledge tags.
    what_is_discarded: >-
      All field elements, all matrices, all hints, all messages. Only a
      three-bit tag per isogeny survives.
    why_genuinely_lossy: >-
      Severely lossy: an enormous fibre. That is intended -- the projection is
      built to match the granularity of the specification's OWN argument, which
      is stated entirely in terms of degree smoothness and simulability and never
      touches a coordinate. Matching the granularity of the claim being audited
      is what makes the audit a test of the claim rather than of something
      nearby.
    why_compatible_with_the_operations: >-
      Compatible with composition, which is the only operation the argument
      performs on the ledger: the smoothness tag of a composite is the
      conjunction of its parts, and degree-knowledge is preserved under
      composition of known-degree maps. So the retained part propagates
      deterministically through the exact reasoning the paragraph uses.
    is_it_only_a_change_of_coordinates: >-
      No -- everything algebraic is discarded and is not recoverable from the
      tags. THE FAILURE MODE CHECKED FOR IS THE MIRROR ONE, a projection so lossy
      it is constant across instances, and the check RETURNED A PARTIAL POSITIVE
      that must be reported rather than hidden: the ledger's SHAPE is constant
      across signatures by construction (every signature contributes the same
      pattern of one smooth self-samplable map plus one non-smooth map), so the
      per-signature statistic has zero spread. What varies, and what carries the
      content, is the COUNT across Q and the degree-knowledge tag, whose value is
      not yet settled (Part A step 3). An audit that reported only the constant
      shape would be reporting a constant of the apparatus, and the contract must
      report the count and the tag or report nothing.
    identifiability_note: >-
      Two schemes with identical ledgers can have entirely different security.
      The projection therefore cannot support any hardness conclusion, which is
      consistent with this proposal claiming none.

  assumptions:
    - >-
      That docs/target-result-profile.md's section A8 table faithfully reproduces
      the frozen paper's table. Not re-verified in this session; re-reading the
      frozen text is a declared stage and the figures are labelled accordingly.
    - >-
      That the specification's Section 10.2.3 as extracted is faithful. Its
      argument is unusual enough -- a submission stating in its own security
      chapter that a reduction is prevented -- that a mis-extraction would matter
      a great deal, and stage 0 re-reads it.
    - >-
      That q_rsp is odd and generically greater than 1, i.e. d_rsp is generically
      not a power of two. Follows from r_rsp being defined as the dyadic
      valuation of d_rsp (Algorithm 4.2 lines 17-18), so q_rsp = d_rsp / 2^{r_rsp}
      is odd by construction; that it is generically greater than 1 is an
      assumption about the distribution of d_rsp and is measurable from KATs.

  predictions:
    - metric: >-
        nonsmooth_entries_per_signature: number of isogenies in the ledger whose
        degree has a large odd part, derived from Algorithm 4.2
      direction: different
      minimum_effect: >-
        EXACTLY 1, derived before any run. A count of 0 would mean every
        published map is smooth-degree and the specification's own reduction
        goes through, so its concession is unnecessary; a count of 2 or more
        means the enumeration in this record is incomplete.
    - metric: >-
        exact_degree_determined: whether the published surface determines d_rsp
        exactly, as a boolean per signature
      direction: different
      minimum_effect: >-
        NO PREDICTION IS MADE, DELIBERATELY, and this is the point: the record
        states that it does not know, states why it matters (the Kani template
        needs the exact degree), and makes settling it the deliverable. A
        pre-registered guess here would be a fabricated prediction.
    - metric: >-
        classical_time_gap_bits: the specification's stated Otilde(2^lambda)
        minus the frozen 2026 table's time figure, at each of the three levels
      direction: different
      minimum_effect: >-
        PREDICTED (21.5, 34.5, 51.8) bits, i.e. 128 - 106.5, 192 - 157.5, 256 -
        204.2, computed here from the in-repository table. If a re-read of the
        frozen text gives different figures, this record is wrong on its face and
        the correction supersedes it.
    - metric: >-
        memory_column_present: whether SQIsign v2.0.1 Section 10.2.1 states a
        memory cost for the attacks it prices
      direction: different
      minimum_effect: >-
        PREDICTED: it states "low memory requirements" for both the classical and
        the quantum attack and states no memory figure for any alternative
        time-memory point. That is a documentary observation; if false, the
        Part B deliverable shrinks to arithmetic already done by the submitters.
    - metric: >-
        dominance_verdict under an area-time cost model at each level: which of
        (Otilde(2^lambda) time, negligible memory) and (2^106.5 time, 2^92.5
        memory) is preferred
      direction: different
      minimum_effect: >-
        NO PREDICTION IS PRE-REGISTERED because the answer depends on a cost
        model that must be declared first, and declaring it after seeing the
        numbers is the failure this field exists to prevent. The contract fixes
        the cost model BEFORE evaluating either point.

  minimal_test:
    design: >-
      Four stages, cheapest first. STAGE 0 (zero compute): re-fetch and re-read
      Sections 10.2.1 and 10.2.3 by a second extraction method and quote them
      verbatim with page references; re-read the frozen Wesolowski text's
      concrete table directly rather than through the analysis document. Either
      re-read can terminate the proposal. STAGE 1 (zero compute): write the
      quantifier comparison of Part A step 1 as two explicit prefixes, and the
      ledger enumeration of step 2 with a specification line for every entry.
      STAGE 2 (minutes): the Part B table -- both cost points, both axes, all
      three levels, one declared cost model fixed in advance, and an explicit
      dominance verdict per model. STAGE 3 (hours, optional): measure the
      distribution of q_rsp and of (n_bt, r_rsp) from KAT signatures, purely as
      an inventory statistic.
    controls:
      - >-
        NULL OBJECT OF THE SAME SHAPE, WITH A FORCED VALUE, AND ABLE TO FAIL:
        apply the Part A enumeration to a scheme where the specification's own
        antecedent HOLDS, i.e. where every published map has smooth degree. The
        natural instance inside SQIsign itself is the CHALLENGE isogeny, degree
        2^{f - n_bt}: the enumeration must classify it as smooth AND as
        self-samplable, and must therefore assign it to the reducible part. If
        the enumeration tags the challenge isogeny as an irreducible residual, it
        is over-counting and its residual of 1 per signature is not trustworthy.
      - >-
        POSITIVE CONTROL WHERE THE EFFECT MUST APPEAR: SIDH/SIKE's published
        surface, where the auxiliary data is published AND its degree is public
        AND the historical outcome is known. The enumeration must tag SIKE's
        torsion images as an irreducible residual with known degree. If it does
        not, the enumeration cannot detect the one case in this area where the
        residual is known to have been fatal, and NO NEGATIVE MAY BE REPORTED
        FROM IT.
      - >-
        GRADED CONTROL, THREE INTERIOR POINTS, MONOTONICITY REPORTED, FOR PART B:
        evaluate the dominance verdict under three declared cost models in
        increasing memory-charging severity -- pure time, time plus a linear
        memory charge, and an area-time-squared charge -- and report the verdict
        at each. A verdict that does not change across the three has either found
        a robust ordering or an insensitive instrument, and which one it is can be
        read off from whether the intermediate model moves anything.
      - >-
        ORDERING CONTROL: the cost model for Part B is written down and committed
        BEFORE either cost point is evaluated, and the three models are declared
        as a closed list before any is applied.
      - >-
        ARCHIVE CHECK, ZERO COMPUTE: list every prior measurement of this
        observable in the corpus. NOT AVAILABLE -- area SQISIGN holds no
        proposals, hypotheses, experiments or evidence records at all. Recorded
        as unavailable rather than claimed as a passed check.
    required_metrics:
      - verbatim quotations of Sections 10.2.1 and 10.2.3 with page references, or a recorded statement that they could not be re-obtained
      - the two quantifier prefixes, written out
      - the ledger enumeration table with a specification line per entry
      - the (time, memory) table at all three levels for both cost points
      - the dominance verdict under each of the three declared cost models
      - the degree-knowledge tag for phi_rsp, or an explicit record that it remains unsettled

  falsification_conditions:
    - >-
      Section 10.2.3 as re-read does not contain the concession. The Part A
      premise is then false, this record must be withdrawn as a superseding
      correction, and the extraction is the culprit.
    - >-
      The frozen Wesolowski table does not carry rows labelled with SQIsign's
      parameter sets, or carries different figures. Part B's arithmetic is then
      wrong and the correction supersedes.
    - >-
      The enumeration tags the challenge isogeny as an irreducible residual. It
      is over-counting and the residual figure is not usable.
    - >-
      The positive control fails on SIKE. No negative may be reported at all.
    - >-
      A declared cost model shows the incumbent low-memory point dominating at
      all three levels. Part B's deliverable becomes "the 2026 result does not
      move SQIsign's practical margin under charged memory" -- which is a
      complete and useful answer and is NOT a failure of the proposal.

  confounders:
    - >-
      TRANSITIVE SOURCING ON PART B. The figures reach this record through an
      in-repository analysis document rather than from the paper. Stage 0 removes
      it, and until it does every Part B number is labelled.
    - >-
      SCOPE CREEP INTO GOAL-SSI-001. Auditing a stated attack complexity is one
      step from costing the hard problem, which this goal may not do. The
      contract must state, and the Red Team must check, that no baseline is
      re-derived and no hardness figure is originated here -- only two published
      figures are placed side by side.
    - >-
      RHETORICAL ASYMMETRY IN PART A. "A submission concedes a gap in its own
      security argument" is a sentence that reads as damning and is not. Every
      lattice and code submission contains comparable concessions, and a
      concession stated openly is better practice than one omitted. The audit's
      deliverable is the quantified residual and the quantifier comparison, NOT a
      characterisation of the submission.
    - >-
      DATE ASYMMETRY IN PART B. The specification predates the result. Presenting
      staleness as an error would be unfair and wrong; the finding is about what
      an evaluator reading the document in 2026-08 should recompute.
    - >-
      EXTRACTION DAMAGE, as for every record in this batch.

  interpretation_limits:
    - >-
      NO HARDNESS CLAIM, NO ATTACK, NO COST CLAIM ORIGINATED. Part B places two
      published figures side by side under declared cost models. It does not
      re-derive either, does not validate the 2026 result, and does not assert
      that SQIsign's security level is other than claimed.
    - >-
      Part A produces a QUANTIFIED RESIDUAL AND A QUANTIFIER COMPARISON, not a
      weakness. That no reduction is known is the specification's own statement;
      that this is the same argument form that failed for SIDH is an observation
      about argument forms and is explicitly NOT an argument that SQIsign will
      fail. Writing it as one would be exactly the overclaiming the program's
      rules forbid.
    - >-
      Claim tier: documentary for both parts. No run raises it.
    - >-
      Scope, per AGENTS.md rule 6: v2.0.1 of the specification, the three
      declared parameter sets, the two named sections, and the three declared
      cost models. Nothing else.

  heuristic_assumptions:
    - id: HEUR-SQ-3
      statement: >-
        d_rsp has a large odd part with high probability over honest signing
        randomness; formally, Pr[q_rsp = 1] is negligible, where q_rsp = d_rsp /
        2^{DyadicValuation(d_rsp)}.
      rigorous_support: >-
        d_rsp = nrd(alpha_rsp) / (D_mix^2 * 2^{f - n_bt}) (Algorithm 4.2 line 16)
        is a quotient of reduced norms and has no construction forcing it to be a
        power of two; the dyadic part is stripped explicitly into r_rsp. NO
        DISTRIBUTIONAL THEOREM IS CITED and none was read; this is a plausibility
        argument and is labelled one.
      validation_plan: >-
        Measure the empirical distribution of r_rsp from KAT signatures, where it
        is published in the clear as one byte, and report the fraction with
        r_rsp = e'_rsp + r_rsp, i.e. the fraction where the odd part is trivial.
        A distributional check at the KAT sample size, reported as such.
    - id: HEUR-SQ-4
      statement: >-
        NOT A HEURISTIC, RECORDED TO SAY SO. Part B's arithmetic (128 - 106.5 =
        21.5 and the other two rows) assumes nothing. Its only assumption is
        evidentiary: that the two tables say what this record says they say.
      rigorous_support: Subtraction.
      validation_plan: Re-read both sources directly. Declared as stage 0.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS MOVED BY THIS PROPOSAL. It originates no algorithm. The
      exponents COMPARED are the specification's Otilde(p^{1/2}) classical and
      Otilde(p^{1/4}) quantum against the frozen 2026 text's p^{1/3+o(1)} in time
      AND memory, with a superpolynomial o(1) disclosed by that text's own
      author. Stating this plainly rather than dressing a comparison as a result
      is what docs/target-result-profile.md's cost-honesty requirement asks for.
    memory_exponent: >-
      This is the axis the proposal is actually about. The specification carries
      no memory column; the 2026 point's memory exponent is 1/3 in log p, i.e.
      >= 2^92.5 / 2^138.6 / 2^181.3 at the three sizes. Supplying the missing
      column is the deliverable.
    best_known: >-
      Contested by construction, and reported as contested rather than resolved
      (AGENTS.md knowledge-retrieval policy item 7): SQIsign v2.0.1 Section
      10.2.1 states Otilde(p^{1/2}) at low memory; the frozen 2026 text states
      p^{1/3+o(1)} in time and memory with rows labelled for SQIsign's sizes.
      Both are recorded; neither is picked.
    hidden_overhead: >-
      Superpolynomial in the 2026 point's o(1), by that text's own statement;
      (log p)^{O(1)} in the incumbent. That difference is larger than the bit
      gaps in Part B and is why the comparison is a trade rather than a result.
    tradeoff_note: >-
      The van Oorschot-Wiener interpolation sqrt(N^3/w) = p^{1/2+o(1)}/sqrt(w) is
      stated but not optimised in the frozen text, per
      docs/target-result-profile.md. The full frontier between the two points is
      therefore not known, and the Part B table must show the two endpoints and
      say the interior is unmapped rather than draw a line through it.

  dominated_by: >-
    n/a (no result claimed). Rows checked across time, memory and data/queries:
    (i) SQIsign v2.0.1 Section 10.2.1's Otilde(p^{1/2}) classical at low memory
    and Otilde(p^{1/4}) quantum at low memory (READ); (ii) the frozen 2026
    p^{1/3+o(1)} time-and-memory point with its concrete rows (via
    docs/target-result-profile.md, itself READ; the paper re-read is a declared
    stage); (iii) the van Oorschot-Wiener interpolation between them, stated and
    unoptimised in that text, which is the data/memory axis and is the row most
    likely to matter and least mapped; (iv) the Kani poly-time point, which
    requires an ingredient IDEA-20260805-c4ae3d locates as absent; (v) the corpus:
    area SQISIGN holds no records of any kind, so no internal frontier exists.
    This proposal occupies no point on any of these because it produces no
    algorithm.
  sota_delta: >-
    No attack. Quantitatively, the delta is: a memory column where the
    specification has none, at three parameter sets; three explicit bit gaps
    (21.5, 34.5, 51.8) between a Round-3 candidate's stated best-known-attack
    figure and a 2026 result this repository already holds frozen; a dominance
    verdict under three declared cost models where the corpus currently holds
    zero; and one quantified residual (exactly one non-smooth-degree isogeny per
    signature, unreduced by the specification's own argument) where the corpus
    currently holds a relayed sentence. Zero on every attack axis: time, memory,
    data, queries, advice, preprocessing.

  estimated_cost:
    implementation: low
    compute: negligible
  recommended_priority: medium
  honest_prior_of_survival: >-
    0.85 that Part A's reading survives -- that Section 10.2.3 does concede the
    absence of a reduction for non-smooth degrees and defends by best-known-attack
    behaviour. It is that high because the extracted passage is long, internally
    coherent, cites an external proposal for the hardness it invokes, and is not
    the sort of text a stream extractor synthesises; it is not higher because the
    entire reading rests on one extraction of one paragraph. 0.75 that Part B's
    arithmetic survives, lower because it is transitively sourced through an
    in-repository analysis rather than the paper, and because the row labels
    ("SQIsign NIST-I") may be that analysis's gloss rather than the paper's own
    labels -- which would weaken the comparison without voiding it. Below 0.30
    that the Part B dominance verdict comes out against the incumbent under a
    charged-memory model at NIST-I, since 2^92.5 of memory is an enormous charge
    and the honest expected outcome is a trade; that expectation is stated here
    so that reporting the trade is a success and not a disappointment.
