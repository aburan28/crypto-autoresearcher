  assumptions:
    - >-
      The structural precondition is GRANTED for the purposes of this audit:
      the audit assumes, counterfactually and only for the purpose of computing
      an upper bound on what the family could achieve, that ML-KEM's module can
      be presented as an ideal lattice over Q(zeta_512). This assumption makes
      the conclusion a CEILING on the family, which is exactly what a method-
      ceiling audit is for. It must never be reported as a belief about A.
    - >-
      DPW19's released code runs at cyclotomic conductor 512 (rank 256) and at a
      sweep of larger conductors, and reports an effective root-Hermite factor
      or a quantity from which one is computable. If it reports only an
      approximation factor relative to lambda_1, the conversion to delta is a
      stated arithmetic step, recorded, not assumed.
    - >-
      The root-Hermite factor is the right common currency for comparing
      reduction quality across the two settings. Where it is not - specifically
      across the rank-256 ideal lattice and the Z-rank-1536 ML-KEM lattice - the
      discrepancy is charged explicitly and in the direction that weakens the
      claimed closure.

  proof_search_map:
    bottleneck: >-
      The exact step whose removal changes the conclusion is the log-unit
      rounding of step (iii): the returned vector's excess over lambda_1 is
      governed by the covering radius of the log-unit lattice of Q(zeta_512).
      Every other step of the chain is quantum-polynomial-time and quality-
      neutral. An improvement anywhere else in the chain leaves the budget
      untouched; only a better rounding, or an object with a smaller covering
      radius, moves it.
    baseline_embedding:
      parameter_slice: >-
        DPW19's own reported comparison point: cyclotomic rank about 24000
        against BKZ-300, i.e. delta = 1.004804. The pipeline must reproduce
        DPW19's crossover at that delta, from their released code, before it is
        allowed to emit a number at rank 256 or at ML-KEM's delta.
      reproduction_check: >-
        Numeric, against the authors' published figure, with the erratum applied:
        run the released tool, locate the rank at which delta_eff equals
        1.004804, and check that it lands at or BELOW about 24000 (the erratum
        states the correction lowers crossover points). A result materially
        ABOVE 24000 means the tool is being driven wrongly - most likely with
        the pre-erratum branch - and the run is void.
    observation_collision:
      observable: >-
        The effective root-Hermite factor delta_eff, a single scalar summarizing
        the quality of the vector the quantum algorithm returns.
      distinct_preimage_search: >-
        Two objects with the same delta_eff and different attack consequences
        are easy to name and must be checked: an ideal lattice of rank 256 with
        delta_eff = x, and ML-KEM's Z-rank-1536 primal lattice reduced to
        delta = x. These have the SAME observable and very different meaning,
        because delta compounds over dimension - delta^1536 against delta^256.
        This collision is not a defect to be argued away; it is the transfer
        obligation, and the audit must report BOTH the delta comparison and the
        compounded comparison delta_eff^256 versus delta_req^1536, stating which
        one it treats as decisive and why. If the two comparisons disagree in
        sign, no closure may be declared.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the hypothesis "the algebraic route might work" into a model
          where it is an exact numeric inequality delta_eff(256) versus
          delta_req, evaluable by a released tool, with separate encoding
          (ideal presentation, granted), soundness (the returned vector is
          genuinely that short), transfer (rank 256 to Z-rank 1536) and cost
          (quantum class-group computation, granted as polynomial) obligations.
        predicted_gain: >-
          Replaces an unbounded argument about Otilde with a two-number
          comparison whose gap is predicted to be at least a factor 5 in
          log delta.
      - transform: observable_fiber
        proposed_object: >-
          Hold delta_eff fixed and vary the forgotten structure - the specific
          ideal, its class, its generator's log-unit position - to see whether
          any intrinsic invariant separates ideals on which the algorithm does
          much better than its typical quality.
        predicted_gain: >-
          If a distinguishable sub-family of ideals attains far better
          delta_eff, the "typical quality" number is the wrong statistic and the
          budget must be recomputed on the favourable tail. This is the single
          most likely way the predicted closure is wrong, and it is cheap to
          probe because the tool already samples.
    quantifier_order: >-
      The predicted claim is: FOR ALL ML-KEM parameter sets and FOR ALL ideals
      of Q(zeta_512) arising from the granted presentation, the quantum
      algebraic route's delta_eff at rank 256 EXCEEDS delta_req. The falsifying
      claim needs only: THERE EXISTS a parameter set and THERE EXISTS a
      non-negligible family of ideals with delta_eff at most delta_req. The
      asymmetry matters: a tail of favourable ideals suffices to falsify, and
      the audit must therefore report the DISTRIBUTION of delta_eff, not only
      its typical value. Reporting a mean and declaring closure would be a
      quantifier error.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest certifiable statement is: under the granted structural
        precondition, and for the quantum Ideal-SVP algorithm family as
        parameterized by DPW19's released analysis, the reduction quality
        attainable at cyclotomic rank 256 falls short of ML-KEM's requirement by
        a measured factor. It certifies nothing about (a) algebraic routes
        outside that family, (b) future improvements to log-unit rounding,
        (c) rank-k module analogues with different quality behaviour, or
        (d) the structural question itself, which is granted rather than
        settled.
    nearby_object_control: >-
      The closest object where the desired conclusion FAILS is a cyclotomic
      field of rank well above the crossover, where the algorithm does beat
      BKZ-300. The pipeline must exhibit that reversal - delta_eff falling below
      1.004804 as rank grows past the crossover. A pipeline that reports "not
      good enough" at every rank has not identified the load-bearing structure
      and its ML-KEM output is meaningless.
    proof_obligations:
      - claim: >-
          delta_req = 1.003919 / 1.002895 / 1.002258 for ML-KEM-512 / 768 / 1024,
          recomputed from an independent estimator rather than from the recalled
          blocksizes.
        responsibility: baseline
      - claim: >-
          The released DPW19 tool reproduces the published crossover against
          BKZ-300 at or below rank 24000 with the erratum applied.
        responsibility: interface
      - claim: >-
          delta_eff(rank 256) is well defined, is reported with its distribution
          over sampled ideals, and its left tail is characterized.
        responsibility: success_probability
      - claim: >-
          The transfer from a rank-256 ideal lattice to ML-KEM's Z-rank-1536
          primal lattice is stated, and both the raw-delta and the
          compounded-delta comparisons are reported.
        responsibility: scope
      - claim: >-
          Under the granted precondition, no step of the chain other than
          log-unit rounding degrades quality, so the measured delta_eff is the
          family's ceiling and not one algorithm's shortfall.
        responsibility: correctness

  predictions:
    - metric: delta_eff at cyclotomic rank 256 (conductor 512), typical value
      direction: higher
      minimum_effect: >-
        At least 1.0145, i.e. log delta_eff at least 5 times log delta_req for
        ML-KEM-768. A value below 1.006 would already be surprising and would
        warrant reopening the lane even without crossing delta_req.
    - metric: >-
        cyclotomic rank at which delta_eff first reaches delta_req(ML-KEM-768)
        = 1.002895
      direction: higher
      minimum_effect: >-
        Strictly greater than the rank at which delta_eff reaches
        delta(BKZ-300) = 1.004804, and at least 93 times ML-KEM's rank of 256.
        A rank below 2560 (10 times ML-KEM's) would be a qualitatively
        different world and would make the structural question urgent.
    - metric: >-
        left tail of the delta_eff distribution over sampled ideals at rank 256
        - the 1st percentile
      direction: higher
      minimum_effect: >-
        Still above delta_req for ML-KEM-1024 (1.002258). This is the prediction
        that matters for the quantifier order: a 1st-percentile value at or
        below delta_req falsifies the closure even if the typical value does
        not.
    - metric: >-
        baseline reproduction - rank at which the released tool reports
        delta_eff = 1.004804
      direction: lower
      minimum_effect: >-
        At or below about 24000, consistent with DPW19's erratum stating the
        correction lowers crossover points. Materially above 24000 voids the run.
    - metric: >-
        nearby-object control - delta_eff at a rank well above the crossover
      direction: lower
      minimum_effect: >-
        Below 1.004804, demonstrating the pipeline can detect the regime where
        the algebraic route wins. Failure here voids the ML-KEM conclusion.

  minimal_test:
    design: >-
      An afternoon of work, no lattice reduction, no quantum simulation.
      Step 1 - recompute delta_req for all three ML-KEM parameter sets from an
      independent primal-attack estimator (the lattice estimator), not from the
      recalled blocksizes, and report both so the discrepancy is visible.
      Step 2 - obtain the DPW19 released tool, identify the post-erratum code
      path explicitly, and record its commit hash. Step 3 - BASELINE GATE:
      reproduce DPW19's crossover against BKZ-300 and check it lands at or below
      about 24000. Do not proceed on failure. Step 4 - evaluate delta_eff at
      cyclotomic conductor 512 (rank 256), reporting not a single number but the
      full distribution over the tool's sampled ideals, with the 1st and 5th
      percentiles called out. Step 5 - invert: find the rank at which delta_eff
      reaches each of the three delta_req values. Step 6 - run the controls
      below. Step 7 - report BOTH the raw delta comparison and the compounded
      comparison delta_eff^256 versus delta_req^1536, and state which is treated
      as decisive with the reason. Step 8 - record the result as an obstruction
      block per docs/inventor-protocol.md section 4: a quantity, its value with
      units and error bars, the runs it is read from, and the scope claimed.
    controls:
      - >-
        BASELINE GATE (positive control, published answer). Reproduce DPW19's
        BKZ-300 crossover. Gates everything.
      - >-
        NEARBY OBJECT WHERE THE ROUTE WINS (sign control). Evaluate at a rank
        well above the crossover and confirm delta_eff drops below 1.004804. A
        tool that never reports success cannot report failure either.
      - >-
        NULL FIELD. Evaluate at a NON-cyclotomic field of similar rank if the
        tool supports it, or at a cyclotomic field of a different conductor
        family, to confirm the quality is a property of the field's unit lattice
        and not a constant the tool returns regardless of input.
      - >-
        ESTIMATOR CONTROL. Compute delta_req under at least two primal-attack
        estimators (the 2016 estimate and the leaky-LWE or MATZOV refinement).
        The predicted closure has a factor-5 margin in log delta and must be
        robust to the spread between estimators; if it is not, it is not a
        closure.
      - >-
        DIRECTION-OF-ERROR CONTROL. Apply the erratum in the direction the
        authors state (lower crossover). Applying it the wrong way would
        manufacture a stronger closure than the evidence supports, which is the
        specific failure mode this control exists to prevent.
    required_metrics:
      - delta_req per parameter set under at least two estimators
      - delta_eff distribution at rank 256, with 1st and 5th percentiles
      - rank at which delta_eff reaches each delta_req
      - baseline-gate crossover rank against delta = 1.004804
      - sign-control delta_eff above the crossover
      - both the raw-delta and compounded-delta comparisons
      - tool commit hash and the identified post-erratum code path

  falsification_conditions:
    - >-
      delta_eff(256) at or below delta_req for any ML-KEM parameter set, in the
      typical value OR in the 1st percentile, falsifies the closure and means
      that - granting the structural precondition - a quantum polynomial-time
      route attains ML-KEM's required reduction quality. This is the outcome
      that would reorder the entire question.
    - >-
      A rank-to-delta_req below 2560 (ten times ML-KEM's rank) falsifies the
      "at least 93 times" prediction and materially changes the margin even
      without crossing it.
    - >-
      Failure of the baseline gate, or of the sign control, voids the run in
      both directions - no closure and no reopening may be read from it.
    - >-
      If the raw-delta and compounded-delta comparisons disagree in sign, the
      common currency is not common and the audit produces no verdict until the
      transfer is resolved.
    - >-
      If the tool turns out to compute an approximation factor that cannot be
      converted to a root-Hermite factor without an additional assumption, the
      conversion assumption must be stated and, if it is load-bearing, the
      audit is downgraded to a bounded statement about approximation factors
      only.

  confounders:
    - >-
      The erratum. DPW19 report that the 2019 version overpredicted the
      root-Hermite factor and that the August 2021 correction LOWERS crossover
      points. Reading the 2019 plot rather than the corrected code would
      overstate the margin - it would make the closure look stronger than it is,
      which is the direction this program is most obliged to guard against.
    - >-
      Rank versus dimension. "Cyclotomic rank 24000" is a rank over Z of the
      ideal lattice, which for a cyclotomic field of degree n equals n. ML-KEM's
      ring rank is 256 but its ATTACK lattice has Z-rank 1536. Conflating the
      two would either flatter or damn the algebraic route by a factor 6 and is
      the most likely arithmetic error in this audit.
    - >-
      Granting the structural precondition is a counterfactual. Reporting the
      resulting number without the qualifier would read as evidence that the
      module IS an ideal lattice, which it is not known to be and which
      IDEA-20260828-e4fee5 predicts it is not.
    - >-
      Typical versus tail. The algorithm's quality varies over ideals. A closure
      argued from the typical value while the falsifier needs only a tail is a
      quantifier error, and the distribution must be reported.
    - >-
      Rank-k module versus rank-1 ideal. Even granting a presentation, a rank-k
      module's algebraic reduction quality need not equal an ideal's. The audit
      measures the IDEAL case, which is the most favourable, so the ceiling
      interpretation survives - but the number must not be quoted as the
      module's quality.

  interpretation_limits:
    - >-
      No paper body was read this session. DPW19 was read at abstract level via
      WebFetch plus a WebSearch cross-check; CDW and Biasse-Song are recalled
      only, with verified_by null. The novelty status is therefore unverified
      and cannot be raised without opening the papers - in particular, DPW19 or
      a successor may already state the ML-KEM comparison outright, in which
      case this record is a replication with a stated number rather than a new
      audit, and that would still be a useful outcome but not a novel one.
    - >-
      The delta_req values quoted in the claim were computed this session from
      RECALLED blocksizes. They are provisional and the test recomputes them.
      Nothing downstream may cite them until recomputed.
    - >-
      A confirmed closure is scoped to: the quantum Ideal-SVP algorithm family
      as parameterized by DPW19's released analysis, cyclotomic rank 256, the
      granted structural precondition, and the FIPS 203 parameter sets. It is
      not a statement that algebraic attacks on ML-KEM are impossible, and
      docs/inventor-protocol.md section 4 requires the forward guidance stated
      in claim (D) to accompany it wherever it is cited.
    - >-
      This record makes no empirical claim about ML-KEM instances; it computes
      and compares two reduction-quality numbers. Its claim tier is that of a
      derivation over published analyses, not of an experiment on lattices.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Quality-transfer.) The root-Hermite factor is a sufficient common
        currency for comparing the quantum algebraic route's output on a
        rank-256 cyclotomic ideal lattice with the reduction quality ML-KEM's
        primal attack requires on a Z-rank-1536 lattice; formally, if
        delta_eff(256) > delta_req then no composition of the algebraic route
        with polynomial post-processing attains delta_req on the ML-KEM lattice.
      rigorous_support: >-
        Pairs the rigorous definition of the root-Hermite factor - a
        dimension-normalized quantity precisely constructed so that
        ||b_1|| = delta^dim * vol^(1/dim) compares reduction quality across
        dimensions - with the classical distribution statement it imitates, the
        Gaussian heuristic for random lattices, under which delta is the unique
        scale-free summary of a reduced basis' leading norm. The rigorous half
        is the definition; the heuristic half is that delta, and not some finer
        feature of the profile, is what governs whether the ML-KEM secret is
        recovered - which is the same assumption every published ML-KEM estimate
        already makes.
      validation_plan: >-
        Validate by exhibiting the failure mode rather than by assuming its
        absence. Sample 10^3 random q-ary lattices of Z-rank 120-200 with
        planted CBD secrets, reduce each to a range of measured delta values
        with BKZ, and record recovery success as a function of delta alone;
        compare against the delta-conditioned prediction (the comparison
        distribution) and report the residual. Then repeat with lattices of the
        SAME delta but different Z-rank (120 versus 200) to test transfer across
        rank directly - which is the exact step H1 needs. Tail checks: the
        instances recovered at the LARGEST delta and those failed at the
        smallest, since a transfer failure would show up first at the extremes.
        Transfer assumption, stated explicitly: rank 120-200 results are
        extrapolated to ranks 256 and 1536 with no claim beyond the tested
        range, and the audit's decisive comparison is reported in BOTH the raw
        and compounded forms precisely because this extrapolation is not
        discharged.
    - id: H2
      statement: >-
        (Quality genericity over ideals.) For ideals of Q(zeta_512) arising from
        the granted presentation of an ML-KEM module, the effective
        root-Hermite factor delta_eff of the quantum algebraic route is
        distributed as it is for the uniformly random ideals DPW19's tool
        samples; formally, the 1st percentile of delta_eff over ML-KEM-derived
        ideals is at least the 1st percentile over uniformly random ideals of
        the same norm, up to a factor 1.001 in log delta.
      rigorous_support: >-
        Pairs the rigorous fact that the algorithm's quality is governed by the
        covering radius of the log-unit lattice of K, a quantity depending only
        on K and not on the ideal, with the classical distribution statement it
        imitates: that the class of an ideal and the log-unit position of its
        generator equidistribute for ideals drawn from a natural distribution,
        the standard equidistribution assumption underlying class-group index
        calculus. The heuristic asks only that ML-KEM-derived ideals are not
        adversarially positioned relative to the log-unit lattice - and the
        obstructions to that are real, since the presentation is derived from a
        structured matrix A rather than from a random ideal.
      validation_plan: >-
        Sample via the presentation itself rather than via random ideals: for
        each of 10^3 random ML-KEM public matrices A at the exact FIPS 203
        parameters, construct whatever ideal presentation the granted
        precondition supplies (or, where it does not exist, record that fact -
        it is itself data for IDEA-20260828-e4fee5), compute the class and the
        log-unit position, and compare their empirical distributions against the
        uniform-over-Cl(K) and uniform-modulo-log-unit-lattice predictions.
        Tail checks: the 1 percent of instances whose log-unit position is
        closest to a deep hole of the log-unit lattice, since those are exactly
        the instances where the algorithm returns its shortest vectors and where
        an attacker selecting over public keys would concentrate. Sampled
        parameters recorded: q = 3329, n = 256, k in {2,3,4}, seeds. Transfer
        assumption: the class group of Q(zeta_512) is not computed exactly
        (it is enormous); the comparison is made in whatever quotient the tool
        exposes, and that restriction is stated with the result.

  target_complexity:
    time_exponent: >-
      This record claims no algorithm. It measures the ceiling of one. Under the
      predicted outcome, the quantum algebraic route's time exponent is
      irrelevant because it never reaches the required quality - the honest
      statement is "polynomial time at a quality ML-KEM does not care about".
      Under the falsifying outcome the route would run in QUANTUM POLYNOMIAL
      TIME, i.e. exponent 0 in the security parameter, against a best known of
      2^(0.2653 * 623) = 2^165 quantum core-SVP for ML-KEM-768 - the largest
      possible exponent movement this question admits, which is why a cheap
      audit of it is worth running even at a low prior.
    memory_exponent: >-
      Predicted branch: not applicable, no algorithm proposed. Falsifying
      branch: quantum polynomial memory, against 2^(0.2075 * 623) = 2^129
      classical or 2^(0.1887 * 1536) under the quantum 3-tuple point recorded in
      IDEA-20260828-411711 - again the maximal possible movement.
    best_known: >-
      ML-KEM-768: classical core-SVP 2^(0.292 * 623) = 2^182 time,
      2^(0.2075 * 623) = 2^129 memory; quantum core-SVP 2^(0.2653 * 623) =
      2^165. The best known ALGEBRAIC result at ML-KEM's rank is, per DPW19, a
      quantum algorithm whose returned vector is worse than BKZ-300's at every
      rank below about 24000 - i.e. the algebraic route is not on the frontier
      at these parameters at all, which is precisely the statement this audit
      converts into a number with error bars.
    hidden_overhead: >-
      The exp(Otilde(n^(1/2))) hides constants that are the entire content of
      the question, which is why the audit runs the code rather than reasoning
      about the exponent. Additionally: the granted structural precondition is a
      counterfactual of unknown probability, the class-group computation is
      polynomial only on a fault-tolerant quantum computer of unstated size, and
      the erratum means the published crossover figure is an upper estimate.
      All three are disclosed rather than absorbed.
    tradeoff_note: >-
      No time-memory tradeoff arises in the predicted branch. In the falsifying
      branch the route would be quantum-polynomial in both and would not
      interpolate with the classical sieve frontier at all - it would replace
      it. Cascade note per the reduction-network heuristic: a positive outcome
      would propagate through the standard MLWE-to-ML-KEM IND-CPA reduction and
      the FO transform to ML-KEM IND-CCA, and would apply to ML-DSA (same ring,
      same field, different rank) by the same field-level argument, since the
      obstruction being measured is a property of Q(zeta_512) and not of the
      scheme. Falcon, over Q(zeta_1024) at rank 512, would need the audit rerun
      at that rank and is NOT covered by this record.

  dominated_by: >-
    Under the predicted outcome, dominated on every axis by the standard
    ML-KEM-768 primal lattice attack (2^182 classical time, 2^129 memory, 768
    samples) and by its quantum counterpart (2^165), since the audited route
    never attains the required quality at ML-KEM's rank. Checked against every
    frontier row this corpus tracks: classical sieve core-SVP, classical
    enumeration under the memory-charged model of IDEA-20260805-cdc87d, quantum
    sieve at 2^0.2653 beta, the October-2025 quantum 3-tuple point
    (2^0.2846 d time, 2^0.1887 d memory) recorded in IDEA-20260828-411711,
    dual/MATZOV variants, the hybrid/decoding lane, the module-BKZ lane of
    IDEA-20260829-1ebebd and IDEA-20260829-353361, and the DCP-to-LWE quantum
    chain audited by IDEA-20260821-abacec. Under the falsifying outcome it would
    dominate all of them by an unbounded margin, being polynomial time.
  sota_delta: >-
    Predicted: no attack; the contribution is a measured obstruction - the
    quantum algebraic route's effective root-Hermite factor at cyclotomic rank
    256 exceeds ML-KEM's requirement by at least a factor 5 in log delta, and
    the rank required to reach ML-KEM's quality exceeds 256 by at least 93x.
    That converts an untested "the algebra is closed" intuition into a number
    with error bars and a stated reopening condition. Falsifying: quantum
    polynomial time versus 2^165 quantum core-SVP for ML-KEM-768, conditional on
    a structural precondition that is granted here and disputed elsewhere - a
    165-bit gap, and the single largest possible sota_delta in this question.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
