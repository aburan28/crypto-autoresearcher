idea:
  id: IDEA-20260829-f21416
  question_id: RQ-MLKEM-001
  added: '2026-08-29'
  proposed_by: idea-generator
  status: proposed

  title: >-
    The REDUCTION-QUALITY budget of the quantum algebraic route, measured not
    argued: grant every structural precondition that IDEA-20260805-e805b6 and
    IDEA-20260828-e4fee5 dispute, then run Ducas-Plancon-Wesolowski's released
    effective-approximation-factor tool at cyclotomic rank 256 and compare the
    root-Hermite factor it delivers against the 1.00226 to 1.00392 that FIPS 203
    actually demands

  class: control

  claim: >-
    (A) THE TWO OBSTRUCTIONS ARE INDEPENDENT AND ONLY ONE HAS BEEN LOOKED AT.
    Any attack on ML-KEM that routes through the class group and unit group of
    Q(zeta_512) - the Cramer-Ducas-Wehmeyer-Peikert-Regev / Pellet-Mary-Hanrot-
    Stehle family, quantum-polynomial-time given Biasse-Song class-group
    computation - must clear TWO independent hurdles. The STRUCTURAL hurdle is
    whether ML-KEM's rank-k module can be presented as an ideal lattice at all;
    that is what IDEA-20260805-e805b6 asserted and IDEA-20260828-e4fee5 set out
    to measure. The QUANTITATIVE hurdle is whether, granting the structural
    hurdle entirely, the reduction QUALITY the algebraic machinery delivers is
    good enough to break ML-KEM. Nothing in this corpus has measured the second,
    and it is the more robust of the two: a future advance could dissolve the
    structural hurdle, and the quantitative one would still stand or fall on its
    own.
    (B) THE BUDGET, AS A NUMBER. ML-KEM's primal attack requires a root-Hermite
    factor delta_req computed this session from the published core-SVP
    blocksizes via delta_beta = (beta / (2 pi e))^(1 / (2(beta - 1))):
    ML-KEM-512 at beta 406 needs delta_req = 1.003919; ML-KEM-768 at beta 623
    needs 1.002895; ML-KEM-1024 at beta 873 needs 1.002258. These are the
    tightest reduction-quality targets in deployed cryptography and they are the
    entire budget the algebraic route has to hit.
    (C) THE FALSIFIABLE STATEMENT. Ducas, Plancon and Wesolowski (eprint
    2019/234, CRYPTO 2019) analysed the constants in the quantum Ideal-SVP
    algorithm's asymptotic approximation factor exp(Otilde(n^(1/2))) and
    predicted a CONCRETE crossover: the quantum algorithm finds shorter vectors
    than BKZ-300 only for cyclotomic rings of rank larger than about 24000. The
    same delta formula gives delta(BKZ-300) = 1.004804 - which is WEAKER than
    every one of the three ML-KEM targets in (B). The claim is therefore
    twofold and both parts are checkable in an afternoon:
    (C1) the cyclotomic rank at which the quantum algebraic route first attains
    delta_req(ML-KEM-768) = 1.002895 is strictly greater than the rank at which
    it attains delta(BKZ-300) = 1.004804, hence strictly greater than about
    24000, hence at least 93 times ML-KEM's actual ring rank of 256; and
    (C2) evaluated directly at rank 256 with the authors' own released tool
    (github lducas/Cyclotomic-QISVP-Effective), the effective root-Hermite
    factor delta_eff(256) exceeds delta_req(ML-KEM-768) by at least a factor 5
    in log delta, i.e. delta_eff(256) > 1.0145.
    (D) WHAT EACH OUTCOME MEANS. If (C1) and (C2) hold, the quantum algebraic
    route is closed at ML-KEM parameters by a QUANTITATIVE obstruction that is
    independent of the structural one, and every future proposal in this lane -
    including any that dissolves the module-to-ideal question - inherits a
    number it must beat rather than a verdict it must argue with. The forward
    guidance is precise: the route reopens only if a variant is found whose
    effective delta improves by a factor 5 in log delta at fixed rank, or whose
    quality is rank-independent. If instead delta_eff(256) <= delta_req for any
    ML-KEM parameter set, then granting the structural precondition there exists
    a QUANTUM POLYNOMIAL TIME route to the reduction quality ML-KEM needs - the
    largest single result this question could produce - and the structural
    precondition immediately becomes the highest-priority open problem in the
    lane rather than a curiosity.
    (E) WHY THIS IS NOT AN ARGUMENT ABOUT ASYMPTOTICS. exp(Otilde(n^(1/2))) at
    n = 256 is not a number; the Otilde can hide anything, and this program has
    repeatedly and correctly refused to reason from an exponent's shape. The
    entire point of this record is that the constants were already computed, by
    the authors, and shipped as code. The audit is a tool invocation, not a
    derivation.

  mechanism: >-
    LOSSY-PROJECTION TEST. The tracked object is the pair (ideal class in
    Cl(Q(zeta_512)), log-unit coordinates of the ideal's generator), i.e. the
    Arakelov-style projection Ideal |-> (its class, its position modulo the
    log-unit lattice). This discards the ideal's actual short vectors, its
    Gram data, and everything geometric except a class-group element and a
    real vector of dimension equal to the unit rank - a drastically lossy
    projection of a rank-256 lattice down to a finite group element plus 127
    reals. It is discarded COMPATIBLY with the target's operations: ideal
    multiplication maps to addition in the class group and to addition in the
    logarithmic embedding, so the retained pair propagates deterministically
    under exactly the operations the CDW/PHS machinery performs. This is what
    makes the family well-posed and it is also what bounds it: the projection
    forgets the geometry, so the algorithm can only return a vector as short as
    the covering radius of the log-unit lattice permits, and THAT covering
    radius - not any inefficiency of implementation - is the source of the
    exp(Otilde(sqrt n)) quality. The obstruction being measured is therefore
    intrinsic to the object, not to a particular algorithm, which is why a
    measured number here has forward value.
    THE CAUSAL CHAIN, STATED SO IT CAN BE ATTACKED. (i) Biasse-Song computes
    Cl(K) and the unit group in quantum polynomial time for K = Q(zeta_512).
    (ii) Given the class group, CDW-style algorithms reduce an ideal to a
    principal one and round its generator against the log-unit lattice.
    (iii) The rounding error is bounded by the covering radius of the log-unit
    lattice of K, which for cyclotomic fields grows like sqrt(n) up to
    logarithmic factors, giving a returned vector longer than lambda_1 by
    exp(Otilde(sqrt n)). (iv) DPW19 computed the constants in (iii) concretely
    for cyclotomic fields and released the code that evaluates them. The audit
    consumes (iv) directly. Each of (i)-(iii) is a place the chain can be
    attacked, and the record's value does not depend on any of them being
    improvable - it depends only on (iv) being evaluable at n = 256.
    WHY THE COMPARISON IS APPLES TO APPLES, AND WHERE IT IS NOT. The
    root-Hermite factor is dimension-normalized precisely so that reduction
    quality can be compared across dimensions, which is why DPW19 themselves
    state their crossover against BKZ-300 rather than against a raw norm. The
    place the comparison strains is that delta_eff is measured over the rank-256
    ideal lattice while delta_req is required over ML-KEM's Z-rank-1536 primal
    lattice. That transfer is an explicit obligation below, not a silent step,
    and the conservative reading - that the algebraic route would have to
    deliver its delta on the LARGER lattice, which is strictly harder - makes
    the predicted closure stronger rather than weaker. If the transfer fails in
    the other direction, the record says so and the number is withdrawn.
    WHY THIS IS NOT A RENAMED KNOWN APPROACH. IDEA-20260805-e805b6 and
    IDEA-20260828-e4fee5 ask an EXISTENCE question about the matrix A: can the
    module be re-presented as an ideal lattice. This record grants that question
    its most favourable possible answer and asks a DISJOINT question about
    quality. The two can be resolved in any combination, and the four
    combinations have four different consequences, which is what makes running
    both worthwhile rather than redundant. IDEA-20260821-003cb0 prices a
    different quantity again - the modulus-to-noise budget spent by a REDUCTION
    between problems - and its budget can be fully intact while this one is
    exhausted.

  novelty_status: unverified

