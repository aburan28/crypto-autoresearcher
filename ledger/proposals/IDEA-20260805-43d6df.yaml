idea:
  id: IDEA-20260805-43d6df
  question_id: RQ-SDITH-001
  added: '2026-08-05'
  title: >-
    The memory-charged ISD baseline, and the re-optimization error that makes
    every naive charging of a published ISD cost WRONG BY 6 TO 10 BITS in a
    single named direction
  class: cost-model

  claim: >-
    Every ISD cost table in the literature reports the optimum of a
    two-parameter family (p, l) taken under FREE MEMORY. The obvious way to
    build a memory-charged baseline -- take the published optimum and add the
    memory penalty to it -- is WRONG, and wrong in a direction that makes the
    charged baseline look worse for the attacker than it is. The correct
    procedure re-optimizes (p, l) UNDER the charge, and the charged optimum is a
    genuinely different point: derived in this record, at three illustrative
    parameter sets, the free optimum moves from (p,l) = (4,4) to (2,2), from
    (4,4) to (2,2), and from (10,34) to (6,22), and the memory exponent falls
    from 28.1 to 15.0 bits, 30.0 to 16.0 bits, and 34.5 to 22.6 bits. Charging
    at the un-re-optimized point over-charges by 9.61, 9.18 and 6.48 bits
    respectively. Second, and pointing the other way: at these parameter sets
    Dumer STILL BEATS PRANGE ONCE MEMORY IS CHARGED -- by 10.28, 12.12 and 18.47
    bits -- so the hope recorded in this session's ANGLE-BRIEF, that full cost
    might reorder which exponent is the baseline for SDitH, HQC and Classic
    McEliece simultaneously, is FALSE at Dumer level at these shapes. Both
    halves are deliverables: GOAL-SDITH-001's next_action asks for the charged
    baseline, not for an attack, and a charged baseline whose construction
    procedure is itself audited is worth more than one that inherits an
    arithmetic error from the first line.

  object_first_candidate:
    tracked_object: >-
      THE (time exponent, memory exponent) PAIR AS A FUNCTION OF THE ALGORITHM'S
      INTERNAL PARAMETERS -- not the scalar cost. The tracked object is the
      parametric curve (p, l) -> (log2 T(p,l), log2 M(p,l)) traced by a single
      ISD variant as its own tuning parameters range, followed through the
      charging functional. Published tables collapse this curve to one point by
      minimizing T at M = free; charging is a DIFFERENT functional on the SAME
      curve, and its minimizer is a different point. Tracking the curve rather
      than the point is the entire content: it is what makes the re-optimization
      error visible, and a scalar-cost framing cannot see it.
    established_families_off_limits: >-
      Declared off-limits as the primary lens: (1) inventing a new ISD variant
      of any kind -- no representation technique, no nearest-neighbour search,
      no new collision structure; (2) index calculus, which for SD is ISD
      renamed; (3) algebraic modelling; (4) quantum ISD, where the corpus's own
      note is that recent gains are constant-factor and must be labelled so;
      (5) any structural exploitation of the d-split, which belongs to
      IDEA-20260805-cbd93d and is deliberately held OUT of this proposal so the
      baseline is built on the plain-SD object first, exactly as
      GOAL-SDITH-001's next_action instructs. This proposal proposes no attack
      and no algorithm. It audits a measurement procedure.
    newness_score: >-
      Charging memory is not new -- KN-TECH-035 exists, was read this session,
      and is the corpus's own vehicle. What is not in this corpus, verified by
      the ANGLE-BRIEF's independent grep and confirmed against the SDITH area
      here, is ANY executed charged ISD baseline at all: three goals
      (SDITH-001, HQC-001, MCE-001) name it as deliverable number one and none
      has an experiment. What is not obviously anywhere is the re-optimization
      error stated as a QUANTIFIED, DIRECTIONAL defect in the standard charging
      procedure, with the size of the error derived before any run.
    testability_score: >-
      Very high and entirely self-contained: the cost model is written out in
      full below, every formula is elementary and derived in this record, and
      the whole grid search over (p, l) at three parameter sets runs in under a
      second of pure-Python integer arithmetic. No solver, no library. The
      container has numpy 2.4.6 and does NOT have sympy (measured this session);
      neither is needed.
    survival_score: >-
      The object survives as far as the cost model is honest, and no further.
      Its declared failure boundary is sharp: this record models PRANGE and
      DUMER/STERN only. MMT, BJMM and May-Ozerov are NOT READ and NOT MODELLED,
      and since they are exactly the variants whose advantage is most
      memory-bought, the headline "Dumer still beats Prange when charged" cannot
      be extended to them without doing that work. Said differently: the object
      is fine, the parameter sets are illustrative, and the variant coverage is
      the weak axis.

  mechanism: >-
    DERIVED IN THIS RECORD. Every number below was computed here. The cost model
    is DECLARED, not taken from a source, and its provenance is stated at each
    line so that a reviewer can attack the model rather than the arithmetic.

    THE CHARGING MODELS, DECLARED. Three, reported side by side, never collapsed
    to one:
      M0 (free memory)  : cost = T, the raw operation count. This is the model
                          published ISD tables use.
      M1 (access latency): a random access into a store of M cells costs
                          sqrt(M) time units, because a two-dimensional layout
                          of M cells has diameter ~sqrt(M) and a signal must
                          cross it. Sequential streaming is not charged. Cost is
                          the resulting total time.
      M2 (area-time-squared): cost exponent = log2 M + 2 log2 T, reported as a
                          separate column because it is not commensurable with
                          M0 or M1 and comparing it against them as if it were a
                          time is the standard way to produce a meaningless
                          number.
    M1 IS THE LOAD-BEARING MODEL and it is the one that must pass a baseline
    reproduction check before it is used on anything.

    BASELINE REPRODUCTION AUDIT -- RUN, AND PASSED, IN THIS RECORD. KN-TECH-035
    (READ this session, front matter and Method section) states the corpus's
    anchor: baby-step giant-step needs n^{1/2} processor steps but has full cost
    n^{2/3+o(1)}. Does M1 reproduce it? BSGS with a table of m elements costs
    m sequential writes plus n/m random lookups at sqrt(m) each, so
      cost(m) = m + (n/m) sqrt(m) = m + n m^{-1/2}.
    Differentiating, the optimum is m = (n/2)^{2/3} and cost = O(n^{2/3}).
    Numerically, computed here by direct search over log2 m:
      n = 2^64  : optimal log2 m = 42,  log2 cost = 43.58  (2e/3 = 42.7)
      n = 2^128 : optimal log2 m = 85,  log2 cost = 86.27  (2e/3 = 85.3)
      n = 2^256 : optimal log2 m = 170, log2 cost = 171.58 (2e/3 = 170.7)
    M1 reproduces both the exponent 2/3 AND the optimal table size n^{2/3}, with
    the residual ~0.9 bits being the factor-2 constant the exponent hides. THE
    AUDIT PASSES. This matters: a charging model that failed the program's own
    anchor would produce SDitH numbers nobody could use, and checking it costs
    nothing. KN-LIT-094 (Wiener) itself is NOT READ; the anchor is taken from
    KN-TECH-035's own statement of it.

    THE ISD COST MODEL, DECLARED LINE BY LINE.
    Prange. Iterations C(n,w)/C(n-k,w); per-iteration cost (n-k)^2 n field
    operations for the Gaussian elimination (DECLARED; the standard amortized
    variants reduce this and doing so LOWERS Prange, i.e. makes the comparison
    below more favourable to Prange, so the choice is conservative in the
    direction that would falsify this record's second headline); memory
    n(n-k) field elements, polynomial.
    Dumer/Stern with parameters (p, l). Per-iteration success
      P(p,l) = C(k+l, p) C(n-k-l, w-p) / C(n, w);
    two lists of size L = C((k+l)/2, p/2) (q-1)^{p/2}; expected collisions
    L^2/q^l; per-iteration cost (n-k)^2 n + (2L + L^2/q^l) * A, where A = 1
    under M0 and A = sqrt(2L) under M1; memory 2L cells.
    Total time is per-iteration cost divided by P. Optimize over p even,
    2 <= p <= 24, and 0 <= l < 50.

    RESULT 1 -- THE OPTIMUM MOVES. Computed here at three ILLUSTRATIVE parameter
    sets (SDitH's real parameters are NOT READ; these are shapes, not claims):
      A: n=256,  k=128, w=80,  q=256
         Prange              log2 T = 128.78, log2 M = 15.00
         Dumer free-optimal  log2 T = 114.11, log2 M = 28.06, (p,l) = (4,4)
         Dumer M1-optimal    log2 T = 118.50, log2 M = 15.02, (p,l) = (2,2)
      B: n=512,  k=256, w=120, q=256
         Prange              log2 T = 171.67, log2 M = 17.00
         Dumer free-optimal  log2 T = 153.76, log2 M = 30.02, (p,l) = (4,4)
         Dumer M1-optimal    log2 T = 159.55, log2 M = 16.01, (p,l) = (2,2)
      C: n=1024, k=512, w=80,  q=2
         Prange              log2 T = 112.83, log2 M = 19.00
         Dumer free-optimal  log2 T =  83.60, log2 M = 34.50, (p,l) = (10,34)
         Dumer M1-optimal    log2 T =  94.36, log2 M = 22.58, (p,l) = (6,22)
    The structural statement, which is what to remember: UNDER SQRT-M CHARGING
    THE OPTIMAL DUMER DEGENERATES TOWARD SMALL-MEMORY OPERATION. In the F_q
    cases the charged optimum's memory falls to essentially Prange's working-set
    size. That is a qualitative fact about the family, not a constant.

    RESULT 2 -- THE RE-OPTIMIZATION ERROR, WHICH IS THE POINT OF THE PROPOSAL.
    Charge the FREE optimum under M1 without re-optimizing -- the procedure a
    careful analyst would naturally follow, taking a published table row and
    adding the memory penalty:
      A: log2 T = 128.12 against the true charged optimum 118.50 -> 9.61 bits
         OVER-CHARGED
      B: log2 T = 168.73 against 159.55 -> 9.18 bits OVER-CHARGED
      C: log2 T = 100.84 against  94.36 -> 6.48 bits OVER-CHARGED
    The error is one-sided by construction -- charging a non-minimizer of the
    charged functional can only overstate the charged minimum -- so it is not
    noise that averages out, and it is 6 to 10 bits, which is the size of the
    entire gap the exercise is trying to measure. A charged baseline built the
    naive way would report that memory charging nearly erases Dumer's advantage
    (A: 128.12 versus Prange's 128.78 -- a 0.66-bit advantage, which reads as
    "the ranking is about to flip") when the true charged advantage is 10.28
    bits. THE NAIVE PROCEDURE PRODUCES THE HEADLINE THE PROGRAM WAS HOPING FOR,
    AND IT IS AN ARTIFACT.

    RESULT 3 -- THE HOPED-FOR REORDERING DOES NOT HAPPEN AT DUMER LEVEL. Charged
    advantage of Dumer over Prange under M1: 10.28, 12.12 and 18.47 bits at A, B
    and C. Charging shrinks the advantage (from 14.67, 17.91, 29.23) but does not
    reverse it. This session's ANGLE-BRIEF proposes as its number-three angle
    that under full cost "an ISD variant whose advantage is purely memory may
    lose to plain Prange, which reorders which exponent is the baseline at HQC,
    Classic McEliece and SDitH simultaneously." At Dumer level, at these shapes,
    THAT IS FALSE, and recording it as false is the honest deliverable. Whether
    it is false for MMT/BJMM/May-Ozerov -- whose memory exponents are far larger
    and which are therefore the real test of the hypothesis -- is NOT DETERMINED
    HERE, because those variants are NOT READ and NOT MODELLED. The proposal is
    explicit that this is where the answer actually lives.

    WHY THE ERROR EXISTS AT ALL, MECHANISTICALLY. T(p,l) and M(p,l) are both
    increasing in p and the merge cost L^2/q^l is decreasing in l while L is
    increasing in it. Free-memory optimization pushes p up until the collision
    term balances the list-building term; the charge multiplies BOTH terms by
    sqrt(2L), which is itself increasing in p, so the charged objective has a
    strictly steeper penalty in p and its minimizer sits at smaller p. The gap
    between the two minima is second-order in the curvature of log T around the
    free optimum -- which is exactly why it is a few bits rather than a few
    hundred, and exactly why it is invisible unless you look for it.

