      claim is attributed to Wiener directly.
    - >-
      SDitH SPECIFICATION: NOT READ. n, k, w, q, d and the claimed security
      levels are unknown to this record. All three parameter sets above are
      ILLUSTRATIVE shapes, chosen to span an F_q regime and a binary regime, and
      are not represented as SDitH's.
    - >-
      ESSER-BELLINI CONCRETE ISD TABLES, and the MMT / BJMM / May-Ozerov
      literature generally: NOT READ. NOT RELAYED EITHER -- no figure from them
      appears anywhere in this record. Their absence is the declared limit of
      Result 3 and reading them is a named stage of the paired experiment.
    - >-
      QUANTUM ISD CIRCUIT IMPROVEMENTS: NOT READ; the ANGLE-BRIEF relays that a
      2026 result improves qubit and Toffoli counts by roughly a fifth and is
      explicitly constant-factor. Nothing in this proposal depends on it and no
      figure from it is used.

  lossy_projection_identifiability_audit:
    projection: >-
      A full ISD algorithm instance (variant, all tuning parameters, all
      implementation choices)  -->  the pair (log2 T, log2 M) at its own
      optimum, plus the parametric curve that pair traces.
    what_is_discarded: >-
      Everything about how the algorithm works: which lists it builds, what
      representation technique it uses, how it verifies candidates, its constant
      factors below the declared model, its cache behaviour, its parallel
      structure. Two entirely different algorithms with the same (T, M) curve are
      indistinguishable under this projection.
    why_genuinely_lossy: >-
      Extremely lossy and non-invertible: the fibre over a single (T, M) point
      contains an unbounded family of algorithms. There is no route back from
      the pair to the algorithm.
    why_compatible_with_the_operations: >-
      The charging functionals M0, M1 and M2 are functions of (T, M) alone by
      construction, so the retained part propagates deterministically through
      exactly the operation being studied. This is the one property the
      projection needs and it holds by definition of the charge.
    is_it_only_a_change_of_coordinates: >-
      CHECKED FOR, AND IT IS NOT -- but the check is subtler here than in the
      counting proposal and deserves the space. Reporting (T, M) instead of T is
      not merely re-coordinatizing a scalar, because the charged optimum is a
      DIFFERENT POINT of the parametric family, not a rescaling of the same
      point. That is precisely what Result 2 demonstrates numerically: if the
      charge were a change of coordinates the free optimum would remain optimal
      and the re-optimization error would be exactly 0. It is 6 to 10 bits. The
      demonstration that the projection is not a reparametrization is therefore
      an OUTPUT of the proposal rather than an assumption of it.
    mirror_failure_checked: >-
      CHECKED. The mirror failure would be a charged cost that is essentially
      constant across ISD variants -- if every variant's charged cost collapsed
      to the same number, the charging would be measuring the parameter set and
      not the algorithm, and the comparator spread would be zero. It does not:
      across the three illustrative sets the charged Dumer-versus-Prange gap
      takes the distinct values 10.28, 12.12 and 18.47 bits, and within one
      parameter set the charged and free optima differ in both coordinates.
      Non-zero spread, demonstrated rather than assumed.

  assumptions:
    - >-
      That sqrt(M) is the right latency exponent for a random access into an
      M-cell store. This is a two-dimensional-layout assumption. A
      three-dimensional layout gives M^{1/3} and a fully idealized RAM gives 1.
      All three are cheap to evaluate and the paired experiment evaluates all
      three rather than choosing; the M1 result is reported as one column of a
      table, never as "the" charged cost.
    - >-
      That list construction is a random-access operation (hash-table insertion)
      and therefore charged. If a variant can be implemented with sorted
      streaming merges the build is sequential and only the probe phase pays.
      This is an implementation question with a real answer and it is a declared
      stage; the sensitivity of the conclusion to it is reported.
    - >-
      That the Gaussian elimination is not charged for memory access. Its
      working set is polynomial and its access pattern is regular; charging it
      would change Prange too, and in the same direction, so the comparison is
      insensitive to this choice at first order.
    - >-
      That the published tables optimize under free memory. RECALLED-UNVERIFIED
      as a general statement about the literature; it is certainly true of the
      asymptotic exponent tables and is the assumption the re-optimization error
      is stated against. A table that already optimizes under a charge would not
      exhibit the error, and Stage 0 checks which kind any transcribed table is.

  predictions:
    - metric: >-
        BSGS full-cost exponent recovered by model M1, by direct search over
        table size at n = 2^64, 2^128, 2^256
      direction: different
      minimum_effect: >-
        log2 cost within 1.0 bits of 2e/3, and optimal log2 m within 1.0 of
        2e/3, at all three sizes. Derived here as 43.58/86.27/171.58 against
        42.67/85.33/170.67, and 42/85/170 against 42.7/85.3/170.7. THIS GATE
        RUNS FIRST AND CAN TERMINATE THE WHOLE LINE: a charging model that
        cannot reproduce the program's own anchor may not be used to charge
        anything.
    - metric: >-
        re-optimization error, in bits, at each illustrative parameter set:
        (charged cost at the free optimum) minus (charged cost at the charged
        optimum)
      direction: higher
      minimum_effect: >-
        STRICTLY POSITIVE at every parameter set -- this is forced, since the
        charged optimum minimizes the charged objective -- and predicted to
        exceed 3 bits at all three. Derived here: 9.61, 9.18, 6.48. A value
        under 1 bit at all three would mean the effect is real but negligible
        and the proposal's headline should be downgraded to a footnote. A value
        of exactly 0 anywhere means the two optima coincide there, which is
        possible and would be informative about where the curvature vanishes.
    - metric: >-
        movement of the optimal (p, l) from the free charge to the M1 charge
      direction: different
      minimum_effect: >-
        The charged optimum's p must be STRICTLY LESS THAN the free optimum's p
        at every parameter set where the free optimum has p > 2. Derived here:
        (4,4) -> (2,2), (4,4) -> (2,2), (10,34) -> (6,22). If p does not move,
        the mechanism's account of why the error exists is wrong even if the
        error is not.
    - metric: >-
        charged advantage of Dumer over Prange under M1, in bits, at each
        illustrative set
      direction: higher
      minimum_effect: >-
        STRICTLY POSITIVE, predicted between 8 and 20 bits. Derived here: 10.28,
        12.12, 18.47. A NEGATIVE value at any set -- Prange winning once charged
        -- falsifies this prediction and CONFIRMS the ANGLE-BRIEF's hoped-for
        reordering, which would be the more interesting outcome and is
        pre-registered here precisely so it cannot be claimed after the fact.
    - metric: >-
        memory exponent of the M1-optimal Dumer relative to Prange's working set
      direction: lower
      minimum_effect: >-
        Within 4 bits of Prange's log2 M at the F_q parameter sets. Derived
        here: 15.02 against 15.00, and 16.01 against 17.00. This is the
        qualitative claim that charged Dumer degenerates to small-memory
        operation, and it is falsified if the charged optimum still holds a
        list more than 16 bits larger than Prange's matrix.

  minimal_test:
    design: >-
      Pure-Python integer and float arithmetic, no dependencies. Stages ordered
      cheapest first; stage 1 can end the line.
      STAGE 0 (reading, no compute): obtain an SDitH specification and
      transcribe (q, n, k, w) with a page reference; separately attempt to
      obtain one concrete ISD cost table and record whether it optimizes under a
      memory charge. Both are allowed to fail and a failure is infrastructure
      signal, never mathematical evidence.
      STAGE 1 (seconds): the BSGS baseline-reproduction gate for M1, M1' (cube
      root) and M0. If M1 misses the n^{2/3} anchor by more than 1 bit, STOP --
      the model is not usable and that is the finding.
      STAGE 2 (seconds): the (p, l) grid at the illustrative sets and, if Stage 0
      succeeded, at SDitH's real parameters, under all charging models, reporting
      the full table rather than a chosen column.
      STAGE 3 (seconds): the re-optimization error and the Prange comparison.
      STAGE 4 (declared, not budgeted here): transcribe and re-cost MMT, BJMM and
      May-Ozerov. This is where the reordering question is actually decided and
      it is NOT attempted in this proposal.
    controls:
      - >-
        NULL OBJECT OF THE SAME SHAPE (l = 0, p = 2, no lists). Dumer with these
        parameters degenerates to essentially Lee-Brickell with a trivial merge,
        whose memory is polynomial. FORCED VALUE, derived before the run: the
        re-optimization error at a parameter set whose FREE optimum is already
        (2,0) must be EXACTLY 0, because the free and charged optima coincide.
        This null can fail -- an implementation that adds a memory penalty
        unconditionally, or that mis-computes L at p = 2, returns a nonzero
        value. Construct such a parameter set deliberately and check.
      - >-
        POSITIVE CONTROL, THE EFFECT MUST APPEAR (BSGS). Baby-step giant-step is
        the canonical memory-bought algorithm and KN-TECH-035 states its charged
        exponent independently of this record. The instrument MUST return the
        2/3 exponent and the n^{2/3} optimal table size. If it does not, the
        charging code is broken and NO charged ISD number may be reported at
        all. Derived targets: log2 cost 43.58 / 86.27 / 171.58 and optimal
        log2 m 42 / 85 / 170 at n = 2^64 / 2^128 / 2^256.
      - >-
        SECOND POSITIVE CONTROL (unbounded memory exponent). Construct a
        synthetic algorithm whose memory grows as 2^{cn} with c large; its
        charged cost must diverge from its free cost by exactly c*n/2 bits under
        M1. A closed-form check on the charging arithmetic itself, independent
        of any ISD formula.
      - >-
        GRADED CONTROL, >= 3 INTERIOR POINTS, MONOTONICITY REPORTED. Sweep the
        latency exponent alpha in {0, 1/6, 1/4, 1/3, 1/2, 2/3} with access cost
        M^alpha, and report the charged optimum's p, its memory exponent, and
        the charged Dumer-Prange gap at each. PRE-REGISTERED SHAPE: p must be
        non-increasing in alpha, the memory exponent must be non-increasing in
        alpha, and the Dumer-Prange gap must be non-increasing in alpha, with
        alpha = 0 reproducing the free-memory table EXACTLY. A non-monotone
        point localizes a fault to a specific alpha instead of leaving "the
        charging did something odd", and the alpha at which the gap crosses zero
        -- if it does within [0, 2/3] -- IS the answer to the reordering
        question in a form that does not depend on choosing a model.
      - >-
        ORDERING CONTROL. Compute and commit the entire free-memory table
        (M0 column) before the charged columns are computed or looked at, so
        that no charged number can be tuned against a desired ranking.
    required_metrics:
      - BSGS gate: optimal log2 m and log2 cost at three sizes, against the 2/3 anchor
      - full (p, l) optimum per parameter set per charging model, with log2 T and log2 M
      - re-optimization error in bits per parameter set
      - charged and free Dumer-Prange gap per parameter set
      - the alpha-sweep table with an explicit monotonicity verdict and any crossing point
      - source-provenance record for every transcribed parameter, or a failed-fetch record

  falsification_conditions:
    - >-
      M1 fails to reproduce the BSGS n^{2/3} anchor within 1 bit. The charging
      model is refuted before it is used, and that IS the result -- it would
      mean the program's charging doctrine and its arithmetic realization
      disagree, which is worth more than any SDitH number.
    - >-
      The re-optimization error is under 1 bit at all parameter sets. The
      headline is downgraded from "the standard procedure is wrong by 6 to 10
      bits" to "the standard procedure is very slightly wrong", and the record
      must say so.
    - >-
      The charged optimum's p does not fall below the free optimum's p. The
      mechanistic account is wrong and must be withdrawn even if the error
      persists.
    - >-
      The charged Dumer-Prange gap is negative at any illustrative set. The
      third prediction is falsified and the reordering hypothesis is CONFIRMED
      at Dumer level, which reverses this proposal's conclusion and raises the
      priority of Stage 4 sharply.
    - >-
      The alpha-sweep is non-monotone in any of the three reported quantities.
      An implementation fault, localized to the offending alpha.

  confounders:
    - >-
      VARIANT COVERAGE IS THE DOMINANT CONFOUNDER. Prange and Dumer are the two
      variants modelled. The reordering hypothesis is about the variants with
      the LARGEST memory exponents, which are exactly the ones not modelled. A
      negative answer at Dumer level is weak evidence about BJMM and must never
      be reported as though it settled the family.
    - >-
      MODEL CHOICE. sqrt(M) versus M^{1/3} versus free is a choice, and the
      answer depends on it. The alpha-sweep exists so the dependence is reported
      as a curve rather than hidden inside a single chosen column.
    - >-
      COST-MODEL CONSERVATISM CUTS BOTH WAYS. The declared Gaussian-elimination
      cost (n-k)^2 n is generous; the standard amortization lowers it and lowers
      Prange more than Dumer, which would SHRINK the charged Dumer advantage.
      This is stated because it works against this record's own conclusion and
      must not be quietly omitted.
    - >-
      ILLUSTRATIVE PARAMETERS ARE NOT SDitH'S. Three shapes are not a survey.
      Every conclusion is scoped to the shapes actually evaluated until Stage 0
      supplies the real ones.
    - >-
      A CHARGED BASELINE IS STILL A BASELINE, NOT A SECURITY LEVEL. Converting
      any of these numbers into a statement about SDitH's security requires the
      real parameters, the best variant, and the scheme's own reduction, none of
      which this proposal supplies.

  interpretation_limits:
    - >-
      CLAIM TIER: cost-model derivation. No decoding is performed, no
      certificate is produced, no instance is solved. Under
      docs/claims-and-verification.md nothing here may be reported as a break, a
      weakness, or a security level, and the conclusion is scoped to the exact
      variants, parameter sets and charging models evaluated.
    - >-
      "Dumer still beats Prange when charged" is scoped to Dumer, to the three
      illustrative shapes, and to the declared model. It is NOT a statement that
      full-cost accounting fails to reorder ISD, and it must not be cited as
      one.
    - >-
      The re-optimization error is a statement about a PROCEDURE, not about any
      published paper. No published table is accused of committing it; the claim
      is that a downstream analyst charging a published optimum would.
    - >-
      FORWARD GUIDANCE. What remains open: (a) MMT/BJMM/May-Ozerov under the same
      charge, which is where the reordering question lives; (b) whether any
      published concrete table already optimizes under a charge, which Stage 0
      may answer; (c) the crossing alpha, if any, at which Prange becomes the
      charged baseline -- a single number that would answer the reordering
      question in a model-independent way and that this proposal's graded control
      is designed to produce.

  heuristic_assumptions:
    - id: HEUR-SDITH-43D-1
      statement: >-
        ACCESS-LATENCY EXPONENT. A random access into a store of M cells costs
        Theta(M^{1/2}) time in a two-dimensional physical layout, and this is
        the correct charge for the list operations of a Dumer-style ISD.
      rigorous_support: >-
        The geometric part is standard: M cells in a plane occupy area
        Theta(M) and have diameter Theta(M^{1/2}); a signal crossing it takes
        that long. What is NOT rigorous is that this per-access charge is the
        right aggregate model for a pipelined, parallel implementation, where
        many accesses may be in flight. KN-TECH-035 is the corpus's authority
        and its own source (Wiener) is not read here.
      validation_plan: >-
        The BSGS baseline-reproduction gate IS this heuristic's test, and it is
        a real one: the model was NOT tuned to hit 2/3, and it hits both the
        exponent and the optimal table size. The alpha-sweep then reports the
        conclusion's sensitivity across the whole range rather than defending a
        point.
    - id: HEUR-SDITH-43D-2
      statement: >-
        MODEL FIDELITY. The declared Prange and Dumer cost expressions are
        faithful enough that the DIFFERENCE between the free and charged optima
        is preserved, even where their absolute values are not.
      rigorous_support: >-
        None beyond the structural argument in the mechanism's last paragraph:
        the error is second-order in the curvature of log T near the free
        optimum, and curvature is a more robust feature of a cost model than its
        level. This is an argument, not a proof, and it is the weakest link in
        the record.
      validation_plan: >-
        Recompute the re-optimization error under two deliberately different
        Gaussian-elimination cost choices, (n-k)^2 n and (n-k)^2, and report
        both. If the error changes by more than a bit between them, the
        robustness argument is refuted and the number must be reported with that
        spread attached.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS MOVED BY THIS PROPOSAL, and it does not pretend otherwise.
      It computes which exponent should be treated as the baseline. That said,
      the quantity it computes is an exponent-level quantity, not a cofactor: 6
      to 10 bits of procedural error, and 10 to 18 bits of charged Dumer
      advantage, are differences in the security exponent at the parameter sets
      evaluated, and the crossing-alpha the graded control looks for would be an
      exponent statement about which algorithm is the baseline.
    memory_exponent: >-
      Reported for every point, which is the whole proposal. Prange log2 M =
      15/17/19 at the three sets; Dumer free-optimal 28.06/30.02/34.50; Dumer
      M1-optimal 15.02/16.01/22.58.
    best_known: >-
      For plain SD at these sizes, the best known is a representation-technique
      variant (MMT/BJMM/May-Ozerov) whose free-memory exponent is below Dumer's
      and whose memory exponent is above it. NOT READ, NOT MODELLED, NO FIGURE
      QUOTED. That is the honest state and it is the reason Result 3 is scoped
      to Dumer.
    hidden_overhead: >-
      Declared rather than hidden: the Gaussian-elimination cost choice, the
      treatment of list construction as random access, and the exclusion of
      candidate-verification cost. Each is named, each has a stated direction of
      effect, and the two with a plausible alternative are evaluated both ways.
    tradeoff_note: >-
      The proposal IS a time-memory tradeoff analysis. The alpha-sweep is the
      tradeoff curve and reporting it as a curve rather than a point is the
      methodological contribution.

  dominated_by: >-
    n/a (no attack claimed, no Pareto point occupied). Rows checked before
    asserting this, across all three axes: TIME -- no ISD experiment or evidence
    record exists in this corpus (verified by area grep and independently by the
    session ANGLE-BRIEF); MEMORY -- KN-TECH-035 (read) and KN-TECH-044 (exists,
    not read) are the corpus's charging vehicles and contain no ISD costing;
    DATA/QUERIES -- SD is a single-instance problem with no query axis and no
    frontier row exists to check. External literature NOT searched this session;
    a published charged ISD table may exist and its absence here is not evidence
    of absence in the world.
  sota_delta: >-
    Quantitative. (1) Against the program's prior state: three goals name a
    memory-charged ISD baseline as deliverable number one and the corpus
    contains ZERO such computations; this supplies one, with its charging model
    validated against the program's own BSGS anchor to within 1 bit. (2) Against
    the naive construction of that same baseline: 9.61, 9.18 and 6.48 bits of
    one-sided over-charge removed at the three illustrative sets -- large enough
    to invert the qualitative reading at set A, where the naive procedure reports
    a 0.66-bit Dumer advantage and the correct one reports 10.28 bits. (3)
    Against the external state of the art: ZERO, presumed, and stated as such --
    no new algorithm, no new bound, nothing a coding theorist would call a
    result.

  estimated_cost:
    implementation: low
    compute: negligible
  recommended_priority: high
  honest_prior_of_survival: >-
    0.90 that the re-optimization error survives review as a real and
    quantitatively material effect. It is not higher because HEUR-SDITH-43D-2 is
    an argument rather than a proof, because the effect's size depends on a cost
    model this record declares rather than sources, and because a reviewer who
    rejects the sqrt(M) charge rejects the number along with it -- the
    alpha-sweep mitigates but does not remove that. It is not lower because the
    effect is FORCED to be non-negative by the definition of a minimum, because
    the charging model passed a baseline-reproduction check it was not tuned
    for, and because the mechanism gives a structural reason for the direction
    (the charge is increasing in p, so the charged minimizer has smaller p) that
    is independent of the arithmetic. Separately: 0.35 that the ANGLE-BRIEF's
    reordering hypothesis survives at MMT/BJMM level once Stage 4 is done --
    stated explicitly so that this record's Dumer-level negative is not mistaken
    for a closure of that question.
