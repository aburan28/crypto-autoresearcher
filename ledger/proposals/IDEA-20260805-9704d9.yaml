idea:
  id: IDEA-20260805-9704d9
  question_id: RQ-MCE-e65b3c
  goal_id: GOAL-MCE-001
  added: '2026-08-05'
  title: >-
    The alternant degree of Classic McEliece is 2t, not t: a squarefree-doubling
    audit that makes every published alternant threshold a factor-2 question and
    supplies the mechanism behind the Goppa exclusion this goal already read

  class: identifiability_audit

  claim: >-
    Classic McEliece's public code admits TWO inequivalent presentations as an
    alternant code, and the whole "distance from the attack regime" arithmetic
    that GOAL-MCE-001's completion criterion 1 demands is different in each. A
    binary Goppa code Gamma(L,g) with deg g = t is the alternant code of degree
    t with multiplier y_i = g(alpha_i)^(-1) -- that presentation is generic,
    dimension n - m*t, nothing anomalous. But for BINARY Goppa codes with g
    SQUAREFREE the classical doubling identity Gamma(L,g) = Gamma(L,g^2)
    (RECALLED-UNVERIFIED; no citation is asserted and locating one is a step of
    the experiment, not an input to it) makes the SAME code an alternant code of
    degree 2t -- and in THAT presentation its dimension exceeds the generic
    value n - 2*m*t by exactly m*t. So a threshold published as a condition on
    the alternant degree r must be evaluated at r = 2t for Classic McEliece, and
    evaluating it at r = t reports HALF the true degree at the parameters where
    the answer is decided. This proposal claims no attack and no break. It
    claims that a load-bearing number in this goal's central deliverable is
    ambiguous by a factor of two, that the ambiguity has a mechanism, that the
    mechanism is exactly the shape of the verbatim Goppa exclusion this goal's
    own BATCH-001 read from primary text (EV-MCE-332f99 O-5), and that the whole
    thing is decidable at toy scale by exact F_2 rank computations in pure
    Python in seconds.

  object_first_candidate:
    tracked_object: >-
      THE DIMENSION EXCESS OF A CODE OVER THE GENERIC BOUND OF ITS OWN
      PRESENTATION -- written delta(C, r) = dim_{F_2} C - (n - m*r) -- followed
      as the presentation degree r is varied over a single fixed code. The
      object is not the code, not the support, not the Goppa polynomial and not
      any attack: it is one integer attached to a (code, claimed degree) PAIR,
      and the entire content is that this integer is 0 at r = t and m*t at
      r = 2t for the same code. A quantity that changes when only the
      DESCRIPTION changes is exactly the kind of quantity a threshold stated in
      that description will misreport.
    established_families_off_limits: >-
      Declared off-limits as the primary lens, so this cannot regress into a
      renamed version of one of them:
      (a) information-set decoding and every generic-decoding variant --
      that is IDEA-20260805-554b9d's lane and is deliberately disjoint;
      (b) building a new distinguisher or a new key-recovery attack of any
      kind, including any square-code, syzygy, Pfaffian, MinRank, shortening or
      filtration construction;
      (c) side-channel, fault, decryption-failure and implementation attacks,
      which RQ-MCE-e65b3c fences as a separate claim class;
      (d) parameter-tweaking or variant proposals for the scheme.
      What is used instead is a purely BOOKKEEPING lens -- which parameter a
      published threshold is a function of, and what value that parameter takes
      on the actual object -- which is not an attack family at all.
    newness_score: >-
      The doubling identity is textbook (the standard route to the d >= 2t+1
      minimum distance of binary Goppa codes) and is certainly not new
      mathematics. The corpus does not contain it: grep of knowledge/ returns no
      statement of it, and no record in this goal's lineage mentions the
      alternant degree of Classic McEliece at all. What is new here is its use
      as an IDENTIFIABILITY AUDIT on the threshold arithmetic -- the observation
      that "the alternant degree of this code" is not well defined, that the two
      admissible values differ by a factor of two, and that this program was
      about to compute a distance using one of them without noticing the other.
    testability_score: >-
      Highest available in this goal. Every claim reduces to exact F_2 linear
      algebra on matrices of a few hundred columns, with F_(2^m) arithmetic
      implemented in about forty lines of pure Python. m <= 6, t <= 6, n <= 64:
      seconds, no dependency, on a machine measured this session to have
      numpy 2.4.6 but no Sage, no sympy and no fpylll.
    survival_score: >-
      The object survives the whole computation, because it is defined by exact
      ranks that do not degrade. Where it can dissolve is in relevance: the
      doubling is a statement about the CODE, and whether any particular
      published threshold is a function of r rather than of the code family is a
      separate question that only the primary text can settle. That separation
      is built into the experiment as its own stage, and the stage can return
      "the threshold does not depend on r at all", which would be a clean
      negative for this proposal and a real finding for the goal.

  mechanism: >-
    OBJECTS. Fix m, let F = F_(2^m), let L = (alpha_1, ..., alpha_n) be distinct
    elements of F, and let g in F[X] have degree t with g(alpha_i) != 0 for all
    i. The binary Goppa code is
      Gamma(L, g) = { c in F_2^n : sum_i c_i/(X - alpha_i) = 0 in F[X]/(g) }.
    The alternant code of degree r with multiplier y in (F^*)^n is
      A_r(L, y) = { c in F_2^n : sum_i c_i * y_i * alpha_i^j = 0 in F,
                    for j = 0, 1, ..., r-1 },
    i.e. the F_2-subfield subcode of the generalised Reed-Solomon code with
    that multiplier.
    STEP 1 -- GOPPA IS ALTERNANT, DERIVED. Modulo g one has
      1/(X - alpha_i) = -g(alpha_i)^(-1) * (g(X) - g(alpha_i))/(X - alpha_i),
    and the right-hand quotient is a polynomial of degree t-1 whose coefficients
    are polynomial in alpha_i. Expanding the syndrome condition coefficient by
    coefficient gives exactly r = t linear conditions over F of alternant shape
    with y_i = g(alpha_i)^(-1). Hence Gamma(L,g) = A_t(L, y) with that y, and
    the generic dimension bound for an alternant code of degree r,
      dim_{F_2} A_r(L,y) >= n - m*r,
    reads dim Gamma(L,g) >= n - m*t. Classic McEliece's specification takes
    k = n - m*t exactly (EV-MCE-332f99 O-1, transcribed from
    mceliece-spec-20221023.pdf section 3 and independently recomputed), so in
    THIS presentation the code sits exactly on the generic bound and carries
    delta(C, t) = 0. Nothing distinguishes it by dimension.
    STEP 2 -- THE DOUBLING, AND WHY IT IS THE WHOLE PROPOSAL. For q = 2 and g
    SQUAREFREE the classical identity is
      Gamma(L, g) = Gamma(L, g^2).
    RECALLED-UNVERIFIED. It is the standard route to the improved binary-Goppa
    minimum distance d >= 2t + 1, and the sketch is that for c in Gamma(L,g) the
    syndrome sum_i c_i/(X - alpha_i) equals f'/f where f = prod_{i in supp(c)}
    (X - alpha_i); over F_2 the derivative f' is a square, so g | f' together
    with g squarefree forces g^2 | f'. NO CITATION, NO THEOREM NUMBER AND NO
    AUTHOR IS ASSERTED HERE, because none was read. Both the identity and this
    sketch are CANDIDATES TO CHECK and the checking is stage 1 of the
    experiment, done computationally before any literature is consulted.
    STEP 3 -- THE CONSEQUENCE, WHICH IS A DIMENSION EXCESS. Granting step 2,
    Gamma(L,g) = A_(2t)(L, y') with y'_i = g(alpha_i)^(-2). The generic bound
    for degree 2t is n - 2*m*t. The actual dimension is n - m*t. Therefore
      delta(C, 2t) = (n - m*t) - (n - 2*m*t) = m*t,
    EXACTLY, and since Classic McEliece sets k = n - m*t this is
      delta(C, 2t) = n - k,
    so the excess AS A FRACTION OF n equals the code's redundancy rate 1 - k/n.
    From the rates already transcribed and independently recomputed in
    EV-MCE-332f99 O-1 (85/109, 35/48, 157/209, 5413/6960, 51/64) the forced
    values at the five parameter sets are, in order,
      24/109 = 0.220183, 13/48 = 0.270833, 52/209 = 0.248804,
      1547/6960 = 0.222270, 13/64 = 0.203125.
    These are arithmetic on a committed record, not measurements, and they are
    stated here so the experiment can be falsified by reproducing them wrongly.
    STEP 4 -- WHY THIS IS AN IDENTIFIABILITY FAILURE AND NOT A CURIOSITY. A
    published attack or distinguisher on alternant codes states its regime as a
    condition on (n, m, r) -- most often a high-rate condition, i.e. m*r small
    relative to n. Classic McEliece presents to that condition with two
    different values of r that differ by a factor of two, hence two different
    values of m*r/n that differ by a factor of two, hence two different distances
    from any such threshold. A deliverable that reports one of them without the
    other has not stated the distance; it has stated a distance. This is
    inventor-protocol section 8 audit 2 (observation collision) in its exact
    form: the observable "alternant degree" does not determine the object, and
    two admissible readings of the same object give different answers on the
    quantity the conclusion rests on.
    STEP 5 -- THE PROPOSED MECHANISM FOR THIS GOAL'S OWN READ NEGATIVE. This
    goal's BATCH-001 obtained, from full text, arXiv:2304.14757's verbatim
    statement that its attack "does not work at all when the alternant code has
    the additional structure of being a Goppa code" (EV-MCE-332f99 O-5, text
    re-acquired byte-identically by an independent validator). That sentence is
    currently in the corpus as a bare fact with no mechanism attached, and the
    goal's own next_action treats it purely as a correction to a rate-scoping
    claim. The proposal here is a candidate mechanism: an attack whose
    parameters are optimised for a generic degree-r alternant code meets, in the
    Goppa case, an object that is simultaneously degree-t generic and degree-2t
    anomalous, so its system is built at the wrong degree in one reading and is
    m*t-dimensionally degenerate in the other. THIS IS A HYPOTHESIS, NOT A
    READING OF THAT PAPER, whose body was not obtained for this record; it is
    stated so that it can be checked against the text and refuted.
    STEP 6 -- THE MEASURABLE THAT DECIDES IT, AND WHY IT IS FREE. The
    load-bearing observable of the whole distinguisher line is the dimension of
    a square code: for a code D with basis d_1..d_s, D*D is the F_2-span of the
    componentwise products d_i (*) d_j, whose dimension for a random D is
    min(n, C(s+1, 2)). The alternant/Goppa distinguisher is precisely the
    statement that for the DUAL of a high-rate alternant code this dimension
    falls below that generic value. Every quantity named in steps 1-4 --
    dim Gamma(L,g), dim Gamma(L,g^2), dim A_r(L,y) for random y, and
    dim(D*D) for each dual -- is an exact F_2 rank of a matrix with at most n
    columns. At m <= 6, n <= 64 that is milliseconds, and the entire audit runs
    without Sage, without sympy and without any solver, all of which were
    measured absent from this container this session.

  novelty_status: unverified

  literature_context:
    - >-
      EV-MCE-332f99 (READ, in repo, this goal's own BATCH-001 evidence record).
      O-1 supplies the five parameter sets and rates used in step 3, transcribed
      from mceliece-spec-20221023.pdf section 7 with k = n - m*t from section 3,
      independently recomputed 5/5 by a separate validator task. O-5 supplies the
      verbatim Goppa-exclusion sentence of arXiv:2304.14757. O-2 records that
      iacr:2026/1232's complexity statement is a CONJECTURE ("subexponential in
      the security parameter", no exponent, no formula) and O-3 that no rate
      regime appears in the obtained text. This proposal takes those as its
      starting facts and adds no reading of its own to either paper.
    - >-
      KN-LIT-4c8135 (arXiv:2304.14757, polynomial-time key recovery for
      high-rate random alternant codes). NOT READ here. The goal record states
      that this entry describes the paper's boundary as rate-scoped where the
      paper's own words make it family-scoped, and that correcting the entry is
      part of the queued BATCH-002. This proposal does not touch the entry --
      new files only -- and instead supplies what the correction does not: a
      candidate MECHANISM for the family-scoping, and a second, independent
      reason the rate reading is unsafe even after the correction, namely that
      the degree the rate is computed from is itself ambiguous.
    - >-
      KN-LIT-13a01d (high-rate alternant/Goppa distinguisher), KN-LIT-71d1a0
      (syzygy distinguisher), KN-LIT-7ee1a9 (degree-2 alternant). NONE READ.
      Named because they are RQ-MCE-e65b3c's declared secondary targets and
      because the square-code observable in step 6 is (RECALLED-UNVERIFIED) the
      observable of that line. Whether each states its threshold in the
      alternant degree r, in the rate, or in the code family is precisely what
      stage 3 of the experiment reads and records, one paper at a time, and it
      is the question that decides whether this proposal is relevant to them at
      all.
    - >-
      The squarefree-doubling identity and the d >= 2t+1 bound are attributed in
      the literature to the binary-Goppa minimum-distance line. NO AUTHOR, NO
      YEAR, NO THEOREM NUMBER AND NO VENUE IS ASSERTED, because none was
      checked. The identity is treated here strictly as a computational
      prediction to be verified at toy scale before any source is consulted, and
      the source hunt is a separately budgeted stage whose failure is recorded
      rather than papered over.

  lossy_projection_identifiability_audit:
    projection: >-
      A fully specified Goppa instance (m, the ordered support L, the polynomial
      g, hence the secret key in full) is projected to the pair
      (r, delta(C, r)) = (claimed alternant degree, dimension excess over the
      generic bound at that degree), and thence to the single integer
      delta(C, r).
    what_is_discarded: >-
      The support, the polynomial, the field, the permutation, the entire secret
      key, and the code itself up to the two integers n - m*r and dim C. The
      fibre over an observed delta is astronomically large -- every code of the
      same length and dimension maps to the same value at a given r.
    why_genuinely_lossy: >-
      Maximally so, and demonstrably: dim C is a single integer and cannot
      encode a support of n elements of F_(2^m). There is no route back, unlike
      the canonical failure of KN-LIT-7595 where (Delta, Pi) = (x XOR y, x*y)
      retains the unordered pair as the roots of t^2 + Delta*t + Pi. Nothing
      here is recoverable from delta.
    why_compatible_with_the_operations: >-
      The retained part propagates deterministically under the operations that
      matter, and this is the substantive part of the audit rather than a
      formality. The operations are (i) changing the presentation degree
      r -> r', under which delta transforms by the exact rule
      delta(C, r') = delta(C, r) + m*(r' - r), a deterministic shift depending
      only on m; and (ii) the isometries the scheme applies -- coordinate
      permutation and F_2-scaling -- under which dim C and hence delta are
      INVARIANT. So delta propagates cleanly through exactly the group the
      public key is scrambled by, which is what makes it usable as an
      instance-independent bookkeeping quantity.
    is_it_only_a_change_of_coordinates: >-
      NO, and the mirror failure is the one that had to be checked, so it was
      checked first and the check is stated. delta is at risk of being CONSTANT
      across instances -- a constant of the apparatus rather than a property of
      the object, the zero-comparator-spread failure. The check: delta(C, t) = 0
      for every alternant code of degree t sitting on the generic bound,
      including random ones, so at r = t the quantity IS essentially constant
      and carries no information. It is at r = 2t that it separates: m*t for the
      binary Goppa code, 0 for a random degree-2t alternant code with a random
      multiplier. The comparator spread at r = 2t is therefore m*t, which is
      nonzero, computable, and forced. That is precisely why the experiment
      measures BOTH presentations and reports the pair rather than either alone,
      and why the null arm is a random-multiplier alternant code at the same
      (n, m, r) rather than an unmatched random code.

  assumptions:
    - >-
      That the doubling identity holds as stated for binary Goppa codes with
      squarefree g. IT IS NOT ASSUMED -- it is prediction FV-A and the first
      thing measured, and if it fails at toy scale the proposal collapses at
      zero cost, which is the intended shape.
    - >-
      That Classic McEliece's g is squarefree at the standardized parameters.
      The specification is understood to require g irreducible (hence
      squarefree), which is STRONGER than needed; but this is RECALLED and the
      experiment must confirm it from the transcribed specification, because if
      g were merely squarefree-not-irreducible the identity still applies and if
      it were neither the whole proposal is inapplicable to the real scheme.
    - >-
      That published thresholds in the alternant line are stated in terms of a
      degree parameter at all. If a threshold is stated purely in the rate or
      purely in the code family, the factor-2 ambiguity does not touch it, and
      the experiment must report that rather than force a relevance.

  predictions:
    - metric: >-
        FV-A. Fraction of toy instances (m in {4,5,6}, t in {2,3,4,5},
        n = 2^m or n = 2^m - 1, g squarefree with no root in L) at which
        Gamma(L,g) and Gamma(L,g^2) have IDENTICAL F_2 row spaces, verified by
        exact rank of the stacked generator matrices equalling each individual
        rank.
      direction: higher
      minimum_effect: >-
        1.00, i.e. identity at 100 per cent of instances, at least 60 instances
        across at least 3 values of m. Derived before the run from mechanism
        step 2. A single failure refutes the identity as stated, and the correct
        response is to record the failing instance and re-derive, not to
        weaken the prediction.
    - metric: >-
        FV-B. The excess delta(Gamma(L,g), 2t) = dim Gamma(L,g) - (n - 2*m*t),
        measured, over the same instance set.
      direction: different
      minimum_effect: >-
        EXACTLY m*t at every instance where dim Gamma(L,g) = n - m*t, and the
        fraction of instances attaining dim = n - m*t reported separately (toy
        parameters can exceed the bound for small n, and that is a measurement,
        not an error). No tolerance: this is an integer identity.
    - metric: >-
        FV-C. The five redundancy fractions (n-k)/n recomputed in exact
        rationals from the (m, n, t) of the five Classic McEliece parameter
        sets, compared against the values derived in mechanism step 3.
      direction: different
      minimum_effect: >-
        EXACTLY 24/109, 13/48, 52/209, 1547/6960, 13/64 -- equivalently
        0.220183, 0.270833, 0.248804, 0.222270, 0.203125 to six decimal places.
        Any deviation means either the transcription in EV-MCE-332f99 O-1 or
        this derivation is wrong, and the discrepancy is routed to a correction
        record rather than absorbed.
    - metric: >-
        FV-D (the null contrast). delta(A_(2t)(L, y_random), 2t) for a uniformly
        random multiplier y over the same (n, m, t), and the difference
        dim A_t(L, y_random) - dim A_(2t)(L, y_random).
      direction: different
      minimum_effect: >-
        delta EXACTLY 0 and the dimension difference EXACTLY m*t, at at least
        90 per cent of random instances (the residual allowing for small-n
        degeneracies, which are reported individually). This is the arm that
        makes FV-B mean something: the Goppa code gives excess m*t and
        difference 0, the random alternant code gives excess 0 and difference
        m*t, and the two are the same measurement applied to matched objects.
    - metric: >-
        Square-code observable. dim((C^perp)*(C^perp)) for the Goppa code, for
        the matched random alternant code of degree t, for the matched random
        alternant code of degree 2t, and for a uniformly random binary code of
        the same length and dimension, each compared to the generic value
        min(n, C(s+1,2)) with s the dual dimension.
      direction: lower
      minimum_effect: >-
        The random binary code must attain the generic value (that is the
        positive control on the rank routine, and no other arm is interpretable
        without it). For the Goppa code the prediction is a STRICT shortfall at
        the high-rate toy cells and NO prediction is made for its size, because
        no source was read and inventing a defect formula would be fabrication.
        The reported deliverable is the measured shortfall table with its
        generic reference column, plus the m-and-t cells at which the shortfall
        first appears.
    - metric: >-
        Graded squarefreeness sweep. dim Gamma(L, g_j) - dim Gamma(L, g_j^2) for
        g_j = g_0 * h^j, j = 0,1,2,3, with g_0 squarefree of degree t-3 and h
        linear and coprime to g_0.
      direction: higher
      minimum_effect: >-
        EXACTLY 0 at j = 0, and NON-DECREASING in j, with at least one strictly
        positive value by j = 3. Monotonicity is reported as the headline of
        this arm. A flat sweep means the doubling is not driven by
        squarefreeness at all, which would falsify the stated mechanism while
        leaving the FV-A measurement intact -- a localisation, not a dead end.

  minimal_test:
    design: >-
      Four stages, cheapest first, each able to end the line.
      STAGE 0 (paper, minutes): re-derive steps 1 and 3. delta(C, r') -
      delta(C, r) = m*(r' - r) and delta(C, 2t) = n - k under k = n - m*t are
      one-line identities; if either is wrong the proposal ends before any code
      is written.
      STAGE 1 (pure Python, seconds): implement F_(2^m) by a Conway-free
      explicit irreducible polynomial recorded in the contract, build the
      alternant parity checks, expand to F_2 by a fixed basis, take exact ranks,
      and run FV-A, FV-B, FV-D and the graded sweep. THIS STAGE CAN TERMINATE
      THE WHOLE LINE: if FV-A fails the identity is not what is claimed.
      STAGE 2 (pure Python, seconds): the square-code observable and its
      positive control on a uniformly random binary code.
      STAGE 3 (reading, hours, network): for each of KN-LIT-13a01d,
      KN-LIT-4c8135, KN-LIT-71d1a0, KN-LIT-7ee1a9, record verbatim WHAT
      PARAMETER the threshold is stated in -- degree, rate, or code family --
      and whether the paper itself resolves the r = t versus r = 2t reading.
      Any paper not obtained is recorded as ABSENT with the routes tried, and
      the iacr:2026/1232 PDF is NOT re-attempted by any route: its 403 is
      path-scoped and reproducible (EV-MCE-332f99 O-9), circumvention is
      forbidden, and a blocked route is a recorded outcome (AGENTS.md rule 5).
    controls:
      - >-
        NULL OBJECT (matched random alternant, same shape). A_r(L, y) with y
        uniform in (F^*)^n, same n, same m, same r, same field, same code
        construction, differing only in whether the multiplier has the
        Goppa form g(alpha_i)^(-1). FORCED VALUE DERIVED BEFORE THE RUN:
        delta = 0 at both r = t and r = 2t, hence
        dim A_t - dim A_(2t) = m*t exactly. This null CAN FAIL: if a random
        multiplier also produced the doubling, the phenomenon would not be about
        Goppa structure at all and the proposal would be refuted by its own
        control. It is the matched null the T-A census says 72 per cent of this
        program's evidence records lack.
      - >-
        POSITIVE CONTROL (the effect MUST appear). A uniformly random binary
        [n, n - m*t] code must return the generic square-code dimension
        min(n, C(s+1,2)) for its dual, and a random degree-t alternant code must
        return dim exactly n - m*t. Both are declared before the run with a
        tolerance of ZERO. If either fails, the rank routine or the code
        construction is broken and NO negative result from any other arm may be
        reported (inventor protocol section 3).
      - >-
        GRADED CONTROL (four points, monotonicity reported). The squarefreeness
        sweep g_j = g_0 * h^j, j = 0..3, described above. It converts a possible
        "the identity did not hold" into "the identity holds up to multiplicity
        j and fails from j onward", which localises the obstruction to the exact
        algebraic feature the mechanism names.
      - >-
        ORDERING CONTROL. The null arm and both positive controls are computed,
        hashed and committed before the Goppa arm is examined, and the
        pass/fail rule for each is written into the contract before any number
        is produced.
      - >-
        SPECIFICATION CONTROL (zero compute). Confirm from the transcribed
        Classic McEliece specification whether g is required irreducible, merely
        squarefree, or neither. If g is not squarefree at the real parameters,
        the doubling does not apply to the deployed scheme and the toy result
        stands as pure coding theory with no bearing on the goal -- which must
        be stated, not quietly dropped.
    required_metrics:
      - per-instance (m, t, n, |L|, dim Gamma(L,g), dim Gamma(L,g^2), identity holds yes/no)
      - per-instance delta at r = t and r = 2t, for the Goppa arm and the matched random-multiplier null arm
      - the five exact rational redundancy fractions and their six-decimal forms
      - dual square-code dimensions with the generic reference value, all four arms
      - the graded sweep table with monotonicity stated explicitly
      - for each of the four threshold papers, the verbatim parameter the threshold is stated in, or ABSENT plus routes tried

  falsification_conditions:
    - >-
      FV-A fails at any toy instance with squarefree g. The doubling identity is
      not as recalled, the r = 2t presentation does not exist, and the entire
      proposal is void. This is the intended primary falsifier and it costs
      seconds.
    - >-
      The matched random-multiplier null ALSO exhibits the doubling. The
      phenomenon is then not Goppa-specific, delta carries no separating
      information, and the identifiability claim is refuted by its own control.
    - >-
      The positive control fails. Nothing at all may be reported.
    - >-
      Every one of the four threshold papers turns out to state its condition in
      the code family or in the rate and not in a degree parameter. The
      factor-2 ambiguity is then real coding theory with no bearing on any
      published threshold, and this proposal's relevance to GOAL-MCE-001
      completion criterion 1 is falsified -- which must be recorded as such and
      not reframed.
    - >-
      The specification requires g irreducible AND some published threshold is
      shown to already use r = 2t. The observation is then already in the
      literature, the novelty claim is withdrawn in a superseding record, and
      the deliverable reduces to a corpus entry recording where it was found.

  confounders:
    - >-
      TOY DEGENERACY. At m = 4, n = 16, t = 5 the quantity n - 2*m*t is
      negative, so the generic bound is vacuous and delta is meaningless. The
      instance grid must be filtered so that n - 2*m*t >= 1, and every filtered
      cell is reported as filtered rather than silently absent. Getting this
      wrong would manufacture a spurious excess.
    - >-
      DIMENSION VERSUS DESIGNED DIMENSION. dim Gamma(L,g) can EXCEED n - m*t at
      small parameters. Comparing a measured dimension to a designed one, rather
      than to a measured one on the matched null, is exactly the error the
      matched null exists to prevent.
    - >-
      RELEVANCE DRIFT. The audit establishes a fact about the code. Whether it
      changes any published distance requires the papers, which are stage 3 and
      may not be obtainable. A stage-1 pass with stage 3 blocked is a coding-
      theory result with an UNRESOLVED relevance claim, and it must be written up
      that way. The temptation to let stage 1 borrow stage 3's significance is
      the named risk of this proposal.
    - >-
      MECHANISM ATTRIBUTION. Step 5's proposed explanation of the Goppa
      exclusion in arXiv:2304.14757 is a hypothesis about a paper whose body was
      not obtained for this record. Presenting it as a reading of that paper
      would be fabrication under AGENTS.md rule 5, and no artifact of this line
      may do so.

  interpretation_limits:
    - >-
      NO ATTACK, NO BREAK, NO WEAKENING. The proposal makes Classic McEliece's
      parameters LESS likely to be near a published threshold if the correct
      degree turns out to be 2t and thresholds are upper bounds on degree, and
      MORE likely if the dependence runs the other way. Which direction it moves
      is an output, not an input, and this record deliberately does not guess.
      RQ-MCE-e65b3c's toy claim-tier ceiling is untouched in either case.
    - >-
      A distinguisher is not a break, and this record produces neither. The
      square-code arm measures an observable; measuring a shortfall in it is not
      a distinguisher result, not a key recovery, and may not be promoted toward
      either (docs/claims-and-verification.md; RQ-MCE-e65b3c constraint 4).
    - >-
      Everything measured is at m <= 6 and n <= 64. The doubling identity is an
      algebraic fact independent of scale, so the toy computation CHECKS A
      DERIVATION rather than extrapolating; the square-code shortfall table does
      NOT have that property and is a toy measurement with no crypto-scale
      reading whatsoever.
    - >-
      A negative closes exactly what was tested. Forward guidance is named in
      advance: even if no published threshold uses r, the r = t versus r = 2t
      distinction remains the right frame for any FUTURE threshold this program
      derives, and the dimension excess m*t remains the cleanest one-integer
      statement of what makes a binary Goppa code non-generic.

  heuristic_assumptions:
    - id: HEUR-SD-1
      statement: >-
        For a uniformly random multiplier y in (F^*)^n with n, m, r in the
        tested grid, dim_{F_2} A_r(L, y) = n - m*r exactly, with probability
        tending to 1 as n grows at fixed m*r/n.
      random_model_justification: >-
        The m*r parity conditions obtained by expanding the F-linear conditions
        over an F_2-basis are, for a random multiplier, expected to be
        F_2-independent. This is the standard genericity expectation for
        subfield subcodes; it is NOT proved here and small-n deviations are
        expected and are the reason the FV-D threshold is 90 per cent rather
        than 100 per cent.
      validation_plan: >-
        Measured directly on at least 200 random multipliers across the grid,
        with the empirical rate of dim = n - m*r reported per cell BEFORE any
        Goppa number is compared against it. If the rate is low in a cell, that
        cell is excluded from the contrast rather than the contrast being
        reinterpreted.
    - id: HEUR-SD-2
      statement: >-
        The classical doubling Gamma(L,g) = Gamma(L,g^2) holds for q = 2 and g
        squarefree with no root in L.
      random_model_justification: >-
        Not a distributional claim at all -- an algebraic identity, whose
        derivative-is-a-square sketch is given in mechanism step 2. It is
        recorded as a heuristic assumption ONLY because it is RECALLED and
        unverified, not because it is probabilistic. This is the load-bearing
        external statement of the whole proposal.
      validation_plan: >-
        FV-A, measured computationally at 60-plus toy instances BEFORE any
        source is consulted, and then separately checked against primary text in
        stage 3. Cost of being wrong: seconds.
    - id: HEUR-SD-3
      statement: >-
        Classic McEliece's g is squarefree at all five standardized parameter
        sets.
      random_model_justification: >-
        Understood to follow from an irreducibility requirement in the
        specification. RECALLED-UNVERIFIED; the specification text is in this
        goal's own transcription lineage and the check is a read, not a
        computation.
      validation_plan: >-
        Read the requirement from the transcribed specification and quote it. If
        it is absent or weaker, the applicability of the whole audit to the
        deployed scheme is restated accordingly in the same artifact.

  target_complexity:
    exponent_moved: >-
      NONE, and the record states it rather than dressing the audit as an
      attack. This proposal moves no exponent and proposes no algorithm. It is
      worth running because a factor-2 ambiguity in the parameter a published
      threshold is evaluated at is a factor-2 error in the DISTANCE that
      GOAL-MCE-001 completion criterion 1 exists to state, and that distance is
      the goal's headline number.
    memory_exponent: n/a for this audit; no algorithm is proposed.
    best_known: >-
      NOT ASSERTED. No attack exponent, no distinguisher threshold and no
      complexity figure from any of the four named papers is stated anywhere in
      this record, because none of the four was read.
    hidden_overhead: >-
      n/a. The audit's own cost is exact F_2 rank computation, O(n^3) bit
      operations per instance at n <= 64, which is free.

  dominated_by: >-
    n/a (no algorithm, no cost claim, hence no Pareto point). Frontier rows
    checked, listed as required. TIME: no algorithm is proposed, so there is
    nothing to be beaten on time; the incumbent for the QUESTION -- what is
    Classic McEliece's alternant degree, and what distance does it sit at from
    published thresholds -- is EMPTY in this corpus: EV-MCE-332f99's own
    boundaries state "No distance between the 2026 attack regime and Classic
    McEliece was computed, and none may be inferred from this record: there is
    no transcribed left-hand side." MEMORY: n/a, same reason. DATA/QUERIES: the
    audit consumes public parameters only and makes no query of any kind, so the
    axis is empty. PREPROCESSING: none. Checked also against the proposal ledger
    (no prior IDEA on RQ-MCE-e65b3c exists at all -- the brief records the prior
    list as empty) and against knowledge/ for any statement of the doubling
    identity (none found). Absence of a search result is not evidence something
    was not tried (AGENTS.md retrieval policy).
  sota_delta: >-
    Quantitatively: the corpus currently holds ZERO values for the alternant
    degree of Classic McEliece and ZERO computed distances to any threshold.
    After a stage-1 pass it holds two candidate degrees per parameter set, t and
    2t, differing by a factor of exactly 2, together with the exact dimension
    excess m*t = n - k and its five exact rational values. Against the published
    state of the art the delta is zero -- the doubling identity is textbook and
    this proposal claims no priority over it. Against this program's state the
    delta is the difference between a distance that cannot be stated and one
    that can be stated in two presentations with the ambiguity made explicit.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.80 that FV-A holds as stated and the r = 2t presentation is real. It is
    not higher because the identity is recalled rather than read, because the
    exact hypotheses (squarefree versus separable, roots in L, whether n = 2^m
    matters) are the kind of side conditions that memory drops, and because this
    program has three consecutive campaigns on record in which a confident claim
    about a prior fact was found defective only by an independent check
    (GOAL-MCE-001.known_hazards). It is not lower because the derivative sketch
    in step 2 is checkable by hand, because the identity's standard consequence
    (d >= 2t+1 for binary Goppa) is one of the most-repeated facts in coding
    theory, and because failure is detected in seconds rather than argued about.
    Separately: 0.35 that stage 3 finds at least one published alternant
    threshold whose stated parameter is a degree and whose evaluation therefore
    changes by a factor of two for Classic McEliece. That number is low because
    O-5 already shows the nearest fully-read paper scopes by FAMILY, not by
    degree or rate, and because a well-written paper on Goppa codes is likely to
    have handled the doubling itself. It is not lower because four papers are in
    scope, because iacr:2026/1232's regime is entirely unknown (O-3), and
    because the goal's own next_action documents a corpus entry that misstates
    one of these boundaries -- so at least one of the four has already been
    read wrongly once.
