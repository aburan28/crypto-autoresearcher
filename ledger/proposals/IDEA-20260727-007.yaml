idea:
  id: IDEA-20260727-007
  question_id: RQ-ECDLP-002
  title: >-
    Arity-five membership budget - deriving the alpha < 3/2 decomposition-query
    gate from this ledger's own free-oracle floor, and pre-registering the
    measurement of alpha on the successful-decomposition subset
  class: algorithm
  claim: >-
    Granting the yield heuristic, prime-field Semaev index calculus at arity
    m = 5 with factor base B = N^{1/5} has a complete cost exponent, in units of
    log_N and with every stage charged, of
    E(alpha) = max( (1 + alpha)/5 , omega_LA/5 , 1/5 )
    where alpha is the exponent of the cost of ONE decomposition-membership
    query in units of B (query cost B^alpha) and omega_LA is the measured sparse
    linear-algebra exponent. With omega_LA = 2 this is
    E(alpha) = max( (1+alpha)/5 , 2/5 ), so the algorithm beats matched rho at
    0.886 sqrt(N) if and only if alpha < 3/2, and at alpha = 1 it would achieve
    time N^{2/5} with memory N^{1/5}.
    THREE CONSEQUENCES ARE CLAIMED. (i) The gate alpha < 3/2 is DERIVABLE inside
    this ledger from IDEA-20260727-003's free-oracle floor plus the yield
    constraint, without importing it; the external report corpus's standing
    conservative winner RT-1476-SUBRES-A1 is gated on exactly this inequality,
    and the agreement of two independent derivations is the evidence that the
    budget is right. (ii) m = 5 is the SMALLEST admissible arity: at m = 4 the
    linear algebra alone is N^{omega_LA/4} = N^{1/2} at omega_LA = 2, on the
    baseline rather than below it, and at m <= 3 it exceeds it, which is the
    same conclusion the external corpus reached from the measurement side.
    (iii) The decomposition probability at B = N^{1/5}, m = 5 is
    C(B,5)/N ~ 1/120, so relation collection needs Theta(B) = Theta(N^{1/5})
    ATTEMPTS, not Theta(N^{1/5}) successes divided by a vanishing yield - this
    is the specific accounting point on which EV-IC-001's B = 14 fixed factor
    base failed, and it is why the budget is stated at beta = 1/m rather than at
    a fixed B.
    The claim is falsified if the measured alpha on the SUCCESSFUL-decomposition
    subset is at least 3/2 with a fitted trend across at least three sizes (the
    strongly adverse prior), if the measured decomposition probability at
    beta = 1/5 is below 1/1200 (ten times below the counting prediction, which
    would add a yield factor the budget does not carry), or if measured
    omega_LA is above 2.5 (which pushes the linear algebra alone past 1/2).
  mechanism: >-
    Every index-calculus cost model in this ledger charges four stages: build
    the factor base, harvest relations, solve the sparse system, and descend the
    target. IDEA-20260727-003 sets the decomposition oracle FREE and shows the
    remaining floor max(B, c_LA B^{omega_LA}) already excludes m <= 4. This
    record does the complementary computation: it puts the decomposition cost
    BACK and asks how expensive one membership query may be before the whole
    thing loses to rho.
    Fix beta = 1/m so the yield constraint B^m >= m! N is tight. At m = 5,
    B = N^{1/5} and a random point is a sum of five factor-base points with
    probability about C(B,5)/N ~ B^5/(120 N) ~ 1/120, so a constant number of
    attempts yields one relation. To determine the B factor-base logarithms we
    need Theta(B) = Theta(N^{1/5}) relations, hence Theta(N^{1/5}) membership
    queries. If a membership query costs B^alpha = N^{alpha/5} group-operation
    equivalents, relation collection costs N^{(1+alpha)/5}. The sparse solve on
    a B x B system of row weight 5 costs N^{omega_LA/5}. Descent of one target
    costs N^{1/5} attempts times the same query cost, i.e. N^{(1+alpha)/5},
    absorbed into the first term. Taking the max gives E(alpha), and setting
    E(alpha) < 1/2 gives alpha < 3/2 when omega_LA = 2.
    That inequality is the entire lane. It is worth stating precisely what it
    means: alpha is NOT the Groebner solving degree and NOT the first-fall
    degree; it is the exponent, in units of the factor-base size, of the cost of
    deciding membership of one target in the fivefold sumset - the quantity the
    external corpus calls the membership-query exponent and gates RT-1476 on.
    The crucial methodological point, and the reason this record is worth
    dispatching rather than merely citing, is WHICH alpha is measured. A
    worst-case alpha is already bounded below by 3/2 in the external corpus
    (report 83's query lower bound and report 86's k-SUM screen), which would
    close the lane. The open quantity is the alpha realized on the
    SUCCESSFUL-decomposition subset, amortized over the yield - and the standing
    red-team correction in that corpus is precisely that median is not the same
    as amortized-over-yield, so measuring the median would be the failure mode
    this ledger has already committed twice (uncharged per-attempt cost in
    EV-IC-001, outcome-selected criteria in H-IC-001 v3). The measurement is
    therefore pre-registered as: total query cost across an entire relation
    campaign, divided by the number of USABLE relations produced, fitted against
    B on log-log axes.
    The record discriminates three explanations of the m = 5 lane's status.
    (a) alpha amortized over yield tracks the worst case at 3/2 or above: the
    lane closes inside this ledger, and the closure is derived rather than
    imported. (b) alpha is measured strictly below 3/2 with a fitted trend
    across three or more sizes: this is the first conditional sub-rho budget in
    the program's history and demands independent review-breakthrough handling
    before any status change. (c) alpha is below 3/2 but the yield at beta = 1/5
    is far below the counting prediction: the budget as written is wrong because
    it omits a yield factor, and the correct exponent is
    (1 + alpha)/5 + (yield deficit), which the run must report separately rather
    than folding into alpha.
  novelty_status: known
  novelty_screen:
    screened_on: '2026-07-27'
    corpus_paths_grepped:
      - /Volumes/Volume/git/autolab/research
      - /Volumes/Volume/crypto-autoresearcher-worktrees/ecdlp-batch006/ledger
    grep_results:
      - >-
        idea_generation_20260723_batch4.md (report 93, the latest external
        idea-generation report) read IN FULL. Its candidate A1
        RT-1476-SUBRES-A1 is the standing conservative winner, unchanged for 37
        consecutive rounds, and is stated as: "Exploit the serial-S3
        backward-3-sum structure of the m=5 Semaev membership test to reduce the
        eliminant-degree exponent beta below 3/10, giving membership-query
        alpha<3/2 and a sub-rho m=5 index calculus." The same file records
        "m<=3 impossible, m=4 needs alpha<1, m=5 needs alpha<3/2. At m=5,
        alpha=1, relation and linear algebra are q^{2/5}, descent q^{1/5}."
        The gate and the numbers of this record are therefore PRIOR ART in that
        corpus and are not claimed as novel.
      - >-
        Same file, section 6: the adverse prior is recorded explicitly -
        "Amortized beta tracks worst-case (median != amortized-over-yield)" and
        "the worst-case alpha>=3/2 barrier (report83 query-LB, report86 k-SUM)
        bounds worst-case; the successful-subset amortized beta is not yet
        measured." The open quantity is therefore correctly identified here.
      - >-
        In this ledger, grep over ledger/ for "m = 5|arity|membership query|
        alpha" finds no record containing an arity-5 cost budget, no record
        containing a membership-query exponent, and no record in which the
        m >= 5 necessity is derived. IDEA-20260727-003 derives m >= 5 as a
        necessary condition from the free-oracle floor but does not put the
        decomposition cost back and does not produce a query-cost gate.
        H-IC-001 and EV-IC-001 operate at m = 2 with a fixed B = 14.
      - >-
        "Kousidis|first-fall|Amadori|Faugere-Gaudry|solving degree" in the
        report corpus - present across the binary-field and D_reg artifacts
        (proof_obligation_binary_solving_degree.md 14 hits,
        PAPER_binary_field_ecdlp.md 14 hits). These concern the SOLVING DEGREE,
        a different quantity from the membership-query exponent alpha; the
        distinction is stated in the mechanism above precisely so the two are
        not conflated in the measurement.
    literature_verified: []
    conclusion: >-
      novelty_status is KNOWN. The alpha < 3/2 gate, the m = 5 arity, and the
      q^{2/5} figures are prior art in the external report corpus as
      RT-1476-SUBRES-A1. This record contributes three things and claims nothing
      more: an independent derivation of the same gate from this ledger's own
      free-oracle floor, a pre-registered definition of WHICH alpha is measured
      (amortized over yield, not median, not worst case), and the explicit yield
      accounting at beta = 1/m that EV-IC-001's fixed B = 14 configuration
      lacked. It is proposed as the single surviving constructive lane, not as a
      new mechanism.
  assumptions:
    - >-
      The yield heuristic B^m/(m! N) is granted for the purpose of the budget.
      IDEA-20260727-006 argues this heuristic is not certifiable by Weil-type
      bounds at these parameters, so the budget is HEURISTIC-CONDITIONAL and
      must never be presented as unconditional.
    - >-
      omega_LA is imported from IDEA-20260727-003's measurement on real
      prime-field relation matrices, not assumed to be 2. Every figure in the
      claim that uses omega_LA = 2 is a worked example, not a measurement.
    - >-
      Relation collection needs at least B - 1 independent relations, and the
      relation matrix used to fit omega_LA must have rank B - 1. This is the
      rank-degeneracy failure mode that IDEA-20260727-001 found in H-STR-002 and
      it is guarded here by an explicit rank control.
    - >-
      Membership-query cost is measured in group-operation equivalents using a
      single fixed calibration, applied identically to the baseline. The
      calibration cancels in the fitted exponent, which is why alpha is the
      robust quantity and absolute costs are not.
    - >-
      Matched Pollard rho with negation at 0.886 sqrt(N) is the baseline; matched
      BSGS with memory is reported alongside.
  predictions:
    - metric: yield_amortized_membership_query_exponent_alpha
      direction: higher
      minimum_effect: >-
        Fitted alpha >= 1.5 with a log-log R^2 >= 0.90 across B in
        {32, 64, 128, 256}, where alpha is (total query cost over a campaign) /
        (usable relations produced), expressed in units of B. The competing
        prediction is alpha <= 1.4 with the same fit quality, sustained across
        at least three sizes, which would open a conditional sub-rho budget and
        requires independent review-breakthrough handling.
    - metric: decomposition_probability_at_beta_one_fifth
      direction: different
      minimum_effect: >-
        Measured P_dec at B = ceil(N^{1/5}), m = 5 lies within a factor 4 of
        C(B,5)/N (predicted about 1/120 at the tight parameterization). A
        measured P_dec below 1/1200 means the budget omits a yield factor and
        the exponent as written is wrong; a measured P_dec above 1/30 would
        exceed the counting bound and indicates an instrumentation error or
        genuine structure.
    - metric: complete_cost_exponent_E_alpha
      direction: higher
      minimum_effect: >-
        The complete cost exponent, computed from the measured alpha, the
        measured omega_LA, and the measured yield, is at least 0.5 at every
        tested size, with the margin reported. A value below 0.5 at any size is
        a scoped conditional positive and may not be reported as a solve.
    - metric: relation_matrix_rank_deficit
      direction: lower
      minimum_effect: >-
        deficit = (B - 1) - rank(M) equals 0 for every matrix used in the
        omega_LA fit and in the campaign accounting. A nonzero deficit voids the
        corresponding measurement, per IDEA-20260727-001's finding.
    - metric: arity_four_linear_algebra_over_rho
      direction: higher
      minimum_effect: >-
        At m = 4, beta = 1/4, the linear-algebra term alone, N^{omega_LA/4},
        divided by 0.886 sqrt(N), is at least 1.0 at every tested N using the
        measured omega_LA. A ratio below 1.0 reopens m = 4 and falsifies the
        "m = 5 is smallest admissible" clause.
  minimal_test:
    design: >-
      (1) CAMPAIGN INSTRUMENTATION. On toy prime-field curves with prime-order
      subgroups at 20, 25, 30 and 35 bits, set B = ceil(N^{1/5}) and m = 5. Run
      a relation-collection campaign to completion, i.e. until the relation
      matrix reaches rank B - 1, recording for EVERY membership query, whether
      it succeeded or failed, its cost in group-operation equivalents and its
      wall time. Report alpha as the log-log fit of (total campaign query cost /
      usable relations) against B. The pre-registration is explicit: alpha is
      the amortized-over-yield quantity, the median and worst-case query costs
      are reported ALONGSIDE it and are never substituted for it.
      (2) YIELD MEASUREMENT. Independently of the campaign, estimate P_dec by
      precomputing the reachable 5-sum set at the smallest size (exhaustive) and
      by sampling at least 10^7 uniform targets against a hash set at the larger
      sizes, reporting upper bounds where the rate is below the sampling floor.
      (3) LINEAR ALGEBRA. Solve each completed system with sparse Wiedemann or
      Lanczos over Z/N, counting field operations and matrix-vector products,
      and fit omega_LA. Report rank(M) for every matrix.
      (4) BUDGET ASSEMBLY. Compute E = max((1+alpha)/5, omega_LA/5, 1/5) from
      the measured quantities, plus the separately reported yield deficit if
      P_dec deviates, and compare with 0.5 and with the measured matched-rho
      exponent on the same instances.
      (5) ARITY SWEEP. Repeat stages 2-4 at m = 3 and m = 4 with beta = 1/m to
      confirm the arity ordering and to locate the smallest admissible m from
      measurement rather than from the worked example.
    controls:
      - >-
        Matched Pollard rho with negation, honest operation count, at 0.886
        sqrt(N) on the same instances, and matched BSGS reporting operations and
        memory. Mandatory per RQ-ECDLP-002.
      - >-
        RANK CONTROL - every matrix entering the omega_LA fit or the campaign
        accounting must have rank B - 1. This is the control that
        IDEA-20260727-001 showed was missing from EXP-STR-002.
      - >-
        YIELD-CHARGING CONTROL - report the uncharged per-attempt query cost and
        the yield-charged cost side by side, and confirm the uncharged cost
        grows with N. A p-flat uncharged cost is the documented diagnostic of
        measuring factor-base enumeration rather than decomposition
        (IDEA-20260727-002); if it appears, the run is void, not negative.
      - >-
        CALIBRATION-INVARIANCE CONTROL - repeat the exponent fit with the
        solver-to-group-operation calibration perturbed by 10x in each
        direction. The fitted alpha must not move by more than 0.05, because a
        constant factor cannot change a fitted exponent; if it does, the fit is
        not measuring an exponent.
      - >-
        RANDOM-SYSTEM NEGATIVE CONTROL - run the same membership machinery on a
        random polynomial system of matched multidegree. Its alpha must be at
        least the Semaev one; a LOWER alpha on random systems means the
        machinery is exploiting an artifact of the encoding rather than
        structure.
      - >-
        ANOMALOUS-CURVE POSITIVE CONTROL - the same harness on an anomalous
        curve must produce a complete cost far below 0.886 sqrt(N). A harness
        that cannot detect a real break cannot certify a negative.
      - >-
        PRE-REGISTRATION CONTROL - the success criterion (alpha < 1.5, fitted
        across at least three sizes, R^2 >= 0.90) is written into the frozen
        protocol before execution. DEC-20260727-008 found H-IC-001's v3 criterion
        was outcome-selected; this control exists to prevent the repeat.
    required_metrics:
      - per-query cost, success flag, and campaign totals at each B
      - amortized-over-yield alpha with fit interval and log-log R^2
      - median and worst-case query cost, reported separately from alpha
      - P_dec per instance, exhaustive and sampled, with Wilson intervals
      - rank(M), row weight distribution and harvested relation count per B
      - sparse solve field-operation count and fitted omega_LA per B
      - assembled E = max((1+alpha)/5, omega_LA/5, 1/5) and E - 0.5 per instance
      - uncharged versus yield-charged per-attempt cost trend in N
      - calibration-perturbation sensitivity of fitted alpha
      - matched rho and BSGS operation counts and BSGS memory per instance
  falsification_conditions:
    - >-
      Fitted amortized alpha >= 1.5 across three or more sizes with R^2 >= 0.90:
      the m = 5 lane closes inside this ledger's tested scope, and the closure
      is the deliverable.
    - >-
      Fitted amortized alpha <= 1.4 across three or more sizes: the budget opens
      a conditional sub-rho exponent, which is a claimed breakthrough and
      triggers the AGENTS.md rule 12 review-breakthrough requirement before any
      status change or public statement.
    - >-
      Measured P_dec at beta = 1/5 below 1/1200: the budget as written omits a
      yield factor and E must be recomputed with the deficit charged.
    - >-
      Measured omega_LA above 2.5: the linear algebra alone exceeds 1/2 at
      m = 5 and the arity floor moves up, independently of alpha.
    - >-
      Any matrix used in the fit has rank below B - 1, or the uncharged
      per-attempt cost is p-flat: the run is INVALID, not negative, and produces
      no evidence in either direction.
    - >-
      The anomalous-curve positive control does not show a break: the harness is
      not sensitive enough to certify anything.
  confounders:
    - >-
      At B in the low hundreds the query cost is dominated by constants and by
      the algebraic backend's implementation, so a single-point alpha is
      meaningless. Only a fit across at least three sizes with a reported
      interval is admissible, and the calibration-invariance control exists to
      show the fit is not an artifact of the cost unit.
    - >-
      Median query cost is systematically lower than amortized-over-yield cost
      whenever failed queries are expensive, which is exactly the regime
      expected. Reporting the median as alpha would produce a false positive;
      this is the single most likely way this record goes wrong and the
      pre-registration control is aimed at it.
    - >-
      B = ceil(N^{1/5}) at 20 bits is about 16, so the smallest size is barely
      in the asymptotic regime and may need to be dropped from the fit. The
      decision to drop a size must be made from the pre-registered fit-quality
      rule, not after seeing alpha.
    - >-
      The five-fold sumset has C(B,5) elements, so the exhaustive yield
      computation is feasible only at the smallest size; everywhere else P_dec
      is a sampled upper bound. A one-sided bound suffices for the falsification
      conditions as written, and the run must not silently convert a bound into
      a point estimate.
    - >-
      This record grants the yield heuristic that IDEA-20260727-006 argues is
      uncertifiable. Every conclusion is therefore conditional on that
      heuristic and must carry the label; an unconditional presentation would
      violate the target-result-profile rule on conditional rigor.
  interpretation_limits:
    - >-
      A negative outcome closes the m = 5 lane only at the tested sizes, the
      tested membership backend, and under the stated accounting. It is not a
      proof that no arity-5 index calculus exists.
    - >-
      A positive outcome (alpha < 3/2) is a CONDITIONAL BUDGET, not a solve. It
      asserts an exponent under a granted heuristic at toy-measured parameters,
      extrapolated. No solve certificate, no key recovery, and no crypto-scale
      claim follows from it, and the extrapolation to crypto-sized N is a model
      statement.
    - >-
      The gate is prior art (RT-1476-SUBRES-A1, external corpus, 37 rounds
      standing). Any result must attribute the gate there and may claim only the
      independent derivation and the measurement as its own contribution.
    - >-
      Per DEC-20260726-007 the incidence oracle - which is what a membership
      query is - has simulation overhead O(B^m), so a SIMULABLE verdict imposes
      no bound on it (see IDEA-20260727-004). This lane is therefore not closed
      by the GGM results, and equally is not opened by them.
  heuristic_assumptions:
    - id: H1
      statement: >-
        (Fivefold sumset yield.) For a factor base F of size B chosen so that
        B^5 >= 120 N, and a uniformly random target T in the subgroup of order
        N, Pr[T is a sum of five distinct elements of F] = C(B,5)/N + O(C(B,5)^2
        / N^2), i.e. the fivefold sumset behaves as a uniformly random subset of
        the group of its own cardinality.
      rigorous_support: >-
        The upper bound Pr <= C(B,5)/N is RIGOROUS and unconditional by counting:
        the reachable set has at most C(B,5) elements. The classical
        distribution statement imitated is the balls-in-bins occupancy model:
        C(B,5) balls into N bins cover N(1 - exp(-C(B,5)/N)) bins, so the
        deficit from the counting bound is exactly the birthday correction. This
        is the additive analogue of the role Dickman-de Bruijn rho(u) plays for
        smoothness in the exemplar: a counting bound paired with the standard
        random-model distribution for objects of that size.
      validation_plan: >-
        Sampled quantity: the number of DISTINCT elements of the fivefold
        sumset, and the empirical decomposition rate. Shortcut making sampling
        feasible: both are hash-set computations on group elements, requiring no
        Groebner call and no discrete logarithm, so the exhaustive computation
        is feasible at 20 bits (B about 16, C(B,5) about 4368) and sampling at
        10^7 targets is feasible at 35 bits. Comparison distribution: distinct
        count against the occupancy prediction N(1 - exp(-C(B,5)/N)); rate
        against Binomial with Wilson intervals. Tail consistency check: the
        maximum number of distinct 5-subsets mapping to a single group element,
        compared against the maximum-load prediction of the occupancy model - a
        heavy tail would mean the sumset is concentrated and the yield model is
        wrong in the direction that hurts. LABEL: EXHAUSTIVE at 20 bits,
        TOY-SCALE SAMPLED at 25-35 bits; never crypto-scale.
    - id: H2
      statement: >-
        (Query-cost exponent stability.) The amortized-over-yield membership
        query cost, measured in group-operation equivalents, satisfies
        C_query(B) = c B^{alpha (1 + o(1))} with a single alpha stable across
        the tested range, so that a log-log fit over B in {32, 64, 128, 256}
        estimates the asymptotic exponent to within the reported interval.
      rigorous_support: >-
        The rigorous anchor is that the query cost is bounded below by the
        output size and above by exhaustive enumeration of C(B,5) sums, giving
        1 <= alpha <= 5 unconditionally; the assumption is only that the true
        cost follows a clean power law between those bounds. The classical
        statement imitated is the standard practice of fitting an asymptotic
        exponent from a bounded range of sizes, whose validity is exactly the
        assumption that lower-order terms have decayed - which is why the fit
        interval and the residuals, not the point estimate, are the reportable
        quantities.
      validation_plan: >-
        Sampled quantity: total campaign query cost per usable relation at four
        values of B. Shortcut: none needed - the cost is directly instrumented
        at every query. Comparison distribution: a straight line on log-log axes
        with residuals tested for curvature by comparing a linear against a
        quadratic fit (an F test). Tail consistency check: the ratio of the
        worst-case single query to the amortized cost must be bounded across
        sizes; an unbounded ratio means the mean is dominated by rare expensive
        queries and the fitted alpha is unstable, which must be reported rather
        than smoothed. Additional control: the SAME fit performed on the random
        polynomial system, whose alpha should be at least as large. LABEL:
        TOY-SCALE; extrapolation beyond B = 256 is a model statement.
    - id: H3
      statement: >-
        (Relation independence.) Relations harvested from independent random
        decompositions are linearly independent over Z/N until the matrix
        approaches rank B - 1, so Theta(B) successful decompositions suffice and
        no super-constant oversampling factor is needed.
      rigorous_support: >-
        The rigorous statement is the coupon-collector / random-matrix bound:
        for a random sparse matrix over a field with row weight w >= 3, B + O(1)
        rows have rank B - 1 with probability 1 - O(2^{-c}) (the standard random
        sparse matrix rank result underlying every index calculus). The
        classical distribution imitated is the rank distribution of a uniformly
        random sparse matrix over F_ell.
      validation_plan: >-
        Sampled quantity: rank(M) as a function of the number of harvested
        relations, for each B. Shortcut: exact rank over Z/N by sparse
        elimination at these sizes. Comparison distribution: the empirical
        oversampling factor (rows needed for rank B - 1, divided by B) against
        the random-sparse-matrix prediction of 1 + o(1). Tail check: the largest
        oversampling factor observed across seeds; a factor growing with B would
        add an uncharged term to the budget and must be reported as such.
        LABEL: TOY-SCALE.
  target_complexity:
    time_exponent: >-
      N^{E} with E = max((1 + alpha)/5, omega_LA/5, 1/5), conditional on H1-H3.
      Worked example at alpha = 1, omega_LA = 2: N^{2/5}, i.e. exponent 0.4
      versus 0.5. Break-even at alpha = 3/2. Adverse prior: the external
      corpus's worst-case bound alpha >= 3/2 gives E >= 1/2, i.e. NO improvement.
    memory_exponent: >-
      N^{1/5} for the factor base and the sparse B x B relation matrix of row
      weight 5, plus whatever the membership backend needs, which must be
      reported separately and is NOT modelled here. This is far below the
      N^{1/2} memory of BSGS but far above rho's N^{o(1)}.
    best_known: >-
      0.886 sqrt(N) group operations at N^{o(1)} memory (Pollard rho with
      negation); N^{1/3} online with N^{1/3} advice in the preprocessing model,
      matching Corrigan-Gibbs-Kogan. No published prime-field index calculus
      beats either. The external corpus's measured m = 3 end-to-end
      decomposition exponent was about n^{0.89} against rho's n^{0.5}.
    hidden_overhead: >-
      Three items are honestly outside the exponent and could dominate at any
      concrete size. (i) The Groebner or resultant backend carries constants
      exponential in m; at m = 5 the summation polynomial has degree 16 in each
      variable and the eliminant constants are large. (ii) The yield constant
      1/120 = 1/m! is a genuine 120x, not an o(1). (iii) The extrapolation from
      B <= 256 to crypto-sized B spans about 20 doublings, so an unmodelled
      B^{o(1)} term of the form 2^{sqrt(log B)} would be invisible in the fit
      and decisive at scale. None of these is absorbed into the exponent
      silently; all three must appear in the concrete-cost table before any
      promotion.
    tradeoff_note: >-
      At memory N^{1/5} and time N^{2/5} the point sits at S = N^{1/5},
      T = N^{2/5}, giving S T^2 = N which is exactly ON the
      Corrigan-Gibbs-Kogan frontier S T^2 = Omegatilde(N) for the preprocessing
      model - a coincidence that must be stated, because it means an m = 5
      single-target win at these parameters would NOT contradict the
      preprocessing lower bound but would sit precisely at its boundary. This is
      also why the claim, if it ever materialized, would be extremely fragile to
      any uncharged term. Parallelization: relation collection is embarrassingly
      parallel; the sparse solve is the serial bottleneck and parallelizes only
      as block Wiedemann, which changes constants and communication but not the
      omega_LA exponent (consistent with the external corpus's D1 data-movement
      exponent-neutrality barrier).
  proof_decomposition:
    - >-
      LEMMA 1 (size). At beta = 1/m the factor base has B = N^{1/m} elements and
      the reachable m-sumset has C(B,m) ~ N/m! elements. Single responsibility:
      the yield constraint is tight at beta = 1/m.
    - >-
      LEMMA 2 (success probability). Under H1, a random target decomposes with
      probability 1/m! + o(1), so the expected number of attempts per successful
      relation is m! + o(1), a constant. Single responsibility: no yield factor
      enters the exponent at beta = 1/m.
    - >-
      LEMMA 3 (relation-collection runtime). Theta(B) relations at m! attempts
      each, at query cost B^alpha, cost Theta(m! B^{1+alpha}) =
      Theta(N^{(1+alpha)/m}). Single responsibility: the harvest term.
    - >-
      LEMMA 4 (linear-algebra runtime). A B x B sparse system of row weight m
      over Z/N solves in Theta(m B^{omega_LA}) = Theta(N^{omega_LA/m}) field
      operations, with omega_LA measured, not assumed. Single responsibility:
      the solve term.
    - >-
      LEMMA 5 (correctness under the condition). If the harvested matrix has
      rank B - 1 then the factor-base logarithms are determined up to a global
      scalar fixed by one known relation, and a successful target decomposition
      yields the discrete logarithm, verifiable by a certificate the wrapper
      re-checks. Single responsibility: the output is correct when the rank
      condition holds.
    - >-
      MAIN ASSEMBLY. Per-attempt cost times inverse success probability:
      m! B^alpha per relation (Lemmas 2, 3) times Theta(B) relations, plus
      Lemma 4's solve, plus a descent absorbed into Lemma 3's term, gives
      E = max((1+alpha)/m, omega_LA/m, 1/m). Setting E < 1/2 with m = 5 and
      omega_LA = 2 yields alpha < 3/2, and with m = 4 yields the linear-algebra
      obstruction omega_LA/4 >= 1/2 at omega_LA = 2. Lemma 5 supplies
      correctness; H1-H3 supply the probabilities. Nothing in the assembly is
      unconditional.
