    searched:
      corpus_grep:
        - question_id RQ-PAIR-21313f in ledger/proposals
        - e_5(P, P)
        - y^2 = x^3 + 2x + 3
      web: []
      blocked:
        - No web fetch in this session.
  dominated_by: >-
    Checked KR-RHO-53c89f, KR-RHO-13bf67, and KR-IC-5ea2f8, all
    opened. Pollard rho at exponent 1/2 dominates any reading of
    this value as a discrete-logarithm algorithm. The MOV and
    Frey-Rück scope statement dominates any reading of it as a
    transfer. A diagonal 1 does not beat those rows.
  sota_delta: >-
    Zero change to the 1/2 exponent and zero transfers executed.
    The predicted gap is a Weil value equal to 1 against a value
    other than 1, on one point of order 5 at one prime below 120.
  proof_search_map:
    not_applicable_reason: >-
      This is one pairing value at one prime. It does not propose
      a theorem on self-pairings, a complexity bound, or a closure
      of CM embedding degrees.
