  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): verify the GL-invariance and the
      determinant identity symbolically, and confirm bit-identical L_K under
      random column recombination on 5 toy matrices. STAGE 1 (minutes): the
      k <= m+1 fixture M1 on 20 real and 20 null instances. STAGE 2
      (minutes): build the NULL-A envelopes and both planted controls with
      their q-ladders; hash them. STAGE 3 (hours): the crossed real arm --
      p in {8, 12, 16} bits (n prime, curves from harness/toycurve.py),
      curve classes {generic x5 with 3 trace-matched, j = 0 x3, j = 1728 x3},
      m in {6, 10, 14}, m' = 2 (S_3) and m' = 3 (S_4 or triple enumeration),
      k in {m+2, m+4, m+8, 2(m+1), 2(m+1)+6, 30} capped at 30, modes
      {FIRST-ONLY, HARVEST-ALL}, 2 seeds; L_K by exact elimination plus LLL
      plus enumeration; L_R counts at saturation. STAGE 4 (zero compute):
      apply the pre-registered rule; classify the outcome as O-NULL, O-MODE,
      O-CLASS or O-COINCIDENCE; decompose any O-CLASS into its L_R and L_K
      parts. CHEAPEST VALID DISCRIMINATOR: Stage 2's planted-versus-null
      separation at one cell (n about 2^12, m = 10, k = 22) -- it costs
      minutes and, if the instrument cannot separate S about 0.02 from an
      envelope near 1, nothing else is worth running.
    controls:
      - NULL-A synthetic-log null, 200 draws per cell, envelope hashed first (blocking).
      - NULL-B random-curve panel at the same p with trace matching (blocking).
      - Planted unmerged-negation stream with q-decay ladder (blocking; MUST produce norm-2 syzygies).
      - Planted j = 0 phi-stable base with exactly m/3 norm-sqrt3 L_R vectors and q-decay (blocking).
      - Small-target collector (a_i in [1,16], b_i = 0) as the nearby object where L_K MUST shorten for non-curve reasons.
      - Baseline slice k <= m+1 with lambda_1 = n exactly.
      - Mandatory Pareto rows on one instance per p, Pollard rho with negation (0.886 sqrt(n)) and BSGS (sqrt(n) time and memory), in group operations, as controls only.
    required_metrics:
      - rho_k, det L_K, gh(L_K), certified lambda_1 and S per cell, with the certification method named per cell
      - N_L(rho) at rho in {0.5, 0.7, 0.85, 1.0} per cell and the NULL-A forced value
      - NULL-A envelope (min, max, mean) per (n, m, k, mode) and the count of real cells outside it
      - planted-control S and syzygy counts along the q ladder, with monotonicity verdict
      - exact L_R small-vector counts per curve class at 16 bits
      - HARVEST-ALL coincidence counts per class versus trace-matched generic
      - deduplicated-row counts, column-usage histogram and collision counts per cell (HEUR-2)
      - sha256 of every factor base, row list and null draw; seeds and derivation rule
      - matched rho and BSGS operation counts and BSGS memory

  falsification_conditions:
    - F1. Stage 0 finds L_K not invariant under column recombination, or det L_K != n^(rank). The mechanism is wrong; the record is superseded.
    - F2. M1 fails on any instance. Instrument fault; nothing is read.
    - F3. The planted negation control does not fall below S = 0.1, or its count does not decay in q. Instrument blind to syzygies; no null may be reported.
    - F4. NULL-A's mean S lies outside [0.85, 1.15] at k >= 16. Null mis-specified; no comparison is licensed.
    - F5. Real-arm S falls outside the NULL-A envelope on more than 5% of resolvable cells, or replicates below 0.7 on any class. The predicted null is FALSE; the outcome is classified O-MODE, O-CLASS or O-COINCIDENCE by the crossed design and routed accordingly. This is the outcome the record would most like to be wrong about and is stated so it cannot be absorbed.
    - F6. The j = 0 L_R count is not exactly m/3 beyond null. Either 61049d's identity fails in the implementation or the base is not phi-stable; a construction fault, not a discovery.

  confounders:
    - SIGN CLOSURE x(P) = x(-P). Merged columns make negation closure invisible by construction; unmerged columns make it a norm-sqrt2 L_R vector and a norm-2 L_K syzygy generator. The convention is declared per arm and never mixed within a cell.
    - REPEATED RELATIONS. A duplicate row is a norm-sqrt2 L_K vector; rows are deduplicated as integer vectors and the count reported. HARVEST-ALL sibling rows are NOT duplicates and are kept, because they are the coincidence channel under measurement.
    - THE MODULAR STRUCTURE ITSELF. L_K contains n Z^k, so lambda_1 <= n and S saturates when gh(L_K) approaches n; cells with gh > n/2 are excluded as unresolvable. Vectors in n Z^k are excluded from N_L(rho) counts.
    - LLL/BKZ QUALITY. An approximate reduction reports an upper bound on lambda_1 and would MANUFACTURE an apparent S > 1 or hide an S < 1; only enumeration-certified cells enter the fit, and the method is named per cell.
    - FACTOR-BASE SIZE RELATIVE TO n. gh(L_R) is O(1) at toy scale, so the L_R ratio statistic is meaningless and only the exact count is used, with the resolvable region stated (16 bits; m <= 10 for norm-sqrt3 structure).
    - NON-UNIFORM TARGETS. Any collector with structured (a_i, b_i) shortens L_K for non-curve reasons; the small-target arm exists to show this and the real arms use uniform (a_i, b_i) verified by a Kolmogorov-Smirnov check on a_i/n and b_i/n.
    - FIRST-MOMENT CLASS INVARIANCE (0ff796). Between-class comparisons must be trace-matched or the yield itself differs; NULL-B enforces this.
    - SMALL k AND SMALL n. At k close to m+1 the Gaussian heuristic is crude; HEUR-1 is validated per cell and cells at k < 16 are reported but not used for the envelope test.

  interpretation_limits:
    - Toy tier (claim_tier toy) at 8-16 bit p; nothing transfers to crypto scale and no transfer assumption is made.
    - A short vector in L_K is a certificate that some rows were redundant; it is not an attack, not a relation, and does not reduce the number of informative relations needed (see IDEA-20260905-1a8cb3 for the entropy accounting).
    - A confirmed null closes the seed's first question ON THE TESTED PANEL AND MODES with the invariance mechanism; it does not declare any direction impossible and names the second-moment coincidence channel and non-uniform-target collectors as what remains open.
    - The planted controls reproduce KNOWN structure (negation, automorphism orbits) and any count they produce is a check on the instrument, never a finding.
