idea:
  id: IDEA-20260905-029c9c
  question_id: RQ-RELN-001
  goal_id: GOAL-RELN-001
  added: '2026-09-05'
  title: >-
    THE DEPENDENCY LATTICE OF AUGMENTED SEMAEV RELATION ROWS IS A
    GL(m+2, F_n)-INVARIANT OF THE ROW CONFIGURATION: measure lambda_1 of the
    integer left-kernel lattice L_K of the rows (c_i, -a_i, -b_i) against the
    exact-determinant Gaussian heuristic, with a synthetic-logarithm null of
    identical weight profile and modulus, a random-curve panel at the same p,
    an unmerged-negation planted control that MUST produce norm-2 syzygies,
    and a pre-registered rule for calling a curve class or a collector mode
    anomalous -- predicted outcome is a controlled null, and the one channel
    the derivation leaves open is the second moment of decomposition
    collisions, which IDEA-20260807-0ff796 explicitly does not close
  class: measurement

  claim: >-
    SETTING. E/F_p short Weierstrass, G = <P> of prime order n, Q = [x]P.
    Factor base F = {F_1, ..., F_m}, l_j = log_P F_j unknown. A relation is
    R_i : sum_j c_ij F_j = a_i P + b_i Q, i.e. c_i . l - a_i - b_i x = 0 mod n.
    Augmented row r_i = (c_i, -a_i, -b_i) in Z^(m+2); M_k the k x (m+2)
    integer matrix of the first k rows; w = (l_1, ..., l_m, 1, x). Every row
    satisfies r_i . w = 0 mod n, so M_k w = 0 mod n and rank_n(M_k) <= m+1.

    THE THREE LATTICES, WITH DIMENSION AND DETERMINANT.
    (a) LEFT-KERNEL (DEPENDENCY) LATTICE. L_K(k) = {v in Z^k : v M_k = 0 mod n}.
    Full rank, contains n Z^k, dim d = k, det L_K(k) = n^(rho_k) with
    rho_k = rank_n(M_k) computable exactly by elimination over F_n. For k <= rho
    generic, L_K = n Z^k and lambda_1 = n; the informative regime is
    k > m+1, where generically rho_k = m+1 and det = n^(m+1). THIS is the
    lattice the seed's inequality lambda_1(L) << det(L)^(1/d) refers to
    ('the integer lattice of dependencies between these rows'). A vector v of
    L_K is an integer syzygy: sum_i v_i r_i = 0 mod n as a VECTOR.
    (b) MODULAR REDUCTION. K_n(k) = {v in F_n^k : v M_k = 0}, the F_n left
    kernel, dim k - rho_k. Not a lattice; (a) is its Construction-A lift and
    the two are the same object seen over Z and over F_n. Kept only to name
    the Hamming-weight analogue of lambda_1 (minimum weight of K_n), which
    the record reports as a secondary statistic.
    (c) ROW LATTICE. L_R(k) = Z-span(r_1, ..., r_k) + n Z^(m+2), dim m+2,
    det = n^(m+2-rho_k); once rho_k = m+1 it saturates to
    L_R = {u in Z^(m+2) : u . w = 0 mod n}, det = n, which depends on w
    ALONE and not on which relations were found. Its short vectors are the
    short integer relations among (F_1, ..., F_m, P, Q).

    THE ZERO-COMPUTE FACT THAT FIXES THE PREDICTION. L_K(k) is determined by
    the F_n-column space of M_k: for any A in GL(m+2, F_n), v (M_k A) = 0 iff
    v M_k = 0. Hence L_K is invariant under every invertible recombination of
    the columns -- including any relabelling, negation closure, automorphism
    action, or change of factor base that acts linearly on the log
    coordinates. L_K therefore CANNOT see column-level algebraic structure of
    the factor base or the curve except insofar as it produces ROW-LEVEL
    coincidences (duplicate rows, sibling rows sharing (a_i, b_i), rows that
    are exact small-integer combinations of others). Conversely L_R at
    saturation forgets the rows and retains only w. The seed's two suspects
    split cleanly: 'certain curves' can only act through L_R (and through
    row coincidences whose RATE is curve-dependent); 'certain Semaev tree
    representations' can only act through L_K.

    THE CLAIM UNDER TEST, pre-registered with its expected outcome. For
    prime-field curves at toy scale, with a collector whose targets
    a_i P + b_i Q have (a_i, b_i) uniform mod n and whose rows are
    deduplicated, the distribution of S := lambda_1(L_K) / gh(L_K), with
    gh(L) = det(L)^(1/d) / V_d(1)^(1/d) and V_d(1) = pi^(d/2)/Gamma(d/2+1),
    on the real relation stream is indistinguishable from the synthetic-log
    null of identical weight profile, modulus and hyperplane constraint;
    and the count statistic N_L(rho) := #{v in L : 0 < |v| <= rho gh(L)}
    matches the null's forced value rho^d up to lattice-point-count
    corrections. PREDICTED: null. The record is written so that the
    alternative -- a curve class or collector mode whose S falls below the
    null envelope reproducibly and whose planted-control response decays
    correctly -- is detectable with a stated false-positive rate, and so that
    the only mechanism the derivation leaves open (collision-driven sibling
    rows, a SECOND-MOMENT functional of decomposition yield) is measured
    separately rather than folded into the null.

  mechanism: >-
    WHY A NULL IS EXPECTED, STATED AS A MECHANISM SO IT CAN BE WRONG.
    (1) Row uniformity. For a fixed factor base, the map from weight-m'
    multisets c to targets c . l mod n is a function; a collector that draws
    uniform random targets and returns their decompositions samples multisets
    uniformly up to the collision structure (KN-FIND-007: mean yield exactly
    C(m+m'-1, m')/n for every base; only the distribution over targets is
    free). The synthetic-log null draws c uniformly with the same weight
    profile and sets (a_i, b_i) to satisfy c . l' - a_i - b_i x' = 0 for a
    random l', x'. Given (1), the only difference between the arms is the
    value of w versus w' -- and by the GL-invariance above, L_K does not
    depend on w at all. So the real and null L_K distributions coincide
    EXACTLY under (1), not merely approximately.
    (2) Where (1) fails. It fails at collisions: a target with two
    decompositions c, c' yields sibling rows r, r' with identical (a, b), so
    r - r' = (c - c', 0, 0) is a free relation in L_R; two targets whose free
    relations coincide give (e_i - e_i') - (e_k - e_k') in L_K at norm 2.
    The rate of such coincidences is a second-moment functional of the
    decomposition-count distribution over targets. IDEA-20260807-0ff796
    proves the FIRST moment (mean yield at arity 2) is an isogeny-class
    invariant and states in its part (E) that the variance and higher moments
    are NOT closed. This record's coincidence channel is therefore the one
    place a curve-dependent L_K effect can legitimately live, and it is
    measured as its own arm (HARVEST-ALL mode) with FIRST-ONLY mode as the
    coincidence-free reference.
    (3) Where the collector can create structure. If (a_i, b_i) are not
    uniform mod n -- targets [a]P with small a, targets re-used across a
    Semaev tree, internal nodes shared between relations -- exact integer
    syzygies among rows become likely and L_K shortens for reasons that have
    nothing to do with the curve. The record treats collector mode as an
    independent variable and requires any anomaly to be localised to curve
    class OR collector mode by the crossed design.

    THE STATISTICS. Primary: S = lambda_1(L_K)/gh(L_K) with lambda_1 CERTIFIED
    by exact enumeration (Fincke-Pohst / Schnorr-Euchner after LLL, exact
    integer arithmetic; certification = completed enumeration tree), feasible
    in pure Python for k <= 30 at 16-bit n; cells at k > 30 or with
    incomplete enumeration are reported as LLL/BKZ upper bounds and EXCLUDED
    from the exact fit. Secondary: N_L(rho) for rho in {0.5, 0.7, 0.85, 1.0}
    against the forced null value; the Hamming minimum weight of K_n; and,
    for L_R at saturation, the exact count of vectors of squared norm <= 3
    (which is the statistic with resolution at toy scale, see below).
    FORCED VALUES DERIVED BEFORE ANY RUN. gh(L_K) with det = n^(m+1):
    n = 2^12, m = 10, k = 22: gh = n^(1/2) / V_22^(1/22) = 64 / 0.800 = 80
    (the Stirling form sqrt(k/(2 pi e)) det^(1/k) gives 72.6; the record uses
    the exact-volume gh and reports both). n = 2^16, m = 14, k = 30:
    gh = 256 / 0.699 = 366. A planted norm-2 syzygy is therefore S = 0.025
    and S = 0.0055 respectively -- separated from the null by two orders of
    magnitude, which is why L_K has enormous resolution for row-level
    structure. For L_R at saturation, gh = n^(1/(m+2)) / V^(1/(m+2)) is
    O(1) at every toy size (n = 2^16, m = 14: 2.19), so the ratio statistic
    has no resolution there and the record uses the exact count instead:
    E_null[#{u in L_R : |u|^2 <= 2}] = (2 d^2)/n with d = m+2 (there are
    2d vectors of squared norm 1 and 2d(d-1) of squared norm 2 in Z^d), i.e.
    0.0078 at n = 2^16, m = 14 and 0.125 at n = 2^12, m = 14; adding squared
    norm 3 (8 C(d,3) vectors) gives 0.076 and 1.2. CONSEQUENCE, stated as a
    scope limit: the L_R arm resolves negation-type (norm sqrt 2) planted
    structure at 16 bits for all m <= 14, resolves orbit-type (norm sqrt 3)
    structure at 16 bits only for m <= 10, and has NO resolution at 12 bits
    for m >= 10. Cells outside the resolvable region are run but reported as
    uninformative by construction.

    WHAT EACH OUTCOME MEANS (the discriminator). O-NULL: real-arm S inside
    the null envelope on every resolvable cell, planted arm far below with
    correct decay -- L_K carries no structure beyond random modular linear
    algebra at toy scale; the record closes the seed's first question with
    the GL-invariance mechanism and hands the second-moment channel its
    measured value. O-MODE: real-arm S below envelope in one collector mode
    across ALL curve classes -- the collector, not the curve, manufactures
    syzygies; a tooling finding about relation streams (relevant to
    IDEA-20260805-061f97's augmented-rank threshold), not a curve property.
    O-CLASS: real-arm S below envelope for one curve class (j = 0, j = 1728,
    or a small-|D| class) in BOTH modes, replicated across curves and seeds
    within the class and absent in trace-matched generic curves -- the
    interesting outcome; it must first be decomposed into its L_R component
    (free relations, which are the known automorphism quotient) and its
    residual L_K component before any interpretation, and routes to
    independent review. O-COINCIDENCE: HARVEST-ALL shows class-dependent
    coincidence rates while FIRST-ONLY is null -- a second-moment yield
    effect, the channel 0ff796 leaves open, reported as such.

