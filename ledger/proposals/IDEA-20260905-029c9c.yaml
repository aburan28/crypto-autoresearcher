  assumptions:
    - n prime and the factor base drawn inside G = <P> (harness build_factor_base with scope target_subgroup, or lifts verified to be in G), so rank and kernel are over the field F_n.
    - Toy sizes 8-16 bit p, m in {6, 10, 14}, decomposition length m' = 2 (S_3) and m' = 3 (S_4 via harness s4_expr, or direct group-arithmetic enumeration of triples, which is the certificate route anyway); at toy scale the collector may be brute-force enumeration with the summation polynomial as a filter, and this is disclosed because the relation STREAM, not the solver, is the object.
    - Rows are deduplicated as integer vectors before L_K is built, and the deduplication count is reported per cell.
    - Default column convention is MERGED (one column per x-coordinate, sign carried in c_ij, so negation closure is built in); UNMERGED columns are used only in the planted control.
    - Exact enumeration is the certification route for lambda_1; a cell whose enumeration does not complete within its budget is an infrastructure outcome (AGENTS.md rule 5), reported and excluded, never evidence.

  proof_search_map:
    bottleneck: >-
      The GL(m+2, F_n)-invariance of L_K. Everything else is measurement.
      If that invariance were false -- if L_K depended on the integer
      representatives of M rather than on M mod n -- column-level structure
      could leak into L_K and the null prediction would have no basis.
    baseline_embedding:
      parameter_slice: >-
        k <= m+1 with generic rows: rho_k = k, L_K = n Z^k, lambda_1 = n
        exactly, det = n^k, and S = n / gh(n Z^k) = V_k^(1/k), a known
        constant. This slice must reproduce exactly in every arm before any
        k > m+1 cell is read.
      reproduction_check: >-
        Frozen fixture: at n = 4099 (12-bit), m = 6, k = 7, assert
        rho = 7, det = n^7, lambda_1 = n by enumeration, on 20 real and 20
        null instances. Exact integer comparison.
    observation_collision:
      observable: lambda_1(L_K)/gh(L_K) and N_L(rho).
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED: real streams on distinct curves with distinct
        factor bases give the same S distribution -- that is the prediction,
        and it is a collision of the observable by design. The SEPARATING
        search is for two objects with different S: the merged-column real
        stream (predicted null) versus the unmerged-negation planted stream
        (predicted S about 0.02), same curve, same targets. If the instrument
        cannot separate those, it is void.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the row configuration mod n fixed and vary the forgotten
          structure (the curve, the factor base, w) by right-multiplying M
          by A in GL(m+2, F_n) and by replacing w with w'; L_K must be
          bit-identical. Zero compute; a direct test of the invariance.
        predicted_gain: The mechanism becomes a checked identity rather than an argument.
      - transform: stronger_invariant
        proposed_object: >-
          Track the pair (L_K, L_R) rather than L_K alone, because the two
          are complementary projections (rows-not-columns, columns-not-rows)
          and any curve effect must appear in L_R first.
        predicted_gain: Decomposes any O-CLASS signal into its known (free-relation) part and its residual before interpretation.
    quantifier_order: >-
      FOR ALL primes n, FOR ALL k x (m+2) integer matrices M, FOR ALL A in
      GL(m+2, F_n): L_K(M A mod n) = L_K(M). Unconditional. The empirical
      claim: FOR ALL tested (p, curve class, m, k, mode) cells in the
      resolvable region, the real-arm S lies within the null envelope --
      quantified over the tested panel only, never over all curves.
    method_ceiling:
      strongest_certifiable_claim: >-
        'On the tested panel at toy scale, the dependency lattice of
        deduplicated Semaev relation rows with uniform targets is
        statistically indistinguishable from that of random rows in a random
        hyperplane of the same weight profile and modulus.' It can NEVER
        certify anything about crypto scale, about collectors with
        non-uniform targets, or about the ECDLP.
      nearby_object_control: >-
        Where the conclusion FAILS by construction: the unmerged-negation
        planted stream (norm-2 syzygies) and a small-target collector with
        a_i in [1, 16], b_i = 0 (exact integer syzygies among rows). Both
        must show S far below the envelope.
    proof_obligations:
      - claim: L_K depends only on the F_n-column space of M.
        responsibility: correctness
      - claim: det L_K = n^(rank_n M) exactly.
        responsibility: size
      - claim: Enumeration after LLL certifies lambda_1 at k <= 30 within budget at 16-bit n.
        responsibility: runtime
      - claim: The planted controls produce S below 0.1 and the null envelope excludes them.
        responsibility: strictness
      - claim: Every number is scoped to the panel, the modes and the toy sizes.
        responsibility: scope
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: >-
      The integer syzygy module of the relation stream: L_K(k) followed as
      rows are appended, summarised by (rho_k, lambda_1, N_L(rho)).
    established_families_off_limits: >-
      Off-limits as the primary lens: factor-base geometry for mean yield
      (KN-FIND-007 settles it); Groebner solving-degree instrumentation
      (H-SEMAEV-001 lane); sparse linear-algebra algorithmics; automorphism
      quotients as a mechanism (KN-TECH-018, 61049d) -- used here only as
      the planted control; isogeny-class transport (0ff796 owns the first
      moment); Minkowski audits of curve-attached lattices (230971).
    lossiness: >-
      GENUINELY LOSSY: the projection M -> L_K forgets the integer
      representatives, the factor base, the target scalars and w entirely,
      retaining only the F_n-column space of M -- an (m+1)-dimensional
      subspace of F_n^k, i.e. a point of a Grassmannian, against k(m+2)
      integer entries. The discard is compatible with the operation the
      collector performs (appending a row): L_K(k+1) restricted to
      Z^k x {0} equals L_K(k), exactly. It is NOT a change of coordinates:
      the fibre over a given L_K is the whole GL(m+2, F_n)-orbit of M
      together with every integer lift. The mirror failure (zero comparator
      spread) was checked: S is a random variable with the null's spread,
      and the planted controls move it by two orders of magnitude, so the
      spread is nonzero by derivation.
    propagation: >-
      Exact under row appending; exact under column recombination (the
      invariance); it does NOT propagate under a change of collector mode,
      which is why mode is an independent variable and not a nuisance.
    survival_score: >-
      Survives every curve, base and gauge change by invariance; dies at
      the collector: a target-correlated or tree-sharing collector changes
      L_K, and that is the one place the object can detect anything. The
      honest score is that the object is maximally robust and therefore
      predicted to be maximally uninformative about curves.

  null_object_control: >-
    NULL-A, BLOCKING, MATCHED: synthetic-log null. Draw l' in (Z/n)^m and x'
    uniformly; draw c_i uniformly over the weight profile actually observed
    in the real arm (multiset of weight m' with entries in {+1, -1}, merged
    columns); draw b_i uniform mod n and set a_i = c_i . l' - b_i x' mod n.
    Same k, same n, same weight profile, same hyperplane constraint, no
    curve. 200 draws per (n, m, k, mode) cell; the null ENVELOPE is the
    min/max of S over the draws, with the leave-one-out false-positive rate
    of 'outside the envelope' fixed in advance at 2/200 = 1% per cell
    (KN-TECH-1a5b7e mode 5, as used in IDEA-20260821-019d2f). Forced value:
    the real arm's S distribution equals NULL-A's (by the invariance plus
    row uniformity); NULL-A can fail only if the collector violates row
    uniformity, which is the finding, not an artifact.
    NULL-B, BLOCKING: random-curve panel at the same p, same m, same seeds:
    5 generic curves per p, of which 3 share the trace t of the structured
    curves under test (trace-matched, so 0ff796's class-invariant first
    moment is controlled) and 2 do not. The generic class is the reference
    against which j = 0 and j = 1728 classes are compared.
    PLANTED POSITIVE CONTROL, BLOCKING: UNMERGED-NEGATION stream -- separate
    columns for F_j and -F_j (2m columns), collector emitting every sign
    assignment consistent with the target; predicted L_R vectors
    e_j + e_j' of norm sqrt 2 (m of them) and L_K syzygies of norm 2
    (pairs of targets using the same F_j), so S(L_K) about 0.02 at
    n = 2^12, m = 10, k = 22. Second planted control on j = 0 (p = 1 mod 3):
    phi-stable base, predicted L_R vectors e_j + e_phi(j) + e_phi^2(j) of norm
    sqrt 3, exactly m/3 of them (61049d), against a null expectation of
    0.03 to 0.08 such vectors at 16 bits.
    DECAY PARAMETER q: (i) for the negation control, the fraction q of
    partner columns -F_j replaced by an unrelated point of G; the norm-2
    syzygy count must fall linearly to zero as q -> 1 over
    q in {0, 0.25, 0.5, 0.75, 1}; (ii) for the coincidence channel, the
    fraction q of sibling rows dropped from HARVEST-ALL toward FIRST-ONLY;
    the coincidence-driven L_K count must fall monotonically. A count that
    stays flat in q is the artifact tell of docs/inventor-protocol.md
    section 3 and voids the arm.
    ORDERING CONTROL: NULL-A envelopes and both planted controls are
    computed, recorded and hashed before any real-arm S is read.

  discriminated_from:
    - >-
      IDEA-20260805-061f97 -- NEAREST RECORD. It tracks the column SUPPORT of
      the relation matrix and the first R at which a nonzero F_n left kernel
      EXISTS (R > T(R)), plus the augmented-rank threshold. EXACT DELTA:
      (i) object -- 061f97 asks WHEN the kernel becomes nonzero; this record
      takes the kernel's integer lift L_K as a lattice and asks HOW SHORT its
      vectors are, a geometric quantity 061f97 never defines; (ii) statistic
      -- lambda_1/gh and N_L(rho) versus a matched null, not a threshold
      count; (iii) mechanism -- the GL-invariance and the rows-vs-columns
      split are absent from 061f97. Consistent with it: rho_k is 061f97's
      augmented rank, reported here per row.
    - >-
      IDEA-20260805-887d67. Measures lambda_1 of the fibre-specific kernel
      lattice of a section map on XEDN surfaces (det M, dim n) against
      Minkowski; its lattice is the analogue of this record's L_R (kernel of
      evaluation), not of L_K. Delta: different problem (lifting surfaces),
      different lattice (no relation rows), and 887d67's headline parameter
      M has no counterpart here because det L_R = n is fixed.
    - >-
      IDEA-20260807-0ff796. Proves mean arity-2 yield is class-invariant.
      This record does not restate that; it uses it as the reason the
      trace-matched NULL-B controls the first moment, and it measures the
      SECOND-moment coincidence channel that 0ff796 part (E) leaves open.
      The seed's 'anomaly', if curve-dependent, would live exactly there and
      is therefore something BEYOND 0ff796, not the same thing renamed.
    - >-
      IDEA-20260807-61049d. Its free orbit relations are L_R vectors on
      j = 0 and are provably in the kernel of evaluation; here they are the
      planted positive control for L_R, not a finding. Delta: 61049d proves
      they carry zero rank information; this record asks whether they, or
      anything else, leave a trace in L_K -- and derives that they cannot
      (invariance) unless the collector emits both members of an orbit
      rewrite.
    - >-
      IDEA-20260817-230971. Same null architecture (random lattice at matched
      rank and determinant, exact SVP, Gaussian heuristic) applied to
      curve-attached End/Hom lattices. Delta: the lattice here is attached to
      the relation STREAM, not to the curve; its determinant is n^(rank),
      exact and computable, so the null is sharper.
    - >-
      IDEA-20260727-008 and IDEA-20260808-486ae2. The witness lattice of one
      DLP instance, and lattice-describable factor bases with small-root
      solvers, respectively. Neither concerns dependencies among relation
