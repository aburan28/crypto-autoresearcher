  heuristic_assumptions:
    - id: HEUR-1
      statement: >-
        Q-ARY GAUSSIAN HEURISTIC FOR L_K. For k rows drawn as in NULL-A with
        rank rho = m+1 < k, and for r < n/2, the expected number of nonzero
        v in L_K with |v| <= r not in n Z^k equals
        (#{v in Z^k : 0 < |v| <= r})/n^(m+1) (1 + o(1)), and lambda_1
        concentrates at gh(L_K) with relative spread O(1/k) for k >= 16.
      rigorous_support: >-
        Minkowski's convex body theorem gives lambda_1 <= 2 gh(L_K)
        unconditionally. For a uniformly random rank-rho constraint each
        fixed v not in n Z^k satisfies v M = 0 with probability exactly
        n^(-rho), so the expectation is exact for uniformly random M of that
        rank; the heuristic content is that weight-profile-constrained rows
        in a random hyperplane behave the same, imitating Siegel's mean
        value theorem (recalled).
      validation_plan: >-
        200 NULL-A draws per cell across the whole grid; compare the
        empirical mean and spread of S to 1.0 and to the Rogers-type
        prediction; compare N_L(rho) to the exact-lattice-point forced
        value; tail check: the minimum S over draws against its predicted
        extreme-value quantile. Sampled parameters recorded per cell; toy
        scale, labelled, no transfer.
    - id: HEUR-2
      statement: >-
        ROW UNIFORMITY OF THE COLLECTOR. In FIRST-ONLY mode with uniform
        targets, the coefficient parts c_i are uniform over weight-m'
        signed multisets up to collisions, and (a_i, b_i) are uniform mod n.
      rigorous_support: >-
        The mean yield per multiset is exact (KN-FIND-007); uniformity over
        multisets follows from uniform targets when each multiset sums to
        one target; deviations arise only from targets with several
        decompositions, whose count is Poisson-like with mean
        C(m+m'-1, m')/n (KN-FIND-007's distribution assumption).
      validation_plan: >-
        Column-usage histogram versus uniform (chi-square) and collision
        count versus Poisson per cell, as in IDEA-20260805-061f97's {q_j};
        KS test of a_i/n, b_i/n against uniform. A failure localises any
        O-MODE outcome to the collector.
    - id: HEUR-3
      statement: >-
        CERTIFICATION FEASIBILITY. LLL followed by exact enumeration
        certifies lambda_1(L_K) at k <= 30, 16-bit n, within 600 s per cell
        in pure Python.
      rigorous_support: >-
        Enumeration is exact by construction (Fincke-Pohst, recalled); the
        feasibility claim is a runtime estimate imitating the standard
        behaviour of enumeration on LLL-reduced random lattices in
        dimension 30, not a theorem.
      validation_plan: >-
        Measured enumeration time per cell; cross-check for k <= 10 by
        brute-force box search; any cell exceeding budget is excluded and
        counted, never interpreted.

