  novelty_screen:
    method: >-
      THE crypto-kb INDEX WAS EMPTY THIS SESSION (':memory:', verified by
      the orchestrator); search_knowledge was NOT called and its silence is
      not read as novelty. Screening by direct full reads of the seven
      nearest records named in the task context (IDEA-20260805-061f97,
      IDEA-20260805-887d67, IDEA-20260807-0ff796, IDEA-20260807-61049d,
      IDEA-20260817-230971, IDEA-20260727-008, IDEA-20260808-486ae2), of
      H-SEMAEV-001, H-SEMAEV-002, KN-TECH-002, KN-FIND-007, RQ-RELN-001,
      RQ-ECDLP-001, RQ-ECDLP-002, GOAL-RELN-001, harness/semaev.py, and of
      the claim sections of IDEA-20260811-4a55dd, IDEA-20260805-fc6361 and
      IDEA-20260821-019d2f, which a ripgrep over ledger/proposals for
      'Gaussian heuristic|dependency lattice|left.kernel' (36 files) and
      over knowledge/ (2 unrelated KN-LIT bulk-seeded entries) surfaced as
      the nearest lattice-null designs. No external source was opened; no
      web search was run.
    results: >-
      No record defines the left-kernel lattice of augmented relation rows
      as a lattice, states its determinant n^(rank), or measures its
      lambda_1. 061f97 uses the F_n left kernel only as an existence
      threshold (R > rank). 887d67 and 230971 measure lambda_1 of OTHER
      lattices (fibre-specific kernel of a section map; End/Hom lattices)
      against Minkowski and the Gaussian heuristic, and 230971's random-
      lattice null N1 and fc6361's Siegel-count framing are the internal
      precedents for this record's null design. 61049d proves free orbit
      relations on j = 0 are in the kernel of evaluation -- those are L_R
      vectors and are used here as a planted control. 019d2f's ring-deleted
      random-matrix null at identical volume is the nearest null-arm
      pattern. The phrase 'dependency lattice' occurs nowhere in the ledger.
    verdict: >-
      UNVERIFIED. The GL-invariance observation is elementary linear
      algebra and is claimed only as new TO THIS PROGRAM; the Gaussian-
      heuristic / Siegel machinery is classical and recalled; Semaev
      summation polynomials are KN-TECH-002. No external novelty is claimed.

