idea:
  id: IDEA-20260828-5f259f
  added: '2026-08-28'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-AES-002
  goal_id: GOAL-AES-002
  title: >-
    Cross-instrument composition on the graded nonlinearity ladder: does the
    plaintext-axis co-degree death round and the key-axis co-degree death
    round move ADDITIVELY or INTERACTIVELY as real S-boxes are restored to
    the round function, isolating the key schedule's own contribution
  class: composition

  claim: >-
    IDEA-20260805-4bd60c already defines and derives forced structural values
    for a graded nonlinearity ladder L1: ten-round AES-128-shaped ciphers with
    the real S-box present at 16-t of 16 byte positions in the ROUND FUNCTION
    (t in {16, 12, 8, 4, 0}) while ALWAYS KEEPING THE REAL KEY SCHEDULE - so
    key-schedule nonlinearity is HELD CONSTANT across L1's five rungs and only
    round-function nonlinearity varies. IDEA-20260805-62359f (plaintext axis)
    and IDEA-20260828-01fc51 (key axis, classes A and B) each define a
    co-degree death-round instrument. NEITHER prior record runs its
    instrument against L1. CLAIM: running BOTH the plaintext-axis and the
    key-axis (class A) co-degree instruments against every rung of L1
    discriminates between two structural hypotheses about how the round
    function and the key schedule jointly destroy algebraic structure: (H_add)
    "the gap between the key-axis and plaintext-axis death rounds is
    approximately CONSTANT across all five rungs of t" - consistent with the
    key schedule's nonlinear injection acting as a roughly fixed additive
    'head start' on mixing, independent of how much round-function
    nonlinearity is present; versus (H_int) "the gap SHRINKS OR GROWS
    systematically as t decreases (more real S-boxes restored)" -
    consistent with an INTERACTION between the two nonlinear sources, in
    which the round function's own mixing either absorbs or amplifies the
    key schedule's extra injection depending on how much of the round
    function is already nonlinear. Because L1 holds the key schedule fixed
    across all five rungs by construction, ANY change in the measured gap
    across rungs is attributable to the interaction with round-function
    nonlinearity and to nothing else.

  object_first_candidate:
    tracked_object: >-
      THE GAP FUNCTION Delta(t) = (key-axis class-A death round at rung t) -
      (plaintext-axis death round at rung t), read across the FIVE rungs of
      the ALREADY-DEFINED L1 ladder (IDEA-20260805-4bd60c). The tracked
      object is not the death round of either instrument alone (already
      proposed separately) but the DIFFERENCE BETWEEN THEM as a function of a
      third, independently controlled variable (t) - a second-order,
      cross-instrument object that neither parent proposal defines or
      measures.
    established_families_off_limits: >-
      All twelve families in RQ-AES-002's off-limits list remain off-limits
      as the primary lens; this proposal is doubly so, since it composes two
      ALREADY-DECLARED-COMPLIANT instruments (the sister co-degree ladders)
      rather than introducing a new attack-shaped lens at all. Its novelty
      claim is entirely about the CROSS-INSTRUMENT COMPARISON, not about
      either instrument individually.
    newness_score: >-
      GENUINELY NEW WITHIN THIS PROGRAM in the narrow sense that no prior
      record here or found in this session's literature search runs two
      independent structural instruments against the SAME graded control
      ladder and reads their DIFFERENCE as the object of interest, rather
      than reading each instrument's absolute value separately. This is a
      methodological composition, not a new cryptanalytic mechanism, and is
      labeled accordingly. Novelty against the external literature is
      UNRESOLVED and not claimed in either direction.
    testability_score: >-
      High and cheap: it requires building L1's five rungs (already fully
      specified in IDEA-20260805-4bd60c, not re-derived here) and running the
      two ALREADY-SPECIFIED co-degree instruments (from IDEA-20260805-62359f
      and IDEA-20260828-01fc51) against each rung - no new instrument code is
      needed, only re-parameterizing existing code to accept an L1-rung
      cipher object instead of real AES-128.
    survival_score: >-
      UNKNOWN AND HONESTLY UNPREDICTED, stated as such rather than guessed:
      unlike the two parent proposals (which each pre-register a low-survival
      expectation for their primary signal), this composition's whole point
      is that EITHER outcome (Delta roughly constant, or Delta trending with
      t) is informative, and no directional prediction is pre-registered for
      Delta's trend - only its EXISTENCE as a well-defined, measurable
      quantity, and the requirement that it be reported whichever way it
      falls.

  mechanism: >-
    THIS PROPOSAL ADDS NO NEW ALGEBRA: it composes two derivations already on
    file. From IDEA-20260805-4bd60c: L1 rungs at t in {16,12,8,4,0} replace
    the real S-box by the identity on t of 16 byte POSITIONS in the round
    function, in every round, while keeping the real key schedule always (so
    class-A's round-key-1 nonlinear injection, derived in
    IDEA-20260828-01fc51, is present identically at EVERY rung of t). From
    IDEA-20260805-62359f: the plaintext-axis co-degree ladder and its exact
    null 2^{-8m}. From IDEA-20260828-01fc51: the key-axis class-A co-degree
    ladder and its predicted earlier nonlinear injection at round key 1.

    WHY THE GAP ISOLATES THE INTERACTION. At rung t = 16 (all round-function
    S-boxes identity, i.e. IDEA-20260805-4bd60c's L0-with-real-key-schedule),
    the ROUND FUNCTION itself contributes NO nonlinearity at all - every bit
    of nonlinear mixing in the whole cipher comes from the key schedule's
    SubWord calls alone. At this rung, the plaintext-axis co-degree ladder
    should behave AFFINELY forever (translation covariance never breaks,
    since AddRoundKey is the only nonlinearity-adjacent operation and it is
    linear in the varying plaintext byte at every round when the round
    function has no S-box), so the plaintext-axis death round is undefined or
    maximal - a FORCED BOUNDARY VALUE distinct from every other rung. The
    key-axis class-A ladder, by contrast, still dies at round key 1 (the key
    schedule's own SubWord call is untouched by t). So at t = 16, Delta(t) is
    at its LARGEST POSSIBLE VALUE by construction - a forced anchor point
    that any measured trend must pass through, independent of what happens at
    smaller t. As t decreases toward 0 (real AES), the plaintext-axis death
    round falls from its t=16 maximum toward whatever the sister proposal
    measures for real AES, while the key-axis class-A death round is
    predicted (by IDEA-20260828-01fc51) to remain comparatively stable
    (bounded near round key 1, since that path's nonlinearity does not depend
    on t at all). THE FORCED SHAPE THIS GIVES: Delta(t) should be monotone
    NON-INCREASING as t decreases from 16 to 0, purely from the plaintext-axis
    death round falling while the key-axis one stays roughly fixed - which is
    the SIMPLEST version of H_int (an interaction driven entirely by one
    instrument's known t-dependence) and is DISTINCT from H_add's prediction
    of a flat Delta(t). Observing which of these two shapes - or a third,
    non-monotone one - actually occurs is the discriminating measurement.

  novelty_status: adaptation

  citations:
    - ref: IDEA-20260805-4bd60c
      provenance: internal
      claim: >-
        Defines the L1 graded-nonlinearity ladder (t in {16,12,8,4,0}, real
        key schedule always) with a session-computed rank(M_K)=rank(M_P)=128
        forced value at t=16 (L0), reused here as the ladder this composition
        runs both co-degree instruments against, without re-deriving it.
      verified_by: "ledger corpus read this session"
    - ref: IDEA-20260805-62359f
      provenance: internal
      claim: >-
        Defines the plaintext-axis co-degree instrument and its exact null,
        reused here unmodified against L1's rungs instead of real AES-128.
      verified_by: "ledger corpus read this session"
    - ref: IDEA-20260828-01fc51
      provenance: internal
      claim: >-
        Defines the key-axis (class A) co-degree instrument and predicts its
        round-key-1 nonlinear injection is independent of round-function
        S-box restoration, which is the specific prediction this composition
        tests by holding the key schedule fixed across L1's rungs.
      verified_by: "authored in this same session"

  assumptions:
    - >-
      That IDEA-20260805-4bd60c's L1 rungs are actually built and available as
      a shared, tested object before this composition is dispatched; this
      proposal is NOT self-sufficient and is explicitly sequenced after (or
      concurrently with, sharing the same build) that proposal's stage 3.
    - >-
      That both co-degree instruments (plaintext axis, key axis class A) can
      be re-parameterized to accept an L1-rung cipher object with no change
      to their interpolation or null-calibration code, only to the cipher
      call itself - a software assumption, checked in stage 0.

  proof_search_map:
    not_applicable_reason: >-
      This is a cross-instrument empirical comparison at toy scale, not an
      asymptotic complexity claim, certificate, or reduction argument. No
      KN-TECH-080 audit applies; the relevant correctness checks are the
      forced boundary value at t=16 and the reused instruments' own positive
      controls, both covered under minimal_test below.

  predictions:
    - metric: "plaintext_axis_death_round_at_t16 (L0-with-real-key-schedule rung)"
      direction: higher
      minimum_effect: >-
        FORCED: undefined/maximal (no S-box in the round function at all, so
        translation covariance never breaks via the round function; if the
        key schedule's own S-box leaks into the plaintext-axis reading at
        this rung, that is itself a distinct and reportable finding, since
        the plaintext axis's translation-covariance argument does not
        involve the key schedule at all in the sister derivation).
    - metric: "key_axis_class_A_death_round_at_t16"
      direction: different
      minimum_effect: >-
        PREDICTED approximately round key 1 (matching IDEA-20260828-01fc51's
        class-A prediction), independent of t, since class A's nonlinear
        injection is entirely inside the key schedule and t only touches the
        round function.
    - metric: "Delta(t) shape across t in {16,12,8,4,0}"
      direction: different
      minimum_effect: >-
        NO DIRECTIONAL VALUE PRE-REGISTERED for the shape between the two
        forced anchor behaviors above; the pre-registered CLAIM is that
        Delta(t) is a well-defined, measurable, and REPORTED quantity at
        every rung, and that its monotonicity (or lack of it) is read
        directly rather than summarized qualitatively. A non-monotone Delta
        is itself the canonical artifact-tell shape and halts interpretation
        exactly as the parent proposals' own round-count ladders do.
    - metric: "key_axis_class_A_death_round variance_across_t"
      direction: lower
      minimum_effect: >-
        PREDICTED LOW (near-constant across t), since IDEA-20260828-01fc51's
        mechanism places class A's break entirely inside the key schedule; a
        HIGH variance here would itself falsify that proposal's independence
        assumption and must be reported back to it as a cross-check.

  minimal_test:
    design: >-
      Three stages, entirely reusing existing code. STAGE 0 (seconds, can end
      the line): confirm both co-degree instruments run unmodified against an
      L1 rung object with only the cipher-call substituted; confirm the
      forced t=16 boundary values (plaintext axis undefined/maximal, key axis
      near round key 1) before reading any interior rung. STAGE 1 (minutes):
      run both instruments at all five rungs t in {16,12,8,4,0}, N = 4096
      samples per (rung, instrument), with the matched-random-permutation
      control interleaved exactly as in each parent proposal. STAGE 2
      (paper): compute Delta(t), report its shape, and write the
      H_add-vs-H_int verdict with the boundary-value cross-check fed back to
      IDEA-20260828-01fc51.
    controls:
      - >-
        FORCED BOUNDARY CONTROL AT t=16: the strongest available control here,
        since both instruments' behavior at this rung is DERIVED, not
        assumed, from the parent proposals' own mechanisms. A violation at
        this single point (rather than at an interior rung) localizes the
        defect to the L1 build or the re-parameterization, not to the
        substantive H_add/H_int question.
      - >-
        POSITIVE CONTROLS INHERITED UNCHANGED from both parent proposals (the
        S-box 9-term identity, the random-function null, the class-A/class-B
        round-key linearity checks) - all must still pass when the cipher
        call is an L1 rung rather than real AES-128, since these controls do
        not depend on t.
      - >-
        GRADED CONTROL: t itself is the graded ladder (five points, already
        designed as such by IDEA-20260805-4bd60c), with monotonicity of BOTH
        component death rounds (not just Delta) reported separately, so a
        non-monotone Delta can be diagnosed as arising from one instrument
        alone versus from a genuine interaction.
      - >-
        ORDERING CONTROL: the t=16 boundary reading is computed and committed
        before any interior rung (t=12,8,4,0) is looked at, so the forced
        anchor cannot be adjusted post hoc to fit an interior trend.
      - >-
        ARCHIVE CHECK (zero compute): no prior record in this repository
        composes two structural instruments against a shared graded ladder
        and reads their difference; recorded as unavailable rather than a
        passed check.
    required_metrics: [death round or forced-undefined flag for each instrument at each of the five rungs, Delta(t) at each rung with its monotonicity verdict, both instruments inherited positive-control results at each rung, the t=16 boundary-value cross-check result fed back explicitly to IDEA-20260828-01fc51's own assumption H2]

  falsification_conditions:
    - >-
      Either instrument's inherited positive control fails when run against
      an L1 rung. The re-parameterization is broken; nothing about Delta may
      be reported.
    - >-
      The forced t=16 boundary values are not observed (plaintext axis dies
      at a finite round, or key axis class A does not die near round key 1).
      This falsifies one of the PARENT proposals' own mechanisms as applied
      to L1 specifically and must be reported back to that proposal as a
      cross-check failure, not absorbed silently into this record.
    - >-
      Delta(t) is non-monotone across the five rungs. The canonical
      artifact-tell shape has fired (per docs/inventor-protocol.md section 3)
      and the composition's interpretation is halted pending a diagnosis of
      which component instrument is responsible.

  confounders:
    - >-
      SAMPLE SIZE ASYMMETRY. If the two parent proposals use different N at
      different stages of their own development, comparing death rounds
      derived from unequal sample sizes could manufacture a spurious trend in
      Delta. Declared pre-run: this composition uses the SAME N = 4096 for
      both instruments at every rung, overriding whatever N either parent
      proposal used independently.
    - >-
      OUTPUT BYTE j AND KEY BYTE c CHOICE INTERACTING WITH t. The specific
      byte positions left as identity at each rung of L1 (which 16-t
      positions keep the real S-box) could interact with the specific (i,j)
      or (c,j) pair chosen for the co-degree readings. Declared pre-run: the
      same (i,j) and (c,j) pairs are used across all five rungs for a given
      replicate, and the L1 byte-position choice is drawn once and reported.
    - >-
      DEPENDENCY ON TWO UNFINISHED PARENT PROPOSALS. This composition cannot
      be dispatched before at least a partial build of L1 (from
      IDEA-20260805-4bd60c) and both co-degree instruments (from
      IDEA-20260805-62359f and IDEA-20260828-01fc51) exist; it is explicitly
      sequenced, not independently schedulable, and this dependency is the
      main reason for its lower recommended priority.

  interpretation_limits:
    - >-
      CLAIM TIER toy by default (RQ-AES-002 R7), inherited unconditionally
      from both parent instruments and from L1's own toy-tier status.
    - >-
      A result here says nothing about which of H_add or H_int holds for REAL
      AES-128 beyond what the parent proposals' own real-AES readings (at
      t=0, which IS real AES-128) already report; the L1 rungs at t > 0 are
      structurally weakened analogues, and this composition's forward
      guidance is explicitly that the t=0 point of Delta(t) is the only rung
      with direct real-AES relevance, with t > 0 serving only to reveal the
      SHAPE leading up to it.
    - >-
      This proposal produces no attack, no distinguisher, and no barrier
      statement on its own; its entire deliverable is a cross-check on the
      INTERNAL CONSISTENCY of two sibling proposals' mechanisms, which is
      valuable exactly to the extent that AGENTS.md rule 9 requires
      deprioritization and closure decisions to record real evidence rather
      than assumption - this composition is that evidence for the "is the
      key-schedule's contribution independent of round-function nonlinearity"
      assumption both sibling proposals otherwise state only as a heuristic.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NONE LOAD-BEARING BEYOND THE TWO PARENT PROPOSALS' OWN H1s (the exact
        field identities I1-I4 and the key-schedule recurrence derivation),
        both inherited unchanged and not re-derived here.
      rigorous_support: >-
        Given in full in IDEA-20260805-62359f and IDEA-20260828-01fc51; this
        record adds no new algebraic content.
      validation_plan: >-
        Stage 0's forced-boundary check at t=16 IS the validation that the
        inherited derivations transfer correctly to an L1-rung cipher object,
        which neither parent proposal tests directly.
    - id: H2
      statement: >-
        INDEPENDENCE OF THE KEY-SCHEDULE PATH FROM ROUND-FUNCTION
        NONLINEARITY. The key schedule's SubWord-mediated nonlinear injection
        (class A, round key 1) operates identically regardless of how much
        real S-box structure is present in the round function.
      rigorous_support: >-
        PLAUSIBLE BUT NOT PROVEN - the key schedule computation is
        structurally independent of the round function's SubBytes calls (they
        operate on disjoint data paths: key schedule words vs. state bytes),
        which supports independence, but the co-degree READING is taken from
        a CIPHERTEXT byte, which DOES pass through the (possibly weakened)
        round function after each round key is applied - so an L1 rung's
        weakened round function could still alter how the key schedule's
        early nonlinear injection eventually surfaces in the ciphertext, even
        though the injection ITSELF is unaffected. This is exactly the
        distinction this composition is built to resolve empirically.
      validation_plan: >-
        MEASURED, not assumed: the key-axis class-A death round is read at
        all five L1 rungs and its variance across t is reported directly (see
        the key_axis_class_A_death_round_variance_across_t prediction above);
        low variance supports H2, high variance falsifies it and is reported
        as a finding about how the round function's own nonlinearity
        modulates the visibility of the key schedule's early injection.

  target_complexity:
    time_exponent: >-
      NO EXPONENT MOVED. This is a composition of two toy-tier structural
      instruments; its cost is bounded by the sum of the two parent
      instruments' costs at five rungs rather than one cipher, i.e. roughly 5x
      either parent's single-cipher cost, still trivial (low thousands of
      encryptions total).
    memory_exponent: negligible, inherited from both parent instruments.
    best_known: >-
      The reference for RQ-AES-002 remains exhaustive key search under CM-1;
      the published state of the art is UNADJUDICABLE in this environment,
      asserted in neither direction. This composition proposes no attack.
    hidden_overhead: >-
      None beyond the 5x rung multiplier, stated exactly.
    tradeoff_note: >-
      None; no data or memory axis beyond what the two parent instruments
      already declare.

  dominated_by: >-
    "unresolvable in this environment: no primary source reachable; every
    recalled frontier row is unverified-from-memory". Set to this string and
    NEVER to null, per RQ-AES-002 claim_tier_ceiling R5. Rows checked INSIDE
    this repository: EV-AES-001..005, EV-AES-d33b1c, EV-AES-d8a13e; KN-FIND-
    028, KN-FIND-029; KN-TECH-063/069/070/071/074/075/079; all five prior
    RQ-AES-002 proposals, in particular IDEA-20260805-4bd60c (L1 ladder, whose
    rungs are reused unmodified) and the two co-degree instruments this record
    composes. None runs two structural instruments against a shared graded
    ladder and reads their difference. No external search was performed
    specifically for this composition (it is an internal methodological
    combination of already-searched objects); the two parent proposals'
    literature searches are inherited by reference and not repeated.
  sota_delta: >-
    DEFINITIONAL-REFERENCE DELTA: ZERO. No attack, no key recovery, no margin
    of any kind against exhaustive key search under CM-1; the
    published-state-of-the-art comparison is UNADJUDICABLE in this
    environment and is asserted in neither direction (R5 clause, same
    sentence). The quantitative contribution, if run, is Delta(t) at five
    points and a decision between H_add and H_int - a methodological/internal-
    consistency finding feeding back into both parent proposals' own
    heuristic assumptions, not a margin.

