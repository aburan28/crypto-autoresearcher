idea:
  id: IDEA-20260804-98dc2c
  question_id: RQ-ECDLP-002
  title: Additive scalar-interval energy as a source-labelled relation primitive
  class: mechanism
  claim: >-
    Let I_{a,L}={a,...,a+L-1} subset Z/NZ and V_{a,L}={ [k]P:k in I_{a,L} }.
    A sub-rho route from this scalar-index-set object requires an explicit
    source-labelled relation primitive whose additive-energy surplus over a
    matched random index-set control produces B=N^(1/5) independent relation
    rows and complete lambda,mu<=0.45 accounting.  The conditional target is
    N^(0.45+o(1)); no such surplus or solver is asserted.
  mechanism: >-
    The tracked object is the unlabelled difference-multiplicity histogram
    H_{a,L}(D)=#{(i,j):[a+i]P-[a+j]P=D}, which discards the ordered index
    pair but translates deterministically under a -> a+t.  It is genuinely
    lossy: many labelled pairs map to one D.  A proposed primitive must return
    the pair indices by a public replay certificate before a row is counted;
    otherwise it is endpoint aggregation and rejected.  This is distinct from
    IDEA-20260802-006's multiplicative subgroup/coset bias: the structure is
    additive intervals under translation, and the observable is source-valid
    additive energy, not a Fourier bias of multiplicative index sets.
  novelty_status: unverified
  assumptions:
    - Intervals, offsets, and any factor decks are public and target-independent.
    - Every accepted relation includes exact signed indices, is replayed in E,
      and is charged through rank, factor logs, blind descent, and memory.
  proof_search_map:
    bottleneck: Converting a non-random additive-energy surplus into exact source pairs and independent relation rank below the B^3 separator cost.
    baseline_embedding:
      parameter_slice: An independently sampled size-L index set, for which the same pair histogram and replay code define the null baseline.
      reproduction_check: Verify exact pair count L^2 and identical source-replay and duplicate-normalization rules in both arms.
    observation_collision:
      observable: Difference multiplicities plus replayable source-pair indices and row rank.
      distinct_preimage_search: Permute labels inside each equal-difference fibre; if the alleged locator changes, it used discarded source information.
    constructive_transforms:
      - transform: telescoping_potential
        proposed_object: Translation ladder of interval histograms, charged by newly entering/leaving endpoints rather than rebuilt pair tables.
        predicted_gain: A conditional B^(3/4) reduction against the explicit B^3 six-list separator, only if source replay and rank survive.
    quantifier_order: >-
      For every public interval family and source-return primitive, if its
      real-minus-null useful-rank gain and full costs satisfy lambda,mu<=0.45,
      then it is a candidate; no existence claim is made.
    method_ceiling:
      strongest_certifiable_claim: A scoped real-versus-random interval-energy separation with source replay, or a scoped null result for the tested primitive.
      nearby_object_control: Random size-L index sets and randomly shuffled interval labels with matched pair counts and target-independent offsets.
    proof_obligations:
      - {claim: "H is a lossy ordered-pair projection and its translation update is defined.", responsibility: correctness}
      - {claim: "Every emitted pair is replayable without a hidden index dictionary.", responsibility: interface}
      - {claim: "Useful rank, not mean yield, has the required real-versus-null gap.", responsibility: success_probability}
      - {claim: "Setup, updates, source output, rank, factor logs, descent, and peak memory are fully charged.", responsibility: runtime}
    not_applicable_reason: null
  predictions:
    - {metric: useful_rank_real_minus_random, direction: higher, minimum_effect: "At least B^(3/4-o(1)) after matched candidate count; otherwise the 0.45 target is unavailable."}
    - {metric: source_replay_failure_rate, direction: lower, minimum_effect: "Zero for every accepted row."}
    - {metric: translation_update_work, direction: lower, minimum_effect: "Below rebuilding L^2 pairs; otherwise the object is only a reindexing."}
  minimal_test:
    design: >-
      On complete toy prime-order subgroups, enumerate translation ladders of
      intervals and matched random size-L sets; compute exact histograms,
      attempt the predeclared source-return rule, replay all rows, and compare
      duplicate-normalized rank.  A null-matched rank distribution or a
      source-return dependence on stored labels rejects this primitive.
    controls: [matched random index-set histogram, shuffled interval-label null, direct explicit pair enumeration baseline]
    required_metrics: [energy_histogram, source_recall, false_source_rate, duplicate-normalized_rank, update_work, peak_memory]
  falsification_conditions:
    - Real interval rank matches the same-shape random-index null after duplicate normalization.
    - Any accepted row needs discarded ordered-pair labels or a scalar-index dictionary.
    - Complete charging fails lambda<=0.45 or mu<=0.45.
  confounders:
    - Differences [i]P-[j]P=[i-j]P can make raw interval energy a trivial scalar multiplicity artifact; only source-valid row rank is read.
    - Toy interval periodicity and wraparound must be matched in the null.
    - Mean relation yield is fixed by KN-FIND-007 and is not evidence of an interval advantage.
  interpretation_limits:
    - This is not generic collision/rho, a scalar-orientation return, or a claim that scalar intervals solve ECDLP.
    - It does not reopen STR/DEP, EXP-SMTH-9d04ba, or HEUR-DS-1.
  heuristic_assumptions:
    - id: H-ASI-1
      statement: "Uniformly for B=N^(1/5), an additive interval primitive has B^(3/4-o(1)) more source-valid independent rank than matched random index sets at equal candidate cost."
      rigorous_support: "Translation of scalar intervals and pair replay are exact; KN-FIND-007 rigorously fixes mean decomposition yield. No bound in the local corpus supplies the asserted rank surplus."
      validation_plan: "Exhaustively sample toy intervals and random matched sets, compare rank CDFs and upper tails, and test the translation ladder. This is toy-scale only; no crypto-scale validation route is currently known."
  target_complexity:
    time_exponent: "Conditional N^(0.45+o(1)); supported exponent 0.50 (rho)."
    memory_exponent: "Conditional N^(0.45+o(1)); pair state, replay, rank, factor logs, and descent included."
    best_known: "Pollard rho N^(1/2+o(1)) time/N^o(1) memory; BSGS N^(1/2+o(1)) time and memory."
    hidden_overhead: "Interval updates, source replay, duplicate removal, rank certification, factor logs, blind descent, and parallel communication are all charged."
    tradeoff_note: "A stored scalar-index dictionary is forbidden advice; parallel updates require globally consistent deduplication."
  estimated_cost: {implementation: medium, compute: low}
  dominated_by: "Pollard rho and explicit pair enumeration on every demonstrated axis."
  sota_delta: "Supported time/memory/data-query deltas: 0.00. Conditional target is time exponent -0.05 versus rho with memory exponent +0.45."
  recommended_priority: medium
  source_refs: [ledger/proposals/IDEA-20260802-006.yaml, knowledge/open-problems/KN-OPEN-019.md, knowledge/findings/KN-FIND-007.md, ideas/reviews/P1552_MECHANISM_FRONTIER_20260718.md]
