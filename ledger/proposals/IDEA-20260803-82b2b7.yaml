idea:
  id: IDEA-20260803-82b2b7
  question_id: RQ-SSI-001
  title: >-
    Stop trying to construct tau and decide whether it can exist - a trace-collision test
    for QM-STOPPING that terminates the FC0 lane in one batch, either with a named
    obstruction or with a definability result
  class: barrier
  claim: >-
    QM-STOPPING HAS CARRIED control_result FAIL SINCE BATCH-018 AND HAS BEEN MERELY
    RETAINED ACROSS EIGHT SUBSEQUENT BATCHES WITHOUT A NAMED OBSTRUCTION. THE BATCH-039
    RED TEAM SAID SO IN THOSE WORDS. Thirty-three consecutive batches on IDEA-20260729-001
    have each recorded CONFIRM and each advanced a status string - interfaces_frozen,
    scaffolding_partial, F*_peak_liveset, path_justified, f_union_ledger, resource_vector,
    charge_incidence, retry_cleanup, verify_exit, history_uniform_tail, tau_schema,
    width_schema, width_slot_binding, retry_peak_byte, peak_byte_bound, charge_metering,
    global_memory_bound, composition_aggregation, numeric_composition_operator_protocol_toy
    - while the binding blocker did not move and the lane's single numeric output is
    peak_byte_bound = 24 in a fictional unit that EV-SSI-039 itself disclaims as not a
    memory bound and the red team shows is M-dominated.
    EVERY ONE OF THOSE BATCHES ASKED "CAN WE BUILD tau?" AND ANSWERED "NOT YET". THE
    QUESTION THAT TERMINATES IS "CAN tau EXIST ON THIS TRACE ALGEBRA AT ALL?" AND IT IS
    DECIDABLE BY A COLLISION SEARCH, NOT BY A CONSTRUCTION.
    Let pi be the projection from executions of the pinned CollimationSieve@6f9188e4 host
    to the FC0 observable trace, as already frozen in FC0-EXT-PKG-SSI-001 and instantiated
    by the BATCH-022 scaffold. A stopping time measurable with respect to sigma(pi) exists
    ONLY IF the stopping event is pi-invariant. SO SEARCH FOR THE WITNESS THAT IT IS NOT:
    a pair of executions e1, e2 with pi(e1) = pi(e2) and different stopping behaviour.
    FINDING ONE IS THE NAMED OBSTRUCTION - it proves no tau definable on FC0 traces can
    exist, which is a CLOSURE to the inventor-protocol section 4 standard (named
    obstruction, argument, and what remains open) rather than another retention. FAILING TO
    FIND ONE, WITH THE PLANTED POSITIVE CONTROL DETECTED, IS THE OPPOSITE AND EQUALLY
    TERMINAL RESULT: the trace determines stopping, tau is definable, and thirty-three
    batches were searching the right space with the wrong instrument - at which point the
    construction becomes a bounded finite search with a known target rather than an open
    invitation.
    FALSIFIED AS A METHOD IF the planted lossy-projection control is NOT detected, which
    would mean the collision search has no power and neither of its outcomes may be read.
  mechanism: >-
    THE LANE'S FAILURE MODE IS STRUCTURAL AND IS THE MIRROR IMAGE OF THE ONE THE HARNESS
    GUARDS AGAINST. docs/inventor-protocol.md treats premature closure - declining to search
    because a target looks saturated - as a first-class failure, and the harness catches it.
    IT HAS NO DETECTOR FOR UNBOUNDED NON-CLOSURE, because every individual batch passes
    review honestly. Thirty-three honest CONFIRMs compose into zero information, and the
    composition is invisible to a per-batch gate. THIS PROPOSAL IS NOT A GOVERNANCE
    COMPLAINT - it is the observation that the lane's question was posed in a form with no
    terminating answer, and a replacement question that has exactly two, both terminal.
    WHY THE COLLISION FORM IS THE RIGHT ONE HERE AND NOT MERELY A REFRAMING. A stopping time
    is by definition measurable with respect to the filtration generated by the observable
    process. FC0 does not observe the sieve; it observes a PROJECTION of it, and the whole
    of BATCH-019's host_gap certificate and BATCH-020's no_admissible_pin result are
    statements that the projection is strictly lossy relative to the host. THE LANE HAS
    THEREFORE ALREADY ESTABLISHED, IN TWO SEPARATE CERTIFICATES, THAT pi LOSES INFORMATION -
    and then spent nineteen further batches building charge ledgers on top of it without
    ever asking whether STOPPING is among what it loses. That is the exact question, it is
    a measurability question, and measurability questions are settled by exhibiting a
    collision or proving none exists.
    THE MACHINERY ALREADY EXISTS AND WAS BUILT BY THIS LANE. BATCH-013 produced finite-model
    zero-progress witnesses that block one naive uniform lower-bound route inside a searched
    idealized model - that is a collision search over a finite model, run successfully, with
    a committed result. BATCH-014/015/016 built and pre-registered the ttm-v2 panel with
    explicit return-modulus and requested-length semantics and real frame-by-frame traces.
    BATCH-022's scaffold instantiates the frozen interface. THIS PROPOSAL REUSES ALL OF IT
    AND INVENTS NO CollimationSieve API, WHICH EVERY DECISION FROM BATCH-019 ONWARD
    PROHIBITS. The only new object is the collision predicate.
    WHY BOTH OUTCOMES ARE WORTH THE BATCH, WHICH IS THE TEST OF A GOOD DISCRIMINATOR. A
    collision closes the lane with a mathematical statement about FC0 rather than with a
    budget exhaustion, and it is a statement about a real abstraction that other work can
    cite. No collision, with the planted control detected, converts an open-ended
    construction into a bounded one and RETIRES THE FAIL RETENTION either way. Neither
    outcome clears QUERY_MEMORY, neither is a CSIDH result, and neither is a breakthrough -
    and saying that plainly is what distinguishes this from the thirty-three CONFIRMs it
    replaces.
  novelty_status: adaptation
  novelty_screen:
    screened_on: '2026-08-03'
    corpus_paths_grepped:
    - ledger/evidence/EV-SSI-013.yaml
    - ledger/evidence/EV-SSI-018.yaml
    - ledger/evidence/EV-SSI-019.yaml
    - ledger/evidence/EV-SSI-020.yaml
    - ledger/evidence/EV-SSI-031.yaml
    - ledger/evidence/EV-SSI-038.yaml
    - ledger/evidence/EV-SSI-039.yaml
    - ledger/goals/GOAL-SSI-001.yaml
    grep_results:
    - >-
      BATCH-018 (EV-SSI-018) produced the stopping-law CONTROL and its FAIL outcome, and
      its own inference says the next work should be "not another identical FAIL control".
      Eight batches later it is still being retained. THIS RECORD IS THE
      NON-IDENTICAL SUCCESSOR that EV-SSI-018 asked for and did not get.
    - >-
      BATCH-031 (EV-SSI-031) built a symbolic tau-schema / stopping-coverage obligation
      ledger that "reconfirms BATCH-018 FAIL without inventing tau". A schema that
      reconfirms a FAIL is not a decision procedure about existence. This record asks the
      existence question directly and is not a further schema.
    - >-
      BATCH-013 (EV-SSI-013) established finite-model zero-progress witnesses - a
      successful finite collision search inside an idealized model, with a committed
      result. That is the closest methodological precedent IN THIS LANE and this record
      reuses its machinery rather than rebuilding it. It differs in target: BATCH-013
      searched for progress witnesses, this searches for stopping-indistinguishable pairs.
    - >-
      BATCH-019 host_gap and BATCH-020 no_admissible_pin both certify that pi is lossy
      relative to the host. NEITHER ASKS WHETHER STOPPING IS AMONG WHAT IS LOST. That gap
      is this record's entire content.
    - >-
      GOAL-SSI-001 BATCH-040's next_action finally directs a QM-STOPPING obstruction
      analysis, as item (2) behind a width-contract specification. This record supplies
      that analysis with a shape that can succeed or fail rather than accrete, and is
      compatible with being run as that item.
    literature_verified: []
    literature_unverified:
    - >-
      The measurability characterization of stopping times with respect to a generated
      filtration is textbook probability and is used here only in its definitional form,
      which requires no citation to apply. NO CLAIM about the Kuperberg / collimation-sieve
      literature is made, and the Equation (4.1) and 8L source-integrity material pinned in
      BATCH-009/010 is neither re-litigated nor extended.
    conclusion: >-
      Adaptation. Deciding measurability by exhibiting an indistinguishable pair is standard
      technique. The contribution is recognizing that the FC0 lane's own two lossiness
      certificates make it the applicable technique, and that it converts an
      eight-batch-old retained FAIL into a question with two terminal answers.
  assumptions:
  - >-
    NO CollimationSieve@6f9188e4 API IS INVENTED. The pin is untouched, the BATCH-022
    scaffold is unmodified, and the collision search operates on the frozen
    FC0-EXT-PKG-SSI-001 interface and the committed ttm-v2 traces only. Every prohibition
    from DEC-20260730-037 and its predecessors binds unchanged.
  - >-
    NO tau IS INVENTED, at any point, including as a toy. EV-SSI-039's instruction not to
    attempt a fake-tau gate B as a toy binds. This record does not produce a tau; it
    produces a decision about whether one can exist on the trace algebra.
  - >-
    NO NUMERIC VALUE IS INVENTED. The record produces a boolean plus a witness pair, not a
    bound, a width, a byte count, or a security number. The peak-byte width lane is NOT
    iterated, per DEC-20260730-037.
  - >-
    The projection pi is taken EXACTLY as frozen. If the frozen interface does not determine
    pi unambiguously, that ambiguity is itself reported as a blocking defect of the freeze
    rather than resolved by choosing a reading.
  proof_search_map:
    bottleneck: >-
      Whether the stopping event is invariant under the FC0 trace projection. The exact
      bottleneck claim is that this single measurability question is what QM-STOPPING has
      been failing on for eight batches, and that every intervening MEMORY-MAP artifact is
      orthogonal to it - which is precisely what the BATCH-039 red team recorded.
    baseline_embedding:
      parameter_slice: >-
        The BATCH-013 finite model, in which a collision search has already been run
        successfully to a committed result.
      reproduction_check: >-
        Re-run BATCH-013's zero-progress witness search under this record's search harness
        and reproduce its committed witnesses exactly. A harness that cannot reproduce the
        lane's own prior finite-model result may not be trusted to report a negative on a
        new one.
    observation_collision: >-
      THE OBSERVATION COLLISION IS THE ENTIRE EXPERIMENT, not a control on it. The
      observable is the FC0 trace; the sought preimage pair is two executions with equal
      traces and unequal stopping behaviour. The search must cover, at minimum: differing
      random-tape prefixes with equal observable prefixes, differing recursive-history
      depths with equal reported state, differing retry/cleanup residuals with equal
      charge-incidence rows, and differing Verify-exit outcomes with equal F_verify
      obligations - the four channels the lane's own ledgers (BATCH-024 through BATCH-029)
      identified as carrying uncharged information.
    quantifier_order: >-
      EXISTS a pair (e1, e2) of admissible executions with pi(e1) = pi(e2) and
      1_S(e1) != 1_S(e2), where S is the stopping event as frozen. NOT "for all executions"
      and NOT "there exists a projection" - pi is fixed by the freeze before the search
      begins. A collision found under a pi other than the frozen one proves nothing and must
      be rejected by the harness, not reported.
    method_ceiling: >-
      A collision proves non-existence of tau ON THE FC0 TRACE ALGEBRA ONLY. It says nothing
      about whether a stopping law exists for the actual collimation sieve, nothing about
      CSIDH's quantum security, and nothing about QUERY_MEMORY. Absence of a collision in a
      FINITE model does not prove definability in the general model - it proves it in the
      searched model, and the searched model must be stated with its size.
    nearby_object_control: >-
      Run the identical search against a DELIBERATELY LOSSIER projection pi' - one that
      provably discards a stopping-relevant field. A collision MUST be found there. This is
      the planted positive control and it is what gives a negative result any meaning at
      all; the lane's history (EV-GGM-002, KN-FIND-029's five false-green escapes across
      three repairs of one mutation control) is the reason it is mandatory rather than
      advisable.
  predictions:
  - metric: planted_control_detection
    direction: same
    minimum_effect: >-
      'The search finds a collision under the deliberately lossy pi'' in 5 of 5 independent
      plantings, at distortion levels spanning the four identified information channels. A
      planting that escapes means the search has no power and NEITHER primary outcome may be
      read. THIS IS THE GATE, EVALUATED BEFORE THE PRIMARY SEARCH.'
  - metric: baseline_witness_reproduction
    direction: same
    minimum_effect: >-
      'BATCH-013''s committed zero-progress witnesses are reproduced exactly by this
      harness. A mismatch is a harness defect and blocks the batch.'
  - metric: primary_collision_outcome
    direction: same
    minimum_effect: >-
      'A boolean with a witness. EITHER an explicit admissible pair (e1, e2) with equal
      frozen traces and unequal stopping behaviour, independently recheckable from the
      committed trace files - which is the NAMED OBSTRUCTION - OR a statement that no such
      pair exists in the searched model, WITH THE MODEL''S SIZE AND ENUMERATION BOUNDS
      STATED. An outcome reported without either the witness or the bounds is inadmissible.'
  - metric: lane_disposition_emitted
    direction: same
    minimum_effect: >-
      'The batch emits exactly one of two dispositions - OBSTRUCTION_NAMED or
      TAU_DEFINABLE_IN_SEARCHED_MODEL - and in the second case a bounded construction target
      with its search space stated. "Retain FAIL" IS NOT AN ADMISSIBLE OUTCOME OF THIS
      BATCH, and that is the point of the design: the record is built so that the
      eighth-consecutive-retention outcome is structurally unavailable.'
  - metric: prohibition_field_scan
    direction: same
    minimum_effect: >-
      'A zero-invented-numerics and zero-invented-API field scan passes, matching the
      standard RT-20260730-129 applied at BATCH-039. No tau, no width, no byte count, no
      CollimationSieve API appears in any produced artifact.'
  minimal_test:
    design: >-
      ZERO CURVE, ISOGENY, OR QUANTUM COMPUTE, matching every prior batch in this lane. (1)
      Extract pi verbatim from the frozen FC0-EXT-PKG-SSI-001 interface and the BATCH-022
      scaffold; if pi is not unambiguously determined, STOP and report the freeze defect.
      (2) Reproduce BATCH-013's committed witnesses under the new harness. (3) Construct the
      lossy pi' plantings across the four identified channels and verify 5 of 5 detection.
      (4) ONLY THEN run the primary collision search over the frozen model, with enumeration
      bounds declared in advance. (5) Emit the disposition with its witness or its bounds.
      (6) Run the prohibition field scan. (7) Write the inventor-protocol section 4 closure
      statement - named obstruction, argument, and what remains open - or the bounded
      construction target, as applicable.
    controls:
    - >-
      PLANTED LOSSY-PROJECTION POSITIVE CONTROL at 5 plantings across 4 channels, evaluated
      BEFORE the primary search and blocking it on failure.
    - >-
      BASELINE WITNESS REPRODUCTION against BATCH-013's committed result - a known-answer
      case inside this lane.
    - >-
      FROZEN-pi GUARD - the harness rejects any collision found under a projection other
      than the frozen one, rather than reporting it.
    - >-
      PROHIBITION FIELD SCAN to the BATCH-039 red-team standard.
    required_metrics:
    - planted-control detection fraction per channel, with the enumeration bound used
    - baseline witness reproduction residual
    - the primary disposition, with witness pair or with model size and enumeration bounds
    - the searched model's exact size and the fraction of it enumerated
    - prohibition field scan result
  falsification_conditions:
  - >-
    'F1 - the planted control is not detected at every planting: THE SEARCH HAS NO POWER.
    Neither primary outcome may be read, and the batch reports an instrument failure. This
    is the outcome KN-FIND-029''s five false-green escapes make most likely and it is
    checked first for that reason.'
  - >-
    'F2 - BATCH-013''s witnesses are not reproduced: harness defect, batch blocked.'
  - >-
    'F3 - pi is not unambiguously determined by the freeze: the freeze itself is defective,
    which is a finding about nineteen batches of artifacts built on top of it and must be
    routed to a correction record.'
  - >-
    'F4 - the searched model cannot be enumerated within the batch budget: report the
    fraction enumerated and the disposition as UNRESOLVED-AT-BUDGET with the bound stated.
    This is a legitimate outcome and is NOT the same as retaining FAIL, because it comes
    with a number.'
  - >-
    'F5 - any artifact contains an invented tau, width, numeric bound, or CollimationSieve
    API: contract violation, artifact rejected.'
  confounders:
  - >-
    A FINITE-MODEL NEGATIVE IS NOT A GENERAL NEGATIVE. Finding no collision in a searched
    model does not prove tau is definable in the real setting; it proves it in that model.
    The model size must travel with the result in every citation, exactly as BATCH-013's
    "inside the searched idealized model" qualification does.
  - >-
    The four information channels are taken from the lane's own ledgers and may not be
    exhaustive. A channel the ledgers never identified is invisible to this search, and the
    result is scoped to the enumerated channels.
  - >-
    A collision witness proves non-definability on the frozen pi. A DIFFERENT and richer
    FC0 abstraction might admit tau - which would be a legitimate successor lane and must be
    named as such rather than treated as a rebuttal.
  interpretation_limits:
  - >-
    NEITHER OUTCOME CLEARS QUERY_MEMORY. FC0_QUERY_MEMORY_SEMANTICS_UNRECONCILED is retained
    regardless. QM-MEMORY-MAP and QM-ERROR are untouched.
  - >-
    NEITHER OUTCOME IS A CSIDH RESULT, A SECURITY CLAIM, A COMPLETION, A PIN_COMPLETE, OR A
    BREAKTHROUGH. KN-OPEN-014 remains open and this record does not narrow it.
  - >-
    An obstruction on FC0 is a statement about an ABSTRACTION THIS PROGRAMME BUILT, not
    about the collimation sieve. Its value is that it terminates a lane honestly, and that
    value must not be inflated in any deliverable.
  - >-
    Claim tier `control`, matching every prior artifact in this lane.
  heuristic_assumptions:
  - id: HEUR-TC-1
    statement: >-
      The four information channels enumerated from the lane's BATCH-024 through BATCH-029
      ledgers cover the ways an execution can differ while its FC0 trace does not.
    rigorous_support: >-
      The channels are taken from committed ledgers that were each independently red-teamed,
      which is the strongest support available without a completeness proof. NO COMPLETENESS
      PROOF EXISTS and the enumeration may be short.
    validation_plan: >-
      Report the enumeration explicitly and invite the red team to name a fifth channel as a
      standing objection target. A negative result is scoped to the enumerated channels in
      every citation.
  - id: HEUR-TC-2
    statement: >-
      The stopping event S as frozen is the right event to test - i.e. QM-STOPPING's FAIL is
      about S and not about a different event the frozen text also admits.
    rigorous_support: >-
      BATCH-018's control package is durable and its FAIL outcome is supported, so S is
      pinned by a committed artifact. But eight batches of retention without a named
      obstruction is itself weak evidence that the event may not be crisply pinned.
    validation_plan: >-
      Extract S verbatim from BATCH-018 and require the red team to confirm the extraction
      before the search runs. An ambiguous S is reported as a freeze defect under F3 rather
      than resolved by choosing a reading.
  target_complexity:
    time_exponent: >-
      Not an attack and no exponent. The search is a bounded finite-model enumeration whose
      cost is stated as an enumeration bound rather than an asymptotic.
    memory_exponent: n/a
    best_known: >-
      As an attack, nothing is claimed. As a disposition instrument, the incumbent is eight
      consecutive batches of retaining a FAIL without a named obstruction, which is the
      state the BATCH-039 red team objected to.
    hidden_overhead: n/a
    tradeoff_note: n/a
  dominated_by: >-
    Not applicable - no attack, no Pareto point, no cost claim. Written explicitly rather
    than left null.
  sota_delta: >-
    Zero on every cryptanalytic axis. The disposition delta is from a FAIL retained across
    eight batches with no named obstruction, to a batch whose design makes retention
    structurally unavailable and which emits either a named obstruction with a recheckable
    witness or a bounded construction target with its search space stated.
  instrument_failure_guards:
    decision_variable: >-
      The existence of an admissible trace-collision witness, and the planted-control
      detection fraction that licenses reading it.
    what_would_make_it_vary: >-
      THE PLANTED LOSSINESS, which is an externally imposed knob with a known magnitude and
      a monotone expected effect on detection - the lossier pi', the easier the collision.
      The lane's entire history of retained FAILs is a history of a decision variable whose
      response to any perturbation was never measured, and here the perturbation is the
      planting ladder.
    power_against: >-
      A stopping event that is not trace-measurable (the primary target), and a search
      harness that would report a false negative (the planted control).
    no_power_against: >-
      QUERY_MEMORY in any form. The real collimation sieve, as opposed to the FC0
      abstraction. CSIDH's quantum security. Any channel not in the enumerated four. Whether
      a richer FC0 abstraction would admit tau.
    demonstrated_movement: >-
      By the planting ladder across four channels and five plantings, and by reproducing
      BATCH-013's committed witnesses, which is a known-answer case internal to this lane.
    lessons_addressed: >-
      Addresses the BATCH-039 red-team fatigue finding directly and by its own terms.
      Addresses KN-FIND-029 (five false-green escapes across three repairs of one mutation
      control) and EV-GGM-002 (an executed module implementing no decision procedure) by
      making the positive control a hard blocker evaluated before the primary search rather
      than a companion reported alongside it.
  estimated_cost:
    implementation: medium
    compute: low
  compute_budget_note: >-
    A bounded finite-model enumeration plus five plantings. No curve, isogeny, or quantum
    compute, matching every batch in this lane. The cost is implementation of the collision
    predicate against the frozen interface; the enumeration bound is declared in advance and
    an exhausted budget is a reportable outcome with a number rather than a retention.
  recommended_priority: high
  dependencies:
  - >-
    The frozen FC0-EXT-PKG-SSI-001 interface, the BATCH-022 scaffold, and BATCH-013's
    committed finite-model witnesses must all remain unmodified. This record reads them and
    writes none of them.
  - >-
    Compatible with being run as item (2) of GOAL-SSI-001 BATCH-040's next_action, which
    already directs a QM-STOPPING obstruction analysis to the section 4 closure standard.
  - >-
    Explicitly INCOMPATIBLE with iterating the toy peak-byte width lane, which
    DEC-20260730-037 prohibits and this record does not touch.
