idea:
  id: IDEA-20260815-e05d09
  question_id: RQ-ECDLP-002
  added: '2026-08-15'
  title: >-
    THE PROGRAM CITES 7666 LITERATURE ENTRIES AND KN-OPEN-3f7a21 SAYS 7457
    CLAIM citation_verified WITHOUT SUPPORT: sample them and measure the
    actual verification rate
  class: measurement

  claim: >-
    KN-OPEN-3f7a21 records that the corpus cannot support its own
    citation_verified markings. Every ECC conclusion resting on a cited
    entry inherits that uncertainty. A random audit of a modest sample gives
    a measured verification rate and identifies which claim classes are
    worst, which is what any downstream reader needs to discount by.

  mechanism: >-
    Draw a random sample of entries marked citation_verified, attempt
    independent verification of each against its primary source, and report
    the verification rate with a confidence interval and a breakdown by
    claim class.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of KN-OPEN-3f7a21; grep 'citation_verified', 'recall-
      confident', 'not re-verified'.
    results: >-
      The open problem states the issue precisely and remains open; no
      record measures the actual rate on a sample.
    verdict: >-
      ADAPTATION. The problem is recorded by the program itself; the
      contribution is measuring the rate rather than continuing to note
      the risk.

  object_first_candidate:
    tracked_object: >-
      THE VERIFICATION RATE of citation_verified markings, as a measured
      proportion.
    lossiness: >-
      A single rate discards which claim classes fail, so the breakdown is
      reported alongside it.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while primary sources are reachable; entries whose sources
      cannot be reached are a separate reported category and not counted
      as failures.

  null_object_control: >-
    NULL 1 -- entries NOT marked citation_verified, sampled alongside, to
    see whether the marking carries any information at all. NULL 2 --
    entries whose sources are known-reachable, as a floor on the
    unreachable-source rate.

  discriminated_from:
    - >-
        KN-OPEN-3f7a21 itself, which poses the question; this record
        measures it on a sample.
    - >-
        The screen-power audit in this series, which measures instrument
        error rates rather than citation integrity.

  assumptions:
    - >-
        Primary sources are reachable for a usable fraction of the sample;
        unreachable ones are reported separately rather than scored either
        way.
    - >-
        Verification is decidable per entry, meaning the entry's claim is
        specific enough to check against its source.

  predictions:
    - metric: >-
        unmarked-entry comparison
      direction: different
      minimum_effect: >-
        If marked and unmarked entries verify at the same rate, the
        marking carries no information, which is the strongest possible
        finding here.
    - metric: >-
        verification rate among marked entries
      direction: different
      minimum_effect: >-
        The measurement, with interval and breakdown by claim class.
    - metric: >-
        proportion of entries whose claim is too vague to verify
      direction: different
      minimum_effect: >-
        Reported separately; a large share means the marking is not even
        well defined.

  minimal_test:
    design: >-
      A random sample of one hundred marked entries plus fifty unmarked,
      with source reachability recorded per entry.
    controls:
      - >-
          Unmarked-entry comparison sample.
      - >-
          Source-reachability recorded per entry, never conflated with
          failure.
      - >-
          Verification performed against primary sources only, not
          against other corpus entries.
    required_metrics:
      - >-
          Verification rate with interval, for marked and unmarked
          samples.
      - >-
          Breakdown by claim class.
      - >-
          Counts of unreachable-source and unverifiable-claim entries.

  falsification_conditions:
    - >-
        Marked and unmarked entries verify at the same rate. The marking
        is uninformative and every downstream use of it is unsupported.
    - >-
        Most sampled sources are unreachable. The audit cannot conclude
        and reports that, which is itself important.
    - >-
        The rate is high. The corpus's markings are better founded than
        KN-OPEN-3f7a21 fears, which would be reassuring and worth
        recording.
    - >-
        The rate is low. Every ECC conclusion citing marked entries needs
        a discount, and the breakdown says which classes most.

  confounders:
    - >-
        VERIFIER SUBJECTIVITY: what counts as verifying a claim varies, so
        the criterion must be fixed in writing before sampling begins.
    - >-
        SAMPLE REPRESENTATIVENESS: entries differ hugely in age and
        provenance, so stratification by claim class matters more than raw
        sample size.

  interpretation_limits:
    - >-
        Measures corpus integrity; establishes nothing mathematical.
    - >-
        Scoped to the sampled entries and the fixed verification
        criterion.
    - >-
        A low rate discounts conclusions; it does not show any specific
        conclusion is wrong.

  heuristic_assumptions:
    - id: HEUR-CITE-1
      statement: >-
        A random sample of citation_verified entries estimates the
        verification rate of the whole marked population.
      rigorous_support: >-
        Rigorous ingredient: simple random sampling gives an unbiased
        proportion estimate with a computable interval. THE GAP: the
        marked population is heterogeneous by age, area and ingesting
        agent, so an unstratified sample can be badly unrepresentative
        even while being formally unbiased.
      falsification_condition: >-
        A stratified re-sample giving a materially different rate from
        the unstratified one.
      validation_plan: >-
        SAMPLE: 100 marked entries, stratified by claim class and ingest
        date. COMPARISON: stratified against unstratified estimate. TAIL
        CHECK: the strata with the lowest rates, reported individually.
        TRANSFER: none beyond the marked population.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is manual verification per sampled entry,
      which is the dominant and irreducible effort.
    memory_exponent: >-
      Negligible.
    best_known: >-
      No incumbent measurement exists; KN-OPEN-3f7a21 states the problem
      without quantifying it.
    hidden_overhead: >-
      Verification is slow human work, so sample size is the binding
      constraint and determines the interval width.
    tradeoff_note: >-
      A larger sample narrows the interval and costs proportionate manual
      effort; stratification buys representativeness at the same size.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As cryptanalysis: nothing. As a corpus-
    integrity measurement: none exists here. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: a measured verification rate
    for the corpus's citation_verified markings with an interval and a per-
    class breakdown, plus a comparison against unmarked entries that tests
    whether the marking carries information at all.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.8 that a usable fraction of sources is reachable. 0.6 that the
    verification criterion can be fixed crisply enough for consistent
    judgements. 0.5 that marked and unmarked entries verify at similar
    rates, which would be the most consequential outcome for how this corpus
    is read.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
  source_refs:
    - RQ-ECDLP-002
    - KN-OPEN-3f7a21
    - KN-OPEN-019
    - KN-TECH-056
    - KN-TECH-080
    - docs/inventor-protocol.md
  id_allocation_provenance: >-
