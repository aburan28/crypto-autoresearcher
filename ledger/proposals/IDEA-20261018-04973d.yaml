idea:
  id: IDEA-20261018-04973d
  research_question: RQ-SEMBIN-fa2e3f
  title: "Regime ladder: W_4/L2 refutation vs rho = log2(columns / z-free solutions) at fixed m, n"
  class: control
  claim: >
    Chained S_3, t=m, V of dimension k. N=(m-2)n+mk, cols=sum_{i<=4}C(N,i), Z=exact z-free
    solution count (zfree_fast.py), rho=log2(cols/Z). At fixed m in {4,5} and fixed n, raising k so
    rho runs from about +3 to -3 drops the W_4 (and L2) refutation rate R on enumeration-certified
    UNSAT instances from >=0.8 to <0.8 at rho* in (-1.3,+1.1], pooled over m=4,5. R is a function
    of rho, not of k, n, m or SAT multiplicity mu separately. Rival: R fixed by m (u-degree need,
    pilot4 result 2) and k alone (H-SEMBIN-d895d9 C1). An m=3 anchor arm is an addition to the brief.
  mechanism: >
    W_4 of the z-free generators lies in I(S_0)_{<=4}, S_0 the z-free variety. Pilot4 phase 1:
    quotient dim 231 vs Z=236 (m4 n7), 412 vs 456 (m3 n9), near-interpolation. If cols >~ Z the
    closure can encode any function on S_0, so a last block with no common zero on S_0 plausibly
    gives 1 at degree 4 (H1,H2); if cols << Z it holds only local consequences. SAT side: the SOLV4
    deficit Delta_H=(cols-rank W_4)-HF_S(4) (IDEA-20260913-449d2b); for UNSAT, Delta_H=0 is refutation.
  novelty_status: unverified
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked: [KR-IC-889857, KR-IC-fbdb61, KR-IC-f5c584, KR-IC-1fcdbc, KR-IC-0d2021, KR-IC-f3da82]
    nearest:
      - {ref: KR-IC-889857, provenance: kb, relation: adjacent, delta: "Assumption 1 dispute; adds a controlled regime variable the Semaev tables (n<=21, m<=6) do not vary"}
      - {ref: KR-IC-fbdb61, provenance: kb, relation: adjacent, delta: "solving vs last fall degree; adds cols/Z as covariate of degree-4 success"}
      - {ref: KR-IC-1fcdbc, provenance: kb, relation: adjacent, delta: "small-n experiments only; adds a ladder crossing the regime boundary"}
      - {ref: KR-IC-f3da82, provenance: kb, relation: orthogonal, delta: "trace reuse; pilot4 phase 2 replays no trace"}
    searched: {corpus_grep: ["z-free|zfree|log2(cols: 0 hits in knowledge/, ledger/.index"], web: [], blocked: [no shell, no web]}
  citations:
    - {ref: KN-LIT-fa346d, provenance: internal, claim: "Assumption 1, d_F4<=4, tables n<=21 m<=6", verified_by: "RQ-SEMBIN-fa2e3f source_refs"}
    - {ref: H-SEMBIN-d895d9, provenance: internal, claim: "C1 solving degree a function of k; C4 fixed-k ladders at m=2,3 (EXP-SEMBIN-35bf67); uses SOLV4 identity dim R_4=M_{<=4}-s", verified_by: "read ledger/hypotheses file this session"}
    - {ref: analysis/ecdlp2m-iteration-20261009/leads-pilot4/README.md, provenance: internal, claim: "rho values, 231/236 and 412/456, m6 L2 1/5, m5 L1 0/10", verified_by: "read this session"}
  predictions:
    - {id: P1, metric: "R at rho>=+2, m=4,5", direction: higher, minimum_effect: "R>=0.8", sample_status: in_sample, note: "calibration only"}
    - {id: P2, metric: "R at rho<=-1, >=10 UNSAT/cell, >=2 (n,k) cells per m", direction: lower, minimum_effect: "<=5/10 refuted (P<=0.033 if R=0.8)", sample_status: out_of_sample}
    - {id: P3, metric: "logistic-fit rho*, pooled m=4,5", direction: different, minimum_effect: "95% CI overlaps (-1.3,+1.1]", sample_status: partially_in_sample}
    - {id: P4, metric: "|R(k)-R(k')| at matched N, rho gap >=3 bits", direction: higher, minimum_effect: ">=0.5, signed with rho", sample_status: out_of_sample}
    - {id: P5, metric: "Delta_H=0 rate on SAT vs R on UNSAT at overlapping rho", direction: different, minimum_effect: "|diff|<=0.2", sample_status: out_of_sample}
    - {id: P6, metric: "m=3 anchor R at rho in {-1.7,-3.9}", direction: higher, minimum_effect: ">=0.8 (rho* depends on m)", sample_status: partially_in_sample}
  minimal_test:
    design: >
      Step 0 (no solver): census over all 2^n targets (exact enumerator, C port of zfree_fast.py):
      Z, mu, UNSAT fraction f_U per (m,n,k); keep UNSAT rungs with f_U>=0.02, any rung for Delta_H.
      Step 1: matched-N triple m=4, N=34 (52,956 cols): (n,k)=(13,2),(11,3),(9,4). Step 2: 3x3 grid
      m=4, n in {9,11,13} x k in {2,3,4}; n=13 k=5 under L2. Step 3: m=5 n=9 k=2,3,4(L2), n=10;
      m=3 anchor n=15,19,21. Per cell 10 UNSAT + 3 SAT; W_4 and L2 are separate ladders. Stop a
      ladder after R<0.8 at two consecutive lower rho. Rung tables: notes file.
    required_metrics: [R with CP95, Delta_H, cols, Z, mu, f_U, rank W_4, g0, HF_S0(4), peak RSS, censored count]
    controls:
      - "SAT soundness: 0 SAT refuted; closure rows and messages vanish at >=16 solutions"
      - "support-matched null: same blocks/supports, random same-support generators, UNSAT by enumeration (C-null)"
      - "two independent eliminators (pair fixed by contract) agree on every verdict (C-aa-elim)"
      - "A/A: redrawn curve b and permuted variable order at identical (n,k) (C-aa-curve)"
    variable_ledger:
      independent: [{name: rho, via: "k at fixed (m,n); n at fixed (m,k); matched-N pairs"}]
      factors:
        - {name: arity_m, treatment: fixed}
        - {name: n_k, treatment: crossed, how: "grid; N, cols, Z, mu, f_U co-vary and are measured"}
        - {name: restriction_W4_vs_L2, treatment: fixed, how: "separate ladders, never compared"}
        - {name: V_construction, treatment: fixed, how: "polynomial basis; one random-V rung"}
        - {name: curve_b_targets, treatment: randomized, how: "frozen rule; UNSAT/SAT by enumeration"}
        - {name: eliminator_build, treatment: crossed, how: "two eliminators, sha256-bound"}
        - {name: memory_cap, treatment: fixed, how: "OOM/timeout = censored, not a failed refutation"}
        - {name: host_load, treatment: measured, how: "wall time only"}
      comparisons:
        - {id: C-ladder-k, differs_in: [k, N, Z, mu], design: confounded, reason: "raising k at fixed n moves N, Z, mu and the SAT target count together; R(rho) shape is an observation only"}
        - {id: C-grid, differs_in: [n, k], design: factorial, note: "rho as covariate; thin corners filled by Delta_H"}
        - {id: C-matchedN, differs_in: [k, n], design: factorial, note: "cols fixed; n,k tied at fixed N, run inside C-grid"}
        - {id: C-null, differs_in: [generator algebra], design: one_factor}
        - {id: C-aa-curve, differs_in: [curve, order], design: aa}
        - {id: C-aa-elim, differs_in: [eliminator], design: aa}
      crosses_map: false
    cost: "~120-200 closures, <=2 GB dense at cols<=124k (L2 beyond); order 1-3 CPU-days on 4-CPU/15 GB (estimate, unmeasured)"
  falsification_conditions:
    - "P2 fails: R>=0.8 (>=9/10) at rho<=-1.5 in >=2 cells at m=4 or 5 -> interpolation not necessary at m>=4"
    - "P3: R monotone but rho*<=-2.5, or non-monotone (R>=0.8 at rho<=-1, R<0.8 at rho>=+2) -> rho not the control variable"
    - "P4: |dR|<0.2 at matched N with >=3 bits rho gap -> n or mu controls R; H-SEMBIN-d895d9 k-reading favoured"
    - "P5: SAT Delta_H=0 stays ~1 while UNSAT R drops (or reverse) -> cross-over belongs to the refutation certificate, not closure capacity"
    - "any SAT refutation or eliminator disagreement voids the cell (instrument fault), not the hypothesis"
  confounders:
    - "k moves N, Z, mu and removes UNSAT targets at fixed n: not one-factor; separated only by C-grid and matched-N (n,k tied at fixed N)"
    - "UNSAT targets at high mu are atypical; Delta_H on SAT instances is the check"
    - "negative-rho UNSAT rungs at m=4 may need >125k cols (out of dense reach): impediment with recheck, not evidence"
  interpretation_limits:
    - "toy sizes (n<=21, m<=5), polynomial-basis V, chained S_3; nothing about n=131 beyond motivation (rho<-100 there)"
    - "not a test of Assumption 1 as stated (d_F4 excludes tail steps)"
  heuristic_assumptions:
    - id: H1
      statement: "HF_{S_0}(4) = min(cols, Z) - O(1) for the chained z-free variety S_0, uniformly over the ladder"
      rigorous_support: "binary random-matrix rank law: Z random 0/1 rows over cols columns have rank min(Z,cols)-O(1) w.h.p."
      validation_plan: "compute HF_{S_0}(4) by evaluation at enumerated S_0 (Z<=1e6, cols<=125k, M4RI) at every rung; compare with Z uniform random points in F_2^N (matched Z,N); report deficit distribution and worst rung"
    - id: H2
      statement: "g0=(cols-rank W_4^{z-free})-HF_{S_0}(4) is <=5% of HF_{S_0}(4) wherever rho>=0, and R>=0.8 iff g0 is small"
      rigorous_support: "W_4 is the smallest multiplication-closed space, contained in I(S_0)_{<=4}; g0=0 is degree-4 Groebner-completeness of the z-free part"
      validation_plan: "pilot4 phase 1 gives 231/236, 412/456; measure g0 at every rung, tabulate against R per cell, fit R~logistic(rho) and R~logistic(g0/HF)"
  target_complexity:
    time_exponent: "no exponent claim"
    memory_exponent: "no exponent claim"
    best_known: "generic rho 2^(n/2); Semaev 2015 2^(1.6986 sqrt(n ln n)) conditional on Assumption 1 (KR-IC-889857, disputed)"
    hidden_overhead: "measurement idea; per-closure cost is dense GF(2) elimination on cols=Theta(N^4/24) columns, O(cols^2) bits, O(cols^omega) time"
    tradeoff_note: "none; the output is whether toy refutation rates may be extrapolated, not an algorithm"
  estimated_cost: {implementation: medium, compute: medium}
  recommended_priority: medium
  proposal_note: >
    Supersedes nothing. Versus H-SEMBIN-d895d9 (fixed-k and fixed-n ladders at m=2,3, SOLV4 failure rate)
    and EXP-SEMBIN-d9767f/24ec56 (D_W at m in {3,4,5}, n<=15): here m>=4, n fixed, cols/Z is the
    controlled variable, and Delta_H is that hypothesis's SOLV4 deficit, not a new metric. Rung tables,
    rho bracket and power: IDEA-20261018-04973d.notes.md.
