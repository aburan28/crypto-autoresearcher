idea:
  id: IDEA-20260905-ee822d
  title: Divisibility forests that separate certificate blindness from dependence
  class: mechanism
  claim: Exact divisibility witnesses arranged as a finite forest can transform a residue-invisible generating set
    into another with the same rational span, allowing an independence certificate to succeed without mistaking
    a failed local quotient for mathematical dependence.
  mechanism: 'Finite reduction modulo ell annihilates ell-divisible points, so replacing an independent point P
    by ell P can erase every local image while preserving rank. Track this defect explicitly: each edge records
    an exact identity ell Q=sum a_i P_i+T, with T torsion and an invertible rational change-of-basis matrix on the
    free span. Leaves contain a new point list and a full-rank torsion-quotiented residue certificate. Verify all
    group identities and determinant nonvanishing; then transport independence back along the forest. The research
    question is whether a bounded divisibility depth commonly suffices in controlled constructions, and whether
    its certificate remains much smaller than a general saturation proof.'
  question_id: RQ-ECQ-e9b361
