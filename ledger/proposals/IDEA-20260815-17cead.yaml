idea:
  id: IDEA-20260815-17cead
  question_id: RQ-ENDO-001
  added: '2026-08-15'
  title: >-
    THE ENDO CAMPAIGN PARTITIONS ECDLP BY THE NON-GENERIC RESOURCE EACH
    SUBPROBLEM CONSUMES; TEST WHETHER THE PARTITION IS EXHAUSTIVE BY TRYING
    TO PLACE EVERY KNOWN METHOD IN EXACTLY ONE CELL
  class: control

  claim: >-
    GOAL-ENDO-001's organising move is a resource-labelled decomposition. A
    partition is only useful if every method lands in exactly one cell and
    no method lands outside. Attempting the placement for every known ECDLP
    method is a cheap test of the partition that must precede using it to
    allocate effort.

  mechanism: >-
    Enumerate known ECDLP methods. For each, identify the non-generic
    resource it consumes and attempt placement in exactly one cell. Report
    methods that fit no cell, fit several, or fit only by stretching a
    cell's definition.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of GOAL-ENDO-001's objective and transport theorem T1; grep
      'resource-labelled', 'partition', 'subproblem decomposition'.
    results: >-
      The partition is the campaign's organising structure; no record
      tests it by placing the full method inventory.
    verdict: >-
      ADAPTATION. Testing a taxonomy by placement is elementary; doing it
      for this campaign's own partition before allocating effort against
      it is what is missing.

  object_first_candidate:
    tracked_object: >-
      THE PLACEMENT of each known method into the resource partition.
    lossiness: >-
      Reducing a method to one consumed resource discards its other
      requirements, which is the partition's own simplification and is
      exactly what the test probes.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while the method inventory is enumerable from this corpus;
      methods outside it are the partition's blind spot and cannot be
      tested here.

  null_object_control: >-
    NULL 1 -- a generic method (rho) which by construction consumes no non-
    generic resource and must land in a designated generic cell or outside
    the partition entirely; either is informative but the partition must say
    which in advance. NULL 2 -- a deliberately hybrid method consuming two
    resources, which must be flagged as multi-cell rather than forced into
    one.

  discriminated_from:
    - >-
        The operation-indexed taxonomy record in this series, which
        indexes by operation; this one tests a partition indexed by
        consumed resource. The two axes are different and their
        relationship is worth reporting.
    - >-
        The transport-cost record in this series, which quantifies T1's
        cost term; this tests the partition T1 organises.

  assumptions:
    - >-
        The method inventory is enumerable from this corpus and the
        literature it cites.
    - >-
        Each cell's definition is precise enough that placement is
        decidable; cells requiring judgement are the finding rather than a
        nuisance.

  predictions:
    - metric: >-
        generic-method null
      direction: different
      minimum_effect: >-
        FORCED to a pre-declared outcome; if the partition has not said
        in advance where rho goes, that is itself a gap.
    - metric: >-
        hybrid-method null
      direction: different
      minimum_effect: >-
        FORCED flagged multi-cell, not forced into one.
    - metric: >-
        count of methods fitting no cell or several
      direction: different
      minimum_effect: >-
        The deliverable; a high count means the partition is not usable
        for effort allocation.

  minimal_test:
    design: >-
      Symbolic placement of the full inventory, both nulls, with each
      placement citing the cell definition it used.
    controls:
      - >-
          Generic-method null with pre-declared expected outcome.
      - >-
          Hybrid-method multi-cell null.
      - >-
          Every placement cites the cell definition it relied on.
      - >-
          Judgement-requiring placements flagged rather than resolved
          silently.
    required_metrics:
      - >-
          Placement per method with cited cell definition.
      - >-
          Counts of no-cell, multi-cell and judgement-requiring
          placements.
      - >-
          Both null outcomes.

  falsification_conditions:
    - >-
        A null behaves unexpectedly. The partition's boundaries are not as
        declared and must be restated.
    - >-
        Many methods fit no cell. The partition does not cover the method
        space and cannot allocate effort.
    - >-
        Many methods fit several cells. The partition is not a partition
        and its cells overlap.
    - >-
        Placement is clean. The partition is usable and this record
        confirms it cheaply before the campaign spends against it.

  confounders:
    - >-
        DEFINITION STRETCHING: placing a method by loosening a cell's
        definition makes the partition look exhaustive while destroying
        its meaning, which is why every placement must cite the definition
        used.
    - >-
        INVENTORY BIAS: an inventory drawn from this corpus inherits the
        corpus's blind spots, so a clean placement does not show the
        partition covers methods nobody here has recorded.

  interpretation_limits:
    - >-
        Tests a taxonomy; establishes nothing mathematical about the
        ECDLP.
    - >-
        Scoped to the enumerated method inventory, which is not claimed
        complete.
    - >-
        A clean placement supports using the partition for allocation; it
        does not validate any cell's research value.

  heuristic_assumptions:
    - id: HEUR-ENDO-PART-1
      statement: >-
        Every known ECDLP method consumes exactly one identifiable non-
        generic resource, so the campaign's partition is well defined on
        the method inventory.
      rigorous_support: >-
        Rigorous ingredient: transport theorem T1 establishes that
        difficulty is an isogeny-class invariant up to transport cost,
        which motivates labelling methods by the resource that leaves
        the generic model. THE GAP: methods routinely combine resources
        -- index calculus with an endomorphism-invariant factor base
        consumes both algebraic structure and endomorphisms -- so
        single-resource labelling may simply be false for the
        interesting hybrids.
      falsification_condition: >-
        A method consuming two non-generic resources essentially, not
        incidentally.
      validation_plan: >-
        SAMPLE: the full enumerated inventory, each placed with its
        cited definition. TAIL CHECK: the hybrid methods, reported
        individually since they are where the partition is most likely
        to fail. TRANSFER: none; the test binds the enumerated
        inventory.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Symbolic; no compute.
    memory_exponent: >-
      Negligible.
    best_known: >-
      No incumbent test of this partition exists; the campaign uses it as
      an organising structure without placement testing.
    hidden_overhead: >-
      Cell definitions may be precise in the goal record and vague in
      practice, and the citation requirement is what surfaces that.
    tradeoff_note: >-
      A precise partition places cleanly and may exclude real methods; a
      loose one places everything and organises nothing.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As cryptanalysis: nothing. As a partition
    test for this campaign: none exists. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: a placement of the full
    known-method inventory into the ENDO campaign's resource partition, with
    per-placement citations, and explicit counts of methods that fit no
    cell, several cells, or only by stretching a definition.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.85 that the inventory is enumerable. 0.5 that cell definitions are
    precise enough for decidable placement. 0.55 that hybrid methods break
    single-resource labelling, which would mean the partition needs multi-
    label cells before it can allocate effort.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
