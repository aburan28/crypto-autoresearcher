  heuristic_assumptions:
    - id: H1
      statement: >-
        For a uniformly random A in R_q^{k x l} with X^256+1 splitting completely over
        F_q, the rank of the top l-by-l block A-circle over F_q is distributed as the sum
        of n=256 independent copies of the rank of a uniform l-by-l matrix over F_q
        (one per CRT slot), so Pr[rank(A-circle)=r] is the degree-r coefficient of
        f(z)^n with f the single-slot rank generating function of Lemma 9.
      rigorous_support: >-
        Rigorous ingredient: the F_q-algebra isomorphism R_q^{l x l} ~= prod_{i<=n} F_q^{l x l}
        under complete splitting is rank-preserving (2023/246 Lemma 8), so the ranks add
        exactly and the slots are independent by construction; nothing here is heuristic.
        The classical statement imitated is the finite-field random-matrix corank law
        (Pr[corank>=i] ~ q^{-i^2}), which the single-slot p_r(1/q) reproduces. The only
        assumption is that A is uniform, which FIPS 204 KeyGen enforces via ExpandA from a
        uniform seed rho modelled as a random oracle.
      validation_plan: >-
        Recompute f(z)^n in exact rational arithmetic at the FIPS 204 (n, l, q) and compare
        the corank tails against 2023/246 Fig 11/12. TAIL CHECK: report the deepest corank
        the paper tabulates (e.g. corank 63 at NIST5) and confirm the recomputed tail mass
        matches the paper's delta at that cutoff, since it is the tail, not the mean, that
        sets delta and hence the loss. NULL: the n=1 evaluation must match the textbook
        single-matrix law. Sampled parameters recorded per category; no extrapolation --
        the computation is exact at the real parameters.
    - id: H2
      statement: >-
        The commitment min-entropy inequality H_min(HighBits(Ay)) >=
        n*l*lg((2*gamma1-1)/(2*gamma2+1)) - (n*l - rank(A-circle))*lg(q) is tight enough,
        at the FIPS 204 parameters, that eps = 2^{-H_min} and delta = Pr[rank(A-circle) too
        small] reproduce Fig 8's loss column to the paper's stated precision.
      rigorous_support: >-
        Rigorous ingredient: the inequality is a proved lower bound (2023/246 Appendix A,
        equation 21) combining a range term and a rank term; it is not heuristic. The
        heuristic is only that the FLOOR is close enough to the true min-entropy that the
        loss column is reproduced -- which the paper itself asserts by using exactly this
        bound to produce Fig 8. If the reproduction fails, the transcription or the
        arithmetic is wrong, not the bound.
      validation_plan: >-
        Substitute the recomputed (eps, delta) into L and L* and reproduce Fig 8 row by
        row. TAIL CHECK on the tightest row (NIST2 q_H=2^128, L*<=2^-58), which is the one
        the paper flags as debatable because the signing-query term dominates; confirm the
        recomputed L* there matches 2^-58 to the paper's precision. No extrapolation.
  target_complexity:
    time_exponent: >-
      No algorithm and no exponent. The deliverable is a CORRECTION QUANTIFIED: the
      additive CMA-to-NMA loss L, L* per parameter set, at most 2^-58 (quantum, level 2)
      and far smaller at levels 3 and 5, added to Adv^EF-NMA which cascades to
      Adv^MLWE + Adv^SelfTargetMSIS. This RAISES nothing and lowers nothing about the
      hard problems; it names the size of a reduction loss the program had recorded as
      not-derivable.
    memory_exponent: >-
      Negligible: the rank generating function is a degree-(n*l) polynomial in z with
      rational coefficients, evaluated in exact arithmetic; peak working set well under
      1 GB.
    best_known: >-
      The incumbent state in this program is EV-MLDSA-56e35b's GAP-1: "Tightness factor
      from KN-LIT-3907: not_derivable from abstract alone", and the goal held on the PDF
      blocker. The incumbent external state is the paper's own Fig 8, which this record
      reproduces and re-derives rather than competes with.
    hidden_overhead: >-
      Two disclosures. First, H_min is a FLOOR, so L, L* are UPPER bounds and the true
      loss may be smaller; this is stated wherever a number appears. Second, the argmin
      composition inherits H-MLDSA-12f563's uncalibrated block-size instrument, so the
      argmin rows are untiered where its gate G4 is unpassed and the loss/engine rows are
      reported separately.
    tradeoff_note: >-
      No time-memory tradeoff of this record's own. The relevant tradeoff is the loss's
      q_S-vs-q_H structure: the loss is dominated by the signing-query term q_S=2^64, so
      an evaluation at a smaller q_S shrinks it; the record reports the loss as a function
      of the (q_S, q_H) evaluation point rather than at one pinned point only.
