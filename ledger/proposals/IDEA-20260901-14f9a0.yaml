  id: IDEA-20260901-14f9a0
  question_id: RQ-MLDSA-001
  goal_id: GOAL-MLDSA-001
  added: '2026-09-01'
  proposed_by: idea-generator
  status: proposed
  title: >-
    The CMA-to-NMA tightness factor GOAL-MLDSA-001 has been HELD on is no longer
    gated: this session READ ePrint 2023/246 (KN-LIT-3907) in full and the
    corrected concrete loss is an EXPLICIT closed form, L and L*, dominated by
    q_S and by one load-bearing quantity -- the min-entropy alpha = H_min(HighBits(Ay))
    set by the rank of the top l-by-l block A-circle of the public matrix over F_q.
    Transcribe both, recompute the A-circle rank generating function from scratch as
    a BLIND re-derivation of Fig 11/12, cross-check against the concurrent
    independent fix ePrint 2023/245, and report whether applying the loss changes
    the argmin over {MLWE, MSIS, SelfTargetMSIS}. Predicted: it does NOT (the
    additive loss is at most 2^-58 quantum at level 2), which turns
    H-MLDSA-d1e509's `inconclusive` into a NUMBER rather than a shrug.
  class: measurement
  claim: >-
    (A) THE BLOCKER IS GONE, AND THIS IS THE POINT OF THE RECORD. GOAL-MLDSA-001's
    next_action holds the goal on a single precondition: "if and only if full-text
    access to ePrint 2023/246 becomes available, open this goal's next batch ... to
    extract the CMA-to-NMA tightness factor ... and carry H-MLDSA-d1e509 out of
    inconclusive." DEC-20260805-79d745 recorded HTTP 403 across four routes. THIS
    SESSION FETCHED AND READ THE FULL 40-PAGE PDF of ePrint 2023/246 (Barbosa,
    Barthe, Doczkal, Don, Fehr, Gregoire, Huang, Hulsing, Lee, Wu, "Fixing and
    Mechanizing the Security Proof of Fiat-Shamir with Aborts and Dilithium",
    CRYPTO 2023) via a rendered-PDF read, and transcribed its Theorems 2, 3, 4,
    Lemma 7, and the concrete-security table Fig 8 plus the min-entropy analysis of
    Appendix A. The tightness factor the goal was blocked on is therefore
    obtainable now, and this record is the un-gated lane the goal's own directive
    asks for.
    (B) THE CORRECTED BOUND, VERBATIM FROM THE SOURCE. The classical ROM loss
    (Theorem 3 / Fig 8) is
      L := 2*q_S*(q_H + q_S + 1)*eps/(1-p) + q_S*eps*(q_S+1)/(2*(1-p)^2) + delta,
    and the quantum QROM loss (Theorem 2/4) is
      L* := (2*q_S*sqrt(eps)/(1-p))*sqrt(q_H + 1 + q_S/(1-p))
             + 2*(q_H+1)*sqrt(q_S*eps/(1-p)) + delta,
    where p is the per-iteration abort-probability upper bound, eps is the guessing
    probability of the commitment HighBits(Ay) (i.e. eps = 2^(-alpha) with alpha its
    min-entropy), and delta bounds a bad-key event. Adv^EF-CMA(A) <= Adv^EF-NMA(B) +
    L (resp. L*), and Lemma 7 cascades EF-NMA to the two hard problems:
      Adv^EF-NMA_Dilithium(A) <= Adv^MLWE(B) + Adv^SelfTargetMSIS(C),
    with the SelfTargetMSIS bound zeta = max{gamma1 - beta, 2*gamma2 + 1 + tau*2^(d-1)}
    -- the SAME zeta this program derived independently in IDEA-20260805-591f9d and
    H-MLDSA-12f563, which is a joint corroboration of that decomposition against the
    primary text.
    (C) THE CONCRETE LOSS PER PARAMETER SET, TRANSCRIBED FROM Fig 8, and it is the
    quantity H-MLDSA-d1e509 named. With q_S = 2^64 in every row:
      NIST2 (ML-DSA-44): p <= 49/64; q_H=2^128 -> L <= 2^-206, L* <= 2^-58;
        q_H=2^64 -> L <= 2^-257, L* <= 2^-113.
      NIST3 (ML-DSA-65): p <= 103/128; q_H=2^192 -> L <= 2^-847, L* <= 2^-360.
      NIST5 (ML-DSA-87): p <= 759/1024; q_H=2^256 -> L <= 2^-1268, L* <= 2^-538.
    The paper's own take-away (Section 7, verbatim sense): "the full security of
    Dilithium is still determined by the hardness of solving MLWE and SelfTargetMSIS",
    because the additive loss is negligible against the target advantage and the
    signing-query term q_S dominates it.
    (D) THE ENGINE, WHICH IS THE TRACKED OBJECT AND THE PART NO CORPUS RECORD HAS.
    eps and delta are NOT free constants: they come from Appendix A's bound
      H_min(HighBits(Ay, 2*gamma2)) >= n*l*lg((2*gamma1-1)/(2*gamma2+1))
                                        - (n*l - rank(A-circle))*lg(q),
    where A-circle is the TOP l-by-l block of A in R_q^{k x l} and rank(A-circle) is
    its rank over F_q after the complete splitting X^256+1 = prod (X - alpha_i) mod q.
    The distribution of rank(A-circle) is computed exactly from a generating function
    f^n(z) with f(z) = sum_r p_r(1/q) z^r and p_r from the random-matrix-over-F_q
    difference-sequence law (Lemma 9): pi_l(q, d_1..d_l) = prod_j (d_j + (-1)^{d_j} q^{-(l - r_{j-1})}).
    Fig 11/12 report, e.g., NIST3: Pr[corank(A-circle) > 11] <= 2^-209, giving
    H_min >= 1028 and guessing prob eps <= 2^-1028; and the tail values
    H_min >= 402/218 (NIST2), 844/269 (NIST3), 1150/345 (NIST5) at successively
    looser corank cutoffs. THE CLAIM IS THAT THIS GENERATING FUNCTION AND ITS
    NIST-parameter EVALUATIONS ARE INDEPENDENTLY RECOMPUTABLE IN PURE PYTHON, and
    that a blind re-derivation reproduces Fig 11/12 to the paper's own precision --
    or, if it does not, localizes the disagreement to one named step.
    (E) THE CROSS-CHECK, WHICH IS THE DISCRIMINATOR. ePrint 2023/245 (Devevey,
    Fallahpour, Passelegue, Stehle, "A Detailed Analysis of Fiat-Shamir with Aborts",
    CRYPTO 2023, DFPS23) is the CONCURRENT INDEPENDENT fix of the same CMA-to-NMA gap;
    2023/246 Section "Concurrent Work" confirms both papers identify the same gap and
    both give corrected ROM and QROM reductions by DIFFERENT proof strategies (245
    uses one HVZK simulator for accepted and rejected transcripts; 246 adds a hybrid
    that removes the rejected-transcript reprogramming). Two independent derivations
    of one bound is a blind-re-derivation opportunity at the level of the LITERATURE:
    where 245's and 246's Dilithium loss agree, the tightness factor is corroborated;
    where they disagree, that disagreement is itself the finding H-MLDSA-d1e509 needs.
    (F) WHAT IS NOT CLAIMED. No attack, no forgery, no exponent moved, no new
    algorithm. The predicted argmin over {MLWE, MSIS, SelfTargetMSIS} is UNCHANGED by
    the corrected loss (the loss is negligible), so the deliverable is a defender-
    favourable calibration confirmation stated as a number per parameter set, plus a
    blind re-derivation of its engine and a two-paper cross-check. Under AGENTS.md
    rule 7 nothing here is evidence weakening any of the three problems.
  mechanism: >-
    STAGE 0, THE LITERATURE GATE, NOW PASSABLE. Re-fetch ePrint 2023/246 and 2023/245
    under a run record (the executing session must render the PDFs; this idea-generator
    session did render 2023/246 and read Fig 8, Theorems 2-4, Lemma 7, Appendix A
    Figs 10-13). Transcribe verbatim, with page references: the L and L* expressions,
    Lemma 7 and its zeta, the Fig 8 table, the Appendix A min-entropy inequality, the
    Lemma 9 difference-sequence law, and the Fig 10 NIST parameter table. Mark every
    symbol obtained-or-unobtained. If 2023/245's exact bound cannot be rendered, its
    row stays at abstract provenance and the cross-check is reported as partial.
    STAGE 1, BLIND RE-DERIVATION OF THE ENGINE. WITHOUT reading the paper's Sage code,
    reimplement in pure-Python exact rational arithmetic: (i) the per-column rank
    increment law p_r(1/q) from Lemma 9; (ii) the generating function f(z) and its
    n-th power f^n(z) whose degree-r coefficient is Pr[rank(A-circle) = r]; (iii) the
    tail Pr[rank(A-circle) < n*l - i] <= delta_i and the resulting H_min bound at each
    NIST parameter set. Compare the recomputed (delta_i, H_min) against the paper's
    Fig 11/12 rows. This is the load-bearing quantity's re-derivation from the
    statement of the quantity and the parameters alone, per the review architecture's
    blind_rederivation rule.
    STAGE 2, ASSEMBLE THE LOSS. Substitute the recomputed (eps, delta) and the paper's
    (p, q_S, q_H) into L and L* and reproduce Fig 8's loss column. A row that does not
    reproduce localizes the fault to the substitution or to Stage 1.
    STAGE 3, THE ARGMIN QUESTION. Compose the corrected EF-NMA loss with this program's
    own MLWE / MSIS / SelfTargetMSIS estimates (subject to H-MLDSA-12f563's calibration
    gate G4 -- if the block-size instrument is still uncalibrated, report the argmin
    ONLY under the arms that pass that gate, and say so). Report whether adding L or L*
    to Adv^EF-NMA changes which of the three problems is the cheapest published attack
    at any category. Predicted answer: no, because L*, worst case, is 2^-58 additive.
    STAGE 4, THE TWO-PAPER CROSS-CHECK. Where 2023/245 states a Dilithium loss,
    tabulate it beside 2023/246's and report agreement or the exact bit of divergence.
    STAGE 5, THE HAND-BACK. Write the single sentence H-MLDSA-d1e509 was specified to
    produce: "After applying the corrected CMA-to-NMA tightness factor of ePrint
    2023/246 (cross-checked against 2023/245), the concrete margin at ML-DSA-65 differs
    from the published target by at most [L* bits], i.e. the tightness loss is
    negligible and the binding assumption is [MLWE/MSIS/SelfTargetMSIS] unchanged."
