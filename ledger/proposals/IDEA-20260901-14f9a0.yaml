      observable: "The pair (H_min, additive loss) attached to a parameter set."
      distinct_preimage_search: >-
        Two distinct commitment distributions can share one H_min lower bound (the bound
        is a min-entropy floor, not the exact entropy), so a given (H_min, loss) row does
        not identify the distribution. This is disclosed: the record reports a FLOOR on
        alpha and a corresponding UPPER bound on the loss, never an exact value, exactly
        as the paper does.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The A-circle rank distribution as a generating-function power f^n(z), moving
          "what is the commitment min-entropy" into "what is the corank tail of a random
          block-diagonal matrix over F_q", where the answer is an exact rational.
        predicted_gain: >-
          Converts an unread proof artefact into a recomputable number per parameter set;
          diagnostic, no attack, no speedup.
      - transform: representation_reduction
        proposed_object: >-
          The two-paper cross-check as a redundancy: 245 and 246 are two encodings of one
          bound, so agreement is evidence about the bound and disagreement localizes to
          one of two named proofs.
        predicted_gain: >-
          A literature-level blind re-derivation that costs no compute and is the
          strongest available corroboration of the tightness factor short of a machine
          check (which 246 already provides in EasyCrypt for the ROM).
    quantifier_order: >-
      FOR EACH FIPS 204 category k, THERE EXISTS a computed (eps_k, delta_k) from the
      A-circle rank distribution and hence a computed (L_k, L*_k), and the claim is about
      the DIFFERENCE argmin_{after loss} minus argmin_{before loss} over {MLWE, MSIS,
