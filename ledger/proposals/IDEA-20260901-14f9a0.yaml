        The n=1 no-ring commitment, where the rank term collapses and H_min is set purely
        by the range term; the loss there must NOT reproduce the NIST rows, confirming the
        ring structure (complete splitting of X^256+1) is load-bearing in the min-entropy
        rather than an artefact of the arithmetic.
    proof_obligations:
      - claim: "The recomputed A-circle rank distribution reproduces the textbook corank law at n=1."
        responsibility: baseline
      - claim: "The recomputed (delta_i, H_min) reproduce 2023/246 Fig 11/12 to stated precision."
