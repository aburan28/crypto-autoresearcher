idea:
  id: IDEA-20260807-fd5a24
  question_id: RQ-CANL-63098f
  added: '2026-08-07'
  title: >-
    THE NORM-FORM GAP OF THE CM ORDER: on the Serre-Tate canonical lift the
    Mordell-Weil group is an O-module, which halves the number of points that
    must be lifted, but every element of O outside Z has norm at least |D_E|/4
    and therefore multiplies canonical height by at least |D_E|/4 ~ p, so the
    O-module structure contributes ZERO new lattice vectors inside the
    Xedni height budget and leaves the Jacobson-Koblitz-Silverman-Stein-Teske
    instance count at Theta(N)
  class: mechanism

  claim: >-
    (A) THE QUANTITY THAT MUST MOVE. RQ-CANL-63098f is decided by a single
    number: the per-instance success probability of a Xedni-style lift, which
    the program's own audit record ECFG-P1543-R1
    (ledger/FINDING-PF-IC-001.md) reconstructs as "the Xedni C_0/p theorem
    ... under Lang, its discriminant-height comparison, and fixed arity
    2 <= r <= 9". Unpacked: with r+1 points lifted onto a global curve of
    Mordell-Weil rank r, the r+1 lifted points are AUTOMATICALLY Z-dependent
    (r+1 vectors in a rank-r lattice); the attack fails because the dependence
    that exists is forced to have coefficients bounded by an absolute constant
    C_0, so only (2C_0+1)^{r+1} distinct residues k are reachable out of N, and
    the expected number of independent instances is
        I_Z(r) = N / (2C_0+1)^{r+1} = N^{1-o(1)}.
    A proposal that does not move I, or the canonical heights that produce
    C_0, or the rank r, is closed on arrival (RQ-CANL-63098f decision_target).
    This proposal computes exactly what CM does to I.

    (B) WHAT CM GIVES, EXACTLY. Serre-Tate: an ordinary E/F_p with
    O := End_{F_p}(E) has a canonical lift Ẽ with End(Ẽ) = O. Over the ring
    class field H of O, the group Ẽ(H) is an O-MODULE, not merely a Z-module.
    Write disc(O) = D_E = D_0 f_E^2 (D = t^2-4p = D_0 f^2, f_E | f). If
    Ẽ(H)/tors is a projective O-module of rank r_O then its Z-rank is
    r_Z = 2 r_O. Consequently m points of Ẽ(H) are O-DEPENDENT as soon as
    m >= r_O + 1 = r_Z/2 + 1, where Z-dependence needs m >= r_Z + 1.
    FIRST EXACT NUMBER: CM halves the number of points that must be
    simultaneously lifted, from r_Z + 1 to r_Z/2 + 1. That is a real
    reduction, it is the arithmetic the brief demands, and it is the ONLY
    thing CM reduces.

    (C) WHAT CM DOES NOT GIVE, AND WHY, WITH THE PROOF. The height budget is
    unchanged, by an elementary and complete argument.
      LEMMA 1 (norm-form gap; elementary, proved in `mechanism` below). Let O
      be the imaginary quadratic order of discriminant D_E < 0. Every
      alpha in O \ Z satisfies N(alpha) >= |D_E|/4.
      LEMMA 2 (height scaling; standard). For alpha in End(Ẽ),
      hhat(alpha P) = deg(alpha) hhat(P) = N(alpha) hhat(P).
    Together: the O-module generated by a point P̃ is, as a Z-lattice, spanned
    by P̃ and omega P̃ with hhat(omega P̃) >= (|D_E|/4) hhat(P̃). For a curve at
    the bottom of its volcano, |D_E| = |D| = 4p - t^2, so the companion
    direction is longer by a factor >= p - t^2/4. THE O-MODULE STRUCTURE
    INFLATES THE Z-RANK WITHOUT PLACING A SINGLE NEW VECTOR INSIDE ANY BALL OF
    RADIUS o(sqrt(p)) TIMES THE LATTICE MINIMUM.

    (D) THE CONSEQUENCE FOR THE COEFFICIENT SET, WHICH IS THE DECIDING STEP.
    A relation sum_i alpha_i P̃_i = O is usable only if it lies in the height
    window that forces C_0, i.e. only if N(alpha_i) <= C_0^2 for each i (the
    Z-case bound |a_i| <= C_0 is exactly N(a_i) = a_i^2 <= C_0^2). By Lemma 1,
        if |D_E| > 4 C_0^2  then  {alpha in O : N(alpha) <= C_0^2}
                                  = {a in Z : |a| <= C_0},
    of size exactly 2C_0+1 -- IDENTICAL to the Z-coefficient set. So in the
    generic regime CM contributes NO new reachable coefficient. The reachable-k
    count becomes (2C_0+1)^{r_O+1} = (2C_0+1)^{r_Z/2+1}, which is SMALLER than
    the Z-case (2C_0+1)^{r_Z+1}, and
        I_O(r_Z) = N / (2C_0+1)^{r_Z/2+1}
                 = I_Z(r_Z) * (2C_0+1)^{r_Z/2}.
    SECOND EXACT NUMBER: in the generic regime CM makes the instance count
    WORSE by the factor (2C_0+1)^{r_Z/2}, while making each instance cheaper
    by lifting half as many points. Both are constants at fixed arity; the
    exponent of N is 1 in both cases and rho's is 1/2.

    (E) THE ANSWER TO RQ-CANL-63098f IN ONE LINE. CM changes the number of
    points needed (exactly a factor 2) and changes the reachable-k constant
    (exactly (2C_0+1)^{-r_Z/2} in the generic regime, and a gain instead of a
    loss when |D_E| = O(C_0^2) -- that regime is IDEA-20260807-11b93d). It
    does not change a single canonical height, because height scales by the
    norm and the norm form of O has no small values off Z. The Xedni failure
    quantity survives CM intact.

  resource_label: >-
    R6 (lift to characteristic zero / Z_p) and R3 (End(E) as a ring: the norm
    form of O and the module structure of Ẽ(H)).
  admissibility: admissible
  admissibility_argument: >-
    The admissibility filter (DECOMPOSITION.md section 2, H-ENDO-001,
    KN-FIND-b7e091) closes lanes whose only use of phi is to apply it to points
    of G, because End(G) = Z/N makes every endomorphism a scalar there. This
    proposal never applies an endomorphism to a point of G. It uses (i) the
    NORM FORM of O as a quadratic form on a rank-2 Z-lattice, which is ring
    data invisible to G, and (ii) the canonical height on a curve in
    characteristic zero, which is not a group-oracle output at all. The
    scalar-collapse of H-ENDO-001 in fact APPEARS in this proposal, but only
    on the far side of reduction: the O-relation reduces to a Z/N relation with
    computable coefficients lambda(alpha_i), where lambda: O -> Z/N is the ring
    map with lambda(pi) = 1 (Frobenius acts as the identity on the F_p-rational
    subgroup G). That the reduced relation is scalar is what makes it USABLE,
    not what makes it vacuous; vacuity would require lambda to be independent
    of alpha, which it is not.

  discriminated_from:
    - >-
      RQ-XEDN-001 / H-XEDN-001 / H-XEDN-fe3446 / GOAL-ICLIFT-001 and the whole
      EXP-XEDN-001..007 lineage: those study the FUNCTION-FIELD xedni
      representation (elliptic surfaces over F_p(t), Shioda height, E_8
      Mordell-Weil lattices, section-density exponent alpha = 3, KN-FIND-008,
      KN-FIND-003). This proposal is over a NUMBER FIELD, on a curve with
      complex multiplication, and its quantity is the norm form of an
      imaginary quadratic order. No surface, no section, no Shioda pairing, no
      degree shape appears here.
    - >-
      H-ICLIFT-4d4384 / EXP-ICLIFT-290f2e: measures the over-dispersion factor
      g_eff of section counts on a fixed isotrivial function-field family. A
      second factorial moment of a section-count histogram. Different object,
      different field, different quantity.
    - >-
      RQ-ICEX-001 / GOAL-ICEX-001 (EV-ICEX-001, EV-ICEX-2be32e, EV-ICEX-82d77c,
      H-ICEX-4ccbaa/9e54c2/a2e95b): those are the charged toy INDEX-CALCULUS
      exponent line -- relation collection, factor bases, full cost accounting.
      No lift, no height, no number field. Disjoint.
    - >-
      ECFG-P1543-R0/R1 in ledger/FINDING-PF-IC-001.md: the torsion-or-defect
      dichotomy for point lifts. That record already establishes that the
      scalar-compatible lift of G is the finite-etale Teichmuller section
      (torsion, height zero) and that any non-torsion section carries a formal
      defect. THIS PROPOSAL DOES NOT CONTRADICT OR DUPLICATE IT: P1543 says
      what happens to POINTS under lifting; this says what the CM ring does to
      the LATTICE the lifted points live in, which P1543 never computes. The
      two compose: P1543 forbids a canonical point lift, this one shows that
      even if a non-canonical one is granted for free, CM buys no height.
    - >-
      KN-TECH-018 (automorphism-discounted rho): a constant sqrt(|Aut|) <=
      sqrt(6) discount on the rho baseline. That is the CONTROL this proposal
      is charged against, not a thing it extends.

  object_first_candidate:
    tracked_object: >-
      THE NORM FORM of the CM order, restricted to the Mordell-Weil lattice of
      the canonical lift: the map alpha |-> N(alpha) on O, transported by
      hhat(alpha P̃) = N(alpha) hhat(P̃) into the successive minima of the
      Z-lattice Ẽ(H)/tors. The object followed through the computation is the
      pair (Z-rank, height spectrum) of the O-submodule generated by the
      lifted points.
    lossiness: >-
      GENUINELY LOSSY, and the lossy-projection test is passed algebraically,
      before any compute. From the full state (Ẽ, H, the points, their
      coordinates in a number field of degree 2h(D_E)) the object retains only
      a positive definite binary quadratic form's minima. It DISCARDS: the
      j-invariant, the field H and its Galois action, every coordinate, the
      torsion subgroup, the L-function, and the identity of the points. What
      makes the discard COMPATIBLE with the operations is Lemma 2: the group
      law and the O-action move heights by a rule (hhat(P+Q) + hhat(P-Q) =
      2hhat(P) + 2hhat(Q); hhat(alpha P) = N(alpha) hhat(P)) that depends only
      on the retained data. So the retained part propagates deterministically
      under exactly the operations the attack uses. It is not a change of
      coordinates: two canonical lifts with the same (rank, height spectrum)
      and different j are indistinguishable to the object, and such pairs
      exist inside a single Galois orbit of roots of H_{D_E}.
    propagation: >-
      One step = one application of the group law or of an element of O.
      Under the group law the object propagates by the parallelogram law;
      under alpha in O it propagates by multiplication of the height by
      N(alpha) and by an index-N(alpha) inclusion of lattices. Both are
      closed-form, so one-step propagation is defined and measurable, which is
      the testability axis of docs/inventor-protocol.md section 2.
    survival_score: >-
      SURVIVES: change of j inside the Galois orbit; change of model; twisting
      (heights change by O(1) via the twist discriminant); isogeny within the
      crater. DIES: at reduction mod p, where all heights become meaningless
      and H-ENDO-001's scalar collapse takes over. That death point is exactly
      the boundary of the lane, and naming it is the point of the object.

  mechanism: >-
    STEP 1 -- PROOF OF LEMMA 1 (elementary, complete, zero compute).
    Let O have discriminant D_E < 0, so O = Z[w] with w = (D_E + sqrt(D_E))/2
    and w^2 - D_E w + (D_E^2 - D_E)/4 = 0. Take alpha = a + b w with
    a, b in Z and b != 0. Then
        alpha = (a + b D_E/2) + (b/2) sqrt(D_E),
        N(alpha) = (a + b D_E/2)^2 + (b^2/4)|D_E| >= (b^2/4)|D_E| >= |D_E|/4.
    Equality is attained iff |b| = 1 and a = -b D_E/2 (possible only for D_E
    even). QED. The bound is sharp and needs no hypothesis.

    STEP 2 -- INSTANTIATE AT CRYPTO-RELEVANT PARAMETERS. For an ordinary
    E/F_p at the bottom of its volcano, O = Z[pi] and D_E = t^2 - 4p, so
    |D_E| = 4p - t^2 and the gap is (4p - t^2)/4. Since |t| <= 2 sqrt(p),
    |D_E| ranges over (0, 4p]. Under the semicircle law for the trace, the
    fraction of ordinary curves with |t| <= sqrt(p), hence |D_E| >= 3p, is
        (1/(2 pi p)) * int_{-sqrt p}^{sqrt p} sqrt(4p - t^2) dt = 0.609...
    (elementary substitution t = 2 sqrt(p) sin θ; computed here, not cited).
    So for a clear majority of curves the companion direction is longer by a
    factor >= 3p/4. THE GENERIC CASE IS THE MAXIMALLY BAD CASE.

    STEP 3 -- THE COEFFICIENT-SET IDENTITY (part D of the claim), made
    checkable. Fix C_0. The predicate "N(alpha) <= C_0^2 and alpha not in Z"
    is, by Lemma 1, unsatisfiable whenever |D_E| > 4 C_0^2. At |D_E| ~ 4p this
    holds for every C_0 = o(sqrt p). JKSST's C_0 is an ABSOLUTE constant at
    fixed arity, so the condition holds for all p beyond a constant. Hence
    the O-coefficient set equals the Z-coefficient set exactly.

    STEP 4 -- THE REDUCED RELATION IS USABLE, AND ITS COEFFICIENTS ARE
    COMPUTABLE. Let lambda: O -> Z/N be reduction of the O-action on
    G = <P> subset E(F_p). Frobenius pi acts as the identity on the
    F_p-rational points, so lambda(pi) = 1; writing pi = (t + f sqrt(D_0))/2
    determines lambda(sqrt(D_0)) = (2 - t)/f mod N and hence lambda on all of
    O by Z-linearity. So an O-relation sum alpha_i P̃_i = O reduces to
    sum lambda(alpha_i) [k_i] P = O with EXPLICIT integers lambda(alpha_i) mod
    N. This step is included because it is the step at which one could wrongly
    conclude the whole lane is vacuous by H-ENDO-001; it is not, and the
    computation shows why.

    STEP 5 -- THE BOOKKEEPING, per-attempt-cost times inverse-success.
    Per attempt: construct the global CM curve and lift r_O+1 points
    (cost: see reachability_gate); success probability
    (2C_0+1)^{r_O+1}/N. Expected total
        T = [cost(lift of r_Z/2 + 1 points)] * N / (2C_0+1)^{r_Z/2+1}.
    Against rho at 0.886 sqrt(N) (KN-TECH-001, KN-TECH-006), T/T_rho =
    Theta(sqrt(N)) for any constant arity. Stated as an exponent: 1 versus
    1/2, unchanged by CM.

    STEP 6 -- WHAT WOULD FALSIFY THE WHOLE ARGUMENT. Exactly one thing: a
    curve in the family with |D_E| <= 4 C_0^2. That is not a hypothetical --
    it is the crater of a small-fundamental-discriminant class, it includes
    j = 0 and j = 1728, and secp256k1 lives there. That regime is carved out
    and analysed separately in IDEA-20260807-11b93d, and this record's claim
    is explicitly restricted to |D_E| > 4 C_0^2.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Run 2026-08-07 in this repository. (1) Grep -ril for "Xedni|xedni" across
      the tree; (2) grep for "canonical lift|Serre-Tate"; (3) grep for
      "Hilbert class polynomial|CM lift" in ledger/; (4) glob **/*ICLIFT* and
      **/*ICEX*; (5) grep "Silverman|Jacobson|Koblitz|Teske|Stein" in
      knowledge/; (6) read KN-LIT-020, KN-LIT-021, KN-FIND-008, KN-TECH-018,
      KN-OPEN-019, RQ-XEDN-001, H-XEDN-001, H-XEDN-fe3446, H-ICLIFT-4d4384,
      GOAL-ICLIFT-001, RQ-ICEX-001, and ledger/FINDING-PF-IC-001.md lines
      2016-2106 (ECFG-P1543-R0/R1).
    results: >-
      "Xedni" appears in 60+ files, all in the function-field surface lineage
      (RQ-XEDN-001/002, EXP-XEDN-001..007, GOAL-ICLIFT-001, GOAL-XEDN-001..003)
      or in bulk idea catalogues. "Serre-Tate" appears in RQ-CANL-63098f
      (this lane's own question), DECOMPOSITION.md, KN-LIT-331 (Buium, p-jets),
      and one REJECTED idea file
      (ideas/rejected/ECDLP-IDEA-109_serre_tate_torsion_section_jet_coordinate_hypothesis.md).
      "Hilbert class polynomial" appears in exactly two ledger records:
      RQ-CANL-63098f and DEC-20260806-160175. THE PHRASE "norm form" APPLIED
      TO A CM ORDER IN A LIFTING CONTEXT, AND THE INEQUALITY N(alpha) >=
      |D|/4 AS A HEIGHT-BUDGET OBSTRUCTION, APPEAR NOWHERE.
    verdict: >-
      ADAPTATION. Lemma 1 and Lemma 2 are elementary and textbook; nothing
      about them is claimed as new. What is new to this program is the
      composition: using the norm-form minimum of End(canonical lift) as the
      quantitative answer to "does CM change the Xedni failure quantity". No
      external-literature novelty is claimed; a Stage-0 literature check for
      an existing CM-Xedni analysis is part of the design and a hit would be
      an ingredient, not a defeat.

  null_object_control: >-
    MANDATORY AND BLOCKING. MATCHED NULL: a non-CM elliptic curve E'/Q of the
    same Mordell-Weil rank and minimal discriminant magnitude within a factor
    2 of the CM lift's, with a RANDOM order-2 (or order-3) Z-linear
    automorphism of its Mordell-Weil lattice substituted for the genuine
    O-action -- i.e. an object of exactly the same shape (a rank-2r lattice
    with a rank-2 module structure) whose module structure is arithmetically
    empty. The measured quantity in both arms is the ratio
    (second successive minimum)/(first successive minimum) of the rank-2
    sublattice generated by P̃ and its companion.
    DECAY PARAMETER: |D_E|. The predicted CM value of that ratio is
    >= sqrt(|D_E|)/2 and MUST GROW like sqrt(|D_E|); the null's value must
    stay O(1). A CM ratio that FAILS TO GROW with |D_E| is the canonical
    artifact tell (docs/inventor-protocol.md, controls before belief) and
    means the implementation is not computing N(alpha) or hhat correctly.
    POSITIVE CONTROL: |D_E| in {3, 4, 7, 8, 11}, where the ratio must be
    O(1) -- the instrument must SEE the small-discriminant escape, or it
    cannot report a negative anywhere.

  assumptions:
    - >-
      Serre-Tate/Deuring: an ordinary E/F_p has a canonical lift Ẽ with
      End(Ẽ) = End_{F_p}(E) = O, defined over the ring class field of O.
      STANDARD; recalled, not re-derived here. If false the lane has no object.
    - >-
      hhat(alpha P) = deg(alpha) hhat(P) for alpha in End. STANDARD (functorial
      quadraticity of the canonical height under isogeny). Recalled; a toy-scale
      numerical check is stage 1 of the minimal test.
    - >-
      Ẽ(H)/tors is a PROJECTIVE O-module, so its Z-rank is exactly 2 r_O. This
      is automatic when O is maximal (Dedekind). FOR NON-MAXIMAL O IT IS NOT
      AUTOMATIC and the module can fail to be projective; the record therefore
      states r_Z = 2 r_O only for f_E = 1 and otherwise states the weaker
      r_Z = 2 r_O only after checking O-torsion-freeness. FLAGGED [open].
    - >-
      The JKSST coefficient bound C_0 and the O(1/N) per-instance rate are
      relayed from KN-LIT-021 (abstract only; full paper NOT read) and from
      the internal reconstruction at ECFG-P1543-R1, which states the theorem
      holds "under Lang, its discriminant-height comparison, and fixed arity
      2 <= r <= 9". Growing or correlated bases are OUTSIDE that scoped
      theorem and this proposal does not extend it to them.

  proof_search_map:
    bottleneck: >-
      The single step whose removal changes the conclusion is Lemma 1 composed
      with Lemma 2: "an O-coefficient outside Z multiplies canonical height by
      at least |D_E|/4". Remove either half and the O-module structure could
      in principle contribute short vectors, and the answer to
      RQ-CANL-63098f flips from "CM does not move the quantity" to "CM might".
      Everything else in the proposal is bookkeeping around that composite.
    baseline_embedding:
      parameter_slice: >-
        The exact baseline to reproduce before any CM claim is made: the
        Z-case reachable-k count on a NON-CM curve. Concretely, take a curve
        E'/Q of rank 2 with known generators from a public table, choose
        r+1 = 3 points, compute the (unique up to scale) dependence, and check
        that its coefficients are bounded and that the reduced relation mod a
        small p recovers the expected residue. This is the Xedni step with
        CM removed, and it must work before the CM arm is trusted.
      reproduction_check: >-
        Frozen fixture, exact integers: a named curve, named generators, the
        exact dependence vector, and the exact reduced relation modulo a
        named p. Any mismatch is an instrument failure under AGENTS.md rule 5
        and blocks every arm.
    observation_collision:
      observable: >-
        The pair (r_Z, height spectrum of the O-submodule generated by the
        lifted points).
      distinct_preimage_search: >-
        REQUIRED, AND IT SUCCEEDS BY CONSTRUCTION, which is the honest
        limitation of the object. Two canonical lifts whose j-invariants are
        distinct Galois conjugates (roots of the same H_{D_E}) have EQUAL rank
        and EQUAL height spectrum over H, because Galois conjugation is an
        isometry of the Mordell-Weil lattice. So the observable does not
        separate the h(D_E) curves in one crater. THIS IS NOT A DEFECT OF THE
        MEASUREMENT, IT IS THE RESULT: it says the whole crater has one answer,
        so the T5 reachability gate (DECOMPOSITION.md section 3) has nothing to
        reach -- there is no "good" curve in the class to walk to. A collision
        that DID separate conjugates would falsify the isometry claim and would
        be the surprising outcome.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace "the Z-rank of Ẽ(H)" by the pair (r_O, minima of the norm
          form). The rank alone is what Xedni tracked and it is exactly the
          quantity CM inflates misleadingly (r_Z = 2 r_O looks like progress);
          the pair carries the information that half those directions are
          longer by sqrt(|D_E|).
        predicted_gain: >-
          None to any attacker. The gain is that a quantity which LOOKS like a
          factor-2 improvement is exposed as a factor-2 improvement in point
          count paired with a (2C_0+1)^{r_Z/2} loss in reachable residues.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable "r_Z = 2r_O" fixed and vary the forgotten
          structure: |D_E|. The intrinsic invariant separating the fibres is
          the norm-form minimum off Z, which is |D_E|/4. Sweeping |D_E| from 3
          to 4p with r_Z fixed is simultaneously the counterexample
          construction and the experiment's positive control.
        predicted_gain: >-
          Identifies |D_E| = O(C_0^2) as the only regime where the conclusion
          can fail, which is what makes IDEA-20260807-11b93d a necessary
          companion rather than an optional one.
    quantifier_order: >-
      THE CLAIM, with explicit quantifiers: THERE EXISTS an absolute constant
      C_0 (the JKSST constant at fixed arity) such that FOR ALL ordinary
      E/F_p with |disc End_{F_p}(E)| > 4 C_0^2, FOR ALL canonical lifts Ẽ, and
      FOR ALL alpha in O \ Z, hhat(alpha P̃) >= (|D_E|/4) hhat(P̃) -- hence the
      O-coefficient set inside the height window is Z-only.
      THE TRAP BEING HUNTED is a witness allowed to depend on the curve: a
      statement of the form "for each curve there is SOME alpha with small
      norm" would be true and useless (alpha = 1). The strength here is that
      the bound |D_E|/4 is uniform over O and independent of the point, which
      is what makes it a height-budget statement rather than an existence
      statement.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "for canonical lifts with |disc End| > 4C_0^2, the O-module
        structure adds no lattice vector below height (|D_E|/4) hhat_min, so
        the reachable-k count is (2C_0+1)^{r_Z/2+1} and the instance count is
        N^{1-o(1)}." It CANNOT certify anything about |D_E| = O(1) curves,
        about non-canonical lifts (Xedni's own global curves have no CM),
        about growing or correlated coefficient families (explicitly outside
        the ECFG-P1543-R1 scoped theorem), or about any lift construction that
        is not height-bounded. It is NOT a lower bound on ECDLP.
      nearby_object_control: >-
        The closest object where the conclusion FAILS is the small-|D_E|
        crater curve (D_0 in {-3,-4,-7,-8,-11}, f_E = 1): there
        N(alpha) >= |D_E|/4 is a vacuous bound, the O-coefficient set is
        genuinely larger than Z, and the conclusion is false. A method that
        returned "no gain" on BOTH the generic curve and the D_0 = -3 curve
        would not have identified the load-bearing structure and no negative
        could be reported from it. That control is cheap: j = 0 curves exist
        over F_p for every p = 1 mod 3.
    proof_obligations:
      - claim: "alpha in O \\ Z implies N(alpha) >= |D_E|/4."
        responsibility: correctness
      - claim: hhat(alpha P) = N(alpha) hhat(P) for alpha in End.
        responsibility: baseline
      - claim: "r_Z = 2 r_O for projective O-modules; flagged open for f_E > 1."
        responsibility: correctness
      - claim: "{alpha in O : N(alpha) <= C_0^2} = {a in Z : |a| <= C_0} when |D_E| > 4C_0^2."
        responsibility: correctness
      - claim: lambda(pi) = 1 and lambda is computable, so the reduced relation is usable.
        responsibility: interface
      - claim: "I_O = N/(2C_0+1)^{r_Z/2+1}, exponent 1, versus rho's 1/2."
        responsibility: runtime
      - claim: The result is scoped to |D_E| > 4C_0^2 and asserts nothing at crypto scale.
        responsibility: scope

  predictions:
    - metric: >-
        ratio_of_minima := lambda_2/lambda_1 of the rank-2 Z-lattice generated
        by P̃ and w P̃ on a toy CM curve over a number field, measured as
        sqrt(hhat(w P̃)/hhat(P̃))
      direction: higher
      minimum_effect: >-
        FORCED VALUE, derived pre-run: >= sqrt(|D_E|)/2, i.e. >= 0.86 at
        |D_E| = 3 and >= 5 at |D_E| = 100. Must track sqrt(|D_E|) with slope
        0.5 in log-log across at least 5 values of |D_E|. A measured slope
        whose interval excludes 0.5 falsifies the composition of Lemma 1 and
        Lemma 2 as implemented.
    - metric: >-
        |{alpha in O : N(alpha) <= C_0^2, alpha not in Z}| for C_0 in
        {1,2,3,5,10} and |D_E| swept over the discriminants of toy curves
      direction: lower
      minimum_effect: >-
        FORCED VALUE: exactly 0 whenever |D_E| > 4C_0^2, and > 0 otherwise.
        This is a pure integer computation with no statistics; a single
        counterexample refutes Lemma 1 and ends the proposal.
    - metric: >-
        reachable_k_count: the number of distinct residues k mod N obtainable
        from O-relations with N(alpha_i) <= C_0^2 among r_O+1 lifted points,
        counted exactly at toy p
      direction: lower
      minimum_effect: >-
        Predicted exactly (2C_0+1)^{r_O+1} in the generic regime, versus
        (2C_0+1)^{r_Z+1} for the Z-case at the same Z-rank. The RATIO must be
        (2C_0+1)^{-r_Z/2}, i.e. CM must LOSE. A measured ratio above 1 in the
        generic regime falsifies part (D).
    - metric: >-
        instance_count_exponent: log(I)/log(N) fitted across toy N
      direction: different
      minimum_effect: >-
        Predicted 1 - o(1), and specifically an interval that EXCLUDES 1/2. If
        the fitted exponent's interval includes 1/2 at toy scale that is
        almost certainly a small-N artifact and the null of
        IDEA-20260807-761a8c is invoked before anything is reported.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): verify Lemma 1 symbolically for
      D_E in a swept range by exhaustive integer search over (a,b) with
      |a|,|b| <= 50; verify the equality case. If any alpha with b != 0 has
      N(alpha) < |D_E|/4, the proposal ends here. Pure Python, seconds.
      STAGE 1 (hours): implement the canonical height on a curve over Q via
      the standard local-height decomposition (mpmath), and verify
      hhat(alpha P) = N(alpha) hhat(P) numerically on the CM curves
      y^2 = x^3 + k (alpha = zeta_3, N = 1) and y^2 = x^3 + a x
      (alpha = i, N = 1), and on multiplication-by-m (N = m^2) for m <= 5, to
      12 significant digits. A failure here is an instrument failure.
      STAGE 2 (hours): sweep |D_E| over the discriminants realisable at toy
      scale, compute the ratio of minima, fit the slope against sqrt(|D_E|).
      STAGE 3 (hours): exact integer count of {alpha : N(alpha) <= C_0^2}
      across the sweep, and the reachable_k_count comparison against the
      Z-case at matched Z-rank.
      STAGE 4 (zero compute): compose with the ECFG-P1543-R1 lifting
      dichotomy and record the instance-count exponent.
    controls:
      - >-
        Matched non-CM curve with a synthetic order-2/order-3 lattice
        automorphism (the null object); the ratio of minima must stay O(1).
      - >-
        Small-|D_E| positive control (D_0 in {-3,-4,-7,-8,-11}): the
        instrument must SEE the escape, i.e. return ratio O(1) and a
        non-empty off-Z coefficient set.
      - >-
        Multiplication-by-m as a known-answer height check (N(m) = m^2).
      - >-
        Frozen non-CM Xedni baseline fixture (proof_search_map).
    required_metrics:
      - "N(alpha) minima off Z, exact integers, per |D_E|"
      - "hhat(w P̃)/hhat(P̃) with numerical precision reported"
      - "|{alpha in O : N(alpha) <= C_0^2}| per (C_0, |D_E|), exact"
      - reachable_k_count for CM and matched Z arms
      - null-arm values for every metric above
      - wall-clock and precision settings for the height computation

  falsification_conditions:
    - >-
      Stage 0 finds alpha in O \ Z with N(alpha) < |D_E|/4. Lemma 1 is false as
      stated, the whole argument collapses, and the record is superseded.
    - >-
      Stage 1 finds hhat(alpha P) != N(alpha) hhat(P) beyond numerical
      tolerance on a known-answer case. Instrument failure; nothing reported.
    - >-
      The ratio of minima does not track sqrt(|D_E|) with slope 0.5. Either
      the height implementation or Lemma 2 is wrong.
    - >-
      The reachable_k_count ratio exceeds 1 in the generic regime. Part (D) is
      wrong and CM would then genuinely enlarge the reachable set -- the one
      outcome that would REOPEN this lane, and it is pre-registered as such.
    - >-
      The null arm reproduces the CM ratio's growth. The measurement is a
      lattice-shape artifact and no CM-specific statement may be made.
    - >-
      The small-|D_E| positive control fails to show the escape. The
      instrument cannot see the effect it is meant to bound; no negative may
      be reported from any arm (AGENTS.md rule 5).

  confounders:
    - >-
      Numerical precision in hhat. The local-height series converges slowly
      near bad reduction; a precision artifact can masquerade as a height
      ratio. Fixed by the multiplication-by-m known-answer control.
    - >-
      Non-maximal orders. For f_E > 1, Ẽ(H) need not be a projective
      O-module and r_Z = 2 r_O can fail. Every measurement is stratified by
      f_E and the f_E > 1 cells are reported separately, never pooled.
    - >-
      Twist ambiguity. The canonical lift is determined up to twist by the
      requirement that it reduce to E; different twists have different ranks
      and different discriminants. Every number must name its twist.
    - >-
      C_0 is not measured here. It is imported from KN-LIT-021 via
      ECFG-P1543-R1 and is an absolute constant only at FIXED ARITY. Any
      statement about growing arity is outside scope and must not be made.

  interpretation_limits:
    - >-
      Toy scale. Heights and ranks are computed on small curves over Q and
      small imaginary quadratic fields; nothing here is a crypto-scale
      validation and no deployed curve is touched.
    - >-
      This is NOT a lower bound on ECDLP, and NOT a closure of lifting. It
      closes one specific hope -- that the O-module structure of the canonical
      lift supplies short vectors -- with a named obstruction (the norm-form
      gap) and an explicit escape regime.
    - >-
      The argument grants the attacker a free non-canonical point lift, which
      ECFG-P1543-R1 shows does not exist as a homomorphism. So the negative is
      strictly stronger than needed, and the positive branch (reachable_k ratio
      above 1) would still have to clear the P1543 dichotomy before meaning
      anything.
    - >-
      "CM halves the number of points" is a statement about DEPENDENCE, not
      about lifting probability. Whether half as many points are easier to lift
      is a separate question owned by IDEA-20260807-6533fd.

  heuristic_assumptions:
    - id: HEUR-CANL-N1
      statement: >-
        FOR ALL ordinary E/F_p in the toy sweep, the Mordell-Weil lattice of
        the canonical lift over H, restricted to the O-submodule generated by
        a single non-torsion point, has successive minima
        (hhat(P̃), N(w) hhat(P̃)) up to a factor bounded by the unit index --
        i.e. the O-orbit structure is the whole story and no accidental short
        vector arises from interaction with other generators.
      rigorous_support: >-
        Lemma 1 and Lemma 2 are rigorous and give the LOWER bound
        N(alpha) >= |D_E|/4 unconditionally. The heuristic is only that no
        OTHER generator of the full Mordell-Weil lattice happens to sit close
        to w P̃ and shorten the second minimum. This imitates the standard
        expectation that Mordell-Weil lattices of curves of small rank are
        "generic" in the sense of having no unexpected sublattice coincidences
        -- the same expectation that underlies Lang's height conjecture, which
        (per Hindry-Silverman, Inventiones 93 (1988) 419-450) is a THEOREM for
        curves with integral j-invariant, hence for every CM curve. THAT
        CITATION IS RELAYED FROM A WEB SEARCH ABSTRACT, NOT READ, and its
        verification is Stage 0's second item.
      validation_plan: >-
        Sample: all toy canonical lifts realisable at p <= 2^20 with
        h(D_E) <= 4, plus the j = 0 and j = 1728 families over a ladder of p.
        Scale: at least 30 (curve, point) pairs per |D_E| decade. Predicted
        distribution: the ratio lambda_2/lambda_1 concentrates at
        sqrt(N(w)) = sqrt(|D_E|)/2 + O(1) with a right tail from the
        unit index. Tail check: report the 5 smallest observed ratios per
        decade and confirm none falls below the Lemma 1 floor. TOY SCALE ONLY
        AND LABELLED AS SUCH; this validates nothing at cryptographic scale.
    - id: HEUR-CANL-N2
      statement: >-
        The JKSST constant C_0 satisfies C_0 = O(1) uniformly over the toy
        family at fixed arity r <= 9, so the condition |D_E| > 4C_0^2 holds
        for all but O(1) of the swept curves.
      rigorous_support: >-
        None offered as a theorem. ECFG-P1543-R1 reconstructs the C_0/p
        result only "under Lang, its discriminant-height comparison, and fixed
        arity 2 <= r <= 9". Lang's bound is unconditional for integral-j
        curves (HEUR-CANL-N1's citation), which is exactly the CM case, so on
        the CANONICAL LIFT the conditionality is expected to lift -- that is
        the one place CM strictly improves the ANALYSIS rather than the
        attack, and it is worth recording as such.
      validation_plan: >-
        Measure C_0 empirically as max |a_i| over dependences found among
        low-height points on toy CM lifts, against |D_E|. Compare with the
        matched non-CM null. Report the observed maximum and its growth; a C_0
        growing with p would invalidate the "absolute constant" premise and
        must be reported prominently rather than absorbed.

  target_complexity:
    time_exponent: >-
      NO SPEEDUP IS CLAIMED. The mechanism's own cost, if it worked, would be
      N^{1-o(1)} lift attempts (exponent 1 in N), versus rho's N^{1/2}. CM
      changes the constant only: instance count N/(2C_0+1)^{r_Z/2+1} against
      the Z-case N/(2C_0+1)^{r_Z+1}. The DELTA in the exponent of N is
      EXACTLY ZERO, and that is the proposal's finding.
    memory_exponent: >-
      O(1) group elements for the attack side; the measurement side is
      dominated by the number-field arithmetic for the height computation,
      which is polylog in p at toy scale and is bookkeeping only.
    best_known: >-
      Parallel Pollard rho with distinguished points, 0.886 sqrt(N) group
      operations and O(1) memory (KN-TECH-001, KN-TECH-006); the
      automorphism-discounted variant on CM curves, a constant <= sqrt(6)
      better (KN-TECH-018); BSGS at sqrt(N) time and sqrt(N) memory.
    hidden_overhead: >-
      Two superpolynomial costs hide behind "lift". (i) The canonical lift
      itself costs |D_E|^{1+o(1)} = p^{1+o(1)} via the Hilbert class
      polynomial except when h(D_E) = O(1) -- quantified in
      IDEA-20260807-ee6ef7 and NOT charged in the exponent above. (ii) The
      coordinate bit-size of a liftable point is Theta(N^{2/r}) -- quantified
      in IDEA-20260807-6533fd. Either alone dominates rho. The exponent 1
      stated above is therefore an OPTIMISTIC lower bound on the mechanism's
      cost, not an estimate of it.
    tradeoff_note: >-
      No time-memory tradeoff exists here because there is no algorithm. For
      the record's completeness: the lift-attempt loop is embarrassingly
      parallel with linear speedup and O(1) memory per worker, which is the
      same parallelisation position as rho and therefore confers no advantage.

  dominated_by: >-
    CHECKED ACROSS EVERY ROW OF THE PRIME-FIELD FRONTIER, on time, memory and
    data/queries. As an attack this mechanism mounts none, and even granting
    every optimistic assumption it needs N^{1-o(1)} instances: it is dominated
    by parallel Pollard rho with distinguished points (0.886 sqrt(N) time,
    O(1) memory, KN-TECH-001/KN-TECH-006) on TIME by a factor N^{1/2-o(1)} and
    tied on memory; by the automorphism-discounted rho on CM curves
    (KN-TECH-018) by the same factor times sqrt(|Aut|); and by BSGS (sqrt(N)
    time, sqrt(N) memory) on time, while beating BSGS on memory -- which is
    not a Pareto improvement because rho already dominates BSGS on both.
    Against the program's index-calculus rows it mounts no relation collection
    and is not comparable; it is dominated there too, on the only shared axis
    (total time to one discrete log). dominated_by is therefore NOT null.
  sota_delta: >-
    Zero speedup against any attack baseline, stated quantitatively: attack
    time exponent 1 versus 0.5, i.e. a factor N^{1/2} SLOWER, before charging
    the p^{1+o(1)} lift-construction cost and the N^{2/r} coordinate size.
    The delta this proposal actually delivers is an ANALYTIC one, and it is
    also stated as numbers: it changes the count of points that must be
    simultaneously lifted from r_Z+1 to r_Z/2+1 (factor exactly 2), the
    reachable-residue count from (2C_0+1)^{r_Z+1} to (2C_0+1)^{r_Z/2+1}
    (factor exactly (2C_0+1)^{-r_Z/2}), and the number of new lattice vectors
    inside the height budget from 0 to 0.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.95 that Lemma 1 verifies at Stage 0 -- it is proved above in three lines
