idea:
  id: IDEA-20260816-5dd256
  question_id: RQ-FNDSA-001
  added: '2026-08-16'
  title: 'Distinguishing is not recovering: run the observation-collision audit on the map from secret
    basis to defective output law, because if that map factors through the Gram-Schmidt norm profile
    then the whole distributional channel identifies at most a profile and never a key, and the ceiling
    is provable at zero compute with a toy-scale witness.'
  class: theory
  claim: '(A) The research question''s decision target chains three steps: a distributional deviation
    exists, enough signatures make it detectable, and detection yields the trapdoor. The third step
    is an identifiability claim and it is separable from the first two. (B) In the exact-arithmetic
    Klein family the output law is determined by the lattice, the width, and the ordered Gram-Schmidt
    frame of the basis used by the sampler; the defect derived in this corpus enters only through
    the per-leaf widths sigma_i = sigma over the norm of the i-th Gram-Schmidt vector and through
    the leaf centers, both of which are functions of that frame. (C) The claim to audit is therefore:
    does the map from secret basis to output law FACTOR through some strictly coarser invariant than
    the basis itself, for instance the multiset of Gram-Schmidt norms, or the frame up to a signed
    permutation, or the frame up to an orthogonal transformation fixing the lattice? If it does, then
    no distinguisher of any power, using any number of signatures, recovers more than that invariant
    through this channel, and the gap between the invariant and the key is a hard ceiling that no
    improvement in statistics can cross. (D) The audit is CONSTRUCTIVE and cheap: exhibit two distinct
    secret bases of the same lattice whose output laws are identical, verified by exact enumeration
    at toy dimension, which is an observation collision in the exact sense of inventor-protocol section
    8 audit 2. (E) WHAT IS NOT CLAIMED: not that recovery is impossible, since the invariant may in
    fact determine the key for the specific key distribution in use, and that is a separate question
    this record explicitly leaves open and names as the successor; not that any existing record is
    wrong; no attack; and nothing about deployed parameters or any specification. (F) A collision
    found is a measured ceiling. A collision provably absent, meaning the map is injective on the
    tested family, is equally useful and stronger, because it would license the third step of the
    chain that the corpus currently takes for granted.'
  mechanism: 'STAGE ONE writes the output law of the exact-arithmetic sampler symbolically as a function
    of the ordered Gram-Schmidt frame, following the identity already recorded in this corpus, and
    identifies which features of the basis appear: the frame directions, the frame norms, and the
    order. STAGE TWO enumerates the transformations of a basis that leave every one of those features
    fixed while changing the basis itself. Two candidates are immediate: signed permutation of the
    Gram-Schmidt order combined with the corresponding basis change, and unimodular transformations
    that preserve the frame up to the ambiguity in the Gram-Schmidt process. STAGE THREE tests each
    candidate at toy dimension by constructing an explicit pair, enumerating both output laws exactly,
    and checking equality entry by entry in rational arithmetic. A verified equality is the collision;
    an inequality falsifies that candidate and the audit moves to the next. STAGE FOUR, if a collision
    is found, characterizes the fiber: how many distinct bases share one law, and whether the members
    of a fiber are equally plausible under a Gaussian key distribution, since a collision between
    a plausible key and an implausible one is a weaker ceiling than one between two plausible keys.
    STAGE FIVE writes the quantifier-order statement required by section 8 audit 3: whether the collision
    holds for all lattices or only for the constructed ones, and whether the witness depends on the
    parameter in a way a uniform conclusion would forbid.'
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-FNDSA-001 in full, in particular its decision target and its methods list requiring
      any claimed recovery to carry a certificate. Read H-FNDSA-6a9cbb in full, including the residual
      paragraph stating that its statistic is not attacker-computable and naming the successor question.
      Read docs/inventor-protocol.md sections 1 through 5 and 8, in particular audit 2 on observation
      collision and audit 3 on quantifier order. Extracted all twelve RQ-FNDSA-001 proposal titles.
      Ran grep -ril for identifiab, recovery, collision and fiber over ledger/proposals/.
    results: H-FNDSA-6a9cbb states explicitly that its optimal statistic requires the secret Gram-Schmidt
      frame and is therefore not attacker-computable, and names as its successor the question of whether
      a public-data statistic captures a constant fraction of the divergence. That is a COMPUTABILITY
      question. The identifiability question, whether the channel determines the key even given unlimited
      statistical power, is adjacent and distinct, and no record in the twelve asks it. IDEA-20260808-e7ba81
      observes that the perturbation's eigenvectors are the secret Gram-Schmidt directions and reports
      an eigenvector overlap, which presumes identifiability rather than testing it. RQ-FNDSA-001's
      own methods require a certificate for any claimed recovery, which is the enforcement mechanism
      this audit would inform.
    verdict: 'UNVERIFIED. No claim about outside literature; observation-collision and identifiability
      arguments are standard and the inventor protocol in this repository prescribes them by name.
      What is claimed new HERE is the target: applying section 8 audit 2 to the specific map from
      secret basis to defective sampler output law in this lane, and pairing the symbolic argument
      with an exact enumerated witness at toy dimension so the collision is verified rather than asserted.
      The output-law identity is assembled entirely from IDEA-20260805-2bbfb2 and H-FNDSA-6a9cbb;
      the enumeration instrument is assembled from the first entry of this batch; the identifiability
      framing is the part no record contains.'
  object_first_candidate:
    tracked_object: 'The FIBER of the map from secret basis to exact-arithmetic output law: the set
      of distinct bases of one lattice that produce identical output distributions. Followed as the
      basis is transformed by candidate symmetries, with the law held fixed. Not the law, not the
      basis, not the divergence: the equivalence class the channel cannot see inside.'
    lossiness: The projection discards the basis and keeps only the law it induces, which is lossy
      exactly to the extent the fiber is nontrivial; measuring how lossy is the entire content of
      the record. The retained part propagates because every operation available to a transcript-only
      adversary is a function of the law alone, by definition of the adversary model, so anything
      discarded by this projection is unavailable to any distinguisher no matter how powerful. If
      the fiber turns out to be trivial then nothing is discarded, the projection is a change of coordinates
      rather than a new object, and the record says so plainly and reports the injectivity as the
      finding.
    propagation: One step of the target operation is one candidate symmetry applied to the basis.
      Acting on the tracked object, a symmetry either maps the basis to another point of the same
      fiber, leaving the law fixed, or leaves the fiber, changing the law. The audit is therefore
      a search over a group of candidate transformations for those in the stabilizer of the law, and
      the fiber is the stabilizer's orbit. Composition of two stabilizing transformations stabilizes,
      so the fiber carries group structure and its size can be counted rather than sampled.
    survival_score: 'The object survives at every dimension in the symbolic argument, since the factoring
      question is dimension-free; it survives as a VERIFIED witness only where the law can be enumerated
      exactly, which is d at most 8 by the first entry''s measured ceiling. So the honest score is:
      symbolic conclusion dimension-free but unverified, verified conclusion at d in 2 to 8. That
      gap is stated as the record''s principal weakness rather than papered over, and it is why the
      deliverable pairs a symbolic argument with a small verified witness rather than claiming either
      alone.'
  null_object_control: The null object is a pair of bases known to induce DIFFERENT laws, constructed
    by perturbing one Gram-Schmidt norm by a known amount, run through the IDENTICAL enumeration and
    equality check. The null must return a detected inequality, with the magnitude of the difference
    matching the injected perturbation; if the equality check reports equality on a pair known to
    differ, the check has insufficient resolution and every collision it reports is an artifact of
    that resolution rather than a genuine coincidence. A second null applies a transformation that
    trivially preserves the law, namely the identity, and must return equality, confirming the check
    is not simply always reporting difference.
  discriminated_from:
  - 'H-FNDSA-6a9cbb''s residual asks whether a PUBLIC statistic captures a constant fraction of the
    divergence, which is a computability question about the adversary. This asks whether the law determines
    the key at all, which is an information question and is upstream of computability: a channel that
    does not identify cannot be exploited by any statistic, public or not.'
  - IDEA-20260808-e7ba81 reports a top-eigenvector overlap with the secret Gram-Schmidt direction,
    which presumes the direction is identifiable from the law. This tests that presumption and would
    qualify that overlap if a collision exists.
  - IDEA-20260805-2bbfb2 derives the defect's closed form. This consumes that derivation and asks
    what its functional dependence on the basis implies about identifiability, which the derivation
    does not address.
  - The enumeration entry in this batch measures a distance between two laws under different precisions.
    This checks equality of two laws under different BASES at the same precision, which is the same
    instrument pointed at a different comparison.
  - Generic statements that hash-and-sign signatures are trapdoor-independent. Those concern the ideal
    law, which is trapdoor-independent by construction; the whole point here is that the DEFECTIVE
    law is not, and the question is how much of the trapdoor it carries.
  assumptions:
  - The exact-arithmetic output law is fully determined by the lattice, the width, and the ordered
    Gram-Schmidt frame, which follows from the randomized-nearest-plane identity already recorded
    in this corpus and is restated rather than rederived.
  - The exact enumeration instrument from the first entry of this batch is available and validated,
    since the witness verification depends entirely on it.
  - Candidate symmetries are drawn from an enumerated list rather than searched exhaustively, so a
    failure to find a collision is a failure over that list and never a proof of injectivity; the
    record states this limitation as binding.
  - Toy lattices are constructed in-run and are not claimed to be FN-DSA keys or to have a realistic
    key distribution.
  - Finite-precision effects are outside this audit entirely, which is confined to exact arithmetic;
    a precision-induced defect could break a collision that holds exactly, and that possibility is
    named and not tested.
  predictions:
  - metric: existence of a verified collision pair at d = 4 under the signed-permutation candidate
    direction: different
    minimum_effect: 'no pre-committed value. Refusal reason: this is a yes-or-no structural fact about
      the map, not a quantity, and pre-committing an answer would convert a genuine audit into a confirmation
      exercise.'
  - metric: exact total variation between the two laws of a verified collision pair
    direction: lower
    minimum_effect: exactly 0 in rational arithmetic, since a collision must be exact equality and
      not approximate agreement
  - metric: exact total variation in the null arm, bases with one perturbed Gram-Schmidt norm
    direction: higher
    minimum_effect: strictly greater than zero and monotone in the injected perturbation size
  - metric: fiber size at d = 4, counted as distinct bases sharing one law within the enumerated candidate
      group
    direction: higher
    minimum_effect: at least 2 if any collision exists; the count itself is the deliverable and no
      value is pre-committed
  minimal_test:
    design: 'The cheapest discriminating measurement is symbolic and costs nothing: write the output
      law as a function of the frame and inspect which basis features it uses. If the law depends
      on the ordered frame including directions, no permutation collision can exist and that candidate
      closes before any compute. If it depends only on the norm multiset, the collision is immediate.
      That inspection takes an afternoon and settles the leading candidate. Only the residual candidates,
      those the symbolic pass cannot resolve, need the enumeration witness, and each costs one d =
      2 or d = 4 enumeration pair, which is seconds. The two null arms run in the same invocation.
      This ordering is the point: an identifiability audit that starts with compute has already wasted
      its cheapest and strongest move, and inventor-protocol section 8 prescribes exactly this order
      by making the four audits pre-compute falsification checks.'
    controls:
    - 'Known-different null: two bases with one Gram-Schmidt norm perturbed by a known amount, must
      be reported as unequal with a difference monotone in the perturbation.'
    - 'Identity control: a basis compared against itself, must be reported equal, confirming the check
      is not degenerate.'
    - 'Enumeration-instrument reuse: the equality check must run on the validated enumerator from
      the first entry of this batch, with its own nulls having passed, rather than on a fresh implementation.'
    - 'Key-plausibility control: for any collision found, evaluate both members'' likelihood under
      the toy key distribution, since a collision between a plausible and an implausible basis is
      a weaker ceiling.'
    - 'Dimension replication: verify any collision at both d = 2 and d = 4, since a coincidence at
      the smallest dimension is not a structure.'
    required_metrics:
    - exact total variation between candidate collision pairs, in rational arithmetic
    - count of distinct bases in each verified fiber within the enumerated candidate group
    - list of candidate symmetries tested, with symbolic verdict and enumerated verdict for each
    - likelihood ratio of the two members of any collision pair under the toy key distribution
    - exact total variation in the known-different null, per perturbation size
  falsification_conditions:
  - The known-different null is reported equal, meaning the equality check lacks resolution and every
    reported collision is an artifact.
  - The identity control is reported unequal, meaning the check is degenerate.
  - A symbolically predicted collision fails the enumerated check, falsifying the symbolic factoring
    argument for that candidate.
  - A collision verified at d = 2 fails at d = 4, meaning the coincidence is dimension-specific and
    not a structure.
  - The enumeration instrument's own nulls fail, in which case no witness verification is possible
    and the audit reduces to its symbolic half.
  - Every enumerated candidate symmetry is refuted, in which case the record must report that no collision
    was found OVER THE ENUMERATED LIST and must not report injectivity, since the list is not exhaustive.
  confounders:
  - Mistaking the ideal law's trapdoor-independence for the defective law's, which would make every
    basis appear to collide for a reason that has nothing to do with the defect.
  - An enumeration truncation that hides a difference in the tail, reporting a collision that is only
    an agreement on the truncated support.
  - A candidate symmetry that changes the lattice rather than only the basis, which is not a collision
    at all but a comparison of two different objects.
  - Confusing equality of laws with equality of a summary statistic, which is why the check must compare
    full pmf vectors entry by entry.
  - Restricting to a candidate list and then reading a null result as injectivity, which is the single
    most likely misreporting of this audit and is named as a falsification condition rather than left
    to judgment.
  interpretation_limits:
  - A collision establishes a ceiling on what the channel identifies; it does not establish that recovery
    is impossible, because the invariant may still determine the key under the actual key distribution,
    and that question is named as the open successor rather than answered.
  - A failure to find a collision over an enumerated candidate list is not injectivity and must never
    be reported as one.
  - The audit is confined to exact arithmetic; a finite-precision defect could break an exact collision,
    and that possibility is untested here.
  - Verified witnesses exist only at d in 2 to 8; the symbolic argument is dimension-free but unverified
    above that, and the two must be reported separately.
  target_complexity:
    time_exponent: No attack exponent is claimed, and this record's outcome would if anything constrain
      what any attack exponent could mean. Instrument cost is dominated by the enumeration, which
      is exponential in the toy dimension and confined to d at most 8; the symbolic half costs nothing.
    memory_exponent: No attack memory exponent is claimed. Instrument memory is that of the enumeration
      instrument, linear in the enumerated support size.
    best_known: Inside this repository the incumbent position is H-FNDSA-6a9cbb's residual, which
      identifies computability as the open gap and leaves identifiability unexamined, and IDEA-20260808-e7ba81's
      eigenvector overlap, which presumes identifiability. No claim is made about anything outside
      this repository.
    hidden_overhead: 'The hidden cost is entirely in the enumeration of candidate symmetries, which
      is a mathematical task with no natural stopping point: the list is never provably complete,
      so the audit''s negative result is always weaker than its positive one, and the temptation to
      report an incomplete search as injectivity is the failure mode. The compute cost is negligible
      and therefore misleading about the difficulty.'
  dominated_by: 'n/a (no result claimed that any attack could dominate). Pareto check across instrument
    axes: the symbolic half is free on every axis and is dominated by nothing; the witness half reuses
    the enumeration instrument and inherits its cost profile exactly, so it neither dominates nor
    is dominated by the first entry of this batch, being the same instrument pointed at a different
    comparison. Against H-FNDSA-6a9cbb''s derivation, this is comparably cheap and answers a question
    that derivation does not pose. No attack frontier is engaged.'
  sota_delta: 'No attack; conceptual contribution only. The quantitative delta, if a collision is
    found, is a ceiling expressed as a fiber size: the channel would identify a key only up to a set
    of that size, so any recovery claim through this channel would carry a residual ambiguity of exactly
    that many candidates and would need an independent test to resolve it. If no collision is found
    over the candidate list, the delta is zero and the deliverable is a documented list of transformations
    that do not collide.'
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Separate parts. That the symbolic pass cleanly settles the signed-permutation
    candidate one way or the other: about 0.8, since it is an inspection of an identity already written
    down in this corpus. That some collision exists within the enumerated candidate group: about 0.35,
    genuinely uncertain and the reason to run it. That any collision found is between two bases of
    comparable likelihood under a realistic key distribution, which is what makes a ceiling bite:
    about 0.4 conditional on a collision existing. That the audit changes how the lane phrases its
    recovery language: about 0.55 either way, because a documented non-collision list is also usable.'
