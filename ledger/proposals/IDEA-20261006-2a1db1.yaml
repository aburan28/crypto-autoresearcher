        provenance: internal
        relation: orthogonal
        delta: >-
          The generic lower bound is Omega(sqrt(p)). A Hamming weight
          is not a group-operation count. The exponent delta is 0.
      - ref: KR-IC-5931ee
        provenance: internal
        relation: orthogonal
        delta: >-
          Naive prime-field Semaev does not beat generic algorithms.
          This record does not run Semaev. The exponent delta is 0.
      - ref: KR-RHO-755e35
        provenance: internal
        relation: orthogonal
        delta: >-
          Isogenous curves share their point count. This comparison
          stays on one curve. No isogeny is walked. The delta is 0.
