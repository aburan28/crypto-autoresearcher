idea:
  id: IDEA-20261006-2a1db1
  question_id: RQ-ECDLP-623a32
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    Integer Hamming weight of x(P) differs from that of x([3]P) on
    y^2=x^3+3x+5 over F_101
  class: measurement
  claim: >-
    REPRESENTATION AND STAGE. The representation is the integer in
    0..100 equal to the affine x-coordinate, R1 as read in
    RQ-ECDLP-623a32. The retained feature is the Hamming weight of
    that integer, the number of 1-bits in its binary expansion. This
    is not a Kummer line and it is not a degree-d function used as a
    point representation. No attack-stage cost is claimed to change.
    The discrete-log exponent delta versus Pollard rho is 0. Let E be
    y^2=x^3+3x+5 over F_101. Let P be the affine point with smallest
    x, and among those the smaller y. Let w be the Hamming weight.
    The claim is that w(x(P)) is not equal to w(x([3]P)), after the
    discriminant is checked nonzero and [3]P is checked affine. Two
    explanations are discriminated. Moving weight: tripling changes
    the bit count of x. Fixed weight: the two weights agree. Agreement
    is the negative. This is not the least bit of x(P) versus x([2]P),
    not the sum x(P)+x(2P), and not a discrete logarithm.
  mechanism: >-
    The representation is the integer representative of x. The
    operation set is tripling on E(F_101). The projection keeps the
    Hamming weight and discards x itself. Many integers share a
    weight, so the projection is lossy. The weight is constant on
    Frobenius orbits of the integer only in the trivial sense that one
    integer has one weight. It is not assumed constant on the tripling
    orbit. The priced comparison is whether the two weights differ.
    No factor base is proposed.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-623a32
      provenance: internal
      claim: >-
        The question asks which point representations change a named
        attack-stage cost. This weight is tested only as a comparison
        of two integers. The exponent delta is 0.
      verified_by: design session 2026-10-06 read ledger/questions/RQ-ECDLP-623a32.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        Generic discrete log needs Omega(sqrt(p)) group operations.
        A Hamming weight is not a group-operation count.
      verified_by: design session 2026-10-06 read knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KR-IC-5931ee
      provenance: internal
      claim: >-
        Naive prime-field Semaev does not beat generic algorithms.
        This record does not build a summation polynomial.
      verified_by: design session 2026-10-06 read knowledge/frontiers/ecdlp/index-calculus/KR-IC-5931ee.yaml
  assumptions:
    - >-
      4*3^3+27*5^2 = 108+675 = 783. 783 mod 101 is 76, not 0, so E is
      nonsingular. That residue was checked while writing this
      proposal. The weights were not computed.
    - >-
      P is chosen by enumerating x from 0 upward and taking the first
      right-hand side that is a square, then the smaller square root
      as y. If no affine point exists, the instrument is invalid.
    - If [3]P is the point at infinity, the weight of x([3]P) is undefined and the claim is not scored.
  predictions:
    - metric: absolute difference of w(x(P)) and w(x([3]P))
      direction: different
      minimum_effect: at least 1
  minimal_test:
    design: >-
      Find P as above. Compute [3]P by the group law and again by a
      second addition formula. Compare the Hamming weights of the two
      x-coordinates. A disagreement of the two formulas on [3]P
      invalidates the instrument.
    controls:
      - The discriminant residue is nonzero.
      - Both formulas agree on [3]P. A mismatch invalidates the instrument.
      - "[3]P is affine. The point at infinity does not score the negative."
      - P is on the curve. A failed curve check invalidates the instrument.
    required_metrics:
      - x(P), x([3]P), both weights, and their absolute difference
      - the discriminant residue
      - whether the two group-law implementations agree
  falsification_conditions:
    - The two weights are equal. That equality is the negative.
    - The two group-law implementations disagree, so the instrument is invalid and the claim is not established.
    - "[3]P is infinity, or the discriminant is 0, or no affine point exists."
  confounders:
    - >-
      The least bit is the weight modulo 2 of a one-bit window. This
      claim uses the full weight and the map [3], not [2]. A writeup
      that reports only the least bit is a different measurement.
    - >-
      Reducing x into 0..100 before counting bits is part of the
      definition. Counting bits of a lift outside that range is a
      different integer.
  interpretation_limits:
    - P is public. No secret scalar is used. The exponent delta is 0.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The Hamming weight of the integer representative of x is not
        invariant under tripling on this curve, at the rate expected
        if x([3]P) were a uniform field element independent of the
        weight of x(P). The uniform element is the null. The group
        law is deterministic, so the null is a comparison distribution,
        not a model of tripling.
      rigorous_support: >-
        The doubling and addition formulas are rational functions.
        They do not preserve binary Hamming weight as an algebraic
        identity over a prime field. Absence of that identity does not
        by itself prove the two weights differ on the first point.
      validation_plan: >-
        Compute the two weights on this curve at p=101. Then take the
        same coefficient pair over F_103 and record whether the weights
        of x(Q) and x([3]Q), for Q chosen by the same first-point rule,
        also differ. Equality at p=101 falsifies the claim. Equality
        at p=103 does not rewrite the p=101 row. No cryptographic
        prime is used.
  target_complexity:
    time_exponent: >-
      One point search and one tripling on a 7-bit field. The
      discrete-log exponent stays 1/2. Delta versus Pollard rho is 0.
    memory_exponent: O(1) relative to p. The output is two integers at most 7.
    best_known: >-
      Pollard rho at Theta(N^{1/2}) group operations (KR-RHO-13bf67).
      Prime-field Semaev index calculus does not beat that cost under
      KR-IC-5931ee.
    hidden_overhead: No o(1) attack term. The weight is not a relation.
    tradeoff_note: No time-memory tradeoff. The output is one integer comparison.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  dominated_by: >-
    As a discrete-log method this weight is dominated by Pollard rho
    and by KR-IC-5931ee. Those rows do not state the Hamming weight of
    x versus x([3]P) on this curve. They dominate any reading of the
    comparison as an attack.
  sota_delta: >-
    Discrete-log time-exponent delta versus Pollard rho is 0. The
    comparison costs one tripling and does not multiply or divide that
    rho cost. The claimed separation is a weight gap of at least 1,
    not a speedup factor.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp/generic-rho
    rows_checked:
      - KR-RHO-13bf67
      - KR-RHO-755e35
      - KR-IC-5931ee
      - KR-IC-9e610d
    nearest:
