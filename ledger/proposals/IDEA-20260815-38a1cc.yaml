idea:
  id: IDEA-20260815-38a1cc
  question_id: RQ-MTGT-2cabee
  added: '2026-08-15'
  title: >-
    PREPROCESSING ATTACKS CHANGE THE PER-TARGET EXPONENT AND ARE THE ONLY
    CLASSICAL ROUTE THAT DOES: cost the Bernstein-Lange preprocessing
    frontier with storage charged and locate where it beats plain rho
  class: cost-model

  claim: >-
    Preprocessing gives per-target cost below sqrt(N) after an offline
    phase, which is the one classical setting where the ECDLP per-target
    exponent genuinely moves. The gain depends entirely on how the offline
    table is charged. Locating the target count at which preprocessing beats
    plain rho under honest storage charging is the decision-relevant number
    and is not computed here.

  mechanism: >-
    Instantiate the preprocessing cost model with offline time, table
    storage and online per-target cost as separate terms. Sweep target count
    and storage budget. Report the break-even target count against plain rho
    under each budget.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Grep 'preprocessing' (76 with multi-target), 'Bernstein-Lange',
      'break-even'; read of RQ-MTGT-2cabee.
    results: >-
      Preprocessing is represented as a cited effect; no record locates
      its break-even target count with storage charged.
    verdict: >-
      ADAPTATION. The preprocessing results are published; the
      contribution is a charged break-even computation in this program's
      cost framework.

  object_first_candidate:
    tracked_object: >-
      THE BREAK-EVEN TARGET COUNT at which charged preprocessing beats
      plain rho.
    lossiness: >-
      A per-target exponent projects away the offline cost, which must be
      amortised over targets to mean anything.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while the published cost model is instantiable; storage-
      cost models are swept since the answer depends on them directly.

  null_object_control: >-
    NULL 1 -- one target, where preprocessing must lose to plain rho since
    the offline phase cannot amortise. NULL 2 -- free storage and free
    offline time, which must reproduce the published per-target exponent.

  discriminated_from:
    - >-
        The charged multi-target amortization record in this series, which
        covers online-only shared-walk methods; preprocessing is a
        different mechanism with an offline phase and the two must not be
        conflated.
    - >-
        The measured-rho-baseline record, which supplies the comparison
        side.

  assumptions:
    - >-
        The published preprocessing cost model is instantiable from its
        parameters.
    - >-
        Storage can be charged in the same model as computation; where it
        cannot, the break-even is incomplete and must say so.

  predictions:
    - metric: >-
        single-target null
      direction: different
      minimum_effect: >-
        FORCED: preprocessing loses; offline cost cannot amortise over
        one target.
    - metric: >-
        free-resources null
      direction: different
      minimum_effect: >-
        FORCED to reproduce the published per-target exponent.
    - metric: >-
        break-even target count per storage budget
      direction: different
      minimum_effect: >-
        The measurement; if it exceeds any plausible deployment's target
        count, preprocessing is not a practical threat at that budget.

  minimal_test:
    design: >-
      Symbolic instantiation plus a numeric sweep over target count and
      storage budget, both nulls first.
    controls:
      - >-
          Single-target and free-resource nulls.
      - >-
          Storage charged in the same model as computation.
      - >-
          Several storage-cost models swept.
      - >-
          Plain rho costed under the identical model.
    required_metrics:
      - >-
          Break-even target count per storage budget.
      - >-
          Offline, storage and online terms reported separately.
      - >-
          Comparison against plain rho under one model.

  falsification_conditions:
    - >-
        A null misbehaves. Cost model wrong; halt.
    - >-
        Break-even exceeds plausible deployment target counts under every
        budget. Preprocessing is not a practical threat there, which is a
        useful scoped negative.
    - >-
        Break-even is low. Preprocessing threatens any deployment with
        many targets on one curve, which is a deployment-relevant finding.
    - >-
        The answer varies by orders of magnitude across storage models.
        The break-even is model-determined and no single number may be
        quoted.

  confounders:
    - >-
        STORAGE-COST ARBITRARINESS: the answer scales directly with the
        storage-cost model, so a single assumed model would determine the
        conclusion.
    - >-
        SHARED-CURVE ASSUMPTION: preprocessing amortises only across
        targets on the SAME curve, so the relevant target count is per-
        curve and not per-system, which is easy to overstate.

  interpretation_limits:
    - >-
        Costs a published attack class; proposes nothing new.
    - >-
        Scoped to the instantiated model and swept storage budgets.
    - >-
        Break-even counts are per-curve, not per-system.

  heuristic_assumptions:
    - id: HEUR-PREP-1
      statement: >-
        Offline preprocessing cost amortises linearly across targets on
        the same curve, so break-even is the target count where
        amortised offline plus online equals plain rho.
      rigorous_support: >-
        Rigorous ingredient: the offline table is built once and reused,
        so its cost divides by the target count exactly. THE GAP: table
        lookups are not free at scale, and memory-access cost per online
        query grows with table size, so the online term is not
        independent of the offline investment -- which the simple
        amortisation ignores.
      falsification_condition: >-
        Online per-target cost growing with table size beyond the
        model's allowance.
      validation_plan: >-
        SAMPLE: break-even computed across >= 3 storage models x a
        target-count sweep. TAIL CHECK: the largest table size, where
        access cost bites hardest. TRANSFER: none beyond the modelled
        regimes.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Symbolic and numeric sweeps; no experiment.
    memory_exponent: >-
      Negligible for the computation itself.
    best_known: >-
      Incumbents are the published preprocessing results and plain rho,
      both costed here under one model and neither improved.
    hidden_overhead: >-
      Table access cost at scale is the term the simple amortisation
      ignores and the one most likely to move the break-even upward.
    tradeoff_note: >-
      More offline investment lowers per-target cost and raises storage;
      the break-even is where the exchange pays off against plain rho.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As attacks: dominated by the published
    preprocessing literature. As a charged break-even computation: none
    exists here. Not null on any axis.
  sota_delta: >-
    No attack, no exponent claim of its own. Content delivered: the break-
    even target count at which charged preprocessing beats plain rho, per
    storage budget, with offline, storage and online terms separated and the
    per-curve scope stated.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.85 that the published model is instantiable. 0.9 that the nulls
    behave. 0.5 that the break-even sits above plausible per-curve target
    counts, which would make preprocessing a smaller practical threat than
    its exponent suggests.

  status: proposed
  proposed_by: claude-code-session
