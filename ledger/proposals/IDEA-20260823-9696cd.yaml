    "title": "Structure-sensitive Query2P1 selector: exact Kummer-sign obstruction and open oriented non-Cartesian escape",
    "class": "proof-oriented selector screen and scoped counterexample",
    "status": "REVISE",
    "claim": "For the named family of target-independent separable selectors whose complete query transcript depends on each elliptic-curve point only through sign-invariant Kummer coordinates and bounded trace/norm functions, exact occurrence location is impossible on any reachable domain containing a non-2-torsion sign pair. This is an exact counterexample for that family, not a lower bound for oriented, history-bearing, non-Cartesian, or otherwise EC-specific selectors. No complete sub-rho selector is produced.",
    "mechanism": {
      "problem_map": "With B=N^(1/5), materialize two source-labelled pair decks U and V of size B^2=N^(2/5), and pose B=N^(1/5) target shifts q_e. Each query asks for u in U and v in V with u+v=q_e, followed by source replay.",
      "candidate_family": "A Kummer-separable selector assigns each point a bounded tuple of rational functions of x(P), including trace/norm combinations, and makes the query transcript and candidate-bucket choice depend only on those tuples for u, v, and q.",
      "counterexample": "Choose non-2-torsion u and any v with u, -u both reachable, and q=u+v. Since every family key is sign-invariant, (u,v,q) and (-u,v,q) have the same transcript. The first is a solution; the second is not because -u+v=u+v would imply 2u=0. No exact decoder from that transcript can separate them.",
      "surviving_escape": "Attach an orientation/history witness that separates u from -u and couple it to a genuinely non-Cartesian, output-sensitive occurrence locator. This is only an interface requirement: no locator meeting it and the all-axis cost gate is known here."
    },
