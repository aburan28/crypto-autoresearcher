idea:
  id: IDEA-20261006-6c4161
  question_id: RQ-FROB-7d8dd4
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    Image size of x^13 - x on a subfield curve versus pair differences
    over F_{13^3}
  class: measurement
  claim: >-
    On E: y^2 = x^3 + 3x + 2 over F_13, let S be the affine points of
    E(F_{13^3}) whose x-coordinate is not in F_13. Let D_frob be the
    number of distinct values of x(P)^13 - x(P) as P runs through S.
    Let D_rand be the number of distinct values of x(Q) - x(P) on the
    first |S| ordered pairs of distinct points in lexicographic order,
    skipping pairs with equal x. The claim is D_frob + 13 <= D_rand.
    The representation is the affine x-coordinate. The discrete-log
    time exponent stays 1/2 and the delta versus Pollard rho is 0.
    This is not the chord-slope image of IDEA-20261006-922612, and it
    is not the predicate x^q - x = 0 used to cut a factor base. The
    integer is an image cardinality of a difference.
  mechanism: >-
    The operation is the coordinate 13-power map. On a curve defined
    over F_13 the value x^13 - x is zero exactly on the base field, so
    it is nonzero on S, but its image on S may still be thin. The same
    difference on unrelated pairs is the null arm. Two readings are
    separated by the same integers. Orbit-thin says the Frobenius
    differences occupy at least 13 fewer values than the random
    differences. Uniform-difference says they do not. The shortfall
    failing is the negative. No factor base is built.
  novelty_status: unverified
  citations:
    - ref: KR-IC-b0fcda
      provenance: internal
      claim: >-
        A Frobenius-stable factor base is cut by the predicate
        x^q - x = 0. This proposal counts the image of that polynomial
        on points already outside the base field. It does not use the
        predicate as a membership test.
      verified_by: coordinator design session, 2026-10-06, opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-b0fcda.yaml
    - ref: KR-IC-46d822
      provenance: internal
      claim: >-
        For fixed n, Gaudry decomposition is Õ(q^{2-2/n}). This
        proposal does not change that exponent.
      verified_by: coordinator design session, 2026-10-06, opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-46d822.yaml
    - ref: KR-IC-1fcdbc
      provenance: internal
      claim: >-
        Summation-polynomial decomposition on prime-degree binary
        curves is much slower than Pollard rho. This proposal does not
        run that attack.
      verified_by: coordinator design session, 2026-10-06, opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-1fcdbc.yaml
  assumptions:
    - >-
      The discriminant 4*(3^3) + 27*(2^2) = 216 is 8 mod 13. The run
      recomputes it. A zero discriminant voids the comparison.
    - >-
      The modulus is the least monic cubic over F_13 with no root in
      F_13. A reducible choice voids the run.
    - >-
      Pairs with equal x are skipped. A skip fraction above one tenth
      voids the random arm.
  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
    not_applicable_reason: >-
      This is a pre-registered image comparison on one toy curve, not
      a proof.
  predictions:
    - metric: image size of a coordinate difference
      direction: lower
      minimum_effect: D_frob + 13 is at most D_rand
  minimal_test:
    design: >-
      Enumerate E(F_{13^3}). Build S. Compute D_frob and D_rand. A
      second subtraction on 20 values must agree as integers. Report
      the empty-bin count of each image against 13^3. That report does
      not choose the inequality.
    controls:
      - Discriminant recomputed nonzero.
      - Modulus has no root in F_13.
      - x^13 - x is nonzero on every point of S. A zero voids the run.
      - Two subtractions agree on 20 values.
    required_metrics:
      - size of S
      - D_frob
      - D_rand
      - count of zeros of x^13 - x on S
  falsification_conditions:
    - D_frob + 13 is strictly greater than D_rand, after the checks pass.
    - The size of S is below 20, or the random sample cannot be filled. That case is void.
    - x^13 - x vanishes on some point of S.
  confounders:
    - An image of slopes divides by the same difference and is a different integer. It is not this claim.
    - Conjugate differences may collide. The count is of distinct values, so collisions shrink D_frob and are part of the claim rather than a defect.
  interpretation_limits:
    - One curve and one extension of cardinality 2197. No transfer.
    - The discrete-log exponent stays 1/2 even if the inequality holds.
    - A thinner image is not a factor base and does not change Gaudry's exponent.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Differences x(Q) - x(P) on distinct random points are as spread
        as differences of uniform field elements, whose image on m
        samples is close to min(m, 13^3). The additive gap of 13 is the
        pre-registered minimum effect for the Frobenius differences. It
        is not a proved tail.
      rigorous_support: >-
        The polynomial X^q - X has exactly q roots. That does not
        determine the image size of the same polynomial on the
        x-coordinates of E(F_{q^3}).
      validation_plan: >-
        Draw a second frozen sample by reversing each accepted pair and
        compare its image size to D_rand. If the two differ by more
        than 13, H1 is not used to interpret D_frob.
  target_complexity:
    time_exponent: "1/2"
    memory_exponent: "O(1) field elements beyond the point list"
    best_known: >-
      Pollard rho, exponent 1/2 (KR-RHO-037e22). Gaudry's
      Õ(q^{2-2/n}) (KR-IC-46d822) is not improved.
    hidden_overhead: >-
      No o(1) term. The comparison is two integers on a field of
      cardinality 2197.
    tradeoff_note: >-
      The discrete-log time exponent stays 1/2 and the delta versus
      Pollard rho is 0. No time-memory tradeoff is proposed.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: >-
    Checked KR-IC-b0fcda, KR-IC-46d822, KR-IC-955fd6, KR-IC-1fcdbc,
    and KR-RHO-037e22. The factor-base row uses x^q - x = 0 as
    membership. It does not state the image size of x^q - x on the
    complement, and it does not compare that image to pair
    differences. None of the other rows states this pair of integers.
  sota_delta: >-
    The discrete-log time exponent stays 1/2 and the delta versus
    Pollard rho is 0. The pre-registered gap is an additive 13 between
    two image sizes on a field of 2197 elements.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp/index-calculus
    rows_checked:
      - KR-IC-b0fcda
      - KR-IC-46d822
      - KR-IC-955fd6
      - KR-IC-1fcdbc
      - KR-RHO-037e22
    nearest:
      - ref: KR-IC-b0fcda
        provenance: internal
        relation: adjacent
        delta: >-
          That row cuts a factor base by the predicate x^q - x = 0.
          This proposal counts the image of the same polynomial on the
          complement and compares it to pair differences by an additive
          gap of 13. It does not build the factor base.
      - ref: KR-IC-46d822
        provenance: internal
        relation: orthogonal
        delta: >-
          Gaudry's q-exponent is unchanged. The gap here is an additive
          13 on one extension.
    searched:
      corpus_grep:
        - "x^q - x"
        - "pair differences"
      web: []
      blocked:
