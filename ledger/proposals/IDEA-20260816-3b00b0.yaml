idea:
  id: IDEA-20260816-3b00b0
  question_id: RQ-AEADC-8db132
  added: '2026-08-16'
  title: 'Decide the generic-composition matrix by exhaustion rather than by argument: cross three
    orderings of encryption and authentication with four placements of the nonce and associated data,
    and for every cell enumerate a miniature mode completely to decide six finite predicates, producing
    a filled decision table with witnesses'
  class: composition
  claim: '(A) Generic composition is usually discussed as three orderings -- encrypt-and-authenticate,
    authenticate-then-encrypt, encrypt-then-authenticate -- but the ordering is only one axis. Where
    the nonce enters, and whether the associated data feeds the authenticator, the encryptor, or both,
    are independent axes, and the cross product is a matrix of twelve compositions. For a miniature
    instantiation small enough to enumerate completely, membership of each cell in each of six declared
    finite predicates is DECIDABLE, and the deliverable is the filled twelve-by-six table with an
    explicit witness in every cell where a predicate fails. (B) The six predicates are stated as existence
    questions over a fully enumerated input space, not as security notions: does there exist a pair
    of distinct (nonce, associated data, message) triples with identical ciphertext-and-tag output;
    does there exist a triple whose tag is unchanged when the nonce changes; does there exist a pair
    differing only in the associated-data boundary with identical output; does there exist a decryption
    input for which the candidate plaintext is determined before the tag check; does there exist a
    pair of distinct keys opening one output; and does the output determine the associated-data length.
    Each is a yes-or-no with a witness or an exhaustive absence. (C) The table is a property of the
    composition and not of the primitive: the primitive slot holds a seeded ideal permutation, and
    one column is rerun with a real primitive to confirm the table does not move. (D) NOT CLAIMED:
    no security notion is being decided, since these predicates are finite shadows of security notions
    and not the notions themselves; no attack, break or consequence; no claim about any named AEAD,
    since the twelve compositions are declared miniatures; and no claim about published composition
    results. A table that is uniform across all twelve compositions is a usable negative: it would
    say the miniature is too small to separate the matrix, and it would give the exact size at which
    separation must be sought next.'
  mechanism: 'STAGE 1, zero compute: define the miniature primitives -- a keyed permutation on 4-bit
    blocks and a keyed authenticator on 4-bit blocks -- and define the twelve compositions in a fixed
    dataflow notation, with nonce and associated-data routing written out for each. STAGE 2, zero
    compute: state the six predicates as existence statements over a named finite input space, with
    the quantifier order written explicitly as inventor-protocol section 8 requires, since a predicate
    whose quantifiers are ambiguous decides nothing. Pre-register, per cell, the expected answer derived
    by hand. STAGE 3: implement the twelve compositions over one shared miniature primitive pair and
    enumerate the entire input space -- all keys, nonces, associated-data strings within the declared
    bound and messages within the declared bound -- storing every output. STAGE 4: decide each predicate
    per cell by direct search over the stored outputs, emitting the minimal witness where one exists.
    STAGE 5: compare the decided table against the pre-registered table, cell by cell, and treat every
    disagreement as the primary finding, since a disagreement falsifies a hand argument about composition.
    STAGE 6: rerun one column with a pinned real primitive and diff the table; any movement means
    the predicate reads the primitive and the cell is reported as primitive-dependent.'
  novelty_status: unverified
  novelty_screen:
    method: 'Grepped ledger/proposals/ and knowledge/ for: generic composition, encrypt-then-mac,
      mac-then-encrypt. Grepped ledger/proposals/, ledger/hypotheses/ and knowledge/ for aead, associated
      data, nonce-misuse, key commitment. Read RQ-AEADC-8db132 and RQ-POLYMAC-7c89e4 in full. Read
      the title, class and claim head of all eight proposals under RQ-AEADC-8db132 and IDEA-20260809-47a08e
      in full. Read docs/inventor-protocol.md sections 1-5 and section 8, and applied its quantifier-order
      audit directly to the six predicates.'
    results: The generic-composition grep returned exactly one proposal, IDEA-20260809-47a08e, plus
      knowledge literature notes KN-LIT-2689, KN-LIT-5327, KN-LIT-4481 and KN-LIT-6173 matched by
      filename. IDEA-20260809-47a08e uses encrypt-then-MAC over a collision-resistant hash as a REDUCTION-BASED
      NULL OBJECT for the certificate harness -- a single construction used as a control, not a matrix
      and not a decision table. No proposal in the corpus enumerates a composition matrix, and none
      decides predicates by exhaustion over a miniature. The other seven AEADC records are certificate
      construction, cost curves, overhead measurement, padding-fix testing and harness building.
    verdict: 'UNVERIFIED. The generic-composition taxonomy is a classical topic outside this repository
      and nothing is asserted about its published treatment; the twelve compositions here are declared
      miniatures with routing fixed internally, and no result is attributed to any source. What is
      claimed new is internal and specific: the corpus decides no composition predicate by exhaustion,
      holds no composition matrix, and its single generic-composition record uses one construction
      as a control. Assembled from known parts: the ordering taxonomy, exhaustive enumeration over
      a miniature, the observation-collision and quantifier-order audits of inventor-protocol section
      8, and the ideal-primitive substitution this bucket''s directive requires.'
  object_first_candidate:
    tracked_object: 'The output map of a composition: the total function from (key, nonce, associated
      data, message) to (ciphertext, tag), carried as its explicit fibre structure -- which input
      tuples share an output, and along which coordinate they differ.'
    lossiness: 'Lossy, and the loss is exactly what the predicates interrogate. The composition discards,
      into a fixed-width output, an input space that is strictly larger, so fibres are nonempty by
      counting alone; the tracked object keeps only which inputs share an output and along which coordinate,
      discarding the output values themselves. That discard is compatible with the composition''s
      operation because every one of the six predicates is a statement about coincidence and about
      which coordinate varies, never about the values that coincide. The retained part propagates
      deterministically because the composition is a function. Stated honestly: for a composition
      whose output is wider than its input, the fibre structure is trivial and the projection loses
      nothing, so those cells are a change of coordinates rather than a new object -- and the parameters
      are chosen so that both regimes appear in the table, which is what makes the counting interpretable
      rather than automatic.'
    propagation: One step of the target operation is moving one routing decision -- sending the associated
      data to the encryptor as well as the authenticator, or feeding the nonce into the authenticator
      instead of only the encryptor. It acts on the tracked object by merging or splitting fibres
      along a specific coordinate, so the whole matrix is generated by a small set of moves from a
      single base composition, and each predicate's answer either survives a move or flips at it.
      Locating which moves flip which predicates is the structural content of the table.
    survival_score: A predicate's answer survives across a set of routing moves before flipping, and
      the survival score is reported per predicate as the number of the twelve compositions that share
      its answer, together with the specific routing move at which it first flips. A predicate with
      the same answer in all twelve compositions has not survived usefully -- it has failed to separate
      anything at this miniature size -- and that is reported as such rather than as a uniformity
      finding.
  null_object_control: 'Two arms in the same invocation, sharing the identical decision code. NULL
    ARM: a random-function composition, in which the twelve routings are replaced by a single seeded
    random map from the whole input tuple to the output, which has no composition structure at all;
    every predicate must be decided against it, and its column must show exactly the answers that
    pure counting predicts -- coincidences appear at the rate the input and output sizes force and
    nowhere else. If any predicate returns an answer for the null that differs from its counting prediction,
    the decision procedure is reading something other than the composition. POSITIVE CONTROL: one
    deliberately degenerate composition whose authenticator ignores the nonce entirely, which must
    return a witness for the nonce-independence predicate; if it does not, the search cannot find
    witnesses and every exhaustive absence in the table is uninformative.'
  discriminated_from:
  - IDEA-20260809-47a08e instantiates one encrypt-then-MAC construction as a reduction-based null
    for a certificate harness. This enumerates twelve routings and decides six predicates on each,
    and its output is a table with witnesses rather than an expectation of emptiness.
  - The commitment-budget entry in this same batch counts variables against constraints to predict
    how many colliding contexts exist for one target. This decides yes-or-no membership in six predicates
    by exhaustion and does no counting of degrees of freedom; the two would disagree in a way that
    is itself informative, and neither derives the other.
  - IDEA-20260809-3a5c29 separates key commitment from context commitment at standard parameters using
    certificates. One of the six predicates here is a miniature shadow of key commitment, decided
    by exhaustion on a 4-bit miniature, which is a different kind of statement and explicitly not
    a certificate.
  - RQ-POLYMAC-7c89e4 owns polynomial-MAC forgery bounds. The authenticator here is a miniature keyed
    function with no polynomial structure, and no forgery probability is computed anywhere.
  - The classical statement that encrypt-then-authenticate is the safe ordering. This record is not
    that statement and does not test it; it decides six finite predicates whose relation to any security
    notion is explicitly disclaimed.
  assumptions:
  - A 4-bit miniature primitive pair preserves enough of the routing structure that predicate answers
    reflect the composition rather than the width; this is the load-bearing assumption and it is directly
    checked by the uniformity outcome, since a table uniform across all twelve compositions would
    falsify it.
  - The six predicates are well-posed as existence statements with explicit quantifier order, so each
    cell has a definite answer.
  - The twelve compositions are a faithful enumeration of the ordering-by-routing cross product under
    the declared notation, with no routing silently omitted.
  - A seeded ideal permutation in the primitive slot makes the table a composition property, checked
    by the real-primitive column rather than assumed.
  - The declared input bound -- associated data and message each at most two blocks -- is large enough
    for boundary-related predicates to have a chance of being witnessed.
  predictions:
  - metric: number of the six predicates whose answer differs across at least two of the twelve compositions
    direction: higher
    minimum_effect: 3
  - metric: cells where the decided answer disagrees with the pre-registered hand-derived answer
    direction: different
    minimum_effect: 0
  - metric: witness returned by the positive control for the nonce-independence predicate
    direction: different
    minimum_effect: 1
  - metric: predicate answers of the random-function null column against their pure-counting predictions
    direction: different
    minimum_effect: 0
  - metric: cells whose answer moves between the ideal-permutation and real-primitive columns
    direction: different
    minimum_effect: 0
  minimal_test:
    design: 'One process, complete enumeration, under an hour of compute. Instantiate a keyed 4-bit
      permutation and a keyed 4-bit authenticator, both as seeded lazily-sampled objects. Build the
      twelve compositions from one shared routing interpreter so that a routing change is a data change
      and not a code change, which is what makes the matrix trustworthy. Enumerate the entire input
      space per composition: all 16 keys, all 16 nonces, associated data of 0, 1 or 2 blocks and messages
      of 1 or 2 blocks, storing every output. Decide the six predicates per cell by direct search
      over the stored outputs, emitting the minimal witness or an exhaustive absence. Run the random-function
      null column and the degenerate positive control through the identical decision code in the same
      invocation. Rerun one column with a pinned real primitive and diff. The discriminating comparison
      is the decided table against the pre-registered table, cell by cell, with the null column fixing
      what pure counting alone produces.'
    controls:
    - Random-function null column with predicate answers predicted from pure counting before the run.
    - Degenerate positive control whose authenticator ignores the nonce, which must yield a witness
      for the nonce-independence predicate.
    - Pre-registered hand-derived table, hashed before any code runs.
    - Shared routing interpreter, so all twelve compositions run identical code differing only in
      declared routing data.
    - Real-primitive column, diffed against the ideal-permutation column.
    - 'Round-trip validation: every composition must decrypt correctly on all enumerated inputs before
      predicates are decided.'
    required_metrics:
    - decided answer for each of the seventy-two cells, with minimal witness or exhaustive absence
    - count of cells disagreeing with the pre-registered table
    - number of predicates that separate at least two compositions
    - routing move at which each predicate first flips
    - predicate answers of the null column against their counting predictions
    - count of cells that move between primitive columns
  falsification_conditions:
  - Every predicate returns the same answer in all twelve compositions, meaning the miniature is too
    small to separate the matrix and the table decides nothing at this size.
  - The positive control fails to yield its witness, meaning the search cannot find witnesses and
    every exhaustive absence is uninformative.
  - The null column's answers depart from their pure-counting predictions, meaning the decision procedure
    reads something other than the composition.
  - Any composition fails round-trip decryption, voiding its column.
  - Cells move between the ideal and real primitive columns, meaning those predicates are primitive-dependent
    and do not belong in a composition table.
  - The pre-registered table matches in every cell, which is not a falsification of the record but
    is reported plainly as the run having tested nothing that was in doubt.
  confounders:
  - At 4-bit width the input space may be smaller or larger than the output space depending on the
    cell, and coincidences forced by pure counting will masquerade as composition effects; the null
    column exists precisely to fix that baseline per predicate.
  - A routing enumeration that silently omits a case makes the matrix incomplete without any signal
    that it is.
  - Predicates with ambiguous quantifier order can be decided two ways by the same code; section 8's
    quantifier audit is applied in stage 2 for exactly this reason.
  - Sharing seeds between the composition columns and the null column would correlate their fibre
    structures.
  - The degenerate positive control is not a member of the twelve and must not be reported as one.
  interpretation_limits:
  - The six predicates are finite shadows of security notions and are not those notions; no cell in
    this table is a security statement and none may be read as one.
  - Every answer is a statement about a 4-bit miniature under the declared input bound, and transfers
    to no full-size composition without a separate argument this contract does not supply.
  - The twelve compositions are declared miniatures and are not identified with any named AEAD.
  target_complexity:
    time_exponent: No attack exponent is claimed. Enumeration costs O(number of compositions times
      the input space size), which is fixed and small by construction.
    memory_exponent: No attack exponent is claimed. Memory is linear in the stored output table for
      one composition at a time.
    best_known: The incumbent is the standard qualitative composition guidance, which predicts some
      of the pre-registered cells. This record does not beat it; it decides a finite shadow of it
      by exhaustion, and the interesting outcome is a cell where the decided answer and the hand-derived
      expectation disagree.
    hidden_overhead: The human cost is in stating the six predicates with unambiguous quantifier order
      and in enumerating the routings completely; both are pure attention, and an error in either
      is invisible in the output. Lower-order compute hides in storing the full output table per composition,
      which is what makes witness extraction cheap.
  dominated_by: n/a (no result claimed). No attack, so no frontier row on time, memory or queries.
    Checked against all four targets of RQ-AEADC-8db132, all eight proposals under it, all four targets
    of RQ-POLYMAC-7c89e4, and the other entries in this batch; the nearest is the commitment-budget
    entry, which produces a count rather than a decided predicate table and neither dominates the
    other.
  sota_delta: no attack; conceptual/measurement contribution only. The quantitative deliverable is
    a seventy-two-cell decided table with minimal witnesses, a count of disagreements against a pre-registered
    table, and a per-predicate separation count, where the corpus holds no decided composition predicate
    at all.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'By part. That the enumeration completes and every cell is decided: about
    0.95, since the space is tiny and the arithmetic exact. That at least three of the six predicates
    separate at least two compositions: about 0.6, with the main risk being that a 4-bit miniature
    forces coincidences everywhere and flattens the table -- an outcome that is itself reportable
    and tells the next reader the required size. That at least one cell disagrees with the pre-registered
    hand-derived answer: about 0.45, and that is the outcome worth having. That the null column matches
    its counting predictions: about 0.8. That no cell moves between primitive columns: about 0.85,
    and movement would relocate those predicates out of this bucket.'
