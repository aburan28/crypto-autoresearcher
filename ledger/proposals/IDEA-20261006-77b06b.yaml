idea:
  id: IDEA-20261006-77b06b
  question_id: RQ-GFPN-c01af8
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Monomial-count ratio of the 2-torsion coordinate against elementary
    symmetric S_5, on one toy quintic extension
  class: measurement
  claim: >-
    Representation class R1, x-coordinates. The attack stage is the
    shape of the decomposition ideal, scored by monomial count and not
    by a bit-security estimate. Let p' = 11. Let f be the first monic
    irreducible quintic over F_11 in lexicographic order of coefficients,
    and let F = F_11[z]/(f). Let E2 be the first short-Weierstrass curve
    over F, in lexicographic order of (A, B), with a rational point of
    order 2 and with A, B not both zero. Let E0 be the first curve over
    the same field with no F-rational point of order 2. Let M2 be the
    number of distinct monomials in a grevlex listing of the generators
    of the elementary-symmetric form of the 5-summand decomposition
    system. Let M3 be the same count after the substitution t = x + b/x
    coming from that rational 2-torsion point, which is defined for E2
    and is absent for E0. Then M3/M2 on E2 is at most 1/4, and
    M2(E2)/M2(E0) lies in [1/2, 2]. The negative observation is
    M3/M2 > 1/4 on E2. No 128-bit claim is made. The Gaudry exponent
    at extension degree 5 stays 2 - 2/5 = 8/5.
  mechanism: >-
    OBJECT FRAME. Representation: R1, affine x-coordinates on E(F),
    F a degree-5 extension of F_11. Operation set Sigma: permutation of
    the five summands, and, on E2 only, translation by the rational
    point of order 2. Sigma is not the full translation action.
    TRICHOTOMY. Partial-action. The elementary-symmetric generators are
    invariant under permuting summands, and the coordinate t = x + b/x
    is invariant under translation by the order-2 point. Neither
    invariance survives an arbitrary translation.
    LOSSY-PROJECTION TEST against Sigma. Elementary symmetric
    polynomials discard order. The t-coordinate discards the pair
    {x, b/x}. Both discards are compatible with the named Sigma on E2.
    Both are lossy: distinct ordered tuples share one symmetric image,
    and two x-coordinates share one t. On E0 the t-substitution is not
    defined over F, so that discard is not claimed there. If M3/M2 on
    E2 exceeds 1/4, the extra discard did not shrink the generator
    support by the predicted factor on this field.
    The substitution t = x + b/x is the 2-torsion arm named in the opened
    question RQ-GFPN-c01af8 and in the opened row KR-IC-955fd6. This
    record counts monomials at p' = 11. It does not recompute the
    published word-operation estimates in the opened row KR-IC-e2d81b.
    The factor base is not redesigned. The bounded-degree algebraic
    factor-base class is not escaped. Kummer-line models are not used.
  novelty_status: adaptation
  citations:
    - ref: KR-IC-955fd6
      provenance: internal
      claim: >-
        The opened row states that S_m symmetry and small-order torsion
        shrink point-decomposition systems, and it records an estimate
        near 2^130 word operations for twisted Edwards curves over
        F_{q^5} with q about 2^64. It does not state a monomial-count
        ratio at p' = 11.
      verified_by: idea-generator, 2026-10-06, knowledge/frontiers/ecdlp/index-calculus/KR-IC-955fd6.yaml
    - ref: KR-IC-e2d81b
      provenance: internal
      claim: >-
        The opened row records the ecGFp5 designer estimate of at least
        2^142 for Gaudry-type decomposition over F_{p^5} with
        p = 2^64 - 2^32 + 1, an O(C·p^2) Joux–Vitse figure with p^2 = 2^128,
        and a ~2^130 estimate for twisted Edwards curves over F_{q^5}
        whose symmetries' applicability to ecGFp5 the row calls unexamined.
        No dedicated cryptanalysis of ecGFp5 was found as of the row's
        date 2026-09-26. This count does not recompute those figures.
      verified_by: idea-generator, 2026-10-06, knowledge/frontiers/ecdlp/index-calculus/KR-IC-e2d81b.yaml
    - ref: KR-IC-5a43e5
      provenance: internal
      claim: >-
        Summation polynomials are the decomposition framework. Novelty
        cannot be the decision to use them. The added quantity is the
        monomial-count ratio.
      verified_by: idea-generator, 2026-10-06, knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
    - ref: KR-IC-46d822
      provenance: internal
      claim: >-
        Heuristic Gaudry cost Õ(q^{2-2/n}) for fixed n. At n = 5 the
        exponent is 8/5. This count does not replace that exponent.
      verified_by: idea-generator, 2026-10-06, knowledge/frontiers/ecdlp/index-calculus/KR-IC-46d822.yaml
    - ref: KR-IC-5ea2f8
      provenance: internal
      claim: >-
        Odd-characteristic cover attacks are a different construction.
        No covering curve is computed.
      verified_by: idea-generator, 2026-10-06, knowledge/frontiers/ecdlp/index-calculus/KR-IC-5ea2f8.yaml
    - ref: RQ-GFPN-c01af8
      provenance: internal
      claim: >-
        The opened question separates raw descent, elementary-symmetric
        S_5, and the 2-torsion translation t = x + b/x, and it asks
        whether a rational 2-torsion point changes the charged symmetry.
        The curves named there are the large-field EcGFp5 and EcMasFp5
        shapes. This record uses the same three arms at p' = 11.
      verified_by: idea-generator, 2026-10-06, ledger/questions/RQ-GFPN-c01af8.yaml
  assumptions:
    - F_11 has at least one monic irreducible quintic. The first in lexicographic order is frozen before any monomial is listed.
    - A rational point of order 2 is an F-point T with 2T = O and T ≠ O. Its existence is an exhaustive search of E(F), which at this size is finite and small.
    - Grevlex is fixed before the generators are expanded. Monomial count is the number of distinct monomials appearing with nonzero coefficient in those generators, before any Gröbner basis.
    - The same summand count, 5, is used on E2 and on E0.
  proof_search_map:
    not_applicable_reason: >-
      A two-curve monomial count at p' = 11. Not a proof of a published
      word-operation estimate and not a security claim about any deployed
      curve.
  predictions:
    - metric: monomial_ratio_M3_over_M2_on_E2
      direction: lower
      minimum_effect: The ratio is at most 1/4.
    - metric: monomial_ratio_M2_E2_over_M2_E0
      direction: different
      minimum_effect: The ratio lies in [1/2, 2].
  minimal_test:
    design: >-
      Freeze f, E2, and E0 by the lexicographic rules. Expand the
      elementary-symmetric generators on both curves and count grevlex
      monomials. On E2 only, expand the t = x + b/x generators and count
      again. A second expansion with a different internal variable order,
      followed by the same grevlex sort, must reproduce both counts.
      Do not run a Gröbner basis and do not build a cover.
    controls:
      - E0, which has no rational 2-torsion, so M3 is absent there rather than zero.
      - The repeated expansion of M2 and M3.
      - A check that 2T = O for the chosen torsion point, and that E0 has no such point.
    required_metrics:
      - the quintic f
      - (A, B) for E2 and for E0
      - M2(E2), M2(E0), M3(E2)
      - the two ratios
      - whether the repeated expansion agrees
  falsification_conditions:
    - >-
      M3/M2 on E2 is greater than 1/4. That is the negative observation:
      the 2-torsion coordinate did not cut the generator support by a
      factor of four on this field.
    - M2(E2)/M2(E0) lies outside [1/2, 2]. The two curves are then not matched, and a small M3 is not attributed to the torsion coordinate.
    - The repeated expansion disagrees. The counts are void.
  confounders:
    - A different monomial order changes the listing but should not change the set of monomials. If it does, the generator presentation is unstable and the count is void.
    - Symmetrizing only a subset of the equations can shrink M3 without being the full arm.
    - E2 and E0 can differ in j-invariant. The M2 ratio is the check that this difference is not already a factor-of-four effect.
    - The figures 2^142 and 2^130 in the opened row KR-IC-e2d81b are not inputs to this count.
  interpretation_limits:
    - p' = 11, one quintic, two curves. No transfer to p = 2^64 - 2^32 + 1.
    - A ratio ≤ 1/4 is not a 128-bit statement and does not move the exponent 8/5.
    - M3 absent on E0 is the definition of that arm, not a measured zero.
    - Cover-attack genus is not computed. Richelot codomain triples are not computed.
    - This count does not decide whether the symmetries behind the ~2^130 figure apply to ecGFp5. The opened row KR-IC-e2d81b already marks that applicability unexamined.
  heuristic_assumptions:
    - id: H1
      statement: >-
        On a degree-5 extension of F_11, passing from elementary symmetric
        polynomials in five x-coordinates to the 2-torsion coordinate
        t = x + b/x multiplies the generator monomial count by at most 1/4
        on the first curve that has a rational order-2 point, while the
        elementary-symmetric count itself stays within a factor 2 of the
        same count on the first curve that lacks that point. The 1/4
        imitates a uniform collapse of a (Z/2)-orbit of size at least 4
        on the monomials. It is not a semi-regular degree prediction.
      rigorous_support: >-
        Translation by a rational order-2 point is an involution on
        x-coordinates when b ≠ 0. KR-IC-955fd6, opened, states that
        small-order torsion shrinks decomposition systems. KR-IC-e2d81b,
        opened, records large-field estimates and does not give the
        factor 1/4 at p' = 11. The factor is the pre-registered minimum
        effect.
      validation_plan:
        sampling: >-
          The two frozen curves, not a random sample. Every generator
          monomial is counted.
        comparison: >-
          M3/M2 against 1/4 on E2, and M2(E2)/M2(E0) against [1/2, 2].
        tail_check: >-
          If either M2 is zero, the presentation is empty and the cell is
          void. A zero is not a successful shrinkage.
        parameters: >-
          p' = 11, extension degree 5, five summands, grevlex, two curves.
          No transfer to cryptographic p and no Gröbner degree.
  target_complexity:
    time_exponent: >-
      Unchanged. Opened KR-IC-46d822 gives heuristic exponent 2 - 2/5 = 8/5
      in the base-field cardinality for fixed n = 5. Rho on a group over
      F_{q^5} remains exponent 5/2 in that same cardinality, up to constants.
      The monomial ratio moves neither. Opened KR-IC-e2d81b's 2^142 and
      2^130 figures are not replaced.
    memory_exponent: >-
      Unchanged. The stored object is the generator support at p' = 11.
    best_known: >-
      KR-IC-955fd6, opened, for torsion symmetrization. KR-IC-e2d81b,
      opened, for the published ecGFp5 and degree-5 estimates, including
      ≥2^142 and ~2^130. KR-IC-46d822, opened, for the exponent 8/5. This
      count does not replace any of those figures.
    hidden_overhead: >-
      The Õ in Gaudry's bound hides n! and the summation degree. Neither
      is measured. No o(1) attack term is claimed.
    tradeoff_note: >-
      Not a time-memory tradeoff and not a multi-target rho schedule.
      The output is two ratios.
