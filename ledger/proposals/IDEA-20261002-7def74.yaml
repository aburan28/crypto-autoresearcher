  assumptions:
    - Frozen V, surplus schedule, β, seeds, and sparse-LA pin before any run.
    - Relation collector and LA pin already admitted or cell is IMP.
    - Fill-in band ≠ Frobenius-closed yield ≠ orphan absorption.
    - F ≤ β ≠ practical binary IC (KR-IC-1fcdbc).

  heuristic_assumptions:
    - id: HEUR-BINSTD-7def74-H1
      formal_statement: >-
        FORALL admitted toy cells n∈{17,23,31} with frozen (V,β): for each
        surplus s∈{1.0,1.25,1.5,2.0}×|#FB|, F := nnz_after_elim / nnz_initial
        ≤ β.
      random_model_justification: >-
        Rigorous: sparse elimination fill-in is governed by the sparsity
        pattern and pivot order; classical random sparse-matrix models predict
        bounded fill-in below a density threshold. If toy-Koblitz relation
        matrices behave like that model at the frozen surpluses, F should stay
        ≤ β; if algebraic dependencies create dense blocks as surplus grows,
        the band breaks. The β band is the pre-registered transfer hypothesis
        at toys — not a claim that IC LA beats rho.
      supporting_results:
        - KR-IC-b0fcda
        - KR-IC-ae532f
        - KR-IC-1fcdbc
      validation_experiment_ids: []
      falsification_condition: >-
        F > β at any completed surplus level (LA-fill-in-superlinear-in-
        surplus), OR collector/LA pin absent (infrastructure stop), OR
        matrix singular / rank-deficient before elim completes (inconclusive;
        record and stop without claiming band hold).

  predictions:
    - metric: fill_in_ratio_F
      direction: upper_bounded
      minimum_effect: '≤ β at each (n,s) cell'
    - metric: surplus_levels_completed
      direction: lower_bounded
      minimum_effect: '≥ 3 of 4 surplus levels completed, else inconclusive'
    - metric: null_ER_matrix_fill_in_independence
      direction: different
      minimum_effect: 'null catalog F independent of relation structure'

  minimal_test: >-
    Stage 0: freeze V, surplus schedule, β, seeds, sparse-LA pin.
    Stage 1: n=17 — collect to each surplus; elim; report F.
    Stage 2: n∈{23,31} + Erdős–Rényi null matrices. Budget: ≤8 CPU-hours.
    Stop if collector/LA pin / toy cell absent (IMP, never evidence).

  controls:
    - ctl_frozen_V_and_surplus_schedule
    - ctl_shared_sparse_LA_pin
    - ctl_frozen_beta_before_runs
    - null_ER_same_shape_density
    - ctl_no_posthoc_beta_edit
    - ctl_no_midtick_lib_provision

  falsification_conditions:
    - Claiming practical binary IC from a toy fill-in band (KR-IC-1fcdbc).
    - Equating fill-in with Frobenius-closed yield (0fcbe2) or absorption
      (9d8520).
    - Treating the n² LA speedup (KR-IC-b0fcda) as this meter's novelty.
    - Editing β after seeing F.
    - Transferring the band to n≥131 without a new contract.

  target_complexity:
