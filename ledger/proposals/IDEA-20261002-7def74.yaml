idea:
  id: IDEA-20261002-7def74
  question_id: RQ-BINSTD-b6f698
  added: '2026-10-02'
  status: proposed
  approved_by: null
  title: >-
    AS RELATION SURPLUS GROWS, DOES SPARSE LA nnz FILL-IN STAY INSIDE A
    PRE-REGISTERED BAND? On toy Koblitz cells n∈{17,23,31} with a frozen
    factor-base V, collect relations to surplus s∈{1.0,1.25,1.5,2.0}×|#FB|
    and test whether post-elim nnz / initial_nnz ≤ β (β frozen).

  class: heuristic_validation

  claim: >-
    KR-IC-b0fcda states that Frobenius-invariant factor bases can speed
    linear algebra by up to n²; it does not freeze a fill-in band for sparse
    elimination as relation surplus grows on a fixed FB. CLAIM: for each
    admitted toy cell n∈{17,23,31} with frozen V and sparse-LA pin, across
    surplus levels s∈{1.0,1.25,1.5,2.0}×|#FB|, the fill-in ratio
    F := nnz_after_elim / nnz_initial satisfies F ≤ β with β frozen at
    Stage 0 — OR the band breaks and is recorded as LA-fill-in-superlinear-
    in-surplus at this scale. CLAIM TIER: heuristic_validation. NO break.
    NO exponent. NO n≥131 transfer. Distinct from IDEA-20261001-0fcbe2
    (τ-closed yield), 9d8520 (orphan absorption), and b0fcda's system-count
    / n² LA-speedup claim (not a surplus fill-in meter).

  mechanism: >-
    OBJECT FRAME. Representation: relation matrix over FB {P : x(P)∈V};
    Operation: collect relations to a frozen surplus schedule, then run one
    shared sparse elimination pin; Observable: fill-in ratio F at each
    surplus. Trichotomy: Class I instrument (post-collection LA meter).
    Lossy-projection: F discards which pivots explode; null is a matched
    Erdős–Rényi sparse matrix with the same shape and density whose fill-in
    is independent of the relation structure by construction. OFF-LIMITS:
    Frobenius-closed yield (0fcbe2); double-large-prime absorption (9d8520);
    claiming the n² LA speedup itself as novelty (KR-IC-b0fcda). WHAT IS NEW:
    a frozen β fill-in band versus surplus on RQ-BINSTD toys.

  novelty_status: unverified
