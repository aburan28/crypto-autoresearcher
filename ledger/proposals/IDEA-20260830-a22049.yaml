  assumptions:
    - >-
      Ordinary, prime-order, non-anomalous classes over prime fields -- the RQ's own
      scope. Primality of N is load-bearing twice: once for Tate-constancy of the
      group structure (via 20b05f) and once for step (B)(i)'s elimination of the
      Montgomery/Edwards branch. The composite-order control exists because both
      uses fail together outside it.
    - >-
      The rho walk is an r-adding walk whose steps are additions by precomputed
      offsets, with a measured doubling fraction rho_dbl reported rather than
      assumed. Where an implementation doubles, delta_dbl is nonzero and the
      derivation gives a bound rather than an equality.
    - >-
      The harness's group law is implemented with (a,b)-free addition. THIS IS AN
      ASSERTION ABOUT CODE, NOT MATHEMATICS, and STEP 3 verifies it by source audit
      before any conclusion is drawn.
    - >-
      Charged cost is counted in field multiplications and squarings with inversions
      charged at their implemented cost. The (a,b)-freeness argument is exact in
      that unit and says nothing about wall clock, cache behaviour or vectorisation,
      which can differ between two curves for reasons unrelated to their equations.
    - >-
      The rho heuristic -- that the partition walk behaves as a uniformly random
      function of the encoding -- is what makes the step count class-constant. It is
      heuristic H1 below and its failure is the one route by which S(C) could exceed
      the derived bound.

  proof_search_map:
    bottleneck: >-
      Step (B)(ii): the claim that the charged cost of a walk step is identical on
      every class member. Everything else composes trivially once it holds. Every
      objection will attack it, and it is attacked in exactly two places -- the
      doubling path (handled explicitly by delta_dbl) and the possibility that the
      implementation reads the curve equation somewhere the analysis did not look
      (handled by the STEP 3 source audit, which is why that step is called
      load-bearing).
    baseline_embedding:
      parameter_slice: >-
        The singleton class (Kronecker class number 1) and, separately, a single
        curve compared against itself under a different random model change
        u: (x,y) -> (u^2 x, u^3 y). In both cases the derivation must give exactly
        S = 1 with no delta_dbl term, because there is only one curve or only one
        j-invariant.
      reproduction_check: >-
        On a single curve, the measured charged rho work under two different
        F_p-isomorphic MODELS of the same curve must agree to within seed noise, and
        the measured per-step field-operation count must agree EXACTLY. A nonzero
        exact per-step difference between two models of the same curve refutes
        (B)(ii) at the cheapest possible scale and halts the record. This check
        costs one run and is the whole derivation's zero point.
    observation_collision:
      observable: "S(C) close to 1 on |Aut| = 2 vertices"
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, which is why the composite-order control
        is blocking. S(C) close to 1 is also produced by a measurement pipeline that
        is INSENSITIVE to the curve -- one whose rho cost depends only on N and the
        seed -- for a reason that has nothing to do with (a,b)-freeness. The
        disambiguator is that the SAME pipeline must report a LARGE spread on the
        composite-order class where a real model-level difference exists. Reporting
        S(C) ~ 1 without the composite-order arm is prohibited by this record, and
        this is the same disambiguation structure IDEA-20260807-a2fb45 requires of
        its between-class arm.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the question "does the model column carry information" by "does
          the model column carry charged cost", and answer it by reading the
          addition formula rather than by measuring a spread.
        predicted_gain: >-
          Converts a medium-compute census measurement (20b05f STEP 3) into a
          zero-compute derivation with a pre-registered predicted value. Census
          effort saved: the whole per-vertex rho budget over every class, which
          20b05f prices at 24 seeds per vertex over classes of size
          m = O(sqrt(p) log p). Attack gain: zero.
      - transform: stronger_invariant
        proposed_object: >-
          The pair (does the functional read the curve equation, does the class
          admit the required torsion) as the criterion deciding whether the model
          column is live, replacing the single invertibility test.
        predicted_gain: >-
          Splits the column correctly: dead for rho inside prime-order classes,
          live for index calculus, live for composite-order classes. A single test
          cannot produce that split, which is why the original elimination
          over-reached.
    quantifier_order: >-
      CLAIMED: FORALL ordinary prime-order F_p-isogeny classes C in this RQ's scope,
      FORALL E, E' in C with |Aut| = 2, and FORALL r-adding rho implementations with
      (a,b)-free addition, the charged field-operation cost per walk step is EQUAL,
      and hence Wbar(E)/Wbar(E') = 1 + O(delta_dbl) + seed noise.
      EXPLICITLY NOT CLAIMED: FORALL cost functionals -- the claim is quantified
      over rho implementations only, and OPEN-1 records the functionals it does not
      reach. ALSO NOT CLAIMED: that the bound transfers to cryptographic scale; the
      per-step equality does transfer because it is exact algebra, but the step-count
      constancy rests on the rho heuristic and is refused beyond the tested sizes.
      The audit obligation is that "r-adding with (a,b)-free addition" is verified
      of the actual implementation before the universal claim is made.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For r-adding rho with an (a,b)-free addition path, the charged per-step
        cost is exactly equal across an ordinary prime-order F_p-isogeny class, so
        the class spread S(C) on |Aut| = 2 vertices is bounded by
        1 + 0.09*rho_dbl plus seed noise." It can NEVER certify that no curve-level
        structure exists (only that none is visible to this cost functional), never
        anything about index-calculus functionals, never anything about
        composite-order classes, and never anything at cryptographic scale.
      nearby_object_control: >-
        THE COMPOSITE-ORDER CLASS in which some members admit rational 4-torsion and
        a twisted-Edwards model. The derivation MUST give a large spread there, and
        the measurement MUST confirm it. A derivation that gives a small spread on
        both has not identified the load-bearing structure (primality of N) and its
        prime-order conclusion is void. BLOCKING.
    proof_obligations:
      - claim: "An invertible map may change charged cost, so the information test cannot eliminate a cost column."
        responsibility: correctness
      - claim: "N prime implies no rational 2-torsion on any class member, so Montgomery and Edwards models are unavailable class-wide."
        responsibility: correctness
      - claim: "Short-Weierstrass addition formulas contain neither a nor b."
        responsibility: correctness
      - claim: "Doubling is the only (a)-dependent step and its saving is at most one field multiplication."
        responsibility: strictness
      - claim: "The harness's addition path does not read a or b."
        responsibility: feasibility
      - claim: "The step count is class-constant under the rho heuristic."
        responsibility: success_probability
      - claim: "The composite-order control shows a large spread."
        responsibility: baseline
      - claim: "The derivation is quantified over rho implementations only and OPEN-1 is handed over."
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        exact charged field-operation count per rho walk step, compared across
        distinct members of one ordinary prime-order class at matched seeds
      direction: different
      minimum_effect: >-
        EXACTLY EQUAL, to the operation, on every addition step. A single differing
        count on an addition step refutes (B)(ii) and halts the record. This is the
        cheapest and sharpest test in the whole proposal.
    - metric: measured doubling fraction rho_dbl of the harness's rho walk
      direction: different
      minimum_effect: >-
        Reported, not predicted. If rho_dbl = 0 the derivation gives S(C) = 1 + seed
        noise exactly; if rho_dbl > 0 it gives a bound, and the bound must be stated
        with the measured value rather than with an assumed one.
    - metric: derived bound on S(C) for |Aut| = 2 vertices
      direction: lower
      minimum_effect: >-
        At most 1.10, and in any case strictly below 1.5, since 1.5 is the smallest
        charged transport factor EV-ENDO-10109d measures. A derived bound above 1.5
        would leave the arm open and would mean delta_dbl is doing far more work
        than (B)(iii) allows.
    - metric: >-
        measured S(C) on |Aut| = 2 vertices of one complete 16-bit class, against
        the seed-noise null resampled at the same class size m
      direction: lower
      minimum_effect: >-
        Inside the seed-noise null distribution, i.e. S(C) <= 1.10 at 24 seeds. A
        measured S(C) >= 1.30 refutes this derivation, is far more informative than
        a pass, and requires independent validation and red-team review before any
        use -- it would indict either the rho heuristic or the implementation on a
        class where N is held exactly constant.
    - metric: >-
        composite-order nearby-object control spread, derived and measured
      direction: higher
      minimum_effect: >-
        Materially above the prime-order bound, by at least the
        field-multiplication ratio between the twisted-Edwards and short-Weierstrass
        addition laws on the members that admit both, in addition to any
        Pohlig-Hellman effect. A control showing no difference means the instrument
        cannot see a known effect and voids the prime-order reading.
    - metric: >-
        net value of the single-target charged-transfer arm, computed as
        (derived S(C) bound) divided by (EV-ENDO-10109d's charged transport factor)
      direction: lower
      minimum_effect: >-
        Below 1 at every tested ell from 3 to 31, i.e. at most 1.10/1.5 = 0.73 at
        ell = 3 and 1.10/21 = 0.052 at ell = 31. This is the closure's headline
        number and it is a composition of two already-recorded quantities, not a new
        measurement.
    - metric: >-
        applicability of the cost argument to Semaev summation polynomials and
        Groebner solving degree
      direction: different
      minimum_effect: >-
        MUST FAIL, with the failing step named. An argument that appears to prove
        the model column dead for index calculus too is too strong, is wrong, and
        this record is superseded rather than amended -- lane L1 exists on the
        premise that such functionals may vary.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, AND IT IS THE DELIVERABLE): STEPS 1, 2 and 4 -- the
      defect, the torsion argument, and the composed net-value ledger. Reviewable
      before any run, and it already answers the RQ's single-target arm.
      STAGE 1 (minutes, THE CHEAPEST VALID DISCRIMINATOR): STEP 3's source audit
      plus a per-step field-operation counter run on two distinct members of ONE toy
      class at matched seeds. Two numbers decide (B)(ii): is the addition path
      (a,b)-free in the source, and are the per-addition operation counts EXACTLY
      equal across the two curves. Neither requires solving a discrete logarithm and
      both run in minutes. If either fails, the derivation is dead and nothing else
      in this record is worth running.
      STAGE 2 (minutes): the two baseline-embedding checks -- singleton class and
      two models of the same curve.
      STAGE 3 (low compute, BLOCKING): STEP 5's composite-order nearby-object
      control, derived and measured.
      STAGE 4 (low compute, CONFIRMATION ONLY): STEP 6's single-class run of
      20b05f's S(C) at reduced seed budget, declared in advance to be uninformative
      on a pass.
      STAGE 5 (zero compute): STEP 7's handover of OPEN-1 to lane L1.
    controls:
      - >-
        TWO MODELS OF THE SAME CURVE under (x,y) -> (u^2 x, u^3 y): per-step
        operation counts must be EXACTLY equal. Estimator zero point. BLOCKING.
      - >-
        SINGLETON CLASS: derived and measured S(C) exactly 1.
      - >-
        COMPOSITE-ORDER CLASS with mixed 4-torsion availability: derived and
        measured spread must be LARGE. BLOCKING.
      - >-
        j = 0 AND j = 1728 ARMS as positive controls: the derivation must reproduce
        the sqrt(|Aut|/2) ceiling that EV-ENDO-10109d measures at 1.0043 and 1.0442,
        and any |Aut| term must be attributed to the automorphism discount and NOT
        to the model column.
      - >-
        SEED-NOISE NULL resampled at the SAME class size m, since S(C) is a max/min
        order statistic and grows with m from noise alone.
      - >-
        SEMAEV NEARBY OBJECT: the cost argument must FAIL to apply. BLOCKING.
      - >-
        Matched Pollard rho and BSGS rows on every vertex, per the RQ's mandatory
        controls, with the automorphism-discounted baseline on CM vertices.
