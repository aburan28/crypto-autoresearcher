idea:
  id: IDEA-20260830-a22049
  question_id: RQ-MTGT-2cabee
  added: '2026-08-30'
  title: >-
    THE CLASS SPREAD IS DERIVABLE, NOT MERELY MEASURABLE, AND THE DERIVATION
    CLOSES THE SINGLE-TARGET TRANSFER ARM BY COMPOSITION: IDEA-20260829-20b05f
    eliminates the curve-model column with an INFORMATION argument (a birational
    change of model is invertible, so it discards nothing) but RQ-MTGT-2cabee
    mandates a CHARGED model, in which a change of coordinates is not free -- the
    correct elimination is a COST argument, and it succeeds for rho for a sharper
    reason than 20b05f gives, namely that short-Weierstrass point ADDITION formulas
    contain neither a nor b, so an r-adding walk step costs the identical field
    operations on every class member; hence S(C) <= 1 + delta_dbl + seed noise on
    |Aut| = 2 vertices as a DERIVATION, and since EV-ENDO-10109d already charges
    transport at 1.5x to 21x, the arm is net-negative before it is measured -- while
    the same cost argument FAILS for non-group-level functionals, which is where the
    model column is genuinely live
  class: mechanism

  claim: >-
    (A) THE DEFECT IN THE ELIMINATION, STATED PRECISELY. IDEA-20260829-20b05f
    establishes, from Tate's isogeny theorem plus primality of N, that inside an
    ordinary prime-order F_p-isogeny class every order-derived quantity is constant,
    so the reachable-invariant set is contained in {j, f, |Aut|, curve model}, and
    then eliminates the model column by the lossy-projection test of
    docs/inventor-protocol.md section 2: "a birational change of model is
    INVERTIBLE, discards nothing, and is therefore a change of coordinates and not a
    new object." THAT ARGUMENT IS ABOUT INFORMATION. The lossy-projection test asks
    what a projection discards; an invertible map discards nothing and is correctly
    ruled out as a NEW OBJECT. But RQ-MTGT-2cabee's decision_target is not about
    objects, it is about COST in the full AT^2 model, and an invertible map is not
    thereby a FREE map. Montgomery and twisted-Edwards models have strictly cheaper
    group laws than short Weierstrass in field-multiplication counts; a = -3
    reduction changes Jacobian doubling from 8M+3S to 4M+4S. So a change of model is
    a change of coordinates AND a change of charged cost, and the test that
    eliminates it as an object does not eliminate it as a cost column. THE
    ELIMINATION OF COLUMN (iv) IS THEREFORE UNJUSTIFIED AS WRITTEN, and any
    S(C) computed under it is measuring the residual of an argument that has not
    been made.

    (B) THE REPAIR, WHICH REACHES THE SAME VERDICT FOR RHO BY A DIFFERENT AND
    SHARPER ROUTE. Do the cost argument.
      (i) INSIDE A PRIME-ORDER CLASS, THE CHEAP MODELS ARE UNAVAILABLE TO EVERY
        MEMBER SIMULTANEOUSLY. A Montgomery or twisted-Edwards model requires a
        rational point of order 2 or 4. N is prime and odd, so E(F_p) has no
        rational 2-torsion; by Tate every classmate has the same group of prime
        order N and therefore also none. So the entire Montgomery/Edwards branch of
        the model column is EMPTY inside this RQ's scope -- not by an information
        argument but because the required torsion does not exist on any member.
      (ii) WITHIN SHORT WEIERSTRASS, THE WALK STEP IS (a, b)-FREE. The affine
        addition law lambda = (y2-y1)/(x2-x1), x3 = lambda^2 - x1 - x2,
        y3 = lambda(x1-x3) - y1 contains neither a nor b, and the same holds for
        the standard Jacobian and projective addition and mixed-addition formulas.
        An r-adding Pollard rho walk is a sequence of ADDITIONS by precomputed
        partition offsets. THEREFORE THE CHARGED FIELD-OPERATION COST OF A RHO STEP
        IS IDENTICAL ON EVERY MEMBER OF THE CLASS, exactly, with no heuristic.
      (iii) THE ONLY (a)-DEPENDENT OPERATION IS DOUBLING, lambda = (3x^2+a)/(2y),
        where a = -3 or a = 0 saves at most one field multiplication out of the
        8M+3S of a Jacobian doubling, i.e. at most ~9%. Write rho_dbl for the
        fraction of walk steps that are doublings. Then the per-step cost spread
        across the class is at most delta_dbl = 0.09*rho_dbl, and for a pure
        r-adding walk rho_dbl = 0 and delta_dbl = 0 EXACTLY.
      (iv) THE STEP COUNT IS CLASS-CONSTANT UNDER THE RHO HEURISTIC. The expected
        number of steps is 0.886*sqrt(N)/sqrt(|Aut|/2) and N is class-constant by
        Tate; the walk's function graph differs per curve because the encoding
        differs, but under the standard rho idealisation that difference is
        seed-level noise with no systematic curve-level term. EV-ENDO-10109d's own
        N5 result supports this empirically at 20 seeds and two automorphism arms:
        ratio-to-ceiling means 1.0043 and 1.0442, symmetric noise, no systematic
        shortfall.
      CONCLUSION: S(C) restricted to |Aut| = 2 vertices satisfies
      S(C) <= 1 + delta_dbl + O(seed noise), with delta_dbl = 0 for an
      addition-only walk. THIS IS A DERIVATION OF 20b05f's READING 1, not a
      measurement of it.

    (C) THE COMPOSITION THAT CLOSES THE ARM, WHICH IS THE POINT. 20b05f defines
    S(C) as the exact upper bound on what any charged F_p-rational isogeny transfer
    could buy BEFORE the transfer is charged, and states in its own
    hidden_overhead that "an S(C) below 1.5 means the arm is net-negative at every
    tested ell even in the best case", because EV-ENDO-10109d measures the charged
    transport at 1.5x at ell=3 rising to 21x at ell=31 with no crossover. Claim (B)
    derives S(C) <= 1 + delta_dbl, which is below 1.5 for any rho_dbl below 5.6.
    THEREFORE THE SINGLE-TARGET CHARGED-TRANSFER ARM OF THIS RQ IS NET-NEGATIVE BY
    DERIVATION, at every tested ell, without running 20b05f's medium-compute STEP 3.
    That is a closure at the docs/inventor-protocol.md section 4 standard: named
    obstruction (the rho step cost is (a,b)-free and the step count is N-determined,
    so there is no rho-visible curve-level prize inside a prime-order class),
    argument (B), and forward guidance (D).

    (D) FORWARD GUIDANCE -- WHERE THE MODEL COLUMN IS GENUINELY LIVE, AND THE
    HANDOVER. The cost argument in (B) is specific to rho and it must be, because
    it turns on the (a,b)-freeness of the group addition law. It FAILS, and is
    expected to fail, for every cost functional that reads the curve equation:
      OPEN-1. SEMAEV SUMMATION POLYNOMIALS AND INDEX CALCULUS. Their coefficients,
        degrees and Groebner behaviour are functions of the curve model, and this
        is exactly IDEA-20260807-a2fb45's OPEN-1 and lane L1 (RQ-ICINV-475b5e). The
        model column is NOT eliminated there by any argument in this record and is
        handed over rather than absorbed.
      OPEN-2. FIELD-ARITHMETIC SPECIALISATION. A class member whose coefficients
        have a special form (small, sparse, or lying in a subfield-like set) may
        admit cheaper reductions in the constant. This is a constants question
        below the resolution of any measurement in this program and is recorded as
        such rather than pursued.
      OPEN-3. NON-PRIME-ORDER CLASSES. Step (B)(i)'s elimination of the
        Montgomery/Edwards branch uses primality of N and FAILS immediately for
        composite order, where a rational 4-torsion point can exist on some class
        members and not others and the model column carries a real 20-40%
        field-multiplication spread. This is the record's own nearby-object control
        and it is the sharpest thing in it: the derivation must produce a LARGE
        S(C) there, or it is not identifying the load-bearing structure.
      OPEN-4. WALKS THAT DOUBLE. A walk with a substantial doubling fraction has
        delta_dbl > 0 and the derivation gives only a bound, not an equality. The
        bound is still far below 1.5 for any realistic rho_dbl and the record says
        by how much.
      OPEN-5. THE AT^2 RECHARGE. (B) counts field operations. Under an AT^2 charge
        both arms are O(1)-memory walks with identical structure, so the argument is
        expected to be model-robust -- but that expectation is asserted, not proved,
        and IDEA-20260830-da8950 shows the lane's other comparison is NOT
        model-robust, so the assertion is flagged rather than assumed.

    (E) WHAT THIS DOES TO 20b05f, STATED PLAINLY AND WITHOUT OVERREACH. It does not
    refute it. 20b05f's column closure (A) survives with column (iv) re-eliminated
    on better grounds, and its measurement (B) becomes a CONFIRMATION test with a
    pre-registered predicted value rather than a discrimination between two open
    readings -- which LOWERS its information gain and therefore its priority, since
    READING 1 is now the derived expectation and only a violation is informative. A
    measured S(C) >= 1.30 on |Aut| = 2 vertices would refute this derivation and
    would be far more interesting than 20b05f's own framing allows, because it would
    indict either the rho heuristic or the implementation on a class where N is held
    exactly constant.

  mechanism: >-
    STEP 1 (zero compute). Write (A) out: quote 20b05f's elimination of column (iv),
    state why an information test cannot eliminate a cost column, and give the
    Montgomery/Edwards counterexample that shows invertible maps have unequal
    charged costs in general.
    STEP 2 (zero compute). Write (B)(i): N prime implies no rational 2-torsion on
    any class member, so the Montgomery and twisted-Edwards branches are empty
    inside this scope. State it as a torsion argument, not a taste argument.
    STEP 3 (zero compute, THE LOAD-BEARING VERIFICATION). Audit the harness's own
    group-law implementation and confirm, at the level of the source, that the
    addition path reads neither a nor b, and identify every code path that does read
    a. Report rho_dbl, the measured fraction of walk steps that take the doubling
    path, from the committed rho runs. This is a code audit and a counter read, not
    an experiment.
    STEP 4 (zero compute). Assemble the bound S(C) <= 1 + 0.09*rho_dbl + seed noise
    and compose it with EV-ENDO-10109d's 1.5x-to-21x charged transport to produce
    the signed net-value ledger of (C).
    STEP 5 (low compute, THE NEARBY-OBJECT CONTROL, AND IT IS BLOCKING). Repeat the
    whole derivation for a COMPOSITE-ORDER class in which some members admit a
    rational 4-torsion point and hence a twisted-Edwards model. The derivation MUST
    give a large spread there. If it gives a small one, step (B)(i) is not what is
    doing the work and the prime-order conclusion is void.
    STEP 6 (low compute, CONFIRMATION NOT DISCRIMINATION). Run 20b05f's STEP 3 on
    ONE complete 16-bit class at reduced seed budget, purely to check the derived
    prediction S(C) <= 1.10 on |Aut| = 2 vertices against the seed-noise null at the
    same class size m. This is a cheap confirmation, and the record states in
    advance that a pass is uninformative and only a failure is news -- which is why
    it is STEP 6 and not STEP 1.
    STEP 7 (zero compute). Write the handover of OPEN-1 to lane L1 / RQ-ICINV-475b5e
    with the exact failing step named, and emit the closure.

  novelty_status: unverified

