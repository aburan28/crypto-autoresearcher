  heuristic_assumptions:
    - id: H1
      statement: >-
        CLASS-CONSTANT STEP COUNT. For two curves E, E' of the same prime order N in
        one F_p-isogeny class, both with |Aut| = 2, the expected number of r-adding
        rho walk steps to a collision satisfies
        Esteps(E)/Esteps(E') = 1 + O(s^{-1/2} * sd_seed), i.e. all difference is
        seed noise, because the walk on each curve behaves as a uniformly random
        function on a set of the same size N.
      rigorous_support: >-
        The rigorous ingredient is Tate's theorem, which forces #E(F_p) = #E'(F_p)
        exactly, so the two walks act on sets of identical size and the
        birthday-bound expectation 0.886*sqrt(N) is the same function of the same
        argument. The heuristic step is that each curve's partition walk is a
        uniformly random function of its own encoding, with no curve-level bias --
        the standard rho idealisation, imitating the birthday/coupon behaviour of a
        random function, and the same idealisation that underwrites the 0.886
        constant (KN-TECH-006) and Teske's measured r-adding walk quality.
      validation_plan: >-
        SAMPLE: every |Aut| = 2 vertex of one complete 16-bit ordinary prime-order
        class, 24 seeds per vertex, counted walk steps (not seconds). PREDICTED
        DISTRIBUTION: per-vertex mean step counts drawn from the same distribution
        as 24-seed resamples of a SINGLE vertex; compare by an F-test on the
        variance ratio and a two-sample Kolmogorov-Smirnov test, reporting both
        statistics with p-values rather than thresholds. TAIL CHECK: the observed
        extreme vertex against the predicted maximum of m draws from the seed-noise
        reference at the SAME m, since S(C) is an order statistic. DECAY CHECK:
        repeat at 18 and 20 bits and confirm any excess DECAYS as m^{-1/2}; a
        non-decaying excess is the canonical artefact tell of
        docs/inventor-protocol.md section 3 and is exactly what EV-ENDO-10109d
        reports for its OTHER instrument. SHORTCUT FOR LARGER PARAMETERS: none is
        used and none is needed; no transfer beyond 20 bits is assumed.
        SAMPLED PARAMETERS RECORDED: (p, t), N, m, seeds, ell set used for class
        enumeration, walk partition size r, doubling fraction rho_dbl, harness
        commit.
    - id: H2
      statement: >-
        IMPLEMENTATION FIDELITY. The harness's rho walk executes only addition and
        (with measured frequency rho_dbl) doubling on the curve, its addition path
        reads neither a nor b, and its per-step charged cost is therefore a function
        of p alone and not of the class member.
      rigorous_support: >-
        Not a distributional heuristic but a code fact, and it is stated here
        precisely so it is validated rather than assumed. The mathematical half --
        that the standard affine, projective and Jacobian addition formulas for
        y^2 = x^3 + ax + b omit a and b -- is textbook and is marked recalled among
        the citations; the implementation half is unverified until STEP 3.
      validation_plan: >-
        AUDIT, NOT SAMPLING, and it is blocking: an AST-level scan of the harness
        group-law module listing every expression that references the curve
        coefficients, together with a call-graph check that the rho step function
        reaches none of them except through the doubling path. PLUS a differential
        counter check: run the identical seeded walk on two class members and assert
        exact equality of the per-addition operation counts. A single inequality is
        a blocking failure. The audit result is pinned to a commit hash and must be
        re-run before any later reuse of this record's bound.

  target_complexity:
    time_exponent: >-
      1/2 in N, UNCHANGED, and the record explains why no exponent can move by this
      route: the transfer arm cannot touch any order-derived quantity (20b05f's
      column closure) and the one remaining column that could carry charged cost --
      the curve model -- is shown here to carry exactly zero for r-adding rho and at
      most 0.09*rho_dbl including doublings. The prize is a constant below 1.10 and
      the charge is 1.5x to 21x.
    memory_exponent: >-
      O(1) for rho, unchanged in both arms. Nothing here introduces a store.
    best_known: >-
      Parallel rho with distinguished points at 0.886*sqrt(N) group operations and
      O(1) memory (KN-TECH-001, KN-TECH-006); automorphism-discounted rho, a
      constant of at most sqrt(6) on CM curves (KN-TECH-018); BSGS at sqrt(N) time
      and memory with full cost N^{2/3+o(1)} (KN-TECH-031, KN-TECH-035);
      Bernstein-Lange preprocessing at S = T = N^{1/3} on the CGK frontier
      S*T^2 = Omega~(N) (KN-TECH-005, KN-LIT-013); Kuhn-Struik multi-target rho at
      sqrt(M*N). THIS RECORD BEATS NONE OF THEM AND REMOVES A ROUTE TO BEATING ONE.
    hidden_overhead: >-
      Disclosed. (1) The derived bound flatters the transfer arm by construction --
      S(C) is measured before the transfer is charged, exactly as 20b05f states, so
      the honest net figure is the composition in (C) and never S(C) alone. (2) The
      per-step equality is exact only in counted field operations; wall clock,
      cache and vectorisation can differ between curves for reasons this argument
      does not cover, and no wall-clock spread may be read as S(C). (3) H2 is an
      assertion about code and expires with the commit it was audited against.
      (4) delta_dbl is bounded from a recalled 8M+3S versus 4M+4S figure that was
      not opened this session.
    tradeoff_note: >-
      No time-memory tradeoff is introduced; rho stays O(1) memory on every class
      member, which is itself part of the argument -- the two curves occupy the same
      point of the area-time surface as well as the same operation count, so unlike
      the preprocessing comparison of IDEA-20260830-da8950 there is no depth or area
      asymmetry available to flip the verdict. That expectation is asserted rather
      than proved and is recorded as OPEN-5. Parallelization position: identical on
      every class member, since the walk is van Oorschot-Wiener parallel with small
      per-processor storage regardless of j, f or model.

