  sr2_model_statement:
    calibration_target: >-
      The OBJ-5 object of TASK-20260903-4fdf77 (bimodal seed heterogeneity
      within the disclosed phi range, arithmetic mean held at lambda_plan),
      adopted as the calibration target by DEC-20260903-afdd06.
    model_name: M-PH
    statement: >-
      At k = 4, n = 4 independent arms with deterministic bimodal per-arm
      rates: two arms Poisson(lambda_plan - d), two arms Poisson(lambda_plan +
      d), d = sqrt(lambda_plan * (phi - 1)). At k = 16, n = 4 arms homogeneous
      Poisson(lambda_plan). lambda_plan = 16 is the planning constant, exposure
      is 2^30 per arm, and all arms are independent (H2 holds). The phi grid
      is 1.0, 1.25, 1.5, 1.75, 2.0.
    key_structural_fact: >-
      For every phi on the grid, the pooled totals T_4 and T_16 remain
      independent Poisson with the same mean as the homogeneous plateau truth,
      so the primary statistic's marginal law is unchanged and heterogeneity
      enters Branch 4 only through the homogeneity gate. This is stated as a
      model fact; the quantitative false-positive bound, its monotonicity, and
      its breakage conditions are in pooled-exposure-pricing.json and are not
      restated here.
    bound_location: pooled-exposure-pricing.json plateau_heterogeneity_sensitivity.bound

  sr3_remedy_statement:
    option_chosen: a
    option_declined: >-
      Option (b), raised n, was considered and declined with arithmetic in the
      pricing file; no raised-n design is part of this revision.
    conjunct_named: >-
      In addition to the inherited Branch-4 conjuncts, at BOTH primary points
      k in {4, 16} the dispersion index D_k must be strictly below the margin
      threshold c_margin = chi2_{0.95}(n_k - 1), where the Branch-H critical
      value remains c_gate = chi2_{0.99}(n_k - 1). At the recommended n_k = 4
      the thresholds are chi2_{0.95}(3) and chi2_{0.99}(3); exact decimal
      values and satisfiability arithmetic are in pooled-exposure-pricing.json
      sr3_remedy and are not restated here.
    margin_rationale_pointer: >-
      CORRECTED (RT2-SR-1). The margin threshold c_margin = chi2_{0.95}(n_k - 1)
      is preregistered from the null law, and q = 0.95 is a CONVENTIONAL level
      choice from among the level quantiles {0.90, 0.95, 0.975} of the
      dispersion index's null reference law that lie below the Branch-H gate
      c_gate = chi2_0.99(n_k - 1), not a uniquely forced one: chi2_0.975(3) =
      9.348404 is a larger null-law level quantile still below the gate at
      n_k = 4. The level q = 0.95 was fixed in the revision session with the
      OBJ-5 calibration arithmetic in view, while no realized reading and no
      OBJ-5 outcome enters the threshold value. Full corrected rationale in
      pooled-exposure-pricing-v2.json
      sr3_remedy.conjunct.margin_rationale_preregistered_from_the_null_law;
      the corrected pricing file is named in companion_artifacts below.
    routing_change: >-
      Readings with c_margin <= D_k < c_gate at either primary point route to
      FM-UNRESOLVED. Branch ordering, mutual exclusivity, exhaustiveness and
      pre-arm domain-fixing are preserved; no new branch is created.

