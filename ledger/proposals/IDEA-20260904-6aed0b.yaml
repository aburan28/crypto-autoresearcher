  mined_families_declared_off_limits: >-
    The corpus already reports this target as heavily mined along four established
    lenses, and none of them is the primary lens of this design: (a) the PER-ARM HIT COUNT
    h(k) at fixed 2^30 exposure - the object of every committed batch since BATCH-7b798d;
    (b) the BAND ASSIGNMENT / bandrank sequence - the object of SH2-MONOTONE-DECAY and of
    CC3-SUBLOCALIZE-LATE; (c) the PER-SEED DECAY RATIO r(k_a, k_b) between adjacent grid
    points - the object of CC-AGREE and of the count-completion batch; (d) the COUNTER
    IDENTITY / overflow surface - mined exhaustively as a GATE (AMEND-1) but never as a
    lens. Declaring them off-limits as the primary lens is what forces the enumeration
    below rather than a fifth variation on h(k).

  object_enumeration:
    method_note: >-
      Object-first per docs/inventor-protocol.md sections 1-2. Each candidate is scored on
      three axes: genuinely new or a repackaging; concretely testable (can its one-step
      propagation be defined and measured); how far it survives before the structure
      dissolves. NOTE, as the role contract requires: this program has no written
      object-enumeration for its own targets (KN-OPEN-019 for the ECDLP; nothing
      comparable exists for RQ-AES-003), so the family-to-object mapping used here is a
      SKETCH, not a taxonomy, and its completeness is unverified.
    candidates:
      - id: O1
        object: >-
          The pooled Poisson intensity lambda_k, i.e. the floor rate per 2^30 at point k
          estimated over a variable number of arms rather than one.
        novelty: >-
          ADAPTATION, not new. At n = 1 arm it is literally h(k) in different units - a
          change of coordinates, which the lossy-projection test says is not a new object.
          It becomes a different object only when n > 1, and then only because the per-arm
          decomposition is discarded.
        testable: >-
          Yes. One-step propagation is exactly defined: adding an arm adds one exposure
          unit and adds its count to the sum. The propagation is deterministic given
          exposure additivity, which is a testable assumption and is tested (heuristic H3).
        survival: >-
          Survives until between-arm heterogeneity dissolves the single-lambda description.
          That dissolution point is itself measurable and has a branch (FM-OVERDISPERSED).
      - id: O2
        object: >-
          The EXPOSURE-FREE RATE RATIO rho = lambda(4)/lambda(16), read as the parameter of
          the conditional binomial law of one point's count given the pair's total.
        novelty: >-
          ADAPTATION with a genuinely new property in this campaign: it is invariant under
          any common-mode rate perturbation and under any change of exposure. No committed
          record tracks an exposure-free quantity; every committed quantity is a count at a
          fixed exposure or a ratio of two such counts WITHOUT an exact conditional law.
        testable: >-
          Yes, and exactly: conditioning a pair of independent Poisson counts on their sum
          gives an exact binomial law, so the one-step propagation is a closed-form
          conditional distribution with no approximation anywhere.
        survival: >-
          Survives common-mode drift, thermal variation, wall-clock length and exposure
          changes. Dissolves only under POINT-SPECIFIC heterogeneity - a much narrower
          failure mode than O1's.
        selected: true
        selection_reason: >-
          THIS IS THE DESIGN'S PRIMARY OBJECT. It survives strictly further than O1 under
          the perturbations this design's own new regime introduces (a batch several times
          longer than any predecessor), and it is the object that breaks the observation
          collision described under proof_search_map.
      - id: O3
        object: >-
          The per-arm count VECTOR (X_1, ..., X_n) at a point, with its Poisson dispersion
          index - precisely what O1 and O2 discard.
        novelty: adaptation; standard, and used here as a CONTROL object rather than a lens.
        testable: >-
          Yes: conditional on the point total, the per-arm counts are exactly multinomial
          under homogeneity, so the dispersion index has an exact reference law.
        survival: >-
          Survives as long as arms are independent; it is the object whose behaviour
          licenses or forbids the use of O1 and O2, so it is measured FIRST.
        role_in_this_design: >-
          It is the null-object control for the pooling operation itself. Its branch
          (FM-OVERDISPERSED) fires before any magnitude sentence can be composed.
      - id: O4
        object: >-
          The inter-hit gap structure - the trial indices at which hits occur, i.e. the
          waiting-time process rather than its count.
        novelty: genuinely different projection; no committed record tracks it.
        testable: in principle yes; at floor magnitude the receipts are unsaturated so the detail log is complete.
        survival: not assessed - the object is CLOSED before assessment, see below.
        closed: true
        closure_mechanism: >-
          BARRED BY THE STANDING GATE, not by taste. AMEND-1 conjunct (c) makes any
          analysis-bearing quantity derived from the capped detail log a gate failure. The
          gap structure is a detail-log quantity by definition. Even though floor receipts
          are unsaturated and the log is therefore complete at floor magnitude, the gate is
          written over the CLASS of detail-log-derived quantities, not over the saturated
          subclass, and no post-hoc rescope is available (RT3-A, no post-hoc rescue).
        forward_guidance: >-
          What remains open: a successor could seek a PROSPECTIVE amendment scoping
          AMEND-1(c) to saturated receipts only, on the argument that on an unsaturated
          receipt the log is the complete hit set rather than a biased first-256-per-thread
          sample. That is a Coordinator decision with its own review, not something this
          design may assume, and it would need its own proves-too-much control. Recorded so
          the object is not lost.
      - id: O5
        object: >-
          The W-distribution above 1 at floor magnitude - the shape of the whist tail among
          hit trials, a counter-derived and therefore AMEND-1-admissible object that h(k)
          discards entirely.
        novelty: >-
          Genuinely unmined at floor magnitude. Every committed W-distribution observation
          in this campaign is at THRESHOLD magnitude (the k = 0 anchor's W = 3 on 100
          percent of nontrivial trials, and the mask-14 word-counter structure at k = 1).
          Nobody has looked at the W tail of the floor.
        testable: >-
          Yes, and free: it rides along on receipts the design already produces, and it is
          counter-derived so AMEND-1 admits it.
        survival: >-
          Sparse. At a floor point a pooled design of the size proposed here yields of
          order tens of hits, which cannot support a distributional verdict. It survives as
          REPORT-ONLY enabling data and as the successor lens once exposure grows.
        role_in_this_design: >-
          DECLARED REPORT-ONLY. No branch conjunct consumes it, so AMEND-1(c) and the
          no-quiet-spending discipline are both satisfied by construction. Named here as
          the highest-value free rider and as forward guidance.

  object: >-
    TRACKED OBJECT - THE EXPOSURE-FREE FLOOR RATE RATIO rho = lambda(4)/lambda(16) BETWEEN
    THE TWO EXTREME POINTS OF THE RESIDUAL FLOOR, read through the exact conditional law of
    one point's pooled count given the pair's total. Secondary and report-only: the pooled
    intensity lambda_k itself (O1), the per-arm count vector and its dispersion (O3, the
    control object), and the floor W-tail (O5). WHAT IS DELIBERATELY NOT THE OBJECT: the
    band assignment and the bandrank sequence (composed, immutable, not re-composed here);
    the transition position inside (3,4] (RANK 2's question, not this one); the per-seed
    adjacent-pair decay ratio at THRESHOLD magnitude (mined, and its ~1 percent window is
    magnitude-specific and does not port to floor magnitude - the proves-too-much record of
    TASK-20260903-12a09f RT-J8); the count level at k = 8 (NARROW-5; k = 8 enters this
    design as a declared report-only secondary and no count verdict is drawn there); k = 12
    (frozen, never measured in any batch); the schedule-versus-dilution decomposition
    (PINCTRL-1, RANK 3, untouched); the detail-log gap structure (O4, closed by AMEND-1(c));
    the X lane, the carrier, rho-exclusion, deployed AES, and any published-cryptanalysis
    comparison in either direction.

  lossy_projection_test: >-
    APPLIED, AND IT RETURNS A QUALIFIED ANSWER RATHER THAN A FLATTERING ONE. The underlying
    state is the full trial ensemble (S_k, key, seed, stream, the per-trial W value of every
    one of 2^30 trials, the trial ordering, and the arm identity). The projection is
    state -> (T_4, T_16), the two pooled counts of trials with W >= 1. It discards: which
    trials hit; the W value above 1 of every hit; the trial ordering; and - the loss that
    matters - WHICH ARM each hit came from. The fibres are astronomically large; the loss is
    the point. FIRST OWNED EDGE, and it is a concession: at n = 1 arm per point this
    projection is NOT new. h(k) at fixed 2^30 and lambda_k at n = 1 are the same object in
    different units, i.e. a change of coordinates, which the lossy-projection test says is
    not a new object at all. The projection becomes genuinely different only at n > 1, and
    the thing that makes it different is exactly the per-arm decomposition it throws away.
    SECOND OWNED EDGE, and it is the design's central discipline: that discarded
    decomposition is NOT automatically discarded compatibly with the target's operations.
    Pooling propagates deterministically only if a single rate governs every arm at a point
    - exposure additivity. If seeds carry rate heterogeneity, the retained part does NOT
    propagate deterministically and the projection is lossy in the bad way. This design
    therefore does not assume the compatibility; it MEASURES it, with the per-arm count
    vector (O3) as an explicit control object and a branch that fires when the compatibility
    fails, evaluated BEFORE any pooled sentence exists. THIRD OWNED EDGE: the choice of
    rho over lambda is itself a further projection - it discards the overall scale and keeps
    only the contrast - and that discard is what buys invariance to common-mode drift over a
    batch several times longer than any predecessor. It also loses something real: rho
    cannot say whether the floor is high or low, only whether one point is above the other.
    The design therefore carries lambda alongside as report-only, and says so.

  # ------------------------------------------------------------------
  # CLAIM
  # ------------------------------------------------------------------
  claim: >-
    THE DESIGN CLAIM, stated in the form the review plan requires the producer to state it.
    The pooled-exposure design specified in preregistration-skeleton.md, at the exposure
    priced in pooled-exposure-pricing.json and under the AMEND-1 gate quoted verbatim above,
    discriminates between {the residual floor is a constant nonzero plateau across the
    tested k}, {the residual floor is still decaying with k}, and {the residual floor is
    indistinguishable from the analytic comparator} at the stated power and alpha, within
    the priced budget, and licenses exactly the sentences enumerated per branch in
    branch_licensing below and no others. THREE QUALIFICATIONS ARE PART OF THE CLAIM AND NOT
    footnotes to it. (Q1) The three alternatives are NOT equally live at the priced
    exposure. The comparator alternative is already decided against by the committed
    readings, and the pricing file confirms quantitatively that its branch fires with
    probability below 3e-15 under the design prior; it is a REACHABLE CONTROL BRANCH, not a
    live outcome. The informative discrimination is floor-versus-floor, and the design says
    so before any arm runs. (Q2) The discrimination is at a PREREGISTERED RESOLUTION, not at
    the resolution of the realized point estimates. The recommended design decides a
    factor-two decay at high power and confines the ratio to a factor of 1.5 under plateau
    truth; it is honestly under-powered against the finer separation named in the
    Coordinator prior, and the exposure that would buy that finer separation is priced in
    the same file and is roughly an eighth as affordable. (Q3) The plateau branch licenses a
    CONFINEMENT sentence at a stated resolution, never a constancy sentence, never a
    completion sentence, and under NARROW-1 never an extinction sentence.

  claim_scope: >-
    Cell (amask = 1, smask = 1). r = 5 for floor arms, r = 6 for null-object arms. Points
    k = 4 and k = 16 primary; k = 8 secondary and report-only; k = 0 anchor only. 2^30
    trials per arm. PIN-T0. Frozen build only. Committed seed list only. Toy tier. Nothing
    else, anywhere, in any branch.

  # ------------------------------------------------------------------
  # MECHANISM
  # ------------------------------------------------------------------
  mechanism: >-
    NO NEW STRUCTURAL MECHANISM IS PROPOSED OR CONSUMED. The mechanism this record supplies
    is a MEASUREMENT mechanism, and it has exactly one non-obvious moving part. The
    committed state of the campaign is that the floor is alive (a decidable excess over the
    analytic comparator) but its MAGNITUDE relative to that comparator, and relative to
    itself across k, is COUNT-UNRESOLVED: the exact intervals at the five committed readings
    overlap pairwise and their triple intersection is non-empty. That non-resolution is not
    a defect of the readings; it is the arithmetic of Poisson counts of order fifteen. The
    only two ways to shrink it are more exposure per arm or more arms. This design takes the
    second, and the reason is not statistical taste: exposure per arm and arms per point buy
    the SAME precision per unit of wall clock at this instrument's fixed throughput, but
    arms additionally deliver the seed dimension - which is the dimension in which every
    committed non-resolution in this campaign has actually lived - and they deliver the
    homogeneity test that a single long arm cannot deliver at any exposure. The
    non-obvious part is the choice of statistic. Conditioning the pair of pooled counts on
    their total gives an exact binomial law whose parameter is a monotone function of the
    rate ratio and in which the exposure CANCELS. That has three consequences the design
    uses: the test needs no distributional approximation at any sample size; any common-mode
    drift in the instrument over a long batch cancels; and the plateau hypothesis becomes
    the exactly symmetric point of an exact discrete law, which is what makes an equivalence
    criterion - and hence a defensible plateau sentence - definable at all. The interleaved
    run order is the design element that makes the common-mode cancellation real rather than
    nominal.

  artifact_signature_warning: >-
    STATED UP FRONT BECAUSE IT CUTS AGAINST THE DESIGN'S MOST INTERESTING OUTCOME.
    docs/inventor-protocol.md section 3 names the canonical structural tell: a quantity that
    should decay as the parameter meant to destroy it increases, and does not, is the
    signature of an ARTIFACT rather than of structure. The residual floor is precisely such
    a quantity - the curve fell by orders of magnitude per dilution step through k = 3 and
    then stopped falling across k = 4, 8, 16. Therefore, if this design's plateau branch
    fires, the leading interpretation on the record is artifact-first, not structure-first,
    and the batch's own measured null object is the control that must be read beside it. The
    design does not get to treat a plateau as a discovery. This is written into the plateau
    branch's licensing statement in the preregistration skeleton, not left to the reader.

  why_not_a_renamed_known_approach: >-
    Five things in this design are unowned by any committed record of this campaign, and one
    thing in it is deliberately a repackaging and is labelled as such. NEW: (i) the first
    EXPOSURE-FREE object - every committed quantity is a count at fixed exposure or a ratio
    of two such counts without an exact conditional law; conditioning on the total is what
    removes the exposure and it has never been done here. (ii) The first EQUIVALENCE
    criterion in this campaign - every committed rule routes on rejection or on interval
    overlap, and no committed rule can license a positive same-ness sentence at a stated
    resolution; without one, a plateau branch would convert an underpowered null result into
    a claim, which is the single most likely way this campaign could overclaim next. (iii)
    The first MEASURED null object at pooled exposure, with a preregistered
    operative-comparator rule that lets the control change the answer instead of decorating
    it; the pricing file shows this control is materially more expensive than it looks and
    the design pays for it. (iv) The first INTERLEAVED run order and the first preregistered
    run-order test, introduced because this batch would be several times longer than any
    predecessor and instrument stationarity across that span is genuinely unestablished. (v)
    The first NEW-ARMS-ONLY test discipline: the five committed readings selected the
    hypothesis, so they are barred from the test statistic and are demoted to a report-only
    consistency comparison; the retrospective alternative is computed in the pricing file
    precisely in order to decline it, following the priced-and-declined precedent of
    IDEA-20260903-8f26ac. REPACKAGED, AND LABELLED: the pooled Poisson intensity itself (O1)
    is a change of coordinates on h(k) at n = 1 and is not claimed as new; the Garwood/exact
    Poisson machinery is the campaign's own standing convention and no external method is
    imported.

