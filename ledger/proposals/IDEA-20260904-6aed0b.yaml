  # ------------------------------------------------------------------
  # HEURISTIC ASSUMPTIONS
  # ------------------------------------------------------------------
  heuristic_assumptions:
    - id: H1
      statement: >-
        POISSON COUNTING MODEL. For fixed (k, r, cell, exposure, build, pin) and a fixed
        (seed, armid) seat, the hit count of one arm is distributed Poisson(lambda_k * E)
        with E = 1 exposure unit of 2^30 trials, independently of the seat.
      rigorous_support: >-
        Hits are counts of a rare event over 2^30 near-independent trials with per-trial
        probability of order 1e-8. This is the Poisson-limit regime, and the assumption
        imitates the classical law of small numbers (the Poisson limit theorem for rare
        events in independent Bernoulli trials). The campaign's entire committed CI
        apparatus - every Garwood interval in every evidence record - already rests on this
        same model, so H1 is not new here; what is new is that this design TESTS it.
      falsification_condition: >-
        The Poisson dispersion index of the per-arm counts at either primary point exceeds
        its chi-squared critical value at the preregistered homogeneity level on n - 1
        degrees of freedom. This fires branch FM-OVERDISPERSED and forbids every pooled
        magnitude sentence.
      validation_route: >-
        Sampled quantity: the n per-arm hit counts at each primary point, at 2^30 trials per
        arm, cell (1,1), r = 5, PIN-T0, frozen build, distinct committed seeds at a fixed
        seat. Scale: four arms per point in the recommended design, giving three degrees of
        freedom. Comparison distribution: chi-squared on n - 1 df for the dispersion index;
        the exact reference law is the conditional multinomial given the point total. Tail
        check: the maximum per-arm count compared against the upper tail of Poisson at the
        realized pooled rate. Sampled parameters and transfer assumptions: the check is valid
        ONLY at the sampled point, exposure and cell; no transfer to other k, other exposures
        or other cells is asserted.
      honest_power_disclosure: >-
        At four arms per point this test detects only gross overdispersion. A seed-to-seed
        rate heterogeneity of 20 to 50 percent is NOT detectable at this sample size, and the
        pricing file quantifies what such heterogeneity does to the realized size of the
        primary test. This is the recommended design's most important unmeasured risk and it
        is not removable by more exposure per arm - only by more arms.
    - id: H2
      statement: >-
        INDEPENDENCE ACROSS ARMS. Distinct (seed, armid) pairs generate disjoint thread
        streams, so counts from distinct arms are mutually independent random variables.
      rigorous_support: >-
        The stream derivation of the frozen build is a source-level fact of the instrument
        (seed XOR armid-multiple XOR thread-multiple, per the derivation recorded in
        IDEA-20260903-8f26ac's seat-fixed convention), and the campaign's committed
        second-seed draws at k = 1, 4, 8 and 3 are already treated as independent on exactly
        this basis. The assumption imitates the standard treatment of disjoint PRNG
        substreams as independent sources.
      falsification_condition: >-
        Two distinct committed (seed, armid, thread) triples derive the same stream seed; or
        the per-arm counts show a variance materially below Poisson - a negative-correlation
        signature of stream reuse - in the same dispersion statistic used for H1.
      validation_route: >-
        PRE-ARM AND FREE: enumerate the derived per-thread stream seeds over every (seed,
        armid, thread) triple in the committed domain and verify pairwise distinctness. This
        is an algebraic check at zero compute and it must run BEFORE any arm; a collision is
        a hard gate failure. IN-ARM: the same dispersion statistic as H1, read in the
        under-dispersed direction. Additionally an identical (seed, armid, build) re-run at
        reduced exposure is the determinism double - recorded as certification of the
        instrument and NEVER as replication (NARROW-3).
      new_risk_disclosed: >-
        This design introduces seeds the campaign has never used. The stream-distinctness
        check exists because that is the specific new risk, and it is the cheapest possible
        guard against it.
    - id: H3
      statement: >-
        EXPOSURE ADDITIVITY. A single rate lambda_k governs every arm at point k, so the sum
        of n arm counts is Poisson(n * lambda_k) and n arms at 2^30 are statistically
        equivalent to one arm at n times 2^30.
      rigorous_support: >-
        H1 and H2 jointly imply it; it is stated separately because it is the assumption the
        POOLING OPERATION uses, and it is the one that fails first if the instrument's rate
        depends on the seat or the seed rather than only on k.
      falsification_condition: >-
        Identical to H1's - the dispersion test at the preregistered homogeneity level -
        because heterogeneity in lambda across arms is exactly the failure of additivity.
        Branch FM-OVERDISPERSED.
      validation_route: >-
        As H1. Note what CANNOT be validated here and is therefore stated as a limitation
        rather than assumed away: exposure additivity ACROSS the 2^30-to-2^32 boundary is
        not tested by anything in this design, because the design never runs a 2^32 arm. Any
        successor that escalates per-arm exposure must validate additivity at the new
        exposure independently and must re-freeze.
    - id: H4
      statement: >-
        INSTRUMENT STATIONARITY. The rate lambda_k is stationary over the wall-clock span of
        the batch and over the machine and thermal states it traverses.
      rigorous_support: >-
        NONE AVAILABLE, and this is the honest position. This is a genuinely new exposure
        regime: predecessor batches ran of order eight arms, the recommended design runs
        seventeen, and no committed record contains a stationarity measurement of any kind.
        The assumption imitates the stationarity that any pooled-exposure counting
        experiment must assume; here it is assumed with no supporting bound and is instead
        DESIGNED AROUND.
      falsification_condition: >-
        The Spearman rank correlation between per-arm count and run index, computed within
        each primary point, is significant at the preregistered run-order level.
      validation_route: >-
        The design element IS the validation. Floor arms are run INTERLEAVED across k = 4 and
        k = 16 in a run order committed pre-arm, never blocked by point. Under interleaving,
        any monotone drift acts as a common-mode multiplier on both points and CANCELS in
        the conditional statistic, because that statistic depends only on the ratio. The
        run-order test is then reported in every branch as a disclosure rather than as a
        gate. A blocked run order would confound drift with k and is barred by the
        preregistration.
      why_this_matters_here: >-
        This is the one assumption whose failure a longer batch makes more likely rather than
        less, and it is the specific reason the primary object is the exposure-free ratio
        rather than the pooled intensity.
    - id: H5
      statement: >-
        NO CAP OR OVERFLOW INTERACTION WITH THE ESTIMATOR. At floor magnitude every
        analysis-bearing floor and null receipt is UNSATURATED, so the detail-log cap is
        never reached, the overflow counter is exactly zero, and the estimator - which
        consumes only the cap-independent hit counter - is unaffected by the cap in any
        branch.
      rigorous_support: >-
        AMEND-1's own admissible-quantities list makes counter-derived quantities
        cap-independent, source-verified at TASK-20260901-87a39b check 7 and re-confirmed at
        source level by IDEA-20260903-8f26ac. The predicted saturation status of every arm
        class in this design, and the exact form of the saturation-aware identity, are in
        the pricing file.
      falsification_condition: >-
        Any floor or null receipt with a nonzero overflow counter, or with a hit count above
        the per-batch detail-log capacity, or any analysis-bearing quantity in the composed
        record traceable to a detail-log record rather than to a counter. Any of these is a
        hard AMEND-1 gate failure.
      validation_route: >-
        The saturation-aware AMEND-1 identity is checked on EVERY receipt of the batch,
        including the k = 0 anchor, which is saturated by construction and is the
        proves-too-much control that the gate has not been rescoped into vacuity. The
        specific interaction the J-S attack plan names - whether pooling changes the cap's
        behaviour - is answered in the pricing file: the cap is per-arm and per-thread, and
        pooling sums counters rather than detail records, so raising the arm count cannot
        move any receipt toward saturation.
    - id: H6
      statement: >-
        THE COMPARATOR. The analytic comparator of one accidental hit per 2^30 is an upper
        bound on the instrument's own null rate in the tested configuration, so a floor rate
        materially above it is an excess rather than an instrument background.
      rigorous_support: >-
        The comparator is the campaign's frozen excess convention, not a measurement. The
        campaign's TWO statements about its own null are in tension - three consecutive
        zero-hit r = 6 re-seats on one side, a cited pooled r = 6 rate of about 1.72 per 2^30
        on the other - and the pricing file records that tension explicitly. H6 is therefore
        the weakest of the six and it is the only one this design promotes to a measured
        quantity rather than an assumption.
      falsification_condition: >-
        The exact one-sided 95 percent upper bound on the pooled measured null rate exceeds
        the analytic comparator. This does not halt anything: the preregistered
        operative-comparator rule replaces the analytic value with the larger measured bound
        and every branch statement is restated against it, weakening the composed sentences.
        A pooled null count at or above the hard threshold halts instead.
      validation_route: >-
        Sampled quantity: the pooled hit count over the batch's r = 6 matched dead-anchor
        arms at 2^30 each, same cell, same instrument, same counter path, at seeds drawn from
        a block disjoint from the floor seeds. Comparison: the exact one-sided Garwood upper
        bound against the analytic comparator. Tail check: the per-arm null counts against
        the Poisson tail at the pooled bound. Transfer assumption, DISCLOSED: the r = 6
        anchor differs from a floor arm in exactly one parameter, the round count, and that
        is precisely the parameter the sealed verdict says carries death versus life. It is
        the best measured null the campaign can currently run and it is not the ideal one.
      stronger_control_not_run: >-
        The ideal null of the floor's own shape is the 256-byte random-bijection control at
        r = 5, which differs from a floor arm in the S-box only. It is RANK 7, it needs its
        own build path and its own Coordinator decision, and it is NOT budgeted here. Its
        absence is this design's largest control gap and is stated rather than omitted, as
        the controls-before-belief constraint requires.

  # ------------------------------------------------------------------
  # PREDICTIONS
  # ------------------------------------------------------------------
  predictions:
    - id: P1
      metric: exact two-sided conditional-binomial p-value for the symmetric point, on the pooled counts at k = 4 and k = 16
      direction: lower under continued decay than under a plateau
      minimum_effect: >-
        The design is sized to reject at the preregistered level when the true rate ratio is
        at least the preregistered minimum detectable effect. The achieved power at that
        effect, and at two finer effects, is in the pricing file. A negative outcome (no
        rejection) is a real and reportable result and routes to a different branch.
    - id: P2
      metric: containment of the exact 95 percent interval for the rate ratio inside the preregistered equivalence interval
      direction: contained under plateau truth, not contained under decay truth or under insufficient exposure
      minimum_effect: the preregistered equivalence resolution, with the achieved resolution and its Clopper-Pearson widening disclosed in the pricing file
    - id: P3
      metric: exact one-sided 95 percent upper bound on the pooled measured null rate
      direction: at or below the analytic comparator if the instrument's null is where the frozen convention says
      minimum_effect: >-
        Both outcomes are informative and both change downstream sentences through the
        operative-comparator rule. The pricing file shows the bound is achievable only at
        specific null exposures and specific realized null counts, which is itself a finding.
    - id: P4
      metric: Poisson dispersion index of the per-arm counts at each primary point
      direction: consistent with its reference law under homogeneity; elevated under seed heterogeneity
      minimum_effect: the preregistered homogeneity critical value on n - 1 df, with the honest power disclosure of H1 attached
    - id: P5
      metric: Spearman rank correlation between per-arm count and run index within each primary point
      direction: null under stationarity; monotone under instrument drift
      minimum_effect: the preregistered run-order level; reported in every branch as a disclosure, never as a gate
    - id: P6
      metric: report-only consistency of the new pooled per-point rates against the five committed single-arm readings
      direction: consistent with the committed readings' exact intervals
      minimum_effect: >-
        DECLARED REPORT-ONLY AND NON-CONJUNCT. It is computed after the branch has fired and
        it can never move the branch. A gross inconsistency would be an instrument-review
        trigger, not a floor sentence.

  # ------------------------------------------------------------------
  # MINIMAL TEST
  # ------------------------------------------------------------------
  minimal_test:
    design: >-
      THE MEASURED NULL OBJECT ALONE, design D-0 of the ladder in the pricing file: the
      standing gate battery (build identity, KAT pins, freeze re-verification), the k = 0
      ramp-zero anchor as the AMEND-1 proves-too-much control, and the r = 6 matched dead
      anchor extended from one arm to a pooled block of arms at distinct committed seeds.
      SEVEN 2^30 arms in total. It runs no floor arm and composes no floor sentence.
    why_this_is_the_cheapest_valid_discriminator: >-
      Four reasons, in order of force. (1) It is a STRICT PREREQUISITE: the
      operative-comparator rule must fix the comparator before any magnitude sentence
      exists, so no floor design can compose its verdict without this measurement anyway.
      (2) It has a GENUINELY LIVE NEGATIVE OUTCOME, which is rare in this campaign's cheap
      arms: the campaign's own two statements about its own null are in tension by a factor
      that matters, and this arm block adjudicates between them. (3) It is roughly a THIRD
      of the cost of the cheapest design that touches the floor at all. (4) It is the
      controls-before-belief step of the protocol, which is supposed to run BEFORE the
      expensive arms rather than beside them.
    controls:
      - The k = 0 ramp-zero anchor, saturated by construction, as the AMEND-1 proves-too-much control (it must PASS, showing the rescoped gate is not vacuous).
      - The pre-arm stream-distinctness check over the newly introduced null seeds (zero compute, hard gate).
      - Paper routing of all four known-false objects through the rule before any arm runs.
    required_metrics:
      - pooled measured null count and its exact one-sided 95 percent upper bound
      - per-arm null counts, recorded individually and never smoothed
      - the resulting operative comparator, with both the analytic and measured values disclosed
      - AMEND-1 counter identities on every receipt in the saturation-aware form
      - build identity, KAT byte-identity, freeze re-verification mismatch count
    what_it_cannot_do: >-
      It cannot say anything about floor magnitude. It runs no floor arm and its branch
      structure contains no floor branch. Reporting it as progress on the floor question
      would be a category error.

  full_design_headline_totals:
    note: >-
      HEADLINE TOTALS ONLY. Arm counts and wall-clock seconds. Every derived quantity behind
      these totals - power, resolution, expected counts, thresholds - is in the pricing file
      and is not restated here.
    recommended_design_id: D-2
    recommended_design_arms:
      ramp_zero_anchor: 1
      r6_null_object: 6
      k4_primary: 4
      k16_primary: 4
      k8_secondary_report_only: 2
      total_2p30_arms: 17
    recommended_design_wall_clock_seconds:
      compute_component_binding_baseline: 27540
      compute_component_measured_hardware_estimate: 2635
      compute_component_measured_hardware_status: optimistic-relative, non-binding, disclosed
      declared_compute_cap: 29500
      authoring_component: 11700
      authoring_component_basis: campaign sizing basis, four producer tasks plus four snapshots plus validation, red team and ledger archive
    ladder_alternatives_available: >-
      D-0 (7 arms, 11340 s compute) is the minimal test above. D-1 (9 arms, 14580 s) is the
      minimal decisive floor contrast. D-2-lite (13 arms, 21060 s) drops the k = 8 secondary
      and two null arms. D-3 (25 arms, 40500 s) and D-4 (37 arms, 59940 s) buy finer
      resolution. All are priced in the pricing file; the choice among them is a Coordinator
      ranking decision, not a statistical one.
    build_cost_saving_disclosed: >-
      No Gate-0x extended rebuild is charged in any of these designs, because every point
      used is already on the frozen build's whitelist and in the committed freeze. That is
      about 54 minutes cheaper than the predecessor batch's extension stage and it is the
      main reason a 17-arm design is affordable at all.

  # ------------------------------------------------------------------
  # BRANCH LICENSING
  # ------------------------------------------------------------------
  branch_licensing:
    conjunct_location: >-
      Every branch conjunct is written out IN FULL in preregistration-skeleton.md sections
      3, 5.0 and 5.1 through 5.6, and that text is the binding version (RAT-3). The
      statements below are LICENSING STATEMENTS, not conjuncts, and no conjunct is
      paraphrased anywhere in this record.
    branches:
      - name: FM-GATE-FAIL / FM-ANCHOR-FAIL / FM-DEAD-ANCHOR-FAIL / FM-NULL-CONTROL-FAIL / FM-INADMISSIBLE-INPUT
        kind: gates and halts, evaluated before everything else
        licenses: >-
          An invalid_measurement or halt record with the failing gate named, the defective
          outputs preserved and the receipts untouched; and, for the dead-anchor tripwire, an
          escalation to claim-changing review.
        does_not_license: >-
          Anything about the floor. A gate failure, a budget exhaustion, a timeout or an
          infrastructure failure is never negative mathematical evidence (AGENTS rule 3,
          rule 5).
      - name: FM-OVERDISPERSED
        kind: homogeneity, evaluated before any pooling
        licenses: >-
          That the per-arm floor counts at the named point are over-dispersed relative to
          Poisson at the preregistered level, with the realized dispersion index and its
          degrees of freedom stated; and the named successors (a larger arm count to
          estimate the heterogeneity, and a re-priced design carrying the inflation
          explicitly).
        does_not_license: >-
          Any magnitude sentence whatsoever. No plateau, no decay, no comparator, no
          extinction, no completion. No statement about k = 8, k = 12 or any point outside
          the domain.
      - name: FM-COMPARATOR-INDISTINGUISHABLE
        kind: floor cascade branch 1, a reachable control branch
        licenses: >-
          Exactly one sentence: that at the realized pooled exposure per point, in cell
          (1,1) at r = 5 under PIN-T0, neither primary point is distinguishable from the
          operative comparator at the preregistered level; plus the instrument-review
          routing and the disclosed contradiction with the committed readings.
        does_not_license: >-
          ANY extinction sentence. Indistinguishable-at-this-exposure is a statement about
          resolution, not about absence, and NARROW-1 binds here as everywhere. Also not:
          any completion sentence, any cliff-at-4 reading, any statement that the decay
          finished, any statement about k = 8, k = 12 or any untested k, and any
          re-composition of the immutable SH2-MONOTONE-DECAY verdict.
        structural_note: >-
          NARROW-1 is not merely respected by this rule; it is structurally unreachable from
          it. No branch of this cascade has an output that could be written as an extinction
          sentence, because every branch's output is a statement about a ratio or about
          distinguishability at a stated exposure, and neither form can assert absence.
      - name: FM-DECAY-CONTINUES
        kind: floor cascade branch 2
        licenses: >-
          That over the two tested points, in the tested cell at the tested round count under
          PIN-T0 at the realized pooled exposure, the floor rate at the lower k exceeds the
          floor rate at the higher k at the preregistered level, with the realized ratio and
          its exact interval named; and the floor-is-alive statement carried (NARROW-1).
        does_not_license: >-
          Any statement about the SHAPE of the decay between the two points - no intermediate
          point is in the primary domain. Any count-level statement at k = 8 (NARROW-5
          discipline extended prospectively). Any statement about k = 12
          (frozen-never-measured, NARROW-4). Any extrapolation to k above 16 or to any
          untested k. Any extinction, completion or cliff-at-4 sentence (NARROW-1, NARROW-4).
          Any rehabilitation of the broken-authority multiplicative prior (NARROW-4). Any
          dilution-only attribution (SCOPE-1). Any whole-curve sentence.
      - name: FM-INVERTED
        kind: floor cascade branch 3
        licenses: >-
          A determinate count-level rate inversion between the two tested points, with its
          ratio and interval, together with the explicit statement that the committed
          band-level verdict is a band-trajectory statement and is untouched: a count-level
          inversion inside the RESIDUAL band is not a band rise.
        does_not_license: >-
          Any re-composition or amendment of SH2-MONOTONE-DECAY (immutable). Any claim of a
          band rise. Anything beyond the two tested points. Everything listed under
          FM-DECAY-CONTINUES.
      - name: FM-PLATEAU-CONSISTENT
        kind: floor cascade branch 4, gated on an equivalence criterion and, by this revision, on an affirmative-homogeneity margin
        revision_addition: >-
          SR-3 remedy (a): the branch's firing conjunct now also requires, at
          BOTH primary points, the dispersion index to be strictly below the
          preregistered margin threshold c_margin = chi2_{0.95}(n_k - 1),
          against the Branch-H critical value c_gate = chi2_{0.99}(n_k - 1).
          The full conjunct, the margin-zone routing, and all arithmetic live
          in preregistration-skeleton.md Step 5.4 and
          pooled-exposure-pricing.json sr3_remedy; this licensing statement
          names the conjunct and paraphrases no arithmetic.
        licenses: >-
          Exactly one sentence: that over the two tested points, in the tested cell at the
          tested round count under PIN-T0 at the realized pooled exposure, the floor rate
          ratio is confined to the preregistered equivalence interval - PLATEAU-CONSISTENT
          AT THE STATED RESOLUTION - together with the realized interval, the operative
          comparator, the floor-is-alive statement, and the SR-2 disclosed
          plateau-heterogeneity false-positive bound carried from
          pooled-exposure-pricing.json plateau_heterogeneity_sensitivity.
        does_not_license: >-
          NOT that the floor is constant: the claim is confinement of a ratio to a stated
          interval at a stated resolution, nothing more. NOT that the decay has ended, NOT
          that it completes, NOT that the excess has reached its floor - none is decidable
          from two points at this resolution. NOT any extinction sentence (NARROW-1); a
          plateau far above the operative comparator is the OPPOSITE of extinction. NOT a
          cliff-at-4 or sub-sub-interval reading (NARROW-4). NOT a count-level statement at
          k = 8 (NARROW-5) or anything at k = 12. NOT a mechanism: per the
          artifact_signature_warning above, a plateau is read artifact-first and any
          structural reading requires a further control this design does not run.
          NOT a sentence that the branch is safe for all phi: the SR-2 bound is
          a disclosed residual risk, not a removal, and every composed sentence
          must carry it.
        why_the_equivalence_gate_is_load_bearing: >-
          A two-sided test that merely fails to reject licenses nothing about a plateau.
          Without the containment conjunct this branch would convert an underpowered result
          into a positive claim - the exact failure the Coordinator prior anticipates and
          that NARROW-1 and NARROW-4 bar. The conjunct is not optional and a successor that
          drops it breaks the rule.
        why_the_margin_conjunct_is_load_bearing: >-
          A mere failure to reject homogeneity is absence of evidence, not
          evidence of homogeneity; the OBJ-5 break of TASK-20260903-4fdf77
          exploited exactly that gap. The margin conjunct requires affirmative
          homogeneity evidence before the same-rate sentence can be composed.
          It is not optional; a successor that drops it or moves its threshold
          post-data breaks the rule.
      - name: FM-UNRESOLVED
        kind: floor cascade branch 5, extended by the SR-3 margin-zone routing
        revision_addition: >-
          SR-3 remedy (a): this branch also receives any reading that fails the
          Branch-4 affirmative-homogeneity margin at either primary point,
          i.e. c_margin <= D_k < c_gate, while Branch H does not fire. Such
          readings lack affirmative homogeneity evidence and are demoted from
          a plateau sentence to not-decided-at-this-exposure. The full conjunct
          lives in preregistration-skeleton.md Step 5.5.
        licenses: >-
          The realized rate-ratio interval at the realized pooled exposure, recorded as a
          measured obstruction with its scope, and the re-priced exposure a successor would
          need for a named resolution.
        does_not_license: >-
          Anything about plateau, decay, completion, extinction or comparator equivalence.
          The branch's entire content is that the question was not decided at this exposure -
          which is a complete and reportable outcome, not a failure.
    exhaustiveness_and_exclusivity: >-
      Stated and argued in preregistration-skeleton.md section 5.6. Branch 1 covers the
      comparator case; conditional on it not firing, the exact test either rejects (branches
      2 and 3, split by direction, which cannot be tied when the test rejects) or does not
      (branches 4 and 5, split by containment, which either holds or does not). No admissible
      reading lands in two branches and none lands in none. The gates and the homogeneity
      branch precede all five and are themselves ordered.
    mandatory_realized_power_restatement: >-
      Whatever branch fires, the composed record must restate the achieved discriminating
      power recomputed at the REALIZED event total, beside the power priced pre-arm, and must
      disclose any shortfall. Priced power is a design commitment and is never reported as
      though it had been delivered.

  # ------------------------------------------------------------------
  # CONTROLS, CONFOUNDERS, FALSIFICATION
  # ------------------------------------------------------------------
  controls:
    - id: C-NULL-MEASURED
      control: The r = 6 matched dead anchor extended to a pooled block, giving a MEASURED null rate bound beside the computed analytic comparator, with a preregistered operative-comparator rule that lets it change the answer.
      status: budgeted in every design in the ladder including the minimal test
    - id: C-RAMP-ZERO
      control: The k = 0 ramp-zero anchor, saturated by construction, as the AMEND-1 proves-too-much control - it must PASS, demonstrating the rescoped gate is not vacuous.
      status: budgeted
    - id: C-DISPERSION
      control: The per-arm count vector and its dispersion index as the control object for the POOLING OPERATION ITSELF, evaluated before any pooled sentence exists.
      status: budgeted, with its power honestly disclosed as weak at the recommended arm count
    - id: C-INTERLEAVE
      control: Interleaved run order plus a preregistered run-order test, controlling instrument drift over a batch several times longer than any predecessor.
      status: budgeted at zero marginal cost, since it is an ordering and not an arm
    - id: C-STREAM-DISTINCT
      control: Pre-arm algebraic verification that every newly introduced (seed, armid, thread) triple derives a distinct stream.
      status: budgeted at zero compute; hard gate
    - id: C-PAPER-ROUTING
      control: Paper routing of the four known-false objects through the rule before any arm runs, with the finding that the preconditions rather than the statistic carry the correctness on two of them.
      status: performed in this record, at zero compute, and recorded in the pricing file
    - id: C-RANDOM-BIJECTION
      control: The 256-byte random-bijection null at r = 5 - the ideal null of the floor's own shape, differing from a floor arm in the S-box only.
      status: NOT RUN, NOT BUDGETED. RANK 7, needs its own build path and its own Coordinator decision. This is the design's largest control gap and it is disclosed rather than omitted.

  confounders:
    - >-
      SEED HETEROGENEITY. If the floor rate varies across seeds beyond Poisson, pooling
      buys less precision than priced and the primary test's realized size exceeds its
      nominal level. Partially controlled by C-DISPERSION; the control's power at the
      recommended arm count is weak, and the residual risk is quantified in the pricing file
      rather than waved away. This is the strongest confounder and it is the honest answer
      to the J-P attack plan's expectation that pooling might be used to buy precision the
      per-arm exposure does not support.
    - >-
      INSTRUMENT DRIFT over a batch several times longer than any predecessor. Controlled by
      C-INTERLEAVE structurally (drift becomes common-mode and cancels in the ratio) and
      disclosed by the run-order test. Not eliminated: a drift that acts differently on the
      two points is not common-mode and would not cancel; nothing in this design can detect
      that, and it is recorded as an uncontrolled residual.
    - >-
      THE MEASURED NULL IS NOT THE IDEAL NULL. The r = 6 anchor differs from a floor arm in
      the round count, which is the parameter the sealed verdict says carries death versus
      life. C-RANDOM-BIJECTION would be the right control and is not run.
    - >-
      NEW SEEDS ARE A NEW SURFACE. The campaign has used three seeds; this design proposes
      more. Controlled at the stream level by C-STREAM-DISTINCT, but seed-family behaviour
      beyond the committed triple is otherwise unmeasured.
    - >-
      TWO POINTS DO NOT MAKE A CURVE. The primary contrast is k = 4 against k = 16 and says
      nothing about the trajectory between them. The k = 8 secondary is report-only and
      cannot repair this; a three-point primary domain is priced as an option and not
      recommended, because it complicates the branch structure without changing the answer
      to the question actually asked.
    - >-
      SINGLE CELL. Everything is cell (1,1), r = 5, PIN-T0. No transfer to any other cell,
      round count, pin or exposure is asserted anywhere.

  falsification_conditions:
    - id: F1
      condition: The homogeneity branch fires at either primary point.
      meaning: >-
        The design's central premise - that pooling arms buys resolution on this instrument -
        is falsified at the tested exposure. The route as specified is not a valid magnitude
        estimator and the priced exposure-to-decision arithmetic does not apply. This is the
        most valuable negative outcome the design can produce and it costs the same as any
        other.
    - id: F2
      condition: Any floor or null receipt is saturated, or any analysis-bearing quantity is detail-log-derived.
      meaning: Heuristic H5 fails; the estimator's cap-independence claim fails; hard AMEND-1 gate failure.
    - id: F3
      condition: The exact upper bound on the measured null rate exceeds the analytic comparator.
      meaning: >-
        Heuristic H6's rigorous support fails. The design is not falsified - the
        operative-comparator rule absorbs it - but every branch's composed sentence is
        weakened and must be restated against the larger value.
    - id: F4
      condition: The pre-arm stream-distinctness check fails on any newly introduced triple.
      meaning: Heuristic H2 fails; the design cannot run as specified; hard gate before any arm.
    - id: F5
      condition: The realized event total falls materially below the priced total.
      meaning: >-
        The priced power was not delivered. The branch outcome must be reported at the
        REALIZED power with the shortfall disclosed; the preregistration makes this
        restatement mandatory rather than discretionary.
    - id: F6
      condition: >-
        The validator's exact re-derivation returns a materially different required exposure
        or power at a named alternative, or shows a reading landing in two branches or in
        none.
      meaning: >-
        The pricing or the rule is wrong. The retained pricing content was
        hand-derived in the source session, and the NEW SR-2/SR-3 content was
        derived by exact enumeration in this revision session; both classes
        remain design-time and the blind re-derivation is load-bearing rather
        than confirmatory. The disclosed approximation gaps - arcsine sizing,
        Clopper-Pearson widening, hand-estimated p-values, the hand-summed
        count threshold, and the configuration-invariance approximation - are
        named individually in the pricing file so a reviewer can tell a
        disclosed gap from an undisclosed error.

  interpretation_limits:
    - Toy tier. No distinguisher, no key recovery, no deployed-AES statement, no carrier, no X lane, no rho-exclusion, no published-cryptanalysis comparison in either direction.
    - Single cell (amask = 1, smask = 1), r = 5, PIN-T0, 2^30 per arm, frozen build, committed seed list. No transfer asserted to any other configuration.
    - Primary domain is k = 4 and k = 16 only. k = 8 is report-only and carries NO count verdict in any branch (NARROW-5 discipline extended prospectively). k = 12 is frozen and never measured in any batch (NARROW-4).
    - Nothing here touches k = 1, 2 or 3, the THRESHOLD regime, or the transition position inside (3,4]. No cliff-at-4, completion or sub-sub-interval reading is available from any branch (NARROW-4).
    - No extinction sentence is available from any branch (NARROW-1), including the comparator branch.
    - The immutable SH2-MONOTONE-DECAY verdict of EV-AES-868db1 and the additive content of EV-AES-ac5c12 are INPUTS. Neither is re-composed, re-measured or amended.
    - The multiplicative prior remains BROKEN-AUTHORITY and is not consumed anywhere (NARROW-4).
    - Exact re-runs at identical (seed, armid, build) are instrument determinism and never replication (NARROW-3).
    - A plateau outcome is read artifact-first, not structure-first, and licenses no mechanism.

  # ------------------------------------------------------------------
  # PROOF-ARCHITECTURE
  # ------------------------------------------------------------------
  proof_search_map:
    applies: partially
    not_applicable_reason: >-
      This is a MEASUREMENT design, not a proof-oriented proposal. It proves no theorem,
      certifies no object and claims no complexity result, so the KN-TECH-080 portfolio does
      not apply as written and the coordinator's proof-oriented approval gate is not
      triggered. Two of its checks DO transfer to a measurement design and are performed
      below rather than omitted, per the constraint that an audit which does not apply
      records why.
    bottleneck: >-
      The exact step whose removal changes the answer: the resolution of the floor-rate
      contrast at fixed per-arm exposure. Every committed interval at floor magnitude has a
      relative half-width of order 50 to 60 percent, which is why the five committed readings
      cannot be ordered. The bottleneck is not the instrument, the build or the gate; it is
      the count size.
    baseline_embedding:
      parameter_slice: >-
        The committed state is the exact one-arm-per-point slice of this design: no pooling,
        no conditional test, comparator computed rather than measured. Setting the arm count
        to one and removing the equivalence criterion reproduces exactly the committed
        COUNT-UNRESOLVED conclusion.
      reproduction_check: >-
        Performed and recorded in the pricing file as the DECLINED retrospective route: run
        the design's own statistic on the committed readings and confirm it returns a
        non-significant contrast with an interval containing unity - i.e. it reproduces
        COUNT-UNRESOLVED rather than contradicting it. A design whose statistic disagreed
        with the committed conclusion on the committed data would be broken, and this check
        is the cheapest way to find that out. It passes.
    observation_collision:
      observable: The pooled grand total of hits across the two primary points.
      distinct_preimage_search: >-
        PERFORMED, AND IT FINDS A COLLISION. A constant plateau and a factor-two continued
        decay produce nearly the same expected grand total, and produce exactly the same
        total under any parameterization holding the arithmetic mean fixed. The grand total
        is therefore a COLLIDING OBSERVABLE and cannot carry the conclusion. This is the
        argument that forces the object choice: the exposure-free ratio separates the two
        preimages that the total identifies. Recorded because the collision, not the design,
        is the load-bearing finding here.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The exposure-free rate ratio read through the exact conditional binomial law of one pooled count given the pair's total.
        predicted_gain: >-
          Removes the exposure from the inference entirely, making the test exact at any
          sample size, making common-mode instrument drift cancel, and making the plateau
          hypothesis the exactly symmetric point of a discrete law - which is what makes an
          equivalence criterion, and therefore a defensible plateau sentence, definable at
          all.
    quantifier_order: >-
      Written out explicitly. The design claim is: FOR the fixed tuple (cell (1,1), r = 5,
      PIN-T0, 2^30 per arm, frozen build, the committed seed list, the preregistered levels
      and the preregistered equivalence resolution), THERE EXISTS an arm count n such that
      FOR ALL true rate ratios at or beyond the preregistered minimum detectable effect, the
      rule rejects the symmetric point with at least the stated power; AND FOR the plateau
      case, the rule licenses a confinement sentence at the preregistered resolution. It is
      NOT the reverse order: there is no n that works for all ratios, because the required
      exposure diverges as the ratio approaches unity. The pricing file's resolution ladder
      is the quantitative statement of that divergence.
    method_ceiling:
      strongest_certifiable_claim: >-
        Confinement of a two-point floor rate ratio to a stated interval, or its exclusion
        from unity in a stated direction, at a stated exposure, in one cell at one round
        count under one pin, at toy tier. Nothing about mechanism, nothing about the
        trajectory between the two points, nothing about untested k, nothing about absence.
      nearby_object_control: >-
        The nearby object on which the desired conclusion fails is the ramp-zero pair: two
        arms whose counts are equal by construction, on which the statistic returns perfect
        symmetry and the rule would return PLATEAU-CONSISTENT if the admissibility
        preconditions were removed. That is exactly why the preconditions are conjuncts.
        Stated as a ceiling of the method, not as a defect fixed by hand.
    proof_obligations:
      - claim: The conditional law of one pooled count given the pair's total is exactly binomial with a parameter monotone in the rate ratio.
        responsibility: correctness
      - claim: The rule's branches are mutually exclusive and exhaustive over admissible readings.
        responsibility: correctness
      - claim: The priced exposure delivers the stated power at the preregistered minimum detectable effect.
        responsibility: success_probability
      - claim: The priced exposure delivers the stated equivalence resolution under plateau truth.
        responsibility: strictness
      - claim: Pooling is valid at the tested exposure, i.e. the per-arm counts at a point are homogeneous.
        responsibility: feasibility
      - claim: The estimator is cap-independent and no analysis-bearing quantity is detail-log-derived.
        responsibility: interface
      - claim: Every composed sentence stays inside the tested cell, round count, pin, exposure, seed list and point set.
        responsibility: scope

  # ------------------------------------------------------------------
  # HONEST ACCOUNTING (inventor-protocol section 5)
  # ------------------------------------------------------------------
  target_complexity:
    time_exponent: >-
      NO ATTACK, NO EXPONENT. This is a measurement design at toy tier and it claims no
      complexity result of any kind. Its cost is linear in the number of arms: the
      recommended design is 17 arms at 2^30, 27540 s of compute on the binding baseline, with
      an optimistic-relative measured-hardware estimate of 2635 s disclosed as non-binding.
      The full ladder runs from 7 arms (11340 s) to 37 arms (59940 s).
    memory_exponent: >-
      O(1) per trial, unchanged from the committed lineage: table-driven direct evaluation,
      fixed histograms, per-hit detail capped at 256 records per thread. Pooling adds no
      per-trial storage - it sums counters across independent processes. Declared memory 4
      GB, which is the campaign's standing figure and is not approached.
    best_known: >-
      The committed campaign state: floor magnitude is COUNT-UNRESOLVED at every exposure the
      campaign has run, at every k in the floor, in both directions (against the comparator
      and against itself). EV-AES-868db1 unresolved_confounds item 3; EV-AES-ac5c12
      unresolved_confounds item 3; TASK-20260903-12a09f RT-J6.
    hidden_overhead: >-
      DISCLOSED HONESTLY, since there is no o(1) to hide behind at toy tier. (1) The cost
      scales as the inverse square of the log of the resolution, so the ladder is brutally
      steep: the finest resolution anyone might want costs about six times the recommended
      design and a resolution of ten percent costs over forty hours. (2) The heterogeneity
      factor is the real hidden overhead: it is unmeasured at the recommended arm count, it
      inflates the realized size of the primary test if it is above one, and it is removable
      only by more arms - so the true cost of a TRUSTWORTHY result may exceed the priced cost
      of a NOMINAL one. (3) The authoring component (11700 s at the recommended design) is
      comparable to the compute component and is reported separately per the goal's C4
      discipline rather than folded in. (4) The measured-hardware estimate is roughly ten
      times faster than the binding baseline and is flagged optimistic-relative; every cap is
      set on the baseline.
    tradeoff_note: >-
      THE ONE QUANTITATIVE TRADEOFF THIS DESIGN OWNS. Per-arm exposure and arms-per-point buy
      the same precision per unit of wall clock at this instrument's fixed throughput: four
      arms at 2^30 and one arm at 2^32 cost the same and carry the same exposure. They are
      NOT equivalent. Four arms deliver four independent seed environments, the homogeneity
      test, the interleaving that cancels drift, and no new freeze commitment; one long arm
      delivers one seed environment, no homogeneity test at any exposure, a confound between
      seed and rate, and a new pre-arm commitment because the campaign has never run that
      exposure. On the data axis of the Pareto frontier the pooled route therefore strictly
      dominates the single-long-arm route at equal time and equal memory. Parallelization:
      arms are embarrassingly parallel independent processes, so wall clock divides by the
      number of concurrent four-thread slots, and the interleaved run order must be preserved
      as a logical ordering if arms are run concurrently.

  dominated_by: >-
    CHECKED ROW BY ROW across time, memory and data/queries against the DEC-20260903-be4472
    next_action frontier and the design alternatives named by the handoff. NOT NULL - see
    ROW 3 and the question-relative verdict at the end. ROW 1, RANK 2 FAMILY EXTENSION
    (k = 5/6, or a finer locator inside (3,4]): answers the TRANSITION POSITION question,
    not the floor-magnitude question. On the floor-magnitude axis it supplies ZERO
    information at any exposure - new points at k = 5 or 6 sit inside the floor regime and
    cannot sharpen the k = 4 against k = 16 contrast - and it carries a higher fixed cost
    (two arm tokens, two freeze points, a Gate-0x extended rebuild of about 54 minutes) that
    this design does not pay at all. It therefore does NOT dominate on the RANK 1 question.
    It plainly DOES dominate on information per second if the campaign's next question is
    the transition position rather than the floor magnitude; that ranking is a Coordinator
    judgment and this record does not pre-empt it. ROW 2, SINGLE-POINT EXPOSURE ESCALATION
    (one 2^32 arm per point instead of four 2^30 arms): identical exposure, identical time,
    identical memory, and strictly WORSE on the data axis - one seed environment instead of
    four, no homogeneity test available at any exposure, seed confounded with rate, and a
    new freeze commitment required because the campaign has never run 2^32. DOMINATED BY
    this design. ROW 3, RETROSPECTIVE POOLING OF THE COMMITTED READINGS: zero compute, zero
    arms. DOMINATES THIS DESIGN ON EVERY COST AXIS. It fails on the information axis - the
    pricing file shows it reproduces COUNT-UNRESOLVED rather than resolving it - and it is
    barred as a test statistic because the readings selected the hypothesis and because
    pooling the committed k = 8 draws is outside what BATCH-060cb4 may support. This row is
    the honest answer to whether dominated_by is null: it is not, and the domination is real
    on cost even though the dominating route cannot answer the question. ROW 4, DO NOTHING
    AND ACCEPT COUNT-UNRESOLVED: zero cost, zero information. Dominates on cost; the reason
    it is not chosen is that NARROW-1 makes every extinction and completion sentence
    unavailable until the magnitude is adjudicated, so the campaign's forward paths (the
    decay-law successor, the layer autopsy) each wait on this question. ROW 5, PINCTRL-1
    (RANK 3): a different question (schedule versus dilution), needs a new Coordinator pin
    decision, orthogonal. No domination either way. ROW 6, THE 256-BYTE RANDOM-BIJECTION
    CONTROL (RANK 7): would STRENGTHEN this design by supplying the ideal null; it answers
    no magnitude question alone. Complementary, and named as this design's largest control
    gap. ROW 7, LAYER AUTOPSY (RANK 5), BATTERY ARMS (RANK 6), ARCHIVE DEBT (RANK 8):
    different questions; the layer autopsy CONSUMES a magnitude sentence rather than
    producing one. No domination.     ROW 8, THE PUBLISHED EXTERNAL FRONTIER: unadjudicable at
    toy tier and barred in both directions by RQ-AES-003 R7; no comparison is made and none
    is implied. ROW 9 (NEW, SR-7), THE CHEAPEST SAME-PAIR EXTENSION for the actual
    k=4/k=16 pair: one NEW arm at k=4 and one NEW arm at k=16, n = 1 per point,
    2 floor arms total. Priced as its own row in pooled-exposure-pricing.json
    sr7_dominated_by_row and declined there: at n = 1 the per-point dispersion
    index has zero residual degrees of freedom, so the H1/H3 homogeneity gate
    cannot be computed at all, and the alternative is undefined for the
    pooling operation's own control object. This is a design-specific
    derivation, not a precedent citation. DOMINATED BY D-1. The RANK-2
    dominance comparison is UNCHANGED because the SR-3 remedy is option (a)
    and adds no arms and no points. VERDICT: on the floor-magnitude question
    no checked row dominates on information; on cost, ROW 3 and ROW 4 dominate
    and cannot answer; ROW 1 dominates on information per second for a
    DIFFERENT question. The null was not written, because it would have been
    false.

  sota_delta:
    time_exponent: '0 (no attack, no exponent claimed)'
    memory_exponent: '0 (no attack, no exponent claimed)'
    data_or_query_exponent: >-
      0 as an attack claim. As a measurement claim, stated quantitatively: the design moves
      the campaign from one or two independent draws per floor point to four, and from a
      computed comparator to a measured one at pooled exposure.
    evidential_delta_quantitative: >-
      Stated in decidable terms rather than as 'better'. (i) The floor rate ratio between the
      two extreme floor points currently exists only as a post-hoc point estimate whose
      interval CONTAINS unity - i.e. no ordering of the floor points is available at all. The
      design converts it into a PREREGISTERED decision at a stated resolution with a stated
      power against a stated minimum detectable effect, using arms drawn after the rule is
      committed. (ii) The comparator currently exists only as a computed constant of the
      frozen excess convention; the design converts it into an exact measured bound with a
      preregistered rule under which the measurement can override the constant. (iii) The
      pooling assumption, on which every future magnitude sentence in this campaign will
      rest, currently has no test at all; the design supplies one and honestly discloses its
      weak power at the recommended arm count. (iv) A defensible PLATEAU sentence is
      currently not definable in this campaign under any rule, because no committed rule has
      an equivalence criterion; the design makes one definable and states its resolution.
      COST of all four: 17 arms at 2^30, 27540 s compute on the binding baseline plus 11700 s
      authoring. WHAT IS NOT DELIVERED, stated with the same precision: the finer separation
      named in the Coordinator prior (17 against 12 at 95 percent) is NOT delivered at the
      recommended exposure and would cost roughly an eighth-again-as-many arms; the pricing
      file names the exact design that does deliver it.
    discharges: >-
      DEC-20260903-be4472 RANK 1 (a floor-magnitude adjudication DESIGN PROPOSAL via the
      pooled-exposure route, repriced under AMEND-1 with the realized readings 17/21, 13/18,
      12 as inputs, carrying NARROW-1 through NARROW-5); EV-AES-868db1 transfer_assumptions
      item (c) (pool exposure before any floor-magnitude adjudication) at the DESIGN level
      only; TASK-20260903-12a09f priced_successors_still_open item 1 (the pooled route
      repriced with the realized k = 8 spread and the magnitude-matched-window arithmetic).
      It discharges NOTHING at the evidence level: no arm ran, no evidence exists, no status
      moves, no completion criterion is met. THIS REVISION additionally
      discharges, at the DESIGN level only, TASK-20260903-4fdf77 successor
      requirements SR-2 and SR-3 (the blocking plateau-heterogeneity bound and
      its remedy), folds SR-1 and SR-6, and carries SR-4, SR-5, SR-7 and SR-8
      as disclosure/completeness items, per DEC-20260903-afdd06. Whether SR-2
      and SR-3 are discharged to the Coordinator's satisfaction is a review
      and decision matter, not a producer claim.

  # ------------------------------------------------------------------
  # OBSTRUCTION
  # ------------------------------------------------------------------
  obstruction:
    statement: >-
      What this design does NOT resolve, stated as quantities rather than as prose.
    quantity: >-
      (a) the floor rate ratio at resolutions finer than the preregistered one; (b) the
      trajectory of the floor BETWEEN k = 4 and k = 16 (the k = 8 secondary is report-only
      and carries no count verdict); (c) the seed-heterogeneity factor, unmeasured at the
      recommended arm count; (d) the floor's behaviour at k = 12, frozen and never measured
      in any batch; (e) the ideal same-shape null (the random-bijection control), not run;
      (f) the floor W-tail shape, produced but declared report-only and too sparse to carry a
      verdict at this exposure; (g) the detail-log gap structure, closed by AMEND-1(c).
    value: >-
      The numeric values behind (a) through (c) - the resolution ladder, the arms required at
      each named ratio, and the size inflation as a function of the heterogeneity factor -
      are in pooled-exposure-pricing.json and are deliberately not restated here.
    measured_by: >-
      Nothing. NO ARM RAN. The retained figures in the companion pricing file
      are the source package's design-time hand derivations from the committed
      readings of EV-AES-868db1, EV-AES-ac5c12 and CORR-20260903-d3cab5. The
      NEW SR-2/SR-3 figures were produced by two fresh python3/scipy
      derivation runs under maximum_runs=2, zero experiment arms,
      scratchpad-only scripts, with all cross-validations and conventions
      disclosed in the pricing file. This obstruction block records a
      design-time projection, not a measurement, and must not be cited as
      one.
    scope: >-
      Cell (1,1), r = 5, PIN-T0, 2^30 per arm, k in {4, 8, 16}, frozen build, toy tier.
      Claimed nowhere else.
    resource_check:
      examined: true
      reading: >-
        Each unresolved piece is read as another lane's asset rather than as a closed door.
        (a) The resolution ceiling is the input to any future magnitude escalation and it now
        exists as a priced ladder rather than as an intuition, so the next Coordinator
        ranking can compare it against RANK 2 on a common axis. (b) The between-points
        trajectory is precisely the FAMILY-EXTENSION lane's asset: if k = 5 or 6 are ever
        built, they enter the floor regime and become the intermediate points this design
        lacks - so RANK 2 and RANK 1 are complementary in a specific, statable way rather
        than rivals. (c) The unmeasured heterogeneity factor is the variance budget every
        future multi-seed design in this campaign will need, and this design produces the
        first estimate of it whatever branch fires. (d) k = 12 is a committed freeze digest
        with no reading; it is the cheapest unexercised point in the campaign and it becomes
        newly informative the moment a magnitude sentence exists to place it against. (e) The
        random-bijection null is RANK 7 and this design's control gap gives it, for the first
        time, a concrete consumer. (f) The floor W-tail is free enabling data that no batch
        has ever looked at; it is the named successor lens once exposure grows. (g) The
        detail-log gap object is closed by a STANDING GATE with a named mechanism and an
        available reopening route (a prospective scoping amendment for unsaturated receipts),
        recorded so the object is not lost. All seven examined; none found unexamined.
      spawned_ids: []

  # ------------------------------------------------------------------
  # CLOSURES (inventor-protocol section 4 standard)
  # ------------------------------------------------------------------
  enumerated_closures:
    - id: CLOSE-1
      what_is_closed: >-
        The DETAIL-LOG GAP-STRUCTURE object (O4) as a lens for this campaign, under the
        current gate regime.
      obstruction_named: >-
        AMEND-1 conjunct (c): any analysis-bearing quantity derived from the capped detail
        log rather than from the counters is a gate failure.
      argument: >-
        The gap structure is by definition a detail-log quantity. The gate is written over
        the CLASS of detail-log-derived quantities, not over the saturated subclass, so the
        fact that floor receipts happen to be unsaturated - and hence carry a complete rather
        than a first-256-per-thread-biased log - does not exempt it. Rescoping the gate after
        seeing that convenience would be a post-hoc rescue, which RT3-A bars.
      forward_guidance: >-
        The class that remains open is a PROSPECTIVE scoping amendment restricting AMEND-1(c)
        to saturated receipts, argued on the ground that on an unsaturated receipt the log IS
        the complete hit set. That is a Coordinator decision with its own review and its own
        proves-too-much control, not something a design may assume. Until then the object is
        closed, not dead.
      status: closed with mechanism, at the section 4 standard
    - id: CLOSE-2
      what_is_closed: >-
        RETROSPECTIVE POOLING of the five committed readings as a route to the
        floor-magnitude answer.
      obstruction_named: >-
        Two independent obstructions, either of which suffices: insufficient information (the
        interval on the ratio contains unity), and selection (the alternatives were named
        after and partly because of these readings, so they cannot also be the test data).
      argument: >-
        The first is arithmetic and is computed in the pricing file rather than asserted. The
        second is a preregistration argument: a statistic computed on the data that motivated
        the hypothesis does not have its nominal operating characteristics, and no amount of
        care in the computation repairs that. A third, narrower bar applies to part of it -
        pooling the committed k = 8 draws is outside what BATCH-060cb4 may support (NARROW-5,
        RT-J6).
      forward_guidance: >-
        The class that remains open is NEW ARMS under a preregistered rule, which is this
        design. The committed readings remain valuable as a design prior and as a
        report-only consistency comparison, and both uses are declared.
      status: closed with mechanism, at the section 4 standard
    - id: CLOSE-3
      what_is_closed: >-
        The claim that a STATISTIC ALONE can carry this rule's correctness on known-false
        objects.
      obstruction_named: >-
        Two of the four proves-too-much objects - the ramp-zero pair and the dead-anchor
        contrast - route CORRECTLY only because of the admissibility preconditions; on the
        statistic alone they route to PLATEAU-CONSISTENT and to DECAY-CONTINUES respectively,
        both wrong.
      argument: >-
        Recorded in the pricing file's routing table with the counterfactual routings written
        out. A statistic that reads only two counts cannot distinguish a pair equal by
        construction from a pair equal by measurement, nor a dead configuration from a
        decayed one; the distinguishing information lives in the arm's configuration, which
        is exactly what the preconditions read.
      forward_guidance: >-
        What remains open is whether a statistic could be built that carries this itself -
        for instance one reading the W-tail (O5) or the saturation status alongside the
        count, so that a ramp-zero arm is self-identifying. That is a real design question
        for a successor and is named here rather than assumed impossible.
      status: closed with mechanism, at the section 4 standard

  not_a_closure_disclaimer: >-
    No lane is declared closed on saturation grounds anywhere in this record, and no
    direction is declared impossible. The three closures above each name an obstruction, an
    argument and the classes that remain open, per docs/inventor-protocol.md section 4. A
    count of rejected mechanisms would be a fatigue report and none is offered.

  open_directions_for_the_next_session:
    - >-
      The heterogeneity factor is the highest-value unmeasured quantity in this lane.
      Whatever branch fires, the recommended design produces the campaign's first estimate of
      it, and the arm count required to BOUND it - rather than merely to fail to detect it -
      is priced. A successor that wants trustworthy pooled sentences at any resolution needs
      that bound first.
    - >-
      The floor W-tail (O5) is free enabling data on receipts this design already produces
      and no batch has ever examined it. It is the natural successor LENS once pooled
      exposure grows, and it is the one candidate object in the enumeration that is both
      unmined and AMEND-1-admissible.
    - >-
      A statistic that is self-identifying against known-false objects (CLOSE-3 forward
      guidance) would remove the design's reliance on admissibility preconditions and is a
      genuine open design question.
    - >-
      The random-bijection null at r = 5 (RANK 7) now has a concrete consumer: it is the
      control that would let a plateau outcome be read as anything other than artifact-first.
      Its ranking should be re-examined against that new consumer.
    - >-
      k = 12 is a committed freeze digest with no reading in any batch. It is the cheapest
      unexercised point in the campaign and becomes newly informative the moment a magnitude
      sentence exists to place it against - but it remains frozen-never-measured and no
      sentence may cite it as coverage (NARROW-4).
    - >-
      The object enumeration in this record is a SKETCH, not a taxonomy. This program has no
      written object-enumeration for RQ-AES-003 (the ECDLP analogue is KN-OPEN-019 and is
      itself open). Writing one for this target would make every future novelty and
      saturation judgment in this lane checkable instead of asserted.

  # ------------------------------------------------------------------
  # PRIORITY AND PRIORS
  # ------------------------------------------------------------------
  recommended_priority: high
  recommended_priority_basis: >-
    HIGH as a design, with an explicit caveat on the execution ranking. As a design it is
    RANK 1 by DEC-20260903-be4472 and it gates every extinction, completion and magnitude
    sentence the campaign is currently barred from making. As an EXECUTION, the honest
    ranking depends on which question the Coordinator wants next: the dominated_by row-by-row
    scan finds that RANK 2 dominates on information per second IF the next question is the
    transition position rather than the floor magnitude. That judgment is not the idea
    generator's to make and is flagged rather than pre-empted. If execution is approved, the
    minimal test (D-0, the measured null object) should run first regardless of which fuller
    design is chosen, because it is a strict prerequisite of all of them.

  honest_prior_of_survival: >-
    Recorded before any reviewer runs and before any arm could run. GATES: P(hard gate
    failure at stage 0) about 0.05, dominated by environmental nondeterminism rather than by
    the build, which is hash-verified in three consecutive batches; P(dead-anchor tripwire)
    about 0.01; P(pre-arm stream-distinctness failure) about 0.02, genuinely uncertain because
    the seeds are new. NULL OBJECT: P(pooled null count is zero) about 0.45, P(one to three
    hits) about 0.45, P(four or more but below the hard threshold) about 0.10, P(hard
    threshold) below 0.001. Consequently P(the measured bound lands at or below the analytic
    comparator) is roughly 0.6 to 0.8 at the recommended null exposure and would be near 0.45
    at the reduced one - which is why the recommended design pays for the larger null block.
    FLOOR BRANCHES, conditional on the gates passing and on the recommended exposure:
    P(FM-OVERDISPERSED) about 0.10 (it fires on gross heterogeneity only, and there is no
    committed reason to expect gross heterogeneity, but there is also no committed reason to
    exclude it); P(FM-COMPARATOR-INDISTINGUISHABLE) below 1e-10, a control branch;
    P(FM-DECAY-CONTINUES) about 0.30; P(FM-INVERTED) about 0.05; P(FM-PLATEAU-CONSISTENT)
    about 0.20; P(FM-UNRESOLVED) about 0.35. THE LAST TWO NUMBERS ARE THE HONEST HEADLINE:
    the single most likely outcome of the recommended design is FM-UNRESOLVED, because the
    realized point ratio sits in the band where this exposure is under-powered, and the design
    is recommended anyway because FM-UNRESOLVED at a stated resolution with a measured null
    and a tested pooling assumption is strictly more than the campaign has now, and because
    the alternative that would make FM-UNRESOLVED unlikely costs several times as much. Sums
    to 1.00 within each stage. Every branch produces a determinate, committed reading.

  # ------------------------------------------------------------------
  # RELATIONS AND PROVENANCE
  # ------------------------------------------------------------------
  relation_to_existing_records:
    consumes: >-
      EV-AES-868db1 (committed readings as design inputs; OBS-6 floor-alive; OBS-7/OBS-8
      discipline; obstruction block and resource_check; transfer_assumptions item (c));
      EV-AES-ac5c12 (OBS-3 k=8 second seed; OBS-6 floor-alive restatement; OBS-8 k=12
      disclosure; OBS-9 paraphrase discipline; obstruction resource_check);
      CORR-20260903-d3cab5 (the exact interval at 17 hits); DEC-20260903-be4472 (RANK 1
      dispatch; RAT-3/4/5; NARROW-4/5); DEC-20260902-7ad3d9 (NARROW-1/2/3; RAT-2);
      DEC-20260901-6f9de3 (AMEND-1); TASK-20260903-12a09f red_team_report.yaml (RT-J6 on why
      the k=8 spread reinforces the deferral; RT-J8 on the magnitude-specificity of the count
      window; N1 to N5); IDEA-20260903-8f26ac (form precedent, the priced-and-declined hook,
      the saturation-aware AMEND-1 evaluation rule, the seat-fixed convention, the cost
      basis).
    does_not_touch: >-
      The immutable SH2-MONOTONE-DECAY verdict of EV-AES-868db1 (never re-composed); the
      additive content of EV-AES-ac5c12 (never re-composed); the transition position and the
      (3,4] localization (RANK 2's question); PINCTRL-1 and the schedule decomposition (RANK
      3, needs a new pin decision); the multiplicative prior (RANK 4 bait, stays
      broken-authority); the layer autopsy (RANK 5); the battery arms (RANK 6); the
      random-bijection control (RANK 7, named as a control gap only); the archive debt (RANK
      8).
    feeds: >-
      Any future magnitude sentence and therefore, through NARROW-1, any future consideration
      of extinction or completion language; the decay-law successor (RANK 4 bait), which needs
      a magnitude sentence to have anything to explain; the layer autopsy (RANK 5), which
      consumes a magnitude sentence rather than producing one; the variance budget of every
      future multi-seed design in this campaign; and the obstruction registry, since the
