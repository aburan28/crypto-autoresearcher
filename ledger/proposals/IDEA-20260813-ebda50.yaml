idea:
  id: IDEA-20260813-ebda50
  date: '2026-08-13'
  added: '2026-08-13'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-SQISIGN-001
  goal_id: GOAL-SQISIGN-001
  title: Simulator-coupled pathwise divergence localization
  class: measurement
  claim: >-
    After primary sources define the exact signer and genuine simulator, test
    whether any real-versus-simulated transcript discrepancy can be localized
    to a first source-defined transition kernel under a preregistered coupling,
    rather than appearing only as an undiagnosed endpoint correlation. No
    divergence or leakage is claimed by this proposal.
  mechanism: >-
    View signing and simulation as compositions of source-defined stochastic
    kernels ending in the same public transcript space. Couple only public
    inputs and legitimately shared randomness, then compare the conditional
    laws at successive public or auditable projections. If an earliest kernel
    has nonzero conditional divergence while all preceding projections match,
    that kernel is a causal localization candidate. If only the final marginal
    differs, the pathwise audit distinguishes a distributed mismatch from a
    single conversion-choice effect.
  why_not_a_renamed_known_approach: >-
    IDEA-20260801-020 compares transcript statistical independence at the
    endpoint. This proposal adds a source-faithful sequence of conditional
    kernels, a quantifier-fixed coupling, and a first-divergence criterion.
    IDEA-20260805-bb4bf8 audits commitment-walk mixing constants, while this
    proposal makes no mixing claim and can localize divergence before or after
    that walk. It is also distinct from IDEA-20260813-b6c9b5 because it does not
    presuppose conversion-fibre multiplicity as the cause.
  predictions:
    - metric: earliest source-defined stage with nonzero conditional real-versus-simulator divergence
      direction: different
      minimum_effect: >-
        A preregistered separation after multiplicity correction, with all
        earlier auditable projections meeting the null tolerance.
    - metric: telescoping upper bound from stagewise divergence to endpoint divergence
      direction: lower
      minimum_effect: >-
        The accounted stagewise bound must contain the independently measured
        endpoint discrepancy; otherwise the instrumentation or coupling is invalid.
    - metric: planted single-kernel perturbation localization accuracy
      direction: higher
      minimum_effect: >-
        The procedure must identify the intentionally perturbed stage and not a
        preceding stage before any real null or signal is interpreted.
  minimal_test:
    design: >-
      Blocked pre-design gate: file the primary Round-3 scheme specification,
      proof-defined genuine simulator, and an exact map from both algorithms to
      comparable public or auditable projections. Only then may a Coordinator
      approve a toy coupled-kernel audit. No parameters, runs, or executable
      experiment are approved by this proposal.
    controls:
      - Genuine-simulator endpoint null on identical public inputs, performed before inspecting stagewise signals.
      - Real-versus-real and simulator-versus-simulator split-sample nulls with the same instrumentation.
      - Planted positive control perturbing exactly one source-defined kernel by a known secret-indexed bias.
      - Projection-order control that removes one intermediate observable without changing the endpoint.
      - Independent endpoint-only distance estimate to check the telescoping accounting.
    required_metrics:
      - Conditional distance or likelihood-ratio interval at every source-defined projection.
      - Earliest-divergence index with family-wise uncertainty.
      - Endpoint distance and a stagewise telescoping bound.
      - Instrumentation overhead, data, memory, preprocessing, oracle, and verification charges.
  controls:
    - true_simulator_endpoint_null_mandatory
    - planted_single_kernel_positive_control
    - real_real_and_simulator_simulator_split_nulls
    - endpoint_telescoping_accounting_check
  confounders:
    - A coupling that shares secret-dependent randomness unavailable to the genuine simulator.
    - Instrumentation exposing internal values not defined by the primary proof or implementation.
    - Adaptive choice of projections after observing a discrepancy.
    - Abort or retry histories shifting the apparent first divergent stage.
    - Different serializers or randomness domains used by signer and simulator.
  falsification_conditions:
    - >-
      Once source-gated, every comparable conditional kernel and the endpoint
      match the genuine-simulator null within preregistered error, while the
      planted perturbation is correctly localized.
    - >-
      The claimed earliest stage changes under equivalent projection
      factorizations or disappears after charging rejection and retry history.
    - >-
      The stagewise accounting cannot upper-bound the endpoint discrepancy,
      invalidating the pathwise decomposition.
  interpretation_limits:
    - status proposed and novelty unverified; this record has no scientific effect.
    - A localized discrepancy is a diagnostic artifact until reproduced against the genuine simulator null and nearby controls.
    - Internal-path differences alone are not protocol leakage if the public transcript laws agree.
    - Toy localization does not transfer to production parameters without a separate argument.
    - >-
      GOAL-SSI-001 exclusively owns hard-problem EndRing/OneEnd algorithms,
      reductions, and status. This proposal only localizes protocol simulation
      kernels and cannot alter or imply a GOAL-SSI-001 result.
  assumptions:
    - Primary sources expose comparable projections without granting the simulator secret-derived advice.
    - A fixed coupling can be specified before data inspection.
    - Instrumentation preserves the public endpoint distribution.
  heuristic_assumptions:
    - id: H-PATH-1
      statement: >-
        For each tested public input, repeated executions of every
        source-defined kernel are conditionally independent given its declared
        input state, and instrumentation does not change the kernel law.
      rigorous_support: >-
        The chain rule and data-processing inequalities apply to exact Markov
        kernels; the experimental assumption is that the filed implementation
        realizes those kernels without hidden shared state.
      validation_plan: >-
        After primary-source filing, use split streams and serial-correlation
        diagnostics at every projection, compare full conditional tails, and
        repeat with instrumentation disabled at the public endpoint. Any
        production transfer remains unvalidated.
  proof_search_map:
    bottleneck: >-
      Construct a source-faithful common sequence of projections without
      smuggling secret information or implementation-only state into the simulator.
    baseline_embedding:
      parameter_slice: >-
        Exact signer and genuine simulator at the smallest source-valid toy
        slice, with their public endpoint distributions reproduced first.
      reproduction_check: >-
        Confirm randomness domains, abort semantics, serialization, and endpoint
        normalization before defining intermediate projections.
    observation_collision:
      observable: A sequence of comparable public or auditable projections ending in the transcript.
      distinct_preimage_search: >-
        Seek distinct hidden paths with the same projection sequence and the
        same endpoint to test whether the observable is too coarse to localize cause.
    constructive_transforms:
      - transform: telescoping_potential
        proposed_object: Stagewise conditional divergence contributions with a checked endpoint bound.
        predicted_gain: Turns an endpoint difference into an auditable localization or exposes a decomposition failure.
      - transform: stronger_invariant
        proposed_object: Projection augmented only with source-public retry and branch metadata.
        predicted_gain: Separates abort conditioning from a kernel-law discrepancy without exposing secrets.
    quantifier_order: >-
      Choose one projection sequence and one secret-free simulator uniformly for
      all tested keys and public inputs before observing samples; then test every
      stage. Do not existentially select a coupling per discrepant key.
    method_ceiling:
      strongest_certifiable_claim: >-
        A toy, source-gated statement that a specified conditional kernel is or
        is not required to explain a measured endpoint difference.
      nearby_object_control: >-
        A synthetic chain with two hidden paths but identical conditional and
        endpoint laws; the method must not invent a first divergence.
    proof_obligations:
      - claim: Reproduce both endpoint laws with source-faithful interfaces.
        responsibility: baseline
      - claim: Prove that each reported projection is available to both compared processes without secret leakage.
        responsibility: interface
      - claim: Establish the stagewise-to-endpoint divergence inequality used.
        responsibility: correctness
      - claim: Bound simultaneous testing and localization error.
        responsibility: success_probability
      - claim: Charge all sampling, conditioning, instrumentation, and verification.
        responsibility: runtime
      - claim: Limit conclusions to public transcript simulation, not hidden-path equality.
        responsibility: scope
    not_applicable_reason: null
  target_complexity:
    time_exponent: n/a; diagnostic protocol measurement only
    memory_exponent: n/a; diagnostic protocol measurement only
    best_known: >-
      KN-TECH-057 matched hard-problem baseline is van Oorschot-Wiener
      p^(1/2) over Fp2, or conditional p^(1/4) over Fp with the stated mixing
      assumption. This proposal does not replace either baseline.
    hidden_overhead: >-
      Conditional-state coverage can grow multiplicatively with branch count;
      rejection histories, coupling verification, and stagewise multiple tests
      are fully charged.
    tradeoff_note: >-
      More projections improve localization but increase data, memory, and
      multiplicity burden. Parallel sampling does not change the hard-problem
      exponent or remove verification cost.
  sota_delta:
    claim: No speedup or leakage claimed; exponent delta is 0.
    baseline_time_exponent_fp2: 0.5
    conditional_baseline_time_exponent_fp: 0.25
    proposed_time_exponent_delta: 0.0
    proposed_memory_exponent_delta: 0.0
    pareto_rows:
      time: Adds per-stage conditional estimation beyond endpoint testing.
      memory: Stores projection and conditioning tables; grows with stage and stratum counts.
      data: Requires coverage at every preregistered stage, not only endpoint samples.
      preprocessing: Source-to-kernel factorization and projection audit are charged.
      oracle: No secret, EndRing, OneEnd, or simulator-advice oracle is permitted.
      verification: Requires independent endpoint and telescoping checks.
    frontier_check: >-
      Checked all rows against endpoint independence, mixing-constant, abort,
      conversion-fibre, and the disclosed single-run true-simulator record. The
      added cost buys causal stage discrimination not supplied by those records.
