    N = 19507 family, marked there as derived rather than committed)
  - ledger/proposals/IDEA-20260807-6c7540.yaml (bulk distribution of k)
  - ledger/proposals/IDEA-20260807-653dda.yaml (causal direction)
  - '"[recall-confident] R. Balasubramanian and N. Koblitz, J. Cryptology 11
    (1998) 141-145, on the improbability of small embedding degree. NOT verified
