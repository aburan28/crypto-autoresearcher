idea:
  id: IDEA-20260811-8783a5
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-PAIR-21313f
  goal_id: GOAL-ENDO-001
  title: >-
    THE SMALL-EMBEDDING-DEGREE TAIL, ENUMERATED RATHER THAN SAMPLED: at fixed
    prime N the attainable embedding degrees are exactly the divisors of N - 1
    and k_emb <= B requires t - 1 to be one of at most B^2/2 explicit roots of
    unity mod N, of which only those landing in the Hasse window |t| <= 2 sqrt(p)
    are realised -- so the expected number of pairing-vulnerable classes at a
    given N is 2B^2 / sqrt(N), and on the campaign's own matched-order family
    N = 19507 the prediction is EXACTLY ZERO with the two exceptional traces
    t = 0 and t = 2 excluded by name
  class: measurement

  claim: >-
    (A) THE ARITHMETIC, EXACT. For E/F_p with N | #E(F_p) and N prime, N > 4,
    one has p = t - 1 mod N, hence k_emb = ord_N(t - 1). Therefore k_emb divides
    N - 1 always, and k_emb <= B holds if and only if t - 1 mod N lies in the set
    R_B of elements of multiplicative order at most B, with
    |R_B| = sum over k <= B of phi(k) <= B^2/2.
    (B) THE COUNT. Fix N and let t range over the admissible traces of the
    matched-order family, |t - 1| <= 2 sqrt(p) + 1 with p = N + t - 1 prime, an
    interval of length about 4 sqrt(N). Modelling the residues in R_B as
    equidistributed mod N gives an expected count of vulnerable classes
    |R_B| * 4 sqrt(N) / N <= 2 B^2 / sqrt(N). The two residues that are NOT
    equidistributed are t - 1 = 1 and t - 1 = -1, i.e. t = 2 and t = 0, and they
    are excluded here for concrete arithmetic reasons rather than by the model:
    t = 0 is supersingular for p > 3 and outside the ordinary scope, and t = 2
    forces p = N + 1 which for N = 19507 is 19508 and even, hence not prime.
    (C) THE PREDICTION ON THE CAMPAIGN'S OWN DESIGN. At N = 19507 one has
    N - 1 = 19506 = 2 * 3 * 3251, so the attainable embedding degrees are exactly
    the eight divisors {1, 2, 3, 6, 3251, 6502, 9753, 19506} and there is NO
    intermediate value: a class in this family has k_emb <= 6 or k_emb >= 3251,
    with nothing between. Since exactly six residues have order dividing 6 and
    two of them are the excluded exceptional ones, the prediction is that ALL 59
    classes of the matched-order family have k_emb >= 3251, i.e. the family
    contains no pairing-vulnerable class at all. This is checkable exactly, in
    seconds, with no curve construction.
    (D) WHY THIS IS A SCOPING DELIVERABLE AND NOT A RESULT. That random curves
    are not pairing-friendly is a published theorem
    [recall-confident: Balasubramanian and Koblitz, The improbability that an
    elliptic curve has subexponential discrete log problem under the
    Menezes-Okamoto-Vanstone algorithm, J. Cryptology 11 (1998); NOT re-verified
    this session]. This record claims no novelty for that. What it supplies is
    (i) a per-N CHECKABLE FINITE STATEMENT rather than an asymptotic, obtained by
    factoring N - 1 alone, (ii) the divisor-gap observation that makes the
    prediction binary at this N, and (iii) the TAIL CHECK that the lane's
    existing distribution-sampling proposal does not carry.

  mechanism: >-
    Embedding degree is the multiplicative order of a small integer modulo a
    large prime. Orders are constrained by the factorisation of N - 1, and small
    orders are attained only at the few roots of unity of that order. The Hasse
    window is of length sqrt(N), so it contains a vanishing fraction of the
    residue classes mod N; a curve therefore has small k_emb only if a residue
    that is arithmetically special happens to fall in a short window, which is a
    coincidence of density sqrt(N)/N. All known small-k_emb families are
    constructions that force the coincidence (MNT, Barreto-Naehrig, Cocks-Pinch,
    Freeman, KSS), which is why pairing-friendliness and CM structure are
    correlated by construction and not by nature (IDEA-20260807-653dda).

  tracked_object: >-
    The residue t - 1 mod N, together with its multiplicative order. The class of
    the curve is followed only through this one residue, which is a genuinely
    small projection of the instance.

  resource: >-
    R7 (pairings into F_{p^k}). The lane is a scoping lane: the resource is real
    but is available only when k_emb is small, and this record measures how often
    that is.

  lossy_projection_test: >-
    PASSES trivially and the record says so rather than dressing it up: the map
    E -> ord_N(t - 1) forgets everything except the trace, so all h members of an
    isogeny class collapse to one value. Propagation is exact and constant: every
    F_p-isogeny preserves t, hence preserves k_emb, so the object is an EXACT
    isogeny-class invariant. That constancy is what makes the lane a scoping lane
    per T3 -- the axis is closed within a class by identity, with the obstruction
    named -- and it also makes k_emb the campaign's cleanest available
    exactly-constant calibration functional, a use recorded here for
    RQ-INSTR-f8faa0 to pick up.

  t5_reachability: >-
    Vacuous within a class, and that is the honest answer: since k_emb is
    constant on the class, no walk can change it and there is nothing to reach.
    Reaching a small-k_emb curve means changing the trace, which means changing
    the group order and therefore changing the problem instance -- not a move
    available to an attacker given (E, P, Q).

  null_object: >-
    A matched family of the same shape with N chosen so that N - 1 has many small
    divisors -- for instance N prime with N - 1 = 2^a * 3^b * m -- where the set
    R_B is larger and the predicted count 2 B^2 / sqrt(N) is correspondingly
    higher. The instrument must find MORE vulnerable classes there; if it finds
    the same number in both, it is not measuring the arithmetic.

  why_not_a_renamed_known_approach: >-
    The lane already contains IDEA-20260807-6c7540, which observes k = ord_N(t-1)
    and proposes sampling the DISTRIBUTION of k at 256-bit N. This record is the
    complementary tail statement: distributions are validated in the bulk and
    fail in the tail, and the quantity that matters cryptographically is
    precisely the tail probability of k <= B. It also differs in method --
    exhaustive enumeration over a fixed N's admissible traces, which is a
    complete answer for that N rather than a sample.

  novelty_status: known
  novelty_screen: >-
    Screened this session against the RQ-PAIR lane (IDEA-20260807-6c7540,
    -df5984, -653dda, -464ff8, IDEA-20260808-40aab9) and RQ-GGMB's
    IDEA-20260807-569c82. The underlying theorem is published
    (Balasubramanian-Koblitz, recall-confident) and this record classifies itself
    as `known` on the substance while claiming the per-N enumeration and the tail
    check as the contribution. WEB SEARCH UNAVAILABLE this session, so the
    citation is recall-tagged and not verified.

  discriminated_from: >-
    NOT IDEA-20260807-6c7540 (bulk distribution of k at crypto-size N by direct
    sampling over (N, t) pairs): this record enumerates a FIXED N's admissible
    traces exhaustively and reports a tail count, which is what a sampling design
    cannot resolve. NOT IDEA-20260807-653dda (the causal direction between CM
    discriminant and k_emb), whose conclusion this record uses rather than
    repeats. NOT IDEA-20260808-40aab9 (Kani/Robert needs k_emb = 1), which asks
    what a small k_emb would buy; this asks how often it occurs.

  assumptions:
  - >-
    N prime, N | #E(F_p), N > 4, and gcd(N, p) = 1, so k_emb = ord_N(p) =
    ord_N(t - 1) [recall-confident, standard].
  - >-
    The matched-order construction of MATCHED-ORDER-DESIGN.md: N fixed,
    p = N + t - 1 required prime, D = (t - 2)^2 - 4N. The 59-class figure for
    N = 19507 is read from that design note and is marked there as derived, not
    committed; verifying it is part of the test.
  - >-
    Ordinary curves only; t = 0 is excluded as supersingular.

  proof_search_map:
    bottleneck: null
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms:
    - transform: null
      proposed_object: null
      predicted_gain: null
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations:
    - claim: null
      responsibility: null
    not_applicable_reason: >-
      Enumeration of an already-proved arithmetic statement over a finite set. No
      new theorem is proposed: the identity k_emb = ord_N(t - 1) and the
      Balasubramanian-Koblitz density are cited, and what this record adds is a
      complete finite check plus a tail comparison. A proof_search_map would be
      ceremonial here, and section 8 of docs/inventor-protocol.md requires the
      reason to be recorded rather than the map omitted.

  predictions:
  - metric: number_of_matched_order_classes_at_N_19507_with_k_emb_at_most_6
    direction: different
    minimum_effect: >-
      EXACTLY ZERO. One such class falsifies the prediction and is immediately
      interesting, because it would be an unconstructed pairing-friendly curve at
      a toy size.
  - metric: set_of_attained_embedding_degrees_at_N_19507
    direction: different
    minimum_effect: >-
      A subset of the eight divisors of 19506, with every attained value at least
      3251. Any attained value strictly between 6 and 3251 falsifies the
      arithmetic in (A) and means the implementation is computing something other
      than ord_N(t - 1).
  - metric: expected_vulnerable_count_vs_2B2_over_sqrtN
    direction: different
    minimum_effect: >-
      Over at least 20 different primes N at 15 to 30 bits, the observed count of
      classes with k_emb <= B, aggregated, must match 2 B^2 / sqrt(N) within a
      factor 2 for B in {2, 3, 4, 6, 12}. A systematic excess by more than a
      factor 2 falsifies the equidistribution heuristic HA-1 and is a genuine
      finding about the joint distribution of roots of unity and the Hasse window.
  - metric: null_family_contrast
    direction: higher
    minimum_effect: >-
      A family whose N - 1 is highly composite must show strictly more small-k_emb
      classes than a family whose N - 1 = 2 * q with q prime, at matched size. No
      difference means the instrument is not reading N - 1's factorisation.

  minimal_test:
    design: >-
      Pure integer arithmetic, no curves, minutes of compute. For each of at
      least 20 primes N between 2^15 and 2^30: factor N - 1; enumerate every
      integer t with |t| <= 2 sqrt(N + t - 1) such that p = N + t - 1 is prime and
      D = (t - 2)^2 - 4N < 0; for each admissible t compute ord_N(t - 1) by
      factoring N - 1 and testing prime-power quotients; tabulate the counts with
      k_emb <= B for B in {2, 3, 4, 6, 12}; compare to 2 B^2 / sqrt(N). Report
      N = 19507 separately and in full as the campaign's design instance, listing
      every attained embedding degree with its trace.
    controls:
    - >-
      PLANTED SIGNAL: include a Cocks-Pinch or MNT-constructed pair (N, t) with
      known small k_emb, which the enumerator MUST report at the constructed
      value. An enumerator that misses a constructed pairing-friendly instance is
      void, and this is the two-directional control GOAL-ENDO-001 C4 requires.
    - >-
      NULL: primes N with N - 1 = 2q, q prime, where R_B is minimal and the
      predicted count is at its floor.
    - >-
      Cross-check ord_N(t - 1) by two independent implementations, since an order
      computation with an incomplete factorisation of N - 1 silently returns a
      multiple.
    required_metrics:
    - per_N_factorisation_of_N_minus_1
    - per_admissible_trace_embedding_degree
    - counts_with_k_emb_at_most_B_per_N_and_B
    - observed_versus_predicted_2B2_over_sqrtN
    - planted_construction_detection_flag

  falsification_conditions:
  - >-
    A matched-order class at N = 19507 with k_emb <= 6. The prediction in (C)
    fails; report the trace and the curve, since an accidental pairing-friendly
    ordinary curve at toy size is worth having.
  - >-
    Aggregated counts exceeding 2 * (2 B^2 / sqrt(N)). HA-1's equidistribution
    fails and the tail is heavier than the standard heuristic predicts, which
    would matter for curve-selection guidance.
  - >-
    The planted construction is not detected. The enumerator is void.
  - >-
    An attained embedding degree not dividing N - 1. The implementation is wrong;
    this cannot be a mathematical outcome.

  confounders:
  - >-
    Order computation without the full factorisation of N - 1 returns a multiple
    of the true order and would systematically UNDER-report small k_emb, biasing
    the result towards the prediction. Two implementations, one of which factors
    N - 1 completely, is therefore blocking rather than advisory.
  - >-
    The primality requirement on p = N + t - 1 thins the trace set non-uniformly
    and could correlate with t mod small primes; report the admissible-trace
    count alongside every ratio so the thinning is visible.
  - >-
    At 15-bit N the predicted count 2B^2/sqrt(N) is of order 1, so a single
    family cannot resolve the law; the 20-prime aggregation exists precisely
    because of this and no conclusion may be drawn from N = 19507 alone about the
    law, only about that family.

  interpretation_limits:
  - >-
    TOY TO MEDIUM SCALE, claim_tier toy. NO ATTACK, NO EXPONENT, NO SPEEDUP;
    sota_delta zero. MOV/Frey-Ruck is classical and nothing here is novel as an
    attack route.
  - >-
    This is a scoping and curve-selection statement, and its practical content is
    a NEGATIVE: the matched-order family the campaign proposes to use is not
    contaminated by pairing-vulnerable classes, which is a prerequisite for
    reading any cost measurement on it.
  - >-
    H-ENDO-001 used, not retested; KN-FIND-b7e091 binding; P2 respected.

  heuristic_assumptions:
  - id: HA-1
    statement: >-
      For a fixed prime N, the elements of multiplicative order at most B are
      equidistributed modulo N relative to short intervals of length about
      4 sqrt(N), apart from the two exceptional residues +1 and -1, so the count
      of admissible traces with k_emb <= B is Poisson with mean
      |R_B| * 4 sqrt(N) / N.
    rigorous_support: >-
      Rigorous ingredient: |R_B| = sum_{k <= B} phi(k) <= B^2/2 exactly, and the
      Hasse interval has length exactly 4 sqrt(p) + O(1) by the Hasse bound. The
      classical distribution imitated is equidistribution of the roots of a fixed
      cyclotomic polynomial modulo N in short intervals, the same shape as
      Balasubramanian-Koblitz's own model.
    validation_plan: >-
      Direct enumeration at 15 to 30 bits, where the full trace range is
      enumerable and no sampling is required, aggregated over at least 20 primes
      N to give an expected total count of order 10 for B = 6. Comparison
      distribution: Poisson with the stated mean, compared by the exact Poisson
      tail rather than a normal approximation, since the mean is small. Tail
      check: the largest observed count over the 20 primes against the Poisson
      maximum, and separately the number of primes with a nonzero count.
      TRANSFER IS NOT CLAIMED to 256-bit N; there the same enumeration is
      infeasible and only the sampling design of IDEA-20260807-6c7540 applies.

  target_complexity:
    time_exponent: >-
      No attack exponent claimed or moved. The check costs O(sqrt(N) log N) per
      prime, i.e. seconds at the tested sizes, and it establishes a property of
      the family rather than an algorithm.
    memory_exponent: >-
      O(sqrt(N)) integers if the trace list is retained, O(1) streaming.
    best_known: >-
      For the ECDLP on these curves, parallel rho at 0.886 sqrt(N) with O(1)
      memory. For the pairing route, MOV/Frey-Ruck plus index calculus in
      F_{p^{k_emb}}, which is subexponential only when k_emb is small -- exactly
      the case this record shows does not occur in the family.
    hidden_overhead: >-
      Factoring N - 1 is required for exact order computation. Free at these
      sizes; at crypto scale it is a genuine cost and no cheapness is claimed
      there.
    tradeoff_note: >-
      Not applicable; the record proposes an enumeration, not a search.

  dominated_by: >-
    As an attack, dominated by everything, since none is proposed: parallel rho
    at 0.886 sqrt(N) with O(1) memory (KN-TECH-001, KN-TECH-006), the
    automorphism-discounted variant (KN-TECH-018), BSGS at sqrt(N)/sqrt(N)
    (KN-TECH-031). As a statement about small embedding degree, DOMINATED BY THE
    PUBLISHED LITERATURE: Balasubramanian-Koblitz already establishes the
    improbability asymptotically, and this record is a finite, checkable
    specialisation of it. Recorded as domination rather than as novelty.
  sota_delta: >-
    Zero against any attack and zero against the published density theorem. The
    delta is entirely internal: the campaign's matched-order design gains a
    verified absence of a confound at a cost of minutes.

  estimated_cost:
    implementation: low
    compute: low

  recommended_priority: low

  honest_prior_of_survival: >-
    0.95 that N = 19507's family contains no class with k_emb <= 6. 0.7 that the
    aggregated tail matches 2B^2/sqrt(N) within a factor 2. 0.00 that anything
    here moves an exponent. FILED AS A PROBABLE DEAD END THAT IS CHEAP ENOUGH TO
    KILL: its main value is removing a confound from a design the campaign
    intends to use, and its secondary value is a tail check the lane's existing
    sampling proposal cannot supply.

