idea:
  id: IDEA-20260808-a7872e
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-SDITH-001
  goal_id: GOAL-SDITH-001
  title: The d-split promise forces SDitH's own error-locator polynomial to FACTOR across
    the block partition, changing the ideal rather than the search space - and the regular-SD
    endpoint proves the entropy ratio cannot bound an algebraic attack
  class: mechanism
  claim: 'SDitH''s proof system works with a polynomial identity of the form S Q = P F, where
    Q is the monic degree-w error-locator polynomial whose roots are the error positions.
    Under the d-split promise Q is FORCED to factor as Q = prod_j Q_j with deg Q_j = w/d and
    Q_j''s roots confined to block j''s evaluation points. TWO CLAIMS. (A) This constrains
    the IDEAL, not merely the solution count: admissible Q lies on a product subvariety and
    the Groebner solving degree of the modelling becomes a function of the BLOCK WEIGHT b
    = w/d rather than of w. (B) Therefore the reduction of C1-06 and the admissibility ratio
    of IDEA-20260805-cbd93d bound what an ENUMERATION adversary gains but cannot be the whole
    story for the concrete cost of an ALGEBRAIC one, because at b = 1 the problem is regular
    syndrome decoding, which published algebraic attacks handle far better than plain SD of
    the same entropy. The deliverable is the threshold block weight b* at which the algebraic
    modelling''s charged cost crosses charged ISD, and SDitH''s distance from b* in block-weight
    units.'
  mechanism: 'For plain SD the error-locator modelling has w + 1 unknown coefficients and
    a solving degree growing with w, which is why generic Groebner attacks lose to ISD. The
    split replaces one degree-w polynomial by d polynomials of degree b on disjoint evaluation
    sets: unknowns rise from w + 1 to w + d, but each block''s subsystem decouples onto n/d
    evaluation points. At b = 1 each Q_j is linear and the system is low degree - the regular-SD
    structure. The prediction is a monotone interpolation in b, and the decisive quantity
    is where the interpolated cost crosses ISD. Note this does NOT contradict C1-06''s reduction,
    because the reduction bounds the ADVANTAGE ratio while leaving the absolute cost of both
    problems free to fall together.'
  why_not_a_renamed_known_approach: 'IDEA-20260805-7504c6 proposes d as a continuous dial
    with the regular endpoint as a nearby-object control - a measurement design. This supplies
    the mechanism (forced factorisation of Q, i.e. a change in the ideal) and uses the endpoint
    as a proof device about the scope of cbd93d''s bound. It is also not a restatement of
    published regular-SD attacks (Briaud-Oygarden style algebraic modelling; Esser-Santini
    on regular decoding asymptotics - BOTH RECALLED FROM MEMORY, UNVERIFIED): those sit at
    b = 1 and the content here is the interpolation and the threshold.'
  predictions:
  - observable: Groebner solving degree of the d-split error-locator modelling at toy (n,
      k, w, q).
    metric: First-fall and solving degree as functions of b = w/d.
    predicted: Strictly increasing in b, with a low-degree regime near b = 1 saturating to
      the plain-SD value by moderate b. A flat curve falsifies (A) and strengthens cbd93d.
  - observable: Threshold block weight b* where charged algebraic cost equals charged ISD
      cost.
    metric: b*, dimensionless, at SDitH's (n, k, q).
    predicted: Small, my prior being b* between 1 and 4, putting SDitH's own b (order tens)
      far above it. The DISTANCE is the deliverable.
  - observable: Solve wall clock, algebraic versus Prange and Stern, on identical certified
      instances.
    metric: Ratio at matched (n, k, w, d).
    predicted: Algebraic wins at b = 1, loses by b = 4 to 6. A crossing above SDitH's own
      b would be security-relevant and must be routed to independent review rather than reported
      from this proposal.
  minimal_test: At toy parameters over F_q with q = 251 or 256 (n = 48-96, k = n/2, w chosen
    so b sweeps 1, 2, 3, 4, 6, 8), build the d-split error-locator system, run F4/F5 to solution,
    record first-fall and solving degrees, peak matrix size and wall clock, and compare against
    Prange and Stern on the same instances. Every solve certified by re-checking H e = s and
    the per-block weights. Budget order 10^3 to 10^4 core-seconds - the only idea in this
    slice needing real algebra compute.
  controls:
  - PLAIN-SD CONTROL - identical pipeline on plain-SD instances at the same (n, k, w) with
    no promise; the degree difference is the effect.
  - PERMUTATION NULL - randomly permute coordinates to destroy the promise while preserving
    all cardinalities; the algebraic advantage must vanish. A surviving advantage means the
    effect is not the split.
  - ENTROPY-ONLY PREDICTOR - compute cbd93d's ratio per cell and check whether the measured
    speedup exceeds it; exceeding it is the decisive observation for (B).
  confounders:
  - Groebner timings are implementation, ordering and library dependent; pin all three and
    report versions.
  - At tiny b the instance may have many solutions, changing the problem; report the expected
    solution count per cell.
  - Field size interacts with the modelling (q > n versus q < n); hold q fixed across the
    b sweep.
  falsification_conditions:
  - Solving degree is independent of b, so the split does not change the ideal - a clean negative
    that strengthens SDitH's inherited estimate.
  - The measured speedup never exceeds the admissibility ratio at any b including b = 1, contradicting
    the published regular-SD position and indicating the modelling used here is not the one
    those attacks use.
  - b* lands above SDitH's own block weight, which is a security-relevant positive requiring
    review rather than publication from this record.
  interpretation_limits: Toy-scale Groebner behaviour extrapolates badly and is labelled toy
    throughout. The deliverable is a degree curve plus a threshold estimate, not a cost at
    SDitH's parameters. AGENTS.md rule 7 binds.
  assumptions:
  - SDitH uses an S Q = P F error-locator modelling with a d-split witness. RECALLED FROM
    MEMORY; must be verified against the Round-3 specification, unread by this program.
  - The promise is disjoint equal-size blocks of equal weight.
  heuristic_assumptions:
  - id: HA-1
    statement: For the d-split error-locator system at (n, k, w, d, q), the solving degree
      under degree-reverse-lex equals the first-fall degree, so first-fall is a valid cost
      predictor.
    rigorous_ingredient: First-fall is a computable lower bound on solving degree for any
      system; equality is the standard semi-regularity-style assumption.
    distribution_imitated: The semi-regular sequence model - generic systems behave as their
      Hilbert series predicts.
    validation_route: TOY SCALE, LABELLED AS SUCH - measure both degrees across the b sweep
      at n = 48-96 and report every cell where they differ. Extrapolation to SDitH's n is
      explicitly not attempted.
    tail_checks: Report the largest b at which the computation terminates in budget and state
      that all statements beyond it are extrapolation.
  - id: HA-2
    statement: b* depends on (R, w/n, q) only and not on n separately, in the regime where
      the asymptotic modelling applies.
    rigorous_ingredient: The system's Hilbert series depends on those ratios rather than on
      n alone.
    distribution_imitated: Standard scaling assumptions for semi-regular systems.
    validation_route: Sweep n at fixed ratios and check that measured b* is stable.
    tail_checks: Report drift of b* with n; drift invalidates the extrapolation and must be
      stated, not smoothed.
  target_complexity:
    time_exponent: At b = 1 the algebraic route is believed to beat ISD (published regular-SD
      attacks, unverified here). The claim is that the crossover in b is a genuine boundary
      rather than a constant-factor one, and that SDitH sits far above it. No exponent improvement
      against SDitH is claimed or expected.
    memory_exponent: Groebner peak matrix size at the solving degree, charged explicitly rather
      than reported as free - the same discipline this slice applies to ISD.
    best_known_baseline: Charged ISD at SDitH's (n, k, w, q), i.e. the object H-SDITH-d37289
      and IDEA-20260805-43d6df are building.
    hidden_overhead_disclosure: Groebner asymptotics hide large constants and are notoriously
      optimistic; any b* from toy timings carries at least a factor-of-2 uncertainty in b.
    time_memory_tradeoff: Algebraic solving is memory-hungry and parallelises poorly while
      ISD parallelises trivially; under full cost that asymmetry pushes b* downward and must
      be included, not omitted.
  sota_delta: Identifies the exact scope limit of a filed proposal's completeness claim and
    supplies the mechanism and measurement that decide it. A flat degree curve strengthens
    cbd93d; a steep one shows the campaign needs an algebraic arm it does not have.
  dominated_by: Not dominated inside the corpus (7504c6 is a design, cbd93d is the entropy
    bound, H-SDITH-d37289 is block-aligned ISD only). Externally the b = 1 endpoint is dominated
    outright by published regular-SD attacks, which is why it is used as a proof device rather
    than claimed. The interpolation and threshold are unclaimed as far as I know, and that
    knowledge is unverified.
  estimated_cost: Implementation MEDIUM (algebraic modelling plus certificates). Compute MEDIUM.
  recommended_priority: high
  honest_prior_of_survival: About 0.6 that solving degree depends materially on b; about 0.1
    that b* lands near SDitH's own block weight. High information value, low probability of
    a security consequence - the right shape for this goal.
  novelty_status: unverified
  novelty_screen: Screened against IDEA-20260801-017, 20260805-7504c6, cbd93d, 43d6df, bf6448,
    H-SDITH-d37289, H-SDITH-f1acdd, KNOWLEDGE_BARRIERS.txt, REJECTED_TITLES.txt, and my own
    C1-06. External unscreened.
  discriminated_from: IDEA-20260805-cbd93d (entropy ratio bounding enumeration gain) and C1-06
    above (a reduction bounding every adversary's ADVANTAGE ratio); this addresses the absolute
    cost of one specific non-enumerative attack family and where its cost curve crosses ISD.
