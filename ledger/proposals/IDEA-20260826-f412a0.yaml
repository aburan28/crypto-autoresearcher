  novelty_screen:
    method: >-
      Filesystem screening; crypto-kb bound to ':memory:', returns nothing. Read:
      RQ-VOLC-f6253b in full; GOAL-ENDO-001 head and P3; IDEA-20260821-ad7c97 in
      full; the titles/tracked_object of the 34 VOLC-bound proposals via grep;
      EV-ENDO-10109d. No web source opened for this record.
    results: >-
      NEAREST FILED WORK, NAMED. (1) IDEA-20260821-ad7c97 identifies the class and
      reads the 66/72 split as a STATIC per-curve floor indicator and attributes
      the over-dispersion to a sampler-subgroup mixture. This record is DYNAMIC: it
      tracks the height process of a walk and its hitting time, an object ad7c97
      never constructs; the two are complementary (ad7c97 = where a curve sits;
      this = how long to walk to a target level). (2) IDEA-20260815-101067
      stratifies a per-curve cost battery by level with nulls -- a static
      cross-tabulation; it measures cost AT a level, not the cost to MOVE between
      levels. (3) IDEA-20260811-565915 warns volcano regressors collapse to f_E;
      this record deliberately treats the 2-adic height as the state variable of a
      Markov chain rather than a regressor. (4) IDEA-20260807-3f5545 treats the
      level as the vector (v_ell(f_E))_ell -- a richer static label, still not a
      dynamical hitting-time object. (5) IDEA-20260808-4d77a6 shows level is
      readable from group structure; it supplies the level-assignment method this
      record uses as input.
    verdict: >-
      UNVERIFIED, and mechanism-distinct from all five. The new object is the
      vertical height Markov process of a random ell-isogeny walk and its
      hitting/mixing time as the reachability (T5) cost of depth; no filed VOLC
      record builds a dynamical object or measures a hitting time -- all treat the
      level as a static label. Volcano structure and expander mixing are classical;
      the honest label is `unverified` because no external source was opened.

  object_first_candidate:
    tracked_object: >-
      THE HEIGHT PROCESS h_t in {0,...,n} of a random ell-isogeny walk on the
      volcano -- the vertical coordinate (levels above the floor) followed through
      the walk, together with its hitting time to the rim and its mixing time.
      Established families declared OFF-LIMITS as the primary lens for this session:
      per-curve cost batteries stratified by level, the static level label /
      level-vector, and the group-structure floor indicator. The object here is
      neither a curve nor a level label; it is a TRAJECTORY on the level axis.
    lossiness: >-
      PASSES THE LOSSY-PROJECTION TEST. The projection (full walk state = current
      curve, i.e. a vertex of the volcano) |-> (its height h_t) discards the entire
      HORIZONTAL position -- which crater curve / which subtree / which class-group
      element -- and retains only one integer in {0,...,n}. It is emphatically not
      a change of coordinates: the fibre over a given height h contains every curve
      at that level (at the rim, all h(O_0) crater curves; deeper, exponentially
      many tree curves), an exponentially large set, and knowing h_t does not
      recover the curve. What is discarded (horizontal position) is discarded
      compatibly with the walk operation because a single ell-isogeny step changes
      the level by at most one with probabilities depending only on the current
      height (rim vs interior vs floor), so the height process is itself a Markov
      chain: the retained coordinate propagates deterministically in law, which is
      the required compatibility.
    propagation: >-
      One-step propagation is defined and measurable: from height h the next height
      is h+1, h, or h-1 with probabilities p_up(h), p_stay(h), p_down(h) determined
      by the volcano geometry -- at an interior tree node one parent (up) and ell
      children (down) give p_up = 1/(ell+1), p_down = ell/(ell+1); at the rim the
      crater edges add horizontal (stay-in-height) moves; at the floor p_up = 1.
      These are computed from ell and the crater length and are directly checkable
      by BFS on the toy volcano, and the empirical transition counts of a simulated
      walk are compared against them.
    survival_score: >-
      Survives for any ell-volcano of depth n >= 1 -- i.e. any class whose
      conductor is divisible by ell. It dissolves for classes with ell-indivisible
      conductor (a single-level "volcano" of height 0, where the object is trivial
      and the horizontal Cl(O)-torsor navigation of IDEA-20260826-228fa6 is the
      whole story), for supersingular graphs (out of scope, no ordinary volcano),
      and at the rim itself where the process is purely horizontal -- which is
      exactly the clean interface to the ICINV Cl(O)-torsor object.

  proof_search_map:
    bottleneck: >-
      The step that decides whether volcano depth "changes any measurable ECDLP
      attack cost". Depth is invisible per-curve on G (H-ENDO-001), so the only
      live channel is navigation cost, and the bottleneck is whether the vertical
      hitting time is additive or dominating. Removing it settles RQ-VOLC's
      decision target for the ell=2 direction with a measured number rather than an
      appeal to the scalar-action fact.
    baseline_embedding:
      parameter_slice: >-
        The committed p=4001 t=30 census (138 curves, five ell=2 levels,
        IDEA-20260821-ad7c97), whose full ell=2 volcano is small enough to
        enumerate exactly and simulate walks on; and the p=6007 class as the
        nearby-object control.
      reproduction_check: >-
        Before simulation, build the ell=2 volcano by exact 2-isogeny BFS on the
        census and require the level cardinalities to reproduce (3, 9, 18, 36, 72)
        summing to 138 (IDEA-20260821-ad7c97's ARM 0 gate). A mismatch means the
        census is not the full class or the level assignment is wrong, and halts
        the experiment.
    observation_collision:
      observable: >-
        The expected floor-to-rim hitting time as a function of depth n.
      distinct_preimage_search: >-
        A COLLISION IS NAMED. Two different volcano geometries -- a shallow wide
        one and a deep narrow one -- can share the same expected hitting time from a
        FIXED start level while differing in their depth-scaling. So a single
        hitting-time number does not certify the additive-vs-dominating dichotomy;
        only the SCALING of hitting time with depth n (swept across ell and across
        synthetic volcanoes of varying depth) separates the branches, which is why
        the design sweeps n rather than measuring one volcano.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the walk on the exponentially large volcano vertex set by the
          birth-death chain on {0,...,n}, where "reach a target curve" becomes the
          exact hitting time of a level -- a 1-D problem with a closed-form
          expected hitting time in terms of p_up/p_down.
        predicted_gain: >-
          Turns the vague reachability clause of T5 into a computable hitting-time
          formula whose depth-scaling is the decision statistic, and gives a
          matched null (a birth-death chain with the same drift but no volcano) for
          free.
      - transform: telescoping_potential
        proposed_object: >-
          A potential Phi(h) = sum over levels of the local drift, so that the walk's
          expected hitting time telescopes into a sum of per-level charges, each
          measured separately.
        predicted_gain: >-
          Localises where the depth cost is paid (uniformly per level = additive;
          concentrated near the floor = dominating), attributing the cost to a
          level rather than to a label.
    quantifier_order: >-
      THE CLAIM WRITTEN OUT. Additive branch: THERE EXISTS a constant C such that
      FORALL depths n (over the swept synthetic volcanoes and the real ones),
      expected floor-to-rim hitting time <= C * n. Dominating branch: FORALL
      constants C THERE EXISTS a depth n with hitting time > C * n (super-linear
      growth). The witness C may depend on ell but not on n. No claim uniform over
      all ell or all classes is made; every statement is scoped to the tested
      volcanoes.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For ell = 2 (and any small ell swept), over volcanoes of depth up to the
        tested maximum, the expected floor-to-rim hitting time scales as (linearly /
        super-linearly) in depth, so depth's navigation cost is (additive /
        dominating) relative to the ~sqrt(h(O)) horizontal cost, at claim_tier
        toy." It can NEVER certify anything about per-curve ECDLP hardness (invisible
        on G), about crypto scale, or about an exponent.
      nearby_object_control: >-
        A MATCHED BIRTH-DEATH NULL with the same p_up/p_down drift but no volcano
        semantics: if the real height process's hitting time matches the null's,
        the effect is generic drift, not volcano-specific structure. Second nearby
        object: a DEPTH-0 class (ell-indivisible conductor) where the height object
        is trivial and hitting time is zero -- the additive-branch floor.
    proof_obligations:
      - claim: "an ell-isogeny walk projects to a birth-death chain on {0,...,n} with height-dependent transitions"
        responsibility: baseline
      - claim: "p_up=1/(ell+1), p_down=ell/(ell+1) at interior nodes; rim and floor boundary conditions"
        responsibility: correctness
      - claim: "expected floor-to-rim hitting time has the birth-death closed form and scales as measured in n"
        responsibility: runtime
      - claim: "depth is invisible on G, so navigation is the only channel (H-ENDO-001)"
        responsibility: interface
      - claim: "any implied navigation advantage over the automorphism-discounted baseline is P3-gated"
        responsibility: scope
      - claim: "toy tier, ell=2 primary, swept synthetic depths, two real classes"
        responsibility: scope
    not_applicable_reason: null

  assumptions:
    - >-
      The census is the COMPLETE class so the volcano is fully reconstructed; a
      subset gives wrong level cardinalities and a truncated tree. The (3,9,18,36,72)
      = 138 check is the hard gate (shared with IDEA-20260821-ad7c97).
    - >-
      The crater is rapidly mixing horizontally (expander, recalled from
      Jao-Miller-Venkatesan under GRH), so that once the walk reaches the rim the
      horizontal navigation is the ~sqrt(h(O)) term and the vertical hitting time is
      the quantity under test. If the crater is NOT rapidly mixing at toy scale
      (small h(O)), the horizontal baseline must be measured directly rather than
      assumed, which the design does.
    - >-
      Vertical 2-isogeny construction (N18) is NOT required: the volcano is built by
      exact 2-isogeny BFS on the certified census using standed Velu formulas at toy
      scale, and levels are cross-checked against group structure
      (IDEA-20260808-4d77a6). The unimplemented N18 method is not on the path.

  predictions:
    - metric: >-
        hitting_time_exponent: fitted exponent alpha in (expected floor-to-rim
        hitting time) ~ n^alpha, over synthetic ell=2 volcanoes of swept depth n
      direction: different
      minimum_effect: >-
        H-ADDITIVE requires alpha in [0.8, 1.2]. An alpha >= 1.5 selects
        H-MIXING-BOUND. An alpha near 1 with the real volcanoes on the fitted line
        is the expected, invisibility-confirming outcome.
    - metric: >-
        real_vs_null_hitting_time: ratio of the measured height-process hitting
        time to the matched birth-death null's, on the real p=4001 volcano
      direction: different
      minimum_effect: >-
        Within [0.8, 1.25] means the effect is generic drift and carries no
        volcano-specific content. A ratio outside that band means the volcano
        geometry contributes beyond the drift, which must be explained.
    - metric: >-
        transition_probability_agreement: empirical up/down/stay counts of a
        simulated walk against p_up=1/3, p_down=2/3 (ell=2 interior)
      direction: different
      minimum_effect: >-
        Agreement within Monte-Carlo error (chi-square not significant at 5%). A
        significant departure means the height projection is not the claimed
        birth-death chain and claim (A) fails.
    - metric: >-
        horizontal_baseline: measured crater mixing time / horizontal navigation
        cost on the rim, in isogeny steps
      direction: different
      minimum_effect: >-
        Reported with an error bar; the additive-vs-dominating verdict is the
        COMPARISON of the vertical hitting time against this horizontal baseline,
        so the baseline must be measured, not assumed ~sqrt(h(O)).
    - metric: >-
        depth0_floor: hitting time on a depth-0 (ell-indivisible conductor) class
      direction: lower
      minimum_effect: >-
        Exactly 0 (no vertical structure). A non-zero value means the instrument is
        inventing depth cost where there is none and voids the additive-branch
        floor.

  minimal_test:
    design: >-
      FIVE STEPS. STEP 1 (zero to minutes): build the ell=2 volcano of the p=4001
      census by exact 2-isogeny BFS; verify level cardinalities (3,9,18,36,72)=138
      and cross-check levels against group structure (gate). STEP 2 (minutes):
      derive p_up/p_down/p_stay from the geometry and simulate 10^4 random 2-isogeny
      walks, recording the height process; check the empirical transitions against
      the derived probabilities and measure the floor-to-rim hitting time. STEP 3
      (minutes): the MATCHED BIRTH-DEATH NULL with the same drift but no volcano;
      compare hitting times. STEP 4 (minutes): SWEEP synthetic ell=2 volcanoes of
      depth n in {1,...,8} and small ell in {2,3,5}, fit the hitting-time exponent
      alpha. STEP 5 (minutes): measure the horizontal crater mixing time / navigation
      baseline on the rim, and form the additive-vs-dominating verdict as the
      vertical-over-horizontal ratio. Repeat STEP 1-3 on the p=6007 class.
    controls:
      - >-
        MATCHED BIRTH-DEATH NULL: same p_up/p_down drift, no volcano semantics
        (inventor-protocol section 3); a real effect must beat generic drift.
      - >-
        DEPTH-0 NULL: an ell-indivisible-conductor class where the height object is
        trivial and hitting time must be 0.
      - >-
        HORIZONTAL BASELINE: measured crater navigation cost, so the verdict is a
        measured ratio, not a comparison against an assumed sqrt(h(O)).
      - >-
        LEVEL CROSS-CHECK: 2-isogeny BFS level assignment must agree with the
        group-structure floor indicator (IDEA-20260821-ad7c97) on the 2-part, or
        the disagreement is itself the finding.
      - >-
        POSITIVE CONTROL: plant a synthetic strong down-drift (deepened tree) and
        confirm the instrument reports a super-linear hitting time -- an instrument
        that cannot see a planted dominating cost cannot support an additive verdict
        (GOAL-ENDO-001 C4 / RQ-INSTR).
      - >-
        NEARBY-OBJECT CONTROL: the p=6007 class, whose depth and level structure
        must be derived first.
    required_metrics:
      - ell=2 volcano structure with level cardinalities and the BFS certificate
      - derived vs empirical transition probabilities (p_up/p_down/p_stay)
      - floor-to-rim expected hitting time on the real volcano, with error bar
      - matched birth-death null hitting time and the real/null ratio
      - fitted hitting-time exponent alpha over swept depths and ell
      - measured horizontal crater navigation baseline and the vertical/horizontal ratio
      - depth-0 floor (must be 0) and planted-down-drift recovery (must be super-linear)
      - artifact manifest with source hashes, seeds, and a rebuild receipt

  falsification_conditions:
    - >-
      The fitted hitting-time exponent alpha is in [0.8, 1.2] and the real
      volcanoes lie on the fitted line. H-ADDITIVE holds: depth's navigation cost is
      additive O(depth), a lower-order term on horizontal navigation, so depth is
      invisible to the transport exponent -- the expected negative, delivered WITH
      the measured additive obstruction rather than asserted from H-ENDO-001.
    - >-
      alpha >= 1.5 (super-linear) and the real/null ratio is outside [0.8, 1.25].
      H-MIXING-BOUND holds at this scope: the vertical hitting time grows fast
      enough to dominate horizontal navigation on deep volcanoes. This is NOT
      recorded as a speedup; if it implies any navigation advantage over the
      automorphism-discounted baseline it triggers GOAL-ENDO-001 P3 before any
      record states it.
    - >-
      The empirical transition probabilities disagree with the derived
      p_up/p_down/p_stay significantly. The height projection is not the claimed
      birth-death chain; claim (A) fails and the object must be redefined before any
      hitting-time reading is interpreted.
    - >-
      The depth-0 null shows a non-zero hitting time, or the planted down-drift
      positive control is not recovered as super-linear. Under GOAL-ENDO-001 P1 the
      instrument fails its two-directional control; measurement stops and all arms
      are attempted_and_inconclusive.
    - >-
      The level cardinalities do not reproduce (3,9,18,36,72)=138. The volcano is
      not the identified one; the experiment halts at STEP 1 for the cost of a BFS.

  confounders:
    - >-
      TOY DEPTH IS SHALLOW. The real p=4001 ell=2 volcano has depth 4, too few
      points to fit an exponent from the real class alone. MITIGATION: the exponent
      is fitted on SWEPT SYNTHETIC volcanoes of depth up to 8; the real class is one
      data point checked against the fitted line, not the fit itself.
    - >-
      CRATER SIZE INTERACTION. At small h(O_0) the crater is a short cycle and
      horizontal navigation is not yet in its asymptotic regime, so the
      vertical/horizontal ratio can be misleading. MITIGATION: the horizontal
      baseline is measured directly at the same scale, not extrapolated.
    - >-
      STAY-MOVES AT THE RIM. Crater (horizontal) edges are "stay" moves for the
      height process, inflating the effective stay probability and slowing apparent
      vertical mixing. MITIGATION: the transition model explicitly separates rim
      stays from interior stays, and the derived probabilities account for the
      crater length.
    - >-
      LEVEL-ASSIGNMENT DISAGREEMENT. The 2-isogeny BFS level and the group-structure
      floor indicator could disagree on a curve; that disagreement is a finding, not
      a nuisance, and must be reported.
    - >-
      NAVIGATION IS NOT THE ATTACK. Even a dominating vertical cost is a cost to
      REACH a curve, not a cost to solve the DLP on it; the vectorization/T5 cap
      (~sqrt(h(O))) still bounds any exploitation and this confounder is stated in
      the interpretation limits, not hidden.

  interpretation_limits:
    - >-
      TOY TIER, ell=2 PRIMARY, SWEPT SYNTHETIC DEPTHS AND TWO REAL CLASSES. Nothing
      transfers to cryptographic scale and no transfer is offered.
    - >-
      DEPTH IS INVISIBLE ON THE PRIME-ORDER SUBGROUP. This record measures a
      NAVIGATION cost between curves, not per-curve ECDLP hardness, which is a
      scalar problem on G independent of depth (H-ENDO-001). A dominating vertical
      cost changes reachability, not hardness.
    - >-
      A NAVIGATION COST IS CAPPED BY VECTORIZATION. Even if depth dominates vertical
      navigation, reaching a target curve is still bounded by the ~sqrt(h(O)) ~
      p^{1/4} horizontal cost, which this record does not beat; so neither branch
      yields a sub-rho attack, and P3 governs any claim that it might.
    - >-
      NO EXPONENT MOVES IN EITHER BRANCH. sota_delta is zero on every attack axis
      whatever the outcome.

  heuristic_assumptions:
    - id: H1
      statement: >-
        BIRTH-DEATH PROJECTION. A random ell-isogeny walk on an ordinary volcano of
        depth n, projected to its level, is a time-homogeneous birth-death chain on
        {0,...,n} with p_up=1/(ell+1), p_down=ell/(ell+1) at interior levels,
        reflecting boundary (p_up=1) at the floor, and rim mixing (crater stays) at
        level n, so its expected floor-to-rim hitting time has the standard
        birth-death closed form.
      rigorous_support: >-
        RIGOROUS INGREDIENT: on a balanced ell-ary tree a non-backtracking or
        simple random walk's level is exactly a birth-death chain with those
        transition probabilities, a deterministic combinatorial fact about the tree.
        CLASSICAL STATEMENT IMITATED: the standard birth-death hitting-time formula
        E[T_{0->n}] = sum over levels of products of p_down/p_up ratios, applied to
        the volcano tree. THE GAP, STATED: the rim is not a single absorbing state
        but a mixing crater, so the boundary condition at level n is approximate;
        the assumption is that crater mixing is fast relative to the vertical
        hitting time, which the horizontal-baseline metric tests directly.
      falsification_condition: >-
        The empirical transition counts of a simulated walk depart significantly
        from p_up=1/(ell+1), p_down=ell/(ell+1), or the measured hitting time
        departs from the birth-death closed form by more than 25%.
      validation_plan: >-
        SAMPLE: 10^4 simulated ell-isogeny walks on the exact toy volcanoes (real
        and synthetic). SHORTCUT: none needed; the volcano is enumerable at toy
        scale, which is the point of measuring here. COMPARISON: empirical
        transition histogram vs the derived probabilities (chi-square); empirical
        hitting-time distribution vs the birth-death law. TAIL CHECK: the longest
        floor-to-rim walk against the predicted upper quantile. TRANSFER: the
        crypto-scale volcano (depth ~ v_ell of a large conductor) is NOT claimed;
        the projection is validated only at the swept toy depths.
    - id: H2
      statement: >-
        HORIZONTAL EXPANDER BASELINE. Once at the rim, the crater ell-isogeny walk
        mixes in O(log h(O_0)) steps and reaches a target crater curve in
        ~sqrt(h(O_0)) steps by a meet-in-the-middle / vectorization argument, so the
        horizontal navigation cost is the sqrt(h(O_0)) term against which the
        vertical hitting time is compared.
      rigorous_support: >-
        RIGOROUS INGREDIENT: the crater is a Cayley graph of Cl(O_0) on the small
        primes, and vectorization on a group of size h has meet-in-the-middle cost
        O(sqrt(h)) (a counting argument). CLASSICAL STATEMENT IMITATED: rapid mixing
        of ell-isogeny expander walks on ordinary crater graphs under GRH
        (Jao-Miller-Venkatesan). THE GAP: at toy h the O(log) mixing constant is not
        asymptotic; the baseline is therefore MEASURED, not assumed, and H2 is used
        only to name the quantity being measured.
      falsification_condition: >-
        The measured crater mixing time is not O(log h(O_0)) at the tested scales,
        or the horizontal navigation cost is not ~sqrt(h(O_0)); then the baseline
        must be quoted from measurement alone and the asymptotic label dropped.
      validation_plan: >-
        SAMPLE: crater walks on the real p=4001 and p=6007 craters and on synthetic
        craters of varying h. COMPARISON: measured mixing/navigation cost against
        log h and sqrt(h). TAIL CHECK: worst-case start against the predicted
        quantile. TRANSFER: none; the baseline is measured at the scales used.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS CLAIMED OR MOVED. This is a measurement of a navigation cost
      and is explicitly a BUILDING BLOCK for RQ-VOLC's decision target and gate T5:
      it converts "depth is invisible on the prime-order subgroup" from an appeal to
      H-ENDO-001 into a measured hitting-time scaling. Experiment cost: exact
      2-isogeny BFS on <= ~200-curve toy volcanoes, 10^4 simulated walks, and a
      depth sweep to 8 -- seconds to minutes on one core.
    memory_exponent: >-
      O(#class) vertices held for the volcano plus O(depth) per walk; negligible at
      toy scale. No preprocessing table, no time-memory tradeoff for the measurement
      itself.
    best_known: >-
      For the ECDLP on these curves: Pollard rho ~0.886 sqrt(pi N / 2) with O(w)
      memory, automorphism-discounted by sqrt(|Aut|) (KN-TECH-018), and BSGS at
      ~sqrt(N) time and memory -- both matched controls, neither challenged. For
      REACHING a target curve: vectorization on the crater at ~sqrt(h(O_0)) ~
      p^{1/4}, the horizontal baseline this record measures the vertical cost
      against; the record does not beat it.
    hidden_overhead: >-
      NOTHING HIDES IN AN o(1) BECAUSE NO ASYMPTOTIC IS CLAIMED. What is disclosed:
      the depth-sweep exponent is fitted on synthetic volcanoes and validated on two
      real toy classes; extrapolating alpha to crypto-scale conductor depths is NOT
      done, and the crater expander constants are measured, not assumed asymptotic.
    tradeoff_note: >-
      The relevant statement is the negative reachability one: even a dominating
      vertical navigation cost is capped by the horizontal vectorization cost
      ~sqrt(h(O_0)) for reaching a target curve, so neither branch produces a
      sub-rho attack; parallelization of the walk is embarrassingly parallel but
      does not change the exponent.

  dominated_by: >-
    CHECKED ACROSS EVERY FRONTIER AXIS BEFORE ANSWERING. As an ECDLP attack: n/a
    (no result claimed) -- no time/memory/query point is offered and no frontier row
    applies. As a theorem about volcanoes: dominated by classical volcano theory
    (Kohel, Fouquet-Morain, Sutherland) and standard birth-death hitting-time
    formulas, which already contain the height chain; the assembly into a T5
