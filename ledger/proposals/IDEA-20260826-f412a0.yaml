    vectorization frontier (~p^{1/4}) dominates any exploitation, disclosed above.
  sota_delta: >-
    ZERO on every attack axis in both branches. Time exponent unchanged at 1/2,
    memory unchanged, no query model touched, claim_tier toy. What changes is the
    campaign's adjudication of RQ-VOLC: from "depth is invisible on G" asserted from
    H-ENDO-001 to a MEASURED hitting-time exponent alpha (additive if ~1, dominating
