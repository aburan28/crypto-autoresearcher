idea:
  id: IDEA-20260826-f412a0
  question_id: RQ-VOLC-f6253b
  research_question: RQ-VOLC-f6253b
  added: '2026-08-26'
  title: >-
    VOLCANO DEPTH IS A NAVIGATION COST, NOT A PER-CURVE COST: track the
    height-above-floor process h_t of a random ell-isogeny walk as a lossy
    projection of the walk that keeps only the VERTICAL coordinate, and decide
    whether depth adds only an ADDITIVE O(depth) hitting-time cost to reach a
    target curve (invisible to the transport exponent) or a mixing-dominating cost
    -- the exact reachability question RQ-VOLC and gate T5 turn on, measured with a
    matched birth-death null.
  class: measurement

  claim: >-
    THREE SEPARABLE CLAIMS. NO ATTACK IS PROPOSED, NO EXPONENT MOVES, AND NOTHING
    IS CLAIMED TO EXCEED THE AUTOMORPHISM-DISCOUNTED BASELINE.

    (A) THE VOLCANO WALK PROJECTS ONTO A BIRTH-DEATH HEIGHT CHAIN. An ordinary
    ell-isogeny graph on a class is a volcano (Kohel; Fouquet-Morain): a cycle of
    crater curves at the rim (End = maximal order at ell, i.e. ell does not divide
    the conductor f_E) with balanced ell-ary trees of depth n = v_ell(f_max)
    hanging to a floor. A step of a random ell-isogeny walk changes the curve's
    level by at most one; projecting the walk to its height h_t (levels above the
    floor, h in {0,...,n}) gives a birth-death Markov chain whose up/down/stay
    probabilities are fixed by the volcano's branching degree ell and the crater
    length. CLAIM: this height chain is a genuine, computable object whose HITTING
    TIME to a target level and MIXING TIME are the vertical component of the cost
    to navigate the class -- i.e. the cost to REACH a specified curve, which is
    exactly gate T5's reachability question restricted to the ell-adic direction.

    (B) DEPTH ENTERS ONLY THROUGH THIS CHAIN, AND ONLY IF THE CHAIN IS SLOW.
    RQ-VOLC's decision target states depth is invisible on the prime-order
    subgroup, where every endomorphism is a scalar (H-ENDO-001). So depth cannot
    change per-curve ECDLP hardness; the ONLY channel by which depth can reach a
    cost is the navigation cost of moving between curves, and that is the height
    chain's hitting time. CLAIM: whether depth "changes any measurable ECDLP attack
    cost" reduces to whether the height chain's expected hitting time to a target
    level grows ADDITIVELY (O(depth), a lower-order term on the horizontal
    class-group navigation of ~sqrt(h(O)) ~ p^{1/4}) or MULTIPLICATIVELY (dominating
    it). This is a measurable dichotomy, not a belief.

    (C) THE DISCRIMINATION, BOTH BRANCHES NAMED.
    (H-ADDITIVE) The height chain's expected floor-to-rim hitting time is O(n) =
    O(depth), so a random isogeny walk descends and ascends the volcano in time
    linear in depth, and the vertical navigation cost is a lower-order additive term
    that does not change the exponent of class navigation. Then DEPTH IS INVISIBLE
    to the transport exponent, confirming the RQ-VOLC expectation with a MEASURED
    obstruction (the hitting-time growth exponent ~1 in depth), a first-class
    negative deliverable at the inventor-protocol section 4 standard.
    (H-MIXING-BOUND) The height chain's hitting or mixing time grows super-linearly
    in depth (e.g. because the down-drift toward the floor is strong and reaching
    the rim from deep in a tree is rare), so on a deep volcano the vertical
    navigation cost dominates the horizontal, and depth becomes the binding cost of
    reaching a target curve. This does NOT get recorded as a speedup or a break; if
    it implies any navigation advantage relative to the automorphism-discounted
    baseline it triggers GOAL-ENDO-001 P3 for independent review before any record
    states it. It is framed strictly as a test.

  mechanism: >-
    T1 says ECDLP transports along F_p-isogenies of degree coprime to N up to
    transport cost, and the whole class falls if any curve in it does; so the
    campaign's operative question for VOLC is not per-curve hardness (invisible on
    G) but the COST OF REACHING a cheaper curve -- gate T5. The volcano's vertical
    structure is a real obstacle to that navigation: to move horizontally in the
    class group you must be on the crater, and a walk that wanders into a tree must
    climb back out. The height chain isolates exactly that climb. Its
    up/down/stay probabilities are determined by the branching (ell children below,
    one parent above, plus crater self-mixing at the rim), giving a strong downward
    drift into the tree that must be overcome to reach the rim where horizontal
    navigation happens. Whether that climb is cheap (linear in depth) or expensive
    (super-linear) is a property of the birth-death chain that one computes and
    simulates. The mechanism is not an attack: it is the observation that depth's
    only route to a cost is the reachability of the rim, and that reachability is a
    measurable hitting time with a clean matched null (a birth-death chain with the
    same drift but no volcano semantics). A clean H-ADDITIVE result is the intended,
    accepted negative and NAMES the obstruction (additive depth cost) that
    inventor-protocol section 4 requires, rather than asserting invisibility.

  novelty_status: unverified

