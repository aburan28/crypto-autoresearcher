idea:
  id: IDEA-20260809-9fc179
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-TECDSA-8d340d
  goal_id: GOAL-TECDSA-001
  title: >-
    Aborts are an oracle: measure the information a protocol leaks through which
    check failed and when
  class: mechanism
  claim: >-
    When a party aborts because a proof failed, the fact of the abort and its
    position in the protocol are observable to the counterparty. The claim is that
    an adversary can convert abort behaviour into an oracle on the honest party's
    inputs, that the leak per abort is measurable in bits, and that identical
    aborts — same message, same timing class, no distinguishing position —
    measurably reduce it, giving a quantified justification for a defensive
    practice that is usually argued qualitatively.
  mechanism: >-
    Construct adversarial inputs whose acceptance depends on a predicate over the
    honest party's secret, then read the predicate from the abort behaviour. Leak
    per abort is measured by mutual information between the secret and the
    observed abort pattern over many sessions.
  why_not_a_renamed_known_approach: >-
    Abort-based leakage is a known concern in multiparty protocols. Measuring it
    in bits per abort for this protocol family, and quantifying the reduction from
    identical-abort handling, is the contribution and it is directly usable by
    implementers.
  predictions:
  - observable: bits leaked per abort with distinguishable versus identical aborts
    metric: mutual information estimate per configuration
    predicted: Materially lower with identical aborts; no reduction would mean the leak comes from timing or ordering rather than from the abort message and would redirect the defence.
  - observable: sessions to full extraction using only abort information
    metric: session count
    predicted: Large but finite in the distinguishable case; infeasible within budget in the identical case, reported as a budget statement.
  minimal_test: >-
    Run the abort oracle in both configurations at toy parameters, estimate mutual
    information with declared estimator and sample size, and attempt full
    extraction in each with a declared budget.
  controls:
  - 'RANDOM-PREDICATE NULL: with a predicate independent of the secret, measured leakage must be indistinguishable from zero, validating the estimator.'
  - 'TIMING CONTROL: timing is held constant across configurations so the comparison isolates the abort message rather than timing.'
  falsification_conditions:
  - Measured leakage is indistinguishable from zero in the distinguishable-abort configuration.
  - The null shows nonzero leakage, invalidating the estimator.
  interpretation_limits: >-
    Reference implementation, toy parameters, and a leakage model that omits
    real-world timing and network effects. No deployed system is examined.
  sota_delta: 'Delta: a quantified leak and a quantified benefit for identical-abort handling, where the literature offers advice.'
  dominated_by: Not dominated by any corpus record.
  estimated_cost: Implementation medium; compute moderate because of the sample sizes.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for abort leakage: no records. WEB NOT CHECKED.'
  source_refs:
  - Threshold ECDSA protocol specifications and their abort handling -- REQUIRED READS.
