idea:
  id: IDEA-20260804-94023e
  question_id: RQ-ECDLP-002
  title: Structured-GGM usable-density accounting for a non-simulable relation primitive
  class: control
  claim: >-
    For any proposed public non-generic relation primitive, distinguish its raw
    predicate density delta_raw from the density delta_use of points that yield
    a replayable, independent-rank, blind-descent-usable source.  Assuming the
    Structured Generic-Group Model bound reported in KN-LIT-7606 applies to
    the exact primitive, a sub-rho use at time N^lambda requires
    delta_use>N^-lambda; a sparse membership predicate alone cannot establish
    an N^0.45 route.  This is a model-scoped screening theorem, not an ECDLP
    lower bound and not an exponent improvement.
  mechanism: >-
    The tracked object is the source-valid event set U, a lossy projection of
    full candidate transcripts that discards failed candidates while retaining
    their deterministic replay certificate.  Its operation is public
    propagation/verification of a relation event.  The lossy-projection test
    rejects coordinate-only or simulator-visible predicates before measurement:
    a retained event must be non-simulable in the structured-GGM sense and
    must return a source without hidden labels.  Delta accounting makes the
    missing non-generic ingredient quantitative instead of treating
    non-simulability as binary.
  novelty_status: unverified
  assumptions:
    - The exact theorem hypotheses and elliptic-curve applicability of Corrigan-Gibbs, Henzinger, and Wu are unverified locally because KN-LIT-7606 records only abstract-level claims.
    - The primitive has an explicit public event predicate and a deterministic replay verifier; raw hits lacking rank or descent utility are excluded from delta_use.
  proof_search_map:
    bottleneck: Mapping a concrete relation primitive to the Structured-GGM model and measuring usable rather than cosmetic structure density.
    baseline_embedding:
      parameter_slice: A public deterministic coordinate predicate simulable from group operations, for which delta_use grants no non-generic oracle.
      reproduction_check: Reproduce the simulator transcript and show that the primitive supplies no oracle answer beyond public arithmetic.
    observation_collision:
      observable: Event bit, source replay certificate, and resulting relation row.
      distinct_preimage_search: Hold event-bit density fixed while permuting certificates/rows; if rank and descent utility vanish, delta_raw was not usable density.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: Delta_use=Pr[accepted event has source replay, new independent rank, and blind-target use].
        predicted_gain: A necessary model-screen condition delta_use>N^-0.45 for a N^0.45 candidate; it supplies no sufficient algorithm.
    quantifier_order: >-
      For every explicitly modeled primitive, if the reported Structured-GGM
      theorem applies and the algorithm exploits only U of density delta_use,
      then its model time is Omega(min(N^1/2,1/delta_use)); the proposal makes
      no statement outside that model.
    method_ceiling:
      strongest_certifiable_claim: A correctly scoped necessary density condition or a proof that a candidate's advertised hits are not source/rank/descent usable.
      nearby_object_control: A random event set with identical delta_raw and same verifier-cost distribution but independently randomized source certificates.
    proof_obligations:
      - {claim: Define delta_raw and delta_use with all output and rank conditions, responsibility: interface}
      - {claim: Verify model inclusion and non-simulability rather than infer it from a public coordinate formula, responsibility: scope}
      - {claim: Prove/use the reported lower-bound formula only under its exact hypotheses, responsibility: baseline}
      - {claim: Charge setup, queries, success amplification, rank, factor logs, descent, and memory, responsibility: runtime}
    not_applicable_reason: null
  predictions:
    - {metric: usable_to_raw_density_ratio, direction: lower, minimum_effect: "Must be reported exactly; a ratio tending to zero shows raw selectivity is not attack utility."}
    - {metric: structured_GGM_density_threshold, direction: higher, minimum_effect: "Any N^0.45 claim requires delta_use>N^-0.45 before other costs."}
    - {metric: real_vs_random_event_rank_gap, direction: different, minimum_effect: "A nonzero gap must survive certificate permutation and same-shape random-event controls."}
  minimal_test:
    design: >-
      Select one explicit proposed non-simulable primitive after reading the
      full Structured-GGM source.  At toy scale enumerate events, replay every
      source, calculate delta_raw, delta_use, rank, and blind-target
      applicability; compare to a random event/certificate null matched in
      density, verifier work, and event arity.  If the model mapping fails,
      report the screen unrun rather than treating the bound as evidence.
    controls:
      - Public simulator-visible predicate with the same event density.
      - Random same-shape event/certificate null.
      - Certificate-permutation control retaining raw hits but destroying source-row linkage.
    required_metrics: [delta_raw, delta_use, source_replay_rate, independent_rank_gain, blind_target_success, verifier_cost]
  falsification_conditions:
    - Full-text review shows the Structured-GGM theorem does not cover the primitive or the stated delta interpretation.
    - delta_use does not exceed the required threshold once source/rank/descent gates are applied.
    - The apparent rank advantage persists after certificate permutation or occurs in the random-event null.
  confounders:
    - A theorem about fraction of structured points may not bound structured tuples or preprocessing; the model interface must say which object is queried.
    - Toy delta cannot establish a crypto-scale density exponent.
    - Correlation among events can invalidate a binomial success-amplification estimate.
  interpretation_limits:
    - The result would be model-scoped methodology only; it cannot close concrete ECDLP avenues outside Structured GGM.
    - It does not reuse generic public-oracle, jet, spectral, STR/DEP, or SMTH instruments.
  heuristic_assumptions:
    - id: H-SGGM-1
      statement: "The exact candidate primitive is covered by the reported Omega(min(sqrt(N),1/delta)) Structured-GGM theorem with delta=delta_use."
      rigorous_support: "KN-LIT-7606 reports this bound and elliptic-curve-point applications, but also records that the full text and exact oracle coverage were not verified locally."
      validation_plan: "Read and transcribe the theorem and definitions before any run; then sample public toy curves, compare empirical event CDFs to a matched Bernoulli/random-event null, and check upper tails of usable-event counts. Toy sampling validates only implementation, never the theorem's asymptotic scope."
  target_complexity:
    time_exponent: "No algorithm claimed. Necessary conditional target: lambda<0.50 requires delta_use>N^-lambda; screening row lambda=0.45 requires delta_use>N^-0.45."
    memory_exponent: "No new memory exponent; any candidate retains its fully charged state and source certificates."
    best_known: "Pollard rho N^(1/2+o(1)) time, negligible memory; BSGS N^(1/2+o(1)) time and memory."
    hidden_overhead: "The lower bound alone omits concrete primitive construction, oracle modeling, rank, factor logs, descent, verification, and preprocessing; none may be inferred free."
    tradeoff_note: "Preprocessing/multi-target variants require their own frontier comparison; the reported single-density formula is not silently extended to them."
  estimated_cost: {implementation: low, compute: low}
  dominated_by: "n/a (no result claimed)"
  sota_delta: "No demonstrated attack delta: time/memory/data-query exponents 0.00. The delta is a necessary density gate that can cheaply reject cosmetic non-simulability."
  recommended_priority: medium
  source_refs: [knowledge/literature/KN-LIT-7606.md, knowledge/findings/KN-FIND-002.md, docs/novelty-screen-20260729.md, coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/tasks/TASK-20260802-012/semantic_dedup.md]
