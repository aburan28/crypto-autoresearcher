# IDEA-20261003-e21249
# ECDLP representation count. Proposal only. Not approved.
idea:
  id: IDEA-20261003-e21249
  question_id: RQ-ECDLP-002
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    Affine versus projective addition monomial counts on one frozen chart
  class: representation
  claim: >-
    On one frozen short-Weierstrass chart, the affine slope formula uses
    one division and the projective addition formula uses zero divisions.
    The projective multiplication count exceeds the affine multiplication
    count. That gap is a representation cost, not an ECDLP exponent.
  mechanism: >-
    OBJECT FRAME. R1 is the coordinate chart. The operation set is the
    group law written in that chart. Changing the chart changes the
    number of divisions and multiplications and does not change the
    group. The lossy-projection test does not apply, because the object
    is the formula, not a projection of the prime-order subgroup.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-002
      provenance: internal
      claim: >-
        The question admits a public toy methodology with complete costs.
      verified_by: coordinator session 2026-10-03, question file read
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        The generic floor is the scope constraint for any exponent claim.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The chart is frozen before the count.
    - No scalar is recovered.
  proof_search_map:
    bottleneck: The division count of the affine slope.
    baseline_embedding:
      parameter_slice: One affine slope and one projective addition formula.
      reproduction_check: >-
        Two readers count divisions and multiplications from the written
        formulas and must agree.
    observation_collision:
      observable: The division counts and the multiplication counts.
      distinct_preimage_search: >-
        A chart that still uses one division is not the projective formula.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The projective chart of the same addition.
        predicted_gain: Zero divisions. No exponent.
    quantifier_order: >-
      The formulas are fixed before the counts. A count is not a statement
      for every model.
    method_ceiling:
      strongest_certifiable_claim: >-
        The division gap on the frozen chart. Not an ECDLP algorithm.
      nearby_object_control: >-
        A formula that is only the affine slope rewritten with a common
        denominator still has the division, moved to the end.
    proof_obligations:
      - claim: The affine slope uses one division.
        responsibility: correctness
      - claim: The projective formula uses zero divisions.
        responsibility: size
      - claim: The gap is not an exponent.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: division_gap
      direction: different
      minimum_effect: Affine has 1 division and projective has 0.
  minimal_test:
    design: >-
      Freeze the two formulas. Count divisions and multiplications.
      Do not run a scalar multiplication.
    controls:
      - The same group law in both charts.
      - A common-denominator rewrite of the affine slope.
    required_metrics:
      - division counts
      - multiplication counts
  falsification_conditions:
    - The two charts have the same division count.
    - A counted division is an artifact of an unfixed formula.
  confounders:
    - Clearing denominators moves a division into several multiplications.
  interpretation_limits:
    - A formula count is not an ECDLP cost.
    - No transfer to a cryptographic prime.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The written formulas are the complete addition laws of the frozen
        chart, excluding the point at infinity and equal-point cases.
      rigorous_support: >-
        No distribution is assumed. The count is a reading of two formulas.
      validation_plan: >-
        Two independent readings. A mismatch voids the count.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: O(1) formula storage.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: Equal-point and infinity cases are excluded from the count.
    tradeoff_note: Fewer divisions can cost more multiplications.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-13bf67
      - KR-RHO-898783
      - KR-IC-5a43e5
      - KR-IC-73db3f
    nearest:
      - ref: KR-RHO-13bf67
        provenance: internal
        relation: adjacent
        delta: >-
          The generic floor constrains exponent claims. This record counts
          formula operations and claims no exponent.
  dominated_by: >-
    No attack is claimed. Rho and index-calculus rows dominate any attack
    reading of a formula count.
  sota_delta:
    time: zero attack delta
    memory: zero
    data_queries: One frozen-chart operation count.
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
