idea:
  id: IDEA-20261007-ee2836
  question_id: RQ-PAIR-21313f
  added: '2026-10-07'
  status: proposed
  approved_by: null
  title: >-
    Weil pairing of a point with itself on y^2 = x^3 + 1 over F_19
    equals 1
  class: control
  claim: >-
    Let E be y^2 = x^3 + 1 over F_19. If the discriminant is 0 the
    model is singular and the run is an invalid setup. Otherwise let
    P be the affine point of largest order n among points of E(F_19),
    breaking ties by least x then least y. If n is at most 2, the
    setup is invalid. Otherwise the Weil pairing e_n(P, P) equals 1.
    A value other than 1 is a negative. If E(F_19) has no point of
    order greater than 2, that absence is an invalid setup and is
    not the negative. No discrete logarithm is computed, and the
    generic-group exponent 1/2 is unchanged.
  mechanism: >-
    PAIR (representation, Sigma): the representation is one affine
    point P. Sigma is the Weil pairing on E[n] with both arguments
    equal to P, not translation and not a distortion map. Trichotomy
    class: coordinate-dependent, because the Miller functions are
    written in x and y. The projection keeps only the pairing value.
    Explanation A: the Weil pairing is alternating, so the diagonal
    value is 1, and this one-point evaluation is not a nontrivial
    self-pairing. Explanation B: a value other than 1 means the
    implementation is not the alternating Weil pairing. No factor
    base is built.
  novelty_status: unverified
  citations:
    - ref: KR-RHO-53c89f
      provenance: internal
      claim: >-
        Transfer attacks apply when the embedding degree is small,
        and anomalous curves are a separate polynomial-time case.
        This idea does not run a transfer.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-53c89f.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic algorithm needs a square-root number of group
        operations. A diagonal pairing value does not beat that bound.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: RQ-PAIR-21313f
      provenance: internal
      claim: >-
        The question asks which CM families have small embedding
        degree and whether a one-point self-pairing exists. This
        record tests the diagonal of the Weil pairing.
      verified_by: ledger/questions/RQ-PAIR-21313f.yaml
  assumptions:
    - The model is nonsingular. A zero discriminant is a failed setup.
    - n is the order of P and n > 2. A point of order at most 2 is not paired.
    - The value is the Weil pairing, not a Tate pairing of P against a distortion of P.
  predictions:
    - metric: 1 if e_n(P, P) equals 1, and 0 otherwise
      direction: higher
      minimum_effect: exactly 1
  minimal_test:
    design: >-
      Enumerate E(F_19), select P as above, and evaluate the Weil
      pairing e_n(P, P). Do not run a finite-field discrete logarithm
      and do not run Pollard rho.
    controls:
      - A zero discriminant, or no point of order greater than 2, makes the run invalid.
      - e_n(P, O) is not a substitute for e_n(P, P).
      - A distortion map Q = phi(P) with Q not equal to P is a different pairing and is not the primary value.
    required_metrics:
      - n
      - pairing_value_is_one
      - x_P
      - discriminant_is_zero
  falsification_conditions:
    - n is greater than 2 and e_n(P, P) is not 1, on a nonsingular model.
    - The discriminant is 0, or no point of order greater than 2 exists. No pairing value from that run is admissible.
  confounders:
    - A reduced Tate self-pairing that uses a distortion can be nontrivial. That value is not e_n(P, P).
    - Writing the pairing in a subfield representative other than 1, when the element is 1, is a normalisation error and makes the run invalid.
  interpretation_limits:
    - A diagonal value of 1 does not compute an embedding degree and does not lower the exponent 1/2.
    - The scope is this one curve at p = 19 and this one point P.
    - The record does not compare two named transfer reductions.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The Weil pairing on E[n] is alternating, so e_n(P, P) = 1
        whenever P has order n. At this one curve the implementation
        of that pairing returns 1. This is not a claim that every
        one-point formula is trivial.
      rigorous_support: >-
        KR-RHO-53c89f, opened, states that transfer attacks apply on
        special curves and does not evaluate e_n(P, P) at p = 19.
        KR-RHO-13bf67, opened, is the generic square-root bound.
      validation_plan: >-
        At this one point, record whether the value equals 1. If it
        does not, while n > 2 and the model is nonsingular, H1 is
        false for this implementation. No second prime is claimed.
  target_complexity:
    time_exponent: >-
      One pairing evaluation at p = 19. The generic-group exponent
      1/2 is unchanged.
    memory_exponent: O(1) field elements in the Miller functions
    best_known: >-
      KR-RHO-13bf67, opened, gives the square-root generic bound.
      KR-RHO-53c89f, opened, prices transfer attacks only on special
      curves. A diagonal value of 1 beats neither.
    hidden_overhead: >-
      No o(1) term. The test is one point.
    tradeoff_note: >-
      No time-memory tradeoff.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-53c89f
      - KR-RHO-13bf67
      - KR-RHO-755e35
    nearest:
      - ref: KR-RHO-53c89f
        provenance: internal
        relation: adjacent
        delta: >-
          The opened row says transfer attacks apply when the
          embedding degree is small. This idea adds one bit,
          pairing_value_is_one, predicted equal to 1, at the prime
          19. It does not compute an embedding degree and does not
          move the exponent 1/2.
  dominated_by: >-
    Pollard rho, at the square-root exponent in KR-RHO-13bf67,
    dominates any reading of a diagonal pairing value as an attack.
    KR-RHO-53c89f already confines transfer attacks to special
    curves. The bit pairing_value_is_one does not beat either
    baseline.
  sota_delta: >-
    No exponent is derived. The quantitative delta is the bit
    pairing_value_is_one, predicted equal to 1, at the prime 19.
    The generic-group exponent stays 1/2.
