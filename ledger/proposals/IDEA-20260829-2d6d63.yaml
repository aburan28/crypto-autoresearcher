  object_first_candidate:
    established_families_off_limits: >-
      Off-limits as the primary lens: information-set decoding; distinguisher
      construction of any kind; support splitting; side-channel and fault
      attacks; parameter tweaking. The lens is a monoid action on a four-integer
      tuple, which is bookkeeping, not an attack family.
    tracked_object: >-
      The tuple (n, k, r, delta) attached to a code together with a nominal
      alternant degree, followed under a monoid of operations available to
      someone holding only the public key.
    lossiness: >-
      Four integers stand in for a code, a support, a polynomial and a
      permutation. The fibre over any tuple is astronomically large. The retained
      part propagates deterministically because every operation in the
      submonoid has a closed-form action on the tuple, verified by rank
      computation in stage 2 rather than assumed, and because the two operations
      the public key is scrambled by -- permutation and scaling -- act as the
      identity. NOT a change of coordinates: nothing about the code is
      recoverable from four integers, and the record's own null arm (stage 6)
      exists to catch the failure mode where the tuple is a constant of the
      apparatus rather than a property of the object.
    propagation: >-
      Puncture: (n-1, k, r-1, delta-(m-1)), valid while the code has no weight-1
      codeword. Shorten: (n-1, k-1, r, delta), valid while no coordinate is
      identically zero. Permute or scale: identity. Dual and Schur: not filled;
      the first leaves the category, the second is OPEN pending the body of
      arXiv:2304.14757.
    survival_score: >-
      The tuple survives while delta is a genuine genericity statement, that is,
      while delta >= 0 and the generic bound n - rm is positive. It dissolves
      the moment delta goes negative -- at which point the code is a strict
      subcode of the nominal alternant code and the tuple no longer describes
      it. That boundary is the escape depth itself, so the object survives
      exactly as far as the question it is built to answer and no further, which
      is a coincidence worth stating rather than a design achievement.

  null_object_control: >-
    Three. (1) RANDOM ALTERNANT NULL, stage 6: a random degree-2t alternant code
    enters with delta = 0 and must be assigned escape cost 0 by the same
    program. A nonzero answer means the framework is measuring its own
    convention. (2) SHORTENING-ONLY NULL: run the program with the puncturing
    row deleted; it must return INFEASIBLE, because shortening alone can never
    reach delta <= 0. An answer other than infeasible means the conservation law
    is not what carries the result. (3) PERMUTED-KEY NULL: apply a random secret
    permutation and scaling to each fixture instance and confirm every tuple is
    unchanged, since a bookkeeping quantity that moves under the scrambling the
    scheme actually applies would be useless.

  discriminated_from:
    - >-
      IDEA-20260808-b9a74c. It computes a RATE distance to a transcribed
      threshold; the correction records forbid presenting that as the
      discriminator and the threshold is untranscribed anyway. This computes a
      COORDINATE distance to a family exit and needs no threshold.
    - >-
      IDEA-20260829-afa314. That builds and measures one operation; this asks
      whether that operation is optimal among the computable ones and turns the
      answer into a number per parameter set. If afa314's genericity measurement
      fails, this record's arithmetic is unaffected -- the conservation law is
      about forced surpluses, not about attainment.
    - >-
      IDEA-20260816-576d70. Compiles the committed reading of the boundary into
      a three-valued predicate over parameter tuples. That instrument audits
      SENTENCES; this one computes a quantity about CODES. They are complementary
      and the predicate would be the natural consumer of this record's number.
    - >-
      IDEA-20260805-554b9d and IDEA-20260808-baf8bc, the ISD costing lane. A
      different assumption entirely (syndrome decoding, not indistinguishability)
      and no shared machinery.

  assumptions:
    - >-
      The doubling identity, which supplies the entry surplus tm. Inherited and
      tested elsewhere; if it fails the entry value is 0 and the escape cost
      question is empty.
    - >-
      The (n, m, t) triples, recalled and to be re-transcribed.
    - >-
      That 'escaping the Goppa family' is well captured by 'reaching delta <= 0'.
      This is a MODELLING assumption and it is the record's second declared
      weakness: delta <= 0 is necessary for dimension-genericity but is not
      known to be sufficient for any other notion of genericity, which is
      exactly what IDEA-20260829-afa314 stage 3 measures.

  proof_search_map:
    baseline_reproduction: >-
      The exact bottleneck is degree reduction: every published route from an
      alternant code to a structure-recovery-sized object goes through lowering
      the degree, and the fetched abstract confirms that is ingredient (i) of
      arXiv:2304.14757. The baseline slice to reproduce symbolically is the pair
      of dimension facts dim Alt_r(x,y) >= n - rm and dim Gamma(L,g) = n - tm,
      plus each operation's tuple update verified by exact rank on the fixture.
      A table row that is derived but not rank-verified is not a reproduction.
    observation_collision: >-
      The observable is delta, one integer. TWO COLLISIONS, both real and both
      handled. First, delta <= 0 is achieved both by a code that has genuinely
      left the Goppa family and by a code that is a strict subcode of an
      alternant code and has left nothing -- the sign change at the escape depth
      is exactly this collision, and it is why the record claims a NECESSARY
      condition and not a sufficient one. Second, delta is identical for a
      random alternant code at delta = 0 and for a Goppa code punctured to
      delta = 0, which is the claim being made; the collision is therefore the
      DESIRED conclusion, so it must be attacked from the other side by an
      independent invariant, and that is IDEA-20260829-afa314's square-code arm
      and IDEA-20260829-af8acf's rank histogram. If either separates the two
      objects, this record's conclusion is falsified as a family statement and
      survives only as a dimension statement.
    quantifier_order: >-
      For all m >= 3 and all t, for every word w in the verified submonoid,
      delta(w(C)) = tm - (m-1) p(w). Therefore for all w with delta <= 0, the
      coordinate cost of w is at least ceil(tm/(m-1)). The quantifier that must
      not slip is on the MONOID: the statement is 'for every word in the
      VERIFIED submonoid', not 'for every operation', and the difference between
      those two is the whole content of HA-1. Any deliverable that drops the
      qualifier converts a scoped lower bound into an impossibility claim, which
      the Idea Generator contract forbids outright.
    method_ceiling_and_nearby_object_control: >-
      CEILING. Under ideal tuning this method proves a lower bound on coordinate
      cost within a monoid whose completeness it cannot establish. It can never
      prove that no attack exists, and it cannot even prove that the exit is
      useful, since it says nothing about what happens after delta reaches 0.
      NEARBY OBJECT WHERE THE CONCLUSION MUST FAIL. A random degree-2t alternant
      code: escape cost 0, because it never entered. A method that assigned it a
      positive cost would be describing its own convention. Second nearby
      object: a Goppa code with non-squarefree g, whose entry surplus should be
      smaller or absent, giving a proportionally smaller escape cost -- a method
      that returned the same cost for both has not identified the load-bearing
      structure.

  predictions:
    - metric: Verified tuple update for shortening, on at least 20 toy instances per cell
      direction: different
      minimum_effect: EXACTLY (-1, -1, 0, 0) at 100 percent of instances. Zero tolerance.
    - metric: Verified tuple update for puncturing
      direction: different
      minimum_effect: EXACTLY (-1, 0, -1, -(m-1)) at 100 percent of instances with s below the minimum distance.
    - metric: Escape cost returned by the integer program with the puncturing row deleted
      direction: different
      minimum_effect: INFEASIBLE. Any finite answer means the conservation law is not carrying the result.
    - metric: Escape cost at the five Classic McEliece parameter sets, in coordinates
      direction: different
      minimum_effect: >-
        Forced values ceil(tm/(m-1)) = 70, 104, 139, 129, 139 for the recalled
        triples, with residual surplus at floor(tm/(m-1)) equal to 9, 0, 8, 11,
        8 and rate gain 0.0157, 0.0168, 0.0158, 0.0146, 0.0136. Any mismatch
        routes to a correction record.
    - metric: >-
        Sensitivity of the escape cost to a hypothetical zero-coordinate Schur
        row with deficit spend c, measured as escape cost as a function of c
      direction: different
      minimum_effect: >-
        Forced structure: for any c >= 1 a zero-coordinate row drives the
        coordinate escape cost to 0 and the closure collapses. The prediction is
        therefore that the closure is MAXIMALLY sensitive to the missing row,
        and the deliverable is that statement plus the number of Schur
        applications required, ceil(tm/c), which is the honest form of the
        result until the body is transcribed.
    - metric: Escape cost assigned to a random degree-2t alternant code
      direction: different
      minimum_effect: EXACTLY 0.

  minimal_test:
    design: >-
      Almost the whole record is zero-compute and the discriminating part fits
      in one sitting. Write the four-row table with derivations. Verify the two
      filled rows by exact rank on 20 toy instances at m = 5, t = 3, n = 32:
      shorten and re-rank, puncture and re-rank, and confirm the two tuple
      updates to the integer, in the same invocation, on the same instances --
      this is the only measurement, and it is decisive because the whole
      conservation law is those two rows. Then run the integer program with and
      without the puncturing row, evaluate the five parameter sets in exact
      rationals, reproduce the five committed rates, and run the sensitivity
      sweep over hypothetical Schur rows. Total compute is seconds; total
      elapsed is dominated by writing the derivations down carefully, which is
      the point of the exercise.
    controls:
      - Shortening-only program, must return infeasible.
      - Random degree-2t alternant null, must return escape cost 0.
      - Permuted-and-scaled key null, all tuples must be unchanged.
      - >-
        Non-squarefree graded control g_j = g_0 h^j for j = 0..3, escape cost
        must scale with the measured entry surplus rather than being constant.
      - >-
        Transcription control: the five committed rates 85/109, 35/48, 157/209,
        5413/6960, 51/64 must be reproduced from the recalled (n, m, t) triples
        before any escape cost is published.
    required_metrics:
      - the operation table with, per row, the derivation, the side condition, and the rank-verification pass rate
      - list of rows marked OPEN or NOT APPLICABLE with the reason for each
      - integer program solution with and without the puncturing row
      - escape cost, residual surplus, derived length, derived degree, derived rate and rate gain at all five parameter sets in exact rationals
      - sensitivity table of escape cost against hypothetical Schur deficit spend c for c in 1..m
      - null arm results, all three

  falsification_conditions:
    - Either verified tuple update fails on any toy instance; the conservation law is wrong.
    - The shortening-only program returns anything but infeasible.
    - The random-alternant null is assigned a nonzero escape cost; the framework measures its own convention.
    - >-
      The five committed rates are not reproduced from the recalled triples;
      the parameter transcription is wrong and every downstream number with it.
    - >-
      An operation is identified that reduces delta without removing a
      coordinate. The closure collapses immediately, the escape cost in
      coordinates becomes 0, and the correct output is an alarm-side finding
      routed to independent review. The sensitivity sweep is designed so that
      this outcome is anticipated rather than discovered late.
    - >-
      IDEA-20260829-afa314's square-code arm or IDEA-20260829-af8acf's rank
      histogram separates a punctured Goppa code at delta = 0 from a random
      alternant code at delta = 0. Then delta <= 0 is not a family exit, the
      closure survives only as a statement about dimension, and it must be
      relabelled accordingly.

  confounders:
    - >-
      MONOID INCOMPLETENESS is the dominant one and it is not mitigated, only
      disclosed. The Schur row is known to exist, is known to cost zero
      coordinates in the source's own description, and cannot be filled without
      the body. Publishing the escape cost without the sensitivity sweep would
      be presenting a bound whose binding constraint is missing.
    - >-
      NECESSARY VERSUS SUFFICIENT. delta <= 0 is necessary for dimension
      genericity and is not known to be sufficient for anything else. A
      deliverable that used 'escape cost' to mean 'cost of becoming
      indistinguishable' would be overclaiming by a wide margin.
    - >-
      NOMINAL DEGREE IS A CHOICE. delta is defined relative to a declared
      degree, and IDEA-20260805-9704d9 shows a Goppa code admits at least two.
      The table is computed in the degree-2t presentation and every number in it
      is presentation-relative; the degree-t presentation gives entry surplus 0
      and escape cost 0, which is a true and useless answer, and the record must
      say which presentation it is in on the face of every table.
    - >-
      TOY VERIFICATION AT SMALL n. Side conditions (no weight-1 codeword, no
      identically-zero coordinate) are easy to violate at n = 32 and would
      produce spurious row failures; the verification must check them
      explicitly and report violations as filtered rather than as failures.

  interpretation_limits:
    - >-
      TOY claim tier, unchanged. Nothing here is an attack and the escape cost
      is not an attack cost.
    - >-
      Every deliverable of this line must carry all four qualifications of
      RQ-MCE-f8fca0's completed_constraint, with Q-2 and Q-4 quoted. A table
      showing a large escape cost is NOT evidence that Classic McEliece resists
      anything -- the exclusion the cost is measured against is itself
      present-tense, unproved and conjectured to fall by its own authors.
    - >-
      This is a lower bound within a stated monoid. It is not an impossibility
      statement, it does not declare any direction closed, and the forward
      guidance names three open classes explicitly.
    - >-
      The numbers are presentation-relative to the degree-2t reading of a binary
      Goppa code and mean nothing in the degree-t reading.

  heuristic_assumptions:
    - id: HA-1
      statement: >-
        The set {shorten, puncture, permute, scale} exhausts the operations that
        (i) are computable from the public key alone, (ii) map alternant codes
        to alternant codes or to subcodes of them with a computable nominal
        degree, and (iii) reduce the nominal degree.
      rigorous_support: >-
        NONE, AND THIS IS THE RECORD'S CENTRAL WEAKNESS, stated first rather
        than buried. It is a completeness claim about a search, which
        docs/inventor-protocol.md section 4 classifies as a statement about the
        search and not about the problem. It is KNOWN TO BE FALSE as stated:
        the fetched abstract of arXiv:2304.14757 names component-wise products
        as a degree-reduction ingredient, so at least one operation is missing.
        The record therefore does not assert HA-1; it computes the answer
        conditional on the verified submonoid and measures the sensitivity to
        the known missing row.
      validation_plan: >-
        Two routes, both named. (1) Transcribe the multiplier and degree update
        rule of the shortening-plus-Schur chain from the PDF at sha256
        ebbd94ac3cd00b0f0e723aeab56fd3b0820c89d47072fc8241f12c5f93c564b8, add
        the row, re-solve. This is a read, not a computation, and it is the
        single highest-value unblocking action for this whole question.
        (2) Independently derive the Schur row at toy scale by measuring
        dim((C^perp)*(C^perp)) and the resulting nominal degree on the fixture,
        which gives an empirical row without reading anything -- weaker, but
        available now, and its disagreement with the transcribed row would be
        informative in itself.
    - id: HA-2
      statement: >-
        For a uniformly random multiplier, dim Alt_r(x, y) = n - rm exactly,
        with probability tending to 1 as n grows at fixed rm/n, so that delta is
        a genericity statement rather than a bookkeeping artifact.
      rigorous_support: >-
        Pairs the rigorous bound dim Alt_r >= n - rm, which is a theorem, with
        the classical genericity expectation that rm parity conditions expanded
        over an F_2 basis are independent for a random multiplier -- the same
        standard statement IDEA-20260805-9704d9 records as HEUR-SD-1. Not proved
        here.
      validation_plan: >-
        At least 200 random multipliers per cell at m in {4,5,6}, empirical
        attainment rate reported per cell BEFORE any Goppa number is compared
        against it; cells with low attainment are excluded from the comparison
        rather than reinterpreted. Tail check: instances failing to attain the
        bound are listed individually. Sampled parameters recorded.
    - id: HA-3
      statement: >-
        Reaching delta <= 0 is a meaningful proxy for leaving the Goppa family.
      rigorous_support: >-
        Partial and honestly bounded. RIGOROUS in one direction: for delta > 0
        the derived code is provably non-generic, so it cannot be a generic
        alternant code. NOT rigorous in the other: delta <= 0 does not imply
        indistinguishability by any other invariant.
      validation_plan: >-
        Delegated, by name, to IDEA-20260829-afa314 stage 3 (square-code defect
        of the derived code against a matched random-multiplier arm) and to
        IDEA-20260829-af8acf (rank histogram of the quadratic-relations matrix
        code). If either separates the arms at delta = 0, HA-3 is falsified and
        this record's conclusion is relabelled as a dimension statement.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED and none is implied. The record's own
      computation is exact rational arithmetic on five tuples plus a
      one-dimensional integer program, i.e. free. The quantity it produces is a
      COORDINATE COST, not a time cost, and the two must never be conflated: an
      escape cost of 139 coordinates is not 2^139 of anything.
    memory_exponent: n/a. No algorithm is proposed.
    best_known: >-
      NOT ASSERTED. This corpus holds no family-scoped distance for any code
      -based scheme, and EV-MCE-332f99's own boundaries record that no distance
      of any kind was computed. Externally, the only relevant fetched claim is
      iacr:2026/1232's abstract, which claims full key recovery on binary Goppa
      directly and therefore needs no escape at all.
    hidden_overhead: >-
      The entire content of the missing Schur row is hidden overhead, and the
      sensitivity sweep exists so the size of the hiding is published rather
      than implied. Stated bluntly: a single zero-coordinate degree-reducing
      operation reduces the coordinate escape cost to zero, so the bound is not
      robust and the record says so in its own predictions.
    tradeoff_note: >-
      There is a genuine tradeoff and it is the interesting part of the table:
      shortening buys nothing and costs rate; puncturing buys deficit and gains
      rate; the Schur route, per the source's own description, costs no
      coordinates at all but requires the genericity that Goppa codes are said
      to violate. The three-way tradeoff between coordinates, rate and
      genericity is the record's actual deliverable.

