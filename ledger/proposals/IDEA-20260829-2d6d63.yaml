idea:
  id: IDEA-20260829-2d6d63
  question_id: RQ-MCE-e65b3c
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    A conservation law instead of a rate distance. Tabulate the exact
    (delta n, delta k, delta r, delta deficit) vector of every operation an
    adversary can apply to a Classic McEliece public key without the secret,
    solve the resulting integer program for the cheapest exit from the Goppa
    family, and state the goal's headline number as a FAMILY-scoped escape cost
    in coordinates rather than a rate gap the correction records already forbid.
  class: theory

  claim: >-
    (A) THE FRAME. RQ-MCE-3f7c02 established that the decisive scoping of
    arXiv:2304.14757 is the code FAMILY and not the rate, and RQ-MCE-f8fca0
    established that the family exclusion is phase-scoped, present-tense,
    explicitly unproved and conjectured to fall. Between them they retire the
    'quantitative distance from Classic McEliece's actual rates' that
    RQ-MCE-e65b3c's second scope bullet asks for, and they put NOTHING in its
    place. This record proposes the replacement: a distance measured in the
    currency the corrected boundary is actually stated in.
    (B) THE CURRENCY. Every public operation acts on the tuple
    (n, k, r, delta) where delta = k - (n - rm) is the dimension surplus over
    the generic alternant bound at nominal degree r. Two operations are
    computable exactly and unconditionally: shortening one coordinate maps
    (n, k, r, delta) to (n-1, k-1, r, delta), i.e. it is DEFICIT-NEUTRAL and
    rate-decreasing; puncturing one coordinate maps it to
    (n-1, k, r-1, delta-(m-1)), i.e. it SPENDS m-1 of the surplus and is
    rate-increasing. Coordinate permutation and F_2-scaling are the identity on
    the tuple. A binary Goppa code enters with delta = tm in its degree-2t
    presentation and delta = 0 in its degree-t presentation.
    (C) THE CONSERVATION LAW AND THE INTEGER PROGRAM. Within the submonoid
    generated by shortening, puncturing, permutation and scaling, delta is
    changed only by puncturing and only by m-1 per application. Hence for any
    word w in that monoid, delta(w(C)) = tm - (m-1) p(w) where p(w) is the
    number of punctures in w, and the minimum number of coordinates that must be
    removed to reach delta <= 0 is exactly ceil(tm/(m-1)), attained by pure
    puncturing, with shortening contributing nothing but rate loss. The integer
    program is one-dimensional and its solution is forced; the interesting
    content is that the LP is one-dimensional at all, which is what makes the
    escape cost a well-defined number.
    (D) THE CLOSURE CANDIDATE, at the docs/inventor-protocol.md section 4
    standard. NAMED OBSTRUCTION: within the coordinate-removing submonoid, exit
    from the forced-non-generic region costs at least tm/(m-1) coordinates and
    buys at most (m-1)^{-1} tm/(n - tm/(m-1)) of rate, which at all five Classic
    McEliece parameter sets is a rate gain between 0.0136 and 0.0168. ARGUMENT:
    the conservation law of (C), which is exact integer arithmetic. FORWARD
    GUIDANCE, naming what remains open rather than declaring anything
    impossible: the operations OUTSIDE the submonoid are (i) component-wise
    (Schur) products of the dual, which the fetched abstract of arXiv:2304.14757
    names as its own degree-reduction ingredient and which cost ZERO coordinates
    -- this is the row this program cannot fill without the body, and it is
    precisely where the Goppa exclusion bites; (ii) subfield and trace
    operations, trivial over F_2 but not over F_4 variants; (iii) the
    quadratic-relations construction of iacr:2026/1232, which leaves the code
    category entirely and is IDEA-20260829-af8acf's lane.
    (E) NOT CLAIMED. No attack, no security statement in either direction, no
    claim about condition (6) which is untranscribed and is not reconstructed,
    no claim that the escape cost is or is not affordable to any adversary, and
    no claim that the operation list is complete -- the incompleteness is the
    record's central declared weakness and is stated as HA-1.
    (F) THE TWO OUTCOMES. If the tabulation confirms that no computable
    operation beats m-1 per coordinate, this program has, for the first time, a
    family-scoped distance with an argument behind it. If some operation does
    beat it -- the Schur row is the live candidate -- then the escape is cheaper
    than the conservation law suggests, and the correct output is an alarm-side
    finding routed to review, not a smaller number quietly published.

  mechanism: >-
    STAGE 1, the table, on paper, hours, zero compute. For each operation
    derive (delta n, delta k, delta r, delta delta) from first principles, with
    the derivation written out and the side conditions stated. Shortening:
    dim drops by 1 (for a code with no all-zero coordinate) and the bound drops
    by 1, so delta is unchanged. Puncturing: dim is unchanged below the minimum
    distance, r drops by 1, the bound rises by m-1, so delta drops by m-1.
    Permutation and scaling: identity. Dual: leaves the alternant category and
    the row is marked NOT APPLICABLE with the reason. Schur square of the dual:
    the row is marked OPEN with the exact reason -- the multiplier and degree
    update rule is in the body of arXiv:2304.14757 which this program has not
    fetched, and reconstructing it would be fabrication.
    STAGE 2, verification of every filled row on the fixture. Each derived
    (delta n, delta k, delta r, delta delta) is checked by exact rank
    computation on at least 20 toy instances per operation, at m in {4,5,6}. A
    row that does not verify is removed from the table and reported as removed;
    an unverified row may not enter the integer program.
    STAGE 3, the program. Minimise total coordinates removed subject to
    delta <= 0, over nonnegative integer counts of each verified operation.
    With the current table the program is trivially one-dimensional; the point
    of writing it as a program is that ADDING A ROW LATER CHANGES THE ANSWER
    MECHANICALLY, which is what makes this an instrument rather than an
    observation.
    STAGE 4, evaluation at the five parameter sets, exact rationals: escape cost
    ceil(tm/(m-1)), residual surplus at floor(tm/(m-1)), derived length, derived
    nominal degree, derived rate, and rate gain. The five committed rates are
    reproduced as a transcription control.
    STAGE 5, the sensitivity analysis that decides how much the closure is
    worth. Recompute the escape cost under hypothetical Schur rows with
    (delta n, delta r, delta delta) = (0, -1, -c) for c ranging over 1..m, and
    report the escape cost as a function of c. This says, before anyone reads
    the paper, exactly how much the missing row would change the answer -- and
    if the answer is insensitive over the whole plausible range, the closure
    stands even without the body, which would be the strongest available
    outcome.
    STAGE 6, the honest null. Run the identical program on a RANDOM degree-2t
    alternant code, which enters with delta = 0 and therefore has escape cost 0.
    A framework that reports a nonzero escape cost for an object that is already
    outside the Goppa family is measuring its own bookkeeping.

  novelty_status: unverified
  novelty_screen:
    method: >-
      Read RQ-MCE-e65b3c, RQ-MCE-3f7c02 and RQ-MCE-f8fca0 in full; the
      prior-art list of all 14 proposals on this question; the full text of
      IDEA-20260805-9704d9, IDEA-20260808-b9a74c, IDEA-20260816-9c7e2d,
      IDEA-20260816-576d70; titles and claim openings of the seven proposals on
      RQ-MCE-b38a8b and RQ-MCEQ-fcb504. Fetched two abstracts on 2026-08-29.
    results: >-
      IDEA-20260808-b9a74c promises 'the rate difference and the equivalent
      difference in t at fixed (m, n), in exact integers, for each ISO parameter
      set'. That is a RATE distance, computed against a threshold this program
      has not transcribed, and it is exactly the framing RQ-MCE-3f7c02 supersedes
      and RQ-MCE-f8fca0 completes -- the very defect that opened this round.
      This record replaces the currency: a distance in coordinates to a FAMILY
      exit, computable without transcribing any threshold. IDEA-20260805-9704d9
      supplies the entry value delta = tm. IDEA-20260829-afa314 supplies and
      tests the puncturing row. Nothing in the repository tabulates operations
      as tuple updates or solves for a cheapest exit.
    verdict: >-
      UNVERIFIED. Each individual row is elementary coding theory and no
      external novelty is claimed for any of them; the practice of tracking what
      an adversary can do to a public code without the key is standard. What is
      claimed is local: this repository has no operation table, no conservation
      statement, and no family-scoped distance, and the correction records
      removed the rate-scoped substitute without providing a replacement.

