idea:
  id: IDEA-20260809-6b423b
  question_id: RQ-FIND-001
  added: '2026-08-09'
  title: AGENTS.md rule 12 is unreachable in this harness and, unlike the structurally identical
    rule 13, was never suspended or adjudicated -- freezing at least four reviewer-endorsed corrections
    across three ML-KEM goals while closure got easier
  class: control
  claim: 'Rule 12 requires independent review-breakthrough at max effort for any breakthrough,
    closure result or contradiction of established evidence, and says that review ''may not be
    degraded or run on a backend that cannot reach it''. GOAL-MLKEM-003''s BATCH-008 checkpoint
    states its review was run under review-adversarial and ''explicitly NOT the AGENTS.md rule
    12 review-breakthrough pass, which no backend in this environment can serve''. The consequences
    are recorded precisely: rule 12 ''blocks the KN-FIND-012 restatement, the KN-FIND-014 withdrawal
    successor and the KN-OPEN-016 amendment, which remain owed'', and DEC-20260803-85adf8 adds
    a fourth -- a supersession of EV-MLKEM-015 that the validator (VAL-20260803-cc262c) and the
    red team (RT-20260803-f42495 OBJ-6) INDEPENDENTLY recommended on the merits and each explicitly
    declined to perform, naming rule 12; EV-MLKEM-021 records the observation and performs no
    correction. GOAL-MLKEM-003 and -004 each close with ''Rule 12 remains the standing blocker
    on two owed knowledge promotions''; GOAL-MLKEM-005 carries ''Rule 12 is UNMET and UNWAIVED,
    inherited''. KN-FIND-012, KN-FIND-014 and KN-OPEN-016 all still exist at HEAD carrying the
    uncorrected text. Outside ML-KEM, CORR-20260802-1d8384 OI-2 records that GOAL-MONO-001 BATCH-003''s
    two ''independent'' reviews both resolved to claude-opus-5. WHAT IS MISSING: no record asks
    whether rule 12 is satisfiable under this runtime, and none proposes the treatment rule 13
    already received. CLAUDE.md rule 8 suspended the three-model closure quorum on exactly this
    ground -- ''under this harness every policy alias falls back to one model, so the quorum made
    closure unreachable rather than rigorous'' -- and rule 12 fails for the identical reason but
    was left standing. The asymmetry runs in the dangerous direction: closure got easier while
    correction stayed impossible, so a corpus entry two reviewers agree is wrong cannot be corrected,
    and the campaign that would correct it can close.'
  mechanism: 'MEASURE THE GATE BEFORE ARGUING ABOUT IT. Use orchestration/adapter to resolve review-breakthrough
    at max across every backend in orchestration/model-bindings.yaml and record, per backend,
    whether it resolves and to which model id -- a dated capability probe, the same discipline
    IDEA-20260807-f73d98 applies to sources, and directly analogous to the source-gate premise
    being inherited rather than measured. Then propose the minimum viable substitute the four
    owed corrections actually need: for a CORRECTION, as opposed to a breakthrough claim, the
    requirement that bites is reviewer INDEPENDENCE, not effort tier -- so define a rule-12b correction
    path requiring two pairwise-distinct resolved_model_id reviews plus a re-derivation artifact,
    and TEST IT by discharging the EV-MLKEM-015 misidentified-callable correction whose merits
    two reviewers already established. NULL CONTROL, which is what keeps this from being a loophole:
    apply the same path to a claim that should NOT pass -- a purported breakthrough -- and require
    it to be refused. Everything that changes AGENTS.md is reported to the Coordinator, not taken.'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-09'
    grep_results:
    - 'Each campaign correctly refused to route around the gate -- DEC-20260803-85adf8 says recording
      a degraded review as a rule-12 pass ''remains the one outcome worse than no review'' --
      and then correctly noted it as inherited debt; DEC-20260805-0b3e11 states the blocked transitions
      ''are inherited by the successor'', passing the obligation on rather than framing it. Nobody
      owned the gate itself, because changing a rule in AGENTS.md is a Coordinator/user act and
      every session that hit it was mid-batch; the rule-13 suspension was decided at the harness
      level and simply did not sweep rule 12. Verified: 62 records mention rule 12 or review-breakthrough
      and NOT ONE proposal among 459 has it as its subject (title scan returns zero). The closest,
      IDEA-20260807-5a8d61, audits missing reviews in the 2026-08-04 ECDLP closure series -- an
      absence of review, not an unreachable review policy.'
    conclusion: Screened against all 459 records in ledger/proposals, 271 in ledger/hypotheses
      and knowledge/; external novelty UNVERIFIED.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS: re-litigating any of the four frozen corrections
      on their merits. The object is the REVIEW GATE''S REACHABILITY.'
    tracked_object: Per backend in orchestration/model-bindings.yaml, whether review-breakthrough
      at max effort resolves, and to which model id.
    one_step_propagation_rule: Distinctness is judged on resolved_model_id, exactly as the suspended
      rule 13 judged it; two aliases resolving to one model are one reviewer.
    newness_score: Nil as mathematics. The content is that rule 13 was suspended for precisely
      this reason and rule 12, which fails identically, was left standing -- so closure got easier
      while correction stayed impossible.
  lossy_projection_identifiability_audit:
    projection: the runtime -> a per-backend reachability verdict for one review policy.
    what_is_discarded: Everything about review quality; only reachability is measured.
    is_it_only_a_change_of_coordinates: 'NO -- the verdict does not currently exist in any record.
      Honest caveat: reachability is not adequacy, and a reachable backend is not thereby a good
      reviewer.'
    mirror_failure_check: CHECKED. The probe must be able to return REACHABLE. If some backend
      does serve review-breakthrough at max, rule 12 is satisfiable and the four corrections are
      merely undispatched -- the best outcome and the one that needs no rule change at all.
  null_object_control:
    primary_null: A KNOWN-REACHABLE POLICY (any the harness routinely serves) must probe REACHABLE,
      and a deliberately nonexistent policy alias must probe UNREACHABLE. A probe that cannot
      distinguish them measures nothing.
    secondary_nulls:
    - 'Compare against the rule-13 precedent: CLAUDE.md rule 8 records the identical failure mode
      and its resolution, so the argument''s form is already adjudicated in this repository.'
    - CORR-20260802-1d8384 OI-2 records GOAL-MONO-001 BATCH-003's two 'independent' reviews both
      resolving to claude-opus-5 -- an existing instance the probe must reproduce.
  assumptions: []
  predictions:
  - metric: backends in orchestration/model-bindings.yaml that resolve review-breakthrough at
      max effort to a distinct model id
    direction: different
    minimum_effect: Zero means rule 12 is unsatisfiable under this runtime and the asymmetry with
      rule 13 is established; nonzero means the four corrections are dispatchable today.
  minimal_test:
    design: Use orchestration/adapter to resolve review-breakthrough at max across every configured
      backend; record a dated per-backend capability probe with resolved model ids; run the reachable
      and nonexistent-policy controls first.
    controls:
    - known-reachable policy control
    - nonexistent-policy control
    - CORR-20260802-1d8384 OI-2 reproduction
    required_metrics:
    - per-backend resolution verdict and resolved model id
    - dated probe record
    - list of corrections currently frozen by the gate
  falsification_conditions:
  - 'Some backend serves review-breakthrough at max: rule 12 is satisfiable, the four corrections
    are simply undispatched, and no rule change is warranted.'
  - 'The nonexistent-policy control probes REACHABLE: the probe is broken.'
  - 'The frozen corrections turn out not to require rule 12 on a careful reading: the blocker
    is a misreading rather than a rule defect, which is a cheaper repair.'
  confounders:
  - Reachability is dated and per-backend; a verdict quoted without both repeats the source-gate
    error this program already made.
  - A rule being unsatisfiable is not by itself an argument for suspending it -- the asymmetry
    with rule 13 is the argument, and it is a Coordinator judgement.
  - Adequacy of review is not measured here and must not be inferred.
  interpretation_limits:
  - This measures a gate, not any mathematics.
  - Suspending, amending or waiving rule 12 is a Coordinator act (AGENTS.md rule 1) and is reported,
    not taken. This record supplies the measurement such a decision would rest on.
  heuristic_assumptions:
  - id: HEUR-RV12-1
    statement: A capability probe of the adapter reflects what a review session would actually
      get.
    rigorous_support: None; a probe is not a session and a resolvable policy can still fail at
      run time.
    validation_plan: Run one real review-breakthrough attempt on any backend the probe marks reachable
      and report whether it completes.
  target_complexity:
    time_exponent: n/a
    memory_exponent: n/a
    best_known: n/a -- no attack
    hidden_overhead: n/a
    tradeoff_note: n/a
  dominated_by: n/a (no attack claimed)
  sota_delta: ZERO on every attack axis; no attack is proposed. Unblocks four named corrections
    in the standing knowledge corpus, three of which are KN entries that ideation reads as ground
    truth today while at least two reviewers hold them to be wrong. It removes the incentive asymmetry
    that lets a goal close while its own corrections stay frozen -- precisely the premature-closure
    failure mode docs/inventor-protocol.md treats as symmetric with overclaiming -- and it does
    for rule 12 what CLAUDE.md rule 8 already did for rule 13, on the same evidence.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 0.85 that no configured backend resolves review-breakthrough at max
    to a model distinct from the session model, confirming the asymmetry. 0.15 that one does,
    which would be the best outcome and would unfreeze four corrections immediately. 0.5 that
    a Coordinator acts on either result, which is outside this record's control.
