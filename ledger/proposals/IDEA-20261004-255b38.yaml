# IDEA-20261004-255b38
# Class-number count for discriminants -151 and -187. Proposal only. Not approved.
idea:
  id: IDEA-20261004-255b38
  question_id: RQ-JINV-8fc13a
  added: '2026-10-04'
  status: proposed
  approved_by: null
  title: >-
    The class number of discriminant -151 is 7 and of discriminant -187 is 2
  class: measurement
  claim: >-
    Discriminant -151 has 7 reduced binary quadratic forms.
    Discriminant -187 has 2. Seven exceeds two by 5. The product of
    the two class numbers is 14. Their sum is 9. The gap is a class
    number, not an ECDLP exponent and not an absolute discriminant.
  mechanism: >-
    OBJECT FRAME. The object is the set of reduced forms. The
    operation set is counting those forms, which is coordinate-dependent
    on the discriminant and is not a translation of a curve point.
    Discriminant -151 has the forms with coefficients 4, -3, 10 and
    5, -3, 8 and 2, -1, 19 and 1, 1, 38 and 2, 1, 19 and
    4, 3, 10 and 5, 3, 8. Discriminant -187 has the forms with
    coefficients 1, 1, 47 and 7, 3, 7. Two copies of class number 2
    have gap 0. No curve is enumerated.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question asks whether a small discriminant confers an
        advantage beyond the automorphism discount.
      verified_by: coordinator session 2026-10-04, question file present
    - ref: KR-IC-889857
      provenance: internal
      claim: >-
        A first-fall-degree dispute is a different object from these
        two class numbers.
      verified_by: coordinator session 2026-10-04, frontier row on disk
  assumptions:
    - The two discriminants are frozen before the forms are counted.
    - No curve is enumerated.
  proof_search_map:
    bottleneck: The class-number gap 5.
    baseline_embedding:
      parameter_slice: The discriminants -151 and -187 and the counts 7 and 2.
      reproduction_check: >-
        Two readers must agree that the counts are 7 and 2.
    observation_collision:
      observable: The class-number gap and the product.
      distinct_preimage_search: >-
        Reporting both class numbers as 2 drops the gap. Two copies
        of class number 2 make that gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The two discriminants.
        predicted_gain: Integer gap. No curve enumeration.
    quantifier_order: >-
      The discriminants are fixed before the forms are counted.
    method_ceiling:
      strongest_certifiable_claim: >-
        The class numbers 7 and 2. Not an absolute discriminant.
      nearby_object_control: >-
        Two copies of class number 2. The gap is 0.
    proof_obligations:
      - claim: Discriminant -151 has 7 reduced forms.
        responsibility: size
      - claim: Discriminant -187 has 2 reduced forms.
        responsibility: size
      - claim: The gap is not an absolute discriminant.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: class_number_gap
      direction: different
      minimum_effect: Seven exceeds two by 5.
  minimal_test:
    design: >-
      Count the reduced forms of discriminants -151 and -187. Do not
      enumerate a curve.
    controls:
      - Two copies of class number 2, whose gap is 0.
      - An independent count.
    required_metrics:
      - both class numbers
      - the gap
      - the product
  falsification_conditions:
    - The class number of -151 is not 7.
    - The product of the two class numbers is not 14.
  confounders:
    - The absolute values 151 and 187 are not the class numbers.
  interpretation_limits:
    - A class number is not a walk length.
    - No transfer to a cryptographic discriminant.
    - This is not the class-number pair 5 and 2 of discriminants -131 and -148.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen discriminant -151 has class number 7, and the
        frozen discriminant -187 has class number 2.
      rigorous_support: >-
        No class-number theorem is re-proved here. The count is a
        reading of the reduced forms.
      validation_plan: >-
        Two independent counts of the reduced forms. A mismatch voids the gap.
