idea:
  id: IDEA-20260809-8f32fd
  question_id: RQ-ECDLP-002
  added: '2026-08-09'
  title: One expensive preprocessing amortized across instances generated by a symmetry has now
    been found independently in the ECDLP and lattice lanes, disclaimed as 'an acknowledged structural
    analogy' in both, and made the tracked object of no record -- while the two entries that would
    settle it have never been read and the two lanes already disagree quantitatively
  class: cost-model
  claim: 'No hypothesis, proposal or question makes the MECHANISM the tracked object; every record
    tracks an object inside one primitive and notes the transfer as an aside it is not permitted
    to act on. KN-OPEN-012 asks explicitly whether ''the ECDLP program''s structure-exploitation
    experience transfers'' to ideal/module lattices and is cited by exactly two proposals, in
    both only inside a dominated_by row as a record checked and found not to supersede. KN-OPEN-026
    sharpens it and then refuses to act: ''the 2026 mechanism is amortisation of expensive preprocessing
    across symmetry-derived instances -- which is, structurally, what index calculus does with
    a factor base and what glv-gls-style automorphism speedups do for relation harvesting. If
    that correspondence is real rather than verbal, it is a two-way channel and the program has
    relevant expertise. Nothing here establishes that it is real.'' Its own resolution list puts
    formalizing the correspondence at step 4 and labels it ''the speculative step [that] should
    not be attempted before steps 1-3'' -- and STEPS 1-3 (read KN-LIT-7663 and KN-LIT-7667 in
    full and extract each cost model and regime) HAVE NOT BEEN DONE; both entries remain confidence:
    reported with ''no paper was read in full''. From the other lane IDEA-20260807-a127ab builds
    the identical shape (one Bernstein-Lange preprocessing table transported across every curve
    in an F_p-isogeny class) and books the collision in its own dominated_by: ''KN-TECH-082 ...
    Same SHAPE (a symmetry generates many instances sharing one preprocessing), different object
    ... Recorded as an acknowledged structural analogy, not as support.'' Nobody has asked why
    the amortization is FRONTIER-BOUNDED in the group setting and not obviously so in the lattice
    setting -- the only version of the question that could yield a transferable statement rather
    than a verbal analogy.'
  mechanism: 'MAKE THE EXCHANGE RATE THE OBJECT, NOT THE ANALOGY. Define one quantity both lanes
    already compute: given a symmetry group G acting on instances that share one preprocessing
    artifact, the ratio (attack cost saved) / (|G| paid for). The ECDLP side already has a derived
    value -- a127ab''s transport lands ''exactly ON the S*T^2 = N frontier, never below it'',
    so the ratio is pinned at 1 with zero delta, and the reason is the frontier itself. The lattice
    side has three reported values in disagreement (15 bits sparse RLWE, 13 bits sparse Ring-LWE,
    and per EV-MLKEM-001 about 0-0.8 bits at ML-KEM after an author-confirmed estimator correction).
    The cheap decisive first move is KN-OPEN-026''s OWN steps 1-3, which nobody has done: read
    KN-LIT-7663 and KN-LIT-7667 in full, extract each cost model and regime, and ask whether an
    S*T^2-style frontier bound exists on the lattice side at all. The null-object control is built
    in and is the likely outcome: if the lattice figures also collapse to a frontier once memory
    is charged under KN-TECH-044, the correspondence is REAL and predicts that the reported 13-15
    bit gaps are accounting artifacts of the sparse-secret regime -- exactly KN-OPEN-026''s unanswered
    Q3. If they do not, the correspondence is verbal and both KN-OPEN-012 and KN-OPEN-026 close
    with a named obstruction instead of a deferral.'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-09'
    grep_results:
    - 'EV-MLKEM-001 weakened the one composition that tried the transfer (IDEA-20260722-001, orbit
      + LaMS + GLS) with direction: weakens, strength: preliminary, ZERO runs (''Literature and
      derivation review only; no empirical run was performed'') and a boundary that explicitly
      does not close the space: ''They do not rule out all covariance-aware, isometry-aware, or
      p-adic MLWE attacks.'' It named no successor and none exists. IDEA-20260807-abacec is a
      DCP/Regev-BKSW reduction-REACH map -- a quantum-reduction question about Module-LWE, an
      entirely different mechanism. I checked all nine amortization-titled proposals and every
      one is ECDLP-internal multi-target amortization (IDEA-20260726-001 crossover against the
      generic preprocessing frontier, IDEA-20260731-010 shared factor base for T targets, IDEA-20260731-013
      shared distinguished-point table, IDEA-20260807-8e20fe the amortization-inversion locus
      in working-set size); none crosses primitives. All 66 research questions are scoped to a
      single primitive or to one object inside one primitive; none is cross-primitive, and run
      1 recorded cross-primitive mechanism transfer as something it did not systematically examine.'
    conclusion: Screened against all 459 records in ledger/proposals, 271 in ledger/hypotheses
      and knowledge/; external novelty UNVERIFIED.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS as the primary lens: the analogy itself, which
      two records already disclaim as ''an acknowledged structural analogy''. The object is the
      EXCHANGE RATE.'
    tracked_object: Given a symmetry group G acting on instances that share one preprocessing
      artifact, the ratio (attack cost saved) / (|G| paid for).
    one_step_propagation_rule: Enlarging G multiplies the paid side by the group-index factor
      and the saved side by whatever the transport actually buys; the ratio composes multiplicatively
      and is exactly computable on each side.
    newness_score: 'The analogy is already noted in both lanes. What is new is refusing to leave
      it an analogy: one quantity both lanes already compute, evaluated on both.'
  lossy_projection_identifiability_audit:
    projection: the amortization scheme -> a single exchange ratio.
    what_is_discarded: The mechanism on each side; only the rate is retained.
    is_it_only_a_change_of_coordinates: 'NO -- the ratio is comparable across lanes precisely
      because it discards each lane''s mechanism. Honest caveat: a WEAK object, one number per
      lane, and a matching ratio would be evidence of a shared constraint rather than proof of
      one.'
    mirror_failure_check: CHECKED. The ratio must be able to differ across lanes. The ECDLP side
      is pinned at 1 with zero delta (a127ab's transport lands exactly ON the S*T^2 = N frontier,
      never below it) while the lattice side has three reported values in disagreement, so the
      two sides are not forced equal.
  null_object_control:
    primary_null: 'THE FRONTIER ITSELF IS THE NULL: a scheme whose ratio is 1 buys nothing beyond
      what the time-memory frontier already gives, and the ECDLP side is measured at exactly 1.
      Any lattice value must be compared against that, not against zero.'
    secondary_nulls:
    - 'KN-OPEN-026''s OWN STEPS 1-3, which nobody has done: read KN-LIT-7663 and KN-LIT-7667 in
      full, extract each cost model and regime, and ask whether the three reported lattice values
      (15 bits sparse RLWE, 13 bits sparse Ring-LWE, and per EV-MLKEM-001 about 0-0.8 bits at
      ML-KEM after an author-confirmed estimator correction) are even measuring the same quantity.'
    - If the three disagree because they are different quantities, that is the result and no cross-lane
      comparison is warranted.
  assumptions: []
  predictions:
  - metric: exchange ratio (cost saved)/(|G| paid) on each lane, on one stated definition
    direction: different
    minimum_effect: Any lane whose ratio is bounded away from 1 after the definitions are reconciled;
      the ECDLP side is pinned at 1.
  minimal_test:
    design: Reconcile the three lattice figures against their cost models first (KN-OPEN-026 steps
      1-3, zero compute); only if they are the same quantity, evaluate the common ratio on both
      lanes and compare against the S*T^2 = N frontier.
    controls:
    - the S*T^2 = N frontier as the ratio-1 null
    - cost-model reconciliation before comparison
    - EV-MLKEM-001's author-confirmed estimator correction as the lattice anchor
    required_metrics:
    - reconciled lattice figure with its regime
    - exchange ratio per lane
    - distance from the frontier on each side
  falsification_conditions:
  - 'The three lattice figures are different quantities: no cross-lane comparison is warranted
    and the analogy should be retired rather than pursued -- a clean and likely outcome.'
  - 'Both lanes'' ratios are 1: amortization buys exactly the frontier in both, which is a shared
    constraint worth stating and is the interesting negative.'
  - 'The lattice ratio is bounded away from 1 after reconciliation: the lanes differ structurally
    and the ECDLP side''s pinning is not universal.'
  confounders:
  - '''Cost saved'' and ''|G| paid'' must be in the same units on both sides or the ratio is meaningless;
    this is where a cross-lane comparison most easily goes wrong.'
  - The lattice figures come from different sparse-secret regimes; regime is a confound.
  - A matching ratio across two lanes is weak evidence for a shared mechanism and must not be
    reported as one.
  interpretation_limits:
  - Toy and relayed inputs on the lattice side until KN-OPEN-026's reading is done.
  - This is a cost-model comparison. It proposes no attack in either lane and moves no exponent.
  heuristic_assumptions:
  - id: HEUR-XAMOR-1
    statement: The exchange ratio is a lane-independent quantity.
    rigorous_support: None; it is the record's own construction and may not survive the reconciliation
