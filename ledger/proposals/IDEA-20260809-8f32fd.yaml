  target_complexity:
    time_exponent: No exponent claim; prices what preprocessing amortization buys.
    memory_exponent: The S dimension of the S*T^2 = N frontier is the paid side.
    best_known: The time-memory frontier itself, which the ECDLP side already matches exactly.
    hidden_overhead: Group-action cost on each side, charged explicitly.
    tradeoff_note: A ratio of 1 means the scheme buys exactly the frontier and nothing more.
  dominated_by: 'Pollard rho and the S*T^2 = N frontier. Rows checked across time, memory and
    data/queries: Pollard rho (p^{1/2}, O(1) memory); BSGS (p^{1/2}, p^{1/2}); vOW parallel rho
    (p^{1/2}/w); the S*T^2 = N preprocessing frontier. No row is added.'
  sota_delta: 'ZERO on every attack axis; no attack is proposed. This is the one question the
    corpus has framed twice from opposite lanes and acted on zero times; KN-OPEN-026 itself calls
    it ''the sharpest available test of the transfer question''. A frontier bound holding in both
    settings would be a transferable structural statement of exactly the shape docs/target-result-profile.md
    asks for. A clean negative retires two open problems carried as open for a month and stops
    the analogy being rediscovered a third time. Note the dependency: the memory charge it turns
    on is the exponent cluster CHRG measures.'
