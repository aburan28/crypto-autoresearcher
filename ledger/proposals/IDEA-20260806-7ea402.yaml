idea:
  id: IDEA-20260806-7ea402
  question_id: RQ-SDEG-001
  added: '2026-08-06'
  title: >-
    The rank deficit is not the cost variable: Groebner cost is quantized in
    whole degrees, so a deficit of ANY magnitude costs exactly zero unless it
    pushes the degree at which the system first solves, and then it costs a
    factor ((n-D)/(D+1))^omega at once -- three goals are blocked measuring a
    magnitude whose cost derivative is identically 0 almost everywhere
  class: cost-model

  claim: >-
    THE CLAIM IS ABOUT A DERIVATIVE THAT IS ZERO, AND ABOUT WHERE IT IS NOT.

    (A) THE COST FUNCTION IS A STEP FUNCTION. For a polynomial system solved by
    a degree-graded linear-algebra method (Macaulay / F4 / XL), the charged cost
    is Theta(sum over D <= d_solve of ncols(D)^omega), dominated by the last
    term, where d_solve is the LEAST degree at which the graded pieces determine
    the solution. d_solve is an INTEGER. Therefore the cost is a function of an
    integer, and any continuous quantity - a rank deficit, a support gap, a
    deficiency - enters the cost ONLY through whether it changes that integer.
    Formally, with C(D) = ncols(D)^omega, the cost is C(d_solve) and
        dCost/d(deficit) = 0 whenever the deficit does not move d_solve,
        Cost(d_solve+1)/Cost(d_solve) = (ncols(D+1)/ncols(D))^omega
    and for n boolean variables ncols(D) = sum_{i<=D} C(n,i), so the jump is
    ((n-D)/(D+1))^omega to leading order. At the goal's own decisive cell
    n = 12, D = 6 that ratio is ((12-6)/7)^omega = (6/7)^omega < 1 - THE NEXT
    DEGREE IS NOT MORE EXPENSIVE THERE, because D = 6 is past the middle of a
    12-variable boolean lattice. At n = 12, D = 5 it is (7/6)^omega = 1.36 at
    omega = 2. THE JUMP FACTOR IS NOT MONOTONE IN D AND ITS VALUE AT THE CELL
    THREE GOALS ARE BLOCKED ON IS BELOW 1.

    (B) WHAT THIS SAYS ABOUT THE 7,110. EV-SIG-008 records a D6 rank defect of
    7,110 against a semi-regular prediction (149,410 measured vs 156,520
    predicted) at n = 12, seed 2, and EV-DREG-008 pins deficit_genuine = 17,947
    at n = 12, D = 6 under CTRL-B. Both are magnitudes. NEITHER RECORD STATES
    WHETHER d_solve MOVED. Under (A) that is the only thing that matters for
    cost, and it is a one-bit quantity that the committed artifacts may already
    determine: the system solves at D iff the rank of the degree-<=D Macaulay
    matrix reaches ncols(D) - (number of solutions counted with multiplicity in
    the quotient), so the question "did 7,110 cross the threshold" is
    ncols - rank - |V| compared against zero. The synthesis already records that
    it did NOT saturate the variety bound ("rank is far below ncols - |V| =
    174,031"), which if read as stated means the deficit of 7,110 is 4.5 per
    cent of a gap of 24,621 - i.e. NOWHERE NEAR the threshold, i.e. COST DELTA
    EXACTLY ZERO. I do not assert that reading as established; I assert that it
    is the reading that decides the lane and that no record performs it.

    (C) THE CONSEQUENCE FOR THE DEADLOCK, WHICH IS THE POINT OF FILING THIS.
    GOAL-SDEG-001, GOAL-DREG-001 and GOAL-SIG-001 are each blocked on
    characterising a deficit, and GOAL-ICEX-001 is blocked waiting for their
    "charged measurement packages". If the deficit's cost derivative is zero,
    then NO amount of further deficit characterisation can change any ICEX
    threshold, and the three goals should ship d_solve - a single integer per
    cell - instead of a magnitude. That converts three blocked measurement
    programmes into one integer per cell, and it is derivable from committed
    artifacts at zero compute. If instead the deficit DOES move d_solve at some
    reachable cell, the cost delta is a named factor and the lane has, for the
    first time, a number ICEX can consume.

    (D) THE SIGN NOBODY HAS STATED, AND IT IS NOT THE OBVIOUS ONE. A rank
    deficit is routinely read as "the system is harder than semi-regular". That
    is true for d_solve and FALSE for the per-degree linear algebra: a
    rank-deficient Macaulay matrix has FEWER independent rows, so the reduction
    at that degree is CHEAPER, not more expensive. The two effects have opposite
    signs and the net is the quantized jump in (A). Every record in these three
    goals reports the deficit with the first sign implied and the second
    unmentioned.

  object_first_candidate:
    tracked_object: >-
      THE DEGREE-GRADED SOLVE INDICATOR: the boolean sequence
      sol(D) = [ rank(Mac_D) >= ncols(D) - dim_D(quotient) ] over D = 1, 2, 3,
      ..., projected to the single integer d_solve = min{D : sol(D)}. Every
      record in these three goals tracks a REAL-VALUED deficit; this object
      discards the magnitude entirely and retains one bit per degree.
    established_families_off_limits: >-
      Declared off-limits as the primary lens for this record: semi-regularity
      and the Bardet-Faugere-Salvy series as an object of study (it is used only
      as the null); first-fall-degree instrumentation; syzygy enumeration and
      the trivial-syzygy subtraction; support-pattern combinatorics; factor-base
      geometry; monodromy and Galois statistics; every attack family. NO ATTACK
      IS PROPOSED. The tracked object is a property of a cost function.
    newness_score: >-
      That Groebner cost is dominated by the top degree is standard and is not
      claimed as new. What the duplication audit did not find in the six SDEG,
      DREG and SIG proposals is any record that (i) states the cost derivative
      with respect to deficit MAGNITUDE is zero away from a threshold,
      (ii) computes the jump factor and observes it is BELOW 1 at n=12, D=6, or
      (iii) proposes d_solve rather than a deficit as the deliverable those
      goals owe ICEX. IDEA-20260805-2dc8de audits the NORMALISATION of the
      deficit; this record says the normalised and unnormalised versions are
      both cost-irrelevant.
    testability_score: >-
      High and nearly free. Stage 0 is exact integer arithmetic on binomial
      sums. Stage 1 re-reads two committed artifacts for one comparison per
      cell. Stage 2 is a pure-Python boolean row reduction at n <= 10, which the
      corpus has already demonstrated is feasible without SageMath and without
      numpy.
    survival_score: >-
      The quantization argument survives to any n and any D as exact arithmetic.
      It DISSOLVES exactly where the solver is not degree-graded - a real F5
      with degree falls, or a solver that terminates on a partial basis - and
      locating that dissolution is a declared deliverable rather than a caveat.

  mechanism: >-
    DERIVED IN THIS RECORD from the definition of a degree-graded solve. All
    arithmetic below is exact and reproducible by hand.

    STEP 1 - THE COST IS THE TOP DEGREE. A degree-graded solve builds Macaulay
    matrices Mac_D of size nrows(D) x ncols(D) for D = 1, 2, ... and stops at
    the first D where the reduced system determines the solutions. Total cost
    is sum_D ncols(D)^omega, and since ncols is superpolynomially increasing in
    D over the relevant range the sum is Theta of its last term. Nothing about
    the interior degrees survives into the leading cost term.

    STEP 2 - THE COLUMN COUNTS, EXACTLY. For n boolean variables and degree
    bound D, ncols(D) = sum_{i=0..D} C(n,i). At n = 12: ncols(5) = 1586,
    ncols(6) = 2510, ncols(7) = 3302, ncols(8) = 3797. Ratios:
    2510/1586 = 1.583, 3302/2510 = 1.316, 3797/3302 = 1.150. At omega = 2 the
    per-degree cost jumps are 2.505, 1.731, 1.322. THE JUMPS SHRINK TOWARD 1 AS
    D PASSES n/2, and they are computed here for the exact cell the three goals
    are blocked on. (These are the pure boolean-lattice counts; the committed
    chained-Semaev systems have a block structure with much larger column
    counts - 156,520 and 174,031 appear in the synthesis - and the SAME argument
    applies with those counts substituted, which is stage 1's job. The
    qualitative conclusion, that the jump factor is a ratio of consecutive
    column counts and is O(1), does not depend on which count is used.)

    STEP 3 - THE DERIVATIVE. Let delta be a rank deficit at degree D. Cost is
    C(d_solve). d_solve is unchanged by delta unless delta crosses the solve
    threshold at D. Hence dCost/d(delta) = 0 on an open set, and the cost is a
    step function of delta with a single jump. A programme that measures delta
    to three significant figures is measuring a quantity whose cost image has
    two values.

    STEP 4 - THE OPPOSITE SIGN. At the degree where the deficit occurs, the
    linear algebra reduces a matrix of rank(Mac_D) = ncols(D) - gap. Elimination
    cost is governed by the rank, so a LARGER deficit makes THAT degree's
    reduction CHEAPER by a factor (1 - delta/ncols)^{omega-1}. At delta = 7,110
    and ncols = 156,520 that is a 4.5 per cent rank reduction, i.e. a 4.5 per
    cent SAVING at omega = 2, against a possible 32 per cent penalty if it
    pushes a degree at the n=12 D=6->7 ratio computed above. The net is the
    quantized jump minus this saving, and NO RECORD IN THESE THREE GOALS COMPUTES
    EITHER TERM.

    STEP 5 - WHY THIS IS THE DEADLOCK EXIT AND NOT ANOTHER AUDIT. ICEX needs a
    per-relation oracle cost. SDEG, DREG and SIG can supply it only as
    C(d_solve) for the decomposition system at the relevant arity. d_solve is an
    integer they can already extract from their existing instruments; a deficit
    is not, and cannot be converted into a cost without exactly the threshold
    comparison this record specifies. The deliverable is therefore: for every
    committed cell, the triple (D, ncols(D) - rank(Mac_D), dim of the solution
    space at D) and the resulting boolean sol(D) - three numbers already latent
    in artifacts these goals have produced.

  novelty_status: unverified

  literature_context:
    - >-
      analysis/SSI-ECDLP-SYNTHESIS-20260803.md READ IN FULL. It records
      EV-SIG-008's "genuine D6 rank defect of 7,110 against the semi-regular
      prediction (149,410 vs 156,520)", that it is "NOT variety saturation -
      rank is far below ncols - |V| = 174,031", that D5 is clean, and that
      EV-DREG-008 independently pins deficit_genuine = 17,947 at n=12, D=6 under
      CTRL-B. EV-SIG-008 and EV-DREG-008 themselves were NOT opened this session
      and every number above is relayed from the synthesis, which is a committed
      artifact I can name by path. Stage 1 of the minimal test opens both at
      source before any conclusion is drawn - the criterion-3 discipline this
      corpus's own SCREENING.md records three proposals failing.
    - >-
      The Bardet-Faugere-Salvy semi-regular series and the standard
      "cost = binom(n+d_reg, d_reg)^omega" model are classical. NOT READ - no
      source opened, primary sources unreachable. They are not load-bearing:
      this record uses only that the cost is dominated by the top degree and
      that column counts are binomial sums, both of which it derives.
    - >-
      No claim of novelty and no dismissal as known. The quantization
      observation may well be folklore; if it is, the finding is that three
      committed goals are nonetheless organised around the continuous variable.

  lossy_projection_identifiability_audit:
    projection: >-
      Full Macaulay matrix at each degree -> the boolean sequence sol(D) ->
      the integer d_solve.
    what_is_discarded: >-
      Every entry, every rank value, every deficit magnitude, every support
      pattern, the seed, the block structure, and the identity of the deficient
      rows. At n = 12, D = 6 that is a 149,410-dimensional row space collapsed
      to one bit.
    why_genuinely_lossy: >-
      Extremely lossy, with astronomically large fibres: all systems solving at
      the same degree share the value. Nothing is recoverable - this is not the
      (Delta, Pi) failure where the discarded data returned as roots of a
      quadratic.
    why_compatible_with_the_operations: >-
      The operation the object must survive is DEGREE INCREMENT, and it does so
      deterministically: sol is monotone (once the system determines its
      solutions at degree D it does so at D+1, because Mac_{D+1} contains
      Mac_D's rows up to multiplication), so the sequence is 0...01...1 and is
      completely described by d_solve. Monotone propagation under the one
      operation the solver performs is exactly the compatibility the
      lossy-projection test demands.
    is_it_only_a_change_of_coordinates: >-
      NO. Fibres are huge, and the object takes different values on different
      systems, so it is neither a re-coordinatisation nor a constant. THE HONEST
      WEAKNESS, RECORDED: the object is BLIND to everything the three goals
      currently measure, which is a feature for costing and a defect for
      mechanism-hunting. If a reader wants to know WHY a system is deficient,
      this object is useless; if they want to know what the deficiency COSTS, it
      is the only thing that matters. Both sentences must travel together.

  assumptions:
    - >-
      The solver charged is degree-graded and terminates at the first degree
      where the system determines its solutions. Real F5 with degree falls can
      terminate earlier and can do partial work at intermediate degrees; the
      record states the assumption and stage 2 measures the departure.
    - >-
      omega is declared before any row is computed and both omega = 2 (the
      corpus's own optimistic convention, flagged as optimistic in
      IDEA-20260805-e732ed) and omega = 2.81 are reported. No single-omega
      number is emitted.
    - >-
      "Determines its solutions at degree D" is made precise as
      rank(Mac_D) >= ncols(D) - dim_D(I-quotient). If a committed artifact used
      a different termination criterion, the mapping deficit -> d_solve changes
      and stage 1 must record which criterion each artifact used.

  predictions:
    - metric: >-
        Per-degree cost jump factor J(n,D) = (ncols(D+1)/ncols(D))^omega for the
        boolean lattice, n = 8..16, D = 3..10
      direction: different
      minimum_effect: >-
        EXACT RATIONALS, computed before any measurement. At n = 12, omega = 2:
        J(12,5) = 2.505, J(12,6) = 1.731, J(12,7) = 1.322, J(12,8) = 1.174.
        FORCED CONSEQUENCE: J is DECREASING in D past n/2, so a deficit that
        pushes a degree costs LESS the deeper it occurs - the opposite of the
        intuition the deficit records carry. Any implementation returning a
        J that increases past D = n/2 has a bug.
    - metric: >-
        The boolean sol(6) for the committed n = 12 seed-2 cell, recomputed at
        source from EV-SIG-008 and EV-DREG-008
      direction: different
      minimum_effect: >-
        A single bit, with the three inputs (ncols, rank, solution-space
        dimension) printed beside it. THE THREE OUTCOMES AND WHAT EACH MEANS:
        sol(6) = TRUE with deficit 7,110 present means the deficit is
        COST-FREE and the three goals' current deliverable is worth zero to
        ICEX; sol(6) = FALSE means d_solve >= 7 and the cost delta is
        J(12,6) = 1.731 at omega = 2, which is the first ICEX-consumable number
        these goals would have produced; the inputs being unrecoverable from the
        committed artifacts is a THIRD outcome and is a reportable finding about
        what those goals archive.
    - metric: >-
        Net cost delta = J(n,D)*[sol flips] - saving from rank reduction
        (1 - delta/ncols)^{omega-1}
      direction: different
      minimum_effect: >-
        At delta = 7,110, ncols = 156,520, omega = 2: saving factor 0.9546, i.e.
        a 4.5 per cent SAVING. If sol does not flip, the net effect of the
        celebrated 7,110 is a 4.5 per cent cost REDUCTION. Stating a
        cost-reducing sign for a quantity three goals treat as an obstruction is
        a falsifiable, decision-relevant prediction.
    - metric: >-
        Measured d_solve versus predicted d_solve on a self-built ladder,
        n = 6..10, boolean chained-Semaev shape, >= 8 seeds per cell
      direction: same
      minimum_effect: >-
        The measured d_solve must equal the value predicted from the measured
        per-degree ranks by the threshold rule, in >= 95 per cent of cells. A
        mismatch means the termination criterion in the model is not the
        solver's, and the whole cost mapping must be restated before any deficit
        is interpreted.

  minimal_test:
    design: >-
      Three stages, cheapest first, and stage 1 can terminate the line.
      STAGE 0 (exact arithmetic, ZERO compute, ~30 minutes). Emit J(n,D) for
      n = 8..16, D = 3..10 at omega in {2, 2.81}. Emit the rank-saving factor as
      a function of deficit fraction. Emit the net-effect table. This stage
      needs no committed artifact and no solver.
      STAGE 1 (reading, ZERO compute). Open EV-SIG-008 and EV-DREG-008 AT SOURCE
      (not via the synthesis) and extract, per cell, ncols(D), rank(Mac_D), and
      whatever the artifact records about the solution-space dimension. Compute
      sol(D). If the artifacts do not contain the third input, STOP and report
      that as the finding: three goals archive a deficit and not the quantity
      that converts it to cost.
      STAGE 2 (pure Python, hours, no SageMath and no numpy). Self-built ladder
      at n = 6..10 with the chained boolean Semaev shape, >= 8 seeds per cell:
      exact GF(2) row reduction per degree, record rank(D), ncols(D), the
      solution count by exhaustive search over 2^n (feasible to n = 10 at 1024
      points), hence sol(D) and d_solve. Report measured against predicted.
    controls:
      - >-
        KNOWN-ANSWER EDGE WITH NO HIDDEN COST (the calibration, and it runs
        first). A SEMI-REGULAR system has deficit 0 by definition, so the
        instrument must return net cost delta EXACTLY 0 and d_solve exactly the
        Bardet series value. An instrument built to find hidden cost in a
        deficit will find it everywhere unless it returns exactly zero here.
        CAN FAIL: an off-by-one in the termination criterion returns a nonzero
        delta on a system that has none, and that is the single most likely bug.
      - >-
        PLANTED THRESHOLD-CROSSING DEFICIT (CAN FAIL). Construct, at n = 8, a
        system with a deficit engineered to sit ONE unit below the solve
        threshold at D, and a sibling with it ONE unit above. FORCED VALUES:
        d_solve must differ by exactly 1 between the two, and the measured cost
        ratio must equal J(8,D) within the row-reduction constant. If the
        instrument cannot separate a one-unit difference at the threshold, it
        cannot decide the lane and no negative may be read from any other arm.
      - >-
        PLANTED SUB-THRESHOLD DEFICIT (CAN FAIL, AND IS THE NULL). Construct a
        system with a LARGE deficit far below the threshold - engineered by
        duplicating rows, which reduces rank without touching the solution
        space. FORCED VALUE: d_solve UNCHANGED and net cost delta a small
        SAVING, not a penalty. If the instrument reports a penalty here, it is
        reading magnitude rather than threshold and the whole record's claim is
        being measured by an instrument that presupposes its negation.
      - >-
        GRADED CONTROL WITH >= 3 INTERIOR POINTS AND A REQUIRED MONOTONICITY.
        Sweep the planted deficit from 0 to past the threshold in >= 5 steps.
        FORCED SHAPE: d_solve is a step function - constant, then one jump,
        then constant. A d_solve that drifts smoothly with the deficit falsifies
        the quantization claim outright, and a d_solve that never moves at any
        deficit means the threshold is unreachable in this construction and the
        control has no power.
      - >-
        OMEGA CONTROL. Every number reported at both omega = 2 and omega = 2.81.
        A conclusion that flips sign between them is reported as
        omega-indeterminate, not resolved by choosing one.
      - >-
        ARCHIVE CHECK (zero compute). Record which of the six committed SDEG /
        DREG / SIG proposals report a deficit magnitude and which report
        d_solve. Under AGENTS.md retrieval policy item 7 this is reported, and
        no status change to any of them is proposed.
    required_metrics:
      - J(n,D) table at both omega values, exact rationals
      - per cell: ncols(D), rank(Mac_D), solution-space dimension, sol(D), d_solve
      - net cost delta with the penalty and the saving shown SEPARATELY
      - the graded sweep's d_solve step function with its jump location
      - which committed artifacts do and do not contain the third input

  falsification_conditions:
    - >-
      The graded sweep shows d_solve varying smoothly with the deficit. The
      quantization claim is false, the cost derivative is not zero, and the
      three goals' magnitude-measuring programme is vindicated. THIS IS THE
      OUTCOME THAT REFUTES THIS RECORD AND IT IS REACHABLE.
    - >-
      The semi-regular calibration returns a nonzero cost delta. The instrument
      is broken and nothing else may be read.
    - >-
      The planted threshold pair does not separate. No power; no negative
      admissible.
    - >-
      Stage 1 finds sol(6) = FALSE at the committed n = 12 cell. The deficit DID
      move the degree, the cost delta is J(12,6), and this record's expected
      reading is wrong - which is the single most valuable outcome for the
      blocked goals, because it hands ICEX a number.
    - >-
      A committed artifact records that its solver terminated on a criterion
      other than the graded threshold. The mapping deficit -> cost is different
      and must be re-derived for that solver before anything is concluded.

  confounders:
    - >-
      DEGREE FALLS. A real F5 can produce a degree fall that lets the system
      solve below the graded prediction. That makes d_solve solver-dependent and
      is precisely why stage 2 measures d_solve rather than assuming it.
    - >-
      BLOCK STRUCTURE. IDEA-20260805-e732ed records that the chained system's
      block structure violates the genericity the 2^1194 baseline assumes. Block
      structure changes ncols(D) and therefore J(n,D); stage 1 must use the
      artifacts' own column counts, not the pure boolean-lattice counts computed
      in stage 0.
    - >-
      omega = 2 IS NOT ACHIEVABLE for the sparse structured matrices actually
      reduced. The corpus's own optimistic convention is retained only as one of
      two reported columns, and the record never emits a single-omega number.
    - >-
      SELECTION. This record was written by an author who expects sol(6) = TRUE
      (deficit cost-free). The planted threshold-crossing control exists so that
      the opposite outcome is cleanly reachable, and stage 1 is specified to
      open the artifacts at source rather than through the synthesis that
      already frames the deficit as a defect.

  interpretation_limits:
    - >-
      NO ATTACK, NO EXPONENT MOVED, NO ECDLP CLAIM IN EITHER DIRECTION. This is
      a statement about how a cost function depends on a measured quantity.
    - >-
      TOY TIER. Stage 2 reaches n <= 10. Stage 1 re-reads committed toy-tier
      artifacts at n = 12. Nothing here is crypto-scale in any direction.
    - >-
      EVERY MEASUREMENT IN THESE THREE GOALS IS A BOOLEAN WEIL-DESCENT SYSTEM
      while RQ-SDEG-001 asks about prime-field decomposition cost. That gap is
      IDEA-20260805-0d2a21's subject and is NOT repaired here; this record's
      conclusions are scoped to the boolean systems actually measured, and the
      prime-field transfer is explicitly not claimed.
    - >-
      It proposes no status change to EV-SIG-008, EV-DREG-008 or any SDEG, DREG
      or SIG proposal, and it does not assert that the 7,110 or the 17,947 are
      wrong. It asserts that their cost image has not been computed.
    - >-
      Forward guidance, mandatory. What remains open regardless of outcome:
      (a) the MECHANISM of the deficit, which this object is deliberately blind
      to and which IDEA-20260803-202a15 targets; (b) whether d_solve for the
      PRIME-FIELD decomposition system is reachable at all, which is the
      question ICEX actually needs and which no committed cell answers;
      (c) whether a solver with degree falls breaks the graded cost model, which
      would make the whole quantization argument solver-relative.

  standing_screen_verdicts:
    kn_find_007_mean_yield:
      verdict: NOT APPLICABLE - PASSES
      reasoning: >-
        No factor base is proposed, no decomposition yield is claimed, and the
        record makes no statement about how a base is chosen. The conservation
        identity is untouched.
    kn_find_c41ea9_generic_fibre:
      verdict: NOT APPLICABLE - PASSES
      reasoning: >-
        The observable is a rank threshold and an integer degree, not a cycle
        type, Galois group, monodromy statistic or Frobenius census, and it is
        not evaluated on a fibre of the summation cover at all. The complete
        splitting on the factor-base sublocus neither supports nor refutes it.
        Noted for completeness: complete splitting is a statement about ROOTS of
        S_m, whereas d_solve is a statement about the GRADED IDEAL, and the two
        are different objects even where both are defined.
    kn_find_002_ggm_simulable:
      verdict: NOT APPLICABLE - PASSES
      reasoning: >-
        No oracle of any kind is proposed, and no jet, endomorphism, elliptic-net
        or incidence family is reopened. The record proposes no algorithm to
        which a simulation argument could apply.

  discriminated_from:
    nearest_existing_idea: IDEA-20260805-2dc8de
    nearest_existing_read: >-
      Title and question_id read from the committed file via the audit's E4
      enumeration; body NOT opened. Stated plainly so the discrimination can be
      re-checked by a reviewer who does open it - and it should be.
    differing_observable: >-
      2dc8de's observable is the DEFICIT AFTER NORMALISATION: its title states
      that "RQ-DREG-001's departure criterion and every scale-free version of
      the same committed data point in opposite directions, and the raw deficit
      does not even grow monotonically". That is an argument about WHICH
      CONTINUOUS FUNCTION OF THE DEFICIT to report. This record's observable is
      the BOOLEAN sol(D) and the INTEGER d_solve, and its claim is that every
      continuous function of the deficit - raw or normalised, monotone or not -
      has the same cost image, namely a two-valued step. The two records
      therefore disagree on whether the normalisation question matters at all,
      and one experiment separates them: compute sol(D) at the committed cells.
      If sol never flips across the whole ladder, 2dc8de's normalisation
      question is cost-irrelevant; if it flips, the flip point - not the
      normalisation - is the decision variable.
    second_and_third_records_checked:
      - >-
        IDEA-20260803-202a15 (title read): seeks ONE CLOSED FORM predicting both
        committed n=12 deficits, or a named no-go. That is a MECHANISM record
        about the magnitude's origin; this record is a COST record that is
        deliberately blind to the mechanism. They are complementary and neither
        subsumes the other: 202a15's closed form, if found, still needs this
        record's threshold comparison before it can become an ICEX input.
      - >-
        IDEA-20260805-61f7f4 (title read): a zero-compute discriminating-power
        map over (n, D, u_D) whose forced value is that at D = 6 and
        n in {10..13} every cell with u_6 below h_6 makes all three frozen
        collapse candidates predict the IDENTICAL rank. That is about
        distinguishing CANDIDATE EXPLANATIONS by rank; this record is about
        converting rank into cost. 61f7f4's forced value would, if confirmed,
        strengthen this record's case (identical predicted ranks cannot produce
        different d_solve), and the two should be read together - which is
        stated here rather than claimed as independence.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For the systems in question, the degree-graded solve terminates at
        d_solve = min{D : rank(Mac_D) >= ncols(D) - dim_D(quotient)}, and the
        charged cost is Theta(ncols(d_solve)^omega).
      rigorous_support: >-
        The rigorous half: for a zero-dimensional ideal, the graded pieces of
        the quotient stabilise and the degree at which the Macaulay matrix has
        corank equal to the quotient dimension is exactly where linear algebra
        determines the solutions - this is a definition-level statement, not an
        assumption. The HEURISTIC half is that the implemented solver stops
        there rather than earlier (degree fall) or later (incomplete
        reduction). It imitates the standard "solving degree equals degree of
        regularity for semi-regular systems" convention, which is exactly the
        convention EV-SIG-008 is recorded as falsifying at D6 - so this
        assumption is under active doubt in this corpus and is stated as such.
      validation_plan: >-
        Stage 2 measures both sides directly at n = 6..10 with >= 8 seeds per
        cell: the per-degree rank by exact GF(2) reduction, the solution count
        by exhaustive evaluation over all 2^n points, and the actual
        termination degree of the reduction. Predicted versus measured d_solve
        must agree in >= 95 per cent of cells. TAIL CHECK: the largest observed
        (measured - predicted) discrepancy against zero, and the fraction of
        cells showing a degree fall. TOY SCALE ONLY (n <= 10, 2^10 = 1024
        points); this is NOT crypto-scale validation and no shortcut exists that
        would make it one for this quantity.
    - id: H2
      statement: >-
        The chained-Semaev systems' column counts satisfy
        ncols(D+1)/ncols(D) = O(1) over the relevant D range, so the per-degree
        cost jump is a bounded constant rather than a superpolynomial factor.
      rigorous_support: >-
        Rigorous for the pure boolean lattice, where the ratio is
        1 + C(n,D+1)/ncols(D) <= 1 + C(n,D+1)/C(n,D) = 1 + (n-D)/(D+1) <= n+1.
        Heuristic for the block-structured chained systems, whose column counts
        are recorded in committed artifacts (156,520 and 174,031 appear in the
        synthesis) and whose ratio must be read from those artifacts rather than
        assumed.
      validation_plan: >-
        Stage 1 reads consecutive-degree column counts directly from the
        committed artifacts at every available cell and reports the empirical
        ratio; stage 2 recomputes it on the self-built ladder. If the ratio is
        not O(1) - if it grows with n at fixed D - the "quantized by a bounded
        factor" reading fails and the record must be restated with the measured
        growth.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS PROPOSED OR MOVED. The quantity this record governs
      is the DECOMPOSITION-ORACLE cost D_trial that appears in the ICEX
      threshold, and it governs it only in the sense of saying which measured
      quantity maps to it. The mapping is: D_trial = Theta(ncols(d_solve)^omega)
      field operations, quantized in d_solve. The record makes NO claim about
      the VALUE of d_solve for any prime-field system, and therefore no claim
      about whether index calculus beats anything.
    memory_exponent: >-
      Theta(ncols(d_solve)^2) field elements for a dense reduction, or
      Theta(nnz) for a sparse one - and the record notes that NO committed SDEG,
      DREG or SIG artifact charges Macaulay memory at all, which
      IDEA-20260805-e732ed independently records for the crypto-scale headline.
      Memory is quantized in d_solve by the same argument, with jump factor
      J(n,D)^{2/omega}.
    best_known: >-
      Pollard rho at 0.886*sqrt(N) group operations, O(1) memory, remains the
      ECDLP baseline and is untouched. BSGS at (N^{1/2}, N^{1/2}). Against the
      memory-matched baseline derived in IDEA-20260806-3b91c7 the bar is
      sqrt(N/B) rather than sqrt(N); this record does not depend on that
      correction but any threshold it feeds should carry it.
    hidden_overhead: >-
      The row-reduction constant is not 1 and is not stated in any committed
      artifact; omega = 2 is not achievable; degree falls can move d_solve down
      by an unmodelled amount; and the boolean-versus-prime-field gap means
      every number here is about a system that is not the one RQ-SDEG-001 asks
      about. All four are disclosed rather than absorbed into o(1).
    tradeoff_note: >-
      There is a real time-memory tradeoff inside the solve (dense versus
      sparse reduction, block Wiedemann versus Gaussian elimination) and it is
      NOT charged by any record in these three goals. It is named here as an
      open item rather than modelled, because modelling it without measuring
      the matrices' actual sparsity would be exactly the kind of free-parameter
      cost model this batch exists to avoid.

  dominated_by: >-
    n/a (no algorithmic result claimed) - and the frontier was nonetheless
    checked row by row before writing that, because this record feeds a cost
    threshold. TIME: Pollard rho 0.886*sqrt(N); BSGS N^{1/2}; the memory-matched
    generic baseline sqrt(N/S) derived in IDEA-20260806-3b91c7. MEMORY: rho at
    O(1); BSGS at N^{1/2}. DATA/QUERIES: both query-free. PREPROCESSING:
    S*T^2 = Omega~(N) (KN-TECH-005). MULTI-TARGET: sqrt(T*N)
    (IDEA-20260731-013). This record occupies NO point on any of those axes: it
    proposes no algorithm, solves no instance, and produces no cost number for
    any attack. It produces a MAPPING from a measured quantity to a cost, and a
    mapping is not a Pareto point. No row was left as an unchecked null.
  sota_delta: >-
    ZERO on every ECDLP attack axis. Quantitatively the deliverable is: an exact
    jump table J(n,D) with J(12,5) = 2.505, J(12,6) = 1.731, J(12,7) = 1.322 at
    omega = 2 - values NOT MONOTONE in D and BELOW the intuitive expectation at
    the goal's own decisive cell; a rank-saving factor of 0.9546 at the
    committed 7,110 deficit, i.e. a 4.5 per cent cost REDUCTION with the
    opposite sign to the one the deficit records imply; a one-bit deliverable
    (sol(D)) replacing a three-significant-figure one (the deficit) for three
    blocked goals; and, if sol never flips, an argued statement that further
    deficit characterisation cannot change any ICEX threshold - which is a
    deadlock exit costing one reading pass and one afternoon of exact
    arithmetic.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.97 that stage 0's J table is correct, since it is binomial arithmetic.
    0.80 that the graded sweep confirms a step-function d_solve - not higher,
    because degree falls in a real solver could smear the step, and because the
    planted-deficit constructions (row duplication) may not be representative of
    how the committed systems are deficient. 0.65 that stage 1 finds sol(6) =
    TRUE at the committed n=12 cell, i.e. that the 7,110 is cost-free; the
    synthesis's "rank is far below ncols - |V| = 174,031" supports it but I did
    not open EV-SIG-008 and the third input may not be recorded at all. 0.45
    that the committed artifacts contain all three inputs needed to compute
    sol(D) - and if they do not, that absence is the most useful thing this
    record produces.

