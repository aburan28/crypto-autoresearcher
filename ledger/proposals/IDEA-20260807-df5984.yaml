idea:
  id: IDEA-20260807-df5984
  question_id: RQ-PAIR-21313f
  added: '2026-08-07'
  title: >-
    THE ONE-POINT ESCAPE TAXONOMY - classify every publicly computable map out
    of the cryptographic subgroup that needs only ONE point, by the mathematical
    object it factors through (End(E), divisors, the formal group, Galois
    cohomology, a change of base field), show that four of the five classes
    collapse to exactly two known escapes (N | Phi_k(p) with k small, and
    N = p), record WHY each collapses, and leave the fifth class explicitly
    unclassified rather than declared empty - the point being to ask, with a
    structural spine rather than a list, whether CM supplies a third escape, and
    to answer NO with a reason instead of a tally
  class: mechanism

  claim: >-
    (A) THE QUESTION IN ITS GENERAL FORM. A non-generic attack on ECDLP that
    needs only the public data (E, p, P, Q) and ONE point is, structurally, an
    efficiently computable map psi from G into some group H in which the DLP is
    easier, satisfying psi([x]P) = x . psi(P) in H's operation. Every known
    non-generic prime-field attack has this shape. So the honest way to ask
    "does CM supply a self-pairing computable from one point" is to ask what
    such maps can factor through at all.

    (B) THE FIVE CLASSES, AND THE FOUR COLLAPSES.
    CLASS I - psi factors through End(E). CLOSED. G has prime order, so
    End(G) = Z/N and every endomorphism acts as a scalar (H-ENDO-001); the
    endomorphism-image oracle is generic-group simulable (KN-FIND-b7e091,
    EV-GGM-79e710, DEC-20260804-3b4258). CM contributes exactly here and
    nowhere else, which is already the answer to the lane's headline question.
    CLASS II - psi factors through divisors and functions on E, i.e. a pairing.
    COLLAPSES TO ONE ESCAPE. Bilinearity needs a second argument. With only
    one point the argument must be P itself, and IDEA-20260807-30868b shows the
    self-pairing is trivial unless p = 1 mod N. So Class II yields exactly the
    small-embedding-degree escape N | Phi_k(p), and its one-point sub-case is
    k = 1.
    CLASS III - psi factors through the formal group / a p-adic lift. COLLAPSES
    TO ONE ESCAPE. The formal logarithm is defined on the kernel of reduction,
    and [N]P lands there only when N = p - the anomalous case, where
    Smart / Satoh-Araki / Semaev give a polynomial-time additive transfer
    (KN-TECH-033). For N not equal to p the lift ambiguity covers all of Z/N and
    the channel is exactly closed - which the catalogue's A4-3 proposes to
    measure and which this record cites rather than duplicates.
    CLASS IV - psi factors through Galois cohomology / descent. COLLAPSES INTO
    CLASS II, AND THIS IS THE OBSERVATION MOST WORTH RECORDING. Over a finite
    field, Lang's theorem gives H^1(Gal(F_p-bar/F_p), E) = 0 for the connected
    group E, so the descent map E(F_p)/N.E(F_p) -> H^1(Gal, E[N]) is an
    isomorphism onto E[N]/(pi - 1)E[N]. That target is precisely the second
    argument of the Tate-Lichtenbaum pairing. So descent over a finite field
    supplies no map that the Tate pairing does not already supply, and Class IV
    yields nothing new. Over a NUMBER FIELD the same construction is the engine
    of descent and is not vacuous - which is why this collapse is a statement
    about finite fields specifically, and is worth stating rather than assuming.
    CLASS V - psi factors through a change of base field (cover, Weil
    restriction, GHS). VACUOUS OVER F_p. The mechanism needs a proper subfield
    to shrink into and F_p has none; the exponent identity
    e(n, g) = (2 - 2/g)/n gives e >= 1 > 1/2 at n = 1 (catalogue A4-4, unrun).
    CLASS VI - UNCLASSIFIED. Anything not factoring through any of the above.
    NOT declared empty. Named candidates that this record cannot place -
    correspondences on E x E that are not graphs of endomorphisms; maps into
    abelian varieties that are not Jacobians of curves; the elliptic-net
    recurrence, which KN-FIND-b7e091 records as non-simulable but not usefully
    invertible (Oracle B); and anything using the Weierstrass coefficients as
    integers rather than as field elements.

    (C) THE ANSWER TO THE LANE'S QUESTION, WITH A REASON. CM structure
    contributes to Class I and to nothing else - a CM endomorphism is an
    endomorphism. It does not enlarge Class II (the embedding degree is
    independent of every CM datum, IDEA-20260807-653dda), it does not enlarge
    Class III (N = p is a trace condition, not a CM one), and it collapses in
    Class IV with everything else. So there is no CM-specific third escape among
    the four classified classes, and the residual is Class VI, which is stated
    as open. THAT IS THE DIFFERENCE BETWEEN THIS RECORD AND A FATIGUE REPORT -
    it names the obstruction per class, and it names what remains.

    (D) WHY THE TWO SURVIVING ESCAPES LOOK ALIKE, WHICH IS A HYPOTHESIS AND NOT
    A THEOREM. Both surviving conditions are divisibility of N by a small-height
    polynomial evaluated at p - N | Phi_k(p) for small k, and N = p (which is
    N | p, the degenerate member of the same shape). Using the identity
    p = t - 1 (mod N) from IDEA-20260807-653dda, both become conditions on the
    TRACE - k = ord_N(t-1), and anomalous is t = 1. HYPOTHESIS TO TEST - every
    publicly computable one-point escape is a divisibility condition on a
    small-height integer polynomial in p (equivalently in t). If true, the
    search for a third escape becomes a search over small-height polynomials,
    which is finite and enumerable at any given height. If false, the
    counterexample IS the third escape. Both outcomes are deliverables and the
    record commits to reporting either.

  resource_label: >-
    Spans the taxonomy - R3 (Class I), R7 (Class II), R6 (Class III), R5 and R7
    (Class IV), R1 and R2 (Class V). The record itself consumes no resource; it
    is an audit of which resources can support a one-point map, and it is the
    L8 counterpart of lane L12's simulability audit.
  admissibility: admissible
  admissibility_argument: >-
    The audit is admissible because it asserts no attack. Its per-class verdicts
    are the interesting part - Class I is INADMISSIBLE by the campaign's own
    filter (H-ENDO-001, KN-FIND-b7e091), Classes II and III are ADMISSIBLE and
    non-empty but only on measure-zero curve families, Classes IV and V are
    admissible and empty over F_p, and Class VI is UNCLASSIFIED, which is
    neither admissible nor inadmissible until a candidate is named concretely
    enough to test. Recording an unclassified cell rather than forcing a verdict
    is deliberate - docs/inventor-protocol.md treats premature closure as a
    failure mode symmetric with overclaiming.

  discriminated_from:
    - >-
      KN-FIND-b7e091, which closes two specific oracle classes (incidence,
      endomorphism-image) by exhibiting simulators. That finding is Class I of
      this taxonomy plus one more; this record organises the space around it
      rather than re-deriving it, and cites it as the Class I verdict.
    - >-
      Lane L12 (RQ-GGMB-6eaabc), which audits whether each newly invented
      oracle is GGM-simulable. That is a per-oracle test; this is a
      per-STRUCTURE classification, and the two compose - a map in Class I is
      simulable, and a map in Class II or III is not, which is exactly why the
      surviving escapes are real attacks on their families.
    - >-
      ideas/catalogue-20260805/A4-transfers-lattice.md items A4-3 (the p-adic
      lift-ambiguity meter, Class III) and A4-4 (the base-field-shrinkage
      identity, Class V) and A4-9 (the channel enumeration C1-C6). A4-9 is the
      closest prior art - it enumerates REPRESENTATION CHANNELS by what data
      they read. This record enumerates by what mathematical object the map
      FACTORS THROUGH, which cuts the space differently and produces the Class
      IV collapse that A4-9 does not contain. Both are catalogue-only and unrun.
    - >-
      KN-TECH-032 (small k), KN-TECH-033 (anomalous), KN-TECH-034 (the
      transfer-family survey). Those describe the two surviving escapes; this
      record explains why there are two.
    - >-
      NOT the classical transfer. It contains the classical transfer as one cell
      of a table and asks what else could occupy the table.

  object_first_candidate:
    tracked_object: >-
      THE FACTORISATION TARGET of a one-point map - the mathematical object
      through which psi must factor - carried as a label in
      {End(E), divisors, formal group, Galois cohomology, base change,
      unclassified}.
    lossiness: >-
      Lossy - it discards the map, its cost, its success probability and its
      output group, retaining only which structure it passes through. It is not
      a change of coordinates - no map is recoverable from its label.
    propagation: >-
      Deterministic under COMPOSITION, which is the operation that acts on maps
      - the composite of a Class I map with a Class II map is Class II, because
      the endomorphism contributes only a scalar. That composition rule is what
      makes the label propagate, and it is the reason the taxonomy is
      predictive rather than descriptive - one can compute the class of a
      proposed hybrid without implementing it. What is discarded (the map's
      internals) is discarded compatibly with composition.
    survival_score: >-
      Survives every composition of classified maps. Dissolves the moment a
      candidate map does not factor through any listed object - which is exactly
      Class VI, and is why Class VI is recorded as a cell rather than as an
      omission. The taxonomy's honest depth is therefore "five classes deep,
      with the sixth undefined".

  mechanism: >-
    STEP 1 (zero compute) - write the five classes with the factorisation
    condition for each, and the composition rule.
    STEP 2 (zero compute) - write the four collapse arguments. Class I cites
    H-ENDO-001 and KN-FIND-b7e091. Class II cites IDEA-20260807-30868b. Class
    III cites KN-TECH-033 and states the lift-ambiguity obstruction. Class IV is
    the one requiring new work here - state Lang's theorem, derive
    H^1(Gal, E[N]) = E[N]/(pi-1)E[N], and identify it with the Tate pairing's
    second argument. Class V cites the n = 1 exponent identity.
    STEP 3 (zero compute) - the residual. Enumerate Class VI candidates
    explicitly and, for each, apply the lossy-projection test - does the
    candidate define a genuinely lossy projection whose discarded part is
    discarded compatibly with the group law? A candidate failing that test is
    dropped WITHOUT measurement and the reason recorded; a candidate passing it
    becomes a successor proposal with its own record. THIS IS THE STEP THAT
    MAKES THE RECORD FORWARD-LOOKING RATHER THAN AN OBITUARY.
    STEP 4 (zero compute) - the small-height hypothesis of (D). Enumerate all
    integer polynomials f of degree at most 4 and coefficients at most 4 in
    absolute value, evaluate the condition N | f(p) under the substitution
    p = t - 1 mod N, and check which of them can hold for a curve with
    N | #E(F_p) - i.e. which are consistent with the Hasse bound. This is a
    finite symbolic enumeration costing nothing, and its output is either "only
    the known two" (supporting the hypothesis) or a third candidate condition,
    which would be the single most valuable output of this lane.
    STEP 5 (low compute) - for any third condition surviving Step 4, search toy
    p for a curve satisfying it and ask whether an attack follows. A condition
    that is satisfiable but supports no attack is itself informative and must be
    reported as such rather than quietly dropped.

  novelty_status: unverified
  novelty_screen:
    method: >-
      Run 2026-08-07. Internal grep over ledger/, knowledge/, docs/, analysis/,
      ideas/ for "taxonomy", "transfer", "anomalous", "Weil descent", "Lang's
      theorem", "Galois cohomology", "H^1", "descent map". Reads of
      KN-FIND-b7e091, KN-TECH-032/033/034, and the A4 catalogue's object table
      and item A4-9.
    results: >-
      KN-TECH-034 surveys transfer families and cross-references KN-TECH-032 and
      KN-TECH-033, but organises by ATTACK rather than by factorisation target.
      A4-9's channel enumeration C1-C6 is the nearest prior art and is
      organised by what DATA a bridge reads. "Lang's theorem" and "Galois
      cohomology" return no hits in ledger/ or knowledge/; the Class IV collapse
      is not recorded anywhere in this repository.
      NO EXTERNAL LITERATURE SEARCH was performed for an existing classification
      of one-point transfers.
    verdict: >-
      UNVERIFIED, and deliberately so. The individual collapses are all standard
      or already recorded; the ORGANISATION may well exist in the literature
      (survey articles on ECDLP transfers are numerous) and this session did not
      check. Per agents/idea-generator.md, novelty is not claimed from memory.
      A Stage-0 literature pass is part of the design and a positive hit is an
      ingredient, not a disappointment. Additionally, KN-OPEN-019 records that
      this program has NO written object enumeration for the ECDLP, so the
      five-class table here is a SKETCH, not a taxonomy, and no closure in this
      record rests on it being complete.

  null_object_control: >-
    MANDATORY, and for a taxonomy the null is a NEARBY SETTING WHERE THE SAME
    CLASSIFICATION MUST GIVE A DIFFERENT ANSWER. Three are required.
    (i) NUMBER FIELDS - Class IV must be NON-vacuous over Q, where descent is
    the standard engine for computing Mordell-Weil ranks. A classification that
    also kills descent over number fields has mis-stated the Lang's-theorem step
    and is void.
    (ii) EXTENSION FIELDS F_{q^n} with n >= 3 - Class V must be NON-vacuous
    there, where GHS and cover attacks genuinely win. A classification that
    reports Class V empty for F_{q^3} proves too much.
    (iii) SUPERSINGULAR CURVES - Class I must be NON-vacuous there, since
    End is a quaternion order and distortion maps exist. A classification that
    reports Class I closed for supersingular curves has ignored the very fact
    that makes pairing-based cryptography possible.
    DECAY PARAMETER - the height bound in Step 4. As the polynomial degree and
    coefficient bound increase from (1,1) to (4,4), the number of admissible
    conditions must grow slowly and must reproduce the two known ones at the
    smallest heights. If the count explodes, the enumeration is not constraining
    anything and the hypothesis in (D) is vacuous - which is itself a reportable
    outcome and would mean the "small-height" framing is the wrong lens.

  assumptions:
    - >-
      [textbook, not transcribed here] Lang's theorem - H^1(F_q, G) = 0 for a
      connected algebraic group G over a finite field - and the resulting
      identification of E(F_q)/N.E(F_q) with E[N]/(pi - 1)E[N]. This is the one
      genuinely new ingredient in the record and it must be transcribed to
      knowledge/literature before Class IV is cited elsewhere. Marked [open]
      until then.
    - >-
      The definition of "publicly computable one-point map" excludes maps
      requiring the secret x, and excludes maps requiring a second point
      independent of P. Both exclusions are stated so a reviewer can contest the
      framing rather than the conclusions.
    - >-
      The composition rule "Class I composed with Class II is Class II" assumes
      the endomorphism acts as a scalar, which is H-ENDO-001 and holds only for
      prime-order G.
    - >-
      The five classes are a SKETCH per KN-OPEN-019. No claim of exhaustiveness
      is made, and Class VI exists precisely to carry that admission.

  proof_search_map:
    bottleneck: >-
      The Class IV collapse. It is the only step of the taxonomy not already
      recorded somewhere in this program, and it is the step that decides
      whether descent is a separate route or a repackaging of the Tate pairing.
      Everything else is citation and organisation.
    baseline_embedding:
      parameter_slice: >-
        The number-field slice for Class IV and the F_{q^3} slice for Class V.
        The classification must REPRODUCE the known positives there - descent
        works over Q, cover attacks work over F_{q^3} - from the same
        statements, with only the base field changed.
      reproduction_check: >-
        Symbolic. Substitute "number field" for "finite field" in the Class IV
        argument and observe that Lang's theorem is unavailable, so the collapse
        does not occur. Substitute n = 3 into e(n,g) = (2-2/g)/n and observe
        e = 4/9 < 1/2. Both are one-line checks and both must pass before the
        F_p verdicts are believed.
    observation_collision:
      observable: >-
        The class label assigned to a map.
      distinct_preimage_search: >-
        REQUIRED. Find two genuinely different maps with the same label - e.g.
        the Weil pairing and the Tate pairing are both Class II, and the MOV and
        Frey-Ruck attacks are different algorithms with the same factorisation
        target. That collision is expected and is what makes the label a
        classification rather than an identifier; it also bounds what the
        taxonomy can conclude, since two maps sharing a label may have very
        different costs. Any statement of the form "Class II is closed" must
        therefore be read as "closed as a source of NEW escapes", not as a cost
        claim.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the open-ended search "is there another one-point attack" by
          the finite question "which small-height integer polynomials f admit a
          curve with N | f(p) and N | #E(F_p)".
        predicted_gain: >-
          Converts an unbounded search into a finite symbolic enumeration
          costing zero compute, with a definite pass or fail at each height.
      - transform: observable_fiber
        proposed_object: >-
          The fibre of the class label - the set of all maps in a given class -
          examined for whether any member has a cost profile unlike the known
          representative.
        predicted_gain: >-
          Guards against the failure mode where a class is declared closed
          because its best-known member is weak, when a different member of the
          same class might not be.
    quantifier_order: >-
      Claimed - FORALL maps psi that factor through one of the five named
      objects, EXISTS a stated obstruction such that psi supplies no ECDLP
      advantage on ordinary prime-field curves outside the two named families.
      EXPLICITLY NOT CLAIMED - FORALL maps psi. The universal quantifier over
      all maps is exactly what Class VI withholds, and any summary that drops
      that qualifier is overclaiming.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Among one-point maps factoring through End(E), divisors, the formal
        group, finite-field Galois cohomology, or a change of base field, the
        only ones giving an ECDLP advantage over F_p are the small-embedding-
        degree transfer and the anomalous additive transfer." It can never
        certify anything about maps outside those five, about extension fields,
        or about the hardness of the ECDLP.
      nearby_object_control: >-
        The number field (Class IV lives) and F_{q^3} (Class V lives) and the
        supersingular curve (Class I lives). Three nearby objects where the
        conclusion must fail, and it must be SEEN to fail from the same
        statements.
    proof_obligations:
      - claim: Every endomorphism acts on G as a scalar.
        responsibility: correctness
      - claim: A one-point pairing is trivial unless p = 1 mod N.
        responsibility: correctness
      - claim: The formal logarithm channel is closed unless N = p.
        responsibility: correctness
      - claim: Lang's theorem collapses finite-field descent into the Tate pairing.
        responsibility: correctness
      - claim: F_p has no proper subfield, so Class V is vacuous.
        responsibility: strictness
      - claim: The three nearby-object controls each show a live class.
        responsibility: baseline
      - claim: Class VI is recorded as unclassified, not empty.
        responsibility: scope

  predictions:
    - metric: >-
        number of distinct one-point escape families surviving the five-class
        classification over F_p
      direction: different
      minimum_effect: >-
        Predicted EXACTLY TWO - small k and anomalous. THREE would be the most
        valuable single output of this lane and would be escalated immediately.
        ONE would mean one of the two known families has been mis-assigned and
        is decision-relevant as an error.
    - metric: >-
        number of small-height integer polynomials f (degree <= 4, coefficients
        <= 4) for which N | f(p) is simultaneously satisfiable with N | #E(F_p)
        and the Hasse bound
      direction: different
      minimum_effect: >-
        Reported as an exact count with the list. The two known conditions must
        appear in it; if they do not, the enumeration is mis-specified. Any
        THIRD entry becomes a successor proposal with its own record, whether or
        not an attack follows from it.
    - metric: >-
        number of Class VI candidates that pass the lossy-projection test
      direction: different
      minimum_effect: >-
        Reported as a count with a verdict per candidate. Predicted to be small
        (0 to 2 out of the four named). A candidate that passes is a concrete
        forward direction; one that fails is dropped with its algebraic reason
        recorded, at zero compute.
    - metric: >-
        behaviour of the three nearby-object controls
      direction: different
      minimum_effect: >-
        All three must show a LIVE class. Zero live classes means the argument
        proves too much and the record is void.

  minimal_test:
    design: >-
      ENTIRELY SYMBOLIC AND ZERO COMPUTE except for optional Step 5.
      STAGE 0 (hours): literature pass for an existing classification of ECDLP
      transfers; record whatever is found in knowledge/. STAGE 1 (hours): write
      the five classes and the composition rule. STAGE 2 (hours): the four
      collapse arguments, with Lang's theorem transcribed. STAGE 3 (HARD GATE,
      one hour): the three nearby-object controls - if any fails, stop and
      repair before writing any F_p verdict. STAGE 4 (hours): the small-height
      enumeration of (D), by hand or with sympy. STAGE 5 (optional, low
      compute): toy search for any third condition found.
    controls:
      - number-field control - Class IV must be live
      - F_{q^3} control - Class V must be live
      - supersingular control - Class I must be live
      - small-height enumeration must recover both known conditions at low height
      - lossy-projection test applied to every Class VI candidate before any measurement is proposed
    required_metrics:
      - the five-class table with a verdict and citation per cell
      - the composition rule, stated and checked on at least three composites
      - the small-height enumeration output, as an explicit list
      - per Class VI candidate - the lossy-projection verdict and its reason
      - pass or fail of each nearby-object control

  falsification_conditions:
    - >-
      Any nearby-object control failing - i.e. the argument also killing descent
      over number fields, or cover attacks over F_{q^3}, or distortion maps on
      supersingular curves. The classification proves too much and is void.
    - >-
      The small-height enumeration failing to recover the two known conditions.
      The enumeration is mis-specified; repair before any count is reported.
    - >-
      A third satisfiable condition appearing. The hypothesis in (D) survives
      but the taxonomy's "exactly two" prediction is refuted - which is the
      GOOD outcome and the one worth the most.
    - >-
      Lang's theorem being misapplied, so that Class IV does not in fact
      collapse. Then descent over finite fields is a separate route and the
      record's most novel step is wrong - decision-relevant, and the successor
      would be an examination of what that route yields.
    - >-
      A Class VI candidate passing the lossy-projection test with a definable
      one-step propagation. The taxonomy is incomplete in a specific, named way,
      and that candidate becomes the lane's forward direction.

  confounders:
    - >-
      Classification by convenience. It is easy to assign an awkward map to
      Class VI and declare the taxonomy complete over the other five. Every
      assignment must state the factorisation explicitly, and a map that
      plausibly fits two classes must be recorded in both.
    - >-
      Cost blindness. The taxonomy classifies EXISTENCE, not cost. Two maps in
      one class can differ by an exponent. No cost conclusion may be drawn from
      a class label, and the observation-collision search exists to make that
      limitation explicit.
    - >-
      Confusing "no third escape found" with "no third escape exists".
      KN-OPEN-019 says this program has no object enumeration for the ECDLP, so
      the table is a sketch. The record must carry that sentence in any summary.
    - >-
      The Lang's-theorem step is the one place where an error would be both easy
      to make and hard to notice, because the conclusion (nothing new) matches
      the expectation. It must be checked by someone who wants it to be wrong.

  interpretation_limits:
    - >-
      A classification, not a theorem about the ECDLP. It moves no exponent and
      makes no curve safer.
    - >-
      Scoped to ordinary curves over prime fields. The three nearby-object
      controls exist precisely to show how quickly the conclusions fail once
      that scope is left.
    - >-
      Class VI is unclassified, not empty, and any summary omitting that is
      overclaiming under docs/inventor-protocol.md's closure standard.
    - >-
      The small-height hypothesis in (D) is a HYPOTHESIS. Its confirmation at
      low height says nothing about high height, and the record must not be
      cited as bounding the space of possible attacks.

  reachability_gate: >-
    NOT A MOVE BETWEEN CURVES, but the taxonomy has a reachability consequence
    worth stating. The two surviving escapes are conditions on (N, p), hence on
    the trace, hence class invariants (IDEA-20260807-b92080) - so neither is
    reachable from a curve that does not already satisfy it, at any cost. A
    hypothetical third escape found in Step 4 would need its own reachability
    analysis, and the record pre-registers that requirement - a third condition
    that is also a function of (N, p) is unreachable for the same reason and
    would be a scope result rather than an attack, whereas one depending on j or
    on End(E) WOULD be reachable by walking and would be the campaign's most
    important finding. That dichotomy is stated in advance so it cannot be
    tuned afterwards.

  target_complexity:
    time_exponent: >-
      NO EXPONENT CLAIMED. Of the two surviving escapes - the small-k transfer
      is polynomial plus L_{p^k}(1/3), and the anomalous transfer is polynomial,
      O(log p) field operations. Both are known and neither is improved here. A
      hypothetical third escape would carry its own exponent claim in its own
      record.
    memory_exponent: >-
      O(1) for the taxonomy. For the surviving escapes - O(1) for anomalous,
      and the NFS factor-base memory for small k, chargeable under KN-TECH-035.
    best_known: >-
      Rho at 0.886 sqrt(N) with O(1) memory (KN-TECH-001, KN-TECH-006); BSGS
      (KN-TECH-031); MOV/Frey-Ruck for small k (KN-TECH-032); the anomalous
      additive transfer in polynomial time (KN-TECH-033).
    hidden_overhead: >-
      None claimed. The honest disclosure is structural rather than asymptotic -
      the taxonomy's completeness is what hides the risk, and Class VI is where
      it is hidden.
    tradeoff_note: >-
      Not applicable - no algorithm is produced.

  dominated_by: >-
    Every frontier row checked on time, memory and data. This record mounts no
    attack and is dominated by rho at 0.886 sqrt(N) with O(1) memory
    (KN-TECH-001, KN-TECH-006), by automorphism-discounted rho (KN-TECH-018),
    by BSGS (KN-TECH-031, KN-TECH-035), and on their own families by
    MOV/Frey-Ruck (KN-TECH-032) and the anomalous transfer (KN-TECH-033) - both
    of which it merely classifies. As a CLASSIFICATION it is dominated by any
    published survey of ECDLP transfers that organises the same way; whether one
    exists was NOT checked and is the Stage-0 obligation, which is why
    novelty_status is unverified rather than novel.
  sota_delta: >-
