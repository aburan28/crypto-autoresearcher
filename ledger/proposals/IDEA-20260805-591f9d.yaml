      entries carry citation_verified: read with zero backing artifacts, so a
      negative screen here says only what this corpus does not hold.

  parameters_assumed:
    provenance: >-
      RECALLED-UNVERIFIED, WITH ONE PARTIAL CORROBORATION. This program has not
      read the FIPS 204 body: KN-LIT-4dadec records the standard's bibliographic
      identity as confirmed and its body as NOT READ, and DEC-20260805-0d59ff
      gate 1 permits ideation on that basis while forbidding an experiment that
      claims to test a FIPS 204 parameter set until the body is obtained. The
      table below is model memory. It is CORROBORATED IN PART, not confirmed,
      by two independent internal checks: (a) the sibling records
      IDEA-20260805-bb52fa and H-MLDSA-2d4123 (RQ-MLDSA-ffa0f5, a different
      goal) quote gamma2 = 95232 / 261888 and tau = 39 / 49 / 60 and
      d = 13 and derive tau*2^(d-1) = 159744 / 200704 / 245760, matching this
      table exactly; (b) the challenge-space sizes this table forces,
      log2 |B_tau| = 192.760 / 225.345 / 257.015, reproduce the widely quoted
      "at least 2^192 / 2^225 / 2^257" to within a bit, which is a nontrivial
      consistency check on tau and on the ring degree simultaneously.
      NOTE FOR THE COORDINATOR, RAISED NOT RESOLVED: the sibling records cite
      "FIPS 204 Table 1" while the corpus's own FIPS 204 entry records the body
      as unread. That inconsistency is reported here and is NOT repaired by this
      proposal, which edits nothing.
    common: {q: 8380417, n: 256, d: 13}
    ML-DSA-44: {k: 4, l: 4, eta: 2, tau: 39, beta_taueta: 78, gamma1: 131072, gamma2: 95232, omega: 80}
    ML-DSA-65: {k: 6, l: 5, eta: 4, tau: 49, beta_taueta: 196, gamma1: 524288, gamma2: 261888, omega: 55}
    ML-DSA-87: {k: 8, l: 7, eta: 2, tau: 60, beta_taueta: 120, gamma1: 524288, gamma2: 261888, omega: 75}

  lossy_projection_identifiability_audit:
    projection: >-
      (full ML-DSA instance: A, t, message stream, secret s1, s2)
      --> (q, lattice rank n*(k+l), log2 volume n*k*log2 q, log2 zeta)
      -- the four-number "lattice shape" of the SelfTargetMSIS instance.
    what_is_discarded: >-
      A, t, the secret, the hash function, the message, the challenge set's
      combinatorial structure, and the self-consistency constraint
      c = H(mu, ...) entirely.
    why_genuinely_lossy: >-
      Severely lossy: the fibre over an observed shape contains every instance
      with the same (k, l, q, zeta), which is all of them at a fixed parameter
      set. Nothing about A or the secret is recoverable from the shape.
    why_compatible_with_the_operations: >-
      Compatible by construction with the operation the projection is FOR:
      lattice reduction under the root-Hermite-factor model is a function of the
      shape alone, which is the modelling assumption the whole published cost
      convention already makes. The projection is therefore exactly as valid as
      the estimate being audited -- which is the point, since auditing the
      estimate on its own terms is the only way a discrepancy is attributable to
      the estimate rather than to the auditor's different model.
    is_it_only_a_change_of_coordinates: >-
      NO, and the check was run in both directions. FORWARD (the char-2
      (Delta, Pi) = (x xor y, x*y) failure, where nothing is discarded because
      the pair is recoverable as the roots of t^2 + Delta t + Pi): not this
      failure -- A has n*k*l*log2 q bits and the shape has four integers, so the
      map is not invertible even in principle. MIRROR FAILURE (a projection so
      lossy it is constant across instances, zero comparator spread): CHECKED
      AND IT IS THE ONE THAT NEARLY BITES. The shape IS constant across
      instances at a fixed parameter set -- that is why this proposal makes no
      instance-level claim whatsoever. The comparator spread this proposal
      relies on is spread ACROSS PARAMETER SETS and ACROSS THE THREE TERMS OF
      zeta, not across instances: six shapes (three sets x {d = 13, d = 0}) with
      six distinct log2 zeta values 18.418 / 17.539 / 19.466 / 18.999 / 19.554 /
      18.999. That is a real, nonzero, pre-derived spread, and the null object
      below is designed so that its spread is forced to zero. If the measured
      block sizes came out identical across all six shapes, the instrument
      would be constant and the audit would report an instrument failure rather
      than a result.

  proof_search_map_ref: H-MLDSA-12f563

  assumptions:
    - >-
      The parameter table in parameters_assumed. If it is wrong, every number
      here is wrong; Stage 0 of the paired experiment exists to replace it with
      a sourced table and the record carries the substituted values rather than
      being silently reinterpreted.
    - >-
      That the SelfTargetMSIS norm budget in the standard is
      max(gamma1 - beta, 2*gamma2 + 1 + 2^(d-1)*tau) or a variant differing by
      a small additive constant. RECALLED-UNVERIFIED. A different bound changes
      the numbers but not the decomposition, since the compression term
      2^(d-1)*tau is forced by the exact inequality in mechanism (2).
    - >-
      That the published concrete estimate for SelfTargetMSIS is obtained by
      running a lattice cost model at the bound zeta. THIS IS THE ASSUMPTION
      MOST LIKELY TO BE FALSE and its falsity is a useful outcome: if the
      published number comes from somewhere else entirely, locating where is
      the answer to the goal's question.

  predictions:
    - metric: >-
        zeta_check: the three integers max(gamma1 - beta,
        2*gamma2 + 1 + 2^(d-1)*tau) recomputed in-harness from the Stage-0
        sourced parameter table
      direction: different
      minimum_effect: >-
        EXACTLY 350209 / 724481 / 769537, pre-registered before any in-harness
        run. Any deviation means the Stage-0 table differs from
        parameters_assumed and every downstream number is recomputed and
        relabelled rather than reconciled.
    - metric: >-
        compression_share = 2^(d-1)*tau / zeta, per parameter set
      direction: different
      minimum_effect: >-
        EXACTLY 0.4561 / 0.2770 / 0.3193 (to four places). The pre-registered
        interpretation, fixed here: a share above 0.25 at every set means the
        compression term is not a rounding detail of the budget.
    - metric: >-
        zeta_over_q, the triviality gate
      direction: lower
      minimum_effect: >-
        Strictly below 1 at every set; pre-registered values 0.04179 / 0.08645 /
        0.09183. A value at or above 1 would make the lattice arm vacuous and
        would terminate the audit with that as its entire result.
    - metric: >-
        calibration_gap = |beta_instrument(published parameter set) -
        beta_published|, ML-DSA-44, MSIS arm
      direction: lower
      minimum_effect: >-
        The GATE is <= 10. The SCOUT-COMPUTED value of the same quantity under
        the naive criterion is about 355 (778 vs a recalled 423), which FAILS
        the gate by a factor of 35. The pre-registered expectation is therefore
        that the gate FAILS ON FIRST ATTEMPT and that reconciling the convention
        is the work. A pass on first attempt would mean the recalled published
        beta is wrong instead, which is equally reportable.
    - metric: >-
        Delta_bits = core-SVP bits at zeta_0 (d = 0) minus core-SVP bits at
        zeta (d = 13), per parameter set, computed ONLY after the calibration
        gate passes
      direction: higher
      minimum_effect: >-
        Strictly positive at every parameter set -- the SIGN is forced by the
        monotonicity argument in mechanism (4) and a non-positive value refutes
        the instrument, not the standard. NO MAGNITUDE IS PRE-REGISTERED,
        because the SCOUT-COMPUTED magnitudes (37.1 / 28.0 / 47.0 bits) come
        from the uncalibrated instrument and pre-registering them would be
        pre-registering an artifact. The magnitude is reported with its
        convention attached and with the calibration residual stated beside it.
    - metric: >-
        monotonicity of beta in the graded zeta ladder (>= 3 interior points)
      direction: lower
      minimum_effect: >-
        beta must be strictly non-increasing along the ladder zeta_0 < zeta_1 <
        ... < zeta_5 (mechanism (4)). A single inversion is an instrument
        failure and blocks all reporting.

  minimal_test:
    design: >-
      Four stages, ordered cheapest-first; Stages 0, 1 and 2 can each terminate
      the whole line. STAGE 0 (reading; zero compute): obtain a parameter table
      from a source this program can actually read, record the source and its
      provenance class, and diff it against parameters_assumed. STAGE 1 (exact
      integer arithmetic; seconds): recompute zeta, the three term shares, the
      triviality gate, and log2 |B_tau|. STAGE 2, THE DECISIVE ONE (one
      transcendental function; seconds): the CALIBRATION GATE -- reproduce a
      published block size for MLWE and for MSIS at ML-DSA-44 to within 10.
      IF STAGE 2 FAILS, STOP: report the convention discrepancy, with the exact
      criterion, the exact subdimension range, and the boundary-optimum
      diagnostic, as the batch's deliverable. Do not compute an attribution
      table on an instrument that cannot find its own baseline. STAGE 3 (only
      after Stage 2 passes): the graded zeta ladder and the attribution table.
    controls:
      - >-
        NULL OBJECT (same shape, forced value derived pre-run, CAN FAIL):
        the d = 0 instance -- identical (q, k, l, n), identical criterion, only
        the compression term removed. Its forced value is
        Delta_bits(d = 0 vs d = 0) = EXACTLY 0. Running the whole attribution
        pipeline on a pair of identical shapes must return exactly zero. If it
        returns anything else, the pipeline has a term that does not come from
        zeta and every attribution number is void. This can fail: a rounding
        convention applied asymmetrically, or an inadvertent dependence on the
        loop's iteration order, produces a nonzero answer here.
      - >-
        POSITIVE CONTROL / NEARBY OBJECT (the effect MUST appear; if it does
        not, the instrument is broken and NO negative may be reported):
        reproduce, to within 10 in beta, the published block sizes for the MLWE
        arm and the MSIS arm at ML-DSA-44 under the source's own stated
        convention. This is the inventor protocol's baseline-reproduction audit
        and it is the gate, not a formality: the SCOUT-COMPUTED pass already
        misses it by about 355.
      - >-
        GRADED CONTROL, >= 3 interior points, monotonicity reported:
        zeta_j = 2^(d_j - 1)*tau + 2*gamma2 + 1 for d_j in {0, 4, 7, 10, 13}
        at ML-DSA-44, five points spanning the full compression range. Report
        beta(zeta_j) and require strict non-increase. This localises the effect:
        if beta is flat across the ladder the block size is insensitive to the
        norm budget at these dimensions and the attribution is real but
        negligible -- a specific, reportable conclusion, not "it did not work".
      - >-
        CONSTANT-INSTRUMENT CHECK (the mirror-failure tell). Report the spread
        of beta across the six shapes. Zero spread means the projection is
        constant and the audit measured the apparatus rather than the object;
        that outcome is reported as an instrument finding and terminates the
        line.
      - >-
        ARCHIVE CHECK (zero compute): list every prior measurement of the same
        observable in this corpus. Result recorded in advance: NONE. There is no
        MLDSA experiment, no MLDSA evidence record, and no block-size
        computation for any ML-DSA parameter set anywhere in ledger/ or
        experiments/. That absence is recorded as an absence, not claimed as a
        passed check, and AGENTS.md's retrieval policy applies: absence of a
        search result is not evidence that nothing was tried.
    required_metrics:
      - the Stage-0 parameter table with its source and provenance class per row
      - zeta, the three term values, and the term shares, as exact integers
      - the exact criterion used for beta, including the subdimension range and whether the optimum was interior or on the boundary
      - beta and core-SVP bits for MLWE, MSIS and the zeta ladder, per parameter set
      - the calibration residual against the published beta, reported whether or not the gate passed

  falsification_conditions:
    - >-
      The Stage-0 sourced parameter table contradicts parameters_assumed. Every
      number in this record is then withdrawn and recomputed in a superseding
      record; nothing is reinterpreted in place.
    - >-
      The SelfTargetMSIS norm bound in the primary text is not of the stated
      form and contains no term proportional to 2^(d-1)*tau. The compression
      attribution then has no object and the proposal is dead as written.
    - >-
      Delta_bits comes out non-positive at any parameter set. The monotonicity
      argument is elementary, so this falsifies the INSTRUMENT and blocks all
      reporting until it is repaired.
    - >-
      beta is flat (spread <= 1) across the five-point graded ladder. The norm
      budget then does not drive the block size at these dimensions, the
      attribution is quantitatively empty, and the honest deliverable is that
      statement with its measured flatness.
    - >-
      The positive control fails and cannot be repaired within budget. No
      negative result of any kind may then be reported (inventor protocol,
      controls before belief); the deliverable is the convention discrepancy
      alone.

  confounders:
    - >-
      CONVENTION DRIFT, THE DOMINANT ONE. Infinity-norm versus Euclidean-norm
      criteria, "core-SVP" versus gate-count versus AT-cost models, and
      free-versus-bounded subdimension all move beta by amounts comparable to
      or larger than the effect. The SCOUT-COMPUTED 355-in-beta discrepancy is
      this confounder in its most visible form. Mitigation: one convention,
      named, applied identically to every arm, with the calibration residual
      published beside every number.
    - >-
      RECALLED PARAMETERS. Corroborated in part (see parameters_assumed) but
      not read. A single wrong entry -- gamma2's divisor, or d -- moves the
      compression share substantially.
    - >-
      RECALLED BASELINE. The "published beta about 423" is itself
      RECALLED-UNVERIFIED. The calibration gate may fail because the BASELINE is
      wrong rather than the instrument. Both directions are reported; neither is
      assumed.
    - >-
      ATTRIBUTION IS NOT CAUSATION IN A DESIGN. Even a large Delta_bits does not
      show the designers were unaware of it or that the parameter choice is
      wrong; a designer may knowingly spend lattice-side floor to buy public-key
      size. The record must state the number and refuse the inference.

  interpretation_limits:
    - >-
      NO ATTACK, NO FORGERY, NO KEY RECOVERY, NO EXPONENT. This is a cost-model
      attribution. Nothing here makes any instance easier to solve.
    - >-
      A computed Delta_bits is a statement about the LATTICE-SIDE FLOOR of
      SelfTargetMSIS under one named convention. It is not a statement about
      ML-DSA's security, which also rests on MLWE and on the hash arm
      (IDEA-20260805-5194f9), and it may not be quoted as one.
    - >-
      CLAIM TIER. The arithmetic runs at the real parameter sets, so the
      integers are not toy. But the CONVENTION is inherited and unvalidated, so
      no bit count leaves this line above the tier the calibration gate
      supports, and if that gate fails no bit count leaves it at all.
    - >-
      NOTHING HERE BEARS ON GOAL-MLDSA-002. That goal owns t0 secrecy and the
      Algorithm 7 rejection predicates. This proposal never reconstructs t0,
      never measures a leak rate, and never touches a rejection predicate; it
      uses only the bound ||t0||_inf <= 2^(d-1), which is a definitional
      consequence of Power2Round.

  heuristic_assumptions:
    - id: HEUR-ZETA-1
      statement: >-
        For a q-ary module lattice of rank n*(k+l) and volume q^(n*k), the least
        BKZ block size b that produces a vector of infinity-norm at most zeta is
        the least b such that min over admissible subdimensions m of
        delta(b)^m * q^(n*k/m) <= zeta, with
        delta(b) = ((b/(2*pi*e)) * (pi*b)^(1/b))^(1/(2*(b-1))).
      rigorous_support: >-
        NONE CLAIMED, and this is the load-bearing weakness of the proposal
        rather than a footnote. The root-Hermite-factor form is the standard
        heuristic in the lattice-estimation literature (RECALLED-UNVERIFIED; no
        source has been read by this program) and it is a HEURISTIC about the
        output length of BKZ, not a theorem. It is used here because it is the
        convention being audited: an audit that substituted a different model
        would attribute its own discrepancy to the model rather than to the
        estimate.
      validation_plan: >-
        The calibration gate IS this heuristic's test at the only place it
        matters. Reproduce published block sizes for MLWE and MSIS at ML-DSA-44
        to within 10. The SCOUT-COMPUTED pass fails that test by about 355 in
        beta and additionally lands its subdimension optimum on the boundary at
        every b, which is a second, independent tell. Until both are resolved,
        HEUR-ZETA-1 as instantiated here is REFUTED at ML-DSA parameters, and
        that refutation is the proposal's first deliverable.
    - id: HEUR-ZETA-2
      statement: >-
        Core-SVP cost is 2^(0.292*b) classical, 2^(0.265*b) quantum, with sieve
        memory 2^(0.2075*b), uniformly in b.
      rigorous_support: >-
        RECALLED-UNVERIFIED constants attributed in memory to the
        sieving-complexity literature. Not read. Load-bearing only for the
        conversion of Delta_beta into Delta_bits; the SIGN of every claim in
        this proposal is independent of these constants because they are
        monotone in b.
      validation_plan: >-
        Report Delta_beta as the primary quantity and Delta_bits as a derived
        one with the constant printed alongside, so a later correction to the
        constant rescales the table without invalidating it.

  target_complexity:
    time_exponent: >-
      n/a for this audit -- NO EXPONENT IS MOVED AND NONE IS CLAIMED. Stated
      plainly as the generation contract requires: this proposal moves no
      exponent. It is worth running because the goal's first completion
      criterion is an ATTRIBUTION question ("which of the three binds"), not an
      exponent question, and because the calibration finding gates every later
      exponent statement this goal might make.
    memory_exponent: >-
      Not moved. Reported as 0.2075*b beside every time figure, because
      docs/claims-and-verification.md requires memory stated beside time and
      because the hash-arm comparison in IDEA-20260805-5194f9 turns on exactly
      that column.
    best_known: >-
      The published concrete estimates for MLWE, MSIS and SelfTargetMSIS at the
      three approved parameter sets. NOT READ by this program; obtaining them is
      Stage 0.
    hidden_overhead: >-
      Everything hidden in the root-Hermite heuristic and in the core-SVP
      constants, i.e. the entire gap between a block size and a running time.
      This audit does not close that gap and does not pretend to.
    tradeoff_note: >-
      The time-memory tradeoff of the lattice arm is the subject of the sibling
      proposal IDEA-20260805-5194f9 and is deliberately not duplicated here.

  dominated_by: null
  dominated_by_check: >-
    NULL IS CLAIMED ONLY AFTER LISTING WHAT WAS CHECKED, as the inventor
    protocol requires. This proposal claims no attack, so it occupies no point
    on any attack frontier; "dominated_by: null" here means "no prior result
    supplies this attribution", not "this beats the frontier". Checked, on
    2026-08-05, for a prior per-term attribution of the SelfTargetMSIS norm
    budget or a d = 0 counterfactual: (1) TIME axis -- ledger/proposals
    (IDEA-20260801-008 is the only prior MLDSA proposal on RQ-MLDSA-001 and
    contains no decomposition, no forced value and no calibration gate);
    (2) MEMORY axis -- knowledge/techniques KN-TECH-035 / -044 / -050 / -057
    (Wiener AT-cost family) and KN-OPEN-017, none of which mention ML-DSA;
    (3) DATA / QUERY axis -- not applicable, the audit consumes no signatures
    and issues no oracle queries; (4) the five BATCH-001 KN-LIT entries
    (KN-LIT-4dadec / -340675 / -4f3b80 / -180ad5 / -8ce0b5), four of which are
    implementation-level and the fifth of which has an unread body;
    (5) the sibling goal's records (IDEA-20260805-630606 / -031ce2 / -bb52fa,
    H-MLDSA-2ae88d / -2d4123), which share the ||<<c t0>>||_inf <= tau*2^(d-1)
    inequality but apply it to conformance and t0 secrecy, never to a norm
    budget or a block size. Absence of a result in this corpus is not evidence
    that no such attribution exists in the literature; the corpus's own
    KN-OPEN-3f7a21 records that its novelty screens see far less than they
    appear to.
  sota_delta: >-
    QUANTITATIVE, AND IT IS NOT AN ATTACK DELTA. Two numbers. (1) The
    attribution: Delta_bits, the classical core-SVP bits of SelfTargetMSIS
    lattice-side floor attributable to the public-key compression term, per
    parameter set -- currently UNKNOWN in this corpus and unknown to this
    proposal, with an uncalibrated SCOUT-COMPUTED placeholder of 37.1 / 28.0 /
    47.0 bits that is expected to be wrong. (2) The calibration: the
    instrument-versus-baseline residual in beta, SCOUT-COMPUTED at about 355 at
    ML-DSA-44, roughly 104 bits of core-SVP. Number (2) is larger than number
    (1) and is why it is reported first.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.80 that the audit produces a defensible per-term attribution table with a
    named convention within the campaign budget. NOT HIGHER, because the
    calibration gate has already failed once in a SCOUT-COMPUTED pass by about
    355 in beta, because no primary text has been read, because the parameter
    table is recalled, and because reconciling a cost convention against a
    document one cannot obtain may simply not be possible under
    GOAL-MLDSA-001's second pause condition. NOT LOWER, because every step is
    exact integer arithmetic plus one transcendental function, because the
    decomposition of zeta is an identity that cannot fail, because the
    triviality gate and the term shares are already computed and need only
    re-running in-harness, and because the FAILURE mode is itself a deliverable:
    "the standard convention and the naive criterion differ by 355 in beta at
    ML-DSA-44, so no published-versus-rederived comparison in this program is
    currently meaningful" is a result the goal's first completion criterion
    needs before it can be met. Separately: 0.15 that Delta_bits turns out large
    enough (say above 20 bits under the reconciled convention) to be worth a
    knowledge entry, and 0.05 that the reconciliation exposes an error in a
    published estimate rather than in this instrument -- the prior on the latter
    is low and is stated low on purpose.
