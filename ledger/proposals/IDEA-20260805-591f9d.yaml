      - >-
        No block-size or core-SVP computation for any ML-DSA parameter set
        exists in ledger/ or experiments/.
      - >-
        The bound ||<<c t0>>||_inf <= tau*2^(d-1) appears in the sibling goal's
        IDEA-20260805-bb52fa and H-MLDSA-2d4123 (RQ-MLDSA-ffa0f5), applied to
        Algorithm 7 conformance rather than to a norm budget or a block size.
    conclusion: >-
      Measurement/audit proposal. The decomposition of zeta is elementary and is
      certainly known to the scheme's designers; the claim of newness is
      restricted to the per-term ATTRIBUTION AS A BIT COUNT, the d = 0
      counterfactual, and the calibration finding -- none of which this corpus
      contains. UNVERIFIED against the external literature, and deliberately
