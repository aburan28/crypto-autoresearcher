      - ledger/hypotheses
      - ledger/evidence
      - ledger/goals
      - knowledge/literature
      - knowledge/techniques
      - knowledge/open-problems
      - experiments
    grep_results:
      - >-
        No MLDSA experiment, hypothesis on RQ-MLDSA-001, or evidence record
