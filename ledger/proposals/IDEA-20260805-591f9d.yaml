idea:
  id: IDEA-20260805-591f9d
  question_id: RQ-MLDSA-001
  goal_id: GOAL-MLDSA-001
  added: '2026-08-05'
  title: >-
    zeta-attribution: SelfTargetMSIS's norm budget is 45.6 per cent public-key
    COMPRESSION at ML-DSA-44, not signature geometry, so the sentence "this
    compression is an optimization for performance, not security" has a
    computable price in BKZ block size -- and the first thing the computation
    finds is that this program's own instrument is off by ~355 in beta against
    the recalled published value, which is the finding that has to come first
  class: measurement

  claim: >-
    SelfTargetMSIS at ML-DSA parameters is an inhomogeneous short-vector
    problem whose entire difficulty on the lattice side is set by ONE number,
    the solution's permitted infinity-norm zeta, and zeta is a SUM OF THREE
    STRUCTURALLY DIFFERENT TERMS that no record in this corpus has ever
    separated:
      zeta = max( gamma1 - beta ,  2*gamma2 + 1 + 2^(d-1)*tau ).
    The first argument is the signature's own norm bound. The second is the
    sum of a rounding term (2*gamma2 + 1, from the hint/HighBits machinery) and
    a COMPRESSION term (2^(d-1)*tau, from discarding the low d bits of t).
    SCOUT-COMPUTED on the parameter table stated below (pure-Python exact
    integer arithmetic, this session, outside the harness -- RE-RUN IN-HARNESS
    BEFORE CITING): zeta = 350209 / 724481 / 769537 at ML-DSA-44 / -65 / -87;
    the compression term alone is 159744 / 200704 / 245760, i.e. 45.6 / 27.7 /
    31.9 per cent of zeta; and setting d = 0 (no compression at all) would drop
    zeta to 190465 / 524092 / 524168, a factor 0.544 / 0.723 / 0.681.
    THE CLAIM IS THAT THIS FACTOR HAS A PRICE IN BITS AND THAT THE PRICE IS
    COMPUTABLE WITHOUT ANY LATTICE SOFTWARE. It is not a break, not an attack,
    and not a criticism of the standard: a few bits of lattice-side floor may be
    exactly what the designers intended to spend. What this program can say, and
    has not said, is HOW MANY BITS, at each approved parameter set, under a
    named cost convention.
    SECOND, AND THIS IS WHAT ACTUALLY GATES THE WORK: the same SCOUT-COMPUTED
    pass, run with the textbook root-Hermite-factor criterion
    min_m delta(b)^m * q^(n*k/m) <= zeta, returns b = 778 for ML-DSA-44 against
    a RECALLED-UNVERIFIED published block size of roughly 423 -- a gap of about
    355 in beta, roughly 104 bits of classical core-SVP. At b = 423 that same
    criterion can only reach vectors of length 2^22.79, which is about q, i.e.
    trivial. The two numbers are therefore NOT measuring the same thing, and
    every "which of the three binds" statement that mixes them is void. The
    cheapest decisive deliverable in this proposal is not the attribution table.
    It is the convention reconciliation that has to happen before the
    attribution table means anything.

  object_first_candidate:
    tracked_object: >-
      The scalar infinity-norm budget zeta of an admissible SelfTargetMSIS
      solution, followed as a decomposed quantity -- (signature term, rounding
      term, compression term) -- from the FIPS 204 verification inequality,
      through the definition of the SelfTargetMSIS instance, into the
      root-Hermite-factor condition, and out as a BKZ block size and a
      core-SVP bit count. The object is a NORM BUDGET, not an algorithm and not
      a lattice: what is tracked is how much slack the verifier grants an
      adversary and where each unit of that slack comes from.
    established_families_off_limits: >-
      OFF-LIMITS as the primary lens for this proposal: (1) new lattice
      reduction or sieving algorithms of any kind -- no BKZ variant, no dual
      attack, no hybrid MITM; (2) decryption-failure / rejection-sampling
      statistical attacks; (3) side-channel and fault injection (that is
      IDEA-20260805-818196's lane and AGENTS.md rule 7 forbids scoring it as a
      mathematical break); (4) algebraic-structure attacks on cyclotomic rings
      (subfield, PIP, Galois); (5) nonce-leakage / HNP transfer from ECDSA,
      which KN-LIT-056 already records as blocked by rejection sampling. This
      proposal deliberately uses ONLY the published cost model and elementary
      integer arithmetic, because the object under audit IS the published cost
      model.
    newness_score: >-
      The decomposition of zeta is elementary and its terms are written in the
      scheme's own definition; a designer who wrote the definition necessarily
      knows them. What is not present ANYWHERE in this corpus -- checked against
      knowledge/literature, knowledge/techniques, ledger/proposals, and the two
      MLDSA goals -- is (a) the per-term attribution as a bit count, (b) the
      d = 0 counterfactual, and (c) the observation that the compression
      parameter d, the subject of FIPS 204 Section 6.1's "not security"
      sentence, is the single largest contributor to the SelfTargetMSIS norm
      budget at ML-DSA-44. IDEA-20260801-008, the only prior proposal on this
      question, proposes a "full-cost metrical audit" of SelfTargetMSIS but
      names no decomposition, no forced value, no null object and no
      calibration gate; this proposal is its sharpened successor and says so.
    testability_score: >-
      Maximal and nearly free. Every quantity above is exact integer arithmetic
      on a parameter table; the block-size step is one transcendental function
      and a one-dimensional minimisation over an integer subdimension. No
      lattice library, no numpy, no solver. The environment check run this
      session records numpy 2.4.6 present and sympy / fpylll / Sage / gmpy2
      ABSENT; nothing here needs any of them.
    survival_score: >-
      The decomposition survives trivially -- it is an identity. What may not
      survive is the INTERPRETATION: if the reconciled convention turns out to
      make the lattice arm's block size insensitive to a factor-1.8 change in
      zeta (because beta is logarithmically slow in the target length), the
      attribution is real but worth a handful of bits, and the honest result is
      "the compression costs about X bits of SelfTargetMSIS floor, X small",
      which is a quantified version of the standard's own sentence rather than
      a contradiction of it. That outcome is anticipated and is still the
      deliverable.

  mechanism: >-
    DERIVED HERE. Every parameter value is labelled; nothing is asserted from a
    document this program has read, because it has read none of them (see
    parameters_assumed).

    (1) THE OBJECT. ML-DSA's UF-CMA argument (Kiltz-Lyubashevsky-Schaffner,
    RECALLED-UNVERIFIED) reduces to MLWE plus a scheme-specific problem,
    SelfTargetMSIS: given A in R_q^{k x l} and the public key t, find a message
    digest mu and a short vector y = (z ; -c ; s) with ||y||_inf <= zeta such
    that c = H(mu, [A | t | I] y). R_q = Z_q[X]/(X^256 + 1), q = 8380417. The
    norm budget zeta is fixed by what the VERIFIER accepts, and the verifier
    accepts three separate slacks.

    (2) THE DECOMPOSITION, WHICH IS AN IDENTITY. Verification checks
    ||z||_inf < gamma1 - beta and recomputes w1 from A z - c * t1 * 2^d, where
    t1 is the HIGH part of t and the discarded low part t0 satisfies
    ||t0||_inf <= 2^(d-1). The forgery vector's coordinates are therefore
    bounded by: gamma1 - beta on the z block; 2*gamma2 + 1 on the block that
    absorbs the rounding/hint slack; and 2^(d-1)*tau on the block that absorbs
    <<c t0>>, because c has exactly tau nonzero coefficients each in {-1, +1},
    so each coefficient of c*t0 is a signed sum of exactly tau terms each of
    magnitude at most 2^(d-1). Hence
      zeta = max( gamma1 - beta , 2*gamma2 + 1 + 2^(d-1)*tau ).
    The bound ||<<c t0>>||_inf <= tau * 2^(d-1) is EXACT and unconditional; the
    sibling record IDEA-20260805-bb52fa derives the identical inequality in the
    other MLDSA goal for a different purpose, which is independent corroboration
    of the arithmetic and not of the parameter values.

    (3) THE FORCED VALUES, SCOUT-COMPUTED THIS SESSION.
      ML-DSA-44: gamma1 - beta = 130994 ; 2*gamma2 + 1 = 190465 ;
                 2^12 * tau = 159744 ; zeta = 350209 ; zeta/q = 0.04179.
      ML-DSA-65: 524092 ; 523777 ; 200704 ; zeta = 724481 ; zeta/q = 0.08645.
      ML-DSA-87: 524168 ; 523777 ; 245760 ; zeta = 769537 ; zeta/q = 0.09183.
    Compression share of zeta: 0.4561 / 0.2770 / 0.3193.
    d = 0 counterfactual: zeta_0 = 190465 / 524092 / 524168, ratio to zeta of
    0.5439 / 0.7234 / 0.6811.
    A FIRST, TRIVIAL, BUT MANDATORY GATE: zeta < q at every set (0.042 to 0.092
    of q). Had any zeta reached q the problem would be satisfiable by the
    vector (q, 0, ..., 0) and the lattice arm would be vacuous. It is not. This
    gate costs three comparisons and it is recorded because a gate that passes
    is still a gate, and because a proposal that did not check it would be
    asserting hardness it had not looked at.

    (4) THE PRICE OF THE COMPRESSION TERM. Under any cost model of the form
    "cost = f(beta) with f monotone increasing, where beta is the least block
    size whose root-Hermite factor delta(beta) satisfies
    min_m delta^m * q^(n*k/m) <= zeta", the map zeta -> beta is monotone
    DECREASING. Therefore zeta_0 < zeta forces beta(zeta_0) >= beta(zeta), and
    the compression term can only ever REDUCE the lattice-side floor, never
    raise it. The sign of the effect is a theorem; only the magnitude is
    empirical. Delta_bits := f(beta(zeta_0)) - f(beta(zeta)) is the number this
    proposal exists to produce, per parameter set, with its convention named.

    (5) THE CALIBRATION PROBLEM, WHICH IS THE REAL FINDING AND WHICH IS
    REPORTED BEFORE ANY ATTRIBUTION. Instantiating (4) with the textbook forms
      delta(b) = ( (b/(2*pi*e)) * (pi*b)^(1/b) )^(1/(2*(b-1)))   [RECALLED]
      classical core-SVP = 2^(0.292*b), quantum = 2^(0.265*b),
      sieve memory = 2^(0.2075*b)                                 [RECALLED]
    and taking the lattice rank as n*(k+l) with volume q^(n*k), a SCOUT-COMPUTED
    pass returns b(zeta) = 778 / 1182 / 1688 and b(zeta_0) = 905 / 1278 / 1849,
    i.e. Delta_beta = 127 / 96 / 161 and Delta_bits = 37.1 / 28.0 / 47.0 under
    0.292*b. THOSE NUMBERS ARE NOT TO BE BELIEVED AND ARE PRE-REGISTERED HERE
    PRECISELY SO THAT THEY CAN BE SHOWN TO BE WRONG. The recalled published
    block size for ML-DSA-44 is about 423 (RECALLED-UNVERIFIED); at b = 423 the
    same criterion reaches only length 2^22.79, which is approximately q, i.e.
    the criterion is satisfied trivially and cannot be the one the published
    number uses. Furthermore the internal minimisation over the subdimension m
    lands on the BOUNDARY m = n*(k+l) at every b tested, a standard tell that
    the admissible range of m is mis-stated. AT LEAST ONE OF {the parameter
    table, the recalled published beta, the criterion's norm convention
    (infinity vs Euclidean), the lattice rank/volume assignment} IS WRONG, and
    the audit's first job is to find out which. Reporting an attribution table
    on an instrument that misses its own baseline by 355 in beta would be the
    exact failure the inventor protocol's baseline-reproduction audit exists to
    catch.

    (6) WHY THE ATTRIBUTION IS WORTH HAVING EVEN IF Delta_bits IS SMALL. The
    compression parameter d is the subject of an explicit sentence in the
    standard -- "this compression is an optimization for performance, not
    security" -- which GOAL-MLDSA-002 audits from the SECRECY side (what t0
    leaks). This proposal audits it from the ASSUMPTION side (what discarding
    t0 costs the SelfTargetMSIS norm budget). The two are different objects
    reached from the same sentence, and neither goal's records connect them.
    The connection is stated here and the boundary is respected: nothing in this
    proposal measures a leak rate, reconstructs t0, or touches Algorithm 7's
    rejection predicates.

  novelty_status: unverified
  novelty_screen:
