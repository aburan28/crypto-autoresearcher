    memory: O(Nd) frozen features or O(d) streaming arm moments
    data_or_queries: 8N signer or simulator invocations across all required arms
    preprocessing: Freeze sites, transform, coordinate transport, deltas, parser, strata, and thresholds
    oracle: Two declared opposite additive faults with no side-channel or secret output
    verification: O(N) standard verification plus independent coordinate-transport and residual replay
  proof_search_map:
    exact_baseline_reproduction: Reproduce exact same-site cancellation and zero interaction on a frozen linear-transform fixture.
    observation_collision_search: Search coordinate mismatch, wraparound, rejection conditioning, and instrumentation overwrite for the same residual.
    quantifier_order: For every fixed toy implementation, site pair, transform, coordinate transport, deltas, feature map, and N, probability is over preregistered messages and seeds.
    method_ceiling: Can certify only nonadditive public propagation between the two chosen sites.
    nearby_object_control: Apply the pair around an explicitly linear toy transform and to a proven-dead coordinate.
