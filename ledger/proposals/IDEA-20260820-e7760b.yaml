idea:
  id: IDEA-20260820-e7760b
  question_id: RQ-SQISIGN-001
  added: '2026-08-20'
  title: Paired cancelling faults as a probe of nonlinear public-transcript propagation
  class: mechanism
  claim: >-
    For a fixed toy implementation, two equal-and-opposite additive faults placed
    on either side of an intervening signing transformation can cancel in a linear
    dataflow but leave a second-order public-transcript residual when normalization,
    rejection, or representation selection is nonlinear. The proposal tests this
    causal distinction and claims no timing channel, recovery, forgery, or SSI result.
  mechanism: >-
    Define O_cancel(s1,s2,i,delta) to add delta to coordinate i immediately before
    transformation F at s1 and add -delta to the corresponding coordinate at s2.
    A genuinely linear, coordinate-consistent path gives F(x+delta)-delta = F(x)
    for the registered representation; nonlinear normalization, branching, or
    acceptance can instead produce an interaction residual. Compare the paired
    fault arm to no fault, each single fault, a same-site immediate cancellation,
    a dead-coordinate pair, and a planted quadratic response in published fields.
  novelty_status: unverified
  status: proposed
  source_refs:
    - {id: RQ-SQISIGN-001, provenance: internal, verified_by: TASK-20260820-922be8}
    - {id: KN-TECH-057, provenance: internal, verified_by: TASK-20260820-922be8}
