  novelty_screen:
    method: >-
      Screened the exact 28-record current RQ-SQISIGN-001 inventory, including
      single-coordinate faults, pathwise divergence, cancellation/hybrid arguments,
      canonicalization, public strata, and acceptance-fibre proposals.
    results: >-
      The closest fault record uses one additive coordinate intervention. This
      candidate uses an equal-and-opposite pair as a causal linearity control and
      measures the interaction residual after an intervening transformation.
    verdict: Unverified; persistent knowledge search and primary-source retrieval were unavailable.
  object_first_candidate:
    tracked_object: Public interaction residual of a two-fault composition relative to the two single-fault arms.
    lossiness: Public fields may erase the intermediate nonlinearity; a null covers only the selected sites and coordinate transport.
    propagation: Normalization, rejection, or representative selection between s1 and s2 can turn cancelling algebraic inputs into a noncancelling public outcome.
    survival_score: A preregistered difference-in-differences residual survives opposite delta signs and held-out messages, while immediate-cancel and dead-coordinate controls remain null.
  predictions:
    - metric: public-feature interaction residual R = mu_pair - mu_plus - mu_minus + mu_null
      direction: different
      minimum_effect: standardized norm >= 0.10 with simultaneous 95% lower bound above 0.05
    - metric: held-out classifier AUC for paired separated cancellation versus immediate cancellation
      direction: higher
      minimum_effect: AUC >= 0.60 with 95% lower bound above 0.55
    - metric: true-simulator and dead-coordinate residuals
      direction: different
      minimum_effect: remain inside central 95% permutation bands
  minimal_test:
    design: >-
      Freeze s1, intervening F, s2, coordinate transport, and deltas plus/minus d.
      Generate no-fault, first-only, second-only, separated cancel pair, same-site
      immediate cancel, dead-coordinate pair, genuine simulator, and planted
      quadratic-response arms. Retain rejection explicitly and blind arm labels.
    controls:
      - Genuine true-simulator no-fault null of identical public shape.
      - Same-site +delta then -delta immediate-cancellation null.
      - Paired faults on a proven-dead coordinate.
      - Both single-fault arms for difference-in-differences accounting.
      - Planted public response proportional to a registered delta-squared feature.
    required_metrics: [interaction_residual, pair_AUC, rejection_rate, verifier_strata, plant_power]
  controls:
    - Delta signs swapped across held-out seed blocks.
    - Coordinate-transport identity checked before interpreting cancellation.
    - Plant amplitude swept continuously to zero.
    - No timing, retry, length, power, cache, or branch trace.
  falsification_conditions:
    - Separated paired cancellation stays in every registered null band while the quadratic plant has power >= 0.90.
    - Immediate-cancel or dead-coordinate controls show an equal or larger interaction residual.
    - Incorrect coordinate transport, omitted rejection, or simulator miscalibration invalidates the test.
  confounders:
    - The two coordinate labels may not denote the same transported algebraic component.
    - Saturation or field wraparound can mimic nonlinearity if delta is too large.
    - Acceptance conditioning can create an interaction unless all arms include rejection.
    - Instrumentation order can make the second fault overwrite rather than cancel the first.
  interpretation_limits:
    - A residual localizes a nonlinear propagation boundary but does not reveal secret information.
    - A null does not establish global linearity or cover other site pairs.
    - The oracle is active and implementation-specific.
    - GOAL-SSI-001 and SQIsign-002 Kani claims are excluded.
  fault_oracle:
    name: O_cancel
    intervention: Add delta at s1 and transported -delta at s2 around one named transformation.
    exposed: Published transcript, explicit rejection, parsing, and standard verification only.
    excluded: [time, retry_count, signature_length, intermediate_value, secret, power, cache, branch_trace]
  heuristic_assumptions:
    - id: H1
      statement: The registered coordinate transport makes the two perturbations algebraic inverses on a linear nearby-object path.
      rigorous_support: Exactly checkable on the same-site identity and a frozen linear toy transform.
      validation_plan: Reproduce exact immediate cancellation and a separate linear-transform fixture before the live boundary.
    - id: H2
      statement: The public interaction statistic detects a second-order residual of the declared minimum magnitude.
      rigorous_support: Guaranteed only for the planted quadratic-response generator.
      validation_plan: Sweep plant amplitude and delta magnitude, requiring decay to null as either goes to zero.
  target_complexity:
    time_exponent: null
    memory_exponent: null
    best_known: Not a solver; KN-TECH-058 records unconditional Fp2 p^(1/2)(log p)^O(1) time with polynomial memory and a p^(1/3+o(1)) time-and-memory tier conditional on Heuristic 1.
    hidden_overhead: Difference-in-differences feature testing is O(Nd); the conditional SSI tier hides superpolynomial overhead and has no concrete-performance conclusion.
    tradeoff_note: More fault arms raise constants and data cost without changing cryptanalytic exponents. Reduction inheritance is unverified and no GRH claim is made.
  cost_model:
