idea:
  id: IDEA-20260904-e12b5a
  added: '2026-09-04'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-SATIC-1ae57a
  title: >-
    Gaussian elimination is inert on the pdp CNF-XOR model for a derivable
    reason - under the block core order NO parity row has a determined variable
    before depth (m-1)l - and the two orders that would wake it up each cost
    more than log2(m!) bits, which is the exact condition under which GE would
    start to help

  class: mechanism

  claim: >-
    SCOPE: symmetrized S_{m+1} pdp over F_{2^n} descended to F_2, CNF-XOR model
    of SRC-SATIC-TRIMOSKA-2019 section 3.2; m = 3 primarily, m = 4 as a check;
    l in 6..8. CLAIM TIER toy. NO ATTACK, NO EXPONENT IMPROVEMENT.

    (A) THE DERIVABLE PART - A STRUCTURAL STATEMENT, NOT A HEURISTIC. In the
    CNF-XOR model, the elementary-symmetric variables satisfy
    d_{1,j} = c_{1,j} XOR c_{2,j} XOR ... XOR c_{m,j} (equation (6) of the
    source), so d_{1,j} depends on ALL m blocks; and every substituted monomial
    of degree >= 2 arising from e_2, ..., e_m is a product of c-variables drawn
    from DISTINCT blocks, so it too depends on at least two blocks. Under the
    block branching order that the source's symmetry-breaking algorithm REQUIRES
    (leading bit of x_1 through trailing bit of x_m, section 4), it follows
    that:
      A1. No d_{i,j} variable is determined before depth (m-1)l + 1.
      A2. No E-substitution variable d' (a product of d's) is determined before
          depth (m-1)l + 1.
      A3. Every F-set parity row - the ONLY rows carrying the curve, since they
          are the Weil-descended coefficients of S'_{m+1} - is over d and d'
          variables alone, hence has ALL of its variables undetermined for every
          depth <= (m-1)l.
      A4. Therefore Gaussian / Gauss-Jordan elimination over the XOR rows can
          produce NO implied literal and NO earlier conflict at any depth
          <= (m-1)l, and the E-X-relation rows it can act on are precisely the
          rows unit propagation already handles one at a time.
    At m = 3 that is two thirds of the tree depth in which GE is provably inert
    by construction, and the remaining third is where the whole search happens.

    (B) THE QUANTITATIVE PART. Define the LINEAR DEFICIT at depth d,
        L(d) = (#variables occurring in XOR rows that are still undetermined
                after unit propagation at depth d) - rank(XOR rows restricted to
                those variables).
    A Gauss-Jordan step yields an implied literal only when some row has exactly
    one undetermined variable, which requires L(d) to have collapsed on that
    row. The claim is that L(d) stays large: at depth 0 in the source's l = 6,
    n = 19 cell there are 52 xor rows over a model with 767 variables (Table 1),
    of which 18 are core c-variables and 33 are d-variables, leaving 716
    substitution variables, so L(0) >= 767 - 52 - 1 = 714. The predicted curve
    is L(d) > 0 for all d < ml - O(1), with a single sharp collapse in the last
    block. GE's total yield over a whole run - the GE SURPLUS, defined as
    (literals implied by Gauss-Jordan) minus (literals implied by plain XOR unit
    propagation on the same state) - is predicted to be 0 at more than 99% of
    nodes.

    (C) THE PREDICTION OF WHEN GE WOULD START TO HELP. Two levers change A1-A3,
    and each has a stated price:
      L1  ORDER. Under a BIT-INTERLEAVED core order (c_{1,0}, c_{2,0}, ...,
          c_{m,0}, c_{1,1}, ...), d_{1,j} is determined at depth m(j+1), so the
          first d-variable is determined at depth m instead of (m-1)l + 1, and
          F-set rows can become unit far up the tree. PREDICTION: GE surplus
          becomes strictly positive at depths < ml under the interleaved order
          and remains 0 under the block order, at the same cell, on the same
          instance. THE PRICE, EXACT: the source states its m! symmetry
          algorithm is correct ONLY under the block order, so the interleaved
          order forfeits log2(m!) = 2.585 bits at m = 3 and 4.585 at m = 4.
          THEREFORE GE HELPS IF AND ONLY IF it reduces the leaf count by more
          than a factor m! (plus its per-node cost). The frozen source's own
          Table 4 puts GE's conflict reduction at 0.16%-3.4% across its cells,
          which is a factor 1.0016-1.035 - between 170x and 3700x short of the
          factor 6 it would need at m = 3. That is a falsifiable prediction with
          a stated margin, not a verdict.
      L2  DEGREE. Multiply the F-set equations by core-variable monomials and
          re-linearize (the XL step), adding rows without adding columns as
          fast. The XOR row/column ratio rho(D) = rows(D)/cols(D) then rises
          with the re-linearization degree D, and GE becomes productive at the
          first D with rho(D) >= 1 - which is exactly the Macaulay saturation
          degree of the model. PREDICTION: GE surplus is 0 for every D below
          that crossing and strictly positive at or above it. THE PRICE:
          cols(D) grows like sum_{j<=D} C(ml, j), so the memory the CNF-XOR
          model exists to avoid comes straight back; the crossover degree and
          its column count are computable at ZERO COMPUTE by the same
          block-incidence counting H-DREG-152cff performs for the chained
          model, and the first deliverable of this idea is that number.

    (D) THE MONOTONE TREND THAT MAKES THE MECHANISM TESTABLE WITHOUT ANY GE
    IMPLEMENTATION. rho(D=1) = (#xor rows)/(#model variables) is computable from
    the model alone: using Table 1 of the frozen source it is 52/767 = 0.0678 at
    l = 6, 62/1101 = 0.0563 at l = 7, 68/1510 = 0.0450 at l = 8, 88/2000 =
    0.0440 at l = 9, 104/2577 = 0.0404 at l = 10 and 122/3247 = 0.0376 at
    l = 11 - DECREASING in l. PREDICTION: GE's usefulness on this model DECAYS
    with l, so both the GE surplus and the GE conflict reduction are
    monotonically decreasing in l. This is the reverse of the usual expectation
    that parity reasoning matters more as parity constraints accumulate, and it
    is the reason the model that makes the pdp cheap is the same model that
    makes GE useless.

  mechanism: >-
    WHY THE MODEL DEFEATS ITS OWN PARITY MODULE. The CNF-XOR model buys its
    minimality - ml core variables and a few thousand clauses instead of tens of
    thousands - by REPLACING every nonlinear monomial with a fresh variable and
    a Tseitin AND gate (equation (8) of the source). The XOR module sees only
    the parity rows; it does NOT see the AND gates, so from its point of view
    every substitution variable is a free variable algebraically independent of
    the core. The parity system it is asked to eliminate on is therefore a wide,
    massively underdetermined GF(2) system: 52 rows over hundreds of formally
    free columns at l = 6. Gauss-Jordan on such a system is a no-op with a cost.
    The information that would make it productive - that c' equals a product of
    c's - lives entirely in the CNF part, exactly where GE cannot use it.

    This is the same phenomenon the authors themselves point at when they write
    that "in some cases Gaussian Elimination on SAT instances does not work as
    well as Gaussian Elimination on algebraic systems" (arXiv:2001.11229
    abstract), and it is why their solver reads ANF directly. What this record
    adds is the exact reason IN THIS MODEL (A1-A3, derived from equation (6) and
    the block order), a measurable quantity for it (the GE surplus as a function
    of depth), and a stated condition under which it reverses (C).

    THE LOSSY-PROJECTION TEST. The tracked object is the LINEARIZATION STATE:
    the pair (number of XOR-occurring variables still undetermined, rank of the
    XOR row space restricted to them), i.e. L(d) together with the rank. It is
    genuinely lossy - it discards which variables are undetermined, their
    values, the entire CNF part, the AND-gate structure, and the assignment
    trail; the fibre over one (deficit, rank) pair contains an enormous set of
    solver states. The discarding is COMPATIBLE with the target's operations
    because assigning one variable acts on this projection deterministically:
    it deletes exactly one column and moves it to the right-hand side, so the
    rank drops by 0 or 1 and the undetermined count drops by exactly 1 plus
    however many variables unit propagation then forces - and unit propagation's
    effect on the projection is itself determined by which rows became unit,
    which is a function of the retained data. So the retained part propagates
    deterministically under decide/propagate/backtrack, which is what the test
    requires.

    Contrast the projection that FAILS the test and must not be used as the
    object: "the XOR coefficient matrix itself". It loses nothing about the
    parity constraints, is merely a change of basis on them, and answers no
    question the constraints do not already answer. The interesting content is
    exactly the DEFICIT - the gap between what the matrix could determine and
    what it does determine - which is only visible after the lossy step.

  novelty_status: unverified

