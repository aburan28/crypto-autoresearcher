# IDEA-20261003-108ab2
# Endomorphism-degree count. Proposal only. Not approved.
idea:
  id: IDEA-20261003-108ab2
  question_id: RQ-JINV-8fc13a
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    Multiplication by 2 has degree 4 and multiplication by 1 has degree 1
  class: measurement
  claim: >-
    Multiplication by 2 has degree 4. Multiplication by 1 has degree
    1. Four exceeds one by 3. The product of the two degrees is 4.
    Their sum is 5. Two times two is 4, which matches the larger
    degree. The gap is a map degree, not an ECDLP exponent.
  mechanism: >-
    OBJECT FRAME. R3 is the endomorphism. The operation set is
    composition of that map with itself. The degree of multiplication
    by 2 is the square of 2. The degree of multiplication by 1 is 1.
    Two copies of multiplication by 1 both have degree 1, so that
    gap is 0. No point is multiplied.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question treats End(E) as a ring and asks for any
        advantage beyond the automorphism discount.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-RHO-0528e7
      provenance: internal
      claim: >-
        The automorphism square-root factor is a different object
        from these two degrees.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The two degrees are frozen before the subtraction.
    - No point is multiplied.
  proof_search_map:
    bottleneck: The degree gap 3.
    baseline_embedding:
      parameter_slice: The degrees 4 and 1.
      reproduction_check: >-
        Two readers subtract and must agree that 4 exceeds 1 by 3,
        and that 2 squared is 4.
    observation_collision:
      observable: The degree gap and the square 4.
      distinct_preimage_search: >-
        Reporting both degrees as 1 drops the gap. Two copies of
        multiplication by 1 make that gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The degrees 4 and 1.
        predicted_gain: Integer gap. No multiplication of a point.
    quantifier_order: >-
      The degrees are fixed before the gap.
    method_ceiling:
      strongest_certifiable_claim: >-
        The degree gap 3. Not a scalar multiplication.
      nearby_object_control: >-
        Two copies of multiplication by 1. Both have degree 1, and
        the gap is 0.
    proof_obligations:
      - claim: Multiplication by 2 has degree 4.
        responsibility: size
      - claim: Multiplication by 1 has degree 1.
        responsibility: size
      - claim: Two squared is 4.
        responsibility: correctness
    not_applicable_reason: null
  predictions:
    - metric: degree_gap
      direction: different
      minimum_effect: Four exceeds one by 3.
  minimal_test:
    design: >-
      Subtract the two frozen degrees and square 2. Do not multiply
      a curve point.
    controls:
      - Two copies of degree 1, whose gap is 0.
      - An independent count.
    required_metrics:
      - both degrees
      - the gap
      - the square of 2
  falsification_conditions:
    - The gap is not 3.
    - Two squared is not 4.
  confounders:
    - The degree of a rational map on the affine chart can drop at the point at infinity.
  interpretation_limits:
    - A map degree is not a walk length.
    - No transfer to a cryptographic scalar.
    - This is not a ring-rank count.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen degree of multiplication by 2 is 4 and the frozen
        degree of multiplication by 1 is 1.
      rigorous_support: >-
        No endomorphism theorem is re-proved here. The count is a
        reading of two degrees, and 2 squared is integer arithmetic.
      validation_plan: >-
        Two independent readings. A mismatch voids the gap.
  target_complexity:
