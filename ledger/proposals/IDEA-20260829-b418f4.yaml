idea:
  id: IDEA-20260829-b418f4
  question_id: RQ-SYMF-5ab172
  title: >-
    Test whether "exactly matched" is annotator-invariant by comparing the
    PARTITION induced by the producer's committed comparison keys against the
    partition induced by the red team's committed blind re-encoding of the same
    SHA-1 results, then against a prospective third independent encoding
  class: measurement
  claim: >-
    The comparison key is the frontier's entire comparability instrument - the
    schema permits a dominance comparison only when all 14 dominance_domain_key
    fields are identical - and the key's field values are free text chosen by
    the encoding agent, because schema v2 enumerates an allowed value set for
    ZERO of its 11 comparison_key fields while enumerating one for
    allowed_null_reason (5 values), verification_states (5), and
    canonical_dispositions (5). The claim is that the equivalence relation the
    key induces on published results is therefore NOT a property of the
    literature but partly a property of the encoder, and that the committed
    corpus already contains the evidence, because BATCH-303ce8 contains two
    INDEPENDENT encodings of the same SHA-1 results - the producer's
    (TASK-20260825-51dfe7, compiled into knowledge/frontiers/symmetric-cryptanalysis.yaml)
    and the red team's sealed blind rederivation (TASK-20260825-9eda3a).
    Specifically - (Q1) over the SHA-1 rows the red team itself lists as
    headline-matching, the raw string agreement rate on the comparison-key
    fields both encodings populate is at most 0.60; (Q2, HEADLINE) the two
    induced partitions of the SHA-1 result space CROSS - neither is a
    refinement of the other, i.e. there exist two results the producer places
    in one cell that the blind encoder separates AND two results the producer
    separates that the blind encoder merges; (Q3) in a prospective third blind
    encoding of a declared 8-row sample by an independent session working from
    the same primary sources under the committed schema, the fraction of rows
    whose full 11-field comparison key reproduces the committed key exactly is
    at most 0.50. STRUCTURAL COROLLARY THAT NEEDS NO NUMBERS - the schema's
    own sha1_required_partition declares 8 cells for SHA-1, while the red
    team's independently derived schema_partition_result declares 6, and the
    blind arm produced a full-round GENERIC preimage baseline row for which the
    schema's 8-cell partition has no cell at all. Two competent encoders,
    working from the same papers under the same program, did not agree on how
    many cells SHA-1 has.
  mechanism: >-
    TRACKED OBJECT. The object followed through the computation is the
    PARTITION that an encoding induces on a set of published results - the
    equivalence relation "same comparison key", stripped of the labels that
    name its cells. One-step propagation is defined and cheaply measurable - an
    encoding decision on one field either splits a cell or does not, so a
    single field's value change moves the partition one step in the refinement
    lattice, and the observable at each step is which pairs are co-celled.
    LOSSY-PROJECTION TEST (algebraic, no compute). The projection
    encoding -> induced partition discards every label - the strings
    "offline_computation" and "offline", "full" and "full_round",
    "theoretical_attack" and "theoretical_expected_cost_with_implemented_components"
    are all forgotten, along with every cost, every method field and every
    provenance field. It is strictly, massively lossy - any bijective
    relabelling of the vocabulary maps to the same partition, so the fibre over
    a partition is infinite. The discard is compatible with the operation the
    target performs, because schema v2's dominance gate consumes ONLY the
    equality test on keys - it never reads a key's content, only whether two
    keys coincide. Hence the retained part (the equivalence relation) is
    exactly and only what propagates deterministically through dominance. This
    is a clean pass - not a change of coordinates, because the partition cannot
    reconstruct the labels, and not a repackaging of the key, because the
    committed schema records a key HASH per row and no relation between rows.
    WHY THE COMMITTED CORPUS IS A NATURAL EXPERIMENT. The red team's blind
    rederivation is sealed (sealed_at 2026-08-26T01:46:50Z,
    pre_comparison_sha256 49a9c7c3...), declares blind_from as the producer's
    task directory, and records the five primary sources it read in order with
    exact locators before the seal. That is a genuine second encoding of the
    same underlying results by an agent that had not seen the first. This
    program will not manufacture such an artifact again cheaply; it already has
    one and has never used it as a measurement.
    THE DISCORDANCE IS ALREADY VISIBLE IN TWO ROWS READ THIS SESSION. For the
    full-round theoretical identical-prefix SHA-1 collision, the producer row
    LEGACY-SHA1-IP-COLLISION-THEORY records security_property
    identical_prefix_collision, attacker_model classical, target_component
    hash_function, round_scope full, result_kind theoretical_attack; the blind
    row BLIND-SHA1-IP-COLLISION-THEORY-2020 records security_property
    collision, attacker_model classical_gpu, target_component full_hash,
    round_scope full_round, result_kind
    theoretical_expected_cost_with_implemented_components. Of the eight
    comparison-key fields both encodings populate, three agree (key_relation,
    rounds_attacked, total_rounds) and five differ. The blind encoding also
    omits oracle_access and round_convention entirely.
    WHY THE TWO PARTITIONS ARE PREDICTED TO CROSS RATHER THAN NEST. The blind
    encoder is COARSER on one axis - it uses a single partition cell
    preimage_and_second_preimage where the schema requires three
    (reduced_round_preimage, reduced_round_second_preimage,
    full_round_long_message_second_preimage) - and FINER on another - it splits
    attacker_model into classical_gpu, classical_heterogeneous_cpu_gpu,
    classical_gpu_cluster, classical_theoretical and classical_generic where
    the producer uses the single value classical for every SHA-1 row. Coarser
    on one axis and finer on another is precisely the crossing condition, and
    crossing is the outcome that cannot be repaired by declaring a granularity.
    WHY A PROSPECTIVE ARM IS REQUIRED AND NOT OPTIONAL. The retrospective arm
    confounds "different annotator" with "different task" - the red team was
    deriving a partition for review purposes, not filling schema v2's 11 fields,
    which is why two of them are absent from its rows. The prospective arm
    removes that confound by giving a third encoder the same schema, the same
    sources and the same 8 rows, and asks the only question that matters
    operationally - would an independent competent agent, following the
    committed contract, put this result in the same cell.
  tracked_object: >-
    The partition of a set of published results induced by an encoding into the
    comparison key - the equivalence relation "same key", with the cell labels
    forgotten - propagated by single-field encoding decisions through the
    refinement lattice.
  lossy_projection_test: >-
    PASSES. encoding -> induced partition is many-to-one (every bijective
    relabelling of the vocabulary has the same image) and non-invertible (the
    labels, costs, methods and provenance are unrecoverable). What is retained
    is exactly what the dominance gate consumes, since the gate tests key
    EQUALITY and never key content. Therefore the retained part propagates
    deterministically under the target operation. Not a change of coordinates.
  novelty_status: unverified
