  assumptions:
    - >-
      The instrument is read-only over committed artifacts for the
      retrospective arm. It writes a derived overlay, never edits a committed
      row, never changes an is_frontier value, and never proposes a vocabulary
      as an accepted schema amendment - that is a Coordinator decision on
      reviewed evidence.
    - >-
      No cryptanalytic search, attack execution, or reproduction occurs. Per
      RQ-SYMF-5ab172 none is authorized. The prospective arm re-reads published
      papers to fill schema fields; it verifies no attack and reproduces no
      cost.
    - >-
      The prospective encoder is an independent session that has NOT read
      knowledge/frontiers/symmetric-cryptanalysis.yaml, the producer shards, or
      the red team report, and its blind boundary is declared and hash-sealed
      before it opens a source, exactly as TASK-20260825-9eda3a did.
    - >-
      Alignment between the two committed encodings is done by RESULT IDENTITY
      (same paper, same locator, same headline cost), never by key similarity;
      an alignment decided by key similarity would assume the conclusion. The
      alignment is fixed and published before any agreement statistic is
      computed.
    - >-
      The MD5 collision-path content firewall of GOAL-MD5-001 binds every
      retrieval route the prospective arm uses.
  proof_search_map:
    bottleneck: >-
      The precondition "Compare rows only when every dominance_domain_key field
      is identical". Every comparative claim the frontier makes passes through
      an equality test on 14 free-text fields. If those fields are not
      reproducible across encoders, the equality test is a test of encoding
      convention and only incidentally of cryptanalytic sameness, and the
      entire frontier's comparability rests on one agent's word choices.
    baseline_embedding:
      parameter_slice: >-
        Identity alignment with zero relabelling - compare each encoding to
        ITSELF. Agreement must be 1.0 on every field and the induced partitions
        must be identical. This is the degenerate slice that proves the
        instrument measures disagreement rather than manufacturing it.
      reproduction_check: >-
        TWO-PART FROZEN FIXTURE, both parts exact and both able to fail.
        (a) Self-alignment - the producer encoding compared to itself yields
        field agreement 1.000 and partition distance 0 on all 30 canonical plus
        baseline rows. (b) Committed-partition reproduction - the cell
        assignment recomputed from the committed comparison_key blocks must
        reproduce the validation report's target_qualified_multirow_groups
        count of 4 and its enumerated collision groups. A mismatch halts the
        run and is reported as a defect rather than worked around.
    observation_collision:
      observable: >-
        The proposition "these two rows have the same comparison key", which is
        the only observable the dominance gate reads.
      distinct_preimage_search: >-
        COLLISION FOUND, IN BOTH DIRECTIONS, AND IT IS THE PROPOSAL'S POINT.
        Direction 1 (same observable, different ground truth) - two rows can
        share a key while denoting cryptanalytically different situations; the
        validation report already exhibits this, since three MD4 rows and three
        SHA3/SHAKE pairs shared a literal key across DIFFERENT targets
        (D-KEY-001). Direction 2 (different observable, same ground truth) -
        two rows can carry different keys while denoting the SAME situation,
        which is the collision this proposal hunts; the candidate pair read
        this session is LEGACY-SHA1-IP-COLLISION-THEORY versus
        BLIND-SHA1-IP-COLLISION-THEORY-2020, identical underlying result,
        five of eight jointly populated key fields different. SEPARATING
        CONDITION - the key must be constructed from a DECLARED controlled
        vocabulary with a stated canon for each field, so that "same key" is a
        function of the result rather than of the encoder; the deliverable of
        this proposal is the measured size of the gap that condition would
        close, not the vocabulary itself.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (the induced partition) fixed and vary the
          forgotten structure (the label vocabulary); then hold the underlying
          results fixed and vary the encoder, and exhibit two encodings of the
          same results with crossing partitions.
        predicted_gain: >-
          MODELED, NOT MEASURED. A committed counterexample pair establishing
          that "same comparison key" is not identifiable from the result, plus
          the intrinsic invariant that would restore it (a declared canon per
          field). If the two partitions turn out identical up to relabelling,
          the transform yields a clean negative - the vocabulary is arbitrary
          but the cell boundaries are objective, which is the good case and is
          repairable by a synonym table alone.
      - transform: representation_reduction
        proposed_object: >-
          Replace "key equality on 11 free-text strings" by "co-cell membership
          in a declared partition of the result space per primitive", making
          comparability an exact membership condition rather than a string
          equality.
        predicted_gain: >-
          MODELED, NOT MEASURED. Encoding obligation - the declared partition
          must reproduce the committed cells on rows where the two encodings
          already agree. Soundness obligation - no merge may cross an
          anti_laundering_rule. Transfer obligation - a partition declared for
          SHA-1 does not transfer to AES and must be declared per primitive
          class. Cost-loss obligation - the extra representational cost is one
          declared partition per primitive, which is exactly what the schema
          already does for SHA-1 alone (sha1_required_partition) and for no
          other primitive.
    quantifier_order: >-
      The frontier's implicit claim, written out - FOR ALL competent encoders e
      and FOR ALL published results r, key_e(r) depends only on r. THIS
      PROPOSAL CLAIMS ITS NEGATION IN THE WEAKEST FORM THAT IS STILL DECISIVE -
      THERE EXIST two encoders e1, e2 and results r, s such that
      key_e1(r) = key_e1(s) and key_e2(r) != key_e2(s), or vice versa; i.e.
      the induced partitions cross. NOT CLAIMED - that encoders never agree,
      that the disagreement is large for every primitive, or that any
      particular encoding is wrong. Which encoding is CORRECT is not decidable
      by this measurement and the report must not adjudicate it.
    method_ceiling:
      strongest_certifiable_claim: >-
        For the SHA-1 results present in both committed encodings, and for the
        declared prospective sample - the exact per-field agreement counts, the
        exact list of discordant co-cell pairs, the refinement relation between
        the induced partitions (identical / one refines the other / crossing),
        and a per-field reproduction rate for the prospective encoder with a
        binomial interval. The method can NEVER certify which encoding is
        correct, NEVER certify that any published attack is stronger or weaker
        than reported, NEVER establish an agreement rate for primitives outside
        the sample, and NEVER convert a low agreement rate into a claim that
        the literature is incomparable - only that this instrument's
        comparability is annotator-dependent at the measured rate.
      nearby_object_control: >-
        THE ZERO-DISAGREEMENT NULL OBJECT - re-encode a row by COPYING its
        committed comparison_key verbatim into the prospective encoder's
        template and passing it through the identical alignment and scoring
        pipeline. The pipeline must report agreement 1.000 and zero discordant
        pairs. If it reports any disagreement, the scorer is manufacturing
        discordance (whitespace, case, type coercion of the integer round
        counts) and every agreement number from that run is void. A second
        control at the other boundary - a DELIBERATELY DIFFERENT result (a
        SHA-1 row aligned against an AES row) must score near-zero agreement
        and must be flagged by the alignment step as a misalignment, not scored.
    proof_obligations:
      - claim: >-
          Self-alignment of each encoding against itself scores exactly 1.000
          field agreement and partition distance 0.
        responsibility: baseline
      - claim: >-
          The alignment between producer rows and blind rows is by result
          identity with an exact source locator per pair, published before any
          statistic is computed.
        responsibility: interface
      - claim: >-
          Fields absent from one encoding (oracle_access, round_convention,
          primitive_variant, primitive_class in the blind arm) are scored as
          MISSING and reported separately, never as agreement and never as
          disagreement.
        responsibility: correctness
      - claim: >-
          The refinement relation between the two partitions is decided
          exhaustively over all aligned pairs, not sampled.
        responsibility: correctness
      - claim: >-
          The prospective encoder's blind boundary is declared and hash-sealed
          before it opens a primary source, and the seal is verifiable.
        responsibility: scope
      - claim: >-
          All conclusions are scoped to SHA-1 plus the declared prospective
          sample, at the committed snapshot, and never generalized to the
          corpus.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: >-
        Q1 raw string agreement rate - over the SHA-1 result pairs aligned
        between the producer compilation and the red team's blind rows,
        the fraction of jointly populated comparison-key field cells whose
        values are byte-identical
      direction: lower
      minimum_effect: >-
        at most 0.60. A rate at or above 0.85 falsifies the vocabulary claim
        for SHA-1 and means the two encoders substantially shared a vocabulary
        despite no controlled list existing.
    - metric: >-
        Q2 refinement relation between the two induced partitions of the SHA-1
        result space, classified as identical / producer refines blind / blind
        refines producer / CROSSING
      direction: different
      minimum_effect: >-
        CROSSING, evidenced by at least one co-celled-by-producer pair the
        blind encoder separates AND at least one co-celled-by-blind pair the
        producer separates. If the relation is a refinement in either
        direction, explanation E3 holds - the disagreement is pure granularity
        and is repairable by declaring a level. If the partitions are
        identical, explanation E1 holds - vocabulary is arbitrary but cell
        boundaries are objective, and a synonym table suffices.
    - metric: >-
        Q3 prospective exact-key reproduction rate - fraction of the declared
        8-row sample for which a third independent blind encoder, working from
        the same primary sources under committed schema v2, produces all 11
        comparison-key field values byte-identical to the committed row
      direction: lower
      minimum_effect: >-
        at most 0.50. A rate at or above 0.875 (7 of 8) falsifies the
        annotator-dependence claim under the schema-following condition and
        localises the retrospective discordance to the red team's different
        task rather than to the schema.
    - metric: >-
        Q4 per-field reproduction rate in the prospective arm, reported for
        each of the 11 comparison-key fields separately with a binomial
        interval
      direction: different
      minimum_effect: >-
        Two-sided and both sides informative. The prediction is that
        rounds_attacked, total_rounds and key_relation reproduce at 1.0 while
        round_convention and success_probability_convention reproduce at or
        below 0.25 - i.e. the key contains both objective and subjective
        fields, and the report's deliverable is which are which. Uniform
        reproduction across all 11 fields falsifies the two-kinds model.
    - metric: >-
        Q5 zero-disagreement null control - agreement scored when a committed
        key is passed verbatim through the alignment and scoring pipeline
      direction: higher
      minimum_effect: >-
        exactly 1.000 with zero discordant pairs. Anything less voids every
        other number in the run.
  minimal_test:
    design: >-
      STAGED, with a free retrospective pilot before any paid prospective arm.
      STEP 0 - run the two-part frozen fixture (self-alignment agreement 1.000;
      recomputed cell assignment reproduces the validation report's 4
      target-qualified multirow groups). HALT AND REPORT on mismatch.
      STEP 1 (retrospective, zero retrieval cost) - align the red team's 8
      blind rows to producer rows BY RESULT IDENTITY using the source URL and
      exact_claim_location recorded on both sides, publish the alignment, then
      score Q1 field-by-field with MISSING treated as a third category.
      STEP 2 - compute the two induced partitions over the aligned set and
      decide Q2's refinement relation exhaustively, listing every discordant
      pair with the field that causes it.
      STEP 3 - run both null controls (verbatim-copy must score 1.000;
      cross-primitive misalignment must be rejected by the alignment step).
      STEP 4 (prospective, paid, conditional) - declare an 8-row sample and its
      primary sources; an independent session with a hash-sealed blind boundary
      encodes all 11 comparison-key fields from the sources under schema v2;
      score Q3 and Q4 with binomial intervals.
      STEP 5 - report the per-field reproduction table and the discordant-pair
      list as the deliverable, whatever the numbers are. A run in which both
      encodings agree perfectly is a complete and valuable result.
    controls:
      - >-
        Self-alignment baseline (STEP 0) - each encoding against itself must
        score 1.000; it can fail and halts the run.
      - >-
        Verbatim-copy null object - a committed key passed through the scorer
        unchanged must score 1.000, which excludes whitespace, case and
        integer/string coercion artifacts as sources of measured disagreement.
      - >-
        Cross-primitive misalignment control - a SHA-1 row aligned against an
        AES row must be REJECTED by the alignment step, not scored; if it is
        scored, the alignment criterion is not result identity.
      - >-
        Missing-field segregation - the four fields the blind arm never
        populated are reported as MISSING throughout and are excluded from Q1's
        denominator, so that the headline rate cannot be inflated by absence.
      - >-
        Blind scoring - the analyst scoring field agreement does not know which
        encoding is the producer's, and the row order is shuffled.
      - >-
        Prospective seal verification - the third encoder's declared blind
        boundary is hash-sealed and independently checked before its output is
        scored, and an unverifiable seal voids the prospective arm.
    required_metrics:
      - "published alignment table (blind row id, producer row id, source URL, exact locator) fixed before scoring"
      - "Q1 agreement rate with exact numerator and denominator, plus a per-field agreement table over the 8 jointly populated fields"
      - "count and full list of MISSING field cells, reported separately from agreements and disagreements"
      - "the two induced partitions as explicit cell lists, and Q2's refinement classification with every discordant pair itemised and attributed to a field"
      - "cell counts of the schema's sha1_required_partition (8) versus the red team's schema_partition_result (6), and the list of blind rows with no schema cell"
      - "Q3 prospective exact-key reproduction rate with a binomial interval"
      - "Q4 per-field prospective reproduction rate with binomial intervals, all 11 fields"
      - "verbatim-copy null control result (must be 1.000) and cross-primitive misalignment control result (must be rejected)"
      - "prospective seal hash, seal timestamp, and the declared blind_from path list"
  falsification_conditions:
    - >-
      STEP 0 fixture fails - self-alignment does not score 1.000 or the
      recomputed cell assignment does not reproduce the committed multirow
      groups. Run halts; the discrepancy is reported as an instrument or
      compilation defect and every numeric claim is withdrawn.
    - >-
      Q1 at or above 0.85 - the two encoders substantially shared a vocabulary;
      the free-text claim is false for SHA-1.
    - >-
      Q2 returns identical partitions - explanation E1; the cell boundaries are
      objective and only the labels vary, which means a synonym table fully
      repairs comparability. This is a strong POSITIVE result about the schema
      and closes this lane with an argument rather than a fatigue report.
    - >-
      Q2 returns a refinement in either direction - explanation E3; the
      disagreement is granularity only, and the forward guidance is to declare
      a granularity level per field rather than a vocabulary.
    - >-
      Q3 at or above 0.875 - an independent encoder following the schema
      reproduces the committed key almost always; annotator dependence is not
      a binding limitation and the retrospective discordance is attributable to
      the red team's different task, exactly as the dominant confounder
      predicts.
    - >-
      The verbatim-copy null control scores below 1.000 - the scorer
      manufactures disagreement; all agreement numbers from the run are void.
    - >-
      The prospective encoder's seal cannot be verified - the prospective arm
      is void and only the retrospective numbers may be reported, labelled as
      confounded.
  confounders:
    - >-
      TASK CONFOUND, DOMINANT. The red team's blind rows were produced to
      support a review partition, not to populate schema v2 - they omit
      oracle_access, round_convention, primitive_variant and primitive_class
      entirely. Measured disagreement therefore mixes "different annotator"
      with "different task". This is the single reason the prospective arm
      exists, and the retrospective numbers must never be reported without this
      caveat attached to them in the same sentence.
    - >-
      Alignment bias. An analyst who aligns rows by key similarity rather than
      by result identity will suppress exactly the disagreement being measured.
      Mitigated by fixing and publishing the alignment from source URL and
      locator before any scoring, and by the cross-primitive misalignment
      control.
    - >-
      Small sample. SHA-1 supplies at most 8 aligned results, so per-field
      rates have intervals spanning roughly plus or minus 0.35 near 0.5. The
      retrospective arm is powered only for an all-or-nothing pattern and the
      report must say so; the prospective arm is sized at 8 for cost reasons
      and inherits the same limit.
    - >-
      Degenerate partitions. If both encodings produce all-singleton
      partitions, a chance-corrected index is undefined and Q2 must be decided
      by the explicit discordant-pair list, never by a computed index. The
      analysis plan must precommit to the pair list as primary and any index as
      secondary.
    - >-
      Seal-order unverifiability. The red team's own record states
      producer_first_open_timestamp "not_clocked", so the blindness of the
      retrospective arm rests on an attestation plus a content hash rather than
      on a clocked ordering. The attestation is the program's own and is taken
      at face value here; a reader who does not accept it should read the
      retrospective arm as suggestive only.
    - >-
      Encoder skill confound. A third encoder less experienced than the
      producer will disagree more for reasons unrelated to the schema.
      Mitigated by using an agent under the same role contract and policy, and
      by reporting the encoder's resolved policy in the run record.
  interpretation_limits:
    - >-
      Scoped to SHA-1 results present in both committed encodings, plus a
      declared prospective sample, at snapshot commit
      5fc23783da8a2e62e2b3ab8728e47c48958ce02f. It is a statement about this
      program's encodings, never about the published literature.
    - >-
      Low agreement is NOT evidence that published symmetric results are
      intrinsically incomparable. It is evidence that comparability as
      implemented here is annotator-dependent - a claim about the instrument.
    - >-
      The measurement cannot say which encoding is correct. Where the two
      differ, the report lists both and adjudicates neither.
    - >-
      No attack, trail, collision, cost or key recovery is reproduced,
      verified, or questioned anywhere in this experiment.
    - >-
      A declared controlled vocabulary is a candidate for schema discussion,
      not an approved amendment; only a Coordinator decision on reviewed
      evidence can change the schema.
  heuristic_assumptions:
    - id: H1
      statement: >-
        (Encoder exchangeability.) The red team's blind encoding and the
        producer's encoding are exchangeable samples from the population of
        competent encodings of the same results under this program's contracts,
        in the sense that the field-level disagreement rate measured between
        them differs by at most 0.20 in absolute terms from the disagreement
        rate between the producer and a third independent encoder given the
        same schema.
      rigorous_support: >-
        Not proved, and known to be strained, because the two committed
        encodings were produced for different purposes and one of them omits
        four key fields. The assumption imitates the exchangeability assumption
        underlying inter-rater reliability statistics, where two raters are
        treated as draws from a rater population. The rigorous ingredient
        actually in hand is that both encodings were produced under the same
        program contract, from the same five primary sources, with recorded
        exact locators, and that one of them is hash-sealed against having read
        the other.
      validation_plan: >-
        WHAT TO SAMPLE - the prospective arm IS the validation of H1, which is
        deliberate: the third encoder is given schema v2 and the same sources,
        so the producer-versus-third disagreement rate is directly comparable
        with the producer-versus-blind rate. SCALE - 8 rows, complete
        enumeration, no subsampling; 8 is the number of aligned SHA-1 results
        available and is the binding limitation, reported rather than smoothed.
        SHORTCUT USED TO REACH SCALE - none needed for the retrospective arm
        (it is arithmetic over committed text, which is why it is nearly free);
        the prospective arm has no shortcut and its cost is one independent
        session. PREDICTED DISTRIBUTION - the two disagreement rates lie within
        0.20 of each other; if the prospective rate is far LOWER, the task
        confound dominates and the retrospective arm must be discounted, which
        is a decision rule rather than a caveat. TAIL CHECK - the single field
        with the largest gap between the two arms, reported explicitly, since
        a field the red team simply did not populate is a tail event invisible
        in an average. TRANSFER ASSUMPTION, STATED - nothing transfers to
        primitives outside SHA-1 or to encoders outside this program's role
        contracts; the rate is not a property of human or machine annotation in
        general.
    - id: H2
      statement: >-
        (Result identity is decidable from locators.) Two rows in different
        encodings denote the same underlying published result if and only if
        they cite the same primary source and the same claim location, up to
        pagination differences between preprint and proceedings versions of one
        paper.
      rigorous_support: >-
        Not proved; it is a discipline, and it is stated as one because it is
        the hinge on which the whole alignment rests. Its support is that both
        encodings record source_locator and exact_claim_location as required
        fields, and that the red team's record lists its read order with page
        ranges. The known failure mode is real and is visible in the committed
        text - the producer's LEGACY-SHA1-IP-COLLISION-THEORY cites "abstract
        PDF page 2; Table 1 PDF page 3; Table 2 PDF page 5" while the blind row
        cites "Table 1 and Section 1.1 (page 2); Table 2 (page 4)" for what is
        evidently the same content in the same paper, i.e. a one-page
        pagination offset between two readings of one URL.
      validation_plan: >-
        WHAT TO SAMPLE - every aligned pair; for each, record both locators
        verbatim and classify the relation as identical, pagination-offset, or
        genuinely different. SCALE - complete enumeration of the aligned set.
        PREDICTED DISTRIBUTION - a majority identical or pagination-offset, and
        zero genuinely different; a genuinely different locator inside an
        aligned pair means the alignment is wrong and that pair is dropped and
        reported, not repaired. COMPARISON - report the classification counts,
        not a similarity score. TAIL CHECK - the pair with the largest locator
        divergence, reported explicitly with both quotations, because that is
        where a false alignment would hide. TRANSFER ASSUMPTION - the
        pagination-offset tolerance is declared for preprint-versus-proceedings
        pairs of ONE paper and is never used to align two different papers.
  target_complexity:
    time_exponent: >-
      NO CRYPTANALYTIC EXPONENT IS CLAIMED OR MOVED. Instrument cost for the
      retrospective arm - alignment and scoring over A aligned pairs and F = 11
      fields is O(A*F); at A = 8 that is 88 cell comparisons. The partition
      comparison is O(A^2) = 64 pair tests. Total, microseconds. The
      prospective arm's compute is identical; its cost is entirely one
      independent encoding session.
    memory_exponent: >-
      O(A*F) - kilobytes. No memory pressure and no time-memory tradeoff in the
      computation.
    best_known: >-
      There is no incumbent measurement. The committed required_row_fields list
      (read in full this session) contains target_qualified_key_sha256 and
      review_refs but NO field able to express an encoder, an agreement rate,
      or a second encoding of the same result, so the incumbent value on every
      metric here is UNDEFINED rather than zero. The red team's own record
      reports blind_rows_matching_producer_headlines - a HEADLINE match on six
      rows - and explicitly reports no field-level or key-level agreement
      statistic. Externally, a bounded WebSearch this session located no
      comparability instrument for cryptanalysis frontiers and no
      encoder-variance measurement for one; nothing was fetched, so external
      dominance is BOUNDED-SEARCH NEGATIVE, not established absent.
    hidden_overhead: >-
      The o(1) is human or agent encoding time and it dominates absolutely in
      the prospective arm - reading five primary sources and filling 11 fields
      per row with locators is hours, and it does not shrink with better code.
      The retrospective arm has almost no hidden cost, which is precisely why
      it runs first. A second hidden cost - the alignment step requires
      judgment when locators are paginated differently (H2), and that judgment
      is not automatable at this sample size.
    tradeoff_note: >-
      The instrument's analogue of a time-memory tradeoff is a
      SAMPLE-SIZE-versus-INDEPENDENCE tradeoff and the deliverable is the
      curve, not a point. Aligning more rows requires reaching into primitives
      where only one encoding exists, which forces the prospective arm and
      raises cost linearly; restricting to the free retrospective arm caps the
      sample at 8 and leaves the task confound uncontrolled. The report emits
      both arms' rates side by side with their intervals rather than a pooled
      number. Parallelization is irrelevant at this scale and is not claimed.
  dominated_by: >-
    n/a (no result claimed) - Pareto check performed rather than asserted.
    Checked against - (i) the COMPLETE committed required_row_fields list of
    schema v2 (read in full this session), which has no field for an encoder,
    an agreement statistic, or an alternative encoding, so no frontier row can
    dominate this proposal on its measurement axis whatever the rows contain;
    (ii) the red team report read IN FULL this session, whose blind_rederivation
    and comparison_after_blind_seal blocks report headline matching and
    objections but no field-level or partition-level agreement statistic;
    (iii) the validation report lines 1-1129, whose
    comparison_key_reconstruction reports unique-key counts and collision
    groups within ONE encoding and never compares two encodings; (iv) the four
    sibling proposals filed earlier today under this question - IDEA-20260829-9aaa40
    (key-class multiplicity and field COARSENING within one encoding),
    IDEA-20260829-0b11ab (cost-unit conversion generators and holonomy),
    IDEA-20260829-d29588 (cost curve versus point), IDEA-20260829-083a6b
    (seeded-defect review calibration) - all four of which take the committed
    keys as given and none of which measures whether a second encoder produces
    them. DISCLOSED LIMIT - most canonical row bodies and half the validation
    report were not read this session; the domination argument rests on the
    schema field list being exhaustive and on the red team report having been
    read in full, and a validator should check the former rather than accept
    it. Externally - a bounded two-query WebSearch located no instrument;
    nothing was fetched; novelty_status is unverified accordingly.
  sota_delta: >-
    No attack, no exponent. Quantitative delta against this program's own
    instrument - the committed corpus contains two independent encodings of the
    same SHA-1 results and reports the agreement between them as, literally,
    a six-item list of matching HEADLINES; this proposal targets exact integers
    for (a) per-field agreement over the jointly populated comparison-key
    fields, (b) the refinement relation between the two induced partitions with
    every discordant pair itemised and attributed to a field, (c) the declared
    cell counts 8 (schema) versus 6 (blind) for SHA-1 with the blind rows that
    have no schema cell listed, and (d) a prospective per-field exact-key
    reproduction rate with binomial intervals. All four are currently
    unreported and unreportable under the committed schema. Against the
    target-result profile this is explicitly NON-target-class - checklist C1 is
    answered "no" and no asymptotic exponent moves - and it is proposed as a
    BUILDING BLOCK under Idea Generator search heuristic 1 - every future
    symmetric sota_delta computed against this frontier presupposes that
    "exactly matched" names a property of the result rather than of the
    annotator, and that presupposition has never been measured.
