    - ref: >-
        coordination/goals/GOAL-SCURVE-51437e/batches/BATCH-a41eb7/tasks/TASK-20260824-eaf0af/audit-plan.yaml
      provenance: internal
      claim: >-
        The threshold_policy block, its rule that measurement and adjudication
