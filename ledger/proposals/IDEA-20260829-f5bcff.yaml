      verified_by: 'Full read, both pages, 1597 lines, Read tool, 2026-08-29.'
    - ref: >-
        coordination/goals/GOAL-SCURVE-51437e/batches/BATCH-a41eb7/tasks/TASK-20260824-eaf0af/parameter-capsule.yaml
      provenance: internal
