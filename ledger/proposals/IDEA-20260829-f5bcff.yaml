      verified_by: 'Full read, 571 lines, Read tool, 2026-08-29.'
    - ref: 'SafeCurves (safecurves.cr.yp.to), all criterion pages'
      provenance: recalled
      claim: >-
        Defines eleven criteria and publishes a per-curve true-or-false table.
        UNRETRIEVED IN THIS SESSION - index.html and rho.html were both attempted
        on 2026-08-29 and both failed with a fetch-tool parse error about
