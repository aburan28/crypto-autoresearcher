      verified_by: null

  assumptions:
    - >-
      Executor has a shell and Python 3. The compute is negligible; the inputs
      are the measured quantities from IDEA-20260829-d052e6 and
      IDEA-20260829-e37b52 and from the archived plan's lanes L6 and L7.
    - >-
      The manifest's verdict cells are a faithful transcription of SafeCurves'
      published table. THIS IS THE PROPOSAL'S CENTRAL EXPOSURE - the cells are
      user_supplied_unverified by the goal's own declaration, so the inversion
      recovers the threshold implied by A TRANSCRIPTION of the table, not by the
      table. Heuristic H2 below carries this and it cannot be discharged without
      retrieval.
    - >-
      The measured quantities are obtainable for enough rows to make the ordering
      informative. For disc the true rows yield only lower bounds and the false
      rows exact small-discriminant certificates, so the measurement is
      interval-valued and the inversion will return a WIDER interval as a result,
      which is correct behaviour and not a defect.
    - >-
      No SafeCurves text is used. If OR-2 is ever resolved, the recovered
      interval becomes a TESTABLE PREDICTION about the true threshold, which is
      the best possible outcome and is the reason to run this before retrieval
      succeeds rather than after.

  proof_search_map:
    bottleneck: >-
      OR-2. The campaign has a complete measurement plan and no way to convert a
      measurement into an adjudication, because the comparison threshold lives on
      an unreachable host. Every one of the twenty sibling goals is blocked at
      the same point in the same way.
    baseline_embedding:
      parameter_slice: >-
        With the threshold supplied externally, the inversion degenerates to the
        archived plan's ordinary adjudication step - check the measured quantity
        against the threshold and compare to the cell. So the archived plan's
        intended procedure is the boundary case of this one at zero interval
        width, and this proposal must reproduce it exactly when a threshold is
        known.
      reproduction_check: >-
        Use RFC 7748's OWN retrieved rules as a stand-in threshold, namely
        R1-F10's requirement that the discriminant exceed 2^100 and R1-F9's
        requirement on the embedding degree, and confirm that the inversion
        machinery, given those, produces the same per-row verdicts as a direct
        comparison. This is a frozen fixture using a RETRIEVED threshold that is
        explicitly NOT SafeCurves', and it must be labelled that way in the
        output so no reader mistakes one for the other.
    observation_collision:
      observable: >-
        The verdict vector for criterion c. The conclusion that our predicate
        reproduces SafeCurves rests entirely on it.
      distinct_preimage_search: >-
        REQUIRED, AND THE PREDICTED ANSWER IS THAT COLLISIONS ARE MASSIVE. Every
        threshold in the recovered interval produces the identical verdict
        vector, so the observable does NOT identify the threshold - it identifies
        only the interval. THE CONSEQUENCE MUST BE WRITTEN INTO THE DELIVERABLE -
        no downstream record may cite a specific recovered threshold; only the
        interval and its width may be cited. A second and sharper collision -
        DIFFERENT PREDICATE FORMS can produce the same verdict vector, for
        instance a bound on the fundamental discriminant versus a bound on
        t^2 - 4p may agree on all twenty rows while disagreeing on a
        twenty-first curve. The method therefore identifies a predicate only up
        to twenty-row agreement, and a twenty-first curve is the only way to
        separate them. That is stated as the method's ceiling below, not buried.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the verdict vector fixed and vary the forgotten structure, namely
          the actual threshold and the actual predicate form, to enumerate the
          fibre. The fibre's SIZE - interval width in bits, and number of
          consistent predicate forms - is the deliverable.
        predicted_gain: >-
          Converts "we cannot adjudicate" into "we can adjudicate to within a
          measured and published ambiguity of W bits", which is a strictly
          stronger epistemic position than the archived plan's blanket deferral
          and is honest about exactly how much weaker it is than retrieval.
      - transform: representation_reduction
        proposed_object: >-
          Replace the unknown real-valued threshold by the integer cut position
          in a sorted list of twenty, an exactly computable combinatorial object.
        predicted_gain: >-
          Makes the consistency question decidable exactly, with the
          twenty-one-of-2^20 null giving a quantified significance, rather than
          approximately.
    quantifier_order: >-
      Claimed PER CRITERION, EXISTENTIALLY. FOR THIS criterion c, THERE EXISTS a
      threshold tau_c such that FOR ALL resolved rows i, the predicate applied to
      the measured quantity and tau_c equals the manifest cell. NOT CLAIMED, and
      the difference is the whole of the method's limitation - FOR ALL curves,
      including curves outside the twenty, the predicate agrees with SafeCurves.
      The witness tau_c is permitted to depend on the twenty-row sample, and it
      does; a twenty-first curve could refute it, and that is the honest
      statement.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For criterion c, the published twenty-row verdict vector IS realisable
        by a threshold predicate of the stated form, and the consistent
        thresholds form an interval of width W bits" - or the negation, that it
        is NOT realisable and so the predicate form is wrong. It certifies
        NOTHING about what SafeCurves' actual definition says, and a record that
        writes "SafeCurves' disc threshold is X" on this basis has committed a
        claim-tier violation.
      nearby_object_control: >-
        THE ANOMALOUS AND BN(2,254) ROWS ARE THE CONTROL AND THEY ARE
        LOAD-BEARING HERE IN A WAY THEY ARE NOT ELSEWHERE. Both are declared
        false on transfer and on disc, for stated and DIFFERENT mechanisms -
        Anomalous by additive transfer with trace one, and BN by multiplicative
        transfer with embedding degree twelve. A single-threshold predicate for
        transfer CANNOT flag both, because the embedding degree is not even
        defined in the same way for a trace-one curve. If the inversion returns a
        consistent single threshold for transfer covering both rows, THE METHOD
        HAS FOUND A SPURIOUS FIT and must be rejected; this is the nearby-object
        control that a naive implementation would fail. The correct output for
        transfer is a TWO-CLAUSE predicate with two separate parameters, and the
        record must show it derived that from the failure of the one-clause fit
        rather than assuming it.
    proof_obligations:
      - claim: >-
          Exactly 21 of the 2^20 verdict vectors are realisable by a monotone
          one-parameter threshold on twenty distinct quantities.
        responsibility: strictness
      - claim: >-
          A two-parameter disjunctive predicate realises on the order of n^2,
          about 400, vectors, so its null significance is about 2^{-11}, not
          about 2^{-15.7}.
        responsibility: strictness
      - claim: >-
          Interval-valued measurements, with lower bounds only on the true rows,
          widen the recovered interval and never narrow it.
        responsibility: correctness
      - claim: >-
          The rho criterion's all-true verdict vector makes its inversion
          vacuous, and this is reported rather than presented as a successful
          inversion.
        responsibility: scope
      - claim: >-
          The exact small-discriminant certificate t^2 - 4p equals v^2 times D
          verifies in one multiplication.
        responsibility: interface
      - claim: >-
          The recovered interval is a property of the TRANSCRIBED table, not of
          SafeCurves.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: 'number of the eleven criteria for which a consistent threshold exists'
      direction: different
      minimum_effect: >-
        PREDICTED - disc yes; transfer no for a one-clause predicate and yes for
        a two-clause one; twist yes only for a compound predicate; rho vacuous
        because all cells are true; and rigid, ladder, complete, ind, field,
        equation and base not attempted because they are not numeric thresholds.
        So the predicted answer is two genuinely invertible, one vacuous, one
        compound and seven refused. Any deviation is informative - a criterion
        inverting that was predicted to refuse means our reading of it is wrong.
    - metric: 'recovered interval width in bits for the disc criterion'
      direction: higher
      minimum_effect: >-
        PREDICTED GREATER THAN 90 BITS. Derivation stated so it is checkable -
        the false rows are expected at discriminant magnitudes of order three up
        to 2^60 and the true rows above 2^100, leaving an interval spanning most
        of that gap. THE CONSEQUENCE - the table determines SafeCurves' disc
        threshold only to within about 90 bits, so quoting a specific value from
        it would be fabrication. A width BELOW 10 bits would be a surprise
        meaning the family's discriminants cluster tightly around the threshold,
        which would be a real and reportable structural observation about the
        family.
    - metric: >-
        whether a ONE-clause threshold predicate reproduces the transfer verdict
        vector
      direction: different
      minimum_effect: >-
        PREDICTED NO, and this is the nearby-object control. A YES means the
        method has fitted noise across two mechanistically different failures and
        must be rejected.
    - metric: >-
        number of resolved rows for which the criterion quantity is actually
        measurable within budget
      direction: different
      minimum_effect: >-
        REPORTED AS COVERAGE, NO TARGET. Fewer than about eight measurable rows
        makes the ordering statistically weak, since the null significance
        degrades from about 2^{-15.7} at twenty rows to about 2^{-5} at eight
        rows, and the record must then say the inversion is underpowered rather
        than report an interval as if it were well-determined.
    - metric: >-
        agreement between the recovered disc interval and RFC 7748's retrieved
        rule that the discriminant exceed 2^100
      direction: different
      minimum_effect: >-
        PREDICTED that 2^100 lies INSIDE the recovered interval. THE TWO OUTCOMES
        - inside means SafeCurves' and the RFC's thresholds are mutually
        compatible on this family and neither can be distinguished by it; outside
        would mean the two documents apply materially different standards, which
        is a genuine and publishable structural observation about the criteria,
        and one that no amount of reading either document separately would
        produce.

  minimal_test:
    design: >-
      STAGE 0, zero compute, and it is the cheapest possible falsification.
      COMBINATORIAL FEASIBILITY ONLY. Read the full manifest, extract the
      twenty-row verdict vector for each of the eleven criteria, and ask, WITHOUT
      MEASURING ANY QUANTITY, which criteria have mixed cells at all. A criterion
      with all cells equal is vacuous and the method cannot touch it. This costs
      one file read and it already determines how many criteria are even
      candidates. If the answer is fewer than two, THE PROPOSAL IS DEAD AT ZERO
      COST, which is exactly the property a minimal test should have.
      STAGE 1, hours. Measure the quantity for disc on the rows where a
      certificate is obtainable - exact small-discriminant certificates of the
      form t^2 - 4p equals v^2 times D for the false rows, predicted cheap since
      BN and secp256k1 are expected to be j equal to zero curves with D equal to
      minus three, certifiable by exhibiting v in one multiplication, and lower
      bounds on the discriminant magnitude for as many true rows as the factoring
      budget reaches. This requires the trace per row, hence the group order per
      row, hence IDEA-20260829-e37b52's Step 2.
      STAGE 2, seconds. Run the interval inversion and report the interval, the
      width, and consistency or its failure.
      STAGE 3, seconds. The nearby-object control - attempt the one-clause
      transfer inversion and confirm it FAILS.
      STAGE 4, seconds. The null - random verdict vectors.
    controls:
      - >-
        NULL, SAME SHAPE, QUANTIFIED - draw 10^4 uniformly random verdict vectors
        over the same twenty rows with the same measured quantities and run the
        identical inversion. PREDICTED consistent-fit rate of 21 divided by 2^20,
        which is 2.0 times 10^{-5}, so about 0.2 hits expected in 10^4 draws.
        Observing a rate materially above that means the inversion is accepting
        inconsistent vectors and every recovered interval is void.
      - >-
        NEARBY-OBJECT AND SPURIOUS-FIT CONTROL, BLOCKING - the one-clause
        transfer inversion, which MUST fail; see method_ceiling.
      - >-
        POSITIVE, ANOMALOUS - the row must land on the false side of disc and of
        transfer under any recovered threshold. An inversion that places the
        deliberately broken curve on the safe side is broken, and this is the
        family's designated instrument check.
      - >-
        POSITIVE, BN(2,254) - must land on the false side of disc and transfer,
        by a DIFFERENT clause than Anomalous.
      - >-
        NEGATIVE - Curve25519, M-221 and E-222 must land on the true side of
        every criterion the method inverts.
      - >-
        REFUSAL CONTROL - run the inversion on rigid and on ind and confirm the
        method REFUSES rather than returning a threshold. A method that returns a
        number for rigid, a property of a design process which the archived
        plan's own closure argument shows no computation can decide, is fitting
        noise.
      - >-
        DEGENERACY CONTROL - run the inversion on rho and confirm it reports
        VACUOUS rather than a successful fit.
    required_metrics:
      - 'per criterion, the mixed-cell count taken from the FULL manifest'
      - 'per criterion, invertible or vacuous or not-invertible or refused, with reason'
      - 'per invertible criterion, the interval, its width in bits, and the rows used'
      - 'per row per criterion, the measured quantity as an interval with its certificate'
      - 'the null consistent-fit rate over 10^4 random verdict vectors'
      - 'pass or fail of the one-clause transfer spurious-fit control'
      - 'whether the RFC 7748 threshold of 2^100 lies inside the recovered disc interval'
      - 'count of rows measurable versus rows in the manifest'

  falsification_conditions:
    - >-
      Fewer than two criteria have mixed cells across the full twenty rows. The
      method has no purchase; the proposal returns a zero-cost negative at Stage
      0 and the campaign's OR-2 blocker stands as the archived plan states it.
    - >-
      A one-clause threshold consistently fits the transfer criterion. Spurious
      fit; the whole inversion is rejected as insufficiently constrained.
    - >-
      The null consistent-fit rate materially exceeds 21 divided by 2^20.
      Implementation failure; nothing is reported.
    - >-
      No consistent threshold exists for disc. This is NOT a failure of the
      proposal; it is its most informative outcome, because it means our
      predicate FORM for disc is wrong, which is a stronger and more useful
      finding than a recovered constant and tells the campaign that measuring the
      discriminant magnitude is not what SafeCurves' disc cell is about.
    - >-
      The inversion returns a threshold for rigid or for ind. The refusal control
      failed and the method is fitting structure that is not there.
    - >-
      Anomalous or BN(2,254) lands on the safe side of any recovered threshold.
      The instrument does not flag the deliberately broken curves and every
      verdict it produces is void.

  confounders:
    - >-
      THE TABLE IS A TRANSCRIPTION. The manifest's cells are declared
      user_supplied_unverified. The inversion recovers the threshold implied by
      those cells, and a single mis-transcribed cell can move the interval
      arbitrarily or destroy consistency entirely. A consistency FAILURE is
      therefore ambiguous between a wrong predicate form and one wrong cell, and
      the record must report both readings. A leave-one-out re-inversion, which
      drops each row in turn and reports whether consistency is restored, is the
      cheap diagnostic that separates them and must be run.
    - >-
      INTERVAL-VALUED MEASUREMENTS. Lower bounds on the true rows and exact
      values on the false rows are not symmetric, and the recovered interval
      inherits that asymmetry. Reporting a symmetric interval would misstate what
      was measured.
    - >-
      SafeCurves' criteria are plausibly COMPOUND, since a twist cell may fold
      twist rho, twist transfer and joint small-subgroup cost into one bit. A
      compound criterion fitted by a one-parameter threshold will appear
      consistent for accidental reasons on twenty rows, and the extra parameters
      degrade the null from about 2^{-15.7} toward about 2^{-11} or worse. Every
      added parameter must be accompanied by its recomputed null.
    - >-
      SELECTION. Only rows whose quantity is measurable enter the inversion, and
      measurability may correlate with the verdict, since a curve with a tiny
      discriminant is easy to certify exactly and a curve with a huge one is not.
      That correlation biases the recovered interval toward the measurable side
      and must be reported alongside it.

  interpretation_limits:
    - >-
      THE RECOVERED INTERVAL IS NOT SAFECURVES' THRESHOLD. It is the set of
      thresholds consistent with a transcription of SafeCurves' verdicts under a
      predicate form of our own writing. Any record that drops that qualifier
      commits the same claim-tier violation the archived plan's threshold_policy
      exists to prevent.
    - >-
      TRANSFER TO THE OTHER 19 CURVES - this record is INHERENTLY FAMILY-WIDE and
      cannot be run on one curve at all, since a single row constrains a
      threshold only to a half-line, which is no constraint. Its per-curve output
      runs in the reverse of the usual direction - it tells EACH of the twenty
      goals, including the nineteen siblings, what interval its own adjudication
      step may use and how wide the resulting ambiguity is. It therefore
      unblocks, partially and with a measured ambiguity, the identically-worded
      completion criterion 4 of all twenty goals at once, which no single-curve
      lane can do. The deliverable should be filed so all twenty can cite it.
    - >-
      A successful inversion does not discharge OR-2. Retrieval remains the right
      answer and this is the second-best one; the recovered interval becomes a
      falsifiable PREDICTION the moment retrieval succeeds, and that is the
      strongest reason to run this first.
    - >-
      Nothing here is a security statement about any curve.

  heuristic_assumptions:
    - id: H1
      statement: >-
        SafeCurves' verdict for each numeric criterion c is generated by a
        MONOTONE comparison of a single measurable quantity against a single
        fixed threshold tau_c, uniformly across all twenty curves; formally, the
        cell for criterion c and row i equals the indicator that the measured
        quantity for row i exceeds tau_c, with the same tau_c for every row.
      rigorous_support: >-
        The RIGOROUS half is combinatorial and is the load-bearing part - on n
        distinct quantities exactly n plus one of the 2^n verdict vectors are
        realisable by SOME threshold, so consistency is an exact computable
        significance statement, about 2^{-15.7} at n equal to twenty, requiring
        no distributional assumption at all. The HEURISTIC half is the
        monotone-single-parameter FORM, which imitates the standard modelling
        assumption that the published rule is the simplest rule consistent with
        its outputs. Named obstruction - the archived capsule's retrieved RFC
        7748 rules R1-F9 and R1-F10 are indeed of exactly this monotone
        one-parameter shape, which is weak circumstantial support that criterion
        documents in this area are written that way, but RFC 7748 is not
        SafeCurves and that inference is explicitly not evidence.
      validation_plan: >-
        SAMPLING - 10^4 uniformly random verdict vectors over the same twenty
        rows and the same measured quantities, with seeds recorded. COMPARISON
        DISTRIBUTION - the observed consistent-fit rate against the exact
        combinatorial prediction of 21 divided by 1048576, which is 2.00 times
        10^{-5}; this is an EXACT null, not an asymptotic one, so the comparison
        is a binomial test with no approximation. TAIL CHECK - the distribution
        of recovered interval widths over the random vectors that DO fit; these
        should be systematically narrower than the real criterion's, since a
        random cut rarely lands in a wide gap, and if the real disc interval is
        not in the upper tail of that distribution the greater-than-90-bits
        prediction is not supported. LEAVE-ONE-OUT - re-invert twenty times,
        dropping each row, to measure how much any single cell drives the result.
        TRANSFER - none, since the null runs on the same twenty rows at the same
        sizes.
    - id: H2
      statement: >-
        The manifest's twenty-row verdict table is a faithful transcription of
        SafeCurves' published table, cell for cell.
      rigorous_support: >-
        NONE, AND THIS IS THE PROPOSAL'S BINDING WEAKNESS. The goal's own claim
        boundaries declare every cell user_supplied_unverified and
        comparison_target_only. No computation can discharge this; only
        retrieving the table can, and retrieving the table would also supply the
        thresholds directly and make the whole method unnecessary. The proposal
        is therefore explicitly a SECOND-BEST route whose value is exactly the
        value of proceeding while the first-best is unavailable.
      validation_plan: >-
        PARTIAL AND INDIRECT ONLY. (i) Internal consistency - a table with a
        mis-transcribed cell is MORE likely to be inconsistent with any single
        threshold, so a successful inversion is weak evidence of faithful
        transcription; weak, because a mis-transcription that moves a row across
        the cut in the same direction as the truth is invisible. (ii)
        Leave-one-out - if dropping exactly one row restores consistency, that
        row is the prime suspect and is flagged for targeted re-retrieval, a
        one-URL request rather than a whole-site one, which may succeed where the
        index page did not. (iii) If OR-2 is ever resolved, the recovered
        interval is compared against the true threshold and this heuristic is
        settled outright. No statistic is fabricated in the meantime and the
        record states that H2 remains open.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. The inversion itself is O(n log n) for n
      equal to twenty, a sort, that is microseconds. The cost is entirely in
      MEASURING the criterion quantities, which for disc means obtaining the
      trace per row, from IDEA-20260829-e37b52, and then partially factoring
      t^2 - 4p, a capped best-effort task inheriting the archived plan's E4
      environment limit of trial division, Pollard rho and p minus one, and
      pure-Python ECM. The false rows are cheap, since an exact
      small-discriminant certificate is one multiplication to verify.
    memory_exponent: >-
      O(n log p) for the whole family, that is kilobytes. Certificate
      verification is O(1) per row for the exact small-discriminant certificates
      and one division per claimed odd-multiplicity prime for the lower bounds,
      inherited from the archived plan's lane L7.
    best_known: >-
      The best known method for learning SafeCurves' thresholds is to READ THE
      SafeCurves PAGES, which costs one HTTP request and returns the exact values
      with zero ambiguity. That incumbent strictly dominates this proposal on
      every axis whenever it is available; this proposal exists only because it
      has now failed in two sessions under two different failure modes. Against
      the ECDLP attack frontier this record is dominated by every row because it
      is not an attack.
    hidden_overhead: >-
      No o(1). The honest hidden cost is that the method's output is an INTERVAL
      whose width is predicted to exceed 90 bits for disc - that is, the method is
      predicted to be very nearly uninformative about the threshold's VALUE while
      being quite informative about the predicate's FORM and about the table's
      internal consistency. Presenting a 90-bit-wide interval as a recovered
      threshold would be the central dishonesty available here and the record
      pre-commits against it.
    tradeoff_note: >-
      The tradeoff is ROWS versus PARAMETERS. Each extra predicate parameter buys
      the ability to fit compound criteria and costs about 4.7 bits of null
      significance at twenty rows, moving from 21 realisable vectors to on the
      order of 400. With twenty rows the budget allows about two parameters
      before consistency stops being evidence, and the record must publish the
      recomputed null beside every multi-parameter fit. No time-memory tradeoff,
      and parallelisation is irrelevant.

  dominated_by: >-
    CHECKED AGAINST EVERY FRONTIER ROW; `null` is not asserted. AS AN ATTACK it
    is dominated by rho (KN-TECH-001, KN-TECH-006), automorphism-discounted rho
    (KN-TECH-018), BSGS (KN-TECH-031, KN-TECH-035), MOV and Frey-Ruck
    (KN-TECH-032) and the trace-one transfer (KN-TECH-033) on time, memory and
    data simultaneously, because it is not an attack. AS A METHOD FOR LEARNING
    THE THRESHOLDS it is STRICTLY AND COMPLETELY DOMINATED by fetching
    safecurves.cr.yp.to, which is faster, exact and unambiguous; this record does
    not dispute that, and its entire justification is the observed unavailability
    of that route across two sessions and two failure modes. AS A MEASUREMENT OF
    THE TABLE'S INFORMATION CONTENT, no incumbent inside or outside this program
    has been identified that reports how tightly the SafeCurves verdict table
    constrains its own thresholds; that specific output is not dominated because
    no competing row producing it was found. This is a narrow non-domination and
    it is stated narrowly.
  sota_delta: >-
    ZERO speedup against any attack baseline on every axis. AS SCOPE, WHICH IS
    THE ONLY AXIS WITH A NONZERO DELTA - the archived audit plan states that goal
    completion criterion 4 cannot be met until OR-2 is resolved, and the same
    blocker is written into all twenty sibling goals identically. This record
    proposes to convert that from a hard block into a bounded one, with
    adjudication possible for a predicted two of eleven criteria, three with a
    compound predicate, with a published ambiguity of a predicted more than 90
    bits for disc, and explicit refusal for the remaining seven or eight.
    Quantitatively - twenty goals times eleven criteria is 220 currently
    unadjudicable cells, and this proposal targets a predicted 40 to 60 of them,
    two or three criteria times twenty rows, and REFUSES the rest with stated
    reasons. That is a partial unblock of a fully blocked lane, stated at that
    size and no larger. AS A NEW MEASUREMENT - the width in bits of the recovered
    interval is a quantity this program does not currently hold for any
    criterion, and it is the number that tells every downstream record how much
    the intake table is actually worth as a comparison target.
