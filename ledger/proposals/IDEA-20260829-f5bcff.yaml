idea:
  id: IDEA-20260829-f5bcff
  question_id: RQ-SCURVE-d9b7d2
  goal_id: GOAL-SCURVE-51437e
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    THRESHOLD INVERSION - recover SafeCurves' own numeric criterion thresholds
    from its published twenty-row verdict table by solving for them, thereby
    unblocking the campaign's adjudication step WITHOUT retrieving the criterion
    pages that have now failed to fetch in two separate sessions under two
    different failure modes
  class: measurement

  claim: >-
    The campaign is blocked on open item OR-2 - the SafeCurves criterion
    definitions and numeric thresholds are unretrieved, so goal completion
    criterion 4, which requires adjudicating every disagreement with the
    preregistered SafeCurves row, cannot be met. THE BLOCKER IS AVOIDABLE,
    because the thresholds are OVER-DETERMINED by the verdict table the campaign
    already holds. Concretely.

    (A) For a criterion c whose SafeCurves verdict is a monotone comparison of a
    measurable quantity q against an unknown threshold tau_c, the twenty
    published true-or-false cells for c constrain tau_c to an INTERVAL. Sorting
    the twenty measured quantities, only 21 of the 2^20 possible verdict vectors
    are realisable by ANY threshold. So CONSISTENCY IS A SIGNAL OF ABOUT
    2^{-15.7} - if the published cells for c are realisable by some tau_c, that
    is strong evidence that our predicate FORM and our measured quantities are
    both right; if they are NOT realisable, the predicate form is wrong, which is
    a much more informative negative than a mismatched constant.

    (B) The OUTPUT is an interval from tau_lo to tau_hi per criterion, plus its
    WIDTH IN BITS, which is the honest measure of how much the table actually
    pins down. PRE-REGISTERED PREDICTION FOR THE disc CRITERION - exactly three
    of the twenty published cells are false, for Anomalous, BN(2,254) and
    secp256k1, read directly from the manifest on 2026-08-29, and those three are
    expected to have tiny discriminant magnitude, BN and secp256k1 both being
    j equal to zero curves with complex multiplication by the field generated by
    the square root of minus three, and Anomalous described in its own intake as
    an illustration of small discriminant. The seventeen true rows are expected
    to exceed 2^100 by RFC-7748-style generation rules. The recovered interval is
    therefore PREDICTED TO BE ENORMOUSLY WIDE, spanning MORE THAN 90 BITS, which
    means the table pins SafeCurves' disc threshold only to within about 90 bits
    and no record may quote a specific threshold as if the table determined it.
    That is a non-obvious, quantitative, falsifiable prediction about the
    INFORMATION CONTENT of the intake table, and it is the kind of statement this
    campaign has so far been unable to make at all.

    (C) The method has a DEGENERATE CASE and it is disclosed in advance rather
    than discovered. For the rho criterion, ALL TWENTY published cells are true,
    so every threshold below the minimum measured quantity reproduces the table
    and the inversion recovers NOTHING. The informative criteria are exactly
    those with mixed cells - disc with three false, transfer with two false,
    twist, ladder, complete, ind and rigid - and of those only disc, transfer and
    twist are plausibly numeric. The criteria rigid, ladder, complete and ind are
    structural or process predicates, not thresholds, and the method must REFUSE
    them.

  mechanism: >-
    THE TRACKED OBJECT is the ORDER STATISTIC of the family. For a criterion c,
    it is the permutation induced by sorting the twenty measured quantities,
    together with the position of the true-versus-false cut in that sorted order.
    Everything about the individual curves is discarded; what is retained is a
    single cut position in a list of twenty.

    LOSSY-PROJECTION TEST, applied before any experiment.
    WHAT IS DISCARDED - twenty curves, twenty quantities of 200 to 400 bits, and
    all of their arithmetic, reduced to one integer between zero and twenty.
    About five bits survive from several thousand.
    IS IT A CHANGE OF COORDINATES? No. The fibre over a given cut position is the
    entire set of quantity vectors with that ordering, a positive-measure set of
    enormous dimension, and nothing about any curve is recoverable.
    IS THE DISCARD COMPATIBLE WITH THE OPERATIONS? The operation here is
    THRESHOLDING, and the projection is exactly equivariant under it - a monotone
    predicate's verdict vector depends on the quantities ONLY through the cut
    position, so the retained part propagates deterministically and completely.
    That is the entire mathematical content of the method, and it is why the
    inversion is exact rather than approximate. PASSES.
    WHERE IT DISSOLVES - at the first NON-MONOTONE criterion. The transfer
    criterion is already a disjunction, since a curve fails it by being anomalous
    OR by having small embedding degree, two mechanisms and one cell, so the
    single cut position is the wrong object for it and a two-clause predicate
    with two cut positions is required. The criteria rigid, ladder, complete and
    ind dissolve entirely, because there is no ordering to cut. The method's
    reach is measured, not assumed, and the count of criteria it can and cannot
    invert is itself a deliverable.

    WHY THIS IS THE RIGHT MOVE RATHER THAN MORE RETRIEVAL. The archived capsule
    records five distinct SafeCurves URLs returning HTTP 502 in the prior session
    and one Internet Archive attempt refused by the tool. I re-attempted two URLs
    on 2026-08-29 and both failed with a DIFFERENT error, namely a fetch-tool
    parse error about Content-Length not being permitted with Transfer-Encoding,
    which suggests the obstruction is not a transient outage. A campaign that can
    only proceed by retrieving one specific host is hostage to that host.
    Threshold inversion converts the dependency from "we must read SafeCurves'
    definitions" to "we must be able to REPRODUCE SafeCurves' verdicts", which is
    both weaker and, for the campaign's actual purpose of adjudication,
    sufficient - and it produces something retrieval would not, namely a
    measurement of how much information the published table contains.

    EXECUTION. Step 1, per criterion, WRITE THE PREDICATE FORM EXPLICITLY and
    label it definition_source of this_plan, exactly as the archived plan does.
    Step 2, measure the quantity for the rows where it is computable, using the
    certificates of IDEA-20260829-d052e6 and IDEA-20260829-e37b52 and the
    archived plan's lanes. For disc, note that the true rows admit only a LOWER
    bound on the discriminant magnitude while the false rows admit an EXACT
    small-discriminant certificate of the form t^2 - 4p equals v^2 times D,
    verifiable in one multiplication, so the measurement is interval-valued and
    the inversion must be run on intervals. Step 3, solve for the consistent
    threshold interval, or prove none exists. Step 4, report per criterion -
    INVERTIBLE with interval and width, NOT INVERTIBLE with the reason, or NOT
    ATTEMPTED because the criterion is not numeric.

  novelty_status: unverified
  novelty_rationale: >-
    Inverting a published verdict table for its implicit threshold is a standard
    idea in measurement and psychometrics and is almost certainly `known` as a
    technique. Its application to the SafeCurves table is, on the corpus screen,
    absent from this program. The label is `unverified` because the SafeCurves
    pages themselves could not be retrieved, which is both the reason the idea
    exists and the reason its novelty cannot be checked against the very source
    it reasons about. That circularity is disclosed, not hidden.
  novelty_screen:
    method: 'Same 2026-08-29 screen as IDEA-20260829-d052e6 and IDEA-20260829-e37b52.'
    results: >-
      No record in ledger/ or knowledge/ reconstructs, bounds or infers any
      SafeCurves threshold. The archived audit plan's threshold_policy block
      adopts the OPPOSITE strategy - it separates measurement from adjudication
      and defers adjudication entirely, stating that goal completion criterion 4
      cannot be met until OR-2 is resolved. This proposal contradicts that
      conclusion on a specific point and must be read as a challenge to it - OR-2
      is sufficient for adjudication, but the plan did not establish that it is
      NECESSARY, and the inversion is an attempt to show it is not.

  citations:
    - ref: >-
        coordination/bootstrap/safecurves/TASK-20260824-41038d/manifest.yaml
      provenance: internal
      claim: >-
        The twenty rows' eleven-cell expected_safecurves verdicts, which are the
        DATA this proposal inverts. Read directly for sixteen rows - disc is
        false for Anomalous, BN(2,254) and secp256k1 and true for the other
        thirteen read; transfer is false for Anomalous and BN(2,254) only; rho is
        true on all sixteen read; and rigid, ladder, twist, complete and ind are
        mixed.
      verified_by: >-
        PARTIAL read, lines 1 to 893 of 1300, by the Read tool, 2026-08-29. The
        counts stated above are over the SIXTEEN rows actually read, NOT over all
