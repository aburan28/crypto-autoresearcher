idea:
  id: IDEA-20260807-b92080
  question_id: RQ-PAIR-21313f
  added: '2026-08-07'
  title: >-
    CLOSURE OF THE REVERSE DIRECTION - the isogeny class contains no curve with
    a smaller embedding degree, because k = ord_N(p) is a function of (N, p)
    and both are F_p-isogeny-class invariants; the closure survives the two
    escapes an attacker would try next, base change (which divides k by
    gcd(k,m) but leaves the TARGET FIELD F_{p^k} and hence the field-DLP cost
    exactly unchanged) and the quadratic twist (whose k genuinely does differ,
    and which is precisely the curve no F_p-rational map reaches); so the
    MOV cost functional is PROVED constant on the class, which is the
    decomposition's T3 test resolved in the negative for this functional
  class: mechanism

  claim: >-
    (A) THE CLOSURE. Let E/F_p be ordinary with prime N dividing the group order
    and let E' be F_p-isogenous to E. An F_p-isogeny preserves the
    characteristic polynomial of Frobenius, so E and E' have the SAME number of
    F_p-rational points and hence the same N divides it; p is unchanged by
    definition. Therefore
        k(E') = ord_N(p) = k(E),
    identically, for every curve in the class and every isogeny degree. More
    strongly, the whole EMBEDDING-DEGREE PROFILE - the vector
    (ord_{N_i}(p))_i over all prime divisors N_i of the common group order - is
    a class invariant, as is the target field F_{p^k} and therefore the entire
    MOV/Frey-Ruck cost functional C_MOV(E) = C_pairing(p, k) + C_fieldDLP(p^k).
    Consequence - the minimum over the class of C_MOV equals C_MOV itself, the
    minimisation is vacuous, and no isogeny walk of any length or degree
    improves the transfer by any amount.

    (B) THE TWO ESCAPES, BOTH CLOSED, WHICH IS WHAT MAKES THIS MORE THAN A
    RESTATEMENT.
    ESCAPE 1 - BASE CHANGE. Work over F_{p^m} instead. The embedding degree of
    G with respect to F_{p^m} is ord_N(p^m) = k / gcd(k, m). Choosing m = k
    gives embedding degree 1, which LOOKS like a total win. It is not - the
    target field is F_{(p^m)^{k/m}} = F_{p^k}, the same field, so the field DLP
    is the identical computation and the only thing that changed is the name of
    the exponent. THE INVARIANT IS THE TARGET FIELD, NOT k. Any record that
    reports an embedding-degree-1 endpoint obtained by base change as a transfer
    result has made this error, and the campaign has one on file
    (EV-IT-002's planted control, recorded in
    ideas/catalogue-20260805/A4-transfers-lattice.md section 0 as a named
    off-limits defect).
    ESCAPE 2 - THE QUADRATIC TWIST, and this is the sharp one. The twist E^d has
    p + 1 + t rational points, a DIFFERENT order, so it is not in the class -
    and its prime divisors N' are different, so k' = ord_{N'}(p) is genuinely
    unrelated to k and can, in principle, be small. So there IS a nearby curve
    whose embedding degree differs. It is unreachable for a reason that is exact
    and not a matter of cost - there is no F_p-rational homomorphism E -> E^d,
    the two are isomorphic only over F_{p^2}, and the isomorphism does not carry
    E(F_p) into E^d(F_p). The point P simply does not exist on the twist. So
    the closure's boundary is not "no curve has smaller k" - it is "no curve
    that can receive P has smaller k", which is the correct and stronger
    statement.

    (C) WHAT THE CLOSURE DOES NOT SAY. It does not say pairing transfers are
    useless - they work exactly when k is small to begin with. It does not say
    isogenies are useless - they change the j-invariant, the endomorphism-ring
    level, and everything lanes L1, L2 and L11 measure. It says one specific
    cost functional is constant, which under DECOMPOSITION.md's T3 is a
    legitimate closure with a named obstruction FOR THAT FUNCTIONAL, and it
    forecloses the reachability question T5 for this lane entirely - not
    because good curves are hard to reach, but because there are none.

    (D) FORWARD GUIDANCE, REQUIRED BY THE CLOSURE STANDARD. What remains open
    after this record - (i) isogenies NOT defined over F_p, which change the
    rational point count and are therefore not transport maps for the ECDLP
    instance, but whose interaction with the twist and with F_{p^2}-rational
    structure is untouched here; (ii) transfers whose target is not E' but a
    Jacobian obtained by a cover or Weil restriction, where the target's
    embedding degree is a different invariant and must be checked separately
    (KN-TECH-032 explicitly flags this and it is out of this lane); (iii)
    multi-target amortisation of one F_{p^k} precomputation across many targets
    in the same class, which does not need k to vary and is a genuinely
    different question.

  resource_label: >-
    R4 (the isogeny graph / class-group action) composed with R7 (pairings into
    F_{p^k}). Both are genuine non-generic resources; the finding is that the
    R4 resource has zero effect on the R7 cost functional.
  admissibility: admissible
  admissibility_argument: >-
    Admissible - the isogeny graph acts on curves rather than on points of G,
    so it is not covered by H-ENDO-001's scalar-action argument, and the
    embedding degree is not a group-operation output, so it is not covered by
    KN-FIND-b7e091's simulability results. The proposal therefore clears the
    campaign's filter on its face. Its result is nevertheless a closure - the
    admitted resource is shown to leave the target functional exactly
    unchanged. This is the second-best outcome a lane can have and is
    strictly more informative than being filtered out, because it identifies
    WHICH functional the resource fails to move rather than refusing to look.

  discriminated_from:
    - >-
      ideas/catalogue-20260805/A4-transfers-lattice.md items A4-1 and A4-5,
      which already state that k = ord_N(p) is a function of (p, N) and hence
      class-constant, and that base change to F_{p^m} gives embedding degree 1
      over the same field at the same cost. THIS RECORD DUPLICATES BOTH and
      says so. The catalogue is explicitly catalogue-only - it mints no
      identifier, creates no ledger record and was never run. What this record
      adds - (i) the QUADRATIC TWIST as the nearby object where k genuinely
      does differ, which neither A4-1 nor A4-5 mentions and which is the only
      correct nearby-object control for the argument; (ii) the full
      embedding-degree PROFILE over all prime divisors rather than the single
      cryptographic N; (iii) the explicit statement that endomorphism-ring
      level and CM discriminant, which DO vary within a class, have no effect,
      which is the specific question GOAL-ENDO-001 exists to ask and which the
      catalogue predates; (iv) an empirical audit with a broken-arithmetic null.
    - >-
      DECOMPOSITION.md T4, which already states that fixing the class fixes the
      embedding degree. This record supplies the proof, the escapes, and the
      measurement; T4 states it as a [fact] without either.
    - >-
      IDEA-20260807-30868b, which closes the SELF-PAIRING question and uses the
      same class-invariance in its reachability gate. That record's invariant is
      the predicate p = 1 mod N; this record's is the whole functional. They
      share a lemma, not a claim.
    - >-
      Lane L1 (RQ-ICINV-475b5e), the campaign's gating lane, which asks whether
      attack-cost functionals are class-invariant. This record answers YES for
      one functional, with a proof rather than a measurement, and is therefore a
      contribution TO L1 from L8. L1's own functionals (solving degree, relation
      yield, first-fall degree) are untouched here.
    - >-
      NOT the classical transfer. It is a statement about where the classical
      transfer's parameter can be moved to, and the answer is nowhere.

  object_first_candidate:
    tracked_object: >-
      THE EMBEDDING-DEGREE PROFILE (ord_{N_i}(p))_i over the prime divisors N_i
      of the group order, followed along an F_p-isogeny walk.
    lossiness: >-
      Lossy, and in a very strong sense - the entire curve, its j-invariant, its
      Weierstrass coefficients, its endomorphism-ring level and its position in
      every volcano are discarded; a short vector of integers is retained.
    propagation: >-
      Deterministic, and this is the whole finding - the retained vector
      propagates by the IDENTITY map under every one-step operation of the
      isogeny graph. What is discarded (j, End level, coefficients) is discarded
      compatibly with the walk, in the extreme sense that the walk acts trivially
      on what is retained. THE LOSSY-PROJECTION TEST IS PASSED AND THEN
      IMMEDIATELY DEGENERATES - a projection that is lossy but CONSTANT under
      the operation set is a valid object with zero resolving power, and that,
      stated algebraically and at zero compute, is the answer to "is this
      actually new". The catalogue at A4-transfers-lattice.md section 1 makes
      the same observation for the weakness predicate; the profile is its
      vector-valued refinement and it degenerates the same way.
    survival_score: >-
      Survives indefinitely along any F_p-isogeny walk - it never dissolves,
      which is exactly the problem. It changes only when the base field changes
      (where it maps by k -> k/gcd(k,m) while the target field is fixed) or when
      the curve is replaced by its quadratic twist (where it changes completely
      and the point does not come along).

  mechanism: >-
    STEP 1 (zero compute) - write the argument in (A) with quantifiers explicit,
    citing only the easy half of Tate's isogeny theorem (F_p-isogenous implies
    equal point count), which follows from equality of the Frobenius
    characteristic polynomial and does NOT require the converse. Note in the
    record that the converse (equal order implies isogenous), which the
    catalogue's A4-1 leans on, is not needed here.
    STEP 2 (zero compute) - write both escapes in (B), including the explicit
    identity ord_N(p^m) = k/gcd(k,m) and the observation that the field
    F_{(p^m)^{k/gcd(k,m)}} contains F_{p^k}; state the twist obstruction as the
    non-existence of an F_p-rational homomorphism.
    STEP 3 (under one CPU-hour) - the empirical audit. At p in [2^16, 2^22],
    enumerate toy isogeny classes by point-counting a few hundred random curves
    and bucketing by rational point count. Within each bucket of size at least
    two, compute k for every member and check it is constant; compute End-ring
    level indicators (number of rational ell-isogenies for small ell) and
    confirm they DO vary while k does not. Then walk explicitly with small-ell
    Velu steps from a bucket member and confirm the walk never leaves its
    bucket.
    STEP 4 (minutes) - the twist arm. For each audited curve compute its
    quadratic twist, its order p + 1 + t, its prime divisors and their embedding
    degrees, and report the empirical distribution of k' versus k. Report how
    often k' is small when k is large; this quantifies exactly how much is being
    given up by the unreachability of the twist and is the record's one genuinely
    open number.
    STEP 5 (zero compute) - state the closure with the forward guidance in (D).

  novelty_status: duplicate
  novelty_screen:
    method: >-
      Run 2026-08-07. grep -i over ledger/, knowledge/, docs/, analysis/,
      ideas/ for "class invariant", "isogeny class", "ord_N(p)", "embedding
      degree", "quadratic twist", "base change". Reads of DECOMPOSITION.md
      (T1-T5), ideas/catalogue-20260805/A4-transfers-lattice.md (items A4-1,
      A4-5 and the section-1 object table), KN-TECH-032.
    results: >-
      The core claim IS ALREADY IN THIS REPOSITORY TWICE - DECOMPOSITION.md T4
      states it as a [fact] without proof, and A4-1 / A4-5 in the 2026-08-05
      catalogue state it with an argument and with the base-change escape
      already closed. The catalogue's object table lists exactly this object as
      O4, scored "repackaging of O1", and its section-1 analysis reaches the
      same degeneracy conclusion. NOTHING in the repository mentions the
      QUADRATIC TWIST in this context, and nothing states the embedding-degree
      profile over all prime divisors.
    verdict: >-
      DUPLICATE of A4-1/A4-5 (catalogue, unminted, unrun) and of
      DECOMPOSITION.md T4. Filed anyway because the batch brief directs this
      lane to resolve the reverse direction and file it as a closure, because a
      catalogue entry is not a ledger record, and because the twist control and
      the profile refinement are genuine increments. The honest headline is
      that this record CONFIRMS AND SHARPENS existing internal statements
      rather than discovering anything.

  null_object_control: >-
    MANDATORY AND BLOCKING. The audit in Step 3 asserts a negative - "k never
    varies within a bucket" - and such an assertion is worthless unless the
    instrument can be shown to detect variation when it exists.
    NON-ISOGENOUS NULL - pairs of curves with DIFFERENT rational point counts.
    Here k is free to differ and MUST be observed to differ in a substantial
    fraction of pairs. If it does not, the instrument has no resolving power and
    the within-bucket constancy is measuring nothing.
    BROKEN-ARITHMETIC NULL - run the identical bucketing with a deliberately
    corrupted point counter (an off-by-one in the Hasse-interval search). The
    audit must then report bucket-crossing walks. An audit that reports "no
    crossings" even with a broken counter cannot see a crossing at all. This
    control is taken directly from the catalogue's A4-1 and is retained because
    it is the right one.
    DECAY PARAMETER - the walk length. As the number of Velu steps increases
    from 1 to 50, any apparent variation in k must go to zero and STAY at zero.
    A variation that grows with walk length is an arithmetic drift bug, not a
    discovery; a variation that appears at some length and disappears at a
    greater one is the canonical artifact tell.

  assumptions:
    - >-
      [textbook, not transcribed in this corpus] F_p-isogenous curves have the
      same number of F_p-rational points. This is the easy direction of Tate's
      isogeny theorem and follows from equality of the Frobenius characteristic
      polynomial under isogeny. The catalogue records that TATE is untranscribed
      here and owes a KN-LIT entry; this record needs only the easy half and
      says so.
    - >-
      Transport (DECOMPOSITION.md T1) requires gcd(deg phi, N) = 1, which holds
      for all small-ell walks with ell not equal to N. Stated because a walk
      through an N-isogeny would destroy the instance rather than transport it.
    - >-
      The quadratic twist statement uses that E and E^d are isomorphic over
      F_{p^2} but not over F_p for d a non-residue, and that the two point
      counts sum to 2p + 2. Elementary.
    - >-
      Toy scale, p <= 2^22, pure Python. The empirical audit bounds the
      instrument, not the mathematics; the closure in (A) and (B) is symbolic
      and scale-free.

  proof_search_map:
    bottleneck: >-
      The single step "F_p-isogeny implies equal point count implies same N and
      same p". Remove it and the closure evaporates. It is also the step that
      fails for non-F_p-rational isogenies and for the twist, which is why those
      are the two escapes.
    baseline_embedding:
      parameter_slice: >-
        The quadratic twist slice - the closest object to which the conclusion
        does NOT extend. The argument must FAIL there in the exact way
        predicted, i.e. k' differs because the twist's order differs, and it
        must be visible in the audit that k' does in fact differ on real toy
        curves.
      reproduction_check: >-
        A frozen fixture - one toy curve, its twist, both orders, both prime
        factorisations and both embedding degrees, computed and stored; the
        pipeline must reproduce all six integers exactly on re-run.
    observation_collision:
      observable: >-
        The embedding-degree profile vector.
      distinct_preimage_search: >-
        REQUIRED AND CERTAIN TO SUCCEED - every curve in one isogeny class has
        the identical profile, so the fibre of the observable is an entire
        isogeny class, typically of size h(End) which can be large. This
        collision is not a defect, it IS the closure - the observable cannot
        distinguish class members, so it cannot be used to select among them.
        Reporting the class-invariance without exhibiting the fibre size would
        understate how degenerate the observable is.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The fibre of the profile map - the full F_p-isogeny class - together
          with its cardinality h(End(E)), measured at toy scale.
        predicted_gain: >-
          None for an attacker; the gain is that a numerical fibre size makes
          "the observable is constant" quantitative rather than rhetorical.
      - transform: stronger_invariant
        proposed_object: >-
          Replace k by the pair (k, k_twist) - the embedding degrees of E and
          of E^d. This retains strictly more state and is NOT class-constant in
          any useful sense, since the twist of an isogenous curve is isogenous
          to the twist.
        predicted_gain: >-
          None, and the record states why - the twist's k does vary across
          different classes but the pair is still constant along a single class,
          and the twist is unreachable anyway. The transform is recorded as
          considered-and-dismissed rather than omitted.
    quantifier_order: >-
      Claimed - FORALL p > 3, FORALL ordinary E/F_p, FORALL E' F_p-isogenous to
      E, FORALL primes N dividing the group order - ord_N(p) computed on E
      equals ord_N(p) computed on E'. Trivially strong because the quantity does
      not mention the curve at all after the class is fixed.
      NOT claimed - anything about F_{p-bar}-isogenies, about curves over other
      base fields, or about the twist.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The MOV/Frey-Ruck cost functional is constant on an F_p-isogeny class,
        so no isogeny walk improves it." It certifies nothing about other cost
        functionals (that is L1's job), nothing about non-F_p isogenies, and
        nothing about covers or Weil restrictions whose target is a different
        abelian variety.
      nearby_object_control: >-
        THE QUADRATIC TWIST - the closest object where the conclusion fails,
        and the control that separates "no curve has smaller k" from "no
        reachable curve has smaller k". A version of the argument that also
        proved the twist's k equals k would prove too much and is void. The
        audit must EXHIBIT a toy pair with k large and k' small, or the control
        has not been run.
    proof_obligations:
      - claim: >-
          An F_p-isogeny preserves the number of F_p-rational points of the
          curve.
        responsibility: correctness
      - claim: k = ord_N(p) depends only on (N, p).
        responsibility: correctness
      - claim: ord_N(p^m) = k/gcd(k,m) and F_{(p^m)^{k/gcd(k,m)}} contains F_{p^k}.
        responsibility: correctness
      - claim: No F_p-rational homomorphism E -> E^d exists for d a non-residue.
        responsibility: strictness
      - claim: The non-isogenous null exhibits varying k.
        responsibility: baseline
      - claim: The broken-arithmetic null exhibits bucket crossings.
        responsibility: feasibility

  predictions:
    - metric: >-
        number of observed bucket-crossing isogeny walks (a walk whose endpoint
        has a different embedding degree from its start)
      direction: lower
      minimum_effect: >-
        Exactly ZERO out of every walk performed, at every length up to 50 Velu
        steps. A single crossing means either the point counter or the edge
        relation is wrong - most likely the edge relation is using modular
        polynomial roots over F_{p^2} rather than F_p - and is decision-relevant
        as an instrument defect, not as mathematics.
    - metric: >-
        fraction of NON-isogenous curve pairs with differing k
      direction: higher
      minimum_effect: >-
        Substantially above zero, at least 50 percent over 200 pairs. If
        non-isogenous pairs also share k, the audit has no resolving power and
        the within-class result is uninformative.
    - metric: >-
        variation of End-ring level indicators within a bucket, alongside zero
        variation of k
      direction: different
      minimum_effect: >-
        The level indicators must vary in at least one bucket while k does not.
        This is the observation that makes the closure a CM statement rather
        than a triviality - it shows a real structural degree of freedom exists
        inside the class and that this functional ignores it.
    - metric: >-
        fraction of toy curves whose quadratic twist has a substantially
        smaller embedding degree
      direction: different
      minimum_effect: >-
        No target; this is the record's one genuinely open number and it
        quantifies what unreachability costs. Predicted small, since the twist's
        order is as generic as the curve's, but it is measured rather than
        assumed.

  minimal_test:
    design: >-
      STAGE 1 (zero compute): write (A), (B) and the twist obstruction. STAGE 2
      (HARD GATE, minutes): the broken-arithmetic null and the non-isogenous
      null - the instrument must be shown able to see a crossing before any
      absence of crossings is reported. STAGE 3 (under one CPU-hour): bucket
      200-500 toy curves by order at p in [2^16, 2^22], verify k constant per
      bucket, verify End-level indicators vary, and walk with small-ell Velu
      steps confirming no bucket is left. STAGE 4 (minutes): the twist arm.
      THE CHEAPEST DECISIVE STEP IS STAGE 1 - the closure is symbolic and costs
      nothing; Stages 2-4 exist to certify the instrument and to quantify the
      twist gap, not to establish the closure.
    controls:
      - non-isogenous null - k must be seen to vary
      - broken point counter - bucket crossings must appear
      - walk-length sweep 1 to 50 steps - any apparent variation must vanish and stay vanished
      - quadratic twist arm - k' must be seen to differ from k on at least one pair
      - End-level stratification - levels must vary where k does not
    required_metrics:
      - >-
        per curve, the tuple (p, trace t, group order, its prime factorisation,
        and k for each prime divisor)
      - per bucket, the number of members and the variance of k (predicted exactly zero)
      - per bucket, End-level indicators and their variance (predicted non-zero)
      - count of bucket-crossing walks, by walk length
      - for the twist arm, the joint distribution of (k, k')
      - pass or fail of each null

  falsification_conditions:
    - >-
      Any observed F_p-rational, N-coprime isogeny whose endpoints have
      different embedding degrees. Under (A) this is impossible, so it indicates
      the harness's edge relation is not an F_p-isogeny or the point counter is
      wrong. Decision-relevant as an instrument correction and must be routed as
      one, never absorbed.
    - >-
      The broken-arithmetic null failing to produce crossings. The audit cannot
      detect what it claims to exclude; nothing is reported.
    - >-
      The non-isogenous null showing k constant across different orders. Same
      disposition.
    - >-
      Failure to exhibit any toy pair (E, E^d) with materially different
      embedding degrees. The nearby-object control has not been run, and the
      claim must then be stated in the weaker form "no curve in the class" with
      the twist boundary unexhibited.

  confounders:
    - >-
      Edge relation over the wrong field. Modular-polynomial roots can lie in
      F_{p^2}; an implementation that accepts them builds a graph whose edges
      are not F_p-isogenies, and it WILL produce apparent bucket crossings. This
      is the single most likely source of a false positive and must be checked
      before any crossing is reported as mathematics.
    - >-
      Small-p coincidences. At p near 2^16 many curves share orders by accident
      and buckets conflate genuinely different classes when the orders factor
      the same way. The audit must verify class membership by an explicit walk,
      not by order equality alone - which is also why only the easy half of
      Tate's theorem is used.
    - >-
      Cofactor primes. A bucket may contain curves whose group order has several
      prime divisors; the profile must be compared as a vector with matched
      ordering, not as a single k.
    - >-
      Reading the closure as "isogenies are useless". They are useless FOR THIS
      FUNCTIONAL. Lanes L1, L2 and L11 measure functionals that are not known to
      be constant, and this record must not be cited against them.

  reachability_gate: >-
    THIS RECORD IS THE REACHABILITY GATE, ANSWERED IN ITS STRONGEST FORM.
    DECOMPOSITION.md T5 asks whether a cost-minimising curve in the class is
    reachable - by random walk (goodness common) or by a local test (goodness
    detectable). Neither question arises, because the minimiser is every curve
    and the minimum equals the value at the start. Reachability cost is
    irrelevant when the target set is the whole class. The only object outside
    the class with a different value is the quadratic twist, whose reachability
    cost is not high but INFINITE - no F_p-rational map carries P there. This
    is the cleanest possible resolution of T5 for a lane, and it is negative.

  target_complexity:
    time_exponent: >-
      NO ATTACK. The functional that was to be minimised is constant, so the
      best achievable exponent along this route equals the starting one. For a
      generic curve that is the rho baseline 1/2, since the transfer is
      infeasible at large k (see IDEA-20260807-5f24d7 for why the binding
      obstruction is representability rather than index-calculus cost).
    memory_exponent: >-
      O(1) for the argument; the audit stores a few hundred toy curves.
    best_known: >-
      Rho at 0.886 sqrt(N) with O(1) memory (KN-TECH-001, KN-TECH-006), with
      the sqrt(|Aut|) discount on CM curves (KN-TECH-018); BSGS at sqrt(N) time
      and memory (KN-TECH-031); MOV/Frey-Ruck for small k (KN-TECH-032).
      Ordinary-curve isogeny path finding at Otilde(p^{1/4}) low storage is the
      relevant cost for any walk, and this record shows that cost buys nothing
      here.
    hidden_overhead: >-
      None claimed. The one disclosure is that "the class" means the
      F_p-isogeny class; F_{p-bar}-isogeny classes are larger and this record
      says nothing about them.
    tradeoff_note: >-
      Not applicable - no algorithm is produced. Worth recording that a walk
      costing Otilde(p^{1/4}) to change nothing is a pure loss, which is the
      quantitative form of the closure.

  dominated_by: >-
    Every frontier row checked on time, memory and data. This record mounts no
    attack and is dominated by rho at 0.886 sqrt(N) time and O(1) memory
    (KN-TECH-001, KN-TECH-006); by automorphism-discounted rho on CM curves,
    better by at most sqrt(6) (KN-TECH-018); by BSGS at 2 sqrt(N) time and
    sqrt(N) memory (KN-TECH-031) with n^{2/3+o(1)} full cost (KN-TECH-035); and
    by MOV/Frey-Ruck where k is small already (KN-TECH-032). It is additionally
    dominated as an ARGUMENT by DECOMPOSITION.md T4 and by
    ideas/catalogue-20260805 A4-1/A4-5, which state the core claim earlier; it
    dominates them only on the twist control and the profile refinement.
  sota_delta: >-
    Zero speedup on every axis. Quantitative deltas that are non-zero - it
    converts a [fact]-tagged assertion (T4) and an unrun catalogue item (A4-1)
    into a proof with two escapes closed and a nearby-object control; it
    replaces "the embedding degree is class-determined" with the strictly
    stronger "the entire embedding-degree profile and the target field F_{p^k}
    are class-determined, and base change divides k by gcd(k,m) while leaving
    the target field and its DLP cost identical"; and it prices an isogeny walk
    for this purpose at Otilde(p^{1/4}) for exactly zero gain.

