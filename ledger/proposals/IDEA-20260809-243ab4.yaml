idea:
  id: IDEA-20260809-243ab4
  question_id: RQ-CRYPTO-001
  added: '2026-08-09'
  title: 'The classical cost model was deliberately unified across every lane and the quantum
    one was never unified anywhere: MAXDEPTH appears in zero knowledge/ and zero docs/ files,
    the NIST category labels carrying six goals'' headline claims are RECALLED-UNVERIFIED, and
    eleven papers on quantum ECDLP circuits are cited by nothing while every ECDLP baseline is
    classical'
  class: cost-model
  claim: 'KN-TECH-044 exists, in its own words, ''because the corpus previously charged memory
    on the ECDLP side and not on the lattice side, and the two halves of the program should not
    use different accounting''. ON THE QUANTUM AXIS THE CORPUS DOES EXACTLY THAT. It holds three
    mutually non-comparable accountings and no unifying entry: KN-TECH-037 (logical-qubit and
    Toffoli counts, applicability ''no error correction''), KN-TECH-038 (core-SVP 2^{0.265b}),
    and KN-TECH-051 (a CSIDH model that calls itself ''the worked example of a cost-model convention
    moving a security level without any algorithmic disagreement''). No record states whether
    these share a basis. VERIFIED: MAXDEPTH -- the parameter NIST''s categories are defined against
    -- appears in 15 ledger files and ZERO times in knowledge/ and ZERO times in docs/. H-SLHDSA-3a403a
    says it plainly: ''NIST MAXDEPTH values and the AES-referenced category definitions are RECALLED-UNVERIFIED
    and enter only as ROW LABELS.'' Six goals carry nist_track: selected_algorithm and 13 name
    a category. AND THERE IS NO ECDLP QUANTUM QUESTION AT ALL: the corpus carries a dense 2026
    cluster (KN-LIT-1759, KN-LIT-1882, KN-LIT-7657, KN-LIT-1845, plus verification artifacts)
    cited only by generated index files, and no research question asks what ECDLP costs a quantum
    adversary.'
  mechanism: 'Write the quantum analogue of KN-TECH-044 and test it against the corpus. Step 1,
    zero compute: tabulate every quantum figure already held as (time unit, memory unit, memory
    charged?, error correction charged?, depth cap?) and check MECHANICALLY whether any two share
    a basis. The predicted answer is no, and that IS the deliverable. Step 2: retrieve the NIST
    category definitions from primary source -- measured reachable on 2026-08-07, csrc.nist.gov
    returns 200 and FIPS 203/204/205 download in full -- and file them as a KN-TECH so 15 ledger
    files'' row labels stop being recollection. Step 3: transcribe a per-source table of (logical
    qubits, Toffoli/T count, T-depth, circuit model, error-correction assumption) at 256-bit prime
    curves, every figure tagged relayed-versus-derived at claim tier theory. Step 4, the discriminating
    derivation this program is uniquely placed to run at no compute: take each non-generic resource
    in the GOAL-ENDO-001 decomposition and ask whether it reduces the modular-inversion term KN-LIT-1882
    identifies as the space bottleneck. A NEGATIVE IS THE USEFUL RESULT -- it would establish
    with citations that this program''s entire lever set is classical-only, a scope statement
    every future exponent claim should carry.'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-09'
    grep_results:
    - 'RQ-ALECF-001 is archaeology, not cost: its motivation is ''Import completed Autolab cryptanalysis
      campaigns'', its curve_families is the single token autolab_imported, and H-ALECF-001''s
      falsification conditions are file-availability checks.'
    - RQ-CRYPTO-001 fixes the comparator as classical Pollard rho, so the program's headline target
      is defined such that the quantum axis cannot appear in its answer.
    - IDEA-20260807-6c89a8 is scoped to RQ-SSIQ-9702af and replaces one claw step inside one goal's
      lever map; IDEA-20260807-726e55 is the CSIDH collimation equation; IDEA-20260807-abacec
      is a DCP reduction-reach map. None concerns ECDLP circuit cost and none is the cross-lane
      entry.
    - Neither existing record touches MAXDEPTH or the category definitions.
    conclusion: Screened against all 459 records in ledger/proposals, 271 in ledger/hypotheses
      and knowledge/; external novelty UNVERIFIED and not claimed.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS as the primary lens: Shor''s algorithm as an
      object of study, and every classical lever already mapped. The object is the ACCOUNTING.'
    tracked_object: Per quantum cost figure, the five-tuple (time unit, memory unit, memory charged?,
      error correction charged?, depth cap?).
    one_step_propagation_rule: Two figures are comparable iff their five-tuples agree; comparability
      is an equivalence relation and composes exactly.
    newness_score: Nil as mathematics. The content is that the program built KN-TECH-044 precisely
      to stop two halves using two accountings, and then did it again on the quantum axis without
      noticing.
  lossy_projection_identifiability_audit:
    projection: a quantum cost claim -> its accounting five-tuple.
    what_is_discarded: The circuit and the algorithm.
    is_it_only_a_change_of_coordinates: 'NO -- the five-tuple is far coarser than the figure.
      Honest caveat: a WEAK object that yields comparability verdicts, never mathematics.'
    mirror_failure_check: CHECKED. The tabulation must be able to report 'these two DO share a
      basis'. KN-TECH-037 and KN-TECH-038 are known to differ on error correction, so at least
      one incomparable pair is forced -- but agreement elsewhere is possible and would be the
      reassuring outcome.
  null_object_control:
    primary_null: RESTATE ONE ALREADY-PUBLISHED FIGURE under an explicit depth-capped model --
      the SQIsign NIST-I figure GOAL-SSI-001's next_action records as owed a correction. IF IT
      DOES NOT MOVE, the disclaimer boilerplate in 15 files was harmless and the entry should
      say so plainly rather than manufacture a concern.
    secondary_nulls:
    - 'FORCED INCOMPARABILITY: KN-TECH-037 (no error correction) and any error-corrected figure
      must be reported incomparable.'
    - 'SOURCE-BLOCKED DISCIPLINE: any category definition not obtained from primary source is
      marked, never recalled.'
  assumptions: []
  predictions:
  - metric: number of pairs among the corpus's quantum figures that share an accounting basis
    direction: lower
    minimum_effect: Zero comparable pairs would establish the absence the record claims; any nonzero
      count narrows it.
  - metric: movement in the SQIsign NIST-I figure under an explicit depth cap
    direction: different
    minimum_effect: Any movement makes the depth cap load-bearing for a published number.
  minimal_test:
    design: Tabulate all in-corpus quantum figures into five-tuples; retrieve and file the NIST
      category definitions; transcribe the ECDLP circuit table from the four uncited KN-LIT entries;
      run the depth-cap null on one published figure.
    controls:
    - depth-cap restatement null
    - forced incomparability pair
    - SOURCE-BLOCKED discipline
    required_metrics:
    - five-tuple per figure with provenance
    - comparability matrix
    - filed category definitions
    - ECDLP circuit table, relayed-vs-derived
  falsification_conditions:
  - 'Every quantum figure already shares a basis: the concern is unfounded and the entry records
    that, which is a clean negative.'
  - 'The depth-cap restatement does not move the published figure: the boilerplate was harmless.'
  - 'No non-generic lever in the GOAL-ENDO-001 decomposition touches the modular-inversion bottleneck:
    the program''s lever set is classical-only, which is the scope statement every future exponent
    claim should carry -- and is the expected and most useful outcome.'
  confounders:
  - Quantum cost models are a fast-moving literature; a table is dated and must say so.
  - Relayed figures are not this program's results until primary sources are filed.
  - MAXDEPTH is a policy parameter, not a physical one; filing its definition is bookkeeping,
    not validation of the categories themselves.
  interpretation_limits:
  - This is an accounting record. It proposes no quantum algorithm and claims no exponent.
  - A classical-only scope statement is a limitation on the program's claims, not a claim about
    quantum hardness.
  heuristic_assumptions:
  - id: HEUR-QCOST-1
    statement: Published quantum ECDLP circuit costs can be tabulated into a common five-tuple
      without re-deriving the circuits.
    rigorous_support: None; papers differ in what they report and some tuples will be incomplete.
    validation_plan: Mark incomplete tuples explicitly; an incomplete table is the finding.
  target_complexity:
    time_exponent: Shor is polynomial for ECDLP; this record prices the CONSTANT and the resource
      profile, and claims no improvement.
    memory_exponent: Logical-qubit count is the binding term and is reported as a row.
    best_known: Published quantum ECDLP circuit estimates, currently relayed and uncited here.
    hidden_overhead: Error correction, which KN-TECH-037 explicitly does not charge.
    tradeoff_note: A qubit count quoted without its error-correction assumption is not a cost.
  dominated_by: 'No attack proposed. Rows checked: Shor for ECDLP (polynomial time, large constant);
    Pollard rho classical p^{1/2}; Grover-accelerated generic search; the three in-corpus quantum
    accountings KN-TECH-037/038/051. No row is added.'
  sota_delta: ZERO. Fixes a scope error running through the program -- exponent claims stated
    against a classical baseline while the corpus's own reading says the operative adversary for
    deployed ECC and every NIST-category claim is quantum. Supplies the ECDLP counterpart to the
    isogeny-side row already filed as IDEA-20260807-6c89a8.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 0.9 that the comparability matrix comes out mostly empty, confirming
    the absence. 0.95 that the NIST definitions are retrievable. 0.7 that the classical-only scope
    statement is the outcome of step 4 -- endomorphism and factor-base structure have no evident
    purchase on a modular-inversion circuit. 0.15 that the depth cap moves a published figure
    materially.
