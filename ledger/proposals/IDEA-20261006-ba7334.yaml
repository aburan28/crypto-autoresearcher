idea:
  id: IDEA-20261006-ba7334
  question_id: RQ-GFPN-c01af8
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Translation product x(P+T) * x(P) equals the curve constant b on
    every affine F_11-point of the first admissible double-odd curve
  class: control
  claim: >-
    Let E be the first nonsingular curve y^2 = x(x^2 + a x + b) over
    F_11, in lexicographic order of (a, b), with b not 0. The point
    T = (0, 0) lies on E. The claim is that E has at least one affine
    F_11-point P distinct from T, and that every such point satisfies
    x(P + T) * x(P) = b, where the sum is the elliptic group law.
    The negative observation is one affine point, distinct from T,
    whose product is not b. If no admissible curve exists, or the only
    affine F_11-point is T, the cell is unmeasured. No monomial is
    counted. No ideal degree is computed. No discrete logarithm is
    transferred. The opened Gaudry exponent at n = 5 stays 8/5.
  mechanism: >-
    OBJECT FRAME. Representation: affine x-coordinates on a double-odd
    model over the prime field F_11. Operation set: translation by the
    rational point T = (0, 0). On this model the group law sends x to
    b/x when x is not 0, so the product x(P+T) * x(P) is the constant
    b. The projection keeps that product and discards y. A single
    product other than b is the negative: the constant in the
    involution is not b on this curve. The test uses every affine
    F_11-point, a set of size at most 12. It does not pass to a
    degree-5 extension and does not form a ratio of generator supports.
  novelty_status: unverified
