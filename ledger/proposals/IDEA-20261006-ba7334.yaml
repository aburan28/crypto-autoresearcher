  assumptions:
    - The model is y^2 = x(x^2 + a x + b) with a, b in F_11 and b not 0. Singular curves, those with a repeated root of the cubic, are skipped.
    - T = (0, 0) is on every such curve. The search still doubles T and requires the double to be the point at infinity.
    - A point with x = 0 is T itself and is not a test point. Every other affine point has x not 0, so the product is defined.
  proof_search_map:
    not_applicable_reason: >-
      A pointwise check of one group-law identity over F_11. Not a
      proof of a decomposition cost.
  predictions:
    - metric: product_failures
      direction: lower
      minimum_effect: >-
        The number of affine test points is at least 1, and the
        number of products not equal to b is 0.
  minimal_test:
    design: >-
      Walk (a, b) with a from 0 to 10 and, for each a, b from 1 to 10.
      Skip singular curves. Take the first remaining curve. Enumerate
      E(F_11). Double T. For every affine point other than T, add T
      with a second implementation of the group law and compare the
      product of the two x-coordinates with b. Do not count monomials.
    controls:
      - The second addition.
      - The doubling of T.
      - The nonsingularity check.
    required_metrics:
      - (a, b)
      - the number of affine test points
      - the number of products not equal to b
      - whether the second addition agrees
  falsification_conditions:
    - >-
      The instrument checks pass, there is at least one affine test
      point, and at least one product is not b. That is the negative
      observation.
    - The second addition disagrees. The products are void.
  confounders:
    - A curve whose only affine point is T has nothing to test. That is unmeasured, not a passed identity.
    - Testing the identity on a singular curve voids the cell.
    - The figures 2^142 and 2^130 are not inputs.
  interpretation_limits:
    - One curve over F_11. No transfer to a degree-5 extension and no transfer to p = 2^64 - 2^32 + 1.
    - A product equal to b is not a monomial ratio and is not an ideal degree.
    - The exponent 8/5 is unchanged.
  heuristic_assumptions:
    - id: H1
      statement: >-
        On the first nonsingular double-odd curve over F_11 with b
        not 0, translation by (0, 0) acts on every other affine
        F_11-point by x |-> b/x, so the product of the two
        x-coordinates equals b.
      rigorous_support: >-
        The identity is the group law on this model, checked rather
        than assumed. KN-OPEN-9b4a2b, opened, uses x |-> b/x and does
        not record this pointwise check. KR-IC-955fd6, opened, does
        not state the product over F_11.
      validation_plan:
        sampling: Every affine F_11-point other than T. The set is finite and is listed in full.
        comparison: Each product against the constant b.
        tail_check: A curve with no test point stays unmeasured. It is not scored as zero failures.
        parameters: p = 11, one curve, two additions per test point.
