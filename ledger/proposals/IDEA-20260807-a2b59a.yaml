idea:
  id: IDEA-20260807-a2b59a
  question_id: RQ-VOLC-f6253b
  added: '2026-08-07'
  title: >-
    THE TWO-ell MISMATCH CONTROL: one curve carries two contradictory depths --
    crater in the ell_1-volcano, floor in the ell_2-volcano -- so a balanced 2x2
    factorial over (level at ell_1) x (level at ell_2) is the only design that
    can attribute a measured effect to the ell a functional is DEFINED at rather
    than to depth in general, and its pre-registered signature is a single main
    effect with no cross term
  class: control

  claim: >-
    (A) THE FACT THE DESIGN EXPLOITS. For distinct primes ell_1, ell_2 dividing
    c, the coordinates v_{ell_1}(f_E) and v_{ell_2}(f_E) are INDEPENDENT: an
    ell_1-isogeny changes only the ell_1-adic valuation of the conductor. So
    within one isogeny class there exist curves realizing all four combinations
    (crater, crater), (crater, floor), (floor, crater), (floor, floor), provided
    both volcanoes have positive height, and the four cells can be POPULATED
    DELIBERATELY by ascending or descending in one volcano while holding the
    other fixed. THE SAME CURVE IS SIMULTANEOUSLY AT THE TOP OF ONE VOLCANO AND
    THE BOTTOM OF ANOTHER. Any statement of the form "E is deep" or "E is at the
    crater", made without naming ell, is therefore not merely imprecise: it is
    ill-posed.

    (B) WHAT THE DESIGN DECIDES, AND IT IS A THREE-WAY DECISION. Let F be a
    cost functional and suppose F is nominally an ell_1-local quantity -- for
    instance anything built on E[ell_1], on rational ell_1-isogeny counts, or on
    an ell_1-translation-symmetrized factor base as in IDEA-20260807-cbe8c1.
    Measure F across the balanced 2x2. Exactly three signatures are possible and
    they carry different meanings:
      (S1) MAIN EFFECT ON ell_1 ONLY, no ell_2 main effect, no interaction.
        F reads the ell it is defined at. The mechanism is ell-local and the
        level label is doing real work. This is the signature
        IDEA-20260807-cbe8c1 predicts for its own mechanism.
      (S2) MAIN EFFECTS ON BOTH, of magnitudes ordered by log ell_1 versus
        log ell_2. F reads the SIZE of the order (|disc O_f| = f^2 |D_K|, or
        h(disc O_f)) and the ell-labels are just a way of moving f. The
        mechanism is not ell-local and every "the ell_2-volcano matters" claim
        is a restatement of "f got bigger".
      (S3) MAIN EFFECT ON ell_2 ONLY, or an interaction with no main effects.
        F does NOT read what it claims to read. Either the functional is
        misattributed or the pipeline is leaking -- for example the factor-base
        construction is correlated with j, and j moves whenever any isogeny is
        taken. THIS IS THE ARTIFACT SIGNATURE and it is the reason the control
        exists.
    No single-ell design distinguishes these, because in a single-ell design the
    ell being varied and the conductor being changed are perfectly confounded.

    (C) WHY THIS IS A CONTROL AND NOT A HYPOTHESIS. It asserts nothing about
    whether any effect exists. It is the instrument that makes an effect
    ATTRIBUTABLE if one is found, and it is cheap: four cells, a handful of
    curves per cell, the same frozen measurement the rest of the lane already
    runs. Under docs/inventor-protocol.md section 3 ("controls before belief") no
    positive from IDEA-20260807-cbe8c1 or IDEA-20260807-3f5545 should be believed
    until it has passed this factorial, and this record exists so that
    requirement is written down before any positive is in hand.

  resource_label: 'audit: consumes no resource (control design); the stratifying variables are R3/R4, the measured functionals are R1/R2/R5'
  admissibility: admissible
  admissibility_argument: >-
    A control design consumes no resource and mounts no attack; it constrains the
    interpretation of other proposals. The measured functionals are restricted,
    by the same blocking rule as IDEA-20260807-3f5545, to quantities that do not
    factor through the abstract triple (G, P, Q). Triple-factoring functionals
    (rho, BSGS) are measured only as instrument checks and are REQUIRED to show
    no effect in any cell, by IDEA-20260807-5cabfc; an effect there is a bug
    signature, not a finding.

  discriminated_from:
    - >-
      IDEA-20260807-3f5545 (complete-class level-vector stratification). That
      record is OBSERVATIONAL: it takes the whole class as it comes and
      decomposes variance, gaining full coverage of the level lattice but with
      cell counts proportional to h(f^2 D_K), hence wildly unbalanced and with
      the crater possibly a single curve. This record is DESIGNED and BALANCED:
      equal curves per cell, only four cells, and it can therefore estimate an
      INTERACTION, which an unbalanced observational design estimates poorly. Run
      3f5545 for coverage and this for attribution.
    - >-
      DECOMPOSITION lane L4's "phi-orbit versus size-matched random factor base"
      control. That control isolates EQUIVARIANCE from SIZE on one curve. This
      one isolates ell-LOCALITY from ORDER-SIZE across curves. Different
      confound, different axis, and both are needed by IDEA-20260807-cbe8c1,
      which uses a torsion-stable factor base (needing L4's control) at a level
      determined by the ell_1-volcano (needing this one).
    - >-
      H-ECTD-19017a. That design varies ONE conductor step at a time and compares
      vertical against horizontal ratios. It cannot distinguish S1 from S2,
      because a single conductor step changes both the ell-local structure and f.
      This record is the missing arm for that hypothesis and would sharpen a
      positive there considerably; it neither confirms nor pre-empts it.
    - >-
      IDEA-20260805-38aebb, which predicts S2 for endomorphism-supply functionals
      by an exact identity in the scalar f. This record is the empirical test that
      would confirm S2 for the R1 functionals 38aebb does not cover, so a clean
      S2 here would EXTEND that identity's reach rather than contradict it.

  object_first_candidate:
    tracked_object: >-
      THE ORDERED PAIR (v_{ell_1}(f_E), v_{ell_2}(f_E)) -- two coordinates of the
      level vector, deliberately decorrelated by construction -- followed across a
      designed 2x2 grid of curves in one isogeny class.
    lossiness: >-
      LOSSY: the pair discards every other coordinate of the conductor, the
      horizontal position on each crater, j, (a, b) and all of G. Fibres are
      large (size h(f^2 D_K) for the corresponding f), so it is emphatically not a
      change of coordinates. COMPATIBILITY: an ell_1-isogeny moves the first
      coordinate by exactly +/- 1 or 0 and leaves the second EXACTLY fixed --
      that orthogonality is the entire content of the object and it is what makes
      the factorial possible at all. A projection whose coordinates were coupled
      would not admit a factorial design.
    propagation: >-
      Deterministic and coordinate-wise, as above. One step in the ell_1-graph
      moves only the first coordinate; one step in the ell_2-graph moves only the
      second. The design walks the grid by composing such steps.
    survival_score: >-
      Survives as long as both volcanoes have positive height, i.e. as long as
      ell_1 ell_2 | c. Dies when either height is zero -- and that degenerate
      case is itself null N2 below, so the death condition is repurposed as a
      control.

  mechanism: >-
    STEP 1 -- CLASS SELECTION. Find a toy class whose conductor c is divisible by
    two distinct small primes, ideally with v_{ell_1}(c) >= 1 and
    v_{ell_2}(c) >= 1 (heights at least 1 in both). Record the search density.
    STEP 2 -- CELL POPULATION BY DESIGNED WALKS. Start from any curve. Use the
    ascent/descent machinery of IDEA-20260807-bb03d3 to reach each of the four
    cells: ascend in ell_1 and ell_2 to get (crater, crater); from there descend
    once in ell_2 only to get (crater, floor); and so on. Every move is verified
    to change only the intended coordinate, by re-measuring BOTH coordinates
    after every step. THIS VERIFICATION IS THE DESIGN'S LOAD-BEARING STEP: if a
    move changes both coordinates, the factorial is broken and the cells are not
    what they are labelled.
    STEP 3 -- REPLICATION WITHIN CELL. Each cell is a Cl(O_f)-torsor of size
    h(f^2 D_K), so populate each cell with r >= 8 DISTINCT curves reached by
    horizontal walks of matched length. This is what gives the design a
    within-cell error term; without it the factorial has zero degrees of freedom
    for error and is uninterpretable.
    STEP 4 -- MATCHED MEASUREMENT. Identical frozen protocol per curve: factor
    base of declared size, m = 3 Semaev decomposition measurement, Groebner wall
    time, basis size, basis max total degree, decomposition yield, plus the
    ell_1-specific functional under test (for instance the
    translation-symmetrized cost of IDEA-20260807-cbe8c1) and its ell_2 analogue.
    STEP 5 -- ANALYSIS. Two-way layout with replication: estimate both main
    effects and the interaction, each in units of the within-cell error. Report
    the S1/S2/S3 verdict, with the ratio of the two main effects compared against
    log ell_1 / log ell_2 for the S2 test. Then run the label-permutation null
    within the design.

  novelty_status: novel
  novelty_screen:
    method: >-
      Grep tool (ripgrep) on 2026-08-07 over ledger/, knowledge/, docs/,
      analysis/ for "factorial", "2x2", "interaction", "main effect",
      "two primes", "different ell", "crater". Read in full: DECOMPOSITION.md,
      RQ-VOLC-f6253b, H-ECTD-19017a, IDEA-20260805-38aebb.
    results: >-
      "factorial", "main effect" and "interaction" (in the experimental-design
      sense): ZERO hits in ledger/ and knowledge/. "crater": 9 occurrences across
      4 ledger files, none in a multi-ell context. The DECOMPOSITION's L2 entry
      speaks of "the ell-volcano for small ell | f" in the singular throughout.
      No record in this repository observes that a curve carries different levels
      in different ell-volcanoes, or uses that fact as a control.
    verdict: >-
      NOVEL WITHIN THIS CORPUS, with the honest qualifier that a 2x2 factorial is
      elementary experimental design and the independence of the conductor's
      ell-adic coordinates is an immediate consequence of Kohel's theorem. No
      claim of novelty against the external literature is made and none was
      checked. What is new here is the RECOGNITION that this program's own
      single-ell framing is confounded, and the specific S1/S2/S3 attribution
      rule.

  null_object_control: >-
    (N1) LABEL-PERMUTATION NULL within the design: permute the four cell labels
      among the 4r measured curves, refit, and report each effect's percentile.
      Blocking.
    (N2) THE DEGENERATE-HEIGHT NULL: repeat the whole design in a class where
      v_{ell_2}(c) = 0, so the ell_2 factor CANNOT vary. The design must then
      report an ell_2 main effect indistinguishable from zero by construction. If
      it does not, the cell-population machinery is mislabelling curves and the
      whole factorial is void. This is the cheapest possible test of the
      instrument and it is blocking.
    (N3) THE SWAP CONTROL: run the identical analysis with the roles of ell_1 and
      ell_2 exchanged and with an ell_2-defined functional. S1 must then appear on
      the ell_2 factor. A functional that always shows a main effect on ell_1
      regardless of which ell it is defined at is reading something else.
    (N4) WITHIN-CELL SPREAD across the r horizontal replicates: the error term,
      and simultaneously a measurement of crater homogeneity that feeds
      IDEA-20260807-bb03d3's O1/O2 question at no extra cost.
    DECAY PARAMETER: the volcano heights (v_{ell_1}(c), v_{ell_2}(c)). Every
    effect must vanish in the coordinate whose height is zero. An effect that
    survives a height-zero coordinate is the canonical artifact tell and voids the
    run.

  assumptions:
    - >-
      Kohel's stratification and the coordinate-wise independence of ell-adic
      conductor valuations. RECALLED, UNVERIFIED (KN-LIT-360, not read); the
      independence is verified operationally in Step 2 by re-measuring both
      coordinates after every move, which is stronger than citing it.
    - >-
      Each cell is nonempty. This requires ell_1 ell_2 | c and is checked
      arithmetically before any curve is built; classes failing it are discarded
      and the discard rate is reported.
    - >-
      Horizontal walks mix well enough within a cell that the r replicates are
      approximately independent. GRH-conditional rapid mixing of the Cl(O) Cayley
      graph (DECOMPOSITION T5, cited not proved). Operationalized by increasing
      walk length until the within-cell spread saturates, and reporting the
      saturation curve.
    - >-
      Toy scale, p <= 2^16, ell_1, ell_2 in {2, 3, 5}, m = 3, pure Python.
    - >-
      Groebner metrics are implementation-bound proxies (harness/semaev.py).

  proof_search_map:
    not_applicable_reason: >-
      Purely empirical control design. It proves nothing, claims no bound, and
      constructs no certificate; it constrains the attribution of effects other
      records may report. The one mathematical fact it uses -- coordinate-wise
      independence of the conductor's ell-adic valuations under ell-isogenies --
      is inherited from IDEA-20260807-5cabfc's and IDEA-20260807-b1b604's proof
      obligations and is additionally verified operationally per move.

  predictions:
    - metric: >-
        change in v_{ell_2}(f_E) across an ell_1-isogeny step, over every move
        made while populating the grid
      direction: different
      minimum_effect: >-
        EXACTLY ZERO on 100 percent of moves. This is the design's validity
        condition, not a statistic. A single move that changes both coordinates
        halts the line.
    - metric: >-
        ell_1 main effect, ell_2 main effect, and interaction for an
        ell_1-defined functional, each in units of the within-cell error
      direction: different
      minimum_effect: >-
        PRE-REGISTERED S1/S2/S3 RULE. S1: |ell_1 effect| >= 3 within-cell errors
        AND |ell_2 effect| <= 1 AND |interaction| <= 1. S2: both main effects
        >= 3 errors with their RATIO within 30 percent of log ell_1 / log ell_2.
        S3: |ell_2 effect| >= 3 errors while |ell_1 effect| <= 1, or an
        interaction >= 3 errors with both main effects <= 1. Anything else is
        INCONCLUSIVE by prior agreement.
    - metric: >-
        ell_2 main effect in the degenerate-height null N2
      direction: different
      minimum_effect: >-
        Indistinguishable from zero (<= 1 within-cell error). A nonzero effect
        where the factor cannot vary is proof the cells are mislabelled and voids
        every result in the design.
    - metric: >-
        within-cell spread across r horizontal replicates, as a function of walk
        length
      direction: different
      minimum_effect: >-
        Must SATURATE. A spread that keeps growing means the horizontal walk has
        not mixed, the replicates are not independent, and the error term is
        understated -- which would inflate every effect's significance. Report
        the saturation length.
    - metric: >-
        matched rho and BSGS counts across the four cells
      direction: different
      minimum_effect: >-
        ZERO effect, required by IDEA-20260807-5cabfc. Instrument check; a
        nonzero result voids the run set rather than supporting a finding.

  minimal_test:
    design: >-
      STAGE 1 (minutes): class selection arithmetic for ell_1 ell_2 | c.
      STAGE 2 (hours): populate the four cells with r = 8 replicates each, using
      the ascent/descent machinery, re-measuring BOTH coordinates after every
      move (HARD GATE).
      STAGE 3 (hours): the frozen measurement on all 32 curves plus the same on
      the N2 degenerate class.
      STAGE 4 (minutes): two-way analysis with replication; S1/S2/S3 verdict;
      permutation null; swap control N3.
      TOTAL: 32 to 64 Groebner solves plus the walks. This is the CHEAPEST
      attribution instrument in the batch and it should gate every positive.
    controls:
      - label-permutation null within the design (N1, blocking)
      - degenerate-height class where ell_2 cannot vary (N2, blocking)
      - swap control with an ell_2-defined functional (N3)
      - within-cell horizontal replicates as the error term (N4)
      - matched rho and BSGS as an instrument check that must show no effect
      - per-move verification that only the intended coordinate changed
    required_metrics:
      - (v_{ell_1}, v_{ell_2}) measured independently after every move
      - the frozen functional vector per curve, per cell
      - both main effects, the interaction, and the within-cell error
      - permutation percentiles for each effect
      - within-cell spread versus walk length (saturation curve)
      - rho and BSGS counts per curve
      - discard rate of classes failing ell_1 ell_2 | c

  falsification_conditions:
    - >-
      Any move that changes both coordinates. The design's premise is wrong or
      the isogeny machinery is broken; halt.
    - >-
      A nonzero ell_2 effect in N2. Cells are mislabelled; every result in the
      design is void.
    - >-
      S3 (the artifact signature) on a functional that IDEA-20260807-cbe8c1
      claims is ell_1-local. That claim's mechanism is not what is being measured
      and the positive there must be withdrawn or re-explained. THIS IS THE
      OUTCOME THE CONTROL EXISTS TO PRODUCE, and producing it is a success of the
      control, not a failure of the batch.
    - >-
      All effects below the permutation null. No attribution is possible; report
      "no effect large enough to attribute, with achieved power X". The power
      statement is mandatory since with 4 cells and r = 8 the design is small.
    - >-
      Within-cell spread failing to saturate at the longest affordable walk. The
      error term is unreliable and no effect may be declared significant.

  confounders:
    - >-
      LOW POWER. Four cells with r = 8 gives 28 error degrees of freedom, which
      detects effects of about 1.5 within-cell standard deviations, not smaller.
      The design cannot see a subtle effect and must say so rather than reporting
      a null as strong.
    - >-
      j MOVES ON EVERY STEP. Any j-correlated artifact in factor-base
      construction will appear as an effect of whichever coordinate was walked.
      N3 (the swap control) is what distinguishes this, and it is not optional.
    - >-
      CELL POPULATION ORDER. If all (crater, crater) curves are reached by short
      walks and all (floor, floor) by long ones, walk length is confounded with
      cell. Walk lengths must be matched across cells and the achieved lengths
      reported.
    - >-
      At ell = 2 the volcano and the group structure both have well-known 2-adic
      subtleties (see IDEA-20260807-3c6bd8's assumption on v_2). Preferring
      ell_1, ell_2 in {3, 5} avoids this; if 2 must be used, the case split is
      explicit.
    - >-
      Classes with two small prime factors in c may be rare at small p, forcing
      larger p and hence more expensive measurement. The discard rate is reported
      so this is visible rather than absorbed.

  interpretation_limits:
    - >-
      This design cannot produce a positive finding about the ECDLP. Its outputs
      are attributions and vetoes.
    - >-
      Toy scale, four cells, small ell. An S1 verdict scopes exactly to the
      tested functional, ell pair, class and scale.
    - >-
      A clean S2 is not a null: it says the effect is a function of the ORDER's
      size, which is a real statement and connects directly to
      IDEA-20260805-38aebb's conservation identity.
    - >-
      Nothing here bears on any hypothesis' status; a control constrains
      interpretation and the Coordinator alone changes status.

  reachability_gate: >-
    THE DESIGN MOVES BETWEEN CURVES DELIBERATELY, so the gate applies and it
    passes for the cells but not for the replicates. REACHING A CELL: the four
    (level, level) combinations are reachable by ascent/descent at
    O(ell * h^2) Velu steps per coordinate (IDEA-20260807-bb03d3), so cells are
    cheap and locally verifiable by isogeny counting. REACHING A REPLICATE: a
    replicate is a specific vertex of a Cl(O_f)-torsor, and the design does NOT
    need a specified one -- it needs r independent ones, which a horizontal
    random walk supplies under GRH-conditional rapid mixing in O(log p) steps.
    So the design never needs the hard direction of T5. THE ONE PLACE T5 WOULD
    BITE -- selecting the BEST vertex within a cell -- is exactly what this design
    refuses to do, on purpose: the within-cell spread is treated as ERROR, not as
    a target. If a future record wants to target it, it inherits the p^{1/4}
    vectorization cost and must say so.

  target_complexity:
    time_exponent: >-
      NO ATTACK, NO EXPONENT. Cost of the control: 32 to 64 Groebner solves plus
      O(ell * h^2) Velu steps per cell transition plus r horizontal walks of
      O(log p) steps per cell. Minutes to hours at toy scale.
    memory_exponent: >-
      Negligible: 4r curves with their labels and metrics. The Groebner step's
      own peak memory dominates and is recorded per cell.
    best_known: >-
      As an attack, dominated by everything; see dominated_by. As a control
      design, there is no incumbent in this corpus -- no factorial appears
      anywhere in ledger/ -- so the comparison is against the implicit
      single-factor designs of H-ECTD-19017a and of the DECOMPOSITION's own L2
      sentence, both of which cannot separate S1 from S2.
    hidden_overhead: >-
      Disclosed: (i) the design is SMALL and therefore underpowered for subtle
      effects; the minimum detectable effect is stated, not hidden;
      (ii) populating cells requires the Velu instrument, whose cost is charged to
      IDEA-20260807-b1b604 and bb03d3 rather than here; (iii) classes admitting
      the design may be rare and the search cost is reported.
    tradeoff_note: >-
      Statistical rather than cryptanalytic: this design buys BALANCE and an
      estimable interaction at the cost of covering only four points of the level
      lattice, exactly the reverse of IDEA-20260807-3f5545's tradeoff. Running
      both is how the lane gets coverage and attribution at once.

  dominated_by: >-
    AS AN ATTACK: mounts none and is dominated on every axis by every row of the
    frontier -- parallel rho at 0.886 sqrt(N) time, O(1) memory (KN-TECH-001,
    KN-TECH-006); automorphism-discounted rho (KN-TECH-018); BSGS at 2 sqrt(N)
    time, sqrt(N) memory (KN-TECH-031); toy Semaev index calculus
    (KN-FIND-f8c290). Checked across time, memory and data/queries.
    AS A CONTROL: not dominated by anything in this corpus, because no
    multi-factor design exists here. It IS dominated on STATISTICAL POWER by any
    larger observational sweep such as IDEA-20260807-3f5545, and that tradeoff is
    stated rather than glossed.
  sota_delta: >-
    Zero speedup against any attack baseline. Control delta, quantitatively: at a
    cost of 32 to 64 Groebner solves it converts a two-level comparison that
    CANNOT distinguish ell-local from order-size explanations into a design that
    separates them at a stated minimum detectable effect of about 1.5 within-cell
    standard deviations, and it adds a veto (S3) that no existing design in this
    program can issue.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.85 that the design is constructible -- the only real risk is that classes
    with two small primes dividing c are rare at affordable p, which is checked
    arithmetically for free before any curve is built. 0.95 that the per-move
    coordinate-independence check passes, since it follows from Kohel. As for the
    verdict: 0.5 that all effects fall below the permutation null (no attribution
    possible, report power), 0.25 S2, 0.15 S1, 0.10 S3. The priority is high
    despite the modest prior because it is the cheapest item in the batch and
    because IDEA-20260807-cbe8c1's positive branch is uninterpretable without it.

  id_allocation_provenance: >-
    Coordinator pre-allocated in BATCH-cb71b5 via python3 tools/allocate_id.py
    --next idea --date 20260807; block recorded in
    coordination/goals/GOAL-ENDO-001/batches/BATCH-cb71b5/id_allocation.json;
    all 126 verified free with --check.

