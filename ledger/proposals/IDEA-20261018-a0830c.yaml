idea:
  id: IDEA-20261018-a0830c
  question_id: RQ-PFDR-ae2fba
  added: '2026-10-18'
  status: proposed
  approved_by: null
  proposed_by: idea-synthesist
  title: >-
    The break-even growth ladder: a lead matters only if its excess grows
    2^(8 delta*) across rungs; N-constant leads are sub-break-even by law
  class: control
  claim: >-
    BRIDGE of IDEA-20261017-bbc53e (law), EXP-PFDR-ca5e01 (design) and nine
    leads' stated bounds. (i) An excess X(N) over a matched null moves an
    exponent only if X(N) = N^delta, delta >= delta*(h) = 1/(2h-1) (bbc53e), or
    X(t) = t!^delta on the t-axis (IDEA-20261017-3db2a8). Over bits 14..22 the
    required ratio R* = 2^(8 delta*) is 6.35, 3.03, 2.21 at h = 2, 3, 4; over
    bits 16..22 (ca5e01) 4.0, 2.3, 1.8. (ii) N-constant observables never reach
    R*: sinusoid lift <= 2 (71a901); routing 1+eta <= K^3 (0eed85); fold gain
    <= 1/H_2(1/t!) (bd337d); pencil gain (5f29b6); tensor 4^D (a6a5ae); Horner
    = m! (f2cd4d); cofactor d(V) <= h (3db2a8, e9f824, 0e2dab); log-blind
    selection <= sqrt(2 ln K_eff) sd (5f37a1, 6507e6, 329d0a). (iii) The ca5e01
    flag abs(kappa - 1) >= 0.10 is 40x below R*; its theta 0.30 / 0.35 cells
    bracket U = N^(1/3), so the slope of log kappa on log N at fixed (theta, d)
    is bbc53e's delta: null cells at 2% give a 95% bound delta <= 0.02, a 15x
    sub-break-even closure. (iv) bbc53e's weighted base, c_0 = N^gamma, has
    slope gamma; gamma = 1/3 is exactly break-even at h = 2. Table in notes.
  mechanism: >-
    PAIR (R1 labels; Sigma = translation by base elements), Class I
    partial-action; the object is the excess X(N) across rungs, one slope.
    Harvest law: T = sqrt(2cUN/kappa) < sqrt(pi N/2) iff kappa > 1.27 c U; a
    constant kappa at U = N^(1/(2h-1)) is N^(-1/(2h-1)) short, so only growth
    matters. Selection law: best of K_eff nulls is mean + sqrt(2 ln K_eff) sd.
  novelty_status: unverified
  citations:
    - {ref: IDEA-20261017-bbc53e, provenance: internal, claim: harvest law; delta*; gamma plant, verified_by: idea-synthesist 2026-10-18}
    - {ref: EXP-PFDR-ca5e01, provenance: internal, claim: bits 16-22; flag 0.10; no runs yet, verified_by: idea-synthesist 2026-10-18}
    - {ref: eprint 2014/637 (Yun 2015), provenance: recalled, claim: generic Omega(sqrt(nN)) for n logs, verified_by: null}
  assumptions: []
  predictions:
    - metric: >-
        slope of log kappa on log N at fixed (theta, d), theta 0.30 and 0.35
      direction: different
      minimum_effect: >-
        95% upper bound <= 0.02; ALIVE only if the CI excludes 0 and reaches 1/3
    - metric: recovered gamma of the weighted-base plant at gamma 0, 1/6 and 1/3
      direction: different
      minimum_effect: within 0.03 (blocking)
    - metric: slope of the Z/N interval base
      direction: higher
      minimum_effect: 1 - theta within 0.05 (known positive)
  minimal_test:
    design: >-
      Stage 0: the could-ever-matter table (observable, bounding law, R*,
      cheapest kill per lead; notes). Stage 1: re-analysis of RUN-PFDR-b7c582
      outputs, per (theta, d) regression of log kappa on log N over bits 16..22
      (new contract). Stage 1b (no run yet): bits 16 and 22, 3 curves, theta
      0.30 and 0.35, window and GAP, 20 nulls, gamma plant, Z/N control.
    controls:
      - gamma plant at three slopes (blocking); Z/N interval base; null-vs-null slopes
      - matched Pollard rho on the same curves only if a cell reads ALIVE
    required_metrics: [slope with CI per cell, R* per h, plant recovery, null slope coverage]
  falsification_conditions:
    - Plant slope not recovered within 0.03: estimator blind; no closure read.
    - Null slope CI excludes 0 in more than 10% of cells: miscalibrated.
    - A real-base slope CI with lower bound > 0 reaching delta*: live lead; follow up with rho.
  confounders:
    - Fits over 6 to 8 bits mix constants and exponents; Z/N fixes the scale.
  interpretation_limits:
    - Toy scale; a bound over bits 16..22 says nothing about later growth; no status changes.
  heuristic_assumptions:
    - id: H1
      statement: kappa(N) is a power law over the ladder, so a two-point ratio estimates delta.
      rigorous_support: bbc53e harvest law, exact for independent rows; imitates the Parseval excess.
      validation_plan: residuals of the four-rung fit; Z/N slope 1 - theta exactly.
    - id: H2
      statement: The best of K_eff null candidates exceeds the mean by sqrt(2 ln K_eff) sd.
      rigorous_support: Gumbel limit and union bound for maxima of weakly dependent statistics.
      validation_plan: the 200-pool arm of IDEA-20261018-5f37a1; 200 matched bases of 6507e6.
  target_complexity:
    time_exponent: none; a live lead moves h/(2h-1) by -delta/2 only with delta >= 1/(2h-1)
    memory_exponent: unchanged (IDEA-20261017-90d9c5 moves only this column)
    best_known: rho N^(1/2), O(1) memory
    hidden_overhead: the 1.27 c U constant and the stopping constant c are not exponents
  estimated_cost: {implementation: low, compute: low}
  recommended_priority: high
