  citation_note: >-
    The pooled-rho law is recalled and unread here (Springer auth wall); the
    Bernstein-Lange abstract is retrieved; the S*T^2 bound is internal with an
    abstract-level caveat. novelty_status is unverified: the mechanism is
    textbook and the record claims no novelty for it, but a `known` label
    would rest on a recalled citation, which the validator rejects. First
    executor task: freeze Kuhn-Struik (SAC 2001) and ePrint 2012/458 as SRC-*
    packages and read the pooled law's constant and its L-range.
  assumptions:
    - Public curve parameters only; every DLP instance is generated with a known scalar and verified; no live keys.
    - The pooled arm shares ONE distinguished-point table across L targets and charges its size in stored entries and bytes; the independent arm runs L separate tables.
    - Plain r-adding walk, no negation map (card user_constraint); the sqrt(2) is applied arithmetically to the ruler.
    - The arithmetic at p = 2^64 uses c = 0.886 for the pooled constant as a placeholder and is re-derived with the measured c; the table states which c it used.
    - The comparison to the IC band is conditional on that band, which is unmeasured (a639a1) and enters only as a labelled row.
    - Uses the F1 walk-collision family as its component; nothing outside it.
  proof_search_map:
    bottleneck: >-
      The pooling constant c and the L-range over which per-instance cost
      follows L^{-1/2}, with the shared table charged.
    baseline_embedding:
      parameter_slice: >-
        L = 1 reproduces the single-instance rho of IDEA-20260920-0d218c's
        calibration arm (same steps-to-solve distribution); L in {1, 4, 16, 64}
        reproduces the ICEX arm's shape if that arm is ever run.
      reproduction_check: >-
        L = 1 pooled equals independent within noise; the exponent fit on
        L <= 64 agrees with the ICEX arm's readings if they exist.
    observation_collision:
      observable: >-
        Total steps to solve all L instances, per-instance mean, stored DP
        entries, and the fitted exponent of per-instance cost in L.
      distinct_preimage_search: >-
        A pooled arm whose DP density is set so high that the table dominates
        would show the same exponent with a larger constant; the table-size
        metric separates "pooling works" from "pooling works only because the
        table is free".
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The per-key rho cost table at p = 2^64 as a function of L and of (S, T), packed against the goal's IC band
        predicted_gain: None on the exponent; per-key cost sqrt(L) lower than single-instance for L keys; 2^128 online only at L about 2^63.6 or with 2^191.6 precomputation
    quantifier_order: >-
      For every L in the ladder there exists a preregistered cell on which
      pooled and independent arms are run on fresh targets with the table
      charged; and for all realistic L and (S, T) the arithmetic table at
      p = 2^64 states the per-key cost.
    method_ceiling:
      strongest_certifiable_claim: >-
        A measured pooling exponent and constant at toy subgroup orders on the
        deployed field, and an arithmetic per-key table at p = 2^64 under the
        recalled law with the measured constant; no statement about IC and no
        claim that any per-key cost below 2^128 is reachable.
      nearby_object_control: >-
        Z/n generic transport at the same L (pooling is generic; a difference
        is an instrument defect), and the independent-runs arm.
    proof_obligations:
      - claim: Every pooled collision yields a verified logarithm for the target it names, with the certificate re-verified independently.
        responsibility: correctness
      - claim: The DP table's entries and bytes are charged in the pooled arm's cost.
        responsibility: runtime
      - claim: The arithmetic table's every number re-derives from the stated law and constant; the validator recomputes it.
        responsibility: cost-model
      - claim: The IC comparison row is labelled conditional on HEUR-GFPN-DFLAT.
        responsibility: scope
  predictions:
    - metric: pooled_per_instance_cost_exponent_in_L
      direction: lower
      minimum_effect: Fitted exponent -0.50 +/- 0.05 over L in {1, 4, 16, 64, 256, 1024, 4096} at subgroup order about 2^32 to 2^40.
    - metric: pooled_constant_c_over_single_instance_constant
      direction: flat
      minimum_effect: In [0.8, 1.3] at every L in the ladder, table charged.
    - metric: stored_dp_entries_pooled
      direction: higher
      minimum_effect: Linear in total steps at the set density (slope within 10% of the density), never super-linear.
    - metric: per_key_rho_cost_bits_at_p_2_64
      direction: different
      minimum_effect: >-
        Derived: EcMasFp5 154.8 / 149.8 / 144.8 bits at L = 2^10 / 2^20 / 2^30
        with c = 0.886 (EcGFp5 0.5 bit lower); L for 128 bits about 2^63.6;
        precomputation for 2^128 online about 2^191.6 with T about 2^63.6
        entries. Re-derived with the measured c.
    - metric: crossover_against_ic_band_L
      direction: different
      minimum_effect: >-
        Derived, conditional row: with the a639a1 band, IC total is below
        pooled-rho total for every L >= 1; if the band is voided, no crossover
        exists and pooled rho is the multi-key ruler.
  minimal_test:
    design: >-
      Instrument: the F_{p^5} rho backend of IDEA-20260920-68b279 with a shared
      DP table and multi-target bookkeeping (new tooling, V5); if EXP-ICEX-
      c32447's multi-target arm is ever built, reuse its bookkeeping. Cells: a
      random curve over the deployed F_{p^5} with a subgroup of order about
      2^32 to 2^40, L in {1, 4, 16, 64, 256, 1024, 4096}, 20 repetitions per L
      with fresh targets; arms: pooled (one table) and independent (L tables);
      r = 32, B = 16, DP density set so the table stays below 2^24 entries; Z/n
      generic transport at the same L. Report total steps, per-instance mean,
      table entries and bytes, fitted exponent and constant with intervals,
      certificates. Then the arithmetic table at p = 2^64 (both curves; L and
      (S, T) rows; IC comparison row labelled conditional).
    controls:
      - >-
        Independent-runs arm as the null; per-instance cost must be flat in L.
      - >-
        Z/n generic transport at every L; identical exponent and constant
        required, since pooling is generic.
      - >-
        DP-density ladder at L = 256; the constant must not change with
        density once the table is charged, and a constant that improves with
        denser tables is the table being under-charged.
      - Certificate re-verification of every logarithm by an independent scalar-multiplication implementation.
    required_metrics:
      - total_steps_all_instances_per_arm_per_L
      - per_instance_mean_and_interval_per_L
      - fitted_exponent_and_constant_with_intervals
      - dp_table_entries_and_bytes_per_cell
      - certificate_pass_rate
      - arithmetic_table_bits_at_p_2_64_per_curve
      - ic_crossover_row_conditional_flag
  falsification_conditions:
    - Fitted exponent above -0.40 or constant above 1.3 over the ladder with the table charged (the recalled law does not describe pooled rho on this instrument at these L; the per-key table is void and the record says so).
    - Pooled arm differs from the Z/n transport at any L (instrument defect; no economics number is reported).
    - Any arithmetic-table entry fails re-derivation by the validator from the stated law and constant (record superseded with the corrected table).
  confounders:
    - Under-charging the shared table (memory, lookups) makes pooling look free; the density ladder and bytes metric expose it.
    - Reusing targets across repetitions or letting a target's walks seed another's (target leakage); fresh targets and per-target seeds are required.
    - >-
      Toy subgroup orders where L approaches n^{1/4} (at n = 2^32, n^{1/4} is
      2^8); the ladder must stay below the recalled L-range at the smaller
      orders or report the deviation as expected.
    - Reading the conditional IC row as a result about IC; it is a row from a639a1's unmeasured band.
  interpretation_limits:
    - Proposal only; no experiment, run, approval or result exists here.
    - >-
      Instance economics only; no exponent moves, no single-instance speedup,
      no security claim beyond "the per-key rho cost for a deployment with L
      keys is the pooled number, and 128 bits per key is not reached by
      pooling or precomputation at any realistic scale".
    - The measurement is at toy subgroup orders on the deployed field; the transfer to n about 2^320 is the recalled law, named as such.
    - Nothing about index calculus is measured here; the crossover row is conditional on a639a1's band.
  heuristic_assumptions:
    - id: H-S3-1
      statement: >-
        Pooled-rho law: for L targets in a cyclic group of prime order n sharing
        one distinguished-point table under a random-mapping walk, the expected
        total number of steps to solve all L is c*sqrt(L n)(1 + o(1)) with c
        independent of L for L <= n^{1/4}, and the number of stored points is
        the DP density times the total steps.
      rigorous_support: >-
        Birthday law for random mappings extended to L independent start
        families (the theorem is for random functions; the recalled Kuhn-Struik
        analysis is the classical statement); the transfer to r-adding walks is
        the standard rho heuristic (KN-TECH-006).
      validation_plan: >-
        The L-ladder above at subgroup orders 2^32 to 2^40 on the deployed
        field and on Z/n: empirical per-instance cost against c*sqrt(n/L);
        distribution of total steps / sqrt(L n) against the random-mapping
        collision-time law; tail check on the slowest instance per cell.
        Transfer to n = 2^320 is by the law, stated explicitly.
    - id: H-S3-2
      statement: >-
        Precomputation law: a table of T distinguished points chosen by walks
        from known multiples of P gives an online cost of c'*sqrt(n / T) per
        instance after about c'*sqrt(n T) precomputation, with c' near 1 to 2.
      rigorous_support: >-
        Consistent with the retrieved Bernstein-Lange abstract's data point at
        T = l^{1/3} (1.77*l^{1/3} online, 1.24*l^{2/3} precomputation) and
        bounded by the Corrigan-Gibbs-Kogan S*T^2 = Omega~(n) generic bound
        (KN-LIT-013, abstract-level). The general form is recalled.
      validation_plan: >-
        Not measured here; it enters only the arithmetic row. If the
        coordinator wants it measured, H-ECDLP-3550b8's basin-partition
        instrument on prime fields is the owned vehicle and this record
        recommends re-scoping that instrument rather than building another.
  heuristic_note: >-
    Both laws are named and both are recalled or abstract-level; the
    measurement leg tests H-S3-1 directly and the arithmetic table is
    conditional on H-S3-1 with the measured constant and on H-S3-2 as stated.
  target_complexity:
    time_exponent: Unchanged per instance in n (1/2); per-key cost sqrt(n/L) for L keys; online sqrt(n/T) with sqrt(nT) precomputation.
    memory_exponent: Shared DP table linear in total steps times density; T entries for the precomputation row.
    best_known: Pollard rho 0.886*sqrt(n) group operations with negation (KN-TECH-006, KN-TECH-018), about 2^159.8 on EcMasFp5 and about 2^159.3 on EcGFp5, single instance.
    hidden_overhead: DP-table storage and lookups, charged; the o(1) in the pooled law at small n, exposed by the ladder.
    tradeoff_note: >-
      The (S, T) row is the time-memory tradeoff position: S about 2^70 bytes
      for 2^128 online on EcMasFp5, at 2^191.6 precomputation; parallelization
      is van Oorschot-Wiener on both arms.
  estimated_cost:
    implementation: medium
    compute: medium
    qualification: >-
      Shares the tooling of IDEA-20260920-68b279 plus multi-target
      bookkeeping; the L = 4096 cells at n about 2^40 are about 2^26 steps
      each times 20 repetitions, i.e. hours to a day on one core. The
      arithmetic table is zero compute.
  asymptotic_claim:
    problem: ECDLP on E(F_{p^5}) at p = 2^64 - 2^32 + 1, L instances on one curve
    prior_best: L independent rho runs at L*0.886*sqrt(n); pooled rho at about c*sqrt(L n) (recalled)
    time_exponent: 1/2 per instance (unchanged); L^{1/2} total in L
    memory_exponent: shared table, linear in steps times DP density
    hidden_cofactor: none claimed
    claim_kind: instance_economics
  dominated_by: >-
    On the single-key axis, pooled rho reduces to rho and is dominated by
    nothing generic. On the many-key axis, under IDEA-20260920-a639a1's
    conditional band the amortized index-calculus row (IDEA-20260731-010 form,
    C_IC + L*C_desc with C_IC in 2^121..2^144) dominates pooled rho at every
    L >= 1 on time, at higher memory (sparse LA at about 2^102 rows); if that
    band is voided, nothing dominates pooled rho on the many-key axis. On the
    precomputation axis the S*T^2 frontier (KN-LIT-013) is the ceiling and
    this record sits on it, not beyond it. Every row checked: rho, BSGS,
    multi-target rho, S*T^2, the a639a1 band. Stated as "dominated by
    amortized IC under the conditional band; otherwise n/a".
  sota_delta:
    time: Per-key cost sqrt(L) below the single-instance ruler for L keys (derived; constant to be measured); zero single-instance delta.
    memory: A shared DP table charged linearly in total steps; 2^70 bytes for the 2^128-online precomputation row.
    data_queries: Not applicable (public keys only; no oracle).
  frontier_check:
    status: pending
    note: >-
      The corpus records that multi-target rho is absent from its literature
      (EV-IC-002 OBS-9) and that its constant has never been asserted here.
      Coordinator to freeze Kuhn-Struik SAC 2001 and ePrint 2012/458 before any
      number from this record is quoted outside the ledger.
  recommended_priority: medium
  priority_rationale: >-
    Constant-factor and instance-economics work is not target-class under
    docs/target-result-profile.md rule A1, and this record says so. Its
    priority for GOAL-GFPN-380702 is that the goal's completion criterion C1
    reports a cost band "next to" a rho ruler, and a deployment with many
    keys has a different rho ruler per key than the single-instance 2^160;
    the arithmetic half of this record is zero-compute and fixes that ruler
    in a form the decision can cite, and the measurement half is a re-scope of
    an already-designed arm. Medium, not high, because the arithmetic closes
    the practical question (no realistic L or (S, T) reaches 2^128) before
    any run.
  first_deliverable: >-
    The zero-compute arithmetic table (both curves; L rows; (S, T) rows; the
    conditional IC crossover row) as a research note under the goal, with the
    two source freezes requested; then, if the coordinator opens the
    measurement leg, the multi-target bookkeeping in the F_{p^5} backend
    (IDEA-20260920-68b279).
  next_gate: Coordinator decision whether to attach the measurement leg to EXP-ICEX-c32447's multi-target arm (re-scope) or to a GFPN contract, and the source freezes.
