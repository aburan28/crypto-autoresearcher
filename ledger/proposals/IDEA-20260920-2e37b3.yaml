      RQ-ICPERF-94c86e, RQ-GRUMPY-964876, H-GFPN-ee4d45 and the GOAL-GFPN-380702
      scope_exclusions are untouched. Nearest owned record: EXP-ICEX-c32447's
      multi-target rho arm (via EV-SEMBIN-4125ec) and IDEA-20260731-010.
