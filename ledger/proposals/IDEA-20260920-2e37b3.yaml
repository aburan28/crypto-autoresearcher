idea:
  id: IDEA-20260920-2e37b3
  question_id: RQ-GFPN-c01af8
  added: '2026-09-20'
  status: proposed
  approved_by: null
  title: >-
    Instance economics of the rho ruler for a deployed curve with many keys:
    multi-instance pooled rho (Kuhn-Struik form) and its precomputation limit
    (Bernstein-Lange tables, Corrigan-Gibbs-Kogan S*T^2 frontier) on EcGFp5
    and EcMasFp5, with the toy-scale pooling constant measured on the deployed
    field
  class: measurement
  claim: >-
    A deployment with L keys on one of these curves is not priced by a
    single-instance count. Under the pooled-rho law (recalled: total about
    c*sqrt(L n) group operations for L instances sharing one
    distinguished-point table, c near the single-instance constant, valid for
    L well below n^{1/4}), the PER-KEY cost on EcMasFp5 falls from 2^159.8 to
    2^154.8 at L = 2^10, 2^149.8 at L = 2^20 and 2^144.8 at L = 2^30, and
    reaches 2^128 only at L about 2^63.6, which no deployment approaches.
    Under the precomputation law (recalled general form: a table of T
    distinguished points costs about c*sqrt(n T) to build and gives about
    c*sqrt(n / T) per subsequent instance; the retrieved Bernstein-Lange
    abstract gives the T = l^{1/3} data point, 1.77*l^{1/3} online after
    1.24*l^{2/3} precomputation), an online cost of 2^128 per key on EcMasFp5
    needs T about 2^63.6 stored points (about 2^70 bytes) built with about
    2^191.6 group operations, consistent with the Corrigan-Gibbs-Kogan generic
    bound S*T^2 = Omega~(n). The claim, stated so it can fail: (i) on the
    deployed field at toy subgroup orders the measured per-instance cost of
    pooled rho scales as L^{-0.5 +/- 0.05} for L from 1 to 2^12 with a
    constant c in [0.8, 1.3] times the single-instance constant, and the
    charged distinguished-point table grows linearly in the total step count;
    and (ii) the arithmetic table at p = 2^64 shows that neither pooling at
    any realistic L nor precomputation at any realistic (S, T) brings the
    per-key rho cost below 2^128 on either curve. Both halves can fail: (i)
    by a measured exponent above -0.4 or a constant above 1.3 (table overhead
    eats the pooling), (ii) only by an arithmetic error, which is why (ii) is
    a derivation checked by the validator rather than an experiment. The
    tracked object is unchanged (card C-4: instance pooling changes the
    collision STRUCTURE's cost, not the object).
  mechanism: >-
    OBJECT FRAME (card C-4). Representation: affine F_{p^5} points as in
    IDEA-20260920-0d218c. Operation set Sigma: the translation action of one
    r-adding walk, identical for every instance because the walk is a
    function of the point alone. The tracked object is the lossless F1
    walk-collision object; pooling does not touch it. What pooling changes is
    the collision structure: a walk started from a_i P + b_i Q_i for target
    Q_i collides usefully with any earlier walk of ANY target once both have
    merged into the same trail, because the collision yields a linear
    relation among the known coefficients; with L targets the number of
    useful collision pairs grows with the total number of stored
    distinguished points rather than per target, which is the whole content
    of the sqrt(L n) law. Trichotomy: the object is Class 0 (lossless); the
    record is placed as "unchanged object, changed structure cost" per the
    card.
    THE PRECOMPUTATION LIMIT is the same mechanism with the first L - 1
    instances replaced by walks from known multiples of P: the table then
    encodes advice about the fixed group, which is exactly the setting of
    KN-LIT-013, and the S*T^2 bound is the generic ceiling any such advice can
    reach. The record uses it as the frontier row, not as a component.
    WHY THIS IS AN ECONOMICS QUESTION FOR THE GOAL. The goal compares an
    index-calculus band with a rho ruler. Index calculus amortizes across
    keys far better than rho (one relation matrix, then one descent per key;
    IDEA-20260731-010): under the a639a1 band the IC total is C_IC + L*C_desc
    with C_IC in 2^121..2^144 and C_desc about 5! x (per-PDP cost) about
    2^25..2^47 per key, whereas pooled rho is 0.886*sqrt(L)*2^159.8 in total.
    So IF the band holds, pooled rho never becomes the multi-key ruler; IF the
    band's heuristic (HEUR-GFPN-DFLAT) fails, pooled rho is the only multi-key
    economy and its per-key law is the ruler. The record's arithmetic table
    states both regimes side by side so the coordinator's decision reads the
    right one.
    FIELD FROBENIUS. Not used. No endomorphism, no automorphism class, no
    negation map (card C-2); the sqrt(2) stays inside the baseline constant
    and is applied arithmetically.
  novelty_status: unverified
