idea:
  id: IDEA-20260816-583998
  question_id: RQ-FRODO-a2dbe2
  added: '2026-08-16'
  title: 'State the ROM-to-QROM gap for one transform as an integer vector, not as a sentence: extract
    the exponent of every input variable in each model, subtract, and convert the difference vector
    into a single bit-security movement at a frozen evaluation point, so that the gap becomes one
    auditable number per parameter set.'
  class: theory
  claim: '(A) OBJECT. For a fixed transform and a fixed transcription of its security bound in each
    of two models, define the EXPONENT VECTOR e = (e_qH, e_qD, e_delta, e_U, e_C, e_Adv) of the dominant
    term, where each entry is the rational power to which that input enters. The gap object is the
    difference vector d = e_QROM minus e_ROM, an integer or half-integer vector of length six. (B)
    CLAIM. The gap is fully carried by d together with one scalar log-constant difference, in the
    sense that at any evaluation point the bit-security difference between the two models equals the
    inner product of d with the vector of log-inputs, plus that scalar. This turns a qualitative statement
    of the form the QROM analysis loses a square root into an exactly evaluable linear functional,
    and it makes the gap ADDITIVE and LOCATION-DEPENDENT rather than a single number: the same d yields
    different bit movements at different query counts, and the location where the movement is largest
    is computable in closed form. (C) DIAGNOSTIC CLAIM. Because d is an integer or half-integer vector,
    it is far more robust to extraction damage than any printed figure: a damaged PDF that garbles
    digits usually leaves exponents legible, so d can be recovered and checked when a bit-security
    number cannot. Two independent transcriptions that agree on d but disagree on a constant have
    localized the disagreement to a place where it is cheap to resolve. (D) WHAT IS NOT CLAIMED. No
    attack, no break, and no claim that either model''s analysis is wrong. A model gap is a statement
    about two proofs, not about an adversary: an adversary in neither model gains anything from d
    being large. Nothing here asserts what any published analysis says, in either model; the object
    is defined relative to whatever transcription is filed, and if no QROM transcription is ever filed
    then d is undefined and this proposal produces nothing, which is stated in advance rather than
    worked around. No statement is made about plain LWE hardness at any dimension.'
  mechanism: 'STAGE 1, definition and toy validation, requiring no source. Implement exponent-vector
    extraction from a term-list representation and validate it on hand-written pairs of bounds whose
    difference vectors are known by construction. STAGE 2, the linear-functional identity. Prove symbolically,
    and check numerically on the toy pairs, that the bit-difference at any point equals the inner
    product of d with the log-inputs plus the log-constant difference, whenever the same term dominates
    in both models at that point. Record explicitly that the identity FAILS wherever the dominating
    term differs between models, and compute the region where it fails; that region is a deliverable
    in its own right, because it is exactly where a single-number statement of the gap is meaningless.
    STAGE 3, robustness-to-damage measurement. Simulate extraction damage on the toy bounds by corrupting
    a controlled fraction of numeric characters, and measure the recovery rate of d versus the recovery
    rate of the printed bit figure under the identical corruption model. This is the claim (C) test
    and it is entirely synthetic. STAGE 4, only if and when both a ROM and a QROM transcription for
    the transform are filed as KN-LIT entries per RQ-FRODO-a2dbe2 constraint 1: extract d, evaluate
    the functional at the frozen evaluation grid, report the bit movement per parameter set with interval
    arithmetic, and report the region where the dominating terms differ. STAGE 5, null: pairs of independently
    drawn random bounds, for which d is meaningless, run through the identical pipeline to establish
    what a nonsense d looks like.'
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-FRODO-a2dbe2 in full, including the target that names a ROM loss linear in hash
      queries and a QROM square-root or quadratic loss as an UNVERIFIED research target rather than
      a fact. Read GOAL-FRODO-002 objective. Ran grep -ril over ledger/proposals/ for QROM, tightness,
      reduction tightness, Fujisaki, IND-CCA bound, HHK, OW-CPA, and parsed the titles of every QROM
      hit.
    results: 'Nine proposals mention QROM. The nearest is IDEA-20260813-6819af (MQOM), a reduction-loss
      saturation ledger isolating every TCitH ROM and QROM game hop and searching for a matching adversary
      or a provable slack witness; that record''s object is a game hop and its method is adversary
      search. IDEA-20260731-002, -004 and -005 and IDEA-20260805-cec9b6, -38048d, -7abf04, -b9047c
      and -59fa23 mention QROM incidentally within other schemes'' framings and none defines a model
      gap as a computable object. Within FRODO specifically, no proposal mentions QROM at all: the
      six FRODO proposals (IDEA-20260805-390957, -411b60, -57fc49, -f16b44, IDEA-20260808-2df781,
      -dd4d30) are entirely about the sampling table, the failure rate, the Renyi step, and the primal
      lattice shape. H-FRODO-8ea540 does decompose a conversion into two named loss terms and reason
      about how each moves in a parameter, which is the closest methodological relative in the repository,
      but it is about the Renyi order inside the sampling argument and not about a model gap.'
    verdict: 'UNVERIFIED. This program cannot read external literature and asserts nothing about what
      any published ROM or QROM analysis contains; the exponent vectors here are defined relative
      to transcriptions that do not yet exist in this corpus, and that is stated as a hard precondition
      rather than glossed. Claimed new inside this repository: representing a model gap as an integer-or-half-integer
      difference vector plus a scalar, deriving the exactly-evaluable linear functional from it, and
      measuring exponent recovery versus figure recovery under a synthetic extraction-damage model.
      Assembled from known parts: term-list representations of bounds are ordinary computer algebra;
      the demand for two independent transcriptions and mutation controls is RQ-FRODO-3260cc and RQ-FRODO-a2dbe2
      methods; the observation that damaged extractions are the operative risk is recorded in RQ-FRODO-3260cc.provenance.'
  object_first_candidate:
    tracked_object: 'The exponent vector of the dominant term of a security bound, and the difference
      of two such vectors across models: d = e_QROM minus e_ROM in the six coordinates (hash queries,
      decapsulation queries, correctness error, users, ciphertexts per user, underlying advantage),
      together with the scalar difference of the logs of the two leading constants.'
    lossiness: 'The projection discards every constant except one scalar, every non-dominant term,
      and the entire numeric value of both bounds, keeping six rational numbers and one scalar. This
      is genuinely lossy: two bounds differing by any factor whatever share an exponent vector, and
      a bound with ten subdominant terms is indistinguishable from one with none. What survives propagates
      because the log of a monomial is linear in the log-inputs, so the exponent vector is exactly
      the gradient of the log-bound with respect to the log-inputs, and gradients compose additively
      under the composition of reductions. That is the precise sense in which the retained part still
      moves deterministically: composing two reductions adds their exponent vectors, whereas the discarded
      constants only multiply.'
    propagation: One step of the target operation is one game hop or one composition of reductions.
      Under composition, exponent vectors ADD and leading constants MULTIPLY, so the tracked object
      evolves by vector addition, independently of the discarded information. One step of the other
      relevant operation, moving in parameter space, changes the log-bound by the inner product of
      the exponent vector with the log-step, which is the linear functional of claim (B) applied to
      a displacement. Both propagation rules are exact and cost no compute.
    survival_score: 'The object survives exactly as long as one term dominates and that term is a
      monomial. It dissolves at two named places: where the dominating term changes, at which point
      the exponent vector jumps discontinuously and no single d describes the gap, and where a term
      is a square root of a SUM rather than a product, at which point no exponent vector exists at
      all. The proposal predicts both failures occur for a QROM-shaped bound and treats locating them
      as the primary deliverable rather than as an obstacle: the region where the gap cannot be stated
      as one number is more informative than a number quoted where it can.'
  null_object_control: Pairs of INDEPENDENTLY drawn random bounds, with exponents from the same integer
    range and constants from the same log span, run through the identical extraction and identical
    functional evaluation in the same invocation. For such a pair d carries no information about any
    model gap, so the null establishes the distribution of d entries and of the resulting bit movement
    that arises from nothing at all. The signal arm means something only if the real d is separated
    from that distribution, for example by having small-magnitude entries concentrated on one or two
    coordinates, whereas the null d should have entries spread across all six with magnitude set by
    the sampling range. A second null uses two transcriptions of the SAME bound, for which d must
    be exactly the zero vector; a nonzero d there is a pipeline bug and halts everything.
  discriminated_from:
  - 'IDEA-20260813-6819af (MQOM): isolates ROM and QROM game hops and searches for matching adversaries
    or slack witnesses. That is an existence question about adversaries; this defines no adversary,
    searches for none, and studies only the gradient of two written bounds.'
  - 'H-FRODO-8ea540: decomposes the Renyi divergence-to-bit-security conversion into a sharpening
    term and an accumulation term and reasons about their opposite motion in the order a. That is
    a two-term decomposition inside the SAMPLING argument, in one model; this compares two models
    of the CCA transform and never touches the divergence.'
  - 'IDEA-20260805-f16b44 (FRODO): converts a failure-rate error into bits. That is one partial derivative
    of one bound; the exponent vector is the full gradient, and the whole content here is the model
    DIFFERENCE of two such gradients, which a single derivative cannot express.'
  - 'A prose statement that a QROM proof loses a square root. That is the incumbent formulation and
    it is precisely what this proposal refuses: a square-root loss is a claim about one coordinate
    of d and says nothing about the other five or about where the dominating term changes.'
  - Ordinary numeric evaluation of two bounds at one point followed by subtraction. That yields one
    number at one location with no structure; the linear functional yields the whole surface, plus
    an explicit region where the surface is not linear and the subtraction is meaningless.
  assumptions:
  - 'For stage 4 only: both a ROM-model and a QROM-model transcription of the same transform are filed
    as KN-LIT entries with extraction damage marked, per RQ-FRODO-a2dbe2 constraint 1. If they are
    not, stages 1 through 3 still run and stage 4 does not, and that is recorded as an unmet precondition
    rather than as a negative result.'
  - The dominant term at the frozen evaluation point is identified by interval arithmetic and reported
    as ambiguous where intervals overlap, rather than resolved by rounding.
  - Extraction damage affects numeric characters more than symbolic exponent structure; this is the
    premise of claim (C) and it is TESTED by the synthetic damage model rather than assumed.
  - Composition of reductions is representable as multiplication of monomials in the six tracked inputs;
    any reduction step that is not is flagged and excluded from the additive propagation claim.
  - The underlying advantage is carried as an opaque symbol with a swept placeholder and is never
    estimated, per RQ-FRODO-a2dbe2 constraint 2.
  predictions:
  - metric: number of nonzero coordinates of d on a real transcription pair, if one is filed
    direction: lower
    minimum_effect: 3
  - metric: number of nonzero coordinates of d on independently drawn random bound pairs
    direction: higher
    minimum_effect: 5
  - metric: recovery rate of d under a synthetic 10 percent numeric-character corruption
    direction: higher
    minimum_effect: 0.8
  - metric: recovery rate of the printed bit-security figure under the identical corruption
    direction: lower
    minimum_effect: 0.3
  - metric: fraction of the frozen evaluation grid on which the dominating term differs between the
      two models, so that no single-number gap statement is valid
    direction: different
    minimum_effect: 'no pre-commitment, with reason: this fraction is the quantity most worth measuring
      and its value is not guessable before a transcription exists; pre-committing would either be
      fabricated or would bias the frozen grid choice'
  minimal_test:
    design: 'Everything that discriminates claim (C) is synthetic and costs minutes. Write four hand-built
      pairs of bounds with known difference vectors, plus a corruption model that flips a controlled
      fraction of numeric characters in a rendered text of each bound. Run three arms in one invocation:
      matched pairs with known d, identical-bound pairs whose d must be exactly zero, and independently
      drawn random pairs. For each, attempt to recover d and to recover the numeric evaluation at
      a frozen point, under corruption rates of 0, 5, 10 and 20 percent, with fifty corruption seeds
      each. The single discriminating comparison is the recovery-rate curve of d against the recovery-rate
      curve of the figure. If exponents are no more robust than figures, claim (C) is dead for the
      cost of an afternoon, and the measured recovery curves are still a usable deliverable for every
      other transcription task in this program. Claim (B)''s identity is checked on the same matched
      pairs at zero cost by direct numeric comparison.'
    controls:
    - Identical-bound pair control, for which d must be exactly the zero vector.
    - Independently drawn random bound pairs as the null, run in the same invocation with disjoint
      seeds.
    - Zero-corruption arm, establishing the ceiling recovery rate for both d and the figure.
    - Known-d matched pairs, which gate the extractor before any other arm is reported.
    - 'Dominating-term consistency check: report the fraction of grid points where the two models''
      dominating terms differ, since the linear-functional identity is only valid where they agree.'
    required_metrics:
    - the difference vector d, entrywise, per pair
    - number of nonzero coordinates of d
    - recovery rate of d versus corruption rate
    - recovery rate of the numeric figure versus corruption rate
    - bit movement predicted by the linear functional versus bit movement computed by direct evaluation,
      at every grid point where the dominating terms agree
    - fraction of the grid where the dominating terms differ
  falsification_conditions:
  - On matched pairs where the dominating terms agree, the linear functional disagrees with direct
    numeric evaluation beyond interval width, refuting claim (B).
  - The identical-bound control returns a nonzero d, which is a pipeline defect and voids everything
    downstream.
  - Exponent recovery is no more robust than figure recovery under the synthetic corruption model,
    refuting claim (C).
  - Random independent pairs produce difference vectors indistinguishable in sparsity from matched
    pairs, showing d carries no structural information.
  - On a filed transcription, no term is monomial, so no exponent vector exists and the object does
    not apply to this transform, which is a clean scoped obstruction to record.
  - The dominating terms differ on essentially the entire evaluation grid, so no single-number gap
    statement is valid anywhere and the linear functional has no domain.
  confounders:
  - The corruption model is synthetic and may not resemble real PDF extraction damage; the measured
    recovery curves are properties of that model and must always be quoted with it.
  - Choice of the frozen evaluation grid decides which term dominates and therefore decides d; a grid
    chosen around the published evaluation point will report the gap there and nowhere else.
  - Two independent transcriptions agreeing on d may share a reading error, which is agreement rather
    than correctness.
  - Half-integer exponents from square-root terms make sparsity comparisons with an integer-valued
    null unfair unless the null draws from the same half-integer lattice.
  - A bound written as a maximum of two expressions has no single dominant term and will be silently
    mis-extracted unless maxima are detected and split explicitly.
  interpretation_limits:
  - A model gap is a property of two proofs. It is not a property of FrodoKEM and not a property of
    any adversary, and a large d does not mean anything is easier to attack.
  - Nothing here asserts what any published analysis contains; d is defined relative to filed transcriptions
    and is undefined without them.
  - Robustness-to-damage results describe a synthetic corruption model, not real extraction pipelines.
  - The linear functional is valid only on the region where the dominating terms agree, and quoting
    a single gap number outside that region is exactly the error this proposal exists to prevent.
  target_complexity:
    time_exponent: No attack exponent is claimed. Extraction and evaluation are linear in terms times
      grid points; seconds to minutes.
    memory_exponent: No attack memory exponent is claimed. Storage is six rationals per bound plus
      the grid; megabytes.
    best_known: 'The incumbent is the qualitative formulation recorded as an unverified research target
      in RQ-FRODO-a2dbe2 targets: that a ROM bound typically carries a factor linear in hash queries
      and a QROM bound a square-root or quadratic loss. That is a sentence; this proposal proposes
      to replace it, for whatever transcription is filed, with a six-coordinate vector and an evaluable
      functional.'
    hidden_overhead: 'Two independent transcriptions in two models is roughly twice the human cost
      of one, and the flattening of nested lemmas into a term list is a recorded derivation rather
      than a mechanical step. The hidden failure is subtler: extracting an exponent vector requires
      deciding what the dominant term IS, and that decision imports the frozen grid, so the apparently
      symbolic object silently depends on a numeric choice.'
  dominated_by: 'n/a (no result claimed on any cost frontier). Pareto check actually performed: grep
    -ril frodo across ledger/ returns goals, hypotheses, proposals, questions and one decision and
    NO evidence record, so this program holds zero measured cost rows for FrodoKEM in any axis and
    there is no frontier row to be dominated by. Against IDEA-20260813-6819af, the nearest reduction-loss
    record, no cost comparison exists because neither produces a cost.'
  sota_delta: no attack; conceptual and measurement contribution only. The deliverable is an integer-or-half-integer
    vector, a linear functional, two recovery-rate curves and a region map; none is comparable to
    any attack cost and no bit-security figure is moved by this proposal.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'Claim (B), the linear-functional identity where a single term dominates
    in both models: 0.9, because it is elementary algebra and the only real risk is that the dominating
    terms rarely agree, which is a scope limit rather than a refutation. Claim (C), that exponents
    are recoverable under damage where figures are not, at the stated separation: 0.6, because it
    is plausible and cheap to test but the corruption model is my own invention and could easily be
    favourable to it by construction, which the identical-bound and random-pair controls only partly
    guard against. Sparsity of the real d at three or fewer nonzero coordinates: 0.4, honestly low,
    because a model change may well move several coordinates at once and I have no basis for the guess.
    Probability stage 4 runs at all within this goal''s budget: 0.3, because it is gated on two transcriptions
    being filed and RQ-FRODO-a2dbe2 constraint 1 is currently undischarged; the synthetic stages are
    the part I expect to actually produce numbers.'
