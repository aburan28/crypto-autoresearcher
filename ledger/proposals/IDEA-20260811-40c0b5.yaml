idea:
  id: IDEA-20260811-40c0b5
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-CLGP-b99df5
  goal_id: GOAL-ENDO-001
  claim_tier: toy
  title: >-
    THE VECTORIZATION ORACLE IS SELF-ELIMINATING AT p^{1/4} PER QUERY, SO
    DIRECTION 2 IS DEGENERATE RATHER THAN MERELY CLOSED. Because classical
    ordinary-curve vectorization already costs about h^{1/2} = p^{1/4} -- BELOW
    the p^{1/2} rho baseline it is being asked to beat -- any reduction R^V that
    solves ECDLP in time T with q queries to a free Cl(O)-vectorization oracle
    yields an ORACLE-FREE ECDLP algorithm in time T + q*p^{1/4+o(1)}. Hence no
    Direction-2 result can exist that is not already an oracle-free result, the
    lane's ceiling is exactly p^{1/4}, and the campaign's stated reason (T5) is
    the wrong one -- T5 prices CONSTRUCTING the oracle, which this setting gives
    away
  class: mechanism

  claim: >-
    (A) THE STATEMENT, WITH ITS QUANTIFIER ORDER WRITTEN OUT FIRST, BECAUSE
    THAT IS WHERE THIS LANE'S ARGUMENTS DIE.

    Let V_E denote the vectorization oracle for the F_p-isogeny class of E
    restricted to curves with End = O: on input a pair (E_1, E_2) of curves in
    that class it returns, at unit cost, the unique [a] in Cl(O) with
    [a] * E_1 = E_2.

    SIMULATION THEOREM (what this record asserts):
      FORALL primes p > 3,
      FORALL ordinary E/F_p with End_{F_p}(E) = O and D = t^2 - 4p known
        together with the factorisation of D,
      FORALL probabilistic oracle machines R,
      FORALL time bounds T and query bounds q,
      THERE EXISTS an oracle-free machine R' such that
      FORALL instances (P, Q = [k]P) with <P> = G of prime order N,
        Pr[R'(p, E, P, Q) = k] >= Pr[R^{V_E}(p, E, P, Q) = k] - negl,
        and Time(R') <= T + q * p^{1/4 + o(1)},
        and Memory(R') <= Memory(R) + p^{1/4 + o(1)}.

    The order is load-bearing. R' is universally quantified over instances and
    is uniform given (p, E, O); the oracle is granted for FREE and EXACTLY,
    which is strictly stronger than anything known classically or quantumly.
    Two weaker readings are NOT what is claimed and must never be substituted:
      (W1) FORALL instances THERE EXISTS R'_instance -- trivial, void.
      (W2) R' matches R only on average over the class -- not needed; the
           simulation is per-query and per-instance, not distributional.

    (B) THE ARGUMENT, AND IT IS ELEMENTARY -- WHICH IS THE POINT.
    An oracle for a problem the simulator can solve in time X is worth at most
    X per query. R' runs R verbatim and answers each query (E_1, E_2) by
    computing the connecting ideal class itself, with the best known classical
    ordinary vectorization algorithm: meet-in-the-middle / birthday random
    walks in the F_p-isogeny graph of the class, at about h(O)^{1/2} steps
    with h(O) = |D|^{1/2 + o(1)} = p^{1/2 + o(1)}, i.e. p^{1/4 + o(1)} time and
    p^{1/4 + o(1)} memory [recall-confident: Galbraith 1999; Galbraith-Stolbunov
    2013; NOT re-verified this session -- see assumptions A3 and the minimal
    test, which measures the exponent rather than assuming it].

    (C) THE CONSEQUENCE, WHICH IS NOT ELEMENTARY AND IS NOT IN THIS CORPUS.
    The elimination cost p^{1/4} is BELOW the target problem's baseline cost
    p^{1/2}. Therefore:
      C1. CEILING. Any R^{V} with q = p^{o(1)} queries that beats rho gives an
          oracle-free algorithm that also beats rho. Direction 2 can never be
          the SOURCE of a break; it can only be a re-description of one.
      C2. FLOOR ON THE ORACLE'S VALUE. The oracle's total worth to any
          adversary is at most q * p^{1/4}, so for the oracle to matter at all
          the reduction must make q >= p^{1/4} queries -- at which point R'
          costs p^{1/2} and the whole exercise has re-derived the baseline.
      C3. THE LANE IS DEGENERATE, NOT MERELY CLOSED. Every prior L10 closure
          (IDEA-20260807-5d7606 OBS-1 constancy; IDEA-20260807-0fafe8 Hom = 0;
          IDEA-20260807-bbdcf3 size gap; IDEA-20260807-1b7241 CAGG simulator)
          proves the oracle is worth ZERO in some restricted setting. This
          record proves it is worth at most p^{1/4} in NO restricted setting at
          all -- unconditionally in the real model, with real coordinates, with
          R1 field data available, with non-uniform advice allowed -- and that
          this already suffices. The prior closures are then corollaries in
          spirit rather than in logic, and their model restrictions become
          unnecessary.

    (D) THEOREM OR HABIT -- THE ANSWER THE HANDOFF ASKS FOR, STATED EXACTLY.
    The campaign's assumption that a vectorization oracle is useless is:
      - A THEOREM, in the precise form C1/C2 above, with the honest scope that
        it is conditional on the p^{1/4} vectorization cost (assumption A3) and
        on knowledge of End(E) (assumption A2).
      - A HABIT in its stated JUSTIFICATION. T5 (the reachability gate) prices
        REACHING a specified curve, i.e. the cost of CONSTRUCTING a
        vectorization capability. In Direction 2 that capability is GRANTED, so
        T5 does not apply and citing it is a category error. The correct reason
        is the elimination cost, which is the same number (p^{1/4}) arrived at
        for the opposite reason: not that the oracle is hard to get, but that
        it is cheap enough to reproduce.
    Recording that distinction is the deliverable, because the two reasons have
    different forward guidance: T5 would suggest hunting for cheaper walks,
    which is worthless here; the elimination cost says the only thing worth
    hunting is an oracle whose elimination cost EXCEEDS p^{1/2}.

    (E) THE ASYMMETRY WITH DIRECTION 1, WHICH FALLS OUT OF THE SAME LENS.
    Define the ELIMINATION COST of an oracle as the best known cost of
    answering one of its queries without it, and the TARGET COST as the
    baseline for the problem the reduction is trying to solve.
      Direction 2: elimination p^{1/4} < target p^{1/2}. Theorem bites; lane
        degenerate.
      Direction 1 (ECDLP oracle used to attack vectorization): elimination
        p^{1/2} (rho) > target p^{1/4} (vectorization). The same theorem is
        VACUOUS -- eliminating the oracle costs more than solving the target
        outright -- so Direction 1 is NOT closed by this argument and needs a
        genuine barrier. That barrier is proposed separately in
        IDEA-20260811-45676a. The two directions are quantitatively
        asymmetric, and the asymmetry is exactly the inequality
        h^{1/2} < N^{1/2}.

    (F) WHAT THIS RECORD DOES NOT SAY. It is not a lower bound on ECDLP. It
    does not say a Direction-2 reduction cannot exist -- it says any such
    reduction is automatically an oracle-free algorithm, which is a statement
    about where to look, not an impossibility. It says nothing about quantum
    vectorization (Kuperberg/Regev subexponential), which would only LOWER the
    elimination cost and strengthen C1.

  resource_label: >-
    R4 (isogeny graph / class-group action) and R3 (End(E) as a ring, needed to
    know D and Cl(O)). This record AUDITS those resources rather than consuming
    them; in the taxonomy of DECOMPOSITION.md section 2 it is an L12-style audit
    executed inside L10, like IDEA-20260807-1b7241.
  admissibility: admissible
  admissibility_argument: >-
    No step applies an endomorphism to a point of G, so the H-ENDO-001 scalar
    collapse is not the operative filter; the oracle answers questions about
    CURVES. KN-FIND-b7e091's two closed classes (incidence, endomorphism-image)
    are different oracles and are not invoked. The record is admissible on its
    face and then shows the lane is degenerate for a cost reason, which is
    exactly the case the filter is designed to let through.

  object_first_candidate:
    established_families_declared_off_limits: >-
      For this session the following are named and declared off-limits as the
      PRIMARY lens, per docs/inventor-protocol.md section 1: (i) the connecting
      ideal class as the tracked object (the vectorization object itself);
      (ii) the kernel ideal of <Q> (IDEA-20260807-5d7606's object); (iii) the
      scalar lambda by which an endomorphism acts on G (H-ENDO-001's object);
      (iv) attack-cost functionals as class functions (L1's object); (v) the
      generic-group transcript (L12's object).
    tracked_object: >-
      THE ELIMINATION LEDGER: the running pair (number of oracle queries made,
      total cost of answering them without the oracle), followed through the
      reduction's execution. Not the answers, not the queries -- the price of
      not having asked.
    lossiness: >-
      GENUINELY LOSSY. The projection maps the reduction's entire state (all
      field elements, all points, all curve equations, all oracle answers) to
      two integers. It discards every answer's CONTENT and keeps only its
      PRICE. It is discarded compatibly with the target's operations because
      cost is additive over queries and the simulator's per-query cost bound is
      instance-independent: composition of two reduction segments adds their
      ledgers, so one-step propagation is defined and deterministic. A
      projection that kept the answers would be a change of coordinates on the
      transcript and would gain nothing; this one loses everything except the
      quantity that decides the question.
    propagation: >-
      One step: a query increments the count by 1 and the cost by the
      elimination cost of that query type. Measurable directly by instrumenting
      any implementation. The propagation is exact, not heuristic.
    survival_score: >-
      Survives as long as the elimination cost is uniform across query types.
      DISSOLVES when the oracle is adaptive in a way that makes some queries
      cheaper to answer than others (not the case for V, whose answer is a
      single class-group element), or when the oracle answers a question with
      NO finite elimination cost (an oracle for an undecidable or
      information-theoretically unavailable predicate). Naming that dissolution
      point is the record's own forward guidance: the only interesting oracles
      in this lane are ones with elimination cost above p^{1/2}.

  mechanism: >-
    STEP 1 (zero compute). Fix the quantifier order in (A) and freeze it.

    STEP 2 (zero compute). Establish the elimination cost as a literature
    quantity and record it with its dependencies: knowledge of D and its
    factorisation, knowledge of Cl(O) structure or a MITM that avoids it,
    p^{1/4} memory, and the class-number size h(O) = |D|^{1/2+o(1)}.

    STEP 3 (zero compute). Write the simulator R' explicitly and account its
    overhead per query, including the one-time precomputation (class group
    structure, small-prime splitting data) charged separately from the
    per-query cost.

    STEP 4 (toy compute). MEASURE the elimination cost exponent rather than
    citing it. Implement MITM vectorization on toy ordinary classes across a
    p-ladder, fit the slope of log(steps) against log(p), and check it against
    the predicted 1/4. This is the record's hard gate: if the measured slope is
    materially above 1/4 at toy scale in a way that does not converge, the
    elimination cost is wrong and every conclusion in (C) must be recomputed
    with the measured value.

    STEP 5 (zero compute). Re-audit every existing L10 proposal against C1/C2:
    for each, count the V-queries and classify each as (a) on a curve the
    proposer reached by a walk it performed, or (b) otherwise. Prediction:
    100 percent are (a), in which case the elimination cost for those queries
    is ZERO, not p^{1/4}, and the lane is even more degenerate than the theorem
    requires.

    STEP 6 (zero compute). Record the residual class: oracles whose elimination
    cost exceeds p^{1/2}. Name at least one candidate so the guidance is not
    empty -- see IDEA-20260811-4e0422 (blind in-class sampling) and
    IDEA-20260811-319a07 (ray-class vectorization, whose elimination cost is
    p^{1/2} precisely because it contains ECDLP).

  why_not_a_renamed_known_approach: >-
    The nearest KNOWN approach is the generic observation that an oracle is
    worth at most its own solution cost. That observation is folklore and this
    record claims no novelty for it. What is not folklore, and what is absent
    from this corpus, is the INSTANTIATION: nobody in the 146-proposal corpus
    has written down the elimination cost of the vectorization oracle, compared
    it against the rho baseline, and concluded that the comparison alone
    decides the lane. Every prior L10 closure instead builds a model
    restriction (CAGG), an algebraic obstruction (Hom = 0, OBS-1 constancy) or
    a size argument (h < N), each of which is strictly harder to establish and
    strictly weaker in scope than the two-number comparison
    h^{1/2} < N^{1/2}. The record is therefore a simplification and a
    strengthening, and its honest contribution is that it makes four earlier
    arguments unnecessary rather than that it discovers a new obstruction.

  proof_search_map:
    bottleneck: >-
      The elimination cost of one V query, i.e. the true classical complexity
      of ordinary-curve vectorization at fixed trace. Every conclusion is a
      comparison of that number against 1/2. Nothing else in the record is
      load-bearing.
    baseline_embedding:
      parameter_slice: >-
        Set q = 0. The simulation theorem degenerates to the identity R' = R and
        the statement becomes "ECDLP costs what ECDLP costs", whose baseline is
        parallel rho with distinguished points at 0.886*sqrt(N) group
        operations and O(1) memory (KN-TECH-001, KN-TECH-006). Set instead the
        elimination cost to infinity and the theorem becomes vacuous, which is
        the Direction-1 case of (E) -- so both boundaries of the family are
        reproduced exactly.
      reproduction_check: >-
        Frozen regression fixture: toy instances at 16, 20 and 24 bits solved by
        the repository's rho implementation, measured operation count within 20
        percent of 0.886*sqrt(N). If the baseline does not reproduce, no
        comparison in this record is interpretable.
    observation_collision:
      observable: >-
        The elimination ledger (q, q * elimination_cost). The conclusion rests
        on this pair alone.
      distinct_preimage_search: >-
        REQUIRED. Search for two reductions with identical ledgers but
        different success probabilities -- which certainly exist (a reduction
        that ignores the oracle's answers has the same ledger as one that uses
        them). This is a genuine collision and it is why the ledger bounds only
        the SIMULATION OVERHEAD and never the reduction's power. The record is
        written so that the collision is harmless: the ledger is used as an
        upper bound on cost, not as an identifier of behaviour. Any argument
        that used it as an identifier would be void, and this is the exact
        place a reviewer should check.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The oracle-free machine R' obtained by inlining the best known
          vectorization algorithm at every query site. Encoding: verbatim.
          Completeness: R' answers every query R could ask. Soundness: the
          answers are the true classes, so R' perfectly simulates. Transfer:
          success probability preserved exactly. Cost loss: + q*p^{1/4+o(1)}
          time and + p^{1/4+o(1)} memory, stated as the interface-preservation
          obligation.
        predicted_gain: >-
          None as an attack. The gain is a ceiling: it converts an open
          reduction question into an arithmetic comparison of two exponents.
      - transform: observable_fiber
        proposed_object: >-
          Hold the ledger fixed at (q, q*p^{1/4}) and vary the reduction. The
          fibre contains reductions of wildly different power, which is the
          collision above and bounds what the method can certify.
        predicted_gain: >-
          Bounds the method: it can certify a cost ceiling and nothing about
          existence.
    quantifier_order: >-
      ASSERTED: FORALL p, FORALL (E, O) with the factorisation of D given,
      FORALL R, THERE EXISTS R' (uniform in (p, E, O), constructed by inlining),
      FORALL instances (P, Q): success preserved and
      Time(R') <= Time(R) + q*p^{1/4+o(1)}.
      NOT ASSERTED: that no R^V exists; that R' beats rho; that the oracle
      carries zero information. The record's whole content is an inequality
      between two costs and it never quantifies over nonexistent objects.
      NON-UNIFORMITY: allowing R polynomial advice depending on (p, E, t) does
      not change the theorem, because R' may take the same advice. Allowing
      advice that depends on the INSTANCE is excluded and is lane L13/R8's
      territory, named here rather than swept up.
      BASE POINT AND End(E): the theorem is stated WITH knowledge of End(E)
      (needed for the simulator). Without it the simulator pays the
      subexponential cost of factoring t^2 - 4p first; that variant is stated
      separately in assumption A2 and is strictly weaker.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Any ECDLP algorithm using a free exact Cl(O)-vectorization oracle can
        be converted into an oracle-free algorithm at an additive cost of
        q*p^{1/4+o(1)} time and p^{1/4+o(1)} memory." It can NEVER certify that
        no such algorithm exists, nor anything about oracles whose elimination
        cost is unknown or superpolynomially large, nor anything about
        Direction 1.
      nearby_object_control: >-
        THE ECDLP ORACLE ITSELF, used against vectorization (Direction 1).
        There the identical method yields the vacuous bound
        T + q*p^{1/2}, larger than the p^{1/4} target, so the method PROVABLY
        fails to close the nearby object. That is the required control and it
        passes: the method is not a universal "oracles are useless" machine, it
        discriminates the two directions correctly and for the right reason.
        A version of this argument that also "closed" Direction 1 would be
        identifying the wrong structure.
    proof_obligations:
      - claim: >-
          h(O) = |D|^{1/2 + o(1)} and |D| is of order p away from the Hasse
          endpoints.
        responsibility: size
      - claim: >-
          Classical ordinary vectorization at fixed trace costs
          h^{1/2 + o(1)} = p^{1/4 + o(1)} time and p^{1/4+o(1)} memory, given
          the factorisation of D.
        responsibility: runtime
        status: >-
          [recall-confident, NOT re-verified this session] -- this is the single
          citation the record depends on and STEP 4 measures it rather than
          assuming it.
      - claim: >-
          The inlined simulator preserves R's success probability exactly.
        responsibility: correctness
      - claim: >-
          Additive cost accounting over q queries, with the one-time
          precomputation charged separately.
        responsibility: interface
      - claim: >-
          Non-uniform advice depending only on (p, E, t) is available to R'
          as well.
        responsibility: scope

  predictions:
    - metric: >-
        fitted slope of log(number of isogeny steps) against log(p) for a
        meet-in-the-middle vectorization implementation on toy ordinary classes
        across a p-ladder of at least five sizes with h(O) >= 50
      direction: lower
      minimum_effect: >-
        slope in [0.20, 0.32], consistent with 1/4. A slope at or above 0.45
        would mean the elimination cost is of rho's order, C1 collapses, and
        the lane is NOT degenerate -- the single most consequential possible
        outcome of this record and the reason STEP 4 exists.
    - metric: >-
        fraction of V-queries in the existing L10 proposal corpus that are on
        curves the proposer reached by a walk it performed itself
      direction: higher
      minimum_effect: >-
        predicted 1.00 over all queries in IDEA-20260807-5d7606, -0fafe8,
        -bbdcf3, -1b7241, -e9d57c, -326442. Any query on a curve of genuinely
        unknown address is a member of the residual class and must be escalated
        to IDEA-20260811-4e0422.
    - metric: >-
        measured simulation overhead ratio Time(R')/Time(R) on a planted toy
        reduction that makes q queries
      direction: different
      minimum_effect: >-
        must match 1 + q*(measured elimination cost)/T to within 25 percent. A
        systematic discrepancy means the cost model is wrong, not the
        mathematics.

  minimal_test:
    design: >-
      STAGE 0 (ZERO COMPUTE, AND THIS IS THE CHEAPEST VALID DISCRIMINATOR IN
      THE LANE): verify the two numbers against the literature and against each
      other. Confirm (i) h(O) = p^{1/2+o(1)} for ordinary classes away from the
      Hasse endpoints and (ii) the best published classical cost of ordinary
      vectorization at fixed trace. If (ii) turns out to be p^{1/2} or worse
      rather than p^{1/4}, this record is refuted before any compute is spent
      and the lane is NOT degenerate. One literature check decides it.

      STAGE 1 (minutes, toy): build ordinary toy classes at 16-28 bits with
      h(O) >= 50, enumerate each class by small-ell isogeny walks, and
      implement MITM vectorization. Fit the cost exponent. Report the fit with
      confidence intervals and with h(O) reported per instance.

      STAGE 2 (minutes, zero risk): instrument a PLANTED reduction -- a machine
      that makes q dummy V-queries and then runs rho -- and measure the
      simulation overhead against the predicted additive model.

      STAGE 3 (zero compute): the corpus re-audit of STEP 5.

      STAGE 4 (zero compute): write the residual class of oracles with
      elimination cost above p^{1/2}.
    controls:
      - >-
        NULL OBJECT (matched, mandatory): run the identical MITM cost-fit on a
        SYNTHETIC torsor -- a random simply-transitive action of a group of the
        same order h on h abstract labels, with the same walk generators and
        the same collision detection. Predicted: the same p^{1/4} scaling. If
        the real classes are materially FASTER than the synthetic null, the
        isogeny class has exploitable structure the null lacks and that is a
        finding in its own right; if materially SLOWER, the implementation is
        the bottleneck and the measured exponent is void.
      - >-
        PLANTED SIGNAL (two-directional control, mandatory per RQ-INSTR-f8faa0):
        a synthetic torsor with a planted short generating relation making
        vectorization polylog. The instrument MUST find it far below h^{1/2};
        an instrument that reports h^{1/2} there is blind and the whole run set
        is INVALID rather than negative.
      - >-
        rho baseline reproduced at 0.886*sqrt(N) within 20 percent on the same
        instances, so the comparison of exponents is anchored to a measured
        baseline rather than to a quoted constant.
      - >-
        h(O) reported per instance; classes with h(O) < 50 excluded from the
        fit, because at small h every exponent fit is noise.
    required_metrics:
      - fitted elimination-cost exponent with confidence interval, real classes
      - the same, synthetic null torsor
      - the same, planted-shortcut torsor
      - rho operation counts on the same instances
      - per-instance h(O), |D|, and the number of split small primes used

  controls:
    - >-
      NULL OBJECT: the synthetic random torsor of the same order, described
      above. This is the matched null the deliverable requires.
    - >-
      DECAY PARAMETER: h(O). As h(O) decreases toward 1 the measured
      vectorization cost must decay to O(1), because a class with one curve has
      nothing to vectorize. A cost that does NOT decay as h -> 1 is the
      canonical artifact tell and indicates the instrument is measuring walk
      overhead rather than search.
    - >-
      A second, independent vectorization implementation (e.g. class-group
      structure plus lattice reduction on the relation lattice, versus pure
      MITM walking) must agree on the exponent to within the stated band, so
      that an implementation artifact cannot be read as the elimination cost.

  confounders:
    - >-
      MEMORY, NOT TIME, MAY BE THE BINDING COST. The p^{1/4} figure is a
      time-AND-memory figure for MITM. Under a full-cost or AT^2 accounting the
      elimination cost rises and C1's margin narrows. The record states the
      exponent honestly in both axes and does not hide behind time alone.
    - >-
      KNOWLEDGE OF End(E). The simulator needs D and its factorisation. At toy
      scale this is free; at crypto scale factoring t^2 - 4p is subexponential
      and is a genuine one-time cost. It is a PRECOMPUTATION, charged
      separately, and the record must not be read as claiming it is free.
    - >-
      VOLCANO LEVEL. Curves at different levels have different orders O and
      different h(O). The cost fit must be stratified by level or a level
      effect will be misread as a scaling effect.
    - >-
      SMALL-p ARTIFACTS. Below h(O) = 50 the birthday regime has not started
      and the fitted slope is meaningless.

  falsification_conditions:
    - >-
      The best classical cost of ordinary vectorization at fixed trace is
      p^{1/2} or worse rather than p^{1/4}. Then the elimination cost is not
      below the baseline, C1 and C2 fail, and the lane is not degenerate. This
      is decided by a literature check at zero cost and is the record's primary
      falsifier.
    - >-
      A measured MITM exponent at or above 0.45 that does not converge toward
      1/4 as h grows across the ladder. Same consequence, established
      empirically.
    - >-
      An exhibited reduction R^V whose queries cannot be answered by any
      algorithm at cost p^{1/4} -- e.g. queries on curves outside the class, or
      on pairs whose connecting class is not unique. That would mean the oracle
      as granted is stronger than vectorization and the simulation does not
      apply; the record's scope statement would then be wrong.
    - >-
      The planted-shortcut control failing to fire. Instrument blind; run set
      INVALID, not negative.

  interpretation_limits:
    - >-
      NOT an impossibility theorem and NOT a lower bound on ECDLP. It converts
      an existence question into a cost comparison; existence remains open and
      is explicitly not claimed either way.
    - >-
      Scoped to ORDINARY curves over F_p at fixed trace, to the exact
      Cl(O)-vectorization oracle, and to classical algorithms. Says nothing
      about supersingular curves, extension fields, or quantum adversaries --
      except that quantum vectorization would LOWER the elimination cost and
      strengthen the conclusion, which is noted and not developed.
    - >-
      Toy scale for every measured quantity (p up to about 28 bits). The
      simulation theorem itself is scale-free but its INPUT -- the elimination
      cost exponent -- is a literature claim validated here only at toy scale.
      The two must not be conflated.
    - >-
      A confirmed ceiling BOUNDS what L10 may be promoted to. It is not
      evidence about any other lane and it does not unpause RQ-ICINV-475b5e.

  assumptions:
    - >-
      A1. E ordinary over F_p with End_{F_p}(E) = O, N prime with N || #E(F_p),
      and G the unique order-N subgroup. Instances violating this are excluded
      and the exclusion is checked per instance, not assumed.
    - >-
      A2. The simulator knows End(E), equivalently D and its factorisation.
      Without it, add the subexponential cost of factoring t^2 - 4p as a
      one-time precomputation. The theorem is stated in the WITH-knowledge
      quantifier and the without-knowledge variant is strictly weaker and is
      labelled as such.
    - >-
      A3. Classical ordinary vectorization at fixed trace costs
      p^{1/4 + o(1)} in time and memory [recall-confident: Galbraith,
      "Constructing isogenies between elliptic curves over finite fields",
      LMS JCM 2 (1999); Galbraith-Stolbunov, "Improved algorithm for the
      isogeny problem for ordinary elliptic curves", AAECC 2013. NOT
      re-verified this session; WEB SEARCH WAS UNAVAILABLE]. This is the single
      external dependency and STAGE 0 exists to check it.
    - >-
      A4. The vectorization oracle returns exactly the connecting class and
      nothing more. An oracle returning, say, a SMOOTH representative ideal or
      an explicit isogeny would be strictly stronger and is outside scope.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NO LOAD-BEARING STEP OF THE SIMULATION THEOREM IS HEURISTIC. The
        inlining argument is exact. The only quantitative inputs are (i)
        h(O) = |D|^{1/2+o(1)}, which follows from the analytic class number
        formula with the unconditional bound L(1, chi_D) = O(log|D|) and
        Siegel's lower bound for the o(1), and (ii) the vectorization cost
        exponent, which is a cited algorithmic result, not a distributional
        assumption.
      rigorous_support: >-
        Analytic class number formula; unconditional upper bound on L(1, chi);
        Siegel (ineffective) or GRH (effective) for the two-sided polylog
        control. Stated so that no reader imports conditionality the record
        does not use.
      validation_plan: >-
        Toy-scale consistency only: compute h(O) exactly for every discriminant
        in the ladder and confirm h(O) is within a recorded polylog factor of
        sqrt(|D|). LABELLED TOY SCALE; this validates the implementation, not
        the theorem.
      tail_checks: >-
        Check the extremes of the ladder: the smallest and largest observed
        h(O)/sqrt(|D|) ratios against the recorded polylog envelope, and flag
        any discriminant whose ratio falls outside it as a small-|D| artifact
        rather than a violation.
    - id: H2
      statement: >-
        For the MITM measurement only: random walks in the F_p-isogeny graph of
        an ordinary class, using the split small primes as generators, mix in
        O(log h) steps and the collision statistics of two independent walks
        follow the birthday law for a uniformly random simply-transitive action
        of a group of order h, uniformly for h >= 50.
      rigorous_support: >-
        Imitates the GRH-conditional rapid mixing of the class-group Cayley
        graph already cited by T5 of DECOMPOSITION.md, combined with the
        classical birthday bound for uniform sampling. It is a genuine
        heuristic here because the generators are a FIXED small-prime set, not
        uniform group elements, and that gap is exactly what the synthetic null
        controls for.
      validation_plan: >-
        Sample 10^4 walk pairs per p on the toy ladder, compare the empirical
        collision-time CDF against the birthday prediction for a group of the
        measured order h, and compare both against the synthetic null torsor
        with the same generator count. Record the generator set, the walk
        length, and the p-ladder explicitly.
      tail_checks: >-
        Compare the earliest observed collision across all samples against the
        predicted extreme-value quantile for the birthday law; a systematically
        early tail indicates non-uniform mixing and invalidates the exponent
        fit rather than the theorem.

  reachability_gate: >-
    T5 STATUS, AND THIS IS PART OF THE RECORD'S CONTENT. The proposal does not
    pass T5, it DISSOLVES it for this lane: T5 prices reaching a SPECIFIED
    curve, which is exactly the vectorization capability that Direction 2
    grants for free. Once granted, T5 is not the operative gate and citing it
    is the habit this record identifies. The operative quantity is the
    elimination cost, which happens to be the same p^{1/4} for the opposite
    reason.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND NONE MOVES. The record states a CEILING
      for a hypothetical family: any Direction-2 reduction with q queries and
      time T yields an oracle-free algorithm at T + q*p^{1/4+o(1)}. Since no
      such reduction is exhibited, no algorithm is proposed and no exponent is
      asserted.
    memory_exponent: >-
      The simulator uses p^{1/4+o(1)} memory for meet-in-the-middle, which is
      the dominant memory cost and is disclosed as such. The record's own
      instrumentation uses O(1) beyond the walk tables.
    best_known: >-
      Parallel Pollard rho with distinguished points, 0.886*sqrt(N) group
      operations and O(1) memory (KN-TECH-001, KN-TECH-006); BSGS at sqrt(N)
      time and sqrt(N) memory (KN-TECH-031); automorphism-discounted rho at
      0.886*sqrt(N/|Aut|) on CM curves (KN-TECH-018). None is changed.
    hidden_overhead: >-
      The o(1) in p^{1/4+o(1)} hides the polylog class-number factor and, more
      importantly, the SUBEXPONENTIAL one-time cost of factoring t^2 - 4p when
      End(E) is not given. Disclosed rather than absorbed. The elimination cost
      is also a TIME-AND-MEMORY figure; under a full-cost or AT^2 accounting it
      rises and the margin over p^{1/2} narrows, which is stated here and not
      buried.
    tradeoff_note: >-
      The simulator's per-query cost sits on the van Oorschot-Wiener curve for
      the class-group search: with memory w it costs about sqrt(h^3/w), so with
      w = 1 it degrades to h^{3/2} = p^{3/4}, which is WORSE than rho and would
      void C1. The p^{1/4} elimination cost therefore REQUIRES p^{1/4} memory,
      and any memory-constrained reading of this record must recompute the
      comparison. This is the single most important honesty item in the record.

  sota_delta: >-
    Zero. 0.886*sqrt(N) before, 0.886*sqrt(N) after. The delta is entirely in
    framing: it replaces four model-restricted closures with one unconditional
    two-number comparison, states the lane's ceiling as p^{1/4} rather than as
    "zero", identifies T5 as a misattributed justification, and derives the
    Direction-1/Direction-2 asymmetry from the inequality h^{1/2} < N^{1/2}.
  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES against every row of the
    prime-field frontier this campaign recognises: parallel rho with
    distinguished points (0.886*sqrt(N) time, O(1) memory, KN-TECH-001 /
    KN-TECH-006); automorphism-discounted rho on CM curves
    (0.886*sqrt(N/|Aut|), KN-TECH-018); BSGS (sqrt(N) time and memory,
    KN-TECH-031); Pollard kangaroo on a known interval of width W (about
    2*sqrt(W)); van Oorschot-Wiener at sqrt(N^3/w) with memory w. This record
    mounts no attack, so it is dominated by all of them on time, is dominated
    by rho on memory (its instrumentation needs p^{1/4} for the simulator
    measurement), and consumes no data or queries beyond the granted oracle.
    dominated_by is NOT null and is not close to null.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.80 that the elimination cost is confirmed at p^{1/4} in time AND memory
    by the literature check, in which case C1 and C2 stand as stated. 0.15 that
    it is confirmed only in a memory-heavy model, in which case the conclusion
    survives in the memory-rich regime and must be restated in the memory-poor
    one. 0.05 that it is materially worse than p^{1/4}, which refutes the
    record and REOPENS Direction 2 -- by far the most valuable branch, which is
    why STAGE 0 costs nothing and runs first. Below 0.02 that anything here
    moves an attack exponent; it is a ceiling, not an algorithm.

  p2_p3_flags: >-
    P2: NOT ADJACENT. No factor base, phi-stable or otherwise, appears anywhere
    in this record; H-STR-002 and DEFER-BATCH009-001 are untouched.
    P3: FLAGGED AS ADJACENT BUT NOT TRIGGERING, for the Coordinator to route.
    The record uses the exponent 1/4 in two places: as the elimination cost of
    the granted oracle, and as a conditional ceiling for a family of reductions
    that is not claimed to be non-empty. No candidate algorithm is proposed, no
    excess over the automorphism-discounted rho baseline is measured, and no
    excess is stated. The sqrt(6) automorphism discount is not invoked.

  novelty_status: unverified
  novelty_screen: >-
    Screened on 2026-08-11 against the committed proposal corpus in
    ledger/proposals/ by ripgrep. Queries run: "vectorization" (43 files);
    "question_id: RQ-CLGP-b99df5" (11 records, all headers read in full);
    "generic group action|Montgomery|Zhandry|group action model|GGA" (no
    relevant hit anywhere in ledger/); "non-uniform|advice|preprocessing"
    within IDEA-20260807-1b7241; "gcd(N, h)|N divides h" (hits only in
    IDEA-20260807-bbdcf3). Full reads: IDEA-20260807-5d7606 (complete),
    IDEA-20260807-1b7241 (model and simulator sections), IDEA-20260807-413fcc
    (curve-measurable oracle class), IDEA-20260808-5158fa (complete),
    IDEA-20260808-4d77a6 (format exemplar), KN-FIND-b7e091,
    analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md,
    docs/inventor-protocol.md, knowledge/techniques/KN-TECH-080.md,
    docs/target-result-profile.md.
    RESULT: no record in the corpus states the elimination cost of the
    vectorization oracle, and no record compares h^{1/2} against N^{1/2} as the
    decisive quantity. IDEA-20260807-bbdcf3 compares h against N for a DIFFERENT
    purpose (the information capacity of a hypothetical bridge, and the
    Hom = 0 consequence), never as an oracle-simulation cost.
    EXTERNAL NOVELTY IS NOT ESTABLISHED: WEB SEARCH WAS UNAVAILABLE THIS
    SESSION (the tool returned a backend model error on every attempt). The
    underlying observation -- an oracle is worth at most its own solution cost
    -- is folklore and is NOT claimed as new; only its instantiation and
    consequence in this lane are offered as a contribution, and even those may
    be folklore in the isogeny literature. novelty_status is therefore
    `unverified` and not `speculative`.
  discriminated_from: >-
    IDEA-20260807-1b7241 (CAGG simulator) proves the oracle is worth ZERO but
    only inside a model that forbids the adversary from seeing x(Q) as a field
    element; its own section (E) names that restriction as the residual open
    class. This record makes NO model restriction -- R1 field data, real
    coordinates, and non-uniform advice are all allowed -- and pays for that
    generality by concluding "at most p^{1/4}" instead of "zero". The two are
    complements: 1b7241 is tight inside its model, this is unconditional
    outside it.
    IDEA-20260807-5d7606 (forward reduction broken at OBS-1) closes bridges
    that factor through the subgroup lattice and explicitly leaves open
    constructions using x(Q) as a field element. This record covers those too,
    by cost rather than by structure, and separately supplies the correction
    that 5d7606's stated falsifier is satisfiable (see IDEA-20260811-4e0422,
    where the correction is developed).
    IDEA-20260807-0fafe8 (backward reduction, Hom = 0) is Direction 1 and is
    exactly the case where this record's method is VACUOUS -- which is stated
    here as the nearby-object control rather than hidden.
    IDEA-20260807-bbdcf3 (size gap) uses h < N to kill homomorphic bridges;
    this record uses h^{1/2} < N^{1/2} to bound a simulation cost. Same two
    numbers, different role, different conclusion, and neither implies the
    other.
    IDEA-20260808-28361d (T5 is the wrong gate; the class is enumerable inside
    the rho budget) is the nearest record in SPIRIT: it also demotes T5. It
    demotes T5 by enumerability of the whole class and replaces it with a
    DENSITY criterion for good curves; this record demotes T5 by noting the
    oracle is granted and replaces it with an ELIMINATION COST. Different
    quantity, different conclusion, and 28361d says nothing about oracles.
    IDEA-20260807-413fcc (curve-measurable oracles carry zero bits) closes
    oracles taking no group handle; V takes no group handle either, so 413fcc
    already covers V in the information sense. This record's contribution
    beyond it is the COST statement, which survives even for oracles that DO
    take group handles and which yields the ceiling and the asymmetry.
