  proposed_by: idea-generator
  status: proposed
  class: mechanism

  title: >-
    REPAIRED NONLINEARITY DILUTION RAMP FOR THE NAMED-UNMEASURED CARRIER - EV-AES-ec53f1 sealed the
    scope-narrowed verdict with e = (q0^q1)^(p0^p1) NAMED UNMEASURED under any nonlinear S-box
    (red-team J5), and EV-AES-b2910a sealed the hardening battery around it; DEC-20260901-079719
    RANK 1 therefore dispatches the repaired form of IDEA-20260901-bcb117: a frozen position-dilution
    ramp S_k (AES table at k of 16 byte positions, identity elsewhere; k in {0,1,2,4,8,12,16}) with
    a preregistered per-trial carrier statistic - the byte weight wt(e) of the identity-law deviation,
    conditioned on hit vs miss - measured first at the t=1 AES seat (the J5 control: one r=5 AES arm
    at 2^30 logging per-trial wt(e)) and then along the ramp. The question is two-part and preregistered:
    does the r=5 excess decay WITH a measurable carrier signature (hit trials concentrate on small-e),
    and does the signature vanish when the excess vanishes. This record repairs bcb117's filed design
    in four ways: (i) the carrier statistic is now the primary tracked object (bcb117 logged hit counts
    and W histograms only, never e); (ii) a Gate-0-style anchor reproduction of the committed
    L1-AES-R5-P30 receipt (14 hits, identical indices) gates every ramp arm, per the post-bcb117
    integrity standard (BATCH-803af6 C4 toggle discipline, TASK-20260901-92672b field-exact precedent);
    (iii) the design is staged to the one-producer <= 8-run budget (Stage 0 = J5 + instrument
    validation; Stage 1a/1b = ramp points); (iv) falsification criteria now separate "carrier reading
    falsified" from "carrier reading weakened" and carry a dead-round tripwire that escalates to a
    claim-changing review if fired.

  object: >-
    TRACKED OBJECT 1 - THE CARRIER STATISTIC UNDER NONLINEAR S-BOXES. The deviation vector
    e = (q0^q1)^(p0^p1) (16 bytes, computed per trial from the drawn plaintext pair p0,p1 and the
    post-swap decrypted pair q0,q1; identically zero in the affine limit, IDEA-20260901-04606c P1/H2).
    The retained per-trial quantity is wt(e), the number of nonzero bytes of e (0..16; the bit weight
    0..128 rides as a secondary). Per arm: the full wt(e) histogram over nontrivial trials, split
    hit (W>=1) vs miss (W=0), plus a per-hit detail record (thread, in-thread index, W, Z, vanishing
    word mask, wt(e) byte and bit). This is the first measurement of e under a nonlinear S-box in
    the campaign (EV-AES-ec53f1 OBS-FE0-4, confound 4; EV-AES-b2910a confound 3).
    TRACKED OBJECT 2 - THE DILUTION RAMP ITSELF. A frozen one-parameter family S_k interpolating
    the S-box layer between the AES table (k=16) and the identity limit (k=0), holding round
    geometry, key seed, and probe cell fixed: the per-point hit count, excess against the analytic
    null, and the carrier separation at each point - a joint (excess, carrier) curve, not two
    separate measurements. The ramp's t=0 limit is THE IDENTITY (the affine limit of the sealed
    verdict; the native seat of the affarm046.c lineage; identical to the committed BATCH-b41ba9
    affine anchor): not a general affine-equivalent table (named successor control), and not the
    nibble-wise-lift subclass of EV-AES-b2910a J4 (that subclass is nonlinear; a t=0 limit must be
    the zero of the nonlinearity dose for the ramp to have a zero).
    ESTABLISHED FAMILIES OFF-LIMITS AS THE PRIMARY LENS: whole-S-box substitution (done, EV-AES-048545
    O-3) and whole-cipher substitution (done, EV-AES-5478a0/EV-AES-dec938 lineage); the ramp
    interpolates where both stop, exactly as in bcb117's object.

  lossy_projection_test: >-
    The projection (S-box family, key, seed) -> (dose label k, hit/miss wt(e) histograms, hit count)
    discards everything about the tables beyond which positions carry the AES map, and discards the
    trial stream beyond the e-weight and outcome of each trial. Fibres are enormous (any permutation
    of the position sets, any table values at identity positions, share one label). Genuinely lossy.
    THE SHARP EDGE THIS RECORD OWNS: at an interior point where the hit count collapses to the
    residual level, the carrier separation and the class-fragility reading COME APART in the
    projection - "hits read at the residual level" (bcb117's STEP) and "hits ride on small-e"
    (04606c H2) are independent booleans, and this record measures both rather than merging them.
    A flat wt(e) split at a collapsed hit count is a live outcome, not a smoothed one.

  claim: >-
    Three statements, C1-C3, with the carrier clause carried as heuristic H1/H2 below, never as
    established.

    (C1) THE CARRIER AT t=1 (Stage 0, the J5 question itself). Under the full AES table at r=5,
    2^30, the committed anchor seat (seed 531001; replicated at 531002 in Stage 1a), the hit trials
    concentrate on small wt(e): the one-sided exact exchangeability test against the run's own
    miss-trial wt(e) distribution rejects toward small-e at alpha = 0.05, and the direction
    reproduces at the second seed. A null or reversed reading falsifies or weakens the carrier
    clause per the preregistered rule (F1/F2 below); the sealed verdict's carrier wording stays
    "named candidate, unmeasured" in either case until this record's evidence lands.

    (C2) JOINT DECAY ALONG THE RAMP (Stage 1). As the nonlinearity dose k falls from 16 to 0, the
    excess (hit count) and the carrier signature (hit-vs-miss wt(e) separation) decay TOGETHER:
    every interior point with >= 5 hits is tested by the same preregistered statistic with
    Holm-Bonferroni correction; the per-point all-trial mean wt(e) falls with k and reaches
    exactly 0 at k=0, where every trial hits (committed anchor law, re-seated in-block). The
    joint reading - excess and carrier signature move together across nine orders of magnitude of
    per-trial hit probability - is what converts e from a named candidate to a measured carrier at
    toy tier, or kills the coupling with a named split.

    (C3) THE RAMP SHAPE (inherited from bcb117 C1, rebinned for the 2^30 comparator). The shape of
    the hit-count curve over k is binned STEP / GRADUAL / OTHER by a preregistered rule
    (decision_rule below), with the same readings bcb117 assigned (global fragility vs tunable
    knob vs named successor object). C3 is decided by Stage 1 whatever C1/C2 say; the three claims
    are reported independently and any conflict (e.g. STEP shape but dead carrier split) is
    recorded as a live contradiction with both arms cited, never merged.

    (WHAT IS NOT CLAIMED) No statement about full-round or deployed AES; no published-frontier
    comparison in either direction (RQ-AES-003 R3); no claim that the ramp exhausts the S-box
    space (one frozen nested position family plus its endpoints); no claim that wt(e) byte weight
    is the only carrier statistic (bit weight and per-hit detail are logged; the one-sided
    statistic of IDEA-20260901-04606c route (ii) stays out of scope, named); bcb117's C2 (joint
    (W, vanishing-set) multinomial test) and C3 (four-key overdispersion audit) are NOT this
    record's claims - the per-hit detail records retain exactly the data a later C2 analysis
    needs (vanishing mask + W per hit), recorded as enabling artifacts, no test preregistered here.

  mechanism: >-
    The sealed verdict's factor-contrast reading (EV-AES-ec53f1 OBS-FE0-4, hardened by EV-AES-b2910a
    OBS-999-1) says death at r=6 tracks the S-box within the tested subclass; it does NOT say what
    carries the surviving r=5 residual. The candidate mechanism this record pursues is RESIDUAL-CARRIER
    COUPLING (IDEA-20260901-04606c H2): a nonlinear S-box layer makes the identity law q0^q1 = p0^p1
    fail on the overwhelming mass of trials (wt(e) large), and the rare excess hits concentrate on
    the trials where the composed S-box action along that trial's trajectory is accidentally
    affine-compatible (wt(e) small) - the nonlinear trial map SHADOWS the identity law on the
    trials that hit. Under this reading, diluting the nonlinearity restores the identity law in
    the mass (mean wt(e) falls) and the excess grows BACK along exactly the restoring trials, so
    the carrier signature and the excess are one phenomenon watched from two coordinates. The
    ramp exists precisely so this reading is a preregistered branch: the rival reading is that the
    excess rides on some other quantity (geometric, one-sided, schedule-side) and wt(e) is
    independent of outcome - in which case the ramp's shape survives as a result about the excess
    while the carrier clause dies. Both branches are fully specified before any ramp arm runs.

  why_not_a_renamed_known_approach: >-
    Nearest known method - S-box interpolation/perturbation studies in cipher design (recalled,
    unverified; carried from bcb117's screen, where no specific source was named and none was
    reachable) used here as an INTERVENTION FAMILY, never as authority. Nearest internal records:
    bcb117 itself (this record consumes its verdict and succeeds its stage design; bcb117 never
    ran and never logged e); IDEA-20260901-04606c (affine census; names e, measures only the
    affine limit e=0); EV-AES-64750e OBS-B803-1 (identity-law LOCALIZATION on 6 cells x 500-1000
    keyed AFFINE trials - no nonlinear S-box, no hit/miss conditioning, no ramp; it measured the
    law holding, this record measures the deviation from it under nonlinearity and conditions on
    outcome); IDEA-20260807-bbefda (active-byte count at fixed S-box - an orthogonal coordinate,
    explicitly discriminated as in bcb117); BATCH-803af6 C4 (toggle-equivalence GATE precedent
    reused as this record's integrity discipline, not a competitor measurement). Lossy-projection
    test above passes with the carrier/fragility split stated.

