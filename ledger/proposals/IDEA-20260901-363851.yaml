  dilution_family:
    parameter: >-
      k = number of byte positions carrying the AES S-box; the remaining 16-k positions carry the
      identity table. t = k/16; t=1 is the AES table, t=0 is the identity (the affine limit).
      S_k(position j) = AES table if j in P_k, else identity, for j = 0..15 (state byte index
      byte[4*col+row], campaign column-major convention).
    position_order: >-
      FROZEN, nested, word-stratified, no data-dependent choices. The pinned total order of the 16
      byte positions is the row-major sweep [0,4,8,12, 1,5,9,13, 2,6,10,14, 3,7,11,15] (row 0
      across the four words, then row 1, row 2, row 3); P_k = the first k positions of this order.
      Nesting: P_1 < P_2 < P_4 < P_8 < P_12 < P_16. Stratification rationale (disclosed, frozen):
      dose spreads one byte per word before deepening within a word, so small-k points are not
      confined to the active word; the active difference diagonal PW[0] = {0,5,10,15} receives its
      first AES byte at k=1 (byte 0), its second at k=8 (byte 5), third at k=12 (byte 10), fourth
      at k=16 (byte 15).
    points:
      - {k: 0,  t: 0.0,    role: 'ramp zero / affine limit', positions: 'none (identity everywhere)', status: 'committed endpoint (EV-AES-048545 O-7); re-seated in-block Stage 1a under the instrumented worker'}
      - {k: 1,  t: 0.0625, role: 'interior', positions: [0], status: 'Stage 1a arm; the minimal-dose point that separates STEP from GRADUAL'}
      - {k: 2,  t: 0.125,  role: 'interior', positions: [0,4], status: 'Stage 1a arm'}
      - {k: 4,  t: 0.25,   role: 'interior', positions: [0,4,8,12], status: 'Stage 1a arm (row 0 complete, one AES byte per word)'}
      - {k: 8,  t: 0.5,    role: 'interior', positions: [0,1,4,5,8,9,12,13], status: 'Stage 1b arm (two rows, two AES bytes per word)'}
      - {k: 12, t: 0.75,   role: 'interior', positions: [0,1,2,4,5,6,8,9,10,12,13,14], status: 'Stage 1b arm (three rows)'}
      - {k: 16, t: 1.0,    role: 'committed endpoint / J5 seat', positions: 'all (full AES table)', status: 'measured by the Stage 0 Gate-0/J5 arm (seed 531001, 2 threads, anchor stream) and re-seated in-block Stage 1b (seed 531001, 4 threads, ramp stream)'}
    table_construction: >-
      Each S_k is built inside the worker from the pinned AES table (computed by the existing
      build_sbox() at startup, KAT-pinned) and the identity; a dedicated table-freeze run emits,
      for every k, the 16 per-position table digests (sha256 of each 256-byte table), the
      bijection check, and the nestedness check (S_k[j] == AES[j] for j in P_k and S_k[j] == j
      elsewhere, all 16 positions, all 7 points). The digest file is write-once committed BEFORE
      the first arm and re-verified post-arm (V-804-2 digest discipline, as in BATCH-fe0bdc).
      Tables are deterministic functions of k - no seeds, no draws, no data-dependent choices.
    cost_per_point: >-
      One 2^30 arm per interior point at 4 threads. Baseline cost from the dispatch handoff:
      ~27 min per 2^30 arm at 4 threads on the batch machine (handoff-stated baseline; the
      executor measures actuals and stamps them - BATCH-015's machine ran the same exposure in
      ~89-102 s at 2-4 threads, so the handoff baseline is conservative for that hardware but
      binding for budgeting here). The Gate-0/J5 arm runs at 2 THREADS (not 4) to match the L1
      anchor receipt's thread count exactly (thread count changes per-thread chunking, hence the
      hit-index set); estimated ~2x the 4-thread baseline (~54 min) under the same handoff
      baseline. Exposure justification (power statement): 2^30 is the campaign-standard decisive
      exposure where the comparator, the anchor, and the death band are ALL pinned (L1-AES-R5-P30
      seat at 2^30; analytic null 1.0 at 2^30; J4 dead band <= 8 at 2^30; affine anchor re-seated
      at 2^30) - every ramp reading is directly comparable to a committed quantity at matched
      exposure without rescaling. At 2^30 the STEP prediction (interior ~10-25 hits) is separated
      from the GRADUAL threshold (k=1 >= 100 hits) by ~8 Poisson sd, cleanly decidable; a point
      landing in the preregistered ambiguity band (40 < k=1 hits < 100) names a 2^32 escalation
      as successor rather than being force-binned.

  carrier_statistic:
    quantity: >-
      e_i = (q0[i]^q1[i]) ^ (p0[i]^p1[i]) for i = 0..15, computed per trial AFTER the swap leg and
      both decryptions, from buffers already live in the worker; a pure read that feeds no trial
      decision, no RNG state, and no existing counter (source-diff-audited; perturbation checked
      empirically by receipt identity - integrity_gates). Primary statistic: wt(e) = #{i : e_i != 0}
      (byte weight, 0..16). Secondary: popcount of all 128 bits (0..128). Trivial-swap trials are
      excluded from all e statistics (matching the whist convention; E[T] = 0.25 at these seats,
      T = 0 realized on the committed anchor arm).
    logged_per_arm:
      - ewhist_all[17] and ewhist_miss[17] and ewhist_hit[17] - byte-weight histograms over nontrivial / miss / hit trials
      - per-hit detail record, cap 64 (HIT_LOG_CAP convention): (thread, in-thread index, W, Z, vanishing word mask over PW[0..3], wt(e) byte, wt(e) bit) - retains exactly the data bcb117's deferred C2 joint-distribution analysis needs
      - secondary bit-weight histograms (129 bins, same split)
      - mean and median wt(e) per split (all/miss/hit), emitted as exact rationals or with declared precision
    test_statistic: >-
      EXACT ONE-SIDED EXCHANGEABILITY TEST, preregistered before any arm. Let n = number of hit
      trials, w_1..w_n their byte weights, T_obs = sum(w_i). Let F_miss be the run's own empirical
      byte-weight distribution over MISS trials (exact 17-bin counts; hits excluded from the
      reference by construction). NULL H0: conditional on the hit count, hit labels are
      independent of wt(e), so w_i are iid draws from F_miss. CARRIER DIRECTION (preregistered,
      one-sided): small-e concentration. p_small = P_{F_miss}(sum of n iid draws <= T_obs),
      computed by exact dynamic-programming convolution of the 17-bin distribution for n <= 2000.
      For n > 2000 (possible at GRADUAL interior points): deterministic subsample = the first 2^20
      miss trials in stream order (pinned, not data-dependent); two-sample Wilcoxon rank-sum with
      tie correction (normal approximation) as the decision statistic plus a mean-difference
      z-test, both reported, Wilcoxon deciding. p_large (>= direction) is computed and reported at
      every point; a significant p_large is the anti-carrier (large-e concentration) signal.
      Decision at a single point: carrier-alive iff p_small <= 0.05. Multiple points (Stage 1):
      Holm-Bonferroni over the TESTABLE interior points (n_hits >= 5; points with n_hits < 5 are
      recorded as underpowered, never tested, never smoothed). Effect sizes (hit-vs-miss mean and
      median wt(e)) are reported at every point regardless of significance.
    predicted_distribution_H_carrier: >-
      (a) t=1 AES seat: the miss-trial wt(e) distribution is spread over moderate-to-large weights
      (the identity law fails in the mass); the ~14 hit weights sit in the low tail of F_miss;
      p_small <= 0.05 at seed 531001, direction reproduces at 531002. (b) Along the ramp: the
      all-trial mean wt(e) falls monotonically with k toward 0; at every testable interior point
      the hit weights concentrate in the low tail of that point's F_miss (Holm-adjusted p_small
      <= 0.05 at >= half the testable points); at k=0, wt(e) = 0 on ALL trials (delta at 0) and
      every trial hits - the limit is consistent with the coupling by construction.
    predicted_distribution_H_null: >-
      Hit weights are iid draws from F_miss at every point: p_small > 0.05 at both seeds at t=1;
      no Holm-adjusted rejections at interior points; hit-vs-miss mean separation ~ 0 everywhere.
      The excess may still decay with k (the ramp shape is measured independently); the carrier
      clause is then dead within the tested scope (this statistic, this family, this exposure),
      and the residual rides on something e does not measure.

  integrity_gates:
    gate_0_anchor_reproduction: >-
      BLOCKING, before any ramp arm: the instrumented worker (affarm046.c derivative, logging
      ENABLED) runs the committed anchor seat - (sbox=aes, rounds=5, amask=1, smask=1, log2N=30,
      seed=531001, armid=1, threads=2) - and must reproduce the committed immutable receipt
      L1-AES-R5-P30 FIELD-BY-FIELD: all 14 hit indices identical as (thread, in-thread index)
      pairs, whist, W_ge1_nontrivial, W_ge1_by_word, trivial_swaps_excluded, nontrivial_trials,
      thread_seeds, plaintext_stream_digest, sbox_first8, and every remaining field of the
      receipt, with the preregistered allowed-diff list EXACTLY {arm label, probe label, oracle
      label, elapsed_seconds_measured, measured_rate_trials_per_sec} plus fields the derivative
      ADDS (zhist, sbox_table_hex, all e fields). Missing fields fail the gate; the derivative
      must emit the full committed field set with identical semantics (including the receipt's
      hit_trials_logged = thread-0 hit count quirk, read from the receipt this session). This
      single run is simultaneously Gate 0, the perturbation check, and the J5 carrier measurement
      at seed 531001: receipt identity on the trial-map fields proves the logging changed nothing
      observable, because any perturbation of stream, key, round function, or counters would move
      at least one of the 14 indices or one histogram count. Precedents: TASK-20260901-e2e66e C4
      (ENABLED build reproduces L1-AES-R5-P30, 14 hits, identical indices, toggle diff exactly one
      #define line) and TASK-20260901-92672b (field-by-field reproduction with a preregistered
      three-field allowed-diff list).
    kat_pins: >-
      Before any arm: pin mode (FIPS-197 C.1 KAT enc+dec at r=10, BATCH-003 r=5/r=10 anchor
      ciphertexts, 512-vector r=1..10 roundtrips under the AES table) and pinidentity mode
      (identity table bijection + 512 roundtrips) must pass on the derivative; catches
      self-consistent-but-unpinned convention drift, exactly as in the affarm046.c lineage.
    source_diff_audit: >-
      Recorded diff of the derivative against affarm046.c with an annotation table: the round
      functions, geometry, RNG, trial loop, and counter updates must be UNCHANGED; the diff must
      consist only of (i) the widened table surface, (ii) the e-logging block (pure reads after
      all trial decisions into new counters only), (iii) the widened receipt emission. Any diff
      line touching the trial stream or existing counters voids the gate (F4).
    determinism: >-
      Byte-identical double-run of the derivative at log2N=20, threads=4, seed=531001 (two
      invocations, identical command line): ALL fields identical including every e histogram and
      per-hit record, timing fields excepted. Full-exposure determinism at the anchor seat is
      additionally implied by Gate-0 receipt identity.
    digest_commit_discipline: >-
      All tables, position sets, test definitions, thresholds, allowed-diff lists, and seat
      tuples committed as a write-once preregistration file (mtime BEFORE the first arm); the
      table-freeze digests re-verified post-arm; deviations go in procedure_deviations, never
      absorbed (V-804-2; BATCH-fe0bdc precedent).

  predictions:
    - id: PR-1
      metric: >-
        Stage 0 carrier test at the t=1 AES seat (r=5, 2^30, seed 531001, anchor stream): wt(e)
        byte-weight split, hit vs miss, exact one-sided exchangeability test
      direction: different
      minimum_effect: >-
        A determinate outcome under the preregistered rule: p_small <= 0.05 (carrier-alive at
        t=1), or p_small > 0.05 (null), or p_large <= 0.05 (anti-carrier). All 14 per-hit weights
        reported whatever the outcome. Prior, disclosed: P(carrier-alive at t=1) ~ 0.45 - the
        coupling is the reading most consistent with the skeleton-riding family, but n ~ 14 hits
        gives limited power, so P(test rejects | coupling real) is materially below 1; the prior
        on the EFFECT being real is ~ 0.55.
    - id: PR-2
      metric: >-
        Stage 0 known-dead reference: r=6 AES seat under the instrumented worker (2^30, seed
        531001, threads 4)
      direction: null_direction
      minimum_effect: >-
        hits <= 8 (carried dead band; committed comparator: AES dead at r=6, pooled 1.72x bound;
        expectation ~1-2 hits at 2^30). The MISS wt(e) distribution at the death round is logged
        as the no-excess reference (report-only observation: how e's mass moves between r=5 and
        r=6). Tripwire: hits >= 9 is a boundary falsifier of the sealed verdict (F6) - halt and
        escalate.
    - id: PR-3
      metric: >-
        Stage 1a: carrier replication at second seed (531002, ~19 hits expected) plus interior
        ramp points k in {1,2,4} at 2^30, plus the k=0 identity re-seat under the instrumented
        worker
      direction: different
      minimum_effect: >-
        Second-seed carrier direction matching PR-1 (or the preregistered weakening branch);
        per-point (hit count, Garwood CI vs analytic null 1.0, carrier test with Holm correction,
        per-hit detail); identity re-seat reads hits = 2^30, T = 0, W = 3 on 100% of nontrivial,
        whist [0,0,0,2^30,0], wt(e) identically 0 on all trials (BLOCKING ramp anchor - failure
        is F3).
    - id: PR-4
      metric: >-
        Stage 1b: ramp completion k in {8,12} plus in-block k=16 re-seat (ramp stream) plus the
        pre-specified k=1 second-seed arm (531002) plus the amask=15 structure-destroyed
        known-false seat
      direction: different
      minimum_effect: >-
        A complete preregistered table over all 7 family points (per point: hit count, excess,
        Garwood CI, wt(e) split, carrier test where testable, per-hit detail). Shape binned
        STEP/GRADUAL/OTHER by the preregistered rule. amask=15 seat reads ~null (committed 1.00x
        at 2^32 scaling to ~1 hit at 2^30; [0,5] band) and its carrier test must not reject
        toward small-e (known-false control for the statistic itself; power at n ~ 1 disclosed).
        Priors, disclosed: P(STEP) ~ 0.50, P(GRADUAL) ~ 0.30, P(OTHER) ~ 0.20 (carried from
        bcb117 PR-2, unchanged by the sealed verdict).

  minimal_test: >-
    CHEAPEST DISCRIMINATING SUBSET (one producer slot): Stage 0 alone - KAT pins, table freeze,
    the Gate-0/J5 arm at seed 531001 (one 2^30 run that is simultaneously the anchor reproduction,
    the perturbation check, and the first carrier measurement), the r=6 known-dead reference, the
    determinism double, the digest re-verification. Decides: carrier-alive vs carrier-dead vs
    anti-carrier at t=1 (with the disclosed n~14 power limit), the instrument's validity, and the
    death-round e reference. Stage 1 is dispatched only under the preregistered decision rule.

  stages_and_budget:
    stage_0:
      batch_shape: one producer, 7 runs, wall clock ~1.5-2 h under the handoff baseline
      runs:
        - {id: R1, content: 'pin mode KAT (AES table)', cost: 'seconds'}
        - {id: R2, content: 'pinidentity mode (identity table)', cost: 'seconds'}
        - {id: R3, content: 'table freeze - per-point table digests, bijection and nestedness checks, write-once digest commit', cost: 'seconds'}
        - {id: R4, content: 'GATE-0 / J5-1 - instrumented worker, logging ON, (aes, r5, amask=1, smask=1, 2^30, seed 531001, armid 1, threads 2); must reproduce L1-AES-R5-P30 field-by-field; yields the seed-531001 carrier measurement', cost: '~54 min (2-thread baseline estimate)'}
        - {id: R5, content: 'known-dead reference - (aes, r6, amask=1, smask=1, 2^30, seed 531001, armid 1, threads 4); dead band <= 8 hits, tripwire >= 9; miss wt(e) at the death round', cost: '~27 min'}
        - {id: R6, content: 'determinism double - identical command line twice at log2N=20 threads=4 seed 531001; byte-identical receipts including all e fields', cost: 'seconds-minutes'}
        - {id: R7, content: 'post-arm digest re-verification of the table freeze file', cost: 'seconds'}
      decides: >-
        Instrument validity (Gate 0, pins, determinism, source-diff, digest discipline); the
        carrier question at t=1 on the anchor seed (EV-AES-ec53f1 confound 4 / bcb117 first ramp
        point / DEC-20260901-079719 RANK 1, discharged as a measurement); the death-round e
        reference. Does NOT decide the ramp shape or the second-seed carrier direction.
    stage_1a:
      batch_shape: one producer, 5 runs, wall clock ~2-2.5 h (Coordinator may split at a run boundary into two batches without changing any decision content)
      runs:
        - {id: R1, content: 'J5-2 - (aes, r5, 1, 1, 2^30, seed 531002, armid 1, threads 4); carrier replication at ~19 hits; touches OBS-B16-3 seed variance for the carrier statistic', cost: '~27 min'}
        - {id: R2, content: 'k=1 - (S_1, r5, 1, 1, 2^30, seed 531001, armid 2, threads 4)', cost: '~27 min'}
        - {id: R3, content: 'k=2 - (S_2, same seat, armid 3)', cost: '~27 min'}
        - {id: R4, content: 'k=4 - (S_4, same seat, armid 4)', cost: '~27 min'}
        - {id: R5, content: 'k=0 identity re-seat - (S_0, same seat, armid 5); BLOCKING ramp anchor (hits = 2^30, W=3 100%, wt(e) = 0 all trials)', cost: '~27 min'}
      decides: >-
        Second-seed carrier direction; the first interior ramp readings (STEP-vs-GRADUAL evidence
        begins at k=1); the ramp's zero re-seated under the instrumented worker. Stream
        disjointness: armid >= 2 for ramp arms (distinct thread-seed streams, same key at seed
        531001); J5-2 at its own seed.
    stage_1b:
      batch_shape: one producer, <= 5 runs, wall clock ~2 h
      runs:
        - {id: R1, content: 'k=8 - (S_8, r5, 1, 1, 2^30, seed 531001, armid 6, threads 4)'}
        - {id: R2, content: 'k=12 - (S_12, same seat, armid 7)'}
        - {id: R3, content: 'k=16 in-block re-seat - (S_16 = AES, same seat, armid 8, threads 4); in-block endpoint on the ramp stream; expectation within the residual band, carrier test at t=1 on a second stream'}
        - {id: R4, content: 'k=1 second seed, PRE-SPECIFIED (not data-dependent) - (S_1, seed 531002, armid 9, threads 4); replication of the minimal-dose point'}
        - {id: R5, content: 'amask=15 structure-destroyed known-false seat under the AES table (r5, 2^30, seed 531001, armid 10, threads 4); band [0,5] hits; known-false control for the carrier statistic'}
      decides: >-
        The complete 7-point joint (excess, carrier) curve; the ramp shape verdict
        (STEP/GRADUAL/OTHER); the joint-decay verdict (CARRIER-CONFIRMED / SHAPE-ONLY / SPLIT);
        closure of the k=1 point under two seeds.
    budget_honesty: >-
      Full ramp = 3 producer batches (~5.5-6.5 h compute total plus implementation), never one:
      the campaign precedent is one producer, <= 8 runs, ~1-2 h wall clock, and the handoff
      baseline (~27 min per 2^30 arm at 4 threads) puts 5 same-exposure arms above a single batch
      window. Each stage has a standalone decision content (above), so a budget halt at any stage
      boundary is a partial result with a committed reading, never a stranded instrument (rule 5).
      Memory: O(1) per trial (table-driven, histograms only; per-hit detail capped at 64
      records).

  preregistered_decision_rule: >-
    Committed before any ramp arm. STAGE 0: (S0-CARRIER-ALIVE) Gate 0 passes AND p_small <= 0.05
    at seed 531001 -> Stage 1 dispatched; carrier reading alive at t=1. (S0-WEAK) Gate 0 passes,
    p_small > 0.05 but all/most hit weights descriptively below the miss median (or marginal
    0.05 < p_small <= 0.15) -> carrier reading weakened, not falsified; Stage 1 dispatched with
    the disclosure (interior points carry more power if hit counts rise). (S0-DEAD) Gate 0 passes
    and p_small > 0.15 with hit weights descriptively at or above the miss median, or p_large
    <= 0.05 -> carrier clause FALSIFIED at t=1 (F1); record the finding; the ramp-shape question
    survives only if the Coordinator re-ranks a reduced Stage 1 (design change, new decision) -
    the default is return to idea generation with e named non-carrier. (S0-GATE-FAIL) any gate
    failure -> invalid_measurement, halt, repair (rule 5); no reading. STAGE 1 SHAPE (per point,
    2^30, null 1.0): NULLBAND hits <= 5; RESIDUAL-BAND 6 <= hits <= 40 (covers the 14/19 AES
    seats and the scaled ~13-15 random-bijection level with Poisson headroom); GRADUAL-THRESHOLD
    k=1 hits >= 100 (~8 sd above the residual band). STEP = k=1 and k=2 both <= 40; GRADUAL =
    hit counts strictly decreasing in k with k=1 >= 100; OTHER = everything else (thresholds,
    non-monotone, intermediate), recorded as measured with a named successor object, never
    smoothed. STAGE 1 CARRIER: at each testable interior point (n_hits >= 5) run the exact test;
    CARRIER-CONFIRMED = >= half the testable points Holm-adjusted p_small <= 0.05 AND zero points
    Holm-adjusted p_large <= 0.05 AND the all-trial mean wt(e) non-increasing as k falls, with
    k=0 at exactly 0 -> escalate to a claim-changing review round (review_plan required; this
    would convert a named-unmeasured candidate into a measured carrier for the sealed verdict's
    heuristic H2). SHAPE-ONLY = the shape bins cleanly but no carrier separation at >= 2
    adequately-powered points (>= 50 hits each) -> carrier clause falsified along the ramp (F1),
    shape recorded as its own result, return to idea generation for what does carry the excess.
    SPLIT = carrier separation at some points, not others, or separation without joint decay ->
    recorded as a live contradiction with all arms cited; no mechanism conclusion; Coordinator
    decides successor. Any reading conflicting with a committed endpoint in-block (k=16 re-seat
    outside [6,30]; identity re-seat failing) is F3/F5-class instrument indictment, not a
    mathematical result. Budget halts are resource_exhaustion with the partial curve reported.

  test_boundary: >-
    Toy tier; r=5 for all ramp arms (one r=6 reference arm); the frozen nested position family
    S_k, k in {0,1,2,4,8,12,16}, not the space of all S-boxes; one probe cell (amask=1, smask=1);
    bijective tables only by construction (position dilution between bijections); the modified
    ciphers actually run, never AES beyond its own seat; one key per seed family (key co-varies
    with the table by pinned convention - the reading is about the cipher-with-co-varied-schedule,
    stated). The strongest licensed sentences: "within the tested nested position family, the r=5
    residual rides on small-e trials" (if CARRIER-CONFIRMED) and "all tested dilution points
    read at the residual level" (if STEP) - NEVER "any S-box" and never "e is the only carrier".
    NOTHING about full-round or deployed AES; no published-frontier comparison in either
    direction (R3).

  falsification_conditions:
    - >-
      F1 (THE MAIN CARRIER FALSIFIER - falsifies the carrier reading, not the ramp). Isotropic-
      large-e: (a) at t=1, S0-DEAD fires (both seeds, per the decision rule); or (b) along the
      ramp, SHAPE-ONLY fires - no hit-vs-miss wt(e) separation at >= 2 adequately-powered
      interior points while the excess is present. Then the r=5 residual does NOT ride on e at
      this statistic/exposure/family; the sealed verdict's carrier wording stays named-unmeasured
      and its H2 is refuted within the tested scope. This is a complete result and the record's
      most valuable negative (it is exactly the isotropic-large-e boundary falsifier on
      EV-AES-ec53f1's list).
    - >-
      F2 (WEAKENS the carrier reading, does not falsify it). Single-seed significance that fails
      to reproduce at the second seed; carrier separation at t=1 only, absent at adequately-
      powered interior points; non-monotone carrier signature along the ramp. Recorded as
      measured with the weakening located; successor named (larger exposure or richer statistic);
      the reading is reported as "carrier coupling at t=1 only, unreplicated/unconfirmed".
    - >-
      F3 (BLOCKING - ramp anchor). The k=0 identity re-seat under the instrumented worker fails
      (hits != 2^30, or any nontrivial trial with W != 3, or any trial with wt(e) != 0). The
      ramp's zero is void; every interior reading confounded; invalid_measurement; repair before
      any reading. Cross-field: also indicts the instrumented worker's identity path against the
      committed affine anchor.
    - >-
      F4 (BLOCKING - gate/instrument). Gate 0 fails: any field outside the allowed-diff list
      differs from L1-AES-R5-P30, or any of the 14 hit indices disagrees, or the source-diff
      audit finds a changed trial-stream/counter line. Then the instrumented worker is NOT the
      committed instrument; void; halt and repair (rule 5) - a stream-port or receipt-emission
      fault, never evidence about e. Repair route is named: fix the port, or return to idea
      generation for a campaign-build-based instrument as a NEW proposal (lineage change = new
      frozen spec, not an in-task fallback).
    - >-
      F5 (BLOCKING - ramp incoherence). The k=16 in-block re-seat reads outside [6,30] hits, or
      any interior point contradicts a committed endpoint in-block. Indicts THIS record's
      instrument, not the committed measurements (endpoints validated by other batches); void;
      repair.
    - >-
      F6 (ESCALATION TRIPWIRE, not a defect). The r=6 known-dead reference reads >= 9 hits: a
      boundary falsifier of the sealed verdict (future committed r=6 excess). Halt the ramp;
      record; escalate to a claim-changing review (review-breakthrough at max per rule 12 - a
      contradiction of established evidence). The ramp's own claims are suspended pending review.
    - >-
      NOT A FALSIFICATION - budget halts (rule 5); underpowered points with n_hits < 5 (recorded,
      never tested); a non-monotone ramp shape recorded as measured under OTHER; timeouts/crashes
      (rule 5).

  controls:
    - >-
      ANCHOR GATE - Gate-0 field-exact reproduction of L1-AES-R5-P30 (14 hits, identical indices)
      by the logging-ENABLED build before any ramp arm: simultaneously the stream-identity check,
      the instrument identity check, and the logging-perturbation check.
    - >-
      KNOWN-DEAD OBJECT IN-BLOCK - the r=6 AES seat (committed dead; band <= 8; tripwire >= 9):
      the ramp must not show excess where the campaign has sealed death, and its miss wt(e)
      distribution is the no-excess reference.
    - >-
      KNOWN-ALIVE / ZERO-DOSE BLOCKING PAIR - the k=0 identity re-seat (probability 1 per trial,
      wt(e) = 0 identically) in the same instrument as the interior points: an instrument that
      cannot reproduce its own zero measures nothing (bcb117's D4/D5 blocking logic, rebased on
      the identity limit).
    - >-
      KNOWN-FALSE CONTROL FOR THE STATISTIC - the amask=15 structure-destroyed seat (Stage 1b):
      the carrier test must not fire toward small-e where there is no excess (proves-too-much
      control applied to the statistic rather than the argument; power at n ~ 1 disclosed).
    - >-
      NULL FOR THE CARRIER TEST - the internal exchangeability null with the run's own miss-only
      reference distribution: no external seat needed for the statistic's null; the hit labels
      under H0 are a uniform random subset of the trials.
    - >-
      SEED-VARIANCE CONTROL - the second-seed J5 arm (531002) and the pre-specified k=1
      second-seed arm: carrier readings are reported per seed, never pooled (the OBS-B16-3
      warning, BATCH-009 pooled-statistic withdrawal discipline).
    - >-
      PRE-REGISTRATION AS COMMITTED DIGEST - all tables, position sets, bins, thresholds,
      allowed-diff lists, seat tuples, and the test itself committed before the first arm
      (V-804-2), re-verified post-arm.

  confounders:
    - >-
      KEY-SCHEDULE CO-VARIATION - by pinned convention the key schedule's SubWord uses the
      current table, so a ramp point changes the schedule AND the round function together. This
      is the convention under which BOTH committed endpoints were measured (the gate checks both),
      so the ramp's reading is about the co-varied cipher, stated rather than separated. A
      fixed-AES-schedule variant of the family is a named successor control if any interior
      reading is contested - not silently absorbed, not run here.
    - >-
      SMALL HIT SAMPLE AT t=1 - n ~ 14 (seed 531001) / ~19 (531002) limits the carrier test's
      power at the full-AES seat: a real but weak coupling may not reach significance (the
      S0-WEAK branch exists exactly for this). Interior points under GRADUAL have far more hits
      and dominate the ramp-wide carrier decision; under STEP they do not, and the power limit
      is disclosed point by point, never smoothed.
    - >-
      POSITION-FAMILY SPECIFICITY - one frozen nested family; the dose label k does not isolate
      WHICH positions matter (bcb117's GRADUAL branch named sensitive positions; this record's
      stratified order deliberately does not pursue that coordinate - named successor, the
      family is a ramp, not an autopsy).
    - >-
      e-DEFINITION CONVENTION - e is the pair-XOR deviation of the sealed verdict; the one-sided
      perturbation q0^p0 = M_r^-1 Z_keep M_r d (IDEA-20260901-04606c route (ii)) is a different
      live linear candidate NOT measured here. A carrier-dead verdict for e leaves that candidate
      open, stated.
    - >-
      THREAD-COUNT PINNING AT THE ANCHOR - Gate 0 and the seed-531001 J5 reading run at 2 threads
      to match the L1 receipt's chunking; ramp arms run at 4 threads on their own streams (armid
      >= 2), so no cross-arm index comparison is claimed and the thread-count difference is a
      stream change, disclosed, not a confound of any within-arm statistic.
    - >-
      SHARED-HARNESS BUGS CONDITIONAL ON THE TABLE PATH - all ramp arms share the derivative's
      table-driven path; the gate + KAT pins + source-diff audit are the in-record mitigation;
      the cross-lineage battery (IDEA-20260901-02f7c4 B3) remains the programme-level mitigation,
      not discharged here (carried from bcb117, unchanged).

  interpretation_limits:
    - >-
      claim_tier toy. The carrier statement, if won, licenses "within the tested nested position
      family at the pinned probe cell, the r=5 residual rides on small-e trials" - never "any
      S-box", never "e is the only carrier", never anything about full-round or deployed AES.
    - >-
      A CARRIER-CONFIRMED reading does NOT explain the residual's MAGNITUDE (~14-19 vs null 1.0
      at 2^30): it localizes WHERE the excess lives (small-e trials), not WHY that many; the
      magnitude question passes to the geometric-null derivation of IDEA-20260808-bfee7e if ever
      executed, stated as in bcb117.
    - >-
      The ramp measures the co-varied-schedule cipher (pinned convention); schedule-separated
      statements are out of scope.
    - >-
      No published-frontier comparison in either direction (R3); recalled references (S-box
      perturbation practice; Garwood/exact-test method names carried from prior records) are
      pointers, never support.
    - >-
      Timeouts, crashes and infrastructure failures are never negative mathematical evidence
      (rule 5).

  heuristic_assumptions:
    - id: H1
      statement: >-
        CARRIER CONCENTRATION AT t=1. Under the full AES table at r=5, the residual excess
        concentrates on trials whose deviation vector e = (q0^q1)^(p0^p1) has small byte weight:
        the hit weights sit in the low tail of the run's miss-trial weight distribution
        (p_small <= 0.05 under the preregistered exact test).
      rigorous_support: >-
        RIGOROUS PART - e is identically zero in the affine limit (IDEA-20260901-04606c P1,
        gate/bridge/arm-verified by EV-AES-ec53f1 and EV-AES-b2910a), so e is a well-defined
        interpolation parameter and wt(e) a well-defined statistic; the exchangeability test is
        exact under its stated null. WHAT IS HEURISTIC is the concentration itself: nothing
        committed measures e under a nonlinear S-box (EV-AES-ec53f1 OBS-FE0-4; EV-AES-b2910a
        confound 3). DISTRIBUTION IMITATED - none named; the ramp IS the validation, and the
        assumption is stated so a carrier-alive outcome is recognized as the assumption winning,
        not a neutral outcome.
      validation_plan: >-
        Stage 0 (J5 arm, seed 531001) plus Stage 1a (seed 531002 replication).
      falsification_condition: >-
        F1(a) S0-DEAD, or F2 weakening branches.
    - id: H2
      statement: >-
        JOINT DECAY. As the nonlinearity dose k falls along the frozen family, the excess and the
        carrier signature decay together: the all-trial mean wt(e) is non-increasing as k falls
        (reaching exactly 0 at k=0), and the hit-vs-miss separation persists at every testable
        interior point (Holm-adjusted p_small <= 0.05 at >= half of them, no large-e rejections).
      rigorous_support: >-
        RIGOROUS PART - the k=0 limit is exact (committed anchor law, re-seated in-block); the
        statistic and correction are exact under their nulls. WHAT IS HEURISTIC is the coupling
        of the two coordinates at every interior dose - no committed datum measures any interior
        point.
      validation_plan: >-
        Stage 1a/1b: the full 7-point joint curve with the preregistered per-point test.
      falsification_condition: >-
        F1(b) SHAPE-ONLY (excess without carrier), SPLIT outcomes, or F2 (separation at t=1 only).

  obstruction:
    quantity: >-
      The readability of the ramp's carrier coordinate: the hit-vs-miss wt(e) separation
      (one-sided exact-test p-value and mean separation) and the hit count, per ramp point, at
      fixed 2^30 exposure.
    measured_value: >-
      NOTHING MEASURED YET - this block pre-names what would make the ramp unreadable, with the
      two committed input points: at k=0 the separation is undefined (all trials hit, wt(e) = 0
      everywhere - degenerate by construction, disclosed); at k=16 the hit sample is 14/19 hits
      at 2^30 (L1-AES-R5-P30; EV-AES-5478a0 OBS-B16-3), giving the carrier test limited power
      (~0.45 prior of reaching significance even if the coupling is real). Interior points are
      unmeasured; under STEP they would carry ~residual-band hit counts and the power limit
      extends to the whole ramp. Units: p-values and hit counts at frozen exposure; error bars:
      exact test at n <= 2000, Poisson/Garwood on hit counts.
    runs_read_from: >-
      L1-AES-R5-P30.json (BATCH-015 TASK-20260805-d408ac), EV-AES-5478a0 OBS-B16-3,
      EV-AES-048545 O-7 (k=0 endpoint), EV-AES-b2910a OBS-999-1 (dead-band scale reference).
    scope_claimed: >-
      Toy tier, one probe cell, r=5, the frozen nested position family, 2^30 per point.
    unreadability_conditions:
      - >-
        wt(e) concentrated at one value across all trials at an interior point (degenerate
        distribution - the separation test is undefined and the carrier coordinate is silent at
        that dose).
      - >-
        Logging perturbation (the e pass moves any trial-map field) - detected by Gate-0 receipt
        identity; voids the arm, never a reading.
      - >-
        STEP at all interior points - hit counts ~residual band everywhere, carrier test
        underpowered at every point simultaneously; the ramp reads the shape but cannot read the
        carrier.
    resource_check:
      examined: true
      reading: >-
        Each unreadability is another record's asset. (i) wt(e) concentrated at one value would
        say the deviation WEIGHT is determined by the dose k rather than by the trial - a
        deterministic carrier signature pointing at the one-sided linear statistic
        (IDEA-20260901-04606c route (ii)) as the quantity that varies per trial; the obstruction
        is its hypothesis. (ii) The perturbation risk is converted by the toggle discipline into
        a binary gate (C4 precedent), so it costs one comparison, not an ongoing confound. (iii)
        STEP-with-underpowered-carrier is exactly the regime where a 2^32 escalation or a
        higher-hit-rate probe cell (other amask seats) is the named successor; and under STEP the
        shape itself is still bcb117's class-fragility result, so no stage of the ramp is
        compute-wasted. All three readings named in advance.

  target_complexity:
    time_exponent: >-
      No attack, no exponent. Three producer batches at demonstrated rates: Stage 0 ~1.5-2 h,
      Stage 1a ~2-2.5 h, Stage 1b ~2 h (handoff baseline ~27 min per 2^30 arm at 4 threads;
      ~54 min for the 2-thread Gate-0 arm).
    memory_exponent: >-
      O(1) per trial (table-driven direct evaluation; fixed 17/129-bin histograms; per-hit detail
      capped at 64 records).
    best_known: >-
      The committed endpoints are the baseline (k=0 probability 1; k=16 AES 14/19 hits at 2^30;
      null 1.0; death at r=6). No improvement claimed on any cost axis.
    hidden_overhead: >-
      Disclosed: implementation is ~200-300 lines of diff on affarm046.c (table surface, e-logging
      block, receipt fields) with round functions untouched; the exact-test DP is O(17^2 * n) for
      n <= 2000, seconds. The handoff cost baseline hides the machine difference vs BATCH-015's
      ~89-102 s per 2^30 arm - flagged optimistic-relative, binding as handed off.
    tradeoff_note: >-
      Evidential tradeoff stated: Stage 0 alone answers carrier-at-t=1 with limited power; the
      ramp-wide carrier decision needs Stage 1's interior points; the shape decision needs all
      three stages. No time-memory tradeoff in content.

  dominated_by: >-
    CHECKED ROW BY ROW across time, memory and data/queries. ROW 1 - IDEA-20260901-bcb117 (parent):
    filed the ramp without the carrier statistic, without the Gate-0 anchor standard, and
    unbudgeted for the <= 8-run precedent (four producer slots); never ran; this record consumes
    its verdict and succeeds its stage design - a succession, not a domination. ROW 2 - the J5
    control (TASK-20260901-31bac8 red team): a named cheapest control, never executed; Stage 0
    IS its specified form - execution of a named control is not domination by it. ROW 3 -
    EV-AES-64750e OBS-B803-1 (identity-law localization, 6 cells x 500-1000 keyed AFFINE trials):
    measured the law holding at zero cipher scale, no e under nonlinearity, no hit/miss
    conditioning, no ramp; strictly cheaper but answers a different question; does not dominate.
    ROW 4 - EV-AES-048545 O-3/O-7 and BATCH-713991 (whole-S-box endpoints): reused as ramp
    endpoints, no interpolation, no e logging. ROW 5 - IDEA-20260807-bbefda (active-byte k at
    fixed S-box): orthogonal coordinate, no domination either way (carried from bcb117). ROW 6 -
