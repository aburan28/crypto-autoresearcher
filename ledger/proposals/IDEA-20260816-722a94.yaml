idea:
  id: IDEA-20260816-722a94
  question_id: RQ-WFS-e776b6
  added: '2026-08-16'
  title: 'Calibrate the soundness-accounting instrument on protocols whose exact soundness is known
    in advance: a protocol with soundness identically one, one with soundness identically zero, and
    a family with hand-computable soundness, and report the instrument''s recovered value against
    the known value before any unknown protocol is measured.'
  class: control
  claim: '(A) A KNOWN-ANSWER LADDER EXISTS AND IS SHORT. There is a small family of public-coin protocols
    whose exact soundness error is known by construction and not by measurement: (1) the always-accept
    verifier, soundness exactly 1; (2) the always-reject verifier, soundness exactly 0; (3) the k-out-of-n
    cut-and-choose with a single corrupted position, soundness exactly (n minus k) over n by counting;
    (4) the biased-coin verifier accepting with declared probability b independent of the transcript,
    soundness exactly b; (5) tau-fold independent repetition of (3), soundness exactly the tau-th
    power by construction. Part (A) claims these five, evaluated at a grid of parameters, are sufficient
    to exercise every arithmetic path of a soundness-measuring pipeline: the boundaries, the counting
    core, and the composition step. (B) THE INSTRUMENT''S ERROR IS ITSELF A MEASURABLE QUANTITY WITH
    A DIRECTION. Part (B) claims that the deviation between the pipeline''s recovered soundness and
    the known value, computed exactly in rational arithmetic, is either identically zero at every
    rung, which is the passing outcome, or is nonzero at a rung that IDENTIFIES which arithmetic path
    is wrong: a failure at rung 1 or 2 is a boundary bug, at rung 3 a counting bug, at rung 5 a composition
    bug. The ladder is diagnostic and not merely pass/fail. (C) THE CALIBRATION IS A PREREQUISITE,
    NOT A RESULT. Part (C) claims that no soundness number produced by an uncalibrated pipeline in
    this program is admissible evidence, and that this record''s deliverable is the reusable calibration
    fixture that every other soundness measurement in the bucket must pass before its own numbers
    are read. This is paradigm-level by construction: the ladder contains no relation, no field structure
    and no scheme. (D) WHAT IS NOT CLAIMED. No forgery, no break, no speedup, no security consequence,
    and no claim about any real protocol''s soundness, since the ladder deliberately contains only
    protocols too trivial to be anyone''s scheme. It is NOT claimed that passing the ladder makes
    a pipeline correct on non-trivial protocols; passing establishes only that the exercised arithmetic
    paths return known answers, and the record states that limit rather than overselling it. It is
    also NOT claimed that this replaces a null object: a null object controls the SIGNAL, a known-answer
    ladder controls the INSTRUMENT, and both are required.'
  mechanism: 'STAGE 1 writes the five rungs as protocol objects behind a common interface, each carrying
    its exact soundness as a Fraction declared IN THE PROTOCOL DEFINITION rather than computed by
    the pipeline. STAGE 2 pushes each rung through the same measuring pipeline used by every other
    soundness record in this bucket, with no special-casing: the pipeline sees an interface, not a
    rung identity, and this is enforced by having the pipeline receive protocols in a shuffled order
    with opaque labels. STAGE 3 compares recovered against declared, exactly, and records the signed
    deviation per rung. STAGE 4 runs the diagnostic mapping: a deviation at a given rung is reported
    with the arithmetic path it implicates, and the report names the path rather than only flagging
    the rung. STAGE 5 runs the adversarial calibration: three DELIBERATELY BROKEN pipelines, one with
    an off-by-one in the challenge count, one that drops the composition exponent, one that measures
    acceptance on true statements instead of false ones. Each must be caught by the ladder, and the
    rung that catches it must be the rung the diagnostic mapping predicts. A ladder that passes a
    broken pipeline has no power, and this stage is what distinguishes a calibration from a ceremony.
    STAGE 6 emits the fixture: the rung definitions, the declared values, the diagnostic map, and
    the three broken pipelines as regression tests, so any later record in the bucket can import it
    and record a pass in its own run manifest. The refutation is direct: if any broken pipeline slips
    through all five rungs, the ladder is incomplete and the missing rung is the deliverable.'
  novelty_status: unverified
  novelty_screen:
    method: 'grep -rli in ledger/proposals for: soundness error, calibration, known answer, instrument,
      control, MPCitH, Fiat-Shamir. Read titles and class of IDEA-20260801-005, IDEA-20260808-721f2b,
      IDEA-20260805-7abf04, IDEA-20260813-6819af, IDEA-20260805-7d97be. Read RQ-WFS-e776b6 in full,
      including its decidable-criterion and certificate-enumeration targets. Checked the anti-duplication
      list for the instrument-validity items under RQ-INSTR-f8faa0.'
    results: The blacklist records 15-plus proposals under RQ-INSTR-f8faa0 auditing this program's
      own cost model, machine variance and single-machine timing; this record is NOT that, because
      it audits a soundness-counting pipeline's arithmetic against known-answer protocols and never
      touches timing, machine variance or cost models. IDEA-20260805-7d97be is the closest in spirit,
      using MQOM as a null object so that any device firing on it has proved it is not using the structure
      it claims, which is a null-object discipline rather than a known-answer ladder. IDEA-20260813-6819af
      isolates game hops and searches for a matching adversary or slack witness, a proof-side audit.
      No record was found defining a known-answer protocol ladder with declared exact soundness values,
      and none ships deliberately broken pipelines as regression tests.
    verdict: 'UNVERIFIED. Nothing is asserted about published literature; known-answer testing is
      a standard engineering practice and is certainly not new in general. Assembled from known parts:
      known-answer tests, mutation testing and null controls are all established. Claimed new relative
      to THIS repository only: a soundness-specific ladder whose rungs are chosen to exercise named
      arithmetic paths, the diagnostic mapping from failing rung to implicated path, and shipping
      three deliberately broken pipelines so that the ladder''s own detection power is demonstrated
      rather than assumed.'
  object_first_candidate:
    tracked_object: The signed deviation vector delta = (recovered minus declared) across the five
      rungs, followed as the pipeline under test is varied from correct to each of the three deliberately
      broken variants.
    lossiness: 'Genuinely lossy. The deviation vector discards the protocols entirely, the transcripts,
      the challenge spaces and the pipeline''s internal structure, retaining five rational numbers.
      It propagates because a pipeline''s arithmetic-path correctness is precisely what those five
      numbers are sensitive to by the ladder''s construction, and the diagnostic mapping is exactly
      the claim that the retained five-vector determines which path failed. The compatibility condition
      is checked rather than assumed: STAGE 5 verifies that each broken pipeline produces the deviation
      SIGNATURE the mapping predicts, and a mismatch there means the projection is losing something
      it should not.'
    propagation: One step of the target operation is applying the pipeline to the next rung. Under
      it the deviation vector gains a coordinate whose value is zero for a correct pipeline and, for
      a broken one, is a function of which arithmetic path that rung exercises. So the vector accumulates
      a signature, and the whole design is the claim that the signature is injective enough on the
      three declared break modes to name them.
    survival_score: The signature's discriminating power survives across exactly the break modes the
      rungs exercise. The run reports how many of the three declared break modes are distinguished
      from one another by the deviation signature, out of three, and how many are merely detected
      without being distinguished. That two-number report is the survival score, and if the ladder
      detects all three but distinguishes none, the diagnostic claim in part (B) fails while the detection
      claim survives, which is a partial and honest outcome.
  null_object_control: 'The null object is a pipeline that is correct by construction: a trivial reference
    implementation that reads each protocol''s declared soundness and returns it. It must produce
    a deviation vector that is identically zero across all five rungs, in the same invocation as the
    pipeline under test. If it does not, the comparison harness itself is faulty and no deviation
    from the real pipeline is interpretable. The complementary requirement is that the three deliberately
    broken pipelines must NOT produce a zero vector: a ladder on which everything passes has no power,
    and the pair of requirements together is what makes a zero deviation from the real pipeline informative.'
  discriminated_from:
  - 'The RQ-INSTR-f8faa0 instrument audits named in the anti-duplication list: those concern cost
    models, machine variance and single-machine timing. This record measures no time at all and its
    object is arithmetic correctness of a counting pipeline against declared exact values.'
  - 'IDEA-20260805-7d97be, MQOM as null object: a null-object discipline applied to structured-versus-unstructured
    hard problems. A null object controls the signal arm; a known-answer ladder controls the instrument,
    and this record argues both are required rather than substituting one for the other.'
  - 'IDEA-20260813-6819af, reduction-loss saturation ledger: isolates proof game hops and hunts for
    matching adversaries. That audits a proof; this audits a measurement program.'
  - A conventional unit-test suite for the measuring code. A unit test asserts internal behaviour
    chosen by the author; the ladder asserts end-to-end recovery of soundness values that are known
    by construction from outside the pipeline, and it ships mutants to prove the assertions can fail.
  - 'The transcript-enumeration soundness measurement elsewhere in this bucket: that measures an unknown
    quantity on a non-trivial shell. This measures a known quantity on trivial protocols, and its
    output is a gate the other must pass.'
  assumptions:
  - The five rungs' soundness values are genuinely known by construction and not by any computation
    the pipeline shares. Enforced by declaring each value as a literal Fraction in the protocol definition,
    derived by hand and recorded with its derivation in the fixture.
  - A common protocol interface exists that both the ladder rungs and real shells can implement without
    the pipeline special-casing either. If it does not, the calibration is not transferable and the
    record says so.
  - The three declared break modes are representative enough that detecting them is meaningful. They
    are not claimed to be exhaustive, and the record explicitly invites more mutants rather than treating
    three as sufficient.
  - Exact rational arithmetic throughout; a floating-point comparison would make a zero deviation
    unfalsifiable.
  - Shuffling the rung order with opaque labels actually prevents special-casing. Enforced by construction
    and verified by checking the pipeline's code has no branch on protocol identity.
  predictions:
  - metric: deviation vector of the reference (correct-by-construction) pipeline across all five rungs
    direction: lower
    minimum_effect: 0
  - metric: number of the three deliberately broken pipelines DETECTED by at least one rung
    direction: higher
    minimum_effect: 3
  - metric: number of the three broken pipelines DISTINGUISHED from one another by their deviation
      signature
    direction: higher
    minimum_effect: 2
  - metric: deviation of the real pipeline under test at rung 5 (composition)
    direction: lower
    minimum_effect: 0
  minimal_test:
    design: 'Implement the five rungs behind one interface, each with a hand-derived exact soundness
      declared as a literal Fraction. Implement the reference pipeline (returns the declared value)
      and the pipeline under test (measures by enumeration). Implement three mutants: challenge-count
      off by one, dropped composition exponent, and acceptance measured on true rather than false
      statements. Run all five pipelines against all five rungs, at three parameter settings each,
      with rung order shuffled and labels opaque. Emit the 5-by-5 deviation matrix in exact rationals.
      Require the reference row to be all zeros, require each mutant row to be nonzero somewhere,
      and check whether the three mutant rows are pairwise distinct. This is seconds of compute, needs
      no cryptography, and produces both a gate and a demonstrated detection power in one artifact
      that every other soundness record in this bucket can import.'
    controls:
    - The reference correct-by-construction pipeline, which must yield an all-zero deviation vector.
    - Three deliberately broken pipelines, each of which must be detected, with the implicated rung
      checked against the diagnostic map.
    - Shuffled rung order with opaque labels, so no pipeline can branch on rung identity.
    - A no-op mutant identical to the pipeline under test, which must produce the same deviation vector,
      guarding against nondeterminism in the harness.
    - Three parameter settings per rung, so a rung passing at one parameter cannot masquerade as passing
      everywhere.
    required_metrics:
    - exact deviation per (pipeline, rung, parameter setting) as a rational
    - count of break modes detected
    - count of break modes pairwise distinguished by deviation signature
    - implicated arithmetic path per failing rung, against the diagnostic map's prediction
    - reference-pipeline deviation, which must be exactly zero
    - no-op mutant agreement with the pipeline under test
  falsification_conditions:
  - The reference pipeline yields a nonzero deviation anywhere, voiding the comparison harness.
  - Any of the three broken pipelines passes all five rungs, showing the ladder has a blind spot and
    identifying the missing rung as the deliverable.
  - The three broken pipelines produce identical deviation signatures, falsifying the diagnostic claim
    in part (B) while leaving detection intact.
  - The no-op mutant disagrees with the pipeline under test, indicating harness nondeterminism.
  - A rung's hand-derived soundness value cannot be independently re-derived by a second author, meaning
    the known answer is not actually known.
  confounders:
  - A ladder written by the same author as the pipeline under test, so both share a misconception.
    Mitigated by requiring the rung values to be hand-derived and independently re-derived, and by
    the mutants, which do not depend on the author's beliefs.
  - Mutants chosen to be exactly what the ladder catches, inflating apparent power. Mitigated by declaring
    the mutants BEFORE the rungs are finalized and recording the order in the fixture.
  - Trivial rungs exercising code paths that non-trivial protocols never reach, so a pass transfers
    less than it appears to. Stated as an interpretation limit rather than mitigated, since it is
    intrinsic.
  - Parameter settings all sitting in one regime, so a regime-dependent bug survives. Mitigated by
    three settings per rung spanning the available range.
  interpretation_limits:
  - Passing the ladder establishes only that the exercised arithmetic paths return known answers on
    trivial protocols. It does not establish correctness on any non-trivial shell.
  - The detection power reported is relative to three declared break modes and is not a general correctness
    guarantee.
  - The ladder contains no relation, field or scheme, so it says nothing about SDitH, FAEST, MQOM
    or any real protocol, by design.
  - A zero deviation is meaningful only because the mutants are nonzero; reporting the zero without
    the mutant rows would be uninformative and the fixture forbids it.
  target_complexity:
    time_exponent: No attack exponent is claimed. The ladder runs in seconds; cost is O(pipelines
      times rungs times settings).
    memory_exponent: No attack exponent is claimed. Memory is a 5-by-5 matrix of rationals.
    best_known: The incumbent is the current practice in this bucket of reporting soundness numbers
      from pipelines whose arithmetic has not been calibrated against any known answer, as in IDEA-20260808-721f2b
      and IDEA-20260801-005, neither of which ships a calibration fixture.
    hidden_overhead: 'Hidden in the human cost is the requirement that each rung''s value be independently
      re-derived, which doubles the authoring effort and is the step most likely to be skipped. Hidden
      in the lower-order terms is the interface: forcing real shells to implement the same interface
      as trivial rungs may distort the shells, and that distortion is not measured here.'
  dominated_by: n/a (no result claimed). Every frontier axis was checked; this record places no point
    on time, memory or queries because it evaluates no cryptography and attacks nothing.
  sota_delta: no attack; conceptual/measurement contribution only
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Part (A), that five rungs suffice to exercise the boundary, counting
    and composition paths: 0.7, with the risk that a fourth path (challenge-space construction) needs
    its own rung. Part (B), that the deviation signature distinguishes at least two of the three break
    modes: 0.6, since the dropped-exponent and off-by-one mutants may collide at some parameter settings.
    Part (C), that other records in the bucket actually adopt the fixture as a gate: 0.45, a process
    question rather than a technical one, and the honest risk is that a calibration nobody imports
    is a fixture nobody runs. Part (D) is scoping and carries no probability.'
