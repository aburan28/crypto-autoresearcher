idea:
  id: IDEA-20260816-9b2260
  question_id: RQ-AEADC-8db132
  added: '2026-08-16'
  title: 'The bound is stated per key and the deployment holds millions of them: measure the multi-key
    advantage of an AEAD mode directly at toy key widths and compare it against the naive union accounting,
    so the gap between u times the per-key bound and the measured multi-key quantity becomes a number
    rather than a folklore worry'
  class: measurement
  claim: '(A) Security accounting for an AEAD mode is normally written per key, and a deployment with
    u keys is reasoned about by multiplying. Whether that multiplication is the right accounting is
    a measurable question if the key space is small enough to enumerate the relevant collisions, and
    it has two competing shapes: an advantage that grows linearly in u, which the union accounting
    predicts, and one that grows with a different exponent because the adversary can attack all u
    keys with one query batch. (B) The deliverable is a measured growth exponent: fit the empirical
    multi-key distinguishing or key-hit advantage against u over a sweep of key widths, and report
    the exponent with its confidence interval alongside the union prediction at the same parameters.
    The claim is that the exponent is measurable at toy key widths and that its value, whatever it
    is, is a mode-level number and not a primitive-level one. (C) The instrument covers two mode-level
    regimes that the union accounting treats identically: independent random keys, and keys drawn
    with a declared structural relationship such as a shared derivation salt, which is the accounting
    surface where per-key statements are most often reused without checking. (D) NOT CLAIMED: no attack
    on any AEAD or key-management scheme; no statement about any deployment''s key count; no claim
    that the toy key widths predict full-size behaviour, since a growth exponent fitted over key widths
    from 8 to 20 bits is a fit at those widths and its extension is a labelled projection at best;
    no security consequence; and no assertion about what any published bound says, since this program
    cannot read external literature and the union prediction used here is recomputed internally from
    a stated model rather than quoted. A negative outcome -- an exponent statistically indistinguishable
    from the union prediction across the whole sweep -- is the more likely and entirely usable result:
    it would put a measured floor under the folklore worry and tell later work exactly which regimes
    were checked and found unremarkable.'
  mechanism: 'STAGE 1: state the union accounting explicitly as an internal model. For u keys and
    a per-key advantage function a(q) at query budget q, the union prediction is u times a(q/u) for
    a budget split evenly and u times a(q) for a budget replicated; both are computed rather than
    quoted, and both are recorded before any run. STAGE 2: implement the AEAD mode at configurable
    key width with the primitive slot filled by a seeded ideal permutation, so key-width sweeps are
    exact and cheap. STAGE 3: define the multi-key game: the adversary sees ciphertexts under u independent
    keys and must produce a hit on any one of them under a frozen strategy, with a fixed total query
    budget across the whole population. STAGE 4: sweep u across at least a decade and key width across
    the tested range, and fit log advantage against log u to obtain the exponent with its interval.
    STAGE 5: repeat the whole sweep in the structured-key regime, where the u keys are derived from
    one salt with a declared relation. STAGE 6: run the null arm, in which the adversary''s queries
    are answered by u independent random functions of the same interface, so no mode structure links
    the populations. Refutation: an exponent matching the union prediction in both regimes, or a null
    arm showing the same exponent, which would mean the fit is reading the population size and not
    the mode.'
  novelty_status: unverified
  novelty_screen:
    method: 'Grepped ledger/proposals/ and knowledge/ case-insensitively for: multi-user, multi user,
      multi-key, multikey. Grepped ledger/proposals/, ledger/hypotheses/ and knowledge/ for aead,
      nonce-misuse, key commitment, partitioning oracle. Read RQ-AEADC-8db132 and RQ-POLYMAC-7c89e4
      in full. Read the title, class and claim head of every proposal under RQ-AEADC-8db132. Read
      docs/inventor-protocol.md sections 1-5 and 8.'
    results: 'The multi-key grep returned a mixed set spanning several buckets: IDEA-20260809-313546
      and IDEA-20260809-3a39bc (both AEADC commitment records, where the phrase appears incidentally),
      IDEA-20260809-44b750 (partitioning query yield), IDEA-20260813-28cf9c, IDEA-20260813-c9bec2,
      IDEA-20260813-ea5ed4, IDEA-20260813-17acdf, IDEA-20260808-e40da2, IDEA-20260808-4f83f6 and IDEA-20260805-74349c,
      which are outside this bucket and were identified only by filename match rather than by full
      reading. No proposal under RQ-AEADC-8db132 fits a growth exponent against key count, and none
      states the union accounting as an internal model to be compared against. RQ-AEADC-8db132''s
      targets are certificates, the k-way cost curve, the repair audit and the interface question;
      the k-way curve is a curve in colliding-key count for a commitment attack, not in deployed key
      population.'
    verdict: 'UNVERIFIED. Multi-user security for symmetric modes is certainly a named research area
      outside this repository and no claim is made here about its published content; the union accounting
      stated in stage 1 is recomputed internally precisely so that nothing is quoted. What is claimed
      new is internal: this repository holds no fitted growth exponent for any mode against key population,
      and no AEADC record compares a measured multi-key quantity against a computed union prediction.
      Assembled from known parts: the ideal-primitive substitution from this bucket''s directive,
      the scaled-analogue and pre-declared-scaling-rule discipline from RQ-POLYMAC-7c89e4''s constraints,
      and section 3 null-object discipline.'
  object_first_candidate:
    tracked_object: 'The population-level hit set: the multiset of (key index, query, mode output)
      triples across all u keys, projected to the coincidence structure -- which queries produced
      outputs that coincide across two or more key indices, and at what multiplicity. The absolute
      outputs and the keys themselves are not tracked.'
    lossiness: Lossy. The projection discards every output value and every key value, retaining only
      the partition of the query-by-key grid into coincidence classes. Dimension falls from u times
      q times the output width to the number of nontrivial coincidence classes, which is far smaller
      in every regime tested. The discard is compatible with the mode's operation because the adversary's
      success in the declared game depends only on coincidences, not on the values that coincide,
      so the retained part determines the game outcome deterministically. If a run shows the game
      outcome depends on values outside the coincidence structure, the projection is not compatible
      and the entry must be rewritten; that check is explicit in the metrics.
    propagation: One step is adding one more key to the population. It acts on the tracked object
      by adjoining a new row to the query-by-key grid and by creating new coincidence classes with
      every existing row, so the number of pair opportunities grows quadratically in u while the per-key
      structure is unchanged. This is exactly where union accounting and coincidence accounting can
      diverge, and the divergence is what the fitted exponent measures.
    survival_score: The coincidence structure survives until the key population saturates the key
      space, at which point every query coincides with something and the partition carries no information.
      Survival is reported concretely as the largest u at which the fraction of queries lying in a
      nontrivial coincidence class remains below one half, stated per key width. At 8-bit keys this
      is expected to fail early and at 20-bit keys not at all within the tested u, and both endpoints
      are informative about the instrument's usable range.
  null_object_control: A null population of u independent random functions with the same interface
    and the same output width, replacing the mode entirely, answered from the same query schedule
    in the same invocation. The adversary code is identical. For the signal arm to mean anything,
    the null must show a fitted exponent equal to the value predicted by pure birthday coincidence
    among u independent random functions -- computed in closed form in stage 1 -- and no more. If
    the null reproduces the signal arm's exponent, the fit is reading population size rather than
    mode structure and the measurement means nothing.
  discriminated_from:
  - IDEA-20260809-33f26f measures the k-way collision cost curve for commitment. Its k counts colliding
    keys constructed by an attacker inside one ciphertext; this record's u counts independent honest
    keys in a population and never constructs a collision.
  - IDEA-20260809-44b750 counts candidate keys eliminated per partitioning query. That is a search
    efficiency measure inside one attack; this is an accounting comparison between a measured exponent
    and a union prediction.
  - RQ-POLYMAC-7c89e4 measures forgery bound tightness for GHASH and Poly1305. The object there is
    the polynomial MAC and the quantity is forgery probability; here the authentication layer can
    be replaced by an ideal MAC without changing the measurement.
  - 'A generic birthday-bound calculation, which is precisely the null arm here rather than the result:
    the contribution is the gap, or its absence, between the mode arm and that calculation.'
  - IDEA-20260809-3da508 measures committing-construction overhead on one harness. That is a cost
    measurement of repairs; this measures an accounting exponent of an unrepaired mode.
  assumptions:
  - The declared multi-key game is a fair operationalisation of population-level exposure and not
    an artifact of the chosen success predicate; two success predicates are run to check this.
  - The union accounting as stated in stage 1 is the accounting actually used in practice for this
    game; it is stated internally and is not attributed to any external source.
  - Key widths from 8 to 20 bits sit in a regime where the coincidence structure behaves as it would
    at larger widths up to a scaling of the key space, which is an assumption and is reported as the
    sole basis of any projection.
  - The seeded ideal permutation in the primitive slot removes primitive-specific structure, so the
    measured exponent is a mode quantity.
  - Keys in the structured regime are related by exactly the declared relation and by nothing else,
    checked by a direct enumeration of the derived population at the smallest width.
  predictions:
  - metric: fitted exponent of advantage against key population u, independent-key regime, at 16-bit
      keys
    direction: different
    minimum_effect: 1.0
  - metric: difference between the fitted exponent and the computed union prediction, independent-key
      regime
    direction: different
    minimum_effect: 0.15
  - metric: fitted exponent in the structured-key regime minus the exponent in the independent-key
      regime
    direction: higher
    minimum_effect: 'explicit refusal to pre-commit a number: the size of this gap is set entirely
      by the declared key-derivation relation, which the Coordinator has not yet fixed, and inventing
      a threshold before that choice would be a fabricated prediction'
  - metric: fitted exponent of the random-function null arm against the closed-form birthday prediction
    direction: different
    minimum_effect: 0.1
  minimal_test:
    design: One invocation, three arms sharing one query scheduler. Implement the mode at key widths
      8, 12, 16 and 20 bits with a seeded ideal permutation in the primitive slot. For each width,
      sweep u over {1,4,16,64,256,1024} with a fixed total query budget across the population, running
      200 independent populations per cell and recording the empirical success rate of a frozen adversary.
      Fit log advantage against log u per width, with a bootstrap interval on the slope. In the same
      invocation and from the same query schedule, run the structured-key arm and the random-function
      null arm. Compare all three fitted exponents against the union prediction and the closed-form
      birthday prediction computed in stage 0. The discriminating comparison is the signed gap between
      the mode arm's exponent and the union prediction, floored by the null arm. Cost is a few core-hours
      at the largest width, and the smallest three widths alone already discriminate if the gap is
      large.
    controls:
    - Random-function null population, same interface and same query schedule, executed in the same
      invocation.
    - Closed-form birthday prediction for the null arm, computed in stage 0 before any run.
    - Union accounting prediction computed in stage 0 for both budget-splitting conventions.
    - Second success predicate for the multi-key game, to separate a mode effect from a predicate
      artifact.
    - Direct enumeration of the derived key population at the smallest width, verifying the structured
      regime contains exactly the declared relation.
    - 'Key-width sweep itself acts as a control: a genuine mode exponent should be stable across widths,
      and one that drifts with width is a small-space artifact.'
    required_metrics:
    - fitted exponent of advantage against u, per key width and per regime, with bootstrap interval
    - union accounting prediction at each cell
    - closed-form birthday prediction for the null arm
    - fraction of queries in a nontrivial coincidence class, per cell
    - empirical success rate per cell with confidence interval
    - exponent drift across key widths
  falsification_conditions:
  - The fitted exponent agrees with the union prediction within its interval at every width and in
    both regimes, which closes the graded worry within the tested scope and is a usable measured obstruction.
  - The null arm reproduces the mode arm's exponent, which makes the fit uninterpretable.
  - The fitted exponent drifts systematically with key width, indicating a small-key-space artifact
    rather than a mode quantity.
  - The two success predicates give exponents whose intervals do not overlap, meaning the game measures
    the predicate.
  - The coincidence-fraction metric exceeds one half at every tested cell, meaning the tracked object
    has already dissolved and no exponent is meaningful.
  - The structured-key enumeration reveals relations beyond the declared one, voiding that arm.
  confounders:
  - 'Total query budget interacts with u: splitting a fixed budget across a growing population conflates
    population size with per-key budget, which is why both budget conventions are computed and one
    is fixed by declaration.'
  - Small key widths make key collisions among the honest population non-negligible, which is a separate
    effect from the one being measured and is counted explicitly.
  - A frozen adversary tuned implicitly for small u will understate the exponent at large u.
  - Fitting a slope over six u values with bootstrap intervals is fragile; the interval width is reported
    and cells with wide intervals are not used for the headline claim.
  - Seed sharing between the mode arm and the null arm would correlate the coincidence structures;
    the seed schedule is declared disjoint.
  interpretation_limits:
  - The fitted exponent is a property of the tested key widths and the declared game, and its extension
    to cryptographic key widths is a labelled projection that this contract does not make.
  - Every advantage is a lower bound because the adversary is frozen and suboptimal.
  - Nothing here is a statement about any deployment's key count, key derivation, or exposure, and
    no such inference is licensed.
  target_complexity:
    time_exponent: No attack exponent is claimed. The instrument costs O(u times q) mode evaluations
      per population, and the reported exponent is a property of a measured curve, not an attack cost.
    memory_exponent: No attack exponent is claimed. Memory is O(u plus the number of nontrivial coincidence
      classes), which is bounded by the query budget.
    best_known: The incumbent is the union accounting itself -- multiply the per-key statement by
      the key count -- recomputed internally in stage 0. This record does not beat it; it measures
      whether the measured exponent departs from it at toy widths, and the likeliest outcome is that
      it does not.
    hidden_overhead: 'The human cost is in the game definition: a multi-key success predicate that
      is fair to both regimes is hard to write, and an unfair one silently manufactures or destroys
      the gap. Lower-order compute hides in the bootstrap slope fitting across six u values times
      four widths times three arms.'
  dominated_by: n/a (no result claimed). Checked against every row this bucket contains -- the eight
    AEADC commitment proposals and the four targets of RQ-AEADC-8db132 -- and against RQ-POLYMAC-7c89e4's
    four targets. None of them is a population-level accounting measurement, so there is no time,
    memory or query frontier row that dominates or is dominated by this.
  sota_delta: no attack; conceptual/measurement contribution only. The quantitative deliverable is
    a fitted exponent with a confidence interval at four key widths in two key regimes, set against
    a union prediction and a closed-form birthday null, where the corpus currently holds neither number.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: 'By part. That the instrument produces a stable, well-conditioned exponent
    at 16- and 20-bit keys: about 0.7, with the risk being wide bootstrap intervals over only six
    u values. That the independent-key exponent departs from the union prediction by more than 0.15:
    about 0.25, because union accounting is expected to be roughly right in the independent regime
    and the honest expectation here is a null result that is still worth having. That the structured-key
    regime differs measurably from the independent one: about 0.55, entirely conditional on the derivation
    relation the Coordinator fixes. That the null arm matches its closed-form birthday prediction:
    about 0.85, and a mismatch would invalidate the instrument rather than produce a finding.'
