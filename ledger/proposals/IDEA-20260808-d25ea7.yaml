idea:
  id: IDEA-20260808-d25ea7
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-SIG-001
  goal_id: GOAL-SIG-001
  title: Replace the syzygy COUNT by the FALL IMAGE — the span of the low-degree polynomials
    the extra syzygies actually produce, modulo the ideal generated below that degree — because
    a cascade of syzygies that all produce the same few polynomials is sterile and costs nothing
  class: mechanism
  claim: 'An extra (non-Koszul, non-rewritable) syzygy in degree D is by definition a coefficient
    vector c with deg(sum_i c_i f_i) < max_i deg(c_i f_i): it is a DEGREE FALL, and its operational
    content is the polynomial g_c = sum_i c_i f_i it produces, not its existence. Define the
    FALL IMAGE at degree D as W_D = span_k { g_c : c in Syz_D^extra } modulo (I_{<D})_{deg
    g}, where I_{<D} is the ideal generated by everything already available below degree D.
    CLAIM: the exploitability question GOAL-SIG-001 was created to answer is exactly whether
    dim W_D grows, and it is possible — indeed this record''s primary hypothesis — that dim
    W_D is bounded (typically 1 or O(1)) while the extra-syzygy count grows like 8k or 2n/3+1
    or 2724, because a large family of syzygies can produce a one-dimensional space of fall
    polynomials. If dim W_D = O(1) uniformly, the cascade is STERILE: it cannot lower d_solve
    by more than O(1) degrees and its cost image is bounded by E2-01''s per-degree jump, regardless
    of how many syzygies there are. If dim W_D grows with n, the cascade is PRODUCTIVE and
    the growth rate converts directly into a degree reduction. The goal has measured only
    the count.'
  mechanism: 'KN-FIND-006 already exhibits the mechanism at degree 3 and does not draw this
    consequence: a subset-sum of descended quadrics degenerates to an AFFINE form P (quadratic
    parts cancel) and the multiplier is its exact complement, giving the boolean identity
    P(1+P) = 0. That is ONE fall polynomial. The number of subset-sums that degenerate can
    be large while the set of resulting affine forms P is small — indeed if the degeneration
    is governed by a linear condition on the coefficient vector, the falls form a linear space
    whose IMAGE under c -> sum c_i f_i can collapse to very low dimension. The fall image
    is the right object because Groebner cost depends on which polynomials enter the basis,
    not on how many ways they can be derived. Everything the goal has archived is a kernel
    dimension; the fall image is the dimension of the image of the SAME linear map, computable
    from the same matrices with one extra rank computation.'
  why_not_a_renamed_known_approach: 'Nearest known method: counting the F5 criteria / trivial
    syzygies and subtracting them, which is what this goal does. The nearest classical object
    is the module of syzygies and its Betti numbers. The difference: Betti numbers and the
    goal''s extra_D count the SOURCE side (the kernel); the fall image is the TARGET side
    (the image of the evaluation map into lower degree), and for a linear map the two are
    related only through the rank, which is exactly the quantity nobody has computed. This
    is not a renaming — it is the other half of the rank-nullity identity, and the cost lives
    on the half that was not measured.'
  predictions:
  - observable: dim W_D for the boolean chained Semaev system
    metric: dimension of the span of fall polynomials modulo I_{<D}, at D in {3,4,5}, n in
      {9,12,15,18,21}
    predicted: 'PRIMARY HYPOTHESIS: dim W_3 = 1 at every n (matching KN-FIND-006''s single
      degree-3 mechanism, whose deficit(3) = 1 already suggests it), and dim W_4 = O(1) —
      NOT 8k-1 — even though the extra-syzygy count at D = 4 is measured at exactly 8k-1.
      If dim W_4 = 8k-1 the syzygies are fully productive and the ratio extra/dim is 1; if
      dim W_4 = O(1) the ratio grows like k and the cascade is sterile. THE RATIO IS THE DELIVERABLE
      and it is a one-bit-per-cell decision the goal has never made.'
  - observable: degrees actually reduced
    metric: d_solve with and without adjoining W_D to the generating set
    predicted: If dim W_D = O(1), adjoining W_D changes d_solve by at most O(1); if it grows,
      d_solve drops measurably. This is a direct, causal test of exploitability rather than
      an inference from a count.
  - observable: the same statistic on the support-matched null
    metric: dim W_D(null)
    predicted: 0 at D = 3 (KN-FIND-006 records degree-3 kernel 0 in the null), so any nonzero
      prime is Semaev content; at D >= 6 the null's own validity is contested (EV-SIG-008's
      7110), so the null arm must be re-derived before D >= 6 is interpreted — which is the
      goal's standing blocker and is NOT bypassed here.
  minimal_test: 'Re-analysis of committed matrices plus one extra rank per cell. For each
    already-archived cell: (1) recover the extra-syzygy space as the kernel of the Macaulay
    map restricted to the non-trivial complement the goal already computes; (2) apply the
    evaluation map c -> sum c_i f_i to a basis of that kernel; (3) reduce the resulting polynomials
    modulo the ideal generated in degrees < D and take the rank. Only step (3) is new. Start
    at n = 9 and 12, D = 3 and 4, where committed artifacts and the 8k-1 closed form exist
    and the answer is checkable against KN-FIND-006''s exhibited mechanism.'
  controls:
  - KNOWN-ANSWER EDGE: at D = 3, KN-FIND-006 exhibits the mechanism explicitly (P(1+P) = 0),
      so the instrument must return the corresponding fall polynomial and a dimension consistent
      with deficit(3) = 1. An instrument that does not reproduce the known degree-3 case may
      not be used at D >= 4.
  - NULL ARM: the support-matched null must return dim W_3 = 0, matching its recorded degree-3
      kernel of 0.
  - TRIVIAL-SYZYGY ARM: Koszul and Frobenius syzygies must map to 0 in the fall image by construction
      (they produce nothing new); if they do not, the quotient by I_{<D} is implemented wrongly.
  - GROWTH CONTROL: dim W_D must be reported across >= 3 values of n at fixed D so that "bounded"
      and "growing" are distinguishable; a single n decides nothing.
  confounders:
  - 'The quotient by I_{<D} is where all the subtlety lives: "already available below degree
    D" must be defined as the degree-<D part of the ideal generated by the input polynomials
    and everything previously produced, and the definition must be frozen before measurement.'
  - Fixed-degree cross-sections are the wrong instrument (KN-FIND-006's own scope note); dim
    W_D must be reported degree-resolved, not as a cumulative number.
  - n = 9 and n = 17 are structurally deficient cells (not full systems) and must be excluded
    from any growth fit, exactly as KN-FIND-006 records.
  - Over GF(2) the Frobenius relations x^2 = x generate falls in the null too; they must be
    quotiented out or the null will show spurious image.
  falsification_conditions:
  - dim W_4 = 8k-1 at n = 12 and 15 (fully productive). The sterility hypothesis is false,
    the cascade is exploitable in principle, and the goal's counting programme was measuring
    the right thing.
  - The D = 3 known-answer edge is not reproduced. Instrument void.
  - dim W_D cannot be defined stably because the I_{<D} quotient is ambiguous in the committed
    artifacts. That is a reportable finding about what the goal archives, exactly parallel
    to IDEA-20260806-7ea402's stage-1 outcome.
  interpretation_limits: Toy tier and BINARY, while RQ-SIG-001's decision target is phrased
    for prime-field decomposition cost — a mismatch IDEA-20260805-0d2a21 already records and
    this record does not repair. No attack, no exponent moved. A sterile verdict closes the
    exploitability question for the tested degrees and sizes only, and explicitly leaves open
    D >= 6 (blocked on the null) and the prime-field analogue.
  assumptions:
  - Exact GF(2) linear algebra; the committed Macaulay matrices are reusable.
  - The trivial/rewritable syzygy family the goal subtracts is correctly identified (H-SIG-8f7399
    disputes exactly this and its dispute propagates here unchanged).
  heuristic_assumptions:
  - id: HA-1
    statement: The extra-syzygy space in degree D is a linear space whose evaluation image
      has dimension O(1) uniformly in n, because the degenerations that produce falls are
      governed by a bounded number of structural coincidences (the quadratic-part cancellation
      of KN-FIND-006) rather than by n independent ones.
    rigorous_ingredient: 'Rank-nullity: dim(kernel) = dim(domain) - dim(image), so the image
      dimension is exactly computable from quantities the goal already measures plus one rank.
      No assumption is needed for the identity; the assumption is only about the VALUE.'
    distribution_imitated: 'The generic expectation for a structured family: a bounded set
      of structural identities generating a large but low-rank family of relations, as in
      the classical Koszul case where C(n,2) syzygies produce nothing new at all.'
    validation_route: Direct computation at n in {12, 15, 18} and D in {3,4,5} on committed
      matrices; report dim W_D against n and fit bounded versus linear growth. TOY SCALE (n
      <= 21, GF(2)); no crypto-scale route exists and none is claimed.
    tail_checks: Report the largest dim W_D observed and the cell achieving it; if a single
      cell breaks a bounded pattern, that cell is the finding and must not be smoothed.
  target_complexity:
    time_exponent: 'No attack exponent. The record bounds how much the cascade can move d_solve:
      at most dim W_D degrees in the most optimistic reading, and by E2-01''s jump factor
      each degree is worth a bounded ratio of consecutive Macaulay column counts. A sterile
      verdict pins the cascade''s contribution to theta at exactly 0.'
    memory_exponent: One extra rank computation on a matrix no larger than the archived Macaulay
      matrix; no new memory regime.
    best_known_baseline: For the binary systems, KN-LIT-7605/7607 already prove the governing
      degree invariant is bounded independently of n and that this does NOT yield subexponential
      ECDLP. This record is therefore a mechanism probe under a known ceiling, not a route
      past it, and says so.
    hidden_overhead_disclosure: The definition of I_{<D} is a modelling choice that materially
      affects the answer; it is frozen before measurement and reported.
    time_memory_tradeoff: Not applicable.
  sota_delta: 'Zero on attack axes. Deliverable: a per-cell ratio extra_D / dim W_D, turning
    a growing count (8k-1 at D=4, exact for k = 3..7) into a productivity measure with a pre-registered
    dichotomy. If the ratio grows like k, GOAL-SIG-001 can be decided negative on committed
    data with one extra rank per cell rather than on a new D >= 6 null.'
  dominated_by: KN-LIT-7605 and KN-LIT-7607 dominate the ASYMPTOTIC question for these binary
    systems (bounded degree invariant, proved, all n) and KN-FIND-006 dominates the specific
    low-degree counts. This record is not Pareto-competitive with them on the asymptotic axis
    and does not pretend to be; it is undominated only on the narrow question "is the cascade
    productive or sterile", which neither source answers. Attack frontier (rho, BSGS, VW,
    S T^2, sqrt(TN)) checked and untouched.
  estimated_cost: Implementation low; compute low (one rank per already-computed cell; no
    new Macaulay construction at D <= 5).
  recommended_priority: high
  honest_prior_of_survival: 0.8 that dim W_3 = 1 (KN-FIND-006 essentially exhibits it). 0.6
    that dim W_4 is bounded rather than 8k-1 — genuinely uncertain, and that uncertainty is
    why the measurement is worth making. 0.5 that the committed artifacts support the I_{<D}
    quotient without recomputation; if they do not, the cost rises from low to medium.
  novelty_status: screened
  novelty_class: speculative
  novelty_screen: EXISTING_PROPOSALS titles including IDEA-20260805-d38a8c (absolute versus
    ratio), -8a68d3, -bbfca9, -0d2a21, IDEA-20260803-202a15; EXISTING_HYPOTHESES H-SIG-8f7399
    and H-SIG-e7ff26 read at statement level; REJECTED_TITLES (ECDLP-IDEA-372 Pommaret-Janet
    involutive syzygy quotient, ECDLP-IDEA-013 elliptic-normal secant-syzygy decoder — both
    rejected and both about different objects); KNOWLEDGE_BARRIERS; KN-FIND-006 in full; GOAL-SIG-001.yaml
    in full. No corpus record computes the image of the evaluation map. WEB SEARCH UNAVAILABLE.
  discriminated_from: 'IDEA-20260805-d38a8c converts the absolute syzygy count into a RATIO
    against a null — still a kernel-side quantity, still a count. This record changes SIDES
    of the rank-nullity identity: it measures the image, which no normalisation of the kernel
    can recover, because kernels of different maps with the same dimension can have images
    of different dimensions. IDEA-20260803-202a15 seeks a closed form predicting the deficit
    MAGNITUDES; this record asserts the magnitudes may be the wrong statistic entirely. IDEA-20260806-7ea402
    argues cost depends only on d_solve; this record is compatible with it and supplies the
    mechanism by which the cascade could or could not move d_solve.'
