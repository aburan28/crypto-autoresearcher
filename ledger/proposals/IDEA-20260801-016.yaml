idea:
  id: IDEA-20260801-016
  question_id: RQ-SNOVA-001
  title: >-
    SNOVA wedge-product independence map: measured attack cost under
    wedge-product and group-action attacks at toy parameters
  class: measurement
  claim: >-
    SNOVA's claimed security under wedge-product and group-action attacks
    can be mapped at toy parameters: the measured best-known attack cost
    under the wedge-product decomposition and the group-action structure,
    compared to the plain-whipped-UOV baseline of matched size, either shows
    the two attacks are covered by the baseline or reveals an uncovered
    cost gap. This produces the independent security map SNOVA's analysis
    lacks.
  mechanism: >-
    SNOVA's public key carries a wedge-product decomposition (the tensor/
    wedge structure of its whipping) and a group-action structure (the
    extended public key orbit). At toy parameters both structures are
    computable and attackable directly; the measured attack cost under each
    attack family, versus the matched plain-whipped-UOV baseline, maps
    whether the two attack families are independent or redundant.
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-01'
    corpus_paths_grepped:
      - knowledge/literature
      - ledger/proposals
    grep_results:
      - No existing proposal maps SNOVA's wedge-product and group-action
        attack costs at toy parameters in this program.
    conclusion: >-
      Measurement proposal; novelty unverified against full literature, which
      is the point of the map.
  assumptions:
    - Toy parameters preserve the wedge-product and group-action structures.
    - The best-known attacks under each family are implementable at toy sizes.
  predictions:
    - metric: wedge_or_group_action_attack_cost_over_uov_baseline
      direction: different
      minimum_effect: >-
        A cost ratio below 0.5 (i.e., the structure attack is cheaper than
        the baseline) at the largest toy size is a map departure.
  minimal_test:
    design: >-
      Build matched toy SNOVA and plain-whipped-UOV instances; for each,
      run the best-known wedge-product attack, the best-known group-action
      attack, and the baseline UOV attack; measure cost per attack family
      and report the map (attack family x instance type x cost).
    controls:
      - Same attack code across instance types.
      - Matched parameters.
      - Baseline plain-whipped-UOV instances.
    required_metrics:
      - attack cost per family per instance type
      - success probability per family
      - map table with ratios
  falsification_conditions:
    - All ratios >= 0.5 (both attack families covered by the baseline;
      independent map confirmed).
    - Any ratio < 0.5 (attack family cheaper than baseline; uncovered gap).
  confounders:
    - Toy sizes where the wedge-product structure degenerates.
    - Attack-family classification ambiguity.
  interpretation_limits:
    - Toy map only; no crypto-scale claim about SNOVA's parameters.
    - A covered map does not prove crypto-scale coverage.
  heuristic_assumptions:
    - id: HEUR-SNOVA-MAP-1
      statement: >-
        The relative attack costs under wedge-product and group-action
        families at toy sizes are directionally representative of larger
        sizes.
      rigorous_support: None; heuristic, tested by the toy-size trend.
      validation_plan: Run the map at 2-3 toy sizes and check the trend.
  target_complexity:
    time_exponent: n/a (map)
    memory_exponent: n/a
    best_known: n/a
    hidden_overhead: n/a
    tradeoff_note: n/a
  dominated_by: null
  sota_delta: >-
    No attack claimed. Deliverable is an independent toy map of the two
    attack families' costs relative to the baseline, which decides whether
    SNOVA's claimed security coverage holds.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
