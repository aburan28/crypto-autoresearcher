idea:
  id: IDEA-20260811-9bc805
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-RAYCL-3985f4
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-aeeb17
  claim_tier: toy
  title: >-
    THE FUSION IS NOT CONTENT-FREE -- IT SUPPLIES EXACTLY ONE ALGORITHM, AND
    THAT ALGORITHM IS p^{1/4} SLOWER THAN rho. A birthday collision search on
    the pair-torsor X_m genuinely solves ECDLP: walk from (E, P) and from
    (E, Q) under small split primes and unit multipliers, and a collision
    [a](E, P) = [b](E, Q) yields +-k through the surjection O/m -> O/n = Z/N.
    Its cost is sqrt(#Cl_m(O)) = sqrt(h * #E(F_p)) = p^{3/4+o(1)}, because
    fusing a p^{1/4} problem onto a p^{1/2} problem MULTIPLIES the search space
    instead of splitting it. Restricting the walk to the fibre over E collapses
    it back to plain rho at p^{1/2} with O(1) memory and nothing gained, and
    the Pohlig-Hellman decomposition of the extension
    1 -> (O/m)^*/im(O^*) -> Cl_m -> Cl -> 1 gives max(p^{1/4}, p^{1/2}) =
    p^{1/2} -- exactly the baseline. The only sub-exponential corner is index
    calculus in Cl_m(O), and it is blocked at a named step: relation collection
    is computable but the TARGET has no computable ideal representative, and
    producing one is psi. This is a quantitative T1 answer with exponents,
    not a shrug
  class: algorithm

  claim: >-
    (A) WHY AN ALGORITHM RECORD, IN A QUESTION EXPECTING T1. IDEA-20260811-25ad05
    shows the level structure is a free input and that the ray-class coordinate
    fails the lossy-projection test, i.e. it is a relabelling. But a bijective
    re-coordinatisation CAN carry content when the new coordinates support
    operations the old ones do not -- that is exactly how index calculus beats
    generic search in F_q^*. So T1 is not established until the ALGORITHMS the
    new coordinates support are enumerated and priced. This record does that,
    and the answer is not "nothing": the fusion supplies a real, correct,
    previously unwritten ECDLP algorithm. It is simply worse.

    (B) THE ALGORITHM, WRITTEN OUT WITH Require/Ensure.
      ALGORITHM 1 (TORSOR BIRTHDAY SEARCH).
      Require: p, ordinary E/F_p with End = O maximal, D and its factorisation,
        m = (pi - 1)O, a generating set S of Cl_m(O) consisting of classes of
        split primes of small norm together with kernel elements from (O/m)^*;
        an instance (P, Q = [k]P) with P of prime order N; a full O-module
        generator R with [c]R = P (constructed publicly, IDEA-20260811-25ad05
        Lemma 3).
      Ensure: k, or failure.
        1. Set x_0 := (E, R) and y_0 := (E, R_Q) where R_Q is the level
           structure attached to Q by the same public construction.
        2. Run two pseudorandom walks on X_m from x_0 and y_0 under S, with
           distinguished points, recording the accumulated exponent vector of
           each step (which is a KNOWN element of Cl_m(O) at every point,
           because we chose the steps).
        3. On a collision [a] * x_0 = [b] * y_0, form [c] := [a][b]^{-1}. It
           lies in Cl_m(O) and carries y_0 to x_0.
        4. Its image under Cl_m(O) -> Cl(O) is trivial (both pairs sit over E),
           so [c] lies in the kernel (O/m)^*/im(O^*); push it through the ring
           surjection O/m -> O/n = Z/N and read off +-k, resolving the sign with
           one group operation.
      CORRECTNESS follows from simple transitivity (IDEA-20260811-9402e9 part C)
      and from the kernel identification of the seed's (C). The algorithm is
      correct; the entire question is its cost.

      LEMMA A (SEARCH-SPACE SIZE; responsibility: size).
        #Cl_m(O) = h(O) * #(O/m)^* / #im(O^*) = Theta(h(O) * #E(F_p)) up to the
        Euler factor prod (1 - 1/Norm(q)) = 1/p^{o(1)}, and h(O) = |D|^{1/2+o(1)}
        = p^{1/2+o(1)} away from the Hasse endpoints, so
        #Cl_m(O) = p^{3/2+o(1)}.
      LEMMA B (RUNTIME; responsibility: runtime). Under HA-1 (mixing) and HA-2
        (birthday), Algorithm 1 terminates after
        Theta(sqrt(#Cl_m(O))) = p^{3/4+o(1)} steps, each step being one
        small-degree isogeny evaluation on a curve-plus-point, i.e.
        (log p)^{O(1)} field operations. Memory O(1) with distinguished points,
        or p^{3/4} for a naive table.
      COROLLARY (THE HEADLINE NUMBER). Algorithm 1 costs p^{3/4+o(1)} against
        rho's 0.886*sqrt(N) = p^{1/2+o(1)}. IT IS p^{1/4} WORSE. The reason is
        structural and worth stating in one line: the fusion MULTIPLIES the two
        problems' search spaces (h * N) where a useful decomposition would have
        SPLIT one of them.

    (C) THE THREE DEGENERATIONS, EACH PRICED.
      C1. FIBRE-RESTRICTED WALK. Restrict S to the kernel (O/m)^*/im(O^*), i.e.
        walk only within the fibre over E. Then the search space is
        Theta(#E(F_p)) = p^{1+o(1)} but every step is multiplication of the
        point by a KNOWN scalar u, so the walk is an ordinary pseudorandom walk
        in G with known exponents -- that is PLAIN POLLARD rho, at
        0.886*sqrt(N) = p^{1/2+o(1)} with O(1) memory. Gained: nothing. Lost:
        nothing. The fibre-restricted torsor walk and rho are the same algorithm
        in different notation, and this record says so rather than presenting it
        as a new method.
      C2. POHLIG-HELLMAN ON THE EXTENSION. The exact sequence
        1 -> (O/m)^*/im(O^*) -> Cl_m(O) -> Cl(O) -> 1 invites the standard
        two-stage attack: solve in the quotient, then in the kernel. Stage 1 is
        Cl(O)-vectorization, best known at h^{1/2} = p^{1/4} time and memory
        [recall-confident, relayed via IDEA-20260811-40c0b5 assumption A3;
        Galbraith 1999, Galbraith-Stolbunov 2013; NOT re-verified this session].
        Stage 2 is ECDLP in the kernel, p^{1/2}. Total
        max(p^{1/4}, p^{1/2}) = p^{1/2}. EXACTLY THE BASELINE, not better and
        not worse. This is the precise sense in which the fusion is
        computationally inert: the extra structure it adds is a factor h whose
        own difficulty (p^{1/4}) is strictly below the difficulty it is being
        added to (p^{1/2}), so it is absorbed without trace.
      C3. THE SUB-EXPONENTIAL CORNER, AND ITS NAMED BLOCK. Ray class groups of
        imaginary quadratic orders admit sub-exponential structure and
        discrete-logarithm computation, L_{|D|}(1/2), by the Hafner-McCurley /
        Buchmann relation-lattice method [recall-confident, NOT re-verified this
        session; see also IDEA-20260807-8cdc79's PIP discussion, which records
        that for an imaginary quadratic order the unit rank is zero so PIP and
        SG-PIP coincide and both are sub-exponential]. RELATION COLLECTION IS
        COMPUTABLE HERE: a relation is a smooth principal ideal (alpha) =
        prod q_i^{e_i} together with the class of alpha mod m in
        (O/m)^*/im(O^*), and BOTH halves are computable from alpha, so the
        structure of Cl_m(O) and discrete logs IN IT are sub-exponentially
        available. THE BLOCK IS THE TARGET. To solve a DL in Cl_m(O) one must
        first express the TARGET class over the factor base, which requires a
        smooth IDEAL REPRESENTATIVE of the class of (E, R_Q). The only data
        available for that class is a curve and a point. Producing an ideal
        representative of it is precisely computing psi, which is the ECDLP
        (the seed's D3). SO: the sub-exponential machinery exists, is
        computable, and cannot be pointed at the target. That is a NAMED
        OBSTRUCTION at the docs/inventor-protocol.md section 4 standard, not a
        cost estimate.
        THE CONDITIONAL, STATED SO THE TARGET IS PRECISE AND NOT VAGUE: IF a
        polynomial-time (or even p^{1/2 - epsilon}-time) algorithm produced a
        smooth ideal representative of the ray class of a given pair, ECDLP
        would fall to L_p(1/2). No such algorithm is proposed here; this
        record's own prediction is that none exists, and the conditional is
        stated only so a reviewer can attack the right thing. It must never be
        quoted without its antecedent.

    (D) THE ENUMERATION, AND WHY IT IS THE WHOLE ANSWER TO SUB-QUESTION (c).
      Every algorithm the torsor supports must move the coordinate by group
      elements it can compute. The computable group elements are exactly: (i)
      classes of small split primes (isogeny evaluation), (ii) kernel elements
      from (O/m)^* with known scalars (point multiplication), (iii) products of
      those. Therefore any torsor-based algorithm is a walk in a Cayley graph of
      Cl_m(O) with a computable generating set, and its cost is bounded below by
      the collision problem in whatever subgroup it confines itself to:
        - full group: p^{3/4} (Algorithm 1),
        - kernel only: p^{1/2} (= rho, C1),
        - quotient only: p^{1/4} but k-free (the seed's D1, and
          IDEA-20260807-0fafe8's Hom = 0 result),
        - two-stage: p^{1/2} (C2),
        - relation-lattice: sub-exponential but unaimable (C3).
      NO SETTING IS BELOW p^{1/2}. That is the quantitative content of T1 for
      this question, and it is a stronger statement than "no cost functional
      moves": it is an exhaustive costing over the enumerated family, with the
      one escape route named and blocked.

    (E) WHAT WOULD OVERTURN THIS. Any of: a generating set of Cl_m(O) whose
      Cayley graph has diameter or mixing behaviour that makes the collision
      search sub-birthday; a computable homomorphism from Cl_m(O) onto a group
      of order p^{o(1)} that is nontrivial on the kernel (which would give a
      Pohlig-Hellman split of the kernel and hence of the ECDLP -- note this is
      exactly what IDEA-20260808-5158fa closes in characteristic zero and
      IDEA-20260811-34a6d8 predicts is zero-bit in characteristic p); or a
      method of producing an ideal representative of a pair's class. Each is a
      concrete falsifier and each would be a P3 event.

  resource_label: >-
    R3 (End(E) as a ring; m; O/m; the ray class group), R4 (the class-group
    action on curves, lifted to pairs), R5' (level structure at the Frobenius
    modulus -- the candidate taxonomy sub-entry the seed proposed and left to
    the Coordinator; used here as a label without asserting the change).
  admissibility: admissible_as_a_costing_and_closure
  admissibility_argument: >-
    STATED FIRST BECAUSE THE FILTER'S CENTRAL CASE APPEARS HERE. Algorithm 1's
    kernel steps multiply the point by u in (O/m)^*, which is an endomorphism
    acting on a point of G as a scalar -- exactly what H-ENDO-001 says adds no
    congruence. IF THAT WERE THE RECORD'S CONTENT IT WOULD BE INADMISSIBLE ON
    ITS FACE AND MUST NOT BE FILED. It is not. The record's content is the
    COSTING: it exhibits the algorithm in order to PRICE it at p^{3/4} and to
    show that every restriction of it lands at or above the rho baseline, and it
    identifies H-ENDO-001's scalar collapse as the REASON C1 degenerates to rho
    rather than as a mechanism to exploit. H-ENDO-001 is not retested; it is
    used as the explanation of a negative. The isogeny steps transport a point
    along an isogeny between distinct curves (DECOMPOSITION.md's T1/T2
    transport), which is not endomorphism application and is the standard
    machinery half the campaign's lanes use. KN-FIND-b7e091 is extended in
    spirit (the enumerated oracle-free algorithm family is priced) and never
    revisited.

  object_first_candidate:
    established_families_declared_off_limits: >-
      Declared off-limits as the PRIMARY lens per docs/inventor-protocol.md
      section 1: the connecting ideal class; the kernel ideal of <Q>; the scalar
      lambda on G; cost functionals as class functions; the generic-group
      transcript; and the ray-class coordinate itself, which IDEA-20260811-25ad05
      shows is a relabelling and which this record therefore does not adopt as
      an object. KN-OPEN-019 is unwritten, so this list is a sketch, not a
      taxonomy.
    tracked_object: >-
      THE ACCUMULATED EXPONENT VECTOR OF A WALK ON THE TORSOR: the tuple of
      exponents over the computable generating set, carried alongside the pair
      as the walk proceeds. It is NOT the coordinate (which is unknown) but the
      KNOWN part of it -- the group element the walker built itself.
    lossiness: >-
      GENUINELY LOSSY, AND THE LOSS IS PRECISELY WHAT MAKES IT USABLE. The
      projection sends the full walk state (a Weierstrass equation, an affine
      point, all intermediate curves) to a short integer vector over the
      generating set. It discards every field element and every curve, keeping
      only "which group element did I apply". That is discarded COMPATIBLY with
      the operations because exponent vectors add under composition, so one-step
      propagation is one vector increment and is deterministic. Crucially,
      NOTHING about the pair is recoverable from the exponent vector alone --
      the base pair is required -- so this is not a change of coordinates.
      CONTRAST with the seed's object: the full ray-class coordinate is a
      bijection onto Cl_m(O) and therefore IS a change of coordinates; the
      exponent vector is its computable shadow and is strictly smaller (it
      spans only the subgroup generated by the computable set, and it is known
      by construction rather than computed).
    propagation: >-
      One step, defined and measurable: apply phi_l for a split prime l and add
      e_l to the vector; or multiply the point by u and add the corresponding
      kernel exponent. Both are computable in (log p)^{O(1)} field operations
      and both are directly instrumentable. The composite of a kernel step and
      an isogeny step must commute exactly (the sequence is a group extension,
      not merely a filtration) -- a testable algebraic identity and one of this
      record's predictions.
    survival_score: >-
      Survives the whole instance family and every curve in the class -- the
      walk is defined everywhere. DISSOLVES exactly where the order theory does:
      non-maximal O (proper ideals; m may share the conductor), E'[m] not
      O-cyclic, and the supersingular case where O is not commutative. It also
      dissolves ALGORITHMICALLY, and that is this record's finding: the object
      survives structurally while its cost exceeds the baseline everywhere it is
      defined.

  mechanism: >-
    STEP 1 (zero compute). Write Algorithm 1 with Require/Ensure and prove
    Lemma A (size) and Lemma B (runtime) as single-responsibility lemmas, with
    the main cost statement doing only assembly:
    total = per-step cost x sqrt(search space).

    STEP 2 (zero compute). Write the three degenerations of part (C) and their
    exponents, and check each against the baseline, so the comparison is
    arithmetic rather than rhetorical.

    STEP 3 (zero compute). State the index-calculus block of C3 precisely:
    relations computable, target not representable, producing a representative
    is psi. Record it at the section 4 closure standard (named obstruction,
    argument, forward guidance).

    STEP 4 (toy compute, minutes to a low CPU-hour). MEASURE the collision
    exponent of Algorithm 1 rather than assuming it: implement the torsor walk
    on toy classes across a p-ladder of at least five sizes with h(O) >= 50, and
    fit the slope of log(steps) against log(p). Predicted 0.75.

    STEP 5 (toy compute). MEASURE the fibre-restricted walk (C1) on the same
    instances and fit its slope. Predicted 0.50, and it must match the
    repository's rho baseline operation count within 20 percent on the same
    instances -- the two are the same algorithm and the measurement must show it.

    STEP 6 (toy compute). Verify the commutativity identity of the two one-step
    propagations (kernel step versus isogeny step) on every enumerated pair.
    Predicted residual exactly 0.

    STEP 7 (zero compute). Record the residual class: the three falsifiers of
    part (E), each with the measurement that would detect it.

  why_not_a_renamed_known_approach: >-
    Pollard rho, meet-in-the-middle vectorization, Pohlig-Hellman over a group
    extension, and index calculus in a ray class group are all classical, and
    NONE of them is claimed as new. What is absent from this corpus is the
    ASSEMBLY: nobody has written the torsor birthday search as an ECDLP
    algorithm, nobody has computed that its search space is h * #E and therefore
    that it costs p^{3/4}, nobody has observed that the fibre-restricted version
    IS rho, and nobody has located the index-calculus block at the
    target-representative step rather than at a cost estimate. The seed
    (IDEA-20260811-319a07) states the two halves of the extension have
    "different costs if realised" (p^{1/4} and p^{1/2}) but never composes them
    into an algorithm or prices the fused search space, and it treats D5 as a
    conditional without identifying which step of the sub-exponential machinery
    fails.

  proof_search_map:
    bottleneck: >-
      The size of the search space Algorithm 1 must cover, i.e. #Cl_m(O), and
      the availability of a smooth ideal representative for the target class in
      C3. Everything else -- correctness, step cost, the kernel-to-Z/N
      projection -- is elementary and cheap. Removing either bottleneck is what
      would change the theorem: shrinking the search space below p^{1} would
      bring Algorithm 1 under rho, and producing a target representative would
      open the sub-exponential corner.
    baseline_embedding:
      parameter_slice: >-
        Set the generating set S to the kernel only. Algorithm 1 becomes
        literally Pollard rho on G with known exponents, at 0.886*sqrt(N) group
        operations and O(1) memory (KN-TECH-001, KN-TECH-006). That is an EXACT
        parameter slice reproducing the best-known baseline, not a resemblance.
        Second boundary: set m = (1). The torsor collapses to the curve set,
        Algorithm 1 becomes meet-in-the-middle vectorization at
        h^{1/2} = p^{1/4}, and it no longer solves ECDLP at all -- which is the
        seed's D1 "useless half", reproduced as a boundary of the same family.
      reproduction_check: >-
        Frozen regression fixture: on toy instances at 16, 20 and 24 bits, the
        kernel-restricted walk's measured operation count must be within 20
        percent of 0.886*sqrt(N) and must agree with the repository's own rho
        implementation on the same instances. If the baseline does not reproduce
        at the boundary, no interior exponent measured in this record is
        interpretable.
    observation_collision:
      observable: >-
        The collision event [a] * x_0 = [b] * y_0 between two walks, i.e.
        equality of two pairs in X_m.
      distinct_preimage_search: >-
        REQUIRED. Two distinct exponent vectors giving the same group element is
        exactly a useful collision, so the observable is deliberately
        non-identifying and that is the algorithm's engine, not a defect. The
        HARMFUL collision to search for is different and must be checked: two
        distinct PAIRS that the implementation reports as equal -- i.e. a
        comparison that tests only the curve (or only the j-invariant) and not
        the point. That would produce spurious collisions at rate
        #(O/m)^* times too high and would make the measured exponent look like
        1/4 instead of 3/4. The equality test must therefore compare the pair up
        to F_p-isomorphism INCLUDING the point, and the record names this as the
        single most likely implementation defect that would manufacture a false
        speedup. A measured exponent near 1/4 is to be treated as this bug until
        proven otherwise.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Algorithm 1 as a reduction chain from ECDLP to a collision search in
          Cl_m(O). Encoding: instance -> base pairs via the public level-structure
          construction. Completeness: every instance is encoded. Soundness: the
          recovered kernel element maps to +-k. Transfer: the surjection
          O/m -> O/n = Z/N. Cost loss: the search space multiplies by h,
          i.e. the reduction LOSES p^{1/4}, and that loss is the record's
          central quantitative finding.
        predicted_gain: >-
          Negative and quantified: -p^{1/4}. A transform whose measured gain is
          negative is still a transform, and reporting the sign honestly is the
          deliverable.
      - transform: specialization_pack
        proposed_object: >-
          The Pohlig-Hellman decomposition of the extension (C2): solve the
          quotient at p^{1/4}, then the kernel at p^{1/2}, charging the two over
          the provably disjoint blocks supplied by the exact sequence.
        predicted_gain: >-
          Exactly zero: max(p^{1/4}, p^{1/2}) = p^{1/2}. The decomposition is
          valid and inert, which is the sharpest available statement that the
          added structure is absorbed without trace.
    quantifier_order: >-
      ASSERTED (correctness): FORALL p, FORALL ordinary (E, O) with O maximal
      and D factored, THERE EXISTS a uniform procedure (Algorithm 1), FORALL
      instances (P, Q = [k]P) with P of prime order N: on termination the
      procedure outputs +-k, and one group operation resolves the sign.
      ASSERTED (cost, conditional on HA-1 and HA-2): the expected number of
      steps is Theta(sqrt(#Cl_m(O))) = p^{3/4+o(1)}.
      ASSERTED (degenerations): the kernel-restricted specialisation is rho at
      p^{1/2}; the two-stage specialisation is p^{1/2}; the quotient-only
      specialisation does not solve ECDLP at all.
      NOT ASSERTED: that no torsor-based algorithm below p^{1/2} exists -- the
      enumeration in (D) covers walks over the COMPUTABLE generating set and
      nothing else, and part (E) names three ways out. NOT ASSERTED: that
      index calculus in Cl_m(O) is impossible -- only that its target step is
      blocked by psi. NOT ASSERTED: any lower bound on ECDLP.
      WITHOUT knowledge of End(E) the algorithm must first factor t^2 - 4p,
      which is sub-exponential; that variant is strictly weaker and is labelled.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Every walk-based algorithm on X_m over the computable generating set
        costs at least the birthday bound of the subgroup it confines itself
        to, and those bounds are p^{3/4} (full), p^{1/2} (kernel, = rho),
        p^{1/4} (quotient, k-free); and the sub-exponential relation method
        cannot be aimed at the target because the target has no computable ideal
        representative." It can NEVER certify a lower bound on ECDLP, can never
        cover algorithms outside the walk family, and can never rule out a
        cleverer generating set (part E).
      nearby_object_control: >-
        THE Cl(O)-TORSOR OF CURVES ALONE (m = (1)) is the nearby object where
        the desired conclusion FAILS in a controlled, quantified way: there the
        identical birthday method costs h^{1/2} = p^{1/4}, which is BELOW the
        rho baseline -- because that problem's search space is h, not h * N.
        The method must reproduce that known-easier answer on the nearby object,
        and it does; a version of this argument that also reported p^{3/4} for
        pure vectorization would be measuring its own overhead rather than the
        search space. A second nearby object: the fibre alone, where the answer
        must come out at exactly rho and not better.
    proof_obligations:
      - claim: '#Cl_m(O) = Theta(h(O) * #E(F_p) / #im(O^*)) = p^{3/2+o(1)}.'
        responsibility: size
      - claim: >-
          h(O) = |D|^{1/2+o(1)} away from the Hasse endpoints (analytic class
          number formula; Siegel for the ineffective o(1)).
        responsibility: size
      - claim: >-
          Each walk step costs (log p)^{O(1)} field operations (small-degree
          isogeny evaluation on a curve-plus-point, or one point multiplication).
        responsibility: runtime
      - claim: >-
          A collision yields a kernel element whose image under O/m -> Z/N is
          +-k.
        responsibility: correctness
      - claim: >-
          The expected number of steps is Theta(sqrt(#Cl_m(O))) under HA-1 and
          HA-2.
        responsibility: success_probability
      - claim: >-
          Relation collection in Cl_m(O) is computable (a smooth principal
          (alpha) gives both its factorisation and alpha mod m), while the
          target class has no computable smooth ideal representative.
        responsibility: interface
      - claim: >-
          Classical ordinary vectorization costs h^{1/2} = p^{1/4} in time and
          memory.
        responsibility: runtime
        status: >-
          '[recall-confident, NOT re-verified this session] relayed via
          IDEA-20260811-40c0b5 assumption A3 (Galbraith 1999;
          Galbraith-Stolbunov 2013). Used only in C2, where it is the SMALLER
          of two terms and therefore does not affect the conclusion even if it
          is wrong by a wide margin -- disclosed because that robustness is
          load-bearing for the honesty of C2.'

  predictions:
    - metric: >-
        fitted slope of log(number of walk steps to collision) against log(p)
        for Algorithm 1 on toy ordinary classes across at least five p-rungs
        with h(O) >= 50
      direction: higher
      minimum_effect: >-
        slope in [0.68, 0.82], consistent with 3/4. A slope at or below 0.55
        that does not converge upward as h grows would mean the search space is
        effectively the kernel rather than the whole group -- which is far more
        likely an implementation defect (a pair-equality test that ignores the
        point; see the observation-collision audit) than a discovery, and it
        must be diagnosed as such before anything is recorded. A slope
        materially below 0.50, replicated after that diagnosis, is a P3 event:
        FLAG AND STOP, hand to the Coordinator, state no excess.
    - metric: >-
        fitted slope of log(steps) against log(N) for the fibre-restricted walk
        (C1) on the same instances, and its operation count against the
        repository's rho baseline
      direction: different
      minimum_effect: >-
        slope 0.50 +- 0.05 and operation count within 20 percent of
        0.886*sqrt(N). This is the baseline-reproduction check; failure means no
        exponent in this record is interpretable.
    - metric: >-
        commutativity residual of the two one-step propagations (kernel scalar
        step versus small-prime isogeny step), counted as the number of pairs on
        which the two orders of composition disagree
      direction: lower
      minimum_effect: >-
        exactly 0, because the sequence is a group extension. A nonzero residual
        means the action is not what the diagram says and Algorithm 1 is not
        even correct, let alone priced.
    - metric: >-
        success rate of Algorithm 1 in returning +-k, over at least 200 values
        of k per toy curve
      direction: higher
      minimum_effect: >-
        1.00 after sign resolution. Anything below 1.00 means the
        kernel-to-Z/N projection is mis-implemented, not that the algorithm
        fails.
    - metric: >-
        whether a smooth ideal representative of the target pair's class can be
        produced by any implemented method, measured as the fraction of
        instances on which the relation-collection machinery can express the
        target over the factor base
      direction: lower
      minimum_effect: >-
        exactly 0 by every method attempted, over all toy instances. A single
        instance on which a representative is produced in less than sqrt(N)
        operations opens the sub-exponential corner of C3 and is a P3 event:
        FLAG AND STOP.

  minimal_test:
    design: >-
      STAGE 0 (ZERO COMPUTE, AND IT IS THE CHEAPEST VALID DISCRIMINATOR HERE).
      Compute the two numbers: #Cl_m(O) = h * #(O/m)^*/#im(O^*) and its square
      root, against 0.886*sqrt(N). If sqrt(#Cl_m) is NOT above sqrt(N), the
      record's headline is wrong and it is refuted before any compute. One line
      of arithmetic decides it, and it can be done on paper for any toy
      discriminant.
      STAGE 1 (minutes). Build toy ordinary classes at 16-28 bits with h(O) >= 50
      and O maximal; construct m, O/m, the surjection to Z/N, and a certified
      generating set of Cl_m(O) (certified against the independently computed
      order, per IDEA-20260811-9402e9 HA-2).
      STAGE 2 (minutes to a low CPU-hour). Run Algorithm 1 with distinguished
      points; fit the collision exponent (prediction 1). Report the fit with
      confidence intervals and h(O) per instance.
      STAGE 3 (minutes). Run the fibre-restricted walk and the rho baseline on
      the same instances (prediction 2).
      STAGE 4 (minutes). Commutativity residual and end-to-end success rate
      (predictions 3-4).
      STAGE 5 (minutes). Attempt, and record the failure of, target-class
      representation over the factor base (prediction 5).
      Total: a low CPU-hour with a CAS doing binary-quadratic-form arithmetic
      and small-degree isogenies. No new infrastructure; zero runs at any
      cryptographic parameter.
    controls:
      - >-
        NULL OBJECT (matched, mandatory): a SYNTHETIC torsor -- a random simply
        transitive action of an abstract group of order #Cl_m on #Cl_m labels,
        with the same number of generators, the same walk rule and the same
        collision detection. Predicted: the same 3/4 exponent. If the real
        torsor is materially FASTER than the synthetic null, the isogeny class
        has exploitable structure the null lacks and that is a finding in its
        own right -- and a P3 event if it puts the exponent below 1/2. If
        materially SLOWER, the implementation is the bottleneck and the measured
        exponent is void.
      - >-
        PLANTED SIGNAL (two-directional, mandatory): a synthetic torsor with a
        planted short relation making the collision polylog. The instrument MUST
        find it far below the birthday bound; an instrument reporting the
        birthday bound there is blind and the whole run set is INVALID rather
        than negative.
      - >-
        BASELINE ARM: the repository's rho implementation on the same instances,
        reproduced within 20 percent of 0.886*sqrt(N), so every exponent
        comparison is anchored to a measured baseline rather than a quoted
        constant.
      - >-
        PAIR-EQUALITY CONTROL: an assertion, run on every collision, that the
        two colliding pairs agree on BOTH the curve and the point up to
        F_p-isomorphism. A collision passing the curve test and failing the
        point test must abort the run: it is the defect that would manufacture a
        false p^{1/4} exponent.
      - >-
        DECAY CONTROL: h(O). As h -> 1 the full-group and fibre-restricted walks
        must converge to the same algorithm and the same exponent 1/2. A gap
        that persists at h = 1 means the two arms are not measuring the same
        thing.
      - >-
        SUPERSINGULAR REFUSAL and NON-MAXIMAL REFUSAL: the pipeline must refuse
        both rather than emitting a number.
    required_metrics:
      - fitted collision exponent with confidence interval, real torsor
      - the same, synthetic null torsor
      - the same, planted-shortcut torsor
      - fibre-restricted exponent and rho operation counts on the same instances
      - commutativity residual count; end-to-end success rate
      - fraction of instances where a target ideal representative was produced
      - per-instance h(O), |D|, cofactor c, '#Cl_m(O)', generator count and norm bound

  controls:
    - >-
      NULL OBJECT: the synthetic random torsor of the same order. This is the
      matched null the deliverable requires.
    - >-
      PLANTED SIGNAL: the synthetic torsor with a planted short relation, as
      above -- the instrument must be shown capable of measuring a genuine
      speedup before its report of no speedup means anything.
    - >-
      DECAY PARAMETER: h(O). The gap between the full-group exponent (3/4) and
      the fibre exponent (1/2) must shrink to zero as h -> 1, because at h = 1
      the two walks are the same walk. A gap that does not decay is the
      canonical artifact tell of docs/inventor-protocol.md section 3.
    - >-
      A second, independent implementation of the walk (explicit isogeny
      formulas versus ideal-class arithmetic on binary quadratic forms composed
      with the known action) must agree on the exponent within the stated band,
      so an implementation artifact cannot be read as a cost.

  confounders:
    - >-
      PAIR-EQUALITY IMPLEMENTED AS CURVE-EQUALITY. The single most dangerous
      defect: it shrinks the effective search space from #Cl_m to h and would
      report an exponent near 1/4, i.e. a spurious speedup below the baseline.
      Guarded by the pair-equality control and pre-declared as the first
      diagnosis for any sub-1/2 measurement.
    - >-
      MEMORY, NOT TIME. The p^{3/4} figure is a step count with distinguished
      points and O(1) memory. A naive table implementation would need p^{3/4}
      memory and would be dominated even more heavily. Stated in both axes.
    - >-
      VOLCANO LEVEL. Curves at different levels have different orders and
      different h; the walk must stay on the End = O level or the search space
      is not what Lemma A computes. Stratify or the level effect is misread as a
      scaling effect.
    - >-
      SMALL-h ARTIFACTS. Below h(O) = 50 the birthday regime has not started and
      any fitted slope is noise; those instances are excluded from the fit and
      retained only for the h -> 1 decay control.
    - >-
      NON-MAXIMAL ORDERS and NON-CYCLIC E(F_p): out of scope, refused by the
      pipeline, and named as open extensions rather than assumed through.
    - >-
      KNOWLEDGE OF End(E). Everything presumes D and its factorisation; free at
      toy scale, sub-exponential at crypto scale, charged as a separate
      precomputation and never folded into the exponent.

  falsification_conditions:
    - >-
      The measured collision exponent for Algorithm 1 converges to a value at or
      below 1/2 after the pair-equality control passes and on the synthetic null
      as well. Then the search space is not #Cl_m, Lemma A is wrong, and the
      record's headline is refuted. If the value is materially below 1/2 this is
      additionally a P3 event: FLAG AND STOP, no number is recorded, the
      Coordinator is handed the run.
    - >-
      The fibre-restricted walk fails to reproduce rho within 20 percent. The
      baseline embedding fails and no exponent in this record is interpretable.
    - >-
      A nonzero commutativity residual. The extension is not what the diagram
      says, Algorithm 1 is incorrect, and the seed's foundation is wrong too.
    - >-
      A smooth ideal representative of a target pair's class is produced by any
      method in fewer than sqrt(N) operations on any instance. Then C3's block
      is broken, the sub-exponential corner opens, and this is the single most
      consequential outcome available in this question. FLAG AND STOP.
    - >-
      The planted-shortcut control fails to fire. Instrument blind; run set
      INVALID rather than negative.

  interpretation_limits:
    - >-
      ALGORITHM 1 IS NOT AN ATTACK AND MUST NEVER BE PRESENTED AS ONE. It is
      p^{1/4} SLOWER than the incumbent. It is written down so that the fusion's
      algorithmic content can be priced rather than gestured at, and its value
      is entirely as a measured negative.
    - >-
      The enumeration in part (D) covers walks over the COMPUTABLE generating
      set. It is not a lower bound and it does not cover algorithms outside that
      family; part (E) names three specific ways out and none is closed here.
    - >-
      C3's sub-exponential conditional is a CONDITIONAL whose antecedent this
      record argues is false. It must never be quoted without its antecedent,
      and it is not a claim that any curve is at risk.
    - >-
      C2's p^{1/4} vectorization figure is [recall-confident] and NOT
      re-verified this session; it is the smaller of two terms, so the C2
      conclusion (p^{1/2} total) survives even if that figure is badly wrong --
      disclosed so a reviewer can see the conclusion does not lean on it.
    - >-
      Scoped to ORDINARY curves over F_p with O maximal, E(F_p) O-cyclic, N
      prime, toy scale (p up to about 28 bits for the exponent fits). Nothing is
      claimed about supersingular curves, non-maximal orders, extension fields,
      quantum adversaries, or any deployed curve. Quantum vectorization would
      lower only the p^{1/4} term in C2, which is already the smaller one, so
      the C2 conclusion is unchanged -- noted and not developed.

  assumptions:
    - >-
      A1. E ordinary over F_p, p > 3, End_{F_p}(E) = O maximal, N prime with
      N || #E(F_p), E(F_p) O-cyclic, G the unique order-N subgroup. Checked per
      instance.
    - >-
      A2. D and its factorisation are known to the algorithm. Without them, add
      the sub-exponential cost of factoring t^2 - 4p as a one-time
      precomputation; that variant is strictly weaker and is labelled.
    - >-
      A3. Simple transitivity of the Cl_m(O)-action on X_m, supplied by
      IDEA-20260811-9402e9 part (C) as a derivation for O maximal, itself
      resting on two [recall-confident] relayed facts.
    - >-
      A4. '[recall-confident, NOT re-verified this session] Classical ordinary
      vectorization at fixed trace costs h^{1/2} = p^{1/4} in time and memory
      (Galbraith 1999; Galbraith-Stolbunov 2013), relayed via
      IDEA-20260811-40c0b5 A3. Used only in C2 and not load-bearing there.'
    - >-
      A5. '[recall-confident, NOT re-verified this session] Sub-exponential
      L_{|D|}(1/2) computation of class-group and ray-class-group structure and
      discrete logarithms by relation-lattice methods (Hafner-McCurley;
      Buchmann; and for ray class groups the Cohen-Diaz-Olivier line). Used only
      to state the C3 conditional, whose antecedent is argued false.'

  heuristic_assumptions:
    - id: HA-1
      statement: >-
        MIXING. Random walks on X_m using the classes of split primes of norm
        below B_0 = (log |D|)^{2} together with a generating set of the kernel
        mix in O(log #Cl_m(O)) steps, uniformly over ordinary classes with
        h(O) >= 50, so that the walk's position after that many steps is
        statistically indistinguishable from uniform on X_m.
      rigorous_support: >-
        Pairs the rigorous GRH-conditional Bach bound (primes of norm below
        6 (log |D|)^2 generate Cl(O), and their classes together with a
        generating set of (O/m)^* generate the extension by exactness) with the
        classical rapid-mixing statement for Cayley graphs of abelian groups
        with expanding generator sets -- the same statement DECOMPOSITION.md's
        T5 already cites for the Cl(O)-Cayley graph, transferred to the larger
        modulus. It is a GENUINE heuristic here because the generators are a
        FIXED small-prime set rather than uniform group elements, and because
        the transfer from Cl(O) to Cl_m(O) is not established.
      validation_plan: >-
        Toy scale, with no correspondence shortcut needed since X_m is directly
        enumerable at small p: for each rung of a p-ladder at 16, 20, 24, 28
        bits with h(O) >= 50, run 10^4 walks of length L = 1, 2, 4, ...,
        4 log #Cl_m and measure the total-variation distance of the endpoint
        distribution from uniform on X_m (exactly computable where X_m is
        enumerable, estimated by a chi-squared statistic on a partition where it
        is not). Compare the decay of TV distance against the predicted
        exponential decay with the spectral gap of the chosen generator set.
        Record the p-ladder, the generator set and its norm bound, the walk
        lengths, and the sample sizes. TRANSFER ASSUMPTION, STATED AND NOT
        ESTABLISHED: nothing is transferred to crypto-sized p; the exponent
        claim is a toy-scale measurement plus an asymptotic argument, and the
        two are reported separately.
      tail_checks: >-
        Compare the slowest-mixing class in each rung (largest TV distance at
        fixed walk length) against the predicted upper quantile for its spectral
        gap, and separately report any class whose generating set fails to
        certify against the independently computed #Cl_m(O) -- those are
        excluded from the fit rather than reported as slow mixers.
    - id: HA-2
      statement: >-
        BIRTHDAY BEHAVIOUR. Given HA-1, two independent pseudorandom walks on
        X_m collide after Theta(sqrt(#X_m)) steps, with the collision-time
        distribution matching the classical birthday law for uniform sampling
        from a set of size #X_m = #Cl_m(O), uniformly for h(O) >= 50.
      rigorous_support: >-
        Pairs the rigorous birthday bound for uniform independent sampling with
        the mixing statement HA-1, exactly as the analysis of Pollard rho pairs
        the birthday bound with the assumption that the iteration function
        behaves randomly. The gap is the same gap rho's own analysis has, and it
        is named rather than hidden.
      validation_plan: >-
        For each rung, run 10^3 walk pairs and compare the empirical
        collision-time CDF against the birthday prediction for a set of the
        measured size #Cl_m(O), and against the SYNTHETIC NULL TORSOR with the
        same generator count. Report the fitted exponent with confidence
        intervals. Record the p-ladder, the sample sizes, and the fact that this
        validates the toy regime only.
      tail_checks: >-
        Compare the earliest observed collision across all samples against the
        predicted extreme-value quantile of the birthday law. A systematically
        early tail indicates non-uniform mixing (or the pair-equality defect)
        and invalidates the exponent fit rather than indicating a speedup -- and
        the pair-equality control must be re-checked before any other
        interpretation is entertained.
    - id: HA-3
      statement: >-
        SMOOTHNESS FOR RELATION COLLECTION (used ONLY in C3's statement that
        relation collection is computable, and NOT in any cost claim about
        ECDLP). For a random alpha in O of norm below X, the norm is B-smooth
        with the probability predicted by treating it as a uniformly random
        integer of its size, i.e. u^{-u(1+o(1))} with u = log X / log B.
      rigorous_support: >-
        Pairs the rigorous Canfield-Erdos-Pomerance estimate
        Psi(X, B) = X u^{-u(1+o(1))} with the classical assumption that the norm
        form's values behave like random integers of their size -- the same
        composition shape as Heuristic 1 of the exemplar in
        docs/target-result-profile.md.
      validation_plan: >-
        For 10^4 random alpha per rung across a discriminant ladder with
        h(O) in [50, 5000], factor Norm(alpha) and compare the empirical CDF of
        log(largest prime factor) against the Dickman-de Bruijn rho(u)
        prediction with u = log Norm / log B. Record the discriminant ladder and
        sample sizes, and state that this validates the toy regime only; the
        transfer to crypto-sized |D| is stated and NOT established.
      tail_checks: >-
        Compare the smoothest observed norm in each rung against the predicted
        rho(u) probability for that bound, and count the alpha whose norm has NO
        factor below B as the opposite tail. Note explicitly: even a total
        failure of HA-3 would not change any conclusion of this record, because
        C3 is blocked at the TARGET step and not at the relation step.

  reachability_gate: >-
    T5 STATUS: NOT BINDING, AND THE REASON IS THE RECORD'S OWN FINDING.
    Algorithm 1 never needs to reach a SPECIFIED curve -- it walks until two
    walks meet, which is random reachability, the easy side of T5. So T5 is not
    what stops this line; the search-space SIZE is. That is a different
    quantity from the one DECOMPOSITION.md's T5 prices, and distinguishing them
    is part of the deliverable, in the same spirit as IDEA-20260811-40c0b5's
    demotion of T5 for Direction 2.

  target_complexity:
    time_exponent: >-
      Algorithm 1: p^{3/4+o(1)} expected group/isogeny steps, conditional on
      HA-1 and HA-2. Fibre-restricted specialisation: p^{1/2+o(1)}, identical to
      rho. Two-stage specialisation (C2): max(p^{1/4}, p^{1/2}) = p^{1/2+o(1)}.
      BEST KNOWN: p^{1/2+o(1)} (0.886*sqrt(N)). SO THE PROPOSED ALGORITHM IS
      p^{1/4} WORSE AND NO SPECIALISATION IS BETTER. No exponent moves in the
      favourable direction anywhere in this record, and none is claimed to.
    memory_exponent: >-
      O(1) for Algorithm 1 with distinguished points (equal to rho's O(1)), or
      p^{3/4} for a naive table, which would be worse than BSGS's p^{1/2} as
      well. The two-stage route needs p^{1/4} memory for the vectorization
      stage, which is BSGS-comparable at that stage but is dominated by the
      p^{1/2} time of the second stage regardless. Memory is therefore never the
      binding advantage anywhere in this family.
    best_known: >-
      Parallel Pollard rho with distinguished points at 0.886*sqrt(N) group
      operations and O(1) memory (KN-TECH-001, KN-TECH-006); BSGS at sqrt(N)
      time and memory (KN-TECH-031); automorphism-discounted rho at
      0.886*sqrt(N/|Aut|) (KN-TECH-018), where sqrt(6) is baseline calibration
      and never an exponent; van Oorschot-Wiener at sqrt(N^3/w) with memory w.
      None is changed, and Algorithm 1 is dominated by all of them.
    hidden_overhead: >-
      The o(1) in p^{3/4+o(1)} hides: the Euler factor
      prod (1 - 1/Norm(q)) = 1/p^{o(1)} in #Cl_m; the ineffective Siegel
      constant in h(O) = |D|^{1/2+o(1)}; and a (log p)^{O(1)} per-step isogeny
      evaluation cost that is substantially larger than rho's per-step cost, so
      the CONCRETE gap is worse than p^{1/4} at any realistic size. Separately
      disclosed and NOT in the o(1): the sub-exponential one-time cost of
      factoring t^2 - 4p when End(E) is not given, and the class-group structure
      precomputation for the two-stage route.
    tradeoff_note: >-
      Algorithm 1 parallelises exactly as rho does (van Oorschot-Wiener
      distinguished points: n processors give a linear speedup with a shared
      table), and its time-memory curve is sqrt(#Cl_m^3/w) with memory w, i.e.
      p^{9/4}/w^{1/2} -- worse than rho's p^{3/2}/w^{1/2} at every memory
      setting. THERE IS NO MEMORY REGIME IN WHICH THIS RECORD'S ALGORITHM WINS,
      which is the single most important honesty item here and is stated so that
      no reader reconstructs a favourable corner that does not exist.

  sota_delta: >-
    Zero, and quantitatively negative for the proposed algorithm. Before:
    0.886*sqrt(N) = p^{1/2+o(1)} with O(1) memory. After: unchanged; the
    algorithm this record supplies costs p^{3/4+o(1)}, i.e. a factor p^{1/4}
    MORE. The delta is that the fusion's algorithmic content is now enumerated
    and priced rather than left as a suspicion: p^{3/4} (full torsor), p^{1/2}
    (fibre = rho), p^{1/4} but k-free (quotient), p^{1/2} (two-stage), and one
    sub-exponential corner with a named block.
  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES against every row of the
    prime-field frontier this campaign recognises. Algorithm 1 at p^{3/4} time
    and O(1) memory is dominated on TIME by: parallel rho with distinguished
    points (0.886*sqrt(N), O(1) memory, KN-TECH-001/006); automorphism-discounted
    rho (0.886*sqrt(N/|Aut|), KN-TECH-018); BSGS (sqrt(N) time, sqrt(N) memory,
    KN-TECH-031); Pollard kangaroo on an interval of width W (about 2*sqrt(W),
    where applicable); and van Oorschot-Wiener at sqrt(N^3/w) for every w >= 1.
    On MEMORY it ties rho's O(1) and beats BSGS, and that tie is worth nothing
    because it loses on time by p^{1/4}. It consumes no data and no oracle
    queries. Pareto-dominated by parallel rho on the full vector.
    dominated_by is NOT null.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.90 that the measured collision exponent lands in [0.68, 0.82], confirming
    Lemma A's search-space size; the residual mass is mostly small-h finite-size
    effects at toy scale rather than a wrong space size. 0.92 that the
    fibre-restricted arm reproduces rho within 20 percent. 0.95 that the
    commutativity residual is 0. 0.97 that no target ideal representative is
    produced on any instance (C3's block holds). Below 0.02 that any measured
    exponent lands below 1/2 after the pair-equality control passes -- and that
    is the only branch here that would move anything, which is why it is written
    as a stopping rule with the most likely implementation defect named in
    advance as the first diagnosis.

  p2_p3_flags: >-
    P2: NOT ADJACENT AS A MECHANISM, BUT FLAGGED FOR COORDINATOR ATTENTION
    BECAUSE A FACTOR BASE APPEARS. C3 discusses relation collection over a
    factor base of small-norm prime ideals in Cl_m(O). That factor base lives in
    the IDEAL world and consists of prime ideals of an imaginary quadratic
    order; it is not a factor base of points on a curve and it is not
    phi-stable in H-STR-002's sense, so nothing here bears on H-STR-002 or
    DEFER-BATCH009-001 in either direction. The flag is raised anyway, per the
    standing constraint's instruction to flag anything P2-adjacent, so the
    Coordinator rules rather than a producer.
    P3: FLAGGED AS ADJACENT AND NOT TRIGGERING. This record STATES an algorithm
    with an exponent, which makes it the most P3-sensitive record in the
    session, so the handling is spelled out: the stated exponent is 3/4, which
    is WORSE than the 1/2 baseline; the fibre and two-stage specialisations are
    EQUAL to the baseline; no specialisation is below it; and the two branches
    that could produce an excess (a measured exponent below 1/2, and a
    producible target ideal representative) are written as STOPPING CONDITIONS
    with pre-declared diagnoses, not as predictions. The record states no
    excess anywhere and contains no candidate that exceeds the
    automorphism-discounted rho baseline. sqrt(6) (KN-TECH-018) is cited as
    baseline calibration and is never used as an exponent. If either branch
    fires in an experiment, the executing session STOPS and hands it to the
    Coordinator rather than recording a number.

  novelty_status: unverified
  novelty_screen: >-
    Screened on 2026-08-11 against the committed corpus by ripgrep at snapshot
    f05894024. EXTERNAL NOVELTY IS NOT ESTABLISHED AND IS NOT CLAIMED: WebSearch
    and WebFetch failed on every call this session (Bedrock-routed inference
    profile, access denied -- the same outage disclosed for the BATCH-aeeb17
    producers and recorded as not-completable in VAL-20260811-de63ea), and the
    crypto-kb MCP index is empty. Queries over ledger/proposals/:
    "index calculus" (40+ files, ENDO-linked hits triaged);
    "simply transitive|simple transitivity|torsor" (37 files);
    "ray[- ]class" (11 files); "vectorization"; "meet-in-the-middle". FULL
    READS: IDEA-20260811-319a07 (the seed, complete -- including its
    tradeoff_note, which states the two halves' costs but composes no
    algorithm), IDEA-20260811-40c0b5 (complete -- the source of the p^{1/4}
    vectorization figure and of the elimination-cost framing),
    IDEA-20260807-8cdc79 (title and claim opening -- the PIP two-stage
    discipline, which is why C3 does not rest on "PIP is hard"),
    IDEA-20260808-5158fa (claim), RQ-RAYCL-3985f4, DECOMPOSITION.md L10/T5,
    VAL-20260811-de63ea.
    RESULT: no record in the corpus composes a birthday search on the pair
    torsor, computes its search space as h * #E, or locates the index-calculus
    block at the target-representative step. Every ingredient (rho, MITM
    vectorization, Pohlig-Hellman over an extension, relation lattices) is
    classical and none is claimed as new; only the assembly and the pricing are
    offered as a contribution against this corpus, and they may well be folklore
    in the isogeny literature. novelty_status is `unverified`, not
    `speculative`, because the external half of the screen could not run at all.
  discriminated_from: >-
    IDEA-20260811-319a07 (the seed) states in its tradeoff_note that the two
    halves of the extension cost p^{1/4} and p^{1/2} "if realised", and stops
    there. This record composes them into an actual algorithm, computes the
    FUSED search space (h * #E, which neither half's cost predicts), gets
    p^{3/4}, and shows the two-stage composition is inert at p^{1/2}. The seed's
    D5 conditional is refined here into a specific blocked step (target
    representative) rather than left as "any partial computation of psi".
    IDEA-20260811-40c0b5 prices the ELIMINATION of a granted oracle at p^{1/4}
    and concludes Direction 2 is degenerate. This record proposes no oracle at
    all: Algorithm 1 is oracle-free and its cost is a search-space computation.
    The p^{1/4} figure is borrowed from 40c0b5's A3 for C2 only, where it is the
    smaller term. Different object, different question, no overlap in claim.
    IDEA-20260807-8cdc79 establishes that in an imaginary quadratic order the
    unit rank is zero so PIP and SG-PIP coincide and both are sub-exponential,
    and warns that no L10 mechanism may rest on "PIP is hard". This record obeys
    that warning exactly: C3 does NOT claim PIP is hard -- it grants the whole
    sub-exponential machinery and blocks at the target step instead. That is the
    discipline 8cdc79 demands, applied.
    IDEA-20260808-5158fa closes the small-l character ladder in characteristic
    zero. Part (E)'s second falsifier (a computable homomorphism onto a small
    group nontrivial on the kernel) is the characteristic-p analogue of exactly
    what 5158fa closes, and IDEA-20260811-34a6d8 measures it at zero bits. The
    three records converge on the same conclusion by three independent routes,
    which is a cross-check, not a duplication.
    IDEA-20260811-25ad05 and -9402e9 (same session) supply this record's inputs:
    the public level-structure construction and simple transitivity
    respectively. This record supplies what neither can: the algorithmic
    pricing, without which the T1 verdict would be incomplete.
    IDEA-20260807-0fafe8 (Hom(Z/N, Cl(O)) = 0) and IDEA-20260807-bbdcf3 (the
    size gap h < N) both show k cannot live in the quotient. This record agrees
    and prices the quotient-only walk at p^{1/4} while noting it is k-free --
    their conclusion, restated as a cost line in the enumeration.
