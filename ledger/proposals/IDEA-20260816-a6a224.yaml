idea:
  id: IDEA-20260816-a6a224
  question_id: RQ-SIMSPK-f6a6c0
  added: '2026-08-16'
  title: 'SPECK''s rotation pair lives in a space of only n squared points, so exhaust it: score every
    (alpha, beta) by optimal rotational-XOR trail weight with the round-constant sequence first held
    as specified and then replaced by zeros and by random sequences, separating what the rotation
    pair contributes to rotational resistance from what the constant sequence contributes.'
  class: mechanism
  claim: '(A) The SPECK rotation pair is a two-dimensional integer parameter, so at word size n the
    whole space has n^2 points: 256 at n = 16 and 576 at n = 24. Unlike SIMON''s triple this space
    is small enough that exhaustion is trivial even under a generous per-point budget, which makes
    SPECK the place where a portfolio measure can be computed completely rather than sampled. (B)
    The claim is that rotational-XOR resistance is the portfolio measure most likely to be governed
    by something OTHER than the rotation pair, because rotational-XOR cryptanalysis of an ARX cipher
    is defeated primarily by the round-constant sequence breaking rotational symmetry, and a measurement
    that scores rotation pairs without varying the constants cannot tell the two apart. The specific
    move is therefore a two-factor design: score every (alpha, beta) under the specified constant
    sequence, under an all-zero sequence, and under uniformly random sequences, and report the rotation-pair
    effect, the constant-sequence effect, and their interaction as three separate quantities. (C)
    The claim is that the rotational-XOR propagation weight through modular addition is exactly computable
    and exactly verifiable, by comparison against brute-force counting at reduced word sizes, so the
    instrument can be validated before it is swept, exactly as the differential oracle must be. (D)
    The claim predicts that the constant-sequence main effect dominates the rotation-pair main effect:
    if so, then rotational-XOR reach is a poor axis on which to score rotation pairs and the campaign
    should say so rather than report a ranking; if not, the rotation pair carries genuine rotational
    structure and the ranking is meaningful. Both outcomes are usable. (E) NOT CLAIMED: any attack
    on SPECK; that the rotational-XOR weight function used is the tightest available; that the standardized
    pair is optimal or anomalous; that the all-zero-constant variant is a cipher anyone deploys, since
    it is a control object and nothing else; and no security consequence for any variant.'
  mechanism: 'STAGE A, weight function: derive the rotational-XOR propagation weight for modular addition
    at rotation offset gamma equal to 1, that is the base-two logarithm of the probability that inputs
    related by rotate-then-XOR produce outputs related the same way, as a function of the input and
    output offsets. Freeze it with a hash. STAGE B, verification: at word sizes 4, 6 and 8, count
    exactly by brute force over all input pairs for every offset triple, and compare cell by cell
    against the frozen weight function; a disagreement is a defect in the function. STAGE C, trail
    search: implement a rotational-XOR trail search over the SPECK round, which is one modular addition,
    two rotations and two XORs plus the key injection, tracking the offset triple through r rounds
    and accumulating weight, with the round-constant sequence entering as a deterministic XOR into
    the offset. Use exhaustive dynamic programming at small word sizes where the offset space fits,
    and a Matsui-style bounded search above that with every censored cell flagged. STAGE D, two-factor
    sweep: for every (alpha, beta) in the full n^2 space, compute the optimal rotational-XOR trail
    weight at each round count under three constant-sequence conditions, specified, all-zero, and
    32 random sequences, giving a factorial design whose main effects and interaction are read off
    directly. STAGE E, nulls in the same invocation: an XOR-only null in which modular addition is
    replaced by XOR, making the cipher rotation-equivariant and forcing weight exactly zero at every
    round, which is the instrument''s floor check; and a random-pair null which is trivially the whole
    space here, so the null is the exhausted space itself and the standardized pair''s rank is exact
    rather than estimated.'
  novelty_status: unverified
  novelty_screen:
    method: grep -ril SIMSPK over ledger/proposals, ledger/hypotheses and experiments; grep -ril 'rotational'
      over ledger, knowledge and experiments, with hits inspected; grep -il 'speck' over ledger/proposals/*.yaml
      with matching lines read; grep -ril 'ARX|AND-RX' over ledger/proposals and knowledge with a
      sample of hits inspected; read RQ-SIMSPK-f6a6c0, which names rotational-XOR for SPECK explicitly
      as a portfolio member; read GOAL-SIMSPK-001's completion criteria; read KN-LIT-5292.
    results: 'No proposal exists under RQ-SIMSPK-f6a6c0. The ''rotational'' hits are entirely in knowledge/literature,
      chiefly KN-LIT-6306 through KN-LIT-6311 and KN-LIT-710, none of which is a proposal or a computed
      result in this program, and no ledger proposal computes a rotational-XOR quantity. No ledger
      proposal mentions the SPECK cipher at all: the ''speck'' grep returns nothing outside the SIMSPK
      question and goal records. The ''ARX'' hits are numerous but are matched inside unrelated text
      in ECDLP and lattice proposals rather than concerning ARX ciphers. RQ-SIMSPK-f6a6c0 names rotational-XOR
      for SPECK as part of the FULL computable portfolio that, as far as this program''s corpus shows,
      prior evaluation did not cover, and GOAL-SIMSPK-001 repeats it in its objective, making this
      a directly requested extension axis with zero local coverage.'
    verdict: 'UNVERIFIED. No statement is made about what any external publication contains regarding
      rotational-XOR cryptanalysis of SPECK. Assembled from known parts: rotational-XOR differences
      and their propagation through modular addition are standard objects; verifying a probability
      formula against brute-force counting at small word sizes is standard; factorial two-factor designs
      are standard statistics. Claimed new only in combination and only locally: the exhaustive sweep
      of the entire n^2 rotation-pair space, which is complete rather than sampled, combined with
      a deliberate three-condition variation of the round-constant sequence so that the rotation-pair
      effect and the constant-sequence effect are separated rather than confounded, and with the XOR-only
      floor control that forces the instrument to report exactly zero.'
  object_first_candidate:
    tracked_object: 'The rotational-XOR difference: a pair of states (x, x'') related by x'' equal
      to (x rotated left by gamma) XOR delta, with gamma fixed at 1, so the tracked quantity is the
      offset delta together with the rotation amount. Through the SPECK round the object is the triple
      of offsets on the two branches and on the injected key, followed round by round with an accumulated
      weight.'
    lossiness: 'Genuinely lossy. Passing from the pair (x, x'') to the offset delta discards x entirely,
      collapsing 2^n pairs at a given offset onto one object; it also discards everything about the
      pair that is not captured relative to a rotation by exactly one position. The discard is compatible
      with the operations asymmetrically, which is the whole content of rotational-XOR: rotation and
      XOR act on the offset deterministically and exactly, because rotation commutes with itself and
      XOR is linear, while modular addition acts probabilistically and contributes the weight. It
      is lossy in a second, sharper sense that distinguishes it from ordinary differential: it discards
      absolute position only up to a rotation, so a constant injected into the state does NOT cancel
      the way a difference cancels a key, and the constant sequence therefore enters the propagation
      as a forced offset. That non-cancellation is precisely why the two-factor design is required
      and is what an ordinary differential object could not see.'
    propagation: One SPECK round maps (x, y) to (((x rotated right by alpha) plus y) XOR k, (y rotated
      left by beta) XOR ((x rotated right by alpha) plus y) XOR k). On offsets, the rotations act
      as exact permutations of the offset bits, the XOR with the round key contributes the key's own
      rotational-XOR offset, which the key schedule and its round constants determine, and the modular
      addition contributes a probabilistic transition whose weight is the frozen function of the three
      offsets involved. So one step maps an offset triple to a set of successor triples each carrying
      a weight, and the constant sequence enters as a deterministic additive term in the offset rather
      than cancelling. Over r rounds weights accumulate additively under the standard independence
      convention, which is carried as a named assumption.
    survival_score: The object survives until the accumulated optimal rotational-XOR trail weight
      exceeds the block size 2n, after which the trail is vacuous as a distinguisher. The concrete
      number is r_rx(alpha, beta; constant condition), the smallest round count at which the optimal
      weight exceeds 2n, reported per rotation pair and per constant-sequence condition. Under the
      all-zero constant condition the cipher is closer to rotation-equivariant and r_rx is expected
      to be substantially larger; the gap between the specified-constant and zero-constant values
      is the constant-sequence main effect and is the headline quantity of this contract.
  null_object_control: 'Two nulls, both executable in the same invocation. The floor null is an XOR-only
    variant in which modular addition is replaced by XOR, making the round exactly rotation-equivariant
    when constants are zero, so the optimal rotational-XOR weight must be exactly zero at every round
    count. If the instrument reports any nonzero weight there, it is manufacturing weight and the
    entire sweep is void; this is the sharpest instrument check available because the correct answer
    is an exact zero rather than a distribution. The distributional null is unusual and stronger than
    the RQ requires: because the rotation-pair space is exhausted, the standardized pair''s rank is
    computed against the complete space rather than against a random sample, so there is no sampling
    null to construct on that axis. The random-constant-set null the RQ demands is therefore relocated
    to the constant SEQUENCE: 32 uniformly random round-constant sequences of the same length and
    shape are scored identically, and the specified sequence''s position among them is the null-controlled
    quantity. For any statement about the specified sequence to mean anything, the 32 random sequences
    must show a nonzero spread of r_rx; if they do not, the measure cannot separate sequences and
    no claim about the specified one is admissible.'
  discriminated_from:
  - The differential and linear companion contracts track XOR differences and linear masks, in which
    a key XOR cancels exactly and constants are irrelevant. The rotational-XOR object does not cancel
    constants, which is why this contract has a factor those contracts do not have and cannot be regarded
    as the same measurement in different notation.
  - The SIMON-side contracts sweep a three-dimensional constant space over an AND-RX round with no
    modular addition. Here the space is two-dimensional, the nonlinearity is modular addition, and
    the weight function is a different object entirely; the two families are scored by the same portfolio
    but not by the same instrument.
  - Generic rotational cryptanalysis without the XOR offset tracks pure rotational pairs and is defeated
    outright by any nonzero constant. The XOR offset is what makes the object survive constants at
    a price, and the price as a function of the constant sequence is exactly what this contract measures.
  - 'A boomerang or differential attack on SPECK, which would be a security claim, is explicitly out
    of scope: this contract produces a trail weight as a score for a parameter and no key-recovery
    procedure, no data complexity and no attack.'
  - KN-LIT-5292 concerns SIMON and its recorded abstract mentions differential and linear content
    only; it is not a SPECK record and is cited here only as the campaign's baseline-reproduction
    obligation on the SIMON side.
  assumptions:
  - The SPECK round has the form given above with a modular addition, a right rotation by alpha, a
    left rotation by beta and a key XOR; pinned in STAGE 0 against the specification and its test
    vectors, and the RQ's refusal to restate unconfirmed constants is inherited.
  - The rotational-XOR weight function for modular addition frozen in STAGE A is correct; this is
    not assumed but verified exhaustively at word sizes 4, 6 and 8 in STAGE B.
  - Trail weights accumulate additively across rounds under the standard independence convention,
    carried as a named unverified assumption exactly as in the differential contract.
  - The rotation offset gamma is fixed at 1 throughout. Other offsets are a separate parameter this
    contract does not sweep, and every result is scoped to gamma equal to 1.
  - The key schedule's own rotational-XOR behaviour is part of the object; the three constant-sequence
    conditions are implemented by substituting the sequence inside the pinned schedule rather than
    by bypassing the schedule.
  predictions:
  - metric: optimal rotational-XOR trail weight reported by the XOR-only floor control under zero
      constants, at every round count
    direction: lower
    minimum_effect: 0
  - metric: cell-by-cell disagreements between the frozen modular-addition weight function and exhaustive
      brute-force counting at word sizes 4, 6 and 8
    direction: lower
    minimum_effect: 0
  - metric: constant-sequence main effect on r_rx, measured as mean r_rx under the all-zero sequence
      minus mean r_rx under the specified sequence, averaged over all rotation pairs
    direction: higher
    minimum_effect: 'forced sign rather than magnitude: the effect is predicted to be strictly positive,
      since zeroing the constants can only make the cipher more rotation-equivariant. A non-positive
      value would falsify the mechanism and indicate an implementation fault. No magnitude is pre-committed
      because the campaign has never measured either quantity.'
  - metric: ratio of the rotation-pair main effect to the constant-sequence main effect on r_rx
    direction: lower
    minimum_effect: 1.0
  - metric: spread of r_rx across the 32 random round-constant sequences, measured as the number of
      distinct values
    direction: higher
    minimum_effect: 2
  minimal_test:
    design: 'Fix word size n = 8, block 16 bits. The rotation-pair space is 64 points, exhausted trivially.
      The rotational-XOR offset state for a trail search at this size is 2^{16} pairs of branch offsets,
      so optimal trail weights can be computed by exhaustive dynamic programming per round with no
      censoring whatsoever, which removes the budget confound entirely. Run the full factorial: 64
      rotation pairs by 3 constant conditions, specified scaled down, all-zero, and 32 random sequences,
      by round counts 1 through 10. That is roughly 64 times 34 times 10 dynamic-programming passes
      over 2^{16} states, about 1.4 billion state updates, which is too slow in pure Python at full
      width, so the minimal design restricts the offset state to Hamming weight at most 3 on each
      branch, a declared and frozen restriction that reduces the state space to a few thousand and
      makes the whole factorial run in minutes while making every reported weight an upper bound on
      the optimum, stated as such. In the same invocation run the XOR-only floor control, which must
      report exactly zero, and the brute-force verification of the weight function at n = 4, 6 and
      8. The discriminating output is the ratio of the two main effects: a ratio well below one says
      rotational-XOR reach scores the constant sequence rather than the rotation pair, and the campaign
      should not rank rotation pairs on this axis.'
    controls:
    - XOR-only floor control with modular addition replaced by XOR and zero constants, whose optimal
      rotational-XOR weight must be exactly zero at every round.
    - Exhaustive brute-force verification of the modular-addition weight function at word sizes 4,
      6 and 8, cell by cell.
    - All-zero constant-sequence condition, which isolates what the constants contribute by removing
      them, and which is a control object rather than a cipher anyone deploys.
    - 32 uniformly random round-constant sequences establishing the spread the measure produces across
      sequences.
    - Exhaustive-versus-restricted state-space comparison at n = 6, where both fit, quantifying how
      much the frozen Hamming-weight restriction inflates the reported weights.
    required_metrics:
    - optimal rotational-XOR trail weight per (rotation pair, constant condition, round count)
    - r_rx per rotation pair per constant condition
    - weight-function disagreement count against brute force, exact integer, per word size
    - XOR-only floor control weight, which must be exactly zero
    - rotation-pair main effect, constant-sequence main effect, and their interaction on r_rx
    - number of distinct r_rx values across the 32 random constant sequences
    - inflation of reported weight caused by the Hamming-weight state restriction, measured at n =
      6
    - wall-clock seconds and peak resident memory per stage
  falsification_conditions:
  - The XOR-only floor control reporting any nonzero optimal rotational-XOR weight, which shows the
    instrument manufactures weight and voids the sweep.
  - Any cell-level disagreement between the frozen modular-addition weight function and exhaustive
    brute-force counting.
  - A non-positive constant-sequence main effect, meaning zeroing the constants did not increase rotational-XOR
    reach, which contradicts the mechanism and indicates an implementation fault.
  - Fewer than 2 distinct r_rx values across the 32 random constant sequences, which means the measure
    cannot separate sequences and no claim about the specified sequence is admissible.
  - The Hamming-weight state restriction inflating reported weights at n = 6 by more than a declared
    tolerance relative to the exhaustive computation, which invalidates the restricted results at
    larger sizes.
  - Zero variation in r_rx across the entire exhausted rotation-pair space under every constant condition,
    which means the axis cannot rank rotation pairs at all; this is a clean measured obstruction and
    is reported as such rather than as a failure.
  confounders:
  - The rotation offset gamma is fixed at 1, and rotational-XOR reach at other offsets could rank
    rotation pairs differently; every result is scoped to gamma equal to 1 and the restriction is
    named, not buried.
  - The frozen Hamming-weight restriction on the offset state makes every reported weight an upper
    bound, and constants whose best trails use high-weight offsets are systematically undervalued;
    the n = 6 exhaustive comparison measures this directly.
  - The all-zero constant condition changes the key schedule's own rotational behaviour as well as
    the state injection, so the constant-sequence main effect bundles both; a third condition with
    constants zeroed only in the state injection is run at n = 6 to separate them where budget allows.
  - Scaling the specified constant sequence down to toy word sizes requires a rule, and a poor rule
    could make the specified condition artificially strong or weak; the scaling rule is frozen before
    the sweep and the specified condition is reported alongside the 32 random ones so its position
    is visible.
  - Additive composition of weights across rounds is a convention, not a measurement, and a rotation-pair
    ranking that depends on it inherits that dependence.
  interpretation_limits:
  - Every reported weight under the restricted state space is an upper bound on the optimum, so r_rx
    is a lower bound on rotational-XOR reach and may not be quoted as the reach.
  - A rotational-XOR trail of length r is not an attack on r rounds and implies no key-recovery cost,
    data complexity or security statement about any SPECK variant.
  - 'The all-zero-constant object is a control, not a cipher: no statement about it may be read as
    a statement about any deployed variant.'
  - All results are scoped to gamma equal to 1, to the tested word sizes, to the pinned round and
    key schedule, and to the frozen state restriction. Nothing about designer intent follows in either
    direction.
  - A finding that the constant sequence dominates the rotation pair is a statement about this measure's
    sensitivity, not about which design choice matters for security.
  target_complexity:
    time_exponent: 'No attack exponent is claimed. Instrument cost: exhaustive dynamic programming
      over the offset state costs O(r 2^{2n}) per (pair, condition), which is 2^{12} at n = 6 and
      2^{16} at n = 8; under the frozen Hamming-weight-3 restriction the state space is O(n^6) rather
      than 2^{2n}, which is what makes the full factorial affordable.'
    memory_exponent: No attack memory exponent is claimed. The exhaustive arm holds one weight vector
      over the offset state, 4096 entries at n = 6 and 65536 at n = 8, under one mebibyte; the restricted
      arm holds a few thousand entries.
    best_known: 'The incumbent inside this campaign is nothing: no rotational-XOR quantity for any
      SPECK parameter exists in this corpus, and RQ-SIMSPK-f6a6c0 lists rotational-XOR for SPECK as
      part of the portfolio prior evaluation did not cover as far as the corpus shows. In general
      practice the incumbent instrument is MILP or SAT-based rotational-XOR trail search, which is
      unavailable in this environment; the dynamic-programming and restricted-search engine is used
      instead and its limitation is reported.'
    hidden_overhead: 'Hidden in the lower-order terms: scaling the specified round-constant sequence
      to toy word sizes requires a rule that has no canonical form, and the choice quietly determines
      how the specified condition compares to the random ones; freezing the rule in advance and reporting
      the specified sequence inside the random ensemble rather than against it is what keeps this
      honest. Hidden in the human cost: resisting the reading of a large constant-sequence effect
      as a statement about design quality, which it is not.'
  dominated_by: 'n/a (no result claimed). Pareto check performed across time, memory and data/queries:
    no attack, distinguisher-based procedure or query-bounded algorithm is produced, so no frontier
    row exists on any axis. Among instruments, exhaustive dynamic programming dominates the restricted
    search on tightness at every word size where the offset state fits in memory, roughly n <= 8 here,
    and is dominated by it on reach above that; the crossover and the measured inflation from restriction
    are both reported.'
  sota_delta: no attack; conceptual/measurement contribution only. The quantitative deliverables are
    the exact zero required of the XOR-only floor control, the exact integer disagreement count of
    the frozen weight function against brute force, the complete r_rx table over the exhausted n^2
    rotation-pair space under three constant conditions, and the ratio of the rotation-pair main effect
    to the constant-sequence main effect, which is the number that decides whether this axis can rank
    rotation pairs at all.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: 'Part (A), that the SPECK rotation-pair space is small enough to exhaust:
    0.98, it is n^2 by construction. Part (B), that the constant sequence is a genuine confounder
    for this measure and must be varied: 0.85, since the rotational-XOR object does not cancel injected
    constants the way a difference cancels a key, which is an algebraic property of the object rather
    than an empirical guess. Part (C), that the frozen modular-addition weight function matches brute
    force exactly on the first attempt: 0.5, this is the usual first-attempt risk and a mismatch is
    cheap and informative. Part (D), that the constant-sequence main effect exceeds the rotation-pair
    main effect: 0.6, which is the substantive prediction and the one worth being wrong about, since
    a rotation-pair effect that dominates would make this axis a genuinely useful score. That the
    rotation-pair space shows any variation in r_rx at all under the specified constants: 0.55, and
    a flat result would be a clean measured obstruction that removes this axis from the portfolio
    with a number attached.'
