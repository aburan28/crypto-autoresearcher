idea:
  id: IDEA-20260809-666d3d
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-CSIDH-64343f
  goal_id: GOAL-CSIDH-001
  title: >-
    Build the reversible group-action circuit and count it — the one input every
    disputing model multiplies by, and the one nobody disputes
  class: measurement
  claim: >-
    Every quantum cost estimate for CSIDH multiplies an oracle-query count by the
    cost of evaluating the class group action reversibly. The claim is that this
    per-query cost can be constructed and counted here as a classical
    reversible-circuit problem, validated by simulating the circuit against a
    direct implementation of the action at small parameters, and that owning this
    number lets this program compare the disputing models without adopting either
    side's figure for it.
  mechanism: >-
    Implement the isogeny evaluation as a reversible circuit with explicit
    uncomputation, parameterized by the prime set and the exponent bounds; count
    gates by traversal; simulate against a direct classical implementation at
    small parameters to confirm correctness and reversibility.
  why_not_a_renamed_known_approach: >-
    Concrete reversible costs for this action have been published, and this record
    does not claim the construction. It claims an INDEPENDENT count with an
    executable validation, which is what makes the later model comparison
    neutral rather than dependent on one paper's input.
  predictions:
  - observable: gate count versus parameter size, with gate set declared
    metric: counts at several parameter sizes
    predicted: Follows the construction's structure; a count that does not scale as the construction implies indicates a bug in traversal or in uncomputation.
  - observable: simulation agreement with the direct implementation
    metric: fraction of random inputs matching
    predicted: One. Anything less invalidates the count.
  minimal_test: >-
    Construct and count at three small parameter sizes, simulate on at least five
    hundred random inputs per size, and report counts with the gate set and memory
    model named.
  controls:
  - 'REVERSIBILITY CHECK: ancilla must be returned clean, verified by simulation; dirty ancilla would understate the cost dramatically and is the classic failure mode here.'
  - 'DIRECT-IMPLEMENTATION CONTROL: the classical action implementation is validated against known small-parameter results before it is used as ground truth.'
  falsification_conditions:
  - Simulation disagreement at any size.
  - Ancilla cannot be uncomputed within the constructed circuit, in which case the count is not a valid input to any fault-tolerant estimate and the record says so.
  interpretation_limits: >-
    A gate count is not a security level. It is one factor in models this program
    does not adjudicate, and no verdict on CSIDH follows from it.
  sota_delta: 'No verdict. Delta: an independently owned and validated per-query cost.'
  dominated_by: Externally dominated by published concrete-cost work, stated plainly; not dominated by any corpus record.
  estimated_cost: Implementation medium to high; compute low.
  recommended_priority: high
  novelty_status: known
  novelty_screen: 'Corpus grep for CSIDH / group action: no records; the isogeny goals concern the non-commutative setting. WEB NOT CHECKED.'
  source_refs:
  - CSIDH specification and published quantum-circuit costings -- RECALLED, REQUIRED READS.
