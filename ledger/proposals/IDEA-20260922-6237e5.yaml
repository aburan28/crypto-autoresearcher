      any test runs, and the explicit, non-hand-waved replay-cost accounting.

  citations:
    - ref: KN-LIT-661e97
      provenance: internal
      claim: >-
        The seed scheme (Q XOR sum c_i sigma^i(P)), the iteration function
        P_{i+1} = sigma^j(P_i) XOR P_i with j = ((HW(x_{P_i})/2) mod 8) + 3,
        the distinguished-point cutoff HW(x_{P_i}) <= 34 in type-2 normal
        basis, "about 2^25.27 iterations" per DP, "about 2^35.63" expected
        DPs at completion, and the measured progress table (2^58.3 iterations,
        ~2^33.1 DPs, 16.5-17.0% of budget, by 2011-08-22, with no later public
        figure found).
      verified_by: idea-generator, this session, record read in full.
    - ref: KN-LIT-096
      provenance: internal
      claim: The 2^60.9-iteration rho baseline this record's "budget" figures are taken against.
      verified_by: idea-generator, this session, cited via KN-LIT-661e97's own text, which the record read in full.
    - ref: >-
        Standard result on the correlation (or absence of correlation)
        between a bit-representation Hamming-weight filter and algebraic
        root structure of a low-degree polynomial over the same field
      provenance: recalled
      claim: >-
        RECALLED, NOT RETRIEVED. No specific citation exists for this claim;
        it is the STATED, FALSIFIABLE PREDICTION (H_null) of this record,
        not an imported result. Flagged so a reviewer does not mistake the
        prediction for an established fact.
      verified_by: null

  citation_note: >-
    No web search was run this session. The prediction (H_null) is this
    record's own, stated as a prediction to be tested, not attributed to any
    source.

  assumptions:
    - >-
      A toy-scale replica can reproduce the SHAPE of the Bailey protocol
      (Frobenius-power walk step, a Hamming-weight-based distinguished-point
      cutoff in an analogous normal-basis representation) at a field size
      where both the walk and a Semaev relation search complete quickly; the
      SPECIFIC cutoff HW<=34 and the specific DP density 2^-25.27 are
      n=131-specific and are NOT reproduced numerically, only the mechanism
      (a Hamming-weight cutoff chosen to give a comparable DP density
      relative to sqrt(group order) at the toy field size).
    - >-
      OFF-LIMITS COMPONENT DECLARED: F1 (walk-collision, i.e. rho itself) is
      the SOURCE of the DP pool and is used exactly as published, unmodified,
      as a data-generation step, never as the tracked attack object of this
      record; F2 (factor-base decomposition) is the relation-search family
      applied to that data, exactly as filed elsewhere in this program.
    - >-
      The replay cost for recovering a contributing DP's walk coefficients is
      charged at the SAME per-iteration cost the original walk to that DP
      took (the paper's own 2^25.27-iteration average), not assumed cheap;
      this record does not claim replay is a shortcut.

  proof_search_map:
    bottleneck: >-
      Whether the Semaev-relation rate measured on a DP pool differs from
      the rate measured on a size-matched uniform random pool, at toy scale,
      by more than sampling noise. This is directly measurable by running
      the SAME, already-filed F2 relation search on two differently-sourced
      input sets and comparing yield with a standard two-sample test.
    baseline_embedding:
      parameter_slice: >-
        The uniform-random-pool arm IS the baseline: it is exactly what
        every other F2 line in this program already uses when it samples a
        factor base, with no walk, no DP filter, no Frobenius-power
        structure. Reproducing that baseline's own relation-yield rate (as
        already measured or measurable by any existing F2 instrument at the
        same toy field size and arity) is the parameter slice this record's
        control arm must match exactly, by construction, since it uses the
        identical sampling procedure.
      reproduction_check: >-
        At the smallest executable cell (e.g. n=17 or n=23, m=2), the
        uniform-random arm's relation-yield rate must match, within sampling
        error, whatever rate any prior F2 instrument in this program has
        already measured or would predict from the standard
        |F|^m/(m! * group_size) heuristic used throughout this corpus (e.g.
        as recomputed in IDEA-20260916-3f7a1c's claim D); a mismatch flags an
        instrument defect before the DP arm is trusted.
    observation_collision:
      observable: >-
        Relation-yield rate (valid Semaev relations found per pool, at fixed
        m and factor-base size), measured separately on the DP-sourced pool
        and the uniform-random pool.
      distinct_preimage_search: >-
        Two toy curves could show the SAME yield-rate ratio (DP/random) for
        DIFFERENT reasons -- a genuine walk-structure correlation (H_alt) or
        an artifact of how "distinguished point" is scaled down to toy size
        (a mis-tuned cutoff giving a biased DP density). The control that
        separates these: vary the toy-scale cutoff to give DP densities
        spanning an order of magnitude and check whether the yield-rate
        ratio is STABLE across that range (supporting H_alt if a real effect
        exists) or scales with the cutoff itself in a way explainable by
        density alone (supporting H_null / an artifact reading).
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          A matched-pair measurement: (DP pool, uniform pool) of equal size,
          same toy curve, same F2 relation search, same arity, run as a
          single instrumented experiment rather than two separate ones, so
          every confound (engine version, field arithmetic implementation,
          target selection) is held fixed across arms.
        predicted_gain: >-
          Removes engine/implementation confounds from the DP-vs-random
          comparison, isolating the sampling-source effect this record's
          claim is actually about.
    quantifier_order: >-
      EXISTS a toy field size and arity at which the DP-pool and
      uniform-random relation-yield rates are measured and compared; the
      record predicts (a specific, falsifiable point prediction, H_null) that
      FOR every toy cell tested, the two rates agree within sampling error.
      No claim, forall or exists, is made about n=131 itself; toy-scale
      agreement or disagreement is reported and NOT extrapolated.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At the tested toy cells, the DP-pool relation-yield rate is [equal
        to / different from] the uniform-random rate by [measured factor],
        with [statistical test] p-value [x]." It cannot certify anything
        about n=131 (no transfer claimed), about arities m>3 (untested), or
        about whether a REAL hybrid campaign's replay overhead would make any
        measured enrichment practically useful (a separate cost question,
        addressed only by the explicit replay-cost accounting in the claim,
        not by a new measurement here).
      nearby_object_control: >-
        A THIRD pool, drawn from points satisfying the SAME Hamming-weight
        cutoff but generated by DIRECT UNIFORM SAMPLING WITH REJECTION
        (rather than by a Frobenius-power random walk), isolates whether any
        measured effect comes from the Hamming-weight filter alone (which
        this third arm shares with the real DP pool) or from the WALK
        STRUCTURE specifically (which only the real DP pool has). This is the
        control that distinguishes "the filter matters" from "the walk
        matters", a distinction H_alt as stated does not itself resolve.
    proof_obligations:
      - claim: The toy replica's walk step and DP cutoff reproduce the MECHANISM (not the numeric constants) of KN-LIT-661e97's Section 3.
        responsibility: baseline
      - claim: The uniform-random control arm's relation-yield rate matches this program's existing |F|^m/(m!*group_size) heuristic within sampling error.
        responsibility: baseline
      - claim: Every counted relation, in every arm, is independently re-verified by direct curve arithmetic.
        responsibility: correctness
      - claim: Replay cost for a contributing DP is charged at the measured per-iteration cost of the walk that produced it, not assumed free.
        responsibility: runtime
      - claim: The Hamming-weight-filter-only control arm (rejection-sampled, no walk) is reported separately from the walk-sourced DP arm.
        responsibility: scope

  predictions:
    - metric: >-
        relation-yield rate ratio (DP-pool / uniform-random-pool), m=2, at
        the smallest executable toy cell (n=17 or n=23)
      direction: same
      minimum_effect: >-
        Ratio within [0.7, 1.4] (predicted, H_null); a ratio outside that
        band, replicated at a second toy cell, is the surprising H_alt
        outcome and triggers the wider m=3, multi-cutoff sweep.
    - metric: >-
        relation-yield rate ratio (DP-pool / Hamming-weight-filter-only
        rejection-sampled pool), same cell
      direction: same
      minimum_effect: >-
        Ratio within [0.7, 1.4] (predicted): if the walk-sourced and
        rejection-sampled arms agree with EACH OTHER but both differ from
        the uniform-random arm, the effect (if any) is attributable to the
        Hamming-weight filter alone, not to the Frobenius-power walk step
        specifically -- a distinct, reportable outcome from H_alt as
        originally stated.
    - metric: replay cost per contributing DP, measured in iterations to reach that DP from its seed
      direction: higher
      minimum_effect: >-
        No specific value predicted (this is curve- and field-size-specific);
        reported alongside the yield-rate ratio so the two questions
        (relation-finding rate vs relation-realization cost) are never
        conflated in the record's conclusion.

  minimal_test:
    design: >-
      STAGE 0. Build a toy Koblitz-curve replica (n prime <= 41) of the
      Bailey walk: iteration function analogous to sigma^j(P_i) XOR P_i with
      j derived from a Hamming-weight statistic of x_{P_i} in a normal-basis
      representation of F_{2^n}, and a distinguished-point cutoff tuned to
      give a DP density comparable (as a fraction of sqrt(group order)) to
      the paper's own 2^-25.27-relative-to-2^65.5 figure. Verify the walk is
      deterministic from its seed (byte-identical replay) before proceeding.
      STAGE 1. Run M independent walks to collect a DP pool of size N;
      separately draw a uniform-random pool of size N (standard rejection
      sampling on the curve); separately draw a Hamming-weight-filter-only
      pool of size N (rejection sampling restricted to the same HW cutoff,
      no walk). STAGE 2. Over a fixed toy factor base, run the SAME,
      unmodified F2 Semaev relation search (m=2, then m=3) against each of
      the three pools as candidate factor-base/target material, recording
      relation count, wall time, and a certificate for every relation found.
      STAGE 3. Compare yield rates pairwise with a two-sample test (e.g.
      permutation test on relation counts); repeat at a second toy field
      size and, if resources allow, a second Hamming-weight cutoff to check
      the density-scaling control named in observation_collision. STAGE 4.
      Report replay cost separately, measured directly on the toy walks (no
      extrapolation needed at toy scale, since full walk logs are available).
    controls:
      - 'Uniform-random pool: the F2 baseline every other line in this program already uses.'
      - 'Hamming-weight-filter-only (rejection-sampled) pool: isolates the filter from the walk.'
      - 'Byte-identical replay check on every walk before any DP is trusted.'
      - 'Certificate re-verification on every counted relation, all three arms.'
      - 'A second toy field size and a second cutoff, to check the effect is not an artifact of one specific tuning.'
    required_metrics:
      - 'relation count and yield rate, per arm, per cell'
      - 'pairwise yield-rate ratios with two-sample test p-values'
      - 'replay cost distribution (iterations per contributing DP)'
      - 'certificate pass rate, all arms'

  falsification_conditions:
    - 'A replayed walk does not reproduce its recorded trail byte-for-byte: instrument defect, no DP-arm result may be reported until fixed.'
    - >-
      The uniform-random control arm''s yield rate disagrees with this
      program''s existing relation-yield heuristic by more than sampling
      error: the instrument, not the DP hypothesis, is implicated.
    - >-
      A yield-rate ratio outside [0.7, 1.4] observed at one toy cell but not
      replicated at a second, independently seeded toy cell of the same
      size: reported as noise, not as H_alt.

  confounders:
    - >-
      Toy-scale Hamming-weight cutoffs necessarily differ in absolute value
      from n=131's HW<=34; only the RELATIVE DP density is matched, and any
      effect found could in principle be an artifact of that scaling rather
      than a property that would transfer to n=131 -- explicitly not claimed
      to transfer.
    - >-
      Walk collisions (two walks merging before reaching a DP) are a known
      feature of rho and would deplete the effective pool size; the toy
      replica must record and report the collision rate so pool-size
      comparisons across arms are apples to apples.
    - >-
      The Frobenius-power step (sigma^j) itself introduces algebraic
      structure related to the SAME Frobenius orbits RQ-FROB-7d8dd4 studies;
      any measured H_alt effect should be checked against whether it is
      simply the Frobenius-orbit reduction already known and priced
      elsewhere in this program, restated as a DP-pool artifact, rather than
      a genuinely new correlation -- Stage 3's Hamming-weight-only control
      arm is designed to catch exactly this.

  interpretation_limits:
    - >-
      A toy-scale, null-controlled MEASUREMENT of a composition idea. No
      attack on ECC2K-130 itself; no claim about n=131 unless and until a
      toy-scale H_alt result motivates a scaled, still-arithmetic-only,
      extrapolation exercise.
    - >-
      Even under H_alt, the best-case outcome is a CONSTANT-FACTOR
      relation-supply bonus on top of ordinary F2 relation collection, priced
      against the SAME rho baseline (2^60.9) every other line in this lane
      uses; it does not, on its own, change any exponent.
    - >-
      Says nothing about whether the ORIGINAL Bailey et al. campaign's
      private (s,h) tables could ever be obtained or matched (KN-LIT-661e97
      states they cannot be); this record only asks whether a FUTURE
      campaign's own byproduct would be worth composing with relation-finding.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Null-object prediction, H_null.) The Hamming-weight-in-normal-basis
        statistic of a field element and its status as a root of a fixed
        low-degree Semaev summation polynomial are asymptotically independent
        random variables under the curve's own point distribution, so a
        DP-filtered sample and a uniform sample have the same expected
        relation-yield rate.
      rigorous_support: >-
        No rigorous bound; this imitates the general expectation that a
        bit-representation statistic (Hamming weight in a fixed basis) and an
        algebraic (field-arithmetic) property are unrelated absent a specific
        structural reason to think otherwise -- a generic-independence
        heuristic, not a proved theorem, stated as a heuristic for exactly
        that reason.
      validation_plan: >-
        SAMPLE - the toy DP, uniform, and filter-only pools described above,
        >= 200 relation-search attempts per arm per cell. COMPARISON -
        pairwise yield-rate ratios via permutation test. TAIL - the largest
        observed ratio across all tested cells and cutoffs. SAMPLED
        PARAMETERS RECORDED - field size, cutoff, pool size, seed. TRANSFER -
        explicitly none to n=131; a toy-only reading, stated in
        interpretation_limits.

  heuristic_note: >-
    The single heuristic (H1) IS the record's central prediction (H_null),
    stated as a heuristic rather than a fact because it has not been tested;
    the record is designed so its own falsification (a measured H_alt
    outcome) is the more valuable and more surprising result, per the Idea
    Generator's quality bar.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS CLAIMED. Best case under H_alt is a constant-factor
      relation-supply bonus, explicitly disclosed as not exponent-moving;
      worst case (and predicted) is H_null, a null result with no cost
      implication at all beyond the bookkeeping convenience of reusing
      already-computed DPs.
    memory_exponent: >-
      Unchanged from ordinary F2 relation collection; the DP pool itself is
      already stored by any rho campaign (KN-LIT-661e97 reports about 850 GB
      for the full expected DP set at n=131), so this record adds no new
      storage requirement beyond what rho already pays.
    best_known: >-
      Rho at 2^60.9 (KN-LIT-096); the only completed measurement of partial
      progress toward it is KN-LIT-661e97's 2^58.3 iterations, ~16.5-17.0% of
      budget, as of 2011-08, with no later public figure.
    hidden_overhead: >-
      The replay cost for recovering walk coefficients on any DP that
      contributes to a found relation, charged explicitly and NOT assumed
      free, at the paper's own ~2^25.27-iterations-per-DP figure (toy-scale
      analogue measured directly in the minimal_test).
    tradeoff_note: >-
      A hybrid campaign trades storage (the DP pool, already paid for by
      rho) for relation-search compute (the F2 search over that pool);
      whether that tradeoff is favorable depends entirely on whether H_alt
      holds, which is exactly what this record tests.

  estimated_cost:
    implementation: medium
    compute: low
    qualification: >-
      Reuses this program's existing F2 relation-search machinery and any
      existing rho instrument; the new components are the toy walk/DP
      replica builder and the three-arm comparison harness. Toy-scale (n<=41)
      throughout; hours, not the multi-year scale of the real campaign.

  asymptotic_claim:
    problem: ECDLP on ECC2K-130 (index-calculus reachability, RQ-BINSTD-b6f698)
    prior_best: Pollard rho with Frobenius and negation speedups, 2^60.9 iterations (KN-LIT-096); 2^58.3 iterations actually completed publicly (KN-LIT-661e97)
    time_exponent: not_applicable (measurement/composition, no exponent claimed; best case constant factor)
    memory_exponent: not_applicable
    hidden_cofactor: none beyond the explicitly charged replay cost
    claim_kind: composition_measurement

  dominated_by: >-
    n/a (no attack claimed). As a measurement: no prior record in this
    program's corpus composes rho's own distinguished-point byproduct with
    F2 relation-finding for any curve; not dominated on that specific
    composition. Against rho itself on any cost axis: n/a, since this record
    proposes no change to rho's own cost, only a possible SUPPLEMENT to it.

  sota_delta:
    time: >-
      n/a under the predicted (H_null) outcome; at most an unquantified
      constant factor under H_alt, to be measured, not asserted, if the toy
      test finds it.
    memory: n/a; reuses storage rho already pays for.
    data_queries: >-
      Against this program's prior state: the first record to propose
      testing whether an EXISTING, already-published rho campaign's
      distinguished-point protocol correlates with algebraic decomposability,
      using the campaign's own documented walk design (KN-LIT-661e97) rather
      than a generic sampling assumption.

  frontier_check:
    status: pending
    note: >-
      No web search was run this session. Whether the correlation (or lack
      thereof) between distinguished-point selection criteria and algebraic
      relation structure has been studied elsewhere in the rho/index-calculus
      literature was not checked.

  recommended_priority: low
  priority_rationale: >-
    The predicted, a-priori more likely outcome (H_null) has no cost
    implication at all; even the surprising outcome (H_alt) is disclosed as
