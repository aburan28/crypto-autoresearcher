idea:
  id: IDEA-20260922-6237e5
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-22'
  status: proposed
  approved_by: null
  title: >-
    COMPOSING THE UNFINISHED CAMPAIGN'S OWN BYPRODUCT WITH RELATION-FINDING:
    does the HW(x)<=34 distinguished-point filter Bailey et al. already ran
    (2^58.3 of 2^60.9 iterations, ~2^33 collected points, KN-LIT-661e97)
    correlate with Semaev-polynomial decomposability, or is a rho campaign's
    DP pool relation-neutral -- a toy-scale replica test, null-controlled
    against a uniform random pool of the same size

  class: composition

  claim: >-
    KN-LIT-661e97 is the ONLY completed public measurement of how far a
    relation-free (pure rho) attack on ECC2K-130 has gotten: about 2^58.3 of
    the 2^60.9-iteration budget (16.5-17.0%), producing about 2^33.1
    distinguished points via the filter HW(x) <= 34 in a type-2 normal-basis
    representation, each reportable as a 64-bit hash of its canonical
    (Frobenius- and negation-orbit-normalized) x-coordinate plus a 64-bit
    seed. A relation-based (index-calculus) line needs a factor base and a
    relation supply; this record asks whether the SAME distinguished-point
    pool ANY rho campaign on this curve produces AS A FREE BYPRODUCT of work
    it is paying for anyway has a MEASURABLE excess or deficit, relative to a
    size-matched UNIFORM RANDOM point pool, in its rate of participating in
    low-arity Semaev-polynomial relations (m = 2, 3) over a fixed toy factor
    base -- i.e. whether a hybrid rho-plus-index-calculus campaign could
    harvest "free" algebraic relations from data the rho search already
    generates, layered on top of ordinary rho progress, rather than needing a
    freshly sampled factor base.
    TWO EXPLANATIONS THIS DISCRIMINATES. (H_null, the a-priori expected
    outcome, stated first so it cannot be read as "interesting either way"):
    the Hamming-weight-in-normal-basis selection criterion that defines a
    distinguished point is a property of one BIT-LEVEL representation of the
    field element, structurally unrelated to whether that element's
    x-coordinate satisfies a LOW-DEGREE ALGEBRAIC relation (a root of a
    Semaev summation polynomial, which is a statement about the field's
    ARITHMETIC, not its Hamming weight in any particular basis) -- so DP
    pools behave, for relation-finding purposes, like uniform random samples
    of the same size, and a hybrid campaign gets NOTHING beyond what an
    ordinary, freshly sampled factor base of equal size would already give;
    reusing rho's DP byproduct is then a bookkeeping convenience (the points
    are already computed) but not a relation-YIELD advantage. (H_alt,
    the surprising outcome, worth ruling out rather than assuming): the DP
    filter or the walk's OWN iteration structure -- P_{i+1} = sigma^j(P_i)
    XOR P_i, a Frobenius-power-based step, per KN-LIT-661e97's quoted Section
    3 -- imposes a hidden correlation with Semaev-relation membership,
    measurably raising or lowering the relation rate on the DP pool relative
    to random, in which case that difference is a real, if likely
    constant-factor, relation-supply bonus specific to THIS curve's own
    published walk design, worth quantifying rather than assuming away.
    WHAT REPLAYING A DP COSTS, STATED HONESTLY SO THE COMPOSITION IS NOT
    OVERCLAIMED. A found Semaev relation among DP x-coordinates gives a
    relation among the CURVE POINTS, but converting it into a relation among
    KNOWN SCALARS (the usual index-calculus deliverable) requires each
    contributing DP's walk coefficients (a_i, b_i), which per KN-LIT-661e97's
    own protocol are NOT reported by the client and must be recovered by
    REPLAYING that DP's deterministic 64-bit seed from its start point -- a
    cost comparable to the original walk length to that DP (average
    2^25.27 iterations, the paper's own DP-density figure), NOT free. This
    record does not claim replay is cheap; it prices it explicitly as part
    of the composition's cost and states the discriminating question as
    "is the relation-FINDING rate enriched", which is the part that could be
    free, separately from "is relation-REALIZATION (replay) cheap", which
    this record predicts is NOT free and charges at the paper's own figure.

  mechanism: >-
    OBJECT FRAME. Representation: R1, the x-coordinate of a distinguished
    point, in EXACTLY the type-2 normal-basis representation KN-LIT-661e97's
    Section 3 specifies (HW(x) <= 34 is defined in that basis, not in a
    polynomial basis; using a different basis would silently change which
    points are "distinguished" and void the comparison to the real campaign's
    filter). Operation set Sigma: translation by factor-base elements (the
    Semaev relation search, Class I partial action, F2's own declared
    component) applied to the DP POOL as if it were a factor base/target
    source, exactly as F2 is applied to any other point set; this record adds
    NO new Sigma and NO new factor-base construction -- it applies the
    EXISTING F2 relation search to a DIFFERENTLY-SOURCED input set (DPs
    instead of a freshly and uniformly sampled set) and measures whether the
    source matters.
    TRICHOTOMY. The tracked object (a Semaev relation among DP x-coordinates)
    is Class I, partial-action, identical in kind to every other F2 relation
    this program has filed; what varies is the DISTRIBUTION the input points
    are drawn from, which is a property of the SAMPLING PROCEDURE, not of the
    group action -- so this record is explicitly NOT proposing a new
    tracked object, and says so, to avoid the appearance of relabeling F2 in
    new notation.
    LOSSY-PROJECTION TEST. Not applicable in the usual sense: this record
    does not propose a projection of the group at all. It is a distributional
    question (does the source distribution of candidate points change the
    RATE at which an existing, unmodified F2 relation search succeeds), and
    the object-frame declarations above are given to place it honestly in
    the trichotomy rather than to claim a new lossy object.
    F2 DECLARATION AND KN-OPEN-020. The relation search itself is F2,
    unmodified; the "factor base" here is the DP pool (or, in the control
    arm, a uniform random pool), an EXPLICIT, finite, listed set -- this is
    the target-independent description class of KN-OPEN-020 (a set given by
    a sampling procedure, not by an implicit membership predicate or a
    target-dependent construction), and it is already inside the class this
    program's other F2 lines already use for their own factor bases, so no
    new escape is claimed.

  novelty_status: unverified

  origin:
    kind: generator_search
    date: '2026-09-22'
    scope: >-
      Generated against the BINSTD-IDEATION-BRIEF's lane-A candidate seam
      "the original computation (KN-LIT-661e97) is an UNFINISHED public
      computation with a recorded seed scheme, report format and progress.
      Is there a measurement or composition idea in the gap between how far
      it got and what a relation-based line would need?" The generator read
      KN-LIT-661e97 in full, identified the walk/DP/replay structure as the
      concrete "gap" content, and composed it with the F2 relation-search
      machinery already used elsewhere in this program, adding the
      DP-pool-versus-uniform-random discriminator and the explicit replay-cost
      accounting as the new content.
    overlap_review: >-
      Grepped ledger/proposals/ for "distinguished point", "Bailey" and
      "661e97" (24 files matched, all read against titles via the RQ-QSP and
      RQ-FROB records already opened this session, plus a direct check of the
      dedup-surface.md 164-title list, which contains no mention of
      distinguished points, walk byproducts, or the Bailey campaign by name).
      The closest filed material is KN-LIT-661e97 itself (the source this
      record composes with) and the RQ-RELN-001 family's many relation-supply
      and relation-sampling ideas (e.g. IDEA-20260906-cd7b7e "sample the
      decomposition, not the target"), none of which are scoped to ECC2K-130
      or to reusing an EXISTING, already-published rho campaign's own byproduct
      as the sampling source -- they design factor-base sampling strategies
      in the abstract, prime-field or generic-curve setting. RQ-FROB-7d8dd4
      and the QSP corpus (IDEA-20260916-3f7a1c/5c9d6e/a17f43/b84e2d,
      IDEA-20260918-6c07e1/9abf42) do not mention distinguished points or the
      Bailey campaign at all. What this record adds beyond all of the above:
      the specific composition of a NAMED, ALREADY-PUBLISHED rho campaign's
