      statement: >-
        The multiset {e1 lambda^a + e2 lambda^b : a, b < L} behaves as 2L^2
        uniform draws in F_N (coverage 1 - exp(-2L^2/N)).
      rigorous_support: >-
        additive-energy bounds for geometric progressions in F_N (Bourgain-
        Glibichuk-Konyagin, recalled and unread); imitates the birthday law
      validation_plan: >-
        exact multiplicity histogram at N = 2^20, 2^24, 2^28, 2^30 with
        L = c sqrt(N), c in {0.5, 1, 2}, vs Poisson; tail = max multiplicity;
        extrapolation to 2^52 stated as transfer only
  target_complexity:
