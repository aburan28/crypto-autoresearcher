idea:
  id: IDEA-20261015-29fdc8
  question_id: RQ-CMFB-33610e
  added: '2026-10-15'
  title: >-
    Orbit-arc factor base {R^i(x0)} under the degree-5 CM endomorphism: rank
    exactly 1, all cost moves into the decomposition search, BSGS-equivalent
    (known-negative instance of IDEA-20260807-5dfe4a, cost split priced)
  class: mechanism
  claim: >-
    (A) On pair 46, w acts on G as lambda = 2/v mod N (v*w = pi+1, pi = 1 on
    G). The x-map R of w permutes x(E(F_p)\{O}) in exactly 7 cycles of length
    (N-1)/14 (ord(lambda) = (N-1)/7 is even, so -1 is in <lambda>). (B) For an
    arc base A_L(x0) = {R^i(x0): 0 <= i < L}, log R^i(x0) = lambda^i log P0:
    relation rank <= 1; two relations fix (log P0, k), one if P0 is P or Q.
    (C) All cost is the search for T = sum_{j<=m} e_j w^{a_j} P0, a_j < L.
    Coverage needs (2L)^m/m! >= N; meet-in-the-middle costs L^{ceil(m/2)} time,
    L^{floor(m/2)} memory; best at m = 2, L ~ sqrt(N/2): time ~ sqrt(2N),
    memory ~ sqrt(N/2), i.e. BSGS with baby set {+-lambda^a} (T*M ~ N).
    (D) Arc generation costs ~12 field mults per element (deg 5/4 map, no
    sqrt) against ~80 for a lift_x: a constant that does not touch (C).
  mechanism: >-
    PAIR: representation = x-values generated as an orbit arc (orbit
    description, R3-adjacent); operation set Sigma = <w> (scalar lambda on G)
    plus translation by arc elements. TRICHOTOMY: Class I, partial-action.
    LOSSY-PROJECTION TEST against Sigma: the <w>-orbits are 7 blocks of
    G\{O} up to sign, a block system of <Sigma> (IDEA-20260901-863e36); the
    projection forgets the arc position, which w shifts deterministically
    (loss log2 7 bits, branching 0): lossy and propagating. Its price is
    that record's open number: canonicalising an orbit = a DLP in <lambda>,
    ~sqrt((N-1)/14) steps, above any saving. Delta over 5dfe4a: that record
    bounds phi-IMAGE rows and the 1/r unknown count of phi-closed bases; the
    arc is not phi-closed and sets r -> L (one unknown). The content is a
    cost relocation law: relations needed fall from ~|V| to 2, the search
    becomes sparse representation in F_N with MITM exponent 1/2.
  novelty_status: adaptation
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-IC-5931ee
      - KR-IC-b0fcda
      - KR-IC-73db3f
      - KR-RHO-fb88e6
      - KR-RHO-7d93f6
      - KR-IC-791cb7
    nearest:
      - ref: KN-FIND-b7e091
        provenance: internal
        relation: special_case
        delta: GGM closure of endomorphism oracles; adds the priced split.
      - ref: KR-IC-b0fcda
        provenance: kb
        relation: adjacent
        delta: >-
          Frobenius bases gain 1/n over F_{q^n}; on prime-order G the same
          orbit gives rank 1 and no search saving.
      - ref: KR-IC-5931ee
        provenance: kb
        relation: adjacent
        delta: naive prime-field IC costs ~N; the arc reaches N/L, never less.
      - ref: KR-RHO-fb88e6
        provenance: kb
        relation: adjacent
        delta: >-
          Negation map is the {+-P} quotient (sqrt 2); the arc is the <w>
          quotient (7 classes), canonicalised by a DLP, and its search is not
          a walk, so no fruitless cycles arise.
      - ref: KR-RHO-7d93f6
        provenance: kb
        relation: adjacent
        delta: >-
          One collision needs T^2*S = N; the arc has T^2*S = N^2/L > N, so it
          is dominated by parallel DP rho and consistent with the bound.
      - ref: KR-IC-791cb7
        provenance: kb
        relation: orthogonal
        delta: binary-field GHS walks; this record is prime-field only.
  proof_search_map:
    bottleneck: the decomposition search over the arc, not the linear algebra
    baseline_embedding:
      parameter_slice: P0 = P, m = 2 is BSGS with baby set {+-lambda^a P}
      reproduction_check: known_log base of factor_base.py (H017 control)
    observation_collision:
      observable: rank of the relation matrix over F_N
      distinct_preimage_search: arc and c*arc (random unit c) share rank 1
    method_ceiling:
      strongest_certifiable_claim: arc bases cost >= N/L at m = 2
      nearby_object_control: c arcs (rank c) interpolate to naive IC
  predictions:
    - metric: rank of arc relation matrix over F_N
      direction: lower
      minimum_effect: exactly 1 versus ~|V| for the matched random base
    - metric: number and length of R-cycles on x(E(F_p))
      direction: different
      minimum_effect: equal-length cycles, count 7 at pair 46
    - metric: MITM point-ops per relation divided by sqrt(N)
      direction: higher
      minimum_effect: at least 0.5 (below it means structure beyond BSGS)
    - metric: >-
        mutual information of the 7-valued cycle class with Legendre(x),
        x mod 3, 5, 7, and top and bottom bits of x
      direction: different
      minimum_effect: 0 within permutation-null noise (null result expected)
  minimal_test:
    design: >-
      Toy D=-19 family members, N in 2^20..2^30. Build R from the w kernel
      polynomial; check R(x(P)) = x(lambda P) (selects lambda vs 1-lambda).
      Enumerate cycles; build arcs; compute rank, coverage vs 1-exp(-2L^2/N),
      MITM ops; verify the cycle class equals the 7th-power class of k.
    controls:
      - matched random base
      - known_log base (rank 1 by construction)
      - fake endomorphism, scalar c random, same rank 1 expected
      - planted dense sub-box as instrument positive control
    required_metrics: [rank, cycles, coverage, ops per sqrt(N), class MI]
  falsification_conditions:
    - rank > 1 at prime N on any instance (claims A, B false)
    - MITM ops < 0.5 sqrt(N) on >= 3 instances (structure beyond BSGS)
    - cycle class predictable from a cheap invariant, p < 1e-4
  confounders: [lambda vs 1-lambda, sign convention, tiny-N artifacts]
  interpretation_limits: >-
    Single-arc bases only; c arcs give rank c and interpolate to naive IC.
    KN-OPEN-020 class: explicit table (memory L) or implicit-membership orbit
    (sqrt(L) per query); both charged. Silent on target-dependent bases.
    lambda = 2/v is derived from pi = vw - 1; the Executor re-checks it.
  heuristic_assumptions:
