idea:
  id: IDEA-20260809-5797e8
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ROS-595c15
  goal_id: GOAL-ROS-001
  title: >-
    Make the assumption visible: a table of which replacement's proof needs the
    algebraic group model or a one-more assumption, and how loose the reduction is
  class: measurement
  claim: >-
    "Provably secure" covers a wide range of guarantees here: reductions to plain
    discrete log, to a one-more variant, or proofs in the algebraic group model,
    and each with a tightness loss that may depend on the number of concurrent
    sessions. The claim is that extracting the assumption and the loss factor from
    each filed proof gives a table in which some deployed protocol's effective
    security degrades with concurrency in a way its quoted bit level does not
    show — and that the degradation can be stated as an explicit function.
  mechanism: >-
    For each filed proof, extract the assumption, the reduction's success
    probability and running-time relation, and the dependence on session count.
    Instantiate at the deployed group size and plot effective bits against
    concurrency.
  why_not_a_renamed_known_approach: >-
    Tightness analysis is standard in provable security. Doing it comparatively
    across the deployed alternatives, and expressing the output as effective bits
    versus concurrency at real parameters, is the contribution — and it is
    reading and arithmetic rather than compute.
  predictions:
  - observable: effective bits versus concurrent session count per protocol
    metric: curve per protocol at the deployed group size
    predicted: >-
      At least one protocol shows material degradation with concurrency. No
      degradation anywhere would be a clean and reassuring result worth recording
      plainly.
  - observable: number of protocols whose proof rests on an idealized model
    metric: count with citations
    predicted: More than one; the point is to make it visible rather than to criticize the practice.
  minimal_test: >-
    Extract and tabulate from at least three filed proofs, instantiate the loss
    functions at deployed parameters, and plot. Every entry carries the passage
    it came from, and entries that cannot be extracted are recorded as
    undetermined.
  controls:
  - 'PASSAGE CITATION: every table cell cites the specific passage; an uncited cell is undetermined by definition, because this record is entirely a claim about documents.'
  - 'INDEPENDENT EXTRACTION: at least one proof is extracted twice independently, and disagreements are resolved before recording.'
  falsification_conditions:
  - Reductions cannot be extracted in enough detail to instantiate, in which case the table reports undetermined cells rather than estimates.
  - Independent extractions disagree systematically, indicating the reading procedure is unreliable.
  interpretation_limits: >-
    A loose reduction is not an attack and no record may imply one. The table
    describes what each proof guarantees, not what an adversary can do.
  sota_delta: 'No attack. Delta: comparative tightness at real parameters, in one place, with citations.'
  dominated_by: Not dominated by any corpus record.
  estimated_cost: Acquisition-dominated; implementation and compute negligible.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for tightness / algebraic group model: no records. WEB NOT CHECKED.'
  source_refs:
  - Security proofs of the deployed two-round protocols -- RECALLED, REQUIRED READS.
