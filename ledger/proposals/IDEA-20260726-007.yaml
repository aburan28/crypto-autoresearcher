idea:
  id: IDEA-20260726-007
  title: Class-group transport — do Cl(t^2-4p) relations constrain the discrete log?
  class: mechanism
  claim: >-
    Cl(Delta), Delta = t^2 - 4p, is the only object canonically attached to a
    generic prime-field curve that is simultaneously curve-specific, of size
    h(Delta) = p^(1/2 + o(1)) matching the target exponent, and subexponentially
    computable (Hafner-McCurley / Buchmann, L(1/2)). Every other structure on
    such a curve is either exponential to compute or computable in O(log p) and
    therefore informationally free. This record asks whether any of that
    subexponential structure transports into a constraint on k, and predicts it
    does not, because of a torsor type mismatch: Cl(Delta) acts on the set of
    curves in the isogeny class, while the DLP lives in a Z/n-torsor, and the
    only bridge between them collapses by IDEA-20260726-006. The two-sided test
    discriminates between "the L(1/2) structure attached to the curve carries
    DLP-relevant information" and "it is attached to the wrong torsor and the
    channel is empty."
  mechanism: >-
    The structural reduction motivating this record: once the published
    prime-field weaknesses are excluded (smooth n, anomalous t = 1, small
    ord_n(p), small-CM/GLV, small-height model), every representation-dependent
    feature of E/F_p -- j-invariant, coefficient height, model, coordinates --
    is a choice of representative movable by F_p-isomorphism or by isogeny.
    What survives is the pair (p, t), and t enters only through O = Z[pi] and
    Delta = t^2 - 4p. So Cl(Delta) is where any remaining non-generic structure
    must live. The concrete transport candidate: a relation
    prod l_i^(e_i) = (alpha) principal in Cl(Delta) yields an explicit
    alpha = u + v*pi with norm u^2 + t*u*v + p*v^2 = prod l_i^(e_i). Applying
    the ring homomorphism of IDEA-20260726-006 to alpha and its conjugate gives
    lambda * lambda_bar == prod l_i^(e_i) (mod n) with lambda = u + v and
    lambda_bar = u + v*(t - 1). Class-group relations therefore manufacture a
    free supply of integer pairs mod n with known smooth product. The predicted
    failure has two independent grounds, and ground (ii) is the more valuable to
    record: (i) the manufactured relations live in the multiplicative group
    (Z/n)^*, whereas k lives in the additive Z/n, so there is no group in which
    to accumulate them against the target; (ii) the same pairs (u, v) are
    obtainable directly by lattice reduction on the norm form, with no class
    group computed at all, so the channel carries no information for which the
    L(1/2) computation was needed. If (ii) holds, the subexponentiality of
    Cl(Delta) is irrelevant to ECDLP by construction, which is a stronger and
    more reusable statement than (i).
  novelty_status: unverified
  assumptions:
    - >-
      E/F_p ordinary, n = #E(F_p) prime, Delta = t^2 - 4p not a perfect square,
      so O = Z[pi] is an order in an imaginary quadratic field.
    - >-
      Cl(Delta) is computable at the tested toy sizes by a standard
      imaginary-quadratic class-group algorithm, and principal-ideal generators
      alpha are recoverable explicitly, not just existentially.
    - >-
      The homomorphism O -> Z/n of IDEA-20260726-006 is correct. This record is
      logically downstream of that one; if the collapse fails, ground (i) of the
      prediction changes and this record must be re-derived.
    - >-
      "Constrains k" is operationalized as a measurable reduction in the size of
      the candidate set for k, not as an informal notion of leakage.
  predictions:
    - metric: candidate_set_size_for_k_after_harvesting_relations
      direction: different
      minimum_effect: >-
        Predicted zero shrinkage: the set of k consistent with all harvested
        class-group relations remains all of Z/n, i.e. size exactly n, for every
        tested instance. Any measured shrinkage below n is the positive signal
        and requires independent review before any attack framing.
    - metric: lattice_reduction_reproduces_alpha_without_class_group
      direction: different
      minimum_effect: >-
        >= 95% of the (u, v) pairs produced via class-group relations are also
        produced by direct lattice reduction on the norm form at comparable or
        lower cost. This is ground (ii); a low reproduction rate would mean the
        class group supplies pairs that lattice reduction does not, and the
        channel is not vacuous.
    - metric: fully_charged_cost_of_relation_supply
      direction: higher
      minimum_effect: >-
        The cost of computing Cl(Delta) and extracting generators exceeds the
        cost of obtaining the same pairs by lattice reduction. If the class-group
        route is ever cheaper, ground (ii) fails.
  minimal_test:
    design: >-
      Toy scale, 20-40 bit p where Cl(Delta) is computable exactly and k is
      recoverable by brute force for ground truth. For 6-10 curves:
      (1) compute Delta, h(Delta), and a generating set of Cl(Delta);
      (2) harvest >= 200 principal-ideal relations with explicit generators
      alpha = u + v*pi and factored norms; (3) map each to the pair
      (lambda, lambda_bar) mod n; (4) for each accumulated relation set, compute
      the exact set of k in Z/n consistent with it, by enumeration at these
      sizes, and record its size; (5) independently run lattice reduction on the
      norm form to produce (u, v) pairs of comparable norm and measure the
      overlap with the class-group-derived pairs; (6) charge both routes in
      group-operation-equivalent terms.
    controls:
      - >-
        Random-pair control: pairs (lambda, lambda_bar) drawn uniformly subject
        to the same product constraint but with no class-group provenance. The
        candidate-set-size trajectory must be indistinguishable from the real
        relations. If the real relations shrink the candidate set and random
        pairs do not, that is the positive signal.
      - >-
        Shuffled-target control: the same relation set evaluated against a k'
        drawn independently of the instance. Any apparent constraint that
        survives target shuffling is an artifact of the measurement.
      - >-
        Lattice-only ablation: produce (u, v) pairs by reduction alone, never
        computing Cl(Delta), and compare both the pair distribution and the
        candidate-set trajectory. This is the direct test of ground (ii).
      - >-
        Matched rho and BSGS group-operation counts on the same instances, so
        any claimed constraint is priced against the baseline rather than
        reported as a bare information measure.
    required_metrics:
      - size of the k-candidate set vs number of relations harvested
      - overlap fraction between class-group-derived and lattice-derived (u, v)
      - fully charged cost of each route in group-operation equivalents
      - h(Delta) and the empirical relation yield per unit cost
      - matched rho / BSGS counts on identical instances
  falsification_conditions:
    - >-
      Any measured shrinkage of the k-candidate set below n that survives both
      the random-pair and shuffled-target controls. This falsifies the barrier
      prediction and is a critical finding requiring non-originating
      independent review-xhigh before any framing as an attack.
    - >-
      Lattice reduction fails to reproduce the class-group-derived pairs at the
      >= 95% threshold, falsifying ground (ii) and leaving the channel open even
      if ground (i) holds.
    - >-
      The class-group route is measurably cheaper than lattice reduction for
      equivalent pairs, which would make the subexponential structure load-bearing.
  confounders:
    - >-
      At toy sizes h(Delta) is small and Cl(Delta) may be trivial or nearly so,
      which would make the relation supply degenerate and the null trivially
      satisfied for the wrong reason. Instances must be screened for
      h(Delta) above a floor before they count.
    - >-
      "Constrains k" measured by candidate-set size is a coarse instrument; a
      channel could carry a fractional bit that enumeration does not reveal at
      these sizes. A negative result bounds the effect at the tested resolution
      and must be reported that way.
    - >-
      Ground (i) and ground (ii) are independent; a test that only refutes one
      leaves the other standing. Both must be measured or the record's scope
      narrows accordingly.
    - >-
      Delta and n are not independent (n = p + 1 - t and Delta = t^2 - 4p share
      t), so naive randomization of one while fixing the other produces
      inconsistent instances.
  interpretation_limits:
    - >-
      Toy scale only. A null at 20-40 bits bounds the effect at that resolution
      and does not prove absence at crypto scale.
    - >-
      A confirmed null closes the class-group transport channel at tested scope;
      it does not close isogeny-based routes that act on the representation
      rather than on the point group. Those are IDEA-20260726-009 and H-ISO-001.
    - >-
      No breakthrough claim. A positive signal here would be a non-generic
      information channel, not an attack; converting it into a cost reduction
      would require a separate construction with full end-to-end charging.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
