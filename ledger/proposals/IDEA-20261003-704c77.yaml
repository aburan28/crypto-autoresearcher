        provenance: internal
        relation: adjacent
        delta: >-
          Isogenous curves being equally hard is a different
          statement. This record counts class numbers 4 and 2 and
          claims no walk.
  dominated_by: >-
    No attack is claimed. Rho dominates any attack reading of a class number.
  sota_delta:
