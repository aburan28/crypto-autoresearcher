# IDEA-20261003-704c77
# Class-number count for discriminants -55 and -51. Proposal only. Not approved.
idea:
  id: IDEA-20261003-704c77
  question_id: RQ-JINV-8fc13a
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    The class number of discriminant -55 is 4 and of discriminant -51 is 2
  class: measurement
  claim: >-
    Discriminant -55 has 4 reduced binary quadratic forms.
    Discriminant -51 has 2. Four exceeds two by 2. The product of
    the two class numbers is 8. Their sum is 6. The gap is a class
    number, not an ECDLP exponent and not an absolute discriminant.
  mechanism: >-
    OBJECT FRAME. The object is the set of reduced forms. The
    operation set is counting those forms, which is coordinate-dependent
    on the discriminant and is not a translation of a curve point.
    Discriminant -55 has the forms with coefficients 1, 1, 14 and
    2, -1, 7 and 2, 1, 7 and 4, 3, 4. Discriminant -51 has the
    forms with coefficients 1, 1, 13 and 3, 3, 5. Two copies of
    class number 2 have gap 0. No curve is enumerated.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question asks whether a small discriminant confers an
        advantage beyond the automorphism discount.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Equal hardness of isogenous curves is a different statement
        from these two class numbers.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The two discriminants are frozen before the forms are counted.
    - No curve is enumerated.
  proof_search_map:
    bottleneck: The class-number gap 2.
    baseline_embedding:
      parameter_slice: The discriminants -55 and -51 and the counts 4 and 2.
      reproduction_check: >-
        Two readers must agree that the counts are 4 and 2.
    observation_collision:
      observable: The class-number gap and the product.
      distinct_preimage_search: >-
        Reporting both class numbers as 2 drops the gap. Two copies
        of class number 2 make that gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The two discriminants.
        predicted_gain: Integer gap. No curve enumeration.
    quantifier_order: >-
      The discriminants are fixed before the forms are counted.
    method_ceiling:
      strongest_certifiable_claim: >-
        The class numbers 4 and 2. Not an absolute discriminant.
      nearby_object_control: >-
        Two copies of class number 2. The gap is 0.
    proof_obligations:
      - claim: Discriminant -55 has 4 reduced forms.
        responsibility: size
      - claim: Discriminant -51 has 2 reduced forms.
        responsibility: size
      - claim: The gap is not an absolute discriminant.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: class_number_gap
      direction: different
      minimum_effect: Four exceeds two by 2.
  minimal_test:
    design: >-
      Count the reduced forms of discriminants -55 and -51. Do not
      enumerate a curve.
    controls:
      - Two copies of class number 2, whose gap is 0.
      - An independent count.
    required_metrics:
      - both class numbers
      - the gap
      - the product
  falsification_conditions:
    - The class number of -55 is not 4.
    - The product of the two class numbers is not 8.
  confounders:
    - The absolute values 55 and 51 are not the class numbers.
  interpretation_limits:
    - A class number is not a walk length.
    - No transfer to a cryptographic discriminant.
    - This is not the class-number pair 4 and 3 of discriminants -39 and -31.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen discriminant -55 has class number 4, and the
        frozen discriminant -51 has class number 2.
      rigorous_support: >-
        No class-number theorem is re-proved here. The count is a
        reading of the reduced forms.
      validation_plan: >-
        Two independent counts of the reduced forms. A mismatch voids the gap.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: Not a memory bound.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: Forms of other discriminants are not counted.
    tradeoff_note: A larger class number is not a shorter walk.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
