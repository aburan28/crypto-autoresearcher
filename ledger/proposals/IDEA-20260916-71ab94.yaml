        KN-LIT-7604 with KN-LIT-fa346d. If new_falls(2) = 0, either the
        presentation used by the program excludes the closing equation in the
        form assumed here, or the derivation is wrong; both are reportable and
        the record commits to determining which by inspecting the builder.
    - metric: >-
        the same calculus at multiplier degree 1, dimension versus 8k - 1 at
        k = 3,4,5,6,7
      direction: different
      minimum_effect: >-
        THE PROGRAMME'S DECISION METRIC. Exact agreement at all five k derives
        KN-FIND-006's law and yields a closed form evaluable off the tested
        diagonal. Disagreement at any k means the calculus is incomplete at
        multiplier degree 1 - most likely because it omits combinations mixing
        the quadric and cubic groups - and the size and sign of the gap is the
        result, reported as such rather than fitted away.
    - metric: >-
        degeneracy dimension on the random-descent nearby object (N4)
      direction: lower
      minimum_effect: >-
        PREDICTED 0 in at least 95 of 100 draws. A generically nonzero answer
        reassigns the entire mechanism from the summation polynomial to Weil
        descent and is the single most consequential negative available here.
    - metric: >-
        claim (D): Tr(B / x^2) evaluated on point triples summing to zero
      direction: different
      minimum_effect: >-
        REPORTED AS A CONJECTURE TEST, NOT A PREDICTION OF THIS RECORD'S CORE.
        Sample 10^4 triples (P, Q, -(P+Q)) on toy binary curves and test
        whether the candidate map is additive. Additivity confirmed supports the
        identification of the morphism; additivity refuted removes claim (D)
        and leaves (A), (B), (C) and (E) intact, which is why (D) is isolated.

  minimal_test:
    design: >-
      STAGE 0 - ZERO COMPUTE, HARD GATE, half a page. Re-derive (A) line by
      line, including the two trace identities, and hand-check at n = 4 with an
      explicit F_16 basis and an explicit R_X. If the hand check disagrees,
      stop and report the derivation as false.
      STAGE 1 - ARCHIVED-ARTIFACT CHECK, MINUTES, NO NEW MATHEMATICS. Read the
      degree-3 syzygy already extracted by
      experiments/EXP-DREG-001/characterization/syzygy_degree3.py for the
      archived n = 12, 15, 18 runs and compare it to the descent dual of
      lambda = R_X^{-2} and to the closed form of P. This is the cheapest
      falsifier in the batch and it consumes no new compute at all.
      STAGE 2 - DIRECT RANK CHECK, MINUTES. For 20 random targets at each
      n in {12,15,18}, build the descended closing-equation generators, compute
      the kernel of the top-degree map by exact F_2 rank (at most 36 x 7140),
      and check dimension 1 and the witness. Include the R_X = 0 and
      2-torsion-target degenerate cells as separately reported arms.
      STAGE 3 - THE NEARBY-OBJECT CONTROLS, MINUTES. The unconstrained-x
      control (dimension must stay 1) and the random-descent control (dimension
      must be 0 in >= 95 of 100 draws).
      STAGE 4 - THE MULTIPLIER-DEGREE-1 CALCULUS, HOURS OF DERIVATION PLUS
      MINUTES OF COMPUTE. Set up the bilinear trace system for multiplier
      degree 1 over the full chain, solve it in closed form where possible and
      by exact rank otherwise, and compare the dimension to 8k - 1 at
      k = 3,4,5,6,7. The rank fallback is a matrix of at most (3n * n(t-1))
      rows by C(nb + 3, 4) columns with nb = 2n; at n = 12 that is well inside
      a laptop and at n = 21 it is the first cell that needs the memory
      envelope, so the pre-flight abort applies.
      STAGE 5 - THE MORPHISM CONJECTURE, MINUTES, ISOLATED. Test additivity of
      the candidate F_2-valued map on 10^4 point triples over several toy
      binary curves. Reported separately so a failure does not contaminate the
      rest.
      STAGE 6 - ZERO COMPUTE. Report the closed forms obtained, the cells where
      the calculus failed to close, and the explicit statement of what remains
      unattributed. An unattributed residual is recorded as unexplained, per
      RQ-DREG-bd6c86's constraint, and is not narrated into a mechanism.
    controls:
      - >-
        ARCHIVED-SYZYGY COMPARISON (blocking, zero compute): the derived
        witness must match the already-extracted one.
      - >-
        UNCONSTRAINED-x NEARBY OBJECT (blocking): dimension must remain 1, so
        the method is not secretly reading the subspace.
      - >-
        RANDOM-DESCENT NEARBY OBJECT (blocking): dimension must be 0
        generically, so the method is not detecting Weil descent per se.
      - >-
        NULL-ARM CROSS-CHECK: the T11 support-matched null has degree-3 kernel
        0 on record; the calculus applied to it must also return 0.
      - >-
        DEGENERATE-TARGET ARM: R_X = 0, 2-torsion targets, and x_t = R_X cells
        enumerated and reported separately, never averaged.
      - >-
        CROSS-INSTRUMENT CONTROL with IDEA-20260916-4b7c1e: the derived
        dimension and the meter's new_falls at the corresponding degree must
        agree; a disagreement is an instrument finding for one of the two and
        both records commit to reporting which.
    required_metrics:
      - 'degeneracy dimension per cell per multiplier degree, exact integer'
      - 'the witness lambda per cell, and its agreement with R_X^{-2}'
      - 'the extracted affine form and its agreement with Tr(u)+Tr(x_t)+Tr(B R_X^{-2})'
      - 'new_falls(2) and new_falls(3) from the companion meter, same cells'
      - 'multiplier-degree-1 dimension versus 8k - 1 at k = 3..7, with the exact gap'
      - 'nearby-object control outcomes (unconstrained-x, random-descent, null arm)'
      - 'degenerate-cell counts and their separate results'
      - 'matrix sizes, peak RSS, wall time (expected milliseconds to minutes)'

  falsification_conditions:
    - >-
      The Stage 0 hand check at n = 4 disagrees with (A). The derivation is
      false and the record is withdrawn and superseded, not patched.
    - >-
      The archived degree-3 syzygy does not equal the descent dual of
      lambda = R_X^{-2}. Either the derivation or the archived extraction is
      wrong; the record commits to determining which by hand on that cell and
      reporting it, with no edit to any prior record.
    - >-
      The measured constant-multiplier degeneracy dimension is not 1 at some
      non-degenerate cell. (A)'s uniqueness claim is false.
    - >-
      The unconstrained-x control returns a k-dependent dimension. The method
      is reading the subspace, not the algebra.
    - >-
      The random-descent control returns a generically nonzero dimension. The
      degeneracy is a property of Weil descent, the attribution to the
      summation polynomial is void, and KN-FIND-006's degree-3 mechanism must
      be re-scoped.
    - >-
      new_falls(2) = 0 on the program's actual chained system. Claim (C) does
      not apply to the presentation this program builds, and the record must
      say which presentation it does apply to before anything else is claimed.
    - >-
      The multiplier-degree-1 dimension differs from 8k - 1. The calculus is
      incomplete; the gap is reported with its sign and size, and the 8k law
      remains underived - which is the honest outcome and not a failure of the
      lane.

  confounders:
    - >-
      PRESENTATION DRIFT. The derivation assumes the closing equation is
      S_3(u, x_t, R_X) with u free. If the program's builder constrains the
      auxiliary variables, orders the chain differently, or eliminates u, the
      object is different and every number changes. KN-TECH-b18366 explicitly
      warns that constraining the u_i "is a different system with a different
      solution set, not an optimisation". The builder is READ before Stage 2,
      not assumed.
    - >-
      BASIS AND DUAL BASIS. The identification of components with Tr(lambda .)
      requires the dual basis; an implementation using the primal basis
      directly will produce a kernel vector that is the dual-basis image of
      R_X^{-2}, not its coordinate vector. This is the most likely source of a
      spurious Stage 1 mismatch and the comparison must be done in a declared
      basis with the transform applied explicitly.
    - >-
      DEGREE CONVENTION. "Degree" here is total Boolean degree after reduction
      by w^2 = w. Under a different convention the affine form P is not degree
      1 and the fall is not at D = 2. This is the true/fake first-fall-degree
      distinction of KN-OPEN-7f0511 appearing in its sharpest local form, and
      the record declares the convention per cell.
    - >-
      DIMENSION IS NOT DEFICIT. The degeneracy dimension counts available
      low-degree consequences; the Macaulay deficit counts rank shortfall
      against a semi-regular prediction. They coincide at D = max_i deg f_i
      under stated hypotheses and need not coincide above it. Any claim that
      the calculus explains deficit(D=4) must exhibit the correspondence, not
      assume it.
    - >-
      THE t = 3 SCOPE. Everything is derived at chain length 3, one quadric
      group and one cubic group. Longer chains add S_3(u_i,u_{i+1},x_{i+2})
      equations with two free blocks, whose degeneracy analysis is not done
      here and may behave differently; the record says so rather than implying
      generality.

  interpretation_limits:
    - >-
      A MECHANISM result about a degree quantity. No attack, no exponent, no
      statement about any deployed curve in either direction. Deriving 8k would
      NOT make the ECDLP easier; KN-FIND-006 already reports that the deficit
      is a vanishing fraction of a growing system and supplies no asymptotic
      leverage, and a derivation of a bounded quantity leaves that conclusion
      intact while making it checkable off the tested diagonal.
    - >-
      Scoped to characteristic 2, Boolean field equations, the chained
      presentation at t = 3, the stated variable ranges, and non-degenerate
      targets. The odd-characteristic analogue is explicitly NOT claimed; the
      identity w^2 = w that makes P(1+P) = 0 work is false there.
    - >-
      Claim (D) is a conjecture with a test and is isolated by design: the rest
      of the record stands or falls without it.
    - >-
      Claim (E) asserts the EXISTENCE OF A CALCULUS, not its answer. Quoting
      "8k is derived" before Stage 4 completes would be a claim-tier violation.
    - >-
      KN-OPEN-020 class: not applicable - no factor base is proposed.

  heuristic_assumptions:
    - id: H1
      statement: >-
        The multiplier-degree-1 degeneracy space of the full chained system is
        spanned by combinations that are separately degenerate within the
        quadric group and within the cubic group - i.e. there are no
        "cross-group" degeneracies in which a quadric contribution cancels a
        cubic contribution's top form.
      rigorous_support: >-
        The rigorous ingredient is a degree separation: the quadric group's
        generators have total degree 2 and the cubic group's have degree 3, so
        with multipliers of degree exactly 1 the top forms live in degree 3 and
        degree 4 respectively and cannot cancel each other. The assumption is
        needed only when multipliers of MIXED degree are allowed (degree 2 on
        quadrics, degree 1 on cubics), where both top forms land in degree 4.
        The classical statement imitated is the standard splitting of a graded
        syzygy module by generator degree for a system whose generators have
        distinct degrees.
      validation_plan: >-
        SAMPLE - compute the degeneracy space BOTH ways at n = 12 and n = 15:
        once with the group-separated ansatz, once with the full mixed-degree
        ansatz by exact F_2 rank on the complete multiplier space. COMPARISON -
        the two dimensions; equality validates H1 at those cells and inequality
        measures exactly what the separated calculus misses. TAIL CHECKS -
        (a) report the cross-group witnesses individually if any exist, since a
        single cross-group degeneracy would be a new mechanism and is worth
        more than the aggregate; (b) report the largest k at which the two
        computations were both affordable. SAMPLED PARAMETERS RECORDED - n, t,
        k, basis, target, degree convention. TRANSFER ASSUMPTIONS - none; H1 is
        validated per cell and never assumed at a cell where the mixed
        computation was not run.
    - id: H2
      statement: >-
        The degeneracy dimension is constant across non-degenerate targets at
        fixed (n, k): the fraction of uniformly random targets R_X for which
        the dimension differs from its modal value is below 0.01 at the tested
        cells.
      rigorous_support: >-
        Rigorous for the constant-multiplier case: (A) proves the dimension is
        exactly 1 for EVERY nonzero R_X, so the target-independence is a
        theorem there and the assumption is only about multiplier degree 1 and
        above. The classical statement imitated is constancy of a rank on a
        Zariski-open set with a proper closed degeneracy locus, here the locus
        R_X = 0 together with the 2-torsion and coincidence strata that
        KN-TECH-b18366's correctness conditions already enumerate.
      validation_plan: >-
        SAMPLE - 200 uniformly random targets at n = 12 (exhaustive over a
        stratified sample at n = 12 if affordable) and 50 at n = 15, 18.
        COMPARISON DISTRIBUTION - the empirical dimension histogram against the
        point mass at the modal value; the predicted deviant fraction is the
        density of the enumerated degenerate strata, which is computable in
        advance per cell and is recorded BEFORE sampling so the comparison can
        fail. TAIL CHECKS - (a) every deviant target is archived with its
        x-coordinate, order and 2-torsion status; (b) the deviant fraction is
        compared to the pre-computed stratum density, and an excess is reported
        as an unexplained stratum rather than absorbed. SAMPLED PARAMETERS
        RECORDED - n, k, curve coefficients, curve order, R_X, basis, seed.
        TRANSFER ASSUMPTIONS - none above the tested cells.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR MOVED, and this record is explicit that
      its best case does not move one: KN-FIND-006 already establishes on the
      numbers that the deficit is a vanishing fraction of the system, so
      DERIVING 8k confirms a bounded quantity rather than unlocking one. Its
      priority is as a BUILDING BLOCK, and the building it does is precise: a
      closed form in k is the only object that can be evaluated at
      k > ceil(n/m), the exact regime where Semaev reports the regularity
      degree exceeding the first fall degree - which is where any
      exponent-relevant effect in this lane would have to live. As a
      computation: the constant-multiplier test is a single exact F_2 rank on
      at most (n(t-1)) x C(nb+2, 3), milliseconds; the multiplier-degree-1 test
      is at most (3n * n(t-1)) x C(nb+3, 4), minutes at n <= 18.
    memory_exponent: >-
      Megabytes. No Macaulay matrix is built; the largest object is the
      top-degree monomial space, at most C(36+3,4) entries at n = 18. This
      record structurally cannot reproduce the program's 12 GiB memory wall,
      which is the point of doing the count in the trace parametrisation.
    best_known: >-
      For the quantity itself: KN-FIND-006's measured deficit series, obtained
      from full exact Macaulay ranks costing 50.4 s / 0.74 GB at n = 12 and
      404.2 s / 2.64 GB at n = 15 - this record obtains the D = 3 number in
      milliseconds from a matrix roughly four orders of magnitude smaller, and
      obtains it as a formula rather than a measurement. For the ECDLP:
      Pollard rho at 0.886*sqrt(N) group operations with O(1) memory,
      unaffected.
    hidden_overhead: >-
      Three disclosures. (1) A degeneracy count bounds the low-degree
      consequences AVAILABLE, not the ones a solver finds - nothing here
      implies F4 or XL exploits them. (2) The calculus is proved here only at
      multiplier degree 0; degree 1 is proposed and may not close, and degree 2
      is not attempted at all, so the method has an explicit horizon. (3) Claim
      (D)'s identification of the morphism rests on a `recalled` citation and
      is isolated for exactly that reason.
    tradeoff_note: >-
      Not applicable - no algorithm is proposed. The computation is trivially
      parallel over targets and cells.

  dominated_by: >-
    CHECKED ROW BY ROW. As an ATTACK: n/a - none is mounted; Pollard rho
    (N^{1/2} time, O(1) memory), BSGS (N^{1/2}, N^{1/2}), van Oorschot-Wiener
    parallel rho, multi-target sqrt(TN), the preprocessing frontier
    S*T^2 = Omega~(N), and meet-in-the-middle index calculus all dominate on
    time, memory and data; none is approached and none is affected. As an
    EXPLANATION of the degree-3 deficit: DOMINATED BY NOTHING IN THIS CORPUS -
    KN-FIND-006 exhibits the mechanism but explicitly does not derive it and
    records two refuted derivation attempts; KN-LIT-7604 states the cause in
    general terms (a group morphism to F_2) without, so far as the corpus
    record says, an explicit witness for the chained closing equation, and its
    body was not read here, so external domination is UNRESOLVED on that point
    and is the first thing a referee should check. As a MEASUREMENT: dominated
    by IDEA-20260916-4b7c1e's meter on generality (it covers every degree; this
    covers multiplier degree <= 1) and dominates it on cost and on
    interpretability at the degrees it reaches.
  sota_delta: >-
    Zero on every ECDLP cost axis. Quantified deltas against this program's
    prior state: (1) deficit(D=3) = 1 moves from MEASURED (four cells, hours of
    exact rank) to DERIVED with a closed-form witness valid for all n, k and
    non-degenerate targets, at zero compute; (2) the corpus's two
    first-fall-degree statements - Semaev's proved 4 and Kosters-Yeo's 2 - are
    reconciled by localising the degree-2 fall in the closing equation, a
    tension the corpus currently records without resolving; (3) KN-LIT-7604's
    open item, identified in the corpus as "the single highest-value item to
    confirm", gets a concrete candidate answer and a test; (4) KN-FIND-006's
    named favoured route is executed at multiplier degree 0 and specified at
    degree 1. Against the EXTERNAL state of the art the delta is unresolved and
    plausibly zero: Kosters-Yeo may well have the same witness in their body,
    which was not read, and the honest label is `unverified` for that reason.

  estimated_cost:
    implementation: low
    compute: low
    basis: >-
      Implementation LOW: Stage 1 reads an existing archived artifact; Stages
      2-3 are a kernel computation on a matrix of at most a few tens of rows;
      Stage 4 is derivation work plus one small exact rank. Compute LOW:
      milliseconds to minutes for everything except Stage 4's mixed-ansatz
      validation at n = 18, which is bounded in advance by a monomial
      pre-flight. The dominant cost of this record is HUMAN DERIVATION TIME at
      Stage 4, which is the honest place to put it.

  recommended_priority: high

  discriminated_from: >-
    KN-FIND-006 measures deficit(D=3) = 1 and exhibits the mechanism
    qualitatively; this record derives the count, gives the witness in closed
    form, and states why it cannot grow. IDEA-20260916-4b7c1e measures falls at
    every degree from ranks; this record computes one class of them in closed
    form and is a cross-check on that meter, not a substitute.
    IDEA-20260916-9d2fa6's N4 arm is used here as a nearby-object control.
    IDEA-20260808-afe4ce states a prime-field last-fall-degree FLOOR d_lf >= B
    for set-theoretic factor bases - the opposite field, the opposite direction
    of inequality, and a different quantity; it is the mirror record and not a
    competitor.

