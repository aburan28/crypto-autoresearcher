  id: IDEA-20260916-71ab94
  question_id: RQ-DREG-bd6c86
  added: '2026-09-16'
  proposed_by: idea-generator
  status: proposed
  title: >-
    THE DEGREE-3 DEFICIT OF 1 IS NOT A MEASUREMENT, IT IS A ONE-LINE TRACE
    IDENTITY WITH AN EXPLICIT WITNESS: the unique degenerate F_2-combination of
    the descended closing equation is lambda = R_X^{-2}, it produces the affine
    form P = Tr(u) + Tr(x_t) + Tr(B/R_X^2), it is the point-halving trace
    homomorphism that Kosters-Yeo call "a group morphism to F_2", and the same
    trace-parametrised degeneracy calculus at multiplier degree 1 is the
    derivation route KN-FIND-006 named for its own unexplained 8*dim(V) law
  class: mechanism

  claim: >-
    (A) THE DERIVATION, IN FULL, BECAUSE IT IS FOUR LINES. Let E/F_{2^n} be
    Y^2 + XY = X^3 + AX^2 + B, so that
    S_3(x_1,x_2,x_3) = (x_1x_2 + x_1x_3 + x_2x_3)^2 + x_1x_2x_3 + B. In the
    chained presentation the CLOSING equation is S_3(u, x_t, R_X) with u the
    last auxiliary variable ranging over all of F_{2^n}, x_t in the factor-base
    subspace V of dimension k, and R_X the target x-coordinate, R_X nonzero.
    The F_2-components of its Weil descent span exactly
    { Tr(lambda * S_3(u, x_t, R_X)) : lambda in F_{2^n} }, Tr the absolute
    trace to F_2. Using Tr(w^2) = Tr(w), hence Tr(lambda z^2) = Tr(mu z) with
    mu := lambda^{2^{n-1}} = lambda^{1/2},
        Tr(lambda S_3(u,x_t,R_X))
          = Tr(mu(u x_t + u R_X + x_t R_X)) + Tr(lambda R_X u x_t)
            + Tr(lambda B)
          = Tr((mu + lambda R_X) u x_t) + Tr(mu R_X u) + Tr(mu R_X x_t)
            + Tr(lambda B).
    The only degree-2 term is Tr((mu + lambda R_X) u x_t). It vanishes
    identically on F_{2^n} x V if and only if (mu + lambda R_X) x_t = 0 for
    every x_t in V, i.e. if and only if mu + lambda R_X = 0, i.e.
    lambda^{1/2} = lambda R_X, i.e. lambda(lambda R_X^2 + 1) = 0. THEREFORE
    THERE IS EXACTLY ONE NONZERO SOLUTION, lambda = R_X^{-2}, the degeneracy
    space is EXACTLY ONE-DIMENSIONAL, and the surviving polynomial is, with
    mu R_X = 1,
        P := Tr(u) + Tr(x_t) + Tr(B * R_X^{-2}),
    an AFFINE Boolean form. Over Boolean variables P^2 = P, so P(1 + P) = 0 is
    a relation of degree 3 among the degree-2 descended generators with degree-1
    multipliers.
    (B) WHAT THIS EXPLAINS, EXACTLY. KN-FIND-006 reports, as a MEASUREMENT,
    deficit(D=3) = 1 for every full chained system at n >= 12, with the
    exhibited mechanism "a subset-sum of descended quadrics degenerates to an
    affine form P (the quadratic parts cancel), and the multiplier is its exact
    complement, so the relation is the Boolean identity P*(1+P) = P + P^2 = 0",
    and it states that the null admits none. (A) DERIVES that measurement,
    names the subset-sum (the trace functional at lambda = R_X^{-2}), gives P
    in closed form, and explains why the count is 1 AND CANNOT GROW: it is the
    number of nonzero roots of a single F_{2^n}-equation of the form
    lambda(lambda R_X^2 + 1) = 0, which is one for every n and every k.
    (C) THE FIRST FALL DEGREE OF THE CHAINED SYSTEM IS 2, NOT 4, AND THE TWO
    STATEMENTS IN THE CORPUS ARE BOTH RIGHT. The combination in (A) has degree
    1 while the generators have degree 2, so a degree fall occurs AT D = 2 with
    constant multipliers. Semaev's proved "first fall degree 4" (KN-LIT-fa346d
    Section 4.5) is a statement about the CUBIC chain equations, where
    deg S_3 = 3 and deg(x_1 S_3) = 3; Kosters-Yeo's "first fall degree 2, much
    lower than expected, caused by the existence of a group morphism to F_2
    which gives a linear polynomial after Weil descent" (KN-LIT-7604) is a
    statement about the descent of S_3 itself. (A) shows they are compatible
    and localises the low fall in the CLOSING equation, the one whose third
    argument is specialised to the target. This is a testable reconciliation of
    two records this corpus currently holds in tension.
    (D) THE MORPHISM IS NAMED, NOT MERELY ASSERTED. P is affine in the
    descended coordinates with constant term Tr(B R_X^{-2}), and the map
    (x, y) -> Tr(B / x^2) on E(F_{2^n}) : Y^2 + XY = X^3 + AX^2 + B is the
    classical trace map used in point halving, where halvability is decided by
    a trace condition on the x-coordinate. CLAIM D is that the "group morphism
    to F_2" Kosters-Yeo invoke is this map, and that the degeneracy in (A) is
    its shadow on the closing equation. This is stated as a CONJECTURE WITH A
    CHEAP TEST (evaluate both sides on 10^4 random point pairs), not as a
    citation, because neither the Kosters-Yeo body nor a point-halving source
    was read by this session.
    (E) THE PROGRAMME, WHICH IS THE ACTUAL PROPOSAL. Generalise (A) from
    constant multipliers to multiplier degree 1 and from the closing equation
    to the full chain. A general multiplier-degree-1 combination of the
    descended generators is
        sum_r Tr(nu_r w_r) * Tr(lambda_r f_r),
    with w_r a variable of one of the blocks and f_r a chain equation, because
    every F_2-coordinate function on a block is w -> Tr(nu w). Requiring the
    top-degree part to vanish is a SYSTEM OF TRACE IDENTITIES, bilinear in
    (nu, lambda), whose solution space is computable in closed form by the same
    manipulation as (A). CLAIM E is that the dimension of that space is
    KN-FIND-006's measured 8*dim(V) - 1 at degree 4, and that the calculus
    therefore DERIVES the law the corpus currently records as "measured-exact
    over k = 3..7, NOT derived", with two mechanism hypotheses already refuted
    there (generator-level Frobenius, and alpha-orbit invariance). The record
    does NOT assert the value 8k - 1 as derived: it asserts that this is the
    calculus that can settle it, and pre-registers that a computed dimension
    other than 8k - 1 falsifies the completeness of the calculus and is the
    reportable outcome.

  mechanism: >-
    OBJECT FRAME. Representation: the Weil-descended chained Semaev system
    presented through its TRACE PARAMETRISATION - every F_2-component of every
    descended equation written as Tr(lambda * f) for lambda in F_{2^n}, and
    every coordinate multiplier written as Tr(nu * w). This is an R1-class
    representation (a field representation of the coordinates, here the dual
    basis rather than a primal one) and the attack stage it speaks to is
    RELATION DECOMPOSITION. Operation set Sigma: multiply a descended generator
    by a coordinate function and take F_2-linear combinations - the
    multiplier-degree-1 slice of the Macaulay step set - together with the
    Frobenius x -> x^2, under which the trace parametrisation is closed.
    Trichotomy class: COORDINATE-DEPENDENT, and this is the point: the whole
    object is a statement about a chosen F_2-basis and its dual, not about the
    group element.
    LOSSY-PROJECTION TEST AGAINST Sigma. The tracked object is the TOP-DEGREE
    FORM of a combination: the map that sends a polynomial to its
    highest-total-degree homogeneous part, expressed in the trace
    parametrisation as a tuple of field coefficients. It is genuinely lossy -
    every lower-degree term is discarded, so the curve constant B, the target
    R_X and the whole solution set are invisible in the image. The discard is
    Sigma-compatible in the strong sense: the top form of a product is the
    product of the top forms (multiplication by a coordinate function raises
    the top form by exactly one degree and never cancels), and the top form of
    a SUM is the sum of the top forms UNLESS they cancel - and the cancellation
    locus IS the degeneracy space this record computes. So the projection
    propagates deterministically under multiplication and branches exactly at
    the cancellations, which makes it a genuine lossy object whose branching is
    the signal rather than a nuisance. Contrast with the failure the inventor
    protocol records: (Delta, Pi) = (x + y, xy) in characteristic 2 loses
    nothing because the unordered pair is recoverable as the roots of
    t^2 + Delta t + Pi; here the top form loses B, R_X, and every solution, and
    none of them is recoverable from it.
    WHY A DERIVATION AND NOT A BIGGER MEASUREMENT. The lane's central number,
    8*dim(V), is a measured law with no derivation and two refuted mechanism
    hypotheses. Measurements extend it in k; only a derivation can say whether
    it is an identity that holds for every k (in which case the deficit is
    bounded relative to a system whose size grows like n^2, giving no
    asymptotic leverage, as KN-FIND-006 already concluded on the numbers) or the
    first two terms of something that grows faster off the tested diagonal - and
    the diagonal matters, because Semaev's own boundary is k > ceil(n/m), where
    he reports the regularity degree exceeding 4 while the first fall degree
    stays 4. A closed form in k is the only object that can be evaluated off
    the diagonal without running the diagonal's instrument there.
    WHY THIS IS CHEAP. The degeneracy space is the kernel of an explicit
    F_2-linear (for constant multipliers) or bilinear (for degree-1
    multipliers) map into the space of top-degree forms. At the generator level
    the matrix is (number of generators) x (number of top-degree monomials) -
    at n = 18, k = 6 that is 36 rows by at most C(36,3) = 7140 columns, a
    millisecond computation. NO MACAULAY MATRIX IS BUILT ANYWHERE in the
    generator-level test, which is why this record cannot reproduce the
    program's memory wall.

