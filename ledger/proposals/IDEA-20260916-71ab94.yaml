  assumptions:
    - >-
      R_X is nonzero and the closing equation is S_3(u, x_t, R_X) with u
      unconstrained in F_{2^n} and x_t in V, V a nonzero F_2-subspace. If
      R_X = 0 the equation lambda(lambda R_X^2 + 1) = 0 degenerates and the
      derivation must be redone; such targets are enumerated and reported
      separately, never averaged in.
    - >-
      The descent is by a fixed F_2-basis of F_{2^n} and the identification of
      the component span with {Tr(lambda f)} uses the non-degeneracy of the
      trace form. This is standard and is asserted per implementation, then
      checked numerically at Stage 1 by comparing the two spans as F_2-vector
      spaces.
    - >-
      Boolean variables, so w^2 = w and field equations are imposed. The affine
      form P satisfies P^2 = P for that reason and for no other; over F_q with
      q > 2 the identity fails and (B)'s degree-3 relation does not exist. The
      odd-characteristic analogue is a separate question and is not claimed.
    - >-
      2-torsion and degenerate cells: targets or factor-base elements giving
      singular fibres are enumerated, reported separately, and excluded from any
      k-law fit, following the discipline of KN-TECH-b18366's correctness
      conditions.
    - >-
      OFF-LIMITS COMPONENT DECLARED: family F2 (factor-base decomposition) is
      the underlying system. No new factor base is proposed; KN-OPEN-020 is not
      engaged.

  proof_search_map:
    bottleneck: >-
      The unexplained 8*dim(V) law. Everything downstream that wants to say
      whether the Semaev deficit is asymptotically relevant has to know whether
      8k is an identity in k (bounded relative to a system growing like n^2,
      hence no leverage) or the head of a faster-growing series off the tested
      diagonal. A closed form removes the need to measure at every cell; a
      failed derivation localises what the calculus is missing.
    baseline_embedding:
      parameter_slice: >-
        Constant multipliers, closing equation only: the calculus must return
        dimension exactly 1 with witness lambda = R_X^{-2}, reproducing
        KN-FIND-006's measured deficit(D=3) = 1 and its exhibited affine form.
        This is the exact old-method boundary and it is already computed by
        hand in claim (A).
      reproduction_check: >-
        SYMBOLIC AND AGAINST AN ARCHIVED ARTIFACT, at zero new compute. The
        archived probe experiments/EXP-DREG-001/characterization/
        syzygy_degree3.py "extracts the single degree-3 syzygy, proves it is an
        affine degeneration" and reports "null kernel 0 at every n; sem kernel
        1". Re-read its extracted coefficient vector and check it equals the
        descent dual of lambda = R_X^{-2} for that run's target, and that the
        extracted affine form equals Tr(u) + Tr(x_t) + Tr(B R_X^{-2}). This is
        a comparison against bytes already on disk and is the single cheapest
        falsifier in this batch.
    observation_collision:
      observable: >-
        The dimension of the top-degree degeneracy space and the explicit
        witness (lambda, or (nu, lambda) at multiplier degree 1).
      distinct_preimage_search: >-
        REQUIRED. Find two systems with the same degeneracy DIMENSION but
        different witnesses, and check whether the downstream Macaulay deficit
        differs. Concretely: the closing equation at target R_X versus at
        target R_X' both give dimension 1 with different lambda; if the deficit
        at D = 3 is 1 in both, the dimension is the carrying quantity and the
        witness is not, which bounds every conclusion to dimensions. A
        DIFFERENCE would mean the witness matters and the dimension alone is an
        insufficient observable - the more interesting outcome and the one the
        record commits to chasing if it occurs.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the degeneracy count from Boolean coefficient space (dimension
          n(t-1), with a rank computation per instance) into the trace
          parametrisation over F_{2^n}, where it becomes a system of equations
          in lambda and nu with a CLOSED-FORM solution set. Encoding: the
          trace form's non-degeneracy. Completeness: every F_2-component
          functional is Tr(lambda .) for a unique lambda. Soundness: the
          correspondence is an F_2-linear isomorphism, so dimensions transfer
          exactly. Transfer: STATED TO FAIL for odd q, where w^2 = w is false
          and the Frobenius identity Tr(w^2) = Tr(w) has a different form.
          Cost loss: none - the reduction is free and removes a rank
          computation.
        predicted_gain: >-
          Replaces a per-instance F_2 rank by a closed-form count valid for
          every n, k and target, which is what makes off-diagonal evaluation
          (k > ceil(n/m)) possible without running the instrument there.
      - transform: stronger_invariant
        proposed_object: >-
          Track the whole degeneracy SUBSPACE with its witnesses rather than
          its dimension, because the witness is what identifies the mechanism
          (a named group morphism) and the dimension is what the Macaulay
          deficit sees.
        predicted_gain: >-
          Attribution: each fall is traced to an explicit syzygy class -
          field-equation/Frobenius, symmetry, or summation-specific - which
          RQ-DREG-bd6c86 requires of every observed fall.
    quantifier_order: >-
      CLAIMED FOR (A): FORALL n >= 1, FORALL nonzero F_2-subspaces V of
      F_{2^n}, FORALL A, B with E non-singular, FORALL nonzero R_X, the space
      { lambda in F_{2^n} : the degree-2 part of Tr(lambda S_3(u,x_t,R_X))
      vanishes identically on F_{2^n} x V } is EXACTLY { 0, R_X^{-2} }, of
      F_2-dimension 1 as a space of functionals. The witness is given in
      advance by a formula in R_X and does not depend on n, k, V, A or B -
      that independence is the content, and the dangerous weaker reading (for
      every instance there exists some degenerate combination) is NOT claimed
      and would be nearly vacuous.
      CLAIMED FOR (E): only that the calculus is well defined and computable,
      NOT that its answer is 8k - 1. The dimension at multiplier degree 1 is an
      OUTPUT of the proposed computation, and the record pre-registers that
      disagreement with the measured 8k - 1 falsifies the calculus's
      completeness rather than the measurement.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For this presentation over F_{2^n} with Boolean field equations, the
        space of multiplier-degree-<= 1 combinations whose top-degree part
        vanishes has dimension given by the following closed formula in n, k
        and the chain length, with these explicit witnesses." It can NEVER
        certify the solving degree, the last fall degree, or any cost: a
        degeneracy count is a count of low-degree CONSEQUENCES AVAILABLE, not a
        statement that a solver finds or exploits them. It also cannot reach
        multiplier degree 2 and beyond without a genuinely harder computation,
        and the record says where it stops.
      nearby_object_control: >-
        BLOCKING, TWO OF THEM. (i) THE UNCONSTRAINED-x CONTROL: run the same
        calculus with x_t ALSO ranging over all of F_{2^n} instead of V. The
        vanishing condition becomes the same equation and the dimension must
        STILL be 1 - so if the method returns a k-dependent answer here it is
        picking up the subspace rather than the algebra and is wrong. (ii) THE
        RANDOM-DESCENT CONTROL: replace S_3 by a random F_{2^n}-polynomial of
        the same multidegree (rung N4 of IDEA-20260916-9d2fa6) and run the
        calculus. The degeneracy dimension must be 0 with overwhelming
        probability; a generically nonzero answer means the method is detecting
        Weil descent rather than the summation polynomial, and every
        attribution in (B) and (D) collapses.
    proof_obligations:
      - claim: >-
          Tr(w^2) = Tr(w) and hence Tr(lambda z^2) = Tr(lambda^{1/2} z) for the
          absolute trace to F_2.
        responsibility: correctness
      - claim: >-
          The degree-2 part of Tr(lambda S_3(u,x_t,R_X)) is
          Tr((lambda^{1/2} + lambda R_X) u x_t) and nothing else.
        responsibility: correctness
      - claim: >-
          Tr(c u x_t) vanishes on F_{2^n} x V for all u and all x_t in V if and
          only if c = 0, for V nonzero.
        responsibility: correctness
      - claim: >-
          lambda(lambda R_X^2 + 1) = 0 has exactly one nonzero root in
          F_{2^n} for R_X nonzero.
        responsibility: correctness
      - claim: >-
          The archived degree-3 syzygy of EXP-DREG-001 equals the descent dual
          of lambda = R_X^{-2} for that run's target.
        responsibility: baseline
      - claim: >-
          The multiplier-degree-1 degeneracy space is computable in closed form
          and its dimension is compared, not fitted, to 8k - 1.
        responsibility: strictness
      - claim: >-
          The random-descent nearby object returns dimension 0.
        responsibility: scope
    not_applicable_reason: null

