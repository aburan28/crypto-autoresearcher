idea:
  id: IDEA-20260809-26de01
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-NTRU-9015ee
  goal_id: GOAL-NTRU-001
  title: >-
    Measure the transition's WIDTH and how it scales — a margin quoted against a
    sharp threshold means something different from a margin against a wide one
  class: measurement
  claim: >-
    The fatigue point is quoted as a location. The claim is that the transition
    has a measurable width in log q, that the width shrinks with dimension at a
    measurable rate, and that the rate determines whether a fixed margin at
    deployed dimension is comfortable or marginal. A margin of a given size means
    something entirely different against a transition that is still wide at
    deployed n than against one that has sharpened to a step.
  mechanism: >-
    At each dimension, fit the recovery probability (and the detector statistic)
    as a function of log q with a two-parameter sigmoid; the location and the
    width are both fitted parameters with intervals. Repeat across dimensions and
    fit the width's scaling.
  why_not_a_renamed_known_approach: >-
    Fatigue work reports a location, sometimes with experimental scatter. Fitting
    the width as a first-class parameter and estimating ITS scaling is the
    proposed addition, and it changes how the deployed margin should be read.
  predictions:
  - observable: fitted transition width per dimension
    metric: width in log q with confidence interval
    predicted: Decreasing with n. A width that does not shrink would mean the transition is not sharpening and that extrapolating a location alone is meaningless.
  - observable: scaling exponent of the width
    metric: exponent with interval
    predicted: >-
      Estimable from three or more dimensions; if the intervals across dimensions
      overlap so heavily that no exponent can be fitted, that is reported instead
      of a fitted number.
  minimal_test: >-
    Three dimensions, each with a q sweep of at least eight points spanning the
    transition and twenty instances per point, sigmoid fits with intervals, and a
    scaling fit over the three widths.
  controls:
  - 'INSTANCE-COUNT CONTROL: the width estimate must be stable when instance count is doubled at one cell, or the width is measuring sampling noise.'
  - 'DETECTOR-VERSUS-RECOVERY CONTROL: widths fitted from the profile detector and from recovery must be consistent; a systematic difference indicates the detector fires on something other than the event.'
  falsification_conditions:
  - Width estimates are unstable under doubled instance counts.
  - Detector-fitted and recovery-fitted widths disagree systematically.
  interpretation_limits: >-
    Widths measured at toy dimension, extrapolated with intervals. Nothing here
    is a statement about the adequacy of any deployed margin.
  sota_delta: 'No attack. Delta: a second fitted parameter that changes the interpretation of the first.'
  dominated_by: Not dominated by any corpus record; complements IDEA-20260809-24eec3.
  estimated_cost: Implementation small; compute moderate to high because of the instance counts.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for transition width: no records. WEB NOT CHECKED.'
  source_refs:
  - NTRU fatigue-point reference -- RECALLED, REQUIRED READ.
