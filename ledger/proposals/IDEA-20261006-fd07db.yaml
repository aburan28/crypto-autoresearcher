      web: []
      blocked: []
  dominated_by: >-
    As a security claim, dominated by the question's own ceiling:
    no bit level is admissible from this record. Compared with
    KR-RHO-13bf67, KR-RHO-ea34b8, and KR-RHO-755e35, each opened
    on 2026-10-06, none of which counts ancilla qubits of a form
    composition. The absolute reversible cost of a full group
    action remains the question's oracle factor. This ratio does
    not dominate that factor, and that factor does not compute
    this ratio.
  sota_delta: >-
    Zero change to any hidden-shift exponent and zero change to
    any ECDLP exponent. The numerical output is one ratio of two
    ancilla widths, predicted at least 2.
  proof_search_map:
    not_applicable_reason: >-
      This is a finite comparison of two circuit widths at one
      discriminant. It does not propose a theorem, a bound on a
      quantum cost, a certificate beyond the two agreement checks,
      a reduction, or a closure of any cost model.
