        delta: >-
          The note counts discriminants whose class number is not
          divisible by a fixed prime l. This record outputs one
          ratio of two ancilla widths at discriminant -59. Those
          outputs are different integers. The exponent delta
          against a hidden-shift cost is zero.
      - ref: KR-RHO-ea34b8
        provenance: internal
