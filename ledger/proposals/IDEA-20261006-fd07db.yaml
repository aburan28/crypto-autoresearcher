idea:
  id: IDEA-20261006-fd07db
  question_id: RQ-CSIDH-64343f
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: coordinator
  title: >-
    Ideal-multiplication ancilla width is at least twice the
    form-composition width at discriminant -59
  class: measurement
  claim: >-
    Let F be the set of reduced positive-definite binary quadratic
    forms of discriminant -59. If F has fewer than three forms, the
    claim is false. Otherwise let P be the principal form and let A
    and B be the two lexicographically smallest forms distinct from
    P, ordered by (a, b, c) with b in (-a, a]. Encode each form as
    three signed 16-bit integers. Let Circuit-F be a reversible NCT
    circuit (NOT, CNOT, Toffoli) for Dirichlet composition of A and B
    followed by reduction. Let Circuit-I be a reversible NCT circuit
    for multiplication of the corresponding ideals in
    Z[(1+sqrt(-59))/2], followed by reduction to a reduced form. Both
    circuits are checked on the pair (A, B) and on (P, P). Ancilla
    width is the number of qubits initialized to zero that are not
    part of the input or output registers. The claim is that, when
    both circuits agree on both pairs, the ancilla width of Circuit-I
    is at least twice the ancilla width of Circuit-F. A finished
    agreement with a strictly smaller ratio is the concrete negative.
    Fewer than three forms is also a negative. This is not a count of
    invariant factors, and it states no security level.
  mechanism: >-
    The tracked object is the ancilla width of one group-law step,
    not the class group and not a Montgomery coefficient. The
    representation is a reduced form, encoded as three 16-bit
    integers. The operation set Sigma is Dirichlet composition plus
    reduction, and, separately, ideal multiplication plus reduction.
    Sigma is not elliptic translation. Class: coordinate-dependent,
    because the width is a property of a chosen circuit for Sigma,
    and two circuits for the same pair can have different widths.
    Lossy-projection test against Sigma: the product form is kept
    and the ancilla count is kept. Many circuits share a product, so
    the projection onto the product alone is lossy. The width is the
    extra datum. Two outcomes are separated before any run. A ratio
    at least 2 says the ideal circuit, under this encoding and this
    gate set, spends at least twice the clean qubits of the form
    circuit on one certified step. A ratio below 2 says that
    separation fails on this discriminant. The question asks for a
    classical reversible cost of the group action. This record
    compares two representations of one step. It does not build the
    full action oracle.
  novelty_status: unverified
  citations:
    - ref: KN-LIT-508
      provenance: kb
      claim: >-
        The note, as filed, estimates how often a prime l fails to
        divide a class number. It does not count ancilla qubits.
        Opened in this session. Not used as a width.
      verified_by: knowledge/literature/KN-LIT-508.md
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic algorithm on a prime-order group needs Omega of
        the square root of the group order. This width is not a
        generic discrete logarithm.
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
        on 2026-10-06
    - ref: >-
        Dirichlet composition of binary quadratic forms
      provenance: recalled
      claim: >-
        Gauss composition of positive-definite forms of one
        discriminant yields another form of that discriminant.
        Not opened as a primary text in this session.
      verified_by: null
  assumptions:
    - >-
      Discriminant -59 is fundamental. The form class group is the
      class group of Z[(1+sqrt(-59))/2].
    - >-
      Both circuits use the NCT gate set and the same 16-bit
      encoding. A circuit outside that gate set is not scored.
    - >-
      Ancilla qubits are those initialized to zero and not part of
      the input or output registers. Garbage qubits that are not
      returned to zero count toward the width.
    - >-
      No quantum oracle and no security level enter the claim.
  predictions:
    - metric: ratio of ideal-circuit ancilla width to form-circuit ancilla width
      direction: higher
      minimum_effect: at least 2
  minimal_test:
    design: >-
      Enumerate the reduced positive-definite forms of discriminant
      -59. If fewer than three exist, record the negative row
      too_few_forms and stop. Otherwise build both NCT circuits for
      the two named pairs, check that they return the same reduced
      form on (A, B) and on (P, P), and compare the ancilla widths.
      Score the ratio only on agreement.
    controls:
      - >-
        (P, P) composes to P in both circuits. Any other product on
        that pair is instrument_failure.
      - >-
        The same two circuit builders on discriminant -60, which is
        not fundamental, must refuse or disagree. Silent agreement
        voids the run.
      - >-
        A width that counts an input register as ancilla voids the
        run. Both widths use the definition above.
    required_metrics:
      - the cardinality of F
      - the two ancilla widths
      - the agreement bit on (A, B) and on (P, P)
      - the ratio when both bits are true
  falsification_conditions:
    - >-
      Both circuits agree on both pairs and the ideal ancilla width
      is strictly less than twice the form ancilla width. That ratio
      is the negative observation.
    - F has fewer than three forms.
    - The two circuits disagree on a pair that is then used in the ratio.
  confounders:
    - >-
      A different encoding, or a bit width other than 16, changes
      the widths. The claim is only for this encoding.
    - >-
      An unreduced intermediate that is not reduced before the
      output register is written can shrink the width by skipping
      reduction. Both circuits must output a reduced form.
    - >-
      One hand-optimized circuit against one naive circuit is a
      programmer gap. The negative still stands for the circuits
      that were written. It is not a theorem that every ideal
      circuit is wider.
  interpretation_limits:
    - >-
      The ratio is not a CSIDH-512 gate count and is not a
      Kuperberg cost.
    - >-
      A ratio below 2 closes only this discriminant, this encoding,
      and these two circuits.
    - >-
      The full group-action oracle is not built. One composition is
      not an action evaluation.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Ideal multiplication carries the coefficients of two
        Z-basis elements and a reduction, while Dirichlet
        composition carries three form coefficients and a
        reduction. Under that operation count, a reversible
        implementation that does not reuse input qubits as scratch
        needs at least twice the ancilla of the form circuit, at
        this bit width. This is a circuit-shape heuristic, not a
        theorem, and the measurement can refute it.
      rigorous_support: >-
        No theorem opened in this session forces the ancilla ratio.
        NCT universality says both maps can be made reversible.
        It does not fix the width. KR-RHO-13bf67, as read, is a
        generic-group lower bound on a different problem.
      validation_plan: >-
        The quantity sampled is the ancilla ratio on one named
        pair at discriminant -59, a complete check of that pair,
        not a random draw of circuits. The comparison is the ratio
        against 2. The tail check is whether either width exceeds
        four times the other. The parameter is discriminant -59
        and bit width 16. Transfer assumption: none. The ratio is
        not used at a 512-bit prime.
  target_complexity:
    time_exponent: >-
      unchanged. No hidden-shift exponent is stated. Generic
      discrete log in a prime-order group remains exponent 1/2
      (KR-RHO-13bf67) and is not this width.
    memory_exponent: >-
      unchanged. The output is two integers and one ratio.
    best_known: >-
      The question's own target includes a reversible gate count
      of the group action. This record does not improve a
      published quantum cost and does not replace that count.
    hidden_overhead: >-
      None in an exponent. The gap between one composition at
      discriminant -59 and a cryptographic action evaluation is
      not an o(1) term and is not claimed as one.
    tradeoff_note: >-
      The comparison is ancilla width at a fixed NCT gate set.
      It is not the l^{1/3} online tradeoff after an l^{2/3}
      table (KR-RHO-ea34b8), and that tradeoff is not evaluated.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-13bf67
      - KR-RHO-ea34b8
      - KR-RHO-755e35
    nearest:
