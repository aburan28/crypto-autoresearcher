idea:
  id: IDEA-20260811-5e4cd5
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-CANL-63098f
  goal_id: GOAL-ENDO-001
  title: >-
    THE LIFT-CHOICE FREEDOM COLLAPSES FROM h TO #div(f) BY GALOIS CONJUGACY: the
    j-invariants of one volcano level are exactly the roots mod p of ONE
    irreducible Hilbert class polynomial H_{D_0 f_E^2}, so the canonical lifts of
    same-level class members are Galois conjugates and share every Galois-stable
    global invariant -- rank, torsion, regulator, root number -- which means an
    attacker choosing which classmate to lift has 5 options on the committed
    class and not 138; and the same computation delivers, as a by-product, the
    CORRECT level instrument the campaign currently lacks
  class: mechanism

  claim: >-
    (A) THE PARTITION, EXACT AND CHEAP. For an ordinary class with
    D = D_0 f^2, the members with End_{F_p}(E) of conductor f_E are exactly the
    curves whose j-invariant is a root in F_p of the Hilbert class polynomial
    H_{D_0 f_E^2}(X), whose degree is h(D_0 f_E^2). On the committed
    p = 4001, t = 30 class those degrees are 3, 9, 18, 36, 72, summing to
    H(15104) = 138 (EV-ICINV-6b6264). The prediction is therefore fully
    determined before any computation: the five class polynomials split completely
    into distinct linear factors over F_4001, their root sets are pairwise
    disjoint, and their union is EXACTLY the committed 138-element j-set.
    (B) THE INSTRUMENT THIS DELIVERS FOR FREE, AND THE DEFECT IT REPAIRS. The
    campaign's committed volcano level was computed as a 2-torsion count and
    resolves 2 of 5 levels, which is wrong as a level instrument (and is exactly
    what IDEA-20260811-245481 predicts a 2-torsion count can do: separate the
    floor from the rest, one bit). Class-polynomial membership resolves ALL FIVE
    levels exactly, needs no isogeny walking, needs no modular polynomial, and
    produces a level label with an independently checkable certificate (the
    polynomial, its degree, and the root). This is the independent labeller that
    three other records in this session declare blocking.
    (C) THE LANE CLAIM. H_{D_0 f_E^2} is irreducible over Q (its splitting field
    is the ring class field of the order), so all h(D_0 f_E^2) curves at a level
    have Galois-conjugate CM j-invariants and their CM lifts are conjugate curves
    over the ring class field H_O, which is Galois over Q. Conjugation carries
    points to points, so the Mordell-Weil group, its rank, its torsion, the
    regulator, the root number and the order of Sha are IDENTICAL across a level.
    The lane's central free parameter -- "choose the classmate whose lift is most
    favourable" -- therefore ranges over at most #div(f) genuinely distinct
    global objects, which is p^{o(1)} by the divisor bound, and NOT over the
    h = p^{1/2+o(1)} vertices the class appears to offer.
    (D) THE CAVEAT THAT MAKES (C) A CLAIM AND NOT A FIAT. The Serre-Tate
    canonical lift of E/F_p is a specific TWIST of the CM curve with that
    j-invariant, chosen so that its reduction is E rather than a twist of E. That
    twist choice is what (C) needs to be Galois-compatible, and this record does
    NOT assume it: the experiment tests conjugate-invariance of a computable
    global invariant directly, and a failure would localise precisely in the
    twist, which would itself be a useful and previously unrecorded fact about
    this lane.
    (E) WHAT IT DOES TO THE LANE'S STANDING NEGATIVES. IDEA-20260807-6533fd
    prices any lift attack at N^{2/r} by the height budget and
    IDEA-20260807-44ba75 argues CM pins the rank in the fatal direction. Both
    treat the rank as the free parameter. (C) says the parameter has at most
    #div(f) values, so even a search over the entire class cannot buy an
    additional r, and the campaign can state the lane's ceiling as a function of
    ONE integer per level instead of an unknown distribution over 138 curves.

  mechanism: >-
    A volcano level is a torsor under the class group of one order, and the CM
    theory of that order produces exactly one irreducible polynomial whose roots
    are the level's j-invariants. Irreducibility is what forces conjugacy;
    conjugacy is what forces every Galois-stable global invariant to be constant.
    So the arithmetic that makes the level a well-defined object is the same
    arithmetic that makes the lift-choice within it vacuous.

  tracked_object: >-
    The pair (irreducible class polynomial H_{D_0 f_E^2}, the root that is
    j(E)). The curve is followed as a point of an algebraic set defined over Q,
    not as a curve over F_p.

  resource: >-
    R6 (lifts to characteristic zero) and R3 (End(E) as a ring), which is
    precisely the L9 resource pair. No point of G is touched; H-ENDO-001 is
    satisfied and the object is k-independent by construction.

  lossy_projection_test: >-
    PASSES. The projection E -> (which class polynomial has j(E) as a root)
    discards the root itself and keeps only which of five irreducible factors it
    belongs to: 72 distinct j-invariants collapse to one value. Propagation is
    exact and is the level's defining property -- horizontal isogenies of any
    degree preserve the polynomial, vertical ell-isogenies move to the neighbour
    polynomial in the ell-adic direction. Contrast the failing case: keeping the
    ROOT loses nothing and is a change of coordinates, which is why the record
    tracks membership rather than value.

  t5_reachability: >-
    Fully satisfied, and this is one of the few places in the campaign where it
    is. Level membership is locally computable at a vertex once the five class
    polynomials are known -- one polynomial evaluation per level, no walking --
    and the crater is reachable by canonical ascent in polynomial time. So if a
    level were the good stratum, it would be both cheaply detectable and cheaply
    reachable. The gate does not bind here; what binds is (C), which says the
    strata are only #div(f) in number, so the prize is at most a choice among
    five global objects.

  null_object: >-
    A set of 138 j-invariants drawn at random from F_4001 with no common trace.
    Applying the same five class polynomials to them must produce essentially no
    roots -- the expected number of hits is 138 * 138/4001 = 4.76 across all five
    polynomials combined -- so a null that lights up is an implementation error.
    Second null, for the conjugacy half: two CM curves from DIFFERENT orders (so
    not conjugate) whose global invariants must be allowed to differ; an
    instrument that reports equality there is measuring nothing.

  why_not_a_renamed_known_approach: >-
    Hilbert class polynomials and the Deuring correspondence are classical, and
    the campaign has already used the class-number chain h(-59 f'^2) =
    3, 9, 18, 36, 72 in EV-ICINV-6b6264 as a COUNTING check. What is new here is
    the operational use: turning the same chain into (i) a per-curve level
    instrument with a certificate, replacing a labeller that is known to be wrong,
    and (ii) a structural bound on the lifting lane's free parameter. The lane's
    ten committed records argue about heights, ranks, p-adic heights and class
    fields; none observes that the choice set is #div(f).

  novelty_status: adaptation
  novelty_screen: >-
    Screened this session against the RQ-CANL lane (IDEA-20260807-cfe576,
    -ee6ef7, -44ba75, -6533fd, -11b93d, -dbb250, -fd5a24, -761a8c, -13c821,
    IDEA-20260808-5158fa) and the RQ-VOLC level detectors. IDEA-20260807-a6fb2a
    uses h(disc End E) as the minimal degree of a small-coefficient annihilator
    of j, detected by LLL -- the closest prior art, and a different instrument
    (approximate, per-curve) from exact root membership. WEB SEARCH UNAVAILABLE
    this session; the CM theory cited is classical and no novelty is claimed for
    it.

  discriminated_from: >-
    NOT IDEA-20260807-a6fb2a, which detects the level by LLL on j and carries a
    named coefficient-sparsity artifact; this record computes the class
    polynomials once for the class and tests exact membership, which has no
    artifact and produces a certificate. NOT IDEA-20260807-ee6ef7, which prices
    writing the canonical lift down via H_D at |D|^{1+o(1)} time and p^{1/2+o(1)}
    space -- that cost is for the WHOLE class polynomial at crypto scale, whereas
    this record uses it at toy scale where it is free, and the crypto-scale
    refinement is IDEA-20260811-dcbea4's subject. NOT IDEA-20260807-44ba75 or
    -6533fd, whose rank and height analyses this record CONSTRAINS by bounding
    the choice set rather than repeating.

  assumptions:
  - >-
    H_{D_0 f_E^2} is irreducible over Q with splitting field the ring class field
    of the order of discriminant D_0 f_E^2, which is Galois over Q with group an
    extension of Cl(O) by Z/2 [recall-confident: classical CM theory, Cox,
    Primes of the form x^2 + n y^2; NOT re-verified this session].
  - >-
    The j-invariants of the ordinary curves over F_p with End = O are exactly the
    roots of H_{disc O} mod p, for p split appropriately -- which holds here since
    the class is nonempty and ordinary [recall-confident, Deuring].
  - >-
    Galois conjugation over H_O carries E to E^sigma with a group isomorphism on
    points, so rank, torsion and the regulator agree. THE TWIST COMPATIBILITY OF
    THE SERRE-TATE LIFT IS NOT ASSUMED; it is tested, per (D).
  - >-
    Computing H_D for |D| <= 15104 with h <= 138 is routine; the largest
    coefficients have a few thousand bits.

  proof_search_map:
    bottleneck: >-
      Whether the attacker's choice of classmate to lift ranges over h global
      objects or over #div(f). That single question decides whether the lifting
      lane has a search space at all.
    baseline_embedding:
      parameter_slice: >-
        f = 1 (a class with maximal order everywhere) reproduces the classical
        one-level case, where the choice set is trivially a single conjugacy
        class and (C) is vacuous; the committed f = 16 class is the maximal
        opposite. Both endpoints are run.
      reproduction_check: >-
        Frozen fixture: the union of the five root sets must equal the committed
        138-element j-set from class-census.json exactly, with set equality
        checked and reported. That is a reproduction of an independently
        certified artifact by an entirely different computation, which is the
        strongest cheap check available in this campaign.
    observation_collision:
      observable: >-
        The level label, and downstream the tuple of global invariants of the
        lift.
      distinct_preimage_search: >-
        By construction the observable collides h(D_0 f_E^2) ways per level. The
        informative search is for a global invariant that SEPARATES two
        same-level lifts -- which (D) says could only come from the twist -- and
        it is run explicitly on the smallest level available.
    constructive_transforms:
    - transform: stronger_invariant
      proposed_object: >-
        The class polynomial itself rather than its degree, retained because the
        polynomial carries the certificate and the degree does not.
      predicted_gain: >-
        An exact level instrument with a re-verifiable certificate, replacing one
        that resolves 2 of 5 levels.
    - transform: observable_fiber
      proposed_object: >-
        The fibre of the level map, with the twist as the forgotten structure,
        which is exactly where (D) says a separation could hide.
      predicted_gain: >-
        Either a clean closure of the lift-choice question or the identification
        of the twist as the lane's only remaining free parameter -- both are
        useful and neither is an attack.
    quantifier_order: >-
      For every ordinary class and every level, there EXISTS one irreducible
      polynomial whose roots mod p are exactly that level's j-invariants
      (existence, with the witness depending only on D_0 and f_E, not on the
      curve). For all pairs of same-level members, all Galois-stable global
      invariants of their CM lifts agree -- universal, and the quantifier that
      needs care is "Galois-stable", which excludes twist-dependent quantities
      and is why (D) exists.
    method_ceiling:
      strongest_certifiable_claim: >-
        That the lift-choice set has at most #div(f) elements up to Galois
        conjugacy, and that level membership is exactly computable. It cannot
        certify anything about the SIZE of the height budget, which is
        IDEA-20260807-6533fd's subject, and it cannot certify that any lift is
        useful.
      nearby_object_control: >-
        A pair of curves from two DIFFERENT levels, where the conclusion must
        FAIL: their lifts are not conjugate and their global invariants are free
        to differ. An instrument reporting equality across levels has not
        identified the load-bearing structure.
    proof_obligations:
    - claim: The five root sets partition the committed 138 j-invariants.
      responsibility: correctness
    - claim: H_{D_0 f_E^2} is irreducible over Q.
      responsibility: correctness
    - claim: Galois-stable global invariants agree across a level.
      responsibility: strictness
    - claim: The Serre-Tate twist choice is Galois-compatible.
      responsibility: scope
    not_applicable_reason: null

  predictions:
  - metric: partition_of_the_138_j_invariants_by_class_polynomial_root_sets
    direction: different
    minimum_effect: >-
      EXACT set equality with the committed j-set, with block sizes exactly
      3, 9, 18, 36, 72 and pairwise disjoint root sets. Any j not covered, any j
      covered twice, or any block of the wrong size falsifies (A) and, since (A)
      is classical CM theory, points at an implementation error before it points
      at mathematics.
  - metric: agreement_between_class_polynomial_levels_and_velu_walked_levels
    direction: different
    minimum_effect: >-
      138 of 138. Disagreement identifies which labeller is wrong, and the
      class-polynomial one carries a certificate while the walk does not.
  - metric: number_of_distinct_global_invariant_tuples_per_level
    direction: different
    minimum_effect: >-
      EXACTLY ONE per level, for rank, torsion order and root number, on the
      small-h test family. Two distinct tuples inside a level falsifies (C) and
      localises the failure in the twist, per (D).
  - metric: agreement_of_the_2_torsion_labeller_with_the_true_level
    direction: different
    minimum_effect: >-
      Exactly 2 of 5 levels resolved, matching the committed defect and
      confirming the diagnosis of IDEA-20260811-245481 that a 2-torsion count
      carries exactly one bit here. Any other figure means the committed defect
      has been mischaracterised.

  minimal_test:
    design: >-
      STAGE 1, minutes, decisive: compute H_{-59}, H_{-236}, H_{-944}, H_{-3776},
      H_{-15104}; factor each over F_4001; verify complete splitting, disjoint
      root sets, block sizes 3/9/18/36/72, and set equality of the union with the
      committed 138-element j-set. Cross-check the level labels against an
      independent Velu 2-isogeny walk on at least 20 members, and against the
      committed 2-torsion labeller to quantify its one-bit resolution. STAGE 2,
      the conjugacy arm, run on a SMALL-h family chosen for feasibility rather
      than on p = 4001: pick D_0 with h(D_0) = 1 (for instance -7, -11, -19) and
      a small conductor, so that the crater lift is a curve over Q and the level
      above it lives over a small-degree ring class field, and compute rank,
      torsion and root number for every member of each level, checking
      level-constancy. Report any within-level disagreement with the twist data
      attached.
    controls:
    - >-
      RANDOM-j NULL: 138 random j-invariants, on which the class polynomials must
      have essentially no roots (expected 4.76 hits total).
    - >-
      CROSS-LEVEL CONTROL: invariants must be ALLOWED to differ across levels and
      must be checked to actually differ somewhere, otherwise the instrument is
      constant for a trivial reason.
    - >-
      TWO INDEPENDENT class-polynomial computations (for instance a complex
      analytic evaluation and a CRT-based method) agreeing on every coefficient,
      since a wrong H_D would produce a beautifully consistent and entirely
      false partition.
    - >-
      C-GAUGE: the level label must be invariant under (u^4 a, u^6 b) since it is
      a function of j alone; this is a weak check and is included because it is
      free.
    required_metrics:
    - per_level_class_polynomial_and_its_degree
    - per_curve_level_label_with_root_certificate
    - set_equality_check_against_the_committed_j_set
    - agreement_matrix_between_three_labellers
    - per_level_global_invariant_tuples_on_the_small_h_family

  falsification_conditions:
  - >-
    The five root sets do not partition the committed j-set. Either the census or
    the class polynomials are wrong; both are independently certified objects and
    the disagreement must be resolved before anything else in this session's
    ICINV records is trusted.
  - >-
    Two same-level lifts have different rank or root number. (C) is false as
    stated, the twist is the culprit, and the lane regains a free parameter --
    which is a genuinely interesting negative and would raise the priority of
    IDEA-20260807-13c821's one-parameter family search.
  - >-
    The two independent class-polynomial computations disagree. Infrastructure
    failure; no mathematical conclusion follows (AGENTS.md rule 5).
  - >-
    The 2-torsion labeller resolves more than 2 levels. The diagnosis in
    IDEA-20260811-245481 is wrong and both records must be revisited.

  confounders:
  - >-
    THE TWIST. It is the one place (C) can fail, it is named in the claim, and
    the experiment is designed so a failure localises there rather than
    contaminating the partition result.
  - >-
    Rank computations over ring class fields are expensive and often conditional
    on BSD or on a bounded search; every rank reported must carry its method and
    its conditionality, and an unproved rank is reported as a bound, not a value.
    This is why Stage 2 uses a small-h family rather than the committed class.
  - >-
    Complete splitting of H_D mod p is expected because the class is nonempty and
    ordinary, but partial splitting would indicate the wrong discriminant or a
    prime of bad reduction; check the splitting type before interpreting the
    partition.

  interpretation_limits:
  - >-
    TOY SCALE, claim_tier toy. NO ATTACK, NO EXPONENT, NO SPEEDUP; sota_delta
    zero. The lifting lane remains dominated by its own committed height budget.
  - >-
    (C) bounds a CHOICE SET. It says nothing about whether any choice is good,
    and the lane's standing negatives (height budget N^{2/r}, the target-module
    gate, the norm-form gap) are untouched and still apply to every one of the
    #div(f) options.
  - >-
    H-ENDO-001 used, not retested; KN-FIND-b7e091 binding, and the level oracle
    is audited as curve-only and simulable in IDEA-20260811-b2806a; P2 respected.

  heuristic_assumptions:
  - id: HA-1
    statement: >-
      For the ordinary classes considered, every level is nonempty and the
      reduction map from CM points of the order to F_p-curves with that
      endomorphism ring is a bijection onto the level, so root-set membership and
      volcano level agree exactly.
    rigorous_support: >-
      Deuring's lifting and reduction theorems make this a theorem rather than a
      heuristic for ordinary curves with p split in the order
      [recall-confident, not verified this session]. It is listed as a named
      assumption because the campaign has not previously verified the bijection
      computationally, and the Stage 1 set-equality check is exactly that
      verification.
    validation_plan: >-
      Stage 1 IS the validation, at census scale: 138 of 138 with set equality
      and disjointness, cross-checked against an independently certified census
      and against a Velu walk on a subsample of 20. Tail checks: the smallest
      level (3 curves), where a single misassignment is proportionally largest,
      and the crater specifically, since the maximal order is the level every
      downstream argument cares about. Sampled parameters recorded: p = 4001,
      t = 30, D = -15104; no transfer to other p is claimed by Stage 1.
  - id: HA-2
    statement: >-
      The Serre-Tate canonical lift's twist is compatible with Galois
      conjugation, so conjugate class members at one level have conjugate
      canonical lifts and not merely conjugate j-invariants.
    rigorous_support: >-
      No theorem is claimed and this is the record's one genuinely uncertain
      ingredient. The rigorous half is that j-invariants ARE conjugate; twisting
      is a torsor under F_p^*/(F_p^*)^2 and its interaction with the Galois
      action on the ring class field is what must be checked.
    validation_plan: >-
      On the small-h family: for each level compute the canonical lift's global
      model explicitly and test whether the models are Galois conjugates as
      curves rather than merely j-conjugates, by comparing conductors and root
      numbers. Predicted: equality. A disagreement is reported as the finding it
      is, and it would mean the lift-choice set is larger than #div(f) by a
      factor of at most 2 per level, which is still p^{o(1)} and leaves the
      headline bound qualitatively intact -- stated in advance so the record
      cannot be tuned afterwards.

  target_complexity:
    time_exponent: >-
      No attack exponent claimed or moved. Instrument cost: computing all class
      polynomials for a class costs |D|^{1+o(1)} bit operations
      (IDEA-20260807-ee6ef7's figure), which is free at toy scale and is exactly
      the crypto-scale obstruction that record names. Per-curve level lookup
      after that is one polynomial evaluation, O(h log p) field operations.
    memory_exponent: >-
      O(h log|D|) bits for the class polynomials, i.e. p^{1/2+o(1)} at crypto
      scale, which is why this instrument is a toy-scale instrument and is
      declared as such.
    best_known: >-
      For level determination: modular-polynomial volcano climbing at
      Otilde(ell^2) per curve per ell (Kohel; Fouquet-Morain; Sutherland), and
      the group-structure shortcut of IDEA-20260808-4d77a6 where non-vacuous. For
      the ECDLP: 0.886 sqrt(N) with O(1) memory.
    hidden_overhead: >-
      Computing H_D is amortised over the whole class, so per-curve it is cheap;
      stating a per-curve cost without the amortisation would misrepresent it,
      and at crypto scale the amortised cost is still p^{1+o(1)} for the class.
    tradeoff_note: >-
      Not applicable to the instrument. For the lane, the choice-set bound is
      memory-free and does not interact with any tradeoff.

  dominated_by: >-
    As an attack: dominated by every frontier row, since no attack is proposed --
    parallel rho at 0.886 sqrt(N), O(1) memory (KN-TECH-001, KN-TECH-006); the
    automorphism-discounted variant (KN-TECH-018); BSGS at sqrt(N)/sqrt(N)
    (KN-TECH-031). As a level instrument at toy scale: dominated by nothing in
    this repository, since the committed labeller is known to be wrong and the
    modular-polynomial route is more expensive per curve; at crypto scale it is
    dominated by the modular-polynomial route on memory.
  sota_delta: >-
    Zero on every attack axis. Against the campaign's instruments: replaces a
    labeller that resolves 2 of 5 levels with one that resolves 5 of 5 and emits
    a certificate. Against the lifting lane's analysis: replaces an unbounded
    free parameter with #div(f) <= p^{o(1)}.

  estimated_cost:
    implementation: low
    compute: low

  recommended_priority: high

  honest_prior_of_survival: >-
    0.95 that Stage 1's partition comes out exactly as predicted -- it is
    classical theory checked against an already-certified census, and its value
    is the instrument rather than the surprise. 0.7 that the conjugacy claim (C)
    holds with the twist compatible. 0.00 that any of it produces an attack.
    Filed high because RQ-CANL-63098f has had no executed experiment across four
    batches and Stage 1 is a decisive, certificate-bearing, hours-scale
    computation that also unblocks three other records in this session.

