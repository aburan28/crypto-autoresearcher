idea:
  id: IDEA-20260807-e051e7
  question_id: RQ-FIND-001
  added: '2026-08-07'
  title: ZERO of the 28 KN-OPEN entries concern multivariate, code-based, hash-based or symmetric
    cryptanalysis, although that slice holds thirteen goals, fifteen frozen contracts and more
    than twenty evidence records -- so its open questions are lost at every session boundary,
    which is visibly what happened to three items this survey had to rediscover
  class: tooling
  claim: 'The 28 KN-OPEN entries enumerate cleanly: ECDLP/index-calculus (001-011, 019, 020),
    isogeny (013-015), lattice (012, 016-018, 024-028), and program methodology (3f7a21, 875d43,
    8a5965). NOT ONE concerns multivariate, code-based, hash-based or symmetric cryptanalysis.
    That slice has nonetheless produced named, durable, well-characterized open questions INSIDE
    decision and evidence records that were never promoted: OPEN-6''s sampler-integrity question
    (DEC-20260806-2947ba states ''A -244 SD departure is what a genuine effect looks like and
    also what a subtly wrong sampler looks like. Nothing in this campaign yet distinguishes them'';
    DEC-20260806-46a8f3 confirms it ''REMAINS FULLY OPEN''); the 32-versus-24-bit localisation
    (EV-AES-8b8dcf); and assumption A17, the unstated i.i.d. inner-decoder assumption that GOAL-HQC-001
    records as ''proved in NEITHER the specification NOR HQC-RMRS'' and calls ''the highest-value
    falsification surface this batch found''. All three sit in records that no ideation session
    reads by default. KN-OPEN is what the idea-generator reads for continuity across batches;
    a slice with no entries there loses its open questions at every session boundary.'
  mechanism: 'Promote the three named items as the slice''s first KN-OPEN entries, each carrying
    the DISCRIMINATING MEASUREMENT already priced in its source record: OPEN-6 gets a known-answer
    test of the joint block-error law; the AES item gets P(k=4 | k=3) against 1/256; A17 gets
    an inner-decoder independence probe. Each entry states its current state, what would close
    it, and the source records -- so a later session that never reads GOAL-HQC-001''s 800-line
    next_action still finds them. Then add, as a standing practice note, that a decision naming
    an open question owes either a KN-OPEN entry or an explicit not_warranted justification, which
    is the same discipline the knowledge_promotion field already imposes for findings.'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-07'
    grep_results:
    - GOAL-FIND-001 targets KN-FIND (established internal findings), not KN-OPEN (live questions),
      and it is paused. Nothing else owns the promotion path.
    - No goal's completion criteria in that slice require a KN-OPEN entry -- they require evidence,
      decision, and 'any warranted knowledge entry', which has been discharged as none every time.
    - 'The mechanism is visible in this session''s own survey: three items named open in committed
      records were orphaned and had to be rediscovered by reading decisions.'
    conclusion: Screened against ledger/proposals, ledger/hypotheses and knowledge/; external
      novelty UNVERIFIED.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS: any research claim. This is corpus curation.'
    tracked_object: 'The open question as a durable, citable entry: the triple (current state,
      discriminating measurement, closure condition).'
    one_step_propagation_rule: An entry is closed when its discriminating measurement returns;
      until then it survives every session boundary, which prose in a decision does not.
    newness_score: Zero as mathematics. It is the continuity mechanism the corpus already has
      for three lanes and not for a fourth.
  lossy_projection_identifiability_audit:
    projection: a decision's or evidence record's prose -> a standalone open-problem entry.
    what_is_discarded: The surrounding batch context, retained by reference.
    is_it_only_a_change_of_coordinates: 'NO in the operative sense: the entry is discoverable
      where the prose is not, and discoverability is the whole value. Honest caveat: promotion
      creates no knowledge.'
    mirror_failure_check: CHECKED. Promotion must be selective or KN-OPEN becomes a dump. The
      test each candidate must pass is that a DISCRIMINATING MEASUREMENT is already priced in
      its source record; all three named items pass and most decision prose would not.
  null_object_control:
    primary_null: APPLY THE SELECTION TEST TO TEN RANDOM DECISION next_action items from the same
      slice. If most of them also qualify, the test is not selective and KN-OPEN would be flooded;
      the test must then be tightened before any promotion.
    secondary_nulls:
    - 'FORCED PASS: all three named items must qualify.'
    - 'IMMUTABILITY: entries supersede, never overwrite.'
  assumptions: []
  predictions:
  - metric: fraction of ten random decision next_action items passing the selection test
    direction: lower
    minimum_effect: Below one third; otherwise the test is not selective enough to use.
  minimal_test:
    design: Apply the selection test to the three named items and to ten random controls; write
      the three entries with state, discriminating measurement, closure condition and source refs;
      propose the standing practice note.
    controls:
    - ten random decision items as a selectivity null
    - forced-pass on the three
    - immutability
    required_metrics:
    - selection-test outcome per candidate
    - three drafted KN-OPEN entries
    - selectivity rate
  falsification_conditions:
  - 'The selectivity null shows most decision items qualify: the test is too loose and promotion
    would flood the register; tighten before promoting.'
  - 'The three items do not qualify under the tightened test: they are not open problems in the
    register''s sense and the finding is that the slice genuinely has none.'
  - 'The entries are written and the practice note is adopted: continuity is restored for the
    slice.'
  confounders:
  - KN-OPEN entries are read by ideation sessions and therefore steer work; a badly scoped entry
    misdirects, as KN-OPEN-007's 'Current state' currently does by stating the opposite of what
    EV-TTN-001 measured.
  - Promotion is a curation act with its own authority questions.
  interpretation_limits:
  - Curation creates no knowledge and no security claim.
  - Adopting a standing practice note is a Coordinator act.
  heuristic_assumptions:
  - id: HEUR-KNOPEN-1
    statement: Presence in KN-OPEN materially raises the chance a later session works on an open
      question.
    rigorous_support: None. It is plausible from how the idea-generator is briefed and is not
      measured.
    validation_plan: State it as an assumption; docs/measuring-the-harness.md is the right place
      to test it if anyone wants to.
  target_complexity:
    time_exponent: n/a
    memory_exponent: n/a
    best_known: n/a
    hidden_overhead: n/a
    tradeoff_note: n/a
  dominated_by: n/a (no attack claimed); corpus curation.
  sota_delta: ZERO. KN-OPEN is what the idea-generator reads for continuity across batches; a
    slice holding thirteen goals with no entries there loses its open questions at every session
    boundary, and this survey is the evidence that it does.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 0.9 that the three entries are writable from committed records. 0.6
    that the selectivity test passes, i.e. fewer than a third of random decision items qualify.
    0.4 that the standing practice note is adopted.
