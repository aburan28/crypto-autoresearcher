  source: User request 2026-10-09 ('these all sound great') on the follow-on angles after BATCH-2e44f7; filed by
    the coordinator under the standing authorization.
  title: 'Multiplicative-group analogue as a control: the Teichmuller section of F_p^* is canonical, homomorphic,
    and killed by log_p'
  class: control
  claim: In Z_p^* the Teichmuller character gives the unique homomorphic section of Z_p^* -> F_p^* with image mu_{p-1},
    and log_p vanishes on it; the mod-p^2 'Smart-style' ratio log_p(s(g^d))/log_p(s(g)) for a non-canonical section
    s equals d at the random rate 1/p. This is the same theorem as H-CZLIFT-6d4ed1 with E replaced by G_m.
  mechanism: Hom(Z/(p-1), Z_p) = 0, so an additive invariant vanishes on the torsion section; the DLP in F_p^* is
    the controlling example where everyone agrees no p-adic lift helps, so it calibrates what 'canonical section
    exists and is useless' means.
  novelty_status: adaptation
