idea:
  id: IDEA-20260816-41ab94
  question_id: RQ-UOV-001
  added: '2026-08-16'
  title: 'Build the shared instrument this bucket keeps assuming exists: one core UOV kernel plus
    four pluggable transforms and one matched null generator, with exhaustively verified ground truth
    at tiny parameters, so that any later measurement runs byte-identically on all four schemes and
    on nothing.'
  class: tooling
  claim: '(A) Four goals in this program compare four schemes against a plain-UOV baseline, and IDEA-20260807-b63f08
    already records that the shared accounting basis those goals declare a prerequisite does not exist
    and that three hypotheses each derived their own. The same divergence is about to happen at the
    code level: every measurement proposal in this bucket needs a key generator, a transform, a planted
    secret, a certificate checker and a null, and if each builds its own, cross-scheme numbers will
    differ for reasons nobody can locate afterwards. (B) The claim under test is that a single kernel
    can express all four schemes as core-plus-transform with no scheme-specific special cases in the
    core, and that its correctness can be established by exhaustive ground truth rather than by testing:
    at tiny parameters, every generated key''s planted secret is verified by exhaustive evaluation,
    the enumerated set of valid secrets is compared against a closed-form count, and the verifier
    is shown to reject every non-secret. That is a stronger validation standard than any in-repo multivariate
    record currently meets, and it is achievable only at parameters small enough for exhaustion. (C)
    The deliverable is the kernel plus a validation report of forced values it reproduces - Gaussian
    binomial counts, certificate rejection rates, the plain-UOV rank law - so later proposals cite
    a validated instrument instead of rebuilding one. (D) NOT CLAIMED: this is not research about
    any scheme, produces no measurement of any security property, and claims no attack, exponent or
    novelty in the mathematics. Its entire content is instrument validity, and a kernel that fails
    its own ground-truth checks is the useful outcome, because it means every number produced by the
    ad hoc alternatives is suspect too.'
  mechanism: 'STAGE 1, the core. Implement one UOV kernel: given a coefficient algebra A, dimensions
    and a planted oil object, produce a public map. The core must contain no branch on which scheme
    is being built. STAGE 2, four transforms as plugins. Whipping, quotient-ring compression, noncommutative-ring
    compression, and seed compression, each implemented as a transform object with a declared action
    on the parameter tuple and a construction routine, matching the slot decomposition used by the
    composition-table proposal. STAGE 3, the null generator. A fifth plugin producing a uniformly
    random quadratic map at any requested flattened dimensions, with an optional planted isotropic
    subspace, so that every measurement has an executable null by construction rather than by later
    effort. STAGE 4, ground truth. At tiny parameters, for each configuration: verify the planted
    secret by exhaustive evaluation over its whole span; enumerate all valid secrets and compare the
    count with the closed-form Gaussian binomial or submodule count; feed the verifier every non-secret
    candidate of the same shape and confirm a zero acceptance rate. STAGE 5, the forced-value report.
    Reproduce a list of quantities whose values are known in closed form before any run - the q-analogue
    rank law for random symmetric matrices, the rank law for the quotient-ring pairing recorded in
    H-QRUOV-e8ae3e P1, the parameter-triple arithmetic of each transform - and report each as pass
    or fail with the measured and expected values side by side. Any failure blocks release of the
    kernel.'
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-UOV-001 and the three sibling anchor questions in full. Read IDEA-20260807-b63f08's
      title and IDEA-20260808-2b4581's title from the family grep, which are the two records about
      shared cross-scheme infrastructure. Read H-UOV-4d1377, H-QRUOV-e8ae3e and H-SNOVA-ec84c2 statements
      to see what each declares about its own instrument lineage. Grepped ledger/proposals/ for 'false.positive'
      to check whether any instrument-validity record exists in this bucket.
    results: 'IDEA-20260807-b63f08 records exactly the problem this addresses one level up: four Round-3
      goals declare a shared plain-UOV accounting basis a prerequisite, the KN-TECH entry does not
      exist, and three hypotheses have each derived their own - which it calls the divergence GOAL-UOV-001
      warned against, now committed three times. That record is about a shared COST MODEL; this is
      about shared CODE and validated ground truth, and the two are complementary. H-UOV-4d1377 states
      explicitly ''one instrument lineage written for this experiment'', confirming that instruments
      are currently per-experiment. IDEA-20260808-2b4581''s structure-discount ledger would itself
      need this kernel to be computed consistently. No in-repo record proposes a shared multivariate
      kernel or an exhaustive ground-truth validation standard for one.'
    verdict: 'UNVERIFIED. No claim is made about published literature; reference implementations of
      these schemes certainly exist outside, and this program cannot read them, so nothing is asserted
      about their design or their validation standards. Assembled from known parts: the slot decomposition
      is shared with the composition-table proposal in this same batch; the closed-form counts are
      H-SNOVA-ec84c2''s and standard Gaussian binomials; the certificate discipline is docs/claims-and-verification.md''s.
      Claimed new relative to the in-repo corpus only: a single kernel with no per-scheme branches
      in the core, and a release gate defined by exhaustively verified ground truth and a forced-value
      report rather than by tests the author chose.'
  object_first_candidate:
    tracked_object: 'The instrument itself: the kernel''s configuration tuple (algebra, dimensions,
      transform stack, planted secret) together with the vector of forced values it reproduces, tracked
      as a pass/fail profile across configurations.'
    lossiness: This is the one entry in this batch where the honest answer is that the projection
      is NOT lossy in the inventor-protocol sense, and saying so is required rather than optional.
      The kernel retains everything about a configuration; the forced-value vector is a summary of
      its behaviour, not a projection of a mathematical state that must propagate through an operation.
      Under inventor-protocol section 2 this means the entry is not an object-first research idea
      at all - it is infrastructure, filed as tooling class, and it makes no claim to be a new object.
      The section-2 test is applied and the entry declares that it does not pass it, which is the
      correct treatment for an instrument proposal and is stated rather than disguised with borrowed
      vocabulary.
    propagation: 'One step of the target operation is composing one more transform onto a configuration.
      The propagation rule is the slot arithmetic: each transform multiplies the flattened dimensions
      by its declared factors, so the kernel can predict the output dimensions of any transform stack
      before constructing it, and every construction asserts its actual dimensions against that prediction.
      A mismatch is a hard failure, which is what makes the arithmetic a live check rather than documentation.'
    survival_score: The kernel is validated exhaustively only where exhaustion is possible - concretely,
      configurations whose candidate-secret count is below 10^7 and whose signature space is enumerable.
      Beyond that boundary it is validated by forced values only, and beyond that not at all. The
      proposal states that boundary as a number per configuration and refuses to claim validation
      past it.
  null_object_control: 'The null generator is a first-class component rather than a control bolted
    on: it produces uniformly random quadratic maps at any requested flattened dimensions, optionally
    with a planted isotropic subspace and no algebra structure. Its release gate is that the certificate
    checker accepts a planted null secret at rate exactly 1 and accepts non-secrets at rate exactly
    0, and that a null map with no planted secret has an enumerated valid-secret count of exactly
    0 at every tiny configuration. If the null generator cannot meet those forced values, no measurement
    built on this kernel has a trustworthy control arm, and that is precisely the failure mode this
    proposal exists to make visible before ten experiments inherit it.'
  discriminated_from:
  - 'IDEA-20260807-b63f08 (four goals declare a shared plain-UOV accounting basis that does not exist):
    identifies a missing shared COST MODEL and is about ledger-level divergence; this supplies shared
    CODE with a validation gate and computes no cost model at all.'
  - 'IDEA-20260808-2b4581 (structure-discount ledger across UOV-descended schemes): a cross-scheme
    comparison that would be a CONSUMER of this kernel; it produces numbers, this produces the thing
    that produces numbers, and its discount table is not reimplemented here.'
  - 'H-UOV-4d1377''s declared ''one instrument lineage written for this experiment'': the current
    per-experiment practice, which this proposal is a direct response to and names as such rather
    than competing with.'
  - 'General-purpose computer algebra systems: excluded by the bucket''s own instrument constraint
    and, more importantly, unable to provide the exhaustive ground-truth gate proposed here, which
    depends on enumerating a specific candidate-secret space rather than on generic algebra.'
  - 'The composition-table proposal in this same batch: that produces a sixteen-cell status table
    as a research deliverable; this produces the kernel both it and eight other proposals would run
    on, and the two share the slot decomposition deliberately rather than duplicating it.'
  assumptions:
  - All four transforms admit a shared slot decomposition, which is the composition-table proposal's
    Part A and is inherited here as an assumption rather than re-derived.
  - Exhaustive enumeration is feasible at some configuration for every scheme, which is checked per
    configuration against the closed-form count before enumeration begins.
  - Closed-form counts and rank laws cited as forced values are correct; each is recorded with its
    in-repo source so a later correction propagates.
  - A certificate checker that receives only a public map and a claimed secret cannot be biased by
    construction details, which is enforced by module boundaries rather than by convention.
  - Recalled transform definitions are correct in shape; the kernel is only as valid as those, and
    the report says so on its first page.
  predictions:
  - metric: number of scheme-specific branches in the core kernel
    direction: different
    minimum_effect: 'forced value: exactly 0; a nonzero count means the four schemes do not share
      one core and the central claim fails'
  - metric: certificate acceptance rate on non-secrets of the same shape
    direction: different
    minimum_effect: 'forced value: exactly 0 over all enumerated non-secrets'
  - metric: enumerated valid-secret count versus the closed-form Gaussian binomial or submodule count,
      per tiny configuration
    direction: different
    minimum_effect: 'forced: exact equality; any discrepancy blocks release'
  - metric: number of forced values in the release report that the kernel reproduces exactly
    direction: higher
    minimum_effect: 6
  minimal_test:
    design: 'Build the core and one transform first, and gate it before adding the rest. Implement
      the core with a plain-UOV configuration at q = 2, n = 8, o = 3, m = 3, then: verify the planted
      oil space by evaluating the public map on all 2^3 = 8 of its elements; enumerate all 97155 three-dimensional
      subspaces of F_2^8, count how many annihilate the map, and compare with the closed-form Gaussian
      binomial for the visit count; feed every non-annihilating subspace to the certificate checker
      and confirm zero acceptances; and generate a null map with no planted secret and confirm the
      enumerated valid-secret count is exactly 0. Four forced values, all exact, all in seconds. Only
      if all four pass does the second transform get implemented. This staged gate is the entire design:
      it costs almost nothing, it fails loudly, and it makes the difference between a kernel later
      work can cite and a kernel later work will quietly distrust.'
    controls:
    - Null generator with no planted secret, whose enumerated valid-secret count must be exactly 0.
    - 'Non-secret rejection sweep: every enumerated candidate that is not a valid secret is fed to
      the checker, which must accept none.'
    - Enumeration completeness assertion against closed-form counts, catching an iterator that silently
      skips candidates.
    - 'Dimension-arithmetic assertion: every construction''s actual flattened dimensions checked against
      the slot-arithmetic prediction.'
    - 'Degenerate-transform control: each transform at its identity parameter (k = 1, deg f = 1, ell
      = 1, identity expander) must reproduce the core''s output exactly, byte for byte.'
    required_metrics:
    - count of scheme-specific branches in the core
    - certificate acceptance rate on planted secrets and on non-secrets
    - enumerated valid-secret count versus closed-form count per configuration
    - dimension-arithmetic assertion pass rate
    - list of forced values reproduced, with measured and expected side by side
    - largest configuration at which exhaustive validation was possible, per scheme
  falsification_conditions:
  - The core requires a scheme-specific branch to express any of the four transforms, which falsifies
    the one-core claim and is itself a finding about how different these schemes really are.
  - The certificate checker accepts a non-secret, which invalidates every certificate the kernel would
    ever issue.
  - An enumerated count disagrees with its closed-form value, meaning the enumeration or the closed
    form is wrong and either way the kernel is not released.
  - A degenerate-transform control fails to reproduce the core exactly.
  - The null generator produces maps with nonzero enumerated valid-secret counts, meaning the null
    is not null.
  confounders:
  - Writing the closed-form expectation from the same misunderstanding that produced the code, so
    both agree and both are wrong; mitigated by taking each forced value from a distinct in-repo source
    and citing it, never by deriving it inside the kernel.
  - A core that avoids branches by pushing scheme-specific logic into the transform plugins, satisfying
    the branch count while violating its spirit; mitigated by making the degenerate-transform control
    byte-exact and by reporting plugin sizes.
  - Validation only at configurations where every scheme happens to be well behaved; mitigated by
    including at least one awkward configuration per scheme, such as a reducible quotient polynomial.
  - Treating a validated kernel as a validated result; the kernel validates its own arithmetic and
    nothing about any scheme's security.
  - Recalled transform definitions being wrong, which no amount of internal consistency can detect.
  interpretation_limits:
  - A validated kernel is evidence about the instrument, never about any scheme's security, cost,
    or structure.
  - Validation holds only at configurations where exhaustion was performed; larger configurations
    inherit the code but not the guarantee, and the report states the boundary explicitly per scheme.
  - Correctness against recalled transform definitions is not correctness against the real schemes,
    and every downstream record must repeat that caveat rather than inherit it silently.
  target_complexity:
    time_exponent: No attack exponent is claimed. The validation costs one exhaustive enumeration
      per tiny configuration, bounded by the 10^7 candidate ceiling.
    memory_exponent: No attack memory exponent is claimed; enumeration is streaming and the kernel
      holds one configuration at a time.
    best_known: 'The incumbent is current practice in this repository: per-experiment instrument lineages,
      stated explicitly in H-UOV-4d1377, with no cross-experiment validation and, per IDEA-20260807-b63f08,
      three independently derived accounting bases. There is no attack incumbent because no attack
      is proposed and none could be.'
    hidden_overhead: 'The real cost is social rather than computational: a shared kernel is only useful
      if later proposals actually use it, and the discipline that makes that happen - stable interfaces,
      a published forced-value report, a refusal to add scheme-specific branches under deadline -
      is entirely human. The second hidden cost is that exhaustive validation is possible only at
      parameters so small that some schemes degenerate there, so the report must distinguish ''validated''
      from ''validated at a configuration where the scheme is interesting'', and the honest answer
      is often the former.'
  dominated_by: n/a (no result claimed). Checked against every attack frontier row named across the
    four anchor questions - intersection, reconciliation, Kipnis-Shamir, rectangular MinRank, wedge-product,
    group-action stability - and none is comparable, because an instrument with a validation report
    occupies no point on any cost frontier.
  sota_delta: 'no attack; conceptual/measurement contribution only. The quantitative deliverable is
    a forced-value report: at least six quantities with known closed forms reproduced exactly, a zero
    non-secret acceptance rate over every enumerated candidate, and a stated exhaustive-validation
    boundary per scheme.'
  estimated_cost:
    implementation: high
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Part A (one core with zero scheme-specific branches expresses all four
    transforms): 0.55, genuinely uncertain - seed compression and whipping are easy, but the quotient-ring
    and noncommutative-ring transforms may demand different core assumptions about what a coefficient
    is, and if they do, the branch count is nonzero and that is a real finding rather than a failure.
    Part B (exhaustive ground truth is achievable at some configuration for every scheme): 0.75, with
    the risk that the structured schemes'' smallest interesting configurations are already past the
    enumeration ceiling. Part C (later proposals actually adopt it): 0.4, the weakest and least technical
    part, and the one that decides whether this is worth building at all; I state it low deliberately.'
