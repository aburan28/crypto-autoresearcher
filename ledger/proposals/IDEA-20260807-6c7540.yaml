  honest_prior_of_survival: >-
    0.98 that the identity k = ord_N(t-1) is correct. 0.85 that H1 is confirmed
    - i.e. that the real arm is indistinguishable from the uniform-residue null
    - since the correlation between t and N is arithmetically weak; the 0.15
