  sota_delta: >-
    Zero speedup on every axis against every baseline. Non-zero deltas - it
    replaces a relayed asymptotic probability bound (the only thing this corpus
    holds on the subject) with an empirical CDF at six bit sizes up to 384,
    on the order of 10^5 samples per size, with two matched nulls and a
    tail table at three thresholds; and it raises the size at which this
