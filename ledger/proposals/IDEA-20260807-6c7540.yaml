idea:
  id: IDEA-20260807-6c7540
  question_id: RQ-PAIR-21313f
  added: '2026-08-07'
  title: >-
    THE EMBEDDING DEGREE IS THE MULTIPLICATIVE ORDER OF A SMALL INTEGER MODULO A
    LARGE PRIME, AND THAT MAKES ITS DISTRIBUTION VALIDATABLE AT CRYPTOGRAPHIC
    SIZE WITHOUT CONSTRUCTING A SINGLE CURVE - from N | #E(F_p) one gets
    p = t - 1 (mod N), so k = ord_N(t-1) with |t-1| <= 2 sqrt(p) + 1; the
    distribution of k can therefore be sampled directly over (N, t) pairs at
    256-bit N, and compared against the classical theorem it imitates
    (Erdos-Murty 1999 - the order of a fixed integer a modulo p exceeds
    p^{1/2 + eps(p)} for all but o(pi(x)) primes), rather than being asserted
    from a relayed probability bound
  class: measurement

  claim: >-
    (A) THE IDENTITY AND WHY IT CHANGES THE EXPERIMENT. For a prime N dividing
    #E(F_p) = p + 1 - t we have p = t - 1 (mod N), hence
        k = ord_N(p) = ord_N(t - 1),
    and when N > 2 sqrt(p) + 1 the residue is LITERALLY the integer t - 1, whose
    absolute value is at most 2 sqrt(p) + 1 by Hasse. So the embedding degree of
    a near-prime-order curve is the multiplicative order of a comparatively
    SMALL integer modulo a large prime. This is exactly the regime of the
    classical analytic results on multiplicative order, and it is a strictly
    different random model from "the order of a uniformly random residue".

    (B) THE SAMPLING SHORTCUT, WHICH IS THE POINT OF THE PROPOSAL. Because k
    depends only on (N, t) and not on the curve, the distribution of k can be
    sampled by generating PAIRS rather than curves - choose a target size,
    choose t with |t| <= 2 sqrt(p), set #E = p + 1 - t, and keep the cases where
    #E has a large prime factor N. No curve is ever constructed, no CM equation
    is solved, no point counting is done. Existence of a curve with that
    (p, t) is guaranteed for every t with |t| <= 2 sqrt(p) and gcd(t, p) = 1 by
    the Deuring/Honda-Tate/Waterhouse classification, so the sampled pairs are
    not fictional - they correspond to real isogeny classes.
    THE CONSEQUENCE - the distribution of the embedding degree can be measured
    AT CRYPTOGRAPHIC SIZE (N of 256 bits and above), which the rest of this
    campaign cannot do for any other quantity. This program's standing statement
    about the embedding degree (KN-TECH-032, quoting KN-LIT-086 and a
    Luca-Mireles-Shparlinski restatement) is a relayed asymptotic bound that has
    never been checked here against data at any size.

    (C) WHAT IS MEASURED, AND AGAINST WHICH TWO NULLS. For each sampled (N, t) -
      the exact k when N - 1 factors, otherwise the certified bound k > K;
      the ratio log k / log N, which is the quantity Erdos-Murty bounds;
      the empirical CDF of log k / log N.
    NULL ONE, THE WRONG RANDOM MODEL - the same statistic computed for
    ord_N(a) with a a UNIFORMLY RANDOM residue mod N. If the two distributions
    agree, then the smallness of t - 1 is irrelevant and the simpler model
    suffices; if they differ, the difference is the CM-side content of the
    measurement and the record must report which model the data supports.
    NULL TWO, THE SHUFFLED PAIRING - compute ord_{N'}(t-1) where N' is a random
    prime of the same size NOT arising as a divisor of p + 1 - t. This destroys
    the arithmetic relation between t and N while preserving both marginals, and
    it is the matched null object of the same shape. Any structure surviving it
    is a property of the relation, which is the only thing that could be
    interesting.

    (D) THE TWO OUTCOMES, BOTH DELIVERABLES.
    OUTCOME 1 - the data match the classical prediction. Then this program's
    genericity claim is validated at cryptographic size for the first time, the
    relayed bound is replaced by measured data, and the safe-scope statement of
    IDEA-20260807-98a970 rests on something checked here.
    OUTCOME 2 - the data show a systematic excess of small k relative to both
    nulls. Then the constraint linking t and N is doing something, and since
    that constraint is exactly the CM/Hasse structure of the curve, it would be
    a CM-side effect on the embedding degree - which contradicts
    IDEA-20260807-653dda's independence claim and would be the most surprising
    result available in this lane. The record commits to reporting either.

  resource_label: >-
    R7 (pairings into F_{p^k}), in scoping mode - the record measures the
    distribution of the R7 precondition and mounts no transfer.
  admissibility: admissible
  admissibility_argument: >-
    Admissible - the embedding degree is a representation-level integer, not a
    group-operation output, so it is not covered by KN-FIND-b7e091, and nothing
    here applies an endomorphism to a point of G, so the H-ENDO-001 filter does
    not bite. The measurement supports no attack, which is the expected finding.

  discriminated_from:
    - >-
      KN-LIT-086 (Balasubramanian-Koblitz) and the Luca-Mireles-Shparlinski
      bound O(x^{-1} log^9 x (log log x)^2) quoted downstream of it. Those are
      asymptotic upper bounds on the PROBABILITY of small k. This record
      measures the DISTRIBUTION of k, which is a different and finer object, and
      does so at sizes where the asymptotic constants are actually in force.
      The two must be consistent, and checking that consistency is one of the
      deliverables.
    - >-
      IDEA-20260807-653dda, which asserts the independence of k from CM data by
      argument and tests it with a D-matched null at toy scale. This record
      tests the same independence statistically at cryptographic N via the
      shuffled-pairing null. Same claim, different instrument, different scale.
    - >-
      IDEA-20260807-98a970, which certifies k for named DEPLOYED curves. That is
      a census of about fifteen artifacts; this is a distribution over 10^5 or
      more sampled pairs. Neither substitutes for the other.
    - >-
      KN-LIT-313 (Boxall), which gives a heuristic ASYMPTOTIC FORMULA for the
      number of pairing-friendly isogeny classes at FIXED k and FIXED
      discriminant with bounded rho-value. That counts the small-k tail from
      above; this measures the bulk. If Boxall's formula is transcribed it
      becomes a second comparison distribution for the tail check, which would
      strengthen this record considerably.
    - >-
      NOT the classical transfer, and not an attack. It measures how often the
      classical transfer's precondition holds.

  object_first_candidate:
    tracked_object: >-
      THE PAIR (N, t) - subgroup order and trace - carrying with it the derived
      statistic log ord_N(t-1) / log N.
    lossiness: >-
      Extremely lossy - the entire curve, the field, the coefficients, the
      endomorphism ring and the class group are discarded; two integers remain.
      It is not a change of coordinates - no curve is recoverable from (N, t),
      and indeed an entire isogeny class shares the pair.
    propagation: >-
      Deterministic and compatible with the operations that matter. Under
      F_p-isogeny the pair is INVARIANT, which is what makes sampling pairs
      instead of curves legitimate - the discarded information is exactly the
      information that varies within a class and that k does not see. Under a
      change of the sampled size the pair rescales and the statistic
      log k / log N is designed to be the scale-free comparison.
    survival_score: >-
      Survives every isogeny and every model change and every size. Dissolves
      only if one asks a question the pair cannot answer, e.g. anything about
      j-invariants or solving degrees - which is why this object is right for
      this lane and useless for lanes L1, L2 and L11.

  mechanism: >-
    STEP 1 - THE SAMPLER. For each target size s in {32, 64, 128, 192, 256, 384}
    bits, repeat - draw a prime p of s bits, draw t uniformly in
    [-2 sqrt(p), 2 sqrt(p)] with gcd(t, p) = 1, form #E = p + 1 - t, extract its
    largest prime factor N (by trial division and ECM at toy sizes; at large
    sizes, by REJECTION - draw until #E is prime or has a large prime factor
    that can be certified). Record (p, t, N, cofactor).
    STEP 2 - THE ORDER. Compute ord_N(t-1) exactly where N - 1 factors, using
    the standard prime-power descent; otherwise emit the certified lower bound
    k > K by K modular multiplications, as in IDEA-20260807-98a970. Record which
    route each sample took.
    STEP 3 - THE TWO NULLS of (C), on the identical pipeline with the identical
    order routine.
    STEP 4 - THE COMPARISON. Empirical CDF of log k / log N per size, against
    (i) the uniform-residue null, (ii) the shuffled-pairing null, (iii) the
    Erdos-Murty prediction that the statistic exceeds 1/2 + eps for all but a
    vanishing fraction. Report Kolmogorov-Smirnov statistics between arms and
    the exact count of samples with log k / log N below 1/2.
    STEP 5 - THE TAIL CHECK, which is where a surprise would live. Report the
    SMALLEST k observed at each size, the number of samples with k below 10^3,
    10^6 and 10^9, and compare against the count predicted by the relayed
    KN-LIT-086 bound at the same sample size. A tail heavier than predicted is
    the only outcome that would matter cryptographically, and it is checked
    explicitly rather than left to the bulk statistic to hide.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Run 2026-08-07. grep -i over ledger/, knowledge/, docs/, analysis/,
      ideas/ for "embedding degree", "multiplicative order", "Erdos", "Murty",
      "Kurlberg", "distribution of k", "ord_N". Reads of KN-TECH-032,
      KN-LIT-086, KN-LIT-313. Web search verifying Erdos and Murty, "On the
      order of a (mod p)", CRM Proceedings and Lecture Notes 19 (1999) 87-97,
      whose result l_a(p) >= p^{1/2 + eps(p)} for all but o(pi(x)) primes
      p <= x, and the weaker l_a(p) > sqrt(p)/log p for all but O(x/log^3 x)
      primes, was confirmed from the search result and from the author's own
      hosted copy at mast.queensu.ca.
    results: >-
      No record in this repository measures the distribution of the embedding
      degree at any size. "Erdos" and "Murty" return zero hits in ledger/ and
      knowledge/. The identity k = ord_N(t-1) returns zero hits. KN-LIT-086's
      probability bound is present but relayed from a secondary restatement and
      is not compared against any data.
    verdict: >-
      ADAPTATION. The analytic number theory is classical and none of it is
      claimed here. What is new to this program is (i) the identity that
      converts the embedding degree into the order of a small integer, (ii) the
      sampling shortcut that makes the distribution measurable at cryptographic
      N without constructing curves, and (iii) the two nulls that separate the
      arithmetic relation from the marginals. NO claim of novelty against the
      external literature - the sampling trick is elementary and a published
      version very likely exists; a Stage-0 search is part of the design.

  null_object_control: >-
    MANDATORY AND BLOCKING, and there are two because they fail differently.
    NULL ONE (wrong random model) - ord_N(a) for a uniformly random a mod N.
    Same pipeline, same order routine, same sample size. If the measured arm
    matches this, then the smallness of t - 1 does nothing and the record must
    say the embedding degree behaves like a generic order.
    NULL TWO (matched object of the same shape, and the blocking one) - the
    SHUFFLED PAIRING ord_{N'}(t-1) with N' a random prime of the same bit
    length drawn independently of t. This preserves both marginals - the
    distribution of t, and the distribution of prime sizes - and destroys only
    the arithmetic relation N | p + 1 - t. Any effect that survives Null Two is
    a property of the relation; any effect that does not survive it is a
    marginal artifact.
    DECAY PARAMETER - the bit size s. Any apparent excess of small k must
    DECAY as s grows, because the density of small orders falls with N. An
    excess that is flat or growing in s is the canonical artifact tell of
    docs/inventor-protocol.md and, in this pipeline, has a specific likely
    cause named in advance - the rejection sampling for large prime factors
    correlates t with the smoothness of #E, which can correlate with the
    smoothness of N - 1, which directly biases the order. That correlation must
    be measured, not assumed absent.
    INSTRUMENT POSITIVE - inject pairs with a KNOWN small k (take N and set
    t - 1 to a small-order element mod N, e.g. an element of order 12) and
    confirm the pipeline reports k = 12. A distribution instrument that has
    never seen a small k cannot be trusted to report their absence.

  assumptions: []

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a prime p and a trace t with |t| <= 2 sqrt(p), conditioned on
        N = the largest prime factor of p + 1 - t being of size comparable to p,
        the multiplicative order ord_N(t-1) is distributed as the order of a
        FIXED integer of size at most 2 sqrt(p) + 1 modulo a random prime N of
        that size. Formally - the empirical distribution of
        log ord_N(t-1) / log N converges, as the bit size grows, to the same
        limiting distribution as log ord_N(a) / log N for a fixed and N random.
      rigorous_support: >-
        The classical statement this imitates is Erdos and Murty, "On the order
        of a (mod p)", CRM Proceedings and Lecture Notes 19 (1999) 87-97 -
        for any fixed integer a, the multiplicative order l_a(p) satisfies
        l_a(p) >= p^{1/2 + eps(p)} with eps(p) -> 0 for all but o(pi(x)) primes
        p <= x, and l_a(p) > sqrt(p) / log p for all but O(x / log^3 x) primes.
        That is a theorem about a FIXED a and a VARYING prime, which is exactly
        the shape H1 asserts for (t-1, N). The gap H1 must bridge is that here
        a = t - 1 varies with the sample and is CORRELATED with N through
        N | p + 1 - t; Erdos-Murty says nothing about that correlation and H1
        asserts it is asymptotically harmless. The rigorous side is therefore a
        theorem for the uncorrelated case plus an explicit assumption that the
        correlation does not matter, and the record states it that way rather
        than citing the theorem as if it applied directly.
      validation_plan: >-
        WHAT IS SAMPLED - pairs (N, t) generated as in Step 1, at bit sizes
        32, 64, 128, 192, 256 and 384. THE SHORTCUT THAT MAKES CRYPTOGRAPHIC
        SIZE REACHABLE - no curve is constructed, because k does not depend on
        the curve; existence of a curve for each sampled (p, t) is supplied by
        the Deuring/Honda-Tate/Waterhouse classification. This is the analogue,
        for this lane, of using a correspondence to sample at deployed
        parameters. COMPARISON DISTRIBUTION - the empirical CDF of
        log k / log N against the uniform-residue null and against the
        Erdos-Murty threshold 1/2. TAIL CHECKS - the smallest observed k per
        size, the counts below 10^3 / 10^6 / 10^9, and the comparison of those
        counts against the relayed KN-LIT-086 probability bound at the same
        sample size. SCALE HONESTY - the ARITHMETIC here reaches 256 and 384
        bits, which is cryptographically relevant, but no CURVE is constructed
        and no ECDLP is solved; this validates a distributional heuristic at
        cryptographic size and validates nothing else at any size.
    - id: H2
      statement: >-
        Conditioning on p + 1 - t having a large prime factor N does not bias
        the distribution of ord_N(t-1) relative to unconditioned sampling by
        more than a factor that vanishes with the bit size. Equivalently, the
        smoothness structure of #E(F_p) is asymptotically independent of the
        smoothness structure of N - 1.
      rigorous_support: >-
        The statement it imitates is the standard independence heuristic used
        throughout index-calculus analysis, in which the smoothness of two
        arithmetically unrelated integers of comparable size is treated as
        independent, as in the Canfield-Erdos-Pomerance / Dickman-de Bruijn
        framework. NO theorem is available for the specific pair here, and this
        assumption is the one most likely to be false in a detectable way,
        because rejection sampling on the smoothness of #E is exactly the sort
        of conditioning that induces correlations.
      validation_plan: >-
        Measure directly - for each sample record both the factorisation
        pattern of the cofactor #E / N and the factorisation of N - 1, and
        compute the empirical mutual information between the two smoothness
        profiles. Compare against the shuffled-pairing null, where by
        construction it must be zero. Tail check - the joint frequency of
        (#E very smooth, N - 1 very smooth), which is where a correlation would
        first appear. Toy scale for the exact factorisations, with a
        partial-smoothness proxy at 256 bits; the toy part is labelled toy.

  proof_search_map:
    bottleneck: >-
      Computing ord_N(t-1) exactly, which requires factoring N - 1. It is the
      only expensive step, it is what caps the reachable bit size for exact
      values, and it is the reason the design carries a certified-bound
      fallback.
    baseline_embedding:
      parameter_slice: >-
        The toy slice at 32 bits, where every k can be computed exactly and
        where the whole pipeline can be checked against brute force
        (ord_N(t-1) by direct iteration).
      reproduction_check: >-
        A frozen fixture - 1000 toy pairs whose orders are computed both by
        direct iteration and by the prime-power descent, with exact integer
        agreement required on all 1000 before any larger size is sampled.
    observation_collision:
      observable: >-
        The statistic log k / log N.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED - many (N, t) pairs share a value of
        the statistic. That is what makes it a distribution rather than an
        identifier, and the consequence to record is that no individual sample
        may be interpreted; only the CDF and the tail counts carry meaning.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Specialise "how often is a curve MOV-vulnerable" to the pair (N, t)
          and pack the whole curve into it, discarding everything else.
        predicted_gain: >-
          Removes point counting, CM equations and curve construction from the
          experiment entirely, which is what raises the reachable size from
          about 32 bits to 384 bits. This is the single design decision that
          makes the record worth running.
      - transform: stronger_invariant
        proposed_object: >-
          The full embedding-degree profile over ALL prime divisors of
          p + 1 - t, not just the largest.
        predicted_gain: >-
          Retains more state and reveals whether small k concentrates on small
          prime divisors, which would be irrelevant cryptographically but would
          explain any apparent tail excess.
    quantifier_order: >-
      Claimed - FOR EACH bit size s in the tested set, the empirical CDF of
      log k / log N over the sampled pairs is within a stated KS distance of the
      uniform-residue null's CDF. NOT claimed - anything for all s, anything
      asymptotic, and anything about a specific curve. An empirical CDF at six
      sizes is not a theorem and the record says so.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Over the sampled family and at the tested sizes up to 384 bits, the
        embedding degree of a random prime-field curve is distributed
        indistinguishably from the multiplicative order of a fixed small integer
        modulo a random prime, and the fraction with k below 10^9 is at most X."
        It certifies nothing about curves generated by any particular standard's
        procedure, nothing about adversarially chosen curves, and nothing about
        sizes not tested.
      nearby_object_control: >-
        SUPERSINGULAR TRACES. Include t = 0 (and, where p allows, the other
        supersingular traces) in the sampler. There k is 2 or another value at
        most 6, and the pipeline MUST report it as small. A distribution
        instrument that reports supersingular traces as generic has not
        identified the structure it claims to measure. This control also
        supplies a genuine small-k population without any planting.
    proof_obligations:
      - claim: p = t - 1 (mod N) for every prime N dividing p + 1 - t.
        responsibility: correctness
      - claim: Every sampled (p, t) with |t| <= 2 sqrt(p) and gcd(t,p)=1 is realised by a curve.
        responsibility: scope
      - claim: The order routine agrees with brute force on the toy fixture.
        responsibility: correctness
      - claim: The shuffled-pairing null preserves both marginals.
        responsibility: strictness
      - claim: Supersingular traces are reported with small k.
        responsibility: baseline
      - claim: H2's correlation is measured rather than assumed.
        responsibility: success_probability

  predictions:
    - metric: >-
        Kolmogorov-Smirnov distance between the CDF of log k / log N for real
        (N, t) pairs and for the uniform-residue null, per bit size
      direction: different
      minimum_effect: >-
        Predicted BELOW the 0.05 critical value at every tested size, i.e. no
        detectable difference. A significant difference means the smallness of
        t-1 matters and H1 is refuted in its stated form, which would be a
        genuine finding about the arithmetic of embedding degrees.
    - metric: >-
        fraction of samples with log k / log N below 1/2
      direction: lower
      minimum_effect: >-
        Predicted to decrease monotonically with bit size, consistent with
        Erdos-Murty's o(pi(x)) exceptional set. A non-decreasing fraction
        refutes the applicability of the classical model to this correlated
        setting.
    - metric: >-
        smallest observed k, and the count with k below 10^9, at 256 bits
      direction: lower
      minimum_effect: >-
        Predicted ZERO samples with k below 10^9 out of 10^5 samples at 256
        bits. Any sample below that threshold is the tail event that matters and
        must be reported individually with its (p, t, N) and a certificate.
    - metric: >-
        mutual information between the smoothness profile of #E/N and that of
        N-1
      direction: different
      minimum_effect: >-
        Predicted indistinguishable from the shuffled null. A significant value
        refutes H2 and means the rejection sampler is inducing the very
        correlation the measurement is trying to detect - an instrument finding,
        not a mathematical one, and it must be repaired before the main result
        is reported.

  minimal_test:
    design: >-
      STAGE 0 (hours): literature check for an existing measurement of the
      embedding-degree distribution; transcribe Erdos-Murty into
      knowledge/literature; attempt to transcribe Boxall (KN-LIT-313) for the
      tail comparison. STAGE 1 (HARD GATE, minutes): the toy fixture - 1000
      pairs at 32 bits, orders by two independent methods, exact agreement
      required. STAGE 2 (HARD GATE, minutes): the supersingular-trace control
      and the injected known-small-k control. STAGE 3 (hours): sample 10^5 pairs
      at 32, 64 and 128 bits with exact k. STAGE 4 (hours to days): sample 10^4
      to 10^5 pairs at 192, 256 and 384 bits with exact k where N-1 factors and
      certified bounds otherwise. STAGE 5 (hours): both nulls on the identical
      pipeline. STAGE 6: the CDF comparison and the tail table.
      THE CHEAPEST DECISIVE SUBSET is Stages 1-3, which already tests H1 at
      three sizes and costs under an hour.
    controls:
      - toy fixture with two independent order computations
      - supersingular traces, which must report small k
      - injected pairs with a planted k = 12
      - uniform-residue null
      - shuffled-pairing null
      - bit-size sweep as the decay parameter
    required_metrics:
      - per sample - (p, t, N, cofactor, k or its certified bound, which route)
      - empirical CDF of log k / log N per size, per arm
      - KS statistics between arms with critical values
      - tail table - smallest k and counts below 10^3, 10^6, 10^9 per size
      - mutual information between the two smoothness profiles (H2)
      - wall-clock and the fraction of samples receiving an exact k rather than a bound

  falsification_conditions:
    - >-
      The real arm differing significantly from BOTH nulls in the direction of
      smaller k, with the effect surviving the bit-size decay sweep. H1 is
      refuted, the arithmetic relation between t and N matters, and this is the
      lane's most valuable possible outcome.
    - >-
      Any 256-bit sample with k below 10^9. Reported individually with a
      certificate; a genuine one would be a material observation about the
      density of pairing-friendly parameters.
    - >-
      The mutual-information check refuting H2. The sampler is biased; repair
      before reporting anything else. This is an instrument failure, not
      mathematics.
    - >-
      The toy fixture's two order computations disagreeing. Arithmetic bug;
      halt.
    - >-
      Supersingular traces reported as generic. The instrument cannot see small
      k and no absence of small k is interpretable.
    - >-
      Inability to factor enough N-1 at 256 bits to build a CDF. INFRASTRUCTURE
      outcome under AGENTS.md rule 5 - report the bound-only CDF, which is a
      censored distribution and must be labelled as such, never as the
      distribution of k.

  confounders:
    - >-
      Rejection sampling bias, which is H2 and is the dominant risk. Requiring
      a large prime factor conditions on the smoothness of #E and can propagate
      into the smoothness of N-1. Measured directly rather than assumed away.
    - >-
      Censoring by the certified-bound fallback. Samples that receive only
      k > K are censored observations, and computing a CDF over a mixture of
      exact and censored values without saying so would misstate the
      distribution. Every reported CDF must state its censoring fraction.
    - >-
      The Hasse-interval endpoints. Traces near the extremes have different
      arithmetic behaviour (t^2 - 4p near zero), and t = 1 (anomalous) and
      t = 2 (k = 1) are degenerate points that must be reported separately
      rather than absorbed into the bulk.
    - >-
      Confusing this measurement with a statement about STANDARD curves.
      Standard curves are not sampled uniformly; they are generated by specific
      procedures and are audited separately in IDEA-20260807-98a970.

  interpretation_limits:
    - >-
      A distributional measurement over a SAMPLED family. It says nothing about
      any specific curve, mounts no attack, and moves no exponent.
    - >-
      The arithmetic reaches 256 and 384 bits, which is cryptographically
      relevant; NO CURVE IS CONSTRUCTED AND NO ECDLP IS SOLVED AT ANY SIZE. The
      record validates a distributional heuristic at cryptographic size and
      nothing else at any size, and every summary must carry that sentence.
    - >-
      Consistency with KN-LIT-086's bound would be a consistency check, not a
      re-proof; the bound remains relayed until its primary source is
      transcribed.
    - >-
      H1 and H2 are heuristics with validation routes, not theorems. A passing
      validation at six sizes does not make them theorems.

  reachability_gate: >-
    NOT A MOVE BETWEEN CURVES. The record does, however, answer a reachability
    question in the DESIGNER's direction, which is where reachability is real -
    it measures how many random attempts a designer would need to stumble onto a
    small k, and the predicted answer is "more than any sampling budget", which
    is why pairing-friendly curves must be constructed rather than found. For
    the ATTACKER the pair (N, t) is a class invariant and there is nothing to
    walk to (IDEA-20260807-b92080).

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT CLAIMED. The measurement's own cost is dominated by
      factoring N - 1 per sample - a 256-bit factorisation each - with the
      K-multiplication bound as the fallback. The sampler itself is
      O(log^3 p) per pair.
    memory_exponent: >-
      O(1) per sample; the whole dataset is a few tens of megabytes.
    best_known: >-
      Rho at 0.886 sqrt(N) with O(1) memory (KN-TECH-001, KN-TECH-006); BSGS
      (KN-TECH-031); MOV/Frey-Ruck at small k (KN-TECH-032); the genericity
      probability bound of KN-LIT-086, which this record checks against data.
    hidden_overhead: >-
      The censoring fraction is the honest overhead - at 256 bits many samples
      will carry a bound rather than a value, and a CDF built on a censored
      mixture understates the tail unless the censoring is modelled. Disclosed
      here and required in every reported CDF.
    tradeoff_note: >-
      One real tradeoff inside the measurement - exact k costs a factorisation
      per sample and limits the sample count; certified bounds are cheap but
      censor the distribution. The design runs both and reports the split.

  dominated_by: >-
    Every frontier row checked on time, memory and data. As an attack this
