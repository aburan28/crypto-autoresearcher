idea:
  id: IDEA-20260805-a9a95d
  question_id: RQ-MONO-001
  added: '2026-08-05'
  class: measurement
  title: >-
    The relation-rate half of KN-OPEN-009 is not a monodromy question at all: an exact
    Fourier identity turns "deviant relation rates" into the normalized character bias
    of the factor base, supplies the statistic that is NON-degenerate exactly where
    EV-MONO-a0a89c OBS-5 shows the census is degenerate, and moves the exceptional-locus
    hunt from curves to factor bases.

  claim: >-
    THE IDENTITY. Let G = E(F_p), |G| = N, and let FB be a symmetric subset (-FB = FB),
    |FB| = F -- for index calculus, the set of points whose x-coordinate lies in the
    declared factor base. For a target R in G let
      N_m(R) = #{ (P_1,...,P_m) in FB^m : P_1 + ... + P_m = R }.
    Then, with Ghat the character group and Shat(chi) = sum_{P in FB} chi(P),
      N_m(R) = F^m / N  +  (1/N) * sum_{chi != 1} Shat(chi)^m * conj(chi(R)),
    and consequently, EXACTLY and with no error term,
      mean_R N_m(R) = F^m / N,
      Var_R N_m(R) = (1/N^2) * sum_{chi != 1} |Shat(chi)|^{2m}.
    Writing C = max_{chi != 1} |Shat(chi)| and using Parseval (sum_chi |Shat|^2 = N F),
      | N_m(R) / (F^m/N)  -  1 |  <=  (C/F)^{m-2} * (N/F)   for all R and all m >= 2.

    WHAT THIS SETTLES ABOUT THE GOAL'S OWN QUESTION. GOAL-MONO-001 exists to decide
    whether there is "an exceptional locus with deviant relation rates". The identity
    says the deviation of the relation rate from its quasirandom value is controlled by
    ONE quantity -- the normalized bias C/F of the factor base as a subset of the curve
    group -- and by NOTHING about the Galois group of the summation cover. Three
    consequences follow immediately, all pre-run and all forced:
    (D1) FOR THE FULL x-COORDINATE FACTOR BASE (F ~ N/2), square-root cancellation
    C = O(sqrt(N) log N) would give relative deviation O((log N)^{m-2} N^{-(m-2)/2}) --
    i.e. NO exceptional relation-rate locus is possible at any m >= 3, for any curve,
    unless C is within a constant factor of F. That is a barrier statement with an
    argument, at the inventor-protocol section 4 standard, and it does not need a census.
    (D2) THE INTERESTING REGIME IS THEREFORE SMALL, STRUCTURED FACTOR BASES, F << N --
    which is exactly the index-calculus setting (F ~ N^{1/2} or smaller). There
    (C/F)^{m-2}(N/F) can be large, so the exceptional-locus hunt should be a hunt over
    FACTOR-BASE CONSTRUCTIONS, not over curve families. The question KN-OPEN-009 asks
    is aimed at the wrong argument slot.
    (D3) THE STATISTIC IS NON-DEGENERATE ON THE FACTOR-BASE SUBLOCUS. OBS-5's finding
    is that the generic-fibre cycle type is identically trivial where relation search
    operates. Var_R N_m(R) is not a Galois statistic; it is a subset-uniformity
    statistic, it is defined ON the factor base by construction, and it is provably
    non-constant across factor bases (a subgroup and a random set of the same size give
    different values by an exactly computable amount). GOAL-MONO-001's next_action asks
    for "a statistic that discriminates ON that sublocus". This is one, with a closed
    form.

  object_first_candidate:
    tracked_object: >-
      THE CHARACTER SPECTRUM OF THE FACTOR-BASE INDICATOR, |Shat(chi)| for chi in Ghat,
      followed through the decomposition step. Equivalently the spectrum of the Cayley
      graph Cay(E(F_p), FB): N_m(R) is the number of length-m walks from O to R, and
      the identity above is the eigenvalue decomposition of the m-step walk operator.
    established_families_off_limits: >-
      Off-limits AS THE PRIMARY LENS: (i) Chebotarev / Frobenius cycle-type census --
      the whole point of this record is that it is the wrong instrument for this half of
      the question; (ii) monodromy and resolvent decomposition, which are the sibling
      proposal IDEA-20260805-cf2d5a's lens; (iii) Groebner / solving-degree
      instrumentation; (iv) smoothness and Dickman-rho yield modelling (GOAL-SMTH /
      GOAL-DS territory); (v) isogeny and class-group structure; (vi) lifting /
      Xedni-style relation sources. NOT off-limits, and named because it must be: the
      character-sum family itself. This record does not claim to invent character sums
      on elliptic curves; it claims that the reduction of THIS goal's question TO them
      is not in this corpus.
    newness_score: >-
      The identity is textbook additive combinatorics (Fourier inversion plus Parseval)
      and is claimed as nothing else. The new content is the REDUCTION: KN-OPEN-009's
      relation-rate half, and GOAL-MONO-001's declared objective, become an instance of
      a quantity this program already measures under a different name and disagrees
      with itself about. No committed record read here connects the two.
    testability_score: >-
      Total. The identity is exactly checkable at m = 1 in closed form
      (Var = F(N-F)/N^2 for ANY set of size F) and at m = 2 against the additive-quadruple
      count. Both are pure-Python integer computations on toy curves.
    survival_score: >-
      The object survives the whole decomposition step by construction, and survives
      into the extension-field (Gaudry/Diem) setting unchanged in form, since the
      identity is a statement about an abelian group and does not mention the curve. It
      dissolves when the factor base is not symmetric, and when relations are counted
      up to reordering rather than as ordered tuples -- both handled explicitly below.

  mechanism: >-
    DERIVED HERE. G is a finite abelian group of order N (E(F_p); the derivation needs
    only abelianness, so it holds for non-cyclic E(F_p) too). Ghat is its dual.

    (1) INVERSION. 1_{FB}(P) = (1/N) sum_chi Shat(chi) conj(chi(P)) with
    Shat(chi) = sum_{P in FB} chi(P). The m-fold convolution of 1_{FB} with itself
    evaluated at R is N_m(R), and convolution is pointwise multiplication on the
    Fourier side, so N_m(R) = (1/N) sum_chi Shat(chi)^m conj(chi(R)). Splitting off
    chi = 1 (Shat(1) = F) gives the displayed formula and mean_R N_m(R) = F^m/N.

    (2) THE VARIANCE IS EXACT. mean-subtracting and applying orthogonality,
    (1/N) sum_R |N_m(R) - F^m/N|^2 = (1/N^2) sum_{chi != 1} |Shat(chi)|^{2m}.
    No error term, no heuristic, no asymptotics. THE m = 1 CASE IS A COMPLETE
    SELF-CHECK: N_1(R) = 1_{FB}(R), whose variance is F/N - F^2/N^2 = F(N-F)/N^2, and
    the right-hand side is (1/N^2)(NF - F^2) by Parseval. They agree identically for
    EVERY set. That is a control that cannot be fudged and cannot be fitted.

    (3) THE BOUND. |sum_{chi != 1} Shat(chi)^m conj(chi(R))| <= C^{m-2}
    sum_{chi != 1} |Shat(chi)|^2 <= C^{m-2} * N F. Dividing by the mean F^m/N gives
    the displayed relative bound (C/F)^{m-2} (N/F).

    (4) WHY THIS IS THE RELATION RATE AND NOT A PROXY. A prime-field index-calculus
    relation is exactly a decomposition of a target R = aP + bQ as a sum of m factor-base
    elements. N_m(R) IS the ordered count of such decompositions; the multiset count
    differs by the reordering convention, which IDEA-20260803-ff7415 correctly identifies
    as the place a factor 2^{n-1} or n! can be double-counted, and both conventions are
    therefore reported separately in the paired contract. The mean F^m/N is the
    conservation quantity KN-FIND-007 records (NOT READ IN FULL -- named by
    IDEA-20260803-ff7415, which states KN-FIND-007 gives the exact geometry-independent
    mean C(B+m-1,m)/N for MULTISETS; the ordered mean F^m/N derived here is the same
    statement in the ordered convention, and confirming the correspondence is a declared
    stage rather than an assumption). What is NOT in that finding, and is the whole
    content here, is the VARIANCE: the mean is geometry-independent, and therefore the
    mean can never exhibit an exceptional locus, which is precisely why the deviation
    question has to be asked of the second moment. A programme that only ever compares
    means is structurally incapable of finding what KN-OPEN-009 is looking for.

    (5) THE SUBGROUP EXTREME, WHICH IS THE POSITIVE CONTROL AND IS EXACT. If FB is a
    subgroup H of order h, then Shat(chi) = h for the h-... precisely, for the N/h
    characters trivial on H, and 0 otherwise. So N_m(R) = h^{m-1} for R in H and 0
    otherwise: total concentration, relative deviation exactly N/h - 1. This is a
    factor base with an exceptional relation rate, it exists for every curve with a
    proper subgroup, and it is not exotic -- it is what a badly chosen factor base
    looks like. Any instrument that cannot see it is broken.

    (6) THE CONNECTION TO THIS PROGRAM'S OWN DISPUTED CONSTANT, STATED AS A LINK AND
    NOT AS A RESULT. C = max_{chi != 1} |sum_{P in FB} chi(P)| is the same shape of
    quantity as the H-PSEUDO / ECCG character sum that the ANGLE-BRIEF records four
    live and mutually inconsistent values for (alpha = 0.055 in KN-FIND-d4f820, 0.079
    in KN-FIND-4c9e71, a refit at 0.0620, a SCOUT-COMPUTED null at 0.0624 over Z_N
    rather than E(F_p)), and a further unreconciled max-C dispute (O(1) in
    DEC-20260804-0a4bc2 and -4f3a3b versus "genuine p-growth" in DEC-20260804-53c89f).
    NONE OF THOSE RECORDS WAS READ IN FULL FOR THIS PROPOSAL; they are relayed from the
    ANGLE-BRIEF and are listed as CANDIDATES TO CHECK, never as authority, and the
    contradiction is reported rather than resolved (AGENTS.md retrieval policy item 7).
    The point that IS made here is structural and does not depend on which value is
    right: if the relation-rate half of KN-OPEN-009 reduces to C, then it is the SAME
    quantity as the one those records disagree about, and this goal and GOAL-ECDLP-001
    have been asking one question in two vocabularies without either citing the other.
    Adjacent boundary, also relayed: DEC-20260804-f320c2 (R2) closes the spectral-gap
    route for Cay(Z/N, S) at |S| = O(1); the factor base has |S| = F ~ sqrt(N), which
    is outside that scope. This record does not claim GOAL-ECDLP-001's or
    GOAL-RELN-001's territory: it is scoped to KN-OPEN-009's relation-rate half, which
    is GOAL-MONO-001's own declared objective, and any overlap must be adjudicated by
    the Coordinator rather than assumed away here.

  novelty_status: adaptation

  novelty_screen:
    screened_on: '2026-08-05'
    corpus_paths_read:
      - knowledge/open-problems/KN-OPEN-009.md
      - ledger/evidence/EV-MONO-a0a89c.yaml
      - ledger/questions/RQ-MONO-001.yaml
      - ledger/goals/GOAL-MONO-001/goal.yaml
      - ledger/proposals/IDEA-20260803-ff7415.yaml
    findings:
      - >-
        KN-OPEN-009 frames the relation-rate question entirely in terms of monodromy
        and Chebotarev; the words "character sum", "Fourier" and "Cayley" do not appear
        in it. EV-MONO-a0a89c then demonstrates, via OBS-5, that the monodromy
        instrument is constant on the attack locus. Nothing in the goal's records
        proposes a replacement statistic. That gap is what this record fills.
      - >-
        IDEA-20260803-ff7415 measures decomposition COUNTS against an exact conservation
        MEAN. It is about the first moment and explicitly treats the mean as exact and
        uncorrectable. This record is about the SECOND moment, which that proposal does
        not compute, mention or predict. The two are complementary and neither
        supersedes the other; if ff7415 executes first its ordered-versus-multiset
        instrumentation is directly reusable here and should be reused rather than
        rebuilt.
      - >-
        No experiment, evidence or hypothesis record in area MONO measures a variance,
        a character sum, or a matched null factor base.
    literature_verified: []
    literature_unverified:
      - >-
        NOT READ -- RELAYED. The Fourier/convolution identity is standard additive
        combinatorics and is certainly published in a hundred places; no source is
        cited because none was read, and none is needed since the derivation is given
        in full above and is self-checking at m = 1.
      - >-
        NOT READ -- RELAYED FROM THE SESSION ANGLE-BRIEF, NOT FROM THE RECORDS
        THEMSELVES: KN-FIND-007's conservation mean; KN-FIND-d4f820 and KN-FIND-4c9e71's
        alpha values; DEC-20260804-0a4bc2, -4f3a3b and -53c89f's max-C dispute;
