    conclusion: >-
      novelty_status adaptation. The mathematics is standard; the reduction of this
      goal's declared question to it is not present in the corpus read, and the
      cross-goal collision it exposes (the same constant C under two vocabularies) is
      the contribution.

  lossy_projection_identifiability_audit:
    projection: >-
      Full factor base FB as a SET of points (F log N bits) projected to its unsigned
      character spectrum { |Shat(chi)| : chi in Ghat }, and then to the single scalar
      Var_R N_m(R) = (1/N^2) sum_{chi != 1} |Shat(chi)|^{2m}.
    what_is_discarded: >-
      The identity of the points, all phase information in Shat, and any correlation
      between the factor base and the curve's geometry. From C(N,F) possible symmetric
      sets, one real number.
    why_genuinely_lossy: >-
      Massively so: translates FB -> FB + g and automorphism images all leave |Shat|
      invariant, so the fibre over an observed spectrum contains at least the whole
      translate/automorphism orbit, and generically far more.
    why_compatible_with_the_targets_operations: >-
      Because the target's operation is the group law, and the character transform
      turns convolution (which IS the decomposition step) into pointwise multiplication.
      The retained quantity propagates deterministically through m-fold decomposition:
      the m-step statistic is the m-th power of the one-step statistic, exactly. That
      is the strongest compatibility available and it is why this projection, and not
      some other summary of the factor base, is the right one.
    is_it_only_a_change_of_coordinates: >-
      NO -- CHECKED AGAINST THE (Delta, Pi) FAILURE. The full spectrum WITH phases is
      equivalent to the set (Fourier inversion is invertible), so tracking Shat with
      phases would indeed be a change of coordinates. Tracking |Shat| is NOT: the moduli
      alone do not determine the set, and the collapse to the single scalar Var is
      strictly further lossy. This distinction is the reason the tracked object is
      declared as the MODULI and not the transform.
    mirror_failure_check: >-
      CHECKED, AND IT IS THE ONE THAT MATTERS HERE. Is the statistic constant across
      instances? No, and this is provable rather than hoped: at m = 1 the variance is
      F(N-F)/N^2 for every set (so m = 1 IS constant at fixed F -- which is exactly why
      it is used as the calibration control and NOT as the discriminating statistic),
      while for m >= 2 a subgroup of order h gives relative deviation exactly N/h - 1
      and a random symmetric set of the same size gives a value that concentrates near
      a computable null. Comparator spread is therefore established at m >= 2 BEFORE any
      run, by exhibiting two sets of equal size with provably different values.
      SEPARATELY: the second-order failure mode named in KN-TECH-1a5b7e -- a control
      that passes because it cannot fail -- is avoided by pre-registering the m = 1
      constancy explicitly, so that an implementation reporting "no difference at m = 1"
      is scored as a PASS OF THE CALIBRATION and never as a negative result.

  predictions:
    - metric: >-
        exact-identity residual at m = 1: | measured Var_R N_1(R) - F(N-F)/N^2 |,
        computed on every tested (curve, factor base) cell
      direction: lower
      minimum_effect: >-
        0 EXACTLY in exact rational arithmetic (below 1e-12 relative if floating-point
        characters are used). This is a forced value for EVERY set of size F, so a
        nonzero residual is an implementation defect and voids the cell. It is the
        calibration, not the finding.
    - metric: >-
        exact-identity residual at m = 2, 3, 4: | measured Var_R N_m(R) -
        (1/N^2) sum_{chi != 1} |Shat(chi)|^{2m} |, relative
      direction: lower
      minimum_effect: >-
        below 1e-10 relative. Forced by the derivation. A failure means the derivation
        or the implementation is wrong and the whole record halts.
    - metric: >-
        bias ratio C/F for the real x-coordinate factor base of size F, versus a matched
        null (a uniformly drawn symmetric subset of E(F_p) of the SAME size F), reported
        as the ratio of ratios (C/F)_real / (C/F)_null over >= 30 null draws
      direction: same
      minimum_effect: >-
        PRE-REGISTERED AS 1.00 +- 0.15. The pre-registered expectation is that the
        x-coordinate factor base is NOT structurally biased and behaves like a random
        symmetric set. A ratio above 1.5 is the exceptional-locus signal KN-OPEN-009
        asks for, in the correct argument slot; a ratio below 0.7 would mean the factor
        base is MORE uniform than random, which is also a finding. The prediction is
        two-sided by construction and can fail in both directions.
    - metric: >-
        variance ratio Var_real / Var_null at m = 3 and m = 4 on the same cells
      direction: same
      minimum_effect: >-
        within [0.7, 1.4]. Pre-registered before any run. This is the direct
        relation-rate deviation test and is the primary discriminating metric.
    - metric: >-
        subgroup positive control: relative deviation max_R |N_m(R)/(F^m/N) - 1| for
        FB = a proper subgroup H of E(F_p) of order h
      direction: higher
      minimum_effect: >-
        EXACTLY N/h - 1, a forced value derived before the run (e.g. h = N/2 gives
        exactly 1; h = N/4 gives exactly 3). If the instrument returns anything else on
        this arm it cannot see an exceptional factor base and NO NEGATIVE MAY BE
        REPORTED from any other arm.
    - metric: >-
        curve-family dependence: the spread of (C/F)_real across the pinned curve panel
        (random ordinary, CM, j = 0, j = 1728) at fixed p and fixed F
      direction: lower
      minimum_effect: >-
        Coefficient of variation below 0.10 across the panel. THIS IS THE ACTUAL
        EXCEPTIONAL-CURVE TEST, relocated to the statistic that can see it. A CM or
        j = 0 curve standing out beyond 3 sigma of the random-ordinary panel is the
        exceptional locus KN-OPEN-009 hypothesizes, found in the correct place.

  minimal_test:
    design: >-
      Five stages, cheapest first, each able to end the line. STAGE 0 (zero compute,
      minutes): verify the m = 1 closed form F(N-F)/N^2 symbolically -- if the
      derivation fails here nothing else runs. STAGE 1 (zero compute, ~2 hours reading):
      read KN-FIND-007, KN-FIND-d4f820, KN-FIND-4c9e71, DEC-20260804-0a4bc2/-4f3a3b/
      -53c89f and DEC-20260804-f320c2 IN FULL and record, verbatim, what each actually
      claims; correct or withdraw every relayed statement in this record accordingly.
      This stage can by itself change the record's status and must run before any
      compute. STAGE 2 (pure-Python, minutes): exhaustively compute N_m(R) for all R on
      toy curves for m = 1..4 by direct convolution, and check the exact identity
      against the character-side computation. STAGE 3 (minutes): the real factor base
      versus >= 30 matched nulls; report ratios, never raw statistics. STAGE 4
      (minutes): the subgroup positive control and the graded factor-base-size ladder.
    controls:
      - >-
        MATCHED NULL, SAME SHAPE, FORCED VALUE PRE-DERIVED, CAN FAIL. Replace the real
        factor base (x-coordinates of rational points, closed under negation) by a
        uniformly drawn SYMMETRIC subset of E(F_p) of IDENTICAL size F, on the SAME
        curve, with the SAME m and the SAME target set. Report Var_real / Var_null and
        (C/F)_real / (C/F)_null, not raw values. This is a genuine matched null in the
        sense the ANGLE-BRIEF template T-A requires (same size, same symmetry, same
        group), and it can fail: nothing forces the real factor base to look random.
      - >-
        POSITIVE CONTROL WITH AN EXACT FORCED VALUE (MANDATORY). FB = a proper subgroup
        H <= E(F_p) of order h. Forced: N_m(R) = h^{m-1} on H and 0 off it, relative
        deviation exactly N/h - 1, and C/F = 1. If the instrument does not reproduce
        this exactly, it cannot detect an exceptional factor base and NO NEGATIVE RESULT
        MAY BE REPORTED (inventor protocol section 3).
      - >-
        SECOND POSITIVE CONTROL, WEAKER AND MORE REALISTIC. FB = a coset-union or a
        union of two subgroup cosets, whose spectrum is computable in closed form but
        whose bias is intermediate. This tests sensitivity at a realistic effect size
        rather than only at the extreme.
      - >-
        GRADED CONTROL, >= 3 INTERIOR POINTS, MONOTONICITY REPORTED. Vary F over
        {N/16, N/8, N/4, N/2} at fixed curve and m. The bound predicts relative
        deviation scaling as (C/F)^{m-2}(N/F); with C ~ sqrt(F) for a random set this
        DECAYS as F grows. THE QUANTITY MUST DECAY AS F INCREASES. A statistic that
        does not decay when the parameter meant to destroy it increases is the canonical
        artifact tell named in inventor protocol section 3, and the ladder is designed
        to expose exactly that.
      - >-
        CALIBRATION CONTROL THAT IS DECLARED NOT TO BE EVIDENCE. m = 1 gives
        F(N-F)/N^2 for every set, so real and null agree by construction. This is
        recorded IN ADVANCE as a control that CANNOT discriminate, so that its passing
        is never reported as a null result. KN-TECH-1a5b7e catalogues the opposite
        practice as a live defect in this corpus.
      - >-
        CONVENTION CONTROL. Report ordered tuple counts AND multiset counts at every
        cell. IDEA-20260803-ff7415 identifies convention conflation as the most likely
        explanation of a spurious 2^{n-1} factor in this exact lane; reporting one
        convention would reintroduce that risk.
    required_metrics:
      - exact-identity residual per (curve, FB, m), both sides computed independently
      - Var_real, Var_null (>= 30 draws, mean and sd), and their ratio
      - C, F, C/F for real and null arms
      - subgroup-control relative deviation against the forced N/h - 1
      - graded F-ladder with the decay trend and its sign
      - ordered and multiset counts at every cell
      - per-curve-panel spread of C/F, with CM and j = 0/1728 flagged separately

  falsification_conditions:
    - >-
      The exact identity failing at any m in exact arithmetic. The derivation is wrong;
      this record is withdrawn via a superseding record, not repaired in place.
    - >-
      The subgroup positive control not returning exactly N/h - 1. Instrument broken;
      nothing may be reported.
    - >-
      Var_real / Var_null outside [0.7, 1.4] at m = 3 or 4 with all controls passing --
      this FALSIFIES the pre-registered expectation of no deviation and is the positive
      outcome the goal was created to find. It is listed as a falsification condition
      and not as a hoped-for result deliberately: the record predicts no deviation.
    - >-
      The graded F-ladder failing to decay while the controls pass. Then the measured
      quantity is not the one the bound governs and the whole reduction is suspect.
    - >-
      Stage 1 finding that KN-FIND-007's conservation mean is NOT the ordered mean
      F^m/N under any convention. Then step (4) of the mechanism is wrong and the
      identification of N_m with the relation rate must be redone.

  confounders:
    - >-
      SYMMETRY OF THE FACTOR BASE IS AN ASSUMPTION WITH TEETH. Shat(chi) is real when
      FB = -FB. A factor base defined by x-coordinates IS symmetric; one defined by a
      choice of sign per point is NOT, and then Shat is complex and several statements
      change. The contract must fix and record the convention.
    - >-
      E(F_p) NEED NOT BE CYCLIC. The derivation uses only abelianness so it is fine,
      but an implementation that hard-codes a cyclic discrete log to index characters
      will silently be wrong on curves with full 2-torsion. Flagged because the pinned
      panels in this lane include Z = 3 curves.
    - >-
      TARGET SET. Var_R is over ALL R in G. An implementation that averages over a
      SAMPLE of targets estimates the variance with its own error, which must be
      reported; at toy scale the exhaustive computation is affordable and is required.
    - >-
      TOY SCALE. C/F at p ~ 10^3 is not C/F at p ~ 2^256. The IDENTITY is scale-free;
      the MEASURED bias is toy and is labelled toy. The bound's consequence D1 is a
      derivation and may be cited as one; no measured C may be extrapolated.
    - >-
      RELAYED CROSS-GOAL CLAIMS. Every statement here about KN-FIND-007, the alpha
      dispute, the max-C dispute and the R2 spectral-gap scope is relayed from the
      session ANGLE-BRIEF and unverified. Stage 1 exists to remove this confounder and
      no compute may proceed past it on the relayed version.

  interpretation_limits:
    - >-
      CLAIM TIER toy for every measurement. The bound and the identity are derivations
      and must be cited as derivations, never as measurements.
    - >-
      NO EXPONENT IS MOVED IN EITHER DIRECTION BY THE EXPECTED OUTCOME. If the
      pre-registered no-deviation prediction holds, the result is a barrier-shaped
      statement about one factor-base family at toy scale. Pollard rho remains the
      baseline.
    - >-
      A LARGE MEASURED C/F WOULD NOT BE AN ATTACK. It would be a relation-rate
      deviation, which is one term in a cost model. Converting it into a cost claim
      would require charging relation collection AND the linear-algebra stage, which
      this record does not do and which the ANGLE-BRIEF notes no record in this program
      has done for the analogous BKK claims.
    - >-
      THIS DOES NOT CLOSE KN-OPEN-009. It relocates the relation-rate half to a
      different and better-posed quantity and gives it a measurable statistic. The
      imprimitivity half is IDEA-20260805-cf2d5a's, not this record's.
    - >-
      NO STATUS CHANGE to any record, goal, finding or open problem is proposed or
      implied. Any correction to a KN-FIND arising from Stage 1 SUPERSEDES under a new
      id and never edits (AGENTS.md rule 4).

  heuristic_assumptions:
    - id: HEUR-CHR-1
      formal_statement: >-
        NONE LOAD-BEARING FOR THE IDENTITY OR THE BOUND. Both are exact consequences of
