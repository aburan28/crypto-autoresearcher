idea:
  id: IDEA-20260905-030f9e
  title: A one-sided transport envelope for detectable endpoint cost valleys
  class: mechanism
  claim: A certified transport of one fixed source presentation supplies a one-sided upper bound on the cost of
    the resulting endpoint presentation when all conversion, exceptional-locus and description growth is charged.
    Comparing native and transported presentations may expose equation-specific endpoint structure; a two-sided
    logarithmic modulus remains an additional unproved prerequisite.
  mechanism: For a supplied presentation P at E and certified prime-to-pN edge phi of degree d, define the total
    incremental charge T_phi(P) to include construction, conversion, exceptional-locus handling, coefficient/degree
    growth, map evaluation and verification of the transported representation. Only when a transport construction
    is supplied is its cost C_phi(P) bounded by C(P)+T_phi(P). This bounds the specific transported object and does
    not bound an unrelated native presentation cost C_native(Eprime). Identity transport has T_id=0 and C_id(P)=C(P).
    For the dual round trip, phihat composed with phi equals [d], so C_round(P)<=C(P)+T_phi(P)+T_phihat(phi(P))+T_[d]^-1,
    if the prime-order subgroup permits inversion of d modulo N. This final term includes restoration and description
    costs; it cannot be omitted as if the round trip were identity. If gcd(d,N)!=1 the inverse premise fails. A
    minimum over a transport-closed presentation class and both directional inequalities would be required for a
    two-sided statement. Even there Cprime<=C+T implies log(Cprime/C)<=log(1+T/C) only for positive C; this is not
    a bound on absolute logarithmic variation without the reverse inequality. Class-invariant embedding degree and
    anomalous trace remain exclusion controls.
