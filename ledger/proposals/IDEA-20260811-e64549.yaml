idea:
  id: IDEA-20260811-e64549
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-aeeb17
  axis: A5
  claim_tier: toy
  title: >-
    The high-genus function-field gift is that GENUS IS A FREE PARAMETER you grow while
    holding the constant field small, and it fails over F_p at two named steps: F_p has no
    proper subfield so there is no Weil descent, and isogenies PRESERVE dimension so the
    endomorphism ring cannot manufacture one -- while the one canonical high-genus object
    attached to an ECDLP instance, the level-N modular curve, has its genus FORCED to
    (N-5)(N-7)/24, so every computation in it costs Omega(N) against rho's 0.886*sqrt(N),
    losing by a factor Omega(sqrt(N)) before any relation is collected
  class: mechanism
  claim: |-
    (A) THE INGREDIENT THAT DOES THE WORK IN THE FUNCTION-FIELD WORLD. Index calculus in the
    Jacobian of a curve C of genus g over F_q uses a factor base of degree-1 places, of size
    about q, and decomposes random degree-g divisors over it with probability about 1/g!.
    The group has order about q^g. Subexponentiality comes from being allowed to CHOOSE the
    pair (q, g) with g growing relative to log q: the factor base stays cheap (size q) while
    the group grows (q^g), so the relation-collection cost q sits far below sqrt(q^g).
    [recall-confident: Adleman-DeMarrais-Huang; Enge-Gaudry; NOT re-verified this session,
    web tools unavailable.] GENUS IS A FREE PARAMETER. That is the entire gift, stated in one
    sentence, and every transfer question is "where does the free parameter come from over
    F_p".

    (B) THE THREE PLACES IT COULD COME FROM, AND THE EXACT STEP EACH ONE FAILS AT.
      (B1) A SUBFIELD (Weil descent / GHS). Over F_{q^n} with n > 1, Res_{F_{q^n}/F_q}(E) is
        an n-dimensional abelian variety over F_q, and covers of it supply the growing genus.
        EXACT FAILING STEP OVER F_p: the construction takes as input a field extension of
        degree n > 1, and F_p is a prime field -- it has no proper subfield, so n = 1 and the
        Weil restriction is E itself. [fact] This is not a cost obstruction; the input to the
        construction does not exist.
      (B2) THE ENDOMORPHISM RING (the campaign's R3). Could an isogeny or an endomorphism
        play the role of the field extension? NO, AND THE REASON IS A ONE-LINE DIMENSION
        COUNT: base extension of degree n MULTIPLIES the dimension of the Weil restriction by
        n, whereas an isogeny is a surjective homomorphism of abelian varieties with finite
        kernel and therefore PRESERVES dimension exactly. [fact] Every object reachable from
        E by isogenies, quotients by finite subgroups, or endomorphisms is again a
        one-dimensional abelian variety over F_p. Restated as a campaign-level statement:
        RESOURCES R3, R4, R5 AND R6 ARE ALL DIMENSION-PRESERVING; ONLY R7-style base change
        IS DIMENSION-MULTIPLYING, AND OVER A PRIME FIELD THERE IS NOTHING TO CHANGE BASE TO
        EXCEPT UPWARDS, WHICH MAKES THE GROUP BIGGER AS FAST AS IT MAKES THE VARIETY BIGGER.
      (B3) THE ISOGENY CLASS AS A SUBSTITUTE FOR GENUS. The class contains h = p^{1/2+o(1)}
        curves; could a factor base spread across the class play the role of a big factor
        base on one high-genus curve? NO: an index-calculus RELATION is an equation
        sum_i a_i R_i = O evaluated in ONE group; points on different curves cannot be added.
        To combine them one must transport them to a single curve by T1, and transport of a
        structured factor-base element is a point with no remaining structure -- the class
        contributes factor-base SIZE, which was already a free parameter, and no new
        algebraic relation. EXACT FAILING STEP: the relation must be evaluated in a single
        group, and transport is the only bridge, and it is structure-destroying.

    (C) THE ONE CANONICAL HIGH-GENUS OBJECT THAT IS ATTACHED TO AN ECDLP INSTANCE, AND ITS
    PRICE. There is exactly one place where a genuinely high genus appears over F_p without
    any extension of the base: the LEVEL-N modular curve. The marked pair (E, P) with P of
    order N is an F_p-point of X_1(N), whose genus for prime N > 7 is (N-5)(N-7)/24
    [recall-confident, classical genus formula, NOT re-verified], and every plane or
    optimized model of X_1(N) has degree and coefficient count Omega(N). So the
    function-field machinery of (A) IS available on a curve canonically attached to the
    instance -- and it is priced as follows:
        cost of any computation requiring a model of X_1(N) mod p:  Omega(N) field operations
        cost of parallel Pollard rho on the same instance:          0.886*sqrt(N) group operations
        ratio:                                                     Omega(sqrt(N)), against.
    The high-genus gift therefore does reach the ECDLP, and loses by a square root before a
    single relation is collected. THE EXACT STEP: in the function-field world g is chosen
    independently of the group one wants to attack; here g is FORCED to Theta(N^2) by the
    level, and N is precisely the quantity whose square root one is trying to beat. The free
    parameter is not free.

    (D) THE ASYMMETRY THAT MAKES THIS A LEAD AND NOT ONLY A CLOSURE. The Omega(N) price in
    (C) is the price of a MODEL of X_1(N). It is NOT the price of the instance's coordinates:
    the Tate normal form puts any (E, P) with P of order at least 4 into the shape
    y^2 + (1-c)xy - b y = x^3 - b x^2 with P = (0,0), and computing (b, c) from (E, P) costs
    O(log p) field operations [recall-confident, classical; the normal form itself is
    verifiable by direct substitution and is checked in Stage 1]. So the instance's point on
    X_1(N) is CHEAP and the curve it lies on is EXPENSIVE. Any use of the modular world must
    therefore live entirely in the cheap half: a function evaluable from (b, c) alone,
    without a model. That is a precisely stated escape route, it is the only one this record
    leaves open, and it is the object of the companion record IDEA-20260811-d69ebe.

    (E) WHAT IS NOT CLAIMED. No attack, no exponent, sota_delta zero. (B1)-(B3) are scoped to
    the constructions named; (C) is scoped to algorithms that require a model of the modular
    curve. Nothing here says the function-field world is irrelevant to elliptic curves -- GHS
    over F_{q^n} is a real break and is the nearby object on which this record's conclusion
    must be seen to fail.
  mechanism: |-
    The causal statement: subexponential Jacobian index calculus buys its advantage from the
    ratio (group size q^g) / (factor base size q), which is controlled by g. Over a prime
    field with a fixed elliptic curve the only ways to raise g are (i) raise the base field,
    which raises the group by the same factor, (ii) add level structure, which raises g
    quadratically in the level while the useful information is log N bits, or (iii) leave the
    category of abelian varieties of dimension 1, which isogenies and endomorphisms cannot do
    because they are finite-kernel surjections. The three failing steps in (B) and the price
    in (C) are these three cases, and the dimension count in (B2) is what makes the list
    exhaustive within the category.
  why_not_a_renamed_known_approach: |-
    Not an algorithm. The Weil-descent half of (B1) is classical and is repeatedly declared
    off-limits as a primary lens by existing records in this corpus (IDEA-20260805-887d67,
    -1f4a11, -2dc8de, -b6af55, -4243e6, -0d2a21 among others); this record does not re-derive
    it and does not propose it. What is new relative to those is (B2)'s dimension count as a
    UNIFORM statement about the campaign's own resource taxonomy, and (C)'s pricing of the
    one canonical high-genus object over F_p, which no record in this corpus computes. The
    nearest thing in the corpus to (C) is IDEA-20260806-0c9de1's confounder note that
    "X_1(N) has genus of order N^2/24, so for cryptographic N the curve cannot be written
    down" -- a warning about that record's own toy computations, not a cost comparison
    against rho, and not tied to the function-field ingredient at all.
  resource_label: >-
    R1 (x-coordinates as field elements: the index-calculus factor base), R2 (the curve
    model, and the Tate normal form as a model of the marked pair) and R7 (pairings/base
    change, appearing only as the dimension-multiplying operation in (B2)). The record's
    central argument is a statement ABOUT the taxonomy -- that R3, R4, R5, R6 are
    dimension-preserving -- and it argues that this property deserves to be recorded as a
    column of the R1-R8 table rather than as a new row. No endomorphism is applied to a point
    of G anywhere.
  admissibility: admissible
  predictions:
  - observable: dimension of the object produced by each resource
    metric: >-
      for E/F_p: dim of Res_{F_{p^n}/F_p}(E_{F_{p^n}}) for n = 1, 2, 3, measured by point
      counting (#Res(F_p) = #E(F_{p^n})); and dim of E/S for finite subgroups S, and of the
      image of any endomorphism, measured the same way
    predicted: >-
      exactly n for the restrictions, exactly 1 for every isogeny/quotient/endomorphism
      image, in 100% of instances including CM curves with j = 0 and j = 1728. A single
      dimension-2 object produced from E/F_p by an isogeny-theoretic operation refutes (B2)
      and reopens the channel.
  - observable: genus and model size of X_1(N)
    metric: >-
      genus computed from the formula and independently by counting, and the degree plus
      coefficient count of the raw Tate-normal-form defining polynomial F_N(b, c), for prime
      N from 11 to about 200
    predicted: >-
      genus = (N-5)(N-7)/24 exactly for prime N > 7, and model size growing at least linearly
      in N with no sublinear model found. A model of size O(polylog N) would refute (C) and
      would be a major finding.
  - observable: cost asymmetry between the point and the curve
    metric: >-
      field operations to compute (b, c) from (E, P), versus field operations to construct
      any model of X_1(N) mod p, at matched N
    predicted: >-
      O(log p) versus Omega(N), a separation growing without bound. This is the measurement
      that establishes (D) as a real asymmetry rather than a rhetorical one.
  - observable: crossover against rho
    metric: >-
      the ratio (cost of the cheapest modular-model computation) / (0.886*sqrt(N)) as N grows
    predicted: >-
      growing like Omega(sqrt(N)), i.e. the modular route never wins. IF THE MEASURED RATIO
      EVER FALLS BELOW 1, pause condition P3 applies: the value is NOT to be stated in any
      record, the run is flagged and handed to the Coordinator.
  minimal_test:
    design: |-
      Toy, single machine, well under one CPU-hour, no attack.
      STAGE 0 (zero compute, HARD GATE): verify the Tate normal form by direct substitution --
        that the transformation puts an arbitrary (E, P) with ord(P) >= 4 into
        y^2 + (1-c)xy - by = x^3 - bx^2 with P = (0,0), and that (b, c) determines (E, P) up
        to isomorphism. If this fails the asymmetry in (D) does not exist.
      STAGE 1 (minutes): for a toy p of 16-24 bits and prime N from 11 to about 60 with
        N | #E(F_p), compute (b, c) for (E, [i]P) for all i, and count field operations.
      STAGE 2 (minutes): compute the genus of X_1(N) from the formula and check it against an
        independent computation for the small N where X_1(N) is a plane curve of manageable
        degree; record the model's degree and coefficient count.
      STAGE 3 (minutes): point-count Res_{F_{p^n}/F_p}(E) for n = 1, 2, 3 and the quotients
        E/S for the small rational subgroups S, and read off dimensions.
      STAGE 4 (zero compute): assemble the cost table of (C) with measured numbers and state
        the ratio against 0.886*sqrt(N).
    controls:
    - >-
      NEARBY-OBJECT CONTROL WHERE THE CONCLUSION IS KNOWN FALSE (mandatory): run Stage 3 for
      a curve over F_{p^2} or F_{p^6}, where Weil descent DOES produce a higher-dimensional
      object and GHS is a real attack for suitable parameters. The dimension count must come
      out greater than 1 there. A pipeline reporting dimension 1 everywhere has not measured
      dimension.
    - >-
      NULL OBJECT for Stage 2: a random plane curve over F_p of the same genus as X_1(N).
      Its model size must be comparable, showing that the Omega(N) price is a genus
      consequence and not something peculiar to the modular model -- and, conversely, if
      X_1(N)'s optimized models are much smaller than the random null at equal genus, that
      gap is itself the interesting quantity and is reported.
    - >-
      INSTRUMENT NULL: N = 5, 7, where X_1(N) has genus 0 and the model is trivial. The
      pipeline must report genus 0 and a constant-size model; anything else is a bug.
    - >-
      CM CONTROL: include j = 0 and j = 1728 curves in Stage 3. The dimension must still be 1.
      If extra automorphisms changed the dimension, the dimension claim would be using
      genericity it has not declared.
    required_metrics:
    - field operations for (b, c) from (E, P), per instance
    - genus of X_1(N) and model degree/coefficient count, per N, plus the random-genus null
    - dimensions from point counts for restrictions (n = 1, 2, 3) and for isogeny images
    - the assembled cost ratio against 0.886*sqrt(N), per N
  controls:
  - >-
    See minimal_test.controls. The load-bearing one is the F_{p^2}/F_{p^6} nearby-object
    arm: it is the setting where the record's conclusion is FALSE, and the argument must be
    seen to fail there or it has not used the prime-field hypothesis.
  confounders:
  - >-
    "Model size" is implementation-dependent; optimized models of X_1(N) are much smaller
    than naive ones. The claim is Omega(N), an asymptotic lower bound tied to the genus, and
    the measurement must report which model family was used rather than reporting a single
    number.
  - >-
    Genus is not the only cost driver for Jacobian index calculus; the constant field size
    and the balance between them matter. The record's comparison is deliberately crude
    (Omega(N) versus sqrt(N)) because the margin is a square root and no refinement can close
    it; a refinement that appeared to close it would be a P3 event.
  - >-
    (B3) is about relations, not about factor-base size. A reader may object that the class
    supplies more points; the answer is that factor-base size is already a free parameter in
    every index-calculus design and increasing it is priced in the existing analyses.
  falsification_conditions:
  - >-
    Any isogeny-theoretic operation on E/F_p producing an abelian variety of dimension > 1.
    (B2) is refuted and the campaign's resource taxonomy gains a dimension-multiplying entry,
    which would be a major result.
  - >-
    A model of X_1(N) mod p of size sublinear in N, or a method of evaluating a level-N
    modular function at (E, P) in time o(N) that does not reduce to the Tate normal form.
    (C) is refuted and the modular route must be repriced.
  - >-
    The Tate normal form failing to determine (E, P) up to isomorphism, or costing more than
    O(log p). (D)'s asymmetry evaporates and the companion record d69ebe loses its premise.
  - >-
    The nearby-object control returning dimension 1 over F_{p^2}. The instrument is broken
    and no conclusion may be drawn.
  interpretation_limits:
  - >-
    Toy scale only, and every conclusion is scoped to the constructions named: Weil
    restriction, isogeny-theoretic operations, cross-class factor bases, and algorithms
    requiring a model of the modular curve.
  - >-
    (C) prices the MODEL, not the mathematics. It does not say the modular world is useless;
    it says any use must avoid constructing the curve, which is exactly (D).
  - >-
    Nothing here bears on phi-stable factor bases or on H-STR-002. (B3) discusses factor
    bases spread ACROSS CURVES, never a phi-orbit factor base on one curve. Not P2-adjacent.
  assumptions:
  - E/F_p, p > 3, N prime with N | #E(F_p), N >= 11 for the modular arm.
  - >-
    'Jacobian index calculus over F_q with a degree-1-place factor base and 1/g! decomposition
    probability, subexponential for growing g [recall-confident: Adleman-DeMarrais-Huang;
    Enge-Gaudry; NOT re-verified this session].'
  - >-
    'Res_{F_{q^n}/F_q} of an elliptic curve is an n-dimensional abelian variety, and GHS/Weil
    descent attacks exist over F_{q^n} for suitable n [recall-confident; NOT re-verified].'
  - >-
    'genus X_1(N) = (N-5)(N-7)/24 for prime N > 7 [recall-confident, classical; checked
    against small N in Stage 2 rather than assumed].'
  - >-
    'The Tate normal form for a pair (E, P) with ord(P) >= 4 [recall-confident, classical;
    verified by direct substitution in Stage 0 rather than assumed].'
  - Isogenies are surjective homomorphisms of abelian varieties with finite kernel, hence dimension-preserving. [fact]
  heuristic_assumptions: []
  proof_search_map:
    bottleneck: >-
      The source of the free genus parameter. Every function-field transfer to F_p stands or
      falls on it, and (B1)-(B3) plus (C) enumerate the four candidate sources with the exact
      step each one fails at.
    baseline_embedding:
      parameter_slice: >-
        E over F_{q^n} with n > 1 and a suitable cover: the classical GHS setting, where the
        argument must produce "descent available, dimension n" and reproduce the known attack
        family.
      reproduction_check: >-
        Computational, Stage 3 nearby-object arm: point-count the Weil restriction over
        F_{p^2} and F_{p^6} and check the dimension equals the extension degree exactly.
    observation_collision:
      observable: >-
        The pair (available descent dimension, achievable genus) attached to a setting.
      distinct_preimage_search: >-
        Two settings with the same observable and different difficulty: E/F_p and E/F_{p^q}
        for prime q where GHS is known NOT to apply both present (1, 1) after accounting, and
        both are hard -- consistent. A collision that would falsify identifiability would be
        a setting with observable (1, 1) that is nonetheless subexponentially breakable by
        function-field means; none is known to this record, and finding one is the sharpest
        available attack on (B).
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        Move the ECDLP into a Jacobian where index calculus is an exact rank/vanishing
        condition, via the level-N modular curve.
      predicted_gain: >-
        Negative: the encoding obligation costs Omega(N) against a sqrt(N) baseline. Naming
        which obligation fails (encoding, not soundness) is the deliverable.
    - transform: observable_fiber
      proposed_object: >-
        Hold "subexponential Jacobian DLP" fixed and vary the forgotten structure (base
        field, genus source) to isolate which one carries it.
      predicted_gain: >-
        The invariant is predicted to be the ratio g / log q, and the four candidate sources
        are the calibration points.
    quantifier_order: >-
      FORALL E/F_p and FORALL objects Y obtained from E by isogenies, quotients by finite
      subgroups, endomorphisms, or products thereof over F_p: dim Y is a positive integer
      multiple of 1 with no factor coming from the base, i.e. no such operation multiplies
      dimension by an extension degree. The order matters: EXISTS Y FORALL E would permit a
      single clever construction and is exactly what a falsifier would exhibit.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The named function-field routes (Weil descent, endomorphism-manufactured dimension,
        cross-class factor bases, level-N modular Jacobians) are each unavailable or
        Omega(sqrt(N))-dominated over F_p." It can NEVER certify that no function-field
        technique applies, and in particular it says nothing about techniques that avoid
        constructing a model.
      nearby_object_control: >-
        E over F_{q^n} with n > 1, where the conclusion is FALSE. Mandatory, and it is Stage 3's
        second arm.
    proof_obligations:
    - claim: Subexponentiality in Jacobian index calculus comes from growing g at fixed q.
      responsibility: baseline
    - claim: F_p has no proper subfield, so Weil descent has no input.
      responsibility: feasibility
    - claim: Isogenies and endomorphisms preserve dimension.
      responsibility: correctness
    - claim: Relations must be evaluated in a single group, so cross-class factor bases give size only.
      responsibility: interface
    - claim: genus X_1(N) = Theta(N^2) and any model costs Omega(N).
      responsibility: size
    - claim: The instance's coordinates (b, c) cost O(log p).
      responsibility: runtime
    - claim: All conclusions are scoped to the four named routes.
      responsibility: scope
    not_applicable_reason: null
  target_complexity:
    time_exponent: >-
      No ECDLP exponent moves and none is claimed. The record PRICES a route: any algorithm
      requiring a model of the level-N modular curve costs Omega(N) field operations against
      the 0.886*sqrt(N) group operations of parallel rho, i.e. it is Omega(sqrt(N)) worse.
      That is a lower bound on a route, not an upper bound on an attack.
    memory_exponent: >-
      Omega(N) for the modular-model route, against O(1) for rho -- a second axis on which
      the route loses, and it is recorded so that a time-memory tradeoff cannot be used to
      rescue it.
    best_known: >-
      Parallel rho at 0.886*sqrt(N), O(1) memory (KN-TECH-001, KN-TECH-006). For function
      fields: subexponential Jacobian index calculus for growing genus [recall-confident].
      Neither is moved.
    hidden_overhead: >-
      The Omega(N) figure is a lower bound from the genus and hides the actual constants of
      any particular model family, which are much worse; the record uses the lower bound
      deliberately so that the conclusion cannot be blamed on an inefficient implementation.
    tradeoff_note: >-
      Not applicable to any proposed algorithm. Recorded for the priced route: it loses on
      time AND memory simultaneously, so no van Oorschot-Wiener style interpolation helps it.
  sota_delta: >-
    Zero on every axis. Quantitatively, the priced route is worse than the baseline by a
    factor Omega(sqrt(N)) in time and Omega(N) in memory. Deliverable delta, as counts:
    1 identification of the function-field gift as a free genus parameter, 3 candidate
    sources of that parameter over F_p each closed at a named step, 1 dimension-preservation
    statement covering four of the campaign's eight resources at once, 1 quantified price for
    the only canonical high-genus object over F_p, and 1 explicitly stated escape route
    handed to a companion record.
  dominated_by: >-
    AS AN ATTACK: none is mounted; dominated on every axis by every frontier row. Rows checked
    before writing this field: parallel rho 0.886*sqrt(N) / O(1) memory (KN-TECH-001,
    KN-TECH-006); automorphism-discounted rho (KN-TECH-018); BSGS sqrt(N)/sqrt(N)
    (KN-TECH-031); Frey-Ruck/MOV (KN-TECH-032); anomalous transfer (KN-TECH-033); GHS/Weil
    descent over F_{q^n} -- inapplicable to F_p and named as the nearby object; subexponential
    Jacobian index calculus over function fields -- inapplicable, and (C) prices the one place
    it could reach. Time, memory and data/queries all checked. AS A CLOSURE: complementary to
    the several corpus records that declare Weil descent off-limits as a lens; none of them
    prices the modular-Jacobian route or states the dimension-preservation property of the
    taxonomy, so neither dominates this record and it dominates none of them.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: >-
    0.97 that (B1) and (B2) are exactly right (both are one-line facts). 0.85 that (B3)
    survives review in the sharp "size only, no new relation" form. 0.9 that the genus and
    model-size measurements confirm (C). 0.8 that the Tate-normal-form asymmetry in (D)
    verifies as stated, which is the premise of the companion record. 0.0 that this record
    yields an attack, by construction. The value is that it prices a route the campaign would
    otherwise have to price later, and that it hands over one precisely stated survivor.
  novelty_status: unverified
  novelty_screen: >-
    WEB SEARCH AND WEB FETCH WERE UNAVAILABLE THIS SESSION (backend model error on every
    attempt), so external novelty is NOT established; the Enge-Gaudry / ADH, GHS and
