    ledger/proposals/ for "Weil descent", "GHS", "function field", "Enge-Gaudry", "cover
    attack", "trace-zero variety", "modular curve", "X_1(N)", "level structure", "genus".
    Weil descent appears in at least a dozen records, always as an off-limits lens or as a
    nearby object over F_{q^n}; NO record computes the dimension-preservation property across
    the R1-R8 taxonomy, and NO record prices the level-N modular Jacobian against rho. The
    single closest sentence in the corpus is IDEA-20260806-0c9de1's confounder note on the
    genus of X_1(N), which is a feasibility warning about its own toy computations and is
    cited here rather than reused.
  discriminated_from: |-
    - IDEA-20260806-0c9de1. Notes the genus N^2/24 as a barrier to its own toy computations.
      This record turns the same number into a priced comparison against the rho baseline,
