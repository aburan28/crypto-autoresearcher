        the case that p^k - 1 has a small divisor for k >= 3 and states "It
        seems that our algorithm is only effective for k = 1, 2, that is, the
        original Cheon's algorithm." The number of powers the k >= 3
        construction needs and its exact cost were NOT read (abstract page
        only); c_k is therefore tabulated at both 1 and k. No KN-LIT entry
        exists for this paper (grep of knowledge/literature for 2009/058 and
        the title: no hit).
      verified_by: idea-generator, this session (TASK-20260930-56a5c7), WebFetch of the abstract page.
    - ref: https://eprint.iacr.org/2012/609
      provenance: retrieved
      claim: >-
        Kim-Cheon, "A New Approach to the Discrete Logarithm Problem with
        Auxiliary Inputs", abstract: given g, g^alpha, ..., g^{alpha^d}, the
        running time is O~(sqrt(p/tau_f) + d) group exponentiations for a
        chosen polynomial f of degree d, with tau_f determined by the number
        of absolutely irreducible factors of f(x) - f(y). The PDF was
        fetched but could not be rendered; the bound tau_f <= d and the
        characterisation of equality (x^d for d | p - 1, Dickson for
        d | p + 1) are RECALLED from the same line of work and not read. No
