idea:
  id: IDEA-20260930-6bde2d
  question_id: RQ-AUXIN-f8d8c0
  goal_id: GOAL-AUXIN-a93442
  added: '2026-10-01'
  status: proposed
  approved_by: null
  title: >-
    THE Phi_k AXIS UNDER A SUPPLY CAP: for k in {3, 4, 6, 8, 12} the q-smooth
    part of Phi_k(r) (primes l = 1 mod k only) on every census row and on the
    random-prime null arm, priced through the Kim-Cheon tau_f bound and
    Satoh's published negative, with the supply-cap ceiling
    e >= 1/2 - log_r(q_max)/2 stated as the method ceiling of the whole
    polynomial-embedding family and the 2-adicity rows as the arithmetic
    control on which no k > 2 branch can add more than sqrt(2)
  class: control

  claim: >-
    Cheon's two branches are the k = 1 and k = 2 cases of embedding the
    unknown scalar x into the torus T_k(F_r) of order Phi_k(r) inside
    F_{r^k}^*: Phi_1(r) = r - 1 and Phi_2(r) = r + 1. The handoff asks what
    the attack reaches when the usable divisor lies in Phi_k(r) for k > 2.
    THREE CLAIMS, EACH DECIDABLE. (C1, arithmetic ceiling, exact) Under a
    supply cap of q_max released consecutive powers, every branch of the
    polynomial-embedding family (Cheon r - 1 with f = x^d; Cheon r + 1 with
    Dickson f; Satoh's Phi_k; Kim-Cheon's general f of degree d) has gain at
    most sqrt(d) <= sqrt(q_max) over the sqrt(r) baseline in Cheon steps,
    because the Kim-Cheon cost is O~(sqrt(r/tau_f) + d) with tau_f <= d
    (retrieved abstract for the cost; tau_f <= deg f recalled). Hence the
    method ceiling of the whole family is e >= 1/2 - log2(q_max)/(2 log2 r)
    in Cheon steps, e.g. 0.443 at q_max = 2^29 and 254-bit r. (C2, control,
    exact) On any row with v_2(r - 1) >= floor(log2 q_max) the r - 1 branch
    already attains d_max >= 2^{floor(log2 q_max)} > q_max/2, so no k > 2
    branch can exceed it by more than a factor sqrt(2) in gain even with the
    most favourable power-count assumption c_k = 1; the pairing rows
    BLS12-381-r and BN254-r (recalled 2-adicities 32 and 28) are therefore
    control rows on which the Phi_k axis is closed by arithmetic before any
    factoring. (C3, open, measured) On rows without saturated 2-adicity
    (NIST P-224/256/384/521, secp256k1, brainpool, Ed25519-L, and the
    random-prime null arm) under hypothetical caps q_max in {2^12, 2^20,
    2^30}, the best k > 2 branch (largest d | Phi_k(r) with c_k d <= q_max,
    k in {3, 4, 6, 8, 12}) is or is not strictly better than the best of the
    r - 1 and r + 1 branches. The record's prior is PHIK_NEVER_BEST at
    c_k = k (Satoh's retrieved abstract: the generalisation "seems only
    effective for k = 1, 2") and genuinely undecided at c_k = 1, which is why
    both are computed. Either outcome is publishable: PHIK_NEVER_BEST closes
    the axis at deployed parameters with a certificate; PHIK_BEST_SOMEWHERE
    names the (row, cap, k, d) and routes it to the supply roster of
    IDEA-20260930-68326c as an S2 question, since no S1 supply exists on
    those rows.

  mechanism: >-
    TRACKED OBJECT. Per (row, k): the q_cap-smooth part S_k(r, q_cap) of
    Phi_k(r) with its certified prime factorisation, and the derived
    quantity d_k(q_max, c_k) = max { d | S_k : c_k d <= q_max }. WHY ONLY
    PRIMES l = 1 (mod k). A prime l not dividing k divides Phi_k(r) iff the
    multiplicative order of r modulo l is exactly k, which forces k | l - 1;
    primes dividing k can divide Phi_k(r) only to bounded power. So the
    q_cap-smooth part of Phi_k(r) is found by trial division over primes
    l = 1 (mod k) up to q_cap (plus the primes of k), a search of about
    pi(q_cap)/phi(k) divisions of an integer of phi(k) log2 r bits, with no
    ECM and no cofactor ambiguity for the part that matters: divisors above
    q_cap are useless under the cap by (C1), so the unfactored cofactor
    carries no decision. LOSSY-PROJECTION TEST. (curve) -> (S_k(r, q_cap) for
    k in K) discards the field, the equation, the group, and the entire
    large part of Phi_k(r); it keeps exactly what any torus-embedding branch
    can use under the cap. The discard is compatible with the operation (the
    branch chooses a divisor of Phi_k(r) not exceeding q_max / c_k), so the
    retained part decides the branch's best gain deterministically. WHY k > 2
    IS EXPECTED TO LOSE. Under the heuristic H1 below, for a random prime r
    the expected log of the q-smooth part of Phi_k(r) is about log q for
    every k (density 1/phi(k) of admissible primes times phi(k) elements of
    order k in F_l^*), so Phi_k(r) is not systematically smoother than r - 1;
    it is lumpier (fewer, larger admissible primes), r - 1 and r + 1 carry
    the guaranteed factor 2, and the Phi_k branch pays the power-count
    factor c_k (recalled as of order k from Satoh's construction, which
    needs powers spanning the degree-k embedding; UNCHECKED until the full
    paper is read, hence both c_k = 1 and c_k = k are tabulated). THE
    GENERIC SANDWICH (recalled, conditional). Boneh-Boyen's generic bound on
    q-SDH is recalled as Omega(sqrt(r/q)); if it holds as recalled, the
    r - 1 branch at d = q_max on a saturated row attains the generic lower
    bound in exponent, and the whole generic class is closed under the cap
    up to the step unit. This is stated as the closure argument's named
    obstruction and is marked recalled; the record's verdicts do not depend
    on it. FORWARD GUIDANCE if the closure holds: the remaining class is
    non-generic (representation-exploiting) algorithms on pairing curves,
    i.e. index calculus in G_T, which is outside this question.

