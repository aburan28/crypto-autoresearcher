  citation_note: >-
    Two abstracts retrieved this session (Satoh, Kim-Cheon) carry the
    published negative and the cost framework; the bound tau_f <= d and the
    power count c_k for k >= 3 are recalled and are the first proof
    obligations. Every arithmetic statement in (C1) and (C2) is re-derived
    here from the stated cost expressions and is exact given them.

  assumptions:
    - >-
      The rows are the census's ten pinned orders plus its random-prime null
      arm (same seeds, same bit classes), frozen before any Phi_k value is
      computed; no row is added after a value is seen.
    - >-
      Caps q_max in {2^12, 2^20, 2^30} and q_cap = 2^30 for the smooth-part
      search are declared here; K = {3, 4, 6, 8, 12} is declared here.
    - >-
      c_k is tabulated at 1 (most favourable to the Phi_k branch, so a
      PHIK_NEVER_BEST verdict at c_k = 1 is conservative) and at k (recalled
      order of Satoh's requirement); the true c_k is a proof obligation.
    - >-
      Supply on non-pairing rows is S3 (none) per IDEA-20260930-68326c; the
      k > 2 question there is a hypothetical-supply question and is labelled
      so in every cell.
    - DEC-20260802-204's acquisition gate stands.

  proof_search_map:
    bottleneck: >-
      Whether any torus-embedding branch other than r - 1 and r + 1 can
      change a deployed cell's verdict under a realistic supply cap, or
      whether the family's ceiling e >= 1/2 - log_r(q_max)/2 is already
      attained by the r - 1 branch on every row where supply exists.
    baseline_embedding:
      parameter_slice: >-
        k = 1 and k = 2 reproduce the census's own branches: S_1(r, q_cap)
        must equal the q_cap-smooth part of the census's certified r - 1
        factorisation, and S_2 that of r + 1, on every row (C-K12). Any
        disagreement is an instrument defect and no k > 2 value is read.
      reproduction_check: >-
        Zero-run arithmetic: (C1) from the Kim-Cheon cost at tau_f <= d; (C2)
        from d_max >= 2^{floor(log2 q_max)} on saturated rows; the ceiling
        value 0.443 at q_max = 2^29, log2 r = 254 recomputed by the reviewer.
    observation_collision:
      observable: >-
        Per (row, k, cap): S_k with certified factorisation, d_k at c_k = 1
        and c_k = k, the r - 1 and r + 1 comparison values d_1, d_2 from the
        census, the verdict PHIK_NEVER_BEST / PHIK_BEST / TIE.
      distinct_preimage_search: >-
        A PHIK_BEST cell can arise from (i) genuine structure of a deployed
        r, (ii) the generic lumpiness of Phi_k smooth parts (large admissible
        primes land below the cap by chance), or (iii) a cap chosen after
        seeing values. (iii) is excluded by freezing caps here; (ii) is
        separated by the null arm's PHIK_BEST frequency at the same caps; (i)
        is what remains and is reported stratified exactly as the census
        stratifies (expected_structure_flag).
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The per-(row, k, cap, c_k) tuple (S_k, d_k, d_1, d_2, verdict),
          with the family ceiling as the frame.
        predicted_gain: >-
          A closure of the Phi_k axis at deployed parameters with a
          certificate, or a named hypothetical-supply cell; no exponent.
      - transform: observable_fiber
        proposed_object: >-
          Hold the cap fixed and vary the row class: saturated 2-adic rows
          (predicted TIE within sqrt 2 by arithmetic), unsaturated deployed
          rows (undecided), random primes (the generic rate).
        predicted_gain: Separates structure from chance at zero extra cost.
    quantifier_order: >-
      (C1) FOR ALL polynomial-embedding branches and ALL d <= q_max: gain
      <= sqrt(q_max) (exact given tau_f <= d). (C2) FOR ALL rows with
      v_2(r - 1) >= floor(log2 q_max) and ALL k > 2: gain_k <= sqrt(2)
      gain_1 (exact). (C3) FOR EACH unsaturated row and cap: EXISTS k > 2
      with d_k(c_k) > max(d_1, d_2), or not - measured. No statement about
      caps or k outside the declared sets.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On the frozen rows and caps, no k in {3, 4, 6, 8, 12} branch beats
        the best of the r - 1 and r + 1 branches at c_k = k (or at c_k = 1),
        and the family ceiling under cap q_max is e >= 1/2 - log_r(q_max)/2
        in Cheon steps." It certifies nothing about k outside K, nothing
        about non-polynomial-embedding algorithms, and nothing about supply.
      nearby_object_control: >-
        The saturated pairing rows, where the conclusion "k > 2 cannot help"
        holds by arithmetic regardless of Phi_k's smoothness (the
        proves-too-much object), and the random-prime null arm, where
        PHIK_BEST at c_k = 1 is expected to occur at some nonzero generic
        rate (the object on which the desired conclusion is expected to fail
        sometimes).
    proof_obligations:
      - claim: tau_f <= deg f for the Kim-Cheon framework, with equality characterised (read the source).
        responsibility: correctness
      - claim: The power count c_k of Satoh's k >= 3 construction (read the source); until then both c_k = 1 and c_k = k are reported.
        responsibility: interface
      - claim: Every S_k factorisation is certified (primes proved, product check) and the k = 1, 2 cases reproduce the census.
        responsibility: baseline
      - claim: Trial division over primes l = 1 (mod k) up to 2^30 finds every prime divisor of Phi_k(r) below 2^30 not dividing k (exact by the order argument).
        responsibility: correctness
      - claim: The ceiling and the sqrt(2) control are exact given the cost expressions and are labelled in Cheon steps per CORR-20260923-187ea3.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: verdict on saturated rows (BLS12-381-r, BN254-r) at every cap and k
      direction: same
      minimum_effect: >-
        TIE-or-worse within sqrt(2) by arithmetic; any gain_k / gain_1 >
        sqrt(2) on these rows is an instrument defect, never a result.
    - metric: PHIK_BEST count over unsaturated deployed rows x caps at c_k = k
      direction: lower
      minimum_effect: >-
        Prior: 0 of 24 cells (8 rows x 3 caps). The claim PHIK_NEVER_BEST(c_k
        = k) is falsified by a single certified PHIK_BEST cell.
    - metric: PHIK_BEST count at c_k = 1 on the same cells
      direction: different
      minimum_effect: >-
        Undecided; reported with the null arm's rate at the same caps
        (Clopper-Pearson 95 percent). A deployed-row count above the null's
        upper bound is structure; within it is chance.
    - metric: null-arm frequency of l | Phi_k(r) for primes l = 1 (mod k), l <= 2^16, against phi(k)/(l - 1)
      direction: same
      minimum_effect: >-
        Chi-square consistent at the 5 percent level per k over >= 200 random
        primes per bit class; a systematic excess falsifies H1 and the
        "comparable in expectation" reading.
    - metric: family ceiling e_min(q_max) = 1/2 - log2(q_max)/(2 log2 r), per row and cap (Cheon steps)
      direction: different
      minimum_effect: >-
        Printed beside every cell as the floor no branch can cross; a
        tabulated value below it is an evaluator defect (analogue of the
        census floor_invariant).

  minimal_test:
    design: >-
      ROWS: the ten census orders (pinned by the census's own Stage P
      procedure, consumed from its orders.json; never re-pinned here) and the
      census null arm extended to 200 random primes per bit class (seeded
      stream recorded; the census's 16 are a subset). K = {3, 4, 6, 8, 12};
      q_cap = 2^30; caps q_max in {2^12, 2^20, 2^30}; c_k in {1, k}.
      PROCEDURE. (0) Zero-run arithmetic: (C1), (C2), the ceiling table.
      (1) C-K12: compute S_1 and S_2 by the same trial division and check
      them against the census's certified lattices restricted to 2^30.
      (2) For each row and k: Phi_k(r) in exact integers; trial division by
      primes l = 1 (mod k), l <= 2^30, and by primes dividing k; certify each
      prime found (Baillie-PSW screen, then a certificate as the census
      does); record S_k and the cofactor's bit length (unused by any
      verdict). (3) For each cap and c_k: d_k = max divisor of S_k with
      c_k d <= q_max (enumerated from S_k's lattice); d_1, d_2 from the
      census lattices under q_max and q_max/2; verdict PHIK_BEST iff d_k >
      max(d_1, d_2) for some k > 2, TIE iff equal, else PHIK_NEVER_BEST.
      (4) Null arm: identical pipeline; frequencies of l | Phi_k(r) against
      phi(k)/(l - 1) for l <= 2^16; PHIK_BEST rate per cap and c_k with
      Clopper-Pearson intervals. (5) Table per CORR-20260923-187ea3's
      labelling rule (Cheon steps; branch; input model; bits of d; c_k).
      SAMPLE SIZES: 10 deployed rows x 5 k x 3 caps x 2 c_k; 200 null primes
      per bit class (five classes) x 5 k. SEEDS: one PCG64 stream for the
      null arm, recorded. OUTCOME TABLE. CLOSURE (publishable): every
      unsaturated deployed cell PHIK_NEVER_BEST at c_k = k AND the saturated
      rows TIE within sqrt 2 - the Phi_k axis is closed at deployed
      parameters under the declared caps with a certificate, the named
      obstruction being the ceiling plus the r - 1 attainment (and, if the
      recalled generic bound is later retrieved, the generic sandwich).
      OPEN (publishable): a certified PHIK_BEST cell at c_k = k - named,
      stratified, compared with the null rate, routed to the supply roster
      as a hypothetical-supply S2 cell; no vulnerability claim. ARTIFACT:
      C-K12 mismatch, any uncertified prime, any gain above the sqrt 2
      control on a saturated row, or any tabulated value below the ceiling -
      void. FALSIFICATION THRESHOLDS, FIXED NOW: PHIK_NEVER_BEST(c_k = k) is
      falsified by one certified PHIK_BEST cell; H1 is falsified by a
      chi-square p < 0.05 on the null arm for any k; (C2) is never falsified
      by data (it is arithmetic) - a violation voids the instrument. COST
      (estimate): implementation low (about 300 lines on the census's
      certification helpers); compute low (trial division of 10 x 5 integers
      of up to about 2100 bits by about 5 x 10^7 primes, plus 1000 x 5 null
      integers; hours on one core in Python, minutes in C).
    controls:
      - "C-K12 baseline: k = 1 and k = 2 must reproduce the census's certified r - 1 and r + 1 lattices restricted to 2^30 on every row."
      - "Saturated-row arithmetic control: BLS12-381-r and BN254-r must show gain_k / gain_1 <= sqrt(2) at every cap and k."
      - "Planted positive: a synthetic prime r with a planted prime l = 1 (mod 3), l about 2^25, dividing Phi_3(r) (constructed by choosing r a root of Phi_3 modulo l and lifting by CRT to a prime), and r - 1, r + 1 made 2^14-rough beyond small factors; the pipeline must return PHIK_BEST at cap 2^30 with d_3 = l."
      - "Divisor-free null: a synthetic prime r whose Phi_k(r) for k in K have no prime factor below 2^30 other than primes of k, and r - 1 = 2 q' safe; every verdict must be PHIK_NEVER_BEST with d_k <= 12."
      - "Random-prime null arm through the identical pipeline, reported beside the deployed rows, never pooled."
    required_metrics:
      - "per (row, k): S_k with certified factorisation, cofactor bit length, trial-division bound"
      - "per (row, k, cap, c_k): d_k, d_1, d_2, verdict, gain ratio, the ceiling e_min"
      - "null arm: l-divisibility frequencies vs phi(k)/(l - 1), chi-square per k; PHIK_BEST rate per cap and c_k with CP95"
      - control outcomes (C-K12, saturated rows, planted, divisor-free)
      - compute time per integer (secondary)

  falsification_conditions:
    - "PHIK_NEVER_BEST(c_k = k) falsified iff at least one certified deployed cell has d_k > max(d_1, d_2) with c_k = k."
    - "H1 falsified iff the null-arm l-divisibility frequencies reject phi(k)/(l - 1) at p < 0.05 for any k in K."
    - "Instrument void iff C-K12 mismatches, any prime is uncertified, a saturated row exceeds the sqrt(2) control, or any tabulated value lies below the ceiling e_min."
    - "The ceiling (C1) is falsified only by a source showing tau_f > deg f or a branch with gain exceeding sqrt(d) at d powers; that is a literature event, recorded as a correction, not a run outcome."

  confounders:
    - "c_k unknown until Satoh is read in full; the c_k = 1 column is deliberately over-generous to the Phi_k branch and a PHIK_BEST there is not an attack."
    - "Caps are hypothetical on non-pairing rows (no S1 supply exists there); every such cell is labelled hypothetical-supply."
    - "The step unit for a degree-k torus walk is larger than for k = 1 (arithmetic in F_{r^k}); not priced here, which again favours the Phi_k branch in the comparison, so a PHIK_NEVER_BEST verdict is conservative."
    - "Primes dividing k and the prime 2 are handled as special cases; an off-by-one there would bias small-d cells, which the planted and divisor-free controls catch."
    - "The null arm's 200 primes per class bound the generic PHIK_BEST rate only to about +-7 percent at 95 percent."

  interpretation_limits:
    - "An arithmetic control under declared caps and k; no attack is run, no logarithm recovered, no exponent moved, no vulnerability claimed."
    - "Verdicts are in Cheon steps and carry CORR-20260923-187ea3's labelling; the step-unit comparison with rho is IDEA-20260930-68326c's and IDEA-20260930-704e43's."
    - "The generic sandwich is a recalled, conditional remark until the Boneh-Boyen bound is retrieved and filed."
    - "k outside K and non-polynomial-embedding algorithms are outside the certifiable claim."

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Random-like divisibility of Phi_k(r).) For the deployed primes r, the
        events l | Phi_k(r) over primes l = 1 (mod k), l not dividing k, occur
        with probability phi(k)/(l - 1) and are independent across l, as for
        a uniformly random prime of the same size; consequently the expected
        log of the q-smooth part of Phi_k(r) is about log q for every k, as
        for r - 1.
      rigorous_support: >-
        For a uniformly random prime r, r mod l is equidistributed over
        (Z/l)^* (Dirichlet), and the number of elements of exact order k in
        F_l^* is phi(k), giving P(ord_l(r) = k) = phi(k)/(l - 1) exactly;
        Mertens in arithmetic progressions gives the sum over admissible l
        of log l/(l - 1) about (log q)/phi(k). The heuristic content is only
        that deployed r behave like random r for these events (false by
        construction on the pairing rows, which are controls, not samples).
      validation_plan: >-
        SAMPLE 200 random primes per bit class (224, 256, 384, 521, and the
        pairing classes) via the recorded PCG64 stream; COMPARE the empirical
        frequency of l | Phi_k(r) with phi(k)/(l - 1) for all l <= 2^16 by
        chi-square per k, and the empirical distribution of log2 S_k(r, 2^30)
        with the predicted mean log2(2^30) and the simulated distribution
        under independence; TAIL: the largest S_k observed against the
        simulated maximum over the same sample size. TRANSFER: none claimed
        beyond the sampled bit classes.

