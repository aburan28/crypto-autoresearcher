idea:
  id: IDEA-20260812-a3720a
  question_id: RQ-CLGP-b99df5
  added: '2026-08-12'
  proposed_by: idea-generator
  status: proposed
  class: mechanism

  title: >-
    The ray-class torsor bridge. For an ordinary conductor-1 curve the ECDLP is
    exactly vectorization inside the LEVEL FIBER of Cl_n(O) -> Cl(O) with
    n = (pi - 1); this makes within-class uniformity a theorem rather than an
    absence-of-evidence claim, and it prices every isogeny-class-walk attack at
    p^{3/4} because the class contributes p^{1/2} of extra haystack and zero
    extra information.

  object: >-
    TRACKED OBJECT. The ray-class coordinate of a LABELLED PAIR (E prime, R),
    where E prime ranges over the F_p-isogeny class and R is a generator of the
    prime-order group E prime (F_p). Nothing else about the pair is retained --
    not the Weierstrass model, not the field representation of the coordinates,
    not the j-invariant except as an index. Established families for this target
    that this record deliberately does NOT use as its lens - isogeny transfer to
    a weak destination (closed, EV-ECDLP-b3e847), graph spectrum (wrong null,
    IDEA-20260806-bcbcf5), isogeny-graph query model (IDEA-20260806-d5a34e),
    minimum-height representative (IDEA-20260726-009), Semaev heavy tail
    (IDEA-20260731-016). The candidate objects enumerated before choosing this
    one, with scores on (new / testable / survival depth), were - j-invariant
    (repackaging / testable / dissolves at once, it is class-invariantly
    useless); the point image under an isogeny (repackaging of
    IDEA-20260807-053a55 / testable / one step); the Cl(O) ideal class alone
    (known, this is vectorization / testable / survives but is orthogonal to the
    point); the RAY class of the pair (new here / testable, its one-step
    propagation is an explicit group multiplication / survives the whole walk
    because the action is free and transitive); the Weierstrass coefficient
    vector (tested and closed by ISO-EXP-A2). The ray class scored highest on
    all three axes and is the lens of this record. Note that this programme has
    no written object-enumeration for the ECDLP -- that is KN-OPEN-019 -- so the
    above is a sketch, not a taxonomy.

  lossy_projection_test: >-
    The projection (E prime, R) -> its ray-class coordinate is genuinely lossy -
    it discards the entire field representation and the curve equation, keeping
    one element of a finite abelian group of order h(O)*(N-1)/2. What it
    discards is discarded COMPATIBLY with both operations of the target - an
    ell-isogeny step multiplies the coordinate by the class of the corresponding
    prime ideal, and a scalar multiplication R -> [m]R multiplies the LEVEL
    component by m. So the retained part propagates deterministically under
    exactly the two operations an isogeny-graph attack performs. It is therefore
    a new object and not a change of coordinates - a change of coordinates would
    have to retain enough to recover the Weierstrass model, and this does not.

  claim: >-
    Let E/F_p be ordinary with End_{F_p}(E) = O = Z[pi] (CM conductor 1, the
    slice P-256 occupies per ISO-EXP-001) and let N = #E(F_p) be prime. Write
    n = (pi - 1), an ideal of O of norm N. The record makes five statements,
    A1-A5, of which A1-A4 are executable at toy scale in full.

    (A1) EIGENVALUE MAP. The map lambda from O to Z/N sending a + b*pi to
    a + b mod N is a surjective ring homomorphism with kernel exactly n, so
    O/n is isomorphic to Z/N as a ring. For every alpha in O and every
    F_p-rational point R, alpha(R) = [lambda(alpha)]R. The formula is trivial
    once seen -- pi acts as the identity on F_p-rational points -- and it is the
    bridge map RQ-CLGP-b99df5 asks for.

    (A2) TORSOR. The ray class group Cl_n(O) acts freely and transitively on the
    set of pairs (E prime, R) with E prime in the F_p-isogeny class of E and R a
    generator of E prime (F_p), taken up to F_p-isomorphism. Cardinality check
    on both sides - h(O)*(N-1)/2 with O^* = {+1,-1}. The stabiliser computation
    is the content - a principal ideal (alpha) fixes the curve but moves the
    point to [lambda(alpha)]R, so the stabiliser of a PAIR is exactly the group
    of principal ideals generated by alpha congruent to 1 mod n, which is by
    definition the relation defining Cl_n(O).

    (A3) THE INSTANCE LIVES IN THE LEVEL FIBER. For an ECDLP instance
    (E, P), (E, Q = [k]P), the ray class connecting the two pairs lies in the
    kernel of the natural surjection Cl_n(O) -> Cl(O) -- the LEVEL SUBGROUP,
    isomorphic to (Z/N)^* modulo {+1,-1} -- and that kernel element IS k. Since
    the group is abelian and the action free, transporting both pairs by any
    ideal class (that is, walking to any other curve of the class by any
    F_p-isogeny) leaves the connecting element UNCHANGED. Therefore the
    transported instance on every class member is the identical group-theoretic
    object.

    (A4) COST OF THE WALK, AS AN EXPONENT. The torsor has size
    h(O)*(N-1)/2, which is of order p^{1/2} * p = p^{3/2} for h(O) =
    |D|^{1/2+o(1)} and |D| of order p. A collision search on the torsor -- the
    natural generalisation of every isogeny-graph attack, and the only way to
    recover the connecting ray class by generic means -- costs p^{3/4} time. That
    is STRICTLY WORSE than Pollard rho's p^{1/2} on the point group alone,
    because holding the Cl(O) coordinate fixed IS plain rho and letting it vary
    multiplies the search space by h(O) = p^{1/2}. The isogeny class is
    p^{1/2} of extra haystack, not extra information.

    (A5) METHOD CEILING. Index calculus inside the level fiber would require
    multiplying hidden residues mod N. Transported to the curve by A1, the ring
    multiplication of O/n is precisely the map ([a]P, [b]P) -> [a*b]P, i.e. the
    computational Diffie-Hellman map. So a subexponential level-fiber index
    calculus is a subexponential CDH algorithm on the same curve. This is the
    exact, nameable reason the subexponential relation collection that solves
    VECTORIZATION does not touch the ECDLP - the Cl(O) coordinate of a walk
    state is visible (compare j-invariants, and smoothness of an ideal is
    testable on its reduced form) while the level coordinate is equality-testable
    only, never smoothness-testable.

    CONSEQUENCE FOR THE STANDING CLOSURE. Obstruction 4 of EV-ECDLP-b3e847
    (within-class uniformity), recorded by TASK-20260807-d8bb19-redteam as
    EMPIRICAL rather than proven, becomes a THEOREM for the class of algorithms
    that factor through the torsor structure, scoped to conductor 1 and prime N.
    It remains NON-proven for algorithms that read the Weierstrass coefficients
    directly, which is exactly the residue ISO-EXP-A2 tested and
    EXP-ISOU-2ac81f will measure.

  mechanism: >-
    Classical complex multiplication says the ideal class group acts freely and
    transitively on the isogeny class, and that adjoining a level structure --
    a marked torsion point -- refines the Hilbert class field to a ray class
    field. Reduced mod p, the same refinement says the object being permuted is
    the PAIR (curve, marked generator), not the curve. The ECDLP is the problem
    of finding the group element connecting two pairs on the SAME curve, which
    is the fiber of the torsor over the identity of Cl(O). An isogeny walk moves
    only the base coordinate, so it can neither shrink nor even perturb the fiber
    coordinate where the whole difficulty sits. That is the causal statement, and
    it converts a negative empirical observation ("no member is easier") into a
    positive structural one ("the instance is literally the same element of the
    same group on every member").

  novelty_status: adaptation
  novelty_note: >-
    CORPUS CHECKED, WEB NOT AVAILABLE. WebSearch returned a backend model error
    for every query this session, so no external literature was verified and no
    KN-LIT entry is created by this record. On the strength of grep over
    knowledge/, ledger/proposals/, ledger/questions/ and ideas/ - the ray class
    field generated by torsion points is classical CM theory and cannot be
    claimed as new; the ray-class group action on pairs with level structure is
    the same apparatus used in oriented-isogeny cryptography, and the corpus
    already contains higher-dimensional and oriented records (KN-LIT-1449,
    KN-LIT-1778, inputs/refs/research/oriented_ideal_kani_recovery.md). What is
    checked and NOT found in the corpus is the use of this apparatus to convert
    obstruction 4 of EV-ECDLP-b3e847 from empirical to structural, and the
    p^{3/4} torsor-search accounting. Near neighbours checked one by one -
    ideas/rejected/ECDLP-IDEA-018 (CM ray-class Artin descent) is the closest
    hit and goes the OPPOSITE way - it tries to build a sub-rho ATTACK out of
    elliptic-unit ray-class invariants over a number field, and its own recorded
    fatal obstruction is that the Artin label re-encodes x in a class group of
    comparable hardness; this record makes that obstruction the deliverable,
    works entirely in the finite field with no lift, and claims no attack.
    IDEA-20260808-5ee6b4 prices searching the Cl(O)-torsor for a curve
    satisfying a predicate and gets sqrt(h) = p^{1/4} for coset-structured
    predicates - that is a search over the BASE coordinate for an unknown
    endpoint; this record is about the FIBER coordinate with both endpoints
    known, and the two exponents (p^{1/4} there, p^{3/4} here) are different
    numbers for different problems. IDEA-20260811-10eacc puts a Fourier
    decomposition on the Cl(O)-torsor for cost functionals - base coordinate
    again, and this record supplies the reason no such functional can vary in the
    fiber. IDEA-20260726-009 (minimum-height representative) and
    IDEA-20260731-008 (transfer cost gate) both concern moving to a chosen
    member; A3 says the instance does not change when you do. IDEA-20260806-bcbcf5
    (spectral wrong null) is respected - nothing here measures a graph spectrum.
    Not claimed novel - A1, A2 and the CM background. Claimed as this record's
    contribution and unverified against external literature - A3's invariance
    statement as a replacement for obstruction 4, A4's p^{3/4} accounting, and
    A5's CDH identification of the level-fiber multiplication.

  assumptions:
    - >-
      E/F_p ordinary, N = #E(F_p) prime, E(F_p) cyclic, and
      End_{F_p}(E) = O = Z[pi] (CM conductor 1). Conductor f > 1 is OUT OF SCOPE
      for the clean statement - when Z[pi] is a proper suborder the quotient
      O/(pi-1)O need not be cyclic of order N and the ray modulus must be
      restated. P-256 has f = 1 (ISO-EXP-001) and P-224 has f = 3, so P-224 sits
      outside the clean slice and is a declared control cell, not a covered case.
    - >-
      p is not congruent to 1 mod N, so Frobenius acts semisimply on E[N] with
      two distinct eigenvalues. This holds whenever the embedding degree exceeds
      1 and is checked, not assumed, on every toy instance.
    - >-
      Lawful defensive cryptanalysis on public constructions and toy benchmarks;
      the toy discrete logarithms solved here are benchmarks with recorded seeds
      and every claimed solve carries an independently re-verified certificate.

  proof_search_map:
    bottleneck: >-
      Obstruction 4 of EV-ECDLP-b3e847 - "all curves in an ordinary isogeny
      class have the same DLP complexity" - which the red team
      (TASK-20260807-d8bb19-redteam) recorded as an absence-of-evidence claim
      resting on "no known algorithm depends on j". Removing it as an empirical
      claim and replacing it with a structural one is the entire point; a future
      j-dependent algorithm would then have to explain how it escapes the torsor
      factorisation rather than merely being unimagined today.
    baseline_embedding:
      parameter_slice: >-
        Setting h(O) = 1 collapses Cl_n(O) to the level subgroup alone, the
        torsor becomes the point group, and A4's p^{3/4} collapses to
        p^{1/2} - which is exactly Pollard rho. The baseline is recovered as an
        exact parameter slice of the proposed frame, not merely as a comparison.
      reproduction_check: >-
        Frozen regression fixture - on a toy class with h(O) = 1 the measured
        torsor-walk collision count must reproduce the plain rho count within the
        seed band, on identical seeds. This fixture is computed and frozen before
        any h(O) > 1 class is examined.
    observation_collision:
      observable: >-
        The connecting ray class of an instance pair, equivalently the pair
        (base component in Cl(O), level component in (Z/N)^* mod +-1).
      distinct_preimage_search: >-
        Search for two DISTINCT ECDLP instances on two DIFFERENT class members
        whose connecting ray classes coincide. A3 predicts this happens exactly
        when the two instances are transports of one another, i.e. the observable
        has a fiber of size exactly h(O) - one instance per curve - and never
        larger. A collision beyond that fiber would mean the observable does not
        determine k and A3 is wrong as stated. This is checked by direct
        enumeration on toy classes, not argued.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The ray class Cl_n(O) with its exact sequence
          1 -> (Z/N)^* mod +-1 -> Cl_n(O) -> Cl(O) -> 1, replacing the isogeny
          class as the ambient object of every isogeny-graph attack.
        predicted_gain: >-
          None as an attack; the predicted gain is a proof. The exact sequence is
          what converts "no member is easier" into "the instance is the same
          element", and simultaneously exhibits the p^{1/2} cost of enlarging the
          search space from the fiber to the whole torsor.
      - transform: stronger_invariant
        proposed_object: >-
          The level component of the connecting ray class, as an invariant of an
          ECDLP instance under F_p-isogeny transport.
        predicted_gain: >-
          Strictly stronger than the group order N, which is the invariant Tate
          supplies. Tate says the members share a number; this says they share
          the instance.
    quantifier_order: >-
      FOR ALL ordinary E/F_p with O = Z[pi] and N prime, FOR ALL E prime in the
      F_p-isogeny class of E, FOR ALL isogenies phi from E to E prime defined
      over F_p, THERE EXISTS NO change in the connecting level-class of the
      transported instance - the map on connecting classes is the identity. The
      order matters - the class is fixed FIRST by the given curve, mirroring an
      attacker handed P-256 who cannot choose its class, and the isogeny is
      quantified universally rather than existentially, so no favourable path can
      be selected after the fact.
    method_ceiling:
      strongest_certifiable_claim: >-
        A structural statement about algorithms that factor through the
        (curve, marked generator) torsor, at conductor 1 and prime N,
        toy-verified. It certifies NOTHING about algorithms that read the
        Weierstrass coefficients, the Semaev system, or the field representation
        of x-coordinates - those do not factor through the projection and are the
        declared residue. It is not a proof that ECDLP is hard, and it is not
        evidence about P-256's security.
      nearby_object_control: >-
        The nearby object on which the desired conclusion FAILS - supersingular
        curves over F_{p^2}, where the class group is replaced by a
        non-commutative quaternion order, the "class" is not a torsor under an
        abelian group, and precisely for that reason Wesolowski's p^{1/3+o(1)}
        result exists there and nothing analogous exists here. A second nearby
        object - conductor f > 1 volcanoes (P-224, f = 3), where O/(pi-1)O may
        fail to be Z/N and A2's cardinality identity must be re-derived per
        level. Both must be examined and reported, and a frame that cannot tell
        them apart has proved nothing.
    proof_obligations:
      - claim: lambda(a + b*pi) = a + b mod N with kernel exactly (pi - 1)
        responsibility: correctness
      - claim: >-
          Cl_n(O) acts freely and transitively on labelled pairs, with matching
          cardinalities h(O)*(N-1)/2
        responsibility: size
      - claim: The connecting class of an instance lies in the level subgroup and equals k
        responsibility: correctness
      - claim: Torsor collision search costs (h*N)^{1/2} = p^{3/4}
        responsibility: runtime
      - claim: Level-fiber index calculus requires the CDH map
        responsibility: scope
      - claim: >-
          The instrument can detect a genuine difference between a torsor and a
          non-torsor labelled set of the same size
        responsibility: feasibility
    not_applicable_reason: null

  predictions:
    - metric: >-
        order of the group acting freely transitively on labelled pairs, divided
        by h(O)*(N-1)/2, measured by explicit action-table construction on
        complete toy classes
      direction: same
      minimum_effect: >-
        Exactly 1.000 on every tested class, with zero exceptions. Any class
        where the action table is not free, not transitive, or of the wrong
        order falsifies A2 as stated and must be reported, not excluded.
    - metric: >-
        variation of the recovered connecting level-class of one fixed instance
        after transport to each class member
      direction: same
      minimum_effect: >-
        Exactly zero across all h(O) members. A single member with a different
        level-class falsifies A3 and would reopen the closed direction; the
        implementation is suspected first.
    - metric: >-
        measured collision steps of a random walk on the labelled-pair torsor,
        divided by sqrt(h(O)*(N-1)/2)
      direction: same
      minimum_effect: >-
        Within a factor 1.25 of the birthday prediction, and MEASURABLY ABOVE
        the plain-rho count on the same instances by a factor of at least
        0.5*sqrt(h(O)). The direction that matters is that the torsor walk is
        WORSE, and the effect must grow with h(O) across at least three classes
        of different h.
    - metric: >-
        number of ECDLP instances on distinct class members sharing one
        connecting ray class (the observable's fiber size)
      direction: same
      minimum_effect: >-
        Exactly h(O), never more. A larger fiber means the observable does not
        determine k.

  minimal_test:
    design: >-
      Pure exact computation, no cryptographic-size arithmetic. (1) Select at
      least four toy primes p in [2^16, 2^24] with an ordinary curve E having
      PRIME N = #E(F_p) and CM conductor f = 1, spanning class numbers h(O)
      from 1 to a few hundred; the selection script, its seed and its rejection
      log are recorded artifacts and the tuple (p, a, b, N, t, h) is frozen
      before any measurement. (2) Enumerate the complete F_p-isogeny class up to
      F_p-ISOMORPHISM (not by j alone - twists share j) by explicit Velu
      isogenies, and enumerate the labelled pairs (E prime, R). (3) Build the
      Cl_n(O) action table explicitly and CHECK freeness, transitivity and
      cardinality - this is A2, decided by table lookup. (4) Verify A1 by
      evaluating a + b*pi on random rational points for random small (a, b) and
      comparing against [a + b]R. (5) Fix one instance (P, Q = [k]P) with k from
      a recorded seed, transport it to every member by the explicit isogenies,
      recover the connecting level class on each, and compare - this is A3.
      (6) Run matched collision searches - plain rho with distinguished points on
      the point group, and a random walk on the labelled-pair torsor using the
      ideal action for base steps and scalar steps for level steps - on identical
      seeds, and report the ratio against sqrt(h*N) and against sqrt(N). This is
      A4. A5 is an argument and is NOT tested here; it is recorded as the method
      ceiling.
    controls:
      - >-
        NULL OBJECT, MANDATORY - a matched labelled set of the SAME cardinality
        h(O)*(N-1)/2 carrying a PLANTED action of the same abelian group that is
        free and transitive but is NOT the ray-class action (built by relabelling
        the pairs under a random permutation drawn from a recorded seed). Every
        A2 and A4 measurement is repeated on it. The freeness and transitivity
        checks must PASS on the null (they are shape checks and must not be read
        as evidence of the ray-class structure), while the A3 invariance
        measurement must FAIL on the null - the transported connecting class must
        vary. If A3 does not distinguish the null from the real torsor, the
        instrument cannot see the claimed structure and NO A3 result may be
        reported.
      - >-
        POSITIVE CONTROL, BLOCKING AND RUN FIRST - a toy class with h(O) = 1.
        There the torsor reduces to the point group and the torsor walk MUST
        reproduce the plain-rho step count within the seed band. If it does not,
        the walk implementation is wrong and nothing else is read. This is also
        the baseline_embedding reproduction fixture.
      - >-
        SEED DISPERSION BAND - the base curve re-solved under all 16 seeds, band
        computed and frozen before any between-member or between-arm comparison.
      - >-
        BSGS CROSS-CHECK on the smallest instance, sharing no walk code with rho,
        returning the same k.
      - >-
        SPECIAL-j SEGREGATION - any j = 0 or j = 1728 member is reported
        separately, since its automorphism group changes the rho constant for a
        reason that has nothing to do with the torsor (KN-TECH-018, and
        IDEA-20260812-c49409 which measures exactly that cell).
      - >-
        CONDUCTOR CONTROL - one f = 3 class (P-224's shape) where the clean
        statement is NOT claimed, to demonstrate the frame can tell covered from
        uncovered cases.
    required_metrics:
      - action-table freeness, transitivity and order, per class, real and null
      - >-
        lambda-formula verification pass fraction over random (a, b) and random
        rational points; must be 1.0
      - >-
        recovered connecting level class per class member, per instance, with the
        variation across members
      - >-
        matched collision-step counts - plain rho, torsor walk - per seed, with
        the ratio to sqrt(N) and to sqrt(h*N)
      - certificate verification fraction for every claimed solve; must be 1.0
      - complete-class closure flag; an unclosed walk voids every "for all members" claim
      - wall clock recorded for transparency only, excluded from every ratio

  falsification_conditions:
    - >-
      The labelled-pair action is not free, not transitive, or has order
      different from h(O)*(N-1)/2 on any toy class with f = 1 and prime N. A2 is
      then wrong as stated and the whole record collapses to A1.
    - >-
      The transported connecting level class VARIES across class members with a
      verified certificate and survives fresh seeds. A3 is wrong, obstruction 4
      is not recoverable by this route, and the closed direction reopens. The
      implementation is triaged first.
    - >-
      The torsor collision search costs LESS than sqrt(N) on any class with
      h(O) > 1. A4 is wrong and the enlarged search space is somehow cheaper,
      which would be a genuinely new algorithmic fact and requires independent
      review before being described as anything.
    - >-
      The null object is indistinguishable from the real torsor on the A3
      measurement. Instrument failure - nothing is read in either direction.
    - >-
      The h(O) = 1 positive control fails to reproduce plain rho. Implementation
      defect; everything void.

  confounders:
    - >-
      Twists share a j-invariant. Deduplicating class vertices by j rather than
      by F_p-isomorphism merges pairs that the action separates and will
      manufacture a false transitivity failure.
    - >-
      Class-number computation for the toy order must be exact; a wrong h(O)
      makes the cardinality check meaningless in either direction. It is computed
      twice by independent routines and the two must agree.
    - >-
      The torsor walk and the point walk have different per-step field costs (an
      ideal action step costs a Velu evaluation, a scalar step costs a group
      operation). The A4 ratio must be reported BOTH in steps and in charged
      field multiplications, because the step ratio alone flatters the torsor
      walk.
    - >-
      Small h(O) makes the p^{3/4} versus p^{1/2} separation invisible at toy
      scale; at least three distinct h values are required and the effect must be
      shown to GROW with h, which is the decay test.
    - >-
      If p is congruent to 1 mod N the Frobenius eigenvalues coincide and the
      eigenspace argument used elsewhere in this batch degenerates. Checked per
      instance and excluded with a recorded reason.

  interpretation_limits:
    - >-
      Toy scale, claim tier toy. P-256's SHAPE (ordinary, prime order, f = 1) is
      imitated, its SIZE is not approached, and nothing here is evidence about
      P-256's security.
    - >-
      A3 is a statement about algorithms that factor through the torsor
      projection. It does not cover algorithms reading the Weierstrass
      coefficients or the Semaev system - that residue is exactly what ISO-EXP-A2
      probed and what EXP-ISOU-2ac81f will measure, and this record does not
      claim to close it.
    - >-
      A4 is a lower bound on a GENERIC collision search over the torsor, not a
      lower bound over all algorithms. It says the natural isogeny-graph
      generalisation of rho is worse, not that nothing can be better.
    - >-
      A5 is an argument recorded as a ceiling, not an experiment. It is not
      evidence and must not be cited as such.
    - >-
      Conductor f > 1 (P-224) is out of scope for the clean statement and is
      carried only as a control cell.
    - >-
      Timeouts, crashes and infrastructure failures are never negative
      mathematical evidence (AGENTS.md rule 5).

  heuristic_assumptions:
    - id: H-RCT-1
      statement: >-
        A random walk on the labelled-pair torsor, generated by the prime-ideal
        actions of norm at most m together with scalar steps, has collision time
        equal to 0.886*sqrt(h(O)*(N-1)/2)*(1 + o(1)) - that is, it behaves as a
        random function on a set of that size.
      rigorous_support: >-
        Two rigorous ingredients paired with one distribution imitation. Rigorous
        - the action is free and transitive, so the state space has EXACTLY
        h(O)*(N-1)/2 elements (A2); and the birthday bound for a random function
        on a set of size M gives 0.886*sqrt(M) (Pollard 1978, as used throughout
        this programme's baseline KN-TECH-006). Imitated - the assumption that
        the generated walk mixes like a random function, which for the Cl(O)
        component is exactly the GRH-conditional expander property of
        Jao-Miller-Venkatesan 2005 (arXiv:math/0411378, the subject of
        RQ-JMV-001) and for the level component is the standard rho idealisation.
        The GRH-conditionality is NOT hidden - it is inherited and stated.
      validation_plan: >-
        Sample at toy scale where the torsor is enumerable - for each of at least
        four classes spanning h(O) from 1 to a few hundred, run 16 seeded walks
        and compare the empirical collision-time CDF against the birthday
        prediction by a Kolmogorov-Smirnov statistic, and separately against the
        SAME walk on the null-object labelled set of identical size (which fixes
        the size and destroys the structure). Tail check - the shortest observed
        collision over all seeds and classes is compared against the predicted
        minimum over that number of trials; an outlier short collision is the
        interesting outcome and is re-run under fresh seeds before it is
        described. Transfer assumption stated explicitly - the toy walk uses the
        FULL prime-ideal generating set, whereas at cryptographic size JMV
        restricts to norms below (log h)^{2+delta}; the toy measurement therefore
        UPPER-bounds the mixing quality available at scale and does not
        extrapolate to P-256.
    - id: H-RCT-2
      statement: >-
        For the toy families sampled, the ideal class number h(O) satisfies
        h(O) = |D|^{1/2 + o(1)}, so that the torsor size is p^{3/2 + o(1)} and
        A4's exponent 3/4 is the correct reading of sqrt(h*N).
      rigorous_support: >-
        The Brauer-Siegel-type statement h(O) = |D|^{1/2+o(1)} for imaginary
        quadratic orders, which is classical but INEFFECTIVE - the o(1) hides a
        constant that is not computable without GRH. The imitation is that toy
        discriminants behave like typical ones.
      validation_plan: >-
        Compute h(O) exactly for every sampled class (cheap at toy scale by two
        independent routines) and plot log h / log sqrt(|D|) against log p; the
        record reports the measured spread rather than assuming the asymptotic.
        Tail check - the smallest and largest observed h/sqrt(|D|) over the
        sample. This assumption affects only the LABELLING of A4's exponent, not
        the measured ratio, and that separation is stated in the artifact.

  target_complexity:
    time_exponent: >-
      p^{3/4} for the torsor collision search that this record analyses. This is
      a NEGATIVE target - it is the honest cost of the natural isogeny-graph
      generalisation of rho, and the record's content is that the exponent goes
      UP, not down. No algorithm with an exponent below 1/2 is proposed and none
      is implied.
    memory_exponent: >-
      p^{3/4} for a naive stored-table collision, or O(1) with distinguished
      points at the same time exponent. The level component alone at fixed base
      coordinate is plain rho at p^{1/2} time and O(1) memory.
    best_known: >-
      Pollard rho with negation at 0.886*sqrt(N)/sqrt(2) group operations and
      O(1) memory (KN-TECH-001, KN-TECH-006); BSGS at sqrt(N) time and sqrt(N)
      memory; automorphism-discounted rho at a further factor sqrt(|Aut|) on
      special-j curves (KN-TECH-018).
    hidden_overhead: >-
      Three items, all disclosed. (i) Making the torsor coordinate EXPLICIT
      requires the structure of Cl(O), which costs L_{|D|}(1/2) subexponentially
      - at |D| of order 2^258 that is about 2^129, already above rho, and it is
      charged in the accounting rather than treated as free preprocessing.
      (ii) The h(O) = |D|^{1/2+o(1)} statement is ineffective, so the "3/4" is a
      heuristic reading of the exponent, not a proved bound (H-RCT-2).
      (iii) Per-step costs differ between base steps (Velu / modular polynomial)
      and level steps (one group operation) by a large constant that the step
      count hides.
    tradeoff_note: >-
      van Oorschot-Wiener parallelisation applies unchanged to both the point
      walk and the torsor walk, so the comparison is parallelisation-neutral and
      the torsor walk stays worse by sqrt(h) at every processor count. The
      time-memory interpolation for the torsor walk is the standard
      distinguished-point one - time sqrt(h*N/w) with w processors - and it never
      crosses below the point walk.

  dominated_by: >-
    Pollard rho with negation, at 0.886*sqrt(N)/sqrt(2) time, O(1) memory and 0
    queries, dominates the p^{3/4} torsor search on time at equal memory. Frontier
    rows checked as recorded in this corpus - BSGS (sqrt(N) time / sqrt(N)
    memory) dominates on time at large memory; van Oorschot-Wiener parallel rho
    dominates on wall time at w processors; the multi-target frontier
    sqrt(L*N) (Kuhn-Struik, as cited in IDEA-20260802-005) dominates in the
    multi-instance model; the preprocessing frontier S*T^2 = Omega(epsilon*N)
    (Corrigan-Gibbs and Kogan, as cited in IDEA-20260802-005) dominates in the
    preprocessing model. Every row is dominating, so `null` is not available and
    is not written. NOTE - those two external frontier citations are relayed from
    IDEA-20260802-005 in this corpus and were NOT independently re-verified this
    session (web search unavailable).
  sota_delta:
    time_exponent: >-
      +1/4 (WORSE). The torsor search costs p^{3/4} against rho's p^{1/2}.
    memory_exponent: >-
      +3/4 for the stored-table variant, 0 for the distinguished-point variant.
    data_or_query_exponent: >-
      0. No oracle queries, no auxiliary data, no preprocessing beyond the
      disclosed L_{|D|}(1/2) class-group structure computation.
    note: >-
      No improvement is claimed and none is implied. The deliverable is a
      structural theorem that upgrades obstruction 4 of EV-ECDLP-b3e847 from
      empirical to proved-for-a-named-algorithm-class, plus the quantitative
      statement that the isogeny class contributes p^{1/2} of extra search space
      and zero information. Under the exponent-first bias of
      docs/target-result-profile.md this record is a NEGATIVE structural result,
      and it is offered as one.

  estimated_cost:
    implementation: medium
    compute: low
  compute_budget_note: >-
    Complete class enumeration and action-table construction at p below 2^24 is
    minutes to a couple of hours on one core in a computer-algebra system; the
    matched collision searches at N below 2^24 are well under one CPU-hour with
    16 seeds. The dominant implementation cost is correct F_p-isomorphism
    deduplication and correct explicit Velu edges, both of which EXP-ISOU-2ac81f
    already requires, so this record should reuse that implementation rather than
    build a second one.
  recommended_priority: high

  relation_to_existing_records:
    depends_on_or_shares_implementation_with: >-
      EXP-ISOU-2ac81f / H-ISOU-c5bfea (complete-class census). This record does
      NOT duplicate that census - the census measures SOLVE COST per member and
      per operation; this record measures the ALGEBRAIC STRUCTURE of the pair
      torsor and never needs a full solve on every member. They share the class
      enumerator and the certificate checker, and they answer different
      questions.
    would_be_falsified_by: >-
      A census result in which a class member solves in materially fewer group
      operations than the class median with a verified certificate (EXP-ISOU-2ac81f
      falsification condition F1). A3 and F1 cannot both hold.
    supports: >-
      If A3 verifies, EXP-ISOU-2ac81f's predicted null on Q1 acquires a
      structural explanation rather than remaining an unexplained regularity.
