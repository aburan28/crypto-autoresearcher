idea:
  id: IDEA-20260816-13db82
  question_id: RQ-MDFIVE-6870c1
  added: '2026-08-16'
  title: 'Before any method-ceiling claim is made about MD5, run the identifiability audit on the
    observable that would carry it: rewrite the claim with explicit quantifier order and hunt for
    two objects with the same observable lying on opposite sides of the intended conclusion.'
  class: theory
  claim: '(A) RQ-MDFIVE-6870c1 asks for a named obstruction rather than a fatigue report, and KN-TECH-080
    audit 2 says that any conclusion is carried by an observable, an invariant, a transcript or a
    certificate, and that finding two ground-truth objects with the same observable on opposite sides
    of the conclusion falsifies identifiability outright. This proposal runs that audit before any
    ceiling claim is made, not after. (B) The claim under test has three parts, each of which can
    fail. First, that every candidate ceiling observable this bucket can produce, namely chunk separation,
    freedom curves, pinned-word masks and wavefront statistics, can be written as an explicit function
    of a primitive specification with no free parameters, which is a precondition for it being an
    observable at all. Second, that for at least one of them a collision exists: two round-reduced
    or structurally perturbed variants of MD5 with the same observable value but different status
    with respect to whatever conclusion the observable is supposed to carry, where status is established
    by direct computation on the variants rather than by assertion. Third, that the quantifier order
    of the intended claim, once written out, exposes at least one witness dependence the uniform conclusion
    forbids, specifically whether the split, the neutral words, or the matching point is allowed to
    depend on the target value. (C) The deliverable is an audit table: one row per candidate observable,
    columns for the explicit functional form, the collision search outcome, the quantifier rewrite,
    and a verdict of identifying, collided, or under-specified. (D) EXPLICITLY NOT CLAIMED: that any
    ceiling exists, that any observable is the right one, that MD5 has or lacks any property, or that
    a collision in an observable means the underlying idea is wrong rather than that this particular
    carrier of it cannot support the claim. A collision falsifies identifiability of the observable,
    nothing more, and the record states that limit in the interpretation limits and again in the claim
    ceiling.'
  mechanism: 'The audit is symbolic and costs essentially no compute, which is the point of running
    it first. STAGE 1 forces each candidate observable into an explicit signature taking a primitive
    specification and returning a value, and rejects any candidate that cannot be written that way
    as under-specified, which is already a useful outcome. STAGE 2 constructs a variant family: MD5
    round-reduced to r steps for every r, MD5 with rotation constants permuted, MD5 with the schedule
    reversed, and MD4 and its round reductions. STAGE 3 computes every candidate observable on every
    variant and sorts for equal values. STAGE 4 for each equal-valued pair, establishes the pair''s
    status with respect to the conclusion by direct computation where possible, for instance by executing
    a split search on both and comparing achieved separation, or records that status cannot be established
    and marks the pair unresolved rather than as a collision. STAGE 5 writes each intended claim with
    explicit quantifier order and checks whether the witness is allowed to depend on the target, the
    instance or the seed. Refutation of the audit''s own usefulness is straightforward: if no candidate
    collides and every quantifier rewrite is clean, the audit passes everything and has discriminated
    nothing, and the record says so plainly.'
  novelty_status: unverified
  novelty_screen:
    method: grep -rl MDFIVE over ledger/proposals/, empty. Read knowledge/techniques/KN-TECH-080 as
      referenced from docs/inventor-protocol.md section 8, and read section 8 in full including audits
      1 through 4 and the constructive transform list. Read RQ-MDFIVE-6870c1's method-ceiling target
      in full, which explicitly cites KN-TECH-080 audit 4. Checked the blacklist against the program-self-audit
      family and against the tracked-object taxonomy records IDEA-20260807-df906f and IDEA-20260815-e103ac.
    results: The anchor question itself names KN-TECH-080 audit 4 as the frame for its method-ceiling
      target, so audit 4 is already claimed by the question. What no record does is run audits 2 and
      3, observation collision and quantifier order, against the specific observables this bucket
      would use, and no record has ever produced an audit table of the form proposed. The blacklisted
      tracked-object taxonomy records IDEA-20260807-df906f and IDEA-20260815-e103ac concern the ECDLP
      object enumeration, a different domain with no hash function and no message schedule; the blacklisted
      program-self-audit records concern this program's false-positive rate and promotion gates rather
      than the identifiability of a cryptanalytic observable.
    verdict: 'UNVERIFIED. The audit procedure is prescribed by this program''s own KN-TECH-080 and
      docs/inventor-protocol.md section 8, so the method is not new and is not claimed to be. What
      is claimed new is the instantiation: fixing the candidate observables, fixing the variant family
      in which collisions are searched, and requiring status to be established by computation on the
      variants rather than by assertion, before any ceiling claim is written. Nothing is asserted
      about external literature.'
  object_first_candidate:
    tracked_object: The observable itself, treated as a function from a primitive specification to
      a value, together with its fibre, meaning the set of variants sharing one value.
    lossiness: Lossy by construction, and the audit is precisely a measurement of how lossy. An observable
      maps a full specification to a small value and therefore has large fibres; the audit asks whether
      the fibre contains objects on both sides of the intended conclusion. If the fibre is a singleton
      the observable is not lossy and it is a relabelling of the specification, which is the change-of-coordinates
      failure that inventor-protocol section 2 names, and the audit reports that too. The retained
      part propagates because each observable is required to be a deterministic function of the specification
      with no free parameters, so moving through the variant family moves the observable deterministically
      and the fibres are computable rather than estimated.
    propagation: 'The tracked operation is perturbation of the specification: reducing the round count
      by one, permuting rotation constants, reversing the schedule, or substituting MD4. Each perturbation
      moves every candidate observable by a computable amount, and the audit follows those moves to
      find where two different perturbations land on the same value. That is the entire propagation
      content, and it requires no execution of any attack.'
    survival_score: 'An observable survives the audit if its fibre within the declared variant family
      contains no pair whose status differs. The concrete deliverable is, per observable, the size
      of the largest fibre found and whether any pair within it was resolved to differing status.
      The record states the variant family explicitly as the scope: a clean audit means no collision
      within that family and is not a claim that none exists in a larger family.'
  null_object_control: The null object is a deliberately non-identifying observable included in the
    candidate list, namely the primitive's output length in bits, which is 128 for every variant in
    the family and therefore has a fibre containing the entire family. The identical audit must flag
    it as collided at the first comparison. A second null is a deliberately over-identifying observable,
    the content hash of the full specification, whose fibres are all singletons and which the audit
    must flag as a change of coordinates rather than a lossy observable. For the audit to mean anything
    both nulls must be classified correctly; if the audit passes the output-length observable or fails
    to flag the specification hash, the audit's own logic is broken and no verdict on any real candidate
    may be reported.
  discriminated_from:
  - 'KN-TECH-080 and docs/inventor-protocol.md section 8 as prescriptions: those require the audits
    and name their form; they fix no candidate observables, no variant family, and no rule for establishing
    status by computation.'
  - 'The MD4-versus-MD5 paired-control record in this batch: that filters candidates by whether they
    separate two specific primitives in a declared direction. This one asks whether a candidate can
    distinguish anything at all within a whole perturbation family, and a candidate can pass the paired-control
    filter while failing this audit or the reverse.'
  - 'The blacklisted program-self-audit family: those measure this program''s own false-positive rate,
    promotion gates and audit crowd-out. This audits the identifiability of cryptanalytic observables
    and would be unchanged if the program''s process were different.'
  - 'The ECDLP tracked-object taxonomy records IDEA-20260807-df906f and IDEA-20260815-e103ac: those
    enumerate objects for a different problem domain with no hash function, no schedule and no observable-fibre
    computation.'
  - 'A sensitivity analysis of an observable: that asks how much an observable moves under perturbation.
    This asks the sharper question of whether two perturbations landing on the same value differ in
    status, which a sensitivity analysis cannot answer because it never establishes status.'
  assumptions:
  - Every candidate observable can be written as a parameter-free function of a specification, or
    is recorded as under-specified; this is enforced rather than assumed.
  - The declared variant family is rich enough that a collision, if the observable is non-identifying,
    is likely to appear inside it; a clean audit is therefore evidence about that family only.
  - Status within a fibre pair can be established by direct computation for at least some pairs; pairs
    where it cannot are marked unresolved and never counted as clean.
  - Round reduction and constant permutation produce variants meaningful enough to serve as ground-truth
    objects, which is the audit's weakest assumption and is why the variant family is published in
    full.
  predictions:
  - metric: number of candidate observables flagged as collided within the declared variant family,
      out of four real candidates plus two nulls
    direction: different
    minimum_effect: at least 1 real candidate collided and at least 1 real candidate clean; an audit
      that collides all or none has discriminated nothing and is reported as such
  - metric: classification of the output-length null observable
    direction: different
    minimum_effect: 'forced value: collided at the first comparison; any other classification invalidates
      the audit'
  - metric: classification of the specification-hash null observable
    direction: different
    minimum_effect: 'forced value: flagged as a change of coordinates with all fibres singletons'
  - metric: number of quantifier rewrites exposing a target-dependent witness
    direction: higher
    minimum_effect: 1
  minimal_test:
    design: 'The audit needs no attack execution for its first and cheapest half. Build the variant
      family as specification records: MD5 reduced to every round count from 1 to 4, MD5 with 20 permutations
      of its rotation constants, MD5 with the schedule reversed, MD4 and its round reductions, giving
      a family of a few dozen. Compute all six observables on all of them, which is seconds. Sort
      each observable''s values and read off the fibres. That already classifies both nulls and identifies
      every candidate whose fibre is nontrivial. The expensive half is only entered for fibre pairs
      that actually appear: for each such pair, execute the cheapest available status test, which
      for chunk separation is a direct split search on both variants and for a freedom curve is a
      condition-forcing trial. If no fibre pair appears for a candidate, no expensive test is run
      for it at all, so the audit''s cost is proportional to the number of collisions it finds and
      is near zero when it finds none.'
    controls:
    - Output-length observable as a guaranteed-collided null, classified in the same pass.
    - Specification-hash observable as a guaranteed-singleton null, classified in the same pass.
    - Round-reduced MD5 variants providing a graded family where status is expected to change monotonically,
      so a fibre spanning a status boundary is detectable.
    - Rotation-permuted variants providing perturbations that leave the schedule untouched, separating
      schedule-driven from constant-driven observable movement.
    - A quantifier rewrite of a claim known to be uniform, used as a control that the rewrite procedure
      does not manufacture spurious witness dependence.
    required_metrics:
    - 'functional form status per candidate: explicit or under-specified'
    - observable value per candidate per variant
    - largest fibre size per candidate
    - 'per fibre pair: status test outcome or unresolved'
    - quantifier rewrite verdict per intended claim
    - classification of both null observables
  falsification_conditions:
  - The output-length null is not flagged as collided, invalidating the audit logic.
  - The specification-hash null is not flagged as a change of coordinates.
  - Every real candidate is collided, meaning none of the bucket's observables identifies anything
    within the family and the audit has closed the whole candidate set.
  - No real candidate is collided and every fibre is a singleton, meaning the audit has discriminated
    nothing and the variant family is too coarse.
  - Every fibre pair is unresolved because status cannot be computed, leaving the audit unable to
    reach any verdict.
  confounders:
  - Variant family choice, which determines every fibre and therefore every verdict.
  - Status establishment by a weak computation, where a split search that simply fails on both variants
    of a pair looks like equal status when it is really equal ignorance.
  - Coarse observable ranges, since an integer-valued observable over a few dozen variants will produce
    fibres by pigeonhole alone, which the null observables exist to calibrate.
  - Post-hoc candidate addition, prevented by freezing the candidate list before the variant family
    is built.
  - Reading a collision as refuting the underlying idea rather than the observable, which the interpretation
    limits explicitly forbid.
  interpretation_limits:
  - A collision falsifies identifiability of one observable within one declared variant family and
    says nothing about whether an obstruction exists.
  - A clean audit is not evidence for any ceiling claim; it is only the removal of one cheap way for
    such a claim to be wrong.
  - Status established by executing a search on a variant is bounded by that search's budget, and
    equal failure on two variants is equal ignorance rather than equal status.
  target_complexity:
    time_exponent: No attack exponent is claimed. The audit produces a classification table.
    memory_exponent: No attack memory exponent is claimed.
    best_known: The incumbent is the audit as prescribed in KN-TECH-080 and docs/inventor-protocol.md
      section 8, which supplies the form without candidates or a family, together with the anchor
      question's own requirement that a ceiling claim name an obstruction rather than count attempts.
      No repository record has executed audits 2 or 3 against any hash observable.
    hidden_overhead: 'The headline cost is near zero and that is misleading. The audit''s expense
      is proportional to the number of collisions it finds, because each fibre pair triggers a status
      test with a 10^7-evaluation budget on both members, and a candidate with many fibre pairs can
      turn a symbolic audit into a substantial compute run. The larger hidden term is human: deciding
      what it means for two variants to differ in status with respect to a ceiling claim is a judgement
      that the audit cannot make for itself, and a weak status test turns equal ignorance into apparent
      equal status, which reads as a clean fibre and silently passes a non-identifying observable.
      Third, the variant family is chosen once and every verdict is scoped to it forever.'
  dominated_by: n/a (no result claimed). Both MD5 frontier rows this program holds, the UNVERIFIED
    2^123.4 preimage figure and the seconds-scale collision figure in RQ-MDFIVE-6870c1, were checked.
    A classification table occupies no axis on either row, so no Pareto relation exists and recording
    null would be a fabrication.
  sota_delta: no attack; conceptual/measurement contribution only. The output is a six-row audit table
    and carries no numerical comparison to any complexity.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Split by part. That every candidate can be written in explicit parameter-free
    form, or is honestly marked under-specified: about 0.85, with the freedom-curve candidate most
    at risk since it needs a skeleton generator. That both nulls are classified correctly, i.e. the
    audit logic works: about 0.9. That at least one real candidate collides within the family: about
    0.7, because integer-valued observables over a few dozen variants collide readily. That at least
    one real candidate stays clean, so the audit discriminates rather than closing everything: about
    0.45. That at least one quantifier rewrite exposes a target-dependent witness: about 0.5, since
    split choice depending on the target value is the natural failure and it is not obvious in advance
    whether the intended claims are written uniformly.'
