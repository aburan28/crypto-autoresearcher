idea:
  id: IDEA-20260809-3da508
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-AEADC-8db132
  goal_id: GOAL-AEADC-001
  title: >-
    Measure every committing construction's overhead on one harness, because the
    choice between them is made on cost and the costs are published in different
    units
  class: measurement
  claim: >-
    The published committing constructions differ in overhead by amounts that
    decide adoption, and their costs appear in different papers under different
    measurement conventions. The claim is that implementing them on one harness
    and measuring under one convention produces a ranking that differs from the
    ranking implied by the published figures for at least one pair, and that the
    difference is attributable to a named convention (block counts versus cycles,
    inclusion or exclusion of key derivation, treatment of associated data).
  mechanism: >-
    One implementation framework, one machine model, one measurement protocol
    with declared repetition counts, message-length sweep, and per-phase
    breakdown. Overheads are reported relative to the unmodified AEAD measured on
    the same harness in the same run.
  why_not_a_renamed_known_approach: >-
    Benchmarks exist per construction. A single-harness comparison with a
    pre-declared protocol and a per-phase breakdown is the contribution, together
    with the explicit attribution of any ranking difference to a convention.
  predictions:
  - observable: relative overhead per construction across a message-length sweep
    metric: ratio to unmodified AEAD, per length
    predicted: Strongly length-dependent, so that the ranking at short messages differs from the ranking at long ones -- which is precisely what a single quoted overhead figure hides.
  - observable: agreement with published overhead figures
    metric: ratio per construction
    predicted: Within a factor of two after convention alignment; a larger gap identifies a convention that was not stated in the source.
  minimal_test: >-
    Implement at least three constructions, sweep message length over a declared
    range, measure with declared repetitions on a declared machine, and report
    per-phase breakdowns and the comparison to published figures.
  controls:
  - 'BASELINE-IN-RUN: the unmodified AEAD is measured in the same run on the same machine; a baseline taken from another run makes every ratio meaningless.'
  - 'CORRECTNESS PRECONDITION: every construction passes its own test vectors, and encryption-decryption round-trips, before timing.'
  falsification_conditions:
  - Overheads are length-independent, contradicting the prediction and simplifying the choice.
  - Constructions cannot be implemented faithfully from their specifications, which is recorded as an acquisition or specification gap rather than as a cost result.
  interpretation_limits: >-
    Measured on one machine with one implementation quality. Cross-machine
    generalization is not claimed and constant-factor differences may reflect
    implementation effort rather than design.
  sota_delta: 'No attack. Delta: one-harness comparable overheads where the field has per-paper numbers.'
  dominated_by: Not dominated by any corpus record.
  estimated_cost: Implementation medium; compute low.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for committing AEAD overhead: no records. WEB NOT CHECKED.'
  source_refs:
  - Committing-AEAD construction references -- RECALLED, REQUIRED READS.
