idea:
  id: IDEA-20260816-3e6af3
  question_id: RQ-MDFIVE-6870c1
  added: '2026-08-16'
  title: 'Validate the condition-counting instrument itself before any MD5 claim rests on it: predict
    path probability from a sufficient-condition count on a primitive small enough to enumerate exhaustively,
    then measure the true probability and report the predicted-to-actual ratio as the instrument''s
    error bar.'
  class: tooling
  claim: '(A) Every proposal in this bucket that speaks of conditions, freedom, or path probability
    depends on one unstated instrument: a routine that reads a differential path and returns a count
    of sufficient conditions, from which a probability of 2^-c is inferred. That inference is exactly
    right when conditions are independent and wrong by an unknown factor when they are not. No record
    in this repository has ever measured that factor for any primitive. (B) The claim under test is
    that the factor is measurable and is not one. On a primitive small enough that the full input
    space can be enumerated, the true probability of a path is a counted quantity, not an estimate;
    comparing it to 2^-c gives the instrument''s multiplicative error directly. The claim asserts
    that this error is systematically greater than one, meaning condition counts systematically overstate
    difficulty, and that its magnitude grows with the number of conditions imposed in a single step
    where carries can couple them. (C) The deliverable is an error-bar function: predicted-to-actual
    ratio as a function of condition count, step index and round, with a null showing what the ratio
    is for a primitive whose steps are random bijections, where conditions genuinely are independent
    and the ratio must be one. Every later record in this bucket that reports a condition count must
    then quote it with this error bar attached. (D) EXPLICITLY NOT CLAIMED: nothing about MD5''s collision
    or preimage cost, no correction to any published complexity, no assertion that any specific analysis
    is wrong, and no security consequence. This measures a tool this program uses, on a small primitive,
    and its only output is a calibration curve. A large error would not imply any published result
    is mistaken; it would imply that this program''s own counts need the error bar before they are
    quoted anywhere.'
  mechanism: 'STAGE 1 defines the small primitive: an ARX step function of MD5''s shape on four 4-bit
    words, giving a 16-bit state whose full input space is enumerable exactly, with the same nonlinear
    functions reduced in width and rotations reduced modulo 4. STAGE 2 implements the condition-counting
    instrument exactly as the sibling records in this batch would use it, taking a path and returning
    c. STAGE 3 enumerates all 2^16 states and, for each of a set of sampled paths, counts exactly
    how many satisfy the path, giving true probability p. STAGE 4 reports r = p / 2^-c per path, aggregated
    by c, by step index and by round. STAGE 5 runs the null primitive with random-bijection steps,
    where the ratio must be one within enumeration noise. STAGE 6 varies the width from 4-bit to 6-bit
    words to check whether the ratio is stable or width-dependent, since a width-dependent ratio cannot
    be transferred to 32-bit words and the record must say so rather than transfer it anyway. The
    measurement refutes itself if the ratio is one everywhere, which would mean the instrument needs
    no error bar and every sibling record''s counts may be quoted as they stand.'
  novelty_status: unverified
  novelty_screen:
    method: grep -rl MDFIVE over ledger/proposals/, empty. grep -ril md5, md4 over ledger/proposals/,
      empty. Read docs/inventor-protocol.md section 3 on controls before belief and section 6 step
      1 on isolating each assumption a complexity analysis rests on and measuring it separately. Read
      knowledge/techniques/KN-TECH-066 and KN-TECH-062 on condition counting and Markov-model probability
      accounting. Checked the blacklist items concerning RQ-INSTR-f8faa0 instrument audits and confirmed
      those concern this program's cost model and machine timing.
    results: No proposal in the ledger touches hash-function condition counting. KN-TECH-062 records
      that the Markov model justifying independent probability multiplication is unavailable in the
      unkeyed setting because there is one function rather than a family, which is exactly the reason
      this calibration is needed, and it states the point qualitatively without measuring any error
      factor. KN-TECH-066 describes conditions being forced at amortised cost near one without quantifying
      dependence. The blacklisted RQ-INSTR-f8faa0 family audits wall-clock cost models and machine
      variance; this audits a symbolic counting routine and reports a dimensionless ratio, with no
      timing anywhere in it. docs/inventor-protocol.md section 6 step 1 prescribes exactly this move.
    verdict: 'UNVERIFIED. Condition counting and the independence caveat are both standard and are
      stated in this repository''s own technique notes; exhaustive enumeration on a small primitive
      is elementary. Those are the assembled parts. What is claimed new is the calibration artefact:
      a predicted-to-actual ratio reported as a function of condition count, step and round, with
      a random-bijection null pinning the ratio to one, intended to be quoted as an error bar by every
      sibling record. No claim is made about external literature.'
  object_first_candidate:
    tracked_object: The predicted-to-actual probability ratio r = p_true / 2^-c, carried per path
      and aggregated by condition count, step index and round.
    lossiness: 'Lossy. The ratio discards the identity of the path, which conditions it imposed, and
      which states satisfied it, retaining one number per path. Very many paths share a ratio. What
      survives propagates because both p_true and c are deterministic functions of the path and the
      primitive, so r is well defined once both are fixed, and adding a condition to a path changes
      c by one and p_true by a computable factor, giving r a definite response. The honest limit:
      r is a property of the path sampling distribution as much as of the primitive, so the record
      fixes and publishes that distribution and refuses to report a single scalar for the instrument
      without it.'
    propagation: The tracked operation is imposing one additional condition on a path. Under independence
      the prediction 2^-c falls by exactly a factor of two. The true probability falls by a factor
      that depends on whether the new condition is implied by, contradicts, or is orthogonal to the
      existing ones, which at the bit level is decided by carry coupling within a word and by the
      nonlinear function's algebraic structure. The ratio therefore moves multiplicatively with each
      added condition, and its trajectory in c is the measured object.
    survival_score: The ratio is measurable while p_true is estimable by enumeration, which at a 16-bit
      state means paths with up to about 12 conditions before the satisfying set becomes empty in
      most samples. Beyond that the cell reports an empty-set rate rather than a ratio, and the record
      states that boundary explicitly rather than fitting through it.
  null_object_control: The null primitive has the same state size, the same schedule and the same
    path grammar, but each step is a random bijection keyed by the message word. Conditions on such
    a primitive are genuinely independent, so the identical enumeration must return r = 1 within the
    noise implied by the enumeration size. The identical code path computes both. For the signal arm
    to mean anything the null must be flat at one across the whole c range; a null that drifts from
    one indicates that the enumeration, the path grammar, or the counting routine is biased, and no
    signal-arm ratio may be reported until it is fixed.
  discriminated_from:
  - 'The blacklisted RQ-INSTR-f8faa0 cost-model and machine-variance audits: those measure how this
    program converts work to cost on a machine. This measures a symbolic routine against exhaustive
    ground truth and produces a dimensionless ratio with no timing input at all.'
  - 'KN-TECH-062''s statement that the Markov model is unavailable in the unkeyed setting: that is
    the qualitative reason this measurement is needed, not the measurement, and it supplies no error
    factor.'
  - 'The freedom-and-conditions accounting record in this batch: that produces the counts; this one
    measures how wrong those counts are. They are complementary and the second is a precondition for
    quoting the first.'
  - 'The mini-MD5 gain-curve record in this batch: that measures executed attack costs at a 32-bit
    chaining value. This measures a counting routine''s error at a 16-bit state and executes no attack.'
  - 'A generic unit test of the counting routine: a unit test checks the routine returns the count
    its specification demands. This checks whether that count predicts reality, which is a different
    and stronger question and can fail even when every unit test passes.'
  assumptions:
  - A 16-bit state is small enough for exact enumeration and large enough for carry coupling to occur
    across a 4-bit word; the second half is the weaker assumption and motivates the width sweep.
  - The path sampling distribution is declared in advance and published with the result, since the
    ratio is meaningless without it.
  - The condition-counting instrument used here is byte-for-byte the one the sibling records use,
    imported rather than reimplemented.
  - Random-bijection steps genuinely decouple conditions, which is checked by the null being flat
    at one rather than assumed.
  predictions:
  - metric: median predicted-to-actual ratio r at condition count c = 8 on the ARX primitive
    direction: higher
    minimum_effect: 1.5
  - metric: median r on the random-bijection null across all c
    direction: different
    minimum_effect: forced value 1.0 within enumeration noise; a null median outside [0.9, 1.1] invalidates
      the run
  - metric: growth of r with condition count c
    direction: higher
    minimum_effect: 'explicit refusal to pre-commit a rate: no prior measurement of condition dependence
      exists in this program for any ARX primitive, so a stated growth rate would be invented; the
      trajectory is reported as observed'
  - metric: change in median r when word width goes from 4 bits to 6 bits
    direction: different
    minimum_effect: 0.2
  minimal_test:
    design: 'Define the 16-bit ARX primitive and enumerate its full state space, which is 65536 states
      and therefore instant. Sample 10^3 paths from the declared grammar at each condition count c
      in 1..12. For each path, run the counting instrument to get c and enumerate the state space
      to get the exact count of satisfying states, hence p_true. Report r per path and its distribution
      per c. Run the null over the identical path set with the identical code. The entire measurement
      is seconds and needs no optimisation. It discriminates in one shot: a null flat at one plus
      a signal median above 1.5 at c = 8 establishes a usable error bar; a signal median at one says
      the instrument needs no correction, which is equally useful and lets every sibling record quote
      its counts directly. The width sweep to 6-bit words costs 2^24 enumerations per path and is
      run at reduced path count.'
    controls:
    - Random-bijection null primitive with identical state size, schedule and path grammar, in the
      same invocation.
    - Width sweep from 4-bit to 6-bit words, testing whether the ratio transfers across width at all.
    - XOR-ablated ARX primitive with no carries, where conditions within a word should decouple and
      the ratio should move toward one.
    - A hand-constructed path with two deliberately contradictory conditions, whose true probability
      is exactly zero, which the instrument must be seen to mispredict, confirming the measurement
      can detect dependence.
    - A hand-constructed path with two deliberately identical conditions, whose true probability is
      2^-1 while the instrument reports c = 2, giving a known ratio of exactly 2 as a positive control.
    required_metrics:
    - instrument condition count c per path
    - exact satisfying-state count and hence p_true per path
    - ratio r per path
    - median and interquartile range of r per c, per step, per round
    - null ratios across the same grid
    - positive-control ratio, which must equal 2 exactly
  falsification_conditions:
  - The null median r falls outside [0.9, 1.1] at any c, invalidating the instrument or the enumeration.
  - The positive control with two identical conditions does not return r = 2 exactly, indicating the
    measurement cannot detect dependence at all.
  - The signal median r stays within [0.9, 1.1] across every c, meaning no correction is needed.
  - The ratio changes by more than 0.2 between 4-bit and 6-bit words, meaning it is width-dependent
    and cannot be quoted as an error bar for 32-bit words.
  - Empty satisfying sets dominate above c = 6, leaving too few usable cells to establish any trajectory.
  confounders:
  - Path sampling distribution, which determines the ratio as much as the primitive does and must
    be published with every number.
  - Small-width artefacts, where 4-bit words make carry coupling unrepresentatively strong or weak.
  - Empty-set censoring at high condition counts, which biases medians if unreported.
  - Instrument version drift, prevented by importing the exact module the sibling records use and
    fingerprinting it into the manifest.
  - Conflating dependence between conditions with an error in the condition-counting routine itself,
    separated by the two hand-constructed controls.
  interpretation_limits:
  - The ratio is a property of this program's instrument on a small ARX primitive under a declared
    path distribution, and nothing in it speaks to any published analysis of any primitive.
  - A width-dependent ratio may not be transferred to 32-bit words, and the record states this as
    a hard rule rather than a caution.
  - The calibration bounds how much this program's own counts can be trusted; it does not make any
    count correct.
  target_complexity:
    time_exponent: No attack exponent is claimed. The deliverable is a dimensionless ratio and its
      distribution.
    memory_exponent: No attack memory exponent is claimed.
    best_known: The incumbent is the implicit assumption of independence, namely that a path with
      c sufficient conditions has probability 2^-c, which is what every sibling record in this batch
      would otherwise use unexamined. KN-TECH-062 records that the justification for that assumption
      is unavailable in the unkeyed setting without supplying a replacement.
    hidden_overhead: 'The enumeration is cheap; what hides in the lower-order terms is the path sampling
      distribution, which determines the ratio as strongly as the primitive does and which has no
      canonical choice. A calibration quoted without its distribution is meaningless, so every later
      record that cites the error bar inherits an obligation to cite the distribution too, and that
      obligation is easy to drop. The second hidden cost is the width sweep: enumerating 2^24 states
      per path at 6-bit words is orders of magnitude above the headline 2^16 figure, and it is the
      arm that decides whether the calibration transfers at all. Third, the calibration is bound to
      one module version by content hash, so ordinary maintenance of that module quietly expires this
      result.'
  dominated_by: n/a (no result claimed). Both MD5 frontier rows this program holds were checked, the
    UNVERIFIED 2^123.4 preimage figure and the seconds-scale collision figure in RQ-MDFIVE-6870c1.
    A dimensionless calibration ratio occupies no axis on either row, so there is no Pareto relation;
    null would be a fabrication.
  sota_delta: no attack; conceptual/measurement contribution only. The output is an error-bar function
    on this program's own counting routine and is not comparable with any attack complexity.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Split by part. That the enumeration and the two hand-constructed controls
    work as specified: about 0.9, since exhaustive counting at 2^16 is unambiguous. That the null
    comes out flat at one: about 0.8, with the residual risk sitting in the path grammar rather than
    in the primitive. That the signal median exceeds 1.5 at c = 8, i.e. dependence is material: about
    0.6, because carry coupling within a word is a real and known effect and the primitive is designed
    to expose it. That the ratio is stable across the 4-bit to 6-bit width change and can therefore
    be quoted for wider words: about 0.3, and this is the part most likely to close the transfer while
    leaving the calibration itself intact and useful within its measured widths.'
