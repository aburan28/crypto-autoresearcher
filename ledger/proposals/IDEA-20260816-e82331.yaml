idea:
  id: IDEA-20260816-e82331
  question_id: RQ-FNDSA-001
  added: '2026-08-16'
  title: Every divergence statistic in this goal reads the entropy source and the sampler through
    one channel and reports one number, so substitute the randomness source across four grades while
    holding the sampler fixed and measure how much of any detected divergence the source alone can
    manufacture.
  class: control
  claim: '(A) A test that compares signature statistics against an ideal discrete Gaussian cannot,
    by construction, distinguish a defect in the sampler''s arithmetic from a defect in the bit source
    that drives it: both appear as a deviation of the output law from the ideal, and no statistic
    on the output alone separates them. (B) Therefore every divergence number produced under this
    research question is a JOINT reading of two components, and its attribution to the sampler is
    an assumption rather than a measurement, unless the entropy source is varied as an explicit independent
    variable. (C) The claim is that this attribution is testable and cheap: run the identical sampler
    and the identical statistic against four graded bit sources, a cryptographic stream generator,
    the platform generator, a well-known low-quality linear congruential generator, and a deliberately
    biased source with a known per-bit bias b, and measure the divergence in each arm. The biased
    arm calibrates the statistic''s sensitivity to source defects in absolute units, so the deliverable
    is a SOURCE-SENSITIVITY COEFFICIENT: how much output divergence one unit of per-bit source bias
    produces at given dimension and width. (D) Given that coefficient, any divergence measured elsewhere
    in this goal can be converted into the amount of source bias that would explain it entirely, which
    is a bound every other entry in this batch can carry as a one-line qualification. (E) WHAT IS
    NOT CLAIMED: no claim that any implementation uses a defective source, no claim that any measured
    divergence in this corpus is a source artifact, no attack, and nothing about deployed parameters
    or any specification. (F) The negative outcome is fully usable and is arguably the expected one:
    if even the low-quality generator produces divergence far below the sampler-defect signals of
    interest, that establishes a measured floor showing the entropy source is not a plausible confounder
    at these parameters, which retires a standing objection with a number instead of an argument.'
  mechanism: 'STAGE ONE fixes the statistic. Any of the divergence statistics used elsewhere in this
    batch will do; what matters is that one is frozen and used identically in all four arms, since
    the point is a comparison across sources and not a search over statistics. STAGE TWO builds the
    four sources behind a common interface returning uniform bits, so that swapping the source changes
    nothing else in the pipeline. STAGE THREE runs the frozen statistic in all four arms at matched
    sample sizes and matched keys, producing four divergence readings. STAGE FOUR fits the source-sensitivity
    coefficient from the deliberately biased arm alone, sweeping the injected per-bit bias b over
    several decades and fitting divergence against b; the predicted form is quadratic in b for a chi-square-like
    statistic, since a small bias shifts the mean linearly and divergence-like statistics are quadratic
    in the mean shift, and that predicted exponent is itself a check on the instrument. STAGE FIVE
    inverts the fitted coefficient to express each of the other three arms as an EQUIVALENT BIAS,
    which is the interpretable output: the platform generator behaves like a source with equivalent
    bias below some value, and that value is the number other entries carry. Refutation is direct:
    if divergence in the biased arm does not grow with b at the predicted exponent, the statistic
    is not reading source quality and the sensitivity coefficient does not exist.'
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-FNDSA-001 in full, including its methods list which names a null-object control
      against an exactly-sampled reference and a deliberately biased sampler as a positive control,
      but names no entropy-source control. Read H-FNDSA-6a9cbb's assumptions, which record that area
      FNDSA holds zero experiments, zero runs and zero evidence records, so no instrument lineage
      exists. Extracted all twelve RQ-FNDSA-001 proposal titles. Ran grep -ril for entropy, randomness
      source, PRNG, generator and seed over ledger/proposals/. Read docs/inventor-protocol.md section
      3 on controls before belief.
    results: 'RQ-FNDSA-001 itself specifies a biased SAMPLER as its positive control, which is a different
      object from a biased SOURCE: a biased sampler tests detection power against the defect being
      hunted, while a biased source tests whether the same reading could have come from somewhere
      else entirely. None of the twelve proposals varies the randomness source. IDEA-20260813-d50a10
      fixes a shared randomness tape between two samplers, which holds the source constant by construction
      and therefore cannot see this confounder at all. H-FNDSA-6a9cbb records that this area has no
      instrument lineage, which is exactly the condition under which an unaudited confounder is most
      likely to survive.'
    verdict: UNVERIFIED. No claim about outside literature; substituting a randomness source to test
      attribution is ordinary experimental hygiene. What is claimed new HERE is that the corpus's
      FNDSA lane has no such control, that the substitution can be turned into a quantitative SOURCE-SENSITIVITY
      COEFFICIENT rather than a pass-or-fail check, and that the coefficient can be inverted so every
      other divergence reading in the lane carries an equivalent-bias qualification. The biased-arm
      calibration idea is assembled from RQ-FNDSA-001's own biased-sampler positive control, applied
      to a different component; the rest is assembled from standard control practice.
  object_first_candidate:
    tracked_object: The EQUIVALENT PER-BIT SOURCE BIAS of a randomness source, defined as the bias
      b of an idealized biased Bernoulli source that would produce the same divergence reading under
      the frozen statistic. Followed as a single scalar attached to each source, computed by running
      the source through the sampler and inverting the fitted sensitivity curve.
    lossiness: 'The projection collapses an entire generator, its state, its period, its correlation
      structure and its algebraic form, into one scalar. That is extremely lossy: a linear congruential
      generator and a biased Bernoulli source with the same equivalent bias are identified, though
      they are nothing alike. The retained part propagates because the operation of interest is the
      frozen statistic, which is a scalar functional of the output law, so two sources that produce
      the same statistic value are genuinely interchangeable FOR THAT OPERATION. The record states
      plainly that this equivalence is statistic-relative: a different statistic would order the sources
      differently, and the equivalent bias is therefore reported per statistic and never as a property
      of the generator.'
    propagation: One step is one signature. Acting on the tracked object, a signature consumes a fixed
      number of source bits and converts source bias into a shift of the sampler's output law, approximately
      linearly in b for small b because the sampler's decisions are piecewise-monotone functions of
      the bit stream. The frozen divergence statistic, being quadratic in a mean shift, then grows
      approximately as b squared, and aggregation over N signatures amplifies the detectable shift
      as sqrt(N), so the equivalent bias resolvable at N signatures scales as N to the power minus
      one quarter.
    survival_score: 'The object survives as long as the sampler''s response to source bias is monotone,
      which fails once b is large enough that the sampler''s decisions saturate. Concretely: the linear-response
      regime is expected to hold for b below about 1e-2 and to bend above it, so the fit is performed
      over b in 1e-5 to 1e-2 and the record reports where the bend occurs rather than fitting through
      it. At the low end the object dissolves into unresolvability at b around 1e-5 for 10^6 signatures,
      from the N to the minus one quarter scaling. The honest survival range is b from 1e-5 to 1e-2,
      three decades.'
  null_object_control: The null arm runs the frozen statistic against the SAME cryptographic source
    twice, using two different seeds, and must return a divergence consistent with the estimator's
    own noise floor and an equivalent bias consistent with zero. This is the essential null because
    the whole design compares readings across arms, and if two runs of the identical source already
    differ, cross-arm differences mean nothing. A second null runs the frozen statistic on the sampler's
    output when the sampler is replaced by direct draws from an exactly computed reference distribution,
    which must return zero divergence up to estimator noise regardless of which source drives it,
    isolating the sampler's contribution from the source's.
  discriminated_from:
  - RQ-FNDSA-001's own specified positive control is a deliberately biased SAMPLER, which calibrates
    detection power against the target defect. This varies the SOURCE, which calibrates attribution.
    A biased-sampler control cannot detect a source confounder because the source is held fixed in
    it.
  - IDEA-20260813-d50a10 pins both samplers to one shared randomness tape, which eliminates source
    variation by construction and therefore cannot measure its contribution.
  - The three-role precision ablation entry in this batch varies arithmetic precision. Source quality
    is a fourth component outside all three roles, and none of the role arms would move if the source
    changed.
  - The leaf-center audit entry in this batch measures a property of the recursion at reference precision;
    it would read a source defect as a center-law deviation and attribute it to the recursion, which
    is precisely the misattribution this entry bounds.
  - IDEA-20260808-e7ba81 detects deviation through the covariance spectrum. A source defect also perturbs
    the covariance, so that detector inherits the same attribution ambiguity and would consume this
    entry's equivalent-bias number directly.
  assumptions:
  - The four sources can be swapped behind one interface with nothing else in the pipeline changing,
    including the number of bits consumed per signature.
  - The frozen statistic responds monotonically to source bias over the fitted range, checked by the
    shape of the fit rather than assumed.
  - A per-bit Bernoulli bias is an adequate one-parameter family for calibration. The record acknowledges
    that real generator defects are correlations rather than biases, and reports the equivalent bias
    as a statistic-relative summary rather than a characterization.
  - Toy bases and widths are constructed in-run and are not claimed to be FN-DSA keys.
  - The low-quality generator used in the third arm is a documented, reproducible construction implemented
    in-run, not a claim about any deployed generator anywhere.
  predictions:
  - metric: divergence in the biased-source arm as a function of injected per-bit bias b
    direction: higher
    minimum_effect: grows as b to the power 2.0 over b in 1e-4 to 1e-2, with a fitted exponent in
      the interval 1.7 to 2.3
  - metric: equivalent per-bit bias of the cryptographic stream source
    direction: lower
    minimum_effect: below 1e-5, that is at or under the resolution floor at 10^6 signatures
  - metric: equivalent per-bit bias of the low-quality linear congruential source
    direction: higher
    minimum_effect: 'no pre-committed value. Refusal reason: an LCG''s defect is a lattice correlation
      rather than a bias, so its equivalent bias under a given statistic is exactly the unknown this
      arm exists to measure and any pre-committed number would be invented.'
  - metric: divergence in the two-seed null arm
    direction: different
    minimum_effect: consistent with the estimator noise floor, that is an equivalent bias consistent
      with zero within two standard errors
  minimal_test:
    design: 'The cheapest discriminating measurement runs only the biased arm and the two-seed null.
      Fix d = 16, sigma = 2, one toy key, 10^6 signatures, and one frozen statistic. Sweep the injected
      per-bit bias b over 1e-4, 1e-3 and 1e-2, and run the two-seed null at the same sample size in
      the same invocation. This costs minutes. It discriminates the design completely: if the two-seed
      null already shows divergence comparable to the b = 1e-4 arm, the estimator cannot support cross-arm
      comparison and nothing else is worth running; if divergence grows with b at an exponent near
      2.0, the sensitivity coefficient exists and can be inverted, and the remaining three source
      arms become a cheap addition; if divergence does not grow with b at all, the frozen statistic
      is blind to source quality, which is itself a reportable and reusable fact, since it would mean
      that statistic is immune to this confounder.'
    controls:
    - 'Two-seed null: identical cryptographic source, two seeds, must return equivalent bias consistent
      with zero.'
    - 'Reference-distribution null: sampler replaced by direct draws from an exactly computed reference,
      must return zero divergence up to estimator noise under every source.'
    - 'Bit-count control: verify all four arms consume the same number of source bits per signature,
      since a differing consumption rate changes the effective sample size.'
    - 'Statistic-invariance control: repeat the whole comparison with a second frozen statistic and
      report both orderings, since equivalent bias is statistic-relative by construction.'
    - Key-resampling control across ten keys, since a source effect must not depend on which key is
      used.
    required_metrics:
    - divergence under the frozen statistic, per source arm, with confidence interval
    - fitted exponent of divergence against injected per-bit bias
    - fitted source-sensitivity coefficient with confidence interval
    - equivalent per-bit bias per source arm, with confidence interval
    - source bits consumed per signature, per arm
    - estimator noise floor from the two-seed null
  falsification_conditions:
  - The two-seed null returns divergence comparable to any signal arm, voiding cross-arm comparison.
  - The reference-distribution null returns nonzero divergence, meaning the pipeline attributes error
    to the sampler that is not there.
  - The fitted exponent of divergence against b lies outside 1.7 to 2.3, falsifying the quadratic-response
    model on which the inversion rests.
  - Arms differ in bits consumed per signature, invalidating the matched comparison.
  - The two frozen statistics order the four sources differently in a way that reverses the qualitative
    conclusion, meaning no statistic-independent statement is available.
  - The biased arm shows no growth in divergence across three decades of b, meaning the statistic
    is blind to source quality and no coefficient exists.
  confounders:
  - Different sources consuming different numbers of bits per signature, which silently changes the
    effective sample size across arms.
  - Seeding correlations across the ten keys within one arm, which would couple the key-resampling
    control to the source arm.
  - A statistic whose response to source bias saturates within the fitted range, producing an exponent
    below 2 for a reason unrelated to the model.
  - The low-quality generator's period being short enough that 10^6 signatures wrap it, which converts
    a correlation defect into an exact repetition and changes what is being measured.
  - Attributing an equivalent bias to a generator as if it were a property of the generator rather
    than of the pair generator-and-statistic.
  interpretation_limits:
  - An equivalent bias is statistic-relative and is never a property of a generator; two statistics
    may order the same four sources differently and both orderings are correct.
  - Results hold at the tested toy dimensions, widths and sample sizes and are not extrapolated.
  - Nothing here says any real implementation uses a defective source; the low-quality arm is a construction
    built in-run for calibration.
  - A demonstrated insensitivity to source quality bounds one confounder and says nothing about any
    other, in particular nothing about arithmetic precision.
  target_complexity:
    time_exponent: 'No attack exponent is claimed. Instrument cost only: linear in signatures per
      arm and linear in the number of arms, with no dependence on the source beyond its own generation
      cost.'
    memory_exponent: No attack memory exponent is claimed. Instrument memory is O(d) per signature
      with streaming accumulation of the frozen statistic.
    best_known: Inside this repository the incumbent control for this research question is the biased-sampler
      positive control named in RQ-FNDSA-001's own methods list, which calibrates detection power
      rather than attribution. No claim is made about anything outside this repository.
    hidden_overhead: 'The hidden cost is that the deliverable is a qualification other records must
      carry, which is organizationally expensive and technically cheap: producing the number takes
      an afternoon, and getting every subsequent divergence reading in the lane to report its equivalent-bias
      bound alongside is a discipline problem that no experiment can solve. The other hidden cost
      is the statistic-relativity, which means the coefficient must be recomputed for each new statistic
      and does not compose.'
  dominated_by: 'n/a (no attack result claimed). Pareto check on instrument axes, all checked: this
    is among the cheapest entries in the batch on compute and implementation and is the narrowest
    in what it concludes, bounding one confounder rather than measuring a divergence. It is dominated
    by every measurement entry in the batch on informativeness about the sampler and dominates all
    of them on the single axis of attribution validity, which none of them supplies for itself. No
    attack frontier is engaged.'
  sota_delta: 'No attack; measurement and control contribution only. The quantitative delta is the
    equivalent-bias bound itself: at present every divergence number in this lane is reported without
    any statement of how much of it the entropy source could account for, and this replaces an implicit
    assumption of zero with a measured upper bound at a stated resolution of about 1e-5 per bit at
    10^6 signatures.'
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'Separate parts. That the two-seed null passes and cross-arm comparison
    is valid: about 0.85. That the biased arm shows a clean quadratic response and the sensitivity
    coefficient exists: about 0.7, with the main risk being saturation inside the fitted range. That
    the cryptographic and platform sources come out below resolution, making the confounder a non-issue
    at these parameters: about 0.8, which is the expected and useful outcome. That the low-quality
    generator''s equivalent bias is large enough to matter for any statistic used elsewhere in the
    batch: about 0.35, and if it is, the finding redirects instrument design across the lane.'
