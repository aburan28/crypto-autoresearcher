idea:
  id: IDEA-20260809-68acdd
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-CSIDH-64343f
  goal_id: GOAL-CSIDH-001
  title: >-
    Isolate the disagreement kernel by holding every switch fixed but one, and
    report the smallest set that decides the answer
  class: measurement
  claim: >-
    The dispute is usually described as being about several things at once. The
    claim is that it reduces to a SMALL set of switches — plausibly two — in the
    sense that fixing those and letting all others vary over their published
    ranges leaves the conclusion stable, while varying them alone reproduces the
    full published spread. That is a testable statement about the cost function
    and it is the goal's central deliverable.
  mechanism: >-
    For each subset of switches, compute the output range obtained by varying that
    subset over published values while all others are held at a common setting.
    The kernel is the smallest subset whose induced range covers most of the total
    published spread.
  why_not_a_renamed_known_approach: >-
    Attribution analysis of this kind is standard in sensitivity work and is not
    usually applied to a scientific disagreement. Framing "what do they disagree
    about" as a subset-selection problem over a shared model is the contribution,
    and it produces an answer that can be argued with.
  predictions:
  - observable: smallest subset covering most of the published spread
    metric: subset identity and coverage fraction
    predicted: >-
      Two switches or fewer covering most of the spread. If no small subset
      suffices, the honest conclusion is that the disagreement is diffuse, and
      that result is equally publishable and equally useful.
  - observable: stability of the kernel to the common setting of the other switches
    metric: kernel identity at several common settings
    predicted: Stable; instability means the kernel is an artifact of the baseline and must be reported as such rather than as an answer.
  minimal_test: >-
    Enumerate switch subsets up to size three, compute induced ranges at three
    different common settings, and report kernels with coverage fractions.
  controls:
  - 'BASELINE-VARIATION CONTROL: kernels computed at multiple common settings, since a kernel that depends on the baseline is not a kernel.'
  - 'FULL-SPREAD ANCHOR: the total published spread must be reproduced when all switches vary, or the coverage fractions have no denominator.'
  falsification_conditions:
  - No subset of size three or fewer covers a majority of the spread.
  - Kernels differ across baselines.
  interpretation_limits: >-
    Identifying what an argument turns on is not deciding it. This record makes no
    statement about which switch value is correct, and none may be inferred.
  sota_delta: 'No verdict. Delta: a located disagreement where the field has an unresolved debate described qualitatively.'
  dominated_by: Downstream of IDEA-20260809-66ef77; not dominated by any corpus record.
  estimated_cost: Implementation small on top of the model; compute negligible.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for disagreement analysis: no records. WEB NOT CHECKED.'
  source_refs:
  - The primary CSIDH quantum analyses -- REQUIRED READS.
