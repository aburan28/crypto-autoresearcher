idea:
  id: IDEA-20261001-cb6a72
  question_id: RQ-BINSTD-b6f698
  added: '2026-10-01'
  status: proposed
  approved_by: null
  title: >-
    COUNT FROBENIUS ORBIT ATTEMPTS EXPLICITLY: on a non-Frobenius-stable
    subspace V at toy Koblitz n∈{17,23}, does treating the n conjugates of
    one target as n independent mitt attempts change the measured relation
    yield by the predicted factor ≈n relative to a single-representative
    baseline — or is orbit collision / dependence killing the gain?

  class: heuristic_validation

  claim: >-
    Frontier KR-IC-b0fcda / KN-LIT-0d9d28 and open CERTBIN idea
    IDEA-20260926-9c5694 state that Frobenius conjugates of a target over a
    non-stable V are n attempts of one target over n conjugate bases.
    CLAIM (measurement): at n∈{17,23}, m=2, |V|=2^l with l frozen so that
    E[relations]≫1 under mitt search, the ratio
    yield(orbit-expanded) / yield(single-rep) lies in [0.7·n, 1.4·n]
    (HEUR-H1 independence) OR ≤ n/2 on ≥2 cells (dependence / collision
    obstruction). Pair with product-law floor accounting so any yield gain
    is priced against m·|G|/(|V|^m/m!) style bounds at the SAME cell.
    CLAIM TIER: observational. NO exponent. NO break. NO n=131 transfer.

  mechanism: >-
    OBJECT FRAME. Representation R1: polynomial-basis subspace V ⊂ F_{2^n}
    that is NOT Frobenius-stable. Operation set Sigma: mitt Semaev m=2
    decomposition plus Frobenius action on targets (Class I). Trichotomy:
    Class I. Lossy-projection: orbit expansion is a many-to-one map from
    conjugate bases to one geometric target; independence of the n
    attempts is the heuristic. OFF-LIMITS: F1 not used. KN-OPEN-020: V is
    ordinary subspace FB — known class; novelty is the measured
    independence factor vs product-law pricing, not a new FB genus.
    WHAT IS NEW under BINSTD: a falsifiable [0.7n,1.4n] band on the
    orbit-expansion yield ratio with explicit product-law bookkeeping at
    the same toy cells, filed under RQ-BINSTD-b6f698 after HOLD-U made
    floor accounting load-bearing (EV-BINSTD-2d34cb).

