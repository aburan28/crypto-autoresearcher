  heuristic_assumptions:
    - id: HEUR-BINSTD-cb6a72-H1
      formal_statement: >-
        FORALL tested (n,l) with E[relations]_single ≥ 5 under mitt m=2:
        yield_orbit / yield_single ∈ [0.7·n, 1.4·n] with certificate_pass_rate=1.0.
      random_model_justification: >-
        Rigorous: if n conjugate bases give independent Bernoulli hits with
        common success probability p, total hits ~ Binomial(n,p) with mean
        n·p. Classical: independence of orbit images under a mixing walk /
        random-model on bases. Dependence via shared curve point is the
        falsifier.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        Ratio ≤ n/2 on ≥2 cells, OR ratio > 1.4·n (overcount bug), OR
        certificate_pass_rate < 1.0, OR V accidentally Frobenius-stable.

  predictions:
    - metric: orbit_to_single_yield_ratio
      direction: different
      minimum_effect: '∈ [0.7 n, 1.4 n] under H1'
    - metric: product_law_floor_ratio_vs_rho_at_cell
      direction: higher
      minimum_effect: 'reported; no claim that orbit gain beats floor'

  minimal_test: >-
