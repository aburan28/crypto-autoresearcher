idea:
  id: IDEA-20260815-08fbb3
  question_id: RQ-EWALK-8fa147
  added: '2026-08-15'
  title: >-
    RHO'S WALK IS ASSUMED RANDOM AND ITS PARTITION IS CHOSEN BY CONVENTION:
    measure the collision-time deviation from the birthday prediction across
    partition designs, since a biased walk costs a constant nobody has
    measured
  class: measurement

  claim: >-
    Pollard rho partitions the group into branches and the analysis assumes
    the resulting walk is random. Real partitions -- by coordinate bits, by
    hash, by sign -- are not random and the walk's collision time can
    deviate from the birthday prediction by a constant factor. That constant
    multiplies the campaign's entire baseline and has not been measured.

  mechanism: >-
    Implement several branch partitions. On shared instances, measure steps
    to collision against the birthday prediction. Report the deviation per
    partition and the number of branches at which deviation becomes
    negligible.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Grep 'walk' , 'partition', 'branch function', 'birthday'; read of
      RQ-EWALK-8fa147.
    results: >-
      Rho walks are used throughout; no record measures collision-time
      deviation across partition designs against the birthday prediction.
    verdict: >-
      ADAPTATION. Non-randomness of rho walks is known in the literature
      and the r-adding walk analysis is published; the contribution is
      measuring the deviation on this program's own baseline
      implementation.

  object_first_candidate:
    tracked_object: >-
      STEPS TO COLLISION as a function of the branch partition design.
    lossiness: >-
      The birthday prediction projects the whole walk onto one expected
      value, which is accurate only to the extent the walk is random.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives at toy sizes with many repetitions; the deviation is a
      constant factor and is measurable without large groups.

  null_object_control: >-
    NULL 1 -- an ideal random branch function implemented by a strong hash,
    giving the reference deviation, which should be near zero. NULL 2 -- a
    deliberately biased partition (one branch far larger), which must show a
    large deviation; a measurement insensitive to that detects nothing.

  discriminated_from:
    - >-
        The measured-rho-baseline record in this series, which measures
        the constant under one partition; this varies the partition and
        should share its implementation.
    - >-
        Published analyses of r-adding walks, which give the theoretical
        deviation; this measures it on the implementation actually used
        here.

  assumptions:
    - >-
        Several partition designs are implementable on the same walk.
    - >-
        Enough repetitions are affordable for a constant-factor deviation
        to be resolved, which requires hundreds of solves per design.

  predictions:
    - metric: >-
        ideal-hash partition null
      direction: different
      minimum_effect: >-
        FORCED near-zero deviation from the birthday prediction.
    - metric: >-
        deliberately biased partition null
      direction: different
      minimum_effect: >-
        FORCED large deviation.
    - metric: >-
        deviation per conventional partition design
      direction: different
      minimum_effect: >-
        The measurement; a material deviation means the campaign's rho
        constant depends on a convention nobody recorded.
    - metric: >-
        branch count at which deviation becomes negligible
      direction: different
      minimum_effect: >-
        Directly actionable: it says how many branches the baseline
        implementation should use.

  minimal_test:
    design: >-
      Four partition designs, three branch counts, hundreds of solves
      each, both nulls, shared instances.
    controls:
      - >-
          Ideal-hash reference null.
      - >-
          Deliberately biased partition null.
      - >-
          Shared instances across designs.
      - >-
          Repetition count fixed in advance so the deviation estimate is
          not tuned.
    required_metrics:
      - >-
          Steps to collision per design and branch count, against the
          birthday prediction.
      - >-
          Deviation with interval per design.
      - >-
          Branch count at which deviation becomes negligible.

  falsification_conditions:
    - >-
        The ideal-hash null deviates. The measurement or the prediction is
        wrong.
    - >-
        The biased null shows no deviation. The measurement is insensitive
        and no result from it is admissible.
    - >-
        Conventional partitions deviate materially. The campaign's rho
        constant is partition-dependent and every comparison using it
        inherits that.
    - >-
        No design deviates. Partition choice is immaterial and the
        baseline is robust, which is worth recording since it is currently
        assumed.

  confounders:
    - >-
        REPETITION COUNT: a constant-factor deviation needs many solves to
        resolve, and an underpowered measurement will report no deviation
        regardless of truth.
    - >-
        GROUP-SIZE INTERACTION: deviation can depend on group size
        relative to branch count, so a single size may not represent the
        campaign's working range.

  interpretation_limits:
    - >-
        Measures an implementation constant; proposes no new algorithm.
    - >-
        Scoped to the tested partitions, branch counts and group sizes.
    - >-
        Any gain from choosing a better partition is a constant factor and
        explicitly not target-class.

  heuristic_assumptions:
    - id: HEUR-WALK-1
      statement: >-
        A branch partition with enough branches makes the rho walk
        indistinguishable from random for collision-time purposes.
      rigorous_support: >-
        Rigorous ingredient: the published r-adding walk analysis gives
        collision-time behaviour approaching the birthday prediction as
        the branch count grows. THE GAP: the analysis is asymptotic in
        branch count and the convergence rate is not tight, so the
        practical branch count at which deviation becomes negligible is
        exactly what is unmeasured and is the record's deliverable.
      falsification_condition: >-
        A partition with many branches still deviating materially from
        the birthday prediction.
      validation_plan: >-
        SAMPLE: >= 4 designs x >= 3 branch counts x >= 300 solves.
        COMPARISON: measured steps against the birthday prediction, per
        cell. TAIL CHECK: the design with the largest deviation at the
        highest branch count. TRANSFER: none beyond tested group sizes.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is many rho solves across designs and branch
      counts.
    memory_exponent: >-
      Distinguished-point table per solve; modest at toy sizes.
    best_known: >-
      The incumbent is the published r-adding walk analysis; this measures
      its constant on the implementation this campaign actually uses.
    hidden_overhead: >-
      Resolving a constant-factor deviation requires hundreds of solves
      per cell, which is the dominant and easily underestimated cost.
    tradeoff_note: >-
      More branches reduces deviation and costs a slightly more expensive
      step function; the record locates where that trade stops paying.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As an algorithm: dominated by the published
    r-adding walk literature. As a measurement on this program's baseline:
    none exists. Not null on any axis.
  sota_delta: >-
    No attack, no exponent, explicitly a constant-factor question. Content
    delivered: collision-time deviation from the birthday prediction across
    partition designs, and the branch count at which deviation becomes
    negligible for the implementation this campaign's comparisons rest on.

  estimated_cost:
    implementation: low
    compute: medium
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.9 that several partitions are implementable. 0.6 that enough
    repetitions are affordable to resolve a constant-factor deviation. 0.45
    that a conventional partition deviates materially, which would mean the
    campaign's rho constant depends on an unrecorded convention.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
