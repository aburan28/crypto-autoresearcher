idea:
  id: IDEA-20260811-7734c5
  question_id: RQ-ICINV-475b5e
  goal_id: GOAL-ENDO-001
  added: '2026-08-11'
  title: >-
    FOURIER FLATNESS OF THE COORDINATE-DEFINED FACTOR BASE, THE FUNCTIONAL
    IDEA-20260807-0ff796 NAMES AS NOT CLOSED: the additive energy of
    F_V(E) = {P in E(F_p) : x(P) in V}, viewed as a subset of the group, is
    computable EXACTLY in O(B^2) group operations with NO discrete logarithms, NO
    target sampler, NO seed ladder and NO null hypothesis test; it equals the
    fourth moment of the factor base's group-character spectrum, so ONE number per
    curve bounds the within-class deviation of EVERY decomposition-count
    functional at EVERY arity simultaneously -- turning the lane's open "variance
    and higher moments" gap into a deterministic paired comparison that also
    dissolves the H-ICINV-6c7920 sampler dispute by never drawing a target
  class: measurement

  claim: >-
    (A) THE OBJECT. Fix p, a complete ordinary F_p-isogeny class X, and ONE factor
    base V subset of F_p with |V| = B, IDENTICAL for every member of X. For
    E in X put
        F_V(E) := { P in E(F_p) : x(P) in V },
    a subset of the group E(F_p), symmetric under negation, of size
    b_E := |F_V(E)| = 2 * #{v in V : v^3 + a v + b is a nonzero square} +
           #{v in V : v^3 + a v + b = 0}.
    Define the ADDITIVE ENERGY
        Energy(E) := #{ (P1, P2, P3, P4) in F_V(E)^4 : P1 + P2 = P3 + P4 }
    and the normalised flatness ratio
        rho(E) := Energy(E) / Energy_null(b_E),
    where Energy_null(b) is the MEASURED mean energy of a uniformly random
    symmetric subset of E(F_p) of size b (measured, not assumed from a formula).

    (B) THE IDENTITY THAT MAKES ONE NUMBER CONTROL A WHOLE FAMILY. For any finite
    abelian group Gamma of order M and any S subset of Gamma, with
    S-hat(chi) = sum_{s in S} chi(s) over the characters chi of Gamma,
        (i)   sum_chi |S-hat(chi)|^4 = M * Energy(S)                  [Parseval]
        (ii)  #{(s_1,...,s_m) in S^m : s_1 + ... + s_m = R}
              = (1/M) sum_chi S-hat(chi)^m conj(chi)(R)
        (iii) Var_R over Gamma of the count in (ii)
              = (1/M) sum_{chi != 1} |S-hat(chi)|^{2m}
              <= (max_{chi != 1} |S-hat(chi)|)^{2m - 4} * Energy(S).
    Consequence, and it is the whole proposal: the m-fold decomposition count has
    class-invariant MEAN |S|^m / M for every m (the exact statement
    IDEA-20260807-0ff796 proves geometrically at m = 2), and its VARIANCE OVER
    TARGETS at every arity m >= 2 is controlled by the SINGLE quantity Energy(E)
    together with the spectral sup-norm. Therefore a class-flat energy closes the
    variance and higher-moment gap that 0ff796 section (E) explicitly leaves open
    -- "the VARIANCE and higher moments of the relation count, as opposed to its
    mean ... and every functional that is not a count: solving degree, rank
    profile, FOURIER FLATNESS" -- for all arities at once, from one measurement.

    (C) THE CLAIM PROPER, IN BOTH DIRECTIONS AND WITH NEITHER PRESUMED.
    Across a complete ordinary F_p-isogeny class, with V held identical on every
    member and with b_E conditioned on (see (E)), the flatness ratio rho(E) is
    either (H-FLAT) constant to within the size-matched random-subset null on
    every member of every measured class and at every measured prime, or it is
    not. This record asserts that the comparison is DECIDABLE AT ZERO STATISTICAL
    COST, because every quantity in it is an exact integer count, and it asserts
    the meaning of each branch in advance:
      BRANCH FLAT. Then the second and higher moments of every decomposition
      functional are pinned by (b_E, N) alone, the d_reg-free "counting" half of
      RQ-ICINV-475b5e is closed for the whole family rather than one functional
      at one arity, and the obstruction has a name:
      NAMED OBSTRUCTION (O-FLAT) -- the x-coordinate map is 2-to-1 onto a set with
      no additive structure relative to the group law, so the factor base is
      spectrally indistinguishable from a random subset of the same size, and an
      isogeny walk moves a set that is already flat to another set that is already
      flat.
      BRANCH STRUCTURED. Then some member of the class carries a factor base with
      excess additive energy at fixed size. That is simultaneously (i) the
      campaign's first genuinely class-varying counting functional, which must
      then go to the class extremal budget of IDEA-20260811-5e58dc and to the T5
      accounting of IDEA-20260807-c36472, and (ii) an independent statement about
      elliptic curves over F_p -- that the point set above a random x-window has
      non-random additive structure -- which is of interest whatever the campaign
      concludes.

    (D) WHY THIS IS THE CHEAPEST INSTRUMENT IN THE LANE, AND WHY IT DISSOLVES
    THREE STANDING BLOCKERS INSTEAD OF INHERITING THEM.
      (D1) NO DISCRETE LOGARITHMS. Energy(E) is computed by enumerating the B^2
      pairwise sums as GROUP ELEMENTS and hashing them; the spectral identity (B)(i)
      is used for interpretation only and is never evaluated. So the instrument is
      not an attack component and needs no dlog oracle at any scale.
      (D2) NO TARGET SAMPLER, HENCE H-ICINV-6c7920 IS NOT ENGAGED IN EITHER
      DIRECTION. Every quantity is a count over the FULL group; there is no
      targets_uniform versus targets_B choice to make, because no target is drawn.
      This is a structural escape from the campaign's most persistent dispute, not
      a position on it.
      (D3) NO ESTIMATOR, HENCE NO SR3 GATE AND NO SEED LADDER. Energy(E) carries no
      sampling error. The ONLY randomness in the design is the draw of V, and the
      design is PAIRED: the same V is used on every member, so within-class
      differences are exact integer differences at fixed V, and V-variance is
      removed by construction rather than estimated. GOAL-ENDO-001 criterion C4
      governs instruments that ESTIMATE; this one does not, exactly as
      H-ICINV-d5e351's heuristic_assumptions_note argues for its own symbolic
      contract.
      (D4) IT HAS A READY-MADE PLANTED-SIGNAL CONTROL. EXP-RELN-0a979f already
      specifies six factor-base families graded by additive energy in the EXPONENT
      domain (single AP, unions of 2/4/8 APs, uniform, greedy Sidon-B_3) and
      records that the single-AP arm must show an order-of-magnitude coverage
      collapse. Those arms are re-used here verbatim as the DETECTS-A-PLANTED-
      SIGNAL direction of the RQ-INSTR-f8faa0 two-directional control, and the
      uniform arm as the REJECTS-A-MATCHED-NULL direction. The instrument therefore
      arrives with both directions of C4 already designed by another contract.

    (E) THE ONE CONFOUND THAT MUST BE HANDLED BEFORE ANYTHING IS READ, STATED AS
    PART OF THE CLAIM. b_E = |F_V(E)| VARIES within the class: it is
    B + sum_{v in V} chi(v^3 + a v + b) up to 2-torsion corrections, a character
    sum whose within-class fluctuation is of order sqrt(B). Energy scales like
    b^3 in the sparse regime and like b^4 / M in the dense regime, so an
    unconditioned energy comparison across the class is mostly a b_E comparison and
    would be an artifact. THE DESIGN THEREFORE CONDITIONS ON b_E in both of two
    ways, both reported: (i) rho(E) normalises by the measured null at the
    OBSERVED b_E; (ii) a matched sub-arm truncates F_V(E) to a common size
    b_min = min_E b_E by a V-order-deterministic rule, giving an exactly
    size-matched comparison with no normalisation at all. If the two arms disagree
    in sign, the effect is a size effect and is reported as one.

  resource_label: >-
    R1 (x-coordinates as field elements: V is a subset of F_p and F_V(E) is defined
    by a field condition on x) + R2 (the curve equation: whether x lies in F_V is
    decided by the quadratic character of x^3 + a x + b). NOT R3, NOT R4 as inputs:
    the isogeny class enters only as the INDEX SET over which the functional is
    compared, and no isogeny is evaluated inside the measurement.
  admissibility: admissible
  admissibility_argument: >-
    ADMISSIBLE UNDER DECOMPOSITION.md section 2, AND THE C3 AUDIT IS RUN HERE
    RATHER THAN DEFERRED. The only oracle this record could be read as inventing is
    an ENERGY ORACLE returning Energy(E) for a queried (E, V). That oracle is
    GGM-SIMULABLE and this record says so plainly: given group-operation and
    equality access to a set of b group elements, an algorithm computes all b^2
    pairwise sums and their collision multiset in b^2 group operations and b^2
    equality tests, with no other access. So by KN-FIND-b7e091's own argument the
    energy oracle is closed at exponent 1/2 and cannot be the basis of any attack
    -- which is exactly why this record proposes a MEASUREMENT and not an
    algorithm, and why its sota_delta is zero by construction rather than by
    hope. What escapes the generic-group model is the SELECTION of F_V(E), which
    requires reading x-coordinates as field elements (R1) and the curve equation
    (R2); the generic algorithm cannot name the set, only manipulate it once
    named. H-ENDO-001 is used as the admissibility filter and is not retested: no
    endomorphism is applied to any point of G anywhere in this design.

  discriminated_from:
    - >-
      IDEA-20260807-0ff796 (arity-2 relation yield is an exact class invariant IN
      THE MEAN; the relation locus is F_p-isomorphic to E; obstruction O-YIELD).
      THIS RECORD IS THE COMPLEMENT THAT RECORD ASKED FOR. 0ff796 section (E)
      lists as NOT closed: arity m >= 3; the VARIANCE and higher moments; and
      "every functional that is not a count: solving degree, rank profile, FOURIER
      FLATNESS". This record takes exactly the second and third of those, in one
      object, for all arities. It does not restate the mean result and does not
      need it: (B)(ii) reproduces the class-invariant mean as the chi = 1 term, so
      0ff796's conclusion is the trivial coefficient of this record's spectrum and
      the two agree by construction.
    - >-
      EXP-RELN-0a979f / H-RELN-66c079 / IDEA-20260805-a25f11 (graded
      additive-energy census of the collision deficit, GOAL-RELN-001). THAT
      CONTRACT AND THIS RECORD ARE ORTHOGONAL AND THE DISTINCTION IS SHARP.
      EXP-RELN-0a979f CONSTRUCTS factor bases from chosen EXPONENT sets
      (V = {x(sG) : s in S}) with designed additive energy, holds the CURVE FIXED,
      and measures how coverage responds to energy -- its own text records that
      "the discrete logarithms are known by construction and ... it is a measuring
      rod". This record holds the FACTOR BASE V FIXED as a subset of F_p, varies
      the CURVE across an isogeny class, and asks whether the energy of the
      resulting point set is a curve functional. Energy is the independent variable
      there and the dependent variable here. Nothing in GOAL-RELN-001 varies the
      curve; nothing in GOAL-ENDO-001 has ever computed an energy. The overlap is
      that this record REUSES that contract's six graded arms as its planted-signal
      control, and cites them for that purpose.
    - >-
      IDEA-20260807-427cf3 (Macaulay rank profile of the Semaev ideal) and
      H-ICINV-d5e351 (Betti tables and singular locus of the f_V-free Jacobian
      ideal). Those track ALGEBRAIC invariants of a polynomial system. This record
      tracks a COMBINATORIAL invariant of a point set. A curve can have a
      class-constant Betti table and a class-varying additive energy, or the
      reverse; neither implies the other, and H-ICINV-d5e351's own scope statement
      excludes relation-collection quantities entirely.
    - >-
      IDEA-20260807-34754f (nested variance-components null) and
      IDEA-20260807-6eb96b (gauge-orbit null). Both are designs for deciding
      whether an ESTIMATED variance is real. This record removes the estimator, so
      those designs apply to it only through the V-draw, which the paired design
      already eliminates. The gauge null is nonetheless retained as a control,
      because Energy is NOT gauge-invariant (see confounders) and that is a genuine
      exposure.
    - >-
      IDEA-20260807-0a3272 (group structure E(F_p) varies within a class). Energy
      is defined on the whole group E(F_p) and is sensitive to its structure, so
      that record names a real rival explanation for any energy difference; the
      design therefore reports the full group structure alongside every energy and
      stratifies on it.

  object_first_candidate:
    established_families_off_limits: >-
      DECLARED OFF-LIMITS AS THE PRIMARY LENS for this session, per
      docs/inventor-protocol.md section 1: (i) the scalar solving-degree /
      Groebner-proxy functional per curve (the ICINV family as executed);
      (ii) the volcano level as stratifier (the VOLC family); (iii) transported
      instances and the transport oracle (the transport family); (iv) the
      phi-stable factor base (the EQIC family); (v) the endomorphism-as-scalar
      lens (closed by H-ENDO-001). This record's lens is a sixth: the factor base
      as a SUBSET OF THE GROUP, with its additive structure as the tracked
      quantity and the curve entering only through which points sit above V.
    tracked_object: >-
      THE ADDITIVE-STRUCTURE PROFILE of F_V(E): the pair (b_E, Energy(E)), and its
      spectral reading as the fourth moment of the factor base's character
      spectrum, followed as E ranges over one F_p-isogeny class at fixed V and
      fixed p.
    one_step_propagation_rule: >-
      DEFINED AND MEASURED. One step is a small-ell F_p-isogeny phi : E -> E'.
      Under it the tracked object does NOT propagate by any bounded map, and the
      record states this as a positive design fact rather than a gap:
      phi(F_V(E)) is a subset of E'(F_p) of the same size, but it is NOT F_V(E'),
      because the x-coordinate condition is not transported by phi. So the class
      supplies h essentially unrelated subsets of comparable size, and the
      within-class energy comparison is exactly a test of whether that
      "unrelated" is random. The one-step propagation that IS defined and IS
      measured is the pair (b_E, Energy(E)) -> (b_{E'}, Energy(E')) along an
      explicit Velu walk, and its one-step autocorrelation is the quantity
      IDEA-20260807-c36472 asks for on every candidate functional. This record
      supplies a functional cheap enough to compute that autocorrelation on.
    newness_score: >-
      Genuinely new TO THIS PROGRAM as a curve functional; a repackaging of nothing
      in the ENDO corpus, and explicitly the item IDEA-20260807-0ff796 named as not
      closed. Additive energy itself is standard and is claimed novel nowhere; its
      use as a factor-base design parameter is already this program's own
      EXP-RELN-0a979f, from which this record is separated above.
    survival_score: >-
      Survives: change of arity (the identity (B)(iii) is uniform in m), change of
      target (no target is drawn), change of estimator (none is used), change of
      generator, the H-ICINV-6c7920 dispute, and the SR3 gate. Dies at: change of
      Weierstrass model (Energy is NOT gauge-invariant; see confounders), a factor
      base V so large that b_E^2 exceeds the machine (B > ~10^4 at these primes),
      and any attempt to read it as a solving-degree statement, which it is not.

  mechanism: >-
    THE CAUSAL CHAIN, FROM WHAT RELATION COLLECTION ACTUALLY READS TO A SINGLE
    INTEGER PER CURVE.

    STEP 1 -- IDENTIFY THE ONLY THING THE TARGET ALGORITHM READS ABOUT THE FACTOR
    BASE. Point-decomposition index calculus interrogates F_V(E) in exactly one
    way: it asks which m-tuples of its elements sum to a given target. Every cost
    functional the ICINV lane enumerates on the counting side -- relation yield,
    decomposition probability, coverage at arity m -- is a statistic of that one
    incidence structure and of nothing else about the curve. So the right tracked
    object is whatever controls m-fold sumset counts, and the curve should enter
    only through which points sit above the window V.

    STEP 2 -- SUMSET COUNTS ARE CONVOLUTION POWERS, SO THE GROUP'S CHARACTERS
    DIAGONALISE THEM. Writing S = F_V(E) inside the group E(F_p) of order M, the
    number of ordered m-tuples of S summing to R is exactly
    (1/M) sum_chi S-hat(chi)^m conj(chi)(R). This is not an approximation and
    involves no model of the curve: it is the finite Fourier inversion of an
    m-fold convolution. The causal claim of this record is that the CHARACTER
    SPECTRUM of the factor base is the mechanism through which the curve can
    possibly influence relation collection, because after STEP 1 there is nothing
    else for it to influence.

    STEP 3 -- SPLIT THE SPECTRUM AND SEE THAT THE KNOWN RESULT IS THE TRIVIAL
    CHARACTER. The chi = 1 term contributes |S|^m / M, which depends on the curve
    only through |S| and M. M is fixed on the class by Tate, and |S| = b_E is a
    quadratic-character count. THAT TERM IS THE ENTIRE CONTENT OF
    IDEA-20260807-0ff796's arity-2 mean invariance, recovered here as one
    coefficient rather than as a separate geometric argument. Every remaining
    degree of freedom -- every way the class could matter beyond the mean -- lives
    in the NONTRIVIAL spectrum. That is the localisation step, and it is why the
    lane's open item is precisely a spectral question.

    STEP 4 -- PARSEVAL CONVERTS THE NONTRIVIAL SPECTRUM INTO AN INTEGER YOU CAN
    COUNT WITH GROUP OPERATIONS. The fourth power-moment of the spectrum is
    exactly the additive energy: sum_chi |S-hat|^4 = M * Energy(S). Energy is a
    count of quadruples with P1 + P2 = P3 + P4, so it is computable by forming the
    b^2 pairwise sums and tallying collisions -- group operations and equality
    tests only. The mechanism therefore converts an inaccessible analytic quantity
    (character sums over E(F_p), whose direct evaluation would need discrete
    logarithms) into an accessible combinatorial one, and that conversion is what
    makes the whole proposal cheap. It is also why the instrument cannot be an
    attack: the same conversion is what makes the energy oracle GGM-simulable.

    STEP 5 -- ONE INTEGER BOUNDS A WHOLE FAMILY, WHICH IS THE LEVERAGE. Because
    (B)(iii) holds uniformly in m, the target-variance of the m-fold decomposition
    count at EVERY arity is controlled by Energy together with the spectral
    sup-norm. So a single per-curve integer, measured once, bounds the within-class
    deviation of every counting functional at every arity simultaneously. This is
    the reduction-network property: the FLAT branch closes a family rather than a
    functional, and the STRUCTURED branch exhibits one object that would move many
    functionals at once.

    STEP 6 -- WHY THE ISOGENY CLASS IS THE RIGHT INDEX SET, AND WHAT THE CLASS
    ACTUALLY DOES TO THE OBJECT. Under an isogeny phi : E -> E', the point set
    does NOT transport: phi(F_V(E)) has the same size but is not F_V(E'), because
    the x-coordinate window is a field condition that phi does not respect. So the
    class hands us h subsets of one abstract group, all of comparable size, related
    to each other by nothing that preserves the window. The measurement is exactly
    the question of whether "related by nothing" is the same as "random" at the
    level of fourth moments. That is a sharp, decidable, exactly computable
    question, and both of its answers are informative.

    STEP 7 -- THE SIZE CHANNEL IS SEPARATED RATHER THAN IGNORED. b_E itself varies
    across the class, as a sum of quadratic characters over V with fluctuation of
    order sqrt(B), and Energy scales as a power of b. So the mechanism has two
    channels from curve to energy: through the SIZE of the point set, and through
    its additive STRUCTURE at fixed size. Only the second is a new phenomenon; the
    first is the character-sum channel IDEA-20260807-0ff796 already governs. The
    design therefore closes the size channel twice over -- by normalising against a
    null measured at the observed b_E, and by an exactly size-matched truncated
    sub-arm -- and reports both, so that a disagreement in sign between them
    identifies the effect as a size effect rather than leaving it ambiguous.

  lossy_projection_identifiability_audit:
    projection: >-
      (the curve E, i.e. the pair (a, b) in F_p^2) -> (the subset F_V(E) of the
      group E(F_p)) -> (the pair (b_E, Energy(E))) -> the scalar rho(E).
    what_is_discarded: >-
      At the first step: everything about E except which points sit above V, and in
      particular the entire y-coordinate structure beyond the sign pairing. At the
      second: WHICH points are in the set, all of its higher additive structure
      beyond the fourth moment, and the entire correspondence between set elements
      and field elements. At the third: the size, absorbed into the normaliser.
      Equivalently, in the spectral reading: all PHASE information in the character
      spectrum is discarded and only the fourth power-moment of the magnitudes is
      retained.
    is_it_only_a_change_of_coordinates: >-
      NO, AND THE ARGUMENT IS EXACT. Energy determines S only up to the enormous
      fibre of sets with equal autocorrelation, and |Gamma|^{b} sets map to one
      integer; there is no inverse. The discarded data is discarded COMPATIBLY with
      the operation relation collection performs, which is SUMMATION IN THE GROUP:
      by (B)(ii) the m-fold decomposition count is a convolution power, its mean
      over targets depends only on |S| and M, and its VARIANCE over targets depends
      only on the magnitude spectrum (Parseval kills every phase). So the retained
      part propagates deterministically through exactly the operation the target
      algorithm performs, which is the lossy-projection condition of
      docs/inventor-protocol.md section 2 in its precise form. Contrast with the
      protocol's worked failure (Delta, Pi in characteristic 2, where the unordered
      pair is recoverable): here nothing is recoverable, and the recoverable
      quantity that IS retained -- the second moment of the count -- is the one the
      lane needs.
    mirror_failure_check: >-
      CHECKED, TWICE. (1) The failure would be a projection that determines the
      count POINTWISE rather than in second moment; it does not, and the record
      states the pointwise bound separately and weakly ((B)(iii) with the sup-norm),
      so no pointwise claim is smuggled in. (2) The failure would be a statistic
      that is class-constant for a reason independent of the class -- namely that
      ANY set of size b has roughly the null energy. That is precisely the
      MODE-1-null risk, and it is why the planted-signal arms of (D4) are
      mandatory and blocking: an instrument that returns rho = 1 on a single
      arithmetic progression is measuring nothing and no negative may be reported
      from it.

  null_object_control: >-
    MANDATORY, BLOCKING, AND READ FIRST. NULL 1 (MATCHED RANDOM SUBSET, the primary):
    for each observed b, at least 200 uniformly random negation-symmetric subsets of
    E(F_p) of size b, giving the empirical distribution of Energy_null(b) with its
    own spread; rho(E) is reported against that distribution, not against a formula.
    NULL 2 (GAUGE ORBIT): the same curve written with at least 30 Weierstrass models
    (a, b) -> (u^4 a, u^6 b) and the SAME V. Energy is not gauge-invariant, because
    the dilation x -> u^2 x moves V relative to the curve; the gauge spread is
    therefore the equation-choice floor and every class spread must exceed it or the
    measurement is reading the model. THIS NULL IS RUN AND WRITTEN TO THE RECORD
    BEFORE THE CLASS ARM IS READ. NULL 3 (PLANTED SIGNAL, both directions of C4):
    the six graded arms of EXP-RELN-0a979f re-used verbatim, with the single-AP arm
    required to show a large rho and the uniform arm required to show
    rho = 1 within NULL 1's spread. IF THE AP ARM DOES NOT FIRE, THE INSTRUMENT
    CANNOT SEE ADDITIVE ENERGY AND NO NEGATIVE RESULT MAY BE REPORTED FROM ANY ARM.
    NULL 4 (NEARBY OBJECT): the identical pipeline on Z/N with the same b and the
    same random subsets -- the curve removed entirely. Every forced value must
    match. THE DECAY PARAMETER IS THE FACTOR-BASE SIZE B AND, SEPARATELY, THE PRIME
    p: a genuine class-dependent energy excess must scale with a stated power of
    b and must not vanish under B-doubling, and its class spread must decay with p
    if it is a Weil-error phenomenon. A class spread that is flat in BOTH B and p
    is the canonical artifact tell (docs/inventor-protocol.md section 3).

  assumptions:
    - >-
      [fact] Parseval on a finite abelian group: sum over characters of
      |S-hat|^4 = |Gamma| * Energy(S); and the convolution identity (B)(ii). Both
      are re-derived symbolically by the run on a small group before any curve is
      touched, and neither is quoted as external.
    - >-
      [fact] Tate: the class fixes t, hence #E(F_p) = M, hence the group ORDER is
      identical on every member. The group STRUCTURE is not (IDEA-20260807-0a3272),
      and this record reports it per curve rather than assuming cyclicity.
    - >-
      [fact] b_E = |F_V(E)| is B plus a quadratic-character sum over V and therefore
      varies within the class at scale sqrt(B). This is not a conjecture; it is a
      count, and it is measured exactly per curve.
    - >-
      [committed, not re-derived] The 138-member Hurwitz-Kronecker-certified
      p = 4001, t = 30 class and its true 2-volcano level distribution
      {0: 3, 1: 9, 2: 18, 3: 36, 4: 72}; the class-enumeration machinery of
      harness/isogeny_class.py; the six graded factor-base arms and the
      order-of-magnitude AP collapse requirement of EXP-RELN-0a979f. Re-emitted by
      the run under its own record; disagreement is PREMISE-FAILED.
    - >-
      [declared, not a fact] The identification of "excess additive energy" with
      "worse decomposition". The direction is fixed by (B): excess energy means
      excess variance of the count across targets at fixed mean, so it makes the
      decomposition rate MORE variable across targets, and in the saturated regime
      it makes COVERAGE LOWER at fixed size. That direction is derived, but the
      magnitude of its effect on any real attack is not, and no attack cost is
      claimed.
    - >-
      [scope] Toy scale, claim_tier toy. p up to ~2^16 for full class enumeration,
      B up to ~10^3 so that b^2 pairwise sums remain enumerable. No crypto-scale
      claim and no correspondence exists that would carry this measurement to
      crypto scale, which the record states rather than implying otherwise.

  proof_search_map:
    bottleneck: >-
      The exact step whose removal changes the lane's conclusion is the campaign's
      substitution of a SAMPLED decomposition rate (T = 400 drawn targets, a seed
      ladder, a disputed sampler, an SR3 stability gate that has fired F4 twice)
      for an EXACTLY COMPUTABLE moment of the same object. Every within-class
      counting number this campaign owns is an estimate whose estimator is under
      live dispute (H-ICINV-6c7920, status specified, unresolved). Replacing the
      estimated first moment by an exact fourth moment removes the estimator, the
      sampler, the seed ladder and the gate in one step, and is the only change
      that makes the counting half of the lane readable at all.
    baseline_embedding:
      parameter_slice: >-
        V = F_p (the full factor base). Then F_V(E) = E(F_p) entirely, Energy is
        the energy of the whole group, which equals M^3 exactly for any group of
        order M, on every curve, with zero variance -- a forced integer with no
        error term. Second slice: B such that b^2 << M (the sparse regime), where
        the null energy is dominated by the trivial solutions
        (P1 = P3, P2 = P4) and (P1 = P4, P2 = P3) and equals 2b^2 - (diagonal
        corrections) exactly; the negation symmetry of F_V contributes its own
        exactly derivable term, which is EXP-RELN-0a979f's "negation floor" and is
        re-derived here rather than quoted.
      reproduction_check: >-
        FROZEN REGRESSION FIXTURE, AND IT IS A HARD GATE COSTING MINUTES.
        (i) Symbolically verify Parseval and the convolution identity on Z/7 and
        Z/11 by brute force over all subsets of size 3. (ii) Assert Energy = M^3
        exactly at V = F_p on at least 5 curves at p = 4001. (iii) Assert the
        derived sparse-regime null energy, including the negation term, against
        direct enumeration on at least 200 random subsets at 3 values of b.
        Any failure makes the run INVALID and returns it to the executor as an
        implementation defect; it is never evidence about any curve.
    observation_collision:
      observable: >-
        The pair (b_E, Energy(E)), and its normalisation rho(E).
      distinct_preimage_search: >-
        REQUIRED, AND COLLISIONS ARE EXPECTED AND MUST BE SEPARATED. Two distinct
        curves in the class can share (b, Energy) for at least four distinct
        reasons and the design separates all four by construction: (1) genuine
        class-invariance of the additive structure; (2) SIZE MATCHING -- energy is
        dominated by b in the sparse regime, so equal b forces near-equal energy
        and the effect would be a size effect, separated by the b_min-truncated
        sub-arm of (E); (3) SATURATION -- when b^2 >> M every set has energy near
        b^4/M and the statistic is degenerate, separated by the mandatory B-sweep
        across at least four values spanning both regimes; (4) INSTRUMENT
        DEGENERACY -- a hash collision or an unsymmetrised enumeration returning
        the null value for every input, separated by NULL 3's AP arm which MUST
        fire. A constancy result that is really cause (2), (3) or (4) is labelled
        as that cause and never reported as class invariance.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace the campaign's estimated scalar decomposition_rate_m3 by the exact
          integer pair (b_E, Energy(E)) -- a strictly stronger state, because by
          (B) it determines the second moment of the decomposition count at EVERY
          arity while the rate determines only the first moment at one arity, and
          because it carries no sampling error at all.
        predicted_gain: >-
          Encoding: exact integers, no estimator, no null hypothesis test, no seed.
          Completeness: bounds the variance of every decomposition-count functional
          at every m; does NOT reconstruct solving degree, relation rank, or
          Groebner cost, and is not claimed to. Soundness: the class comparison is
          paired at fixed V and additionally size-matched, so a difference is a
          difference between curves. Transfer: DECLARED UNMET beyond the measured
          primes and factor-base sizes. Cost: O(b^2) group operations and O(b^2)
          memory per curve; at b = 300 and h = 138 that is ~1.2 * 10^7 group
          operations for a whole class, i.e. seconds.
      - transform: representation_reduction
        proposed_object: >-
          Move from "how often does a random target decompose" (a probability
          requiring a sampler, an estimand, and a dispute about which sampler) to
          "how many quadruples of factor-base points satisfy an exact additive
          relation" (an integer requiring nothing). The hypothesis becomes an exact
          equality between two integer multisets rather than a comparison of two
          estimates.
        predicted_gain: >-
          Eliminates the estimand dispute of H-ICINV-6c7920 without adjudicating it,
          eliminates GOAL-ENDO-001 criterion C4's blocking dependency for this
          functional (C4 governs estimators), and eliminates the SR3 seed-ladder
          gate that has twice terminated this lane's contracts on admissibility
          rather than on mathematics.
    quantifier_order: >-
      CLAIMED IN THIS ORDER: FORALL measured primes p, FORALL enumerated classes X
      at p, FORALL factor-base sizes B in the declared sweep, FORALL members E of
      X, the integers (b_E, Energy(E)) are computed and recorded; and the
      class-level statement is FORALL pairs (E, E') in X with b_E = b_{E'},
      Energy(E) = Energy(E') within NULL 1's measured spread -- or its negation,
      EXHIBITED BY AN EXPLICIT PAIR with both curves' (a, b), j, volcano level and
      group structure printed. The weaker order (EXISTS a pair that agrees, or
      EXISTS a B at which a difference appears) is explicitly NOT claimed; a
      difference at one B in the sweep and not others is reported as a
      B-dependence, not as an effect. No quantifier over arities beyond the
      identity (B), over other classes, or over any attack is claimed.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that on the named enumerated classes at the named primes, with the
        named V and the named B-sweep, the exact additive energy of the
        coordinate-defined factor base is, or is not, constant across the class at
        matched size, and hence that the second moment over targets of the m-fold
        decomposition count is, or is not, class-invariant for every m. It can NEVER
        certify anything about solving degree, Groebner cost, relation rank or
        independence, about the FIRST moment beyond what IDEA-20260807-0ff796
        already derives, about any arity's cost in a deployed index calculus, about
        any exponent, about any prime not measured, or about the ECDLP in the
        prime-order subgroup.
      nearby_object_control: >-
        THE NEARBY OBJECT ON WHICH THE HOPED-FOR CONCLUSION MUST FAIL, AND IT MUST
        BE EXHIBITED: the single-arithmetic-progression factor base of
        EXP-RELN-0a979f's ARM-AP-K1, constructed in the exponent domain on the SAME
        curve. It has the same size, the same group, the same pipeline, and
        massively excess energy. If the instrument cannot separate ARM-AP-K1 from
        ARM-UNIFORM at the same b, it has not identified the load-bearing structure
        and every negative from every arm is void. The second nearby object is
        Z/N with the curve removed (NULL 4), on which every forced value must be
        identical -- if it is not, the pipeline is reading the curve where no curve
        should enter.
    proof_obligations:
      - claim: >-
          Parseval and the convolution identity hold as stated and are verified by
          brute force on small groups.
        responsibility: correctness
      - claim: >-
          Energy(E) is computed exactly, including the negation-symmetry and
          diagonal terms, and reproduces M^3 at V = F_p.
        responsibility: baseline
      - claim: >-
          The null energy distribution at each observed b is MEASURED over >= 200
          random symmetric subsets, not assumed from a formula.
        responsibility: success_probability
      - claim: >-
          The class comparison is size-matched, and the b_min-truncated sub-arm
          agrees in sign with the normalised arm.
        responsibility: strictness
      - claim: >-
          The energy oracle is GGM-simulable in b^2 group operations, so no attack
          follows from a positive result without a further, separately argued step.
        responsibility: interface
      - claim: >-
          Nothing transfers to solving degree, to another prime, to any exponent, or
          to the ECDLP in G.
        responsibility: scope
    not_applicable_reason: null
    not_applicable_reason_note: >-
      Filled rather than excused. The FLAT branch of this record is a closure
      argument with a named obstruction covering a whole functional family, which
      docs/inventor-protocol.md section 8 places inside the proof-architecture
      portfolio, so the four cheap pre-compute audits are exactly what a coordinator
      must see before approving compute.

  predictions:
    - metric: >-
        P1 -- GATE. Energy at V = F_p, and the brute-force Parseval/convolution
        checks on Z/7 and Z/11
      direction: different
      minimum_effect: >-
        EXACT: Energy = M^3 on every tested curve at V = F_p, and both identities
        hold on every subset of size 3 of Z/7 and Z/11. Exact integer comparison,
        no tolerance. Any failure is an implementation defect and makes the run
        INVALID.
    - metric: >-
        P2 -- INSTRUMENT GATE, BOTH DIRECTIONS (RQ-INSTR-f8faa0, criterion C4).
        rho for ARM-AP-K1 and for ARM-UNIFORM at matched b on a fixed curve
      direction: different
      minimum_effect: >-
        ARM-AP-K1 must exceed the NULL 1 distribution by at least an order of
        magnitude in rho at the cells where EXP-RELN-0a979f records the 0.0021
        coverage ratio; ARM-UNIFORM must lie inside NULL 1's central interval.
        BOTH ARE REQUIRED. Failure of either voids every other arm of this design.
    - metric: >-
        P3 -- THE DECISIVE MEASUREMENT: the number of DISTINCT values of rho(E)
        across the class at matched b, exhibited as an exact multiset, per B in the
        sweep
      direction: different
      minimum_effect: >-
        DIRECTION DELIBERATELY NOT FIXED, AND NO FIGURE IS INVENTED. The reported
        quantity is the class multiset of rho and its spread, beside NULL 1's
        spread at the same b and NULL 2's gauge spread at the same b. FLAT means
        the class spread does not exceed the larger of the two null spreads at any
        B in the sweep. STRUCTURED means at least one explicitly exhibited pair
        (E, E') at equal b whose energies differ by more than both null spreads,
        with both curves fully identified. Both outcomes are archivable and
        neither is presumed.
    - metric: >-
        P4 -- the association between rho(E) and the true volcano level, and
        separately between rho(E) and the group structure of E(F_p)
      direction: different
      minimum_effect: >-
        Reported as exact contingency tables with cell counts, whether or not any
        spread is seen, and WITHOUT a significance test: the crater has n = 3 on
        the committed class and the campaign's own detection-bound table shows
        nothing below a 9.8% excess is detectable at that stratum size, so a
        p-value here would be theatre. A deterministic statement ("every level-0
        curve has rho above every level-4 curve") is admissible; a statistical one
        is not.
    - metric: >-
        P5 -- the class spread of rho as a function of B (>= 4 values) and of p
        (>= 3 primes)
      direction: lower
      minimum_effect: >-
        A genuine class effect must have a STATED and FITTED dependence on B and on
        p. Pre-registered expectation under the FLAT branch: class spread of rho
        indistinguishable from NULL 1's spread at every B and every p, with both
        shrinking as the sample of quadruples grows. A class spread that is flat in
        BOTH B and p while the null spread shrinks is the canonical artifact tell
        and forces the record to be superseded, not amended.
    - metric: >-
        P6 -- CONTROL, READ FIRST: the gauge-orbit spread of rho at matched b
      direction: different
      minimum_effect: >-
        Computed and written to the run record BEFORE the class arm is read
        (null-first). Predicted: the gauge orbit produces AT LEAST as much spread as
        the class, because gauge dilates V relative to the curve while the class
        does not move V at all. If the class produces materially more spread than
        gauge at matched b and B, that is the interesting outcome and it is what
        BRANCH STRUCTURED means.

  minimal_test:
    design: >-
      STAGE 0 (ZERO COMPUTE). Record the (B) identities and the GGM-simulability of
      the energy oracle in the run record, so that a positive result cannot later be
      mistaken for an attack.
      STAGE 1 (MINUTES, HARD GATE). P1: brute-force Parseval and convolution on
      Z/7, Z/11; Energy = M^3 at V = F_p; the derived sparse-regime null including
      the negation term, checked against direct enumeration.
      STAGE 2 (MINUTES, HARD GATE, BOTH DIRECTIONS OF C4). P2: the six graded arms
      of EXP-RELN-0a979f on ONE curve at matched b. The AP arm must fire and the
      uniform arm must not. Stages 1 and 2 together can kill the record before any
      class is touched, and they cost minutes.
      STAGE 3 (MINUTES). P6: the gauge-orbit null on one class member, >= 30 models,
      written to the record before Stage 4.
      STAGE 4 (SECONDS TO MINUTES PER CLASS). The class arm on the committed
      p = 4001, t = 30 class: one V drawn once and used on all 138 members, exact
      (b_E, Energy(E)) per member, at >= 4 values of B spanning the sparse and
      saturated regimes, plus the b_min-truncated size-matched sub-arm. Cost
      estimate: b = 300 gives 9 * 10^4 pairwise sums per curve, 1.2 * 10^7 for the
      class, seconds in a vectorised implementation.
      STAGE 5 (MINUTES). NULL 1 at every observed b (>= 200 random symmetric
      subsets each) and NULL 4 on Z/N.
      STAGE 6 (HOURS). Repeat Stage 4 at >= 2 further primes with enumerated
      classes, and fit P5.
      STAGE 7 (ZERO COMPUTE). Report the branch, its named obstruction if FLAT, the
      exhibited pair if STRUCTURED, and the forward guidance.
      THE WHOLE DESIGN HAS NO SOLVER, NO GROEBNER BASIS, NO TARGET DRAW, NO SEED
      LADDER AND NO p-VALUE, WHICH IS WHY IT IS THE CHEAPEST DECISIVE ITEM
      AVAILABLE IN THIS LANE.
    controls:
      - NULL 1, matched random symmetric subsets at every observed b (>= 200 each)
      - NULL 2, the gauge orbit at matched b, read first
      - NULL 3, the six graded EXP-RELN-0a979f arms; the AP arm MUST fire
      - NULL 4, Z/N with the curve removed; forced values must match
      - V = F_p forced-value check (Energy = M^3)
      - the b_min-truncated exactly size-matched sub-arm
      - the B-sweep across the sparse/saturated boundary
      - independent recomputation of b_E by direct quadratic-character counting
    required_metrics:
      - exact integers b_E and Energy(E) per (curve, V, B)
      - rho(E) against the MEASURED null distribution at that b, with its spread
      - the class multiset of rho, its spread, and the gauge and null spreads beside
        it, per B and per p
      - the exhibited extremal pair (a, b), j, volcano level and group structure
      - AP-arm and uniform-arm verdicts, reported BEFORE any class number
      - fitted B- and p-dependence of the class spread

  falsification_conditions:
    - >-
      F1 (GATE, MINUTES). P1 fails: Parseval or convolution does not verify, or
      Energy != M^3 at V = F_p. Implementation defect; the run is INVALID and
      returns to the executor. Not evidence about any curve.
    - >-
      F2 (INSTRUMENT GATE, MINUTES). P2 fails in either direction: the AP arm does
      not fire, or the uniform arm sits outside the null. The instrument cannot see
      additive energy or fires on nothing; pause condition P1 of GOAL-ENDO-001
      applies by analogy, every subsequent arm is marked
      attempted_and_inconclusive, and NO negative is reported from any of them.
    - >-
      F3 (THE FLAT BRANCH, WHICH IS A RESULT). The class multiset of rho at matched
      b is contained in NULL 1's spread at every B and every p, while the AP arm
      fires. Then the second and higher moments of every decomposition-count
      functional are class-invariant to within the random-subset null, obstruction
      O-FLAT is named, and the counting half of RQ-ICINV-475b5e is closed for the
      whole family at the stated scope.
    - >-
      F4 (THE FLAT BRANCH COLLAPSES). The class is flat AND the gauge orbit is
      equally flat AND the random-curve set is equally flat -- i.e. every set of
      that size has that energy. Then the flatness is a property of set size, not of
      the isogeny class, and NO closure is licensed. This is a refutation of the
      closure reading and must be reported as one, not as a confirmation. It is the
      most likely way the FLAT branch fails to mean anything, and separating it is
      what the B-sweep across the saturation boundary is for.
    - >-
      F5 (THE STRUCTURED BRANCH). An explicitly exhibited pair at equal b differs in
      energy by more than both null spreads, reproducibly across V draws and at more
      than one B. Then the campaign has its first exact class-varying counting
      functional; it goes IMMEDIATELY to IDEA-20260811-5e58dc's admission threshold
      (is CV * sqrt(2 ln h) >= 1?) and to IDEA-20260807-c36472's identification
      accounting, and it is NOT an attack and may not be reported as one.
    - >-
      F6. Any difference disappears under the b_min-truncated size-matched sub-arm.
      The effect is a factor-base-size effect, hence a quadratic-character-sum
      effect on b_E, hence exactly the channel IDEA-20260807-0ff796 already governs,
      and it is reported as that and not as an additive-structure finding.
    - >-
      F7 (PLANNED NEGATIVE, PRE-REGISTERED). If the outcome is FLAT, the record does
      not get to emit "the axis is closed" and stop. It must emit the named
      obstruction O-FLAT, the exact scope (primes, classes, V, B-sweep), the F4
      separation, the AP-arm verdict, the gauge comparison, and CONCRETE FORWARD
      GUIDANCE naming what remains open -- at minimum: (i) the sixth and higher
      moments, i.e. spectral sup-norm rather than fourth moment, which requires
      dlogs and is therefore toy-only; (ii) STRUCTURED V (intervals, multiplicative
      cosets), where the box-localisation channel D2 of IDEA-20260807-0ff796
      dominates and the class could enter differently; (iii) energies of MIXED sets
      F_V(E) union phi(F_V(E')), which is the EQIC lane's object and is not touched
      here; (iv) whether the same flatness holds for the m-fold sumset SUPPORT (a
      coverage statement) rather than its energy. A negative naming no successor has
      not finished and its honest status is unverified (docs/inventor-protocol.md
      section 4).

  confounders:
    - >-
      FACTOR-BASE SIZE b_E, THE DOMINANT ONE. Energy scales as a power of b and b_E
      varies within the class as a quadratic-character sum at scale sqrt(B). An
      unconditioned comparison is a b comparison. Handled by normalisation at the
      observed b AND by the size-matched truncation, both reported.
    - >-
      GAUGE. Energy is NOT gauge-invariant: the dilation x -> u^2 x moves V relative
      to the curve, so the same curve in a different Weierstrass model has a
      different F_V. NULL 2 measures this floor and it is read first. A class result
      not exceeding the gauge floor is a statement about equation choice.
    - >-
      SATURATION. When b^2 is comparable to M every set has energy near b^4/M and
      the statistic degenerates. The B-sweep must straddle the boundary and the
      regime must be reported with every number, exactly as the campaign's committed
      density-decay table (variance ratio 2.037 at density 0.5306 down to 0.930 at
      0.0234) shows saturation dominating its earlier headline.
    - >-
      GROUP STRUCTURE. E(F_p) need not be cyclic and its structure varies within the
      class (IDEA-20260807-0a3272). A non-cyclic group has different additive
      geometry at the same order, so structure is recorded per curve and every
      comparison is stratified on it.
    - >-
      2-TORSION AND THE NEGATION SYMMETRY. F_V is negation-symmetric, so it carries
      a forced energy contribution, and the count of x in V with x^3+ax+b = 0
      (the r-stratification the campaign already mandates) changes it. r is recorded
      per curve and every comparison is stratified on r, as
      H-VOLC-dff1f8's control (2) requires.
    - >-
      HASHING. The b^2 sums are compared as group elements; a hash collision
      inflates energy. Exact comparison of canonical affine coordinates is required
      and the collision count must be reported as zero.

  interpretation_limits:
    - >-
      claim_tier toy, and no downstream citation may raise it. Named primes, named
      classes, named V, named B-sweep. Nothing here is a statement about any
      cryptographic parameter, and no correspondence exists that would carry the
      measurement to one.
    - >-
      ENERGY BOUNDS THE SECOND MOMENT OF A COUNT. It does not bound solving degree,
      Groebner time, relation rank, relation independence, or the cost of any
      deployed index calculus. The campaign's own committed -0.44%/-0.67% pair
      (large exact changes in S_3 moving Groebner time not at all) is the standing
      demonstration that algebraic-cost functionals do not follow counting ones.
    - >-
      A STRUCTURED RESULT IS NOT AN ATTACK. It is a variance result and the energy
      oracle is GGM-simulable, so it is closed at exponent 1/2 as an oracle
      (KN-FIND-b7e091). Any attack claim would need a separate argument that this
      record does not supply and does not gesture at.
    - >-
      H-ENDO-001 is the admissibility filter and is not retested; no endomorphism is
      applied to any point. KN-FIND-b7e091 is binding and is extended, not revisited,
      by the C3 audit above.
    - >-
      Nothing here bears on H-STR-002 in either direction: no phi-stable factor base
      is built, no equivariance is tested, no relation is collected, and the factor
      base is a plain coordinate window. GOAL-ENDO-001 pause condition P2 is not
      triggered.
    - >-
      Nothing here presumes H-ICINV-6c7920 true or false. It draws no target at all,
      which is a different act from adjudicating which sampler is right.
    - >-
      sqrt(6) remains baseline calibration and never an attack (KN-TECH-018).
      sota_delta zero.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (RANDOM-SUBSET NULL.) For a factor base V drawn uniformly at random from
        F_p with |V| = B, and for E in a fixed ordinary F_p-isogeny class, the set
        F_V(E) behaves, with respect to every additive statistic of order at most
        four, like a uniformly random negation-symmetric subset of E(F_p) of the
        same size b_E; in particular
        E[Energy(F_V(E))] = E[Energy(random symmetric subset of size b_E)] *
        (1 + O(M^{-1/2 + eps})) uniformly over the class.
      rigorous_support: >-
        RIGOROUS INGREDIENT: the mean of the m = 2 relation count over targets is
        EXACT and class-invariant, by the isomorphism iota_R : E -> closure(C_R)
        of IDEA-20260807-0ff796, which gives #C_R^{affine}(F_p) = p - 1 - t; and by
        (B)(ii) that exactness is the chi = 1 Fourier coefficient, so only the
        chi != 1 part is modelled. The error term imitates Weil/Bombieri square-root
        cancellation for character sums along a curve of bounded genus, the same
        classical statement IDEA-20260808-d6d973's HA-1 and IDEA-20260807-0ff796's
        H2 both invoke. WHAT IS HEURISTIC: that the ISOGENY CLASS supplies, at fixed
        V, a family of sets behaving like independent random subsets rather than a
        structured family -- which is precisely the campaign's question, so it is
        stated as an assumption and measured, never assumed away.
      validation_plan: >-
        WHAT IS SAMPLED: for each observed b, at least 200 uniformly random
        negation-symmetric subsets of E(F_p) of size b, giving the empirical null
        distribution of Energy directly (never a formula). Separately, at least 50
        independent draws of V per (class, B) so that V-draw variability is
        measured rather than assumed.
        AT WHAT SCALE: p in {4001, and at least two further primes with fully
        enumerated Hurwitz-Kronecker-certified classes up to ~2^16}; B over at
        least four values spanning b^2 << M to b^2 ~ M; the committed 138-member
        class as the anchor.
        SHORTCUT THAT MAKES SAMPLING FEASIBLE: the statistic needs no discrete
        logarithm and no solver, so the whole null is b^2 group operations per
        draw; and class enumeration uses the vectorised quadratic-character sweep of
        IDEA-20260807-0ff796 STEP 2 rather than Hilbert class polynomials.
        PREDICTED DISTRIBUTION COMPARED AGAINST: the empirical CDF of
        Energy(F_V(E)) over the class against the empirical CDF of the matched
        random-subset null at the same b, by two-sample Kolmogorov-Smirnov distance
        REPORTED AS A DISTANCE and not as a test; and the standardised class values
        against the null's own standardisation.
        TAIL CONSISTENCY CHECKS: the largest and smallest class energy at matched b
        against the null's own extreme order statistics at the same sample size --
        the check that matters, since the lane's question is about the extreme and
        not the bulk; and the count of class members beyond the null's 99th
        percentile against the expected h/100.
        SAMPLED PARAMETERS RECORDED: p, t, D, D_0, f, h, V's seed and size, b_E per
        curve, r per curve, group structure per curve, and the exact commit of the
        enumeration and energy code.
        TRANSFER ASSUMPTION, STATED PLAINLY: NONE IS MADE. There is no correspondence
        that carries an additive-energy measurement on E(F_p) to cryptographic p,
        and this record does not pretend otherwise; the deliverable is a toy-scale
        distribution comparison plus a fitted B- and p-dependence, and the fit is
        not extrapolated.
    - id: H2
      statement: >-
        (SIZE FLUCTUATION.) b_E = |F_V(E)| satisfies
        |b_E - B| = O(sqrt(B log B) + sqrt(p) log p / something) with the
        class-conditional standard deviation of b_E equal to (1 + o(1)) sqrt(B/2)
        for V drawn uniformly at random, so size matching at b_min discards
        O(sqrt(B)) elements and the truncation is a negligible perturbation of the
        energy at the reported precision.
      rigorous_support: >-
        RIGOROUS INGREDIENT: b_E is B plus a sum of quadratic characters
        chi(v^3 + a v + b) over v in V; for random V this is a sum of B
        approximately independent +-1 terms, giving sd sqrt(B) and imitating the
        classical central limit statement for character sums, with Weil's bound
        controlling the complete sum. WHAT IS HEURISTIC: the independence of the
        character values over a random V, and the claim that truncation perturbs
        Energy negligibly at the reported precision.
      validation_plan: >-
        WHAT IS SAMPLED: b_E measured exactly on every class member at every B and
        every V draw, giving the empirical class distribution of b_E directly.
        SCALE: the same ladder as H1. PREDICTED DISTRIBUTION: the empirical class
        sd of b_E against sqrt(B/2), reported as a ratio; and the empirical
        distribution of (b_E - B)/sqrt(B/2) against the standard normal by
        empirical CDF. TAIL CHECKS: the extreme b_E over the class against the
        Gaussian extreme for h draws; and the direct measurement of
        d(Energy)/d(b) by recomputing Energy at b_min, b_min + 1, ..., b_min + 10
        on at least 20 curves, so the truncation perturbation is MEASURED rather
        than argued.
        TRANSFER: toy scale only; nothing is extrapolated.

  reachability_gate: >-
    T5 IS STATED RATHER THAN SKIPPED, AND IT IS LIVE ONLY IN ONE BRANCH. FLAT
    BRANCH: there is no minimiser, every member is equivalent for this functional,
    and the reachability question does not arise. STRUCTURED BRANCH: the gate binds
    immediately and this record does NOT discharge it. It hands the question to
    IDEA-20260811-5e58dc first (is the prize worth anything at all -- compute
    CV(rho) * sqrt(2 ln h) and compare with 1) and to IDEA-20260807-c36472 second
    (can the extremal member be identified in fewer than h evaluations -- for which
    this record's own one-step propagation along a Velu walk is the cheap
    autocorrelation measurement that record asks for). No variance result from this
    contract may be described as an attack, at any size, until both are discharged.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR MOVED, AND NO ALGORITHM IS PRODUCED. The
      record's own computational cost is O(b^2) group operations and O(b^2) hash
      insertions per curve, O(h b^2) per class, plus O(p) per curve for class
      enumeration -- i.e. p^{1+o(1)} to p^{3/2+o(1)} per prime, strictly worse than
      the 0.886 sqrt(N) ~ p^{1/2} rho baseline and affordable only because it is a
      measurement. Stated as a CAP rather than as an improvement: because the
      energy oracle is GGM-simulable in b^2 group operations (see admissibility),
      no algorithm built on it can beat exponent 1/2, so even the STRUCTURED branch
      cannot yield an exponent without a separate non-generic step.
    memory_exponent: >-
      O(b^2) group elements for the sum multiset -- at b = 300 that is 9 * 10^4
      entries, kilobytes; O(p) bytes for the character table in class enumeration.
      Memory is not the binding constraint at any scale this record measures.
      TRADEOFF NOTE: the b^2 memory can be traded for time by sorting in blocks,
      giving O(b^2 log b) time at O(b) memory, which matters only if B is pushed
      past ~10^4 and is recorded so that a future contract need not rediscover it.
    best_known: >-
      For prime-field ECDLP: parallel Pollard rho with distinguished points at
      0.886 sqrt(N) group operations and O(1) memory per processor (KN-TECH-001,
      KN-TECH-006), with the negation discount already included; the
      automorphism-discounted variant on CM curves at a factor at most sqrt(6)
      (KN-TECH-018); BSGS at sqrt(N) time and sqrt(N) memory (KN-TECH-031). For the
      decomposition step specifically, KN-TECH-003's heuristic |F|^m/(m! N), whose
      FIRST moment IDEA-20260807-0ff796 makes exact at m = 2 and whose SECOND
      moment this record makes exact at every m. None of the baselines changes.
    hidden_overhead: >-
      The whole result hides inside "SECOND MOMENT" and "AT MATCHED SIZE". A
      class-invariant energy is compatible with a class-varying spectral SUP-NORM
      (the sixth and higher moments), which this record does not measure because
      the sup-norm requires discrete logarithms; and it is compatible with a
      class-varying solving degree, which is a different object entirely. Both
      qualifiers must appear in every downstream sentence. Also hidden: "for a
      RANDOM V" -- structured V is explicitly out of scope and is named in the
      forward guidance.
    tradeoff_note: >-
      No attack, so no cryptanalytic tradeoff. The measurement parallelises
      trivially across curves and across V draws (embarrassingly parallel, one
      curve per worker, no shared state), which is worth recording because the
      campaign's committed instrument failures have all been on
      host-load-sensitive sampling contracts and this one is not: its outputs are
      exact integers that contention cannot corrupt.

  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES AGAINST EVERY ROW OF THE
    PRIME-FIELD FRONTIER, AND NOT LEFT NULL. (i) Parallel Pollard rho with
    distinguished points: 0.886 sqrt(N) group operations, O(1) memory per
    processor, linear parallel speedup (KN-TECH-001, KN-TECH-006). (ii) The
    automorphism-discounted variant on CM curves: same exponent, constant discount
    at most sqrt(6) (KN-TECH-018). (iii) BSGS: sqrt(N) time, sqrt(N) memory,
    deterministic (KN-TECH-031). (iv) For the decomposition stage, KN-TECH-003. This
    record mounts no attack, produces no relation-collection speedup, and its own
    measurement costs more than rho at every p, so it is dominated by (i)-(iv) on
    time, by (i) and (ii) on memory, and by all of them on data/queries since it
    reads the curve equation and enumerates a whole class where rho reads only the
    group. As an INSTRUMENT it is not dominated by anything in the corpus: no
    committed contract computes an exact additive statistic of a coordinate-defined
    factor base as a function of the curve, and EXP-RELN-0a979f -- the only energy
    contract that exists -- holds the curve fixed by construction.
  sota_delta: >-
    ZERO on every attack axis: rho constant 0.886 sqrt(N), exponent 1/2, memory
    O(1), unchanged. The delta is a MEASUREMENT and CLOSURE delta and is stated
    quantitatively: it replaces an ESTIMATED first moment of the decomposition
    count (T = 400 sampled targets, a disputed sampler, a seed ladder that has
    twice fired its own stability criterion) with an EXACT integer second moment
    computed in O(b^2) group operations with zero sampling error, and it converts
    the open item "the VARIANCE and higher moments" of IDEA-20260807-0ff796 section
    (E) from an unbounded programme into a single per-curve integer that bounds
    the target-variance of the m-fold decomposition count at EVERY arity m at once.
    Cost of the delta: seconds per class where the current design spends hours and
    terminates on admissibility.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high

  novelty_status: unverified
  novelty_screen:
    method: >-
      Repository greps run 2026-08-11 with the Grep tool: patterns
      "additive energy|Fourier flat|sumset|autocorrelation of the factor
      base|spectrum of the factor base" over *.yaml repository-wide;
      "Fourier|character sum|Parseval|additive energy|exponential sum" over
      ledger/; "RQ-(ICINV|VOLC|EQIC|EWALK|...)" over ledger/proposals to bound the
      ENDO corpus at 155 files. Full reads: IDEA-20260807-0ff796 (entire),
      EXP-RELN-0a979f specification (inputs, arms, controls), H-ICINV-d5e351,
      H-VOLC-dff1f8, RQ-ICINV-475b5e, DECOMPOSITION.md, KN-FIND-b7e091.
    grep_results: >-
      "additive energy" appears in exactly three places: EXP-RELN-0a979f (curve
      fixed, exponent-defined bases, energy as the INDEPENDENT variable -- separated
      above), CORR-20260807-f551a5 and CORR-20260807-732541 (sumset_m3 /
      sumset_eff_m3 diagnostics in a different contract's terminal-state
      accounting), and IDEA-20260805-a25f11's lineage. "Fourier flatness" appears
      exactly once in the whole ENDO corpus: in IDEA-20260807-0ff796 section (E), as
      an item explicitly NOT CLOSED. No record computes an additive statistic of a
      coordinate-defined factor base as a function of the curve, and no ENDO record
      contains Parseval or a character-spectrum identity.
    external_check_not_done: >-
      NOT CHECKED AGAINST EXTERNAL LITERATURE. The crypto-kb MCP index is configured
      :memory: and empty this session; WebSearch/WebFetch resolve to a Bedrock-backed
      model and were refused under AGENTS.md rule 16. No network novelty check was
      performed and none is claimed. Absence of a corpus hit is not evidence that
      something was not tried.
    specific_external_check_that_would_settle_it: >-
      Search the analytic number theory of elliptic curves over finite fields for
      bounds on incomplete character sums over the group E(F_p) restricted to points
      whose x-coordinate lies in a set or interval -- keywords: Kohel-Shparlinski
      "exponential sums and group generators for elliptic curves", Lange-Shparlinski
      "certain exponential sums and random walks on elliptic curves", Bourgain-
      Konyagin-Shparlinski sum-product on elliptic curves, and "additive energy of
      the set of points with x-coordinate in an interval". A positive hit giving a
      nontrivial bound on the sup-norm of the spectrum would turn the FLAT branch
      from a measurement into a theorem and would be an INGREDIENT, not a
      disappointment; a hit showing such bounds are open would sharpen the
      STRUCTURED branch into a statement about an open problem. Either way it should
      be logged in knowledge/literature/ when the check is possible.
    conclusion: >-
      UNVERIFIED. Additive energy and Parseval are standard and are claimed novel
      nowhere. What is claimed is that no record in this program computes them as a
      curve functional across an isogeny class, and that IDEA-20260807-0ff796 names
      this exact quantity as open -- both of which rest on the greps above and
      nothing more.

  honest_prior_of_survival: >-
    0.95 that the Stage 1 gates pass (they are exact identities on tiny objects).
    0.80 that the Stage 2 planted-signal gate passes -- lower than it looks, because
    EXP-RELN-0a979f's own collapse figure is at N ~ 2^18 and m = 3 while this design
    reads a fourth-moment statistic at possibly smaller b, and an instrument that
    cannot see the AP arm at the chosen b would be a real and useful finding about
    the statistic's sensitivity. 0.70 that the class arm comes out FLAT and survives
    the F4 separation, which is the closure outcome; 0.20 that it comes out flat but
    collapses under F4 (every set of that size has that energy), which licenses
    nothing; 0.10 that a size-matched, gauge-exceeding, B-stable difference survives,
    which hands the lane its first exact class-varying counting functional and is
    the branch worth the most.

