  minimal_test:
    design: >-
      Enumerate E(F_17), including the point at infinity. For each
      point R, compute 2R. Count hits on (0, 1) and on (13, 1). Repeat
      the count for (0, 1). Report both counts, the gap, and the
      self-gap. Do not search for a scalar.
    controls:
      - The second count for (0, 1) equals the first. A disagreement voids the run.
      - Doubling (0, 1) by the addition law yields (13, 1). Any other double voids the run and is not a preimage result.
    required_metrics:
      - preimage count of (0, 1)
      - preimage count of (13, 1)
      - absolute gap
      - self-gap
      - double of (0, 1)
  falsification_conditions:
    - The census finishes, the double of (0, 1) is (13, 1), the self-gap is 0, and the counts are not 0 and 2.
    - A failed doubling check or a nonzero self-gap voids the run and is not a mathematical negative.
  confounders:
    - Using a different curve model, or dropping the point at infinity, can change a count that included it. Neither named target is the point at infinity.
    - KR-IC-955fd6 uses torsion to shrink decomposition systems. This record does not.
    - A curve-only count of all 2-torsion points does not name (0, 1) or (13, 1) and is not this gap.
  interpretation_limits:
    - The gap does not output a discrete logarithm and does not move the exponent 1/2.
    - It does not say that torsion reveals k. Both points are public, and the scalar from (0, 1) to (13, 1) is the integer 2 produced by one doubling.
    - No transfer beyond F_17 is claimed.
    - KR-RHO-13bf67 remains in force.
  heuristic_assumptions:
    - id: H1
      statement: >-
        If 2R were a uniform random point of E for each R, each named
        target would have expected preimage count 1. The doubling map
        is a homomorphism, so the counts are 0 or the kernel size, not
        independent Bernoulli trials. The uniform model is the null.
        The exhaustive census is the test.
      rigorous_support: >-
        On a finite abelian group the image of multiplication by 2 has
        index gcd(2, #E), and every image point has the same number of
        preimages. That structural fact is why the counts can differ.
        The uniform model is what the gap rejects. KR-RHO-13bf67 is the
        separate generic lower bound. This heuristic does not replace it.
      validation_plan:
        sampling: >-
          Exhaustive census of E(F_17). No random subsample.
        comparison: >-
          The two counts against 0 and 2, and the self-gap against 0.
        tail_check: >-
          Repeat the preimage count of (0, 1) and of its double on the
          same curve equation over F_19, if (0, 1) lies on the curve.
          Record the two counts. They do not change the F_17 assignment.
          If (0, 1) is not on the curve over F_19, record that and do
          not pick a replacement point after seeing a count.
        parameters: >-
          F_17 for the claim. F_19 for the scope check only. Curve
          y^2 = x^3 + x + 1. Targets (0, 1) and (13, 1) at p = 17.
