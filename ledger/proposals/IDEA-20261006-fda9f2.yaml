  title: >-
    Doubling-preimage gap of (0, 1) and (13, 1) on y^2 = x^3 + x + 1 over F_17
  class: measurement
  claim: >-
    On E: y^2 = x^3 + x + 1 over F_17, the equation 2R = (0, 1) has 0
    solutions R in E(F_17), and the equation 2R = (13, 1) has 2
    solutions. The absolute gap of the two counts is 2. A recount that
    returns any other pair of counts is a negative. The point (13, 1)
    is the double of (0, 1), obtained from the addition law. The two
    counts do not recover a discrete logarithm. A curve-only statistic
    that ignores which point is named is not this claim.
  mechanism: >-
    Doubling is a group homomorphism. Its kernel on a finite group has
    size gcd(2, #E). A point outside the image has 0 preimages, and a
    point in the image has that kernel number of preimages. Here the
    named counts are 0 and 2. The question asks whether ell-torsion, as
    a Galois or endomorphism module, carries public information about a
    discrete logarithm. These counts are computed from the addition law
    on two public points. They do not output a scalar k with kP = Q for
    an unknown k. The nearby object is the same count for (0, 1)
    against a second pass, whose gap is 0, so a gap of 2 is predicted
    false there.
