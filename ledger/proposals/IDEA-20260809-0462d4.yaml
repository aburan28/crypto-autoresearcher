idea:
  id: IDEA-20260809-0462d4
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-EDDSA-9b8473
  goal_id: GOAL-EDDSA-001
  title: >-
    Byte-level signature non-uniqueness: distinct signature encodings that
    verify for the same (key, message) under at least one admissible reading
  class: measurement
  claim: >-
    Under at least one admissible reading, the map from (key, message) to the
    SET of accepted signature byte strings is not a singleton, because the
    S-component range check and the point-encoding canonicity check each admit
    more than one representative. Systems that treat a signature's bytes as a
    unique identifier — deduplication caches, transaction identifiers, signed
    log entries keyed by signature hash — depend on that map being a singleton,
    and the claim is that its cardinality is exactly computable per reading.
  mechanism: >-
    S is reduced modulo the group order in the honest signer, but a verifier
    that only checks S < 2^256 accepts S + kL for any k keeping the value in
    range. Similarly a decoder that accepts non-canonical y encodings accepts
    two byte strings for one point. Each relaxation multiplies the accepted set;
    the product over relaxations is the cardinality.
  why_not_a_renamed_known_approach: >-
    Signature malleability is a known concept, usually discussed for ECDSA's
    (r, s)/(r, -s) symmetry. Here the object is different: not a symmetry of the
    equation but an ENCODING-LEVEL multiplicity, and the deliverable is the
    exact cardinality per admissible reading, computed rather than asserted.
  predictions:
  - observable: cardinality of the accepted signature-encoding set per reading
    metric: exact integer per reading
    predicted: >-
      Strictly greater than one for at least one admissible reading, and exactly
      one for the strictest reading. If the strictest reading also admits more
      than one, that is a stronger and more surprising result.
  - observable: whether any multiplicity survives when both the S-range check and canonical encoding are enforced
    metric: boolean
    predicted: No. A surviving multiplicity under the strictest reading would falsify the assumption that strict verification is uniqueness-restoring.
  minimal_test: >-
    For one honest (key, message, signature), enumerate all byte strings
    reachable by the enumerated relaxations, evaluate under each reading, and
    emit every accepted string as part of a certificate set. Verify each with a
    second implementation. Report cardinalities as a table over readings.
  controls:
  - 'CANONICAL BASELINE: the honest signature must be in every accepted set; if it is not, the harness is wrong.'
  - 'RANDOM PERTURBATION NULL: random byte perturbations must be rejected under every reading, isolating the structured relaxations as the mechanism.'
  falsification_conditions:
  - Every reading accepts exactly one encoding, which would mean the uniqueness assumption holds across the admissible space and the systems relying on it are safe from this mechanism.
  - The multiplicity is present but unreachable without signing-key control, which would move it to a weaker adversary class and must be recorded as such.
  interpretation_limits: >-
    Non-uniqueness of encodings is not forgery and not key recovery. Where a
    dependent system is described, it is described as a pattern; no product,
    chain or service is named or characterized.
  sota_delta: 'No attack. Delta: an exact per-reading cardinality where the literature offers a qualitative warning.'
  dominated_by: 'Not dominated by any corpus record. Related external work is RECALLED and unlocated; the cardinality computation is not known to exist.'
  estimated_cost: Implementation small; compute negligible.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for malleability/encoding/EdDSA: no records on this object. WEB NOT CHECKED.'
  source_refs:
  - RFC 8032 -- REQUIRED READ, NOT YET READ.
