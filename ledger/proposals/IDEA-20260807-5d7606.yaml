idea:
  id: IDEA-20260807-5d7606
  question_id: RQ-CLGP-b99df5
  added: '2026-08-07'
  title: >-
    FORWARD REDUCTION ATTEMPT, STATED AND THEN BROKEN AT A NAMED POINT: a free
    Cl(O)-vectorization oracle for the instance's own isogeny class does not
    solve ECDLP, because the unique canonical point-to-curve bridge is the
    Deuring kernel-ideal correspondence, that correspondence is defined on
    SUBGROUPS, and a prime-order subgroup has exactly one nonzero subgroup, so
    the bridge is CONSTANT on the instance family
  class: mechanism

  claim: >-
    (A) THE REDUCTION BEING ATTEMPTED, WITH ITS QUANTIFIER ORDER WRITTEN OUT.
    The statement a forward reduction would have to establish is

      FORALL primes p > 3,
      FORALL ordinary E/F_p with End_{F_p}(E) = O an order in K = Q(sqrt(D)),
      FORALL P in E(F_p) generating a subgroup G of PRIME order N,
      THERE EXISTS a probabilistic polynomial-time oracle machine R
      such that FORALL k in Z/N,
        Pr[ R^{V_E}(p, E, P, [k]P) = k ] >= 2/3,

    where V_E is a vectorization oracle for the isogeny class of E: on input a
    pair (E_1, E_2) of curves in that class with End = O it returns the unique
    [a] in Cl(O) with [a] * E_1 = E_2, at unit cost.

    The order is load-bearing and is the exact place these arguments usually
    break. R is allowed to depend on the CURVE (a per-curve, even nonuniform,
    reduction is granted, which is generous), but is required to work for ALL k
    on that curve. Two weaker readings must never be substituted for it:
      (W1) FORALL k THERE EXISTS R_k -- letting the machine depend on the
           answer. Satisfied trivially by the machine that prints k. Proves
           nothing. Any argument that slides into this order is void.
      (W2) FORALL (E, P, Q) THERE EXISTS a curve pair whose vectorization
           determines k -- an existential over queries with no requirement that
           R can CONSTRUCT that pair. This is the reading that makes a
           nonexistent reduction look plausible: such a pair does exist
           (see (D)), and it is not constructible from the instance.

    (B) THE ONLY CANONICAL BRIDGE, NAMED. For an ordinary curve with
    End_{F_p}(E) = O, the Deuring/Waterhouse ideal-subgroup correspondence
    assigns to each finite O-stable subgroup H of E an O-ideal a_H, with
    H = E[a_H] and E/H = [a_H]^{-1} * E. This is the point at which the point
    world and the curve world actually touch, and it is the map any forward
    reduction is implicitly reaching for. Composing gives the canonical
    point-to-curve bridge
        beta : Q  |-->  <Q>  |-->  a_{<Q>}  |-->  [a_{<Q>}] in Cl(O).

    (C) OBS-1, THE PRIME-ORDER COLLAPSE -- WHERE beta FAILS. N is prime, so for
    every k in (Z/N)^*, <[k]P> = <P> = G. Therefore beta([k]P) = beta(P) for
    every nonzero k, and the ideal it returns is the SAME ideal
        n = (N, pi - 1)  (of norm N, dividing (pi - 1) since G is contained in
        ker(pi - 1) = E(F_p)),
    a function of (E, N) alone. The bridge EXISTS, is efficiently computable,
    and carries exactly ZERO bits about k. This is the sharpest available form
    of the obstruction, and note its shape: the failure is not that no map
    exists -- the map exists and is canonical -- but that it is constant on the
    instance family. That distinction is the whole content of this record.
    Corollary (OBS-1'): ANY curve-valued function of (E, P, Q) that factors
    through the subgroup lattice of E is k-constant on {(E,P,[k]P)}.

    (D) OBS-2, THE DENSITY OBSTRUCTION -- WHERE THE OBVIOUS REPAIR FAILS. The
    natural repair is to build a curve from Q by NON-subgroup means, e.g. feed
    x(Q) in F_p into a curve construction. Such a curve does depend on k. But
    V_E is only defined on curves in the isogeny class of E, and the class
    contains ~ h(O) = O(sqrt(p) log p) of the ~ 2p isomorphism classes over
    F_p, i.e. a subset of DENSITY ~ p^{-1/2}. A k-dependent construction that
    is not designed to preserve the trace lands in the class with probability
    ~ p^{-1/2}, so rejection sampling to get a usable query costs ~ p^{1/2}
    trials -- exactly rho's exponent, with each trial additionally paying a
    point count. So this repair cannot beat the baseline even in the best case,
    and this is a QUANTITATIVE closure, not a hand-wave. (Membership in the
    class IS decidable in polynomial time by point counting; the obstruction is
    the density, not the test.)
    Note the existential in (W2) is exactly what (D) makes non-constructive:
    a pair whose vectorization encodes k does exist -- take any bijection
    Z/N -> a size-N subset of instances -- but naming its second component
    requires knowing k.

    (E) WHAT WOULD FALSIFY THIS RECORD, CONCRETELY. Exhibit a polynomial-time
    algorithm that, from (E, P, Q) alone, outputs a curve E'' in the isogeny
    class of E such that the map k |-> E''(k) is non-constant on (Z/N)^*. That
    is a single, checkable object. Its existence would refute OBS-1' and reopen
    the forward direction immediately. This record asserts no impossibility
    theorem for arbitrary algorithms -- see interpretation_limits.

  resource_label: >-
    R3 (End(E) as a ring: the kernel-ideal correspondence and the ideal
    n = (N, pi - 1)) and R4 (the class-group action on curves, via the
    vectorization oracle). No step applies an endomorphism to a point of G.
  admissibility: admissible
  admissibility_argument: >-
    The resource is not a group-operation output. A vectorization oracle
    answers a question about CURVES (which element of Cl(O) connects them);
    nothing in the mechanism applies phi to a point of G, so the
    H-ENDO-001 scalar-collapse filter does not apply, and KN-FIND-b7e091's
    two closed oracle classes (incidence, endomorphism-image) are not the
    oracle used here. The proposal is therefore admissible on its face -- and
    it then fails for a DIFFERENT reason, which is exactly why it is worth
    filing: a lane can pass the admissibility filter and still be closed.

  discriminated_from:
    - >-
      IDEA-20260806-0c9de1, which also uses the word "torsor" but tracks a
      COMPLETELY DIFFERENT one: the (Z/N)^*/{+-1}-torsor of X_1(N)-points over
      a point of X_0(N), where k IS the torsor coordinate. Here the torsor is
      Cl(O) acting on CURVES and k is a torsor INVARIANT. Opposite situations:
      there the DLP is the torsor coordinate, here the torsor coordinate is
      independent of the DLP. Both records may be right.
    - >-
      KN-TECH-027 (CSIDH class-group action) records vectorization as an
      adjacent post-quantum problem. It does not ask, and this corpus has
      nowhere asked, whether vectorization reduces to or from ECDLP.
    - >-
      H-ENDO-001 / KN-FIND-b7e091 close the ENDOMORPHISM-IMAGE oracle. This is
      a vectorization oracle, a strictly different object (its answers live in
      Cl(O), not in E). The closure here is by a new obstruction, not by
      citation of theirs.
    - >-
      T1/T2 of the decomposition (transport). Transport says k is PRESERVED
      when moving along an isogeny. This record says the converse-flavoured
      thing: because k is preserved, the curve coordinate carries none of it.
      T1 is the input to OBS-1', not a duplicate of it.

  object_first_candidate:
    tracked_object: >-
      THE KERNEL IDEAL OF THE SUBGROUP GENERATED BY THE TARGET POINT:
      Q |-> a_{<Q>} in the ideal monoid of O, followed as k varies over
      (Z/N)^*. Not "the ideal class connecting E to E'" (that is the
      established vectorization object and is off-limits as the primary lens
      here); the tracked object is anchored at the POINT.
    lossiness: >-
      GENUINELY LOSSY, and lossy in exactly the wrong way for the attacker: it
      forgets which generator of <Q> was chosen, keeping only the subgroup.
      Since N is prime that is a quotient by (Z/N)^*, i.e. it discards
      log2(N-1) bits and retains one bit (zero or not). The lossy-projection
      test is passed -- this is not a change of coordinates -- and the object
      is then USELESS precisely because the discarded coordinate is k itself.
    propagation: >-
      Deterministic and compatible with the target's operations: a_{<Q1+Q2>}
      is determined by <Q1+Q2>, and the correspondence is equivariant for the
      Cl(O)-action, so transporting along phi_b sends a_{<Q>} to the same
      ideal a (the ideal does not move; the curve does). One-step propagation
      is therefore well defined and measurable: apply a group operation, ask
      whether the ideal changed. It never does, for N prime.
    survival_score: >-
      Survives every isogeny in the class (the ideal n = (N, pi - 1) is
      class-wide constant, see IDEA-20260807-02b7b2). Dies -- becomes
      non-constant -- exactly when G is NOT of prime order, which is the
      calibrated non-null in IDEA-20260807-e9d57c. That is the structural
      boundary of the object and it is a sharp one.

  mechanism: >-
    STEP 1 (zero compute, symbolic). Write the reduction statement in the
    quantifier order of (A). Freeze it. All subsequent steps refer to it.

    STEP 2 (zero compute, symbolic). Enumerate the curve-valued functions of
    the instance that a polynomial-time R can actually construct:
      (i) E itself and its twists;
      (ii) E/H for H a finite subgroup of E that R can name -- and R can name
           subgroups only as <S> for points S it holds, or as E[m] for integers
           m, or as ker(phi_a) for ideals a it writes down;
      (iii) [a] * E for ideals a written down independently of Q;
      (iv) curves built from field elements R possesses, principally x(Q).
    Classify: (i)-(iii) are k-independent by inspection. (ii) with H = <Q> is
    k-independent by OBS-1. (iv) is k-dependent but lands in the class with
    density p^{-1/2} (OBS-2). This enumeration is the argument's load-bearing
    step and is the thing an adversarial reviewer should attack.

    STEP 3 (toy compute, cheap, HARD GATE). Instrument the constancy claim
    rather than asserting it. For each toy curve in the frozen family:
    compute G, compute n = (N, pi - 1) as a binary quadratic form / ideal in
    O, and for 200 values of k compute a_{<[k]P>} and E/<[k]P>. Assert
    equality across all k. A single k for which the ideal or the quotient curve
    differs falsifies OBS-1 as implemented (almost certainly an implementation
    error, since OBS-1 is elementary -- so a mismatch halts the line for
    debugging and is NOT reported as mathematics).

    STEP 4 (toy compute). Measure OBS-2's density directly: enumerate all
    F_p-isomorphism classes for small p, count those with trace t, and compare
    the measured density against h(O)/(2p) and against the predicted p^{-1/2}
    scaling across a ladder of p. This turns the density obstruction from a
    quoted asymptotic into a measured curve at toy scale, with its own null
    (the same count for a random trace t' != t).

    STEP 5 (zero compute). Record the residual open class explicitly:
    constructions of type (iv) that are ENGINEERED to preserve the trace, i.e.
    curve-valued functions of x(Q) as a FIELD ELEMENT (resource R1) composed
    with a trace-preserving construction. This record does not close that
    class; it hands it to the R1 lanes and to IDEA-20260807-326442.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Repository greps on 2026-08-07 (ripgrep via the Grep tool, case
      insensitive), over ledger/, knowledge/, docs/, analysis/:
      (1) "vectoriz" ; (2) "class group|Cl\(O\)|class number|vectoriz" ;
      (3) "kernel ideal|bridge map|torsor|ideal-subgroup|Deuring
      correspondence" ; (4) "Hafner|McCurley|CSI-FiSh|Beullens|Kuperberg".
      Full reads: KN-TECH-027, KN-TECH-029, KN-TECH-081, KN-FIND-5c1a03,
      KN-FIND-b7e091, H-ENDO-001, RQ-CLGP-b99df5, DECOMPOSITION.md,
      IDEA-20260806-0c9de1 (header + novelty screen).
    results: >-
      "vectoriz" in ledger/ and knowledge/: every hit is in the SUPERSINGULAR
      lane (GOAL-SSI-001, KN-TECH-027, DEC-20260804-3677f1, DEC-20260725-004,
      EV-SSI-003), where CSIDH vectorization appears as an adjacent baseline
      that DOMINATES a proposal, never as a reduction target. Zero records
      anywhere ask whether vectorization reduces to or from ECDLP.
      "kernel ideal|ideal-subgroup": 77 hits over 27 ledger files, all in
      supersingular/quaternion contexts; none in an ordinary prime-field ECDLP
      context and none pairing the kernel-ideal correspondence with a
      prime-order subgroup. "torsor": IDEA-20260806-0c9de1 uses a different
      torsor (modular-curve diamond action), discriminated above.
    verdict: >-
      ADAPTATION. The kernel-ideal correspondence (Deuring/Waterhouse/Kohel)
      and the class-group action are textbook; nothing about them is claimed
      as new. What is new to THIS corpus is the composition -- pointing the
      correspondence at a prime-order ECDLP subgroup and observing that the
      resulting bridge is canonical, computable, and constant -- and the
      quantitative density obstruction OBS-2. No claim of novelty against the
      external literature is made: it is entirely possible this observation is
      folklore, and if a reviewer can cite it, that citation is a better
      deliverable than this record.

  null_object_control: >-
    MANDATORY AND BLOCKING. Matched null of the same shape: the SAME pipeline
    run on curves where G has COMPOSITE order, specifically N = ell^e (see
    IDEA-20260807-e9d57c). There the bridge beta is NOT constant --
    a_{<[k]P>} has norm ell^{e - v_ell(k)} -- so the instrument must report a
    non-constant bridge. An instrument that reports "constant" on the
    composite-order null cannot see a bridge at all, every constancy verdict
    it produced is void, and the run set is INVALID rather than negative.
    DECAY PARAMETER: e, the exponent in N = ell^e. As e decreases to 1 the
    bridge's measured information about k must decay to zero (log2(e+1) -> 0
    bits); a signal that does NOT decay as e -> 1 is the canonical artifact
    tell and indicates the detector is reading something other than the
    bridge.

  assumptions:
    - >-
      E is ordinary over F_p with End_{F_p}(E) = O and N is prime with
      N^2 does not divide #E(F_p), so G is the unique order-N subgroup of
      E(F_p) and n = (N, pi - 1) is the ideal the correspondence returns.
      Curves violating this are excluded and the exclusion is checked per
      instance, not assumed.
    - >-
      The vectorization oracle is granted for FREE and at UNIT COST. This is
      deliberately generous: the argument must survive an oracle strictly
      stronger than any known algorithm, or it proves nothing about the real
      setting.
    - >-
      "Canonical" in (B) means functorial and End-equivariant. The claim that
      the kernel-ideal correspondence is the UNIQUE such map is stated as
      [open] at the level of a uniqueness theorem; what is rigorous here is
      that it is A canonical map and that it is constant. A referee-quality
      uniqueness proof is listed as a proof obligation, not claimed.

  proof_search_map:
    bottleneck: >-
      Step 2's enumeration of curve-valued functions constructible in
      polynomial time from (E, P, Q). Everything else follows mechanically.
      This is the exact step whose incompleteness would overturn the record,
      and it is the step a red team should attack first.
    baseline_embedding:
      parameter_slice: >-
        Set the vectorization oracle to the trivial oracle (always returns the
        identity class). The reduction statement must then degenerate to plain
        ECDLP, for which the baseline is parallel rho with distinguished points
        at 0.886 sqrt(N) group operations and O(1) memory (KN-TECH-001,
        KN-TECH-006). Any reduction claimed here must beat that at the same
        parameters or it is not a result.
      reproduction_check: >-
        Frozen regression fixture: three toy instances at 16, 20 and 24 bits,
        solved by harness/rho.py, with the measured operation count compared
        against 0.886 sqrt(N) to within 20 percent. If the baseline does not
        reproduce, no comparison in this record is interpretable.
    observation_collision:
      observable: >-
        beta(Q) = [a_{<Q>}] in Cl(O), the class-group element the bridge
        returns.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED MAXIMALLY. Search for two instances
        (E,P,Q_1) and (E,P,Q_2) with Q_1 != Q_2 and beta(Q_1) = beta(Q_2).
        Prediction: EVERY pair collides, i.e. the observable has exactly one
        value on the whole family, so the fibre of the observable is the
        entire instance set. This is the strongest possible collision result
        and it IS the obstruction; finding even one non-colliding pair with N
        prime would refute the record.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The fibre beta^{-1}([n]) intersected with the instance family. The
          transform is run in the falsifying direction: if the fibre is the
          whole family, the observable cannot separate instances and no
          reduction can be built on it.
        predicted_gain: >-
          None as an attack. The gain is a closure of exactly the right shape:
          a named observable with a proved trivial fibration.
      - transform: boundary_lift
        proposed_object: >-
          Lift the hypothesis "N prime" to "N = ell^e" and re-run the same
          observable. The fibration becomes non-trivial with e+1 fibres.
        predicted_gain: >-
          Locates the exact boundary at which the obstruction switches on, and
          supplies the calibrated non-null the null_object_control requires.
          Costed in IDEA-20260807-e9d57c.
    quantifier_order: >-
      INTENDED (what a reduction must prove): FORALL p, FORALL (E, O, P, N),
      THERE EXISTS a PPT oracle machine R, such that FORALL k in Z/N,
      R^{V_E}(E, P, [k]P) = k with probability at least 2/3.
      NOT CLAIMED AND NOT SUFFICIENT: FORALL k THERE EXISTS R_k (trivial); or
      FORALL instances THERE EXISTS a query pair determining k, with no
      constructibility requirement (true, and useless, per (D)).
      WHAT THIS RECORD ASSERTS: FORALL k in (Z/N)^*, beta([k]P) = beta(P) --
      a universally quantified equality with no existential at all, which is
      why it is elementary and why it is the right shape of obstruction to
      state.
    method_ceiling:
      strongest_certifiable_claim: >-
        "No forward reduction whose oracle queries are curves obtained from
        the instance through the subgroup lattice of E can recover any bit of
        k, for N prime." It can NEVER certify that no forward reduction
        exists: a reduction using x(Q) as a field element with a
        trace-preserving construction is outside the argument, and so is any
        reduction using the concrete point representation. Dropping either
        qualifier is overclaiming under AGENTS.md rule 4 and under
        docs/inventor-protocol.md section 4.
      nearby_object_control: >-
        THE COMPOSITE-ORDER CURVE (N = ell^e). There the desired conclusion
        FAILS -- the bridge is non-constant -- which proves the argument is
        actually using the primality of N and is not a vacuous restatement of
        "curves are not points". A closure argument that also "proves" the
        composite case would be identifying the wrong structure.
    proof_obligations:
      - claim: >-
          For N prime and k in (Z/N)^*, <[k]P> = <P>, hence beta is constant.
        responsibility: correctness
      - claim: >-
          n = (N, pi - 1) is the kernel ideal of G and has norm N.
        responsibility: correctness
      - claim: >-
          The isogeny class has O(sqrt(p) log p) members among ~2p classes, so
          density is O(p^{-1/2} log p).
        responsibility: size
      - claim: >-
          Step 2's enumeration of constructible curve-valued functions is
          exhaustive for polynomial-time R in the declared representation.
        responsibility: scope
      - claim: >-
          The kernel-ideal correspondence is the unique functorial
          End-equivariant subgroup-to-ideal map.
        responsibility: correctness
        status: '[open] -- stated as a proof obligation, NOT claimed'
      - claim: >-
          The composite-order control produces a non-constant bridge.
        responsibility: baseline

  predictions:
    - metric: >-
        number of distinct values of beta([k]P) over 200 sampled k in
        (Z/N)^*, per toy curve with N prime
      direction: lower
      minimum_effect: >-
        Exactly 1, on 100 percent of tested curves. Any curve returning 2 or
        more distinct values with N prime and the primality control passing
        falsifies OBS-1 and halts everything.
    - metric: >-
        number of distinct values of beta([k]P) over 200 sampled k, on the
        COMPOSITE-ORDER null with N = ell^e
      direction: higher
      minimum_effect: >-
        At least min(e, 3) + 1 distinct values, matching the predicted count
        e+1. Fewer means the instrument is blind and the whole run set is
        invalid rather than negative.
    - metric: >-
        measured density of the isogeny class among all F_p-isomorphism
        classes, as a function of p over the toy ladder
      direction: lower
      minimum_effect: >-
        Fitted slope of log(density) against log(p) in [-0.65, -0.35],
        consistent with the predicted -1/2 up to the log factor. A slope above
        -0.35 would mean the class is denser than the class-number bound
        allows and OBS-2's cost accounting must be redone.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): freeze the quantifier order and run Step 2's
      enumeration on paper. If a reviewer supplies a constructible k-dependent
      in-class curve, the record is refuted before any compute is spent. This
      stage alone is the cheapest valid discriminator in the lane.
      STAGE 1 (minutes): build the toy family -- ordinary curves at 12, 16, 20
      bits with prime-order subgroup, End computed by Kohel-style volcano
      classification or by direct order determination from t and the
      conductor. Verify the primality and N^2-nondivisibility controls.
      STAGE 2 (minutes, HARD GATE): compute beta([k]P) for 200 k per curve.
      Predicted constant. Then run the composite-order null; predicted
      non-constant. Both gates must fire in the predicted directions.
      STAGE 3 (minutes): the density measurement of Step 4 across the p-ladder,
      with a random-trace null.
      STAGE 4 (zero compute): write the residual open class.
    controls:
      - >-
        composite-order curves N = ell^e -- the calibrated non-null; the
        instrument MUST see a non-constant bridge there
      - >-
        primality and N^2-nondivisibility check per instance, recorded, not
        assumed
      - >-
        random-trace null for the density measurement
      - >-
        rho baseline (harness/rho.py) reproduced at 0.886 sqrt(N) within 20
        percent, so the cost comparison in OBS-2 is anchored
    required_metrics:
      - distinct-value count of beta over sampled k, per curve, prime case
      - the same, composite-order null case, stratified by e
      - measured class density versus p, with fitted slope and CI
      - per-instance pass/fail of primality and N^2 controls
      - rho baseline operation counts on the same instances

  falsification_conditions:
    - >-
      A polynomial-time construction is exhibited that maps (E, P, Q) to a
      curve in the isogeny class of E depending non-constantly on k. OBS-1' is
      false, the forward direction is live, and this record is superseded.
    - >-
      Any toy curve with N prime yields two distinct values of beta. OBS-1 is
      false as implemented; halt and debug -- OBS-1 is elementary, so this is
      an instrument failure until independently replicated.
    - >-
      The composite-order null returns a constant bridge. Instrument blind;
      run set INVALID, not negative (AGENTS.md rule 5 analogue for statistical
      rather than infrastructure failure).
    - >-
      Measured class density decays materially slower than p^{-1/2}. OBS-2's
      p^{1/2} rejection-sampling cost is wrong and must be recomputed; the
      qualitative conclusion may survive but its quantitative form does not.

  confounders:
    - >-
      ENDOMORPHISM RING LEVEL. Curves at different levels of the ell-volcano
      have different orders O and different h(O). Every measurement must be
      stratified by O, or a level effect will be misread as a bridge effect.
    - >-
      TWISTS. E and its quadratic twist have traces t and -t and are NOT in
      the same class. A pipeline that silently accepts twists will report a
      spurious doubling of class size and corrupt the density measurement.
    - >-
      SMALL-p ARTIFACTS. At 12 bits, h(O) can be 1 or 2, so the class is a
      single curve and every curve-level quantity is trivially constant for
      reasons unrelated to OBS-1. The p-ladder must reach h(O) >= 20 before
      any constancy claim is made, and h(O) must be reported per instance.
    - >-
      IMPLEMENTATION OF THE IDEAL. Representing O-ideals as binary quadratic
      forms requires a fixed reduction convention; two reduced forms that are
      equal as classes must not be counted as distinct values of beta. The
      reduction convention is frozen before Stage 2.

  interpretation_limits:
    - >-
      This is NOT an impossibility theorem for arbitrary algorithms. It closes
      one structural route -- bridges factoring through the subgroup lattice --
      and prices one repair. Reductions using the field-element representation
      of x(Q) (resource R1) are explicitly OUTSIDE the argument.
    - >-
      QUANTUM: subexponential quantum vectorization in the Kuperberg/Regev
      line (KN-TECH-027, KN-TECH-051, KN-LIT-071) is real and concerns the
      CLASS GROUP, not the ECDLP. This record grants an even stronger
      resource -- a free exact vectorization oracle -- and the conclusion is
      unchanged, so nothing quantum is claimed, needed, or refuted here. The
      campaign is classical.
    - >-
      Toy scale only for the empirical parts (p up to ~24 bits here). The
      symbolic parts (OBS-1, OBS-1') are scale-free but their empirical
      confirmation is not, and the two must not be conflated.
    - >-
      A confirmed constancy result is a SCOPED NEGATIVE. It bounds what L10
      may be promoted to. It is not evidence about any other lane.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NONE OF THE LOAD-BEARING CLAIMS IS HEURISTIC. OBS-1 (<[k]P> = <P> for
        N prime) is elementary group theory. The kernel-ideal correspondence
        is a theorem (Deuring/Waterhouse/Kohel). The only quantitative input
        is the class number bound h(|D|) = O(sqrt(|D|) log |D|), which follows
        from the analytic class number formula together with the classical
        elementary bound L(1, chi_D) = O(log |D|), and is unconditional.
      rigorous_support: >-
        Analytic class number formula plus L(1, chi) = O(log |D|); no GRH, no
        distribution heuristic. Stated here so no reader imports conditionality
        that this record does not use.
      validation_plan: >-
        Toy-scale consistency check only: compute h(O) exactly for every toy
        discriminant in the ladder and confirm h(O) <= C sqrt(|D|) log|D| with
        the constant C recorded. LABELLED TOY SCALE; this validates the
        implementation, not the theorem.
    - id: H2
      statement: >-
        For a k-dependent curve construction not designed to preserve the
        trace, the resulting curve's trace behaves like that of a uniformly
        random curve over F_p, so membership in the fixed class has
        probability Theta(h(O)/p) = Theta(p^{-1/2} log p) per trial.
      rigorous_support: >-
        Imitates the classical Deuring/Birch equidistribution of traces
        (the Sato-Tate/Deuring counting of curves by trace, whose class-number
        weighted form is the Deuring mass formula). It is a genuine heuristic
        here because the constructed curves are NOT uniformly random -- they
        are images of a specific map -- and that is exactly the gap.
      validation_plan: >-
        At toy scale, instantiate three concrete k-dependent constructions
        (e.g. b |-> b + x(Q), a |-> a * x(Q), and a Montgomery-parameter
        substitution), and measure the empirical fraction landing in the class
        against the predicted h(O)/(2p), over the p-ladder, with a
        chi-squared consistency check on the trace histogram and an explicit
        tail check on the largest observed excess. LABELLED TOY SCALE. A
        construction that hits the class much more often than predicted is the
        single most interesting possible outcome of this proposal and would be
        escalated, not buried.

  reachability_gate: >-
    T5 STATUS: this proposal PASSES the gate trivially and that is the point.
    It never needs to reach a specified curve. Its queries are either (a) E
    itself and its subgroup quotients, all reachable at zero cost, or (b)
    curves reached by walking, whose class-group coordinates are known BY
    CONSTRUCTION because the walker chose them. Reaching a SPECIFIED curve --
    the hard direction, ~sqrt(h) = p^{1/4} -- is never required, because the
    argument's conclusion is that no specified curve is worth reaching: the
    target-relevant curve E/<Q> is k-constant. So the gate is not the binding
    constraint in this lane; OBS-1 is, and it binds strictly earlier and more
    cheaply.

