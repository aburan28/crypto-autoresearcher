idea:
  id: IDEA-20260922-2e2a58
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-22'
  status: proposed
  approved_by: null
  title: >-
    THE CROSSOVER IS A SURFACE IN (TIME, MEMORY, PARALLEL WIDTH), AND BOTH
    PREMISES OF THE SCALAR VERSION ARE WRONG. rho is NOT memory-free: its
    storage floor is Theta(P), the parallel width, because the
    distinguished-point granularity that sets storage also sets the end-of-run
    overhead P/(2D) -- the 2^35.63 distinguished points of ECC2K-130 are a
    granularity CHOICE, not a requirement. And index calculus does NOT
    parallelise freely: its linear-algebra phase has a wall-clock FLOOR of
    (2B'/n0) matrix-vector latencies that no number of processors removes,
    because the Krylov sequence is a sequential chain. Compute the resulting
    feasibility region per standardized row and report WHICH axis actually
    binds. PREREGISTERED: the width axis binds at no row and the memory axis
    binds at every row, by a factor B'/(g P).
  class: measurement

  claim: >-
    (A) THE SCALAR CROSSOVER IS UNDER-DETERMINED. This lane's decision target
    asks, per curve, whether any index-calculus line beats matched rho. That
    question has no scalar answer, because the two algorithms are not
    comparable points -- each is a REGION in the three-dimensional resource
    space (wall-clock time T, peak memory M, parallel width P), and which one
    is preferable depends on where in that space the comparison is taken. The
    corpus currently collapses the comparison onto the time axis alone
    (operation counts) and then reasons about memory and parallelism in prose.
    This record replaces the scalar with the region and states the region in
    closed form for both sides.
    (B) THE rho SIDE, WHERE THE COMMON PREMISE IS FALSE. Under van
    Oorschot-Wiener with distinguished-point probability theta, total iterations
    T_rho, and P concurrent walks: the number of distinguished points that must
    be STORED to detect the collision is D = theta * T_rho, and the end-of-run
    waste is the P walks in flight, each of expected residual length 1/(2 theta),
    i.e. P/(2 theta) iterations. The RELATIVE overhead is therefore
    (P/(2 theta)) / T_rho = P/(2D). Eliminating theta: rho attains relative
    overhead epsilon at storage D = P/(2 epsilon). ITS MEMORY FLOOR IS
    Theta(P) RECORDS, PROPORTIONAL TO THE PARALLEL WIDTH AND INDEPENDENT OF THE
    GROUP ORDER. The published 2^35.63 distinguished points for ECC2K-130
    (KN-LIT-096, against 2^60.9 iterations, i.e. theta = 2^-25.27 -- consistent
    with that record's own "2^25.27 iterations per distinguished point") is a
    granularity choice costing roughly 2^35.63 * 32 bytes = about 1.5 TiB by
    this session's arithmetic; the same attack at theta = 2^-35 would store
    about 2^25.9 points, about 1 GiB, at relative overhead P/2^26.9. "rho is
    memory-free" is false and "rho needs 1.5 TiB" is equally false; rho sits on
    a tradeoff CURVE and the correct comparator is the curve, not a point.
    (C) THE INDEX-CALCULUS SIDE, WHERE THE OTHER COMMON PREMISE IS FALSE.
    Relation collection is embarrassingly parallel exactly as rho is: each
    target is independent, so its wall clock is (R_need/p) C_att / P and falls
    without bound in P. The LINEAR-ALGEBRA phase is not. Block Wiedemann
    (Coppersmith, KN-LIT-017) computes a Krylov sequence of length about
    2 B'/n0 matrix-vector products with blocking parameter n0, and those
    products form a SEQUENTIAL CHAIN: product i + 1 needs product i. Each
    individual product over the B' x B' relation matrix with m nonzeros per row
    can be spread over many nodes, but its latency L_mv does not fall below the
    cost of one distributed reduction. INDEX CALCULUS THEREFORE HAS A WALL-CLOCK
    FLOOR T_IC_floor = (2 B'/n0) * L_mv THAT NO NUMBER OF PROCESSORS REMOVES,
    while rho has none. (B' is the EFFECTIVE matrix dimension -- B/g after
    Frobenius orbit collapse on Koblitz and subfield rows, B otherwise; which of
    those is right is the subject of IDEA-20260922-b19793 in this lane and is an
    INPUT here, swept in both readings.)
    (D) THE FEASIBILITY REGION, STATED. Index calculus is preferable to rho at
    operating point (T, M, P) iff ALL THREE hold:
    (D1) TIME: (R_need/p) C_att / P + max(T_IC_floor, (B'^2 m)/P_LA) < c
    sqrt(N)/(g_rho P f) where g_rho is the rho-side symmetry gain and f the
    per-processor step rate;
    (D2) MEMORY: M >= c_M B' words for index calculus, against M >= P/(2 epsilon)
    records for rho at overhead epsilon;
    (D3) WIDTH: P is available to both, and index calculus additionally cannot
    use P beyond the point where T_IC_floor dominates.
    (E) THE PREREGISTERED VERDICT, WHICH IS THE FALSIFIABLE CORE. For every row
    of the standardized binary population, with n0 = 64, L_mv swept over
    {10^-4, 10^-3, 10^-2} seconds and f from the one published per-platform
    figure available (about 54.03 x 10^6 iterations/second on a GTX 295,
    KN-LIT-096): (E1) the WIDTH axis binds at NO row -- the P at which rho's
    wall clock falls to T_IC_floor exceeds any realisable processor count by
    more than three orders of magnitude at every row, so condition (D3) is never
    the operative constraint; and (E2) the MEMORY axis binds at EVERY row -- the
    ratio of index-calculus memory to rho's memory floor is B'/(g_rho-corrected
    P/(2 epsilon)) and exceeds 2^20 at every row where the index-calculus
    operation count is even within reach. CONSEQUENCE IF (E1) AND (E2) HOLD: the
    lane's habit of invoking "rho parallelises linearly and index calculus does
    not" as the deciding asymmetry is measuring the wrong axis, and the honest
    one-line summary of the standardized binary population is "index calculus
    loses on memory, not on parallelism". A single row where the width axis does
    bind falsifies (E1) and is worth more than the rest of the record.

  mechanism: >-
    OBJECT FRAME. Representation: a PHASE of the pipeline represented by its
    DEPENDENCY CHAIN -- the partially ordered set of charged operations with
    the edges that force sequencing -- rather than by its arithmetic. Tracked
    object: the RESOURCE TRIPLE (critical-path length in latency units, peak
    live words, maximum useful concurrency) extracted from that chain. This is
    the same style of object as IDEA-20260830-4ab603's access footprint,
    applied to a phase rather than to a query.
    OPERATION SET SIGMA, NAMED AND NOT TRANSLATION. Sigma = {REPLICATE across
    independent instances; RE-BLOCK the Krylov sequence by n0; RE-GRANULATE the
    distinguished-point predicate by theta}. These are the three
    schedule-preserving transformations that an implementer actually has. Sigma
    is emphatically NOT the translation action on the group: it acts on
    schedules, not on points, so the closure of IDEA-20260806-c5d183 and
    KN-FIND-ffe1df Theorem C does not apply and is not being evaded -- it simply
    quantifies over a different object.
    TRICHOTOMY. CLASS III, COORDINATE-DEPENDENT. The resource triple is a
    function of the representation of the computation (its schedule), not of the
    group element, exactly as the cost object of IDEA-20260920-204828 is. It is
    placed there deliberately: a record that claimed this triple was a property
    of the group would be claiming far more than it can.
    LOSSY-PROJECTION TEST, AGAINST THIS SIGMA. What is discarded: every
    arithmetic value, the field representation, the monomial order, the solver,
    the curve -- everything except three integers. Lossy in the representation
    actually used: two pipelines with identical triples can differ in every
    arithmetic detail, and the ECC2K-130 rho attack and a toy binary rho attack
    have the same triple SHAPE with different values, so the projection is not
    injective. COMPATIBLE WITH SIGMA, and this is the load-bearing part:
    REPLICATE by k maps (T, M, P) -> (T, kM, kP) with the critical path fixed;
    RE-BLOCK by n0 maps the chain length 2B'/n0' -> 2B'/n0 and the per-product
    width by the inverse, so the PRODUCT of chain length and per-product width
    is invariant; RE-GRANULATE by theta maps storage D -> theta T and overhead
    -> P/(2 theta T). Each of the three transformations acts on the triple by a
    rule that does not consult anything the projection discarded. The triple is
    therefore a genuine block system of <Sigma> on schedules, not a change of
    coordinates -- a change of coordinates would be the full dependency chain
    itself, which discards nothing and says nothing.
    THE ONE OPEN NUMBER, PRICED. For a Class III object the priced quantity is
    the cost of realising the transformation. Here it is L_mv, the latency of one
    distributed sparse matrix-vector product over a matrix with B' m nonzeros --
    the single number that converts a Krylov chain length into wall clock and
    therefore the only thing standing between (C) and a verdict. It is declared
    as a swept parameter over three decades rather than assumed, and every row of
    the output table is reported at all three values, so a verdict that flips
    inside the sweep is labelled latency-dependent and is not read.
    OFF-LIMITS COMPONENTS DECLARED. F1 walk-collision (rho) and F2 factor-base
    decomposition are both used as COMPONENTS -- they are the two sides being
    compared -- and neither is the lens. The lens is the schedule object above.
    F7 preprocessing is explicitly NOT used: no precomputed table is charged on
    either side, and a multi-instance amortised reading is a different row this
    record does not compute.
    WHAT THIS RECORD DOES NOT DO. It does not compute C_att, p, R_need, B or the
    solving degree -- those belong to RQ-SDEG-001, RQ-RELN-001 and
    RQ-ICPERF-94c86e and are consumed as inputs, with every row reported over
    the full plausible range of each rather than at one value. It does not
    re-open the exponent estimator (RQ-ICEX-001 owns that, and
    IDEA-20260805-4d31bc, IDEA-20260805-c8524f and IDEA-20260805-bb4488 own its
    identifiability); this record reports a REGION in resource space, which is
    unit-covariant in none of its coordinates because all three are physical.

