idea:
  id: IDEA-20260813-84d1bc
  added: '2026-08-13'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-SLHDSA-001
  goal_id: GOAL-SLHDSA-001
  title: Dependency-DAG accounting for FIPS 205 reduction bad events
  class: representation
  claim: >-
    A source-faithful dependency DAG for the bad events in a selected FIPS 205
    proof path yields a constants-tracked failure bound no worse than its exact
    reproduced union-bound baseline and strictly smaller whenever two named event
    families are mutually exclusive or share a stopping-time exposure; falsify the
    strict part if exact toy enumeration or symbolic event algebra finds no such
    dependency after all conditioning costs are restored.
  mechanism: >-
    Index hash, chain, FORS, authentication-path, and hypertree events by the
    transcript information available when they become measurable. Replace a flat
    sum with disjoint-event identities or conditional exposure bounds only where
    a proved DAG separation or exclusion applies. Each removed term carries the
    exact probability mass and simulator/query overhead it previously paid.
  why_not_a_renamed_known_approach: >-
    This is not parameter arithmetic or a generic tighter-union-bound suggestion:
    it requires exact baseline reproduction, a typed event DAG, and a witness for
    every dependency used. The seven supplied exact neighbors remain collision
    risks because their full primary context was not independently retrieved.
  predictions:
    - observable: Baseline-versus-DAG bound term table
      metric: Exact symbolic and numeric delta for every FIPS 205 parameter set
      predicted: Zero delta without a proved dependency and positive savings only on named terms
    - observable: Toy event co-occurrence matrix
      metric: Exact joint counts under complete tiny transcript enumeration
      predicted: Claimed exclusions have zero co-occurrence; any counterexample falsifies them
    - observable: Conditioning overhead
      metric: Added simulator calls, query factors, and abort probability
      predicted: Net improvement survives only after all overhead is restored
  minimal_test:
    parameter_slice: One fully enumerable toy instantiation preserving the proof's event structure and each standard parameter set for symbolic substitution only.
    procedure: [Reproduce the baseline line by line, construct the measurable-event DAG without changing the game, enumerate toy joint events, substitute proved identities, and compare exact constants after simulator and abort costs]
    discriminating_outcomes:
      - Zero co-occurrence plus a valid measurability proof supports mutual exclusion.
      - Zero toy co-occurrence without a proof supports only a toy artifact.
      - Apparent savings erased by conditioning cost support accounting displacement rather than tightening.
  controls:
    - Exact null: randomly relabel event indices while preserving marginal probabilities and counts; dependency savings must disappear unless the relabelling preserves the proved DAG.
    - Planted positive: split one baseline event into two explicitly disjoint transcript predicates whose probabilities sum exactly; the method must recover equality with no spurious gain.
    - Independence countercontrol: construct two independent toy events with the same marginals as an excluded pair; the method must not declare them mutually exclusive.
    - Baseline control: mechanically retain all original union-bound terms and reproduce the published numeric value before tightening.
  confounders: [Changing the proof game while redrawing the DAG, conditioning on simulator secrets, double-counting aborts, treating empirical non-co-occurrence as proof, and unverified FIPS parameter substitutions]
  falsification_conditions: [Failure to reproduce baseline constants, any enumerated co-occurrence for a claimed exclusion, a dependency that is not measurable at its stated stopping time, or nonpositive net delta after restored costs]
  interpretation_limits: [A tighter proof bound is not a cryptanalytic attack, toy enumeration does not prove standard-parameter dependencies, only the selected proof path is covered, and stateless fault claims are excluded]
  assumptions: [Authoritative FIPS 205 and primary proof sources are bound, game transitions expose the stated sigma-algebras, and parameter arithmetic is independently reimplemented]
  heuristic_assumptions:
    - id: H1
      statement: The toy event DAG preserves the dependency pattern of the selected proof path.
      validation: Derive the DAG symbolically before enumeration and repeat across increasing toy heights; changing ancestry invalidates transfer.
    - id: H2
      statement: Named event exclusions remain useful at standard query budgets.
      validation: Substitute exact standard parameters and adversary-query symbols only after proof, reporting the sign and magnitude over the entire declared budget range.
  proof_search_map:
    bottleneck: Prove event dependencies without changing games or hiding conditional simulation costs.
    baseline_embedding:
      parameter_slice: Exact selected proof theorem plus one complete tiny event space.
      reproduction_check: Reproduce every baseline bad-event term, coefficient, query factor, and numeric substitution before edits.
    observation_collision:
      audit: Search transcripts where two differently named bad events denote the same underlying collision, and where apparently exclusive labels co-occur.
      failure_response: Merge duplicate events or restore the union-bound term and weaken the claim.
    constructive_transforms: [Event-to-transcript-predicate normalization, stopping-time dependency DAG, disjoint-union or conditional-expectation replacement]
    quantifier_order: For every adversary within the declared query bounds, fix the game and filtration first; then bound probability over game randomness without adversary-dependent event rewrites.
    method_ceiling:
      statement: Dependency accounting cannot improve terms that are genuinely independent or individually tight.
      nearby_counterobject: A synthetic proof game with identical marginal bad-event probabilities but independent events.
    proof_obligations: [Exact baseline lemma, event semantic-equivalence lemma, DAG measurability lemma, dependency or exclusion lemma, constants-tracked final bound and numeric table]
    not_applicable_reason: null
  target_complexity:
    time_exponent: null
    memory_exponent: null
    best_known_baseline: The exact source-verified FIPS 205 reduction theorem selected by the Coordinator; no numeric bound is asserted before retrieval.
    hidden_overhead_disclosure: Simulator queries, conditioning, aborts, multi-target factors, parameter conversion, preprocessing, and bound verification are fully charged.
    time_memory_tradeoff: Full joint-event tables are exponential toy artifacts; symbolic DAG traversal uses polynomial storage but may retain looser local bounds.
  sota_delta: Quantitative target is a nonnegative exact symbolic delta from the reproduced baseline, with strict improvement only on proved dependency terms and a per-parameter bit-equivalent table; currently 0 claimed.
