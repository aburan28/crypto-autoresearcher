idea:
  id: IDEA-20260805-6253cf
  question_id: RQ-CRYPTO-001
  added: '2026-08-05'
  title: >-
    Charging the baseline instead of the candidate: the Wiener AT^2 break-even
    surface for GOAL-CRYPTO-001, and the forced consequence that memory-charging
    raises the minimum admissible index-calculus arity by exactly one
  class: theory

  claim: >-
    GOAL-CRYPTO-001 admits a candidate if it shows "a fully charged wall-clock or
    operation-count advantage over the matched Pollard-rho baseline". That
    sentence contains a disjunction between two cost models that are not
    equivalent, and the goal has never written down what either one implies. This
    proposal derives the implication. Write a candidate pipeline's cost as
    (time N^a, memory N^b) in the group order N. Under an OPERATION-COUNT charge
    the candidate beats rho iff a < 1/2; under a Wiener AT^2 charge -- memory
    times time squared, the charge this program's own KN-TECH-035/044/050/057
    lineage adopts -- rho costs N^{1+o(1)} because its memory is polylogarithmic,
    so the candidate beats it iff 2a + b < 1. The two half-spaces are different,
    and the wedge between them is exactly the region where a proposal is admitted
    under one clause of the goal's own criterion and refused under the other.
    Specialising to the only architecture this goal has ever seriously
    contemplated -- factor base of size N^beta, sparse linear algebra, arity-m
    decomposition -- the balanced optimum is beta = 1/(m+1), a = 2/(m+1),
    b = 1/(m+1), and the two clauses give m >= 4 (operation count) and m >= 5
    (AT^2). THE FORCED VALUE IS THAT NUMBER ONE: charging memory raises the
    minimum admissible arity by exactly one, and arity is the parameter that
    controls the doubly-exponential cost of the summation-polynomial
    decomposition test, so the increment is not a rounding detail but the
    dominant term. The deliverable is a two-inequality admission gate that every
    future CRYPTO candidate can be tested against on paper, replacing six
    categorical yes/no boxes with a numeric constraint, and a recommendation
    that the goal record's disjunction be resolved by the Coordinator into one
    named charge.

  object_first_candidate:
    tracked_object: >-
      The pair of cost exponents (a, b) = (log_N time, log_N memory) of a
      candidate pipeline, followed through the charging convention: from the
      pipeline's stage decomposition, to the pair, to the charged scalar, to the
      admission verdict. The tracked object is a point in the plane and the
      charging convention is a half-plane; admission is membership.
    established_families_off_limits: >-
      Off-limits as the primary lens: every attack family. Nothing here proposes,
      improves or screens an attack. Specifically off-limits are Semaev
      summation-polynomial index calculus AS AN ATTACK, Groebner solving-degree
      instrumentation, BKK/mixed volume, xedni/lifting, Weil descent, isogeny and
      pairing transfers, spectral-gap arguments, and rho refinements. The
      index-calculus architecture appears here only as the STRUCTURE WHOSE
      EXPONENTS ARE BEING CHARGED, in the same way a cost model appears in a
      complexity paper -- and the record states that distinction plainly rather
      than relying on it being noticed.
    newness_score: >-
      The AT^2 model is not new, the (a, b) parameterisation is not new, and the
      index-calculus balance beta = 1/(m+1) is standard. What is absent from this
      corpus, measured rather than asserted: this session's scouting reports that
      of 131 evidence records making a cost claim, 75 charge wall clock only and
      82 never mention memory, that dominated_by is absent from 95 of those 131,
      and that the program's own charging vehicle GOAL-ICEX-001 is active and has
      never executed. GOAL-CRYPTO-001 in particular has no derived admission
      inequality of any kind. The newness is the derivation being written down
      and bound to this goal's criterion, not the model.
    testability_score: >-
      High and cheap for the derivation (pen and paper, checkable by any
      reviewer), lower for the empirical half: the exponents of a real pipeline
      are measured, not assumed, and this program has no crypto-scale pipeline to
      measure. The proposal therefore separates the DERIVED gate from a
      SMALL-SCALE exponent-measurement arm and refuses to conflate them.
    survival_score: >-
      The object survives as long as costs are describable by a single
      (time, memory) pair. It dissolves where a pipeline's memory profile varies
      across stages -- relation collection is memory-light and linear algebra is
      memory-heavy -- so a single b is a summary of a peak, and the peak is
      what AT^2 charges. That is stated as a modelling limit under
      interpretation_limits rather than hidden.

  mechanism: >-
    THE TWO CHARGES, WRITTEN OUT. Let a candidate solve ECDLP in a group of prime
    order N in time T = N^{a + o(1)} using memory M = N^{b + o(1)}, b >= 0.
    Matched Pollard rho, in its distinguished-point parallel form, costs
    T_rho = sqrt(pi N / 4) = N^{1/2 + o(1)} group operations with
    M_rho = N^{o(1)} (a distinguished-point table of polylogarithmic size
    suffices; the memory-heavy variants are optional, not required).
      OPERATION-COUNT CHARGE: candidate wins iff a < 1/2.
      WIENER AT^2 CHARGE: cost = M * T^2. rho costs N^{o(1)} * N^{1} = N^{1+o(1)}.
      Candidate costs N^{2a + b + o(1)}. Candidate wins iff 2a + b < 1.
    The first is a half-plane b-independent; the second is a half-plane with
    slope -2 in the (a, b) plane. THE WEDGE {a < 1/2} \ {2a + b < 1} =
    {a < 1/2 and b > 1 - 2a} is non-empty for every a < 1/2, and every point in
    it is a mechanism that GOAL-CRYPTO-001's criterion admits under its
    "operation-count" clause and refuses under a memory-charged reading. Example
    to make it concrete: (a, b) = (0.45, 0.30) gives operation count 0.45 < 0.5
    (WIN) and AT^2 exponent 1.20 > 1 (LOSS). Nothing in the goal record says
    which answer is the goal's answer.

    SPECIALISING TO THE ARCHITECTURE THE GOAL ACTUALLY CONTEMPLATES. Take a
    factor base of size B = N^beta, relations collected by testing whether a
    random group element decomposes as a sum of m factor-base elements, and a
    sparse linear-algebra stage over the resulting ~B x B matrix with O(m)
    entries per row.
      LINEAR ALGEBRA. Sparse iterative methods (Wiedemann/Lanczos class) cost
      O(B^2) row operations and O(B) storage for the matrix and iterates:
      time exponent 2*beta, memory exponent beta.
      RELATION COLLECTION. Under the standard heuristic that a random point
      decomposes into an ordered m-tuple of factor-base elements with
      probability ~ B^m / (m! N) = N^{m*beta - 1} / m!, collecting ~B relations
      needs ~ m! * N^{beta} * N^{1 - m*beta} = m! * N^{1 - (m-1)beta} decomposition
      TESTS, each costing C_dec. Time exponent 1 - (m-1)beta plus
      log_N C_dec. Memory to hold the relations: exponent beta.
      BALANCE. Setting the two time exponents equal, ignoring C_dec for the
      moment: 1 - (m-1)beta = 2 beta, hence
          beta = 1/(m+1),  a = 2/(m+1),  b = 1/(m+1).
    BASELINE REPRODUCTION (audit 1, and it PASSES). Substituting into the
    operation-count clause: a < 1/2 iff 2/(m+1) < 1/2 iff m >= 4. That is the
    classical statement -- an arity-4 decomposition over a prime field would beat
    rho if the decomposition test were free -- and recovering it exactly is the
    check that the derivation is embedded in the known baseline rather than
    merely resembling it.
    THE NEW LINE. Substituting into the AT^2 clause:
          2a + b = 4/(m+1) + 1/(m+1) = 5/(m+1) < 1  iff  m >= 5.
    So the memory charge moves the admissible-arity threshold from 4 to 5. THE
    FORCED VALUE IS EXACTLY ONE, and it is forced by the coefficient 5 = 4 + 1,
    which is itself forced by the linear-algebra stage contributing 2*beta to
    time and 1*beta to memory. A reviewer can falsify this in one line by
    exhibiting a linear-algebra stage with a different (time, memory) exponent
    pair -- which is precisely the intended attack surface and is listed as a
    proof obligation.

    WHY THE INCREMENT IS NOT A DETAIL. C_dec, the cost of deciding whether a
    point decomposes into m factor-base elements, is the cost of solving the m-th
    summation-polynomial system. Its growth in m is the central open quantity of
    this program's whole F1 lane (KN-OPEN-002 asks for exactly that growth law),
    and every recorded estimate is at least exponential and generally understood
    to be doubly exponential in m. Raising the required m by one therefore
    multiplies the dominant, least-understood term. A cost-model choice that
    looks like bookkeeping relocates the hard problem. That relocation is the
    result, and it is exponent-relevant in the sense
    docs/target-result-profile.md asks for: it changes which exponent a
    successful mechanism must move.

    WHERE C_dec RE-ENTERS. Nothing above charged C_dec. Reinstating it, the
    relation-collection time exponent is 1 - (m-1)beta + log_N C_dec, so a
    subexponential-but-superpolynomial C_dec eats the advantage at every m and
    the balance point shifts. THE PROPOSAL DOES NOT CLAIM TO KNOW C_dec AND DOES
    NOT ASSUME IT IS POLYNOMIAL. What the gate delivers is a NECESSARY
    CONDITION: any candidate must satisfy 2a + b < 1 with its OWN measured or
    derived a, and log_N C_dec is part of that a. A necessary condition that a
    candidate must state its exponents to be tested against is exactly what a
    goal with thirteen batches of untyped candidates has been missing.

    THE THIRD CHARGE THE GOAL ALSO NAMES. "Wall-clock" is neither of the above.
    Under distinguished-point parallelisation rho achieves near-linear speedup in
    the processor count w with per-processor memory still polylogarithmic, giving
    wall clock sqrt(pi N/4)/w. A candidate holding N^b memory must hold it
    SOMEWHERE, so its wall-clock parallelisation is bounded by the memory it can
    distribute and the communication it then pays. Wall clock therefore favours
    rho more than operation count does and less than AT^2 does, and it is the
    only one of the three whose evaluation requires a machine. The proposal
    recommends the Coordinator resolve the disjunction to ONE named charge, and
    supplies the comparison needed to choose; it does not choose.

  novelty_status: unverified

  literature_context:
    - >-
      M. J. Wiener's area-time cost model for cryptanalytic hardware, as carried
      in this corpus by KN-TECH-035, KN-TECH-044 and KN-TECH-050/057. NOT READ IN
      THIS SESSION -- the technique entries were not opened and the primary
      source was not fetched. The AT^2 functional form used above (cost = memory
      x time^2) is RECALLED and is a candidate to check; verifying it against the
      corpus's own technique entries, and against a primary source if reachable,
      is Stage 0 of the associated experiment. If the corpus's form differs, the
      derivation must be redone with the corpus's form and the numeric
      consequence (4 -> 5) recomputed, not retained.
    - >-
      van Oorschot and Wiener, parallel collision search with distinguished
      points, for the claim that rho parallelises with near-linear speedup at
      polylogarithmic per-processor memory. NOT READ -- RECALLED, UNVERIFIED.
      docs/target-result-profile.md's own discussion of the house exemplar
      records the interpolation sqrt(N^3/w) in the isogeny setting, which is the
      same device in a different family; that document WAS read this session in
      summary form.
    - >-
      The index-calculus balance beta = 1/(m+1) and the arity-4 threshold for
      prime-field ECDLP are standard folklore in the Semaev/Gaudry/Diem line.
      NOT READ -- RECALLED. They are used here as the BASELINE REPRODUCTION
      TARGET, i.e. as something the derivation must recover, which is the
      correct use of a recalled result: it is being tested, not cited.
    - >-
      IN-CORPUS, from this session's scouting and to be re-measured by the
      experiment rather than trusted: 131 of 229 evidence records make a cost
      claim, 75 charge wall clock only, 82 never mention memory, dominated_by is
      absent from 95 of the 131, and GOAL-ICEX-001 -- the program's designated
      charging vehicle -- is active with no execution. RELAYED from the scouting
      brief; the counts are re-derivable by grep and the experiment re-derives
      them.
    - >-
      IN-CORPUS: IDEA-20260801-001 (this goal's own prior proposal) argues that
      the blocker is a missing shared ruler and proposes a measured GOE baseline
      on a >= 160-bit curve. THIS PROPOSAL IS THE COMPLEMENT, NOT A DUPLICATE:
      IDEA-20260801-001 wants to MEASURE the baseline's constant on hardware;
      this one derives which INEQUALITY the measurement would have to satisfy,
      and shows the two clauses of the goal's criterion disagree. Neither
      subsumes the other, and IDEA-20260805-52a0d1 (same session) shows the
      measured route exceeds this goal's declared budget by three orders of
      magnitude, which is a reason to have the derived gate as well.

  lossy_projection_identifiability_audit:
    projection: >-
      A complete cost profile of a pipeline -- per-stage time, per-stage peak
      memory, communication, preprocessing, verification -- projected onto the
      single pair (a, b) of leading exponents, and then onto the scalar 2a + b.
    what_is_discarded: >-
      All constants, all polylogarithmic factors, all per-stage structure, all
      communication topology, and the entire o(1). Two pipelines differing by
      2^40 in constant factor have the same image.
    why_genuinely_lossy: >-
      Strictly and massively lossy: the fibre over a given (a, b) is the whole
      family of pipelines with those exponents, which is infinite and includes
      pipelines that are practically incomparable.
    why_compatible_with_the_operations: >-
      Compatible with the operation the goal performs, namely ADMISSION AT
      ASYMPTOTIC SCALE. Exponents compose correctly under sequential
      composition (max) and under the AT^2 charge (2a + b is additive in the
      right way on the log scale), so the retained part propagates
      deterministically through the stage decomposition. It is NOT compatible
      with a concrete-cost question at a fixed curve, and the record says so.
    is_it_only_a_change_of_coordinates: >-
      NO. Passing from (time, memory) to 2a + b genuinely destroys the ability to
      recover either coordinate, and the destruction is the point: it is what
      turns an incomparable Pareto pair into a total order.
    which_failure_was_checked_for: >-
      BOTH, and the second one nearly fires. (1) Change of coordinates: rejected
      -- the map (a,b) -> 2a+b is not injective. (2) THE CONSTANT-PROJECTION
      MIRROR FAILURE: this is the live risk and it is checked explicitly. If
      every candidate architecture this goal will ever see has the SAME (a, b),
      the gate has zero comparator spread and decides nothing. The check
      performed: the specialisation above gives (a, b) = (2/(m+1), 1/(m+1)),
      which varies with m -- values (0.50, 0.25) at m = 3, (0.40, 0.20) at m = 4,
      (0.33, 0.167) at m = 5 -- and gives 2a + b = 5/(m+1) = 1.25, 1.00, 0.833.
      The spread straddles the decision boundary 1 exactly at m = 4, so the gate
      is non-degenerate on the one architecture family in scope. That is a
      measured spread, not an assertion, and it is what entitles the projection
      to be used at all.

  assumptions:
    - >-
      That a pipeline's cost is summarised by leading exponents. False at any
      fixed curve; the gate is an asymptotic admission test and is labelled one.
    - >-
      That sparse linear algebra over the relation matrix has (time, memory)
      exponents (2 beta, beta). This is the load-bearing structural input to the
      "exactly one" result and it is a proof obligation, not an assumption to be
      waved through: a stage with different exponents changes the coefficient 5
      and hence the threshold.
    - >-
      That rho's memory is N^{o(1)}. True for the distinguished-point form;
      false for memory-heavy variants, which a reviewer may substitute -- and if
      the MATCHED baseline is chosen memory-heavy, the AT^2 comparison changes.
      "Matched" is doing real work in the goal's own sentence and the experiment
      must fix its meaning.

  predictions:
    - metric: >-
        The operation-count arity threshold recovered from the derivation
      direction: different
      minimum_effect: >-
        EXACTLY m >= 4. This is the baseline-reproduction target. A derivation
        that does not recover 4 is wrong and nothing downstream of it may be
        reported.
    - metric: >-
        The AT^2 arity threshold
      direction: different
      minimum_effect: >-
        EXACTLY m >= 5, i.e. an increment of EXACTLY 1 over the operation-count
        threshold, arising from the coefficient 5/(m+1). Any other increment
        means the linear-algebra exponent pair used was different from (2beta,
        beta) and the derivation must report which pair it used.
    - metric: >-
        Number of distinct (a, b) values attainable by the in-scope architecture
        family across m in {3,...,8}, and whether the AT^2 boundary 2a + b = 1
        separates them
      direction: different
      minimum_effect: >-
        At least 6 distinct values with at least one strictly on each side of
        the boundary. Forced values: 2a + b = 5/(m+1) = 1.25, 1.00, 0.833,
        0.714, 0.625, 0.556 at m = 3..8. If the boundary does not separate the
        family, the gate is constant on its intended domain and must not be
        used -- this is the zero-spread self-check and it CAN fail.
    - metric: >-
        Fraction of GOAL-CRYPTO-001's own evidence records (EV-CRYPTO-001..013)
        that state a memory exponent, recounted directly from the files
      direction: lower
      minimum_effect: >-
        NO VALUE PREDICTED -- it is a count over files this session summarised
        but did not audit field-by-field, and guessing it would be fabrication.
        It is included because the gate is useless if the goal's own records
        cannot be evaluated against it, and the count says whether they can.
    - metric: >-
        Presence in the goal record of a resolution of the
        "wall-clock or operation-count" disjunction
      direction: different
      minimum_effect: >-
        The pre-derived expectation is ABSENT -- the objective and completion
        criteria as read this session name both and choose neither. If a
        resolution is found elsewhere in the goal's committed decisions, this
        proposal's central complaint is answered and the record says so.

  minimal_test:
    design: >-
      Three stages, zero compute, cheapest first.
      STAGE 0 (reading): verify the AT^2 functional form against KN-TECH-035/044/
      050/057 and, if reachable, a primary source; fix the meaning of "matched"
      rho, including its memory model. TERMINATES the line if the corpus's AT^2
      form differs from the recalled one -- the derivation is then redone before
      anything else.
      STAGE 1 (derivation, pen and paper): the two half-planes, the wedge, the
      specialisation, the baseline reproduction at m >= 4, the new threshold at
      m >= 5, and the sensitivity of the coefficient 5 to the linear-algebra
      exponent pair.
      STAGE 2 (audit, grep): recount the corpus's charging statistics, and
      evaluate every EV-CRYPTO record against the gate, reporting how many
      supply enough exponents to be evaluated at all.
    controls:
      - >-
        BASELINE-REPRODUCTION CONTROL (positive control, must fire). The
        derivation must recover the classical operation-count threshold m >= 4
        exactly. If it does not, the instrument is wrong and no new threshold may
        be reported. This is the nearby object where the answer is already known.
      - >-
        NULL ARCHITECTURE (matched null, can fail). Apply the identical gate to
        MATCHED POLLARD RHO ITSELF, i.e. (a, b) = (1/2, 0). FORCED VALUES,
        derived before the run: operation-count exponent 0.5, AT^2 exponent
        2(0.5) + 0 = 1.000 EXACTLY. Rho must land EXACTLY ON the boundary under
        AT^2 and EXACTLY ON the boundary under operation count, because it IS
        the baseline. If the gate places rho strictly inside or strictly outside
        its own boundary, the gate is miscalibrated and everything computed with
        it is void. This null is not decorative: it is an exact-equality check
        that a sign error or a factor-of-two error cannot survive.
      - >-
        SECOND NULL (a degenerate architecture). A "mechanism" that stores the
        entire group: (a, b) = (0, 1). Operation count 0 < 1/2 (WIN);
        AT^2 exponent 2(0) + 1 = 1, NOT a win. The forced value is that
        exhaustive table lookup is admitted by the operation-count clause and
        refused by AT^2 -- an absurd mechanism that the goal's own criterion
        admits under one reading. If the gate does not produce that
        embarrassment, it is not implementing the criterion as written.
      - >-
        GRADED CONTROL, 6 interior points: 2a + b = 5/(m+1) evaluated at
        m = 3..8, monotonicity in m required and reported, with the boundary
        crossing located at m = 4 -> 5.
      - >-
        SENSITIVITY CONTROL. Recompute the threshold with the linear-algebra
        exponent pair replaced by (3 beta, beta) (dense elimination) and by
        (2 beta, beta/2) (an out-of-core variant). Report how the threshold
        moves. A result that is stable under all three is far stronger than one
        that is not, and a result that is not stable must be reported with its
        dependence explicit.
    required_metrics:
      - the two half-plane inequalities as derived, with the AT^2 form's source
      - the recovered baseline threshold and the new threshold, with the coefficient shown
      - rho's own gate value under both charges (exact-equality check)
      - the 6-point graded table and its crossing
      - the sensitivity table over three linear-algebra exponent pairs
      - the count of EV-CRYPTO records evaluable against the gate

  falsification_conditions:
    - >-
      The derivation does not recover m >= 4 under the operation-count charge.
      The specialisation is wrong; nothing downstream is reportable.
    - >-
      Matched rho does not land exactly on its own boundary under both charges.
      The gate is miscalibrated.
    - >-
      The corpus's AT^2 form is not cost = memory x time^2. The coefficient 5,
      and therefore the increment of exactly one, do not follow, and the whole
      quantitative claim is withdrawn pending re-derivation.
    - >-
      The graded table is constant or non-monotone in m. The gate has no
      comparator spread on its intended domain and must not be used as an
      admission test.
    - >-
      A reviewer exhibits a linear-algebra stage with exponent pair making the
      coefficient equal 4, so that the AT^2 threshold coincides with the
      operation-count threshold. The "increment of exactly one" result is then
      architecture-dependent and must be restated with its dependence.

  confounders:
    - >-
      MODEL SHOPPING. Three charges are on the table and it is easy to quote
      whichever produces the more striking sentence. The contract requires all
      three be reported for every architecture evaluated, in a fixed order.
    - >-
      THE o(1). Every exponent statement here suppresses subexponential and
      polylogarithmic factors, and at any realisable curve size those factors can
      exceed the gap between the half-planes. The gate is an ASYMPTOTIC
      admission test and must never be quoted at a fixed curve.
    - >-
      C_dec IS NOT CHARGED IN THE BALANCE. The clean beta = 1/(m+1) balance
      assumes the decomposition test is exponent-free. It is not, and this record
      says so twice rather than once, because it is the most likely place a
      reader will over-read the result.
    - >-
      "MATCHED" IS UNDERDEFINED. The gate's verdict depends on which rho variant
      is the baseline. Fixing that meaning is a Coordinator decision, not a
      derivation.
    - >-
      A DERIVED GATE IS NOT A MEASUREMENT. Nothing here observes any pipeline. A
      candidate's real (a, b) must be measured or derived from its own
      construction; the gate only says what it must satisfy.

  interpretation_limits:
    - >-
      NO ATTACK, NO SOLVE, NO EXPONENT IMPROVEMENT IS CLAIMED. Pollard rho
      remains the ECDLP baseline and sota_delta on every attack axis is zero.
      What moves is the ADMISSION THRESHOLD a future mechanism must clear, which
      is a statement about this program's own criterion.
    - >-
      The result "memory-charging raises the arity threshold by one" is scoped to
      the balanced factor-base architecture with sparse linear algebra of
      exponent pair (2 beta, beta), under the AT^2 form as recalled. Outside that
      architecture it is not claimed and the sensitivity control measures how far
      it travels.
    - >-
      This proposes NO change to GOAL-CRYPTO-001's objective, completion
      criteria, next_action or status. It supplies a derivation the Coordinator
      may use; the disjunction is the Coordinator's to resolve (AGENTS.md
      rule 1).
    - >-
      Claim tier: theory/derivation. No run, no curve, no certificate. It cannot
      support any statement about the security of any deployed curve.

  heuristic_assumptions:
    - id: H1
      statement: >-
        DECOMPOSITION HEURISTIC. For a factor base of size B in a group of order
        N and arity m, a uniformly random group element admits an ordered
        decomposition into m factor-base elements with probability
        (1 + o(1)) B^m / (m! N), uniformly over the choice of factor base within
        the declared family, for B = N^{beta} with beta < 1/m.
      random_model_justification: >-
        The count of ordered m-tuples is B^m; if the sum map were a uniformly
        random function to the group, each tuple hits a fixed target with
        probability 1/N and the m! is the unordered/ordered correction. This is a
        balls-in-bins calculation under a uniform model, and it is exactly the
        assumption this program's own KN-FIND-007 sharpens (mean yield
        C(B+m-1,m)/N independent of how the factor base is chosen at fixed B) --
        so the corpus contains an internal result pointing the same way, which is
        stated here as corroboration and not as proof.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        A measured yield differing from B^m/(m! N) by a factor growing with N at
        fixed beta. NOTE THE ASYMMETRY, AND IT MATTERS: the gate is a NECESSARY
        condition derived from a balance point, so a yield WORSE than heuristic
        only tightens it. A yield BETTER than heuristic by a growing factor would
        loosen it and is the observation that would matter.
    - id: H2
      statement: >-
        Sparse linear algebra over the B x B relation matrix with O(m) entries
        per row costs N^{2 beta + o(1)} operations and N^{beta + o(1)} memory.
      random_model_justification: >-
        Standard for Wiedemann/Lanczos-class methods: O(B) matrix-vector products
        at O(mB) each, storage O(mB). RECALLED, NOT READ. This is the input that
        produces the coefficient 5 and therefore the increment of exactly one, so
        it is the most load-bearing heuristic in the record.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        An algorithm with a strictly better (time, memory) exponent pair for this
        matrix family. The sensitivity control anticipates this by recomputing
        the threshold under two alternatives.
    - id: H3
      statement: >-
        Matched Pollard rho costs N^{1/2 + o(1)} time at N^{o(1)} memory.
      random_model_justification: >-
        The birthday bound with distinguished points; the memory claim is a
        property of the DP variant, not of rho in general.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        A matched baseline definition that requires N^{c} memory for c > 0, which
        would move rho off its own boundary and change every comparison. This is
        a definitional risk, not an empirical one, and it is why fixing "matched"
        is Stage 0.

  target_complexity:
    time_exponent: >-
      No time exponent is improved and none is claimed. What this proposal
      produces is the CONSTRAINT SURFACE on the exponents of a future candidate:
      2a + b < 1 under AT^2 versus a < 1/2 under operation count, and the
      derived arity thresholds m >= 5 and m >= 4 for the balanced factor-base
      architecture. Stating the exponent that would have to move -- and by how
      much, in which model -- is the exponent-first content the target-result
      profile asks for, delivered as a gate rather than as an algorithm.
    memory_exponent: >-
      The whole point: b enters the AT^2 clause with coefficient 1 and is absent
      from the operation-count clause. At the balanced optimum b = 1/(m+1),
      i.e. 0.25 at m = 3, 0.20 at m = 4, 0.167 at m = 5.
    best_known: >-
      Pollard rho: (a, b) = (1/2, 0), operation-count exponent 0.5, AT^2 exponent
      exactly 1. No known prime-field ECDLP algorithm improves on either.
    hidden_overhead: >-
      C_dec, the summation-polynomial decomposition cost, whose growth in m is
      KN-OPEN-002 and is not known to this program. It sits inside a, is not
      charged in the clean balance, and is flagged twice above. Also: the o(1) in
      every exponent, and all communication cost, which AT^2 charges only
      implicitly through area.
    tradeoff_note: >-
      The proposal IS a time-memory tradeoff statement. Its content is that the
      goal's own admission criterion contains two clauses that disagree about
      the tradeoff, and that on the one architecture family in scope the
      disagreement is worth exactly one unit of arity.

  dominated_by: >-
    NOT NULL. On the TIME axis, Pollard rho at N^{1/2} dominates this proposal
    trivially, because this proposal contains no algorithm -- there is no
    candidate here to be dominated, and saying "null" would be the fabrication
    the contract warns about. On the MEMORY axis, likewise. On the
    DATA/QUERY axis, no queries are used. On the QUESTION addressed -- what
    inequality should GOAL-CRYPTO-001 admit against -- the rows checked are:
    IDEA-20260801-001 (proposes a MEASURED ruler, does not derive an
    inequality); the goal record itself (names two charges, resolves neither);
    all thirteen EV-CRYPTO records (screening dispositions, no cost model);
    KN-TECH-035/044/050/057 by name only, NOT READ; and GOAL-ICEX-001, the
    program's charging vehicle, which is active and unexecuted so it holds no
    result to be dominated by. No row was found that derives an admission
    inequality for this goal.
  sota_delta: >-
    Quantitative, in the units the deliverable is in. Before: GOAL-CRYPTO-001
    admits candidates against a two-clause English disjunction with zero derived
    thresholds. After: two explicit half-planes (a < 1/2; 2a + b < 1), an exact
    boundary check (rho at 2a + b = 1.000), a 6-point graded table
    (5/(m+1) = 1.25, 1.00, 0.833, 0.714, 0.625, 0.556 at m = 3..8), a recovered
    baseline threshold m >= 4 and a new threshold m >= 5 -- an increment of
    exactly 1 in the parameter that controls the doubly-exponential term. No
    attack; the delta on every attack axis is zero and is stated as zero.

  estimated_cost:
    implementation: low
    compute: none
  recommended_priority: high
  honest_prior_of_survival: >-
    0.85 that the derivation stands as written. Not higher, because the AT^2
    functional form is recalled rather than read, and because the linear-algebra
    exponent pair (2 beta, beta) -- while standard -- is the single input that
    produces the coefficient 5, so one substitution changes the headline number.
    Not lower, because the baseline-reproduction check (m >= 4) and the
    exact-boundary check on rho (2a + b = 1.000) are both sharp, both derived
    before any reading, and both would catch an algebra error immediately; and
    because the qualitative conclusion -- that the two clauses of the goal's
    criterion define different admissible regions -- follows from the shapes of
    the half-planes alone and survives any reasonable substitution. 0.30 that
    the Coordinator resolves the disjunction on the strength of this record
    alone, which is a judgement about process rather than mathematics and is
    outside this proposal's control.
