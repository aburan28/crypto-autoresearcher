idea:
  id: IDEA-20260816-6f4272
  question_id: RQ-WFS-e776b6
  added: '2026-08-16'
  title: Take one fixed reference argument at fixed parameters and decompose its quoted bit level
    into every named term that enters it, compute each term exactly, then report the signed bit residual
    between the composed total and the headline number and the sensitivity of that total to the order
    in which the terms are combined
  class: theory
  claim: '(A) A quoted security level for a non-interactive argument is the endpoint of a pipeline:
    a per-round soundness error, a repetition or query term, a challenge-derivation term, a commitment
    or collision term, an adversary query-budget factor, and sometimes a grinding allowance. Each
    is defined somewhere; the composed total is usually a single number, and the arithmetic that produced
    it is rarely written out. (B) For one fixed reference argument at one fixed parameter set, every
    term is computable exactly by the methods already assembled in this bucket: an enumerated per-round
    error, an exact hypergeometric or binomial query term, an exact challenge-sampling deviation,
    and a stated collision term. The deliverable is the ledger: each term in bits with its exact value
    and its provenance, their composed total, and the signed residual against the headline number
    the parameter set is chosen to deliver. (C) The second deliverable is the ORDER SENSITIVITY. Composition
    is not commutative in effect: applying a union bound over rounds before or after multiplying by
    a query budget, or charging a collision term inside or outside a repetition exponent, yields different
    totals from the same inputs. The record enumerates the composition orders that are defensible,
    computes the total under each, and reports the spread in bits as a number. A large spread means
    the headline number is under-determined by its own inputs, which is a statement about the accounting
    and not about any system. (D) NOT CLAIMED: no attack, no claim that any parameter set is inadequate
    or that any quoted level is wrong, no claim about any deployed, third-party or standardized proof
    system, none of which is examined; no claim that the enumerated composition orders are exhaustive,
    only that they are named; and no security consequence, since the reference argument is written
    here and its headline number is chosen here.'
  mechanism: 'STAGE A: fix the reference argument and its parameter set completely, including field,
    challenge space, round count, repetition count, query count, commitment primitive output length,
    and the headline bit level the parameters are nominally chosen to deliver. STAGE B: enumerate
    the terms. For each, write its definition, its exact value at these parameters, and its provenance,
    meaning which computation in this program produces it. Terms with no exact computation available
    are recorded as MISSING with the reason, and a missing term is never silently replaced by an estimate.
    STAGE C: compute the composed total under the primary composition order, in exact rational arithmetic,
    and report it in bits. STAGE D: enumerate the alternative composition orders, at least four and
    named in advance, and compute the total under each. STAGE E: report the signed residual against
    the headline number and the spread across orders. STAGE F: sensitivity sweep. Vary each input
    term by one bit in each direction and record the change in the total, producing a per-term sensitivity
    coefficient, so the terms that actually drive the number are identified rather than assumed. STAGE
    G: run the null control, an argument whose every term is exactly known by construction, and require
    the residual to be exactly zero and the order spread to be exactly zero, which is what shows that
    any nonzero spread in the signal arm comes from the terms and not from the pipeline.'
  novelty_status: unverified
  novelty_screen:
    method: Grepped ledger/proposals/ and ledger/hypotheses/ for soundness error, union bound, challenge
      space and state restoration. Read the titles of all thirteen RQ-WFS-e776b6 proposals from a
      PyYAML scan of ledger/proposals/. Read ledger/questions/RQ-WFS-e776b6.yaml, whose fourth target
      is a conjecture surface table over a reference pipeline's parameter sets. Read the title and
      class of IDEA-20260816-722a94, the closest instrument-oriented record on this question.
    results: IDEA-20260816-722a94 calibrates a soundness-accounting instrument on protocols whose
      exact soundness is known in advance, one with soundness identically one and one identically
      zero; that is a correctness check on a measurement tool. IDEA-20260809-7caba9 measures a per-round
      gap against a quoted bit level, which is one term of the pipeline rather than the pipeline.
      IDEA-20260809-7c0817 proposes a static criterion for transcript completeness and scores it,
      which is a decidability question. The question record's fourth target names a conjecture-surface
      table but not a term-by-term arithmetic decomposition, and no proposal on this question computes
      a composed total or an order-sensitivity spread.
    verdict: 'UNVERIFIED. Nothing is asserted about external literature; every individual term and
      every composition rule used here is standard and treated as known. What is claimed new is only
      internal: this repository has no record that writes out the full arithmetic from named terms
      to a headline bit level for one fixed argument, and none that reports the spread across defensible
      composition orders as a number. The parts assembled, exact per-term computations and standard
      composition rules, are entirely known and several are produced by sibling records in this same
      set.'
  object_first_candidate:
    tracked_object: 'The term ledger: the finite list of named soundness terms, each carrying an exact
      value in bits, a provenance pointer to the computation that produced it, and a status of exact
      or missing. Every reported quantity is a functional of this ledger, specifically its composition
      under a named order.'
    lossiness: 'Genuinely lossy. The underlying state is the full protocol together with every adversary
      strategy against it, an object with no finite description at the parameters of interest; the
      ledger keeps a handful of numbers and discards the protocol entirely, retaining only what each
      term contributes. The discard is compatible with the target operation because the headline number
      is by construction a function of these terms alone, so any protocol feature that does not change
      a term cannot change the total. The retained ledger propagates deterministically under composition
      rules, which is exactly the operation being audited. The one place the projection is dishonest,
      and this is stated rather than hidden, is when a term is MISSING: then the ledger has discarded
      something it cannot account for, and the total is not defined.'
    propagation: 'One step of the target operation is applying one composition rule, for example multiplying
      by a query budget, raising to a repetition exponent, or taking a union over rounds. On the ledger
      this acts as an arithmetic operation on bit values: multiplication becomes addition in bits,
      exponentiation becomes scaling, and a union becomes a log-sum. Because these operations do not
      commute in effect, the order in which they are applied determines the total, and the record
      measures that non-commutativity directly by evaluating all named orders on the same ledger.'
    survival_score: The ledger survives as long as every term has an exact computation, which at the
      chosen toy reference parameters holds for the per-round error, the query term and the challenge-sampling
      term, and does not hold for the commitment collision term, which is stated rather than computed
      and is therefore marked as a stated input rather than an exact one. It dissolves the moment
      a term is genuinely missing, at which point the record reports the partial ledger and the missing
      term rather than a total; that is the honest failure mode and it is treated as a first-class
      outcome rather than an error.
  null_object_control: 'NULL OBJECT: a reference argument constructed so that its exact non-interactive
    soundness is known in closed form by design, for example a single-round protocol with a single
    challenge and a single attainable challenge, for which every term is exact and the composition
    has only one defensible order. This runs through the identical ledger pipeline and the identical
    composition machinery in the same invocation. For the signal arm to mean anything the null must
    return a residual of exactly zero and an order spread of exactly zero. If the null returns a nonzero
    spread, the spread is being generated by the pipeline itself rather than by the terms, and no
    signal-arm spread may be reported. A second null perturbs one ledger entry by a known number of
    bits and requires the composed total to move by exactly the amount the sensitivity coefficient
    predicts, confirming the sensitivity sweep is measuring the arithmetic and not noise.'
  discriminated_from:
  - IDEA-20260816-722a94 calibrates an instrument against protocols of known soundness. That checks
    whether a measurement tool is correct; this record takes measurements as given and audits the
    arithmetic that turns them into a headline number.
  - IDEA-20260809-7caba9 measures the per-round gap against a quoted bit level. That produces one
    term of this ledger; this record consumes such terms and measures their composition, and would
    cite that record's output rather than duplicate it.
  - IDEA-20260809-7c0817 asks whether transcript completeness admits a decidable static criterion.
    That is a property of an implementation's transcript construction; this record assumes the transcript
    is complete and audits the numeric pipeline downstream of it.
  - The query-budget record in this set, which measures how the loss scales with adversary queries.
    That is one input term here, measured; this record does not re-measure it and instead varies it
    in the sensitivity sweep.
  - An audit of this program's own cost model or machine timing variance, which is blacklisted and
    owned by RQ-INSTR-f8faa0. Nothing here measures machine cost; every quantity is an exact arithmetic
    term in bits and no timing enters the ledger.
  assumptions:
  - The reference argument and its headline bit level are defined here, so the residual is a statement
    about the arithmetic of a construction written for this contract and about nothing else.
  - Each term either has an exact computation available or is marked as a stated input or as missing;
    no term is estimated silently, and a missing term blocks the total rather than being filled.
  - The enumerated composition orders are the defensible ones at these parameters; the enumeration
    is named and is not claimed exhaustive.
  - Exact rational arithmetic throughout with bits reported to forty significant digits, since several
    terms differ far below floating-point resolution.
  - The sensitivity coefficients are local, computed by one-bit perturbations, and are not claimed
    to describe large moves in any term.
  predictions:
  - metric: signed residual between composed total and headline number, primary order
    direction: different
    minimum_effect: 'explicit refusal to pre-commit: the headline number for the reference argument
      is chosen by the same contract, so pre-committing a residual would be pre-committing an arithmetic
      error; the pre-registration is that the residual must be reported with each term''s contribution
      attributable'
  - metric: spread in composed total across named composition orders
    direction: higher
    minimum_effect: 0.5
  - metric: null-arm order spread
    direction: different
    minimum_effect: 'forced value: exactly zero; a nonzero null spread voids the signal-arm spread'
  - metric: sensitivity coefficient of the total to a one-bit change in the dominant term
    direction: different
    minimum_effect: 'forced value: exactly one bit for a term that enters linearly, and exactly the
      repetition count for a term inside a repetition exponent; deviation indicates the composition
      was mis-implemented'
  minimal_test:
    design: 'One script plus one written specification, hours not days. Define the reference argument:
      three rounds, challenge space of size 256, sixteen parallel repetitions, thirty-two queries
      per repetition against a domain of size 4096 with corruption rate one percent, a commitment
      with a 128-bit stated collision term, and a headline level of 80 bits. Compute each term exactly:
      the per-round error from enumeration, the query term from the exact hypergeometric form, the
      challenge-sampling term from the exact reduction-bias computation, and the collision term as
      a stated input clearly marked. Compose under four named orders: union-over-rounds first then
      repetition, repetition first then union, collision inside the repetition exponent, and collision
      outside it. Report the four totals, the residual against 80 bits under each, and the spread.
      Run the one-round null argument and the perturbation null in the same invocation. Then sweep
      each term by plus and minus one bit and record the coefficient. The discriminating output is
      two numbers: the residual under the primary order and the spread across orders. If the spread
      is below a tenth of a bit, the accounting is order-insensitive at these parameters and that
      is the reportable measured result.'
    controls:
    - One-round null argument with a single defensible composition order, requiring zero residual
      and zero spread.
    - 'Perturbation null: move one ledger entry by a known number of bits and require the total to
      move by exactly the predicted amount.'
    - 'Missing-term control: deliberately mark one term missing and confirm the pipeline refuses to
      emit a total rather than substituting a default.'
    - Degenerate control with all terms equal to zero bits, where every order must give the same total.
    - Independent recomputation of the composed total by a second implementation written from the
      written specification alone, with a required exact match.
    - Exact-versus-floating-point comparison reported only to show which terms floating point would
      erase.
    required_metrics:
    - each named term's exact value in bits with provenance and status
    - composed total under each named composition order
    - signed residual against the headline number per order
    - spread in bits across orders
    - per-term sensitivity coefficient from one-bit perturbations
    - count of terms marked missing or stated rather than exact
    - null-arm residual and spread
  falsification_conditions:
  - The null argument returns a nonzero residual or a nonzero order spread.
  - The perturbation null does not move the total by the predicted amount.
  - The missing-term control produces a total rather than refusing.
  - The independent second implementation disagrees with the first on any composed total.
  - The spread across all named orders is exactly zero at every parameter point, which falsifies the
    conjecture that composition order is a free parameter at these parameters and closes the record
    with the obstruction that the pipeline is order-determined here.
  - More than half the ledger's terms must be marked stated or missing, in which case the record reports
    the ledger and explicitly does not report a total, since a composed number from mostly non-exact
    inputs would be a fabrication.
  confounders:
  - A term marked stated rather than exact carries the weight of an assumption while looking like
    a measurement in the ledger; the status column must be reported everywhere the value is.
  - The headline number is chosen by this contract, so a residual near zero is partly a property of
    that choice and not a discovery, which must be said in every presentation of the residual.
  - The named composition orders are chosen by judgement, and adding one more order can only widen
    the spread, so the spread is a lower bound over the named set.
  - Sensitivity coefficients are local; a term that looks insignificant at one bit may dominate at
    ten, and the record does not measure that.
  - Floating-point evaluation would collapse several terms to zero and make the spread look smaller
    than it is.
  interpretation_limits:
  - Everything is scoped to the reference argument and parameter set defined in this contract; no
    quoted level of any real system is examined or characterised.
  - A nonzero order spread is a statement about the under-determination of a composition procedure,
    not about the security of anything.
  - Terms marked stated are assumptions carried into the total and are not measurements, and the total
    inherits their status.
  - No statement about any deployed, third-party or standardized proof system follows from any outcome.
  target_complexity:
    time_exponent: No attack exponent is claimed. The entire computation is a few hundred exact rational
      operations plus whatever the cited term computations cost, which are separate contracts.
    memory_exponent: No attack memory exponent is claimed. Memory is O(number of terms), effectively
      constant.
    best_known: The incumbent is the ordinary practice of quoting a single composed security level
      for a parameter set with the intermediate arithmetic left implicit. This record does not beat
      that practice; it writes the arithmetic out for one reference argument and measures how much
      the total depends on choices inside it.
    hidden_overhead: 'Nearly all cost is human and it is exactly the cost the record is about: writing
      down every term with an honest status, resisting the pressure to fill a missing term with a
      plausible number, and enumerating composition orders that are genuinely defensible rather than
      convenient. In lower-order terms hides the fact that the headline number is chosen here, which
      makes the residual partly self-referential unless it is stated every time.'
  dominated_by: n/a (no result claimed). No solve, forgery or cost improvement is proposed, so no
    time, memory or query frontier row exists to compare against; asserting null would be a fabrication.
  sota_delta: no attack; conceptual/measurement contribution only. The deliverable is a term ledger,
    a residual and an order-sensitivity spread for a reference argument, with no cost comparison to
    any algorithm.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Part A, that a complete term ledger with honest statuses can be written
    for the reference argument: about 0.8, with the collision term almost certainly landing as stated
    rather than exact, which is itself informative. Part B, that the spread across named composition
    orders exceeds half a bit: about 0.6, since charging a collision term inside versus outside a
    repetition exponent moves numbers materially at sixteen repetitions. Part C, that the residual
    against the headline number is interpretable rather than a tautology given that the headline is
    chosen here: about 0.35, and this is the weakest part; the fix is to present the residual only
    alongside its self-referential caveat. Part D, that the ledger format is adopted by other records
    on this question as the standard way to present a composed number: about 0.55.'
