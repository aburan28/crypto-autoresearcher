idea:
  id: IDEA-20260807-a6a038
  question_id: RQ-SSI-001
  title: >-
    Planted-orientation instances: a positive control constructed by Deuring
    reduction of small-discriminant Hilbert class polynomials, run over a
    discriminant ladder to measure each candidate filter's sensitivity
    horizon
  class: control
  added: '2026-08-07'

  claim: >-
    Every ball-computable filter that measures a per-vertex arithmetic
    statistic on supersingular curves (as S1-1, S1-2 and S1-7 do) has never
    been exercised against a positive control -- an instance with a KNOWN
    planted small endomorphism -- so a filter that never fires cannot today
    be distinguished from a filter that is simply broken. This proposal
    builds that positive control: for small class-number discriminants D,
    reduce the Hilbert class polynomial H_D mod an inert prime p; its roots
    are supersingular j-invariants carrying a guaranteed optimal embedding
    of O_D by Deuring reduction. Extending this over a ladder of D and
    measuring each candidate filter's firing rate on planted versus matched
    random instances yields a confusion table and a per-filter "sensitivity
    horizon" |D|_max -- the largest |D| at which the filter still fires at
    rate >= 0.9. The entry predicts |D|_max ~ (ball size)^2, i.e. horizon and
    S1-2's cost exponent c are two views of one number, and that c = 1/2 is
    equivalent to horizon = (test cost)^2.

  mechanism: >-
    build_isogeny_graph.py already constructs a seed vertex this way and
    already verifies supersingularity independently by point counting rather
    than trusting the CM construction; S1-8 runs this existing, validated
    constructor over a ladder of D instead of one D. D ranges over
    {-3,-4,-7,-8,-11,-19,-43,-67,-163} (class number 1, degree-1 H_D,
    trivially computable) extended by small-class-number D up to
    |D| ~ p^{2/3}, where planting becomes vacuous because every curve
    qualifies -- the ladder is honestly SPARSE at the top because class
    polynomials of degree ~ h(D) ~ p^{1/3} are infeasible even at toy scale
    beyond small h, and the write-up must say so. For each candidate filter
    from S1-2's list, measure firing rate on planted instances and on
    matched random instances and report the confusion table: (planted,
    fires), (planted, misses), (random, fires), (random, misses).

  novelty_status: unverified

  literature_context:
    - >-
      IN-CORPUS. CALIBRATION.md retracts an INERT verdict because a blind
      control did not run; SCREENING.md section 2 makes "instrument fidelity
      before measurement" a screen criterion; DEC-20260805-cc2b32 rejects a
      contract for lacking a reachable negative. S1-8 is designed to close
      exactly that recurring defect class for this slice.
    - >-
      IN-CORPUS. build_isogeny_graph.py already implements Deuring reduction
      for one seed vertex and already independently verifies supersingularity
      by point counting; this proposal reuses that constructor rather than
      writing a new one.
    - >-
      IN-CORPUS, SIBLING ENTRY. S1-2's predicted cost exponent c and this
      entry's predicted horizon law |D|_max ~ (ball size)^2 are cross-checked
      against each other as two independent measurements of one identity;
      agreement within 10% corroborates both, disagreement localises which is
      wrong.

  assumptions:
    - >-
      That reduction mod an inert prime p of H_D for small class number h(D)
      produces j-invariants with a guaranteed optimal O_D-embedding (Deuring
      reduction), as already relied on by build_isogeny_graph.py's seed
      vertex.
    - >-
      That independent point-counting supersingularity verification (rather
      than trust in the CM construction) is available and cheap at the toy
      primes used.
    - >-
      That "ball-computable filter" is a well-defined, enumerable category
      matching S1-2's candidate list, so the horizon is measured on the same
      objects S1-2 costs.

  predictions:
    - metric: >-
        per-filter sensitivity horizon |D|_max: the largest |D| at which the
        filter fires on planted instances at rate >= 0.9
      direction: different
      minimum_effect: >-
        |D|_max ~ ell^{2r} for a filter exploring ball radius r, i.e.
        |D|_max = C_test^2, agreeing with S1-2's c = 1/2 identity to within
        10% if both are correct.
    - metric: >-
        gate (a): D=-4 at p = 3 mod 4 yields j=1728; D=-3 at p = 2 mod 3
        yields j=0
      direction: different
      minimum_effect: >-
        Exact match against the constant known j-invariant; any mismatch
        halts the entry immediately (gate failure).
    - metric: >-
        gate (c): at |D| >= p^{2/3} * C, planted and random firing rates
        must coincide (statistical invisibility)
      direction: different
      minimum_effect: >-
        Convergence of the two firing rates within sampling error; failure
        to converge flags a false-positive-scored filter.

  minimal_test:
    design: >-
      Stage 0 (gate a): compute D=-4 and D=-3 planted j-invariants at
      matching primes and check against the known constants 1728 and 0.
      Stage 1: build the discriminant ladder and, for each D, reduce H_D mod
      p, verify supersingularity of every root independently by point
      counting (gate b). Stage 2: run every candidate filter from S1-2's
      list against the planted set and a matched random set, recording the
      four-cell confusion table per (D, filter). Stage 3: fit the horizon
      |D|_max per filter and cross-check against S1-2's c.
    controls:
      - >-
        Known-answer gate (a): forced D=-4/D=-3 j-invariant values, checkable
        against a constant, run first.
      - >-
        Independent supersingularity verification (gate b) by point
        counting, never by trusting the CM construction that produced the
        candidate curve.
      - >-
        Statistical-invisibility gate (c) at |D| >= p^{2/3}*C: a filter that
        "fires on everything" at large |D| and would otherwise be scored
        sensitive is caught here.
    required_metrics:
      - confusion table (planted-fires, planted-misses, random-fires, random-misses) per (D, filter)
      - fitted horizon |D|_max per filter
      - cross-check residual against S1-2's c identity

  falsification_conditions:
    - >-
      Some filter fires at rate >= 0.9 on planted instances with
      |D| >> C_test^2: the horizon law is wrong and S1-2's c >= 1/2 bound is
      in question.
    - >-
      Every filter, including exhaustive BFS at the exact planted radius,
      misses planted instances: the constructor itself is broken (most
      likely a splitting-field or inertness error), and nothing else in the
      slice can be trusted until fixed.
    - Gate (a) fails: stop immediately, no further stage runs.

  confounders:
    - >-
      Class-polynomial degree ~ h(D) ~ p^{1/3} makes the ladder infeasible to
      extend to |D| ~ p^{2/3} beyond small class number even at toy scale;
      the ladder is sparse at the top by construction and any horizon fit
      must not be quoted over a range it never covered.
    - >-
      A filter's ball-buffer cost model (charged as in S1-2, O(M^{1/2})) may
      itself be mis-specified, in which case the horizon measured here
      reflects the buffer bug rather than the filter's true reach.

  interpretation_limits:
    - >-
      Ceiling: control. This entry is instrumentation whose product is a
      confusion table and a horizon per filter. It certifies nothing about
      the hardness of any supersingular-isogeny problem; it certifies only
      that the measurements in S1-1, S1-2 and S1-7 are made by instruments
      that can fail and are shown here to be able to fail.
    - >-
      Out of scope: the broken SIDH/SIKE torsion-image setting is not
      touched by this entry in any positive sense; the constructor plants an
      endomorphism-ring structure, not a torsion-point image, and GOAL-SSI-001's
      exclusion of SIDH/SIKE as a positive target is respected.
    - >-
      No claim about attack cost, exponent, or crypto-scale hardness follows
      from any outcome here.

  heuristic_assumptions:
    - id: H1
      statement: >-
        Deuring reduction of H_D mod an inert prime p yields j-invariants
        with a guaranteed optimal embedding of O_D, and independent point
        counting confirms supersingularity without relying on the
        construction that produced the candidate.
      rigorous_support: >-
        Standard Deuring correspondence for CM reduction of Hilbert class
        polynomials; already operationally relied on by
        build_isogeny_graph.py's existing seed-vertex construction.
      validation_plan: >-
        Gate (a) and gate (b) in the minimal test, run before any filter is
        scored.

  estimated_cost:
    implementation: low
    compute: >-
      Negligible for small class number; class-polynomial computation
      becomes the dominant, infeasible-at-scale cost as the ladder
      approaches |D| ~ p^{2/3}, and this is charged and disclosed rather
      than hidden.
  recommended_priority: medium

  review_refs: []
  disposition: proposed
  recorded_by: coordinator
  recorded_at: '2026-08-07'
