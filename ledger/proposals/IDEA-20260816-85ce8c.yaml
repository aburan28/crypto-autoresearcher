idea:
  id: IDEA-20260816-85ce8c
  question_id: RQ-MDFIVE-6870c1
  added: '2026-08-16'
  title: 'Transfer the asymmetry question by changing one design axis only: compare the split statistics
    of a permutation-type message schedule, where sixteen words are each reused, against a recurrence-type
    schedule that expands sixteen words into many, holding step count and state size fixed, and name
    the transfer assumption.'
  class: representation
  claim: '(A) MD5''s schedule is a permutation type: sixteen message words, each appearing four times
    across sixty-four steps, so every step''s word is one the attacker directly controls. A recurrence-type
    schedule instead expands sixteen input words into as many step words as the round count needs,
    so most steps meet a word that is a function of several inputs rather than an input itself. This
    is a single, isolatable design axis, and it is the axis on which MD5 differs most sharply from
    later designs in the same broad family. (B) The claim under test is that the two schedule types
    differ systematically in the split statistics that a meet-in-the-middle style accounting depends
    on, and that the direction is toward shorter achievable chunk separation for recurrence types,
    because a neutral word must be neutral for a whole expanded segment rather than for a single step.
    The measurement holds step count, word count and state size fixed and varies only schedule type,
    so the comparison is not confounded by round count or by output length. (C) The transfer assumption
    is named explicitly and is not hidden in a conclusion: any statement this record makes about a
    recurrence-type schedule applies to the abstract schedule type as instantiated in the declared
    parameterised family, and transfers to any deployed function only under the assumption that the
    deployed function''s schedule is well approximated by that family, which this record does not
    verify and does not assert. (D) EXPLICITLY NOT CLAIMED: no result about any deployed hash function,
    no attack on anything, no claim that recurrence schedules are stronger or weaker in any security
    sense, and no claim about MD5''s preimage resistance. Split separation is a combinatorial necessary-condition
    statistic and a difference in it is a difference in that statistic.'
  mechanism: 'STAGE 1 defines a parameterised schedule family with a type switch: permutation type
    draws a sequence in which each of sixteen words appears equally often, and recurrence type generates
    step words as declared linear combinations of earlier words with a declared expansion rule, both
    at the same step count. STAGE 2 generalises the chunk-separation statistic from words to dependency
    sets, since in a recurrence schedule a step word depends on a set of inputs and neutrality must
    be defined with respect to that set; this generalisation is the record''s main technical content
    and it reduces exactly to the sibling record''s definition when the dependency sets are singletons,
    which is checked. STAGE 3 computes the generalised statistic across both types at matched step
    counts. STAGE 4 computes the same for MD5''s actual schedule and for a recurrence schedule of
    matched step count, reporting both as points in their type''s distribution. STAGE 5 runs the degenerate
    control in which the recurrence expansion is the identity, which must reproduce the permutation-type
    distribution exactly, otherwise the generalisation is not backward compatible and no comparison
    is valid. The claim is refuted if the two type distributions overlap substantially or if the direction
    is opposite to the prediction.'
  novelty_status: unverified
  novelty_screen:
    method: grep -rl MDFIVE over ledger/proposals/, empty. grep -ril md5, md4 over ledger/proposals/,
      empty. grep -ril 'message schedule' over ledger/proposals/ and knowledge/techniques/. Read RQ-MDFIVE-6870c1's
      directive that transfers to a modern function are welcome if the transfer assumption is named.
      Read knowledge/techniques/KN-TECH-066 and docs/inventor-protocol.md sections 2 and 5.
    results: No ledger proposal defines any message-schedule statistic for any primitive. KN-TECH-066
      discusses freedom degrees generally across compression functions and permutations, including
      sponge constructions, without distinguishing schedule types or defining a dependency-set generalisation
      of neutrality. The anchor question RQ-MDFIVE-6870c1 relates GOAL-MD5-001 to GOAL-SHA2-001, GOAL-SHA3-001,
      GOAL-BLAKE-001, GOAL-ASCON-001 and GOAL-SIMSPK-001 as goals sharing one search instrument, which
      is the program context in which a schedule-type comparison would be used, but no record performs
      one. The sibling records in this batch define chunk separation for permutation-type schedules
      only.
    verdict: UNVERIFIED. The observation that expansion schedules and permutation schedules differ
      in how directly an attacker controls a step's word is elementary and is a known design distinction;
      the neutrality notion is standard in the technique family the anchor question names. These are
      assembled parts. What is claimed new is the dependency-set generalisation of the separation
      statistic, its backward-compatibility check, and the matched-parameter comparison between schedule
      types with the transfer assumption stated as a first-class field rather than a caveat. Nothing
      is asserted about the published literature.
  object_first_candidate:
    tracked_object: The dependency set of each step's message word, meaning the set of input words
      it is a function of, carried across the schedule and summarised by the generalised chunk separation
      it permits.
    lossiness: 'Lossy. The dependency set discards the coefficients of the combination, the arithmetic
      that produced it, and every value, keeping only which inputs a step''s word touches. Many different
      expansion rules with the same dependency structure map to one object, and that is deliberate
      because neutrality is a support condition rather than a value condition. What survives propagates
      because expansion rules are fixed functions of earlier words, so the dependency sets are computable
      once and evolve deterministically along the schedule by union. The honest limit, recorded rather
      than hidden: an input can appear in a dependency set and yet influence the word only in a way
      that a real attacker could cancel, so the object overstates coupling, and it is therefore a
      conservative necessary-condition statistic and is described as such everywhere.'
    propagation: One step of the schedule contributes its word's dependency set to whichever chunk
      contains that step. A split is admissible when each chunk omits at least one input from the
      union of its own dependency sets that the other chunk's union contains. Advancing the split
      boundary by one step moves one dependency set from one side to the other, which can only enlarge
      one union and shrink the other, so admissibility changes monotonically along the boundary and
      the enumeration is cheap. For permutation-type schedules every dependency set is a singleton
      and the rule collapses to the sibling record's definition exactly.
    survival_score: The object survives while dependency sets remain proper subsets of the input set.
      In a recurrence schedule the unions saturate to the full input set after a computable number
      of steps, after which no split is admissible anywhere and the statistic is zero; that saturation
      step count, per expansion rule, is the record's most reusable number. For MD5's permutation
      schedule the sets never grow beyond singletons, so the object never saturates and the comparison
      between the two saturation behaviours is the measurement.
  null_object_control: Two nulls in the same invocation. First, the identity-expansion recurrence
    schedule, whose dependency sets are all singletons; the generalised statistic must reproduce the
    permutation-type value exactly, which is the backward-compatibility check without which no cross-type
    number means anything. Second, a fully saturated schedule in which every step's word depends on
    all sixteen inputs; the statistic must be exactly zero. For the comparison to mean anything both
    nulls must hit their forced values, and additionally the permutation-type and recurrence-type
    distributions must each be computed over shape-matched random members rather than from single
    instances, so that a type difference is a difference of distributions.
  discriminated_from:
  - 'The permutation-schedule statistic record in this batch: that computes separation for permutation-type
    schedules with singleton dependency sets. This one generalises the statistic to dependency sets
    and compares types; it reduces to the sibling definition exactly in the singleton case, which
    is checked rather than asserted.'
  - 'KN-TECH-066''s treatment of freedom degrees across construction families: that note distinguishes
    compression functions from permutations and sponges by their attack economics, not by schedule
    dependency structure, and defines no statistic.'
  - 'Any claim about a specific deployed modern hash function: this record deliberately measures an
    abstract parameterised family and names the transfer assumption as unverified, so it makes no
    statement about any deployed function and none may be read into it.'
  - 'The blacklisted Wesolowski exponent-decomposition and CSIDH cost-model families: those are asymmetric-primitive
    complexity reconstructions with no schedule, no dependency sets and no hash function.'
  - 'The MD4-versus-MD5 paired-control record in this batch: that compares two concrete primitives
    on the same axis set. This varies one abstract design axis while holding step count and state
    size fixed, and its objects are families rather than primitives.'
  assumptions:
  - Dependency-set neutrality is a conservative necessary condition for a split, overstating coupling,
    which makes a measured shorter separation for recurrence types a weaker statement than it appears
    and is recorded as such.
  - The declared recurrence family is a reasonable abstraction of expansion-type schedules; this is
    the transfer assumption and it is not verified anywhere in this record.
  - Matching step count, word count and state size across types removes the obvious confounds; other
    confounds may remain and the record does not claim otherwise.
  - The generalised statistic reduces exactly to the sibling record's definition on singleton dependency
    sets, which is checked by the identity-expansion null rather than assumed.
  predictions:
  - metric: median generalised chunk separation, recurrence type versus permutation type at matched
      step count
    direction: lower
    minimum_effect: 4
  - metric: overlap between the two type distributions, as the fraction of recurrence samples exceeding
      the permutation-type median
    direction: lower
    minimum_effect: 0.2
  - metric: identity-expansion null statistic versus permutation-type statistic
    direction: different
    minimum_effect: 'forced value: exactly equal; any discrepancy invalidates the generalisation and
      the whole comparison'
  - metric: saturation step count for the declared recurrence family
    direction: different
    minimum_effect: 'explicit refusal to pre-commit: saturation depends entirely on the declared expansion
      rule, which is a design parameter of this study rather than a property of any primitive, so
      any predicted value would be circular'
  minimal_test:
    design: Implement the generalised statistic once, taking a list of dependency sets rather than
      a list of word indices, and check it against the sibling record's value on MD5 by passing singleton
      sets, which must agree exactly. Generate 10^4 permutation-type schedules and 10^4 recurrence-type
      schedules at 64 steps, 16 inputs, with the recurrence expansion rule declared in advance. Compute
      the statistic for all of them plus MD5 itself plus both nulls. Report the two distributions,
      their medians, their overlap, and the saturation step counts. The whole computation is set unions
      over small sets and runs in under a minute. It discriminates because the two type distributions
      either separate by the predicted margin in the predicted direction or they do not, and the identity-expansion
      null either reproduces the permutation value exactly or the generalisation is broken and no
      comparison may be reported at all.
    controls:
    - Identity-expansion recurrence null, which must reproduce permutation-type values exactly.
    - Fully saturated schedule null, which must return separation exactly zero.
    - Matched-parameter design holding step count, input count and state size fixed across types.
    - Expansion-rule sweep over three declared rules of differing sparsity, so a type difference driven
      entirely by one rule's density is visible.
    - MD5's actual schedule reported as a point in the permutation-type distribution, so the type
      comparison is not confounded with MD5 being atypical within its own type.
    required_metrics:
    - generalised chunk separation per schedule
    - median and interquartile range per type
    - distribution overlap fraction
    - saturation step count per expansion rule
    - identity-expansion null value versus permutation-type value
    - MD5's percentile within the permutation-type distribution
  falsification_conditions:
  - The identity-expansion null does not reproduce permutation-type values exactly, invalidating the
    generalisation.
  - The fully saturated null returns nonzero separation.
  - Median separation for recurrence type is not at least 4 steps below permutation type.
  - Distribution overlap exceeds 0.2, meaning the types are not separated in practice.
  - The type difference reverses or vanishes under any of the three declared expansion rules, meaning
    the effect belongs to one rule rather than to the type.
  confounders:
  - Expansion-rule density, which alone determines how fast dependency sets saturate and is addressed
    by the three-rule sweep.
  - Conservatism of dependency-set neutrality, which may compress recurrence-type separation for a
    reason unrelated to any real split difficulty.
  - MD5's own atypicality within permutation type, which would make a comparison against MD5 rather
    than against its type distribution misleading.
  - Step-count matching, since a recurrence schedule at a step count below its saturation point behaves
    quite differently from one above it.
  - Reading an abstract-family result as a statement about a deployed function, which the transfer
    assumption field exists to block and which the interpretation limits repeat.
  interpretation_limits:
  - Every number describes the declared parameterised families and transfers to a deployed function
    only under the stated, unverified assumption.
  - Dependency-set neutrality is conservative, so a shorter measured separation is an upper bound
    on split admissibility and not a statement that a split is impossible.
  - No security comparison between schedule types is offered or implied; the statistic is combinatorial
    and carries no complexity.
  target_complexity:
    time_exponent: No attack exponent is claimed. The deliverable is a separation statistic in steps
      and a saturation step count.
    memory_exponent: No attack memory exponent is claimed.
    best_known: The incumbent is the sibling record's chunk-separation statistic for permutation-type
      schedules, which this record generalises and which serves as its backward-compatibility target.
      For deployed functions there is no incumbent here at all, since the record makes no statement
      about any deployed function.
    hidden_overhead: 'The set operations are trivial; the cost is in the declared expansion rules,
      which define the recurrence family completely. Choosing them is a modelling act with no mechanical
      constraint, and a family chosen after seeing the statistic would make the whole comparison circular,
      so the honest cost is the discipline of declaring them first and reporting all three even when
      one disagrees. The second hidden term is the conservatism of dependency-set neutrality: it overstates
      coupling by an unmeasured amount, so a measured type difference is an upper bound whose slack
      nobody has quantified. Third, the transfer assumption is the entire point of the record and
      is the one thing it does not test, so the human cost of preventing a later record from quietly
      making the leap is ongoing rather than one-off.'
  dominated_by: n/a (no result claimed). Both MD5 frontier rows this program holds, the UNVERIFIED
    2^123.4 preimage figure and the seconds-scale collision figure in RQ-MDFIVE-6870c1, were checked,
    and no frontier row exists in this program for any recurrence-schedule function. A separation
    statistic occupies no axis on any of them, so no Pareto relation exists and null would be a fabrication.
  sota_delta: no attack; conceptual/measurement contribution only. The output is a difference of medians
    in steps between two abstract schedule families, incomparable with any complexity figure.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'Split by part. That the dependency-set generalisation reduces exactly
    to the sibling definition on singletons: about 0.8, since it is designed to and is directly checkable,
    with the residual risk in edge cases at window boundaries. That the fully saturated null returns
    zero: about 0.95. That recurrence-type median separation is at least 4 steps below permutation
    type: about 0.6, since saturation is a strong effect but the magnitude depends on the declared
    expansion rule. That the effect is stable across all three declared expansion rules, making it
    a type property rather than a rule property: about 0.3, and this is the part most likely to close
    the transfer. That the transfer assumption to any deployed function would survive scrutiny: not
    estimated here, because this record deliberately makes no such claim and the assumption is recorded
    as unverified rather than as probable.'
