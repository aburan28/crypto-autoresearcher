  lossy_projection_identifiability_audit:
    projection: >-
      Scoring implementation (a program with values, secrets, and control flow)
      --> its operation DAG --> the pair (modular multiplications, memory words
      touched).
    what_is_discarded: >-
      Every value. The DAG retains the shape of the computation and discards its
      contents: which secret, which sample, which score, which candidate won.
    why_genuinely_lossy: >-
      Massively lossy in the right direction. Uncountably many scoring functions
      share one DAG, and the fibre over an observed op-count is the whole class
      of programs with that circuit shape. Crucially it is NOT constant: the
      comparator here is the ALGORITHM, not the instance, and the two algorithms
      being compared differ by a factor Theta(n / log n) in the retained
      coordinate. That is a large, derived, non-zero comparator spread and it is
      what makes the projection worth tracking.
    why_compatible_with_the_operations: >-
      Compatible by construction: op counts add under sequential composition and
      max under parallel composition, so the projection propagates
      deterministically through exactly the operation the target performs
      (composing evaluation stages). This is the property the (Delta, Pi) failure
      lacks in reverse -- there the projection propagated but retained
      everything.
    is_it_only_a_change_of_coordinates: >-
      NO, AND THE CHECK IS EXPLICIT. The recoverability test: can the scoring
      function be reconstructed from its op count? No -- the naive and batched
      orders compute the IDENTICAL 2n numbers by the identity in step 1, which
      is precisely why the projection is informative: it separates two programs
      that the value-level view identifies. FAILURE MODE CHECKED FOR: the mirror
      failure (constant across the comparator set). It does not fire, because the
      derived ratio grows with n and is graded across four values of n. FAILURE
      MODE ALSO CHECKED FOR: the (Delta, Pi) failure (nothing discarded). It
      does not fire either, because the values are demonstrably not recoverable
      from the counts. A THIRD failure mode DOES threaten and is recorded rather
      than hidden: the op count is constant across INSTANCES at fixed
      parameters, so this projection can say nothing whatever about any
      individual ML-KEM key, and no instance-level claim may be built on it.

  assumptions:
    - >-
      That the pinned estimator's optimized cost decomposes into named
      components at all, so that a score-evaluation share f is well defined. IF
      IT DOES NOT, the ceiling still holds with f taken as the largest share
      attributable to scoring under any admissible decomposition, and the
      experiment must report the decomposition ambiguity as its result rather
      than pick one.
    - >-
      That "materially improve" in GOAL-MLKEM-001's completion criterion 1 is at
      least the two bits IDEA-20260722-001 declared. This is the campaign's own
      threshold, quoted, not one invented here. If the Coordinator sets a lower
      bar the ceiling arithmetic is unchanged and only the verdict moves.

  proof_search_map_note: >-
    The full four-audit proof_search_map for this proposal is carried on the
    paired hypothesis H-MLKEM-6d9364, where inventor-protocol section 8 requires
    it before the Coordinator approves implementation.

  predictions:
    - metric: >-
        adjoint_identity_agreement: number of the 2n orbit inner products
        <X^j v, b> mod q that equal the corresponding coefficient of (v * vbar-
        convolved) b, over 200 random (v, b) pairs at n in {32,64,128,256},
        k in {1,2,3,4}, q = 3329
      direction: higher
      minimum_effect: >-
        EXACTLY 2n out of 2n, on every pair, at every cell. Derived before the
        run. A single mismatch falsifies the step-1 derivation and the whole
        proposal is withdrawn as a superseding record. There is no tolerance:
        this is exact modular arithmetic.
    - metric: >-
        op_count_ratio: (naive modular multiplications) / (batched modular
        multiplications) per sample per pool vector, at k = 3, over
        n in {32,64,128,256}
      direction: higher
      minimum_effect: >-
        Monotone increasing in n, and at n = 256 within a factor 1.5 of the
        derived closed form 2 k n^2 / (k((3/2) n log2 n + n) + (3/2) n log2 n),
        which evaluates to about 30 at k = 3. Pre-registered numeric anchors at
        k = 3: n = 32 about 6.7, n = 64 about 11, n = 128 about 19, n = 256
        about 30. A ratio flat in n means the counter is measuring the harness
        and no negative may be reported.
    - metric: >-
        unstructured_null_orbit_validity: fraction of the 2n coordinate-rotated
        images of a dual vector that remain dual-lattice vectors, for an
        unstructured (Frodo-shaped) LWE instance of matched dimension nk, same
        q, same error width
      direction: lower
      minimum_effect: >-
        EXACTLY 2 of 2n (the vector and its negation), i.e. 2/512 = 0.0039 at
        n = 256. Derived: a rotation is a lattice automorphism only because the
        module is a ring module; delete the ring and only +/- survives. If the
        unstructured null returns materially more than 2, the implementation is
        generating vectors by a route that does not test membership and every
        number in the package is void.
    - metric: >-
        f_score: the score-evaluation stage's share of the optimized total cost
        under the pinned lattice-estimator (commit 3e48ef4) for ML-KEM-512/768/1024
      direction: different
      minimum_effect: >-
        NO VALUE IS PREDICTED. This is the one quantity in the proposal whose
        value is not derivable in advance, which is exactly why it is worth
        measuring, and stating a prediction for it would be the forced-quantity
        error this program has made six times (GOAL-MLKEM-005 completion
        criterion C1). What IS pre-registered is the DECISION RULE, frozen here:
        f < 0.75 at all three parameter sets closes the orbit-amortisation lane
        against a 2-bit bar with an argument; f >= 0.75 at any parameter set
        leaves it open and names it as the successor.
    - metric: >-
        memory_words_ratio: batched resident words / naive resident words per
        pool vector
      direction: higher
      minimum_effect: >-
        At least k*n (i.e. >= 768 at k = 3, n = 256) by the derivation in step 3.
        Reported beside time in every row. A cost claim in this family that omits
        the memory column is inadmissible under docs/claims-and-verification.md.

  minimal_test:
    design: >-
      Four stages, cheapest first, each able to terminate the line.
      STAGE 0 (zero compute, ~30 min): re-read EV-MLKEM-001, EV-MLKEM-002 and
      the archived cost_baseline_report, and record verbatim the two sentences
      that leave the computational residue open, so that a reviewer can check
      that this proposal sits outside the tested boundary rather than inside it.
      STAGE 1 (pen and paper, ~1 h, zero compute): write out the step-1 adjoint
      identity and the step-4 ceiling in full with their proofs, and have them
      checked. A defect in the ceiling proof ends the line here at zero cost.
      STAGE 2 (numpy, minutes): machine-check the identity exactly mod q over
      the declared grid; run the operation counter on both evaluation orders;
      run the unstructured null; run the FFT positive control.
      STAGE 3 (pinned estimator, infrastructure-gated): measure f_score. IF THE
      CHECKOUT IS UNAVAILABLE THIS IS AN INFRASTRUCTURE OUTCOME AND NOT A
      NEGATIVE RESULT (AGENTS.md rule 5); the package then reports stages 0-2,
      states the ceiling as a function of f, and names the missing number.
    controls:
      - >-
        NULL-U (unstructured / Frodo-shaped null object, same shape). Matched
        dimension nk, same q = 3329, same error width, no ring. FORCED VALUE
        DERIVED BEFORE THE RUN: exactly 2 of 2n rotated images are dual-lattice
        vectors, and the batching identity therefore fails; the op-count ratio
        must collapse to 1.0. THIS NULL CAN FAIL: if the unstructured arm shows
        a batching saving, the counter is measuring the transform and not the
        ring, and no conclusion may be drawn. This is the angle brief's
        FRODO-as-matched-null template applied to the one place in this goal it
        actually bites.
      - >-
        POSITIVE CONTROL, CYC-FFT (the effect MUST appear). Plain cyclic
        convolution of length n computed naively versus by transform, counted by
        the same instrument. The textbook ratio Theta(n / log n) MUST be
        recovered to within the declared constant. If the counter cannot see the
        classical FFT speedup, the instrument is broken and NO negative result
        from any other arm may be reported at all.
      - >-
        GRADED CONTROL, four interior points, monotonicity reported. n in
        {32,64,128,256} at fixed k = 3, and k in {1,2,3,4} at fixed n = 256.
        The op-count ratio must increase monotonically in n and be essentially
        flat in k (the orbit has order 2n regardless of k -- a derived
        prediction that localises any failure to the transform rather than to
        the module structure).
      - >-
        ORDERING CONTROL. The null arm and the positive control are generated,
        counted and hash-committed BEFORE the treatment arm is looked at, and
        the frozen decision rule is executed on the null first. If the rule
        emits the same verdict on NULL-U as on the treatment, it discriminates
        nothing and must be rewritten before the treatment arm is read.
      - >-
        ARCHIVE CHECK (zero compute). Enumerate every prior measurement of an
        operation count in this corpus for any ML-KEM scoring routine.
        EXPECTED RESULT: NONE EXISTS -- and that absence is recorded as an
        absence, not claimed as a passed check.
    required_metrics:
      - the 2n-of-2n identity agreement count per cell, with q, n, k and seeds
      - naive and batched modular-multiplication counts, separately, per cell
      - resident memory words per pool vector for both orders
      - the unstructured-null orbit validity count, with the membership test used
      - the CYC-FFT positive-control ratio against its textbook value
      - f_score per parameter set with the estimator commit, the decomposition
        used, and the known-answer control's own output pasted verbatim

  falsification_conditions:
    - >-
      Any single (v, b) pair at any cell where the 2n adjoint identities do not
      all hold exactly mod q. The mechanism's step 1 is then wrong, the batching
      does not exist, and the proposal is withdrawn.
    - >-
      An op-count ratio that is flat or decreasing in n. The instrument is then
      measuring itself and nothing may be reported.
    - >-
      A counterexample to the step-4 ceiling: an admissible cost model and an
      admissible subcomponent speedup where the optimized total improves by more
      than log2(c) bits WITHOUT the feasible domain changing. The inequality is
      elementary, so such a counterexample most likely exposes a domain change,
      and locating it would be a more valuable result than the ceiling itself.
    - >-
      CYC-FFT fails. Nothing negative may be reported at all.
    - >-
      f_score >= 0.75 at any standardized parameter set. The lane is then NOT
      closed, this proposal's headline reading is wrong, and the successor is
      an end-to-end batched-scoring implementation with the memory charged.

  confounders:
    - >-
      COUNTING CONVENTION. "(3/2) n log2 n butterflies per transform" is a
      declared convention, not a fact about any implementation. A different
      convention moves the ratio by a small constant and moves NOTHING about the
      ceiling, which is convention-free. The package must report both the raw
      counts and the convention, so a reviewer can re-derive under their own.
    - >-
      DECOMPOSITION AMBIGUITY. f_score is only as well defined as the
      estimator's component structure. If the estimator fuses sieving and
      scoring into one term, f is not measurable and the honest output is that
      fact plus the ceiling stated parametrically in f.
    - >-
      AMORTISATION ACCOUNTING. The forward transforms of the pool vectors are
      charged once and amortised over the sample set; whether that amortisation
      is legitimate depends on the pool/sample ratio the attack actually uses.
      The package must report the ratio it assumed, and report the unamortised
      count as well.
    - >-
      RELAYED BASELINE. Every external cost figure entering stage 3's context is
      relayed through one archived task artifact written by a different runtime
      on 2026-07-22. It is read here as a record of what that task reported, not
      as a verified reading of any paper.

  interpretation_limits:
    - >-
      This is a COST-ACCOUNTING AUDIT, NOT AN ATTACK. It recovers no key, solves
      no instance, and produces no certificate. Its claim tier is toy for every
      measured quantity and derivation for the ceiling.
    - >-
      A negative outcome (f small) closes ONE lane -- amortisation confined to
      the scoring stage of a dual attack that reuses a negacyclic orbit -- and
      closes it WITH a named obstruction (the share ceiling), an argument (the
      pointwise inequality), and forward guidance (sample-count changes,
      exponent changes, and domain-enlarging changes are untouched). It does not
      establish that ML-KEM's ring structure is unexploitable, and any record
      citing it that way is misciting it.
    - >-
      The 30x arithmetic ratio must never be quoted as "a 30x speedup on
      ML-KEM". It is a ratio between two ways of evaluating one scoring stage,
      before memory is charged and before the share ceiling is applied.
    - >-
      NO STATUS CHANGE to IDEA-20260722-001, EV-MLKEM-001, EV-MLKEM-002 or
      GOAL-MLKEM-001 is proposed or implied. GOAL-MLKEM-001 is closed at budget
      and this record does not reopen it; it supplies the successor a new goal
      would consume.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NONE LOAD-BEARING FOR THE HEADLINE. The adjoint identity is an exact
        statement of modular arithmetic and the share ceiling is an elementary
        inequality over non-negative summands; neither is distributional and
        neither is assumed. This entry exists to record that fact explicitly
        rather than leave the field decorative.
      rigorous_support: >-
        Identity: negacyclic wrap-around sign bookkeeping, written out in step 1
        and machine-checkable exactly. Ceiling: C_j <= sum_i C_i for
        non-negative C_i, hence T' >= T/c pointwise, hence min T' >= (min T)/c.
      validation_plan: >-
        Exact modular check over 200 random pairs at 16 cells for the identity;
        a written proof plus an adversarial search for a domain-changing
        counterexample for the ceiling.
    - id: H2
      statement: >-
        The estimator's optimized total admits a decomposition in which a
        "score evaluation" component is identifiable, so that f_score is a
        well-defined number rather than an artifact of how the terms were
        grouped.
      rigorous_support: >-
        NONE. This is an assumption about somebody else's code and it is the
        weakest link in stage 3. It is stated so a reviewer can attack it.
      validation_plan: >-
        Read the pinned estimator's cost expression, report every admissible
        grouping, and report f as an interval over groupings rather than a point
        if the grouping is not unique.

  target_complexity:
    time_exponent: >-
      THIS PROPOSAL MOVES NO EXPONENT, AND SAYS SO PLAINLY. It bounds a
      constant. Its value is that it bounds the constant BEFORE anyone spends a
      campaign chasing it: the ceiling -log2(1 - f) is an upper bound on every
      possible future improvement to that stage, not on one algorithm.
    memory_exponent: >-
      The batched order costs O(k n) resident words per pool vector against O(1),
      reported beside time in every row. No memory exponent is claimed for any
      attack.
    best_known: >-
      As recorded in the archived in-repo report (READ; its external sources NOT
      READ -- relayed): corrected structure-aware code-based dual estimates
      C0 121.9 / 173.0 / 237.4, CC 139.1 / 194.7 / 259.0, CN 134.5 / 188.7 /
      254.1 bits at ML-KEM-512/768/1024, with the maximum matched structure gain
      recorded as 0.8 bit.
    hidden_overhead: >-
      The transform amortisation hides in the pool/sample ratio, and the memory
      residency hides in whatever the cost model charges for a memory word. Both
      are named in the confounders and both are reported.
    tradeoff_note: >-
      The batched order is strictly worse in memory and strictly better in time,
      so the two orders are Pareto-incomparable until memory is priced. That is
      the honest statement and it is the reason the memory column is mandatory.

  dominated_by: >-
    n/a (no attack claimed) for the audit itself. On the QUESTION it audits --
    can negacyclic orbit reuse materially improve an ML-KEM dual attack -- the
    incumbent frontier and the rows checked are: (TIME) the corrected
    structure-aware dual C0/CC/CN rows above; (TIME) the primal progressive-BKZ
    RAM-gate row 141.4 / 204.3 / 276.5; (MEMORY) the same row's
    98.1 / 143.2 / 194.3 log2 memory bits, which is the only memory column the
    archived report carries for a classical attack; (TIME+MEMORY jointly) the
    memory-routing row 158.7 / 229.9 / 310.2, which is the frontier point that
    dominates any claim ignoring routing; (DATA/QUERIES) not applicable -- the
    passive MLWE setting has no query axis, and the report's oracle-bearing rows
    are excluded from its own scope. Every one of those rows was read in the
    archived report this session. The incumbent structure gain on this exact
    question is 0.0-0.8 bit. This proposal claims no point on any of those axes;
    it bounds what a future point could be.
  sota_delta: >-
    Zero on every attack axis: no time, memory, data or query figure improves.
    Quantitatively, the deliverable is (a) an exact ratio, derived at about 30x
    at n = 256 k = 3 and to be measured, between two evaluation orders of one
    stage, and (b) an upper bound of -log2(1 - f_score) bits on the total
    improvement that stage can ever yield, against the campaign's own declared
    2-bit materiality bar. If f_score < 0.75 the delta is a closure worth one
    lane; if not, the delta is the identification of a live lane the campaign
    closed one derivation short of.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.20 that the lane survives, i.e. that f_score >= 0.75 at some standardized
    parameter set. It is not lower because dual attacks with an FFT scoring
    stage genuinely can be scoring-dominated at their optimum, because nobody in
    this corpus has ever measured f, and because DEC-20260803-64b55b records two
    occasions in a single batch where this program's scouting was wrong in the
    direction that would have closed work off. It is not higher because the
    sieve producing the pool is the term that carries the 0.292-style exponent
    (RECALLED, UNVERIFIED -- a candidate to check in stage 3, not an authority)
    and exponential terms usually dominate their own postprocessing, and because
    the campaign's own corrected structure gain of 0.0-0.8 bit is already below
    the bar before any amortisation argument is made. Separately: 0.95 that the
    audit reaches a decisive reading of stages 0-2, because they are pen, paper
    and numpy, and about 0.5 that stage 3 runs at all, because it needs network
    for the estimator checkout.
