idea:
  id: IDEA-20260805-690de8
  question_id: RQ-MLKEM-001
  goal_id: GOAL-MLKEM-001
  added: '2026-08-05'
  title: >-
    The operation-DAG ceiling on negacyclic isometry-orbit reuse: charge the
    arithmetic circuit and the memory, not the sample count, and derive the
    maximum bits any amount of orbit batching can ever buy
  class: control

  claim: >-
    GOAL-MLKEM-001's one cryptanalytic candidate, IDEA-20260722-001, was
    weakened on STATISTICAL grounds and its COMPUTATIONAL residue was left
    explicitly open when the six-batch budget ran out. EV-MLKEM-001's own
    inference sentence names the successor -- "a bounded symbolic derivation can
    still determine whether any non-equivalent amortization survives the
    rotated-vector identity" -- and EV-MLKEM-002 carries it forward verbatim as
    unresolved confound 5, "computational reuse in weighted orbit evaluation
    remains open pending operation-DAG accounting". No record in this repository
    performs that accounting. This proposal performs it, and it predicts the
    answer before running: (i) the 2n scores of a dual vector against its full
    negacyclic orbit are exactly the 2n coefficients of ONE negacyclic ring
    product, so the batched arithmetic cost is Theta(k n log n) against a naive
    Theta(k n^2), a ratio of Theta(n / log n) which is about 20-32x at n = 256;
    and (ii) that ratio is nevertheless incapable of moving the attack estimate
    by two bits, because a speedup confined to one cost component can move an
    OPTIMIZED total by at most -log2(1 - f) bits, where f is that component's
    share of the total at the optimum. The deliverable is therefore a NUMBER --
    the score-evaluation share f of the pinned estimator's optimized total --
    plus the ceiling it forces. Both outcomes are useful: if f < 0.75 the whole
    orbit-amortisation lane is arithmetically foreclosed against the 2-bit
    materiality bar IDEA-20260722-001 itself declared, with an argument rather
    than a fatigue report; if f >= 0.75 the lane is live and the campaign was
    closed one derivation short of finding that out.

  object_first_candidate:
    tracked_object: >-
      THE OPERATION DAG. Not the score, not the secret, not the lattice: the
      directed acyclic graph of modular multiply-accumulates and memory touches
      performed by the scoring stage, followed from one sieved dual vector
      through its full negacyclic orbit to the accumulated score table. Its
      two observables are (mults, memory words touched). This is the object
      IDEA-20260722-001's claim actually lives or dies on, and it is the one
      object no record in this corpus has ever followed.
    established_families_off_limits: >-
      Off-limits as the primary lens for this proposal: primal/uSVP and BDD
      embeddings, dual-sieve score statistics and their tail analyses,
      hybrid/MITM guessing splits, decryption-failure and chosen-ciphertext
      oracles, implementation side channels, class-group and principal-ideal
      routes, and algebraic (Groebner/BKW/resultant) attacks. The negacyclic
      isometry family is NOT off-limits, deliberately: this proposal advances no
      attack inside it, it audits the cost accounting of a candidate already in
      it, which is the one move the off-limits rule does not forbid.
    newness_score: >-
      The adjoint identity itself is elementary and EV-MLKEM-001 already used
      the word "adjoint", so no novelty is claimed for it. What is new here, and
      absent from this corpus, is (a) an explicit operation and memory count for
      both evaluation orders, and (b) the ceiling that converts that count into
      a hard upper bound on bits. The second is the part that decides the lane;
      the first is the part that makes the second checkable.
    testability_score: >-
      Very high and almost free. Stage 1 is pen and paper. Stage 2 is a pure
      numpy operation counter at n <= 256, seconds. Only stage 3 (the share f)
      needs the pinned lattice-estimator and is infrastructure-gated.
    survival_score: >-
      The DAG survives the entire scoring stage by construction: composition of
      DAGs adds op counts, so the object propagates deterministically. It stops
      being informative exactly where the cost model stops decomposing into
      named components, which is why stage 3 must report the decomposition it
      found rather than assert one.

  mechanism: >-
    DERIVED IN THIS RECORD. Every external attribution below is labelled.

    OBJECTS. R = Z_q[X]/(X^n + 1) with n = 256, q = 3329 (FIPS 203 parameters as
    recorded in the archived in-repo report
    coordination/goals/GOAL-MLKEM-001/batches/BATCH-002/tasks/TASK-20260722-206/cost_baseline_report.yaml,
    standardized_targets block, READ THIS SESSION). Module rank k in {2,3,4} for
    ML-KEM-512/768/1024. A dual attack holds a pool of W short vectors
    v = (v_1..v_k) in R^k and evaluates a periodic score f(<v, b> mod q) against
    samples b in R^k. The negacyclic isometry group is generated by
    multiplication by X and by negation; it has order 2n = 512, INDEPENDENT OF k
    and of the parameter set, because multiplying an MLWE relation b = As + e by
    X^j gives X^j b = A (X^j s) + X^j e, a valid relation with secret X^j s.

    STEP 1 -- THE ADJOINT IDENTITY (derived, to be machine-checked, not cited).
    For a, b in R write the coefficient-vector inner product <a, b> = sum_i a_i
    b_i. Define the negacyclic conjugate bbar(X) = b_0 - sum_{i>=1} b_i X^{n-i}.
    Then for every j in {0..n-1},
        <X^j a, b> = coefficient of X^j in (a * bbar),
    the product taken in R. Reason: the coefficient of X^j in a*bbar collects
    a_m bbar_{j-m} with a negacyclic sign flip whenever the index wraps, and the
    same sign flip is exactly what X^j a suffers when its coefficients wrap past
    degree n-1. The negated orbit members contribute the negatives of the same
    2n/2 = n numbers. HENCE: the 2n orbit scores against one sample are the n
    coefficients of a single ring product, together with their negatives. The
    identity is stated here as a derivation and is a PROOF OBLIGATION of the
    paired experiment, not an authority.

    STEP 2 -- COST BOOKKEEPING, PER SAMPLE PER POOL VECTOR.
      NAIVE (score each orbit member separately): 2n inner products in R^k, each
      k*n coefficient multiplications, total 2 k n^2 modular multiplications and
      2n accumulator writes.
      BATCHED (one ring product per module coordinate, then sum): k negacyclic
      products of degree n. Schoolbook: k n^2 mults -- a factor 2n/... no, a
      factor exactly 2 saving, which is NOT the interesting case. Via the NTT
      that FIPS 203 already specifies for this ring: forward transform of the k
      v-coordinates (reusable across all samples, so amortised to zero over the
      pool), forward transform of the k b-coordinates, k pointwise products, one
      inverse transform. Charging (3/2) n log2 n butterflies per length-n
      transform as the declared counting convention, the per-sample cost is
      about k*( (3/2) n log2 n + n ) + (3/2) n log2 n modular operations.
      RATIO (naive / batched), at k = 3, n = 256, under the declared convention:
      2*3*65536 = 393,216 against 3*(3072 + 256) + 3072 = 13,056, i.e. about
      30x. Closed form: Theta(n / log n).
      FORCED VALUE, PRE-REGISTERED: the measured op-count ratio must equal the
      closed form to within the declared constant, and must GROW monotonically
      in n across n in {32,64,128,256}. A ratio that does not grow with n is the
      canonical artifact tell -- the quantity meant to be destroyed by shrinking
      n has failed to decay -- and invalidates the counter, not the mathematics.

    STEP 3 -- MEMORY, WHICH NOBODY CHARGED. Batched evaluation must hold the k
    transformed v-coordinates and one length-n accumulator per candidate:
    O(k n) words per pool vector against O(1) working words for the naive order,
    with the transformed pool resident if the amortisation is to be real. The
    archived report records that its own CC label "ignores memory access" and
    that the memory-routing model raises primal costs by 14.3/22.6/30.6 bits at
    ML-KEM-512/768/1024 (READ IN-REPO, same file, primal_memory_routing block;
    the underlying source is NOT READ -- relayed). A speedup bought with
    resident memory in a family where memory routing is worth twenty bits is not
    a speedup until it is charged, and no record in this corpus charges it for
    the orbit proposal.

    STEP 4 -- THE CEILING, WHICH IS THE ACTUAL RESULT. Let the optimized total
    cost be T(theta) = sum_i C_i(theta) over the estimator's parameter domain
    (block size, sample count, guessing dimension). Suppose the improvement
    divides exactly one component C_j by c >= 1 and leaves the domain unchanged.
    Then T'(theta) = T(theta) - C_j(theta)(1 - 1/c) >= T(theta)/c pointwise
    because C_j <= T, so min T' >= (min T)/c and the optimized total improves by
    at most log2(c) bits. Sharper, in the form that decides this lane: if f
    denotes C_j's share of T at the NEW optimum, the improvement is exactly
    -log2(1 - f(1 - 1/c)) bits, which is bounded above by -log2(1 - f) as c goes
    to infinity. So an INFINITELY fast scoring stage buys -log2(1 - f) bits and
    no more. Numerically: f = 0.50 buys at most 1.00 bit; f = 0.75 buys at most
    2.00 bits; f = 0.90 buys at most 3.32 bits. IDEA-20260722-001's own
    materiality bar was two bits. THEREFORE the entire orbit-amortisation lane
    is decided by one measured number, f, and the 30x ratio of step 2 is
    irrelevant to the verdict except insofar as it is finite.

    WHAT THIS DOES NOT SHOW. It does not show that no isometry-aware mechanism
    can help ML-KEM. It shows that one confined to the scoring stage cannot
    exceed -log2(1 - f) bits. Forward guidance is part of the mechanism, not an
    afterthought: the lanes the ceiling does NOT foreclose are those that change
    the REQUIRED SAMPLE COUNT (which changes the domain, not a component), those
    that change the sieve exponent, and those that enlarge the feasible domain
    (for instance by fitting a larger block size inside a fixed memory budget) --
    the one documented way the pointwise inequality above can be evaded.

  novelty_status: unverified

