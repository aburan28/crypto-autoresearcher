idea:
  id: IDEA-20260807-6c89a8
  question_id: RQ-SSIQ-9702af
  added: '2026-08-07'
  title: 'The entire supersingular exponent programme is CLASSICAL-ONLY: the word ''quantum''
    does not occur in GOAL-SSIQ-001''s goal record or any of its thirteen checkpoint shards, in
    GOAL-P13-001, or in any EV-SSIQ-* or EV-WESO-* record -- while the headline 2^{120-123} figure
    is compared against a NIST-I target anchored to AES-128 key search'
  class: cost-model
  claim: GOAL-SSIQ-001 decomposes the p^{1/3+o(1)} algorithm into exponent-carrying factors F1-F8
    and enumerates levers L1-L5, N5 and A1-A7. F3 (list cardinality p^{1/3+o(1)}) feeds a two-list
    claw search and L3 targets exactly that collision mechanism. KN-TECH-050 already carries a
    'quantum claw-finding under a charged model' row plus a memory-free fixed-degree row reported
    to beat MITM 'classically and quantumly'. A grep of ledger/goals/GOAL-SSIQ-001/ (goal.yaml
    plus all 13 checkpoint shards) and of every EV-SSIQ-* and EV-WESO-* evidence record returns
    ZERO occurrences of 'quantum'; GOAL-P13-001 likewise. No lever in the L1-L5 / N5 / A1-A7 map
    is a quantum lever, and no record asks what the quantum time and memory exponents of the Wesolowski
    algorithm are when its claw step is replaced by a quantum claw or walk search over L(E,X,B).
    GOAL-SSIQ-001's own lever_completeness_disclaimer says 'no later record may treat "not in
    L1-L5" as "not a route"' -- yet thirteen batches added N5 and A1-A7 without ever adding a
    quantum lever.
  mechanism: 'Charge a quantum claw/collision search over L(E,X,B) with the QUANTUM MEMORY MODEL
    STATED AS A ROW rather than assumed: QRACM, QRAQM, and no-quantum-RAM are three different
    cost worlds and the answer differs by more than the saving in two of them. Report the resulting
    (time exponent, quantum-memory exponent) pair against the classical p^{1/3+o(1)} time = memory
    point and against the vOW curve sqrt(N^3/w). The honest first deliverable is the COST TABLE
    and the memory model, not an algorithm claim. Because EV-SSI-59f7a2 already identifies memory
    (2^{92.5} entries at NIST-I) as what makes the classical attack physically impossible, the
    quantum-memory row is the load-bearing one.'
  novelty_screen:
    screened_on: '2026-08-07'
    corpus_paths_grepped:
    - ledger/goals/GOAL-SSIQ-001
    - ledger/evidence
    - knowledge/techniques
    grep_results:
    - ZERO occurrences of 'quantum' in GOAL-SSIQ-001's goal record and all 13 checkpoint shards,
      in GOAL-P13-001, and in every EV-SSIQ-* and EV-WESO-* record.
    - KN-TECH-050's quantum rows are scoped to the SIDH-era CSSI/MITM table and to fixed-known-degree
      search; neither is the Wesolowski object (a Psi(X,B)-sized list of B-smooth cyclic isogenies
      keyed by middle j-invariant). No ledger record applies it there.
    conclusion: The quantum axis is absent from the exemplar lane.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS as the primary lens: every classical lever already
      in the L-map, KLPT as an attack, orientation/CM (closed by DEC-20260804-3677f1), torsion-image/Kani.
      The object is the COST VECTOR of the claw step under a stated quantum-memory model.'
    tracked_object: The triple (query/gate count, quantum memory, classical memory) of the collision
      step, per memory model.
    one_step_propagation_rule: Composing the claw step with the list-construction step adds costs
      and takes the max of the memory terms; the rules are exact bookkeeping, not heuristics.
    newness_score: As mathematics, nil -- quantum claw search is standard. The content is that
      the program's exemplar result has never had its quantum side costed at all, while its concrete
      figure is compared to a NIST target.
  lossy_projection_identifiability_audit:
    projection: the algorithm -> a per-step resource vector under a named memory model.
    what_is_discarded: All mathematics; only resource counts remain.
    is_it_only_a_change_of_coordinates: 'NO, and honestly: this is a WEAK object that can only
      ever produce bit counts, never a mathematical statement. The class is cost-model for exactly
      that reason, and no exponent is claimed to move.'
    mirror_failure_check: 'CHECKED. The failure would be an accounting that returns the same verdict
      under every memory model. It cannot: QRAQM and no-quantum-RAM differ by construction on
      any memory-heavy search, so at least two distinct values are forced before any source is
      consulted.'
  null_object_control:
    primary_null: Run the identical accounting on a STRUCTURE-FREE SURROGATE list of the same
      cardinality -- i.e. treat L(E,X,B) as an unstructured set. If the genuine list gives the
      same numbers, the accounting is measuring cardinality only and says nothing about isogenies.
    secondary_nulls:
    - 'FORCED VALUE: under no-quantum-RAM, a quantum claw over a list of size X^2 must NOT beat
      vOW at the same classical memory; an accounting that says otherwise is wrong.'
    - 'SOURCE-BLOCKED DISCIPLINE: at least one cell is expected to end marked SOURCE-BLOCKED.
      An accounting with no blocked cells has probably invented a figure.'
  assumptions:
  - The list L(E,X,B) is the object the claw step operates on, as GOAL-SSIQ-001's F3 states.
  - Standard quantum claw/walk cost expressions are usable as relayed rows, each marked as relayed
    until a primary source is filed.
  predictions:
  - metric: quantum time exponent of the claw step under QRAQM
    direction: lower
    minimum_effect: Below the classical p^{1/3}; the interesting number is by how much and at
      what quantum-memory exponent.
  - metric: advantage under no-quantum-RAM
    direction: different
    minimum_effect: Whether any advantage survives at all; this is the row that decides the practical
      reading.
  minimal_test:
    design: 'Build the cost table: three memory models x (list construction, claw step, verification)
      x (gate count, quantum memory, classical memory), each cell sourced or marked SOURCE-BLOCKED,
      with the structure-free surrogate null computed alongside and the vOW curve as the classical
      comparator.'
    controls:
    - structure-free surrogate list null
    - no-quantum-RAM forced value
    - vOW classical comparator
    required_metrics:
    - per-cell resource figures with provenance
    - (time, quantum memory) pair per model
    - explicit statement of whether the 2^{120-123} vs 128-bit comparison is classical-only
  falsification_conditions:
  - 'No advantage survives once quantum memory is charged in any realistic model: a publishable
    negative that also justifies the currently unstated classical-only reading of the 2^{120-123}
    figure.'
  - 'The structure-free surrogate gives the same numbers: the accounting measures cardinality
    and adds nothing about isogenies.'
  - 'Every cell is SOURCE-BLOCKED: the table cannot be built here and that is recorded as such,
    not smoothed over.'
  confounders:
  - Quantum-memory models are not interchangeable and mixing them silently is the standard error
    in this literature.
  - The o(1) in p^{1/3+o(1)} is superpolynomial by the source's own disclosure and must not be
    conflated with a polynomial cofactor.
  interpretation_limits:
  - This is a cost-model record. It proposes no algorithm and claims no exponent movement.
  - Any figure marked relayed is not this program's result until a primary source is filed.
  heuristic_assumptions:
  - id: HEUR-SSIQ-Q1
    statement: Standard quantum claw cost expressions apply to L(E,X,B) without structural correction.
    rigorous_support: None. The list is keyed by middle j-invariant and may not be uniformly accessible,
      which is exactly what the surrogate null probes.
    validation_plan: Report the surrogate comparison as the heuristic's test.
  target_complexity:
    time_exponent: Classical p^{1/3+o(1)}. Quantum exponent is the measured unknown, per memory
      model.
    memory_exponent: Classical p^{1/3+o(1)} (2^{92.5} entries at NIST-I per EV-SSI-59f7a2). Quantum-memory
      exponent is the load-bearing unknown.
    best_known: Wesolowski 2026 p^{1/3+o(1)}, conditional on Heuristic 1.
    hidden_overhead: The superpolynomial o(1) in Theorem 1.1, which must be labelled separately
      from any polynomial factor.
    tradeoff_note: A quantum time saving bought with quantum memory the hardware cannot supply
      is not a saving.
  dominated_by: 'Wesolowski 2026 on the classical axis, trivially, since no algorithm is proposed.
    Rows checked across time, memory and data/queries before writing: Wesolowski 2026 p^{1/3+o(1)}
    time and memory; Delfs-Galbraith p^{1/2}(log p)^{O(1)} at polynomial memory; van Oorschot-Wiener
    p^{1/2+o(1)}/w^{1/2} at memory w; meet-in-the-middle p^{1/2} at p^{1/2}; Kohel 1996 p(log
    p)^{O(1)} at polynomial memory. Queries 0 on every row.'
  sota_delta: ZERO on every axis. Deliverable is the first quantum-side cost entry for the program's
    exemplar result, and an explicit statement of whether its headline comparison against a 128-bit
    NIST-I target is classical-only.
