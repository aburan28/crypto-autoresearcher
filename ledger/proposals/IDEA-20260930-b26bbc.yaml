  assumptions:
    - >-
      Satisfiability of every inner instance is decided by an exact oracle
      (oracle A, 2^l root-findings or group operations) on the controls and on
      every instance the closure does not refute; a closure never decides SAT.
    - >-
      The inner target u = x(R - P_3) is an abscissa of a group element in the
      full group E(F_{2^n}); the certified cells used x(2E) subgroup targets and
      uniform field elements, so the u-distribution is a declared transfer
      (H1), not an assumption of identity.
    - >-
      The GF(2) closure engines (EXP-CERTBIN-e94b27 impl, or the gf2 library
      modules) are generic in (nv, D, neq) and are used unchanged; the wrapper,
      the inner-instance builder, the ladder driver and the certificate tree
      are new code.
    - >-
      OFF-LIMITS COMPONENT: F2 as the family; V inside KN-OPEN-020's
      scoped-out class; nothing here escapes it.

  proof_search_map:
    bottleneck: >-
      Whether the refuting degree of the unsatisfiable m = 2 inner object stays
      bounded (D <= 4) as (n, l) grow along n = 3 l, with rate near 1. That
      single fact converts the per-attempt cost from 2^{(m-1) l} to
      2^{(m-2) l} poly(l); without it nothing in this record moves.
    baseline_embedding:
      parameter_slice: >-
        The archived m = 2 cells (n, l) = (17, 9) and (19, 10) are the exact
        slice where the inner theory is known to refute 386/386 and 400/400;
        the ladder's instrument must reproduce the archived W_4 labels,
        iteration counts and dimensions on 10 archived U62 and 5 S62 systems
        of RUN-CERTBIN-c417e0 before any new cell is read (C-BASE). The
        m = 3 wrapper at l = 0 inner closures (pure oracle A) is the
        (m-1)-loop of IDEA-20260904-96c4f3, and its certificate set must equal
        the wrapper's on 20 attempts (C-LOOP).
      reproduction_check: >-
        Frozen regression: C-BASE exact match; C-LOOP exact multiset equality
        of decompositions; the Stage-0 table of semi-regular references and
        row/column counts (12,17):4, 1343/794; (14,19):4, 2014/1471;
        (16,23):4, 3151/2517; (20,29):4, 6119/6196; (24,35):5, 10535/12951;
        (28,41):5, 16687/24158; (32,47):6, 24863/41449; (18,17):5 committed
        before any run and compared to the engine's own counts.
    observation_collision:
      observable: >-
        Per inner instance: exact sat flag and solution count, the least
        refuting rung among {M_3, W_3, M_4, W_4, M_5, W_5}, the first
        iteration containing 1, ops_to_1 and ops_to_fix, and the
        degree-disciplined certificate; per attempt: the label histogram over
        the 2^l nodes and the certificate tree.
      distinct_preimage_search: >-
        A high W_4 rate can come from (i) structure of the S_3 descent, (ii)
        overdetermination (rows >= columns at degree 4, true for l <= 8 on the
        ray), or (iii) an unsound instrument. (iii) is excluded by Proposition S
        plus the planted-satisfiable inner controls (any refutation voids the
        run). (ii) is separated by the same-support null AND by the ladder
        cells where rows < columns at degree 4; a rate that tracks the null's
        is reading (ii). (i) is what remains, and it is the only reading that
        carries an exponent.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "decide the two-leg residual by enumerating one leg" (an
          exponential object, or 0d1d74's degree-2^{l+1} gcd) by "1 lies in
          W_D of the 2l-variable Boolean ideal" (a rank condition at bounded
          degree). Separate obligations: ENCODING (the inner Boolean system
          has a solution iff u is an abscissa of a two-leg sum, by Semaev's S_3
          and closure of B under negation); COMPLETENESS (every refutation is
          sound by Proposition S; every non-refuted instance goes to oracle A,
          so no decomposition is lost); SOUNDNESS (certificates re-verified by
          the separate-process checker); TRANSFER (declared unmet beyond the
          tested (n, l); H2 carries it); COST LOSS (at toy cells the closure
          loses to oracle A by orders of magnitude; the gain is asymptotic).
        predicted_gain: >-
          Per-attempt exponent (m-2) l + O(log l) against (m-1) l, conditional
          on H2; zero at toy scale.
      - transform: specialization_pack
        proposed_object: >-
          The per-attempt cost split over disjoint node classes (refuted at
          rung D, missed, satisfiable) x (ops_to_1, ops_to_fix + oracle A,
          ops_to_fix + oracle A), summed over the 2^l nodes; charges added
          only across disjoint classes.
        predicted_gain: >-
          The measured constants of the law 2^l (c_group + C_W) +
          (1 - r_D) 2^{2l} c_A, from which l* is computed under H2 and
          labelled an extrapolation.
    quantifier_order: >-
      Soundness: FORALL inner instances, FORALL D, 1 in W_D implies
      unsatisfiable (exact). The exponent claim: EXISTS a constant D_0 (claimed
      D_0 = 4) such that FORALL cells (n, l) on the ray n = 3 l in the tested
      range, the fraction of unsatisfiable inner instances refuted at W_{D_0}
      is >= 0.9 -- the witness D_0 may NOT depend on the cell. The weaker
      order (for each cell there exists a D that refutes) is the generic
      statement and carries no exponent. The quantifier at risk is the one
      over cells, and the ladder exists to attack it.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At the ladder cells (23,8), (29,10), (35,12), (41,14) [and (47,16)
        if reached] the unsatisfiable m = 2 inner objects are refuted at the
        rungs and rates stated, with null rates and satisfiable-control counts
        as stated; at the m = 3 wrapper cells the per-attempt label histogram,
        ops and certificate sizes are as measured; the crossover l* under H2
        is (computed)." It certifies nothing beyond the tested cells, nothing
        about F4 step degree, nothing at n = 131, and no change to any ECDLP
        cost.
      nearby_object_control: >-
        The same-support random inner system at each ladder cell (predicted
        refuted only at its own counting rung) is the object on which the
        bounded-degree conclusion must fail; the planted satisfiable inner
        instance is the proves-too-much object (refutation must fail by
        theorem); the deliberately easy object (inner system plus l random
        affine relations) must be refuted at every rung, or the instrument
        cannot see refutation and nothing is reported.
    proof_obligations:
      - claim: >-
          R = P_1 + P_2 + P_3 with P_i in B iff there is P_3 in B such that
          x(R - P_3) is the abscissa of a sum of two elements of B; the inner
          Boolean system is satisfiable iff the latter holds (closure of B
          under negation; Semaev's S_3 characterisation).
        responsibility: correctness
      - claim: >-
          Proposition S applies to the inner system with field equations
          (radical, zero-dimensional over F_2), so every refutation is sound.
        responsibility: correctness
      - claim: >-
          The Stage-0 counts (rows, columns, semi-regular references) are as
          tabulated; the engine's counts agree.
        responsibility: size
      - claim: >-
          C_W(n, l) is polynomial in l at fixed D (columns C(2l, <= D)); the
          size law's constant is measured per cell in GF(2) word operations.
        responsibility: runtime
      - claim: >-
          The W_4 working set at l = 44 is about 1.2 x 10^12 bits (estimate);
          memory is polynomial but not negligible and is disclosed.
        responsibility: memory
      - claim: >-
          The per-attempt mean cost is the class-weighted sum, with every term
          measured in one unit and oracle A's field operations converted by a
          measured constant.
        responsibility: runtime
      - claim: >-
          The relation-collection charge 6 x 2^{n-l} C_W uses KN-FIND-007's
          conservation mean and the Poisson half (H3); it is
          heuristic-conditional and labelled so.
        responsibility: success_probability
      - claim: >-
          Nothing transfers to prime fields, to non-subspace V, to n = 131
          except by the labelled extrapolation under H2.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        r_4(n, l) = verified W_4 refutations among unsatisfiable inner
        instances at each ladder cell (CP95 exact), 60 instances per cell
      direction: different
      minimum_effect: >-
        E-BOUNDED iff r_4 >= 0.90 at every ladder cell including (35,12) and
        (41,14); E-DECAY iff r_4 <= 0.50 at any cell where it was >= 0.90 at a
        smaller cell; E-DRIFT iff the least refuting rung at (35,12) or
        (41,14) is >= 5 on >= 50 percent of instances. Honest prior: about
        0.45 on E-BOUNDED (two certified cells, both on the diagonal; the
        tensor-neighbourhood mechanism of c3a917 does not obviously depend on
        the ratio n/l, but overdetermination changes the fall structure).
    - metric: >-
        null_rung(n, l) = least refuting rung of the same-support random inner
        system, 30 draws per cell
      direction: different
      minimum_effect: >-
        Predicted to equal the Stage-0 counting rung (4 at (23,8); 4 or 5 at
        (29,10); 5 at (35,12), (41,14); 6 at (47,16)); S_3-ABOVE-NULL at a cell
        iff the object's CP95 lower bound at W_4 exceeds the null's CP95 upper
        bound at W_4.
    - metric: >-
        r_3(n, l) = verified W_3 refutations (the structural rung on the toy
        cells where degree 4 is generic by counting)
      direction: different
      minimum_effect: >-
        Reported; E-W3 iff r_3 >= 0.50 at (17,6) and (23,8). No direction
        preferred (c3a917's 3 of 3 is a located observation).
    - metric: refuted satisfiable inner controls (count)
      direction: same
      minimum_effect: 'exactly 0 by Proposition S; any refutation voids the run.'
    - metric: >-
        per-attempt cost law at the m = 3 wrapper cells: measured
        2^l (c_group + C_W) + (1 - r_D) 2^{2l} c_A in GF(2) word operations,
        against the measured loop cost of IDEA-20260904-96c4f3 on the same
        attempts
      direction: higher
      minimum_effect: >-
        At l in {6, 7, 8} the pipeline is predicted to cost MORE than the
        loop by a factor >= 10^2 (the closure's constant); the deliverable is
        the measured constant and the H2-conditional crossover l*, not a toy
        win. A pipeline cheaper than the loop at l <= 8 would mean the size
        law is wrong and is reported as such.
    - metric: >-
        certificate tree size and check cost per attempt (bytes; GF(2) word
        operations of the separate-process checker)
      direction: lower
      minimum_effect: >-
        Check cost <= 0.2 x production cost on refuted nodes (a straight-line
        replay against an echelon); the attempt-level negative verdict is
        raised from "reported, unproved" to proof_status certificate at that
        check cost. A checker that rejects any submitted certificate voids the
        run.

  minimal_test:
    design: >-
      STAGE 0 (zero run). Commit the counting table (semi-regular references,
      rows, columns at D = 3, 4, 5 for every planned cell), the size law for
      C_W and its l* under H2, and the rule for the inner-target stream.
      STAGE 1 (THE DISCRIMINATOR; the recommended first test). The off-diagonal
      m = 2 ladder, no wrapper: cells (n, l) = (23, 8), (29, 10), (35, 12),
      (41, 14), optional (47, 16); fields F_2[t]/(f) with f the lexicographically
      least irreducible of degree n (recorded); one ordinary curve per n drawn
      by a seeded rule (A, B recorded, order counted by the run); V = {deg < l}
      polynomial basis; inner targets u = x(R - P_3) with R a uniform point of
      the odd-order subgroup and P_3 uniform in B, drawn by a frozen PCG64
      stream, kept until 60 unsatisfiable and 20 satisfiable inner instances
      per cell are collected (satisfiability by oracle A, 2^l root-findings,
      exact). Closures M_3, W_3, M_4, W_4 on all; M_5, W_5 on the first 20
      unsatisfiable per cell where the 3 GB cap allows (bit-packed; (41,14) at
      D = 5 is 98280-column territory and is declared UNDETERMINED(budget) if
      not reached, never "not refuted"). Controls per cell: same-support null
      (uniform coefficients on the union support of the n descended
      equations, redrawn per instance, 30 unsatisfiable draws kept), planted
      satisfiable (20, from P_1 + P_2), deliberately easy (inner system plus
      l random affine relations, 10). Every counted refutation certified by
      the separate-process verifier. C-BASE regression first.
      STAGE 2 (THE WRAPPER). m = 3 at (n, l) = (17, 6) on the RC-1 curve
      (A = 97044, B = 126251, #E = 4 x 32603, subgroup targets by the Stage-1
      rule of EXP-CERTBIN-4e92d7) and at (23, 8) on the Stage-1 curve: 100
      attempts per cell with the exact sat flag from the loop (C-LOOP), the
      per-node label at W_3 and W_4, ops per node, the certificate tree, and
      the loop's measured cost on the same attempts.
      STAGE 3 (reporting). Per cell: rung-versus-rate table with CP95, null
      and control counts, ops distributions (max beside mean), certificate
      sizes, the measured cost law and l* labelled extrapolation.
      OUTCOME TABLE. E-BOUNDED (r_4 >= 0.90 at (35,12) and (41,14), null at its
      counting rung, 0 refuted controls): the exponent law is supported at
      toy scale, H2 survives its first off-diagonal test, the record's
      target_complexity row is live as an asymptotic statement, and an
      (n, l) = (47, 16) and (53, 18) successor is the next gate. E-DRIFT or
      E-DECAY: the bounded-degree inner theory is closed on this ray with the
      rung-versus-cell table as the measured obstruction; the m = 2
      certificates are recorded as diagonal / overdetermination facts for
      exponent purposes; the wrapper is a constant-factor tool and is not
      pursued. ARTIFACT (any refuted satisfiable control, any failed
      certificate, C-BASE or C-LOOP mismatch, UNDETERMINED(budget) on more
      than 20 percent of a cell's instances at the primary rung): void.
      FALSIFICATION THRESHOLDS, FIXED NOW: E-BOUNDED is falsified iff
      r_4 <= 0.50 at (35,12) or (41,14); E-DRIFT is falsified iff the least
      refuting rung is <= 4 on >= 90 percent of instances at both of those
      cells.
      COST (estimate, order of magnitude): implementation medium (inner-instance
      builder from src/semaev_tree.py's descent, ladder driver, wrapper,
      certificate tree, about 500 lines on the RC-1 modules); compute: Stage 1
      minutes per instance up to (35,12), tens of minutes at (41,14), hours at
      (47,16) in the pure-Python engine (scaling the RC-1 timings by the cube
      of the column ratio; an estimate, not a measurement), total 10^1 to
      10^2 CPU-hours; Stage 2 about 1.3 x 10^4 inner closures of <= 3151
      rows, minutes to an hour.
    controls:
      - >-
        C-BASE: closure.py at (18, 4, 17) reproduces archived W_4 labels,
        iterations and dimensions on 15 archived RC-1 systems exactly.
      - >-
        C-LOOP: the wrapper's certificate multiset equals the (m-1)-loop's on
        20 attempts per wrapper cell.
      - >-
        Same-support null per cell, identical closure code path (hash
        recorded), least refuting rung reported with CP95.
      - >-
        Planted satisfiable inner instances: any refutation voids the
        instrument (Proposition S).
      - >-
        Deliberately easy control (inner system plus l random affine
        relations): must be refuted at every rung, else no absence of
        refutation is reportable.
      - >-
        Oracle A as the sole satisfiability ground truth; every counted
        refutation certified by the separate-process checker.
      - >-
        Seed control: the inner-target stream and the null draws are fixed by
        rule before any closure runs.
    required_metrics:
      - r_3, r_4, r_5 per cell with exact CP95, object and null separately
      - least refuting rung distribution per cell and arm
      - first iteration containing 1 per refuted instance
      - ops_to_1, ops_to_fix per instance (GF(2) 64-bit-word XOR operations) and their ratio
      - oracle A cost per inner instance (field operations) and the host conversion constant
      - per-attempt label histogram, cost law terms, loop cost on the same attempts (wrapper cells)
      - certificate sizes and separate-process check cost
      - termination_reason per closure (completed | UNDETERMINED(budget)); peak RSS
      - the Stage-0 table and the H2 crossover l*, labelled extrapolation

  falsification_conditions:
    - 'E-BOUNDED falsified iff r_4 <= 0.50 at (35,12) or (41,14) (verified refutations only).'
    - 'E-DRIFT falsified iff the least refuting rung is <= 4 on >= 90 percent of unsatisfiable inner instances at both (35,12) and (41,14).'
    - 'S_3-ABOVE-NULL at a cell falsified iff the null CP95 upper bound at W_4 reaches the object CP95 lower bound.'
    - 'The exponent reading is falsified at toy scale iff r_4 at (23,8) exceeds r_4 at (41,14) by more than 0.4 (decay) even if both exceed 0.5.'
    - 'The cost law is falsified iff the measured per-node C_W deviates from the size law by more than a factor 10 at any cell.'
    - >-
      Instrument falsified (run void) iff any satisfiable control is refuted,
      any submitted certificate fails, C-BASE or C-LOOP mismatches, or the
      easy control is not refuted; a void run says nothing (AGENTS.md rule 3).

  confounders:
    - >-
      OVERDETERMINATION: at l <= 8 on the ray n = 3l the inner null is refuted
      at degree 4 by counting, so a high r_4 there carries no structural
      content; only the W_3 rung and the l >= 10 cells can see structure.
      Stated in the mechanism so that a toy-cell r_4 near 1 is not read as
      E-BOUNDED.
    - >-
      TARGET DISTRIBUTION: inner targets u = x(R - P_3) are abscissae of
      full-group elements with P_3 in B; the certified cells used x(2E)
      subgroup targets and uniform field elements (c3a917's 600/600 covers
      arbitrary field elements). H1 carries this; the random-u arm measures
      it.
    - >-
      ONE CURVE PER n: curve, cofactor and modulus change together along the
      ladder; a second curve per n is the first replication owed and is not
      in this design.
    - >-
      ENGINE CONSTANTS: ops counters are engine-independent in GF(2) word
      operations but a compiled engine changes the constant of C_W, not the
      size law; the crossover l* moves with the constant and is labelled.
    - >-
      SATISFIABLE INNER INSTANCES run to fixpoint and then to oracle A; at the
      wrapper cells they are a 2^{2l-n-1} fraction and do not bias the
      per-class constants, but the MEAN per-attempt cost at l = 6, n = 17
      (inner P_sat about 2^-6) is not the mean at larger cells.
    - >-
      The m! symmetry of IDEA-20260904-3c7a91 is not used (each P_3 is
      enumerated once; the inner object handles the x_1 <-> x_2 symmetry
      implicitly); a symmetrised variant would halve the node count and is a
      constant.

  interpretation_limits:
    - >-
      CLAIM TIER toy. Nothing at n = 131 is measured; the l* and the
      2^{2n/3} row are extrapolations under H2 and are labelled so wherever
      they appear.
    - >-
      THIS DOES NOT TOUCH THE PRODUCT LAW ON ECC2K-130. At m = 3 the
      free-oracle floor 2^68.58 exceeds rho's 2^60.81 (KN-FIND-aa2efc,
      unreviewed), so no m = 3 oracle, this one included, reaches the
      challenge; at m = 4 the pipeline costs 2^{2l} C_W per attempt against a
      budget of 2^4.4 (or 2^11), dead by tens of bits. The record changes the
      per-attempt EXPONENT within the binary family, not the verdict on any
      deployed curve.
    - >-
      A W_D non-refutation is a degree-D statement, never a hardness claim; a
      refutation rate is not a solve.
    - >-
      Not evidence for or against Semaev's Assumption 1 as stated for the
      chained system: the inner object is m = 2 and the closure is a
      Macaulay-type closure, not an F4 step degree. It IS a direct test of the
      bounded-degree premise at m = 2 off the diagonal, which is the disputed
      territory of KR-IC-889857, and is labelled as such.
    - >-
      KN-OPEN-020's class of V is the scoped-out linear-subspace class; not
      escaped. Nothing transfers to prime fields (IDEA-20260930-ba8184 is the
      prime-field sibling) or to non-subspace bases.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Inner-target transfer.) The W_D refutation rate on unsatisfiable inner
        instances with target u = x(R - P_3), R uniform in the odd-order
        subgroup and P_3 uniform in B, equals the rate on uniform-x_R
        instances at the same (n, l, V, curve) to within 0.05.
      rigorous_support: >-
        None rigorous. Imitates the uniform-x_R arm of KN-FIND-c3a917
        (600/600 across three strata, no x(2E) modulation measurable at W_4);
        the rigorous ingredient is Proposition B of IDEA-20260926-917981 (the
        closure depends only on the set V and u), so the only free quantity
        is the distribution of u.
      validation_plan: >-
        SAMPLE at every ladder cell a random-u arm (u uniform in F_{2^n}, 30
        unsatisfiable instances) beside the inner-target arm; COMPARE rates by
        exact CP95 overlap; TAIL: report the least refuting rung's maximum
        over the inner-target arm against the random-u arm. TRANSFER: none
        beyond the tested cells.
    - id: H2
      statement: >-
        (Bounded refuting degree along the ray.) There is a constant D_0
        (claimed 4) such that, for the m = 2 S_3 descent with V = {deg < l}
        and n = 3l, the fraction of unsatisfiable instances with 1 in W_{D_0}
        is >= 0.9 for every l in the tested range, and -- as the extrapolation
        the exponent needs -- for all l.
      rigorous_support: >-
        Rigorous ingredient: W_D is sound (Proposition S) and its column count
        C(2l, <= D_0) is polynomial in l, so bounded D_0 gives a polynomial
        inner cost. Published statement imitated: the bounded last fall degree
        of Weil-descended systems independently of n (Huang-Kosters-Yeo as
        abstracted in KR-IC-fbdb61; recalled; conditions not checked), together
        with the two certified cells. Known failure: KN-FIND-c3a917 section 3
        shows plain M_4 persistence is FALSE between n = 17 and 19 (0.839 to
        0) while W_4 persistence held; KR-IC-889857 records the first-fall
        premise as disputed for the full systems. H2 is the assumption most
        likely to fail and the ladder is its test.
      validation_plan: >-
        SAMPLE the ladder cells (23,8), (29,10), (35,12), (41,14), (47,16)
        with 60 unsatisfiable inner instances each; COMPARE the least refuting
        rung against the null's counting rung per cell and against the
        constant-D_0 model; TAIL: report the maximum least-refuting rung per
        cell and the fraction UNDETERMINED(budget). Extrapolation to l = 44
        (n = 131) is stated as extrapolation everywhere; the (53, 18) cell is
        the next step if E-BOUNDED holds.
    - id: H3
      statement: >-
        (Poisson decomposition probability.) For uniform R the number of m = 3
        decompositions over B is Poisson with mean C(|B|+2, 3)/N, so the
        target count for 2^l relations is 6 x 2^{n - 2l} (1 + o(1)).
      rigorous_support: >-
        KN-FIND-007's conservation identity fixes the mean exactly; the
        Poisson half is the standard occupancy heuristic (Diem), with the
        concentration failure mode KN-FIND-007 measured for additive bases.
      validation_plan: >-
        SAMPLE the exact decomposition-count distribution by the loop at the
        wrapper cells (100 attempts each); COMPARE against Poisson by
        chi-squared on the count histogram; TAIL: maximum count per target.
        TRANSFER: through the conservation identity only.

  heuristic_note: >-
    Soundness and the counting table are exact; H3 is the standard yield
    heuristic; H1 and H2 carry every transfer, and H2 alone carries the
    exponent. The two-record rule applies: any conditional exponent statement
    downstream must cite H2 by number.

  target_complexity:
    time_exponent: >-
      Per attempt at m = 3: 2^{l} (1 + C_W) + (1 - r_4) 2^{2l} c_A, i.e.
      exponent l + O(log l) conditional on H2 (r_4 -> 1, D_0 = 4), against the
      loop's 2l (IDEA-20260904-96c4f3) and the SAT ceiling's 3l - log2 6.
      Relation collection at l = n/3: 6 x 2^{n-l} C_W = 2^{2n/3} poly(n) at
      poly memory, against 3 x 2^n (loop, poly memory), 2^{2n/3} (pair table,
      2^{2n/3} memory) and 0.886 x 2^{n/2} (rho). General m: 2^{n(1-1/m)},
      increasing in m, so m = 3 is the family optimum. NEVER BELOW n/2.
    memory_exponent: >-
      Polynomial: the W_4 working set is about n C(2l, <= 2) x C(2l, <= 4)
      bits plus the mutant stack; about 2.5 x 10^6 columns x 5 x 10^5 rows,
      1.2 x 10^12 bits (150 GB) at l = 44 (estimate from the size law), far
      above the loop's O(1) and far below the pair table's 2^{2l}. Disclosed.
    best_known: >-
      For the ECDLP, rho / van Oorschot-Wiener at 0.886 x 2^{n/2} with
      negligible memory. For the binary pdp step at poly memory, the loop at
      2^{(m-1) l}/(m-1)!. For relation collection in this family, the pair
      table at 2^{2n/3} time and memory (96c4f3 row D) and the batched
      enumerator of IDEA-20260905-79112a.
    hidden_overhead: >-
      C_W's constant: by the size law about 0.04 l^11 word operations at
      D = 4 (rows x rank x words with rows about 6 l^3, columns about
      (2l)^4/24; my arithmetic, measured per cell in Stage 1), which is
      2^55 at l = 44 -- so at n = 131 the pipeline costs about 2^99 per
      attempt against the loop's 2^88 and the exponent gain is not realised
      until l* about 50 (n about 150). The o(1) in the exponent hides this
      degree-11 polynomial and is stated rather than glossed. Also hidden:
      the Poisson half of H3, the engine constant, and the oracle A fallback
      on the (1 - r_4) fraction.
    tradeoff_note: >-
      Nodes of one attempt and attempts are embarrassingly parallel (2^l
      independent inner closures). The pipeline trades the loop's O(1) memory
      for polynomial memory; no van Oorschot-Wiener interpolation applies.
      The pair-table row is the natural comparator: same time exponent 2n/3,
      exponential memory there against polynomial here.

  estimated_cost:
    implementation: medium
    compute: medium
    qualification: >-
      Estimate. About 500 lines on the RC-1 modules and src/semaev_tree.py's
      descent (inner-instance builder, ladder driver, wrapper, certificate
      tree, oracle A). Compute 10^1 to 10^2 CPU-hours for Stage 1 up to
      (41,14) in the pure-Python engine, scaling RC-1's per-instance timings
      by the cube of the column ratio; (47,16) may need a compiled echelon.
      Not a measurement.

  asymptotic_claim:
    problem: binary-field pdp at m = 3 over a subspace factor base, per-attempt cost and relation-collection cost (RQ-ECDLP-f0a7b0; bears on RQ-SATIC-1ae57a (b))
    prior_best: loop at 2^{(m-1) l} per attempt and 3 x 2^n relation collection at poly memory (IDEA-20260904-96c4f3); SAT ceiling 2^{ml}/m!; pair table 2^{2n/3} at 2^{2n/3} memory
    time_exponent: 'per attempt: l + O(log l) conditional on H2 (D_0 = 4) against 2l; relation collection 2^{2n/3} poly(n) at poly memory; rho unchanged at 2^{n/2}'
    memory_exponent: polynomial (about 1.2 x 10^12 bits at l = 44, estimate)
    hidden_cofactor: a degree-11 polynomial in l with constant about 0.04 word operations; crossover l* about 50
    claim_kind: per_attempt_exponent_conditional_on_H2

  dominated_by: >-
    Checked row by row. On the ECDLP: rho / van Oorschot-Wiener at
    0.886 x 2^{n/2} dominates every row here on time and memory at every n
    (frontier rows KR-IC-1fcdbc, KR-IC-9e610d). On relation collection in
    this family: the pair-table row (2^{2n/3} time, 2^{2n/3} memory) ties the
    conditional time exponent at exponential memory, so neither dominates the
    other; the loop dominates on memory and loses on the conditional time
    exponent; the batched enumerator of IDEA-20260905-79112a (2^n/m! at
    memory m! 2^l) is dominated on time by the conditional row. At toy scale
    the loop dominates this record on every axis by orders of magnitude. On
    ECC2K-130 the product law (KN-FIND-aa2efc) closes m = 3 regardless. Not
