idea:
  id: IDEA-20260930-b26bbc
  question_id: RQ-ECDLP-f0a7b0
  added: '2026-10-01'
  status: proposed
  approved_by: null
  title: >-
    THE CERTIFIED m = 2 OBJECT AS THE INNER THEORY OF A CDCL(T)-STYLE
    DECOMPOSITION SEARCH: enumerate m - 2 legs by group arithmetic, decide the
    residual two-leg instance S_3(x_1, x_2, x(R - P_3)) = 0 by the
    degree-bounded mutant closure W_D that refutes 386/386 and 400/400 at
    m = 2 instead of by a 2^l loop, so the per-attempt exponent drops from
    (m-1) l to (m-2) l + O(log l) IF the refuting degree stays bounded along
    the ray n = 3 l; the off-diagonal persistence ladder is the cheapest
    discriminator, the m = 3 wrapper with per-node certificates is the second
  class: algorithm

  claim: >-
    OUTCOME CLASS (a), A SEARCH EXPONENT, with the escape from the SATIC
    ceiling named: the ceiling ml - log2|G| of IDEA-20260904-3c7a91 and the
    enumeration law (m-1) l of IDEA-20260904-96c4f3 and IDEA-20260926-b11cb1
    are statements about UNIT PROPAGATION and about DEGREE-1 (linear) closure
    of the restricted system; the inner decision proposed here is a DEGREE-4
    mutant closure (polynomial calculus with bounded degree and reuse of
    fallen polynomials), a strictly stronger theory, and the m = 2 certified
    results (KN-FIND-5a8d3e, KN-FIND-c3a917) are the program's own evidence
    that this theory refutes exactly the systems unit propagation and
    linearisation cannot. Representation class R1 (Boolean coordinates of the
    legs in a basis of V = {deg < l}); attack stage: the per-attempt
    decomposition solve. CLAIM TIER toy for anything measured. NO ATTACK; the
    product law of KN-FIND-aa2efc is NOT changed on ECC2K-130 (see below).

    THE ALGORITHM (m = 3; general m by induction on legs). Factor base
    B = {P : x(P) in V}, |B| about 2^l, closed under negation. For a target R:
    for each P_3 in B compute u = x(R - P_3) by one group operation (no
    root-finding; both signs are covered because -P_3 is also in B), and decide
    the INNER INSTANCE "is u the abscissa of P_1 + P_2 with P_1, P_2 in B",
    i.e. the Weil-descended Boolean system of S_3(x_1, x_2, u) = 0 in 2l
    variables and n equations of Boolean degree 2, by W_D (D = 3, 4) with a
    degree-disciplined wdag-v1 certificate on refutation and by the 2^l
    oracle A on the rare non-refuted or satisfiable inner instances. The
    inner instance IS the object of KN-FIND-5a8d3e / KN-FIND-c3a917 with the
    target x_R replaced by u = x(R - P_3): W_4 refuted every unsatisfiable
    instance there (386/386 at n = 17, l = 9; 400/400 subgroup and 600/600
    uniform-x_R at n = 19, l = 10), always at its first iteration, with
    certificates verified by author-independent code. Nothing in that finding
    was run at l = n/3 (the m = 3 regime) or beyond n = 19, and that is
    exactly what this record measures.

    THE EXPONENT, CONDITIONAL. Let C_W(n, l) be the cost of one inner W_D
    decision. Per attempt the pipeline costs 2^l (group op + C_W) +
    (1 - r_D) 2^l 2^l c_A, where r_D is the inner refutation rate. If r_D is
    near 1 and the refuting D is bounded along the ray n = 3l (heuristic H2),
    C_W is polynomial in l (W_4 columns C(2l, <= 4) = O(l^4); echelon about
    0.04 l^11 word operations by the size law below) and the per-attempt
    exponent is l + O(log l) against the loop's 2l: in the notation of
    IDEA-20260904-96c4f3 (E) the oracle exponent c moves from 1 to 1/2 at
    m = 3 (the tie with rho needs 1/4). Relation collection at l = n/3 then
    costs 6 x 2^{n - l} C_W = 2^{2n/3} poly(n) at POLYNOMIAL memory, against
    the loop's 3 x 2^n (poly memory), the pair-table row's 2^{2n/3} time at
    2^{2n/3} memory, and rho's 0.886 x 2^{n/2}. The new row ties the table
    row's time at poly memory and stays a factor 2^{n/6} poly above rho. At
    m >= 4 the same construction gives 2^{n(1 - 1/m)}, worse than m = 3, so
    the family's best row is m = 3 and never crosses n/2. The o(1) and the
    constants are stated in target_complexity; at n = 131 the constants
    dominate (crossover l* about 50 by the size law), so the exponent is
    asymptotic and the record says so.

    THE NULL LADDER AND THE THREE READINGS, DECIDED BY PREDEFINED COUNTS.
    E-BOUNDED: on the off-diagonal ladder (n, l) in {(23, 8), (29, 10),
    (35, 12), (41, 14)} the inner object is refuted by W_4 at rate >= 0.90
    (CP95) at every cell, including the cells where the same-support
    semi-regular null is NOT refuted at degree 4 (counting below), and no
    satisfiable inner control is ever refuted. E-DRIFT: the least refuting
    rung rises with the cell as the null's does (the inner object is
    generic-like; the refutation seen at n = 17, 19 was overdetermination,
    not structure) -- then C_W is 2^{Theta(l)} and NO exponent moves.
    E-DECAY: the W_4 rate falls with l at fixed rung below 0.5. Planted
    satisfiable inner instances (soundness, Proposition S of
    IDEA-20260923-5d0b8e: 0 refutations by theorem) and same-support random
    systems redrawn per inner instance are the null ladder; the deliberately
    easy control is the inner object plus l random affine relations in the
    2l unknowns, which every rung must refute.

    WHAT EACH OUTCOME MEANS. E-BOUNDED: the first measured sub-enumeration
    per-attempt law at m >= 3 in this program, with certificates; the m = 3
    row of the binary family moves from 2^n to 2^{2n/3} at poly memory
    (asymptotically, under H2), still above rho; the W_D theory becomes the
    one named structural ingredient that escapes the SATIC ceiling, and the
    object it needs is the m = 2 inner instance, not the full system. E-DRIFT
    or E-DECAY: the m = 2 refutation is a diagonal / overdetermination
    artifact for the purpose of exponents (KN-OPEN-3c8f51 item (B) answered
    negatively at ratio 3), the pipeline is a constant-factor tool at best,
    and the record closes the "bounded-degree inner theory" route with the
    measured rung-versus-cell table as its obstruction.

  mechanism: >-
    OBJECT FRAME. Representation R1 as above. The relation-search object is
    unchanged (Class I partial action under translation by factor-base
    elements, IDEA-20260806-c5d183); no group-structure claim is made. The
    solver-side tracked object is the LABEL of a depth-l node: for the prefix
    P_3 the pair (refuted at rung D | not refuted | satisfiable, certificate),
    and its aggregate over the 2^l nodes of an attempt. Operation set Sigma:
    restriction (fix one leg by group arithmetic, which is exact and loses no
    solution because B is closed under negation) followed by the D-bounded
    ring action of B = F_2[v]/(v_i^2 + v_i) on the inner ideal. TRICHOTOMY:
    coordinate-dependent in the weak sense of IDEA-20260926-917981
    Proposition B (the inner closure depends on the SET V and on u, not on
    the bases); it is a solver-side object and has no translation action to
    survive. LOSSY-PROJECTION TEST against Sigma: the label discards the
    inner system, the whole closure and the identity of P_3, keeping one
    symbol and one certificate; the discard is Sigma-compatible because W_D is
    by definition closed under the D-bounded action and the label is a
    deterministic function of (V, u, D); it is genuinely lossy because
    distinct prefixes with distinct inner systems collapse to the same label.
    The projection that FAILS the test and is not the object: the inner
    descended system itself, which loses nothing and is a change of
    coordinates on (V, u).

    WHY THIS ESCAPES THE CEILING WHERE THE OTHER RECORDS DO NOT. The SATIC
    ceiling mechanism (IDEA-20260904-3c7a91, e12b5a) is that the curve-carrying
    rows are inert to unit propagation and to XOR Gaussian elimination until
    the last block; IDEA-20260926-b11cb1 extends that to degree-1 closure of
    the restricted system (ideal-XG: leaf count 2^{(m-1) l + u*}). The
    inner-theory step here is degree 4 with mutants on the restricted system
    with ONE leg fixed, i.e. two free blocks. IDEA-20260905-24d827 claim (B)
    and IDEA-20260808-da1428 predict that a theory check with two free blocks
    costs at least a block's enumeration UNDER THE SEMI-REGULAR NULL; the
    m = 2 certificates show the real S_3 descent is far from semi-regular
    (dim(M_4 cap B_{<=3}) 964-978 against 323 for the null; 98-112 nontrivial
    degree-4 syzygies against 0; KN-FIND-5a8d3e section 2), which is precisely
    the loophole those two records leave open. IDEA-20260926-0d1d74 (B) prices
    the last-two-summands form with a gcd of degree 2^{l+1} and finds no
    exponent change; this record replaces that exponential univariate object
    by the 2l-variable Boolean system at bounded degree, which is where the
    exponent can move.

    WHY IT MIGHT FAIL, STATED SO THE TEST HAS TEETH. The certified cells sit on
    Semaev's diagonal n = 2l - 1 (l = 9, 10), where the inner system is
    square-ish. At l = n/3 it is overdetermined (n = 3l equations in 2l
    unknowns), and by counting alone the plain Macaulay matrix at degree 4 has
    n C(2l, <= 2) rows against C(2l, <= 4) columns, which exceeds the column
    count for l <= 8 (3151 vs 2517 at (23, 8)) -- so at the m = 3 toy cells
    the inner null is refuted at degree 4 by overdetermination, with no
    structure needed. The structural question is therefore ONLY visible (i) at
    rung D = 3 on the toy cells (221 rows vs 299 columns at (17, 6): the null
    is not refuted by counting), and (ii) at D = 4 on the ladder cells where
    rows fall below columns: 6119 vs 6196 at (29, 10), 10535 vs 12951 at
    (35, 12), 16687 vs 24158 at (41, 14), 24863 vs 41449 at (47, 16). The
    semi-regular reference D_reg of the null, from the Boolean series
    (1+z)^{2l}/(1+z^2)^n (first non-positive coefficient; my arithmetic,
    re-derived in Stage 0), is 4 at (12,17), (14,19), (16,23), (20,29) and 5
    at (24,35), (28,41), 6 at (32,47); it is 5 at the certified cell (18,17),
    reproducing KN-FIND-5a8d3e's stated reference. A bounded W_4 refutation
    at (35,12) and (41,14), where the null needs degree 5, is the structural
    signal; its absence is the obstruction.
    OFF-LIMITS COMPONENT DECLARED (docs/object-frame-ideation.md section 2): F2
    is the family; V = {deg < l} is inside KN-OPEN-020's scoped-out class and
    is not escaped. What is added beyond F2 as filed: the inner-theory
    decomposition of the search, the exponent law (m-2) l + O(log l)
    conditional on H2, the off-diagonal ladder as its discriminator, and the
    per-attempt certificate tree.

