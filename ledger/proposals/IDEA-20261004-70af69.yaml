  title: >-
    Multiplication by 18 has degree 324 and multiplication by 17 has degree 289
  class: measurement
  claim: >-
    Multiplication by 18 has degree 324. Multiplication by 17 has
    degree 289. Three hundred twenty-four exceeds two hundred
    eighty-nine by 35. The product of the two degrees is 93636. Their
    sum is 613. The gap is a map degree, not an ECDLP exponent and not
    the degree pair 289 and 256.
  mechanism: >-
    OBJECT FRAME. R3 is the multiplication endomorphism. The
    operation set is reading the degree, which is coordinate-dependent
    on the integer multiplier and is not a translation of a curve
    point. Eighteen squared is 324. Seventeen squared is 289. Two maps
    of degree 289 have gap 0 and product 83521. No point is mapped.
  novelty_status: unverified
