idea:
  id: IDEA-20260901-2f778b
  question_id: RQ-MLKEM-003
  goal_id: null
  goal_id_note: >-
    RQ-MLKEM-003's goals GOAL-MLKEM-003 and GOAL-MLKEM-004 are closed_at_budget.
    GOAL-MLKEM-004's terminal decision (DEC-20260805-0b3e11, read via the goal
    record) states that its instrument works, that the question stays
    answerable, and that a NULL OF THE RIGHT SHAPE was never run before belief
    in any of six batches. This record is built around such a null and its
    positive control, and it runs first on the archived 17,919 certified
    bgj1 dual vectors at dim 60 (EV-MLKEM-da9e3b) at zero sieve compute.
  added: '2026-09-01'
  proposed_by: idea-generator
  status: proposed
  title: >-
    THE CORRECT-CANDIDATE DUAL SCORE IS NOT A SUM OF N INDEPENDENT TERMS, IT IS
    N TIMES A FUNCTION OF THE INSTANCE'S ERROR NORM ALONE -- an exact
    isotropic-pool limit law Phi_d(||e||) with the sphere's characteristic
    function 0F1(; d/2; -t^2/4) -- so plot S/N against ||e||^2 across instances:
    the independence law predicts slope zero and the isotropic law predicts
    slope -2 pi^2 rbar^2 Phi / (d q^2). An i.i.d. Gaussian pool obeys the
    isotropic law by construction (the null of the right shape, and a known
    answer), a planted anisotropic pool obeys a computable deformation of it
    (the positive control), and the real sieve pool is the deliverable: the
    sign and size of the departure convert directly into a corrected sample
    count for MATZOV.Nf at reduced dimension, and into the height of the
    waterfall floor as a norm quantile.
  class: mechanism
  claim: >-
    (A) THE LAW, DERIVED THIS SESSION (elementary; probably known -- see
    novelty_screen). Let the dual pool be N vectors w_i in Z^d with norms r_i
    and directions u_i = w_i / r_i, and let the correct candidate's phase for
    the instance error e be <w_i, e> (the MATZOV score construction after
    modulus switching, up to the rounding term, which is carried as a
    correction below). The correct-candidate score is
    S(e) = sum_i cos(2 pi <w_i, e> / q). If the directions u_i are
    equidistributed on the sphere S^(d-1) -- the isotropic-pool limit -- then
    S(e) / N -> Phi(||e||) := (1/N) sum_i phi_d(2 pi r_i ||e|| / q), where
    phi_d(t) = E_{u uniform on S^(d-1)} cos(t u_1) = 0F1(; d/2; -t^2/4)
    = Gamma(d/2) (2/t)^(d/2 - 1) J_(d/2-1)(t), the characteristic function of
    one coordinate of a uniform point on the sphere. For large d,
    phi_d(t) ~ exp(-t^2 / (2 d)), so Phi(||e||) ~ exp(-2 pi^2 rbar^2 ||e||^2 /
    (d q^2)), which coincides with the independence law's mean
    abar = exp(-2 pi^2 rbar^2 sigma^2 / q^2) EXACTLY WHEN ||e||^2 = d sigma^2,
    the typical norm, and differs otherwise. The two laws therefore agree on
    the mean over instances and disagree on everything else: under the
    independence law S/N has instance-to-instance standard deviation
    1/sqrt(2N) and no dependence on ||e|| beyond the mean; under the isotropic
    law S/N has instance-to-instance standard deviation
    |dPhi/d||e||^2| * sd(||e||^2) = Phi * (2 pi^2 rbar^2 / (d q^2)) * sigma^2 sqrt(2 d),
    which is of order 1/sqrt(d), independent of N, and DOMINATES 1/sqrt(2N) as
    soon as N exceeds d. This is the rank argument in one line: the N phases
    <w_i, e> are a rank-d linear image of e and cannot be independent for
    N > d.
    (B) THE MEASURABLE CONSEQUENCE, PRE-REGISTERED AS A SLOPE. Across
    instances with fixed pool, regress S/N on ||e||^2. Independence law: slope
    0, residual sd 1/sqrt(2N). Isotropic law: slope
    -(2 pi^2 rbar^2 / (d q^2)) Phi(||e||), residual sd of order 1/sqrt(N) plus
    the pool's finite-N direction-sampling noise. At the archived pool
    (d = 60, q = 127, N = 17,919, rbar to be read from the archive) the
    predicted slope is a fixed number computable before the run, and
    1/sqrt(2N) = 0.0053 sets the resolution: a slope whose product with
    sd(||e||^2) exceeds 3 x 0.0053 = 0.016 is detectable at N = 17,919 in one
    pool. Under CBD/rounded-Gaussian errors at d = 60 with sigma^2 about 1,
    sd(||e||^2) is about sqrt(2 d) sigma^2 = 11, so the isotropic law predicts
    an S/N spread across instances of order 11 x |slope|, to be computed
    exactly in Stage 1 and compared to 0.016.
    (C) THE FLOOR AS A NORM QUANTILE. The distinguisher declares the correct
    candidate when N Phi(||e||) exceeds the wrong-candidate maximum, about
    sqrt(N ln D) for D candidates. Under the isotropic law the success
    probability at pool size N is P_e[ Phi(||e||) > sqrt(ln D / N) ], a
    quantile of the error-norm law, and the fraction of instances that never
    succeed at the largest pool the sieve can supply, N_max, is
    F = P_e[ Phi(||e||) <= sqrt(ln D / N_max) ]. This is KN-LIT-111's
    "waterfall-floor" phenomenon (relayed as unpredicted in KN-OPEN-016)
    written as a closed-form prediction; IDEA-20260816-725f05 hypothesises the
    floor is per-instance and this record says WHICH instances: those with
    large ||e||. F is computable from the CBD norm law before any run.
    (D) THE CLAIM, FALSIFIABLE. (i) On an i.i.d. Gaussian pool of matched
    norm profile, the measured slope equals the isotropic prediction within
    10 percent -- a known-answer gate, since the law is exact for that pool
    by construction. (ii) On a planted anisotropic pool (directions drawn
    with a fraction p of their mass in a fixed k-dimensional subspace), the
    slope equals the anisotropic deformation of the law, in which phi_d is
    replaced by the mixture characteristic function with the instance's
    subspace component -- a second known answer, and the demonstration that
    the instrument can SEE anisotropy. (iii) On the real bgj1 pool, the slope
    is EITHER within 10 percent of the isotropic prediction -- in which case
    the correct-candidate score law is a norm effect, not a sieve effect, the
    corrected N_required is computable offline from (d, rbar, the CBD norm
    law) alone, and the sign and size of its departure from MATZOV.Nf at
    d = 60 is the deliverable -- OR it departs by more than 10 percent, in
    which case the departure is a measured anisotropy of sieve output and
    Stage 3 measures it directly from the pool's direction distribution
    without any scoring at all.
    (E) NOT CLAIMED. No statement about ML-KEM security, no attack, no verdict
    on dual-versus-primal (DEC-20260803-64b55b's obstruction stands: nothing
    here differences two estimator callables). Toy tier: d = 60, q = 127.
  mechanism: >-
    STAGE 0, THE LOSSY-PROJECTION TEST. The underlying state is the pool
    (N vectors in Z^d) and the instance (e). The tracked object is the pair
    (empirical direction measure of the pool, ||e||), coarsened to the scalar
    curve Phi and the per-instance point (||e||^2, S/N). It discards every
    vector's identity, all N labels, the lattice, and the error's direction.
    The discard is compatible with the operation because, for an isotropic
    pool, S/N depends on e only through ||e|| (the sphere average is
    rotation-invariant) and on the pool only through the norm profile; the
    fibre over (Phi, ||e||) is every rotation of e and every re-labelling of
    the pool, none of which changes S. It is not a change of coordinates: the
    pool is not recoverable from a curve. The projection is DELIBERATELY
    blind to sieve geometry -- that is its design: the isotropic law is the
    null hypothesis "the sieve pool is, for scoring purposes, a random
    isotropic pool of its own norms", and the i.i.d. Gaussian arm is the null
    object of exactly that shape.
    STAGE 1, ZERO-COMPUTE DERIVATIONS AND PRE-REGISTRATION. (a) The exact
    phi_d and its large-d asymptotic; the anisotropic mixture version. (b)
    From the archived pool's norm profile {r_i} (EV-MLKEM-da9e3b, dim 60,
    q = 127), the predicted Phi curve, the predicted slope, the predicted
    instance spread, the resolution 1/sqrt(2N), and the predicted floor F for
    the archived instance family's error law -- all written down and
    committed BEFORE any score is computed (the pre-registration
    IDEA-20260807-aea945 also demands and GOAL-MLKEM-004 never had). (c) The
    rounding correction: after modulus switching the phase carries an extra
    term <w_i, round-off>; it is a second isotropic average and is folded into
    Phi as a convolution, with its size stated.
    STAGE 2, THREE ARMS, ONE PIPELINE. For each arm draw 2000 instances e from
    the archived error law and compute S(e)/N against the arm's pool:
    ARM-N (null of the right shape): N i.i.d. Gaussian vectors in R^d with
    norms resampled from the archived pool's norm profile, so the norm
    profile matches exactly and only the directions differ; ARM-P (positive
    control): the same with a planted anisotropy of declared (k, p);
    ARM-R (real): the archived certified bgj1 pool, re-verified for dual
    membership by integer arithmetic as EV-MLKEM-da9e3b did. Regress S/N on
    ||e||^2 per arm; report slope, intercept, residual sd, and the empirical
    per-instance success curve against the threshold sqrt(ln D / N) for
    D = p^k_fft in the archived design.
    STAGE 3, THE DIRECTION-ONLY MEASUREMENT (no scoring). Compute the pool's
    empirical direction distribution's second and fourth moment tensors
    against the isotropic values (I/d and the isotropic fourth moment); the
    anisotropy excess is the quantity that must explain any ARM-R departure
    in Stage 2, and it is measured WITHOUT reference to any candidate or
    score -- the "measurable with no scoring" discipline EV-MLKEM-ba6c25's red
    team introduced.
    STAGE 4, THE READOUT. Under whichever law ARM-R follows, compute the
    N_required for the archived design's declared success probability and
    compare with MATZOV.Nf's closed form at the same (d, q, rbar, sigma); report
    the signed difference in bits at d = 60, the predicted floor F against the
    measured never-succeeds fraction, and the transfer statement (H2) with
    its scaling variable t = 2 pi rbar ||e|| / q.
  novelty_status: unverified
  novelty_screen:
    corpus: >-
      Read this session: GOAL-MLKEM-003 and GOAL-MLKEM-004 in full (batch logs
      and terminal next_actions); IDEA-20260807-aea945 in full;
      IDEA-20260805-5a4409, IDEA-20260808-0eb075, IDEA-20260816-ba5bd8 heads;
      IDEA-20260816-725f05 claim and tracked object via grep; EV-MLKEM-018 in
      full; catalogue M1-10 and its TO-GRAM object; KN-OPEN-016, KN-TECH-039,
      KN-LIT-7664, KN-LIT-7665. The corpus attacks the independence law on the
      ACROSS-CANDIDATE axis (5a4409 Parseval, 0eb075 N_eff, ba5bd8 rank) and by
      ABLATION on the real pool (GOAL-MLKEM-004 batches 2-6, aea945's
      successor), and records that "an ensemble of iid Gaussian vectors ...
      reproduces the excess" (EV-MLKEM-b43de0, via the goal record) without
      stating the law that makes that reproduction a prediction rather than a
      surprise. No record writes the correct-candidate score as N Phi(||e||),
      pre-registers a slope against ||e||^2, or derives the floor as a norm
      quantile.
    web: >-
      No web query specific to this record succeeded within the session's
      network policy. The nearest external work is RECALLED: Ducas and Pulles,
      "Accurate score prediction for dual-sieve attacks" (2023), which this
      subagent believes derives the score distribution conditioned on the
      secret norm with Bessel functions -- i.e. this record's law. KN-LIT-7664
      (Li-Zheng 2026, abstract in corpus) models the same dependence
      parametrically through normally distributed cosines between dual
      vectors, which is the second-moment shadow of the isotropic law.
    verdict: >-
      UNVERIFIED, and likely KNOWN as mathematics: the law is elementary and
      the Ducas-Pulles 2023 recollection, if correct, contains it. The
      program-level contribution is not the law but the DESIGN it licenses --
      an i.i.d. null that is a known answer rather than a coin flip, a planted
      positive control with a computable deformation, and a pre-registered
      slope with a stated resolution -- run on a pool the program already
      holds. That is exactly the shape GOAL-MLKEM-004's closure says it
      lacked, and it is what makes the record's negative outcomes informative.
  object_first_candidate:
    tracked_object: >-
      The pair (pool direction measure, instance error norm), coarsened to
      the curve Phi and the per-instance point (||e||^2, S/N), followed from
      the pool and the instance through the score to a regression slope and a
      floor quantile.
    established_families_off_limits: >-
      Off-limits as the primary lens: (1) estimator differencing
      (DEC-20260803-64b55b's named obstruction); (2) ad hoc score statistics
      and near-miss/uniform candidate-group contrasts (the six refuted
      observables of GOAL-MLKEM-004, as 5a4409 also declares); (3) the
      across-candidate second moment (5a4409, 0eb075); (4) the ordinal rank
      (ba5bd8); (5) the per-instance success-curve floor as an empirical
      object (725f05) -- this record supplies its closed form and is a
      predictor of it, not a re-measurement. The lens here is the
      correct-candidate score as a function of the instance norm.
    genuinely_new_or_repackaging: >-
      As mathematics, a repackaging of the rank-d observation that Ducas and
      Pulles made and that the program has rediscovered by ablation. As a
      design, new to this corpus: a null whose answer is forced, a positive
      control whose deformation is computable, and a slope pre-registered
      with its resolution before the archived pool is scored.
    concretely_testable: >-
      Yes, at zero sieve compute: the archived pool exists, the null and
      positive-control pools are numpy draws, and the regression is O(N) per
      instance.
    survival_score: >-
      The object survives exactly as long as the pool is isotropic enough
      that S/N is a function of ||e|| alone; it dissolves when direction
      structure matters, and Stage 3 measures the dissolution directly. Both
      outcomes are stated in advance as reportable.
  null_object_control: >-
    ARM-N: N i.i.d. Gaussian vectors with the archived pool's norm profile
    resampled exactly. It is the null of the right shape because the
    hypothesis under test is "the sieve pool behaves, for the correct-candidate
    score, like an isotropic pool of its own norms", and ARM-N is that object
    with the sieve removed and nothing else changed. Its answer is FORCED (the
    law is exact for it in the N -> infinity limit and its finite-N deviation
    is computable), so it is a gate: an instrument that fails to recover the
    predicted slope on ARM-N within 10 percent is broken, and no ARM-R number
    is reported. The canonical artifact tell: the slope's product with
    sd(||e||^2) must NOT decay as N grows within ARM-N (it is N-independent
    under the isotropic law), while the residual sd MUST decay as 1/sqrt(N);
    a residual that fails to decay is an artifact of the score computation.
  discriminated_from:
    - >-
      IDEA-20260805-5a4409 tracks the FFT table T and its Parseval energy,
      i.e. the ACROSS-CANDIDATE second moment forced by bin collisions; this
      record tracks the CORRECT-candidate score as a function of the instance,
      an axis 5a4409 explicitly leaves aside. They compose: 5a4409 fixes the
      wrong-candidate noise floor, this record fixes the correct-candidate
      signal law, and N_required needs both.
    - >-
      IDEA-20260808-0eb075 computes the effective number of independent
      CANDIDATE scores from the Fourier support of the score polynomial; this
      record's rank argument is about the N phases of one candidate being a
      rank-d image of e. Different object (candidates vs vectors), opposite
      direction of correction (0eb075 attacker-favourable, this record
      instance-dependent with a floor).
    - >-
      IDEA-20260816-725f05 hypothesises a per-instance floor and proposes to
      measure the success curve P(success | N) as a bit matrix; this record
      PREDICTS the floor's height and which instances sit under it from the
      norm law, so that 725f05's measurement has a pre-registered curve to
      test rather than a shape to discover. If 725f05 runs first its matrix
      is the data this record's Stage 4 fits.
    - >-
      IDEA-20260807-aea945 opens GOAL-MLKEM-004's successor with an m-sweep of
      the 4-9 percent residual and a coupling-preserving ablation; its object
      is the RESIDUAL and its controls are ablations. This record's object is
      the LAW and its controls are known answers. aea945's coupling-preserving
      ablation (keep y = A^T x mod q, destroy sieve geometry) is, in this
      record's terms, a pool whose direction measure has been randomised at
      fixed coupling -- exactly ARM-N with the lattice membership retained --
      and the two records would share that arm.
    - >-
      Catalogue M1-10 (uncommitted) asks whether the pool/candidate
      interaction is separable, using the Gram spectrum; this record uses the
      direction measure (the Gram's spectral shadow) as a predictor of one
      specific law, with a planted control M1-10 does not have.
    - >-
      KN-LIT-7664 (Li-Zheng) predicts the score variance from normally
      distributed cosines between dual vectors -- a parametric second-moment
      model. This record's law is the exact isotropic average; the normal-
      cosine model is its large-d Gaussian approximation and the two should
      agree at d = 60 to within the approximation's error, which Stage 1
      computes and Stage 2 checks as a by-product.
  citations:
    - ref: "KN-LIT-111 (Ducas, Pulles, Does the dual attack work? Crypto 2023), as recorded in KN-OPEN-016 and KN-TECH-039"
      provenance: kb
      claim: >-
        The dual-sieve family's independence heuristics contradict theorems in
        some regimes; an unpredicted "waterfall-floor" phenomenon was confirmed
        experimentally. Used as the phenomenon this record's clause (C) writes
        in closed form.
      verified_by: "idea-generator subagent, 2026-09-01: KN-OPEN-016 and KN-TECH-039 read in full; the paper itself not read by this program per those entries."
    - ref: "L. Ducas, L. Pulles, Accurate score prediction for dual-sieve attacks (2023 preprint)"
      provenance: recalled
      claim: >-
        Believed to derive the dual-attack score distribution conditioned on
        the secret/error norm using Bessel-type sphere averages, i.e. the law
        of clause (A). NAMED SO A REVIEWER CAN CHECK; if confirmed the law is
        `known` and this record's contribution is the design only.
      verified_by: null
    - ref: "KN-LIT-7664 (Li, Zheng, Unified dual attack analyses: covariance-based score distribution prediction, ePrint 2026/1048)"
      provenance: kb
      claim: >-
        Independence assumption is flawed; the cosine of the angle between
        distinct short vectors is normally distributed and is used to estimate
        the covariance between contributions. The second-moment shadow of the
        isotropic law.
      verified_by: "idea-generator subagent, 2026-09-01: corpus entry read in full; paper not read."
    - ref: "EV-MLKEM-da9e3b (GOAL-MLKEM-004 BATCH-d2a728): 17,919 certified g6k bgj1 dual vectors at dim 60, q = 127"
      provenance: internal
      claim: >-
        A certified archived pool with dual membership verified by integer
        arithmetic, reproducible end-to-end by both reviewers; the ARM-R input.
      verified_by: "idea-generator subagent, 2026-09-01: read as summarised in GOAL-MLKEM-004's batch_log; the evidence file itself was not opened."
    - ref: "EV-MLKEM-b43de0 / EV-MLKEM-ba6c25 (GOAL-MLKEM-004 batches 3 and 4)"
      provenance: internal
      claim: >-
        An i.i.d. Gaussian ensemble reproduces the observed excess; the red
        team derived excess = sqrt(1 + rho) with rho measurable without
        scoring; both arms sit 7-9x BELOW the i.i.d. prediction. These are the
        observations this record's law explains as a norm effect and predicts
        in advance.
      verified_by: "idea-generator subagent, 2026-09-01: via GOAL-MLKEM-004 batch_log summaries only."
    - ref: "Characteristic function of a coordinate of the uniform distribution on S^(d-1): phi_d(t) = Gamma(d/2) (2/t)^(d/2-1) J_(d/2-1)(t) = 0F1(; d/2; -t^2/4)"
      provenance: recalled
      claim: >-
        Standard identity (e.g. any treatment of the Funk-Hecke formula or of
        spherical Bessel transforms); its large-d limit exp(-t^2/(2d)) follows
        from u_1 ~ N(0, 1/d). Verified numerically in Stage 1 by quadrature
        against direct Monte Carlo on the sphere before use.
      verified_by: null
  assumptions:
    - >-
      A1. The archived pool's phase construction (which vector components
      multiply which instance components after modulus switching) can be
      reconstructed exactly from EV-MLKEM-da9e3b's archived script, so that
      the "e" in clause (A) is the same object the campaign scored. If the
      archived construction differs (e.g. a k_fft block that the campaign
      never instantiated, per IDEA-20260805-bb7668), the record uses the
      no-FFT score and says so.
    - >-
      A2. The archived error law is known (GOAL-MLKEM-004 recorded
      centred-binomial secret and rounded-Gaussian error); the CBD norm
      distribution is computed exactly by convolution, not approximated.
    - >-
      A3. The rounding term after modulus switching is small enough at
      q = 127 to be carried as a convolution correction to Phi; its size is
      stated in Stage 1 and, if it exceeds 10 percent of the predicted slope,
      the record's resolution claim is downgraded accordingly.
  proof_search_map:
    bottleneck: >-
      Whether the correct-candidate score's instance dependence is carried by
      ||e|| alone (isotropic law) or also by the pool's direction structure.
      Removing that ambiguity converts MATZOV.Nf's N from an independence
      artefact into a computable function of (d, rbar, norm law) -- or names
      the anisotropy that prevents it.
    baseline_embedding:
      parameter_slice: >-
        N <= d with an orthonormal pool (w_i = r e_i): the phases are then
        genuinely independent coordinates of e and the independence law is
        EXACT. This is the boundary case of both laws.
      reproduction_check: >-
        Symbolic: for an orthonormal pool the isotropic average over
        directions is replaced by the empirical average over d axes, and for
        Gaussian e both laws give the same S/N distribution. Numeric: the
        pipeline on an orthonormal pool must return slope 0 and residual sd
        1/sqrt(2N) to sampling error before any other arm is run.
    observation_collision:
      observable: "The regression slope of S/N on ||e||^2 and the residual sd, per arm."
      distinct_preimage_search: >-
        Two pools with different direction structure but the same second
        moment tensor give the same slope under the large-d approximation;
        they are separated by the exact phi_d (which uses all moments) and
        by Stage 3's fourth-moment tensor. Two error laws with the same
        E||e||^2 but different spread give the same intercept and different
        detectability; the record reports sd(||e||^2) beside every slope.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The score written as N times the sphere average of cos(t u_1), a
          model in which "independence" is the statement that the pool's
          direction measure is a sum of d point masses at the axes and
          "isotropic" is the statement that it is uniform; the real pool's
          measure is a third object whose moments Stage 3 measures.
        predicted_gain: >-
          A one-parameter family (isotropic to axis-concentrated) inside
          which MATZOV.Nf's law is the extreme point, so that the correction to
          N is a position on a curve rather than a yes/no on a heuristic.
      - transform: telescoping_potential
        proposed_object: >-
          The per-instance success indicator charged against the norm
          quantile: instances are ordered by ||e||, and the floor is the
          quantile at which the ordered success probability crosses 1/2.
        predicted_gain: "A pre-registered floor height F from the norm law alone, testable against the never-succeeds fraction."
    quantifier_order: >-
      FOR EACH arm (N, P, R) with ITS OWN pool held fixed, and FOR the 2000
      instances drawn from the archived error law, THERE EXISTS a fitted
      slope with a 95 percent interval; the CLAIM is about the slope's
      agreement with the arm's pre-registered prediction. It is NOT a claim
      that the isotropic law holds for every sieve pool, nor at any dimension
      other than 60, nor for the FFT-with-k_fft variant unless A1 says the
      archived design instantiated one.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At d = 60, q = 127, on the archived certified bgj1 pool, the
        correct-candidate score's dependence on the instance is [within 10
        percent of / departs by X from] the isotropic norm law, the
        corresponding N_required differs from MATZOV.Nf's by Y bits with sign
        Z, and the measured never-succeeds fraction is W against the predicted
        floor F." It cannot certify dual-versus-primal, cannot certify any
        FIPS 203 quantity, and cannot certify the law for a pool it has not
        scored.
      nearby_object_control: >-
        ARM-P at (k, p) chosen so that its predicted slope differs from the
        isotropic one by exactly 3 x the resolution: the method must
        DISTINGUISH ARM-P from ARM-N. If it cannot, a 3-sigma anisotropy in
        the real pool is invisible to it and every ARM-R "agreement" is
        reported as agreement-within-blindness.
    proof_obligations:
      - claim: "The orthonormal-pool slice returns slope 0 and the independence sd."
        responsibility: baseline
      - claim: "ARM-N returns the isotropic slope within 10 percent, and its residual sd decays as 1/sqrt(N) while the slope does not."
        responsibility: correctness
      - claim: "ARM-P is distinguished from ARM-N at its declared 3-sigma deformation."
        responsibility: strictness
      - claim: "The phase construction matches the archived script and the rounding correction is stated."
        responsibility: interface
      - claim: "N_required is computed under both laws at the same (d, q, rbar, sigma) and reported as a signed difference in bits."
        responsibility: success_probability
      - claim: "No FIPS 203 or dual-versus-primal statement is made."
        responsibility: scope
  predictions:
    - metric: "Slope of S/N on ||e||^2, ARM-N, 2000 instances, archived norm profile"
      direction: lower
      minimum_effect: "negative, within 10 percent of the pre-registered isotropic prediction; residual sd within 20 percent of 1/sqrt(2N) = 0.0053 (plus the computed finite-N direction-sampling term)."
    - metric: "Slope of S/N on ||e||^2, ARM-P at declared (k, p)"
      direction: different
      minimum_effect: "differs from ARM-N's by at least 3 x the resolution, in the pre-computed direction."
