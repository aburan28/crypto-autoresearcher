  heuristic_assumptions:
    - id: H1
      statement: >-
        For a saturated bgj1 pool at d = 60, the empirical direction measure
        of the dual vectors is isotropic to within second and fourth moments
        at the level 1/sqrt(N) of the isotropic values, so that S/N depends on
        the instance through ||e|| alone up to a term of order 1/sqrt(N).
      rigorous_support: >-
        Rigorous ingredient: for a lattice ball, the second-moment tensor of
        the full set of lattice points inside a sphere converges to the
        isotropic tensor as the count grows (a consequence of the lattice
        point-count asymptotic with error terms), and a saturated sieve pool
        approximates that set at the 50 percent saturation ratio. The
        classical statement imitated is the equidistribution of directions of
        lattice points in large balls. The heuristic is that a HALF-saturated
        pool selected by a sieve's dynamics inherits the equidistribution.
      validation_plan: >-
        Stage 3: compute the second and fourth moment tensors of the archived
        pool's directions and of ARM-N; report the Frobenius excess over the
        isotropic values for each, with the 1/sqrt(N) scale beside it. TAIL
        CHECK: the largest eigenvalue deviation of the second-moment tensor
        and the most anisotropic direction, reported. Extension at d in
        {50, 70} with fresh pools tests the d-trend. Sampled parameters
        recorded.
    - id: H2
      statement: >-
        The correct-candidate law and its floor depend on (d, rbar, ||e||, q)
        only through the scaling variable t = 2 pi rbar ||e|| / q and d, so
        that results at d = 60 transfer to other (rbar, q, sigma) at the same
        d by rescaling and to other d through the exact phi_d.
      rigorous_support: >-
        Rigorous ingredient: phi_d is exactly a function of t and d, so under
        H1 the scaling is exact. The classical statement imitated is the
        scale invariance of the sphere average. Transfer in d is NOT claimed
        beyond the tested values.
      validation_plan: >-
        At d = 60, rescale the archived error law (two further sigma values)
        and check that the measured slope collapses onto one curve in t;
        report the collapse residual. Fresh pools at d = 50 and 70 (extension
        budget) test the d-dependence against the exact phi_d. TRANSFER
        ASSUMPTION to FIPS dimensions: NONE asserted.
  target_complexity:
    time_exponent: >-
      No new algorithm; a correction to an existing cost model's input. The
      dual attack's cost under MATZOV.Nf is 2^(0.292 beta + ...) with N set by
      the independence law; this record replaces N by N_required(d, rbar, norm
      law) and reports the signed bit difference at d = 60. No exponent is
      moved and none is claimed.
