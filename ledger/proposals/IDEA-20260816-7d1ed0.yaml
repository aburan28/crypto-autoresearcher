idea:
  id: IDEA-20260816-7d1ed0
  question_id: RQ-RSA-d46f02
  added: '2026-08-16'
  title: 'Completeness is the property the method actually sells: enumerate by exhaustion every root
    inside the declared window at moduli small enough to do so, and measure what fraction of them
    the implemented pipeline returns, at the window boundary and inside it.'
  class: control
  claim: '(A) The distinctive property of a small-root method, as this repository records it in KN-TECH-015,
    is not merely that it finds a root but that it is COMPLETE within its bound: it certifiably lists
    every root in the window, which resultant-style elimination does not. Every downstream use of
    the method inherits that property, and this repository has never tested it. Define the completeness
    rate C as the fraction of ground-truth roots inside a declared window that the implemented pipeline
    actually returns, where ground truth is obtained by exhaustive enumeration over the window at
    moduli small enough to permit it. (B) The claim is that C is strictly below 1 near the window
    boundary for the implemented pipeline even where the theoretical guarantee holds, and that the
    deficit is attributable to the READ-OFF stage rather than to the lattice: the pipeline takes a
    bounded number of short vectors and extracts common roots, and a root whose certificate lives
    in a vector outside that bound is silently lost. (C) The claim is that the deficit is measurable,
    that it grows as the window approaches the bound, and that it directly explains part of the shortfall
    entry one will measure - so that a fraction of what looks like a reach deficit is in fact a completeness
    deficit in the extraction step, and the two can be separated by measurement rather than argued
    apart. (D) WHAT IS NOT CLAIMED: no attack and no security consequence; no assertion that the method''s
    completeness property is false, since a property of the method under an exact shortest-vector
    oracle is not the same as a property of an implementation with a bounded read-off, and a measured
    deficit is a statement about the implementation; no claim that the deficit is unavoidable, since
    taking more vectors is an obvious remedy whose cost is exactly what the measurement prices; and
    no claim about windows or constructions other than those tested.'
  mechanism: 'Stage 1: fix a modulus size small enough that the entire window can be enumerated -
    concretely a window of at most 24 bits so that exhaustion is at most sixteen million evaluations.
    Stage 2: for each instance, enumerate every integer in the window and test it exactly against
    the target congruence, producing the complete ground-truth root set, which is a decidable object
    requiring no lattice at all. Stage 3: run the implemented pipeline with its declared read-off
    bound, collect the roots it returns, and compute C as the size of the returned set intersected
    with ground truth, divided by the size of ground truth. Stage 4: sweep the window size from well
    inside the theoretical bound out to and past it, and report C against window size. Stage 5: sweep
    the read-off bound - the number of short vectors used - at fixed window, and report C against
    that bound, which prices the remedy. Refutation route: if C equals 1 everywhere inside the bound,
    the implementation is complete as advertised and the entry closes with that clean positive control,
    which is a genuinely useful instrument-validity result for the whole bucket rather than a null
    finding.'
  novelty_status: unverified
  novelty_screen:
    method: 'Base bucket screen. Additionally: grep -ril ''exhaustion'' over ledger/proposals/ (30
      files) and ''ground truth'' (44 files), reading matching lines; re-read KN-TECH-015''s Method
      section, which states the completeness-within-bound property explicitly; grep -rih for ''complete'',
      ''all roots'', ''certified-complete'' across ledger/proposals/ and knowledge/techniques/.'
    results: Exhaustion and ground truth are common design elements in the corpus, used mostly in
      ECDLP toy-scale runs and in the xedni coefficient-bound controls, always to certify a single
      answer rather than to certify a COMPLETE SET. KN-TECH-015 is the only record that states the
      completeness property, describing the method as certifiably finding every root in the window
      and naming that as the property resultant elimination lacks; it records no test of it. IDEA-20260808-e2315e
      measures whether a planted root is recovered, a single-root success criterion, and says nothing
      about the other roots in the window. No record in the corpus defines a completeness rate.
    verdict: 'UNVERIFIED. Nothing asserted about external literature. Claimed new relative to this
      repository: the completeness rate C as a measured quantity, its attribution to the read-off
      bound rather than the lattice, and the pricing of the remedy by sweeping the number of short
      vectors used. Assembled from known parts: the completeness property as stated in KN-TECH-015,
      exhaustive enumeration as already used elsewhere in this program for ground truth, and the paired-instance
      measurement discipline of this bucket.'
  object_first_candidate:
    tracked_object: The ROOT SET inside the window - the complete set of integers in the window satisfying
      the target congruence - carried as a set rather than as a single element, together with the
      subset the pipeline returns.
    lossiness: 'Genuinely lossy, and lossy in an unusual direction. The full state is the entire lattice,
      its reduced basis and every polynomial the read-off could form. The tracked object retains only
      two finite sets of integers, the ground-truth root set and the returned set, discarding every
      intermediate polynomial and every vector. That discard is compatible with the target operation
      - widening the window, or raising the read-off bound - because both sets are defined identically
      at every parameter and their comparison is a plain set operation. What it discards that matters
      is named: WHICH vector certified each returned root is not retained by the set projection, and
      that is exactly the attribution the claim needs, so the certifying vector index is recorded
      per returned root as a secondary variable rather than dropped.'
    propagation: One step of the target operation is widening the window by one bit at fixed read-off
      bound, or raising the read-off bound by one vector at fixed window. Widening the window strictly
      grows the ground-truth set, roughly doubling it, while the read-off's capacity to certify roots
      does not grow, so C should fall. Raising the read-off bound can only grow the returned set,
      so C is non-decreasing in it. The object propagates as a pair of nested sets whose ratio moves
      in opposite directions under the two operations, which is what makes the attribution to the
      read-off testable rather than assumed.
    survival_score: 'The root-set object survives while exhaustion is affordable, which caps the window
      at about 24 bits, and while the ground-truth set is large enough for a rate to be meaningful,
      which requires the window to contain at least several roots. It dissolves when the window is
      so narrow that the ground-truth set is usually a single element, at which point C degenerates
      to the ordinary success indicator and carries nothing new. Concretely: expected informative
      for windows containing between roughly four and several thousand roots.'
  null_object_control: 'The identical measurement runs against a null in which the target congruence
    is replaced by a random congruence of the same degree and modulus with NO planted structure. Ground
    truth is still computed by the same exhaustion, so the null has a genuine root set of its own,
    typically small and unstructured. The null must show that the pipeline returns a fraction of the
    null root set that is indistinguishable from zero, since there is no small-root structure to exploit;
    a pipeline that achieves a high completeness rate on random congruences is returning window elements
    by a route unrelated to the construction, and every C in the signal arm is void. A second control
    is the trivial-window arm: a window narrow enough that exhaustion returns exactly one root, where
    C must be exactly 1 whenever the pipeline succeeds at all, which self-tests the set comparison
    code.'
  discriminated_from:
  - 'Entry one of this bucket: measures whether the planted root is recovered, a single-root criterion.
    This entry measures how many of ALL roots in the window are returned, which entry one''s criterion
    cannot see, and the two together separate a reach deficit from a completeness deficit.'
  - 'KN-TECH-015: states the completeness-within-bound property as a feature of the method. This entry
    tests whether an implementation delivers it, and explicitly distinguishes a property under an
    exact oracle from a property of a bounded read-off.'
  - 'Entry eight of this bucket (exact region partition): computes where guarantees hold symbolically.
    This entry measures what an implementation returns where they hold, and is the natural executable
    companion to that symbolic work.'
  - 'The xedni coefficient-bound controls elsewhere in this repository: those bound coefficients of
    a constructed object and are already completed under a different question; they do not enumerate
    a solution set or measure a completeness rate.'
  - 'A generic recall measurement in a search task: the object here is a mathematically defined complete
    root set obtained by exhaustion, not a labelled dataset, and the null arm is a random congruence
    rather than a shuffled label set.'
  assumptions:
  - Exhaustive enumeration over a window of at most 24 bits terminates within the per-instance cap
    using exact integer arithmetic.
  - The target congruence's root set inside the window is the correct ground truth for completeness,
    which is true by definition of the window but requires the window to be declared exactly.
  - The pipeline's read-off bound is an explicit parameter rather than an internal constant; if it
    is not, it must be exposed before this contract can run.
  - Root sets of size at least four are obtainable at some window size within the exhaustion limit,
    otherwise the rate degenerates.
  predictions:
  - metric: completeness rate C at a window near the theoretical bound, at the default read-off bound
    direction: lower
    minimum_effect: 1.0
  - metric: C as the window widens at fixed read-off bound
    direction: lower
    minimum_effect: No pre-committed slope. The direction is the pre-commitment; the rate at which
      completeness degrades is the measurement.
  - metric: C as the read-off bound is raised at fixed window
    direction: higher
    minimum_effect: 0.0
  - metric: completeness rate on the random-congruence null
    direction: lower
    minimum_effect: 0.0
  - metric: C in the trivial-window arm where exhaustion returns exactly one root
    direction: different
    minimum_effect: 1.0
  minimal_test:
    design: 'Fix a modulus size at which a 20-bit window is comfortably enumerable, and fix one construction.
      Choose three window sizes: well inside the theoretical bound, at it, and just past it. At each,
      generate 40 seeded instances, enumerate the complete ground-truth root set by exhaustion, run
      the pipeline at its default read-off bound, and compute C together with the certifying vector
      index for each returned root. Then hold the middle window fixed and sweep the read-off bound
      over four values. Run the random-congruence null and the trivial-window self-test in the same
      invocation. This discriminates because a single window at the bound with 40 instances already
      decides whether C is below 1, because the read-off sweep immediately attributes any deficit
      to the extraction step or refuses to, and because the trivial-window arm validates the set-comparison
      code before any rate is believed. Expected cost: exhaustion dominates at roughly a million evaluations
      per instance, which is minutes, plus ordinary reduction time.'
    controls:
    - Random-congruence null with its own exhaustively computed root set, same invocation.
    - Trivial-window self-test where the ground-truth set has exactly one element and C must be 1
      on success.
    - Certifying vector index recorded per returned root, so attribution to the read-off is measured
      rather than inferred.
    - Paired instances shared across window sizes and read-off bounds.
    - Exact verification that every returned root actually satisfies the congruence, so that a returned
      set is never larger than ground truth by containing spurious elements.
    required_metrics:
    - completeness rate C per window size and read-off bound, with exact binomial interval over instances
    - ground-truth root-set size per instance, from exhaustion
    - returned-set size and its intersection with ground truth
    - count of spurious returned elements, required to be zero
    - certifying vector index distribution per returned root
    - exhaustion wall time and reduction wall time per instance, and peak resident memory
  falsification_conditions:
  - 'C equals 1 at every window size including past the theoretical bound: the implementation is complete
    as advertised and the central claim is refuted, which is a clean positive instrument-validity
    result for the bucket.'
  - 'The random-congruence null achieves a high completeness rate: returned roots are not coming from
    the construction and every C is void.'
  - 'The trivial-window arm reports C other than 1 on a success: the set-comparison code is wrong
    and all rates are void.'
  - 'Any spurious returned element appears: the pipeline is returning integers that do not satisfy
    the congruence, which is a verification failure that must be fixed before any rate is reported.'
  - 'C does not increase when the read-off bound is raised: the deficit is not attributable to the
    read-off and the claimed mechanism is refuted, leaving the deficit unattributed and reportable
    as such.'
  confounders:
  - Root-set size varies across instances, so an average rate can be dominated by instances with many
    roots; C is reported both as a per-instance mean and as a pooled ratio, and the two are compared.
  - The read-off bound may interact with reduction quality, since weaker reduction yields fewer usable
    vectors; the reducer is pinned and entry seven is the dedicated control for that interaction.
  - Widening the window changes the construction's own feasibility as well as the root-set size, so
    a falling C past the bound conflates two effects; the analysis is therefore restricted to windows
    inside the bound for the attribution claim and reports the past-bound windows separately.
  - Exhaustion cost grows exponentially in window width, so the widest windows have the fewest instances;
    sample size per window is reported and intervals reflect it.
  - Duplicate roots or roots at window endpoints can be counted inconsistently; the window is declared
    half-open and the enumeration and the pipeline use the identical convention, checked by the trivial-window
    arm.
  interpretation_limits:
  - A measured deficit is a property of this implementation and its read-off bound, not of the method,
    and specifically not a claim that the completeness property recorded in KN-TECH-015 is false.
  - Completeness is measured only where exhaustion is affordable, at windows of at most 24 bits, and
    no claim is made about wider windows.
  - The attribution to the read-off holds only to the extent that raising the read-off bound recovers
    the deficit, which the sweep tests directly and may refute.
  - Nothing here concerns deployed RSA, any attack, or any security consequence.
  target_complexity:
    time_exponent: No attack exponent is claimed. Exhaustion costs 2^w congruence evaluations for
      a window of w bits and that is stated exactly, as the price of ground truth rather than as any
      attack; the pipeline's own cost is measured and reported separately.
    memory_exponent: No attack memory exponent is claimed. Exhaustion is constant-memory by construction
      and the pipeline's peak resident memory is reported beside time.
    best_known: The incumbent is the completeness property as asserted in KN-TECH-015, that the method
      certifiably finds every root in the window, recorded with confidence established and never tested
      here. The incumbent measurement of an implementation's completeness rate is that none exists
      in this repository.
    hidden_overhead: The read-off bound is usually an unexamined constant inside an implementation,
      and exposing it is the hidden engineering cost; the hidden analytical cost is the convention
      for window endpoints, which silently changes root-set sizes by one and would move every rate
      if the enumeration and the pipeline disagreed.
  dominated_by: 'n/a (no result claimed). No solver or attack point is proposed, so no time, memory
    or query frontier row applies. Stated plainly rather than as null: no frontier rows were checked
    because there is no claimed result to place on one.'
  sota_delta: No attack; conceptual and measurement contribution only. The deliverable is a completeness
    rate with its attribution and the priced remedy, against a repository state in which the completeness
    property is asserted in a technique note and has never been measured.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Exhaustion producing complete ground-truth root sets within cap at 20-bit
    windows: 0.9. The trivial-window self-test passing: 0.9. C strictly below 1 at a window near the
    bound: 0.6, since a bounded read-off losing some certificates is plausible but a well-written
    pipeline may take enough vectors. C rising when the read-off bound is raised, confirming the attribution:
    0.65, conditional on a deficit existing at all. The random-congruence null behaving: 0.9. The
    whole entry returning the clean positive result that the implementation is complete: 0.35, and
    that outcome is valuable rather than disappointing, since it would license every other entry in
    this bucket to treat single-root success as sufficient.'
