idea:
  id: IDEA-20260809-82c5f5
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-WFS-e776b6
  goal_id: GOAL-WFS-001
  title: >-
    Transcript completeness across a composition boundary: when one proof is
    verified inside another, whose transcript is the challenge derived from?
  class: composition
  claim: >-
    Composed and recursive arguments verify an inner proof inside an outer one,
    and the outer challenges must bind the inner transcript for the composition to
    inherit soundness. The claim is that the composition boundary introduces
    omission classes that do not exist in either protocol alone — the inner
    statement, the inner parameters, the inner proof itself — and that each admits
    a constructive forgery in a reference composition.
  mechanism: >-
    Build a two-level reference composition where an outer protocol's verifier
    checks an inner proof. Parameterize which inner values enter the outer
    challenge derivation, and construct forgeries for each omission by choosing
    inner values after the outer challenge is fixed.
  why_not_a_renamed_known_approach: >-
    Composition soundness is studied theoretically. The specific claim that the
    BOUNDARY creates new omission classes, enumerable and constructively
    falsifiable in a reference implementation, is what this record proposes to
    test, and it is where a criterion validated on single-level protocols would
    silently fail.
  predictions:
  - observable: number of boundary-specific omission classes with constructive forgeries
    metric: count
    predicted: >-
      At least two beyond the single-level classes. None would mean composition
      inherits transcript requirements straightforwardly, which is a reassuring
      and useful structural result.
  - observable: whether the static criterion from IDEA-20260809-7c0817 catches them
    metric: false accepts at the boundary
    predicted: >-
      Some false accepts, because the criterion's dataflow view may stop at the
      boundary. Finding out is the point, and a criterion that survives
      composition is much stronger evidence for its usefulness.
  minimal_test: >-
    Reference two-level composition, boundary omissions enumerated, forgeries
    constructed, and the static criterion run over each configuration to record
    its errors.
  controls:
  - 'SINGLE-LEVEL ANCHOR: both protocols must be sound in isolation under the canonical transform before composition is tested.'
  - 'COMPLETE-BOUNDARY CONTROL: with all inner values bound into the outer challenge, no forgery may be constructible.'
  falsification_conditions:
  - No boundary-specific class admits a forgery.
  - Forgeries appear even with the complete boundary, indicating a defect in the composition implementation rather than an omission effect.
  interpretation_limits: >-
    Reference implementations only, deliberately weakened, labelled as such. No
    recursive proof system in use anywhere is examined, named or characterized.
  sota_delta: 'Delta: a class of omissions specific to composition, with artifacts, and a stress test for the criterion that is the goal''s main research output.'
  dominated_by: Downstream of IDEA-20260809-792aca and 7c0817; not dominated by any corpus record.
  estimated_cost: Implementation high; compute low.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for recursion / composition soundness: no records. WEB NOT CHECKED.'
  source_refs:
