idea:
  id: IDEA-20260809-53f9a5
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ROS-595c15
  goal_id: GOAL-ROS-001
  title: >-
    Signature aggregation has the same linear shape as blind signing — test
    whether ROS-style structure survives in half-aggregation
  class: composition
  claim: >-
    Aggregation schemes that combine many Schnorr signatures into a shorter object
    do so with transcript-derived coefficients, which is structurally the same
    defence that multi-nonce constructions use against ROS. The claim is that the
    analogy is exact enough to be tested: an aggregation scheme whose coefficients
    are not transcript-derived admits a ROS-style attack, and the reference
    implementation can demonstrate the boundary with a certificate.
  mechanism: >-
    Implement a half-aggregation scheme with the coefficient derivation as a
    parameter, then run the ROS solver against the aggregate verification
    equation, which is linear in the component signatures exactly as the blind
    signing equation is linear in the session values.
  why_not_a_renamed_known_approach: >-
    Aggregation security is analysed in its own literature. Testing it with the
    ROS solver — treating aggregation as another instance of the same linear
    structure — is a transfer this program can perform cheaply because the solver
    already exists from IDEA-20260809-47bb6d.
  predictions:
  - observable: forgery against the non-transcript-derived variant
    metric: boolean plus certificate
    predicted: Exists. Absence would mean the structural analogy fails and would be worth understanding, since it would identify a property aggregation has that blind signing lacks.
  - observable: forgery against the transcript-derived variant
    metric: boolean within declared budget
    predicted: None within budget, matching the design intent.
  minimal_test: >-
    Implement both variants, run the solver against each with declared budgets,
    emit certificates where found, and verify aggregate signatures with an
    independent verifier.
  controls:
  - 'HONEST-AGGREGATION CONTROL: aggregates of honest signatures must verify in both variants before any attack is run.'
  - 'COMPONENT-VERIFICATION CONTROL: a forged aggregate must be checked to see whether its components individually verify, since an aggregate forgery that decomposes into valid components is a different and weaker statement.'
  falsification_conditions:
  - No forgery against the non-transcript-derived variant.
  - Forged aggregates decompose into individually valid signatures, meaning no aggregation-specific claim is supported.
  interpretation_limits: >-
    Reference implementations only, with the weakened variant labelled. No claim
    about any published aggregation scheme is made or implied.
  sota_delta: 'No attack. Delta: a tested structural analogy that either extends the solver''s reach to a second setting or identifies why it does not.'
  dominated_by: Downstream of IDEA-20260809-47bb6d; not dominated by any corpus record.
  estimated_cost: Implementation medium; compute low.
  recommended_priority: low
  novelty_status: unverified
  novelty_screen: 'Corpus grep for aggregation: no records. WEB NOT CHECKED.'
  source_refs:
  - Half-aggregation references -- RECALLED, REQUIRED READS, NOT LOCATED.
