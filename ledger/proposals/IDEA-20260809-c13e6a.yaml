idea:
  id: IDEA-20260809-c13e6a
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-HYBRID-cdf2b2
  goal_id: GOAL-HYBRID-001
  title: >-
    Establish the component baseline first: what does ML-KEM alone bind under
    adversarially generated keys, with certificates
  class: measurement
  claim: >-
    Every combiner's binding row is a function of what its post-quantum component
    binds on its own. The claim is that ML-KEM's binding behaviour under
    ADVERSARIALLY generated keys — as opposed to honestly generated ones — can be
    established here with literal certificates or with derivations from the
    specification's key-derivation inputs, and that getting this wrong would
    poison every later cell in the goal's table.
  mechanism: >-
    Instantiate ML-KEM from FIPS 203, validate against its test vectors, and for
    each binding property attempt to construct two distinct (key, ciphertext)
    pairs producing the same shared secret, exploiting the freedom an adversary
    has when it generates the key itself rather than following the honest
    procedure.
  why_not_a_renamed_known_approach: >-
    ML-KEM's binding behaviour has been analysed publicly and this record does not
    claim the analysis. It claims the ARTIFACTS inside this program, produced
    against a vector-validated implementation, because the goal's table cannot
    rest on a property nobody here has checked.
  predictions:
  - observable: existence of a certificate for each binding property under adversarial key generation
    metric: boolean per property
    predicted: >-
      Certificates exist for the properties that depend on the key being honestly
      formed, and derivations rule out the rest. A property whose status cannot be
      settled either way is recorded as undetermined rather than assumed.
  - observable: certificate verification by a second implementation
    metric: boolean per certificate
    predicted: Accepts; otherwise nothing is recorded.
  minimal_test: >-
    Implement ML-KEM, pass the FIPS 203 vectors, attempt each property's
    certificate within a declared class, verify with a second implementation, and
    report the per-property outcome including undetermined cells.
  controls:
  - 'TEST-VECTOR PRECONDITION before any certificate attempt.'
  - 'HONEST-KEYGEN CONTROL: with honestly generated keys the same constructions must fail, isolating adversarial key generation as the enabling condition.'
  falsification_conditions:
  - The implementation fails the specification vectors.
  - Certificates appear with honest key generation, indicating a defect rather than a binding property.
  interpretation_limits: >-
    A binding failure is not a confidentiality break and no record may present it
    as one. All keys are self-generated; no deployed implementation is examined.
  sota_delta: 'No attack. Delta: the component baseline this program needs before any combiner row can be filled.'
  dominated_by: Externally dominated by the published component analyses, stated plainly. Not dominated by any corpus record; the ML-KEM goals concern hardness, not binding.
  estimated_cost: Implementation medium; compute negligible.
  recommended_priority: high
  novelty_status: known
  novelty_screen: 'Corpus grep for binding / combiner: no records; ML-KEM records concern core-SVP and dual attacks. WEB NOT CHECKED.'
  source_refs:
  - FIPS 203 -- REQUIRED READ, NOT YET READ.
  - KEM binding taxonomy references -- RECALLED, REQUIRED READS.
