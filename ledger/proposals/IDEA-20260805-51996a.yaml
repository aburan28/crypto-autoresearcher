idea:
  id: IDEA-20260805-51996a
  question_id: RQ-ECTD-001
  goal_id: GOAL-ECTD-001
  added: '2026-08-05'
  title: >-
    Hidden correspondences between elliptic curves collapse to isogenies:
    an Albanese-functoriality closure of GOAL-ECTD-001 priority family (3),
    with all four escape routes named and the genus escape costed to a
    p^{1/2} loss before any compute

  class: mechanism

  claim: >-
    GOAL-ECTD-001 lists "hidden correspondences" as priority family (3) and has
    produced no idea, hypothesis or experiment for it in two batches. The reason
    it has produced none may be that the family, AS STATED, does not exist as a
    distinct object: for a correspondence C contained in E_1 x E_2 between two
    elliptic curves, with both projections finite, the induced map on degree-zero
    divisor classes is psi_C = pi_{2*} o pi_1^* in Hom(Jac E_1, Jac E_2) =
    Hom(E_1, E_2), and every action of C on a discrete-logarithm instance -- a
    statement about the group Pic^0 -- factors through psi_C. Modulo trivial
    correspondences (E_1 x {q} and {P} x E_2, which induce zero), the group of
    correspondences IS Hom(E_1, E_2). So a "hidden correspondence" trapdoor
    between elliptic curves over F_p is a secret ISOGENY trapdoor written in
    other notation: it is priority family (1)/(2) and inherits their bounds,
    including IDEA-20260805-4243e6's class-mass cap.
    THIS IS A CLOSURE AT THE INVENTOR-PROTOCOL SECTION 4 STANDARD, NOT A FATIGUE
    REPORT: it names the obstruction (Albanese functoriality on a product of
    curves), gives the argument, and enumerates FOUR escape routes with a cost or
    a named blocker attached to each -- of which one, the reversed construction
    E1-E4 below, is an exponent-moving object that this campaign has never
    considered and that lies just outside RQ-ECTD-001's declared scope.

  object_first_candidate:
    tracked_object: >-
      THE CORRESPONDENCE CLASS [C] in Corr(E_1, E_2) / (trivial correspondences),
      followed through the transport of a DLP instance: a point P on E_1, its
      fibre pi_1^{-1}(P) as a divisor on C, the pushforward pi_{2*} of that
      divisor to E_2, and its class in Pic^0(E_2). What is tracked is the
      geometric object C, not the arithmetic map it induces -- that separation is
      the entire content, because the test below shows the two carry the same
      information.
    established_families_off_limits: >-
      Off-limits as the primary lens: Semaev / summation-polynomial index
      calculus; Groebner and Macaulay solving-degree meters; Pollard rho /
      kangaroo / BSGS; MOV / Frey-Ruck; anomalous trace-1 transfer; GLV/GLS;
      xedni and lifting. GHS / Weil descent is NOT off-limits and is not used as
      a lens either -- it appears only as the named blocked escape E2, because
      the whole question is what survives when the subfield GHS needs is absent.
    newness_score: >-
      The mathematics (correspondences on a product of curves induce
      homomorphisms of Jacobians) is nineteenth-century and certainly not new.
      What is new to this corpus is pointing it AT the campaign's own priority
      family (3) and getting a closure with forward guidance instead of an
      unattempted lane. Novelty is claimed for the application only.
    testability_score: >-
      The headline is a one-page algebraic argument with a cheap computational
      confirmation available at toy p in pure Python (no Sage in this container,
      verified). The escape-route costs are arithmetic tables.
    survival_score: >-
      The tracked object survives exactly as far as the target has dimension one.
      It dissolves the moment E_2 is replaced by a higher-genus curve, and
      NAMING WHERE IT DISSOLVES is the useful half of the record.

  lossy_projection_identifiability_audit:
    projection: >-
      A correspondence C contained in E_1 x E_2, with its genus, its ramification
      data and its bidegree (d_1, d_2) = (deg pi_1, deg pi_2)  -->  the single
      induced homomorphism psi_C in Hom(E_1, E_2), i.e. an isogeny (possibly
      composed with a translation from the base-point choice), or zero.
    what_is_discarded: >-
      The geometry of C entirely: its genus, its singularities, its ramification,
      and every part of the bidegree not visible in deg psi_C.
    why_genuinely_lossy: >-
      Genuinely lossy as a map of geometric objects -- many non-isomorphic curves
      C give the same psi_C.
    why_compatible_with_the_operations: >-
      Fully compatible: pi_1^* and pi_{2*} are functorial on Pic^0, so psi_C
      propagates deterministically under composition of correspondences
      (psi_{C o C'} = psi_C o psi_{C'} up to the standard conventions).
    is_it_only_a_change_of_coordinates: >-
      THIS IS THE FINDING, AND IT IS THE CANONICAL FAILURE. Checked against the
      KN-LIT-7595 failure mode ("nothing discarded, so nothing gained", the
      (Delta, Pi) = (x xor y, x*y) example in characteristic 2): FOR THE PURPOSE
      AT HAND, THE PROJECTION LOSES NOTHING. A DLP instance lives in Pic^0, every
      operation a correspondence can perform on it factors through psi_C, and
      Corr(E_1, E_2)/trivial is ISOMORPHIC to Hom(E_1, E_2). The discarded
      geometry of C is invisible to the group, exactly as the discarded ordering
      of {x, y} is invisible once t^2 + Delta t + Pi recovers the pair. The test
      returns FAIL, on paper, at zero compute -- which is what the test is for,
      and the FAIL is the deliverable rather than a reason to abandon the record.
      The mirror failure (projection constant across instances) was also checked
      and is ABSENT: psi_C varies over Hom(E_1, E_2) with real spread, which is
      why the confirmation experiment below can actually fail.

  mechanism: >-
    DERIVED IN THIS RECORD. Standard algebraic geometry, RECALLED and re-derived;
    no theorem number, page, author, or venue is asserted.

    THE COLLAPSE. Let X, Y be smooth projective curves over a field k and let C
    be a curve with finite maps pi_1: C -> X and pi_2: C -> Y (equivalently, an
    irreducible curve in X x Y dominating both factors). Pullback of divisors
    along pi_1 and pushforward along pi_2 are both defined on divisors and both
    preserve degree-zero-ness after the standard normalisation, so
        psi_C := pi_{2*} o pi_1^* : Pic^0(X) -> Pic^0(Y)
    is a homomorphism of abelian varieties, i.e. an element of
    Hom(Jac X, Jac Y). The trivial correspondences X x {q} and {x} x Y induce the
    zero map (a fibre of the first projection is a whole copy of Y, pushing
    forward to a fixed degree-zero-normalised class independent of the input).
    Quotienting by them, Corr(X, Y)/trivial embeds in Hom(Jac X, Jac Y), and for
    curves it is standard that this is an isomorphism.
    SPECIALISE X = E_1, Y = E_2 elliptic. Then Jac E_i = E_i, so
        Corr(E_1, E_2)/trivial  =  Hom(E_1, E_2),
    whose nonzero elements are exactly the isogenies E_1 -> E_2 (and, forgetting
    base points, isogenies composed with translations). Over F_p, taking
    F_p-rational correspondences gives F_p-rational homomorphisms, hence
    F_p-isogenies -- which is the only kind that transports an F_p-DLP anyway.

    CONSEQUENCE FOR THE CAMPAIGN. A trapdoor of the shape "the designer knows a
    secret correspondence from E_pub to a weak E_s, the public does not" is a
    trapdoor of the shape "the designer knows a secret isogeny", with the SAME
    endpoint set (the F_p-isogeny class), the SAME hiding budget
    H(4p - t^2) = O(sqrt(p) log p), and therefore the SAME zero-exponent margin
    derived in IDEA-20260805-4243e6. Priority family (3) is not a third lane.

    THE FOUR ESCAPES, EACH WITH A COST OR A NAMED BLOCKER. The collapse used
    dim Jac = 1 on BOTH sides and k = F_p. Break one:

    E1 -- TARGET OF GENUS g >= 2. Take C in E x X with X of genus g. Then
    psi_C: E -> Jac X lands in a g-dimensional abelian variety. The order-N
    subgroup carrying the DLP is unchanged, so matched rho still costs
    1.2533 sqrt(N) ~ 1.2533 sqrt(p). The best known index calculus on
    Jac X(F_p) for FIXED g >= 2 is Gaudry's Otilde(p^{2 - 2/g})
    [RECALLED-UNVERIFIED; stage 0 of any successor must check the exponent
    before it is used], which is >= p for every g >= 2. FORCED VALUE, arithmetic:
        cost(index calculus on Jac X) / cost(rho on E)  >=  p^{2 - 2/g} / (1.2533 p^{1/2})
                                                        >=  0.80 * p^{1/2}   at g = 2,
    i.e. the transfer LOSES at least a factor p^{1/2} and loses more as g grows.
    So E1 is dominated at every fixed genus and needs no experiment to reject.
    IT IS NOT DEAD ASYMPTOTICALLY: for g growing with log p the subexponential
    regime Otilde(L_{p^g}(1/2)) would apply and could in principle fall below
    p^{1/2}. The blocker there is CONSTRUCTIVE, and it is the honest open lane:
    the only known mechanism producing genus growing with the security parameter
    is Weil restriction, which is E2. A prime-field analogue of GHS -- a
    construction giving g ~ log p over F_p itself -- is not known to this record
    and its non-existence is NOT claimed.

    E2 -- CHANGE THE BASE FIELD (WEIL RESTRICTION / GHS). BLOCKED BY A NAMED
    STRUCTURAL FACT, not by fatigue: F_p has no proper subfield, so there is no
    Weil restriction to perform. This is the same fact RQ-ECTD-001's motivation
    already records, restated here as the reason E1's asymptotic escape has no
    known vehicle.

    E3 -- TARGET AN ABELIAN SURFACE THAT IS NOT A JACOBIAN. Then psi_C maps into
    an object with no known index calculus. That helps the ADVERSARY not at all,
    and it helps the DESIGNER not at all either, because the trapdoor holder's
    advantage must come from a DLP that is EASIER somewhere, and "no known
    attack" is the opposite of what the holder needs. Recorded as a dead branch
    with its reason, and the reason is not "we screened it".

    E4 -- REVERSE THE DIRECTION. THE ONE OBJECT WORTH TAKING FURTHER. Publish a
    genus-2 curve C/F_p whose Jacobian secretly SPLITS, up to an (n,n)-isogeny,
    as E_1 x E_2. Generic attacks on Jac C(F_p), of order ~p^2, cost ~p; the
    holder pushes the instance to E_1 x E_2 and pays 2 * 1.2533 sqrt(p). PRIVATE
    ADVANTAGE p^{1/2} IN THE EXPONENT -- an exponent-moving trapdoor shape, which
    is what docs/target-result-profile.md asks the program to prefer. Two honest
    caveats stated in the same breath. (i) SCOPE: this is a genus-2 trapdoor,
    and RQ-ECTD-001's scope block names "ordinary short-Weierstrass curves over
    prime fields" -- so it must be raised to the Coordinator as a scope question,
    NOT smuggled into an ECTD record. (ii) SECURITY: the whole design reduces to
    the DETECTABILITY of the split, i.e. whether the Igusa invariants of C lie on
    the Humbert surface of the corresponding discriminant, which is a computable
    condition for small n [RECALLED-UNVERIFIED and explicitly a thing to check,
    not a thing to assert]. NOTE how cleanly this instance illustrates
    IDEA-20260805-4243e6's reframing: the design question is again the RECOGNITION
    cost of the hidden structure, not its rarity.

  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-05'
    corpus_paths_grepped:
      - ledger/goals/GOAL-ECTD-001.yaml
      - ledger/questions/RQ-ECTD-001.yaml
      - ledger/proposals/IDEA-20260731-016.yaml
      - ledger/proposals/IDEA-20260731-017.yaml
      - ledger/proposals/IDEA-20260731-018.yaml
      - ledger/proposals/IDEA-20260801-004.yaml
      - ledger/hypotheses/H-ECTD-001.yaml
      - experiments/EXP-ECTD-001/specification.yaml
      - knowledge/literature/KN-LIT-7261.md
    grep_results:
      - >-
        GOAL-ECTD-001's objective names "hidden correspondences" as priority (3).
        Zero ECTD ideas, hypotheses or experiments address it after two batches.
      - >-
        No ECTD record contains the words correspondence, Albanese, Jacobian,
        Humbert, or (n,n)-isogeny in a technical sense.
    conclusion: >-
      Classical mathematics applied to an unattempted lane of this campaign.
      The novelty screen sees almost nothing external: KN-OPEN-3f7a21 records
      that 95% of this corpus's 7,809 literature entries are bulk-seeded with
      absent backing artifacts, so "no prior work does X" is unsupportable here
      and is not asserted.

  assumptions:
    - >-
      A DLP instance on E is a statement about the group Pic^0(E)(F_p). Any
      "transport" of it along a geometric object must act on that group. If a
      proposed trapdoor transports something other than a group element, the
      collapse argument does not apply and the record says so rather than
      stretching.
    - >-
      Correspondences are taken with both projections finite (dominating both
      factors). Degenerate configurations are the trivial correspondences, which
      are quotiented out and which appear as the null arm of the test.
    - >-
      Base points are fixed; otherwise psi_C is determined only up to translation,
      which does not affect DLP transport.

  predictions:
    - metric: >-
        COLLAPSE AGREEMENT RATE: fraction of sampled points P on E_1 at which the
        divisor-theoretic transport pi_{2*} pi_1^*(P - O) agrees, as an element of
        E_2(F_p), with the isogeny found independently by exhaustive search in
        Hom(E_1, E_2)
      direction: higher
      minimum_effect: >-
        EXACTLY 1.000 -- agreement at 100 percent of at least 10^4 sampled points
        across at least 20 constructed correspondences at p in {101, 251, 1009}.
        FORCED BEFORE ANY RUN. A SINGLE DISAGREEMENT FALSIFIES THE COLLAPSE AND
        WOULD BE THE MOST VALUABLE OUTCOME AVAILABLE FROM THIS RECORD, because it
        would mean family (3) is a genuine third lane after all.
    - metric: >-
        GENUS-ESCAPE COST RATIO: p^{2 - 2/g} / (1.2533 p^{1/2}) at
        g in {2, 3, 4, 5} and p in {2^20, 2^30, 2^40, 2^56}
      direction: higher
      minimum_effect: >-
        >= p^{1/2} at every cell, i.e. >= 2^10 at p = 2^20 and >= 2^28 at
        p = 2^56. Pure arithmetic, zero compute, no fitted parameter. The table
        is the rejection of E1 at fixed genus and it is stated in full so a
        reviewer can attack the recalled exponent 2 - 2/g rather than the
        conclusion.
    - metric: >-
        TRIVIAL-CORRESPONDENCE NULL: psi_C evaluated on the correspondence
        E_1 x {q} union {P_0} x E_2
      direction: different
      minimum_effect: >-
        EXACTLY the zero map, on 100 percent of sampled points. Derived before
        the run. If the implementation returns anything else, the pushforward is
        mis-defined and no result from the treatment arm may be reported.

  minimal_test:
    design: >-
      Three stages, cheapest first; stage 1 can terminate the line.
      STAGE 1 (pen and paper, zero compute, DECISIVE): write the collapse
      argument in full and hand it to an independent reviewer with the single
      instruction "find a correspondence between elliptic curves that transports
      a DLP instance in a way psi_C does not". If the reviewer succeeds, the
      closure is void and family (3) reopens as a real lane.
      STAGE 2 (pure Python, minutes, at p in {101, 251, 1009}): build at least 20
      explicit F_p-rational correspondences C in E_1 x E_2 -- as graphs of known
      isogenies of degree 2, 3, 5, as unions and composites of those, and as
      curves cut out by an explicit bivariate polynomial with both projections
      finite -- and for each compute psi_C on at least 500 points by enumerating
      the fibre and summing the image in E_2. Compare against exhaustive search
      of Hom(E_1, E_2) at these tiny sizes. Report the agreement rate.
      STAGE 3 (arithmetic, zero compute): the genus-escape cost table, the E2
      blocker statement, and the E4 write-up as a scope question addressed to the
      Coordinator.
    controls:
      - >-
        NULL OBJECT OF THE SAME SHAPE, DERIVED FORCED VALUE, CAN ACTUALLY FAIL:
        the trivial correspondence E_1 x {q} union {P_0} x E_2. FORCED VALUE
        psi_C = 0, derived before the run. It fails whenever the pushforward is
        implemented with the wrong degree normalisation, which is the single most
        likely implementation error in this experiment -- so it is a real null,
        not a decoration.
      - >-
        POSITIVE CONTROL WHERE THE EFFECT MUST APPEAR: the correspondence taken
        to be the graph of a KNOWN isogeny phi of degree ell in {2, 3, 5},
        constructed from Velu's formulae at toy p. psi_C MUST equal phi exactly,
        on every sampled point. IF IT DOES NOT, THE INSTRUMENT IS BROKEN AND NO
        NEGATIVE MAY BE REPORTED FROM ANY ARM.
      - >-
        GRADED CONTROL, >= 3 INTERIOR POINTS, MONOTONICITY REPORTED: composites
        of k known isogenies for k = 1, 2, 3, 4, 5. FORCED: deg psi_C is the
        product of the degrees, so it grows geometrically. Report deg psi_C
        against the forced product at each k. A degree that fails to grow with k
        is the canonical artifact tell -- a quantity that does not respond to the
        parameter meant to move it -- and it localises the error to the
        composition step rather than leaving "it did not work".
      - >-
        ORDERING CONTROL: the null arm and the positive control are computed,
        hashed and committed before the general-correspondence arm is read.
      - >-
        ARCHIVE CHECK (zero compute): prior corpus measurements of psi_C or of
        correspondence transport. NOT AVAILABLE -- none found -- recorded as an
        absence rather than as a passed check.
    required_metrics:
      - agreement rate per correspondence, with the point sample size
      - deg psi_C against the forced product, per composition depth
      - null-arm value with its forced zero
      - the genus-escape cost table
      - a verbatim statement of what stage 0 could and could not confirm about the recalled Gaudry exponent

  falsification_conditions:
    - >-
      A single sampled point at which divisor-theoretic transport along an
      F_p-rational correspondence between elliptic curves disagrees with every
      element of Hom(E_1, E_2). The closure is void and family (3) reopens.
    - >-
      An independent reviewer exhibits a trapdoor mechanism using a
      correspondence whose action on the DLP does not factor through Pic^0 --
      for example one that leaks information through the ramification of C rather
      than through the induced map. The closure would then be scoped to
      "transport-based" correspondence trapdoors only, and the record must be
      superseded with that narrower scope.
    - >-
      The recalled Gaudry exponent 2 - 2/g is wrong in the direction that makes
      genus-g index calculus cheaper than p^{1/2}. E1 then reopens at fixed
      genus and becomes the campaign's most promising lane.
    - >-
      The positive control (graph of a known isogeny) fails. Instrument void; no
      negative reported (AGENTS.md rule 5).

  confounders:
    - >-
      DEGREE NORMALISATION. pi_{2*} pi_1^* applied to a degree-zero divisor needs
      care about the degree of the fibres; a wrong normalisation produces a map
      that is off by a multiplication-by-d, which would LOOK like a failure of
      the collapse while being an implementation artifact. The null arm exists
      exactly to catch this.
    - >-
      TINY p. At p = 101 the group is small enough that a wrong map can agree
      with a right one by accident. Agreement must therefore be reported over at
      least 500 points per correspondence and at three primes, and the
      probability of accidental agreement stated.
    - >-
      RECALLED EXPONENT. The 2 - 2/g figure carries the whole E1 rejection and
      is RECALLED-UNVERIFIED. If it cannot be verified, the E1 row is reported as
      "not established" and E1 stays open, rather than being rejected on a
      remembered number. This is the failure mode KN-OPEN-3f7a21 exists to warn
      about and it is being obeyed here.
    - >-
      CLOSURE-SHAPED WRITING. A closure reads as rigour and is cheap to produce.
      This record is designed so a reviewer can kill it with one counterexample
      point, and so that a successful kill would be MORE interesting than the
      closure.

  interpretation_limits:
    - >-
      The closure covers correspondences BETWEEN ELLIPTIC CURVES that act on the
      DLP through Pic^0. It does not cover higher-genus targets (E1, costed and
      dominated at fixed genus, OPEN asymptotically with no known vehicle), does
      not cover extension fields (E2 is why F_p blocks the known vehicle), does
      not cover non-Jacobian abelian surfaces (E3, dead for the designer with a
      reason), and does not cover the reversed genus-2 construction (E4, which is
      the interesting object and lies outside RQ-ECTD-001's declared scope).
    - >-
      MANDATORY FORWARD GUIDANCE (inventor protocol section 4). What remains
      open after this record: (i) a prime-field construction giving genus growing
      with log p, the missing vehicle for E1's asymptotic escape; (ii) whether
      the Humbert-surface detectability of an (n,n)-split is cheap enough to kill
      E4, which is a computable question; (iii) whether any correspondence-shaped
      trapdoor can leak through ramification rather than through Pic^0.
    - >-
      NOTHING HERE IS EVIDENCE. No run has happened. This is a pre-execution
      proposal, and even its central argument is offered for an independent
      reviewer to break.
    - >-
      NO STATUS CHANGE to GOAL-ECTD-001's priority list is proposed or implied.
      Whether family (3) should be retired from the objective is a Coordinator
      decision under AGENTS.md rule 1.

  heuristic_assumptions:
    - id: HEUR-ECTD-CORR-1
      statement: >-
        NONE LOAD-BEARING FOR THE COLLAPSE. Corr(E_1, E_2)/trivial =
        Hom(E_1, E_2) is a theorem of algebraic geometry, not a distributional
        assumption, and it is stated here so a reviewer can attack the derivation
        rather than a probability. This entry exists to record that the record's
        headline is UNCONDITIONAL.
      rigorous_support: >-
        Functoriality of pi_1^* and pi_{2*} on Pic^0 plus the vanishing of the
        trivial correspondences; RECALLED and re-derived above, no citation
        asserted.
      validation_plan: >-
        Stage 2's agreement rate is a direct computational check of the theorem's
        consequence at toy p, and it can fail.
    - id: HEUR-ECTD-CORR-2
      statement: >-
        FOR ALL fixed g >= 2 and FOR ALL curves X/F_p of genus g, the cost of
        computing discrete logarithms in Jac X(F_p) is Omega(p) up to
        logarithmic factors, so no fixed-genus correspondence escape beats
        matched rho on E.
      random_model_justification: >-
        This is NOT a random-model statement and must not be dressed as one. It
        is an appeal to the best PUBLISHED algorithm being Otilde(p^{2-2/g}),
        which is an upper bound on the best known, not a lower bound on the
        truth. A better algorithm for a SPECIAL genus-g family -- exactly the
        kind a trapdoor designer would build -- would refute it.
      validation_plan: >-
        Stage 0 verifies the recalled exponent against a primary source. If it
        cannot be verified the E1 row is reported as "not established", and in
        no case is the recalled number cited as this program's result.

  target_complexity:
    time_exponent: >-
      No exponent is moved by this proposal, and it says so. It CLOSES a lane
      that could not have moved one (family (3) collapses into families (1)/(2),
      whose exponent is bounded at 1/2 by IDEA-20260805-4243e6) and it OPENS one
      that could: escape E4's reversed genus-2 construction has a private
      advantage of p^{1/2} in the exponent, and that is stated as a shape to be
      evaluated, never as a result.
    memory_exponent: >-
      n/a for the closure. For E1's rejection the relevant comparison is
      Gaudry's index calculus at Otilde(p^{2-2/g}) time and a factor base of size
      ~p, i.e. p memory, against rho at 1.2533 sqrt(p) time and O(log p) memory --
      so E1 is dominated on BOTH axes, which is why it is charged on both here.
    best_known: >-
      Pollard rho, 1.2533 sqrt(N) time, O(log N) memory, for the DLP that any
      correspondence would be transporting.
    hidden_overhead: >-
      The recalled Gaudry exponent; the (n,n)-isogeny construction cost in E4;
      the Humbert-surface test cost in E4.
    tradeoff_note: >-
      E1 loses on time AND memory simultaneously, which is why no time-memory
      interpolation rescues it at fixed genus.

  dominated_by: >-
    n/a (no attack, no algorithm, no improvement is claimed; the deliverable is
    a closure with forward guidance). ROWS CHECKED across time, memory and
    data/queries before writing that: Pollard rho (1.2533 sqrt N, O(log N)
    memory); BSGS (sqrt N time, sqrt N memory); parallel van Oorschot-Wiener;
    Gaudry fixed-genus index calculus on Jac X(F_p) at Otilde(p^{2-2/g}) with a
    factor base of size ~p (RECALLED-UNVERIFIED); Enge-Gaudry large-genus
    L_{p^g}(1/2) (RECALLED-UNVERIFIED, and the row that keeps E1 open
    asymptotically); GHS/Weil descent (inapplicable over F_p, E2); KN-LIT-7630's
    Galbraith isogeny construction. Absence of a dominating row in this corpus is
    not evidence that none exists.
  sota_delta: >-
    No attack; a closure plus a redirection. Quantitatively: the fixed-genus
    correspondence escape is shown to lose by a factor of at least
    p^{2-2/g} / (1.2533 p^{1/2}) >= 0.80 p^{1/2}, which is 2^28 at p = 2^56 --
    so it is not a marginal loss to be tuned away but an exponent-scale one. The
    campaign's priority family (3) is reduced to families (1)/(2) at zero
    compute, freeing whatever share of the remaining six batches it would have
    consumed. Against the state of the art in attacks: zero on every axis.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: >-
    0.85 that the collapse survives review, which is high because it is a
    theorem rather than a model -- the residual 0.15 is almost entirely the risk
    that a reviewer finds a trapdoor mechanism acting through ramification rather
    than through Pic^0, which would narrow the scope rather than refute the
    algebra. It is not 0.95 because the record is written by the same agent that
    derived it, no independent check has occurred, and this program's own
    DEC-20260805-2be965 records a red team finding four of five named
    obstructions defective on audit -- a base rate that argues against confidence
    in one's own barrier arguments. Separately, 0.40 that the E4 reversed
    construction survives its own detectability question, which is the number
    that should drive whether the Coordinator opens a scope amendment.
