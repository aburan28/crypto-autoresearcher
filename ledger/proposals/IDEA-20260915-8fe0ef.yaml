idea:
  id: IDEA-20260915-8fe0ef
  title: >-
    Frobenius-invariant factor bases on binary Koblitz cells, measured against
    the sqrt(2n)-corrected rho baseline: the tau-stable subspaces of F_{2^n} are
    the kernels ker g(tau) for g | x^n - 1, so a lane exists only when ord_n(2)
    < n - 1; every tau-stable V not containing F_2 lies inside ker Tr and is
    therefore trace-parity-confined (H-SEMBIN-83a856), which FORCES an even
    decomposition arity m on curves with Tr(a) = 1; where the lane exists the
    relation-search cost drops by exactly n and the linear-algebra cost by n^2
    at unchanged per-instance PDP cost, while the matched rho baseline also
    drops by sqrt(2n) - so the boundary table's index-calculus/rho gap on
    Koblitz cells moves by sqrt(n/2) and no exponent moves
  class: mechanism
  research_question_id: RQ-ICPERF-94c86e
  question_id: RQ-ICPERF-94c86e
  area: ICPERF
  goal_ids: [GOAL-ICPERF-e6b6a4]
  status: proposed
  proposed_by: idea-generator
  task_id: TASK-20260915-5ba08b
  recorded_at: '2026-09-15'
  claim: >-
    SETTING. E: y^2 + xy = x^3 + a x^2 + b with a, b in F_2 (a Koblitz curve; the
    Trimoska benchmark curve [1,1,0,0,1], i.e. a = b = 1, IS one), attacked over
    F_q, q = 2^n, n an odd prime, #E(F_q) = h r with r prime, G the order-r
    subgroup, tau the 2-power Frobenius acting as x -> x^2 on coordinates and as
    an endomorphism on E(F_q) with tau^2 - t tau + 2 = 0, t = 3 - #E(F_2).
    (S1, LANE EXISTENCE - a theorem, not a heuristic.) The tau-stable
    F_2-subspaces of F_q are exactly ker g(tau) for monic g | x^n - 1 = (x + 1)
    Phi_n(x), Phi_n splitting over F_2 into (n-1)/d irreducibles of degree
    d = ord_n(2). Available stable dimensions are {j d, j d + 1 : 0 <= j <=
    (n-1)/d}. A Frobenius-invariant factor base of dimension l with l < n - 1
    exists iff d < n - 1, and a BALANCED one (m l in [n-3, n+1] for some
    m in {2,...,5}) exists only on a sparse set of n: among the three shipped
    cells, n = 17 (d = 8: l in {8, 9}, m = 2) has a lane; n = 15 is not prime
    (subfield points, out of this record's scope) and n = 19 (d = 18) has NONE.
    Among the FIPS Koblitz degrees: n = 163 (d = 162) has no lane at all; n = 233
    (d = 29) has l = 58, m = 4; n = 283 (d = 94) has l = 94, m = 3; n = 409
    (d = 204) has l = 204, m = 2; n = 571 (d = 114) has l = 114, m = 5.
    (S2, CONFINEMENT - a theorem given H-SEMBIN-83a856.) Since Phi_n(tau) = Tr,
    every tau-stable V with (x + 1) not dividing g - equivalently 1 not in V -
    lies inside ker Tr. On a curve with Tr(a) = 1 (a = 1, n odd) such a V has
    F1 = |Fb_E ∩ 2E| = 0: NO factor-base point lies in the odd-order class, so
    every m-fold sum has class m mod 2 and G-targets have EXACTLY ZERO
    decompositions for odd m. The stable lanes of S1 with l = j d (not j d + 1)
    are therefore usable only with EVEN m, and the l = j d + 1 lanes (which
    contain F_2) are unconfined. On a = 0 curves (Tr(a) = 0, cofactor h = 4) the
    same V lies entirely inside 2E, which is the class containing G, and a
    SECONDARY Z/2 = 2E/4E decides G-landing; no closed-form x-criterion for 4E
    is in the corpus (open item O1 below).
    (S3, COST.) On a lane, the factor base Fb_E = {P : x(P) in V, x != 0} is a
    union of <tau, -1>-orbits of size 2n; the unknowns of the linear algebra
    are the orbit logs (tau acts on G as the scalar lambda of order n with
    lambda^2 - t lambda + 2 = 0 mod r), so U = |Fb_E| / (2n), the relations
    needed N_rel = U + O(1) fall by n against the negation-only pipeline, and
    the dense/sparse linear-algebra cost falls by n^2; the per-instance PDP
    cost c 2^{m l} (IDEA-20260915-0d8e90) is unchanged because the block size l
    is unchanged. The matched generic baseline is rho on <tau, -1>-classes,
    sqrt(pi r / (4 n)) group operations (Wiener-Zuccherato, KN-LIT-042), which
    is sqrt(2n) below the negation-only 0.886 sqrt(r) row that every ICPERF
    cell currently carries. Net: the ratio T_IC / T_rho on a Koblitz cell moves
    by n / sqrt(2n) = sqrt(n/2) in favour of index calculus - a constant, cell-
    specific, and the exponents (n + l in the SAT pipeline, n/2 in rho) do not
    move.
    PROPOSAL-TIME NUMBERS (this session, /tmp/frob_check.py, NOT evidence). On
    the Trimoska curve at n = 17 (r = 65587 prime, t = 1, lambda = 17184 of
    order 17 mod r): Phi_17 = f1 f2 with deg 8; V = ker f1(tau) has 102 nonzero
    E-side x (6 tau-orbits of 17), |Fb_E| = 204, F1 = 0; V = ker f2(tau) has 119
    (7 orbits), |Fb_E| = 238, F1 = 0; ker (x+1) f1 (dim 9) has |Fb_E| = 443 with
    F1 = 238. With m = 2 on ker f1, the pair count gives lambda_x = 2 C(204,2) /
    (r - 1) = 0.631 (46.8% of G x-coordinates decomposable); with m = 3 on the
    same V, lambda_x = 0 exactly. The relation-phase law N_rel / lambda_x * c
    2^{m l} at c = 0.97 gives 1.04e7 conflicts without the Frobenius quotient
    (N_rel = 103) and 7.05e5 with it (N_rel = 7) - the factor 14.7 ~ 103/7,
    i.e. n up to the O(1) in N_rel. The shipped (17, 6, m = 3) law 3 c 2^{n+l}
    is 2.44e7 conflicts. Rho at n = 17: 321 plain, 227 with negation, 55 with
    <tau, -1>. The shipped V = {deg x < 6} is NOT tau-stable.
  mechanism: >-
    OBJECT TRACKED. The <tau, -1>-orbit of a factor-base point, together with
    its class bit Tr(x) + Tr(a). Under the operation set {add m factor-base
    points; apply tau; negate}, the orbit is a lossy projection (it discards
    which of the 2n conjugates is meant) that propagates deterministically:
    tau(P1 + ... + Pm) = tau P1 + ... + tau Pm and log tau P = lambda log P, so a
    relation on orbits is a relation on logs with known scalar coefficients
    lambda^i. The class bit is constant on orbits (Tr is tau-invariant) and is
    the E -> E/2E homomorphism of H-SEMBIN-83a856. The lossy-projection test
    passes on both components; the pair is genuinely new relative to
    IDEA-20260913-cedd2f (class bit alone) and IDEA-20260906-a77711 (orbit
    alone) only in their INTERACTION, which is S2.

    WHY THE LANE TABLE IS DECIDED BY ord_n(2). F_q is the F_2[x]-module with
    x . u = u^2; x^n - 1 is squarefree at odd n so the module is semisimple and
    its submodules are the kernels of divisors (IDEA-20260914-e2e0cf mechanism,
    IDEA-20260906-a77711 arm A). Over F_2 the irreducible factors of Phi_n all
    have degree ord_n(2) (the orbits of multiplication by 2 on Z/n \ {0}), which
    gives S1 in closed form and makes lane existence a zero-compute question
    per n. The FIPS list above is proposal-time arithmetic; the a-values of
    K-233/283/409/571 (a = 0) and K-163 (a = 1) are RECALLED from FIPS 186-4 and
    must be read from the standard before any of those rows is written.

    WHY CONFINEMENT FOLLOWS. Tr = sum_{i<n} tau^i = Phi_n(tau) as an F_2-linear
    map; ker g(tau) with g | Phi_n is inside ker Phi_n(tau) = ker Tr. Criterion
    (F2) of H-SEMBIN-83a856 (P in 2E iff Tr(x_P) = Tr(a)) then gives F1 = 0 on
    Tr(a) = 1 curves and F0 = 0 on Tr(a) = 0 curves. Note the asymmetry with
    IDEA-20260915-3119c9's design rule "maximise F1": on a Tr(a) = 1 Koblitz
    curve a class-aligned slice {x in W : Tr(x) = 1} is a coset v + V with
    V = W ∩ ker Tr, and the coset is tau-stable iff V is tau-stable and
    tau v - v lies in V. Taking v = 1 (tau-fixed) always works, so the
    tau-stable class-aligned slices are exactly 1 + ker g(tau) for g | Phi_n
    (proposal-time check: the class bit is constant on 1 + ker f1 and x = 1
    itself is not E-side at a = b = 1, odd n). Such a slice exists at every
    lane dimension deg g, has F0 = 0, and is unconfined for every m. This is
    the object the minimal test compares against the linear lane ker g(tau)
    (F1 = 0, even m only); whether a generic (non-F_2) offset v gives a stable
    coset depends on g and is not needed here.

    WHY THE PDP COST IS UNCHANGED. The descended S_{m+1} system has m blocks of
    l Boolean variables whatever basis of V is chosen; the exhaustive-core law
    c 2^{m l} of IDEA-20260915-0d8e90 counts leaves, not coefficients. A
    tau-stable V written in a normal basis makes the system's cyclic-shift
    equivariance visible (a77711 Lemma A1) but the equivariance is between
    CONJUGATE targets, not a symmetry of one instance, so no per-instance
    saving is predicted (a77711 arm A) - and a measured per-instance change
    would falsify that closure, which is the second explanation the test
    discriminates.

    WHAT THE TABLE GAINS. (i) A lane-existence column per cell, filled by
    arithmetic; (ii) a Koblitz rho baseline sqrt(pi r / (4n)) beside the
    negation-only one, which at n = 15/17/19 is 29/55/104 group operations
    instead of 113/227/454 - the unreviewed RUN-ICPERF-305ca3 row compared
    its SAT column against a baseline 5.5-6.2x too generous to index calculus
    on a curve that is Koblitz (a, b in F_2); (iii) on cells with a lane, a
    measured N_rel, U and linear-algebra dimension, whose ratios to the
    negation-only row are predicted to be n and n^2.
