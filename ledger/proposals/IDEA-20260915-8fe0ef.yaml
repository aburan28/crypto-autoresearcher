  assumptions:
    - n is an odd prime (no proper subfield points other than E(F_2)); the n = 15 cell is out of scope for this record.
    - '#E(F_q) = h r with r prime and h in {2, 4}; at n = 17 on the Trimoska curve h = 2 and r = 65587 (proposal-time count, matches the Lucas recurrence t_17 = -101).'
    - The descent generator can emit an arbitrary F_2-basis of V (and an affine offset); the vendored Weil_descent.sage uses the monomial basis {1, x, ..., x^{l-1}} and needs the same generalisation as IDEA-20260915-3119c9 - implementation, not a research assumption.
    - Targets are drawn in G; the lane's per-target yield is for G-targets.
  proof_search_map:
    bottleneck: >-
      The relation-collection count N_rel and the linear-algebra dimension U on
      a Koblitz cell, and the generic baseline they are compared against.
    baseline_embedding:
      parameter_slice: >-
        The n = 17 cell with the shipped V = {deg x < 6} (not stable, m = 3) as
        the negation-only baseline row, and rho at 227 (negation) / 55 (<tau,-1>)
        group operations.
      reproduction_check: >-
        Recompute #E = 131174, r = 65587, lambda = 17184 of order 17, Phi_17 =
        f1 f2 with f1 = x^8 + x^5 + x^4 + x^3 + 1, f2 = x^8 + x^7 + x^6 + x^4 +
        x^2 + x + 1 (bit patterns 0b100111001, 0b111010111), and the orbit
        counts 6 / 7 on ker f1 / ker f2.
    observation_collision:
      observable: The measured ratio (N_rel, U) of the negation-only row to the Frobenius row at the same |Fb_E|.
      distinct_preimage_search: >-
        A ratio near n is produced by (i) the orbit quotient (S3), or (ii) a
        smaller factor base drawn by chance (|Fb_E| differs between V's). (i)
        and (ii) are separated by reporting |Fb_E| and U separately - the
        prediction is U = |Fb_E| / (2n) exactly, not N_rel ~ N_rel'/n. A
        per-instance conflict change between stable and random V of the same l
        is a third preimage (a77711's closure failing), separated by measuring
        c on both.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The factor base as a set of <tau, -1>-orbits with a class bit; the
          linear system over orbit logs with coefficients in {lambda^i}.
        predicted_gain: >-
          N_rel and U divided by n, linear algebra by n^2, at unchanged
          per-instance PDP cost; baseline corrected by sqrt(2n).
    quantifier_order: >-
      For every odd prime n and every Koblitz curve over F_2: S1 and S2 hold
      exactly (theorems given H-SEMBIN-83a856's criterion). For every cell with
      a lane and every tau-stable V of dimension l: U = |Fb_E| / (2n) exactly,
      and c(V) = c(V_random) within 10% (heuristic H3). The E-side orbit count
      on V is Binomial((2^l - 1)/n, 1/2) over the choice of g (heuristic H1).
    method_ceiling:
      strongest_certifiable_claim: >-
        A constant-factor statement: n on relation collection and n^2 on linear
        algebra on cells where a lane exists, against a rho baseline that is
        itself sqrt(2n) faster; a zero-compute lane table per n. No exponent
        claim; nothing about K-163 beyond "no lane of this kind".
      nearby_object_control: >-
        (KNOWN-FALSE) The same V = ker f1(tau) with m = 3 on the a = 1 curve:
        S2 predicts exactly zero G-target decompositions; any decomposition
        found falsifies criterion (F2) or the construction. (NULL) A random
        (non-stable) linear V of the same dimension 8: its <tau>-orbits leave V,
        so U = |Fb_E| / 2, N_rel is n times larger, and its E-side count is
        Binomial(256, 1/2) rather than orbit-quantised. (TWIST) The quadratic
        twist E' (a' = 0 over F_2, i.e. y^2 + xy = x^3 + 1) with the same V:
        F0' = 0 instead of F1 = 0, so m = 3 yields G'-class sums on E' - the
        same V has opposite confinement on the two curves.
    proof_obligations:
      - claim: tau-stable subspaces are ker g(tau), g | x^n - 1, of dimension deg g (S1)
        responsibility: correctness
      - claim: ker g(tau) inside ker Tr iff (x + 1) does not divide g; F1 = 0 on Tr(a) = 1 (S2)
        responsibility: correctness
      - claim: U = |Fb_E| / (2n) and N_rel = U + O(1) on a lane (S3)
        responsibility: size_bound
      - claim: per-instance c unchanged between stable and random V at fixed l
        responsibility: runtime
      - claim: lambda_x for m = 2 on ker f1 at n = 17 equals 2 C(|Fb_E|, 2) / (r - 1) within the multiset correction
        responsibility: success_probability
    not_applicable_reason: null
