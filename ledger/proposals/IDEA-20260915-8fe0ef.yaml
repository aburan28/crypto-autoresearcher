  minimal_test:
    design: >-
      Cell n = 17 only (the one shipped cell with a lane; n = 19 has none and is
      the zero-compute negative control on the lane column). (1) Zero compute:
      write the lane table for n in {15, 17, 19, 23, 31} and the five FIPS
      degrees from ord_n(2), read the FIPS a-values from the standard, and record
      the predicted (l, m, confined?) per cell. (2) Build the exhaustive
      decomposition tables (IDEA-20260915-3f1964 instrument) for V1 = ker f1(tau)
      with m = 2 and m = 3, V2 = 1 + ker f1(tau) (affine, class-aligned, stable)
      with m = 2 and m = 3, and a random non-stable linear V of dimension 8 with
      m = 2; record |Fb_E|, F1, F0, orbit count, U, lambda_x per (V, m). (3)
      Generate 20 certified-U and 20 S G-target instances for V1 (m = 2) and the
      random V (m = 2) with the generalised descent; run WDSat default; record c
      and IQR for both. (4) Compute N_rel, U, the relation-phase law and the
      dense-LA cost (U^3, or U^2 x weight for Wiedemann) for the stable and the
      random V; compute rho at 227 and 55; report T_IC / T_rho under both
      baselines. OUTCOMES. (A) Zero m = 3 decompositions on V1, lambda_x(m = 2)
      within 15% of 0.631, U = |Fb_E| / 34, c within 10% between V's: S1-S3 hold
      and the a77711 closure stands; the table gains the lane and baseline
      columns. (B) c differs by > 25% between stable and random V at equal l:
      the per-instance cost DOES see the stability - a77711's arm A is
      contradicted at the SAT level and the direction of the difference is the
      finding (a stable V cheaper per instance would be a mechanism beyond
      GGMP's factors; costlier would be a new obstruction). (C) Any m = 3
      G-target decomposition on V1: criterion (F2) or the construction fails;
      withdraw S2 and re-derive. (D) U != |Fb_E| / 34: some E-side orbit is
      short, which at prime n means an x in F_2 slipped in or the orbit
      computation is wrong - an instrument bug, not a finding.
    controls:
      - KNOWN-FALSE - V1 with m = 3 (S2 predicts exactly zero G-target decompositions).
      - NULL - random non-stable linear V of dimension 8, m = 2 (U = |Fb_E| / 2; N_rel n times larger; E-side count binomial, not orbit-quantised).
      - TWIST - the same V1 on y^2 + xy = x^3 + 1 (a = 0): F0' = 0, m = 3 lands in 2E'; recompute and confirm opposite confinement.
      - NEGATIVE LANE - n = 19 cell: no stable l in [1, 17] with 2 <= m <= 5 balanced (d = 18); record the empty lane as a table entry, not as an absence.
      - RECONSTRUCTION - #E, r, lambda, f1, f2 and the orbit counts 6 / 7 recomputed from scratch by the executor.
    required_metrics:
      - lane table (n, d = ord_n(2), available l, balanced (l, m), confined?) for the listed n
      - '|Fb_E|, F1, F0, orbit count, U, lambda_x per (V, m), from exhaustive tables'
      - WDSat conflicts (median, IQR) per (V, m) on certified-U instances; c = median / 2^{ml}
      - N_rel, LA dimension, LA cost model, T_rel law, T_IC / T_rho under negation-only and <tau, -1> rho baselines
  falsification_conditions:
    - Any G-target with an m = 3 decomposition over V1 = ker f1(tau) at n = 17 (S2 false, or criterion (F2) false, or the construction not stable); the record is withdrawn until the failing step is named.
    - U differing from |Fb_E| / (2n) on a stable V at prime n (S3 false; an orbit is short) - an arithmetic error, to be located, not a finding.
    - lambda_x(m = 2, V1) outside [0.54, 0.73] on the exhaustive table (the pair count misses a term).
    - Median UNSAT c on stable-V instances differing from random-V instances by more than 25% at equal (l, m) - the per-instance cost is NOT stability-blind; S3's "unchanged PDP cost" is false and IDEA-20260906-a77711 arm A needs re-reading at the SAT level (this is outcome B, recorded as a finding in either direction).
    - N_rel(stable) / N_rel(random) above 2 / n at matched |Fb_E| - the Frobenius quotient does not deliver the factor n in relation collection (some relations are orbit-dependent, e.g. through the 2-torsion point (0, 1) or through a class-bit interaction not in S2).
    - The <tau, -1> rho baseline at n = 17 measured (by a rho implementation on classes) at more than 1.5 x 55 = 83 group operations median over >= 100 instances - the sqrt(2n) speedup is not realised at this n (fruitless cycles, KN-LIT-042 caveat) and the corrected baseline must carry the measured constant rather than the asymptotic one.
  confounders:
    - The 2-torsion point (0, 1) has x = 0 in every linear V; it is its own tau-orbit (size 1) and lies outside G; exclude x = 0 from Fb_E (as done above) or its relation column breaks U = |Fb_E| / (2n).
    - The affine stable slice 1 + ker f1(tau) contains x = 1, which is E-side iff Tr(1 + a + b) = 0; at a = b = 1 and odd n, Tr(1) = 1 so x = 1 is NOT on E - checked at proposal time, must be rechecked per curve.
    - The Frobenius-quotiented linear system has coefficients lambda^i in Z/r rather than {0, 1}; a sparse solver's cost per nonzero changes (multiplication mod r instead of addition) - report LA cost in field operations, not in nonzeros.
    - For a = 0 curves (h = 4) the class analysis of S2 gives the 2E-landing rate only; G-landing is a further Z/2 with no closed-form criterion in the corpus (O1). Do not write an a = 0 lane row as "unconfined" until O1 is resolved or the 4E class is measured exhaustively.
    - GGMP's factor n on "polynomial systems" and this record's factor n on N_rel are the same quantity only when yield lambda_x is the same for the stable and the comparison V; report both N_rel and lambda_x, never the ratio of solver calls alone.
    - The shipped m = 3, l = 6 row and the lane's m = 2, l = 8 row are different (m, l) cells; the "34x" total between 2.44e7 and 7.05e5 conflicts mixes the Frobenius factor with the (m, l) change and the yield change; only the stable-vs-random comparison at equal (m, l) isolates the mechanism.
  interpretation_limits:
    - Constant factors on a pipeline that is exponentially dominated by rho at every n >= 8; nothing about any curve's security; the FIPS lane table is a statement about which factor-base constructions EXIST, not about cost at those n.
    - Scoped to Koblitz curves over F_2 with n an odd prime, h in {2, 4}, l <= 9 at n = 17 in the minimal test; a = 0 lanes are conditional on O1.
    - Nothing about Groebner engines or about the descent phase beyond "same per-target cost as one relation".
    - Novelty item (1) is claimed relative to the corpus; its status relative to the full text of eprint 2020/1315 is unverified.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For a tau-stable linear V = ker g(tau) of dimension l at prime n, the
        number of E-side nonzero tau-orbits in V is Binomial((2^l - 1)/n, 1/2)
        over the choice of g among the divisors of Phi_n of degree l, to within
        a relative correction O(2^{-l/2}).
      rigorous_support: >-
        The E-side indicator is (1 + (-1)^{Tr(x + a + b/x^2)})/2 and is
        tau-invariant, so it is a function of orbits; the character sum over V
        is a subspace Kloosterman sum bounded by 2 sqrt(q) over the whole field
        (Weil) and equidistributed over random subspaces in the second moment
        (as in IDEA-20260915-3119c9 H1), here quantised to orbits of size n.
        Imitates the classical equidistribution of Kloosterman sums; not proved
        for the specific divisors.
      validation_plan: >-
        At n = 17 there are only two degree-8 divisors (6 and 7 orbits observed
        against mean 7.5, s.d. 1.94 - both within 1 s.d.); the distributional
        check needs n with many divisors: n = 31 (d = 5, 6 factors, C(6, j)
        divisors of degree 5j) and n = 73 (d = 9, 8 factors) by the Deuring-free
        direct route (x-coordinate side test only, no point enumeration): sample
        every degree-5j divisor at n = 31 and 200 random degree-9j divisors at
        n = 73, tabulate E-side orbit counts, compare mean and s.d. to
        Binomial((2^l - 1)/n, 1/2) with the tail fraction above mean + 2 s.d.
        at 0.023 +- 0.01.
    - id: H2
      statement: >-
        The multiset/sign correction to lambda_x = 2 C(|Fb_E|, 2) / (r - 1) for
        m = 2 is below 5% at |Fb_E| >= 100.
      rigorous_support: >-
        Repeated points (P + P) are |Fb_E| of C(|Fb_E|+1, 2) pairs, < 1% at
        |Fb_E| = 204; P + (-P) = O is excluded by construction; sums landing on
        x = 0 or on non-G points do not occur for two class-1 points (S2).
        Exact counting, no heuristic beyond uniform landing of sums on G's
        x-coordinates (the random-model assumption of Semaev eq. (11)).
      validation_plan: >-
        The exhaustive pair table at n = 17 for V1, V2 and the random V; report
        measured lambda_x against the count with the residual.
    - id: H3
      statement: >-
        The per-instance UNSAT conflict count of WDSat default on an m = 2,
        l = 8 descended instance is c 2^{16} with c within 10% between a
        tau-stable V and a random linear V of the same dimension.
      rigorous_support: >-
        The exhaustive-core reading of IDEA-20260915-0d8e90 (leaf count is a
        property of block sizes) and IDEA-20260906-a77711 arm A (Frobenius is
        an equivariance between conjugate instances, not a symmetry of one).
        Imitates nothing classical; it is a solver-behaviour heuristic and is
        the one this record most expects could fail (outcome B).
      validation_plan: >-
        Step (3) of the minimal test: >= 20 certified-U instances per V, WDSat
        default, c with IQR for both; extend to l = 9 (V = ker (x+1) f1) if the
        n = 17 cell shows a difference above 10%.
  target_complexity:
    time_exponent: >-
      Relation phase T_rel = (2 c / n) 2^{n + l} conflicts at m = 2 on a lane
      (against 2 c 2^{n + l} without the quotient; the shipped m = 3 law is
      3 c 2^{n + l}); linear algebra divided by n^2; exponent n + l in the SAT
      pipeline unchanged, rho's n/2 unchanged. Constant factor n against
      negation-only index calculus; the matched rho baseline improves by
      sqrt(2n), so the IC/rho gap closes by sqrt(n/2) - 2.9 at n = 17, 10.8 at
      n = 233 - and remains exponential.
    memory_exponent: >-
      Factor-base storage and LA dimension divided by n (2^l / (2n) orbit
      logs); no exponent change.
    best_known: >-
      GGMP 2020/1315 (KN-LIT-796): the same factors n and n^2, claimed there as
      the best possible; rho on <tau, -1> classes at sqrt(pi r / (4n)) (KN-LIT-042).
      This record does not beat either; it makes both measurable in the ICPERF
      table and adds the confinement constraint on which lanes are usable.
    hidden_overhead: >-
      Normal-basis or generalised-basis descent (implementation); the
      O(1) extra relations; multiplication mod r in the LA instead of XOR;
      the fruitless-cycle handling in the <tau, -1> rho baseline (KN-LIT-042
      caveat) which is where the sqrt(2n) may not be fully realised.
    tradeoff_note: >-
      No time-memory trade introduced; the gain is a smaller unknown set. The
      lane exists only for n with ord_n(2) < n - 1 and balanced l, a sparse set
      that includes 4 of the 5 FIPS degrees and excludes K-163 and the n = 19
      shipped cell.
  dominated_by: >-
    Rho on <tau, -1>-classes, sqrt(pi r / (4n)) group operations and O(w)
    memory (KN-LIT-042; vOW memory model KN-LIT-73f7e1), at every n >= 8;
    and, as a mechanism, GGMP 2020/1315 (KN-LIT-796), which already claims the
    factors n and n^2 this record predicts. Frontier rows checked: negation-
    only rho 0.886 sqrt(r), <tau, -1> rho, exhaustive group search 2^n, the
    exhaustive V^m table 2^{ml}/m! per cell (IDEA-20260915-3f1964), the SAT
    pipeline 3 c 2^{n + l} (IDEA-20260915-0d8e90) and its Frobenius-quotiented
    form (2 c / n) 2^{n + l}. On time the record's row is dominated by both rho
    rows at every shipped n; on memory it is dominated by rho's O(w). The
    record moves a dominated row by a constant and corrects the baseline it is
    compared against.
  sota_delta: >-
    Zero against GGMP 2020/1315 on the mechanism's factors (n, n^2). Positive
    as an instrument: (i) the ICPERF Koblitz baseline moves from 0.886 sqrt(r)
    to sqrt(pi r / (4n)) - 5.5x, 5.8x, 6.2x smaller at n = 15, 17, 19 - so the
    unreviewed RUN-ICPERF-305ca3 row understates the SAT column's disadvantage
    by that factor on a curve that is Koblitz; (ii) a zero-compute lane column
    (n = 19: none; n = 17: l = 8, m = 2 only; K-163: none); (iii) the even-m
    constraint on linear stable lanes at Tr(a) = 1, and the affine stable
    slice 1 + ker g(tau) as the unconfined alternative - a constraint on which
    GGMP-type factor bases are usable for G-targets that no corpus record
    states. Proposal-time arithmetic at n = 17: relation phase 7.05e5 versus
    1.04e7 conflicts (factor 14.7 ~ n) at equal (m, l) = (2, 8); not evidence.
  estimated_cost:
    implementation: medium
    compute: low
    wall_clock_seconds: 14400
    memory_gb: 1
    note: >-
      Advisory. Lane table is arithmetic; exhaustive m = 2 tables at l = 8 are
      2^16 additions per V; m = 3 on V1 is 2^24/6 additions (the KNOWN-FALSE
      control); descent generalisation shared with IDEA-20260915-3119c9; WDSat at
      2 x 40 instances of 2^16 leaves is seconds; the <tau, -1> rho baseline
      measurement at n = 17 is minutes. H1's n = 31 / 73 validation is a
      separate, larger item (2^{45} orbit tests at n = 73 is NOT feasible
      exhaustively; sample 10^6 orbits per divisor instead and state the
