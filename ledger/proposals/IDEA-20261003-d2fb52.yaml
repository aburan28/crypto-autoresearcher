# IDEA-20261003-d2fb52
# j-invariant point-count ratio. Proposal only. Not approved.
idea:
  id: IDEA-20261003-d2fb52
  question_id: RQ-JINV-8fc13a
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    Point-count ratio of j=0 against a non-CM curve at one frozen prime
  class: measurement
  claim: >-
    At one frozen prime, the ratio of the rational-point count of a j=0
    curve to the rational-point count of a non-CM curve at the same prime
    lies in the closed interval from 1/3 to 3. A ratio outside that
    interval is the surprising branch. The known automorphism discount
    sqrt(6) is about 2.45 and sits inside the interval. A ratio inside
    the interval is not an ECDLP exponent.
  mechanism: >-
    OBJECT FRAME. R2 is the curve equation. R3 is the endomorphism ring,
    used only as the label j=0 versus non-CM. The operation set is
    enumeration of rational points. The question asks whether a special
    j changes a measured functional by more than the automorphism
    discount. This proposal measures the point-count ratio only.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        Special j must be compared with the automorphism-discounted baseline.
      verified_by: coordinator session 2026-10-03, question file read
    - ref: KR-RHO-898783
      provenance: internal
      claim: >-
        Kangaroo is an advice-free interval row and is not this count.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - Both curves are written before the count.
    - The prime is toy and public.
  proof_search_map:
    bottleneck: The point-count ratio.
    baseline_embedding:
      parameter_slice: One prime, one j=0 equation, one non-CM equation.
      reproduction_check: >-
        Two counters enumerate both curves and must agree on the ratio.
    observation_collision:
      observable: The ratio of the two point counts.
      distinct_preimage_search: >-
        A ratio outside [1/3, 3] is not the automorphism-discount calibration.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The pair of frozen curves.
        predicted_gain: One ratio. No exponent.
    quantifier_order: >-
      The prime and both equations are fixed before enumeration.
    method_ceiling:
      strongest_certifiable_claim: >-
        The ratio at that prime. Not a statement for every prime.
      nearby_object_control: >-
        The same curve counted twice. The ratio must be 1.
    proof_obligations:
      - claim: Both point counts are complete.
        responsibility: correctness
      - claim: The ratio is inside or outside [1/3, 3].
        responsibility: size
      - claim: An inside ratio is not an attack.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: point_count_ratio
      direction: different
      minimum_effect: The ratio lies in [1/3, 3], or the run reports the outside branch.
  minimal_test:
    design: >-
      Freeze the prime and both equations. Enumerate rational points.
      Divide the counts.
    controls:
      - The same curve counted twice.
      - An independent enumeration.
    required_metrics:
      - both point counts
      - the ratio
  falsification_conditions:
    - The double count of one curve has ratio other than 1.
    - A counted point fails its equation.
  confounders:
    - The point at infinity is included in one count and omitted in the other.
  interpretation_limits:
    - One prime is not a theorem about special j.
    - A ratio inside [1/3, 3] does not prove the automorphism discount.
    - No transfer to a cryptographic prime.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The automorphism discount sqrt(6) is at most 3, so a point-count
        ratio inside [1/3, 3] does not by itself exceed that discount.
      rigorous_support: >-
        sqrt(6) is less than 3 because 6 is less than 9. No CM theorem
        is claimed.
      validation_plan: >-
        Compute the ratio. Compare it with the pre-registered interval.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: O(p) for a toy enumeration.
    best_known: >-
      Automorphism-discounted rho. A constant at or below sqrt(6) is
      baseline calibration.
    hidden_overhead: Inclusion or exclusion of the point at infinity.
    tradeoff_note: Enumeration is the measurement, not an attack.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-13bf67
      - KR-RHO-898783
      - KR-IC-5a43e5
      - KR-IC-73db3f
    nearest:
      - ref: KR-RHO-13bf67
        provenance: internal
        relation: adjacent
        delta: >-
          The generic floor is the exponent constraint. This record measures
          a point-count ratio and claims no walk.
  dominated_by: >-
    No attack is claimed. Rho rows dominate any attack reading of a
    point-count ratio.
  sota_delta:
    time: zero attack delta
    memory: zero
    data_queries: One frozen prime and two curves.
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
