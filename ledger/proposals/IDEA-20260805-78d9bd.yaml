idea:
  id: IDEA-20260805-78d9bd
  question_id: RQ-AES-001
  added: '2026-08-05'
  title: >-
    The declared infrastructure blocker is false and the declared spec-pinning
    gate is unsatisfiable: a measured environment audit that unblocks CTRL-810-A's
    GF(2^8) legs and invalidates RQ-AES-001's two-implementation constraint as
    written
  class: control

  claim: >-
    Three environment facts, each measured on this machine at this session's HEAD
    and each contradicting a committed statement that is currently steering the
    campaign. (1) NUMPY IS INSTALLED (version 2.4.6, `python3 -c "import numpy"`
    succeeds). GOAL-AES-001's committed next_action declares, of CTRL-810-A's
    GF(2^8) legs, "NAMED INFRASTRUCTURE BLOCKER THE QUEUE MUST RESOLVE BEFORE
    DECLARING THE CARD: its GF(2^8) legs need numpy or a small C program and
    NEITHER IS INSTALLED", and TASK-20260801-810's redteam_report.md says the
    same ("not installed here -- that is the binding constraint"). GCC 13.3.0 is
    also present. The blocker does not exist, the hedge built around it is
    unnecessary, and the GF(2^8) legs of the campaign's rank-2 item are runnable
    now. (2) PYCRYPTODOME IS NOT INSTALLED (`python3 -c "import Crypto"` raises
    ModuleNotFoundError). GOAL-AES-001's environment_context.verified_tooling
    asserts "python3 with pycryptodome 3.23.0", and RQ-AES-001's FIRST HARD
    CONSTRAINT is that "no cryptanalytic work may be dispatched until a locally
    verified AES ground-truth harness exists whose full-round outputs agree with
    FIPS-197 known-answer vectors under BOTH pycryptodome and the openssl CLI".
    That gate is UNSATISFIABLE AS WRITTEN in the current environment. The openssl
    CLI (3.0.13) is present and the `cryptography` package imports successfully,
    so a two-independent-implementation pinning is still ACHIEVABLE -- but only
    under a superseding statement of the constraint, which is a Coordinator act
    this record does not perform. (3) THE NETWORK IS PARTLY OPEN. Measured HTTP
    status this session: eprint.iacr.org abstract pages 200, eprint.iacr.org PDF
    bodies 403, arxiv.org 200, csrc.nist.gov 200. RQ-AES-001's provenance block
    states that "csrc.nist.gov, eprint.iacr.org, arxiv.org ... are all
    unreachable under this harness's network policy (proxy CONNECT 403 / no
    route)". That is false for three of those endpoints as measured. EVERY ONE
    OF THESE IS A REPORTED MEASUREMENT OF THIS ENVIRONMENT, NOT A MATHEMATICAL
    RESULT, and none of them is negative evidence about AES (AGENTS.md rule 5).

  object_first_candidate:
    tracked_object: >-
      The ENVIRONMENT CAPABILITY VECTOR itself, treated as a first-class object
      that is asserted in committed records, propagated into scheduling decisions
      (which cards may be declared, which legs are declared out of scope, which
      claims are labelled unverifiable), and NEVER RE-MEASURED. Followed through
      the computation means: followed from the assertion in RQ-AES-001 and
      GOAL-AES-001, through DEC-20260731-030's next_action, into the hedge
      structure of the BATCH-005 queue that has not yet been written. The object
      is what a scheduler believes it can run.
    established_families_off_limits: >-
      Off-limits as the primary lens: integral / square, division property,
      impossible differential, Demirci-Selcuk meet-in-the-middle, partial sums,
      boomerang, biclique, related-key differential, algebraic / XSL. This
      proposal deliberately uses NO cryptanalytic lens at all, which is the point
      -- it audits the measurement apparatus and the scheduling premise, not the
      cipher.
    newness_score: >-
      Not new as mathematics; there is none. New in this corpus as an ACT: the
      ANGLE-BRIEF for this session records the same disagreement across two
      independent scouting sweeps (transfer-matrix.md says no numpy verified by
      pip list; method-gaps.md reports running a null with numpy 2.4.6) and
      explicitly instructs each generator to resolve it themselves. No committed
      record in GOAL-AES-001 has ever re-measured its own environment claims,
      and four batches of scheduling have been shaped by them.
    testability_score: >-
      Maximal. Every claim is a single shell command with a deterministic exit
      code, and the whole audit runs in under a minute.
    survival_score: >-
      The three facts survive as facts about THIS container at THIS commit and
      nothing more. They do not survive a container change, and the record says
      so; the deliverable is therefore a MEASURED RECEIPT with a timestamp and a
      commit, not a standing property of the harness.

  mechanism: >-
    There is no mathematics here and the record does not pretend otherwise. The
    mechanism is a measurement discipline, and it matters because of what the
    unmeasured assertions are currently doing.

    WHAT THE FALSE BLOCKER COSTS. DEC-20260731-030 ranks CTRL-810-A second and
    declares it NON-DEFERRABLE past BATCH-005, on the ground that it is
    HEUR-806-1's own validation experiment and the Coordinator contract requires
    a conditional result's validation to be paired in the following batch. It
    then instructs the queue to declare the GF(2^8) legs OUT OF SCOPE as
    infrastructure signal if the blocker is unresolvable, and to dispatch ranks 1
    and 2 concurrently AS A HEDGE AGAINST THAT BLOCKER. With numpy present, the
    legs are runnable, the hedge is unnecessary, the concurrency argument loses
    one of its three stated grounds, and -- most importantly -- an
    OUT-OF-SCOPE-AS-INFRASTRUCTURE declaration that would otherwise have been
    recorded against a live and answerable question does not get recorded. That
    is the specific harm: AGENTS.md rule 5 protects infrastructure failures from
    being read as mathematical negatives, and it works only if the infrastructure
    failure is real.

    WHAT THE UNSATISFIABLE GATE COSTS. RQ-AES-001's first constraint is a HARD
    GATE on dispatching any cryptanalytic work. Read literally against the
    current container it can never be discharged, because one of its two named
    implementations is absent. Four batches have proceeded past it -- which is
    consistent, because zero cryptanalytic compute has been spent on AES itself
    in any of them, as all four batch checkpoints state. But the moment this
    campaign attempts the reduced-round measurement its own completion criterion
    requires, the gate binds and cannot be met. The honest resolutions are
    (a) install pycryptodome, (b) supersede the constraint naming `cryptography`
    or a second independent implementation, or (c) record the gate as unmet and
    do not dispatch. All three are Coordinator acts. THIS RECORD PERFORMS NONE OF
    THEM and proposes no edit to any committed file.

    WHAT THE STALE NETWORK CLAIM COSTS. RQ-AES-001's provenance paragraph is the
    load-bearing justification for the campaign's entire epistemic posture: every
    literature baseline is declared RECALLED FROM MEMORY AND UNVERIFIED, and
    DEC-20260731-011's strikes on literature comparison rest on it. If
    eprint.iacr.org abstract pages, arxiv.org and csrc.nist.gov are reachable --
    and they returned 200 this session -- then a substantial part of that posture
    is a claim about the environment that is no longer true, and the campaign has
    been declining to verify baselines it could verify. That is the same failure
    shape as the numpy blocker, one level up, and it is pursued in a separate
    proposal (IDEA-20260805-5b8f95) rather than folded in here.

    WHY THIS IS NOT MERELY HOUSEKEEPING. The campaign's binding constraint is now
    the BATCH COUNT, and BATCH-005 is the last batch permitted to open new
    research questions (DEC-20260731-030, amendment 005 Part A). A false blocker
    consumes that scarcity by turning an answerable leg into a declared
    out-of-scope, and an unsatisfiable gate consumes it by making the terminal
    measurement undispatchable. Both are cheap to fix and expensive to leave.

  novelty_status: unverified

  literature_context:
    - >-
      NO EXTERNAL SOURCE IS USED. The record cites only committed internal
      records and commands run on this machine.
    - >-
      MEASURED THIS SESSION, on this container, at this working tree. Commands
      and observed outcomes: `python3 -c "import numpy; print(numpy.__version__)"`
      -> 2.4.6; `python3 -c "import Crypto"` -> ModuleNotFoundError;
      `python3 -c "import cryptography"` -> success; `openssl version` ->
      OpenSSL 3.0.13 30 Jan 2024; `gcc --version` -> 13.3.0; and, via curl
      through the configured proxy, HTTP 200 from https://eprint.iacr.org/2011/449,
      403 from https://eprint.iacr.org/2011/449.pdf, 200 from
      https://arxiv.org/abs/2407.15740, 200 from
      https://csrc.nist.gov/pubs/fips/197/final. THESE ARE SCOUT-COMPUTED,
      OUTSIDE THE HARNESS, AND MUST BE RE-RUN IN-HARNESS WITH A COMMITTED RECEIPT
      BEFORE ANY RECORD CITES THEM AS ESTABLISHED. A status code is not a
      document: no page body was parsed and no figure from any of them is
      asserted anywhere in this record.
    - >-
      COMMITTED INTERNAL SOURCES CONTRADICTED, quoted with their paths:
      ledger/goals/GOAL-AES-001.yaml next_action ("neither is installed") and
      environment_context.verified_tooling ("pycryptodome 3.23.0");
      ledger/questions/RQ-AES-001.yaml constraints[0] (the two-implementation
      gate), constraints[6] (the resource envelope, which also names
      pycryptodome 3.23.0), and provenance (the network paragraph);
      coordination/goals/GOAL-AES-001/batches/BATCH-004/tasks/TASK-20260801-810/redteam_report.md
      section 8 ("not installed here -- that is the binding constraint"). All
      were read in full from the working tree for this record.

  lossy_projection_identifiability_audit:
    projection: >-
      Environment -> the boolean vector (numpy_present, pycryptodome_present,
      cc_present, openssl_present, eprint_abs_reachable, eprint_pdf_reachable,
      arxiv_reachable, nist_reachable).
    what_is_discarded: >-
      Versions beyond those recorded, transitive dependency health, whether an
      importable module actually computes correctly, whether a 200 response
      carries the document requested rather than a block page, CPU count,
      available memory, and every other property of the container.
    why_genuinely_lossy: >-
      Genuinely lossy, and one discard is DANGEROUS and named rather than
      hidden: a 200 status does not establish that the body is the paper. The
      ANGLE-BRIEF records a 5402-byte block page returned under a different
      status for eprint PDFs, so a status-code-only projection can be satisfied
      by a block page. The audit therefore reports status codes as STATUS CODES,
      and any claim that a document was obtained requires the body, which this
      proposal does not assert for any endpoint.
    why_compatible_with_the_operations: >-
      Compatible with the operation that consumes it -- scheduling -- because a
      scheduler asks exactly "can this leg run" and "can that gate be
      discharged", which are boolean. It is NOT compatible with the operation of
      CITING a source, and the record refuses to be used for that.
    is_it_only_a_change_of_coordinates: >-
      CHECKED. It is not: the projection collapses a container to eight bits and
      the fibre is enormous. The relevant risk here is the MIRROR failure, and it
      is checked next.
    mirror_failure_check: >-
      CHECKED, and the answer decides whether the audit is worth running. If the
      projection were CONSTANT -- if every environment claim in the corpus were
      already true -- the audit would have zero comparator spread and would be a
      decoration. MEASURED SPREAD IS NONZERO AND LARGE: two of the eight
      coordinates come out OPPOSITE to what the committed records assert
      (numpy present where "neither is installed", pycryptodome absent where
      "3.23.0" is asserted), and three network coordinates come out opposite to
      the provenance paragraph. Five disagreements out of eight is not a
      constant statistic.

  assumptions:
    - >-
      That the container an executor task runs in is the container this audit
      measured. If the harness dispatches tasks into a different image, every
      finding here is void and the audit must be re-run inside the dispatched
      task. THIS IS THE MOST LIKELY WAY THE RECORD IS WRONG and it is named
      first. The paired experiment therefore runs the probe INSIDE the task and
      commits its receipt, rather than relying on this record.
    - >-
      That an importable numpy computes GF(2^8) linear algebra correctly. Not
      assumed: the paired experiment includes a self-check against a pure-Python
      reference on a small instance before any census result is reported.

  proof_search_map_note: >-
    NOT APPLICABLE and the reason is recorded rather than the field silently
    omitted. This proposal is not proof-oriented: it asserts no theorem, no
    asymptotic bound, no certificate family, no reduction and no closure
    argument. It reports measurements of a container. docs/inventor-protocol.md
    section 8 binds proof-oriented proposals; a measurement audit is outside its
    trigger, and inventing a four-audit map for it would be ceremony.

  predictions:
    - metric: numpy_import_exit_code inside a dispatched executor task
      direction: different
      minimum_effect: >-
        EXACTLY 0 (success), with a printed version string. Predicted 2.4.6. If
        the exit code is nonzero inside a dispatched task, the committed blocker
        is CORRECT for the dispatch environment, this proposal's headline is
        wrong for the environment that matters, and that is a clean falsification
        which the campaign should record as such.
    - metric: pycryptodome_import_exit_code inside a dispatched executor task
      direction: different
      minimum_effect: >-
        EXACTLY nonzero (ModuleNotFoundError). If it succeeds, RQ-AES-001's gate
        is satisfiable as written and claim (2) is withdrawn.
    - metric: >-
        independent_aes_agreement: number of FIPS-197 known-answer vectors on
        which two INDEPENDENT locally available AES implementations agree, over
        the AES-128/192/256 ECB single-block vectors used
      direction: higher
      minimum_effect: >-
        ALL of them, with the two implementations named in the receipt. The
        pairing must be (openssl CLI, `cryptography`) or (openssl CLI, a
        from-scratch reference written for the task) since pycryptodome is
        absent. ANY disagreement is an infrastructure failure and halts the
        campaign's ground truth -- it is never a fact about AES.
    - metric: >-
        ctrl_810a_gf256_leg_runnable: boolean, whether HEUR-806-1's GF(2^8)
        kernel census executes to completion within a declared 900 s under numpy
      direction: different
      minimum_effect: >-
        TRUE. Derived rather than guessed: the census is a rank computation of a
        16-by-16 GF(2^8) matrix per kernel, and the dim-1 stratum has
        (256^4 - 1)/255 = 16,843,009 kernels; a vectorised implementation
        batching kernels is minutes, and a criterion-based reduction is seconds.
        If it does NOT complete, the correct report is a TIMEOUT AS
        INFRASTRUCTURE SIGNAL with the reached coverage stated, never a
        statement about the distribution of J.
    - metric: >-
        heur_806_1_census_minimum: min over the measured GF(2^8) kernel census of
        J(K), reported as log_2
      direction: different
      minimum_effect: >-
        PREDICTED EXACTLY 24, with the distribution supported on {24, 32}, which
        is HEUR-806-1's own pre-registered statement. FALSIFYING OUTCOME, stated
        before any run: any kernel with log_2 J < 24, or any kernel with
        log_2 J outside {24, 32}. RT-1 predicts the minimum is attained on
        K = ker(M + I) = span(1,1,1,1); an attaining kernel elsewhere is
        interesting and must be reported, not filtered.

  minimal_test:
    design: >-
      Three stages, cheapest first, stage 1 decisive for the scheduling
      question. STAGE 1 (seconds, MAY END THE PROPOSAL): inside a dispatched
      task, run the eight probes and commit the receipt with exit codes,
      versions, timestamps and the git commit. If numpy is absent there, STOP and
      report that the committed blocker was right about the dispatch environment.
      STAGE 2 (minutes): build the two-implementation AES ground truth from
      whatever IS present, agree it on FIPS-197 known-answer vectors, and commit
      the receipt -- this is what RQ-AES-001's gate actually wanted, discharged
      by the implementations that exist. STAGE 3 (minutes to one hour): execute
      HEUR-806-1's own GF(2^8) census, which is now unblocked, reporting the J
      distribution against the pre-registered {2^24, 2^32} support and the
      identity census of IDEA-20260805-947f67 alongside it.
    controls:
      - >-
        NULL OBJECT (same shape, forced value pre-derived, CAN FAIL). Probe a
        module that is KNOWN ABSENT and one KNOWN PRESENT with the identical
        harness: `sympy` (measured absent this session) and `json` (standard
        library, present). FORCED VALUES: nonzero and zero exit respectively. If
        the probe returns success for sympy or failure for json, the probe
        itself is broken and NO environment claim from it may be recorded. This
        null can genuinely fail and it is the reason the audit is not
        self-confirming.
      - >-
        POSITIVE CONTROL / NEARBY OBJECT WHERE THE EFFECT MUST APPEAR. The
        numpy GF(2^8) rank routine is checked against a pure-Python reference
        rank on 200 seeded random 16-by-16 matrices over GF(2^8). The two MUST
        agree on all 200. If they do not, the instrument is broken and NO census
        result may be reported -- neither positive nor negative.
      - >-
        GRADED CONTROL, 3 INTERIOR POINTS, MONOTONICITY REPORTED. Run the census
        at kernel dimension 1, 2 and 3 and report the fraction of kernels
        attaining the minimum J at each. The frontier ceiling q^(4(4 - dim K))
        falls monotonically (2^96, 2^64, 2^32) as dim K rises, so the fraction
        attaining the ceiling must RISE monotonically. A quantity that fails to
        move as the parameter meant to compress it increases is the canonical
        artifact tell.
      - >-
        ORDERING CONTROL. The null probes and the reference-rank agreement check
        are run and their verdicts committed BEFORE any census number is looked
        at.
      - >-
        ARCHIVE CHECK. No prior environment receipt exists in
        coordination/goals/GOAL-AES-001; the tooling claims live in prose fields
        of the goal and question records with no command, no output and no
        timestamp. That ABSENCE is the finding and is recorded as an absence.
    required_metrics:
      - per-probe command, exit code, stdout, timestamp, git commit, container identifier if available
      - the two AES implementations used for pinning, named, with the vector set and agreement count
      - reference-vs-numpy rank agreement count out of 200, with the seed
      - J distribution per kernel dimension with sample sizes, seeds, and coverage fraction
      - a plain statement of which committed assertions the receipt contradicts, with their paths

  falsification_conditions:
    - >-
      numpy absent inside a dispatched task. The headline is wrong for the
      environment that matters and must be withdrawn.
    - >-
      pycryptodome present inside a dispatched task. Claim (2) is withdrawn and
      RQ-AES-001's gate stands as written.
    - >-
      The null probe returns success for sympy or failure for json. Nothing may
      be recorded from the audit at all.
    - >-
      numpy and the pure-Python reference disagree on any of the 200 rank
      checks. No census number may be reported.
    - >-
      The two available AES implementations disagree on any FIPS-197 vector.
      This halts the campaign's ground truth and is INFRASTRUCTURE SIGNAL, never
      a statement about AES (AGENTS.md rule 5).

  confounders:
    - >-
      CONTAINER DRIFT. The measuring session and the dispatched task may not
      share an image; this is named in assumptions and is the reason stage 1
      re-measures inside the task rather than trusting this record.
    - >-
      STATUS CODE VERSUS DOCUMENT. A 200 can be a block page. No document claim
      is made anywhere in this record and no figure is taken from any fetched
      page.
    - >-
      PROXY STATE. The outbound path is a configured agent proxy; its state can
      change between sessions, so the network coordinates are timestamped
      observations and not a property of the harness.
    - >-
      AUTHORSHIP ASYMMETRY. Contradicting a committed record reads as rigour and
      is cheap. The null probe and the falsification conditions exist so the
      audit can come out the other way, and the record states plainly that the
      committed blocker may be right about the dispatch environment.

  interpretation_limits:
    - >-
      NOTHING HERE IS A RESULT ABOUT AES. It is a measurement of a container and
      a set of contradictions against committed prose. It supports no
      distinguisher, no key recovery, no barrier, and no claim at any round
      count.
    - >-
      NO COMMITTED FILE IS EDITED, and none may be edited on the strength of
      this record. Correcting GOAL-AES-001's next_action, its verified_tooling,
      or RQ-AES-001's constraints and provenance are COORDINATOR ACTS requiring a
      superseding record under AGENTS.md rule 4. This record supplies the
      measurement; it does not perform the correction.
    - >-
      A discharged spec-pinning gate is a REPRODUCIBILITY FACT and authorizes no
      promotion, exactly as EV-AES-001 records for the BATCH-001 harness.
    - >-
      The HEUR-806-1 census result, if obtained, validates or falsifies ONE
      numbered heuristic of a cost model that DEC-20260731-029 has already
      STRUCK as unusable. It does not revive that table, and citing it toward
      any cost claim is forbidden by that decision.

  heuristic_assumptions:
    - id: HEUR-78D-1
      statement: >-
        NONE LOAD-BEARING. Every claim in this record is an observed exit code,
        an observed version string, or an observed HTTP status. There is no
        distributional assumption, no random model and no asymptotic claim. This
        entry exists to say so explicitly rather than leave the field empty.
      rigorous_support: n/a -- measurement, not inference.
      validation_plan: >-
        Re-run inside the dispatched task with a committed receipt; the null and
        positive controls above are the validation.

  target_complexity:
    time_exponent: >-
      n/a for this audit. NO EXPONENT IS MOVED. Stated plainly per the generation
      contract: this proposal moves no exponent and does not pretend to. It is
      worth running because it costs under a minute, because it decides whether
      the campaign's rank-2 item runs or is declared out of scope, and because
      one of the two remaining batches is the last that may open new questions.
    memory_exponent: n/a.
    best_known: n/a -- no algorithm, no comparison.
    hidden_overhead: >-
      The GF(2^8) census in stage 3 has a real cost that must be charged rather
      than hidden: 16,843,009 dim-1 kernels is the full stratum, and any partial
      coverage must be reported as a coverage fraction rather than as a
      distribution.
    tradeoff_note: n/a.

  dominated_by: >-
    null, after checking, and the rows checked are listed. There is no
    algorithm, so TIME, MEMORY and DATA/QUERIES frontiers do not apply and are
    not silently ignored -- they are inapplicable and the record says which.
    On the question actually answered (what does this container contain), rows
    checked: coordination/goals/GOAL-AES-001 in full for any committed
    environment receipt (none exists); ledger/goals/GOAL-AES-001.yaml
    environment_context (prose, no command, no output, no timestamp);
    ledger/questions/RQ-AES-001.yaml constraints (prose); the four BATCH-004
    task directories for any dependency probe (none). No prior measurement
    exists to dominate this one. Absence of a search result is not evidence
    nothing was tried.
  sota_delta: >-
    ZERO on every attack axis. Quantitatively, where a number exists: it
    converts ONE declared infrastructure blocker (numpy) from BLOCKING to
    ABSENT, which returns to the campaign the GF(2^8) legs of the rank-2
    non-deferrable item -- an item DEC-20260731-030 says settles four red-team
    findings (RT-1, RT-2, RT-3, RT-5) in one bounded task; and it identifies ONE
    hard gate (RQ-AES-001 constraint 1) as unsatisfiable as written before it
    blocks the campaign's terminal measurement rather than after. Cost: under one
    minute of compute for stage 1.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.90 that all three measured facts reproduce inside a dispatched task. Not
    higher because container drift between the measuring session and the
    dispatch environment is a real and unexamined possibility, and because the
    ANGLE-BRIEF records two independent scouting sweeps disagreeing about
    exactly this environment -- which is direct evidence that the environment is
    not stable across sessions, and is the reason this proposal exists rather
    than an argument that it is unnecessary. Not lower because each fact is a
    single deterministic command whose output was read directly, and because the
    two facts most consequential for scheduling (numpy present, pycryptodome
    absent) point in OPPOSITE directions from each other, which is not the
    pattern of a systematic measurement error.
