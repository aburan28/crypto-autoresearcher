idea:
  id: IDEA-20260905-f5f0c0
  title: Stationary collision mass separates quotient gain from walk trapping
  class: mechanism
  claim: 'For a quotient walk with a disclosed transition matrix, the independent-sample collision mass sum pi_i^2
    is a useful baseline only after temporal return probabilities are controlled. Conjecture: an apparent excess
    above the automorphism discount can be decomposed into stationary imbalance and short-return clustering, with
    no remaining exponent claim.'
  mechanism: Orbit cardinality alone predicts a uniform effective state count. A real quotient can have stabilizers,
    uneven transition probabilities and short cycles. The inverse collision mass is a Renyi effective size, but
    fast repeated visits may carry no new independent collision information. Track the stationary mass alongside
    the sum of excess return probabilities through a fixed horizon. A Green-kernel correction is the proposed object;
    the hard lemma connects it to nontrivial collision timing without confusing all recurrences with usable collisions.
    This supplies a mathematical ceiling diagnostic for a lane explicitly limited to baseline calibration.
