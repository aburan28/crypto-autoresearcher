    direction: different
    minimum_effect: The short-return correction grows as trapping increases even when sum(pi_i^2) is unchanged;
      the uniform memoryless case recovers the ordinary birthday scale.
  minimal_test:
    design: Compare exact transition matrices of cycles, lazy complete graphs and a self-generated automorphism
      quotient on at most 32 states. Increase laziness and add a planted two-cycle while holding the number of quotient
      states fixed.
    proposal_only: true
    controls:
