idea:
  id: IDEA-20261018-c49f37
  question_id: RQ-DREG-d7b6d6
  added: '2026-10-18'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    One Fourier family couples the isogeny class to the descended system: exact class-yield covariance,
    b-independent first fall, and an N-scaling tail test for an exponent-moving class effect
  class: mechanism
  claim: >-
    Hand-derived, nothing executed. (T1) In the binary 2-decomposition system the curve enters only as additive
    constants, so the Dubois-Gama first fall degree is the same for every curve with a nonempty fibre (closing the
    first-fall branch for this family; exceptions only where a generator combination is constant). (T2) With s(b) the
    fibre size of F_r on V x V and K(b) the Kloosterman function whose level sets are the classes,
    Cov_b(K,s) = 2^-N sum_{lambda != 0} (-1)^{Tr(1/lambda)} W(lambda) exactly, and the yield of every class is the
    pushforward histogram of K(F_r(u)) over V^2. Claim: for N = 9..21 the class-to-class dispersion of yield equals its
    sampling value (ratio R_N near 1, no trend in N) and max_b s(b)/s_bar stays within twice the Poisson envelope.
  mechanism: >-
    PAIR. R1 (F_2-bit coordinates, x-labels in a window V); Sigma = additive characters psi_lambda(b) and the Galois
    action, not group translation. Trichotomy: coordinate-dependent. Lossy-projection test: the object s(b) is a count
    that forgets which pairs solve; psi_lambda diagonalise translation b -> b+delta on the b-line, so the discard
    commutes with Sigma. K has flat Fourier coefficients of modulus 1 and s has weights 2^{2k-rank}; the class couples
    only through their overlap. Priced by one length-2^N pass. Factor base: explicit subspace, KN-OPEN-020 not entered.
  novelty_status: unverified
  citations:
    - {ref: IDEA-20260811-7734c5, provenance: internal, claim: "Fourier flatness of a factor base over a prime-field class", verified_by: idea-generator}
    - {ref: H-SEMBIN-83a856, provenance: internal, claim: "trace-parity confinement of binary yield", verified_by: idea-generator}
    - {ref: KN-LIT-7604, provenance: internal, claim: "first fall degree 2 from a group morphism to F_2", verified_by: idea-generator}
    - {ref: "Daykin 1960; Katz", provenance: recalled, claim: "Hankel rank count over F_q; Kloosterman equidistribution", verified_by: null}
  assumptions:
    - No shell this session. Identities are exact algebra but unrun; the envelope is heuristic.
  proof_search_map:
    bottleneck: whether any class-dependent quantity can reach an exponent-relevant size
    method_ceiling: second moments only; rare-family tails need the measured histogram, not Chebyshev
  predictions:
    - metric: "abs(Cov enumerated - Cov from the Walsh sum)"
      direction: lower
      minimum_effect: "0 up to the single b=0 term, blocking"
    - metric: "R_N = class-yield dispersion over its sampling s.d., per N"
      direction: different
      minimum_effect: "R_N in [0.8, 1.25] for all N; a trend above 1.5 by N=17 is a coupling"
    - metric: "max over b of s(b)/s_bar against the Poisson 0.999 quantile ratio"
      direction: lower
      minimum_effect: "at most 2x the Poisson ratio at every N; 2^{cN} growth reopens the yield channel"
  minimal_test:
    design: >-
      For N in {9,11,...,21}, k=(N+1)/2, polynomial window V, 4 targets r: one Walsh transform gives K; histogram F_r
      over V^2 gives s(b) and Y(kappa); Cov and Var by enumeration and by the Walsh sums; tails and R_N. A trace-confined
      V (in ker Tr) is the planted positive: the lambda_0 term must appear as +-s_bar in Cov.
    controls: [random F_2-subspace V of equal dimension, trace-confined V, Poisson null, shuffled K labels]
    required_metrics: [Cov, Var, R_N, tail histogram, max ratio, class sizes, V in ker Tr flag]
  falsification_conditions:
    - Enumerated and Walsh covariance differ. Algebra or code is wrong, stop.
    - The trace-confined planted positive shows no lambda_0 term. The instrument has no power.
    - R_N stays in [0.8, 1.25] and the tail ratio below 2 at every N. No yield coupling at this scale.
  confounders:
    - r in V.V or not changes the rank law (Daykin exact only if 2k-1 <= N and r not in V.V).
    - Fixed V and r are one factor-base position; 4 targets and a random V are the replicate.
  interpretation_limits:
    - Relation yield, not Groebner degree. It is the intrinsic side of a degree comparison, not a degree result.
    - Toy fields N <= 21, polynomial windows; no ECDLP exponent. First-fall closure is for this family only.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For polynomial-basis V the rank of Tr(c x1 x2) on V x V is distributed as the rank of a uniform k x k Hankel
        matrix over F_2, so Var(s) is at most s_bar (3k+2)/2.
      rigorous_support: >-
        Daykin (recalled): the number of k x k Hankel matrices of rank j is 3 * 2^{2j-2} for 1 <= j < k.
      validation_plan: >-
        Enumerate the rank spectrum over all c for N 9..21 (free); compare exact Var(s) with the envelope; record where
        2k-1 > N-1 voids exactness.
    - id: H2
      statement: >-
        The signs (-1)^{Tr(1/lambda)} are pseudo-random against the signs of W(lambda), so Cov(K,s) is of order
        2^{-N/2} times the product of standard deviations.
      rigorous_support: Katz-type equidistribution of Kloosterman sums (recalled); exact for the identity only.
      validation_plan: The exact Walsh sum at each N against a shuffled-sign null of 1000 draws.
  target_complexity:
    time_exponent: measurement only, O(N 2^N) per target with 2^{N+1} evaluations; N=21 about 4e7 operations
    memory_exponent: 2^N bytes for the K table
    best_known: Pollard rho about 2^{N/2}; no algorithm claimed
    hidden_overhead: none; no Macaulay matrix is built
