idea:
  id: IDEA-20260920-18dc28
  question_id: RQ-SATIC-1ae57a
  added: '2026-09-20'
  status: proposed
  approved_by: null
  title: Combined arm -- WDSat symmetry breaking plus 2/4-torsion symmetrization plus coset-typed factor bases on binary curves
  class: measurement
  claim: >-
    Trimoska-Ionica-Dequen list as future work testing WDSat on the simplified
    system obtained from the 2-torsion and 4-torsion action on the factor base;
    Galbraith-Gebregiyorgis's symmetry-breaking factor bases are the third trick
    on the same slide deck. No published or in-repository run combines all three
    on one descended predicate. The program's own SATIC conclusion is that the
    search exponent is m*l - log2|G| and solver engineering cannot move it; this
    arm exists to measure how much of the constant factor the combination
    recovers and to confirm that the exponent is unchanged -- a low-priority
    bookkeeping measurement, not a lead.
  mechanism: >-
    Descend the torsion-symmetrized summation polynomial (t = x + b/x or the
    binary analogue) over F_2 with coset-typed factor bases V + v_i, encode as
    CNF-XOR, run WDSat with its solving-process symmetry breaking, and compare
    against each trick alone on the same targets.
  novelty_status: unverified
  origin:
    kind: user_supplied_idea
    date: '2026-09-20'
    scope: Remaining Galbraith-slide combination not yet measured.
    overlap_review: >-
      Overlaps IDEA-20260918-c05e71 (coset typing, solver-degree) and the SATIC
      hypotheses (WDSat correctness/attribution). This is their conjunction with
      torsion symmetrization added; if the coordinator judges the SATIC exponent
      conclusion sufficient, this record should be closed as dominated.
  citations:
    - ref: https://eprint.iacr.org/2019/313.pdf
      provenance: recalled
      claim: '"It would also be interesting to test the performance of sat solvers on the simplified system obtained by considering the action of 2-torsion and 4-torsion points on the factor base."'
    - ref: inputs/GG-2014-806/paper_fulltext.txt
      provenance: recalled
      claim: Galbraith-Gebregiyorgis symmetry-breaking factor bases and SAT experiments; already frozen in the repository.
  citation_note: Recalled; the executor reads the frozen GG-2014 text and the SATIC-TRIMOSKA-2019 package.
  assumptions:
    - Same curve, targets, l, m across arms; same verifier.
    - Constant-factor claims only; the exponent m*l - log2|G| is the null.
  proof_search_map:
    bottleneck: Whether the three savings compose or overlap (they may all be removing the same |G| factor).
    baseline_embedding:
      parameter_slice: WDSat alone on the Trimoska benchmark cells.
      reproduction_check: Reproduce a published WDSat cell within 2x.
    observation_collision:
      observable: Time-to-solution, conflicts, and the fitted exponent across an l ladder per arm.
      distinct_preimage_search: Randomized typed null as in c05e71.
    constructive_transforms:
      - transform: composition_of_symmetry_removals
        proposed_object: Torsion-symmetrized, coset-typed CNF-XOR predicate under WDSat symmetry breaking
        predicted_gain: Constant factor only; no exponent change
    quantifier_order: There exists a preregistered l-ladder on which all four arms are run on identical targets.
    method_ceiling:
      strongest_certifiable_claim: A measured constant factor and an unchanged fitted exponent.
      nearby_object_control: Each trick alone.
    proof_obligations:
      - claim: Fitted exponent per arm reported with confidence interval.
        responsibility: cost-model
  predictions:
    - metric: fitted_exponent_change
      direction: flat
      minimum_effect: No arm changes the fitted exponent by more than its confidence interval.
    - metric: constant_factor_combined_over_best_single
      direction: lower
      minimum_effect: Combined arm at most 4x faster than the best single trick, and possibly no faster.
  minimal_test:
    design: Four arms on the existing SATIC benchmark cells across l in {6,7,8}; fit exponents.
    controls:
      - Published WDSat cell reproduced.
      - Randomized typed null.
    required_metrics:
      - wall_seconds_per_arm
      - conflicts_per_arm
      - fitted_exponent_per_arm
      - verified_relations
  falsification_conditions:
    - The combined arm changes the fitted exponent (would contradict the SATIC conclusion and become a lead).
  confounders:
    - Different clause counts across arms confounding solver behaviour.
  interpretation_limits:
    - Constant factors on toy binary cells; no cryptographic-scale claim.
  heuristic_assumptions: []
  heuristic_note: None.
  target_complexity:
    time_exponent: m*l - log2|G| (null).
    memory_exponent: Not applicable.
    best_known: Trimoska WDSat cells.
    hidden_overhead: Symmetrized polynomial construction over F_2.
    tradeoff_note: Bookkeeping; likely dominated.
  estimated_cost:
    implementation: low
    compute: low
    qualification: SATIC tooling exists.
  dominated_by: unchecked
  sota_delta:
    time: Unmeasured.
    memory: Unmeasured.
    data_queries: Not applicable.
  frontier_check:
    status: pending
    note: Check Trimoska's thesis for whether the combination was already run.
  recommended_priority: low
  priority_rationale: Closes the last untested combination from the slide deck cheaply; expected result is a constant factor.
  first_deliverable: Four-arm run on existing SATIC cells.
  next_gate: Coordinator decides dominated-or-run.
