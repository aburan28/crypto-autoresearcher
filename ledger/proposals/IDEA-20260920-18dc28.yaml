idea:
  id: IDEA-20260920-18dc28
  question_id: RQ-GFPN-4ab8c7
  added: '2026-09-20'
  status: proposed
  approved_by: null
  title: >-
    Trimoska future-work combo on GFPN curves — WDSat + torsion symmetrization
    + coset typing; expect constant-factor only
  class: algorithm
  claim: >-
    Trimoska's stated future work combining WDSat with torsion symmetrization
    and coset typing, applied to the EcGFp5 / EcMasFp5 n = 5 setting, is
    predicted to yield at most a constant-factor PDP improvement — not an
    exponent move. A bounded experiment either confirms constant-factor-only or
    falsifies that expectation with a measured scaling trend.
  mechanism: >-
    Reuse ICPERF/WDSat tooling and the already-opened coset / torsion-quotient
    instruments (IDEA-20260918-c05e71, IDEA-20260918-7a11c2) as libraries, not
    as re-proposals. Run a small combined-arm cell on GFPN toy-p instances;
    score complete cost against S_5-only WDSat. Do not open coset or torsion
    avenues as standalone GFPN ideas.
  novelty_status: unverified
  origin:
    kind: user_supplied_idea
    date: '2026-09-20'
    scope: GFPN intake low priority; token 18dc28 fixed by user.
    overlap_review: >-
      Explicitly reuses SEMBIN/ECDLP openings rather than duplicating them.
      Coset bases and torsion quotients remain not-opened under GFPN.
  citations:
    - ref: research/gfpn_ecmas_ecgfp5_intake_20260920.md
      provenance: internal
      claim: User lists Trimoska future-work combo as low priority, constant-factor expected.
      verified_by: intake note
    - ref: ledger/goals/GOAL-ICPERF-e6b6a4/goal.yaml
      provenance: internal
      claim: WDSat / Trimoska EC-Index-Calculus benchmark lineage in this program.
      verified_by: repository
    - ref: ledger/proposals/IDEA-20260918-c05e71.yaml
      provenance: internal
      claim: Coset-typing instrument already opened elsewhere.
      verified_by: repository
    - ref: ledger/proposals/IDEA-20260918-7a11c2.yaml
      provenance: internal
      claim: Torsion-quotient instrument already opened elsewhere.
      verified_by: repository
  citation_note: Exact Trimoska future-work wording should be quoted from a frozen ICPERF source before approval.
  assumptions:
    - Combined arm uses the same verifier and cost ruler as ICPERF cells.
    - Constant-factor prediction is falsifiable by a scaling trend across ≥3 sizes.
  proof_search_map:
    bottleneck: Whether combining three known engineering tricks moves the exponent.
    baseline_embedding:
      parameter_slice: WDSat S_5-only on the same GFPN toy instances.
      reproduction_check: Reproduce one ICPERF WDSat regression cell before GFPN combo cells.
    observation_collision:
      observable: Complete cost per verified relation vs baseline.
      distinct_preimage_search: Combo arm, each feature alone, and a shuffled-feature null.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: WDSat + torsion symmetrization + coset typing together.
        predicted_gain: Constant-factor only (user prior); exponent move would falsify.
    quantifier_order: Baseline WDSat cells before combo cells.
    method_ceiling:
      strongest_certifiable_claim: Scoped constant-factor comparison on toy-p GFPN instances.
      nearby_object_control: Binary-field Trimoska instances where WDSat is already measured.
    proof_obligations:
      - claim: Combo does not silently change the mathematical relation predicate.
        responsibility: correctness
      - claim: Cost accounting matches ICPERF phase definitions.
        responsibility: runtime
  predictions:
    - metric: combo_speedup_vs_wdsat_s5
      direction: lower
      minimum_effect: >-
        Median complete-cost ratio in (1.2, 4.0] across three sizes (constant-factor
        band), or a documented exponent-like trend that falsifies the prior.
  minimal_test:
    design: Three toy-p n = 5 GFPN cells; arms = baseline WDSat, combo, single-feature ablations; ICPERF cost ruler.
    controls:
      - Feature-ablation arms.
      - ICPERF regression cell.
    required_metrics:
      - total_cost_per_verified_relation
      - speedup_ratio
      - scaling_slope_across_sizes
  falsification_conditions:
    - Scaling slope indicates an exponent improvement beyond constant-factor (prior false; escalate priority).
    - Combo fails to beat baseline by ≥20% at any size (avenue weakens to engineering noise).
  confounders:
    - Re-tuning solver flags between arms.
    - Counting only SAT conflicts when baseline and combo use different encodings.
  interpretation_limits:
    - Toy-p constant-factor wins do not transfer to cryptographic p without a model.
  heuristic_assumptions:
    - WDSat performance characteristics measured under ICPERF continue to hold on GFPN encodings.
  heuristic_note: Prior of constant-factor-only is a user expectation to test, not a theorem.
  target_complexity:
    time_exponent: No exponent claim; constant-factor prior.
    memory_exponent: Unknown.
    best_known: ICPERF WDSat baseline on analogous PDP instances.
    hidden_overhead: Encoding glue between torsion/coset features and WDSat.
    tradeoff_note: Engineering complexity may erase constant-factor gains.
  estimated_cost:
    implementation: medium
    compute: medium
    qualification: Depends on reusable coset/torsion instruments being runnable.
  dominated_by: unchecked
  sota_delta:
    time: Expected constant-factor only.
    memory: Unmeasured.
    data_queries: Unmeasured.
  frontier_check:
    status: pending
    note: Must not duplicate 2026-09-18 openings; GFPN combined-arm only.
  recommended_priority: low
  priority_rationale: User-rated low; expected constant-factor; runs after high/medium GFPN work.
  first_deliverable: Combo-arm contract citing ICPERF regression + ablation plan.
  next_gate: After high-priority GFPN designs; confirm Trimoska future-work quote from frozen source.
