idea:
  id: IDEA-20260816-77e7d2
  question_id: RQ-MQOM-001
  added: '2026-08-16'
  title: 'One parameterized MPC-in-the-head accounting expression, three parameter shapes: instantiate
    the same soundness-and-size inequality with SDitH-shaped, FAEST-shaped and MQOM-shaped tuples,
    then classify every slack term as paradigm-level if it survives all three shapes or scheme-level
    if it survives exactly one.'
  class: control
  claim: '(A) THE SHARED EXPRESSION EXISTS AND IS SMALL. The security-versus-size accounting used
    across the MPC-in-the-head family can be written as one expression E(lambda, N, tau, tree_shape,
    grind_bits, field_size, opening_cost, relation_soundness) in which SDitH, FAEST and MQOM differ
    only in which arguments they bind to constants and which they leave free. The claim is that the
    number of free arguments is at most eight and that no scheme in the family needs a ninth argument
    to state its per-repetition soundness error and its signature-size formula in the same breath.
    (B) THE ATTRIBUTION RULE IS DECIDABLE, NOT RHETORICAL. Define slack S(shape) = claimed_bits(shape)
    minus E evaluated at that shape. A term of E is PARADIGM-LEVEL if perturbing it changes S by more
    than a declared threshold under all three parameter shapes, and SCHEME-LEVEL if it does so under
    exactly one. This is a finite sensitivity computation over a fixed expression, not an argument
    about the schemes, and it terminates in seconds in exact rational arithmetic. (C) THE INTERESTING
    OUTPUT IS THE PARTITION, NOT THE SLACK. Whatever S turns out to be, the deliverable is the two-column
    table naming which accounting terms are properties of the proof paradigm and which belong to one
    underlying problem. That table is what the three-candidate coincidence buys, and this program
    has never written it: every existing bucket record analyses one scheme at a time. (D) WHAT IS
    NOT CLAIMED. This claims NO forgery, NO break, NO speedup and NO security consequence for any
    deployed scheme. It does not assert that any published bound is wrong, loose or tight; S is a
    difference between a claimed number and a model, and a nonzero S is first evidence that the MODEL
    omits a term. It asserts nothing about what the published specifications contain: the three parameter
    shapes entering the computation are ILLUSTRATIVE until a Stage 0 filing records real ones, and
    every reported number is labelled with which. It does not treat the underlying hard problems (syndrome
    decoding, AES one-wayness, random MQ) as the object; relation_soundness enters E as an opaque
    scalar and is never estimated here.'
  mechanism: 'STAGE 1 writes E as a Python function over Fraction inputs, in three independently authored
    pieces that must agree: a per-repetition soundness term, a repetition-composition term, and a
    size term in bytes. Disagreement between the three authorships at any shape halts the lane; agreement
    is the instrument''s first calibration. STAGE 2 populates three parameter shapes. Because no specification
    has been read by this program, each shape is generated as a plausible tuple in the declared family
    (small-field code shape, binary AES-circuit shape, small-field MQ shape) and marked ILLUSTRATIVE;
    a Stage 0 filing of a real tuple supersedes it without changing any code. STAGE 3 runs the sensitivity
    sweep: perturb each argument of E by a fixed relative step, record dS/dargument at each of the
    three shapes, and sort terms into the paradigm column (nonzero at all three) and the scheme column
    (nonzero at exactly one). STAGE 4 runs the null shape: a fourth tuple drawn uniformly from the
    declared argument box, carrying no scheme identity. A term that lands in the paradigm column for
    the three real-ish shapes AND for the random tuple has been shown to be a property of the EXPRESSION
    rather than of the family, and is demoted to a fifth column labelled artifact-of-model. This demotion
    step is the whole reason the null shape is run in the same invocation. STAGE 5 emits the table
    with every cell carrying its shape provenance (illustrative or filed) and the exact rational value
    of the derivative. Refutation is cheap: if fewer than two terms survive into the paradigm column
    after the artifact demotion, the coincidence of three schemes sharing a paradigm buys nothing
    at the accounting level, and that is the measured obstruction.'
  novelty_status: unverified
  novelty_screen:
    method: 'Ran in ledger/proposals: grep -rli for SDitH, FAEST, MQOM, MPCitH, VOLE, grinding, soundness
      error, Fiat-Shamir, GGM tree, seed-tree, repetition. Read in full the titles and class fields
      of IDEA-20260805-bf6448, IDEA-20260808-aa551f, IDEA-20260808-721f2b, IDEA-20260805-7abf04, IDEA-20260805-38048d,
      IDEA-20260731-002, IDEA-20260731-003, IDEA-20260731-005, IDEA-20260731-019, IDEA-20260805-59fa23,
      IDEA-20260808-e8586d, IDEA-20260805-cec9b6, IDEA-20260805-7d97be, IDEA-20260808-95a21c, IDEA-20260801-005.
      Read ledger/questions/RQ-SDITH-001.yaml, RQ-FAEST-001.yaml, RQ-MQOM-001.yaml, RQ-WFS-e776b6.yaml
      in full and ledger/hypotheses/H-SDITH-d37289.yaml. Listed ledger/hypotheses for FAEST, MQOM,
      SDITH prefixes.'
    results: 'Every bucket proposal found analyses ONE scheme: IDEA-20260805-7abf04 is an MQOM-only
      zero-slack ledger, IDEA-20260805-bf6448 is an MPCitH grinding interior optimum checked against
      SDitH, IDEA-20260808-aa551f is an MQOM GGM-tree challenge-space count, IDEA-20260731-002 is
      a FAEST-only multi-round forgery cost model. IDEA-20260805-7d97be is the only cross-scheme record
      found and it runs in the opposite direction: it uses MQOM as a NULL OBJECT for structured-MQ
      attacks, i.e. the hard problem is its object, not the proof layer. No record in ledger/proposals
      was found that instantiates one accounting expression at three shapes, and no record was found
      containing an attribution rule separating paradigm-level from scheme-level terms.'
    verdict: 'UNVERIFIED. No agent here can read external literature, so nothing is asserted about
      what is published. Assembled from known parts: sensitivity analysis of a cost expression, exact
      rational arithmetic, and the program''s own null-shape discipline are all standard and are all
      already used in H-SDITH-d37289. Claimed new relative to THIS repository only: the decidable
      paradigm-versus-scheme attribution rule applied to a single shared expression at three shapes
      at once, plus the artifact-of-model demotion column driven by a random fourth shape.'
  object_first_candidate:
    tracked_object: 'The slack vector S = claimed_bits minus E, together with its gradient dS/dargument,
      followed as the parameter shape is moved from one scheme-like tuple to another. The object is
      the GRADIENT, not the scalar: a number carries no attribution, a gradient does.'
    lossiness: 'Genuinely lossy. E collapses each underlying relation to a single scalar relation_soundness
      and discards the entire algebraic content of syndrome decoding, AES and MQ; it discards the
      concrete hash function, the field representation, the message, and the key. What survives is
      exactly the arithmetic that the accounting practice performs on those numbers, and that arithmetic
      propagates because the composition of repetitions and the size formula are functions of the
      retained arguments alone. The discard is compatible in the required sense: no step of the accounting
      reads back into the discarded algebra.'
    propagation: One step of the target operation is one repetition of the proof. Under it, per-repetition
      soundness p maps to a composed error that the expression models multiplicatively, and size maps
      to size plus a per-repetition opening cost that depends only on tree_shape and N. So one step
      acts on the tracked pair (S, gradient) as an affine map whose coefficients are read off tree_shape
      and N and nothing else, which is the property being tested.
    survival_score: 'The structure survives as long as repetition composition remains multiplicative
      in the model. It dissolves at the first accounting feature that couples repetitions, which the
      model does not carry: shared salt, shared tree root, or an opening-size filter spanning repetitions.
      Concretely, S is expected to be a faithful description for tau up to the point where the coupling
      terms studied in this bucket enter, and the sweep records the tau at which the three independent
      authorships of E first disagree by more than one bit as the empirical dissolution point.'
  null_object_control: The fourth parameter shape drawn uniformly at random from the declared argument
    box, carrying no scheme identity, run through the IDENTICAL sensitivity sweep in the same invocation.
    For the signal arm to mean anything the null must place at least one term in a DIFFERENT column
    than the three scheme-like shapes do. If the random tuple reproduces the same paradigm column
    exactly, then the column is a property of the algebraic form of E and not of the family, and the
    entire signal arm is reported as a controlled null with no attribution content.
  discriminated_from:
  - 'IDEA-20260805-7abf04, the MQOM zero-slack ledger: it computes slack at MQOM''s own triples only
    and its deliverable is whether that one scheme carries reserve. This computes a GRADIENT across
    shapes and its deliverable is a partition of terms; the single-scheme slack is an intermediate
    here, not the output.'
  - 'IDEA-20260805-7d97be, which uses MQOM as a null object: its object is the underlying MQ instance
    and the arms are structured-versus-unstructured hard problems. This record forbids itself from
    touching the hard problem at all; relation_soundness is an opaque scalar.'
  - 'IDEA-20260731-002, the FAEST multi-round forgery cost model: single-scheme, and its output is
    a cost charged against an AES baseline. No baseline is charged here and no attack cost is produced.'
  - A plain literature-comparison table of the three schemes' quoted parameters. That would assert
    what specifications contain; this asserts only what a declared expression does under perturbation,
    with all shapes labelled illustrative until filed.
  assumptions:
  - The three parameter shapes are ILLUSTRATIVE. No specification has been read by this program (RQ-MQOM-001
    provenance block), so every number entering E is a plausible tuple in the declared family until
    a Stage 0 filing supersedes it.
  - Repetition composition is multiplicative in the accounting practice being modelled. Where it is
    not, the model is wrong in a way the three-authorship disagreement check is designed to expose
    rather than hide.
  - relation_soundness can be treated as one scalar per scheme. If a scheme's relation contributes
    a soundness term that depends on the challenge, the scalar abstraction fails and the lane reports
    that failure as its result.
  - Exact rational arithmetic is available and sufficient; no floating-point comparison decides a
    column assignment.
  - A relative perturbation step is a meaningful sensitivity probe for an expression with mixed integer
    and real arguments. Integer arguments are perturbed by plus or minus one and reported in a separate
    column.
  predictions:
  - metric: number of terms in the paradigm column surviving the artifact-of-model demotion
    direction: higher
    minimum_effect: 2
  - metric: number of terms landing in the scheme column for exactly one shape
    direction: higher
    minimum_effect: 1
  - metric: maximum absolute disagreement in bits between the three independent authorships of E at
      any shape
    direction: lower
    minimum_effect: 1
  - metric: fraction of columns the random null shape reproduces identically
    direction: lower
    minimum_effect: 'refuse to pre-commit: this is the quantity the null is run to measure and pre-committing
      a value would convert the control into a target'
  minimal_test:
    design: 'Write E three times, by three separate code paths, in Fractions. Populate four tuples:
      three scheme-like and one uniform-random from the declared box. For each tuple, evaluate all
      three authorships and record pairwise disagreement in bits; halt the lane if any pair disagrees
      by more than one bit. Then perturb each of the eight arguments one at a time (relative step
      for reals, plus or minus one for integers), recompute S, and record the exact rational derivative.
      Assign each term to paradigm, scheme, or none by the declared threshold, then demote any paradigm
      term the random tuple also produces. Emit the four-column table with provenance labels. Total
      compute is a few thousand rational evaluations, seconds on one core, no cryptography executed
      and no instance solved. The discriminating power comes entirely from running the random tuple
      through the same code path in the same invocation.'
    controls:
    - The uniform-random fourth shape run in the same invocation through the identical sweep.
    - Three independent authorships of E whose mutual disagreement gates the lane before any attribution
      is reported.
    - A degenerate shape with tau equal to one, where repetition composition is the identity and every
      composition-derived term must vanish; a nonvanishing term there is an implementation bug, not
      a finding.
    - A shape with N equal to two, the smallest party count, where the per-repetition soundness term
      takes a hand-computable value that is checked against a fixture.
    required_metrics:
    - S in bits per shape, exact rational
    - dS/dargument per argument per shape, exact rational
    - column assignment per term per shape
    - pairwise authorship disagreement in bits
    - fraction of paradigm-column terms demoted by the null shape
    - count of arguments needed to state both formulas, per shape
  falsification_conditions:
  - Fewer than two terms survive into the paradigm column after demotion, i.e. the three-scheme coincidence
    buys no shared accounting structure at this level of abstraction.
  - The random null shape reproduces the paradigm column exactly, making the column a property of
    the expression rather than the family.
  - The three authorships of E disagree by more than one bit at any shape, which falsifies the claim
    that the expression is small and well-defined enough to author independently.
  - No single expression with at most eight free arguments can state both the soundness and size formulas
    for all three shapes; a ninth is needed.
  - The tau-equals-one degenerate control produces a nonvanishing composition term, invalidating the
    instrument.
  confounders:
  - Illustrative parameter shapes chosen, however unconsciously, to make the attribution come out
    clean. Mitigated by generating them from a declared box before the sweep is written and freezing
    them.
  - An expression E authored to be sensitive to the arguments the author already believes matter.
    Mitigated by the three-authorship gate and by the random shape.
  - Relative perturbation steps that are large enough to leave the regime where a derivative is meaningful.
    Mitigated by reporting two step sizes and flagging any column that changes between them.
  - The threshold separating nonzero from zero derivative doing all the work. Mitigated by reporting
    the raw rational derivatives so any reader can rethreshold.
  interpretation_limits:
  - A paradigm-level term is a property of the ACCOUNTING MODEL under three parameter shapes, not
    a proven property of the three schemes, and never a statement about their security.
  - With illustrative shapes the table describes a family of plausible tuples, not the deployed ones.
    Every claim is void as a statement about deployed parameters until Stage 0 files real values.
  - A nonzero S is evidence the model omits a term, and is equally consistent with the model being
    incomplete and with the claim being conservative. It is never evidence that a claim is wrong.
  target_complexity:
    time_exponent: 'No attack exponent is claimed. Compute is polynomial and trivial: O(arguments
      times shapes) exact rational evaluations.'
    memory_exponent: No attack exponent is claimed. Memory is a few kilobytes of rationals.
    best_known: The incumbent is the per-scheme accounting each specification performs for itself,
      and within this repository the single-scheme slack computations IDEA-20260805-7abf04 and IDEA-20260805-bf6448.
    hidden_overhead: 'The human cost of authoring E three times independently is the real budget,
      and the three-authorship gate can consume the whole lane if the accounting practice is not as
      uniform as claim (A) asserts. Also hidden: the Stage 0 filing of real parameter shapes is a
      literature task this environment cannot perform, so the table may remain provisional indefinitely.'
  dominated_by: 'n/a (no result claimed). Checked against the frontier rows this record could occupy:
    there is no time, memory or data axis on which this record places a point, because it produces
    no attack and solves no instance.'
  sota_delta: no attack; conceptual/measurement contribution only
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Part (A), that one expression with at most eight free arguments covers
    all three shapes: 0.55, because the family really is one paradigm at the level of soundness composition,
    but size formulas diverge and may need a ninth argument. Part (B), that the attribution rule terminates
    and produces a nonempty partition: 0.85, because it is a finite sensitivity computation whose
    only failure mode is degeneracy. Part (C), that at least two terms survive the null demotion into
    the paradigm column: 0.4, because a random tuple in the same box may well exercise the same terms,
    and that outcome is the most likely single result. Part (D) is a scoping statement and carries
    no probability.'
