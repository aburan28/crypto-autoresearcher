idea:
  id: IDEA-20260807-5ddd98
  question_id: RQ-GGMB-6eaabc
  added: '2026-08-07'
  title: >-
    THE ADJUDICATOR'S CONTROL CATALOGUE AND THE EMPTINESS OBSERVATION: a
    four-quadrant two-directional control set for the L12 instrument, whose most
    informative entry is the one that does not exist -- within the campaign's
    declared target family (ordinary, non-anomalous, large embedding degree,
    prime field, prime-order subgroup) I can name NO oracle that is both
    non-simulable and useful, so every in-scope NON-SIMULABLE verdict this lane
    issues is uncalibrated, and the three available positive controls all sit
    outside the family and each requires a NAMED GLOBAL STRUCTURAL COINCIDENCE to
    exist
  class: control

  claim: >-
    (A) WHY A CONTROL CATALOGUE IS NOT OPTIONAL. GOAL-ENDO-001 criterion C4
    requires every instrument supporting a conclusion to pass both directions of
    its RQ-INSTR-f8faa0 control: it must detect a planted signal and it must
    reject a matched null. The L12 adjudicator (IDEA-20260807-63056d) is an
    instrument. Without a control set, its verdicts are assertions.

    (B) THE FOUR QUADRANTS. An oracle is scored on two axes -- simulable or not,
    useful or not -- and the catalogue must populate all four cells, because an
    instrument that has only ever seen one cell cannot be shown to discriminate.
      QUADRANT I, SIMULABLE AND USELESS (must return SIM; these are the easy
        negatives): the pure group-operation oracle (T_sim = 1); the
        public-curve-data oracle (T_sim = 0); the constant oracle (T_sim = 0);
        the sham uniform-random-answer oracle (T_sim = 0); KN-FIND-b7e091's
        Oracle D, endomorphism images (T_sim = O(log N)); its Oracle C in VERIFY
        form (T_sim = O(m), Z = 1); the isogeny-transport oracle
        (IDEA-20260807-d73e83, T_sim = 0); the j-invariant and volcano-level
        oracles (IDEA-20260807-413fcc, T_sim = 0); the G x G pairing oracle
        (IDEA-20260807-569c82, T_sim = 0, and it is literally constant).
        ELEVEN entries, all with pre-registered verdicts.
      QUADRANT II, NON-SIMULABLE AND USELESS (must return PUB or PRIV, AND the
        adjudicator must state why the extra information buys nothing): Oracle A,
        the first-jet oracle -- PRIV, it needs k to evaluate; Oracle B, the
        elliptic-net oracle -- PUB, the adversary computes net values itself; the
        raw x-coordinate oracle -- PUB, the adversary holds the coordinates; the
        arity-1 factor-base membership oracle -- PUB, and its best algorithm
        costs N/(2 sqrt(L)) draws, minimised at exactly rho
        (IDEA-20260807-070d03). FOUR entries. THIS QUADRANT IS THE POINT OF THE
        WHOLE LANE: it is populated, it is populated by things the corpus already
        found, and its existence is why "non-simulable" is not progress.
      QUADRANT III, SIMULABLE AND USEFUL: ASSERTED EMPTY BY THEOREM. If an
        oracle is simulable with q*Z = o(N) then Shoup bounds the augmented
        algorithm at exponent 1/2, so it cannot be useful. This quadrant's
        emptiness is not an observation, it is the content of the closure, and
        an adjudicator that ever places an oracle here has contradicted itself
        and is void.
      QUADRANT IV, NON-SIMULABLE AND USEFUL: THE POSITIVE CONTROLS, AND THE
        SUBJECT OF (C).

    (C) THE THREE POSITIVE CONTROLS, AND WHAT EACH ONE COSTS TO EXIST.
      PC1 -- THE ANOMALOUS TRANSFER. On a prime-field curve with #E(F_p) = p, the
        formal-group / p-adic elliptic logarithm maps the order-p subgroup
        isomorphically onto (F_p, +) and the ECDLP falls in O(log p) field
        operations (Semaev; Satoh-Araki; Smart -- KN-TECH-033, KN-LIT-087/088/089).
        Non-simulable: the answer is not a function of lambda. Useful: linear
        time, the most decisive break available. NAMED COINCIDENCE: trace exactly
        1. IN a prime field; OUT of the target family.
      PC2 -- THE MOV/FREY-RUCK TRANSFER. On a supersingular prime-field curve
        with embedding degree 2, the pairing with a distortion map moves the
        ECDLP into F_{p^2}^* where index calculus is subexponential
        (KN-TECH-032, KN-LIT-084/085/086). Non-simulable: the answer lives in a
        different group. Useful: subexponential beats sqrt(N) at small k_emb.
        NAMED COINCIDENCE: supersingularity, giving k_emb <= 6 and a distortion
        map. IN a prime field; OUT of the target family.
      PC3 -- THE SUBFIELD DECOMPOSITION ORACLE, SCOPE-BOUNDARY CONTROL. Over
        F_{q^n}, the factor base {x in F_q} is cut out by n-1 LINEAR conditions
        after Weil restriction, so the arity-m decomposition system is
        Bezout-controlled and index calculus beats rho (IDEA-20260807-070d03 (F)).
        Non-simulable and useful. NAMED COINCIDENCE: the existence of a proper
        subfield. OUT of the prime-field scope entirely, and included precisely
        to mark that boundary.

    (D) THE EMPTINESS OBSERVATION, WHICH IS THIS RECORD'S ACTUAL DELIVERABLE AND
    WHICH IS STATED AT ITS HONEST CONFIDENCE. Within the campaign's declared
    target family -- prime field, ordinary, trace not equal to 1, embedding
    degree large, prime-order subgroup -- I CAN NAME NO ORACLE THAT IS BOTH
    NON-SIMULABLE AND USEFUL. Every positive control I can construct leaves the
    family through a named coincidence: trace one (PC1), supersingularity (PC2),
    a proper subfield (PC3). THE CONSEQUENCE IS UNCOMFORTABLE AND IS THE REASON
    TO FILE THIS: the L12 adjudicator has NO IN-SCOPE POSITIVE CONTROL, so it
    cannot distinguish "we adjudicated correctly and there is nothing here" from
    "our adjudication is blind to the thing we are looking for". Every in-scope
    NON-SIMULABLE verdict this lane issues is therefore uncalibrated in the
    strict sense, and the honest report of an in-scope negative must say so.
    STATUS OF THIS OBSERVATION: `unverified` in the sense of the Idea Generator
    contract. It rests on a check of this repository's curated corpus plus my own
    recall of the ECDLP literature. I did NOT perform an exhaustive external
    search. An absence-of-example claim from memory is exactly what the novelty
    discipline forbids being upgraded, and it is recorded here at that tier
    deliberately.

    (E) THE REUSABLE RULE THAT FALLS OUT, AND IT IS THE CAMPAIGN'S OWN. KN-TECH-033
    already states it for representations: "representations win exactly when the
    curve supplies a global structural coincidence, and a proposal must name its
    coincidence." Generalise it to oracles and make it a mandatory field:
      EVERY ORACLE PROPOSED IN THIS CAMPAIGN MUST NAME ITS COINCIDENCE -- the
      global structural fact about the curve that makes its answer both
      non-simulable and useful -- or be classified with Quadrant II by default.
    This is cheap, mechanical, and directly falsifiable: it predicts that over
    the campaign's lifetime the number of proposed oracles naming a genuine
    in-scope coincidence will be zero. One counterexample refutes it and would be
    the campaign's most valuable single object.

    (F) THE TWO-DIRECTIONAL REQUIREMENT, STATED AS A GATE. The adjudicator may
    support NO conclusion until it has: returned the eleven Quadrant I verdicts
    correctly; returned the four Quadrant II verdicts correctly INCLUDING the
    "why it buys nothing" statement; and, for each of PC1, PC2, PC3, returned
    non-simulable AND SURFACED THE IMPLEMENTING ALGORITHM AND ITS COST. The last
    clause is the hard one: an adjudicator that labels the Smart-attack oracle
    PUB and stops has technically classified it and has practically called a
    linear-time break harmless.

  resource_label: 'audit: consumes no resource'
  admissibility: admissible
  admissibility_argument: >-
    Consumes no resource; it is the calibration of the instrument that decides
    other lanes' resource claims. Its verdict on the ADMISSIBILITY FILTER itself
    is the record's sharpest content: the filter passes PC1, PC2 and PC3 -- all
    three consume genuine non-generic resources (R6, R7, R1 respectively) -- and
    all three are outside the target family. So the filter is demonstrably not
    vacuous, which is worth knowing, and it is demonstrably never yet been passed
    by an in-scope useful oracle, which is worth knowing more.

  discriminated_from:
    - >-
      IDEA-20260807-63056d, the adjudication procedure. That record defines the
      questions and lists a nine-oracle calibration set at reduced fidelity. This
      record supplies the full four-quadrant catalogue, the three positive
      controls with their coincidences, the coincidence-naming rule, and the
      emptiness observation. The procedure without this catalogue is an
      uncalibrated instrument; this catalogue without the procedure is a list.
      They must be scheduled together.
    - >-
      KN-TECH-033, which states the coincidence-naming principle for
      REPRESENTATIONS and identifies the anomalous case as "the existence proof
      for representation attacks". This record generalises the principle to
      ORACLES, makes it a mandatory field, adds the second and third positive
      controls, and adds the emptiness observation, which KN-TECH-033 does not
      state.
    - >-
      RQ-INSTR-f8faa0 / lane L14, which owns instrumentation and null objects for
      the campaign's MEASUREMENTS (variance, yield, solving degree). This record
      is the control set for the campaign's ADJUDICATOR, which is a different
      instrument measuring a different thing -- verdicts, not quantities. The two
      should share the decay-test discipline and nothing else.
    - >-
      KN-FIND-b7e091, which supplies four of the fifteen Quadrant I and II
      entries. This record does not re-derive them; it uses them as fixtures and
      adds eleven more.

  object_first_candidate:
    tracked_object: >-
      The CONTROL SET as an object: the map from oracle specifications to
      required verdicts, together with, for each positive control, the named
      coincidence and the decay parameter that destroys it.
    lossiness: >-
      LOSSY: each entry compresses an entire attack or non-attack into a
      (specification, required verdict, coincidence, decay parameter) tuple. What
      is discarded is the mathematics of each attack. What is retained is exactly
      what an instrument must reproduce to be trusted.
    propagation: >-
      Propagates under EXTENSION rather than under an algebraic operation: adding
      a new oracle to the campaign adds a row, and the required verdicts of
      existing rows must not change. That invariance under extension is the
      property being tracked, and it is checkable -- a new oracle whose addition
      changes an old required verdict indicates the catalogue's cells were not
      well defined.
    survival_score: >-
      Survives across lanes, across batches, and across any change of solver or
      curve family, because it is a set of specifications with required answers.
      Dies at a change of the simulator knowledge set (every Quadrant I verdict
      moves), at a change of the target family (the emptiness observation is
      family-relative and would have to be restated), and at the discovery of an
      in-scope Quadrant IV entry -- which would be the best possible death.

  mechanism: >-
    STEP 1 (zero compute) -- WRITE THE CATALOGUE. Fifteen negative/useless rows
    with pre-registered verdicts, three positive-control rows with their
    coincidences, all in the machine-readable oracle schema of
    IDEA-20260807-63056d Step 2. Freeze it.

    STEP 2 (zero compute) -- ATTACH A DECAY PARAMETER TO EACH POSITIVE CONTROL,
    which is what turns a control into a test rather than a demonstration:
      PC1 decay: the trace t, over {1, 2, 3, 5, 9, 17}. KN-TECH-033 records that
        the attack does NOT degrade gracefully -- it simply does not apply for
        t != 1. So the predicted decay is a CLIFF: success at t = 1, complete
        failure at t = 2. A control that shows graceful degradation is measuring
        something other than the additive transfer.
      PC2 decay: the embedding degree k_emb over {2, 3, 4, 6, 8, 12, ...}. The
        transfer's cost is L_{p^{k_emb}}[1/3, c] and grows subexponentially in
        k_emb * log p, so the predicted decay is SMOOTH and the crossing against
        0.886*sqrt(N) is a measurable point. A cliff here would be wrong for the
        opposite reason.
      PC3 decay: the extension degree n, over {1, 2, 3, 4}. At n = 1 there is no
        subfield and the advantage must VANISH ENTIRELY -- which is precisely the
        prime-field case and is the single most important rung, because it is the
        control that tells the campaign its own scope is where the advantage
        stops.
    THE THREE DECAY SHAPES ARE DIFFERENT -- cliff, smooth, vanish-at-n=1 -- and
    an instrument that produces the same shape for all three is not measuring the
    mechanisms, it is measuring itself.

    STEP 3 (toy compute, <= 45 minutes total) -- INSTANTIATE THE POSITIVE
    CONTROLS AT TOY SCALE. PC1: generate a trace-one curve at p <= 2^20 (findable
    by search since the condition is #E = p) and run the additive transfer; then
    run the identical code on t = 2, 3, 5 curves and confirm complete failure.
    PC2: generate a supersingular curve over F_p with k_emb = 2 at p <= 2^16 and
    verify the transfer produces a solvable F_{p^2}^* instance. PC3: build the
    subfield factor base over F_{q^2} and confirm the arity-3 decomposition is
    cheaper than over F_p at matched size (this is Arm D of
    IDEA-20260807-070d03 and should be shared, not duplicated).

    STEP 4 (zero compute) -- RUN THE ADJUDICATOR AGAINST THE FROZEN CATALOGUE and
    record its score: eighteen rows, eighteen verdicts, and for the three
    positive controls whether the implementing algorithm was surfaced.

    STEP 5 (zero compute) -- STATE THE EMPTINESS OBSERVATION AT ITS HONEST TIER,
    with the corpus check recorded, the external search explicitly NOT claimed,
    and the consequence for every in-scope negative spelled out. Add the
    coincidence-naming field to the campaign's oracle schema.

    STEP 6 (ongoing, zero compute) -- MEASURE THE COINCIDENCE-NAMING PREDICTION:
    count, over the campaign, how many proposed oracles name a genuine in-scope
    coincidence. Predicted zero; one non-zero is a discovery.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      ripgrep via the harness Grep tool (semantics of `grep -ril`), 2026-08-07,
      over knowledge/, ledger/, docs/, analysis/. Patterns: "anomalous|Smart
      attack|Satoh|trace one|trace 1|MOV|Frey-R|embedding degree"; "positive
      control|null object|two-directional|planted"; "Oracle A|Oracle B|Oracle C|
      Oracle D"; "coincidence".
    results: >-
      KN-TECH-032 and KN-TECH-033 supply PC2 and PC1 with full provenance,
      including their own honest "Verified vs reported" sections noting that the
      source papers were not read in full. KN-TECH-033 states the
      coincidence-naming principle for representations and explicitly frames the
      anomalous case as the existence proof that representation attacks can win.
      RQ-INSTR-f8faa0 and docs/inventor-protocol.md section 3 supply the
      two-directional control discipline. NO record assembles a control catalogue
      for the SIMULABILITY ADJUDICATOR, and no record states the emptiness
      observation for the target family.
    verdict: adaptation
  novelty_screen_note: >-
    ADAPTATION for the catalogue: every entry is drawn from records already in
    the corpus and the discipline is the inventor protocol's. The EMPTINESS
    OBSERVATION is separately labelled `unverified` per the Idea Generator
    contract, because it is an absence claim supported by a corpus check and
    recall rather than by an exhaustive external search. That distinction is
    load-bearing: the catalogue can be adopted immediately; the emptiness
    observation may be cited only at the `unverified` tier until someone does the
    external search, and doing that search is named as the follow-up.

  null_object_control: >-
    THIS RECORD IS A CONTROL, SO ITS OWN NULL IS A CONTROL-ON-THE-CONTROL, AND IT
    IS MANDATORY.
    NULL OBJECT: a SHAM POSITIVE CONTROL -- an oracle constructed to look like a
    positive control (non-simulable, exotic, with an impressive-sounding
    coincidence) but which provides no advantage. Concretely: the "trace-two
    additive transfer oracle", specified by analogy to PC1 on a t = 2 curve where
    the additive structure does not exist. The catalogue must classify it in
    Quadrant II, and an adjudicator that promotes it to Quadrant IV on the
    strength of its resemblance to PC1 is pattern-matching rather than
    adjudicating. This is the exact failure mode a control catalogue invites and
    it must be tested for.
    DECAY PARAMETERS: the three of Step 2, with their three DIFFERENT predicted
    shapes (cliff, smooth, vanish-at-n=1). Uniform shapes across the three is the
    artifact tell.
    SECOND NULL: run the whole catalogue with the simulator knowledge set
    deliberately corrupted (grant the simulator the coordinates of P and Q).
    Every Quadrant II entry must collapse to SIM. If they do not, the
    adjudicator is not actually using the knowledge set and its Quadrant I
    verdicts are accidental.

  assumptions:
    - >-
      The campaign's target family is: prime field, ordinary, trace not 1,
      embedding degree large, prime-order subgroup, single instance, no
      preprocessing. The emptiness observation is RELATIVE TO THIS FAMILY and is
      meaningless without it.
    - >-
      PC1 and PC2 rest on KN-TECH-033 and KN-TECH-032, both of which record that
      their source papers were not read in full here. The controls are used as
      ENGINEERING FIXTURES -- code that must produce a break at toy scale -- so a
      mis-relayed detail shows up as a failed fixture rather than as a silent
      error, which is the right way to use a relayed fact.
    - >-
      PC3 is out of the campaign's declared scope and may never appear in a
      conclusion about prime fields.
    - >-
      The emptiness observation is `unverified`: corpus check plus recall, no
      exhaustive external search. It may not be upgraded without that search.
    - >-
      Toy-scale instantiation of PC1 and PC2 is feasible in pure Python at
      p <= 2^20 and p <= 2^16 respectively. If it is not, the controls remain
      specifications and the adjudicator remains uncalibrated -- which must be
      reported, not worked around.

  proof_search_map:
    bottleneck: >-
      Step 3, instantiating PC1 and PC2 as running toy fixtures. Everything else
      is clerical. If no positive control actually runs, the catalogue is a list
      of names and the adjudicator is uncalibrated regardless of how many
      Quadrant I rows it gets right. That is the exact step whose failure changes
      the conclusion of every other L12 record.
    baseline_embedding:
      parameter_slice: >-
        PC1 at t = 1 and PC2 at k_emb = 2 are themselves the baseline slices: the
        catalogue must reproduce two published breaks. The negative slice is
        PC1 at t = 2, where the break must vanish entirely.
      reproduction_check: >-
        FROZEN FIXTURES with certificates: for PC1, the recovered k must satisfy
        Q = [k]P, verified independently of the transfer code
        (docs/claims-and-verification.md); for PC2, the transferred instance must
        satisfy the pairing identity and the recovered k must verify on the
        curve. Both certificates are re-checked by the run wrapper, not by the
        solver. A fixture that "works" without a verified certificate is not a
        control.
    observation_collision:
      observable: >-
        The quadrant label, and for positive controls the pair (non-simulable,
        implementing algorithm beats rho).
      distinct_preimage_search: >-
        REQUIRED AND IT IS THE SHAM POSITIVE CONTROL. The t = 2 "additive
        transfer" oracle and PC1 have nearly identical specifications and
        opposite quadrants. If the adjudicator cannot separate them it is
        matching surface form. A second, subtler collision: PC1 (anomalous) and
        the plain x-coordinate oracle are BOTH cell (b) / PUB in the
        IDEA-20260807-5876b8 taxonomy -- same verdict, opposite consequence --
        which is why quadrant assignment requires the implementing algorithm and
        not just the verdict symbol. That collision is inherited from 5876b8 and
        is the reason this catalogue exists as a separate artifact rather than as
        a footnote to the taxonomy.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Build the resource measure "named global structural coincidence" and
          realize it by three specializations -- t = 1, supersingular, proper
          subfield -- charging each separately and checking they are disjoint
          (they are: a trace-one curve is ordinary and has large k_emb; a
          supersingular prime-field curve has t = 0; a prime field has no proper
          subfield).
        predicted_gain: >-
          Turns "what would a real positive control look like?" into a checklist
          with three disjoint entries and a mandatory field, and makes the
          absence of a fourth, in-scope entry a countable observation rather than
          an impression.
      - transform: observable_fiber
        proposed_object: >-
          Hold "non-simulable" fixed and vary the curve family; the fiber
          contains PC1, PC2, PC3 and all four Quadrant II entries. The intrinsic
          invariant separating them is the coincidence, which is curve data, not
          oracle data.
        predicted_gain: >-
          Establishes, as a limiting result about this lane's own observable,
          that usefulness is never a property of the oracle alone -- which is the
          single most important thing the L12 lane can tell the other thirteen.
    quantifier_order: >-
      THE CATALOGUE'S CLAIM:
        FORALL rows r in the frozen catalogue, EXISTS a required verdict v(r),
        and the adjudicator must output v(r). This is a specification, not a
        theorem.
      THE EMPTINESS OBSERVATION'S CLAIM, AND ITS ORDER IS EXACTLY WHY IT IS ONLY
      `unverified`:
        Intended: FORALL oracles O in the target family, O is not both
        non-simulable and useful.
        Established: FORALL oracles O that I ENUMERATED (the campaign's ten
        candidates plus the corpus's four plus the three controls), O in the
        target family is not both. The universal is over an ENUMERATED SET, not
        over all oracles, and the gap between the two is the entire distance
        between `unverified` and a closure. Stating the intended form as if the
        established form supported it would be the premature-closure failure the
        inventor protocol names, and this record refuses it explicitly.
      THE COINCIDENCE RULE'S CLAIM:
        FORALL useful non-simulable oracles KNOWN TO ME, EXISTS a named
        coincidence. Again a universal over a known set. Its falsifier is a
        single useful oracle with no coincidence, and that would be a major
        result.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The L12 adjudicator reproduces eighteen pre-registered verdicts,
        including three published breaks it must not miss and one sham it must
        not promote." It can NEVER certify that no in-scope useful oracle exists
        -- the emptiness observation is an enumeration over what was considered,
        and the inventor protocol classifies exactly that as a statement about
        the search.
      nearby_object_control: >-
        THE SHAM POSITIVE CONTROL (t = 2 pseudo-additive transfer): the closest
        object to PC1 on which usefulness FAILS. A catalogue that cannot separate
        them has not identified the load-bearing structure, which is the trace
        condition and not the oracle's shape.
        A SECOND nearby object, and it is uncomfortable: a curve with t = 1 + eps
        does not exist -- the trace is an integer and t = 2 is the nearest
        neighbour -- so the "nearby object" in the anomalous case is
        discontinuously far. That discontinuity is exactly KN-TECH-033's "the
        attacks do not degrade gracefully", and it means the PC1 decay test can
        only ever have two points, which is a real weakness of PC1 as a control
        and is named here rather than glossed.
    proof_obligations:
      - claim: >-
          The four quadrants are exhaustive and Quadrant III is empty by the
          simulability closure.
        responsibility: correctness
      - claim: >-
          PC1 runs at toy scale and recovers k with an independently verified
          certificate; the same code fails completely at t = 2.
        responsibility: feasibility
      - claim: >-
          PC2 runs at toy scale and produces a solvable F_{p^2}^* instance with a
          verified certificate.
        responsibility: feasibility
      - claim: >-
          The sham positive control is classified Quadrant II.
        responsibility: soundness
      - claim: >-
          With a corrupted simulator knowledge set, every Quadrant II entry
          collapses to SIM.
        responsibility: soundness
      - claim: >-
          The emptiness observation is reported at `unverified` with its
          enumeration named and the external search explicitly not claimed.
        responsibility: scope
      - claim: >-
          The three decay shapes are distinct as predicted.
        responsibility: interface

  predictions:
    - metric: >-
        adjudicator score against the frozen eighteen-row catalogue
      direction: different
      minimum_effect: >-
        18 of 18 verdict symbols correct, AND the implementing algorithm surfaced
        for all 3 positive controls, AND the sham control classified Quadrant II.
        Anything less and the adjudicator supports no conclusion. Pre-registered.
    - metric: >-
        PC1 success rate as a function of trace t over {1, 2, 3, 5, 9, 17}
      direction: lower
      minimum_effect: >-
        100 percent at t = 1 and 0 percent at every t != 1 -- a cliff, not a
        gradient. Any nonzero success at t != 1 means the implementation is
        solving by some other route (small order, smooth order) and the control
        is void.
    - metric: >-
        PC2 transferred-instance cost as a function of k_emb over {2, 3, 4, 6}
      direction: higher
      minimum_effect: >-
        Monotone increasing and smooth, with a measurable crossing against the
        matched rho baseline at toy scale. A cliff here would be as wrong as a
        gradient in PC1, and the contrast between the two shapes is what shows
        the instrument is reading mechanisms rather than labels.
    - metric: >-
        PC3 decomposition-cost advantage as a function of extension degree n over
        {1, 2, 3}
      direction: higher
      minimum_effect: >-
        Zero advantage at n = 1 (the prime-field case) and a measurable advantage
        at n = 2 and 3. The n = 1 rung is the most important single measurement
        in this record: it is the campaign's own scope, and the prediction is
        that the advantage vanishes there.
    - metric: >-
        number of oracles proposed in GOAL-ENDO-001 naming a genuine in-scope
        coincidence
      direction: different
      minimum_effect: >-
        Predicted 0 over the campaign. A single one is a discovery and triggers
        GOAL-ENDO-001 pause condition P3 and independent review. This prediction
        is cheap to score and is the record's longest-lived output.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, 2 hours): write the eighteen-row catalogue in the
      oracle schema; attach the three decay parameters with their predicted
      shapes; write the sham positive control.
      STAGE 1 (toy compute, <= 20 min, HARD GATE): PC1. Search for a trace-one
      curve at p <= 2^20; run the additive transfer; verify the certificate
      independently; run the same code at t in {2, 3, 5, 9, 17} and confirm total
      failure.
      STAGE 2 (toy compute, <= 20 min, HARD GATE): PC2. Supersingular curve over
      F_p at p <= 2^16 with k_emb = 2; run the transfer; verify the certificate;
      sweep k_emb where feasible.
      STAGE 3 (shared with IDEA-20260807-070d03 Arm D, no extra compute): PC3 at
      n in {1, 2, 3}.
      STAGE 4 (zero compute): run the adjudicator against the catalogue; score
      18 rows; run the sham control and the corrupted-knowledge-set control.
      STAGE 5 (zero compute): state the emptiness observation at `unverified`,
      record the enumeration it ranges over, add the coincidence field to the
      oracle schema, and open the external-literature search as a named follow-up
      with its own record.
    controls:
      - >-
        sham positive control (t = 2 pseudo-additive transfer): must land in
        Quadrant II (blocking)
      - >-
        corrupted simulator knowledge set: every Quadrant II entry must collapse
        to SIM (blocking)
      - >-
        three decay ladders with three DIFFERENT predicted shapes
      - >-
        independent certificate verification for PC1 and PC2 recoveries
        (docs/claims-and-verification.md)
      - >-
        factored order, largest prime factor, and #E != p recorded per curve
        except where #E = p is the point (PC1), where it is recorded as the
        deliberate condition (KN-TECH-030, KN-TECH-033)
    required_metrics:
      - adjudicator verdict per catalogue row, against the pre-registered verdict
      - PC1 success rate per trace value, with certificates
      - PC2 transferred cost per k_emb, with certificates, against matched rho
      - PC3 advantage per extension degree, including the n = 1 rung
      - sham-control classification and corrupted-knowledge-set outcome
      - the enumeration over which the emptiness observation ranges

  falsification_conditions:
    - >-
      PC1 or PC2 cannot be instantiated at toy scale within budget. The
      adjudicator has no working positive control and every negative it produces
      is uncalibrated. This is an INFRASTRUCTURE outcome under AGENTS.md rule 5
      and must be reported as "instrument not calibrated", never as "no signal
      found".
    - >-
      PC1 succeeds at t != 1. The implementation is solving by another route and
      the control is void.
    - >-
      The sham positive control is promoted to Quadrant IV. The adjudicator
      pattern-matches; it is void until Q3's artifact requirement is
      strengthened.
    - >-
      Quadrant II entries do NOT collapse to SIM under a corrupted knowledge set.
      The adjudicator is not using the knowledge set and its Quadrant I verdicts
      are accidental.
    - >-
      An in-scope oracle is found that is non-simulable and useful. THE EMPTINESS
      OBSERVATION IS FALSE, which is the best outcome available in this entire
      lane, and it triggers GOAL-ENDO-001 pause condition P3 plus AGENTS.md rule
      12 escalation before any record states it.
    - >-
      All three decay ladders produce the same shape. The instrument is reading
      its own structure rather than the mechanisms.

  confounders:
    - >-
      TOY-SCALE ACCIDENTS. At p <= 2^20 a curve can have smooth order and be
      solvable by Pohlig-Hellman, which would make ANY oracle look useful. Every
      curve's order must be factored and its largest prime factor recorded, and
      PC1's curve must be checked to be trace-one for the right reason.
    - >-
      RELAYED-FACT RISK IN PC1 AND PC2. Both rest on technique records whose
      sources were not read in full. Using them as running fixtures with verified
      certificates converts that risk from silent error into a visible test
      failure, which is the mitigation, but the risk is real and is named.
    - >-
      SCOPE LEAKAGE FROM PC3. It is an extension-field control and may never
      appear in a prime-field conclusion. This is the same documentation risk
      flagged in IDEA-20260807-070d03 and it is the most likely way this work
      gets misquoted.
    - >-
      EMPTINESS AS COMFORT. An emptiness observation is easy to read as
      reassurance that the target family is safe. It is not: it says the
      instrument is uncalibrated in scope. The two readings are opposite and the
      record must be written so the second is unavoidable.
    - >-
      PC1's TWO-POINT DECAY LADDER. The trace is an integer, so PC1's decay test
      has only t = 1 and t != 1 -- two points and no gradient. That is a genuine
      weakness of PC1 as a control and it is why PC2, with its smooth ladder, is
      not optional.

  interpretation_limits:
    - >-
      The emptiness observation is `unverified` and is an enumeration over what
      was considered. It is a statement about this search, not about the problem,
      and under docs/inventor-protocol.md section 4 it is explicitly NOT a
      closure.
    - >-
      Passing all eighteen rows calibrates the adjudicator for the kinds of
      oracle in the catalogue. It says nothing about an oracle of a kind nobody
      has thought of, which is the case that matters most.
    - >-
      PC1 and PC2 are breaks on curve families the campaign excludes by
      construction. Their presence in the catalogue is not evidence that any
      in-scope curve is weak, and their absence from the target family is not
      evidence that it is strong.
    - >-
      All instantiation is toy scale. The controls demonstrate that the
      instrument can see a break at p <= 2^20; they do not bound its behaviour at
      cryptographic size.
    - >-
      This record changes no status and adjudicates no oracle. It calibrates the
      thing that does.

  reachability_gate: >-
    NOT APPLICABLE in the curve-motion sense; no walk is proposed. The analogous
    gate binds sharply, though, and the record states it: PC1 and PC2 require
    curves that CANNOT BE REACHED from a target-family curve by any isogeny,
    because trace is an isogeny-class invariant (T4) -- an ordinary curve of
    trace t != 1 is in no class containing a trace-one curve, and a supersingular
    curve is in no ordinary class at all. So the positive controls are not merely
    out of family, they are UNREACHABLE from it, which is a stronger and cleaner
    statement of why they cannot be turned into in-scope attacks and is worth
    recording as the reachability answer for this record.

  heuristic_assumptions:
    - id: H1
      statement: >-
        COINCIDENCE NECESSITY (the campaign-wide empirical claim): every oracle
        that is both non-simulable and useful for prime-field ECDLP requires a
        global structural coincidence in the curve -- trace one, supersingularity
        / small embedding degree, or a proper subfield -- and no such coincidence
        is available in the target family.
      rigorous_support: >-
        NOT A THEOREM AND NOT CLAIMED AS ONE. It is an induction over three
        examples, and KN-TECH-033 states the same principle for representations
        as "this program's own interpretation ... a framing, not a result". The
        rigorous facts underneath are that each of the three attacks provably
        requires its condition (the additive transfer needs #E = p; MOV needs a
        second independent N-torsion point, which by H-ENDO-001 cannot come from
        End_{F_p}(E); Weil restriction needs n > 1) -- three necessity statements,
        no completeness statement.
      validation_plan: >-
        Falsifiable by a single counterexample and scored continuously: count,
        over the campaign, oracles proposed with a genuine in-scope coincidence
        (predicted 0). The complementary validation is the external literature
        search named in Stage 5, which is the only thing that can move the
        emptiness observation off `unverified`. Explicitly NOT validated by any
        toy measurement; a toy experiment cannot establish an absence.
    - id: H2
      statement: >-
        TOY-SCALE CONTROL FIDELITY: an attack that works at p <= 2^20 in the
        controls exercises the same mechanism it would at cryptographic size, so
        an adjudicator calibrated at toy scale is calibrated for the mechanism.
      rigorous_support: >-
        Partial. PC1's additive transfer is exact at any size (it is an
        isomorphism, not an approximation), so H2 is safe there. PC2's advantage
        depends on the index-calculus/rho crossing, which is a SIZE-DEPENDENT
        comparison, so a toy-scale PC2 may show an advantage where a
        cryptographic-scale one would not, or vice versa. H2 is therefore
        differentially reliable across the controls and the record says which.
      validation_plan: >-
        Report PC2's measured crossing point at each toy size and check whether
        it moves with p in the direction the asymptotics predict. Toy scale only,
        labelled as such; no cryptographic-scale claim is made and none is
        supported.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED BY THIS RECORD. The exponents that appear are
      those of the three positive controls, all of them published and none of
      them in scope: PC1 at O(log p) field operations on trace-one curves
      (KN-TECH-033); PC2 at L_{p^{k_emb}}[1/3, c] for the transferred field DLP
      (KN-TECH-032); PC3 at the Gaudry/Diem extension-field index-calculus
      exponent. They are quoted as fixtures, not as results.
    memory_exponent: >-
      The catalogue is O(1) -- eighteen specifications. PC1 is O(1) memory; PC2
      and PC3 inherit the memory of the index calculus they invoke, which is
      substantial and is charged to them, not to this record.
    best_known: >-
      For the target family: parallel Pollard rho with distinguished points at
      0.886*sqrt(N) group operations and O(1) memory (KN-TECH-001, KN-TECH-006);
      automorphism-discounted on CM curves (KN-TECH-018); BSGS at sqrt(N) time
      and memory (KN-TECH-031). For the OUT-OF-FAMILY control curves the best
      known is PC1 or PC2, which is exactly why they are out of family.
    hidden_overhead: >-
      The emptiness observation hides its enumeration: it ranges over seventeen
      oracles I considered, not over all oracles. That is the whole of its fine
      print and it is the reason the record refuses to call it a closure. Second
      disclosure: PC2's toy-scale crossing point is not the cryptographic-scale
      one and must not be quoted as such.
    tradeoff_note: >-
      Not applicable to a control catalogue. The one tradeoff present is
      methodological: the catalogue buys calibration at the price of anchoring an
      adjudicator to eighteen known shapes, which is precisely what the sham
      positive control exists to detect.

  dominated_by: >-
    AS AN ATTACK: none mounted. Dominated on every axis by every row of the
    prime-field frontier, checked individually: parallel rho with distinguished
    points (0.886*sqrt(N) time, O(1) memory, 0 queries); automorphism-discounted
    rho on CM curves (KN-TECH-018); BSGS (KN-TECH-031) at sqrt(N) time and
    memory. On the out-of-family control curves the dominating rows are PC1
    (O(log p), KN-TECH-033) and PC2 (subexponential, KN-TECH-032), and naming
    them is part of this record's job rather than an embarrassment. `null` is
    not available anywhere.
    AS AN INSTRUMENT CONTROL: the incumbent is H-GGM-001's four-control set
    (pure-generic, discrete-log, public-curve, encoding). This record dominates
    it on COVERAGE -- eighteen rows against four, and in particular three real
    published breaks against zero -- and is dominated by it on STATUS, the
    incumbent being an `analyzed` hypothesis with an archived evidence record
    while this is a proposal.
  sota_delta: >-
    Zero speedup against any attack baseline: 0 time, 0 memory, 0 queries.
    Instrument delta in numbers: control coverage rises from 4 rows (H-GGM-001)
    to 18, and from 0 real published breaks to 3; adds 1 sham control and 1
    corrupted-knowledge-set control, neither of which the incumbent has; adds 3
    decay ladders with 3 distinct predicted shapes; and produces one countable
    campaign-long prediction (number of in-scope coincidences named, predicted 0)
    whose falsification would be the campaign's most valuable single event. The
    emptiness observation itself has sota_delta zero by construction -- it is the
    observation that nothing in scope moves the frontier, held at `unverified`.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.85 that PC1 instantiates cleanly at toy scale -- the additive transfer is
    short and the trace-one search is a brute-force scan that succeeds. 0.55 that
    PC2 instantiates within budget in pure Python; F_{p^2} arithmetic plus a
    small index calculus is the risky part, and if it fails the catalogue has one
    working positive control instead of two, which is a materially weaker
    instrument and must be reported as such. 0.9 that the sham control is
    correctly rejected. And 0.9 that the emptiness observation stands as stated
    at the `unverified` tier -- not because I believe no in-scope useful oracle
    exists, but because I do not expect this campaign to find one, and those are
    different propositions, which is exactly why the observation is held at
    `unverified` and framed as a statement about the instrument rather than about
    the problem.

