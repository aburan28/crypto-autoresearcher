idea:
  id: IDEA-20260807-653dda
  question_id: RQ-PAIR-21313f
  added: '2026-08-07'
  title: >-
    SCOPE RECORD A - THE CAUSAL DIRECTION BETWEEN CM DISCRIMINANT AND EMBEDDING
    DEGREE IS THE OPPOSITE OF THE ONE THE LANE'S TITLE SUGGESTS - small |D| does
    NOT produce small k, because k = ord_N(t-1) is a function of (N, p) alone;
    what is true is that every known small-k CONSTRUCTION (MNT, Barreto-Naehrig,
    Cocks-Pinch, Freeman, KSS) solves a CM equation and thereby CONSTRAINS D,
    so pairing-friendliness and CM structure are correlated by construction and
    not by causation; deliver the family-by-family table that states this and
    names, for each family, whether D is forced, free, or Pell-constrained
  class: measurement

  claim: >-
    (A) THE IDENTITY THAT ORGANISES THE WHOLE LANE. For a prime N dividing the
    group order p + 1 - t, reduce mod N to get p = t - 1 (mod N). Hence the
    embedding degree is
        k = ord_N(p) = ord_N(t - 1),
    the multiplicative order of (t-1) modulo N. Two immediate readings.
    (i) k is a function of the TRACE and the subgroup order and of nothing else -
    not of D_0, not of the class number, not of j, not of the conductor, not of
    the volcano level. Curves with |D_0| = 3 (j = 0) have no more claim to a
    small k than any other curve at the same (p, N).
    (ii) When N > 2 sqrt(p) + 1 the residue p mod N is LITERALLY the small
    integer t - 1 (or N + t - 1), of absolute value at most 2 sqrt(p) + 1. So
    the embedding degree of a near-prime-order curve is the order of a SMALL
    integer modulo a large prime, which is the exact regime of the classical
    theorems on multiplicative order (used in IDEA-20260807-6c7540) and is why
    small k is rare rather than impossible.

    (B) WHAT IS ACTUALLY TRUE ABOUT CM FAMILIES, STATED AS THE DELIVERABLE.
    Pairing-friendly curves are CONSTRUCTED, and the construction is what ties
    them to CM. Every known method fixes a target k, then solves the CM equation
    D.y^2 = 4p - t^2 for small |D| so that the Hilbert class polynomial of
    discriminant D is computable and the curve can be written down. The
    correlation runs construction -> D, never D -> k. The table this record
    delivers, with one row per family, each row carrying (target k, whether D is
    forced or free, the rho-value comparing group size to field size, and the
    mechanism that forces D) -
      - Barreto-Naehrig - k = 12, D = -3 FORCED (j = 0), rho = 1;
      - MNT - k in {3, 4, 6}, D arises from a PELL equation and is
        effectively unconstrained in size but must be found by solving it,
        rho = 1;
      - Cocks-Pinch - k arbitrary, D essentially FREE (chosen first), rho
        approximately 2 - the freedom in D is paid for in field size;
      - Freeman - k = 10, D variable;
      - KSS and BLS families - fixed small k, D typically -3 or small;
      - Scholl's isolated-curve variant of the CM method (KN-LIT-608) -
        deliberately produces prime-field curves with LARGE embedding degree
        under Bateman-Horn, i.e. the same CM machinery pointed the other way.
    The deliverable is that table with each cell sourced, plus the explicit
    statement of (A) that makes it interpretable rather than a list.

    (C) WHY THIS IS A SCOPING RECORD AND NOT AN ATTACK. Nothing here proposes to
    attack anything. It exists because RQ-PAIR-21313f asks "which CM families
    have exploitably small embedding degree", and the correct answer -
    "the question has a false presupposition, and here is the true structure
    behind the correlation that motivates it" - is a deliverable only if it is
    written down with the families enumerated and the causal direction argued.
    A lane that answers "none" without the table is a fatigue report.

    (D) THE ONE PLACE THE CAUSAL ARROW DOES POINT FROM CM TO k, AND IT IS
    NEGATIVE. Given a target k, the CM equation D.y^2 = 4p - t^2 must have a
    solution with |D| small enough for the class polynomial to be computable -
    class number h(D) grows like |D|^{1/2+o(1)}, so |D| is capped in practice at
    around 10^7 to 10^{10} depending on method. That is a constraint the
    CONSTRUCTOR faces, not a property an existing curve has. It bounds what a
    designer can build, which is why it belongs in the affected/safe split of
    IDEA-20260807-98a970 rather than in an attack.

  resource_label: >-
    R7 (pairings into F_{p^k}), consumed in SCOPING MODE ONLY - the record maps
    where R7 is non-empty and mounts no attack. Touches R3 (End(E) as a ring)
    only to state that the discriminant does NOT determine k.
  admissibility: admissible
  admissibility_argument: >-
    Admissible but vacuously so - a scoping record consumes no resource against
    any instance and therefore cannot be inadmissible under the H-ENDO-001
    filter. It is recorded as admissible so the campaign's resource table stays
    complete, and the record is explicit that admissibility here carries no
    implication that an attack exists.

  discriminated_from:
    - >-
      KN-TECH-032, which already states that supersingular curves have k <= 6,
      that pairing-friendly curves are deliberately constructed, and that random
      ordinary curves essentially never have small k. This record does not
      contradict any of that. What it adds - the identity k = ord_N(t-1) which
      makes the independence from CM data a one-line consequence rather than a
      genericity statistic, and the family-by-family table with the D-constraint
      mechanism named per family. KN-TECH-032 has no table and does not mention
      MNT, BN, Cocks-Pinch or Freeman.
    - >-
      IDEA-20260807-98a970, which audits DEPLOYED curves. This record catalogues
      CONSTRUCTIONS. The two are complementary halves of the affected/safe split
      and must not be merged - one is about what exists in standards, the other
      about what a designer can build.
    - >-
      IDEA-20260807-6c7540, which measures the DISTRIBUTION of k for random
      curves against a named classical null. This record is a taxonomy of
      deliberate constructions; that one is a statistical statement about
      accidents. They share the identity in (A) and nothing else.
    - >-
      DECOMPOSITION.md lane L3 (RQ-JINV-8fc13a), which studies small |D_0| and
      j in {0, 1728} for their effect on solving degree and the automorphism
      discount. This record's contribution to L3 is a NEGATIVE cross-lane
      statement - whatever small |D_0| does for L3, it does nothing for the
      embedding degree, and L3 must not borrow pairing-friendliness as a
      motivation.
    - >-
      NOT the classical transfer. This record proposes no transfer; it scopes
      where the classical transfer's precondition can hold.

  object_first_candidate:
    tracked_object: >-
      THE CONSTRAINT GRAPH OF A CURVE-CONSTRUCTION METHOD - the ordered list of
      which of (k, D, p, t, N, rho-value) each method fixes first, solves for
      second, and leaves free.
    lossiness: >-
      Lossy - it discards the actual curve, the actual field, and every
      coefficient, and retains only the dependency order among six integers. It
      is not a change of coordinates - one cannot reconstruct a curve from the
      constraint graph.
    propagation: >-
      Deterministic under the operation "instantiate the method at a new
      security level", which is the only operation that acts on constructions.
      What it discards (the specific instance) is discarded compatibly - moving
      to a different security level changes the instance and preserves the
      graph. That is exactly why the graph is the right object for a scope
      statement and the curve is not.
    survival_score: >-
      Survives every reparameterisation of a method and every security level.
      Dissolves when a method is hybridised (e.g. Cocks-Pinch with a
      Brezing-Weng polynomial family), where the dependency order genuinely
      changes and the row must be split. Also dissolves entirely for curves not
      produced by any method - which is exactly the population
      IDEA-20260807-6c7540 covers.

  mechanism: >-
    STEP 1 (zero compute) - derive and record the identity k = ord_N(t-1) with
    its two readings, and the corollary that k is independent of every CM datum
    at fixed (p, N).
    STEP 2 (literature, medium effort) - build the table. Primary source for the
    taxonomy is Freeman, Scott and Teske, "A Taxonomy of Pairing-Friendly
    Elliptic Curves", Journal of Cryptology 23(2):224-280, 2010,
    doi:10.1007/s00145-009-9048-z (existence, authors, venue and DOI confirmed
    by web search on 2026-08-07; the paper itself was NOT read in this session
    and every figure taken from it must be marked as relayed until it is).
    Secondary sources already in this corpus - KN-LIT-1023 (Pairing-Friendly
    Elliptic Curves - Revisited), KN-LIT-313 (Boxall, heuristics on the density
    of pairing-friendly classes at fixed k and fixed D), KN-LIT-608 (Scholl,
    isolated curves resistant to MOV), KN-LIT-2223 (a short list of curves
    resistant to special TNFS). Each row must name its source and its
    verification status.
    STEP 3 (low compute) - CONSTRUCT one toy instance per family where feasible
    at p <= 2^32, to make the table executable rather than bibliographic. A
    toy BN-shaped curve (D = -3, k = 12) and a toy Cocks-Pinch curve with a
    chosen D are the two that matter, because they are the positive controls
    every other proposal in this lane needs.
    STEP 4 (zero compute) - state the causal direction explicitly, with the
    counterexample pair that proves it - two curves at the same (p, N) with very
    different D and identical k, and two curves with the same D = -3 and wildly
    different k. Both pairs are producible at toy scale and both are required.

  novelty_status: known
  novelty_screen:
    method: >-
      Run 2026-08-07. grep -i over ledger/, knowledge/, docs/, analysis/,
      ideas/ for "embedding degree", "pairing-friendly", "Barreto-Naehrig",
      "Cocks-Pinch", "MNT", "Freeman", "taxonomy". Reads of KN-TECH-032,
      KN-LIT-084/085/086, KN-LIT-313, KN-LIT-608, KN-LIT-1023, KN-OPEN-025.
      Web search confirming Freeman-Scott-Teske's existence, venue and DOI.
    results: >-
      KN-TECH-032 covers the genericity conclusion but contains no family
      table and names none of the four construction methods. KN-LIT-313 and
      KN-LIT-1023 are in the corpus as bulk-seeded abstract relays with
      citation_verified markings that KN-OPEN-3f7a21 flags as unreliable.
      Freeman-Scott-Teske is NOT in the corpus under any KN-LIT id found by
      this screen. The identity k = ord_N(t-1) appears nowhere in the
      repository, though the equivalent k = ord_N(p) does
      (ideas/catalogue-20260805/A4-transfers-lattice.md, objects O4 and A4-5).
    verdict: >-
      KNOWN. The taxonomy is published and thirty years old in its earliest
      parts; nothing in it is claimed as new. The identity in (A) is
      elementary. What this program lacks is the table and the causal-direction
      statement in a retrievable place, which is why the record is filed as a
      SCOPING RECORD rather than an attack, exactly as the batch brief requires
      for classical material.

  null_object_control: >-
    MANDATORY. The null object is a MATCHED RANDOM CURVE at the same p and the
    same |D_0| as each tabulated pairing-friendly family member - same CM
    discriminant, same j-invariant class, but a trace not produced by the
    construction. Its embedding degree must be LARGE. The decay parameter is
    |D_0|-matching itself - as one matches the CM data of a pairing-friendly
    curve more and more closely while NOT matching its trace, the small
    embedding degree must FAIL TO APPEAR. If small k persists in the
    D-matched-but-trace-unmatched null, then D really does drive k, (A) is
    wrong, and this record is refuted. That is the whole discriminating content
    of the record and it is cheap - a few hundred toy curves with j = 0.
    SECOND NULL - a curve with the same trace but a different D (different
    conductor level in the same isogeny class); its k must be IDENTICAL, since
    (p, N) are unchanged. These two nulls pull in opposite directions and
    together pin the causal arrow.

  assumptions:
    - >-
      [relayed, not read in this session] All family parameters taken from
      Freeman-Scott-Teske and from KN-LIT-313 / KN-LIT-1023 are relayed from
      abstracts, secondary restatements, or the search result confirming the
      paper's existence. Every table cell must carry its verification status and
      no cell may be used as a decision threshold until the primary text is
      transcribed.
    - >-
      "D = -3 forced for Barreto-Naehrig" and "k in {3,4,6} for MNT" are
      standard statements about those families. They are stated here as items to
      be VERIFIED in Step 2, not as established facts of this record.
    - >-
      Class number growth h(D) ~ |D|^{1/2+o(1)} (Siegel/Brauer) is quoted to
      explain why |D| is capped in practice; the cap value depends on the class
      polynomial algorithm and is implementation-dependent, so no specific
      numeric cap is asserted.
    - >-
      Scope - ordinary curves over prime fields. Supersingular curves have
      k <= 6 unconditionally (KN-LIT-084) and are excluded.

  proof_search_map:
    bottleneck: >-
      The single derivation p = t - 1 (mod N). Everything in (A) follows from
      it and nothing in the record survives without it.
    baseline_embedding:
      parameter_slice: >-
        The Barreto-Naehrig slice - D = -3, k = 12. The identity must
        reproduce, for a concrete BN parameter set, that ord_N(t-1) = 12
        exactly. If it does not, the identity is wrong or the parameter set is
        misquoted.
      reproduction_check: >-
        A frozen fixture - one published BN parameter triple (p, t, N)
        transcribed with its source, and a two-line computation of ord_N(t-1)
        checked against 12 by exact integer arithmetic.
    observation_collision:
      observable: >-
        The integer k.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED - find two curves with the same k and
        different D, and two with the same D and different k. Both collisions
        are the record's central evidence, not a defect - they are what
        establishes that the observable does not factor through the CM datum.
        A version of this record that reports the table without both collisions
        has asserted the causal direction rather than shown it.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Specialise "which CM families are pairing-friendly" to the pair
          (t mod N, N) and pack the whole CM datum into the single integer
          t - 1.
        predicted_gain: >-
          Reduces a six-parameter question to a one-parameter one and makes the
          independence claim checkable in a single modular exponentiation.
    quantifier_order: >-
      Claimed - FORALL p, FORALL pairs of ordinary curves E, E' over F_p with
      the same trace t and the same prime N dividing the group order -
      k(E) = k(E'), regardless of End(E) versus End(E'), of j, of D_0, or of the
      class number.
      NOT claimed - the converse, that equal k implies equal trace. That is
      false and the collision search above exhibits counterexamples.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The embedding degree of a prime-field curve is determined by (N, t) and
        is independent of every other CM invariant; the correlation between
        small k and small |D| in the literature is an artifact of how
        pairing-friendly curves are constructed." It certifies nothing about
        whether small-k curves are hard or easy, nothing about deployed
        parameters (that is IDEA-20260807-98a970), and nothing about the
        density of small k (that is IDEA-20260807-6c7540).
      nearby_object_control: >-
        The SUPERSINGULAR curve, where the desired conclusion fails in an
        instructive way - there k <= 6 IS forced by a structural property
        (pi^2 = -p, so p^2 = 1 mod N up to the small cases), which is a genuine
        CM-side cause of small k. A version of this record that also claims
        supersingular curves have generic k proves too much and is void.
    proof_obligations:
      - claim: >-
          The congruence p = t - 1 (mod N) holds for every prime N dividing the
          group order of the curve.
        responsibility: correctness
      - claim: k = ord_N(t-1).
        responsibility: correctness
      - claim: Each tabulated family's (k, D) constraint matches its primary source.
        responsibility: scope
      - claim: The D-matched null does not exhibit small k.
        responsibility: strictness
      - claim: The trace-matched null exhibits identical k.
        responsibility: baseline

  predictions:
    - metric: >-
        k for curves matched on |D_0| (including j = 0 and j = 1728) to a
        pairing-friendly family but not on trace, at toy p
      direction: higher
      minimum_effect: >-
        Indistinguishable from the k of a fully random curve at the same p -
        specifically, the empirical distribution of log k must not differ from
        the random-curve control by more than a Kolmogorov-Smirnov statistic at
        the 0.05 level over at least 500 curves per arm. A significant
        difference refutes (A).
    - metric: >-
        k across curves in one isogeny class with different End(E) conductor
        levels
      direction: different
      minimum_effect: >-
        Exactly identical on 100 percent - k is a function of (p, N) which are
        class invariants. Any variation is an arithmetic bug.
    - metric: >-
        number of construction families in the table whose method forces or
        constrains D
      direction: different
      minimum_effect: >-
        Reported as a count with the mechanism named per family. The record
        predicts, before the literature pass, that EVERY family constrains D in
        some way (because all of them solve a CM equation), and that they differ
        in whether D is chosen first (Cocks-Pinch), forced (BN), or found by
        Pell (MNT). A family that constrains D not at all would be the
        interesting find.

  minimal_test:
    design: >-
      STAGE 1 (zero compute): derive (A); run the BN fixture reproduction check.
      STAGE 2 (hours, no compute): build the table from sources, each cell with
      its verification status. STAGE 3 (under one CPU-hour): the two nulls -
      500 j = 0 curves at toy p with random trace (k must be large) and, for
      each of 50 toy isogeny classes, all discoverable class members (k must be
      constant). STAGE 4 (zero compute): write the causal-direction statement
      with both collision witnesses.
    controls:
      - D-matched, trace-unmatched null - small k must NOT appear
      - trace-matched, D-unmatched null - k must be identical
      - random-curve arm at the same p, for the KS comparison
      - a deliberately constructed small-k toy curve, which the pipeline must classify as small-k (else the instrument cannot see the thing it is scoping)
    required_metrics:
      - k per curve, computed exactly at toy scale by factoring N-1
      - >-
        the tuple (p, trace t, group order, N, D_0, conductor, j) per curve
      - KS statistic between the D-matched arm and the random arm
      - the table, with a verification status per cell
      - both collision witnesses, exhibited explicitly

  falsification_conditions:
    - >-
      The D-matched-but-trace-unmatched arm exhibiting systematically smaller k
      than the random arm. That refutes (A) and would mean the CM discriminant
      does influence the embedding degree - the single most surprising outcome
      available in this lane.
    - >-
      k varying within an isogeny class. Arithmetically impossible; indicates a
      point-counting or order-computation bug; halt.
    - >-
      The BN fixture failing to reproduce k = 12 from ord_N(t-1). Either the
      identity or the transcribed parameters are wrong; resolve before any
      table cell is published.
    - >-
      A construction family found that fixes k small with D genuinely
      unconstrained. That would refute (B)'s organising claim and is a positive
      result for the taxonomy.

  confounders:
    - >-
      Selection bias in the literature. Published pairing-friendly curves are
      the ones somebody wanted, so the observed (k, D) correlation in any list
      of published curves is a sampling artifact. This is precisely the
      confounder the D-matched null is designed to break, and no table cell may
      be interpreted causally without it.
    - >-
      Cofactor effects. The identity k = ord_N(t-1) is exact for any prime N
      dividing the group order, but the SIMPLIFICATION "p mod N is literally
      t - 1" needs N > 2 sqrt(p) + 1. At toy scale with large cofactors that
      fails and the residue wraps. Every reported instance must record its
      cofactor.
    - >-
      Conflating k = ord_N(p) with the order of p modulo the full group order.
      Only the prime subgroup order matters and only it may be used.
    - >-
      Relayed figures. Several table cells will come from abstracts. A cell
      whose status is "relayed" must never be used as a decision threshold.

  interpretation_limits:
    - >-
      A scoping record. It mounts no attack, moves no exponent, and makes no
      claim about the hardness of any curve.
    - >-
      Its negative claim is about CAUSATION at fixed (p, N), not about
      correlation in published curve lists, which is real and explained.
    - >-
      Toy-scale nulls establish the causal direction only in the tested range;
      the identity in (A) is exact at every scale and does not depend on the
      nulls, which is why the record's core is symbolic.
    - >-
      Says nothing about whether small-k curves are actually broken - that
      requires the field-DLP cost, which is IDEA-20260807-5f24d7's job.

  reachability_gate: >-
    NOT A MOVE BETWEEN CURVES, AND THE RECORD EXPLAINS WHY NO SUCH MOVE EXISTS.
    Reaching a pairing-friendly curve from a given curve would require changing
    (p, N), which no F_p-isogeny does. Reaching one by CONSTRUCTION is easy and
    is what the table catalogues, but construction is a designer's operation on
    an empty input, not an attacker's operation on a given instance. The
    distinction is the whole content of the affected/safe split - a designer
    can build small k, an attacker cannot walk to it. T5 is therefore answered
    "unreachable at any cost" for the attacker and "free" for the designer.

  target_complexity:
    time_exponent: >-
      NONE CLAIMED. The record is a taxonomy. Where its rows describe attacks
      (small-k families), the attack is the classical MOV/Frey-Ruck transfer at
      pairing cost plus L_{p^k}(1/3), and the exponent belongs to KN-TECH-032,
      not to this record.
    memory_exponent: >-
      Negligible - the deliverable is a table and a few hundred toy curve
      computations.
    best_known: >-
      Rho at 0.886 sqrt(N), O(1) memory (KN-TECH-001, KN-TECH-006); BSGS
      (KN-TECH-031); MOV/Frey-Ruck for small k (KN-TECH-032); the genericity
      bound of Balasubramanian-Koblitz (KN-LIT-086).
    hidden_overhead: >-
      None claimed. The one honest disclosure - "small |D|" hides an
      implementation-dependent cap on class-polynomial computability, and any
      statement of the form "|D| must be below X" is method-specific.
    tradeoff_note: >-
      For Cocks-Pinch the free choice of D is paid for by a rho-value near 2,
      i.e. the field is about twice the subgroup size. That IS a tradeoff and it
      belongs in the table, but it is a construction tradeoff, not a
      cryptanalytic one.

  dominated_by: >-
    Checked across every frontier row. As an attack this record mounts none and
    is dominated on time, memory and data by rho at 0.886 sqrt(N) with O(1)
    memory (KN-TECH-001, KN-TECH-006), by automorphism-discounted rho
    (KN-TECH-018), by BSGS at sqrt(N)/sqrt(N) (KN-TECH-031) and by
    MOV/Frey-Ruck on the small-k families it catalogues (KN-TECH-032).
    As a SCOPE DOCUMENT it is dominated by Freeman-Scott-Teske's published
    taxonomy, which is more complete, peer reviewed and eighteen years of
    citations ahead. It dominates that source on exactly one axis - it states
    the causal direction as a testable claim with two nulls, which a
    construction survey has no reason to do.
  sota_delta: >-
    Zero on every attack axis. Non-zero deltas, stated quantitatively - it
    converts a six-parameter question ("which CM families have small k") into a
    one-parameter identity k = ord_N(t-1) evaluable in one modular
    exponentiation; and it supplies the program with N construction families
    catalogued with a per-cell verification status where the corpus currently
    holds zero such rows (KN-TECH-032 names no family).

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low

  honest_prior_of_survival: >-
    0.98 that the identity k = ord_N(t-1) is correct - it is one line of modular
    arithmetic. 0.90 that the D-matched null behaves as predicted (large k), the
    residual risk being that j = 0 curves at toy scale have enough structure in
    their trace distribution to bias k slightly. 0.60 that the table can be
    built to a standard where more than half its cells are primary-source
    verified within the batch budget, since Freeman-Scott-Teske is not in this
    corpus and fetching and reading it is the dominant cost. Priority is LOW
    despite high confidence precisely because the outcome is near-certain and
    known - it is bookkeeping the lane owes, not a discriminating experiment.

