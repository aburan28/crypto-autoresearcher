  assumptions:
    - >-
      E/F_p ordinary, N = #<P> prime, N ~ p; generic prime-field curves.
    - >-
      The bounded unknowns of a presentation are exactly the m leaves plus A
      auxiliaries; unbounded unknowns are charged at gamma = 1 and counted,
      never ignored.
    - >-
      The solution variety of "P_1 + ... + P_m = R" has dimension m-1 over
      F_p-bar, so a complete-intersection presentation has E = A + 1.
    - >-
      Reach is normalized as in the closure, prod(bounds) <= p^{eps * codim},
      with eps = 1 the information ceiling.

  proof_search_map:
    bottleneck: >-
      The minimum worst-equation per-variable degree achievable by ANY algebraic
      presentation of the m-fold sum condition with A bounded auxiliaries. Once
      the demand law (A) is fixed, this single function decides the family.
    baseline_embedding:
      parameter_slice: >-
        A = w with the tree wiring must reproduce
        eps_required = (w + 1/2 + 1/(2(m-1)))/(w+1) and the degree
        2^{ceil((m+w)/(w+1)) - 1} exactly, i.e. the committed table rows
        (4,0,0.6667,0.2396), (4,1,0.8333,0.4137), (4,2,0.8889,0.8408).
      reproduction_check: >-
        Symbolic: substitute A = w, E = w+1 into (A) and check the rational
        identity against tools/smallroot_reach.py's eps_required, as a frozen
        unit test alongside the existing w = 0 reproduction test.
    observation_collision:
      observable: >-
        The row (A, E, worst per-variable degree, bound-volume exponent).
      distinct_preimage_search: >-
        Deliberately sought, one on each side. The tree at (m, A) = (4, 2) and
        the pairwise Mumford presentation at m = 4 should have the SAME A and
        E; if they also have the same degree and the same bound volume, the
        divisor object is a change of coordinates on the tree and this record's
        (B) is empty -- which is itself the E1 outcome, stated with a mechanism.
        A pair with equal (A, E) and different (degree, volume) is E2.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The reduced divisor / Mumford pair of each partial sum, replacing the
          x-coordinate of each internal tree node. Encoding: exact for effective
          divisors of degree <= m; completeness: every decomposition has a
          Mumford pair; soundness: every valid (G, H) with H^2 = E mod G is an
          effective divisor; transfer: the sum condition becomes a reduction
          condition; cost loss: the box inflation of (C), charged.
        predicted_gain: >-
          Composition degree falls from 2^{l-1} (resultant) to bilinear
          (multiplication), at a bound-volume cost of B^{m(m+1)/2} versus B^m in
          the fully composed variant and B^3 versus B^2 per pair block.
      - transform: stronger_invariant
        proposed_object: >-
          Retain H rather than eliminating it, preserving more state than the
          sum condition requires, on the theory that H is what survives
          composition.
        predicted_gain: >-
          Avoids the symmetric-box inflation; costs A unbounded auxiliaries,
          which the law (A) charges at gamma = 1 each. The exchange rate is the
          deliverable.
    quantifier_order: >-
      FOR ALL algebraic presentations of the m-fold sum condition with A bounded
      auxiliaries and E = A+1 equations, THERE EXISTS an equation whose
      per-variable degree is at least 2^{ceil((m+A)/(A+1)) - 1} OR whose bound
      volume exceeds B^{m + A} by at least the invariant-ring factor. The
      negation this record can also establish is: THERE EXISTS a presentation
      (the divisor one) violating both, FOR ALL sufficiently large p. Note the
      witness presentation is allowed to depend on m but not on p or on the
      instance.
    method_ceiling:
      strongest_certifiable_claim: >-
        A table of (A, E, degree, volume, eps_avail, eps_required) rows over
        named presentations, with the closure extended or reopened at a stated
        margin. It cannot certify that NO presentation exists, because the
        quantification is over all presentations and the record enumerates
        three.
      nearby_object_control: >-
        Extension fields F_{q^n} under Weil descent, where the same divisor
        presentation exists and the decomposition problem IS easy. A degree-
        versus-A analysis that cannot see the difference between F_p and
        F_{q^n} is measuring the presentation and not the arithmetic, and must
        be discarded.
    proof_obligations:
      - claim: >-
          eps_required = (A + 1/2 + beta)/E for any presentation, reproducing
          the tree case at A = w
        responsibility: baseline
      - claim: >-
          codim of the decomposition variety is A + 1, so E > A + 1 gives
          dependent equations
        responsibility: correctness
      - claim: >-
          hybrid guessing of k leaves leaves eps_required exactly invariant
        responsibility: baseline
      - claim: >-
          the Mumford variant's bound volume and worst degree, computed and not
          asserted
        responsibility: size
      - claim: unbounded auxiliaries are charged at gamma = 1
        responsibility: memory
      - claim: >-
          no crypto-scale claim; the table is symbolic and toy-validated
        responsibility: scope
    not_applicable_reason: null

  object_first:
    tracked_object: >-
      The REDUCED DIVISOR of the partial sum -- the Mumford pair (G, H) --
      replacing the tuple of x-coordinates of the points.
    lossy_projection_test: >-
      Genuinely lossy, and lossy in a way the x-tuple object is not: the map
      (P_1, ..., P_m) -> (G, H) is m!-to-1, discarding the ORDER of the points,
      and the pair (G, H) also fixes the y-signs jointly rather than
      individually, discarding the C_2^{m-2} sign monodromy that
      KN-FIND-a1f3c2 records and that IDEA-20260808-486ae2 charges at 2^{m-2}
      per candidate. What is discarded is discarded COMPATIBLY with the
      operation the method performs on it: divisor composition is defined on
      divisors, not on ordered tuples, and G_1 * G_2 is a deterministic
      one-step propagation of the projection with no reference to the discarded
      ordering. Contrast with the failing example of the protocol: tracking
      (x+y, xy) in characteristic 2 loses nothing because the pair is
      recoverable from a quadratic; here the m! orderings are genuinely not
      recoverable from (G, H) without factoring G, and factoring G is exactly
      the step a solver would otherwise have to do. So this passes the test.
      Honest scoring on the protocol's three axes: (1) genuinely new in this
      corpus, repackaged from standard divisor arithmetic elsewhere;
      (2) concretely testable -- its one-step propagation is polynomial
      multiplication and its cost datum is a row in the existing table;
      (3) it survives composition without reduction for any number of steps and
      dissolves at the point where the class must be compared with [R - O],
      which is where the reduction map reintroduces high degree. That
      dissolution point is what the experiment measures.
    survival: >-
      Survives every composition step; the structure dissolves at reduction and
      at the archimedean bound, in the specific manner (C) predicts.

  predictions:
    - metric: >-
        eps_required computed from the law (A) at A = w, E = w+1, against
        tools/smallroot_reach.py's committed eps_required(m, w)
      direction: different
      minimum_effect: >-
        Exact rational equality at every (m, w) with m <= 32. Any difference
        falsifies the generalization and blocks the rest.
    - metric: >-
        eps_required under hybrid guessing of k leaves, k in {1, 2}, computed
        from the law
      direction: different
      minimum_effect: >-
        Exactly unchanged (zero difference, rational arithmetic). A nonzero
        difference means the yield or the box accounting is wrong somewhere in
        this lane and is a higher-priority finding than the rest of the record.
    - metric: >-
        Worst per-variable degree of the pairwise Mumford presentation at m = 4
        with A = 2, against the tree's 2 at the same (A, E)
      direction: lower
      minimum_effect: >-
        Strictly lower, or equal. Equal at equal box volume means the divisor
        object is a change of coordinates on the tree and (B) is empty.
    - metric: >-
        Bound-volume exponent of the pairwise Mumford presentation at m = 4,
        in units of beta
      direction: higher
      minimum_effect: >-
        Predicted 3 per pair block (coefficients bounded by 2B and B^2) against
        the tree's 2 per pair of leaves, i.e. +1 per block. If the measured
        inflation is below +1 the (C) accounting is wrong; if it is above, the
        variant is worse than predicted and dies faster.
    - metric: >-
        Margin eps_avail - eps_required for each divisor variant at
        m in {4, 5, 6}
      direction: higher
      minimum_effect: >-
        E2 requires a strictly positive margin at some cell; anything <= 0
        everywhere is E1 and extends the closure to divisor-first strategies
        with a named mechanism.

  minimal_test:
    design: >-
      Entirely symbolic plus one calculator run; no new mathematics is needed
      and no curve is constructed. STAGE 0: derive (A) and check it reduces to
      the committed eps_required at A = w; derive the hybrid-neutrality
      corollary; state the codimension argument for E <= A+1. STAGE 1: write
      the three divisor variants explicitly at m = 4 and m = 5 -- H eliminated,
      H retained, pairwise blocks -- and read off (A, E, worst per-variable
      degree, bound-volume exponent) for each. STAGE 2: feed each variant's
      support and bound vector to the existing jm_reach_extended and place the
      rows on the closure's table. STAGE 3 (only if a row is alive): a toy
      m = 3 hand-check at p = 1009 that the Mumford composition of two
      one-point divisors reproduces the group law, as a correctness gate before
      anything is believed.
    controls:
      - >-
        Tree reproduction gate: the law at A = w must return the committed
        rational values exactly.
      - >-
        Null presentation: a random polynomial system with the same
        (A, E, degree, volume) must give the same reach; the reach is a
        polytope quantity and must not see the group law.
      - >-
        Extension-field control: the same analysis over F_{q^n}, where index
        calculus is known to win, must produce an alive row; a framework that
        closes F_{q^n} too is measuring the wrong thing and is void.
      - >-
        Correctness gate: Mumford composition checked against the group law on
        a toy curve before any cost row is read.
      - >-
        Prior-art gate: if the H-eliminated variant lands on
        IDEA-20260903-e0a3e8's e-box, that is reported as a reproduction of a
        committed result, not as a new finding.
    required_metrics:
      - >-
        the (A, E, worst per-variable degree, bound-volume exponent, eps_avail,
        eps_required, margin) row per variant per m
      - >-
        the exact rational check of the law against the committed eps_required
        table
      - >-
        the hybrid-neutrality difference (must be exactly zero)
      - >-
        the extension-field control row

  falsification_conditions:
    - >-
      The law (A) does not reproduce eps_required(m, w) at A = w. The
      generalization is wrong and the rest of the record is void.
    - >-
      Hybrid guessing shifts eps_required. The yield or box accounting in this
      lane is wrong; that becomes the finding.
    - >-
      Every divisor variant lands on or above the tree's degree-versus-A curve,
      with the invariant-ring degree sequence as the reason. This is E1 -- the
      tree closure and the symmetrization closure are one law, the tree
      hypothesis is retired as non-load-bearing, and the honest closure
      statement becomes presentation-independent for complete-intersection
      presentations with box-bounded unknowns.
    - >-
      Some variant sits strictly below the curve with a positive margin. This is
      E2 -- a non-tree presentation with low degree at low A exists; the family
      reopens at a computable margin and the next step is a specified algorithm,
      not a claim.
    - >-
      The extension-field control also closes. The framework is invalid; no
      ECDLP reading may be taken from it.

  confounders:
    - >-
      Unbounded auxiliaries are easy to forget. H's coefficients are full-size
      and must be charged at gamma = 1, or the H-retained variant will look free
      when it is not.
    - >-
      A presentation can be underdetermined by accident (fewer independent
      equations than codimension), which shows up as an inflated eps and is not
      a gain; the rank of the Jacobian at a generic point must be checked.
    - >-
      The reach normalization by E assumes independent equations; with dependent
      equations the correct normalization is by codimension, and mixing the two
      silently converts a dependency into a false gain.
    - >-
      Cantor reduction is a rational map whose degree in the coefficients is not
      obviously bounded; if the reduction step is where the degree returns, that
      must be measured and reported rather than folded into "composition is
      bilinear".

  interpretation_limits:
    - >-
      The law (A) is a derivation, not a theorem about all algorithms; it is
      scoped to presentations with box-bounded unknowns solved by methods whose
      certificate is over a box.
    - >-
      Three presentations are enumerated. This cannot and does not claim that no
      other presentation exists; per the closure standard it names an
      obstruction and gives forward guidance, and does not declare the direction
      impossible.
    - >-
      Nothing here is an attack, a speedup, or a hypothesis transition.
      sota_delta zero, claim tier toy.
    - >-
      Where the H-eliminated variant reproduces IDEA-20260903-e0a3e8, the credit
      is that record's.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For every presentation tabulated, the solution variety over F_p-bar has
        dimension exactly m-1 and the presentation is a complete intersection at
        a generic point, so codim = A + 1 = E and the information ceiling
        eps <= 1 applies in the stated normalization.
      rigorous_support: >-
        Rigorous: "P_1 + ... + P_{m-1} free, P_m determined" gives dimension
        m-1 unconditionally. Only the genericity of the presentation (no
        embedded components, Jacobian of full rank at the target) is assumed --
        the standard genericity imitated by the semi-regular reference of
        IDEA-20260808-093497.
      validation_plan: >-
        SAMPLE: at toy p (1009 to 2^16) and m in {3, 4}, compute the rank of the
        Jacobian of each presentation at 10^3 random points of the variety, and
        the dimension by a Groebner computation; COMPARE against m-1 and against
        A+1; TAIL CHECK: report any point where the rank drops, since a
        positive-dimensional degeneracy is exactly what would make an eps
        reading meaningless. Cheap and exact at these sizes.
    - id: H2
      statement: >-
        The bound vector of the Mumford variant is tight, i.e. the coefficients
        of G realise |e_j| of order C(m,j) B^j on the window box rather than
        cancelling to something smaller, uniformly in B.
      rigorous_support: >-
        Rigorous upper bound |e_j| <= C(m,j) B^j; tightness at
        x_1 = ... = x_m = B-1 is IDEA-20260903-e0a3e8's (T1), which also
        computes the image measure B^m/m! and thus the relative thinness
        B^{-m(m-1)/2}/(m! c_m). The distribution imitated is that a random
        m-subset of a window has symmetric functions spread over their full
        range.
      validation_plan: >-
        SAMPLE: 10^5 random m-subsets of [0, B) at B in {2^8, 2^12} and
        m in {3,4,5}; COMPARE the empirical max and the empirical 99th
        percentile of |e_j| against C(m,j) B^j; TAIL CHECK: the largest observed
        |e_j|/B^j against the binomial coefficient. If the empirical spread is
        materially below the bound, the box can be shrunk and the (C) penalty is
        overstated -- which would be a real, favourable finding and must be
        reported.

  target_complexity:
    time_exponent: >-
      No exponent claimed by this record. It supplies the function
      eps_required(A, E) and the degree-versus-A rows that every proposal in
      this lane is scored against. Using the conversion derived in
      IDEA-20260904-8dccc9 (total exponent = 1/2 - Delta * E), a variant with
      margin Delta at E equations would give N^{1/2 - Delta E}; the tree's best
      is Delta = -0.0481 at E = 3, i.e. N^{0.644}.
    memory_exponent: >-
      N^{beta}, beta in (1/6, 1/4) for the factor base and sparse matrix,
      unchanged by the presentation. The H-retained variant adds no memory but
      adds A unbounded unknowns to the TIME side. If a variant requires
      composing to a degree-m divisor, the coefficient vector is O(m) field
      elements and is not a memory term.
    best_known: >-
      Pollard rho / vOW at N^{1/2}, O(1) memory; BSGS at N^{1/2}/N^{1/2}.
    hidden_overhead: >-
      Cantor reduction cost is not charged in the bilinear-composition claim and
      is the most likely place for the degree to return; it is named as a
      confounder rather than assumed away. The m! ordering factor is discarded
      by the divisor object, which is a genuine saving in the solution COUNT and
      NOT in the exponent, and must not be presented as one. Sign-pattern
      monodromy 2^{m-2} disappears for the same reason and with the same caveat.
    tradeoff_note: >-
      None new. The family remains memory-light (N^{1/4} or below), so it must
      beat N^{1/2} outright rather than at large memory.

  dominated_by: >-
    Pollard rho / vOW at N^{1/2} with O(1) memory. Frontier rows checked, all
    nine as enumerated in IDEA-20260904-8dccc9: parallel rho with negation;
    BSGS; kangaroo (not comparable, full-range target); automorphism-discounted
    rho; Pohlig-Hellman (not applicable, N prime); preprocessing frontier
    S T^2 = N (not comparable, no preprocessing claimed); multi-target
    Kuhn-Struik sqrt(TN) (not comparable, single target); special-curve attacks
    (out of scope); and no published prime-field index calculus. On the narrow
    axis "presentation-independent statement of the prime-field decomposition
    demand curve" the corpus holds nothing and this record is dominated by
    nothing -- which is a statement about a gap in the corpus, not about the
    frontier.

  sota_delta: >-
    +0 on time, memory and queries. Quantified deltas: (i) eps_required is
    reduced from a tree-indexed formula to a two-parameter law in (A, E),
    retiring the tree hypothesis on the demand side; (ii) hybrid guessing is
    shown exactly demand-neutral and hence strictly harmful in this family,
    sharpening IDEA-20260808-da1428 from a comparison into an invariance;
    (iii) overdetermination is shown unavailable by a codimension argument, so
    batching cannot buy equations; (iv) three divisor presentations are placed
    on the same table as the tree rows, which is the first non-tree row this
    lane has. If E2 obtains, the delta becomes a reopened family with a
    computable margin; if E1 obtains, two separately committed closures merge
    into one presentation-independent law, which is the more reusable outcome.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    ~0.9 that the law (A) reproduces the committed table and that hybrid
    neutrality holds (both are algebra). ~0.85 that the H-eliminated variant
    lands exactly on IDEA-20260903-e0a3e8's e-box, i.e. reproduces a committed
    closure. ~0.15 that the pairwise or H-retained variant sits strictly below
    the tree curve. ~0.05 that any variant produces a positive margin. Priority
    HIGH because it is a day of algebra with no compute, because it decides the
    scope of a closure that was committed today, and because its likely negative
    is a strictly stronger and more reusable statement than the two closures it
    would merge.

  scope: >-
    Algebraic presentations of the prime-field m-point decomposition condition
    with box-bounded unknowns, evaluated on the demand curve of
    IDEA-20260903-81a943 and the reach instrument tools/smallroot_reach.py.
    Symbolic and toy tier only. Not a statement about solvers whose certificate
    is not over a box, and not a claim that the three enumerated presentations
    exhaust the space.

