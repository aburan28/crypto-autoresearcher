idea:
  id: IDEA-20260904-e9675e
  question_id: RQ-PFDR-ae2fba
  added: '2026-09-04'
  proposed_by: idea-generator
  status: proposed
  title: >-
    THE TREE HYPOTHESIS IS NOT LOAD-BEARING ON THE DEMAND SIDE: eps_required
    depends only on the NUMBER of bounded auxiliary unknowns A, not on how they
    are wired, so "non-tree" can only win through the degree-versus-A curve --
    and the concrete candidate is the divisor presentation, where composing two
    partial sums is polynomial MULTIPLICATION (bilinear) instead of resultant
    elimination (degree-doubling). One derivation and one calculator run decide
    whether divisor-first and symmetric-coordinate strategies are two faces of a
    single invariant-ring law or a genuinely different curve.
  class: mechanism

  claim: >-
    (A) THE AUXILIARY-COUNT LAW. Let a decomposition test for
    "P_1 + ... + P_m = R with x(P_k) in a window p^beta" be ANY algebraic
    presentation with E equations and A auxiliary unknowns bounded to windows
    p^{gamma_a} (the m leaves plus the A auxiliaries being all bounded
    unknowns). Re-running the closure's demand derivation without the tree
    assumption -- yield p^{m beta - 1 + sum_a (gamma_a - 1)}, relation count
    p^{beta}, sparse linear algebra p^{2 beta}, solvability
    m beta + sum_a gamma_a <= eps * E -- and eliminating sum gamma gives
    eps_required = (A + 1/2 + beta) / E, with beta > 1/(2(m-1)); and for a
    complete-intersection presentation (E = A + 1, forced because the solution
    variety of the decomposition condition has dimension m-1 and the bounded
    unknowns number m + A) this is
    eps_required = 1 - (1/2 - beta) / (A + 1).
    This reproduces the closure's (w + 1/2 + 1/(2(m-1)))/(w+1) at A = w, E = w+1
    exactly, and it says the tree was never doing work here: DEMAND SEES ONLY A.
    Two corollaries fall out, both checkable and neither recorded in this
    corpus: (i) HYBRID-GUESS NEUTRALITY -- exhaustively guessing k leaves
    multiplies the target cost by p^{k beta} and shrinks the box by the same
    p^{k beta}, so eps_required is EXACTLY unchanged, while the supply falls
    because reach rises with the number of unknowns at fixed per-variable
    degree; hybrid guessing is therefore strictly harmful in this family, which
    is a sharper statement than IDEA-20260808-da1428's "hybrid dominates the
    algebra"; (ii) OVERDETERMINATION IS UNAVAILABLE -- E > A + 1 would relax the
    demand, but the codimension of the decomposition variety is exactly A + 1,
    so extra equations are dependent and buy nothing in the information
    normalization; batching several targets over a shared pool of unknowns
    trades yield for equations at exactly the conserved rate of KN-FIND-007.
    (B) WHAT IS THEREFORE LEFT. The only non-tree lever is the DEGREE-versus-A
    curve. Trees pay per-variable degree 2^{l-1} with l = ceil((m+A)/(A+1)),
    which is what welds the levers together in the closure. The claim is that
    this curve is a property of the PRESENTATION, not of the group law, and
    that the divisor presentation has a different one: writing the decomposition
    as an effective divisor D = P_1 + ... + P_m with Mumford data (G, H),
    G = prod (x - x_k) and H the interpolation of the y-values with
    H^2 = E(x) mod G, composition of two partial sums is G_1 * G_2 -- BILINEAR
    in the coefficients, per-factor degree 1 -- where tree elimination is a
    resultant that doubles the degree.
    (C) THE PRICE, STATED BEFORE THE EXPERIMENT. The coefficients of G are the
    elementary symmetric functions of the x_k, so the G-box has volume
    prod_j C(m,j) B^j = c_m B^{m(m+1)/2} instead of B^m. That is exactly the
    inflation IDEA-20260903-e0a3e8 measures, and its (T2) shows the fully
    symmetrized box dies at the information ceiling for every m
    (2/(m+1) < m/(2(m-1)) always). So the divisor presentation is NOT free: it
    buys degree with box volume, and the open question is whether the exchange
    rate is favourable in the ONE cell e0a3e8 leaves open -- pair blocks (c = 2),
    where the ceiling is 2/3 and the band is non-empty only at m >= 5, needing a
    block reach above 0.9375. Keeping H as an unknown instead of eliminating it
    avoids the inflation but adds UNBOUNDED auxiliaries, which must be counted
    at gamma = 1 and are therefore the honest cost of the alternative.
    (D) THE DISCRIMINATION. Compute, for m in {4, 5, 6}, the (A, E, worst
    per-variable degree, bound-volume exponent, eps_avail, eps_required) row of
    the divisor presentation in three variants -- H eliminated (symmetric
    coordinates), H retained and unbounded, and pairwise Mumford blocks -- and
    place them on the same table as the tree rows. E1: every variant lands on or
    above the tree's degree-versus-A curve, and the mechanism is the same in both
    cases, namely that any polynomial coordinate on the quotient by the ordering
    has invariant-ring degree sequence 1..m and therefore inflates the box by
    exactly what the degree drop saves. Then the closure of IDEA-20260903-81a943
    and the closure of IDEA-20260903-e0a3e8 are two faces of one law, and it is
    presentation-independent, not tree-specific. E2: some variant sits strictly
    below the curve -- a decomposition test with low degree at low A and no box
    inflation -- and the windowed family reopens at a computable margin, with a
    concrete algorithm to specify.

  mechanism: >-
    The closure welds supply and demand through one identity: a kept internal
    node's value is an input to its parent's block, so the w+1 blocks consume
    m+w inputs. That identity is a fact about TREES. The demand law (A) shows
    the other half of the weld -- the demand curve -- is not; it counts
    auxiliaries and nothing else. So the whole question migrates to a single
    quantity, the minimum per-variable degree achievable with A auxiliaries, and
    that quantity is presentation-dependent. Divisor arithmetic is the natural
    place to look because composition there is multiplication of polynomials
    (Cantor composition without reduction), which is bilinear, while every
    x-coordinate presentation of the group law is quadratic and compounds. The
    counterweight is equally structural: passing to divisors quotients by the
    ordering of the points, and the fundamental theorem of symmetric functions
    says every polynomial coordinate on that quotient has degree sequence
    1, ..., m, so the smallness of the leaves is spent on the size of the
    coordinates. The experiment is whether those two structural facts cancel
    exactly or leave a remainder, and in which direction.

  novelty_status: unverified

