  novelty_screen:
    method: >-
      Filesystem screening; the crypto-kb retrieval server is bound to ':memory:'
      and returns nothing. Read: the session prior-art digest covering all 12
      filed RQ-EWALK-8fa147 proposals; EV-ENDO-10109d in full;
      knowledge/techniques/KN-TECH-018.md; the RQ-EWALK record. One WebSearch was
      run for external ingredient scouting and returned the negation-map
      literature; two WebFetch attempts on the primary PDFs FAILED and are
      recorded as failures, not as reads.
    results: >-
      NEAREST FILED WORK, NAMED. (1) IDEA-20260807-6355c6 fills the gap left by
      H-RHO-bc6ea6's Aut(E) = 2 assumption and measures net gain against a
      pre-registered 1/(2r) -- it MEASURES the rate; this record asks whether the
      thing that reported zero was measuring that rate at all. (2)
      IDEA-20260807-cbbcfd identifies the binding constraint of the lane as a
      ratio of two heavy-tailed variables with wide intervals at 16-200 samples,
      and proposes a variance-reduction design. It is the closest record and it
      argues for a better estimator; this record instead computes the MDE of the
      estimator ALREADY COMMITTED and converts it into a named obstruction with a
      number and a required sample size. (3) IDEA-20260807-59f5b7 audits
      inputs/h100_session/h040_rho_const.json at 16 and 18 bits with
      fruitless-cycle escape. (4) IDEA-20260807-ebcae6 asserts a CEILING on
      rho-type collision walks that gain by identifying points under an
      End_{F_p}(E) action. (5) IDEA-20260815-08fbb3 asks whether real (non-random)
      branch partitions shift collision time by a constant.
    verdict: >-
      UNVERIFIED, and distinct from all five. No filed record computes the
      committed run's minimum detectable effect, states the seed count needed to
      reach the literature's tax scale, or observes that the reported zero
      fruitless-cycle counts are inconsistent with EVERY per-step rate down to
      about 1/5000. The novelty is in re-reading two committed numbers as
      obstructions, which docs/inventor-protocol.md section 4 requires and which
      tools/obstruction_registry.py --debt flags as outstanding for this family.

  object_first_candidate:
    tracked_object: >-
      THE COUNTER'S EVENT DEFINITION -- the indicator function the instrument
      actually increments -- followed through one walk, alongside the walk's
      realised step count. Established families declared off-limits as the primary
      lens: net-gain ratios, rho step counts, GLV split walks, and orbit-quotient
      constructions. The object here is not the walk and not the gain; it is the
      counter.
    lossiness: >-
      PASSES THE TEST. The projection (full walk trajectory) |-> (number of
      counter increments) discards the entire trajectory, the collision, the
      logarithm, and every point visited; what remains is one non-negative
      integer per walk. It is emphatically not a change of coordinates -- the
      fibre over 0 contains both "no cycle occurred" and "a cycle occurred and was
      escaped before the counter's test point", and separating those two is the
      whole content of this proposal. The retained part propagates
      deterministically because increments are a function of consecutive step
      indices alone.
    propagation: >-
      One-step propagation is defined and measurable: at step i the counter's
      predicate is a function of (branch index at i, branch index at i-1,
      canonical representative at i, canonical representative at i-1). Making that
      predicate explicit and measuring its firing rate per step, rather than per
      walk, is the experiment.
    survival_score: >-
      Survives as long as the walk is an r-adding walk on a quotient by a finite
      group action -- which covers negation, j=0 sextic, j=1728 quartic, and GLV
      splits -- and dissolves for walks whose step function is not branch-indexed
      (e.g. pure multiplicative walks), which are out of scope here.

  proof_search_map:
    bottleneck: >-
      The step at which the campaign converts an observed ratio-to-ceiling of
      about 1.00 into the statement "the walk sits ON the ceiling". That step
      requires a resolution claim, and no resolution has ever been computed. Its
      removal changes what GOAL-ENDO-001's P3 pause condition can detect.
    baseline_embedding:
      parameter_slice: >-
        The committed 20-seed, two-arm run at p = 100057 recorded in
        EV-ENDO-10109d, together with the earlier single-draw
        inputs/h100_session/h040_rho_const.json at 16 and 18 bits.
      reproduction_check: >-
        Recompute mean, sd, range, exceed-counts and fruitless-cycle counts for
        both arms directly from the committed raw run artifacts and require exact
        agreement with 1.0043/0.1128 and 1.0442/0.1059. The committed Validator
        report already claims an exact recomputation of these; reproducing it is
        the frozen regression fixture and costs seconds.
    observation_collision:
      observable: >-
        The reported per-walk fruitless-cycle count.
    distinct_preimage_search: >-
      A COLLISION IS ASSERTED, NOT MERELY SEARCHED FOR, AND IT IS THE POINT OF
      THE RECORD. Two distinct ground-truth objects produce the identical
      observable 0: a walk in which no cycle was ever entered, and a walk in
      which cycles were entered and escaped before the counter's test point. One
      lies on each side of the conclusion "the walk pays no cycle tax". The
      observable is therefore NOT identifying, and no conclusion about the tax
      may rest on it until an additional condition -- the counter-semantics probe
      of the minimal test -- separates the two preimages.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace the single per-walk count by the triple (entries, escapes,
          fatal terminations) recorded per step, preserving more state than the
          final statistic needs.
        predicted_gain: >-
          Distinguishes E1 from E3 in one run; the single count cannot, by the
          collision above.
      - transform: specialization_pack
        proposed_object: >-
          A problem-specific resource measure: cycle tax expressed as
          (extra group operations spent on detection, escape and canonicalisation)
          divided by (total group operations), charged over the provably disjoint
          blocks "steps inside an escape" and "steps outside".
        predicted_gain: >-
          Makes the tax additive and directly comparable to the recalled
          sub-1%-of-iterations figure, which a ratio-to-ceiling statistic cannot be.
    quantifier_order: >-
      THE COMMITTED CLAIM, WRITTEN OUT: "FORALL seeds s in the tested set, the
      realised gain equals the ceiling" is what "sitting on the ceiling" reads as,
      and it is NOT what was tested. What was tested is "THERE EXISTS a sample of
      20 seeds whose mean gain is within 0.005 of the ceiling", which is a
      statement about a sample mean and permits a per-seed shortfall anywhere
      inside +-0.07. The claim of this record is: FORALL per-step entry rates q
      >= 1/5000, P(at least 38 of 40 independent walks report exactly zero
      entries) < 1e-3 -- a universally quantified statement over q with no
      witness freedom, which is why it is robust to not knowing L.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At p = 100057 with n = 20 seeds, the committed instrument excludes a
        cycle tax larger than 0.0707 (j=0) / 0.0663 (j=1728) in ratio-to-ceiling
        units, and its fruitless-cycle counter is (or is not) counting entries."
        It can never certify that the walk attains the ceiling, and it cannot
        adjudicate any effect below 1% without about 1000 seeds per arm.
      nearby_object_control: >-
        A CURVE WITH |Aut| = 2 ONLY (generic j, r = 1). There the orbit-quotient
        cycle mechanism this counter is named for does not exist in the same form,
        and the counter's reading is a direct read of what it counts. If it
        reports non-zero counts there at the same rate, it is measuring something
        other than orbit-induced fruitless cycles. Second nearby object: a walk
        with the escape mechanism DISABLED, where E1 predicts the count jumps to
        tens per walk and E2/E3 predict it stays near zero.
    proof_obligations:
      - claim: "SE = sd/sqrt(20) and MDE = 2.8016*SE at alpha=0.05, power 0.80"
        responsibility: baseline
      - claim: "n = 999 seeds per arm for MDE = 0.01 at the observed sd"
        responsibility: size
      - claim: "expected rho length on N/r classes is ~sqrt(pi N/(2r)), 229 and 280 steps"
        responsibility: runtime
      - claim: "P(count=0) = (1-q)^steps and 38-of-40 zeros needs q < ~1/5000"
        responsibility: success_probability
      - claim: "the reported zero has two distinct preimages (entered-and-escaped vs never-entered)"
        responsibility: correctness
      - claim: "the planted-cycle control must increment the counter or E3 holds"
        responsibility: feasibility
      - claim: "toy tier, one prime, two curves, 20 seeds; no transfer asserted"
        responsibility: scope
    not_applicable_reason: null

  assumptions:
    - >-
      The 40 curve-seed samples are 20 seeds on each of 2 curves per arm, or an
      equivalent layout; the exact layout must be read off the committed run
      before the binomial arithmetic in (B) is quoted in any record.
    - >-
      The walks are full rho walks rather than distinguished-point segments. If
      they are segments, explanation E4 applies and the step counts committed in
      the run settle it immediately at zero compute.
    - >-
      The 20 seeds are independent. If the seed derivation shares state across
      arms, the effective n is smaller and every MDE above is optimistic --
      i.e. the obstruction is understated, never overstated, by this assumption.

  predictions:
    - metric: >-
        recomputed_MDE of the ratio-to-ceiling statistic at n = 20, both arms
      direction: higher
      minimum_effect: >-
        >= 0.06 in ratio units. If the recomputation instead gives MDE <= 0.01,
        claim (A) is false and the committed result really does bound the tax at
        the literature's scale.
    - metric: >-
        seeds_required for MDE = 0.01 at the observed sd
      direction: higher
      minimum_effect: >-
        >= 500 per arm. A number below 100 would mean the committed n = 20 was
        nearly adequate and (A) overstates the gap.
    - metric: >-
        planted_cycle_counter_increment: counter value on a walk instance
        constructed so that two consecutive steps provably take the same branch
        on the same orbit
      direction: higher
      minimum_effect: >-
        >= 1, deterministically. A zero here is DECISIVE for explanation E3 and
        means no negative may be recorded from this counter (GOAL-ENDO-001 P1).
    - metric: >-
        entries_per_walk under an instrumented copy that counts ENTRIES and
        ESCAPES separately, 20 seeds, identical seeds and curves
      direction: higher
      minimum_effect: >-
        Mean entries > 5 per walk selects E1 (the committed zero was counting
        fatal cycles); mean entries < 0.5 with the planted control passing selects
        E2 (the pre-registered 1/(2r) is the wrong rate).
    - metric: >-
        analytic_entry_rate q computed from the frozen walk's branch count L and
        step function, before any run
      direction: different
      minimum_effect: >-
        Reported with L. If q >= 1/64 the committed zeros are impossible under any
        entry-counting semantics and E1 or E3 must hold; if q <= 1/5000 the zeros
        are expected and E2 holds.
    - metric: >-
        rate_decay: measured entries per step as L is swept over {4, 8, 16, 32, 64}
        at fixed p and fixed r
      direction: lower
      minimum_effect: >-
        A fitted exponent of q against 1/L within [0.7, 1.3]. A rate that does NOT
        decay as L increases is the canonical artifact tell of
        docs/inventor-protocol.md section 3 and voids the counter regardless of
        every other arm.
    - metric: >-
        matched unquotiented rho step count on identical seeds (the ratio's
        denominator, re-measured rather than carried forward)
      direction: different
      minimum_effect: >-
        Agreement with the committed denominator to within 2%. A larger
        disagreement means the ratio's two halves came from different conditions
        and the ceiling comparison is not matched.

  minimal_test:
    design: >-
      FIVE STEPS, THE FIRST THREE COSTING ESSENTIALLY NOTHING.
      STEP 1 (zero compute): recompute SE, MDE and required-n from the committed
      sd and n; read the frozen walk's branch count L, step function and the
      realised step counts out of the committed run artifacts; compute the
      analytic entry rate q and P(count = 0) at that q. This alone decides among
      E1/E2/E4 in most outcomes.
      STEP 2 (minutes): PLANTED-CYCLE POSITIVE CONTROL. Construct an instance in
      which a fruitless 2-cycle is forced -- choose the partition index so that
      two consecutive steps select the same branch on the same Aut-orbit -- and
      assert the counter increments. Report the increment or the failure.
      STEP 3 (minutes): NEGATIVE CONTROL. Run the identical counter on a generic-j
      curve with |Aut| = 2 and on a walk with escape disabled; report both.
      STEP 4 (hours): COUNTER-SEMANTICS PROBE. Instrument a copy that records
      (entries, escapes, fatal) per step; re-run the same 20 seeds and the same
      two curves at p = 100057 with byte-identical seed derivation, and report all
      three series.
      STEP 5 (optional, only if steps 1-4 leave the tax question live): the
      1000-seed run at p = 100057 that would give MDE = 0.01, budgeted and
      costed in advance rather than started.
    controls:
      - >-
        PLANTED-CYCLE POSITIVE CONTROL (an instrument that cannot detect a planted
        signal cannot support a negative -- RQ-INSTR-f8faa0, GOAL-ENDO-001 C4).
      - >-
        NULL OBJECT: generic-j curve with |Aut| = 2, where the orbit-induced cycle
        mechanism is absent; the counter must read at its floor.
      - >-
        ESCAPE-DISABLED ARM, which separates E1 from E2/E3 by construction.
      - >-
        DECAY CONTROL over the branch count L; a non-decaying rate voids the
        counter.
      - >-
        MATCHED BASELINE: unquotiented rho on identical seeds, re-measured in the
        same run, since the reported statistic is a ratio and an unmatched
        denominator is not a comparison (RQ-EWALK constraint; KN-TECH-018).
      - >-
        BIT-IDENTICAL SEED DERIVATION between the committed run and the
        instrumented copy, so any difference is attributable to the
        instrumentation and not to the draw.
    required_metrics:
      - SE, MDE and required-n per arm, with the formula and the alpha/power used
      - branch count L, step function, realised step counts, analytic q, P(count=0)
      - planted-cycle counter increment (pass/fail, with the constructed instance archived)
      - entries, escapes and fatal counts per walk under the instrumented copy
      - counter reading on the |Aut| = 2 null and on the escape-disabled arm
      - fitted decay exponent of q against 1/L over the swept L
      - matched unquotiented step counts on identical seeds
      - artifact manifest with hashes, seeds, and a from-scratch rebuild receipt

  falsification_conditions:
    - >-
      The recomputed MDE is <= 0.01. Claim (A) is false: the committed 20-seed run
      does bound the cycle tax at the scale that matters, and the lane's
      calibration is adequate. This is a clean, cheap, fully available negative.
    - >-
      The planted cycle increments the counter, the instrumented copy still
      reports ~0 entries, AND the analytic q from the frozen L is below 1/5000.
      Then E2 holds: the zeros are correct, the walk's true entry rate is
      Theta(1/L), and the campaign's pre-registered 1/(2r) reference is wrong and
      must be superseded. Claim (B)'s anomaly evaporates and the deliverable is
      the corrected rate.
    - >-
      The planted cycle does NOT increment the counter. E3 holds, this is a fifth
      instrument defect, every fruitless-cycle number in the campaign becomes
      attempted_and_inconclusive under GOAL-ENDO-001 P1, and no negative may be
      read from any of them.
    - >-
      The entry rate does not decay as L increases. The counter is measuring an
      artifact and no reading of it -- zero or otherwise -- supports anything.
    - >-
      The re-measured unquotiented denominator disagrees with the committed one by
      more than 2%. The ratio was not matched and the ceiling comparison must be
      redone before any of the above is interpreted.

  confounders:
    - >-
      RATIO OF HEAVY-TAILED VARIABLES. The ratio-to-ceiling statistic divides two
      heavy-tailed rho lengths, so its sd is not a clean normal scale parameter
      and the 2.8016*SE formula is a normal approximation. MITIGATION: report a
      bootstrap MDE alongside the normal one; if they differ materially, quote the
      bootstrap. The direction of the error matters: a heavier tail makes the true
      MDE LARGER, so claim (A) is conservative under this confound.
    - >-
      SEED CORRELATION ACROSS ARMS. If j=0 and j=1728 arms share seeds, their
      errors are correlated and the two MDEs are not independent evidence.
    - >-
      COUNTER PLACEMENT. Where in the step loop the counter's test sits determines
      which preimage it sees; the instrumented copy must record the placement, not
      just the counts, or step 4 reproduces the same ambiguity in a new file.
    - >-
      TOY SCALE INTERACTION. At 17 bits the walk is about 229 steps, so a tax that
      is per-cycle rather than per-step could be invisible simply because few
      cycles occur -- which is E2 in a different guise and is why the analytic q
      from L must be computed before, not after, the runs.
    - >-
      OBSERVER EFFECT. Instrumenting the walk changes its per-step cost; the
      instrumented copy must report GROUP OPERATIONS, not wall time, or the
      measured tax is the instrumentation.

  interpretation_limits:
    - >-
      TOY TIER. One prime (p = 100057, 17 bits), two special-j curves, 20 seeds.
      Nothing transfers to cryptographic scale and no transfer is offered.
    - >-
      NO EXPONENT MOVES IN EITHER DIRECTION AND NO ATTACK IS PROPOSED. The
      sqrt(|Aut|) discount is and remains a constant factor on exponent 1/2
      (KN-TECH-018); this record is about whether the program can MEASURE that
      constant, not about beating it.
    - >-
      A DEMONSTRATION THAT THE INSTRUMENT IS UNDERPOWERED IS NOT EVIDENCE THAT THE
      WALK PAYS A TAX. It is evidence that the committed run cannot say either
      way, which is a different and weaker statement, and the record must say so
      in those words.
    - >-
      THE RECALLED SUB-1% FIGURE IS A POINTER. If the literature's tax is in fact
      larger, the required-n figure shrinks and the obstruction is milder; the
      arithmetic of claim (A) is independent of it.
    - >-
      RESULTS BEAR ON THIS WALK IMPLEMENTATION. A different escape strategy
      (cycle detection versus preemptive doubling) has a different rate and a
      different tax, and none of this transfers between them.

  heuristic_assumptions:
    - id: H1
      statement: >-
        RHO LENGTH LAW ON THE QUOTIENT. The total rho length (tail plus cycle) of
        the r-adding walk on the |Aut|-quotient of a group of order N is
        distributed as the birthday law on N/r classes, with mean
        sqrt(pi (N/r) / 2) and the standard rho shape, so that at N = 100057 and
        r = 3 the mean is about 229 steps.
      rigorous_support: >-
        RIGOROUS INGREDIENT: for a uniformly random function on a set of size M
        the expected rho length is exactly (1 + o(1)) sqrt(pi M / 2), a theorem
        about random functions with no cryptographic content. CLASSICAL STATEMENT
        IMITATED: the r-adding walk behaves like a uniformly random function on
        the quotient -- the same modelling assumption every published rho analysis
        makes, and the one IDEA-20260815-08fbb3 questions for real partitions.
      falsification_condition: >-
        The empirical mean step count in the committed run departs from
        sqrt(pi (N/r)/2) by more than 25%, or the empirical CDF fails a
        Kolmogorov-Smirnov test against the rho-length law at the 1% level.
      validation_plan: >-
        SAMPLE: the 40 committed curve-seed step counts at p = 100057, plus 200
        fresh seeds if the committed counts are not archived per-seed. SHORTCUT:
        none needed -- this is directly computable at toy scale, which is the
        point of measuring it here rather than assuming it. COMPARISON: empirical
        CDF against the theoretical rho-length distribution on N/r classes.
        TAIL CHECK: the longest observed walk against the predicted 1/40 upper
        quantile, which is where the heavy tail bites and where
        IDEA-20260807-cbbcfd's warning applies. TRANSFER: none asserted; the law
        is checked at exactly the parameters used.
    - id: H2
      statement: >-
        BERNOULLI ENTRY MODEL. Fruitless-cycle entries occur as an independent
        Bernoulli process across steps with a single per-step probability
        q = Theta(1/L) in the branch count L, so the per-walk count is
        Binomial(steps, q) and P(count = 0) = (1 - q)^steps.
      rigorous_support: >-
        RIGOROUS INGREDIENT: for the standard negation-map 2-cycle, entry requires
        two consecutive steps to select the same branch on the same orbit
        representative, an event whose probability is exactly 1/L under the
        random-function model for branch selection, and consecutive-step events
        overlap in at most one step so the dependence is short-range. CLASSICAL
        STATEMENT IMITATED: the Poisson clumping / rare-event approximation for
        short cycles in random mappings.
      falsification_condition: >-
        The measured per-step entry rate fails to scale as 1/L across the swept L,
        or the per-walk counts are materially over-dispersed relative to
        Binomial(steps, qhat), indicating clumping the model does not capture.
      validation_plan: >-
        SAMPLE: 200 walks at each L in {4, 8, 16, 32, 64} at p = 100057 with
        entries counted per step by the instrumented copy. COMPARISON: fitted
        exponent of qhat against 1/L, target 1.0; and a dispersion test of the
        per-walk counts against the binomial. TAIL CHECK: the maximum per-walk
        count against the binomial's 1/200 quantile. TRANSFER: the extrapolation
        from L in {4..64} to whatever L the frozen walk uses is stated explicitly
        and is the one transfer assumption in this arm.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS CLAIMED OR MOVED. The subject is a constant factor on
      exponent 1/2. This record is explicitly a BUILDING BLOCK, not an
      exponent-moving idea, and is prioritised on that ground: GOAL-ENDO-001's
      pause condition P3 is defined relative to the automorphism-discounted
      baseline, and a pause condition whose instrument has an unmeasured
      resolution cannot fire honestly. Experiment cost: step 1 is arithmetic;
      steps 2-4 are of order 10^4-10^6 group operations at p = 100057; step 5, if
      taken, is 1000 seeds x ~250 steps x 2 arms, still under 10^6 group
      operations.
    memory_exponent: >-
      O(1) per walk beyond the distinguished-point store; negligible at every
      scale considered. No preprocessing and no table.
    best_known: >-
      The incumbent is the automorphism-discounted Pollard rho baseline of
      KN-TECH-018: expected steps ~0.886 sqrt(pi N / 2) / sqrt(r) with r =
      |Aut|/2, O(w) memory, linear parallel speedup under van Oorschot-Wiener
      distinguished points. BSGS at ~sqrt(N) time and ~sqrt(N) memory is the other
      mandatory matched control under RQ-EWALK-8fa147's constraints. Nothing here
      beats either; the record measures how precisely the program can compare
      against them.
    hidden_overhead: >-
      NOTHING HIDES IN AN o(1) BECAUSE NO ASYMPTOTIC IS CLAIMED. What is disclosed
      instead: the ceiling sqrt(|Aut|/2) that the committed statistic is
      normalised against already assumes zero cycle tax and zero canonicalisation
      cost, so a measured ratio of 1.00 is consistent with a real implementation
      paying both and the ceiling being defined too generously -- which is a
      DEFINITIONAL, not statistical, caveat and applies whatever n is.
    tradeoff_note: >-
      The relevant tradeoff is parallel: van Oorschot-Wiener distinguished-point
      collision search interacts with the negation quotient because two walks that
      merge must report the same distinguished point, and a canonicalisation that
      is not a true class function breaks that soundness (IDEA-20260807-15b468
      states the constraint). Any escape strategy adopted to fix cycles must be
      checked against that soundness constraint, and this record does not assume
      the committed one was.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS BEFORE ANSWERING. As an attack: n/a (no result
    claimed); no time, memory or query point is offered and no frontier row
    applies. As a rho improvement: dominated by the published negation-map
    implementations (Bernstein-Lange-Schwabe and successors, recalled) which
    already handle cycles correctly and report the tax; this record proposes no
    walk and competes with none. As a statistical critique of a committed record:
    partially anticipated by IDEA-20260807-cbbcfd, which identifies the
    heavy-tailed-ratio problem and proposes a better estimator, but that record
    does not compute the MDE of the estimator already committed and does not
    address the fruitless-cycle counter at all. On the counter-semantics axis
    nothing in the corpus dominates it.
  sota_delta: >-
    ZERO on every attack axis. Time exponent unchanged at 1/2, memory unchanged,
    no query model touched, claim_tier toy. Quantitatively what changes is the
    program's own error bar: from an unstated resolution to a stated MDE of 0.0707
    (j=0) and 0.0663 (j=1728) at n = 20, with a required n of 999 to reach 0.01;
    and from a fruitless-cycle count of 0 whose event definition is unknown to a
    triple (entries, escapes, fatal) whose definition is archived.

  discriminated_from:
    - >-
      IDEA-20260807-6355c6 measures the negation-quotient net gain and cycle rate
      against a pre-registered 1/(2r). This record does not measure the gain; it
      asks whether the number that reported zero was counting the pre-registered
      event, and shows that under that very rate the reported zeros are a 1e-19
      event.
    - >-
      IDEA-20260807-cbbcfd proposes a variance-reduction design because the lane
      reports ratios of heavy-tailed variables. It improves a future estimator.
      This record computes the resolution of the estimator ALREADY COMMITTED and
      converts it into an obstruction with units, error bars and a required sample
      size, which is what docs/inventor-protocol.md section 4 asks for.
    - >-
      IDEA-20260807-ebcae6 asserts a CEILING on End_{F_p}(E)-quotient rho walks.
      This record neither asserts nor disputes that ceiling; it addresses whether
      the program can measure distance to it.
    - >-
      IDEA-20260807-59f5b7 audits an earlier 16/18-bit artifact with escape
      enabled. This record targets the committed 20-seed p = 100057 run and its
      counter, and its central arithmetic (P(count = 0) as a function of q) appears
      nowhere in that record.
    - >-
      IDEA-20260815-08fbb3 asks whether real branch partitions shift collision time
      by a constant. That is about the walk's mixing; this is about the counter's
      event definition. They are complementary and the decay control here reuses
      that record's concern as a control rather than as a hypothesis.

  estimated_cost:
    implementation: low
    compute: low

  recommended_priority: high

  honest_prior_of_survival: >-
    0.9 that the recomputed MDE exceeds 0.06 (it is arithmetic on committed
    numbers). 0.7 that the planted-cycle control passes, i.e. that E3 is NOT the
    explanation. 0.5 each between E1 (counter counts fatal cycles) and E2 (the
    pre-registered rate is wrong for this walk) conditional on the control
    passing. 0.1 that step 1 alone settles everything with no runs at all, which
    would be the cheapest possible outcome and is worth trying first for that
    reason.

