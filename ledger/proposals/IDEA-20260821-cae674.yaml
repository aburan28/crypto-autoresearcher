idea:
  id: IDEA-20260821-cae674
  question_id: RQ-EWALK-8fa147
  research_question: RQ-EWALK-8fa147
  added: '2026-08-21'
  title: >-
    THE COMMITTED "SITTING ON THE sqrt(|Aut|) CEILING" RESULT IS AN UNDERPOWERED
    NULL WITH AN MDE OF ABOUT 7%, AND ITS ZERO FRUITLESS-CYCLE COUNTS ARE
    INCONSISTENT WITH ANY PER-STEP CYCLE RATE THE WALK COULD PLAUSIBLY HAVE:
    recover both as measured obstructions with a planted-cycle positive control
    and a counter-semantics probe
  class: measurement

  claim: >-
    TWO SEPARABLE CLAIMS ABOUT ONE COMMITTED RECORD. NEITHER IS AN ATTACK AND
    NEITHER MOVES AN EXPONENT; BOTH BEAR DIRECTLY ON GOAL-ENDO-001'S OWN PAUSE
    CONDITION P3, WHICH CANNOT BE ADJUDICATED BY AN INSTRUMENT WHOSE RESOLUTION
    IS UNKNOWN.

    (A) THE POWER CLAIM, ARITHMETIC ONLY. EV-ENDO-10109d reports, at p = 100057
    (prime, 1 mod 12), over 20 seeds per arm: j=0 ratio-to-ceiling mean 1.0043,
    sd 0.1128, range 0.809-1.282; j=1728 mean 1.0442, sd 0.1059, range
    0.868-1.193; and reads both as "statistically consistent with sitting ON the
    sqrt(|Aut|/2) ceiling, with symmetric noise in both directions rather than a
    systematic shortfall". The standard errors are 0.1128/sqrt(20) = 0.02522 and
    0.1059/sqrt(20) = 0.02368. A two-sided test at alpha = 0.05 with 80% power
    detects only |delta| >= (1.960 + 0.8416) * SE = 2.8016 * SE, i.e. 0.0707 on
    the j=0 arm and 0.0663 on the j=1728 arm. CLAIM: the committed result
    therefore excludes only a cycle-mitigation-and-canonicalisation tax LARGER
    than about 7% of the ideal automorphism-quotient gain; it does not support
    "on the ceiling", and it is compatible with every tax the literature reports.
    THE NAMED OBSTRUCTION IS THE INSTRUMENT'S MINIMUM DETECTABLE EFFECT, and it
    is a measured quantity with units: 0.0707 and 0.0663 in ratio-to-ceiling
    units, at n = 20, p = 100057, read from EV-ENDO-10109d. To reach an MDE of
    0.01 -- the scale at which a sub-1%-of-iterations tax becomes visible --
    requires n = (2.8016 * 0.1128 / 0.01)^2 = 999 seeds per arm, a factor of 50
    more than was run. That number, not the mean, is the decision-relevant
    output of the committed run.

    (B) THE ZERO-COUNT CLAIM, WHICH IS THE MORE CONSEQUENTIAL OF THE TWO. The
    same record states: "Fruitless-cycle counts are near-zero throughout (38-40
    of 40 curve-seed samples exactly zero in every arm)". Take the walk on
    E(F_p)/Aut with r = |Aut|/2 orbit size (r = 3 at j=0, r = 2 at j=1728). The
    expected rho length on N/r classes is about sqrt(pi N / (2r)), which at
    N ~ 100057 is about 229 steps (r = 3) and about 280 steps (r = 2). If cycle
    ENTRIES occur as a Bernoulli process with per-step probability q, the
    expected count per walk is about 229q, and P(count = 0) = (1 - q)^229. At the
    rate this campaign itself pre-registered, q = 1/(2r) = 1/6
    (IDEA-20260807-6355c6 records the pre-registration), the expected count is
    about 38 and P(count = 0) is about 7e-19. The conclusion is ROBUST ACROSS
    THE ENTIRE PLAUSIBLE RANGE OF q: even at q = 1/64 the expected count is 3.6
    and P(count = 0) = 0.027, so P(at least 38 of 40 samples exactly zero) is
    below 1e-40; only q below roughly 1/5000 -- a branch count of several
    thousand -- makes 38-of-40 zeros likely. CLAIM: exactly one of the following
    holds, and a cheap experiment decides which.
    (E1) SEMANTICS. The counter records unescaped or FATAL cycles, not entries.
    Then 0 is a success rate for the escape mechanism and carries no information
    about the tax at all -- and CORR-20260807-3ee25d D9's disposition, that there
    was "no persistent shortfall to explain", rests on a quantity that could not
    have shown one.
    (E2) RATE. The walk's branch count L is in the thousands, so the true entry
    rate is Theta(1/L) with L >> 2r and the pre-registered 1/(2r) is simply the
    wrong reference. Then the zeros are correct and meaningful, and every
    campaign statement referenced to 1/(2r) is mis-referenced and must be
    restated -- which is itself a useful, recordable correction.
    (E3) DEFECT. The counter is not incremented on the code path the 20-seed run
    actually took. This would be the FIFTH instrument defect found in this
    campaign, after the three in CORR-20260807-3ee25d, CORR-20260807-a05e1e and
    CORR-20260807-9f83be; the base rate is not low.
    (E4) LENGTH. The walks are distinguished-point segments far shorter than a
    full rho tail, so 229 is the wrong step count. Decidable by reading the
    committed step counts, which the run already records.

  mechanism: >-
    A ratio-to-ceiling statistic is a ratio of two heavy-tailed random variables
    (IDEA-20260807-cbbcfd names exactly this problem for this lane), so its
    sampling distribution is wide and 20 seeds buys little resolution. The
    campaign's reading of that width as "symmetric noise in both directions
    rather than a systematic shortfall" is a statement about the point estimate;
    the width itself is the finding. Separately, a fruitless-cycle counter is the
    only instrument in the lane that could show WHERE the tax is paid, and a
    counter reporting exact zeros in 95% of samples is either measuring a
    different event from the one its name suggests or is not firing. Both
    failures have the same consequence: the lane's incumbent -- the
    sqrt(|Aut|)-discounted rho baseline of KN-TECH-018, which every prime-field
    advantage claim in this program must beat -- is currently calibrated by an
    instrument whose resolution and whose event definition are both unstated. P3
    of GOAL-ENDO-001 pauses the campaign whenever a candidate "appears to exceed
    the automorphism-discounted rho baseline"; an instrument with a 7% MDE cannot
    trigger that condition honestly in either direction.

  novelty_status: unverified

  citations:
    - ref: EV-ENDO-10109d
      provenance: internal
      claim: >-
        j=0 mean 1.0043 sd 0.1128 range 0.809-1.282; j=1728 mean 1.0442 sd 0.1059
        range 0.868-1.193; 20 seeds, p = 100057; fruitless-cycle counts exactly
        zero in 38-40 of 40 curve-seed samples in every arm; N5 read as consistent
        with sitting on the sqrt(|Aut|/2) ceiling.
      verified_by: this idea-generator session, read in full
    - ref: KN-TECH-018
      provenance: internal
