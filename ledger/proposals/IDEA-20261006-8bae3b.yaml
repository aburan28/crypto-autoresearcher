# =============================================================================
# IDEA-20261006-8bae3b — within-cell range of grevlex solving degree.
# Proposal only. No hypothesis and no experiment contract in this pass.
# Novelty is unverified. This session opened the named frontier rows
# and did not record a degree.
# =============================================================================
idea:
  id: IDEA-20261006-8bae3b
  question_id: RQ-SDEG-001
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    Eight S_4 targets at p = 37, B = 5 spread by at least 2 in grevlex
    solving degree
  class: control
  claim: >-
    On the first ordinary short-Weierstrass curve over F_37, with
    m = 3, one factor base of B = 5 x-coordinates, and eight targets
    from the prime-order subgroup, the maximum grevlex solving degree
    minus the minimum, over those eight S_4 systems, is at least 2.
    The same range of at least 2 holds on a second ordinary curve
    over F_37. A finished range of 0, all eight degrees equal, is the
    concrete negative: one number already describes the cell. A
    finished range of 1 fails the minimum effect and is also a
    negative. No exponent improvement is claimed. The eight targets
    are not split into hits and misses. Representation class R1;
    attack stage relation decomposition.
  mechanism: >-
    The tracked object is the range of d_solve inside one (p, B)
    cell. A growth law that quotes one degree per cell treats that
    range as zero. The generators share the membership polynomial
    and differ only by the target abscissa inside S_4. If that
    specialisation moves the degree by 2 or more, a single cell
    summary is a lossy projection. If the range is 0, the
    specialisation did not move the degree and the summary is
    faithful on this cell. The witness bases are discarded. The
    priced number is the range.
  novelty_status: unverified
  citations:
    - ref: KN-OPEN-002
      provenance: internal
      claim: >-
        Growth of prime-field solving degree with bit size and m is
        open. A within-cell range is a possible confounder of any
        single number per cell.
      verified_by: knowledge/open-problems/KN-OPEN-002.md
    - ref: KR-IC-0d2021
      provenance: internal
      claim: >-
        Degree-of-regularity refinements predict a degree for a
        system shape. They do not, in that row, state an eight-target
        range at p = 37.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-0d2021.yaml
    - ref: KR-IC-5a43e5
      provenance: internal
      claim: >-
        Summation polynomials fix the generator shape. They do not
        state the range across targets.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
    - ref: KR-IC-5931ee
      provenance: internal
      claim: >-
        Naive prime-field Semaev index calculus is recorded there as
        not beating generic methods under stated assumptions.
        Baseline only.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5931ee.yaml
  assumptions:
    - >-
      All eight systems use one membership polynomial and one
      monomial order, grevlex. Only the target abscissa changes.
    - >-
      Field equations are omitted. A polynomial of total degree at
      least 37 voids that target. A void makes the cell incomplete,
      not a range of 0.
    - >-
      Eight scored degrees are required. Fewer than eight is
      inconclusive.
  predictions:
    - metric: >-
        maximum d_solve minus minimum d_solve over eight S_4 targets
        at p = 37, B = 5, and the same range on a second ordinary
        curve
      direction: higher
      minimum_effect: >-
        at least 2 on both curves. A finished primary range of 0 is
        the concrete negative. A finished range of 1 fails the
        minimum effect and is also a negative.
  minimal_test:
    design: >-
      Fix p = 37. Take the first two ordinary models, skipping
      singular and trace-zero curves. On each curve draw one
      seed-recorded factor base of five liftable abscissae and eight
      subgroup targets. Solve the eight S_4 systems under grevlex.
      Report the eight degrees, the maximum, the minimum, and the
      range.
    controls:
      - >-
        Sixteen support-matched random systems on the primary curve,
        each with an independent target-like specialisation of one
        coefficient. If their range is 0 while the S_4 range is at
        least 2, the spread is special to S_4. If their range is
        also at least 2, the spread is a property of specialising
        one coefficient. The random range does not rewrite a
        finished S_4 range of 0.
      - >-
        The second curve must show a range of at least 2. One curve
        at least 2 and the other equal to 0 falsifies a stable
        within-cell spread.
      - >-
        A second build recomputes the eight primary degrees and must
        match exactly.
    required_metrics:
      - the eight degrees on each curve
      - the range on each curve
      - the range of the sixteen random systems
      - the count of voided targets
  falsification_conditions:
    - >-
      The primary range is 0 on eight scored degrees. One number
      describes the cell.
    - >-
      The primary range equals 1. The minimum effect of 2 failed.
    - >-
      One curve has range at least 2 and the other has range 0. The
      spread is curve-dependent.
  confounders:
    - >-
      A degree transcript that counts intermediate polynomials
      differently across targets can invent a range. The second
      build is the check. A mismatch is an instrument failure, not
      a range of 0.
    - >-
      Eight degrees can differ by 1 because of a single coefficient.
      The threshold is 2 so a one-step wobble is not success.
  interpretation_limits:
    - >-
      One prime and B = 5. A spread of 2 does not transfer to a
      growth law in bit size.
    - >-
      The range is not a bit-security claim and is not a hit-versus-miss
      comparison.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For sixteen support-matched random systems that differ by
        one specialised coefficient, the range of grevlex solving
        degree at p = 37 is 0.
      rigorous_support: >-
        No identity forces specialisation of one coefficient to
        preserve the solving degree. The assumption imitates the
        semi-regular model in which the degree is a function of the
        generator degrees and the monomial order alone, so a generic
        coefficient change does not move it. KR-IC-0d2021 records
        refinements of that model and does not state this range.
      validation_plan: >-
        The sixteen random systems are the validation. Compare their
        range with 0. Tail check: the maximum degree among the
        sixteen minus the median. Parameters are p = 37 and the S_4
        generator degrees only. No extrapolation.
  target_complexity:
    time_exponent: >-
      not beaten. Pollard rho remains Theta(N^{1/2}) group operations.
    memory_exponent: >-
      not beaten. Rho memory and the van Oorschot-Wiener interpolation
      stay as they are.
    best_known: >-
      Pollard rho at Theta(N^{1/2}), with KR-IC-5931ee the prime-field
      Semaev negative under its stated assumptions.
    hidden_overhead: >-
      None. No attack formula is stated, so no o(1) term is concealed.
    tradeoff_note: >-
      No tradeoff is proposed. The output is a range of eight toy degrees.
  estimated_cost:
