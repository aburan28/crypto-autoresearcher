  assumptions:
    - >-
      The images [z]P for z in Gamma_w and P in F_{V'} are heuristically
      distinct (no two patterns give the same scalar mod l, and no two
      representatives collide), which holds when |Gamma_w| 2^{l'} << l and is
      the direction that FAVOURS the object (more coverage); a failure of
      distinctness only lowers coverage.
    - >-
      OFF-LIMITS COMPONENTS DECLARED: F1 as the closure target, F6 as the
      action; F2 supplies the coupled Semaev solve of the escape. No new
      factor base is claimed to escape KN-OPEN-020; the target-dependent
      class is declared and charged.
    - >-
      The product-law table of BRIEF section 2 (KN-FIND-aa2efc) is cited as
      unreviewed; this record's own attempts column 2^131 / |Gamma_w| is a
      separate, transparent count and does not depend on that table.
  proof_search_map:
    bottleneck: >-
      Canonicalising a Gamma_w-orbit, i.e. recovering the representative P
      from Q, at a cost below |Gamma_w| scalar multiplications; without that,
      claim (B) makes the object a walk at 2^{131 - l'/2}.
    baseline_embedding:
      parameter_slice: >-
        w = 1, Gamma_1 = {+-mu^j}: T_1 is the orbit union of F_{V'} under
        Frobenius and negation, the exact object of KN-FIND-47da4e and of
        analysis/frobenius-orbit-ecc2k130 (gain exactly n on relations). The
        record must reproduce "gain n and no more" at w = 1.
      reproduction_check: >-
        Zero compute. At w = 1, |Gamma_1| = 262 and the coverage product law
        gives attempts 2^131 / 262 = 2^122.97 for the free oracle, matching
        the m = 1 (single-summand) reading of the orbit-union base; the
        collision form gives 2^{131 - l'/2} which at l' = 130 is 2^66, to be
        compared with rho without its class gains, sqrt(pi 4l / 4) about
        2^65.3, agreeing within the class factor sqrt(2 * 131) = 2^4.0 that
        the object lacks.
    observation_collision:
      observable: >-
        The pair (attempts column, per-attempt canonicalisation cost) for
        the tau-adic object at (w, l'), and at toy scale the collision-based
        DLP cost in group operations.
      distinct_preimage_search: >-
        Two objects with the same attempts column and different per-attempt
        cost: the enumerated form (cost |Gamma_w|) and the coupled-solve form
        (cost unknown, the escape). The design reports both so the column is
        never read as a cost. The dangerous collision is the reverse: a
        coupled solve that "beats enumeration" only because the toy l' is so
        small that linearisation is trivial; controlled by sweeping l' up to
        the point where C(l',2) + l' > n.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "Q in T_w" by "exists z in Gamma_w with [z^{-1}]Q in
          F_{V'}" (enumerated), and separately by the coupled descended
          system S_{w+1}(x^{2^{j_1}}, ..., x_Q) = 0, x in V', with one-hot
          shift bits. Encoding: one field unknown plus w one-hot blocks of
          131 bits. Completeness: every tau-adic decomposition of Q is a
          solution. Soundness: every solution is re-verified by curve
          arithmetic (certificate). Transfer: any Koblitz sibling. Cost
          loss: the one-hot blocks, predicted by KN-FIND-47da4e to cost
          about one conflict per shift ruled out.
        predicted_gain: >-
          None predicted (closure outcome (i)); the transform exists so the
          escape is measured rather than asserted.
      - transform: observable_fiber
        proposed_object: >-
          Hold the attempts column fixed and vary the representation of the
          scalar set: Gamma_w on the Koblitz curve versus a random scalar set
          of the same size on the relabelled Z/(4l) control. Identical
          collision statistics prove the fibre carries no curve structure.
        predicted_gain: >-
          A certificate of genericity for the enumerated form.
    quantifier_order: >-
      FORALL w in 1..131 and FORALL l' in 1..131: attempts(free oracle) =
      2^131 / |Gamma_w| and the enumerated collision form costs about
      2^{131 - l'/2} scalar multiplications (claim B, arithmetic). EXISTS a
