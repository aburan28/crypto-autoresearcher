idea:
  id: IDEA-20260926-b48c9d
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-26'
  status: proposed
  approved_by: null
  title: >-
    THE TAU-ADIC FACTOR BASE IS A GAMMA-ORBIT QUOTIENT, NOT A FACTOR BASE: a
    point Q = (sum_i e_i tau^{j_i})(P) with P in an orbit-union base is [z]P
    for a short tau-adic scalar z, so tracking the representative P is the
    block system of the scalar set Gamma_w, its canonicalisation cost is the
    pattern count C(131,w) 2^w, the free-oracle attempts column is
    2^131 / #patterns and reaches rho only at w >= 13 where enumeration
    costs 2^71 per attempt -- a target-dependent KN-OPEN-020 class whose
    collision form is a worse rho, with one priced non-generic escape
  class: mechanism
  claim: >-
    Representation class R3 of RQ-ECDLP-623a32 (a point written as a pair
    (P, z) with P a representative in an orbit-union factor base F_{V'} and
    z a short tau-adic scalar in Z[tau]); the attack stage whose charged cost
    is at issue is FACTOR-BASE MEMBERSHIP and RELATION DECOMPOSITION at the
    coupled shape Q = (sum_i e_i tau^{j_i})(P).
    SETTING. ECC2K-130, E: y^2 + xy = x^3 + 1 over F_{2^131}, order 4 l with l
    a 129-bit prime (KN-LIT-661e97). tau is the 2-Frobenius, an endomorphism
    with tau^2 + tau + 2 = 0, acting on the prime-order subgroup G as the
    scalar mu with mu^2 + mu + 2 = 0 mod l and ord_l(mu) = 131
    (analysis/frobenius-orbit-ecc2k130/README.md part D). Let V' be an
    F_2-subspace of F_{2^131} of dimension l', S = union_j sigma^j(V') its
    orbit union, F_{V'} = {P : x(P) in V'}. The "tau-adic factor base" of the
    lane brief is T_w = {Q : Q = (sum_{i=1}^{w} e_i tau^{j_i})(P), P in
    F_{V'}, e_i in {+1,-1}, 0 <= j_1 < ... < j_w < 131}.
    (A) THE OBJECT COLLAPSES TO A SCALAR MULTIPLE. f(tau) = sum e_i tau^{j_i}
    acts on G as the scalar z = f(mu) mod l, so every element of T_w is [z]P
    with z in the finite set Gamma_w = {f(mu) : wt(f) = w}, |Gamma_w| <=
    C(131, w) 2^w. Tracking the representative P is therefore the projection
    Q -> P whose fibre is the Gamma_w-multiples of P: a lossy projection
    compatible with Sigma = {tau, negation, Q -> Q + tau^j(P) for the SAME P}
    (all three preserve the representative), and NOT compatible with
    translation by a different factor-base point. It is the multiplication-by-
    Gamma quotient of IDEA-20260901-863e36 with Gamma_w a non-subgroup subset,
    and its one open number is the canonicalisation cost of a Gamma_w-orbit.
    (B) THE COVERAGE PRODUCT LAW FOR THIS OBJECT. A random target R lies in
    T_w with probability |Gamma_w| 2^{l'} / 2^131 (images heuristically
    distinct since |Gamma_w| 2^{l'} << l^2). Each hit R = [z]P is one linear
    equation log R = z log P in the single unknown log P, so relations solve
    the DLP only when two hits share a representative: after about 2^{l'/2}
    hits (birthday over F_{V'}). Total targets = 2^{l'/2} 2^{131 - l'} /
    |Gamma_w| and, if the hit is found by enumerating z in Gamma_w (one scalar
    multiplication plus one membership test each), total work about
    2^{131 - l'/2} scalar multiplications INDEPENDENT of w: minimised at l'
    near 130 where it is 2^66 scalar multiplications, i.e. above the 2^60.8
    matched rho (KN-FIND-aa2efc) before the scalar-multiplication cost (about
    2^5.5 group operations by tau-adic NAF) is charged. In that limit the
    object IS a walk-collision (F1) with a two-element scalar set and the
    trace-zero hyperplane as V', lacking rho's own negation and Frobenius
    class gains. If instead the per-target search is charged as a FREE oracle,
    the attempts column is 2^131 / |Gamma_w|, and this session's arithmetic
    gives |Gamma_13| about 2^71 (C(131,13) about 2^58.0 times 2^13), so
    w >= 13 is the first weight at which the free-oracle column reaches rho,
    with a per-attempt budget of about 2^1 there; enumeration costs 2^71 per
    attempt at that w.
    (C) THE ONE NON-GENERIC ESCAPE, PRICED. Everything in (B) uses only
    scalar multiplication and a membership predicate on x, so it runs verbatim
    on a relabelled Z/(4l) with the predicate transported through the
    relabelling: it is generic. The only route that reads the curve is to
    solve Q = f(tau)(P) for x(P) in V' WITHOUT enumerating the pattern: the
    coupled summation system S_{w+1}(x^{2^{j_1}}, ..., x^{2^{j_w}}, x_Q) = 0
    with ONE field unknown x in V' and the shifts (j, e) either enumerated or
    carried as one-hot bits. Because squaring is F_2-linear, at w = 2 the
    Weil descent of S_3(x, x^{2^j}, x_Q) is 131 QUADRATIC equations in l'
    bits for each fixed j, so the per-pattern solve is cheap (linearisation
    when C(l',2) + l' <= 131, XL at degree 2-3 otherwise); the open number is
    whether the one-hot-over-j system costs 1x or 131x the per-pattern solve.
    KN-FIND-47da4e measured exactly this shape at m = 2 with INDEPENDENT
    summands (ratio 1.00-1.47, additive about one conflict per shift ruled
    out); this record predicts the same relabelling verdict for the coupled
    shape, i.e. the escape does not beat enumeration.
    WHAT EACH OUTCOME MEANS. (i) Relabelled-Z/NZ control reproduces the toy
    collision statistics and the coupled one-hot solve costs >= the summed
    per-pattern solves: the tau-adic factor base is closed with a mechanism
    (Gamma_w-orbit quotient, generic, canonicalisation = pattern count), and
    the lane's reachability table gets a STRUCTURALLY DOMINATED cell with
    the number 2^{131 - l'/2} >= 2^66. (ii) The coupled one-hot solve costs
    materially LESS than the summed per-pattern solves (ratio below 0.5 at
    two toy n): the first evidence in this program that a shift-coupled
    Frobenius system is cheaper than its shift-enumerated form, a surprise
    that reopens the object at the w >= 13 row and must be independently
    reviewed before interpretation. (iii) The relabelled control does NOT
    reproduce the collision statistics: an instrument defect (the transported
    predicate or the relabelling is wrong), nothing is read.
  mechanism: >-
    OBJECT FRAME. Representation: R3 -- the pair (representative P in
    F_{V'}, tau-adic scalar z in Gamma_w), i.e. the point as an element of the
    Z[tau]-module G written relative to an orbit-union basis. Operation set
    Sigma = {tau, negation, translation by tau^j(P) for the same
    representative} -- a proper sub-action; translation by an arbitrary
    factor-base point is EXCLUDED (it changes the representative). Trichotomy:
    Class I, PARTIAL-ACTION, because the retained part (the representative)
    propagates deterministically only under Sigma. This is the same class as
    index calculus and the record says so; the object is not a new class.
    LOSSY-PROJECTION TEST AGAINST SIGMA. Discarded: z, i.e. which of the
    |Gamma_w| multiples of P the point is (up to 2^71 to 1 at w = 13).
    Sigma-compatible: tau multiplies z by mu, negation by -1, adding
    tau^j(P) adds mu^j to z, all of which fix P. Lossy in the representation
    used: distinct Q with the same P differ by a scalar the representation
    does not record. Both clauses hold; the projection is genuinely lossy.
    PRICE THE ONE OPEN NUMBER. Canonicalising a Gamma_w-orbit (finding P from
    Q) costs |Gamma_w| scalar multiplications by enumeration, or one coupled
    solve by the escape in claim (C); the minimal test measures the ratio of
    the two at toy scale.
    KN-OPEN-020 CLASS: TARGET-DEPENDENT. T_w is described relative to the
    target's own scalar structure (z depends on Q), membership costs
    |Gamma_w| scalar multiplications by enumeration, relation cost is one
    membership hit, descent is the birthday collision on P, time and memory
    as in claim (B). The record declares the class and charges every column,
    as the brief requires, and finds the class does not escape the generic
    bound in its enumerated form.
    OFF-LIMITS COMPONENTS USED. F1 (walk-collision) is what the object
    reduces to and is named as the closure, not used as the lens. F6
    (endomorphism orbit) is the Gamma_w action itself; what is added beyond
    F6 is the non-subgroup scalar set, the coverage product law of claim (B)
    with its explicit w >= 13 threshold, and the priced coupled-solve escape.
    IDEA-20260807-45a69f closed tau-adic tables of ONE point by the
    incidence-oracle argument; this record extends that closure to tables
    over a whole orbit-union base and supplies the number.
    WHY THIS READS THE CURVE. tau^2 + tau + 2 = 0 and mu of order 131 hold
    because a = 0 and b = 1 (the curve is defined over F_2); on the ordinary
    control curve no tau exists and T_w is undefined, which is the null
    object of the same shape: a scalar set Gamma of the same size drawn at
    random from Z/l.
