  minimal_test:
    design: >-
      CELL. Koblitz E_0: y^2 + xy = x^3 + 1 over F_{2^19}, reduction
      polynomial t^19 + t^5 + t^2 + t + 1 (the BRIEF's n = 19 field), order
      4 * 130873 by the trace recursion t_19 = 797 (this session; the
      cofactor 4 and the primality of 130873 must be re-checked by the
      executor before use), prime subgroup G of order 130873; ordinary
      control on the SAME field, A = 46693, B = 306147, h = 2 (BRIEF section
      2, DEC-20260926-901ea1); relabelled control Z/(4 * 130873) with a
      random bijection to encodings. Factor base V' a random F_2-subspace of
      dimension l' in {8, 10, 12}; Gamma_w for w in {1, 2}; targets R = aP +
      bQ with known (a, b), 50 per cell; seeds 2026092601..50, one per
      instance, recorded.
      STAGE 0 (zero compute): re-derive claim (B), |Gamma_13|, and the order
      4 * 130873; confirm that 2-Sylow is cyclic (unique 2-torsion point
      (0, 1)).
      STAGE 1 (collision form, pure Python, instrument to be written on
      experiments/EXP-CERTBIN-e94b27/impl/gf2n.py and curve.py, generalised
      from n = 17 to n = 19): for each target, enumerate z in Gamma_w,
      compute [z^{-1}]R, test x in V'; record hits; continue over targets
      until two hits share P; solve the DLP from the two relations; verify
      the certificate [x]P = Q. Charge scalar multiplications. Repeat on the
      ordinary control with a random scalar set of size |Gamma_w| and on
      the relabelled Z/(4l) control with the SAME V' transported through the
      bijection.
      STAGE 2 (coupled solve, w = 2): for each fixed pair (j_1, j_2) build
      the Weil descent of S_3(x^{2^{j_1}}, x^{2^{j_2}}, x_R) with x in V'
      (quadratic in l' bits, 19 equations) using macaulay.py generalised to
      n = 19; solve or refute with closure.py at D <= 4; sum the work over
      all C(19,2) + 19 patterns. Build the one-hot system over j (two
      one-hot blocks, exactly-one constraints) and measure the same
      instrument's work. Report the ratio. `missing: CaDiCaL / WDSat` for
      a SAT arm; the pure-Python closure instrument is the primary engine.
      STAGE 3: three-row reading and report; no extrapolation to n = 131
      beyond claim (B)'s arithmetic.
      OUTCOME TABLE. POSITIVE (for the object): coupled one-hot ratio < 0.5
      at l' = 10 and 12 while the relabelled control reproduces Stage 1 --
      the escape is real, independent review before any further claim.
      NEGATIVE (predicted): ratio >= 1 and controls reproduce -- the
      tau-adic column of the reachability table is DOMINATED with the
      number 2^{131 - l'/2} and the mechanism named. ARTIFACT: relabelled
      control or ordinary control differs from the Koblitz cell in Stage 1,
      or any certificate fails -- instrument defect, nothing read.
      FALSIFICATION THRESHOLD, fixed before any run: Stage 1 Koblitz/control
      ratio outside [0.67, 1.5] on any cell; Stage 2 ratio below 0.5 on two
      cells.
      COST (estimate, order of magnitude): implementation medium (a
      collision driver and a coupled descent builder, a few hundred lines on
      the existing gf2n/curve/macaulay/closure modules); compute low, minutes
      per cell in pure Python at n = 19 (2^19 field, l' <= 12), under one
      CPU-hour for the whole grid -- an estimate, not a measurement.
    controls:
      - >-
        Relabelled Z/(4l) generic-group control with the same V' transported
        through a random bijection (blocking for the genericity reading).
      - 'Ordinary curve of the same field with a random scalar set of size |Gamma_w| (null object of the same shape, no tau).'
      - 'w = 1 baseline: must reproduce the orbit-union gain n and no more.'
      - 'Certificate re-verification of every relation and DLP solution by direct curve arithmetic.'
      - >-
        Sweep of l' to separate a trivial-linearisation artifact from a
        genuine coupled-solve gain.
    required_metrics:
      - 'scalar multiplications to DLP solution per instance, per arm (Koblitz, ordinary, relabelled)'
      - 'hits per target and representative-collision count'
      - 'closure work (rows eliminated) for coupled one-hot versus summed per-pattern, per cell'
      - 'certificate pass rate'
  falsification_conditions:
    - 'Stage 1 Koblitz cell differs from the relabelled control by more than 1.5x on any cell: either an instrument defect or the object is non-generic; replicated and reviewed before reading.'
    - 'Stage 2 ratio below 0.5 at two cells: the closure prediction (i) is false; the escape is live and the record is superseded by a CERTBIN mechanism proposal.'
    - 'Re-derivation of |Gamma_13| disagrees with 2^71 by more than 1 bit, or the n = 19 order is not 4 * 130873: arithmetic error located and corrected in a superseding record.'
  confounders:
    - >-
      At small l' the coupled quadratic system linearises trivially, making
      the per-pattern solve nearly free and the one-hot ratio
      uninformative; the sweep of l' to C(l',2) + l' > n is the control.
    - 'Gamma_w may contain repeated scalars (different patterns, same z mod l) at toy n where l is small; hits are counted per distinct z.'
    - 'The tau-adic NAF constant 2^5.5 is recalled; the Stage 1 unit is scalar multiplications, not group operations, so the constant never enters the measured ratio.'
  interpretation_limits:
    - 'A closure-shaped mechanism record with a priced escape; no attack, no exponent, no run at n = 131. The n = 131 content is arithmetic on published constants.'
    - 'KN-OPEN-020 class declared target-dependent; the record does not touch the universal statement.'
    - 'Toy tier at n = 19; the coupled-solve ratio does not transfer to n = 131 and is not extrapolated.'
  heuristic_assumptions:
    - id: H1
      statement: >-
        (Coverage.) For P uniform in F_{V'} and z uniform in Gamma_w, the
        points [z]P are distinct with probability 1 - O(|Gamma_w|^2 2^{2l'}/l),
        so |T_w| = |Gamma_w| 2^{l'} up to that error.
      rigorous_support: >-
        Rigorous ingredient: [z]P = [z']P' with P, P' in G of prime order l
        forces z' = z (log P / log P') mod l; classical statement imitated:
        birthday bound for uniformly random elements of Z/l.
      validation_plan: >-
        SAMPLE: at n = 19, l' in {8, 10, 12}, w in {1, 2}, count distinct
        elements of T_w exactly. COMPARISON: |Gamma_w| 2^{l'} minus the
        birthday correction. TAIL: the cell with the largest deficit.
        TRANSFER: none needed; at n = 131 the error term is below 2^{-40}.
    - id: H2
      statement: >-
        (Relabelling of the coupled solve.) The one-hot shift encoding of the
        coupled system costs the sum of the per-pattern solves plus an
        additive term of about one unit of work per shift ruled out, as
        KN-FIND-47da4e measured for independent summands.
      rigorous_support: >-
        No rigorous bound; imitates the additive-overhead reading of
        KN-FIND-47da4e (toy tier, unverified) transplanted to the coupled
        shape.
      validation_plan: >-
        SAMPLE: Stage 2 at three l' and 20 targets. COMPARISON: ratio
        against 1 + (patterns ruled out)/(summed work). TAIL: the smallest
        ratio observed; a ratio below 0.5 falsifies H2 and is outcome (ii).
        TRANSFER: none to n = 131.
  target_complexity:
    time_exponent: >-
      No exponent is claimed or moved. Enumerated form: about
      2^{131 - l'/2} >= 2^66 scalar multiplications, above matched rho's
      2^60.8; free-oracle attempts column 2^131 / (C(131,w) 2^w), at rho only
      for w >= 13 with a per-attempt budget of about 2^1.
    memory_exponent: >-
