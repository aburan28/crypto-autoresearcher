    proof_obligations:
      - claim: >-
          f(tau) acts on G as f(mu), so T_w is the set of [z]P with z in
          Gamma_w and P in F_{V'}.
        responsibility: correctness
      - claim: The attempts column 2^131 / |Gamma_w| and |Gamma_13| about 2^71 (re-derived).
        responsibility: size
      - claim: The collision form costs about 2^{131 - l'/2} scalar multiplications, minimised near l' = 130 at about 2^66.
        responsibility: runtime
      - claim: The enumerated form is generic (relabelled control reproduces it exactly).
