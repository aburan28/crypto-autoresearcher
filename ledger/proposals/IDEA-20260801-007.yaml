idea:
  id: IDEA-20260801-007
  question_id: RQ-SSI-001
  title: >-
    CSIDH class-group action dimension test: measure the distinguished-point
    collision surface before any new path-finding mechanism
  class: control
  claim: >-
    On GOAL-SSI-001's CSIDH lane, the concrete collision surface available to
    a van Oorschot–Wiener distinguished-point attack on the class-group action
    can be measured on toy-size class groups and compared to the theoretical
    sqrt(order) birthday surface; any material gap in the measured surface
    (e.g., due to the group action's restricted prime-set support) would
    change the honest CSIDH baseline and must be measured before funding any
    new CSIDH path-finding mechanism.
  mechanism: >-
    vOW distinguished-point attacks on the CSIDH action use the group
    generated by the small primes; the effective collision surface depends on
    how uniformly the action spreads over the class group. Measure, on toy
    class groups, the number of distinct class-group elements reachable by
    short action words of length L, versus the birthday-theoretic expectation;
    the ratio is the effective surface and sets the concrete vOW cost.
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-01'
    corpus_paths_grepped:
      - knowledge/literature
      - ledger/proposals
    grep_results:
      - No existing proposal measures the CSIDH effective collision surface at
        toy scale for this program.
    conclusion: >-
      Control/measurement; novelty unverified against full literature, which
      is the intent of the control.
  assumptions:
    - Toy class groups of smooth order admit exact enumeration of the
      action's reachable set.
    - Short-word mixing on toy groups is representative of the mixing
      mechanism, not the size.
  predictions:
    - metric: effective_vs_birthday_collision_surface
      direction: lower
      minimum_effect: >-
        A measured effective surface below the birthday expectation by a
        factor > 2 at the largest toy size constitutes a baseline-relevant
        gap.
  minimal_test:
    design: >-
      Enumerate the reachable set of the toy class-group action for word
      lengths L = 1..L_max; compute the effective collision surface and its
      ratio to the birthday surface; report the vOW cost implied by each.
    controls:
      - Random-walk on the full class group (birthday baseline).
      - Same group, action restricted to the CSIDH prime set (measured
        surface).
    required_metrics:
      - reachable set size vs L
      - effective collision surface
      - vOW cost at the measured vs birthday surface
  falsification_conditions:
    - Measured surface equals the birthday surface at all L (no gap; the
      naive CSIDH baseline stands).
    - Measured surface is materially below birthday (gap; the honest baseline
      is cheaper, changing mechanism-ranking on the lane).
  confounders:
    - Toy size where mixing is trivially complete.
    - Choice of L_max relative to group order.
  interpretation_limits:
    - Toy measurement only; does not change any concrete CSIDH parameter.
    - A measured gap does not by itself constitute an attack.
  heuristic_assumptions:
    - id: HEUR-SSI-CSIDH-SURF-1
      statement: >-
        The ratio of effective to birthday collision surface at toy sizes
        persists as a direction at larger sizes.
      rigorous_support: >-
        None directly; mixing-time theory motivates the direction. The claim
        is explicitly toy-tier and direction-only.
      validation_plan: Extend the measurement to the largest tractable toy
        size and check the ratio's monotone trend.
  target_complexity:
    time_exponent: n/a (baseline measurement)
    memory_exponent: n/a
    best_known: sqrt(order) birthday surface for CSIDH action (theoretical)
    hidden_overhead: n/a
    tradeoff_note: vOW memory-time tradeoff position is the deliverable.
  dominated_by: null
  sota_delta: >-
    No attack claimed. Deliverable is a measured CSIDH baseline surface,
    which decides how to rank future CSIDH mechanisms.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
