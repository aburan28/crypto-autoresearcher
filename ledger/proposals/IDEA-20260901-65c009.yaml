      verified_by: null

  assumptions:
    - The supersingular 2-isogeny graph mixes in O(log p) steps, as the frozen
      source assumes via its references [37] and [6, Lemma 14].
    - delta(E) is computable exactly at toy scale by breadth-first search over
      smooth-degree isogenies, so ground truth for the AUC measurement exists.
    - The detector is used only to gate, never to certify. The certificate is
      always a returned isogeny checked by the ordinary run wrapper.

  object_first_candidate:
    established_families_off_limits: >-
      Declared off-limits as the primary lens for this record: full-graph
      meet-in-the-middle, Delfs-Galbraith subfield descent as an attack, the
      smooth-degree ball table itself, orientation and class-group
      vectorisation, torsion-image and Kani-style embeddings, CSIDH hidden
      shift, and the FC0 collimation resource formalism.
    tracked_object: >-
      The sublevel indicator S_Y(E) = 1{delta(E) <= Y} as a function on the
      vertex set, followed along the re-randomisation walk.
    newness_score: >-
      Genuinely new as an object in this corpus. Existing records follow delta
      itself (IDEA-20260805-062bee), the success indicator of the smoothness
      test along a walk (IDEA-20260808-8a6cb5), the table key
      (IDEA-20260815-86b09c) or the Frobenius involution (IDEA-20260829-bb6e9b).
      None of them is a gating predicate with a cost budget attached.
    testability_score: >-
      High. One-step propagation is defined (delta(E') <= ell^2 delta(E)) and
      measurable, and the object has an exact ground truth at toy scale.
    survival_score: >-
      The indicator survives O(log_ell Y) walk steps before the ell^2 degradation
      per step destroys it, which bounds how far a local detector can see and is
      itself one of the quantities the test measures.

  proof_search_map:
    bottleneck: >-
      The per-attempt cost of Algorithm 2 equals the whole ball of degree <= Y,
      so a rejected attempt costs exactly as much as an accepted one. Removing
      that equality is the only step whose removal changes the exponent.
    baseline_embedding:
      parameter_slice: >-
        Instantiate the detector as the ball itself, cost Y. Self-consistency
        c = (1+2c)/5 has the unique solution c = 1/3, giving Y = p^{1/3} and
        total cost p^{1/3+o(1)} -- Theorem 1.1 recovered exactly, with
        Delfs-Galbraith p^{1/2} recovered at Y = O(1) on the same curve.
      reproduction_check: >-
        Symbolic. Frozen regression fixture: the five rows of Section 4.1 of the
        frozen source must be reproduced by the cost law at c = 1/3 to within
        the rounding of the published table before any c < 1/3 number is quoted.
    observation_collision:
      observable: The one-bit detector output.
      distinct_preimage_search: >-
        Collisions are guaranteed and are harmless BY CONSTRUCTION, because the
        fibre over the bit 1 has size p^{3/4+o(1)}. The bit gates and never
        certifies; the certificate is the isogeny returned by Algorithm 2 and
        re-verified independently. The audit that matters is therefore the
        false-positive rate, which is a measured quantity in the minimal test,
        not the existence of a collision.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          A resource measure equal to detector cost in F_{p^2} operations,
          realised by specialising to toy primes where delta is exhaustively
          computable, with charges added only over the disjoint blocks
          (walk, detect, ball).
        predicted_gain: >-
          Converts the qualitative question can a filter exist into the exact
          numeric threshold c < 1/3 with a stated payoff curve (1+2c)/5.
      - transform: observable_fiber
        proposed_object: >-
          Hold the detector output fixed and vary delta across the fibre, to
          measure how much of the fibre is small-delta at each cost budget.
        predicted_gain: >-
          Produces the AUC and false-negative curve that decide the lane, and
          produces a measured obstruction if every candidate lands at AUC 0.5.
    quantifier_order: >-
      exists c < 1/3, exists a family D_{p,Y} computable in time p^c, for all
      sufficiently large p, for all Y <= p^{1/3}, for all but an o(1) fraction of
      supersingular E over F_{p^2}, [delta(E) <= Y implies D_{p,Y}(j(E)) = 1] and
      Pr_E[D_{p,Y}(j(E)) = 1 and delta(E) > Y] = o(1). The witness D may depend on
      p and on Y but NOT on E. A detector that needed E-dependent advice would be
      a preprocessing claim and belongs to IDEA-20260806-9c2f80, not here.
    method_ceiling:
      strongest_certifiable_claim: >-
        A heuristic-conditional expected-time exponent (1+2c)/5 for OneEnd over
        F_{p^2}, in time and in memory, conditional on H1 and on a detector with
        the stated one-sided error. Never unconditional, and never a statement
        about a specific curve.
      nearby_object_control: >-
        Replace Frobenius conjugation sigma by a uniformly random fixed-point-free
        involution tau on the vertex set. Theorem 1.5 then does not apply, the
        minimal degree to tau(E) is p^{1/2+o(1)}, and the method must NOT return
        an exponent below 1/2 there. If the same argument produces a sub-p^{1/2}
        exponent against tau, the argument proves too much and is wrong.
    proof_obligations:
      - claim: The cost law reproduces Theorem 1.1 and Delfs-Galbraith as slices.
        responsibility: baseline
      - claim: Ball size at split bound X is Psi(X,B) X^{1+o(1)} and covers degrees up to X^2/B.
        responsibility: size
      - claim: Pr[delta(E) <= Y] = Y^{3/2} p^{-1/2+o(1)} for p^{eps} <= Y <= p^{1/3}.
        responsibility: success_probability
      - claim: A detector with no false negatives leaves correctness of Algorithm 2 untouched.
        responsibility: correctness
      - claim: Optimising p^{1/2+c}/Y^{3/2} + Y gives Y = p^{(1+2c)/5} and total p^{(1+2c)/5}.
        responsibility: runtime
      - claim: Memory is the ball, hence equals time, so no free memory win is claimed.
        responsibility: memory
      - claim: Scope is OneEnd over F_{p^2}; EndRing and Isogeny only via the cited reductions.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        AUC of the best of d1..d6 for the task delta(E) <= p^{1/3}, at toy primes,
        restricted to detectors whose measured cost exponent is at most 0.10
      direction: higher
      minimum_effect: >-
        AUC >= 0.55 with a bootstrap 95 percent interval excluding 0.50 at two
        consecutive toy prime sizes
    - metric: >-
        Measured cost exponent c* of the cheapest detector reaching false-negative
        rate <= 0.10 at false-positive rate <= 0.10
      direction: lower
      minimum_effect: >-
        c* < 1/3 is the whole claim. The pre-registered expectation is c* = 1/3
        within measurement error, i.e. that every detector degenerates into the
        ball; anything below 0.30 is the interesting outcome
    - metric: >-
        Log-log slope of Pr[delta(E) <= Y] against Y at fixed p (the exponent
        called beta in IDEA-20260805-062bee)
      direction: different
      minimum_effect: >-
        Predicted 1.5. A measured slope outside [1.35, 1.65] falsifies the cost
        law as written and forces the threshold to be restated
    - metric: >-
        Degradation of the detector output along a walk, measured as AUC after k
        steps divided by AUC at k = 0
      direction: lower
      minimum_effect: >-
        Predicted to fall below 0.55 by k = log_ell Y steps, matching the ell^2
        Lipschitz degradation. A detector that does NOT degrade with k is the
        canonical artifact tell of docs/inventor-protocol.md section 3

  minimal_test:
    design: >-
      Stage 0, zero compute, one page. Recheck the cost law derivation and the
      fixed point c = 1/3, and reproduce the five rows of Section 4.1 of the
      frozen source from it. If the reproduction fails, stop and file that.
      Stage 1, toy scale. For primes p congruent to 3 mod 4 in three size bands
      (roughly 10^3, 10^4, 10^5), build the supersingular 2-isogeny graph,
      compute delta(E) exactly for every vertex by breadth-first search over
      smooth-degree isogenies with a declared prime set, and store the exact
      sublevel labels at Y = p^{1/3}. Then evaluate d1..d6 on every vertex,
      record each detector cost in F_{p^2} operations, and compute the ROC and
      AUC of each against the exact labels. Stage 2, controls, run identically.
      Stage 3, transfer. Fit AUC against log p across the three bands and report
      the trend with its interval; do not extrapolate beyond the fitted range.
    controls:
      - >-
        NULL OBJECT ONE, label permutation. Permute the delta labels uniformly at
        random across vertices, preserving the marginal distribution and
        destroying the pairing. Every detector must return AUC 0.50 within its
        interval. A detector that scores above 0.50 here is measuring the label
        marginal or a coding error, not the curve.
      - >-
        NULL OBJECT TWO, random involution. Rebuild the identical pipeline on a
        random (ell+1)-regular graph of the same order with a uniformly random
        fixed-point-free involution replacing Frobenius conjugation, and define
        delta as the graph distance to the involuted vertex. Predicted exponent
        1/2 rather than 1/3, and predicted AUC 0.50 for all detectors. This is
        also the nearby-object control of the proof search map.
      - >-
        POSITIVE CONTROL, planted small delta. Curves obtained by walking k steps
        from the F_p-rational locus have delta <= ell^{2k} by construction. Every
        detector must fire on these at k = 1 or the instrument is broken. This is
        the sensitivity demonstration and it costs nothing.
      - >-
        CALIBRATION ARM. Detector d3 at radius r, which is the ball, must show
        cost exponent equal to the radius exponent and AUC 1.0, confirming the
        pipeline can see a true signal when one is present.
      - >-
        BASELINE REPRODUCTION ARM. The measured exponent of the unmodified
        Wesolowski loop at toy scale must come out at 1/3 within error before any
        modified exponent is quoted.
    required_metrics:
      - AUC per detector with bootstrap confidence interval, per prime band
      - measured detector cost in F_{p^2} operations and its exponent in p
      - false-negative rate at fixed false-positive rate 0.10, per detector
      - measured log-log slope beta of Pr[delta <= Y] and its interval
      - AUC decay per walk step k, per detector
      - exact vertex counts, exact delta histogram, and the declared prime set

  falsification_conditions:
    - >-
      Every one of d1..d6 has an AUC interval containing 0.50 at all three toy
      bands while the positive control fires. The lane is then closed AT THAT
      SCOPE with a measured obstruction -- the AUC and its interval per detector,
      with the prime bands and the prime set stated -- and the forward guidance is
      that any surviving detector must be non-enumerative, which excludes d3 at
      every radius and excludes modular-polynomial evaluation if the recalled
      quadratic evaluation cost is confirmed.
    - >-
      The measured slope beta lies outside [1.35, 1.65]. The cost law as written
      is then wrong, the threshold c < 1/3 does not follow, and the record is
      superseded rather than repaired.
    - >-
      The baseline reproduction arm does not return 1/3 at toy scale. Nothing in
      this record may then be quoted.
    - >-
      Any detector shows AUC that does NOT decay with walk length k. That is the
      artifact tell; the measurement is rejected and re-run before belief.
    - >-
      A detector achieves AUC >= 0.55 at cost exponent below 0.30 with the nulls
      clean. The lane OPENS, and under AGENTS.md rule 12 the resulting exponent
      claim goes to independent review-breakthrough at max effort before any
      further work.

  confounders:
    - >-
      Toy primes are small enough that p^{1/3} and O(1) are not separated, so the
      sublevel event at Y = p^{1/3} may be nearly universal. The design must
      report the fraction of vertices with delta <= p^{1/3} at each band and
      discard bands where that fraction exceeds 0.5.
    - >-
      j = 0 and j = 1728 and the F_p-rational locus are special and are a large
      fraction of a toy graph. All AUC figures must be reported both with and
      without the F_p locus, because a detector that only finds the F_p locus is
      Delfs-Galbraith and is already known.
    - >-
      Detector cost measured in F_{p^2} operations at toy scale does not
      determine the exponent in p. The cost exponent must be fitted across bands,
      not asserted from one band.
    - >-
      The exact delta computation uses a declared finite prime set, so it
      measures smooth-degree delta rather than delta. The gap between the two is
      itself reported.

  interpretation_limits:
    - >-
      NO DETECTOR WITH c < 1/3 IS EXHIBITED AND NONE IS CLAIMED TO EXIST. The
      exponent (1+2c)/5 is conditional on an object not in hand.
    - >-
      All exponents are conditional on H1 and inherit its status. The claim is
      never to be quoted without the conditional.
    - >-
      Scope is OneEnd over F_{p^2}. EndRing and Isogeny follow only through
      references [35, Theorem 1] and [35, Proposition 8.5] of the frozen source,
      whose concrete cost this program records as not inheritable
      (see IDEA-20260806-62ba9d and IDEA-20260808-70243a).
    - >-
      Toy-scale AUC is hypothesis-generating for cryptographic scale and nothing
      more; H2 states the transfer assumption explicitly and it is not discharged.
    - >-
      Academic and defensive analysis only, per the constraints of RQ-SSI-001.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a uniformly random supersingular E over F_{p^2} and for
        p^{eps} <= Y <= (p/2)^{1/3} with a fixed eps > 0, the probability that
        delta(E) <= Y is Y^{3/2} p^{-1/2+o(1)}, uniformly as p tends to infinity.
      rigorous_support: >-
        Composition of two ingredients in the exemplar pattern. Rigorous side.
        Hom(E, E^{(p)}) with the quadratic form deg is isometric to the two-sided
        ideal P of reduced norm p in a maximal order with the form Nrd/p (frozen
        source Section 4.2, READ), and Theorem 1.5 of the frozen source (READ)
        gives the unconditional bound delta(E) <= (p/2)^{1/3}, which pins the
        first minimum of the relevant rank-3 traceless sublattice at p^{1/3} and
        hence its determinant at p^{1+o(1)}. Classical side. The Gauss-circle
        lattice-point count for a positive rank-3 quadratic lattice of
        determinant Delta gives #{v with Q(v) <= Y} = Y^{3/2} Delta^{-1/2} + O(Y),
        and H1 asks only that the specific lattice attached to a random curve
        behaves like a uniformly random rank-3 lattice of its determinant with
        respect to that count.
      validation_plan: >-
        Sampling. Exactly the frozen source Section 4.2 route, at the same scale
        and with the same shortcut. Sample random maximal orders in B_{p,infinity}
        uniformly up to conjugation, compute the two-sided ideal P of reduced
        norm p, and take the shortest vector norm as delta. Scale. p = 5*2^248 - 1
        (SQIsign NIST-I) with 10^5 samples and p = 27*2^500 - 1 (NIST-V) with 10^4
        samples, the source's own parameters, so the arm is directly comparable
        to its published figures. Comparison. Empirical CDF of delta against
        Y^{3/2} p^{-1/2} on log-log axes; report the fitted slope and its
        interval, not just a visual match. Tail check. The smallest observed
        delta among all samples must be consistent with the predicted probability
        of that value, the same tail consistency check the source performs for
        smoothness. Transfer assumption recorded. The Deuring sampler produces a
        random maximal order, not a random curve, and the two are identified only
        up to conjugation; this is the source's own assumption and it is carried
        here unchanged and stated.
    - id: H2
      statement: >-
        A per-vertex statistic whose AUC for the event delta(E) <= p^{1/3}
        exceeds 1/2 + eta at toy primes retains AUC at least 1/2 + eta/2 at
        cryptographic p, for eta bounded away from zero.
      rigorous_support: >-
        NONE. This is the transfer assumption and it is offered naked. It is
        stated separately from H1 precisely so that a reviewer can reject it
        without touching the cost law. The only support available is the
        empirical trend across the three toy bands.
      validation_plan: >-
        Measure AUC at three toy bands and fit AUC against log p with an
        interval. Report the fitted trend as the entire evidence for H2. If AUC
        decreases monotonically across bands, record the decay exponent and
        treat H2 as refuted at the tested scope. Where the statistic is
        computable from a maximal order rather than a curve, re-measure it on the
        H1 Deuring samples at NIST-I scale, which is the only route to a
        crypto-scale reading of a detector without solving the problem.
    - id: H3
      statement: >-
        Curves produced by walking k steps from the F_p-rational locus have the
        same detector response distribution as uniformly random supersingular
        curves conditioned on the same value of delta.
      rigorous_support: >-
        One direction is rigorous. If psi from E to E' has degree d and
        j(E') lies in F_p then delta(E) <= d^2, so planted curves genuinely have
        small delta. The converse -- that small delta forces proximity to the F_p
        locus -- is NOT established here and is exactly the point
        IDEA-20260829-980192 declines to claim for general conjugate isogenies.
      validation_plan: >-
        At the largest toy band where exhaustive delta is feasible, partition the
        small-delta vertices into those within the planted family and those
        outside it, and compare each detector response distribution between the
        two with a two-sample test. If they differ, the planted positive control
        is not representative, every AUC measured against it is biased, and the
        record says so. Report the fraction of small-delta vertices lying outside
        the planted family as a standalone number, since it also bears on
        IDEA-20260829-980192.

  target_complexity:
    time_exponent: >-
      p^{(1+2c)/5 + o(1)} expected, conditional on H1 and on a detector of cost
      p^c with no false negatives and o(1) false positives. At c = 0 this is
      p^{1/5+o(1)}; at c = 1/3 it is p^{1/3+o(1)} and coincides with the baseline.
    memory_exponent: >-
      p^{(1+2c)/5 + o(1)}, equal to time. The detector does not reduce memory
      below the ball it gates, and no memory-free variant is claimed.
    best_known: >-
      p^{1/3+o(1)} time and memory (frozen source Theorem 1.1, conditional on its
      Heuristic 1), and p^{1/2}(log p)^{O(1)} time at polynomial memory
      (Delfs-Galbraith, reference [21] of the frozen source).
    hidden_overhead: >-
      The same superpolynomial rho^{-1} = p^{o(1)} smoothness overhead the frozen
      source discloses is inherited unchanged and is NOT reduced by the detector.
      Two further overheads are added and must be charged: the detector false
      positive rate multiplies the number of ball runs, and a detector with a
      false negative rate f multiplies the attempt count by (1-f)^{-1}. Both are
      measured quantities in the minimal test, not assumptions.
    tradeoff_note: >-
      The ball stage is a claw search of size N = p^{(1+2c)/5}, so van
      Oorschot-Wiener applies unchanged and gives time N^{3/2}/w^{1/2} at memory
      w, interpolating to polynomial memory at time p^{3(1+2c)/10}. At c = 1/3
      that is p^{1/2}, recovering the published interpolation. The scheme
      parallelises exactly as the incumbent does, since walk, detect and ball are
      all embarrassingly parallel; with n processors the time divides by n.

  estimated_cost:
    implementation: medium
    compute: low
    detail: >-
      Stage 0 is zero compute. Stage 1 needs an exact supersingular graph builder
      with smooth-degree breadth-first search and six statistic evaluators, at
      three toy bands; the corpus already has build_isogeny_graph.py per
      IDEA-20260807-a6a038. Estimated single-machine wall clock of hours, not
      days, at the two smaller bands and under a day at the largest. The H1
      validation arm reuses the frozen source SageMath recipe and is the only
      arm needing crypto-scale sampling.

  deduplication:
    closest_existing:
      - id: IDEA-20260805-062bee
        difference: >-
          062bee MEASURES the distribution law of delta and reads the exponent
          gamma/beta off it. This record takes that law as a given INPUT and asks
          a different question -- what a cheap recogniser of the sublevel event
          would be worth -- producing a cost law and a threshold that 062bee does
          not state. If 062bee runs first, its beta feeds this record directly.
      - id: IDEA-20260829-980192
        difference: >-
          980192 RESTRICTS the search to Frobenius-fixed midpoints, i.e. changes
          the algorithm's search space, and prices it as p^{2 beta} at polynomial
          memory. This record leaves the search untouched and adds a gate to the
          re-randomisation loop, with cost law p^{(1+2c)/5} and memory equal to
          time. Different mechanism, different exponent formula, different
          failure mode. The two are complementary and their nulls differ.
      - id: IDEA-20260807-a6a038
        difference: >-
          a6a038 supplies planted positive controls for per-vertex filters, with
          planting by Hilbert class polynomial reduction and a target event of
          SMALL DISCRIMINANT ORIENTATION. This record's target event is SMALL
          delta, its planting is a walk from the F_p locus (cheaper and with a
          rigorous one-directional guarantee), and above all it supplies the
          missing piece a6a038 does not have -- what a filter is WORTH, as an
          exact exponent threshold. a6a038 answers is the filter broken; this
          answers is any filter worth building.
      - id: IDEA-20260808-8a6cb5
        difference: >-
          8a6cb5 measures the autocorrelation of the SMOOTHNESS success indicator
          along a walk to decide whether tables can be amortised across attempts.
          This record measures whether the sublevel event is cheaply DETECTABLE
          before an attempt is paid for. Amortising a table and skipping a table
          are different levers, and 8a6cb5's Ramanujan decay prediction is in
          fact the null this record uses for the AUC-decay arm.
      - id: IDEA-20260815-1cc763
        difference: >-
          1cc763 measures the spectral gap to check the mixing constant behind
          the O(log p) walk length. This record uses mixing as an assumption and
          measures something else entirely; if 1cc763 finds the walk length
          inadequate, both records are affected identically.
      - id: IDEA-20260829-bb6e9b
        difference: >-
          bb6e9b prices the claw as a self-claw under the Frobenius involution and
          asks whether the involution is worth an exponent or a constant, with a
          random-involution null. This record does not touch the claw structure at
          all; it touches the rejection sampler wrapped around it. bb6e9b's
          random-involution null is reused here as the nearby-object control,
          which is a dependency and not an overlap.
    not_a_restatement_of: >-
      Not a restatement of the twelve BATCH-046 closures. Every one of those asks
      how to FIND a short algebraic object faster. This record asks how cheaply
      one can RECOGNISE that a given curve already has one, which is a different
      quantifier and is not addressed by the rank-3 Minkowski barrier those
      closures name -- that barrier bounds the SIZE of short objects and says
      nothing about the cost of detecting their existence.

  dominated_by: >-
    Wesolowski 2026, p^{1/3+o(1)} time and memory, dominates every instantiation
    of this record currently in hand, because the only detector this session can
    name is ball enumeration at c = 1/3, which the cost law shows is exactly a
    tie. Checked against each row of the frontier known to this program: (i)
    p^{1/3+o(1)} time, p^{1/3+o(1)} memory, no data or queries -- ties at c = 1/3
    and is not beaten; (ii) Delfs-Galbraith p^{1/2}(log p)^{O(1)} time,
    polynomial memory -- this record is worse on memory at every c and is not
    claimed to beat it under a memory-charging convention (see
    IDEA-20260805-bc8246 and H-SSI-8ff06b for the three functionals under which
    the sign differs); (iii) the van Oorschot-Wiener interpolation
    p^{1/2+o(1)}/w^{1/2} at memory w -- not beaten at any w by the c = 1/3
    instantiation. The record therefore claims no improvement as filed.
  sota_delta: >-
    +0 as filed, quantitatively. Conditional on a detector with cost exponent c,
    the exponent delta is 1/3 - (1+2c)/5 = 2(1 - 3c)/15, which is 0.1333 at
    c = 0 (p^{1/3} to p^{1/5}, in time AND memory), 0.0667 at c = 1/6, and
    exactly 0 at c = 1/3. No c below 1/3 is in hand, so the delta actually
    claimed is zero and the deliverable is the law, the threshold, and a measured
    obstruction with error bars.

  recommended_priority: high
