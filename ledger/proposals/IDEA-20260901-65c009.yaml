idea:
  id: IDEA-20260901-65c009
  question_id: RQ-SSI-001
  goal_id: GOAL-SSI-001
  added: '2026-09-01'
  status: proposed
  proposed_by: idea-generator

  title: >-
    A CHEAP SUBLEVEL DETECTOR FOR delta(E) IS WORTH AN EXACT EXPONENT. Any
    one-sided detector of the event delta(E) <= Y computable in time p^c moves
    the OneEnd exponent from 1/3 to (1+2c)/5, the ball enumeration is the unique
    detector this session can name and sits exactly at the fixed point c = 1/3,
    and the whole question is therefore a single measurable number rather than a
    search for an algorithm

  class: algorithm

  claim: >-
    (A) THE COST LAW, DERIVED IN THIS SESSION FROM THE FROZEN SOURCE AND OFFERED
    FOR RECHECKING. Let delta(E) be the smallest degree of a separable isogeny
    E -> E^{(p)}. Reading Algorithm 2 of inputs/P13-WESOLOWSKI-2026/paper_fulltext.md
    (READ IN FULL) at a free radius rather than at its tuned radius, one attempt
    with smoothness parameter B and split bound X enumerates a table of
    #L = Psi(X,B) X^{1+o(1)} entries (Lemma 3.2, READ) and succeeds exactly when
    delta(E) <= Y and is B-smooth, where Y = X^2 / B is the largest degree the
    split inequality of Lemma 3.4 covers. Hence, up to p^{o(1)},
    PER-ATTEMPT COST = Y and PER-ATTEMPT SUCCESS PROBABILITY = Pr[delta <= Y] rho,
    with rho = p^{-o(1)} the smoothness factor. Under Heuristic H1 below,
    Pr[delta <= Y] = Y^{3/2} p^{-1/2+o(1)}, so
    TOTAL COST = Y (p^{1/2} / Y^{3/2}) rho^{-1} = p^{1/2+o(1)} / Y^{1/2},
    which DECREASES in Y and is therefore driven to the largest Y at which the
    probability has not saturated, namely Y = (p/2)^{1/3} by Theorem 1.5 (READ),
    giving p^{1/3+o(1)}. That reproduces Theorem 1.1 exactly, and it reproduces
    Delfs-Galbraith p^{1/2} at Y = O(1). The exponent 1/3 is therefore not a
    property of meet-in-the-middle at all. It is the price of DISCOVERING that a
    curve has small delta by paying the whole ball to find out.

    (B) THE CLAIM. Suppose there is a family of algorithms D_{p,Y} which, given
    only j(E) and running in time p^c, outputs a bit with (i) no false negatives
    on curves with delta(E) <= Y and (ii) false-positive probability o(1) over
    uniformly random supersingular E. Then the modified algorithm -- walk, apply
    D, and run Algorithm 2 at radius Y only when D fires -- has expected cost
    p^{1/2+c+o(1)} / Y^{3/2} + Y, optimised at Y = p^{(1+2c)/5}, hence
    TOTAL COST = p^{(1+2c)/5 + o(1)} in time AND in memory.
    This is strictly below p^{1/3} for every c < 1/3, equals p^{1/3} exactly at
    c = 1/3, and reaches p^{1/5} at c = 0. The ball enumeration used as its own
    detector costs Y, and self-consistency then forces c = (1+2c)/5, i.e. the
    unique fixed point c = 1/3 -- so the incumbent algorithm is exactly the
    c = 1/3 member of this family, and the threshold coincides with the baseline
    by derivation rather than by coincidence.

    (C) WHAT IS AND IS NOT CLAIMED. NO DETECTOR WITH c < 1/3 IS EXHIBITED HERE
    AND NONE IS ASSERTED TO EXIST. The claim filed is the cost law, its exact
    threshold, and a pre-registered measurement of how far a named finite family
    of cheap statistics gets. The expected outcome is a measured obstruction --
    an AUC with error bars for each statistic, at a stated scope -- not an
    attack. Both outcomes are deliverables and they differ before the run.

  mechanism: >-
    TRACKED OBJECT. The sublevel indicator S_Y(E) = 1{delta(E) <= Y}, treated as
    a function on the supersingular vertex set over F_{p^2} and followed along
    the RE-RANDOMISATION WALK of Algorithm 3, not along the isogeny computation
    inside Algorithm 2. This is a different axis from every existing SSI record
    in this corpus, which follow objects through a path or through a table.

    WHY THE INDICATOR IS THE RIGHT OBJECT. Algorithm 3 is a rejection sampler
    whose acceptance predicate is exactly S_Y composed with a smoothness test,
    and whose rejection cost equals its acceptance cost. Every rejection sampler
    with that property is improvable exactly to the extent that its predicate
    admits a cheaper necessary condition. The cost law in (A) turns that
    observation into an exponent.

    LOSSY-PROJECTION TEST (algebraic, zero compute). S_Y discards everything
    about E except one bit about its distance to its own Frobenius conjugate.
    The projection is genuinely lossy: the fibre over the bit 1 has size
    p Y^{3/2} p^{-1/2} = Y^{3/2} p^{1/2+o(1)} under H1, which at Y = p^{1/3} is
    p^{3/4+o(1)} curves, so the bit does not determine E, does not determine
    delta, and cannot be inverted. What it discards is discarded COMPATIBLY with
    the operation the algorithm applies to it -- a step in the ell-isogeny graph
    -- because delta is multiplicatively Lipschitz along edges: for
    ell-isogenous E, E' one has delta(E') <= ell^2 delta(E), so sublevel sets are
    unions of balls and the retained bit propagates with a controlled and
    explicitly computable degradation ell^2 per step. It is therefore a genuine
    lossy projection and not a change of coordinates.

    THE CANDIDATE DETECTORS, NAMED IN ADVANCE SO THE TEST IS NOT OPEN-ENDED.
    d1 subfield-root detection at radius 1, i.e. the number of roots of
    Phi_ell(j, X) lying in F_p, in the sense of reference [15] of the frozen
    source; d2 the indicator Phi_m(j, j^p) = 0 for m in a fixed small set;
    d3 the size of the intersection of the ell-neighbour multiset of E with the
    Frobenius conjugate of that multiset; d4 the number of distinct roots and the
    factorisation-degree pattern of Phi_ell(j, X) over F_{p^2} for ell in a fixed
    small set; d5 the multiplicative order statistics of j - j^p in F_{p^2};
    d6 the trace of the composition of two steps returning to the conjugate, read
    as an F_{p^2} element rather than as a bit. Each has a stated cost exponent.
    d3 at radius r degenerates into the ball itself and is the calibration arm.

