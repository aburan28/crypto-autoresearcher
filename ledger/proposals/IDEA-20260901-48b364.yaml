idea:
  id: IDEA-20260901-48b364
  question_id: RQ-VOLC-f6253b
  research_question: RQ-VOLC-f6253b
  goal_id: GOAL-ENDO-001
  added: '2026-09-01'
  title: >-
    DEPTH IS NOT A COST, IT IS A DISCOUNT: because the ascending ell-isogeny from a
    non-crater vertex is UNIQUE, the vertical component of an isogeny path is
    deterministic and self-certifying, so path-finding inside an ordinary
    F_p-isogeny class costs O~(h(O_K)^{1/2} + B_f) rather than the
    O~(h(O_f)^{1/2}) ~ p^{1/4} that gate T5 of DECOMPOSITION.md asserts -- an
    exponent of p^{1/4 - delta/2} where f = p^delta, reaching polylogarithmic at
    delta = 1/2, which means the campaign's central reachability gate is OPEN, not
    closed, on the deep-conductor classes and is closed only on the shallow ones
  class: algorithm

  claim: >-
    FOUR SEPARABLE CLAIMS. (A) IS A DERIVATION. (B) IS AN EXPONENT. (C) IS THE
    HEURISTIC-CONDITIONAL DENSITY. (D) IS WHAT IS NOT CLAIMED. NO ECDLP EXPONENT
    MOVES IN ANY BRANCH AND sota_delta AGAINST THE ATTACK FRONTIER IS +0.

    (A) THE VERTICAL COMPONENT OF A PATH IS FREE AND CERTIFIED. In the ell-volcano
    of an ordinary F_p-isogeny class, a vertex not on the crater has exactly ONE
    ascending ell-isogeny and ell descending ones (Kohel; Fouquet-Morain). Hence:
      (i) from any E the ascending path to a crater vertex E^up is UNIQUE, of
          length v_ell(f/f_E) <= v_ell(f), and its computation is a search over at
          most ell + 1 neighbours per step;
      (ii) given a TARGET curve F, its own ascending path F -> F^up is likewise
          unique and computable from F alone, and its REVERSAL is an explicit
          descending path F^up -> F of degree ell^{v_ell(f/f_F)};
      (iii) therefore a path E -> F decomposes as
          ascend(E) o horizontal(E^up -> F^up) o reverse(ascend(F)),
          in which only the middle segment requires a search over an unknown
          group element.
    The consequence is the claim: THE TREE CONTRIBUTES NO SEARCH. It looks like it
    should -- the level-i set is a Cl(O_i)-torsor of size h(O_i) ~ ell^i h(O_K),
    and naively vectorizing there costs sqrt(h(O_i)) -- but the ell^i factor is
    navigated deterministically because the target's own address in the tree is
    computable from the target, not searched for. Repeating over every prime
    ell | f handles the full conductor.

    (B) THE EXPONENT, STATED WITH BOTH TERMS. Let B_f be the largest prime factor
    of f and let the class have conductor f with |D| = 4p - t^2. Path-finding
    between two given curves of the class costs
      O~( h(O_K)^{1/2} + sum over ell | f of v_ell(f) * C_isog(ell) )
    where C_isog(ell) is the cost of one ell-isogeny step including the
    identification of the ascending direction. With h(O_K) ~ |D_0|^{1/2} and
    |D_0| = |D|/f^2 ~ 4p/f^2, writing f = p^delta gives
      h(O_K)^{1/2} ~ (p^{1/2 - delta})^{1/2} = p^{1/4 - delta/2}.
    The campaign's committed gate T5 states the cost as ~sqrt(h) ~ p^{1/4}
    classically at best, with h the class number of the ORDER, i.e. h(O_f) ~
    |D|^{1/2} ~ p^{1/2}. The delta between the two is exactly a factor f^{1/2} =
    p^{delta/2}, and at delta = 1/2 -- the maximal conductor, i.e. a class with
    |D_0| = O(1) -- the search term degenerates to polylogarithmic and the entire
    cost is the conductor-navigation term. MEMORY: the horizontal term is a
    meet-in-the-middle at h(O_K)^{1/2} memory, or O(1) memory at the same time
    exponent by a distinguished-point pseudorandom walk; the vertical term needs
    O(v_ell(f)) memory to hold the path.

    (C) THE HEURISTIC-CONDITIONAL HALF: WHEN IS THE SECOND TERM SMALL. The
    vertical term is polynomial in B_f, so the discount is realized only on
    classes whose conductor is smooth. Under heuristic H1 below -- that
    f = sqrt(|D|/|D_0|) behaves for smoothness purposes like a uniformly random
    integer of its size -- the density of classes with f being p^{1/(2u)}-smooth
    is rho(u) + o(1) with rho the Dickman-de Bruijn function. The joint condition
    the discount needs is (small |D_0|) AND (smooth f), and those are not
    independent: |D_0| small forces f ~ sqrt(4p/|D_0|) large, which makes
    smoothness rarer, so the two requirements pull against each other and the
    optimum is an interior point. The record's second deliverable is the MEASURED
    joint density at toy scale against the rho(u) prediction, which is a
    falsifiable distributional claim and not an assertion about attacks.

    (D) WHAT IS NOT CLAIMED. NOT that any ECDLP is easier: by the transport
    theorem T1 and the vertical transport closure (IDEA-20260807-5cabfc), moving
    the instance to another curve of the class preserves k and preserves every
    generic cost, so a cheaper path to a curve is worth exactly as much as that
    curve is worth, which on present evidence is nothing. NOT that this beats the
    published isogeny literature: ascending to the crater before doing
    meet-in-the-middle is, to the best of this session's RECALLED knowledge,
    exactly what the ordinary-curve isogeny-path algorithms already do, so the
    sota_delta against the literature is plausibly +0 and the delta claimed here
    is against THIS PROGRAM'S committed statement of gate T5. NOT that the
    horizontal term is sqrt(h(O_K)) unconditionally -- it is a meet-in-the-middle
    bound, and subexponential class-group relation methods may do better, which
    would only strengthen the direction of the claim. NOT anything about
    supersingular graphs, where there is no volcano and no unique ascent.

  mechanism: >-
    The campaign's gate T5 treats reaching a SPECIFIED curve in an isogeny class
    as a vectorization problem of size h, and prices it at sqrt(h) ~ p^{1/4}. That
    pricing silently uses h = h(O_f), the class number of the ORDER OF THE CURVE,
    because that is the size of the set of curves at the curve's own level. The
    mechanism this record names is that the set of curves at a given level is NOT
    a homogeneous search space: it fibres over the crater, the fibre is a tree,
    and a tree is navigable without search BECAUSE THE UNIQUENESS OF THE ASCENDING
    EDGE MAKES THE TARGET'S ADDRESS COMPUTABLE FROM THE TARGET. Search is needed
    only where the group acts with no distinguished direction, which is the
    crater, whose size is h(O_K) and is SMALLER than h(O_f) by exactly the
    conductor factor. So the conductor -- the very quantity that measures depth
    and that this lane has treated as an obstacle -- subtracts from the search
    exponent instead of adding to it. This is the obstruction-as-resource reading
    that docs/inventor-protocol.md section 4 requires: the same tree structure that
    IDEA-20260826-f412a0 measures as a downward drift impeding a RANDOM walk is,
    for a DIRECTED walk that knows its target, a free deterministic coordinate.
    The two readings are consistent and the difference is entirely whether the
    walker is allowed to look at the target, which is precisely the distinction
    between mixing and vectorization.

  novelty_status: unverified

