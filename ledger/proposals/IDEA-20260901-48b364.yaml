      opened for this record.
    results: >-
      NEAREST FILED WORK, NAMED WITH ITS DIFFERENCE. (1) IDEA-20260807-bb03d3 is
      the closest and it is genuinely close: it gives the ascent algorithm and
      states that the output is a Cl(O)-torsor of size h(O) rather than a point.
      This record's difference is the second half bb03d3 does not have -- that the
      DESCENT to a SPECIFIED target is free, hence the residual search is over the
      CRATER torsor h(O_K) and not the level torsor h(O_f), which is a different
      and smaller number and is where the exponent claim comes from. bb03d3 uses
      the ascent as a normal form for AMORTIZATION over many targets; this record
      uses it as the vertical half of a two-sided path decomposition. (2)
      IDEA-20260826-f412a0 measures the vertical hitting time of an UNDIRECTED
      random walk and asks whether it is additive or dominating. This record makes
      a DETERMINISTIC claim about a DIRECTED path that is allowed to inspect the
      target: the two objects differ exactly by whether the target is visible, and
      the conclusions are compatible rather than competing. (3) IDEA-20260807-4f43ac
      treats class-level volcano data as amortizing to zero over many targets and
      argues an x-indexed precomputation does not transport; disjoint question. (4)
      H-VOLC-0e303a prices the LEVEL instrument and locates the obstruction in the
      large-ell walk; this record consumes that cost as its second term and does
      not dispute it. (5) IDEA-20260807-5cabfc closes the ECDLP consequence, which
      is why this record explicitly claims +0 on the attack frontier.
    verdict: >-
      UNVERIFIED, AND HONESTLY AT RISK OF BEING `known`. The structural fact in
      claim (A) is elementary once stated and the ascend-then-search strategy is,
      by recollection, the standard ordinary-curve isogeny-path algorithm; if the
      Galbraith 1999 citation lands as recalled, claim (A) is `known` and claim
      (B)'s exponent is `known` as an algorithm while remaining NEW AS A
      CORRECTION TO THIS PROGRAM'S COMMITTED GATE T5, which is the operative
      deliverable. Claim (C)'s joint density measurement is not in any committed
      record. No external source was opened, so `unverified` is the only label
      AGENTS.md rule 9 permits, and the record must not be read as asserting
      novelty over the isogeny literature.

  object_first_candidate:
    tracked_object: >-
      THE VERTICAL ADDRESS OF A CURVE: the finite word
      w(E) = (the sequence of j-invariants, or equivalently of kernel polynomials,
      along the unique ascending ell-path from E to the crater), one word per
      prime ell | f, together with its length v_ell(f/f_E). The object followed
      through the computation is this word, not the level integer and not the
      curve. Established families declared OFF-LIMITS as the primary lens for this
      record: the level integer and the level vector as labels or regressors; the
      conductor f_E; per-curve cost batteries; the endomorphism scalar and degree;
      the undirected height process.
    lossiness: >-
      PASSES THE LOSSY-PROJECTION TEST. The projection E |-> w(E) discards the
      crater endpoint's identity as a class-group element -- the entire HORIZONTAL
      address, which is h(O_K) bits of information and is exactly the part that
      still requires search -- and retains only the vertical descent word. It is
      not a change of coordinates: from w(E) alone one cannot recover E, because
      the same word (as an abstract sequence of branch choices) occurs above every
      crater vertex, and the fibre of the projection has size h(O_K). What is
      discarded is discarded COMPATIBLY with the operation of interest, composing
      isogenies: an ell-isogeny step either extends w by one letter (descend),
      deletes its last letter (ascend), or leaves w unchanged and moves the crater
      endpoint (horizontal), so the retained word propagates deterministically
      under every generator of the graph. This is the required compatibility and
      it is exactly why the vertical coordinate can be navigated without search
      while the horizontal one cannot.
    propagation: >-
      ONE-STEP PROPAGATION IS DEFINED AND CHEAPLY MEASURABLE. From a vertex at
      level i with 0 < i, the ell + 1 rational ell-isogenies split as one ascending
      (shortens w) and ell descending (lengthens w); at the crater with ell split
      in O_K there are two horizontal (w unchanged) and ell - 1 descending; at the
      crater with ell inert there are ell + 1 descending and no horizontal. These
      counts are the standard volcano structure and are directly checkable on an
      enumerated toy class by counting roots of the ell-division polynomial and
      classifying each neighbour by its own neighbour count -- the two-directional
      certifier of IDEA-20260807-b1b604 is the instrument.
    survival_score: >-
      Survives for every prime ell dividing the conductor f and for the full
      conductor by working one ell at a time; the object dissolves in four named
      places. (i) At a class with f = 1 there is no tree and the object is the
      empty word -- the record's DEPTH-0 null. (ii) At large ell the object is
      still well defined but its one-step propagation becomes expensive, which is
      the H-VOLC-0e303a obstruction and the record's second cost term. (iii) In the
      supersingular graph there is no volcano and no unique ascent, so the object
      does not exist -- which is precisely why supersingular path-finding is hard
      and is the sharpest available check that the object is doing real work.
      (iv) When the two endpoints lie in DIFFERENT isogeny classes the object says
      nothing, since no path exists.

  proof_search_map:
    bottleneck: >-
      The exact step is the search over the level-i curve set in gate T5's
      pricing. Removing it -- by showing the vertical coordinate needs no search
      -- changes the gate's exponent from p^{1/4} to p^{1/4 - delta/2} and
      therefore changes which lanes of GOAL-ENDO-001 are reachability-blocked.
      Nothing else in the campaign's cost accounting is touched.
    baseline_embedding:
      parameter_slice: >-
        The committed T5 figure is the exact parameter slice delta = 0 of the new
        one: a class with f = 1 has O_f = O_K, no volcano, no vertical coordinate,
        and the cost is sqrt(h(O_K)) = sqrt(h(O_f)) ~ p^{1/4}. The two statements
        agree exactly there and diverge by f^{1/2} elsewhere, so the old figure is
        recovered as a boundary rather than contradicted.
      reproduction_check: >-
        A FROZEN REGRESSION FIXTURE. On an enumerated toy class with f = 1,
        measure the path-finding cost and confirm it matches the sqrt(h(O_K))
        prediction within the stated band; on a class with f > 1, confirm the
        measured cost tracks sqrt(h(O_K)) + vertical, NOT sqrt(h(O_f)). The two
        classes must be run with the SAME code and the same stopping rule, so the
        comparison is a measured ratio and not two separate estimates.
    observation_collision:
      observable: >-
        The observable is the measured number of ell-isogeny steps to connect two
        given curves of a class.
      distinct_preimage_search: >-
        A COLLISION IS NAMED AND IT IS THE PRIMARY CONFOUNDER. At toy scale
        h(O_K) and h(O_f) are both small, so sqrt(h(O_K)) and sqrt(h(O_f)) differ
        by a factor sqrt(f) that can be a single-digit number -- and two classes
        with different (h(O_K), f) can produce the same measured step count. A
        single measurement therefore cannot separate the two pricings. Only the
        SCALING with f at fixed h(O_K), swept over a family of classes constructed
        to hold |D_0| approximately fixed while f varies over several orders of
        magnitude, distinguishes them; the design sweeps f for exactly this
        reason, and a report quoting one class would be uninterpretable.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the search over the level-i curve set by the pair
          (vertical word, crater vertex), reducing path-finding to crater
          vectorization plus two deterministic word computations. Encoding is
          exact; completeness holds because every vertex has a unique ascent;
          soundness is certified by the path certificate; the transfer loss is
          zero and the cost loss is the vertical navigation term.
        predicted_gain: >-
          Removes the factor f from the size of the searched set, hence f^{1/2}
          from the time exponent, at the price of an additive term polynomial in
          the largest prime factor of f.
      - transform: boundary_lift
        proposed_object: >-
          Treat the committed T5 figure as the f = 1 boundary of a
          conductor-parameterized family of reachability costs and prove a STRICT
          inward improvement for f > 1, rather than merely asserting feasibility.
        predicted_gain: >-
          A strict inequality sqrt(h(O_K)) + vertical < sqrt(h(O_f)) whenever
          f exceeds a computable threshold determined by B_f and h(O_K) -- which
          is itself a measurable crossover and is a falsifiable prediction, since
          for very rough f the inequality reverses.
    quantifier_order: >-
      EXPLICIT AND THE ORDER MATTERS. For all ordinary F_p-isogeny classes with
      discriminant D = f^2 D_0, for all pairs of curves E, F in the class, there
      EXISTS an isogeny path from E to F computable in
      O~(h(O_K)^{1/2} + sum_{ell | f} v_ell(f) C_isog(ell)) operations. Note what
      is NOT claimed: it is NOT for all classes that the cost is
      p^{1/4 - delta/2} with delta bounded away from 0 -- delta depends on the
      class and most classes have small f. The uniform statement is the two-term
      bound; the exponent statement is per-class and its DENSITY over classes is
      the separate, heuristic-conditional claim (C). Conflating these two is the
      quantifier error this audit exists to prevent, and it is the error a reader
      would make from the title alone.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest thing this method can certify is a two-term upper bound on
        ordinary-class path-finding, with the search term governed by h(O_K) and
        the deterministic term by the conductor's smoothness. It CANNOT certify a
        lower bound of any kind, cannot certify anything about the ECDLP on the
        curves reached, cannot improve the crater search itself, and cannot apply
        where the ascent is unavailable.
      nearby_object_control: >-
        THE NEARBY OBJECT ON WHICH THE CONCLUSION FAILS IS THE SUPERSINGULAR
        ell-ISOGENY GRAPH, where the desired conclusion is known false -- path
        finding there is believed hard at p^{1/2}, recently p^{1/3 + o(1)} for the
        related endomorphism problem, and there is no cheap navigation. The
        control is decisive because the supersingular graph is (ell + 1)-regular
        and connected, like a volcano crater, but has NO unique ascending edge and
        NO level function. Any version of the argument that goes through on the
        supersingular graph is wrong, and the implementation must be run against a
        synthetic (ell + 1)-regular random graph with no level function to confirm
        the ascent-identification step FAILS to find a unique direction there. If
        it reports a unique ascent on a random regular graph, the instrument is
        fabricating structure and every measurement is void.
    proof_obligations:
      - claim: >-
          A non-crater vertex of an ordinary ell-volcano has exactly one ascending
          ell-isogeny.
        responsibility: baseline
      - claim: >-
          The ascending path of the TARGET is computable from the target alone,
          and its reversal is an explicit descending path.
        responsibility: correctness
      - claim: >-
          The residual search is over the crater, a Cl(O_K)-torsor of size h(O_K).
        responsibility: size
      - claim: >-
          Identifying the ascending direction at one vertex costs C_isog(ell),
          polynomial in ell.
        responsibility: runtime
      - claim: >-
          h(O_K) ~ |D_0|^{1/2} up to sub-polynomial factors, so the exponent is
          p^{1/4 - delta/2}.
        responsibility: size
      - claim: >-
          Memory is h(O_K)^{1/2} for meet-in-the-middle or O(1) with a
          distinguished-point walk at the same time exponent.
        responsibility: memory
      - claim: >-
          The path is certified by a re-verifiable list of j-invariants and kernel
          polynomials, checkable independently of the search.
        responsibility: interface
      - claim: >-
          Scope: ordinary curves over F_p, both endpoints in one class, ell | f.
        responsibility: scope

  assumptions:
    - >-
      Both endpoints are ordinary curves in the SAME F_p-isogeny class, which by
      Tate's theorem is equivalent to having the same number of points, and is
      checkable in polynomial time.
    - >-
      D = t^2 - 4p can be factored well enough to obtain D_0 and f. By
      IDEA-20260807-3c6bd8 |D| <= 4p so this is a p-sized factorization, routine at
      the sizes considered and free at toy scale. Where only partial factorization
      is available, the algorithm degrades gracefully by working with the
      trial-division part of f, as in IDEA-20260807-bb03d3.
    - >-
      An ell-isogeny certifier exists that can enumerate rational ell-isogeny
      neighbours and classify a vertex's level. IDEA-20260807-b1b604 proposes
      exactly this for ell in {2, 3} without Sage; this record depends on it and
      says so rather than assuming an instrument that does not exist.

  predictions:
    - metric: >-
        measured_path_search_steps: number of crater vertices examined by the
        horizontal search when connecting two random curves of an enumerated toy
        class, averaged over pairs
      direction: lower
      minimum_effect: >-
        Must scale as sqrt(h(O_K)) and NOT as sqrt(h(O_f)). Swept over a
        constructed family holding |D_0| approximately fixed while f varies by a
        factor of at least 16, the measured search must be FLAT in f to within a
        factor 2, whereas the sqrt(h(O_f)) pricing predicts growth by a factor 4.
        Flatness is the discriminator; a single class cannot show it.
    - metric: >-
        vertical_step_count: number of ell-isogeny computations spent on the two
        ascending paths and the descent, as a function of v_ell(f)
      direction: higher
      minimum_effect: >-
        Must grow LINEARLY in v_ell(f) with slope at most (ell + 1), and must be
        strictly less than the horizontal term on classes where the discount is
        claimed. If the vertical term is superlinear in depth, the additive
        decomposition of claim (B) is wrong and IDEA-20260826-f412a0's
        mixing-dominating branch is the correct description instead.
    - metric: >-
        ascent_uniqueness_rate: fraction of non-crater vertices at which exactly
        one of the ell + 1 neighbours is identified as ascending
      direction: higher
      minimum_effect: >-
        Exactly 1.000 on every non-crater vertex of every enumerated volcano. Any
        vertex with zero or two ascending neighbours refutes the structural
        premise for that class and halts the reading. This is the cheapest
        possible falsifier and it runs first.
    - metric: >-
        null_graph_ascent_rate: the same uniqueness rate measured on a synthetic
        (ell + 1)-regular random graph of the same vertex count with no level
        function
      direction: lower
      minimum_effect: >-
        The identifier must FAIL to report a unique ascending direction on at
        least 90 percent of null-graph vertices. This is the null-object control
        of docs/inventor-protocol.md section 3: an identifier that finds a unique
        ascent in a structureless graph is detecting its own procedure, and every
        measurement above it is void.
    - metric: >-
        crossover_conductor: the smallest f at which the measured two-term cost
        drops below the measured single-term sqrt(h(O_f)) cost, at fixed largest
        prime factor B_f
      direction: different
      minimum_effect: >-
        Reported as a number with an error bar and compared against the predicted
        crossover from the cost model. A measured crossover more than a factor 4
        from the predicted one means the cost model's constants are wrong even if
        its exponents are right, and the exponent claim must then be quoted with
        that caveat attached.
    - metric: >-
        smooth_conductor_density: empirical fraction of ordinary classes at a
        given toy p whose conductor f is y-smooth, as a function of
        u = log f / log y
      direction: different
      minimum_effect: >-
        Empirical CDF within 2 standard errors of rho(u) over u in [1, 4]. A
        systematic departure falsifies heuristic H1 and is itself the more
        interesting outcome, since it would say conductors of Frobenius
        discriminants are NOT smoothness-generic.

  minimal_test:
    design: >-
      FIVE STEPS, TOY SCALE, PURE PYTHON, ell = 2 AND ell = 3 PRIMARY. STEP 0
      (seconds, blocking): the null-graph control -- run the ascending-direction
      identifier on a synthetic (ell + 1)-regular random graph and confirm it
      fails to report a unique ascent; if it succeeds, stop, the instrument is
      fabricating structure. STEP 1 (minutes): enumerate one full toy ordinary
      isogeny class with f > 1 -- the committed p = 4001, t = 30 class
      (D_0 = -59, f = 16, five 2-levels) is the ready-made candidate, with its
      138-curve census reproduced as a gate -- build the complete ell = 2 volcano
      by rational 2-isogeny BFS, and verify the ascent-uniqueness rate is exactly
      1 at every non-crater vertex. STEP 2 (minutes): implement path-finding two
      ways with the SAME step primitive and the SAME stopping rule -- METHOD A, a
      distinguished-point or meet-in-the-middle search over the whole level set;
      METHOD B, ascend both endpoints, search the crater, descend by the reversed
      target ascent -- and record steps and wall time for at least 200 random
      endpoint pairs each. Report the RATIO, which is the deliverable. STEP 3
      (minutes to an hour): the SWEEP that carries the exponent claim -- construct
      or select a family of at least six toy classes with |D_0| approximately
      constant and f varying by at least a factor 16, repeat STEP 2 on each, and
      fit the exponents of METHOD A and METHOD B separately in f. Claim (B)
      predicts slope ~1/2 for A and ~0 for B. STEP 4 (minutes): the DEPTH-0 null
      -- a class with f = 1, where the two methods must coincide exactly and the
      ratio must be 1; a ratio different from 1 there means the two
      implementations differ for reasons unrelated to depth and voids STEP 2.
      STEP 5 (minutes): the density measurement of claim (C) -- for each of
      several toy primes enumerate all traces in the Hasse interval, compute
      (D_0, f) for each ordinary class by factoring D, and compare the empirical
      smooth-conductor density against rho(u).
    controls:
      - >-
        NULL OBJECT, BLOCKING AND RUN FIRST: an (ell + 1)-regular random graph
        with no level structure, on which the ascending-direction identifier must
        fail. Without it, every ascent measurement could be an artifact of the
        identification procedure.
      - >-
        DEPTH-0 NULL: an f = 1 class where METHOD A and METHOD B must give an
        identical cost. This is the decay test in the required direction -- the
        claimed saving must VANISH when the parameter that supposedly creates it
        is removed. A saving that persists at f = 1 is an implementation artifact
        and voids the whole record.
      - >-
        PROVES-TOO-MUCH CONTROL: the argument is run against the supersingular
        setting, where its conclusion is known false. Concretely, apply the
        level-identification step to a supersingular ell-isogeny graph at a toy p
        and confirm no level function is found. An argument that still delivers a
        discount there is wrong.
      - >-
        SHARED-PRIMITIVE CONTROL: METHOD A and METHOD B must call the same
        isogeny-step primitive and the same stopping rule, so the measured ratio
        cannot be an artifact of two implementations of different quality. This is
        stated as a hard requirement on the experiment contract.
      - >-
        CERTIFICATE CONTROL: every returned path is re-verified independently of
        the search by recomputing each Velu step from its kernel polynomial and
        checking the j-invariant chain, per docs/claims-and-verification.md. An
        unverified path is not a result.
      - >-
        SAMPLE-SIZE CONTROL: at least 200 endpoint pairs per class, with the
        reported ratio carrying a bootstrap confidence interval; the toy class
        sizes are small enough that a handful of pairs would be dominated by
        which pairs were drawn.
    required_metrics:
      - ascent-uniqueness rate on real volcanoes (must be exactly 1) and on the null graph (must be near 0)
      - METHOD A and METHOD B step counts and wall times per endpoint pair, with the ratio and its confidence interval
      - fitted exponent of each method in f across the swept class family
      - depth-0 null ratio (must be 1) and supersingular control outcome (must be a failure to find levels)
      - vertical step count versus v_ell(f), with the fitted slope
      - measured crossover conductor against the predicted one
      - empirical smooth-conductor density versus rho(u), with u range and standard errors
      - path certificates for every reported path, independently re-verified
      - artifact manifest with source hashes, seeds, and a rebuild receipt

  falsification_conditions:
    - >-
      Any non-crater vertex with zero or two ascending neighbours. The structural
      premise of claim (A) fails for that class; the record halts at STEP 1 for
      the cost of a BFS.
    - >-
      The null graph yields a unique ascending direction at a substantial rate.
      The identifier is fabricating structure; no measurement in the record may be
      read in either direction until it is repaired.
    - >-
      METHOD B's fitted exponent in f is not distinguishable from METHOD A's
      across the sweep. Claim (B) is refuted at the tested scope: the vertical
      coordinate is not free in practice, gate T5's committed pricing stands, and
      the honest deliverable is the measured obstruction -- the vertical term's
      measured growth rate -- recorded at the closure standard.
    - >-
      The depth-0 null shows a non-unit ratio. The two methods differ for reasons
      unrelated to depth; STEP 2 and STEP 3 are void.
    - >-
      The vertical step count grows superlinearly in v_ell(f). The additive
      decomposition fails and IDEA-20260826-f412a0's mixing-dominating branch is
      the better description; that is a substantive finding for the lane and must
      be reported as such rather than as a null.
    - >-
      The empirical smooth-conductor density departs systematically from rho(u).
      Heuristic H1 is falsified, claim (C)'s density statement is withdrawn, and
      the exponent claim survives only as a per-class statement with no density
      attached.

  confounders:
    - >-
      TOY CLASS NUMBERS ARE TINY. At p ~ 4001 the crater has 3 vertices and the
      whole class 138, so sqrt(h(O_K)) and sqrt(h(O_f)) are single digits and any
      constant-factor difference in the two implementations swamps the exponent.
      MITIGATION: the deliverable is the FITTED SLOPE across a swept family, never
      a single ratio, and the shared-primitive control removes the implementation
      asymmetry.
    - >-
      LEVEL AND CLASS-NUMBER CONFOUNDING. Across the swept family, changing f
      changes h(O_f), h(O_K), the branching structure and the crater length at
      once. MITIGATION: |D_0| is held approximately fixed by construction and
      h(O_K) is computed exactly for each class and reported alongside, so the fit
      is against f at controlled h(O_K) rather than against f alone.
    - >-
      CRATER SEARCH IS NOT ASYMPTOTIC AT TOY SCALE. A meet-in-the-middle over 3
      vertices has no exponent. MITIGATION: the crater term is MEASURED and
      reported as a measurement, and the exponent language is applied only to the
      fitted slope in f, with an explicit statement that the crater term's
      asymptotics are assumed from the literature and not observed here.
    - >-
      THE ASCENT IDENTIFICATION MAY BE CHEAPER OR DEARER THAN C_isog(ell)
      SUGGESTS at ell in {2, 3}, where root-finding is trivial. Measured costs at
      ell = 2, 3 must not be extrapolated to large ell, where H-VOLC-0e303a
      locates the real obstruction. MITIGATION: an explicit statement in the
      analysis, and the large-ell question is routed to IDEA-20260901-c7e601
      rather than silently assumed away.
    - >-
      REACHABILITY IS NOT AN ATTACK. Even a fully polynomial path-finding
      algorithm moves an ECDLP instance to another curve with the same k and the
      same generic cost (T1, IDEA-20260807-5cabfc). MITIGATION: stated in the
      interpretation limits, in the claim, and in sota_delta, so no reader can
      take the exponent as an attack exponent.

  interpretation_limits:
    - >-
      CLAIM TIER TOY, ell = 2 AND 3, TWO TO SIX SMALL CLASSES. Nothing transfers
      to cryptographic scale, and the exponent statement is an ANALYTIC claim
      checked for consistency at toy scale, not a measured crypto-scale result.
    - >-
      THIS IS A REACHABILITY EXPONENT, NOT AN ATTACK EXPONENT. It prices the cost
      of MOVING between curves of a class. Because the ECDLP is class-invariant up
      to transport, a cheaper move is worth exactly what the destination curve is
      worth, and no committed evidence in this program says any curve in a class
      is worth more than another.
    - >-
      THE DELTA IS AGAINST THIS PROGRAM'S GATE T5, NOT AGAINST THE ISOGENY
      LITERATURE. If the recalled Galbraith 1999 citation lands, the algorithm is
      known and the contribution is the correction of a committed internal
      statement plus the density measurement. The record is written to remain
      useful in that case and must not be presented otherwise.
    - >-
      THE DENSITY CLAIM IS HEURISTIC-CONDITIONAL AND IS LABELLED SO EVERYWHERE. No
      unconditional statement is made about how many classes admit the discount.
    - >-
      SUBEXPONENTIAL CRATER METHODS ARE NOT EVALUATED. Class-group relation
      methods may beat the sqrt(h(O_K)) meet-in-the-middle; that would strengthen
      the direction of the claim and is out of scope here, and its omission is
      disclosed rather than used.

  heuristic_assumptions:
    - id: H1
      statement: >-
        SMOOTHNESS-GENERICITY OF THE FROBENIUS CONDUCTOR. For a uniformly random
        ordinary isogeny class at a given p -- equivalently a uniformly random
        trace t in the Hasse interval with t^2 - 4p not a square times a
        squarefull obstruction -- the conductor f = sqrt((t^2 - 4p)/D_0) behaves
        for smoothness purposes like a uniformly random positive integer of the
        same size. Formally, for y = f^{1/u} the density of classes with f being
        y-smooth is rho(u) (1 + o(1)) as p grows, with rho the Dickman-de Bruijn
        function.
      rigorous_support: >-
        RIGOROUS INGREDIENT: |D| = 4p - t^2 <= 4p by Hasse, so f <= 2 sqrt(p) is
        an integer of at most half the bit length of p, and the map t |-> D is a
        polynomial map with no small fixed divisor beyond the explicit powers of 2
        handled by the D_0 = 0 mod 4 branch. CLASSICAL STATEMENT IMITATED: the
        Dickman-de Bruijn / Canfield-Erdos-Pomerance smooth-number density
        Psi(x, y)/x = rho(u)(1 + o(1)). THE GAP, STATED PLAINLY: D = t^2 - 4p is a
        POLYNOMIAL value, not a random integer, and polynomial values are known to
        deviate from random-integer smoothness heuristics by a positive constant
        factor determined by local densities; moreover f is the square part of D
        divided out, which is a further non-generic operation. The assumption is
        therefore expected to be right in exponent and wrong in constant, and the
        validation plan measures exactly that constant.
      falsification_condition: >-
        The empirical smooth-conductor density departs from rho(u) by more than 2
        standard errors at three or more consecutive values of u in [1, 4], or the
        departure grows with p across the tested primes rather than shrinking.
      validation_plan: >-
        SAMPLE: at each of at least four toy primes spanning 14 to 26 bits,
        enumerate EVERY trace t in the Hasse interval -- 4 sqrt(p) values, fully
        enumerable at these sizes, so this is a census and not a sample -- compute
        D = t^2 - 4p, factor it (p-sized, routine), extract (D_0, f), and record
        the smoothness profile of f. SHORTCUT: none is required at toy scale
        because the Hasse interval is enumerable; at larger p the shortcut is to
        sample t uniformly rather than enumerate, and that substitution must be
        recorded as a change of estimator. COMPARISON: empirical CDF of
        u = log f / log y against rho(u), computed by numerical integration of the
        delay differential equation, over u in [1, 4]. TAIL CHECK: the smoothest
        observed conductor at each p against the rho(u) prediction for the
        extreme quantile, and the roughest, since the discount fails on rough f
        and the rough tail is the one that bounds the method. TRANSFER: the
        sampled parameters (p, range of t, u grid) are recorded in full; no
        extrapolation of the measured constant to cryptographic p is made, and the
        expected constant-factor deviation from polynomial values is reported as a
        measured number rather than corrected away.
    - id: H2
      statement: >-
        CRATER SEARCH COST. Reaching a specified vertex of the crater, a
        Cl(O_K)-torsor of size h(O_K), costs h(O_K)^{1/2 + o(1)} group-action
        evaluations by meet-in-the-middle, or the same time with O(1) memory by a
        distinguished-point pseudorandom walk, and no better classical method is
        assumed.
      rigorous_support: >-
        RIGOROUS INGREDIENT: a meet-in-the-middle over a set of size h costs
        O(sqrt(h)) by the birthday argument, a counting fact. CLASSICAL STATEMENT
        IMITATED: rapid mixing of the crater Cayley graph under GRH
        (Jao-Miller-Venkatesan, RECALLED), which is what makes the pseudorandom
        walk variant legitimate. THE GAP: subexponential class-group relation
        methods may beat sqrt(h) for large h, which would only strengthen the
        claim's direction, and at toy h neither asymptotic is in force.
      falsification_condition: >-
        The measured crater search cost departs from sqrt(h(O_K)) by more than a
        factor 4 across the swept family. The horizontal term must then be quoted
        as measured rather than as sqrt(h(O_K)), and the exponent claim restated
        with the measured term.
      validation_plan: >-
        SAMPLE: at least 200 random crater endpoint pairs on each of the swept
        classes. SHORTCUT: none needed; craters are enumerable at toy scale.
        COMPARISON: measured search cost against sqrt(h(O_K)) computed exactly
        from the class-number formula for each class. TAIL CHECK: the worst
        endpoint pair against the predicted upper quantile of the birthday
        distribution. TRANSFER: none; the term is measured at the scales used and
        its asymptotic form is cited, not observed.

  target_complexity:
    time_exponent: >-
      TARGET, FOR ORDINARY-CLASS ISOGENY PATH-FINDING (NOT FOR THE ECDLP):
      O~(h(O_K)^{1/2} + sum_{ell | f} v_ell(f) C_isog(ell)), which for a class
      with conductor f = p^delta and smooth f is p^{1/4 - delta/2 + o(1)},
      degenerating to polylogarithmic at delta = 1/2. BASELINE BEING REPLACED, and
      it is an internal one: gate T5's committed ~sqrt(h) ~ p^{1/4}. FOR THE
      ECDLP: no exponent is claimed or moved; the target and the best known are
      both n^{1/2 + o(1)}.
    memory_exponent: >-
      h(O_K)^{1/2} ~ p^{1/8 - delta/4} for the meet-in-the-middle variant, or
      O(v_ell(f) log p) -- essentially O(1) in the exponent -- for the
      distinguished-point variant at the same time exponent. The vertical
      component needs only the path, O(v_ell(f)) curves. This is a genuine
      time-memory choice and both points are stated rather than the favourable one
      alone.
    best_known: >-
      For the ECDLP on these curves, unchanged and unchallenged: parallel Pollard
      rho with the negation map at n^{1/2 + o(1)} time and O(1) memory per
      processor, BSGS at n^{1/2} time and memory, automorphism-discounted rho on
      CM curves (KN-TECH-018, a constant of at most sqrt(6)). For ordinary
      isogeny path-finding: the published algorithms recalled above, which this
      session could not open and which may already contain claim (A).
    hidden_overhead: >-
      DISCLOSED HONESTLY. The o(1) hides: (i) the class-number approximation
      h(O_K) = |D_0|^{1/2 + o(1)}, whose o(1) contains the Dirichlet
      L-value L(1, chi) and is subject to Siegel-type ineffectivity -- a genuine
      superpolynomial-in-nothing but effectively unbounded constant that no
      measurement at toy scale can bound; (ii) the factorization of D, polynomial
      in practice at these sizes but not proven so; (iii) the constant in
      C_isog(ell), which at large ell is where H-VOLC-0e303a locates the real
      obstruction and which this record does NOT improve. The second term is
      polynomial in the LARGEST PRIME FACTOR of f, not in log f, and for rough f
      it dominates and the discount disappears entirely -- that is not an o(1), it
      is a regime, and claim (C) is the attempt to measure how common it is.
    tradeoff_note: >-
      The horizontal term interpolates on the standard van Oorschot-Wiener line:
      with M processors and distinguished points the crater search parallelizes
      with linear speedup at O(1) memory each, so the exponent is unchanged and
      only the wall clock moves. The vertical term is inherently sequential in the
      depth but is negligible whenever f is smooth, so parallelization does not
      change the balance. There is no regime in which extra memory buys a better
      time exponent here.

  dominated_by: >-
    CHECKED ACROSS EVERY ROW OF THE FRONTIER, ON TIME, MEMORY AND QUERIES, BEFORE
    ANSWERING. As an ECDLP attack: n/a (no result claimed) -- the record offers no
    ECDLP time, memory or query point, and every curve reached carries the same k
    and the same generic cost, so no frontier row is approached. As an
    isogeny-path-finding algorithm: PLAUSIBLY DOMINATED, and possibly equalled
    exactly, by the published ordinary-curve isogeny construction algorithms
    (Galbraith 1999; Galbraith-Hess-Smart 2002), RECALLED and not opened, which by
    recollection already ascend to the crater before searching. This is the single
    most likely way the record loses novelty and it is stated first rather than
    buried. As a correction to gate T5: not dominated by anything in this
    repository -- no committed record states the two-term cost or the f^{1/2}
    factor, and IDEA-20260807-bb03d3, which is nearest, explicitly stops at the
    torsor and does not take the second step. As a density claim: not dominated;
    no committed record measures conductor smoothness.
  sota_delta: >-
    +0 AGAINST THE ECDLP FRONTIER, on time, memory and queries alike, in every
    branch of the experiment. Against this program's committed gate T5, the delta
    is quantitative and is a factor f^{1/2} in the reachability cost -- p^{1/4}
    becomes p^{1/4 - delta/2} for f = p^delta with smooth f, i.e. a factor 4 on
    the committed p = 4001 class (f = 16) and unbounded in principle as delta
    approaches 1/2. Against the isogeny literature the delta is plausibly +0 and
    the record says so.

  discriminated_from:
    - >-
      IDEA-20260807-bb03d3 gives the ASCENT as a canonical normal form for
      amortization over many targets, and stops at the observation that the output
      is a Cl(O)-torsor of size h(O). This record adds the descent half -- the
      target's ascent is computable, so its reversal is a free descending path --
      which converts the torsor from h(O_f) to h(O_K) and is where the entire
      exponent claim lives. Same first move, different second move, different
      conclusion.
    - >-
      IDEA-20260826-f412a0 tracks the height of an UNDIRECTED random walk and
      measures hitting and mixing times against a birth-death null. This record
      tracks a DIRECTED path that may inspect its target, for which the vertical
      coordinate carries no search at all. The two are complementary and their
      predictions are compatible: f412a0's additive branch is what this record
      predicts, and this record explains why.
    - >-
      IDEA-20260807-4f43ac observes that class-level volcano data amortizes to
      zero over many targets and that an x-indexed precomputation does not
      transport. That is about reuse across targets on a fixed curve; this is
      about the cost of one path between two given curves.
    - >-
      H-VOLC-0e303a prices the LEVEL instrument and locates the obstruction in the
      large-ell walk. This record consumes that price as its second term, does not
      dispute it, and does not improve it; the improvement is routed to
      IDEA-20260901-c7e601, which is what makes the two records composable rather
      than overlapping.
    - >-
      IDEA-20260901-7b8856 (this session) concerns the scalar action of End(E) on
      the prime-order subgroup. Disjoint object, disjoint metric; the only
      relation is that both explain why a depth result does not become an attack.

  estimated_cost:
    implementation: medium
    compute: low

  recommended_priority: high

  honest_prior_of_survival: >-
    0.95 that the ascent-uniqueness rate is exactly 1 on real volcanoes, since it
    is the defining structural fact. 0.8 that METHOD B measurably beats METHOD A
    on the swept family with the predicted slope difference, the residual risk
    being that at toy class numbers the constants swamp the exponent. 0.5 that a
    reviewer with retrieval finds claim (A) already published, in which case the
    record's surviving value is the T5 correction and the density measurement --
    which is why both are in the minimal test. 0.65 that the empirical conductor
    smoothness matches rho(u) in exponent while deviating in constant, the
    expected outcome for polynomial values.

