idea:
  id: IDEA-20260815-1d4437
  question_id: RQ-HYBRID-cdf2b2
  added: '2026-08-15'
  title: >-
    HYBRID ECC-PLUS-PQC KEY EXCHANGE IS DEPLOYED ON THE ARGUMENT THAT
    BREAKING IT NEEDS BOTH COMPONENTS BROKEN: check whether the combiner
    actually delivers that, component by component
  class: cost-model

  claim: >-
    Hybrid constructions combine an ECC and a post-quantum shared secret
    through a combiner. The security claim is that both must fall. That
    holds only if the combiner is a secure dual-PRF or equivalent, and
    deployed combiners vary. Checking each deployed combiner against the
    property its security argument needs is a bounded, concrete audit.

  mechanism: >-
    Enumerate deployed hybrid combiners. For each, identify the property its
    security argument requires and check whether the construction provides
    it, including the case where one component's secret is fully known to
    the adversary.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of RQ-HYBRID-cdf2b2 and GOAL-HYBRID-001; grep 'hybrid' (40
      deployment hits), 'combiner', 'dual PRF'.
    results: >-
      Hybrid deployment appears in the corpus; no record audits combiners
      against the property their security argument needs.
    verdict: >-
      ADAPTATION. Combiner security is well studied in the literature; the
      contribution is a per-deployed-combiner audit in this program's
      evidence format.

  object_first_candidate:
    tracked_object: >-
      THE PROPERTY EACH DEPLOYED COMBINER PROVIDES, against the property
      its security argument assumes.
    lossiness: >-
      Reducing a combiner to one property discards its other behaviours,
      which is what the security argument does and why the property must
      be the right one.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while deployed combiners are documented; undocumented or
      implementation-defined combiners are the audit's key entries.

  null_object_control: >-
    NULL 1 -- a combiner known to be a secure dual-PRF, which must pass.
    NULL 2 -- a deliberately broken combiner, such as plain concatenation
    without hashing or a simple XOR of secrets of different lengths, which
    must fail.

  discriminated_from:
    - >-
        Published combiner analyses, which are more general; this audits
        the specific deployed constructions.
    - >-
        The ECC-side records in this series, which concern breaking the
        ECC component; this concerns whether breaking it suffices.

  assumptions:
    - >-
        Deployed combiners are documented precisely enough to audit; those
        that are not are the audit's most important entries.
    - >-
        The required property is identifiable from each construction's
        security argument; where the argument is informal the required
        property must be inferred and that inference recorded.

  predictions:
    - metric: >-
        secure-combiner null
      direction: different
      minimum_effect: >-
        FORCED pass.
    - metric: >-
        deliberately broken combiner null
      direction: different
      minimum_effect: >-
        FORCED fail; a check passing plain XOR verifies nothing.
    - metric: >-
        per-combiner verdict with one component's secret known
      direction: different
      minimum_effect: >-
        The measurement; this is the case the hybrid claim is actually
        about and is where a weak combiner shows up.

  minimal_test:
    design: >-
      Three deployed combiners, both nulls, with the one-component-known
      case as the central test.
    controls:
      - >-
          Secure-combiner and broken-combiner nulls.
      - >-
          One-component-known case tested for every combiner, since that
          is the hybrid claim's actual content.
      - >-
          Undocumented combiners listed rather than assumed adequate.
    required_metrics:
      - >-
          Per-combiner property verdict with the construction cited.
      - >-
          Behaviour with one component's secret known.
      - >-
          List of undocumented combiners.

  falsification_conditions:
    - >-
        A null misbehaves. The audit criterion is wrong.
    - >-
        A deployed combiner fails with one component known. The hybrid
        claim does not hold for it, which is a deployment-relevant finding
        requiring review.
    - >-
        All combiners pass. The hybrid claim holds for the audited
        constructions, which is worth recording explicitly.
    - >-
        Combiners are undocumented. The claim cannot be audited for them,
        which is itself the finding.

  confounders:
    - >-
        INFORMAL SECURITY ARGUMENTS: where the required property must be
        inferred rather than read, the audit is testing the auditor's
        inference and must say so.
    - >-
        IMPLEMENTATION VERSUS SPECIFICATION: a specification may mandate a
        sound combiner that an implementation does not follow, and this
        audit reads specifications.

  interpretation_limits:
    - >-
        Audits combiner constructions; makes no claim about any
        deployment's implementation.
    - >-
        Scoped to the audited combiners and their specification versions.
    - >-
        A pass covers the combiner, not the components' own security.

  heuristic_assumptions:
    - id: HEUR-HYBRID-1
      statement: >-
        A combiner providing the dual-PRF property delivers the hybrid
        claim that both components must be broken.
      rigorous_support: >-
        Rigorous ingredient: the dual-PRF property gives that the output
        is pseudorandom if either input is, which is exactly the hybrid
        claim and is a standard reduction. THE GAP: deployed combiners
        also mix in transcript material and context strings, and the
        reduction's applicability depends on how those are bound -- so
        the property may hold for the core combiner while the deployed
        construction around it does not inherit it.
      falsification_condition: >-
        A combiner with the dual-PRF property whose deployed
        construction nonetheless fails with one component known.
      validation_plan: >-
        SAMPLE: every audited combiner, tested with each component known
        in turn. TAIL CHECK: combiners whose transcript binding is most
        complex, reported individually. TRANSFER: none; the audit binds
        specification versions.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Symbolic audit; no compute.
    memory_exponent: >-
      Negligible.
    best_known: >-
      Incumbents are the published combiner security analyses, applied
      here to deployed constructions rather than improved.
    hidden_overhead: >-
      Transcript and context binding around the core combiner is where
      deployed constructions diverge from the analysed ones.
    tradeoff_note: >-
      Auditing specifications is cheap and bounded; auditing
      implementations would be far more informative and is out of scope.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As combiner theory: dominated by the
    published literature. As a per-deployed-construction audit: none exists
    here. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: a per-combiner check of
    deployed hybrid constructions against the property their security
    argument requires, with the one-component-known case tested explicitly
    since that is what the hybrid claim actually asserts.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.8 that three deployed combiners are documented precisely enough. 0.9
    that the nulls calibrate. 0.1 that a deployed combiner fails the one-
    component-known case, which would be deployment-relevant and would need
    review before disclosure.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
  source_refs:
    - RQ-HYBRID-cdf2b2
    - GOAL-HYBRID-001
    - RQ-KEX-b8be01
    - KN-TECH-056
    - KN-TECH-080
    - docs/inventor-protocol.md
  id_allocation_provenance: >-
