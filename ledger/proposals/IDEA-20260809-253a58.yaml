idea:
  id: IDEA-20260809-253a58
  question_id: RQ-FIND-001
  added: '2026-08-09'
  title: 'strength is a required evidence field with no vocabulary and no semantics, run_ids:
    [] satisfies the required-field check on 203 of 326 records, and the decision layer has no
    claim-tier check at all -- so the two labels every downstream synthesis weights by are unaudited
    free text'
  class: control
  claim: 'Re-measured independently at HEAD over 326 evidence records. (1) STRENGTH HAS NO VOCABULARY.
    The field carries 13 distinct values (preliminary 209, inconclusive 31, replicated 29, moderate
    18, strong 10, absent 7, n/a 8, weak 8, plus single_cell, revise_required, suggestive, inadmissible,
    ''single-run''). ''strength'' appears exactly twice in validate_ledger.py -- once in REQUIRED,
    once in a disclosure comment. There is no STRENGTH set and no semantic check, although the
    same file DOES vocabulary-check proof_status against PROOF_STATUSES and errors on an unrecognised
    value. docs/evidence-and-reproducibility.md defines replicated as ''reproduced from a clean
    run, preferably independently'', with ''preferably'' doing all the load-bearing work. Of the
    29 records claiming replicated, 11 cite ZERO runs. (2) THE REQUIRED-FIELD CHECK DOES NOT REQUIRE.
    203 of 326 records carry run_ids: [] and PASS, because field_is_satisfied returns True whenever
    body.get(field) not in (None, '''') and [] is not in (None, ''''). (3) THE DECISION LAYER
    IS UNCHECKED ENTIRELY. check_cross_refs'' coordinator_decision branch verifies only that target_ids
    resolve; it performs no tier comparison, so a decision may assert above the tier of the evidence
    it cites. Concretely: EV-SSI-0c529c declares claim_tier crypto and EV-SSI-b7c3a1 declares
    medium from the SAME run RUN-SSI-9b542d-001, with b7c3a1''s own boundaries reading ''Claim
    tier is MEDIUM, not crypto''; neither is checked, and all three crypto-tier records escape
    (two with run_ids: []).'
  mechanism: 'Define replication operationally BEFORE auditing, then audit: a record may claim
    replicated only when it cites >= 2 runs differing in at least one declared axis (seed, instance,
    or environment) and reports agreement quantitatively. Run the census as a committed measurement
    -- for each of the 29, which axis if any actually varied. Then three validator changes, each
    modelled on a pattern the file already implements: (a) a STRENGTHS vocabulary set mirroring
    PROOF_STATUSES, erroring on an unrecognised value; (b) run_ids: [] requires a sibling run_ids_note,
    the DOCUMENTED_NULL_OK pattern already used for hypothesis_id; (c) the decision-layer rule
    -- a decision''s asserted tier may not exceed min(tier of cited evidence) -- as the mechanical
    form of AGENTS.md rule 4. Controls: the forced-FAIL is a planted record declaring crypto over
    a 16-bit run, which must now fire; the forced-PASS is EV-IC-002, which declares toy over a
    medium-tier run and must stay clean. Expect the honest outcome to be that most replicated
    records are seed-replicated only -- a legitimate and much narrower claim, and exactly the
    kind of quantitative statement about its own discipline the program has never made.'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-09'
    grep_results:
    - IDEA-20260805-de2945 / H-FIND-52472d already own the claim-tier ceiling on the EVIDENCE
      side (see dropped list) -- but they are about which record points UP the KN-FIND -> EV ->
      RUN chain and its tier inequality; they say nothing about strength, nothing about run_ids
      emptiness, and nothing about the decision layer, which is the one link outside their three-link
      chain. I verified de2945's text mentions strength/run_ids only in passing (4 occurrences,
      none as subject). IDEA-20260807-d7ef50 concerns which record an evidence record points UP
      to (question_id / hypothesis_id linkage); this is what it points DOWN to (runs) and what
      strength it may claim from them -- a disjoint defect with a disjoint fix. No proposal among
      459 has replicated, strength or run_ids emptiness as its subject (verified by title scan;
      the single title hit, IDEA-20260805-4d31bc, is about crossover order as a unit-invariant
      observable). The 122 pre-existing validator failures recorded in REVIEW-UNADDRESSED-20260807
      section 7 do not include these, because these records PASS.
    conclusion: Screened against all 459 records in ledger/proposals, 271 in ledger/hypotheses
      and knowledge/; external novelty UNVERIFIED.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS: any cryptographic claim. The object is the EVIDENCE
      LABEL and the checks that do or do not bind it.'
    tracked_object: Per evidence record, the triple (strength label, number of runs cited, axes
      those runs actually vary).
    one_step_propagation_rule: Adding a run extends the axis set; a strength label is licensed
      only by the axes actually varied, which composes exactly.
    newness_score: Nil as mathematics. `replicated` is the strongest label the corpus uses and
      currently costs nothing to write.
  lossy_projection_identifiability_audit:
    projection: an evidence record -> (strength, |run_ids|, varied axes).
    what_is_discarded: The science; only the label and its support are retained.
    is_it_only_a_change_of_coordinates: 'NO. Honest caveat: a WEAK object producing label-audit
      verdicts. Its value is that every downstream synthesis weights by a string nothing checks.'
    mirror_failure_check: 'CHECKED. The audit must be able to pass records: 18 of the 29 `replicated`
      records DO cite runs, so a clean verdict is available and the audit is not rigged to fail.'
  null_object_control:
    primary_null: 'FORCED-PASS SET: EV-IC-002, which declares toy over a medium-tier run, must
      stay clean under every new check. FORCED-FAIL: a planted record declaring crypto over a
      16-bit run must fire. An audit that cannot do both is not an instrument.'
    secondary_nulls:
    - 'Run the strength census against proof_status, which IS vocabulary-checked, as a within-file
      comparator: the same validator errors on an unrecognised proof_status and not on an unrecognised
      strength.'
  assumptions: []
  predictions:
  - metric: of the 29 records claiming `replicated`, the number citing >= 2 runs differing in
      a declared axis
    direction: lower
    minimum_effect: 11 already cite zero runs; the question is how many of the remaining 18 vary
      any axis beyond the seed.
  minimal_test:
    design: Define `replicated` operationally BEFORE auditing (>= 2 runs differing in seed, instance
      or environment, with agreement reported quantitatively); run the census over all 29; then
      add three validator checks modelled on patterns the file already implements.
    controls:
    - forced-PASS EV-IC-002
    - forced-FAIL planted record
    - proof_status as a within-file comparator
    required_metrics:
    - per-record varied-axis census
    - strength vocabulary distribution
    - 'count of run_ids: [] records passing the required-field check'
  falsification_conditions:
  - 'Most `replicated` records vary a real axis: the label is honest and the concern is bookkeeping
    only.'
  - 'The forced-FAIL planted record does not fire after the change: the fix does not work and
    no verdict is admissible.'
  - 'The decision-layer tier rule produces no violations on the committed corpus: rule 4 is holding
    in practice even though nothing checks it, which is a genuinely reassuring outcome.'
  confounders:
  - Seed-replication is legitimate and common; the audit must report it as its own category, not
    as a failure.
  - 'run_ids: [] is correct for some control and screening records; the fix is a documented-null
    path, not a blanket requirement.'
  - Retro-fitting a vocabulary to 326 immutable records means superseding, not editing.
  interpretation_limits:
  - Label hygiene, not mathematics. No cryptographic claim is affected directly.
  - Schema and validator changes are Coordinator acts; this record supplies the census and the
    proposed checks.
  heuristic_assumptions:
  - id: HEUR-EVDIS-1
    statement: Varied-axis count is a faithful proxy for what `replicated` was meant to assert.
    rigorous_support: docs/evidence-and-reproducibility.md says 'reproduced from a clean run,
      preferably independently', where 'preferably' is doing all the load-bearing work.
    validation_plan: Publish the operational definition first and invite disagreement with it
      as a first-class outcome.
  target_complexity:
    time_exponent: n/a
    memory_exponent: n/a
    best_known: n/a -- no attack
    hidden_overhead: n/a
    tradeoff_note: n/a
  dominated_by: n/a (no result claimed; evidence-label audit)
  sota_delta: ZERO on every attack axis; no attack is proposed. replicated is the strongest strength
    label the corpus uses and it currently costs nothing to write; every downstream synthesis
    that weights evidence by strength is weighting an unaudited free-text string. Rule 4 is the
    rule the program's honesty rests on, and its mechanical half is inert on the decision corpus
    entirely. Both fixes are a schema change plus a census over committed data, at zero compute.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 0.99 that the census finds most `replicated` records are seed-replicated
    only -- a legitimate and much narrower claim. 0.9 that the three validator checks are implementable.
    0.4 that the decision-layer rule surfaces an actual tier violation on committed records.
