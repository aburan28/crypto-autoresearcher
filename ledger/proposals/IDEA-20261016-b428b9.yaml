idea:
  id: IDEA-20261016-b428b9
  question_id: RQ-XEDN-3bfe2e
  added: '2026-10-16'
  title: >-
    Parity-typed census with a matched null: is a same-sign dependency
    rank-forced (w=-1) or accidental, and does residue prescription matter
  class: control
  claim: >-
    For each accepted lift E=(A,B) with its two points compute r_lb (points
    plus any found), r_ub = dim Sel^phi + dim Sel^phihat - 2 (exact 2-isogeny
    Selmer sizes from local solubility at primes dividing B*D and infinity)
    and the root number w(E). (P1, implementation control) if
    corank Sel_{2^inf} <= r_ub (to be re-derived by the executor) then a cell
    with r_lb=r_ub=1 has w=-1 and r_lb=r_ub=2 has w=+1; both historical
    candidates (rank exactly 2) have w=+1. (P2, typing) every exact dependency
    is RANK-FORCED (r_ub=1, so w=-1) or ACCIDENTAL (r_ub>=2); accidental ones
    need an integral-multiple relation inside a rank>=2 lattice and are
    predicted rarer; the census measures the ratio. (P3, matched null) the
    dependency rate of prescribed-residue lifts equals that of an unprescribed
    null with the same box, sign pattern and integrality (A,B free instead of
    (-1,16) mod p) within the binomial floor 3/N.
  mechanism: >-
    PAIR: representation = (r_ub, r_lb, w) per lift; operation set = 2-isogeny
    Selmer computation (phi, phihat). TRICHOTOMY: Class I partial-action; the
    Selmer groups are subgroup-closed. LOSSY-PROJECTION TEST: Sel^phi and
    Sel^phihat discard Sha[2] and the odd part compatibly with the group law
    (homomorphic images), so r_ub is a lossy but deterministic bound.
    Parity: the corank of Sel_{2^inf} has parity of the root number
    (Dokchitser-Dokchitser 2-parity for E/Q, recalled); with r_ub=r_lb=r the
    corank is r. A parity gate follows: w=+1 means rank 1 (a forced
    dependency) needs Sha[2^inf] of odd corank. P2/P3 separate mechanisms the
    frozen design pools: dependency rate = P(rank 1) + P(accidental sublattice).
