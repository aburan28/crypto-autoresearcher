    discriminated_from and the record does not pretend otherwise.
    (2) NO record in the corpus defines a completion count, a rigidity profile,
    or any counting function over consistent labelings; searches on
    `simulab|simulator` (166 files) and on `entropy|counting bound` (73 files)
    returned nothing of that shape.
    (3) NO record defines "hiding-preserving" as a property of a simulator; the
    corpus uses "simulable" as a binary, refined by existential width
    (IDEA-20260807-7270d1) and by algebraic degree (IDEA-20260806-530fdd), and by
    neither in the hiding direction.
    (4) The class-number statement h(O) about p^{1/2} is already in
    DECOMPOSITION.md section 3 (T5) and in the batch card's axis A3 row; the
    rigidity exponent 5/2 derived from it is not.
    EXTERNAL NOVELTY IS NOT ESTABLISHED: WebSearch and WebFetch both failed this
    session with a backend model error. The observation that a public instance
    determines its own secret is trivial and is NOT claimed as new; the claims
    are the counting function, the exact profile, the closure and the forward
