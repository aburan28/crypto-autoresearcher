  novelty_screen: >-
    PERFORMED 2026-08-11 against ledger/proposals/ (146 committed records) with
    the harness Grep tool, and against analysis/endomorphism-isogeny-
    decomposition/DECOMPOSITION.md read in full.
    (1) `^  question_id: RQ-GGMB-6eaabc` -> 9 lane records. IDEA-20260807-5876b8
