  discriminated_from: >-
    IDEA-20260807-5876b8 (oracle-framing collapse) is the nearest record and the
    overlap is real and acknowledged. ITS lemma L1 draws the consequence for
    ORACLE ADJUDICATION -- a non-simulable verdict carries zero information about
    attack cost, so every lane must place its oracle in a cell. THIS record draws
    the consequence for MODEL CONSTRUCTION -- a whole family of proposed
    refinements of the generic model is closed -- and supplies the counting
    function r that makes the statement quantitative, measurable by exhaustive
    enumeration, and productive of a forward exponent (5/2) that -5876b8 has no
    machinery to produce. Neither record implies the other: -5876b8's cells (c)
    and (d) concern realisability and cost, which r says nothing about; r's
    profile applies to labelings, which -5876b8 does not discuss. IF A REVIEWER
    JUDGES OTHERWISE, the record's surviving content is the profile, its exact
    value, and the Class 1 exponent, and it should be refiled as a measurement;
    that disposition is pre-registered in falsification_conditions rather than
    argued against.
    IDEA-20260807-070d03's PUB verdict on the coordinate oracle is the ONE-ORACLE
    instance of R-2 and is cited as such; this record explains why that verdict
    was forced rather than incidental.
    IDEA-20260807-7270d1 grades simulator ERROR by existential width;
    IDEA-20260806-530fdd grades simulator OVERHEAD by algebraic degree. Neither
    grades the HIDING property, and an oracle can have Z = 1, degree 1, and still
    destroy hiding if its answer is an honest label -- which is exactly the case
    R-2 covers and neither of them does.
    IDEA-20260811-a28c44 and IDEA-20260811-a343de (this batch) are the two Class
    2 survivors named in the closure; this record is their justification and does
    not duplicate their content.
    KN-FIND-b7e091 is binding, is entirely outside R-1's scope, is used as a
    regression fixture, and is not revisited.
