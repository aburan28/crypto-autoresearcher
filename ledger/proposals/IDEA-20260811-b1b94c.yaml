idea:
  id: IDEA-20260811-b1b94c
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-GGMB-6eaabc
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-aeeb17
  task_id: TASK-20260811-c439c2
  axis: A4
  claim_tier: toy
  title: >-
    INSTANCE RIGIDITY -- a closure, with its obstruction named and measured, of
    the whole "give the labels algebraic structure and re-prove Shoup" family of
    model refinements. Define the RIGIDITY PROFILE r(q) = log_N (number of
    labelings of q formal linear forms consistent with SOME instance). For a
    uniformly random injective labeling r(q) = q; for ANY concrete public
    instance of a rank-2 problem r(q) = min(q, 2), because the completion count
    is bounded by the number of instances, N(N-1). So committing to labels for
    two independent linear forms COMMITS TO k, no simulator that answers
    label-valued queries is hiding-preserving, and the deficit N^{q-2} is not a
    property of elliptic curves at all. Forward guidance is quantitative:
    randomising over an ordinary isogeny class raises the profile to
    min(q, 5/2) because h(O) is about p^{1/2}, so curve-randomised models are the
    class that survives -- and charging a primitive instead of idealising a
    labeling is the other
  class: control

  claim: >-
    (A) THE DEFINITION. Fix prime N and a label alphabet S. For a finite set
    Lambda of formal linear forms in (Z/N)^2, call a map f: Lambda -> S
    CONSISTENT if there exists an instance -- a generator P of G and a point
    Q in G -- with f(alpha, beta) = label([alpha]P + [beta]Q) for every
    (alpha, beta) in Lambda. Define
      Comp(Lambda) = number of consistent maps,   r(q) = max_{|Lambda| = q}
      log_N Comp(Lambda).
    r is the RIGIDITY PROFILE of the labeling scheme. It measures how much
    freedom a simulator has after answering q label-valued queries.

    (B) THEOREM R-1, TWO LINES AND EXACT.
      (i) SHOUP'S LABELING (S arbitrary of size at least N, label map a uniformly
        random injection Z/N -> S). Every injective assignment of distinct labels
        to q linearly independent forms is consistent, so
        Comp = |S|(|S|-1)...(|S|-q+1) and r(q) = q (taking |S| = N^{1+o(1)}).
      (ii) ANY CONCRETE INSTANCE-BASED LABELING, elliptic curve or otherwise.
        A consistent map is determined by the instance that realises it, and
        there are exactly N(N-1) instances (N-1 choices of generator P, N choices
        of Q in G). Hence Comp(Lambda) <= N(N-1) for EVERY Lambda, of every size.
        Conversely, for q <= 2 with the forms Z/N-independent, the map
        (P, Q) |-> (label(lambda_1), label(lambda_2)) is a bijection onto pairs of
        independent points, so Comp = N(N-1) is attained. Therefore
          r(q) = min(q, 2)  EXACTLY.
      THE DEFICIT IS N^{q-2}, unbounded in q, and it appears at q = 3.

    (C) COROLLARY R-2, THE CORRECT DEFINITION OF SIMULABILITY, WHICH THE CAMPAIGN
    HAS BEEN USING IMPLICITLY AND SHOULD USE EXPLICITLY. Call a simulator
    HIDING-PRESERVING if the distribution of its output transcript is independent
    of k. Shoup's argument closes an augmented problem at exponent 1/2 only for
    hiding-preserving simulators; a simulator that internally instantiates a
    concrete (P, Q) and answers by honest computation is a perfectly correct
    simulator and preserves NOTHING, because k is then determined by its own
    coins. By R-1(ii), ANY simulator that answers label-valued queries on two
    independent forms has committed to an instance and hence to k. CONSEQUENCE:
      NO COORDINATE-VALUED ORACLE ADMITS A HIDING-PRESERVING SIMULATOR, AT ANY
      COST, EVER.
    This is why IDEA-20260807-070d03's verdict on the coordinate oracle is PUB
    ("self-computable, the framing is empty") rather than a closure, and it
    supplies the reason behind that verdict: self-computability is the SHADOW of
    rigidity, and rigidity is the primitive fact.

    (D) THE CLOSURE, AT THE INVENTOR-PROTOCOL SECTION 4 STANDARD. NAMED
    OBSTRUCTION: INSTANCE RIGIDITY. ARGUMENT: the completion count of any
    concrete instance-based labeling is bounded by the number of instances, which
    is N^{2+o(1)} independently of how many labels are revealed; a model whose
    idealisation is "the labels have algebraic structure but are otherwise
    honest" therefore has r(q) = min(q,2) and its simulator runs out of freedom
    at the third query, so no Shoup-style bound above exponent 0 can be proved in
    it. THEREFORE THE FAMILY OF MODEL REFINEMENTS OF THE FORM "replace Shoup's
    random injection by a structured labeling that reflects the curve, then
    re-prove a lower bound" IS CLOSED, and it is closed for a reason that has
    nothing to do with elliptic curves -- the same argument closes it for any
    concrete group with concrete elements.
    FORWARD GUIDANCE, NAMING THE CLASSES THAT REMAIN OPEN, WITH NUMBERS:
      CLASS 1, CURVE-RANDOMISED MODELS -- randomise the CURVE rather than the
        labeling. Within one ordinary F_p-isogeny class the number of
        (curve, instance) triples is about h(O) * N^2, and h(O) is about
        p^{1/2 + o(1)} (Siegel/Brauer, GRH-conditional effectivity), so the
        rigidity profile rises to r(q) = min(q, 5/2). NOT VACUOUS, and the extra
        1/2 in the exponent is exactly the class number. This is the quantitative
        statement axis A3 (TASK-20260811-f58f22, RQ-MTGT-2cabee) and lane L13
        should have; it is offered as a pointer and NOTHING is claimed about
        those lanes here.
      CLASS 2, CHARGED-PRIMITIVE MODELS -- keep the labeling idealised and charge
        a primitive instead. IDEA-20260811-a28c44's FB-GGM is one such model and
        it has a bound; IDEA-20260811-a343de's answer-branching floor is another
        and it also has one. Both survive rigidity because neither reveals a
        label whose algebraic structure is honest.
      CLASS 3, ALGEBRAIC-POWER MODELS -- bound what the adversary may COMPUTE on
        honest labels rather than what it may SEE. This is the degree-charging
        family, and it is closed separately and for a different reason in
        IDEA-20260811-d27383, whose forward pointer is non-scalar multiplicative
        complexity.
    That is a named obstruction, an argument, and a redirection with three named
    surviving classes. It is not a fatigue report.

    (E) WHAT THIS IS NOT. It is NOT a claim that the generic group model is
    useless -- Shoup's model is a model of the LABELING, not of a curve, and it
    is exactly as informative as it always was. It is NOT a claim that no
    curve-fitted model exists -- three surviving classes are named. It is NOT a
    contradiction of KN-FIND-b7e091, whose oracles return bits and handles
    determined by linear forms rather than honest labels, and which is therefore
    entirely outside R-1's scope; that finding is used here, not revisited.

  resource_label: >-
    None -- this is an audit, exactly as lane L12 is defined. It consumes no
    non-generic resource. Its subject is R1 (x-coordinates as field elements)
    only in the sense that R1 is the resource whose ORACLE FRAMING it explains
    away, and its conclusion is that R1's failure to yield a separation is a
    consequence of instance rigidity rather than of anything about coordinates.
  admissibility: admissible
  admissibility_argument: >-
    Admissible. No endomorphism is applied to any point of G; H-ENDO-001 is not
    used, needed or tested. KN-FIND-b7e091 is not revisited: R-1 does not apply
    to its oracles at all, because their answers are determined by the formal
    linear forms and are not honest labels, and the record says so explicitly in
    (E). The record EXTENDS the campaign's understanding of why that finding's
    technique works where it works.

  object_first_candidate:
    tracked_object: >-
      THE RIGIDITY PROFILE r(q) -- the log-base-N count of labelings of q formal
      linear forms that remain consistent with some instance. One non-decreasing
      function from the non-negative integers to the non-negative reals, per
      labeling scheme.
    lossiness: >-
      GENUINELY AND SEVERELY LOSSY. Discarded: the label alphabet, the curve, the
      field, the group law, every actual label, and the identity of every
      instance. Retained: a counting function. All curves over all primes with
      the same N share the same profile min(q,2), which is precisely the
      record's point and also proves the projection is not invertible. It is not
      a change of coordinates by a wide margin.
    propagation: >-
      DETERMINISTIC AND MONOTONE under the only operation that acts on it --
      revealing one more label. r(q+1) = r(q) + 1 while the new form is
      independent of the previous ones over Z/N and the completion count has not
      yet saturated, and r(q+1) = r(q) thereafter. The discarded material (the
      labels themselves) is discarded COMPATIBLY with that operation, because
      whether the count saturates depends only on the RANK of the form set and on
      the instance count, never on which labels were given. That is the
      inventor-protocol section 2 condition, and it is what makes r computable
      without ever looking at a curve.
    survival_score: >-
      Survives change of curve, prime, model, coordinate system and label
      alphabet -- it is an invariant of the SHAPE of the problem (rank 2, N^2
      instances). It dies at exactly three places, all named rather than
      discovered: (i) models where the instance itself is randomised over a
      larger family, where the count is the family size and the profile rises
      (Class 1 above); (ii) approximate or noisy labelings, where "consistent" is
      not a yes/no and the count must be replaced by a measure; (iii) oracles
      whose answers are not labels, where the notion does not apply at all --
      which is every oracle KN-FIND-b7e091 adjudicates, and the reason that
      finding is untouched.

  mechanism: >-
    STEP 1 (zero compute) -- DEFINE Comp and r as in (A), being explicit that
    consistency is existential over instances and that Lambda may be any finite
    set of forms.
    STEP 2 (zero compute) -- PROVE R-1. Part (i) is a count of injections; part
    (ii) is the observation that a consistent map is determined by its realising
    instance, plus the surjectivity check at q = 2. Both are short and both must
    be written, because the surjectivity half is what makes r(2) = 2 rather than
    merely at most 2, and without it the theorem states no gap.
    STEP 3 (zero compute) -- STATE R-2 and check it against the campaign's four
    KN-FIND-b7e091 oracles: each must be OUTSIDE R-1's scope (answers determined
    by linear forms), so that R-2 changes no existing verdict. This is the
    regression fixture and it is blocking.
    STEP 4 (zero compute) -- WRITE THE CLOSURE (D) with its three surviving
    classes, and compute the Class 1 exponent 5/2 from h(O) about p^{1/2}.
    STEP 5 (toy compute, <= 30 minutes, the measurement) -- COMPUTE Comp
    EXACTLY by enumeration at toy N, for q = 1, 2, 3, 4, on a real curve, and
    compare against the matched null (a random injective labeling of Z/N at the
    same N). The prediction is a clean step function on one side and a straight
    line on the other, and it is checkable by brute force in minutes.
    STEP 6 (zero compute) -- WRITE THE CLASS 1 POINTER to axis A3 as a pointer,
    changing no status and claiming nothing about lane L13.

  why_not_a_renamed_known_approach: >-
    The nearest INTERNAL object is IDEA-20260807-5876b8's lemma L1
    ("simulable implies self-computable, because the real adversary holds the
    concrete coordinates"), and the honest statement is that this record's
    corollary R-2 is the SAME PHENOMENON seen from the other side. The
    discrimination is that -5876b8 draws a consequence for ORACLE ADJUDICATION
    (a non-simulable verdict carries no information about attack cost), whereas
    this record draws a consequence for MODEL CONSTRUCTION (a whole family of
    proposed refinements of the generic model cannot work), and supplies a
    COUNTING FUNCTION that -5876b8 does not have and that makes the statement
    quantitative and measurable rather than argumentative. The counting function
    is what carries the forward guidance: without r, "randomise the curve
    instead" is a suggestion; with r, it is the exponent 5/2 against 2, and that
    number is actionable.
    NOVELTY IS THEREFORE CLAIMED ONLY FOR (a) the profile r and its exact value
    min(q,2), (b) the definition of hiding-preserving simulability as the
    campaign's operative notion, (c) the closure of the structured-labeling
    family with the three surviving classes, and (d) the Class 1 exponent. It is
    NOT claimed for the underlying observation that a public instance determines
    k, which is obvious and is already in the corpus. EXTERNAL NOVELTY IS NOT
    CLAIMED; web search was unavailable this session.

  predictions:
  - observable: the rigidity profile of a real curve, computed exactly
    metric: log_N Comp(Lambda) for |Lambda| = 1, 2, 3, 4 with forms in general
      position, by exhaustive enumeration over all N(N-1) instances at N in
      {101, 211, 401}
    direction: different
    predicted: exactly (1, 2, 2, 2). A value above 2 at q = 3 falsifies R-1(ii)
      and means the completion count is not bounded by the instance count, which
      would be a counting error. A value below 2 at q = 2 falsifies the
      surjectivity half and means the theorem states no gap.
  - observable: the matched null's profile
    metric: the same computation for a uniformly random injective labeling of
      Z/N into a set of size N, at the same N
    direction: higher
    predicted: exactly (1, 2, 3, 4), i.e. r(q) = q with no saturation. A
      saturating null means the enumeration is measuring the harness rather than
      the labeling and the whole measurement is void.
  - observable: regression on existing verdicts
    metric: number of KN-FIND-b7e091 or L12 verdicts changed by adopting the
      hiding-preserving definition
    direction: different
    predicted: EXACTLY ZERO, pre-registered. Every one of those oracles returns
      data determined by the formal linear forms and is outside R-1's scope. One
      or more changed verdicts means the definition is not conservative and halts
      the line.
  - observable: the Class 1 exponent
    metric: log_N (number of (curve, instance) triples in one ordinary
      F_p-isogeny class), computed exactly by enumerating a toy class
    direction: higher
    predicted: 2 + log_N h(O), which is about 5/2 when h(O) is about N^{1/2}. A
      measured exponent at or near 2 in toy classes with SMALL class number is
      expected and is not a falsification -- the prediction is about the SCALING
      of h, and the honest test is across several discriminants with h spanning a
      range.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, about forty minutes, HARD GATE). Prove R-1, and
      attack the surjectivity half specifically: is it really true that for two
      independent forms EVERY pair of distinct points of order N arises as
      (label(lambda_1), label(lambda_2)) for some instance? Check the edge cases
      -- forms that are dependent, forms involving only the first coordinate, the
      pair (1,0) and (0,1) versus a general pair -- and check what happens when
      Q = O is allowed. If the surjectivity fails, r(2) < 2 and the theorem
      states a smaller gap than claimed.
      STAGE 1 (toy compute, <= 30 minutes, AND IT IS THE CHEAPEST DECISIVE
      MEASUREMENT IN THIS BATCH). Brute-force enumerate all N(N-1) instances at
      N in {101, 211, 401} on a real curve, tabulate Comp for q = 1..4, and run
      the identical code on the matched random-injection null. Two numbers per
      cell, four cells, two arms; minutes of Python and no solver.
      STAGE 2 (zero compute). The regression check on existing verdicts, and the
      write-up of the closure with its three surviving classes.
    controls:
    - >-
      NULL OBJECT (matched, blocking, AND IT IS THE POINT OF THE WHOLE
      MEASUREMENT): the uniformly random injective labeling of Z/N at the same N,
      enumerated by the identical code path. It must give r(q) = q with no
      saturation. If the null saturates, the harness is imposing the saturation
      and the curve arm proves nothing.
    - >-
      SECOND CONTROL, THE OTHER DIRECTION (planted rigidity): a deliberately
      over-rigid labeling -- for instance one in which the label of every form is
      a fixed function of alpha alone -- which must give r(q) = 1. An instrument
      that cannot distinguish r = 1 from r = 2 cannot resolve the gap it is
      measuring.
    - >-
      DECAY PARAMETER: q on the ladder 1, 2, 3, 4, 6, 8. The curve arm must be
      FLAT from q = 2 onward and the null must be LINEAR. A curve arm that keeps
      rising is the tell that the enumeration is not enumerating instances.
    - >-
      Hygiene: N prime; the curve's full group order factored (KN-TECH-030);
      #E != p (KN-TECH-033); forms chosen in general position and the degenerate
      cases reported separately rather than pooled.
    required_metrics:
    - Comp and r(q) per q, curve arm and null arm, side by side
    - the planted-rigidity arm's profile
    - count of existing verdicts changed (pre-registered zero)
    - log_N of the (curve, instance) count for each enumerated toy isogeny class,
      with h(O) reported beside it

  controls:
  - >-
    NULL OBJECT: random injective labeling of Z/N, same N, same code. Must give
    r(q) = q. Blocking.
  - >-
    PLANTED RIGIDITY: a labeling depending on alpha alone, which must give
    r(q) = 1. Blocking in the opposite direction.
  - >-
    REGRESSION FIXTURE: KN-FIND-b7e091's four verdicts, required unchanged.
  - >-
    DECAY LADDER in q, as the artifact test.

  confounders:
  - >-
    r IS A COUNT, NOT A HARDNESS STATEMENT. r(q) = 2 says a simulator has little
    freedom; it does NOT say an adversary can efficiently exploit that, and
    reading it as "therefore ECDLP is easy given labels" would invert the record.
    The real adversary already has the labels and ECDLP is not known to be easy;
    that is precisely the point that rigidity is not about difficulty.
  - >-
    THE SCOPE OF R-1 IS LABEL-VALUED ORACLES ONLY. Applying it to an oracle whose
    answer is a bit or a handle determined by linear forms is a category error and
    would produce a false reopening of a closed verdict. The regression fixture
    exists to catch exactly that.
  - >-
    INSTANCE COUNT DEPENDS ON WHAT IS FIXED. If the curve and P are fixed
    publicly and only Q varies, the count is N and r saturates at 1, not 2. The
    record uses the convention that P and Q are both part of the instance; a
    different convention shifts the constant and NOT the closure, but every
    reported number must name its convention.
  - >-
    THE CLASS 1 EXPONENT USES h(O) about p^{1/2 + o(1)}, which is a
    GRH-conditional effectivity statement for the lower bound side. At toy scale
    class numbers are small and the exponent will not be visible; the honest test
    varies the discriminant rather than the prime.
  - >-
    OVER-READING THE CLOSURE. It closes a family of MODEL REFINEMENTS, not a lane
    and not a resource. Nothing about R1, index calculus, or any lane's work plan
    follows from it beyond the redirection in (D).

  falsification_conditions:
  - >-
    The surjectivity half of R-1(ii) fails at q = 2. Then r(2) < 2, the gap is
    smaller than claimed, and the closure's argument must be restated. Cheapest
    death, at Stage 0, forty minutes.
  - >-
    The measured curve arm shows r(3) > 2. The completion count is not bounded by
    the instance count and R-1(ii) is a counting error.
  - >-
    The matched random-injection null saturates. The harness is imposing
    saturation; both arms are void, not negative (AGENTS.md rule 3).
  - >-
    The planted-rigidity arm does not give r = 1. The instrument cannot resolve
    the scale it is measuring on and no null from it is citable.
  - >-
    Adopting the hiding-preserving definition changes any existing
    KN-FIND-b7e091 or L12 verdict. The definition is not conservative and the
    line halts pending review -- a definition that reopens closed oracles is far
    more likely an error than a discovery.
  - >-
    A reviewer exhibits a model refinement in the closed family that DOES prove a
    non-trivial bound. The closure is wrong, which would be the most valuable
    outcome here, and the record is superseded rather than defended.
  - >-
    A reviewer judges R-2 to be a restatement of IDEA-20260807-5876b8's lemma L1.
    Then the record's surviving content is the profile r, its exact value, and
    the Class 1 exponent, and it should be refiled as a measurement rather than a
    closure. This is the record's main novelty risk and it is stated rather than
    argued away.

  interpretation_limits:
  - >-
    THIS CLOSES A FAMILY OF MODELS, NOT A MATHEMATICAL DIRECTION. Three surviving
    classes are named with numbers. Nothing here declares any direction
    impossible, which the Idea Generator contract forbids and which the inventor
    protocol section 7 explicitly distinguishes from a scoped closure.
  - >-
    KN-FIND-b7e091 is binding, is entirely outside R-1's scope, is used as a
    regression fixture, and is not revisited. Its incidence and endomorphism-image
    verdicts are unaffected in either direction.
  - >-
    The Class 1 pointer concerns axis A3 (TASK-20260811-f58f22) and lane L13
    (RQ-MTGT-2cabee). It is a POINTER. This record claims nothing about those
    objects, adjudicates nothing there, and must not be cited as support for any
    conclusion in them.
  - >-
    Nothing here bears on H-STR-002, on phi-stable factor bases, or on any
    equivariance property. No factor base appears anywhere in the record. NOT
    P2-adjacent. Nothing here states or implies any cost; P3 is not engaged.
  - >-
    Stage-1 measurements are at N in the low hundreds, chosen so that exhaustive
    enumeration of all instances is possible. That is the RIGHT scale for this
    particular measurement -- the quantity is exact and combinatorial, not
    asymptotic -- but it licenses no statement about cryptographic size beyond
    the counting argument itself, which is scale-free.

  assumptions:
  - N prime; G = <P> of prime order N inside E(F_p).
  - >-
    An instance is a pair (P, Q) with P a generator of G and Q in G; there are
    exactly N(N-1) of them. Any other convention shifts the constant, not the
    conclusion, and must be named when a number is reported.
  - >-
    Labels are honest, i.e. the label of a group element is its actual
    representation as a point. A model with an additional secret encoding layer
    is outside R-1 and is exactly Class 2.
  - >-
    h(O) is about p^{1/2 + o(1)} for ordinary discriminants
    [recall-confident: Siegel's theorem, effective under GRH; cited via the
    campaign's own DECOMPOSITION.md section 3 which states h(O) about p^{1/2},
    NOT re-verified this session].
  - >-
    Shoup's model is cited (KN-TECH-005) and not reproved; only its labeling
    convention is used.

  heuristic_assumptions:
  - id: HA-1
    statement: >-
      GENERAL POSITION OF THE QUERIED FORMS. For an adversary that forms handles
      by group operations from the two initial handles, the linear forms it
      produces are in general position often enough that r(q) is attained at
      q = 2 by the first two independent forms rather than later.
    rigorous_ingredient: >-
      THE THEOREM DOES NOT NEED IT. R-1(ii)'s upper bound Comp <= N(N-1) holds
      for EVERY Lambda in every position, with no genericity assumption, because
      it counts instances. HA-1 affects only WHEN saturation occurs -- at the
      second independent form rather than at some later query -- and hence only
      the sharpness of the "q = 3" statement, never the closure. If HA-1 fails
      the closure is unchanged and only the phrase "at the third query" weakens
      to "at the third independent query".
    distribution_imitated: >-
      Genericity of a random rank-2 configuration over Z/N; the rigorous
      neighbour is that two uniform elements of (Z/N)^2 are independent with
      probability 1 - O(1/N).
    validation_route: >-
      In the Stage-1 enumeration, record for each q the index of the second
      independent form in the query order, over 1000 randomly generated
      adversary transcripts at N in {101, 211, 401}. Compare against the
      predicted geometric distribution with parameter 1 - O(1/N). TAIL CHECK: the
      fraction of transcripts in which independence is not reached within four
      queries, predicted O(N^{-2}). SAMPLED PARAMETERS AND TRANSFER: N in the low
      hundreds; the statement is combinatorial and its transfer to large N is a
      counting argument rather than an extrapolation, and that distinction is
      recorded here because it is the one heuristic in this batch that genuinely
      does transfer.
  - id: HA-2
    statement: >-
      CLASS-NUMBER SCALING FOR THE FORWARD GUIDANCE. For ordinary F_p-isogeny
      classes with discriminant D = t^2 - 4p, h(O) is about |D|^{1/2 + o(1)},
      which is about p^{1/2 + o(1)}, so the curve-randomised rigidity profile
      saturates at 5/2 rather than 2.
    rigorous_ingredient: >-
      The upper bound h(O) = O(|D|^{1/2} log|D|) is classical and unconditional;
      the matching lower bound h(O) >> |D|^{1/2 - epsilon} is Siegel's theorem and
      is ineffective unconditionally, effective under GRH. The record uses the
      pair honestly: the UPPER bound alone already caps the profile at 5/2 + o(1),
      which is the direction that matters for the forward guidance, and the lower
      bound is what makes the gain real rather than potential.
    validation_route: >-
      Enumerate toy ordinary isogeny classes across a range of discriminants with
      known class numbers, count (curve, instance) triples exactly, and fit
      log_N(count) against 2 + log_N h(O). The test is across DISCRIMINANTS at
      fixed p, not across p, because at toy p the class numbers are too small to
      show the exponent. TRANSFER ASSUMPTION: this validates the counting
      identity, not the asymptotic size of h, which is cited rather than measured.

  proof_search_map:
    bottleneck: >-
      The surjectivity half of R-1(ii): that at q = 2, with independent forms,
      ALL N(N-1) instance-labelings are realised, so r(2) = 2 exactly rather than
      at most 2. Without it the theorem states an upper bound on freedom and no
      gap against Shoup's labeling, and the closure loses its force. The upper
      bound half is a one-line instance count and carries no risk. Zero compute,
      and it is where all the attention belongs.
    baseline_embedding:
      parameter_slice: >-
        q <= 2. At this slice the concrete labeling and Shoup's random injection
        have the SAME profile, r(q) = q, so the two models are indistinguishable
        and every existing verdict obtained at q <= 2 is unaffected. This is the
        exact boundary at which the incumbent is recovered.
      reproduction_check: >-
        SYMBOLIC by substitution, plus the FROZEN FIXTURE of the four
        KN-FIND-b7e091 verdicts, all of which must come out unchanged because
        their oracles are outside R-1's scope. Any change halts the line.
    observation_collision:
      observable: the rigidity profile r(q).
      distinct_preimage_search: >-
        REQUIRED AND IT SUCCEEDS, AND THE COLLISION IS ENORMOUS AND DELIBERATE.
        EVERY concrete instance-based labeling of a rank-2 problem -- every
        elliptic curve over every prime field, the multiplicative group of every
        finite field, every concrete group whatsoever -- has the SAME profile
        min(q,2), while their ECDLP-analogue hardness differs by an entire
        complexity class (F_p^* is subexponential, E(F_p) is not known to be).
        THE OBSERVABLE THEREFORE DOES NOT IDENTIFY HARDNESS AT ALL, and stating
        that collision is the record's own strongest limitation: r closes a
        family of MODELS and can never be used to compare groups. The separating
        structure that r discards is the EFFECTIVITY of the labeling -- whether
        the forced values can be inverted efficiently -- and naming that as the
        discarded coordinate is the record's forward contribution to Class 2.
    constructive_transforms:
    - transform: observable_fiber
      proposed_object: >-
        Hold r fixed at min(q,2) and vary the forgotten structure: the fiber
        contains every concrete group. Find an intrinsic invariant separating
        F_p^* (subexponential) from E(F_p) (not known to be) INSIDE that fiber.
        The candidate is effectivity of the label inversion, i.e. the existence of
        a factor base over which labels decompose cheaply.
      predicted_gain: >-
        If such an invariant is found and is computable, it would be a
        classification of which groups admit index calculus -- which is the
        axis's original tight-characterisation target, approached from the model
        side rather than the oracle side. Predicted probability: low; the record
        is filed as a closure with this as the live constructive branch.
    - transform: stronger_invariant
      proposed_object: >-
        Replace the binary "is there a simulator" with the pair (simulator
        exists, hiding-preserving), and carry r(q) as the certificate that the
        second component fails.
      predicted_gain: >-
        Closes a family of proposed model refinements at zero cost and prevents
        the campaign from spending on them, with three surviving classes named.
    quantifier_order: >-
      R-1(ii): FORALL finite sets Lambda of formal linear forms, of every size,
        Comp(Lambda) <= N(N-1). The universal over Lambda comes FIRST and is the
        content -- no clever choice of queries evades a bound that counts
        instances. And separately: EXISTS Lambda with |Lambda| = 2 attaining it.
        Upper bound universal, attainment existential, in that order.
      R-2: FORALL simulators S that answer label-valued queries on two
        independent forms, S's output determines k, hence S is not
        hiding-preserving. The universal over S comes first, which is what makes
        it a closure rather than a remark about one construction.
      NOT CLAIMED, AND IT IS THE CONVERSE: that r(q) = min(q,2) implies the
      underlying problem is easy. The observation_collision above exhibits two
      groups with the same profile and different known complexity, which refutes
      the converse outright and is why it is stated as a collision rather than
      hidden as a caveat.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For a rank-2 instance over a group of prime order N with honest labels,
        the number of labelings of any set of formal linear forms consistent with
        some instance is at most N(N-1) and is exactly N(N-1) already at two
        independent forms; hence no hiding-preserving simulator answers
        label-valued queries beyond the second independent form." It can NEVER
        certify anything about hardness, about any specific group's difficulty,
        about whether a curve-randomised model has a bound, or about any oracle
        whose answers are not honest labels.
      nearby_object_control: >-
        THE MULTIPLICATIVE GROUP F_p^* WITH ITS INTEGER-REPRESENTATIVE LABELING is
        the nearest object on which the hoped-for reading fails: identical
        profile min(q,2), and yet index calculus solves its DLP in L(1/3). The
        method cannot distinguish it from an elliptic curve, which is the ceiling
        stated in advance. A SECOND nearby object: the CURVE-RANDOMISED model of
        Class 1, where the profile is min(q, 5/2) and the method's conclusion
        correctly does not apply -- included so that the closure's boundary is
        exhibited rather than asserted.
    proof_obligations:
    - claim: A consistent map is determined by its realising instance.
      responsibility: correctness
    - claim: There are exactly N(N-1) instances under the stated convention.
      responsibility: size
    - claim: >-
        At q = 2 with independent forms, every pair of independent points is
        realised, so the bound is attained.
      responsibility: strictness
    - claim: Shoup's random injection has r(q) = q.
      responsibility: baseline
    - claim: >-
        Every KN-FIND-b7e091 oracle is outside R-1's scope, so no verdict
        changes.
      responsibility: scope
    - claim: >-
        The curve-randomised count is h(O) * N(N-1), giving the 5/2 exponent.
      responsibility: size
    - claim: >-
        The random-injection null and the planted-rigidity control give r(q) = q
        and r(q) = 1 respectively.
      responsibility: interface
    - claim: >-
        The record closes a family of models and declares no direction
        impossible.
      responsibility: scope
    not_applicable_reason: null

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT EXISTS OR MOVES; this record is an audit and mounts
      nothing. The only exponents in it are RIGIDITY exponents: 2 for any
      concrete instance, q for Shoup's idealisation, 5/2 for a curve-randomised
      model within one ordinary isogeny class. Those are counting exponents, not
      cost exponents, and confusing the two would be the worst available
      misreading of this record.
    memory_exponent: >-
      The audit is O(1). The Stage-1 enumeration is O(N^2) time and O(1) memory
      at N in the low hundreds, which is why the measurement is possible at all
      and why it is the cheapest in this batch.
    best_known_baseline: >-
      Parallel Pollard rho with distinguished points at 0.886*sqrt(N) group
      operations and O(1) memory (KN-TECH-001, KN-TECH-006); automorphism-
      discounted on CM curves by a constant at most sqrt(6) (KN-TECH-018),
      baseline calibration and never an exponent; BSGS at sqrt(N) time and memory
      (KN-TECH-031). Unmoved and untouched.
    hidden_overhead_disclosure: >-
      The rigidity exponent hides EVERYTHING about computation, and that is not a
      defect to be minimised but the record's central finding: F_p^* and E(F_p)
      share the exponent 2 and differ by a complexity class. Any use of r that
      forgets this is invalid. Second disclosure: the Class 1 exponent 5/2 uses
      h(O) about p^{1/2}, whose lower-bound half is GRH-conditional, so the
      forward guidance's SIZE is conditional even though its DIRECTION is not.
    time_memory_tradeoff: >-
      Not applicable; the record occupies no point on any cost frontier and
      claims none. The only tradeoff it identifies is a MODELLING one: raising
      the rigidity profile requires enlarging the randomised family (curves,
      classes), and every such enlargement costs the model realism -- a real
      adversary faces one curve, not a random one. That tension is stated here so
      that Class 1 is pursued with its cost visible rather than as a free lunch.

  sota_delta: >-
    ZERO against every attack baseline: 0 time, 0 memory, 0 queries, 0 data. No
    attack is mounted and none is claimed. QUANTITATIVE CONTENT: an exact profile
    r(q) = min(q, 2) against Shoup's r(q) = q, i.e. a deficit of N^{q-2}
    consistent completions, appearing at q = 3; and a forward-guidance exponent
    of 5/2 for curve-randomised models, i.e. exactly +1/2 bought by the class
    number. Against the campaign's state of knowledge the delta is one closed
    family of model refinements and three surviving classes named with numbers,
    obtained at zero compute plus a thirty-minute enumeration.
  dominated_by: >-
    AS AN ATTACK: dominated by every row of the prime-field frontier, checked one
    by one, because it is not an attack. Parallel Pollard rho with distinguished
    points at 0.886*sqrt(N) time and O(1) memory (KN-TECH-001, KN-TECH-006);
    automorphism-discounted rho (KN-TECH-018) by a further constant at most
    sqrt(6); BSGS (KN-TECH-031) at sqrt(N) time and sqrt(N) memory. This record
    occupies no point on the frontier and `null` would be a fabrication.
    AS AN ANALYSIS: the incumbent is IDEA-20260807-5876b8's lemma L1 and its
    four-cell dichotomy, which dominates this record on OPERATIONAL REACH (it
    tells every lane what to do with its oracle, which this record does not) and
    is dominated by this record on QUANTIFICATION (it has no counting function
    and therefore no forward-guidance exponent). IDEA-20260807-070d03's PUB
    verdict on the coordinate oracle dominates on concreteness and is dominated
    on generality, since it treats one oracle and this treats all label-valued
    ones. Neither incumbent is superseded and both are cited.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: >-
    0.9 that R-1(ii)'s upper bound is correct -- it is an instance count and
    there is nowhere for it to hide an error. 0.75 that the surjectivity half
    holds cleanly at q = 2 including the degenerate cases, which Stage 0 checks.
    0.9 that the Stage-1 enumeration reproduces (1,2,2,2) against a null of
    (1,2,3,4), because it is exhaustive rather than statistical. 0.45 that a
    reviewer accepts the closure as more than a restatement of
    IDEA-20260807-5876b8's lemma L1 -- this is the record's main and honestly
    substantial novelty risk, and the argument for the difference is that a
    counting function with a forward exponent is actionable where an implication
    is not. 0.6 that the Class 1 exponent 5/2 is judged useful by axis A3 rather
    than already known there. 0.01 that anything here leads to an exponent in a
    cost model. MEDIUM priority: the measurement is the cheapest in the batch and
    the closure is real, but the record's main effect is to stop future spending
    rather than to enable any, and it changes no current lane's plan.

