idea:
  id: IDEA-20260905-2358e4
  title: Refinement types for threshold-signing proof preconditions
  class: composition
  claim: A threshold-signing proof set can be audited compositionally by treating every value as carrying an integer
    range, modular domain, session binding and provenance type; an operation is justified only when producer guarantees
    imply the consumer's precise preconditions.
  mechanism: 'Track a typed witness graph rather than a list of named zero-knowledge proofs. An encryption statement
    may establish a relation modulo an auxiliary modulus while the multiplication lemma needs an integer equality
    in a bounded interval; a conversion edge must prove the interval prevents wraparound and binds the same witness.
    A session identifier and statement digest travel with each edge, preventing reuse of a proof about a different
    instance from satisfying the current precondition. The useful output is a smallest unproved interface condition
    or a conditional composition theorem. The graph does not certify an entire protocol merely because every node
    is called a range proof: statement semantics, parameter inequalities and knowledge assumptions remain explicit.'
