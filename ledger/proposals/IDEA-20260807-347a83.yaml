idea:
  id: IDEA-20260807-347a83
  question_id: RQ-ECDLP-002
  added: '2026-08-07'
  title: Every yield, smoothness and equidistribution band in the campaign is calibrated on ONE
    curve instance per cell; DEC-20260801-015 calls this 'THE SINGLE LARGEST HOLE THE CAMPAIGN
    HAS DECLARED', costed it at ten minutes of compute, and it was orphaned by a batch-label collision
    rather than by a decision on its merits
  class: control
  claim: 'DEC-20260801-015 states the defect in its own terms: ''The frozen band is calibrated
    to a noise source the real arm does not have ... OBJ-REAL IS NOT A SAMPLE ... THE SCALE THAT
    ACTUALLY FLUCTUATES, ACROSS CURVE INSTANCES, WAS NEVER MEASURED, BECAUSE THERE IS ONE INSTANCE
    PER CELL'', and names OBJ-RT082-1 ''THE SINGLE LARGEST HOLE THE CAMPAIGN HAS DECLARED''. DEC-20260801-014''s
    single next action is RT082-CTRL-1 at k >= 20 fresh curve instances per cell, costed at about
    ten minutes. H-YIELD-001''s own test_boundary calls one curve per field size ''a DECLARED
    WEAKNESS of the design, not a strength''. No specification, reading rule or run was ever created:
    RUN-LPF-001-ivr and RR-IVR-1 appear nowhere outside DEC-20260801-015 and the BATCH-028 opening,
    and the label BATCH-028 was subsequently re-used on main for the EXP-IT-001 lane (CORR-20260803-77d5da).
    Because the defect is in the NULL CALIBRATION rather than in one hypothesis, it silently scopes
    EV-LPF-001, EV-EQD-001 and every EV-YIELD-* threshold at once.'
  mechanism: 'Re-run the identical pipeline at k >= 20 FRESH curve instances per cell at bits
    16 and 20, changing nothing but the instance, and report the BETWEEN-INSTANCE standard deviation
    of every statistic the campaign has banded: p_hat(u) for u in 2..5, STAT-KS-DICK, the yield
    ratio R of EV-YIELD-e1adbf / ca4b02 / 7c3195, and STAT-CHI and STAT-KS1 of EV-EQD-001 -- each
    against the archived i.i.d. null standard deviations those records used. One control re-scopes
    four evidence records.'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-07'
    corpus_paths_grepped:
    - experiments/EXP-LPF-001/runs
    - ledger/decisions
    - ledger/proposals
    grep_results:
    - experiments/EXP-LPF-001/runs contains only RUN-LPF-001-calib, -measure and -plantz. No instance-variance
      run exists.
    - OBJ-RT082-1 is not mentioned in any record after 2026-08-02.
    conclusion: The control was named, costed and never contracted.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS as the primary lens: every attack mechanism.
      This record proposes no mechanism and no improvement; it measures the variance of the instrument.'
    tracked_object: The between-instance standard deviation of each banded statistic, as distinct
      from its within-instance (i.i.d.) standard deviation.
    one_step_propagation_rule: Adding one fresh curve instance adds one draw to the between-instance
      sample; the estimator updates exactly.
    newness_score: Nil. It is the control the campaign's own red team demanded.
  lossy_projection_identifiability_audit:
    projection: the full per-instance measurement -> one standard deviation per statistic.
    what_is_discarded: Everything instance-specific.
    is_it_only_a_change_of_coordinates: 'NO. Honest caveat: this is bookkeeping, not mathematics,
      and it can only ever produce error bars. That is exactly what four evidence records are
      missing.'
    mirror_failure_check: 'CHECKED. The failure would be a variance estimator that returns the
      i.i.d. value by construction. It cannot: the between-instance estimator is computed across
      instances and the i.i.d. one within them, and at k = 1 the former is undefined -- which
      is precisely why it was never computed.'
  null_object_control:
    primary_null: The archived i.i.d. null standard deviations already used to set each band.
      The deliverable is the RATIO between-instance / i.i.d. per statistic. A ratio of 1 vindicates
      every existing band; a ratio of 4 means the detection floors are wrong by a factor of sixteen
      in variance, which is the decision's own phrasing.
    secondary_nulls:
    - 'REGRESSION: the first of the k instances must reproduce the committed single-instance value
      for each statistic, or the pipeline has drifted.'
  assumptions:
  - Fresh curve instances at bits 16 and 20 are generable deterministically from declared seeds,
    which the harness already does.
  - The ten-minute cost estimate in DEC-20260801-014 is approximately right; if it is wrong by
    an order of magnitude that is reported, not absorbed.
  predictions:
  - metric: between-instance SD / i.i.d. SD, per banded statistic
    direction: higher
    minimum_effect: Any ratio stably above 1.5 invalidates the corresponding band as currently
      stated.
  minimal_test:
    design: k = 20 fresh instances per cell at bits 16 and 20; identical pipeline; report the
      ratio per statistic with the single-instance regression.
    controls:
    - archived i.i.d. null SDs
    - single-instance regression
    required_metrics:
    - between-instance SD per statistic
    - the ratio to i.i.d. SD
    - re-scoped detection floor for each affected evidence record
  falsification_conditions:
  - 'Ratio ~1 for every statistic: the bands are right and four evidence records keep their stated
    strength, which is a genuine and valuable negative.'
  - 'Ratio well above 1 for any statistic: every band built on it must be restated, and the affected
    evidence records are re-scoped by supersession, never by edit.'
  - 'The pipeline does not reproduce its own single-instance values: the defect is drift, not
    variance, and that is a different and more urgent finding.'
  confounders:
  - Curve instances differ in group order, which changes some statistics mechanically; report
    order-normalised statistics alongside raw ones.
  - Twenty instances gives a variance estimate with its own wide CI; report the CI.
  - Bits 16 and 20 may behave differently; do not pool.
  interpretation_limits:
  - This measures the instrument, not the mathematics. It supports no claim about ECDLP.
  - Re-scoping existing evidence records is a Coordinator act; this record supplies the measurement,
    not the transition.
  heuristic_assumptions:
  - id: HEUR-IVAR-1
    statement: Between-instance variance measured at bits 16 and 20 is indicative at other sizes
      in the same lane.
    rigorous_support: None.
    validation_plan: Report both sizes separately and refuse to pool.
  target_complexity:
    time_exponent: n/a
    memory_exponent: n/a
    best_known: n/a -- no attack
    hidden_overhead: n/a
    tradeoff_note: n/a
  dominated_by: n/a (no result claimed; instrument variance measurement)
  sota_delta: No attack; measurement-integrity contribution only. Re-scopes four evidence records.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 0.95 that the control runs inside budget. 0.6 that at least one statistic
    shows a between-instance SD more than 1.5x its i.i.d. SD -- curve-to-curve variation in these
    quantities is expected on general grounds and the campaign has never bounded it. 0.25 that
    the effect is large enough to change the sign of a committed reading, which is the outcome
    that would matter most.
