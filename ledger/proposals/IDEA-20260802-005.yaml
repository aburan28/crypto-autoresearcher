idea:
  id: IDEA-20260802-005
  question_id: RQ-ECDLP-002
  title: >-
    Control - the orbit-representative cost gate kills or bounds the endomorphism lane
    in one afternoon, because a group action of order r buys sqrt(r) and costs r
  class: control
  claim: >-
    H-ENDO-001 stands `approved` WITH NO EVIDENCE. This control decides it cheaply and
    in both directions. For a prime-order subgroup <P> of E(F_p) with an efficiently
    computable endomorphism acting as multiplication by lambda of multiplicative order
    r modulo n, Pollard rho on the quotient by <lambda> visits r-element orbits and
    therefore reduces the effective search space by r, giving a sqrt(r) speedup IF AND
    ONLY IF a canonical orbit representative can be computed in O(1) group operations.
    When the representative requires enumerating the orbit, each walk step costs r
    scalar multiplications by lambda, so the CHARGED-UNIT cost ratio against plain rho
    is r / sqrt(r) = sqrt(r) >= 1 and the method is strictly WORSE than plain rho for
    every r >= 2. CLAIM, IN MEASURED CHARGED UNITS AND NOT WALL CLOCK - (i) on a
    FREE-REPRESENTATIVE calibrator, where the representative is supplied by a
    precomputed table so it costs O(1), the measured ratio cost_orbit / cost_plain is
    at most 1.15 / sqrt(r) at r in {2, 3, 6, 16, 128}; (ii) on a REAL endomorphism orbit
    with r >= 100 and no O(1) representative, the measured ratio is at least
    0.85 * sqrt(r), i.e. at least 8.5 at r = 100; and (iii) the crossover r* below which
    the real orbit still beats plain rho is at most 6, which is exactly the classical
    automorphism-quotient regime and NOT a new result. FALSIFIED if a real
    endomorphism-derived orbit at r >= 100 yields a measured charged-unit ratio below
    0.5 - which would be the first non-constant-factor endomorphism gain in this program
    and would require independent review before being described as anything.
  mechanism: >-
    The classical automorphism-quotient speedup is sqrt(|Aut|), bounded by sqrt(6),
    because |Aut| <= 6 over a prime field and the representative of an orbit of size at
    most 6 is a min over at most 6 cheap evaluations - effectively O(1). The temptation
    the endomorphism lane keeps re-encountering is that a CM or GLV endomorphism gives a
    much larger r, and therefore a much larger sqrt(r). The obstruction is that the rho
    walk must be well defined on the quotient, which requires a canonical representative
    of each orbit at every step, and the only general way to canonicalize an orbit of
    size r is to generate it - r applications of lambda - and take the minimum under some
    total order. The saving and the cost then have the same generator and the cost wins.
    THIS IS A NAMED OBSTRUCTION WITH A MECHANISM, WHICH IS WHAT A CLOSURE REQUIRES, and
    it is measurable rather than merely arguable, because the free-representative
    calibrator separates the two effects experimentally - it supplies the sqrt(r) saving
    WITHOUT the r cost, so the harness demonstrably CAN see the gain when the gain is
    real. That calibrator is the whole design. Without it, a measured ratio of sqrt(r)
    would be indistinguishable from a harness that cannot see orbit reduction at all,
    which is instrument failure 5 exactly - a statistic no rung of its own ladder can
    move.
    THE CONTROL DISCRIMINATES THREE EXPLANATIONS.
    (a) CALIBRATOR SHOWS 1/sqrt(r) AND REAL ORBIT SHOWS sqrt(r) - the obstruction is the
    representative cost, it is confirmed by measurement, and the endomorphism lane is
    CLOSED at constant-factor sqrt(|Aut|) with forward guidance naming what remains.
    (b) CALIBRATOR FAILS TO SHOW 1/sqrt(r) - the harness cannot see orbit reduction at
    all and NOTHING is read about the real orbit. Instrument outcome.
    (c) REAL ORBIT SHOWS A GAIN AT LARGE r - some representative is cheaper than orbit
    enumeration for that lambda, which would be a genuine finding about that family and
    is exactly the outcome the campaign should want to be able to detect.
  novelty_status: adaptation
  novelty_screen:
    screened_on: '2026-08-02'
    corpus_paths_grepped:
    - ledger/proposals
    - ledger/hypotheses/H-ENDO-001.yaml
    - ledger/decisions
    grep_results:
    - >-
      IDEA-20260727-008 and IDEA-20260727-005 both use the classical
      automorphism-quotient constant r = 3, measured at 2.62 to 3.20x, as a CALIBRATION
      for other claims. Neither isolates the REPRESENTATIVE-COMPUTATION COST as the
      decision variable, and neither runs a free-representative calibrator at large r.
      That separation is this record's contribution.
    - >-
      IDEA-20260727-001 records that generic prime-field curves have only the trivial
      automorphism group, which is the boundary condition this control measures against.
    - >-
      H-ENDO-001 stands `approved` with no evidence recorded anywhere in ledger/evidence.
    literature_verified: []
    conclusion: >-
      Adaptation. The sqrt(|Aut|) speedup and its dependence on cheap canonicalization
      are classical; making the representative cost the measured decision variable, with
      a free-representative calibrator at large r, is not found in the corpus.
  assumptions:
  - >-
    Toy prime-field curves with prime-order subgroups; public parameters; no live keys.
    Discrete logarithms ARE solved here (that is the measurement) and every solve carries
    an independently re-verified certificate per docs/claims-and-verification.md.
  - >-
    Costs are CHARGED UNITS - counted group operations and counted field operations -
    and never wall clock. DEC-20260801-003 recorded a 116.5x disagreement between a wall
    proxy and the same run's charged ledger; that is the reason for this assumption and
    it is not negotiable in this design.
  - >-
    An r-element group action with an O(1) representative EXISTS as a construction on a
    generic cyclic group; if it cannot be built the calibrator fails and the experiment
    is not run.
  predictions:
  - metric: calibrator_cost_ratio_at_r
    direction: lower
    minimum_effect: >-
      'cost_orbit / cost_plain <= 1.15 / sqrt(r) at r in {2, 3, 6, 16, 128}, i.e.
      <= 0.813 at r = 2 and <= 0.102 at r = 128. THIS IS THE DEMONSTRATION THAT THE
      LADDER MOVES THE STATISTIC and it is blocking - if it fails, nothing else is read.'
  - metric: real_orbit_cost_ratio_at_large_r
    direction: higher
    minimum_effect: >-
      '>= 0.85 * sqrt(r) at r >= 100, i.e. >= 8.5 at r = 100. The claim is that the real
      orbit is WORSE than plain rho by a growing factor, which is the opposite direction
      from the one the lane hopes for and is therefore a prediction that can embarrass
      this record if wrong.'
  - metric: crossover_r_star
    direction: same
    minimum_effect: >-
      'r* <= 6. If the measured crossover exceeds 6 on any tested curve family, the
      classical bound is not the operative one there and that family is worth a
      follow-on.'
  - metric: null_ratio_at_r_equals_1
    direction: same
    minimum_effect: >-
      '1.000 +- 0.02. The identical code with a trivial orbit must reproduce plain rho.
      A departure is a calibration bug and voids everything.'
  - metric: representative_cost_share
    direction: increasing
    minimum_effect: >-
      'The fraction of charged units spent inside representative computation must rise
      monotonically with r on the real-orbit arm and must stay below 0.05 on the
      calibrator arm at every r. This is the direct measurement of the OBSTRUCTION
      ITSELF rather than of its consequence, and it is what makes the closure a mechanism
      rather than a correlation.'
  minimal_test:
    design: >-
      Toy prime subgroups of order n in {2**24, 2**28, 2**32}. Four arms sharing one
      walk implementation and one charged-unit ledger - (A) plain rho with negation, the
      standing baseline; (B) the FREE-REPRESENTATIVE calibrator, an artificial r-element
      action on Z/nZ whose orbit minimum is read from a precomputed table in O(1);
      (C) the REAL endomorphism orbit with the representative computed by enumerating
      the orbit, at r in {2, 3, 6} where an automorphism supplies it and at r >= 100
      where a GLV-style lambda does; (D) the r = 1 null. Twenty solved instances per
      cell, each certified. Report charged units, the representative-cost share, and
      matched BSGS on the memory axis.
    controls:
    - >-
      FREE-REPRESENTATIVE CALIBRATOR (arm B), BLOCKING AND RUN FIRST. It supplies the
      saving without the cost and proves the harness can see a sqrt(r) gain.
    - >-
      r = 1 NULL (arm D), which must reproduce plain rho exactly.
    - >-
      MATCHED PLAIN RHO WITH NEGATION and MATCHED BSGS, mandatory baselines under
      RQ-ECDLP-002's constraints.
    - >-
      CHARGED-UNIT LEDGER shared by all four arms, with the table-build charge amortized
      identically across arms - the amortization asymmetry is exactly what produced the
      116.5x artifact at BATCH-020 and it is closed here by construction.
    - >-
      CERTIFICATE CONTROL - every claimed solve independently re-verified.
    required_metrics:
    - charged units to solve, per arm per cell, with intervals over 20 instances
    - representative-cost share of charged units, per arm per r
    - measured crossover r*
    - matched rho and BSGS baselines on the same instances
    - certificate verification fraction (must be 1.0)
    - wall clock recorded for information only and explicitly excluded from every ratio
  falsification_conditions:
  - >-
    'N1 - the calibrator does not reach 1.15/sqrt(r) at r >= 16: THE HARNESS CANNOT SEE
    ORBIT REDUCTION and no reading is taken about the real orbit in either direction.
    Instrument outcome, not a mathematical one.'
  - >-
    'N2 - the real orbit at r >= 100 gives a ratio below 0.5: the obstruction as stated
    is wrong for that lambda, the lane REOPENS, and the result requires independent
    review before being characterized. This is the outcome that makes the control worth
    running rather than assuming.'
  - >-
    'N3 - the expected outcome, calibrator at 1/sqrt(r) and real orbit at sqrt(r): the
    endomorphism lane is closed at constant-factor sqrt(|Aut|) FOR THE TESTED FAMILIES
    AND REPRESENTATIVE CONSTRUCTION, with the named obstruction and this forward
    guidance - what remains open is orbit families admitting an O(1) canonical form
    without enumeration, which is a REPRESENTATION question (is there a cheap total
    order on the orbit, or a cheap invariant that selects a representative) and not an
    endomorphism question, and it connects to IDEA-20260802-002''s object meter, where
    such an invariant would appear as a projection with b = 1 and L = log2(r).'
  - >-
    'N4 - the r = 1 null departs from plain rho: calibration bug, everything void.'
  confounders:
  - >-
    A GLV lambda gives a 2-dimensional scalar decomposition, which is a DIFFERENT and
    genuine speedup (shorter scalars) unrelated to orbit quotienting. The arms must not
    conflate them - arm C measures orbit quotienting only, and any decomposition speedup
    must be disabled in all arms or enabled in all arms, stated in the contract.
  - >-
    Distinguished-point parameters interact with orbit size, because orbits change the
    effective walk. The distinguished-point rate must be held fixed in EFFECTIVE space,
    not in raw space, or arm C is handicapped by an artifact.
  - >-
    Curves with j = 0 or j = 1728 have extra automorphisms and are not generic; the panel
    must include both special and generic curves and report them separately.
  interpretation_limits:
  - >-
    THIS CANNOT MOVE AN EXPONENT AND THE CLAIM IS THAT NOTHING IN THIS LANE CAN. The
    entire content is that the lane is constant-factor by a nameable mechanism. Saying so
    with a measurement is worth more than leaving H-ENDO-001 `approved` with no evidence
    for a twenty-eighth batch.
  - >-
    Toy sizes only. A constant-factor result measured at n = 2**32 is a constant-factor
    result; constants do transfer more readily than exponents, but the representative-cost
    share is implementation-dependent and its transfer is asserted for no p.
  - >-
    The closure, if it fires, is scoped to the tested lambda families and to
    enumerate-and-minimize canonicalization. It is NOT an impossibility claim about
    endomorphism-based cryptanalysis.
  heuristic_assumptions:
  - id: HEUR-ORB-1
    statement: >-
      A rho walk on the quotient by an r-element group action, with a correctly
      canonicalized representative, behaves as a random walk on a set of size n/r, so its
      expected step count is 0.886 * sqrt(n/r).
    rigorous_support: >-
      The classical analysis of Pollard rho with the automorphism quotient
      (Duursma-Gaudry-Morain / Gallant-Lambert-Vanstone line; attribution UNVERIFIED in
      this session and a KN-LIT entry is owed). The known failure mode is fruitless
      cycles, which the contract must address explicitly.
    validation_plan: >-
      MEASURED ON THE CALIBRATOR ARM, where the representative is free and the predicted
      step count 0.886*sqrt(n/r) is a POINT PREDICTION - measured mean steps must lie
      within 15 percent of it at every r. Fruitless-cycle incidence is counted and
      reported separately, because a fruitless-cycle escape mechanism is itself a cost
      that must be charged. TOY SCALE.
  target_complexity:
    time_exponent: >-
      1/2, UNCHANGED, ON EVERY BRANCH THIS RECORD EXPECTS. The orbit quotient changes the
      constant from 0.886 to 0.886/sqrt(r) at best and to 0.886*sqrt(r) at worst; the
      exponent is untouched in both directions. This is stated as a limitation and as the
      reason the lane is not target-class.
    memory_exponent: O(1) for rho arms; sqrt(n) for the matched BSGS baseline.
    best_known: >-
      Pollard rho with negation at 0.886*sqrt(N)/sqrt(2) group operations, O(1) memory.
      The classical automorphism quotient improves the constant by at most sqrt(6).
    hidden_overhead: >-
      Representative computation, fruitless-cycle escapes, and the distinguished-point
      bookkeeping. All three are charged explicitly here; the lane's history in this
      corpus is that they are not.
    tradeoff_note: >-
      None new. van Oorschot-Wiener parallelization applies unchanged to all arms and the
      orbit quotient neither helps nor hinders it.
  dominated_by: >-
    Pollard rho with negation dominates every arm of this experiment on time at equal
    memory unless prediction (i) holds at a real orbit, which this record predicts it does
    not. BSGS dominates on time at sqrt(N) memory. The preprocessing frontier
    (ST**2 = Omega(epsilon N), Corrigan-Gibbs and Kogan, EUROCRYPT 2018, confirmed by
    search 2026-08-02) and the multi-target frontier (sqrt(LN), Kuhn and Struik, SAC
    2001, confirmed by search) both dominate any constant-factor rho variant in their
    respective models. All four rows checked; `null` is not available and is not written.
  sota_delta: >-
    Expected delta is ZERO on the exponent and NEGATIVE on the constant for large r - the
    honest prediction is that the real-orbit arm is 8.5x SLOWER than plain rho at r = 100.
    The deliverable is a decision about a lane, not a speedup.
  instrument_failure_guards:
    decision_variable: >-
      cost_orbit / cost_plain in charged units, and the representative-cost share.
    what_would_make_it_vary: >-
      r, directly and monotonically, in OPPOSITE DIRECTIONS on the two arms - down as
      1/sqrt(r) on the free-representative calibrator and up as sqrt(r) on the real orbit.
      That opposition is the design's whole discriminating power, and it means a harness
      that returns the same curve on both arms is broken in a visible way.
    power_against: >-
      Representative-cost-dominated orbit quotienting at the tested r values and curve
      families, in charged units.
    no_power_against: >-
      Scalar-decomposition speedups (deliberately excluded); endomorphism uses outside
      rho, such as in relation collection or in an isogeny transfer (IDEA-20260731-008's
      lane, untouched); quantum walks; anything at cryptographic n.
    demonstrated_movement: >-
      BY MEASUREMENT AND IN TWO DIRECTIONS - the calibrator arm must move the statistic
      down as r rises and the real arm must move it up. Both are measured before any
      closure is written, and the blocking order (calibrator first) makes it impossible
      to read the real arm through a harness that cannot see the effect.
    lessons_addressed: >-
      Lesson 5 directly - the ladder is r and the statistic is the cost ratio, and the
      free-representative calibrator is constructed precisely so that the ladder CAN move
      the statistic. Lesson 1 - the ratio is measured in charged units, not derived from
      sqrt(r). Lesson 4 - the calibrator is a perturbation that provably creates the
      effect it certifies against.
  estimated_cost:
    implementation: low
    compute: low
  compute_budget_note: >-
    Twenty certified solves per cell at n <= 2**32 is under an hour on one core with rho.
    The largest cost is arm C at r >= 100, which is predicted to be about 8.5x plain rho
    and must therefore carry a hard cap; a cap hit at large r is CONSISTENT WITH THE
    PREDICTION and must be recorded as a censored solve with its charged units at the cap,
    never as a timeout that is silently dropped.
  recommended_priority: high
  dependencies:
  - >-
    IDEA-20260802-007's charged-unit library is the natural implementation substrate but
    is not blocking; this experiment can carry its own ledger if 007 has not landed, at
    the cost of duplicating the accounting.
  proposed_by: idea-generator
