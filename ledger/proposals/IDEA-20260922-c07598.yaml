  citation_note: >-
    Everything in (A) after "Write q = 2^16" is derived here from the cited
    audited facts and standard finite-field theory (F_{q^k}-rational points
    are fixed by the q^k-power map; the minimal polynomial of Frobenius on a
    prime-order subgroup is the reduction of T^2 - tT + q). The
    "ord(mu) = k exactly because k is prime and mu != 1" step is elementary
    group theory (an element of order dividing a prime k is either trivial or
    of order k) applied to a fact (mu != 1) that is itself a restatement of
    6cf862's result, not re-derived independently. No script was run; this
    session has no execution tool.
  assumptions:
    - k an odd prime, q = 2^16; r prime with gcd(r, h) = 1 (audited, all five rows).
    - >-
      A3, THE ONE OPEN ITEM. Aut(E) as an abstract curve automorphism group
      (over the algebraic closure, or over F_{q^k}) is Z/2 -- i.e. the
      hyperelliptic involution is the ONLY automorphism beyond the identity
      -- for each of the five specific curves. This is the standard situation
      for an ORDINARY (non-supersingular) binary elliptic curve
      y^2 + xy = x^3 + a x^2 + b with a != 0 (recalled, not re-derived here:
      the automorphism group of such a curve is generically {id, [-1]}, with
      larger groups occurring only for special j-invariants, notably the
      supersingular j = 0 curve in characteristic 2, which none of these five
      is, being ordinary subfield curves with nonzero trace). c2pnb208w1 has
      a = 0 (A = 0 in the audit's coefficient naming) and is flagged as the
      row needing explicit verification, since a = 0 is exactly the kind of
      special coefficient value that sometimes carries extra automorphisms;
      this record does NOT verify it and states so as the falsification-
      relevant gap.
    - Arithmetic only at deployed parameters; the executable arm is toy subfield cells with dk <= 41.
  proof_search_map:
    bottleneck: >-
      Whether Aut(E) is exactly Z/2 (assumption A3) for these five curves,
      and specifically for c2pnb208w1 (a = 0). Given that, the order-2k
      derivation in (A) is unconditional group theory on audited inputs.
    baseline_embedding:
      parameter_slice: >-
        k = 1 (E over F_q itself, not attacked over an extension) must return
        symmetry group order 2 (negation only, pi_q trivial on E(F_q)),
        reproducing plain unaccelerated rho. This is the reproduction check
        for the formula, not a claim about any of the five curves (none has
        k = 1).
      reproduction_check: >-
        SYMBOLIC, ZERO COMPUTE. Set k = 1 in "ord(mu) = k" -> ord(mu) = 1,
        symmetry group order 2 * 1 = 2, matching plain rho with negation.
        Separately, KN-LIT-096's ECC2K-130 figure (2^60.9, cited by
        IDEA-20260922-d11575 and IDEA-20260922-6cf862's H-6cf862-2 as the
        reproduction target for the SAME 0.886 sqrt / sqrt(class size)
        convention with class size 2 * 131 = 262 on that different, q = 2,
        n = 131 object) is the standing reproduction check for the
        CONVENTION; this record's contribution is the "2k" input to that
        convention on these five rows, not the convention's own numeric
        validation, which was performed by the records cited.
    observation_collision:
      observable: >-
        ord(mu) (an integer dividing k, hence 1 or k) and the presence/
        absence of the pi_2-conflation error in a downstream record's stated
        symmetry group.
      distinct_preimage_search: >-
        ord(mu) = 1 and ord(mu) = k are the only two possibilities given k
        prime; ord(mu) = 1 is exactly the excluded case (G subset of E(F_q)),
        already certified false by 6cf862, so the collision is resolved by a
        citation, not a new measurement, on the deployed rows. On a TOY
        analogue with COMPOSITE k' the collision is real and is the positive
        control below.
      distinct_preimage_search_note: >-
        A downstream record's stated symmetry-group order 32k versus 2k is
        the deliberately named collision this record exists to break: both
        numbers are superficially plausible group-order statements about
        "the same curve," and only the endomorphism-versus-Galois-conjugate-
        action distinction in (B) separates them.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The <pi_q, [-1]>-orbit of a point in G, canonicalised by minimum
          over 2k explicit conjugates/negatives.
        predicted_gain: >-
          Rho step count divided by sqrt(2k); no exponent movement (this is
          F1, walk-collision, unchanged trichotomy).
    quantifier_order: >-
      FOR EACH of the five curves, ord(mu) = k, unconditionally given the
      audited gcd(h, r) = 1 and k prime (an equality, not a bound). SEPARATELY,
      FOR ANY record in this lane stating a rho or attack symmetry group
      order on one of these five curves, THAT ORDER divides 2k on the rho
      side (given A3) and the attack side may not exceed <pi_q>'s order k on
      a fixed target instance without a named separate source.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On the five composite-degree ANSI curves, Pollard rho with negation
        and Frobenius classes exploits a group of order exactly 2k (given
        Aut(E) = Z/2), and no single-target attack construction filed in
        this lane may charge itself more symmetry than the same order-k
        subgroup without independent justification." It certifies NOTHING
        about Aut(E) beyond Z/2 x <pi_q> without A3 being independently
        checked, nothing about multi-target or preprocessing symmetry gains
        (out of scope, F7), and nothing about the GHS construction's OWN use
        of the 16-fold curve-conjugation orbit, which is a structural
        ingredient of that different construction (d11575), not a rho gain.
      nearby_object_control: >-
        TWO. (i) PROVES TOO MUCH: apply the same argument to a toy subfield
        cell with COMPOSITE k' (e.g. E/F_{2^4} over F_{2^{4*6}}, k' = 6):
        ord(mu) then divides 6 and may genuinely be 1, 2, 3 or 6, so the
        "ord(mu) = k exactly" conclusion must NOT be reproduced there except
        as a bound -- an implementation that returns "ord(mu) = k'" uncondi-
        tionally at composite k' has proved too much and is wrong. (ii) NULL
        OBJECT: a toy curve over F_{2^{dk}} defined over NO proper subfield
        (a c2tnb-style random curve at matched field size): pi_q is not an
        endomorphism at all (there is no proper base field F_q for it to be
        Frobenius of), <pi_q> does not exist, and the symmetry group is {id,
        [-1]} of order 2 regardless of field size -- any measured advantage
        on this null is an instrument artefact.
    proof_obligations:
      - claim: pi_q restricted to E(F_{q^k}) is an automorphism of the finite group, of order dividing k.
        responsibility: correctness
      - claim: mu != 1 on G (cited from IDEA-20260922-6cf862).
        responsibility: baseline
      - claim: k prime implies ord(mu) in {1, k}, hence ord(mu) = k given mu != 1.
        responsibility: correctness
      - claim: pi_2 is not an endomorphism of any of the five curves, because B is not in F_2 for any of them (cited, "smallest subfield containing B is F_{2^16}").
        responsibility: correctness
      - claim: Aut(E) = Z/2 for each of the five curves (A3, UNVERIFIED, flagged as the open item, especially for c2pnb208w1 with a = 0).
        responsibility: scope
      - claim: The attack-side ceiling (C) is a statement about single-target decomposition systems (a77711 Lemma A2) and about the GHS construction's structural use of the 16-fold orbit being distinct from a per-instance symmetry gain; neither is re-proved here.
        responsibility: scope
