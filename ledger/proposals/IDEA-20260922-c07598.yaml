idea:
  id: IDEA-20260922-c07598
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-22'
  status: proposed
  approved_by: null
  title: >-
    THE RHO SYMMETRY LEDGER FOR THE FIVE COMPOSITE-DEGREE ANSI CURVES: the
    group of automorphisms available to Pollard rho on the prime-order
    subgroup has order EXACTLY 2k, not 2*16*k = 32k, because the base-2
    Frobenius that permutes the 16k Galois-conjugate curves is not an
    endomorphism of any ONE of them -- and the SAME order-k Frobenius is the
    ceiling on what any decomposition- or cover-based attack in this lane may
    charge as a symmetry gain, so the two sides of every comparison in this
    lane are pinned to one number, derived once, here
  class: control
  claim: >-
    SETTING. E/F_{2^16} (audit, analysis/binstd-curve-audit/), attacked over
    F_{2^{16k}}, k in {11,13,17,19,23} prime, G the prime-order subgroup of
    order r (161,193,257,289,353 bits), h the cofactor with h = #E(F_{2^16})
    (IDEA-20260922-6cf862 result A) and gcd(h, r) = 1.

    (A) THE CORRECT GROUP, DERIVED, NOT ASSERTED. Write q = 2^16 and let
    pi_q : (x,y) -> (x^q, y^q) be the F_q-power Frobenius, an ENDOMORPHISM of
    E because A, B in F_q. Restricted to E(F_{q^k}), pi_q^k is the identity
    map on coordinates (F_{q^k}-rational points have coordinates fixed by the
    q^k-power map), so pi_q restricts to an AUTOMORPHISM of the finite group
    E(F_{q^k}), of order dividing k. On G, pi_q acts as multiplication by a
    root mu of T^2 - tT + q modulo r (t the audited subfield trace); mu = 1
    would force G subset of ker(pi_q - 1) = E(F_q)(F_{q^k})-rational points,
    i.e. G subset of E(F_q), contradicting G meet E(F_q) = {O} (6cf862 A, a
    restatement of IDEA-20260906-a77711's lemma). So mu != 1, and because k
    is PRIME the only divisors of k are 1 and k, so ord(mu) = k EXACTLY --
    this is where "k prime" (seam 4 of the lane prompt) does load-bearing
    work: composite k would leave ord(mu) possibly a proper divisor and the
    ledger below would need a case split. Negation (the hyperelliptic
    involution (x,y) -> (x, x+y) on y^2+xy=x^3+ax^2+b) commutes with pi_q
    (both are F_q-rational maps) and has order 2, disjoint from <pi_q> unless
    char(E) forces otherwise (ruled out: negation fixes only 2-torsion, G has
    odd prime order r > 2). THE GROUP <pi_q, [-1]> acting on G therefore has
    order EXACTLY 2k, and this is the FULL group of curve automorphisms
    available, MODULO the open item in assumption A3 below (Aut(E) at the
    curve level, not just at the pi_q-eigenvalue level).

    (B) THE NAMED WRONG ANSWER, AND WHY IT IS WRONG. A natural mistake:
    observe that Gal(F_{q^k}/F_2) has order 16k (generated by the BASE-2
    Frobenius pi_2 : x -> x^2), note it acts on the 16k-element set of
    Galois-conjugate curves {E^{(2^i)}} that the GHS/cover construction
    (IDEA-20260922-d11575) genuinely uses, and conclude "the curve has a
    16k-fold symmetry, times 2 for negation, so rho gains sqrt(32k)." THIS IS
    BACKWARDS. pi_2 is an endomorphism of E(F_{q^k}) as an ABELIAN GROUP MAP
    only if pi_2 fixes E's defining equation, i.e. only if A^2 = A and
    B^2 = B, i.e. A, B in F_2. d11575's own audited fact -- "the SMALLEST
    subfield containing B is F_{2^16} for all five" (cited there from the
    program's audit) -- means B is NOT in F_2 for any of the five curves, so
    pi_2(E) is a DIFFERENT curve E^{(2)} != E for every one of them, and pi_2
    is not a self-map of E(F_{q^k}) at all. The 16k-element Galois orbit is
    an orbit of CURVES, not an automorphism group of ONE curve's rational
    points, and conflating the two overcounts the rho symmetry by a factor of
    16 (giving 32k instead of 2k). The distinction is exactly the one
    IDEA-20260922-d11575's construction depends on for its own correctness:
    the conorm-norm homomorphism there is built FROM the 16k-orbit of curves,
    which is why d11575 needs the conjugate period 16/gcd(c,16), while rho
    here needs only the stabilizer of E itself inside that orbit, which is
    <pi_q> of order k.

    (C) THE CEILING THIS PUTS ON THE ATTACK SIDE. Both a GHS/cover
    construction (d11575) and a decomposition-based one (IDEA-20260906-6da433
    / a77711 / IDEA-20260922-8278db) may exploit AT MOST the same <pi_q>,
    order k, on a FIXED target instance -- the cover construction additionally
    uses the 16-fold curve-conjugation orbit as a STRUCTURAL ingredient of the
    covering object itself (folded into the genus, not into a per-instance
    symmetry gain), and a77711's Lemma A2 already shows a single-target
    decomposition system gets no additional symmetry gain from pi_q beyond
    the orbit-multiplication constant k. No construction in this lane may
    charge itself a bigger symmetry group than rho's without an explicit,
    separately argued source for it (RQ-BINSTD constraint 4: "an index-
    calculus cost that ... beats a baseline stripped of the symmetry the
    attack itself uses is not a result" -- read backwards, an attack quoting
    MORE symmetry than rho's ledger must justify the excess or the comparison
    is void).

    (D) THE NUMBERS, reused verbatim from IDEA-20260922-d11575 (that record's
    citation to this one is discharged here): matched rho
    0.886 sqrt(r) / sqrt(2k) group operations, r taken as 2^{s - 0.5} for an
    s-bit subgroup (the half-bit convention stated, not hidden):
    2^77.9 (c2pnb176v1, k=11), 2^93.7 (c2pnb208w1, k=13),
    2^125.5 (c2pnb272w1, k=17), 2^141.5 (c2pnb304w1, k=19),
    2^173.3 (c2pnb368w1, k=23). This record does not recompute these; it
    certifies the "2k" they depend on and names what would have to be true
    for "32k" (or any other multiplier) to be the right figure instead.
  mechanism: >-
    OBJECT FRAME. Representation: R1 (RQ-ECDLP-623a32), the point on E over
    F_{q^k} together with the endomorphism ring element pi_q acting on it.
    Operation set Sigma for the tracked object (the rho equivalence class of
    a point): {[-1], pi_q} -- the group <pi_q, [-1]> of order 2k, NOT the
    full translation action and NOT the 16k-element curve-conjugation group.
    Trichotomy: this is a QUOTIENT/canonicalisation object (IDEA-20260901-
    863e36's block-system family: Sigma is generated by a subgroup Gamma of
    the automorphism group acting on the point set, here Gamma = <pi_q,[-1]>
    of order 2k, the same family as negation-only and GLV quotients). The
    lossy-projection test: the projection point -> its <pi_q,[-1]>-orbit
    discards which of the 2k conjugates/negatives the point is (log2(2k)
    bits) and IS Sigma-compatible because Sigma is exactly the group being
    quotiented by (IDEA-20260901-863e36's construction, applied verbatim with
    Gamma = <pi_q,[-1]>); it is lossy in the F_{q^k}-coordinate representation
    because distinct orbit elements have distinct coordinates (pi_q acts
    without fixed points on G other than O, shown in (A)). PRICE THE OPEN
    NUMBER: orbit canonicalisation is the minimum over 2k explicitly computed
    conjugates/negatives, i.e. O(k) applications of pi_q (each a q-th power
    map, itself O(log q) field squarings by repeated squaring, or O(1) if
    pi_q is precomputed as a linear map on the normal-basis coordinates as in
    IDEA-20260918-9abf42's frame) plus a comparison -- charged once per rho
    step, standard practice (Wiener-Zuccherato; Gallant-Lambert-Vanstone),
    not re-derived here.

    WHY THIS RECORD IS A CONTROL AND NOT AN ATTACK. It changes no charged
    cost of any attack; it fixes the ONE number (2k) that every cost
    comparison in this lane's reachability table divides by, and it exists
    because the seam explicitly named getting this backwards as a failure
    mode that "voids the comparison." A record that only restates "the
    baseline is rho with the curve's own symmetries" (RQ-BINSTD constraint 4)
    without deriving what those symmetries ARE on these five specific rows is
    not enough to make the backwards mistake impossible; this record supplies
    the derivation, the named wrong answer, and a toy-scale check that can
    catch the mistake mechanically.

    F1 (walk-collision) is the declared component (rho itself); what is added
    beyond "rho with class canonicalisation" is the k-prime argument that
    fixes ord(mu) = k exactly (not merely "divides k"), the audited fact
    (SMALLEST subfield containing B is F_{2^16}) that rules out pi_2 as an
    endomorphism, and the explicit false-positive construction (32k) that a
    reviewer or a later record could otherwise reproduce by accident.
