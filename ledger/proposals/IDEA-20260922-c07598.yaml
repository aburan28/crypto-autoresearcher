      (d, k') in {(4,5), (4,7), (2,13), (8,5)} with k' PRIME (the object) and
      one cell with k' = 6 COMPOSITE at (d, k') = (4,6) (the positive
      control for the trichotomy claim). On each: pick a point P in the
      prime-order subgroup, compute pi_q(P), pi_q^2(P), ... and find the
      smallest j with pi_q^j(P) = P, exactly (exhaustive, no sampling, cells
      are small enough); separately verify pi_2 (if d > 1) does not fix E's
      equation on a random non-F_2 coefficient B. Both are certificate-
      bearing exact computations.
    controls:
      - Composite k' toy cell (positive control for the "exactly k" claim's dependence on primality).
      - Null object: a curve over F_{2^{dk}} not defined over any proper subfield (pi_q does not exist as an endomorphism; symmetry group order 2 regardless of field size).
      - Baseline embedding: k = 1 (or k' = 1) reproduces plain negation-only rho.
      - B chosen inside F_2 as a degenerate control (pi_2 IS then an endomorphism, order-16k orbit genuinely collapses to order-1 for that map, and the named error in (B) becomes CORRECT for that degenerate curve, which the instrument must detect, not just assert).
    required_metrics:
