  minimal_test:
    design: >-
      PART 1 (arithmetic, no run). Verify by hand, for each of the five
      curves: t (audited), h = q + 1 - t (audited), gcd(h, r) = 1 from the
      published r (re-derived from ANSI X9.62, not OpenSSL, per RQ-BINSTD
