idea:
  id: IDEA-20261016-0e002c
  question_id: RQ-XEDN-3bfe2e
  added: '2026-10-16'
  title: >-
    The rank-1 forced slice as an S-unit system: w(B)=w(D)=1 with an
    opposite-sign pair reduces to (c^2-X-Y)^2-4XY=q^e, and a residue hit needs
    about p^4 slice members
  class: measurement
  claim: >-
    Integral opposite-sign cell (hypotheses (i),(ii) of bf8f49), B=+-r^i,
    D=q^e, q prime, e odd. (P1) f_-=q^b=c^2, f_+=q^a, a+b=e (one exponent is
    even): the cell is silent. By IDEA-20261016-3fe347 G1, B=XY with X=x(S), Y=x(S+T), so
    X,Y=+-r^j,+-r^k, A=c^2-X-Y, and the slice is the solution set of
    (c^2-X-Y)^2-4XY=q^{a+b} with 2c | X-Y (s=(X-Y)/(2c)) and Q-existence
    (z-ct)(z+ct)=-(t^2+X)(t^2+Y); equivalently Y=(c^2+X)+-sqrt(D+4c^2X).
    D=(2t^2-A)^2+(2z)^2 forces q=2 or q=1 mod 4. (P2) By rank<=w(B)+w(D)-1=1
    (relayed from round 1; re-derive or replace by exact Selmer sizes), any two
    non-torsion points on a slice curve are dependent mod torsion, so slice
    cells are all dependent; with odd torsion no primitive exact relation need
    exist. (P3) Subfamily X=-1,Y=-r,c=1: A=r+2, B=r, D=r^2+4, s=(r-1)/2,
    r=3,5,7,11 (D=13,29,53,5^3); (A,B)=(-1,16) mod p forces p | 19 (S4).
    Fixture r=11: E=(13,11), S=(-1,1), P=2S=(25,155), Q=(-4,10), U=(1,5) of
    order 3, S+Q=U, so P+2Q=2U and only 3P+6Q=O is exact (gcd 3). (P4)
    Residue-compatible members need X+Y=c^2+1, XY=16 and four reductions of
    (s,w,t,z): under H1 a hit needs about p^4 members.
  mechanism: >-
    Gaussian two-norm identity D=N^2-(2w)^2=M^2+(2z)^2, N=2s^2+A, M=2t^2-A,
    N+M=2(s^2+t^2) (from the two curve equations), plus G1. PAIR:
    representation = factor pair (q^b,q^a) and S-unit pair (X,Y); operation set
    = Z[i] norm factorisation of D and unit equations in {q,r}. TRICHOTOMY:
    partial-action; the slice is a sparse exponential-Diophantine set, finite
    per prime pair (S-unit finiteness, Evertse, recalled). LOSSY-PROJECTION
    TEST: (B,D)->(w(B),w(D)) keeps only prime-divisor counts, and the rank bound
    is a homomorphic Selmer bound, so rank-1 forcing is deterministic.
