  title: >-
    The generic collision floor. Any index-calculus engine that gets its relations only
    as x-key collisions among group elements it computed pays at least (1/2)*sqrt(r*N)
    S_3-units for r independent relations. So the measured mitm exponents at odd m
    ((m+1)/(2m)) are the Kuhn-Struik/Yun batch bound applied to the factor base.
    sigma = 1/2 at precomputation N^{(m+1)/(2m)} is the generic floor, not a baseline
    that structure can "tune" below. The admission gate of IDEA-20260808-812554 has to be
    restated with precomputation charged, in both the single-instance and the
    preprocessing model.
  class: mechanism
  claim: >-
    REPRESENTATION CLASS AND STAGE: R1 of RQ-ECDLP-623a32 (the point is keyed by x in F_p,
    and its sign by a stored y-bit). The stage is relation decomposition, i.e. the cost
    accounting of collision structure. It is not a factor base. It is the admission test
    every KN-OPEN-020 class has to pass.

    (A) LEMMA (generic group model, derivation tier, unreviewed). This is Shoup's
    collision-counting argument (KN-LIT-011, KN-TECH-005) in Yun's multi-instance setting,
    applied to r relations.
    - Setting: G has prime order N. P, Q and the base elements F_1..F_B are independent
      encodings with uniform unknown logs. The base is sampled by an x-predicate, not
      generated from P and Q.
    - Each pair of distinct computed linear forms collides under the x-key (equal or
      negated) with probability <= 2/N. So X computed encodings give at most X^2/N
      expected collisions.
    - Each independent relation needs its own collision.
    - One S_3-unit yields two encodings: the README's charging rule (F+S and F-S from one
      inversion).
    - Therefore E[r] <= 4S^2/N, i.e. S >= (1/2)*sqrt(r*N).
    - With r ~ c_m * |F| and |F| = N^beta, total S_3 >= N^{(1+beta)/2}, which is above
      N^{1/2} for every beta > 0.

    (B) CONSEQUENCES.
    - At beta = 1/m the floor exponent is (m+1)/(2m). This equals the README model
      max(h, m-h+1)/m exactly at odd m (2/3, 3/5, 4/7), so the mitm engine is
      exponent-optimal among generic single-instance engines at odd m.
    - At even m the engine sits a factor N^{1/(2m)} above the floor (m=4: 0.75 vs 0.625;
      m=6: 0.667 vs 0.583). That gap is generic and a generic construction removes it
      (IDEA-20260928-4e2be7).
    - In sigma terms, amortized with precomputation charged: generic sigma >= 1/2 at
      precomputation N^{(m+1)/(2m)}. sigma_MITM = (m-h)/(m-1) equals 1/2 at every odd m.

    (C) CORRECTED ADMISSION GATE, stated in two cost models. It replaces 812554's
    sigma < 1 - 2/(m-1).

    (C1) Single instance, every phase charged. At beta = 1/m, beating rho needs
    sigma < (m-2)/(2(m-1)) AND table/base-log precomputation < N^{1/2}: m=3: 1/4,
    m=5: 3/8, m=7: 5/12. Equivalently, the engine needs a NON-GENERIC relation source
    whose collision-excess factor kappa satisfies kappa > ~r/3, i.e. kappa must grow like
    N^beta. 812554's gate admits m=7 at sigma = 1/2 (beta ~ 0.2); the floor says that
    point costs >= N^{0.6}. 812554's formula charges no table and uses fractional target
    counts when P_dec > 1.

    (C2) Preprocessing model: the table and the base logs are instance-independent
    advice, as in KR-RHO-ea34b8.
    - The online per-target descent T and the advice S (bits) must beat
      S*T^2 = Omega~(N) (Corrigan-Gibbs-Kogan, KN-LIT-013) to be non-generic.
    - Bernstein-Lange (KN-LIT-7cc07f) attains that curve generically with
      precomputation ~1.2*sqrt(S*N).
    - mitm at odd m = 2h-1 sits at T = N^{(h-1)/m}, precomputation N^{h/m} and
      S = N^{h/m}. BL reaches the same T and precomputation with S = N^{1/m}, so mitm
      index calculus is Pareto-dominated by BL in this model at every odd m.
    - The offline relation-collection floor (1/2)*sqrt(r*N) is the same shape as BL's
      precomputation cost. It is new only as the index-calculus instance: neither
      KR-RHO-46c2c6 nor KR-RHO-ea34b8 bounds precomputation cost from below.
    - So a structured proposal claiming an online gain has to beat S*T^2 = N, not merely
      sqrt(N) online.

    (D) FALSIFIABLE NUMERICAL CONTENT. On the committed README rows,
    S_3/((1/2)*sqrt(r*N)) is:
    - flat in N at odd m (slope 0 +- 0.03);
    - rising as N^{1/(2m)} at even m;
    - >= 1 on every row.
    Back-of-envelope from README 32-bit medians, taking r = 0.92|F| at every m and
    N ~ 2^32: m=3 about 1.5-1.7; m=5 about 3.3; m=7 about 6.9; m=4 about 27; m=6 about 25.
    The executor recomputes these per row from the logged relations and the true N.
  mechanism: >-
    OBJECT FRAME.
    - Representation: R1, the x-coordinate key, 2:1 on points (it forgets the sign).
    - Operation set Sigma: translation by the signed factor-base elements (+-F_a), plus
      the target generation aP+bQ that seeds each search.
    - Trichotomy: PARTIAL-ACTION (Class I, IDEA-20260806-c5d183 as summarized in
      docs/object-frame-ideation.md §1). The tracked object is the index-calculus
      relation vector, which propagates deterministically only under translation by
      base elements. Whether a decomposition exists is the branching event, and this
      record prices that event by collisions.

    LOSSY-PROJECTION TEST, against Sigma.
    - What is discarded: the key x(S) discards the sign of S. It is lossy (2:1).
    - Compatibility with Sigma: for any F_a, the unordered pair {x(S+F_a), x(S-F_a)} is a
      function of (x(S), F_a), namely the S_3 fibre. So the key propagates under Sigma as
      a deterministic 2-valued correspondence (branching exactly b=2), and the stored
      y-bit resolves it.
    - Why this matters: the key loses nothing else, which is why its coincidences are
      exactly the engine's relations. The lemma counts those coincidences.

    WHY IT MATTERS FOR THIS LANE.
    - The handoff asks for structure that lowers sigma below sigma_MITM at matched
      precomputation. At odd m that is literally a request to beat a generic lower bound.
    - So any structured proposal must name the step at which it obtains a relation
      WITHOUT paying a birthday collision: an excess of collisions over the random count
      (IDEA-20260928-4e2be7), a representation-decidable lift (IDEA-20260928-fd7f5d,
      H-RELN-41562a), or a non-generic algebraic solve (Groebner/summation-polynomial
      routes, KR-IC-5931ee).
    - Nearby object on which the floor correctly does NOT apply: Gaudry's decomposition
      over F_{q^n} (KR-IC-46d822). Its relations come from solving a fixed-degree
      polynomial system, which is non-generic. With N = q^n and B = q the floor would say
      q^{(n+1)/2}, and Gaudry achieves q^{2-2/n} < q^{(n+1)/2} for n >= 3. The lemma
      therefore identifies the load-bearing structure rather than being vacuously
      negative.
  novelty_status: adaptation
