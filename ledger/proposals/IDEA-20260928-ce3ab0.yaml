  assumptions:
    - The engine uses S_3 only to add two points (README §3 says so explicitly), so every relation it finds is an x-key collision between two encodings it computed.
    - Base points are sampled by x-coordinate, so their logs are independent unknowns (multi-instance access), not linear forms in log Q.
    - r (independent relations needed before k is fixed) is read from each row's logged relation count; 0.92|F| at m=3 is the README value.
    - Toy scale only (12..32 bits). No claim about any deployed curve.
  proof_search_map:
    bottleneck: relations obtained per computed encoding (the collision rate), not the S_3 solve itself.
    baseline_embedding:
      parameter_slice: >-
        Three slices.
        - r = 1 gives S >= (1/2)*sqrt(N), Pollard rho's birthday floor (KR-RHO-13bf67,
          x-key, negation folded).
        - m odd with beta = 1/m reproduces the README model's exponent exactly.
        - In the preprocessing model, S = N^{1/m} with T = N^{(h-1)/m} is the
          Bernstein-Lange point (KR-RHO-ea34b8) that dominates mitm at the same T.
      reproduction_check: >-
        Symbolic: (m+1)/(2m) = max(h, m-h+1)/m at h = (m+1)/2 for m = 3, 5, 7. Also
        N^{1/m}*(N^{(h-1)/m})^2 = N when m = 2h-1, i.e. BL sits on the CGK curve at
        mitm's online time. Numeric: the Stage 0 re-analysis of the committed JSONL rows,
        frozen as a regression.
    observation_collision:
      observable: the ratio S_3 / ((1/2)*sqrt(r*N)) per run
      distinct_preimage_search: >-
        Two engines can share the ratio and differ in memory or advice: the h-table vs a
        harvest-all engine at the same S, and mitm vs BL at the same online T. So the
        ratio certifies time only, and memory and advice are reported separately. Two
        bases can share the ratio and differ in coverage: random vs small_x at matched
        |F| (README: within 7%). The ratio is blind to yield redistribution, consistent
        with KN-FIND-007.
    constructive_transforms:
      - transform: baseline_boundary_lift
        proposed_object: The birthday collision count, lifted from one relation (rho, KR-RHO-13bf67) to r relations (index calculus); this is the multi-instance form behind KR-RHO-46c2c6.
        predicted_gain: None as an attack. As a screen, every structured proposal must exhibit collision excess kappa ~ N^delta (single-instance model) or beat S*T^2 = N (preprocessing model); the exponent gain is exactly delta/2.
    quantifier_order: >-
      (i) SINGLE-INSTANCE. FOR ALL generic engines A (access = group operations plus
      x-key equality tests; base points are independent uniform unknowns), FOR ALL
      m, beta, h and FOR ALL N:
      E[#independent relations after S S_3-units] <= 4S^2/N * (1+o(1)).
      THEREFORE there EXISTS NO generic A with total S_3 < (1/2)*sqrt(r*N)*(1-o(1)). The
      constant depends on two declared conventions, both fixed in the contract: 2 points
      per x-key, and 2 encodings per S_3-unit.
      (ii) PREPROCESSING. FOR ALL generic A that split into an instance-independent
      offline phase (table plus base logs) and an online descent, with advice S bits and
      online time T: S*T^2 >= Omega~(eps*N) (CGK, cited, not re-derived here), AND the
      offline phase that yields r relations costs >= (1/2)*sqrt(r*N) by (i). Both
      clauses are witness-free universals. The preprocessing-model domination of mitm
      by BL is an EXISTS statement: the BL table exhibits it.
    method_ceiling:
      strongest_certifiable_claim: >-
        A GGM derivation plus a toy-scale check. The check shows the implemented engine
        at a constant multiple of the floor at odd m and at N^{1/(2m)} times the floor at
        even m, with its preprocessing position read against the CGK curve. It says
        nothing about non-generic engines, which is its purpose.
      nearby_object_control: >-
        Gaudry over F_{q^n} (KR-IC-46d822), where the floor is beaten because relations
        come from polynomial-system solving. BL tables (KR-RHO-ea34b8) are the generic
        object that attains the preprocessing curve which mitm misses on advice. A
        structured base whose measured ratio falls below 1 is a detected non-generic
        effect or an accounting error. Either outcome is a headline.
    proof_obligations:
      - claim: pairwise collision probability of distinct adaptive linear forms is <= 2/N under the x-key
        responsibility: correctness
      - claim: each independent relation consumes a distinct collision
        responsibility: size
      - claim: one S_3-unit = two encodings in the engine's charging
        responsibility: interface
      - claim: odd-m mitm exponent equals the floor exponent
        responsibility: baseline
      - claim: mitm's (S, T, precomputation) is Pareto-dominated by BL at every odd m
        responsibility: baseline
      - claim: the lemma does not apply to Groebner or structured-predicate engines
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: slope in log2 N of log2(S_3/((1/2)*sqrt(r*N))), per (m, base), on the committed rows
      direction: different
      minimum_effect: odd m within [-0.03, +0.03]; m=4 within 0.125 +- 0.03; m=6 within 0.083 +- 0.03
    - metric: min over all committed rows of S_3/((1/2)*sqrt(r*N))
      direction: higher
      minimum_effect: '>= 1.0 on every row; any row < 1 is flagged individually'
    - metric: the same ratio for random vs small_x vs subgroup at m=3, matched |F|
      direction: different
      minimum_effect: bootstrap intervals overlap (the floor is base-independent for generic engines)
    - metric: fitted exponent of total S_3 at m=5, |F| = ceil(N^0.24), h=3, over 16..32 bits
      direction: higher
      minimum_effect: '>= 0.62 (floor); engine model about 0.72; IDEA-20260808-812554 predicts about 0.52. An interval excluding 0.52 decides against 812554.'
  minimal_test:
    design: >-
      STAGE 0 (zero new compute).
      - Rows: every committed row of results/sweep-mitm-20260926, sweep-arity-20260926,
        sweep-minfill-20260926, sweep-arity-minfill-20260926 and sweep-arity67-20260928.
      - Per row, compute: X = 2*s3_solves; r = logged relations; the true N;
        ratio = s3_solves/((1/2)*sqrt(r*N)); the table/search split; and
        rho_ratio = walk/(0.886*sqrt(N)).
      - Fit the ratio slope per (m, base) with the existing stats.py stratified
        bootstrap.
      STAGE 1 (new cells, existing CLI).
      - Command: `solve --m 5 --table-arity 3 --fb-size ceil(N^0.24) --engine mitm`.
      - Grid: 16, 18, ..., 32 bits; 5 curves; fb in {small_x, random, subgroup}, with
        --subgroup-prime so that all three share curves and |F|.
      - Comparison: the same curves at the default |F|, whose per-target S_3 goes in the
        column next to these.
      - Report per-target S_3, total S_3, table S_3, relations, and the ratio to the
        floor.
      - Rho control: 10 curves per size from the same sweep.
      - A small --fb-size pass-through to `sweep` may be needed. That is a CLI change,
        not a solver.
    controls:
      - matched random base at identical |F| on identical curves (generic null)
      - Pollard rho walk on the same curves (cost control; its ratio to 0.886*sqrt(N) is reported as the floor's r=1 slice)
      - default-|F| mitm on the same curves (baseline embedding)
      - integer-exact recomputation of s3_solves from table_s3_solves + search to catch charging drift
    required_metrics:
      - per row ratio S_3/((1/2)*sqrt(r*N)) and its slope in N per (m, base)
      - per-target S_3 at nondefault |F| next to default-|F| mitm
      - total S_3 exponent at m=5, beta=0.24, with 95% CI
      - rho walk/(0.886*sqrt(N))
      - peak RSS per 32-bit cell
  falsification_conditions:
    - Any committed row with ratio < 0.9 means the lemma, its constants, or the charging convention is wrong. Everything downstream is paused until that is resolved.
    - An odd-m ratio slope interval that excludes 0 means the engine is not floor-optimal at odd m, and the identity (B) fails.
    - An even-m slope interval that excludes 1/(2m) means the even-m gap explanation fails.
    - A Stage 1 exponent interval containing 0.52 and excluding 0.62 is below the floor, which contradicts the lemma. Treat it as a charging error until audited.
  confounders:
    - The early-stop rule makes r depend on the run. Use the logged r, never c_m*|F|.
    - The reachability/ordering rules in tails.py discard some matches, which lowers the achievable constant (about 0.46 at m=3, estimated from README medians). That raises the ratio but not its slope.
    - Lower-order terms at 12-16 bits; slopes are fitted on 20..32 bits as a sensitivity check.
    - S_3-units and rho walk additions are different units (README §1). The comparison is in exponents plus a declared unit ratio.
  interpretation_limits:
    - Derivation tier in the GGM, unreviewed. It is not a lower bound on ECDLP and not a statement about non-generic engines.
    - Toy scale, 12..32 bits. The generated curves are not standardized curves.
    - KN-OPEN-020 class - not a factor base. It is the admission gate every class (high-degree, implicit-membership, target-dependent) must beat, via a named non-generic step.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For the mitm engine on prime-order E/F_p with an x-defined base, the x-key
        coincidences among computed encodings are distributed as for independent uniform
        group elements: the count is Poisson with mean X^2/N, up to the engine's
        deterministic ordering constant.
      rigorous_support: >-
        Proven: in the GGM, distinct adaptive linear forms in independent uniform logs
        collide with probability <= 1/N per pair (Schwartz-Zippel on degree 1), doubled
        by the x-key. Imitated: birthday statistics for uniform samples (Poisson
        collision counts).
      validation_plan: >-
        Sample: every Stage 0 row (about 600 instances, 12..32 bits, m=3..7). Compare the
        per-instance match counts, normalised by X_table*X_search*2/N, against Poisson by
        KS at 1%. Tails: max ratio per rung against the Poisson max order statistic, and
        the fraction of rows with ratio < 1 (predicted 0). Transfer: none beyond 32 bits.
    - id: H2
      statement: The relation count needed to fix k is r = c_m*|F|*(1+o(1)), with c_m stable across 20..32 bits at each m.
      rigorous_support: >-
        Counting bound: r >= rank needed. Imitated: the random sparse-matrix rank
        heuristic (812554 HA-1; f89eaf H1).
      validation_plan: 'Read r/|F| from the rows per (m, bits); require a slope in log N within +-0.03; report the corank staircase where logged.'
    - id: H3
      statement: At m=5, |F| = N^0.24, per-target decomposition counts are Poisson with mean C(B+4,5)/N (KN-FIND-007 mean, random-base dispersion).
      rigorous_support: KN-FIND-007 fixes the mean exactly; the Poisson shape is the random-base null of H-RELN-41562a.
      validation_plan: 'In Stage 1, log per-target decomposition counts for 200 targets per cell; chi-square against Poisson; report the dispersion index.'
  target_complexity:
    time_exponent: 'Floor N^{(1+beta)/2} S_3-units for any generic engine; (m+1)/(2m) at beta=1/m. No algorithm is proposed.'
    memory_exponent: 'Attaining engine: N^{h*beta} table (mitm) or N^{(1+beta)/2} (harvest-all). The floor constrains time only.'
    best_known: >-
      Single instance: Pollard rho 0.886*sqrt(N) group operations, O(1) memory
      (KR-RHO-13bf67); Kuhn-Struik sqrt(2LN) for L logs (KR-RHO-46c2c6).
      Preprocessing: Bernstein-Lange 1.77*N^{1/3} online after 1.24*N^{2/3} with an
      N^{1/3} table, on the CGK S*T^2 = N curve (KR-RHO-ea34b8).
    hidden_overhead: >-
      The constant depends on the x-key and charging conventions, and on the ordering
      constant (about 0.46 at m=3). The GGM idealises the base as independent uniform
      points; x-structured bases can depart from that, and measuring that departure is
      IDEA-20260928-4e2be7. CGK's S counts bits: the log N factor per stored entry is not
      tracked.
    tradeoff_note: >-
      The floor is a product constraint. For bipartite engines,
      T_table*T_search >= rN/8 in S_3-units; for all-pairs engines,
      (T_total)^2 >= rN/4. Memory can be traded by distinguished-point collision search
      (van Oorschot-Wiener style) without changing the time floor. When the table is
      reused across instances it is advice, and the relevant frontier is CGK's
      S*T^2 = N, where BL dominates mitm index calculus at every odd m.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked: [KR-RHO-13bf67, KR-RHO-ea34b8, KR-RHO-46c2c6, KR-IC-5931ee, KR-IC-5a43e5, KR-IC-73db3f, KR-IC-b0fcda, KR-IC-46d822, KR-IC-64659b, KR-IC-9e610d, KR-IC-ae532f, KR-IC-081a58, KR-IC-a4dd54, KR-IC-955fd6, KR-IC-f3da82, KR-IC-e847d1, KR-IC-0d2021, KR-IC-fbdb61, KR-IC-5765d2, KR-IC-5ea2f8, KR-IC-8b9daa, KR-IC-f5c584, KR-IC-1fcdbc, KR-IC-cd159a, KR-IC-889857, KR-IC-49c882, KR-IC-e2d81b]
    nearest:
      - ref: KR-RHO-13bf67
        provenance: internal
        relation: generalizes
        delta: >-
          The row is Shoup's single-target Omega(sqrt p), and KN-TECH-005 records the
          collision-counting technique and the "must be non-generic" rule. Both are
