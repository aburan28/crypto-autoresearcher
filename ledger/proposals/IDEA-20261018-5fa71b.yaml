      KR-IC-73db3f: adjacent only via the trace-confined V (term b)
      KR-IC-f3da82: not applicable, solver-side replay
      KR-IC-791cb7: not applicable, composite-degree GHS
      KR-RHO-cd0049: not applicable, BSGS constant
      KR-RHO-1c2928: not applicable, Koblitz rho constant
      KR-RHO-482ed3: adjacent only as the Frobenius-class term (c)
      KR-RHO-755e35: not applicable, no isogeny walk
      KR-IC-1fcdbc: not applicable, binary solver timing
  dominated_by: n/a (no result claimed)
  sota_delta: zero on every ECDLP axis; one null replaces four
