idea:
  id: IDEA-20261018-5fa71b
  question_id: RQ-PFDR-ae2fba
  added: '2026-10-18'
  status: proposed
  approved_by: null
  proposed_by: idea-synthesist
  title: >-
    One count vector, three moments: PFDR kappa, RELN Delta, SEMBIN nu and KIC
    coverage read the same h-sum count vector; one four-term null serves all
  class: control
  claim: >-
    BRIDGE. c(R) = h-sum count vector of a base, mu its mean, Delta = Var/mu.
    (I1) PFDR kappa_h (IDEA-20261017-077f12, EXP-PFDR-ca5e01) equals
    (Delta_D + mu - 1)/(Delta_null + mu - 1), exact at matched pair count.
    (I2) SEMBIN nu_t/nu_null (IDEA-20261017-3079bc) is the same number, h = t.
    (I3) The parity mixture of H-SEMBIN-83a856 has Delta = 1 + mu, so kappa = 2
    at every mu: the program's one supported structure is a constant.
    (I4) Parseval ties the IDEA-20261018-71a901 periodogram energy to Delta.
    Four lanes thus read one vector by three statistics (dispersion, spectrum,
    zero fraction) and need one null matched on (a) mean, KN-FIND-007;
    (b) cofactor class d(V), IDEA-20261017-3db2a8; (c) endomorphism-forced
    pairs, IDEA-20261018-d4cef4; (d) selection, IDEA-20261018-5f37a1. FROM
    RECORDS: EV-RELN-335cd2 (Delta in band, N = 2^14..2^20, m = 3) gives by
    (I1) kappa_3 - 1 in about -0.07..+0.01, shrinking with N: PFDR Part C's
    h = 3 growth question is already bounded at theta = 1/3. See notes.
  mechanism: >-
    PAIR (R1 x-labels; Sigma = translation by base elements), Class I
    partial-action; the sumset pushforward is lossy and Sigma-compatible.
    Forced excess comes only from block systems of the operation group
    (IDEA-20260901-863e36), index d giving kappa = d; none exist on the
    prime-order subgroup (Theorem C, KN-FIND-ffe1df). KN-OPEN-020: no base.
  novelty_status: unverified
  citations:
    - {ref: EXP-PFDR-ca5e01, provenance: internal, claim: C(F) and matched null, verified_by: idea-synthesist 2026-10-18}
    - {ref: H-SEMBIN-83a856, provenance: internal, claim: mixture 0 / Poisson(2mu), verified_by: EV-SEMBIN-0c8bf4}
    - {ref: EV-RELN-335cd2, provenance: internal, claim: Delta in band at four rungs, verified_by: idea-synthesist 2026-10-18}
  assumptions: []
  predictions:
    - metric: identity residual abs(kappa_counted - kappa_from_Delta)
      direction: lower
      minimum_effect: at most 1e-9 (blocking)
    - metric: kappa_3 re-derived from RUN-RELN-f202be
      direction: different
      minimum_effect: >-
        in [0.93, 1.07] per rung, [0.98, 1.02] at 2^20
    - metric: plant signature table (3 plants x 3 statistics)
      direction: different
      minimum_effect: each plant moves only its own statistic
  minimal_test:
    design: >-
      Stage 0: derive (I1)-(I4), freeze conventions, write the four-term null.
      Stage 1 (read-only): recompute kappa_3 from stored RELN counts; cross-check
      the ca5e01 kernel against the RELN enumerator at m = 2. Stage 2: N =
      2^14..2^18, 3 prime-order curves, h = 2, 3, window / QR / GAP bases; the
      three statistics against the null; plants: cofactor coset, log-GAP, sine.
    controls:
      - Z/N relabelled group; 20 matched random bases; x-permutation null
      - element-level and class-level nulls side by side
    required_metrics: [kappa, Delta, mu, max I_s, zero fraction, plant recovery]
  falsification_conditions:
    - Identity residual above 1e-9: convention mismatch or bug; halt.
    - A plant detected by a statistic not predicted for it: not separable.
    - Re-derived kappa_3 outside [0.9, 1.1] where Delta was in band: (I1) broken.
  confounders:
    - Multiset vs distinct-tuple conventions shift mu and the trivial term.
  interpretation_limits:
    - Toy scale; identities exact, bands at tested rungs; spectrum finer than Delta.
  heuristic_assumptions:
    - id: H1
      statement: Matched random bases have Poisson-like counts, Delta_null = 1 - O(mu/N).
      rigorous_support: exact mean (KN-FIND-007); covariance -M/N^2 (IDEA-20260906-79ff48).
      validation_plan: 200 random bases per rung; Delta_null against 1 +- sqrt(2/n); tails.
    - id: H2
      statement: Terms (b), (c) exhaust the homomorphic channel on prime-order curves.
      rigorous_support: block systems (IDEA-20260901-863e36); Theorem C of KN-FIND-ffe1df.
      validation_plan: cofactor-coset plants (IDEA-20261018-9fc21f) read kappa = d, 3 rungs.
  target_complexity:
    time_exponent: none; measures delta in kappa(N) = N^delta, moving h/(2h-1) by -delta/2
    memory_exponent: unchanged
    best_known: rho N^(1/2); table family N^(h/(2h-1)) (IDEA-20261017-bbc53e)
    hidden_overhead: forced terms (b), (c) have delta = 0 by construction
  estimated_cost: {implementation: low, compute: low}
  recommended_priority: high
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked: [KR-RHO-13bf67, KR-IC-5931ee, KR-IC-5a43e5, KR-IC-73db3f, KR-IC-955fd6, KR-IC-f3da82, KR-IC-791cb7, KR-RHO-cd0049, KR-RHO-1c2928, KR-RHO-482ed3, KR-RHO-755e35, KR-IC-1fcdbc]
    nearest:
