        relation: adjacent
        delta: block-system quotients are generic; only the residual counts
      - ref: KR-IC-955fd6
        provenance: internal
        relation: adjacent
        delta: symmetry and torsion constants are terms (c) and (b) as kappa
      - ref: KN-FIND-007
        provenance: internal
        relation: generalizes
        delta: conservation is term (a); higher moments fixed here
      - ref: KN-OPEN-003
        provenance: internal
        relation: adjacent
        delta: representation vs coefficient variance is this null
