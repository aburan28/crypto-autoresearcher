  object_first_candidate:
    established_families_off_limits: >-
      Declared off-limits as the primary lens for this record so it cannot
      regress into a renamed variant: (a) information-set decoding and generic
      decoding in every form; (b) side-channel, fault and decryption-failure
      attacks, which RQ-MCE-e65b3c fences as a separate claim class;
      (c) building a new square-code or syzygy DISTINGUISHER, which is the lane
      of IDEA-20260808-3d3be9, IDEA-20260816-023239 and IDEA-20260808-b9a74c;
      (d) support-splitting and permutation-equivalence signatures.
      The lens used instead is a single conserved integer under one public
      operation, which is not an attack family.
    tracked_object: >-
      The deficit delta(s) = dim P_S(C) - (n - s - (2t - s) m), one integer per
      puncture depth, together with the derived multiplier's degree pair
      (|S|, 2t) as bookkeeping. The object followed through the computation is
      the integer chain, not the code.
    lossiness: >-
      Maximally lossy and compatibly so. Everything is discarded -- the support
      L, the polynomial g, the permutation and scaling the public key is
      scrambled by, the code itself -- and what remains is one integer per step.
      The retained part propagates deterministically under the target's
      operations for two separate reasons that must both hold: delta is
      invariant under coordinate permutation and F_2-scaling because dim, n and
      the nominal degree are; and delta is a deterministic function of the step
      under puncturing because dim is preserved below the minimum distance while
      the generic bound rises by exactly m-1. There is no route back: a single
      integer cannot encode a support of n elements of F_{2^m}.
    not_a_change_of_coordinates: >-
      The mirror failure was checked first. IDEA-20260805-9704d9's delta(C, r)
      moves by m per unit change of the DESCRIPTION with the code fixed; this
      record's delta moves by m-1 per unit change of the CODE with the
      description following. If the two rules were the same object the observed
      differences would coincide, and they differ by exactly 1 per step, which
      the stage-1 chain measures directly. The projection also survives the
      strongest available disqualifier -- if delta were constant across
      instances it would be an artifact of the apparatus; it is instead an exact
      arithmetic progression with a known start (tm) and a known slope (m-1),
      both forced by the parameters.
    propagation: >-
      One step of the operation is a single puncture. It maps
      (n, k, r, delta) to (n - 1, k, r - 1, delta - (m - 1)) whenever the
      current code has no weight-1 codeword at the punctured coordinate, which
      is guaranteed while s < d. The comparison operation, shortening, maps
      (n, k, r, delta) to (n - 1, k - 1, r, delta), i.e. it is deficit-neutral,
      which is why a shortening chain can never leave the Goppa family by this
      measure and IDEA-20260816-9c7e2d's chain cannot reach s*.
    survival_score: >-
      The object survives exactly s* = tm/(m-1) steps and then changes sign,
      which is the whole content. At toy scale the chain is much shorter:
      at m = 6, t = 4 the budget is tm = 24 and the slope is 5, so s* = 4.8 and
      the chain has 5 usable steps; at m = 5, t = 5, s* = 6.25. Cells whose
      chain is shorter than 4 steps are reported as too short rather than
      analysed. Beyond s* the derived code becomes a strict subcode of the
      nominal alternant code and delta is no longer a genericity statement --
      that is where the structure dissolves and the experiment stops.

  null_object_control: >-
    Four arms, run in one invocation, and the fourth is the decisive one.
    (1) MATCHED RANDOM-MULTIPLIER ALTERNANT: Alt_{2t-s}(L minus S, y_random) at
    identical (n', r', m). Forced value declared before the run: deficit 0, i.e.
    dimension exactly n' - r'm, at the empirically measured attainment rate for
    that cell -- the Goppa arm is compared against that measured rate, never
    against 1.
    (2) MATCHED RANDOM BINARY CODE at (n', k): its dual's square code must attain
    min(n', C(s+1,2)). This is the positive control on the rank routine; if it
    fails, no other arm may be reported.
    (3) SHORTENING ARM: the same chain built by shortening instead of puncturing.
    Forced value: delta constant at tm for every step. A shortening arm whose
    delta moves refutes the arithmetic and stops the run.
    (4) DERIVED-FROM-RANDOM-ALTERNANT: the identical puncture chain applied to a
    random degree-2t alternant code with random multiplier. Its delta starts at
    0, not tm, so its chain immediately goes negative. If, after normalising for
    that offset, the derived-from-Goppa arm's square-code behaviour is
    indistinguishable from this arm's, then the run measures ALTERNANT structure
    under puncturing and no Goppa-specific reading is permitted anywhere in the
    output.

  discriminated_from:
    - >-
      IDEA-20260805-9704d9. Same surplus tm, different object and different
      propagation rule (m per description step versus m-1 per code step). That
      record's HA/FV-A (the doubling identity) is a DEPENDENCY of this one and
      the two should be run in the same session; this record adds the operation,
      the budget, s*, the bound s* < d, and the non-Goppa-form lemma, none of
      which appear there.
    - >-
      IDEA-20260816-9c7e2d. Shortening chains with autocorrelation statistics.
      Shortening is deficit-neutral, so that chain stays inside the Goppa family
      by construction; this one is chosen precisely because it does not.
    - >-
      IDEA-20260808-b9a74c and IDEA-20260808-3d3be9 and IDEA-20260816-023239.
      Square-code defect as a distinguishing observable on unmodified codes.
      Here the square-code defect appears only as a stage-3 secondary check on
      DERIVED codes, and the primary observable is a dimension deficit under an
      operation.
    - >-
      IDEA-20260816-576d70. Compiles the committed reading of the boundary into
      a predicate. That is a documentation instrument over this program's own
      records; this is a claim about codes.
    - >-
      The paper's own ingredient (i) as fetched: shortening plus component-wise
      products, reducing degree without spending coordinates. Puncturing spends
      one coordinate and m-1 deficit per degree step and requires no genericity
      heuristic to define. The two are different operations with different
      costs, and IDEA-20260829-2d6d63 is the record that compares them properly.

  assumptions:
    - >-
      The doubling identity Gamma(L,g) = Gamma(L,g^2) for binary g squarefree
      with no root in L. NOT assumed -- it is HA-1 and the first thing measured;
      if it fails the degree-2t presentation does not exist and the budget tm is
      not there.
    - >-
      Classic McEliece's g is squarefree at all five parameter sets (understood
      to follow from an irreducibility requirement; recalled, and the experiment
      must read it from the transcribed specification).
    - >-
      The (n, m, t) triples used in stage 4 are recalled and were checked only
      against the five committed rates. Stage 4 must re-transcribe them from
      EV-MCE-332f99 before any number is published.
    - >-
      Nothing is assumed about condition (6), Heuristic 18, or whether the
      derived parameters satisfy either. Those are open and are named as such.

  proof_search_map:
    baseline_reproduction: >-
      The exact bottleneck is the FILTRATION phase, named as such by
      RQ-MCE-f8fca0 Q-3 and identified as ingredient (i) in the fetched abstract
      of arXiv:2304.14757. The baseline this record must reproduce symbolically
      is not that paper's algorithm -- its body is unfetched -- but the two
      dimension facts it rests on: dim Alt_r(x, y) >= n - rm for every alternant
      code, with equality for random multipliers, and dim Gamma(L, g) = n - tm
      for binary Goppa. Both are reproduced on the frozen toy fixture before any
      deficit is reported, at exact integer equality with zero tolerance.
    observation_collision: >-
      The observable is the integer chain delta(s). TWO COLLISIONS ARE ALREADY
      IDENTIFIED and both are built into the design. First, delta = 0 is
      attained both by a code that is genuinely a generic alternant code and by
      a code that merely has the same dimension as one; the containment argument
      forces equality only when the AMBIENT alternant code also attains its
      bound, which is HA-2 and is measured, not assumed. Second, and sharper,
      the non-Goppa-form lemma in claim (B) shows only that the derived code is
      not Goppa IN ITS NATURAL PRESENTATION; a code can be permutation-equivalent
      to a Goppa code with a different support and polynomial, and delta cannot
      see the difference. Searching for such a collision -- a derived code at
      s >= 1 that is nonetheless equivalent to some Goppa code -- is an explicit
      stage of the experiment at m = 4 where the search is exhaustible, and
      finding one is a direct falsifier of the escape reading.
    quantifier_order: >-
      Written out. RIGOROUS CLAIM: for all m >= 3, for all t, for all L and
      squarefree g with no root in L, for all S contained in L with
      |S| < d, delta(|S|) = tm - |S|(m-1). The witness (the derived alternant
      code) depends on S, which is allowed because S is chosen by the adversary
      from public data. MEASURED CLAIM: there exists s <= ceil(s*) such that FOR
      A 1 - o(1) FRACTION of S of that size the derived code attains its generic
      bound. The order matters: the escape is claimed for MOST S, not for all S,
      and a design that silently promoted 'exists S' to 'for all S' would be
      claiming a uniformity the re-randomization stage exists to avoid needing.
    method_ceiling_and_nearby_object_control: >-
      CEILING. Under ideal tuning this method can prove at most that the derived
      family is dimension-generic and non-Goppa in presentation. It cannot prove
      the derived family is indistinguishable from random alternant codes by any
      other invariant, and it cannot prove any attack applies -- condition (6)
      is untranscribed and the field conjunct q = 2 is satisfied trivially, so
      the rate conjunct is untested by construction.
      NEARBY OBJECT WHERE THE CONCLUSION MUST FAIL. Apply the identical chain to
      a random degree-2t alternant code (null arm 4). There the surplus is 0 at
      s = 0, so there is no budget and nothing to escape; a method that reported
      the same 'escape' for that object would have identified nothing. Second
      nearby object: a Goppa code with g NOT squarefree, where the doubling and
      hence the budget should be absent or smaller; the graded sweep
      g_j = g_0 h^j is the control that localises the budget to squarefreeness.

  predictions:
    - metric: >-
        Common difference of the measured deficit chain delta(s) under
        puncturing, at each toy cell, in exact integers
      direction: different
      minimum_effect: >-
        EXACTLY -(m-1) at every step with s < d, at 100 percent of instances.
        This is an integer identity with zero tolerance; a single deviation
        falsifies the propagation rule and is reported per instance.
    - metric: Common difference of the deficit chain under SHORTENING (control arm 3)
      direction: different
      minimum_effect: EXACTLY 0 at every step, at 100 percent of instances.
    - metric: >-
        Empirical fraction of uniform puncture sets S with |S| = ceil(s*) at
        which the derived code Alt_{2t-s}(L minus S, h_S/g^2) attains its
        generic dimension bound, minus the same fraction for the matched
        random-multiplier arm at identical (n', r', m)
      direction: higher
      minimum_effect: >-
        Predicted difference greater than -0.05, i.e. the Goppa-derived arm is
        at most 5 points below the random-multiplier arm's own measured
        attainment rate. A difference below -0.20 is the interesting negative
        and means a residual anomaly survives puncturing.
    - metric: >-
        Same fraction at |S| = ceil(s*) - m, i.e. strictly inside the forced
        non-generic region
      direction: lower
      minimum_effect: >-
        EXACTLY 0.0. This is forced by claim (A)(i) and is not a statistical
        prediction; a nonzero value means the deficit arithmetic or the code
        construction is wrong and stops the run.
    - metric: >-
        Square-code defect of the dual of the derived code at |S| = ceil(s*),
        minus the same quantity for the matched random-multiplier alternant arm,
        in dimensions
      direction: different
      minimum_effect: >-
        No magnitude is pre-committed and inventing one would be fabrication --
        no source was read for a defect formula. The pre-registered content is
        the SIGN TEST plus the arm-4 comparison: a defect gap of 0 within noise
        means the escape is clean on this observable; any strictly positive gap
        that is also absent from the derived-from-random-alternant arm is the
        residual Goppa anomaly and is the headline negative.
    - metric: >-
        s*, residual deficit at floor(s*), derived length, derived degree and
        derived rate at all five Classic McEliece parameter sets, in exact
        rationals
      direction: different
      minimum_effect: >-
        Forced values to be reproduced. s* = tm/(m-1) = 768/11, 1248/12,
        1664/12, 1547/12, 1664/12 for the sets with (n, m, t) recalled as
        (3488, 12, 64), (4608, 13, 96), (6688, 13, 128), (6960, 13, 119),
        (8192, 13, 128); residual deficit at floor(s*) = 9, 0, 8, 11, 8; derived
        rate at floor(s*) = 2720/3419, 3360/4504, 5024/6550, 5413/6832,
        6528/8054. Any mismatch routes to a correction record rather than being
        absorbed.

  minimal_test:
    design: >-
      The cheapest valid discriminator is stage 0 plus one cell of stage 1, and
      it costs minutes on one core with no dependency beyond pure Python.
      Take m = 6, t = 4, n = 64 so that the budget is tm = 24, the slope is
      m - 1 = 5 and s* = 4.8. Build 20 Goppa keys with squarefree g and no root
      in L. For each, verify the doubling identity by exact row-space equality;
      then puncture one coordinate at a time along a seeded order, recomputing
      the F_2 rank and the nominal generic bound at every step, and print the
      integer chain delta(0) = 24, delta(1) = 19, ..., delta(4) = 4,
      delta(5) = -1. Run the shortening arm in the same invocation and print its
      chain, which must be constant at 24. THE WHOLE PROPOSAL IS DECIDED BY
      WHETHER THOSE TWO CHAINS COME OUT AS PREDICTED: the puncture chain is the
      new object, the shortening chain is the incumbent operation, and they are
      distinguished by one integer per step. Only if both pass does stage 2 run,
      constructing the derived alternant codes directly and measuring attainment
      over 500 random S per cell against the matched random-multiplier arm.
      Budget for the full stage 1 to 3 grid at m in {4,5,6}: order 10^3 core
      -seconds, exact F_2 and F_{2^m} arithmetic, no solver, no Sage.
    controls:
      - >-
        Doubling verification on every instance before any deficit is recorded;
        the derived degree-2t presentation is the only source of the budget.
      - >-
        Shortening arm in the same invocation, forced constant chain.
      - >-
        Matched random-multiplier alternant arm at identical (n', r', m), with
        its own attainment rate measured first and used as the comparator.
      - >-
        Matched random binary code arm as the positive control on the square
        -code routine; failure here voids all other arms.
      - >-
        Derived-from-random-alternant arm, the competing family explanation.
      - >-
        Graded squarefreeness sweep g_j = g_0 h^j for j = 0..3, localising the
        budget to squarefreeness.
      - >-
        Ordering control: all null and control arms are computed, hashed and
        committed before the Goppa arm is examined.
      - >-
        Weight-1 check: verify at every step that the current code has no
        weight-1 codeword, so that dimension preservation is measured rather
        than assumed.
    required_metrics:
      - per-instance deficit chain delta(0..s_max) under puncturing, exact integers
      - per-instance deficit chain under shortening, exact integers
      - per-instance measured minimum weight lower bound or weight-1 absence flag per step
      - attainment fraction of the generic bound per cell, Goppa-derived arm and random-multiplier arm, over at least 500 puncture sets
      - square-code defect of the dual with generic reference, all four arms, per cell
      - graded squarefreeness sweep table with monotonicity stated
      - the five crypto-scale exact rationals of the last prediction, with the five committed rates reproduced as a transcription control
      - count of collisions found in the m = 4 exhaustive equivalence search (derived codes equivalent to some Goppa code)

  falsification_conditions:
    - >-
      The doubling identity fails at any toy instance with squarefree g. The
      degree-2t presentation and therefore the budget do not exist, and the
      proposal is void at a cost of minutes.
    - >-
      The puncture chain's common difference is not exactly -(m-1) at any step
      with s < d. The propagation rule is wrong and the object does not
      propagate deterministically, which fails the lossy-projection test itself.
    - >-
      The shortening arm's chain is not constant. The arithmetic is wrong.
    - >-
      A derived code at |S| < s* attains its generic bound. This is forbidden by
      the forced inequality and indicates a construction or ranking bug.
    - >-
      The derived-from-Goppa arm's attainment rate at ceil(s*) is more than 0.20
      below the matched random-multiplier arm's. A residual, puncture-invariant
      Goppa anomaly exists; the escape reading is falsified and the obstruction
      is recorded with its measured size in dimensions.
    - >-
      The derived-from-random-alternant arm behaves identically to the
      derived-from-Goppa arm on the square-code observable. Everything measured
      is about alternant structure and no Goppa-specific statement may be made.
    - >-
      The m = 4 exhaustive search finds a derived code at |S| >= 1 that is
      permutation-equivalent to a Goppa code. The non-Goppa-form lemma then does
      not carry the interpretation it is used for, and the escape claim is
      withdrawn to a statement about presentations only.

  confounders:
    - >-
      TOY DEGENERACY. At small n the quantity n - s - (2t - s)m goes negative
      and the generic bound is vacuous; every cell must satisfy
      n - 2tm >= 1 at s = 0 and the filter must be reported, not silently
      applied. This is the single most likely way to manufacture a spurious
      escape.
    - >-
      HIGH RATE. Every toy cell is at high rate, the regime most favourable to
      square-code anomalies, so stage 3 numbers do not transfer to any deployed
      parameter set and must not be read as if they did.
    - >-
      SHORT CHAINS. At toy scale s* is 4 to 7, so the arithmetic progression has
      few points and a single rank anomaly dominates the fit. Cells with fewer
      than 4 usable steps are reported as too short.
    - >-
      DIMENSION EXCEEDING THE DESIGNED VALUE. dim Gamma(L,g) can exceed n - tm
      at small parameters, which shifts the budget's starting point; the budget
      must be computed from the MEASURED dimension, never from the designed one.
    - >-
      INHERITED DEPENDENCY. This record consumes the certified Goppa fixture of
      IDEA-20260816-118177 and the doubling identity of IDEA-20260805-9704d9. A
      bug in either propagates here as a spectacular and entirely spurious
      chain.
    - >-
      SELECTION OVER S. Reporting the best puncture set rather than the
      distribution over S would convert a rare draw into a headline; the design
      forbids it by requiring the full attainment distribution.

  interpretation_limits:
    - >-
      RQ-MCE-e65b3c's claim-tier ceiling is TOY and this record does not
      authorise its relaxation. Nothing here is an attack, a distinguisher, or a
      security statement about Classic McEliece in either direction.
    - >-
      Any deliverable of this line that cites the Goppa exclusion must carry all
      four qualifications of RQ-MCE-f8fca0's completed_constraint, with Q-2 and
      Q-4 quoted rather than summarised. That constraint binds this record's
      outputs.
    - >-
      Escaping the FAMILY conjunct says nothing about the RATE conjunct.
      Condition (6) is untranscribed, is not reconstructed here, and the derived
      rate of roughly 0.75 to 0.81 is reported as a number without any claim
      that it does or does not satisfy that condition. A deliverable that
      implied otherwise would repeat, in the opposite direction, exactly the
      rate-versus-family error RQ-MCE-3f7c02 corrects.
    - >-
      The claim that the derived code is not Goppa is about its NATURAL
      PRESENTATION on the recovered support. Equivalence to some other Goppa
      code is a separate question and is the observation-collision item above.
    - >-
      A clean escape at toy scale is not an escape at m = 13. Only the exact
      arithmetic of s*, the budget tm and the slope m-1 is scale-free; every
      measured genericity and square-code number is toy and stays toy.

  heuristic_assumptions:
    - id: HA-1
      statement: >-
        For q = 2 and g squarefree of degree t with no root in L, the codes
        Gamma(L, g) and Gamma(L, g^2) have identical F_2 row spaces, so
        Gamma(L, g) = Alt_{2t}(L, y) with y_i = g(x_i)^{-2}, for all m >= 3, all
        n <= 2^m and all such g.
      rigorous_support: >-
        Not distributional. The classical derivative argument: for c in
        Gamma(L,g) with f = product over supp(c) of (X - x_i), the syndrome is
        f'/f, and over F_2 the derivative f' is a square, so g | f' with g
        squarefree forces g^2 | f'. This is the standard route to d >= 2t + 1
        for binary Goppa codes. RECALLED, no author, year or theorem number is
        asserted, and it is IDEA-20260805-9704d9's HEUR-SD-2 unchanged.
      validation_plan: >-
        Exact row-space equality at at least 60 instances across m in {4,5,6}
        and t in {2,...,5}, computed before any other quantity. Sampled
        parameters recorded per instance. Cost of being wrong: seconds. Transfer
        assumption: none -- it is an algebraic identity, so the toy computation
        checks a derivation rather than extrapolating.
    - id: HA-2
      statement: >-
        Let S be a uniformly random subset of L of size s and
        h_S(X) = product over j in S of (X - x_j). For s >= s* = tm/(m-1) and
        s <= s* + m, the derived alternant code Alt_{2t-s}(L minus S, h_S/g^2)
        attains its generic dimension bound n - s - (2t - s)m with probability
        1 - o(1) as n grows at fixed m and fixed (2t - s)m/n.
      rigorous_support: >-
        Paired as the profile requires. RIGOROUS BOUND: the containment
        P_S(Gamma) contained in Alt_{2t-s} together with dimension preservation
        below d forces the derived code's surplus to be at least
        tm - s(m-1), so genericity is IMPOSSIBLE for s < s* -- the heuristic is
        needed only above s*, and only for the direction that cannot be forced.
        CLASSICAL DISTRIBUTION STATEMENT IMITATED: the genericity of subfield
        subcode dimension, i.e. that the rm parity conditions obtained by
        expanding r conditions over F_{2^m} in an F_2 basis are independent for
        a random multiplier, so dim Alt_r(x, y_random) = n - rm with probability
        tending to 1. The heuristic asks only that the STRUCTURED multiplier
        h_S/g^2 behaves like a random one once its forced surplus is exhausted.
      validation_plan: >-
        At least 500 uniform puncture sets per cell at m in {4,5,6}, t in
        {2,...,5}, sweeping s from s* - m to s* + m. Compare the empirical
        attainment curve against the measured attainment curve of the matched
        random-multiplier arm at identical (n', r', m) -- never against 1, since
        the random arm itself fails at small n. Tail check: the 20 puncture sets
        with the largest residual surplus are reported individually with their
        S, since a heavy tail would indicate a structured subfamily of bad
        puncture sets, which is a finding rather than noise. Sampled parameters
        and the seed stream are recorded. TRANSFER ASSUMPTION, STATED AND NOT
        DISCHARGED: nothing here is measured at m = 13, and no shortcut
        comparable to the Deuring correspondence exists for this family in this
        program, so the crypto-scale statement remains untested by design.
    - id: HA-3
      statement: >-
        Toy-scale behaviour at m <= 6, t <= 5 predicts behaviour at m = 12, 13
        and t = 64 to 128.
      rigorous_support: >-
        NONE. This is recorded as an assumption that is NOT made. The record
        deliberately separates the scale-free arithmetic (delta's slope, the
        budget tm, s*, the bound s* < d, the non-Goppa-form lemma) from the
        measured quantities (attainment fractions, square-code defects), and
        only the former is stated at crypto scale.
      validation_plan: >-
        Not validated and not claimed. The forward route, named so it is not
        lost: measure attainment at the largest m the fixture supports, report
        the trend in m, and state explicitly that a trend over m in {4,5,6} is
        not an extrapolation to m = 13.

  target_complexity:
    time_exponent: >-
      NO UNCONDITIONAL ATTACK EXPONENT IS CLAIMED. The operation itself is free:
      computing P_S(C) and its rank is O(n^3) F_2 operations, dominated by one
      Gaussian elimination, i.e. under 2^40 bit operations at n = 8192.
      CONDITIONAL CASCADE, stated with its preconditions named and not asserted:
      IF a polynomial-time structure recovery for generic alternant codes over
      F_2 applies at the derived parameters (n', r', m) -- which requires
      condition (6), untranscribed and not evaluated here -- THEN combining it
      with the lift of IDEA-20260829-3caff2 gives key recovery in time
      O(n^omega) + O((s + 2t)^omega) field operations, i.e. polynomial, versus
      an exponential baseline. The precondition is the entire content and is not
      claimed to hold.
    memory_exponent: >-
      O(n^2) bits for the punctured generator matrix, about 2^26 bits at
      n = 8192. Negligible; no time-memory tradeoff arises because there is no
      search.
    best_known: >-
      NOT ASSERTED FROM MEMORY. This corpus holds no verified key-recovery
      figure for Classic McEliece; EV-MCE-332f99's own boundaries state that no
      distance between any attack regime and Classic McEliece was computed. The
      only fetched competitor is iacr:2026/1232 (see dominated_by), whose
      abstract claims full key recovery on binary Goppa in even characteristic
      with a CONJECTURED subexponential complexity and practical demonstrations
      on challenges quoted at 83, 89, 119, 166, 210 and 248 bit security. No
      figure from it is reproduced here.
    hidden_overhead: >-
      Two, both stated. First, the escape is only claimed for MOST puncture
      sets; the fraction is measured at toy scale and the failure fraction at
      crypto scale is unknown, so the honest cost of the conditional cascade
      includes an unbounded number of retries with unmeasured success
      probability. Second, and larger, the entire conditional depends on an
      untranscribed rate condition; treating that dependency as an o(1) would be
      exactly the dishonesty the profile forbids, so it is stated as an open
      precondition instead.
    tradeoff_note: >-
      None for the puncturing step. The re-randomization over S is embarrassingly
      parallel -- one public key yields unlimited independent derived instances
      at zero marginal cost, which is the only genuine algorithmic leverage this
      record offers and is why the measured attainment DISTRIBUTION, not its
      mean, is the deliverable.

  dominated_by: >-
    DOMINATED, and by the fetched primary target of this very question. Frontier
    rows checked. TIME: iacr:2026/1232 (KN-LIT-7c4620), abstract fetched
    2026-08-29, claims a full key-recovery attack directly on binary Goppa
    McEliece in even characteristic, conjectured subexponential in the security
    parameter, with reported practical demonstrations on TII challenges quoted
    at up to 248 bit security. A route whose entire purpose is to LEAVE the
    Goppa family is Pareto-dominated on the applicability axis by an attack that
    does not need to leave it, and this record claims no better exponent than
    that paper conjectures. MEMORY: the puncturing step uses O(n^2) bits and is
    dominated by nothing, but a memory advantage on a step that constitutes no
    attack is not a frontier position. DATA/QUERIES: the operation consumes the
    public key only and makes no query, so that axis is empty and cannot be
    improved. PREPROCESSING: none. WITHIN THIS REPOSITORY: dominated on the
    doubling-identity half by IDEA-20260805-9704d9, which must run first or
    jointly. The domination is stated against a CLAIM read from an abstract, not
    against a verified figure, and it is recorded that way rather than as a
    settled comparison.
  sota_delta: >-
    No attack; structural and measurement contribution, stated quantitatively.
    Before: this repository holds no operation that changes a Classic McEliece
    public code's alternant family, no deficit propagation rule, and a
    family-scoped distance of zero numbers. After: the forced dimension surplus
    of the derived alternant family drops from tm = 768, 1248, 1664, 1547, 1664
    to at most m - 2 = 11, 11, 11, 11, 11 at a cost of floor(s*) = 69, 104, 138,
    128, 138 coordinates out of n = 3488, 4608, 6688, 6960, 8192, with the rate
    moving from 0.77982, 0.72917, 0.75120, 0.77773, 0.79688 to 0.79556, 0.74600,
    0.76702, 0.79230, 0.81052 -- a gain of 0.0136 to 0.0168. Against the
    published state of the art the delta is zero: no ingredient is claimed new
    and no complexity is improved.

  estimated_cost:
    implementation: low
    compute: low
    basis: >-
      Pure Python exact F_2 and F_{2^m} linear algebra at m <= 6, n <= 64, plus
      500 puncture sets per cell over roughly 12 cells; order 10^3 core-seconds
      total, no solver, no Sage, no network. The stage-0 derivation and the
      stage-4 crypto-scale arithmetic are zero-compute.
  recommended_priority: high
  honest_prior_of_survival: >-
    P(the puncturing lemma and the chain slope -(m-1) verify exactly) = 0.9;
    the derivation is three lines and the residual risk is the dimension
    -preservation side condition at small n. P(the doubling identity verifies)
    = 0.8, inherited unchanged from IDEA-20260805-9704d9. P(the derived code
    attains its generic bound at ceil(s*) within 5 points of the random
    -multiplier arm) = 0.45, and this is the number I am least sure of --
    arXiv:2111.13038's existence suggests the Goppa square-of-dual anomaly has
    an algebraic cause that may not be exhausted by dimension bookkeeping, and a
    surviving residual is the more interesting of the two outcomes.
    P(the m = 4 collision search finds a derived code equivalent to a Goppa
    code) = 0.15. P(anything in this record bears on Classic McEliece's
    security) = below 0.02, and the record is written to be useful at that
    prior.

