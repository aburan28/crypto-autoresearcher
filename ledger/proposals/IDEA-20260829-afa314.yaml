idea:
  id: IDEA-20260829-afa314
  question_id: RQ-MCE-e65b3c
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    The Goppa exclusion is a QUANTITY, not a predicate. Puncturing a binary
    Goppa code is a public-key-computable operation that lowers the alternant
    degree by 1 and spends exactly m-1 of the code's tm dimension surplus per
    coordinate, so after s* = tm/(m-1) punctures the forced non-genericity of
    the derived alternant family drops from tm (768 to 1664 across the five
    Classic McEliece sets) to at most m-2 = 11 -- and s* is always below the
    minimum distance. Measure whether genericity is actually restored at s*, or
    whether a second, puncture-invariant Goppa anomaly survives.
  class: mechanism

  claim: >-
    (A) RIGOROUS PART, no heuristic. Let C = Alt_r(x, y) over F_2 with
    y_i nonzero. Puncturing C at a coordinate j gives a subcode of
    Alt_{r-1}(x minus x_j, y') with y'_i = y_i (x_i - x_j); iterating over a set
    S gives P_S(C) contained in Alt_{r-|S|}(x restricted, y_S) with
    y_S,i = h_S(x_i) y_i, where h_S(X) = product over j in S of (X - x_j).
    Granting the classical squarefree doubling (HA-1), a binary Goppa code
    Gamma(L,g) with deg g = t is Alt_{2t}(L, 1/g^2) and carries a dimension
    surplus over the degree-2t generic bound of exactly tm. Define the deficit
    delta(s) = dim P_S(C) - (n - s - (2t - s) m). Then delta(s) = tm - s(m-1)
    EXACTLY, for every s below the minimum distance, because puncturing
    preserves dimension while the generic bound rises by m-1 per step. Hence
    (i) for s < s* = tm/(m-1) the derived alternant code Alt_{2t-s} is FORCED to
    be non-generic, by at least delta(s) dimensions, with no heuristic used;
    (ii) at s = floor(s*) the forced surplus is at most m-2; (iii)
    s* < 2t + 1 <= d for every m >= 3, so the whole chain runs strictly inside
    the range where the dimension argument is valid.
    (B) STRUCTURAL PART, also rigorous. For s >= 1 the derived multiplier
    h_S/g^2 is provably NOT of Goppa form on the recovered support: if
    y_S,i = 1/G(x_i) for a polynomial G of degree 2t - s at more than 2t points,
    then G h_S = g^2 identically, and since g is squarefree with no root in L,
    gcd(h_S, g) = 1 forces h_S = 1, i.e. s = 0. So one puncture already leaves
    the Goppa subfamily in its natural presentation while staying inside the
    alternant family.
    (C) THE MEASURED PART, and the actual experiment. Whether the derived code
    is merely FORCED-generic-compatible at s >= s* or ACTUALLY generic is not
    settled by (A). The measurement is the empirical fraction of random puncture
    sets S at which the derived code attains its generic bound, plus the square
    -code defect of its dual, both against a matched random-multiplier alternant
    arm at identical (n', r', m).
    (D) NOT CLAIMED. No attack, no key recovery, no distinguisher, no security
    statement about Classic McEliece in either direction, no claim about what
    arXiv:2304.14757 or iacr:2026/1232 do or do not achieve, and no claim that
    the derived parameters satisfy that paper's condition (6) -- which this
    program has never transcribed and which this record does not reconstruct.
    (E) TWO OUTCOMES, BOTH INFORMATIVE, DECLARED BEFORE THE RUN. If genericity
    is restored at s*, then the family conjunct of the arXiv:2304.14757 boundary
    is escapable by a free public operation and the remaining barrier for that
    line is the rate/field conjuncts alone. If a residual anomaly survives
    puncturing, then binary Goppa codes carry a structural tell that is not the
    degree-doubling surplus, which is a NEW obstruction, is measurable as a
    number, and is exactly the kind of durable negative docs/inventor-protocol.md
    section 4 asks for.

  mechanism: >-
    STAGE 0, paper, minutes, can kill the proposal. Re-derive the puncturing
    lemma: for c in C and any f with deg f < r and f(x_j) = 0, write
    f = (X - x_j) h with deg h < r - 1; then sum_i c_i y_i f(x_i) = 0 and the
    j-th term vanishes, so sum_{i != j} c_i y_i (x_i - x_j) h(x_i) = 0. Re-derive
    delta(s) = tm - s(m-1) and s* = tm/(m-1). Re-derive s* < d from
    d >= 2t + 1 and m/(m-1) < 2. If any of these fails the line ends here.
    STAGE 1, exact linear algebra at toy scale. Build Gamma(L,g) at m in
    {4,5,6}, t in {2,...,5}, n = 2^m or 2^m - 1, g squarefree with no root in L.
    Verify HA-1 by exact row-space equality of Gamma(L,g) and Gamma(L,g^2).
    Compute the deficit chain delta(0), delta(1), ..., delta(s_max) by
    puncturing at coordinates drawn from a seeded stream, recomputing the
    F_2 rank at every step. The prediction is an exact integer arithmetic
    progression with common difference -(m-1); a single deviation is a
    falsification of the propagation rule and is reported per instance.
    STAGE 2, the genericity question. At s = floor(s*) and s = ceil(s*) and at
    s* +/- m, construct the derived alternant code A_s = Alt_{2t-s}(L minus S,
    h_S/g^2) DIRECTLY from the secret data, compute its dimension, and compare
    against (a) its generic bound and (b) the measured dimension of
    Alt_{2t-s}(L minus S, y_random) at identical (n', r', m). Report the
    empirical attainment fraction per cell for both arms.
    STAGE 3, the second-order tell. For each derived code compute the square
    -code defect of the dual with its generic reference value, on four arms:
    derived-from-Goppa, random-multiplier alternant at matched (n', r'), a
    random binary code at matched (n', k), and -- the arm that decides the
    interpretation -- derived-from-random-alternant, i.e. the same puncturing
    chain applied to a random degree-2t alternant code. If the derived-from
    -Goppa arm and the derived-from-random-alternant arm agree, everything
    measured is about the ALTERNANT family and no Goppa-specific reading is
    permitted on the face of any table.
    STAGE 4, crypto-scale arithmetic only, zero compute. Evaluate s*, the
    residual deficit at floor(s*), the derived length, degree and rate at all
    five Classic McEliece parameter sets, in exact rationals, and reproduce the
    five committed rates as a transcription control.
    STAGE 5, re-randomization. All of stage 2 and 3 is repeated over at least
    500 independent uniform puncture sets S per cell, because a single S is one
    draw and the object of interest is the distribution over S -- one public key
    yields an unlimited supply of derived instances, which is the
    worst-case-to-average-case move this design depends on.

  novelty_status: unverified
  novelty_screen:
    method: >-
      Read RQ-MCE-e65b3c, RQ-MCE-3f7c02 and RQ-MCE-f8fca0 in full. Read the
      prior-art list of all 14 proposals on this question and the full text of
      IDEA-20260805-9704d9, IDEA-20260808-b9a74c, IDEA-20260816-9c7e2d and
      IDEA-20260816-576d70; read the titles and claim openings of the seven
      proposals on RQ-MCE-b38a8b and RQ-MCEQ-fcb504. Grepped knowledge/ for
      'punctur' (19 files, all pre-2026-08-03 sweep entries, none stating a
      deficit propagation rule). Fetched the arXiv abstract of 2304.14757 and
      the ePrint abstract of 2026/1232 on 2026-08-29; ran one web search on
      puncturing/shortening degree reduction for alternant codes.
    results: >-
      IDEA-20260805-9704d9 is the nearest neighbour and shares the surplus tm.
      Its tracked object is delta(C, r) as the PRESENTATION degree r is varied
      on a FIXED code, with propagation rule delta(C, r') = delta(C, r) +
      m(r' - r) -- a change of description. This record's object is delta under
      an OPERATION THAT CHANGES THE CODE, with propagation rule
      delta(s+1) = delta(s) - (m-1). The two rules differ by exactly 1 per step
      and are experimentally separable in a single run, which is the cleanest
      available demonstration that this is not a repackaging.
      IDEA-20260816-9c7e2d tracks square-code defect along a SHORTENING chain;
      shortening is deficit-NEUTRAL by the same arithmetic (dim and the generic
      bound both drop by 1), so that chain cannot leave the Goppa family and
      cannot reach s*. IDEA-20260808-b9a74c and IDEA-20260808-3d3be9 measure
      square-code defects on unmodified codes. No record in this repository
      states the puncturing multiplier rule, the deficit budget, s*, or the
      non-Goppa-form lemma.
    verdict: >-
      UNVERIFIED, and deliberately so. The puncturing lemma is elementary and
      is standard equipment in the alternant-attack literature; the fetched
      abstract of arXiv:2304.14757 shows that paper's own degree reduction uses
      SHORTENING plus component-wise products rather than puncturing, which is
      a real difference in operation but not evidence that puncturing is
      unconsidered. No claim of external novelty is made for any ingredient.
      What is claimed is that the deficit budget tm, its spend rate m-1 per
      coordinate, the escape depth s* = tm/(m-1), the bound s* < d, and the
      residual-at-most-m-2 statement are absent from this repository and are
      the first family-scoped -- rather than rate-scoped -- distance this goal
      could state.

