  confounders:
    - >-
      Regulator computation for cubic and quartic fields is expensive and is often
      returned conditionally on GRH by standard software. Every (h, Reg) must be
      reported with the software's own conditionality flag; a GRH-conditional
      regulator makes the corresponding cell GRH-conditional and the record must say
      so rather than silently adopting it.
    - >-
      The height-ball shape constant grows with r and at r = 4 it is already large
      enough to swamp a factor-4 tolerance at toy n. P1's tolerance must be widened
      per degree by the computed shape constant, and that widening must be declared
      before the run.
    - >-
      Non-maximal orders. The formula is stated for O_K; using a non-maximal order
      changes h and the ideal count at the conductor. Restrict to maximal orders or
      report which was used.
    - >-
      Brauer-Siegel is ineffective, so no cell can be predicted in advance without
      computing (h, Reg) exactly - which is why the ladder computes them rather than
      estimating them, and why no concrete-cost table at cryptographic n is offered.
    - >-
      The sampler knows k; the table-building path must not read it and the static
      gate is blocking.

