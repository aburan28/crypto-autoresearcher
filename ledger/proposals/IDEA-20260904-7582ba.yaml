idea:
  id: IDEA-20260904-7582ba
  question_id: RQ-ECDLP-002
  handoff_id: TASK-20260904-300a32
  goal_id: null
  added: '2026-09-04'

  title: >-
    THE CHEAP-MAP RING CENSUS IS FINITE TO WRITE DOWN AND CLOSED AT EVERY DEGREE BY
    ONE THEOREM - a ring with a multiplicative norm and an efficiently computable
    homomorphism onto Z/n is exactly an order in a number field K in which the
    defining polynomial has a root mod n, Dirichlet's unit theorem confines the
    finite-norm-ball formulation to degrees 1 and 2, the height formulation restores
    every degree, and in EVERY case the smoothness-splitting cost is
    n^{1/2} * (h_K * Reg_K / sqrt(disc_K))^{1/2} * n^{o(1)}, which Brauer-Siegel
    pins at n^{1/2+o(1)} for every number field of every degree - so the escape is
    not a bigger field, it is a NON-COMMUTATIVE composition, and that is a
    one-sentence forward guidance rather than a fatigue report

  class: mechanism

  claim: >-
    (A) THE CENSUS QUESTION, POSED PRECISELY. IDEA-20260904-982159 exhibits an
    ECDLP resource that this corpus's rigidity and exit-map results do not cover - a
    ring R with a MULTIPLICATIVE norm N and an efficiently computable ring
    homomorphism phi onto Z/n, which endows the unknown scalar with a factorisation
    structure for free. Those prior results (IDEA-20260727-005's exit-map
    classification, IDEA-20260807-df906f's rigidity theorem, IDEA-20260901-863e36's
    block-system characterisation, IDEA-20260806-c5d183's three-class forcing) all
    quantify over maps OUT OF the group G under the translation action; a cheap-map
    ring is a map INTO Z/n from an auxiliary object, under multiplication, and is
    outside every one of them. THE CENSUS QUESTION IS - what is the complete list of
    such rings, and what does each one cost?

    (B) THE LIST, AND IT IS SHORT. A commutative ring with a multiplicative
    integer-valued norm and a surjection onto the field Z/n is, after quotienting by
    the kernel of the norm and taking the reduced structure, an ORDER O in a number
    field K = Q(theta) of degree r, and the homomorphism exists exactly when the
    minimal polynomial of theta has a root modulo n - which is decidable and, when a
    root exists, computable in O(r^2 log^3 n) bit operations by root-finding mod n.
    The parameters available to the attacker are therefore (r, K, O) and NOTHING
    ELSE, and all three are FREE - the curve does not appear anywhere in the
    construction, which is why the census is a statement about n alone.

    (C) DIRICHLET'S UNIT THEOREM CUTS THE NAIVE FORMULATION AT DEGREE 2, AND THE
    CUT IS EXACT. The smoothness-splitting meet-in-the-middle needs to ENUMERATE
    elements of bounded norm. The set {alpha in O : |N(alpha)| <= X} is FINITE only
    when the unit group of O is finite, i.e. (Dirichlet) only when K = Q or K is
    imaginary quadratic - r1 + r2 - 1 = 0. For every other K the norm ball contains
    infinitely many elements, obtained from any one by multiplying by units, and the
    enumeration is not a search but an unbounded orbit. SO THE FAMILY
    IDEA-20260904-982159 STUDIES - degree 2, imaginary - IS NOT AN ARBITRARY CHOICE,
    IT IS THE ENTIRE FINITE-BALL CENSUS.

    (D) THE HEIGHT FORMULATION RESTORES EVERY DEGREE, AND THE UNITS BECOME AN ASSET.
    Replace the norm ball by the HEIGHT ball - enumerate alpha with all archimedean
    absolute values |alpha|_v at most X^{1/r}, which is a bounded region of covolume
    sqrt(|disc_K|) in the Minkowski embedding and therefore contains
    Theta(X / sqrt(|disc_K|)) lattice points, finitely many for every r. Then
    |N(alpha)| <= X automatically, the composition is still multiplicative, and the
    units cease to be an obstruction and become a TOOL - by Dirichlet the unit
    lattice is full rank in the trace-zero hyperplane, so any factorisation
    alpha = beta*gamma can be REBALANCED by a unit to make the two archimedean
    profiles equal, which is exactly the balanced split the method needs and which
    the imaginary quadratic case gets for free only because there is nothing to
    rebalance.

    (E) THE COST, AT EVERY DEGREE, IN ONE FORMULA. Counting principal ideals rather
    than elements (which is what the unit rebalancing of (D) makes legitimate), the
    number of principal ideals of norm at most X in O_K is
    Theta( (Reg_K / (w_K sqrt(|disc_K|))) * X ), the fibre phi^{-1}(k) is a coset of
    an index-n sublattice, the true representative must additionally be B-smooth and
    have a PRINCIPAL balanced prefix (probability 2^{omega}/h_K under the
    equidistribution heuristic H2 of IDEA-20260904-982159), and assembling exactly as
    that record does gives
      T = n^{1/2} * ( h_K * Reg_K / sqrt(|disc_K|) )^{1/2} * n^{o(1)}
    in time and in memory, for every degree r and every field K. THE IMAGINARY
    QUADRATIC CASE IS THE SLICE Reg_K = 1, which returns
    n^{1/2}(h/sqrt(d))^{1/2} n^{o(1)} exactly, reproducing IDEA-20260904-982159.

    (F) THE CLOSURE, WITH ITS NAMED OBSTRUCTION. THE BRAUER-SIEGEL THEOREM states
    that for any sequence of number fields of BOUNDED DEGREE with |disc_K| tending
    to infinity, log(h_K Reg_K) / log(sqrt(|disc_K|)) tends to 1, i.e.
    h_K Reg_K = |disc_K|^{1/2 + o(1)}. Substituting into (E),
      h_K Reg_K / sqrt(|disc_K|) = |disc_K|^{o(1)}   and   T = n^{1/2 + o(1)}
    FOR EVERY NUMBER FIELD OF EVERY BOUNDED DEGREE. The covolume gain that a large
    discriminant buys in the table is exactly and always cancelled by the
    class-number-times-regulator penalty it costs in the success probability. THE
    OBSTRUCTION IS NAMED, IT IS A THEOREM RATHER THAN A HEURISTIC, AND IT IS THE
    SAME OBSTRUCTION AT EVERY DEGREE - which is why enlarging the field is not a
    research direction.

    (G) FORWARD GUIDANCE, WHICH IS WHAT MAKES THIS A CLOSURE AND NOT A FATIGUE
    REPORT. Exactly three classes remain open and each is named with what it would
    have to supply.
      G1 NON-COMMUTATIVE COMPOSITION. In a quaternion or matrix order the analogue of
      "principal" is replaced by the isomorphism class of a one-sided ideal's order,
      and the resulting structure is a GROUPOID - the class obstruction becomes a
      KEYING SET for the meet-in-the-middle table rather than a division of the
      success probability. That is precisely the structural difference between the
      exemplar's setting and this one. An ordinary E/F_p has commutative End, so the
      groupoid must be manufactured elsewhere - the concrete candidate is M_2(O)
      acting on E x E, and it is UNPRICED.
      G2 A RIGOROUS SMALL-REPRESENTATIVE THEOREM. By IDEA-20260904-7caed1's criterion
      the cost also falls if the true representative is smaller than pigeonhole
      predicts. Nothing in this census bears on that; it is the other axis and it is
      measured by IDEA-20260904-f7ee90.
      G3 UNBOUNDED DEGREE. Brauer-Siegel as stated requires bounded degree. A family
      with r growing with n is NOT covered by (F), the counting in (D) degrades
      (the height ball's shape constant is exponential in r), and whether the two
      effects cancel is UNKNOWN and is a real open question this record cannot
      answer. It is stated as open rather than assumed closed, and it is the single
      most honest gap in the closure.

  mechanism: >-
    THE TRACKED OBJECT is the invariant triple (h_K, Reg_K, disc_K) of a cheap-map
    ring, followed through the operation of ENLARGING the ring. It is lossy - the
    fibre over one triple contains every field with those invariants, and by
    class-field-theoretic constructions that fibre is large - and it is lossy
    compatibly with enlargement, because all three invariants have known behaviour
    under composita and subfields. So the retained part propagates deterministically
    under the operation the census performs, and it is not a change of coordinates
    because a field cannot be reconstructed from its invariants. The
    lossy-projection test PASSES, and its value here is that it identifies the ONE
    combination, h Reg / sqrt(disc), on which the whole census turns - which is
    exactly the quantity Brauer-Siegel controls.

    WHY THE CANCELLATION IS NOT A COINCIDENCE. The table size is governed by the
    DENSITY of principal ideals, which is Reg/(w sqrt(disc)) by the analytic class
    number formula's residue split; the success probability is governed by the
    PROPORTION of ideals that are principal, which is 1/h. Their product is
    h Reg / sqrt(disc), and the analytic class number formula makes that product the
    residue of the Dedekind zeta function at 1 divided by a factor depending only on
    r - i.e. THE COMBINATION THAT APPEARS IS THE RESIDUE ITSELF, and Brauer-Siegel is
    precisely the statement that the residue is |disc|^{o(1)}. The cancellation is
    the class number formula, not an accident of the bookkeeping, and stating it that
    way is the record's technical content.

    STAGE STRUCTURE. Stage 0 (zero compute, hard gate) - write (B) through (F), and
    check the degree-2 slice reproduces IDEA-20260904-982159's formula exactly.
    Stage 1 (zero compute) - write the three open classes of (G) with what each would
    have to supply. Stage 2 (cheap numeric) - VERIFY the cost formula empirically on a
    ladder of real number fields of degrees 2, 3 and 4, by computing (h, Reg, disc)
    with standard class-group software and measuring the actual table size at first
    collision on toy n. Stage 3 - the nulls and the two incumbent comparators.

  novelty_status: unverified

  novelty_screen:
    method: >-
      crypto-kb retrieval EMPTY, not called. Screening by (i) the 255-title ECDLP
      dedup digest read in full; (ii) PD-1 greps over ledger/proposals for
      'Brauer-Siegel', 'class number', 'imaginary quadratic order', 'Siegel',
      'regulator', 'Dirichlet', 'Maurer', 'implicit representation'; (iii) partial
      reads of IDEA-20260829-1859dd and IDEA-20260811-dcbea4, the two records that
      dominate the Brauer-Siegel hits; (iv) full reads of IDEA-20260901-b4e6eb and
      H-ECDLP-a4be60; (v) title-level review of the rigidity and exit-map records
      (IDEA-20260727-005, IDEA-20260807-df906f, IDEA-20260806-c5d183,
      IDEA-20260901-863e36) from the dedup digest.
    results: >-
      Brauer-Siegel appears in this corpus only as a SAMPLING-POWER statement about
      isogeny class sizes (IDEA-20260829-1859dd) and in IDEA-20260811-dcbea4's
      volcano context, never as a cost obstruction. The rigidity and exit-map family
      classifies maps OUT of G under translation and does not reach maps INTO Z/n
      from an auxiliary ring, which is checked by reading their titles and the
      quantifier language quoted in IDEA-20260901-b4e6eb and H-ECDLP-a4be60. No
      record enumerates the cheap-map rings, none mentions Dirichlet's unit theorem
      as a constraint on an ECDLP construction, and none states the formula of (E).
    verdict: >-
      UNVERIFIED. Brauer-Siegel, Dirichlet's unit theorem, the analytic class number
      formula and the ideal-counting asymptotic are all `recalled` - none was opened
      by this program - and under AGENTS.md rule 9 no label above unverified may rest
      on them. The author's own reading is that every ingredient is textbook and the
      only new thing is the ASSEMBLY into an ECDLP cost formula plus the census; the
      external novelty of that assembly is UNESTABLISHED. THE ACT THAT WOULD LICENSE
      A HIGHER LABEL - open a standard algebraic number theory reference for
      Brauer-Siegel, Dirichlet and the class number formula, and record the
      verification. A referee should also check the pseudorandomness and
      index-calculus literature for a prior statement of (E); the record does not
      claim it is absent.

