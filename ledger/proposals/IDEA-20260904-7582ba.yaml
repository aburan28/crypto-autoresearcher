  heuristic_assumptions:
    - id: H1
      statement: >-
        For every number field K in the census and every k, the fibre phi^{-1}(k) has
        minimal height-ball radius equal to the pigeonhole value up to n^{o(1)}, with
        the same distribution as a uniformly random coset of the index-n sublattice of
        O_K, uniformly over the tested ladder.
      rigorous_support: >-
        The rigorous half is Minkowski's theorem in the Minkowski embedding, giving the
        upper bound unconditionally; the classical distribution statement imitated is
        the Gaussian heuristic for a random coset of a rank-r lattice. The LOWER bound
        is assumed and is exactly the assumption the exemplar's setting violates, which
        is why it is measured and not asserted. This is IDEA-20260904-982159's H1 with
        r in place of 2.
      validation_plan: >-
        SAMPLE - 10^4 curve-defined and 10^4 random cosets per (field, n) cell, minima
        computed by LLL in the Minkowski embedding (polylog per sample at these
        degrees, no ECDLP solved). COMPARISON - two-sample Kolmogorov-Smirnov against
        the random-coset CDF. TAIL CHECK - the smallest curve-defined minimum against
        the smallest random one over equally many replicates. RECORDED - field,
        embedding precision, n, k, seed. TRANSFER ASSUMPTION - toy scale only. This
        plan is executed by IDEA-20260904-f7ee90 and is not duplicated here.
    - id: H2
      statement: >-
        Balanced prefixes of B-smooth ideals are equidistributed in Cl(O_K), so the
        expected number of PRINCIPAL balanced prefixes of a smooth alpha is
        2^{omega}/h_K, uniformly over the ladder and over degrees 2 to 4.
      rigorous_support: >-
        The rigorous half is that split prime ideals of norm at most B generate the
        class group and that their classes equidistribute by Chebotarev; the classical
        statement imitated is that a product of omega independent uniform class-group
        elements is uniform for omega of order log h. THE PREFIXES OF ONE alpha ARE NOT
        INDEPENDENT and the composition is not written down in this program; H2 is a
        genuine heuristic and it does the real work in (E).
      validation_plan: >-
        SAMPLE - per (field, n) cell, 10^3 smooth alpha, all 2^omega balanced prefixes
        reduced and classified by ideal reduction; observed principal fraction against
        1/h_K. SHORTCUT - class-group arithmetic is polylog at these discriminants, so
        the assumption is validated far past the scale at which the attack runs.
        COMPARISON - binomial(1/h_K). TAIL CHECK - maximum observed principal fraction
        against the maximum over equally many synthetic binomial draws. TRANSFER
        ASSUMPTION - degrees 2 to 4 and |disc| at most 2^40 only; the uniformity in
        degree that (F) needs is NOT validated beyond that.
    - id: H3
      statement: >-
        Unit rebalancing succeeds - for a fixed degree r, any factorisation of a
        height-bounded alpha into two ideals of comparable norm admits generators whose
        archimedean profiles differ by a factor n^{o(1)}, found in n^{o(1)} time by
        reduction against the unit lattice.
      rigorous_support: >-
        The rigorous half is Dirichlet's unit theorem, which makes the unit lattice
        full rank in the trace-zero hyperplane, so the archimedean profile is
        adjustable up to the covering radius of that lattice - which is
        Theta(Reg^{1/(r-1)}) and is therefore CONTROLLED BY THE REGULATOR. That is a
        genuine dependency and it is the reason the regulator appears in (E) twice, in
        opposite directions; the record states this rather than treating rebalancing as
        free.
      validation_plan: >-
        SAMPLE - 10^3 factorisations per field, measuring the achieved profile
        imbalance after reduction against the unit lattice and the time taken.
        PREDICTED SHAPE - imbalance bounded by the covering radius, independent of n.
        COMPARISON - the computed covering radius of the unit lattice per field. TAIL
        CHECK - the worst imbalance observed against that radius. TRANSFER ASSUMPTION -
        degrees 2 to 4 only; nothing is claimed at growing degree, which is (G3).

  target_complexity:
    time_exponent: >-
      n^{1/2} * (h_K Reg_K / sqrt|disc_K|)^{1/2} * n^{o(1)} = n^{1/2+o(1)} for every
      bounded-degree number field, by Brauer-Siegel. The naive pre-penalty figure,
      stated so the cancellation is visible, is n^{1/2}|disc|^{-1/4}, which at
      |disc| = n^{delta} would read n^{1/2-delta/4} and would reach n^{1/3} at
      delta = 2/3 - that figure is NOT claimed at any degree and is recorded only as
      the quantity the class number times regulator cancels.
    memory_exponent: >-
      Equal to the time exponent, n^{1/2+o(1)} - it is a claw-finding algorithm over
      stored tables. Strictly worse than parallel rho on memory at every degree.
    best_known: >-
      Parallel Pollard rho at about 0.886 sqrt(n) with small memory (KN-TECH-006,
      second-hand); BSGS at 2 sqrt(n) time and sqrt(n) memory;
      automorphism-discounted rho at sqrt(n/|Aut|); batch rho at Theta(sqrt(Mn));
      generic preprocessing at S T^2 = Theta(n).
    hidden_overhead: >-
      SUPERPOLYNOMIAL, and worse than the degree-2 case - rho(u)^{-1}, 2^{omega}, the
      r-dependent height-ball shape constant which is exponential in r, and the
      INEFFECTIVE Brauer-Siegel constant, which means no concrete-cost table can be
      produced for any field without computing h and Reg for it. The ineffectivity is
      a real limitation on the closure's practical content and is stated rather than
      absorbed.
    tradeoff_note: >-
      No useful time-memory tradeoff, for the same reason as the degree-2 case -
      shrinking the table shrinks the reachable representative faster than it shrinks
      the cost. Table construction parallelises perfectly; the join limits.
      Van Oorschot-Wiener applies to the join only and moves no exponent.

