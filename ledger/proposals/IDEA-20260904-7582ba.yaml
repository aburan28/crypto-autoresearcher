  assumptions:
    - >-
      n prime, gcd(n,p) = 1, instance public and self-generated. No live key, wallet,
      or deployed system.
    - >-
      Bounded degree r. Brauer-Siegel as recalled requires it, and (G3) records the
      unbounded case as genuinely open rather than assuming it closed.
    - >-
      B = n^{o(1)}, so smoothness probabilities, 2^{omega} and the height-ball shape
      constant at fixed r are all n^{o(1)}. Every such factor is superpolynomial and
      is disclosed.
    - >-
      Heuristics H1, H2, H3 of IDEA-20260904-982159 are adopted unchanged with K in
      place of R_d; H2 (class equidistribution of balanced prefixes) is the one that
      does real work and is the one IDEA-20260904-f7ee90 measures.

  proof_search_map:
    bottleneck: >-
      The step from ELEMENTS to PRINCIPAL IDEALS in (D)-(E). It is the unit
      rebalancing that makes the ideal count the right count, and if a unit
      rebalancing that simultaneously preserves the smoothness split and balances the
      archimedean profile does not exist for r >= 3, the census closes at degree 2
      and (F) covers less than it claims. That is the single derivational risk.
    baseline_embedding:
      parameter_slice: >-
        r = 2, K imaginary quadratic, Reg_K = 1, w_K in {2, 4, 6}. The formula (E)
        must return n^{1/2}(h/sqrt d)^{1/2} n^{o(1)}, i.e. IDEA-20260904-982159's
        formula, identically. Second slice - r = 1, K = Q, h = Reg = 1,
        disc = 1, returning n^{1/2} exactly, the multiplicative birthday bound.
      reproduction_check: >-
        SYMBOLIC AND FROZEN. Both slices are identities in the formula and must be
        checked by substitution, not by resemblance. A numeric fixture at a named
        imaginary quadratic field of known (h, disc) - for instance disc = -4 * 5 with
        h = 2 - must reproduce the table size that IDEA-20260904-982159's own Stage 3
        measures at the same n, to within the stated factor.
    observation_collision:
      observable: >-
        The single scalar h_K Reg_K / sqrt(|disc_K|), which by (E) determines the cost
        entirely.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED - fields of DIFFERENT DEGREE with the same
        value of that scalar must have the same cost, and the ladder is designed to
        contain such a pair (a quadratic field and a cubic field matched on the
        scalar). Measuring both and finding equal costs is the sharpest confirmation
        available; finding different costs falsifies (E) and is the lead. THE
        COLLISION THAT WOULD BE FATAL - a field whose measured cost is not a function
        of that scalar at all, which would mean some other invariant enters and the
        census is incomplete.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move from elements of an order to principal ideals of its maximal order,
          with unit rebalancing supplying the encoding, the ideal factorisation
          supplying completeness, principality supplying soundness, and the
          class-number penalty as the disclosed cost loss.
        predicted_gain: >-
          Extends the construction from degree 2 to every bounded degree. The gain in
          reach is real; the gain in COST is exactly zero, by (F), and that is the
          result.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (the exponent 1/2) fixed and vary the forgotten
          structure - degree, discriminant, signature, class number, regulator - and
          check whether any of them moves it. (F) predicts none does; the ladder is
          the test.
        predicted_gain: >-
          Converts "is a bigger ring worth trying" into a measured flat line, which is
          the cheapest possible way to stop an entire direction being re-proposed.
    quantifier_order: >-
      FOR ALL bounded degrees r, FOR ALL number fields K of degree r whose defining
      polynomial has a root mod n, FOR ALL k in Z/n, THERE EXIST B and X such that the
      smoothness-splitting meet-in-the-middle over O_K returns k in expected time and
      memory n^{1/2}(h_K Reg_K / sqrt|disc_K|)^{1/2} n^{o(1)}, ASSUMING H1-H3. The
      o(1) is uniform in k, NOT uniform in r, and NOT uniform in K - the
      ineffectivity of Siegel's constant is exactly this non-uniformity and it is
      disclosed rather than hidden in the notation.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most - "the entire class of commutative cheap-map rings is closed at
        n^{1/2+o(1)}, at every bounded degree, by Brauer-Siegel; here is the census,
        the formula, and the three classes that remain open". It can NEVER certify a
        lower bound on the ECDLP, it says nothing about non-commutative composition,
        nothing about unbounded degree, and nothing about the small-representative
        axis.
      nearby_object_control: >-
        The nearby object where the conclusion FAILS is a maximal order in a
        quaternion algebra, where the class set is a KEYING SET rather than a
        penalty and the exemplar reaches p^{1/3}. A census that could not distinguish
        the commutative from the non-commutative case would have identified the wrong
        structure, and the distinguishing feature - whether the class obstruction
        divides the success probability or indexes the table - is named in (G1) and is
        the record's chief output.
    proof_obligations:
      - claim: >-
          A commutative ring with a multiplicative integer norm surjecting onto Z/n
          is, after reduction, an order in a number field whose defining polynomial
          has a root mod n.
        responsibility: correctness
      - claim: >-
          {alpha : |N(alpha)| <= X} is finite iff the unit group is finite iff K = Q
          or K is imaginary quadratic (Dirichlet).
        responsibility: strictness
      - claim: >-
          The height ball of radius X^{1/r} contains Theta(X/sqrt|disc|) lattice
          points at fixed r, with an explicit r-dependent shape constant.
        responsibility: size
      - claim: >-
          Unit rebalancing turns any factorisation into a height-balanced one at fixed
          r, with a cost that is n^{o(1)}.
        responsibility: feasibility
      - claim: >-
          The assembly gives T = n^{1/2}(h Reg / sqrt|disc|)^{1/2} n^{o(1)}.
        responsibility: runtime
      - claim: >-
          The r = 2 and r = 1 slices reproduce the two known formulas exactly.
        responsibility: baseline
      - claim: >-
          Brauer-Siegel makes h Reg / sqrt|disc| equal to |disc|^{o(1)} at bounded
          degree, and does NOT apply at unbounded degree.
        responsibility: scope
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: >-
      The invariant triple (class number, regulator, discriminant) of a cheap-map
      ring, followed through enlargement of the ring.
    lossiness: >-
      Lossy - many fields share a triple - and compatibly so under the operations the
      census uses. See mechanism. Not a change of coordinates.
    propagation: >-
      Deterministic under the census's operation (enlargement/specialisation of the
      field). Undefined under the group law on E, and no claim is made there.
    survival_score: >-
      Survives to every degree and every discriminant, which is exactly why the
      closure is complete rather than partial; it dissolves at the non-commutative
      boundary, which is where the forward guidance points and which is named rather
      than left implicit.

  null_object_control: >-
    NULL-1, THE SHAM FIELD (blocking, same shape). Run the whole accounting on a ring
    that is NOT an order in a number field - the free commutative monoid on the
    primes below B with a random surjection onto Z/n and a formal "norm" - where
    there is no class group, no regulator and no discriminant. The formula (E) must
    be INAPPLICABLE there and the measured cost must be the plain birthday bound; if
    the sham object also returns n^{1/2} by the same accounting path, the
    cancellation in (F) is arithmetic bookkeeping rather than the class number
    formula, and the closure is void.
    NULL-2, THE SCRAMBLED-INVARIANT NULL (blocking). Predict costs from triples
    (h, Reg, disc) randomly permuted across the field ladder. The predicted costs must
    DIFFER from the true ones; if they do not, the observable is not carrying the
    information (F) says it carries.
    COMPARATOR 1 (blocking) - parallel Pollard rho with distinguished points and the
    negation map on the identical toy instances in identical charged units.
    COMPARATOR 2 (blocking) - BSGS on the identical instances with memory reported.
    POSITIVE CONTROL A (blocking) - the degree-2 slice measured by
    IDEA-20260904-982159, which must agree cell for cell.
    POSITIVE CONTROL B (blocking) - a field pair MATCHED on h Reg / sqrt|disc| but of
    different degree, whose measured costs must agree; this is the observation
    collision run as an experiment.
    CONTROL C - a field with class number 1 and small regulator (a Euclidean
    imaginary quadratic field, or a small-discriminant cubic), where the penalty is
    absent by construction and the formula must still return n^{1/2} because the
    discriminant is then small.

  predictions:
    - metric: >-
        P1 - measured table size at first collision divided by
        n^{1/2}(h Reg/sqrt|disc|)^{1/2}, over a ladder of at least twelve number
        fields spanning degrees 2, 3 and 4 and four decades of discriminant, at six
        prime orders from 2^17 to 2^27
      direction: different
      minimum_effect: >-
        Ratio in [1/4, 4] at every field and every n records the CLOSURE branch. A
        ratio below 1/10 at three or more fields, decreasing with discriminant,
        records the LEAD branch and routes to independent review. Between is
        INCONCLUSIVE in advance. Pre-registered tolerances from the n^{o(1)} slack at
        toy sizes; NOT measurements.
    - metric: >-
        P2 - the fitted dependence of measured cost on log(h Reg/sqrt|disc|) at fixed
        n, across the field ladder
      direction: different
      minimum_effect: >-
        Slope 1/2 within 0.1 confirms (E) as the right functional form. A slope
        indistinguishable from 0 would mean the cost does not depend on the invariants
        at all and (E) is wrong; a slope well above 1/2 would mean the penalty is
        worse than derived and the closure is stronger than claimed.
    - metric: >-
        P3 - the degree-3 and degree-4 unit-rebalancing success rate, i.e. the
        fraction of smooth factorisations that admit a height-balanced unit
        representative within the declared cost budget
      direction: different
      minimum_effect: >-
        Above 0.5 at every tested field validates the (D) step. Below 0.1 means the
        rebalancing does not work as claimed, the census closes at degree 2, and the
        scope of (F) shrinks accordingly - a real and informative negative that costs
        a few CPU-hours.
    - metric: >-
        P4 - the matched-pair test, POSITIVE CONTROL B
      direction: different
      minimum_effect: >-
        Measured costs within a factor 2 of each other. A larger gap means some
        invariant outside the triple enters and the census is incomplete; that is the
        cleanest falsifier of (B) available.
    - metric: >-
        P5 - NULL-1 and NULL-2 outcomes
      direction: different
      minimum_effect: >-
        NULL-1 must be inapplicable or return the plain birthday bound by a DIFFERENT
        route; NULL-2 must produce predictions that differ from the true ones. Failure
        of either voids the corresponding half of the closure.

  minimal_test:
    design: >-
      STAGE 0 (ZERO COMPUTE, HARD GATE, ONE DAY). Write (B) through (F). Check the
      r = 1 and r = 2 reproduction slices by substitution. Run NULL-2 at zero compute.
      If the degree-2 slice does not reproduce IDEA-20260904-982159's formula the
      derivation is wrong and the record stops.
      STAGE 1 (ZERO COMPUTE). Write (G1), (G2), (G3) with what each open class would
      have to supply. This is the forward-guidance half of the closure standard and it
      is a deliverable in its own right.
      STAGE 2 (HOURS TO A DAY). Build the field ladder - twelve fields of degrees 2,
      3, 4 with (h, Reg, disc) computed exactly by standard class-group software and
      archived - and run the meet-in-the-middle to first collision at six prime orders
      from 2^17 to 2^27, measuring P1, P2, P3, P4 against the two blocking
      comparators on the identical instances in identical charged units, plus NULL-1.
      STAGE 3 (ONLY IF A LEAD BRANCH FIRES). Stop and route to independent review.
      NO LIVE KEY, WALLET OR DEPLOYED SYSTEM. Self-generated toy instances only.
    controls:
