idea:
  id: IDEA-20260802-004
  question_id: RQ-ECDLP-002
  title: >-
    Crypto-scale validation of HEUR-DS-1 is FEASIBLE - full factorization of Semaev
    intermediates at a 256-bit public curve, with the encoding choice exposed as the
    thing that decides feasibility
  class: measurement
  claim: >-
    THIS RECORD ATTACKS A BELIEF THIS CAMPAIGN HAS ACTED ON FOR TWENTY-SEVEN BATCHES.
    Every artifact in the smoothness lane treats crypto-scale validation of HEUR-DS-1 as
    out of reach - the EXP-LPF-001 contract's uncertified class V6 states that the toy
    D of 2**32 and 2**40 transfers upward by no argument the contract offers, and no
    record anywhere in the corpus proposes a crypto-scale sampling design. THE CLAIM IS
    THAT THE OBSTACLE IS THE ENCODING, NOT THE SCALE, AND THAT IT IS REMOVABLE.
    Concretely - on a public 256-bit curve (NIST P-256 parameters; no key material, no
    discrete logarithm computed or attempted), sampling N = 20000 half-arity Semaev
    partial-map intermediates and encoding each as a SINGLE field-sized integer of about
    256 bits (ENC-N, the norm/resultant encoding) rather than as the frozen ENC-B value
    e_1 * p + e_2 + 1 of about 512 bits, admits FULL FACTORIZATION by a tiered pipeline
    at a censoring rate below 2 percent within a pre-registered budget. It further
    claims that the empirical CDF of log(largest prime factor)/log(D) on that arm has
    Kolmogorov distance at most 0.02 from the SADDLE-POINT-CORRECTED absolute reference
    of IDEA-20260802-001, and lies within the [2nd, 199th] order-statistic band of 200
    matched-bitlength uniform-integer replicate sample sets factored by the IDENTICAL
    pipeline. AND IT CLAIMS, AS A SEPARATE AND EQUALLY REPORTABLE RESULT, THAT ENC-B
    ITSELF IS INFEASIBLE AT CRYPTO SCALE BY FULL FACTORIZATION - a 512-bit general
    integer cannot be factored 20000 times within any budget this program will have -
    which means the toy contract's own encoding does not scale and that fact is a
    finding about the toy contract's transferability, not a limitation of this proposal.
  mechanism: >-
    The exemplar's section 4.2 validates its heuristic at SQIsign-sized parameters by
    using the Deuring correspondence as a sampling oracle - the point being that the
    quantity whose distribution matters was reachable at scale through a correspondence
    even though the direct computation was not. THE SEMAEV CASE NEEDS NO CORRESPONDENCE
    AT ALL. A half-arity Semaev intermediate is a pair of symmetric functions of the
    roots of a quadratic over F_p; computing it at p about 2**256 costs a handful of
    field operations. What has never been asked in this program is what INTEGER that
    field data should be turned into, and that choice - not the curve size - decides
    whether the distribution can be measured.
    ENC-B maps (e_1, e_2) bijectively into [1, p**2], giving 512-bit integers at crypto
    scale. Full factorization of 20000 random 512-bit integers is out of reach. ENC-N
    maps the intermediate to a single field-sized quantity of about 256 bits - 77 decimal
    digits - which is the regime the exemplar itself worked in, where a tiered pipeline
    (trial division, Pollard p-1 and rho, ECM at increasing B1, then a self-initializing
    quadratic sieve on the surviving cofactor) factors the overwhelming majority quickly
    because a random integer's second-largest prime factor is typically small. THE COST
    OF THE CHANGE IS NOT ZERO AND IS STATED - ENC-N is a DIFFERENT random variable from
    ENC-B, so this measurement does not replicate the toy one and may not be presented as
    a crypto-scale confirmation of any toy reading. It measures HEUR-DS-1's own quantity
    at the scale HEUR-DS-1 is used at, under an encoding that must be justified on its
    own terms in the contract.
    THE DESIGN DISCRIMINATES FOUR OUTCOMES.
    (a) BOTH ARMS TRACK THE ABSOLUTE REFERENCE - HEUR-DS-1's toy instance is consistent
    at crypto scale under ENC-N, which is the first crypto-scale distributional evidence
    this campaign would have produced, and the target profile's C12 gate becomes
    satisfiable for this lane.
    (b) THE REAL ARM DEPARTS AND THE UNIFORM ARM DOES NOT - a Semaev-specific departure,
    with its DIRECTION reported, because smoother-than-reference and rougher-than-
    reference have opposite consequences for an index calculus and are never one outcome.
    (c) BOTH ARMS DEPART FROM THE ABSOLUTE REFERENCE TOGETHER - the deviation is shared,
    which a two-sample design is blind to by construction (standing limit U1), and it is
    ONLY the absolute reference that makes this branch visible. It would indicate the
    reference is still wrong at 256 bits after the IDEA-20260802-001 repair.
    (d) CENSORING EXCEEDS THE BUDGET - the feasibility claim is falsified, the achieved
    censoring rate is the deliverable, and the distributional question is reported as
    NOT MEASURED rather than estimated from the uncensored part.
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-02'
    corpus_paths_grepped:
    - ledger/proposals
    - ledger/hypotheses
    - experiments/EXP-LPF-001
    - ledger/decisions
    grep_results:
    - >-
      No corpus record proposes crypto-scale sampling of Semaev intermediates. The
      nearest is IDEA-20260731-009, a crypto-size FIRST-FALL-DEGREE correspondence,
      which concerns Gröbner degree behaviour rather than smoothness and is a different
      quantity.
    - >-
      H-LPF-001 states plainly that no experiment in this campaign has ever factored an
      integer and that no largest prime factor of any Semaev intermediate has been
      computed at any scale in twenty-four batches. RUN-LPF-001-calib subsequently
      factored 68950136 integers at verified fraction 1.0, but on the UNIFORM arm and at
      toy D only.
    - >-
      The EXP-LPF-001 uncertified class V6 states that nothing measured at toy D
      transfers upward by any argument the contract offers. This record does not dispute
      that; it proposes measuring at the other scale instead of transferring.
    literature_verified: []
    conclusion: >-
      Adaptation of the exemplar's A7 crypto-scale heuristic-validation pattern to this
      program's own heuristic. Status `unverified` because no literature was checked for
      prior measurements of Semaev intermediate smoothness at cryptographic size, and
      such measurements may exist.
  assumptions:
  - >-
    Public curve parameters only (NIST P-256). NO private key, NO discrete logarithm,
    NO relation is computed toward a solve. The experiment computes field arithmetic and
    factors integers; it runs no search of any kind.
  - >-
    The ENC-N encoding is specified, justified and frozen in the contract BEFORE
    sampling, together with the argument for why its distribution is the one HEUR-DS-1
    is about. An encoding chosen after seeing data is a contract violation.
  - >-
    A per-sample wall-clock cap exists and censoring is reported as censoring. A capped
    sample is not a measurement and is never imputed.
  - >-
    Every reported largest prime factor is re-verified - each factor primality-tested
    and the product asserted equal to N - at 100 percent of samples, carrying forward
    H-LPF-001's own standard.
  predictions:
  - metric: censoring_rate_ENC_N
    direction: lower
    minimum_effect: >-
      '<= 0.02 at N = 20000 within the pre-registered per-sample cap. This is the
      FEASIBILITY prediction and it is the one this record is really making. A rate
      above 0.10 falsifies it outright; a rate between 0.02 and 0.10 is a partial
      feasibility result reported with the achieved number.'
  - metric: ks_distance_real_arm_to_saddle_reference
    direction: same
    minimum_effect: >-
      '<= 0.02 against the IDEA-20260802-001 corrected absolute reference. This is the
      ABSOLUTE limb and it is what U1 requires; it is not satisfiable by agreement with
      the uniform arm.'
  - metric: real_arm_position_in_uniform_replicate_band
    direction: same
    minimum_effect: >-
      'Inside the [2nd, 199th] order-statistic band of 200 matched-bitlength uniform
      replicate sample sets at the same N and the same D. This is the RELATIVE limb and
      it is explicitly declared NON-CERTIFYING for the absolute claim.'
  - metric: smoothest_sample_tail_check
    direction: same
    minimum_effect: >-
      'The smoothest of 20000 samples has a largest prime factor B whose predicted
      probability under the corrected reference lies within a factor of 4 of 1/20000.
      This is the exemplar''s own tail consistency check and it is a point prediction
      that can fail.'
  - metric: pipeline_identity_control
    direction: same
    minimum_effect: >-
      'The uniform arm and the real arm pass through the IDENTICAL factorization
      pipeline with the identical cap, and the pipeline''s per-arm timing distributions
      are reported. A pipeline that spends systematically different effort on the two
      arms induces differential censoring, which would manufacture exactly the departure
      the experiment is looking for - so per-arm censoring rates are reported separately
      and a difference above 0.01 voids the comparison.'
  - metric: ENC_B_infeasibility_demonstration
    direction: same
    minimum_effect: >-
      'On a pre-registered pilot of 200 ENC-B (about 512-bit) samples at the same cap,
      the censoring rate is >= 0.5. This is a POINT PREDICTION THAT CAN FAIL and it is
      what converts the claim that ENC-B does not scale from an assertion into a
      measurement.'
  minimal_test:
    design: >-
      (1) Freeze ENC-N with its justification, the pipeline tiers, the per-sample cap,
      N = 20000, and the reading rule. (2) Draw 20000 half-arity intermediates from a
      frozen factor base on P-256 and encode under ENC-N. (3) Draw 200 replicate sample
      sets of matched-bitlength uniform integers, N each. (4) Factor all arms through
      the identical pipeline with 100 percent re-verification. (5) Run the 200-sample
      ENC-B pilot at the same cap. (6) Report the CDFs, the KS distances against the
      corrected absolute reference, the order-statistic band positions, per-arm
      censoring, and the tail check.
    controls:
    - >-
      ABSOLUTE REFERENCE from IDEA-20260802-001, which is what makes outcome (c)
      visible. Without it this design inherits exactly the blindness recorded at
      DEC-20260801-008.
    - >-
      MATCHED-BITLENGTH UNIFORM REPLICATES as the calibration of the apparatus, declared
      NON-CERTIFYING for the absolute limb in advance, carrying ABS-REL-LPF-1's
      discipline forward verbatim in spirit.
    - >-
      DIFFERENTIAL-CENSORING CONTROL - per-arm censoring rates reported separately with
      a hard 0.01 difference gate.
    - >-
      100 PERCENT FACTORIZATION RE-VERIFICATION; a factorization not verified is not a
      measurement.
    - >-
      SECOND-PATH VERIFICATION of a random subsample of at least 200 largest prime
      factors by an independent factorization implementation, per the refutation-artifact
      requirement any adverse reading would carry.
    required_metrics:
    - per-arm censoring rate and the censoring-difference gate value
    - empirical CDF of log(lpf)/log(D) per arm, machine-readable
    - KS distance to the corrected absolute reference, per arm
    - order-statistic band position of every certifying statistic
    - smoothest-sample tail check with its predicted probability
    - ENC-B pilot censoring rate
    - factorization verification fraction (must be exactly 1.0 on uncensored samples)
    - wall time and CPU-hours per arm
  falsification_conditions:
  - >-
    'M1 - censoring above 0.10 at the pre-registered cap: THE FEASIBILITY CLAIM IS
    FALSIFIED. The deliverable becomes the achieved censoring rate and the distributional
    question is NOT MEASURED. This is a real negative and it would tell the campaign
    that crypto-scale is genuinely out of reach for this quantity, which is worth
    knowing after twenty-seven batches of assuming it without checking.'
  - >-
    'M2 - the real arm departs from the corrected absolute reference by KS > 0.02 while
    the uniform arm does not: a Semaev-specific crypto-scale departure. DIRECTION MUST BE
    STATED. Requires independent review before it is described anywhere as a result, and
    a refutation artifact with second-path verification of the driving samples.'
  - >-
    'M3 - both arms depart together: the reference is still wrong at 256 bits and
    IDEA-20260802-001 did not finish the job. Reported as a reference finding, not as a
    Semaev finding.'
  - >-
    'M4 - per-arm censoring differs by more than 0.01: the comparison is void, because
    differential censoring can manufacture the target effect. Instrument outcome.'
  - >-
    'M5 - the ENC-B pilot censors BELOW 0.5: the claim that the toy contract''s encoding
    does not scale is falsified, and the correct follow-on is to measure ENC-B at scale
    directly, which would be strictly better than ENC-N because it replicates the toy
    quantity.'
  confounders:
  - >-
    ECM's success probability depends on the factor size it is tuned for, so a pipeline
    tuned on the uniform arm can be systematically better or worse on the real arm if
    the real arm's factor-size distribution differs - which is precisely the hypothesis
    under test. The tiers must be fixed by a schedule that depends only on the integer's
    bitlength and the elapsed budget, never on any property of the arm.
  - >-
    The factor base on P-256 must be specified; a small-x window factor base and a
    random factor base are different objects and the RT049-B6 determinism-versus-window
    confound travels to crypto scale unchanged. This record does NOT resolve it and says
    so; running both bases is a declared option whose cost doubles the budget.
  - >-
    ENC-N is not ENC-B. Any statement relating this measurement to EXP-LPF-001's real arm
    is a statement about two different random variables and must be written as one.
  interpretation_limits:
  - >-
    THIS MOVES NO EXPONENT. It is the C12 heuristic-validation artifact that the target
    profile requires before ANY conditional exponent claim in this lane can be promoted
    past `analyzed`, and it is proposed on that ground.
  - >-
    A favourable outcome validates HEUR-DS-1's instance UNDER ENC-N AT P-256 and nothing
    else. It does not validate the toy instance, does not retroactively strengthen any
    toy reading, and does not make any asymptotic statement.
  - >-
    The design has power over the largest-prime-factor MARGINAL. It has NO power over the
    joint law of the two largest prime factors, over the full factorization pattern, or
    over arithmetic properties of the factors - the exact class of blind spot RT049-B1
    identified in a neighbouring measurement, restated here for a different statistic
    rather than rediscovered later.
  - >-
    No discrete logarithm is computed. Nothing in this experiment constitutes an attack
    on P-256 or on any deployed system, and the scope statement must say so explicitly.
  heuristic_assumptions:
  - id: HEUR-DS-1-CRYPTO
    statement: >-
      For half-arity Semaev partial-map intermediates on a curve over a prime field of
      about 256 bits, encoded under ENC-N, the probability that the encoded integer is
      B-smooth is within the frozen constant factor 8 of the corrected absolute
      smoothness reference at u = log D / log B, for u in a stated range.
    rigorous_support: >-
      The classical distribution side is Hildebrand's Psi(x,y) = x rho(u)(1 +
      O(log(u+1)/log y)) with the Hildebrand-Tenenbaum saddle-point estimate as the
      finite-y evaluation (see IDEA-20260802-001; primary sources unread, KN-LIT owed).
      There is NO rigorous bound transferring integer-smoothness distribution to Semaev
      intermediates, and that gap is exactly what the heuristic asserts and this
      experiment measures. Stating a heuristic without a rigorous half is honest here
      only because the missing half IS the heuristic.
    validation_plan: >-
      THIS EXPERIMENT IS THE VALIDATION ROUTE, AT CRYPTOGRAPHIC SCALE, WHICH IS THE
      POINT. Sampling method - direct field arithmetic on public P-256 parameters, no
      correspondence required. Scale - N = 20000 at D about 2**256. Comparison
      distribution - the corrected absolute reference, with 200 matched uniform replicate
      sets as apparatus calibration only. Tail checks - the smoothest of 20000 against
      its predicted probability. Censoring - reported, never imputed. THIS IS NOT TOY
      SCALE AND MUST NOT BE DESCRIBED AS SUCH; equally, it is one curve, one encoding,
      one factor base, and it must not be described as more than that.
  target_complexity:
    time_exponent: >-
      n/a - no algorithm is proposed and no exponent is claimed or moved. The quantity
      measured is the inverse-success-probability factor that appears in the
      per-attempt-cost times P0**-1 bookkeeping of any conditional exponent claim in the
      Gaudry-Semaev lane.
    memory_exponent: n/a
    best_known: >-
      n/a as an attack. As a validation artifact, the incumbent in this program is
      NOTHING - HEUR-DS-1 has never been validated or refuted at any scale, as
      H-LPF-001's own validation_status records.
    hidden_overhead: >-
      The factorization pipeline's cost is the entire cost and it is disclosed as a
      budget rather than hidden in an asymptotic. Censoring is the honest name for the
      part of the distribution the budget cannot reach, and it is reported per arm.
    tradeoff_note: >-
      Sample size trades against censoring rate at fixed budget. The contract fixes N and
      the cap in advance; reducing N after seeing censoring would be post-hoc scope
      reduction and is forbidden.
  dominated_by: >-
    n/a - no attack result is claimed and no Pareto point is occupied. Written as
    `n/a (no result claimed)` rather than as an unchecked null.
  sota_delta: >-
    Zero on every ECDLP cost axis. The delta is evidential - this program moves from
    ZERO crypto-scale distributional measurements of any Semaev quantity to one, or to a
    measured demonstration that the measurement is infeasible at a stated budget. Both
    are worth more than a twenty-eighth toy batch.
  instrument_failure_guards:
    decision_variable: >-
      The censoring rate (feasibility) and the KS distance to the corrected absolute
      reference (distribution).
    what_would_make_it_vary: >-
      Censoring varies with the integer's BITLENGTH under the fixed pipeline - which is
      why the ENC-B pilot at 512 bits is run as a contrast and is predicted to censor at
      least 25 times more heavily. KS distance varies with the actual factorization
      behaviour of the sampled integers. Neither is a closed form in the protocol's
      parameters.
    power_against: >-
      Departures in the largest-prime-factor marginal at the sampled N, at the tested u
      range, under ENC-N, on one curve, with one factor base.
    no_power_against: >-
      The joint law of the two largest prime factors; the full factorization pattern;
      departures below the resolution 1/20000; the region beyond the censoring boundary;
      the determinism-versus-small-x-window confound; ENC-B's own distribution at crypto
      scale, which is measured only through a 200-sample feasibility pilot.
    demonstrated_movement: >-
      BY MEASUREMENT - the ENC-B pilot at 512 bits versus the ENC-N arm at 256 bits is a
      built-in perturbation of the decision variable with a predicted direction and
      magnitude, so the censoring statistic is demonstrated responsive inside the
      experiment. For the distributional statistic, the 200 uniform replicate sets supply
      a measured spread, and a planted smoothness excess at a pre-registered gamma ladder
      (carried over from the EXP-LPF-001 plant machinery, which already has a movement
      table) supplies the certified alternative class - with the explicit caveat that
      that class is a MARGINAL plant and certifies nothing about joint alternatives.
    lessons_addressed: >-
      Lesson 2 - the reference is the corrected one, so a correct null CAN satisfy the
      threshold; the campaign has already measured that the asymptotic reference cannot
      be satisfied at u = 6 even by a known-uniform sample. Lesson 3 - the alternative
      class is declared as marginal-only, in advance, in the same words the campaign
      learned them. Lesson 4 - the ENC-B pilot and the gamma ladder are perturbations
      with predicted movement. Standing limit U1 - the absolute reference is what makes
      branch (c) visible, and the two-sample comparison is declared non-certifying.
  estimated_cost:
    implementation: medium
    compute: high
  compute_budget_note: >-
    Dominated by factorization. 20000 real-arm samples plus 200 x 20000 uniform replicate
    samples is 4.02 million 256-bit factorizations, which is the largest job this
    campaign would have run and MUST be pilot-gated - a 500-sample pilot on each arm
    measuring median and 95th-percentile per-sample cost, with the full run authorized
    only if the projection fits the declared budget. A pilot abort is an infrastructure
    signal and never a result. If the projection does not fit, the correct reduction is
    fewer UNIFORM REPLICATE SETS (which are calibration) and never fewer real samples.
  recommended_priority: medium
  dependencies:
  - >-
    BLOCKING - IDEA-20260802-001 must land first. Running this against the uncorrected
    asymptotic reference would repeat instrument failure 2 at forty times the cost.
  proposed_by: idea-generator
  proposed_at: '2026-08-02'
  inference:
    requested_policy: idea-generation
    resolved_model_id: claude-opus-5
    reasoning_effort: null
    fallback_used: true
    fallback_reason: >-
      This Claude Code harness cannot resolve the policy aliases in
      orchestration/model-policies.yaml; subagent frontmatter supports only Claude
      models. Recorded, never silently substituted (AGENTS.md rule 11).
    degraded_allowed: false
    degraded_requirements: []
    model_verified: false
    model_verified_reason: >-
      No adapter probe receipt exists for this session.
