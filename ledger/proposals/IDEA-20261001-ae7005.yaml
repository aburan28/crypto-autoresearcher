# =============================================================================
# IDEA-20261001-ae7005 -- Halving-step vs doubling-step rho collision latency
# ratio on toy Koblitz. Calibrates KR-RHO-6654ba at program toy scale.
# =============================================================================
idea:
  id: IDEA-20261001-ae7005
  question_id: RQ-BINSTD-b6f698
  added: '2026-10-01'
  status: proposed
  approved_by: null
  title: >-
    DOES A HALVING STEP BEAT A DOUBLING STEP ON TOY KOBLITZ RHO WALKS?
    On stdlib (or already-admitted) toy Koblitz cells n∈{17,19,23}, measure
    the ratio of mean iterations-to-distinguished-point (or iterations-to-
    collision under a frozen DP mask) for a halving-step walk versus a
    doubling-step walk at matched walk-constant settings.

  class: heuristic_validation

  claim: >-
    KR-RHO-6654ba reports point halving as a cheaper binary-curve rho step
    in the literature. CLAIM: at each toy n∈{17,19,23}, over ≥30 independent
    walks with a frozen distinguished-point mask and matched r-adding table
    size, the ratio T_halving / T_doubling of mean iterations-to-DP is
    ≤ 0.85 — OR the ratio is in (0.85, 1.15] and the steps are recorded as
    equivalent at this scale — OR > 1.15 and doubling wins. CLAIM TIER:
    heuristic_validation. NO break. NO exponent move. NO n≥131 transfer.
    NO FPGA/GPU claim.

  mechanism: >-
    OBJECT FRAME. Representation: affine (or López–Dahab) points on a toy
    Koblitz curve with known order; tracked state is the usual rho pair
    (aP+bQ, coefficients). Operation set: r-adding walk steps that are either
    point-doubling class or point-halving class (KR-RHO-6654ba), plus a
    frozen DP predicate. Trichotomy: Class I partial-action — the walk is
    F1 walk-collision used as a component, not as a new lens; what is new is
    the calibrated latency ratio at program toys. Lossy-projection: DP mask
    discards non-distinguished points; discard is compatible with the walk.
    OFF-LIMITS: claiming a generic-group speedup (KR-RHO-13bf67); Frobenius
    class √(2n) re-measure (IDEA-20261001-833e78). WHAT IS NEW: a
    pre-registered halving/doubling iterations-to-DP ratio band at BINSTD toys.

  novelty_status: unverified
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    frontier_map_commit: 'ea7edcdd50739ee1512f09d4347e3d52c55d14e7'
    rows_checked:
      - KR-RHO-6654ba
      - KR-RHO-cd86f5
      - KR-RHO-037e22
      - KR-RHO-6239aa
      - KR-RHO-13bf67
