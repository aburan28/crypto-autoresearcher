  assumptions:
    - Toy Koblitz cells with known order; stdlib-only arithmetic preferred.
    - Same DP mask and table size across arms; wall-clock secondary only.
    - Halving defined only where the curve admits a unique/halving oracle as in the frozen contract.

  heuristic_assumptions:
    - id: HEUR-BINSTD-ae7005-H1
      formal_statement: >-
        FORALL n∈{17,19,23}, over ≥30 independent walks per arm with frozen
        DP mask M_n and matched r-adding table size R: mean_iters_to_DP(halving)
        / mean_iters_to_DP(doubling) ≤ 0.85.
      random_model_justification: >-
        Rigorous: iterations-to-DP is an empirical hitting time under a fixed
        walk kernel. Classical: KR-RHO-6654ba and r-adding theory
        (KR-RHO-cd86f5) treat step cost as the dominant constant; whether
        halving's algebraic cheapness yields ≤0.85 hitting-time ratio at these
        toys is the transfer hypothesis under test.
      supporting_results:
        - KR-RHO-6654ba
        - KR-RHO-cd86f5
      validation_experiment_ids: []
      falsification_condition: >-
        Ratio in (0.85, 1.15] (equivalence) or > 1.15 (doubling wins), OR
        scramble of step labels destroys the separation (artifact).

  predictions:
    - metric: mean_iters_to_DP_ratio_halving_over_doubling
      direction: lower
      minimum_effect: '≤ 0.85 at each toy n'
    - metric: bootstrap_CI95_ratio
      direction: exclude_one
      minimum_effect: 'CI95 upper bound ≤ 0.85 when claiming win'

  minimal_test: >-
    Stage 0: freeze curve cells, DP mask M_n, table size R, seeds. Stage 1:
    n=17, ≥30 walks/arm, report means + CI. Stage 2: n=19,23. Budget: ≤40
    runs, ≤6 CPU-hours. Stop on order-pin mismatch.

  controls:
    - ctl_matched_DP_mask_and_table_size
    - ctl_identical_seeds_across_arms_where_applicable
    - null_scrambled_step_labels
    - ctl_order_pin_hash

  falsification_conditions:
    - Claiming sub-√ generic speedup (forbidden by KR-RHO-13bf67).
    - Transferring toy ratios to ECC2K-130 / n≥131 without a new contract.
    - Editing M_n or R after seeing ratios.

  target_complexity:
    time_exponent: >-
      No exponent claimed. Constant-factor step calibration only; rho remains
      Θ(√|#E|) up to walk constants (KR-RHO-13bf67 / KR-RHO-cd86f5).
    memory_exponent: O(1) DP filter + O(R) r-adding table
    best_known: >-
      KR-RHO-6654ba qualitative halving step; KR-RHO-cd86f5 walk constants;
      KR-RHO-037e22 Frobenius-class √(2m) is a different constant.
    hidden_overhead: Halving oracle implementation cost at toys.
    tradeoff_note: Iterations vs wall-clock may disagree if halving is slower in software.

  estimated_cost:
    implementation: medium
    compute: low
    qualification: >-
      Estimate. Toy walks; under six CPU-hours if stdlib cells exist.

  asymptotic_claim: null

  dominated_by: >-
