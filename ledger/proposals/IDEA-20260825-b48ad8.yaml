  batch: EC-STRUCTURE-20260825
  cluster: 'C1-frame: what an instance actually reveals'
  title: 'PERFECT RANDOM SELF-REDUCIBILITY MEANS NO ECDLP INSTANCE IS EVER SPECIAL: AGL(1, N) acts computably
    and transitively on instances of a fixed curve, so all exploitable structure is curve-level -- turn
    that into a universal null control that every mechanism measurement in this program must pass'
  class: control
  claim_ceiling: unverified_zero_run_structural_proposal_only_no_experiment_no_implementation_no_status_change_no_novelty_conclusion
  status: proposed
  novelty_status: unverified
  novelty_note: 'Random self-reducibility of the DLP is textbook and is recalled, not verified. What is
    proposed as new here is its use as an INSTRUMENT: an invariance test that any measured advantage must
    satisfy, which this program does not currently run and which would have been cheap to run on several
    past measurements.'
  claim:
    semantic_part: For fixed (E, P) with prime N, the map (P, Q) -> (uP, vQ + wP) with u in (Z/N)^*, v
      in (Z/N)^*, w in Z/N is computable in O(polylog N) group operations and sends the unknown k to (vk
      + w)u^(-1); the induced AGL(1, N) action is transitive on instances, so every instance of a fixed
      curve is equivalent to every other.
    evaluator_part: 'Unestablished: that applying the resulting invariance test to the ledger''s existing
      mechanism measurements changes any of their readings. That is the measurement this record proposes.'
    end_to_end_ecdlp_claim: false
    breakthrough_claim: false
  mechanism:
  - 'State the action and verify transitivity: k -> (vk + w) u^(-1) reaches every residue from every residue.'
  - 'Consequence 1: no ECDLP instance on a fixed curve is harder or easier than another, so any proposal
    whose advantage depends on the TARGET (a special Q, a low-weight k, a structured index set) is measuring
    presentation, not difficulty.'
  - 'Consequence 2: all exploitable structure is a function of (p, E) alone -- the curve and its moduli
    -- which is exactly where the isogeny-class and (p, t) census lanes look.'
  - 'Instrument: for any mechanism claiming advantage A on instance set I, re-measure A on g.I for random
    g in AGL(1, N). A that does not survive is an artifact of instance presentation. This costs one extra
    arm and is the cheapest null the program has available.'
  - Apply the instrument retrospectively to the target-shift, index-set and coordinate-word families already
    in the ledger.
  lossy_projection_test:
    tracked_object: the orbit of an instance under AGL(1, N)
    what_is_discarded: everything that distinguishes instances within one curve
    propagation: 'exact: the action is a group action computable in both directions'
    verdict: PASSES, and is maximally lossy -- the quotient is a single point, which is precisely the
      content of the control.
  predictions:
  - id: P1
    status: established_formula
    statement: AGL(1, N) acts transitively on instances of a fixed (E, P).
  - id: P2
    status: unestablished
    statement: At least one advantage measured in the ledger's target-shift or index-structure families
      fails the invariance test.
  - id: P3
    status: unestablished
    statement: No advantage that survives the invariance test is currently recorded as anything other
      than curve-level.
  minimal_discriminating_test:
    status: specified_not_run
    test: Re-run one existing mechanism measurement with a randomized instance presentation drawn uniformly
      from the AGL(1, N) orbit, holding curve, seed policy and budget fixed.
    pass: 'The advantage is statistically indistinguishable before and after randomization: the mechanism
      is curve-level.'
    fail: 'The advantage vanishes under randomization: it was a presentation artifact, and the original
      reading is withdrawn for that reason.'
  controls:
  - A deliberately presentation-dependent positive control (an advantage keyed to small k) that the test
    MUST destroy.
  - A genuinely curve-level positive control (the |Aut|-quotient rho gain) that the test must NOT destroy.
  - The identity element of the action as a no-op arm, to separate the test's own variance from its effect.
  confounders:
  - Randomizing the presentation also re-randomizes the walk, so seed policy must be held fixed or the
    two effects are confounded.
  - An advantage that survives may still be an artifact of the curve sample rather than of the curve's
    structure.
  - Transitivity holds for prime N only; a cofactor breaks the argument.
  falsification:
    semantic: An instance family on a fixed curve, demonstrably outside the AGL(1, N) orbit of a generic
      instance, falsifies transitivity.
    evaluator: An implementation of the randomization that changes the budget or the seed policy invalidates
      that run only.
    not_falsification: The test destroying an advantage; that is a result, not a malfunction of the test.
  why_this_is_not_a_variant: 'IDEA-20260731-011 proposes a structure-destruction null using a same-shape
    null OBJECT. This is the complementary null: it keeps the object and randomizes the INSTANCE, using
    a group action that is exact and computable rather than a constructed surrogate, so it has no matched-shape
    modelling risk at all.'
  limits:
  - 'Zero-run: nothing here has been executed, measured, or independently reviewed.'
  - Proposal tier only; claim ceiling is stated in claim_ceiling and is not exceeded.
  - No end-to-end ECDLP algorithm, exponent, or cost claim is made.
  - 'Novelty is unverified: no literature screen was performed for this batch.'
  - Public parameters and toy instances only; no live key, wallet, or deployed target.
  sota_delta:
    checked: true
    delta: No improvement claimed. A control that, if it fires, REMOVES a claimed advantage rather than
      adding one.
    dominated_by:
    - Pollard rho on every realized end-to-end ECDLP cost in this ledger
    axes:
    - time
    - memory
    - preprocessing
    - queries
  estimated_cost: one extra experimental arm per measurement; negligible
