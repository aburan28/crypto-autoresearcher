idea:
  id: IDEA-20260816-778ba8
  question_id: RQ-ALR-001
  added: '2026-08-16'
  title: State the represented nN body and the compact target-divisor interface as two explicit size
    formulas in the divisor degrees n and N, the candidate count c and the characteristic p, tabulate
    their ratio at the three recorded toy curve families, and locate the parameter inequality at which
    the compact object stops being smaller than the body it claims to avoid
  class: theory
  claim: '(A) H-ALR-001, H-ALR-002, EV-ALR-001 and EV-ALR-002 all state that the standard represented
    routes retain an nN coefficient body and charge them at exponent B^(7/2) against a B^(5/2) rho
    proxy, but no ALR record states that body as a size formula in the divisor degrees. Avoiding a
    representation is a cost claim, and a cost claim whose avoided object has no formula cannot be
    checked, ranked, or falsified by a later reader. (B) The deliverable is a two-line ledger. SIZE_REP(n,N,p)
    = n*N*ceil(log2 p) bits, the remainder array R_P = A_P + V_T*B_P mod W held simultaneously across
    n source points and N target coefficient slots. SIZE_CPT(n,N,c,p) = (n + N + 2c + O(1))*ceil(log2
    p) bits, the interface that emits only the n source weights m_P and the 2c weighted moments named
    in H-ALR-002. (C) The ratio SIZE_REP/SIZE_CPT = nN/(n+N+2c) is then computed, not asserted, at
    the parameters actually recorded in EXP-ALR-001 and EXP-ALR-002: three curve families, replay
    seeds 16001, 16002, 18104, 18206, 18307, and 13 independent instances. (D) The same ledger is
    differentiated to find where compactness ends. The compact object stops being compact once 2c
    approaches nN/(n+N), that is once the candidate count itself grows like the body, and the entry
    fixes that crossover as an explicit inequality in (n,N,c) rather than as prose. (E) NOT CLAIMED:
    no attack, no break, no speedup, no rho or Shoup improvement, no assertion that a softly O(n+N+c)
    constructor exists or cannot exist, and no claim that the represented routes are optimal or that
    the 7/2 and 5/2 exponents are themselves correct. A size ledger prices two objects. It does not
    supply an algorithm that reaches the cheaper one, and a favourable ratio is not evidence that
    the cheaper one is constructible.'
  mechanism: 'STAGE 1, enumerate the routes. EV-ALR-001 names five represented routes: represented
    remainder, Newton trace, inverse certificate, triangular norm, and target half-GCD. For each,
    read the operation schedule off the recorded implementation reference and write the set of coefficient
    slots it must hold live at its widest point. This is a static read of the schedule, not a run.
    STAGE 2, write SIZE_REP per route as a closed form in (n, N, p), and keep the routes separate
    rather than quoting one nN figure for all five, because the ledger is falsified if two routes
    with different schedules are given the same body. STAGE 3, write SIZE_CPT from the interface that
    H-ALR-002 already specifies as its output: n weights plus 2c moments plus the locator coefficients.
    STAGE 4, instantiate both formulas at the recorded toy parameters and emit a table of ratios with
    the parameters printed alongside, so no number floats free of its instance. STAGE 5, solve SIZE_REP
    = SIZE_CPT for c and report the threshold surface. STAGE 6, run the identical accounting on the
    null object described in null_object_control and report both columns. The claim is established
    if the formulas reproduce the recorded slot counts exactly and refuted if any route''s measured
    widest live slot set disagrees with its formula at any recorded instance.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read in full ledger/questions/RQ-ALR-001.yaml, ledger/questions/RQ-ALR-002.yaml, ledger/hypotheses/H-ALR-001.yaml,
      ledger/hypotheses/H-ALR-002.yaml, ledger/evidence/EV-ALR-001.yaml, ledger/evidence/EV-ALR-002.yaml,
      experiments/EXP-ALR-002/specification.yaml and knowledge/open-problems/KN-OPEN-007.md. Greps
      run: grep -ril ''represented nN|nN body|memory exponent'' ledger/proposals/ (10 hits); grep
      -ril ''crossover'' ledger/proposals/ (6 hits inspected); grep -ril ''resultant'' ledger/proposals/
      (30 hits, titles listed); grep -ril ''subresultant'' ledger/proposals/ (1 hit).'
    results: The phrase about retaining an nN coefficient body occurs in H-ALR-001, H-ALR-002, EV-ALR-001
      and EV-ALR-002 and in no file under ledger/proposals/. Both ALR questions carry zero proposals.
      The nearest memory-charged framings found are IDEA-20260815-1ac849, which places lattice and
      Fourier nonce attacks on a single memory-charged frontier under RQ-ECDSA-87625f, and IDEA-20260808-51e40f,
      which states a crossover inequality c*log2(q) < 2*... under RQ-MQOM-001. IDEA-20260805-72bcb5
      charges block Wiedemann in bytes rather than core-years under RQ-RSA-afe33c. None of the three
      touches a target-divisor remainder array or the ALR divisor degrees. IDEA-20260808-da1428 is
      the only subresultant hit and is a guess-and-determine optimum under RQ-SDEG-001.
    verdict: 'UNVERIFIED. No agent here can read external literature, so nothing is asserted about
      what is published. Assembled from known parts: charging an algorithm in bits rather than in
      time is standard practice in this repository, as IDEA-20260805-72bcb5 and IDEA-20260815-1ac849
      show, and the nN figure itself is inherited verbatim from EV-ALR-001. Claimed new only as a
      placement: that the ALR lane''s central cost claim has never been written as a formula in its
      own divisor degrees, and that the crossover inequality where compactness ends has never been
      stated at all.'
  object_first_candidate:
    tracked_object: The coefficient-slot occupancy vector of the target-divisor remainder array. For
      each of the n source points P and each of the N target coefficient slots, one bit recording
      whether that slot must be materialised simultaneously by a given route. The object followed
      through the computation is the slot count and its peak, never the field values that would sit
      in the slots.
    lossiness: 'The projection discards every field value and retains only occupancy, so a route writing
      2 into a slot and a route writing 917 into the same slot become identical objects. This is genuinely
      lossy: the discarded values are precisely what determines the candidate factor, and no locator,
      no gcd and no norm can be recovered from occupancy alone. The retained part still propagates
      because peak occupancy is a static property of the schedule for every route named in EV-ALR-001,
      each of which touches a data-independent slot set, so the union of touched slots can be computed
      without executing the arithmetic.'
    propagation: One step of the target operation is the reduction of K_P = A_P + v*B_P modulo the
      squarefree target polynomial W on one x-injective chart. It carries an occupancy vector on N
      slots to an occupancy vector on N slots and unions in exactly the slots the reduction touches,
      which for a dense reduction is all of them. Composing the step over all n source points accumulates
      a union across source index as well, which is precisely why the represented watermark is nN
      and not N. Chart splitting adds a second N-block whose occupancy unions with the first.
    survival_score: 'Occupancy survives the whole represented route exactly, with zero decay, because
      it is computable without running the arithmetic. It dissolves at the first data-dependent control
      decision: a Euclidean loop whose trip count depends on coefficients, or an early exit on a unit
      certificate of the kind EV-ALR-001 records 151 of. The entry therefore claims survival only
      over the data-independent prefix of each route, states the instruction index at which each route
      becomes data-dependent, and treats the remainder as out of scope rather than assuming its watermark.'
  null_object_control: 'Replace the elliptic target divisor by a uniformly random squarefree monic
    polynomial over the same F_p of the same degree N, and the n source points by n uniformly random
    field elements, then run the IDENTICAL occupancy instrumentation and the IDENTICAL ratio formula
    in the same invocation. Here the null must MATCH, not differ: the accounting is a statement about
    the schedule, so the null arm must report the same nN watermark and the same (n+N+2c) interface
    size at matched (n,N,c). If the null''s ratio differs from the elliptic arm''s ratio at matched
    parameters, the ledger is silently measuring curve arithmetic rather than representation size,
    and the signal arm means nothing.'
  discriminated_from:
  - IDEA-20260805-72bcb5 charges the number-field-sieve linear algebra in bytes and derives a sequential-depth
    floor; it prices a published record on a different problem and never mentions a divisor remainder
    array, whereas this entry prices two objects internal to the ALR lane at the parameters ALR already
    ran.
  - IDEA-20260815-1ac849 builds a memory-charged frontier for nonce attacks so that a winner can change
    with bias level; it is a comparison between two attacks, while this entry compares an algorithm's
    materialised state against its own output interface and claims no attack on either side.
  - IDEA-20260808-51e40f states a crossover inequality for Weil descent versus Groebner solving; the
    shared move is only the algebraic form of a crossover, and its parameters, objects and lane are
    disjoint from ALR.
  - EV-ALR-001 and EV-ALR-002 themselves, which assert the nN body as a verdict inside an observation
    list; this entry converts that verdict into a formula plus a threshold and is falsifiable against
    the same recorded instances, which the verdict is not.
  - The blacklisted RQ-INSTR cost-model and machine-variance audits, which measure this program's
    timing instrument; nothing here is timed, and the deliverable is a bit count derived from a schedule.
  assumptions:
  - The five represented routes named in EV-ALR-001 have schedules whose live-slot sets are data-independent
    up to a stated instruction index.
  - A field element of F_p is charged at ceil(log2 p) bits uniformly, with no packing and no shared-representation
    discount.
  - The compact interface's output is exactly the n source weights, the 2c weighted moments and the
    degree-c locator, as H-ALR-002 states, and nothing else must be emitted for a downstream consumer.
  - The recorded toy parameters in EXP-ALR-001 and EXP-ALR-002 are readable from the committed specification
    files without re-executing any source artifact.
  - c is bounded by n, since a candidate is a source component.
  predictions:
  - metric: ratio_size_rep_over_size_cpt_at_recorded_toy_parameters
    direction: higher
    minimum_effect: 4.0
  - metric: null_arm_ratio_minus_signal_arm_ratio_at_matched_n_N_c
    direction: different
    minimum_effect: 0.0
  - metric: per_route_formula_versus_measured_widest_live_slot_set_mismatches
    direction: lower
    minimum_effect: 0
  - metric: candidate_count_c_at_which_size_rep_equals_size_cpt
    direction: different
    minimum_effect: 'refuse to pre-commit: c enters the compact side linearly and the body side not
      at all, so the threshold is a derived surface rather than a predicted number, and pre-committing
      a value would be inventing a datum the derivation is supposed to produce'
  minimal_test:
    design: One Python script, no curve arithmetic required beyond reading committed parameters. It
      reads the recorded (n, N, c, p) tuples from experiments/EXP-ALR-001/specification.yaml and experiments/EXP-ALR-002/specification.yaml,
      evaluates SIZE_REP per route and SIZE_CPT, prints a table of ratios keyed by curve family and
      seed, and solves the equality for c symbolically with sympy. In the same invocation it constructs
      the null arm, a random squarefree monic of degree N over the same p and n random source abscissae,
      runs the identical formulas, and prints the two ratio columns side by side. A third block instruments
      the five route schedules by walking their operation lists and recording the widest live slot
      set, then diffs that against the formula. The whole thing is under two hundred lines and runs
      in seconds. It discriminates because a formula that disagrees with a walked schedule at any
      recorded instance is refuted immediately, and a null column that fails to match the signal column
      refutes the accounting rather than the object.
    controls:
    - Null arm with random squarefree target divisor of identical degree, executed in the same invocation
      as the signal arm, ratios printed together.
    - 'Per-route separation: five separate SIZE_REP formulas rather than one nN figure quoted for
      all five routes.'
    - Schedule walk versus formula diff, so the formula is checked against the operation list rather
      than assumed.
    - 'Unit control: recompute every ratio with p replaced by a different toy prime at fixed (n,N,c)
      and confirm the ratio is p-independent as the formula predicts.'
    - Degenerate control at c = 0 and at n = 1, where the compact interface should collapse to O(N)
      and the ratio to O(n).
    required_metrics:
    - size_rep_bits_per_route
    - size_cpt_bits
    - ratio_size_rep_over_size_cpt
    - null_arm_ratio
    - widest_live_slot_set_measured
    - formula_versus_schedule_mismatch_count
    - crossover_candidate_count_c_star
    - instruction_index_of_first_data_dependence_per_route
  falsification_conditions:
  - Any route's walked schedule has a widest live slot set that differs from its formula at any recorded
    instance.
  - The null arm's ratio differs from the signal arm's ratio at matched (n,N,c), showing the accounting
    depends on elliptic structure it should not see.
  - The ratio is found to depend on p, contradicting the uniform ceil(log2 p) charging.
  - The compact interface is found to require an output that H-ALR-002 does not list, so SIZE_CPT
    is not the interface size.
  - The recorded specifications do not fix (n, N, c) unambiguously, so no instance can be priced without
    inventing a parameter.
  - The crossover equality has no solution with c <= n, meaning the threshold is unreachable within
    the object's own constraints and the entry's part (D) is empty.
  confounders:
  - Slots that are conceptually live but implementable as recomputation, which would let a route trade
    the nN body for time and make the body count an artifact of one implementation choice.
  - Sparse or structured representations of the remainder array that store fewer than nN field elements,
    which the uniform charging would overcount; EV-ALR-001 records all 2,962 ordinary remainder coefficient
    slots as nonzero, which bounds but does not remove this.
  - Charging output that the consumer would have had to compute anyway, inflating SIZE_CPT relative
    to a fair interface.
  - The recorded toy parameters may be too small for the ratio's asymptotic behaviour to be visible,
    so the tabulated ratios describe those instances only.
  - Chart splitting doubling N in some instances and not others, which changes the ratio for reasons
    unrelated to the routes.
  interpretation_limits:
  - A size ledger prices two objects and supplies no algorithm reaching the cheaper one; a large ratio
    is a statement of what a constructor would have to achieve, not evidence it exists.
  - Every number is scoped to the three recorded toy curve families and the recorded seeds, and no
    transfer to generic-prime parameters is claimed.
  - The uniform bit charge is a modelling choice and a different charging model would move the ratio,
    so the ratio is reported with its model attached.
  - No lower bound of any kind is claimed, on circuits, straight-line programs, RAM machines or data
    structures.
  target_complexity:
    time_exponent: No attack exponent is claimed. The B^(7/2) represented-route exponent and the B^(5/2)
      rho proxy are read from EV-ALR-001 as inputs to be priced, not produced as results, and this
      entry does not adjudicate whether either is correct.
    memory_exponent: 'Memory is the entire subject and is reported as an exact bit count rather than
      an exponent: SIZE_REP = n*N*ceil(log2 p) bits per represented route and SIZE_CPT = (n+N+2c+O(1))*ceil(log2
      p) bits for the compact interface. No asymptotic memory lower bound is claimed for either.'
    best_known: The incumbent is the represented remainder route as recorded in EV-ALR-001, holding
      nN coefficient slots, together with the B^(5/2) Pollard-rho proxy that the ALR lane already
      uses as its cost comparator.
    hidden_overhead: 'The lower-order terms hide the chart bookkeeping, the deduplication pass that
      produces the reduced target divisor, and the locator verification. The human cost hides in reading
      five route schedules correctly off committed artifacts: a misread operation list produces a
      wrong formula that looks authoritative, which is why the schedule-walk diff is a required metric
      rather than an optional check.'
  dominated_by: n/a (no result claimed). Checked against every frontier row this lane records, namely
    the B^(5/2) rho proxy and the five represented routes charged at B^(7/2) in EV-ALR-001, and this
    entry places no point on any of them, because a size ledger is not an algorithm and cannot be
    dominated by one.
  sota_delta: no attack; conceptual/measurement contribution only. The quantitative deliverable is
    the ratio nN/(n+N+2c) tabulated at the recorded toy parameters together with the inequality 2c
    >= nN/(n+N) - (n+N) at which that ratio reaches one.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Part B, that both formulas can be written down cleanly from committed
    records: 0.9, because the routes are named and the interface is specified. Part C, that the tabulated
    ratio exceeds 4 at the recorded toy parameters: 0.65, since toy n and N are small and n+N+2c is
    not negligible against nN at those sizes. Part D, that the crossover inequality is nonvacuous
    with c <= n: 0.5, because c may be bounded well below the threshold in every recorded instance,
    in which case the honest deliverable is that the threshold lies outside the tested region. Part
    on the schedule-walk agreeing with the formula for all five routes: 0.55, since a misread of one
    route is the single most likely failure and is exactly what the diff is there to catch.'
