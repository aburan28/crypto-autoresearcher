      claim: rapid mixing of the Cayley walk on Cl(O)
      verified_by: null
  assumptions:
    - Ordinary curves; j in {0,1728} reported as separate rows.
    - Floor-family curves are those of the genus-n x-line family; other degree-2 functions are IDEA-20261024-d84f20.
  proof_search_map:
    not_applicable_reason: measurement and scaling law; part (a) is a positive control from published theory, no new theorem
  predictions:
    - metric: split-curve count per class vs sum of h(O), n = 3 (q = 5, 7, 11, 13) and n = 5 (q = 3)
      direction: equals
      minimum_effect: exact, every class
    - metric: "share of classes with 4 | #E(K) holding a floor curve, n = 5, q = 3..13"
      direction: lower
      minimum_effect: decreasing in q, consistent with 1 - exp(-lambda q^(-1/2))
    - metric: same share at n = 7, q = 3, 5, 7
      direction: higher
      minimum_effect: increasing, consistent with 1 - exp(-lambda q^(1/2))
    - metric: classes with v_2(#E(K)) = 2 holding a floor curve, q = 3 mod 4
      direction: equals
      minimum_effect: 0 of all such classes (contrast, some at q = 1 mod 4)
  minimal_test:
    design: >-
      (1) Count curves by trace at n = 3, 5 from the sibling records and by a small independent enumeration of
      y^2 = cubic over F_{q^n}; compare with the class-number sum from binary quadratic forms. (2) Enumerate the
      genus-n x-line configurations (constructive, x up to PGL2(F_q)) for n = 5, q = 3..13 and n = 7, q = 3, 5, 7;
      assign each curve to its trace class. (3) Per q, the share of classes reached; fit lambda_n on half the q
      values, predict the rest. (4) Split reached and unreached classes by v_2(#E(K)); compare the uniform Poisson
      model with the shape-biased model of 3c71a9.
    controls:
      - "Positive: class-number count of split curves per class; the sibling class minima at n = 3 (q = 5..13)."
      - "Negative: classes with 4 not dividing #E(K): N_split = 0 and no hit, on every class."
      - "Nearby object: n = 3, where every class with 4 dividing #E is reached on every exhaustive field."
    required_metrics:
      - n
      - q
      - classes whose order is divisible by 4
      - N_split per class
      - hits per class
      - reached share
      - v_2
      - coverage
  falsification_conditions:
    - "A class with 4 | #E(K) and N_split = 0, or the reverse, refutes (a) or signals an enumeration error."
    - Reached share at n = 5 not decreasing with q beyond sampling noise refutes the exponent n/2 - 3.
    - A class with v_2 = 2 holding a genus-5 curve at q = 3 mod 4 refutes the shape-biased model and 3c71a9.
  confounders:
    - "Small q: constants dominate the exponent; the fit needs q >= 5 (q = 3 has 15 classes at n = 5)."
    - Twists share a branch set; count a class once per curve and report twist pairs.
  interpretation_limits:
    - Reachability by isogeny is not a transfer claim; descent to F_q is open. No cost is claimed or measured.
    - A class is reached if it holds a floor curve; walk length is not measured.
  heuristic_assumptions:
    - id: H1
      statement: "Floor-family curves are uniformly distributed over classes with 4 | #E, up to the 2-adic shape bias."
      rigorous_support: equidistribution of curves by trace (Birch / Katz-Sarnak type) and h ~ sqrt(disc).
      validation_plan: per-class hit counts at n = 5, q = 5..13 against Poisson with mean lambda q^(-1/2); dispersion index and the worst class.
    - id: H2
      statement: A random walk of length O(log h) on Cl(O) re-draws the configuration (mixing).
      rigorous_support: expander property of isogeny graphs under GRH.
      validation_plan: not run here; stated so walk length stays separate from reachability.
  target_complexity:
