idea:
  id: IDEA-20260807-11b93d
  question_id: RQ-CANL-63098f
  added: '2026-08-07'
  title: >-
    THE SMALL-DISCRIMINANT ESCAPE AND EXACTLY HOW MUCH OF IT IS REAL: when
    |disc End| = O(1) the norm-form gap closes and the CM order genuinely
    enlarges the Xedni coefficient set from 2C_0+1 to about 2 pi C_0^2 /
    sqrt(|D_E|) per slot, but the norm-ONE part of that gain is the unit group
    and produces only cyclotomic tautologies that reduce to 0 = 0 mod N -- so
    the surviving gain is a constant factor of order C_0 with the instance
    count still Theta(N)
  class: mechanism

  claim: >-
    (A) THE REGIME THIS RECORD OWNS. IDEA-20260807-fd5a24 proves that every
    alpha in O \ Z has N(alpha) >= |D_E|/4, hence contributes nothing to a
    Xedni relation whose coefficients are constrained to N(alpha) <= C_0^2,
    WHENEVER |D_E| > 4C_0^2. This record owns the complementary regime
    |D_E| <= 4C_0^2. That regime is not a curiosity: |D_E| = |D_0| f_E^2 is
    small exactly for curves at the crater of a volcano whose fundamental
    discriminant is small, i.e. j = 0 (D_0 = -3, exists over F_p for every
    p = 1 mod 3), j = 1728 (D_0 = -4, p = 1 mod 4), and the finitely many j
    that are roots of H_{D_0} for small |D_0|. secp256k1 is y^2 = x^3 + 7,
    a j = 0 curve, so its canonical lift has CM by Z[zeta_3] with |D_E| = 3.
    THE ESCAPE REGIME CONTAINS A DEPLOYED CURVE, and this record is written
    because dismissing it would be exactly the premature closure
    docs/inventor-protocol.md forbids.

    (B) THE GAIN, COMPUTED EXACTLY. O is a lattice in C of covolume
    sqrt(|D_E|)/2. The elements of norm at most C_0^2 are the lattice points
    in a disc of radius C_0, so
        |{alpha in O : N(alpha) <= C_0^2}| = 2 pi C_0^2 / sqrt(|D_E|)
                                             + O(C_0/|D_E|^{1/4} + 1).
    At |D_E| = 3 this is 3.63 C_0^2 + O(C_0); at |D_E| = 4 it is
    3.14 C_0^2 + O(C_0). Compare the Z-case count 2C_0 + 1. SO IN THE SMALL-|D_E|
    REGIME CM MULTIPLIES THE PER-SLOT COEFFICIENT COUNT BY ABOUT 1.8 C_0,
    AND SIMULTANEOUSLY HALVES THE NUMBER OF SLOTS (r_O + 1 = r_Z/2 + 1
    instead of r_Z + 1). Net reachable-residue count:
        Z-case:  (2C_0+1)^{r_Z+1}      ~ (2C_0)^{r_Z+1}
        CM-case: (3.6 C_0^2)^{r_Z/2+1} ~ 3.6^{r_Z/2+1} C_0^{r_Z+2}
    so the CM case is larger by a factor about (3.6/4)^{r_Z/2} * 3.6 * C_0/2.
    THIRD EXACT NUMBER (after fd5a24's two): at small |D_E| the CM structure
    multiplies the reachable-k count by Theta(C_0) while halving the number of
    points to lift. That is a genuine improvement and it must be stated as one.

    (C) THE PART OF THE GAIN THAT IS FAKE, AND WHY. The norm-1 elements of O
    are exactly the units, O^* -- six for D_E = -3, four for D_E = -4, two
    otherwise. They act on Ẽ as AUTOMORPHISMS, and the relations they generate
    are the cyclotomic identities: 1 + zeta_3 + zeta_3^2 = 0 in Z[zeta_3],
    1 + i^2 = 0 in Z[i]. Applied to any point P̃ these give
        P̃ + zeta_3 P̃ + zeta_3^2 P̃ = O
    which is not a relation among independent points at all -- it is the
    Z-dependence of three vectors in the rank-2 Z-module O P̃. Reducing mod p:
    lambda(zeta_3) =: mu satisfies mu^2 + mu + 1 = 0 in Z/N, so the reduced
    relation is (1 + mu + mu^2) P = O, i.e. 0 = 0. IT CARRIES NO INFORMATION
    ABOUT k, FOR ANY P, FOR ANY CURVE. It is target-independent by
    construction.
    THIS PROGRAM HAS ALREADY FOUND THE SAME PHENOMENON IN A DIFFERENT SETTING:
    KN-FIND-003 (promoted by DEC-20260724-022 from EV-XEDN-002) records that
    on the isotrivial j = 0 function-field family the counted sections form
    mu_3 orbits whose specialised relation "is a tautology" (KN-FIND-008).
    That was over F_p(t) with Shioda heights; this is over a number field with
    Neron-Tate heights. Two independent settings, one mechanism. The
    consilience is evidence that the tautology is structural rather than an
    artifact of either family.

    (D) THE PART OF THE GAIN THAT IS REAL. NOT ALL small-norm elements are
    units. In Z[zeta_3] the elements of norm 3 include 1 - zeta_3 (the
    ramified prime), norm 4 includes 2, norm 7 includes 3 + zeta_3, and so on.
    These are NOT automorphisms, the relations they generate are NOT
    tautologies, and lambda(alpha) = a + b*mu is a genuinely new residue for
    each (a,b). So the Theta(C_0) enlargement survives after deleting the
    O(1) units. FOURTH EXACT NUMBER: the surviving enlargement is
    (2 pi C_0^2/sqrt(|D_E|) - |O^*|), which is Theta(C_0^2) per slot, so the
    reachable-k count gains Theta(C_0^{r_Z/2+1}) relative to naive counting
    and Theta(C_0) relative to the Z-case at matched Z-rank.

    (E) WHY THAT STILL DOES NOT MOVE THE EXPONENT, AND THE HONEST BOTTOM LINE.
    The instance count is I = N / (reachable-k count). Every factor computed
    above is a function of C_0 and r_Z alone, both absolute constants at fixed
    arity (ECFG-P1543-R1: "fixed arity 2 <= r <= 9"). So
        I_CM(small |D_E|) = N / Theta(C_0^{r_Z+2}) = N^{1 - o(1)},
    and the exponent of N is 1, against rho's 1/2. CM AT SMALL DISCRIMINANT
    IMPROVES THE CONSTANT AND NOT THE EXPONENT -- which is precisely the
    verdict docs/target-result-profile.md tells this program to record as such
    rather than to dress up.

  resource_label: >-
    R3 (End(E) as a ring: the unit group, the small-norm elements, and the
    ring map lambda: O -> Z/N) and R6 (the characteristic-zero lift on which
    those elements act as isogenies with degree = norm).
  admissibility: admissible
  admissibility_argument: >-
    The proposal's operative computations -- counting lattice points of the
    norm form inside a disc, separating units from non-units, and evaluating
    lambda(alpha) = a + b*mu -- are all ring-level and take place either in O
    or on the characteristic-zero lift. NONE of them is "apply phi to a point
    of G". The place where H-ENDO-001 does bite is part (C), and this record
    USES it rather than violating it: the tautology is exactly the statement
    that the unit orbit collapses to a scalar identity mod N. Note also that
    the admissibility filter would close a naive reading of part (D) -- "the
    extra endomorphisms give extra relations on G" -- if those relations were
    obtained by applying alpha to points of G. They are not; they are obtained
    from Z-dependences in a characteristic-zero Mordell-Weil lattice, and only
    their REDUCTIONS are scalars. The distinction is the whole reason the lane
    is admissible at all.

  discriminated_from:
    - >-
      IDEA-20260807-fd5a24: that record owns |D_E| > 4C_0^2 and proves the
      gain is zero; this one owns |D_E| <= 4C_0^2 and computes the gain
      exactly. They are complementary halves of one dichotomy and neither is
      complete without the other. Do not read either as the whole answer.
    - >-
      KN-FIND-003 / EV-XEDN-002 / DEC-20260724-022 / GOAL-ICLIFT-001
      BATCH-002: the mu_3 orbit tautology on the ISOTRIVIAL FUNCTION-FIELD
      family y^2 = x^3 + b(t) over F_p(t), with Shioda heights, at
      p in {7,13,19,31}, claim boundary "not E_8; not B2 closure; not
      non-isotrivial". This record is over a NUMBER FIELD with Neron-Tate
      heights and makes no claim about that family. It CITES the prior finding
      as an independent instance of the same tautology, which is a
      consilience, not a duplication -- and it is careful that the prior
      finding's claim tier is toy and its proof status empirical_only.
    - >-
      KN-TECH-018 (automorphism-discounted rho): that is a sqrt(|Aut|)
      constant on the SEARCH, obtained by walking on Aut-orbits in E(F_p). It
      is the mandated control here. This record is about Aut acting on a
      characteristic-zero Mordell-Weil lattice, and it concludes that the same
      automorphisms give NOTHING there, not even a constant -- a strictly
      different statement from KN-TECH-018 and in the opposite direction.
    - >-
      L3 / RQ-JINV-8fc13a (j-invariant special values): that lane asks whether
      small |D_0| changes index-calculus and Groebner cost functionals. This
      one asks what small |D_0| does to a lattice of heights in characteristic
      zero. Shared parameter, disjoint functional.

  object_first_candidate:
    tracked_object: >-
      THE SMALL-NORM SHELL of the CM order, split into its unit part and its
      non-unit part: the finite set S(C_0) = {alpha in O : N(alpha) <= C_0^2},
      partitioned as S = O^* union (S \ O^*), followed through reduction by
      the ring map lambda: O -> Z/N.
    lossiness: >-
      LOSSY, and the discard is compatible with the operations. From the full
      state (the CM curve, its points, its field) the object keeps only a
      finite set of algebraic integers and their images in Z/N. It DISCARDS
      the points entirely. The compatibility that makes this a legitimate
      tracked object rather than a change of coordinates: the attack's
      relation space is the set of coefficient vectors, and coefficient
      vectors compose under the ring operations of O alone -- the points never
      enter. Two different curves with the same O have literally the same
      object, and that is the informative loss: it says the answer depends on
      D_E and not on which of the h(D_E) crater curves you picked.
    propagation: >-
      One step = multiplication in O. The object propagates by
      N(alpha beta) = N(alpha) N(beta), so the norm shell is multiplicatively
      graded and one-step propagation is exact. Under reduction it propagates
      by lambda(alpha beta) = lambda(alpha) lambda(beta), a ring map. Both are
      measurable by exact integer arithmetic at zero cost.
    survival_score: >-
      SURVIVES: any change of curve within the crater, any twist, any choice
      of point, the whole Galois orbit. DIES: as soon as |D_E| exceeds
      4C_0^2, where the non-unit part of the shell empties and the object
      degenerates to Z -- that death is fd5a24's theorem and it is the reason
      this object is only interesting on an O(1)-sized family of
      discriminants.

  mechanism: >-
    STEP 1 -- ENUMERATE THE SHELL EXACTLY. For each D_E in the small set
    {-3,-4,-7,-8,-11,-12,-16,-19,-27,-28,-43,-67,-163} (class number one) and
    each C_0 in {1,...,20}, enumerate S(C_0) = {alpha = a + b w :
    N(alpha) <= C_0^2} by exhaustive integer search, and partition it into
    units and non-units. Pure integer arithmetic, milliseconds. Report the
    exact counts against the predicted 2 pi C_0^2/sqrt(|D_E|).

    STEP 2 -- CONSTRUCT lambda AND VERIFY THE TAUTOLOGY. For a toy ordinary
    E/F_p with j = 0 and p = 1 mod 3: find mu in Z/N with mu^2 + mu + 1 = 0
    (a primitive cube root of unity mod N, which exists because N | #E(F_p)
    and the automorphism zeta_3 acts on E(F_p)); realise zeta_3 explicitly as
    (x,y) -> (mu_p x, y) where mu_p^3 = 1 in F_p; verify on random P in G that
    zeta_3(P) = [mu]P and that P + zeta_3(P) + zeta_3^2(P) = O. THIS IS THE
    TAUTOLOGY, made concrete and checkable in twenty lines of harness code
    against harness/toycurve.py.

    STEP 3 -- SHOW A NON-UNIT RELATION IS NOT A TAUTOLOGY. Take
    alpha = 1 - zeta_3, N(alpha) = 3. Then lambda(alpha) = 1 - mu, which is
    NOT zero mod N (since mu != 1 for N > 3). So the relation
    alpha P̃ = (1 - zeta_3) P̃ reduces to [1 - mu] P, a genuine and computable
    multiple. This separates parts (C) and (D) empirically and is the arm that
    can fail: if lambda(alpha) turned out to be 0 or 1 for every small-norm
    non-unit alpha, part (D) would be empty and the escape would be entirely
    fake.

    STEP 4 -- COUNT REACHABLE RESIDUES, BOTH ARMS, EXACTLY. At toy N, for
    r_Z = 2 and 4, enumerate all coefficient tuples in S(C_0)^{r_O+1} and all
    integer tuples in [-C_0,C_0]^{r_Z+1}, compute the induced residues k, and
    report |{distinct k}| for each arm. This is the direct measurement of
    part (B)'s arithmetic and it is exact, not sampled.

    STEP 5 -- CHARGE IT. Multiply N / |{distinct k}| by the per-attempt cost
    and compare against 0.886 sqrt(N). Report the exponent, not a ratio.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Same 2026-08-07 screen as IDEA-20260807-fd5a24, plus targeted greps for
      "mu_3|zeta_3|automorphism orbit|tautolog" across ledger/ and knowledge/,
      and reads of KN-FIND-008 (which states the mu_3 tautology), KN-TECH-018,
      GOAL-ICLIFT-001 BATCH-002 checkpoint, and H-XEDN-fe3446 (whose steps 3-4
      derive the E_8 root-triangle version of the same coefficient bound).
    results: >-
      The automorphism-orbit tautology IS present in this corpus, at
      KN-FIND-003 / KN-FIND-008 / DEC-20260724-022, but ONLY for the
      function-field isotrivial family with Shioda heights. The lattice-point
      count 2 pi C_0^2/sqrt(|D_E|) for the small-norm shell of a CM order, and
      the unit/non-unit split of the resulting reachable-residue gain, appear
      NOWHERE. "secp256k1" as a j = 0 curve whose canonical lift has |D_E| = 3
      appears nowhere in a lifting context.
    verdict: >-
      ADAPTATION. The tautology half duplicates a known internal negative in a
      new setting and is filed as such with its prior id. The quantified
      non-unit half is new to this program. No external novelty is claimed.

  null_object_control: >-
    MANDATORY AND BLOCKING. NULL OBJECT: the same reachable-residue count run
    with the CM order replaced by Z x Z with a SYNTHETIC "norm" form of the
    same determinant -- that is, a rank-2 coefficient ring with the right
    shape and no arithmetic. The reachable-residue count in the null arm must
    be the naive product of coordinate ranges, with no structure; if the CM
    arm does not exceed the null arm, part (D) is empty.
    DECAY PARAMETER: |D_E|. The gain 2 pi C_0^2/sqrt(|D_E|) MUST DECAY LIKE
    |D_E|^{-1/2} and must reach the Z-case value 2C_0+1 at |D_E| ~ 4C_0^2. A
    measured gain that FAILS TO DECAY as |D_E| grows is the canonical artifact
    tell and indicates the shell enumeration is wrong.
    SECOND NULL (the tautology arm): resample k with the curve and P fixed.
    The tautology relation must be unchanged -- it is target-independent by
    construction -- while any genuine relation must change. An instrument in
    which the tautology "moves" with k is broken.

  assumptions:
    - >-
      Curves with j = 0 over F_p (p = 1 mod 3) have End_{F_p} containing
      Z[zeta_3] and the automorphism (x,y) -> (zeta x, y) is F_p-rational.
      STANDARD; verified constructively in Step 2 rather than assumed.
    - >-
      For a j = 0 curve, End_{F_p}(E) is the MAXIMAL order Z[zeta_3], so
      |D_E| = 3. Recalled; the check is that j(E) = 0 forces the extra
      automorphism which forces the maximal order at that level of the
      volcano. FLAGGED [open]: a curve can have j = 0 and a non-maximal
      F_p-endomorphism ring only if the automorphism fails to be rational,
      which the construction excludes. To be confirmed at Stage 0.
    - >-
      secp256k1 is y^2 = x^3 + 7 over its prime field, hence j = 0. This is a
      public parameter of a public standard and is stated here only to
      establish that the small-|D_E| class is not empty of deployed curves.
      NO ATTACK ON secp256k1 IS PROPOSED, IMPLIED, OR IMPLEMENTED; the
      campaign is toy scale and the conclusion of this record is a negative.
    - >-
      C_0 is an absolute constant at fixed arity (relayed from KN-LIT-021 via
      ECFG-P1543-R1, abstract only, full paper not read).

  proof_search_map:
    bottleneck: >-
      The unit/non-unit split. If EVERY small-norm element of O were a unit,
      the escape would be entirely tautological and the lane would close
      completely; if NO small-norm non-unit gave a fresh residue, the same.
      The whole difference between "CM helps by Theta(C_0)" and "CM helps by
      0" lives in whether lambda is injective enough on S(C_0) \ O^*.
    baseline_embedding:
      parameter_slice: >-
        The exact baseline to reproduce is the Z-case reachable-residue count
        at C_0 = 3, r_Z = 2: exactly the tuples (a_1,a_2,a_3) in
        [-3,3]^3 and the residues they induce. Integer arithmetic with a
        closed-form expected count; any implementation must match it exactly
        before the CM arm is run.
      reproduction_check: >-
        Frozen fixture: named p, named N, named P, named auxiliary points with
        known logs, and the exact sorted list of induced residues. Exact set
        equality, not a count match.
    observation_collision:
      observable: >-
        The reachable-residue count |{distinct k}|.
      distinct_preimage_search: >-
        EXPECTED TO SUCCEED AND THEREFORE BLOCKING. Two objects with the same
        count: (i) a genuine CM shell at |D_E| = 3 with C_0 = 2, and (ii) a
        Z-coefficient range with C_0' chosen so that 2C_0'+1 matches
        3.6 C_0^2. If the counts collide, the count ALONE cannot attribute the
        gain to CM, and the attribution must instead come from the unit/
        non-unit decomposition, which is the finer observable this record
        insists on. Reporting a reachable-residue count without the
        decomposition is prohibited.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the reachable-residue count fixed and vary the forgotten
          structure: whether the coefficients are units. The intrinsic
          invariant separating the fibres is N(alpha) = 1 versus N(alpha) > 1,
          equivalently "the relation is a cyclotomic identity" versus "the
          relation is a genuine dependence". This is both the counterexample
          construction and the experiment's discriminator.
        predicted_gain: >-
          None to an attacker. It converts a number that looks like a CM
          advantage into a number with a known tautological component that
          must be subtracted.
      - transform: stronger_invariant
        proposed_object: >-
          Track the multiset {lambda(alpha) : alpha in S(C_0)} rather than its
          cardinality. The multiset detects collisions in lambda (different
          alpha, same residue), which the cardinality hides and which directly
          reduce the effective gain.
        predicted_gain: >-
          A sharper and possibly smaller gain estimate; the record prefers the
          smaller honest number to the larger flattering one.
    quantifier_order: >-
      THE CLAIM: FOR ALL D_E with |D_E| <= 4C_0^2, THERE EXISTS a subset
      S(C_0) \ O^* of size Theta(C_0^2) such that FOR ALL P̃ and FOR ALL alpha
      in that subset, lambda(alpha) is a residue not forced to 0 by a
      cyclotomic identity. THE TRAP: the weaker and useless reading "for each
      P̃ there exists alpha giving a nonzero residue" -- true with alpha = 1.
      The strength is that the subset is chosen BEFORE the point and is
      independent of it, which is also, uncomfortably, what makes it
      target-independent and hence subject to IDEA-20260807-cfe576's
      obstruction.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "for |D_E| <= 4C_0^2, the CM coefficient shell has
        Theta(C_0^2) non-unit elements per slot and yields Theta(C_0) times
        more reachable residues than the matched Z-case at equal Z-rank, with
        the unit contribution exactly tautological; the instance count remains
        N^{1-o(1)}." It CANNOT certify anything about generic curves, about
        whether the extra residues are USEFUL (that requires the points to
        lift at all -- IDEA-20260807-6533fd and cfe576), or about any deployed
        curve.
      nearby_object_control: >-
        The nearby object where the conclusion fails is |D_E| = 4C_0^2 + 1,
        immediately outside the escape, where fd5a24's theorem takes over and
        the gain is exactly zero. Running both sides of that threshold with
        identical code is the sharpest available control: a method reporting
        the same gain on both has not identified the load-bearing structure.
    proof_obligations:
      - claim: "|S(C_0)| = 2 pi C_0^2/sqrt(|D_E|) + O(C_0 |D_E|^{-1/4} + 1)."
        responsibility: correctness
      - claim: "O^* is the norm-1 shell and has order 6, 4 or 2."
        responsibility: baseline
      - claim: "Unit relations reduce to 0 = 0 mod N for every P and every N > 3."
        responsibility: correctness
      - claim: "lambda(1 - zeta_3) = 1 - mu != 0 mod N for N > 3."
        responsibility: correctness
      - claim: "Reachable-residue gain is Theta(C_0), hence the exponent of N is 1."
        responsibility: runtime
      - claim: "The escape regime is |D_E| <= 4C_0^2 and contains j = 0, j = 1728."
        responsibility: scope
      - claim: "No claim about any deployed curve is made."
        responsibility: scope

  predictions:
    - metric: >-
        |{alpha in O : N(alpha) <= C_0^2}| measured exactly, versus the
        predicted 2 pi C_0^2/sqrt(|D_E|), for |D_E| in the class-number-one
        list and C_0 in 1..20
      direction: different
      minimum_effect: >-
        Relative error below 15% for C_0 >= 5 at every |D_E|, and the exact
        integer counts recorded for every cell. A systematic sign-consistent
        deviation above 15% means the covolume sqrt(|D_E|)/2 is wrong as used.
    - metric: >-
        unit_fraction := |O^*| / |S(C_0)| as a function of C_0
      direction: lower
      minimum_effect: >-
        FORCED VALUE: must decay like C_0^{-2}, reaching below 0.05 by
        C_0 = 8 at |D_E| = 3. A unit fraction that does not decay means the
        shell enumeration is returning only units and the non-unit arm is
        untested.
    - metric: >-
        tautology_check: max over 1000 random P in G of the group element
        P + zeta_3(P) + zeta_3^2(P)
      direction: different
      minimum_effect: >-
        FORCED VALUE: the identity O, for every P, exactly. A single failure
        is an instrument failure and halts the line.
    - metric: >-
        reachable_residue_gain := |{k}|_CM / |{k}|_Z at matched Z-rank and
        matched C_0, at |D_E| = 3 and |D_E| = 4
      direction: higher
      minimum_effect: >-
        Predicted Theta(C_0), specifically between 0.5 C_0 and 4 C_0 for
        C_0 >= 5. CAN FAIL IN BOTH DIRECTIONS: a gain below 1 would mean the
        small-|D_E| escape is illusory and the lane closes harder than
        fd5a24 already closes it; a gain growing faster than C_0^2 would mean
        the counting in part (B) is wrong in the attacker's favour and the
        lane reopens.
    - metric: >-
        instance_count_exponent log(N/|{k}|)/log(N) at toy N
      direction: different
      minimum_effect: >-
        Predicted 1 - o(1) with an interval excluding 1/2. This is the
        decision metric and it is the one that must be reported alongside any
        statement that "CM helps".

  minimal_test:
    design: >-
      STAGE 0 (minutes, zero risk): exact enumeration of S(C_0) and its
      unit/non-unit split for all class-number-one |D_E| and C_0 <= 20.
      STAGE 1 (HARD GATE, minutes): construct a toy j = 0 curve over
      F_p with p = 1 mod 3 using harness/toycurve.py, find mu, and verify the
      tautology on 1000 random points. Failure halts everything.
      STAGE 2 (minutes): verify lambda(1 - zeta_3) != 0 and enumerate
      {lambda(alpha)} as a multiset, reporting collisions.
      STAGE 3 (hours): exact reachable-residue counts in both arms at
      r_Z in {2,4}, C_0 in {2,3,5,8}, at three toy N.
      STAGE 4 (minutes): threshold control at |D_E| just above and just below
      4C_0^2, identical code.
      STAGE 5 (zero compute): charge against 0.886 sqrt(N) and record the
      exponent.
    controls:
      - Synthetic rank-2 coefficient ring with no arithmetic (the null object).
      - Threshold pair |D_E| = 4C_0^2 -/+ 1 with identical code.
      - k-resampling control: the tautology must not move with k.
      - Automorphism-discounted rho baseline on the same j = 0 curve (KN-TECH-018).
    required_metrics:
      - Exact |S(C_0)| and unit/non-unit split per (D_E, C_0)
      - Multiset {lambda(alpha)} with collision counts
      - Reachable-residue counts, both arms, exact
      - Tautology pass/fail on every sampled point
      - Fitted instance-count exponent with interval
      - Null-arm values for every metric

  falsification_conditions:
    - >-
      The tautology check fails on any point. Instrument failure under
      AGENTS.md rule 5; nothing is reported.
    - >-
      |S(C_0)| deviates systematically from 2 pi C_0^2/sqrt(|D_E|). The
      lattice-point count is wrong and part (B) is withdrawn.
    - >-
      lambda(alpha) = 0 for every non-unit alpha in the shell. Part (D) is
      empty; the escape is entirely tautological; the lane closes completely
      and that is a stronger negative than the one predicted.
    - >-
      reachable_residue_gain < 1 at |D_E| = 3. The small-|D_E| escape does not
      exist even in the constant, and fd5a24's theorem is unnecessary.
    - >-
      reachable_residue_gain grows faster than C_0^2. The counting is wrong in
      the attacker's favour; the record is superseded and the lane reopens.
    - >-
      The threshold control shows the same gain on both sides of
      |D_E| = 4C_0^2. The measurement is not sensitive to the load-bearing
      structure and no negative may be reported from any arm.

  confounders:
    - >-
      lambda collisions. Different alpha can give the same residue mod N,
      inflating |S| relative to the useful count. Measured directly by the
      multiset metric rather than assumed away.
    - >-
      Torsion. On a j = 0 curve the lift has extra torsion; torsion points
      have height 0 and produce spurious "relations". Torsion must be quotiented
      out before any height or rank is reported, and the torsion order recorded.
    - >-
      Small N. At toy N the cube root of unity mu may be small or structured,
      making lambda(alpha) collide more often than at crypto N. The k-
      resampling control and a ladder of N address this; the record must not
      report a residue count from a single N.
    - >-
      Twist multiplicity. j = 0 has six sextic twists over F_p with different
      group orders; every measurement names its twist and none are pooled.

  interpretation_limits:
    - >-
      Toy scale, claim_tier toy. Nothing here is a crypto-scale statement and
      nothing here is an attack on any deployed curve, including the j = 0
      curve named in the assumptions for scope purposes only.
    - >-
      The record's positive part (a Theta(C_0) constant gain) is a statement
      about COEFFICIENT COUNTS, not about whether any point lifts. Lifting is
      owned by IDEA-20260807-6533fd and IDEA-20260807-cfe576, and if those
      close, this gain is unrealisable regardless of its size.
    - >-
      The tautology half duplicates KN-FIND-003 in a new setting. It adds
      confidence by consilience and adds no new claim; KN-FIND-003's own claim
      boundary (toy, empirical_only, isotrivial function-field family) is
      unchanged by anything here.
    - >-
      "CM helps by Theta(C_0)" must never be quoted without "and the instance
      count is still N^{1-o(1)}, against rho's N^{1/2}".

  heuristic_assumptions:
    - id: HEUR-CANL-S1
      statement: >-
        FOR ALL |D_E| in the class-number-one list and FOR ALL C_0 >= 5, the
        map lambda restricted to S(C_0) \ O^* is injective up to a factor
        bounded independently of C_0 and N -- i.e. the Theta(C_0^2) shell
        elements give Theta(C_0^2) DISTINCT residues mod N.
      rigorous_support: >-
        Rigorously, lambda is a ring map O -> Z/N and its kernel is the ideal
        of O generated by (pi - 1) and N, which has norm divisible by N; so
        any two shell elements with the same image differ by an element of
        norm >= N, impossible inside a shell of norm <= C_0^2 once
        N > 4C_0^2. THAT ARGUMENT IS RIGOROUS AND MAKES THE HEURISTIC A
        THEOREM for N > 4C_0^2, which is every cryptographic N and most toy
        N; it is retained as a numbered item because the toy ladder includes
        N below that threshold, where it genuinely can fail.
      validation_plan: >-
        Sample: all shell elements at C_0 <= 20 for every class-number-one
        D_E, against a ladder of toy N spanning 2^8 to 2^20, including at
        least three N below 4C_0^2 so the failure regime is exercised.
        Predicted distribution: zero collisions above the threshold; a
        collision rate consistent with the pigeonhole count C_0^2/N below it.
        Tail check: report every observed collision pair explicitly. Toy scale
        only and labelled as such.
    - id: HEUR-CANL-S2
      statement: >-
        The reachable residues produced by shell coefficients are
        EQUIDISTRIBUTED in Z/N, so |{distinct k}| is the shell count to within
        a birthday correction, rather than concentrated on a small subgroup.
      rigorous_support: >-
        None as a theorem. It imitates the standard expectation that a
        homomorphic image of a "generic" finite set in Z/N is equidistributed,
        the same expectation underlying every relation-counting heuristic in
        this program's index-calculus lanes. It can fail badly if mu has small
        multiplicative order or if N shares structure with |D_E|.
      validation_plan: >-
        Sample: the full residue multiset at three toy N per D_E. Predicted
        distribution: uniform on Z/N; compare by chi-squared against the
        uniform and by the observed number of distinct values against the
        birthday prediction |S|(1 - |S|/2N). Tail check: the largest
        multiplicity in the multiset. A concentration failure is reported as a
        finding, not smoothed over. Toy scale only.

  target_complexity:
    time_exponent: >-
      1 in N for the mechanism (instance count N/Theta(C_0^{r_Z+2})),
      unchanged from the non-CM case in exponent. Rho is 1/2. NO EXPONENT
      MOVES. The measurable delta is entirely inside the constant, and it is
      Theta(C_0) at fixed arity.
    memory_exponent: >-
      O(1) for the mechanism; the measurement stores the shell (O(C_0^2)
      integers) and a residue multiset (O(C_0^{r_Z/2+1}) entries at the largest
      cell), which is the binding measurement resource and is bounded by the
      toy budget.
    best_known: >-
      Parallel rho at 0.886 sqrt(N), O(1) memory (KN-TECH-001, KN-TECH-006);
      on a j = 0 curve the automorphism-discounted variant is faster by
      sqrt(6) (KN-TECH-018) -- note the irony that the SAME units which make
      this record's escape regime possible already give rho its largest legal
      discount, and that discount is a genuine sqrt(6) while this record's is
      nothing.
    hidden_overhead: >-
      The lift itself is free in this regime (h(D_E) = 1, so the canonical
      lift is a curve over Q written down in O(1)) -- that is the escape's one
      real virtue and it is quantified in IDEA-20260807-ee6ef7. What is NOT
      free and is not charged in the exponent above: producing points on that
      curve that reduce to prescribed elements of E(F_p), whose coordinate
      size is Theta(N^{2/r}) by IDEA-20260807-6533fd.
    tradeoff_note: >-
      None; no algorithm is produced. For completeness: the shell enumeration
      is trivially parallel and O(C_0^2), which is negligible against every
      row of the frontier and therefore cannot buy a tradeoff.

  dominated_by: >-
    CHECKED ON EVERY FRONTIER ROW ACROSS TIME, MEMORY AND DATA. Dominated by
    parallel Pollard rho with distinguished points (0.886 sqrt(N) time, O(1)
    memory) on time by N^{1/2-o(1)}, tied on memory. Dominated more sharply on
    a j = 0 curve by the automorphism-discounted rho (KN-TECH-018), which
    turns the very unit group discussed here into a real sqrt(6) speedup while
    this mechanism gets nothing from it. Dominated by BSGS on time
    (sqrt(N) vs N^{1-o(1)}) though not on memory -- irrelevant, since rho
    dominates BSGS on both. Not comparable to index-calculus rows on any axis
    but total time, where it is also dominated. NOT null.
  sota_delta: >-
    Zero speedup against every attack baseline: exponent 1 versus 0.5, a
    factor N^{1/2} slower. The quantitative deltas this record does deliver:
    coefficient-shell size per slot from 2C_0+1 to 2 pi C_0^2/sqrt(|D_E|)
    (a factor 1.8 C_0 at |D_E| = 3); slots from r_Z+1 to r_Z/2+1 (factor 2);
    reachable residues by a net factor Theta(C_0); tautological fraction of
    the shell exactly |O^*|/|S| = O(C_0^{-2}); and change in the exponent of
    N: exactly 0.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.95 that the shell counts verify (elementary lattice-point counting).
    0.9 that the tautology verifies (it is forced by mu^2 + mu + 1 = 0).
    0.7 that the reachable-residue gain lands in the predicted
    [0.5 C_0, 4 C_0] band; the main risk is lambda collisions at toy N, which
    HEUR-CANL-S1 shows are a small-N phenomenon. 0.02 that the gain is large
    enough to matter after IDEA-20260807-6533fd's lifting cost is charged.
    The expected deliverable is a quantified constant-factor positive inside
    an unchanged exponent -- the least glamorous and most honest outcome.

