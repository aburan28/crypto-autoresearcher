idea:
  id: IDEA-20260806-94676a
  question_id: RQ-ECDLP-002
  added: '2026-08-06'
  title: >-
    REPRESENTATION LEARNING FOR LATENT LINEARISATION, COSTED BEFORE IT IS RUN:
    the exact latent linearisation EXISTS, is the character embedding, and
    computing it IS the discrete logarithm -- so every learned model is advice,
    the preprocessing bound S*T^2 = Omega(N) applies verbatim, and a 10^9-parameter
    model against a 256-bit curve is pre-registered to need T >= 2^111 online
    steps; the only loophole is coordinate structure, which is a testable claim
    rather than a hope
  class: measurement

  claim: >-
    (A) THE EXACT VERSION IS NOT IMPOSSIBLE -- IT IS THE DISCRETE LOGARITHM.
    Ask for an embedding z: <P> -> R^d with z(g + h) = T_h(z(g)) for a family of
    linear maps T_h. By IDEA-20260806-c5d183's trichotomy, any map propagating
    deterministically under the full translation action is constant or injective.
    Constant is useless. Injective is ACHIEVABLE and explicit: z(kP) =
    (cos(2 pi k / N), sin(2 pi k / N)), with T_h the rotation by 2 pi h / N. So a
    perfect latent linearisation of the elliptic-curve group exists, it is
    essentially unique up to the choice of character, it is two-dimensional, and
    EVALUATING IT AT A GIVEN POINT REQUIRES KNOWING THAT POINT'S LOGARITHM. The
    search for an exact linearising embedding is therefore not a search for
    structure -- it is a search for a DLP oracle, wearing different notation.
    This has to be said first, because "find coordinates where kP is linear" reads
    like an open-ended structural question and is in fact a closed one.

    (B) SO EVERY VIABLE PROPOSAL IS APPROXIMATE, AND APPROXIMATE MEANS THE MODEL
    IS ADVICE. A trained model is S bits of parameters produced from the public
    curve description, consulted by an online procedure making T queries. That is
    precisely the DISCRETE LOGARITHM WITH PREPROCESSING model. The
    Corrigan-Gibbs-Kogan bound for that model states that any generic algorithm
    with S bits of advice and T online queries succeeding with probability
    epsilon satisfies S * T^2 = Omega(epsilon * N), and the bound is tight -- a
    matching algorithm is known. RECALLED, NOT RE-READ IN THIS SESSION; STAGE 0
    VERIFIES BOTH THE BOUND AND ITS TIGHTNESS BEFORE ANY NUMBER BELOW IS QUOTED.

    (C) THE PRE-REGISTERED BUDGET, WHICH IS THE DELIVERABLE. Instantiate (B).
    A model with 10^9 float parameters is roughly S = 2^35 bits at 32 bits each.
    Against a curve with N ~ 2^256 the bound gives T^2 >= 2^256 / 2^35 = 2^221,
    hence T >= 2^110 online steps -- against a rho baseline of about 2^128. So the
    model would need to be TRAINED AND STORED at 10^9 parameters to buy roughly 18
    bits, and the storage is the entire gain: the same bound is saturated by a
    plain precomputed table with no learning in it. To reach a genuinely
    interesting T = 2^64 the advice would need S ~ 2^128 bits, which is more
    storage than the attack it replaces. THE CONCLUSION IS NOT "ML CANNOT WORK";
    IT IS THAT ANY GENERIC LEARNED ATTACK IS EXACTLY A TIME-MEMORY TRADEOFF AND
    MUST BE REPORTED ON THAT FRONTIER, where it competes with a table and loses on
    simplicity. Sizing this before training is the point of the record.

    (D) THE ONE LOOPHOLE, STATED PRECISELY SO IT CAN BE TESTED RATHER THAN HOPED
    FOR. The bound in (B) is a GENERIC-model bound: it applies to algorithms that
    treat group elements as opaque labels. A model reading the AFFINE COORDINATES
    of points is not generic -- it is TYPE III in the trichotomy, coordinate-
    dependent -- and the bound does not formally apply to it. THAT IS THE ONLY
    OPENING, and it converts a vague aspiration into a specific falsifiable
    claim: a learned model beats the preprocessing bound ONLY IF it is
    demonstrably using coordinate structure. Which is testable directly, and
    cheaply, by the control in (E).

    (E) THE CONTROL THAT DECIDES IT, AND WITHOUT WHICH NO ML RESULT HERE MEANS
    ANYTHING. Train the identical architecture, with the identical budget and
    schedule, on two datasets: (i) the real curve, points presented by their
    affine coordinates; (ii) a SCRAMBLED GROUP -- the same cyclic group of the
    same order with a random bijective relabelling into strings of the same
    length, destroying all coordinate structure while preserving the group
    exactly. If performance is equal, the model learned nothing about the curve
    and every apparent success is memorisation of the training set. If the real
    curve is materially better, the model IS using coordinate structure, the (D)
    loophole is live, and the next question -- which structure -- is a real
    research question with a concrete artifact to interrogate. This is the
    inventor protocol's section 3 null in its most literal form, and in this lane
    it is not a refinement but the entire experiment.

    (F) THE SECOND CONTROL: GENERALISATION, NOT FIT. Report performance ONLY on
    held-out logarithms never seen in training, and report the training-set
    performance separately. A model with enough capacity memorises T examples
    perfectly; a training-set curve going to zero loss is the expected behaviour
    of a large model and is not evidence of anything. The metric is the
    held-out success rate as a function of training-set size, and the prediction
    from (B) is that it stays at chance until the training set approaches the
    advice budget the bound demands.

    (G) WHAT THIS IS NOT. NOT a claim that machine learning is useless in
    cryptanalysis. NOT a claim that no coordinate structure exists -- the corpus's
    own simulability closures (KN-FIND-002, KN-FIND-b7e091) bear on that and are
    scoped to specific oracles, not to all coordinate functions. NOT a proposal to
    train a large model: the whole point is that (C) tells you what a given
    training budget can buy before you spend it.

  discriminated_from:
    - >-
      KN-FIND-002 and KN-FIND-b7e091 (jet, endomorphism and incidence oracles are
      GGM-simulable). Those close SPECIFIC coordinate-derived oracles. A learned
      model is an unspecified coordinate function, so those closures do not cover
      it; what they do is make the (D) loophole narrower than it looks, since
      three natural coordinate structures are already known to be simulable.
    - >-
      IDEA-20260806-530fdd (the degree-budgeted algebraic oracle model). That
      proposes a parameterised simulation theorem over oracle degree. This record
      is the empirical counterpart on the learned side: where 530fdd asks which
      coordinate functions are simulable in principle, this one asks whether a
      trained model is using coordinate structure AT ALL, which is answerable in
      an afternoon with the scrambled-group control. They are complementary and
      should share a batch.
    - >-
      The multi-target and preprocessing material already in RQ-ECDLP-002's
      scope. This record's contribution is not the preprocessing bound but the
      IDENTIFICATION of a trained model with advice, which turns an unbounded
      "let us try ML" into a line on the time-memory frontier with a computed
      position.
    - >-
      "machine learning" and "neural" occur in 23 and 28 files respectively, ALL
      in knowledge/literature and generated indexes; ZERO proposals and ZERO
      hypotheses in this repository apply learning to the ECDLP or state its cost
      model.

  object_first_candidate:
    tracked_object: >-
      THE LEARNED EMBEDDING z: E(F_p) -> R^d together with the linear map it
      induces on the latent space. The tracked quantity is the held-out
      linearisation error as a function of training budget, measured against the
      scrambled-group null.
    lossiness: >-
      A d-dimensional real embedding of an N-element group with d << log N is
      lossy by counting. (A) says the exact case forces d >= 2 with injectivity
      and DLP-hard evaluation; the approximate case is genuinely lossy, and how
      much it retains is exactly what the held-out metric measures. So the loss
      is a measured quantity here rather than a design choice, which is unusual
      and is why the metric must be held-out.
    propagation: >-
      TYPE III in the trichotomy if the model reads coordinates -- which is the
      only interesting case and is precisely what control (E) tests. If the model
      reads only opaque labels it is generic, and then (B) applies and the answer
      is known before training.
    survival_score: >-
      Survives exactly as far as the coordinate structure it uses survives. The
      scrambled-group control measures that directly, and a model that scores
      equally on both datasets has survival zero by construction.

  mechanism: >-
    STEP 1 -- VERIFY THE BOUND AND ITS TIGHTNESS. Stage 0 obtains the
    preprocessing bound's exact statement, its success-probability dependence,
    and the matching algorithm, and writes them into a knowledge entry. Every
    number in (C) is downstream of this and none may be quoted before it.

    STEP 2 -- COMPUTE THE BUDGET TABLE BEFORE TRAINING ANYTHING. For a grid of
    parameter counts and target curve sizes, tabulate the T the bound permits and
    compare against the rho baseline at the same size. This table is the
    deliverable that makes every subsequent decision cheap, and producing it costs
    an afternoon of arithmetic.

    STEP 3 -- BUILD THE SCRAMBLED-GROUP DATASET FIRST, NOT SECOND. The null must
    exist before the positive experiment, or the positive experiment will be run,
    produce a number, and generate pressure to interpret it. The scrambled group
    preserves the group law exactly and destroys coordinates exactly, which is
    what isolates the (D) loophole and nothing else.

    STEP 4 -- TRAIN THE PAIR, WITH THE HELD-OUT PROTOCOL FIXED IN ADVANCE.
    Identical architecture, identical budget, identical schedule, identical
    random seeds where possible, on the curve and on the scrambled group. Report
    held-out success as a function of training-set size for both, on the same axes.

    STEP 5 -- PLACE THE RESULT ON THE FRONTIER, IN THE UNIT THE FRONTIER USES.
    Whatever the outcome, convert the trained model into its (S, T) position --
    parameters in bits, online queries -- and plot it against the known
    preprocessing frontier and against the plain table that saturates the bound.
    A model that is not better than a table of the same size is not an attack,
    and this step is what makes that visible rather than arguable.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      grep -ril over ledger/, knowledge/, docs/ for "machine learning", "neural",
      "embedding", "representation learning", "preprocessing", "advice",
      "Corrigan-Gibbs", performed 2026-08-06 against merge-base 0c856274.
    results: >-
      "machine learning": 23 files, all literature or generated index. "neural":
      28, likewise. ZERO proposals and ZERO hypotheses apply learning to the
      ECDLP. Preprocessing appears in RQ-ECDLP-002's declared method scope and in
      IDEA-20260806-9c2f80 for the OneEnd problem on the isogeny side, but no
      record connects a learned model to the preprocessing bound.
    verdict: >-
      ADAPTATION. The preprocessing bound is published and is not claimed as new;
      the character embedding of (A) is elementary. What is new to this program is
      the identification of a trained model with advice, the resulting
      pre-registered budget, and the scrambled-group control that isolates the one
      loophole. No novelty is claimed against the external literature, where
      applying learning to DLP-type problems has been attempted and Stage 0 should
      locate the prior attempts and their reported controls -- which is itself
      worth recording, since the usual defect in that literature is the absence of
      exactly this null.

  null_object_control: >-
    THE SCRAMBLED-GROUP NULL IS NOT A SUPPLEMENTARY CHECK, IT IS THE EXPERIMENT.
    (1) SCRAMBLED GROUP: same cyclic group, same order, random bijective
    relabelling to strings of equal length. Preserves the group, destroys
    coordinates. Equal performance means the model learned nothing about the
    curve. (2) SHUFFLED-LABEL NULL: the real curve with the TARGET logarithms
    randomly permuted, destroying the input-output relation entirely. Held-out
    performance must fall to chance; if it does not, the evaluation protocol
    leaks and every other number is void. (3) CAPACITY CONTROL: the same
    architecture at several parameter counts, to show the metric responds to
    capacity in the direction the bound predicts rather than saturating for
    implementation reasons.

  assumptions:
    - >-
      The preprocessing bound as recalled is correct and tight. Verified at Stage
      0; the budget table in (C) is void without it.
    - >-
      A trained model's parameters count as advice bits at their storage
      precision. Quantisation changes S and therefore the budget, so the reported
      S must name the precision -- an easy place to inflate a result by a factor
      of 4 without noticing.
    - >-
      The scrambled group is generated with a cryptographic-quality bijection so
      that no residual structure survives relabelling. A weak scramble would leak
      and would make the null too easy to beat.

  proof_search_map:
    bottleneck: >-
      Whether a learned model uses coordinate structure at all. Everything else
      is settled: exact linearisation is the DLP (A), generic learning is bounded
      (B, C). The bottleneck is a single empirical bit and control (E) measures it
      directly.
    baseline_embedding:
      parameter_slice: >-
        S at the size of a plain precomputed table, where the bound is saturated
        by a known algorithm. Any learned model must be compared against the
        table at equal S, and the table is the exact old-method boundary.
      reproduction_check: >-
        Implement the table-based preprocessing attack at toy N and confirm it
        achieves the bound's predicted T. A pipeline that cannot reproduce the
        known matching algorithm cannot evaluate a claim to beat it.
    observation_collision:
      observable: >-
        Held-out success rate at a given training budget.
      distinct_preimage_search: >-
        REQUIRED AND SHARP: find two settings with the same held-out success rate
        -- one on the curve, one on the scrambled group. That collision is
        precisely control (E) returning a negative, and it is the PREDICTED
        outcome. Its presence is the finding; its absence is the interesting
        branch. Framing the null as an observation collision is what makes the
        negative result a positive deliverable rather than a failed experiment.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move "can a learned model help" into the preprocessing model, where it
          becomes the exact inequality S * T^2 = Omega(N), with separate encoding,
          completeness, soundness, transfer and cost-loss obligations.
        predicted_gain: >-
          Zero for generic models, derived. For coordinate-reading models the
          bound does not apply and the gain is unknown -- which is the honest
          statement and the reason the experiment is worth running at all.
      - transform: observable_fiber
        proposed_object: >-
          Hold held-out performance fixed and vary the input presentation --
          affine, projective, x-only, scrambled -- looking for the presentation
          that carries the model's advantage.
        predicted_gain: >-
          Identifies WHICH coordinate structure is being used, if any. This is
          the follow-up that a positive (E) result would earn, and specifying it
          now stops a positive result from becoming an unfalsifiable story.
    quantifier_order: >-
      What the bound gives: FORALL generic algorithms with S bits of advice and T
      queries, S * T^2 = Omega(epsilon N). The advice may depend on the group and
      the generator but NOT on the challenge -- and that is the quantifier a
      learned-model proposal is most likely to violate silently, by training on a
      distribution that includes the challenge or by evaluating on training
      logarithms. Control (2) and the held-out protocol exist to enforce it.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At these toy sizes, with this architecture and budget, the model does
        (not) outperform the scrambled-group null." NEVER "machine learning
        cannot attack the ECDLP" -- a negative here is about one architecture at
        one scale, and the record must say so in the same sentence as the result.
      nearby_object_control: >-
        A group where a learned model SHOULD succeed -- for example a DLP
        instance with a deliberately leaky encoding, where a few input bits
        reveal part of the logarithm. The pipeline must detect that. A pipeline
        that reports "no structure" on a planted-structure instance cannot detect
        structure, and its negative on the real curve is uninformative. This is
        the single most important control in the record and it is the one most
        often skipped in the ML-for-cryptanalysis literature.
    proof_obligations:
      - claim: The preprocessing bound and its tightness are correctly stated.
        responsibility: baseline
      - claim: The table-based matching algorithm is reproduced at toy N.
        responsibility: baseline
      - claim: The scrambled group preserves the group law exactly.
        responsibility: correctness
      - claim: Held-out logarithms are disjoint from training.
        responsibility: soundness
      - claim: S is reported in bits at a named precision.
        responsibility: interface
      - claim: The planted-structure control is detected.
        responsibility: success_probability

  predictions:
    - metric: >-
        held-out success rate on the real curve minus that on the scrambled group,
        at equal architecture and budget
      direction: different
      minimum_effect: >-
        Predicted exactly zero within the measurement band, at every tested
        capacity. A sustained positive gap, reproduced across three capacities and
        two curve sizes, means the model is using coordinate structure and is the
        one outcome that opens the lane.
    - metric: >-
        held-out success rate on the shuffled-label null
      direction: different
      minimum_effect: >-
        Chance. Anything above chance means the evaluation protocol leaks and all
        other numbers are void.
    - metric: >-
        held-out success rate on the planted-leaky-encoding control
      direction: higher
      minimum_effect: >-
        Materially above chance. Failure means the pipeline cannot detect
        structure and no negative result may be reported from it.
    - metric: >-
        the trained model's (S, T) position versus the preprocessing frontier and
        versus a plain table of equal S
      direction: different
      minimum_effect: >-
        Predicted: at or behind the table. A model strictly inside the frontier,
        verified at toy N where the frontier is computable exactly, would falsify
        the bound's applicability and is the strongest possible outcome.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): verify the preprocessing bound; build the budget
      table of (C); locate prior ML-for-DLP attempts and record which controls
      they ran.
      STAGE 1 (hours, HARD GATE): reproduce the table-based preprocessing attack
      at toy N and confirm it meets the bound's predicted T.
      STAGE 2 (hours): construct the scrambled group, the shuffled-label null, and
      the planted-leaky-encoding control.
      STAGE 3 (HARD GATE): run the planted-structure control; the pipeline must
      detect it.
      STAGE 4 (compute-bounded): train the matched pair at three capacities and
      two toy curve sizes; report held-out curves on shared axes.
      STAGE 5 (zero compute): place every trained model on the (S, T) frontier
      against a table of equal S.
    controls:
      - scrambled group -- group preserved, coordinates destroyed
      - shuffled labels -- relation destroyed, must fall to chance
      - planted leaky encoding -- must be detected
      - capacity ladder -- the metric must respond to capacity
      - table-based preprocessing attack reproduced at the same S
    required_metrics:
      - held-out success rate versus training-set size, per dataset and capacity
      - training-set performance reported separately and never as the headline
      - S in bits at a named precision, and T in online group operations
      - (S, T) position against the frontier and against an equal-S table
      - wall-clock and energy per training run

  falsification_conditions:
    - >-
      The shuffled-label null exceeds chance. Evaluation leaks; nothing is
      reported.
    - >-
      The planted-structure control is not detected. The pipeline cannot detect
      structure; no negative may be reported from it.
    - >-
      The table-based attack is not reproduced. The frontier comparison is not
      grounded and Stage 5 is void.
    - >-
      A model beats the scrambled-group null, reproduced across three capacities
      and two sizes. The (D) loophole is live; this becomes a live direction with
      the presentation-ablation of the observable_fiber transform as its immediate
      successor.
    - >-
      A model lands strictly inside the preprocessing frontier at toy N. Either
      the bound does not apply as stated -- meaning the model is provably
      non-generic, which is itself the finding -- or the measurement is wrong. The
      run halts either way.

  confounders:
    - >-
      MEMORISATION REPORTED AS LEARNING. A high-capacity model fits any training
      set; only held-out logarithms mean anything, and training performance is
      reported separately so it cannot become the headline.
    - >-
      TRAINING-SET LEAKAGE THROUGH SELF-REDUCIBILITY. DLP instances are randomly
      self-reducible, so a naive train/test split can put affinely related
      instances on both sides and produce spectacular held-out numbers that mean
      nothing. Splits must be by logarithm value with the self-reduction
      explicitly accounted for, and this is the subtlest failure mode in the whole
      record.
    - >-
      Precision inflation of S. Reporting parameters instead of bits understates
      the advice by a factor equal to the precision and moves the model's frontier
      position by that factor.
    - >-
      Toy-size extrapolation. A curve fitted at toy N cannot be extended to
      cryptographic N; the bound is what carries, not the measurement.

  interpretation_limits:
    - >-
      A negative is about one architecture, one budget, one presentation and one
      scale. It is not a statement about machine learning.
    - >-
      The budget table of (C) is a GENERIC-model statement and does not bind a
      demonstrably coordinate-reading model -- which is why (E) exists and why a
      negative (E) is what makes (C) binding in practice.
    - >-
      Nothing here is a hardness claim about the ECDLP.

  heuristic_assumptions:
    - id: H1
      statement: >-
        A trained model's effective advice, for the purposes of the preprocessing
        bound, is at most its parameter count times its storage precision in bits.
      rigorous_support: >-
        Rigorous side: the model is a function of the public curve description
        alone and is consulted by the online procedure, so it is advice in the
        model's sense, and its description length bounds the advice. Heuristic
        side: that the EFFECTIVE advice is not materially smaller than the naive
        bit count -- a heavily compressible model carries less information than
        its parameter count suggests, which would make the bound BITE HARDER, not
        less. H1 is therefore conservative in the direction that matters, and
        saying so is part of stating it honestly.
      validation_plan: >-
        Compress trained models with a standard lossless compressor and re-run the
        held-out evaluation from the decompressed weights; report compressed size
        alongside parameter count and use the smaller of the two as S. Comparison:
        the (S, T) position computed both ways. Tail check: whether any model's
        performance survives aggressive quantisation, which would show S is much
        smaller than claimed and the frontier position much worse. Toy scale only,
        labelled so.

  target_complexity:
    time_exponent: >-
      NO IMPROVEMENT CLAIMED, AND THE CEILING IS DERIVED: for a generic learned
      model, T >= sqrt(Omega(N)/S). At S = 2^35 bits and N = 2^256 this is
      T >= 2^110 against a rho baseline of about 2^128 -- roughly 18 bits, bought
      with 10^9 parameters, and matched by a plain table of the same size with no
      learning in it.
    memory_exponent: >-
      S is the memory and it is the entire mechanism. A learned attack is a
      time-memory tradeoff and must be reported on that frontier; quoting T alone
      would hide the whole cost.
    best_known: >-
      rho at p^{1/2} time with O(1) memory (KN-TECH-001, KN-TECH-006); the
      preprocessing frontier S * T^2 = N, saturated by a known table-based
      algorithm. A learned model competes against the second and must beat a table.
    hidden_overhead: >-
      Training cost is entirely outside the (S, T) accounting and is not free:
      producing the advice may cost more than the attack it enables, and for any
      table-saturating construction it demonstrably does. Disclosed because the
      preprocessing model conventionally ignores preprocessing time, which
      flatters every learned proposal.
    tradeoff_note: >-
      This IS a time-memory tradeoff proposal whether or not it is framed as one.
      Position: on the S * T^2 = N curve at best, i.e. exactly where a table
      already sits, with additional training cost and no compensating axis.

  dominated_by: >-
    Dominated by a plain precomputed table at equal S on every axis -- same
    (S, T) position, no training cost, no architecture risk, and exact rather
    than approximate answers. Also dominated by rho at p^{1/2} with O(1) memory
    on the memory axis by the full magnitude of S. Checked across time, memory and
    data/query against the frontier rows this program records: rho
    (KN-TECH-001, KN-TECH-006), BSGS (KN-TECH-031), and the preprocessing
    frontier. There is no axis on which a generic learned model is preferable,
    and that is a derivation rather than an expectation.
  sota_delta: >-
    Zero improvement, derived rather than measured, with the ceiling computed
    numerically: 10^9 parameters buys about 18 bits against a 256-bit curve, and a
    table of the same size buys the same 18 bits for free. Deliverables as
    counts: 1 budget table converting any proposed training run into a
    pre-registered (S, T) position before it is funded; 1 exact statement of the
    only loophole (coordinate structure) with 1 control that decides it in an
    afternoon; 4 blocking controls including a planted-structure detector that
    most work in this area omits; and 1 named successor experiment (presentation
    ablation) contingent on the loophole being live.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.93 that the scrambled-group control comes back negative -- i.e. the model
    learns nothing about the curve -- at the scales reachable here. 0.05 that a
    coordinate-structure gap appears and survives three capacities and two sizes.
    The record's value is overwhelmingly in (C) and (E): (C) lets the program
    price any proposed training run before spending on it, and (E) is the control
    whose absence is the standard defect of ML-for-cryptanalysis results, so
    running it is worthwhile independently of the outcome.

