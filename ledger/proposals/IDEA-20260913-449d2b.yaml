idea:
  id: IDEA-20260913-449d2b
  title: >-
    Four quantities, one name -- separate Semaev's d_F4 from the first fall
    degree, from the degree-4 solving predicate, and from the Macaulay-rank
    statistic GOAL-DREG-001 measures, and decide by construction whether that
    campaign's numbers bear on Assumption 1 at all
  class: control
  claim: >-
    SCOPE. Semaev 2015 (KN-LIT-fa346d, frozen at inputs/SEMAEV-2015-310/)
    Assumption 1 ONLY. Nothing here addresses Assumption 2 (Section 4.6,
    d_F4 = o(sqrt(n/ln n))), under which the asymptotic bound (17) stands while
    the Table 3 concrete estimates do not. No claim about any deployed curve.
    CLAIM. The quantity Assumption 1 bounds is not the quantity GOAL-DREG-001
    has been measuring on the same Boolean system, and the two are separated by
    CONSTRUCTION rather than by scale. Four independently falsifiable parts.

    (C1) OPERATIONAL DEFINITION. Semaev's d_F4 (Section 4.4 -- "the maximal
    total degree of the polynomials occurring before a Groebner basis is
    computed") is read in Section 4.5.1 off MAGMA F4's per-step verbosity with
    the trailing steps SUBTRACTED. The paper states, for satisfiable instances,
    that steps bounded by 4 "were followed by at most three more steps, where
    'step degree' was 5, 6, 7 with the message 'No pairs to reduce'". So his own
    runs EXHIBIT step degrees 5, 6 and 7; the reported 4 is a maximum over
    productive steps only. Any reproduction reporting raw max step degree will
    report 5, 6 or 7 on satisfiable instances and will appear to contradict
    Assumption 1 while measuring a different statistic.

    (C1b) THE PUBLISHED 4-VERSUS-5 CONTRADICTION MAY BE DEFINITIONAL, NOT
    NUMERICAL. KN-LIT-e77232 records Kosters (2015-05-02) reporting that the
    n = 45, m = t = 2 Groebner basis terminated with two solutions and
    "reached step degree 5", against Semaev's d_F4 = 4 at n = 40, m = t = 2
    (Table 2). The comment does not say whether post-basis steps were excluded.
    Under Semaev's own convention his n = 40 satisfiable instances ALSO reach
    raw step degree 5 to 7. The two reports are therefore consistent under the
    hypothesis that Kosters quotes the raw maximum and Semaev the productive
    maximum, and this program currently records them as a contradiction
    (KN-LIT-e77232 "Contradiction, kept visible"; KN-OPEN-d218ec section A).
    This part of the claim is falsifiable by the step-degree TRACE, split into
    productive and no-pairs-to-reduce steps, on instances at cells the paper
    reports.

    (C2) THE ALGORITHM-INDEPENDENT SURROGATE. Define SOLV4(I) -- the degree-4
    capped closure predicate. Over the Boolean ring, echelonize the span of
    {m*f : f a generator, deg(m*f) <= 4}; whenever a polynomial of degree
    d < 4 appears, re-admit its multiples up to degree 4; iterate to a fixed
    point R_4. SOLV4(I) holds iff R_4 determines V(I), i.e. R_4 contains 1 when
    I is unsatisfiable, and the dimension of the degree-<=4 quotient equals the
    independently enumerated solution count when it is satisfiable. SOLV4 is a
    rank condition over GF(2), decidable exactly, with no dependence on
    monomial order, S-pair selection strategy or termination message. The
    predicted inequality chain is d_ff <= d_solv and d_solv <= d_F4-productive,
    so a refutation of SOLV4 at a cell refutes Assumption 1 in its
    cost-bearing reading at that cell, while SOLV4 holding does not by itself
    establish d_F4 <= 4 for MAGMA.

    (C3) GOAL-DREG-001 MEASURES NEITHER. That instrument
    (src/h012c_block_m4ri.py with the semi-regular prediction of
    src/h012_peel_rank.py) computes the exact GF(2) rank of a degree-D Macaulay
    matrix and the deficit pred[D] - rank. It outputs no degree. The d_reg
    metric of H-DREG-001 is operationalized in
    experiments/EXP-DREG-001/analysis.md section 6 as rank = nrows ("rank
    69,073 < 74,880 = nrows"), and that condition is predicted UNREACHABLE at
    every D >= 4 for this system because the quadratic block alone contributes
    the n_q Frobenius relations q_i*q_i = q_i and the C(n_q,2) Koszul pairs
    that KN-FIND-006 identifies as the exact generic degree-4 syzygy content.
    On that prediction H-DREG-001 success clauses (i) and (iii) are not
    evaluable in principle, not for want of compute, and the campaign's D = 5
    and D = 6 work measures a semi-regularity defect that neither implies nor is
    implied by Assumption 1.

    (C4) A MEASURED FOURTH DIVERGENCE ALREADY ON RECORD.
    experiments/EXP-DREG-001/analysis.md section 6 records "d_ff sem at n=12 is
    {3, 2} (n=2 samples)", BELOW the 4 that Semaev proves in Section 4.5 for the
    chained system. Either the two d_ff conventions differ, or the generators
    differ, or there is a genuine degree fall at 2-3 on this program's system.
    Distinguishing those three is part of the reconciliation and the outcome is
    pre-registered in all three directions.
  mechanism: >-
    All four quantities are degrees attached to the same ideal I generated by
    the Weil descent of eq. (5), but they quantify over different objects, and
    that is why they can disagree without either side being wrong.

    d_ff quantifies over syzygies exhibiting a degree drop, and is a property of
    I alone. Semaev proves d_ff = 4 for the all-variable S_3 (Section 4.5:
    deg_F2 S_3 = 3 while deg_F2 x_1*S_3 = 3 as well, against
    deg_F2 x_1 + deg_F2 S_3 = 4) and reports it experimentally for the
    constant-R_X equation, where Hodges-Petit-Schlather bound it only by 5.

    d_solv, made concrete as SOLV4, quantifies over degree truncations of I and
    is also a property of I. This is the quantity the cost bound (13),
    O(n^{omega d_F4}), actually needs, because that bound prices the largest
    Macaulay-type echelon form the solve must compute.

    d_F4 quantifies over the trace of ONE algorithm and is a property of the
    tuple (I, monomial order, selection strategy, termination test, verbosity
    convention). It is therefore not a mathematical invariant of I at all, which
    is why the trailing-step subtraction is a substantive modelling choice and
    not bookkeeping. The subtraction has a second consequence that is easy to
    miss and is charged here as a separate falsifiable item: cost. Section 4.4
    accepts (13) on the argument that "the ratio between the overall running
    time and the largest step running time was bounded by ~3 for the number of
    variables n ~ 50". If the excluded degree-5/6/7 steps are where the time or
    memory actually goes at larger n -- and Kosters' 126 GB at n = 45 against
    Semaev's 3913 MB over 100 systems at n = 40 is the only public data point
    bearing on it -- then d_F4 as defined excludes the dominant cost, and the
    exclusion is optimistic rather than neutral.

    d_reg-BFS quantifies over the Hilbert series of the ideal of top-degree
    forms and is a property of the homogenization of I. That is exactly why a
    rank deficit against pred[D] can exist at D = 6 (EV-DREG-008,
    deficit_genuine = 17947 at n = 12) while a degree-4 truncation still
    resolves the system: a semi-regularity defect is a statement about
    syzygies, and SOLV4 is a statement about what the truncation determines.

    The literature's "does d_ff track d_reg" dispute (KN-LIT-7604,
    KN-LIT-7607) is therefore partly a dispute about which of these four is
    meant, and the Semaev/Kosters 4-versus-5 exchange is partly a dispute about
    whether non-productive steps are counted. Neither observation resolves
    either dispute; both make it measurable.
