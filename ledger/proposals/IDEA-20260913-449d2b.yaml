  assumptions:
    - >-
      Public standalone instances only. No deployed target, no private key, no
      claim about the security of any FIPS PUB 186-4 binary curve in either
      direction; those n are parameter labels here and nothing more.
    - >-
      The DREG builder produces the Weil descent of eq. (5) at t = m = 3 with
      k = ceil(n/m) and not some other chained system. KN-FIND-006's "n quadrics
      plus n cubics in nb = 2n variables" is consistent with the paper's count
      (n(t-2) cubics plus n quadratics in n(t-2) + kt variables at t = 3) but
      consistency of counts is not coefficient-wise equality, and step 2 of the
      minimal test exists to decide it.
    - >-
      The Boolean ring convention -- squarefree monomials with field equations
      implicit, versus explicit field-equation rows -- is the same in both
      instruments, or the difference is recorded and its effect on nrows and on
      the trivial-syzygy count is reported per cell.
    - >-
      MAGMA is not available to this program. Semaev's d_F4 in its exact
      operational sense can therefore never be reproduced here, only bracketed
      between d_ff and d_F4-productive for a NAMED open-source engine. This is
      an infrastructure limit, not mathematical evidence either way (AGENTS.md
      rule 5).
  predictions:
    - metric: >-
        number of the four degrees (d_ff, SOLV4-implied d_solv,
        d_F4-productive, d_reg-BFS bracket) that coincide on a reproduced
        Table-2 cell
      direction: lower
      minimum_effect: >-
        At most 3 of 4 coincide on at least one cell with n <= 21. Falsified if
        all four agree on every reproduced cell, in which case GOAL-DREG-001's
        measurements DO bear on Assumption 1 and C1-C4 are refuted together.
    - metric: >-
        max RAW step degree on cells the paper reports as d_F4 = 4, with
        post-basis steps NOT subtracted, satisfiable stratum
      direction: higher
      minimum_effect: >-
        At least 5 on at least 50 percent of satisfiable instances at
        n = 12, m = t = 6, k = 2 and n = 21, m = t = 3, k = 7. This is predicted
        by the paper's own Section 4.5.1 sentence; its absence falsifies C1 for
        the engine used.
    - metric: >-
        max raw step degree on the UNSATISFIABLE stratum of the same cells
      direction: different
      minimum_effect: >-
        At most 4, matching the paper's "if the ideal generated by the
        polynomials is unit, then step degree was always bounded by 4". A
        satisfiable/unsatisfiable split of raw max step degree at exactly
        (5 or more, 4) reproduces Semaev's and Kosters' reports SIMULTANEOUSLY
        and supports C1b; no split falsifies C1b and leaves the published
        4-versus-5 disagreement numerical rather than definitional.
    - metric: rank(M_D) - nrows(M_D) at D = 4, 5, 6 on the DREG cells
      direction: lower
      minimum_effect: >-
        Strictly negative at every D >= 4 and every n, with the D = 4 shortfall
        at least n_q + C(n_q,2). A single cell with rank = nrows falsifies C3.
    - metric: >-
        SOLV4 at n = 12, m = t = 3, k = 4 (the cell EV-DREG-008 reports its
        D = 6 deficit on)
      direction: different
      minimum_effect: >-
        A definite exact true/false. TRUE means the D = 6 deficit is orthogonal
        to Assumption 1 and GOAL-DREG-001's numbers neither support nor
        contradict it. FALSE means Assumption 1 already fails at n = 12 in its
        cost-bearing reading, which contradicts Table 2's d_F4 = 4 at n = 12 and
        localises the disagreement to the definition rather than to the scale.
    - metric: >-
        d_ff measured by src/ic_first_fall_fast.py on generators independently
        rebuilt from the frozen S_3
      direction: different
      minimum_effect: >-
        Exactly 4 if the rebuilt generators are the descent of eq. (5) and the
        conventions match, which would localise the recorded {3, 2} to the DREG
        builder or to a convention difference; a value below 4 on independently
        rebuilt generators instead contradicts Semaev's Section 4.5 proof for
        this system and must be escalated rather than reported as a detail.
    - metric: >-
        share of wall time and of peak RSS spent in the excluded
        no-pairs-to-reduce steps, as a function of n at fixed m = t = 2
      direction: higher
      minimum_effect: >-
        NO POINT PREDICTION -- pre-registered as unknown. Both outcomes are
        informative and neither is treated as confirmation. A share that grows
        with n makes the trailing-step exclusion optimistic in cost terms; a
        flat small share makes it cost-neutral and supports the paper's factor
        of about 3.
  minimal_test:
    execution_status: design_only
    design: >-
      Zero authorized runs here. The design below is what a future approved
      contract would freeze. Three steps, no Groebner basis required for the
      load-bearing parts.
      (1) DEFINITIONAL AUDIT, no compute. Write the four definitions side by
      side with their quantifiers. Read src/h012c_block_m4ri.py,
      src/h012_peel_rank.py and experiments/EXP-DREG-001/DREG_harness.py to
      determine which target `rank` is compared against in code (nrows, ncols,
      pred[D], or the degree-exactly-D block) and record the comparison
      verbatim. Check symbolically whether rank = nrows is attainable at D >= 4
      given n_q Boolean quadrics.
      (2) BUILDER EQUALITY, cheap. Regenerate the Weil descent of eq. (5) at
      n = 12, m = t = 3, k = 4 independently from the frozen
      S_3 = (x1x2 + x1x3 + x2x3)^2 + x1x2x3 + B and compare generator sets
      coefficient-wise against the DREG builder's output on the same seed and
      the same basis of F_{2^n} over F_2. A mismatch stops the reconciliation
      and is itself the finding.
      (3) FOUR-DEGREE PROFILE. On n = 12, m = t = 6, k = 2 and n = 21,
      m = t = 3, k = 7 (both exact Table 2 rows) and on n = 12, m = t = 3, k = 4
      (the EV-DREG-008 cell), for at least 40 instances per cell stratified
      50/50 satisfiable/unsatisfiable, compute per instance -- d_ff via
      src/ic_first_fall_fast.py; SOLV4 by degree-capped GF(2) closure; the
      Macaulay rank and the semi-regular deficit at D = 4 and D = 5; and the
      full step-degree trace of one NAMED open-source engine with productive
      and no-pairs-to-reduce steps reported separately, together with per-step
      time and peak RSS. Sizes computed in this session from the paper's own
      variable count N = n(t-2) + kt with n(t-2) cubic and n quadratic Boolean
      generators, dense bit-packed upper bounds -- n = 12, m = t = 3, k = 4
      (N = 24): D = 4 is 3912 x 12951 = 0.006 GiB, D = 5 is 31512 x 55455 =
      0.203 GiB; n = 21, m = t = 3, k = 7 (N = 42): D = 4 is 19887 x 124314 =
      0.288 GiB, D = 5 is 279048 x 974982 = 31.7 GiB (OUT of the 8-16 GB
      envelope and pre-declared as an impediment, not a result);
      n = 12, m = t = 6, k = 2 (N = 60): D = 4 is 24900 x 523686 = 1.52 GiB,
      D = 5 is 362 GiB (out of reach). Every D = 4 cell is affordable; the
      D = 5 cells that are not are listed with their recheck.
    matched_null: >-
      The support-matched semi-regular null already used by EXP-DREG-001
      (random Boolean system with the same variable count, the same number of
      quadratic and cubic generators, and the same support profile, whose first
      fall degree is not 4 by construction), carried through ALL FOUR degree
      measurements rather than only the rank one. A degree statistic that does
      not move between the structured and null systems is measuring the shape,
      not the chained structure, and must be reported as a controlled null.
    known_false: >-
      Two known-false objects. (a) A system in which a solution is planted and
      then a single generator is corrupted at one coefficient so the system is
      unsatisfiable while its shape, support and degree profile are unchanged;
      SOLV4 must then certify inconsistency (1 in R_4) and not report the
      planted solution count. (b) The paper's own conceded off-diagonal family
      k > ceil(n/m), where Section 4.5.1 states the regularity degree
      "generally exceeds 4" while d_ff stays 4 -- the reconciliation must assign
      DIFFERENT values there (d_ff = 4, SOLV4 false) than on the diagonal
      (d_ff = 4, SOLV4 true). A proposed identification of the quantities that
      cannot separate that pair has not identified the load-bearing structure.
      Measured as an axis of IDEA-20260913-191ed2.
    invalid_input_reject: >-
      Three rejects that must be refused rather than scored. (i) A generator set
      whose Boolean degrees are not (n(t-2) cubics, n quadratics) for the
      declared (n, t) -- wrong system, reject. (ii) t = 1, where eq. (5) has no
      equations, must reject rather than return SOLV4 = true vacuously.
      (iii) An instance whose claimed solution count was not obtained by
      independent enumeration must be refused as an input to SOLV4, since the
      predicate's satisfiable branch is defined against that count.
    controls:
      - kind: matched_null
        design: >-
          EXP-DREG-001's support-matched semi-regular null, run through d_ff,
          SOLV4, Macaulay rank/deficit and the step-degree trace.
      - kind: known_false
        design: >-
          One-coefficient corruption of a planted-solution instance
          (unsatisfiable, shape preserved), plus the off-diagonal
          k > ceil(n/m) family where the paper itself predicts the opposite
          SOLV4 verdict.
      - kind: invalid_input
        design: Wrong-degree generator sets, t = 1, and unenumerated solution counts all reject.
      - kind: baseline
        design: >-
          Exact reproduction of the frozen Table 2 cells as the calibration
          control. A cell where the paper reports d_F4 = 4 and this program's
          d_F4-productive bracket also contains 4 is what gives any later
          disagreement meaning; without it a disagreement is equally explicable
          as an engine difference.
      - kind: satisfiability_stratification
        design: >-
          Planted instances (z = x-coordinate of the sum of t factor-base
          points with x in V) against uniform-z instances, with each instance's
          satisfiability and solution count determined INDEPENDENTLY. At t = 2
          this costs O(2^k) field operations by solving
          (x_1+z)^2 x_2^2 + x_1 z x_2 + ((x_1 z)^2 + B) = 0 for x_2 and testing
          membership in V; at t = 3 it costs O(2^{2k}) by the same route through
          u_1. KN-LIT-e77232 relevance note 2 flags this as the confound that
          makes null-derived degree ceilings optimistic rather than
          conservative.
      - kind: strategy_control
        design: >-
          The same ideal under at least 2 monomial orders and at least 2
          selection strategies. If the raw step-degree observable moves while
          SOLV4 does not, C1 is established without any appeal to MAGMA.
      - kind: engine_cross_validation
        design: >-
          SOLV4 decided by two independent GF(2) rank routines on the identical
          matrix; disagreement invalidates the cell rather than being averaged.
    decision_threshold: >-
      C1 established if raw max step degree exceeds 4 on at least 50 percent of
      satisfiable instances at a cell the paper reports as 4, on at least one
      engine, with the unsatisfiable stratum at 4. C1b established if the
      satisfiable/unsatisfiable split of RAW max step degree is (5 or more, 4)
      at n = 40-scale m = 2 cells reached, which reproduces both published
      reports at once. C2 established if SOLV4 is decided exactly and agrees
      with the enumerated solution count on every calibration cell and both
      known-false objects. C3 established if rank < nrows at every measured
      (n, D >= 4) cell and the code's comparison target is nrows. C4 resolved
      into one of its three named directions. Any cell exceeding 8 GB or its
      wall-clock cap is reported as an impediment with a recheck, never as a
      degree result.
    stopping_rules:
      - >-
        Stop the cell and record an impediment with its recheck if peak RSS
        exceeds the declared cap or wall clock exceeds the declared cap. A
        resource exhaustion is never negative mathematical evidence
        (AGENTS.md rule 5), and GOAL-DREG-001's own n = 15 attempt already
        failed this way in the prepare phase.
      - >-
        Stop the whole reconciliation at step 2 if the builder-equality check
        fails, and report the mismatch as the finding; every later comparison
        would otherwise be between two different systems.
      - >-
        Stop and invalidate the cell if the two GF(2) rank routines disagree.
      - No run is authorized by this record.
    required_artifacts:
      - side-by-side definition table with explicit quantifiers for all four degrees
      - verbatim quotation of the DREG code's rank comparison target, with file and line
      - coefficient-wise builder-equality report at n = 12, m = t = 3, k = 4
      - per-instance record of d_ff, SOLV4 with its certifying rank and closure iteration count, rank(M_D), pred[D], deficit at D = 4 and 5
      - full step-degree trace per instance, productive and no-pairs-to-reduce steps separated, with per-step time and peak RSS
      - independently enumerated satisfiability and solution count per instance
      - null-arm and both known-false-arm results in the identical format
      - engine, version, monomial order and selection strategy per run
      - impediment records with rechecks for every cell not reached
    budget:
      authorized_runs_in_this_task: 0
      future_experiment_status: >-
        Requires a new approved frozen handoff and contract. KN-OPEN-d218ec
        already names EXP-SEMBIN-c2c312 as the assigned vehicle; this record
        does not create, approve or dispatch it.
  falsification_conditions:
    - >-
      All four degrees coincide on every reproduced cell, including on the
      off-diagonal known-false family. The quantities are the same in practice,
      GOAL-DREG-001's measurements DO bear on Assumption 1, and C1-C4 die
      together.
    - >-
      The DREG code compares rank against the degree-exactly-D monomial count
      (i.e. computes d_reg-BFS proper) rather than against nrows. C3's
      "unreachable by construction" clause is refuted and the analysis prose is
      merely loose.
    - >-
      The named open-source engine reports raw max step degree 4, with no
      trailing 5/6/7 steps, on satisfiable instances. C1 is refuted for that
      engine and the paper's own Section 4.5.1 sentence needs another
      explanation.
    - >-
      No satisfiable/unsatisfiable split appears in raw max step degree. C1b is
      refuted and the Semaev/Kosters disagreement stays numerical.
    - >-
      The DREG builder's generators are not the descent of eq. (5). The
      reconciliation question is void as posed and is replaced by "which system
      has GOAL-DREG-001 been measuring", which is a larger finding and a new
      record.
    - >-
      SOLV4 is false at a cell the paper reports as d_F4 = 4 and stays false
      under every strategy and both satisfiability strata. Assumption 1 then
      fails at n <= 21 in its cost-bearing reading -- far stronger than anything
      this proposal claims, and it must go to review-breakthrough rather than
      into a summary.
    - >-
      d_ff on independently rebuilt generators is below 4. That contradicts
      Semaev's Section 4.5 proof for this system and must be escalated, not
      recorded as a convention detail.
  confounders:
    - >-
      Satisfiability is the dominant confound in every degree measurement here.
      Semaev's 2300 systems are heavily weighted to unsatisfiable instances --
      his own experimental probabilities run from 0.00 to 0.47 -- and he states
      the unit-ideal case never left degree 4. Any comparison that does not
      stratify is comparing mixtures.
    - >-
      Monomial order and selection strategy for any step-degree number. MAGMA's
      F4 is not reproducible here at all, so no cross-engine step-degree
      equality may be asserted in either direction.
    - >-
      Boolean ring convention -- explicit field-equation rows versus implicit
      squarefree monomials -- changes nrows and the trivial-syzygy count, hence
      every deficit and every "full rank" verdict.
    - >-
      Planted-solution sampling importance-weights the target by its number of
      decompositions, so planted instances are not "uniform z conditioned on
      satisfiable". Report both strata and never pool them.
    - >-
      Table 1 fixes B = 1 while Table 2 draws B at random, so Table 1 cells are
      not averaged over curves; a curve-specific effect will look like an n
      effect if the two tables are pooled.
    - >-
      The curve coefficient A is never stated in the paper. S_3 in eq. (14)
      does not involve A, so the degree measurements are A-independent -- but
      anything about whether a solution lifts to a RATIONAL relation is
      A-dependent, and mixing the two is the trap IDEA-20260913-9ba7fc prices.
  interpretation_limits:
    - >-
      This settles a definition and a bracket of inequalities. It establishes
      nothing about whether Assumption 1 is true at any n, and nothing at all at
      n = 409 or n = 571.
    - >-
      Assumption 1 and Assumption 2 are different claims. Nothing here touches
      Assumption 2, under which the bound (17) survives while the Table 3
      concrete estimates do not. They must never be refuted as one object.
    - >-
      A finding that GOAL-DREG-001's metric is orthogonal to Assumption 1 is
      not a criticism of its measurements, which stand as semi-regularity data.
      It bounds what they may be cited FOR.
    - >-
      Kosters' two figures are blog-comment data with no published artifact.
      They motivate the parameter cells and the C1b hypothesis; they support no
      conclusion until an agent here measures them.
    - >-
      No statement about the security of any deployed curve, in either
      direction, follows from anything in this record.
    - >-
      MECHANISM-LANE IDEA NOT PURSUED HERE, named once and left for the
      parallel lane -- if the trailing no-pairs-to-reduce steps turn out to
      dominate cost, a solver that STOPS at the degree-4 closure and accepts a
      partial answer (test membership of candidate x-tuples in V by
      enumeration instead of finishing the basis) is a forward variant, not an
      audit question.
  heuristic_assumptions:
    - id: H1-IDEA-20260913-449d2b
      statement: >-
        (Strategy-invariance of the solving predicate.) For the Weil descent of
        eq. (5) with k = ceil(n/m), SOLV4 is invariant under the choice of
        degree-compatible monomial order and S-pair selection strategy, while
        the raw maximal step degree is not. Formally -- for every instance I in
        the family and all admissible (order, strategy) pairs s and s',
        SOLV4(I) is independent of s; and there exist I, s, s' with
        maxStepDeg(I,s) different from maxStepDeg(I,s').
      rigorous_support: >-
        SOLV4 is defined as a span/rank condition on the degree-<=4 truncation
        of the ideal in the Boolean ring, which is order-independent by
        construction. The classical Macaulay-triangulation equivalence (Lazard,
        cited as [16] of the frozen paper; provenance recalled, not opened) is
        the statement that degree-bounded linear algebra and degree-bounded
        Groebner computation see the same truncation. The non-invariance half is
        EXHIBITED, not assumed, by the paper's own trailing 5/6/7 steps.
      random_model_justification: >-
        None required and none claimed for the invariance half -- it is an
        algebraic property of a truncation, not a distributional statement. The
        distributional part is only the sampling of instances within a cell,
        which is modelled as uniform z over F_{2^n} exactly as Section 4.5.1
        does ("the X-coordinate R_X of a random R was substituted by a random
        element z from F_{2^n}").
      validation_plan: >-
        Sample at least 40 instances per cell at n = 12, m = t = 6, k = 2 and
        n = 21, m = t = 3, k = 7, stratified 50/50 by independently enumerated
        satisfiability; run at least 2 orders times 2 strategies per instance.
        Compare the empirical distribution of maxStepDeg across (order,
        strategy) against the constant function SOLV4. Predicted comparison
        distribution -- degenerate for SOLV4 (all mass on one value per
        instance), non-degenerate for maxStepDeg. Tail check -- the largest
        maxStepDeg observed across all strategies against the paper's reported
        7. Sampled parameters recorded exactly. Transfer assumption stated
        explicitly -- nothing is claimed for MAGMA's F4 and nothing for n > 21.
      falsification_condition: >-
        SOLV4 differs between two admissible (order, strategy) pairs on one
        instance, which would mean the closure is mis-implemented; or maxStepDeg
        is constant across all strategies on all instances, which removes the
        exhibited non-invariance and weakens C1 to the trailing-step point
        alone.
    - id: H2-IDEA-20260913-449d2b
      statement: >-
        (Degree-4 syzygy saturation.) For this system at D >= 4 the GF(2)
        Macaulay rank satisfies rank(M_D) <= nrows(M_D) - n_q - C(n_q,2), where
        n_q is the number of Boolean quadratic generators, so the
        operationalization rank = nrows is unreachable.
      rigorous_support: >-
        The n_q Frobenius relations q_i*q_i = q_i and the C(n_q,2) Koszul pairs
        q_i*q_j = q_j*q_i are unconditional row dependencies of any Macaulay
        matrix built from quadratic Boolean generators with multipliers of
        degree at least 2; KN-FIND-006 records that for this system at t = 3
        these are exactly the generic degree-4 syzygy content, verified to the
        integer as rank(G) = nrows - pred[4].
      random_model_justification: >-
        The rigorous part needs no random model. The "exactly" in KN-FIND-006
        imitates the classical semi-regular sequence model of
        Bardet-Faugere-Salvy (recalled), under which no syzygies beyond the
        trivial ones appear below the degree of regularity.
      validation_plan: >-
        Recompute rank(M_4) and nrows(M_4) exactly at n = 12, 15, 18 for
        m = t = 3 (0.006 / 0.028 / 0.098 GiB dense by the sizes computed in this
        session) and report nrows - rank against the predicted
        n_q + C(n_q,2) plus the KN-FIND-006 deficit. Compare against the
        support-matched semi-regular null, where the same trivial dependencies
        exist and the additional deficit should vanish. Tail check -- the
        largest measured excess over the predicted shortfall across cells.
      falsification_condition: >-
        nrows - rank strictly below n_q + C(n_q,2) at any cell, which would
        refute the counting argument; or any cell reaching rank = nrows.
  target_complexity:
    time_exponent: >-
      No new exponent claimed or sought. The audited claim is Semaev's
      2^{c sqrt(n ln n)} with c = 2/(2 ln 2)^{1/2} approximately 1.6986,
      conditional on Assumption 1 (or, for the bound alone, on Assumption 2's
      d_F4 = o(sqrt(n/ln n))).
    memory_exponent: >-
      No new memory claimed. The audited claim states none; stage 2 stores
      Theta(2^{ceil(n/m)}) relations, priced in IDEA-20260913-9c54f9.
    best_known: >-
      For E(F_{2^n}) with n prime -- van Oorschot-Wiener parallel Pollard rho
      with distinguished points, about 2^{n/2} group operations total and
      2^{n/2}/M per processor with linear speedup in M, negligible per-processor
      memory beyond the distinguished-point store, unconditional. Diem's
      subexponential result covers non-prime n only; Petit-Quisquater's
      2^{c n^{2/3} ln n} is itself conditional on a first-fall-degree
      assumption.
    best_known_comparator: >-
      vOW parallel rho; BSGS; Pollard rho; Semaev 2015 conditional
      2^{1.6986 sqrt(n ln n)}; Petit-Quisquater 2012 conditional
      2^{c n^{2/3} ln n}; Gaudry/Diem index calculus (non-prime n, out of
      scope).
    hidden_overhead: >-
      Under Assumption 1 the per-solve cost is claimed polynomial as
      [n(m-1)]^{4 omega}. This record does not assess that exponent; it only
      asks whether the d_F4 in it is the quantity anyone here has measured. Note
      separately that Table 3's column 4 uses n^{12} rather than
      [n(m-1)]^{12}, i.e. it prices the BLOCK-structured solver the paper never
      implements -- quantified in IDEA-20260913-9c54f9.
    tradeoff_note: >-
      Not applicable. The deliverable is a definition, a predicate and a
      bracket of inequalities, not an algorithm, so there is no time-memory
      tradeoff to position.
    cost_model: >-
      Exact GF(2) rank and degree-capped closure. Dense bit-packed upper bounds
      computed in this session -- 0.006 GiB at (n=12, m=t=3, D=4), 0.288 GiB at
      (n=21, m=t=3, D=4), 1.52 GiB at (n=12, m=t=6, D=4). No exponent gain
      claimed.
    data_query_cost: >-
      One instance generation and one independent satisfiability enumeration per
      instance, O(2^k) field operations at t = 2 and O(2^{2k}) at t = 3, both
      charged.
    established_exponent_gain: 0
  estimated_cost:
    implementation: medium
    compute: low
    proposal_task:
      maximum_runs: 0
      wall_clock_cap_seconds: 3600
      memory_cap_gb: 4
    future_test: >-
      Under 5 CPU-hours for the D = 4 arms and the definitional audit; the D = 5
      arms at n = 21 and n = 12/m = 6 are pre-declared out of the 8-16 GB
      envelope and are not required for any part of the claim.
    dominant_cost: >-
      Exact GF(2) rank at D = 4 and the independent satisfiability enumeration.
  recommended_priority: high
  proof_search_map:
    bottleneck: >-
      The inequality d_F4 <= d_ff. Assumption 1 is exactly this step and
      nothing else, since d_ff = 4 is proved in Section 4.5. Every
      polynomial-per-solve claim, hence eq. (15) and Table 3, rests on it -- and
      on which quantity the symbol d_F4 denotes.
    baseline_embedding:
      parameter_slice: >-
        n = 12, m = t = 6, k = 2 and n = 21, m = t = 3, k = 7 -- Table 2 rows
        with d_F4 = 4 that lie inside this program's instrument reach, so the
        reproduction is an exact parameter slice of the paper's own evidence
        rather than a lookalike.
      reproduction_check: >-
        Frozen fixture -- the per-cell (n, m, t, k, exp_prob, P_theoretical,
        d_F4, avg_seconds, total_MB) rows of
        inputs/SEMAEV-2015-310/tables.yaml. A reproduction is accepted only if
        it reports all four degrees per instance and states which one it is
        comparing against the frozen 4.
    observation_collision:
      observable: >-
        The single integer "maximal step degree" reported by a Groebner engine.
      distinct_preimage_search: >-
        Two searches, one on each side of the conclusion. (a) Construct two
        instances of the SAME (n, m, t, k) cell, one satisfiable and one
        unsatisfiable, whose observable collides at 4 while SOLV4 differs.
        (b) Construct one instance whose observable is 4 under one
        order/strategy and 5 under another on the identical ideal. Either
        collision falsifies identifiability of Assumption 1 from the published
        number. (b) is strongly expected -- the paper's own trailing 5/6/7 steps
        are an existence proof that the raw observable exceeds 4 on instances it
        reports as 4.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "d_F4 <= 4" by the algorithm-independent predicate SOLV4 -- a
          rank/span condition on the degree-<=4 truncation over GF(2).
        predicted_gain: >-
          Converts a claim about a proprietary implementation's verbosity
          output into exact linear algebra affordable at the cells where the
          published dispute sits, and makes "Assumption 1 fails here"
          one-sidedly certifiable. No complexity gain.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (max step degree = 4) fixed and vary the
          forgotten structure -- satisfiability, order, strategy, whether
          trailing steps are counted. The intrinsic invariant separating the
          fibres is SOLV4.
        predicted_gain: >-
          Names exactly which published 4s are evidence for Assumption 1 in its
          cost-bearing reading and which are not.
    quantifier_order: >-
      Assumption 1 as written -- FORALL n, FORALL m with 2 <= m < n, FORALL
      subspaces V of dimension k = ceil(n/m), FORALL t with 2 <= t <= m, FORALL
      instances -- d_F4 <= 4. The evidence offered is -- EXISTS a MAGMA version,
      EXISTS a monomial order and selection strategy, EXISTS a termination
      convention (trailing steps subtracted), FORALL 2300 instances drawn from
      the 33 published (n, m, t, k) cells with n <= 21 and m <= 6 plus one cell
      at n = 40, m = t = 2 -- observable = 4. The witness (strategy,
      convention) is quantified over nothing in the published statement yet must
      be fixed before the statement has a truth value. That quantifier defect is
      the whole content of C1.
    method_ceiling:
      strongest_certifiable_claim: >-
        Per instance and exactly -- d_ff; whether SOLV4 holds; the degree-D
        Macaulay rank and its semi-regular deficit; and the
        productive/non-productive step-degree profile of ONE named open-source
        engine. It cannot certify anything about MAGMA's F4, and it cannot turn
        any of these into a statement at n = 409 or n = 571.
      nearby_object_control: >-
        The paper's own conceded family k > ceil(n/m), where it states the
        regularity degree "generally exceeds 4" while d_ff stays 4. The
        reconciliation must assign different values there than on the diagonal;
        a proposed identification that cannot distinguish the pair has not
        identified the load-bearing structure.
    proof_obligations:
      - claim: d_ff <= d_solv for these systems
        responsibility: correctness
      - claim: >-
          If SOLV4(I) is false then every complete degree-by-degree
          Groebner/XL procedure has a PRODUCTIVE step of degree at least 5
        responsibility: correctness
      - claim: >-
          rank = nrows is unattainable at D >= 4 for a system containing at
          least 2 Boolean quadrics, hence H-DREG-001 clauses (i) and (iii) are
          vacuous as written
        responsibility: scope
      - claim: >-
          The DREG builder's generators equal the Weil descent of eq. (5) at
          t = m = 3 coefficient-wise
        responsibility: baseline
      - claim: >-
          The recorded d_ff = {3, 2} at n = 12 is a convention or builder
          difference and not a refutation of Semaev's Section 4.5 proof
        responsibility: baseline
      - claim: >-
          Nothing here bears on Assumption 2 or on any deployed curve
        responsibility: scope
    not_applicable_reason: null
  dominated_by:
    status: n/a (no algorithm claimed)
    checked_rows:
      - name: van Oorschot-Wiener parallel rho with distinguished points
        time: about 2^{n/2} group operations total, 2^{n/2}/M per processor
        memory: distinguished-point store, small per processor
        data: walk queries only
      - name: Pollard rho (textbook, serial)
        time: about 2^{n/2}
        memory: O(1)
        data: walk queries
      - name: BSGS
        time: about 2^{n/2}
        memory: about 2^{n/2}
        data: about 2^{n/2} table entries
      - name: Semaev 2015 chained-S_3 index calculus (the audited claim)
        time: conditional 2^{1.6986 sqrt(n ln n)}
        memory: Theta(2^{ceil(n/m)}) relations, unstated in the paper
        data: about 2^{ceil(n/m)} relations
      - name: Petit-Quisquater 2012
        time: conditional 2^{c n^{2/3} ln n}
        memory: unstated here
        data: relations
      - name: Gaudry / Diem index calculus
        time: subexponential along non-prime n
        memory: relation store
        data: relations
        note: out of scope -- n prime here
    missing_comparisons:
      - >-
        No numerical Pareto sweep across the frontier was performed in this
        record; the sweep belongs to IDEA-20260913-9c54f9.
    note: >-
      This proposal puts no point on the frontier, so no row dominates it in the
      Pareto sense. What it changes is which rows may be cited as conditional
      and on what. dominated_by is therefore "n/a (no result claimed)" and NOT
      null.
  sota_delta:
    established_time_exponent_improvement: 0
    established_memory_exponent_improvement: 0
    conditional_delta: >-
      0 established, and none sought. This is a measurement-integrity audit and
