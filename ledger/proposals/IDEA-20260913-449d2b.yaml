    quantitative_statement: >-
      Decides whether GOAL-DREG-001's measured series -- sem deficits
      1322 / 1862 / 1999 at n = 12/15/18 and deficit_genuine = 17947 at the
      D = 6 cell -- counts as evidence about Assumption 1 or about a quantity
      that does not bear on it; and whether two of H-DREG-001's three success
      clauses are evaluable at all. Expected cost under 5 CPU-hours with no new
      instrument beyond a GF(2) degree-capped closure.
    measurement_status: unmeasured
  authorized_runs: 0
