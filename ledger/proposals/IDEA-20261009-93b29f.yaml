  source: User request 2026-10-09 ('these all sound great') on the follow-on angles after BATCH-2e44f7; filed by
    the coordinator under the standing authorization.
  title: Replicate the canonical-lift and torsion-section measurements at p near 10^4 to 10^5
  class: replication
  claim: The rule v_p(z([p]P^)) >= 2 iff v_p(j(E^) - j_can) >= 2e, and the torsion-section identities of EXP-CZLIFT-ae0a13,
    hold at p between 10^4 and 10^5 with sampled points, moving the claim tier from toy to medium.
  mechanism: 'Both drivers are exact at any precision; only point counting (needed for n) limits p. With #E from
    the CM norm equation (anomalous arm) and Schoof-free SEA-less counting replaced by the CM trace formula for
    the CM arm, p ~ 10^5 is reachable.'
  novelty_status: adaptation
  citations:
  - ref: KR-IC-cd159a
    provenance: internal
    verified_by: coordinator, this session (2026-10-09), read the row/entry on disk
    claim: 'Known-negative row: xedni calculus and lifting to characteristic zero fail (Jacobson-Koblitz-Silverman-Stein-Teske);
      forecloses ''canonical lift for ECDLP'' and ''rank of lifted curve''.'
  - ref: KR-RHO-53c89f
    provenance: internal
    verified_by: coordinator, this session (2026-10-09), read the row/entry on disk
    claim: 'Textbook row: Semaev/Satoh-Araki/Smart solve trace-one curves in polynomial time; forecloses ''p-adic
      lifting for trace one'' as a generic algorithm.'
  - ref: KN-TECH-73630e
    provenance: internal
    verified_by: coordinator, this session (2026-10-09), read the row/entry on disk
    claim: The canonical prime-to-p torsion lift exists and is closed for every group-theoretic invariant; the formal
      logarithm route degenerates to O = mO.
  predictions:
  - metric: rule_agreement
    direction: different
    minimum_effect: rule_agreement = 1, identity_rate = 1, |z| <= 4
  minimal_test:
    design: EXP-CZLIFT-17b7eb and EXP-CZLIFT-ae0a13 successors with p in [10^4, 10^5], CM arm only (orders from
      the CM norm form), 200 sampled pairs per curve
    required_metrics:
    - rule_agreement
    - identity_rate
    - success_rate z-scores
  falsification_conditions:
  - any rule disagreement or identity failure at the larger primes
  interpretation_limits:
  - CM curves only at medium scale (random curves need point counting the harness does not have)
