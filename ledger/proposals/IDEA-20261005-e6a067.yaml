        recollection.
  assumptions:
    - >-
      Both families use the same predicate, including the exclusion of the
      section y=0. A predicate that is not executable is an infrastructure
      stop, not a gap of 0.
    - >-
      Slots are coefficient vectors of b of exact degree 4 or exact degree 6
      over F_5. Leading coefficient nonzero.
    - >-
      p=5 does not transfer to the contracted census primes 101, 211, 431,
      and 809.
    - >-
      No slot is lifted to Q. The predicate stays in characteristic 5.
  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms:
