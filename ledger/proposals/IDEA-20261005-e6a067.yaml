idea:
  id: IDEA-20261005-e6a067
  question_id: RQ-XEDN-001
  added: '2026-10-05'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Degree-4 versus degree-6 section fraction at p=5 for a(t)=0
  class: control
  claim: >-
    At p=5, with a(t)=0, using one square-detection predicate that excludes
    the y=0 section and is applied unchanged to both families, the fraction
    of coefficient slots of y^2 = x^3 + b(t) with deg b exactly 4 that
    contain at least one detected section differs from the same fraction for
    deg b exactly 6 by at least 0.05 in absolute value. Agreement within
    0.05 means this predicate does not separate the two degrees at p=5.
    The comparison is not a lift-probability exponent, not a statement at
    p=101 or p=809, and not an ECDLP algorithm. It does not revive xedni
    lifting and does not contradict the known-negative that xedni succeeds
    with negligible probability.
  mechanism: >-
    The frozen family in RQ-XEDN-001 is deg b = 6. The nearby object is the
    same equation with deg b = 4, same prime, same predicate. A gap of at
    least 0.05 means the zero-or-nonzero section event at p=5 depends on
    that degree. A gap below 0.05 means the two families agree at the
    resolution this test can see, so a later claim that emptiness is special
    to degree 6 is not supported by p=5. The sign of the gap is not
    predicted. Either outcome is a slot fraction in characteristic p. Neither
    outcome is a rank-deficient lift to characteristic zero.
  novelty_status: unverified
  citations:
    - ref: RQ-XEDN-001
      provenance: internal
      claim: >-
        The question asks for the lift-probability rate on the frozen
        family a(t)=0, deg b=6, and says a result on that family closes
