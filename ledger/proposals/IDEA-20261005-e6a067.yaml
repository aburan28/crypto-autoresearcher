        proposed_object: not_applicable
        predicted_gain: not_applicable
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations:
      - claim: not_applicable
        responsibility: not_applicable
    not_applicable_reason: >-
      Empirical slot-fraction comparison at one prime. Not a closed form
      and not a complexity proof.
  predictions:
    - metric: absolute_gap_of_nonzero_section_fractions
      direction: different
      minimum_effect: >-
        Absolute difference at least 0.05 between the deg-b=4 fraction and
        the deg-b=6 fraction at p=5.
  minimal_test:
    design: >-
      Enumerate every exact-degree-4 coefficient vector and every
      exact-degree-6 coefficient vector over F_5. On each slot, apply the
      pinned square-detection predicate once. Report both fractions, the
      absolute gap, and the slot counts 5^5-5^4 = 2500 and 5^7-5^6 = 62500
      before the predicate runs. Those two integers are the census sizes,
      not the section fractions. Do not lift any slot to characteristic zero.
    controls:
      - >-
        The same predicate on both degrees. A second predicate on only one
        degree voids the gap.
      - >-
        A planted slot that the predicate is required to accept, and a
        planted slot that it is required to reject, including a y=0-only
        slot. Failure of either plant voids the run.
    required_metrics:
      - both fractions
      - absolute gap
      - both slot counts
      - plant-control pass or fail
      - count of lifts to Q, which the design requires to be 0
  falsification_conditions:
    - >-
      Both censuses finish and the absolute gap is strictly less than 0.05.
    - >-
      A plant control fails. That voids the run and is not a mathematical
      negative.
  confounders:
    - >-
      Counting inexact degree, or keeping y=0, changes the fraction.
    - >-
      IDEA-20260805-e5dd09, IDEA-20260805-64aef4, and IDEA-20260815-8f5ae8,
      openings read, concern the frozen degree-6 family, its rank
      probabilities, a second moment, and a pooled exponent fit. They do
      not state this degree-4 gap.
    - >-
      A rank computed after lifting a slot to Q is the object KR-IC-cd159a
      forecloses. It is not this fraction.
  interpretation_limits:
    - >-
      A gap at p=5 says nothing about alpha at p=101 or p=809.
    - >-
      Closing or supporting H-XEDN-001 is outside this claim.
    - >-
      The census is not a discrete-logarithm algorithm and does not move
      the generic exponent 1/2.
    - >-
      KR-IC-cd159a remains in force. A fraction gap of 0.05 or larger at
      p=5 is not a successful xedni lift and is not evidence against that
      known-negative.
  heuristic_assumptions:
    - id: H1
      statement: >-
        If the nonzero-section indicator were an independent Bernoulli
        trial with the same success probability on both degrees, the
        absolute gap at these census sizes would fall below 0.05 with
        high probability whenever that shared probability is in
        [0.05, 0.95]. A completed gap of at least 0.05 rejects equal
        probabilities in that range. It does not identify the probability
        and it does not identify a lift success probability over Q.
      rigorous_support: >-
        Hoeffding's inequality applied to the difference of two independent
        sample means, used here only as the comparison model. The slots are
        an exhaustive census, so the fractions are exact once the predicate
        is fixed. The Bernoulli model is the null being rejected, not a
        theorem about sections. KR-IC-cd159a is the separate statement that
        xedni lifts succeed with negligible probability. This heuristic does
        not replace that statement.
      validation_plan:
        sampling: >-
          Exhaustive census at p=5, not a subsample. Sizes 2500 and 62500
          as counted above. Lifts to Q: 0.
        comparison: >-
          Absolute difference of the two exact fractions against 0.05.
        tail_check: >-
          Repeat the identical predicate at p=7 on a prefixed subset of
          2000 slots of each degree, drawn by a fixed enumeration order,
          not by a random seed chosen after seeing p=5. If the p=7 subset
          gap has the opposite sign from the p=5 gap and both absolute
          gaps are at least 0.05, the direction is unstable and the p=5
          result stays scoped to p=5.
        parameters: >-
          p=5 for the claim. p=7, 2000 slots per degree, for the sign
          check only. a(t)=0. Degrees 4 and 6. y=0 excluded. Characteristic
          stays p.
  target_complexity:
    time_exponent: >-
      No ECDLP exponent. Census size is 2500 + 62500 predicate evaluations
      at p=5. Lifts to characteristic zero: 0.
    memory_exponent: >-
      One coefficient vector and one predicate state at a time.
    best_known: >-
      Generic Pollard rho at exponent 1/2. KR-RHO-898783 states the
      interval kangaroo bound (2+o(1)) times square root of the interval
      width, which is a different problem. KR-IC-cd159a states that xedni
      lifting succeeds with negligible probability. Neither is improved
      here.
    hidden_overhead: >-
      Predicate implementation and plant controls. No o(1) attack term.
    tradeoff_note: >-
      Slots are independent. Parallelism changes wall time only. Memory
      stays one slot.
