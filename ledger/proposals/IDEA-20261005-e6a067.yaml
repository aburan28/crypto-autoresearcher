        obstruction. Status on the row is proven. This p=5 fraction gap
        does not revive that method and does not assert the known-negative
        is false.
      verified_by: idea-generator session 2026-10-05, KR-IC-cd159a.yaml opened
    - ref: KR-RHO-53c89f
      provenance: internal
      claim: >-
        MOV, Frey-Rück, and the anomalous trace-one solver are curve
