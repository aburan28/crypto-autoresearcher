idea:
  id: IDEA-20260815-f4c398
  question_id: RQ-QRE-001
  added: '2026-08-15'
  title: >-
    REPRODUCE THE 256-BIT ECDLP QUANTUM RESOURCE ESTIMATE AND REPORT WHICH
    SINGLE ASSUMPTION MOVES THE QUBIT COUNT MOST, SINCE DEPLOYMENT TIMELINES
    ARE BEING SET FROM A NUMBER NOBODY HERE HAS RECOMPUTED
  class: cost-model

  claim: >-
    Published quantum resource estimates for 256-bit ECDLP drive migration
    timelines. This program cites such numbers without having reproduced the
    pipeline. Reproduction plus a one-at-a-time sensitivity pass identifies
    which assumption -- code distance, gate set, routing overhead, modular-
    arithmetic circuit choice -- the headline number actually rests on.

  mechanism: >-
    Implement the costing pipeline from a published estimate. Reproduce its
    headline figures. Then vary each assumption independently and report the
    resulting qubit and runtime movement, ranked.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of GOAL-QRE-001 objective; grep 'resource estimate' (20),
      'surface code' (1), 'Toffoli' (15).
    results: >-
      The goal names the reproduction as its objective and it is not done.
      'surface code' returns one hit, so the error-correction layer is
      essentially unrepresented in this corpus.
    verdict: >-
      ADAPTATION. The pipeline is published; the contribution is
      reproduction in this program plus an assumption-sensitivity ranking.

  object_first_candidate:
    tracked_object: >-
      THE HEADLINE RESOURCE FIGURE as a function of its costing
      assumptions.
    lossiness: >-
      A single qubit count discards the whole assumption stack, which is
      why the ranking rather than the number is the deliverable.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while the published pipeline is reproducible; steps that
      cannot be reproduced are reported rather than approximated silently.

  null_object_control: >-
    NULL 1 -- reproduction of the published headline figures within their
    stated precision, which is blocking. NULL 2 -- a smaller, independently
    costed instance (e.g. RSA-2048 from the same source) as a second
    calibration point, since matching one number could be coincidence.

  discriminated_from:
    - >-
        The published resource estimates themselves, which are the source
        and are not improved here.
    - >-
        GOAL-QALG-001, which searches for exponent-moving quantum
        mechanisms; this record costs a known algorithm and proposes none.

  assumptions:
    - >-
        The published pipeline is reproducible from its description. Where
        a step is under-specified, the record reports the gap rather than
        filling it silently.
    - >-
        Assumptions are separable enough for one-at-a-time ranking;
        interactions are reported where found.

  predictions:
    - metric: >-
        reproduction of published headline figures
      direction: different
      minimum_effect: >-
        FORCED within stated precision; failure blocks the record.
    - metric: >-
        second calibration point from the same source
      direction: different
      minimum_effect: >-
        FORCED to reproduce; matching only one figure is not
        reproduction.
    - metric: >-
        ranking of assumptions by qubit-count movement
      direction: different
      minimum_effect: >-
        The deliverable, identifying what the migration-timeline number
        actually rests on.

  minimal_test:
    design: >-
      Reproduce both published headline figures, then vary the three
      assumptions the source itself flags as most uncertain.
    controls:
      - >-
          Two-point reproduction calibration.
      - >-
          Under-specified steps reported, never silently filled.
      - >-
          Interactions checked pairwise for the top-ranked assumptions.
      - >-
          Source's own stated uncertainties used as the starting
          variation set.
    required_metrics:
      - >-
          Reproduced figures against published ones.
      - >-
          Qubit and runtime movement per assumption.
      - >-
          Ranking with intervals.
      - >-
          List of under-specified pipeline steps.

  falsification_conditions:
    - >-
        Either calibration point fails to reproduce. Pipeline not
        faithfully implemented; halt.
    - >-
        Too many steps are under-specified. Reproduction is not possible
        from the publication, which is itself a reportable finding about
        the estimate's checkability.
    - >-
        One assumption dominates the qubit count. Migration timelines rest
        on that assumption and should be argued about it directly.
    - >-
        No assumption dominates. The estimate is robust to its own stated
        uncertainties, which is reassuring and worth recording.

  confounders:
    - >-
        SILENT GAP-FILLING: filling an under-specified step with a
        plausible value produces a confident reproduction of something the
        source did not say.
    - >-
        HARDWARE-MODEL DRIFT: error-correction assumptions age quickly and
        a reproduction is a statement about the source's era, not about
        present hardware.

  interpretation_limits:
    - >-
        Reproduces a published estimate; makes no independent claim about
        quantum feasibility or timelines.
    - >-
        Scoped to the reproduced pipeline and its stated assumptions.
    - >-
        A sensitivity ranking identifies dependence, not correctness.

  heuristic_assumptions:
    - id: HEUR-QRE-REP-1
      statement: >-
        The published costing pipeline is reproducible from its
        description to within its stated precision.
      rigorous_support: >-
        Rigorous ingredient: the source states its circuit constructions
        and error-correction parameters. THE GAP: resource-estimation
        pipelines routinely depend on tooling and calibration data not
        fully described in the paper, so exact reproduction is often
        impossible and the honest outcome may be a bounded mismatch
        rather than agreement.
      falsification_condition: >-
        A reproduced figure outside the source's stated precision on
        either calibration point.
      validation_plan: >-
        SAMPLE: both published calibration points, each reproduced
        independently. COMPARISON: reproduced against published, with
        the source's stated precision as the tolerance. TAIL CHECK: the
        pipeline steps contributing most to any mismatch. TRANSFER:
        none; reproduction is source-specific.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is implementing and running a costing
      pipeline; no quantum simulation is involved.
    memory_exponent: >-
      Negligible; classical costing only.
    best_known: >-
      Incumbents are the published resource estimates, reproduced here and
      not improved.
    hidden_overhead: >-
      Under-specified pipeline steps are the dominant hidden term and
      determine whether reproduction is possible at all.
    tradeoff_note: >-
      Reproducing faithfully costs implementation effort and buys the
      ability to test the number's sensitivity rather than cite it.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As resource estimates: dominated by the
    published sources. As a reproduction and sensitivity pass: none exists
    here. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: an independent reproduction
    of a 256-bit ECDLP resource estimate this program currently cites
    without checking, a ranking of which assumption the headline number
    rests on, and an explicit list of steps that cannot be reproduced from
    the publication.

  estimated_cost:
    implementation: high
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.45 that both calibration points reproduce within stated precision --
    resource-estimation pipelines are notoriously tooling-dependent and this
    is the dominant risk. 0.8 that a sensitivity ranking is producible even
    under partial reproduction. 0.6 that one assumption dominates.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
  source_refs:
    - RQ-QRE-001
    - GOAL-QRE-001
    - GOAL-QALG-001
    - KN-TECH-056
    - KN-TECH-080
    - docs/inventor-protocol.md
  id_allocation_provenance: >-
    Minted with `python3 tools/allocate_id.py --next idea --date 20260815`
    and verified free with `--check` before use; no state was scanned for a
    "next free number".
