idea:
  id: IDEA-20260816-7ea680
  question_id: RQ-ASCON-2dfd8b
  added: '2026-08-16'
  title: Audit the optional 256-bit-key nonce-masking variant not by pinning it -- which this program
    cannot do -- but by enumerating the LATTICE OF ADMISSIBLE CONSTRUCTIONS consistent with the declared
    state size, key, nonce and tag widths, and computing per cell whether the capacity portion at
    first squeeze retains full key-dependent entropy
  class: composition
  claim: '(A) An optional variant added at standardization is, by construction, the least analysed
    element of a standard, and this program cannot read its definition. A record that waited would
    produce nothing; a record that guessed would produce a fiction. There is a third option: the variant''s
    structure is heavily constrained by arithmetic that IS available -- a fixed state width, a declared
    key width, a declared nonce width, a declared tag width, and the requirement that initialization
    be a permutation call on a fully determined state. Enumerate every placement of key and nonce
    material into the state consistent with those constraints, together with every admissible masking
    rule from a declared finite family, and you obtain a LATTICE OF ADMISSIBLE CONSTRUCTIONS in which
    the real variant is one cell. (B) For each cell, compute a purely structural quantity that needs
    no cryptanalysis: at the moment of first squeeze, how many bits of the capacity portion are functions
    of key material, and is the map from key to that portion injective on the declared key space.
    Report the lattice with that quantity per cell and the partition into cells where it is full,
    cells where it is deficient, and cells where the question is not decidable from the enumerated
    structure alone. (C) NOT CLAIMED: which cell the standard occupies; that any cell is the standard;
    that a deficient cell implies an attack, since key-dependence is a necessary bookkeeping condition
    and nothing more; that the declared masking family is exhaustive -- the unenumerated remainder
    is named. NOT CLAIMED: any attack, break or security consequence, in any cell. (D) The value of
    the lattice is that FILING the specification later resolves the whole record in one step: the
    Coordinator identifies the cell and reads off the answer, instead of commissioning the analysis
    then. (E) The null: the identical entropy computation runs over RANDOMLY GENERATED placements
    outside the constraint set, which must show a materially different distribution of the quantity;
    if random placements score the same as admissible ones, the constraints are not binding and the
    lattice is not a lattice.'
  mechanism: 'Stage one writes down the arithmetic constraints as a satisfiability problem over placements:
    the state is partitioned into rate and capacity, key material occupies a contiguous or declared-pattern
    set of positions, nonce material likewise, the remainder is IV or constant, and the total accounted
    width equals the state width. Stage two enumerates all solutions, which is a small finite set
    once the pattern family is declared. Stage three attaches to each placement a masking rule from
    a declared finite family -- no masking, masking of the nonce by key-derived material, masking
    of the key by nonce-derived material, and a small number of declared combinations -- giving the
    lattice cells. Stage four computes, per cell, a structural entropy quantity by a purely symbolic
    dependency argument plus a direct injectivity test on a REDUCED-WIDTH analogue of the construction,
    where the key space is small enough to enumerate exhaustively. Stage five reports the partition
    of cells and the undecidable remainder. Stage six runs the identical computation over random non-admissible
    placements as the null. The result is a table indexed by structure, not a claim about the standard;
    the standard''s row is left blank and named as the cell to be filled when the specification is
    filed.'
  novelty_status: unverified
  novelty_screen:
    method: 'Shared repository screen: grep -ril ascon over ledger/proposals, ledger/hypotheses, ledger/evidence
      and experiments; grep -il over ledger/proposals/*.yaml for capacity, sponge, duplex, domain.separation,
      rekey, data limit and constrained device. Read: ledger/questions/RQ-ASCON-2dfd8b.yaml in full
      (its provenance block reports an optional nonce-masking variant supporting 256-bit keys and
      marks it UNVERIFIED), ledger/goals/GOAL-ASCON-001.yaml first 60 lines, docs/inventor-protocol.md
      sections 1-8 including the section 8 method-ceiling and nearby-object control, ledger/proposals/IDEA-20260807-c4f1fc.yaml
      first 40 lines.'
    results: grep -ril ascon returned no ledger record at all, so no proposal targets any Ascon variant.
      The greps for rekey, data limit and constrained device over ledger/proposals/*.yaml each returned
      ZERO files. The capacity grep returned ten filenames before truncation (IDEA-20260803-fa9839,
      IDEA-20260805-630606, IDEA-20260805-b9047c, IDEA-20260805-bbfca9, IDEA-20260806-7c1ae4, IDEA-20260806-94676a,
      IDEA-20260807-63056d, IDEA-20260807-cb672c, IDEA-20260808-25fca0, IDEA-20260808-9d6677) whose
      contents were not read and which most likely match the word in unrelated senses; a Coordinator
      must check, and that is a declared derivation gap. RQ-ASCON-2dfd8b's own targets do not name
      the nonce-masking variant explicitly, so this record extends the goal's surface rather than
      restating it, and the extension is declared as such.
    verdict: 'UNVERIFIED. No external literature is reachable here and nothing in this record asserts
      what it contains; in particular it does NOT assert that the variant is defined in any specific
      way. Claimed NEW relative to this repository: enumerating the admissible-construction lattice
      as a way to produce a resolvable audit of an UNPINNED optional variant, so that filing the specification
      later resolves the record in one lookup rather than commissioning fresh work. ASSEMBLED FROM
      KNOWN PARTS: structural entropy bookkeeping is elementary; the method-ceiling and nearby-object-control
      discipline is docs/inventor-protocol.md section 8, and this record is essentially a nearby-object
      control applied to a whole neighbourhood at once; the same-invocation null requirement is section
      3.'
  object_first_candidate:
    tracked_object: 'The PLACEMENT MAP together with its masking rule: an assignment of each state
      position to one of {key, nonce, IV/constant, unassigned} plus a label naming which declared
      masking rule is applied, carried through initialization to the moment of first squeeze and collapsed
      to a single structural quantity -- the number of capacity bits that depend on key material and
      whether that dependence is injective on the key space.'
    lossiness: 'Lossy. Discarded: every actual constant, every state value, the permutation''s internals
      beyond its dependency structure, and the identity of the real variant. Retained: which positions
      hold what kind of material, which masking rule applies, and a derived entropy count. The discard
      is compatible with the target operation -- initialization followed by absorption and a first
      squeeze -- because that operation acts on the placement structure through the permutation''s
      dependency relation, which is placement-independent; so a placement can be evaluated without
      knowing any value. The projection is heavily non-invertible: infinitely many concrete constructions
      share one placement-and-rule label, which is precisely why enumerating labels is affordable
      where enumerating constructions is not.'
    propagation: 'One step of the target operation is one permutation call during initialization.
      Acting on the placement label it propagates the KEY-DEPENDENCE indicator: a state position becomes
      key-dependent once any position in its dependency set is key-dependent, and the indicator spreads
      monotonically toward saturation with depth. Masking rules act before the first call by rewriting
      the label of nonce or key positions to a derived-material label, which changes the initial indicator
      and therefore the whole trajectory. The quantity of interest is read at the first squeeze, that
      is, after the declared initialization depth and the first absorption, and its value depends
      on both the initial placement and the depth -- so a placement that saturates quickly and one
      that does not are distinguishable exactly by this propagation.'
    survival_score: Reported as the number of enumerated cells for which the structural quantity is
      decidable from the enumerated structure alone, versus the number where it is not, plus the depth
      at which key-dependence saturates per cell. The object survives as a discriminating label while
      placements differ in saturation depth; it dissolves once the initialization depth exceeds every
      cell's saturation depth, at which point every admissible cell has full key dependence and the
      lattice stops discriminating -- and that outcome is itself a clean, reportable result saying
      the placement question is not load-bearing at the declared depth.
  null_object_control: 'RANDOM NON-ADMISSIBLE PLACEMENTS: assignments of state positions to key, nonce
    and IV roles drawn uniformly WITHOUT the width and partition constraints, evaluated by the IDENTICAL
    entropy computation in the SAME invocation with the same declared masking family. For the lattice
    to mean anything, the admissible cells'' distribution of the structural quantity must differ materially
    from the random arm''s; if random placements score identically, the arithmetic constraints are
    doing no work and the enumeration is decoration. A SECOND null uses a deliberately degenerate
    placement in which no position holds key material, where the structural quantity must be exactly
    zero at every depth, confirming the computation can report a deficiency when one is present.'
  discriminated_from:
  - IDEA-20260807-c4f1fc, which proposes a structured-input cryptanalytic axis specific to SLH-DSA's
    tweakable hash. That record attacks a construction's use of a primitive; this record enumerates
    a space of possible constructions and computes a bookkeeping quantity, attacking nothing.
  - The sixth record in this batch, the duplex controllability accountant. That accountant propagates
    attacker-controllability labels through a session under a pinned mode; this propagates key-dependence
    labels across a SPACE of unpinned constructions, and its deliverable is a lattice rather than
    a depth.
  - A specification reconstruction or reverse-engineering exercise. This record explicitly refuses
    to assert which cell is the standard, leaves that row blank, and treats identification as a Coordinator
    action after the specification is filed.
  - The ten capacity-matched proposals seen by filename only. None can concern Ascon since the ascon
    grep returned no ledger record; a Coordinator must read them, and that is a declared derivation
    gap rather than an assertion of clearance.
  - Generic key-schedule or key-entropy analysis. The quantity here is not about a key schedule but
    about placement geometry inside a fixed-width sponge state under a declared masking family, and
    it is computed over an enumerated space rather than for one design.
  assumptions:
  - The state width, key widths, nonce width and tag width can be pinned or bounded from the declared
    parameters, which is the minimum needed to write the constraint system; the record is void without
    at least these.
  - The declared masking family is a reasonable finite cover of what a nonce-masking rule could be;
    it is NOT claimed exhaustive and the unenumerated remainder is named in the deliverable.
  - Key-dependence of capacity bits at first squeeze is a necessary bookkeeping condition worth computing,
    and its deficiency in a cell is a structural observation and never an attack.
  - A reduced-width analogue of the construction, small enough to enumerate the key space exhaustively,
    faithfully exhibits the injectivity question for placements of the same shape; this is a transfer
    assumption and it is stated rather than assumed silently.
  - The permutation's dependency relation can be extracted or bounded, since the propagation of key-dependence
    needs it; a conservative full-dependency assumption is available as a fallback and is reported
    as such when used.
  predictions:
  - metric: number of admissible cells for which the structural key-dependence quantity is full at
      first squeeze
    direction: different
    minimum_effect: no pre-commitment; the enumeration has not been run and predicting its partition
      would be invention. Both a partition where nearly every cell is full and one where many are
      deficient are reportable, with opposite consequences for whether placement is load-bearing
  - metric: distribution of the structural quantity over admissible cells versus over random non-admissible
      placements
    direction: different
    minimum_effect: the two distributions must differ by a two-sample test at the 0.01 level; indistinguishable
      distributions mean the constraints are not binding and the lattice is decoration
  - metric: structural quantity for the degenerate no-key placement
    direction: lower
    minimum_effect: exactly 0 at every depth, a forced value; anything else is a computation defect
  - metric: depth at which key-dependence saturates, across admissible cells
    direction: different
    minimum_effect: reported as a distribution rather than predicted; if every cell saturates before
      the declared initialization depth, the lattice stops discriminating and that is the record's
      complete result
  minimal_test:
    design: 'No cryptanalysis and no large compute. Write the width constraints as a small integer
      program and enumerate every placement satisfying them within a declared pattern family -- contiguous
      blocks, word-aligned blocks, and one declared interleaved pattern. Cross each placement with
      the declared masking family, giving the lattice cells, expected in the low hundreds. Extract
      or conservatively bound the permutation''s per-bit dependency relation once. For each cell,
      propagate the key-dependence indicator through the declared initialization depth and the first
      absorption, and read the capacity-portion count at first squeeze. For injectivity, build a reduced-width
      analogue with a key space of at most 2^20 and test injectivity by exhaustive enumeration. In
      the SAME invocation, repeat the whole computation over 1000 random non-admissible placements
      and over the degenerate no-key placement. Cost: minutes. The output is the lattice table plus
      the two null comparisons.'
    controls:
    - Random non-admissible placement null, 1000 draws, identical computation, same invocation, seed
      recorded.
    - Degenerate no-key placement, where the structural quantity must be exactly zero at every depth.
    - Full-key placement, where every state position holds key material and the quantity must be full
      at depth zero.
    - 'Conservative-dependency fallback comparison: the whole lattice recomputed under a full-dependency
      assumption, bounding how much the result depends on the extracted relation.'
    - Reduced-width injectivity check validated against a placement whose injectivity is known by
      construction, confirming the enumerator can detect non-injectivity.
    - Pattern-family sweep, so a partition is never reported for one pattern family as though it covered
      all placements.
    required_metrics:
    - 'lattice size: number of admissible cells per pattern family and masking rule'
    - structural key-dependence count at first squeeze, per cell
    - injectivity verdict per cell from the reduced-width analogue, with undecidable cells labelled
    - saturation depth per cell
    - distribution comparison statistic between admissible and random-null arms
    - forced control outcomes (no-key, full-key)
    - named unenumerated remainder of the masking family and of the pattern families
  falsification_conditions:
  - The random non-admissible null's distribution of the structural quantity is indistinguishable
    from the admissible arm's, showing the constraints are not binding.
  - The degenerate no-key control returns a nonzero quantity, or the full-key control returns less
    than full.
  - The reduced-width enumerator fails to detect the known non-injective placement.
  - Every admissible cell saturates before the declared initialization depth, in which case placement
    is not load-bearing and the record reports that as its complete result.
  - The lattice cannot be enumerated because the width constraints admit an unbounded family, in which
    case the pattern family is reported as inadequate and the record is withdrawn rather than sampled.
  - The conservative-dependency fallback and the extracted relation give qualitatively different partitions,
    showing the result rests on an unvalidated extraction.
  confounders:
  - The declared masking family is authored by this program and may omit exactly the rule the standard
    uses, so a cell partition can be complete over a family that misses the real construction; naming
    the remainder is the only mitigation and it is not a fix.
  - The reduced-width analogue may not preserve injectivity behaviour of the full-width construction,
    so injectivity verdicts transfer only under the stated assumption.
  - A conservative full-dependency fallback makes every cell saturate quickly and would manufacture
    the not-load-bearing conclusion; the fallback comparison exists to make that visible rather than
    to prevent it.
  - Random non-admissible placements differ from admissible ones in cardinality as well as in structure,
    so part of any distributional gap is a width effect; cardinality-matched random draws are required
    and are included.
  - If the state width or key width is mis-stated, the entire constraint system enumerates the wrong
    family with full internal consistency.
  interpretation_limits:
  - The lattice is a space of possible constructions and contains no claim that any cell is the standard;
    the standard's row is deliberately left blank.
  - A deficient cell is a bookkeeping observation about key-dependence and is NOT an attack, a weakness,
    or a security consequence of any kind.
  - Injectivity verdicts come from a reduced-width analogue and transfer only under the stated assumption,
    which this record does not test.
  - Nothing here bears on Ascon, SP 800-232, any optional variant as actually specified, or any deployed
    device.
  target_complexity:
    time_exponent: No attack exponent is claimed. Enumeration cost is the lattice size times the initialization
      depth times the state width, plus one exhaustive key-space enumeration at reduced width of at
      most 2^20.
    memory_exponent: No attack exponent is claimed. Memory is the dependency relation plus the lattice
      table, under a megabyte.
    best_known: 'The incumbent is the absence of any analysis at all: an optional variant added at
      standardization, unpinned in this environment, with no record in this repository touching it
      -- the ascon grep returned zero ledger records. The competitor this record names is therefore
      the alternative plan of waiting for the specification and commissioning the analysis afterwards,
      against which this record''s claim is only that it front-loads the work into a lookup.'
    hidden_overhead: 'The hidden cost is the declared masking family, which is human design work with
      no natural stopping point and whose omissions are invisible from inside the enumeration. A second
      hidden cost is the reduced-width analogue: building one that is faithful enough for injectivity
      to transfer is a modelling exercise, not a coding one, and it is where a Coordinator''s judgement
      is actually needed.'
  dominated_by: 'n/a (no result claimed). Pareto check across all three axes explicitly: time -- no
    attack time is produced and no frontier row exists; memory -- the enumeration is memory-trivial
    and produces no attack memory figure; data/queries -- zero oracle queries, everything computed
    offline over structural labels. Each axis considered rather than the field defaulted.'
  sota_delta: no attack; conceptual/measurement contribution only. The quantitative delta is an enumerated
    lattice of admissible constructions with a computed structural quantity per cell and a named unenumerated
    remainder, where this repository previously held nothing at all on the variant and where the alternative
    is unbounded future work rather than a competing number.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'Separately: that the width parameters can be pinned or bounded well enough
    to write the constraint system, about 0.6, since these are the most widely reported numbers and
    the least likely to be wrong even in excerpt. That the enumeration is finite and small under a
    declared pattern family, above 0.85. That the random-placement null separates from the admissible
    arm, about 0.55 -- width constraints are genuinely restrictive but the structural quantity may
    be insensitive to them. That the standard''s cell is later identified in one lookup once the specification
    is filed, about 0.5, conditional on the masking family covering it. That the lattice discriminates
    at all rather than every cell saturating before first squeeze, about 0.35 -- this is the single
    most likely way the record ends in a clean negative, and that negative is itself the useful statement
    that placement is not load-bearing at the declared depth.'
