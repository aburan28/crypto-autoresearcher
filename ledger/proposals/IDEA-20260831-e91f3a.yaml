idea:
  id: IDEA-20260831-e91f3a
  question_id: RQ-MONO-001
  added: '2026-08-31'
  title: >-
    The deferred third ladder rung, p=1009: does the m=3 symmetric-base D_4
    census and its exact (p,t,Z) stratum-count arithmetic survive a prime
    roughly 5x and 9.5x larger than the two already-tested rungs, or does an
    edge case invisible at p in {101,211} appear?

  class: control

  claim: >-
    H-MONO-0b3def and H-MONO-0f9170 (both status: supported, scoped exactly to
    p in {101,211}) each explicitly name "Stage 2: a sampled census at
    p=1009" as future work their own frozen contracts (EXP-MONO-4c7479,
    EXP-MONO-2a13d7) declined to fund. This idea proposes running that third
    rung as an EXHAUSTIVE (not sampled) census -- at p=1009 the base has
    p^2 = 1,018,081 points, well within the same pure-Python budget class
    that made the p=211 exhaustive census cheap (44,521 points) -- and using
    it to test two already-precisely-specified predictions rather than to
    fish for new content:
    (1) H-MONO-0b3def's HEUR-WREATH-1/2: every non-singular curve in the
    panel realizes all 8 D_4 permutations at p=1009, and the F_{p^2}
    realized-class count equals the F_p realized-class count (arithmetic
    equals geometric at this prime too).
    (2) H-MONO-0f9170's completeness claim: each of the seven exact stratum
    counts (A1)-(B3), evaluated at p=1009's own (t,Z) for every panel curve,
    equals the closed form in (p,t,Z) EXACTLY (integer residual 0), exactly
    as at p in {101,211}.
    Because H-MONO-0f9170 supplies EXACT closed forms (not asymptotic
    estimates) for every stratum count, the p=1009 rung is not merely "more
    of the same" -- it is a general robustness check of a claimed universal
    (FOR ALL p>3) integer identity at a prime five to ten times larger than
    anything tested, on the same curve panel design, and a genuine edge case
    (e.g. a residue-class-dependent term the p=101/211 arithmetic happened to
    cancel) would show up here as a nonzero residual. This program's own
    corpus already contains a precedent for exactly this failure mode: a Red
    Team review elsewhere in this lane (documented in H-MONO-40aca5's
    conversion_note) derived a previously-unstated "residue-class-parity
    law" correction to a claim that held at the originally tested scale --
    the mechanism this idea's falsification conditions are designed to catch
    if it recurs here.
    DISCRIMINATION. Outcome A (both predictions hold exactly at p=1009):
    strengthens both records' claim tier from "corroborated at two small
    primes" to "corroborated across a 10x prime range with zero exceptions",
    closes the named future-work item cleanly, and gives H-MONO-0b3def's own
    HEUR-WREATH-3 falsified O(p^{-1/2})-vs-O(1/p) distinction a third,
    much-more-separating data point (p^{-1/2} at p=1009 differs from the
    O(1/p) prediction by roughly 3.15x rather than the roughly 1.4x separation
    available between 101 and 211, sharpening an already-established finding
    rather than merely repeating it). Outcome B (either prediction fails at
    p=1009 while the same instrument reproduces the p=101/211 results
    unchanged): reveals a genuine boundary of the derivation not visible at
    the smaller primes -- the single most valuable possible outcome, and one
    neither record can currently rule out because neither has been tested at
    this scale.

  mechanism: >-
    No new mathematics is derived here; this is a scale-extension of two
    already-derived, already-corroborated mechanisms, run to their own
    stated next rung.
    STEP 1 (D_4 group census, per H-MONO-0b3def STEP 1-3). Enumerate every
    (e1,e2) in F_1009^2, exclude the three named strata (double-root,
    ramified-A, ramified-B, and the instrument-only divisor
    e1^2-e2+A=0), classify the Frobenius permutation of the four points of
    Phi(e1,e2) by the direct-arithmetic arm (lift to F_{1009^2} as needed)
    AND by the quartic-factoring arm (factor h(Y)=Y^4-c1Y^2+c0), and record
    the realized-permutation set per curve, the per-instance agreement rate
    between the two arms, and the observed class densities.
    STEP 2 (exact stratum counts, per H-MONO-0f9170's seven closed forms).
    For the same enumeration, compute the seven stratum counts (A1)-(B3)
    directly from the enumeration and compare, per curve, against the
    closed-form values evaluated at that curve's own (p=1009, t, Z): C(S,2),
    S*N, C(N,2), Z(p-Z)+C(Z,2), M/2, (Z'-Z)/2, p(p-1)/2-M/2-(Z'-Z)/2, with
    S=(p-t-Z)/2, N=(p+t-Z)/2, M=(p^2+2p-t^2-Z')/2-(p-Z).
    STEP 3 (the mandatory matched-ordered-base and random-quartic controls,
    reused unchanged from both parent contracts). Reproduce the ordered-base
    two-type law (KN-FIND-a8990a Theorem B) on the same p=1009 curves as a
    hard gate before any symmetric-base cell is interpreted, and run the
    random-monic-quartic Chebotarev control at p=1009 to confirm the
    instrument itself is not degenerate at this larger prime (S_4 densities
    1/24,1/4,1/8,1/3,1/4 within statistical tolerance).
    STEP 4 (the sharpened HEUR-WREATH-3 fit). Compute the exact per-curve
    deviation of the identity and sigma1_sigma2 class densities from their
    naive forced values (1/8, 1/8) using the SAME closed forms Step 2 already
    computed (C(S,2)/C(p,2) - 1/8, etc.), and report these alongside the
    already-recorded p=101 and p=211 values, extending the two-point fit to
    three points without introducing any new statistic.

  novelty_status: adaptation
  novelty_status_note: >-
    Grepped ledger/proposals/ and ledger/hypotheses/ for "p=1009",
    "third rung", and "Stage 2" (see below); found no existing proposal that
    executes this specific deferred stage for H-MONO-0b3def or H-MONO-0f9170.
    The mechanism, closed forms, and controls are entirely inherited,
    unmodified, from IDEA-20260830-1a08f9/H-MONO-0b3def and
    IDEA-20260830-9761f0/H-MONO-0f9170; this idea's only original content is
    the decision to run the already-specified third rung as its own scoped
    experiment and the STEP 4 sharpened-fit framing of HEUR-WREATH-3 across
    three points instead of two. Labelled `adaptation`, not `known`, because
    running an already-derived closed form at an untested parameter is itself
    the test, per this program's own evidence rules (a derivation is not
    evidence until measured at the claimed scope).

  citations:
    - ref: H-MONO-0b3def
      provenance: internal
      claim: >-
        Names "Stage 2: sampled census at p=1009" as explicitly out-of-scope
        future work for EXP-MONO-4c7479 (test_boundary block); states
        HEUR-WREATH-1/2's falsification conditions (fewer than 8 realized
        permutations; F_p vs F_{p^2} realized-class count mismatch); records
        HEUR-WREATH-3 as falsified_scoped for the identity/sigma1sigma2
        densities specifically, with an O(p^{-1/2}) deviation law, at p in
        {101,211} only.
      verified_by: idea-generator (this session, read in full)
    - ref: H-MONO-0f9170
      provenance: internal
      claim: >-
        Supplies the seven exact closed-form stratum counts as functions of
        (p,t,Z); names the p=1009 rung and the cross-prime panel-spread-decay
        prediction as out-of-scope future work for EXP-MONO-2a13d7; states
        HEUR-TZ-1's falsification condition (any nonzero integer residual
        against the closed forms).
      verified_by: idea-generator (this session, read in full)
    - ref: KN-FIND-a8990a
      provenance: internal
      claim: >-
        Theorem A (ordered-base group (Z/2)^2) and Theorem B (ordered-base
        two-type law) which the matched-ordered-base control must reproduce
        exactly on the p=1009 panel before any symmetric-base cell is
        interpreted.
      verified_by: idea-generator (this session, read the citing text in
        H-MONO-0b3def/H-MONO-0f9170; the source document itself not
        independently reopened this session)
    - ref: H-MONO-40aca5
      provenance: internal
      claim: >-
        Its conversion_note and status_note record that a Red Team review in
        this same lane derived a previously-unstated "residue-class-parity
        law" correction to a claim that had held at the originally tested
        scale, motivating this idea's Outcome B framing as a real, precedented
        failure mode rather than a hypothetical one.
      verified_by: idea-generator (this session, read in full)

  assumptions:
    - >-
      p=1009 > 3, non-singular short-Weierstrass curves, m=3 only, same
      generic-ordinary curve panel design as the p=101/211 contracts (with
      curves re-chosen at p=1009 by the same deterministic construction rule,
      disclosed explicitly rather than reusing the literal (A,B) pairs, which
      may not remain non-singular mod 1009).
    - >-
      Exhaustive enumeration of 1,018,081 base points in pure Python,
      per-point cost dominated by a handful of modular arithmetic operations
      and (for the direct arm) F_{1009^2} lifts, is affordable within a
      budget comparable to EXP-MONO-4c7479's own (which enumerated 44,521
      points per curve at p=211); if wall-clock at p=1009 exceeds a stated
      cap this is reported as an infrastructure limit (AGENTS.md rule 3) and
      the design falls back to a large deterministic sample, matching the
      "sampled census" language the parent hypotheses themselves used.
    - >-
      `harness/semaev.py`'s `s3_expr` and any p=211-specific tower-construction
      helpers in `fp_common.py` generalize to p=1009 without modification
      (F_{p^2} constructed the same way, by adjoining a root of a fixed
      non-residue); a construction failure here is an infrastructure outcome,
      not evidence.

  proof_search_map:
    bottleneck: >-
      Whether the derivations proved for all p>3 (D_4 monodromy uniformity;
      the seven exact stratum-count closed forms) actually hold, in
      implementation, at a prime an order of magnitude larger than anything
      tested -- not because the proofs are p-dependent (they are not stated
      that way) but because an implementation, sampling convention, or
      curve-panel-construction detail invisible at p=101/211 could fail
      silently at p=1009.
    baseline_embedding:
      parameter_slice: >-
        The identical instrument, mechanism, and closed forms already run at
        p in {101,211}; p=1009 is a pure parameter extension with zero new
        mathematics.
      reproduction_check: >-
        Before any p=1009 cell is interpreted, the p=211 cells must be
        re-run byte-for-byte with the SAME code path used for p=1009 (not
        merely re-cited from the prior contract) and must reproduce the
        already-committed histograms and closed-form agreements exactly. A
        mismatch here means the code path itself changed, not that p=1009
        revealed anything.
    observation_collision:
      observable: >-
        The realized-permutation set (D_4 census) and the seven-tuple of
        stratum counts, as functions of (p,t,Z), at p=1009.
      distinct_preimage_search: >-
        Not newly searched here; H-MONO-0b3def's own already-disclosed
        collision (cycle type 2^2 has two preimages, distinguished only by
        the character triple, not by cycle type alone) is inherited
        unchanged and the same required-metrics discipline (report the
        character triple, not cycle type alone) applies at p=1009.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The same (p,t,Z) -> seven-stratum-count map, specialized to a
          third, much larger p.
        predicted_gain: >-
          Converts a two-point corroboration into a three-point one and
          sharpens the O(p^{-1/2})-vs-O(1/p) discrimination for the already-
          falsified HEUR-WREATH-3 densities from a roughly 1.4x separation
          (101 vs 211) to a roughly 3.15x separation (211 vs 1009), at zero
          new mathematics.
    quantifier_order: >-
      FOR the specific prime p=1009 and FOR EVERY non-singular curve in the
      panel, THE ALREADY-PROVED "FOR ALL p>3" CLAIMS (D_4 uniformity; the
      seven exact closed forms) HOLD. This is a bounded existential test of a
      universally-quantified claim at one additional witness value; it can
      falsify the universal claim (a single failure at p=1009 refutes "for
      all p>3") but cannot itself prove it beyond the tested instances.
    method_ceiling:
      strongest_certifiable_claim: >-
        Exact agreement (or a specific, localized disagreement) between the
        already-derived closed forms and direct enumeration at p=1009, on the
        tested curve panel. Cannot certify the claims at cryptographic scale,
        cannot certify anything about m>=4, and cannot supply the fourth-and-
        further ladder points the cross-prime panel-spread-decay prediction
        would eventually need (that prediction requires 3+ primes and is
        itself named as separate, larger future work by H-MONO-0f9170).
      nearby_object_control: >-
        Inherited unchanged from both parent contracts: the ordered-base
        control (must reproduce KN-FIND-a8990a Theorem B exactly, zero
        exceptions) and the random-monic-quartic Chebotarev control (must
        reproduce S_4 densities including nonzero 4-cycle and 3+1 rates). A
        failure of either control voids the p=1009 cell's interpretation
        regardless of how clean the D_4/stratum-count numbers look.
    proof_obligations:
      - claim: >-
          The p=211 code path reproduces the already-committed p=211
          histograms and closed-form agreements exactly, before any p=1009
          cell is read.
        responsibility: baseline
      - claim: >-
          Every panel curve at p=1009 realizes exactly 8 distinct D_4
          permutations, with F_p and F_{p^2} realized-class counts equal.
        responsibility: correctness
      - claim: >-
          Every one of the seven stratum counts equals its closed form
          exactly (integer residual 0), per curve, at p=1009.
        responsibility: correctness
      - claim: >-
          The ordered-base and random-quartic controls pass at p=1009.
        responsibility: strictness
      - claim: >-
          Nothing here transfers beyond m=3, this curve family, or toy scale.
        responsibility: scope

  predictions:
    - metric: >-
        number of distinct D_4 permutations realized per curve, p=1009
      direction: higher
      minimum_effect: >-
        EXACTLY 8, every panel curve. Fewer than 8 (with controls passing)
        is the exceptional-locus signal and the single most consequential
        outcome.
    - metric: >-
        F_p vs F_{p^2} realized-class-count agreement, p=1009
      direction: same
      minimum_effect: >-
        Identical counts on every panel curve; any disagreement voids the
        arithmetic-equals-geometric reading for that curve.
    - metric: >-
        integer residual between each of the seven measured stratum counts
        and its closed form in (p,t,Z), p=1009, every panel curve
      direction: lower
      minimum_effect: >-
        EXACTLY 0, every stratum, every curve. A single nonzero residual
        falsifies the "for all p>3" completeness claim at this witness prime.
    - metric: >-
        magnitude of the exact identity/sigma1sigma2 density deviation from
        1/8, computed via the closed forms, at p=101, 211, and 1009
      direction: different
      minimum_effect: >-
        Consistent, at all three points, with the O(p^{-1/2}) law already
        established by HEUR-WREATH-3's falsification (not with O(1/p)); the
        p=1009 point is predicted to separate the two candidate rates by
        roughly 3.15x, materially sharper than the 101-vs-211 comparison
        alone.
    - metric: >-
        ordered-base and random-quartic controls, p=1009
      direction: same
      minimum_effect: >-
        Ordered-base: exact reproduction of KN-FIND-a8990a Theorem B, zero
        exceptions. Random-quartic: S_4 Chebotarev densities within 3
        binomial standard errors, nonzero 4-cycle and 3+1 rates. Either
        control failing means the p=1009 cell is an instrument outcome, not
        evidence in either direction.

  minimal_test:
    design: >-
      Stage 0 (near-zero compute): symbolic re-check that the closed forms
      and construction rule are stated identically to the parent contracts,
      plus construction of a p=1009-appropriate curve panel by the same
      deterministic rule used at p=101/211 (disclosed explicitly, since the
      literal (A,B) pairs used there need not remain non-singular mod 1009).
      Stage 1 (reproduction gate): re-run the exact p=211 code path and
      require byte-identical reproduction of the already-committed
      histograms and closed-form agreements.
      Stage 2 (the new measurement): exhaustive enumeration over all
      1,018,081 base points at p=1009 for each panel curve, classified by
      both the direct-arithmetic and quartic-factoring arms, with the
      per-instance cross-arm agreement rate reported.
      Stage 3 (controls): ordered-base reproduction and random-quartic
      Chebotarev control at p=1009, on the same enumeration.
      Stage 4 (the sharpened fit): compute and report the exact
      identity/sigma1sigma2 density deviations at all three tested primes
      side by side.
    controls:
      - "Stage 1 reproduction gate (hard, must pass before Stage 2 is read)."
      - "Ordered-base control (Stage 3), zero exceptions required."
      - "Random-quartic Chebotarev control (Stage 3), nonzero 4-cycle/3+1 rates required."
      - "Cross-arm (direct-arithmetic vs quartic-factoring) agreement rate, 1.000 required."
    required_metrics:
      - realized D_4 permutation count per curve, F_p and F_{p^2}
      - per-instance cross-arm agreement rate
      - all seven stratum counts and their closed-form residuals, per curve
      - ordered-base two-type-law reproduction result
      - random-quartic cycle-type histogram vs S_4 Chebotarev law
      - exact identity/sigma1sigma2 density deviation at p=101, 211, 1009

  falsification_conditions:
    - "Any panel curve at p=1009 realizing fewer than 8 distinct D_4 permutations, with controls passing."
    - "Any F_p vs F_{p^2} realized-class-count mismatch at p=1009."
    - "Any nonzero integer residual between a measured stratum count and its closed form at p=1009."
    - "The ordered-base control failing to reproduce KN-FIND-a8990a Theorem B exactly at p=1009."
    - "The random-quartic control failing to reproduce S_4 Chebotarev densities at p=1009 (instrument outcome, not evidence)."
    - "The Stage 1 reproduction gate failing to reproduce the committed p=211 results exactly (code-path defect, halts the record before Stage 2 is read)."

  confounders:
    - >-
      CURVE-PANEL RECONSTRUCTION. The literal (A,B) pairs used at p=101/211
      need not remain non-singular, or generic-ordinary, mod 1009; the panel
      must be reconstructed by the same deterministic rule and the choice
      disclosed, not silently reused or hand-picked after seeing results.
    - >-
      WALL-CLOCK AT 10^6 POINTS. Exhaustive enumeration at p=1009 is roughly
      23x the point count of p=211's exhaustive census; per-point cost must
      be measured and a wall-clock cap declared before the run, with a
      documented fallback to large deterministic sampling (matching the
      parent hypotheses' own "sampled census" language) if the cap is hit.
    - >-
      TOWER CONSTRUCTION AT A NEW PRIME. `fp_common.py`'s F_{p^2} construction
      (if it hardcodes anything specific to p in {101,211,1009's own quadratic
      non-residue}) must be checked for generality before being trusted at a
      new prime.

  interpretation_limits:
    - "CLAIM TIER toy for every measurement; the underlying group/arithmetic claims remain derivations, cited as such."
    - "NO ECDLP CLAIM OF ANY KIND, in either direction."
    - "m=3 ONLY; nothing here addresses m>=4."
    - >-
      DOES NOT DISCHARGE the cross-prime panel-spread-decay prediction named
      by H-MONO-0f9170 (that needs 3+ primes analyzed as a fitted decay
      curve with an explicit rate estimate, which is a larger, separate
      undertaking than a single additional witness point); this idea supplies
      one more ladder point toward that, not the full test.
    - "NO STATUS CHANGE to any existing record is proposed or implied (Coordinator authority alone, AGENTS.md rule 1)."

  heuristic_assumptions:
    - id: H1
      statement: >-
        The deterministic curve-panel-construction rule used at p=101/211
        generalizes to p=1009 without producing degenerate (singular,
        j=0/1728, or CM) curves by accident.
      rigorous_support: >-
        Not a distributional claim; a constructive fact checked directly by
        verifying non-singularity and computing j-invariants for the p=1009
        panel before any census cell runs.
      validation_plan: >-
        Compute discriminant and j-invariant for every candidate p=1009
        curve at Stage 0; reject and report any accidental degenerate case
        rather than silently substituting.
      falsification_condition: >-
        Any panel curve at p=1009 turning out singular, j=0, or j=1728 under
        the same construction rule that avoided these at p=101/211.
    - id: H2
      statement: >-
        Per-point census cost at p=1009 scales as predicted (roughly linear
        in the number of base points, i.e. no unexpected super-linear
        blow-up from F_{p^2} arithmetic at the larger prime).
      rigorous_support: >-
        Engineering estimate, not a theorem; each per-point operation is a
        handful of fixed-size modular arithmetic operations independent of p
        in this implementation style, so cost should scale with point count
        alone.
      validation_plan: >-
        Measure wall-clock per 10,000 points at p=1009 early in Stage 2 and
        extrapolate before committing to the full exhaustive run; fall back
        to large deterministic sampling if the extrapolated total exceeds
        the declared cap.
      falsification_condition: >-
        Measured per-point cost at p=1009 exceeding a small constant
        multiple of the p=211 per-point cost, indicating a non-scaling
        implementation detail that must be fixed before the results are
        trusted.

  target_complexity:
    time_exponent: >-
      NOT APPLICABLE -- no algorithm or attack is proposed. This is a toy-
      scale verification measurement; its own cost is O(p^2) per curve for
      the exhaustive arm, unrelated to any ECDLP cost claim.
    memory_exponent: >-
      O(1) beyond the per-curve enumeration state; well under 1GB at
      p=1009 (base of size ~10^6, each entry a handful of small integers).
    best_known: >-
      Not applicable; no complexity claim of any kind is made, in either
      direction, about ECDLP. Pollard rho at O(sqrt(N)) time, O(1) memory
      remains the prime-field baseline (KN-OPEN-001), untouched by this idea.
    hidden_overhead: >-
      None hidden: the entire cost is the exhaustive p^2 enumeration, stated
      explicitly, with a documented sampling fallback if it exceeds budget.
    tradeoff_note: not applicable; no algorithm is proposed.

  estimated_cost:
    implementation: low
    compute: low

  recommended_priority: medium

  priority_rationale: >-
    Not exponent-moving and explicitly disclosed as such (this idea produces
    no ECDLP claim). Priority is medium rather than low because it closes a
    concrete, cheap, already-named backlog item for TWO supported hypotheses
    at once, sharpens an already-established finding (HEUR-WREATH-3's
    O(p^{-1/2}) law) with a third, well-separated data point, and its
    negative outcome (a residual appearing only at p=1009) would be the
    single most consequential and cheaply-obtained result available in this
    lane's current backlog.

