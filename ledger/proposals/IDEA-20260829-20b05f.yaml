      verified_by: this idea-generator session, 2026-08-29, read in full
    - ref: RQ-ECDLP-165d4b
      provenance: internal
      claim: >-
        Scope lists ordinary prime-order short-Weierstrass curves over F_p,
        bounded-degree F_p-rational isogeny neighbours, and "charged isogeny
        transfer" among its methods; decision_target is to choose between
        endomorphism-orbit methods and short isogeny transfer.
      verified_by: this idea-generator session, 2026-08-29, read in full
    - ref: IDEA-20260807-f00729
      provenance: internal
      claim: >-
        The Aut-orbit projection is not a group homomorphism for |Aut| > 2, so
        orbit-tracking mechanisms that ADD projected objects pay an r-fold
        branching factor; the surviving uses are equality tests (sqrt(|Aut|))
        and whole-relation transport (|Aut|/2). Forward guidance G1-G4.
      verified_by: this idea-generator session, 2026-08-29, read in full
    - ref: KN-TECH-032
      provenance: internal
      claim: >-
        The embedding degree k is the least k with l dividing q^k - 1 and is the
        criterion for the MOV/Frey-Ruck transfer; small k is negligibly rare for
        random ordinary prime-field curves.
      verified_by: this idea-generator session, 2026-08-29, read in full
    - ref: KN-TECH-033
      provenance: internal
      claim: >-
        The anomalous condition is exactly #E(F_p) = p, and the additive
        transfer applies only at trace one; it does not degrade gracefully.
      verified_by: this idea-generator session, 2026-08-29, read in full
    - ref: IDEA-20260826-f412a0
      provenance: internal
      claim: >-
        Treats volcano depth as a NAVIGATION (hitting-time) cost on the height
        chain of an ell-isogeny walk, under RQ-VOLC-f6253b, and cites the
