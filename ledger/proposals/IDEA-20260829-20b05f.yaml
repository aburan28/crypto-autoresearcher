idea:
  id: IDEA-20260829-20b05f
  question_id: RQ-ECDLP-165d4b
  added: '2026-08-29'
  title: >-
    THE CENSUS'S COLUMN SET IS PROVABLY FINITE AND HAS EXACTLY THREE ENTRIES:
    Tate's isogeny theorem makes every order-derived non-genericity constant
    across an F_p-isogeny class, so charged isogeny transfer inside this RQ's
    scope can move only j, the End(E) conductor and |Aut| - then MEASURE the
    within-class spread of charged rho work over COMPLETE ordinary prime-order
    classes, which is the exact reachability ceiling of the transfer arm and
    which decides whether the campaign's recorded within-class over-dispersion
    is an index-calculus artefact or a shared curve-level cause
  class: mechanism

  claim: >-
    (A) THE ZERO-COMPUTE COLUMN CLOSURE. By Tate's isogeny theorem, two elliptic
    curves over F_p are F_p-isogenous if and only if #E(F_p) = #E'(F_p). Inside
    RQ-ECDLP-165d4b's declared scope the primary curves are PRIME-ORDER, and a
    group of prime order N is cyclic, so within one class BOTH the order and the
    group structure are constant. Consequently every order-derived
    non-genericity is exactly constant across the whole class: the anomalous
    condition N = p (KN-TECH-033), the embedding degree k = ord_N(p)
    (KN-TECH-032), cofactor and Pohlig-Hellman smoothness (KN-TECH-030,
    KN-TECH-034), and the generic-group bound itself. THEREFORE the RQ's own
    listed method "charged isogeny transfer" can move NOTHING in that list. What
    it can move is exhaustively: (i) the j-invariant, (ii) the conductor f of
    Z[pi] inside End(E), i.e. the volcano level, (iii) |Aut(E)| in {2,4,6},
    which is a function of the End-order discriminant and so is determined by
    (ii) together with (p,t), and (iv) the curve model or coordinate system.
    Item (iv) is eliminated at zero cost by the lossy-projection test of
    docs/inventor-protocol.md section 2: a birational change of model
    (Montgomery, twisted Edwards, Jacobi) is INVERTIBLE, discards nothing, and
    is therefore a change of coordinates and not a new object - with the single
    exception of x-only arithmetic, which is exactly the negation quotient and
    is already inside the 0.886 baseline convention. SO THE CENSUS COLUMN SET
    FOR THIS SCOPE IS {j, f, |Aut|}, AND IT IS PROVABLY COMPLETE. That is a
    census result, not an opinion: it tells the census which columns can be
    empty and which cannot exist.

    (B) THE MEASUREMENT THAT PRICES THE ARM. Define, for a complete ordinary
    prime-order isogeny class C = {E_1, ..., E_m} over F_p (m = the Kronecker
    class number of t^2 - 4p, so m = O(sqrt(p) log p)), the CLASS SPREAD
    S(C) = max_i Wbar(E_i) / min_i Wbar(E_i), where Wbar is the seed-averaged
    normalised charged rho work under one frozen cost model. Because the order
    is constant across C, S(C) is a pure curve-level quantity with every
    order effect divided out by construction. S(C) IS THE EXACT UPPER BOUND ON
    WHAT ANY CHARGED F_p-RATIONAL ISOGENY TRANSFER IN THIS SCOPE COULD EVER BUY,
    BEFORE THE TRANSFER IS CHARGED AT ALL. No such quantity has been measured by
    this program.

    (C) THE DISCRIMINATION, AND IT IS THE POINT. EV-ENDO-10109d records, as
    replicated fact at p=4001 and p=6007, a within-class OVER-DISPERSION of the
    3-decomposition rate at 1.3-3.6x binomial noise, density-independent
    (monotonic_decay False at both primes), cause unknown, and calls it that
    campaign's most important open question. Two mutually exclusive readings,
    and S(C) separates them.
      READING 1 - the over-dispersion is specific to the sum-set / factor-base
      object of index calculus, and charged rho work is FLAT within a class
      (S(C) = 1 + o(1), except at the at most two |Aut| > 2 vertices where it is
      exactly sqrt(3) or sqrt(2)). Then the two instruments see different
      structure, the endomorphism-orbit arm is capped at the already-measured
      automorphism ceiling, and short isogeny transfer has NO rho-visible target
      in this scope - the RQ's decision_target is answered in favour of
      endomorphism-orbit methods, with the transfer arm closed and priced.
      READING 2 - S(C) is materially above 1 on non-automorphism vertices and
      correlates with the conductor f. Then a curve-level cause is visible in
      BOTH instruments, the over-dispersion is not an index-calculus artefact,
      and short isogeny transfer acquires a concrete target whose value is S(C)
      and whose cost is already measured (EV-ENDO-10109d - transport loses
      1.5x at ell=3 rising to 21x at ell=31, no crossover in range) - so the arm
      is live only if S(C) exceeds those factors, which the same run decides.
    Both outcomes are deliverables. Neither is "try it and see".

    (D) WHAT IS NOT CLAIMED. No exponent moves. S(C) is a constant-factor
    quantity by construction. Nothing here says the over-dispersion has a cause,
    only that its VISIBILITY IN A SECOND, INDEPENDENT INSTRUMENT is a
    discriminating measurement that has not been made.

  mechanism: >-
    STEP 1 (zero compute, the closure). Write (A) out with the Tate statement,
    the prime-order cyclicity remark, the four-item reachable-invariant list, and
    the lossy-projection elimination of item (iv). Record it as the census
    column schema. Forward guidance is written INTO the schema: the columns that
    are provably constant across a class are marked CLASS-LEVEL and are censused
    once per (p, t) rather than once per curve, which reduces the census's own
    cost by the class size m = O(sqrt(p) log p).

    STEP 2 (low compute, class enumeration). For each of ~12 declared (p, t)
    pairs at 16, 18 and 20 bits with N = p + 1 - t prime and t not in {0, 1},
    enumerate the COMPLETE F_p-isogeny class by breadth-first walk of the
    ell-isogeny graph for ell in {2, 3, 5, 7} using Velu quotients
    (harness/velu_stage0.py), certifying each vertex by recomputing its order and
    asserting it equals N. Completeness is certified by comparing the vertex
    count against the Kronecker class number of t^2 - 4p computed independently.
    Record for every vertex: j, the conductor f of End (by volcano level, via the
    standard Kohel level test), |Aut|, and the ell-neighbour list.

    STEP 3 (medium compute, the spread). On every vertex of every class, run the
    same fully charged rho with a frozen cost model, 24 seeds, shared target
    scalar per class, and compute Wbar per vertex and S(C) per class. Because N
    is identical across the class, the normalisation is exact and no
    cross-scale comparison is involved - THIS IS THE ONE MEASUREMENT IN THIS
    CENSUS THAT NEEDS NO CALIBRATION CONSTANT, which is why it is worth running
    before the calibration work of IDEA-20260829-34f3ed lands.

    STEP 4 (zero compute, the decomposition). Fit
    log Wbar(E) = alpha_C + beta*[|Aut|(E) > 2] + gamma*log f(E) + eps and
    report the variance decomposition: between-class (must absorb essentially
    everything, since order is constant within class and varies between), the
    automorphism term (must recover -0.5*log(|Aut|/2), i.e. beta = -0.549 for
    j=0 and -0.347 for j=1728, from KN-TECH-018 and EV-ENDO-10109d's measured
    ratio-to-ceiling of 1.0043 and 1.0442), and the residual conductor term
    gamma, which is the quantity the whole record exists to measure.

    STEP 5 (zero compute, the hand-off). Emit S(C) with its CI as an
    obstruction record in the sense of docs/inventor-protocol.md section 4 - a
    quantity, units, error bars, the runs it is read from, and the scope - so
    that it is available to every other goal, including GOAL-ENDO-001, whose
    open question it bears on directly.

  novelty_status: unverified

  citations:
    - ref: EV-ENDO-10109d
      provenance: internal
      claim: >-
        (i) Within-class over-dispersion of the 3-decomposition rate at
        1.3-3.6x binomial, density-independent, monotonic_decay False at
        p=4001 and p=6007, cause unknown, recorded as the campaign's most
        important open question. (ii) Preprocessing isogeny transport LOSES to a
        correctly costed rebuild at every odd ell from 3 to 31 at p=50021 and
        p=60013, ratio 1.5x rising to 21x, with NO crossover in range.
        (iii) j=0 and j=1728 rho arms sit ON the sqrt(|Aut|/2) ceiling
