    - ref: null
      provenance: recalled
      claim: >-
        Tate's isogeny theorem (1966): elliptic curves over a finite field are
        isogenous over that field iff they have the same number of rational
        points. Kohel's thesis: the ell-isogeny graph of an ordinary class is a
        volcano, with the level determined by v_ell of the End conductor. Both
        are the load-bearing facts of claim (A) and NEITHER WAS OPENED IN THIS
        SESSION.
      verified_by: null

  assumptions:
    - >-
      p > 3, E ordinary, N = p + 1 - t prime, t not in {0, 1} (excluding
      supersingular and anomalous), embedding degree declared and large, twist
      order recorded. These are the RQ's own constraints and every enumerated
      vertex must carry the certificate.
    - >-
      Class completeness is CERTIFIED, not assumed: the enumerated vertex count
      must equal the independently computed Kronecker class number of t^2-4p.
      An incomplete class makes S(C) a lower bound only, and must be reported
      as such rather than silently used.
    - >-
      The claim in (A) that group STRUCTURE is class-constant uses primality of
      N. It is FALSE in general for composite order, where isogenous curves can
      have different group structures; the record is scoped to prime order for
      exactly this reason and says so.
    - >-
      S(C) is an upper bound on the transfer arm's value BEFORE the transfer is
      charged. It is not the arm's net value; the net value is S(C) divided by
      the charged transfer cost, and EV-ENDO-10109d already measures the latter
      at 1.5x-21x for ell = 3..31.

  proof_search_map:
    bottleneck: >-
      The step "walk from curve E to a better representative E' in the same
      class". Every isogeny-transfer proposal in this RQ passes through it, and
      the size of the prize - the within-class spread - has never been measured,
      only the cost of the walk.
    baseline_embedding:
      parameter_slice: >-
        The singleton class. For (p, t) with Kronecker class number 1 the class
        has one vertex and S(C) = 1 identically. The instrument must report
        exactly 1.000 there, with all seed noise absorbed by the seed averaging,
        which fixes the estimator's floor.
      reproduction_check: >-
        Frozen fixture: a declared (p, t) with class number 1 at 16 bits; assert
        the enumerated class has exactly one vertex and that the reported S(C)
        is 1.000 to the estimator's declared precision. Additionally assert that
        the known automorphism arm reproduces KN-TECH-018's constant - on a
        class containing a j=0 vertex, beta must recover -0.549 within the CI
        that EV-ENDO-10109d's 20-seed sd of 0.11 permits.
    observation_collision:
      observable: the class spread S(C) and the fitted conductor coefficient gamma
      distinct_preimage_search: >-
        REQUIRED. Search for two classes with the SAME S(C) but different
        volcano shape - one tall and narrow (large v_ell(f), small crater) and
        one flat and wide (f = 1, crater = the whole class). Such a pair is
        expected to exist and it BOUNDS what S(C) can conclude: S(C) is a
        scalar and cannot identify which curve-level invariant produced the
        spread. That is precisely why STEP 4's regression, not S(C) alone,
        carries the READING 1 / READING 2 verdict, and why gamma is reported
        with the same prominence as S(C).
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          The triple (j, f, |Aut|) as the census's complete column vector for
          class-internal variation, replacing the scalar "is this curve special".
        predicted_gain: >-
          Makes the census's column set PROVABLY complete for this scope, so an
          empty column is a statement about the mathematics rather than about
          what the census happened to look at.
      - transform: observable_fiber
        proposed_object: >-
          The fibre of "same order N" - the complete isogeny class - with the
          order held fixed and the forgotten structure (j, f) varied.
        predicted_gain: >-
          Divides out every order-derived effect exactly, at zero statistical
          cost, so any residual variation is curve-level by construction and
          needs no cross-scale calibration.
    quantifier_order: >-
      Claimed for (A): FORALL ordinary prime-order classes C over F_p and FORALL
      E, E' in C, every order-derived invariant agrees, and the set of invariants
      that can differ is contained in {j, f, |Aut|, model}. Claimed for (B):
      FORALL tested classes C, EXISTS a measured S(C) with a stated CI.
      EXPLICITLY NOT CLAIMED: that S(C) measured at 16-20 bits bounds S(C) at
      cryptographic size - that is a transfer assumption and is refused here.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On the tested ordinary prime-order classes at 16-20 bits, the maximum
        ratio of seed-averaged charged rho work between any two curves of the
        same class is S_max +/- CI, and the fitted conductor coefficient is
        gamma +/- CI." It can NEVER certify that no curve-level structure exists
        (only that none exceeds the measured spread at the measured power), nor
        anything at cryptographic scale, nor anything about composite-order
        groups, extension fields, or supersingular classes.
      nearby_object_control: >-
        THE COMPOSITE-ORDER CLASS, where claim (A)'s structure half FAILS -
        isogenous curves of composite order can have different group structures
        and hence genuinely different Pohlig-Hellman costs. The method must show
        a large S(C) there and a small one on prime-order classes. A method
        reporting the same S(C) on both has not identified the load-bearing
        structure (primality of N), and its column closure is void.
    proof_obligations:
      - claim: "F_p-isogenous implies equal order (Tate), hence class-constant order."
        responsibility: correctness
      - claim: "Prime order implies cyclic, hence class-constant group structure."
        responsibility: correctness
      - claim: "The reachable-invariant set is exactly j, f, Aut and model."
        responsibility: strictness
      - claim: "A birational model change is invertible, hence not a new object."
        responsibility: correctness
      - claim: "Enumerated class size equals the Kronecker class number."
        responsibility: feasibility
      - claim: "S(C) is estimated with a stated seed budget and CI."
        responsibility: success_probability
      - claim: "The composite-order control shows a live spread."
        responsibility: baseline
      - claim: "No cryptographic-scale transfer of S(C) is asserted."
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        number of distinct curve-level invariants a charged F_p-rational isogeny
        can change inside an ordinary prime-order class in this RQ's scope
      direction: different
      minimum_effect: >-
        Exactly 3 after the model column is eliminated by the lossy-projection
        test (j, f and |Aut|). A fourth surviving invariant refutes the column
        closure and IS the finding.
    - metric: >-
        class spread S(C) restricted to vertices with |Aut| = 2
      direction: different
      minimum_effect: >-
        READING 1 predicts S(C) <= 1.10 at every tested class with 24 seeds per
        vertex. READING 2 is any S(C) >= 1.30 that survives the seed-noise
        control. The band 1.10-1.30 is pre-registered as UNRESOLVED and must be
        reported as such rather than pushed to either reading.
    - metric: >-
        fitted conductor coefficient gamma in the regression
        log Wbar = alpha_C + beta*[|Aut|>2] + gamma*log f + eps
      direction: different
      minimum_effect: >-
        READING 1 predicts gamma indistinguishable from 0 with a CI half-width
        below 0.05. A |gamma| >= 0.10 with a CI excluding 0 at two independent
        primes is the first rho-visible curve-level signal in this lane and
        escalates immediately.
    - metric: >-
        fitted automorphism coefficient beta on classes containing a j=0 vertex
      direction: lower
      minimum_effect: >-
        Must recover -0.549 (= -0.5*log 3) within the CI implied by
        EV-ENDO-10109d's 20-seed sd of 0.11. A beta far from that value means
        the instrument disagrees with an already-replicated measurement and
        every other number in the run is void.
    - metric: >-
        composite-order nearby-object control spread
      direction: higher
      minimum_effect: >-
        Must exceed the prime-order S(C) by at least the Pohlig-Hellman factor
        implied by its own order factorisation. A control that shows no
        difference means the instrument is insensitive to a KNOWN effect and
        voids the prime-order reading.

  minimal_test:
    design: >-
      STAGE A (zero compute, hours): write the column closure of (A) with the
      Tate step, the primality step, the four-item list and the model
      elimination; emit the census column schema with CLASS-LEVEL versus
      CURVE-LEVEL marks. This alone is a deliverable and can be reviewed before
      any run. STAGE B (low compute): enumerate three complete classes at 16
      bits with certified class-number match, including one with a j=0 vertex
      and one singleton class, plus one composite-order control class. STAGE C
      (medium compute): rho on every vertex, 24 seeds, one frozen cost model;
      compute S(C), the regression, and every control. If STAGE B's class-number
      certificate fails on any class, STOP - the enumeration is wrong and no
      spread number may be reported. Scale to 18 and 20 bits only after the
      16-bit stage passes every control.
    controls:
      - >-
        SINGLETON CLASS (Kronecker class number 1): S(C) must be exactly 1.000
        to estimator precision. This is the estimator's zero point.
      - >-
        SEED-NOISE NULL: recompute S over 24 INDEPENDENT SEED SETS on a SINGLE
        curve. That quantity is pure noise and its distribution is the
        threshold S(C) must beat. An S(C) inside the seed-noise distribution is
        a controlled null, not a finding.
      - >-
        COMPOSITE-ORDER CONTROL CLASS, where the spread must be large.
      - >-
        j=0 ARM as a positive control recovering beta = -0.549.
      - >-
        RELABEL CONTROL: a deterministic vertex relabelling with no structural
        content, which must leave S(C) unchanged.
      - >-
        Matched Pollard rho and BSGS cost rows on every vertex, as the RQ's
        mandatory Pareto controls.
    required_metrics:
      - per class - enumerated vertex count vs independently computed Kronecker class number
      - per vertex - j, conductor f, automorphism count, certified order, twist order, embedding degree
      - per vertex - seed-averaged normalised charged work with CI, 24 seeds
      - per class - S(C) with CI, and the seed-noise null distribution it is compared against
      - regression coefficients alpha_C, beta, gamma with CIs
      - variance decomposition - between-class, automorphism, conductor, residual
      - pass/fail of every control
      - the emitted obstruction record for S_max, with units, error bars and scope

  falsification_conditions:
    - >-
      A fourth curve-level invariant is exhibited that a charged F_p-rational
      isogeny can change inside a prime-order class. The column closure in (A) is
      incomplete, the census schema is wrong, and the new invariant is the
      lane's forward direction.
    - >-
      The singleton-class control returns S(C) different from 1.000 to
      precision. The estimator is broken and every spread number is void.
    - >-
      The j=0 positive control fails to recover beta near -0.549. The instrument
      contradicts EV-ENDO-10109d's replicated measurement; halt and reconcile
      before reporting anything.
    - >-
      The composite-order control shows no larger spread than the prime-order
      classes. The instrument cannot see a known effect and the prime-order null
      is uninterpretable.
    - >-
      S(C) >= 1.30 on |Aut| = 2 vertices at two independent primes with gamma
      significantly nonzero. READING 1 is refuted, a curve-level cause is
      rho-visible, and the short-isogeny-transfer arm acquires a priced target -
      this outcome requires independent validation and red-team review before
      any use.

  confounders:
    - >-
      SEED NOISE MASQUERADING AS SPREAD. S(C) is a MAX/MIN statistic over m
      vertices and therefore grows with m purely from noise. The seed-noise null
      must be computed at the SAME m by resampling, not at m = 1, or the entire
      measurement is an order-statistic artefact. This is the single most likely
      way this record produces a false positive.
    - >-
      INCOMPLETE CLASS ENUMERATION biases S(C) downward and can hide a real
      spread; the class-number certificate is the only defence and is blocking.
    - >-
      THE CONDUCTOR AND THE AUTOMORPHISM COUNT ARE NOT INDEPENDENT: |Aut| > 2
      requires the fundamental discriminant -3 or -4, which constrains f. The
      regression must report the design matrix's condition number and, where the
      two columns are collinear within a class, report beta and gamma as a joint
      region rather than separately.
    - >-
      CROSS-CLASS COMPARISON IS NOT ATTEMPTED AND MUST NOT BE. S(C) is
      class-internal precisely so that no calibration constant is needed;
      comparing Wbar between classes reintroduces every finite-size bias that
      IDEA-20260829-34f3ed exists to measure.
    - >-
      CONFLATING THIS WITH EV-ENDO-10109d'S OPEN QUESTION. That over-dispersion
      is measured on the 3-decomposition rate, a sum-set statistic, at fixed
      classes. This record measures rho work. A null here does NOT resolve that
      question; it bounds how far it propagates into a second instrument.

  interpretation_limits:
    - >-
      Toy scale, 16-20 bits. S(C) at these sizes is not extrapolated and no
      cryptographic-scale statement is made or implied.
    - >-
      Scoped to ordinary, prime-order, non-anomalous classes over prime fields
      with declared twist and embedding-degree checks. The composite-order
      control exists to show how fast the column closure fails outside that.
    - >-
      A null S(C) closes only the tested classes, seeds, cost model and
      instrument. It says nothing about instruments other than charged rho, and
      explicitly nothing about index-calculus statistics.
    - >-
      The column closure of (A) is a statement about what CAN differ, not about
      what MATTERS. An invariant can be free to change and still be worthless.
    - >-
      Per KN-OPEN-019 this program has no written object enumeration for the
      ECDLP; the reachable-invariant list in (A) is complete for the declared
      SCOPE, not a taxonomy of ECDLP attack objects.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a complete ordinary prime-order F_p-isogeny class C and any two
        vertices E, E' in C with |Aut| = 2, the seed-averaged charged rho work
        satisfies Wbar(E)/Wbar(E') = 1 + O(m^(-1/2) * sd_seed / sqrt(s)) for s
        seeds, i.e. all class-internal variation is seed noise, with no
        systematic curve-level term. This is the null being tested, stated so
        that its rejection is the informative outcome.
      rigorous_support: >-
        The rigorous ingredient is Tate's theorem, which forces #E(F_p) to be
        identical across the class and therefore removes the only quantity the
        generic-group lower bound (KN-TECH-005) makes work depend on. The
        heuristic step is that a partition walk on two curves of identical order
        behaves like two independent uniformly random functions of that order -
        the standard rho heuristic, and the one that a nonzero gamma would
        falsify.
      validation_plan: >-
        Sample every vertex of three complete 16-bit classes (m ranging from 1
        to several hundred) at 24 seeds, and compare the empirical distribution
        of per-vertex log Wbar against the seed-noise reference distribution
        obtained by resampling a SINGLE vertex at the same m and s, using an
        F-test on variance ratio plus a Kolmogorov-Smirnov comparison. Tail
        check: the observed extreme vertex against the predicted maximum of m
        draws from the seed-noise reference. Repeat at 18 and 20 bits to check
        that any excess DECAYS as m^(-1/2) rather than staying constant - a
        non-decaying excess is, by docs/inventor-protocol.md section 3, the
        canonical artefact tell and is exactly what EV-ENDO-10109d reports for
        the other instrument. SAMPLED PARAMETERS RECORDED - the (p, t) list, N,
        m, s, seeds, ell set, cost-model version. TRANSFER ASSUMPTION - none is
        made beyond 20 bits.
    - id: H2
      statement: >-
        The breadth-first ell-isogeny walk over ell in {2,3,5,7} generates the
        whole class for every tested (p, t), i.e. the primes 2, 3, 5 and 7
        generate the relevant class group quotient.
      rigorous_support: >-
        Kohel's volcano structure plus the fact that the class group is
        generated by primes of small norm under GRH; the finite check replaces
        the asymptotic statement entirely at this scale.
      validation_plan: >-
        Certificate rather than sampling: compare the enumerated vertex count
        against the independently computed Kronecker class number of t^2 - 4p
        for every class. A mismatch is a blocking failure, not a caveat, and
