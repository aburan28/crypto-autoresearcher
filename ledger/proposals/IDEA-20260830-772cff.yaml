  heuristic_assumptions:
    - id: H1
      statement: >-
        RANDOM-BASE OCCUPANCY LAW. For D a uniformly random B-subset of a cyclic
        group of prime order N and arity m fixed, the coverage
        cov_D = #{r : c_D(r) >= 1}/N satisfies cov_D = (1 - e^{-mu})(1 + o(1))
        as N -> infinity with mu = binom(B+m-1,m)/N held in a fixed compact
        subinterval of (0, infinity). Consequently the supremum over ALL bases of
        the coverage advantage equals min(1, mu)/((1 - e^{-mu})(1 + o(1))), which
        is at most 1.581977 uniformly.
      rigorous_support: >-
        The RIGOROUS half is exact and two-fold - the conservation identity fixes
        sum_r c_D(r) = binom(B+m-1,m) with no error term, and coverage <=
        min(1, mu) is a theorem proved by splitting that identity over the
        support of c_D, verified in 336 cells with 0 violations. Only the
        DENOMINATOR is heuristic. The CLASSICAL DISTRIBUTION STATEMENT IMITATED
        is the Poisson occupancy limit for a balls-in-bins process with
        binom(B+m-1,m) balls in N bins - the same limit that gives the classical
        coupon-collector and random-allocation laws. The gap, stated plainly -
        the m-fold sums of a random set are pairwise nearly independent but not
        independent, and the total is conditioned to be exactly
        binom(B+m-1,m), so the Poisson limit is imitated rather than applied.
      validation_plan: >-
        SAMPLE - exhaustive coverage of matched random bases over the COMPLETE
        target set at N ~ 2^12, 2^14, 2^16, 2^18 with at least 12 independent
        draws per rung, so there is no sampling error in the coverage itself and
        the only spread is across draws and curves. COMPARISON DISTRIBUTION -
        the ratio cov_random / (1 - e^{-mu}) against 1, per rung. Existing
        support, quoted and to be reproduced independently - 0.740/0.679/0.678
        against 0.732/0.675/0.675 at N = 1009/4001/16381 and 0.6734/0.6594/0.6480
        against 0.6719/0.6588/0.6478 for the battery's own nulls, agreement
        0.2%-1%, with the residual DECREASING as N grows. TAIL CHECKS - (a) the
        full multiplicity histogram against Poisson(mu) by chi-square at the 1%
        level, not just the zero cell; (b) the variance-to-mean ratio, whose
        departure from 1 measures exactly the dependence the assumption ignores;
        (c) the fitted decay exponent of the residual against N, which must be
        negative for the o(1) to be real - a residual that is FLAT in N would
        leave the envelope N-dependent and would reopen the growth clause.
        TRANSFER - none; N <= 2^18, generated curves, m = 3.
    - id: H2
      statement: >-
        RANDOM-BASE RANK SATURATION. For D a uniformly random B-subset and
        relation rows (e_i | -b_i) harvested from uniform targets, the number of
        rows needed for the (B+1)-column coefficient matrix to attain rank B+1
        over F_N is (B+1)(1 + o(1)); concretely kappa_random <= 1.05 for
        B >= 40 at the tested sizes.
      rigorous_support: >-
        The RIGOROUS half is the trivial lower bound kappa >= 1, which holds for
        EVERY base with no assumption, and it is the half that carries the
        one-sided conclusion - the rank channel's ADVANTAGE is at most
        kappa_random, whatever kappa_random turns out to be. The CLASSICAL
        DISTRIBUTION STATEMENT IMITATED is the rank distribution of random
        matrices over a finite field, where the probability that B+c uniform rows
        fail to span a B-dimensional space is O(q^{-c}), together with the
        standard results that random sparse matrices with at least three nonzeros
        per row have full rank with high probability. The gap, stated plainly -
        the rows here are neither uniform nor independent; they are nonnegative
        exponent vectors of weight at most m with row sum exactly m, so they lie
        in an affine hyperplane, and rows harvested from the SAME target share
        their last column. Whether that structure costs more than o(1) extra rows
        is precisely what the measurement decides.
      validation_plan: >-
        SAMPLE - for each of 12 matched random bases per rung at N ~ 2^12, 2^14,
        2^16, 2^18, harvest rows by exact decomposition enumeration in the
        harvest order and record the full rank staircase to a budget of 10(B+1)
        rows. COMPARISON DISTRIBUTION - the excess (rows to full rank) - (B+1)
        against the geometric-tail prediction with ratio 1/N implied by the
        random-matrix rank count, by Kolmogorov-Smirnov at the 1% level. TAIL
        CHECKS - (a) the maximum excess observed across all draws against that
        tail; (b) the fraction of draws that never reach full rank within budget,
        predicted to be 0; (c) kappa recomputed after a random permutation of the
        harvested rows, which must agree, since disagreement means kappa is a
        property of the harvest order rather than of the base. TRANSFER - none.
        If kappa_random exceeds 1.2 at any rung the assumption is withdrawn and
        channel 3 is reported as NOT closed, which is a real and reportable
        outcome rather than a failure of the record.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS MOVED AND NO ALGORITHM IS PROPOSED. What is claimed is a
      BOUND on an exponent - under the stated cost model, the m = 3 factor-base
      relation-collection exponent is 1/2 for EVERY geometry, with the
      geometry's leverage confined to a multiplicative constant of at most
      1.582*(1+o(1)). The general-m form is stated for scope - with
      s = Theta(1) and L = Theta(B^2) the ledger m!N/B^{m-1} + B^2 optimises to
      Theta(N^{2/(m+1)}), which is N^{1/2} at m = 3, N^{2/5} at m = 4 and
      N^{1/3} at m = 5, identifying ARITY rather than geometry as the exponent
      lever; and with the honest meet-in-the-middle s = Theta(B) at m = 3 the
      optimum is Theta(N^{2/3}), which is worse than rho, consistent with the
      corpus's measured 2.0e4..1.5e5x.
    memory_exponent: >-
      For the ledger's hypothetical algorithm - Theta(B) = Theta(N^{1/4}) for the
      base and Theta(mB) for the sparse relation matrix at the m = 3 optimum, or
      Theta(B^2) = Theta(N^{2/3}) if a meet-in-the-middle table is used for the
      search at that variant's own optimum B = Theta(N^{1/3}), which is a genuine
      memory cost the s = Theta(B) variant hides. For the MEASUREMENT - one
      length-N count vector plus a (10B) x (B+2) matrix over F_N, under 1 GB at
      2^18.
    best_known: >-
      Pollard rho at 0.886*sqrt(N) time with O(1) memory, and van Oorschot-Wiener
      at sqrt(N^3/w) time with memory w, are the frontier for prime-field ECDLP.
      The ledger's own floor Theta(N^{1/2}) MATCHES rho's exponent and loses on
      memory, and the realistic Theta(N^{2/3}) loses on both; the corpus's
      measured index-calculus position is 2.0e4..1.5e5x slower than rho. Nothing
      here is competitive and the record says so.
    hidden_overhead: >-
      Four disclosures. FIRST, the Theta(N^{1/2}) floor assumes a FREE
      decomposition search, which does not exist; charging the real Semaev solve,
      which is superpolynomial in B, is what actually kills the method. SECOND,
      Theta(B^2) for sparse Wiedemann hides an O(log) cofactor and a large
      constant. THIRD, the o(1) in kappa_random = 1 + o(1) is measured at
      B <= 117 and is not established asymptotically. FOURTH, the 1.582 constant
      is attained only at mu = 1; at cryptographic parameters real prime-field
      index calculus would run at mu << 1 where the envelope collapses to
      1 + mu/2 -> 1, so the coverage channel is MORE closed at scale, not less -
      which is a strengthening of the kill and should be quoted with it.
    tradeoff_note: >-
      The one time-memory trade the ledger exposes is s(B) against memory - a
      meet-in-the-middle search buys s = Theta(B) at Theta(B^2) memory, moving
      the m = 3 exponent from the unreachable 1/2 to the achievable 2/3 while
      adding Theta(N^{2/3}) memory at that variant's optimum. Against van
      Oorschot-Wiener parallel rho, which reaches time sqrt(N^3/w) at memory w
      with perfect parallel scaling and no linear-algebra stage, every point on
      this ledger is dominated. The linear-algebra stage is the part that
      parallelises worst and it is charged at Theta(B^2) sequentially.

  dominated_by: >-
    CHECKED ROW BY ROW AGAINST THE FRONTIER ROWS THIS REPOSITORY RECORDS, NOT
    ASSERTED. AS AN ATTACK - none is mounted, so Pollard rho (0.886*sqrt(N),
    O(1) memory), BSGS (sqrt(N) time and memory), van Oorschot-Wiener parallel
    rho, and the corpus's own m = 3 chained-Semaev index calculus at
    2.0e4..1.5e5x rho each dominate it on time, memory and data. AS A YIELD
