    do. Not null on any axis.
  sota_delta: >-
    Zero on every ECDLP cost axis - no attack, no algorithm, no exponent moved.
    QUANTIFIED DELIVERABLE, stated as differences against the current corpus
    state. (i) The rank channel currently has ZERO measured values and one
    qualitative paragraph; this record supplies the one-sided bound kappa >= 1,
