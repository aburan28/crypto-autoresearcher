idea:
  id: IDEA-20260830-772cff
  question_id: RQ-FBG-001
  added: '2026-08-30'
  title: >-
    THE CHANNEL-SCOPED KILL, AT THE CLOSURE STANDARD. Three named bounds - yield
    advantage exactly 1, coverage advantage at most 1.582, rank advantage at most
    1 + o(1) - plus one cost ledger in which the target count is exactly
    geometry-invariant, give the m = 3 relation-collection exponent 1/2 for EVERY
    factor-base geometry, so the F3 family is exponent-irrelevant on those three
    channels; the deliverable is the third bound, the ledger, and the forward
    guidance naming the channels that survive.
  class: mechanism

  claim: >-
    (A) WHAT THIS RECORD IS. It is a derivation-level closure argument for
    RQ-FBG-001's decision target, written to the standard of
    docs/inventor-protocol.md section 4 - a NAMED OBSTRUCTION, an ARGUMENT, and
    FORWARD GUIDANCE - rather than a count of rejected mechanisms. Two of its
    three bounds are already in the corpus and are quoted, not claimed; the third
    bound, the cost ledger that assembles them, and the forward guidance are the
    new content, and each is separately falsifiable at low cost.
    (B) CHANNEL 1, YIELD. QUOTED, NOT NEW. Under a harvest-all solve, relations
    obtained per processed target equal the conservation mean
    mu = binom(B+m-1,m)/N exactly, for every base of size B in a group of order
    N. The advantage of any geometry over a matched random base is exactly 1 at
    every N, so its growth slope is identically 0. Source KN-FIND-007, measured
    deviation exactly 0 over 144 cells.
    (C) CHANNEL 2, COVERAGE. QUOTED, NOT NEW, AND CONDITIONAL. Under a
    one-relation-per-target solve, throughput is coverage, and coverage is
    bounded by min(1, mu) exactly, so the advantage is at most
    min(1, mu)/coverage_random. Conditional on H1 below - the random base's
    occupancy law coverage_random = (1 - e^{-mu})(1 + o(1)) - that expression is
    maximised at mu = 1 with value 1.581977 and tends to 1 as mu -> 0 and as
    mu -> infinity. It is a function of mu ALONE, and mu is fixed by the (B, N)
    convention rather than by geometry. So the coverage advantage cannot exceed a
    universal constant at any N, any B, any m, any convention. Source, the frozen
    battery's red-team objection RT-5.
    (D) CHANNEL 3, RANK. NEW, AND THE FIRST OF THE TWO THINGS THIS RECORD ADDS.
    KN-FIND-007 states explicitly that relation rank and independence are not
    captured and that the mean scores a rank-deficient base as tied with a random
    base of the same size, so the rank channel is the one place a reader could
    still hope for an unbounded geometry advantage. It is not there, and the
    reason is one line. Define the index-calculus system over F_N with unknowns
    x_1..x_B = log D_j and k = log_P Q, in which each harvested decomposition of
    a target R_i = a_i P + b_i Q contributes the row (e_i1..e_iB | -b_i) with
    right-hand side a_i, and define the RANK-SATURATION OVERHEAD kappa(D, N) as
    the number of harvested rows needed to reach rank B+1, divided by B+1. Then
    kappa >= 1 for EVERY base, trivially, because B+1 independent equations
    require at least B+1 rows. Conditional on H2 below, kappa_random = 1 + o(1).
    Therefore the rank channel's ADVANTAGE for any geometry is at most
    kappa_random / 1 = 1 + o(1) - bounded by a constant that tends to 1 - while
    its DISADVANTAGE is unbounded and can be infinite. A channel whose best case
    is 1 + o(1) cannot carry a growth clause. This is a genuine asymmetry and it
    is the reason the rank channel, despite being unmeasured, cannot rescue the
    question.
    (E) THE LEDGER, THE SECOND NEW THING. Total cost of m-term factor-base index
    calculus is total = T * s(B) + L(B) where T is the number of processed
    targets, s(B) the per-target decomposition-search cost, and L(B) the linear
    algebra. Under harvest-all, T = (B+1)*kappa/mu = kappa * m! N (1+o(1)) /
    B^{m-1}, in which the factor m! N / B^{m-1} is EXACTLY geometry-invariant by
    (B) and the only geometry-dependent factor is kappa, bounded below by 1 by
    (D). Under one-relation-per-target the geometry-dependent factor is at most
    1.582 by (C). So the geometry's TOTAL multiplicative leverage on the target
    count is at most 1.582 * (1 + o(1)) and its leverage on the exponent is zero.
    At m = 3 with s = Theta(1) and L(B) = Theta(B^2) for sparse Wiedemann on rows
    of weight m, the ledger 6N/B^2 + B^2 is minimised at B^4 = 6N with total
    2*sqrt(6N) = Theta(N^{1/2}) - matched Pollard rho - FOR EVERY GEOMETRY. With
    the honest s(B) = Theta(B) of a meet-in-the-middle search the ledger becomes
    6N/B + B^2, minimised at B^3 = 3N with total 3*(3N)^{2/3} = Theta(N^{2/3}),
    also for every geometry. The absolute floor, taking s = Theta(1) and
    L(B) = Theta(B) (merely writing down B unknowns), is Theta(N^{1/m}), reached
    by nobody.
    (F) THE CONCLUSION AND ITS EXACT SCOPE. On the yield, coverage and rank
    channels, no factor-base geometry can produce an advantage that grows with N;
    the maximum is a universal constant of 1.582 * (1 + o(1)), and the m = 3
    exponent is 1/2 regardless of geometry. That is the scoped-kill branch of
    RQ-FBG-001's decision target, and it is CHANNEL-SCOPED, not family-scoped.
    (G) FORWARD GUIDANCE, WITHOUT WHICH THIS IS A FATIGUE REPORT AND NOT A
    CLOSURE. Four classes remain open and each has a live record. (g1) THE SOLVE
    CHANNEL s(B), where IDEA-20260808-9ef88c files a claim that a MULTIPLICATIVE
    COSET base - one of RQ-FBG-001's own six named geometries - has a binomial
    membership ideal, solving degree exactly B-1 against the semi-regular
    Theta(mB/2), and an O~(B^m) DFT solve; a family kill that appeared to cover
    that geometry would wrongly close an open claim in a different channel.
    (g2) THE LINEAR-ALGEBRA CHANNEL L(B), where KN-OPEN-006 proposes
    arithmetic-progression relation supports for displacement-rank structure and
    IDEA-20260816-dca08c proposes the measurement; the ledger shows why it
    matters, since L(B) = B^{1+o(1)} instead of B^2 would move the m = 3 optimum.
    (g3) THE REPRESENTATION-SIDE TARGET RESTRICTION, IDEA-20260830-c5c614, which
    escapes (B) legitimately because conservation is a WHOLE-GROUP statement and
    a target set decidable from x(R) needs no discrete logarithm.
    (g4) THE ARITY m, which the ledger identifies as the actual exponent lever -
    with a free solve the exponent is 2/(m+1) - and which is not a geometry
    question at all.
    (H) NOT CLAIMED. This is NOT a universal impossibility claim and may not be
    cited as one; docs/claims-and-verification.md forbids that from bounded
    experiments and this record respects it. It is NOT a claim that index
    calculus fails - the Gaudry-Diem 1/n! decomposition probability over
    extension fields IS this conservation mean, so the identity is fully
    consistent with index calculus working, and the extension-field advantage
    lives in the solve. It is NOT a claim about any geometry's solve cost, and it
    does NOT close (g1)-(g4).

  mechanism: >-
    THE OBSTRUCTION, NAMED, AND WHY IT IS AN OBSTRUCTION RATHER THAN A VERDICT.
    The obstruction is CONSERVATION OF DECOMPOSITION MASS - the map from size-m
    multisets of the base to the group is a function, so its fibres partition a
    set of fixed size binom(B+m-1,m), and the fibre-size total is a property of
    (B, m, N) alone. Every quantity RQ-FBG-001 proposed to optimise is a
    functional of that fibre-size vector, and the only freedom a geometry has is
    to redistribute mass among fibres. Redistribution is bounded on both of the
    functionals that matter - upward by min(1, mu) on coverage, and upward by
    1 + o(1) on rank saturation - because both functionals are Schur-type
    quantities of a vector whose sum is pinned. The obstruction is therefore a
    MEASURED QUANTITY with a scope, not an opinion - the mass is exactly
    binom(B+m-1,m), the deviation was exactly 0 across 144 cells, the coverage
    bound held in 336 cells with 0 violations, and the extremes of the
    redistribution were measured at 0.0021 and 1.1071.
    THE SECOND READING, WHICH SECTION 4 REQUIRES. Turning the obstruction over -
    which theory WANTS a pinned total with free distribution? Two do. First, the
    theory of extremal sumsets - coverage times N is exactly the size of the
    m-fold sumset |Sigma_m(D)|, so the coverage ceiling is the statement that a
    B_m (Sidon-of-order-m) set maximises the sumset, which is why Bose-Chowla
    attains it and why the ceiling is reachable only by a construction defined in
    the exponent coordinate, whose logarithms are known by construction and which
    is therefore not a factor base. Second, the theory of cost ledgers with a
    conserved resource - a pinned total means the ONLY levers are the price per
    unit (s(B), the solve) and the exchange rate into the answer (L(B), the
    linear algebra), which is precisely the forward guidance (g1) and (g2). The
    obstruction is thus the hypothesis of the two theories this record redirects
    to, which is what a closure is supposed to produce.
    THE LOSSY-PROJECTION TEST APPLIED TO THIS RECORD'S OWN OBJECT. The tracked
    object is the FIBRE-SIZE VECTOR of the decomposition map, projected to the
    triple (mean, coverage, kappa) - three numbers standing in for N integers. It
    is lossy - it forgets which target, which base element, the curve and the
    field, and enormous numbers of distinct bases share the triple. It is lossy
    COMPATIBLY with the operations the target performs, since processing one more
    target and harvesting all its decompositions moves mean by exactly 0 (it is a
    property of the vector, not of the harvest), moves coverage by the indicator
    of a fresh hit, and moves kappa by a rank-1 update - all three propagate
    deterministically. And it is NOT a change of coordinates - the observation
    collision below exhibits two bases with the same triple and different solve
    cost, which is exactly what confines this record's conclusion to three
    channels and is the honest reason the kill is channel-scoped.

  novelty_status: unverified

