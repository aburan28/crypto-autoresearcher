  assumptions:
    - >-
      The group is cyclic of prime order N and the base has B distinct elements;
      the frozen counting convention (arity m, symmetric or not, effective size
      after negation collapse) is identical across every arm compared. The
      conservation proof itself is convention-robust in form and
      convention-bound in its constant.
    - >-
      Relations are harvested from targets R = aP + bQ with a, b uniform, so the
      target set is the whole group and conservation binds. If the target set is
      restricted the identity does NOT bind - that route is explicitly excluded
      from this record and is IDEA-20260830-c5c614's subject.
    - >-
      The linear-algebra stage is sparse Wiedemann on rows of weight m, giving
      L(B) = Theta(m B^2). If a structured solve gives L(B) = B^{1 + o(1)} the
      ledger's optimum changes and the record's exponent statement is scoped
      accordingly - which is exactly forward guidance (g2), not a hidden
      assumption.
    - >-
      Toy scale binds for every MEASURED input. The two size-free ingredients -
      the conservation identity and coverage <= min(1, mu) - are theorems in any
      finite abelian group for any target-independent counted family, so their
      transfer is mathematical rather than extrapolated; kappa_random is not
      size-free and is a measured quantity at N <= 2^18.

  proof_search_map:
    bottleneck: >-
      The exponent of relation collection in m-term factor-base index calculus.
      The exact step is the count of PROCESSED TARGETS needed for B+1 independent
      relations - the only quantity through which a factor-base geometry can
      touch the exponent without touching the solve or the linear algebra. This
      record shows that step is pinned to m! N / B^{m-1} up to a bounded constant.
    baseline_embedding:
      parameter_slice: >-
        Set the geometry to a matched random base. The ledger must return the
        corpus's own recorded ordering - at m = 3 with s = Theta(B)
        meet-in-the-middle and L = Theta(B^2), the optimum B = Theta(N^{1/3}) and
        total Theta(N^{2/3}), which is worse than Pollard rho's 0.886*sqrt(N),
        matching the corpus's measured statement that the m = 3 chained-Semaev
        solve runs 2.0e4..1.5e5x slower than rho. The ledger is an embedding only
        if it reproduces that ordering symbolically.
      reproduction_check: >-
        Symbolic. Minimise 6N/B + B^2 and verify B^3 = 3N with value
        3*(3N)^{2/3} = Theta(N^{2/3}); minimise 6N/B^2 + B^2 and verify B^4 = 6N
        with value exactly 2*sqrt(6N) = Theta(N^{1/2}). A frozen regression
        fixture stores both optima, their optimising B and their constants, and
        any later edit to the cost model must reproduce them.
    observation_collision:
      observable: >-
        The triple (mean, coverage, kappa) of a factor base.
      distinct_preimage_search: >-
        FOUND, AND IT IS THE REASON THE KILL IS CHANNEL-SCOPED. Take V a
        multiplicative coset with B | p - 1 and V' a random base of the same size.
        By KN-FIND-007 their means are exactly equal; their coverages are
        recorded at 1.00121 versus 1.0 in the frozen battery's coset_union arm,
        i.e. equal within the per-cell resolution; and there is no reason for
        their kappa to differ. So the triple does not separate them - yet
        IDEA-20260808-9ef88c claims their SOLVING DEGREES differ by a factor of
        about m/2, B-1 against ceil((m(B-1)+D_S)/2). Two objects, one observable,
        opposite sides of the conclusion. The additional condition that separates
        them is the algebraic description of the membership ideal, which the
        triple discards entirely. Consequently this record's conclusion is stated
        over three channels and may never be quoted as covering the solve.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The cost ledger total = T*s(B) + L(B) with T factored as
          (B+1)*kappa/mu, so that each factor is charged to exactly one proved or
          measured bound - mu to the conservation identity, kappa to the
          rank-saturation measurement, s and L left unbounded and named as the
          surviving channels.
        predicted_gain: >-
          No gain is claimed. The transform's purpose is to make the geometry's
          leverage a single explicit factor bounded by 1.582*(1+o(1)), so that
          "geometry cannot move the exponent" becomes an arithmetic statement
          about one factor rather than a survey of six cells.
      - transform: stronger_invariant
        proposed_object: >-
          kappa, the rank-saturation overhead, kept alongside coverage instead of
          collapsing to coverage - because rank is what survives into the solve
          stage while coverage does not.
        predicted_gain: >-
          Closes the one channel KN-FIND-007 names as uncaptured, by exhibiting
          its one-sided bound kappa >= 1.
    quantifier_order: >-
      FOR ALL m >= 2, FOR ALL prime N, FOR ALL B, FOR ALL bases D and D' of the
      same effective size B in the same group, the harvest-all relations per
      processed target are EQUAL - the strongest order, with no witness allowed
      to depend on anything. FOR ALL such D, D' the coverage advantage is at most
      min(1,mu)/coverage_random, where coverage_random is the SAME for all of
      them, so again nothing depends on the geometry. The rank clause is weaker
      and its order is stated honestly - FOR ALL D, kappa(D) >= 1 (uniform,
      trivial), while kappa_random = 1 + o(1) is EXISTS-a-bound-per-N conditional
      on H2 and is measured rather than proved. The ledger clause is
      FOR ALL geometries, FOR ALL N, the m = 3 optimum exponent is 1/2 GIVEN the
      stated s and L - and the "given" is a genuine restriction, not a formality,
      because s and L are exactly the surviving channels.
    method_ceiling:
      strongest_certifiable_claim: >-
        That on the yield, coverage and rank channels, and under the stated cost
        model with s = Theta(1) and L = Theta(B^2), the m = 3 relation-collection
        exponent is 1/2 for every geometry and the geometry's leverage is a
        constant of at most 1.582*(1+o(1)). It can NEVER certify anything about
        s(B) or L(B), and therefore can never certify that no factor-base
        geometry is exponent-relevant.
      nearby_object_control: >-
        The multiplicative coset of IDEA-20260808-9ef88c is the nearby object on
        which the desired sweeping conclusion FAILS - it is one of the six named
        geometries, it satisfies every bound in this record, and it has a filed
        claim of a solving-degree collapse. Running the method on it returns "no
        advantage" on all three channels, which is correct and is exactly why the
        method has not identified the load-bearing structure of the solve. That
        is stated here rather than discovered later.
    proof_obligations:
      - claim: >-
          Harvest-all relations per processed target equal mu exactly, for every
          base of size B.
        responsibility: baseline
      - claim: coverage <= min(1, mu) with equality iff no target has two decompositions.
        responsibility: strictness
      - claim: coverage_random = (1 - e^{-mu})(1 + o(1)) - HEURISTIC H1, not proved.
        responsibility: success_probability
      - claim: kappa >= 1 for every base.
        responsibility: size
      - claim: kappa_random = 1 + o(1) - HEURISTIC H2, measured not proved.
        responsibility: success_probability
      - claim: >-
          6N/B^2 + B^2 is minimised at B^4 = 6N, i.e. B = (6N)^{1/4}, with value
          exactly 2*sqrt(6N); and 6N/B + B^2 is minimised at B^3 = 3N with value
          3*(3N)^{2/3}.
        responsibility: runtime
      - claim: >-
          The conclusion is scoped to three channels and to the stated cost
          model, and every citation carries that scope.
        responsibility: scope

  predictions:
    - metric: >-
        coverage advantage of any geometry over a matched random base, measured
        at any (N, B, m) in the tested range
      direction: different
      minimum_effect: >-
        BOUNDED ABOVE BY 1.582 AND BY min(1,mu)/coverage_random at the cell's own
        mu. A single measured cell above that bound falsifies channel 2 and, with
