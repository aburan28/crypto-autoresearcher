    no prior row; KN-FIND-007 records the channel as uncaptured and RT-10 argues
    it qualitatively with no number, and IDEA-20260816-dca08c measures a
    DIFFERENT invariant (displacement rank) and runs no solve. AS A COST-LEDGER
    STATEMENT - IDEA-20260807-e57607 is described in the corpus as deriving which
    factor of an index-calculus cost expression can move an exponent and may
    dominate this limb; I did NOT open that record this session and therefore
    cannot exclude it, which is recorded here as an UNRESOLVED domination check
