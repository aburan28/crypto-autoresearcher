  minimal_test:
    design: >-
      This is a derivation, and its cheap parts are checked before any compute.
      STAGE 0, ZERO COMPUTE. Re-derive the ledger symbolically, verify the two
      baseline optima with their optimising B and their constants, and freeze
      them as a regression fixture. Verify the maximisation of
      min(1,mu)/(1 - e^{-mu}) at mu = 1 with value 1.581977 by independent
      recomputation, not by quoting RT-5.
      STAGE 1, LOW COMPUTE, THE RANK LIMB. Execute the kappa measurement of
      IDEA-20260830-f89eaf and read three numbers out of it - kappa_random at
      each rung, min over the panel of (kappa_D - kappa_random), and the growth
      slope. Channel 3 stands or falls here and nowhere else.
      STAGE 2, LOW COMPUTE, THE COVERAGE LIMB. Recompute the coverage advantage
      against the cell's own min(1,mu)/coverage_random bound for every cell the
      frozen battery already produced, plus a Bose-Chowla witness at mu near 1
      rather than at the mu near 0.2 where the recorded 1.1071 was taken. The
      prediction is that a ceiling-attaining base at mu = 1 measures near 1.54,
      not near 1.11, and that no cell exceeds 1.582 - a sharp, cheap check of the
      envelope at the point where it is maximal.
      STAGE 3, MEDIUM COMPUTE, THE LEDGER LIMB. Instrument the realised
      relation-collection cost - targets processed, solve attempts, field
      operations, wall time - to B+1 INDEPENDENT relations, for three geometries
      (matched random, a low-collision near-ceiling base, and H017 small
      multiples) at N ~ 2^12, 2^14, 2^16, 2^18, and fit log-log slopes with one
      Holm correction. The discriminating output is three slopes with intervals
      and three intercept ratios.
      STAGE 4, ZERO COMPUTE. Write the closure record - obstruction block with
      the quantity, its value, units, error bars, runs and scope; the argument;
      and forward guidance (g1)-(g4) with the live record IDs. Any channel whose
      limb failed is reported as NOT closed.
      ENVELOPE. Stages 0, 2 and 4 are minutes. Stage 1 is the f89eaf battery.
      Stage 3 is dominated by exact decomposition enumeration at 2^18, about 5e5
      operations per cell, times three geometries, four rungs, four curves and
      four seeds - core-minutes to core-hours, with peak memory one length-N
      count vector plus a (10B) x (B+2) matrix over F_N, well under 1 GB. No
      Groebner basis is built, so the GOAL-DREG-001 memory wall cannot be met.
    controls:
      - >-
        MATCHED RANDOM BASE at identical negation-collapsed effective size in
        every arm and every stage, drawn in the same invocation.
      - >-
        CEILING-ATTAINING WITNESS at mu near 1 - a Bose-Chowla B_3 base or a
        whole-group low-collision greedy - which must measure a coverage
        advantage near 1.54 and never above 1.582. Without it Stage 2 tests the
        envelope only where it is slack.
      - >-
        DELIBERATELY RANK-DEFICIENT POSITIVE CONTROL - a base with two duplicated
        elements, which must return kappa = infinity. A pipeline that cannot
        detect a rank deficiency it was handed cannot report kappa_random.
      - >-
        CLOSED-FORM TOTAL CHECK per cell, deviation exactly 0, reproducing the
        frozen battery's 67784/67784 standard.
      - >-
        SYMBOLIC REGRESSION FIXTURE for both ledger optima and their constants,
        checked before any compute and again after.
      - >-
        ARM-LABEL VERIFICATION against the committed source per
        IDEA-20260829-c6e7a4, because one live harness path builds the H017
        geometry under a different name.
    required_metrics:
      - kappa per arm per rung, with the budget at which infinity is declared
      - kappa_random and min over panel of (kappa_D - kappa_random), with intervals
      - coverage advantage per cell against its own min(1,mu)/coverage_random bound
      - mu per cell, since the envelope is a function of mu alone
      - ceiling-attaining witness advantage at mu near 1
      - targets processed and solve attempts to B+1 independent relations, per arm
      - fitted log-log cost slope per arm with Holm-corrected interval
      - intercept ratios against the matched random arm
      - closed-form total residual per cell, required 0
      - symbolic fixture pass or fail for both ledger optima
      - peak RSS and wall time

  falsification_conditions:
    - >-
      Any measured coverage advantage exceeds min(1, mu)/coverage_random at its
      own mu, or exceeds 1.582 anywhere. Channel 2 falls, heuristic H1 falls with
      it, and the coverage channel is REOPENED.
    - >-
      kappa_random exceeds 1.2 at any rung. Heuristic H2 falls, the rank channel
      is reopened, and a geometry with kappa below kappa_random would then carry
      a real advantage.
    - >-
      Any geometry shows kappa below kappa_random by more than 0.05. Channel 3
      falls directly - a rank ADVANTAGE exists.
    - >-
      Any geometry's fitted log-log cost slope differs from the matched random
      arm's beyond the Holm-corrected interval. The ledger's central claim - that
      geometry enters only as a bounded constant - is false and the F3 family is
      ALIVE.
    - >-
      The symbolic baseline slice fails to reproduce the Theta(N^{2/3}) and
      Theta(N^{1/2}) optima with their optimising B and their constants. The
      ledger is mis-derived and nothing in the record stands.
    - >-
      All limbs pass. RQ-FBG-001 takes its scoped-kill branch, CHANNEL-SCOPED to
      yield, coverage and rank under the stated cost model, with (g1)-(g4)
      explicitly left open and each pointing at a live record.

  confounders:
    - >-
      THE COST MODEL IS A CHOICE, AND IT IS DOING MOST OF THE WORK. Setting
      s = Theta(1) and L = Theta(B^2) is what produces the Theta(N^{1/2}) floor;
      other choices give other exponents, and the record's honest content is the
      CONDITIONAL statement plus the identification of s and L as the free
      parameters. A reader who quotes the exponent without the model has been
      misled by this record.
    - >-
      kappa DEPENDS ON THE HARVEST ORDER. Rows arrive in an order chosen by the
      harvester, and a rank staircase is order-sensitive; the measurement must
      report kappa under a declared order and under a random permutation of the
      same rows, and disagreement between them is itself reportable.
    - >-
      x-COLLISIONS CHANGE EFFECTIVE SIZE SILENTLY. The frozen battery observed
      B' = 92 rather than 94 at 2^14, which moves mu and therefore the envelope.
      Effective size must be used in every denominator.
    - >-
      THE 1.582 CONSTANT IS ATTAINED ONLY AT mu = 1 AND THE FROZEN CONVENTION
      SITS THERE. That is the MOST favourable operating point for the effect
      being bounded, which strengthens the kill - but it also means a battery run
      at another convention would see a smaller envelope and could mistake
      convention for geometry.
    - >-
      SECOND-HAND NUMBERS. The EV-R6-001 solve-cost figures used to motivate the
      cost model were read inside another document, not from the record. Stage 3
      measures its own costs rather than importing them.
    - >-
      ONLY FOUR RUNGS. A log-log slope over four toy sizes with a Holm correction
      has wide intervals, and "identical slopes" may mean "underpowered". The
      required rung count for a stated separation is computed and reported rather
      than assumed.

