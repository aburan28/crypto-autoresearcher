idea:
  id: IDEA-20260811-b2806a
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-GGMB-6eaabc
  goal_id: GOAL-ENDO-001
  title: >-
    THE SIMULABILITY AUDIT OF THIS SESSION'S THREE NEW ORACLE CLASSES, PLUS THE
    BOUNDARY OF KN-FIND-b7e091 STATED WHERE IT ACTUALLY LIES: a curve-only local
    label and a genus-character oracle are simulable at ZERO group operations and
    are closed; the POINT-STATISTIC oracle is not covered by the zero-information
    argument at all, because its answer depends on a group handle -- and the
    honest verdict is that it is simulable in the pure GGM and NOT simulable in
    the encoding-aware model where every index-calculus attack in this program
    lives, which is a scope statement about the closure and never a weakening of
    it
  class: control

  claim: >-
    (A) THE OBLIGATION BEING DISCHARGED. KN-FIND-b7e091 is binding and extended:
    every invented oracle must be routed through RQ-GGMB-6eaabc and declared
    simulable (hence closed at exponent 1/2) or non-simulable with an explicit
    argument. This session invents three oracle classes and this record classifies
    all three BEFORE any of them is run, which is the lane's intended use and is
    cheaper than running any of them.
    (B) ORACLE L, THE LOCAL-LABEL ORACLE (IDEA-20260811-9bb909,
    IDEA-20260811-245481, IDEA-20260811-fe0934, IDEA-20260811-565915). Input: the
    curve. Output: splitting type of the 2-division polynomial, volcano level
    vector, model-availability vector, norm and kernel polynomial of the minimal
    non-scalar endomorphism. VERDICT: SIMULABLE AT ZERO GROUP OPERATIONS. It
    takes no group handle as an argument, so its answer is a function of public
    curve data alone, and k is independent of public curve data. This is exactly
    the zero-information class of IDEA-20260807-413fcc, and the correct reading is
    that these labels can be granted for free to any adversary without changing
    any bound. CLOSED at exponent 1/2 for any algorithm that does not additionally
    consume R1 or R2.
    (C) ORACLE G, THE GENUS-CHARACTER ORACLE (IDEA-20260811-10eacc). Input: the
    curve, or a pair of curves in one class. Output: the genus of the connecting
    ideal class, or the values of all genus characters. VERDICT: SIMULABLE AT
    ZERO GROUP OPERATIONS for the single-curve form, by (B). For the PAIR form it
    is still a function of public curve data (both curves are public), so it is
    also zero-information about k. CLOSED, with the same caveat: it is not closed
    for the class-group vectorization problem, which is a different problem with
    a different bound, and no statement about that problem is made here.
    (D) ORACLE S, THE POINT-STATISTIC ORACLE (IDEA-20260811-8cf53a). Input: a
    group handle R. Output: pi(R) for a publicly computable coordinate or torsion
    statistic pi with image size M. THIS ONE IS DIFFERENT AND THE DIFFERENCE IS
    THE RECORD'S REAL CONTENT. In the PURE generic group model the encoding is a
    random injective labelling chosen by the simulator, so the simulator may
    define pi on labels however it likes and answer consistently: Oracle S is
    SIMULABLE, and Shoup's bound applies unchanged. In the ENCODING-AWARE model
    -- where the adversary sees actual F_p-coordinates and can evaluate pi
    itself, which is the model every Semaev, index-calculus and summation-
    polynomial attack in this program implicitly works in -- the simulator no
    longer controls pi, because pi's value is determined by the real curve
    arithmetic and can be cross-checked. Oracle S is then NOT simulable, and
    KN-FIND-b7e091 does not cover it.
    (E) WHY (D) IS NOT A CRACK IN THE CLOSURE. KN-FIND-b7e091 closes the
    incidence oracle and the endomorphism-image oracle, both of which are
    simulable in the encoding-aware model too, because their outputs are
    determined by group operations. Oracle S is outside that finding's stated
    scope and always was; naming the boundary is a scope clarification, and it is
    accompanied by the cost identity of IDEA-20260811-8cf53a, which shows that the
    non-simulable resource is ANTI-HELPFUL -- exploiting it costs sqrt(N*M)
    against rho's 0.886 sqrt(N). So the lane's two halves agree: where the GGM
    stops covering the resource, the cost model takes over and the answer is
    still negative, by a factor sqrt(M) that is stated rather than hoped for.
    (F) THE STANDING RULE THIS RECORD PROPOSES. Every future oracle in this
    campaign declares (i) whether it takes a group handle, (ii) whether its answer
    is determined by group operations alone, and (iii) if not, its image size M
    and its exploitation cost under the sqrt(N*M) identity. Items (i) and (ii)
    decide simulability; item (iii) decides whether non-simulability is worth
    anything. The campaign currently has (i) and (ii) and does not have (iii).

  mechanism: >-
    Simulability in the GGM turns on one question: is the oracle's answer a
    function of data the simulator already controls? Curve data is public and
    k-independent, so curve-only oracles are free. Group-operation-determined
    answers are computable by the simulator, so those are free too. What escapes
    is an oracle whose answer depends on the REAL encoding in a way the adversary
    can verify independently -- which is exactly what a coordinate statistic is,
    and exactly the reason index calculus is not covered by Shoup's bound. The
    audit is therefore a two-question decision procedure, and the third question
    exists only for the answers that escape.

  tracked_object: >-
    The oracle's dependency signature: the tuple (takes a group handle?,
    determined by group operations?, image size M, evaluation cost). This is the
    tracked object of the audit lane, and it is followed across every oracle the
    campaign invents.

  resource: >-
    None; this lane audits resources rather than consuming one, per
    DECOMPOSITION L12.

  lossy_projection_test: >-
    PASSES, in the lane's own register. The dependency signature is a drastic
    projection of an oracle -- infinitely many distinct oracles share a signature
    -- and it propagates deterministically under composition: an oracle built
    from two oracles has a signature computable from theirs (it takes a handle if
    either does; it is group-determined if both are; its image size is at most the
    product). That composition rule is what makes the signature an object and not
    a label, and it is the reason a campaign can audit compound oracles without
    re-deriving a simulator each time.

  t5_reachability: >-
    Not applicable and stated: no curve is selected and no walk occurs. The audit
    does however supply the T5 discussion with a needed constraint -- a local
    goodness test IS an Oracle L, hence free, hence it cannot be the source of any
    advantage on G; whatever a local test buys must be bought in the R1/R2 world,
    which is where IDEA-20260811-b3a355 prices it.

  null_object: >-
    A KNOWN-SIMULABLE oracle and a KNOWN-NON-SIMULABLE oracle, both run through
    the decision procedure as calibration. The known-simulable case is the
    incidence oracle of KN-FIND-b7e091, which the procedure must classify as
    closed. The known-non-simulable case is the first-jet oracle (Oracle A of
    KN-FIND-b7e091), which is non-simulable but privately computable and requires
    k; the procedure must classify it as non-simulable AND as useless, since
    otherwise the procedure is just declaring everything closed. A decision
    procedure that returns "closed" on both is void.

  why_not_a_renamed_known_approach: >-
    The lane already contains a graded simulability analysis by existential width
    (IDEA-20260807-7270d1), a zero-information oracle closure
    (IDEA-20260807-413fcc), an isogeny-transport relabelling simulator
    (IDEA-20260807-d73e83) and two negative oracle analyses (-fd2d89, -569c82).
    This record is not a fifth simulator: it is the audit of THIS session's new
    oracles, as the binding finding requires, plus one scope statement -- the pure
    versus encoding-aware distinction for point statistics -- that none of those
    records makes explicitly, and one new mandatory field (M and its cost) that
    turns a binary verdict into a usable one.

  novelty_status: adaptation
  novelty_screen: >-
    Screened this session against knowledge/findings/KN-FIND-b7e091.md in full
    and against the RQ-GGMB lane (IDEA-20260807-7270d1, -413fcc, -d73e83, -fd2d89,
    -569c82, -5ddd98, -63056d), plus DECOMPOSITION L12. The graded-simulability
    record is the closest prior art and covers a different axis (existential
    width of the answer set, not the encoding-awareness of the model). WEB SEARCH
    UNAVAILABLE this session; Shoup's bound and the standard GGM/encoding
    distinction are classical and are not claimed as novel.

  discriminated_from: >-
    NOT IDEA-20260807-413fcc, whose zero-information class this record APPLIES to
    Oracles L and G rather than re-deriving. NOT IDEA-20260807-7270d1, which
    grades simulability by the width Z of an existential answer; Oracle S's issue
    is not width but who controls the encoding. NOT IDEA-20260807-d73e83, which
    simulates the isogeny-transport oracle; that oracle takes group handles and
    IS group-determined, which is why it is closed and Oracle S is not.

  assumptions:
  - >-
    Shoup's generic group lower bound Omega(sqrt(N)) in its standard form
    [recall-confident: V. Shoup, EUROCRYPT 1997; not re-verified this session].
  - >-
    KN-FIND-b7e091 is binding and is not revisited, revised or weakened by this
    record. Its two closed oracle classes stay closed exactly as stated.
  - >-
    The encoding-aware model is stated informally here as "the adversary can
    evaluate publicly computable functions of the actual F_p-coordinates". A
    formal treatment (a curve-aware generic group model) exists in the lane as
    IDEA-20260807-1b7241 and this record does not supersede it.

  proof_search_map:
    bottleneck: >-
      For each oracle, whether a simulator exists that answers consistently
      without knowing k. That single question is the lane's whole cost.
    baseline_embedding:
      parameter_slice: >-
        The incidence and endomorphism-image oracles of KN-FIND-b7e091 are the
        boundary slice: the decision procedure must reproduce their recorded
        verdicts exactly.
      reproduction_check: >-
        Symbolic and immediate: run the two-question procedure on both and
        confirm CLOSED, with the same simulator cost the finding records
        (O(m) group operations per query for incidence; m operations for the
        endomorphism image).
    observation_collision:
      observable: The dependency signature.
      distinct_preimage_search: >-
        Deliberate: exhibit two oracles with the same signature and different
        usefulness, to establish the ceiling of the audit. The pair is Oracle S
        with pi a coordinate statistic (non-simulable, useless by the sqrt(N*M)
        identity) and a hypothetical Oracle S' with pi whose fibres are
        exponent-describable (same signature, genuinely useful). The collision is
        REAL and it is why item (iii) of the standing rule exists: the signature
        alone does not decide value.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        Recast each oracle as a formal linear form in the simulator's bookkeeping;
        an oracle expressible that way is simulable by construction.
      predicted_gain: >-
        Closure at exponent 1/2 for Oracles L and G at zero cost; no gain claimed
        for S.
    quantifier_order: >-
      For every adversary making q queries to Oracle L or G, there exists a
      simulator with identical output distribution using zero additional group
      operations -- the simulator is universal in the adversary and is
      constructed once. For Oracle S the order is reversed and that is the
      finding: for every simulator there exists an adversary (in the
      encoding-aware model) that distinguishes it, by computing pi itself and
      comparing.
    method_ceiling:
      strongest_certifiable_claim: >-
        That three named oracle classes are or are not simulable in two named
        models. It certifies NOTHING about whether a non-simulable oracle is
        useful -- that is the sqrt(N*M) identity's job -- and NOTHING about
        index calculus, which was never covered by Shoup's bound in the first
        place.
      nearby_object_control: >-
        The first-jet oracle (KN-FIND-b7e091 Oracle A): non-simulable but
        requires k, hence useless. A procedure that cannot separate "non-simulable
        and useless" from "non-simulable and dangerous" has not identified the
        load-bearing structure.
    proof_obligations:
    - claim: Oracles L and G are simulable at zero group operations.
      responsibility: correctness
    - claim: Oracle S is simulable in the pure GGM.
      responsibility: correctness
    - claim: Oracle S is not simulable in the encoding-aware model.
      responsibility: scope
    - claim: Non-simulability of S is worthless by the sqrt(N*M) identity.
      responsibility: runtime
    not_applicable_reason: null

  predictions:
  - metric: simulator_group_operations_per_query_for_oracle_L_and_G
    direction: different
    minimum_effect: >-
      EXACTLY ZERO. Any oracle in class L or G whose simulation requires a group
      operation has been misclassified and takes a group handle after all.
  - metric: distinguishing_advantage_of_the_encoding_aware_adversary_against_the_S_simulator
    direction: higher
    minimum_effect: >-
      Non-negligible, and demonstrably 1 for a single query when pi is chosen as
      the top bits of the x-coordinate: the adversary computes pi from the real
      coordinate and compares. If the advantage is negligible, Oracle S is
      simulable in both models and the scope statement in (D) is wrong.
  - metric: audit_verdicts_on_the_calibration_pair
    direction: different
    minimum_effect: >-
      CLOSED for the incidence oracle and NON-SIMULABLE-BUT-USELESS for the
      first-jet oracle. Any other pair of verdicts voids the procedure.
  - metric: fraction_of_this_session_s_fifteen_proposals_whose_oracles_are_closed
    direction: different
    minimum_effect: >-
      Predicted at least 13 of 15, since almost every object proposed this
      session is curve-only. Fewer than 13 means the session invented more
      non-simulable structure than expected and each exception must be priced
      individually.

  minimal_test:
    design: >-
      A written audit with an executable component, hours not days. For each of
      the three oracle classes: state the interface precisely, apply the
      two-question procedure, and for the simulable cases WRITE THE SIMULATOR as
      runnable code and demonstrate on 10^4 queries at toy N that its output
      distribution is identical to the real oracle's under a chi-squared test.
      For Oracle S, write the DISTINGUISHER in the encoding-aware model and
      demonstrate advantage 1 in a single query. Then apply the procedure to every
      oracle implicit in this session's other fourteen proposals and publish the
      table.
    controls:
    - >-
      The calibration pair (incidence oracle, first-jet oracle), whose verdicts
      are already recorded in KN-FIND-b7e091 and must be reproduced.
    - >-
      A PLANTED NON-SIMULABLE oracle: one that returns the top bit of k. The
      procedure must classify it as non-simulable AND dangerous; failing to do so
      means the procedure is a rubber stamp.
    - >-
      The simulators must be run against an adversary that actively tries to
      catch them, not against a passive query stream, since consistency is the
      whole difficulty.
    required_metrics:
    - per_oracle_dependency_signature
    - simulator_cost_per_query
    - chi_squared_agreement_of_simulated_versus_real_answer_distributions
    - distinguisher_advantage_in_the_encoding_aware_model
    - session_wide_oracle_audit_table

  falsification_conditions:
  - >-
    A simulator for Oracle L or G is caught by an adaptive adversary. The
    zero-information argument has a gap and IDEA-20260807-413fcc's closure needs
    revisiting, which would be a significant internal finding.
  - >-
    The planted top-bit-of-k oracle is classified as closed. The procedure is a
    rubber stamp and every verdict it has issued is void.
  - >-
    The encoding-aware distinguisher against Oracle S fails. The scope statement
    (D) is wrong and Oracle S is closed too, which would simplify the campaign
    and would be recorded as such rather than resisted.
  - >-
    An oracle from this session's other proposals is found to be non-simulable
    AND to have an exponent-describable fibre. That is the one configuration that
    would open a lane, and it must go to independent review immediately.

  confounders:
  - >-
    "Simulable" is model-relative and the campaign has used the word without
    always naming the model. The audit's first job is to name it every time, and
    a verdict without a named model is treated as unrecorded.
  - >-
    A compound oracle can be non-simulable even when its components are simulable
    if the composition reveals a relation; the composition rule stated in the
    lossy-projection paragraph is a heuristic for signatures, not a theorem about
    simulability, and compound oracles must be audited directly.
  - >-
    Passive simulation tests pass trivially; only adaptive adversaries are
    informative, and this is the most common way such a check is run wrongly.

  interpretation_limits:
  - >-
    NO ATTACK, NO EXPONENT, NO SPEEDUP; sota_delta zero; claim_tier toy for the
    executable component and theoretical for the audit.
  - >-
    This record does NOT weaken, revise or reinterpret KN-FIND-b7e091. It states
    where that finding's stated scope ends and supplies the cost argument that
    covers what lies beyond it. Any citation of this record as evidence against
    the finding is a misuse.
  - >-
    Shoup's bound never covered index calculus. Saying so is not news and is
    included because the campaign's own oracles increasingly live in that region
    and the distinction must be explicit in every verdict.
  - >-
    H-ENDO-001 used, not retested. P2 respected.

  heuristic_assumptions:
  - id: HA-1
    statement: >-
      An oracle whose answer is a deterministic function of public curve data and
      adversary-supplied field elements carries zero Shannon information about k,
      for k drawn uniformly and independently of the curve.
    rigorous_support: >-
      Rigorous, not heuristic: k is chosen independently of the curve, so any
      random variable that is a function of the curve alone is independent of k
      and their mutual information is exactly zero. It is listed as a named
      assumption because the INDEPENDENCE of k from the curve is a modelling
      choice about the instance distribution, and a deployment that derives k
      from curve data would break it.
    validation_plan: >-
      Structural, plus one empirical guard: measure the empirical mutual
      information between each label in Oracle L and k over 10^5 instances with
      the curve fixed and k resampled, with the estimator's bias floor reported.
      Predicted: indistinguishable from the estimator's floor. This is the
      campaign's canonical k-resample null (IDEA-20260807-bd5d91) applied to the
      audit's own premise rather than to a candidate leak.

  target_complexity:
    time_exponent: >-
      No exponent is claimed to move. The audit's OUTPUT is exponent statements
      about others: Oracles L and G leave the bound at Omega(sqrt(N)) exactly;
      Oracle S leaves the GGM bound intact and, in the encoding-aware model,
      costs sqrt(N*M) to exploit, which is worse than the baseline for all
      M > 1.
    memory_exponent: >-
      Simulator memory is O(q) labels for q queries, the standard GGM bookkeeping,
      identical to KN-FIND-b7e091's.
    best_known: >-
      Omega(sqrt(N)) generic lower bound (Shoup); 0.886 sqrt(N) upper bound with
      O(1) memory by parallel rho with distinguished points.
    hidden_overhead: >-
      None. The audit is a paper exercise plus a small simulator; its cost is
      measured in hours of implementation, and it is cheaper than any experiment
      it can prevent, which is the lane's stated purpose.
    tradeoff_note: >-
      Not applicable.

  dominated_by: >-
    As an attack: not an attack, hence dominated by the whole frontier --
    parallel rho at 0.886 sqrt(N) with O(1) memory (KN-TECH-001, KN-TECH-006),
    the automorphism-discounted variant (KN-TECH-018), BSGS at sqrt(N)/sqrt(N)
    (KN-TECH-031). As an audit: dominated by KN-FIND-b7e091 on the two oracle
    classes it already covers, and by IDEA-20260807-413fcc on the
    zero-information class; this record's marginal content is the three new
    classifications, the encoding-aware scope statement, and the mandatory
    M-and-cost field.
  sota_delta: >-
    Zero on every attack axis. Against the campaign's own process: it prevents
    the fourteen other proposals of this session from being run before their
    oracles are classified, which is what the binding finding requires.

  estimated_cost:
    implementation: low
    compute: low

  recommended_priority: high

  honest_prior_of_survival: >-
    0.95 that Oracles L and G audit as closed. 0.8 that the encoding-aware
    distinguisher against Oracle S works exactly as described. 0.02 that any
    oracle from this session audits as non-simulable and useful. Filed high not
    because it can discover anything but because it is a precondition on almost
    everything else this session proposes, and it costs a day.

  source_refs:
  - knowledge/findings/KN-FIND-b7e091.md (binding; the closure being scoped, not
    revisited)
  - ledger/proposals/IDEA-20260807-413fcc.yaml (zero-information oracle class)
  - ledger/proposals/IDEA-20260807-7270d1.yaml (graded simulability by width)
  - ledger/proposals/IDEA-20260807-1b7241.yaml (curve-aware generic group model)
  - ledger/proposals/IDEA-20260811-8cf53a.yaml (the sqrt(N*M) cost identity that
    covers the non-simulable case)
  - '"[recall-confident] V. Shoup, Lower bounds for discrete logarithms and
    related problems, EUROCRYPT 1997. NOT re-verified this session."'
