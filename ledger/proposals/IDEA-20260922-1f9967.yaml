idea:
  id: IDEA-20260922-1f9967
  question_id: RQ-DREG-c8ae8d
  added: '2026-09-22'
  proposed_by: idea-generator
  status: proposed
  title: Per-block new_falls on symmetry sectors, crater automorphism versus floor
  class: measurement
  claim: >-
    Representation class R1 of RQ-ECDLP-623a32 (summation coordinates, split
    into isotypic blocks), attack stage relation decomposition only. On one
    toy ordinary class, in odd characteristic not dividing m!, measure
    per-block new_falls of the Semaev system at m >= 4, not only the total
    profile. m >= 4 is the growing-degree regime; the observable is not
    prime-field m=3 d_reg. The blocks are the isotypic decomposition
    proposed in IDEA-20260916-c38e50 under permutation of the summation
    variables, plus the eigenspaces of an F_q-rational curve automorphism
    when one exists (j = 0 or j = 1728) and preserves the generators. This
    record does not prove the block sizes. Compare a crater curve that has
    such an automorphism with a floor curve in the same class. The
    pre-registered hidden-outlier reading is: the total new_falls vectors
    agree, and at least one block has first fall strictly earlier by at
    least 1. If every block agrees, symmetry does not hide an outlier on
    this pair. If the only differing block is an automorphism eigenspace
    present on the crater curve and absent on the floor curve, the effect
    is the automorphism locus, not a generic classmate. The total-profile
    locus test of IDEA-20260922-fac3e7 is not rerun.
  mechanism: >-
    Object frame. Representation: R1, the monomial basis of the m >= 4
    decomposition system, projected to isotypic components. Attack stage:
    relation decomposition only. Operation set Sigma: Macaulay
    multiplication by monomials up to one frozen cap, together with
    permutation of the summation variables, and, on the automorphism curve
    only, the linear substitution induced by that automorphism. Sigma is
    not the translation action. Trichotomy class of IDEA-20260806-c5d183:
    coordinate-dependent, because an isotypic label is a function of the
    presentation and of the chosen action on coordinates, not of a group
    element. The projection discards every component but one. A single
    block does not determine the polynomial or the curve, so the projection
    is lossy. Block sizes are taken from IDEA-20260916-c38e50 as a cited
    proposal. They are not re-derived here. The first check is numerical:
    on one finished matrix, the block ranks recombine to the monolithic
    rank by the rule that proposal states. If they do not, the
    implementation is void and no crater-versus-floor reading is issued.
    The total new_falls vector is stored only as the sum control. It is
    not the locus comparison of IDEA-20260922-fac3e7. An automorphism that
    is not defined over F_q is labeled geometric and is not used. A matrix
    that does not finish is unmeasured.
  novelty_status: unverified
  citations:
    - ref: IDEA-20260916-c38e50
      provenance: internal
      claim: >-
        Proposes that the Macaulay matrix of a symmetric decomposition
        system is equivariant for the permutation action, and that the
        rank is a sum of isotypic block ranks, when the characteristic
        does not divide m!. This proposal uses that decomposition as a
        cited procedure and does not prove the block sizes.
      verified_by: idea-generator, claim and object-frame mechanism read 2026-09-22
    - ref: IDEA-20260916-4b7c1e
      provenance: internal
      claim: >-
        Defines new_falls. Per-block new_falls is that identity applied
        to each block. The definition is not restated.
      verified_by: idea-generator, lines 1-100 read 2026-09-22
    - ref: IDEA-20260922-fac3e7
      provenance: internal
      claim: >-
        Measures the total new_falls profile on a special-model locus
        against a generic classmate. This record does not repeat that
        total-profile test.
      verified_by: idea-generator, claim and mechanism opening read 2026-09-22
    - ref: RQ-DREG-c8ae8d
      provenance: internal
      claim: >-
        O2 is variation only on a named locus. An automorphism-only block
        gap is a candidate for that locus reading and is not an off-locus
        outlier.
      verified_by: idea-generator, full file read 2026-09-22
    - ref: RQ-DREG-d7b6d6
      provenance: internal
      claim: >-
        Forbids the prime-field m=3 screen. The system here is Semaev
        m >= 4 in odd characteristic not dividing m!.
      verified_by: idea-generator, full file read 2026-09-22
    - ref: IDEA-20260806-c5d183
      provenance: internal
      claim: Coordinate-dependent trichotomy class.
      verified_by: idea-generator, lines 1-70 read 2026-09-22
    - ref: RQ-ECDLP-623a32
      provenance: internal
      claim: R1 field representation of coordinates. Stage is relation decomposition.
      verified_by: idea-generator, title and scope opening read 2026-09-22
  assumptions:
    - Characteristic does not divide m!, and m >= 4. Otherwise the permutation blocks are out of scope.
    - The automorphism block is used only when the automorphism is F_q-rational and preserves every generator.
    - One frozen cap and one frozen monomial order on both curves.
  proof_search_map:
    bottleneck: >-
      A fall that sits in one isotypic block and is invisible in the
      total new_falls vector. The block dimensions are not the claim.
    baseline_embedding:
      parameter_slice: >-
        The monolithic new_falls profile of IDEA-20260916-4b7c1e on one
        finished matrix, which the blocks must recombine to.
      reproduction_check: >-
        Sum of the block contributions, weighted as IDEA-20260916-c38e50
        states, equals the monolithic new_falls at every completed degree.
        Disagreement voids the run. This check does not prove the weights.
    observation_collision:
      observable: >-
        The tuple of per-block new_falls vectors, with the total vector
        kept as their recombination.
      distinct_preimage_search: >-
        The crater curve and the floor curve can share the total vector
        and differ in one block. That collision of totals is the
        hidden-outlier reading. Sharing every block is the match reading.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          The per-block new_falls tuple, which refines the total profile.
        predicted_gain: >-
          Detects a first-fall gap of at least 1 in one block when the
          totals agree. No ECDLP exponent gain. No claim about block size.
    quantifier_order: >-
      Match: for all blocks, the finished new_falls vectors of the crater
      curve and the floor curve agree. Hidden outlier: the totals agree,
      and there exists a block whose first fall is strictly earlier by at
      least 1. Automorphism-only: the only block that differs is an
      automorphism eigenspace of the crater curve. Incomplete matrices and
      a failed recombination check sit outside all three quantifiers.
    method_ceiling:
      strongest_certifiable_claim: >-
        On this pair, either some block separates the curves while the
        total does not, or every block matches, or only the automorphism
        block differs. Not a theorem about representation dimensions.
      nearby_object_control: >-
        The gauge orbit of the crater j. A block gap that appears between
        gauge models of one j is a coordinate artifact. A floor curve
        whose total profile is the whole comparison is the test this
        record refuses to rerun.
    proof_obligations:
      - claim: >-
          Block sizes are not reported as proved. A reading is issued only
          after the recombination check matches the monolithic rank.
        responsibility: correctness
    not_applicable_reason: null
  predictions:
    - metric: block_first_fall_gap_with_matching_total
      direction: lower
      minimum_effect: >-
        Total new_falls vectors have Hamming distance 0, and at least one
        block has first fall at least 1 earlier on one of the two curves,
        both profiles finished.
    - metric: all_blocks_agree
      direction: lower
      minimum_effect: >-
        Every finished block's new_falls vector agrees between the crater
        curve and the floor curve. That reading means symmetry does not
        hide an outlier on this pair.
  minimal_test:
    design: >-
      Select one toy ordinary class in odd characteristic, with m >= 4 and
      m! coprime to the characteristic, containing a crater curve with an
      F_q-rational extra automorphism and a floor curve in that class. If
      no such pair is in the toy range, record the cell unmeasured rather
      than substituting a generic classmate. Build the permutation blocks
      by the cited procedure. On one finished matrix, check recombination
      against the monolithic new_falls. Then compare per-block new_falls.
      Record the total vectors only to test whether they match. Run the
      gauge orbit of the crater j. Assign hidden-outlier, match,
      automorphism-only, artifact, or unmeasured.
    controls:
      - Recombination against the monolithic profile on one finished matrix.
      - Gauge orbit of the crater j.
      - Total vectors stored as a sum control, not as a locus verdict.
      - Geometric automorphisms excluded and labeled.
    required_metrics:
      - per-block new_falls on both curves, finished degrees only
      - total new_falls Hamming distance
      - earliest block first-fall gap
      - recombination residual
      - which reading was assigned
  falsification_conditions:
    - >-
      Recombination fails on the fixture matrix. The block implementation
      is void and no reading is issued.
    - >-
      Every block agrees. Symmetry does not hide an outlier on this pair.
      That is a completed measurement.
    - >-
      The only differing block is an automorphism eigenspace. The effect
      is the automorphism locus, not a generic classmate.
    - >-
      A block gap appears inside the gauge orbit. It is a coordinate
      artifact.
    - >-
      A reading is issued from an unfinished block. That reading is
      withdrawn.
  confounders:
    - Characteristic dividing m!, where the cited decomposition does not apply.
    - Using a geometric automorphism as if it were F_q-rational.
    - Treating the total-profile comparison as the result, which is the fac3e7 test.
    - Quoting block dimensions from IDEA-20260916-c38e50 as proved.
    - Different caps on the crater curve and the floor curve.
  interpretation_limits:
    - >-
      A hidden-outlier reading is a presentation fact about two curves.
      It is not outcome O3, and it still requires IDEA-20260922-f7de2a
      before any real gap is accepted. This record does not run that gate.
    - Toy tier only. Block sizes are not a theorem of this proposal.
    - >-
      A flat block profile inside the cap does not prove the solving
      degree is small above the cap, and it is not the Petit-Quisquater
      first-fall assumption.
    - >-
      ECDLP time exponent stays N^{1/2} and rho memory stays O(1). The
      walk from the floor to the crater is uncharged until an accepted
      outlier exists. This proposal does not accept one.
  heuristic_assumptions:
    - id: H1
      statement: >-
        When the characteristic does not divide m!, the finished monolithic
        new_falls vector equals the recombination of the per-block
        new_falls vectors by the rule stated in IDEA-20260916-c38e50. A
        block may have an earlier first fall while the totals agree. The
        second sentence is the reading under test, not a distributional
        assumption. Neither sentence equates a block fall with the solving
        degree above the cap.
      rigorous_support: >-
        Semisimplicity of the group algebra when the characteristic does
        not divide the group order is recalled (Maschke) and was not
        opened. The block-size formulas in IDEA-20260916-c38e50 were read
        as a proposal and are not the support of H1. The support actually
        used is the recombination check on the fixture matrix.
      validation_plan: >-
        On one finished m >= 4 matrix in odd characteristic not dividing
        m!, compare the recombined block profile with the monolithic
        new_falls at every completed degree. Parameters: the field order,
        m, the cap, and the partition labels that were computed, not a
        table of dimensions copied from the cited proposal. A residual of
        at least 1 voids H1 on that matrix. Tail check: degrees that do
        not finish are omitted from the sum, not filled with zeros. No
        cryptographic transfer.
  target_complexity:
    time_exponent: >-
      N^{1/2} for the ECDLP, Pollard rho. No improvement is claimed.
    memory_exponent: >-
      O(1) for rho. The meter stores one capped matrix, split into blocks.
    best_known: Pollard rho, time N^{1/2}, memory O(1), for the ECDLP.
    hidden_overhead: >-
      No attack exponent is claimed. IDEA-20260916-c38e50 states a
      measurement-cost factor from block sizes; this record does not adopt
      that factor. The walk is uncharged.
    tradeoff_note: >-
      Two curves, one cap. Not a van Oorschot-Wiener tradeoff and it does
      not change rho.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
  dominated_by: >-
    As an ECDLP attack, Pollard rho dominates on time (N^{1/2}), memory
    (O(1)), and queries (one instance). No attack is claimed. As an
    instrument, the opened rows were checked. IDEA-20260916-c38e50 already
    proposes the block decomposition and a per-block fall; it dominates
    any claim to have introduced that decomposition. It does not compare a
    crater automorphism curve with a floor curve. IDEA-20260922-fac3e7
    dominates the total-profile locus comparison, which this record does
    not repeat. On the per-block crater-versus-floor contrast, the opened
    rows do not dominate. Not checked against every published algorithm.
  sota_delta: >-
    ECDLP time-exponent delta 0 (remains 1/2). ECDLP memory-exponent
    delta 0. Query delta 0. The measurement adds a per-block comparison
    of two curves and no attack cost.
  discriminated_from:
    - >-
      IDEA-20260922-805a59 compares total new_falls across a class. A
      matching total is exactly the case this record looks inside.
    - >-
      IDEA-20260922-221a70 compares a rebuilt system with a pullback.
      Neither side is an isotypic block.
    - >-
      IDEA-20260922-fac3e7 is the total-profile comparison of a
      special-model locus with a generic classmate. This record does not
      rerun it. The total vector is only the sum control.
    - >-
      IDEA-20260922-f7de2a certifies a scalar gap by a syzygy. A block
      gap here is not submitted to that gate.
    - >-
      IDEA-20260922-f1e5b7 censuses last-fall and solving degree on a
      chained ladder. It does not split a matrix into symmetry sectors.
    - >-
      IDEA-20260922-9d808c varies linear substitutions of
      Weil-restriction coordinates. The substitutions here are the
      permutation action and, when present, a curve automorphism.
    - >-
      IDEA-20260922-881df9 attributes a gap to class, trace, or support.
      This record asks whether a gap sits in one block while the total
      matches.
    - >-
      IDEA-20260922-469f79 compares a graph ideal with a native ideal.
      No graph ideal is built here.
    - >-
      IDEA-20260807-f6137c says there is no true d_reg meter. Per-block
      new_falls is not that meter.
    - >-
      IDEA-20260916-4b7c1e defines new_falls. This record applies it per
      block and does not redefine it.
    - >-
      IDEA-20260731-016 screens total algebraic meters for a heavy tail.
      A block gap with a matching total would be invisible to that screen.
      This record does not claim such a gap exists.
