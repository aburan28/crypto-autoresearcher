idea:
  id: IDEA-20260815-0902c7
  question_id: RQ-MODEL-e61cb2
  added: '2026-08-15'
  title: >-
    COST MODELS IN THIS CAMPAIGN ARE STATED PER RECORD AND NEVER RECONCILED:
    extract every cost model in the ECC corpus and check whether any two
    records that get compared are using the same one
  class: control

  claim: >-
    Charged comparisons require both sides under one cost model. This corpus
    states cost models per record, in prose, at varying precision. Whether
    any two records that later get compared actually share a model is
    unchecked, and a comparison across two different models is not a
    comparison at all. Extracting and reconciling them is mechanical.

  mechanism: >-
    Extract each ECC record's stated cost model into a structured form: what
    is counted, at what unit cost, what is charged and what is omitted.
    Identify records that are compared to each other and check model
    compatibility.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Grep 'cost model' across the ECC corpus; read of GOAL-ICEX-001's
      full-charging constraint and RQ-MODEL-e61cb2.
    results: >-
      Cost models are stated per record and the charging constraint is
      program policy; no record extracts and reconciles them across the
      corpus.
    verdict: >-
      ADAPTATION. Model reconciliation is elementary; the contribution is
      doing it before the campaign's charged comparisons rely on
      compatibility nobody checked.

  object_first_candidate:
    tracked_object: >-
      EACH RECORD'S COST MODEL, in a structured form that makes
      compatibility checkable.
    lossiness: >-
      Stating a cost model in prose makes it unreconcilable, which is
      exactly why the extraction is structured.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while records state their models; records that do not are
      the reconciliation's key entries and cannot be compared to anything.

  null_object_control: >-
    NULL 1 -- a record compared with itself, which must be compatible. NULL
    2 -- two records known to use different models, which must be flagged
    incompatible; a reconciliation calling everything compatible checks
    nothing.

  discriminated_from:
    - >-
        The paired-instance design record in this series, which requires
        shared instances; this requires a shared cost model, and a
        comparison needs both.
    - >-
        The portable-operation-count record, which proposes a machine-
        independent unit; this checks whether records agree on what is
        counted at all, which is upstream of that.

  assumptions:
    - >-
        Records state cost models explicitly enough to extract; those that
        do not are listed as unreconcilable.
    - >-
        Compatibility is decidable from the extracted fields, which holds
        when the models differ in what they charge and is harder when they
        differ in unit cost.

  predictions:
    - metric: >-
        self-comparison null
      direction: different
      minimum_effect: >-
        FORCED compatible.
    - metric: >-
        known-different-models null
      direction: different
      minimum_effect: >-
        FORCED flagged incompatible.
    - metric: >-
        count of comparison pairs using incompatible models
      direction: different
      minimum_effect: >-
        The deliverable; each is a comparison that does not mean what it
        appears to.
    - metric: >-
        count of records stating no cost model
      direction: different
      minimum_effect: >-
        Reported separately; these cannot participate in any charged
        comparison and their use in one is a contract gap.

  minimal_test:
    design: >-
      Extraction across the ECC corpus's costed records, both nulls first.
    controls:
      - >-
          Self-comparison and known-different nulls.
      - >-
          Structured extraction with the source text quoted per field.
      - >-
          Records stating no model listed rather than assumed
          compatible.
    required_metrics:
      - >-
          Structured cost model per record with quoted source text.
      - >-
          Compatibility verdict per comparison pair.
      - >-
          Counts of incompatible pairs and model-less records.

  falsification_conditions:
    - >-
        A null misbehaves. The compatibility criterion is wrong.
    - >-
        Several comparison pairs are incompatible. Those comparisons do
        not mean what they appear to and must be redone or withdrawn,
        which is the record's payoff.
    - >-
        Most records state no cost model. The corpus cannot support
        charged comparison at all, which is a serious process finding.
    - >-
        All pairs are compatible. The campaign's charged comparisons rest
        on shared models, which is worth establishing since it is
        currently assumed.

  confounders:
    - >-
        PROSE EXTRACTION: cost models stated in prose require judgement to
        structure, and a charitable reading could make incompatible models
        look compatible.
    - >-
        OMISSION VERSUS EXCLUSION: a model that does not mention memory
        may be omitting it or deliberately excluding it, and the two have
        different consequences for compatibility.

  interpretation_limits:
    - >-
        Reconciles stated models; makes no judgement about which model is
        correct.
    - >-
        Scoped to records that state a model.
    - >-
        Incompatibility means a comparison is not well posed, not that
        either record is wrong.

  heuristic_assumptions:
    - id: HEUR-MODEL-1
      statement: >-
        Two cost models are compatible for comparison purposes exactly
        when they count the same operations at the same relative unit
        costs and charge the same resources.
      rigorous_support: >-
        Rigorous ingredient: a comparison of two costs is meaningful
        when both are expressed in the same units over the same charged
        resources, which is definitional. THE GAP: models can differ in
        unit cost while remaining comparable up to a constant, and
        whether a constant-factor difference matters depends on whether
        the comparison is about exponents or about concrete costs -- so
        compatibility is not a single predicate and must be assessed
        against what the comparison claims.
      falsification_condition: >-
        A comparison pair flagged incompatible whose difference is a
        constant factor irrelevant to an exponent claim.
      validation_plan: >-
        SAMPLE: every comparison pair in the corpus. COMPARISON:
        compatibility assessed against what each comparison actually
        claims. TAIL CHECK: pairs differing only by unit cost, reported
        separately from those differing in what is charged. TRANSFER:
        none; the reconciliation describes this corpus.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Symbolic extraction across the corpus.
    memory_exponent: >-
      Negligible.
    best_known: >-
      No incumbent reconciliation exists; cost models are stated per
      record and the charging constraint is policy rather than a check.
    hidden_overhead: >-
      Prose models require judgement to structure, and the extraction is
      only as good as that judgement, which is recorded per field.
    tradeoff_note: >-
      Structured extraction makes compatibility checkable and costs
      judgement in the reading; prose models are easy to write and
      impossible to reconcile.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As cost modelling: nothing new is proposed.
    As a corpus-wide reconciliation: none exists here. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: structured cost models
    extracted across the ECC corpus with source text quoted, a compatibility
    verdict for every comparison pair, and counts of incompatible
    comparisons and of records that state no model at all.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.5 that enough records state models explicitly for the reconciliation
    to cover the corpus's comparisons. 0.8 that the nulls calibrate. 0.5
    that at least one comparison pair turns out incompatible, which would
    mean a recorded comparison does not mean what it appears to.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
