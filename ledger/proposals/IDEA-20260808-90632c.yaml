idea:
  id: IDEA-20260808-90632c
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-MLKEM-001
  goal_id: GOAL-MLKEM-005
  title: 'The Beta law for the projected-error ratio fails ONLY through the excess kurtosis
    of CBD, and only where the reduced basis'' tail block is coordinate-aligned — so GOAL-MLKEM-005''s
    C3 has a forced, signed, closed-form answer: the left tail is THINNER than Beta by a factor
    set by Var(e^2), and best-of-M gains less than the frozen model says.'
  class: mechanism
  claim: 'Let e be an ML-KEM error vector with i.i.d. CBD(eta) coordinates, d the lattice
    dimension, beta the block size, and R = ||pi_{d-beta}(e)||^2 / ||e||^2 the statistic GOAL-MLKEM-005
    tracks. Then: (1) if the last beta Gram-Schmidt directions of the BKZ-reduced q-ary basis
    span a subspace in GENERAL POSITION with respect to the coordinate axes, R is Beta(beta/2,
    (d-beta)/2) to within O(1/d) REGARDLESS of the coordinate law, by concentration of the
    projection of an isotropic vector; (2) if instead that subspace is COORDINATE-ALIGNED
    — which is exactly what the Z-shape produces, because the tail of a reduced q-ary profile
    consists of untouched unit vectors — then R is the self-normalised sum (sum_{i in S} e_i^2)/(sum_i
    e_i^2) with |S| = beta, whose law is Beta ONLY for Gaussian coordinates; (3) for CBD(eta
    = 2), E[e^2] = 1 and E[e^4] = 5/2, so Var(e^2) = 3/2 against the Gaussian value 2, and
    the standard deviation of R is smaller than the Beta prediction by the exact factor sqrt(3/4)
    = 0.8660, uniformly in beta and d at leading order. CONSEQUENCE, and this is the falsifiable
    part: the best-of-M reduction in block size that GOAL-MLKEM-005''s ceiling formula computes
    from a Beta left tail is OVERSTATED by a factor 0.866 + O(1/sqrt(beta)) in the deviation
    term, so the goal''s own C1 bound must be multiplied by 0.866 in its sqrt(ln M) term wherever
    the tail block is coordinate-aligned, and by 1 where it is not.'
  mechanism: 'Two independent facts compose. FIRST, an exact distributional fact: for a Gaussian
    vector, the squared-norm fraction captured by ANY fixed beta-dimensional subspace is exactly
    Beta(beta/2, (d-beta)/2); for a non-Gaussian isotropic vector, that is true only after
    averaging over a Haar subspace, and for a FIXED coordinate subspace it is false, with
    the leading correction governed by the fourth cumulant of the coordinate law. SECOND,
    a structural fact about q-ary lattices: a BKZ-reduced basis of Lambda_q(A) = {(x,y) :
    y = A x mod q} in Hermite normal form has the Z-shape — the first n_q Gram-Schmidt vectors
    retain norm q (untouched q-vectors) and the last n_1 retain norm 1 (untouched unit vectors
    of the identity block), with a GSA-sloped middle. For beta <= n_1 the projector pi_{d-beta}
    is, up to the sloped region''s leakage, the restriction to beta COORDINATES. So the two
    facts meet precisely in the regime the campaign has been measuring. The signed prediction
    follows from CBD''s platykurticity: CBD(eta) is a centred Binomial(2 eta, 1/2), whose
    excess kurtosis is -1/eta (for eta = 2, -1/2), so its square has strictly smaller variance
    than a Gaussian of the same variance and the ratio R concentrates MORE tightly. A thinner
    left tail means fewer unusually-easy targets, so the selection mechanism the goal is bounding
    gains LESS. The mechanism also predicts WHERE the Beta law is restored: as beta grows
    past n_1 the projector picks up sloped directions that are generic combinations of many
    coordinates, and by a Berry-Esseen argument on the projection coefficients the effective
    law returns to Beta at rate O(1/sqrt(beta - n_1)). That is a graded, monotone, single-knob
    prediction — exactly the instrument shape the campaign''s three failed adjudications have
    been missing.'
  why_not_a_renamed_known_approach: 'Nearest known method: the campaign''s own frozen sensitivity
    demonstration and the Beta(beta/2,(d-beta)/2) forced-value derivation that VAL-20260806-bb0559
    re-derived bit-exactly (per the GOAL-MLKEM-005 batch log). That work computes and verifies
    mu_0 = E[R] = beta/d and its Monte-Carlo agreement. It does not distinguish the two regimes
    above, and it CANNOT: the goal record itself notes "E[R] = beta/d is forced for every
    basis, reduced or not", so the mean is blind to the effect. My claim is about the SECOND
    and FOURTH moments and about a structural switch (coordinate alignment) that the frozen
    design never varied. Nearest catalogue entry: M1-1 tracks the Z-shape signature (n_q,
    n_1) and uses it to displace the optimal sample count m; it does not connect the Z-shape
    to the law of R. IDEA-20260805-2b94fe replaces the Gaussian error model by the exact CBD
    law inside a SCORING functional; M1-4 bounds that at under 0.3 core-SVP bits. Mine is
    not a scoring change: it is a change to the DISPERSION of the selection statistic, which
    enters the goal''s ceiling through sqrt(ln M) and not through the score.'
  predictions:
  - observable: Sample standard deviation of R over independent CBD error draws against ONE
      fixed BKZ-reduced q-ary basis, computed separately for beta below and above the measured
      n_1 of that basis.
    metric: Ratio rho_sd = sd_empirical(R) / sd_Beta(beta/2,(d-beta)/2), reported with its
      own standard error from the draw count.
    predicted: rho_sd = 0.866 +/- 0.01 for beta well below n_1 (eta = 2 error); rho_sd ->
      1.000 as beta grows past n_1, monotonically, with the crossing located at beta = n_1
      predicted IN ADVANCE from the basis profile alone. A flat rho_sd across the whole beta
      range falsifies the mechanism.
  - observable: The same ratio computed for a CONTINUOUS Gaussian error of matched variance
      against the same basis.
    metric: rho_sd for the Gaussian arm.
    predicted: 'rho_sd = 1.000 +/- 0.01 at EVERY beta, including beta << n_1. This is the
      control that separates "coordinate alignment" from "non-Gaussianity": the effect requires
      both, so the Gaussian arm must show nothing.'
  - observable: Empirical left-tail quantile of R at the 10^-3 and 10^-4 levels.
    metric: q_emp(alpha) / q_Beta(alpha) for alpha in {10^-3, 10^-4}.
    predicted: Strictly greater than 1 (the empirical tail is HIGHER, i.e. less extreme, than
      Beta) for beta << n_1, by an amount consistent with a Cornish-Fisher expansion carrying
      the -1/eta excess kurtosis. If the empirical tail is LOWER than Beta, the sign of my
      prediction is wrong and the mechanism is falsified in its most consequential direction.
  - observable: The best-of-M gain G computed from the empirical tail versus from the Beta
      tail, at M in {2^4, 2^8, 2^12}.
    metric: Delta G = G_Beta - G_empirical, in core-SVP bits under one NAMED cost model, with
      the f'' sensitivity table the goal's C1 requires printed beside it.
    predicted: Delta G > 0 (Beta overstates the gain), with Delta G / G approximately 1 -
      0.866 = 0.134 in the deviation term. Delta G <= 0 falsifies.
  minimal_test: 'NO NEW BKZ IS REQUIRED, which is the whole point: GOAL-MLKEM-005''s next_action
    records that the graded arms are pure numpy and the seeds are cached at 32/32 with max
    deviation 0.0. (1) Take the ALREADY-COMMITTED reduced bases. (2) Extract each basis''
    Gram-Schmidt profile and read off n_q and n_1 by the standard Z-shape break-point rule;
    PRE-REGISTER the predicted crossing beta = n_1 before any R is computed. (3) Draw N =
    10^6 independent CBD(eta) vectors and N Gaussian vectors of matched variance; compute
    R at a grid of beta straddling n_1. (4) Report rho_sd and the tail-quantile ratios per
    arm and per beta. (5) The adjudication is the SHAPE of rho_sd(beta) against the pre-registered
    crossing, not any single cell — which is what makes it immune to the multiplicity problem
    that made the frozen G3 fail a correct instrument about nine times in ten.'
  controls:
  - 'GAUSSIAN NULL ARM (mandatory, same basis, same projector, same code path): the effect
    must VANISH. This is the null object of the same shape the inventor protocol requires,
    and it removes exactly the property under study (non-Gaussianity) while leaving the projector
    untouched — which is the specific defect RT-20260806-d008e0 found in the frozen design,
    where the null removed the projector instead.'
  - 'COORDINATE-DESTROYING ARM: replace the basis by O B for a Haar-random orthogonal O (an
    ambient isometry). R''s law must revert to Beta for BOTH arms, because the projector is
    no longer coordinate-aligned. This also discharges AM-4''s isometry requirement by construction:
    the statistic is NOT invariant under ambient isometry, and that non-invariance is the
    claimed mechanism rather than a defect — stated up front so it cannot be mistaken for
    the P3 failure mode recorded in DEC-20260806-14ac13.'
  - 'UNREDUCED-BASIS ARM: the same computation on the raw HNF basis, where the tail is entirely
    unit vectors. Predicted rho_sd = 0.866 across all beta and no crossing — the extreme of
    the graded family, with an analytically known answer.'
  - 'MOMENT AUDIT: E[R] must equal beta/d in every arm to machine precision. If it does not,
    the pipeline is broken. This is a known-answer gate, not a finding.'
  confounders:
  - The Z-shape break-points n_q and n_1 are not sharp; the profile transitions over a few
    indices. A crossing located within that transition width is not a confirmation. Pre-register
    the transition width from the profile and require the crossing to be resolved against
    it.
  - At beta close to d the Beta distribution degenerates and sd ratios become unstable. Restrict
    the grid to beta in [0.05 d, 0.6 d] and say so before running.
  - ML-KEM's error is CBD(eta_2 = 2) but the SECRET is CBD(eta_1) with eta_1 = 3 at ML-KEM-512.
    If the embedded target mixes s and e coordinates, the effective kurtosis is a mixture
    and the predicted factor is not 0.866 but a stated weighted value. Compute the mixture
    factor from the exact embedding BEFORE running, and report which coordinates carry which
    law.
  - Compression noise enters the ciphertext target and is neither CBD nor Gaussian. If the
    tested target is a ciphertext rather than a raw error, the predicted factor changes and
    must be recomputed from the compression fibre law. Declare which target is used.
  falsification_conditions:
  - rho_sd is 1.000 +/- 0.01 for the CBD arm at beta << n_1 — the coordinate alignment does
    not transmit the kurtosis and the mechanism is dead.
  - rho_sd is 0.866 for the GAUSSIAN arm too — then whatever is being measured is not non-Gaussianity,
    and the whole interpretation is void regardless of the CBD arm.
  - rho_sd shows no monotone crossing at beta = n_1 but instead varies erratically — the Z-shape
    is not the switch, and the mechanism's structural half is falsified even if the moment
    half survives.
  - The left-tail quantile ratio is BELOW 1, i.e. the empirical tail is more extreme than
    Beta. That would mean best-of-M gains MORE than the frozen model says, which reverses
    the sign of the goal's C1 correction and is the outcome most worth knowing.
  interpretation_limits: 'This is TOY-tier in dimension: the committed bases are far below
    FIPS 203 dimensions and rho_sd''s crossing location depends on n_1, which depends on (d,
    k, q, m). The MOMENT half of the claim (the 0.866 factor) is however EXACT and dimension-free
    — it is a statement about Var(e^2) for CBD(2) versus a Gaussian, provable in two lines,
    and it transfers to FIPS 203 parameters as an arithmetic identity, not as an extrapolation.
    Separate the two tiers in any record: the identity is derivation-tier; the crossing behaviour
    is toy-tier. Nothing here is an attack on ML-KEM and nothing here changes any block size
    on its own; it changes a CORRECTION FACTOR inside a bound the campaign is already committed
    to computing.'
  assumptions:
  - 'ML-KEM error coordinates are i.i.d. CBD(eta) as specified in FIPS 203 (RECALLED: eta_1
    in {3,2,2}, eta_2 = 2 across ML-KEM-512/768/1024). Must be re-read from primary text before
    the run.'
  - The committed BKZ-reduced bases exhibit a measurable Z-shape with an identifiable n_1
    > 0. If they do not (fully reduced, no untouched tail), the structural half of the test
    is not runnable on them and a basis with a deliberate Z-shape must be constructed — which
    is cheap and should be declared as a design choice, not discovered mid-run.
  heuristic_assumptions:
  - id: HA-1
    statement: For a BKZ-beta-reduced basis of a q-ary lattice in Hermite normal form, the
      last n_1 Gram-Schmidt directions have squared overlap with the coordinate axes exceeding
      1 - c/beta for an absolute constant c, uniformly over random A and over d in the tested
      range.
    rigorous_ingredient: 'The Z-shape itself is not heuristic in its extremes: the identity
      block of the HNF basis supplies unit vectors that BKZ at block size beta provably cannot
      touch once they lie outside every processed window, and the determinant identity prod
      ||b*_i|| = q^m pins the total mass. What is heuristic is the SHARPNESS of the transition,
      not the existence of the two plateaus.'
    distribution_imitated: The classical statement it imitates is the Geometric Series Assumption
      plus its documented head/tail deviation (KN-TECH-041, which records the tail as "well
      enough understood to be simulated separately"). HA-1 asks only that the tail plateau
      be coordinate-aligned, which is the strongest form of that documented deviation.
    validation_route: 'Directly measurable on the committed bases at zero extra cost: compute
      sum_{i in tail} <e_j, b*_i/||b*_i||>^2 for each coordinate j and report the distribution
      of overlaps. Predicted: bimodal, with beta coordinates near 1 and the rest near 0. TOY
      SCALE (the committed dimensions), labelled as such. There is no shortcut that samples
      a FIPS-203-dimension reduced basis, and I claim none; the transfer argument to FIPS
      203 is that the HNF identity block exists at every dimension, which is structural, not
      statistical.'
    tail_checks: Report the WORST overlap in the tail block, not the mean. A single tail direction
      that is a generic combination breaks the coordinate-restriction picture for the quantiles
      even if the mean overlap is high.
  - id: HA-2
    statement: The self-normalised ratio R = sum_{i in S} e_i^2 / sum_i e_i^2 with |S| = beta
      and i.i.d. CBD coordinates admits an Edgeworth expansion in which the leading correction
      to the Beta law is proportional to the fourth cumulant of e^2, uniformly for beta, d
      - beta -> infinity with beta/d bounded away from 0 and 1.
    rigorous_ingredient: 'Exact finite-sample moments: E[e^2] = eta/2 and E[e^4] are exact
      rational numbers for CBD(eta) (for eta = 2, E[e^2] = 1, E[e^4] = 5/2), so Var(sum_{i
      in S} e_i^2) = beta * Var(e^2) is exact with no heuristic at all. The only heuristic
      content is that the RATIO''s law is governed at leading order by these two moments.'
    distribution_imitated: The classical Edgeworth/Cornish-Fisher expansion for self-normalised
      sums, whose Gaussian-limit case is exactly the Beta law.
    validation_route: 'Direct: compare the empirical law of R at N = 10^6 against (a) Beta
      and (b) the Edgeworth-corrected Beta, by Kolmogorov distance and by the two pre-declared
      tail quantiles. The exact convolution of beta CBD squares is also computable by dynamic
      programming for beta <= a few hundred, giving an EXACT reference law rather than an
      expansion — do that where feasible and use the expansion only above it. Toy scale in
      beta; exact in law.'
    tail_checks: The 10^-4 quantile with N = 10^6 draws rests on ~100 order statistics; per
      KN-FIND-031 the lowest resolvable nonzero survival value is 1/N, so do NOT report a
      10^-6 quantile from 10^6 draws. Where the exact convolution is available, compare tails
      against it instead of against the sample.
  target_complexity:
    time_exponent: 'NOT AN ATTACK AND MOVES NO EXPONENT. This is a signed correction factor
      of 0.866 on the deviation term of a bound that the goal record already proves is capped
      by G <= log2 M. Its effect on the attack exponent is exactly zero. Stated bluntly because
      the brief requires it: this is a BUILDING BLOCK, and its justification for priority
      is that it is the mechanism underneath the one completion criterion (C3) that three
      consecutive batches failed to adjudicate.'
    memory_exponent: Unchanged; the correction is to a statistic, not to a data structure.
    best_known_baseline: The campaign's own frozen Beta(beta/2, (d-beta)/2) forced-value derivation,
      re-derived bit-exactly by VAL-20260806-bb0559 and Monte-Carlo checked at 20,000 frames.
    hidden_overhead_disclosure: The 0.866 factor is leading-order in 1/sqrt(beta); at small
      beta the exact convolution differs and the factor is not constant. Do not quote 0.866
      at beta < 30 without the exact reference law.
    time_memory_tradeoff: Not applicable; no search is proposed.
  sota_delta: 'Zero against any attack. Against the campaign''s own instrument: it supplies
    a mechanism where the record currently has three adjudications of INSTRUMENT DEFECT and
    no mechanism, and it converts C3 from "does the Beta tail law hold" into a two-regime
    prediction with a pre-registered crossing, which is a question an instrument can pass
    or fail rather than one it can only fail.'
  dominated_by: 'n/a (no attack-cost result claimed). Pareto check performed anyway on the
    instrument axis: no committed record in GOAL-MLKEM-005 (BATCH-a51f91, BATCH-436ddd, BATCH-f19c37)
    produces a signed, closed-form prediction for the DISPERSION of R, so nothing in the campaign
    dominates it as an instrument either. The frozen derivation dominates it on the MEAN,
    which is why the mean is excluded from the deliverable.'
  estimated_cost: 'Implementation: low. Pure numpy on already-committed bases plus an exact
    dynamic-programming convolution for the reference law. Maybe 250 lines. Compute: low.
    Under an hour on one core for N = 10^6 at a dozen beta values. No BKZ.'
  recommended_priority: high
  honest_prior_of_survival: P(the 0.866 moment identity is arithmetically correct) ~ 0.97
    — it is a two-line computation from the CBD fourth moment and the only risk is that the
    embedded target's coordinates are not pure CBD(2). P(the tail block of the committed bases
    is coordinate-aligned enough for the effect to appear) ~ 0.6 — this is HA-1 and it is
    the real risk; a heavily reduced basis may have no untouched tail. P(the crossing at beta
    = n_1 is resolved as predicted) ~ 0.45. P(the whole two-regime picture survives the Gaussian
    and isometry controls) ~ 0.4. The expected information is high even in the negative branch,
    because a flat rho_sd with a coordinate-aligned tail would say the Beta law is more robust
    than the moment argument allows, which is itself a finding about the statistic.
  novelty_status: unverified
  novelty_screen: 'Corpus screened: EXISTING_PROPOSALS.txt (all RQ-MLKEM-001 and -003 rows,
    in particular IDEA-20260805-3d71ca, -2b94fe, -530869, -574cd0, -cd6e1e, -e805b6, -20260807-05e12c),
    EXISTING_HYPOTHESES.txt (H-MLKEM-dc51f5, -0c0a6e, -fef5ae, -11aabf), CATALOGUE_TITLES.txt
    (M1-1 through M1-10, M2-1 through M2-10, B3, B9), KNOWLEDGE_BARRIERS.txt, ledger/goals/GOAL-MLKEM-005.yaml
    in full, and knowledge/techniques/KN-TECH-041.md in full. WEB SCREEN NOT PERFORMED (tool
    failure). The relevant external prior-art risk is the literature on non-Gaussian LWE error
    in primal-attack success conditions, which I could not check.'
  discriminated_from: IDEA-20260805-3d71ca owns the best-of-M mechanism and the R statistic;
    this proposal supplies the LAW of that statistic and a correction to its dispersion, and
    takes no position on the mechanism's value. M1-1 owns the Z-shape signature (n_q, n_1)
    as a driver of the optimal sample count m; this uses the same two numbers as the location
    of a distributional REGIME CHANGE, which M1-1 does not consider. IDEA-20260805-2b94fe
    and M1-4 own exact-CBD SCORING and bound it below 0.3 core-SVP bits; the present effect
    is in the selection statistic's spread, enters through sqrt(ln M) rather than through
    the score, and is not bounded by M1-4's number. IDEA-20260805-530869 owns the null-object
    requirement; this proposal supplies a null (Gaussian arm) that satisfies it and declares
    its own isometry non-invariance in advance, which is the specific failure P3 exhibited
    per DEC-20260806-14ac13.
  lossy_projection_test: 'PASSES. The tracked object is R, a one-number projection of the
    error vector. It is massively lossy: the fibre over a value of R is a codimension-1 hypersurface
    in Z^d, so the direction of e and all of its sign information are destroyed. What is discarded
    is discarded COMPATIBLY with the attack''s operations, because the primal attack''s success
    condition is stated purely in terms of projected NORMS against the Gram-Schmidt profile
    — norms are exactly what survives, and they propagate deterministically under the projection
    tower pi_{d-1} >= pi_{d-2} >= ... The proposal''s whole content is that this projection
    interacts with a SECOND lossy projection (onto the tail block), and that the composition
    is coordinate-dependent while each factor separately is not. A projection losing nothing
    would be tracking e itself; that is the control arm, not the object.'
