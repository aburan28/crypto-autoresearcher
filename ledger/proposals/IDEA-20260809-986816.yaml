idea:
  id: IDEA-20260809-986816
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-TECDSA-8d340d
  goal_id: GOAL-TECDSA-001
  title: >-
    Omit the range proof and extract the share — with the session count measured
    as a curve rather than reported as a number
  class: mechanism
  claim: >-
    When a range proof on an encrypted value is omitted or its bound relaxed, a
    malicious counterparty can submit out-of-range values whose effect on the
    output signature reveals information about the honest party's share. The claim
    is that this yields full share extraction against the reference implementation,
    that the number of signing sessions required is a decreasing function of how
    far the bound is relaxed, and that reporting the curve is what makes the
    finding actionable rather than binary.
  mechanism: >-
    The adversary chooses inputs outside the honest range so that the honest
    party's contribution is revealed modulo a controlled quantity; each session
    yields congruence information about the share, and enough congruences
    determine it.
  why_not_a_renamed_known_approach: >-
    This attack shape is published against implementations that omitted or
    weakened range proofs. This record reproduces it inside the program and adds
    the SESSION-COUNT CURVE against the relaxation parameter, which the published
    accounts generally give at one operating point.
  predictions:
  - observable: sessions required for full extraction versus relaxation parameter
    metric: session count per parameter value
    predicted: Decreasing, plausibly steeply. A flat curve would mean the relaxation is not the operative variable and the mechanism account is wrong.
  - observable: certificate validity
    metric: a valid signature produced under the extracted share, checked by a stock verifier
    predicted: Valid, or nothing is recorded.
  minimal_test: >-
    At toy curve and modulus sizes, sweep the relaxation parameter, run extraction
    at each, emit the extracted share plus a signature under it, and report the
    curve with declared seeds.
  controls:
  - 'FULL-PROOF CONTROL: with the range proof enabled at its specified bound, extraction must fail within the declared budget.'
  - 'HONEST-PATH CONTROL at every relaxation setting, so the record can state that functional behaviour is unchanged.'
  falsification_conditions:
  - No extraction even with the proof fully omitted.
  - Extraction succeeds with the proof fully enabled, indicating a defect elsewhere in the implementation.
  interpretation_limits: >-
    The certificate is against this program's reference implementation with a
    deliberately chosen proof set, labelled as such in the record title. No
    third-party wallet, custodian, library or service is examined or named, and
    all key material is self-generated.
  sota_delta: 'No new attack. Delta: a measured session-count curve against a relaxation parameter, plus a reproduction inside this program.'
  dominated_by: Externally dominated by the published attacks, stated plainly. Downstream of IDEA-20260809-986269.
  estimated_cost: Implementation medium; compute low.
  recommended_priority: high
  novelty_status: known
  novelty_screen: 'Corpus grep: no threshold ECDSA records. WEB NOT CHECKED.'
  source_refs:
  - Published threshold ECDSA attack papers -- RECALLED, REQUIRED READS.
