idea:
  id: IDEA-20260816-1166e9
  question_id: RQ-ASCON-2dfd8b
  added: '2026-08-16'
  title: 'Test whether the phrase r-round permutation is even well defined once the specification
    declares a schedule longer than the standard call: enumerate every admissible round-constant schedule
    slice, compute whether the resulting r-round functions coincide, differ by constants only, or
    differ structurally, and report the ambiguity as a named control on every round-indexed statement'
  class: control
  claim: '(A) When a specification defines a permutation family whose round-constant schedule is longer
    than the number of rounds any single call uses, the expression the r-round permutation stops being
    a single function. It becomes a family indexed by WHICH SLICE of the schedule the r rounds take
    -- the first r constants, the last r, or an offset window -- and different call sites within the
    same standard can legitimately use different slices. Any statement of the form a property holds
    to r rounds is then ambiguous unless the slice is named. (B) This proposal makes the ambiguity
    finite and computable: enumerate every admissible (r, offset) slice within the declared schedule
    length, construct the corresponding r-round function, and classify each pair as identical, affine-equivalent
    by constant translation, or structurally distinct, using exact checks rather than sampling where
    possible. The output is an equivalence classification of the slice family, plus a named control
    -- the slice index -- that every round-indexed cell in an applicability table must carry. (C)
    NOT CLAIMED: that any published statement is ambiguous, since this program cannot read published
    statements and asserts nothing about them; the claim is about the SPECIFICATION''s own indexing,
    checkable locally. NOT CLAIMED: that slice differences have any cryptanalytic consequence; a structural
    difference between two slices is a statement about two functions, not about anyone''s ability
    to exploit either. NOT CLAIMED: any attack. (D) The measurement is only meaningful with its null:
    a schedule of RANDOM constants of the same length, sliced identically, where the classification
    must place essentially all pairs in the structurally distinct class. If the real schedule''s classification
    is indistinguishable from the random one, the classification is measuring slicing rather than
    the schedule and is a controlled null.'
  mechanism: 'Stage one pins the permutation parameterised by an EXPLICIT constant window rather than
    by a round count, which is the implementation change that makes the whole question expressible;
    the standard slice is validated against test vectors so the family is anchored to a checked function.
    Stage two enumerates every admissible (r, offset) pair within each candidate schedule length.
    Stage three classifies each same-r pair by three checks in order: exact elementwise comparison
    of constant windows; exact translation-equivalence, decided by verifying that the candidate state
    translation commutes with the nonlinear layer under exhaustive bit-slice enumeration and is fixed
    by the linear layer; and, for pairs neither check settles, a bounded search for a distinguishing
    input, recorded as a certificate and re-verified independently. Stage four repeats the entire
    classification for a random-constant schedule and an all-zero schedule in the same invocation,
    where the forced behaviours calibrate the classifier in both directions. Stage five reports the
    partition per arm and per candidate schedule length, with unsettled pairs labelled as unsettled
    and never rounded. Refutation of the method is either null failing its forced behaviour; refutation
    of the interesting reading is a real-schedule partition indistinguishable from the random-constant
    null.'
  novelty_status: unverified
  novelty_screen:
    method: 'Shared repository screen: grep -il for round constant and IV constant over ledger/proposals/*.yaml;
      grep -ril ascon over ledger/proposals, ledger/hypotheses, ledger/evidence and experiments; grep
      -il little-endian and endian over ledger/proposals/*.yaml; grep -il capacity, sponge and duplex
      over the same. Read: ledger/questions/RQ-ASCON-2dfd8b.yaml in full (its provenance block reports
      the specification as defining permutations up to sixteen rounds while calls use twelve and a
      reduced count, all marked UNVERIFIED), ledger/goals/GOAL-ASCON-001.yaml first 60 lines, docs/inventor-protocol.md
      sections 1-8 including the section 8 quantifier-order audit which is the direct ancestor of
      this framing, header of knowledge/techniques/KN-TECH-066.md.'
    results: 'The grep for round constant and IV constant over ledger/proposals/*.yaml returned ZERO
      files: no proposal in this repository treats a constant schedule as an object of any kind, which
      makes this the emptiest surface in the bucket. grep -ril ascon returned no ledger record anywhere.
      The endian grep returned ten filenames whose contents were not read (IDEA-20260808-25fca0, 2fabbc,
      917e63, 9d6677, b16d04, IDEA-20260809-1b5b15, 2ba70c, 7f2d9c, c4ecac, ce875b) and which a Coordinator
      must check. RQ-ASCON-2dfd8b''s own provenance block is the source of the sixteen-round observation
      and simultaneously marks it UNVERIFIED, so this record is written to be valuable as a conditional
      audit: if the schedule is longer than the call, the classification is required; if it is not,
      the record''s answer is that the ambiguity does not arise, which is itself a filled cell.'
    verdict: 'UNVERIFIED. This program cannot read external literature and this record asserts nothing
      about it; in particular it does NOT claim that any published statement is ambiguously indexed.
      Claimed NEW relative to this repository: treating the round-constant schedule slice as an explicit
      index that round-indexed claims must carry, and computing the equivalence classification of
      the slice family as a finite exact audit with a random-schedule null. ASSEMBLED FROM KNOWN PARTS:
      the quantifier-order audit in docs/inventor-protocol.md section 8 is the direct methodological
      ancestor -- this is that audit applied to an index rather than to a quantifier; affine equivalence
      by constant translation is elementary; the same-invocation null requirement is section 3.'
  object_first_candidate:
    tracked_object: The (r, offset) slice index of the round-constant schedule, carried as the label
      of an r-round function, together with that function's identity under the classification. What
      is followed is the INDEX and the equivalence class it lands in, not any state.
    lossiness: 'Lossy. Discarded: every state value and every property of the r-round function other
      than its equivalence class under the declared relation. Retained: the slice index and a class
      label. The discard is compatible with the target operation -- restriction of the schedule to
      a window -- because that operation acts directly on the index, and the class label is a function
      of the index alone once the schedule is fixed. It is genuinely not a change of coordinates:
      infinitely many functions share a class label, and the map from index to class is many-to-one
      whenever two slices coincide, which is exactly the collapse the audit is looking for. If it
      turned out that every slice landed in its own class, the object would have discarded nothing
      useful and the record says so plainly rather than dressing the outcome up.'
    propagation: 'One step of the target operation shifts the slice offset by one: the r-round function
      built from constants c_k..c_{k+r-1} becomes the one built from c_{k+1}..c_{k+r}. Acting on the
      class label this either preserves it -- which happens exactly when the two constant windows
      are related by a state translation the linear layer can absorb -- or changes it. Because round
      constants are added into a fixed word of the state, the difference between two slices is a sequence
      of constant translations interleaved with the nonlinear layer, so preservation across a shift
      requires the nonlinear layer to commute with the translation, which is a strong and checkable
      condition. The propagation of the object is therefore the trajectory of class labels as the
      offset walks the schedule, and the deliverable is that trajectory.'
    survival_score: 'Stated as the size and structure of the equivalence classes: how many of the
      admissible slices coincide exactly, how many are related by constant translation only, and how
      many are structurally distinct, reported as a partition of the slice family with its sizes.
      The object survives as a useful index precisely while the partition is nontrivial; if every
      slice is structurally distinct, the index is maximally load-bearing and every round-indexed
      statement needs it, and if all slices coincide, the index is vacuous and that is a clean negative
      that closes the question.'
  null_object_control: A RANDOM-CONSTANT SCHEDULE of the same length, drawn from a recorded seed and
    sliced identically, classified by the IDENTICAL procedure in the SAME invocation. Since random
    constants have no reason to be related by translation, the null must place essentially all slice
    pairs in the structurally distinct class. If the real schedule's partition is indistinguishable
    from the null's, the classification is detecting the act of slicing rather than any property of
    the schedule, and the record is a controlled null. A SECOND null uses an all-zero schedule, where
    every slice must coincide exactly -- the opposite extreme -- confirming the classifier can detect
    coincidence when it is present.
  discriminated_from:
  - The fourth record in this batch, which searches for a conjugation witness between two ordering
    conventions. That record's object is a bit-index permutation relating two documents; this record's
    object is a slice index within ONE document, and the two audits are independent -- a conjugation
    witness would not resolve slice ambiguity and vice versa.
  - KN-TECH-066 (rebound, message modification, internal differentials). That technique constructs
    differential paths through a permutation; this record classifies functions by equivalence and
    constructs no path.
  - A test-vector check. Test vectors pin one call at one round count with one slice; they cannot
    detect that a different call site uses a different slice, which is exactly the ambiguity this
    audit targets.
  - The ten endian-matched proposals seen by filename only. None can concern Ascon since the ascon
    grep returned no ledger record; a Coordinator must read them, and that is a declared derivation
    gap rather than an assertion of clearance.
  - The first record in this batch, the dependency-signature adjudicator. That record builds the table's
    grammar; this record supplies one specific COLUMN of it -- the slice index -- and the two are
    complementary rather than overlapping, with this one computing over the permutation and the other
    computing over labels.
  assumptions:
  - The round-constant schedule and its declared length can be pinned from primary text; if the schedule
    is no longer than the largest call, the audit's answer is that the ambiguity does not arise, which
    is a complete and reportable result.
  - Round constants are added into a fixed, known word of the state, so that constant translation
    is a well-defined candidate equivalence; if they are added elsewhere the equivalence relation
    must be redefined and the audit re-run.
  - 'Exact classification is feasible: coincidence of two slices can be decided by comparing constant
    windows directly, and affine equivalence by constant translation can be decided by checking whether
    the nonlinear layer commutes with the candidate translation, both without sampling.'
  - Structural distinctness, where exact methods do not settle it, can be established by exhibiting
    a single input on which the two functions differ, which is a certificate rather than a statistical
    claim.
  - The admissible (r, offset) set is small -- bounded by schedule length squared -- so the classification
    is exhaustive rather than sampled.
  predictions:
  - metric: number of admissible slice pairs classified as identical, for the real schedule
    direction: different
    minimum_effect: no pre-commitment; this program has not pinned the schedule and any predicted
      count would be invention. Both a trivial partition and a fine one are reportable with opposite
      consequences for whether the slice index is load-bearing
  - metric: fraction of slice pairs classified as structurally distinct, for the random-constant null
      schedule
    direction: higher
    minimum_effect: at least 0.99; a null that produces coincidences indicates the classifier is collapsing
      distinct functions and voids the comparison
  - metric: fraction of slice pairs classified as identical, for the all-zero null schedule
    direction: higher
    minimum_effect: exactly 1.0, a forced value; any structurally distinct pair under an all-zero
      schedule is a classifier defect
  - metric: number of slice pairs where exact methods fail to settle the class and a distinguishing
      input must be exhibited
    direction: different
    minimum_effect: reported rather than predicted; a large count would mean the exact half of the
      classifier is weak and the audit rests on certificates, which is acceptable but must be visible
  minimal_test:
    design: 'Pin the schedule, or run the audit over each candidate schedule length. Enumerate all
      admissible (r, offset) pairs within the declared length -- at most a few hundred slices. For
      each pair of slices at the same r, first compare their constant windows directly for exact coincidence;
      then test the constant-translation equivalence by checking whether the candidate translation
      commutes with the nonlinear layer, an exact algebraic check on a small bit slice; then, for
      unsettled pairs, search a few thousand random inputs for a distinguishing input and record it
      as a certificate. Run the identical classification on a random-constant schedule and on an all-zero
      schedule in the same invocation. Cost: minutes. The discriminating output is the partition of
      the real slice family against the two nulls'' partitions, and the count of pairs needing a certificate.'
    controls:
    - Random-constant schedule null of matched length, identical classification, same invocation,
      seed recorded.
    - All-zero schedule null, where every slice must be identical, confirming the classifier can detect
      coincidence.
    - 'Self-comparison control: every slice compared with itself must classify as identical.'
    - 'Certificate re-verification: every exhibited distinguishing input re-evaluated independently
      of the search that found it.'
    - Schedule-length sweep across the candidate lengths, so a partition is never reported for an
      assumed length as though it were pinned.
    - Nonlinear-layer commutation check verified independently by exhaustive enumeration over one
      bit slice, since that check carries the affine-equivalence classification.
    required_metrics:
    - partition of the admissible slice family into identical / translation-equivalent / structurally
      distinct classes, with class sizes
    - the same partition for the random-constant and all-zero null schedules
    - count of pairs requiring a distinguishing-input certificate, and the certificates themselves
    - self-comparison control outcome
    - exhaustive commutation-check outcome for the nonlinear layer
    - admissible slice count per candidate schedule length, wall-clock and seeds
  falsification_conditions:
  - The all-zero null schedule produces any structurally distinct pair, showing the classifier cannot
    detect coincidence.
  - The random-constant null schedule produces coincidences at more than a negligible rate, showing
    the classifier collapses distinct functions.
  - Any self-comparison classifies as anything other than identical.
  - A distinguishing-input certificate fails independent re-verification.
  - The real schedule's partition is statistically indistinguishable from the random-constant null's,
    forcing a controlled-null record.
  - The schedule turns out to be no longer than the largest call, in which case the ambiguity does
    not arise and the record reports that as its complete result.
  confounders:
  - If constants are added to a state word that the nonlinear layer treats specially, the translation-equivalence
    check may be trivially true or trivially false for reasons unrelated to the schedule.
  - A partition computed under an assumed schedule length is not a partition of the real family; the
    length sweep prevents this only if the sweep covers the true length.
  - Random inputs may fail to distinguish two functions that differ only on a sparse set, so an unsettled
    pair is unsettled rather than identical, and the record must never round the former to the latter.
  - The audit is sensitive to whether round constants are indexed from the start or the end of the
    schedule, which is itself a convention the specification may state only implicitly.
  - The equivalence relation chosen -- constant translation -- is one candidate among several, and
    a pair distinct under it could be equivalent under a broader relation that this audit does not
    test.
  interpretation_limits:
  - A nontrivial partition means round-indexed statements need a slice label to be well posed; it
    does NOT mean any existing statement is wrong, because this program cannot read any existing statement.
  - Structural distinctness between two slices is a statement about two functions and carries no cryptanalytic
    consequence whatsoever.
  - If the schedule is not longer than the largest call, the entire question dissolves, and that outcome
    must be reported as a resolved cell rather than as a failed experiment.
  - The audit is conditional on the constant-addition geometry and on the schedule indexing convention,
    both stated per run.
  target_complexity:
    time_exponent: No attack exponent is claimed. Classification cost is quadratic in the admissible
      slice count, which is at most a few hundred, times a small per-pair check.
    memory_exponent: No attack exponent is claimed. Memory is the slice table and the certificates,
      kilobytes.
    best_known: 'The incumbent is the implicit convention that the r-round permutation names one function.
      That convention has no competitor in this repository at all: the round-constant and IV-constant
      grep over ledger/proposals returned zero files, making this the emptiest object in the bucket.'
    hidden_overhead: The hidden cost is conventions. The schedule length, the indexing direction,
      and the state word constants are added to are all things a specification may state once, in
      passing, and a program that guesses any of them produces a confident partition of the wrong
      family. The sweep mitigates the first and the record flags the other two as run conditions,
      but the human reading cost is real and is where the effort actually goes.
  dominated_by: 'n/a (no result claimed). Pareto check across all three axes explicitly: time -- no
    attack time is produced and no frontier row is claimed; memory -- the audit is memory-trivial
    and produces no attack memory figure; data/queries -- zero oracle queries, everything evaluated
    offline against a local implementation. Each axis was considered rather than the field defaulted.'
  sota_delta: no attack; conceptual/measurement contribution only. The quantitative delta is an exact
    partition of the admissible slice family with class sizes and certificates, against two null schedules,
    where this repository previously held zero records treating a round-constant schedule as an object
    of any kind.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'Separately: that the specification defines a schedule longer than the
    largest call, about 0.5 -- the RQ reports it but marks the report UNVERIFIED, and if it is false
    the record resolves immediately with a clean negative. That the classifier''s two nulls behave
    as forced (all-zero coincides, random distinguishes), above 0.95, since both are near-certain
    structurally. That the real schedule''s partition is nontrivial, about 0.3 -- constants chosen
    by a designer to be a simple counter or LFSR sequence often DO make slices related in a describable
    way, but structural equivalence under the nonlinear layer is a much stronger requirement than
    a describable relation, so most pairs are likely structurally distinct. That the slice index is
    adopted as a required column on round-indexed applicability cells, about 0.5, since its cost is
    one field and its benefit is removing an ambiguity that is otherwise invisible.'
