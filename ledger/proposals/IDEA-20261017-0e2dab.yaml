  - {ref: H-SEMBIN-83a856, provenance: internal, claim: "confinement iff window in ker Tr, k<n-s", verified_by: EV-SEMBIN-0c8bf4}
  - {ref: IDEA-20260913-191ed2, provenance: internal, claim: "already reads the exp. column as a satisfiable-arm census; nearest prior work: uses the exp column to stratify d_F4 by satisfiability; this uses it to test the yield law", verified_by: ledger}
