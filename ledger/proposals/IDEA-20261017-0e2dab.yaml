idea:
  id: IDEA-20261017-0e2dab
  question_id: RQ-SEMBIN-ade131
  added: '2026-10-17'
  status: proposed
  approved_by:
  proposed_by: idea-generator
  title: >-
    Replicate the paper's only large cell (n=40, t=2, k=20) by exact counting at 20x the
    z, in a sparse-f (parity-confined) and a dense-f field, against .316 vs .393; and read
    the other 32 cells of Tables 1-2 through their instance-variance band
  class: control
  claim: >-
    SCOPE toy plus a re-reading of frozen tables.yaml; no attack, no security claim.
    FACT the RQ text omits: Tables 1-2 carry an EXPERIMENTAL success column (100 random z
    per cell, 33 cells), not only the model column. (C1) Instance variance: each cell is ONE
    (V,B,f) instance whose true yield carries the factor ((2a-1)/|V|)^t, a=#on-curve x in V,
    relative sd ~ t/sqrt(|V|): 3.0 at (n12,t6,k2), 1.0 at (t4,k4), 1.8 at (t5,k3), .27-.38
    at n=17,19,21 (t3), 0.002 at n=40. Binomial bars on 100 z ignore it, so cells with k<=4
    cannot test eq. (11): a pooled z-score of the 8 non-n17 B=1 cells is +3.0 against
    eq. (11) and -1.3 against the multiset-exact mean, and is not a valid test. Only n=40
    is a clean calibration. (C2) At n=40 the window is parity-confined iff f has second
    exponent s<=20 (Tr(alpha^j)=0 for j<n-s). Then in the paper's random-z experiment
    N(z)=0 for every z with Tr(b/z)=1 (any A), and P=(1-e^{-2mu})/2=.316 at mu=.5; for dense
    f (Tr(alpha)=1) P=1-e^{-mu}=.393. Observed .28 (28/100, SE .045) is -0.8 sigma from
    .316 and -2.3 sigma from .393. Exact counting over 2000 z (SE .011) separates them at
    7 sigma and extends the parity test from |V|<=2^12 (EV-SEMBIN-0c8bf4) to |V|=2^20.
  mechanism: >-
    Object: z -> N(z)=#{(x1,x2) in V^2 : S_3(x1,x2,z)=0}. Representation R1 (polynomial
    basis; two field representations of one F_{2^40}). Sigma: the E/2E class map; the class
    of z is the one bit Tr(b/z). Per z, S_3 is an F_2-affine quadratic in x2 given (x1,z):
    (x1+z)^2 x2^2 + x1 z x2 + (x1^2 z^2+B)=0, solvable iff Tr(x1)+Tr(b/x1)=Tr(z)+Tr(b/z)
    (same curve type), roots differing by x1 z/(x1+z)^2. N(z) costs 2^20 steps with a
    precomputed Artin-Schreier matrix (n even: invert w->w^2+w off its kernel {0,1}) and
    a membership test in V. Lossy-projection test: Tr(b/z) keeps one bit of z and is
    compatible with Sigma (class of a sum = sum of classes). Class I partial action.
  novelty_status: unverified
