    verified_by: idea-generator 2026-10-17, record opened
  predictions:
  - {metric: "P at n=40,k=20, sparse f (s<=20)", direction: lower, minimum_effect: ".316+-.015 against eq. (11) .393"}
  - {metric: "P at n=40,k=20, dense f (Tr(alpha)=1)", direction: different, minimum_effect: ".393+-.015"}
  - {metric: "solutions at z with Tr(b/z)=1, sparse f", direction: lower, minimum_effect: "exactly 0 in all 2000 z"}
  - {metric: "Tables 1-2 cells outside their instance band", direction: lower, minimum_effect: "<=2 of 33 at 95%"}
  minimal_test:
    design: >-
      Part A (zero compute): for the 12 B=1 cells with n<=17 enumerate all irreducible f of
      degree n (<=7710), V=window; compute a(V) and P_inst=(1/2)[(1-e^{-mu_a})+(1-e^{-mu_b})]
      with the parity factor from Newton; sample B for the random-B cells; report the 95%
      band of P_inst and where exp_prob falls. Part B (C, 64-bit clmul): n=40, V=window k=20,
      f sparse and f dense, B random and B=1; 2000 random z per arm; count N(z) exactly,
      record P, split by Tr(b/z), max N.
    controls:
    - "same code at n=20,k=10 against the exhaustive pushforward of RUN-SEMBIN-8be036"
    - "curve-free random map at |V|=2^20 through the same z-loop: P=.393"
    - "wrong functional (Tr(1/z) for Tr(b/z)) must not give an empty class"
    required_metrics: [P with Wilson interval per arm, hits by Tr(b/z), max N, band per cell, wall time]
  falsification_conditions:
  - "Sparse-f P outside [.30,.33] at 2000 z: the parity mixture does not hold at |V|=2^20."
  - "Any solution at Tr(b/z)=1 with sparse f: theorem misapplied or code bug."
  - "More than 4 of 33 cells outside their instance band: the band, hence C1, is wrong."
  confounders:
  - "MAGMA's default f at n=40 is unknown: both representations are run and the paper's cell is bracketed, not matched."
  - "Population: the paper's z is uniform on F_q, targets on E(F_q) differ; this arm uses the paper's population."
  interpretation_limits:
  - "Toy; nothing about Assumption 1, degree or any curve's security. An instance-band reading audits the paper's evidence; it does not refute eq. (11)."
  heuristic_assumptions:
  - id: H1
    statement: "(2a-1)/|V| = 1 + O(|V|^{-1/2}) over (V,B,f)."
    rigorous_support: "Weil/Kloosterman bounds control sums over V only for |V| >= q^{1/2+eps}; none at |V|=q^{1/m}."
    validation_plan: "Part A over all f at n<=17 (tails: min and max a); sampled at n=40, 1e4 (B,f)."
  - id: H2
    statement: "Within the reachable z-class N(z) is Poisson(2mu) at |V|=2^20."
    rigorous_support: "Parity theorem + conservation; Poisson limit unproved."
    validation_plan: "Histogram of N(z) over 2000 z vs Poisson; ~0.2 of z expected at N>=3."
