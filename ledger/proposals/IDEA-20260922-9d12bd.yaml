  heuristic_assumptions:
    - id: H1
      statement: >-
        AXIS PURITY OF BASIS CHOICE. For the CNF-XOR pdp model at m=3, l in
        [6,8], changing the reduction polynomial (or the polynomial-vs-
        normal basis) while holding the block partition and monomial
        support fixed changes the expected per-node cost E[c_leaf] by a
        measurable factor while changing the expected leaf count E[N_leaf]
        by less than 5%, uniformly over the tested n.
      rigorous_support: >-
        RIGOROUS INGREDIENT: Proposition 1's backdoor property depends only
        on the SUBSTITUTION STRUCTURE (which monomials determine which
        variables), a combinatorial fact about the Semaev polynomial's
        block support that is basis-independent by construction (the same
        monomials exist in any basis, only their COEFFICIENTS change).
        CLASSICAL STATEMENT IMITATED: the standard observation that a
        change of basis is a LINEAR CHANGE OF COORDINATES on the solution
        variety and therefore preserves combinatorial invariants (variable
        count, degree) while changing analytic ones (coefficient sparsity)
        -- here applied to a Boolean encoding rather than a variety, which
        is the extrapolation this heuristic makes and the reason it is
        labelled heuristic rather than proved.
      validation_plan: >-
        SAMPLE: leaf counts and clause-width distributions at every Stage-2
        cell, >=5 seeds x >=10 instances per (cell, basis, status). SHORTCUT
        FOR LARGER PARAMETERS: clause-width and substitution-variable counts
        are computable directly from the encoder at any n up to the toy
        ceiling WITHOUT running a solve, so H1's STRUCTURAL half (which
        basis is sparser) is checkable far beyond where a complete solve
        finishes; a solve-free density sweep across every field degree in
        the standardized population is affordable and is Stage 4's actual
        content. COMPARISON: leaf-count ratio against 1 (binomial-style
        tolerance); clause-width ratio against the raw term-count ratio
        (5 vs 3) as a naive first guess, explicitly expected to be a POOR
        predictor since it ignores overlap structure, with the measured
        ratio reported instead of the naive one. TAIL CHECKS: the single
        widest clause observed per basis arm, reported alongside the mean,
        since a rare very-wide clause could dominate wall-clock without
        moving the mean width much. TRANSFER: structural (encoder-level)
        results transfer to any n where the encoder can be run without a
        solve; solving-cost results (c_leaf, seconds-per-leaf) are labelled
        toy-only and not extrapolated past the tested ladder.
    - id: H2
      statement: >-
        DISCRIMINATOR VALIDITY. A random F_2-linear relabelling constructed
        to match a real basis's clause-width DISTRIBUTION (not just its
        mean) has N_leaf within 10% of that real basis's N_leaf, while an
        UNMATCHED random relabelling reproduces IDEA-20260915-7ef636's
        large-effect regime, so the two controls are genuinely
        distinguishing width-matching from arbitrary scrambling.
      rigorous_support: >-
        RIGOROUS INGREDIENT: none; this is an assumption about which
        property of a relabelling determines its effect on search cost, made
        to be falsifiable rather than to be relied on. CLASSICAL STATEMENT
        IMITATED: none directly; the closest classical analogue is the
        folklore observation in SAT solving that instance HARDNESS under a
        fixed solver is sensitive to variable and clause STRUCTURE, not
        merely to raw clause count, which the width-matching construction
        operationalises for this specific discriminator.
      validation_plan: >-
        SAMPLE: both controls run on the SAME Stage-2/3 grid as the real
        basis arms, >=5 seeds. COMPARISON: N_leaf ratio of each control
        against the real-basis arm it was matched (or not matched) to.
        TAIL CHECKS: the single largest N_leaf observed under the
        width-matched control, checked against the real-basis arm's
        maximum, since a width match on AVERAGE could still hide a
        heavy-tailed disagreement. TRANSFER: none claimed beyond the tested
        cells; this heuristic is purely instrumental (it validates the
        experimental design) and carries no standalone scientific claim.
  heuristic_note: >-
    H1 is the record's actual scientific content, stated so both outcomes
    are informative: axis purity confirmed means reduction-polynomial choice
    is a genuine, previously-unmeasured c_leaf lever that belongs beside
    IDEA-20260904-7fd218's six ingredients; axis purity refuted means basis
    choice moves N_leaf too, which would be a materially more important and
    more surprising finding, contradicting the backdoor-invariance argument
    in `mechanism` and warranting immediate escalation. H2 is purely
    instrumental and exists only to keep a positive H1 finding from being
    misread as a restatement of 7ef636.
