        core discriminator and its failure is the most informative negative
        outcome available here.
    - metric: certificate_set_equality across all three basis arms
      direction: flat
      minimum_effect: exact multiset equality at every brute-forceable cell.
  minimal_test:
    design: >-
      STAGE 0 -- ZERO COMPUTE. Exhibit a toy field degree n admitting both a
      trinomial and a pentanomial modulus (checked by direct polynomial
      irreducibility testing, not assumed), and commit the predicted
      leaf-count invariance and the (undirected magnitude) clause-width
      prediction before any run.
      STAGE 1 -- STRUCTURAL FIXTURE. Encode the SAME descended system under
      trinomial, pentanomial and (if constructible per IDEA-20260922-7ab503's
      Stage 1) normal-basis representations at m=3, l in {3,4}, n matched;
      verify identical core-variable count and block partition; verify
      equisatisfiability and identical projected solution sets by brute
      force.
      STAGE 2 -- THE MEASUREMENT. m=3, l in {6,7,8}, matched n per basis; 10
      UNSAT and 10 planted-SAT instances per (cell, basis arm), >=5 seeds.
      Record leaf counts, clause-width and substitution-variable-count
      distributions from the encoder directly, and seconds-per-leaf with
      pinned versions.
      STAGE 3 -- THE RELABELLING DISCRIMINATOR. Build the unmatched-random
      and width-matched-random relabelling controls per (D); run the same
      grid on both; compare against the real-basis arms.
      STAGE 4 -- DEPLOYED ROWS, ZERO COMPUTE. Report which named standardized
      field degrees are pentanomial vs trinomial (the census of (A), with
      the flagged re-verification obligation for the sect*r1/r2 rows not
      individually re-checked this session) and the measured c_leaf ratio
      with its extrapolation distance.
    controls:
      - >-
        STRUCTURAL FIXTURE (Stage 1) -- identical core-variable count and
        equisatisfiability across bases; a mismatch blocks Stage 2.
      - >-
        UNMATCHED RANDOM RELABELLING -- must reproduce 7ef636's large N_leaf
        effect, or the instrument has no power to see the confound it exists
        to rule out.
      - >-
        WIDTH-MATCHED RANDOM RELABELLING -- must show small N_leaf effect
        matching the real-basis arms', isolating clause width as the
        relevant variable.
      - BRUTE-FORCE ORACLE -- certificate-set equality across all arms at small cells.
      - SEED CONTROL -- >=5 seeds per cell, spread reported before any between-arm claim.
    required_metrics:
      - leaf_count per basis arm
      - clause_width_distribution and substitution_variable_count per basis arm (encoder-level, before any solve)
      - seconds_per_leaf (pinned solver version, commit, hardware, seed)
      - core_variable_count and block_partition per arm (structural fixture)
      - certificate_multiset per target and exact-equality verdict
      - termination_reason (completed | timeout | memory_abort | crash)
  falsification_conditions:
    - >-
      leaf_count_ratio outside [0.95,1.05] at any tested cell with a passing
      structural fixture. The predicted axis purity is false; the record's
      central mechanism claim (B) is wrong and the reduction-polynomial
      effect belongs on the N_leaf axis after all, which is the more
      important, more surprising outcome.
    - >-
      Structural fixture fails (core-variable count or equisatisfiability
      differs across bases). Instrument defect; no cost conclusion may be
      drawn until fixed.
    - >-
      Width-matched random relabelling reproduces 7ef636's large N_leaf
      effect as strongly as the unmatched control. The discriminator has no
      power and no attribution of any real-basis difference to sparsity is
      licensed.
    - >-
      clause_width_ratio and seconds_per_leaf_ratio disagree in direction.
      The clause-width proxy does not predict actual solving cost and the
      record's c_leaf mechanism needs a different observable.
    - >-
      Certificate sets differ across basis arms at any brute-forceable cell.
      An encoding bug, not a result; fixed before anything else is reported.
  confounders:
    - >-
      COMPILER/SOLVER SCHEDULING differences between encodings of similar
      but not identical clause counts; reported via instruction counts
      alongside seconds-per-leaf, as in IDEA-20260920-204828's precedent
      for separating a derived count from a measured wall-clock number.
    - >-
      A pentanomial and a trinomial reduction at the SAME n are not
      guaranteed to exist simultaneously at every field degree; Stage 0's
