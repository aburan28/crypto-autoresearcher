  proof_search_map:
    bottleneck: >-
      Whether the descended system's PER-NODE solving cost, not its leaf
      count, depends on the reduction polynomial's sparsity -- and whether
      that dependence can be told apart from the already-measured effect of
      scrambling variable order (IDEA-20260915-7ef636), which is the
      confound that would make any naive pentanomial-vs-trinomial comparison
      uninterpretable on its own.
    baseline_embedding:
      parameter_slice: >-
        m=3, l=6, a toy field of the SAME degree class under both a
        pentanomial and a trinomial modulus (both exist for several small
        n, e.g. n=9 admits both a trinomial x^9+x+1 and a pentanomial
        alternative -- exhibited and verified by direct reduction at Stage
        0, not assumed) so the SAME curve arithmetic is expressed in two
        genuinely different bases with identical m, l, n.
      reproduction_check: >-
        The unconstrained leaf count on EITHER basis arm reproduces
        3c7a91's law N_conf=(1+-eps)2^{ml}/m! within its stated band BEFORE
        any c_leaf comparison is read, confirming N_leaf is unaffected by
        basis choice as (B) predicts.
    observation_collision:
      observable: >-
        The pair (leaf count, seconds-per-leaf or clause-width proxy) under
        each basis arm.
      distinct_preimage_search: >-
        A c_leaf difference between bases could come from (i) genuine
        reduction-polynomial sparsity as analysed, or (ii) an
        implementation artefact of the encoder (e.g. one basis's Tseitin
        pass happening to allocate substitution variables less efficiently
        for reasons unrelated to sparsity). Broken by reporting the RAW
        clause-width and substitution-variable-count distributions per
        basis directly from the encoder, not only the downstream solve
        time, so a sparsity claim is checkable at the encoding step alone,
        independent of solver behaviour.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold N_leaf fixed (predicted constant across bases) and vary the
          basis; the intrinsic invariant proposed to distinguish the
          resulting systems is c_leaf (via clause width), not N_leaf.
        predicted_gain: >-
          A c_leaf ratio measurably above 1 for pentanomial over trinomial,
          reported with error bars rather than assumed.
    quantifier_order: >-
      CLAIMED: FOR ALL m, l with both a pentanomial and a trinomial modulus
      available at the tested n, the leaf count of a complete core-restricted
      search is INVARIANT to which is used (within 3c7a91's existing 5%
      band), while the clause-width distribution and measured c_leaf differ.
      NOT CLAIMED: any specific numeric ratio beyond what is measured; any
      statement about m>=131; any statement about which reduction polynomial
      is objectively "better" outside the tested cells.
    method_ceiling:
      strongest_certifiable_claim: >-
        A toy-scale, per-cell measurement of (N_leaf, clause-width, c_leaf)
        under three basis arms, with axis purity confirmed or refuted. It
        cannot certify anything about m>=131 field arithmetic in any
        production implementation, and cannot certify that the SAME sparsity
        effect exists in a Gröbner-basis (rather than CNF-XOR) solve of the
        same system, which is a separate, unmeasured arm.
      nearby_object_control: >-
        BLOCKING. The UNMATCHED random relabelling control of (D): a random
        invertible F_2-linear map per block, NOT constructed to match either
        real basis's clause-width distribution, must reproduce 7ef636's
        large N_leaf effect. If the pentanomial/trinomial difference and
        the unmatched-random difference are indistinguishable in size, this
        record's sparsity attribution has not been established and the
        effect is 7ef636's order effect under a new name.
    proof_obligations:
      - claim: A pentanomial and a trinomial modulus both exist and are exhibited at the chosen toy n.
        responsibility: baseline
      - claim: The ml core-variable count and block partition are identical across all three basis arms (structural fixture).
        responsibility: correctness
      - claim: Unconstrained leaf count on every arm matches 3c7a91's law within its band.
        responsibility: interface
      - claim: Clause-width and substitution-variable-count distributions are measured directly from the encoder, per basis.
        responsibility: runtime
      - claim: The matched-width random-relabelling control is genuinely width-matched, verified by direct comparison of its clause-width histogram to the real-basis arm it targets.
        responsibility: strictness
      - claim: No impossibility is asserted; the record is scoped to the tested toy cells and CNF-XOR encoding only.
        responsibility: scope
  predictions:
    - metric: leaf_count_ratio (pentanomial / trinomial), matched m, l, n
      direction: flat
      minimum_effect: within [0.95,1.05].
    - metric: clause_width_ratio (pentanomial / trinomial), F-set clauses only
