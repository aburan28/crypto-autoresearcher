idea:
  id: IDEA-20260922-9d12bd
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-22'
  status: proposed
  approved_by: null
  title: >-
    REDUCTION-POLYNOMIAL SPARSITY (PENTANOMIAL vs TRINOMIAL) AS A c_leaf-AXIS-
    ONLY LEVER FOR THE DESCENDED POINT-DECOMPOSITION SOLVE, FIELD-DEGREE-
    INDEXED ACROSS EVERY STANDARDIZED BINARY CURVE FROM THE AUDIT'S OWN
    OpenSSL DUMP: a seventh toggleable ingredient beyond IDEA-20260904-7fd218's
    six, predicted to move only the per-node cost and never the leaf count,
    tested against a structure-preserving relabelling null and a normal-basis
    control so a real sparsity effect cannot be mistaken for
    IDEA-20260915-7ef636's already-measured relabelling-order effect.
  class: measurement
  claim: >-
    SCOPE: the CNF-XOR descended point-decomposition (pdp) model of
    SRC-SATIC-TRIMOSKA-2019 and the direct model of src/semaev_tree.py; m=3
    primarily; l in 6..8; toy curves at n<=41 matching the FIELD DEGREE class
    of a named standardized row. CLAIM TIER toy. NO ATTACK, NO EXPONENT.

    (A) THE FIELD-DEGREE CENSUS, READ DIRECTLY FROM THE AUDIT THIS SESSION,
    NOT ASSUMED FROM MEMORY. Grepping analysis/binstd-curve-audit/
    binary-curve-params.txt for "Basis Type" against every curve name gives,
    exactly: ppBasis (pentanomial reduction polynomial) for m in
    {131,163,176,208,272,283,304,368,571} -- i.e. sect131r1/r2, sect163k1,
    sect163r2, c2pnb163v1/2/3, all five composite c2pnb* rows, sect283k1,
    and sect571k1; tpBasis (trinomial) for m in {191,193,233,239,359,409,
    431} -- every c2tnb* row, sect193r1/r2, sect233k1, sect239k1, sect409k1,
    and c2tnb431r1. The basis type is a property of m ALONE (shared by the
    Koblitz and pseudorandom curve at the same m, since the field, not the
    curve, fixes the reduction polynomial), so it partitions the
    STANDARDIZED FIELD population, independent of which curve sits on that
    field -- a genuinely new axis of curve-population indexing for this lane,
    orthogonal to the Koblitz/pseudorandom/composite split IDEA-20260922-
    7ab503 uses.

    (B) THE MECHANISM CLAIM. The Weil descent of a field product x_i * x_j
    expands via the field's MULTIPLICATION TABLE, itself built from the
    reduction polynomial: a pentanomial modulus (5 nonzero terms) folds
    degree-2n-2 partial products back with MORE nonzero reduction terms
    firing per fold than a trinomial modulus (3 terms), so each descended
    Boolean COEFFICIENT (each output bit of the product, as an XOR of input-
    bit products) generically has MORE literals under a pentanomial reduction
    than under a trinomial one, at matched n. This changes the WIDTH of the
    XOR/AND clauses the Tseitin encoding emits for the F-set (curve-carrying)
    equations -- the c_leaf axis of IDEA-20260904-7fd218's attribution --
    while leaving the ml CORE-VARIABLE COUNT, the block partition, and hence
    (by Proposition 1 of SRC-SATIC-TRIMOSKA-2019, cited not re-derived) the
    BACKDOOR SIZE and therefore the LEAF COUNT structurally untouched. THIS
    IS THE PREDICTED SEPARATION: reduction-polynomial choice is an EIGHTH-
    style ingredient that belongs entirely on 7fd218's c_leaf axis, never on
    the N_leaf axis -- unlike IDEA-20260915-7ef636's ARBITRARY relabelling,
    which that record already measured moving N_leaf (via B(order), the
    backdoor-blowup term of IDEA-20260904-7fd218's budget) by scrambling
    which VARIABLES are core at all. A basis change never does that: it
    changes how each core variable's VALUE is COMPUTED FROM, not which
    variables are core.

    (C) THE DISCRIMINATING PREDICTION. At matched (m,l,n), pentanomial vs
    trinomial reduction: leaf_count_ratio in [0.95,1.05] (axis-pure on
    N_leaf, per (B)); seconds_per_leaf_ratio (or, if wall clock is unreliable
    at this implementation scale, clause_width_ratio and
    substitution_variable_count_ratio as the primary proxies) measurably
    ABOVE 1 for pentanomial over trinomial, predicted in [1.1, 2.5] based on
    the raw arithmetic (5 vs 3 reduction terms is not itself the clause-width
    ratio, which depends on how terms of the multiplication table overlap;
    this record commits to no closed-form multiplier and reports the
    measured ratio as the deliverable). A NORMAL-BASIS control (no reduction
    polynomial at all in the usual sense; multiplication via the field's
    structure constants) is run as a THIRD arm to check whether the effect is
    about reduction-polynomial sparsity specifically or about basis
    representation generally -- the same three-way split
    IDEA-20260922-7ab503 uses for its own basis question, sharing tooling.

    (D) THE RELABELLING-NULL DISCRIMINATOR, WHICH IS THE RECORD'S REAL
    CONTRIBUTION. IDEA-20260915-7ef636 already measured that an ARBITRARY,
    unstructured relabelling of core variables costs at least 64x in
    conflicts at l=6 (Delta_order). A basis change IS technically a linear
    relabelling of coordinates, so a naive reader could attribute any
    pentanomial-vs-trinomial difference to "just another instance of 7ef636's
    order effect" rather than to sparsity. This record's discriminator: run
    a THIRD, matched-shape control -- a RANDOM invertible F_2-linear
    relabelling of each l-bit block, drawn independently of any real field
    structure, at the SAME clause-width distribution as the pentanomial
    arm (matched by construction, not by luck) -- and require that its
    N_leaf and c_leaf both sit CLOSE to whichever real-basis arm it was
    matched to in clause width, while a random relabelling NOT matched in
    width should reproduce 7ef636's large N_leaf effect. If the
    pentanomial/trinomial difference collapses into the SAME magnitude as
    an UNMATCHED random relabelling, this record's sparsity attribution is
    wrong and the effect is really 7ef636's order effect under a new name.
  mechanism: >-
    OBJECT FRAME. Representation: the F_2-basis used to express each field
    coordinate (R1 of RQ-ECDLP-623a32) -- specifically the REDUCTION
    POLYNOMIAL choice within a polynomial basis (pentanomial vs trinomial,
    both standardized and both present in the named population per (A)),
    with a constructed normal basis as a third control. Attack stage: the
    point-decomposition SOLVING stage's per-node cost (c_leaf), not
    membership, not relation-collection, not leaf count. Operation set
    Sigma: unchanged from ordinary index calculus (translation by
    factor-base points, Class I partial action per IDEA-20260806-c5d183);
    THIS RECORD DOES NOT PROPOSE A NEW SYMMETRY -- it is not a
    lossy-projection candidate at all, and the object-frame test therefore
    applies vacuously here in the sense that no new tracked object is
    proposed; the record measures a REPRESENTATION-LEVEL COST PARAMETER of
    the EXISTING Class-I object (the descended Boolean system), which is
    exactly the R1/attack-stage mapping RQ-ECDLP-623a32 asks for and is
    stated as such rather than forced through the trichotomy/lossy-
    projection machinery built for NEW objects.
    WHY THE PREDICTED SEPARATION IS PRINCIPLED, NOT ASSUMED. Proposition 1
    of SRC-SATIC-TRIMOSKA-2019 (cited, not re-derived) fixes the strong
    backdoor at exactly the ml core variables REGARDLESS of how field
    multiplication is expressed -- the backdoor property is about WHICH
    variables determine the rest under unit propagation, a fact about the
    SUBSTITUTION STRUCTURE of the summation polynomial (which monomials are
    products of which blocks), not about the F_2-BILINEAR FORM computing any
    one product. Changing the reduction polynomial changes the ENTRIES of
    that bilinear form (how many input bits XOR together to produce a given
    output bit) but not its DOMAIN OR CODOMAIN (still one output bit per
    monomial, still substituted the same way). This is why (B) predicts
    axis purity on N_leaf and a nonzero effect on c_leaf, in the SAME
    two-axis language IDEA-20260904-7fd218 established, adding reduction-
    polynomial choice as a toggle that record's F1-F6 list did not include.
    WHY THIS IS NOT IDEA-20260916-9d2fa6. That record's block-multiaffine
    claim is about the SEMAEV POLYNOMIAL'S degree structure across VARIABLE
    BLOCKS (which blocks a monomial touches), a fact independent of how any
    single block's field element is represented in bits. This record's
    claim is about the BIT-LEVEL EXPANSION WITHIN one block's field
    arithmetic, a fact independent of block structure. The two are
    orthogonal axes of the same descended system and neither record's
    finding constrains the other.
