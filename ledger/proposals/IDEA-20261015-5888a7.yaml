idea:
  id: IDEA-20261015-5888a7
  question_id: RQ-CMFB-33610e
  added: '2026-10-15'
  title: >-
    Joint x-y window factor bases: not covered by bit_window; matched-size
    yield is conserved, so the only price is box enumeration c_box(B1,B2),
    and the only open measurement is box-count dispersion below the Weil scale
  class: measurement
  claim: >-
    (A) Coverage check. FB-BIT-WINDOW in research/factor_base_lab.md fixes
    radix bits of x only; it is a design-doc family, and neither bit_window nor
    qr_window is implemented in src/, harness/ or tests/ of this repository
    (grep 2026-10-15). y-windows alone are IDEA-20260905-d0fee4 (size law,
    Bezout bound) and H-ECDLP-7f5b05 (Stage 0 only); height boxes are
    IDEA-20260913-c5f90d / H-ECDLP-b97b72. A joint window F_W = {P: x in
    [0,B1), |y| < B2} is in none of them. (B) |F_W / +-| ~ B1 B2 / p, so a
    matched cardinality B needs B1 B2 = pB; at B = (6N)^{1/3} ~ p^{1/3} this is
    ~p^{4/3}, side p^{2/3} when square. The Bombieri-Weil box count
    B1 B2/p + O(sqrt(p) log^2 p) is non-trivial only for B1 B2 >> p^{3/2}, i.e.
    B >> sqrt(p): below that scale the size of F_W is a random-model
    statement, like every short window. (C) Yield is conserved (KN-FIND-007), so
    thinning to a joint window changes nothing at matched B, and x-scan
    enumeration pays p/B2 lifts per base element (2 for the plain x-window).
    An advantage needs a box enumerator cheaper than B1: the one open number
    c_box(B1,B2) in [B, B1]. (D) Information bookkeeping for arity m: m curve
    equations + 1 sum equation in 2m integer unknowns of total bound product
    (B1B2)^m = p^{m+1}, the small-root threshold for every m, as in
    H-ECDLP-b97b72.
  mechanism: >-
    PAIR: representation = integer pair (x, y) in a box (R1: redundant integer
    representation of both coordinates); operation set Sigma = translation by
    base elements. TRICHOTOMY: Class I partial-action. LOSSY-PROJECTION TEST:
    (x, y) determines P, so the pair alone is a change of coordinates; the
    lossy part is the box restriction, a thinning by density 2B2/p of the
    x-window, Sigma-compatible only as the usual +- fold. Delta: first
    joint-coordinate predicate; priced by c_box, not by a new relation
    mechanism.
  novelty_status: adaptation
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-IC-5931ee
      - KR-IC-73db3f
      - KR-RHO-ea34b8
      - KR-RHO-13bf67
      - KR-IC-5a43e5
    nearest:
      - ref: KN-FIND-007
        provenance: internal
        relation: special_case
        delta: (C) is conservation applied to a thinned window.
      - ref: KR-IC-5a43e5
        provenance: kb
        relation: adjacent
        delta: >-
          Semaev S_{m+1} is the framework itself; the joint window changes
          only the factor base. S_{m+1} stays in x, and y enters through
          lifting and the box inequality.
      - ref: KR-RHO-13bf67
        provenance: kb
        relation: adjacent
        delta: >-
          Any gain must exploit the representation; a box enumerator
          c_box < B1 would be exactly such a use of coordinates, so the
          generic bound does not exclude it. It leaves (C) untouched.
      - ref: KR-RHO-ea34b8
        provenance: kb
        relation: adjacent
        delta: >-
          A joint-window base built once and reused over targets is a
          preprocessing object, bounded by S*T^2 = Omega(N); it is not a
          claimed route to the l^{1/3} online cost.
      - ref: KR-IC-73db3f
        provenance: kb
        relation: adjacent
        delta: subspace factor bases in char 2 lower degree; no analogue here.
      - ref: KR-IC-5931ee
        provenance: kb
        relation: adjacent
        delta: small-x and algebraic bases over F_p are no better than generic.
  citations:
    - ref: arXiv:1111.1543
      provenance: retrieved
      claim: upper bounds on points of y^2 = f(x) mod p in a square of side M
      verified_by: idea-generator (abstract only, 2026-10-15)
  assumptions:
    - >-
      The Bombieri-Weil box estimate quoted above is from a search snippet of a
      talk slide; the sharp statement is unread.
  proof_search_map:
    bottleneck: enumeration of E(F_p) points in a thin box
    baseline_embedding:
      parameter_slice: B2 = p/2 gives the plain x-window
      reproduction_check: scan efficiency 2 for qr-filtered x-windows
    observation_collision:
      observable: box point count
      distinct_preimage_search: translate boxes of equal shape share the law
    method_ceiling:
      strongest_certifiable_claim: no yield change at matched B; cost >= B
      nearby_object_control: height box of H-ECDLP-b97b72 (nonlinear Mobius)
  predictions:
    - metric: dispersion index Var/Mean of box counts over random translates
      direction: higher
      minimum_effect: 1.0 +- 0.1 expected; 1.3 or more is a lead
    - metric: lifts per base element for an anchored joint window
      direction: higher
      minimum_effect: p/B2 within 5 percent (exact bookkeeping)
    - metric: m = 3 coverage ratio vs matched random base
      direction: higher
      minimum_effect: none expected; 1.00 +- 0.01
  minimal_test:
    design: >-
      Exact enumeration at p ~ 2^20..2^28 (family members of
      IDEA-20261015-cba035 and random prime-order curves): all box counts for
      aspect ratios B1/B2 in {1/16, ..., 16} and sides from p^{1/3} to p^{3/4};
      dispersion index and z-score histogram; planted dense sub-box as
      sensitivity control; exact m = 3 coverage of anchored joint bases.
    controls:
      - random-curve null
      - x-only window
      - qr_window scan ratio 2.0
      - planted sub-box
      - translates of the same box
    required_metrics: [dispersion index with CI, lifts per element, coverage]
  falsification_conditions:
    - dispersion index >= 1.3 on >= 2 sizes in the family but not the null
    - planted sub-box not detected (instrument blind, run void)
  confounders: [aspect-ratio aliasing with x-only windows, +- fold double counting, boxes wrapping mod p]
  interpretation_limits: >-
    Counting only; no solver or relation claim. Does not touch the gamma_m
    question of H-ECDLP-b97b72. KN-OPEN-020 class: implicit membership (two
    inequalities plus a sqrt), explicit enumeration charged by c_box.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For sides below p^{3/4} the number of points of E(F_p) in an
        axis-parallel box is Poisson with mean B1 B2/p (index of dispersion 1).
      rigorous_support: Bombieri-Weil box count, non-trivial only above p^{3/4}
      validation_plan: >-
        dispersion index and z-score tails at three sizes, 5 curves each,
        10^5 translates per shape; tail = largest |z|; no transfer to 2^52
  target_complexity:
    time_exponent: none claimed; base construction >= B, <= pB/B2
    memory_exponent: O(B)
    best_known: rho 0.886 sqrt(N), O(1) memory
    hidden_overhead: p/(2 B2) thinning factor on x-scan enumeration
  dominated_by: n/a (no result claimed)
  sota_delta: none
  estimated_cost: {implementation: low, compute: low}
  recommended_priority: low
  status: proposed
  proposed_by: idea-generator
  source_refs: [RQ-CMFB-33610e]
