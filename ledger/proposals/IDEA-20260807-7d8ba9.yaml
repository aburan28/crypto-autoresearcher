idea:
  id: IDEA-20260807-7d8ba9
  question_id: RQ-SSI-001
  added: '2026-08-07'
  title: 'KN-OPEN-015 is used only as a SCOPE FENCE, never as a research object: its actual open
    question -- a general characterization of WHICH auxiliary data collapses an isogeny assumption
    -- is framed by no hypothesis, experiment or evidence record anywhere'
  class: mechanism
  claim: 'KN-OPEN-015 states the open question directly: ''a general characterization of which
    auxiliary data is fatal is not settled'', and records the worked template (auxiliary torsion
    image -> higher-dimensional embedding -> Kani reducibility -> recovery) plus the survivors
    that publish no torsion images. RQ-SSI-001 names it as one of three open problems the question
    addresses. But every committed use is a BOUNDARY CHECK rather than an investigation: RQ-SSI-001''s
    constraints require distinguishing broken SIDH from survivors; EV-SSI-001 states the findings
    ''do not close KN-OPEN-013, KN-OPEN-014, or KN-OPEN-015''; EV-SSI-0eb0b1 records only ''Torsion-image
    exclusion is sound (PASS)''; and GOAL-SSI-001''s objective keeps the torsion-image setting
    ''strictly out of scope as a positive target''. The exclusion discipline actively pushes away
    from studying the object. No record asks which auxiliary functionals are fatal in general.'
  mechanism: 'Define the auxiliary datum as a FUNCTIONAL on the Deuring side -- what the adversary
    learns as a submodule or subgroup, with its degree and level structure -- and classify which
    functionals admit a Kani-style higher-dimensional embedding. Rows: torsion images at known
    unbalanced degree (fatal, proven); orientation by a known small-degree endomorphism; a partial
    endomorphism; a degree revealed without images; a commitment to a subgroup. Each row carries
    a stated embedding ATTEMPT and a NAMED MISSING INGREDIENT where the attempt fails. The value
    is in the failures being named rather than the successes being counted.'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-07'
    grep_results:
    - GOAL-SQISIGN-002 (draft) instantiates the Kani template against ONE scheme's published surface;
      its completion criteria are an inventory plus a named missing ingredient, it explicitly
      does not attempt a characterization across auxiliary-data types, and it has never launched.
    - No hypothesis, experiment or evidence record anywhere asks the general question.
    conclusion: Screened against ledger/proposals, ledger/hypotheses and knowledge/; external
      novelty UNVERIFIED and not claimed.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS as the primary lens: attacking any specific scheme.
      The object is the AUXILIARY FUNCTIONAL, scheme-independently.'
    tracked_object: The auxiliary datum as a functional, tracked by the triple (what submodule
      it reveals, at what degree, with what level structure).
    one_step_propagation_rule: Revealing two functionals reveals their join; the triple composes
      by taking the generated submodule and the lcm of degrees.
    newness_score: The SIDH lesson is well known; stating it as a classification with named missing
      ingredients per row is what no record here does.
  lossy_projection_identifiability_audit:
    projection: the published transcript -> the submodule/degree/level triple it determines.
    what_is_discarded: The scheme's protocol structure and everything not expressible as a revealed
      submodule.
    is_it_only_a_change_of_coordinates: 'NO -- many transcripts give the same triple, which is
      the point: the classification is over triples, not over schemes. Honest caveat: a functional
      not expressible in this form escapes the classification entirely, and the record must say
      which ones those are rather than pretend the taxonomy is closed.'
    mirror_failure_check: CHECKED. The classification must NOT mark every row fatal. The torsion-image
      row is fatal by a published attack and the no-auxiliary-data row is safe by definition,
      so two distinct verdicts are forced before any analysis.
  null_object_control:
    primary_null: 'THE MISSING-INGREDIENT CONTROL: for each row marked NOT fatal, SUPPLY the named
      missing ingredient artificially and check that the audit then fires and produces the recovery.
      A classification whose ''safe'' verdicts cannot be flipped by supplying the ingredient is
      not distinguishing anything.'
    secondary_nulls:
    - 'FORCED FATAL: the SIDH torsion-image row must come out fatal.'
    - 'FORCED SAFE: the empty-auxiliary-data row must come out safe.'
  assumptions: []
  predictions:
  - metric: number of rows whose embedding attempt fails for a NAMED reason rather than for 'no
      attack known'
    direction: higher
    minimum_effect: At least three rows with a named missing ingredient; that is what makes the
      table reusable rather than a survey.
  minimal_test:
    design: Build the five-row table; for each row attempt the Kani-style embedding explicitly
      and record either the recovery or the named missing ingredient; run the missing-ingredient
      control on every safe row and the two forced-value gates.
    controls:
    - missing-ingredient supply control
    - forced-fatal SIDH row
    - forced-safe empty row
    required_metrics:
    - per-row embedding verdict
    - per-row named missing ingredient
    - list of functionals the framework cannot express
  falsification_conditions:
  - 'Every row is fatal: the classification collapses and the honest output is that publishing
    any auxiliary structure is dangerous, which is a stronger and more useful statement than the
    current fence.'
  - 'No row''s safe verdict can be flipped by supplying its named ingredient: the ingredients
    are not the operative distinction and the taxonomy is wrong.'
  - 'The framework cannot express the functionals that matter for the surviving schemes: recorded
    as the framework''s boundary, which is itself the answer to ''is a general characterization
    available''.'
  confounders:
  - A row marked safe means only that no embedding is known within this framework; that is not
    a security proof and the table must say so on every row.
  - Kani reducibility conditions depend on degree balance; a row's verdict can flip with parameters,
    so parameters must be stated per row.
  interpretation_limits:
  - This is a classification, not an attack. No scheme is claimed broken.
  - Rows are conditional on the Kani template being the operative mechanism; a different higher-dimensional
    embedding could change any verdict.
  heuristic_assumptions:
  - id: HEUR-AUX-1
    statement: The Kani higher-dimensional embedding is the operative mechanism for auxiliary-data
      attacks in this family.
    rigorous_support: The published SIDH break instantiates it; nothing establishes it is the
      only route.
    validation_plan: State it as the framework's boundary and list functionals outside it.
  target_complexity:
    time_exponent: n/a -- classification
    memory_exponent: n/a
    best_known: The published SIDH attacks for the torsion-image row
    hidden_overhead: n/a
    tradeoff_note: No attack proposed.
  dominated_by: n/a (no attack claimed); the SIDH break dominates the one row where an attack
    exists.
  sota_delta: ZERO. Turns the corpus's most transferable isogeny lesson from a fence into a reusable
    classification, and gives GOAL-SQISIGN-002 and any future scheme audit a template to instantiate
    rather than re-derive.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 0.85 that a five-row table with named ingredients is writable from
    what is already in the corpus plus retrievable sources. 0.5 that at least three rows get a
    genuinely named missing ingredient rather than 'no attack known'. 0.1 that any row currently
    believed safe flips, which would be a significant result and would need immediate red-teaming.
