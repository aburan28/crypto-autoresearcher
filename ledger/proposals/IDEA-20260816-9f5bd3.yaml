idea:
  id: IDEA-20260816-9f5bd3
  question_id: RQ-SLHDSA-001
  added: '2026-08-16'
  title: Measure the FORS few-time forgery probability as an exhaustive function of the reuse count,
    at parameters small enough to enumerate the entire revealed-index state space, and compare the
    measured curve against the occupancy law this program already derived analytically, arm by arm
    rather than as a headline.
  class: measurement
  claim: '(A) The few-time signature layer''s whole exposure to reuse is carried by one object that
    is small enough to enumerate: the family of revealed index sets S = (S_1, ..., S_k) with S_t a
    subset of [2^a], accumulated over the gamma signatures issued under one FORS key. A forger restricted
    to reassembling already-revealed leaves succeeds on a target digest exactly when every one of
    its k indices lies in the corresponding S_t, so the success probability conditional on S is the
    exact product of |S_t|/2^a, and no estimation is involved. (B) At a in {2,3,4} and k in {2,3,4}
    the entire state space of S is enumerable, so the distribution of that product over the randomness
    of the digest map can be computed by exhaustive summation rather than sampled, giving a measured
    curve in gamma with zero statistical error on the enumerable side. (C) This program already holds
    the analytic law for that curve as statement (ii) and (iii) of H-SLHDSA-3a403a, expressed through
    the Stirling-number sum T_k(lambda) and its leaf-collision refinement E[m(X)^k]. Those statements
    are derivations with no run behind them. The measurement proposed here is their instrument-validity
    arm: it computes what the law predicts and what an enumerated toy signer actually does, at the
    same parameters, in the same invocation. (D) Running the identical enumeration against indices
    drawn from a lazily sampled random oracle separates two different quantities that the analytic
    law conflates: the combinatorics of set accumulation, which the null must reproduce exactly, and
    whatever a concrete truncated hash contributes on top, which is the only thing the signal arm
    can add. (E) WHAT IS NOT CLAIMED: no forgery, no attack, no security level, no bit count for any
    FIPS 205 parameter set, no improvement to any known attack, and no statement about SHA-2 or SHAKE.
    A gap between the measured curve and the analytic law would be a defect in one of the two, most
    likely in the toy instrument, and the contract is written so that perfect agreement is a complete
    and publishable outcome.'
  mechanism: 'STAGE A: implement the revealed-set accumulator directly, with no signer attached, as
    a pure combinatorial object. For fixed (a, k, gamma) enumerate every reachable S by iterating
    over all gamma-tuples of index vectors when 2^{ak gamma} is small, and by exact dynamic programming
    over per-tree occupancy counts when it is not, since the k trees are independent given the digest
    map and the product form factorizes. Emit the exact distribution of the success product and its
    mean. STAGE B: compute the analytic prediction 2^{-ak} T_k(lambda) and the leaf-collision refinement
    2^{-ak} E_{X~Poisson(lambda)}[m(X)^k] with m(g) = 2^a (1 - (1 - 2^{-a})^g), at the identical (a,
    k, gamma), using exact rational arithmetic so the comparison is not floating-point noise. STAGE
    C: attach the accumulator to a toy signer whose digest map is a truncated concrete hash, and re-measure
    the same curve by Monte Carlo, with the enumerated value as ground truth. STAGE D: replace the
    digest map with a lazily sampled random oracle and repeat STAGE C unchanged inside the same process.
    STAGE E: report three curves against gamma -- exact enumeration, concrete-hash Monte Carlo, oracle
    Monte Carlo -- plus the two analytic curves, with the differences and their confidence bands.
    The refinement claim (iii) of H-SLHDSA-3a403a, that the refinement is strictly smaller, is checked
    as an inequality at every tested (a, k, gamma) and either confirmed pointwise or contradicted
    with the counterexample recorded.'
  novelty_status: unverified
  novelty_screen:
    method: grep -ril for FORS, few-time, reuse count, occupancy, hypertree over ledger/proposals/,
      ledger/hypotheses/, knowledge/. Read ledger/questions/RQ-SLHDSA-001.yaml in full, the statement
      block of ledger/hypotheses/H-SLHDSA-3a403a.yaml, and experiments/EXP-SLHDSA-9cbad4/specification.yaml
      including its what_this_is_not and claim_ceiling blocks. Extracted id, question_id and title
      for all twelve SLH-DSA-touching proposals. Checked the three records the string reuse count
      returns (IDEA-20260815-f11674, IDEA-20260816-fa13f6, IDEA-20260813-533bc4) for their question_id.
    results: 'The occupancy lane is the most crowded lane on RQ-SLHDSA-001. IDEA-20260805-fbe36a proposes
      exactly the analytic re-derivation 2^{-ak} T_k(q/2^h) with the leaf-collision correction computed
      rather than dropped; IDEA-20260808-02a046 proposes the union-bound-versus-exact-generating-function
      ratio in closed form; IDEA-20260805-705614 is the quantifier-order audit of the same bound;
      IDEA-20260801-009 is the original slack meter. H-SLHDSA-3a403a states the law as (i) through
      (v) and EXP-SLHDSA-9cbad4 is its unapproved contract, status review_required, frozen false,
      with no run recorded anywhere in the repository. Every one of these four proposals and the hypothesis
      is analytic: not one contains an enumerated or measured curve, and EXP-SLHDSA-9cbad4 has never
      been authorized. The string reuse count returns only records on other research questions. No
      record enumerates the revealed-index state space, and no record runs a concrete-hash arm against
      an oracle arm on this object.'
    verdict: 'UNVERIFIED. Occupancy statistics for few-time signatures are an old and standard subject
      and this program cannot read external literature, so nothing is asserted about what exists outside
      this repository. What is claimed new is strictly internal and strictly instrumental: this repository
      holds five analytic statements of a law and zero measurements of it, and the specific move here
      -- exhaustive enumeration of the revealed-set state space at parameters where enumeration is
      complete, used as ground truth against which both the analytic law and a concrete-hash arm are
      checked -- is assembled from standard parts (exact DP over occupancy, Monte Carlo, an oracle
      null) applied to a lane this repository has never taken past derivation.'
  object_first_candidate:
    tracked_object: The family of revealed index sets S = (S_1, ..., S_k), each S_t a subset of the
      leaf alphabet [2^a], accumulated over the gamma signatures issued under a single FORS key. This
      is the object followed as signatures are issued, and the forgery-success probability conditional
      on it is the product over t of |S_t| / 2^a.
    lossiness: 'The projection discards the leaf secret values themselves, every authentication path,
      the messages signed, the public key, and the order in which the gamma signatures were issued.
      What survives is membership only. This is genuinely lossy: from S one cannot reconstruct a single
      secret leaf, a single signature, or the identity of any message. It propagates because the conditional
      success probability is a function of S alone under the stated adversary restriction, and because
      the accumulation rule -- union with the new signature''s index vector -- reads nothing that
      was discarded. It fails to propagate, and this is stated as the object''s boundary, the moment
      the adversary is allowed to invert a leaf hash: preimage attacks act on the discarded values
      and are invisible to this object, which is why survival_score reports where the projection stops
      rather than claiming completeness.'
    propagation: 'One signing step under the same FORS key acts on the tracked object as S_t <- S_t
      union {i_t}, where (i_1, ..., i_k) is the index vector the digest map assigns to the new message.
      This is an idempotent monotone union, so the object is a monotone accumulator whose per-tree
      cardinality |S_t| is a coupon-collector count: after gamma signatures its expectation is exactly
      m(gamma) = 2^a (1 - (1 - 2^{-a})^gamma), and the k trees are conditionally independent given
      a digest map that is unbiased across trees, which is the assumption the null arm tests rather
      than grants.'
    survival_score: 'Concretely: the projection is exact for the reassembly adversary at every gamma,
      and its enumeration is complete while 2^a k gamma stays inside the enumerable range, which at
      a=4, k=4 holds to gamma about 64 by exact dynamic programming over per-tree occupancy and to
      gamma about 8 by brute-force enumeration of index tuples. Above that, exactness is retained
      by the DP and lost only by brute force. The object itself dissolves not at a parameter size
      but at a change of adversary: the moment leaf-hash inversion is permitted, membership is no
      longer sufficient and the tracked object carries no information about the new route. That boundary
      is reported as the survival score, not a gamma value.'
  null_object_control: The identical enumeration and Monte-Carlo pipeline is run with the digest map
    replaced by a lazily sampled random oracle over the same index alphabet, in the same process invocation,
    on the same seeds and the same gamma grid. The null must reproduce the exact enumerated curve
    to within its Monte-Carlo band at every gamma, because under a uniform digest map the enumerated
    combinatorics is by construction the truth. If the oracle arm deviates from the enumeration, the
    measurement pipeline is broken and no statement about the concrete-hash arm is admissible. Only
    the difference between the concrete-hash arm and the oracle arm can carry information about the
    hash, and the contract pre-registers that this difference is expected to be zero within band.
  discriminated_from:
  - 'IDEA-20260805-fbe36a: proposes the analytic occupancy moment with the leaf-collision correction
    computed, at FIPS 205 parameters, as a closed-form curve in q. It computes; this measures, at
    toy parameters where enumeration is exhaustive, and treats fbe36a''s own output as the prediction
    under test.'
  - 'IDEA-20260808-02a046: the ratio of a union bound to an exact coverage generating function, in
    closed form and converted to signature bytes. No run, no enumeration, and its object is the bound''s
    slack rather than the revealed-set family.'
  - 'IDEA-20260805-705614: a quantifier-order audit establishing that no worst-case-occupancy bound
    is non-vacuous at these parameters. That is a symbolic exclusion over the reachable occupancy
    set; this is an exact distribution over it.'
  - 'H-SLHDSA-3a403a and EXP-SLHDSA-9cbad4: the hypothesis states the law and the contract would evaluate
    it at FIPS 205 parameters, at status review_required with no run recorded. This proposal is the
    toy-scale instrument-validity arm those two lack, and would supply the ground truth a later evaluation
    of that contract could be checked against.'
  - 'IDEA-20260805-88ecef and IDEA-20260808-ae34ad: both argue about how the resulting advantage should
    be charged (memory-access exponent, approximate set membership). They take the probability as
    given input; this produces it.'
  assumptions:
  - The adversary considered is restricted to reassembling revealed leaves; leaf-hash inversion is
    out of scope and its exclusion is stated, not established.
  - The k FORS trees receive index components that are conditionally independent given the digest
    map; this is what the concrete-hash arm tests against the oracle arm rather than assumes.
  - The exact dynamic programming over per-tree occupancy is equivalent to brute-force enumeration
    wherever both are runnable, which is checked on the overlap rather than argued.
  - The toy signer preserves the accumulation structure at reduced (a, k), in the sense that per-tree
    index selection is the only mechanism by which reuse accumulates.
  - The parameter constants and structural description used here come from records in this repository
    that mark themselves UNVERIFIED against primary text.
  predictions:
  - metric: maximum absolute difference between the exactly enumerated mean success product and the
      analytic value 2^{-ak} E[m(X)^k], over the tested (a,k,gamma) grid
    direction: lower
    minimum_effect: 0.02
  - metric: difference in measured mean success product between the concrete-truncated-hash arm and
      the lazily sampled random-oracle arm at gamma=8
    direction: lower
    minimum_effect: explicit refusal to pre-commit a nonzero effect. The honest pre-registration is
      that the two arms agree within the Monte-Carlo band; pre-committing to a nonzero gap would amount
      to predicting a weakness in a concrete hash that this program has no basis whatever to predict,
      and would bias the analysis toward finding one.
  - metric: monotonicity of the measured mean success product in gamma, checked pointwise over the
      grid
    direction: higher
    minimum_effect: 0
  - metric: fraction of tested (a,k,gamma) triples at which the leaf-collision refinement is strictly
      below the unrefined Stirling-sum value, as H-SLHDSA-3a403a statement (iii) asserts
    direction: higher
    minimum_effect: 1
  minimal_test:
    design: 'One parameter point settles the method. Fix a=3, k=3, so each tree has eight leaves and
      the joint revealed-set space has 2^24 states, which enumerates in seconds. For gamma = 1 through
      16, compute the exact distribution of the product of |S_t|/8 by dynamic programming over the
      three independent per-tree occupancy counts, and its mean. Compute the two analytic predictions
      at the same points in exact rational arithmetic. Then run 10^6 Monte-Carlo trials in each of
      two arms -- a truncated concrete hash as digest map, and a lazily sampled random oracle -- inside
      one process invocation, on three seeds. The discriminating observable is the triple of differences:
      enumeration versus analytic law, oracle arm versus enumeration, concrete arm versus oracle arm.
      The first says whether the derivation in H-SLHDSA-3a403a is right at a point; the second says
      whether the pipeline works at all; the third is the only place a hash-specific effect could
      appear. Total cost is minutes, and any of the three differences being large is informative in
      a different direction.'
    controls:
    - Lazily sampled random-oracle digest map, identical pipeline, same invocation, same seeds and
      gamma grid.
    - Exact enumeration as ground truth wherever it is runnable, with the dynamic-programming and
      brute-force routes cross-checked on their overlap.
    - Exact rational arithmetic for the analytic curves, so that any observed gap cannot be floating-point.
    - A gamma=0 arm, where the measured success product must be exactly zero, as a pipeline sanity
      floor.
    - Three independent seeds per Monte-Carlo arm with the between-seed spread reported next to every
      number.
    required_metrics:
    - exactly enumerated mean and full distribution of the conditional success product, per (a,k,gamma)
    - analytic Stirling-sum value and leaf-collision-refined value in exact rational form, per (a,k,gamma)
    - Monte-Carlo mean success product, concrete-hash arm, with band
    - Monte-Carlo mean success product, random-oracle arm, with band
    - per-tree revealed-set cardinality distribution versus the coupon-collector prediction m(gamma)
    - pointwise sign of the refinement inequality across the grid
  falsification_conditions:
  - 'The random-oracle arm deviates from the exact enumeration beyond its Monte-Carlo band: the pipeline
    is wrong and no other comparison may be reported.'
  - 'The dynamic-programming and brute-force enumerations disagree anywhere on their overlap: the
    ground truth is not ground truth.'
  - 'The refinement inequality of H-SLHDSA-3a403a statement (iii) fails at any tested triple: that
    statement is contradicted at toy parameters and the counterexample supersedes it.'
  - 'Measured per-tree cardinality departs from m(gamma) in the oracle arm: the accumulation model
    itself is wrong, independent of any hash.'
  - 'The concrete-hash arm and the oracle arm differ beyond band: either the truncation is interacting
    with the index extraction, which is the object of the companion randomizer entry, or the concrete
    arm is misimplemented; both must be excluded before anything is said.'
  - 'Measured success product is non-monotone in gamma: the accumulator is not accumulating and the
    instrument is broken.'
  confounders:
  - Truncating a concrete hash to a very short digest makes index components collide for reasons of
    truncation width rather than hash structure, which would present as a concrete-versus-oracle gap
    that has nothing to do with the hash.
  - At small a the per-tree alphabet saturates quickly, so the curve flattens and the dynamic range
    between gamma values collapses, making differences look small for a structural reason.
  - Monte-Carlo bands at 10^6 trials are wider than the analytic gaps at large gamma, so an apparent
    agreement may be a failure of resolution rather than an agreement.
  - The index-extraction routine bins digest bits into k components; a bit-allocation that is not
    a multiple of the digest width introduces its own bias, which is a separate object and must be
    held fixed here.
  - Exact rational arithmetic on Stirling numbers overflows into slow paths at larger k, tempting
    a float shortcut that would silently reintroduce the noise the design excludes.
  interpretation_limits:
  - Agreement between the measured curve and the analytic law at toy (a,k) supports the law's algebra,
    not its applicability to any FIPS 205 parameter set.
  - The reassembly adversary is a restriction; nothing here bounds an adversary that inverts leaf
    hashes, and no number produced is a security level.
  - A zero concrete-versus-oracle gap is evidence about this truncation and this toy signer, not about
    SHA-2 or SHAKE.
  - Nothing here touches the fault or memory-corruption claim class, and no artifact of this proposal
    may be reported alongside one.
  target_complexity:
    time_exponent: No attack exponent is claimed. The measurement's own cost is O(gamma x 2^a x k)
      per dynamic-programming evaluation and O(trials x k) per Monte-Carlo trial; the enumeration
      is exact within those bounds and is not an attack cost.
    memory_exponent: No attack memory exponent is claimed. The dynamic programming holds O(2^a) occupancy
      states per tree, well under a megabyte at the tested parameters; the lazily sampled oracle table
      is capped at 2^22 entries with the cap enforced in code.
    best_known: The incumbent to beat inside this repository is the analytic curve stated in H-SLHDSA-3a403a
      and proposed for computation in IDEA-20260805-fbe36a and IDEA-20260808-02a046, none of which
      has a run behind it. This proposal does not beat it on any cost axis; it supplies the ground
      truth against which it can be checked. No claim is made about what exists outside this repository.
    hidden_overhead: 'The hidden cost sits in exactness. Exact rational arithmetic over Stirling numbers
      of the second kind is where the wall clock actually goes, and the temptation to drop to floating
      point at larger k would silently reintroduce noise of the same order as the effects being resolved.
      In human cost: the dynamic programming and the brute-force enumeration must be written independently,
      by construction, or the cross-check is circular, and that duplication is most of the implementation
      budget.'
  dominated_by: 'n/a (no result claimed). Checked against every frontier row this repository maintains
    for time, memory and data/queries: this produces an exact toy-scale distribution, which has no
    coordinate on any of those axes because it is not an attack, so nothing dominates it and it dominates
    nothing. It is not entered on any frontier.'
  sota_delta: 'no attack; conceptual/measurement contribution only. Against this repository''s own
    state the delta is countable: five analytic statements of the occupancy law exist, zero measurements
    of it exist, and this would make the count one, with the agreement gap reported as a number with
    a band rather than as a verdict.'
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Separable parts. (1) That the exact enumeration can be built and cross-checked
    against brute force on the overlap: about 0.9, it is bounded combinatorics with a known factorization.
    (2) That the enumerated curve agrees with the analytic law of H-SLHDSA-3a403a statements (ii)
    and (iii) to within 0.02 across the grid: about 0.7. I expect agreement, but the derivation has
    never been run and small constant errors in Stirling-sum indexing are exactly the kind of thing
    enumeration catches. (3) That the refinement inequality holds pointwise at every tested triple:
    about 0.8, it is asserted as strict and strictness at the smallest gamma is where I would look
    first. (4) That the concrete-hash arm and the oracle arm agree within band: about 0.85, and I
    want to be explicit that a disagreement would most likely mean the truncation width is interacting
    with index extraction rather than anything about the hash. (5) That the deliverable is useful
    to the analytic lane even under full agreement: about 0.95, since full agreement is precisely
    what makes fbe36a and 02a046 safe to evaluate at larger parameters.'
