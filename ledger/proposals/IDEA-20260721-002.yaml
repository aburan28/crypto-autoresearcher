idea:
  id: IDEA-20260721-002
  title: p-exponent audit of the four supported_scoped structural signals
  class: measurement
  claim: >-
    Each supported_scoped signal (INCB richness excess, BKKMV mixed-volume gap, JETB
    jet-advantage, SIG cascade residual) has an advantage magnitude whose growth exponent
    in p is ZERO (bounded constant), which is the common reason none converts to sub-rho.
    A single signal with a positive p-exponent would be a genuine lead.
  mechanism: >-
    A sub-rho algorithm needs an advantage that grows with p. A per-relation structural
    excess that is O(1) and uncorrelated across the Theta(factor-base) relations yields
    only a bounded total factor. This proposal measures the exponent directly.
  novelty_status: speculative
  assumptions:
    - each existing instrument can be re-run across a controlled p-range
    - the per-signal magnitude is defined and comparable across p
  predictions:
    - metric: fitted growth exponent of each signal's advantage vs p
      direction: different
      minimum_effect: "all exponents statistically consistent with 0; any > 0 falsifies the common-obstruction claim"
  minimal_test:
    design: >-
      Re-measure each of the four signals at >=4 field sizes with confound control
      (fixed relative regime), fit magnitude vs p on a log-log scale, report exponent + CI.
    controls: [matched random/null per signal; saturation control per KN-FIND-001 method]
    required_metrics: [per-signal magnitude, fitted exponent, 95% CI]
  falsification_conditions:
    - "any signal's advantage exponent CI lower bound > 0 (a p-growing lead exists)"
  confounders: [low-count noise at large p, saturation at small p, instrument scale limits]
  interpretation_limits:
    - confirms/strengthens the barrier if all exponents are 0; that is not a breakthrough
    - the ONE realistic breakthrough path left: a confirmed signal that secretly grows with p
  estimated_cost: {implementation: low, compute: low}
  recommended_priority: high
  proposed_by: idea-generator
