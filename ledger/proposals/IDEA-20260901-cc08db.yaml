idea:
  id: IDEA-20260901-cc08db
  question_id: RQ-RSA-afe33c
  research_question: RQ-RSA-afe33c
  goal_id: GOAL-RSA-001
  added: '2026-09-01'
  title: >-
    WHERE DOES KNOWING SOMETHING START TO MATTER: the operative leakage
    threshold is not the Coppersmith fraction but the BREAK-EVEN fraction
    f*(n, theta, D) at which brute force over the excess unknown bits plus a
    lattice at dimension D costs the same as memory-charged NFS -- computable
    in closed form from the two RSA goals' own deliverables (H-RSA-68884a's
    c(theta) family on the no-information side, the dimension-loss law of
    IDEA-20260901-c75e81 on the leakage side), predicted to sit BELOW the
    asymptotic fraction by (log2 C_NFS(n, theta) - log2 T_lat(n, D)) bits of
    window plus the dimension loss, and predicted to move DOWN when memory
    is charged because NFS is charged and the lattice route is not -- with
    the direction a theorem under the two models and the magnitude the
    deliverable, and with the lattice-side term validated on known-answer
    instances while the NFS term stays a flagged model input
  class: composition

  claim: >-
    FIVE SEPARABLE CLAIMS, ALL ABOUT COST MODELS. (A) THE OBJECT. For a
    balanced n-bit modulus with p of n/2 bits, let w be the number of
    unknown bits of p under a contiguous leak. A small-root construction at
    lattice dimension D certifies recovery for w <= w_lat(n, D), which for
    the univariate approximate-divisor family is n/4 minus the dimension
    loss of IDEA-20260901-c75e81 -- n/(4(D-1)) plus a constant of at most
    about one bit -- conditional on that record's derivation being confirmed
    against the filed primary text. For w above w_lat the standard route is
    brute force over the excess k = w - w_lat with one reduction per guess,
    cost 2^k T_lat(n, D) with polynomial memory, where T_lat is the measured
    per-reduction cost (or the chained cost of Bi et al. when chaining
    applies). NFS costs C_NFS(n, theta) under the charging convention theta
    of H-RSA-68884a. The break-even excess is k*(n, theta, D) = log2 C_NFS -
    log2 T_lat, the operative window is w* = w_lat + k*, and the operative
    leaked fraction is f* = 1 - w*/(n/2). (B) THE FIRST CLAIM is that f* is
    the number severity triage should compare a leak against, not one half:
    a leak between f* and one half is exploitable at NFS cost or less, and a
    leak below f* is not exploitable by this route at all, so the region
    where 'knowing something matters' begins at f*, and f* is a function of
    the budget and the convention rather than a constant. (C) THE SECOND
    CLAIM, A THEOREM UNDER THE TWO MODELS: df*/dtheta < 0. C_NFS increases
    with theta by H-RSA-68884a (c(theta) strictly increasing on its ladder),
    while the brute-force-plus-lattice route holds one basis of O(D^2 m n)
    bits per processor and no shared table, so under the same S^theta rule
    its charged cost differs from its step count by a polynomial factor that
    is negligible against 2^k; hence charging memory lowers f*. The
    MAGNITUDE at theta = 1/3 is derived in-record from H-RSA-68884a's c
    values, ignoring the o(1): the exponent difference c(1/3) - c(0) =
    0.0266 multiplies (ln N)^{1/3} (ln ln N)^{2/3}, which at n = 2048 is
    about 42, giving about 1.6 bits of window -- so the convention question
    that moves RSA-versus-ECC equivalences by tens of bits
    (IDEA-20260808-56e892) moves the leakage break-even by one or two bits,
    and that smallness is itself the finding. (D) THE THIRD CLAIM is that
    the lattice-side term is MEASURABLE on known-answer instances at sizes
    this harness reaches: T_lat(n, D) and w_lat(n, D) are measured, not
    modelled, and the brute-force term is validated by actually running 2^k
    reductions at small k and confirming the count. (E) WHAT IS NOT CLAIMED.
    No factorisation, no NFS run, no NFS ingredient: C_NFS enters as a black
    box from GOAL-RSA-001 and is flagged unverified until that goal's
    record-reproduction gate passes. No statement about any deployed key. No
    claim that brute-force-plus-lattice is the best partial-information
    route -- it is the baseline route, and a better one lowers w* further.
    No numerical value of C_NFS at any n is asserted anywhere in this
    record.

  mechanism: >-
    The two RSA goals each produce a cost curve and neither can be read
    against the other today. GOAL-RSA-001 produces C_NFS(n, theta), the cost
    of knowing nothing; GOAL-RSA-002 produces w_lat(n, D) and T_lat(n, D),
    the reach and cost of a lattice at a budget. The composition is one
    equation: the leak is worth exploiting exactly when 2^{w - w_lat} T_lat
    < C_NFS, and solving for w gives the operative window. Every term is
    either a measured quantity from one goal or a flagged model input from
    the other, and the convention parameter theta enters only through
    C_NFS, which is what makes the direction of df*/dtheta a theorem rather
    than a measurement. The reason the magnitude is small is structural:
    theta multiplies an L-notation exponent, so its effect on log2 C_NFS is
    a few percent of a number in the low hundreds, while k* is that number
    minus log2 T_lat, so a few bits move; whereas for RSA-versus-ECC the
    same few percent are compared against a DIFFERENT primitive's exponent
    and translate into a modulus-size shift of many bits. The record makes
    that contrast explicit because both statements are about the same
    theta and a reader who has seen one will expect the other.

  novelty_status: unverified

  citations:
    - ref: H-RSA-68884a
      provenance: internal
      claim: >-
        The one-parameter family c(theta)^3 = 4(2+theta)^4/(9(1+theta)^2)
        with c strictly increasing on the ladder theta in {0, 1/6, 1/4, 1/3,
        5/12, 1/2}, and the explicit statement that relation collection has
        O(1) live state per processor while block Wiedemann holds a shared
        object of size L[beta]. Read in full. The difference c(1/3) - c(0) =
        0.0266 used in claim (C) is taken from that record's own decimals.
      verified_by: this idea-generator session, read in full
    - ref: IDEA-20260808-56e892
      provenance: internal
      claim: >-
        Charging memory moves RSA and ECC by different amounts, so
        cross-primitive equivalences are convention-dependent in a
        computable direction; derives a shift of about 92 bits of modulus at
        theta = 1/3. This record is the same argument shape applied to the
        no-information versus partial-information routes of ONE primitive,
        where the same theta moves the answer by one or two bits, and the
        contrast is stated.
      verified_by: this idea-generator session, read through the claim block
    - ref: IDEA-20260901-c75e81
      provenance: internal
      claim: >-
        Same session. The dimension-loss law w_lat(n, D) = n/4 - n/(4(D-1))
        minus a constant of at most about one bit for the univariate family,
        derived in that record and conditional on confirmation against the
        filed primary text.
      verified_by: this idea-generator session, authored in the same session
    - ref: IDEA-20260816-b4e5b7
      provenance: internal
      claim: >-
        Defines r_hat and R(n, D) and requires per-cell reduction time and
        peak memory; those cells are the measured T_lat and w_lat this
        record consumes.
      verified_by: this idea-generator session, read through claim (D)
    - ref: >-
        Bi, Coron, Faugere, Nguyen, Renault, Zeitoun, Rounding and chaining
        LLL: finding faster small roots of univariate polynomial congruences
        (PKC 2014; ePrint 2014/437)
      provenance: retrieved
      claim: >-
        Abstract retrieved this session: rounding gives a provable speedup of
        LLL on Coppersmith matrices; chaining exploits relations between the
        matrices of an exhaustive search so the reductions are not
        independent; together hundreds of times faster for typical
        parameters. This is the dominating baseline for the brute-force
        term: T_lat in k* must be the chained per-guess cost where chaining
        applies, and the record measures both.
      verified_by: WebFetch of the ePrint 2014/437 abstract page on 2026-09-01
    - ref: KN-TECH-035
      provenance: kb
      claim: >-
        In-corpus full-cost convention under which a shared table of S
        entries pays a clock cycle S^{1/3}; the source of theta = 1/3 for
        this program. Not re-read this session; cited as H-RSA-68884a cites
        it.
      verified_by: via H-RSA-68884a's structural_ingredients block
    - ref: KN-TECH-057
      provenance: kb
      claim: >-
        In-corpus matched-baseline discipline: O(1) per-processor storage
        gives full cost equal to step count. The brute-force-plus-lattice
        route is charged under this rule in claim (C).
      verified_by: via H-RSA-68884a's structural_ingredients block

  novelty_screen:
    method: >-
      Filesystem and ledger screening plus web. Read all twenty-two
      RQ-RSA-afe33c proposals by title, the claim blocks of 56e892, b4e5b7
      and 1775f2's descendant H-RSA-68884a in full, and the fourteen
      RQ-RSA-d46f02 titles; searched the web for meet-in-the-middle and
      time-memory tradeoffs combined with Coppersmith partial key exposure
      and retrieved the chaining-LLL abstract.
    results: >-
      IDEA-20260808-56e892 is the nearest committed record and is the same
      argument for a different pair (RSA versus ECC); IDEA-20260816-736c60
      asks whether two leaks add; IDEA-20260816-b4e5b7 measures the
      achievability ratio. None defines a break-even leakage fraction
      against the no-information cost or states how the charging convention
      moves it. Externally, the practice of brute-forcing excess bits before
      a Coppersmith lattice is standard and the chaining paper optimises it;
      no opened source composes it with a memory-charged NFS cost to define
      an operative threshold.
    verdict: >-
      UNVERIFIED. The composition is elementary and the direction claim is
      a theorem under two in-corpus models; the object f* and the contrast
      with 56e892 are not in any committed record. Retrieval index empty.

  object_first_candidate:
    tracked_object: >-
      THE BREAK-EVEN EXCESS k*(n, theta, D) = log2 C_NFS - log2 T_lat, and
      the operative fraction f* it defines. Established families declared
      OFF-LIMITS as the primary lens: NFS internals (owned by the parallel
      GNFS question and by GOAL-RSA-001), lattice construction design, and
      the asymptotic Coppersmith fraction. This record composes two
      finished curves; it does not improve either.
    lossiness: >-
      PASSES THE LOSSY-PROJECTION TEST TRIVIALLY. From two cost curves and
      a reach curve it retains one scalar per (n, theta, D) and discards
      everything else; the retained scalar is exactly the quantity a
      severity judgement compares a leak against, and it is compatible with
      the operations that generate its inputs -- changing theta moves C_NFS
      and hence k* monotonically, changing D moves w_lat and T_lat in
      opposite directions and the record reports the D that maximises w*.
    propagation: >-
      ONE-STEP PROPAGATION: incrementing D by one changes w_lat by about
      n/(4(D-1)^2) bits and T_lat by the reducer's marginal cost; the
      record reports both increments so the D that maximises w* at fixed
      C_NFS can be read off and is itself a deliverable.
    survival_score: >-
      Survives wherever both input curves exist. Dissolves exactly where
      GOAL-RSA-001's gate has not passed -- C_NFS is then a flagged input
      and f* inherits the flag -- and where the lattice route is not the
      univariate approximate-divisor family, for which the dimension-loss
      law is not derived here.

  proof_search_map:
    bottleneck: >-
      The absence of any quantity in this program that says at what leakage
      a partial-information route beats the no-information route. Both
      goals' completion criteria ask for a COST record with an
      affected-versus-safe scope, and the scope boundary between 'this leak
      matters' and 'this leak does not' is f*, which neither goal computes
      alone.
    baseline_embedding:
      parameter_slice: >-
        theta = 0 and D to infinity: k* = log2 C_NFS(n, 0) - log2 T_lat and
        w_lat = n/4, recovering the informal folklore statement 'half the
        bits of p plus whatever brute force NFS-cost affords'. The record
        must reproduce that slice exactly before reporting any theta or D
        dependence.
      reproduction_check: >-
        SYMBOLIC: with C_NFS and T_lat as symbols, f*(n, 0, infinity) = 1/2 -
        (log2 C_NFS - log2 T_lat)/(n/2), checked as an identity; and
        numerically at small n where the brute-force count is actually run
        (STEP 3 below) the measured 2^k T_lat must match the model within a
        factor 2.
    observation_collision:
      observable: >-
        The scalar f*.
      distinct_preimage_search: >-
        A COLLISION IS PRE-DECLARED: many (C_NFS, T_lat, w_lat) triples give
        the same f*, and in particular a change in theta can be offset by a
        change in D. f* therefore cannot identify theta from a leakage
        measurement, exactly as c cannot identify theta in H-RSA-68884a; the
        record never attempts that inference and reports f* as a surface
        over (theta, D), never as a number.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace 'is this leak severe' by the exact inequality 2^{w - w_lat}
          T_lat < C_NFS, with interface obligations: w_lat and T_lat measured
          under GOAL-RSA-002's convention, C_NFS supplied under GOAL-RSA-001's,
          and the two conventions bound to each other as both goals require.
        predicted_gain: >-
          One computable boundary in place of a comparison against one
          half; and an explicit statement of how much the charging
          convention moves it.
    quantifier_order: >-
      FOR ALL (n, theta, D) on the declared grid, f* is the stated function of
      the three inputs; the direction claim is FOR ALL n and D, df*/dtheta <
      0, which holds whenever c(theta) is increasing and the lattice route's
      charged cost is theta-independent to leading order -- both taken from
      in-corpus records. NO statement quantifies over the o(1) in C_NFS:
      every numeric f* is conditional on GOAL-RSA-001's gate and on
      H-RSA-68884a's HEUR-NFS-1 to 3, and the record says so at every
      number.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: a surface f*(n, theta, D) under stated model inputs with the
        lattice-side terms measured and the NFS term flagged; the sign of
        its theta-derivative as a theorem under two in-corpus models; and a
        measured validation of the brute-force count at small k. It cannot
        certify any value of C_NFS, cannot speak to leakage routes other
        than brute-force-plus-lattice, and moves no exponent of anything.
      nearby_object_control: >-
        A PARTIAL-INFORMATION ROUTE WITH A SHARED TABLE -- for instance a
        meet-in-the-middle over the excess bits on a linearised lattice,
        which the honest-accounting closure of this session shows never
        beats brute-force-plus-lattice before NFS dominates -- is the object
        on which df*/dtheta < 0 is expected to FAIL, because that route is
        charged S^theta too and the theta-dependence can cancel or invert.
        Running the machinery on it must return a sign that is not
        uniformly negative; if it still returns uniformly negative, the
        machinery is not seeing the charge on the lattice side and the
        theorem's premise has not been implemented.
    proof_obligations:
      - claim: >-
          f* is the stated function of (C_NFS, T_lat, w_lat) and reduces to
          the folklore statement at theta = 0, D to infinity.
        responsibility: baseline
      - claim: >-
          df*/dtheta < 0 given c(theta) increasing and a theta-independent
          lattice-route charge.
        responsibility: correctness
      - claim: >-
          The brute-force-plus-lattice route's charged cost differs from its
          step count by at most a polynomial factor under the S^theta rule.
        responsibility: memory
      - claim: >-
          The magnitude at theta = 1/3 is a few bits at n = 2048 under
          H-RSA-68884a's decimals with the o(1) ignored, and is labelled as
          such.
        responsibility: size
      - claim: >-
          The lattice-side terms are measured on known-answer instances and
          the brute-force count is validated at small k.
        responsibility: feasibility
      - claim: >-
          No NFS ingredient is designed here; C_NFS is an input.
        responsibility: interface
      - claim: >-
          No factorisation, no deployed-key statement, no unflagged number.
        responsibility: scope
    not_applicable_reason: null

  assumptions:
    - >-
      GOAL-RSA-001's record-reproduction gate and GOAL-RSA-002's
      reproduction result both exist before any numeric f* is reported;
      before that the record is a symbolic surface with two flagged inputs.
    - >-
      The two goals have bound to one charging convention as their
      non-duplication clauses require; if they have not, this record's
      first output is the statement that f* cannot be computed until they
      do.
    - >-
      The lattice route considered is the univariate approximate-divisor
      family with brute force over excess bits; other routes are out of
      scope and would only lower w*.

  predictions:
    - metric: >-
        sign_df_dtheta: the sign of the theta-derivative of f* on the ladder
        theta in {0, 1/6, 1/4, 1/3, 5/12, 1/2}, at every (n, D) on the grid
      direction: lower
      minimum_effect: >-
        STRICTLY NEGATIVE at every point. This is a theorem under the two
        models; a non-negative value anywhere means the lattice-route
        charge was implemented with a theta-dependence it should not have,
        and the machinery is broken.
    - metric: >-
        magnitude_at_third: w*(n, 1/3, D) - w*(n, 0, D) in bits of window,
        under H-RSA-68884a's c values with the o(1) ignored
      direction: different
      minimum_effect: >-
        Between 1 and 3 bits at n = 2048 and between 0.5 and 2 bits at
        n = 1024, from the in-record arithmetic; reported as illustrative
        and conditional, never as a cost statement.
    - metric: >-
        brute_force_count_validation: measured total reductions and wall time
        of an actual brute-force-plus-lattice run at n = 256, k in {4, 8, 12},
        against 2^k T_lat
      direction: different
      minimum_effect: >-
        Within a factor 2 of 2^k T_lat for independent reductions, and a
        measured chaining speedup factor reported separately. A count
        outside the factor 2 means the model's brute-force term is wrong.
    - metric: >-
        optimal_D: the D that maximises w* at fixed C_NFS symbol, from the
        measured T_lat(n, D) and w_lat(n, D)
      direction: different
      minimum_effect: >-
        A finite interior optimum on the tested grid, since w_lat gains
        n/(4(D-1)^2) bits per unit D while log2 T_lat grows with D; reported
        with the grid. No interior optimum means one of the two curves is
        not behaving as modelled and the record reports which.
    - metric: >-
        nearby_object_sign: the sign of df*/dtheta for the shared-table
        partial-information route
      direction: different
      minimum_effect: >-
        NOT uniformly negative on the ladder. Uniformly negative means the
        machinery does not see the lattice-side charge.

  minimal_test:
    design: >-
      FOUR STEPS. STEP 0 (zero compute, blocking): write f* symbolically,
      check the theta = 0 and D to infinity slice as an identity, derive the
      sign of df*/dtheta from H-RSA-68884a's c(theta) monotonicity and the
      polynomial lattice-route charge, and compute the illustrative
      magnitude at theta = 1/3 for n in {1024, 2048} from that record's
      decimals with the o(1) flagged. STEP 1 (zero compute): run the
      identical machinery on the shared-table nearby object and confirm the
      sign is not uniformly negative. STEP 2 (consumes GOAL-RSA-002 cells):
      take the measured w_lat(n, D) and T_lat(n, D) from the frontier runs
      of IDEA-20260816-b4e5b7 and IDEA-20260901-c75e81 at n in {256, 512,
      1024}, D in {20, 30, 50, 70, 100}, and tabulate w* as a function of D
      with C_NFS as a symbol; report the interior optimum. STEP 3 (small
      compute): at n = 256 run an actual brute-force-plus-lattice recovery
      at k in {4, 8, 12} with and without chaining, count reductions and
      wall time, and compare with 2^k T_lat. STEP 4 (conditional): if and
      only if GOAL-RSA-001's gate has passed, substitute C_NFS(n, theta) and
      report the f* surface with every optimistic assumption of both goals
      listed beside it.
    controls:
      - >-
        BASELINE SLICE (blocking): theta = 0, D to infinity reproduces the
        folklore statement as an identity.
      - >-
        NEARBY-OBJECT SIGN (blocking): the shared-table route must not show
        a uniformly negative theta-derivative.
      - >-
        BRUTE-FORCE COUNT: measured against 2^k T_lat within a factor 2.
      - >-
        FLAG PROPAGATION: every numeric f* carries GOAL-RSA-001's gate
        status and H-RSA-68884a's HEUR-NFS-1 to 3 as conditions in the same
        cell.
      - >-
        PRE-REGISTRATION: grid, k values and the symbolic form frozen before
        any cell is consumed.
    required_metrics:
      - symbolic f* and the identity check at the baseline slice
      - sign of df*/dtheta on the ladder for the treatment and the nearby object
      - illustrative magnitude at theta = 1/3 with the o(1) flag
      - w* against D with the interior optimum, C_NFS symbolic
      - measured reduction count, wall time and peak memory of the brute-force runs at k in {4, 8, 12}, with and without chaining
      - the f* surface if and only if the NFS gate has passed, with the assumption list
      - frozen protocol hash and artifact manifest

  falsification_conditions:
    - >-
      The baseline slice does not reduce to the folklore identity. The
      composition is mis-specified and is withdrawn at zero compute.
    - >-
      The theta-derivative is not strictly negative at some grid point for
      the brute-force-plus-lattice route. The lattice-route charge was
      implemented wrongly; the theorem's premise is not what was run.
    - >-
      The nearby object also shows a uniformly negative sign. The machinery
      does not see the lattice-side charge and no sign result may be
      reported.
    - >-
      The measured brute-force count at n = 256 is outside a factor 2 of
      2^k T_lat. The brute-force term is wrong and f* is not computable from
      the model as stated.
    - >-
      No interior optimum in D exists on the grid. One of the two input
      curves does not behave as modelled; the record names which.
    - >-
      PRE-REGISTERED NEGATIVE: the goals have not bound to one convention.
      Then the deliverable is the statement that f* is not computable until
      they do, and STEP 4 is not run.

  confounders:
    - >-
      CHAINING. The per-guess cost with chaining is lower than T_lat and
      depends on the guess order; MITIGATION: both costs measured and k*
      reported under each.
    - >-
      THE o(1) IN C_NFS. At any finite n the L-notation exponent does not
      give a cost; MITIGATION: C_NFS is never evaluated from the exponent
      alone, only substituted from GOAL-RSA-001's gated table, and the
      illustrative magnitude in claim (C) is a DIFFERENCE of exponents,
      which cancels the o(1) only if the o(1) is theta-independent -- which
      is H-RSA-68884a's gate G7 and is cited, not assumed.
    - >-
      UNBALANCED OR CRT SETTINGS. The dimension-loss law is derived for the
      balanced univariate family only; MITIGATION: scope limited to it.
    - >-
      BUDGET-DEPENDENT w_lat. The lattice reach at a given D depends on the
      reducer budget through the reduction barrier of IDEA-20260901-c5e859;
      MITIGATION: w_lat is taken from measured cells, not from the
      determinant law alone, and both are reported.

  interpretation_limits:
    - >-
      A STATEMENT ABOUT COST MODELS. Not a factorisation, not an attack, not
      an NFS improvement, not a statement about any deployed key, per
      RQ-RSA-afe33c's claim_tier_ceiling and RQ-RSA-d46f02's.
    - >-
      Every numeric f* is conditional on GOAL-RSA-001's record-reproduction
      gate, on HEUR-NFS-1 to 3, and on GOAL-RSA-002's reproduction result,
      and carries those conditions in the same cell.
    - >-
      The direction claim is a theorem under two in-corpus models and is
      exactly as strong as those models; it is not an empirical finding
      about machines.
    - >-
      The one-to-two-bit magnitude at theta = 1/3 is illustrative, ignores
      the o(1), and must never be presented as a security-relevant
      re-costing; its value is the CONTRAST with IDEA-20260808-56e892's
      tens-of-bits shift for the cross-primitive comparison under the same
      theta.
    - >-
      The brute-force-plus-lattice route is a baseline; a better
      partial-information route lowers w* and f* further, and the record
      makes no claim that none exists.

  heuristic_assumptions:
    - id: H1
      statement: >-
        INHERITED NFS HEURISTICS. C_NFS(n, theta) behaves as H-RSA-68884a's
        family L[1/3, c(theta)] with c strictly increasing in theta, under
        that record's HEUR-NFS-1 (smoothness), HEUR-NFS-2 (storage
        asymmetry) and HEUR-NFS-3 (density and dimension).
      rigorous_support: >-
        RIGOROUS INGREDIENTS AND CLASSICAL STATEMENTS exactly as stated in
        H-RSA-68884a, which this record does not restate; the one fact used
        is the monotonicity of c(theta), which that record states as gate G6
        with exact rational cubes. THE GAP: the family is asymptotic with an
        uncontrolled o(1), so nothing numeric follows at finite n without
        GOAL-RSA-001's gate.
      validation_plan: >-
        NOT VALIDATED HERE. Delegated entirely to H-RSA-68884a's gates and to
        GOAL-RSA-001's record-reproduction experiment; this record consumes
        the outcome and propagates its status as a flag.
    - id: H2
      statement: >-
        LATTICE-ROUTE CHARGE. The brute-force-plus-lattice route's full cost
        under the S^theta rule equals its step count times a factor
        polynomial in D, m and n for every theta in [0, 1], because each
        guess's reduction holds one basis of O(D^2 m n) bits with no shared
        table across guesses.
      rigorous_support: >-
        RIGOROUS INGREDIENT: the basis size is an explicit polynomial bound.
        CLASSICAL STATEMENT IMITATED: KN-TECH-057's rule that O(1)
        per-processor storage gives full cost equal to step count, as
        H-RSA-68884a applies it to relation collection. THE GAP: chaining
        shares state between consecutive guesses; the shared state is still
        one basis and does not grow with 2^k, so the rule holds, but this is
        asserted for the chained variant and is checked by measuring peak
        memory across k.
