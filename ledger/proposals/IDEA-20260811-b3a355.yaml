idea:
  id: IDEA-20260811-b3a355
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-MTGT-2cabee
  goal_id: GOAL-ENDO-001
  title: >-
    THE REACHABILITY GATE IS PRICED A SQUARE ROOT TOO HIGH, AND THE CORRECTION
    CHANGES WHICH LANES ARE ALIVE: reaching a SPECIFIED class member costs
    p^{1/4+o(1)} time and memory by meet-in-the-middle over a class of size
    h = p^{1/2+o(1)}, which is asymptotically FREE against a p^{1/2} attack -- so
    T5's "the lane dies on cost even when the variance is large" is true only in
    the regime where goodness cannot be IDENTIFIED cheaply, and the binding
    constraints are the identification density 1/delta and the magnitude of the
    gain against sqrt(6), never the travel
  class: mechanism

  claim: >-
    (A) WHAT T5 SAYS AND WHAT IT ACTUALLY COSTS. DECOMPOSITION T5 states the
    dichotomy that a cost-minimising class member is useful only if goodness is
    common enough to hit by random walking or is decided by a local test, because
    "reaching a SPECIFIED curve is the vectorization problem underlying CSIDH:
    hard, about p^{1/4} classically at best". The arithmetic in that sentence is
    right and the conclusion drawn from it is too strong. The attack being
    improved costs Theta(sqrt(N)) = p^{1/2+o(1)}. A p^{1/4+o(1)} preliminary is
    the square root of the attack, i.e. asymptotically negligible against it.
    Travel therefore cannot kill a lane on cost.
    (B) THE THREE REGIMES, PRICED. Let delta be the density of good vertices in
    the class, c_eval the cost of testing one vertex, c_step the cost of one
    isogeny step plus transporting the instance across it, and g the multiplicative
    gain on the attack at a good vertex.
    REGIME I, delta = Omega(1/polylog): total overhead O(polylog * (c_eval +
    c_step)). Negligible. The gain g is realised in full.
    REGIME II, delta small but C cheaply evaluable at a vertex: overhead
    O((1/delta) * (c_eval + c_step)), and the walk itself IS the path, so no
    vectorization is needed and no address is required. Affordable whenever
    1/delta is below sqrt(N)/g.
    REGIME III, goodness identifiable only globally: identifying the good vertex
    costs Theta(h) = p^{1/2+o(1)} evaluations, which is the same order as the
    attack -- and this, not travel, is the real gate. Once identified, TRAVEL is
    p^{1/4+o(1)} and is negligible. Moreover the identification is PREPROCESSING:
    it depends on the curve family and not on the target, so for a fixed deployed
    curve it amortises over every future instance, which is exactly lane L13's
    model and is where the Bernstein-Lange and Corrigan-Gibbs-Kogan S*T^2 = N
    bounds apply.
    (C) THE CORRECTED GATE. A within-class variance result is killed by exactly
    two things: the identification density (Regime III without amortisation) and
    the SIZE of g. Under KN-TECH-018 any g at or below sqrt(6) = 2.449 is baseline
    calibration and never an attack; and in the preprocessing model a
    constant-factor g leaves the S*T^2 frontier's exponent untouched, so even a
    fully realised g is a constant-factor result. The campaign should therefore
    stop discounting variance findings on reachability grounds and start
    discounting them on MAGNITUDE grounds, which is a different and more honest
    test.
    (D) THE CONCRETE TABLE, WITH ITS PESSIMISM DECLARED. At log2 p = 256:
    rho costs 2^128 group operations and O(1) memory. The class has h about
    2^128 members. Meet-in-the-middle vectorization costs about 2^64 time and
    2^64 MEMORY, and that memory is the honest objection to (A) at concrete
    parameters: 2^64 stored vertices is not a small ask, and the low-memory
    alternative is a random walk of length about h^{1/2} to h with the memory
    saving paid in time. So the asymptotic statement "travel is free" and the
    concrete statement "travel is cheap" are NOT the same statement, and this
    record declines to conflate them.
    (E) WHAT IS ACTUALLY MEASURED. The record's empirical half fits the exponent
    of the travel cost against the class size h at toy scale, where the whole
    class is enumerable and the meet-in-the-middle is exact, and measures
    c_step in field operations rather than asserting it.

  mechanism: >-
    Two searches of different sizes are being compared. The ECDLP search is over
    N ~ p elements and costs its square root. The class search is over
    h ~ p^{1/2} vertices and costs ITS square root, p^{1/4}. A square root of a
    square root is negligible against a square root. The campaign's T5 language
    inherited the CSIDH framing, where the vectorization problem IS the
    cryptosystem and p^{1/4} is therefore the attack cost rather than a
    preliminary; transplanted into a setting where the target is ECDLP at p^{1/2},
    the same number changes role completely.

  tracked_object: >-
    The instance (E, P, Q, k) carried along an isogeny path, with an explicit
    field-operation charge accumulated per step. What is tracked is the CHARGE,
    not the instance: T1 guarantees the instance survives with the same k, so the
    only quantity in question is the bill.

  resource: >-
    R4 (the isogeny graph) and R8 (multi-instance and preprocessing structure).
    Nothing acts on G except isogenies, whose restriction to G is an isomorphism
    of prime-order groups; H-ENDO-001 is satisfied and no new congruence is
    claimed.

  lossy_projection_test: >-
    PASSES. The projection is instance -> accumulated transport charge: it
    discards the instance entirely and retains a single integer, and it
    propagates deterministically and additively along a path, which is the
    cleanest possible one-step rule. The reason to say so explicitly is the
    campaign's own lesson that structural loss does not imply cost gain: here the
    projection is used only for accounting and no cost claim is derived from the
    loss.

  t5_reachability: >-
    This record IS about T5 and it must not be read as claiming T5 is wrong. T5's
    dichotomy stands; its COST ANNOTATION is what is corrected. The corrected
    statement is: goodness that is identifiable only by a global address is
    reachable at p^{1/4+o(1)} once the address is known, and the address is what
    costs p^{1/2+o(1)} -- so the gate is identifiability, and identifiability is a
    preprocessing cost that amortises across targets on a fixed curve. The
    campaign's forward guidance should say that; at present it says the lane dies
    on travel.

  null_object: >-
    A RANDOMLY RELABELLED class: the same h vertices with edges rewired at random
    to a random regular graph of the same degree, on which the meet-in-the-middle
    must show the SAME sqrt(h) scaling (it depends on the size, not the
    arithmetic). If the measured scaling differs between the real isogeny graph
    and the random null, the measurement is reading the graph's arithmetic
    structure rather than its size and the exponent claim is unsupported. Second
    null: transporting an instance around a CYCLE back to its origin, whose
    accumulated charge must be nonzero while the instance is unchanged -- the
    control that separates "transport is cheap" from "transport is not being
    charged".

  why_not_a_renamed_known_approach: >-
    The lane contains a correct multi-target baseline (IDEA-20260807-406fef,
    Kuhn-Struik sqrt(M*N) and Yun's tight bound), a preprocessing-frontier
    invariance closure (IDEA-20260807-a2fb45), a transport-compatibility
    dichotomy (-e0ddc6), a free-transport table result (-a127ab) and a missing
    instrument specification (-d7a5d4). None of them prices the T5 gate, and none
    observes that the gate's own number is the square root of the attack it is
    supposed to gate. The observation is elementary, which is exactly why its
    absence from the campaign's reasoning matters.

  novelty_status: speculative
  novelty_screen: >-
    Screened this session against the RQ-MTGT lane (IDEA-20260807-d7a5d4,
    -ea3915, -465744, -406fef, -e41559, -e0ddc6, -a2fb45, -a127ab, -0e8977), the
    RQ-CLGP lane's reduction attempts, DECOMPOSITION T5 in full, and
    MATCHED-ORDER-DESIGN.md section 4 E3. No committed record contains the
    comparison p^{1/4} versus p^{1/2}. Classified `speculative` rather than
    `adaptation` because the load-bearing external number -- the classical
    vectorization complexity for ordinary curves -- is recalled and not verified
    this session; WEB SEARCH WAS UNAVAILABLE.

  discriminated_from: >-
    NOT IDEA-20260807-406fef, which prices MULTI-TARGET amortisation against the
    correct Kuhn-Struik baseline; this record prices the CLASS SEARCH itself and
    reaches the preprocessing model from a different direction. NOT
    IDEA-20260807-a2fb45, which shows the achievable (S, T) frontier is a class
    invariant so that "find the classmate with the cheapest preprocessing" is
    vacuous; that closure concerns PREPROCESSING COST, this record concerns
    ATTACK COST at a good vertex and the two are compatible -- indeed a2fb45's
    conclusion strengthens Regime III's amortisation argument. NOT
    IDEA-20260807-631e80, which measures mixing to uniformity; reaching a
    SPECIFIED vertex is a different problem and mixing does not solve it.

  assumptions:
  - >-
    The ordinary F_p-isogeny class has h = |D|^{1/2+o(1)} = p^{1/2+o(1)} members
    (class number asymptotics with the Siegel-Brauer bound; effective constants
    are ineffective, which is stated because it matters for any concrete claim)
    [recall-confident, not verified this session].
  - >-
    The vectorization problem for an ordinary F_p-isogeny class is solvable in
    about sqrt(h) = p^{1/4+o(1)} classical time with comparable memory by
    meet-in-the-middle over the class-group action [recall-confident:
    Galbraith-Hess-Smart-style attacks and the Delfs-Galbraith analysis for the
    F_p case; NOT verified this session and flagged as the record's single most
    load-bearing external input].
  - >-
    T1 transport holds: every isogeny of degree coprime to N carries the instance
    with the same k. This is elementary and is the only mathematical claim the
    DECOMPOSITION asserts without qualification.
  - >-
    Per-step transport cost is O(ell) field operations for an ell-isogeny by
    Velu, or Otilde(sqrt(ell)) with sqrt-Velu; degrees used in walks are small.

  proof_search_map:
    bottleneck: >-
      Identifying the good vertex, not travelling to it. The record's entire
      claim is that the bottleneck has been mislocated, so naming it correctly IS
      the deliverable.
    baseline_embedding:
      parameter_slice: >-
        delta = 1 (every vertex good) reproduces the no-search baseline where
        transport cost is the only overhead; delta = 1/h reproduces the
        exhaustive-identification regime. The three-regime table is exact at both
        endpoints and the middle regime interpolates them, so the model embeds
        its own boundaries.
      reproduction_check: >-
        Frozen fixture at toy scale: with delta = 1 the measured overhead must
        equal the measured per-step charge times the measured path length, with
        no residual term. A residual means the accounting is incomplete and every
        regime number is wrong.
    observation_collision:
      observable: >-
        Total field operations to solve, including all preliminaries.
      distinct_preimage_search: >-
        Two very different strategies with the same total: exhaustive
        identification with free travel, and cheap identification with expensive
        travel. The design must distinguish them, which is why identification and
        travel are metered SEPARATELY rather than reported as one overhead.
    constructive_transforms:
    - transform: boundary_lift
      proposed_object: >-
        Enlarge the accounting from "does the good curve exist" to "what does the
        full pipeline cost", and prove a strict inward improvement is or is not
        available at each regime rather than asserting feasibility.
      predicted_gain: >-
        No attack gain is claimed. The predicted gain is analytical: the campaign
        stops rejecting variance results for the wrong reason.
    - transform: specialization_pack
      proposed_object: >-
        Charge identification and travel over provably disjoint phases so the
        totals cannot double count; the amortisation argument in Regime III is
        valid only if identification is charged once across targets.
      predicted_gain: >-
        A defensible amortised cost, which is what L13's threat model needs.
    quantifier_order: >-
      For every class member E* and every instance on E, there EXISTS a path from
      E to E* computable in p^{1/4+o(1)} operations (the witness depends on the
      instance's curve and on E*, which is permitted, since the attacker computes
      it per instance). The claim that must NOT be misread as universal: there is
      no uniform advice-free procedure that identifies E* without either a cheap
      local test or Theta(h) evaluations, and that non-existence is asserted only
      as the definition of Regime III, not proved.
    method_ceiling:
      strongest_certifiable_claim: >-
        A cost accounting. It can certify that travel is asymptotically dominated
        and can measure the constants at toy scale. It CANNOT certify that any
        good vertex exists, cannot certify any g > 1, and therefore cannot on its
        own produce an attack of any kind.
      nearby_object_control: >-
        The supersingular case over F_{p^2}, where the class has size about p and
        the analogous search costs p^{1/2} -- the same order as this record's
        target attack. There the conclusion FAILS: travel is not negligible. A
        method that does not notice the difference between the ordinary F_p case
        and that one has not identified the load-bearing structure, and the
        difference is exactly the class size.
    proof_obligations:
    - claim: h = p^{1/2+o(1)} for ordinary classes.
      responsibility: size
    - claim: Vectorization costs p^{1/4+o(1)} time and memory classically.
      responsibility: runtime
    - claim: Transport of the instance across a path is O(path length) times the
        per-step charge, with no hidden term.
      responsibility: correctness
    - claim: Identification is preprocessing and amortises across targets.
      responsibility: interface
    not_applicable_reason: null

  predictions:
  - metric: fitted_exponent_of_meet_in_the_middle_path_finding_cost_against_class_size_h
    direction: different
    minimum_effect: >-
      0.50 +/- 0.07 against h (equivalently 0.25 against p), measured on fully
      enumerated toy classes with h spanning at least two orders of magnitude. A
      fitted exponent at or above 0.9 against h would mean the search is
      effectively exhaustive and the record's central comparison collapses.
  - metric: measured_field_operations_per_transport_step
    direction: different
    minimum_effect: >-
      O(ell) with the constant reported, and the total transport charge for a
      path of length L equal to L times that constant within 10 percent. A
      superlinear total means a hidden term exists and the accounting in (B) is
      incomplete.
  - metric: ratio_of_total_travel_cost_to_rho_cost_on_the_same_instance
    direction: lower
    minimum_effect: >-
      Decreasing in p, and below 1 at every tested size from 20 bits upward. If
      the ratio is above 1 at toy scale the record says so plainly: the
      asymptotic statement would still hold while the concrete one fails at
      tested sizes, and both must be reported.
  - metric: memory_high_water_mark_of_the_path_finder
    direction: higher
    minimum_effect: >-
      Theta(sqrt(h)) entries, reported explicitly, because this is the honest
      objection to (A) at concrete parameters and burying it would misstate the
      result.

  minimal_test:
    design: >-
      Toy scale, fully enumerable classes. Choose at least six ordinary classes
      with h spanning roughly 30 to 3000 (p from 16 to 32 bits), enumerate each
      class completely, and for each: (i) pick random source and target vertices,
      run a meet-in-the-middle over the class-group action, and record the field
      operations and memory used to find the path; (ii) transport a real ECDLP
      instance along that path with T1 certificates re-verified at each step
      (docs/claims-and-verification.md), recording the per-step charge; (iii) run
      parallel rho on the same instance and record its cost in the same unit.
      Fit the path-finding exponent against h. Report distributions over at
      least 30 source-target pairs per class, never a point estimate.
    controls:
    - >-
      RANDOM-GRAPH NULL of matched size and degree, on which the sqrt(h) scaling
      must reproduce; a difference means arithmetic structure is being read.
    - >-
      CYCLE CONTROL: transport around a closed path and verify the instance
      returns unchanged while the charge accumulates; this is the control that
      proves transport is being charged at all.
    - >-
      CERTIFICATE DISCIPLINE: every transported instance carries a re-verified
      T1 certificate, and every claimed rho solve carries a solution certificate
      the wrapper re-verifies independently.
    - >-
      An adversarially chosen WORST-CASE target pair (maximum graph distance) as
      well as random pairs, since the mean path length is not the quantity an
      attacker faces.
    required_metrics:
    - path_finding_field_operations_and_memory_per_pair
    - fitted_exponent_against_h_with_confidence_interval
    - per_step_transport_charge
    - rho_cost_on_the_same_instance_in_the_same_unit
    - ratio_distribution_over_pairs_including_worst_case
    - random_graph_null_exponent

  falsification_conditions:
  - >-
    The fitted path-finding exponent against h is at or above 0.9. Reaching a
    specified vertex is effectively exhaustive at tested sizes, the p^{1/4}
    premise fails empirically, and T5's original reading is vindicated -- which
    would be a clean, useful negative and would close this record.
  - >-
    The transport charge is superlinear in path length. The accounting in (B) is
    incomplete and every regime cost must be rederived.
  - >-
    The random-graph null shows a different exponent. The measurement is reading
    arithmetic rather than size and the extrapolation to crypto scale is
    unsupported.
  - >-
    A transported instance fails its T1 certificate. Infrastructure failure, not
    mathematics; the run is void under AGENTS.md rule 5 and no conclusion follows.

  confounders:
  - >-
    TOY CLASSES ARE SMALL. Fitting an exponent over h from 30 to 3000 is fitting
    over two orders of magnitude, and the confidence interval must be reported
    rather than the point estimate. The record's asymptotic claim does NOT rest
    on this fit; the fit is a consistency check on a cited external result, and
    saying otherwise would be overclaiming.
  - >-
    The meet-in-the-middle's memory is the practical objection at crypto scale
    and the toy measurement cannot see it, because 2^64 entries is not reachable
    by extrapolation from 3000. The concrete table in (D) is therefore stated as
    an asymptotic-with-caveat and never as a concrete-cost claim.
  - >-
    Class enumeration at toy scale uses the very isogeny machinery whose cost is
    being measured; the enumeration cost must be excluded from the path-finding
    charge and the exclusion must be visible in the artefacts.
  - >-
    Ineffective constants in h = |D|^{1/2+o(1)} mean no concrete lower bound on
    h follows from the asymptotics; a specific class could be much smaller than
    p^{1/2}, which would make travel even cheaper and identification easier, and
    that direction is not a problem for the record but must be measured rather
    than assumed.

  interpretation_limits:
  - >-
    NO ATTACK, NO EXPONENT IMPROVEMENT, NO SPEEDUP; sota_delta zero; claim_tier
    toy for the measurement and analytical for the accounting. The record makes
    a lane MORE live by removing a wrong reason to dismiss it; it produces no
    advantage of any kind by itself.
  - >-
    Every regime in (B) still requires g > sqrt(6) to be anything other than
    baseline calibration under KN-TECH-018, and a constant g does not move the
    S*T^2 frontier's exponent. The record's own conclusion is therefore that
    within-class variance must be judged on MAGNITUDE, and the campaign has no
    magnitude yet.
  - >-
    The p^{1/4} vectorization figure is recalled, not verified this session, and
    is the record's single load-bearing external input. If it is wrong the record
    is wrong, and the toy measurement is the cheapest available check.
  - >-
    H-ENDO-001 used, not retested; KN-FIND-b7e091 binding, and the isogeny
    transport oracle is already audited as simulable
    (IDEA-20260807-d73e83), so nothing here escapes the generic bound; P2
    respected.

  heuristic_assumptions:
  - id: HA-1
    statement: >-
      For an ordinary F_p-isogeny class, the class number h of the relevant order
      satisfies h = p^{1/2+o(1)}, so a meet-in-the-middle over the class costs
      p^{1/4+o(1)} operations and comparable memory.
    rigorous_support: >-
      Rigorous ingredient: h(D) = |D|^{1/2+o(1)} by the Brauer-Siegel theorem
      with ineffective constants, and |D| = 4p - t^2 <= 4p by Hasse. The
      distribution imitated is that D behaves like a typical discriminant of its
      size in class-number terms, which fails for the small-|D_0| classes that
      IDEA-20260811-dcbea4 measures the density of -- and that failure makes
      travel CHEAPER, not more expensive.
    validation_plan: >-
      Direct measurement at toy and medium scale: enumerate classes for p from
      16 to 32 bits and tabulate h against sqrt(|D|), reporting the empirical
      distribution of h/sqrt(|D|) rather than a mean. Tail checks: the smallest
      observed ratio, which is the case where travel is cheapest and the record's
      claim strongest, and the largest, which is the adversarial case. Transfer
      to crypto scale is NOT claimed from this sample; it rests on the cited
      asymptotic.
  - id: HA-2
    statement: >-
      The meet-in-the-middle over the class-group action achieves the birthday
      bound sqrt(h) with a constant near 1, i.e. the two random walks from source
      and target mix well enough that their images collide at the birthday rate.
    rigorous_support: >-
      Rigorous ingredient: the crater is a Cayley graph of an abelian group and
      is a rapid mixer under GRH, which is the same citation T5 itself rests on.
      The classical statement imitated is the birthday bound for two independent
      uniform samples.
    validation_plan: >-
      Measure the collision constant directly per class over at least 30
      source-target pairs and require it to be constant across the six classes
      within 20 percent. Drift with h localises the confound in mixing rather
      than in the birthday bound, which is the separation the exponent fit needs.

  target_complexity:
    time_exponent: >-
      Travel to a specified class member: p^{1/4+o(1)}. Identification in
      Regime III: p^{1/2+o(1)}, amortisable as preprocessing. The ECDLP itself
      remains p^{1/2} and NO EXPONENT IMPROVEMENT IS CLAIMED OR IMPLIED -- the
      record's arithmetic concerns overheads, and an overhead below the attack
      exponent is still not an attack.
    memory_exponent: >-
      p^{1/4+o(1)} for the meet-in-the-middle, against O(1) for parallel rho.
      This is the record's honest weak point at concrete parameters and is
      reported in every summary rather than in a footnote.
    best_known: >-
      Parallel Pollard rho with distinguished points, 0.886 sqrt(N) group
      operations, O(1) memory (KN-TECH-001, KN-TECH-006); automorphism-discounted
      variant (KN-TECH-018); BSGS at sqrt(N) time and memory (KN-TECH-031).
    hidden_overhead: >-
      The o(1) in p^{1/4+o(1)} hides the class-group structure computation and
      the smoothness of the connecting ideal, both of which are subexponential
      rather than polynomial at crypto scale. Disclosed here because a p^{1/4}
      figure with a subexponential cofactor is a materially different claim from
      a clean p^{1/4}, and the campaign should carry the qualified form.
    tradeoff_note: >-
      Travel interpolates along the standard time-memory curve: sqrt(h) time with
      sqrt(h) memory at one end, and a low-memory random walk paying more time at
      the other, in the van Oorschot-Wiener manner. Identification in Regime III
      is embarrassingly parallel and is the phase that would actually be
      distributed.

  dominated_by: >-
    Dominated by parallel Pollard rho with distinguished points at 0.886 sqrt(N)
    time and O(1) memory (KN-TECH-001, KN-TECH-006) on every axis, since the
    record proposes no attack and its own pipeline is rho plus an overhead. Also
    dominated by the automorphism-discounted variant (KN-TECH-018) and, on the
    memory axis specifically, by everything, since the meet-in-the-middle costs
    p^{1/4} memory where rho costs O(1). Checked against every frontier row this
    repository maintains.
  sota_delta: >-
    Zero on every attack axis, and the record is explicit that it must be: it
    corrects an overhead estimate, and an overhead below the attack exponent
    still produces no gain without a magnitude g. The delta is internal --
    the campaign's own rejection criterion for within-class variance changes from
    "unreachable" to "too small", which is testable and is not.

  estimated_cost:
    implementation: high
    compute: medium

  recommended_priority: high

  honest_prior_of_survival: >-
    0.85 that the toy measurement confirms sqrt(h) path-finding with a well
    behaved constant. 0.9 that the analytical correction in (A) survives review
    as stated, since it is arithmetic rather than conjecture. 0.3 that the
    campaign's forward guidance actually changes as a result, which is the
    outcome that matters. 0.00 that any attack follows. Filed high because it is
    the only record this session that changes which lanes the campaign should
    consider alive, and because it depends on a transport instrument
    (IDEA-20260807-d7a5d4) the campaign needs regardless.

  source_refs:
  - analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md (T1, T2, T5 --
    the text whose cost annotation this record corrects)
  - ledger/proposals/IDEA-20260807-d7a5d4.yaml (transport instrument dependency)
  - ledger/proposals/IDEA-20260807-406fef.yaml (correct multi-target baseline)
  - ledger/proposals/IDEA-20260807-a2fb45.yaml (preprocessing frontier is a class
    invariant; strengthens the Regime III amortisation argument)
  - ledger/proposals/IDEA-20260807-d73e83.yaml (isogeny-transport oracle is
    GGM-simulable)
  - knowledge/techniques/KN-TECH-018.md (sqrt(6) baseline-calibration rule)
  - '"[recall-confident, NOT verified this session] Galbraith, Hess, Smart,
    Extending the GHS Weil descent attack / isogeny path finding; Delfs and
    Galbraith, Computing isogenies between supersingular elliptic curves over
    F_p, DCC 2016 -- source of the p^{1/4} class-search figure."'
  - '"[recall-confident] Brauer-Siegel: h(D) = |D|^{1/2+o(1)} with ineffective
    constants. NOT verified this session."'
