idea:
  id: IDEA-20260809-593de3
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-QRE-6dba8c
  goal_id: GOAL-QRE-001
  title: >-
    Count the modular-arithmetic layer here and validate it by classical
    simulation, because every published headline number is linear in this count
  class: measurement
  claim: >-
    The reversible circuits for modular multiplication and exponentiation have
    Toffoli counts that follow from their construction, and those counts can be
    derived and CHECKED by simulating the same circuits classically at small bit
    widths. The claim is that this program can produce its own count with a
    validation that no published estimate provides in reusable form, and that
    doing so converts every later total in this goal from a citation into a
    computation.
  mechanism: >-
    Construct the circuits explicitly at parameterized bit width, count gates by
    traversal, and simulate the same circuit on classical inputs to confirm it
    computes the intended function reversibly. Extrapolate the count formula and
    verify it against the traversal at several widths.
  why_not_a_renamed_known_approach: >-
    Circuit constructions and their counts are published. What this record adds
    is a VALIDATED, reusable count produced inside this program: the simulation
    check catches the transcription errors that silently propagate when a count
    is copied from a paper into a downstream estimate.
  predictions:
  - observable: Toffoli count versus bit width
    metric: exact counts at several widths, fitted to the construction's formula
    predicted: Matches the construction's closed form exactly, since the count is combinatorial rather than empirical. Any deviation is a construction or traversal bug.
  - observable: classical simulation agreement
    metric: fraction of random inputs on which the circuit computes the intended function
    predicted: One. Anything less invalidates the count entirely.
  minimal_test: >-
    Build the circuits at four bit widths, count by traversal, simulate on at
    least one thousand random inputs per width, and fit the count formula.
  controls:
  - 'REVERSIBILITY CHECK: the circuit must be invertible on all tested inputs, since an irreversible step would make the count meaningless in the fault-tolerant setting.'
  - 'INDEPENDENT COUNT: gate counting implemented twice, by traversal and by construction-time accumulation, with exact agreement required.'
  falsification_conditions:
  - Simulation disagrees with the intended function at any width.
  - The two counting methods disagree.
  interpretation_limits: >-
    A gate count is not a resource estimate. It is one input to a pipeline whose
    other inputs are physical assumptions, and no timeline or feasibility
    statement follows from it.
  sota_delta: 'No claim about quantum feasibility. Delta: a validated, reusable arithmetic-layer count owned by this program.'
  dominated_by: Externally dominated by the original circuit constructions, stated plainly. Not dominated by any corpus record.
  estimated_cost: Implementation medium; compute low.
  recommended_priority: high
  novelty_status: known
  novelty_screen: 'Corpus grep for Toffoli / reversible circuit: no records. WEB NOT CHECKED.'
  source_refs:
  - Published reversible modular arithmetic constructions -- RECALLED, REQUIRED READS.
