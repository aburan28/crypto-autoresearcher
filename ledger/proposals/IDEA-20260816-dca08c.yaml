idea:
  id: IDEA-20260816-dca08c
  question_id: RQ-FBG-001
  added: '2026-08-16'
  title: Measure, rather than argue, the displacement rank of the relation-incidence matrix that an
    arithmetic-progression factor-base support induces, against a matched random support of identical
    size and identical density, and report the rank as a property of the geometry alone with no solver
    invoked
  class: measurement
  claim: '(A) KN-OPEN-006 asks whether designed arithmetic-progression relation supports give a matrix
    of order-1 displacement rank whose structured solve beats generic sparse methods, net of a relation-probability
    penalty. That question bundles three things: a geometry, a rank, and a solve. The rank is the
    only one of the three that is a property of the geometry, and it is the only one that can be measured
    without touching a solver. (B) THE CLAIM. For a factor base whose support is constrained to short
    arithmetic progressions in a named coordinate, the displacement rank alpha of the resulting relation-incidence
    matrix, defined as the rank of the Sylvester-type displacement of the matrix with respect to a
    fixed pair of shift operators, is a computable integer for each realised matrix, and the claim
    is that alpha for AP-supported matrices is measurably lower than alpha for matched random supports
    of identical dimensions and identical row density - and, critically, that the gap either does
    or does not persist as the base size grows. A gap that shrinks toward zero as B grows is the interesting
    negative: it would mean the AP constraint imposes structure the matrix forgets, and would be a
    reusable obstruction stated as a measured curve alpha against B rather than as a verdict. (C)
    SCOPE DISCIPLINE. This measures a matrix invariant. It does not run Wiedemann, does not run any
    structured solve, does not compare solve times, and does not claim any linear-algebra speedup.
    The relation-probability penalty that KN-OPEN-006 correctly insists on is NOT measured here either;
    it is named as the missing half and left to another contract. Reporting a rank without the penalty
    is honest only if the contract refuses to draw the net conclusion, and it does. (D) WHAT IS NOT
    CLAIMED. No attack, no break, no speedup, no security consequence, and specifically no claim that
    a low alpha would help - it would only make the second half of KN-OPEN-006 worth asking. It is
    not claimed that sparse linear algebra is or is not accelerable; that is another lane''s object
    and this contract stays out of it. It is not claimed that AP supports are constructible in a running
    index calculus, and the contract records the constructibility question as open. (E) WHY MEASURE
    RATHER THAN ARGUE. The program currently holds this as prose in an open problem with the two competing
    effects named. A single integer per matrix, with error bars over seeds and curves and a growth
    arm in B, converts prose into a number that any later reader can re-scope.'
  mechanism: STAGE 1. Fix a toy prime-order curve and a base size B. Build an AP-supported base by
    choosing a start and a common difference in the chosen coordinate and taking B terms, keeping
    only those lying on the curve and recording the survival fraction. Build a matched random support
    of identical realised size. STAGE 2. Harvest a fixed number of relations R for each base by exact
    enumeration of size-m multisets that sum to a sampled target, recording each relation as a sparse
    exponent row over the base indices. Both arms harvest under the identical procedure in the identical
    invocation, and R is held equal across arms by construction, not by luck. STAGE 3. Form the R
    by B incidence matrix over the rationals or a large prime field. Compute the displacement Delta_{Z,Z}(M)
    equal to M minus Z M Z transpose for the fixed lower-shift operator Z, and compute its rank exactly
    by fraction-free elimination. That integer is alpha. STAGE 4. Repeat over seeds, curves, and a
    ladder of B values to obtain alpha as a function of B per arm with intervals. STAGE 5. Refutation
    route. If alpha for the AP arm equals alpha for the random arm within intervals at every B, the
    AP constraint imposes no displacement structure at the level of the incidence matrix and the first
    half of KN-OPEN-006 is answered negatively in the tested scope. If alpha for the AP arm is lower
    but its gap closes with B, the structure is present and non-persistent, which is a measured obstruction
    with a slope. If the gap persists, the contract stops there and states that the second half -
    the relation-probability penalty and the solve - remains entirely unmeasured.
  novelty_status: unverified
  novelty_screen:
    method: 'Read KN-OPEN-006 in full and KN-OPEN-020, RQ-FBG-001, H-FBG-001, EV-FBG-001. Greps over
      ledger/proposals and ledger/hypotheses: ''displacement rank'' returning IDEA-20260807-291968,
      9ecc6f, IDEA-20260731-014, IDEA-20260807-e57607, 4d7e8e, efc8de, 899c5e, 5dfe4a; ''Toeplitz''
      returning IDEA-20260807-9ecc6f, IDEA-20260726-002, IDEA-20260814-270e03, IDEA-20260727-001;
      ''arithmetic progression'' returning 8 records including IDEA-20260808-486ae2 and IDEA-20260815-f558e4.
      Read the head of experiments/EXP-RELN-0a979f/specification.yaml.'
    results: Displacement rank appears in at least eight proposals and Toeplitz structure in four,
      so the concept is well represented in this program. KN-OPEN-006 states the question and names
      both competing effects, including the requirement that alpha stay order 1 rather than growing
      like the square root of B. What I did not find in the records I read is any contract that computes
      alpha as an exact integer for realised relation matrices and reports it against a matched random
      support with a growth arm in B while explicitly refusing to run a solve. The existing records
      treat displacement rank as an ingredient of a solve-cost argument. IDEA-20260815-f558e4 owns
      the one-step propagation ceiling and is a different object entirely.
    verdict: 'UNVERIFIED. Nothing is asserted about external literature; displacement-rank theory
      and structured solvers are standard subjects and this record makes no claim about what is published.
      What is claimed new here is the narrowing: alpha measured as a property of the support geometry
      alone, with the solve and the harvesting penalty explicitly excluded and named as missing. What
      is assembled from known parts: the displacement operator and its rank, standard; the AP support
      and the two competing effects, stated in KN-OPEN-006; the matched random control and permutation
      discipline, taken from the frozen battery.'
  object_first_candidate:
    tracked_object: THE DISPLACEMENT RESIDUE of the relation-incidence matrix - the matrix M minus
      Z M Z transpose for a fixed shift operator Z - carried as a single integer, its rank alpha,
      through a ladder of base sizes.
    lossiness: 'Strongly lossy. The displacement residue discards the actual relation coefficients
      almost entirely: an R by B matrix with R B entries collapses to one integer. It discards which
      targets were hit, which base elements appeared, the curve, and the field. What it retains is
      exactly how far the matrix deviates from being invariant under the shift, which is the property
      a structured solve would exploit. That is discarded compatibly with the operation of interest,
      because the shift operator is fixed in advance and the residue is defined by it; adding a new
      relation row acts on the residue by a bounded update whose rank increase is at most 2, so the
      retained integer still propagates under the operation of harvesting one more relation. Enormous
      numbers of distinct matrices collapse to the same alpha, which is the signature of a genuine
      projection.'
    propagation: 'One step of the target operation - appending one harvested relation row to M - changes
      the displacement residue by a matrix of rank at most 2, so alpha changes by at most 2 per row.
      That is the deterministic propagation rule on the retained part, and it is what makes alpha
      a tracked quantity rather than a summary statistic recomputed from scratch: alpha as a function
      of the number of harvested relations is a nondecreasing staircase with steps of at most 2, and
      the SHAPE of that staircase - how quickly it saturates - is a richer reading than the final
      value.'
    survival_score: The staircase is informative while alpha remains well below its trivial ceiling
      of min(R, B) plus a small constant. Concretely, the structure survives as long as alpha stays
      under about B over 4; past that the residue is generic and alpha carries no more information
      than the dimensions do. The honest expectation is that the AP arm's alpha stays low for the
      first few dozen rows and then climbs, so the object survives the first order of B relations
      and dissolves thereafter. The measurement is designed to locate that dissolution point rather
      than to assume it.
  null_object_control: 'The null object is a MATCHED RANDOM SUPPORT: a support of identical realised
    size, identical number of harvested relation rows R, and identical per-row density, generated
    in the same invocation and pushed through the identical displacement computation. For the signal
    arm to mean anything the null must satisfy two things: its alpha must be near the generic ceiling
    min(R, B) for a matrix of that density, since a random support has no shift structure, and its
    alpha staircase must climb at close to the maximum rate of 2 per row. If the random null itself
    shows low alpha, the displacement operator has been chosen so that it annihilates everything at
    these dimensions, the measurement has no resolving power, and the result is recorded as a controlled
    null. A second null is required: a deliberately Toeplitz-by-construction matrix of the same dimensions,
    which must show alpha of order 1; a pipeline that cannot detect known structure cannot report
    its absence.'
  discriminated_from:
  - 'KN-OPEN-006: poses the full question including the structured solve and the relation-probability
    penalty. This contract deliberately measures only the rank, runs no solver, and refuses the net
    conclusion the open problem asks for.'
  - 'IDEA-20260807-9ecc6f and the other displacement-rank proposals found in the screen: those treat
    alpha as an input to a solve-cost argument. This one treats alpha as the output and the only reported
    quantity.'
  - 'EXP-RELN-0a979f: measures the collision deficit and additive energy of the decomposition distribution.
    Nothing here touches the decomposition distribution; the object is a matrix invariant.'
  - 'H-FBG-001 and EV-FBG-001: measured yield and coverage for six geometries and proved mean yield
    is size-forced. This contract measures neither yield nor coverage.'
  - 'IDEA-20260815-f558e4, the one-step propagation ceiling: a bound on how far a tracked object survives
    one group operation. Here the propagation step is appending a matrix row, and the rank-2 update
    bound is elementary linear algebra rather than that record''s result.'
  assumptions:
  - An AP-supported base of the required size is realisable on the tested curves, accepting that roughly
    half of AP terms in an x-coordinate fail to lie on the curve; the survival fraction is measured
    and reported, and a cell that cannot reach size B is recorded infeasible.
  - Exact rank over a large prime field is a faithful stand-in for rank over the rationals at these
    dimensions; a random second prime is used as a cross-check.
  - The choice of shift operator Z is fixed in advance and disclosed; alpha is only meaningful relative
    to it, and the contract reports alpha under two independent operator choices.
  - Holding R and per-row density equal across arms is the correct matching; if the AP arm cannot
    reach the same R without changing density, the cell is reported as unmatched rather than adjusted.
  predictions:
  - metric: alpha for the AP-supported arm relative to alpha for the matched random support at fixed
      B and R
    direction: lower
    minimum_effect: 0.5
  - metric: alpha of the Toeplitz-by-construction positive control
    direction: lower
    minimum_effect: 4
  - metric: alpha of the matched random null relative to the generic ceiling min(R, B)
    direction: higher
    minimum_effect: 0.9
  - metric: slope of the AP arm's alpha against B on a log-log scale
    direction: different
    minimum_effect: 'explicit refusal to pre-commit a value: KN-OPEN-006 names the two candidate behaviours,
      order 1 and growth like the square root of B, and pre-committing to either would bias the analysis
      toward the one chosen; the slope is reported with its interval and compared to both candidates
      after the fact, with the comparison rule fixed in advance'
  minimal_test:
    design: One curve, one B, one operator, both arms, one invocation, no solver. Take a toy prime-order
      curve with N near 2^14 from harness/toycurve.py, set B near 46, build an AP support in the x-coordinate
      and a matched random support of the same realised size, harvest exactly R equal to 2B relation
      rows for each by exact multiset enumeration against sampled targets, form both R by B matrices
      over a 61-bit prime field, compute the displacement residue under a fixed lower-shift operator,
      and get alpha for each by fraction-free elimination. Also compute alpha for a Toeplitz-by-construction
      matrix of the same dimensions as the positive control. The discriminating output is three integers
      in one table. If the random null's alpha is not near min(R, B), or the Toeplitz control's alpha
      is not small, the instrument has no resolving power and nothing else is readable. This costs
      minutes and requires no solver, no timing, and no comparison against any linear-algebra method.
    controls:
    - Matched random support at identical realised size, identical R, identical per-row density, generated
      in the same invocation.
    - Toeplitz-by-construction positive control matrix of identical dimensions, which must show small
      alpha.
    - Rank computed over two independent large primes as a cross-check against a modular accident.
    - Two independent shift operators, with alpha reported under each.
    - 'Row-permutation control: alpha recomputed after randomly permuting the relation rows, which
      for a genuine shift structure must change alpha and for a coincidence must not.'
    required_metrics:
    - alpha, exact integer, per matrix
    - the alpha staircase as a function of the number of appended rows
    - generic ceiling min(R, B) per cell for normalisation
    - 'AP survival fraction: terms of the progression actually lying on the curve'
    - realised support size and per-row density per arm
    - rank agreement across the two primes and across the two shift operators
  falsification_conditions:
  - The matched random null shows alpha well below the generic ceiling, meaning the operator annihilates
    generic matrices and the instrument has no resolving power.
  - The Toeplitz-by-construction positive control shows large alpha, meaning the pipeline cannot detect
    structure it is given.
  - The AP arm's alpha equals the random arm's alpha within intervals at every tested B, answering
    the rank half of KN-OPEN-006 negatively in the tested scope.
  - Rank disagrees across the two primes or the two shift operators, meaning alpha is not well defined
    as reported.
  - The AP support cannot be realised at the required size on any tested curve, making the arm infeasible
    rather than negative.
  - Row permutation leaves alpha unchanged in the AP arm, indicating the low rank came from the matrix
    dimensions rather than from shift structure.
  confounders:
  - 'Row ordering: displacement rank is defined relative to an ordering of rows and columns, so an
    arbitrary harvest order can create or destroy apparent structure. The row-permutation control
    exists for exactly this and is the most important control in the design.'
  - 'Density mismatch: if the AP arm''s rows are systematically sparser, low alpha can follow from
    sparsity alone rather than from shift structure.'
  - 'Curve membership filtering: keeping only AP terms on the curve turns a progression into an irregular
    subset, which may destroy the structure before the matrix is ever formed. The survival fraction
    quantifies this.'
  - 'Small dimensions: at B near 46 the generic ceiling is small and integer effects dominate; a gap
    of a few units may not be meaningful.'
  - Choice of shift operator can be tuned after seeing results, which would be fitting; both operators
    are declared before any run.
  interpretation_limits:
  - A low alpha is not a speedup and is not evidence of one; no solver is run and no timing is taken,
    so the contract cannot and does not compare against any linear-algebra method.
  - The relation-probability penalty named in KN-OPEN-006 is not measured, so the net question that
    open problem poses stays entirely open regardless of outcome.
  - alpha is meaningful only relative to the declared shift operators and row ordering.
  - Toy dimensions; the growth arm covers a short ladder in B and reports a trend, not an exponent.
  target_complexity:
    time_exponent: No attack exponent is claimed. The measurement costs one exact rank computation
      on an R by B matrix, which is order R B squared field operations per cell - a measurement cost,
      not an attack cost, and no attack is proposed.
    memory_exponent: No attack memory exponent is claimed. Peak memory is one dense R by B matrix
      over a 61-bit prime, which at R near 92 and B near 46 is negligible.
    best_known: The incumbent for the measured quantity is the matched random support, whose alpha
      is expected at the generic ceiling min(R, B). There is no incumbent measurement of alpha for
      AP supports in this repository - KN-OPEN-006 states the question and reports no number. For
      the underlying linear-algebra stage the incumbent named in this program is generic sparse Wiedemann
      via KN-LIT-016 and KN-LIT-017, which this contract does not run, does not time, and does not
      claim to beat.
    hidden_overhead: 'The lower-order terms hide the harvest: forming R relation rows for an AP-constrained
      support may require many more trial targets than for a random support, and that cost is exactly
      the relation-probability penalty KN-OPEN-006 warns about. This contract holds R fixed by spending
      whatever harvest effort is needed and REPORTS that effort as a secondary metric without netting
      it against anything - which means the headline alpha comparison is charged nothing for a cost
      that could be decisive. The human overhead hides in the row-ordering convention, which is easy
      to set in a way that manufactures the result.'
  dominated_by: 'n/a (no result claimed) on attack axes. On the measurement''s own axes the Pareto
    check is real and I performed it over the rows this repository records: generic sparse Wiedemann
    (KN-LIT-016, KN-LIT-017) dominates on the solve axis because this contract runs no solve at all;
    the matched random support dominates on harvest cost because it needs no AP constraint; and no
    repository row reports an alpha value for any support, so on the alpha axis there is no incumbent
    to be dominated by and none to displace. On time and memory the contract is dominated by doing
    nothing, since it produces no algorithm.'
  sota_delta: No attack; measurement contribution only. Quantitatively the delta is that KN-OPEN-006
    currently records zero measured alpha values with two named candidate behaviours (order 1 versus
    growth like the square root of B), and a completed run would record alpha as an exact integer
    per cell across a ladder of at least four B values per arm with two shift operators, plus the
    staircase shape. No solve time, no relation rate and no cost exponent changes, and the net question
    the open problem asks remains unanswered by design.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'Instrument validity, meaning the random null lands near the generic ceiling
    and the Toeplitz control lands low: about 0.8 - this is elementary but the small dimensions worry
    me, since at B near 46 the ceiling is small enough that integer noise could blur both. AP support
    realisable at size B after curve-membership filtering: about 0.85, with the caveat that the surviving
    set is no longer a progression, which is separately the biggest threat to the whole idea. AP arm
    showing alpha at most half the random arm''s at the smallest B: about 0.35 - I think the curve-membership
    filter destroys most of the shift structure before the matrix exists, and the honest expected
    outcome is a small or absent gap. Gap persisting across the B ladder rather than closing: about
    0.15, distinctly lower, because persistence is the strong form and KN-OPEN-006 already names growth
    like the square root of B as the competing behaviour. Row-permutation control behaving correctly:
    about 0.7. Overall probability the run produces a defensible measured alpha curve with error bars,
    in either direction: about 0.65; probability it produces a positive persistent gap: about 0.15.'
