idea:
  id: IDEA-20260805-bf6448
  question_id: RQ-SDITH-001
  added: '2026-08-05'
  title: >-
    Grinding slack in the MPCitH transform: the interior optimum of the
    two-strategy forgery cost is a forced value that removes HALF the naive
    security bits, and whether SDitH already charges it is decidable in
    milliseconds by exact rational arithmetic
  class: audit

  claim: >-
    A parallel-repetition MPCitH signature with tau repetitions, N parties per
    repetition, and first-phase cheating probability p offers an adversary a
    continuum of mixed strategies indexed by tau' -- cheat in the first phase on
    tau' repetitions and in the second phase on the remaining tau - tau' -- with
    total cost min over tau' of [ 1/P_1(tau', tau, p) + N^{tau - tau'} ], where
    P_1 is the upper binomial tail. The NAIVE bound, min(tau log2(1/p),
    tau log2 N), is the tau' = tau and tau' = 0 endpoints, and the interior
    optimum is strictly and substantially below both. Derived here with exact
    rational arithmetic: at N = 256, p = 1/256, the interior optimum removes
    7.41, 15.78, 31.98, 69.22 and 140.59 bits at tau = 2, 4, 8, 16 and 32
    respectively, and at tau = 17 -- a plausible SDitH-shaped operating point --
    the naive bound reads 136 bits while the true cost is 64.02 bits, with the
    optimal adversary grinding tau* = 9 of the 17 repetitions. The ratio
    (true / naive) sits in [0.446, 0.537] for N = 256 across tau in [2, 64] and
    falls to 0.257 at N = 2: THE ATTACK REMOVES ROUGHLY HALF THE EXPONENT, MORE
    WHEN N IS SMALL. The audit is therefore a single decidable question:
    does SDitH's claimed forgery security equal the interior optimum at its own
    (tau, N, p), or the endpoint? If the interior -- the expected and honourable
    outcome -- the derivation is recorded, the grinding half of
    GOAL-SDITH-001's objective is answered in the negative with a computation
    rather than a reassurance, and a reusable instrument exists for every MPCitH
    goal in the program. If the endpoint, the slack is enormous and the finding
    is a forgery-cost error worth tens of bits.

  object_first_candidate:
    tracked_object: >-
      THE ADVERSARY'S STRATEGY SPLIT tau', followed as a free parameter through
      the cost function. Not the signature, not the transcript, not the MPC
      protocol: the integer tau' in {0, ..., tau} that says how many of the tau
      parallel repetitions the forger attacks in the first phase (by grinding
      the first challenge) versus the second (by guessing the party to open).
      The tracked quantity is the pair of costs (grinding cost, guessing cost)
      as tau' moves, and the object of interest is where their sum is minimized.
      A security bound that fixes tau' before quantifying over adversaries has
      simply not tracked this object, and that is the failure this proposal
      hunts.
    established_families_off_limits: >-
      Declared off-limits as the primary lens: (1) syndrome decoding and every
      decoding attack -- this proposal deliberately does not touch the hardness
      assumption, so that a finding here is independent of whether d-split SD is
      as hard as plain SD; (2) ISD in any form; (3) algebraic attacks on the MPC
      protocol's arithmetic; (4) side channels, faults, and implementation
      attacks; (5) generic hash-function attacks (collision, multi-target
      preimage) -- these are a separate and additive budget and mixing them in
      would double-count; (6) the GGM-tree and VOLE machinery, which is a real
      and unattacked cross-family angle but is a different object and belongs in
      its own record. What is left is exactly the transform's own soundness
      arithmetic, which is the smallest object that can carry the goal's
      grinding question.
    newness_score: >-
      THE ATTACK IS NOT NEW AND THIS RECORD DOES NOT PRETEND IT IS. A
      two-strategy forgery optimization against parallel-repeated 5-round
      Fiat-Shamir identification is recalled to be a standard and well-known
      result, attributed in memory to Kales and Zaverucha; that attribution is
      RECALLED-UNVERIFIED and no citation is asserted. Every serious MPCitH
      design since is believed to account for it. What IS new in this program is
      that the corpus contains no MPCitH forgery-cost computation of any kind,
      no record of the formula, and no instrument that evaluates it -- so the
      goal's own question ("whether the MPCitH transform's soundness leaves any
      grinding slack") currently has no way to be answered other than by
      trusting the specification. Building the instrument converts trust into
      arithmetic, and the instrument serves GOAL-MQOM-001 and GOAL-FAEST-001
      unchanged.
    testability_score: >-
      Maximal, and the cheapest thing in this session's output. The cost
      function is a finite minimization over tau + 1 integers of a sum of two
      exact rationals. Python's fractions module evaluates the whole tau <= 64
      grid in well under a second with no floating point anywhere in the
      decision path. No dependency: this container has numpy 2.4.6 and does not
      have sympy (measured this session); neither is required.
    survival_score: >-
      The object survives exactly as far as the two-phase structure does. It is
      defined for a 5-round protocol with one grindable challenge and one
      party-index challenge. It does not survive into a 3-round design with a
      single challenge, and it does not by itself cover an adversary who mixes
      strategies WITHIN a repetition rather than across repetitions -- a
      possibility the audit must state and check rather than assume away.

  mechanism: >-
    DERIVED AND COMPUTED IN THIS RECORD with exact rational arithmetic. The
    STRUCTURE of the cost function is RECALLED-UNVERIFIED and its verification
    against a primary source is Stage 0 of the paired experiment; every NUMBER
    below was computed here from that structure and is reproducible from the
    formula alone.

    THE SETUP. A 5-round MPCitH identification protocol, repeated tau times in
    parallel and made non-interactive by Fiat-Shamir. Per repetition the forger
    has two ways to cheat. FIRST-PHASE cheating: submit a false witness and hope
    the MPC checking protocol's first challenge accepts it anyway; this succeeds
    per repetition with probability p (the false-positive rate of the check).
    SECOND-PHASE cheating: run honestly, then hope the second challenge asks to
    open the one party the forger corrupted; probability 1/N. Because the
    challenges are hash outputs, the forger GRINDS: he re-hashes until the first
    challenge is favourable on as many repetitions as he wants, then grinds the
    second challenge for the rest.

    THE COST FUNCTION. Fix a target tau'. The forger grinds the first challenge
    until at least tau' of the tau repetitions pass phase one; the expected
    number of hash trials is 1/P_1(tau', tau, p) where
      P_1(tau', tau, p) = sum_{i = tau'}^{tau} C(tau, i) p^i (1 - p)^{tau - i}
    is the upper binomial tail. He then needs the second challenge to be
    favourable on the remaining tau - tau' repetitions, at cost N^{tau - tau'}.
    Total:
      cost(tau) = min_{0 <= tau' <= tau} [ 1/P_1(tau', tau, p) + N^{tau - tau'} ].
    THE MINIMUM IS OVER tau', AND tau' IS THE ADVERSARY'S CHOICE. That is the
    whole content, and it is also the quantifier-order attack: a bound that
    evaluates only tau' = 0 or tau' = tau, or that fixes tau' before quantifying
    over adversaries, is a bound on a strictly weaker adversary class.

    THE NAIVE BOUND IS THE TWO ENDPOINTS. tau' = 0 gives 1 + N^tau; tau' = tau
    gives p^{-tau} + 1. So the naive product bound is
    min(tau log2(1/p), tau log2 N) bits, and it is exactly what one writes down
    by multiplying per-repetition soundness errors. The interior optimum is
    strictly below it whenever tau >= 2 and 0 < p < 1 < N, and the gap is the
    GRINDING SLACK.

    RESULT 1 -- THE SLACK, COMPUTED. Exact rational arithmetic, this record,
    at N = 256 and p = 1/256:
      tau =  1 : naive   8.00, true   8.01, slack -0.01, tau* = 0
      tau =  2 : naive  16.00, true   8.59, slack  7.41, tau* = 1
      tau =  4 : naive  32.00, true  16.22, slack 15.78, tau* = 2
      tau =  8 : naive  64.00, true  32.02, slack 31.98, tau* = 4
      tau = 16 : naive 128.00, true  58.78, slack 69.22, tau* = 9
      tau = 17 : naive 136.00, true  64.02, slack 71.98, tau* = 9
      tau = 32 : naive 256.00, true 115.41, slack 140.59, tau* = 18
    The slack is monotone increasing in tau and reaches 141 bits at tau = 32.
    Note tau = 1: the slack is -0.01, i.e. ZERO to within the additive constant,
    because with a single repetition there is no interior point to occupy. That
    is a forced value and it is the proposal's null.

    RESULT 2 -- THE STRUCTURAL FACT: ROUGHLY HALF THE EXPONENT. At p = 1/N the
    two strategies cost the same per repetition and one might expect the mixture
    to gain nothing. It gains half. Computed here, ratio true/naive:
      N = 256 : tau =  2, 4, 8, 16, 32, 48, 64 ->
                0.5366, 0.5070, 0.5003, 0.4592, 0.4508, 0.4476, 0.4458
      N =  32 : 0.5593, 0.5116, 0.4844, 0.4394, 0.4217, 0.4174, 0.4138
      N =   2 : 0.8685, 0.5946, 0.4283, 0.3360, 0.2838, 0.2656, 0.2575
    The mechanism is transparent once seen: at the optimum the forger splits the
    repetitions roughly in half, paying about (tau/2) log2(1/p) on one side and
    about (tau/2) log2 N on the other, and pays only the LARGER of the two
    rather than their sum -- so the exponent halves. The additional erosion
    below 1/2 comes from the binomial multiplicity C(tau, tau'), which is a free
    gift to the grinder and grows fastest when N is small; at N = 2 it drives
    the ratio to 0.2575. The optimal split obeys
      tau* / tau -> log2 N / (log2 N + log2(1/p))  plus a binomial correction,
    which at p = 1/N predicts 1/2; the computed tau*/tau values are 0.500 at
    small tau rising to 0.562 (N = 256) and 0.750 (N = 2), the excess over 1/2
    being exactly that correction. THIS IS A FORCED VALUE WITH A DERIVED
    DIRECTION: tau* must be at least ceil(tau/2) whenever p >= 1/N, and the
    excess must be larger for smaller N.

    RESULT 3 -- WHAT THE AUDIT ACTUALLY DECIDES. Because the slack is 70+ bits
    at plausible operating points, no designer can have chosen tau against the
    naive bound and still claimed 128-bit security; the arithmetic would be off
    by more than half. THE EXPECTED FINDING IS THEREFORE THAT THERE IS NO SLACK,
    and the audit's value lies in three things it produces on the way: (a) the
    derivation the goal asks for, in place of an inherited assurance; (b) the
    exact tau* the specification's parameters imply, which is the adversary's
    optimal strategy and is not usually published; (c) a check on whether the
    specification's tau was chosen with any MARGIN over the interior optimum, or
    exactly at it -- a scheme sitting exactly at lambda has no slack in either
    direction and a tweak to N or p in the Round-3 revision moves it
    immediately, which is a live concern given the goal's recorded
    round3_tweaks_due date.

    RESULT 4 -- THE QUANTIFIER-ORDER AUDIT, WHICH COSTS NOTHING AND IS SEPARATE
    FROM THE ARITHMETIC. Write the soundness claim with explicit quantifiers.
    The correct form is: FOR ALL adversaries A making at most Q hash queries,
    the forgery probability is at most Q / cost(tau) where cost(tau) already
    contains the minimum over tau'. The defective form is: THERE EXISTS tau'
    such that FOR ALL A ... -- which permits the analysis to fix the split
    before the adversary chooses it. Reading the specification's soundness
    statement for which form it uses is a pen-and-paper check with a binary
    answer, and it is independent of every number above: a specification could
    have the right number by inheritance and the wrong statement, or the right
    statement and a stale number.

