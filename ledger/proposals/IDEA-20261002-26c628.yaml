  heuristic_assumptions:
    - id: HEUR-BINSTD-26c628-H1
      formal_statement: >-
        FORALL admitted composite toys (d,k) with dk≤41 and A,B∈F_{2^d}:
        measured cover genus g ≤ g★ (frozen), AND the matched prime-degree
        null reports empty intermediate-subfield GHS class.
      random_model_justification: >-
        Rigorous: GHS constructs a cover whose genus is a function of the
        Artin–Schreier / Artin–Schreier–Witt data of the curve over the
        subfield; when coefficients lie in F_{2^d} and the extension degree
        factors, a non-trivial cover is expected, while prime-degree fields
        have no proper intermediate subfield by definition. Classical: at
        toy composite sizes the genus stays small enough that g★ is a
        useful pre-registered ceiling; if measured g exceeds g★ or the null
        spuriously reports a cover, the band fails. Not a claim that GHS
        beats rho at deployed m.
      supporting_results:
        - KR-IC-5ea2f8
        - KR-IC-a4dd54
        - KR-IC-1fcdbc
      validation_experiment_ids: []
      falsification_condition: >-
        g > g★ on a completed composite cell, OR prime-degree null reports
        a non-empty GHS class, OR cover tooling absent (infrastructure stop).

