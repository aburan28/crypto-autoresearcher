  title: >-
    ON COMPOSITE-EXTENSION TOY CELLS, DOES MEASURED GHS COVER GENUS STAY ≤ g★
    WHILE THE PRIMED-DEGREE NULL STAYS EMPTY? On dk≤41 subfield toys with
    A,B∈F_{2^d}, measure cover genus g and test g ≤ g★ (frozen) against a
    matched prime-degree null with no intermediate subfield.

  class: heuristic_validation

  claim: >-
    KR-IC-5ea2f8 states that GHS Weil descent is effective only for special
    fields/curves; RQ-BINSTD already names composite-extension c2pnb-style
    rows as the GHS/Weil-descent class, but the ledger has no frozen toy
    instrument that measures cover genus g on admitted dk≤41 cells and
    contrasts it with a prime-degree null. CLAIM: for each admitted composite
    toy (d,k) with dk∈{17..41} and A,B∈F_{2^d}, the measured GHS cover genus
    g satisfies g ≤ g★ with g★ frozen at Stage 0, AND the matched prime-degree
    null of the same bit size reports no intermediate-subfield cover (empty
    GHS class) — OR the band fails and is recorded as
    genus-above-g★-or-null-nonempty at this scale. CLAIM TIER:
    heuristic_validation. NO break. NO exponent. NO m≥131 attack.
    Distinct from IDEA-20261001-0fcbe2 (τ-closed FB yield), 214fd3
    (last-fall degree), 556cea (solving vs first-fall), and Part-2 curve-lib
    clearance ideas.

  mechanism: >-
    OBJECT FRAME. Representation: binary curve E/F_{2^{dk}} with coefficients
    in F_{2^d} (composite) vs a matched prime-degree ordinary binary curve
    (null); Operation: run the GHS/cover construction to the candidate
    hyperelliptic Jacobian and read genus g (or an admitted genus proxy in
    the contract); Observable: g vs g★ on composite cells; emptiness on
    null. Trichotomy: Class I instrument (cover-structure meter).
    Lossy-projection: g discards the full attack cost; null is the
    prime-degree sibling where g must be undefined/empty by construction.
    OFF-LIMITS: Frobenius FB yield (0fcbe2); algebraic solving-degree meters;
    Magma/Sage provisioning mid-tick. WHAT IS NEW: a frozen g★ band plus
    prime-degree emptiness control on RQ-BINSTD composite toys.

