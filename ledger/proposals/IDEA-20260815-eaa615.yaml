idea:
  id: IDEA-20260815-eaa615
  question_id: RQ-QALG-74bf20
  added: '2026-08-15'
  title: >-
    GROVER-STYLE SPEEDUPS ARE QUOTED AGAINST CLASSICAL SEARCH AND THE
    QUANTUM MEMORY THEY NEED IS RARELY CHARGED: cost the QRAM requirement of
    every quantum ECC-relevant claim in this portfolio
  class: control

  claim: >-
    Many quantum speedups assume queries to a large quantum-accessible
    memory. QRAM at the required scale is not an established technology and
    its cost model is disputed. A speedup whose advantage evaporates once
    QRAM is charged at any plausible rate is not a threat, and which of this
    portfolio's claims are in that category is checkable.

  mechanism: >-
    For each quantum claim in the portfolio, identify whether it assumes
    QRAM and at what size. Recompute the claimed advantage under several
    QRAM cost models, including one where QRAM access costs scale with
    memory size.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of GOAL-QALG-001; grep 'QRAM', 'quantum memory', 'query model',
      'Grover'.
    results: >-
      Quantum claims appear throughout; no record identifies which assume
      QRAM or recomputes their advantage under charged QRAM.
    verdict: >-
      ADAPTATION. QRAM charging is a standard objection in quantum-
      algorithm costing; the contribution is applying it uniformly across
      this portfolio's claims.

  object_first_candidate:
    tracked_object: >-
      EACH QUANTUM CLAIM'S ADVANTAGE, recomputed under charged QRAM.
    lossiness: >-
      Quoting an advantage in the query model projects away the memory the
      queries need, which is the assumption most likely to be doing the
      work.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while claims state their memory model; those that do not
      are the audit's key entries and cannot be recomputed.

  null_object_control: >-
    NULL 1 -- a claim needing no QRAM, whose advantage must be unaffected by
    any QRAM cost model. NULL 2 -- free QRAM, which must reproduce each
    claim's published advantage.

  discriminated_from:
    - >-
        The portfolio-wide baseline-attribution record in this series,
        which re-scores against structure-exploiting classical baselines;
        this charges a resource the quantum side assumes. Both attack the
        same overclaim from different directions and should be read
        together.
    - >-
        The end-to-end quantum ECDLP cost record in this series, which
        charges repetitions and wall clock; QRAM is a different omitted
        term.

  assumptions:
    - >-
        Claims state their memory model explicitly enough to identify QRAM
        dependence; those that do not are listed as unrecomputable.
    - >-
        Plausible QRAM cost models exist; since they are disputed, several
        are swept rather than one chosen.

  predictions:
    - metric: >-
        no-QRAM claim null
      direction: different
      minimum_effect: >-
        FORCED unaffected by QRAM charging.
    - metric: >-
        free-QRAM null
      direction: different
      minimum_effect: >-
        FORCED to reproduce each published advantage.
    - metric: >-
        advantage under charged QRAM per claim
      direction: different
      minimum_effect: >-
        The measurement; claims whose advantage vanishes under any
        plausible charge should be re-labelled.
    - metric: >-
        count of claims not stating their memory model
      direction: different
      minimum_effect: >-
        Reported separately; these cannot be assessed and their standing
        is unclear.

  minimal_test:
    design: >-
      Three portfolio claims, three QRAM cost models, both nulls.
    controls:
      - >-
          No-QRAM claim null.
      - >-
          Free-QRAM reproduction null.
      - >-
          Several QRAM cost models swept, since the model is disputed.
      - >-
          Claims not stating a memory model listed rather than assumed
          QRAM-free.
    required_metrics:
      - >-
          Advantage per claim per QRAM cost model.
      - >-
          Both null outcomes.
      - >-
          List of claims not stating a memory model.
      - >-
          The QRAM cost models used, stated explicitly.

  falsification_conditions:
    - >-
        A null misbehaves. The recomputation is wrong.
    - >-
        A claim's advantage vanishes under every plausible QRAM charge.
        That claim is not a threat under charged memory and must be re-
        labelled.
    - >-
        Advantages survive all charges. The portfolio's quantum claims are
        robust to the QRAM objection, which is worth establishing.
    - >-
        Most claims do not state a memory model. The portfolio cannot be
        assessed on this axis, which is itself a finding about how its
        quantum claims are recorded.

  confounders:
    - >-
        QRAM MODEL DISPUTE: the cost of QRAM is genuinely contested, so a
        single model would determine the answer and several are swept for
        that reason.
    - >-
        IMPLICIT QRAM: a claim may need quantum-accessible memory without
        saying so, and classifying it QRAM-free would understate its
        assumptions.

  interpretation_limits:
    - >-
        Recomputes published claims under a charged resource; proposes no
        algorithm.
    - >-
        Scoped to the audited claims and swept QRAM models.
    - >-
        A vanished advantage under charged QRAM is a statement about the
        cost model, not a refutation of the algorithm.

  heuristic_assumptions:
    - id: HEUR-QALG-QRAM-1
      statement: >-
        A quantum claim's dependence on quantum-accessible memory is
        identifiable from its stated algorithm.
      rigorous_support: >-
        Rigorous ingredient: an algorithm making superposition queries
        to a data structure requires that structure to be quantum-
        accessible, which follows from the algorithm's description. THE
        GAP: some algorithms can be restructured to compute their data
        on the fly rather than store it, trading QRAM for gate count, so
        a naive QRAM classification may charge a claim for memory a
        smarter implementation would not need.
      falsification_condition: >-
        A claim classified QRAM-dependent that admits a QRAM-free
        implementation at comparable cost.
      validation_plan: >-
        SAMPLE: every audited claim, with its data-access pattern
        recorded. TAIL CHECK: claims where on-the-fly computation looks
        plausible, flagged for closer analysis. TRANSFER: none; the
        audit binds the claims as stated.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Symbolic recomputation under stated cost models.
    memory_exponent: >-
      Negligible.
    best_known: >-
      Incumbents are the published quantum claims and the QRAM cost-model
      literature; both are used and neither is improved.
    hidden_overhead: >-
      The on-the-fly-versus-stored tradeoff means a QRAM charge may be
      avoidable, which the audit flags rather than resolves.
    tradeoff_note: >-
      Charging QRAM gives a more honest advantage and depends on a
      disputed model; sweeping several is the only defensible response.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As algorithms: dominated by the published
    quantum work. As a uniform QRAM audit of this portfolio: none exists.
    Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: each portfolio quantum
    claim's advantage recomputed under several QRAM cost models, with a
    QRAM-free control, and an explicit list of claims that do not state a
    memory model at all.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.8 that both nulls behave. 0.5 that most claims state their memory
    model clearly enough to classify. 0.4 that at least one claim's
    advantage vanishes under plausible QRAM charging, which would require
    re-labelling it.

  status: proposed
  proposed_by: claude-code-session
