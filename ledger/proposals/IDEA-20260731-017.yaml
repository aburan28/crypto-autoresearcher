idea:
  id: IDEA-20260731-017
  question_id: RQ-ECTD-001
  title: >-
    Large-conductor vertical barrier — measure ECDLP-meter discontinuity across
    a prime conductor step in an ordinary volcano
  class: measurement
  claim: >-
    Let E_floor and E_crater be ordinary F_p-isogenous curves whose endomorphism
    rings differ by an index containing a prime q >= 17 (conductor step). At toy
    sizes (N in [40,60] bits), the Semaev/Gröbner/decomposition meter vector
    changes by at most a factor 10 across that vertical edge (continuity), OR —
    the interesting alternative — changes by a factor >= 100 on at least one
    primary meter (discontinuity). The measurement is two-sided and preregistered.
    Falsification of the trapdoor-useful discontinuity: across >=8 independent
    prime conductor steps, all meter ratios lie in [0.1, 10]. Continuity supports
    a barrier against vertical Teske analogues; discontinuity nominates the crater
    (or floor) as a candidate private endpoint for later path-hiding tests.
  mechanism: >-
    Galbraith (KN-LIT-7630) identifies the large-prime conductor gap as the case
    where ECDLP-equivalence via isogenies is least complete: computing the
    connecting isogeny may itself be hard. JMV expanders apply within a level;
    vertical steps change the End ring. A Teske-style trapdoor that places E_s at
    a different volcano level than E_pub needs an endpoint weakness that is
    level-specific, not merely a secret GLV endomorphism (constant-factor only).
    This experiment measures whether algebraic ECDLP meters jump across the
    conductor barrier at all.
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-07-31'
    corpus_paths_grepped:
      - ledger/proposals
      - knowledge/literature/KN-LIT-7630.md
      - ledger/H-ISO-001.yaml
    grep_results:
      - H-ISO-001 used horizontal ell-neighbors, not conductor-stratified vertical pairs
      - IDEA-20260726-010 mentions conductor pullbacks in another context
      - No ECTD-specific vertical meter discontinuity experiment in ledger
    conclusion: Measurement adaptation of Galbraith's conductor-gap boundary; novelty unverified.
  assumptions:
    - Conductor and End ring are computed correctly (Kohel / volcano algorithms).
    - Vertical isogenies of degree q are constructed and verified.
    - deg coprime to N on the measured edge.
  revise_status: revised_BATCH-002
  revise_notes_applied:
    - TASK-20260731-031
    - TASK-20260731-049
  predictions:
    - metric: ks_distance_vertical_vs_horizontal_ratio_samples
      direction: different
      minimum_effect: >-
        PRIMARY STATISTIC (preregistered): two-sample KS distance between the
        multiset of vertical meter ratios and the multiset of horizontal
        ell-neighbor meter ratios (same primary meters, identical FB/solver).
        Secondary: vertical_meter_ratio_max. Decision table below is binding.
  decision_table:
    primary_statistic: KS(vertical_ratios, horizontal_ratios) plus per-edge max ratio
    branches:
      - id: discontinuity_nominates_endpoint
        condition: >-
          KS rejects exchangeability at the pre-registered alpha AND >=1 vertical
          edge has primary-meter ratio >=100 (or d_reg delta >=2)
        interpretation: >-
          Nominates crater/floor as candidate private endpoint for later
          path-hiding tests. Does NOT establish Galbraith path-finding hardness
          and does NOT establish a trapdoor.
      - id: continuity_scoped
        condition: >-
          All >=8 prime conductor steps have all primary Semaev/FB/Macaulay meter
          ratios in [0.1,10] AND KS does not reject exchangeability vs horizontal
        interpretation: >-
          Equation-dependent Semaev discontinuity across those conductor steps
          absent at toy scale. Named obstruction for family (2) Semaev-meter
          channel only. Forward guidance: path-finding hardness (Galbraith) and
          non-Semaev private advantages remain open. NOT a proof that vertical
          Teske analogues are impossible.
      - id: instrument_void
        condition: >-
          End-ring computation disagrees with volcano degree on >1 edge, OR the
          GLV/CM endomorphism-cost channel fails its expected move on the known
          GLV pair while Semaev meters are simultaneously mis-attributed as the
          discontinuity signal
        interpretation: Harness void; no mathematical claim.
  minimal_test:
    design: >-
      Sample ordinary curves with [O_K : Z[pi]] divisible by a prime q in
      {17,19,23,29,31}. Climb/descend one q-isogeny step; compute the
      IDEA-20260731-016 / EXP-ECTD-001 meter vector on both endpoints under
      identical FB/solver conventions. Record End rings, conductors, and ratios.
      Prefer N in 40–56 bits. Collect >=8 independent vertical edges and a matched
      sample of horizontal ell-pairs at the same levels for the KS primary
      statistic. Include one known GLV/CM curve pair as an instrument check on the
      SEPARATE endomorphism-evaluation-cost channel only.
    controls:
      - Horizontal ell-isogeny pairs at the same level (expect ratio ~1; JMV-motivated).
      - >-
        Secret-GLV-only meter (endomorphism evaluation cost) as a SEPARATE channel —
        must not be misreported as Semaev sub-rho or as vertical Semaev discontinuity.
        Any Semaev meter movement on the GLV instrument pair is recorded but must
        not be promoted as vertical-discontinuity evidence.
      - >-
        Null: permute curve equations' Weierstrass models by F_p-isomorphism to ensure
        meters are not coordinate artifacts.
    required_metrics:
      - per-edge meter ratios (vertical and horizontal)
      - KS distance vertical vs horizontal ratio samples (primary)
      - fraction of vertical edges with ratio outside [0.1,10]
      - End/conductor certificates
      - endomorphism-cost channel result (isolated)
  falsification_conditions:
    - >-
      continuity_scoped branch under valid instrument checks: vertical Semaev
      discontinuity absent at tested scale (scoped barrier for Semaev-meter
      channel only; not Galbraith path hardness; not Teske impossibility).
    - 'End-ring computation disagrees with volcano degree on >1 edge: instrument void.'
  confounders:
    - Misidentified conductor (software bug).
    - Solver budget truncating one side differently.
    - Selecting only tiny class numbers where vertical structure is atypical.
  interpretation_limits:
    - Continuity of Semaev meters does not prove isogeny-evaluation hardness equals rho;
      it only closes equation-dependent Semaev trapdoors across that step at toy scale.
    - Galbraith's algorithmic conductor-gap hardness is a separate claim (path finding),
      not measured here.
  heuristic_assumptions:
    - id: HEUR-ECTD-VERT-1
      statement: >-
        Conditional on N and the imaginary quadratic field, Semaev meter laws at
        adjacent conductors differ only through End-module structure; absent a
        named End-specific solver, ratios concentrate near 1.
      rigorous_support: >-
        No theorem; motivated by failure of class-invariant weaknesses to vary and
        by H-ISO-001 horizontal homogeneity.
      validation_plan: >-
        Histogram of vertical ratios vs horizontal ratios; KS test between the two
        samples.
  target_complexity:
    time_exponent: measurement; trapdoor claim deferred
    memory_exponent: as in IDEA-20260731-016 meters
    best_known: rho at 1/2; Galbraith worst-case isogeny construction historically
      up to ~p^{3/2} (see also newer volcano algorithms, out of scope)
    hidden_overhead: End-ring computation
    tradeoff_note: null
  dominated_by: >-
    Pollard rho unless a discontinuous endpoint plus hard upward path is later
    shown; secret GLV alone is dominated as a Teske-class trapdoor
  sota_delta: >-
    First ledger measurement that stratifies ECDLP algebraic meters by conductor
    step for trapdoor feasibility; quantitative discontinuity threshold (>=100x)
    is explicit.
  estimated_cost:
    implementation: high
    compute: high
  recommended_priority: high
