  recommended_priority: medium

  honest_prior_of_survival: >-
    0.95 that the membership-degree closure (B) holds; it is a one-line fact about
    minimal polynomials. 0.85 that the rational fibre histogram in Stage 1 is
    concentrated at 2, closing (D1) - the residual risk is a subtlety about
