idea:
  id: IDEA-20260807-fed641
  question_id: RQ-MODEL-e61cb2
  added: '2026-08-07'
  title: >-
    THE FACTOR BASE IS DEFINED BY THE COORDINATE, SO ASK WHAT A COARSER
    COORDINATE BUYS - a degree-n coordinate names n geometric points per
    coordinate value, so a degree-d membership polynomial appears to describe n*d
    points instead of 2d; the RATIONAL count is what matters and it is g*d with
    g the rational deck order, so on a prime-order curve every coordinate gives
    exactly 2d and the membership degree can never drop below |V|; the residue is
    the isogeny-pullback coordinate, whose apparent ell^(m-1) prize is quantified
    here and shown to evaporate twice over
  class: representation

  claim: >-
    (A) THE QUESTION, POSED SHARPLY. The factor base in point-decomposition index
    calculus is not a set of points chosen freely - it is the preimage of a set V
    of COORDINATE VALUES, and the algebraic system encodes membership by a
    polynomial that vanishes on V. Two costs are therefore tied to the coordinate:
      (i) the DEGREE of the membership polynomial, which enters the Bezout number
      as d^(m-1) and the Groebner cost through the degree multiset;
      (ii) the NUMBER OF POINTS the factor base actually contains, which sets the
      relation yield B^m/N and the linear-algebra size.
    A coordinate whose map E -> P^1 has larger degree names more points per
    coordinate value and so appears to improve the ratio B/d. This record asks
    exactly how much, and answers it.

    (B) THE MEMBERSHIP-DEGREE CLOSURE, WHICH IS ELEMENTARY AND ABSOLUTE. For any
    coordinate f and any finite V contained in P^1(F_p), the minimal polynomial
    vanishing exactly on V has degree |V|, in every coordinate. A Moebius change
    of coordinate maps a set of size |V| to a set of size |V| and a polynomial of
    degree |V| to one of degree |V| after clearing denominators. Therefore:
      NO CHOICE OF DEGREE-2 COORDINATE CAN REDUCE THE MEMBERSHIP-POLYNOMIAL DEGREE
      BELOW |V|. The membership block of the degree multiset is a model invariant.
    The only way around this is for V itself to be describable by a lower-degree
    condition - i.e. for V to be a fibre of some other low-degree map - which is
    exactly (C).

    (C) THE COARSE-COORDINATE TRADE, COMPUTED. Let f have degree n and let V have
    size d. The factor base is f^(-1)(V), of GEOMETRIC size n*d. Two regimes:
      (C1) f Galois with deck group inside Aut(E,O), |Gamma| = n. Then
      deg_{t} S_m^f = n^(m-2) (IDEA-20260807-dadcd2 L1) and the Bezout number at
      geometric factor-base size B = n*d is n^(m-2)(B/n)^(m-1) = B^(m-1)/n. Larger
      n is better - but n is bounded by |Aut(E,O)| <= 6.
      (C2) f non-Galois of degree n. Then deg_{t} S_m^f = n^(m-1) and the Bezout
      number is n^(m-1)(B/n)^(m-1) = B^(m-1). Strictly worse than (C1) with n = 2
      by a factor 2, for every n. The Hessian x is the worked instance
      (IDEA-20260807-5f5ace).
    So the coarse-coordinate idea has exactly one non-losing form: quotient by
    genuine automorphisms, capped at 6.

    (D) THE ONE ESCAPE THAT LOOKS LIKE IT WORKS, AND THE TWO PLACES IT DIES.
    Let pi : E -> E/<T> be an F_p-rational cyclic ell-isogeny and take
    f = x' o pi, the Weierstrass coordinate of the codomain pulled back. Then
    deg f = 2ell, f is invariant under negation AND under translation by T, and a
    direct fibre count gives deg_{t} S_m^f = 2^(m-2) - NO DEGREE PENALTY AT ALL
    despite n = 2ell. Naively B = 2ell*d, so the Bezout number is
    2^(m-2) d^(m-1) = B^(m-1)/(2 ell^(m-1)) - a factor ell^(m-1) better than
    Weierstrass, GROWING WITH m. This is the single most attractive-looking
    construction in L11 and it is exactly the escape route C2 that the inherited
    PO-001 analysis (inputs/refs/research/
    proofs_Dreg_conservation_weil_invariance.md, section 1.5) calls "the strongest
    surviving candidate to break conservation". It dies twice:
      (D1) THE RATIONALITY DEATH, WHICH IS DECISIVE. The geometric fibre is
      {+-P + jT}, of size 2ell. Its RATIONAL part is what the factor base contains.
      If T is not F_p-rational - which is forced when #E(F_p) is prime, and is the
      generic situation for an Elkies-prime isogeny where only the SUBGROUP <T> is
      Galois-stable - then P + jT is irrational for j != 0 and the rational fibre
      is just {+-P}, of size 2. So B = 2d, not 2ell*d, and the Bezout number is
      B^(m-1)/2 - EXACTLY TIED with short Weierstrass. The prize was an artifact of
      counting geometric points as though they were rational. THIS IS THE NAMED
      OBSTRUCTION AND IT IS ARITHMETIC, NOT GEOMETRIC.
      (D2) THE LIFTING DEATH, WHICH WOULD HAVE KILLED IT ANYWAY. Suppose T were
      rational (a curve with a rational ell-torsion point, hence cofactor at least
      ell, hence not a cryptographic curve). Then B = 2ell*d and the Bezout gain
      ell^(m-1) is real - but every solved coordinate tuple must be LIFTED, and
      identifying which of the (2ell)^(m-1) preimage combinations actually sums to
      the target costs ell^(m-1) times more than the 2^(m-1) of the Weierstrass
      case. The two factors are exactly equal and opposite. The construction is a
      wash even in the arithmetic regime where it is available, UNLESS the
      Groebner stage strictly dominates the lifting stage - which it does in
      practice, and which is the one honest regime in which this construction could
      still win a constant. That regime is measurable and is the actual experiment.
      (D3) THE COMPENSATION THAT DOES NOT SAVE IT. One might hope the relaxation
      "sum P_i = R + jT" is usable after multiplying by ell, since ell*T = O and
      gcd(ell, N) = 1. It is - but it is moot, because by (D1) there is no
      relaxation to exploit over F_p in the prime-order case: the ambiguity class
      <T> meets E(F_p) trivially, so any rational solution already has j = 0.
      Recording this is important because it is the step at which a careless
      version of this idea would claim a false gain.

    (E) THE THREE OUTCOMES.
      OUTCOME 1 - measured rational fibres have size 2 for the pullback coordinate
        on a prime-order curve. (D1) confirmed, the coarse-coordinate route is
        CLOSED with a named arithmetic obstruction, and L11's factor-base question
        is answered: no model gives a cheaper membership test.
      OUTCOME 2 - measured rational fibres have size 2ell. (D1) is wrong, the
        ell^(m-1) Bezout gain is real, and the lane REOPENS with an explicit
        quantitative target and a clear next experiment (measure whether the
        Groebner saving beats the lifting cost). This would be the most valuable
        outcome in the whole lane and it is why the record is filed rather than
        assumed.
      OUTCOME 3 - on a curve WITH rational ell-torsion, the measured Bezout gain
        is ell^(m-1) and the measured lifting cost is ell^(m-1): a wash confirming
        (D2), with the residual question of which stage dominates being answered by
        the measured wall times. That is a real, if constant-factor, engineering
        result about where index-calculus time actually goes.

  resource_label: >-
    R1 (coordinate values as field data defining the factor base) and R2 (model /
    coordinate choice). The isogeny-pullback variant additionally touches R4 (the
    isogeny), but only to BORROW A FUNCTION - no curve is moved and no walk is
    performed, so the R4 use is a coordinate construction rather than a transport.
  admissibility: admissible
  admissibility_argument: >-
    ADMISSIBLE, with a caveat that must be stated because it is the kind of thing
    the campaign's filter exists to catch. R1 and R2 escape the generic-group
    closure (KN-FIND-b7e091) because factor-base membership and polynomial degree
    are field-level facts a group-label simulator cannot produce. The R4 touch is
    NOT the inadmissible kind: the proposal does not apply an isogeny to points of
    G and read the images (which would be scalar multiplication by H-ENDO-001, and
    closed); it uses the isogeny only to define a rational FUNCTION on E, and the
    entire content is the degree and rationality of that function's fibres. If a
    reviewer judges that pulling a coordinate back along an isogeny is
    "applying phi to points of G in disguise", the correct response is (D1)
    itself: the construction demonstrably yields no advantage, so nothing turns on
    the classification.

  discriminated_from:
    - >-
      IDEA-20260807-dadcd2, which states the deck-group law. This record is the
      factor-base half: it derives the membership-degree closure (B), computes the
      coarse-coordinate trade (C), and works the isogeny-pullback candidate (D) in
      full, including the lifting accounting that the law does not carry.
    - >-
      The inherited PO-001 escape route C2 ("a genuine rational map, e.g. a
      2-isogeny x-coordinate map ... untested and could in principle lower both
      blocks"). This record TESTS it and predicts it fails, for a reason PO-001
      does not consider - rationality of the fibre rather than degree of the map.
    - >-
      L4 (RQ-EQIC-8cb959, phi-equivariant relation collection) in
      DECOMPOSITION.md. That lane varies the factor base under a fixed coordinate
      and asks about phi-stability; this record varies the COORDINATE and asks
      what the factor base becomes. They meet only at the point that both must
      compare against size-matched bases, and this record adopts that discipline.
    - >-
      IDEA-20260803-e2f5bd, which composes the Bezout bound with an arity
      threshold to exclude algebraic factor bases at fixed theta. That record
      takes the Bezout expression 2^(m-2) d_p^(m-1) as given; this one asks which
      coordinates can change the two factors in it, and answers "neither, over
      F_p, on a prime-order curve".
    - >-
      NR-021 as summarised in the inherited document ("the cardinality barrier
      blocks the four natural constructions - CM eigenset, isogeny image,
      QR-condition, division polynomial - on prime-order E(F_p)"). That is an
      argument about which SETS can be factor bases; (B) here is an argument about
      the DEGREE of the polynomial describing any set. Complementary, and the
      inherited note explicitly labels its own version an OBSERVATION rather than
      a theorem.

  object_first_candidate:
    tracked_object: >-
      THE RATIONAL FIBRE of the coordinate map - the set f^(-1)(t) intersected
      with E(F_p) - tracked as a function of the coordinate, with its cardinality
      as the scalar observable.
    established_families_off_limits: >-
      Off-limits as primary lens: rho, BSGS, Semaev-as-algorithm, Weil descent,
      pairing transfer, lattice/HNP, endomorphism leverage on G. The object is a
      set-theoretic property of a map restricted to rational points.
    lossiness: >-
      LOSSY AND COMPATIBLY SO, and this record is where the DISTINCTION between
      geometric and rational loss is the whole content. The projection P -> f(P)
      forgets the fibre. Geometrically the fibre has n elements; arithmetically it
      has g. The discard is compatible with the group operation exactly to the
      extent that the discarded part is a group orbit - which is the deck-group
      condition - and it is USEFUL exactly to the extent that the discarded part is
      RATIONAL, which is a strictly stronger condition. A projection that discards
      irrational data discards nothing the algorithm ever had, so it is lossy on
      paper and injective in practice. That observation is the cheapest possible
      answer to "is a coarser coordinate new?" and it costs no compute.
    propagation: >-
      One step - add a rational point Q - sends the rational fibre f^(-1)(t) cap
      E(F_p) to a subset of f^(-1)(t') cap E(F_p) with the SAME cardinality when
      the deck group is rational, and to a set of possibly different cardinality
      when it is not. Measuring the cardinality histogram over all rational t is
      therefore a one-step propagation measurement, and it is Stage 1 of the test.
    survival_score: >-
      Survives every change of coordinate as a well-defined quantity. Dies as a
      SOURCE OF ADVANTAGE the moment the field is F_p and the curve has prime
      order, which is the cryptographic case. Comes back to life over F_{p^k} for
      k large enough to rationalise the deck group - which is a positive control,
      not an attack, since the DLP there is a different problem.

  mechanism: >-
    STEP 1 - THE RATIONAL FIBRE HISTOGRAM, WHICH IS THE WHOLE EXPERIMENT IN ONE
    MEASUREMENT. Take a toy curve E/F_p of PRIME order with an F_p-rational cyclic
    ell-isogeny for a small Elkies prime ell (found by checking which small ell
    give a rational kernel polynomial factor). Construct f = x' o pi explicitly as
    a rational function on E using Velu's formulas. Enumerate E(F_p) exhaustively
    at 16 bits, evaluate f on every point, and histogram |f^(-1)(t) cap E(F_p)|
    over all attained t. PREDICTED: the histogram is concentrated at 2, with 1 at
    the branch points. If it shows 2ell anywhere, (D1) is false.
    STEP 2 - THE SAME ON A CURVE WITH RATIONAL ell-TORSION. Construct a toy curve
    with a rational point of order ell (cofactor at least ell), repeat the
    histogram. PREDICTED: concentrated at 2ell. This is the positive control that
    the instrument can see a large rational fibre at all - without it, a
    concentration at 2 in Step 1 proves nothing about the mechanism.
    STEP 3 - THE MEMBERSHIP-DEGREE CHECK. For each coordinate in the lane's model
    set, build a factor base of a fixed RATIONAL size B, express V in that
    coordinate, and compute the degree of the minimal vanishing polynomial.
    PREDICTED: exactly B/2 in every degree-2 coordinate, exactly B/(2ell) in the
    pullback coordinate on the cofactor curve of Step 2, and exactly B/2 in the
    pullback coordinate on the prime-order curve of Step 1.
    STEP 4 - THE BEZOUT AND LIFTING LEDGER. For each arm compute the Bezout number
    from the measured degrees, and MEASURE the lifting cost as the actual number
    of group operations spent identifying the correct preimage combination per
    solved tuple. Report both columns side by side. PREDICTED on the cofactor
    curve: Bezout down by ell^(m-1), lifting up by ell^(m-1), product unchanged.
    STEP 5 - WHICH STAGE DOMINATES. Measure the wall time split between the
    Groebner stage and the lifting stage in each arm. This is the only place where
    the construction of (D) could still deliver a constant, and the measurement is
    the honest way to find out. PREDICTED: Groebner dominates by orders of
    magnitude at these sizes, so the wash of (D2) is not actually a wash in wall
    time - and the record must then state clearly that this apparent gain exists
    only on curves with cofactor at least ell, i.e. never on a prime-order curve,
    so it is not transportable.
    STEP 6 - THE NULLS. Random-Moebius null (must leave every count unchanged) and
    a RANDOM degree-2ell rational function with no isogeny structure (its rational
    fibre histogram must be irregular, confirming that a concentrated histogram is
    a structural fact and not an artifact of evaluating any high-degree map).

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Grep over ledger/ and knowledge/ for "factor base" and "membership" and
      "isogeny image" (2026-08-07). Full reads of KN-TECH-002, KN-TECH-003 (via
      cross-reference), KN-TECH-007, KN-FIND-007 (screening rule for mean yield,
      as cited by IDEA-20260803-e2f5bd), IDEA-20260803-e2f5bd,
      DECOMPOSITION.md L4 and L13, and inputs/refs/research/
      proofs_Dreg_conservation_weil_invariance.md sections 1.5 and 1.6.
    results: >-
      INTERNAL - the corpus contains extensive factor-base work (KN-OPEN-020, the
      Bezout composition of IDEA-20260803-e2f5bd, the NR-021 cardinality-barrier
      argument summarised in the inherited document), but ZERO records compute the
      RATIONAL fibre size of a coordinate map or state the membership-degree
      closure (B). The isogeny-pullback coordinate is named as OPEN in PO-001
      section 1.5 item C2 and has never been worked through. No duplicate found.
      EXTERNAL - Semaev, Gaudry and Diem's factor-base constructions are standard
      (KN-TECH-002); over extension fields the Gaudry-Diem factor base is a
      subfield-defined subvariety, which is exactly the low-degree membership
      description that prime fields lack, and that contrast is the background of
      (B) rather than a novelty claim. Cheng-Kodera-Miyaji 2019 is Stage-0 reading.
    verdict: adaptation

  null_object_control: >-
    MANDATORY. Matched null - a RANDOM rational function on E of the same degree
    2ell, constructed without isogeny structure (e.g. a random ratio of forms of
    matched degree), with the same rational-fibre histogram measured on the same
    curve. It has the same shape - same degree, same domain, same field - and it
    isolates "isogeny pullback" from "high-degree map". DECAY PARAMETER: ell. As
    ell grows, any genuine effect attributable to the isogeny structure must scale
    with ell in the predicted way (rational fibre 2 always, geometric fibre 2ell);
    a measured quantity that does NOT respond to ell is measuring the evaluation
    code, not the mathematics. SECOND NULL - the same construction over F_{p^k}
    where the kernel becomes rational, which must show the fibre size JUMP to
    2ell. Both directions are required: the instrument must fail to see a large
    rational fibre where there is none and must see one where there is.

  assumptions:
    - >-
      An F_p-rational cyclic ell-isogeny exists for the chosen small ell. This is
      the Elkies condition on ell for the curve and is checked, not assumed;
      roughly half of small primes qualify for a given ordinary curve.
    - >-
      Velu's formulas are implemented correctly. Verified by checking that f is
      constant on <T>-cosets over an extension where T is defined, and that the
      codomain curve equation is satisfied.
    - >-
      gcd(ell, N) = 1, which is automatic for small ell and prime N of
      cryptographic-analogue size, and which is required for the (D3) scaling
      argument to be meaningful even though (D1) makes it moot.
    - >-
      "Prime order" for the Step 1 curve means #E(F_p) itself is prime, not merely
      that the working subgroup is; otherwise rational torsion may exist elsewhere
      and confound the histogram.

  proof_search_map:
    bottleneck: >-
      The rational-fibre count of Step 1. It is one histogram over an exhaustively
      enumerated toy group, it decides (D1), and (D1) decides whether the lane's
      most attractive construction lives or dies.
    baseline_embedding:
      parameter_slice: >-
        ell = 1, i.e. f = x itself. The pipeline must return rational fibre size 2
        everywhere except the 1-3 rational branch points, membership degree exactly
        B/2, and Bezout exactly 2^(m-2)(B/2)^(m-1), reproducing KN-TECH-002 and
        IDEA-20260803-e2f5bd.
      reproduction_check: >-
        Exact integer agreement of the ell = 1 arm with the Weierstrass numbers
        already used across EXP-SEMAEV, on a frozen instance.
    observation_collision:
      observable: The rational-fibre size histogram of f.
      distinct_preimage_search: >-
        REQUIRED. Two very different coordinates - x itself and the isogeny
        pullback on a prime-order curve - are PREDICTED to share the observable
        (concentrated at 2). That collision is the closure, and it must be
        confirmed rather than assumed, because if the pullback histogram differs
        at all the whole argument changes.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Reduce "can a model give a cheaper factor-base membership test?" to
          "how large is the rational fibre of the coordinate map?", a single
          integer computable by enumeration at toy scale.
        predicted_gain: >-
          Replaces an open-ended search over factor-base constructions with one
          histogram per candidate coordinate.
      - transform: boundary_lift
        proposed_object: >-
          Lift from F_p to F_{p^k} where the deck group becomes rational, to
          exhibit the regime in which the construction DOES work and thereby
          locate the boundary precisely.
        predicted_gain: >-
          Turns a negative into a boundary statement with a named crossing point,
          which is the difference between a closure and a fatigue report.
    quantifier_order: >-
      CLAIMED - FORALL F_p-rational coordinates f on a curve E/F_p and FORALL
      finite V in P^1(F_p), the minimal vanishing polynomial of V has degree
      exactly |V|; and FORALL prime-order E/F_p and FORALL F_p-rational cyclic
      ell-isogenies pi with irrational kernel points, the rational fibres of
      x' o pi have size 2.
      NOT CLAIMED - that no factor base admits a low-degree description by ANY
      means. A subvariety-defined base over an extension field does (that is
      Gaudry-Diem), and the claim here is confined to prime fields and to
      descriptions by a polynomial in one coordinate.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On a prime-order prime-field curve, no choice of coordinate reduces the
        factor-base membership polynomial degree below the factor-base size
        divided by 2, and the isogeny-pullback coordinate yields exactly the same
        Bezout number as short Weierstrass." It can NEVER certify anything about
        extension fields, about non-polynomial membership descriptions, or about
        factor bases defined by conditions other than a coordinate value.
      nearby_object_control: >-
        THE SAME CONSTRUCTION OVER F_{p^k} WITH THE KERNEL RATIONAL, where the
        conclusion FAILS and the ell^(m-1) gain is real. Naming the object on
        which the conclusion fails is what makes the closure a closure rather than
        an assertion.
    proof_obligations:
      - claim: The minimal vanishing polynomial of V has degree |V| in any coordinate.
        responsibility: correctness
      - claim: The isogeny-pullback coordinate has summation degree 2^(m-2).
        responsibility: correctness
      - claim: The rational fibre is the rational part of the deck orbit.
        responsibility: correctness
      - claim: A prime-order curve has no rational ell-torsion for small ell.
        responsibility: baseline
      - claim: The lifting cost scales as n^(m-1) and exactly offsets the Bezout gain.
        responsibility: runtime
      - claim: Nothing here applies over extension fields.
        responsibility: scope

  predictions:
    - metric: >-
        rational fibre size histogram of the isogeny-pullback coordinate on a
        PRIME-ORDER toy curve
      direction: lower
      minimum_effect: >-
        Concentrated at EXACTLY 2 (with 1 at branch points), never 2ell. A single
        rational fibre of size greater than 2 falsifies (D1) and reopens the lane.
    - metric: >-
        rational fibre size histogram of the same coordinate on a curve with a
        rational ell-torsion point
      direction: higher
      minimum_effect: >-
        Concentrated at EXACTLY 2ell. This is the positive control; failure means
        the instrument cannot detect a large rational fibre and the negative in the
        prime-order arm is uninterpretable.
    - metric: >-
        degree of the minimal membership polynomial at fixed rational factor-base
        size B, across all coordinates in the lane's model set
      direction: different
      minimum_effect: >-
        EXACTLY B/2 in every arm on a prime-order curve. Any arm below B/2 is a
        falsification of (B) and would be a genuine discovery.
    - metric: >-
        Bezout number of the arity-m decomposition system at fixed rational B, per
        coordinate
      direction: different
      minimum_effect: >-
        EXACTLY B^(m-1)/2 for every degree-2 coordinate and for the pullback
        coordinate on a prime-order curve; B^(m-1)/(2 ell^(m-1)) for the pullback
        on a cofactor-ell curve.
    - metric: >-
        measured group operations spent on lifting per solved tuple, pullback arm
        versus Weierstrass arm, cofactor-ell curve
      direction: higher
      minimum_effect: >-
        Ratio EXACTLY ell^(m-1), matching the Bezout ratio and confirming the wash
        of (D2). A ratio materially below ell^(m-1) would mean lifting is cheaper
        than the fibre count implies and the construction wins a real constant.
    - metric: >-
        share of total wall time spent in the Groebner stage versus the lifting
        stage
      direction: different
      minimum_effect: >-
        Reported as a percentage split per arm. This decides whether the (D2) wash
        is a wash in practice, and the answer is a number rather than an argument.

  minimal_test:
    design: >-
      STAGE 1 (minutes, THE DECISIVE STEP): construct the isogeny-pullback
      coordinate on a prime-order 16-bit curve and histogram its rational fibres by
      exhaustive enumeration of E(F_p). This alone settles (D1).
      STAGE 2 (minutes, POSITIVE CONTROL): the same on a cofactor-ell curve;
      histogram must concentrate at 2ell.
      STAGE 3 (minutes): membership-degree measurement across all coordinates at
      fixed rational B.
      STAGE 4 (an hour): Bezout numbers and measured lifting costs per arm at
      m = 3, 4.
      STAGE 5 (an hour): wall-time split between Groebner and lifting per arm.
      STAGE 6 (minutes): the two nulls and the ell-sweep decay test.
    controls:
      - ell = 1 baseline reproducing the Weierstrass numbers exactly
      - cofactor-ell curve as the positive control for a large rational fibre
      - random degree-2ell rational function as the matched null
      - random-Moebius null per IDEA-20260807-4fc635
      - >-
        the same construction over F_{p^k} with the kernel rationalised, as the
        boundary control showing where the conclusion stops holding
    required_metrics:
      - rational fibre histogram per coordinate per curve
      - geometric fibre size, computed separately, so the two are never conflated
      - membership polynomial degree at fixed rational B
      - Bezout number per arm
      - measured lifting group operations per solved tuple
      - Groebner versus lifting wall-time split
      - the Elkies-primality check result for each candidate ell

  falsification_conditions:
    - >-
      A rational fibre of size greater than 2 appears for the pullback coordinate
      on a prime-order curve. (D1) is false; the lane REOPENS with an explicit
      ell^(m-1) target. This is the outcome to hope for and it is why the record
      exists.
    - >-
      The cofactor-ell positive control does NOT show fibre size 2ell. The
      instrument cannot see the effect and the prime-order negative is
      uninterpretable; nothing is reported.
    - >-
      A membership polynomial of degree below B/2 is found in any coordinate.
      (B) is false and that would be a real discovery.
    - >-
      The measured lifting ratio is materially below ell^(m-1) on the cofactor
      curve. (D2) is wrong and the construction wins a constant even where it is
      available.
    - >-
      Velu construction verification fails. Infrastructure; nothing reported.
    - >-
      The random degree-2ell null also shows a concentrated fibre histogram. The
      histogram is not measuring isogeny structure and the interpretation collapses.

  confounders:
    - >-
      GEOMETRIC VERSUS RATIONAL COUNTING. This is THE confounder of the record and
      the reason it exists; both quantities must be measured and reported in
      separate columns, never merged. The corpus has an inherited near-miss here:
      PO-001's C2 note reasons about a degree-2 rational map without asking about
      the rationality of its fibres.
    - >-
      ELKIES VERSUS ATKIN PRIMES. Whether a rational cyclic ell-isogeny exists at
      all depends on ell being Elkies for the curve; a null result obtained because
      no isogeny existed is not evidence about fibres.
    - >-
      A curve with cofactor ell is not a cryptographic curve, so Stage 2 and every
      conclusion drawn from it are scoped to non-prime-order curves.
    - >-
      Exhaustive enumeration of E(F_p) is feasible only at toy scale; at 16 bits it
      is about 65000 points and trivial, at 32 bits it is 4 billion and is not. The
      histogram method does not scale and the record says so rather than promising
      it will.
    - >-
      Lifting cost measured in group operations is implementation-dependent; the
      RATIO between arms is the metric, not the absolute count.

  interpretation_limits:
    - >-
      ASYMPTOTIC CEILING, STATED AS THE BRIEF REQUIRES. NO exponent change is
      claimed. The construction analysed in (D) would, if it worked, deliver a
      factor ell^(m-1) in the Bezout number - a CONSTANT for fixed ell and m, and
      not an exponent, since ell is bounded by the curve's isogeny structure and m
      by the optimisation of the index-calculus tradeoff. It is predicted not to
      work at all over F_p on prime-order curves. Diem's and Gaudry's asymptotics
      are model-agnostic and are untouched.
    - >-
      The membership-degree closure (B) is confined to factor bases described by a
      polynomial in ONE coordinate. It says nothing about subvariety-defined bases
      over extension fields, which is exactly how Gaudry-Diem index calculus gets
      its low-degree membership condition, and the contrast is the reason prime
      fields are hard.
    - >-
      Everything in Stage 2 and Stage 5 is measured on curves with cofactor at
      least ell and does not transport to prime-order curves.
    - >-
      Toy scale, claim_tier toy (AGENTS.md rule 7). Exhaustive enumeration is a
      16-bit technique.

  reachability_gate: >-
    TRIVIAL FOR THE COORDINATE, AND EXPLICITLY NON-TRIVIAL FOR ONE INGREDIENT, SO
    THIS RECORD STATES BOTH RATHER THAN LEAVING THE FIELD BLANK. The model change
    itself is free: choosing a coordinate on a fixed curve is a substitution, cost
    O(1), probability 1, no walk, no mixing time - T5 (DECOMPOSITION.md section 3)
    is passed vacuously and the curve, the points and the group never move. The
    ONE ingredient with a cost is the ell-isogeny used to BUILD the pullback
    coordinate: constructing it requires an F_p-rational cyclic ell-isogeny, found
    by factoring the modular polynomial Phi_ell(j, Y) or the ell-division
    polynomial, at cost polynomial in ell and log p - cheap for small ell and NOT
    a vectorization problem, because ANY rational ell-isogeny will do and no
    specific target curve is required. That is the "goodness is common enough to
    hit" branch of T5, not the "specified curve" branch, so even this ingredient
    does not invoke the p^(1/4) barrier. The gate is therefore passed, and the
    construction's failure in (D1) is arithmetic rather than a reachability cost.

  target_complexity:
    time_exponent: >-
      NO EXPONENT CHANGE CLAIMED, AND THE PREDICTED OUTCOME IS AN EXACT TIE. On a
      prime-order curve every coordinate gives Bezout B^(m-1)/2 and membership
      degree B/2 - identical to short Weierstrass. The hypothetical gain analysed
      and rejected is a factor ell^(m-1), a constant for fixed ell and m.
    memory_exponent: >-
      Unchanged. Membership degree unchanged means the degree multiset feeding the
      Macaulay matrix is unchanged (KN-TECH-011); the pullback coordinate's larger
      map degree does not enter the polynomial system at all.
    best_known: >-
      Rho at 0.886 sqrt(N) with O(1) memory (KN-TECH-001, KN-TECH-006); BSGS at
      sqrt(N)/sqrt(N) (KN-TECH-031); automorphism-discounted rho (KN-TECH-018);
      Semaev index calculus at exp(c sqrt(log N log log N)) (KN-FIND-f8c290) with
      BKK constants (KN-FIND-2a8b7e, KN-FIND-c7d31e).
    hidden_overhead: >-
      The lifting cost n^(m-1), which is routinely omitted from Bezout-based cost
      comparisons and which is what makes (D2) a wash. Disclosed prominently
      because the entire attractiveness of the coarse-coordinate idea comes from
      omitting it. Also disclosed: Velu evaluation of the pullback coordinate costs
      O(ell) field operations per point, a further constant against the
      construction.
    tradeoff_note: >-
      The one genuine tradeoff identified is Groebner cost versus lifting cost:
      the coarse coordinate moves work from the former to the latter at an exactly
      compensating rate, so it is a pure tradeoff with no net gain in the Bezout
      model, and the practical question is only which stage dominates wall time.
      That is measured in Stage 5 rather than argued.
  dominated_by: >-
    AS AN ATTACK - mounts none, dominated on every axis by every frontier row,
    each checked: parallel rho with distinguished points (0.886 sqrt(N) group
    operations, O(1) memory, 0 queries) KN-TECH-001/KN-TECH-006;
    automorphism-discounted rho KN-TECH-018; BSGS (sqrt(N) time, sqrt(N) memory)
    KN-TECH-031; Semaev index calculus KN-FIND-f8c290 with BKK constants
    KN-FIND-2a8b7e/KN-FIND-c7d31e.
    AS A FACTOR-BASE CONSTRUCTION - exactly tied with the standard x-coordinate
    interval base on a prime-order curve (same membership degree, same Bezout, same
    yield), and dominated by it on implementation cost because the pullback
    coordinate costs O(ell) extra field operations per evaluation. There is no axis
    on which the coarse coordinate wins over F_p.
  sota_delta: >-
    Zero speedup, predicted exactly. The quantified statement is: membership degree
    B/2 in every coordinate (delta 0), Bezout B^(m-1)/2 in every coordinate
    (delta 0), and the hypothetical ell^(m-1) gain measured to be exactly offset by
    an ell^(m-1) lifting cost on the only curves where it is available at all. The
    delta to the corpus is the resolution of PO-001's escape route C2, which has
    stood open in the inherited analysis, from "untested, strongest surviving
    candidate" to a closed case with a named arithmetic obstruction and a stated
    boundary (extension fields, where it does work).

