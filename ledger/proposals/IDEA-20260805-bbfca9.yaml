  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.30 that the omitted-multiplier correction accounts for at least half of the
    n = 12 D6 null's extra_6 = 7110. It is not higher because the hitting-set
    condition is genuinely restrictive -- a multiplier one size above the bound
    must meet EVERY support monomial of the partner equation, and the recorded
    supports have 13 to 33 monomials each, so many pairs will admit nothing;
    because omitted multipliers may be linearly dependent on K^poly and add no
    rank at all; and because the (n = 12, D = 5) cell has extra_5 = 0, which
    forces the correction to vanish there and shows the mechanism is not
    universally active. It is not lower because the containment K^poly strictly
    inside K^bool is a theorem rather than a conjecture whenever any admissible
    overlap exists, so the correction is not zero in general; because the
    measured ordering of extra_6 across the three n = 9 systems tracks support
    concentration exactly as the mechanism predicts; because 7110 is only 4% of
    the row count and does not require many admissible multipliers per pair; and
    because two committed records name this decomposition as OPEN, which means
    no one has yet checked the enumerator. Separately: 0.90 that the audit
    reaches a decisive reading, because stages 0-2 are reading and set arithmetic
    and the pre-known-zero null makes an implementation error self-announcing.
