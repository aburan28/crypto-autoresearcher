  sota_delta: >-
    Quantitative. The incumbent path to the goal's completion criterion is the
    SIG-D6-NULL-RECAL-v2 calibration executor, which EV-SIG-010 authorises only
    under a further Coordinator ledger decision and which the goal's next_action
    explicitly DEFERS "until campaign capacity prioritizes D >= 6 null
    recalibration". Its decisive cell is a ~200k-column echelon that has already
    been scope-censored once (EV-SIG-006) and killed by platform caps twice
