idea:
  id: IDEA-20260801-009
  question_id: RQ-SLHDSA-001
  title: >-
    Multi-target slack meter for SLH-DSA: concrete cost of the best known
    multi-target forgery versus the multi-target proof's bound
  class: measurement
  claim: >-
    The slack between SLH-DSA's multi-target security proof and the best
    concrete multi-target attack can be measured as a ratio at toy
    parameter sets: the best-known multi-target forgery cost (parallel
    targets, shared hash computations) divided by the proof's bound. If the
    measured ratio is materially below 1 across several toy parameter sets,
    the proof's multi-target bound is loose and the effective security
    category should be revisited.
  mechanism: >-
    The proof bounds multi-target security by a union bound over targets,
    while concrete attacks may share expensive precomputations (e.g., hash
    chains, tree structure) across targets. At toy sizes, both the attack
    cost and the bound are computable exactly, giving a ratio. The ratio's
    trend across toy parameter sets reveals whether the slack grows or
    shrinks with the parameter size.
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-01'
    corpus_paths_grepped:
      - knowledge/literature
      - ledger/proposals
    grep_results:
      - No existing proposal measures the SLH-DSA multi-target slack ratio at
        toy parameter sets.
    conclusion: >-
      Measurement proposal; novelty unverified against full literature, which
      is the point of the meter.
  assumptions:
    - Toy parameter sets preserve the proof's structure (tree, target
      handling) at reduced sizes.
    - The best-known multi-target attack at toy sizes is enumerable.
  predictions:
    - metric: measured_attack_cost_over_proof_bound
      direction: lower
      minimum_effect: >-
        A ratio below 0.5 at two consecutive toy parameter sets signals a
        material multi-target slack.
  minimal_test:
    design: >-
      Select 3+ toy SLH-DSA-like parameter sets; for each, compute the
      best-known multi-target forgery cost by exact enumeration (or a
      certified heuristic) and the proof's bound; emit the ratio and its
      trend.
    controls:
      - Single-target attack cost as a calibration control (ratio should be
        ~1).
      - Two independent implementations of the attack cost.
    required_metrics:
      - multi-target attack cost per toy set
      - proof bound per toy set
      - ratio and trend
  falsification_conditions:
    - Ratio >= 1 at all toy sets (proof tight; no slack).
    - Ratio < 1 with a decreasing trend (slack grows; category revisit
      warranted).
  confounders:
    - Toy sets that do not preserve the tree structure's sharing.
    - Different attack models (parallel vs sequential targets).
  interpretation_limits:
    - Toy-tier only; no concrete SLH-DSA break.
    - A small ratio at toy sizes does not automatically transfer to
      cryptographic sizes.
  heuristic_assumptions:
    - id: HEUR-SLHDSA-SLACK-1
      statement: >-
        The measured multi-target slack ratio at toy sizes has a monotone
        trend in the parameter size.
      rigorous_support: None; heuristic, tested by the 3+ toy sets.
      validation_plan: Extend to the largest tractable toy set and check the
        trend continues.
  target_complexity:
    time_exponent: n/a (measurement)
    memory_exponent: n/a
    best_known: n/a
    hidden_overhead: n/a
    tradeoff_note: n/a
  dominated_by: null
  sota_delta: >-
    No attack claimed. Deliverable is a measured slack ratio and trend,
    which decides whether SLH-DSA's multi-target bound deserves scrutiny.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
