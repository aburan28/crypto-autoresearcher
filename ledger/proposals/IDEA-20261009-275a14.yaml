  title: Genus-g covers of E over F_p cost p^(2 - 2/g) >= p (worse than rho)
  class: control
  claim: |-
    Measured index-calculus cost for recovering logs in the E-part of Jac(C)(F_p), g in {2, 3}, fits an exponent >= 1 in p; rho on E(F_p) fits 0.5; no crossover exists.
  mechanism: |-
    Weil descent gains only because the base field shrinks. A cover C -> E over F_p itself places E(F_p) inside Jac(C)(F_p) of size p^g, where index calculus costs about p^(2 - 2/g).
  novelty_status: unverified
