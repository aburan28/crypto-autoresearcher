idea:
  id: IDEA-20261007-6c65b7
  question_id: RQ-PAIR-21313f
  added: '2026-10-07'
  status: proposed
  approved_by: null
  title: >-
    Weil pairing of a point with its j=1728 image on y^2 = x^3 + x
    over F_73 is not 1
  class: control
  claim: >-
    Let E be y^2 = x^3 + x over F_73. If the discriminant is 0 the
    model is singular and the run is an invalid setup. Otherwise let
    i be the least integer in {1, ..., 72} with i^2 congruent to -1
    modulo 73, and let phi(x, y) = (-x, i*y). Let P be the affine
    point of largest order n, breaking ties by least x then least y.
    If n is at most 2, or if phi(P) equals P or -P, the setup is
    invalid. Otherwise the Weil pairing e_n(P, phi(P)) is not equal
    to 1. The value 1 is a negative. This is not the pairing of P
    with itself, and it is not a modularity or Frey-Rück reduction.
    No discrete logarithm is computed, and the generic-group
    exponent 1/2 is unchanged.
  mechanism: >-
    PAIR (representation, Sigma): the representation is the pair
    (P, phi(P)) and Sigma is the Weil pairing. Explanation A:
    e_n(P, phi(P)) is not 1, so phi supplies a second argument whose
    pairing is a nontrivial n-th root of unity. Explanation B: the
    value is 1, so the distortion is degenerate on this point.
    KR-RHO-755e35, opened, says embedding degree is an isogeny
    invariant. This check does not walk the class. The self-pairing
    e_n(P, P) = 1 is a control, not the claim.
  novelty_status: unverified
  citations:
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Isogenous curves share the group-structure class of weakness,
        including small embedding degree. An isogeny walk does not
        reach a different class.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
    - ref: KR-RHO-0528e7
      provenance: internal
      claim: >-
        The j = 1728 automorphism gives a constant factor sqrt(4).
        It does not by itself state a pairing value.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-0528e7.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic algorithm needs a square-root number of group
        operations. A single pairing value does not beat that bound.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: RQ-PAIR-21313f
      provenance: internal
      claim: >-
        The question asks which CM families have small embedding
        degree and whether a CM-specific pairing is computable from
        one point together with a map of that point.
      verified_by: ledger/questions/RQ-PAIR-21313f.yaml
  assumptions:
    - phi is the coordinate formula above. A different distortion map is out of scope.
    - If phi(P) is P or -P, the second argument is degenerate and the setup is invalid.
    - The pairing is the Weil pairing. A Tate pairing is not substituted.
  proof_search_map:
    bottleneck: Whether e_n(P, phi(P)) equals 1 on the chosen point.
    baseline_embedding:
      parameter_slice: one model at p = 73 and one point of order n > 2
      reproduction_check: >-
        e_n(P, P) must equal 1. Any other self-pairing refuses the
        distortion value. The self-pairing is not the claim.
    observation_collision:
      observable: whether e_n(P, phi(P)) equals 1
      distinct_preimage_search: >-
        The value 1 kills explanation A. Any other n-th root does not.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: the Weil pairing on the pair (P, phi(P))
        predicted_gain: a value other than 1. No discrete logarithm.
    quantifier_order: >-
      For this one point, the pairing is not 1. Not every j = 1728 curve.
    method_ceiling:
      strongest_certifiable_claim: >-
        The distortion pairing is nontrivial, or it equals 1.
      nearby_object_control: >-
        e_n(P, P) must be 1. Otherwise refuse the distortion value.
    proof_obligations:
      - claim: n > 2 and phi(P) is not P or -P
        responsibility: baseline
      - claim: e_n(P, P) = 1
        responsibility: correctness
      - claim: e_n(P, phi(P)) is not 1
        responsibility: strictness
    not_applicable_reason: No exponent is claimed. The map is filled.
  predictions:
    - metric: 1 if e_n(P, phi(P)) equals 1, else 0
      direction: lower
      minimum_effect: exactly 0
    - metric: n
      direction: higher
      minimum_effect: at least 3
  minimal_test:
    design: >-
      Confirm a nonzero discriminant and that i exists. Select P.
      Refuse the run if n is at most 2 or if phi(P) is P or -P.
      Require e_n(P, P) = 1, then compare e_n(P, phi(P)) with 1.
      Do not run MOV and do not walk an isogeny class.
    controls:
      - The discriminant is nonzero and i^2 is congruent to -1 modulo 73.
      - n is at least 3 and phi(P) is neither P nor -P. Otherwise the setup is invalid.
      - e_n(P, P) equals 1. Otherwise the pairing implementation is invalid and the distortion value is refused.
      - The codomain element is an n-th root of unity. Otherwise the value is refused.
    required_metrics:
      - pairing_is_one
      - n
      - i
      - self_pairing_is_one
  falsification_conditions:
    - The setup checks pass, e_n(P, P) equals 1, and e_n(P, phi(P)) equals 1.
    - n is at most 2, phi(P) is P or -P, the model is singular, or the self-pairing is not 1. That run is an invalid setup and is not the negative.
  confounders:
    - The least-x rule can select a point on which phi acts as a scalar. The claim names that rule.
    - A broken Miller loop can return 1. The self-pairing control refuses that value.
  interpretation_limits:
    - A value other than 1 is not an embedding-degree census and moves no discrete logarithm.
    - The self-pairing equaling 1 is a control, not the claim.
    - The scope is this one point at p = 73. The exponent 1/2 is unchanged.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For phi(x, y) = (-x, i y) on this j = 1728 model, a point P
        of order n > 2 with phi(P) outside {P, -P} has Weil pairing
        e_n(P, phi(P)) different from 1. This imitates a distortion
        map. It does not claim a small embedding degree.
      rigorous_support: >-
        KR-RHO-755e35, opened, treats small embedding degree as an
        isogeny invariant and does not evaluate this pairing at p = 73.
      validation_plan: >-
        Record whether e_n(P, phi(P)) equals 1. Equality after the
        self-pairing control passes falsifies H1 here. An invalid
        setup is refused. No second prime.
  target_complexity:
    time_exponent: >-
      One Miller loop of length n on a group of size at most 74.
      The generic-group exponent 1/2 is unchanged.
    memory_exponent: O(1) field elements in the pairing codomain
    best_known: >-
      KR-RHO-13bf67 gives the square-root bound. KR-RHO-755e35 says
      an isogeny walk does not change the weakness class. This
      pairing beats neither.
    hidden_overhead: >-
      The codomain degree is the embedding degree of n. No claim
      says that degree is small.
    tradeoff_note: No time-memory tradeoff.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-755e35
      - KR-RHO-0528e7
      - KR-RHO-13bf67
    nearest:
      - ref: KR-RHO-755e35
        provenance: internal
        relation: adjacent
        delta: >-
          The opened row says isogeny walks do not change the
          weakness class. This idea adds one bit, whether
          e_n(P, phi(P)) equals 1, predicted false, on y^2 = x^3 + x
          over F_73. The self-pairing is not the claim. The exponent
          stays 1/2.
  dominated_by: >-
    KR-RHO-13bf67 sets the generic exponent at 1/2. KR-RHO-755e35
    blocks reading this pairing as an isogeny-walk improvement. The
    single value beats neither baseline.
  sota_delta: >-
    No exponent is derived. The delta is the bit that is 1 when
    e_n(P, phi(P)) equals 1, predicted 0, at p = 73. The exponent
    stays 1/2.
