idea:
  id: IDEA-20260821-13b667
  question_id: RQ-MLKEM-002
  added: '2026-08-21'
  title: >-
    Certify the generator before trusting the gate's null: the per-probe detection probability of
    each mutation class against each comparison-defect class is the closed form
    P_hit = Pr[D subset of S] = C(|S|,k)/C(L,k), it has provably-zero cells, and the
    early-termination (strcmp) class is NOT a fifth class -- it is C-BND with a data-dependent
    bound N = z+1, whose integrated single-byte hit rate is derived here as 0.68 / 0.77 / 0.84
  class: control

  claim: >-
    (0) REVISION NOTICE, FIRST BECAUSE IT IS LOAD-BEARING. This record is a repaired revision
    filed under its own identifier after a red-team screen on 2026-08-21 found that the previous
    text had the CONTAINMENT INVERTED: it stated P_hit = 1 - Pr[D subset of S] where the gate's
    physics gives P_hit = Pr[D subset of S]. The inversion propagated into the zero cell, both
    null arms, the monotonicity direction, the Stage-2 lemma template and the proof obligations,
    and it survived a brute-force enumeration because that enumeration certified the record's own
    formula rather than the object. Every forced value below is now derived from the PHYSICAL GATE
    QUESTION -- "does the peer under test ACCEPT the mutated input while a correct peer REJECTS
    it?" -- and anchored to committed instrument semantics (EXP-MLKEM-006 CTRL-POSITIVE-CONTROL-
    RETAINED, EV-MLKEM-005), never to this record's algebra. Two further defects found in the same
    screen are repaired here: the 2^-16 CCTV figure has been withdrawn from the role it did not
    have (see D), and the claim that the taxonomy could not express the early-termination class
    has been withdrawn as FALSE (see D). What is recorded rather than concealed is that four
    successive hand-derivations of the same three-line containment argument -- two in earlier
    drafts, one in the repaired draft, one in the enumeration that was supposed to check it -- got
    the direction or the parameter condition wrong. That is the strongest available argument for
    the frozen enumeration plus the external semantic anchor this proposal is now built around.
    (A) THE QUESTION NOBODY IN THIS LANE HAS ASKED WITH A NUMBER. Three batches
    (EXP-MLKEM-003 through -006) argued about whether the differential gate's adequacy control
    was baseline-invisible and whether it was library-facing. None of them asked, and none of
    them answered: WITH WHAT PROBABILITY DOES THIS GENERATOR EMIT AN INPUT THAT A COMPARISON
    WITH DEFECT CLASS X WOULD FAIL TO REJECT? That number is the gate's statistical power, it
    is what converts a null into evidence, and it is computable in closed form before any
    build exists.
    (B) THE CLOSED FORM, DERIVED FROM THE GATE'S PHYSICS AND NOT FROM ALGEBRA. Let
    S subset of [0, L) be the SILENT SET of a defective comparison -- the byte positions at which
    a difference is not seen. Let a generated ciphertext differ from the honest one on the support
    D subset of [0, L), D non-empty. THE GATE OBSERVES A DISAGREEMENT BETWEEN A DEFECTIVE PEER AND
    A CORRECT PEER. A correct comparison rejects every mutated ciphertext. A comparison whose
    accumulate step is OR-of-XOR over positions ACCEPTS the mutated ciphertext exactly when every
    differing position is invisible to it, i.e. exactly when D subset of S. Therefore
    DETECTION occurs if and only if D subset of S, and the per-probe detection probability is
    P_hit(g, S) = Pr_g[D subset of S]; for a generator drawing D uniformly among k-subsets of
    [0, L), P_hit = C(|S|, k) / C(L, k). SEMANTIC ANCHOR, EXTERNAL TO THIS RECORD'S ALGEBRA:
    EXP-MLKEM-006's committed control CTRL-POSITIVE-CONTROL-RETAINED passes when "every class
    reaching 1536..1567 detects that omission at the primitive level; decapsulation accepts at
    least one mutated ciphertext in that region", and 1536..1567 is precisely the archived AVX2
    pre-fix SILENT set at ML-KEM-1024 (EV-MLKEM-005). Detection there is by reaching INTO the
    silent set, and detection is realised by ACCEPTANCE -- both halves of the direction fixed by a
    committed record. CTRL-NEGATIVE-HARNESS agrees ("each class flags exactly the omitted range it
    can reach"). The formula is also consistent with IDEA-20260805-3c957e, which proves that an
    EMPTY silent set leaves no differential test with any power to detect: |S| = 0 gives
    C(0,k) = 0 hence P_hit = 0, whereas the withdrawn form gave P_hit = 1. Everything the gate can
    conclude from a null is a statement about N * P_hit, and the lane has never written P_hit down.
    (C) THE FORCED CELLS, WHICH ARE THE POINT. Some (generator, defect) cells have P_hit EXACTLY 0
    and others EXACTLY 1, by construction and not by luck. The condition is D subset of S and the
    DIRECTION of that containment decides the cell, so it is written out rather than gestured at.
    Write c1 for the first 32*du*k ciphertext bytes and c2 for the trailing 32*dv, and take
    C-BND(N) -- a comparison that stops after N bytes, silent set S = [N, L).
    THE FORCED-ZERO CELL is G5 (c1-only) x C-BND(N) with N >= |c1|: the generator draws
    D subset of [0, |c1|) while S = [N, L) is disjoint from [0, |c1|), so D subset of S is
    impossible for non-empty D and P_hit is EXACTLY 0. A gate built from that pair reports "no
    defect found" with probability 1 whatever the peer does -- KN-TECH-1a5b7e mode 1, the null
    that cannot fail, located in the GENERATOR rather than in a control arm, which is where this
    lane has never looked for it.
    THE FORCED-UNIT CELL is its mirror: G4 (c2-only) x C-BND(N) with N <= |c1|, where
    S = [N, L) contains the whole of c2 and therefore contains every support the generator can
    draw, so P_hit is EXACTLY 1 -- a generator that only mutates bytes a truncating comparison
    never reads exposes the truncation on every probe.
    NEITHER MIRROR EXTENDS BEYOND ITS PARAMETER CONDITION. For N > |c1| the c2-confined cell is
    STRICTLY BETWEEN 0 AND 1, equal to C(L-N, k) / C(L-|c1|, k); for N < |c1| the c1-confined cell
    is C(|c1|-N, k) / C(|c1|, k), also strictly interior. Asserting 0 or 1 outside the stated
    condition is the same class of error as inverting the containment.
    WORKED SMALL ANALOGUE, hand-derived in this record by elementary counting on a structurally
    matched instance (L = 12, |c1| = 8, k = |D| = 2): the c2-confined row is 1.000 at N = 4,
    1.000 at N = 8 and C(2,2)/C(4,2) = 0.167 at N = 10; the c1-confined row is
    C(4,2)/C(8,2) = 0.214 at N = 4, 0.000 at N = 8 and 0.000 at N = 10. PROVENANCE, STATED
    EXACTLY: these six values are the arithmetic complements of the six values the orchestrating
    coordinator session enumerated by brute force on 2026-08-21 (0.000, 0.000, 0.833; 0.786,
    1.000, 1.000), which that session computed as 1 - Pr[D subset of S]. The agreement is
    BOOKKEEPING, NOT INDEPENDENT CONFIRMATION: an enumeration of a formula cannot detect that the
    formula points the wrong way, which is exactly how the error survived. What confirms the
    direction is the semantic anchor in (B) and the NULL-D arm below, both of which are external
    to the algebra.
    THE C-RED MIRROR, ALSO CORRECTED. A generator confined to lane positions the reduction DOES
    read has P_hit = 0 against that C-RED (its supports are disjoint from the silent set), and one
    confined to the lanes the reduction does NOT read has P_hit = 1.
    (D) THE EARLY-TERMINATION CLASS IS AN EXISTING COLUMN WITH A DATA-DEPENDENT PARAMETER, AND
    THE PREVIOUS "FIFTH CLASS" CLAIM IS WITHDRAWN. The C2SP/CCTV ML-KEM corpus (fetched and read
    2026-08-21) documents a defect class in which an implementation uses a string comparison and a
    zero byte terminates it early. The previous version of this record called that a fifth class
    the taxonomy could not express, marked its column NOT-COMPUTABLE-BY-THIS-METHOD, and made the
    emission of that verdict its method-ceiling control. THAT IS FALSE AND IS WITHDRAWN.
    Conditioned on the honest ciphertext c -- which is FIXED for a given key and message
    throughout a probe campaign -- let z be the index of the first zero byte of c. A C-string
    comparison reads positions 0..z and no further: a mutation at any position <= z produces a
    byte disagreement at or before z (positions before the mutation are unmodified, and a
    mutation that writes a zero at i < z terminates the mutated string early against a nonzero
    honest byte), so it is rejected; a mutation at any position > z is never read. The silent set
    is therefore the FIXED POSITION SET S = [z+1, L), which is exactly C-BND(N) with N = z+1. The
    closed form applies verbatim per c, and the class is a per-instance PARAMETERISATION of an
    existing column, not a new one.
    ITS INTEGRATED RATE, DERIVED HERE. Under H4 below (honest-ciphertext bytes behave uniformly
    for the first-zero-index statistic), Pr[z < i] = 1 - (255/256)^i, so a single-byte mutation at
    a uniform position detects with probability
    P_hit = (1/L) * sum_{i=0}^{L-1} (1 - (255/256)^i) = 1 - (256/L) * (1 - (255/256)^L),
    giving 0.683 at L = 768, 0.768 at L = 1088 and 0.837 at L = 1568. These are HAND-DERIVED IN
    THIS RECORD from the closed form; they are not measurements, and Stage 5 measures them.
    THE 2^-16 FIGURE IS WITHDRAWN FROM THE ROLE IT DID NOT HAVE. CCTV's "random occurrence
    probability of 2^-16" is the NATURAL-OCCURRENCE rate for two INDEPENDENT random buffers
    comparing equal as C strings; the exact value for uniform independent bytes is
    sum_{j>=0} (255/65536)^j / 65536 = 1/(65536-255) = 1.532e-5, of which 2^-16 = 1.526e-5 is the
    leading term (derived here; the red-team screen of 2026-08-21 separately reports measuring
    1.567e-5 over 3e6 trials, consistent within one binomial standard error, and that measurement
    is cited as a review observation and was not reproduced by this session). IT DOES NOT TRANSFER
    TO THIS LANE'S GENERATORS, which do not draw independent buffers: they mutate an honest
    ciphertext on a chosen support and probe the comparison. The transported figure previously
    carried this record's one quantitative headline (a claimed 2^16 instrument-cost ratio), its
    largest budget line (a 10^6-probe Stage 5) and a claimed CCTV domination row. All three are
    withdrawn below and replaced with numbers derived for the actual generator law.
    (E) WHAT EACH ANSWER MEANS, DECLARED BEFORE THE RUN. If the certification matrix comes
    back with every cell at power >= 0.99 at the sample budgets the archived runs actually
    used, then those nulls were adequately powered against the classes they were pointed at,
    the lane's undecidability was a PRECEDENCE problem (KN-TECH-054) and not a POWER problem,
    and this proposal returns a clean negative that strengthens the existing record. If any
    cell is at or near zero, then at least one archived "no defect found" is uninformative
    against at least one class, and the record says exactly which cell and at what power.
    (F) WHAT IS NOT CLAIMED. No attack, no oracle, no exploitation path, no attack-cost
    estimate, no timing/power/EM/cache/fault measurement, no statement about MLWE hardness or
    ML-KEM security. No claim that any implementation has any defect. Nothing here changes any
    hypothesis status or re-reads any archived verdict; it computes what a future or past null
    is worth, and only the Coordinator may act on that. Any newly observed conformance defect
    escalates and is published by no agent.

  mechanism: >-
    STAGE 0 -- FIX THE DIRECTION AGAINST COMMITTED SEMANTICS BEFORE ANY CELL IS COMPUTED. Read
    EXP-MLKEM-006's controls block and EV-MLKEM-005's archived silent sets, and record the two
    sentences that fix the sign: detection is by a mutation REACHING INTO the silent range
    1536..1567, and it is realised as decapsulation ACCEPTING a mutated ciphertext there. The
    frozen script's sign convention is then asserted as a unit test (NULL-D) against those exact
    numbers, and no other stage may run until it passes. This stage exists because the error this
    record was repaired for is invisible to any check performed inside the record's own algebra.
    STAGE 1 -- THE PROJECTION AND ITS EXACT DOMAIN OF VALIDITY. Write a blocked comparison as
    ACCUMULATE (h <- h OR (a_block XOR b_block)), REDUCE (r <- f(h)), FINALIZE, following
    IDEA-20260805-ee2018's anatomy. Under an OR-of-XOR accumulate, h's lane j is nonzero iff
    SOME byte mapping to lane j differed; XOR differences cannot cancel across positions, and
    OR cannot cancel across blocks. Therefore whether the verdict changes depends only on
    WHICH positions differ, not by how much -- the difference support is a sufficient
    statistic, and the peer ACCEPTS iff D subset of S. THIS IS THE LOAD-BEARING STEP AND ITS
    FAILURE MODE IS NAMED: for an accumulate that is arithmetic (sum, subtract-with-borrow) or
    checksum-like (CRC), two differences can cancel, the support is NOT sufficient, and the
    method must return VOID rather than a number. Early termination is NOT in that exclusion list
    any more: it is admitted as a conditional column (see Stage 5). The exclusion is measured, not
    assumed (Stage 4).
    STAGE 2 -- THE MATRIX, DERIVED WITH NO COMPUTE. Rows: the mutation classes the lane has
    used or could use -- G1 single-byte at a uniform index; G2 k-byte uniform support; G3
    suffix-biased (indices drawn from the last m bytes); G4 c2-only; G5 c1-only; G6
    lane-aligned; G7 the CCTV targeted corpus. Columns: C-COV(w) with S the trailing
    (L mod w) bytes; C-BND(N) with S = [N, L); C-RED(phi, p) with S a union of residue classes
    mod p of density 1-phi; C-FIN with S determined at the finalize step; C-BND-DD, the
    data-dependent-bound column that subsumes early termination, with N = z+1 drawn from the
    honest ciphertext. Each cell is P_hit = Pr[D subset of S] computed in closed form for a fixed
    S, and for C-BND-DD in closed form CONDITIONAL on c and then integrated over the distribution
    of z. The cells that come out exactly 0 are stated as small lemmas of the form
    "Pr[D subset of S] = 0", the worked example being G5 (c1-only) against C-BND(N >= |c1|); the
    cells that come out exactly 1 are stated as lemmas of the form "Pr[D subset of S] = 1", the
    worked example being G4 (c2-only) against C-BND(N <= |c1|). THE SIGN OF EVERY SUCH CELL IS
    DERIVED AND CHECKED BY THE FROZEN SCRIPT AND BY NULL-D, NEVER ASSERTED BY HAND.
    STAGE 3 -- SAMPLE-BUDGET TRANSLATION. For each archived run, read its actual mutation count
    N from the committed run manifest and report power = 1 - (1 - P_hit)^N per cell, with a
    Clopper-Pearson interval where P_hit is estimated rather than derived. A cell whose power
    at the archived N is below a pre-declared 0.99 is flagged as UNCERTIFIED, which is a
    statement about the instrument and not about any implementation.
    STAGE 4 -- MEASURED CONFIRMATION AGAINST PLANTED COMPARATORS. Build planted comparators
    realising each column at several parameter values, drive each generator against each at a
    fixed probe budget, and compare the measured hit rate to the derived P_hit with binomial
    intervals. A systematic shortfall localises accumulate-cancellation; a systematic excess
    localises probe dependence (e.g. a generator that never repeats a support). Both are
    reportable findings about the instrument.
    STAGE 5 -- THE DATA-DEPENDENT COLUMN, NOW CHEAP. Drive G1 against a planted early-termination
    comparator at each of the three lengths and compare the measured rate with the derived
    0.683 / 0.768 / 0.837. Two nested checks: (i) CONDITIONAL, with the honest ciphertext held
    fixed and z read from it, where the prediction is the exact (L-1-z)/L and any departure
    falsifies the C-BND(N = z+1) reclassification directly; (ii) INTEGRATED, over >= 200 fresh
    honest ciphertexts, where the prediction is the integrated value and a departure falsifies
    H4's uniformity rather than the reclassification. Separating the two is what makes a
    disagreement diagnostic instead of merely negative. Budget: a few hundred probes per length,
    not the 10^6 the withdrawn 2^-16 figure implied.

  novelty_status: unverified

  novelty_screen:
    method: >-
      THE crypto-kb MCP RETRIEVAL INDEX IS UNAVAILABLE THIS SESSION (in-memory Qdrant; it
      answers nothing and says so only in its startup log). Retrieval was therefore the Grep
      tool (ripgrep) over /home/user/crypto-autoresearcher plus WebSearch/WebFetch.
      Commands and results as run: (G1) pattern `detection power|hitting set|generator
      adequacy|adequacy probe|instrument adequacy`, -i, over ledger/, count mode -> 67
      occurrences across 43 files, the top rows being GOAL-MLKEM-002 (3), EV-MLKEM-008,
      EV-MLKEM-005, EV-MLKEM-010, H-MLKEM-004, H-MLKEM-005 (2), H-MLKEM-d9062d and four
      TASK handoffs -- i.e. the lane's adequacy history is dense and every one of those
      matches is about WHETHER a control is visible to the baseline, not about the numeric
      power of the generator. (G2) pattern `strcmp|CCTV|C2SP|MAL-BIND|Kemmy`, -i, over
      **/*.{yaml,md}, count mode -> 8 occurrences across 5 files: RQ-HYBRID-cdf2b2,
      coordination/goals/GOAL-MLKEM-005/.../census.md, two GOAL-AES-003 review files and one
      GOAL-AES-003 preregistration (4 occurrences). NOT ONE of them is under RQ-MLKEM-002 and
      not one concerns ML-KEM comparison conformance. (G3) pattern `-O2|-O3|...|toolchain`
      over ledger/proposals -> 4 files, none about generator power.
      Read in full: RQ-MLKEM-002; the lane's five-proposal inventory; IDEA-20260805-3c957e and
      IDEA-20260805-ee2018 in full (source of the C-COV/C-BND/C-RED/C-FIN taxonomy and of the
      three-part comparison anatomy); IDEA-20260805-1beeca's claim and object blocks;
      IDEA-20260724-002's claim and mechanism; GOAL-MLKEM-002's status, completion_criteria and
      checkpoint dispositions (second_impl_unavailable at three checkpoints);
      knowledge/techniques/KN-TECH-1a5b7e.md in full (modes 1-5, obligations 1-5);
      docs/inventor-protocol.md; docs/target-result-profile.md.
      REPAIR PASS, 2026-08-21: experiments/EXP-MLKEM-006/specification.yaml controls block read
      first-hand (CTRL-POSITIVE-CONTROL-RETAINED and CTRL-NEGATIVE-HARNESS quoted verbatim in
      claim B), and the red-team screen's findings against this record read in full.
      Web: (W1) WebSearch `FIPS 203 ML-KEM encapsulation "modulus check" ByteEncode12
      ByteDecode12 input validation` -> 9 links. (W2) WebFetch
      https://github.com/C2SP/CCTV/blob/main/ML-KEM/README.md -> RETRIEVED AND READ; source of
