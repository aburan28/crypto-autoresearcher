  assumptions:
    - >-
      The archived runs' actual mutation counts N and generator definitions are recoverable
      from committed run manifests. If they are not, Stage 3 cannot be run against history and
      the matrix is delivered prospectively only, which is a reduced but still complete
      deliverable.
    - >-
      Planted comparators can be built realising each column at declared parameters, on the
      admitted GNU ld --wrap instrument (EV-MLKEM-010) and never the refuted call-site
      INTERPOSE_COMPARE method (EV-MLKEM-009).
    - >-
      Generator classes G1-G6 can be implemented to draw supports exactly as declared, and the
      declaration is verifiable by inspecting the emitted supports rather than trusting the
      code -- NULL-A and NULL-B depend on this and fail loudly if it is false.
    - >-
      The gate's detection event is "the peer under test accepts a mutated ciphertext that a
      correct peer rejects". If any archived run's gate instead scored a different event, its
      cells must be recomputed under that event's own indicator and the difference recorded;
      this assumption is checked against EXP-MLKEM-006's controls block in Stage 0 and is the
      one whose failure would re-open the sign question.
    - >-
      No conclusion transfers to any generator, defect class, parameter set or budget not in
      the executed matrix. A power number is a property of a (generator, defect, budget) triple
      and of nothing else.

  predictions:
    - metric: >-
        zero_cells: the number of (generator, defect-class) cells in the frozen matrix whose
        derived per-probe detection probability is exactly 0
      direction: higher
      minimum_effect: >-
        At least 1, over the seven generator rows and five defect columns. Zero such cells
        would mean every generator class considered can in principle expose every defect class
        considered, and the mode-1 hazard does not arise in this gate's design space -- a clean
        negative that is fully reportable and would make the certification exercise cheap
        rather than pointless.
    - metric: >-
        NULL-D anchor verdict: the pair (P_hit assigned to a [1536,1568)-confined generator,
        P_hit assigned to a [0,1536)-confined generator) against a planted silent set {1536..1567}
        at L = 1568
      direction: different
      minimum_effect: >-
        EXACTLY (1, 0), with no tolerance. (0, 1) is the inverted-containment failure that this
        revision exists to make detectable and voids everything downstream. Anything else means
        the planted comparator does not realise the archived profile.
    - metric: >-
        closed_form_residual: max over the graded NULL-C points of |measured hit rate -
        derived P_hit|, in units of the binomial standard error at the executed probe count
      direction: lower
      minimum_effect: >-
        Below 3 standard errors at every point. Above that, the support-sufficiency assumption
        H1 is wrong for the tested accumulate and the closed form is withdrawn for that column.
    - metric: >-
        archived_power: the minimum, over all cells instantiated from an archived run's own
        generator and budget, of 1 - (1 - P_hit)^N
      direction: different
      minimum_effect: >-
        No direction is predicted and the refusal is deliberate. A minimum >= 0.99 means the
        archived nulls were adequately powered against the classes they were aimed at and the
        lane's undecidability was a precedence problem, not a power problem. A minimum near 0
        names a specific archived null that carries no information against a specific class.
        BOTH are first-class outcomes and neither changes any record's status; only the
        Coordinator may act on either.
    - metric: >-
        strcmp_conditional_rate: the measured single-byte detection rate of G1 against a planted
        early-termination comparator with the honest ciphertext HELD FIXED, compared with the
        per-instance prediction (L - 1 - z)/L where z is the first-zero-byte index read from that
        ciphertext
      direction: different
      minimum_effect: >-
        Within 3 binomial standard errors at each of L = 768, 1088, 1568, over >= 500 probes per
        length. A departure falsifies the reclassification of early termination as C-BND with
        N = z+1 -- i.e. it would mean the silent set is not the fixed position set [z+1, L) even
        for a fixed ciphertext -- and the column reverts to NOT-COMPUTABLE with the mechanism of
        the departure named.
    - metric: >-
        strcmp_integrated_rate: the same measurement over >= 200 fresh honest ciphertexts per
        length, compared with the derived 1 - (256/L)(1 - (255/256)^L) = 0.683 / 0.768 / 0.837
      direction: different
      minimum_effect: >-
        Within 3 binomial standard errors. A departure here with the conditional arm passing
        falsifies H4 (uniformity of honest-ciphertext bytes for the first-zero-index statistic)
        and is a finding about ciphertext byte distributions, not about the closed form. This
        prediction replaces the withdrawn "consistent with 2^-16" prediction, which was a
        prediction about a quantity this generator does not measure.
    - metric: >-
        NULL-A misses and NULL-B detections
      direction: lower
      minimum_effect: >-
        EXACTLY 0 for both, with no tolerance. Either being nonzero voids the entire matrix.
        Note the swap relative to the withdrawn version: NULL-A is now the arm that must never
        MISS and NULL-B the arm that must never DETECT.

  minimal_test:
    design: >-
      The MINIMAL discriminating version is Stage 0 plus Stages 1-3 and needs NO BUILD AND NO
      COMPARISON EXECUTION AT ALL: read the committed control semantics, freeze the generator and
      defect definitions, run the NULL-D anchor as a unit test of the sign convention, enumerate
      the 35-cell matrix under a frozen script, compute P_hit per cell in closed form, and
      translate every archived run's recorded budget into a power number. That is minutes of
      arithmetic and it already produces the deliverable that decides whether the expensive stages
      are worth running -- if no cell is below 0.99 at archived budgets, Stage 4 is optional. THE
      FULL VERSION adds Stage 4 (planted comparators x seven generators x >= 8 seeds x a probe
      ladder, with binomial intervals) and Stage 5 (the data-dependent column: a few hundred
      probes per length in the conditional arm and >= 200 fresh ciphertexts in the integrated
      arm). COST NOTE, CORRECTED: the previous version sized Stage 5 at "on the order of 10^6
      probes" on the strength of a 2^-16 rate that does not apply to this generator; at the
      derived rate of 0.68-0.84 per probe, tens of probes suffice to establish the effect and a
      few hundred to pin the rate to +-0.04. This proposal is therefore NO LONGER the most
      expensive in its batch; its cost is dominated by building the planted comparators.
    controls:
      - NULL-D, the direction anchor against EV-MLKEM-005 / EXP-MLKEM-006 semantics; forced (1, 0); run before every other stage.
      - NULL-A, the constructed forced-unit cell; forced zero misses; voids the matrix if it misses.
      - NULL-B, the constructed forced-zero cell; forced zero detections; voids the matrix if it fires.
      - NULL-C, five graded |S|/L points with a DERIVED increasing curve approximately (|S|/L)^k; residual scored against the closed form.
      - >-
        COMPARATOR REPLICATION (KN-TECH-1a5b7e mode 5): >= 8 independent seeds per stochastic
        cell, interval reported, never a point.
      - >-
        NULL-FIRST DECISION RULE (mode 4): the UNCERTIFIED/CERTIFIED rule is emitted on NULL-A
        and NULL-B before any real cell is read; if it returns the same label on the null arm
        as on the real arm, it discriminates nothing and is rewritten before anything is read.
      - >-
        NEARBY-OBJECT CONTROL WHERE THE METHOD MUST FAIL: an arithmetic-accumulate comparator
        (sum of per-byte differences) in which two chosen deltas cancel exactly, so that two
        different supports of the same size give different verdicts and the support is provably
        not a sufficient statistic. The closed form must be reported as VOID for it, not as a
        number. This control REPLACES the withdrawn early-termination nearby object, whose
        passing criterion was the emission of a NOT-COMPUTABLE verdict that is now known to be
        wrong -- a control that certified an error rather than catching one.
      - >-
        ORDERING CONTROL: the derived matrix and all forced values are committed and hashed
        before any measurement; archived budgets are read only after the matrix is frozen, so a
        threshold cannot be chosen to make a historical null look good or bad.
      - >-
        ARCHIVE CHECK (zero compute): list every archived measurement of a hit rate or detection
        count in the corpus and check that at least one named outcome of the rule is consistent
        with all of them; where the statistic is new to the program, say so rather than claiming
        the check was available.
    required_metrics:
      - the NULL-D anchor pair, emitted and committed before anything else
      - the frozen 35-cell matrix with per-cell derived P_hit, its script and hash
      - the explicit list of exactly-zero and exactly-one cells with a one-line proof each
      - the explicit list of VOID cells (cancelling accumulate) with the reason
      - per-cell measured hit rate with >= 8 seeds and a Clopper-Pearson interval
      - per-archived-run power, with the run manifest ID the budget N was read from
      - NULL-A miss count, NULL-B detection count, NULL-C residual table
      - the derived and observed false-positive rate of the CERTIFIED/UNCERTIFIED rule
      - the conditional and integrated early-termination rates with the z values they were computed against

  falsification_conditions:
    - >-
      NULL-D returns (0, 1) or anything other than (1, 0). The pipeline's sign convention
      contradicts a committed control; nothing downstream is reportable and the record is
      repaired again rather than patched.
    - >-
      zero_cells = 0 over the frozen matrix. The central worry -- that a real gate can contain
      a generator/defect pair with identically zero power -- does not arise in this design
      space, and the record says so. This is a negative and it is a deliverable.
    - >-
      closed_form_residual above 3 standard errors at any graded point. H1 (support sufficiency)
      fails for the tested accumulate; the closed form is withdrawn for that column and the
      measured curve replaces it, with the mechanism of the discrepancy named.
    - >-
      strcmp_conditional_rate outside 3 standard errors of (L-1-z)/L at a fixed ciphertext. The
      reclassification of early termination as C-BND(N = z+1) is FALSE, the column reverts to
      not-computable, and claim (D) of this record is withdrawn in the same way its predecessor's
      fifth-class claim was.
    - >-
      NULL-A misses, or NULL-B detects. Instrument failure; NO cell, no archived power number
      and no certification verdict is reportable.
    - >-
      Archived budgets and generator definitions are not recoverable from committed manifests.
      Stage 3 is not executable; the matrix is delivered prospectively and the record says
      explicitly that it makes no statement about any archived null.
    - >-
      Every cell has power >= 0.99 at every archived budget. The archived nulls were adequately
      powered; the lane's undecidability is attributed to precedence (KN-TECH-054) and not to
      power, and this proposal's premise is refuted in the most useful possible way.
    - >-
      Build or fetch failures. INFRASTRUCTURE outcome under AGENTS.md rule 3, never negative
      evidence about any implementation or any generator.

  confounders:
    - >-
      THE CONTAINMENT DIRECTION IS THE PRINCIPAL HAZARD OF THIS RECORD AND IT HAS ALREADY FIRED
      ONCE. Both mirrors of the argument are three lines long and both read plausibly; the error
      is undetectable by any check that consumes the same definition, which is why NULL-A, NULL-B
      and NULL-C cannot catch it and why NULL-D exists. Any future edit that changes the formula
      must re-run NULL-D first.
    - >-
      SUPPORT SUFFICIENCY IS AN ALGEBRAIC PRECONDITION, NOT A UNIVERSAL FACT. The closed form
      rests on OR-of-XOR accumulation. Any comparator outside that algebra -- specifically a
      cancelling arithmetic or checksum accumulate -- is out of the method's domain and must be
      reported as out of domain rather than assigned a number. The arithmetic-accumulate control
      exists to catch a pipeline that forgets this.
    - >-
      PROBE INDEPENDENCE. A generator that samples supports without replacement, or that
      systematically covers positions, has hit rate ABOVE the i.i.d. formula 1 - (1-P_hit)^N.
      Reporting i.i.d. power for such a generator understates it. The measured arm is what
      settles this and the report must state which formula was used per row.
    - >-
      HONEST-CIPHERTEXT BYTE DISTRIBUTION. The integrated early-termination rate depends on the
      law of z, the first-zero-byte index, which depends on the ciphertext's byte distribution.
      ML-KEM ciphertexts are compressed coefficient encodings and are close to but not exactly
      uniform bytes; the integrated prediction is therefore conditional on H4 and the conditional
      arm is what separates a failure of H4 from a failure of the reclassification.
    - >-
      THE COLUMN SET IS NOT PROVEN EXHAUSTIVE. Five columns certify against five columns and
      assert nothing about a sixth, and any reading of a full green matrix as "the gate is
      adequate" is exactly the premature-closure failure the inventor protocol names. NOTE THE
      CORRECTION: the previous version cited the early-termination class as direct evidence that
      the taxonomy was incomplete. It is not -- that class is C-BND with a data-dependent
      parameter -- so this record no longer holds any first-hand evidence of incompleteness, and
      the honest statement is that exhaustiveness is unproven rather than known to be false.
    - >-
      POWER IS NOT PRESENCE AND NOT ABSENCE. A high-power cell plus a null means the class is
      absent in the tested peer AT THAT PARAMETER SET AND BUDGET. A low-power cell plus a null
      means nothing at all. Neither is evidence about any implementation not tested.
    - >-
      SELECTION OF GENERATOR ROWS. G1-G6 are constructed for this matrix; whether they resemble
      the generators the archived runs actually used is settled by reading the manifests, and
      where a manifest's generator does not match any row, the row set is extended and the
      extension is recorded rather than the generator being forced into the nearest row.

  interpretation_limits:
    - >-
      NOT AN ATTACK, NOT AN ORACLE, NOT AN EXPLOITATION PATH, NOT A COST ESTIMATE, NOT A
      STATEMENT ABOUT MLWE HARDNESS OR ML-KEM SECURITY AT ANY PARAMETER SET. RQ-MLKEM-002's
      constraints bind unchanged; any newly observed conformance defect escalates to the
      coordinator and is published by no agent.
    - >-
      NO STATUS CHANGE is proposed for GOAL-MLKEM-002, for any hypothesis, or for any archived
      evidence or decision record. Computing what an archived null was worth is not re-reading
      that null's verdict, and this record explicitly does not do so. Only the Coordinator may.
    - >-
      THIS RECORD IS A REPAIRED REVISION AND ITS PREDECESSOR TEXT IS WRONG WHERE IT DIFFERS. Any
      downstream use of the previous formula (P_hit = 1 - C(|S|,k)/C(L,k)), of its zero cell, of
      its null-arm forced values, of its decreasing monotonicity, of its 2^16 cost ratio, or of
      its fifth-class claim must be recomputed. No experiment was run under the previous version,
      so nothing measured is affected.
    - >-
      Claim tier laboratory/toy, not raisable by citation. A power matrix computed on planted
      comparators at three standardized ciphertext lengths is laboratory conformance evidence
      about an instrument, and is never crypto-scale or MLWE evidence.
    - >-
      A fully certified matrix does NOT establish that any comparison is correct, that any
      implementation is defect-free, or that the taxonomy is complete. It establishes that
      declared generators have declared power against declared classes at declared budgets.

  heuristic_assumptions:
    - id: H1
      statement: >-
        SUPPORT SUFFICIENCY. FOR ALL comparisons whose accumulate step is
        h <- h OR (a_block XOR b_block) with a contiguous byte-to-lane map, and FOR ALL input
        pairs, the comparison's verdict depends on the pair only through the difference support
        D = { i : a[i] != b[i] }; consequently the comparison ACCEPTS iff D is contained in the
        silent set S determined by the reduce step, and the differential gate DETECTS iff
        D subset of S.
      rigorous_support: >-
        Rigorous, not distributional, within its stated algebra: XOR of a nonzero byte
        difference is nonzero irrespective of magnitude, and OR is monotone and idempotent, so
        no two differences can cancel and no difference can be undone by a later block. It
        imitates no classical distribution theorem and is not presented as one. It is FALSE for
        arithmetic or checksum accumulates, where cancellation is possible, and that exclusion is
        part of the statement rather than a caveat to it. Early termination is NOT an exclusion:
        it satisfies H1 conditionally on the honest ciphertext, with S = [z+1, L).
      validation_plan: >-
        Measured at three scales on the admitted GNU ld --wrap instrument. (i) Exhaustive at
        L = 768: all 768 positions x all 255 nonzero single-byte deltas against each planted
        column, checking that the verdict is constant in the delta value at every position --
        a direct test of value-independence, 195,840 probes per comparator, seconds of compute.
        (ii) Two-position: for a sample of 10^4 position pairs, all 255^2 delta pairs on a
        reduced subset, hunting cancellation. (iii) The arithmetic-accumulate nearby object,
        where cancellation is CONSTRUCTED and must be observed -- if it is not observed there,
        the cancellation hunt has no power and neither does its null result. Predicted
        distribution: a degenerate one (verdict constant in value); the tail check is the
        maximum over positions of the number of delta values disagreeing with the position's
        majority verdict, which must be 0. NOTE the one exception the plan must carve out: at a
        planted early-termination comparator, value-independence FAILS at position z by design
        (writing a zero there is not equivalent to writing a nonzero), so that comparator is
        scored under the conditional form of H1 and not under (i).
    - id: H2
      statement: >-
        GENERATOR SUPPORT LAW. FOR EACH declared generator row g there is an explicit law over
        subsets D of [0, L) -- uniform k-subsets for G2, uniform singletons for G1, uniform over
        a declared index range for G3-G6 -- and successive probes draw D independently.
      rigorous_support: >-
        True by construction for generators written for this matrix; NOT NECESSARILY TRUE for
        the generators used in the archived runs, which may deduplicate, may stratify, or may
        be seeded so that supports are negatively correlated. This is the assumption most
        likely to be violated in the Stage-3 translation of archived budgets, and it biases
        power DOWNWARD when violated (dependence through coverage raises the hit rate), so the
        archived power numbers computed under it are CONSERVATIVE -- a direction that is stated
        because it matters for how a low number should be read.
      validation_plan: >-
        Emit and store the actual supports drawn by each row over 10^5 probes; test the
        empirical index-frequency histogram against the declared law with a chi-square, and
        test independence between consecutive probes by the pairwise index co-occurrence matrix
        against its product-of-marginals prediction. For archived generators, read the manifest
        and, where the law cannot be recovered, report the cell as "budget known, law unknown"
        rather than computing a power number from an assumed law.
    - id: H3
      statement: >-
        COLUMN EXHAUSTIVENESS IS NOT ASSUMED. The five columns are the classes this program can
        currently name; no claim is made that they exhaust the space of comparison-conformance
        defect mechanisms.
      rigorous_support: >-
        None, and no first-hand evidence of incompleteness is now held: the class this record
        previously offered as such evidence turned out to be an existing column with a
        data-dependent parameter. The honest statement is that the enumeration is unproven, and
        that one attempt to exhibit a class outside it failed.
      validation_plan: >-
        Adversarial: before freezing, require an independent reviewer to propose one comparison
        defect not expressible as any of the five columns, WITH the argument that it is not
        expressible -- the standard this record itself failed to meet on its first attempt. If
        one is proposed and the argument survives, it becomes a sixth column; if none is, the
        matrix records that a single reviewer failed to extend it, which is a fatigue report and
        is labelled as one, not as exhaustiveness.
    - id: H4
      statement: >-
        FIRST-ZERO-INDEX LAW. FOR AN HONEST ML-KEM ciphertext c of length L, the bytes behave, for
        the purpose of the first-zero-index statistic, like independent uniform draws from
        [0, 256), so Pr[z >= i] = (255/256)^i and the integrated single-byte detection rate
        against an early-termination comparator is 1 - (256/L)(1 - (255/256)^L).
      rigorous_support: >-
        Partly rigorous, partly distributional, and the two parts are separated. RIGOROUS PART:
        conditional on c, the silent set is exactly [z+1, L) and the per-probe rate is exactly
        (L-1-z)/L for k = 1; nothing distributional is needed for that. DISTRIBUTIONAL PART: the
        law of z. It imitates the elementary geometric-first-success law that a uniform byte
        stream obeys, and the imitation is not a theorem here: ML-KEM ciphertexts are
        Compress_d encodings of coefficients that are not uniform bytes, so the true law of z may
        depart, most plausibly in the du-compressed c1 region where byte values inherit a
        non-uniform coefficient distribution.
      validation_plan: >-
        Generate >= 10^4 honest ciphertexts per parameter set from a reference implementation,
        record z for each, and compare the empirical survival function of z against
        (255/256)^i pointwise with binomial intervals, plus a chi-square over bins and a TAIL
        CHECK on Pr[z = L-1] (no zero byte anywhere), whose predicted values are
        (255/256)^768 = 0.049, (255/256)^1088 = 0.014 and (255/256)^1568 = 0.0022 -- values large
        enough that a 10^4 sample resolves them. Report c1 and c2 regions separately, since a
        departure is expected there first if it exists anywhere. Where the empirical law departs,
        the integrated rate is recomputed from the EMPIRICAL law and the derived value is
        reported as superseded; the conditional prediction is unaffected either way.

  proof_search_map:
    bottleneck: >-
      The inference "the gate returned no detection, therefore the peer has no defect of this
      class". Its cost-free removal requires exactly one number -- the per-probe detection
      probability -- and no other step in the gate changes what that inference is worth.
    baseline_embedding:
      parameter_slice: >-
        Exhaustive single-byte probing over all L positions and all 255 deltas, which is the
        instrument IDEA-20260805-ee2018 uses. In that slice every position is drawn, so any
        non-empty position-defined silent set is hit and power is 1 by construction, and the
        certification matrix degenerates to all-ones on every column with S non-empty. The
        proposal is therefore a family extension of the exhaustive instrument to sub-exhaustive
        budgets, not a different method.
      reproduction_check: >-
        Symbolic: with k = 1 and every position drawn, some probe has D subset of S whenever S is
        non-empty, so power = 1 exactly; and with S empty, power = 0 for every generator, which is
        IDEA-20260805-3c957e's statement. Frozen fixture: the matrix script, run with the
        exhaustive row, must emit power 1.0000 in every position-defined cell with S non-empty and
        0.0000 in every cell with S empty, checked before any other row is read.
    observation_collision:
      observable: >-
        The gate's terminal verdict bit, "no mutation was accepted by the peer".
      distinct_preimage_search: >-
        The collision is exhibited, not hunted, and it is the proposal's reason to exist: the
        object "peer has no defect of class X" and the object "generator has zero power against
        class X" both map to the identical observable, on both sides of the claimed conclusion.
        The additional condition that separates them is precisely the certified per-cell power,
        and the proposal's content is producing it. A second, subtler collision is also named:
        two different silent sets of equal cardinality give the identical P_hit under G1 and G2,
        so the matrix identifies the SIZE of a class's silent set and not the class -- which is
        why the columns are parameterized and why IDEA-20260805-ee2018's PERIOD observable, not
        this one, is the mechanism discriminator. A THIRD collision is what this revision adds:
        the two mirror-image containment conventions produce IDENTICAL matrices up to complement
        and are therefore indistinguishable by any internal consistency check, which is why the
        sign must be fixed by an external committed record (NULL-D).
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Preserve more state than the gate's final verdict needs: carry the difference support
          D and the per-probe acceptance indicator alongside the verdict, so the run record
          contains the data from which power is estimable after the fact. The final goal needs
          only the verdict; the stronger state is what survives to the next question.
        predicted_gain: >-
          Every future run of the gate becomes retrospectively certifiable at zero additional
          compute, and the Stage-3 archived translation stops depending on H2's recoverability.
      - transform: observable_fiber
        proposed_object: >-
          Hold the verdict fixed at "no detection" and vary the forgotten structure -- the peer's
          actual defect -- to construct two peers, one defect-free and one defective, that the
          declared generator cannot distinguish at the declared budget. The intrinsic invariant
          separating them is the silent set, which the verdict does not see.
        predicted_gain: >-
          A constructive, exhibited pair is a far stronger statement than a probability: it turns
          "the null may be uninformative" into "here are two peers this gate provably cannot tell
          apart at this budget", which is a falsifier of identifiability rather than a caveat.
    quantifier_order: >-
      What the gate's null appears to say: FOR ALL defect classes X, the peer has no defect of
      class X. What it actually supports: FOR ALL X in the column set, EXISTS a power p(g, X, N)
      such that with probability p the gate would have detected a class-X defect, and no
      detection occurred. The witness p is allowed to depend on the generator, the class, the
      parameter set and the budget -- four dependencies the uniform-looking conclusion never
      mentions, and one of them (the class) can drive p to exactly 0. Writing the order out is
      itself the argument for the matrix.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Generator g, at budget N, would have exposed a defect of class X with probability at
        least p, at ciphertext length L, on the tested accumulate algebra." Nothing about
        classes outside the column set, nothing about comparators outside the OR-of-XOR algebra,
        nothing about any peer not run, and nothing about parameter sets not tested.
      nearby_object_control: >-
        The nearby object on which the desired conclusion FAILS is a CANCELLING ACCUMULATE -- a
        comparator that sums per-byte differences, where two chosen deltas annihilate so that two
        inputs with the same support get different verdicts. The support is provably not a
        sufficient statistic there, the method must return VOID rather than a number, and a
        pipeline that emits a P_hit for it has failed to identify the load-bearing structure,
        which is the OR-of-XOR algebra. THIS REPLACES the withdrawn nearby object (the
        early-termination comparator), whose passing criterion was the emission of a
        NOT-COMPUTABLE verdict now known to be wrong: that control could only pass by certifying
        an error, which is worse than having no control at all.
    proof_obligations:
      - claim: The gate detects iff the peer accepts, i.e. iff D subset of S, per EXP-MLKEM-006's control semantics.
        responsibility: correctness
      - claim: Verdict depends on the input pair only through the difference support, under OR-of-XOR.
        responsibility: correctness
      - claim: P_hit = C(|S|,k)/C(L,k) for uniform k-subset supports.
        responsibility: size
      - claim: Exhaustive single-byte probing is the k=1, all-positions slice and gives power 1 for non-empty S and 0 for empty S.
        responsibility: baseline
      - claim: At least one (generator, class) cell has P_hit exactly 0, witness G5 x C-BND(N >= |c1|).
        responsibility: strictness
      - claim: Power at budget N is 1-(1-P_hit)^N under independent probes, and conservative otherwise.
        responsibility: success_probability
      - claim: Early termination has silent set [z+1, L) conditional on c, and integrated single-byte rate 1 - (256/L)(1 - (255/256)^L).
        responsibility: size
      - claim: The Stage-5 measurement needs hundreds, not millions, of probes at the derived rate; the budget is stated before the run.
        responsibility: runtime
      - claim: Cancelling-accumulate comparators are reported as out of domain.
        responsibility: scope

    not_applicable_reason: null

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; RQ-MLKEM-002 forbids attack-cost estimation and no
      algorithm against any cryptographic problem is proposed. The complexity statement that IS
      made is about INSTRUMENT COST, and it is stated with exponents because that is the only
      honest form: exhaustive single-byte certification costs Theta(L * 255) probes, i.e.
      1.96e5, 2.77e5 and 4.00e5 probes at L = 768, 1088, 1568; random k-subset probing reaches
      detection probability 1 - eps against a class whose silent set has relative density
      sigma = |S|/L in N = ln(1/eps) / (-ln(1 - sigma^k)) probes, approximately
      ln(1/eps) * sigma^{-k} for small sigma^k -- so the cost is inverse-polynomial in the
      silent-set density and IMPROVES with mutation weight k only when sigma is large, and
      degrades sharply as sigma^{-k} when the silent set is small. That sign is the opposite of
      what the withdrawn version stated and it is the practically important correction: against a
      NARROW silent set (the wolfSSL AVX2 pre-fix profile has sigma = 32/1568 = 0.0204) a
      single-byte generator needs about 49 probes in expectation and a two-byte generator about
      2400, so heavier mutations are WORSE, not better, against exactly the class this lane cares
      about. NO 2^16 RATIO IS CLAIMED ANY MORE: the withdrawn headline compared a targeted corpus
      against a support-blind generator on the early-termination column using CCTV's
      independent-buffer rate; at the derived rate for the actual generator law (0.683 / 0.768 /
      0.837 for a single-byte mutation) the true expected-probe ratio between a targeted vector
      and a random single-byte mutation on that column is 1 : 1.3, i.e. under 2.
    memory_exponent: >-
      n/a as an attack quantity. Storage is the emitted support table, O(N * k * log L) bits;
      at N = 10^5 and k <= 8 this is a few megabytes, and the supports are the artifact
      that makes every future run retrospectively certifiable.
    best_known: >-
      No incumbent exists in this repository: no record computes a detection probability, a
      power, or a probe-count scaling for any conformance gate. The nearest incumbent is
      exhaustive single-byte probing, which this reduces to at k = 1 with full coverage and
      which it dominates on cost by the factor above while being strictly weaker in guarantee --
      exhaustive probing certifies with probability 1 and random probing with probability
      1 - eps, and that difference is stated rather than buried.
    hidden_overhead: >-
      Three honest overheads. First, the column set is not proven exhaustive, and no amount of
      compute fixes an enumeration bounded by human imagination. Second, the closed form's
      validity is an ALGEBRAIC precondition on the peer's accumulate step, which must be
      established by reading the peer -- so certifying a gate against a real peer requires the
      same static reading the rest of the lane has found contentious, and this record inherits
      that difficulty rather than solving it. Third, and demonstrated rather than hypothesised:
      the direction of the central containment is a one-bit quantity that no internal check can
      recover, and it cost this record one full revision. The overhead is the external anchor.
    tradeoff_note: >-
      There is a genuine probe-count versus mutation-weight tradeoff and its direction is now
      stated correctly: raising k MULTIPLIES the probe count by roughly sigma^{-(k-1)} against a
      silent set of density sigma, so heavier mutations are strictly worse against narrow silent
      sets, and they additionally destroy the ability to LOCALISE the silent set (a k-byte
      detection tells you D subset of S, not which position did it) and raise the chance of
      cancellation in a non-OR accumulate. The only regime where large k helps is a wide silent
      set, where any generator succeeds anyway. The matrix reports both axes so a future gate
      designer can choose. Parallelisation is embarrassingly parallel across probes and across
      cells, with no shared state.

  dominated_by: >-
    n/a (no result claimed; no attack, no cost triple across time/memory/data, no algorithm
    against any cryptographic problem, hence no Pareto row to be dominated on). On the
    INSTRUMENT axis the frontier was checked row by row inside this repository on 2026-08-21:
    exhaustive single-byte probing as used by EXP-MLKEM-002/005 and proposed by
    IDEA-20260805-ee2018 DOMINATES this proposal on GUARANTEE (probability 1 versus 1 - eps) and
    is DOMINATED on probe count (Theta(L*255) versus O(ln(1/eps) * sigma^{-k})); the
    baseline-invisible synthetic control (IDEA-20260724-001) and the library-facing probe
    (IDEA-20260724-002) are not comparable because they measure wiring, not power, and neither
    dominates nor is dominated. Externally, exactly one row was checked -- the C2SP/CCTV
    targeted corpus. THE PREVIOUS VERSION'S CLAIM THAT IT DOMINATES OUTRIGHT ON THE
    CONTENT-DEFINED COLUMN IS WITHDRAWN AS A FABRICATED FRONTIER ROW: it rested on transporting
    CCTV's independent-buffer 2^-16 rate to a mutation generator that does not draw independent
    buffers. On the corrected numbers a targeted vector exposes the early-termination class in
    1 probe with certainty and a uniform single-byte mutation needs 1.3 probes in expectation at
    L = 1088, so CCTV leads on that column by a factor under 2 in expected probes and by
    determinism, not by 2^16, and it does not dominate: it is DOMINATED on breadth, since it
    fixes one parameter set and one support while the derived form covers all three lengths and
    every declared generator. Where CCTV does dominate, and this is unchanged, is the REJECT-side
    invalid-input corpus, which is exhaustive and public and which this record does not attempt.
    No academic search for mutation-adequacy prior art was performed and no external
    methodological novelty is claimed.
  sota_delta: >-
    No attack; instrument-certification contribution only. Quantitatively, against this
    repository's own state: the number of (generator, defect-class, budget) triples in the
    corpus with a stated detection probability is currently ZERO, and this proposal produces 35
    of them plus an explicit list of the cells where the method must return VOID. Against the
    lane's four-class taxonomy the delta is NOT a fifth class -- that claim is withdrawn -- but a
    per-instance PARAMETERISATION of an existing column: early termination is C-BND with
    N = z+1 drawn from the honest ciphertext, which converts a class the lane had no number for
    into one with an exact conditional rate (L-1-z)/L and a derived integrated rate of
    0.683 / 0.768 / 0.837 at the three standardized lengths. Against the archived nulls the delta
    is a power number per null where there is presently none -- which may confirm them (power
    >= 0.99 everywhere, a negative for this proposal and a strengthening of the record) or
    identify exactly which are uninformative. Against the CCTV corpus the delta on the
    early-termination column is a factor under 2 in expected probes in CCTV's favour, replacing
    the withdrawn claim of 2^16.

  estimated_cost:
    implementation: high
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    By part. (i) That H1 (support sufficiency) holds exactly for OR-of-XOR comparators and is
    confirmed by the exhaustive value-independence check: ~0.95, it is close to algebra. (ii)
    That the closed form matches measured hit rates within 3 standard errors at all five graded
    points: ~0.8; the likeliest failure is probe dependence in the generator rather than the
    algebra. (iii) That at least one exactly-zero cell exists in the frozen matrix: ~0.9 -- the
    c1-only row against a bound at or beyond |c1| is close to constructed for it, which is a
    reason to weight the finding as a demonstration rather than a discovery, and this record says
    so. (iv) That at least one ARCHIVED null turns out to have power below 0.99 against a class
    it was aimed at: ~0.4, and this is the part I would bet against; the archived instrument
    appears to have been exhaustive single-byte at least some of the time, in which case power is
    1 by construction and the answer is a clean negative. (v) That the CONDITIONAL
    early-termination prediction (L-1-z)/L survives measurement, i.e. that the C-BND(N=z+1)
    reclassification is right: ~0.9, it follows from the definition of a C-string comparison and
    the red-team screen reports a measurement consistent with it. (vi) That the INTEGRATED
    prediction survives, i.e. that H4's uniformity holds well enough at 10^4 samples: ~0.6 --
    compressed ciphertext bytes are not uniform bytes and a detectable departure in the c1 region
    would not surprise me; that outcome is a finding, not a failure. (vii) That NULL-D passes on
    the first attempt now that the sign has been repaired: ~0.9, and the remaining 0.1 is exactly
    why it runs first.

