      -> 9 links. (W4) WebFetch https://eprint.iacr.org/2024/523 -> RETRIEVED AND READ
      (Schmieg), used only as context in a sibling proposal, not relied on here. (W5) WebFetch
      of the FIPS 203 ipd PDF FAILED (unreadable conversion) -- recorded as infrastructure,
      never as evidence.
    results: >-
      Inside the repository, the adequacy literature is entirely about the CONTROL ARM:
      IDEA-20260724-001 proposes a baseline-invisible synthetic control; IDEA-20260724-002
      proposes a library-facing interposed defective comparator and records that EV-MLKEM-007
      answered adequacy "only as a harness tautology"; EV-MLKEM-009/010 adjudicate
      INTERPOSE_COMPARE versus GNU ld --wrap. Every one of these asks "is the control wired to
      the right place". NONE computes or measures the probability that a generated input would
      expose a given defect. IDEA-20260805-ee2018 comes closest by deriving the forced SIZE of
      a silent set, but it uses that size to classify a MECHANISM, never to compute a
      generator's hit rate against it, and its own instrument is exhaustive single-byte
      probing, for which the power question is trivially 1 and therefore never arises.
      Outside, the CCTV corpus is an existence proof that targeted vectors are constructed for
      exactly this reason; its 2^-16 remark is now understood as the independent-buffer
      natural-occurrence rate and is NOT the quantity this proposal systematises. No search was
      made for academic work on mutation-testing power or covering-array adequacy, and none is
      claimed; absence of a search result is not evidence of absence.
    verdict: >-
      UNVERIFIED. Claimed new relative to this repository: taking the generator's difference
      SUPPORT as the tracked object; the closed form P_hit = C(|S|,k)/C(L,k) with its forced-zero
      and forced-unit cells; translating archived sample budgets into per-cell power; and the
      reclassification of early termination as C-BND with a data-dependent bound N = z+1 together
      with its integrated single-byte rate. ASSEMBLED FROM KNOWN PARTS: the taxonomy is
      IDEA-20260805-ee2018's; the null-that-cannot-fail framing is KN-TECH-1a5b7e's, applied to a
      new location; power analysis and Clopper-Pearson intervals are ordinary statistics; the
      existence of the strcmp defect class is CCTV's and is attributed. WITHDRAWN FROM THE
      PREVIOUS VERDICT: the claim that the lane's four-class taxonomy omits a class it cannot
      express. It can express it.

  object_first_candidate:
    tracked_object: >-
      THE DIFFERENCE SUPPORT D = { i in [0, L) : c_mutated[i] != c_honest[i] }, followed from
      the generator that draws it, through the accumulate step of the comparison, to the single
      bit "was this input ACCEPTED by the peer under test while a correct peer rejected it". The
      generator, the ciphertext values, the key, the plaintext and the arithmetic are all
      discarded; what is followed is a subset of position indices and, at the end, the indicator
      1{D subset of S}.
      ESTABLISHED FAMILIES DECLARED OFF-LIMITS as the primary lens for this record, per
      inventor-protocol section 1: (a) the silent set S itself, which is IDEA-20260805-1beeca's
      object and IDEA-20260805-ee2018's; (b) the residue L mod w, which is
      IDEA-20260805-3c957e's; (c) the control-arm wiring question (baseline-invisibility,
      library-facing interposition), which is IDEA-20260724-001's and -002's and is here
      CONSUMED rather than revisited; (d) all cryptanalytic and physical-side-channel lenses,
      excluded by RQ-MLKEM-002. S appears in this record only as a PARAMETER of the column, not
      as the thing tracked.
    lossiness: >-
      Genuinely and heavily lossy, and the discard is compatible with the target's operations
      for an OR-of-XOR accumulate and NOT compatible for a cancelling accumulate -- which is the
      whole content of the projection test here. A mutated ciphertext is L bytes (768, 1088 or
      1568); the projection keeps only which positions moved, discarding all 8 bits of magnitude
      at each moved position, i.e. it maps 255^{|D|} distinct inputs onto one object. The fibre
      over a given D has size 255^{|D|} and is therefore enormous and non-singleton, so this is
      not a change of coordinates. COMPATIBILITY: under OR-of-XOR, XOR of a nonzero delta is
      nonzero regardless of magnitude and OR is monotone, so the accumulator's per-lane nonzero
      pattern -- and hence acceptance -- is a function of D alone; the retained part propagates
      deterministically. INCOMPATIBILITY, STATED IN ADVANCE: under an arithmetic or checksum
      accumulate two deltas can cancel, the retained part does not propagate, and the closed form
      is VOID. EARLY TERMINATION IS A THIRD CASE AND IS NOT AN INCOMPATIBILITY: the verdict there
      depends on the honest ciphertext's byte values only through the single integer z, so the
      projection propagates deterministically once c is fixed, and the closed form applies
      conditionally on c with S = [z+1, L). The previous version of this record placed early
      termination in the incompatible class; that placement is withdrawn.
    propagation: >-
      One step of the target operation is one accumulate of one block. Its propagation law is
      exact and one line: lane j of h becomes nonzero iff D intersects the byte set mapping to
      lane j. Composing over blocks, the peer ACCEPTS iff D avoids every lane the reduce step
      reads, i.e. iff D subset of S, and the gate detects exactly then. That is a deterministic
      law with no probability in it; the probability enters only through the generator's law for
      D (chosen, not discovered) and, for the data-dependent column, through the law of z.
    survival_score: >-
      Survives three steps and dies at the fourth, and the death is the finding. Step 1,
      accumulate: survives, by the law above. Step 2, reduce: survives, because a reduce that
      reads a lane subset simply shrinks the covered set, which is how C-RED enters as a column.
      Step 3, EARLY TERMINATION: survives CONDITIONALLY -- for a fixed honest ciphertext the
      silent set is the fixed set [z+1, L), so the projection is intact per instance and only the
      column's parameter becomes a random variable. Step 4, A CANCELLING ACCUMULATE (arithmetic
      sum, subtract-with-borrow, CRC): DIES, because two differences can annihilate and the
      support stops determining acceptance; C-FIN can additionally lose the bit after the support
      has done its work. The proposal reports the survival boundary as a deliverable, with the
      cancelling accumulate as the named object on which the method must return VOID.

  null_object_control: >-
    FOUR controls, all on the identical measurement path, all with forced values DERIVED FROM THE
    PHYSICAL GATE QUESTION ("does the peer accept the mutated input while a correct peer rejects
    it?") and never from this record's algebra, and ALL ABLE TO FAIL. KN-TECH-1a5b7e's null-first
    rule applies: every verdict is emitted on the null arms and committed BEFORE any real
    generator or archived budget is scored.
    NULL-A, THE FORCED-UNIT CELL (must report detection on every probe). A generator constructed
    to draw supports only from inside a declared silent set S0 -- literally D subset of S0 by
    construction -- driven against a planted comparator with exactly that S0. DERIVATION: every
    drawn mutation lies entirely in bytes the comparator never reads, so the comparator accepts
    every probe while a correct comparator rejects every probe, so the gate disagrees on every
    probe. FORCED: 100% detections in N probes, for every N. NOTE THAT THIS ARM'S FORCED VALUE IS
    THE OPPOSITE OF THE ONE THE WITHDRAWN VERSION ASSIGNED IT. It can fail: any miss means either
    the planted comparator's silent set is not S0, or the generator escapes its declared support,
    or the harness loses detections, and in any of those cases NO cell in the matrix is
    reportable. The measured value is reported as a binomial LOWER bound on power at the executed
    N, which is the honest form.
    NULL-B, THE FORCED-ZERO CELL (must report zero detections). A generator that always includes
    index 0 in its support, against a planted comparator whose silent set excludes 0. DERIVATION:
    every probe differs at a position the comparator reads, so the comparator rejects, exactly as
    a correct comparator does, so there is no disagreement to observe. FORCED: zero detections,
    for every N. This is the direct instantiation of KN-TECH-1a5b7e mode 1 and it is the arm the
    whole proposal claims can exist accidentally inside a real gate; if the apparatus cannot
    exhibit a zero cell deliberately, its claim that a real gate might contain one accidentally is
    not measurable. It can fail: any detection means the planted silent set or the generator's
    support is not what it was declared to be, and the matrix is void.
    NULL-C, THE GRADED ARM WITH FIVE INTERIOR POINTS AND A DERIVED CURVE. Planted comparators with
    |S|/L in {0, 0.25, 0.5, 0.75, 1.0} at fixed k = 2 against G2. The closed form predicts
    P_hit = C(|S|,k)/C(L,k), which is STRICTLY INCREASING in |S| and approximately (|S|/L)^k for
    L >> k, i.e. approximately 0, 0.0625, 0.25, 0.5625, 1.0 at the five points. The endpoints are
    forced by physics independently of the algebra: |S| = 0 is a complete comparison, which
    rejects every mutant and can never disagree with a correct peer (0); |S| = L is a comparison
    that reads nothing, which accepts every mutant (1). The check is the residual against the
    predicted curve at all five points, not the ordering alone, and a monotone-but-wrong curve
    fails it.
    NULL-D, THE DIRECTION ANCHOR, WHICH IS THE CONTROL THIS RECORD WAS REPAIRED TO ADD. Before any
    cell is computed, the frozen script is run on the archived configuration whose answer is
    committed elsewhere in the corpus: L = 1568, planted silent set exactly {1536..1567} (the AVX2
    pre-fix profile in EV-MLKEM-005). FORCED: a generator restricted to [1536, 1568) must be
    assigned P_hit = 1, and a generator restricted to [0, 1536) must be assigned P_hit = 0,
    because EXP-MLKEM-006's CTRL-POSITIVE-CONTROL-RETAINED passes exactly when a class REACHING
    1536..1567 detects and decapsulation ACCEPTS a mutated ciphertext in that region. It can fail,
    and it fails loudly under precisely the error that produced this repair: a pipeline carrying
    the inverted containment emits 0 and 1 the other way round and contradicts a committed
    control. NULL-A, NULL-B and NULL-C all inherit their definitions from the same containment
    statement and therefore CANNOT independently detect an inversion of it; NULL-D can, because
    its forced values come from an archived instrument record and not from this record.
    COMPARATOR REPLICATION (mode 5): every generator is a stochastic ensemble, so each cell is
    drawn at least 8 times with independent seeds and the INTERVAL is reported, never a single
    draw; and the rule "cell is UNCERTIFIED if power < 0.99" has its own false-positive rate
    derived before the run and checked leave-one-out against the null draws afterwards.

  discriminated_from:
    - >-
      IDEA-20260724-001 (baseline-invisible synthetic control) and IDEA-20260724-002
      (library-facing adequacy probe, widened peer) both repair WHERE the control is wired and
      whether the baseline generator can see it. Neither computes a probability. A control that
      is perfectly invisible to the baseline and perfectly library-facing still tells you
      nothing if the generator's hit rate against the class in question is 0 at the budget run.
      This record is orthogonal to both and consumes their conclusions unchanged.
    - >-
      IDEA-20260805-ee2018 derives the forced SIZE and PERIOD of a silent set to classify a
      mechanism, and proposes exhaustive single-byte probing as the instrument. Under exhaustive
      probing the power question is trivial (every position is probed, so any non-empty
      position-defined silent set is hit), which is precisely why that record never needed this
      one. The moment the gate uses anything cheaper than exhaustive probing -- which every
      multi-class mutation generator in EXP-MLKEM-003..006 does -- power stops being 1 and stops
      being known. This record is about that regime.
    - >-
      IDEA-20260805-3c957e proves parts of the search space arithmetically EMPTY -- a statement
      about which defects can EXIST at ML-KEM lengths. This is a statement about which existing
      defects a given generator can SEE. The two axes meet at one point and the meeting is a
      consistency check rather than an overlap: 3c957e's empty silent set gives |S| = 0, and this
      record's closed form then gives P_hit = 0, reproducing 3c957e's own statement that no
      differential test has power against an empty silent set. The withdrawn version of this
      record contradicted that statement, which is one of the ways the error was detectable.
    - >-
      IDEA-20260805-1beeca audits an observation collision between two MECHANISMS producing the
      same silent set. This record audits a collision of a different kind -- between "no defect"
      and "no power" producing the same VERDICT -- and the two collisions are at different
      stages of the pipeline: 1beeca's is between mechanism and observation, this one is between
      observation and conclusion.
    - >-
      A mutation-testing or fuzzing coverage report counts mutants killed. This computes, per
      defect class, the probability of killing, derives which cells are exactly zero and which
      exactly one, and translates an archived sample budget into a power number for an archived
      null. Nothing here generates a corpus for its own sake or reports coverage as a score.

