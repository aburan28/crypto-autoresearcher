idea:
  id: IDEA-20260821-13b667
  question_id: RQ-MLKEM-002
  added: '2026-08-21'
  title: >-
    Certify the generator before trusting the gate's null: the detection probability of each
    mutation class against each comparison-defect class is a closed form in the difference
    SUPPORT, it has provably-zero cells, and the one defect class the lane's taxonomy cannot
    express -- early-termination comparison, for which a published corpus records a random hit
    rate of 2^-16 -- shows the taxonomy itself was incomplete
  class: control

  claim: >-
    (A) THE QUESTION NOBODY IN THIS LANE HAS ASKED WITH A NUMBER. Three batches
    (EXP-MLKEM-003 through -006) argued about whether the differential gate's adequacy control
    was baseline-invisible and whether it was library-facing. None of them asked, and none of
    them answered: WITH WHAT PROBABILITY DOES THIS GENERATOR EMIT AN INPUT THAT A COMPARISON
    WITH DEFECT CLASS X WOULD FAIL TO REJECT? That number is the gate's statistical power, it
    is what converts a null into evidence, and it is computable in closed form before any
    build exists.
    (B) THE CLOSED FORM. Let S subset of [0, L) be the SILENT SET of a defective comparison --
    the byte positions at which a difference is not seen. Let a generated ciphertext differ
    from the honest one on the support D subset of [0, L). For a comparison whose accumulate
    step is OR-of-XOR over positions, the defect is EXPOSED by that input if and only if
    D is not contained in S. Hence the per-probe detection probability is
    P_hit(g, S) = 1 - Pr_g[D subset of S], and for a generator drawing D uniformly among
    k-subsets of [0, L), P_hit = 1 - C(|S|, k) / C(L, k). Everything the gate can conclude
    from a null is a statement about N * P_hit, and the lane has never written P_hit down.
    (C) THE FORCED-ZERO CELLS, WHICH ARE THE POINT. Some (generator, defect) cells have
    P_hit EXACTLY 0, by construction and not by bad luck. The condition is D subset of S, and
    the direction of that containment is what decides the cell, so it is written out rather
    than gestured at. Write c1 for the first 32*du*k ciphertext bytes and c2 for the trailing
    32*dv. A generator confined to c2 draws D subset of [|c1|, L); against C-BND(N) with
    N <= |c1| -- a comparison that stops at or before the start of c2, whose silent set is
    S = [N, L) -- every drawable support satisfies D subset of S, so P_hit is EXACTLY 0. The
    mirror case is NOT a zero cell and must not be misread as one, and it carries a CONDITION
    that the containment argument does not survive without: a generator confined to c1 has
    P_hit = 1 against C-BND(N) only when N >= |c1|, because only then is D subset of [0,|c1|)
    subset of [0,N), i.e. D DISJOINT from S = [N, L), hence D not contained in S. For
    N < |c1| the c1-confined cell is STRICTLY BETWEEN 0 AND 1 -- part of c1 is itself silent --
    and asserting 1 there is the same containment error in the opposite direction. Verified by
    brute-force enumeration over a structurally matched small analogue (L = 12, |c1| = 8,
    |D| = 2) by the orchestrating coordinator session on 2026-08-21: the c2-confined cell is
    0.000 at N = 4 and N = 8 and 0.833 at N = 10, while the c1-confined cell is 0.786 at
    N = 4 and 1.000 at N = 8 and N = 10. Likewise a generator confined to lane positions the C-RED reduction does not
    read has P_hit = 0 against that C-RED, while one confined to the lanes it does read has
    P_hit = 1. A gate containing a zero cell reports "no defect found" with probability 1
    whatever the peer does. That is KN-TECH-1a5b7e mode 1 -- the null that cannot fail --
    located in the GENERATOR rather than in a control arm, which is where this lane has never
    looked for it. EVERY CELL SIGN IN THE MATRIX IS TO BE DERIVED MECHANICALLY BY THE FROZEN
    STAGE-2 SCRIPT AND NEVER BY HAND: an earlier draft of this very record inverted the
    containment on the c1/c2 example, and the repaired draft then stated the mirror cell as an
    unconditional 1 when it holds only for N >= |c1|. BOTH errors are recorded rather than
    concealed, because two independent hand-derivations of the same three-line argument got it
    wrong in two different directions, which is the strongest available argument for the frozen
    enumeration this proposal is actually about.
    (D) THE FIFTH CLASS, FOUND OUTSIDE, WHICH BREAKS THE PROJECTION. The lane's working
    taxonomy is C-COV / C-BND / C-RED / C-FIN (IDEA-20260805-ee2018), and all four are
    describable by a fixed silent SET of positions. The C2SP/CCTV ML-KEM test-vector corpus
    (fetched and read this session) documents a defect class that is not: an implementation
    using a string comparison, where a zero byte terminates the comparison early. Its silent
    set is not a set of positions at all -- it is a predicate on ciphertext CONTENT, and it
    varies input by input. CCTV records that the corresponding edge case has a "random
    occurrence probability of 2^-16", i.e. a support-blind random generator needs on the order
    of 2^16 probes where a targeted vector needs one. THIS RECORD'S CENTRAL CLAIM IS THEREFORE
    TWO-PART: the closed form certifies the gate against the four position-classes, AND it
    provably cannot certify it against the fifth, which the lane's taxonomy could not express
    and which this session found only by going outside the repository.
    (E) WHAT EACH ANSWER MEANS, DECLARED BEFORE THE RUN. If the certification matrix comes
    back with every cell at power >= 0.99 at the sample budgets the archived runs actually
    used, then those nulls were adequately powered against the classes they were pointed at,
    the lane's undecidability was a PRECEDENCE problem (KN-TECH-054) and not a POWER problem,
    and this proposal returns a clean negative that strengthens the existing record. If any
    cell is at or near zero, then at least one archived "no defect found" is uninformative
    against at least one class, and the record says exactly which cell and at what power.
    (F) WHAT IS NOT CLAIMED. No attack, no oracle, no exploitation path, no attack-cost
    estimate, no timing/power/EM/cache/fault measurement, no statement about MLWE hardness or
    ML-KEM security. No claim that any implementation has any defect. Nothing here changes any
    hypothesis status or re-reads any archived verdict; it computes what a future or past null
    is worth, and only the Coordinator may act on that. Any newly observed conformance defect
    escalates and is published by no agent.

  mechanism: >-
    STAGE 1 -- THE PROJECTION AND ITS EXACT DOMAIN OF VALIDITY. Write a blocked comparison as
    ACCUMULATE (h <- h OR (a_block XOR b_block)), REDUCE (r <- f(h)), FINALIZE, following
    IDEA-20260805-ee2018's anatomy. Under an OR-of-XOR accumulate, h's lane j is nonzero iff
    SOME byte mapping to lane j differed; XOR differences cannot cancel across positions, and
    OR cannot cancel across blocks. Therefore whether the verdict changes depends only on
    WHICH positions differ, not by how much -- the difference support is a sufficient
    statistic. THIS IS THE LOAD-BEARING STEP AND ITS FAILURE MODE IS NAMED: for an accumulate
    that is arithmetic (sum, subtract-with-borrow) or checksum-like (CRC), two differences can
    cancel and the support is NOT sufficient; for a comparison that terminates early on
    content, the support is not even well defined as a fixed set. Both exclusions are
    measured, not assumed (Stage 4).
    STAGE 2 -- THE MATRIX, DERIVED WITH NO COMPUTE. Rows: the mutation classes the lane has
    used or could use -- G1 single-byte at a uniform index; G2 k-byte uniform support; G3
    suffix-biased (indices drawn from the last m bytes); G4 c2-only; G5 c1-only; G6
    lane-aligned; G7 the CCTV targeted corpus. Columns: C-COV(w) with S the trailing
    (L mod w) bytes; C-BND(N) with S = [N, L); C-RED(phi, p) with S a union of residue classes
    mod p of density 1-phi; C-FIN with S determined at the finalize step; C-STRCMP with S
    content-defined. Each cell is P_hit computed in closed form where the column is a fixed
    set, and marked NOT-COMPUTABLE-BY-THIS-METHOD where it is not. The cells that come out
    exactly 0 are then stated as small lemmas, each of the form "Pr[D subset of S] = 1" -- the
    worked example being G4 (c2-only supports) against C-BND(N) with N <= |c1|, where
    S = [N, L) contains the whole of c2 and therefore contains every support the generator can
    draw. THE SIGN OF EVERY SUCH CELL IS DERIVED AND CHECKED BY THE FROZEN SCRIPT, NOT
    ASSERTED BY HAND: getting a containment direction backwards is the single most likely
    error in the whole proposal -- an earlier draft of this record made exactly that error on
    exactly this example -- and mechanical enumeration over the declared support laws is what
    catches it.
    STAGE 3 -- SAMPLE-BUDGET TRANSLATION. For each archived run, read its actual mutation count
    N from the committed run manifest and report power = 1 - (1 - P_hit)^N per cell, with a
    Clopper-Pearson interval where P_hit is estimated rather than derived. A cell whose power
    at the archived N is below a pre-declared 0.99 is flagged as UNCERTIFIED, which is a
    statement about the instrument and not about any implementation.
    STAGE 4 -- MEASURED CONFIRMATION AGAINST PLANTED COMPARATORS. Build planted comparators
    realising each column at several parameter values, drive each generator against each at a
    fixed probe budget, and compare the measured hit rate to the derived P_hit with binomial
    intervals. A systematic shortfall localises accumulate-cancellation; a systematic excess
    localises probe dependence (e.g. a generator that never repeats a support). Both are
    reportable findings about the instrument.
    STAGE 5 -- THE FIFTH COLUMN. Drive every generator against a planted early-termination
    comparator and measure the hit rate. The derived expectation from the closed form is
    NOT-COMPUTABLE; the externally reported random rate is 2^-16 (CCTV, attributed, not
    re-derived here). Measuring it settles whether a support-blind generator can reach the
    class inside any budget this program can afford, and whether the targeted corpus is
    therefore a necessary component of any future gate.

  novelty_status: unverified

  novelty_screen:
    method: >-
      THE crypto-kb MCP RETRIEVAL INDEX IS UNAVAILABLE THIS SESSION (in-memory Qdrant; it
      answers nothing and says so only in its startup log). Retrieval was therefore the Grep
      tool (ripgrep) over /home/user/crypto-autoresearcher plus WebSearch/WebFetch.
      Commands and results as run: (G1) pattern `detection power|hitting set|generator
      adequacy|adequacy probe|instrument adequacy`, -i, over ledger/, count mode -> 67
      occurrences across 43 files, the top rows being GOAL-MLKEM-002 (3), EV-MLKEM-008,
      EV-MLKEM-005, EV-MLKEM-010, H-MLKEM-004, H-MLKEM-005 (2), H-MLKEM-d9062d and four
      TASK handoffs -- i.e. the lane's adequacy history is dense and every one of those
      matches is about WHETHER a control is visible to the baseline, not about the numeric
      power of the generator. (G2) pattern `strcmp|CCTV|C2SP|MAL-BIND|Kemmy`, -i, over
      **/*.{yaml,md}, count mode -> 8 occurrences across 5 files: RQ-HYBRID-cdf2b2,
      coordination/goals/GOAL-MLKEM-005/.../census.md, two GOAL-AES-003 review files and one
      GOAL-AES-003 preregistration (4 occurrences). NOT ONE of them is under RQ-MLKEM-002 and
      not one concerns ML-KEM comparison conformance. (G3) pattern `-O2|-O3|...|toolchain`
      over ledger/proposals -> 4 files, none about generator power.
      Read in full: RQ-MLKEM-002; the lane's five-proposal inventory; IDEA-20260805-3c957e and
      IDEA-20260805-ee2018 in full (source of the C-COV/C-BND/C-RED/C-FIN taxonomy and of the
      three-part comparison anatomy); IDEA-20260805-1beeca's claim and object blocks;
      IDEA-20260724-002's claim and mechanism; GOAL-MLKEM-002's status, completion_criteria and
      checkpoint dispositions (second_impl_unavailable at three checkpoints);
      knowledge/techniques/KN-TECH-1a5b7e.md in full (modes 1-5, obligations 1-5);
      docs/inventor-protocol.md; docs/target-result-profile.md.
      Web: (W1) WebSearch `FIPS 203 ML-KEM encapsulation "modulus check" ByteEncode12
      ByteDecode12 input validation` -> 9 links. (W2) WebFetch
      https://github.com/C2SP/CCTV/blob/main/ML-KEM/README.md -> RETRIEVED AND READ; source of
      the strcmp vector category, of the quoted rationale, and of the 2^-16 figure. (W3)
      WebSearch `ML-KEM non-canonical public key encoding malleability binding MAL-BIND Kyber`
      -> 9 links. (W4) WebFetch https://eprint.iacr.org/2024/523 -> RETRIEVED AND READ
      (Schmieg), used only as context in a sibling proposal, not relied on here. (W5) WebFetch
      of the FIPS 203 ipd PDF FAILED (unreadable conversion) -- recorded as infrastructure,
      never as evidence.
    results: >-
      Inside the repository, the adequacy literature is entirely about the CONTROL ARM:
      IDEA-20260724-001 proposes a baseline-invisible synthetic control; IDEA-20260724-002
      proposes a library-facing interposed defective comparator and records that EV-MLKEM-007
      answered adequacy "only as a harness tautology"; EV-MLKEM-009/010 adjudicate
      INTERPOSE_COMPARE versus GNU ld --wrap. Every one of these asks "is the control wired to
      the right place". NONE computes or measures the probability that a generated input would
      expose a given defect. IDEA-20260805-ee2018 comes closest by deriving the forced SIZE of
      a silent set, but it uses that size to classify a MECHANISM, never to compute a
      generator's hit rate against it, and its own instrument is exhaustive single-byte
      probing, for which the power question is trivially 1 and therefore never arises.
      Outside, the CCTV corpus is an existence proof that targeted vectors are constructed for
      exactly this reason, and its 2^-16 remark is a published statement of the very quantity
      this proposal makes systematic. No search was made for academic work on mutation-testing
      power or covering-array adequacy, and none is claimed; absence of a search result is not
      evidence of absence.
    verdict: >-
      UNVERIFIED. Claimed new relative to this repository: taking the generator's difference
      SUPPORT as the tracked object; the closed form P_hit = 1 - C(|S|,k)/C(L,k) and its
      forced-zero cells; translating archived sample budgets into per-cell power; and the
      observation that the lane's four-class taxonomy omits a content-defined class documented
      in a public corpus. ASSEMBLED FROM KNOWN PARTS: the taxonomy is IDEA-20260805-ee2018's;
      the null-that-cannot-fail framing is KN-TECH-1a5b7e's, applied to a new location; power
      analysis and Clopper-Pearson intervals are ordinary statistics; the strcmp class and its
      2^-16 figure are CCTV's and are attributed, not derived here.

  object_first_candidate:
    tracked_object: >-
      THE DIFFERENCE SUPPORT D = { i in [0, L) : c_mutated[i] != c_honest[i] }, followed from
      the generator that draws it, through the accumulate step of the comparison, to the single
      bit "was this input rejected". The generator, the ciphertext values, the key, the
      plaintext and the arithmetic are all discarded; what is followed is a subset of position
      indices and, at the end, the indicator 1{D not contained in S}.
      ESTABLISHED FAMILIES DECLARED OFF-LIMITS as the primary lens for this record, per
      inventor-protocol section 1: (a) the silent set S itself, which is IDEA-20260805-1beeca's
      object and IDEA-20260805-ee2018's; (b) the residue L mod w, which is
      IDEA-20260805-3c957e's; (c) the control-arm wiring question (baseline-invisibility,
      library-facing interposition), which is IDEA-20260724-001's and -002's and is here
      CONSUMED rather than revisited; (d) all cryptanalytic and physical-side-channel lenses,
      excluded by RQ-MLKEM-002. S appears in this record only as a PARAMETER of the column, not
      as the thing tracked.
    lossiness: >-
      Genuinely and heavily lossy, and the discard is compatible with the target's operations
      for an OR-of-XOR accumulate and NOT compatible otherwise -- which is the whole content of
      the projection test here. A mutated ciphertext is L bytes (768, 1088 or 1568); the
      projection keeps only which positions moved, discarding all 8 bits of magnitude at each
      moved position, i.e. it maps 255^{|D|} distinct inputs onto one object. The fibre over a
      given D has size 255^{|D|} and is therefore enormous and non-singleton, so this is not a
      change of coordinates. COMPATIBILITY: under OR-of-XOR, XOR of a nonzero delta is nonzero
      regardless of magnitude and OR is monotone, so the accumulator's per-lane nonzero pattern
      -- and hence the verdict -- is a function of D alone; the retained part propagates
      deterministically. INCOMPATIBILITY, STATED IN ADVANCE: under an arithmetic accumulate two
      deltas can cancel, and under early termination the verdict depends on the byte VALUES of
      the honest ciphertext; in both cases the projection loses something the operation needs,
      the retained part does not propagate, and the closed form is void. The proposal measures
      exactly where that boundary is rather than assuming it.
    propagation: >-
      One step of the target operation is one accumulate of one block. Its propagation law is
      exact and one line: lane j of h becomes nonzero iff D intersects the byte set mapping to
      lane j. Composing over blocks, the verdict is REJECT iff D intersects the union of lanes
      the reduce step reads, i.e. iff D is not contained in S. That is a deterministic law with
      no probability in it; the probability enters only through the generator's law for D, which
      is the object's distribution and is chosen, not discovered.
    survival_score: >-
      Survives exactly two steps and dies at the third, and the death is the finding. Step 1,
      accumulate: survives, by the law above. Step 2, reduce: survives, because a reduce that
      reads a lane subset simply shrinks the covered set, which is how C-RED enters as a
      column. Step 3, FINALIZE AND CONTENT-DEPENDENT COMPARISON: DIES. C-FIN can lose the bit
      after the support has already done its work, and C-STRCMP makes the effective silent set
      a function of the honest ciphertext's own bytes, so no fixed S exists and the projection
      has nothing to be a projection of. The proposal reports the survival boundary as a
      deliverable: two classes certifiable, two not, with the second pair named.

  null_object_control: >-
    THREE controls, all on the identical measurement path, all with forced values derived
    before any run, and ALL ABLE TO FAIL. KN-TECH-1a5b7e's null-first rule applies: every
    verdict is emitted on the null arms and committed BEFORE any real generator or archived
    budget is scored.
    NULL-A, THE ZERO-POWER CELL (must report zero). A generator constructed to draw supports
    only from inside a declared silent set S0 -- literally D subset of S0 by construction --
    driven against a planted comparator with exactly that S0. FORCED: zero detections in N
    probes, for every N. This can fail: any detection at all means either the planted
    comparator's silent set is not S0 or the generator escapes its declared support, and in
    either case NO cell in the matrix is reportable. The measured value is not "0" but a
    binomial UPPER BOUND on power at the executed N, which is the honest form.
    NULL-B, THE UNIT-POWER CELL (must report one). A generator that always includes index 0 in
    its support, against a planted comparator whose silent set excludes 0. FORCED: detection on
    every probe. If it misses even once, the harness is losing detections and every measured
    hit rate is a lower bound of unknown slack.
    NULL-C, THE GRADED ARM WITH FIVE INTERIOR POINTS AND MONOTONICITY REPORTED. Planted
    comparators with |S|/L in {0, 0.25, 0.5, 0.75, 1.0} at fixed k, against G2. The closed form
    predicts P_hit = 1 - C(|S|,k)/C(L,k), which is STRICTLY DECREASING in |S| -- so unlike the
    non-monotone case KN-TECH-1a5b7e warns about, monotonicity here is DERIVED and its failure
    is a falsifier of the closed form rather than a caveat on the reading. The check is the
    residual against the predicted curve at all five points, not the ordering alone.
    WHY THESE ARE NOT DECORATIVE. NULL-A is the direct instantiation of mode 1 and it is
    constructed to be the thing the whole proposal claims can exist inside a real gate; if the
    apparatus cannot exhibit a zero cell deliberately, its claim that a real gate might contain
    one accidentally is not measurable. COMPARATOR REPLICATION (mode 5): every generator is a
    stochastic ensemble, so each cell is drawn at least 8 times with independent seeds and the
    INTERVAL is reported, never a single draw; and the rule "cell is UNCERTIFIED if power <
    0.99" has its own false-positive rate derived before the run and checked leave-one-out
    against the null draws afterwards.

  discriminated_from:
    - >-
      IDEA-20260724-001 (baseline-invisible synthetic control) and IDEA-20260724-002
      (library-facing adequacy probe, widened peer) both repair WHERE the control is wired and
      whether the baseline generator can see it. Neither computes a probability. A control that
      is perfectly invisible to the baseline and perfectly library-facing still tells you
      nothing if the generator's hit rate against the class in question is 10^-5 at the budget
      run. This record is orthogonal to both and consumes their conclusions unchanged.
    - >-
      IDEA-20260805-ee2018 derives the forced SIZE and PERIOD of a silent set to classify a
      mechanism, and proposes exhaustive single-byte probing as the instrument. Under exhaustive
      probing the power question is trivial (every index is probed, so power is 1 for any
      position-defined class), which is precisely why that record never needed this one. The
      moment the gate uses anything cheaper than exhaustive probing -- which every multi-class
      mutation generator in EXP-MLKEM-003..006 does -- power stops being 1 and stops being
      known. This record is about that regime.
    - >-
      IDEA-20260805-3c957e proves parts of the search space arithmetically EMPTY. That is a
      statement about which defects can EXIST at ML-KEM lengths. This is a statement about which
      existing defects a given generator can SEE. A class can be reachable and invisible, or
      unreachable and trivially visible; the two axes are independent and the matrix reports
      both by keeping the column set aligned with 3c957e's classes.
    - >-
      IDEA-20260805-1beeca audits an observation collision between two MECHANISMS producing the
      same silent set. This record audits a collision of a different kind -- between "no defect"
      and "no power" producing the same VERDICT -- and the two collisions are at different
      stages of the pipeline: 1beeca's is between mechanism and observation, this one is between
      observation and conclusion.
    - >-
      A mutation-testing or fuzzing coverage report counts mutants killed. This computes, per
      defect class, the probability of killing, derives which cells are exactly zero, and
      translates an archived sample budget into a power number for an archived null. Nothing
      here generates a corpus for its own sake or reports coverage as a score.

