idea:
  id: IDEA-20260815-c13ef4
  question_id: RQ-RELN-001
  added: '2026-08-15'
  title: >-
    FACTOR BASES ARE ALWAYS BUILT BY SAMPLING; MEASURE WHETHER A DESIGNED
    BASE WITH ARITHMETIC-PROGRESSION STRUCTURE DECOMPOSES BETTER THAN A
    RANDOM ONE OF THE SAME SIZE
  class: measurement

  claim: >-
    KN-OPEN-006 asks whether designed relation supports give a structured
    matrix whose solve beats generic sparse methods. The upstream half is
    unmeasured: does a designed base decompose targets at a different RATE
    from a random base of equal size? If the rate is identical the linear-
    algebra question is moot, and if it differs the direction determines
    whether design helps or hurts.

  mechanism: >-
    Construct factor bases with declared structure -- arithmetic
    progressions in a coordinate, orbits under an available automorphism,
    and a random control -- all at matched size. Measure decomposition rate
    against a common target sample.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Read of KN-OPEN-006; grep 'designed support', 'arithmetic
      progression', 'factor base design' (159).
    results: >-
      Factor-base design is heavily represented and KN-OPEN-006 poses the
      linear-algebra half; no record measures decomposition rate as a
      function of the base's structure at matched size.
    verdict: >-
      UNVERIFIED. Designed factor bases appear in the index-calculus
      literature; whether the rate comparison at matched size has been
      made is a blocking stage-one literature check.

  object_first_candidate:
    tracked_object: >-
      THE DECOMPOSITION RATE as a function of the factor base's internal
      structure, at fixed size.
    lossiness: >-
      Holding size fixed and varying structure isolates structure's
      contribution, which a size-varying comparison confounds.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while structured bases of the required size are
      constructible; automorphism-orbit bases need curves with
      automorphisms and are reported separately.

  null_object_control: >-
    NULL 1 -- random base at matched size, the reference. NULL 2 -- a
    deliberately degenerate base (all points in one small subgroup coset),
    which must decompose worse; a harness insensitive to that cannot detect
    structure at all.

  discriminated_from:
    - >-
        KN-OPEN-006, which asks about the linear-algebra consequence; this
        measures the upstream rate that determines whether the question
        matters.
    - >-
        The automorphism factor-base reduction already recorded in this
        program, which reduces base size; this holds size fixed and varies
        structure instead.

  assumptions:
    - >-
        Structured bases of the required size are constructible on the
        test curves.
    - >-
        Matched size is the right control variable; if the structures
        differ in effective size after deduplication, the comparison is
        confounded and must be corrected.

  predictions:
    - metric: >-
        degenerate-base null
      direction: different
      minimum_effect: >-
        FORCED to decompose worse; a harness that cannot see it detects
        nothing.
    - metric: >-
        designed versus random base rate at matched size
      direction: different
      minimum_effect: >-
        The measurement; either direction is informative and neither is
        pre-committed.
    - metric: >-
        effective size after deduplication
      direction: different
      minimum_effect: >-
        Reported per base, since a structured base may contain fewer
        distinct usable elements and that alone would explain a rate
        difference.

  minimal_test:
    design: >-
      One curve, three base structures at matched size, one target sample,
      both nulls.
    controls:
      - >-
          Random base at matched size.
      - >-
          Degenerate-base sensitivity null.
      - >-
          Effective size after deduplication reported per base.
      - >-
          Automorphism-orbit bases reported separately from generic
          ones.
    required_metrics:
      - >-
          Decomposition rate per base structure with intervals.
      - >-
          Effective size per base.
      - >-
          Both null outcomes.
      - >-
          Artifact manifest with hashes and rebuild receipt.

  falsification_conditions:
    - >-
        The degenerate null does not decompose worse. Harness insensitive;
        no result admissible.
    - >-
        Rates are identical across structures. Structure does not affect
        supply at this size, which makes KN-OPEN-006's linear-algebra
        question moot at this scope.
    - >-
        A designed base decomposes better. Route to the linear-algebra
        half with a measured rate advantage rather than an assumed one.
    - >-
        A designed base decomposes worse. Design carries a supply cost
        that any structured-solve gain must overcome, which is the outcome
        most likely to be overlooked.

  confounders:
    - >-
        EFFECTIVE-SIZE CONFOUNDING: a structured base may deduplicate to
        fewer distinct elements, so a rate difference could be a size
        difference in disguise.
    - >-
        CURVE SPECIFICITY: one curve cannot separate a structure effect
        from a curve effect.

  interpretation_limits:
    - >-
        Measures supply, not solve cost; the linear-algebra half remains
        KN-OPEN-006's.
    - >-
        Scoped to the tested curve, size and structures.
    - >-
        A rate advantage is not an attack and needs the solve-cost half
        before it means anything.

  heuristic_assumptions:
    - id: HEUR-RELN-STRUCT-1
      statement: >-
        At fixed factor-base size, decomposition rate is independent of
        the base's internal structure.
      rigorous_support: >-
        Rigorous ingredient: the tuple-image counting bound from KN-
        OPEN-020 caps reachable targets by base size alone, independent
        of structure, giving an upper bound that structure cannot
        exceed. THE GAP: the bound is an upper bound, and nothing forces
        a structured base to ATTAIN it -- structure could easily cause
        tuples to collide and reach fewer targets, which is the downside
        direction this record is specifically watching for.
      falsification_condition: >-
        A rate difference between structures at matched effective size,
        reproducible across curves.
      validation_plan: >-
        SAMPLE: >= 3 curves x 3 structures x >= 500 targets. COMPARISON:
        paired per-curve rate, with effective size as a covariate. TAIL
        CHECK: the structure with the lowest rate, checked for tuple
        collisions. TRANSFER: none beyond the tested size.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is decomposition attempts across three bases
      on a common target sample.
    memory_exponent: >-
      One base plus attempt working set; modest.
    best_known: >-
      The incumbent is the lane's random-sampled factor base; no
      structured comparison at matched size exists here.
    hidden_overhead: >-
      Deduplication and effective-size accounting is easy to get wrong and
      would silently invert the conclusion.
    tradeoff_note: >-
      Structure may buy solve-time savings and cost supply; this record
      prices the supply side, which is the half that has been assumed
      rather than measured.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As cryptanalysis: nothing is mounted. As a
    supply measurement across base structures: none exists here. Not null on
    any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: decomposition rate measured
    across designed and random factor bases at matched effective size, with
    a sensitivity null, determining whether KN-OPEN-006's linear-algebra
    question has a supply cost attached to it.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.85 that structured bases are constructible. 0.7 that effective-size
    confounding can be controlled. 0.5 that rates are indistinguishable,
    which would make the structured-solve lane's premise cheaper to
    evaluate. 0.25 that designed bases decompose measurably worse, which is
    the finding most likely to be missed otherwise.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
  source_refs:
    - RQ-RELN-001
    - KN-OPEN-006
    - KN-OPEN-020
    - GOAL-RELN-001
    - KN-TECH-056
    - KN-TECH-080
    - docs/inventor-protocol.md
  id_allocation_provenance: >-
