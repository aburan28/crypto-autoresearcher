  minimal_test:
    design: >-
      PART 1 (arithmetic, no run, performed above): (A)'s formula check
      against d11575's ten cells, and (B)'s divisor counts for k' in
      {9, 15, 21} against the k-prime baseline of 10. PART 2 (toy
      executable cells, dk' <= 41): construct a synthetic composite-k'
      subfield curve, e.g. E/F_{2^4} over F_{2^{4*9}} = F_{2^36} (d = 4,
      k' = 9, within dk' <= 41), mirroring the real curves' shape at
      quarter scale (d = 4 in place of d = 16). Enumerate ALL divisors of
      N = 36 (1,2,3,4,6,9,12,18,36) and compute n(c) for each via (A);
      identify the pair sharing a period that k-prime curves cannot
      produce (e.g. c = 3 and c = 9, both with gcd(*, 4) = 1, giving
      n = 4, base fields q = 2^3 = 8 and q = 2^9 = 512 respectively -- the
      SAME genus range at an 2^6-fold smaller base field for c = 3). Verify
      by direct construction that sigma_3 and sigma_9 both fix E's
      coefficients with the predicted minimal orbit size 4 (not smaller),
      and compute the Artin-Schreier level m (hence genus) for BOTH cells
      by the SAME method d11575's Phase 1 census uses, checking they agree
      exactly as (C) predicts. PART 3 (cost comparison, reusing d11575's
      cost-table method unmodified): charge time and memory for both
      cells (c = 3, q = 8, g as computed; c = 9, q = 512, same g) under
      the SAME small-genus-versus-large-genus regime split d11575 uses,
      and report which (if either) beats matched rho at this toy scale --
      the first concrete data point on (C)'s open question.
    controls:
      - >-
        k-prime toy analogue at matched d = 4 (e.g. k' = 7 or 11, both
        dk' <= 41): the SAME construction restricted to only the two
        k-prime-available families, as the direct baseline this record's
        extra cell is compared against.
      - >-
        Prime-degree null (d = 1): confirms the entire construction is
        vacuous, per nearby_object_control (i)/(ii) above.
      - >-
        A THIRD divisor at the same period from a different factorisation
        of k' (if available at a larger toy k', e.g. k' = 45 = 9*5 offering
        m1 in {3,5,9,15}) as a within-cell replication that the shared-
        period, shared-genus prediction holds for more than one extra
        divisor, not just one; only run if budget allows given dk' <= 41
        is a tight ceiling for k' = 45 (d would need to be 1, vacuous) --
        FLAGGED AS LIKELY OUT OF REACH at this scale and reported as such
        rather than silently dropped.
    required_metrics:
      - divisor_lattice_of_N_per_cell
      - conjugate_period_per_divisor
      - artin_schreier_level_and_genus_per_divisor_sharing_a_period
      - genus_agreement_across_divisors_sharing_period
      - charged_time_and_memory_per_divisor_under_regime_split
      - matched_rho_at_toy_scale
      - ratio_and_verdict_per_divisor
  falsification_conditions:
    - >-
      n(c) computed on a toy cell disagrees with d/gcd(c,d) for any divisor
      c of N, for any construction. (A) is wrong.
    - >-
      tau(dk') disagrees with tau(d)*tau(k') on any toy composite-k' cell
      (would indicate a construction error, since this is a proven identity
      for coprime d, k' -- a disagreement means d and k' were not actually
      coprime, e.g. an accidental shared factor of 2, and the cell is
