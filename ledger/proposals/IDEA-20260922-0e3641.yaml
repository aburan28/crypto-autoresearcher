        principle that the Artin-Schreier level of a fixed field element B
        under an order-n automorphism is a function of the automorphism's
        ORDER and B alone, not of which specific field automorphism of that
        order is used -- plausible because all order-n elements of a cyclic
        Galois group act identically on the FILTRATION structure, but not
        independently verified for divisors c that are coprime to both d
        and k (the genuinely new case this record introduces).
