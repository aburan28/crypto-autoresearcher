    flagged as such.
  assumptions:
    - d = 16, k prime, as audited for all five curves.
    - >-
      d11575's C2 (magic-number range determined entirely by the order-n
      Frobenius action on B, independent of which specific c realises
      period n) is IMPORTED, not re-derived, as the basis for (C)'s claim
      that two divisors sharing a period share an IDENTICAL genus range,
      not merely a similar one. If d11575's C2 is wrong (already flagged as
      a proof obligation there), this record's (C) inherits that risk.
    - Arithmetic only at deployed parameters; the executable arm is toy composite-k' cells at dk' <= 41.
  proof_search_map:
    bottleneck: >-
      Whether the general period formula (A) is correct beyond d11575's two
      special cases, and whether d11575's C2 (imported for (C)) genuinely
      transfers to divisors c that are neither multiples of d nor of k --
      the genuinely new case composite k' introduces and prime k forbids.
    baseline_embedding:
      parameter_slice: >-
        Setting c | d (or c = jk) must reproduce d11575's exact stated
        periods; already checked symbolically above. Setting k' prime in
        (B) must reproduce tau(N) = 10 exactly, matching d11575's own
        ten-cell table for all five curves.
      reproduction_check: >-
        SYMBOLIC, ZERO COMPUTE. n(c) = d/gcd(c,d) at c = 2 (d = 16):
        gcd(2,16) = 2, n = 8, matching d11575's stated "c | 16... 16/c" with
        c = 2 giving n = 8 -- WAIT, d11575's table for c | 16 lists the
        COLLAPSED cells with the conjugate period being the SAME formula
        used to show sigma^i(E) = E for i a multiple of 16/c, i.e. the orbit
        of E under <sigma_c> has size 16/c = n(c); this is IDENTICAL to
        (A)'s formula since gcd(c,16) = c when c | 16. Confirmed consistent
        without contradiction.
    observation_collision:
      observable: >-
        The pair (period n, base field size q = 2^c) across all divisors c
        of N sharing a given n.
      distinct_preimage_search: >-
        Two divisors c, c' with gcd(c,d) = gcd(c',d) but c != c' give
        IDENTICAL n but DIFFERENT q -- this is the collision (C) exploits
        as a genuine new degree of freedom. The dangerous confusion would be
        assuming identical n also implies identical COST; (C) explicitly
        blocks that inference by invoking the regime-ratio diagnostic, which
        depends on q (hence on c, not just on n).
    constructive_transforms:
      - transform: base_field_enumeration
        proposed_object: >-
          The FULL divisor lattice of N = dk' for composite k', as opposed
          to d11575's restricted two-family enumeration valid only for
          prime k.
        predicted_gain: >-
          tau(d)*(tau(k')-2) EXTRA candidate cells beyond the k-prime
          baseline's 2*tau(d), each sharing a period (hence genus range)
          with an already-censused cell but at a smaller base field --
          MORE SEARCH SURFACE, with NO cost claim attached (per (C)).
    quantifier_order: >-
      FOR ALL divisors c of N = dk, n(c) = d/gcd(c,d) EXACTLY (an equality,
      proved in (A), not a heuristic). FOR ALL k' > 1, tau(dk') >= 2 tau(d),
      with equality IFF k' is prime (an exact number-theoretic fact, proved
      in (B)). SEPARATELY, AND EXPLICITLY LEFT OPEN: whether any of the
      extra cells composite k' affords ever beats the corresponding
      k-prime-restricted cell in ACTUAL charged cost once regime validity
      and hidden constants are accounted for -- no quantifier is asserted
      for this because it is not resolved.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The five deployed ANSI composite-degree curves, by virtue of k
        being prime, carry the minimum possible number of GHS-candidate
        base fields (tau(N) = 2 tau(16) = 10) among ALL curves of the shape
        N = 16 * (anything greater than 1); any composite-k' curve of the
        same shape carries strictly more (at least 15), each additional
        divisor pairing an already-censused genus range with a strictly
        smaller base field." That is the ceiling. It certifies NOTHING
        about whether the extra cells are cheaper, more expensive, or
        inapplicable in practice -- (C) explicitly declines to resolve
        that -- and nothing about curves whose total degree is not of the
        "power of 2 times k" shape at all (the general MMT population,
        whose divisor lattices this record does not enumerate).
      nearby_object_control: >-
        TWO. (i) PROVES TOO MUCH: apply (B) to d = 1 (no subfield structure
        at all, a prime-degree curve): tau(1) = 1, tau(N) = tau(k)
        regardless of k's factorization, and the ENTIRE "extra divisor"
        argument of (C) evaporates because there is no d-dependent period
        formula to share -- correctly reproducing the fact that prime-degree
        curves (the c2tnb family) have NO GHS lattice structure at all,
        consistent with d11575's own prime-degree nearby-object control.
        (ii) NULL OBJECT: a curve over F_{2^N} not defined over F_{2^d} for
        any d > 1 has no period formula (A) at all (the derivation requires
        E defined over a proper subfield), so this record's entire
        construction is vacuous there, matching (i).
    proof_obligations:
      - claim: n(c) = d/gcd(c,d), derived from the automorphism-order argument.
        responsibility: correctness
      - claim: n(c) reproduces d11575's two stated period formulas exactly at c | d and c = jk.
        responsibility: baseline
      - claim: tau(dk) = tau(d) tau(k) for gcd(d,k) = 1 (standard, recalled).
        responsibility: correctness
      - claim: tau(k) = 2 iff k prime, hence tau(N) is minimised over k' > 1 exactly at k prime.
        responsibility: correctness
      - claim: >-
          Two divisors sharing gcd(*, d) share an identical genus range
          (imported from d11575's C2, not independently re-derived here;
          inherits that record's proof obligations).
        responsibility: baseline
      - claim: The net cost comparison of (C) is explicitly left open, not resolved in either direction.
        responsibility: scope
  predictions:
    - metric: conjugate_period_formula_reproduces_d11575_on_both_families
