idea:
  id: IDEA-20260922-0e3641
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-22'
  status: proposed
  approved_by: null
  title: >-
    k PRIME MINIMISES THE GHS DIVISOR LATTICE: THE FIVE ANSI CURVES CARRY THE
    FEWEST POSSIBLE CANDIDATE BASE FIELDS (tau(N) = 2*tau(16) = 10) OF ANY
    CURVE OF THE FORM N = 16k, k > 1 -- A COMPOSITE-k CURVE OF THE SAME SHAPE
    HAS tau(16)*tau(k) >= 15 CANDIDATE CELLS, EACH SHARING ITS GENUS RANGE
    WITH A SMALLER-BASE-FIELD ALTERNATIVE k PRIME DENIES -- BUT WHETHER THAT
    EXTRA SEARCH SPACE IS EXPLOITABLE DEPENDS ON THE SAME REGIME-VALIDITY
    TENSION IDEA-20260922-d11575 ALREADY FLAGGED FOR ITS OWN TEN CELLS, SO
    THIS RECORD RIGOROUSLY COUNTS THE ATTACK SURFACE AND EXPLICITLY LEAVES
    ITS EXPLOITABILITY OPEN
  class: control
  claim: >-
    SETTING. E/F_q, q = 2^d, d = 16 for the five deployed ANSI curves,
    attacked over F_{q^k}, N = dk, k in {11,13,17,19,23} prime (audit).
    IDEA-20260922-d11575's census exhaustively covers all ten divisors of
    N = 16k precisely because k prime forces the divisor lattice into the
    two disjoint families {divisors of 16} union {k times divisors of 16},
    size 5 + 5 = 10. Seam 4 of the lane prompt asks what this denies the
    attacker relative to a GENERIC composite-degree curve of the kind the
    GHS literature (MMT, eprint 2001/084, covering arbitrary composite N in
    [100,600]) more commonly studies, most of which do NOT have the special
    "power of 2 times a single prime" shape.

    (A) THE GENERAL CONJUGATE-PERIOD FORMULA, DERIVED HERE, VALID FOR ANY
    DIVISOR c OF N = dk (not only c | d or c a multiple of k, the two cases
    d11575 needed for prime k). Let sigma_c be the F_{2^c}-power Frobenius,
    an automorphism of F_{2^N}/F_{2^c} of order N/c. Since E is defined over
    F_{2^d}, sigma_c^i(E) = E iff sigma_c^i fixes A, B in F_{2^d}, i.e. iff
    (2^c)^i = 1 as an automorphism of F_{2^d}, i.e. iff d divides c*i. The
    smallest such i is d / gcd(c, d). CONSEQUENCE: the conjugate-period
    formula n(c) = d / gcd(c, d) DEPENDS ONLY ON d AND gcd(c, d), NEVER ON
    HOW c FACTORS THROUGH k. Checked against d11575's own two families: c | d
    gives gcd(c,d) = c, n(c) = d/c (d11575's "16/c" for the c | 16 collapsed
    cells, consistent -- and n = 1 there is the trivial identity case, n > 1
    the genuinely collapsed cells per C1); c = jk, j | d, gives
    gcd(jk, d) = j (since gcd(k,d) = 1, k odd), n(jk) = d/j (d11575's stated
    "conjugate period equals n = 16/(c/k)" with c/k = j, exact match). This
    record's (A) is therefore a STRICT GENERALISATION of d11575's C1/C2 that
    happens to specialise to exactly d11575's two families when k is prime,
    because prime k admits NO third kind of divisor.

    (B) THE DIVISOR-COUNT COMPARISON, COMPUTED HERE. For k prime, tau(N) =
    tau(d) * tau(k) = tau(d) * 2 = 2 tau(d) (Euler's tau is multiplicative on
    coprime factors; k odd is coprime to d = 2^4). At d = 16, tau(16) = 5
    (divisors 1,2,4,8,16), so tau(N) = 10 -- exactly d11575's ten-cell table,
    for EVERY one of the five curves regardless of which prime k they carry.
    THIS IS THE MINIMUM POSSIBLE tau(N) among ALL curves of the shape
    N = 16 * k' for k' > 1: tau(16 k') = 5 * tau(k') and tau(k') >= 2 for any
    k' > 1, with EQUALITY iff k' is prime. Composite k' gives strictly more:
    k' = 9 (= 3^2): tau(9) = 3, tau(N) = 15. k' = 15 (= 3*5): tau(15) = 4,
    tau(N) = 20. k' = 21 (= 3*7): tau(21) = 4, tau(N) = 20. So a curve of
    this exact "power-of-2 times k" shape but with composite k carries 50%
    to 100%+ more candidate base fields than any of the five ANSI curves, at
    comparable total field size. This is not a statement about cost; it is
    an exact count of the SEARCH SPACE an attacker must exhaustively examine
    per (A)'s formula before any regime-validity or cost filtering, and it
    is a rigorous, checkable number-theoretic fact.

    (C) WHAT THE EXTRA DIVISORS BUY: SAME GENUS, SMALLER BASE FIELD, AT THE
    PRICE OF WORSE REGIME VALIDITY. By (A), TWO divisors c, c' of N sharing
    the same gcd(*, d) give the IDENTICAL conjugate period n, hence (per
    d11575's C2, which depends only on the action of the ORDER-n Frobenius
    on B, itself determined by n alone, not by which c realises it) the
    IDENTICAL magic-number range and genus range. For k prime, at each
    period n(c) = d/j (j | d), there is exactly ONE non-collapsed divisor
    realising it: c = jk, forcing base field q_c = 2^{jk}. For composite k',
    say k' = m1 * m2 with 1 < m1 < k', there is an ADDITIONAL divisor
    c = j*m1 realising the SAME period n = d/j at the STRICTLY SMALLER base
    field q = 2^{j m1} < 2^{j k'} -- a genuine additional (period, base-
    field-size) pair k prime denies. WHETHER THIS IS EXPLOITABLE IS NOT
    SETTLED HERE: shrinking the base field q at fixed genus g INCREASES the
    regime ratio g / log2(q) (IDEA-20260922-8278db's diagnostic, imported
    here for a different mechanism), pushing the construction FURTHER from
    the small-genus regime the cheap q^{2-2/g} power law assumes and toward
    the large-genus, subexponential-but-far-worse Enge-Gaudry regime
    d11575 itself already had to invoke for its own n = 8, 16 cells. So the
    extra divisor is a genuinely NEW candidate lane, but its net effect on
    cost is AMBIGUOUS from this analysis alone and is left open, stated as
    such rather than resolved either way.

    Representation class R1 (RQ-ECDLP-623a32). Attack stage: the base-field-
    ENUMERATION step of GHS descent, prior to any per-cell cost computation
    -- the same stage d11575 addresses, extended to the general divisor
    lattice rather than restricted to the k-prime special case.
  mechanism: >-
    OBJECT FRAME. Representation: R1, same object as IDEA-20260922-d11575
    (a divisor c of N and the associated conorm-norm relation vector);
    Sigma: translation by degree-one places of the covering curve over
    F_{2^c}, identical trichotomy placement (partial-action, Class I,
    d11575's own argument, cited and not restated). WHAT THIS RECORD ADDS
    is not a new object or a new lossy-projection argument but a GENERAL
    formula (A) that d11575 needed only in its two k-prime special cases,
    and the divisor-COUNTING consequence (B) that requires the general
    formula to state at all -- it is invisible from inside d11575's own
    ten-cell table, which never has occasion to construct a THIRD kind of
    divisor because none exists for its five curves.

    THE ARITHMETIC, SHOWN. n(c) = d/gcd(c,d) is derived from first
    principles (order of an automorphism fixing a subfield) in (A) above,
    not merely asserted; the two special-case checks against d11575's own
    stated periods are shown explicitly and agree exactly. tau(16) = 5 is
    counted directly (1,2,4,8,16). tau(9) = 3 (1,3,9), tau(15) = 4 (1,3,5,
    15), tau(21) = 4 (1,3,7,21) are counted directly. The multiplicativity
    tau(dk) = tau(d) tau(k) for gcd(d,k) = 1 is the standard number-theoretic
    fact (recalled), applied to d = 16 (a prime power, coprime to any odd
    k).

    F2 (factor-base decomposition, via the GHS cover construction) is the
    declared component, identical to d11575's. What is added: the general
    period formula (A), independent of any prior filed record; the exact
    divisor-count comparison (B), a genuinely new number-theoretic fact
    about this curve family relative to the general GHS-literature
    population; and the explicit, UNRESOLVED regime-validity trade-off (C)
    that separates "more candidate cells" from "more danger," stated
    honestly rather than either overclaimed or ignored.
