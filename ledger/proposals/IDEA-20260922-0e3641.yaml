      the k-related divisors it was derived for, and (C) must be revised to
      state the genus-sharing property as UNVERIFIED for non-k-related
      divisors rather than assumed.
    - >-
      Net cost comparison (Part 3) shows the smaller-q cell BEATS the
      larger-q cell at toy scale by a margin exceeding the regime-boundary
