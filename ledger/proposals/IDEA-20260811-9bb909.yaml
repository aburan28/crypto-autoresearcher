idea:
  id: IDEA-20260811-9bb909
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-EWALK-8fa147
  goal_id: GOAL-ENDO-001
  title: >-
    THE LOCAL-LABEL INFORMATION BUDGET FOR T5, AND THE FIRST TEST THAT COULD
    BREAK IT: every locally computable label on an isogeny class that this
    program can name factors through the level vector (v_ell(f_E))_ell, so the
    total addressing information available to a walking adversary is
    log2 #div(f) = p^{o(1)} bits against the log2 h = (1/2) log2 p bits an
    address needs -- a budget that is falsified outright by exhibiting ONE cheap
    label that separates two curves at the same level vector
  class: measurement

  claim: >-
    (A) THE DEFINITION, MADE PRECISE SO THE CLAIM CAN FAIL. Call a function L on
    the vertices of an F_p-isogeny class a LOCAL LABEL if it is computable from
    the curve equation (a, b) alone in (log p)^{O(1)} bit operations, i.e.
    without walking a distance that grows with h and without solving any discrete
    logarithm. T5 permits a variance result to survive only if goodness is common
    or is decided by such a label at each step of a walk.
    (B) THE BUDGET CLAIM. Every local label this program can construct is
    constant on the fibres of the level-vector map E -> (v_ell(f_E))_{ell | f}.
    Consequently the total information any collection of local labels can supply
    about a curve's position in the class is at most log2 #div(f) bits, and
    #div(f) <= p^{o(1)} because f^2 divides |D| <= 4p. An address in the class
    needs log2 h bits with h = |D|^{1/2 + o(1)}. Local labels therefore cannot
    reduce the addressing problem by any power of h; they can only select a
    stratum.
    (C) THE CONCRETE INSTANTIATION AT p = 4001, t = 30. The strata are the five
    levels with populations 3, 9, 18, 36, 72. The single most informative local
    label the campaign has -- the splitting type of x^3 + a x + b, predicted by
    IDEA-20260811-245481 to be [1,2] exactly on the 72 floor curves -- supplies
    log2(138/72) = 0.94 bits. The full level vector supplies at most
    log2 5 = 2.32 bits, against log2 138 = 7.11 bits for a full address. The
    budget is therefore not a vague asymptotic: it is a measurable number on a
    committed object.
    (D) THE FALSIFIER, WHICH IS CHEAP AND IS THE REASON TO RUN THIS. Compute a
    battery of candidate local labels on all 138 members and test whether ANY of
    them separates two curves sharing a level vector. A separation refutes (B)
    immediately, hands T5 an option-(ii) test with more than stratum resolution,
    and makes the reachability gate genuinely negotiable. No separation, across a
    battery chosen to be adversarially diverse, is a closure with a named
    obstruction: local computability at (log p)^{O(1)} cost sees only the
    endomorphism-ring conductor, because everything else about a vertex is a
    j-invariant and j is a p^{1/2}-sized address with no cheap structure.

  mechanism: >-
    A local label cannot see the class-group position because the class-group
    position is defined only relative to a base vertex and computing it is the
    vectorization problem. What a label CAN see is intrinsic arithmetic of the
    single curve: its group structure, its torsion Galois modules, its
    endomorphism ring's conductor, the factorisation patterns of its division and
    modular polynomials. All of those are determined by (p, t, f_E) plus data
    that is constant on the level. The budget claim is the assertion that this
    list is exhaustive at polylog cost, and its falsification is the discovery of
    a cheap invariant outside it.

  tracked_object: >-
    The label vector L(E) = (L_1(E), ..., L_r(E)) of all polylog-computable
    curve invariants, tracked along a walk on the isogeny graph, together with
    its one-step propagation rule under an ell-isogeny.

  resource: >-
    R2, R3 and R5 read at the vertex; R4 (the graph) supplies the walk. No point
    of G is used, so the object is k-independent by construction and satisfies
    H-ENDO-001 trivially -- which is also why its ceiling is an addressing
    ceiling and never an attack.

  lossy_projection_test: >-
    PASSES, and the budget claim IS a quantification of the loss. L is a map from
    138 vertices onto at most 5 values under (B); the fibres have 3 to 72
    members. Propagation is exact and known: an ell-isogeny changes the level
    vector in the ell-th coordinate by exactly +-1 (vertical) or 0 (horizontal),
    and every other tested label either follows that rule or falsifies (B). A
    label that turned out to be injective would be a change of coordinates and
    would be rejected by this test rather than celebrated -- it would mean the
    label is as expensive as the address.

  t5_reachability: >-
    This record IS a T5 instrument. It converts the qualitative dichotomy of
    DECOMPOSITION T5 into an information budget with a number, and it makes the
    negative side of the dichotomy checkable rather than assumed. Note the
    complementary correction argued in IDEA-20260811-b3a355: the walk to a
    SPECIFIED vertex costs p^{1/4+o(1)}, which is affordable against a p^{1/2}
    attack, so the binding constraint is IDENTIFIABILITY -- exactly the quantity
    this record measures -- rather than travel.

  null_object: >-
    A RANDOM RELABELLING null: permute the 138 curves' level labels uniformly and
    recompute every separation statistic. Under the null, any label that is
    genuinely a level function will appear to separate within a level as often as
    chance dictates, which calibrates the false-separation rate of the battery.
    A second null of the same shape: 138 curves from other traces (no volcano),
    where the level vector is undefined and every label must therefore separate
    freely -- an instrument that fails to separate THERE has no dynamic range and
    its negative on the class is void.

  why_not_a_renamed_known_approach: >-
    The lane already contains a family of level DETECTORS (IDEA-20260807-b1b604,
    -a6fb2a, IDEA-20260808-4d77a6) and a lossy-projection analysis of the
    negation class (IDEA-20260807-4cebed). This record is neither: it asks
    whether the set of all such detectors is CLOSED, i.e. whether any cheap
    invariant escapes the level. That is a statement about the space of labels
    rather than about one label, it is the first time this campaign has
    quantified T5 in bits, and it is falsifiable by a single separating pair.

  novelty_status: unverified
  novelty_screen: >-
    Screened this session against the RQ-EWALK lane (IDEA-20260807-4cebed,
    -15b468, -59fed3, -6355c6, -06cc5d, -cbbcfd, -ebcae6, -18d2f7, -59f5b7), the
    RQ-VOLC lane's detectors, DECOMPOSITION.md T5, and docs/inventor-protocol.md
    sections 1-5. No committed record states an information budget for local
    labels. WEB SEARCH UNAVAILABLE this session; external novelty not established.

  discriminated_from: >-
    NOT IDEA-20260807-ebcae6 (the sqrt(|Aut|) ceiling for quotient walks), which
    bounds a rho speedup; this bounds an ADDRESSING resource on the isogeny graph
    and says nothing about rho constants. NOT IDEA-20260807-631e80 (mixing
    constant of Elkies walks), which measures how fast a walk reaches uniformity;
    this measures how much a walker can KNOW at each vertex, the complementary
    half of T5. NOT IDEA-20260807-4f43ac, which grants a level oracle for free
    and shows it is GGM-simulable; this record asks how much such an oracle could
    contain in the first place, and routes its own oracles to RQ-GGMB-6eaabc via
    IDEA-20260811-b2806a as KN-FIND-b7e091 requires.

  assumptions:
  - >-
    The committed 138-member class with its certified level populations, and an
    independent level labeller (not the 2-torsion count, which resolves 2 of 5).
  - >-
    Local computability is defined at (log p)^{O(1)} bit operations with the
    factorisation of D = t^2 - 4p given. Granting that factorisation is generous
    to the adversary and is stated because at crypto scale it is a real cost.
  - >-
    The class is a single Cl(O)-torsor per level, so that "position" means
    position in a torsor and an address costs log2 h bits.

  proof_search_map:
    bottleneck: >-
      Whether any polylog-computable invariant of (a, b) separates two vertices
      at the same level vector. Removing that step converts T5 from a gate into a
      negotiable cost.
    baseline_embedding:
      parameter_slice: >-
        The trivial label L = constant reproduces the no-information baseline;
        the level label reproduces the campaign's current best local test. Both
        are included as rows so the battery embeds its own baseline.
      reproduction_check: >-
        The level label must reproduce the independently computed level on all
        138 members exactly; a battery that cannot reproduce a known label is not
        measuring anything.
    observation_collision:
      observable: The label vector L(E).
      distinct_preimage_search: >-
        This is the entire experiment: search for two distinct vertices with
        identical L. Under (B) collisions are abundant (72 curves collide at the
        floor); the informative search is for the CONVERSE -- a label separating
        a colliding pair -- and it is run adversarially over the battery.
    constructive_transforms:
    - transform: observable_fiber
      proposed_object: >-
        The fibre of L over a level, with j as the forgotten structure, and the
        question of whether any polylog function of j is non-constant on it in a
        way that is not merely j itself.
      predicted_gain: >-
        None as an attack. The gain is a closure with a mechanism, or its
        refutation.
    quantifier_order: >-
      The claim is: for all local labels L in the battery, for all pairs (E, E')
      in the class with equal level vectors, L(E) = L(E'). The falsifier is an
      existential: there EXISTS L and a pair with L(E) != L(E'). Note the
      quantifier weakness that must be stated: (B) as a universal over ALL
      polylog-computable labels is not testable, only the battery is. The
      record's honest scope is therefore the battery, and the general claim is
      forward guidance rather than a result.
    method_ceiling:
      strongest_certifiable_claim: >-
        That a specific, enumerated battery of cheap invariants is constant on
        levels for one class at one p. It cannot certify that no cheap invariant
        exists, and this record does not pretend otherwise -- that is exactly the
        fatigue-report failure mode docs/inventor-protocol.md section 4 forbids,
        so the deliverable is stated as a budget with an enumerated battery, not
        as a theorem.
      nearby_object_control: >-
        A set of 138 curves with no common trace, where every label MUST separate
        freely. A battery that is constant there too is broken.
    proof_obligations:
    - claim: Each battery member is computable in (log p)^{O(1)} bit operations.
      responsibility: runtime
    - claim: Each battery member is constant on level-vector fibres.
      responsibility: correctness
    - claim: The address requires log2 h bits.
      responsibility: size
    not_applicable_reason: null

  predictions:
  - metric: number_of_within_level_separations_across_the_battery
    direction: different
    minimum_effect: >-
      EXACTLY ZERO. One separation, reproduced under C-GAUGE and in a second
      implementation, falsifies (B) and is the highest-value outcome available
      from this record.
  - metric: empirical_entropy_of_the_label_vector_on_the_class_in_bits
    direction: lower
    minimum_effect: >-
      At most log2 5 = 2.32 bits, and predicted to be exactly the level-vector
      entropy H = -(3 log2(3/138) + 9 log2(9/138) + 18 log2(18/138) +
      36 log2(36/138) + 72 log2(72/138))/138 evaluated as the entropy of the
      population distribution (3, 9, 18, 36, 72)/138, which is 1.83 bits. A
      measured entropy above 2.32 bits falsifies (B) directly.
  - metric: address_entropy_gap
    direction: different
    minimum_effect: >-
      log2 138 - 1.83 = 5.28 bits remain unaddressable by local labels on this
      class. Predicted to grow like (1/2) log2 p - O(log log p) in general; the
      transfer arm at a second, larger p tests the growth.
  - metric: separations_on_the_no_volcano_null
    direction: higher
    minimum_effect: >-
      The battery must separate at least 90 percent of random pairs on the
      no-volcano control. Below that, the battery has no dynamic range and its
      zero on the class is uninterpretable.

  minimal_test:
    design: >-
      Build a battery of at least eight local labels and evaluate all of them on
      all 138 members: (1) splitting type of x^3 + a x + b; (2) the group
      structure invariant n_1; (3) the number of roots of Phi_ell(j, Y) in F_p
      for ell in {3, 5, 7}; (4) the factorisation degree pattern of psi_ell for
      ell in {3, 5}; (5) the Legendre symbol pattern of a, b and 4a^3 + 27b^2;
      (6) the multiplicative order of j in F_p^*; (7) the number of F_p-points on
      the quadratic twist's small torsion; (8) the Hilbert-class-polynomial
      membership label of IDEA-20260811-5e4cd5, which is the exact level and acts
      as the battery's positive control. Cross-tabulate every label against the
      independent level vector and report every within-level separation
      individually, with the offending pair named -- a count alone is
      incomplete, per the campaign's own EXTREME-CURVE LISTING rule.
    controls:
    - C-GAUGE on all labels, since a label that moves under (u^4 a, u^6 b) is a
      model artefact and not a curve invariant.
    - The random-relabelling null for the false-separation rate.
    - The no-volcano control set for dynamic range.
    - The exact-level label as a planted positive that MUST separate levels.
    required_metrics:
    - per_curve_label_vector
    - within_level_separation_list_with_named_pairs
    - empirical_label_entropy_in_bits
    - gauge_invariance_flag_per_label
    - null_separation_rates

  falsification_conditions:
  - >-
    A gauge-invariant local label separates two same-level curves. (B) fails; T5
    option (ii) is stronger than the budget says and the reachability gate must
    be re-argued at higher resolution.
  - >-
    Measured label entropy exceeds log2 #div(f). Same conclusion, reached by a
    summary statistic rather than by a pair.
  - >-
    Every label is constant on the no-volcano control too. The battery is void
    and the record delivers nothing but an instrument bug report -- which is
    still reported.
  - >-
    A label separates only before C-GAUGE and not after. The separation is a
    model artefact; record it as such and keep it out of the budget.

  confounders:
  - >-
    j ITSELF is a local label and is injective on the class. It must be excluded
    by definition, and the definition must say why: j is the address, so
    admitting it makes the budget claim vacuous. The battery therefore admits
    only labels that are invariant under some group action or that read a
    discrete arithmetic invariant, and each admission is justified in the
    contract rather than assumed.
  - >-
    Labels that are functions of #E (fixed across the class) look constant for a
    trivial reason and must be marked as such rather than counted as evidence for
    (B).
  - >-
    Level labels obtained from a 2-torsion count are circular with battery member
    (1). The independent labeller is blocking.

  interpretation_limits:
  - >-
    TOY SCALE, one class, one p, claim_tier toy. NO ATTACK, NO EXPONENT, NO
    SPEEDUP; sota_delta zero.
  - >-
    The universal form of (B) is NOT established by any battery. The honest
    deliverable is "these eight cheap invariants see only the level, and here is
    the entropy gap", plus forward guidance naming what classes of label remain
    unexamined (labels using O(1) walk steps; labels reading the Galois module
    structure of E[ell] for large ell; labels using the pairing into small
    extension fields).
  - >-
    H-ENDO-001 used, not retested; KN-FIND-b7e091 binding; P2 respected, since no
    factor base is constructed.

  heuristic_assumptions:
  - id: HA-1
    statement: >-
      For a random ordinary class, the number of level strata #div(f) is
      p^{o(1)}; more precisely the expected number of divisors of the conductor
      of t^2 - 4p over t in the Hasse interval is O((log p)^{log 2 + o(1)}).
    rigorous_support: >-
      Rigorous ingredient: f^2 | |D| <= 4p, so f <= 2 sqrt(p) and
      #div(f) <= p^{o(1)} unconditionally by the divisor bound. The distribution
      statement imitates the classical average order of the divisor function for
      integers of a given size, applied to the conductor of a quadratic
      discriminant.
    validation_plan: >-
      Direct sampling, cheap at medium scale: for p at 30, 40 and 50 bits,
      enumerate all t in the Hasse interval, factor D = t^2 - 4p (routine at that
      size), and tabulate the empirical distribution of #div(f) against the
      divisor-function prediction. Tail check: the observed maximum of #div(f)
      over the sample against the predicted extreme value; a heavy tail matters
      because it is exactly the class where local labels are most informative.
  - id: HA-2
    statement: >-
      Each level of an ordinary isogeny class is a single orbit of the horizontal
      isogeny action, so "constant on levels" and "constant on horizontal orbits"
      coincide.
    rigorous_support: >-
      The class group acts simply transitively on each level (Kohel; standard
      volcano structure) [recall-confident, not verified this session]; the only
      assumed part is that the tested small primes generate, which is a GRH-style
      statement about generation and is not needed for the record's negative
      direction.
    validation_plan: >-
      Verify connectivity of each level under horizontal ell-isogenies for
      ell in {3, 5, 7} on the committed class; predicted five components matching
      the five levels. A level splitting under all tested ell is a warning about
      generation, not a refutation.

  target_complexity:
    time_exponent: >-
      No attack exponent claimed or moved. The record BOUNDS a resource: local
      labels supply O(log #div(f)) = o(log p) bits, against the (1/2) log2 p bits
      an address needs, so no walk-plus-label strategy can locate a specified
      vertex faster than the vectorization bound p^{1/4+o(1)}
      [recall-confident: meet-in-the-middle over a class of size h = p^{1/2+o(1)};
      Galbraith-Hess-Smart-style; not verified this session].
    memory_exponent: >-
      O(log p) per vertex for the label; the addressing comparison is against the
      p^{1/4} memory of the meet-in-the-middle vectorization.
    best_known: >-
      For the addressing problem: p^{1/4+o(1)} time and memory classically. For
      the ECDLP: 0.886 sqrt(N) with O(1) memory.
    hidden_overhead: >-
      Granting the factorisation of D to the labeller is a real subexponential
      cost at crypto scale and is granted here only to make the negative
      stronger.
    tradeoff_note: >-
      The budget is memory-free; it constrains information, not storage. If a
      separating label were found, its exploitation would still pay the
      vectorization tradeoff priced in IDEA-20260811-b3a355.

  dominated_by: >-
    As an attack: not an attack, hence dominated by the whole frontier --
    parallel rho at 0.886 sqrt(N), O(1) memory (KN-TECH-001, KN-TECH-006); its
    automorphism-discounted variant (KN-TECH-018); BSGS at sqrt(N)/sqrt(N)
    (KN-TECH-031). As a T5 instrument: dominated by nothing committed; the
    campaign currently has no measurement of local-label information at all.
  sota_delta: >-
    Zero on every attack axis. Against the campaign's own T5 reasoning: replaces
    a qualitative dichotomy with 1.83 measured bits against a 7.11-bit address.

  estimated_cost:
    implementation: medium
    compute: low

  recommended_priority: high

  honest_prior_of_survival: >-
    0.7 that no battery member separates within a level (the budget holds on this
    class). 0.25 that some member separates for a reason that turns out to be a
    model artefact and dies under C-GAUGE. 0.05 that a genuine separation
    survives, which would be the most consequential result available in this
    lane. Filed high because the 0.05 branch is the only cheap route this
    campaign has to reopening T5.

  source_refs:
  - analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md (T5)
  - docs/inventor-protocol.md sections 1-5
  - ledger/proposals/IDEA-20260811-245481.yaml (battery member 1 and its
    predicted 66/72 split)
  - ledger/proposals/IDEA-20260811-5e4cd5.yaml (the exact-level positive control)
  - ledger/proposals/IDEA-20260811-b3a355.yaml (the complementary travel-cost
    repricing)
  - knowledge/findings/KN-FIND-b7e091.md (binding; oracles routed to
    RQ-GGMB-6eaabc)
