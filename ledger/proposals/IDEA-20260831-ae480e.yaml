idea:
  id: IDEA-20260831-ae480e
  question_id: RQ-MLKEM-001
  added: '2026-08-31'
  title: >-
    Excess-kurtosis left-tail check: does the singleton/doublet noise
    heterogeneity's between-class variance-of-||e||^2 fatten the left tail of
    the ciphertext-side error norm beyond what the aggregate-variance-only
    treatment (M0/M1) can ever see -- and is any pinned-package function even
    capable of consuming that, unmodified?
  class: measurement

  claim: >-
    PART 1 (a premise-check this session already performed by direct source
    retrieval, not assumption): direction (ii) ("an instrument extension that
    consumes more than the first two moments of a per-coordinate-varying
    noise model"), read literally as "call some OTHER function already in the
    unmodified pinned lattice-estimator (commit
    3e48ef421ec256afddb3e7d2249a77eab6e9ba12)," is CLOSED. LWEParameters
    (estimator/lwe_parameters.py) declares Xe/Xs as single NoiseDistribution
    fields, resized (self.Xe.resize(self.m)) but never vectorized per
    coordinate -- independently re-confirmed by a direct fetch of the pinned
    commit's raw source in this filing session: the declared fields are
    exactly (n, q, Xs: NoiseDistribution, Xe: NoiseDistribution, m, tag), and
    __post_init__ resizes Xs/Xe as single objects, never per-coordinate.
    Every Xe-attribute use in lwe_dual.py (Xe.stddev, 3 sites), lwe_guess.py
    (Xe.stddev/bounds/is_bounded/gaussian_tail_prob -- genuinely more than
    variance, but still applied via ONE uniform Xe object, never
    per-coordinate), and lwe_bkw.py (Xe.stddev, 2 sites) is consumed
    identically to primal_bdd's own path PREREG-7 already checked: no function
    anywhere in the pinned package can represent a genuinely PER-COORDINATE
    noise model at all, so no EXISTING function can be "called instead."
    PART 2 (the actionable question this closure leaves open, and what this
    idea tests): a standard Gaussian/chi-squared-heuristic BDD cost model
    (which is what primal_bdd IS) depends only on E[||e||^2] -- the AGGREGATE
    variance, which KN-FIND-5e9728 already shows is forced identical between
    M0 and any class-partitioned mixture regardless of instrument. But
    Var(||e||^2) -- a genuinely higher-moment (kurtosis-adjacent) quantity
    describing how MUCH the norm itself fluctuates instance-to-instance -- is
    NOT forced identical: a two-class mixture with unequal per-class variances
    has strictly higher Var(||e||^2) than a homogeneous model at the same mean,
    by the standard mixture-variance decomposition. THE CLAIM UNDER TEST,
    stated as two mutually exclusive, fully decidable outcomes: (A) the ratio
    R = Var_heterogeneous(||e||^2) / Var_homogeneous(||e||^2) exceeds 1.05 at
    ML-KEM-1024 (material heterogeneity-driven left-tail fattening beyond the
    natural n^{-1/2}~3% CLT floor), meaning the aggregate-variance-only
    treatment (M0/M1, and Idea IDEA-20260831-a79df3's own dimension-count
    treatment) MISSES a genuine higher-moment effect on how often an
    atypically short, more attackable error vector occurs -- a positive
    finding motivating, but not itself authorizing, a future patched-cost-model
    or real-lattice follow-up; or (B) R is statistically indistinguishable
    from 1 within this idea's own validated CLT-approximation error margin at
    all three parameter sets -- a clean, complete negative that closes the
    "does more-than-variance matter" question for this specific higher moment,
    at real FIPS 203 scale, honestly. NO ATTACK, NO KEY RECOVERY, NO SECURITY
    CLAIM.

  mechanism: >-
    NOT a resubmission of M0/M1/M2/EXP-MLKEM-18c6e9's construction, and NOT
    the same object as this session's companion idea (IDEA-20260831-a79df3):
    that idea tracks the per-instance COUNT |S(c)| of clean coordinates and
    its effect through the native `m` lever; this idea tracks the SHAPE
    (specifically the variance of the squared-norm statistic) of the
    per-coordinate noise distribution itself, holding the FULL dimension n
    fixed throughout and NEVER calling primal_bdd with a reduced m at all --
    it stays entirely outside KN-FIND-001e68's chaotic m<<n region by
    construction. It reuses the EXACT per-class discrete convolution
    histograms ciphertext_noise_readout.py's build_m0/build_m1 already
    compute (which carry the FULL discrete distribution, not merely its
    second moment) and extracts their FOURTH-moment content (the variance of
    e_i^2) for the first time -- data already produced and reviewed in
    BATCH-a5b13c but never used past its second moment. This is the cheapest
    closed-form instantiation of "an instrument extension consuming more than
    variance" that does not require patching the pinned package at all: it
    computes a purely combinatorial, lattice-compute-free quantity
    (Var(||e||^2)) and translates it into a tail-probability comparison via a
    CLT approximation, explicitly validated (H2) rather than assumed, before
    any claim is drawn.

  object_first_candidate:
    tracked_object: >-
      The PAIR (Var_heterogeneous(||e||^2), Var_homogeneous(||e||^2)) and
      their ratio R -- a second-moment-of-the-squared-norm (fourth-moment-of-
      noise-adjacent) object, genuinely different from M0/M1's own tracked
      object (the FIRST moment/aggregate variance of the noise) and from
      IDEA-20260831-a79df3's own tracked object (the per-instance sample-count
      |S(c)|).
    established_families_off_limits: >-
      M0 (single aggregate marginal), M1 (mixture-then-feed-one-marginal --
      closed, KN-FIND-5e9728), and the m-lever/dimension-count family (M2,
      IDEA-20260831-a79df3) are declared off-limits as this idea's primary
      lens; this idea deliberately targets the SPREAD (not the mean, not the
      sample count) of the per-instance error-norm statistic.
    newness_score: >-
      Genuinely new: no proposal or hypothesis found under RQ-MLKEM-001
      examines any moment of the ciphertext-side noise beyond aggregate
      variance/mean (checked: IDEA-20260814-137f68, IDEA-20260814-8f8f45,
      IDEA-20260814-a609eb, H-MLKEM-11aabf, EXP-MLKEM-18c6e9, KN-FIND-5e9728,
      KN-FIND-001e68 -- all stop at the second moment). This session's own
      direct source-retrieval closure of "call an existing function" is also,
      to the knowledge of this session, new to the ledger (EV-MLKEM-020's
      cross-goal AttributeError finding was about a DIFFERENT question --
      memory charging -- and did not examine per-coordinate Xe representability
      at all).
    testability_score: >-
      High. Fully closed-form; reuses exact Fraction-based arithmetic
      infrastructure already built and reviewed in
      ciphertext_noise_readout.py's build_m0/build_m1; needs one new,
      small, tractable dynamic-programming/exact-convolution routine for the
      toy-scale validation control; no lattice-estimator dependency at all for
      the core result.
    survival_score: >-
      Dissolves at any noise model whose per-class e_i^2 variances happen to
      coincide despite differing means (R=1 despite heterogeneous first
      moments) -- that dissolution is itself a checkable, reportable outcome,
      not merely hypothetical.

  lossy_projection_identifiability_audit:
    projection: >-
      The full n-coordinate noise vector (with per-coordinate class labels
      and full discrete per-class distributions) --> two scalars
      (Var_heterogeneous(||e||^2), Var_homogeneous(||e||^2)) and their ratio R.
    what_is_discarded: >-
      Every individual coordinate's own identity and exact value; only the
      class structure's own AGGREGATE shape statistics (mean and variance of
      the squared norm) survive.
    why_genuinely_lossy: >-
      The entire continuum of possible noise-vector realizations sharing the
      same class fractions (p_s, p_d) and per-class distributions maps to the
      SAME R -- R is a property of the class structure and n alone, not of any
      specific realization.
    why_compatible_with_the_operations: >-
      A BDD/uSVP success-probability calculation under ANY Gaussian/chi-
      squared-heuristic cost model in this family is itself a functional of
      the projected error norm's own distribution (mean AND spread); R is
      exactly the next-order statistic such a tail-aware extension would need
      to consume, matching the operations a genuine higher-moment cost
      extension would perform.
    is_it_only_a_change_of_coordinates: >-
      No. R cannot reconstruct the underlying per-coordinate class assignment
      or the exact noise vector; it is a strictly coarser aggregate summary,
      and it is a DIFFERENT summary from M0/M1's own first-moment collapse and
      from IDEA-20260831-a79df3's own count-based summary.

  novelty_status: unverified

  citations:
    - ref: KN-FIND-5e9728
      provenance: internal
      claim: the forced M0=M1 first-moment (variance) identity for any partitioned mixture fed as one marginal.
      verified_by: this session's direct read of knowledge/findings/KN-FIND-5e9728.md
    - ref: KN-FIND-001e68
      provenance: internal
      claim: primal_bdd's chaotic m<<n behavior -- cited to justify why this idea deliberately stays at full n, never calling a reduced m.
      verified_by: this session's direct read of knowledge/findings/KN-FIND-001e68.md
    - ref: DEC-20260814-b0a095
      provenance: internal
      claim: >-
        names the "instrument extension consuming more than the first two
        moments" direction as licensed but not commissioned.
      verified_by: this session's direct read of ledger/decisions/DEC-20260814-b0a095.yaml
    - ref: EV-MLKEM-020
      provenance: internal
      claim: >-
        under this SAME pinned commit, `dual` raises AttributeError at
        estimator/prob.py:213 and `primal_hybrid` raises ZeroDivisionError in
        the Sage-free harness (a different goal/question, memory-charging,
        but the same instrument/pin) -- cross-confirms that calling an
        existing "other" attack function in this harness is fragile even
        before the per-coordinate-representability question is asked.
      verified_by: this session's direct read of ledger/evidence/EV-MLKEM-020.yaml
    - ref: malb/lattice-estimator@3e48ef421ec256afddb3e7d2249a77eab6e9ba12:estimator/lwe_parameters.py
      provenance: retrieved
      claim: "LWEParameters.Xe/Xs are single NoiseDistribution fields (n, q, Xs, Xe, m, tag), resized via resize(), never vectorized per coordinate."
      verified_by: >-
        this session's own WebFetch of the raw pinned-commit source,
        2026-08-31, independently RE-VERIFIED by the orchestrating session's
        own separate WebFetch of the same raw URL on the same date, which
        confirmed the identical field list and resize() behavior verbatim.
    - ref: malb/lattice-estimator@3e48ef421ec256afddb3e7d2249a77eab6e9ba12:estimator/lwe_dual.py
      provenance: retrieved
      claim: "Only Xe.stddev is read (3 sites: lines ~104, 247, 408); Xs.hamming_weight/is_sparse/split_balanced/stddev used for the SECRET, not Xe."
      verified_by: this session's own WebFetch of the raw pinned-commit source, 2026-08-31
    - ref: malb/lattice-estimator@3e48ef421ec256afddb3e7d2249a77eab6e9ba12:estimator/lwe_guess.py
      provenance: retrieved
      claim: "Xe.stddev, Xe.bounds, Xe.is_bounded, Xe.gaussian_tail_prob are read (more than variance), but always via one uniform Xe object, never per-coordinate; InsufficientSamplesError guards on m vs a required count exist in ExhaustiveSearch/MITM/Distinguisher."
      verified_by: this session's own WebFetch of the raw pinned-commit source, 2026-08-31
    - ref: malb/lattice-estimator@3e48ef421ec256afddb3e7d2249a77eab6e9ba12:estimator/lwe_bkw.py
      provenance: retrieved
