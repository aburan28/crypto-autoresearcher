  assumptions:
    - >-
      N odd prime, N EXACTLY dividing #E(F_p), E ordinary, p > 3. Exact
      divisibility is load-bearing for (A) and (B); the full-rational-torsion
      case N^2 | #E is the nearby object (IDEA-20260901-fac74a) where k = 1
      occurs with N split.
    - >-
      D_0 is the FUNDAMENTAL discriminant of the CM field; v and the conductor
      of End(E) are distinguished throughout, because the divisibility
      statements differ.
    - >-
      The equidistribution model in (C) is IDEA-20260811-8783a5's and is a
      heuristic (H1 below); (A) and (B) do not depend on it.
    - >-
      Toy scale for the enumeration (p <= 2^22); the 256-bit sampler measures
      (N, k) pairs and not curves, and transfers to curves only through
      Deuring-Waterhouse existence, which is exact.

  resource_label: >-
    R7 (pairings into F_{p^k}) in scoping mode, composed with R3 (End(E) as a
    ring - the splitting type of N in K is a ring datum invisible to G). The
    record maps where the R7 precondition can hold on CM families and mounts
    no transfer.
  admissibility: admissible
  admissibility_argument: >-
    Admissible - the embedding degree and the Kronecker symbol are
    representation-level integers, not group-operation outputs, so
    KN-FIND-b7e091 does not cover them, and no endomorphism is applied to any
    point of G. The expected finding supports no attack.

  proof_search_map:
    bottleneck: >-
      The step 'N divides D_0 v^2 exactly once' in (A). It uses only exact
      divisibility of #E by N and N | t - 2, and it is the step that converts
      a congruence on the trace into a statement about the CM FIELD rather
      than about the conductor. Everything else is substitution.
    baseline_embedding:
      parameter_slice: >-
        D_0 of size about 4p (v = 1, the generic class). Then (A) reads
        'k = 1 with exact divisibility needs N | D_0', which is satisfiable and
        reproduces the trace-two family p - 1 = |D_0| / 4 of H-PAIR-713241's
        k = 1 branch; (B) reads '(D_0/N) = +1 for k >= 2', which is
        Balasubramanian-Koblitz's realisability condition in disguise.
      reproduction_check: >-
        Symbolic, plus a frozen fixture: one trace-two toy curve with
        N exactly dividing p - 1 on which N | D_0 is verified by factoring
        t^2 - 4p, and IDEA-20260807-e7eb5d's gate G4 confirms the primitive
        Tate self-pairing there.
    observation_collision:
      observable: >-
        The pair (splitting type of N, k) together with the tail fraction at
        a given B.
      distinct_preimage_search: >-
        REQUIRED and EXPECTED TO SUCCEED: many curves with different j, class
        number and volcano level share one (splitting type, k). That is the
        content - the observable is a function of (D_0, N, p) only - and it
        is why a CM-conditioned conclusion beyond (B) is impossible at fixed
        (D_0, N, p). The post-selection test is the operational form of this
        collision.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace 'which CM families have small k' by the arithmetic
          predicate pair (N | D_0) for k = 1 and ((D_0/N) = +1) for k >= 2,
          plus one constant c(D_0, B).
        predicted_gain: >-
          Converts a family-by-family scoping question into two one-line
          tests per curve and one density computation, with the residual
          made measurable.
      - transform: observable_fiber
        proposed_object: >-
          The fibre of (splitting type, k) over (split, k <= B) at fixed p,
          compared between the CM family and the post-selected null.
        predicted_gain: >-
          Isolates any CM effect on k that is NOT the splitting condition;
          predicted empty.
    quantifier_order: >-
      (A): FOR ALL ordinary E/F_p, FOR ALL odd primes N exactly dividing
      #E(F_p), k = 1 IMPLIES N | D_0. (B): under the same quantifiers, N not
      dividing D_0 IMPLIES (D_0/N) = +1 (and k >= 2). (C): FOR ALL D_0 and B,
      THERE EXISTS a constant c(D_0, B) such that the tail ratio is at most
      c, and (heuristic) equals 1 after post-selection. NOT CLAIMED: anything
      about N^2 | #E, anything about supersingular curves, and any statement
      at fixed (N, p) beyond 653dda's.
    method_ceiling:
      strongest_certifiable_claim: >-
        'On CM families with fixed fundamental discriminant, k = 1 never
        occurs on exact-prime-order subgroups above |D_0|, and the small-k
        tail for k >= 2 differs from the random-curve tail by at most the
        splitting-conditioning constant, with zero residual at the tested
        scales.' It certifies nothing about the cost of MOV, nothing about
        curves with N^2 | #E, and nothing about ECDLP hardness.
      nearby_object_control: >-
        Two. The trace-two random-D_0 curve, where k = 1 with exact
        divisibility DOES occur and (A) must be seen to bite through N | D_0;
        and the full-rational-torsion j = 0 curve of IDEA-20260901-fac74a,
        where k = 1 occurs with N SPLIT because exact divisibility fails. An
        argument that forbids k = 1 on either has proved too much.
    proof_obligations:
      - claim: >-
          k = 1 and N exactly dividing the group order imply N divides D_0
          and N does not divide v.
        responsibility: correctness
      - claim: >-
          N not dividing D_0 and N exactly dividing the group order imply N
          does not divide v and N splits in K.
        responsibility: correctness
      - claim: c(D_0, B) is computable from Dirichlet densities and is bounded in D_0 for fixed B.
        responsibility: size
      - claim: The trace-two nearby object shows k = 1 with N | D_0.
        responsibility: baseline
      - claim: The tail difference vanishes under post-selection at every field size.
        responsibility: success_probability
      - claim: Every (N, k) row records p, t, v, D_0, the Kronecker symbol and the certification of k.
        responsibility: scope

  object_first_candidate:
    tracked_object: >-
      The pair (splitting type of N in K, k = ord_N(t - 1)).
    lossiness: >-
      Lossy - the curve, the point, j, the class number and the volcano
      position are discarded; retained are one symbol and one divisor of
      N - 1. Not a change of coordinates.
    propagation: >-
      Exactly constant under every F_p-isogeny of degree prime to N, because
      both entries are functions of (D_0, t, p, N), all class invariants.
    survival_score: >-
      Survives the whole isogeny class by identity. Dissolves only when the
      family is changed (different D_0), which is the axis the record sweeps.

  null_object_control: >-
    NULL-1 (blocking, primary): random traces in the Hasse window at the same
    p, same bookkeeping, same sample size - the matched random-curve null the
    RQ mandates. NULL-2 (blocking, the removal test): NULL-1 rows
    post-selected on (D_0/N) = +1; the CM-minus-NULL-2 difference must be
    zero within the binomial interval at every field size. DECAY PARAMETER:
    field size (p in 2^16, 2^19, 2^22 at toy; 2^256 in the sampler) - a
    difference that does not vanish under post-selection AND persists across
    sizes is the lead branch; one that is flat, or appears at one size only,
    is an artifact under docs/inventor-protocol.md section 3. POSITIVE
    CONTROL A (blocking): trace-two curves in NULL-1 with k = 1 must show
    N | D_0 in 100 percent of cases. POSITIVE CONTROL B (blocking): the
    IDEA-20260901-fac74a curve must show k = 1 with N split and N^2 | #E,
    proving the exact-divisibility hypothesis is what the instrument tests.
    INSTRUMENT CHECK: k computed two ways (ord_N(p) and ord_N(t - 1)) must
    agree on every row.

  discriminated_from:
    - >-
      IDEA-20260807-653dda. That record fixes (N, p) and shows k does not
      depend on CM data. This record fixes D_0 and lets p vary over the
      family; the delta is (A), (B) and the constant c(D_0, B), none of which
      is visible at fixed (N, p).
    - >-
      IDEA-20260811-8783a5. That record counts the tail at fixed N over
      traces. This record conditions on D_0 and derives the induced condition
      on N; the delta is the Kronecker conditioning and the removal test.
    - >-
      IDEA-20260807-6c7540. That record samples (N, t) pairs at 256 bits.
      This record adds the CM equation to the sampler ((t, v) pairs at fixed
      D_0) and the post-selected null; the delta is one equation and one
      control.
    - >-
      H-PAIR-713241 and IDEA-20260807-30868b. Those establish k = 1 as the
      self-pairing boundary and the corollary t = 2 for large N. This record
      shows the boundary is EMPTY on small-|D_0| families by ramification,
      which is a sharper and D_0-explicit statement, and corrects boolean (i)
      from disc(End(E)) to D_0 under exact divisibility.
    - >-
      H-PAIR-27e16a. That record characterises the exceptional case and notes
      the Jordan-block case is not an exception. This record locates the
      Jordan-block case with exact divisibility at ramified N - (A3).
    - >-
      KN-FIND-009. That finding uses 'N = 1 mod 3 forced' for the witness
      lattice on j = 0. This record uses the general splitting statement for
      the k-tail across all small D_0.

  predictions:
    - metric: >-
        M1 - number of CM-family rows (D_0 in {-3, -4, -7, -8, -11},
        p <= 2^22, N odd exactly dividing #E, N > max(|D_0|, 2^8)) with k = 1
      direction: lower
      minimum_effect: >-
        EXACTLY ZERO, no tolerance. One row with k = 1 refutes (A) or the
        instrument; the instrument is the first suspect and the row's
        t^2 - 4p is factored before anything is reported.
    - metric: >-
        M2 - fraction of NULL-1 rows with k = 1 (exact divisibility) for
        which N divides D_0
      direction: higher
      minimum_effect: >-
        100 percent, and the count of such rows must be strictly positive
        (POSITIVE CONTROL A) or the pipeline cannot see k = 1 and M1 is void.
    - metric: >-
        M3 - fraction of CM-family rows with k >= 2 for which (D_0/N) = +1
      direction: higher
      minimum_effect: >-
        100 percent, no tolerance; a single split failure refutes (B) or the
        instrument.
    - metric: >-
        M4 - tail ratio T_CM(B) / T_NULL1(B) at B in {6, 12}, per D_0, per
        field size, where T is the fraction of rows with k <= B
      direction: higher
      minimum_effect: >-
        In [1, c(D_0, B)] with c computed in advance from densities and
        recorded before the enumeration runs; a ratio above c(D_0, B) by more
        than the binomial interval at two sizes is INCONCLUSIVE pending the
        removal test. BASIS: derivation in (C); an UNTESTED expectation.
    - metric: >-
        M5 - tail ratio T_CM(B) / T_NULL2(B) after post-selection on
        (D_0/N) = +1
      direction: different
      minimum_effect: >-
        EQUAL TO 1 within the binomial interval at every D_0 and every field
        size. A ratio above 1 surviving three sizes is the LEAD branch and
        triggers independent review; a ratio below 1 is an instrument or
        bookkeeping error.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, hard gate): (A) and (B) written and checked on
      the two nearby objects; c(D_0, B) computed from densities and frozen.
      STAGE 1 (hours): the toy enumeration over five D_0 values at three field
      sizes, with NULL-1 and NULL-2; M1-M5 reported per cell. STAGE 2
      (hours): the 256-bit (t, v) sampler, at least 10^5 accepted rows per
      D_0, k exact where N - 1 factors and otherwise certified above B; M3-M5
      only. STAGE 3: the removal test across sizes; the lead branch, if it
      fires, is routed to review and nothing is interpreted. NO CURVE IS
      CONSTRUCTED and no attack is run. THE CHEAPEST DECISIVE STEP IS M1 PLUS
      M2 at one field size: minutes, and it decides (A) with its nearby object
      in the same run.
    controls:
      - NULL-1 matched random traces at the same p (blocking)
      - NULL-2 post-selected on (D_0/N) = +1, the removal test (blocking)
      - POSITIVE CONTROL A, trace-two rows with k = 1 showing N | D_0 (blocking)
      - POSITIVE CONTROL B, the fac74a full-rational-torsion curve showing k = 1 with N split (blocking)
      - two-way computation of k on every row (instrument check)
      - Pollard rho with distinguished points and BSGS on a sample of the enumerated toy classes as the mandatory matched baselines, automorphism-discounted rho where j is 0 or 1728 (KN-TECH-006, KN-TECH-018, KN-TECH-031); they calibrate cost and are not expected to move
      - exclusion of anomalous and smooth-N rows per KN-TECH-034
    required_metrics:
      - per row p, t, v, D_0, N, the Kronecker symbol, k and its certification method
      - M1 through M5 per (D_0, field size) with exact binomial intervals
      - the frozen c(D_0, B) values and their derivation
      - pass or fail of every control
      - wall-clock and peak memory per stage

  falsification_conditions:
    - >-
      F1. A CM-family row with exact divisibility, N > |D_0| and k = 1. (A) is
      false or the instrument is; the record stops until the row's t^2 - 4p
      is factored by hand.
    - >-
      F2. A NULL-1 row with k = 1, exact divisibility, and N not dividing
      D_0. Same status as F1.
    - >-
      F3. A CM-family row with k >= 2 and (D_0/N) = -1. (B) is false or the
      instrument is.
    - >-
      F4. M5 above 1 beyond the interval at three field sizes. (C) is false:
      CM structure affects k beyond splitting. LEAD branch; independent
      review mandatory before interpretation.
    - >-
      F5. POSITIVE CONTROL A empty. The pipeline cannot see k = 1 and every
      M1 negative is void.
    - >-
      F6. Budget exhaustion. Infrastructure outcome under AGENTS.md rule 5.

  confounders:
    - >-
      Non-exact divisibility leaking in. A row with N^2 | #E is the nearby
      object, not a data point; the enumeration must test exact divisibility
      explicitly rather than 'N | #E'.
    - >-
      Twist bookkeeping. At fixed (D_0, p) the class has |Aut| twists with
      different traces; each is a separate row and none may be double counted
      or dropped, since the twist with the wanted N is often not the one first
      written down.
    - >-
      Small-N contamination. At toy p the primes N are small, so the divisor
      structure of N - 1 is coarse and c(D_0, B) computed from asymptotic
      densities is only approximately right; the threshold N > 2^8 and the
      three field sizes are the defence, and the 256-bit sampler is the real
      test of (C).
    - >-
      Reading (A) as 'k = 1 is impossible'. It is impossible on small-|D_0|
      families with exact divisibility; it is common on trace-two curves with
      D_0 of size p, and IDEA-20260807-98a970's audit of deployed curves must
      not be read through this record.

  interpretation_limits:
    - >-
      A scoping measurement plus two elementary theorems. It moves no
      exponent, mounts no attack, and changes no curve's security; it says
      where the R7 precondition can and cannot hold on CM families.
    - >-
      Scoped to ordinary prime-field curves, odd N exactly dividing the group
      order, and the five tested D_0 values; nothing about supersingular
      curves, extension fields, or N^2 | #E.
    - >-
      (C) and the removal test are heuristic-conditional (H1) and toy-tier;
      the 256-bit sampler measures (N, k) pairs, and its transfer to curves
      rests on Deuring-Waterhouse existence only.
    - >-
      Evidence from any run is capped at claim_tier toy.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For fixed fundamental discriminant D_0 and p ranging over primes
        splitting in K with p <= X, the residue t - 1 mod N over the CM-family
        rows with N exactly dividing #E and N > X^{1/2} behaves, with respect
        to its multiplicative order, like a uniformly random residue mod N
        CONDITIONED ON (D_0/N) = +1 - so that P(k = d) = (1 + o(1)) phi(d) /
        (N - 1) for each d | N - 1 with d <= B, uniformly for B <= (log X)^2.
      rigorous_support: >-
        The rigorous ingredients are (B) (the conditioning is a theorem, not
        an assumption) and the Hasse-window count of IDEA-20260811-8783a5
        (at most B^2 / 2 residues of order at most B). The distributional
        statement imitated is the classical order-of-a-residue law
        (Erdos-Murty 1999 as invoked by IDEA-20260807-6c7540: the order of a
        fixed integer modulo N exceeds N^{1/2 + eps} for almost all N), with
        the Chebotarev/Dirichlet density 1/2 for (D_0/N) = +1 supplying the
        conditioning weights. H1 asserts only that the CM-family residues
        carry no further bias.
      validation_plan: >-
        SAMPLE: the toy enumeration (all rows at p <= 2^22, five D_0 values)
        and the 256-bit (t, v) sampler with at least 10^5 accepted rows per
        D_0. SHORTCUT MAKING 256-BIT SAMPLING FEASIBLE: the CM equation
        p = (t^2 + |D_0| v^2) / 4 plus Deuring-Waterhouse existence, so no
        curve is built (the same shortcut as IDEA-20260807-6c7540 with one
        more equation). COMPARISON DISTRIBUTION: the empirical distribution
        of k over d | N - 1, d <= B, against phi(d) / (N - 1) conditioned on
        the observed N, by chi-squared; and the tail fraction against the
        post-selected null NULL-2. TAIL CHECK: the smallest k observed per
        cell against its predicted extreme probability times the number of
        rows. SAMPLED PARAMETERS RECORDED: D_0, p or its size, t, v, N, the
        Kronecker symbol, k, seed. TRANSFER ASSUMPTION, STATED: none beyond
        Deuring-Waterhouse; H1 is validated only at the sampled sizes and
        licenses no statement at others.

  target_complexity:
    time_exponent: >-
      NO NEW ALGORITHM AND NO EXPONENT CLAIMED. Of the routes priced, MOV at
      k <= B_* costs L_{p^k}(1/3) plus the pairing (IDEA-20260807-5f24d7),
      available on a CM family with probability O(c(D_0, B_*) B_*^2 / N) per
      curve, i.e. never on a curve of interest; the standing exponent 1/2
      (rho) is unchanged.
    memory_exponent: >-
      O(1) for the enumeration and the sampler beyond a table of rows; no
      attack memory is charged because no attack is run.
    best_known: >-
      Parallel rho with distinguished points and negation at 0.886 sqrt(N)
      time and O(1) memory (KN-TECH-006); automorphism-discounted rho on
      j = 0 and j = 1728 at most sqrt(6) better (KN-TECH-018); BSGS at
      2 sqrt(N) time and sqrt(N) memory (KN-TECH-031); MOV/Frey-Ruck when k
      is small (KN-TECH-032); the anomalous transfer (KN-TECH-033).
    hidden_overhead: >-
      None in (A) and (B). In (C), c(D_0, B) is computed from asymptotic
      densities and its finite-N accuracy is the disclosed slack; B_* is
      inherited UNCALIBRATED from 5f24d7 and the tail is therefore reported
      as a function of B rather than at one B.
    tradeoff_note: >-
      Not applicable; no algorithm is produced.

  dominated_by: >-
    AS AN ATTACK: none is mounted; checked row by row and dominated on every
    axis by parallel rho with negation (0.886 sqrt(N), O(1) memory,
    KN-TECH-006), automorphism-discounted rho on CM curves (KN-TECH-018),
    BSGS (2 sqrt(N), sqrt(N) memory, KN-TECH-031), Pohlig-Hellman
    (KN-TECH-030), generic preprocessing at S T^2 = N, and MOV/Frey-Ruck and
    the anomalous transfer on their own families (KN-TECH-032, KN-TECH-033).
    Data/query axis: no oracle queries, no solve. AS A SCOPING RESULT:
    dominated on generality by Balasubramanian-Koblitz (KN-LIT-086) and,
    plausibly, by the recalled Luca-Shparlinski counts at fixed D, which were
    not opened; not dominated inside this corpus on (A), (B) or the removal
    test.
  sota_delta: >-
    +0 on time, +0 on memory, +0 on data/queries. Quantified deltas claimed:
    (i) k = 1 with exact divisibility shown IMPOSSIBLE on every CM family
    above N = |D_0| - on j = 0 and j = 1728 for every odd N >= 5 - by a
    four-line ramification argument, which empties the lane's one-point
