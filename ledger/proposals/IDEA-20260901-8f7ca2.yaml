idea:
  id: IDEA-20260901-8f7ca2
  question_id: RQ-PAIR-21313f
  goal_id: GOAL-ENDO-001
  added: '2026-09-01'
  title: >-
    THE CM SMALL-EMBEDDING-DEGREE TAIL IS PINNED FROM BOTH ENDS - (A) embedding
    degree ONE on a subgroup of EXACT prime order N forces N to RAMIFY in the
    CM field (N | D_0), so on any CM family with fixed fundamental
    discriminant every N > |D_0| has k >= 2, and on j = 0 and j = 1728 the
    one-point Frey-Ruck self-pairing never exists on an exact-prime-order
    subgroup at all; (B) for k >= 2 the ONLY constraint CM structure places on
    the subgroup is that N SPLITS, (D_0/N) = +1, whose uplift on the tail
    P(k <= B) is a computable constant c(D_0, B) and nothing more; the
    residual after post-selecting the matched random-curve null on the
    splitting condition is predicted EXACTLY ZERO, measurable at toy scale by
    isogeny-class enumeration and at 256 bits by a (t, v) CM-equation sampler
    that constructs no curve
  class: measurement

  claim: >-
    Setting: E/F_p ordinary, t its trace, t^2 - 4p = D_0 v^2 with D_0 the
    fundamental discriminant of K = End(E) tensor Q, N an odd prime with
    N EXACTLY dividing #E(F_p) = p + 1 - t, k = ord_N(p) = ord_N(t - 1).

    (A) RAMIFICATION THEOREM FOR k = 1, elementary and exact. If k = 1 then
    p = 1 mod N, so t = 2 mod N. Write D_0 v^2 = (t - 2)^2 - 4 #E(F_p).
    N^2 divides (t - 2)^2 and N divides 4 #E EXACTLY ONCE, so N divides
    D_0 v^2 EXACTLY ONCE. Hence N | D_0 and N does not divide v. In words: k = 1
    with exact divisibility forces N to ramify in the CM field. CONTRAPOSITIVE,
    which is the CM-family statement: if N does not divide D_0 then k >= 2.
    COROLLARIES. (A1) On a CM family with fixed fundamental discriminant
    D_0, every exact-prime-order subgroup with N > |D_0| has k >= 2; the
    one-point Frey-Ruck self-pairing of H-PAIR-713241's k = 1 branch does not
    exist on it. (A2) On j = 0 (D_0 = -3) and j = 1728 (D_0 = -4) it never
    exists for any odd N >= 5. (A3) The Jordan-block configuration of
    H-PAIR-27e16a (k = 1, rational N-torsion cyclic, N exactly dividing #E)
    exists ONLY at primes N ramified in K, which for D_0 of size about 4p is
    common (the trace-two class p - 1 = |D_0| v^2 / 4 supplies them) and for
    small |D_0| is impossible above |D_0|. This sharpens H-PAIR-713241's
    corollary 'N > 2 sqrt(p) + 2 forces t = 2' to a statement about D_0 that
    holds for every N, and it corrects the reading of that record's boolean
    (i) 'N | disc(End(E))' to 'N | D_0', which is what the exact-divisibility
    hypothesis actually yields (N cannot divide the conductor, because N does
    not divide v).

    (B) SPLITTING THEOREM FOR k >= 2, elementary and exact. Suppose N does not
    divide D_0. Then N does not divide v (else N^2 | D_0 v^2 = (t-2)^2 - 4#E
    together with N | 4#E gives N | t - 2, hence N^2 | 4#E, contradicting
    exact divisibility). So pi - 1 = ((t - 2) + v sqrt(D_0)) / 2 is not
    divisible by N in O_K, while N divides its norm #E. N is not ramified by
    hypothesis, and N inert would force N | pi - 1. Therefore N SPLITS in K:
    (D_0/N) = +1. For D_0 = -3 this is N = 1 mod 3, for D_0 = -4 it is
    N = 1 mod 4, for D_0 = -7 it is N a quadratic residue mod 7, for D_0 = -8
    it is N = 1 or 3 mod 8, for D_0 = -11 it is N a quadratic residue mod 11.
    This is the classical fact behind pairing-friendly constructions (the
    ideal (N, pi - 1) is a degree-one prime of O_K), already recorded for
    j = 0 in KN-FIND-009 as 'N = 1 mod 3 is forced'; what is new here is its
    use as the ONLY CM-specific constraint on the k-tail, stated with its
    complement (A).

    (C) WHAT (B) DOES TO THE TAIL, and what it cannot do. k | N - 1 always. The
    splitting condition changes the divisor structure of N - 1: for D_0 = -3
    it forces 3 | N - 1 (probability 1 instead of 1/2 among random primes),
    for D_0 = -4 it forces 4 | N - 1 (1 instead of 1/2). Under the
    equidistribution model of IDEA-20260811-8783a5 (t - 1 mod N behaves like
    a uniform residue conditioned on the Hasse window), P(k = d | d | N - 1)
    is about phi(d) / (N - 1), so the small-k tail at fixed D_0 is
    UPLIFTED by the computable constant
      c(D_0, B) = E[ sum_{d <= B, d | N-1} phi(d) | (D_0/N) = 1 ]
                / E[ sum_{d <= B, d | N-1} phi(d) ],
    an expectation over primes N computable from Dirichlet densities alone.
    For B = 6 and D_0 = -3 the availability of d = 3 and d = 6 doubles, so
    c(-3, 6) is between 1 and 2; for every D_0 and B, c(D_0, B) is bounded by
    a constant depending on B only. THE CLAIM: this uplift is the ENTIRE
    CM-specific effect on the k-tail. PREDICTION: post-selecting the matched
    random-curve null on (D_0/N) = +1 removes the difference completely. A
    residual uplift surviving post-selection, reproduced across three field
    sizes, would be a CM effect on k beyond splitting - it would contradict
    IDEA-20260807-653dda's independence claim and is the one outcome of this
    record that would reopen the lane's headline.

    (D) THE EXPLOITABILITY BOUND, stated with the crossover. Let B_* = B_*(p)
    be the largest k at which the three-branch transfer cost of
    IDEA-20260807-5f24d7 is below matched rho (its UNCALIBRATED value is
    reported as an interval there). Under (C) the fraction of CM-family
    curves at fixed small D_0 with N > sqrt(p) and k <= B_* is at most
    c(D_0, B_*) times the random-curve fraction, which is about
    B_*^2 / (2 N) per curve (8783a5). No exponent moves: the CM family is
    exploitable through R7 with probability O(B_*^2 / N) times a bounded
    constant, exactly like a random curve.

  mechanism: >-
    THE TRACKED OBJECT is the pair (splitting type of N in K, k), a projection
    of the instance that discards the curve, the point, the class number and
    the volcano position, retaining one symbol in {split, ramified, inert}
    and one divisor of N - 1. It is exactly compatible with F_p-isogenies of
    degree prime to N (both entries are class invariants: D_0, t, p, N are
    fixed by the class, IDEA-20260807-b92080), so it propagates trivially
    under the campaign's operation set, which is why the lane is a scoping
    lane per T3 of DECOMPOSITION.md. It is genuinely lossy - no curve is
    recoverable from it - and it is not a change of coordinates.

    WHY BOTH ENDS. The lane's existing records establish that k is a function
    of (N, p) (653dda), that small k is rare at a given N (8783a5), that the
    distribution of k is samplable at cryptographic size (6c7540), and that
    k = 1 is where the one-point self-pairing lives (30868b, 713241). None of
    them says what CM structure does to the JOINT distribution of (N, k) when
    D_0 is fixed and p varies over the family, which is the RQ's literal
    question. (A) says the k = 1 end is empty on the family; (B)-(C) say the
    k >= 2 end is the random distribution conditioned on one Kronecker symbol.

    STAGE 0 (zero compute, hard gate). Write (A) and (B) and check them
    against the nearby objects where each must FAIL to apply: for (A), the
    trace-two random-D_0 curves, where k = 1 with N exactly dividing #E DOES
    occur and N | D_0 must be observed every time; for (B), the ramified case
    N | D_0, where the splitting conclusion is vacuous. An argument that
    cannot see k = 1 on trace-two curves has mis-stated exact divisibility.

    STAGE 1 (toy enumeration, hours). For D_0 in {-3, -4, -7, -8, -11} and
    every prime p <= 2^22 splitting in K, solve 4p = t^2 + |D_0| v^2, list all
    traces of the class and its twists, factor #E, record every (N, k) with N
    odd, N exactly dividing #E, N > max(|D_0|, 2^8). This constructs no curve:
    Deuring-Waterhouse guarantees the class exists. Matched null: for each p,
    random traces in the Hasse window (equivalently random curves), same
    bookkeeping, same size. Post-selected null: the random rows with
    (D_0/N) = +1.

    STAGE 2 (the 256-bit sampler, hours). The shortcut of
    IDEA-20260807-6c7540 extended by the CM equation: sample integers (t, v)
    with t = v mod 2 and p = (t^2 + |D_0| v^2) / 4 a 256-bit prime, set
    #E = p + 1 - t, keep those whose largest prime factor N exceeds 2^128,
    compute k exactly when N - 1 factors and otherwise certify k > B. No
    curve is constructed and none needs to be. Same two nulls.

    STAGE 3 (decay / removal test). The CM-minus-null tail difference must be
    positive before post-selection, bounded by c(D_0, B), and ZERO after
    post-selection, at every field size. A difference that survives
    post-selection is the LEAD branch and is routed to independent review
    before any interpretation.

  novelty_status: unverified

  novelty_screen:
    method: >-
      KB RETRIEVAL WAS UNAVAILABLE THIS SESSION (':memory:', empty index,
      verified by the orchestrator); search_knowledge was NOT called. Direct
      reading 2026-09-01 of the 13 RQ-PAIR-21313f proposals (full reads of
      df5984, e7eb5d, 5f24d7, 40aab9; claim sections of 30868b, 464ff8,
      653dda, 6c7540, 8783a5), H-PAIR-27e16a, H-PAIR-713241, KN-FIND-009,
      KN-LIT-086, KN-TECH-018, KN-TECH-032, DECOMPOSITION.md. Greps over
      ledger/, knowledge/, ideas/ for 'splits in K', 'Kronecker symbol',
      'N = 1 mod 3', 'Luca', 'Shparlinski', 'MNT', 'Cocks-Pinch', 'Pell',
      'low embedding degree'. No web source was opened for this record.
    results: >-
      KN-FIND-009 and EV-ENDO-001 record 'N = 1 mod 3 is forced' for j = 0
      via the eigenvalue argument; H-PAIR-713241 records the equivalence of
      N | disc(End(E)) with k = 1 and the corollary t = 2 for
      N > 2 sqrt(p) + 2; IDEA-20260807-653dda records k = ord_N(t - 1) and
      the construction-versus-causation table; IDEA-20260811-8783a5 records
      the tail count 2B^2 / sqrt(N) at fixed N; IDEA-20260807-6c7540 records
      the (N, t) sampler. NO record states the ramification theorem (A), the
      splitting theorem (B) as a constraint on the k-tail, the uplift constant
      c(D_0, B), or the post-selection removal test. KN-LIT-086
      (Balasubramanian-Koblitz) is the corpus's genericity entry and is
      consistent with (D). Luca-Shparlinski's 'Elliptic curves with low
      embedding degree' and Urroz-Luca-Shparlinski on MNT statistics are the
      nearest external works (RECALLED, not opened); they count low-k curves
      by Pell-type arguments at fixed D and may contain (A) or (B) in some
      form.
    verdict: >-
      UNVERIFIED. (A) and (B) are four-line consequences of the CM equation
      and are almost certainly known to specialists in some form; the corpus
      does not contain them. No external source was opened, so no stronger
      label is available.

