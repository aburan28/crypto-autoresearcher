idea:
  id: IDEA-20260901-80308d
  question_id: RQ-ECTD-001
  goal_id: GOAL-ECTD-001
  added: '2026-09-01'
  title: >-
    THE PUBLIC LIMB OF GOAL-ECTD-001 IS FREE AND THE PRIVATE LIMB IS
    EVERYTHING: the class walk of IDEA-20260805-4243e6 costs
    H * (c_test + c_step) >= 0.4 * (c_test + c_step) * matched-rho at typical
    class size, so it never beats rho by more than the constant
    2.5/(c_test + c_step) < 1 -- detection of the trapdoor, chain length and
    recognition cost are constant-factor levers at most, and the only public
    threats are IDENTIFICATION SHORTCUTS, which this record enumerates
    (level-defined weaknesses: reached without search and connected below
    rho; coset-structured weak sets: p^{1/4}; class-invariant weaknesses:
    O(1); genus-character leakage: a 2-rank constant); a sub-rho weakness
    that varies within the floor Cl(Z[pi])-torsor with no public fingerprint
    is rho-hard to locate FOR FREE, and exhibiting one is the whole remaining
    question
  class: mechanism

  claim: >-
    Let E_pub/F_p be ordinary with prime subgroup order N ~ p, trace t, and
    let a designer hide a secret F_p-isogeny to an endpoint E_s in the class
    whose ECDLP has private cost c_exploit = p^{(1 - delta)/2 + o(1)} for some
    delta > 0 (the hypothetical private limb). GOAL-ECTD-001's completion
    criterion demands, on the public side, that 'public path search and
    public detection remain at least matched-rho hard'. Five statements.

    (P1) THE WALK FLOOR. The public attacker's only route to E_s that does not
    presuppose its identity is the class walk of IDEA-20260805-4243e6 /
    H-ECTD-3dbda5 L3: visit the class, test each curve, keep the chain. Its
    cost is C_walk = H * (c_test + c_step) with H = H(4p - t^2). By
    H-ECTD-3dbda5 L2 the mean class size is sqrt(p)/2 and the observed
    maximum about 2.5 sqrt(p), against C_rho = 1.2533 sqrt(N). Hence
        C_walk / C_rho  =  0.4 * (c_test + c_step)   at the mean,
                        =  2.0 * (c_test + c_step)   at the maximum,
    and the walk is CHEAPER than rho only when c_test + c_step < 2.5 group
    operations -- fewer than one Velu step. For every real test and step the
    public attacker's best option is rho, and the designer's public limb is
    satisfied with margin 0.4 (c_test + c_step) >= 1 at typical class size
    WITHOUT any property of the weakness, the path, or the endpoint. 4243e6
    read this same arithmetic as a 'zero-exponent security margin' and
    redirected the design target to a recognition/exploitation asymmetry;
    (P1) says the redirection is unnecessary: the asymmetry is not a lever
    because the walk is never the binding public attack. Toy-scale caveat,
    stated at once: 3dbda5's own median exponents (0.79, 0.85, 0.87 at
    p = 10^4, 10^5, 10^6) mean that at TOY p a median class is p^{0.4}-ish
    and the walk can beat rho by up to p^{0.1}/(c_test + c_step); the
    asymptotic statement rests on the ineffective Siegel bound and is
    labelled so wherever it appears.

    (P2) THE NON-LEVERS. Consequently three quantities the lane currently
    treats as security parameters do not enter the public limb beyond a
    constant: (i) DETECTABILITY of the trapdoor's existence
    (IDEA-20260815-459d2d): a public curve known to be trapdoored is still
    rho-hard, because knowing that E_s exists is not knowing which curve it
    is; (ii) CHAIN LENGTH (IDEA-20260815-63f03f, IDEA-20260815-8dcde2): the
    attacker never retraces the designer's chain -- it either walks its own
    (P1) or, once E_s is identified, connects by Galbraith 2024 in
    Otilde(p^{0.4}) heuristic / Otilde(p^{1/4}) rigorous small-crater
    (retrieved abstract, cited in IDEA-20260901-eb468f) regardless of how the
    designer got there; (iii) RECOGNITION COST c_test: it multiplies a walk
    that is already at or above rho. What DOES enter is IDENTIFICATION: any
    procedure that locates E_s, or a polynomial-size set containing it, in
    time o(sqrt(p)) without visiting the class.

    (P3) THE IDENTIFICATION CENSUS, ONE ROW PER ENDPOINT FAMILY, WITH THE
    MECHANISM THAT DECIDES IT. (a) CLASS-INVARIANT weakness (smooth N,
    anomalous t, low embedding degree, supersingular): the weakness is on
    E_pub itself; identification cost O(1); public limb FAILS -- these are
    the goal's mandated negative controls and the census reproduces the
    goal's own exclusion rule as its zero-cost slice. (b) LEVEL-DEFINED
    weakness (any property that is a function of End(E_s), including 'is at
    the crater of the q-volcano', 'has conductor divisible by q', or any
    End-module statistic): identification costs at most the cost of
    computing the class's volcano structure (factor D_pi, subexponential) plus
    reaching each candidate level, which is polynomial for small ell
    (Fouquet-Morain, IDEA-20260807-bb03d3) and Otilde(p^{1/4}) for a tall
    volcano with small crater (Galbraith 2024), and the ascent from E_pub is
    UNIQUE (IDEA-20260901-eb468f V3), so no search is needed at all; public
    limb FAILS below rho. (c) COSET-STRUCTURED weak set inside a level (a
    union of cosets of a subgroup of Cl(O) of index m): IDEA-20260808-5ee6b4
    gives sqrt(m) <= p^{1/4}; FAILS. (d) TORSOR-POSITION weakness with
    GENUS-CHARACTER leakage: the position of E_s relative to E_pub modulo
    Cl(O)^2 is publicly computable from the two curves (Castryck-Houben-
    Vercauteren genus theory, RECALLED), which restricts the walk to one
    coset of Cl(O)^2 and buys the attacker a factor 2^{r_2(Cl(O))} -- a
    constant for the designer to avoid by choosing a class group of small
    2-rank; the limb HOLDS up to that constant. (e) TORSOR-POSITION weakness
    with NO public fingerprint -- a property varying across the floor torsor
    of size h(Z[pi]) = p^{1/2 + o(1)} that no polynomial-time function of the
    curve correlates with: no identification route is known; the walk is the
    only attack and by (P1) it is >= 0.4 (c_test + c_step) rho; the public
    limb HOLDS FOR FREE.

    (P4) THE CONSEQUENCE FOR THE CAMPAIGN. The public limb is decided by the
    census row, not by any experiment on detection, chain length, or meter
    homogeneity; for row (e) it is satisfied by class mass alone, and for
    rows (a)-(c) it fails by a named mechanism. GOAL-ECTD-001 therefore
    reduces to its PRIVATE limb: exhibit a certified sub-rho ECDLP solve on
    some E_s whose weakness varies within the floor torsor and is not
    coset-structured. That is exactly H-ECTD-001 / H-ECTD-19c623's object,
    restricted by the census to the FLOOR (End = Z[pi]) and to
    equation-dependent rather than End-dependent properties -- and
    IDEA-20260805-4f9881 has already shown that three of the five frozen
    meters cannot carry it, leaving the two Groebner meters.

    (P5) THE FLOOR IS THE ONLY HIDING PLACE, restated from
    IDEA-20260901-eb468f V3 for completeness: every level above the floor is
    a smaller torsor by the conductor factor, so a designer who leaves the
    floor shrinks the hiding space and, by row (b), exposes the level to a
    search-free ascent. The best hiding place is the generic one.

  mechanism: >-
    THE TRACKED OBJECT. The IDENTIFICATION COST of E_s: the minimum, over
    public procedures, of the time to output a set of at most poly(log p)
    curves containing E_s, followed through the census as a function of what
    DEFINES the weakness -- the class (row a), the End ring (row b), a coset
    (row c), the torsor position with or without a fingerprint (rows d, e).
    The projection discards the weakness itself, the exploit, the chain, and
    the curve equations; it retains one cost exponent per row. It is lossy
    (the same identification cost is shared by every weakness in a row) and
    it propagates deterministically under the designer's operations: moving
    E_s by a horizontal isogeny leaves the row fixed, moving it vertically
    changes row (e) to row (b). That compatibility is the mechanism -- the
    designer cannot change the row without changing what the weakness is a
    function of.

    ESTABLISHED FAMILIES DECLARED OFF-LIMITS AS THE PRIMARY LENS. Semaev and
    Groebner meters (H-ECTD-001/19c623/ac8627); class-mass counting as an
    attack (4243e6/3dbda5, whose arithmetic is consumed, not re-derived);
    entropy and coset accounting (5ee6b4, consumed as row c); correspondences
    (51996a); pairing-shaped DDH (ba4e37); descent (c64123); group-structure
    leakage (ceca08, a partial row-(b) instrument); detectability
    classifiers and chain-length regressors (459d2d, 63f03f, reclassified as
    non-levers). The lens here is the IDENTIFICATION cost, which none of them
    tracks as the decisive quantity.

    STAGE 0 (ARITHMETIC, ZERO COMPUTE). The walk/rho ratio table
    0.4 (c_test + c_step) and 2.0 (c_test + c_step) over
    c_test + c_step in {1, 2.5, 3, 10, 2^8, 2^16, 2^20}, at the mean and
    maximum class sizes of H-ECTD-3dbda5, plus the toy-scale correction from
    3dbda5's median exponents at p in {10^4, 10^5, 10^6}. FORCED VALUES, no
    fitted parameter: the walk beats rho at the mean iff c_test + c_step < 2.5,
    at the maximum iff < 0.5.

    STAGE 1 (TOY, HOURS) -- c_step MEASURED. The lane has carried c_step as a
    free symbol since 4243e6. Measure it: for ell in {2, 3, 5, 7}, the cost of
    one Velu ell-step plus transport of the instance (P, Q) plus the
    order-preservation check, in group-operation equivalents, at three field
    sizes (20, 28, 36 bits). Report the ladder and the fitted growth in ell.
    Also measure c_test for the cheapest meaningful recogniser the frozen
    screens use (the first-fall-degree proxy of EXP-ECTD-001 at its frozen
    fb_size), so that the Stage 0 table can be entered with measured rather
    than illustrative numbers.

    STAGE 2 (TOY, HOURS) -- THE CENSUS RUN ON PLANTED MARKERS. On at least
    three fully enumerated toy classes (the enumeration machinery of
    EXP-ECTD-001 / H-ECTD-19c623, p of 20-28 bits so the class is
    enumerable, non-trivial 2- and 3-volcanoes preferred), plant three
    MARKERS and run two attacker strategies against each. Markers: (b) a
    LEVEL marker -- 'the crater of the 2-volcano' -- which is a union of
    volcano levels; (e) a TORSOR marker -- one uniformly random member of the
    floor level, with no fingerprint by construction; (c) a COSET marker -- a
    coset of an index-m subgroup of Cl(O), m in {4, 8, 16}, only in classes
    where Cl(O) admits it. Strategies: REACH-LEVEL (ascend/descend by
    Fouquet-Morain walking as in IDEA-20260807-bb03d3, then test once per
    level), and WALK-WITH-TEST (the 4243e6 class walk with an O(1) marker
    test). Count isogeny steps and tests to identification. The coset marker
    is attacked additionally by the baby-step giant-step on the action from
    IDEA-20260808-5ee6b4 where its harness exists; otherwise that row is
    reported as consumed from 5ee6b4 and not re-measured.

    STAGE 3 (ZERO COMPUTE) -- THE WRITTEN CENSUS. One row per family with
    the mechanism, the identification exponent, and the verdict on the public
    limb, delivered in a form the Coordinator can act on together with the
    measured c_step and the two toy strategy separations.

  novelty_status: unverified
  novelty_screen:
    method: >-
      KB RETRIEVAL WAS UNAVAILABLE FOR THIS SESSION (CRYPTO_KB_QDRANT_URL is
      ':memory:', index empty, verified by the orchestrator) and
      search_knowledge was NOT called. Screening by direct reading of all 14
      RQ-ECTD-001 proposals, the six H-ECTD-* hypotheses, DEC-20260806-4a9604,
      DEC-20260731-011, GOAL-ECTD-001, RQ-ECTD-001, KN-LIT-7261, KN-LIT-7630
      through KN-LIT-7636, and the cross-lane records IDEA-20260807-4f43ac
      (full), IDEA-20260807-e0ddc6 (claim), IDEA-20260807-bb03d3 (claim and
      novelty), IDEA-20260829-920b16 (object and citations), H-ICINV-b81659
      (full). Greps run 2026-09-01 over ledger/ and knowledge/ for
      'recognition cost|recognisability|proxy meter|cheap proxy|c_test',
      'aligned factor base|transported base|transport.{0,40}factor base',
      'Galbraith.{0,20}2024', '2024/924'. Two primary abstracts (eprint
      2024/924, 2025/1243) were retrieved by WebFetch for the row-(b) entry;
      the Castryck-Houben-Vercauteren genus-theory paper for row (d) was NOT
      opened and is recalled.
    results: >-
      IDEA-20260805-4243e6 / H-ECTD-3dbda5 derive C_walk = H (c_test + c_step)
      and the 0.399 ratio, then read it as a zero-exponent margin and redirect
      to recognition asymmetry; neither states that the walk is therefore
      never the binding attack, nor draws the non-lever consequence for
      459d2d / 63f03f / 8dcde2, nor writes an identification census.
      IDEA-20260808-5ee6b4 supplies row (c) and its HA-2 (unstructured
      predicate implies linear scan) is consumed as this record's H2.
      IDEA-20260808-ceca08 is a partial row-(b) instrument (level leaks
      through n_1). IDEA-20260815-8dcde2 writes the holder/public inequality
      parameterised by chain length; this record says chain length is not a
      parameter of the public side. The 'recognizability' hits in
      IDEA-20260830-* and IDEA-20260829-c6e7a4 concern KN-FIND-007's
      target-recognisability functional in the index-calculus lane, a
      different object. The 'transported factor base' hits (4f43ac, e0ddc6)
      concern preprocessing transport in the multi-target lane and are cited
      in the return message as closing the goal's 'isogeny-aligned factor
      base' clause by e0ddc6's Class I argument; they are not this record's
      mechanism. No record states the level/torsor identification dichotomy.
    verdict: >-
      UNVERIFIED. The arithmetic of (P1) is internal (3dbda5) and elementary;
      (P2)-(P5) are a reframing plus a census whose external inputs are one
      retrieved abstract (row b) and one recalled paper (row d). No primary
      source underlying the record's own mechanism was opened, so the honest
      label is unverified even though the record is likely to read as
      'adaptation' to a reviewer with retrieval.

