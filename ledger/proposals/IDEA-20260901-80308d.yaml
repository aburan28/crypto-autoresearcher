  assumptions:
    - >-
      N is prime or has a prime factor of the same bit size, so matched rho
      is 1.2533 sqrt(N) ~ 1.2533 sqrt(p) and the negation-map variant differs
      by 0.5 bits; both are reported.
    - >-
      The designer's endpoint set is the F_p-isogeny class (Tate), of size
      H(4p - t^2), as in H-ECTD-3dbda5 L1; the toy-scale median is smaller
      than the asymptotic value by an ineffective o(1) and this is disclosed
      wherever the ratio is quoted.
    - >-
      c_test and c_step are measured in group-operation equivalents in
      Stage 1 and enter the Stage 0 table as measured numbers; until then the
      table is entered with the same illustrative bracket 4243e6 used and is
      labelled illustrative.
    - >-
      Identification means outputting a set of at most poly(log p) curves
      containing E_s; a procedure that outputs a set of size p^{epsilon} is
      charged the walk cost over that set.
    - >-
      Toy scale for every measured number (p of 20-36 bits). No transfer to
      cryptographic size is claimed for the measurements; the asymptotic
      statements are labelled by which ineffective bound they rest on.

  proof_search_map:
    bottleneck: >-
      The step 'identify E_s' in the public attack. Every public-limb
      statement in the lane is a function of its cost; (P1) shows the
      class-walk realisation of that step is already at rho, so the only
      thing that can move the public limb is a cheaper identification, which
      the census enumerates.
    baseline_embedding:
      parameter_slice: >-
        c_test = O(1) with the weakness class-invariant (row a): the census
        returns identification cost O(1) and the public limb FAILS, which is
        exactly RQ-ECTD-001's own exclusion of smooth-order, anomalous, low-
        embedding-degree and supersingular endpoints. The second slice is
        4243e6's G8 table: entering the Stage 0 table with c_test + c_step = c
        reproduces margin_bits(c) = log2(0.399 c) exactly.
      reproduction_check: >-
        Symbolic: the Stage 0 table at c in {1, 2, 2^8, 2^16, 2^20, 2^24,
        2^30} must return -1.33, -0.33, 6.67, 14.67, 18.67, 22.67, 28.67 bits
        at the mean, matching H-ECTD-3dbda5 G8 to two decimals. A table that
        does not reproduce G8 is not consuming 3dbda5's arithmetic and the
        record stops.
    observation_collision:
      observable: >-
        The identification cost exponent of E_s, per census row.
      distinct_preimage_search: >-
        SEARCHED, AND ONE COLLISION IS THE LOAD-BEARING LIMIT. Two weaknesses
        in row (e) -- one genuinely sub-rho (delta > 0) and one not weak at
        all (delta = 0) -- have the SAME identification cost (the walk), so
        the observable says nothing about the private limb. That is (P4): the
        public limb is decided by the row and the private limb by the
        weakness, and no measurement of the former bears on the latter. A
        second collision: rows (d) and (e) differ only by a constant, so an
        instrument that cannot resolve constants cannot separate them, and
        the record does not claim to.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace 'is public path search and detection at least rho-hard' by
          'which census row does the weakness occupy', moving the public-limb
          question into a model where the answer is an exact case split on
          what the weakness is a function of. Encoding: the five rows;
          completeness: a weakness not fitting any row is the falsifier F4;
          soundness: each row carries its own named mechanism; cost loss:
          none, the rows are decided by argument at zero compute except row
          (e), which is decided by the absence of a fingerprint and is
          therefore only ever conditionally decided.
        predicted_gain: >-
          The public limb is settled for every named family at zero compute,
          and three planned measurements (459d2d, 63f03f, 8dcde2's chain
          parameter) are shown not to bear on it.
      - transform: observable_fiber
        proposed_object: >-
          Hold the identification cost fixed (row e) and vary the forgotten
          structure (which weakness, which exploit). The intrinsic invariant
          that distinguishes the fibre is c_exploit alone, which is the
          private limb.
        predicted_gain: >-
          None to any attacker; a redirection of the whole campaign budget to
          the private limb on the floor torsor.
    quantifier_order: >-
      (P1): FOR ALL ordinary classes with H >= sqrt(p)/2 * p^{-o(1)} and FOR
      ALL recognisers with c_test + c_step >= 2.5, C_walk >= C_rho. The
      witness class-size bound is uniform in the weakness; the o(1) is
      Siegel's and ineffective, stated. NOT CLAIMED: a bound for atypically
      small classes (t near the Hasse bound), which are publicly visible and
      which 4243e6 already excludes from the designer's use.
      (P3)(e): FOR ALL weaknesses varying within the floor torsor with no
      polynomial-time fingerprint, THERE EXISTS no public identification
      route cheaper than the walk KNOWN TO THIS RECORD. The stronger 'there
      exists none' is NOT claimed; it is the falsifier F4 and the row is
      labelled conditional.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: 'at the declared toy classes, a level marker is identified
        in the declared poly(log p) steps and a torsor marker requires
        Theta(h) steps under the declared strategies; c_step measures as
        stated; the walk/rho ratio at the measured class sizes is as
        tabulated'. It can NEVER certify that row (e) has no shortcut, cannot
        certify anything about the private limb, and cannot change any
        hypothesis status.
      nearby_object_control: >-
        THE ANOMALOUS-TRACE CLASS (t = 1), the goal's mandated class-invariant
        negative control and the closest object where the hoped-for 'public
        limb holds for free' FAILS: there every member is weak, identification
        is O(1), and the instrument must report the row-(a) verdict rather
        than a walk cost. A census that reported rho-hardness there would have
        proved too much and would be void.
    proof_obligations:
      - claim: C_walk / C_rho = 0.399 (c_test + c_step) at the mean class size, reproducing 3dbda5 G8.
        responsibility: baseline
      - claim: The walk is cheaper than rho iff c_test + c_step < 2.5 at the mean and < 0.5 at the maximum class size.
        responsibility: correctness
      - claim: Detectability and chain length do not enter the public limb beyond a constant.
        responsibility: strictness
      - claim: Each census row's identification exponent is derived from a named mechanism, with rows (b) and (d) conditional on the cited sources.
        responsibility: scope
      - claim: c_step and c_test are measured, not assumed, before the table is cited with numbers.
        responsibility: runtime
      - claim: The level and torsor markers separate under the declared strategies by the predicted factor.
        responsibility: feasibility
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: >-
      The identification cost of the secret endpoint E_s, as a function of
      what defines its weakness (class, End ring, coset, torsor position with
      or without a public fingerprint).
    lossiness: >-
      Genuinely lossy: the weakness, the exploit, the chain and the curve
      equations are all discarded; one cost exponent per row is kept. Two
      designs with the same row collide, which is the content of (P4).
      Discarded COMPATIBLY with the designer's operations: horizontal moves
      leave the row fixed, vertical moves change row (e) to row (b), so the
      retained part propagates deterministically. Not a change of
      coordinates: from a row one recovers no curve.
    propagation: >-
      Exact under horizontal isogenies (row fixed) and under vertical
      isogenies (row (e) to (b) and back). Under the designer's choice of
      weakness the row is determined by what the weakness is a function of.
    survival_score: >-
      Survives every designer operation; the designer cannot leave row (e)
      without entering a row that fails. That immobility is the finding.

  null_object_control: >-
    NULL-1, RANDOM RELABELLING (blocking). Assign the 'weak' label to a
    uniformly random class member with no fingerprint and run every declared
    identification strategy; none may beat the expected h/2 visits of the
    walk. A strategy that does is reading the generator, not the class, and
    every Stage 2 separation is void.
    POSITIVE CONTROL, LEVEL MARKER (blocking). The 2-volcano crater marker
    must be identified by REACH-LEVEL in at most the declared
    O(sum_ell ell * h_ell^2) isogeny steps, far below h. If REACH-LEVEL cannot
    beat the walk on a marker that is a union of levels, the instrument cannot
    see the row-(b) mechanism and no row-(e) negative may be reported.
    CLASS-INVARIANT NEGATIVE CONTROL (mandated). An anomalous-trace or
    smooth-order class where every member is weak; the census instrument must
    return row (a) with identification cost O(1) before any walk is run.
    DECAY / ARTIFACT CHECK. The torsor marker's identification cost must GROW
    with h across classes (fitted exponent near 1); a cost flat in h is an
    artifact under docs/inventor-protocol.md section 3.
    ARCHIVE CHECK (zero compute). Prior corpus measurements of c_step or of a
    class walk to a planted marker: NONE FOUND. IDEA-20260811-22b6b8 proposes
    a hitting-time experiment to a locally decidable vertex in another lane
    and reports no run; recorded as an absence.

  discriminated_from:
    - >-
      IDEA-20260805-4243e6 / H-ECTD-3dbda5. SAME ARITHMETIC, OPPOSITE READING.
      Those derive C_walk / C_rho = 0.399 (c_test + c_step) and call it a
      zero-exponent security margin, redirecting to recognition asymmetry.
      This record says the same ratio means the walk is never the binding
      public attack for any real recogniser, so the asymmetry is not a lever;
      it adds the non-lever list, the identification census and a measured
      c_step. Exact delta: 'margin = log2(0.399 c) bits' read as a
      designer's exposure versus read as the designer's free margin, plus
      rows (a)-(e).
    - >-
      IDEA-20260808-5ee6b4. Supplies row (c) and HA-2; this record consumes
      both and adds the other four rows and the walk floor. 5ee6b4 prices
      hiding; this record decides whether hiding needs to be priced at all.
    - >-
      IDEA-20260815-459d2d. Measures detectability of the trapdoor's
      existence; this record argues detectability is not a security
      parameter of the public limb (knowing E_s exists is not knowing which
      curve it is). The classifier remains a legitimate policy question
      (verifiable randomness), not a hardness one.
    - >-
      IDEA-20260815-63f03f and IDEA-20260815-8dcde2. Parameterise the public
      side by chain length; this record argues the attacker never retraces
      the chain and connects in Galbraith 2024 time once E_s is identified, so
      chain length drops out of the public inequality entirely. Exact delta:
      one fewer variable in 8dcde2's inequality, with a citation.
    - >-
      IDEA-20260808-ceca08. A partial row-(b) instrument (the level leaks
      through n_1, bounded by the cofactor); this record shows row (b) fails
      regardless of the leak because the level is reached by a unique ascent.
    - >-
      H-ICINV-b81659 (RQ-ICINV lane). The first named within-class,
      equation-dependent, gauge-invariant Semaev-proxy stratification in the
      corpus; used here as the WORKED EXAMPLE of a row-(b) weakness (it is a
      function of the 2-volcano level, computable in O(log^2 p), reached by
      O(log p) hill-climbing per its own text) and hence of a weakness the
      public limb does not protect. Not cited by any ECTD record before this.
    - >-
      IDEA-20260901-eb468f (filed alongside). Closes the VERTICAL family by an
      external result and a symmetry argument; this record consumes its V3
      as row (b) and generalises to the census. Neither implies the other.

  predictions:
    - metric: >-
        M1 -- Stage 0 walk/rho table at the mean and maximum class sizes over
        c_test + c_step in {1, 2.5, 3, 10, 2^8, 2^16, 2^20}
      direction: different
      minimum_effect: >-
        FORCED, zero fitted parameters: ratio 0.4 c at the mean and 2.0 c at
        the maximum; crossing 1 at c = 2.5 and c = 0.5 respectively; and
        reproduction of H-ECTD-3dbda5 G8 to two decimals. A table that does
        not reproduce G8 stops the record.
    - metric: >-
        M2 -- c_step in group-operation equivalents for a Velu ell-step plus
        instance transport, ell in {2, 3, 5, 7}, at 20, 28, 36 field bits
      direction: higher
      minimum_effect: >-
        Every measured c_step >= 2.5 group-operation equivalents, so that by
        M1 the walk never beats rho at the mean class size even with a free
        test. PRE-REGISTERED: a measured c_step below 2.5 at any ell would
        mean the walk with a free recogniser beats rho by a constant, and the
        record's (P1) would be restated as 'beats rho by at most a factor
        2.5 / c_step'.
    - metric: >-
        M3 -- isogeny steps to identify the LEVEL marker under REACH-LEVEL,
        versus class size h, over at least three enumerated classes
      direction: lower
      minimum_effect: >-
        At most 0.1 * h in every class and fitted growth in h with exponent
        <= 0.5 (predicted polylogarithmic). If REACH-LEVEL needs >= 0.5 h
        steps the row-(b) mechanism is not visible at toy scale and the
        record reports that rather than the row.
    - metric: >-
        M4 -- expected visits to identify the TORSOR marker under
        WALK-WITH-TEST and under every other declared strategy, versus h
      direction: higher
      minimum_effect: >-
        Mean in [0.4 h, 0.6 h] with fitted exponent in h within [0.9, 1.1]
        for every strategy, matching the uniform-position law. Any declared
        strategy achieving exponent <= 0.75 on the torsor marker, surviving
        NULL-1, is the LEAD outcome: an identification shortcut for row (e),
        which would be the single most important negative for the trapdoor
        lane and triggers independent review.
    - metric: >-
        M5 -- census table, one row per family, with mechanism and exponent
      direction: different
      minimum_effect: >-
        Delivered with every row's source labelled internal, retrieved or
        recalled, and with row (e) marked CONDITIONAL on the absence of a
        fingerprint. A census that assigns row (e) an unconditional verdict
        has overclaimed and is returned.
    - metric: >-
        M6 -- class-invariant negative control: the anomalous or smooth-order
        class is assigned row (a) with identification cost O(1) before any
        walk runs
      direction: different
      minimum_effect: >-
        EXACTLY row (a), in 100 percent of control classes. Otherwise the
        instrument is void.

  minimal_test:
    design: >-
      STAGE 0 (arithmetic, zero compute, HARD GATE): M1, reproducing 3dbda5
      G8; stops the record on failure.
      STAGE 1 (toy, hours): M2, c_step and the frozen first-fall-degree
      c_test measured at three field sizes; the M1 table re-entered with the
      measured numbers.
      STAGE 2 (toy, hours): on at least three fully enumerated classes at
      20-28 bits with non-trivial 2- and 3-volcanoes, plant the level, torsor
      and (where possible) coset markers; run REACH-LEVEL and WALK-WITH-TEST;
      NULL-1 and the level positive control first, hashed and committed
      before the torsor arm is read; M3, M4, M6.
      STAGE 3 (zero compute): M5, the written census, plus the non-lever
      statement for 459d2d / 63f03f / 8dcde2 in a form the Coordinator can
      act on. NO ATTACK IS RUN; the only discrete logarithms computed are the
      matched rho baselines per class mandated by RQ-ECTD-001, used as the
      cost yardstick.
    controls:
      - NULL-1 random relabelling, no strategy beats h/2 (blocking)
      - POSITIVE CONTROL level marker identified by REACH-LEVEL far below h (blocking)
      - CLASS-INVARIANT NEGATIVE CONTROL anomalous or smooth-order class assigned row (a) (mandated; blocking)
      - Torsor marker cost must grow with h (artifact check)
      - Matched Pollard rho and BSGS on each class's N as the cost yardstick (mandatory per RQ-ECTD-001)
      - Class enumeration completeness certified by the Kronecker-Hurwitz mass check of H-ECTD-3dbda5 where the instrument exists, else scoped to the enumerated subset
    required_metrics:
      - the Stage 0 table with the G8 reproduction check
      - c_step and c_test per ell and field size, with spread
      - steps to identification per marker per strategy per class, with h
      - fitted exponents in h for the level and torsor markers
      - pass/fail of every control
      - the census table with per-row provenance labels
      - wall-clock per stage and peak memory

  falsification_conditions:
    - >-
      F1. The Stage 0 table fails to reproduce 3dbda5 G8. The record is not
      consuming the arithmetic it claims to and stops.
    - >-
      F2. Measured c_step < 2.5 group-operation equivalents at some ell. (P1)
      is restated with the measured constant; the walk then beats rho by that
      constant with a free recogniser, and 4243e6's redirection regains a
      constant-factor foothold.
    - >-
      F3. The level marker is not identified far below h by REACH-LEVEL. The
      row-(b) mechanism is not demonstrated at toy scale; row (b) is reported
      as argued-not-measured.
    - >-
      F4. A declared strategy identifies the torsor marker in h^{0.75} or
      fewer visits, surviving NULL-1. Row (e) has a shortcut, the public
      limb is NOT free, and the record's central consequence (P4) is refuted
      -- this is the LEAD outcome and the most valuable one available.
    - >-
      F5. A reviewer exhibits a weakness family fitting no census row. The
      census is incomplete and is superseded with the row added.
    - >-
      F6. The class-invariant control is not assigned row (a), or NULL-1 is
      beaten. Instrument void; nothing is reported (AGENTS.md rule 5).
    - >-
      F7. Budget exhaustion before three classes resolve. INFRASTRUCTURE
      outcome, never evidence about identification cost.

  confounders:
    - >-
      Toy class sizes. At 20-28 bits the median class is p^{0.4}-ish, not
      p^{1/2}; the walk/rho ratio at toy scale therefore UNDERSTATES the
      asymptotic margin by up to p^{0.1}. The Stage 0 table carries both the
      asymptotic and the toy-corrected columns and no toy ratio is quoted as
      the asymptotic one.
    - >-
      Marker leakage through the generator. If the torsor marker is planted
      by a procedure that correlates with any public invariant (for instance
      always the member with smallest j), the walk can be beaten by reading
      that invariant. The marker must be drawn uniformly from the enumerated
      level by a seeded generator whose seed is committed before the run, and
      NULL-1 exists for exactly this.
    - >-
      Volcano drift. Random isogeny walks concentrate on the floor
      (IDEA-20260811-22b6b8 H2), so a walk that happens to start on the
      floor reaches a floor marker faster than a uniform-position law
      predicts and a crater marker slower. WALK-WITH-TEST must be the
      systematic class traversal of 4243e6 (retained chain, no revisits),
      not a random walk, or the h/2 law does not apply.
    - >-
      Recalled row (d). The genus-character leak is recalled and its exact
      statement for ordinary curves is unverified; row (d) is stated as a
      constant-factor entry and is the row most likely to be re-scoped on
      reading.
    - >-
      Closure-shaped writing. 'The public limb is free' reads as rigour and
      is cheap to produce; the record therefore carries a LEAD branch (F4)
      that would refute it, a mandated negative control where the conclusion
      must fail, and measured rather than assumed constants.

  interpretation_limits:
    - >-
      (P1) is asymptotic with an ineffective o(1) (Siegel), consumed from
      H-ECTD-3dbda5; at toy scale the walk can beat rho by up to p^{0.1} per
      3dbda5's own median exponents, and any toy citation must say so.
    - >-
      NOTHING HERE BEARS ON THE PRIVATE LIMB. The record says where the
      remaining question lives (the floor torsor, equation-dependent,
      non-coset-structured, sub-rho) and does not say whether anything lives
      there. Reading it as evidence for or against H-ECTD-001 / H-ECTD-19c623
      would be the premature-closure error.
    - >-
      The non-lever statements about IDEA-20260815-459d2d, -63f03f and
      -8dcde2 are claims about which quantity the public limb depends on,
      offered to the Coordinator; they change no record's status and
      459d2d's classifier retains value as a verifiable-randomness policy
      instrument.
    - >-
      Row (e) is CONDITIONAL on the absence of a public fingerprint and is
      never certified; F4 is its standing falsifier.
    - >-
      Every measured number is toy tier and scoped to the enumerated classes,
      markers, strategies and budget.
    - >-
      MANDATORY FORWARD GUIDANCE (inventor protocol section 4). Open after
      this record: (i) the private limb on the floor torsor via the two
      Groebner meters, which IDEA-20260805-4f9881 leaves live; (ii) whether
      any polynomial-time fingerprint correlates with an equation-dependent
      Semaev property across a torsor level -- the one measurement that would
      move row (e), and a natural successor to H-ICINV-b81659's design with
      the level held FIXED; (iii) the goal's 'isogeny-aligned factor base'
      clause, which IDEA-20260807-e0ddc6's Class I argument (group-valued
      preprocessing transports exactly) closes at zero compute and which is
      recorded in this task's return rather than spent an ID on.

  heuristic_assumptions:
    - id: H1
      statement: >-
        FOR ALL primes p and FOR ALL traces t with |D_pi| >= p^{1 - epsilon},
        the class size H(4p - t^2) is p^{1/2 + o(1)}, so that the walk floor
        C_walk >= 0.4 (c_test + c_step) C_rho holds up to a factor p^{-o(1)}.
      rigorous_support: >-
        The upper bound H = O(sqrt(p) log p) is unconditional (H-ECTD-3dbda5
        L1, Dirichlet plus Polya-Vinogradov, recalled there). The LOWER bound
        needed here is Siegel's h(D) >> |D|^{1/2 - epsilon}, ineffective; the
        classical distribution statement it sits beside is the Kronecker-
        Hurwitz mass identity, which fixes the mean at sqrt(p)/2 exactly and
        is the reason the mean-size statement is unconditional while the
        typical-size statement is not.
      validation_plan: >-
        SAMPLE: exactly H-ECTD-3dbda5's G3 arm -- class numbers by reduced-form
        enumeration for all admissible t at p in {10^3, ..., 10^7} -- consumed
        if EXP-ECTD-45290a has run, else re-run. COMPARISON: the median
        exponent log(median H)/log(sqrt p) against a monotone approach to 1.
        TAIL CHECK: the minimum H at each p against the Hasse-boundary traces,
        which are the publicly visible small classes. TRANSFER ASSUMPTION:
        the trend to 1 is extrapolated from p <= 10^7 to cryptographic p and
        is labelled an extrapolation resting on an ineffective bound.
    - id: H2
      statement: >-
        FOR ALL weak sets W in the floor torsor that are not unions of cosets
        of a proper subgroup of Cl(Z[pi]) and admit no polynomial-time
        fingerprint, every public identification procedure visits Omega(h/|W|)
        torsor elements in expectation.
      rigorous_support: >-
        Consumed from IDEA-20260808-5ee6b4 HA-2 (unstructured predicate search
        on a group action has no known sub-linear algorithm), which that record
        labels an assumption rather than a theorem. The rigorous ingredient is
        the simple transitivity of the Cl(O) action, which makes the torsor
        homogeneous so that no Cl(O)-equivariant statistic distinguishes
        positions (IDEA-20260807-bb03d3's crater-homogeneity remark); the
        distributional statement imitated is the uniform-position law for a
        random marker, giving mean h/2 visits.
      validation_plan: >-
        SAMPLE: the Stage 2 torsor-marker arm, 50 planted markers per class
        over at least three classes, every declared strategy. COMPARISON:
        visits-to-identification against the uniform law (mean h/2, variance
        h^2/12) by Kolmogorov-Smirnov. TAIL CHECK: the fastest identification
        observed against the uniform minimum-order statistic over 50 draws.
        TRANSFER: none; a shortcut absent at toy scale may exist at
        cryptographic scale and the row stays conditional.
    - id: H3
      statement: >-
        The connecting isogeny between E_pub and an IDENTIFIED E_s costs at
        most Otilde(p^{0.4}) (heuristic) or Otilde(p^{1/4}) (rigorous, small
        crater), independent of the designer's chain, so chain length is not a
        parameter of the public limb.
      rigorous_support: >-
        The retrieved abstract of eprint 2024/924 states both figures; the
        rigorous one needs no heuristic by its own statement. What is assumed
        is that the abstract's conditions match the ECTD setting, discharged
        at IDEA-20260901-eb468f's Stage 0.
      validation_plan: >-
        Reading (eb468f Stage 0) and, if feasible, eb468f's Stage 3 toy
        implementation. No sampling here; the exponents are quoted, not
        measured, and every citation of H3 carries the word 'abstract'.

  target_complexity:
    time_exponent: >-
      NO ATTACK ON ECDLP IS CLAIMED AND NO EXPONENT MOVES. The record BOUNDS
      the public limb: for census row (e) the best public attack is matched
      rho, exponent 1/2, with the walk at exponent 1/2 + o(1) times the
      constant 0.4 (c_test + c_step) >= 1 -- i.e. the designer's public margin
      is exponent 0 and at least 0 bits, for free; for rows (a)-(c) the public
      identification exponent is 0, at most 0.4 (via eb468f V1), and 1/4
      respectively, all below rho. The private limb's exponent (1 - delta)/2
      is the hypothetical this record does not touch.
    memory_exponent: >-
      O(log p) for the walk and O(log p) for REACH-LEVEL; the coset MITM of
      row (c) is p^{1/8} balanced or O(1) by kangaroo (5ee6b4); Galbraith
      2024's memory is unstated in the abstract and is an eb468f Stage 0
      item.
    best_known: >-
      Parallel Pollard rho at 0.886 sqrt(N) with the negation map, O(1)
      memory per processor (KN-TECH-006); BSGS 2 sqrt(N) time and sqrt(N)
      memory; the class walk H (c_test + c_step) at O(log p) memory
      (IDEA-20260805-4243e6); coset MITM p^{1/4} (IDEA-20260808-5ee6b4);
      Galbraith 2024 connecting isogeny (retrieved abstract).
    hidden_overhead: >-
      (i) Siegel's ineffective o(1) in the class size; (ii) c_test and c_step
      until Stage 1 measures them; (iii) the 1/|Aut| weighting and twist
      conventions carried from 3dbda5 (at most 2.6 + 1 bits); (iv) the
      recalled row-(d) constant 2^{r_2}; (v) the Otilde in Galbraith's
      exponents, unread.
    tradeoff_note: >-
      The walk is a genuine Pareto point against BSGS on memory (O(log p)
      versus sqrt(N)) and against rho on nothing; the record's content is
      that this point is never below rho on time, so no trade the attacker
      can make with it threatens row (e).

  dominated_by: >-
    n/a (no attack, no algorithm, no improvement is claimed; the deliverable
    is a bound on the public limb, a census and one measured constant). ROWS
    CHECKED across time, memory and data/queries before writing that: Pollard
    rho (1.2533 sqrt N, O(log N), 0 queries); BSGS (sqrt N, sqrt N); van
    Oorschot-Wiener parallel rho; the class walk (H (c_test + c_step),
    O(log p)); the coset MITM (p^{1/4} actions, p^{1/8} or O(1) memory);
    Fouquet-Morain small-ell ascent (poly); Galbraith 2024 connecting isogeny
    (p^{0.4} / p^{1/4}, memory unstated); Bisson-Sutherland End(E) at L(1/2)
    (recalled); generic preprocessing at S T^2 = N (advice p^{1/3}, online
    p^{1/3}), which is available to the public against E_pub regardless of
    any trapdoor and is a further reason the public limb never depends on
    the designer's choices. The record competes with none of these rows; it
    says which of them binds. Absence of a dominating row in this corpus is
    not evidence that none exists.
  sota_delta: >-
    Zero on every attack axis. Quantified deltas actually claimed: (i) the
    public limb of GOAL-ECTD-001's completion criterion, which the campaign
    has treated as an open requirement to be measured, is shown to hold with
    margin 0.4 (c_test + c_step) >= 1 at typical class size for every
    torsor-position endpoint without a fingerprint, and to FAIL with
    identification exponent 0, <= 0.4, or 1/4 for class-invariant, level-
    defined and coset-structured endpoints respectively; (ii) three planned
    measurements (detectability, chain-length leakage, the chain-length
    inequality) are shown to be constant-factor levers at most, which if the
    Coordinator agrees frees their budget for the private limb; (iii) one
    free symbol the lane has carried for a month, c_step, becomes a measured
    number at three field sizes. If F4 fired, the delta would be an
    identification shortcut for row (e) -- a defensive result against the
    trapdoor with exponent below 1/2 on the walk -- and the honest prior on
    that is low and stated below.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.9 that (P1) survives review as stated with its ineffective-o(1)
    caveat -- it is 3dbda5's arithmetic read in the other direction. 0.8 that
    the non-lever statements (P2) survive, the residual being a reviewer who
    shows that detectability changes the ATTACKER'S PRIOR over classes in a
    way that matters at fixed p (it does not change identification within a
    class, but the argument should be attacked). 0.7 that the census rows
    (a)-(e) survive as scoped, the softest being row (d) (recalled) and the
    possibility of a sixth row (F5). OUTCOME split on Stage 2: 0.8 that the
    level and torsor markers separate as predicted, 0.05 the LEAD branch F4,
    0.15 unmeasured on enumeration or budget. The most likely honest headline
    is 'the public limb is free for floor-torsor endpoints and fails by a
    named mechanism for everything else; the campaign is a private-limb
    search on the floor and nothing else'.

