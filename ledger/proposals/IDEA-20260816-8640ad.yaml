idea:
  id: IDEA-20260816-8640ad
  question_id: RQ-SHATHREE-cd2cb2
  added: '2026-08-16'
  title: 'Why translation by thirty-two and not by sixteen, eight or four: treat the whole divisor
    lattice of Z/64 as the parameter and compute, with zero search, the trade-off between symmetric
    degrees of freedom 25t and the injected asymmetry weight, then check whether t = 32 is the argmax
    it is assumed to be'
  class: theory
  claim: '(A) THE PARAMETER NOBODY VARIED. Internal-differential analysis of a sponge over Keccak-f[1600]
    uses a translation of the lane axis, and the translation actually used is by half a lane, t =
    32. But the equivariance argument holds for EVERY t dividing 64: the fixed subspace S_t has dimension
    25*gcd(t,64), and theta, rho, pi and chi preserve every one of them simultaneously. The divisor
    lattice {1,2,4,8,16,32,64} is therefore a free one-dimensional parameter family that costs nothing
    to enumerate, and this repository has never enumerated it. (B) THE TRADE-OFF IS COMPUTABLE. Two
    quantities move in opposite directions as t shrinks. Symmetric freedom dim S_t = 25t shrinks (t=32:
    800; t=16: 400; t=8: 200; t=4: 100; t=2: 50; t=1: 25), so the attacker has fewer symmetric messages
    to spend. Injected asymmetry weight w_i(t) = wt(RC_i XOR tau_t RC_i) changes non-monotonically,
    because it depends on how many pairs (z, z+t) meet the support set {0,1,3,7,15,31,63} -- and for
    small t that set is very badly matched to shifts. Both quantities are exact integers derivable
    from the standard with no search at all. The claim is that the pair (dim S_t restricted to the
    attacker-controllable rate, cumulative w(t) over the first r rounds) defines a two-axis Pareto
    set over the seven divisors, and that this Pareto set is a legitimate object of study whose shape
    is currently unknown in this repository. (C) THE FALSIFIABLE PART. It is predicted that t = 32
    is NOT the unique argmax on the raw trade-off, and that it becomes the argmax only after the rate/capacity
    constraint is imposed -- i.e. that the choice of t is a MODE fact rather than a PERMUTATION fact.
    A Coordinator can accept or reject this on computed integers. (D) NOT CLAIMED. No attack at any
    t. No claim that a smaller or larger t yields a better attack, no claim about any published choice
    of t, and no statement about what the literature uses or why. No claim about 24-round SHA-3. If
    t = 32 turns out to dominate on every axis, that is a clean recorded closure of this direction
    with a named obstruction, and it is a useful outcome.'
  mechanism: 'STAGE 1: enumerate the divisor lattice of 64 and construct, for each t, the projection
    onto S_t and the deviation map delta_t = I XOR tau_t as GF(2) matrices; verify dim ker(delta_t)
    = 25*gcd(t,64) by rank computation rather than by formula, so the formula is checked, not assumed.
    STAGE 2: verify the containment lattice S_1 subset S_2 subset S_4 subset ... subset S_32 subset
    S_64 = full space by explicit subspace inclusion tests; this is the structural spine of the family
    and a failure here means the parameterisation is wrong. STAGE 3: compute w_i(t) for all 24 round
    constants and all seven t, giving a 24x7 integer table that is a forced value of the standard.
    STAGE 4: intersect each S_t with the rate subspace of each of the four SHA-3 digest sizes (capacity
    initialised to zero, which lies in every S_t) and compute the dimension of controllable symmetric
    freedom, giving a 7x4 integer table. STAGE 5: iterate the deviation recursion of the companion
    contract for each t and record the active-row curve, giving a 7 x 12 table. STAGE 6: compute the
    Pareto set over the seven t on the axes (controllable symmetric dimension, cumulative injected
    weight to round r, active-row count at round r) for r = 4, 6, 8, and report whether t = 32 is
    dominated, dominating, or incomparable. REFUTATION: the mechanism fails if the S_t containment
    lattice does not hold, if dim ker(delta_t) disagrees with 25*gcd(t,64), or if the Pareto computation
    makes t = 32 a unique dominator on every axis, which would close the direction with a measured
    obstruction rather than a fatigue report.'
  novelty_status: unverified
  novelty_screen:
    method: 'Ran, from the repository root: `grep -ril "keccak\|sha-3\|sha3" ledger/ knowledge/ experiments/
      docs/`, which returned exactly four proposal files (IDEA-20260805-5194f9, IDEA-20260807-c4f1fc,
      IDEA-20260809-ce875b, IDEA-20260809-7f2d9c), one question (RQ-SHATHREE-cd2cb2), six goal records
      including GOAL-SHA3-001, two decisions (DEC-20260814-404d63, DEC-20260810-9942ea) and a block
      of KN-LIT files. Then ran a per-noun count over ledger/proposals/ and ledger/hypotheses/ for:
      translation-invariant (4 files, all ECDLP/AES: IDEA-20260807-cbe8c1, IDEA-20260805-62359f, IDEA-20260811-d7856a,
      H-AES-ecf3ad), symmetry-decay (0), "internal differential" (0), sponge (2: IDEA-20260807-c4f1fc,
      IDEA-20260808-95a21c), "invariant subspace" (2: IDEA-20260813-c9bec2 on TCitH MQ, IDEA-20260808-ae175e
      on MAYO MinRank), "chi step" (0), "rate/capacity" (0). Read RQ-SHATHREE-cd2cb2 in full, GOAL-SHA3-001
      header, KN-TECH-080 in full, docs/inventor-protocol.md sections 1-8, and the headers of KN-TECH-066,
      KN-TECH-073, KN-TECH-074, KN-TECH-056. Additionally grepped ledger/ for `divisor lattice`, `subgroup
      lattice` and `argmax` across proposals and hypotheses.'
    results: Zero hits for divisor/subgroup lattice in any ledger record. The two `invariant subspace`
      hits (IDEA-20260813-c9bec2 on TCitH public MQ maps, IDEA-20260808-ae175e on MAYO's Kronecker-factored
      whipped form) both study invariant subspaces of quadratic forms in multivariate signature schemes,
      not fixed subspaces of a translation group acting on a permutation state. RQ-SHATHREE-cd2cb2
      names translation symmetry along the lane axis but fixes no translation amount and never poses
      the choice of t as a parameter.
    verdict: 'UNVERIFIED. Nothing is asserted about external literature, which may well have settled
      the choice of t long ago. NEW relative to this repository: treating t as a swept parameter and
      computing the resulting Pareto set exists nowhere. ASSEMBLED FROM KNOWN PARTS: the equivariance
      fact is shared with the companion active-row contract; the rate/capacity dimension count is
      shared with the digest-size contract; the Pareto-honesty framing is docs/inventor-protocol.md
      section 5. The claimed contribution is the sweep and the dominance verdict, not the existence
      of S_t.'
  object_first_candidate:
    tracked_object: 'The indexed family of fixed subspaces {S_t : t | 64} together with the integer
      pair (dim(S_t intersect controllable rate), cumulative injected asymmetry weight through round
      r) attached to each member -- i.e. the divisor lattice itself as the object, followed through
      the round function rather than a single state.'
    lossiness: 'Each S_t is a lossy projection of the state, discarding 1600 - 25t bits; the smaller
      t, the more is discarded and the more rigid the surviving structure. What makes the FAMILY a
      legitimate object rather than a change of coordinates is that the discards are nested: S_1 subset
      S_2 subset ... subset S_32, so the family records a filtration and not a single coordinate change.
      Honest caveat: for a fixed t taken alone, the object is the same one the companion contract
      tracks, and this proposal''s novelty rests entirely on varying t, not on any new discard.'
    propagation: One round maps S_t into S_t + eps_i(t) for every t simultaneously, because theta,
      rho, pi and chi commute with tau_t for all t at once. So a single round-function evaluation
      propagates the entire lattice; the seven arms are not seven separate dynamics but seven readings
      of the same one, which is why the sweep costs almost nothing beyond the single-t computation.
    survival_score: 'Reported as, for each t, the largest r such that the active-row count stays below
      half of 320, and the largest r such that cumulative injected weight stays below the controllable
      symmetric dimension. The second is the sharper notion of survival: once cumulative injection
      exceeds available freedom, the structure has no budget left, and that crossing round is an integer
      this contract computes for all seven t.'
  null_object_control: Identical sweep over the divisor lattice with the 24 FIPS constants replaced
    by 1000 random schedules of matched support shape (executed in the same invocation, same code
    path, constants array swapped), and separately with the RC support set itself randomised to 7
    uniformly chosen z-positions. For the sweep to mean anything, the ORDERING of the seven t on at
    least one axis must differ between the FIPS arm and the median of the null arms. If the ordering
    is identical, the ordering is a property of the shift structure of any 7-element support set and
    carries no information about the standard's constants -- recorded as a controlled null.
  discriminated_from:
  - The companion active-row contract in this same batch -- that one fixes t = 32 and studies the
    deviation vector; this one fixes nothing and studies the lattice, and its deliverable is a dominance
    verdict over seven arms rather than a curve.
  - IDEA-20260813-c9bec2 (TCitH invariant subspaces) -- invariant subspaces of a public quadratic
    map versus fixed subspaces of a translation group; no shared mechanism and no shared cost model.
  - Generic 'try more parameter values' sweeps -- the parameter here is not a tuning knob but the
    index of an algebraic subgroup, and the seven arms are readings of one computation rather than
    seven runs.
  - Rate/capacity accounting taken alone -- that is the separate digest-size contract; here the mode
    enters only at stage 4, as the constraint that may or may not select t = 32.
  assumptions:
  - The relevant symmetry group is the cyclic group of z-translations; larger symmetries of Keccak-f
    (if any) are out of scope and their omission is an assumption, not a result.
  - Cumulative injected weight is a defensible first proxy for maintenance cost across different t;
    the chi-DDT contract measures whether it is.
  - Capacity initialised to zero lies in every S_t, which holds because the zero vector is fixed by
    every tau_t.
  - Comparing t across arms is meaningful even though the arms have different symmetric dimensions
    -- the Pareto framing exists precisely because a single scalar comparison would not be.
  predictions:
  - metric: dim ker(I XOR tau_t) for t = 1,2,4,8,16,32
    direction: different
    minimum_effect: forced to 25, 50, 100, 200, 400, 800 respectively; any deviation falsifies the
      parameterisation
  - metric: whether t = 32 is a unique Pareto dominator on all axes at r = 6
    direction: different
    minimum_effect: predicted NOT unique; at least one smaller t is predicted incomparable on the
      (freedom, injected weight) pair
  - metric: cumulative injected weight through round 6 at t = 32 versus t = 16
    direction: different
    minimum_effect: no pre-commitment on sign; the support set {0,1,3,7,15,31,63} has one pair at
      distance 32 but the number of pairs at distance 16 is a computed value the contract exists to
      obtain
  - metric: number of t values at which the FIPS ordering differs from the null median ordering
    direction: higher
    minimum_effect: 1
  minimal_test:
    design: 'Stages 1-3 alone discriminate and cost under an hour of CPU. Build tau_t for each of
      the six nontrivial divisors as 1600x1600 permutation matrices over GF(2); compute rank(I XOR
      tau_t) and check dim of the kernel equals 25*gcd(t,64) exactly -- a deterministic check with
      no sampling. Verify the inclusion chain by testing that a basis of S_t lies in S_{2t} for each
      consecutive pair. Then compute the 24x7 table of w_i(t) = wt(RC_i XOR tau_t RC_i) directly on
      64-bit integers; this is 168 popcounts and finishes instantly. Already at this point the contract
      answers the sharpest version of the question: is the injected asymmetry at t = 32 anomalously
      small compared with other divisors, or is it typical? If it is typical, the special status of
      t = 32 cannot come from the constants and must come from the mode, which stages 4-5 then test.
      If it is anomalously small, that is a specific measured property of the FIPS 202 constant schedule,
      and the null arm decides whether it is a property of the schedule or of any 7-element support
      set.'
    controls:
    - 'Random-constant null: 1000 schedules with matched support shape, same code path.'
    - 'Random-support null: 1000 schedules with the support set itself randomised to 7 distinct z-positions.'
    - 't = 64 identity control: must yield zero injected weight and dim S_64 = 1600 for every arm.'
    - 'Rank-versus-formula control: kernel dimensions are computed by rank, not by the 25*gcd formula,
      and the two are compared.'
    - 'Cross-arm sanity: the seven arms are read from one round-function evaluation, and a separate
      per-t independent evaluation must reproduce them bit-identically.'
    required_metrics:
    - dim ker(I XOR tau_t) by rank, for each t | 64
    - subspace-inclusion verdict for each consecutive pair in the divisor chain
    - w_i(t) integer table, 24 rounds by 7 divisors
    - dim(S_t intersect rate) for each t and each of four digest sizes
    - active chi row count at r = 4, 6, 8 for each t
    - Pareto dominance verdict for each t at r = 4, 6, 8
    - null-arm ordering distributions
  falsification_conditions:
  - dim ker(I XOR tau_t) disagrees with 25*gcd(t,64) for any t -- the parameterisation is wrong.
  - The inclusion chain S_1 subset ... subset S_32 fails at any link.
  - w_i(t) is identically zero for every i at some t < 64, which would mean that translation injects
    nothing and the arm is vacuous.
  - t = 32 is a unique dominator on every axis at every r tested -- a clean measured closure of the
    sweep, recorded with the obstruction, not a fatigue report.
  - The FIPS ordering is identical to the null median ordering on every axis -- controlled null.
  - The one-evaluation and per-t-evaluation readings disagree.
  confounders:
  - The divisor lattice is small (seven points), so any 'ordering difference' has a large chance of
    arising by tie-breaking noise; the null arm must therefore be read as a distribution over orderings,
    not as a single comparison.
  - Cumulative injected weight ignores where in the state the injection lands, and lane (0,0) is a
    privileged position under pi; a t that injects less weight into a worse position could be misranked.
  - Comparing arms with different symmetric dimensions invites an implicit normalisation choice; any
    normalisation is declared before the run and reported alongside the raw integers.
  - Choosing r after seeing the curves would let the dominance verdict be selected; r = 4, 6, 8 are
    fixed in advance.
  interpretation_limits:
  - A dominance verdict over seven divisors says nothing about whether any t supports an attack; the
    axes are structural quantities, not attack costs.
  - If t = 32 is selected only after the rate constraint is imposed, that is a statement about SHA-3's
    mode parameters as standardised, not about the permutation and not about security.
  - Round-reduced and structure-only; no extrapolation to 24 rounds is admissible.
  - The sweep covers cyclic z-translations only and is silent about any other symmetry the state may
    carry.
  target_complexity:
    time_exponent: No attack exponent is claimed. Six rank computations on 1600x1600 GF(2) matrices
      plus 168 popcounts, i.e. under 2^33 bit operations, independent of any security parameter.
    memory_exponent: No attack memory exponent is claimed. Seven 1600x1600 GF(2) matrices held one
      at a time, about 320 KiB each.
    best_known: The incumbent is whatever translation amount published internal-differential work
      uses, described but not read in RQ-SHATHREE-cd2cb2's provenance block. This contract produces
      no attack and therefore competes with nothing; it can only report that the standard's parameters
      do or do not single out one divisor on computed axes.
    hidden_overhead: 'The human cost is in defining a defensible normalisation across arms of different
      dimension -- the place where a sweep quietly becomes a ranking of the analyst''s preferences.
      The lower-order term is position: weight is a scalar summary of a vector that pi treats very
      unevenly.'
  dominated_by: 'n/a (no result claimed). Every frontier axis checked explicitly: the contract emits
    no time, memory or data/query row for any attack, so it occupies no frontier position. The Pareto
    computation inside the contract is over structural quantities of the seven arms and must not be
    confused with an attack frontier.'
  sota_delta: no attack; conceptual/measurement contribution only. The output is a 24x7 integer table,
    a 7x4 dimension table and a dominance verdict.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'That the dimension formula and inclusion chain check out: 0.93, essentially
    an arithmetic verification with transcription risk only. That the w_i(t) table shows t = 32 to
    be non-anomalous among divisors: 0.55, genuinely uncertain and the reason to run it. That t =
    32 fails to be a unique Pareto dominator: 0.6. That the FIPS ordering separates from the null
    ordering distribution: 0.3, because seven points is very little resolution. That the whole sweep
    changes any downstream decision: 0.35, and it would do so mainly by relocating the explanation
    of the parameter from the permutation to the mode.'
