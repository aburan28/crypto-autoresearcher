idea:
  id: IDEA-20260905-b6154d
  added: '2026-09-05'
  recorded_at: '2026-09-05'
  title: >-
    THE WALL, MADE EXACT, AND THE TWO DOORS IN IT: for a bounded-degree coordinate
    function on an odd-prime-order subgroup every discrete-log character correlation
    is at the Weil level c*deg*sqrt(p), which is a WHITE DL-spectrum -- so the
    advantage of any single cheap coordinate predictor is N^(-1/2) polylog, the
    sample complexity to even detect it is N (a square above the sqrt(p) usually
    quoted), and the hard-core-bit amplification breaks even with rho only at
    advantage N^(-1/4); the only known-false objects are the 2-torsion descent
    symbol (hypothesis "odd order" fails) and the Tate pairing at small embedding
    degree (hypothesis "bounded degree" fails, because Miller's loop evaluates a
    degree-N function in log N steps), and the second door is the one deep walk
    itineraries also walk through
  class: mechanism
  question_id: RQ-ECDLP-4fcbd3
  question_ids: [RQ-ECDLP-4fcbd3, RQ-ECDLP-002, RQ-CRYPTO-001]
  goal_ids: [GOAL-ECDLP-001, GOAL-CRYPTO-001]
  goal_applicability:
    GOAL-ECDLP-001: >-
      Supplies the proof-architecture map (KN-TECH-080) for the whole coordinate-bias
      lane: exact bottleneck, quantifier order, method ceiling, two nearby objects on
      which the conclusion is known false, and the break-even threshold every
      measurement in the lane is scored against. Zero compute.
    GOAL-CRYPTO-001: >-
      Converts "distinguishers usually leak into key recovery" into a costed
      statement with the amplification exponent exposed as a recalled quantity to be
      verified, so that no later record can claim a leak from a bias below the
      break-even line.
  status: proposed
  proposed_by: claude-code-session
  claim: >-
    (A) THE CLASS. Fix E/F_p and a subgroup G = <P> of odd prime order N. Let
    C(D, L) be the coordinate functions g: G -> C with |g| <= 1 of the form g(W) =
    Phi(f_1(W), ..., f_j(W)) with each f_i a rational function on E of degree at
    most D and Phi: F_p^j -> C either (i) a function whose F_p-additive-character
    expansion has l^1 norm at most L (residue classes modulo m, intervals, the low
    k bits of a coordinate all have L = O(polylog p)), or (ii) a multiplicative
    character of F_p^* of order dividing p - 1 applied to one f_i (Legendre symbols
    of x + c, of y, of any bounded-degree expression). Every "cheap coordinate
    predicate" used by this program's walks, distinguished-point rules and factor
    bases lies in C(D, L) with D, L = O(polylog p), EXCEPT functions evaluated by
    iterating the group law (walk itineraries, Miller loops), which are cheap but
    of degree exponential in the iteration count.
    (B) THE CEILING, CONDITIONAL ON TWO RECALLED RESULTS. For every g in C(D, L)
    and every a != 0 mod N, |g^(a)| = |sum over W in G of g(W) e(a log_P(W)/N)| <=
    c * j * D * L * sqrt(p). Proof shape: the character chi_a of G is the trace
    function of a rank-one Lang torsor on E (an unramified cover of E of degree
    N); psi(f) for an additive character psi of F_p and a rational f is an
    Artin-Schreier sheaf of Swan conductor bounded by deg f; eta(f) for a
    multiplicative eta is a Kummer sheaf; the product sheaf is geometrically
    nontrivial in case (i) always and in case (ii) unless the Kummer sheaf of eta(f)
    is geometrically isomorphic to the Lang torsor of some chi_a, which requires
    ord(eta) = N, hence N | p - 1; the Weil-Deligne bound then gives c * deg * sqrt(p)
    for each character pair, and the l^1 norm L pays for the outer expansion.
    Recalled ingredients: Bombieri 1966 (bound on a curve), Kohel-Shparlinski 2000
    (the subgroup twist), Deligne's Weil II for the sheaf-theoretic form. NONE has
    been opened in this program; this is a proof MAP whose first obligation is to
    read them.
    (C) THREE CONSEQUENCES, ARITHMETIC ONLY. (C1) White spectrum: by Parseval the
    spectral energy N * sum |g|^2 spread over N frequencies puts |g^(a)| at sqrt(N)
    on average, so the ceiling says the spectrum of any g in C(D, L) is white up to
    the constant c j D L, with NO frequency set of size below N/(c j D L)^2 carrying
    a constant fraction of the energy. "Bias concentrated on a structured subset of
    frequencies" is exactly what (B) forbids for this class. (C2) Advantage and
    sample complexity: the advantage of g at predicting any DL predicate whose
    character expansion has l^1 norm B (the half-interval predicate "log W < N/2"
    has B = O(log N)) is at most c j D L B sqrt(p)/N, and detecting a per-sample
    bias eps by sampling costs Theta(eps^-2) samples, so detecting a Weil-level bias
    costs Theta(N / polylog) samples, ABOVE the generic sqrt(N). The counting that
    puts the wall at sqrt(p) samples for a p^(-1/2) bias is off by a square.
    (C3) Break-even: a predictor of a hard-core predicate with advantage eps is
    amplified to full recovery at cost T_amp = polylog(N) * eps^(-c_amp) (recalled:
    c_amp = 2 under the Akavia-Goldwasser-Safra list-decoding reduction that the
    corpus note KN-LIT-4155 says Duc-Jetchev use; the Blum-Micali and Kaliski
    reductions for the MSB predicate are recalled with the same shape). The
    break-even against rho is eps* = N^(-1/(2 c_amp)) polylog = N^(-1/4) polylog at
    c_amp = 2, corresponding to a spectral spike of N^(3/4) or energy concentrated
    on about sqrt(N) frequencies. The gap between the ceiling N^(-1/2) and eps* is
    N^(1/4), and it is the same gap for every g in C(D, L): no single cheap
    bounded-degree coordinate function can close it, conditionally on (B).
    (D) THE TWO KNOWN-FALSE OBJECTS, AND WHICH HYPOTHESIS EACH BREAKS. (D1) A cyclic
    curve of order 2q with rational 2-torsion T = (e, 0): delta(W) = Legendre(x(W)
    - e) is in C(1, 1) case (ii) and IS the order-2 character of the group, with
    |delta^(q)| = 2q. The hypothesis that fails is "N odd prime": the Kummer sheaf
    of order 2 matches a Lang torsor of order 2, which exists only when the group
    order is even. Restricted to the odd-order subgroup delta is constant, which is
    Pohlig-Hellman's content. (D2) A subgroup of small embedding degree k, in
    particular N | p - 1 at k = 1: the Tate pairing t(W, R) with a fixed R is an
    order-N character of G, computable in O(log N) field operations by Miller's
    loop, and it is the trace function of a Kummer sheaf of order N attached to a
    rational function of degree about N. The hypothesis that fails is "bounded
    degree": Miller evaluates a degree-N function fast. This is the MOV /
    Frey-Ruck transfer (KN-TECH-032) in the lane's language, and it is the
    existence proof that "cheap" and "bounded degree" are different classes.
    (E) THE DOOR THAT REMAINS. Walk itineraries (IDEA-20260905-9c4f0c) are, like
    Miller's loop, fast evaluations of functions whose degree is exponential in
    the step count. (D2) shows such a function CAN be a character when the group
    has a small embedding degree; on a generic prime-order curve (embedding degree
    of order N) no pairing is cheap and no bounded-count iteration is known to
    approximate a character. Whether the deterministic walk's iterates do so is
    exactly the measurement of 9c4f0c, and this map says only that (B) does not
    settle it either way.
  mechanism: >-
    THE SINGLE BOTTLENECK. Every route from "coordinate bias" to "key recovery" in
    this lane passes through one inequality: a correlation between a cheap
    coordinate function and a group character that exceeds the Weil level. If the
    inequality holds with the Weil level, the lane is closed for the class C(D,L)
    by arithmetic (C1)-(C3); if it fails for some g, the break-even line says how
    far it must fail before anything is cheaper than rho. So the mechanism record is
    a pre-compute audit: it states the theorem shape, names what must be read to
    discharge it, names the objects where it must fail, and fixes the scoring line
    for the measurements in IDEA-20260905-f31bc4, -9c4f0c and -5a1ea2.
    WHY THE WALK OPERATOR'S EIGENVECTORS ARE THE CHARACTERS. In the random-branch
    model the operator is (Uf)(W) = (1/r) sum over j of f(W + T_j), a convolution on
    the cyclic group; convolution operators are diagonalised by the characters with
    eigenvalue (1/r) sum over j of e(a t_j / N). The eigenvector "correlated with
    something cheaply computable from coordinates" of the lane's premise is
    therefore chi_a correlated with g, i.e. g^(a). For the deterministic walk the
    operator is not a convolution; that difference is the subject of 9c4f0c, not of
    this record.
    WHY THE SAMPLE-COMPLEXITY SQUARE MATTERS. The lane's premise reasons "bias of
    order p^(-1/2), so sqrt(p) samples, so generic complexity". The correct count
    is eps^(-2) = p samples to detect, and polylog * eps^(-c_amp) to exploit, so at
    the Weil level the exploit costs p^(c_amp/2) >= p, and the premise's wall is
    higher than it says. This is a correction in the program's favour: it means
    the escape needs concentration by N^(1/4), not by a constant.
    THE LOSSY-PROJECTION TEST. The tracked object is the pair (DL-frequency,
    correlation magnitude); it discards the coordinates and keeps only the
    correlation with the group law, and the walk's affine bookkeeping acts on it
    by phases, so magnitudes propagate deterministically. It is lossy (N phases
    are dropped) and it is compatible with the operation. It passes.
  novelty_status: unverified
  novelty_screen:
    method: >-
      search_knowledge unavailable in this container (index empty). Local grep
      over ledger and knowledge for character sum, exponential sum, Weil bound,
      Bombieri, Kohel, Lang torsor, hard-core, Blum-Micali, Kaliski, Akavia,
      hidden number; corpus notes read as cited. Incomplete; the ceiling is
      almost certainly a known consequence of known theorems and is claimed here
      only as the lane's proof map, never as a new theorem.
    nearest_internal_record: KN-FIND-b7e091
    precise_difference: >-
      b7e091 closes incidence and endomorphism oracles at exponent 1/2 by
      generic-group simulability. This map closes a NON-generic class, coordinate
      functions of bounded degree, by a character-sum argument that lives exactly
      in the generic model's blind spot (KN-TECH-005 says the blind spot is where
      concrete structure lives); it is a different closure mechanism for a
      different class, and it comes with two named objects where it fails.
    scope: No global novelty claim; the theorem shape is expected to be known.
  citations:
