  assumptions:
    - >-
      N is an odd prime and the embedding degree of G is large (no order-N
      character of F_{p^k}^* is cheap); both are stated hypotheses of (B), and
      (D1)-(D2) are exactly their failures.
    - >-
      "Cheap" means evaluable from affine coordinates in polylog(p) field
      operations; the class C(D, L) is the bounded-degree sub-class of cheap, and
      the map's conclusions are for that sub-class only.
  proof_search_map:
    bottleneck: >-
      The inequality |g^(a)| <= c j D L sqrt(p) for all a != 0. Its failure for
      some cheap g by a factor N^(1/4) is the exact and only event that would
      make a coordinate distinguisher cheaper than rho; its holding closes the
      class C(D, L) by arithmetic.
    baseline_embedding:
      parameter_slice: >-
        Object (D1) at any toy size: the argument must FAIL there at the step
        "the product sheaf is geometrically nontrivial", and nowhere else. Object
        (D2) on a toy subgroup with N | p - 1: the argument must fail at "bounded
        degree" and nowhere else.
      reproduction_check: >-
        Write the derivation with each step numbered; run it on (D1) and (D2) and
        record the step at which it breaks. If it breaks anywhere other than the
        named hypothesis, the derivation is wrong somewhere nobody has read
        closely enough yet (proves-too-much discipline).
    observation_collision:
      observable: the DL-spectrum magnitude |g^(a)|
      distinct_preimage_search: >-
        Two functions with the same spectrum magnitudes: g and any g' = g
        translated by a known multiple of P (phases only). This is harmless and
        is the reason magnitudes are the invariant. The dangerous collision is
        between "g is in C(D, L)" and "g is cheap": the pairing shows the two
        classes are different, and any future record must say which class its
        function is in before invoking this ceiling.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: >-
          The class boundary between bounded-degree cheap functions (closed) and
          fast-evaluable high-degree functions (open), with the pairing as the
          witness that the open side is inhabited by characters at small
          embedding degree.
        predicted_gain: >-
          None on the exponent; the transform relocates the lane's only open
          question to a named class.
      - transform: stronger_invariant
        proposed_object: >-
          The break-even line eps* = N^(-1/(2 c_amp)) with c_amp exposed, so
          every measurement in the lane scores against a stated threshold rather
          than "non-negligible".
        predicted_gain: A decidable success criterion for f31bc4, 9c4f0c and 5a1ea2.
    quantifier_order: >-
      FOR ALL E/F_p, FOR ALL odd-prime-order subgroups G of large embedding
      degree, FOR ALL g in C(D, L), FOR ALL a != 0: |g^(a)| <= c j D L sqrt(p).
      The witness-freedom is zero: D, L are fixed before g is chosen, and choosing
      a new g after seeing a spectrum is excluded (that is what "frozen library"
      enforces downstream).
    method_ceiling:
      strongest_certifiable_claim: >-
        Conditional on the recalled bounds being read and holding as recalled: a
        derivation-level closure of the coordinate-distinguisher route for the
        class C(D, L) with polylog D, L, plus the break-even line. It certifies
        nothing about fast high-degree functions, nothing about combining many
        functions adaptively (a sqrt(N)-size library each at the Weil level is
        itself a sqrt(N)-cost object), and nothing about cryptographic-scale
        constants.
      nearby_object_control: >-
        (D1) the 2-torsion descent symbol on a cyclic order-2q curve and (D2) the
        Tate pairing on a small-embedding-degree subgroup; on both the white
        spectrum conclusion is KNOWN FALSE and the failing hypothesis is named.
    proof_obligations:
      - claim: Bombieri's curve bound as recalled, with its constant. Read the source.
        responsibility: baseline
      - claim: The subgroup twist (Kohel-Shparlinski) as recalled. Read the source.
        responsibility: baseline
      - claim: Completion-of-sums l^1 bound L = O(log p) for intervals and residues.
        responsibility: strictness
      - claim: Geometric nontriviality of Kummer(eta(f)) x Lang(chi_a) unless ord(eta) = N.
        responsibility: correctness
      - claim: Amplification exponent c_amp from the list-decoding reduction. Read the source.
        responsibility: success_probability
      - claim: Break-even arithmetic eps* = N^(-1/(2 c_amp)) polylog against 0.886 sqrt(N).
        responsibility: runtime
      - claim: The class C(D, L) excludes iterated and Miller-type evaluations explicitly.
        responsibility: scope
      - claim: The argument breaks on (D1) and (D2) at the named hypothesis and nowhere else.
        responsibility: correctness
    not_applicable_reason: null
  predictions:
    - metric: derivation_breaks_on_known_false_objects_at_named_step
      direction: different
      minimum_effect: >-
        On (D1) the break is at the sheaf-nontriviality step; on (D2) at the
        bounded-degree step. A break elsewhere, or no break, falsifies the
        derivation as written.
    - metric: break_even_table
      direction: different
      minimum_effect: >-
        For c_amp in {2, 3, 4} and N in {2^128, 2^256}: log2 eps* = -N_bits/(2
        c_amp) up to a polylog term reported separately; the gap to the Weil
        level is N_bits (1/2 - 1/(2 c_amp)) bits. Modelled numbers, labelled.
    - metric: census_white_spectrum
      direction: different
      minimum_effect: >-
        The validation experiment (f31bc4) finds every library member at the
        white level; a member above it is the falsifying observation for (B) at
        that member's (D, L).
  minimal_test:
    design: >-
      Zero compute. Write the derivation note with numbered steps, the class
      definition, the two failure objects with the failing step marked, the
      sample-complexity square, and the break-even table; then run the census
      (f31bc4) as the empirical validation with the 2-torsion object as the
      instrument control. The reading obligations are discharged by a retrieval
      task that marks the three recalled sources retrieved or corrects the map.
    controls:
      - proves-too-much on (D1) and (D2), each at a named step
      - the random-function null of the census as the white reference
    required_metrics:
      - the step index at which the derivation breaks on each known-false object
      - the break-even table with c_amp exposed
      - the census statistics of f31bc4 as validation
  falsification_conditions:
    - >-
      A recalled ingredient, once read, does not say what the map recalls (for
      instance the subgroup twist carries a factor that grows with N, or the
      list-decoding exponent is larger than 4). The map is corrected by a
      superseding record and every threshold downstream is recomputed.
    - >-
      The derivation goes through on (D1) or (D2). It has proved too much and is
      wrong at a step not yet identified; nothing downstream may cite it.
    - >-
      The census finds a member of C(D, L) with a spike above c j D L sqrt(p)
      persisting across the ladder. (B) is false for that member and the map is
      superseded.
  confounders:
    - >-
      Constants: c and the polylog terms decide nothing asymptotically but decide
      everything at toy scale; the census reports slopes, not levels, for that
      reason.
    - >-
      "Bounded degree" versus "bounded description": a function with a short
      description but exponential degree (Miller, itineraries) is outside the
      class, and mislabelling it inside would import a closure that does not
      apply.
  interpretation_limits:
    - >-
      A proof map is not a theorem. Until the reading obligations are discharged
      the ceiling is a recalled shape; no decision may rest on it (AGENTS.md rule
      9) and the census results stand on their own measurements.
    - >-
      The map closes a class, not a lane. Fast high-degree cheap functions are
      explicitly open, which is why 9c4f0c exists.
    - No exponent moves; no attack is proposed.
  heuristic_assumptions: []
  target_complexity:
    time_exponent: >-
      No improvement claimed. The map is a ceiling: for g in C(D, L) the best
      coordinate-distinguisher route costs at least N^(c_amp/2) polylog >= N,
      above rho; break-even would need a spike of N^(1/2 + 1/(2 c_amp)).
    memory_exponent: Not applicable.
    best_known: 'Generic rho 0.886 sqrt(N) (KN-TECH-006); generic lower bound Omega(sqrt(N)) (KN-TECH-005).'
    hidden_overhead: The polylog terms in L and in the amplification, reported separately.
    tradeoff_note: Not applicable.
