idea:
  id: IDEA-20260809-2866e0
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-NTRU-9015ee
  goal_id: GOAL-NTRU-001
  title: >-
    Where does the fatigue point go for module and matrix NTRU, which newer
    constructions use and for which no law has been fitted?
  class: mechanism
  claim: >-
    Matrix and module generalizations of NTRU appear in newer constructions,
    including in settings where the modulus is pushed upward for functionality
    reasons. The claim is that the dense sublattice event generalizes with a
    rank-dependent threshold, that the dependence can be measured at toy rank,
    and that it is NOT simply the rank-one law applied to the flattened
    dimension — which is the assumption a designer would make by default.
  mechanism: >-
    Instantiate rank-k module NTRU at toy parameters, run the profile detector
    and recovery, locate the transition per rank, and compare against the
    rank-one law evaluated at the flattened dimension.
  why_not_a_renamed_known_approach: >-
    The overstretched analysis is rank-one in its usual presentation. Extending
    the MEASUREMENT to rank k, and pre-declaring the flattened-dimension
    prediction as the null hypothesis to be beaten, makes the experiment
    discriminating rather than exploratory.
  predictions:
  - observable: transition location per rank versus the flattened-dimension prediction
    metric: difference in log q with interval, per rank
    predicted: >-
      Systematic departure growing with rank. Agreement with the flattened
      prediction at every rank is a clean negative that would let designers use
      the rank-one law with confidence, and is equally worth recording.
  - observable: detector behaviour at higher rank
    metric: detection rate on planted controls at matched rank
    predicted: Comparable resolution; a resolution that collapses with rank limits the reachable ranks and must be reported as the experiment's boundary.
  minimal_test: >-
    Ranks two and three at one toy dimension, q swept across the flattened-law
    prediction, with planted controls at each rank, twenty instances per cell.
  controls:
  - 'RANK-ONE ANCHOR: the same pipeline must reproduce the rank-one transition measured in this goal, or the higher-rank numbers are not comparable to anything.'
  - 'PLANTED CONTROL AT EACH RANK: detector resolution must be measured per rank rather than assumed to carry over.'
  falsification_conditions:
  - Rank-one anchor is not reproduced by the generalized pipeline.
  - Detector resolution collapses at rank two, making the measurement unavailable within budget.
  interpretation_limits: >-
    Toy rank and toy dimension. No statement about any deployed module-based
    construction is in scope, and none may be recorded.
  sota_delta: 'No attack. Delta: a measured rank dependence where designers currently have only a rank-one law and a plausible extrapolation.'
  dominated_by: Not dominated by any corpus record; ML-KEM module-lattice goals concern a different structural event and do not overlap.
  estimated_cost: Implementation medium; compute high relative to rank one.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for module NTRU / matrix NTRU: no records. WEB NOT CHECKED.'
  source_refs:
  - Overstretched NTRU and module-lattice references -- RECALLED, REQUIRED READS.
