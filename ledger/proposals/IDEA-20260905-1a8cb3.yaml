    - id: HEUR-2
      statement: NO HEURISTIC IS LOAD-BEARING FOR (E1) OR (E2); both are exact over F_n.
      rigorous_support: Rank-nullity over a field and the definition of C_k; the automorphism bound is 61049d's argument.
      validation_plan: The P1 and P3 tables validate the IMPLEMENTATION against the theorem and are reported as such, never as evidence for it.

