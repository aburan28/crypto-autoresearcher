  assumptions:
    - n prime, so rank over F_n is well defined and dim C_k = (m+1) - rho_k exactly; composite n would change (E1) and is excluded.
    - Attempt counts A_k are logged per row by 029c9c's collector; without them B(k) is undefined and this record cannot run.
    - The frozen streams of 029c9c are used unchanged; this record collects no new relations and runs no new lattice enumeration.

  proof_search_map:
    bottleneck: >-
      The equivalence dH_k = 0 iff exists v in L_K(k) with v_k invertible
      mod n, and its independence from |v|. If a norm-dependent notion of
      information existed, (E1) would fail; none does over a field.
    baseline_embedding:
      parameter_slice: >-
        The merged generic FIRST-ONLY arm: H_k falls by log2 n per row until
        k = m+1 and is 0 thereafter; the augmented-rank threshold of
        IDEA-20260805-061f97 is reproduced as the first k with H_k = 0.
      reproduction_check: >-
        Fixture: on 20 synthetic-null streams at n = 4099, m = 6, assert
        H_k = (7 - k) log2 n for k <= 7 and 0 after, by exact elimination.
    observation_collision:
      observable: The rate B(k).
      distinct_preimage_search: >-
        EXPECTED COLLISION: the merged base and the unmerged base with its
        free relations have identical B(k) after the free rows -- two
        different row configurations, same rate. That collision is the
        content of (E2). The separating object: a base whose free relations
        are not F_n-independent (repeated orbits), where B(k) must be lower.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Charge relation collection by informative bits: each row is
          scored dH_k in {0, log2 n} and attempts are summed over
          proved-disjoint blocks (free rows at cost 0, searched rows at
          their attempts).
        predicted_gain: >-
          Converts 'relations needed' from a row count to an information
          count that is invariant under column convention, so the RELN cost
          model cannot be fooled by row inflation (61049d's rank illusion).
    quantifier_order: >-
      FOR ALL prime n, FOR ALL row sequences, FOR ALL k: dH_k = 0 iff some
      v in L_K(k) has v_k invertible mod n (unconditional). FOR ALL tested
      arms and classes in 029c9c's panel: B(k) equals the arm's forced value
      -- quantified over the panel only.
    method_ceiling:
      strongest_certifiable_claim: >-
        'On the tested panel, bits per attempt are those of random modular
        linear algebra plus exactly the free-relation and collision terms
        predicted by KN-TECH-018 and KN-FIND-007.' It can NEVER certify a
        bound on the cost PER ATTEMPT, which is where the ECDLP exponent
        lives, nor anything at crypto scale.
      nearby_object_control: >-
        The order-5 set-map-stable base: orbit sums are not relations, so
        (E2) must return zero free bits there; a method reporting free bits
        on it is reading bookkeeping.
    proof_obligations:
      - claim: dim C_k = (m+1) - rho_k for a consistent system over F_n.
        responsibility: correctness
      - claim: dH_k = 0 iff a certifying v exists, independent of |v|.
        responsibility: correctness
      - claim: Free-relation rank <= m(1 - 1/t) for a t-orbit-stable base.
        responsibility: size
      - claim: UNMERGED equals MERGED after free rows, row for row.
        responsibility: baseline
      - claim: No statement about cost per attempt or exponent is made.
        responsibility: scope
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: The affine consistent set C_k, summarised by H_k and the per-row dH_k, with attempts as the cost coordinate.
    established_families_off_limits: >-
      Off-limits as the primary lens: yield and coverage geometry
      (KN-FIND-007); solving-degree instrumentation; automorphism quotients
      as a mechanism (used as forced values only); sparse linear-algebra
      algorithmics.
    lossiness: >-
      GENUINELY LOSSY: C_k forgets which rows were collected and retains
      only the affine subspace they cut out; the fibre over C_k is every
      row sequence with the same F_n row space. Compatible with row
      appending (C_(k+1) = C_k intersect {r_(k+1) . w' = 0}) and with
      column recombination (C_k transforms by the recombination). Not a
      change of coordinates: many streams, one C_k. Mirror failure checked:
      H_k has nonzero spread across arms only through the free-relation and
      collision terms, which is exactly what the record measures.
    propagation: Deterministic under appending; under harvest-all the sibling row propagates as a free relation.
    survival_score: >-
      Survives every arm; dies at nothing within the toy scope, which is
      the honest reason its predicted outcome is the forced value and its
      information gain is small.

  null_object_control: >-
    NULL: the synthetic-log null streams of 029c9c with their attempt logs
    (A_k = 1 per row by construction); forced B(k) = log2 n per attempt
    for k <= m+1 and 0 after. PLANTED POSITIVE: j = 0 phi-stable base with
    m/3 free rows at A = 0 -- B must be infinite on those rows and the
    total H drop must be exactly (m/3) log2 n; unmerged-negation base with
    m free rows, likewise m log2 n. DECAY PARAMETER q: fraction of orbits
    broken (partner replaced by a random point); free bits must fall
    linearly to 0 in q with three interior points. ORDERING: null and
    planted rates hashed before any real-arm rate is read. Mandatory
    Pareto rows (rho, BSGS) inherited from 029c9c's runs, controls only.

