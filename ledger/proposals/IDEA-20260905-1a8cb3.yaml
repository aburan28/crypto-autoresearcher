idea:
  id: IDEA-20260905-1a8cb3
  question_id: RQ-RELN-001
  goal_id: GOAL-RELN-001
  added: '2026-09-05'
  title: >-
    SHORT DEPENDENCIES ARE REDUNDANCY CERTIFICATES, NOT INFORMATION: define
    relation-generation entropy as H_k = log2 of the number of logarithm
    vectors consistent with the first k relations, measure bits per
    decomposition attempt on the same streams as IDEA-20260905-029c9c, and
    derive at zero compute that (E1) a vector of the dependency lattice L_K,
    however short, can only certify that a row added zero bits, while (E2)
    every zero-cost bit comes from a free relation in the row lattice L_R,
    whose count is the known automorphism/negation quotient -- so an
    anomalously short L_K cannot lower relation-collection cost, and the
    conditional ceiling on any L_R anomaly is a constant factor <= |Aut(E)|
  class: control

  claim: >-
    OBJECT. With the notation of IDEA-20260905-029c9c (rows
    r_i = (c_i, -a_i, -b_i), w = (l, 1, x), M_k the first k rows), define the
    CONSISTENT SET C_k = {w' = (l', 1, x') in (Z/n)^(m+1) : M_k w' = 0 mod n}.
    It is a nonempty affine subspace (the true w lies in it) of dimension
    (m+1) - rho_k with rho_k = rank_n(M_k), because the system is
    consistent so the coefficient rank equals the augmented rank. Define the
    RELATION-GENERATION ENTROPY H_k = log2 |C_k| = ((m+1) - rho_k) log2 n,
    the per-row information dH_k = H_(k-1) - H_k in {0, log2 n}, the
    attempt count A_k (decomposition attempts spent to obtain row k), and
    the RATE B(k) = (sum_(i<=k) dH_i) / (sum_(i<=k) A_i) in bits per attempt.
    This is 'effective relation-generation entropy' made measurable: it is
    the entropy of the uniform distribution on C_k, i.e. the number of
    fresh rows still needed is exactly H_k / log2 n.

    (E1) DEPENDENCY VECTORS CERTIFY ZERO, WHATEVER THEIR LENGTH. dH_k = 0 if
    and only if there is v in L_K(k) with v_k not equal to 0 mod n (row k is
    an F_n-combination of earlier rows). The Euclidean norm of v plays no
    role in that equivalence; a norm-2 syzygy and a norm-n^(1/2) syzygy
    certify the same zero. Consequently the seed's anomalously short L_K
    vectors, if they existed, would reduce the cost of DETECTING a wasted
    row -- which is already O(k (m+2)) field operations by incremental
    elimination -- and could not reduce the number of informative rows
    needed, which is (m+1) - (number of free relations), nor the attempts
    spent per informative row.

    (E2) ZERO-COST BITS COME ONLY FROM L_R. A row with (a, b) = (0, 0), or
    the difference of two sibling rows sharing (a, b), is a vector of the
    saturated row lattice L_R = {u : u . w = 0 mod n} with vanishing
    (a, b) part: a FREE RELATION among the factor-base logarithms. Each
    F_n-independent free relation lowers H by log2 n at attempt cost 0 (it
    is handed over by the factor-base construction or read off a target
    already searched). The number of independent free relations is
    rank_n of the free sublattice, which for a base closed under a group
    of automorphisms of order t is at most m (1 - 1/t): the classical
    orbit-representative quotient (KN-TECH-018; 61049d's B/3 on j = 0).
    Over F_p, |Aut(E)| <= 6, so the ceiling on zero-cost bits is a constant
    factor in relation collection and the linear-algebra unknown count is
    m/t, exactly the quotient already used in practice. No exponent moves.

    THE CONDITIONAL STATEMENT THE SEED ASKED FOR. IF 029c9c returns O-CLASS
    (a replicated L_K anomaly on a curve class), THEN by (E1) the measured
    B(k) on that class equals the null's B(k) unless the anomaly is
    accompanied by L_R free relations, in which case B(k) exceeds the null
    by exactly (free-relation rank) log2 n / (total attempts), a bounded
    constant. IF 029c9c returns O-COINCIDENCE (class-dependent sibling-row
    rate in HARVEST-ALL), THEN B(k) exceeds the null by the collision
    factor, which KN-FIND-007 bounds by min(1, mu)/(1 - e^(-mu)) <= 1.582
    at matched size. A positive result therefore WOULD imply: a measured,
    class-scoped constant-factor reduction in attempts per informative bit
    at toy scale. It WOULD NOT imply: any change to the linear-algebra rank
    needed beyond the free-relation quotient, any reduction in the cost per
    attempt (the exponent-carrying factor), any crypto-scale statement, or
    any attack. The seed's phrase 'reduce effective relation-generation
    entropy' is thereby given a precise, bounded meaning.

  mechanism: >-
    STAGE 0 (derivation, zero compute, HARD GATE). Write (E1) and (E2) in
    full: consistency of the system; dim C_k = (m+1) - rho_k; the
    equivalence dH_k = 0 iff some v in L_K(k) has v_k invertible mod n;
    the bound on the free-relation rank for an automorphism-stable base;
    and the sanity identity UNMERGED = MERGED: an unmerged-negation base
    (2m columns) has m extra unknowns and m free relations e_j + e_j', so
    its H_k trajectory after the free relations equals the merged base's
    trajectory exactly. Run the derivation against the nearby object where
    it must FAIL: a base stable under a set map x -> u x of order 5 that is
    not induced by an endomorphism (61049d's nearby object) -- there the
    orbit sums are NOT relations and (E2) must return zero free bits.
    STAGE 1 (replay, no new relation collection). On the frozen relation
    streams and attempt logs of IDEA-20260905-029c9c (FIRST-ONLY,
    HARVEST-ALL, the planted negation and j = 0 arms, the synthetic-log
    null, the small-target arm), compute rho_k, H_k, dH_k and B(k) per row
    by incremental elimination over F_n; record for every row with
    dH_k = 0 the norm of the shortest certifying v (from 029c9c's L_K
    enumeration) alongside dH_k, so (E1) is checked as a table: dH_k is 0
    for every certified row regardless of the certifier's norm.
    STAGE 2 (the rate comparison). B(k) per arm and class versus the
    synthetic-log null; the forced values are: FIRST-ONLY generic equals
    null; HARVEST-ALL exceeds by the measured collision factor, at most
    1.582; planted j = 0 gains exactly (m/3) log2 n bits at attempt cost 0
    and then tracks the merged null with m/3 fewer unknowns; planted
    unmerged-negation gains exactly m log2 n at cost 0 and then coincides
    with the merged arm row for row.
    WHAT EACH OUTCOME MEANS. (i) B(k) matches the forced values everywhere:
    the seed's second question is closed with mechanism (E1)/(E2) and the
    RELN cost model may charge relation collection as (m+1 - free rank)
    informative rows at the measured attempts per row. (ii) B(k) exceeds
    the forced value on a class WITHOUT a matching free-relation rank: (E1)
    is false as implemented -- either a redundant row was scored as
    informative (a rank-update bug) or a genuine information source outside
    L_R exists; the second is routed to independent review, the first is a
    bug. (iii) B(k) below the forced value: the collector wastes attempts
    on redundant rows, an efficiency finding about the collector.

