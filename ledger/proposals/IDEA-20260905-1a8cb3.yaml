  predictions:
    - metric: P1 -- dH_k versus the norm of the shortest certifying v, over every certified-redundant row in every arm
      direction: different
      minimum_effect: FORCED, exact -- dH_k = 0 for all such rows at every norm; a single row with a certifier and dH_k = log2 n is a rank-update bug or a falsification of (E1).
    - metric: P2 -- B(k) on merged generic FIRST-ONLY versus the synthetic null
      direction: different
      minimum_effect: Equal within the null's spread; the null spread is the sampling spread of attempts per informative row.
    - metric: P3 -- total zero-cost bits on the planted j = 0 and unmerged-negation arms
      direction: higher
      minimum_effect: EXACTLY (m/3) log2 n and m log2 n respectively; integer predictions with no tolerance.
    - metric: P4 -- B(k) HARVEST-ALL over FIRST-ONLY, generic curves
      direction: higher
      minimum_effect: Ratio in (1, 1.582], equal to the measured collision factor; a ratio above 1.582 contradicts KN-FIND-007's bound and is escalated.
    - metric: P5 -- zero-cost bits on the order-5 set-map nearby object
      direction: lower
      minimum_effect: EXACTLY 0; any free bit there voids the free-bit detector.

  minimal_test:
    design: >-
      Stage 0 derivation (hours, zero compute) with the nearby-object check
      and the UNMERGED = MERGED identity; Stage 1 replay of 029c9c's frozen
      streams by incremental elimination (minutes; pure Python, no
      enumeration); Stage 2 rate table per arm and class against forced
      values. No new relation collection. CHEAPEST VALID DISCRIMINATOR:
      the P1 table on the planted unmerged-negation arm, where certifiers
      of norm 2 abound -- if any norm-2-certified row shows dH_k > 0, (E1)
      as implemented is wrong and nothing else needs to run.
    controls:
      - Synthetic-log null streams with A_k = 1 (blocking).
      - Planted j = 0 and unmerged-negation arms with exact free-bit predictions and q-decay (blocking).
      - Order-5 set-map nearby object with predicted 0 free bits (blocking).
      - UNMERGED = MERGED row-for-row identity after free rows.
      - Matched rho and BSGS rows inherited from 029c9c, controls only.
    required_metrics:
      - rho_k, H_k, dH_k per row per arm, with the certifying-vector norm where dH_k = 0
      - A_k per row and B(k) per arm and class
      - free-bit totals per planted arm along the q ladder
      - HARVEST-ALL over FIRST-ONLY ratio per class with the measured collision factor
      - sha256 of the replayed streams matching 029c9c's records

  falsification_conditions:
    - F1. Any certified-redundant row scores dH_k > 0. (E1) fails as implemented; halt and localise.
    - F2. Planted free bits differ from (m/3) log2 n or m log2 n. Construction fault (truncated orbit, inconsistent lift) per 61049d, not a discovery.
    - F3. B(k) on some class exceeds null plus the free-relation and collision terms, replicated on 3/3 curves and 2/2 seeds. A genuine information source outside L_R; routed to independent review before interpretation, and it is the one outcome that would matter.
    - F4. Free bits appear on the order-5 nearby object. Detector reads bookkeeping; every free-bit count is void.

  confounders:
    - Rank update over Z versus F_n -- only F_n rank defines H_k; an integer-rank implementation would over-count.
    - Attempt accounting -- HARVEST-ALL must charge one attempt per target, not per row, or the collision gain is manufactured; FIRST-ONLY must charge failed targets too.
    - Sibling rows deduplicated upstream would delete the collision channel; 029c9c keeps them and this record relies on that.
    - Small m -- at m = 6 the trajectory has 7 steps and the rate has little resolution; m = 14 cells carry the comparison.
    - Composite n or a base outside <P> breaks (E1); the assumption is checked per instance.

  interpretation_limits:
    - Toy tier; a toy-scale rate says nothing about crypto scale.
    - The record bounds INFORMATION per attempt; it says nothing about the cost of an attempt, which is the exponent-carrying factor and is untouched.
    - A confirmed forced value closes the seed's second question with mechanism (E1)/(E2) on the tested panel; it does not declare any direction impossible and names non-L_R information sources (F3) as the class that would have to exist.
    - No status change, no experiment, no run is created here; the replay depends on 029c9c being executed first.

  heuristic_assumptions:
    - id: HEUR-1
      statement: >-
        ATTEMPTS PER INFORMATIVE ROW. In FIRST-ONLY mode the number of
        targets tried per informative row is geometric with mean
        1/P(decomp), P(decomp) = 1 - e^(-mu), mu = C(m+m'-1, m')/n, and is
        independent of the curve class at matched (p, t, m, m').
      rigorous_support: >-
        The mean of mu is exact (KN-FIND-007); the geometric law imitates
        independent Bernoulli trials over uniform targets; class
        independence in the mean follows from IDEA-20260807-0ff796 at arity
