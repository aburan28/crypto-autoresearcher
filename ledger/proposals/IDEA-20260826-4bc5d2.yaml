idea:
  id: IDEA-20260826-4bc5d2
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  added: '2026-08-26'
  title: >-
    THE FACTOR-BASE INCIDENCE DEVIATION IS A DIFFERENT OBJECT FROM THE
    RELATION-YIELD MEAN: track the coordinate-placement discrepancy
    S_B(E) = #{P in G : x(P) in [0,B)} and its normalised deviation from the
    Weil/Kloosterman null, and ask whether small |D_0| / special j biases WHERE
    the prime-order subgroup's x-coordinates fall by a coherent amount larger
    than a matched random curve at the SAME p and SAME N -- separating any
    yield effect from the sqrt(|Aut|) orbit-count discount, which touches
    incidence only through the trivial x -> zeta*x permutation.
  class: measurement

  claim: >-
    (A) THE FUNCTIONAL. Fix a window [0, B) in F_p and let
    S_B(E) = #{ P in G \ {O} : lift x(P) to [0, p) lies in [0, B) }, where G is
    the prime-order-N subgroup. Its normalised deviation is
    Delta_B(E) = ( S_B(E) - B*(N-1)/p ) / sqrt(B). The measured object is the
    DISTRIBUTION of Delta_B(E) over windows and over curves, NOT the mean
    relation yield. (B) THE DISCRIMINATION. Two rival explanations are separated
    at matched p and matched N: (H-null) special-j / small-|D_0| curves place
    their subgroup x-coordinates with the SAME discrepancy law as a matched
    random curve, i.e. Delta_B is O_P(sqrt(log)) with a curve-independent
    variance -- the incidence advantage of special j is then EXACTLY the trivial
    factor-|Aut|/2 orbit collapse and nothing more, strengthening the standing
    yield-invariance closure (IDEA-20260807-0ff796) in its second moment; versus
    (H-bias) small |D_0| induces a COHERENT bias -- a window family on which
    |Delta_B| for the special-j crater exceeds the matched-random-curve null
    band by a factor growing with the window count -- which would let a smaller
    factor base collect the same length-2/length-3 relations, a yield effect
    that is NOT the automorphism discount. (C) WHAT IS NOT CLAIMED. No exponent;
    the ECDLP time exponent is 1/2 throughout. No attack. Under P3, H-bias is
    proposed strictly as a test to run: if the crater's deviation appears to
    exceed the null band, the record STOPS and requests independent review
    before any sentence asserts an excess. A confirmed H-null is the expected
    and archivable deliverable.

  mechanism: >-
    The x-coordinate map x : G -> F_p is 2-to-1 onto its image, and the image is
    a pseudo-random-looking N/2-subset of F_p. For the FULL curve group the
    number of affine points with x in an interval is controlled by incomplete
    character sums with a Weil bound O(sqrt(p) log p) (Kohel-Shparlinski,
    Lange-Shparlinski distribution results for points on curves and on
    subgroups). Restricting to a prime-order subgroup G replaces the full-group
    sum by a subgroup character sum; the governing heuristic is that the subgroup
    x-coordinates are equidistributed with square-root discrepancy and no coherent
    low-frequency bias. The AUTOMORPHISM group acts on x only by x -> zeta*x
    (zeta a root of unity in F_p for j=0/j=1728), which is a bijective
    permutation of F_p that maps the window [0,B) to a rotated window; it can
    reindex windows but cannot create a NET coherent deviation over a
    rotation-averaged window family. Therefore any deviation excess that SURVIVES
    rotation-averaging is, by construction, orthogonal to the sqrt(|Aut|)
    mechanism. The CM structure enters only as a candidate cause of low-frequency
    bias: End(E) = O_{D_0} with small |D_0| makes G an O/n-module (Lenstra), and
    the question the object poses is whether that module structure leaves a
    fingerprint in the ADDITIVE placement of x-coordinates -- a place the
    scalar-action argument (H-ENDO-001) does not reach, because H-ENDO-001
    concerns the GROUP action on points, not the field-additive image of x.

  novelty_status: unverified
  novelty_screen:
    method: >-
      Screened the 29 proposals with question_id RQ-JINV-8fc13a plus the JINV
      hypothesis H-JINV-5a0b9e, evidence EV-JINV-a8c812 / EV-JINV-d080c6, and the
      lane closures IDEA-20260807-0ff796 / -f00729. grep over ledger/proposals
      for "incidence", "character sum", "Kloosterman", "discrepancy",
      "equidistribution". External primary sources on subgroup x-coordinate
      distribution NOT opened; labelled recalled.
    results: >-
      The lane measures the MEAN of length-2/3 relation yield and calls it an
      exact isogeny-class invariant (IDEA-20260807-0ff796), and H-JINV-5a0b9e
      measures decomposition_rate class-means vs |D_0| at matched N. No JINV-bound
      proposal measures the coordinate-placement discrepancy Delta_B or its
      variance/tail as a function of |D_0|, and no record uses a character-sum /
      Weil-discrepancy null for the incidence count. The automorphism-quotient
      records (-f8a045, -d329e2) treat x only through the orbit collapse.
    verdict: >-
      UNVERIFIED. Distinct object (second-moment/tail of coordinate placement,
      not first-moment yield) and distinct null (Weil/Kloosterman discrepancy,
      not a shuffled-label null). No novelty claimed against external analytic
      number theory, where subgroup equidistribution has a substantial
      literature that Stage 0 must locate.

  citations:
    - ref: null
      provenance: recalled
      claim: >-
        Distribution of x-coordinates of points on elliptic curves and on their
        subgroups obeys square-root discrepancy bounds via incomplete character
        sums (Kohel-Shparlinski; Lange-Shparlinski; Shparlinski surveys).
      verified_by: null
    - ref: KN-TECH-018
      provenance: recalled
      claim: automorphism-discounted rho baseline 1.2533*sqrt(N/|Aut|)
      verified_by: null
    - ref: IDEA-20260807-0ff796
      provenance: recalled
      claim: length-2 relation yield mean is an exact isogeny-class invariant
      verified_by: null

  nearest_existing_record: IDEA-20260807-0ff796 (yield-mean class-invariance closure)
  delta_from_nearest: >-
    OBJECT: mean length-2 yield -> the coordinate-placement discrepancy Delta_B
    and its variance/tail. OBSERVABLE: relation count per curve -> normalised
    window-incidence deviation against a Weil null. QUANTIFIER: "the mean is
    invariant across a class" -> "the second moment and low-frequency bias of
    x-placement are (or are not) |D_0|-dependent after rotation-averaging out the
    automorphism". A class-invariant mean is logically consistent with a
    |D_0|-dependent variance, so the closure does not answer this object.

  assumptions:
    - >-
      G has prime order N (matched-order construction), so the automorphism acts
      freely on G\{O} and x-orbits have size exactly |Aut|/2.
    - Toy scale, p up to ~32 bits, exact enumeration of G feasible.
    - >-
      The window family is chosen rotation-closed under the rational
      automorphism action so the sqrt(|Aut|) mechanism is averaged out by
      construction, not by argument.

  proof_search_map:
    bottleneck: >-
      Whether the incidence deviation Delta_B carries |D_0| information beyond the
      trivial automorphism reindexing. This is the single quantity separating a
      genuine yield effect from the orbit-count discount.
    baseline_embedding:
      parameter_slice: >-
        A matched RANDOM curve (generic D_0, |Aut|=2) in the SAME isogeny class
        as the special-j crater (same p, same N): its Delta_B must reproduce the
        Weil/Kloosterman square-root-discrepancy null.
      reproduction_check: >-
        Frozen fixture: on a committed generic curve at a toy p, the empirical
        variance of Delta_B over a window sweep matches the null variance to
        within enumeration tolerance before any special-j curve is read.
    observation_collision:
      observable: the normalised incidence deviation Delta_B(E) over a window family.
      distinct_preimage_search: >-
        A collision to separate: the trivial x->zeta*x reindexing produces the
        SAME rotation-averaged deviation as the identity, so any per-window
        deviation that vanishes under rotation-averaging is automorphism-trivial
        and must be discarded. Only rotation-invariant deviation is admissible
        as a candidate |D_0| effect.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the incidence count fixed and vary the forgotten additive
          structure (the lift of x to [0,p)); the intrinsic invariant separating
          special-j from generic is the rotation-averaged low-frequency Fourier
          weight of the x-image indicator.
        predicted_gain: >-
          Distinguishes a genuine additive-placement fingerprint from an artifact
          of window choice.
    quantifier_order: >-
      FOR EACH toy prime p and matched N, FOR ALL windows in the rotation-closed
      family, EXISTS or does not exist a curve-class-dependent excess of
      rotation-invariant Var(Delta_B) attributable to |D_0| after the
      matched-random null is subtracted.
    method_ceiling:
      strongest_certifiable_claim: >-
        At toy N, on these curves, in this window family, the rotation-invariant
        coordinate-placement discrepancy of the special-j crater does or does not
        exceed the matched-random null by a stated factor. It cannot certify
        anything about relation-collection COST, about any exponent, or about
        crypto scale.
      nearby_object_control: >-
        The quadratic twist of the crater (same |D_0|, same |Aut|, different
        curve): it shares the CM order but not the point set, so a deviation
        driven by |D_0| should persist and a deviation driven by the specific
        (a,b) instance should not.
    proof_obligations:
      - claim: Delta_B on a matched random curve reproduces the Weil null variance.
        responsibility: baseline
      - claim: Rotation-averaging annihilates the x->zeta*x automorphism reindexing.
        responsibility: correctness
      - claim: Nothing transfers to relation-collection cost or to any exponent.
        responsibility: scope

  predictions:
    - metric: rotation-invariant Var(Delta_B) for the special-j crater minus the matched-random null
      direction: different
      minimum_effect: >-
        PRE-REGISTERED NULL EXPECTATION 0 within the null band. H-bias would show
        a positive excess growing with the number of windows; any excess triggers
        P3 and independent review before it is named.
    - metric: rotation-averaged deviation of the x->zeta*x reindexed windows
      direction: different
      minimum_effect: >-
        Forced value 0 up to enumeration tolerance; a nonzero value means the
        rotation-averaging is mis-implemented and voids the run.
    - metric: Delta_B variance as a function of |D_0| across the matched-order family
      direction: different
      minimum_effect: >-
        Flat in |D_0| under H-null. A monotone trend surviving the twist control
        (P4-style residual) is the H-bias signature and is reported with its
        exact permutation distribution, never as a mean difference.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): derive the Weil/Kloosterman null variance for
      Delta_B on a prime-order subgroup and locate the external distribution
      result. STAGE 1: enumerate G on a matched random curve at a toy p; confirm
      Delta_B reproduces the null; confirm rotation-averaging kills the
      automorphism reindexing on a j=0 curve in the SAME class (same p, same N).
      STAGE 2: sweep windows and measure rotation-invariant Var(Delta_B) for the
      crater vs the matched-random floor vertex. STAGE 3: extend across the
      matched-order family (fixed N=19507-style construction) and regress on
      |D_0| with the twist control.
    controls:
      - matched random curve (generic D_0, |Aut|=2) in the SAME class, same p, same N (blocking)
      - rotation-averaging null on the x->zeta*x reindexed windows (must be 0)
      - quadratic-twist nearby object (same |D_0|, different point set)
      - Weil/Kloosterman analytic null variance as the reference band
    required_metrics:
      - S_B(E) and Delta_B per window, per curve
      - rotation-invariant Var(Delta_B), crater minus matched-random null
      - "|D_0|-regression slope with exact permutation distribution"
      - twist-control agreement

  falsification_conditions:
    - >-
      F1. Delta_B on the matched random curve does not reproduce the Weil null
      variance. Instrument failure; no |D_0| comparison reported.
    - >-
      F2. The rotation-averaged reindexed deviation is nonzero. The averaging is
      wrong and the run is void.
    - >-
      F3 (MAIN NEGATIVE, A RESULT). Rotation-invariant Var(Delta_B) shows no
      |D_0| trend beyond the matched-random null across the family. The
      coordinate-placement channel of RQ-JINV-8fc13a is closed at toy N with a
      named obstruction (subgroup equidistribution is |D_0|-independent) and the
      yield-invariance closure is strengthened in its second moment.
    - >-
      F4 (P3). An apparent excess over the null band. Work STOPS for independent
      review before any record states it.

  confounders:
    - Window choice: a non-rotation-closed family reintroduces the automorphism reindexing as a false signal.
    - p is a residual covariate across the matched-order family (p = N + t - 1); reported alongside |D_0|.
    - Toy-size character-sum fluctuations: three primes minimum, drift reported not averaged away.

  interpretation_limits:
    - claim_tier toy; N is a toy group order; nothing here is a cryptographic-scale statement.
    - >-
      A coordinate-placement bias, even if found, is at best a factor/log-cofactor
      change in factor-base size and is NOT an exponent; this idea is low-priority
      as an exponent-mover and is proposed as a falsifier of a yield-advantage
      folklore and a second-moment building block for the yield closure.
    - >-
      Nothing here builds a phi-stable / equivariant factor base, so pause
      condition P2 (H-STR-002) is not engaged; the object is a passive functional
      of the curve, not a relation-collection algorithm.
    - Any advantage at or below the sqrt(|Aut|) discount is baseline calibration (KN-TECH-018), recorded as such.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a uniformly random ordinary curve E/F_p with prime-order subgroup G,
        the normalised incidence deviation Delta_B is asymptotically mean-zero
        with variance bounded by a curve-independent constant times a slowly
        varying (log) factor, uniformly over windows [0,B) with
        B in ((log p)^eps * p^{1/2}, p^{1-eps}).
      rigorous_support: >-
        Incomplete character-sum / Weil bounds O(sqrt(p) log p) for the number of
        curve points with x in an interval (Kohel-Shparlinski; Lange-Shparlinski),
        specialised to a prime-order subgroup, imitating the equidistribution of
        a pseudo-random N/2-subset of F_p.
      validation_plan: >-
        Sample Delta_B over matched random curves at three toy primes with full
        enumeration of G; compare the empirical variance to the Weil null band;
        tail check the most extreme window against the predicted sub-Gaussian
        tail. Record sampled primes and windows; the transfer assumption to
        larger p is the uniformity range of the character-sum bound and is stated
        explicitly.
    - id: H2
      statement: >-
        The rotational average over the rational automorphism action annihilates
        the x -> zeta*x reindexing contribution to Delta_B exactly, so residual
        rotation-invariant deviation is orthogonal to the sqrt(|Aut|) mechanism.
      rigorous_support: >-
        The automorphism acts on x as multiplication by a root of unity, a
        measure-preserving bijection of F_p; averaging an indicator over a finite
        group orbit is exact, not asymptotic.
      validation_plan: >-
        On a j=0 curve, verify by exact enumeration that the rotation-averaged
        deviation of reindexed windows is 0 to enumeration tolerance before any
        crater-vs-floor comparison is trusted.

  target_complexity:
    time_exponent: >-
      1/2, unchanged. The object is a static functional; its best-case downstream
      effect is a change in factor-base size, i.e. a constant/log-cofactor, never
      the exponent.
    memory_exponent: not applicable; the functional is computed by enumeration at toy scale.
    best_known: >-
      0.886*sqrt(N) parallel rho with DPs, O(1) memory (KN-TECH-001, KN-TECH-006);
      CM automorphism-discounted variant 1.2533*sqrt(N/|Aut|) (KN-TECH-018).
    hidden_overhead: >-
      No o(1) asymptotic is claimed. Disclosed: window-family choice can swing the
      apparent deviation more than any |D_0| effect and is frozen before Stage 2.
    tradeoff_note: not applicable; no attack constructed.

  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY, DATA against every frontier row. As an attack it
    mounts none and is dominated by parallel rho with DPs (0.886*sqrt(N), O(1)
    memory), by its automorphism-discounted CM variant (1.2533*sqrt(N/|Aut|),
    KN-TECH-018), by BSGS (sqrt(N) time and memory), and by kangaroo/Gaudry-Schost
    on intervals. On data/queries nothing is consumed, so no row is dominated
    there. As a measurement it is adjacent to the yield-invariance closure
    IDEA-20260807-0ff796, which it extends to the second moment rather than
    competes with.
  sota_delta: >-
    ZERO speedup on every axis (time, memory, data, exponent); none sought.
    Measurement delta: supplies the first second-moment/tail characterisation of
    subgroup coordinate placement vs |D_0| with a Weil null where the lane has
    only a first-moment mean-invariance closure.

