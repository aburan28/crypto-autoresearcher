idea:
  id: IDEA-20260807-490c34
  question_id: RQ-INCB-001
  added: '2026-08-07'
  title: 'A one-sided gate cannot see a deficit: EV-INCB-001''s predeclared test asked only whether
    EC collinear-triple richness EXCEEDS the random null, and the systematic 15-35% SHORTFALL
    it actually found -- consistent in sign in every fittable cell -- was recorded and never explained'
  class: control
  claim: 'EV-INCB-001 is a controlled negative on its intended gate: the predeclared condition
    (z > 3 at all three sizes) is not crossed, the single crossing cell is diagnosed as a fit-conditioning
    artifact, and random-null triple counts match the exact finite-field prediction to <= 0.69
    SE, so there is no pipeline leakage. Two observations point the other way and are recorded
    rather than pursued: ''EC at or below random in every cell (excess ratio 0.75-1.0)'' and ''EC
    also 15-35% below its own uniform-x first-moment prediction at all fittable cells (within
    ~2 SE, systematic in sign; recorded, not explained)''. The unresolved_confounds name a candidate
    mechanism: ''possible non-uniformity of x(-P-Q) over lifting x''s''. KN-TECH-016 frames the
    interesting outcome as ''a measured curve-specific EXCESS over these bounds'' and H-INCB-001''s
    gate inherits that asymmetry, so a systematic shortfall -- non-generic in exactly the sense
    the technique cares about -- falls outside the decision entirely.'
  mechanism: Measure the distribution of x(-P-Q) over lifting x-pairs directly against uniform
    on the x-set, at the same toy primes EXP-INCB-001 used, reusing the identical random null
    already implemented. One histogram and one chi-squared test on data the harness already produces.
    It either explains the 15-35% deficit as a mechanical consequence of the lifting map -- in
    which case the uniform-x first moment is simply the wrong baseline and should be superseded
    -- or leaves a curve-specific shortfall that needs a different account. Per controls-before-belief,
    the null of the same shape runs first.
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-07'
    corpus_paths_grepped:
    - ledger/proposals
    - ledger/hypotheses
    - knowledge
    grep_results:
    - Additive-energy and sumset language appear across many proposals (IDEA-20260805-c8524f,
      IDEA-20260805-73cccc, H-FBG-001, H-RELN-66c079) and the character-sum axis is actively worked
      under H-PSEUDO, where DEC-20260804-1846e9 obtained the first rigorous non-circular bound
      O(p^{3/4} log p). None of those covers the specific SIGNED geometric deficit in EV-INCB-001
      or its stated candidate cause.
    - KN-TECH-016 is cited by no ledger or experiment record.
    conclusion: The underlying concepts are NOT untouched; the specific deficit and its named
      mechanism are.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS as the primary lens: character sums and H-PSEUDO
      (a separate, actively worked axis), factor-base yield, index calculus. The object is the
      distribution of x(-P-Q) over lifting pairs.'
    tracked_object: The empirical distribution of x(-P-Q) as (P,Q) ranges over pairs lifting from
      the x-set, compared to uniform on the x-set.
    one_step_propagation_rule: Each lifting pair contributes one observation; the histogram updates
      deterministically.
    newness_score: Low as mathematics -- this is a first-moment check. Its value is that it is
      the named candidate cause of a committed unexplained residual.
  lossy_projection_identifiability_audit:
    projection: the pair (P,Q) -> x(-P-Q).
    what_is_discarded: The y-coordinates and the pair's identity; the map is many-to-one.
    is_it_only_a_change_of_coordinates: 'NO -- the fibre over each x value has size varying with
      quadratic residuosity, which is precisely the suspected source of non-uniformity. Honest
      caveat: if the answer is simply ''the lifting map is non-uniform in the obvious way'', the
      record''s output is a corrected baseline, not a discovery.'
    mirror_failure_check: CHECKED. The failure would be a test that reports non-uniformity for
      any set. The random null already implemented in EXP-INCB-001 matched the exact finite-field
      prediction to <= 0.69 SE, so the instrument is known to report uniformity when it holds.
  null_object_control:
    primary_null: The random x-subset null of EXP-INCB-001, on which the same histogram must come
      out uniform to within its measured 0.69 SE. If it does not, the deficit is an instrument
      property and the reading stops there.
    secondary_nulls:
    - 'FORCED VALUE: the fibre-size weighting by quadratic residuosity gives a PREDICTABLE first-order
      non-uniformity; compute it in closed form and check the measured histogram against it before
      invoking anything curve-specific.'
  assumptions:
  - EXP-INCB-001's data pipeline exposes the lifting pairs, or can be re-run cheaply at the same
    primes.
  - The uniform-x first-moment prediction used in EV-INCB-001 can be recomputed exactly for comparison.
  predictions:
  - metric: chi-squared statistic of the x(-P-Q) histogram against uniform
    direction: higher
    minimum_effect: A departure large enough to account for a 15-35% first-moment shortfall, computed
      as an implied moment change rather than asserted.
  minimal_test:
    design: At the three primes of EXP-INCB-001, build the x(-P-Q) histogram over all lifting
      pairs; run the chi-squared test against uniform and against the closed-form quadratic-residuosity
      weighting; propagate the measured distribution into the first-moment triple-count prediction
      and compare with the observed deficit.
    controls:
    - random x-subset null
    - closed-form residuosity forced value
    required_metrics:
    - histogram and chi-squared per prime
    - implied first-moment correction
    - residual deficit after correction
  falsification_conditions:
  - 'The corrected first moment accounts for the full 15-35%: the deficit is mechanical, the uniform-x
    baseline is superseded, and nothing curve-specific remains.'
  - 'The random null also shows the deficit: it is an instrument property.'
  - 'A residual shortfall survives correction and replicates: a measured non-generic property
    of EC factor-base geometry, which must then be red-teamed before any use.'
  confounders:
  - Small-prime effects dominate at the smallest cell; report per prime.
  - The deficit is within ~2 SE per cell; only its consistency in SIGN across cells makes it interesting,
    so the analysis must be a sign test across cells, not a per-cell significance claim.
  - Fit conditioning caused one spurious crossing in the original record; re-check conditioning
    before any fit.
  interpretation_limits:
  - Toy scale. Dominated by Pollard rho at exponent 1/2 regardless; nothing here is an exponent
    claim.
  - A confirmed departure from the uniform-x first moment is a statement about the baseline, not
    about attack cost.
  heuristic_assumptions:
  - id: HEUR-INCD-1
    statement: The sign-consistency of the deficit across cells is not itself a multiple-testing
      artifact.
    rigorous_support: None; there are few cells.
    validation_plan: Pre-register the sign test and add two further primes before reading it.
  target_complexity:
    time_exponent: n/a
    memory_exponent: n/a
    best_known: Pollard rho at exponent 1/2
    hidden_overhead: n/a
    tradeoff_note: No exponent claim.
  dominated_by: 'Pollard rho at exponent 1/2. Rows checked across time, memory and data/queries
    before writing: Pollard rho (p^{1/2}, O(1) memory); BSGS (p^{1/2}, p^{1/2}); vOW parallel
    rho (p^{1/2}/w); Semaev index calculus at ~2.05 per target (FINDING-PF-IC-001, toy). Queries
    0 on every row. No row added.'
  sota_delta: ZERO. Converts an unexplained systematic residual into either a corrected baseline
    or a measured non-generic property. Much of the program's cost accounting rests on the equidistribution
    assumptions KN-TECH-016 underwrites.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 0.7 that the quadratic-residuosity weighting explains most or all
    of the deficit, making this a baseline correction. 0.2 that a residual survives and replicates.
    0.02 that it bears on any cost statement.
