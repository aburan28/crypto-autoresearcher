      affected by Lemma A2-prime. It also states that 9c5694's reproduction
      check (iii), as written, would find halving coincidences at its own
      n = 17 cell. That is a pointer for the HOLD-X5 design and edits nothing.
    - Nothing here is a statement about ECC2K-130, K-163 or any deployed curve beyond the ord_n(2) arithmetic of claim (E).
    - The halving coincidences are not a resource. Their count per target is about 2^{2l - 2n} n and has no cost reading.
  heuristic_assumptions:
    - id: H1
      statement: >-
        COINCIDENCE COUNT. For a Koblitz toy with no Cayley accident, any V of
        dimension l and m = 2, N_coinc is approximately Poisson with mean
        mu = (n - 1) kappa |F_V|^2 / (2 #E), where kappa is the fraction of
        P in F_V with 2P in G.
      rigorous_support: >-
        RIGOROUS PART. Lemma A2-prime reduces every coincidence to the event
        x(P_2) in V, with P_2 = [k_{j,s}] P_1 (plus a torsion term) a fixed
        nonzero scalar multiple of a factor-base point. The halving route
        visits each coincidence exactly four times. HEURISTIC PART. When k is
        not in <-1, lambda>, x([k] P) for P in F_V lands in V with probability
        |F_V| / #E, independently across (P, j, s). This imitates the random-map
        model for scalar multiplication on x-coordinates, the model 9c5694's H1
        borrows from Semaev 2015 section 4.3 for sumsets, and a Poisson limit
        for a sum of many rare, nearly independent indicators.
      validation_plan: >-
        SAMPLE all of G at n = 17 (five bases) and n = 23 (two stable bases),
        and all of F_V at n = 31 by the halving route. No shortcut is needed;
        the halving route is itself the shortcut, |F_V| x 2(n - 1) scalar
        multiplications instead of a full sumset. COMPARE each count to
        Poisson(mu) with the exact two-sided p-value, and the pooled count to
        the pooled mean. TAIL CHECK: the largest single (j, s) channel against
        its share mu / (2(n - 1)); an outlier channel triggers the Cayley
        check. TRANSFER: none beyond the tested cells. The n = 41 figure is
        arithmetic under H1 and is labelled so.
    - id: H2
      statement: >-
        BINOMIAL THINNING. On a stable V, whether a solution tuple of a fixed
        instance is C1-canonical is independent across that instance's
        solutions and of the instance, with probability 1/n each.
      rigorous_support: >-
        RIGOROUS PART. The claim (D) identity makes the AVERAGE survival
        exactly 1/n. HEURISTIC PART. Independence per target. Under
        equivariance the canonical partner of a solution lies in another
        instance, so nothing ties the canonicity of two solutions of one
        instance. This imitates Bernoulli thinning of a point process.
      validation_plan: >-
        SAMPLE every decomposable target at n = 17 and n = 23 (all of G).
        COMPARE the all-lost fraction and the survivor-count distribution
        against Binomial(s, 1/n) mixed over w_s, by a chi-square test on the
        (s, survivors) table. TAIL CHECK: targets with s >= 3. CONTROL: the
        random-hash filter must pass the same test. TRANSFER: none.
  heuristic_note: >-
    Lemma A2-prime, the equivariance of claim (A) and the identity of claim
