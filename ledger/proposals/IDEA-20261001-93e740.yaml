  proof_search_map:
    bottleneck: >-
      Whether any Frobenius-derived constraint on ONE fixed-target instance is
      sound (HOLD-R's remaining uncertainty), and whether the lemma cited for
      that answer (a77711 Lemma A2) holds for the sign-free systems that every
      solver in this program actually builds.
    baseline_embedding:
      parameter_slice: >-
        The stable-base slice at n = 17, V = F_2 + ker f_i(sigma) (dimension 9),
        where Proposition T collapses to the known GGMP statement: decomposing
        sigma R over V is decomposing R over V, transported by squaring
        (9c5694's positive control; KR-IC-b0fcda). There Sol(sigma R, V) =
        sigma Sol(R, V) must hold tuple by tuple.
      reproduction_check: >-
        Frozen fixture F0, run before any count is read. (i) Squaring maps every
        certified tuple of Sol(R, V) into Sol(sigma R, sigma V), on all of G at
        n = 17 (exact). (ii) The coincidence set found by brute-force comparison
        of Sol(R, V) with Sol(sigma^j R, V) equals the set produced by the
        halving route of the minimal test, tuple by tuple, on all of G at n = 17
        for every base. (iii) The global C1 survival fraction equals 1/n
        exactly on every stable base.
    observation_collision:
      observable: A tuple t lying in both Sol(R, V) and Sol(sigma^j R, V) for some 0 < j < n.
      distinct_preimage_search: >-
        Three preimages. (i) A per-instance symmetry (Sol(R, V) closed under
        sigma^j), the withdrawn reading. (ii) A halving coincidence of claim
        (C). (iii) An instrument sign or lift bug. Separated as follows. Every
        common tuple is re-tested with exact group arithmetic for the halving
        identity 2 P_1 = (1 - s lambda^j) R. Set-level closure of Sol(R, V)
        under sigma^j is tested separately for every R; reading (i) needs the
        whole set, not one tuple. The ordinary-curve null shows the count that
        sign-pattern coincidences produce with no endomorphism at all.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The x-tuple held fixed while its sign pattern varies. This fibre is
          what a77711's signed argument forgot, and it gives Lemma A2-prime.
        predicted_gain: None in cost. A corrected lemma and a pre-registered count.
      - transform: stronger_invariant
        proposed_object: >-
          The signed point tuple, on which a77711's Lemma A2 is exact. Every
          later use of A2 (9c5694 Proposition Sigma, its check (iii), the
          freeness argument) is to be read in signed form.
        predicted_gain: None in cost. Removes a false zero-count prediction.
    quantifier_order: >-
      Lemma A2-prime: FOR ALL Koblitz E (a, b in F_2), FOR ALL F_2-subspaces V,
      FOR ALL m >= 2, FOR ALL R in G minus O, FOR ALL 0 < j < n, the
      characterisation of claim (C) holds. Exact, no heuristic. The identity of
      claim (D): FOR ALL stable V and FOR ALL total orders on tuples, the
      global survival fraction is exactly 1/n. H1 and H2 are heuristic and are
      claimed only FOR the tested cells. Proposition Sigma is cited with
      9c5694's own quantifiers and is not extended.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On the n = 17, 23 (and sampled 31) Koblitz toys at m = 2, every tuple
        common to Sol(R, V) and Sol(sigma^j R, V) is of halving form, the counts
        agree with the H1 Poisson mean, no Sol(R, V) is closed under any
        sigma^j, the global C1 survival fraction is exactly 1/n, and the
        per-target all-lost fraction matches binomial thinning." It certifies
        nothing about cost, nothing about m >= 3 counts (only the structural
        statement), nothing at n = 41 beyond arithmetic, and nothing about any
        deployed curve.
      nearby_object_control: >-
        Three, all blocking. (i) The ordinary-curve null (the RC-1 curve over
        the n = 17 field as recorded in IDEA-20260926-9c5694, b not in F_2). There
        sigma is not an endomorphism, the conjugate abscissa x(R)^{2^j} defines
        an unrelated target, and the same coincidence count must follow the
        same formula. (ii) A random-hash filter keeping each tuple at rate 1/n.
        Under H2 it must reproduce rule C1's per-target loss statistics. (iii)
        The polynomial window V = {deg < l} and a seeded random V' of the same
        dimension, where sigma does not preserve the base.
    proof_obligations:
      - claim: sigma maps G onto G and acts as a scalar of order exactly n (G unique of order r, G not in E(F_2), n prime).
        responsibility: correctness
      - claim: Lemma A2-prime, both directions, with D nonempty and proper.
        responsibility: correctness
      - claim: The global 1/n survival identity of claim (D) (free action on incidences, one canonical pair per orbit).
        responsibility: correctness
      - claim: The halving route enumerates every coincidence exactly four times (two legs, two signs of R).
        responsibility: size
      - claim: >-
          Cayley-accident check. For each (j, s), k_{j,s} = (1 + s lambda^j)/(1 - s lambda^j)
          mod r is tested for membership in <-1, lambda>. A member makes the
