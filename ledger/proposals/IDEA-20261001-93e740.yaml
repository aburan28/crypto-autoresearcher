        the null by more than that interval is Frobenius structure beyond
        Lemma A2-prime and goes to review.
  minimal_test:
    design: >-
      STAGE 0 (zero compute; delivered in the revision worksheet). The ord_n(2)
      values and stable-subspace lattices at n = 17, 23, 31, 41, 131 and 163
      (AC-1 to AC-8); Lemma A2-prime and the claim (D) identity written out;
      the design means of H1 (AC-10). STAGE 1 (setup). Build the Koblitz toys
      at n = 17 (a = 1; field t^17 + t^3 + 1, the RC-1 field), n = 23 and
      n = 31 (a = 1 first, a = 0 as a second curve). Recompute #E, admit G,
      find lambda, factor Phi_n over F_2, build ker g(sigma) bases, and run the
      Cayley-accident check. STAGE 2 (n = 17, all of G, seconds). For each
      base (stable l = 8 and l = 9; polynomial window l = 9; random V' l = 9;
      the RC-1 null with l = 9): (a) brute-force Sol(R, V) for every x-target;
      (b) common tuples with Sol(sigma^j R, V) for every j; (c) the halving
      route: for every P_1 in F_V, j in 1..n-1 and s = +1 or -1, if 2 P_1 is in
      G set R = (1 - s lambda^j)^{-1} 2 P_1 and P_2 = R - P_1, and record when
      x(P_2) is in V; (d) setwise closure; (e) rule C1 and the random-hash
      filter. STAGE 3 (n = 23, all of G, minutes, estimate). Stages 2(a) to (e)
      on stable l = 11 and 12. STAGE 4 (n = 31, hours, estimate). The halving
      route on stable l = 15 and 16 over all of F_V, and a 200-target seeded
      sample for (a), (d) and (e). n = 41 is arithmetic only: the halving route
      needs about 2^{21} x 80 scalar multiplications, out of pure-Python reach
      (estimate). CHEAPEST VALID DISCRIMINATOR: Stage 2 at n = 17 alone. In
      seconds it decides between the withdrawn per-instance symmetry (all-lost
      fraction 0, closure count positive), a77711's Lemma A2 as written (zero
      common tuples) and Lemma A2-prime (halving-form common tuples at about
      mu), and each of the three predicts a different number.
    controls:
      - 'Stable-base positive control at n = 17 (fixture F0 (i)): squaring transports every certified tuple.'
      - Halving route against brute force, tuple by tuple (fixture F0 (ii)).
      - Ordinary-curve null (RC-1, b not in F_2), same field and same bases.
      - Random-hash filter at rate 1/n, against rule C1.
      - Polynomial window and seeded random V' as non-stable bases.
      - Cayley-accident check per (j, s) before any count is compared with mu.
    required_metrics:
      - '#E, r, h, kappa, lambda and |F_V| per cell and base, recomputed'
      - N_coinc and its per-(j, s) breakdown, with the halving-form flag on every tuple
      - setwise closure count per cell
      - C1 global survival fraction; per-target solution-count histogram w_s; all-lost fraction for C1 and for the random-hash filter
      - null-curve coincidence rate per considered (R, j)
      - certificate (exact point identity) for every counted decomposition
  falsification_conditions:
    - 'A common tuple not of halving form, confirmed by exact group arithmetic: Lemma A2-prime is false or the instrument is wrong; nothing else is read until resolved.'
    - 'N_coinc = 0 on every n = 17 and n = 23 base (design means 4 to 22): H1 fails toward a77711''s original zero; the derivation of claim (C) is re-examined.'
    - 'N_coinc outside its Poisson 99 percent interval on two or more bases, with no Cayley accident flagged: H1''s independence model is wrong.'
    - 'A target whose nonempty Sol(R, V) is closed under some sigma^j: a per-instance Frobenius symmetry exists at that cell and Proposition Sigma is contradicted there; headline, replicate, then review-adversarial.'
    - 'C1 all-lost fraction at or below 0.5 at n = 17 with the fixture passing: equivariance plus H2 is wrong about the loss of the unsound rule.'
    - 'Global C1 survival fraction other than 1/n, or a fixture F0 failure: instrument defect, run void, no evidence either way.'
  confounders:
    - >-
      Abscissa density of a structured V. On a stable or windowed V the
      fraction of abscissas can differ from 1/2 (IDEA-20260926-cafcf1 finds it
      Weil-uncontrolled below l = n/2 + 1). mu therefore uses the measured
      |F_V|, never 2^l.
    - The cofactor h changes kappa (1 at h = 2, 1/2 at h = 4) and is recomputed per curve.
    - >-
      Cayley accidents. If k_{j,s} lies in <-1, lambda>, every P_1 in F_V on a
      stable V gives a coincidence in that channel. Such a channel is a real
      structured effect and is reported separately.
    - Small counts. Means of 4 to 30 give wide Poisson intervals, so cells are pooled only after each passes alone.
    - The tuple order defining C1 (normal-basis necklace order, polynomial-integer order) can correlate with V's structure. Both orders are run.
  interpretation_limits:
    - Proposal only. No experiment, approval, run or result exists here.
    - >-
      Toy tier, m = 2, n in {17, 23, 31}. n = 41 is arithmetic only. Lemma
      A2-prime is general; only its m = 2 count is tested.
    - >-
      Proposition Sigma is cited as a ceiling, not re-proved or extended. This
