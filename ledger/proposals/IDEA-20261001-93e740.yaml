  title: >-
    THE ABSOLUTE FROBENIUS HAS NO PER-INSTANCE SYMMETRY-BREAKING FORM ON A
    KOBLITZ DECOMPOSITION SYSTEM, AND a77711's LEMMA A2 NEEDS ITS SIGNED FORM:
    x -> x^2 carries the system for R to the system for sigma(R) (never to
    itself), so a canonical-representative rule on one instance is unsound
    with a measurable loss law, the only sound Frobenius symmetry breaking is
    gauge fixing of the n-target orbit system, and in sign-free (x-only)
    systems the solution sets of R and sigma^j(R) do share tuples, exactly
    those in which one leg is a half of (1 - s lambda^j) R, at a pre-registered
    Poisson rate; an exhaustive census on the n = 17, 23 and 31 Koblitz toys
  class: control
  claim: >-
    SETTING. E: y^2 + xy = x^3 + a x^2 + b with a, b in F_2 (b = 1), over
    F_{2^n}, n an odd prime. G is a subgroup of E(F_{2^n}) of prime order r with
    r^2 not dividing #E and G meeting E(F_2) only in O. sigma is the absolute
    Frobenius (x, y) -> (x^2, y^2), an endomorphism of E because a, b lie in
    F_2. sigma maps G onto G (unique subgroup of order r) and acts there as a
    scalar lambda with lambda^n = 1 and lambda != 1, so ord(lambda) = n. V is an
    F_2-subspace of F_{2^n} of dimension l, F_V the affine points with x in V.
    The m-leg instance I(R, V) is the set of unordered x-tuples t = {x_1, ...,
    x_m} in V with S_{m+1}(x_1, ..., x_m, x(R)) = 0; Sol(R, V) is its solution
    set.

    (A) THE SYMMETRY CLAIM, RESTATED AS AN EQUIVARIANCE (R4-a). Because S_{m+1}
    has F_2-coefficients, coordinatewise squaring maps Sol(R, V) bijectively
    onto Sol(sigma R, sigma V) (IDEA-20260906-a77711 Lemma A1 read at q = 2;
    IDEA-20260926-9c5694 Proposition T). It carries the system for R to the
    system for sigma(R), not to itself. On a Frobenius-stable V it carries
    Sol(R, V) to Sol(sigma R, V), a different instance. 7ab503's claim (A),
    that the shift is "a genuine extra search-tree symmetry" of the descended
    system on every curve whose (a, b) it fixes, is withdrawn and replaced by
    this sentence. Its prediction (D), a leaf-count division by mu in a normal
    basis, is withdrawn with it.

    (B) DOES ANY PER-INSTANCE SYMMETRY-BREAKING CONSTRAINT SURVIVE (HOLD-R)?
    No Frobenius-derived one does. The ceiling is IDEA-20260926-9c5694
    Proposition Sigma, cited by id and not re-proved: for R of prime order
    r > n, prime n and subspace bases of dimension 2 to n - 2, the stabiliser
    of one fixed-target instance inside the group generated by leg
    permutations, negation and the Frobenius shift is S_m. Consequences. (B1)
    A canonical-representative rule imposed on ONE instance (keep t only if t
    is the least element of its sigma-orbit in a fixed order) is unsound. It
    discards t in favour of sigma^j t, and sigma^j t solves sigma^j R over
    sigma^j V. (B2) The sound Frobenius symmetry breaking is gauge fixing of
    the n-target orbit system (one representative per orbit of (tuple,
    conjugate-target index) pairs). Its quotient is the single-target search,
    and the divisor n cancels exactly; the identity is written out in
    IDEA-20261001-e740ce claim (A). (B3) One per-instance use of Frobenius does
    survive, and it is not a Frobenius symmetry: taking the legs' bases to be
    distinct Frobenius images sigma^i(V) breaks the S_m symmetry in the manner
    of Galbraith-Gebregiyorgis distinct factor bases (KN-LIT-95d1e4; full text
    inputs/GG-2014-806 section 4.2, where distinct bases cost a factor m in
    factor-base size and m^2 in linear algebra), while every leg's unknown stays
    a Frobenius-orbit unknown. The GGMP abstract (KN-LIT-0d9d28) says the
    Frobenius endomorphism improves symmetry breaking for Koblitz curves. Its
    construction was not read here (fetch impediment below), so whether B3 is
    GGMP's construction is recorded as an open pointer, not claimed.

    (C) LEMMA A2 IN SIGN-FREE FORM (derived here). a77711 states that V(I_R)
    and V(I_{R^pi}) are disjoint because "a common decomposition tuple would
    force R = R^pi". That argument is exact for SIGNED point tuples. An x-tuple
    t lies in Sol(R, V) when SOME sign vector eps gives sum eps_i P_i = R. A
    tuple in Sol(R, V) and Sol(sigma^j R, V), 0 < j < n, therefore needs sign
    vectors eps and eps' and s in {+1, -1} with sum eps_i P_i = R and
    sum eps'_i P_i = s lambda^j R. Subtracting,
    2 sum_{i in D} eps_i P_i = (1 - s lambda^j) R, D = {i : eps'_i = -eps_i}.
    D empty forces lambda^j = s, and D = {1..m} forces lambda^j = -s. Both are
    impossible, since ord(lambda) = n is odd. LEMMA A2-PRIME. For every Koblitz
    E, every V, every m >= 2, every R in G minus O and every 0 < j < n, t lies
    in Sol(R, V) and Sol(sigma^j R, V) if and only if some nonempty proper
    signed sub-sum of its legs is a half of (1 - s lambda^j) R, the full signed
    sum being R. At m = 2 the condition is that one leg P_1 satisfies
    2 P_1 = (1 - s lambda^j) R and the other is P_2 = R - P_1. Such tuples are
    sporadic codimension-n events, not a group action on Sol(R, V), so (B)
    stands. They make "no common tuple" false as a prediction. Their count is
    pre-registered under H1.

    (D) THE PRICE OF THE UNSOUND RULE, MEASURABLE. On a stable V let rule C1
    keep a solution tuple iff it is the least of its sigma-orbit. EXACT
    IDENTITY (instrument check). Summed over all R in G minus O, exactly 1/n of
    the incidences (R, t) with t in Sol(R, V) survive. The map
    (R, t) -> (sigma R, sigma t) permutes the incidences in orbits of size n,
    and each orbit holds exactly one pair whose t is canonical. DISCRIMINATOR.
    Under the withdrawn per-instance symmetry, Sol(R, V) is a union of
    sigma-orbits, so no decomposable target loses all its solutions. Under
    equivariance with H2, a target with s solutions loses all of them with
    probability (1 - 1/n)^s. At n = 17 that is about 0.94 for s = 1.

    (E) STRUCTURAL CELLS (R4-c and HOLD-R; recomputed in the revision
    worksheet, arithmetic checks AC-1 to AC-8). The sigma-stable F_2-subspaces
    of F_{2^n} are the kernels ker g(sigma) for monic g dividing T^n - 1 over
    F_2, of dimension deg g. For n an odd prime, T^n - 1 = (T - 1) Phi_n with
    Phi_n the product of (n - 1)/d distinct irreducibles of degree
    d = ord_n(2). So there are 2^{1 + (n-1)/d} stable subspaces, of dimensions
    j d and j d + 1. n = 17: ord 8, dimensions 0, 1, 8, 9, 16, 17. n = 23: ord
    11, dimensions 0, 1, 11, 12, 22, 23. n = 31: ord 5, dimensions 5j and
    5j + 1 for j = 0..6 (128 subspaces). n = 41: ord 20, dimensions 0, 1, 20,
    21, 40, 41. ECC2K-130's degree 131: ord 130, dimensions 0, 1, 130, 131
    only. K-163: ord 162, dimensions 0, 1, 162, 163 only. Neither K-163 nor
    ECC2K-130 hosts a stable V of any index-calculus dimension. The other FIPS
    Koblitz degrees are not restated here; their ord_n(2) census is authored
    once in the EXP-BINSTD-178742 lineage (H-BINSTD-ce4f38 claim (D)).

    WHAT IS DROPPED. 7ab503's parser-bug section (claim (B)) is dropped as
    stale, on HOLD-R's statement that the gap is already fixed. The audit
    script lies outside this card's read scope and was not re-read. The
    normal-basis versus polynomial-basis encodability claim ((C), (D)) is moot
    for a per-instance constraint, which is unsound in every basis. The
    question that survives, whether basis changes the cost of a SOUND orbit
    encoding, belongs to HOLD-I's basis cluster (IDEA-20260922-cdca3a) and to
    IDEA-20261001-b98944. Nothing here claims an ECDLP speedup or an exponent
    move.
  mechanism: >-
    OBJECT FRAME. Representation R1 of RQ-ECDLP-623a32: the x-coordinate in a
    fixed F_2-basis, and the x-tuple of a decomposition. Operation set
    Sigma_op = <leg permutations, negation, sigma> acting on (instance,
    tuple) pairs, NOT on one instance. Trichotomy: partial-action (Class I of
    IDEA-20260806-c5d183). sigma acts on the family of instances
    {I(sigma^j R, sigma^j V)} and moves the target, so on one instance it is no
    action at all. LOSSY-PROJECTION TEST against Sigma_op. The projection
    (R, t) -> C_n-orbit of (R, t) is lossy: it forgets which conjugate, n to 1.
    It propagates deterministically under sigma because sigma is an
    endomorphism commuting with the group law. Restricted to a FIXED R it is
    not defined, because the orbit leaves the instance. That is the algebraic
    reason (B1) is unsound, and it costs no compute. Lemma A2-prime is a second
    projection test: the x-only projection (point tuple -> x-tuple) forgets
    signs, and what it forgets is exactly what lets two conjugate instances
    share an x-tuple (the halving relation of claim (C)). PRICE. Gauge fixing
    on the orbit system costs one canonicalisation per tuple (n squarings and a
    comparison, O(n) field operations). Rule C1 on one instance costs the same
    and loses the fraction of claim (D).
