idea:
  id: IDEA-20260816-293dd3
  question_id: RQ-MCE-b38a8b
  added: '2026-08-16'
  title: 'The matched random code is an instrument too: measure whether the three obvious ways to
    sample a random binary [n,k] code -- rank-rejected parity check, rank-rejected generator, and
    the systematic form [I | A] that implementations actually use -- induce different distributions
    of hull dimension, square-code defect and minimum distance.'
  class: control
  claim: '(A) Every structural measurement in this bucket compares a Goppa arm against a ''matched
    random code'', and the phrase names a convention, not an object. Three conventions are in common
    reach: (i) draw a uniform random (n-k)-by-n parity check and reject on rank deficiency; (ii) draw
    a uniform random k-by-n generator and reject on rank deficiency; (iii) draw a systematic generator
    [I_k | A] with A uniform, which is what most implementations write because it never needs rejection.
    Conventions (i) and (ii) sample uniformly from the Grassmannian of k-dimensional subspaces of
    F_2^n; convention (iii) samples uniformly only from those subspaces admitting the FIRST k coordinates
    as an information set, which is a strict subset. (B) The size of that subset is exactly computable
    and is not a rounding error: the probability that a uniformly random k-subspace has {1..k} as
    an information set is the product over i = 1..k of (1 - 2^(-i)), which converges to about 0.2888
    as k grows. Roughly seventy percent of the uniform ensemble is unreachable by convention (iii).
    Whether that exclusion measurably shifts hull dimension, square-code defect or minimum distance
    is an empirical question with a cheap, exact answer at toy sizes, and its answer is a correction
    factor every other proposal in this bucket needs. (C) NOT CLAIMED: no attack, no security consequence,
    and no claim about this program''s timing, machine variance or cost model -- those audits are
    saturated elsewhere and this is not one of them. This concerns a code ENSEMBLE sampler and involves
    no timing measurement of any kind. (D) A null outcome is fully usable and is the more likely one:
    if the three conventions give statistically indistinguishable distributions for all three statistics
    at all tested (n,k), then every existing and future matched-null arm in this bucket is convention-insensitive
    within a stated bound, and that bound is exactly the reassurance those arms currently lack.'
  mechanism: 'STAGE 1: implement the three samplers exactly as stated, with rejection counted rather
    than hidden, so the realised acceptance rate of conventions (i) and (ii) is itself a reported
    number. STAGE 2: implement the exact combinatorial prediction for convention (iii)''s coverage
    -- the product over i = 1..k of (1 - 2^(-i)) -- and, at the smallest cell where it is feasible,
    CHECK it empirically by drawing uniform codes and counting how many admit {1..k} as an information
    set. That check turns a formula into a measured number and validates the whole framing at a cost
    of seconds. STAGE 3: compute three statistics on every sampled code: hull dimension, square-code
    defect, and exact minimum distance where k <= 20 or a sampled proxy above it. STAGE 4: sample
    2000 codes per convention per cell, which is ten times the sample size other proposals in this
    bucket use, because this contract must be able to bound a null tightly rather than merely fail
    to reject it. STAGE 5: compare the three conventions pairwise on each statistic with a distribution-free
    two-sample test and, crucially, with an EQUIVALENCE test against a pre-declared margin, so that
    ''no measurable difference'' is a bounded statement and not an absence of evidence. STAGE 6: run
    the within-convention self-null: split each convention''s 2000 samples in half and run the identical
    comparison, establishing the test''s own resolution. STAGE 7: report, per statistic and per cell,
    the measured difference between conventions with a confidence interval, and translate it into
    the induced shift in the AUC that proposals 3, 9 and 10 would report if they used the wrong convention.'
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-INSTR-f8faa0's title and scope to confirm what the saturated instrument-audit
      space covers (timing, machine variance, cost models) and that a code-ensemble sampler is not
      in it. Read RQ-MCE-b38a8b's methods block requiring 'honest-versus-honest null cohorts' and
      'domain-separated seeds'. Read the objective and claim_ceiling of EXP-MCE-3ffdf9, which uses
      a 'MATCHED alternant code with a uniformly random multiplier' without specifying the binary-code
      sampling convention. Ran grep -ril 'false.positive rate' and grep -ril 'null' over ledger/proposals/
      to check for existing sampler-validity work. Read docs/inventor-protocol.md section 3.
    results: The saturated instrument-audit space under RQ-INSTR-f8faa0 concerns this program's timing,
      machine variance and cost models; none of it concerns a code-ensemble sampler and none of it
      involves any statistical ensemble at all. RQ-MCE-b38a8b requires honest-versus-honest null cohorts
      and domain-separated seeds, which is a discipline about seeds and cohort structure, not about
      the sampling convention that defines the ensemble. EXP-MCE-3ffdf9 specifies a matched alternant
      null by its multiplier distribution and does not state how its binary comparison codes would
      be drawn. IDEA-20260808-3d3be9 uses matched random and alternant nulls without specifying the
      binary sampler. No record in the repository specifies, compares or validates any code-sampling
      convention, and no record contains an equivalence test against a declared margin for anything.
    verdict: 'UNVERIFIED. The non-uniformity of the systematic-form ensemble is elementary combinatorics
      and this record asserts nothing about how it is treated in any published work. What is claimed
      new is local and modest: every null arm in this bucket names a ''matched random code'' without
      naming a convention, no record here validates a sampler, and the one design element that is
      not routine -- running an EQUIVALENCE test against a pre-declared margin so that a null outcome
      is a bounded statement rather than an absence of evidence -- is standard practice in other fields
      imported here. This is deliberately a small, cheap, high-leverage control rather than a discovery.'
  object_first_candidate:
    tracked_object: The sampling convention itself, treated as the independent variable, together
      with the induced joint distribution of three code statistics (hull dimension, square-code defect,
      minimum distance) over 2000 draws. The object followed through the computation is the convention-to-distribution
      map, and the reported functional is the pairwise distance between conventions in each statistic
      with its confidence interval.
    lossiness: Lossy, and unusually easy to state. Each sampled code -- a k-dimensional subspace of
      F_2^n -- is projected to three small numbers, discarding everything else. The convention itself
      is projected to the induced distribution of those three numbers, discarding every other way
      the ensembles differ. That is compatible with the operation of interest because the operation
      is 'use this code as a null arm in a structural comparison', and a null arm enters such a comparison
      ONLY through the statistics computed on it. If two conventions induce the same distribution
      on every statistic anyone computes, they are interchangeable for this program's purposes even
      though they are different ensembles, and that is precisely the claim an equivalence test can
      make and a significance test cannot.
    propagation: 'One step of the target operation is: draw one code from a convention and feed it
      to a statistic. The propagation of interest is not through the code but through the ensemble
      -- how a convention''s exclusion of certain subspaces shifts the resulting statistic distribution.
      For convention (iii) the exclusion is exactly characterised: subspaces without {1..k} as an
      information set are absent, a set of density about 0.71 for large k. Whether that exclusion
      is correlated with hull dimension or square-code defect is the empirical question; a priori
      it plausibly is, since a subspace lacking an early information set has structure in its first
      k coordinates. The measured shift, translated into the AUC shift it would cause in a downstream
      comparison, is the propagation this contract reports.'
    survival_score: 'The object survives at every (n, k) where the three statistics are computable
      and the samplers are affordable, which at these sizes is everywhere: 2000 draws per convention
      at n <= 64 is minutes of pure Python. Where it dissolves is at large k, where the coverage product
      converges to about 0.2888 and stops changing, so the convention difference stops growing; and
      at very small k, where the product is far from its limit (at k = 8 it is about 0.2896, already
      essentially converged; at k = 2 it is 0.375) and the three conventions are closest. The interesting
      band is therefore all of it, which is convenient, and the reported survival is the interval
      of k over which the measured shift exceeds the equivalence margin.'
  null_object_control: The null object here is the same convention against itself. For each convention
    and each statistic, split the 2000 samples into two halves of 1000 and run the IDENTICAL pairwise
    comparison and equivalence test. That within-convention comparison must show no difference at
    the declared margin; it establishes the test's own resolution and it is the number against which
    every between-convention difference is read. Without it, a between-convention difference of any
    size is uninterpretable because the test's floor is unknown. A second control is a deliberately
    BIASED sampler -- for instance, drawing systematic codes with A restricted to low weight -- which
    must be detected as different by the same machinery. That positive control is what distinguishes
    'the conventions are equivalent' from 'the test cannot see anything', and running it costs one
    extra arm.
  discriminated_from:
  - 'RQ-INSTR-f8faa0''s instrument audits: those concern this program''s timing, machine variance
    and cost models, and 15 or more proposals already occupy that space. This contract measures no
    time and audits no cost model; its subject is a code ensemble and its measurements are combinatorial.'
  - 'RQ-MCE-b38a8b''s requirement for honest-versus-honest null cohorts and domain-separated seeds:
    a discipline about cohort structure and seeding, which says nothing about the convention that
    defines the ensemble from which a cohort is drawn.'
  - 'Proposals 3, 9 and 10 of this set: they CONSUME a matched null; this one measures the generator
    of that null and reports the correction factor they would need.'
  - 'EXP-MCE-3ffdf9''s matched random-multiplier alternant null: a matched null specified by its multiplier
    distribution and never itself validated; this contract validates the binary side of that comparison.'
  - 'A generic statistical power analysis: this is not about sample size but about whether two ensembles
    are the same ensemble, which is an equivalence question with a declared margin rather than a power
    question.'
  assumptions:
  - Rejection sampling on rank for conventions (i) and (ii) yields the uniform distribution over the
    Grassmannian; this is standard and is checked indirectly by the coverage test in STAGE 2.
  - The three named statistics are the ones that matter for this bucket's downstream use; a convention
    difference invisible in all three could still matter to a fourth statistic, and this limitation
    is stated rather than solved.
  - 2000 draws per convention per cell is enough to bound an equivalence at the declared margin; the
    margin and the power calculation are frozen before the run.
  - Exact minimum distance is computable where k <= 20; above that a sampled proxy is used and its
    sampling error enters the comparison, which is reported.
  predictions:
  - metric: measured fraction of uniformly sampled [16,8] codes admitting {1..8} as an information
      set
    direction: different
    minimum_effect: 'forced value: 0.2896 plus or minus 0.02, the product over i=1..8 of (1 - 2^-i).
      This is an exact combinatorial prediction and a miss falsifies either the uniform sampler or
      the information-set test.'
  - metric: difference in mean hull dimension between the systematic-form convention and the uniform
      convention at n=32, k=16
    direction: different
    minimum_effect: 'explicit refusal to pre-commit a magnitude or a sign: the exclusion is large
      but its correlation with hull dimension is not known a priori, and pre-committing would be guessing.
      The pre-registered content is that the difference is reported with a confidence interval and
      read against a declared equivalence margin.'
  - metric: within-convention self-null difference on every statistic
    direction: lower
    minimum_effect: 'forced value: below the declared equivalence margin. A self-null exceeding the
      margin means the test''s floor is above the effect it is meant to detect and voids the cell.'
  - metric: detection of the deliberately biased positive-control sampler (systematic with low-weight
      A)
    direction: higher
    minimum_effect: 'forced value: detected as different on at least one statistic. Failure to detect
      it means the machinery cannot see ensemble differences at all and no equivalence conclusion
      may be drawn.'
  minimal_test:
    design: 'The exact combinatorial check plus one cell settles both the framing and the machinery.
      At n = 16, k = 8, draw 2000 uniform random codes by rank-rejected parity check and count how
      many admit {1..8} as an information set; the answer must be about 0.2896 of them, which is an
      exact prediction. Then draw 2000 codes under each of the three conventions plus the deliberately
      biased positive control, compute hull dimension, square-code defect and exact minimum distance
      on all 8000 codes, and run pairwise equivalence tests against a margin declared before the run,
      plus a within-convention self-null for each. Cost is minutes on one core with no dependency,
      and the minimum distance is exact at k = 8 since 256 codewords enumerate trivially. The discrimination
      is double: a coverage fraction away from 0.2896 falsifies the sampler, and a positive control
      that goes undetected falsifies the test. Only if both pass does the equivalence verdict mean
      anything, and at that point the correction factor for every other null arm in this bucket is
      in hand.'
    controls:
    - 'Within-convention self-null: a 1000/1000 split of each convention, run through the identical
      comparison.'
    - 'Deliberately biased positive control: systematic form with A restricted to low weight, which
      must be detected as different.'
    - Exact combinatorial coverage check of the systematic ensemble's density against the product
      formula.
    - Rejection-rate reporting for conventions (i) and (ii), so that the acceptance process is visible
      rather than hidden.
    - Two independent seeds per convention per cell, with the whole comparison replicated.
    required_metrics:
    - raw per-sample values of all three statistics per convention
    - pairwise between-convention difference with confidence interval per statistic
    - within-convention self-null difference
    - measured systematic-ensemble coverage fraction against the product formula
    - positive-control detection outcome
    - rejection rate per convention
    - induced AUC shift a downstream comparison would inherit
  falsification_conditions:
  - Measured coverage fraction differing from the product formula beyond the stated tolerance falsifies
    the uniform sampler or the information-set test.
  - A within-convention self-null difference exceeding the declared equivalence margin voids that
    cell.
  - Failure to detect the deliberately biased positive control forbids any equivalence conclusion
    from the run.
  - A between-convention difference that does not replicate under the second seed is an artefact and
    must not be reported as a bias.
  - Exact minimum distance disagreeing between two conventions in a way that also appears in the self-null
    indicates the statistic, not the convention, is unstable.
  confounders:
  - The three statistics may all be insensitive to the exclusion while a fourth is not; an equivalence
    verdict is always relative to the statistics tested and is stated that way.
  - At very small k the coverage product is far from its limit and the conventions are closer, so
    small cells understate any difference.
  - The sampled minimum-distance proxy above k = 20 introduces its own sampling error into the comparison.
  - Mersenne Twister structure could in principle correlate draws within a convention; two independent
    seed families are the only defence offered.
  - An equivalence margin chosen too loose makes equivalence easy and meaningless, which is why it
    is frozen in advance and reported on the face of every result.
  interpretation_limits:
  - An equivalence verdict is relative to the three statistics tested, the tested (n,k), and the declared
    margin, and it is not a statement that the ensembles are the same.
  - This is a control on a sampler and carries no structural or security content whatsoever.
  - Results do not extrapolate to larger n, though the coverage product's convergence means the exclusion's
    SIZE is essentially constant above modest k, which is a separate and exact fact.
  - Nothing here audits this program's timing, machine variance or cost models, and it must not be
    cited as if it did.
  target_complexity:
    time_exponent: No attack exponent is claimed. Sampling and statistic computation are polynomial
      and cheap; no adversary is constructed.
    memory_exponent: No attack memory exponent is claimed. Peak memory is the codebook enumeration
      for exact minimum distance where k <= 20, at most 2^20 codewords held as ints, with a hard cap.
    best_known: 'There is no incumbent within this repository: no code-sampling convention is specified,
      compared or validated anywhere. The incumbent in practice is whatever convention an implementer
      happens to write, which is the situation this contract exists to replace with a measured bound.'
    hidden_overhead: 'Hidden in the margin: an equivalence test is only as strong as its declared
      margin, and choosing that margin is judgement work whose cost is invisible in the result unless
      the margin is printed alongside every verdict, which this contract requires. Hidden in the human
      cost: the temptation to adopt the systematic-form convention because it needs no rejection,
      which is exactly how an unstated bias enters every downstream null arm.'
  dominated_by: 'n/a (no result claimed). Pareto check applies vacuously: no adversary is constructed
    and no attack cost is produced, so no time/memory/data frontier row is occupied. As a control
    it is dominated by nothing currently in this repository, because nothing currently in this repository
    does it.'
  sota_delta: 'no attack; conceptual/measurement contribution only. Quantitative delta: zero validated
    code-sampling conventions in this repository before; after, three conventions compared on three
    statistics at up to four cells with declared equivalence margins, a positive control, a within-convention
    self-null, and a stated correction factor for the AUC that every other null arm in this bucket
    would inherit.'
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'P(the measured systematic-ensemble coverage matches the product formula
    within tolerance) = 0.9; this is exact combinatorics and its failure would indicate a sampler
    bug, which is precisely why it is the first check. P(the deliberately biased positive control
    is detected) = 0.85. P(the three conventions are equivalent within a reasonable margin on all
    three statistics) = 0.55 -- genuinely uncertain, and either outcome is useful: equivalence gives
    every other null arm in this bucket a bound it currently lacks, and non-equivalence gives them
    a correction factor they currently need. P(a between-convention difference, if seen, replicates
    under a second seed) = 0.6. P(this control is actually adopted by the other proposals in this
    set) = a Coordinator decision, not a probability I am entitled to assert.'
