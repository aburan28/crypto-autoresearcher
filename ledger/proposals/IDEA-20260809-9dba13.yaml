idea:
  id: IDEA-20260809-9dba13
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-TECDSA-8d340d
  goal_id: GOAL-TECDSA-001
  title: >-
    Proofs are not binary: measure extraction cost as the zero-knowledge
    challenge length is reduced, because that is what implementations actually tune
  class: measurement
  claim: >-
    Implementations rarely omit a proof outright; they tune its parameters for
    performance, most often the challenge length or repetition count that sets the
    soundness error. The claim is that extraction cost is a smooth and measurable
    function of that parameter, that the practically dangerous region begins well
    before the parameter reaches zero, and that the curve identifies a threshold
    an implementer can check against.
  mechanism: >-
    Parameterize each proof's soundness error; for each setting, run the
    corresponding attack with a cheating prover that succeeds with probability
    determined by the soundness error; measure the sessions and work required for
    extraction.
  why_not_a_renamed_known_approach: >-
    Soundness error is a standard parameter with a standard interpretation. The
    contribution is the measured end-to-end extraction cost as a function of it,
    which converts a per-proof soundness statement into a protocol-level cost the
    implementer can compare against a performance saving.
  predictions:
  - observable: extraction cost versus proof soundness error
    metric: sessions and work per setting
    predicted: Falling sharply as the soundness error grows; the knee of the curve is the deliverable.
  - observable: whether the knee sits at parameter values a performance-motivated implementer might choose
    metric: comparison against plausible tuning ranges
    predicted: >-
      Plausibly yes, which is the practical point. If the knee is far outside any
      plausible tuning, the parameter is robust and that is a clean positive.
  minimal_test: >-
    Sweep the soundness parameter of one proof across a declared range at toy
    sizes, measure extraction cost at each, and report the curve with its knee.
  controls:
  - 'SPECIFIED-PARAMETER CONTROL: at the specification''s parameter value, extraction must fail within the declared budget.'
  - 'CHEATING-PROVER VALIDATION: the cheating prover''s success rate must match the soundness error, verified independently, or the sweep measures the prover rather than the parameter.'
  falsification_conditions:
  - Extraction cost is flat across the range.
  - The cheating prover's measured success rate does not track the soundness error.
  interpretation_limits: >-
    Against this program's reference implementation at toy sizes; the knee's
    location may move with scale and the record says so.
  sota_delta: 'Delta: a protocol-level cost curve in a parameter that is otherwise reasoned about only through its per-proof soundness meaning.'
  dominated_by: Downstream of IDEA-20260809-986269; not dominated by any corpus record.
  estimated_cost: Implementation medium; compute moderate.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for soundness parameter tuning: no records. WEB NOT CHECKED.'
  source_refs:
  - Zero-knowledge proof specifications used in threshold ECDSA -- REQUIRED READS.
