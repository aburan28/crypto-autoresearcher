  assumptions:
    - >-
      A coefficient of c * s1 depends on all 256 coefficients of the
      corresponding s1 block, i.e. no non-trivial coefficient of the ring
      product is computable from a strict subset of one operand's
      coefficients when the other operand is a generic element of B_tau. This
      is the whole granularity claim, it is an algebraic statement, and stage
      1 must PROVE it rather than assume it -- including the boundary case
      where c is sparse enough (tau nonzeros out of 256) that some products
      may in fact be determined by a subset. THAT BOUNDARY CASE IS THE MOST
      LIKELY PLACE THIS RECORD IS WRONG, and it is where its upside also
      lives: c has only tau in {39, 49, 60} nonzero coefficients, so a
      coefficient of c * s1 is a sum of exactly tau products, and knowing the
      tau relevant s1 coefficients suffices for THAT coefficient. If a forger
      needs only a few coefficients of c * s1 rather than whole blocks, the
      granularity ratio collapses from 256 toward tau and the surface's
      interior opens up.
    - >-
      The advice adversary has no faults, no side channels, and no signature
      transcript. Any relaxation of this puts the work in a different
      question.
    - >-
      One pinned estimator and cost model across every surface point, with
      memory charged identically, since the deliverable is a comparison.
  proof_search_map:
    bottleneck: >-
      The step where advice is converted into a reduced instance, and
      specifically whether that conversion is coefficient-granular (cheap
      advice, lattice benefit only) or block-granular (expensive advice,
      forgery benefit). The record's outcome is decided entirely there.
    baseline_embedding:
      parameter_slice: >-
        (j, g) = (0, 0), which is exactly the published three-corner minimum,
        and (j, g) = (l, 0), which is full knowledge of s1 and a polynomial-
        time forgery. Both endpoints have known values.
      reproduction_check: >-
        The surface evaluated at (0, 0) must reproduce this program's own
        pinned figures for MLWE, MSIS and SelfTargetMSIS to the estimator's
        precision, and at (l, 0) must return polynomial cost. A frozen fixture
        pins both. If the surface does not reproduce its own corners it is not
        an extension of the baseline and nothing interior is reportable.
    observation_collision:
      observable: "C(j, g), and the argmin over the grid."
      distinct_preimage_search: >-
        Two different partial assignments with the same (j, g) but different
        residual beta would be a collision falsifying (j, g) as a sufficient
        statistic; stage 4's fibre sampling hunts it directly with 30 draws at
        ten grid points. A second and more dangerous collision: advice that
        reduces the lattice dimension WITHOUT reducing entropy about the
        secret -- the null-advice control -- which would produce a lower beta
        with no information gained and would make the whole surface an
        artefact. That is why the null advice control is first-class and not
        optional.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: >-
          The certificate family is enlarged from "an adversary solving one
          of three named problems" to "an adversary holding (j, g) advice and
          solving the residual problem", of which the three named adversaries
          are the boundary cases. The obligation is a STRICT inward
          improvement -- an interior point strictly below every corner -- not
          merely the observation that the interior is non-empty.
        predicted_gain: >-
          Predicted zero at FIPS 204 parameters, because of the granularity
          obstruction of clause (C). The record is written so that zero is a
          reportable result with a measured obstruction rather than a null
          session. Predicted non-zero only if the tau-sparsity boundary case
          in the assumptions block turns out to collapse the granularity ratio
          from 256 toward tau, in which case the gain is the difference
          between the corner minimum and the interior argmin, in bits.
      - transform: specialization_pack
        proposed_object: >-
          A resource measure counting advice in BITS OF SECRET ENTROPY rather
          than in coefficients or blocks, so that the two granularities become
          comparable and charges are added only over the proved-disjoint
          blocks of s1.
        predicted_gain: >-
          Makes stage 6's cascade table possible at all: without a common bit
          scale a fault result and an enumeration result cannot be placed on
          one surface.
    quantifier_order: >-
      FOR EACH FIPS 204 category k, and FOR the pinned estimator E and cost
      model M, THERE EXISTS (or does not exist) a grid point (j, g) with
      C(j, g) strictly below min over the three corners by at least the stated
      minimum effect. The witness (j, g) is allowed to depend on k. The claim
      is NOT that a single (j, g) works for all categories, and it is NOT a
      claim about adversaries whose advice is not of this shape.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Under estimator E and cost model M, at ML-DSA-k, the advice surface
        C(j, g) attains its minimum at (j*, g*) with value V, against a
        three-corner minimum of V0; the gap is V0 - V bits; at reduced
        parameters P the predicted cost ratio between (j*, g*) and (0, 0)
        appeared as a measured ratio R with certificates." The method cannot
        certify anything about advice of a different shape (linear relations,
        approximate values, hints on s2 or t0), and it cannot certify that no
        cheaper advice-purchasing strategy than enumeration or
        meet-in-the-middle exists.
      nearby_object_control: >-
        A signature scheme identical to ML-DSA but with a DIAGONAL secret --
        s1 acting coefficientwise rather than by ring convolution. On that
        object the granularity ratio is 1 by construction, the two axes
        coincide, and an interior minimum should appear if the method can see
        one at all. A method that finds no interior minimum on the diagonal
        object has not identified convolution as the obstruction; it has
        merely failed to search. This control is what separates a measured
        obstruction from a fatigue report and it is mandatory.
    proof_obligations:
      - claim: "A coefficient of c * s1 requires the tau s1-coefficients selected by c's support, and no fewer."
        responsibility: correctness
      - claim: "The surface reproduces the three published corners at (0, 0) and polynomial cost at (l, 0)."
        responsibility: baseline
      - claim: "Removing one known coefficient reduces the residual lattice dimension by exactly one and leaves the determinant unchanged."
        responsibility: size
      - claim: "C_advice is a valid LOWER bound including the information-theoretic floor, and its meet-in-the-middle variant charges memory."
        responsibility: memory
      - claim: "Null advice yields an unsolvable residual instance and no forging advantage."
        responsibility: correctness
      - claim: "(j, g) is a sufficient statistic, or the fibre spread is reported and the surface is withdrawn."
        responsibility: strictness
      - claim: "The diagonal-secret nearby object exhibits an interior minimum, demonstrating the method can find one."
        responsibility: feasibility
      - claim: "Reduced-parameter forgeries carry re-verified certificates and are reported at toy tier."
        responsibility: scope
  predictions:
    - metric: "granularity ratio: bits of advice per unit useful for forging, divided by bits per unit useful for lattice reduction"
      direction: higher
      minimum_effect: >-
        predicted exactly 256 if forging needs whole blocks; predicted tau,
        i.e. 39 / 49 / 60, if the sparsity of c collapses it as flagged in the
        assumptions. Any value at or below tau is the high-information outcome
        and reopens the interior.
    - metric: "V0 - V: three-corner minimum minus interior argmin, in classical core-SVP bits, per category"
      direction: lower
      minimum_effect: >-
        predicted zero (no interior point below the corners). A gap of 10 bits
        or more at any category is a finding that the binding constraint is a
        composite rather than any single named assumption, and is routed to
        independent review rather than reported.
    - metric: "affordable advice budget: coefficients purchasable below the lattice arm, direct and meet-in-the-middle"
      direction: different
      minimum_effect: "must reproduce 53 and 106 at ML-DSA-44 to within one coefficient, or the recalled entropy or lattice figure is wrong"
    - metric: "beta reduction per 100 known coefficients on the residual MLWE instance"
      direction: lower
      minimum_effect: >-
        this program has never measured it; any value is informative, and the
        record must report it with its fibre spread. A reduction exceeding
        0.35 beta per coefficient would make the meet-in-the-middle budget
        self-financing and is the quantitative condition for an interior
        minimum to exist.
    - metric: "NULL ADVICE: residual solvability and forging success rate"
      direction: different
      minimum_effect: "must be indistinguishable from the zero-advice adversary; any improvement voids the surface"
    - metric: "DIAGONAL-SECRET CONTROL: interior minimum present"
      direction: different
      minimum_effect: "must be present, or the method cannot detect one and no negative result is reportable"
  minimal_test:
    design: >-
      Stages 1 and 2 are the minimal test and cost hours of symbolic work plus
      exact arithmetic: prove or refute the block-granularity claim, and
      compute the affordable advice budget. THAT ALONE DISCRIMINATES, because
      the granularity ratio has two candidate values known in advance (256 if
      whole blocks are needed, tau if c's sparsity suffices) and they lead to
      opposite conclusions about whether the surface has an interior. Stage 3
      adds a grid of estimator invocations, still cheap. Stage 4's fibre
      sampling and stage 5's certified execution at reduced parameters are the
      expensive parts and should be scheduled only if stage 1 returns the tau
      value rather than 256. The diagonal-secret control and the null-advice
      control run with stage 3 and are not deferrable, since without them a
      negative result is a fatigue report.
    controls:
      - "NULL ADVICE: advice independent of the key; residual must stay unsolvable and forging unimproved."
      - "s2-ADVICE NULL: same entropy on s2; must help the lattice branch and not the forging threshold."
      - "DIAGONAL-SECRET NEARBY OBJECT: granularity ratio 1 by construction; an interior minimum must appear."
      - "CORNER REPRODUCTION: (0,0) reproduces the three published figures; (l,0) is polynomial."
      - "FIBRE SAMPLING: 30 assignments at each of 10 grid points; report the spread in residual beta."
      - "MEMORY CHARGED in every meet-in-the-middle row; no square-root time saving reported memory-free."
    required_metrics:
      - "the granularity ratio, derived symbolically, with the proof or refutation of the block claim"
      - "C_advice(j, g) by enumeration, by meet-in-the-middle with memory, and the information-theoretic floor"
      - "C_residual(j, g) for both the key-recovery and forgery branches, beta and core-SVP bits"
      - "the full surface, its argmin, and V0 - V per category"
      - "beta reduction per known coefficient, with fibre spread"
      - "null-advice and s2-advice control outcomes"
      - "diagonal-secret control outcome"
      - "stage 5 measured cost ratio with re-verified forgery certificates, at declared reduced parameters"
      - "stage 6 cascade table with every entry's provenance and an explicit acquisition-cost caveat"
  falsification_conditions:
    - "Stage 1 proves forging needs whole ring blocks: the granularity ratio is 256, the advice budget buys zero blocks, the surface has no interior, and the lane closes at the section-4 standard with a measured obstruction and forward guidance toward advice shapes this record does not cover (linear relations on s1, approximate coefficient values, advice on s2 or t0)."
    - "Stage 1 shows tau coefficients suffice for a coefficient of c * s1: the granularity ratio collapses toward tau, the interior may be non-empty, and stages 3-5 become mandatory rather than optional."
    - "The corner reproduction fails: the surface is not an extension of the baseline and nothing is reportable."
    - "Null advice improves the residual instance: the surface measures dimension rather than information and is void."
    - "The diagonal-secret control shows no interior minimum: the method cannot detect one, so a negative on ML-DSA is uninformative and must be reported as such rather than as a closure."
    - "Fibre spread at fixed (j, g) exceeds the claimed interior gap: (j, g) is not a sufficient statistic and the surface must be re-parameterised before any argmin is claimed."
    - "V0 - V exceeds 10 bits at any category and survives every control: escalate to independent review; this would be a statement that a fielded standard's binding constraint is mis-identified and it does not leave the program on a subagent's say-so."
  confounders:
    - "The sparsity of c is the dominant confounder and it cuts both ways: tau nonzeros out of 256 mean a single coefficient of c * s1 needs only tau s1-coefficients, which could collapse the granularity ratio; but the forger does not get to choose c, since c is the hash output, so the tau positions are adversarially unhelpful and vary per attempt. Stage 1 must handle the fact that the SUPPORT of c is determined after the advice is fixed."
    - "The classical hybrid attack's gains are known to depend on secret SPARSITY, and ML-DSA's secrets are uniform with full support. A surface built with sparse-secret intuitions will overstate the g axis; the estimator rows must use the exact uniform-on-[-eta,eta] distribution."
    - "Meet-in-the-middle over the advice block requires storing 5^(g/2) entries; at g = 106 that is 2^123 entries, which is not a machine, it is a bound. Every meet-in-the-middle row must show its memory next to its time or the row is meaningless."
    - "Reduced-parameter execution in stage 5 changes tau, l and eta together, and the granularity ratio depends on all three. The reduced family must preserve the RATIO, not merely be small, or stage 5 measures a different object."
    - "591f9d's documented instrument discrepancy propagates into every absolute figure; the deliverable is differences on one instrument for exactly that reason."
  interpretation_limits:
    - "No fault, no side channel, no signature transcript. Any statement about deployed implementations is out of scope and the cascade table in stage 6 is explicitly a placement of other people's results on a scale, not a claim about them."
    - "A negative result closes exactly the advice shape defined here -- exact values of individual s1 coefficients and complete s1 blocks. It says nothing about linear or approximate advice, about advice on s2 or t0, or about advice obtained non-mathematically."
    - "Reduced-parameter measurements are toy tier per RQ-MLDSA-001's claim_tier_ceiling and support the FIPS 204 rows only through a stated transfer assumption."
    - "An interior minimum, if found, is a statement about an ESTIMATE under one cost model. It is not a forgery and not a break, and the escalation path exists so that it is not reported as one."
  heuristic_assumptions:
    - id: H1
      statement: >-
        For an MLWE instance of dimension 256(l + k + 1) with 256 j + g
        coefficients of the secret revealed and removed, the residual
        instance's primal block size beta(j, g) is the block size predicted by
        the standard unique-SVP criterion for a lattice of dimension
        256(l + k + 1) - 256 j - g, determinant q^(256 k), and secret norm
        reduced by the removed coefficients' contribution -- uniformly over
        WHICH coefficients are revealed, for revealed fractions up to 20
        percent.
      rigorous_support: >-
        Rigorous ingredient: removing a known coefficient is an exact
        projection of the lattice along one coordinate, and the resulting
        determinant and secret norm are computed exactly, not modelled. The
        classical statement imitated is the 2016-estimate unique-SVP success
        condition, which is the same model every MLWE figure in this ledger
        and in the FIPS 204 lineage rests on. The heuristic content is the
        UNIFORMITY over which coefficients are revealed, which is the
        assumption stage 4's fibre sampling exists to test.
      validation_plan: >-
        At reduced ring degree n in {16, 32, 64} and module ranks matching
        ML-DSA-44's (l, k) ratio, generate 200 instances per cell, reveal
        fractions in {0, 2.5, 5, 10, 20} percent chosen uniformly at random,
        and measure the block size at which lattice reduction recovers the
        remaining secret. Compare the empirical beta against the criterion's
        prediction. TAIL CHECK: report the spread across the 30 different
        revealed-coefficient sets at each fixed fraction, and specifically the
        BEST (lowest beta) set, not the mean -- an adversary chooses, and a
        heavy lower tail is an advantage the mean hides. Report also whether
        revealing coefficients concentrated in one block behaves differently
        from revealing them spread across blocks; a difference there is a
        direct signal about the granularity claim. Sampled parameters and the
        revealed-set seeds recorded. TRANSFER ASSUMPTION: degree 64 to 256,
        stated and fitted.
    - id: H2
      statement: >-
        Over the randomness of the challenge c drawn from B_tau by
        SampleInBall, the number of DISTINCT s1 coefficients whose values are
        required to compute any fixed set of m coefficients of c * s1 is
        concentrated at min(256, m * tau * (1 - o(1))) with deviation below 5
        percent for m up to 8 and tau in {39, 49, 60}.
      rigorous_support: >-
        Rigorous ingredient: each coefficient of c * s1 is exactly a signed
        sum of tau coefficients of s1, by the definition of negacyclic
        convolution and the fact that c has exactly tau nonzero entries -- an
        identity, not an estimate. The classical distribution statement
        imitated is the coupon-collector / random-subset union bound for
        m independent tau-subsets of a 256-set, which gives the union size
        concentration above.
      validation_plan: >-
        Sample 100,000 challenges by an implementation of SampleInBall at each
        of tau in {39, 49, 60}, and for m in {1, 2, 4, 8} compute the exact
        union of required s1-coefficient indices. Compare the empirical CDF of
        the union size against the random-tau-subset prediction. TAIL CHECK:
        report the SMALLEST union observed over all samples, since an
        adversary needs only one favourable challenge and the minimum, not the
        mean, is what a forgery strategy would exploit; compare that minimum
        against the predicted lower tail. This is cheap, needs no lattice
        software, and it is the single measurement that decides whether the
        granularity ratio is 256 or nearer tau. Sampled parameters recorded.
        TRANSFER ASSUMPTION: none -- these are the real FIPS 204 tau values
        and the real sampler, so this validation runs at full scale.
  target_complexity:
    time_exponent: >-
      Target: min over (j, g) of max( (2 eta + 1)^((256 j + g)/2) [meet-in-the-
      middle, memory-charged], 2^(0.292 beta(j, g) + o(beta)) ), against the
      incumbent min over the three corners, which at ML-DSA-44 is recalled as
      approximately 2^123.5 for the lattice arm and 2^192.760 for the hash
      arm. PREDICTED: the min is attained at (0, 0) and the incumbent stands;
      the record's value is then the measured obstruction. Stated as an
      exponent rather than as "cheaper" because the whole claim is whether a
      strict inequality holds between two exponents.
    memory_exponent: >-
      max( (2 eta + 1)^((256 j + g)/2), 2^(0.2075 beta(j, g)) ). At the largest
      affordable g the meet-in-the-middle term reaches 2^123 entries at
      ML-DSA-44, which EXCEEDS the sieve's own memory at that beta, so the
      interior of this surface is memory-dominated and any interior point must
      be reported with its memory or it is not a result. This is the most
      likely way an apparent interior gain evaporates and it is disclosed
      here rather than discovered later.
    best_known: >-
      min(MLWE primal, MSIS, SelfTargetMSIS) as published in the FIPS 204
      lineage and as recomputed in this ledger, with the standing caveat that
      this program's instrument disagrees with a recalled published block size
      by about 355 (IDEA-20260805-591f9d).
    hidden_overhead: >-
      Three. First, the meet-in-the-middle square root assumes a collision
      structure over the advice block that may not exist for uniform
      full-support secrets; if it does not, C_advice is the full enumeration
      and the surface's interior is empty by a wider margin. Second, the
      o(beta) sieve overheads are charged identically at every surface point
      and cancel only in differences. Third, and most important, the advice
      adversary must VERIFY each candidate advice assignment, and that
      verification cost is not free -- it is a residual lattice reduction per
      candidate unless a cheap filter exists, which would multiply C_advice by
      C_residual instead of maxing them. THE max() IN THE SURFACE DEFINITION
      IS ITSELF AN OPTIMISTIC MODELLING CHOICE and stage 3 must justify it or
      replace it with a product.
    tradeoff_note: >-
      The surface IS a time-memory tradeoff, and the van Oorschot-Wiener
      interpolation applies to the meet-in-the-middle axis in its standard
      form: with memory w the advice search costs time (2 eta + 1)^(256 j + g)
      / w, interpolating between full enumeration at w = 1 and the square-root
      point. Every surface point must therefore be reported as a
      (time, memory) pair and the argmin taken under a declared memory cap;
      an argmin at unbounded memory is not a result this program reports.
      Parallelization: the advice axis is embarrassingly parallel; the lattice
      axis is not, and the two must not be parallelised in the same units.
  dominated_by: >-
    Predicted: dominated on every axis by (i) the primal MLWE attack at
    2^(0.292 beta_SKR) time, 2^(0.2075 beta_SKR) memory, no data -- which is
    the (0,0) corner of this very surface and is why the predicted result is
    a closure. Other frontier rows checked: (ii) the SelfTargetMSIS hash arm
    at 2^192.760 / 2^225.345 / 2^257.015 time, negligible memory, no data
    (5194f9) -- dominates on memory but not on time; (iii) the claw
    interpolation max(C_reduce, |B_tau|) (c1abd1) -- if correct, dominates
    the hash arm on time at equal memory, and is a corner value here;
    (iv) the depth-capped quantum rows (fe3cee), on a separate depth axis;
    (v) fault- and side-channel-assisted recoveries (818196, 6e79b4, and the
    published results they cite) -- these are NOT Pareto-comparable, because
    they consume a physical access resource this adversary does not have, and
    treating them as dominating would be a category error; (vi) transcript
    attacks (4d4e5f, RQ-MLDSA-ffa0f5's t0 lane), which consume signature data
    this adversary does not have. If an interior point survives every control,
    it dominates (i) on time at higher memory and the dominated_by field
    becomes (i) on the memory axis only -- which the record must then state
    explicitly rather than claiming an unqualified improvement.
  sota_delta: >-
    Quantitatively: V0 - V in classical core-SVP bits per category, at a
    declared memory cap, against an incumbent V0 - V of exactly zero by
    construction (the published number IS V0). Predicted delta: zero, with the
    granularity ratio (predicted 256, alternative tau) as the measured
    obstruction and the beta-reduction-per-revealed-coefficient rate as a
    reusable quantity this program does not currently have for ML-DSA at any
    parameter set. The smallest V0 - V worth reporting as a finding rather
    than instrument noise is 10 bits.
