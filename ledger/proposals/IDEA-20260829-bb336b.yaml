idea:
  id: IDEA-20260829-bb336b
  question_id: RQ-MLDSA-001
  goal_id: GOAL-MLDSA-001
  added: '2026-08-29'
  proposed_by: idea-generator
  status: proposed
  title: >-
    ML-DSA's security is quoted as a MINIMUM over three assumptions, which is
    the value of a cost surface at its three CORNERS. Build the interior: the
    two-dimensional advice surface C(j, g) -- j whole ring blocks of s1 known,
    g loose coefficients known inside the remaining blocks -- with no fault
    and no side channel, advice bought only by enumeration or meet-in-the-
    middle. The predicted obstruction is a GRANULARITY MISMATCH: ring
    convolution makes advice useful for forging only in whole 256-coefficient
    blocks, while it helps lattice reduction one coefficient at a time, so the
    two axes cannot be spent against each other. Measure that mismatch instead
    of asserting it.
  class: composition
  claim: >-
    (A) WHAT THE PUBLISHED NUMBER ACTUALLY IS. FIPS 204's category claim, and
    every RQ-MLDSA-001 record that has costed it, evaluates three separate
    problems and reports the smallest: MLWE key recovery, MSIS, and
    SelfTargetMSIS (whose own two arms IDEA-20260805-5194f9 and
    IDEA-20260808-c1abd1 have already opened up). A minimum over three
    incomparable adversaries is the value of a cost function AT THREE POINTS.
    An adversary is not obliged to stand at a corner.
    (B) THE INTERIOR, DEFINED SO IT IS A SURFACE AND NOT A SLOGAN. Let the
    ADVICE be a partial assignment to the signing key's s1 component. Because
    s1 lies in R^l with R = Z[X]/(X^256 + 1), advice comes in two
    inequivalent granularities and the whole proposal turns on the difference:
    j = the number of COMPLETE ring blocks of s1 known, 0 <= j <= l;
    g = the number of INDIVIDUAL coefficients known inside the l - j blocks
    that are not complete, 0 <= g <= 256 (l - j).
    Define the surface
    C(j, g) = max( C_advice(j, g), C_residual(j, g) )
    where C_advice is the cheapest purely mathematical cost of obtaining that
    advice -- direct enumeration at (2 eta + 1) values per coefficient, or a
    meet-in-the-middle over the advice block, no fault, no side channel, no
    signature transcript -- and C_residual is the cost of completing a forgery
    or a key recovery given it. The three published numbers are
    C(0, 0) restricted to each of the three problems. THE CLAIM IS THAT THE
    SURFACE EITHER HAS AN INTERIOR POINT STRICTLY BELOW EVERY CORNER, IN WHICH
    CASE THE BINDING CONSTRAINT AT THAT FIPS 204 CATEGORY IS NOT ANY OF THE
    THREE NAMED ASSUMPTIONS BUT A COMPOSITE, OR IT DOES NOT, IN WHICH CASE THE
    SEPARATION OF THE THREE ASSUMPTIONS IS A MEASURED FACT RATHER THAN AN
    ASSUMED ONE. RQ-MLDSA-001's decision_target is "whether ML-DSA's binding
    assumption is correctly identified"; the possibility that it is not any of
    the listed ones has never been tested here.
    (C) THE PREDICTED OBSTRUCTION, DERIVED BEFORE THE RUN AND STATED AS THE
    LIKELY OUTCOME. The two axes are not interchangeable, and the reason is
    the ring convolution. To evaluate the signing relation z = y + c s1 the
    forger needs the polynomial product c * s1 block by block, and a single
    coefficient of c * s1 depends on ALL 256 coefficients of the corresponding
    s1 block. Knowing 255 of 256 coefficients of a block yields NO coefficient
    of c * s1 for that block. Advice is therefore useful for FORGING only at
    block granularity, in units costing (2 eta + 1)^256 to buy. Advice is
    useful for LATTICE REDUCTION at coefficient granularity, one unknown
    removed per coefficient. The g axis buys lattice dimension and cannot buy
    forgery; the j axis buys forgery and is unaffordable. PREDICTION: the
    surface has no interior minimum, and the obstruction that blocks it is
    this granularity mismatch, measured as the ratio between the entropy per
    unit of forging-useful advice (256 log2(2 eta + 1) bits per block) and the
    entropy per unit of lattice-useful advice (log2(2 eta + 1) bits per
    coefficient) -- a factor of exactly 256 at every FIPS 204 category, which
    is a derived integer and not an estimate.
    (D) THE BUDGET, IN NUMBERS, SHOWING WHY THIS IS DECIDABLE RATHER THAN
    OPEN-ENDED. At ML-DSA-44 with RECALLED (l, eta) = (4, 2), s1 carries
    1024 coefficients at log2 5 = 2.3219 bits each, i.e. 2378 bits of entropy;
    the recalled lattice arm sits near 2^123.5 classical core-SVP. An advice
    budget that does not already exceed the lattice arm is therefore at most
    123.5 / 2.3219 = 53 coefficients by direct enumeration, or about 106 under
    a perfect square-root meet-in-the-middle -- that is 5.2 or 10.4 percent of
    s1, and ZERO complete ring blocks, since one block costs
    256 * 2.3219 = 594 bits. THE g AXIS IS THE ONLY AFFORDABLE ONE AND IT IS
    THE ONE THAT CANNOT BUY A FORGERY. That is the obstruction stated as
    arithmetic. What remains genuinely open, and is the reason to run rather
    than to assert, is how much a 4.6 percent dimension reduction (106 of 2304)
    actually moves beta -- a quantity this program has never measured and which
    the standard hybrid-attack literature computes for SPARSE secrets, whereas
    ML-DSA's secrets are uniform on [-eta, eta] with full support.
    (E) THE CASCADE, WHICH IS WHY THE SURFACE IS WORTH BUILDING EVEN IF ITS
    INTERIOR IS EMPTY. Every published fault and side-channel result against
    ML-DSA delivers advice of exactly this shape, and this program already
    holds two records about it (IDEA-20260805-818196 computes the RANK of the
    affine constraint system a fault induces; IDEA-20260828-6e79b4 folds a
    sub-full-rank fault hint together with the t0 truncation into one lattice).
    Neither prices its advice on a mathematical cost scale, because no such
    scale exists in this program. THE SURFACE IS THAT SCALE. Once C(j, g) is
    known, any published attack that delivers (j, g) has its total cost read
    off the surface as a corollary, and the fault-recovery boundary 818196
    computes by rank acquires a bit value. This is the reduction-network move
    the target profile asks for, applied to advice rather than to problems.
    (F) WHAT IS NOT CLAIMED, EMPHATICALLY. No fault is injected, no side
    channel is used, no signature transcript is consumed: C_advice is a
    MATHEMATICAL cost, paid in enumeration. No forgery against FIPS 204
    parameters is claimed, and the only certified forgeries in the minimal
    test are at reduced parameters where the certificate is re-verifiable per
    docs/claims-and-verification.md.
  mechanism: >-
    STAGE 0, THE LOSSY-PROJECTION TEST, ON PAPER, BEFORE ANY COMPUTE. The
    tracked object is a PARTIAL ASSIGNMENT sigma to the coefficients of s1,
    projected to the triple (j, g, residual gap). This discards which
    coefficients are known, which values they take, and everything about s2
    and t0. It discards them compatibly with both operations that act on it:
    extending the advice by one coefficient sends (j, g) to (j, g + 1) and
    lowers the residual lattice dimension by exactly one regardless of WHICH
    coefficient was added; completing a block sends (j, g) to (j + 1, g - 256)
    and makes exactly one more block of c * s1 computable regardless of which
    block. The retained part therefore propagates deterministically under
    both. It is NOT a change of coordinates: the fibre over a given (j, g) has
    size C(256 l, g) * 5^g and its members have genuinely different residual
    instances, which is precisely why stage 4 must sample the fibre rather
    than pick one representative.
    STAGE 1, DERIVE THE FORGING THRESHOLD I*. Determine, from FIPS 204's
    verification predicate and the signing relation, the minimum advice at
    which a forgery becomes possible at all, as a function of j and g. Do this
    symbolically and state it as an inequality, not as a number read off an
    experiment. This is where the granularity claim of clause (C) is either
    confirmed or refuted, and it is the cheapest step in the record.
    STAGE 2, INSTANTIATE C_advice. For each (j, g): direct enumeration cost
    (2 eta + 1)^(256 j + g); meet-in-the-middle cost with its memory charged
    explicitly, since a square-root time saving bought with square-root memory
    is not free and this program charges memory in every row; and, as a strict
    lower bound that no advice strategy can beat, the information-theoretic
    2^(entropy) with the entropy computed from the exact uniform-on-[-eta,eta]
    distribution rather than from an approximation.
    STAGE 3, INSTANTIATE C_residual. Two branches, both computed. KEY-RECOVERY
    branch: the residual MLWE instance with 256 j + g unknowns removed,
    dimension 256(l + k + 1) - 256 j - g, same determinant, secret norm
    reduced accordingly; report beta and core-SVP bits under one pinned
    estimator. FORGERY branch: the residual SelfTargetMSIS instance given j
    complete blocks, whose lattice loses 256 j dimensions and whose hash arm is
    unchanged; report the same. The two branches answer different questions
    and are never combined into one number.
    STAGE 4, SURFACE AND FIBRE SAMPLING. Evaluate C(j, g) on the full grid
    j in [0, l], g in [0, 256(l - j)] at a stride fine enough to resolve any
    interior minimum, and report the argmin with its value against the three
    corners. For at least ten grid points, sample 30 DIFFERENT partial
    assignments with the same (j, g) and report the spread in the residual
    beta; a spread larger than the claimed interior gain means (j, g) is not a
    sufficient statistic and the surface is not well defined.
    STAGE 5, MEASURED VALIDATION WITH CERTIFICATES. At reduced parameters
    where a forgery is certifiable -- the family question IDEA-20260821-5bbea6
    owns, whose output this record consumes rather than duplicates -- actually
    execute the interior strategy at the grid's argmin and at the two nearest
    corners, and check that the predicted cost RATIO between them appears as a
    measured ratio. Every forgery is emitted as a certificate and re-verified
    by an independent verifier. This is inventor-protocol validation-ladder
    step 2 and it is the step that converts a predicted surface into an
    observed one.
    STAGE 6, THE CASCADE TABLE. For each published ML-DSA fault or
    side-channel result this program has recorded, place its delivered advice
    on the surface as a (j, g) pair and read off its total cost. Report the
    table with each entry's provenance and with an explicit note that a
    side-channel-delivered advice cost is NOT C_advice and must not be
    compared against it on the same axis.
  novelty_status: unverified
  novelty_screen:
    corpus: >-
      All 15 prior RQ-MLDSA-001 titles read; IDEA-20260801-008,
      -20260805-591f9d, -20260808-5a748c, -20260808-63427b, -20260808-c1abd1,
      -20260821-4c0246, -20260821-5535fe, -20260821-5bbea6, -20260828-9643b1,
      -20260828-fe3cee read in full or substantial part; RQ-MLDSA-001 and
      RQ-MLDSA-ffa0f5 read in full. Two records concern partial secret
      knowledge and BOTH obtain it from faults: IDEA-20260805-818196 (the
      fault-proof boundary as the RANK of an induced affine system) and
      IDEA-20260828-6e79b4 (folding a sub-full-rank fault hint with the t0
