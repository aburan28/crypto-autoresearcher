      neither builds a cost surface. IDEA-20260808-c1abd1 does construct an
      interpolating curve, but between two resources INSIDE SelfTargetMSIS
      (lattice decodings against hash queries in one fixed lattice); this
      record interpolates BETWEEN ASSUMPTIONS along a secret-information axis
      that c1abd1 does not have. IDEA-20260821-5535fe's meet-in-the-middle is
      over CRT coordinates of the verification equation, a quotient of an
      identity, not a partial assignment to the secret.
    web: >-
      One WebSearch this session (2026-08-29) on hybrid partial-key-plus-
      forgery attacks against Dilithium surfaced Ravi et al., "Side-channel
      Assisted Existential Forgery Attack on Dilithium" (ePrint 2018/821),
      reported by the search synthesis as demonstrating "an alternative
      signing procedure through which it is possible to forge signatures with
      only the extracted portion of the secret-key, without requiring the
      knowledge of all its elements", and as combining partial extraction with
      post-processing to recover the rest of s1; and a further work described
      as reducing the number of faults needed by leaving the remaining
      coefficients to LWE solvers. NOT FETCHED; abstract-level synthesis only.
      THIS IS PRIOR ART FOR THE FORGERY-FROM-PARTIAL-KEY HALF and the record
      is scoped against it in discriminated_from. The classical
      guess-and-lattice hybrid (Howgrave-Graham) is recalled from memory and
      was not searched; it is standard and is assumed known, which is why the
      novelty label cannot rise above unverified.
    verdict: >-
      UNVERIFIED, and honestly weaker than the other records in this batch on
      the forgery half: forging from a partial key is published, and the
      guess-and-lattice hybrid is textbook. What was not found is the two-
      dimensional surface with BOTH granularities, a purely mathematical
      C_advice, and the argmin compared against the three published corners at
      FIPS 204 parameters. If ePrint 2018/821 already contains the block-
      granularity threshold of clause (C), the stage-1 deliverable shrinks to
      a citation and the record's contribution is the surface alone; that
      possibility is why stage 1 comes first and why it is cheap.
  object_first_candidate:
    tracked_object: >-
      A partial assignment to s1, projected to (complete ring blocks known,
      loose coefficients known, residual lattice gap), followed as advice is
      accumulated and as the residual instance is reduced.
    established_families_off_limits: >-
      Off-limits as the primary lens for this record: (1) the two-arm min and
      its interpolations (5194f9, c1abd1, fe3cee); (2) norm-budget accounting
      (591f9d, 008); (3) CRT projections (5535fe); (4) FAULT- AND SIDE-CHANNEL-
      DERIVED constraint systems (818196, 6e79b4) -- explicitly forbidden as a
      source of advice in this record, which is what keeps it on the
      assumption-hardness side of the line; (5) t0 pricing (5a748c);
      (6) reduction-loss transcription (9643b1); (7) multi-target and
      signature-count axes (4c0246, 4d4e5f).
    genuinely_new_or_repackaging: >-
      Partly a repackaging, and the record says so: the g axis alone is the
      classical hybrid attack, and the j axis alone is the published
      forgery-from-partial-key observation. What is not a repackaging is
      putting them on one surface with a common cost axis, and the derived
      claim that the two axes have granularities differing by exactly the
      factor 256 so that they cannot be traded against one another.
    concretely_testable: >-
      Yes. One-step propagation is defined for both axes (add a coefficient:
      dimension minus one; complete a block: one more block of c * s1
      computable), the surface is a finite grid, and stage 5 executes the
      argmin strategy end to end at certifiable reduced parameters.
    survival_score: >-
      The object survives along the g axis up to the advice budget (about 53
      coefficients by enumeration, 106 under meet-in-the-middle, out of 1024
      at ML-DSA-44) and dissolves immediately along the j axis, where a single
      block costs 594 bits. Reporting exactly where and why it dissolves --
      the factor-256 granularity ratio -- is the predicted deliverable and it
      meets the section-4 closure standard, since it is an obstruction with a
      number, an argument, and forward guidance.
  null_object_control: >-
    NULL ADVICE: run the entire pipeline with advice drawn INDEPENDENTLY of
    the key -- a partial assignment sampled from the same distribution but not
    equal to the true secret on those coordinates. The residual instance must
    become UNSOLVABLE at any beta, and the measured forging success rate must
    be indistinguishable from that of the zero-advice adversary. A finite beta
    or a raised success rate under null advice means the pipeline is scoring
    the dimension reduction rather than the information, and every surface
    point is void. SECOND NULL: advice on s2 rather than s1 at the same (j, g)
    entropy, which should help the lattice branch but must NOT lower the
    forging threshold, isolating s1's role.
  discriminated_from:
    - >-
      IDEA-20260808-c1abd1 interpolates between lattice reduction and hash
      queries WITHIN SelfTargetMSIS, sharing one fixed lattice. Its resource
      axis is hash calls; this record's is bits of secret advice. c1abd1's
      curve exists at zero advice and this record's surface at (0, 0) contains
      c1abd1's whole curve as a single corner value. They compose and neither
      contains the other.
    - >-
      IDEA-20260805-818196 and IDEA-20260828-6e79b4 obtain partial secret
      information from FAULTS. This record forbids faults, side channels and
      signature transcripts entirely; its advice is bought by enumeration at a
      stated bit price. That is the line RQ-MLDSA-ffa0f5's scope-separation
      constraint and RQ-MLDSA-001's own target list draw, and stage 6 respects
      it by placing fault results on the surface WITHOUT comparing their
      acquisition cost to C_advice.
    - >-
      Ravi et al. (ePrint 2018/821) establish that a portion of the key
      suffices to forge, using a side channel to obtain it. This record takes
      that fact as an input to stage 1 rather than as a result, forbids the
      side channel, and asks the different question of whether the portion can
      be bought mathematically for less than the published minimum.
    - >-
      IDEA-20260821-5bbea6 asks whether a reduced ML-DSA family with
      certifiable forgeries exists. Stage 5 CONSUMES that family; it does not
      construct one. If 5bbea6's constraint set turns out empty, stage 5 is
      blocked and the record delivers stages 1-4 and 6 only, which it should
      say up front rather than discovering late.
