idea:
  id: IDEA-20260920-a92b0f
  id_allocation_provenance: >-
    Minted by the top-level session with `python3 tools/allocate_id.py --next
    idea --date 20260920` and confirmed free with `--check` on 2026-09-20.
    Not derived by scanning state. Authored by the idea-generator subagent
    dispatched against RQ-ECDLP-bc7a54; filed unmodified except for this
    identifier block.
  proposed_by: idea-generator
  proposed_at: '2026-09-20'
  status: proposed
  question_id: RQ-ECDLP-bc7a54
  added: '2026-09-20'
  title: >-
    S1 ANSWERED IN BOTH DIRECTIONS: P*T = Omega(n) is FALSE in the non-uniform
    generic group model Corrigan-Gibbs-Kogan actually use (advice is free, so
    P is not a resource at all), and PROVABLE IN FOUR LINES in the
    QUERY-BOUNDED preprocessing GGM where the advice must be earned by oracle
    queries -- Pr[success] <= (PT + T^2 + 1)/n -- which makes the note's
    section 4 collapse to S = P = O(polylog) rigorous, exhibits
    Bernstein-Lange as TIGHT, and converts "any escape must be non-generic"
    from a slogan into the exact scope boundary of a theorem
  class: mechanism

  claim: >-
    (A) THE MODEL DISTINCTION THE NOTE DOES NOT DRAW, AND IT IS THE WHOLE
    ANSWER. Open statement S1 asks whether P*T = Omega(n) is provable "in the
    generic group model". There are two generic preprocessing models and the
    answer differs between them.
      NON-UNIFORM GGM (the model of Corrigan-Gibbs-Kogan, KN-LIT-013). The
      advice string is chosen by a computationally unbounded adversary with
      full knowledge of the labelling. P is not a parameter of the model; the
      preprocessor makes no queries because it does not need to. P*T = Omega(n)
      IS FALSE THERE, trivially, with P = 0. Only S*T^2 = Omegatilde(n) binds.
      THE NOTE'S SECTION 4 COLLAPSE IS THEREFORE NOT JUSTIFIED BY KN-LIT-013,
      and a reader who takes S1 as posed and answers it in the CGK model will
      correctly answer "no" and wrongly conclude the barrier is an artifact.
      QUERY-BOUNDED PREPROCESSING GGM (proposed here as the right model for the
      question the note is actually asking). Phase 1 is itself a generic
      algorithm: it makes P oracle queries and may output advice of ARBITRARY
      LENGTH computed from its transcript. Phase 2 receives the advice and the
      label of h = x*g for uniform x, makes T queries, outputs a guess.
    (B) THE THEOREM, WITH ITS PROOF, BECAUSE THE PROOF IS FOUR LINES. In the
    query-bounded model, for any A1 making P queries and any A2 making T
    queries,
        Pr[A2 outputs x]  <=  (P*T + T^2 + 1) / n .
    PROOF. Phase 1 never sees h, so every element it queries is c*g with c
    known to it; its knowledge is a set C of at most P+1 residues together with
    their labels, and the advice is a function of that transcript alone. Phase
    2's i-th query is a formal expression alpha_i * x + beta_i with
    (alpha_i, beta_i) determined by its view. Until one of two events occurs,
    every label Phase 2 sees is a fresh uniform label independent of x, so its
    view is independent of x and it guesses correctly with probability 1/n. The
    events are: (i) alpha_i * x + beta_i lies in C for some i with alpha_i != 0,
    which for uniform x has probability at most |C|/n per query, hence at most
    P*T/n by a union bound; (ii) alpha_i * x + beta_i = alpha_j * x + beta_j for
    distinct formal expressions, probability at most 1/n per pair, hence at most
    T^2/n. Queries with alpha_i = 0 lie in the span of g and are independent of
    x by construction. QED.
    (C) THE CONSEQUENCES, EACH STATED AS A NUMBER.
      C1. Omega(1) success requires P*T + T^2 = Omega(n), i.e.
          T = Omega(min(n/P, sqrt(n))). The note's section 4 collapse is now a
          theorem IN THIS MODEL: T ~ n^{1/3} forces P = Omega(n^{2/3}).
      C2. TIGHTNESS. Bernstein-Lange / Mihalcik / Lee-Cheon-Hong achieve
          T = n/P for every P >= sqrt(n) (KN-LIT-5230). The bound is attained
          on the whole range and is therefore not improvable.
      C3. ORTHOGONALITY TO KN-LIT-013. The bound does not mention S at all, and
          CGK's does not mention P. Neither implies the other: at
          P = n^{0.9}, S = P, CGK gives T >= n^{0.05} while this gives
          T >= n^{0.1}. They are complementary faces of the same frontier and
          the pair (C1, CGK) is strictly stronger than either.
      C4. THE SCOPE BOUNDARY, WHICH IS THE POINT FOR RQ-ECDLP-bc7a54. The proof
          uses genericity ONLY in Phase 1 and ONLY through "Phase 1's knowledge
          is a set of at most P residues". A preprocessing that READS
          COORDINATES -- that computes a decision procedure rather than
          enumerating a set -- has knowledge that is not a set of P residues and
          is NOT bounded by this theorem. THAT IS EXACTLY AN omega. So the
          theorem's failure boundary and the hint-family definition of section 5
          are the same object seen from two sides, and "section 3.2's algorithm
          must be non-generic" acquires a precise meaning: it must defeat the
          set-of-P-residues characterisation of generic preprocessing.
    (D) WHAT IS AND IS NOT CLAIMED NEW. The argument is Shoup's, transplanted;
    I expect it is folklore or published in the non-uniform-security literature
    (Coretti-Dodis-Guo-Steinberger; Dodis-Guo-Katz; Bernstein-Lange's own
    critique of free precomputation). ITS VALUE DOES NOT DEPEND ON NOVELTY: the
    corpus contains zero occurrences of a query-bounded preprocessing bound
    (novelty screen below), the note poses S1 as open, and the model
    distinction in (A) is a CORRECTION to a merged design note. If a reviewer
    finds the theorem stated, the honest status becomes `known` and (A), (C3)
    and (C4) are unchanged.

  mechanism: >-
    OBJECT FRAME, AND ITS HONEST DECLARATION. The tracked object is the
    PREPROCESSING TRANSCRIPT -- the set C of residues whose labels Phase 1 saw,
    together with the advice derived from it. That is family F7 (preprocessing
    table) of IDEA-20260802-002, declared OFF-LIMITS AS A PRIMARY LENS. It is
    used here NOT as an attack lens but as the CLOSURE lens: the record mounts
    no attack and the object is the thing being bounded, not the thing being
    followed to a solution. WHAT IS ADDED beyond F7-as-attack: F7 records treat
    the table as a resource to be built; this treats it as a random variable
    whose mutual information with x is bounded.
    REPRESENTATION CLASS: NONE OF R1/R2/R3. The model has no coordinates at all
    -- that is its content. The attack stage whose charged cost it constrains is
    PRECOMPUTATION, which no R-class touches. Recorded as a declared
    non-applicability rather than forced into a class.
    OPERATION SET SIGMA: the full translation action, since the proof turns on
    translation acting transitively so that alpha*x + beta is uniform over x.
    TRICHOTOMY: NOT PLACEABLE, AND THE OBSTRUCTION IS NAMED PER THE CONSTRAINT
    BLOCK. IDEA-20260806-c5d183's trichotomy classifies PROJECTIONS OF A GROUP
    ELEMENT. The transcript is not a projection of a group element -- it is a
    function of the labelling and of the preprocessor's own choices, with no
    group element as its argument. Returned as `unverified` on placement with
    that obstruction stated, exactly as the constraint block requires, rather
    than silently assigned to Class III.
    LOSSY-PROJECTION TEST: NOT APPLICABLE AND SAID SO. There is no candidate
    tracked object whose lossiness could be tested; the record proposes no
    object to follow. A record that invented one here to satisfy the form would
    be adding a fiction.

  novelty_status: unverified

  citations:
    - ref: "KN-LIT-013 (Corrigan-Gibbs and Kogan, The Discrete-Logarithm Problem with Preprocessing, EUROCRYPT 2018)"
      provenance: kb
      claim: "S*T^2 = Omegatilde(N) is a lower bound for DLP with preprocessing in the generic group model; the model gives the preprocessor unbounded power and bounds only (S, T)."
      verified_by: "Corpus entry knowledge/literature/KN-LIT-013.md cited by docs/n13-ecdlp-hint-family.md section 2; the note's characterisation ('bound (S,T) and leave P unbounded') read in full. The paper body was NOT read in this session."
    - ref: "KN-LIT-5230 (Bernstein and Lange, Non-uniform cracks in the concrete: the power of free precomputation, ASIACRYPT 2013)"
      provenance: kb
      claim: "The trail-based preprocessing family attains P*T = n with S ~ P/T, hence S*T^2 = n; balanced point S = T = n^{1/3}, P = n^{2/3}."
      verified_by: "Corpus entry cited by the note section 2, whose derivation was read in full. Paper body not read in this session."
    - ref: "Shoup, Lower bounds for discrete logarithms and related problems, EUROCRYPT 1997"
      provenance: recalled
      claim: "In the generic group model with random labels, T queries give success probability O(T^2/n); the argument is the collision-among-formal-expressions argument transplanted in (B)."
      verified_by: null
    - ref: "Coretti, Dodis, Guo, Steinberger; Dodis, Guo, Katz -- non-uniform bounds in the random-oracle / generic-group models (bit-fixing and presampling)"
      provenance: recalled
      claim: "Framework for preprocessing lower bounds; the natural place a query-bounded preprocessing statement would already appear."
      verified_by: null
    - ref: "Corpus novelty screen"
      provenance: internal
      claim: >-
        Repository-wide case-insensitive grep for 'query-bounded', 'bounded
        preprocessing', 'uniform preprocessing', 'precomputation lower bound',
        'P*T', 'P.T' returned: zero ledger records stating a query-bounded
        preprocessing bound; the only P*T occurrences are inside
        docs/n13-ecdlp-hint-family.md itself and two incidental matches
        ('neither the attack nor the baseline is query-bounded') in
        EV-PEC-857664 and a P13 red-team report, neither about DLP
        preprocessing.
      verified_by: "Grep executed 2026-09-20 over /home/user/crypto-autoresearcher."

  assumptions:
    - >-
      Phase 1 receives no input depending on the challenge x. If preprocessing
      is allowed to see h, the model is target-dependent preprocessing and the
      theorem does not apply -- and that is not a technicality: a
      target-dependent omega is precisely what RQ-ECDLP-bc7a54 is hunting.
    - >-
      Labels are a uniformly random injection; the standard lazy-sampling
      argument applies. Structured labels (e.g. actual curve coordinates) are
      outside the model, which is exactly boundary (C4).
    - >-
      Phase 2's queries are formal linear combinations of g and h. Standard for
      generic algorithms; an algorithm computing a non-generic function of a
      label escapes, which is again (C4).
    - >-
      The advice may be arbitrarily long. The theorem deliberately does not
      bound S, which is what makes it orthogonal to KN-LIT-013 rather than a
      restatement of it.

  proof_search_map:
    bottleneck: >-
      The step whose removal changes the theorem: "Phase 1's knowledge of the
      labelling is exactly its transcript on a set C of at most P+1 residues."
      Everything else is Shoup. If Phase 1 can learn a SUCCINCT GLOBAL PROPERTY
      of the labelling -- anything not reducible to a set of P labels -- the
      union bound over |C| collapses and the bound is void. Making that step
      airtight against an unbounded-computation, query-bounded preprocessor is
      the entire mathematical content.
    baseline_embedding:
      parameter_slice: >-
        P = 0. The bound must reduce EXACTLY to Shoup's T^2 = Omega(n), i.e.
        T = Omega(sqrt n), with no residual term. Second slice: P = n^{2/3},
        T = n^{1/3}, where Bernstein-Lange attains equality, so the bound must
        be tight and not off by a factor of n^{eps}.
      reproduction_check: >-
        Symbolic: set P = 0 in (B) and verify the expression collapses to
        (T^2 + 1)/n. Frozen fixture (toy GGM simulation, cheap): implement the
        Mihalcik/Bernstein-Lange trail construction on a relabelled Z/n at
        n ~ 2^20, sweep P over {n^{0.4}, n^{0.5}, n^{0.6}, n^{0.7}}, and check
        the MEASURED success probability tracks Theta(PT/n) across the sweep.
        A construction whose measured success exceeds the bound at any cell
        falsifies the theorem or the implementation, and separating those two is
        a re-derivation, not a re-run.
    observation_collision:
      observable: >-
        The pair (P, T) at which success probability crosses 1/2, measured in a
        toy generic-group simulation.
      distinct_preimage_search: >-
        COLLISION EXHIBITED DELIBERATELY AND IT IS THE RECORD'S SHARPEST
        CONTENT: the non-uniform preprocessor and the query-bounded
        preprocessor at P = 0 have THE SAME observable (S, T) and DIFFERENT
        ground truth (P*T unbounded versus P*T = Omega(n)). The (S, T)
        observable therefore cannot identify which model an algorithm lives in,
        which is exactly why S1 looks open: the quantity everyone measures does
        not see the distinction. Any claim resting on (S, T) alone is
        unidentifiable between the two models and must declare its model.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "preprocessing" by "a generic algorithm whose output is read
          by a second generic algorithm", so the hypothesis becomes an exact
          query count rather than an information-theoretic advice bound.
          ENCODING: exact. COMPLETENESS: every query-bounded preprocessing
          algorithm is of this form. SOUNDNESS: the bound holds for all of them.
          TRANSFER: to E(F_p) only under the genericity assumption, and the
          failure of that transfer IS the deliverable (C4). COST LOSS: none.
        predicted_gain: >-
          Converts the note's heuristic collapse "the two walls force
          S = P = O(polylog)" into a theorem in a named model, and names the
          exact hypothesis an n^{1/3}-with-cheap-preprocessing algorithm must
          violate.
      - transform: observable_fiber
        proposed_object: >-
          Hold (S, T) fixed and vary the forgotten structure -- how the advice
          was obtained. The intrinsic invariant distinguishing the two objects
          is the preprocessor's query count, which the (S, T) observable
          forgets.
        predicted_gain: "Explains why S1 reads as open and supplies the missing coordinate."
    quantifier_order: >-
      FOR ALL n, FOR ALL query-bounded preprocessing pairs (A1, A2) with A1
      making at most P queries and A2 at most T queries, FOR uniform x and a
      uniformly random injective labelling: Pr[A2(advice, label(x g)) = x]
      <= (PT + T^2 + 1)/n. THE ADVICE MAY DEPEND ON THE LABELLING AND ON A1's
      COIN TOSSES BUT NOT ON x -- that dependence order is the entire theorem,
      and a preprocessing that may depend on x (target-dependent advice) is
      outside the quantifier. The bound is UNIFORM in the advice length, which
      is the sense in which S does not appear.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "in the query-bounded generic preprocessing model,
        P*T + T^2 = Omega(n) for constant success, and the bound is attained by
        the Mihalcik / Lee-Cheon-Hong / Bernstein-Lange family". IT CANNOT
        CERTIFY: anything about an algorithm that reads coordinates; anything
        about the non-uniform model, where the statement is false; that no
        (2/3, polylog) hint family exists on E(F_p); or any concrete lower bound
        on prime-field ECDLP.
      nearby_object_control: >-
        THE NON-UNIFORM GGM ITSELF, where the conclusion FAILS: with free advice
        the P = 0, T = n^{1/3}, S = n^{1/3} point is achievable and P*T = 0.
        A proof that cannot distinguish the two models has not identified the
        load-bearing hypothesis, which is that advice must be EARNED. SECOND
        CONTROL: a group of composite order, where Pohlig-Hellman lowers T
        without any preprocessing at all and the bound must be read with n
        replaced by the largest prime factor.
    proof_obligations:
      - claim: "Phase 1's knowledge is exactly its transcript on a set of at most P+1 residues (the named bottleneck)"
        responsibility: correctness
      - claim: "union bound over the two win events; alpha_i = 0 queries are independent of x"
        responsibility: correctness
      - claim: "adaptive choice of (alpha_i, beta_i) does not break the lazy-sampling argument"
        responsibility: correctness
      - claim: "P = 0 slice recovers Shoup exactly"
        responsibility: baseline
      - claim: "Bernstein-Lange attains P*T = n for all P >= sqrt(n), so the bound is tight"
        responsibility: baseline
      - claim: "multi-target form: for u uniform targets, solving any one requires P*T + T^2 = Omega(n/u) -- STATED AS AN OBLIGATION, NOT DERIVED"
        responsibility: scope
      - claim: "the failure boundary of the genericity hypothesis coincides with the hint-family definition of note section 5"
        responsibility: interface

  predictions:
    - metric: >-
        Measured success probability of the trail-based preprocessing
        construction on a relabelled Z/n (a literal generic group), as a
        function of P and T, at n ~ 2^18 to 2^22
      direction: different
      minimum_effect: >-
        FORCED to track Theta(P*T/n) with the fitted product exponent within
        0.1 of 1.0 across a >= 4-point sweep in P. A measured success
        probability EXCEEDING (PT + T^2 + 1)/n at any cell by more than
        sampling error falsifies the theorem or the implementation.
    - metric: "Success probability at P = 0 across the same T sweep"
      direction: different
      minimum_effect: "FORCED to track Theta(T^2/n) -- the Shoup slice. A P-dependence at P = 0 is an implementation bug and voids the run."
    - metric: >-
        Success probability of a NON-UNIFORM preprocessor simulated with free
        access to the labelling at P = 0, S = n^{1/3}, T = n^{1/3}
      direction: higher
      minimum_effect: >-
        FORCED HIGH (constant) -- this is the nearby-object control and it MUST
        break the bound, because the bound does not apply to it. A simulation in
        which the non-uniform preprocessor does NOT beat the query-bounded bound
        has not implemented the model distinction and voids the record's central
        claim (A).
    - metric: >-
        Fitted exponent c in the measured relation T ~ n^c at fixed P = n^{2/3}
      direction: different
      minimum_effect: "PREDICTED c = 1/3 within 0.05. A c below 1/3 at query-bounded preprocessing falsifies C1 at the tested scale."

  minimal_test:
    design: >-
      STAGE 0 (PAPER, ZERO COMPUTE, AND IT IS THE DELIVERABLE). Write the model
      definition, (B) with the lazy-sampling argument carried explicitly through
      adaptivity, the P = 0 and Bernstein-Lange embeddings, the multi-target
      form or an honest statement that it does not close, and (C4) as a formal
      scope statement. Label it `derivation`.
      STAGE 1 (TOY GGM SIMULATION, MINUTES, NO CURVE ARITHMETIC). Group = Z/n
      under a keyed random relabelling, n prime ~ 2^18 to 2^22. Implement (i)
      the trail-based query-bounded preprocessor, (ii) a P = 0 online-only
      algorithm, (iii) a simulated non-uniform preprocessor with oracle access
      to the labelling. Sweep P and T on a grid; measure success probability
      over >= 10^3 independent challenges per cell with a stated seed policy;
      plot against the bound.
    controls:
      - "P = 0 Shoup slice: forced Theta(T^2/n)."
      - "Non-uniform preprocessor: forced to BREAK the bound. This is the control that validates claim (A) and it can fail."
      - >-
        Random-guess floor: an algorithm making zero queries must measure 1/n.
        An instrument reporting above that has a leak between the challenge
        generator and the solver, which is the single most likely bug here.
      - >-
        Composite-order control: on Z/(ab) the same code must show
        Pohlig-Hellman success at T ~ sqrt(max prime factor) with P = 0,
        confirming the instrument is measuring group structure and not a
        constant.
      - >-
        SEED AND LEAK AUDIT: the challenge x must be drawn after the advice is
        frozen, verified by hash-committing the advice before x is sampled.
      - "ARCHIVE CHECK, zero compute: record that this proposes no status change to KN-LIT-013 or KN-LIT-5230 and no correction record to docs/n13-ecdlp-hint-family.md (which is a Coordinator act)."
    required_metrics:
      - "success probability per (P, T, model) cell with a binomial confidence interval"
      - "fitted exponent of success against P at fixed T, and against T at fixed P"
      - "measured P*T at the 1/2-success contour, per model"
      - "PASS/FAIL against the bound (PT + T^2 + 1)/n per cell"
      - "forced values: P=0 Shoup slice, zero-query floor 1/n, non-uniform control breaking the bound"
      - "artifact manifest with hashes and a from-scratch rebuild receipt"

  falsification_conditions:
    - >-
      The toy simulation measures success above (PT + T^2 + 1)/n at any cell,
      beyond sampling error, for a query-bounded preprocessor. Either (B) is
      wrong or the simulation leaks; the record stops until the two are
      separated by an independent re-derivation.
    - >-
      The non-uniform control does NOT break the bound. Then the model
      distinction in (A) is not implemented and the record's central correction
      is unsupported by its own instrument.
    - >-
      Stage 0 finds that the "knowledge is a set of P residues" step does not
      survive an unbounded-computation preprocessor. The theorem is WITHDRAWN
      before Stage 1 is interpreted, and the honest deliverable collapses to
      (A) alone -- which is still a correction to a merged design note.
    - >-
      A published statement of the same bound is found. Status drops to `known`;
      (A), (C3) and (C4) survive unchanged and the record is retained as a
      pointer, not withdrawn.
    - >-
      The multi-target obligation is shown to fail, i.e. amortisation beats
      P*T = Omega(n/u). Then C1 does not extend to batches and the scope
      statement must be narrowed to single targets before anything cites it.

  confounders:
    - >-
      MODEL CONFLATION, WHICH IS THE ENTIRE RISK. A reader who takes the bound
      as applying to KN-LIT-013's model will believe a false statement, and a
      reader who takes CGK's model as answering S1 will believe the barrier is
      an artifact. Every citation of this record must name the model in the same
      sentence.
    - >-
      ADVICE LEAKAGE IN SIMULATION. If the advice is computed after the
      challenge is sampled, even incidentally through a shared RNG stream, the
      measured success will exceed the bound and look like a refutation. The
      hash-commit control exists for exactly this.
    - >-
      SMALL-n FLOOR EFFECTS. At n ~ 2^18 the term T^2/n is not negligible at the
      P values of interest, so the PT and T^2 contributions must be separated by
      the P = 0 column rather than assumed.
    - >-
      TIGHTNESS MISREAD AS OPTIMALITY OF BERNSTEIN-LANGE FOR ECDLP. The bound is
      tight in the MODEL; E(F_p) is not a generic group, and nothing here says
      Bernstein-Lange is optimal on a real curve.

  interpretation_limits:
    - >-
      NO ATTACK, NO EXPONENT MOVED, sota_delta zero on every ECDLP cost axis.
      The record proposes no algorithm and solves nothing.
    - >-
      IT IS NOT A HARDNESS RESULT FOR ECDLP AND MAY NOT BE QUOTED AS ONE. It
      bounds a model. Its most useful consequence is a NEGATIVE one about the
      model: (C4) says the model is silent exactly where RQ-ECDLP-bc7a54 is
      looking.
    - >-
      The transcript object is family F7 and the trichotomy placement is
      declared UNPLACEABLE with the obstruction named; no R1/R2/R3 class
      applies. Both are recorded as declared non-applicabilities, not omissions.
    - >-
      No factor base appears, so KN-OPEN-020 is not engaged.
    - >-
      Even if every part of this holds, P-256 is untouched: the record's content
      is that a cheap-preprocessing n^{1/3} algorithm must be non-generic, not
      that one exists or does not.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NONE OF THE CENTRAL CLAIM IS HEURISTIC. (B) is unconditional
        finite-probability counting in a stated model, with no distributional
        assumption beyond the uniformity of the labelling and of x, which are
        part of the model definition. This item is numbered PRECISELY SO THAT
        THE ABSENCE IS EXPLICIT and no later reader may attribute a heuristic to
        the theorem.
      rigorous_support: "Union bound plus the standard generic-group lazy-sampling argument (Shoup lineage)."
      validation_plan: >-
        The Stage 1 simulation is a BUG-CHECK ON THE IMPLEMENTATION, not
        evidence for the theorem: complete verification at a size is available
        only by enumerating all challenges, which is done at n ~ 2^18 for the
        P = 0 column. Sampled elsewhere with >= 10^3 challenges per cell and a
        stated seed policy. TRANSFER ASSUMPTION: none needed; the statement is
        finitary at each n and the general form is derived.
    - id: H2
      statement: >-
        MULTI-TARGET AMORTISATION. For u independent uniform targets and total
        online budget T, solving at least one requires P*T + T^2 = Omega(n/u).
      rigorous_support: >-
        The same union bound with u challenges raises the hit probability by a
        factor u; the rigorous ingredient is that factor, and the classical
        comparison it must reproduce is the known multi-target cost sqrt(u n)
        without preprocessing and the Bernstein-Lange multi-target variants
        (KN-LIT-5230). THE COMPOSITION IS NOT YET WRITTEN and is the record's
        second debt after the bottleneck.
      validation_plan: >-
        SAMPLE: the Stage 1 simulation extended to u in {1, 4, 16, 64} at fixed
        n ~ 2^20, measuring the (P, T) contour at which one-of-u succeeds with
        probability 1/2. COMPARISON: the predicted 1/u scaling of the contour,
        and the P = 0 column against the known sqrt(u n). TAIL CHECK: the
        largest u, where the bound is weakest and a failure would first appear.
        TRANSFER ASSUMPTION, STATED: that a contour fitted at n ~ 2^20
        describes the asymptotic; it does not, and the asymptotic claim rests on
        the derivation.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS PROPOSED OR MOVED. The record's quantitative content
      is a LOWER BOUND: in the query-bounded generic preprocessing model,
      T = Omega(min(n/P, sqrt n)). At P = polylog, T = Omegatilde(sqrt n) -- no
      preprocessing-free generic speedup exists. At P = n^{2/3}, T = Omega(n^{1/3})
      and Bernstein-Lange attains it.
    memory_exponent: >-
      NO MEMORY CLAIM; the bound is uniform in the advice length S, which is the
      feature that makes it orthogonal to S*T^2 = Omegatilde(n). Simulation
      memory at Stage 1 is O(n) words at n <= 2^22, an implementation detail.
    best_known: >-
      Pollard rho 0.886 sqrt(n) at O(1) memory; BSGS (n^{1/2}, n^{1/2});
      multi-target sqrt(u n); preprocessing frontier S*T^2 = Omegatilde(n)
      (KN-LIT-013) attained at P*T = n (KN-LIT-5230). For the specific question
      of a PRECOMPUTATION lower bound there is NO incumbent in this repository
      -- that absence is documented in the novelty screen and is what the record
      addresses. Whether one exists externally is UNVERIFIED and is a declared
      Stage 0 search obligation.
    hidden_overhead: >-
      Nothing hides in an o(1) because there is no asymptotic algorithm claim.
      What hides instead, disclosed: the bound's ENTIRE force sits in the model
      choice, and the model is not E(F_p). The polylog factors in
      Omegatilde(n) for the CGK comparison are carried from that paper and are
      not re-derived here.
    tradeoff_note: >-
      The record's content IS a tradeoff statement: it adds the P axis to the
      (S, T) frontier and shows the two are independent constraints. Combined
      frontier for query-bounded generic preprocessing:
      T >= max( sqrt(n/S) up to polylog, min(n/P, sqrt n) ). Parallelisation:
      not applicable, no algorithm. Multi-target: H2, unresolved.

