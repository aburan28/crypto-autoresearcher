idea:
  id: IDEA-20260904-8dccc9
  question_id: RQ-PFDR-ae2fba
  added: '2026-09-04'
  proposed_by: idea-generator
  status: proposed
  title: >-
    THE WINDOW DOES NOT HAVE TO BE ONE UNKNOWN: re-parametrizing the SAME
    interval factor base by r bounded digits is exactly volume-preserving,
    hence provably demand-neutral (eps_required is unchanged), while it
    changes the Newton polytope the small-root solver sees -- so rank-r GAPs
    and the base-d digit map are one lever, not two, and the only question is
    whether the refined-polytope reach clears 8/9. The decisive control is
    the univariate case, where refinement predicts 2/d against a known 1/d.
  class: representation

  claim: >-
    Setting exactly as analysis/smallroot-reach/CLOSURE.md at its optimum
    (m, w) = (4, 2): full binary tree on four windowed leaves, two kept
    internal nodes, three S_3 blocks, eps_required = 8/9 = 0.8889, measured
    eps_available = 0.8408, margin -0.0481.
    (A) DEMAND-NEUTRALITY LEMMA (exact, no experiment). The demand derivation
    of that note depends on exactly three quantities -- the total bound volume
    p^{m beta + sum gamma_v}, the number of equations w+1, and the yield
    p^{m beta - 1 + sum (gamma_v - 1)} (KN-FIND-007's exact mean). Substituting
    x_k = sum_{j<r} a_j u_{k,j} with 0 <= u_{k,j} < B^{1/r} leaves all three
    invariant when the substitution is injective on the box, because the box
    volume prod_j B^{1/r} = B is preserved, the equation count is unchanged,
    and the factor base is literally the same SET of points. Hence
    eps_required(m, w) is invariant under every volume-preserving
    re-parametrization of the leaf windows, rank-1 or rank-r.
    (B) THE POLYTOPE IS NOT INVARIANT. IDEA-20260808-c31f1c's invariance lemma
    covers r = 1 (an affine change of variable is polytope-neutral). For r >= 2
    the substitution is a map Z^r -> Z, not an isomorphism, and the worst block
    S_3(x_1, x_2, y) goes from n = 3 unknowns of per-variable degree 2 with
    the 13-monomial support to n = 2r+1 unknowns of per-variable degree 2 whose
    support is the pull-back {(a_1, a_2, c) with |a_1|, |a_2|, c matching a
    monomial of S_3}. The full-box trend for such a block is
    2n/(d(n+1)) = (2r+1)/(2r+2), which passes 8/9 at r = 4 before any sparsity
    credit, and the closure's own measured sparsity gain at l = 2 was x1.12.
    (C) THE TWO LEVERS ARE ONE. The base-d digit map x = sum_j d^j u_j is the
    DEGENERATE rank-r GAP whose image is exactly the interval [0, d^r). So the
    closure's coverage claim "any rank-1 GAP factor base" is really "any rank-1
    factor base presented in its one-variable coordinate"; the very same
    interval, digit-presented, is outside the computed table. The crowded
    base-d digit lane (IDEA-20260903-26aa81 and siblings) analyses this
    substitution on the GROEBNER axis (d_ff, last-fall degree, Macaulay
    deficit). This record analyses it on the ARCHIMEDEAN axis (Jochemsz-May
    reach), which no record in this corpus has computed.
    (D) THE FALSIFIABLE NUMBER. Define eps_avail(r) as the extended-strategy
    reach of the substituted support at equal per-variable bounds, in the
    closure's normalization eps = sum_i beta_i over the block's unknowns.
    The claim is that eps_avail(r) is computable with zero new mathematics by
    tools/smallroot_reach.py's existing jm_reach_extended on a substituted
    support, and that the family at (4, 2) is alive iff eps_avail(r) > 8/9 for
    some r with the substituted lattice still of constant dimension.
    (E) THE CONTROL THAT DECIDES WHAT A POSITIVE MEANS. Apply the identical
    refinement to the univariate congruence f(x) = 0 mod p, deg f = d, by
    x = u_1 + D u_2: the support becomes the dense total-degree-d simplex in
    n variables, for which this record derives the closed form eps = n/d
    (checks: n = 1 gives Coppersmith's 1/d; d = 1 gives n, i.e. saturation at
    the information ceiling, matching the known solvability of modular linear
    equations in many small unknowns). Refinement therefore PREDICTS 2/d for a
    split univariate, against a reach of 1/d that is a theorem and is the
    calculator's own calibration target. Either the predicted gain is real --
    in which case univariate Coppersmith is improvable by splitting, an
    extraordinary claim with an immediate planted-root test -- or the
    Jochemsz-May algebraic-independence heuristic fails predictably under
    variable refinement, in which case every rank-r and digit reach gain in
    this family is an artifact and the closure extends to all of them.
    Both branches are decisive and the experiment separating them costs
    CPU-minutes.

  mechanism: >-
    Small-root reach is a function of the Newton polytope and the bound vector
    only; index-calculus demand is a function of bound VOLUME, equation count
    and yield only. Refinement moves the first and provably fixes the second,
    so it is the unique demand-neutral, supply-touching deformation available
    inside the lattice-describable family. (The two other obvious deformations
    are demand-negative or supply-negative: keeping another internal node
    raises demand, and hybrid guessing of a leaf is demand-NEUTRAL but
    supply-negative because it lowers n, and reach rises with n at fixed
    per-variable degree.) Against that, the mechanism by which the gain can be
    illusory is equally specific: the shift lattice of the refined system is
    built over monomials in u, but the true solution set is the pull-back of a
    solution set in x, so the recovered short vectors can lie in the
    pulled-back subring F_p[L] with L = sum_j a_j u_j and then cut out a
    positive-dimensional variety instead of a point. That is exactly the
    algebraic-independence failure the Jochemsz-May bound assumes away, and the
    univariate split is the smallest instance of it with a known answer.

  novelty_status: unverified

  novelty_screen:
    kb_index: >-
      The kb/ retrieval MCP index is EMPTY in this environment
      (CRYPTO_KB_QDRANT_URL = ':memory:'); search_knowledge was not called
      because it can only answer with nothing. Absence from an empty index is
      not evidence of novelty (AGENTS.md "Knowledge retrieval policy").
    corpus_grepped: >-
      ledger/proposals, ledger/hypotheses, knowledge/ and analysis/ for
      'generalized arithmetic progression', 'rank-r GAP', 'rank-2 GAP',
      'Coppersmith', 'Jochemsz', 'smallroot_reach', 'eps_available',
      'eps_required', '0.8408', 'digit'.
    results: >-
      Hits on rank-r GAPs are IDEA-20260808-c31f1c (read in full; states the
      rank lever and the invariance lemma, never computes a polytope, never
      executed), IDEA-20260903-81a943 and analysis/smallroot-reach/CLOSURE.md
      (read in full; both explicitly leave rank r >= 2 as the live successor
      and do not compute it), and one passing mention in IDEA-20260903-e0a3e8.
      Only four files in the repository contain the reach numbers, all from
      today's closure. The digit lane (IDEA-20260903-26aa81, -cf63ad and
      siblings) is Groebner-side: its objects are d_ff, d_lf and Macaulay
      deficits at fixed shape; none computes a small-root reach, and none
      observes that the digit map is a rank-r re-parametrization of the same
      interval. The identification (C) of the two lanes as one lever, the
      demand-neutrality lemma (A), the simplex closed form eps = n/d, and the
      univariate refinement control (E) were not found.
    external: >-
      Not checked for this record beyond the searches logged in
      IDEA-20260904-39336c. Variable splitting inside Coppersmith lattices is
      plausible folklore and may be recorded in the lattice literature as a
      known failure; that is precisely what control (E) tests in-house, and it
      is why the status is unverified rather than speculative.
    conclusion: >-
      unverified. Substantively an ADAPTATION of a named open successor plus
      one new lemma and one new control; no claim of an unpublished idea.

  citations:
    - ref: IDEA-20260903-81a943 and analysis/smallroot-reach/CLOSURE.md
      provenance: internal
      claim: >-
        eps_required(m, w) = (w + 1/2 + 1/(2(m-1)))/(w+1); measured extended
        reach 0.8408 for S_3 (13 of 27 monomials) and 0.4137 for S_4; the
        welding l = ceil((m+w)/(w+1)); best margin -0.0481 at (m, w) = (4, 2);
        rank r >= 2 named as the uncomputed live successor.
      verified_by: >-
        idea-generator, this session, both read in full 2026-09-04.
    - ref: IDEA-20260808-c31f1c
      provenance: internal
      claim: >-
        Affine substitution is polytope-neutral, so all rank-1 APs are
        equivalent to intervals; rank r >= 2 changes the polytope; HA-1 on GAP
        self-overlap.
      verified_by: >-
        idea-generator, this session, read in full 2026-09-04.
    - ref: IDEA-20260808-486ae2
      provenance: internal
      claim: >-
        The classification leaving lattice-describable sets as the one open
        family, and the w = 0 win condition eps > m/(2(m-1)).
      verified_by: >-
        idea-generator, this session, read in full 2026-09-04.
    - ref: KN-FIND-007
      provenance: internal
      claim: >-
        Mean decomposition yield is exactly C(B+m-1, m)/N for every base of a
        given size, so re-parametrization cannot move yield.
      verified_by: >-
        Not opened this session; known through RQ-PFDR-ae2fba's motivation and
        through IDEA-20260808-486ae2 and IDEA-20260808-9ef88c, both read. Used
        only for the statement that yield depends on the SET, which the
        substitution does not change.
    - ref: IDEA-20260903-26aa81 and IDEA-20260903-cf63ad
      provenance: internal
      claim: >-
        The base-d digit presentation and its Groebner-side invariants; cited
        to discriminate axes, not for a result.
      verified_by: >-
        idea-generator, this session, titles and claim heads read 2026-09-04;
        neither record opened in full.
    - ref: >-
        Coppersmith 1996 univariate reach p^{1/d}; Howgrave-Graham 1997;
        Jochemsz and May, ASIACRYPT 2006, extended strategy
      provenance: recalled
      claim: >-
        The reach convention and the shift-set construction. Used as an
        EXTERNAL CALIBRATION TARGET the instrument must hit, so a faulty
        recollection surfaces as a failed test rather than a silent wrong
        answer.
      verified_by: null

  assumptions:
    - >-
      E/F_p ordinary, <P> of prime order N ~ p, cofactor O(1); generic
      prime-field curves only.
    - >-
      Decomposition by tree elimination plus a Coppersmith-family solver, as in
      the closure.
    - >-
      The substitution is injective on the box (exact for digits; heuristic for
      generic GAPs, see H2).
    - >-
      Lattice dimension after refinement stays constant in p (it grows with r
      and t, not with p); LLL cost is charged, not hidden.

  proof_search_map:
    bottleneck: >-
      eps_available at the (m, w) = (4, 2) cell. The demand side is fixed at
      8/9 by (A); the entire question is whether polytope refinement raises the
      supply by 0.0481.
    baseline_embedding:
      parameter_slice: >-
        r = 1 must reproduce the closure exactly: support 13 monomials,
        eps = 0.8408, margin -0.0481. This is a hard gate before any r >= 2
        number is read.
      reproduction_check: >-
        Frozen fixture in tests/test_smallroot_reach.py extended with the
        substitution layer at r = 1 asserting the 13-monomial support and
        eps within 1e-3 of 0.8408; plus the existing --validate calibration
        against Coppersmith 1/d.
    observation_collision:
      observable: >-
        eps_avail, the extended-strategy reach of a support with a bound
        vector.
      distinct_preimage_search: >-
        Two objects with the same observable, one on each side of the
        conclusion. (i) A generic rank-r GAP and the base-d digit map give the
        SAME substituted support for the same r, so if their measured reaches
        differ the measurement is picking up coefficients, which the theory says
        it cannot -- an implementation bug. (ii) The refined S_3 support and a
        random polynomial with the identical refined support must have the same
        reach; a difference means curve information is leaking into a
        polytope-only quantity.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The same interval factor base, presented in r digit coordinates,
          so the decomposition system moves to a lower-degree-per-block,
          higher-dimension polytope at constant bound volume.
        predicted_gain: >-
          Full-box trend (2r+1)/(2r+2) at the worst block, crossing 8/9 at
          r = 4; each +0.01 of reach at (4, 2) converts to -0.03 in the time
          exponent (derivation in target_complexity).
      - transform: observable_fiber
        proposed_object: >-
          Hold the reach observable fixed and vary the forgotten structure:
          the univariate split, where the true answer 1/d is a theorem.
        predicted_gain: >-
          Separates a genuine polytope gain from an algebraic-independence
          artifact at zero mathematical cost.
    quantifier_order: >-
      EXISTS r >= 2 and EXISTS an injective volume-preserving parametrization
      of the leaf window by r bounded digits such that FOR ALL sufficiently
      large p and FOR ALL generic ordinary E/F_p the extended-strategy reach of
      the refined worst block exceeds 8/9 AND the recovered short vectors are
      algebraically independent. The witness r is allowed to depend on m and on
      the tree but NOT on p or on the instance; a construction whose r must grow
      with p would carry a lattice dimension growing with p and is excluded by
      the constant-dimension assumption.
    method_ceiling:
      strongest_certifiable_claim: >-
        A heuristic reach number for a refined polytope, plus a toy-scale
        planted-root recovery threshold. It can never certify an unconditional
        exponent, because Howgrave-Graham completeness holds only inside the
        bound and root extraction stays heuristic.
      nearby_object_control: >-
        The split univariate congruence, where the hoped-for conclusion
        (refinement raises reach) is known to be false at the level of the
        established 1/d value. A method that reports a gain there and a gain on
        S_3 has not identified any load-bearing structure.
    proof_obligations:
      - claim: The substitution is injective on the box and |V| = B(1 - o(1))
        responsibility: size
      - claim: eps_required is invariant under volume-preserving refinement
        responsibility: baseline
      - claim: >-
          The refined shift lattice has dimension independent of p and its LLL
          cost is charged
        responsibility: runtime
      - claim: The solver returns ALL windowed decompositions inside the reach
        responsibility: correctness
      - claim: >-
          Yield remains the KN-FIND-007 mean and coverage is measured, not
          assumed
        responsibility: success_probability
      - claim: Generic ordinary prime-field curves only; no crypto-scale claim
        responsibility: scope
    not_applicable_reason: null

  object_first:
    tracked_object: >-
      The REACH DATUM: the pair (Newton polytope of the decomposition system,
      bound vector on its unknowns).
    lossy_projection_test: >-
      Genuinely lossy: the projection discards every coefficient of the
      summation polynomial, hence the curve, the target, and F_p arithmetic
      itself; the fibre over one reach datum contains all 551,304 curve models
      of a 2^40 isogeny class (their S_3 support is the same 13 monomials) and
      every random polynomial with that support. What is discarded is discarded
      COMPATIBLY with the operations the method performs on it, because the
      Jochemsz-May shift-set construction -- Minkowski powers of the support,
      shifts by the leading monomial, the determinant condition -- is defined on
      support and bounds alone, so one-step propagation is deterministic on the
      projection. Honest scoring: NOT a new object. It is the same object the
      closure tracked, evaluated at a point of its parameter space the closure
      did not compute. What is new is the demand-neutrality lemma that makes
      that point the only supply-positive direction, and the identification of
      the digit lane with it.
    survival: >-
      Survives as long as the shift-lattice construction is polytope-driven,
      i.e. through every Coppersmith-family solver including the automated ones
      of IDEA-20260904-39336c. It dissolves at the algebraic-independence step,
      which is precisely where control (E) probes it.

  predictions:
    - metric: >-
        eps_avail(r) for the refined worst block at (m, w) = (4, 2),
        r in {1, 2, 3, 4}, extended strategy, t -> infinity
      direction: higher
      minimum_effect: >-
        eps_avail(1) = 0.8408 +/- 0.001 (gate). For r >= 2 either a strictly
        increasing sequence with at least one increment >= 0.01, or flat within
        0.005 across all r. Flatness is NOT a null result: it would say the
        reach is invariant under volume-preserving refinement, a statement no
        record in this corpus makes and one that closes the whole lever.
    - metric: >-
        eps_avail(r) - 8/9 at the best r <= 4
      direction: higher
      minimum_effect: >-
        Strictly positive is the alive branch and reopens the family with time
        exponent 1/2 - 3 * (eps_avail - 8/9). Any value <= 0 for every r <= 4
        extends the closure to rank-r and digit presentations, with the margin
        reported per r.
    - metric: >-
        Calculator value for the split univariate (dense total-degree-d simplex
        in n variables), against this record's derived closed form n/d
      direction: different
      minimum_effect: >-
        Agreement within 1e-3 at (n, d) in
        {(1,2),(1,3),(1,5),(2,3),(2,5),(3,4)}. A mismatch falsifies the
        derivation, not the idea, and blocks every other reading until
        reconciled.
    - metric: >-
        Empirical planted-root recovery threshold for the SPLIT univariate at
        p ~ 2^64, d = 3, LLL via python-flint, 20 trials per bound
      direction: different
      minimum_effect: >-
        If refinement is real, recovery should persist to box exponent
        2/d = 0.667 +/- 0.03. If the independence heuristic fails, recovery
        stops at 1/d = 0.333 +/- 0.03. The two predictions are 0.33 apart, far
        outside sampling noise at 20 trials, so this single sweep discriminates.
    - metric: >-
        Exact mean arity-m decomposition count over the digit-presented interval
        versus a matched random subset, toy p
      direction: different
      minimum_effect: >-
        Ratio 1.00 exactly (same set, same yield). Any deviation is an
        implementation error and is the cheapest available bug detector.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, hard gate). Write the demand-neutrality lemma (A)
      and the simplex closed form (E) symbolically. STAGE 1 (CPU-seconds). Add
      a substitution layer to tools/smallroot_reach.py that maps a support in
      x to its pull-back under x_k = sum_j a_j u_{k,j}, and call the existing
      jm_reach_extended on it; emit eps_avail(r) for r in {1,2,3,4} at
      (m, w) = (4, 2), with r = 1 asserted equal to the committed 0.8408 and
      the simplex fixture asserted equal to n/d. STAGE 2 (CPU-minutes, the
      decisive arm). Extend the existing --probe planted-root harness to the
      SPLIT univariate x = u_1 + D u_2 at p ~ 2^64 and d in {2,3,5}, and
      measure the largest box exponent at which the planted root is recovered,
      classifying failures as bound failures versus root-extraction failures.
      STAGE 3 (only if Stage 1 clears 8/9 AND Stage 2 shows no artifact).
      Planted-root probe on the refined S_3 block at toy p, with the
      scrambled-window null.
    controls:
      - >-
        r = 1 reproduction gate: refined-support code at r = 1 must return the
        committed 13-monomial support and 0.8408.
      - >-
        Theorem calibration: --validate must still return exactly 1/d for d in
        {1,2,3,4,5,8,16}.
      - >-
        Known-answer control: the split univariate, where 1/d is established
        and the refinement predicts 2/d.
      - >-
        Null polytope: a random polynomial with the identical refined support
        must give the same reach.
      - >-
        Scrambled-window null: a uniformly random size-B subset of F_p must not
        be recoverable at any r.
      - >-
        Yield control: exact decomposition counts for the digit-presented
        interval must equal those for the interval, since it is the same set.
      - >-
        Failure-mode separation: bound failure and algebraic-independence
        failure logged separately, or eps-hat under-reports.
    required_metrics:
      - >-
        eps_avail(r) and support size per r, with the t -> infinity
        extrapolation spread
      - >-
        eps_avail(r) - eps_required(4, 2) per r, and the implied time exponent
        1/2 - 3 * margin
      - >-
        measured versus derived reach on the simplex fixture
      - >-
        planted-root recovery threshold for the split univariate per d, with
        failure-mode classification
      - >-
        lattice dimension and LLL wall-clock per cell, charged

  falsification_conditions:
    - >-
      eps_avail(r) <= 8/9 for every r <= 4 and every tested block assignment.
      The rank-r and digit re-parametrization lever is closed on the
      archimedean axis, with a per-r margin table, and the closure of
      IDEA-20260903-81a943 extends from rank-1 to all volume-preserving
      refinements.
    - >-
      eps_avail(1) is not 0.8408 within 1e-3. The substitution layer is wrong;
      nothing else may be read.
    - >-
      The split univariate probe recovers only to 1/d while the calculator
      predicts 2/d. The Jochemsz-May independence heuristic fails under
      refinement; every refined reach in this family is an upper bound that LLL
      does not attain, and the honest supply number stays 0.8408. This outcome
      CLOSES the lever more strongly than a numeric shortfall, because it names
      the mechanism.
    - >-
      The split univariate probe recovers past 1/d, reproducibly, with the null
      failing. Univariate Coppersmith is improvable by variable splitting.
      Extraordinary; routed to independent review before any ECDLP reading,
      since it would be a result about lattices, not about curves.
    - >-
      The digit-presented and generic-GAP arms give different reaches at equal
      r. Implementation defect; blocks interpretation.

  confounders:
    - >-
      A generic rank-r GAP can be degenerate (multiplicatively related
      generators) and collapse to a smaller effective rank; measured |V| must be
      used, not nominal. The digit arm is immune and is therefore the primary
      arm.
    - >-
      Lattice dimension grows quickly in r (monomial count of the refined
      support to the power t); a reach that is only attained at dimensions too
      large to run is not a usable reach, and the dimension must be reported
      beside every eps.
    - >-
      The Jochemsz-May bound can be optimistic or pessimistic for a specific
      polytope; the univariate calibration bounds this only at n = 1, which is
      exactly why control (E) uses the split univariate rather than the plain
      one.
    - >-
      Windowed x-values give 0 or 2 points each, a factor-2 wobble in |V| that
      must not be read as a yield effect.
    - >-
      The C_2^{m-2} sign-pattern ambiguity costs 2^{m-2} per candidate;
      negligible in the exponent at m = 4 but must be charged.

  interpretation_limits:
    - >-
      Exponents only. No wall-clock claim, no crypto-scale claim, claim tier
      toy.
    - >-
      A positive at Stage 1 without Stage 2 is not a lead: an unattained bound
      is not a reach.
    - >-
      This tests ONE cell, (m, w) = (4, 2), because that is where the closure's
      margin is smallest; a negative there is extended to other cells only by
      running them, not by argument.
    - >-
      Nothing here bears on the Groebner-side digit lane; the two lanes share a
      representation and measure different objects.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For the refined systems considered, the Jochemsz-May reach computed
        from the Newton polytope is attained by an actual LLL run, i.e. the
        short vectors returned generate an ideal of dimension zero at the
        target point rather than lying in the pulled-back subring F_p[L],
        L = sum_j a_j u_j, uniformly for r <= 4 and lattice dimension <= 10^4.
      rigorous_support: >-
        Howgrave-Graham's lemma is unconditional -- a vector short enough
        yields an identity over Z. Only the algebraic independence of several
        such identities is assumed. The classical behaviour imitated is
        univariate Coppersmith, where dimension O(d/eps) suffices and the
        asymptotic bound is attained.
      validation_plan: >-
        SAMPLE: planted small roots in the SPLIT univariate at p ~ 2^64,
        d in {2, 3, 5}, box exponent swept in steps of 0.05 from 0.20 to 0.80,
        20 trials per point, LLL via python-flint; then the refined S_3 block
        at toy p ~ 2^24 with a planted windowed decomposition constructed by
        choosing the points first. COMPARISON: the recovery curve against the
        theorem value 1/d and against the refined prediction n/d. TAIL CHECK:
        the smallest successful and largest failed bound per cell, and the
        fraction of failures that are root-extraction rather than bound
        failures; a majority of root-extraction failures IS the signature H1
        predicts. TRANSFER ASSUMPTION: toy p calibrates the SHAPE of the
        recovery curve; it does not establish a crypto-scale reach, and the
        record says so.
    - id: H2
      statement: >-
        A random rank-r GAP of nominal size B has |V| = (1 - o(1))B, i.e.
        self-overlaps are negligible for r <= 4 and B <= p^{1/4}. For the
        base-d digit map the statement is exact, not heuristic.
      rigorous_support: >-
        Overlaps require nontrivial linear relations among the generators mod
        p, which are rare for random generators (genericity of random linear
        forms mod p); for digits the map [0,d)^r -> [0, d^r) is a bijection.
      validation_plan: >-
        Measure |V| directly for 10^3 random GAPs at each rank and each B;
        compare to nominal; exclude and report any GAP below 0.9 x nominal
        rather than averaging it in. Digits require no sampling.
    - id: H3
      statement: >-
        The digit-presented interval and any rank-r GAP of the same size have
        decomposition coverage within the Sidon ceiling factor 1.107 of a
        matched random base, so the exact-mean conservation of KN-FIND-007 is
        not hollowed out by concentration.
      rigorous_support: >-
        KN-FIND-007's mean identity is exact for every base and is a double
        count, not a heuristic; only coverage is free, bounded above by
        min(1, mu). The distribution imitated is the balls-in-bins coverage
        1 - e^{-mu} for an unstructured base.
      validation_plan: >-
        Exhaustive enumeration of V^m at B <= 32, m in {3, 4} on toy curves;
        report mean (must match exactly), coverage, and the concentration
        statistic max-count over mean. KN-FIND-007 recorded 1224x concentration
        for a structured base, so a large value here is the expected failure
        mode and must be reported even if it kills the idea. Since the digit
        arm is the SAME SET as the interval, its coverage must match the
        interval's identically -- a further exact bug detector.

  target_complexity:
    time_exponent: >-
      Conditional on H1 and on eps_avail(r) > 8/9 at (m, w) = (4, 2). This
      record derives the conversion the closure did not state: the total
      relation-collection exponent is T = 1 + beta + w - eps(w+1), so with
      Delta = eps_avail - eps_required, T = 1/2 - Delta(w+1). At (4, 2) each
      +0.01 of reach buys -0.03 in the time exponent. The family's current best
      point is therefore N^{0.5 + 3*0.0481} = N^{0.644}, and clearing the
      threshold by Delta gives N^{1/2 - 3 Delta}. Nothing below N^{1/2} is
      claimed; N^{0.644} is the honest present position.
    memory_exponent: >-
      N^{beta} with beta in (1/6, 1/4) at (m, w) = (4, 2) -- the factor base
      and the sparse relation matrix. Strictly less memory than time, unlike
      the Wesolowski exemplar. The refined shift lattice adds a memory term
      that is constant in p (dimension independent of p) but grows with r and
      must be reported per cell.
    best_known: >-
      Pollard rho / vOW, 0.886 sqrt(N) group operations at O(1) memory
      (KN-TECH-006); BSGS at sqrt(N) time and sqrt(N) memory.
    hidden_overhead: >-
      m! = 24 at m = 4 (a constant, not superpolynomial, because m is fixed
      here). LLL or BKZ at O~(D^6 bits^3) with D the refined shift dimension --
      a large polynomial that dominates concretely at any realistic p and grows
      with r, so the r that maximises reach is not necessarily the r that
      minimises cost. The 2^{m-2} sign-pattern factor. The reach is heuristic
      in the H1 sense, and H1 is the assumption this record's control attacks.
    tradeoff_note: >-
      Memory N^{beta} <= N^{1/4} places the family memory-light, so it must
      beat N^{1/2} outright rather than at large memory; vOW gives no relief at
      O(1) memory. Relation collection is embarrassingly parallel; block
      Wiedemann parallelizes the linear algebra with communication cost B.

  dominated_by: >-
    Pollard rho / vOW at N^{1/2} time and O(1) memory. Every frontier row
    checked: (1) parallel rho with negation and distinguished points,
    0.886 sqrt(N), O(1) memory -- dominates, since the family's present best is
    N^{0.644}; (2) BSGS, sqrt(N) time and memory -- dominates on time;
    (3) kangaroo / interval DLP -- not comparable, the target is full-range;
    (4) automorphism-discounted rho (KN-TECH-018) -- dominates by a further
    constant; (5) Pohlig-Hellman -- not applicable, N prime; (6) generic
    preprocessing frontier S*T^2 = N (Mihalcik, Bernstein-Lange) -- not
    comparable, no preprocessing is claimed; (7) multi-target Kuhn-Struik
    sqrt(TN) -- not comparable, single target; (8) special-curve attacks
    (anomalous, small embedding degree, Weil descent) -- out of scope, generic
    prime-field curves; (9) no published prime-field index calculus beats rho.
    Data and query axes: no oracle queries.

  sota_delta: >-
    +0 on time, memory and queries today. Quantified deltas claimed: (i) an
    exact lemma that eps_required is invariant under volume-preserving
    re-parametrization, which fixes the target every rank-r or digit reach must
    clear at 8/9 and removes a degree of freedom nobody had bounded;
    (ii) the conversion rate 1 unit of reach = (w+1) units of time exponent,
    giving the family's present position as N^{0.644} rather than an unnumbered
    "does not win"; (iii) the closed form eps = n/d for the dense
    total-degree-d simplex, a second calibration target for the instrument
    alongside Coppersmith's 1/d; (iv) the identification of the digit lane and
    the rank-r lane as one lever on this axis. If Stage 1 clears 8/9 and Stage
    2 shows no artifact, the delta becomes N^{1/2 - 3 Delta} against N^{1/2}.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    ~0.95 that the demand-neutrality lemma holds (it is an invariance of the
    three quantities the derivation uses). ~0.6 that eps_avail(r) rises
    measurably with r under the Jochemsz-May formula. ~0.25 that it clears 8/9
    at r <= 4. ~0.10 that the split-univariate control shows the gain is real
    rather than an independence artifact. Product: ~0.02 that the family
    reopens. Priority HIGH regardless, because the cost is CPU-minutes on an
    already-calibrated instrument and BOTH branches are decision-relevant:
    the negative extends today's closure to the last named successor with a
    mechanism instead of a margin.

  scope: >-
    Lattice-describable factor bases for prime-field ECDLP index calculus at
    (m, w) = (4, 2), under Coppersmith-family small-root solvers with shift
    lattices of dimension independent of p, at toy scale. Not a statement about
    non-tree strategies, about superpolynomial-dimension lattices, or about the
    Groebner-side digit lane.

