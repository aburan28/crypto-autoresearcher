idea:
  id: IDEA-20260808-f4edc6
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ECDLP-002
  goal_id: GOAL-PATH-001
  title: The window ledger — one frozen toy table of exact windowed decomposition counts and
    solver reach that simultaneously discriminates E1-01, E1-02, E1-06, E1-10 and E1-13, with
    a scrambled-window null as the artifact tell.
  class: measurement
  claim: 'Five records in this slice turn on two measurable quantities that no artifact in
    this repository currently contains: (Y) the exact number of windowed m-decompositions
    of a uniform target, as a function of (p, m, B, window type), and (R) the largest B at
    which a small-root solver still returns a PLANTED windowed decomposition, as a function
    of the same parameters plus the shift dimension. The claim is that a single frozen sweep
    produces both, that its cost is CPU-hours rather than CPU-months, and that its outcome
    is decisive in both directions: (Y) matching the KN-FIND-007 mean with Poisson-shaped
    fluctuations removes yield as an explanation for anything and forces the whole windowed
    programme onto the solver; (Y) departing from the mean is itself a first-order finding,
    because the mean is an exact identity and a departure can only come from a mismeasured
    factor base; (R) tracking the derived reach validates the E1-01 instrument, and (R) departing
    from it by more than 0.05 invalidates every reach-based conclusion until reconciled.'
  mechanism: 'Y is obtainable exactly by enumeration whenever B^m is at most about 2^30, which
    at m = 3 allows B up to 2^10 and at m = 4 up to 2^7 — small, but enough to span the regime
    where B^m/p crosses 1 if p is chosen in [2^18, 2^28]. R is obtainable by construction:
    choose m windowed points, set the target to their sum, and ask the solver to recover them.
    Planting removes the confound that a failure might mean "no decomposition existed".'
  why_not_a_renamed_known_approach: 'The repository''s existing yield artifacts (EXP-FB3-001
    and its conservation note) measure mean yield for abstract factor bases in an abstract
    group, at m = 3 and N <= 2^18, which is exactly the quantity KN-FIND-007 proves is geometry-independent;
    they therefore cannot distinguish window types. This ledger measures coverage, variance
    and solver reach — the three quantities KN-FIND-007 explicitly leaves free — on real curves
    with real windows. It is not the RQ-SDEG solving-degree ladder either: that measures Groebner
    degree, this measures a lattice reach and an exact count.'
  predictions:
  - observable: exact mean of windowed decomposition counts
    metric: measured mean vs C(B+m-1,m)/N
    predicted: equal to machine precision, at every cell, for every window type; this is an
      identity and any deviation is a bug in the harness
  - observable: coverage
    metric: fraction of targets with at least one windowed decomposition, vs 1 - exp(-mu)
    predicted: within Poisson error for interval, AP and random-subset arms; a systematic
      shortfall for the interval arm would indicate additive clustering and would be a genuine
      finding against the windowed programme
  - observable: variance
    metric: Var(count)/mean
    predicted: 1 (Poisson) for all arms; an excess for the interval arm indicates structure
  - observable: planted-root recovery threshold
    metric: eps-hat = log_p(B^m) at failure, per solver configuration
    predicted: matches the E1-01 derived eps within 0.05; the scrambled-window arm must fail
      at every B, which is the artifact tell
  minimal_test: This record IS the minimal test; its own minimal form is the single cell (p
    ~ 2^22, m = 3, B in {2^6, 2^7, 2^8}, arms = interval / AP / random subset), which produces
    the yield half in minutes and the reach half in hours.
  controls:
  - 'Scrambled-window null (random size-B subset): the canonical artifact tell. Any solver
    "gain" that survives scrambling is lattice luck, not window structure.'
  - Random-polynomial null with the same Newton polytope, to separate polytope effects from
    curve effects.
  - Exhaustive-enumeration ground truth at the smallest cell, to verify the counter itself.
  - Planted positive control with a known decomposition, so a null result cannot be confused
    with an absent solution.
  - 'Decay control: increase the parameter meant to destroy the effect (scramble fraction
    of the window, from 0 to 1) and confirm the reach decays monotonically to zero. A quantity
    that fails to decay is the canonical artifact per docs/inventor-protocol.md section 3.'
  confounders:
  - x-coordinate 2:1 fibres and 2-torsion inflate |V| and counts; normalise by measured |V|.
  - Small p makes B^m/p coarse; at least four p values are needed to see the crossing.
  - Solver failures from precision or from root extraction must be classified separately from
    failures from the bound, or eps-hat is under-reported.
  falsification_conditions:
  - Measured mean differs from C(B+m-1,m)/N by more than floating-point error => harness bug;
    nothing else may be interpreted until fixed.
  - Interval coverage or variance departs materially from the random-subset arm => windows
    have additive structure that KN-FIND-007's mean cannot see, which reopens the yield question
    for boxes specifically (and is exactly what E1-06's bound would predict).
  - Scrambled-window arm recovers planted roots => the reach measurement is an artifact and
    E1-01 / E1-05 / E1-10 / E1-13 lose their instrument.
  interpretation_limits: Toy scale, explicitly. The yield half generalises better than the
    reach half, because the mean is an identity and the coverage/variance statistics are dimensionless;
    the reach half calibrates instrument shape only and must never be quoted as a crypto-scale
    eps. No claim about any curve above 2^28 is licensed by this ledger.
  assumptions:
  - Curves generated with prime-order subgroup and known order; window arms of matched measured
    size.
  - Solver configuration (reduction algorithm, block size, shift set) pinned in the contract.
  heuristic_assumptions:
  - id: HA-1
    statement: Windowed decomposition counts over uniform targets are Poisson with parameter
      mu = C(B+m-1,m)/N, uniformly over the tested (p, m, B) grid.
    rigorous_ingredient: '"The exact mean identity of KN-FIND-007."'
    distribution_imitated: '"Representation-function Poisson heuristic for random sumsets."'
    validation_route: This ledger is the validation route; it is shared by E1-01 HA-1 and
      E1-06 HA-1 and must be produced once, not three times. Label toy.
    tail_checks: Coverage <= min(1, mu); coverage ratio against a random base bounded by the
      Sidon ceiling 1.107 recorded in KN-FIND-007; maximum count within a log factor of Poisson.
  - id: HA-2
    statement: Planted decompositions are distributed like naturally occurring ones, so recovery
      thresholds measured on planted instances transfer to natural instances.
    rigorous_ingredient: '"Planting fixes the leaves uniformly in the window; the target is
      then uniform in <P>."'
    distribution_imitated: '"Uniformity of sums of uniform windowed points, the same equidistribution
      as E1-02 HA-1."'
    validation_route: At the smallest cell, compare recovery rates on planted instances against
      naturally found ones from the exhaustive enumeration. Label toy.
    tail_checks: If recovery rates differ, planting is biased and the reach measurement must
      be redone on natural instances only, at a much higher cost.
  target_complexity:
    time_exponent: '"Not an algorithm. It supplies the two parameters (yield distribution,
      reach) that four other records need."'
    memory_exponent: '"Toy; the largest object is a B^m enumeration buffer at most 2^30 entries,
      streamed."'
    best_known_baseline: '"rho at the same toy sizes, run in the same harness, for cost calibration
      only."'
    hidden_overhead_disclosure: '"None claimed; all measured quantities are toy and labelled
      toy."'
    time_memory_tradeoff: '"n/a."'
  sota_delta: Zero as an attack. As evidence it is the highest information-gain-per-CPU-hour
    item in this slice, because a single artifact discriminates five proposals and carries
    a pre-registered artifact tell.
  dominated_by: n/a (no result claimed). No existing artifact in the repository measures windowed
    coverage, variance or solver reach on real curves, so nothing dominates it as an instrument.
  estimated_cost: '"Implementation medium (extends the existing Semaev harness with a window
    layer and a shift-lattice module); compute low, CPU-hours."'
  recommended_priority: high
  honest_prior_of_survival: ~0.95 that the yield half produces a clean, interpretable table.
    ~0.6 that the reach half produces a usable eps-hat curve on the first attempt; lattice
    instruments commonly need a second pass to separate bound failures from precision failures.
  novelty_status: screened
  novelty_screen: Screened against EXISTING_PROPOSALS.txt, EXISTING_HYPOTHESES.txt, KNOWLEDGE_BARRIERS.txt
    and KN-FIND-007 in full (which describes EXP-FB3-001's abstract-group battery at N <=
    2^18, m = 3). No artifact measures windowed coverage/variance on curves or any solver
    reach. External literature UNVERIFIED (no web access this session).
  discriminated_from: EXP-FB3-001 / KN-FIND-007 (abstract-group mean yield — the quantity
    proven invariant; this measures the three quantities left free); RQ-SDEG-001 ladder (Groebner
    solving degree — a different cost indicator); EXP-COPP-001 (windowed density at m = 2
    — different arity and a density rather than a reach criterion).
  source_refs:
  - KN-FIND-007 (in-repo, read in full), KN-TECH-015, KN-TECH-002, KN-TECH-006 (in-repo)
