idea:
  id: IDEA-20260807-0e4d83
  question_id: RQ-EQLA-0d3f40
  added: '2026-08-07'
  title: >-
    INFORMATIVE RANK, NOT RANK: on a phi-stable factor base the phi-image of a
    relation row is, as a linear functional on the only subspace the unknown log
    vector can inhabit, exactly lambda times the original row - so appending
    phi-orbit rows adds provably ZERO usable rank, and the correct progress
    meter for the linear-algebra stage is rank(M restricted to V_lambda), a
    quantity computable from lambda and the orbit permutation alone with no
    discrete logarithm

  class: mechanism

  claim: >-
    (A) THE SETTING. E/F_p with j = 0 (a = 0), p = 1 mod 3, zeta a primitive
    cube root of unity in F_p, phi(x, y) = (zeta x, y) the order-3 automorphism.
    G = <P> of prime order N, x_i = log_P(P_i) for a factor base
    F = {P_1, ..., P_B} that is a union of phi-orbits, with sigma the index
    permutation defined by P_{sigma(i)} = phi(P_i).

    (B) THE TWO ELEMENTARY FACTS, both exact, neither heuristic.
      FACT 1 (determinacy, known - IDEA-20260727-001, H-ENDO-001). phi acts on
      G as multiplication by lambda with lambda^2 + lambda + 1 = 0 mod N.
      Hence x_{sigma(i)} = lambda x_i, so the unknown vector x lies in
        V_lambda := { v in F_N^B : v_{sigma(i)} = lambda v_i },
      a subspace of dimension exactly B/3, NOT in F_N^B.
      FACT 2 (row redundancy - THE NEW CONTENT). Let r in F_N^B be any relation
      row and let r^sigma be its phi-shift, r^sigma_{sigma(i)} := r_i. Then for
      EVERY v in V_lambda,
        r^sigma . v = sum_i r_i v_{sigma(i)} = sum_i r_i lambda v_i
                    = lambda (r . v).
      So on V_lambda the shifted row is a SCALAR MULTIPLE of the original row.
      It is a different vector in F_N^B and it generically raises rank(M) by 1,
      but it raises rank(M|_{V_lambda}) by 0. Exactly. Always. For every row,
      every curve, every factor base, every arity.

    (C) THE CLAIM. rank(M|_{V_lambda}) = rank(M_base|_{V_lambda}), where M_base
    is the sub-matrix of un-shifted (independently harvested) rows. Therefore
    the entire block-circulant / low-displacement-rank signature that
    H-STR-002 and EXP-STR-002/003/004 have been measuring is produced by rows
    that carry no information about the factor-base logarithms, and any progress
    metric computed on the full B-column matrix - rank(M), phi_alpha,
    rand_alpha, rank deficiency B - rank(M) - is measuring the wrong object.
    The right object is the (B/3) x (B/3) FOLDED matrix
      tilde-r_s = sum_{t=0}^{2} lambda^t r_{sigma^t(i_s)},   s = 1..B/3,
    which is the coordinate expression of restriction to V_lambda.

    (D) WHY THIS IS CHEAPER THAN THE EXISTING CONTROL. IDEA-20260727-001
    proposed to settle determinacy by BRUTE-FORCE COMPUTING ALL B FACTOR-BASE
    LOGARITHMS and reporting a residual fraction. That is only possible at toy
    sizes and it tests FACT 1, which is already a theorem. FACT 2 is a rank
    identity in the row space: it needs lambda (a root of L^2 + L + 1 mod N,
    obtained by one square root mod N) and sigma (obtained by one field
    multiplication per factor-base element). NO DISCRETE LOGARITHM IS COMPUTED
    AT ANY POINT, so the measurement runs at any B the machine can hold and the
    verdict is exact rather than statistical.

    (E) THE THREE OUTCOMES AND WHAT EACH MEANS.
      OUTCOME 1 - measured informative-rank gain from appended rows is exactly
        0 at every cell. FACT 2 is confirmed operationally, the appended-row
        signature is certified information-free, and EV-STR-003's UC-1
        ("the phi_alpha instrument is UNADJUDICATED") is settled in the only
        direction that a theorem permits: not by declaring phi_alpha an
        artifact, but by exhibiting a DIFFERENT metric whose meaning is proved.
      OUTCOME 2 - measured gain is nonzero at some cell. Then either the factor
        base is not exactly phi-stable (truncation - the committed harness's
        `xs[:B]` cut, EV-STR-003 O-4), or lambda was computed for the wrong
        root, or sigma does not match phi on the chosen lifts (the sign question
        of IDEA-20260807-add964). Each of these is a named, separately testable
        implementation fault, so OUTCOME 2 is a bug-locator, not a discovery.
      OUTCOME 3 - the folded matrix has informative rank strictly below the
        number of base rows. That is the interesting one: it would mean the
        harvested relations are themselves dependent beyond the phi-redundancy,
        which is a statement about relation COLLECTION and hands the lane to
        IDEA-20260807-d6956c.

  resource_label: >-
    R1 + R3. R3: End(E) as a ring supplies lambda and the Z[phi]-module
    structure of the unknown vector. R1: the phi-action is realised as ONE
    multiplication of a field element (x -> zeta x), not as a group operation,
    which is why the orbit is buildable at all.

  admissibility: admissible

  admissibility_argument: >-
    Admissible, but narrowly and with the ceiling stated. The lane does not
    merely "apply phi to points of G": the object measured is a rank over F_N of
    a matrix of field data, and the phi-orbit is generated by field
    multiplication rather than by the group oracle. Simulating phi(P)
    generically costs about log N group operations (multiply by the scalar
    lambda), so evaluating phi as one field multiplication is a genuine
    non-generic saving - of a log N factor, on the orbit-construction step
    ONLY, which is not where the cost lives. The INFORMATION content of the
    resulting rows is generic-group simulable (KN-FIND-b7e091 Oracle D), and
    this proposal's whole point is to MEASURE that rather than assume it. A
    proposal that assumed it would be inadmissible; one that tests it with an
    exact rank identity is the admissibility filter being applied, not evaded.

  discriminated_from:
    - >-
      IDEA-20260727-001 (the orbit-quotient control). That record asserts
      determinacy (FACT 1) and proposes to verify it by brute-force computing
      every factor-base logarithm, then compares three COST MODELS. This
      proposal states and tests FACT 2, a rank identity that record does not
      contain, needs no logarithm, and replaces a cost-model comparison with an
      exact linear-algebra verdict. Where they touch: this record's OUTCOME 1
      implies that record's predicted determinacy residual is 0, and the two
      must agree at any instance where both are run.
    - >-
      H-STR-002 / EV-STR-002 / EV-STR-003 / EV-STR-004 and the `phi_alpha`
      displacement-rank metric. Those measure a statistic of the full B-column
      matrix whose meaning is recorded as UNADJUDICATED (EV-STR-003 UC-1,
      EV-STR-004 O-2 `mixed`). This proposal does not re-litigate phi_alpha, does
      not assert it is an artifact, and does not restore it. It introduces a
      different metric and proves what that metric means before measuring it.
      Per the L5 lane constraint, it does not re-assert H-STR-002; it tests a
      quantity no arm of EXP-STR-002/003/004 computed.
    - >-
      H-EQJ-001 / EV-EQJ-001 / DEC-20260718-006 (isotypic decomposition of the
      m = 4 summation fiber under B_3 = S_3 semidirect (Z/2)^3, rejected_scoped).
      That group permutes the SUMMANDS of a decomposition and does NOT act on G
      as a scalar; its measured failure mode was the opposite of this one -
      "rank never splits, every surviving block has r_lambda = r_full". Here the
      group acts on the FACTOR BASE and DOES act as a scalar, so the rank splits
      perfectly and the failure mode is that the split is already the orbit
      quotient. The contrast is the point and is recorded here so the two are
      not conflated.
    - >-
      EV-STR-001 (arithmetic-progression displacement rank). That failed because
      an ADDITIVE translation of x-coordinates is not induced by any map on
      points, so no determinacy existed and no rows were redundant; it died on
      supply. This lane has the opposite pathology: perfect determinacy, perfect
      redundancy, and supply that is merely 2-3x worse.

  object_first_candidate:
    tracked_object: >-
      THE RESTRICTED FUNCTIONAL: a relation row viewed not as a vector in F_N^B
      but as the linear functional it induces on V_lambda, the unique subspace
      the unknown logarithm vector can occupy. Concretely the folded row
      tilde-r in F_N^{B/3}.
    lossiness: >-
      GENUINELY LOSSY, and the loss is exactly 2B/3 of the B coordinates: the
      map r -> tilde-r has a kernel of dimension 2B/3 (the two non-lambda
      isotypic components of the sigma-action). It passes the lossy-projection
      test of docs/inventor-protocol.md section 2 in the direction the test
      cares about: it is NOT a change of coordinates, because r cannot be
      recovered from tilde-r. What it discards is discarded COMPATIBLY with the
      operations, because sigma acts on the discarded components by scalars
      zeta^0 and zeta^2 and never mixes them back into the lambda-component -
      Maschke plus the split of F_N[C_3] guarantee this, using only that
      gcd(3, N) = 1 and that 3 | N - 1 (which is forced, since lambda has
      multiplicative order 3 mod N).
      THE HONEST COUNTERPART: the SET of three folded rows
      {tilde-r, widetilde{r^sigma}, widetilde{r^{sigma^2}}} loses nothing beyond
      what tilde-r already loses, since the second and third are lambda and
      lambda^2 times the first. That is the whole finding.
    propagation: >-
      One step is exactly defined and deterministic: folding commutes with
      sigma-shifting up to the scalar lambda,
      widetilde{r^sigma} = lambda tilde-r. Under adding a new harvested
      relation, tilde-r appends a new row. Under changing the factor base, the
      orbit representatives change and tilde-r changes by a diagonal rescaling
      (choosing a different representative in an orbit multiplies that column by
      a power of lambda), which changes no rank.
    survival_score: >-
      Survives: arity m, factor-base construction rule, curve within the j = 0
      family, prime N, sparse or dense solvers, and any relabelling. Dies at:
      an orbit that is not exactly closed (truncation), a factor base whose
      lifts are inconsistent with phi (the j = 1728 sign obstruction,
      IDEA-20260807-add964), and any group action that is not scalar on G - at
      which point V_lambda does not exist and the whole object is undefined.
      That last boundary is the forward-guidance handle for the lane.

  mechanism: >-
    STEP 1 (zero compute, derivation, must be archived before measurement).
    Write the two-line proof of FACT 2 above and the identity
    tilde-r_s = sum_t lambda^t r_{sigma^t(i_s)}, together with the statement
    that the map r -> tilde-r IS the isotypic projection onto the
    lambda-eigenspace of the sigma-action, expressed in orbit-representative
    coordinates. This is the derivation artifact that
    docs/claims-and-verification.md requires to exist BEFORE a decision rests on
    it (the gap EV-STR-003 recorded as `proof_status_basis`).

    STEP 2 (cheap). On each toy j = 0 instance: compute lambda by solving
    L^2 + L + 1 = 0 mod N; verify lambda^3 = 1 and lambda != 1; build a factor
    base as a union of COMPLETE phi-orbits with no truncation (B divisible by 3
    by construction, so the B mod 3 != 0 crash path of
    harness/endomorphism_la.py:451 is never entered and the instance set is not
    silently filtered); record sigma explicitly.

    STEP 3 (the measurement). Harvest R base relation rows by the existing
    decomposition search. Build three matrices: M_base (R rows), M_closed
    (3R rows: each base row plus its two sigma-shifts), and the folded matrices
    tilde-M_base and tilde-M_closed over F_N^{B/3}. Report the four ranks and
    the two DIFFERENCES that carry the claim:
      raw_gain      := rank(M_closed) - rank(M_base)          [predicted ~2R]
      informative_gain := rank(tilde-M_closed) - rank(tilde-M_base)  [predicted 0]

    STEP 4 (the meaning). Report `relations_needed_for_full_informative_rank`:
    the number of BASE rows at which rank(tilde-M) first reaches B/3. That, and
    not the row count, is the quantity index calculus is actually buying with
    its search budget. Compare it against the same quantity for a size-matched
    generic (non-phi-stable) factor base with B columns and B unknowns.

    STEP 5 (the null, run on the identical pipeline). See null_object_control:
    the load-bearing null is NOT a random matrix - a random matrix must show the
    SAME collapse, because FACT 2 is a statement about the operator, not about
    elliptic curves. The load-bearing null perturbs the FOLDING WEIGHT.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Ripgrep over the whole repository on 2026-08-07, patterns:
      "informative rank|rank restricted|eigenspace|isotypic|commutant|Wedderburn"
      (case-insensitive); "orbit-quotient|orbit quotient|quotient matrix|B/r|B/3";
      "block-circulant|block circulant|circulant"; "Wiedemann|Lanczos";
      "displacement rank". Full reads of IDEA-20260726-002, IDEA-20260727-001,
      H-STR-002, EV-STR-001, EV-STR-002, EV-STR-003, EV-STR-004, H-EQJ-001,
      EV-EQJ-001, H-ENDO-001, KN-FIND-b7e091, harness/endomorphism_la.py.
      External: eprint 2020/1315 abstract fetched and its two factors read
      directly (1/n on polynomial systems, n^2 on linear algebra).
    results: >-
      "circulant": 291 occurrences over 109 files; the ECDLP-relevant ones are
      the H-STR-002 lane (IDEA-20260726-002, IDEA-20260727-001, H-STR-002,
      EV-STR-002, harness/endomorphism_la.py) and RQ-EQLA-0d3f40 itself.
      "isotypic": the only ECDLP hits are H-EQJ-001 / EV-EQJ-001 /
      DEC-20260718-006, on a DIFFERENT group acting on the summands, not on the
      factor base. "informative rank": ZERO hits anywhere in the repository.
      The identity widetilde{r^sigma} = lambda tilde-r appears in no record:
      IDEA-20260727-001 states the determinacy of the UNKNOWNS and the folding
      construction, but never observes that the appended ROWS are consequently
      exactly redundant, and never separates rank(M) from rank(M restricted to
      V_lambda). EV-STR-003 O-9 reports rank deficiencies 4, 6, 30, 67 on the
      unfolded matrix - the quantity this proposal argues is the wrong one - and
      no record anywhere reports a folded rank.
    verdict: >-
      ADAPTATION. The determinacy is known and published (the orbit reduction of
      Galbraith-Granger-Merz-Petit, eprint 2020/1315, with their extension degree
      n replaced by the constant 3); nothing about it is claimed as new. What is
      new to this corpus is the row-redundancy identity, the informative-rank
      metric, and the observation that the metric is computable without any
      discrete logarithm. No novelty is claimed against the external literature
      and a Stage-0 check for a published statement of FACT 2 is part of the
      design; a positive hit there is an ingredient, not a disappointment.

  null_object_control: >-
    MANDATORY AND BLOCKING, and its design is unusual enough to state carefully.
    NULL 1 - MATCHED RANDOM MATRIX (shape, density, column-orbit structure).
    A random 0/1 matrix with the same dimensions, the same row-weight
    distribution, the same column-orbit partition, closed under sigma. PREDICTED
    OUTCOME: the SAME informative_gain of exactly 0. This is NOT a
    falsification. FACT 2 quantifies over all rows, so the collapse must appear
    on the null, and the fact that it does is what establishes that the
    signature is a property of the OPERATOR and carries no elliptic-curve
    content. Reporting the collapse as a curve-specific finding without having
    run this null is prohibited.
    NULL 2 - THE LOAD-BEARING ONE: THE FOLDING WEIGHT. Refold with weight
    mu instead of lambda, for mu drawn uniformly from F_N^* with mu^3 != 1.
    PREDICTED OUTCOME: informative_gain jumps to about 2R, i.e. the redundancy
    vanishes completely. DECAY PARAMETER: the fraction c in [0, 1] of orbits
    folded with the correct lambda. informative_gain must decay monotonically
    from about 2R at c = 0 to exactly 0 at c = 1, and the decay must be
    approximately linear in the number of correctly folded orbits. A statistic
    that stays flat as c increases is the canonical artifact tell of
    docs/inventor-protocol.md section 3 and voids the measurement.
    NULL 3 - PLANTED POSITIVE. A synthetic sigma-closed matrix whose rows are
    deliberately NOT sigma-shifts of one another (independent rows that merely
    happen to have sigma-symmetric support). The instrument must report
    informative_gain > 0 there, or it cannot detect genuine new information and
    every zero it reports is void.

  assumptions:
    - >-
      N is prime, N > 3, and lambda has multiplicative order 3 mod N. Both are
      checked per instance, not assumed; lambda's order forces 3 | N - 1 and
      hence that F_N contains primitive cube roots of unity, which is what makes
      the isotypic split total over F_N. If the check fails the instance is
      excluded and the exclusion is recorded.
    - >-
      The factor base is a union of COMPLETE phi-orbits with no truncation, and
      the chosen lift of each x-coordinate is consistent with phi. For j = 0,
      phi preserves the y-coordinate, so the natural lift convention is
      automatically consistent and sigma is an unsigned permutation; this is
      derived in IDEA-20260807-add964 and must not be assumed for j = 1728.
    - >-
      Relation rows are over Z (or F_N) with the target's coefficient recorded.
      EV-STR-003 O-9 records that the committed harness builds bare 0/1
      incidence vectors with no right-hand side and assembles no linear system;
      this proposal requires the right-hand side and therefore requires a driver
      change, which is declared here rather than discovered later.
    - >-
      Toy scale, p up to about 32 bits, pure Python. Nothing here is a
      crypto-scale statement and the record does not license one.

  proof_search_map:
    bottleneck: >-
      There is no computational bottleneck: the load-bearing step is a two-line
      identity. The bottleneck of the LANE it prices is the rank computation on
      the folded (B/3) x (B/3) matrix over F_N, which is what any solve must do
      anyway.
    baseline_embedding:
      parameter_slice: >-
        B = 27, the 12-bit seed-1 instance of EXP-STR-003 (p = 2293, n = 733,
        arm A). At that cell the committed record gives phi_alpha = 9, hits 15,
        attempts 27, rank deficiency B - rank_M = 4. Reproducing those exact
        integers with the new driver, before any folded quantity is reported, is
        the embedding check.
      reproduction_check: >-
        Frozen regression fixture against RUN-STR-phi-b12-s1-m2 and
        RUN-STR-003-A-b12s1 on the five fields those records share (B, n, hits,
        attempts, phi_alpha). Exact integer comparison. A mismatch is an
        instrument-comparability failure and halts the line; it is not a finding.
    observation_collision:
      observable: >-
        informative_gain, the integer rank(tilde-M_closed) - rank(tilde-M_base).
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED. Two ground-truth objects with the same
        observable: (i) a genuine phi-orbit-closed relation matrix from a j = 0
        curve, and (ii) NULL 1, a random sigma-closed matrix with no curve behind
        it. Both must give 0. The collision does not falsify the measurement; it
        CALIBRATES it, and it fixes exactly what may be concluded from a zero:
        that the operator forces it, not that the curve does. Any write-up that
        reports informative_gain = 0 as an elliptic-curve finding without this
        collision on record is overclaiming.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move "does the phi structure help the linear algebra" out of a cost
          comparison and into the exact vanishing condition
          rank(tilde-M_closed) - rank(tilde-M_base) = 0 over F_N. Encoding
          obligation: the folding map and lambda; completeness: every relation
          row folds; soundness: the fold is injective on V_lambda^*; transfer:
          rank over F_N is the rank that the solve sees; cost-loss: none, the
          fold costs nnz field multiplications.
        predicted_gain: >-
          Converts an UNADJUDICATED statistic (phi_alpha, EV-STR-003 UC-1) into
          a proved one. The gain is in the strength of the statement, not in
          attack cost.
      - transform: stronger_invariant
        proposed_object: >-
          The full rank-arrival curve rank(tilde-M) as a function of the number
          of base rows harvested, rather than the single endpoint. A curve
          rather than a point, and it is what survives a change of arity.
        predicted_gain: >-
          Directly yields `relations_needed_for_full_informative_rank`, the
          quantity IDEA-20260807-d6956c needs, at no extra cost.
    quantifier_order: >-
      Intended, and it is the strong order: FORALL j = 0 curves in the declared
      family, FORALL phi-stable factor bases F, FORALL relation rows r, the
      shifted row r^sigma satisfies r^sigma . v = lambda (r . v) for ALL
      v in V_lambda. The witness lambda depends on the CURVE (through N) and on
      nothing else - not on the row, not on the factor base, not on the seed.
      The dangerous weaker reading, NOT claimed and not needed: for each row
      there EXISTS some scalar making it redundant.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On a phi-stable factor base over a j = 0 prime-field curve, phi-image
        relation rows contribute exactly zero rank to the system that determines
        the factor-base logarithms." It can NEVER certify anything about the
        DENSITY of harvested relations, about relation-collection cost, about
        arity, or about the ECDLP. Any summary dropping the word "rank" is
        overclaiming.
      nearby_object_control: >-
        The nearby object where the conclusion must FAIL: a group acting on the
        factor base that does NOT act as a scalar on G - the S_3 permutation of
        summands studied in H-EQJ-001, or a set-symmetry of the factor-base
        defining condition not induced by any endomorphism. There V_lambda does
        not exist, folding is undefined, and the method must be silent. A method
        that produced "0" there would not have identified the load-bearing
        structure. EV-EQJ-001 independently measured the opposite behaviour
        (rank never splits) for exactly that object, which is corroborating.
    proof_obligations:
      - claim: widetilde{r^sigma} = lambda tilde-r for every row r.
        responsibility: correctness
      - claim: dim V_lambda = B/3 and F_N[C_3] splits totally over F_N.
        responsibility: correctness
      - claim: The folded rank equals the rank the solve sees.
        responsibility: interface
      - claim: The planted-positive control yields informative_gain > 0.
        responsibility: soundness
      - claim: The B = 27 fixture reproduces the committed integers.
        responsibility: baseline
      - claim: Every reported number names its instance and its claim tier.
        responsibility: scope

  heuristic_assumptions:
    - id: HEUR-L5-1
      statement: >-
        NONE OF THE LOAD-BEARING CLAIMS IS HEURISTIC. FACT 1 and FACT 2 are
        exact statements of finite linear algebra over F_N and are proved, not
        assumed. This entry exists to record that fact explicitly rather than by
        omission, per agents/idea-generator.md.
      rigorous_support: >-
        FACT 1: End(G) = Z/N because G has prime order (H-ENDO-001). FACT 2: the
        displayed two-line computation. Neither imitates a distribution theorem
        because neither is distributional.
      validation_plan: >-
        Not applicable. What IS validated experimentally is that the
        IMPLEMENTATION realises the identity - which is a code-correctness check
        against a theorem, and is reported as such and never as evidence for the
        theorem.
    - id: HEUR-L5-2
      statement: >-
        The number of base relations required for rank(tilde-M) to reach B/3 is
        B/3 + O(1) - i.e. harvested relations behave, after folding, like
        uniformly random vectors of their weight in F_N^{B/3}.
      rigorous_support: >-
        Imitates the classical statement that a random sparse matrix over F_q
        with row weight w >= 3 attains full rank after n + O(1) rows with
        probability bounded away from 0 (the coupon-collector / random-matrix
        rank-defect distribution over F_q, whose defect distribution has mass
        prod_{i>0}(1 - q^{-i}) at 0). It is NOT a theorem here: relation rows
        are not uniform, they are supports of decompositions.
      validation_plan: >-
        Measure the excess directly at every toy B, phi arm against a
        size-matched generic base, and report the excess as a function of B.
        Predicted distribution: the F_N random-matrix rank-defect law. Tail
        check: the largest single-instance excess. TOY SCALE ONLY and labelled
        so. This heuristic is the one IDEA-20260807-d6956c is built to test at
        length; it is flagged here because if it fails the g-fold saving is
        eaten and this proposal's OUTCOME 3 fires.

  predictions:
    - metric: informative_gain = rank(tilde-M_closed) - rank(tilde-M_base)
      direction: lower
      minimum_effect: >-
        EXACTLY 0 at every cell, on every instance, at every B, for both the
        curve arm and NULL 1. Not "small" - zero. A single nonzero cell with a
        passing lambda-order check and a verified complete-orbit factor base
        falsifies FACT 2 as implemented and triggers the bug-locator branch.
    - metric: raw_gain = rank(M_closed) - rank(M_base)
      direction: higher
      minimum_effect: >-
        At least 1.5 R where R is the number of base rows (predicted about 2R).
        This is the number that makes the finding quantitative: it is the exact
        size of the rank illusion that unfolded metrics report. If raw_gain is
        also near 0, the appended rows are duplicates rather than shifts and the
        collection rule, not the mathematics, is what is being measured.
    - metric: >-
        informative_gain under NULL 2 as a function of the correct-fold fraction c
      direction: lower
      minimum_effect: >-
        Monotone decreasing in c, from at least 1.5 R at c = 0 to exactly 0 at
        c = 1, with at least three intermediate c values measured. A flat curve
        voids the instrument.
    - metric: >-
        relations_needed_for_full_informative_rank, phi-stable base of size B
        against size-matched generic base of size B
      direction: different
      minimum_effect: >-
        Predicted ratio 1/3 (B/3 against B), i.e. the phi base needs three times
        FEWER relations. Any measured ratio above 0.5 means the folded rows are
        not behaving like independent relations and HEUR-L5-2 has failed.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): archive the derivation of FACT 2 and
      the folding identity. Nothing is measured before this exists as a
      committed artifact - this is the exact gap EV-STR-003 recorded when a
      derivation lived only inside review reports.
      STAGE 1 (minutes): on one 12-bit j = 0 instance with B = 27 (divisible by
      3), reproduce the five committed EXP-STR-003 arm-A integers. HARD GATE.
      STAGE 2 (minutes): compute lambda, verify lambda^3 = 1 and lambda != 1 and
      1 + lambda + lambda^2 = 0 mod N; build sigma; assert sigma^3 = identity
      and that sigma has exactly B/3 orbits of length 3.
      STAGE 3 (the whole test, minutes at toy scale): harvest R base rows WITH
      right-hand sides; compute the four ranks; report raw_gain and
      informative_gain.
      STAGE 4: NULL 1, NULL 2 across c in {0, 1/4, 1/2, 3/4, 1}, NULL 3 planted
      positive. All on the identical pipeline.
      STAGE 5 (zero compute): report the rank-arrival curve and
      relations_needed_for_full_informative_rank against the size-matched
      generic base.
      The whole thing is a few hundred lines of numpy plus the existing
      harness/toycurve.py and harness/semaev.py, and runs in minutes. The
      cheapest possible discriminator for the central L5 question.
    controls:
      - NULL 1 - matched random sigma-closed matrix; must show the same zero.
      - >-
        NULL 2 - wrong folding weight mu with mu^3 != 1, swept over the
        correct-fold fraction c; the decay test.
      - >-
        NULL 3 - planted positive: sigma-symmetric-support but genuinely
        independent rows; must show informative_gain > 0.
      - >-
        Size-matched generic factor base with B columns on the same curve, same
        arity, same harvest budget - the only comparison that isolates the phi
        structure from factor-base size.
      - >-
        Frozen EXP-STR-003 arm-A fixture at B = 27 for instrument comparability.
      - >-
        Matched Pollard rho with negation and matched BSGS on the same instances,
        in group operations, for the Pareto row - reported even though no attack
        is claimed, because otherwise `dominated_by` is unchecked.
    required_metrics:
      - rank(M_base), rank(M_closed), rank(tilde-M_base), rank(tilde-M_closed)
      - raw_gain, informative_gain, per instance and per arm
      - lambda, its multiplicative order, and the sigma orbit-length histogram
      - rank-arrival curve of tilde-M against base-row count
      - relations_needed_for_full_informative_rank, phi arm and generic arm
      - NULL 2 decay curve over at least five values of c
      - sha256 of the factor base and of the final row list per cell (closes
        EV-STR-003 UC-6 at zero cost)
      - matched rho and BSGS group-operation counts and BSGS memory

  falsification_conditions:
    - >-
      informative_gain != 0 at any cell where lambda's order is verified 3, the
      factor base is verified to be a union of complete orbits, and sigma^3 is
      verified to be the identity. FACT 2 is false as implemented; the record is
      superseded rather than amended, and the three named bug-locator causes are
      checked in order.
    - >-
      raw_gain is near 0 as well. The appended rows are duplicates, not shifts;
      the collection rule is the object being measured and nothing about phi is
      established in either direction.
    - >-
      NULL 3 (planted positive) reports informative_gain = 0. The instrument
      cannot detect new information; every zero it produced is void and the run
      set is INVALID, not negative.
    - >-
      NULL 2 shows no decay in c. Canonical artifact tell; the measurement is
      void.
    - >-
      The B = 27 fixture does not reproduce the committed integers. Instrument
      incomparability; halt, and report as an infrastructure outcome under
      AGENTS.md rule 5, never as mathematical evidence.

  confounders:
    - >-
      TRUNCATION. `_build_phi_invariant_factor_base` ends with `xs[:B]`, which
      can cut an orbit in half; EV-STR-003 O-4 traced the entire arm-E
      divergence to phase effects of exactly this kind, and EV-STR-004's IL0
      truncation reading is still live. Mitigation: B is forced divisible by 3
      and complete-orbit membership is ASSERTED, not assumed.
    - >-
      LIFT/SIGN CONSISTENCY. For j = 0, phi preserves y, so the sign is
      trivially +1. This is a fact about j = 0 only and must not be carried to
      j = 1728, where the sign is forced to be -1 around each orbit
      (IDEA-20260807-add964).
    - >-
      lambda AMBIGUITY. L^2 + L + 1 = 0 mod N has two roots, lambda and
      lambda^2 = lambda^{-1}. Folding with the wrong one gives the OTHER
      eigenspace and produces a spurious nonzero informative_gain. The check
      "phi(P_1) equals P_{sigma(1)} and lambda x_1 = x_{sigma(1)} for one known
      pair" pins the root; at toy scale one brute-force logarithm suffices and
      only one is needed, ever.
    - >-
      NO RIGHT-HAND SIDE. The committed harness never records the target's
      scalar (EV-STR-003 O-9). Without it, "rank" is the rank of an incidence
      matrix and not of a linear system. The driver must record it.
    - >-
      SMALL B. At B = 27 the folded matrix is 9 x 9 and rank statements have
      almost no resolution. At least three B values spanning an order of
      magnitude are required before any trend is reported.

  interpretation_limits:
    - >-
      THE LINEAR-ALGEBRA STAGE IS NOT THE DOMINANT COST OF PRIME-FIELD INDEX
      CALCULUS - RELATION COLLECTION IS. EV-STR-001 gate_arithmetic measured the
      Wiedemann linear-algebra share at medians 0.016/0.015 (p = 211),
      0.005/0.030 (p = 1009), 0.004/0.007 (p = 4099), i.e. 0.4% to 3% of the
      charged total at every tested size. A factor-9 improvement on a 1% stage
      is a 0.9% improvement on the total. Every number in this record must be
      read against that ceiling, and no reading of it may present a
      linear-algebra result as an attack improvement.
    - >-
      Toy tier only (p up to about 32 bits, N at most about 20 bits). Nothing
      here extends to crypto scale, and the claim tier of anything this proposal
      can produce is capped at `toy` per docs/claims-and-verification.md.
    - >-
      A confirmed informative_gain = 0 is a SCOPE CORRECTION on how the STR lane
      measures progress. It does not reject H-STR-002's mechanism, it does not
      restore it, and it moves no hypothesis status - only the Coordinator does
      that.
    - >-
      Nothing here interacts with the Shoup bound (KN-TECH-005). That bounds
      generic algorithms; this is an exact rank identity about a specific matrix.
      Neither implies the other.

  reachability_gate: >-
    T5's isogeny-walk form does not apply: this lane fixes one curve and never
    moves between curves, so no walk is costed. T4 binds harder. The order-3
    action on x-coordinates exists ONLY when the CM fundamental discriminant is
    -3 (j = 0). By T4 that is fixed by the isogeny class - equivalently by t and
    p - and CANNOT be reached from a curve whose class lacks it by any isogeny
    walk at any cost. So the cost of reaching a good object from a generic
    prime-field curve is not high, it is infinite, and the lane is scoped to the
    D_0 = -3 family for all time. Within that family the good object is free:
    the phi-stable factor base costs B multiplications by zeta in F_p, versus
    about B log N group operations to build the same orbits generically.
    SCOPE NOTE, stated because it makes the lane non-vacuous and for no other
    reason: secp256k1 has a = 0, hence j = 0, hence D_0 = -3 and the order-3
    endomorphism (this is the publicly documented GLV endomorphism used for its
    fast scalar multiplication). That places a deployed curve inside the lane's
    scope. It is NOT an attack claim: this proposal's own predicted outcome is
    that the structure carries zero informative rank.

  target_complexity:
    time_exponent: >-
      NO EXPONENT MOVES, AND THE PROPOSAL CLAIMS NONE. Explicitly: this claims
      no more than a constant factor, and its predicted content is that the
      constant is 1 (the appended rows buy nothing). The constant that IS
      available in the lane - a factor 3 in relations needed and 9 in
      linear-algebra operations against a size-matched generic factor base - is
      the published orbit reduction of eprint 2020/1315 with the extension
      degree n replaced by 3, and it is a constant because |Aut(E)| <= 6 over a
      prime field. There is no mechanism in this record by which anything
      super-constant could arise, and none is asserted.
    memory_exponent: >-
      The folded matrix is (B/3) x (B/3) instead of B x B, a factor-9 memory
      reduction at the linear-algebra stage and a factor 3 in stored relations.
      Same status: constant, on a stage that is 0.4-3% of the charged total.
    best_known: >-
      For prime-field ECDLP: parallel Pollard rho with distinguished points at
      0.886 sqrt(N) group operations and O(1) memory per processor (KN-TECH-001,
      KN-TECH-006); on j = 0 curves the automorphism-discounted variant at
      0.886 sqrt(N/6) ~ 0.36 sqrt(N) (KN-TECH-018); BSGS at 2 sqrt(N) operations
      and sqrt(N) storage, full cost N^{2/3+o(1)} (KN-TECH-031). For the
      linear-algebra stage of index calculus specifically: sparse Wiedemann at
      2 B nnz operations. This proposal changes none of them.
    hidden_overhead: >-
      Nothing hides in an o(1) here because there is no asymptotic claim. What
      DOES hide, and is disclosed: the factor-3 relation saving is only realised
      if the phi-orbit constraint does not reduce the decomposition probability,
      and EV-STR-002 measured a density penalty of 2-3x, which would cancel it
      exactly. That cancellation is the subject of IDEA-20260807-d6956c and is
      not resolved here.
    tradeoff_note: >-
      No cryptanalytic time-memory tradeoff is produced. The one real tradeoff
      in the lane is that folding is free (nnz field multiplications) and must be
      done ONCE, before any solve; doing it after harvesting 3x the rows wastes
      exactly the 2R redundant rows this proposal measures.

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES, and not null.
    As an attack it mounts none, so it is dominated on every axis by:
    (1) parallel rho with distinguished points, 0.886 sqrt(N) group operations,
    O(1) memory per processor, near-linear parallel speedup (KN-TECH-001,
    KN-TECH-006) - dominates on time, memory and queries;
    (2) the automorphism-discounted rho on j = 0 curves, about 0.36 sqrt(N)
    (KN-TECH-018) - dominates on time and memory, and is the CORRECT baseline
    here because this lane's curves are exactly the ones that discount applies
    to;
    (3) BSGS at 2 sqrt(N) time and sqrt(N) memory (KN-TECH-031) - dominates on
    time, dominated by rho on memory, and it is listed because any memory-heavy
    linear-algebra claim competes against it and not against rho.
    As a MEASUREMENT INSTRUMENT for the STR lane, the incumbent is the
    `phi_alpha` displacement-rank statistic of harness/endomorphism_la.py. This
    proposal dominates it on strength of statement (proved meaning versus
    UNADJUDICATED, EV-STR-003 UC-1) and on cost (no discrete logarithm, unlike
    IDEA-20260727-001's determinacy residual); it is dominated by phi_alpha on
    maturity, since phi_alpha has 48 committed run records across four
    experiments and this has none.
  sota_delta: >-
    Zero speedup against any attack baseline; the gap to (2) above is a factor
    of about 0.36 sqrt(N) divided by zero attack, i.e. undefined because no
    attack is mounted. Instrument delta, quantitatively: replaces one integer of
    unadjudicated meaning (phi_alpha) with two integers of proved meaning
    (raw_gain, informative_gain); predicts their values exactly in advance
    (about 2R and exactly 0); costs one rank computation on a (B/3) x (B/3)
    matrix over F_N per cell plus nnz field multiplications for the fold; and
    removes the B discrete-logarithm computations that IDEA-20260727-001's
    equivalent check required, which is the difference between a toy-only test
    and one that runs at any B.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.95 that informative_gain measures exactly 0 on the curve arm - it is a
    two-line theorem and the only risks are implementation faults, each of which
    is named and separately checkable. 0.95 that NULL 1 shows the same zero,
    which is the calibration and not a disappointment. 0.85 that raw_gain
    lands near 2R (the risk is duplicate suppression in the collection rule,
    which EV-STR-003 O-4 documents). 0.5 that the size-matched generic
    comparison shows the predicted 1/3 ratio in relations needed - that depends
    on HEUR-L5-2, which is genuinely uncertain and is the reason
    IDEA-20260807-d6956c exists. Overall: this is a near-certain result whose
    value is that it is certain, cheap, and settles what the lane's numbers mean
    before more of them are produced.

