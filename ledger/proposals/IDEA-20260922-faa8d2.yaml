  proof_search_map:
    bottleneck: >-
      Whether cross-query amortization from incremental SAT/CNF-XOR solving
      (shared clause-learning state across a STREAM of instances that
      differ only in one numeric constant) can beat the per-query cost
      3c7a91's law predicts for each query treated independently -- the
      ONLY axis on which the naive construction's provable domination could
      be escaped.
    baseline_embedding:
      parameter_slice: >-
        m=4 (m1=m2=2), l=6, a toy curve at n admissible for m(l-1)<=n
        (4*5=20<=n, e.g. n=23): both the straight (m-1)-fold loop and the
        naive solver-query hybrid can be built and their operation/leaf
        counts compared directly against the closed forms of (B).
      reproduction_check: >-
        (i) The straight loop reproduces 2^{(m-1)l}/(m-1)!=2^{18}/6=43,691
        within 96c4f3's own validated band; (ii) a SINGLE m2=2 solver query
        reproduces 3c7a91's law, 2^{2*6}/2=2,048 leaves, within its 5% band,
        BEFORE the full 2^{m1 l}=2^{12}=4,096-query stream is attempted.
    observation_collision:
      observable: >-
        (total operations of the naive hybrid, total operations of the
        straight loop, amortized per-query leaf count under incremental
        solving) on the SAME instances.
      distinct_preimage_search: >-
        An amortized cost BELOW the per-query law could be explained by
        (i) genuine cross-query clause-learning reuse (the informative
        outcome), or (ii) an implementation artefact -- e.g. the incremental
        solver silently reusing a CACHED answer for a residual that
        collides exactly with an earlier query (possible at small l where
        the residual space is small relative to the number of queries).
        Broken by de-duplicating queried residuals explicitly and reporting
        the collision rate separately from the amortization claim.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The residual x(R-S) as an exact join key between an enumerated
          first half and a solver-queried second half (the CHANGE-OF-
          COORDINATES half of this record, (A)-(C)).
        predicted_gain: >-
          NEGATIVE, DERIVED: a factor 2^l(m-1)!/m2! WORSE than straight
          enumeration for the naive per-query construction; the record's
          actual predicted gain is on the AMORTIZED variant only, and is
          reported as measured, not asserted positive in advance.
      - transform: observable_fiber
        proposed_object: >-
          The bucketed residual (top-k-bit truncation) as a lossy join key,
          (D).
        predicted_gain: >-
          b(pi) close to 2^k (near-maximal, i.e. near-worthless
          compression), derived from the nonlinearity of the EC addition
          formulas and priced as the open number rather than assumed.
    quantifier_order: >-
      CLAIMED, UNCONDITIONALLY: FOR ALL m>=3 with m2=floor(m/2)>=2, FOR ALL
      l, the naive per-query solver hybrid costs AT LEAST 2^l(m-1) times the
      straight (m-1)-fold enumeration loop, GIVEN 3c7a91's law holds at
      arity m2 (an extrapolation, named). SEPARATELY, MUCH MORE WEAKLY: FOR
      THE TESTED CELLS, incremental solving's amortized per-query cost is
      measured, not derived, and no claim is made about it in advance
      beyond the pre-registered prediction in (C) that it does NOT close
      the gap. NOT CLAIMED: anything about m2=1 (that is 96c4f3's result);
      anything about Gröbner-basis (rather than CNF-XOR) solver calls, which
      may amortize differently and are not tested here.
    method_ceiling:
      strongest_certifiable_claim: >-
        (i) The domination bound (B), as a derivation, checked against a
        measured single-query and single-loop baseline at one toy cell;
        (ii) a measured amortization factor for incremental solving across a
        stream of queries at m2=2, l<=6-8, with error bars; (iii) a measured
        b(pi) for the bucketed-residual escape at small k, against the
        derived nonlinearity prediction. It can NEVER certify that NO
        incremental-solving strategy at any scale could amortize enough to
        beat straight enumeration, and cannot certify anything about m2=1,
        Gröbner-basis queries, or any exponent.
      nearby_object_control: >-
        BLOCKING. The DE-DUPLICATED-QUERY control: re-running the identical
        stream with residual collisions removed, to separate genuine
        cross-query amortization from accidental answer-caching on repeated
        residuals. Second: an INCREMENTAL SOLVER ON A STREAM OF UNRELATED
        (non-pdp) m2-arity Boolean instances of the same shape, as the null
        for "does incremental solving amortize ANYTHING here, or only
        pdp-specific structure" -- if the unrelated-instance stream
        amortizes AS WELL as the pdp stream, the effect (if any) is generic
        to incremental SAT solving and not pdp-specific.
    proof_obligations:
      - claim: The domination ratio 2^l(m-1)!/m2! is correctly derived from the two cited closed forms.
        responsibility: correctness
      - claim: A single m1-table entry and a single m2 solver query, run in isolation, match their respective closed forms within stated bands.
        responsibility: interface
      - claim: >-
          Every table-plus-solver decomposition found is re-verified as an
          exact m-fold sum by independent curve arithmetic
          (docs/claims-and-verification.md).
        responsibility: correctness
      - claim: The EC addition formula's nonlinearity claim in (D) is checked by direct symbolic substitution, not merely asserted.
        responsibility: correctness
      - claim: Residual de-duplication is applied and its collision rate reported before any amortization claim.
        responsibility: strictness
      - claim: No impossibility about incremental solving at any scale is asserted; the record is scoped to the tested toy cells.
        responsibility: scope
