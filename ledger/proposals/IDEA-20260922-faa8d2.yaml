  minimal_test:
    design: >-
      STAGE 0 -- ZERO COMPUTE. Evaluate the domination ratio 2^l(m-1)!/m2!
      at m in {4,5,6}, l in {5,...,8} as exact integers, and commit the
      table before any run.
      STAGE 1 -- BASELINE EMBEDDING. m=4, l in {5,6}, n admissible: build
      the m1-table (m1=2) and confirm its size; run a SINGLE m2=2 solver
      query in isolation and confirm its leaf count matches 3c7a91's law;
      run the straight (m-1)-fold loop and confirm its operation count
      matches 96c4f3's closed form. All three baselines must reproduce
      before Stage 2.
      STAGE 2 -- THE NAIVE HYBRID, SMALL SCALE ONLY. m=4, l=5 or 6 (kept
      small because the derived domination factor already makes l=7-8
      wildly uneconomical to actually run to completion): run the full
      2^{m1 l}-query naive hybrid to completion, confirm its total
      operation count against the derived bound within the stated
      tolerance, and certificate-verify every found decomposition.
      STAGE 3 -- THE INCREMENTAL-SOLVING DISCRIMINATOR. Compute the
      precise amortization threshold needed to tie the straight loop:
      c_amort* = m1! / (2^l (m-1)!) roughly (derived from equating
      c_amort*2^{m1 l}*2^{m2 l}/m2! to 2^{(m-1)l}/(m-1)!). Run the SAME
      2^{m1 l}-query stream through an incremental/assumption-based solver
      (reusing learnt clauses across calls) and measure the ACTUAL
      amortization factor against c_amort*.
      STAGE 4 -- THE NULL. Run the identical incremental-solving apparatus
      on a shape-matched stream of non-pdp Boolean instances (the N0 null
      construction of IDEA-20260904-b40e6d, reused rather than
      re-invented) differing only in one numeric constant per instance, to
      separate pdp-specific from generic incremental-SAT amortization.
      STAGE 5 -- THE BUCKETED-RESIDUAL ESCAPE. At the same cells, build the
      top-k-bit truncated query for k in {l-2, l-4}; measure b(pi) directly
      by exhaustive enumeration of the fibre at small l, and by sampling at
      larger l, following IDEA-20260802-002's own calibrated methodology.
      STAGE 6 -- DEPLOYED-ROW NOTE, ZERO COMPUTE. Report per RQ-BINSTD that
      this construction's cell is DOMINATED by IDEA-20260904-96c4f3's own
      frontier, with the derived factor, on every named standardized row,
      pending only the Stage-3/4 amortization result to decide whether ANY
      variant survives at all.
    controls:
      - >-
        TRIPLE BASELINE REPRODUCTION (Stage 1) -- the m1-table, the single
        m2 query, and the straight loop must each independently reproduce
        their own already-established closed forms before anything else.
      - >-
        RESIDUAL DE-DUPLICATION -- collision rate reported before any
        amortization claim, isolating caching artefacts from genuine reuse.
      - >-
        SHAPE-MATCHED NON-PDP NULL STREAM (Stage 4) -- separates pdp-
        specific amortization from generic incremental-solver behaviour.
      - CERTIFICATE VERIFICATION -- every claimed m-fold decomposition independently re-verified.
      - >-
        EXHAUSTIVE-FIBRE CONTROL for b(pi) at small l -- the meter's own
        calibration discipline from IDEA-20260802-002, applied here.
    required_metrics:
      - m1_table_size and construction operation count
      - single_query_leaf_count vs closed form
      - straight_loop_operation_count vs closed form
      - naive_hybrid_total_operations, measured
      - incremental_amortization_factor, pdp stream and null stream
      - dedup_collision_rate
      - measured_b_pi and measured_L_pi at each tested k
      - certificate_verified_rate
      - termination_reason (completed | timeout | memory_abort | crash)
  falsification_conditions:
    - >-
      naive_hybrid_operation_ratio falls below 0.5 times the derived bound
      with a passing baseline-embedding check. The domination arithmetic
      (B) has an error and is corrected before any downstream use.
    - >-
      incremental_amortization_factor falls below c_amort* (the tie
      threshold computed at Stage 3) on the pdp stream while the null
      stream (Stage 4) does NOT show a comparable amortization. This is the
      record's positive, headline-worthy outcome: cross-query clause-
      learning reuse genuinely helps on pdp instances specifically, and it
      is reported as such rather than buried.
    - >-
      incremental_amortization_factor falls below c_amort* on BOTH the pdp
      and null streams equally. The effect, if real, is generic to
      incremental SAT solving and not a pdp-specific finding; reported as
      such, distinct from the previous condition.
    - >-
      measured_b_pi falls below 0.3*2^k at any tested k with a passing
      exhaustive-fibre check. The nonlinearity derivation in (D) is wrong
      or incomplete, and the bucketed-residual escape deserves a second,
      more careful look this record did not give it.
    - >-
      Any certificate fails independent re-verification. Soundness issue;
      no cost conclusion may be drawn until fixed.
  confounders:
    - >-
      SOLVER-SPECIFIC INCREMENTAL-API BEHAVIOUR (assumption literals,
      clause-database persistence policy) varies across CryptoMiniSat,
      CaDiCaL and WDSat; the amortization measurement is reported per
      solver, pinned by version and commit, and no cross-solver
      amortization ratio is formed without matching versions.
    - >-
      AT SMALL l THE RESIDUAL SPACE IS SMALL relative to 2^{m1 l} queries,
      so exact residual collisions become common and can masquerade as
      amortization; the dedup_collision_rate control exists precisely for
      this and must be checked before any amortization claim at small l.
    - >-
      THE m1-TABLE'S OWN CONSTRUCTION COST (2^{m1 l} curve additions) is
      already included in the domination bound (B) but is a SEPARATE line
      item from the solver-query cost; both are reported so a reader can
      re-derive the bound independently.
    - >-
      THE NULL STREAM'S SHAPE-MATCHING (Stage 4) inherits every caveat
      IDEA-20260904-b40e6d's own N0 construction already names (rank
      matching, satisfiability-balance matching); this record reuses that
      construction's controls rather than re-deriving them.
  interpretation_limits:
    - Proposal only; no experiment, run, approval or result exists here.
    - >-
      The headline domination bound (B) is UNCONDITIONAL given 3c7a91's law
      extends to arity m2 (named as an extrapolation, checked at Stage 1);
      it is NOT itself a novel algorithmic claim -- it is a falsification
      of a plausible-sounding construction, exactly the kind of cheap
      pre-compute check docs/inventor-protocol.md section 8 asks for.
    - >-
      CLAIM TIER toy; l<=8 for anything actually run (Stage 2's full hybrid
      is explicitly kept small because the derived bound makes larger l
      uneconomical), m in {4,5,6}. No downstream citation may raise it.
    - >-
      Nothing here transfers to m2=1 (IDEA-20260904-96c4f3's own case),
      to Gröbner-basis solver calls (only CNF-XOR is tested), or to any
      exponent: even a fully confirmed positive amortization result would
      be a constant-factor finding about a specific implementation
      technique, never a change to the (m-1)l exponent this lane's own
      frontier table already carries.
    - >-
      The bucketed-residual escape's nonlinearity derivation (D) is a
      DERIVATION about the STANDARD AFFINE addition formulas; a different
      point representation (projective, Jacobian, or the u-coordinate of
      IDEA-20260922-29b1c5's 2-isogenous curve) could in principle have
      different bit-propagation behaviour and is explicitly NOT covered
      here.
  heuristic_assumptions:
    - id: H1
      statement: >-
        LAW TRANSFER TO SUB-ARITY QUERIES. IDEA-20260904-3c7a91's leaf-count
        law, established for a FULL m-arity descended system, applies
        equally to the m2-arity SUB-SYSTEM this record queries (a
        descended summation polynomial of a smaller arity with one variable
        fixed to a numeric constant), within the same 5% band.
      rigorous_support: >-
        RIGOROUS INGREDIENT: the m2-arity sub-system has the SAME
        substitution structure (an m2 l-variable strong backdoor under
        Proposition 1) as any standalone m2-arity pdp instance would, since
        fixing x_T to a constant removes it from the variable set entirely
        rather than changing the backdoor's shape. CLASSICAL DISTRIBUTION
        IMITATED: none beyond 3c7a91's own already-heuristic law, applied
        to a syntactically smaller instance of the identical model.
      validation_plan: >-
        SAMPLE: single-query leaf counts at Stage 1, m2=2, l in {5,6,7,8},
        >=5 seeds, compared against 2^{2l}/2 directly. SHORTCUT: none needed
        beyond what 3c7a91 itself proposes; m2=2 instances are cheap enough
        to run directly to l=9-10 if useful. COMPARISON: measured ratio
        against 1, with 3c7a91's own tolerance band. TAIL CHECKS: reuse
        3c7a91's own conflict-depth-histogram check if time allows, since a
        positive finding there would strengthen confidence in this
        extrapolation. TRANSFER: none beyond m2 in {2,3}, matching the
        tested m in {4,5,6}.
    - id: H2
      statement: >-
        NO USEFUL CROSS-QUERY AMORTIZATION. Incremental solving across a
        stream of pdp sub-instances differing only in one numeric constant
        amortizes to within [0.7,1.1] of the single-query cost -- i.e.
        essentially no reuse benefit -- because the F-set parity clauses
        that carry the residual's specific value are exactly the clauses
        3c7a91's own mechanism shows are inert until near the leaf, so
        little of the search TREE (as opposed to the static clause
        database) is actually shared across differently-valued queries.
      rigorous_support: >-
        RIGOROUS INGREDIENT: none proved; this is an extension of 3c7a91's
        own late-propagation mechanism to a NEW question (cross-instance
        reuse) that record never asked. CLASSICAL DISTRIBUTION IMITATED:
        none directly; the closest analogue is the general SAT-solving
        folklore that incremental solving helps most when instances share
        STRUCTURAL, not merely SYNTACTIC, similarity, and this record's
        prediction is that pdp sub-instances differing in one constant are
        structurally IDENTICAL but VALUE-different in exactly the part of
        the search 3c7a91 shows is late-firing, hence little to share.
      validation_plan: >-
        SAMPLE: the amortization measurement of Stage 3 itself, m2=2,
        l in {5,6,7}, >=3 independent streams of >=100 queries each where
        budget allows. SHORTCUT: none proposed; this is inherently a
        stream-level measurement with no smaller-scale proxy identified.
        COMPARISON: measured amortization factor against 1 (H2's
        prediction) and against c_amort* (the domination-tying threshold).
        TAIL CHECKS: whether amortization IMPROVES as the stream grows
        (a persistent-learning signature) versus staying flat, reported
        as a trend, not only an endpoint number. TRANSFER: none beyond
        the tested solver, version and cells.
  heuristic_note: >-
    H1 is a modest, low-risk extrapolation of an already-validated law to a
    syntactically smaller instance of the same model; it is expected to
    hold. H2 is the record's genuine open question, stated with an explicit
    a-priori expectation (no useful amortization) so that a POSITIVE finding
    -- amortization below c_amort* on the pdp stream specifically, not on
    the null stream -- is unambiguously the headline result, and a
    negative finding (the expected one) still delivers a measured
    amortization factor with error bars, useful to any future record
    considering incremental solving in this lane.
  target_complexity:
    time_exponent: >-
      The naive construction is WORSE than the existing frontier by a
      derived factor 2^l(m-1)!/m2! -- i.e. this record's headline result
      is a NEGATIVE exponent-preserving finding (no exponent moves, and the
      naive constant factor is unfavourable). The amortized variant, IF H2
      is falsified favourably, would still only move a CONSTANT factor
      (the amortization ratio), never the (m-1)l exponent this lane's own
      frontier already carries.
    memory_exponent: >-
      The m1-table needs 2^{m1 l} memory, WORSE than the straight
      (m-1)-fold loop's poly memory at matched l (since m1<m-1 for m>=3
      only when... actually m1=ceil(m/2) is generally LESS than m-1 for
      m>=3, so the table is SMALLER than IDEA-20260904-96c4f3(D)'s own
      full (m-1)-arity table, a genuine memory advantage over that
      specific row, though still exponential and still not poly).
    best_known: >-
      Matched rho with negation and Frobenius classes; within the
      decomposition family, IDEA-20260904-96c4f3's four-row frontier, which
      this record's naive construction sits strictly BELOW (worse) on time
      at any memory budget, per the derived bound (B).
    hidden_overhead: >-
      3c7a91's law itself carries an eps<=0.05 band, propagated through this
      record's derivation without further inflation; nothing superpolynomial
      hides in any o(1), since every quantity here is an explicit constant
      or exponent with no o(1) terms. The m1-table's construction cost
      (2^{m1 l} curve additions) is charged explicitly, not hidden inside
      the "per query" accounting.
    tradeoff_note: >-
      The one genuine tradeoff this record surfaces: m1-table memory
      (2^{m1 l}, smaller than 96c4f3(D)'s 2^{(m-1)l} for m1<m-1) traded
      against per-query solver time (2^{m2 l}/m2!, which the domination
      bound shows overwhelms the memory saving unless amortized). This is a
      genuinely new row in the time-memory space relative to
      IDEA-20260904-96c4f3's four-row frontier table, but it is a DOMINATED
      row, and the record says so rather than adding it as if it were
      competitive.
  estimated_cost:
    implementation: high
    compute: medium
    qualification: >-
      Stage 0-1 reuse existing tooling entirely (the m1-table construction
      is IDEA-20260904-96c4f3(D)'s own code, and the single-query baseline
      reuses the CNF-XOR encoder shared across this lane). Stage 2 (the
      full naive hybrid) and Stage 3 (incremental solving across a stream,
      requiring an assumption-literal-based or otherwise persistent solver
      API not currently used anywhere in this repository per the
      implementation_notes pattern in IDEA-20260904-3c7a91/7fd218) are new
      infrastructure, several hundred lines, and the genuinely uncertain
      cost item, since incremental-API behaviour across solvers is not
      characterised in this program at all yet.
  asymptotic_claim:
    problem: ECDLP on standardized binary curves via x-coordinate point decomposition, hybrid enumeration/solver construction
    prior_best: IDEA-20260904-96c4f3's four-row frontier, specifically its own table variant (D)
    time_exponent: Unchanged (naive construction strictly worse by a derived constant factor; amortized variant, if it survives, still a constant factor)
    memory_exponent: Unchanged in kind (still exponential, m1 l rather than (m-1) l)
    hidden_cofactor: None; the derived domination factor is explicit, not hidden
    claim_kind: negative_derivation_plus_conditional_amortization_measurement
  dominated_by: >-
    CHECKED. IDEA-20260904-96c4f3's own (m-1)-fold enumeration loop and its
    table variant (D) both STRICTLY DOMINATE the naive construction of this
    record on time at any m1<m-1 memory budget, by the derived factor
    2^l(m-1)!/m2! (at least 2^l(m-1)). This record's naive construction is
    therefore DOMINATED, explicitly, by a record this same lane already
    filed. The amortized variant is NOT YET KNOWN to be dominated or not --
    that is precisely what Stage 3 measures -- and this record states
    honestly that until that measurement runs, the amortized variant's
    Pareto position is OPEN, not closed. Matched rho dominates the whole
    family regardless of this record's outcome, on every named row.
  sota_delta:
    time: >-
      NEGATIVE for the naive construction: at least 2^l(m-1) WORSE than the
      existing frontier row it most resembles, derived exactly. For the
      amortized variant: unmeasured, with a pre-registered prediction of
      "still no improvement" and a precisely stated threshold (c_amort*) at
      which it would tie the existing frontier.
    memory: >-
      A genuine but dominated advantage over IDEA-20260904-96c4f3(D)'s own
      full (m-1)-arity table at matched m (2^{m1 l} vs 2^{(m-1)l} memory,
      m1<m-1), irrelevant given the time domination.
    data_queries: Not applicable.
  frontier_check:
    status: pending
    note: >-
      Whether incremental/assumption-based SAT solving across a stream of
      near-identical algebraic queries has been applied to elliptic-curve
      index calculus, or to Weil-descended Boolean systems more generally,
      was not checked against external literature this session; no source
      was opened. The (L,b) meter's application to a bucketed group-element
      join key is, per IDEA-20260802-002's own novelty_screen, new within
      this program's ledger, but external prior art on "meet-in-the-middle
      with an algebraic second half" for index calculus was not searched.
  recommended_priority: low
  priority_rationale: >-
    Its derived headline (B) is a NEGATIVE result -- the naive construction
    is exponentially worse than an already-filed frontier row -- which under
    docs/target-result-profile.md rule A1 is squarely a falsification, not
    a target-class contribution, and the record says so plainly. Ranked
    low rather than medium because, unlike IDEA-20260922-7ab503 and
    IDEA-20260922-9d12bd, its zero-compute Stage 0 does not decide any
    reachability-table cell by itself (it retires one candidate
    CONSTRUCTION, not a curve-population question), and its one genuinely
    open axis (incremental-solving amortization, H2) requires the highest
    implementation cost of the four ideas filed in this lane today for a
    pre-registered-negative expected outcome. It is filed rather than
    dropped because docs/inventor-protocol.md section 8 treats a
    derivation-level domination bound as a useful pre-compute result in its
    own right, because the loss/branching meter's first application to the
    pdp bottleneck (D) is a reusable methodological contribution regardless
    of this record's own outcome, and because a positive H2 finding would
    be the single most surprising, most consequential result any of this
    session's four records could produce.
  first_deliverable: >-
    The zero-compute domination table (m in {4,5,6}, l in {5,...,8}), the
    exact derivation of the tying threshold c_amort*, and the nonlinearity
    derivation for the bucketed-residual escape (D) -- all before any code
