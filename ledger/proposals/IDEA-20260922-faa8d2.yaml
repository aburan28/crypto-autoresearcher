idea:
  id: IDEA-20260922-faa8d2
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-22'
  status: proposed
  approved_by: null
  title: >-
    A SOLVER-QUERY MEET-IN-THE-MIDDLE POINT DECOMPOSITION IS PROVABLY
    DOMINATED BY STRAIGHT ENUMERATION, BY A FACTOR 2^l(m-1)!/m2! DERIVED
    BEFORE ANY RUN FROM TWO RECORDS THIS LANE ALREADY OWNS -- and the ONLY
    way it could still win is if INCREMENTAL SOLVING ACROSS A STREAM OF
    near-identical residual queries amortizes below the per-query leaf-count
    law of IDEA-20260904-3c7a91, an axis this lane has never measured; the
    bucketed-residual escape route is priced with the loss/branching meter
    of IDEA-20260802-002, applied here for the first time to the pdp
    bottleneck, and the escape is shown to FAIL the strict lossy-projection
    test against index calculus's own operation set.
  class: algorithm
  claim: >-
    SCOPE: symmetrized descended pdp over F_{2^n}, n prime, factor base a
    subspace V of dimension l; arity m split m1+m2=m, m1=ceil(m/2),
    m2=floor(m/2); m in {4,5,6} so m2>=2 (a genuine sub-arity decomposition,
    not the trivial single-point case IDEA-20260904-96c4f3 already covers).
    CLAIM TIER toy. NO ATTACK, NO EXPONENT IMPROVEMENT CLAIMED AS THE
    HEADLINE -- the headline is a DOMINATION BOUND, derived not measured.

    (A) THE CONSTRUCTION. Build the FIRST-HALF TABLE T by exhaustive
    enumeration of all m1-tuples from V, storing x(S) for S=P_1+...+P_{m1}
    (cost 2^{m1 l} curve additions and memory -- this is exactly
    IDEA-20260904-96c4f3(D)'s memory-assisted table variant, restricted to
    arity m1, and is cited from there, not re-derived). For a target R,
    instead of building a SECOND table for arity m2 (96c4f3(D)'s own choice
    when m1=m-1, m2=1, where the "table" is a trivial linear membership
    test), THIS RECORD proposes: for each table entry (x(S)), invoke the
    CNF-XOR/Gröbner SOLVER once on the descended m2-arity summation-
    polynomial system S_{m2+1}(x_{m1+1},...,x_m,x_T) with x_T FIXED to the
    numeric value x(R-S) -- one solver call per table entry, 2^{m1 l}
    SEPARATE instances total, asking "is this specific residual a sum of m2
    factor-base points."

    (B) THE ZERO-COMPUTE DOMINATION BOUND, DERIVABLE BEFORE ANY RUN FROM TWO
    ALREADY-FILED RESULTS. By IDEA-20260904-3c7a91's no-above-leaf-pruning
    law (cited, not re-derived), a complete UNSAT solve of an m2-arity
    instance costs (1+-eps)2^{m2 l}/m2! leaves REGARDLESS of the specific
    numeric residual -- the law is explicitly n-, curve- and target-
    independent on UNSAT instances. So per-query solver cost is
    ~2^{m2 l}/m2!, and TOTAL solver-query cost is
        2^{m1 l} * 2^{m2 l}/m2! = 2^{ml}/m2! .
    Compare IDEA-20260904-96c4f3's straight (m-1)-fold enumeration loop:
    2^{(m-1)l}/(m-1)!. The ratio is
        [2^{ml}/m2!] / [2^{(m-1)l}/(m-1)!] = 2^l * (m-1)!/m2! .
    Since m2=floor(m/2) < m-1 for every m>=3, (m-1)!/m2! >= (m-1) > 1, so
    THE RATIO IS AT LEAST 2^l(m-1) -- THE SOLVER-QUERY HYBRID IS PROVABLY,
    EXPONENTIALLY-IN-l, DOMINATED BY STRAIGHT ENUMERATION, before any code
    is written. At m=4 (m1=2,m2=2): ratio = 2^l * 6/2 = 3*2^l -- at l=6,
    a factor of 192. At m=6 (m1=3,m2=3): ratio = 2^l * 120/6 = 20*2^l -- at
    l=6, a factor of 1280.

    (C) WHY THE RECORD IS STILL WORTH FILING GIVEN (B). Per
    docs/inventor-protocol.md section 8, this domination bound IS the useful
    result of a cheap pre-compute falsification check, and it retires the
    NAIVE version of this idea before any compute is spent -- exactly the
    outcome the protocol asks for. The record's remaining, genuinely open
    content is: does INCREMENTAL SOLVING across the STREAM of 2^{m1 l}
    near-identical queries (same symbolic system S_{m2+1}, only the
    constant x_T changes per call) amortize below 2^{m2 l}/m2! per query via
    shared clause-learning across calls? IDEA-20260904-7fd218's own F4
    toggle ("clause learning on/off") measured learning's effect on A SINGLE
    INSTANCE; no record in this lane has measured learning's effect ACROSS a
    STREAM of related instances sharing a symbolic system. If amortized
    per-query cost falls to c_amort * 2^{m2 l}/m2! with c_amort < 2^{-l}
    (m-1)!/(m1! ) roughly -- the precise threshold derived in the
    minimal_test design -- the hybrid could tie or beat straight
    enumeration; THIS RECORD PREDICTS IT DOES NOT, because clause learning
    across UNSAT instances with DIFFERENT numeric constants shares no
    obviously reusable structure (the learnt clauses are about the F-set
    parity rows, which differ by the residual's own bit pattern), but names
    the threshold precisely enough that a positive finding is unambiguous
    and would be the genuinely informative, non-pre-registered-negative
    outcome.

    (D) THE PRICED OPEN NUMBER: A BUCKETED-RESIDUAL ESCAPE, TESTED AGAINST
    THE STRICT LOSSY-PROJECTION TEST AND FOUND TO FAIL IT. A natural
    attempted improvement: instead of querying the solver once per EXACT
    residual, TRUNCATE the residual's coordinate vector to its top k bits
    (a bucket key) and query once per BUCKET, covering 2^{m1 l - k} table
    entries per query with a WEAKER constraint ("top k bits of x_T equal
    c_top", not "x_T equals c"). Applying IDEA-20260802-002's meter: the
    projection pi = top-k-bit truncation of the residual's coordinate
    vector; LOSS L(pi) = m1 l - k bits (the fibre size, i.e. how many exact
    residuals share one bucket). PROPAGATION BRANCHING b(pi): whether a
    solver query answering "is there an m2-decomposition landing ANYWHERE
    in this bucket" propagates deterministically from the branching of its
    m1 summands, or blows up combinatorially. THIS RECORD DERIVES, BEFORE
    MEASUREMENT, THAT THE BUCKET OBJECT FAILS THE STRICT LOSSY-PROJECTION
    TEST AGAINST INDEX CALCULUS'S OWN OPERATION SET SIGMA (translation by
    factor-base points): the top-k-bit prefix of x(A+B), an EC-ADDITION
    output, is NOT a function of the top-k-bit prefixes of x(A), x(B) alone
    -- point addition is a nonlinear rational function of the coordinates
    (division by (x_A+x_B) or similar in the standard formulas), so
    truncating loses information the addition law does not respect, exactly
    the KN-FIND-ffe1df / IDEA-20260806-c5d183 rigidity pattern already
    established for prime-order subgroups, here re-derived for THIS specific
    projection rather than assumed. CONSEQUENCE: bucketed queries are a
    BRANCHING object (per the trichotomy), not a partial-action quotient,
    and b(pi) MUST BE MEASURED, never assumed small; this record prices it
    as the open number and predicts b(pi) close to 2^k (near-maximal
    branching, i.e. near-zero useful compression) rather than close to 1,
    based on the nonlinearity just derived, but commits to measuring it
    rather than asserting the prediction as settled.
  mechanism: >-
    OBJECT FRAME. Representation: the x-coordinate of the RESIDUAL point
    R-S in a fixed F_2-basis (R1 of RQ-ECDLP-623a32), used as the JOIN KEY
    between an enumerated first half and a solver-queried second half.
    Operation set Sigma: for the EXACT-residual construction (A)-(C),
    unchanged from ordinary index calculus -- translation by factor-base
    points, Class I partial action, since the join is an EXACT equality
    test on a group element and loses nothing (see below). For the
    BUCKETED-residual escape (D), Sigma is the SAME translation action, and
    the truncation projection is tested against it explicitly and shown to
    fail the deterministic-propagation clause.
    TRICHOTOMY. The EXACT-residual construction is a CHANGE OF COORDINATES,
    not a new lossy object: the table entry x(S) together with the exact
    residual x(R-S) determines R exactly (nothing is discarded), so this
    half of the record is correctly classified as an ALGORITHMIC
    COMPOSITION (class: algorithm) rather than a new tracked object, and the
    object-frame trichotomy is not forced onto it -- stated explicitly so
    this is not mistaken for a lossy-projection claim it does not make. The
    BUCKETED escape (D) IS a lossy projection and IS classified: BRANCHING
    (not partial-action), because the derivation above shows the retained
    part (the truncated prefix) does NOT propagate deterministically under
    Sigma -- the one-line reason required by the object-frame constraint.
    LOSSY-PROJECTION TEST, APPLIED TO (D) AND FAILED. What the bucket
    projection discards: the low m1 l - k bits of the residual's coordinate
    vector. Is the discard Sigma-compatible? NO: EC point addition's
    standard affine formulas compute x(A+B) as a rational function
    involving (y_A+y_B)/(x_A+x_B) squared plus linear terms, so a LOW-bit
    perturbation of x_A or x_B (holding the top k bits fixed) generically
    changes EVERY bit of x(A+B), including the top k -- there is no
    "carry-free" structure here analogous to XOR addition, because the
    group law is genuinely nonlinear in the coordinates. The projection is
    therefore lossy (correctly) but the retained part does NOT propagate
    deterministically, failing the second clause of the test -- exactly the
    reason KN-FIND-ffe1df Theorem C and IDEA-20260806-c5d183 already rule
    out balanced lossy partitions of a prime-order group under the FULL
    translation action; this record re-derives the SAME conclusion for a
    SPECIFIC, concretely computable projection rather than invoking the
    general theorem by name alone, and prices b(pi) as the open number that
    quantifies HOW BADLY it fails (near-maximal branching, predicted, not
    assumed).
    WHY THIS IS NOT IDEA-20260904-96c4f3(D). That record's table variant is
    m1=m-1, m2=1: the "second half" is a SINGLE point, whose "solve" is a
    trivial linear subspace-membership test, not a genuine sub-decomposition
    SAT/Gröbner instance. This record requires m2>=2 specifically so that
    the second half is a REAL solver call subject to 3c7a91's own leaf-count
    law, which is the entire mechanism the domination bound in (B) depends
    on -- at m2=1 there is no leaf-count law to invoke (a single membership
    test is O(1)), and the two records' domination arguments are therefore
    genuinely different, not the same result relabelled.
    WHY THIS IS NOT ANY FILED SOLVING-DEGREE OR RANK RECORD. IDEA-20260916-
    c38e50 (isotypic block decomposition) and IDEA-20260916-e6540d
    (degree-capped certification) both speed up or bound a SINGLE Gröbner
    computation; this record's construction is about SPLITTING one
    decomposition problem into a STREAM of many smaller ones and asking
    whether cross-query amortization helps, an axis neither record touches.
