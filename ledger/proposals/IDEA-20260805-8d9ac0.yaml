idea:
  id: IDEA-20260805-8d9ac0
  question_id: RQ-QRUOV-001
  added: '2026-08-05'
  goal_id: GOAL-QRUOV-001
  title: >-
    The ell-cancellation audit: two forced ratios show the matched
    extension-field-UOV baseline and QR-UOV share every attack exponent exactly,
    the compression buys the attacker a haystack ell times smaller in the
    exponent, and no known attack can spend it
  class: control

  claim: >-
    Build GOAL-QRUOV-001's declared prerequisite -- the matched
    extension-field-UOV baseline -- as a derivation rather than a citation, and
    audit it with two forced values computed before any run. FIRST FORCED VALUE:
    for a QR-UOV instance at (q, V, M, ell) with n = (V + M)*ell F_q-variables
    and m = M*ell F_q-equations, n - 2m = ell*(V - M) and n/m = (V + M)/M. The
    second ratio is INDEPENDENT OF ell. Consequently the Kipnis-Shamir /
    reconciliation exponent and the applicability threshold of Beullens'
    intersection attack are identical for QR-UOV at (q, V, M, ell), for plain UOV
    at (q, n, m), and for UOV at (q^ell, V + M, M): ell cancels in both. The only
    surviving difference is a polynomial factor of order ell^{omega - log_2 3} ~
    ell^{0.78} in favour of the extension-field side, from doing linear algebra on
    M x M matrices over F_{q^ell} instead of M*ell x M*ell matrices over F_q.
    SECOND FORCED VALUE, and the reason this is not merely bookkeeping: the
    attacker's oil-space HAYSTACK does not cancel. The number of candidate oil
    spaces falls from about q^{M V ell^2} (F_q-subspaces of dimension m in
    F_q^n) to about q^{M V ell} (A-submodules of rank M in A^N) -- a factor ell
    IN THE EXPONENT -- while the best-known attack exponent does not move by a
    single unit. Either the best attack is not haystack-limited, or there is
    unspent structure. This proposal derives, in one line, that generic
    meet-in-the-middle cannot spend it (it wins only when M = 1), and hands the
    remaining possibilities forward as named open directions rather than as a
    closure.

  object_first_candidate:
    tracked_object: >-
      A pair of EXPONENTS carried through the descent, not an algebraic object:
      the "solver exponent" n - 2m and the "shape ratio" n/m, followed from the
      F_q presentation of a QR-UOV key to its A-presentation and back, together
      with the logarithm of the candidate-oil-space count. The point of tracking
      exponents rather than keys is that the descent is claimed to be a change of
      presentation, so any quantity that FAILS to be invariant under it is where
      a security difference must live.
    established_families_off_limits: >-
      Off-limits as the PRIMARY lens: every attack family itself -- direct/
      Groebner, Kipnis-Shamir, reconciliation, intersection, rectangular MinRank
      and support-minors, quantum variants, side channels. This proposal is
      forbidden from proposing an attack. It audits the MEASUREMENT that all of
      them are compared against, which is the one move the "families off-limits"
      rule does not forbid and which this program has repeatedly skipped: the
      merged 2026-08-05 scouting brief records that 75 of 131 cost-claiming
      evidence records charge wall clock only, and that dominated_by is absent
      from 95 of them.
    newness_score: >-
      The individual identities are one line of arithmetic each and are certainly
      known to the QR-UOV designers. What is new to THIS corpus is that the
      baseline exists at all: GOAL-QRUOV-001's next_action makes the matched
      extension-field-UOV baseline a prerequisite for ideation, and no such
      derivation, cost table, or knowledge entry exists anywhere in the
      repository. The haystack observation and its one-line MITM disposal are the
      part the author has not seen stated.
    testability_score: >-
      Maximal. Every claim in this record is a closed-form identity over the
      integers, checkable by hand and confirmable in seconds of exact arithmetic.
      There is no solver, no algebra system, and no randomness.
    survival_score: >-
      The identities survive to arbitrary parameters unconditionally -- they are
      arithmetic. The INTERPRETATION survives exactly as far as the recalled
      Kipnis-Shamir and intersection-attack cost statements do, which is why
      verifying those two statements against a primary source is stage 1 rather
      than an assumption.

  mechanism: >-
    THE ARITHMETIC, DERIVED. A QR-UOV instance at (q, V, M, ell) presents over
    F_q as n = (V + M)*ell variables and m = M*ell equations, and over
    A = F_q[t]/(f) (f irreducible, so A = F_{q^ell}) as N = V + M variables and
    M equations. Then n - 2m = (V + M)*ell - 2*M*ell = (V - M)*ell, and
    N - 2M = V - M. The corresponding cost expressions are q^{(V-M)ell} and
    (q^ell)^{V-M} = q^{(V-M)ell}. THEY ARE EQUAL, EXACTLY, NOT ASYMPTOTICALLY.
    Likewise n/m = (V + M)/M = N/M, so any attack whose applicability is a
    threshold on the variables-to-equations ratio has the SAME threshold on both
    sides, with ell cancelling identically.

    WHAT THIS BUYS. RECALLED, UNVERIFIED: Beullens' intersection attack applies,
    in its two-map form, when n < 3m. Substituting, n < 3m becomes
    (V + M)*ell < 3*M*ell, i.e. V < 2M -- a condition on V/M alone, with ell
    absent. This is the checkable version of the RELAYED statement (ePrint
    2026/298, ABSTRACT ONLY, not read) that the truncated-polynomial-ring UOV
    framework does not improve on MAYO and QR-UOV "because their parameter sets
    do not yield a large enough linear solution space for the intersection
    attack". If that explanation is correct, then QR-UOV's declared (V, M) must
    satisfy V >= 2M, and the check is one comparison per parameter set against a
    table that must first be read. If instead a declared set has V < 2M, the
    relayed explanation is wrong as stated and something else is doing the work --
    which is the more interesting outcome and is pre-registered as such.

    THE POLYNOMIAL RESIDUE, DERIVED. The two presentations are not identical in
    cost, only in exponent. A linear-algebra step on M x M matrices over
    F_{q^ell} costs about M^omega * ell^{log_2 3} F_q-operations under
    Karatsuba F_{q^ell}-multiplication, versus (M*ell)^omega for the same step
    over F_q. The ratio is ell^{omega - log_2 3}, about ell^{0.78} at
    omega = 2.37 and ell^{1.415} at omega = 3. This is a COFACTOR, it moves no
    exponent, and the record says so explicitly rather than dressing it up.

    THE HAYSTACK, DERIVED, AND THE PART WORTH KEEPING. The number of
    F_q-subspaces of dimension m inside F_q^n is the Gaussian binomial
    [n choose m]_q = q^{m(n-m)(1 + o(1))} = q^{M V ell^2 (1 + o(1))}, since
    m(n - m) = M*ell * V*ell. The number of free A-submodules of rank M inside
    A^N with A = F_{q^ell} is [N choose M]_{q^ell} = q^{ell M V (1 + o(1))}. The
    QR-UOV structure therefore deletes a factor ell FROM THE EXPONENT of the
    attacker's search space, for free, at key-generation time. AND YET the best
    recalled attack exponent, ell(V - M), is identical on both sides. That
    tension is a fact about the state of the art, not about the scheme, and it is
    the honest place to look for an exponent.

    ONE-LINE DISPOSAL OF THE OBVIOUS WAY TO SPEND IT, DERIVED. A generic
    meet-in-the-middle over the reduced haystack costs about the square root of
    it, q^{ell M V / 2}. That beats q^{ell (V - M)} exactly when
    M V / 2 < V - M, i.e. V(M - 2) < -2M. For M >= 2 the left side is >= 0 and
    the right side is < 0, so the inequality is NEVER satisfied; only M = 1 with
    V > 2 admits it, and no realistic parameter set has M = 1. THE REDUCED
    HAYSTACK IS THEREFORE NOT SPENDABLE BY GENERIC ENUMERATION OR MITM AT ANY
    PARAMETER SET OF INTEREST. This is a closure in the inventor-protocol section
    4 sense -- named obstruction (the haystack exponent M V ell is quadratic in
    the parameters while the solver exponent (V - M) ell is linear, so halving
    the former cannot reach the latter), an argument (the inequality above), and
    forward guidance: what remains open is any attack whose cost is governed by
    the module structure rather than by either the haystack or the generic solver
    -- specifically, a MinRank or intersection variant formulated over A rather
    than over F_q, where the variable count drops by a factor ell before the
    modelling degree is chosen. That is where an exponent could still move, and
    this proposal does not claim it cannot.

    COST BOOKKEEPING FOR THE DELIVERABLE ITSELF. Per-attempt cost x inverse
    success probability is not applicable: there is no attempt and no success
    probability. The deliverable is a table with one row per declared QR-UOV
    parameter set and columns (q, V, M, ell, n, m, n - 2m, n/m, V/M,
    log_q KS cost, log_q intersection applicability, F_q linear-algebra cost,
    F_{q^ell} linear-algebra cost, ratio, log_2 haystack over F_q, log_2 haystack
    over A, log_2 MITM cost). Every column is a closed form; the only inputs that
    must be READ rather than derived are the parameter values themselves.

  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-05'
    corpus_paths_checked:
      - ledger/ (no experiment, evidence, run or knowledge record exists in area
        QRUOV; no matched extension-field-UOV baseline exists anywhere)
      - ledger/proposals/IDEA-20260801-015.yaml (proposes a black-box cost-ratio
        control with no cost model and no ell-dependence; this proposal supplies
        the model that one presupposes)
      - the merged 2026-08-05 scouting ANGLE-BRIEF, families F7 and the
        "charge what nobody charged" template
    what_the_screen_could_not_see: >-
      The QR-UOV papers, the Round-3 specification, ePrint 2026/298 and ePrint
      2025/739 -- none read. The designers certainly compute their own baseline;
      the claim here is only that THIS PROGRAM does not have one and cannot
      audit theirs without it.
    conclusion: >-
      Unverified. The identities are elementary; the deliverable is the audited
      table and the haystack observation.

  literature_context:
    - >-
      Beullens, intersection attack on UOV/Rainbow. NOT READ -- relayed. The
      two-map applicability condition n < 3m used above is RECALLED, UNVERIFIED,
      and its verification is stage 1. Nothing about its cost, only its
      threshold, is used.
    - >-
      Kipnis-Shamir and reconciliation key recovery for UOV, cost
      |F|^{n - 2m} * poly. NOT READ -- relayed, RECALLED, UNVERIFIED. Same
      status: the proposal uses it as a ratio, and stage 1 verifies it.
    - >-
      ePrint 2026/298 (Furue, Ikematsu), reported as CRYPTO 2026. ABSTRACT ONLY.
      The relayed explanation for QR-UOV's survival names "linear solution space"
      as the operative quantity. This record turns that phrase into the
      inequality V < 2M and proposes to check it, which is the whole point of
      preferring falsifiable relayed claims over vague ones.
    - >-
      ePrint 2025/739, reported to find current parameters resistant to an
      extended rectangular MinRank attack. NOT READ -- relayed. Recorded as the
      matched negative control the table should be compared against, not as an
      input.

  lossy_projection_identifiability_audit:
    projection: >-
      A QR-UOV instance -> the integer tuple (q, V, M, ell, n, m) and the derived
      exponents (n - 2m, n/m, log_q haystack).
    what_is_discarded: >-
      The entire instance. Only six integers and their derived exponents survive.
    why_genuinely_lossy: >-
      Trivially and completely: the fibre over a tuple is every key at those
      parameters.
    why_compatible_with_the_operations: >-
      The retained quantities propagate deterministically through the descent
      because they are defined from the presentation shape alone, and the descent
      is a change of presentation. That is exactly why comparing them across the
      descent is a valid audit and why any FAILURE of invariance would localise a
      real difference.
    is_it_only_a_change_of_coordinates: >-
      NEITHER FAILURE MODE APPLIES IN THE USUAL WAY, AND THIS IS THE HONEST
      READING. It is not the (Delta, Pi) failure: the projection is enormously
      lossy. It IS very close to the MIRROR failure -- a projection so lossy that
      it is constant -- and the constancy is precisely the finding, not a defect:
      n - 2m and n/m are pre-computed to be INVARIANT under the descent, and the
      value of the audit is that this invariance is derived and stated rather than
      assumed. The record therefore does not pretend to have found a
      discriminating object. It has found that the two obvious discriminators do
      not discriminate, and it names the one quantity that DOES vary across the
      descent -- the haystack exponent, M V ell^2 versus M V ell -- as the only
      surviving candidate. Under the inventor protocol that is a legitimate
      deliverable and it is labelled as one; it is not an attack.

  assumptions:
    - >-
      The QR-UOV parameter semantics (which of V, M, ell means what, and whether
      n and m are as stated). RECALLED, UNVERIFIED. If the submitted scheme
      indexes its parameters differently every identity must be recomputed, and
      stage 0 does that before anything else.
    - >-
      f irreducible, so that A is the field F_{q^ell} and "extension-field UOV"
      is even defined. For reducible f the matched baseline is not a single
      ext-UOV instance at all -- see IDEA-20260805-bd8339, which is the companion
      case and is deliberately not restated here.
    - >-
      omega, the linear-algebra exponent. The cofactor ell^{omega - log_2 3} is
      reported at both omega = 2.37 and omega = 3 rather than at one chosen value,
      because a cofactor claim that depends on an unstated omega is not a claim.

  predictions:
    - metric: >-
        exponent_invariance_residual -- (n - 2m) - ell*(V - M), evaluated
        exactly in integer arithmetic at every declared QR-UOV parameter set and
        at 10^4 randomly drawn (V, M, ell)
      direction: different
      minimum_effect: >-
        EXACTLY 0 at every point. Derived before the run. A single nonzero
        residual means the parameter semantics assumed here are wrong, which
        terminates the audit and redirects it -- the cheapest possible failure.
    - metric: >-
        shape_ratio_ell_dependence -- the partial derivative of n/m with respect
        to ell, evaluated symbolically
      direction: different
      minimum_effect: >-
        EXACTLY 0. n/m = (V + M)/M contains no ell.
    - metric: >-
        intersection_applicability_flag -- the truth value of V < 2M at each
        declared QR-UOV parameter set
      direction: different
      minimum_effect: >-
        Pre-registered as FALSE at every declared set, i.e. V >= 2M everywhere.
        This is the prediction the relayed ePrint 2026/298 explanation forces. A
        single declared set with V < 2M falsifies the relayed explanation as
        stated and is the most informative outcome available in this record.
    - metric: >-
        haystack_exponent_ratio -- log_q(number of candidate oil spaces over F_q)
        divided by log_q(number over A), at each declared parameter set
      direction: higher
      minimum_effect: >-
        EXACTLY ell, up to the o(1) in the Gaussian-binomial estimate; and at
        least 3 at every declared set if ell >= 3. Any value near 1 would mean the
        module constraint is not a real constraint and the whole framing is wrong.
    - metric: >-
        mitm_beats_ks_flag -- the truth value of M*V/2 < V - M at each declared
        parameter set and over all 1 <= M <= 16, 1 <= V <= 256
      direction: different
      minimum_effect: >-
        FALSE everywhere with M >= 2, TRUE only for M = 1 and V > 2. This is a
        complete integer-arithmetic enumeration, so the prediction is exact and
        exhaustive rather than statistical.

  minimal_test:
    design: >-
      Four stages, cheapest first, all zero-to-seconds compute; stage 1 can
      terminate the line. STAGE 0 (reading): obtain the QR-UOV parameter table
      and the definitions of V, M, ell, n, m, verbatim, with a locator. If no
      specification can be obtained after the declared source order (arXiv,
      ePrint abstract page, author-hosted copy, reference-implementation
      repository), record that and proceed with a SYMBOLIC-ONLY table, marking
      every numeric column as unavailable rather than inventing values. STAGE 1
      (seconds): verify the two identities exactly, symbolically and over a large
      random integer sweep; and independently re-derive the Kipnis-Shamir and
      intersection-attack statements from a primary source, recording quotations.
      A failure of either identity ends the audit. STAGE 2 (seconds): compute the
      full cost table, both omega values, both haystack columns, and the MITM
      flag by exhaustive enumeration over the declared integer ranges. STAGE 3
      (zero compute): write the Pareto comparison across time, memory and
      data/queries for every row, and state which rows are dominated by which.
    controls:
      - >-
        NULL OBJECT (must be able to fail). A DELIBERATELY MISMATCHED baseline:
        UOV over F_{q^ell} at (N, M) = (V + M, M*ell) rather than (V + M, M) --
        the "wrong descent" that confuses equation count with oil dimension.
        Forced value derived before the run: its exponent is
        ell*(V + M - 2*M*ell), which is NEGATIVE for ell >= 2 and any V < M(2ell
        - 1), hence manifestly not a matched baseline. The comparison instrument
        MUST flag this arm as mismatched. If it does not -- if the pipeline
        reports the mismatched baseline as comparable -- the instrument cannot
        detect a wrong baseline and no matched-baseline claim may be made from it.
      - >-
        POSITIVE CONTROL / NEARBY OBJECT (the effect MUST appear). PLAIN UOV at
        (q, n, m) with n = (V + M)*ell and m = M*ell, where the ell-cancellation
        MUST hold by construction because it is the same F_q system. The table
        must report exponent ratio exactly 1.000 against the QR-UOV row. If the
        instrument reports anything else, the arithmetic pipeline is broken and no
        conclusion may be drawn from any other row.
      - >-
        GRADED CONTROL, 4 interior points, monotonicity reported. Fix (V, M) and
        sweep ell in {1, 2, 3, 4, 5, 6, 8}. Report (a) the KS exponent, which must
        grow exactly linearly in ell with slope (V - M); (b) the haystack ratio,
        which must equal ell; (c) the linear-algebra cofactor, which must grow as
        ell^{omega - log_2 3}. Three quantities with three different pre-registered
        growth laws in the SAME parameter is a much sharper test than any one of
        them: a bug that fakes one law will not fake all three.
      - >-
        ARCHIVE CHECK, zero compute. Prior measurements of these observables in
        this program: NONE. Area QRUOV is empty. Recorded as an absence.
      - >-
        ORDERING CONTROL. The null (mismatched-baseline) arm is computed and
        committed before the QR-UOV row is read.
    required_metrics:
      - exact integer residual of both identities at every parameter set and over the random sweep
      - verbatim quotations, with locators, of the KS and intersection cost statements, or a recorded failure to obtain them
      - the full cost table with every column, at omega = 2.37 and omega = 3
      - the V < 2M flag per declared parameter set
      - the exhaustive MITM-versus-KS enumeration over the declared integer ranges
      - a Pareto disposition per row across time, memory and data/queries

  falsification_conditions:
    - >-
      Either identity fails at any parameter set. The assumed parameter semantics
      are wrong; the audit stops and is redirected.
    - >-
      A primary source states a Kipnis-Shamir or intersection cost incompatible
      with the recalled form. The recalled form is withdrawn and every derived
      column is recomputed; the record is superseded, never edited.
    - >-
      Some declared QR-UOV parameter set has V < 2M. The relayed ePrint 2026/298
      explanation is then wrong as stated and the reason QR-UOV survives the
      intersection attack is something else, which becomes the new question.
    - >-
      The positive control (plain UOV at the same F_q shape) does not report ratio
      1.000. The instrument is broken; nothing may be reported.
    - >-
      The haystack ratio is not ell. The Gaussian-binomial estimate or the
      module-count is wrong and the second half of the record is void.

  confounders:
    - >-
      PARAMETER SEMANTICS. Almost every risk in this record is the same risk:
      that (V, M, ell) do not mean what is assumed. Stage 0 exists for it and
      stage 1's identity check detects it.
    - >-
      OMEGA SHOPPING. A cofactor claim can be tuned by choosing omega. Both
      endpoints are reported, always, and neither is preferred.
    - >-
      ASYMPTOTIC SLOPPINESS IN THE HAYSTACK. The Gaussian binomial is
      q^{m(n-m)} only up to a bounded factor; the record uses it for an EXPONENT
      RATIO, where the bounded factor cancels, and does not use it for any
      absolute count.
    - >-
      A TABLE READS AS RIGOUR. Producing a cost table is easy and looks
      authoritative. The mismatched-baseline null exists specifically so that the
      table has to demonstrate it can detect a wrong baseline before any of its
      other rows are believed.

  interpretation_limits:
    - >-
      THIS PROPOSAL MOVES NO EXPONENT AND CLAIMS NO ATTACK. Stated plainly as the
      generation contract requires. Its deliverable is a baseline, two invariance
      facts, one cofactor, one haystack observation, and one derived disposal of
      the obvious way to spend the haystack.
    - >-
      Everything is conditional on f irreducible. The reducible case is a
      different object entirely and belongs to IDEA-20260805-bd8339.
    - >-
      A table computed from parameters that could not be READ is a symbolic
      exercise. Numeric columns are either sourced with a locator or marked
      unavailable; they are never filled from memory. AGENTS.md rule 9.
    - >-
      The MITM disposal closes generic enumeration only. It says nothing about
      structure-aware attacks over A, and the record names those as open rather
      than describing the lane as mined.

  heuristic_assumptions:
    - id: HEUR-QRUOV-BASE-1
      statement: >-
        FORALL fields F and all n' >= 3m', UOV key recovery over F with n'
        variables and m' equations costs |F|^{n' - 2m'} * poly(n', m'), with the
        polynomial factor free of |F| beyond the cost of one F-operation.
      rigorous_support: >-
        NONE SUPPLIED. Recalled from the multivariate literature, not read.
        Load-bearing for the exponent columns of the table but NOT for the two
        identities, which are pure arithmetic and unconditional.
      validation_plan: >-
        Stage 1 obtains a primary source and quotes it, or records that it could
        not. If the recalled form is wrong, the identities survive and only the
        interpretation changes -- which is why the record is built in that order.
    - id: HEUR-QRUOV-BASE-2
      statement: >-
        The two-map intersection attack applies exactly when n < 3m.
      rigorous_support: >-
        NONE SUPPLIED. Recalled. Used only to convert the relayed "linear solution
        space" phrase into a checkable inequality; if the true condition is a
        different threshold on n/m, the ell-cancellation conclusion is UNCHANGED,
        because ell cancels in n/m for any threshold whatsoever. That robustness
        is deliberate and is the reason the ratio, not the threshold, is the
        tracked object.
      validation_plan: >-
        Stage 1 quotation. Report the true threshold and recompute the flag.

  target_complexity:
    time_exponent: >-
      n/a for this audit -- no algorithm is proposed and no exponent is moved.
      The exponent being AUDITED is ell*(V - M) in log_q units, shown here to be
      identical on both sides of the descent.
    memory_exponent: >-
      Polynomial on both sides under HEUR-QRUOV-BASE-1, and this record's own
      deliverable requires the memory column to be filled per row rather than
      inherited -- the merged scouting brief records 82 of 229 evidence records
      never mentioning memory, and this table exists partly not to be the 83rd.
    best_known: >-
      q^{ell(V - M)} * poly, on both presentations, under the recalled cost
      statements.
    hidden_overhead: >-
      The linear-algebra cofactor ell^{omega - log_2 3}, and whatever the recalled
      poly(n', m') hides -- which is unknown to this program and is recorded as
      unknown rather than estimated.
    tradeoff_note: >-
      None claimed. The MITM disposal is a time-only argument; a memory-charged
      MITM is even worse for the attacker, so charging memory strengthens the
      disposal rather than weakening it, and the table records that direction.

  dominated_by: >-
    n/a (no result claimed): this proposal proposes no attack, so nothing can
    dominate it on an attack frontier. On the QUESTION it audits, the incumbent
    is the QR-UOV designers' own security analysis, which this program has not
    read. ROWS CHECKED before setting this field, listed because an unchecked
    null is a fabrication under rule 5 -- TIME: recalled Kipnis-Shamir
    q^{ell(V-M)}, recalled intersection attack under n < 3m, recalled rectangular
    MinRank (ePrint 2025/739, relayed), and generic MITM q^{ell M V/2}, all four
    evaluated above. MEMORY: all four recalled as polynomial except MITM, which is
    q^{ell M V/2} in memory as well and is therefore dominated on BOTH axes, not
    just time -- recorded because it strengthens the disposal. DATA / QUERIES:
    every route considered is key-only and consumes zero signatures, so no route
    dominates on that axis. The corpus contributes no rows at all: area QRUOV is
    empty.
  sota_delta: >-
    Zero on every attack axis, by construction and by intent. Quantitatively the
    record's outputs are: exponent difference between the two presentations,
    EXACTLY 0; cofactor difference, ell^{omega - log_2 3}, i.e. 3.4x at ell = 5,
    omega = 2.37 rendered as ell^{0.78} = 3.35, and 11.2x at omega = 3; haystack
    exponent difference, a factor of exactly ell; MITM margin against KS,
    M*V/2 - (V - M) >= 0 for all M >= 2, so the deficit is never negative and the
    route never wins.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.85 that this record produces its stated deliverable -- a matched baseline
    table with every column derived and every recalled input either quoted or
    marked unobtained. It is that high because the mathematical content is
    integer arithmetic that cannot fail, and because GOAL-QRUOV-001's next_action
    makes the baseline a hard prerequisite for its own first batch, so the
    deliverable is consumed whatever it says. It is not higher because the
    numeric columns depend entirely on obtaining a parameter table this program
    has never read, and a symbolic-only table is a materially weaker deliverable.
    It is not lower because even a fully symbolic outcome still discharges the
    ell-cancellation identities, the haystack observation, and the MITM disposal,
    none of which need a parameter value. Separately, and much lower: 0.05 that
    the audit uncovers a genuine mismatch between the QR-UOV and
    extension-field-UOV exponents -- the arithmetic already says it will not, and
    the value of running it is the audited baseline plus the small chance that the
    assumed parameter semantics are wrong.
