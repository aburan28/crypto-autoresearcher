idea:
  id: IDEA-20260805-64aef4
  question_id: RQ-XEDN-001
  added: '2026-08-05'
  goal_context: GOAL-ICLIFT-001
  title: >-
    The section-incidence over-dispersion factor: the second moment of the
    archived xedni census answers the prescribed-measure objection at zero new
    compute, and its forced null is g_eff = 1 exactly on the p = 2 mod 3 branch
  class: measurement

  claim: >-
    DEC-20260724-021 rejected H-XEDN-001 on an exact FIRST-moment identity,
    P_lift(p) = (1 - 2/p + p^-3)/(2p^3), and then recorded three fatal scoping
    objections, two of which are second-moment statements in disguise: RT-4
    (distinct sections are not independent sections; the counted sections form
    mu_3 orbits) and RT-5 (the measure is wrong for the attack -- xedni
    PRESCRIBES its surface through the target points, and the red team built an
    in-family prescribed surface at 10,201 of 10,201 attempts against a uniform
    per-slot rate of 4.76e-07). Both objections are settled by one number that
    the census computed the inputs for and never reported: the OVER-DISPERSION
    FACTOR of the per-surface section count,
        g_eff(p) := 1 + (F2 - lambda^2)/lambda,
    where lambda = mean sections per surface and F2 = E[s(s-1)] is the second
    factorial moment of the archived per-surface histogram. g_eff is EXACTLY the
    quantity RT-5 needs, because Pr[a second section | one section present] /
    Pr[a second section] = F2/lambda^2, and it is exactly the quantity RT-4
    needs, because a family whose sections come in orbits of size g under an
    automorphism has the forced value g_eff = g. The claim of this proposal is
    that g_eff is (i) computable from an already-committed artifact with no new
    mathematics and no new enumeration, (ii) equipped with a genuine matched null
    inside the same family -- the primes p = 2 mod 3, where mu_3 is not in F_p
    and the forced value is g_eff = 1 EXACTLY, a null that can fail -- and
    (iii) the quantity that decides whether the prescribed measure buys a
    CONSTANT factor (route stays closed, by a named obstruction rather than by a
    density exponent) or a GROWING one (route reopens and DEC-20260724-008 must
    be revisited). Nothing here claims an attack, an exponent, or a closure of
    candidate B2.

  object_first_candidate:
    tracked_object: >-
      The per-surface section-count random variable s(b) = #{admissible slots on
      the surface y^2 = x^3 + b(t)}, followed not through its mean (which the
      census determined exactly, and which is the whole content of the p^-3
      verdict) but through its FACTORIAL MOMENTS. The tracked object is the pair
      (lambda, F2) and the derived over-dispersion g_eff. Equivalently, and this
      is the form that makes it an incidence-geometry object: the count of
      ORDERED PAIRS of distinct sections on a common surface,
      N_2(p) = sum_b s(b)(s(b) - 1), which is a collision count of the map
      (x(t), y(t)) -> b := y^2 - x^3 restricted to the frozen degree shapes.
    established_families_off_limits: >-
      Declared off-limits as the primary lens: (1) the classical xedni algorithm
      and its number-field descendants; (2) the coefficient-growth line -- the
      JKSST relation-coefficient obstruction and the entire max_|coeff| lineage
      of EXP-XEDN-003 through EXP-XEDN-007, which is another goal's territory and
      is NOT re-run or restated here; (3) the p^-alpha density line, which is
      exactly what the census closed and what this proposal refuses to re-measure;
      (4) canonical-height and polarisation-Gram diagnostics, which KN-FIND-003
      warns are not Shioda rank; (5) summation-polynomial index calculus and
      every prime-field relation-collection method. The lens used here is
      incidence counting and second moments, and nothing else.
    newness_score: >-
      The arithmetic (a second factorial moment of a committed histogram) is
      trivial. What is new in this corpus is the identification of that number as
      the exact answer to RT-5, and the observation that the census's own design
      -- fibering over sections rather than sampling over surfaces -- already
      produced the per-surface histograms at p = 5, 7, 11, 13 and therefore
      already contains the answer. The census reported the histogram's TAIL
      (fraction of surfaces with >= 9 distinct sections) and never its second
      moment; the tail was chosen because s >= r+1 = 9 was believed to be the
      relation criterion, which RT-4 then showed is "neither necessary nor
      sufficient". The moment is criterion-free.
    testability_score: >-
      Maximal, and unusually so: stage 0 requires reading one committed JSON file
      and performing 64 multiplications. numpy 2.4.6 is present in this container
      (verified in session); sympy and Sage are ABSENT (verified: both imports
      fail). Nothing here needs either.
    survival_score: >-
      The object survives as far as the census's own enumeration reaches
      (p <= 13 archived; p <= 19 or 23 within a bounded budget by the same
      fibering, cost ~ p^7 slot-section pairs). It dissolves beyond that, and the
      contract says so rather than extrapolating.

  mechanism: >-
    DERIVED IN SESSION.

    (1) THE FROZEN FAMILY, restated exactly. Surfaces are y^2 = x^3 + b(t) over
    F_p with deg b = 6 exactly, so the surface count is (p-1)p^6 (this reproduces
    the archived n_surfaces: 62500 at p = 5, 705894 at p = 7, 17715610 at p = 11,
    57921708 at p = 13 -- checked in session). A "slot" is a candidate x(t) of the
    frozen degree shape; a slot is "hit" when x^3 + b is a nonzero square in
    F_p[t] under the frozen predicate. The census's exact identity
    P_lift = N_hit/N_slots = (p^3 - 2p^2 + 1)/(2p^6) was re-derived in session
    from the published N_hit = p^2(p^4 - 3p^3 + 2p^2 + p - 1)/2 and
    N_slots = (p-1)p^8, and the two agree identically because
    (p-1)(p^3 - 2p^2 + 1) = p^4 - 3p^3 + 2p^2 + p - 1. The identity is not in
    dispute and is not re-tested.

    (2) WHY A FIRST MOMENT CANNOT ANSWER RT-5. The attack does not draw a surface
    and hope it carries a section; it CONSTRUCTS the surface from the section.
    Given a section (x(t), y(t)) the surface is determined: b := y^2 - x^3. So
    prescribing one section has probability 1 by construction, which is precisely
    what the red team measured (10,201 of 10,201). The attack needs TWO sections
    on one surface -- one specialising to P, one to Q -- so the operative
    quantity is not Pr[section] but Pr[second section | first section]. By
    definition of the histogram,
        Pr[2nd | 1st] / Pr[2nd]  =  E[s(s-1)] / E[s]^2  =  F2/lambda^2,
    which is the standard over-dispersion ratio. The census computed lambda
    exactly and never computed F2, although it enumerated the histogram that
    determines it.

    (3) THE FORCED NULL, AND WHY IT IS A REAL NULL. If sections were placed on
    surfaces independently (a Poisson incidence model), F2 = lambda^2 exactly and
    g_eff = 1. If instead the sections carried by a surface arrive in orbits of
    size g under an automorphism of the family, then s = gK with K Poisson of
    mean lambda/g, giving
        F2 = E[gK(gK-1)] = g^2(nu + nu^2) - g nu = lambda^2 + (g-1) lambda,
    hence g_eff = g EXACTLY. So g_eff is a direct, model-free readout of the
    effective orbit size, and it is the quantitative form of RT-4's "distinct is
    not independent".
    THE NULL OBJECT IS INSIDE THE FAMILY AND COSTS NOTHING: mu_3 subset F_p
    holds iff p = 1 mod 3. KN-FIND-003 states the coefficient bound was witnessed
    by mu_3 orbits "at primes p = 1 mod 3" -- every tested prime in EXP-XEDN-003
    was on that branch. On the complementary branch p = 2 mod 3 the cube roots of
    unity are absent from F_p, the orbit mechanism is unavailable, and the FORCED
    VALUE is g_eff = 1 exactly. That null is of identical shape (same family,
    same predicate, same enumeration code, same degree shapes) and it CAN FAIL:
    if g_eff differs from 1 on the p = 2 mod 3 branch, mu_3 is not the mechanism
    and KN-FIND-003 needs rescoping.

    (4) THE READING OF THE ARCHIVED ARTIFACT. SESSION-COMPUTED, OUTSIDE THE
    HARNESS, FROM A COMMITTED FILE
    (experiments/EXP-XEDN-002/runs/RUN-XEDN-002-C/raw-result.json, field
    histogram_slots_per_surface, free-x convention); THIS IS NOT A RUN AND IS NOT
    EVIDENCE, and reproducing it in-harness without importing census code is
    stage 1 of the paired experiment:
        p = 5  (2 mod 3): lambda = 0.403200, F2 = 0.159360, g_eff = 0.992
        p = 7  (1 mod 3): lambda = 0.429821, F2 = 1.945439, g_eff = 5.096
        p = 11 (2 mod 3): lambda = 0.454887, F2 = 0.214528, g_eff = 1.017
        p = 13 (1 mod 3): lambda = 0.461749, F2 = 2.283275, g_eff = 5.483
    and under the monic-x convention g_eff = 1.034 / 8.144 / 1.032 / 8.294 at the
    same four primes. The branch separation is total and it is the shape the
    mu_3 mechanism predicts. Two things follow and must be stated with equal
    force. FIRST, the null holds: at p = 2 mod 3 the archived data are consistent
    with g_eff = 1 to within 2%, which is a genuine controlled null and the first
    one this route has had. SECOND, THE ORBIT MODEL DOES NOT FIT AS POSED: g = 3
    predicts g_eff = 3 and g = 6 predicts g_eff = 6, and the readings sit between
    (5.10, 5.48 free-x; 8.14, 8.29 monic). Something beyond a single mu_3 orbit
    is contributing -- a mixture of orbit sizes, an interaction with the y -> -y
    doubling, or a residual clustering the automorphism does not explain -- and
    identifying it is the experiment's mechanism arm, not a parameter to be
    fitted afterwards.

    (5) WHAT THE ANSWER DECIDES, STATED BOTH WAYS BEFORE THE RUN. If g_eff is
    BOUNDED in p (constant on each branch, slope versus log p including 0), then
    prescribing the first section multiplies the chance of a usable second one by
    a constant, the uniform-measure exponent alpha = 3 is not rescued but is
    replaced by a bounded conditional advantage, and RT-5's objection --
    correct as a criticism of the measured quantity -- does NOT reopen the route:
    the obstruction survives the change of measure, now with a named mechanism
    (bounded automorphism orbits) rather than a density exponent. If g_eff GROWS
    with p on either branch, then the prescribed measure carries a growing
    advantage the uniform census could not see, RT-5 is fatal in substance and
    not only in scope, and DEC-20260724-008 must be revisited. The two outcomes
    are equally reportable and the second is the one that would matter.

    (6) COST BOOKKEEPING, per the per-attempt-cost x inverse-success-probability
    discipline. The census's own fibering enumerates p^3 x p^4 = p^7 (x, y) pairs
    in the free-x convention and buckets them by b. Archived cost: 13.8 s and
    448 MB for p in {5, 7, 11, 13} together (p = 13 alone is 6.3e7 pairs). Scaling
    exactly: p = 17 is 4.1e8, p = 19 is 8.9e8, p = 23 is 3.4e9. So {17, 19} are
    reachable in a bounded budget with numpy chunking and p = 23 is best-effort;
    the contract says so and does not promise 23. Memory is bounded by the
    bucket table, which is O((p-1)p^6) counters and is the binding resource:
    1.9e8 at p = 17 and 8.9e8 at p = 19, so the implementation must count by
    streaming sort or by a two-pass hash rather than a dense table, and the
    contract charges that explicitly.

  novelty_status: unverified

  literature_context:
    - >-
      DEC-20260724-021 (READ in full, this session) and EV-XEDN-001 (READ in
      full). Source of RT-4 and RT-5 verbatim, of the exact identity, and of the
      eleven forbidden sentences. This proposal asserts none of them; in
      particular it does not say "the multi-section or Mordell-Weil
      relation-source route is closed", and its negative branch would say only
      that the conditional advantage is bounded on the tested primes.
    - >-
      KN-FIND-003 (READ) -- "mu_3 supplies infinity-norm-1 MW relations on the
      frozen j=0 free-x family; polarisation Gram rank is not Shioda rank",
      scoped to p in {7, 13, 19, 31}, all = 1 mod 3. This proposal supplies the
      matched null that finding never had: the p = 2 mod 3 branch, where the
      stated mechanism must be absent.
    - >-
      RUN-XEDN-002-C raw-result.json (READ, committed artifact). Its
      counting_conventions field already carries the independence caveat
      verbatim, and its shioda_tate_requirement field records
      "rank_bound_r = 8 ... source = Shioda-Tate bound for a rational elliptic
      surface (literature; not recomputed here)". The rank bound is therefore
      RELAYED inside the census's own artifact and is treated here as
      RECALLED, UNVERIFIED; the companion proposal IDEA-20260805-e5dd09 makes
      verifying it a stage rather than assuming it.
    - >-
      Shioda-Tate, Kodaira fibre types, Oguiso-Shioda classification of
      Mordell-Weil lattices of rational elliptic surfaces: RECALLED, UNVERIFIED.
      No theorem number, page, venue or year is asserted anywhere in this record.
      Nothing in this proposal's own predictions depends on them: g_eff is a
      moment of a measured histogram and needs no geometry to be defined.
    - >-
      GOAL-XEDN-001/002/003 and EXP-XEDN-004..007 (specifications read at the
      objective level, this session) pursue the coefficient-growth question on
      non-isotrivial families, raised deg a, deg b = 10 and deg x <= 3. This
      proposal deliberately does NOT enter that space: it stays on the frozen
      GOAL-ICLIFT-001 family and measures a different moment of it. That is the
      non-duplication statement.

  lossy_projection_identifiability_audit:
    projection: >-
      Surface b in F_p[t] (a point of a (p-1)p^6-element space) --> its section
      count s(b) (a small integer) --> the population histogram of s --> the pair
      (lambda, F2) --> g_eff.
    what_is_discarded: >-
      Which sections, where, and on which surface. Everything about the geometry
      of b -- its factorisation, its fibre types, its Mordell-Weil lattice -- is
      discarded, and so is the identity of the surface. Only multiplicities
      survive.
    why_genuinely_lossy: >-
      The fibre over a given value of s(b) is enormous: at p = 13, 50,899,654 of
      57,921,708 surfaces share the value s = 0 and 6,213,766 share s = 3. No
      inversion exists even in principle, so this is not a change of coordinates.
      Compatibility with the target's operations is what makes the retained part
      useful: s(b) is preserved by the F_p-automorphisms of the family (scaling
      b -> u^6 b with the matching (x, y) scaling, and t -> t + c), so the
      histogram is an invariant of the family and not of a coordinate choice, and
      it propagates deterministically into the conditional probability the attack
      consumes.
    is_it_only_a_change_of_coordinates: >-
      No. The failure checked for in the other direction -- the mirror failure,
      a projection so lossy it is constant across instances -- is the live risk
      here and it was checked explicitly, because the FIRST moment of this very
      projection is nearly constant: lambda = 0.4032, 0.4298, 0.4549, 0.4617
      across p = 5..13, drifting by 15% over a factor 2.6 in p, which is exactly
      why the census's mean-based verdict could not discriminate anything about
      clustering. The SECOND moment is not constant: F2/lambda^2 reads 0.98,
      10.53, 1.04, 10.71 on the same four primes. Comparator spread is therefore
      an order of magnitude, the mirror failure does not apply to the object as
      tracked, and it DOES apply to the object as the census tracked it. That
      contrast is the proposal.

  assumptions:
    - >-
      The archived RUN-XEDN-002-C histograms are what they say they are. Stage 1
      re-derives them independently without importing census code; if the
      independent enumeration disagrees on any bin, everything downstream is
      suspended and the disagreement is the deliverable.
    - >-
      "Section" means a hit slot of the frozen degree shape under the frozen
      predicate, exactly as in EXP-XEDN-002. Both the monic-x and free-x
      conventions are carried side by side throughout, because the census's own
      multi-section margin flipped between them (EV-XEDN-001), and no single
      convention is privileged.
    - >-
      No claim is made that a second section on the same surface is USABLE for
      the attack. g_eff bounds the conditional abundance; usability additionally
      requires independence in the Mordell-Weil group and a relation with small
      coefficients, which are separate questions handled elsewhere and explicitly
      out of scope here.

  proof_search_map_note: >-
    This idea is primarily a measurement, but its negative branch would be a
    scoped closure argument, so the paired hypothesis H-ICLIFT-4d4384 carries a
    filled proof_search_map rather than declaring it non-applicable.

  predictions:
    - metric: >-
        g_eff(p) = 1 + (F2 - lambda^2)/lambda on the p = 2 mod 3 branch
        (p in {5, 11, 17, 23}), free-x convention
      direction: lower
      minimum_effect: >-
        FORCED VALUE 1.000, stated before the run because mu_3 is not a subgroup
        of F_p* there and the orbit mechanism is unavailable. Tolerance
        |g_eff - 1| <= 0.05 at every prime on the branch. THIS CAN FAIL: any
        prime on this branch with g_eff >= 1.5 refutes the mu_3 attribution in
        KN-FIND-003 and redirects the whole line.
    - metric: >-
        g_eff(p) on the p = 1 mod 3 branch (p in {7, 13, 19, 31}), free-x
      direction: higher
      minimum_effect: >-
        >= 3.0 at every prime on the branch, which is the minimum the mu_3 orbit
        model can produce (g = 3 gives g_eff = 3 exactly). A value below 3 on
        this branch means the orbits are not the source of the clustering.
    - metric: >-
        slope of g_eff versus log p, fitted separately within each branch, with a
        jackknife interval over the primes of that branch
      direction: different
      minimum_effect: >-
        THE DECISION METRIC. Predicted: interval INCLUDES 0 on both branches,
        i.e. g_eff is bounded. A branch whose slope interval excludes 0 upward,
        with |slope| >= 0.5 per unit log p, is the reopening condition and
        obliges a superseding record against the "bounded conditional advantage"
        reading.
    - metric: >-
        the over-dispersion ratio F2/lambda^2 itself, both conventions, all primes
      direction: higher
      minimum_effect: >-
        On the p = 1 mod 3 branch, >= 3 and bounded above by 50 at every tested
        prime. The upper bound is stated so the prediction can fail in both
        directions; an unbounded ratio is the same reopening signal as a positive
        slope.
    - metric: >-
        exact reproduction of the archived per-surface histograms at
        p in {5, 7, 11, 13} by an independent enumeration
      direction: different
      minimum_effect: >-
        BIN-FOR-BIN EXACT, both conventions. Any discrepancy suspends every other
        metric and is reported as the primary finding.
    - metric: >-
        the surface-count identity n_surfaces = (p-1)p^6 and the slot-count
        identity N_slots = (p-1)p^8
      direction: different
      minimum_effect: >-
        EXACT at all tested p (62500, 705894, 17715610, 57921708 at p = 5, 7, 11,
        13). A cheap instrument check that can fail and that costs one line.

  minimal_test:
    design: >-
      Five stages, cheapest first; stage 0 alone can terminate the line. STAGE 0
      (zero compute, one committed file, ~64 multiplications): compute g_eff from
      the archived histograms at p = 5, 7, 11, 13 in both conventions and check
      the branch separation. If the p = 2 mod 3 branch does NOT return g_eff ~ 1,
      the null has already failed and everything after is suspended. STAGE 1
      (minutes): independent re-enumeration at p <= 13 without importing census
      code; must match bin for bin. STAGE 2 (bounded, numpy): extend to p = 17,
      19 and, best-effort only, 23, giving >= 3 primes per branch. STAGE 3: the
      mechanism arm -- for surfaces with s >= 3, verify by the group law whether
      the sections form orbits, and report the ORBIT-SIZE DISTRIBUTION, testing
      the derived g_eff = g against the observed mixture rather than fitting it.
      STAGE 4: the conditional-boost readout Pr[>=2 | >=1] / Pr[>=2], which is the
      number RT-5 needed. Full contract: experiments/EXP-ICLIFT-290f2e.
    controls:
      - >-
        NULL OBJECT OF THE SAME SHAPE (the p = 2 mod 3 branch: p in {5, 11, 17,
        23}). Same family, same predicate, same code, same degree shapes; only
        the availability of mu_3 differs. FORCED VALUE g_eff = 1 DERIVED BEFORE
        THE RUN. IT CAN FAIL, and a failure is more informative than a pass.
      - >-
        POSITIVE CONTROL / PLANTED OBJECT. Construct a surface carrying a known
        mu_3 orbit of sections at a p = 1 mod 3 prime, by applying the order-3
        automorphism (x, y) -> (w x, y), w^3 = 1, to a known section, and confirm
        the enumerator finds all three and the group law verifies
        S + wS + w^2 S = O. IF THE INSTRUMENT DOES NOT RECOVER THE PLANTED ORBIT,
        NO NEGATIVE RESULT MAY BE REPORTED FROM ANY ARM. This also repairs, for
        this contract only, the defect EV-XEDN-001 records against its
        predecessor: its planted control had deg b = 5 and lay OUTSIDE the census
        family, so the package had no in-population positive control. This one is
        in-population by construction.
      - >-
        GRADED CONTROL, >= 3 interior points per branch, monotonicity reported.
        Primes are chosen to give at least three per residue class so that a
        slope and a jackknife interval exist per branch, and the report states
        whether g_eff is monotone in p within each branch. A localised failure
        (one prime out of line) then points at that prime rather than leaving
        "it did not work".
      - >-
        ORDERING CONTROL. The p = 2 mod 3 null arm is computed, written and
        hashed BEFORE the p = 1 mod 3 arm is looked at, and the decision rule is
        executed on the null first. If the rule emits the same verdict on both
        branches it discriminates nothing and is rewritten before the treatment
        arm is read.
      - >-
        INSTRUMENT IDENTITY CHECKS that can fail: n_surfaces = (p-1)p^6;
        N_slots = (p-1)p^8; section-point counts all even (y and -y); totals
        matching the closed form N_hit. All four are recorded in the archived
        artifact and all four are recomputed independently.
    required_metrics:
      - lambda, F2, g_eff and F2/lambda^2 per prime per convention, as exact rationals where possible
      - the full independently recomputed per-surface histogram at every prime
      - per-branch slope of g_eff versus log p with a jackknife interval
      - orbit-size distribution on surfaces with s >= 3, with group-law verification counts
      - Pr[>=2 sections | >=1 section] and its ratio to the unconditional Pr[>=2 sections]
      - wall clock, peak memory and the exact enumeration count p^7 per prime, charged not omitted

  falsification_conditions:
    - >-
      g_eff >= 1.5 at any prime on the p = 2 mod 3 branch. The mu_3 attribution
      is then wrong, KN-FIND-003's mechanism claim needs rescoping by a
      superseding record, and this proposal's null is void.
    - >-
      g_eff < 3.0 at any prime on the p = 1 mod 3 branch. The orbit model then
      does not even supply a lower bound and the observed clustering has another
      source.
    - >-
      Per-branch slope of g_eff versus log p excluding 0 upward with magnitude
      >= 0.5. The conditional advantage is then growing, the prescribed measure
      is materially different from the uniform one in the direction RT-5 feared,
      and the negative branch of this proposal is withdrawn.
    - >-
      Any bin-level disagreement between the independent re-enumeration and the
      archived histogram at p <= 13. Everything downstream is suspended.
    - >-
      Failure of the planted mu_3 orbit control. No negative may be reported at
      all (AGENTS.md rule 5; inventor protocol section 3).

  confounders:
    - >-
      SMALL-PRIME ARTEFACTS. p = 5 and 7 are very small and the degree shapes are
      fixed, so a residual finite-size effect could masquerade as branch
      structure. Mitigation: >= 3 primes per branch, and the branch contrast is
      between primes of comparable size (11 versus 13, 17 versus 19), not between
      small and large.
    - >-
      CONVENTION DEPENDENCE. The monic-x and free-x conventions give different
      g_eff (session reading: 8.14 versus 5.10 at p = 7). Both are carried
      throughout and no verdict may rest on one. EV-XEDN-001 records that the
      census's multi-section margin already flipped between conventions, so this
      is a known live confounder in this exact family.
    - >-
      THE y -> -y DOUBLING. Points are exactly twice slots. Whether the moment is
      taken over slots or over points changes g_eff, and both are reported
      separately; conflating them is the specific arithmetic error this
      confounder names.
    - >-
      DISTINCT IS STILL NOT INDEPENDENT. g_eff measures conditional ABUNDANCE of
      distinct sections, not independence in the Mordell-Weil group. A large
      g_eff driven entirely by automorphism orbits is exactly the case where the
      extra sections are useless for the attack, and the report must say so in
      the same sentence as the number.
    - >-
      MEASURE MISMATCH, RESIDUAL. Conditioning on "the surface carries one
      section" is not identical to the attack's conditioning on "the surface
      carries a section through the SPECIFIC point P at the SPECIFIC place t_0".
      The two differ by the transitivity of the family's automorphisms on
      (place, point) pairs, which is asserted nowhere here. The gap is stated as
      a limitation, and closing it is named as forward guidance rather than
      claimed.

  interpretation_limits:
    - >-
      Toy scale, frozen isotrivial family, one predicate, one pair of degree
      shapes, p <= 23. Nothing here is a closure of candidate B2, of function-
      field xedni, of non-isotrivial families, of number-field xedni, or of
      lifting in general -- the eleven sentences DEC-20260724-021 forbids remain
      forbidden and none is asserted.
    - >-
      A bounded g_eff does NOT close the route. It shows that one specific
      objection (RT-5's measure mismatch) does not, on the tested primes, convert
      into a growing advantage. Forward guidance if that is the outcome: the
      remaining live routes are the non-isotrivial family under the prescribed
      measure, the two-point prescribed count (both P and Q on one surface, which
      is a different and stronger conditioning than measured here), higher-degree
      section shapes, and the rank/independence question that IDEA-20260805-e5dd09
      addresses.
    - >-
      This proposal is not evidence about relation coefficients and does not
      touch the EXP-XEDN-003..007 lineage or its conclusions.
    - >-
      The session readings quoted in the mechanism are READINGS OF A COMMITTED
      ARTIFACT PERFORMED OUTSIDE THE HARNESS. They are not runs, they are not
      evidence, and no record may cite them until stage 1 reproduces them
      in-harness.

  heuristic_assumptions:
    - id: HEUR-XEDN-G1
      statement: >-
        If the sections carried by a surface of the frozen family arrive in
        orbits of a fixed size g under an automorphism group acting freely on
        them, and the number of orbits per surface is Poisson with mean
        lambda/g, then F2 = lambda^2 + (g-1)lambda and hence g_eff = g exactly.
      rigorous_support: >-
        The identity E[gK(gK-1)] = g^2 E[K^2] - g E[K] = g^2(nu + nu^2) - g nu is
        exact for K Poisson(nu); the only assumptions are the freeness of the
        action and the Poisson law for the orbit count. Neither is proved here.
        The Poisson law is a modelling choice; the freeness is checkable directly
        on the enumerated sections and stage 3 checks it.
      validation_plan: >-
        Stage 3 measures the orbit-size distribution directly by group-law
        verification and compares the mixture-implied g_eff with the measured
        one. The session readings already indicate the pure-g model does NOT fit
        (5.10 and 5.48 lie between g = 3 and g = 6), so this heuristic is
        expected to be REFUTED as posed, and the deliverable is the mixture that
        replaces it.
      falsification_condition: >-
        Measured g_eff differing from the orbit-mixture prediction by more than
        20% at any tested prime, with the orbit distribution measured rather than
        assumed.
    - id: HEUR-XEDN-G2
      statement: >-
        Conditioning on "carries at least one section" is a faithful proxy, up to
        a bounded factor, for the attack's conditioning on "carries a section
        through a prescribed point at a prescribed place".
      rigorous_support: >-
        None asserted. This is the residual measure gap named in the confounders,
        and it is the reason this proposal answers RT-5 only partially and says
        so.
      validation_plan: >-
        Not validated here. Named as forward guidance: the honest closing of the
        gap is an exact two-point prescribed count, which is a collision count of
        the same map and is the natural successor experiment.
      falsification_condition: >-
        An exact two-point prescribed count differing from lambda * g_eff by a
        factor growing with p.

  target_complexity:
    exponent_moved: >-
      NONE is claimed by this proposal, and it says why it is worth running
      anyway: it is a GATE on an exponent claim already on the ledger. The
      committed value alpha = 3 for P_lift is the exponent of the uniform
      measure; RT-5 argues the attack's measure is different; g_eff is the exact
      factor between them at the one-section level. If g_eff is bounded, the
      alpha = 3 obstruction survives the change of measure and the route stays
      closed at bounded cost -- no exponent moves and none is claimed. If g_eff
      grows like p^delta, the effective exponent under the prescribed measure is
      3 - delta (per additional section) and THAT would be an exponent movement
      on a central hard problem, which is why the metric is worth the compute
      despite a low prior.
    memory_exponent: >-
      Of the measurement, not of any attack: O((p-1)p^6) bucket counters if done
      densely, which is 8.9e8 at p = 19 and is the binding resource. The contract
      requires a streaming or two-pass count instead and charges it. No attack
      memory claim exists.
    best_known: >-
      For this exact question there is no incumbent: no record in this corpus
      reports a second moment of the section-incidence distribution. The nearest
      published quantity is the census's own tail statistic (fraction of surfaces
      with >= 9 distinct sections: 0, 7.893536e-03, 0, 8.815141e-03 free-x at
      p = 5, 7, 11, 13), which RT-4 showed uses a criterion that is "neither
      necessary nor sufficient".
    hidden_overhead: >-
      The p^7 enumeration constant. Archived: 13.8 s for all four sizes together
      at p <= 13. Extrapolated exactly by the p^7 law to 4.1e8 / 8.9e8 / 3.4e9
      pairs at p = 17 / 19 / 23. The extrapolation is arithmetic on a known
      enumeration size, not a runtime prediction, and the contract treats a
      budget overrun as infrastructure signal.

  dominated_by: >-
    n/a (no attack, no algorithm, no cost claim). Frontier rows checked before
    setting this: (time) rho at O(sqrt(N)) for the ECDLP this route would
    eventually attack -- untouched and vastly cheaper than anything here;
    (memory) rho at O(1) versus this measurement's O(p^7) streamed enumeration --
    the measurement is dominated as a computation and is not offered as one;
    (data/queries) no oracle model; (lifting frontier) the classical xedni
    literature's coefficient-growth obstruction, which is a different obstruction
    and is explicitly not measured here; (this corpus) ECFG-P1543 and ECFG-P1547
    in ledger/FINDING-PF-IC-001.md, which EV-XEDN-001 states this family neither
    supersedes nor adds to. Searched this corpus for a prior second-moment or
    over-dispersion statistic on section incidence: none found, and the census
    artifact's own independence_caveat field is the closest thing. Absence of a
    search result is not evidence that nothing exists.
  sota_delta: >-
    Quantitatively: converts an unanswered fatal scoping objection (RT-5, on
    record since 2026-07-24 and never addressed) into a measured number, at a
    marginal cost of ~64 multiplications for the decisive first reading and
    minutes for its independent reproduction at p <= 13. It supplies the first
    matched null this route has ever had -- the p = 2 mod 3 branch, forced value
    1, and the archived data already sit within 2% of it -- against a corpus
    baseline in which 72% of evidence records have no null anywhere. No speedup,
    no exponent, no attack.

  estimated_cost:
    implementation: low
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: >-
    0.75 that g_eff comes out bounded on both branches, i.e. that the negative
    branch holds and the route stays closed with a named mechanism. It is not
    higher because only two primes per branch are archived, because the orbit
    model already fails to fit as posed (5.10 and 5.48 against a predicted 3 or
    6), and because a slowly rising pair of readings is exactly what a genuinely
    growing quantity looks like at two points -- two points cannot distinguish a
    constant from a slow growth, which is the whole reason for demanding three
    primes per branch. It is not lower because the branch contrast is total and
    mechanistic (mu_3 present or absent), because bounded automorphism orbits
    cannot produce unbounded clustering, and because the p = 2 mod 3 readings sit
    within 2% of the forced value 1 with no fitted parameter.
    Separately: 0.95 that stage 0 executes at all, since it reads one committed
    file; and 0.9 that stage 1 reproduces the archived histograms, since the
    census's own validator already re-derived the closed form independently
    (TASK-20260724-234).
