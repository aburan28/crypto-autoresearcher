  title: Degree-3 SNFS field Q(c^{1/3}) instead of the quadratic stand-in for E(K) small points
  class: measurement
  claim: For K = Q(2^{1/3}) and the ladder curves, points of E(K) with coordinates in O_K of bounded height number
    (log H)^{r_K/2} with r_K = rank E(Q) + rank of the cubic-twist part, and their reductions at primes p = 1 mod
    3 where 2 is a cube cover E(F_p) like uniform points, as in EXP-CZLIFT-a255fc's quadratic case.
  mechanism: The user's K = Q(c^{1/d}) clause; d = 2 was instrumented through twists. Degree 3 needs search over
    O_K-coordinates and is where the SNFS field actually lives.
  novelty_status: speculative
