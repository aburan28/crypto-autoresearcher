    "claim": "R3 representation at the decomposition/relation stage. Bounded-degree nonlinear consequences can reduce branch search before depth (m-1)l even when Gaussian elimination on the input XOR rows is inert. The proposed finite improvement is at least 2x in total Boolean/field work after charging every unsuccessful derivation pass.",
