  enumerated_closures:
    - >-
      If the kernel hints are redundant in the baseline lattice, the exact
      rank event is real but this attack interface is closed; nonlinear uses of
      the same event remain open.
    - >-
      If fully charged gain is under 2 bits, the selected CRT-rank linear-hint
      lane is non-material at the declared sets; other A-aware geometry and
      ciphertext/failure mechanisms remain open.
  open_directions:
    - Kernel-orientation statistics beyond corank if rank count collides.
    - Nonlinear small-error recovery from one CRT error evaluation.
    - Continuous public GSO-quality screening, kept separate from the exact rank event.
