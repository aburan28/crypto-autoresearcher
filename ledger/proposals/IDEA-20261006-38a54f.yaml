idea:
  id: IDEA-20261006-38a54f
  question_id: RQ-TORS-8c7b79
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    Factor degrees of the 5-division polynomial on y^2 = x^3 + 2x + 3
    over F_13 are unchanged when k changes
  class: control
  claim: >-
    Let E be y^2 = x^3 + 2 x + 3 over F_13. Let psi_5 be its
    5-division polynomial in x. Let P be the point with the least
    x-coordinate in {0, 1, ..., 12} that lies on E and is not 2-torsion.
    The multiset of degrees of the irreducible factors of psi_5 over
    F_13, computed from the curve coefficients alone, is the same when
    the second point is [1]P and when it is [2]P. A different multiset
    is a negative. No discrete logarithm is computed, and the
    generic-group exponent 1/2 is unchanged.
  mechanism: >-
    PAIR (representation, Sigma): the representation is the affine
    x-coordinate. Sigma is the Frobenius action on the roots of psi_5,
    not translation by P. Trichotomy class: coordinate-dependent,
    because the polynomial is written in x and discards y. The
    projection keeps the multiset of factor degrees and discards the
    roots themselves and the point Q. Many root sets share one degree
    multiset, so the projection is lossy. It is not a block system of
    the translation group. Two explanations are separated before the
    factorisation. Explanation A: psi_5 does not read k, so the degree
    multiset at Q = [1]P equals the multiset at Q = [2]P. Explanation B:
    the two multisets differ, so the instrument has taken k from
    somewhere other than the curve equation. A curve-only statistic is
    k-independent by the shape of the polynomial. The test is whether
    the implementation stays curve-only. No factor base is built.
  novelty_status: unverified
  citations:
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic algorithm needs a square-root number of group
        operations. A sub-square-root algorithm must use the
        representation. This idea does not produce one.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Isogenous curves share the group-structure class of weakness.
        The factor degrees here are not used as a hidden endpoint.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
    - ref: KR-IC-5a43e5
      provenance: internal
      claim: >-
        Semaev summation polynomials vanish when x-coordinates sum to
        the identity, and using them as a decomposition is the
        index-calculus framework. This idea factors a division
        polynomial and does not build a summation polynomial.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
    - ref: RQ-TORS-8c7b79
      provenance: internal
      claim: >-
        The question asks whether ell-torsion, as a Galois module,
        carries public information about k. A curve-only statistic is
        k-independent by construction.
      verified_by: ledger/questions/RQ-TORS-8c7b79.yaml
  assumptions:
    - psi_5 is the standard 5-division polynomial of the short-Weierstrass model. A polynomial that fails the order check on a known 5-torsion point in an extension is not used.
    - P exists. If every affine point is 2-torsion, the setup fails.
    - The quadratic twist by the least non-residue is recorded as a null and is not substituted for E.
  proof_search_map:
    bottleneck: >-
      Whether the factor-degree multiset of psi_5 changes when [1]P is
      replaced by [2]P.
    baseline_embedding:
      parameter_slice: >-
        One ordinary curve at p = 13 and one polynomial of degree 12.
      reproduction_check: >-
        The same polynomial is built twice from (A, B) alone. The two
        copies must have the same factor degrees before k is mentioned.
    observation_collision:
      observable: the multiset of irreducible-factor degrees of psi_5
      distinct_preimage_search: >-
        Two different values of k can share one multiset. Unequal
        multisets are the collision that kills explanation A.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The fibre of the factor-degree map on short-Weierstrass models
          at p = 13.
        predicted_gain: >-
          Equality of two multisets. No discrete-log cost changes.
    quantifier_order: >-
      On this one curve, for the least eligible P, the multiset at
      [1]P equals the multiset at [2]P. This is not every curve.
    method_ceiling:
      strongest_certifiable_claim: >-
        The degree multiset does not read k on this curve, or the two
        multisets differ.
      nearby_object_control: >-
        The shifted polynomial psi_5(x - x([1]P)) against
        psi_5(x - x([2]P)). If x(P) is not x([2]P), those two shifted
        multisets must differ. If they agree, the shift control is
        blind and the unshifted comparison is refused.
    proof_obligations:
      - claim: psi_5 is built from (A, B) alone
        responsibility: correctness
      - claim: the two unshifted multisets agree
        responsibility: strictness
      - claim: the shifted control can tell x(P) from x([2]P)
        responsibility: baseline
    not_applicable_reason: >-
      No exponent is claimed. The map is still filled for this one curve.
  predictions:
    - metric: >-
        symmetric difference of the factor-degree multisets of psi_5 at
        [1]P and at [2]P
      direction: lower
      minimum_effect: exactly 0
    - metric: >-
        symmetric difference of the factor-degree multisets of the
        shifted polynomials psi_5(x - x([1]P)) and psi_5(x - x([2]P))
      direction: higher
      minimum_effect: at least 1 when the two x-coordinates differ
  minimal_test:
    design: >-
      Build psi_5 from A = 2 and B = 3 over F_13. Factor it once.
      Choose P as above and compute [2]P by the group law. Factor
      psi_5 again from (A, B) alone and compare degree multisets. Then
      factor the two shifted polynomials and compare those multisets.
      Do not run Pollard rho and do not build a factor base.
    controls:
      - The two unshifted polynomials, built separately from (A, B), are identical as polynomials. Otherwise the run is invalid.
      - The least non-residue twist is factored and stored, and it is not used as the primary multiset.
      - If x(P) equals x([2]P), the shift control is undefined and the unshifted comparison is refused.
      - A supersingular trace, divisible by 13, is a failed setup.
    required_metrics:
      - degree_multiset_k1
      - degree_multiset_k2
      - shifted_symmetric_difference
      - x_P
      - x_2P
      - trace
  falsification_conditions:
    - The unshifted degree multisets differ.
    - x(P) differs from x([2]P) and the shifted multisets agree.
    - No eligible P exists.
    - The curve is singular or supersingular.
  confounders:
    - Factor order in the printed factorisation is not part of the multiset. Sorting the degrees is required.
    - A quadratic twist can change rational torsion without changing j. The twist arm is recorded and is not the primary comparison.
  interpretation_limits:
    - Equality of the two multisets says the meter did not read k. It is not a theorem that no torsion statistic can read k.
    - No discrete logarithm is computed. The exponent 1/2 is unchanged.
    - The scope is this one curve at p = 13.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The irreducible-factor degrees of psi_5 over F_p are a function
        of the curve coefficients alone. Replacing Q = [k]P by [k']P
        does not change them. This imitates the fact that a division
        polynomial is defined from A and B. It is not a claim that every
        torsion-derived statistic ignores k.
      rigorous_support: >-
        KR-RHO-13bf67, opened, bounds generic algorithms and does not
        mention division-polynomial factor degrees. KR-RHO-755e35,
        opened, says isogeny walks do not change the group-structure
        class of weakness and does not mention this multiset.
      validation_plan: >-
        At this one curve, compare the two unshifted multisets and the
        two shifted multisets. If the unshifted multisets differ, H1 is
        false for this implementation. If the shifted multisets agree
        while the x-coordinates differ, refuse the comparison. No second
        prime is claimed.
  target_complexity:
    time_exponent: >-
      One degree-12 factorisation at p = 13. The generic-group exponent
      1/2 is unchanged.
    memory_exponent: O(1) coefficients
    best_known: >-
      KR-RHO-13bf67, opened, gives the square-root generic bound.
      KR-RHO-755e35, opened, says an isogeny walk does not reach a new
      class of weakness. This factorisation beats neither.
    hidden_overhead: >-
      No o(1) term. The test is one polynomial.
    tradeoff_note: >-
      No time-memory tradeoff.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-13bf67
      - KR-RHO-755e35
      - KR-IC-5931ee
      - KR-IC-5a43e5
    nearest:
      - ref: KR-RHO-13bf67
        provenance: internal
        relation: orthogonal
        delta: >-
          The opened row is a square-root lower bound for generic
          algorithms. This idea runs no algorithm on a group element.
          The numeric distance to that bound is the whole exponent 1/2,
          which is not claimed. The new quantity is one degree multiset
          at p = 13, predicted equal at k = 1 and k = 2.
      - ref: KR-IC-5a43e5
        provenance: internal
        relation: orthogonal
        delta: >-
          The opened row is the summation-polynomial framework. This
          idea does not form S_m and does not decompose a point over a
          factor base. The distance is the whole index-calculus
          exponent, which is not claimed.
  dominated_by: >-
    Pollard rho, at the square-root exponent in KR-RHO-13bf67, dominates
    any reading of this factorisation as an attack. KR-RHO-755e35 already
    rules out hiding a class-invariant weakness behind an isogeny. The
    degree multiset does not beat either baseline.
  sota_delta: >-
    No exponent is derived. The quantitative delta is the symmetric
    difference of two degree multisets, predicted equal to 0, at the
    prime 13. The generic-group exponent stays 1/2.
