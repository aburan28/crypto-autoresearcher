idea:
  id: IDEA-20260816-26ef21
  question_id: RQ-SHATHREE-cd2cb2
  added: '2026-08-16'
  title: 'Before any frontier claim, calibrate the instrument: build a certificate-first round-reduced
    Keccak collision harness, then sweep its budget over four orders of magnitude with everything
    else frozen and report whether the reachable round count moves at all, which discriminates a budget-limited
    frontier from a structure-limited one'
  class: tooling
  claim: '(A) THE DISCRIMINATION IS THE DELIVERABLE. RQ-SHATHREE-cd2cb2 poses instrument-versus-object
    as a target: vary solver budget with everything else fixed and report whether reachable round
    count moves. That question has a precise operational form nobody in this repository has built
    the apparatus for. This contract builds it: a frozen encoding, a pinned solver version, declared
    seeds, a declared wall-clock ceiling, and a budget ladder spanning 10^4 to 10^8 solver conflicts,
    run at round counts r = 1, 2, 3, 4 for all four digest sizes. (B) CERTIFICATE-FIRST OR NOTHING.
    Every claimed collision is emitted as the literal message pair, in hex, and re-verified by hashlib
    -- an implementation independent of the pure-Python one used inside the search. A search result
    with no verifying pair is recorded as a search event, never as a collision. A run that finds nothing
    is recorded as a BUDGET OUTCOME about a solver at a stated budget and is never negative mathematical
    evidence, per AGENTS.md rule 3. (C) THE MEASURED QUANTITY. For each (round count, digest size),
    the smallest budget at which a verified pair is produced, and the shape of the success-probability-versus-budget
    curve. A budget-limited frontier predicts the reachable round count increases as budget increases,
    roughly log-linearly; a structure-limited frontier predicts a sharp ceiling that four orders of
    magnitude of budget does not move. These predict differently and the difference is directly observable
    at r = 1..4, which is well below anything of security interest. (D) NOT CLAIMED. No attack, no
    new collision, no improvement on anything, and nothing about round counts beyond those actually
    reached. It is NOT claimed that a failure at r = 4 says anything about whether a collision at
    r = 4 exists -- the opposite is stated explicitly, and the record''s value depends on that discipline
    being kept. No published attack is reproduced or compared against, because this program has not
    read one; the contract measures its OWN harness, which is the only honest baseline available here.
    Nothing about full 24-round SHA-3.'
  mechanism: 'STAGE 1: pin the FIPS 202 implementation and validate against hashlib across all digest
    sizes and several message lengths, so a spurious ''collision'' cannot come from a broken permutation.
    STAGE 2: build a round-reduced sponge exposing r as a parameter, with the round constants taken
    as the FIRST r of the 24 (and, as a declared secondary arm, the LAST r), because which window
    is used changes the object and leaving it implicit is the classic silent variable. STAGE 3: encode
    the r-round collision condition as CNF over the two message blocks with the digest-equality constraint,
    using a declared Tseitin encoding of chi; freeze the encoder and hash the CNF so the encoding
    cannot drift between budget rungs. STAGE 4: run pysat with a pinned Cadical version at conflict
    budgets 10^4, 10^5, 10^6, 10^7, 10^8, with 20 independent seeds per rung, per r, per digest size.
    STAGE 5: for every SAT answer, decode to a literal message pair, re-verify with hashlib''s round-reduced-equivalent
    path (recomputed by the pure-Python implementation, cross-checked at r = 24 against hashlib),
    and emit the pair in the run record; discard any unverified SAT answer as an encoder bug and halt.
    STAGE 6: run the null arms. REFUTATION: the apparatus fails if a SAT answer ever fails certificate
    verification, or if r = 1 collisions are not found instantly at the smallest budget, which would
    show the harness cannot find what must be trivially findable.'
  novelty_status: unverified
  novelty_screen:
    method: 'Ran `grep -ril "keccak\|sha-3\|sha3" ledger/ knowledge/ experiments/ docs/` from the
      repository root: four proposals (IDEA-20260805-5194f9, IDEA-20260807-c4f1fc, IDEA-20260809-ce875b,
      IDEA-20260809-7f2d9c), one question (RQ-SHATHREE-cd2cb2), GOAL-SHA3-001 and five sibling goals,
      two decisions, and a block of KN-LIT files. Then per-noun counts over ledger/proposals/ and
      ledger/hypotheses/: translation-invariant (4, all ECDLP/AES), symmetry-decay (0), "internal
      differential" (0), sponge (2), "invariant subspace" (2), "chi step" (0), "rate/capacity" (0),
      capacity (20), padding (15), "birthday bound" (38). Read RQ-SHATHREE-cd2cb2 in full, GOAL-SHA3-001,
      KN-TECH-080 in full, docs/inventor-protocol.md sections 1-8, and headers of KN-TECH-066, KN-TECH-073,
      KN-TECH-074, KN-TECH-056. Additionally checked the blacklist against this entry: grepped ledger/proposals
      for `solver budget`, `SAT solver` and `budget ladder`, and read the RQ-INSTR-f8faa0 framing
      referenced in the anti-duplication list.'
    results: No Keccak search harness, CNF encoding or collision certificate exists anywhere in experiments/
      or ledger/. The blacklist forbids audits of THIS PROGRAM's cost model, machine variance and
      single-machine timing (15+ proposals under RQ-INSTR-f8faa0) and forbids generic 'run a SAT solver
      harder' proposals with no object; this entry is deliberately neither. Its measured object is
      the SHAPE of the success-versus-budget curve at fixed r, its purpose is the instrument-versus-object
      discrimination named as a target by RQ-SHATHREE-cd2cb2 itself, and it reports no timing as evidence
      of anything -- budget is counted in solver conflicts, which is machine-independent, precisely
      to avoid the RQ-INSTR-f8faa0 territory.
    verdict: 'UNVERIFIED. Nothing is asserted about external literature or about any published attack,
      none of which this program has read. NEW relative to this repository: no symmetric-primitive
      search harness with certificate verification exists at all. ASSEMBLED FROM KNOWN PARTS: CNF
      encoding of a permutation is standard practice; the budget-ladder discrimination is taken verbatim
      from RQ-SHATHREE-cd2cb2''s third target; the certificate-first rule is docs/claims-and-verification.md.
      The contribution claimed is a calibrated instrument plus a curve shape, not any cryptanalytic
      result.'
  object_first_candidate:
    tracked_object: The success-probability-versus-budget curve P(success | conflicts, r, digest size)
      of a frozen encoding under a pinned solver -- i.e. the INSTRUMENT's response surface, followed
      as budget is varied with every other variable held fixed. The object is a property of the apparatus,
      not of Keccak, and the entry says so plainly.
    lossiness: 'The curve discards everything about which message pair is found, the internal trail,
      and the solver''s search path, retaining only a Bernoulli outcome per (budget, seed). That discard
      is compatible with the operation being studied -- multiplying the budget -- because the discrimination
      between a log-linear rise and a hard ceiling depends only on success frequency, not on which
      witness appeared. It is genuinely lossy: two harnesses with identical curves may find completely
      different pairs by completely different routes, and the entry claims nothing about the route.'
    propagation: One step of the target operation here is multiplying the conflict budget by ten.
      Under a budget-limited regime that step is predicted to raise the maximum r with any success
      by roughly a constant increment per decade; under a structure-limited regime it is predicted
      to raise success probability at r values already reachable while leaving the maximum reachable
      r pinned. The two propagation laws are distinguishable with five rungs and twenty seeds.
    survival_score: Reported as the maximum r at which any verified certificate is produced at the
      largest budget, and the maximum r at the smallest budget; the DIFFERENCE between those two integers
      is the entry's headline number. A difference of zero across four decades is the structure-limited
      signature; a difference growing with each decade is the budget-limited signature.
  null_object_control: 'NULL-CONST: the identical harness, encoding, solver, budget ladder and seeds,
    run against Keccak-f[1600] with the 24 round constants replaced by fresh random constants of matched
    support shape (100 schedules). NULL-PERM: the identical harness run against a Keccak-shaped permutation
    whose chi is replaced by a random 5-bit permutation and whose rho offsets are randomised. For
    the FIPS arm to mean anything about SHA-3 specifically, its maximum-reachable-r and its curve
    shape must differ from the NULL-CONST distribution; if they coincide, the recorded result is a
    controlled null and the curve is a property of the encoding and the solver, not of the standard.
    The null arms are executed in the same invocation by the same code path with only the permutation
    object swapped, so they cannot be described-but-not-run.'
  discriminated_from:
  - The blacklisted 'audit this program's cost model, machine variance or single-machine timing' class
    (15+ proposals under RQ-INSTR-f8faa0) -- this contract's budget unit is solver conflicts, which
    is machine-independent by construction, and it reports no wall-clock figure as evidence for anything.
  - The blacklisted 'run a SAT solver harder with no object' class -- the object here is the response
    surface of the instrument, declared in advance, with two competing propagation laws that the ladder
    discriminates.
  - The companion zero-search contracts in this bucket -- those compute exact algebra and never start
    a solver; this one is the only entry that runs a search, and its results are explicitly not admissible
    as evidence about structure.
  - Reproducing a published round-reduced collision -- named as a target by RQ-SHATHREE-cd2cb2 but
    NOT attempted here, because this program has not read the primary text and the RQ's own first
    constraint forbids designing that experiment until the attack is filed as a KN-LIT entry with
    its round count, complexity and certificate format.
  assumptions:
  - The r-round collision condition is faithfully encoded; validated by the r = 1 sanity arm where
    collisions must be found immediately.
  - Solver conflicts are a stable, machine-independent budget unit across rungs and arms.
  - Twenty seeds per cell give enough resolution to distinguish a hard ceiling from a slow rise; this
    is a declared design choice, not a power calculation.
  - The first-r-rounds window is the default object and the last-r-rounds window is a declared secondary
    arm; conflating them would be a silent variable.
  - A failure at any budget is a statement about the solver at that budget and about nothing else,
    per AGENTS.md rule 3.
  predictions:
  - metric: verified certificates found at r = 1 at the smallest budget
    direction: higher
    minimum_effect: 20
  - metric: maximum r with any verified certificate, at 10^8 conflicts minus the same at 10^4 conflicts
    direction: different
    minimum_effect: no pre-commitment on the value; this integer IS the discrimination the contract
      exists to obtain, and pre-committing would prejudge budget-limited versus structure-limited
  - metric: fraction of SAT answers failing certificate re-verification by the independent implementation
    direction: lower
    minimum_effect: 0
  - metric: difference between FIPS and NULL-CONST maximum reachable r at the largest budget
    direction: different
    minimum_effect: no pre-commitment; a zero difference is a legitimate controlled-null outcome and
      is reported as such rather than suppressed
  minimal_test:
    design: 'The cheapest discriminating configuration is SHA3-256 alone, r = 1, 2, 3, budgets 10^4
      and 10^7 only, five seeds per cell -- thirty solver invocations. This already answers the two
      questions that gate everything else. First, does the harness find r = 1 collisions instantly
      with certificates that hashlib verifies? If not, the encoding is wrong and no further budget
      is worth spending. Second, does the maximum reachable r differ between 10^4 and 10^7 conflicts?
      A difference of zero across three orders of magnitude at these tiny round counts is already
      strong evidence that the ceiling in this regime is not set by budget, and a difference of one
      or more is already evidence that it is. The full ladder, all four digest sizes, both round windows
      and the null arms multiply this by roughly 200 but change no design decision. Running the minimal
      version first is mandatory: it is the difference between calibrating an instrument and generating
      expensive noise.'
    controls:
    - 'r = 1 sanity arm: collisions must be found at the smallest budget by every seed, or the harness
      is broken and the run is void.'
    - 'Certificate control: every SAT answer decoded to a literal message pair and re-verified by
      hashlib-validated independent code; any failure halts the run.'
    - 'NULL-CONST: 100 random round-constant schedules of matched support shape, identical harness.'
    - 'NULL-PERM: Keccak-shaped permutation with randomised chi and rho, identical harness.'
    - 'Encoding-freeze control: the CNF file''s SHA-256 is recorded per cell and must be identical
      across all budget rungs for a given (r, digest size), so budget is the only thing that varies.'
    - 'Round-window control: first-r versus last-r round constants as a declared secondary arm.'
    required_metrics:
    - verified certificate count per (r, digest size, budget, seed)
    - maximum r with any verified certificate per budget rung
    - success probability versus budget curve per (r, digest size)
    - certificate re-verification failure count (must be zero)
    - CNF hash per cell and CNF size in clauses and variables
    - conflicts consumed and solver termination reason per invocation
    - NULL-CONST and NULL-PERM maximum-reachable-r distributions
  falsification_conditions:
  - The r = 1 arm fails to produce verified certificates at the smallest budget -- the harness is
    falsified, not SHA-3.
  - Any SAT answer fails independent certificate re-verification, which indicates an encoder bug and
    halts the run.
  - The CNF hash differs across budget rungs within a cell, meaning budget was not the only variable.
  - 'The maximum reachable r is identical across FIPS, NULL-CONST and NULL-PERM at every budget --
    controlled null: the curve measures the encoding and the solver, not the permutation.'
  - No cell at any budget produces a certificate, including r = 1, which voids the entire apparatus.
  confounders:
  - CNF encoding choices (Tseitin variants for chi, symmetry breaking, restart policy) can move the
    reachable round count by more than the budget does, which is exactly why the encoding is frozen
    and hashed per cell.
  - Solver heuristics are adaptive, so conflicts are not a perfectly uniform unit of work across arms;
    the contract reports conflicts, propagations and decisions so a reviewer can see if the unit drifted.
  - A ceiling caused by CNF size exceeding memory would masquerade as a structural ceiling; clause
    counts and memory are recorded per cell to expose this.
  - Twenty seeds is small, so a success probability near the resolution limit could read as a hard
    zero; the contract reports exact counts rather than fitted probabilities.
  - Publication-style reporting of the maximum reached r invites reading a null result as an impossibility
    claim, which AGENTS.md rule 3 forbids and which the record states explicitly at every reporting
    site.
  interpretation_limits:
  - A failure to find a collision at any r is a budget outcome about a solver and an encoding, never
    evidence that no collision exists at that r.
  - The measured curve characterises this harness. Another encoding or another solver could produce
    a different ceiling, and the contract cannot rule that out.
  - Round counts reached here are tiny and carry no security meaning whatsoever; nothing extrapolates
    to 24 rounds.
  - The contract deliberately does not reproduce any published attack, so it establishes no external
    baseline and must not be cited as agreeing or disagreeing with one.
  target_complexity:
    time_exponent: 'No attack exponent is claimed. Budget is declared, not derived: 10^4 to 10^8 solver
      conflicts per invocation, roughly 200 cells times 20 seeds, capped by a declared wall-clock
      ceiling.'
    memory_exponent: No attack memory exponent is claimed. Solver memory is bounded per invocation
      and recorded; CNF sizes are reported in clauses and variables per cell.
    best_known: No incumbent is challenged. Within this repository the incumbent for the instrument-versus-object
      question in this bucket is nothing at all; externally the incumbent round-reduced results are
      described but unread in RQ-SHATHREE-cd2cb2's provenance block and are deliberately not compared
      against.
    hidden_overhead: 'Almost all of it is human: encoding chi correctly into CNF, and resisting the
      pull to report a maximum reached round count as though it meant something. The lower-order term
      is the encoding itself, which can dominate the budget effect entirely -- the single largest
      reason this contract freezes and hashes the CNF.'
  dominated_by: 'n/a (no result claimed). Frontier axes checked explicitly: time is a declared budget
    rather than a derived cost, memory is a solver artifact, and there is no data/query axis in an
    unkeyed setting. The contract produces no attack row, so it holds no frontier position; any certificate
    it emits at r <= 4 is dominated on time by trivial generic search at those round counts and the
    record says so.'
  sota_delta: no attack; conceptual/measurement contribution only. The deliverable is a calibrated
    harness plus a response-surface curve; any certificates produced at r <= 4 are of no cryptanalytic
    interest and are emitted solely as instrument-validity evidence.
  estimated_cost:
    implementation: high
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: 'That a correct CNF encoding is built and r = 1 certificates verify: 0.8,
    with encoding bugs the dominant risk. That the ladder cleanly separates budget-limited from structure-limited
    behaviour at r <= 4: 0.45, because at such small round counts everything may be reachable at every
    budget, collapsing the discrimination. That the FIPS arm separates from NULL-CONST: 0.2 -- I expect
    random constants to behave the same at these round counts, and I expect a controlled null. That
    the harness is reused by later contracts in this bucket: 0.7, which is the main reason to build
    it despite the modest prior on its headline discrimination.'
