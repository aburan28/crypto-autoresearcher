  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked: [KR-RHO-13bf67, KR-RHO-38be82, KR-RHO-fb88e6, KR-RHO-037e22, KR-RHO-5b1c0a, KR-RHO-cd86f5, KR-IC-73db3f]
    nearest:
      - ref: KR-RHO-38be82
        provenance: retrieved
        relation: adjacent
        delta: >-
          Tag tracing is a small-b prefix projection under MULTIPLICATION in
          F_p^*; this record measures the same statistic under EC ADDITION
          and predicts saturation, which is the quantitative reason the
          technique has no EC analogue.
      - ref: KR-RHO-fb88e6
        provenance: retrieved
        relation: adjacent
        delta: >-
          The negation map is the exact block system this record's P1 row
