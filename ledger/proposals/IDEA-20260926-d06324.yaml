      RQ-CERTBIN-836ce2 instrument note, not a proposal"; the round-2 card
      lists it as a candidate and this record files it as an ordinary proposal
      because it carries a pre-registered discriminating reading (E-MIX
      against E-PARTIAL) and two exact calibration rows the corpus has never
