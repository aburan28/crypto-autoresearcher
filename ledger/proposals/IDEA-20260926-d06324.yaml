idea:
  id: IDEA-20260926-d06324
  question_id: RQ-CERTBIN-836ce2
  added: '2026-09-26'
  status: proposed
  approved_by: null
  title: >-
    THE (L, b) METER FIXTURE ON BINARY-CURVE ADDITION: loss and branching of
    coordinate projections (top-k prefix in polynomial and normal basis,
    Hamming-weight class, trace bit) measured on the CERTBIN cells and their
    Koblitz siblings against a relabelled Z/NZ and a random bijection, with
    two exact calibration rows (x-coordinate b = 2, halving-trace bit b = 1),
    so every "bucket the residual" proposal has a measured control to beat
  class: control

  claim: >-
    CEILING FIRST. No cost claim, no exponent, no attack. Representation class
    R1 of RQ-ECDLP-623a32 (the abscissa in a polynomial or normal F_2-basis);
    the attack stage the fixture serves is RELATION DECOMPOSITION and any
    proposed collision structure that keys on part of a coordinate. Target
    arity: none; the fixture is a control and cannot move a row.

    THE GAP. IDEA-20260802-002 defined an executable meter for the
    lossy-projection test, loss L(pi) = log2 of the mean fibre size and
    branching b(pi) = the mean number of distinct values of pi(A + B) over a
    pair of fibres, with four calibration answers; H-TLD-f4c8ba consumes it
    and is recorded as BLOCKED without it; no evidence record in this ledger
    cites either (grep, this session), so the meter has never been run on any
    curve, let alone a binary one. The review of IDEA-20260922-faa8d2 derived
    that the top-k prefix of x(A + B) is not a function of the prefixes of
    x(A), x(B) and predicted b near 2^k, and asked for exactly this fixture
    "once ... so every later bucket-the-residual proposal has a measured
    control to beat". This record is that fixture, on binary curves, with the
    Koblitz-specific projections added.

    THE PROJECTIONS, ON G = E(F_{2^n}) (the full group of order 4l or 2l) and
    on its prime-order subgroup. (P0) identity, expected (L, b) = (0, 1).
    (P1) x-coordinate: fibre {P, -P} with -P = (x, x + y); exactly two values
    x(A + B), x(A - B); expected (1, 2) EXACTLY on every arm. (P2) the
    halving-trace bit t(P) = Tr(x(P)) + Tr(a). On an ordinary binary curve
    y^2 + xy = x^3 + a x^2 + b a point P is in 2E iff Tr(x(P)) = Tr(a)
    (recalled halving criterion, re-derived at setup by exhaustive check on
    the toy group), so t is the homomorphism E -> E/2E when the 2-Sylow is
    cyclic, and the meter must read b = 1 EXACTLY on G (the one lossy
    projection Theorem C of KN-FIND-ffe1df permits on the composite group,
    capacity one bit, IDEA-20260926-136bd3's exact filter) and L = 0 (constant)
    on the odd-order subgroup. (P3) top-k prefix of x in the polynomial basis.
    (P4) top-k coordinates of x in a normal basis (the representation ECC2K-130
    itself uses; Frobenius is a rotation). (P5) Hamming-weight class of x in
    the normal basis, bucketed into 2^k quantile classes; this is
    Frobenius-invariant, it is the statistic of IDEA-20260926-b6cc43's
    Hamming-ball factor base and of Bailey et al.'s distinguished-point
    predicate, and it is the one projection in the list that the Koblitz
    structure could conceivably favour. (P6) the composite (t, top-k prefix),
    whose b must equal the prefix's b (the exact bit adds nothing to
    branching), a consistency row.

    THE TWO READINGS, PRE-REGISTERED. E-MIX: every inexact projection (P3, P4,
    P5) reads b within [0.6, 1.0] of the random-bijection saturation value on
    every curve arm, so the EC addition law mixes every coordinate in every
    basis and the only sum-compatible information on G is the cofactor's
    (consistent with KN-FIND-ffe1df Theorem C on the subgroup and with
    136bd3's 2-bit capacity on G). E-PARTIAL: some inexact projection reads b
    below 0.3 x saturation on a curve arm while the random bijection reads
    saturation, i.e. a coordinate projection propagates partially under
    addition, which is the object faa8d2's bucketed residual and every
    prefix-keyed collision structure would need. The record's honest prior on
    E-PARTIAL is below 0.05; the value of running it is the calibration rows
    and the measured obstruction, which the closure standard of
    docs/inventor-protocol.md section 4 requires as a number, not a verdict.

    WHY THE TAG-TRACING ROW MATTERS. KR-RHO-38be82 records that in F_p^*
    partial information of a product is predictable from partial information
    of the factors (tag tracing decides most rho steps without a full
    multiplication). That is precisely "a prefix projection with small b
    under the group law". The meter run on EC addition, with the Z/NZ
    (additive, b about 2 from the carry) control beside it, is the
    measurement that says by how much the elliptic law differs from the
    multiplicative one on that axis; a b near saturation is the quantitative
    reason tag tracing has no EC analogue.

  mechanism: >-
    OBJECT FRAME. Representation R1 (x in polynomial or normal basis); the
    operation set Sigma under which each projection is tested is the FULL
    translation action on G (A + B over all pairs), deliberately, because the
    meter's purpose is to measure branching under the action that is closed
    for deterministic lossy objects; every inexact projection here is
    therefore a BRANCHING object (Class II of IDEA-20260806-c5d183) by
    construction and the record says so. The exact rows (P1, P2) are the
    block systems of the negation subgroup and of the index-2 subgroup 2E,
    which is why they read b = 2 and b = 1. LOSSY-PROJECTION TEST: this record
    IS the test, executed; each projection discards the fibre (L bits), and
    the discard is Sigma-compatible only if b is small; the meter reports
    whether it is. THE ONE OPEN NUMBER: b(P5) on the Koblitz arms against
    saturation, and b(P4) against b(P3) (whether the basis matters at all).
    OFF-LIMITS COMPONENTS: F1 (the group law as walk step) and F6 (Frobenius
    orbit, in P5's rotation invariance) enter as components; nothing is added
    to either; F2 is not used.

  novelty_status: unverified

  origin:
    kind: generator_search
    date: '2026-09-26'
    scope: >-
