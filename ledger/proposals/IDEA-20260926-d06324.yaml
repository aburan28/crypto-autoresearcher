    overlap_review: >-
      Grepped ledger/ and knowledge/ for "(L, b)", "branching meter", "b(pi)",
      "lossy-projection", "tag tracing", "prefix", "bucket". Nearest, read:
      IDEA-20260802-002 (defines the meter and its four calibration answers on
