  citation_note: >-
    No web search. The halving criterion is recalled and is replaced by an
    exhaustive check at setup; every other reference is internal.

  assumptions:
    - >-
      Points of G are enumerated exhaustively (2^17 or 2^19 abscissae via
      curve.py count_by_trace and lift_x); sampling is used only inside fibre
      pairs.
    - >-
      A normal element at n in {17, 19} is found by the standard independence
      test in pure Python; no Gaussian-normal-basis condition is needed.
    - >-
      Saturation for a fibre pair with s sampled sums is 2^k (1 - exp(-s /
      2^k)); the random-bijection control measures it rather than assuming it.
    - >-
      OFF-LIMITS COMPONENTS DECLARED: F1 and F6 as components only.

  proof_search_map:
    bottleneck: >-
      Whether any coordinate projection on a binary curve propagates under
      addition with branching materially below random mixing; if none does,
      every prefix-keyed collision or bucketed-residual construction is
      priced at saturation and the closure carries a measured number.
    baseline_embedding:
      parameter_slice: >-
        The exact rows P0, P1, P2 and the two controls are the frozen fixture;
        P1 must read (1, 2) to the digit and P2 must read b = 1 on G and L = 0
        on the subgroup, or the meter is broken.
      reproduction_check: >-
        Symbolic for P1 (two preimages each, two sums x(A + B), x(A - B));
        exhaustive for P2 on G (every pair A, B with t(A + B) = t(A) + t(B));
        the random bijection against the saturation formula within 5 percent.
    observation_collision:
      observable: The triple (projection, L, b) per arm.
      distinct_preimage_search: >-
        A low b could come from (i) genuine partial propagation, (ii) a fibre
        so small that saturation itself is low (L too small), or (iii) a
        projection that is secretly exact (a block system). (ii) is separated
        by reporting b relative to the measured saturation at the same fibre
        sizes; (iii) by the Z/NZ arm (a block system reads b = 1 there too)
        and by checking the projection's kernel against the subgroup lattice
        of G (only 2E and 4E exist at cofactor 4).
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the projection fixed (top-k prefix) and vary the forgotten
          structure: polynomial basis, normal basis, relabelled Z/NZ, random
          bijection; the b readings across the four are the fibre.
        predicted_gain: >-
          Decides whether the basis is a live variable for branching (it is
          predicted not to be) at zero modelling cost.
    quantifier_order: >-
      FOR the named cells and the named projections, the measured (L, b) are
      as reported; E-MIX is a statement about THIS list on THESE cells, not
      about all projections; E-PARTIAL is EXISTS one projection in the list
      with b below 0.3 x saturation.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On E(F_{2^17}) and E(F_{2^19}), ordinary and Koblitz, the six
        projections have the measured (L, b) table; P1 and P2 are exact; the
        inexact ones sit at [ratio] of saturation." Nothing about n = 131
        beyond the algebraic identity of the addition law, and nothing about
        projections outside the list.
      nearby_object_control: >-
        The relabelled Z/NZ with the integer-prefix projection is the object
        where partial propagation DOES exist (b about 2 from the carry); the
        meter must read it as such or it cannot see partial propagation at
        all.
    proof_obligations:
      - claim: P1 reads exactly (1, 2) on every arm.
        responsibility: baseline
      - claim: P2 reads b = 1 exactly on G and is constant on the odd-order subgroup, after the halving criterion is verified exhaustively.
        responsibility: correctness
      - claim: The random-bijection arm reproduces the saturation formula within 5 percent at every k.
        responsibility: correctness
      - claim: The Z/NZ prefix arm reads b in [1.5, 2.5].
        responsibility: feasibility
      - claim: Sampled b is within its bootstrap interval of the exhaustive b on one small fibre pair per projection.
        responsibility: runtime
    not_applicable_reason: null

  predictions:
    - metric: (L, b) of P1, x-coordinate
      direction: same
      minimum_effect: 'exactly (1, 2) on every arm; any deviation is an instrument defect'
    - metric: b of P2, halving-trace bit, on G
      direction: same
      minimum_effect: 'exactly 1 on the ordinary and Koblitz arms with even order; L = 0 on the odd-order subgroup'
    - metric: b of P3, P4, P5 relative to the random-bijection saturation at matched fibre sizes, k in {5, 7}
      direction: same
      minimum_effect: 'E-MIX iff all in [0.6, 1.0]; E-PARTIAL iff any below 0.3; MIXED otherwise, reported'
    - metric: b of the integer prefix on the relabelled Z/NZ
      direction: lower
      minimum_effect: 'in [1.5, 2.5] (carry), demonstrating the meter sees partial propagation where it exists'
    - metric: b(P4) / b(P3) (normal versus polynomial basis prefix)
      direction: same
      minimum_effect: 'within [0.8, 1.25]; a basis effect on branching is not expected'
    - metric: b(P6) / b(P3)
      direction: same
      minimum_effect: 'within [0.9, 1.1] (the exact bit adds no branching)'

  minimal_test:
    design: >-
      CELLS. (a) RC-1: n = 17, f = t^17 + t^3 + 1, A = 97044, B = 126251,
      #E = 4 x 32603. (b) The n = 19 cell: f = t^19 + t^5 + t^2 + t + 1,
      A = 46693, B = 306147, #E = 2 x 261823. (c) Koblitz n = 19: y^2 + xy =
      x^3 + 1 over the same field, #E = 4 x 130873 (hand arithmetic of
      IDEA-20260926-4b65e3; recount at setup by count_by_trace). (d) Koblitz
      n = 17: y^2 + xy = x^3 + x^2 + 1, #E = 2 x 65587 (hand arithmetic of
      IDEA-20260926-89886c; recount). Group: all of E (for P2's b = 1) and the
      prime-order subgroup (for L(P2) = 0 and for every other projection).
      PROJECTIONS: P0-P6 as in the claim, k in {5, 7} for P3-P6. CONTROLS:
      relabelled Z/NZ with N = #E and the same prefix, weight and parity maps
      on the integer label (generic-group control; a group-structure claim IS
      made, that only the cofactor is sum-compatible); random bijection of
      x-values composed with each projection (null object, saturation);
      ordinary versus Koblitz arms at matched n (the Koblitz control). SAMPLING.
      32 ordered fibre pairs per projection and arm, 4096 sampled (A, B) per
      pair from a recorded PCG64 stream; one small fibre pair per projection
      enumerated exhaustively as the sampling check. INSTRUMENT.
      experiments/EXP-CERTBIN-e94b27/impl/gf2n.py and curve.py (n = 17; a
      general-n variant of gf2n at n = 19 is about 30 lines or is lifted from
      EXP-CERTBIN-060020/impl); new code about 150 lines (normal-element
      search, projections, fibre index, sampled b, bootstrap). Nothing
      missing. PROCEDURE. (1) Enumerate G per cell; verify the halving
      criterion exhaustively; verify P1 symbolically and on 10^3 pairs.
      (2) For each arm, projection and k: compute L exactly, sample b, report
      the bootstrap 95 percent interval and the saturation value at the same
      fibre sizes. (3) Run the Z/NZ and random-bijection arms identically.
      (4) Tabulate; read E-MIX / E-PARTIAL by the pre-registered bands.
      METRICS (units): L (bits); b (count of distinct outputs, mean over fibre
      pairs); b_over_saturation (dimensionless); bootstrap interval. OUTCOME
      TABLE. POSITIVE (E-MIX with all calibration rows exact): the fixture is
      accepted and its saturation rows become the control every bucketed or
      prefix-keyed proposal must beat; the closure "no coordinate projection
      in this list propagates partially under EC addition on these cells"
      is recorded WITH its numbers. NEGATIVE, i.e. the interesting reading
      (E-PARTIAL on any curve arm with the random bijection at saturation and
      Z/NZ at about 2): a coordinate projection with partial propagation
      exists; route to review-breakthrough before any interpretation and
      before any k-tree or bucket proposal cites it. ARTIFACT (P1 not (1, 2),
      P2 not exact, random bijection off saturation by more than 5 percent, or
      sampled b outside the exhaustive check's interval): the meter is broken;
      nothing is read. FALSIFICATION THRESHOLD, FIXED NOW: E-MIX is falsified
      iff any of P3, P4, P5 reads b below 0.3 x saturation at either k on any
      curve arm with the two controls passing. COST (estimate): implementation
      low; compute minutes of pure Python (about 4 arms x 6 projections x 2 k
      x 32 pairs x 4096 additions, order 6 x 10^6 additions, plus the group
      enumerations).
    controls:
      - 'Random bijection composed with each projection (null object; must read saturation within 5 percent).'
      - 'Relabelled Z/NZ with N = #E, same maps on the integer label (generic-group control; prefix must read about 2, parity must read 1).'
      - 'Ordinary versus Koblitz arms at matched n (the Koblitz control for any Frobenius reading of P5).'
      - 'Exact calibration rows P0, P1, P2 (blocking).'
      - 'Exhaustive-versus-sampled b on one fibre pair per projection (sampling check).'
    required_metrics:
      - 'L and b per (arm, projection, k) with bootstrap intervals'
      - 'saturation per (arm, projection, k) from the random-bijection control'
      - 'b_over_saturation per curve arm'
      - 'Z/NZ prefix b and parity b'
      - 'halving-criterion exhaustive check result per cell'

  falsification_conditions:
    - 'E-MIX falsified iff any inexact projection reads b < 0.3 x saturation on a curve arm with both controls passing.'
    - 'The meter is falsified (run void) iff P1 is not exactly (1, 2) or P2 is not exactly b = 1 on G after the halving criterion is verified.'
    - 'The basis-irrelevance prediction is falsified iff b(P4)/b(P3) falls outside [0.8, 1.25] at both k with intervals excluding 1.'

  confounders:
    - >-
      Small fibres at large k make saturation itself small; b is always read
      relative to the measured saturation at matched fibre sizes, never
      absolutely.
    - >-
      The point at infinity and the 2-torsion point (x = 0) are excluded from
      fibres; on the full group G the x = 0 fibre is a singleton.
    - >-
      Two projections with the same (L, b) are not the same object (the
      triple is a deliberate quotient, H-TLD-f4c8ba); the record reports per
      projection and never pools.

  interpretation_limits:
    - 'Toy tier, four curves, two n; the addition law is the same at n = 131 but nothing numerical transfers.'
    - 'A control, not a mechanism; E-MIX moves no number and closes only the listed projections on the listed cells, with numbers.'
    - 'No factor base is proposed; KN-OPEN-020 is not touched.'

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Saturation law.) For a projection with no sum-compatible structure,
        the number of distinct pi(A + B) over s sampled pairs from two fibres
        is distributed as balls-in-bins into 2^k cells, mean 2^k (1 - exp(-s /
        2^k)).
      rigorous_support: >-
        Exact for a uniformly random map; the random-bijection control
        measures it rather than assuming it.
      validation_plan: >-
        SAMPLE: the random-bijection arm at every (k, s) used. COMPARISON:
        measured mean against the formula, within 5 percent. TAIL: the minimum
        over the 32 pairs against the binomial lower tail. TRANSFER: none.

  heuristic_note: >-
    P1 and P2 are exact; H1 is the only heuristic and it is measured by the
    null arm before any curve reading is compared to it.

  target_complexity:
