idea:
  id: IDEA-20260808-d935d1
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-MCEQ-fcb504
  goal_id: GOAL-MCE-001
  title: Does matrix code equivalence inherit the small-hull weakness that makes permutation
    equivalence easy? A rank-stratum counting test that decides, before any algorithm is written,
    whether a Leon-style distinguished-set attack can exist at all
  class: measurement
  claim: 'Leon''s algorithm and its successors attack permutation and monomial code equivalence
    by computing the set of minimum-weight codewords - a group-invariant, small, canonically
    defined set - and matching it across the two codes. The rank-metric analogue for matrix
    code equivalence is the set of minimum-RANK codewords, which is genuinely invariant under
    GL_m x GL_n. CLAIM: whether that route can exist is decided by one counting formula, not
    by experiment. For a uniformly random k-dimensional code in F_q^{m x n}, the expected
    number of rank-at-most-r codewords is about q^{k - (m - r)(n - r)}, so the smallest nonempty
    stratum r_min is the least r with k >= (m - r)(n - r), and the stratum''s size is about
    q^{k - (m - r_min)(n - r_min)}. A Leon-style attack requires that size to be subexponential
    AND the stratum to be findable; the counting formula says whether the first condition
    can hold at a given (m, n, k, q), and the answer is a property of the parameters alone.
    SECOND CLAIM: at square parameters with k about m = n, the formula gives r_min about n
    - sqrt(k) and a stratum of size about q^{k - (n - r_min)^2}, which is exponentially large
    - so the distinguished-set route is blocked for a COUNTING reason, and the correct successor
    object is the stratum''s algebraic equation (C1-09''s determinantal locus), not its point
    set.'
  mechanism: 'The dimension formula for determinantal varieties gives codim{rank <= r} = (m
    - r)(n - r) in the ambient space of matrices; intersecting with a random k-dimensional
    linear subspace and counting projective points gives the estimate above. Nothing here
    is new mathematics - it is the standard expected-count heuristic - and that is the point:
    the decision about whether a whole attack family can exist is available at zero cost from
    a formula the literature already contains, and this program has never written it down
    for matrix codes. The measurement is needed only to confirm the heuristic count is accurate
    at small q, where the expected-count estimate is known to be poor.'
  why_not_a_renamed_known_approach: 'It is not Leon''s algorithm nor Beullens''s improvement
    of it - it is a feasibility gate for their rank-metric analogue, computed before the analogue
    is written. It is not MinRank cryptanalysis: MinRank asks how hard finding one low-rank
    element is, this asks how MANY there are, which is a different quantity and the one that
    decides whether matching is possible.'
  predictions:
  - observable: Empirical count of rank-at-most-r codewords in random matrix codes.
    metric: log_q(count) versus the prediction k - (m - r)(n - r), at toy (m, n, k) and q
      in 4..31.
    predicted: Agreement within about 0.5 in log_q for r above r_min; systematic over-count
      at r = r_min, where the estimate is least reliable.
  - observable: r_min and stratum size at square parameters with k about m = n.
    metric: r_min, and log_q of the stratum size.
    predicted: Stratum size exponential in n, blocking a point-matching attack. If instead
      it is polynomial at some realistic parameter shape, that shape is a weak-parameter class
      and the finding is immediately security-relevant.
  - observable: Rigidity of the stratum as a combinatorial object - the automorphism group
      of the incidence structure between rank-r_min codewords and their kernels.
    metric: Size of the automorphism group at toy parameters where the stratum is enumerable.
    predicted: Trivial (rigid) for random codes, which means IF the stratum were small the
      matching would be immediate; so the counting formula, not rigidity, is the true obstruction.
  minimal_test: At (m, n, k) in {(3,3,3), (4,4,4), (4,4,6), (5,5,5)} and q in {4, 7, 11, 16,
    31}, enumerate rank strata by brute force over the projective code space, compare counts
    with the formula, and compute the incidence automorphism group at the smallest nonempty
    stratum. Then evaluate the formula symbolically at the parameter shapes used by deployed
    matrix-code schemes and report r_min and stratum size. Budget order 10^2 core-seconds.
  controls:
  - DEGENERATE-CODE CONTROL - exclude and separately report codes with a common kernel vector,
    which inflate low-rank strata and would otherwise masquerade as a finding.
  - EQUIVALENT-PAIR CONTROL - verify the stratum sizes agree exactly across an equivalent
    pair (they must, since rank is invariant); disagreement is an implementation bug.
  - RANDOM-INCIDENCE NULL - compare the measured automorphism group size against that of a
    random incidence structure with the same parameters; rigidity that is no greater than
    the null's is not evidence of structure.
  confounders:
  - Expected-count heuristics for determinantal intersections are unreliable at small q and
    near the threshold r_min - exactly where the answer matters.
  - Deployed schemes may not use uniformly random codes; the formula applies to the random
    model and its applicability must be stated per scheme.
  - Enumeration cost grows as q^{k-1}, so toy sizes are genuinely tiny and extrapolation is
    by formula, not by fit.
  falsification_conditions:
  - Measured counts diverge from the formula by more than a factor q at r_min, so the gate
    is not trustworthy and the feasibility question stays open.
  - Some realistic parameter shape yields a polynomial-size smallest stratum, which reopens
    the Leon-style route and is the security-relevant positive.
  - The incidence structure is NOT rigid, in which case even a small stratum would not determine
    (A, B) and the route dies for a second, independent reason.
  interpretation_limits: A counting gate says a family of attacks cannot work for a stated
    reason at stated parameters; it says nothing about other families and nothing about any
    deployed scheme's security. Toy enumeration is toy. AGENTS.md rule 7 binds and the honest
    output is a formula evaluation plus a small-scale accuracy check.
  assumptions:
  - The code is uniformly random in F_q^{m x n}, which must be checked per scheme.
  - Rank is the invariant of interest, i.e. the equivalence is the two-sided GL_m x GL_n action
    rather than a semilinear extension.
  heuristic_assumptions:
  - id: HA-1
    statement: For a uniformly random k-dimensional subspace of F_q^{m x n}, the number of
      projective points of rank at most r is concentrated around q^{k - 1 - (m - r)(n - r)}
      times the appropriate Gaussian-binomial factor, uniformly for r where the exponent is
      at least 1.
    rigorous_ingredient: The rank-at-most-r locus has codimension (m - r)(n - r) and known
      degree (the Giambelli-Thom-Porteous formula gives it exactly), so the point count over
      F_q is controlled by Lang-Weil once the intersection is proper.
    distribution_imitated: Lang-Weil point counting for a variety of known dimension and degree
      - the algebraic-geometry analogue of the smoothness-distribution theorems the target
      profile's exemplar uses.
    validation_route: TOY SCALE, LABELLED AS SUCH - brute-force enumeration at the (m, n,
      k, q) grid above, empirical CDF of log_q(count) against the prediction, with the r =
      r_min cell reported separately because that is where Lang-Weil's error term is largest
      relative to the main term.
    tail_checks: Report the minimum and maximum observed count at r_min over 10^3 random codes
      and compare against the predicted spread; a heavy lower tail (codes with no rank-r_min
      codeword) is the failure mode that matters for an attacker.
  target_complexity:
    time_exponent: No attack. The gate outputs log_q(stratum size) = k - (m - r)(n - r), which
      is the exponent any point-matching attack would have to enumerate. At square parameters
      with k about n that exponent is Theta(n), i.e. exponential, and the gate's whole content
      is that this number is available without writing the attack.
    memory_exponent: 'Equal to the stratum size for a matching attack - which is precisely
      why the gate matters under this slice''s memory-charging discipline: a distinguished-set
      attack must STORE the set.'
    best_known_baseline: The published matrix-code-equivalence algorithms, whose complexity
      is NOT recorded in this corpus and is not asserted here.
    hidden_overhead_disclosure: The formula is an expectation; an attacker needs the stratum
      to be non-empty for the SPECIFIC instance, and the lower tail of the count is not controlled
      by the expectation.
    time_memory_tradeoff: A matching attack is pure memory-for-nothing - it stores the whole
      stratum and gains only the matching. Under full cost that is the worst possible profile,
      and the gate makes the point quantitatively.
  sota_delta: Converts "can a Leon-style attack exist for matrix codes" from an open research
    question into a one-line evaluation at any parameter shape, and supplies the reason the
    answer is no at square parameters. It beats nothing; it prevents a wasted campaign, which
    is the honest claim.
  dominated_by: Very likely dominated by the matrix-code-equivalence literature, which certainly
    counts low-rank codewords (any birthday-style algorithm must), and by the standard determinantal-variety
    point-count results. RECALLED FROM MEMORY, UNVERIFIED, no web access. Inside this corpus,
    nothing addresses matrix codes at all, so nothing dominates there.
  estimated_cost: Implementation LOW (enumeration plus a formula). Compute LOW.
  recommended_priority: medium
  honest_prior_of_survival: About 0.9 that the gate is computed correctly; about 0.15 that
    it identifies a parameter shape where the route is open; about 0.2 that it is genuinely
    new rather than a restatement of a standard count.
  novelty_status: unverified
  novelty_screen: Same screen as C1-09 (EXISTING_PROPOSALS, EXISTING_HYPOTHESES, REJECTED,
