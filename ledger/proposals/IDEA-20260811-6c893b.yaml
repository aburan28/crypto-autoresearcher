idea:
  id: IDEA-20260811-6c893b
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  title: >-
    IS SEMAEV-SPECIAL ALSO ARITHMETICALLY SPECIAL? Each degeneration j is a FIXED
    rational number, so it defines ONE curve over Q whose reductions are a family
    indexed by p; run the twelve special-j curves against the SATO-TATE
    semicircle over every prime below 2^20 and against the Hurwitz-weighted
    discriminant distribution, with the pre-registered prediction that they are
    INDISTINGUISHABLE from generic - the outcome that decouples the algebraic and
    arithmetic halves of this lane empirically, while a detected deviation would
    be the first evidence anywhere in the campaign that Semaev geometry and CM
    structure are coupled
  class: measurement

  object: >-
    OBJ-SDD-REDUCTION, the family {E_j mod p : p prime} for each of the six fixed
    rational degeneration j and their quadratic twists. The tracked object is the
    ARITHMETIC INVARIANT SEQUENCE of that family - normalised Frobenius trace
    a_p/(2 sqrt(p)), fundamental discriminant D_0(p), conductor f(p), class
    number h - as p varies, with j held fixed. This is the transpose of every
    other object in this lane: the campaign has always fixed p and varied the
    curve; here the curve is fixed over Q and p varies.

  resource: >-
    R3 (End(E) as a ring) crossed with R2 (curve equation). The record consumes
    the arithmetic of a fixed global curve, which is exactly the resource
    RQ-JINV-8fc13a names and which no record in the lane has yet used in the
    p-varying direction. H-ENDO-001 admissibility: no endomorphism acts on any G;
    no non-scalar action is required or claimed.

  claim: >-
    (A) THE SETUP THAT MAKES THIS POSSIBLE AT ALL. Because the six degeneration
    loci are defined over QQ (IDEA-20260811-a7c1df), each carries a single
    rational j-value, hence a single elliptic curve over Q up to quadratic twist,
    hence a canonical family of reductions. Concretely: for j0 not in {0,1728},
    the curve E_{j0} : y^2 = x^3 + 3 j0 (1728 - j0) x + 2 j0 (1728 - j0)^2 has
    j-invariant j0 [standard construction, TO BE VERIFIED symbolically rather
    than trusted], and its quadratic twists exhaust the F_p-forms of j0 at each
    p. So "the special-j curve at p" is a well-defined sequence, not a fresh
    random draw at each p, and that is precisely what makes a distributional test
    possible.
    (B) THE PRE-REGISTERED NULL PREDICTION, WITH ITS THEOREM. By
    IDEA-20260811-df6c0f, five of the six j are non-integral rationals and are
    therefore not CM j-invariants; assuming the sixth also is not, all six E_{j0}
    are non-CM curves over Q. The Sato-Tate theorem for non-CM elliptic curves
    over Q [Barnet-Lamb, Geraghty, Harris, Taylor and predecessors - CITATION TO
    BE VERIFIED IN THE RUN RECORD, not asserted from memory] then states that
    theta_p = arccos(a_p / (2 sqrt(p))) equidistributes with respect to
    (2/pi) sin^2(theta) d theta. PREDICTION: the empirical distribution of
    theta_p over all primes p < 2^20 of good reduction, for each of the six
    curves, matches the semicircle law with a Kolmogorov-Smirnov statistic inside
    the 95% band for the sample size, and the six curves are mutually
    indistinguishable.
    (C) THE SECOND, SHARPER ARM - THE DISCRIMINANT DISTRIBUTION. Sato-Tate
    constrains a_p but not directly the FUNDAMENTAL discriminant D_0 in
    D = a_p^2 - 4p = D_0 f^2, which is what this lane actually cares about, since
    small |D_0| is the lane's arithmetic notion of "special". PREDICTION: for each
    of the six curves, the empirical distribution of |D_0| and of the conductor f
    over p < 2^20 is indistinguishable from that of a control set of ten random
    fixed non-CM curves over Q, tested by a two-sample Kolmogorov-Smirnov and by
    a chi-square on the small-|D_0| bins. In particular, the COUNT of primes at
    which a special-j curve has |D_0| among the nine class-number-one
    discriminants must not exceed the control's count by more than the
    pre-registered band.
    (D) WHAT EACH OUTCOME MEANS - THE TWO EXPLANATIONS THIS DISCRIMINATES.
      OUTCOME 1 (predicted): both arms null. Then the Semaev degeneration divisor
        carries NO arithmetic content, the two halves of the lane identified in
        IDEA-20260811-df6c0f are empirically as well as theoretically
        independent, and the campaign may stop looking for a bridge between them.
        This is the outcome I expect and it is worth having, because right now
        the possibility of a bridge is unexamined rather than excluded.
      OUTCOME 2: a genuine deviation - the special-j curves systematically favour
        small |D_0|, or their theta_p deviate from the semicircle. Then either
        (a) one of the six is secretly CM after all, which contradicts limb (A)
        of IDEA-20260811-df6c0f and would be caught immediately by inspecting
        WHICH curve deviates, or (b) there is a real coupling between summation-
        polynomial degeneration and endomorphism structure, which would be the
        most important finding this lane has produced and would demand its own
        contract.
    The two outcomes are distinguished before the data exists, which is what the
    quality bar requires.

  mechanism: >-
    The degeneration condition alpha a^3 + beta b^2 = 0 is a condition on the
    coefficients over QQ. The CM condition is a condition on End(E). A fixed
    non-CM curve over Q has, at each p of good reduction, an endomorphism order
    determined by a_p, and a_p varies with p according to Sato-Tate - i.e.
    essentially at random. So the mechanism predicting OUTCOME 1 is simply that
    nothing connects the two conditions, and the experiment is the test of that
    nothing. The mechanism that would produce OUTCOME 2 is not currently known,
    which is stated honestly: this record cannot name a mechanism for its own
    positive outcome, and would treat a positive as an anomaly requiring
    explanation before any use, exactly as DEC-20260810-d70ece required for the
    S_4 outlier.

  novelty_status: adaptation
  novelty_note: >-
    Sato-Tate is a cited theorem, not a contribution. The Hurwitz-weighted
    discriminant enumeration is already used in this campaign
    (EV-ICINV-6b6264, all 253 traces at p = 4001 against the mass formula, zero
    disagreements). The ADAPTATION is applying them in the p-varying direction to
    a curve family that only exists because the degeneration loci are defined
    over QQ - a family the campaign did not know it had until the S_4
    stratification. Corpus grep finds no p-varying arithmetic study of any fixed
    curve in this program. External literature NOT checked.
  not_a_duplicate_of: >-
    NOT IDEA-20260807-a3d644, whose |D_0| ladder 3,4,7,8,11,... varies the
    discriminant at fixed p by choosing curves; this record fixes the curve and
    varies p, which is the opposite design and produces a distribution rather
    than a ladder. NOT IDEA-20260807-a6fb2a, which studies the SIZE of j in F_p
    and correctly concludes reduction destroys height; this record studies the
    ARITHMETIC of the reduced curve, which reduction does not destroy. NOT
    IDEA-20260811-3e08e0, which is a census at fixed p.

  assumptions:
  - >-
    The six char-0 j are as derived in IDEA-20260811-a7c1df and are non-CM as
    argued in IDEA-20260811-df6c0f. If either fails, this record's Sato-Tate
    hypothesis fails and the arm must be restated for a CM curve, where the trace
    distribution is the DIFFERENT, known CM distribution (a_p = 0 for half the
    primes) - a fact the contract must anticipate rather than discover.
  - >-
    The standard j-to-curve construction is correct; verified symbolically as
    step 0.
  - >-
    Primes of bad reduction and primes dividing the denominators are excluded and
    counted, not silently dropped.

  proof_search_map:
    bottleneck: >-
      The step whose removal changes the conclusion is the non-CM classification
      of the six j. Everything downstream is a distributional comparison that is
      only meaningful once the applicable theorem (Sato-Tate versus the CM law)
      is fixed.
    baseline_embedding:
      parameter_slice: >-
        j = 0 is the exact baseline slice, and it is a POSITIVE control of a rare
        and valuable kind: j = 0 IS CM, so its trace distribution must FAIL the
        Sato-Tate test and must instead match the CM law, in which a_p = 0 for
        the primes inert in Q(sqrt(-3)) - about half of them.
      reproduction_check: >-
        Run the identical pipeline on y^2 = x^3 + 1 (j = 0) and on
        y^2 = x^3 + x (j = 1728) and confirm the pipeline reports a clear
        Sato-Tate REJECTION and the CM signature. A pipeline that cannot tell a
        CM curve from a non-CM one cannot certify that the six are non-CM-like,
        and every null it produces would be void.
    observation_collision:
      observable: >-
        The empirical distribution of (theta_p, D_0(p), f(p)) over p.
      distinct_preimage_search: >-
        PERFORMED AND POSITIVE, and it is handled. Two non-isogenous non-CM
        curves over Q have, by Sato-Tate, the SAME limiting theta distribution -
        so the observable cannot distinguish two generic curves, which is exactly
        why the null prediction is stated as indistinguishability rather than as
        a discovery. The separating condition is that a CM curve DOES have a
        different distribution, which is what the j = 0 baseline exploits.
    constructive_transforms:
    - transform: observable_fiber
      proposed_object: >-
        Hold the observable (Sato-Tate class) fixed and vary the forgotten
        structure (which weight-12 form produced the j). If OUTCOME 1 holds, all
        six sit in the same fibre as ten random curves, and the intrinsic
        invariant distinguishing them is purely the coefficient combinatorics -
        which is the finding.
      predicted_gain: >-
        Converts "we saw nothing" into "the fibre is exactly the generic one",
        which is a positive statement about the object and survives citation.
    quantifier_order: >-
      FOR EACH of the six fixed rational j, the sequence indexed by p of
      normalised traces equidistributes with respect to the semicircle. The
      quantifier order matters: the claim is per-curve over p, NOT per-p over
      curves. A per-p claim would be a claim about six numbers and would be
      meaningless; this record must never report a p-by-p statistic as evidence.
    method_ceiling:
      strongest_certifiable_claim: >-
        That over the tested prime range the special-j reductions are
        statistically indistinguishable from generic non-CM reductions on the
        stated statistics, at the stated power. It CANNOT certify that no
        arithmetic coupling exists - only that none of the tested size does - and
        the record must state the detectable effect size rather than claiming
        absence.
      nearby_object_control: >-
        A CM curve (j = 0) is the nearby object where the desired conclusion
        fails, and it is run as the blocking baseline. A method that cannot
        separate j = 0 from a random non-CM curve has not identified the
        load-bearing structure and its nulls are void.
    proof_obligations:
    - claim: The six E_j are non-CM
      responsibility: baseline
    - claim: Sato-Tate applies and the empirical fit is within band
      responsibility: success_probability
    - claim: The |D_0| distributions match the control
      responsibility: correctness
    - claim: The test has stated power against a stated alternative
      responsibility: interface

  predictions:
  - metric: sato_tate_ks_statistic_per_special_curve
    direction: different
    minimum_effect: >-
      Inside the two-sided 95% Kolmogorov-Smirnov band for the realised sample
      size, for ALL SIX curves. One curve outside is a flag; two or more outside
      is a positive requiring explanation before any use.
  - metric: sato_tate_ks_statistic_for_j0_baseline
    direction: different
    minimum_effect: >-
      OUTSIDE the 95% band, decisively - the j = 0 curve must be REJECTED by the
      Sato-Tate test. If it is not rejected, the instrument lacks power and every
      null in the record is void.
  - metric: two_sample_ks_on_log_absD0_special_versus_control
    direction: different
    minimum_effect: >-
      p-value above 0.05 for all six against the pooled ten-curve control, with
      the achieved minimum detectable effect reported explicitly (a null with
      unreported power is not a null).
  - metric: count_of_primes_with_absD0_in_the_nine_class_number_one_values
    direction: different
    minimum_effect: >-
      Within a Poisson 95% interval of the control's rate. An excess of more than
      3 standard deviations at any one of the six curves is the pre-registered
      positive.
  - metric: fraction_of_primes_with_a_p_equal_zero
    direction: different
    minimum_effect: >-
      Below 0.01 for all six special curves (non-CM), and near 0.5 for the j = 0
      baseline (CM). This single statistic separates the two regimes crisply and
      is the cheapest sanity gate in the design.

  minimal_test:
    design: >-
      (0) Verify the j-to-curve construction symbolically. (1) Build the six
      special curves over Q and their quadratic twists, plus the j = 0 and
      j = 1728 CM baselines and ten random non-CM control curves with small
      coefficients. (2) For every prime p below a declared bound - 2^20 as the
      target, with 2^16 as the budget fallback - and every curve, compute a_p by
      SEA or by exhaustive counting at small p, excluding bad reduction. (3)
      Compute theta_p, D = a_p^2 - 4p, its factorisation into D_0 f^2, and h
      where cheap. (4) Run the four tests above, pre-registered, with the
      alternative and the achieved power stated. (5) Report per-curve, never
      pooled across the six, and report the twists separately (their a_p are
      negated, so theta is reflected and the semicircle is symmetric - a free
      internal consistency check).
    controls:
    - >-
      C-CM-BASELINE (BLOCKING, positive control). j = 0 and j = 1728 must be
      REJECTED by the Sato-Tate test and must show the a_p = 0 signature. This is
      the planted signal DECOMPOSITION.md L14 demands, and it is free.
    - >-
      C-RANDOM-CURVE (null object of the same shape). Ten fixed random non-CM
      curves over Q with small coefficients, put through the identical pipeline.
      The special six must be indistinguishable from these, and the CONTROL's own
      spread defines the band.
    - >-
      C-TWIST. Each curve's quadratic twist is run separately; a_p negates, so
      the theta distribution reflects. Any asymmetry beyond the reflection is an
      implementation error.
    - >-
      C-DECAY. The canonical artifact tell: the KS statistic must DECAY like
      1/sqrt(number of primes) as the prime bound increases. Run at three bounds
      (2^12, 2^16, 2^20 or the fallback ladder) and confirm decay. A statistic
      that does not decay as the sample grows is an artifact of the pipeline, not
      a property of the curve - this is the single most important control in the
      record and it is cheap.
    required_metrics:
    - a_p_per_curve_per_prime
    - theta_p_empirical_cdf_per_curve
    - ks_statistic_and_band_per_curve_per_prime_bound
    - D0_and_conductor_distribution_per_curve
    - count_absD0_in_class_number_one_set_per_curve
    - fraction_a_p_zero_per_curve
    - bad_reduction_prime_count_per_curve

  lossy_projection_answer: >-
    The projection is (fixed curve over Q, prime p) -> (a_p, D_0, f). It is
    drastically lossy - it forgets the whole curve except one integer per prime -
    and it is compatible with the operation that matters here, reduction, because
    a_p is defined for every good p and determines the isogeny class of the
    reduction exactly (Tate). Crucially, THIS PROJECTION IS NOT THE ONE THAT
    FAILED AT j = 0: the committed failure was support -> Groebner time, a
    projection onto a COST functional. This record projects onto an ARITHMETIC
    functional, which is exactly the quantity RQ-JINV-8fc13a's decision target is
    written about, and it makes no cost claim whatsoever. So the j = 0
    lossy-projection precedent does not apply and the record does not need to
    survive it.

  t5_reachability_answer: >-
    NOT ENGAGED, and could not be: no curve here is reachable from any other,
    because they lie over different primes. The record produces no minimiser and
    proposes no walk. If OUTCOME 2 fired - special-j curves systematically having
    small |D_0| - then T5 would become live in an unusual form: an ATTACKER
    CHOOSING p could arrange it, which is a curve-generation concern rather than
    an attack, and the record would hand that to the scope audit
    IDEA-20260807-51675e rather than claim it.

  null_object: >-
    C-RANDOM-CURVE (ten fixed non-CM curves over Q, identical pipeline) is the
    matched null; C-CM-BASELINE (j = 0, j = 1728) is the planted positive;
    C-DECAY is the artifact tell. All three are required and the first two are
    blocking.

  falsification_conditions:
  - >-
    The j = 0 baseline is NOT rejected by the Sato-Tate test. The instrument has
    no power, the run is INVALID rather than negative, and no null may be
    reported.
  - >-
    The KS statistic fails to decay with the prime bound in C-DECAY. The
    statistic is an artifact of the pipeline and every conclusion is void.
  - >-
    Two or more special curves fall outside the Sato-Tate band. The null
    prediction is falsified; before any interpretation, check whether the
    deviating curves are the ones whose non-CM status rests on the table lookup
    rather than on the integrality argument.
  - >-
    The small-|D_0| count for any special curve exceeds the control rate by more
    than 3 sigma. Arithmetic coupling is indicated and must be replicated at a
    second prime range before it is described as anything.
  - >-
    Any two of the six special curves are found to be Q-isogenous to each other
    or to a control curve. The samples are not independent and the pooled
    comparisons must be redone.

  confounders:
  - >-
    Twist choice. The Q-curve at a given j is defined only up to quadratic twist,
    and twisting negates a_p. The semicircle is symmetric so theta statistics are
    unaffected, but D = a_p^2 - 4p is also unaffected, so D_0 statistics are
    twist-invariant - this must be verified rather than assumed, and the C-TWIST
    arm does it.
  - >-
    Small primes. For p below a few hundred the semicircle is a poor
    approximation and D_0 statistics are dominated by boundary effects. The
    contract must declare a lower prime cut and report results with and without
    it.
  - >-
    Multiple comparisons. Six curves times four tests times three prime bounds is
    72 tests; the contract must pre-register the family-wise correction, or every
    null is one lucky rejection away from being reported as a finding.
  - >-
    Bad reduction primes differ per curve (the six have different conductors), so
    the effective sample sizes differ; the bands must be computed per curve, not
    once.

  interpretation_limits:
  - >-
    A null here does NOT prove independence of the two divisors; it bounds the
    coupling by the detectable effect size, which must be stated.
  - >-
    Nothing here bears on solving cost. The record makes no cost measurement and
    claims none.
  - >-
    claim_tier toy. The prime range is chosen for feasibility, not for
    cryptographic relevance, and no transfer to crypto-scale p is claimed.

  heuristic_assumptions:
  - id: H1
    statement: >-
      For each fixed non-CM elliptic curve E/Q, the normalised Frobenius angles
      theta_p equidistribute on [0, pi] with respect to (2/pi) sin^2 theta.
    rigorous_support: >-
      This is a THEOREM, not a heuristic, for elliptic curves over Q without CM
      (Sato-Tate; Barnet-Lamb-Geraghty-Harris-Taylor and predecessors). CITATION
      TO BE VERIFIED IN THE RUN RECORD with a specific reference; it is used here
      as an external structural ingredient and must not be paraphrased from
      memory in the evidence record.
    validation_plan: >-
      Sample: all good primes below 2^20 (fallback 2^16) for each of six special
      curves, ten controls and two CM baselines. Comparison distribution: the
      semicircle law, by empirical CDF and Kolmogorov-Smirnov. Tail check: the
      count of primes with |theta - pi/2| exceeding 1.3 (the extreme-trace tail)
      against the semicircle's own tail probability, since bulk agreement with a
      tail failure is the classic sign of a truncated or biased sampler. Transfer
      assumption stated explicitly: convergence rates in Sato-Tate are slow, so a
      null at 2^20 bounds coupling only at the effect size the sample supports.
  - id: H2
    statement: >-
      Conditional on a_p, the factorisation D = a_p^2 - 4p = D_0 f^2 has D_0
      distributed as for a random integer of that size subject to the
      congruence conditions - i.e. the conductor f is typically small and
      |D_0| is typically within a constant factor of 4p.
    rigorous_support: >-
      The Deuring/Hurwitz-Kronecker class number formula ties class sizes to
      H(4p - t^2) exactly, and this campaign has verified the mass formula on all
      253 traces at p = 4001 with zero disagreements (EV-ICINV-6b6264). The
      distributional statement imitated is the classical Gauss/Siegel average
      order of class numbers.
    validation_plan: >-
      Sample: the same prime set. Comparison: the empirical distribution of
      log f against the control curves' distribution, two-sample KS. Tail check:
      the largest observed conductor per curve against the control maximum. This
      heuristic is used only to set expectations for arm (C) and is not
      load-bearing for arm (B).

  target_complexity:
    time_exponent: NONE CLAIMED.
    memory_exponent: NONE CLAIMED.
    best_known: >-
      0.886*sqrt(N) group operations, O(1) memory (KN-TECH-001, KN-TECH-006);
      automorphism-discounted on CM curves (KN-TECH-018).
    hidden_overhead: Not applicable; no asymptotic claim.
    tradeoff_note: >-
      Not applicable to a claim, but relevant to the run: point counting over
      78498 primes below 2^20 for 18 curves is embarrassingly parallel and
      memory-trivial, so the budget is wall-clock only.

  dominated_by: >-
    Every row of the attack frontier (parallel rho with distinguished points,
    BSGS, kangaroo, index calculus) dominates this on time, memory and queries;
    checked against each. This record produces no solver.
  sota_delta: ZERO on every axis. Distributional measurement only.

  estimated_cost:
    implementation: medium
    compute: medium
  compute_note: >-
    Dominated by SEA point counting at the upper end of the prime range.
    Fallback ladder 2^12 / 2^16 / 2^20 is declared in advance so that a budget
    stop yields a smaller but VALID sample rather than an infrastructure failure;
    the achieved bound is reported and the bands recomputed for it.

  recommended_priority: medium
  expected_value: >-
    MEDIUM-HIGH, AND HONESTLY LIKELY TO BE NULL - which is the point. It is the
    only test in the batch that could detect a coupling between the algebraic and
    arithmetic halves of this lane, and it has a genuine positive control (the
    CM baselines) which most of the campaign's null tests have lacked. Its main
    risk is multiple comparisons producing a spurious flag; the pre-registered
    correction and the C-DECAY tell are there for exactly that. I would run it
    AFTER IDEA-20260811-df6c0f, since the non-CM classification decides which
    theorem the test is against, and a run that got that backwards would compare
    a CM curve to the wrong law and report a spectacular false positive.
