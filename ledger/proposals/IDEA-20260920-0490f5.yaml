  title: >-
    Formalize THM_QUOTIENT_DESCENT1 — translations descend through the degree-2
    negation quotient iff 2T = O
  class: theory
  claim: >-
    A translation τ_T on an elliptic curve descends through the canonical
    degree-2 negation / x-coordinate quotient (and therefore through any
    PGL_2-conjugate of that quotient) if and only if 2T = O. This is the
    descent lemma that closes the "which translations give larger group
    actions on the x-line" question from the Galbraith thread. Proof is in
    research/THM_QUOTIENT_DESCENT1.md; a Lean statement stub is in
    research/THM_QUOTIENT_DESCENT1.lean for the coordinator to mint as a
    formal goal. Not an ECDLP algorithm.
  mechanism: >-
    Elementary fibre argument: τ_T sends x-fibres {P,-P} to fibres iff 2T = O;
    conversely every 2-torsion translation induces a Möbius map on P^1. Lean
    formalization binds the stub to the project's elliptic-curve library.
