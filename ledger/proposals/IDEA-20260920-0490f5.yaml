idea:
  id: IDEA-20260920-0490f5
  question_id: RQ-ECDLP-002
  added: '2026-09-20'
  status: proposed
  approved_by: null
  title: Degree-2 quotient descent lemma -- only E[2] translations act on x-type summation polynomials
  class: theory
  claim: >-
    Galbraith's "larger group actions" slide asks whether groups bigger than
    (Z/4Z)^{m-1} x| S_m can act on the point-decomposition problem and answers
    "unlikely" without a proof. A three-line lemma closes the x-coordinate case:
    for any degree-2 quotient phi: E -> P^1 given by an involution iota =
    [-1] o tau_S with S in E[2] (every x-type coordinate is of this form), a
    translation tau_T descends through phi if and only if 2T = O. So the
    translation symmetry group of ANY summation polynomial built on a degree-2
    quotient is a subgroup of E[2]^{m-1} x| S_m, of order at most 4^{m-1} m!
    when full 2-torsion is rational. Larger torsion can only enter through a
    quotient of degree > 2 (whose summation polynomials have correspondingly
    higher degree) or through curve automorphisms. This turns the slide's
    "unlikely" into a scoped theorem and a Lean target.
  mechanism: >-
    tau_T o iota = iota o tau_T iff for all P: -(P+S)+T = -(P+T)+S iff 2T = 2S = O.
    Descending through phi = E/<iota> requires exactly this commutation. Hence
    the group of translations acting on phi-values is E[2]; combined with S_m
    and the parity constraint (an even number of translations preserves the
    sum), the acting group is a subgroup of E[2]^{m-1} x| S_m.
  novelty_status: unverified
  origin:
    kind: user_supplied_idea
    date: '2026-09-20'
    scope: Theory complement to IDEA-20260918-7a11c2 (torsion-equivariant quotient-map benchmark).
    overlap_review: >-
      IDEA-20260918-7a11c2 measures quotient maps phi and PGL2 conjugates; this
      record supplies the lemma that bounds which translations can act for
      deg phi = 2, so the benchmark's degree-versus-symmetry trade is stated
      rather than guessed. Kohel INDOCRYPT 2012 (cited on the slide) is not
      frozen; it may already contain this observation, hence unverified.
  citations:
    - ref: Galbraith, Algorithms for the ECDLP, ECC 2015 slides ("Larger group actions?")
      provenance: recalled
      claim: '"To do this we''d need either a totally new idea, or to have addition by a torsion point which is linear with respect to the coordinate system. It seems unlikely that one can work with larger groups."'
    - ref: Kohel, INDOCRYPT 2012 (as cited on the slide)
      provenance: recalled
      claim: Referenced on the slide for this question; not read; may contain the lemma.
    - ref: Faugere-Gaudry-Huot-Renault, J. Cryptology 2014
      provenance: recalled
      claim: The (Z/2)^{m-1} x| S_m action, and a (Z/4Z)^{m-1} x| S_m action for curves with rational 4-torsion via a suitable coordinate -- the lemma predicts that coordinate is not a degree-2 quotient by [-1] o tau_S.
  citation_note: Recalled; freeze Kohel 2012 and FGHR 2014 and check whether either states the lemma before claiming anything beyond "formalized here".
  assumptions:
    - E an elliptic curve over a field of characteristic not 2 (the char-2 case needs the same argument with the appropriate involution).
    - x-type coordinate means a degree-2 map to P^1 that factors through E/<iota> for an involution iota of the stated form.
  proof_search_map:
    bottleneck: None for the lemma; the open part is the FGHR 4-torsion coordinate, which the lemma says must be a higher-degree or automorphism-based quotient.
    baseline_embedding:
      parameter_slice: >-
        Weierstrass x on y^2 = x(x^2+ax+b), where translation by (0,0) acts as
        x -> b/x and descends; versus a 3-torsion translation on a Hessian
        model, which descends to no degree-2 quotient.
      reproduction_check: Verify both by direct computation in Sage on a toy curve.
    observation_collision:
      observable: Which translations descend, by computation, versus the lemma.
      distinct_preimage_search: Not applicable.
    constructive_transforms: []
    quantifier_order: >-
      For all E, all S in E[2] and all T in E, tau_T descends through the
      quotient by [-1] o tau_S iff 2T = O.
    method_ceiling:
      strongest_certifiable_claim: The lemma, formalized, plus the corollary bounding the acting group for degree-2 quotients.
      nearby_object_control: The FGHR 4-torsion construction, to be located in the frozen text and classified.
    proof_obligations:
      - claim: Lean statement and proof in the CryptoResearch namespace.
        responsibility: formal
      - claim: Sage check on the two baseline examples.
        responsibility: correctness
  predictions:
    - metric: lemma_formalized
      direction: higher
      minimum_effect: Lean proof compiles; Sage examples agree.
  minimal_test:
    design: Write research/THM_QUOTIENT_DESCENT1.md with the proof; Sage check; Coordinator mints a formal/targets task.
    controls:
      - The two baseline examples.
    required_metrics:
      - lean_build_status
      - sage_example_agreement
  falsification_conditions:
    - A translation by T with 2T != O found to commute with the involution (impossible; would indicate a definitional error).
  confounders:
    - Conflating descent of a translation with descent of an automorphism composed with a translation.
  interpretation_limits:
    - Says nothing about quotients of degree > 2 or about automorphism actions; those are IDEA-20260918-7a11c2's measurement.
  heuristic_assumptions: []
  heuristic_note: None.
