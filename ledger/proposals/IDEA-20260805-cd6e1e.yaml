      joint radial-angle-filter estimator rewrite and outer reoptimization."
      ePrint 2026/1465 ITSELF IS NOT READ -- every factor is relayed through
      this internal record.
    - >-
      coordination/goals/GOAL-MLKEM-001/batches/BATCH-003/tasks/TASK-20260723-215/triage_report.yaml,
      READ: its bounded follow-up for 2026/1465 asks to "Determine whether the
      reported 1.5x--8x reduction-probability factors alter only a local
      constant, an asymptotic sieve exponent, or a reoptimized end-to-end ML-KEM
      lattice-attack estimate under one named cost model" and sets the stop rule
      "Stop once exponent versus constant is proved". LEMMA 1 IS THE MISSING
      HALF OF THAT STOP RULE: once "constant" is proved, the lemma bounds the
