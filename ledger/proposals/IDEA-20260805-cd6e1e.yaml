idea:
  id: IDEA-20260805-cd6e1e
  question_id: RQ-MLKEM-001
  goal_id: GOAL-MLKEM-001
  added: '2026-08-05'
  title: >-
    The share-forcing identity: one line of algebra that converts every
    "constant-factor" cryptanalytic claim into a falsifiable statement about
    which fraction of the total cost it must occupy, applied to the three lanes
    GOAL-MLKEM-001 left open at its budget

  class: theory

  claim: >-
    A cryptanalytic improvement that divides ONE component of a cost model by a
    factor c, without enlarging the feasible parameter domain, cannot reduce the
    OPTIMIZED total by more than log2(c) bits; and a claimed reduction of Delta
    bits FORCES that component's share of the total, at the new optimum, to be
    at least f = (1 - 2^-Delta) / (1 - 1/c). When that forced share exceeds 1 the
    claim is arithmetically impossible and needs no measurement, no estimator, no
    literature and no compute to refute. Both statements are elementary and are
    proved in full below; neither appears anywhere in this repository, and the
    program has repeatedly spent batches on questions this identity answers in
    one line. GOAL-MLKEM-001 closed at its six-batch budget carrying three lanes
    whose entire content is a constant factor, all three explicitly deferred
    rather than decided: EV-MLKEM-003's finding that "no current BATCH-002 cost
    row changes without a coherent joint radial-angle-filter estimator rewrite
    and outer reoptimization" for pair-reduction factors recorded as 2.25x
    global and 1.5x local (headline range 1.5x-8x); the archived
    hybrid_batch_cvp lane, "up to 3.4x speedup over the matched primal
    implementation ... up to 5x at dimensions no greater than 210", with
    standardized_values recorded as null; and IDEA-20260722-001's orbit
    amortisation. Against the campaign's own 2-bit materiality bar the identity
    decides all three at zero compute: 2.25x forces f = 1.35, IMPOSSIBLE; 1.5x
    forces f = 2.25, IMPOSSIBLE; 3.4x forces f = 1.0625, IMPOSSIBLE; 5x forces
    f = 0.9375, possible only if batch-CVP is 93.75 per cent of the optimized
    total; 8x forces f = 0.857. That is a closure with a named obstruction, an
    argument, and forward guidance naming exactly which improvement classes the
    obstruction does NOT cover -- the inventor-protocol section 4 standard,
    reached without a single run.

  object_first_candidate:
    tracked_object: >-
      THE COST FUNCTIONAL T: Theta -> R_{>0} AND ITS COMPONENT DECOMPOSITION,
      tracked through the operation "improve one component by a factor" to the
      operation "reoptimize over Theta". The tracked quantity is the pair
      (component share f at the optimum, factor c), and the object followed is
      not any attack but the MAP from local improvements to global bit gains.
      This is a method-ceiling object in the sense of inventor protocol section
      8 audit 4: it bounds what a whole class of methods could prove under ideal
      tuning, before any of them is built.
    established_families_off_limits: >-
      Off-limits as the primary lens: every attack family. Primal, dual,
      hybrid, decryption failure, side channel, algebraic, class-group,
      quantum-sieve. This proposal proposes no attack in any of them and takes
      none as its lens; it takes the COST MODEL as its object, which is the axis
      the session brief records as the least attacked in this program (131 of 229
      evidence records make a cost claim, 75 charge wall-clock only, and
      dominated_by is absent from 95 of 131).
    newness_score: >-
      The inequality min T' >= (min T)/c is elementary and is certainly known to
      anyone who has thought about it; NO NOVELTY IS CLAIMED FOR THE
      MATHEMATICS. What is new, and what the corpus demonstrably lacks, is (a)
      the inverted form -- the forced share f = (1 - 2^-Delta)/(1 - 1/c) as a
      one-line admissibility screen -- and (b) its systematic application as a
      pre-compute triage gate. The corpus contains no heuristic record type at
      all and no file with a top-level `heuristic:` key, so it has no place where
      such a screen currently lives.
    testability_score: >-
      Maximal for the mathematics (it is a proof, checkable by reading) and high
      for the applications (each needs one component share, which is either read
      off a published cost decomposition or measured once). The falsifier is
      sharp and is named: exhibit an admissible cost model and an admissible
      subcomponent speedup with a gain exceeding log2(c) and no domain change.
    survival_score: >-
      The bound survives exactly as long as its two hypotheses do: non-negative
      additive components, and an unchanged feasible domain. It dies precisely
      where a speedup ENLARGES the domain -- and locating those cases is the
      most valuable thing the object can do, because they are the improvements
      that can beat the ceiling.

  mechanism: >-
    DERIVED IN THIS RECORD IN FULL. Nothing below is cited to any source.

    SETUP. Let Theta be a finite or compact parameter domain (block size, sample
    count, guessing dimension, code rate, ...). Let T(theta) = sum_{i=1..m}
    C_i(theta) with every C_i(theta) >= 0. Let the improvement replace C_j by
    C_j / c for a fixed c >= 1, leaving every other component and the domain
    unchanged: T'(theta) = T(theta) - C_j(theta) (1 - 1/c).

    LEMMA 1 (CEILING). min_theta T'(theta) >= (min_theta T(theta)) / c, hence
    log2(min T) - log2(min T') <= log2(c).
    PROOF. For every theta, C_j(theta) <= T(theta) because the components are
    non-negative. Hence T'(theta) = T(theta) - C_j(theta)(1 - 1/c) >= T(theta) -
    T(theta)(1 - 1/c) = T(theta)/c. Taking the minimum of both sides over Theta
    preserves the inequality, and min_theta (T(theta)/c) = (min_theta T)/c since
    c is a positive constant. QED. The proof uses only non-negativity and a
    fixed domain; it is insensitive to the shape of T, to how many components
    there are, and to whether the optimum moves.

    LEMMA 2 (SHARE FORCING, THE USEFUL DIRECTION). Let theta* = argmin T' and
    let f = C_j(theta*)/T(theta*) be the improved component's share of the
    UNIMPROVED cost at the NEW optimum. Then the achieved gain in bits is
      Delta = log2(min T) - log2(min T') <= log2( T(theta*) / T'(theta*) )
            = -log2( 1 - f (1 - 1/c) ),
    using min T <= T(theta*). Inverting, a claimed gain of Delta bits requires
      f >= (1 - 2^-Delta) / (1 - 1/c).
    Since f <= 1 by definition, a claim is arithmetically impossible whenever
    (1 - 2^-Delta) / (1 - 1/c) > 1, which is exactly Delta > log2(c), recovering
    Lemma 1 and confirming the two statements are consistent.

    COROLLARY (THE INFINITE-SPEEDUP CEILING). Letting c -> infinity, the gain is
    at most -log2(1 - f). A component that is half the cost buys at most 1.00
    bit even if it becomes free; three quarters buys at most 2.00 bits; nine
    tenths buys at most 3.32 bits. This is the form in which the lemma bites
    hardest, because it prices a whole research direction before anyone starts
    it.

    APPLICATIONS, WITH THE ARITHMETIC DONE. All source factors below are READ
    IN-REPO from GOAL-MLKEM-001's own archived artifacts; the external papers
    behind them are NOT READ -- RELAYED. Against a materiality bar of Delta = 2
    bits (IDEA-20260722-001's own declared threshold, quoted, not invented here):
      c = 1.50 (sign-matched local pair-reduction factor, EV-MLKEM-003):
        log2 c = 0.585, forced f = 2.2500 -> IMPOSSIBLE.
      c = 2.25 (sign-matched global pair-reduction factor, EV-MLKEM-003):
        log2 c = 1.170, forced f = 1.3500 -> IMPOSSIBLE.
      c = 3.40 (hybrid batch-CVP measured speedup at n = 140..170):
        log2 c = 1.766, forced f = 1.0625 -> IMPOSSIBLE.
      c = 5.00 (hybrid batch-CVP best measured, dimensions <= 210):
        log2 c = 2.322, forced f = 0.9375 -> possible only if batch-CVP is
        93.75 per cent of the optimized total, which is a measurable and
        falsifiable claim rather than a hope.
      c = 8.00 (the largest headline pair-reduction factor, which
        EV-MLKEM-003 records as using a fixed-sign sphere denominator):
        log2 c = 3.000, forced f = 0.8571 -> possible, and note that the verdict
        for this lane therefore turns entirely on WHICH factor is used, 2.25 or
        8. That sensitivity is itself the finding, and it converts a vague
        literature dispute into one number to pin.
    At a 1-bit bar the arithmetic is milder and is reported alongside: c = 1.5
    forces f = 1.50 (still impossible), c = 2.25 forces f = 0.900, c = 3.4
    forces f = 0.7083, c = 5 forces f = 0.6250.

    WHERE THE LEMMA FAILS, STATED BEFORE ANYONE MISUSES IT. Four named escapes,
    each of which is forward guidance rather than a caveat:
      (E1) DOMAIN ENLARGEMENT. If the improvement makes previously infeasible
      theta feasible -- most importantly by fitting a larger block size inside a
      fixed memory budget -- then Theta changes and the pointwise inequality no
      longer implies the minimum inequality. This is the single most important
      escape and every application must check it explicitly.
      (E2) SOUNDNESS-SIDE CHANGES. An improvement that reduces the REQUIRED
      NUMBER OF SAMPLES, the required success probability, or the required list
      size is not dividing a component; it is moving the constraint set. Lemma 1
      says nothing about it.
      (E3) EXPONENT CHANGES. c is a constant by hypothesis. A speedup of
      2^{delta*beta} is not covered and is exactly the kind of result the target
      profile asks for.
      (E4) COMPOSITION. Several independent constant-factor improvements to
      DIFFERENT components compose, and the ceiling for the composite is
      log2(prod c_i) only if each applies to a disjoint component; overlapping
      claims must be recombined before the bound is applied.

    WHY THIS IS NOT PREMATURE CLOSURE. Applying the lemma does not declare any
    direction impossible. It declares a NUMBER: the maximum bits a stated
    constant-factor claim can be worth. A lane closed by it is closed with an
    obstruction (the share ceiling), an argument (Lemma 1's two-line proof) and
    a redirection (E1-E4, which name the improvement classes that evade it). A
    lane that survives it is promoted, because the surviving f is then a
    measurable pre-registered target.

  novelty_status: unverified

  literature_context:
