      ledger/evidence/EV-MLKEM-003.yaml, READ THIS SESSION: "ePrint 2026/1465
      proves constant-factor pair-reduction changes under iid isotropic ball
      models while preserving the (3/4)^(n/2)/sqrt(n) scale and the 0.2075187
