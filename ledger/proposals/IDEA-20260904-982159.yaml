  minimal_test:
    design: >-
      STAGE 0 (ZERO COMPUTE, HARD GATE). Write out L1-L4 and the assembly, verify
      the d = 1 baseline slice symbolically, and verify the two count regimes of R_d
      (X below and above d) by direct enumeration at three small (d, X) pairs. If
      the d = 1 slice does not reproduce the birthday bound the record stops here
      and that is a complete and cheap negative.
      STAGE 1 (HOURS, HARD GATE). Implement R_d arithmetic, phi_d, the norm
      factorisation and Algorithm 1. Run the PLANTED positive control at n about
      2^20. Exact recovery or stop.
      STAGE 2 (HOURS). P3, P4, P5 - the three heuristic validations - by direct
      sampling at n from 2^17 to 2^27 and d in {1, 7, 101, n^{1/3}, n^{2/3}}, with
      10^4 sampled k per cell. These need NO attack and no table, only lattice and
      factorisation work, so they are the cheapest part and they carry most of the
      information.
      STAGE 3 (HOURS TO A DAY). P1 and P2 - run Algorithm 1 to first collision on
      the same ladder, against the two blocking comparators (parallel rho, BSGS) on
      the identical instances in the identical charged units, and against NULL-1 and
      NULL-2.
      STAGE 4 (ONLY IF A LEAD BRANCH FIRES). Stop and route to independent review
      before any interpretation.
      NO LIVE KEY, WALLET OR DEPLOYED SYSTEM IS INVOLVED. All curves and scalars are
      self-generated at toy scale.
    controls:
      - Parallel Pollard rho with distinguished points and negation, identical instances, identical charged units (blocking matched control)
      - BSGS, identical instances, identical charged units, memory reported (blocking matched control)
      - NULL-1 sham modulus with no curve behind it (blocking, same shape)
      - NULL-2 random coset of the same lattice (blocking)
      - PLANTED positive control with k built from two known small-norm elements (blocking)
      - CONTROL C small class number d (h = 1) arm
      - d = 1 baseline slice reproducing the multiplicative birthday bound (blocking)
      - Static check that no table-building code path reads k (blocking)
    required_metrics:
      - Table size at first collision, per (n, d), with the charged unit named
      - Peak memory in charged units and in bytes, per (n, d)
      - Fitted exponent beta with residuals, per d, for Algorithm 1, rho and BSGS
      - Principal-split rate per (d, alpha) with sample size
      - Empirical CDF of the coset minimum norm and of the largest prime factor of its norm
      - Certificate - the pair (beta, gamma) and the recomputation [s(beta)s(gamma)]P = Q, re-verified by an independent code path
      - Wall clock and charged operation count side by side, per stage
      - Pass or fail of every blocking control

  falsification_conditions:
    - >-
      F1. The d = 1 slice does not reproduce the multiplicative birthday bound. The
      cost formula is wrong; the record stops at zero compute and the derivation is
      archived as the refutation artifact.
    - >-
      F2. The planted positive control is not recovered at the predicted table size.
      Implementation failure; nothing is reported and no conclusion is drawn about
      the mathematics (AGENTS.md rule 3).
    - >-
      F3. P3 shows a principal-split rate reproducibly above 4/h(-4d) with the
      excess growing in d. H2 is false in the informative direction, the
      class-number penalty is smaller than derived, and the family may reach an
      exponent below 1/2. THIS IS THE LEAD, it goes to independent review, and it
      would still be no attack until P1 confirms the table size at scale.
    - >-
      F4. P4 shows curve-defined coset minima systematically smaller than random
      cosets by n^{c}, c > 0.05. H1 is false in the informative direction; this is a
      rigorous-size-bound-beating-pigeonhole result of exactly the shape the
      exemplar needed, and it is the input to IDEA-20260904-7caed1.
    - >-
      F5. P1 and P2 confirm the formula across the ladder. The PREDICTED outcome.
      The one-parameter auxiliary-order family is closed at n^{1/2+o(1)} in the
      tested scope with a NAMED obstruction (the Brauer-Siegel cancellation), a
      MEASURED quantity (the principal-split rate) and forward guidance (the escape
      requires either h = o(sqrt d) or a groupoid composition law). It closes the
      family, not the ECDLP, and proves no lower bound.
    - >-
      F6. Table construction exceeds the memory budget before the ladder resolves.
      INFRASTRUCTURE outcome under AGENTS.md rule 3, recorded as such and never as
      mathematical evidence.

  confounders:
    - >-
      Toy-scale smoothness. At n below 2^30 the Dickman regime has not set in and
      rho(u) is dominated by boundary effects; the measured success probability will
      NOT extrapolate. The defence is that P3, P4 and P5 measure the three heuristic
      ingredients SEPARATELY rather than the composite, which is the validation
      ladder of docs/inventor-protocol.md section 6 step 1.
    - >-
      Class-number computation. h(-4d) must be computed exactly (feasible for
      d up to about 2^40 by standard class-number algorithms) rather than
      approximated by sqrt(d), or the test measures the approximation.
    - >-
      Non-maximal orders. Z[sqrt(-d)] is non-maximal when -4d is not fundamental,
      and then unique factorisation of ideals fails at the conductor. Restrict to
      squarefree d with d not congruent to 3 mod 4, or work in the maximal order and
      state which was used.
    - >-
      The sampler knows k. The table-building code path must not read it and the
      static provenance gate must be run; a run that reads k is measuring its own
      input.
    - >-
      Curve exclusion. Anomalous curves (#E = p) and smooth-order curves are
      excluded before a curve enters the run set, as IDEA-20260901-b4e6eb and
      H-ECDLP-a4be60 state the rule; the rule is applied as those records state it
      and KN-TECH-034 was NOT opened in this session.

  interpretation_limits:
    - >-
      The pin is CONDITIONAL on H1, H2 and H3 and on Brauer-Siegel, and
      Brauer-Siegel is a `recalled` citation. Nothing here may be quoted as an
      unconditional lower bound on the ECDLP, which this record does not prove and
      does not attempt.
    - >-
      The closure covers rings with a multiplicative norm and a ring homomorphism
      onto Z/n. It says NOTHING about non-commutative composition structures, about
      index calculus, about transfers, or about any object outside that class, and
      the forward guidance says so explicitly.
    - >-
      Toy tier throughout. The measured exponents are read at 17 to 27 bits and the
      transfer to cryptographic n is an EXPLICIT EXTRAPOLATION recorded as
      unjustified.
    - >-
      No disposition, status change, or approval of anything is made or implied.
      This is a proposal.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a prime n, an admissible d, and k uniform in Z/n, the minimal norm
        Y_min(k) = min{N(alpha) : alpha in R_d, phi_d(alpha) = k} satisfies
        Y_min(k) = Theta(n sqrt(d)) with the same distribution as the minimal norm
        of a UNIFORMLY RANDOM coset of the index-n sublattice ker(phi_d), uniformly
        for 1 <= d <= n^{2/3}.
      rigorous_support: >-
        The rigorous half is Minkowski's convex body theorem applied to the coset,
        which gives Y_min <= (4/pi) n sqrt(d) unconditionally, together with the
        exact covolume computation covol(ker phi_d) = n sqrt(d). The classical
        distribution statement it imitates is the Gaussian heuristic for the
        covering radius and the minimum of a random coset of a rank-2 lattice. What
        is ASSUMED is only that the coset defined by an ECDLP instance is not
        atypical among cosets; the curve enters the construction nowhere, which is
        the reason to expect it, and NULL-1 is the control that checks it.
      validation_plan: >-
        SAMPLE - for six prime orders n from 2^17 to 2^27 and five values of d, draw
        10^4 uniform k, compute Y_min(k) exactly by Lagrange-Gauss reduction of the
        coset (polylog per sample, no ECDLP solved). COMPARISON DISTRIBUTION - the
        empirical CDF of Y_min/(n sqrt d) against the same statistic for 10^4
        uniformly random cosets of the same lattice (NULL-2), by two-sample
        Kolmogorov-Smirnov. TAIL CHECK - the single smallest Y_min observed across
        all cells against the smallest over an equal number of random-coset
        replicates; a real effect is a shift of the distribution, not one outlier.
        SAMPLED PARAMETERS RECORDED - n, d, delta, k, seed. TRANSFER ASSUMPTION,
        STATED - validated only for n at most 2^27 and d at most n^{2/3}; nothing is
        claimed at cryptographic n.
    - id: H2
      statement: >-
        Let alpha in R_d have B-smooth norm with omega distinct prime ideal factors,
        all split. The balanced prefix ideals of the 2^omega orderings are
        EQUIDISTRIBUTED in the class group Cl(-4d), so the expected number of
        balanced factorisations of alpha into ELEMENTS of R_d is 2^{omega}/h(-4d),
        uniformly for d in the tested range.
      rigorous_support: >-
        The rigorous half is that the prime ideals above split primes generate
        Cl(-4d) and that, by the Chebotarev/Cebotarev equidistribution of Frobenius
        (equivalently, of the Artin symbol) the CLASS of a random prime ideal of
        norm at most B is equidistributed as B grows. The classical distribution
        statement imitated is that a product of omega independent uniform class-group
        elements is uniform for omega of order log h. THE COMPOSITION IS NOT WRITTEN
        DOWN ANYWHERE IN THIS PROGRAM and this record does not assert it as a
        theorem - the prefixes of ONE alpha are not independent, and the record
        states that as its principal weakness rather than smoothing it over. H2 is a
        genuine heuristic and it is the one that could be false in the direction
        that matters.
      validation_plan: >-
        SAMPLE - for each (n, d) cell, take 10^3 elements alpha of the coset with
        B-smooth norm, enumerate all 2^omega balanced prefixes, and compute the class
        of each by ideal reduction; report the observed principal fraction against
        1/h(-4d). SHORTCUT MAKING SAMPLING FEASIBLE - class-group arithmetic in an
        imaginary quadratic order is polylog per operation and h(-4d) is computable
        exactly up to d about 2^40, so this validates far past the scale at which
        Algorithm 1 itself can be run; that gap is the shortcut, and it is the
        analogue of the exemplar's use of the Deuring correspondence. COMPARISON
        DISTRIBUTION - the binomial with parameter 1/h(-4d). TAIL CHECK - the
        maximum observed principal fraction over all cells against the maximum over
        equally many synthetic draws from that binomial. TRANSFER ASSUMPTION,
        STATED - validated for d at most 2^40 and B at most 2^16; the uniformity in
        d claimed by H2 is NOT validated beyond that.
    - id: H3
      statement: >-
        For alpha ranging over the elements of the coset phi_d^{-1}(k) of norm at
        most Y, the integer N(alpha) behaves with respect to smoothness like a
        uniformly random integer of its size - the probability that it is B-smooth
        is u^{-u(1+o(1))} with u = log Y / log B, uniformly for
        (log n)^{epsilon} < u < (log n)^{1-epsilon}.
      rigorous_support: >-
        The rigorous half is the Canfield-Erdos-Pomerance estimate for the count of
        B-smooth integers below Y (RECALLED, not opened by this program), composed
        with the exact statement that N(alpha) = a^2 + d b^2 is an integer of size
        Theta(Y). The classical distribution theorem imitated is Dickman-de Bruijn
        rho(u). The KNOWN SLACK, recorded rather than hidden - values of a binary
        quadratic form are NOT uniformly random integers, they are constrained to
        represent only integers whose prime factors are split or ramified in R_d, so
        H3 is expected to be WRONG BY A CONSTANT-IN-THE-EXPONENT FACTOR of order
        2^{-omega}, which is n^{o(1)} and is already carried in the cost formula.
        The experiment measures the size of the discrepancy rather than assuming it.
      validation_plan: >-
        SAMPLE - 10^5 values of N(alpha) per (n, d) cell, fully factored (feasible
        because N(alpha) is at most about n^{5/3}, i.e. 45 bits at the top of the
        ladder). COMPARISON DISTRIBUTION - the empirical CDF of log(largest prime
        factor)/log N against rho(u), exactly as the exemplar's section 4.2 does,
        including a zoom on the 500 smoothest samples. TAIL CHECK - the smoothest
        observed sample against the predicted rho(u); consistency in the exemplar's
        sense. CONTROL - the identical statistic for uniformly random integers of
        the same size, which isolates the form-representability bias. SAMPLED
        PARAMETERS RECORDED - n, d, Y, B, seed.

  target_complexity:
    time_exponent: >-
      n^{1/2} * (h(-4d)/sqrt(d))^{1/2} * n^{o(1)}, which by Brauer-Siegel is
      n^{1/2+o(1)} for every admissible d. The NAIVE pre-class-number figure, stated
      so the cancellation is visible, is n^{1/2 - delta/4 + o(1)} at d = n^{delta},
      reaching n^{1/3+o(1)} at delta = 2/3; that figure is NOT claimed and is
      recorded only as the quantity the class number cancels.
    memory_exponent: >-
      n^{1/2+o(1)} - the same as the time, because the algorithm is claw finding
      over two stored tables and there is nothing else to do with them. This is
      strictly WORSE than parallel rho, whose memory is polylog per processor, and
      it is the axis on which the proposal is dominated even in the best case.
    best_known: >-
      Parallel Pollard rho with distinguished points and the negation map, about
      0.886 sqrt(n) group operations at small per-processor memory (KN-TECH-006,
      cited second-hand); BSGS at about 2 sqrt(n) time and sqrt(n) memory;
      automorphism-discounted rho at sqrt(n/|Aut|) (KN-TECH-018); batch rho at
      Theta(sqrt(Mn)) for M targets; generic preprocessing at S T^2 = Theta(n).
    hidden_overhead: >-
      THE o(1) HIDES A SUPERPOLYNOMIAL FACTOR and it is larger than the exemplar's,
      because three independent n^{o(1)} terms multiply - rho(u)^{-1} from the
      smoothness condition, 2^{omega} from the split-primes condition, and the
      d^{o(1)} slack in Brauer-Siegel, which is INEFFECTIVE (Siegel's bound has no
      computable constant), so no concrete-cost table can be honestly produced for
      this family at any n without first fixing d and computing h(-4d) exactly. That
      ineffectivity is a real limitation of the claim and is stated rather than
      absorbed.
    tradeoff_note: >-
      There is no useful time-memory tradeoff. Shrinking the tables below
      n^{1/2+o(1)} shrinks X, which by the split inequality shrinks the reachable Y,
      which lowers the success probability faster than it lowers the cost; the
      product is minimised at the balanced point. Parallelisation is perfect for
      table construction (each entry is independent) and is limited by the join for
      the collision search, so the van Oorschot-Wiener interpolation that rescues
      claw finding elsewhere applies to the join only and does not move the exponent.

  dominated_by: >-
    DOMINATED, and the frontier was walked row by row. (1) Parallel Pollard rho with
    distinguished points and negation - ties on time exponent (both n^{1/2}), wins
    decisively on the constant (0.886 versus a superpolynomial n^{o(1)}), wins
    decisively on memory (polylog versus n^{1/2}), ties on parallelisation. DOMINATES
    THIS PROPOSAL. (2) BSGS - ties on time exponent, ties on memory exponent, wins on
    the constant. DOMINATES. (3) Automorphism-discounted rho at sqrt(n/|Aut|) -
    dominates by the same margin plus a constant. (4) Batch rho at Theta(sqrt(Mn)) -
    not comparable at M = 1, dominates for M > 1 since this proposal has no
    multi-target amortisation. (5) Generic preprocessing with S T^2 = Theta(n) -
    wins on ONLINE time (n^{1/3} versus n^{1/2}), loses on total charged cost; not
    comparable without declaring whether preprocessing is charged, which is exactly
    the ambiguity IDEA-20260904-ca8865 addresses. (6) Pohlig-Hellman - not
    comparable, n is prime by hypothesis. (7) Transfers (MOV/FR at small embedding
    degree, Smart/Satoh-Araki on anomalous curves) - dominate on the curve families
    where they apply and are inapplicable here by the curve exclusion rule. (8)
    Prime-field index calculus - this corpus reports it at or above n^{1/2}, so it
    does not dominate, and it does not lose either. DATA AND QUERY AXIS - this
    proposal makes no oracle queries and consumes no auxiliary inputs, so it is not
    dominated there and gains nothing there.
  sota_delta: >-
    +0 on the time exponent (n^{1/2+o(1)} versus n^{1/2} times polylog), a
    SUPERPOLYNOMIAL LOSS on the constant, and -1/2 in the memory exponent (this
    proposal needs n^{1/2+o(1)}, rho needs polylog). AS AN ATTACK THE DELTA IS
    NEGATIVE AND IS STATED AS NEGATIVE. The quantitative deltas actually claimed
    are (i) a closed formula T = n^{1/2}(h(-4d)/sqrt d)^{1/2} n^{o(1)} covering an
    infinite one-parameter family in one line, where the corpus previously had no
    formula at all; (ii) the identification of a genuinely lossy, compatibly
    propagating, infinitely-surviving ECDLP tracked object, which is new to this
    corpus and answers part of KN-OPEN-019 with a positive example rather than a
    tally; (iii) a named, measured obstruction - the exact cancellation of the
    covolume gain d^{1/4} against the class number - replacing the prose statement
    that "elliptic curve groups have no smoothness notion", which is FALSE as
    usually stated and is here replaced by a correct quantitative version; (iv) a
    stated escape condition (h = o(sqrt d), or a groupoid composition law) that a
    successor can aim at. No exponent moves and none is claimed.

