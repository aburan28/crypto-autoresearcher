idea:
  id: IDEA-20260904-982159
  question_id: RQ-ECDLP-002
  handoff_id: TASK-20260904-300a32
  goal_id: null
  added: '2026-09-04'

  title: >-
    AUXILIARY-ORDER SMOOTHNESS SPLITTING FOR PRIME-FIELD ECDLP - the exemplar's
    machine transplants EXACTLY, by a free choice of imaginary quadratic order
    R_d = Z[sqrt(-d)] carrying a ring homomorphism onto Z/n, and its cost obeys
    the single closed formula T = n^{1/2} * (h(-4d)/sqrt(d))^{1/2} * n^{o(1)};
    the covolume gain d^{-1/4} that would take the exponent to 1/3 is cancelled
    TERM FOR TERM by the class number, so Brauer-Siegel h(-4d) = d^{1/2+o(1)}
    pins the whole one-parameter family at n^{1/2+o(1)} - and names the exact
    property an escape would have to have

  class: algorithm

  claim: >-
    SETTING. E/F_p a public prime-field curve, P of prime order n, Q = [k]P, k
    unknown, n prime and coprime to p. No live key, no deployed system.

    (A) THE CONSTRUCTION, WHICH IS FREE AND HAS NO CURVE IN IT. Pick a squarefree
    integer d > 0 such that -d is a quadratic residue mod n, and compute delta
    with delta^2 = -d (mod n) by Tonelli-Shanks in O(log^3 n) bit operations. Let
    R_d = Z[sqrt(-d)], the imaginary quadratic order of discriminant -4d, with the
    MULTIPLICATIVE norm N(a + b sqrt(-d)) = a^2 + d b^2, and let phi_d be the RING
    HOMOMORPHISM R_d -> Z/n sending a + b sqrt(-d) to a + b*delta. Every element
    beta of R_d therefore carries a scalar s(beta) = phi_d(beta) in Z/n that is
    computable in O(log n) bit operations, and s is MULTIPLICATIVE - s(beta*gamma)
    = s(beta) s(gamma). This is the ECDLP analogue of "an isogeny has a degree and
    degrees multiply". It costs nothing and is available for EVERY prime-field
    curve, because it uses only the integer n.

    (B) THE ALGORITHM (Algorithm 1 below), WHICH IS THE EXEMPLAR'S ALGORITHM 2
    VERBATIM. Fix a smoothness bound B and a split bound X. Build TABLE A =
    {([s(beta)]P, beta) : beta in R_d, N(beta) <= X, N(beta) B-smooth} keyed by the
    point, and TABLE B = {([s(gamma)^{-1}]Q, gamma) : gamma in R_d, N(gamma) <= X,
    N(gamma) B-smooth}. A collision [s(beta)]P = [s(gamma)^{-1}]Q yields
    s(beta)s(gamma) = k (mod n), i.e. the discrete logarithm, certified by a single
    scalar multiplication. Correctness under a condition (Lemma L3): if SOME alpha
    in R_d with phi_d(alpha) = k has N(alpha) <= Y, has N(alpha) B-smooth, and
    admits a balanced factorisation alpha = beta*gamma INTO ELEMENTS of R_d with
    N(beta), N(gamma) <= X, then with X = (B*Y)^{1/2} the pair (beta, gamma) lies
    in the two tables and the collision is found.

    (C) THE COUNTING, WHICH IS WHERE THE EXPONENT WOULD COME FROM. The lattice
    R_d in C has covolume sqrt(d), so for X >> d the number of elements of norm at
    most X is (pi/sqrt(d)) X (1 + o(1)), and for X < d it is 2*floor(sqrt(X)) + 1,
    because every element of norm below d is a RATIONAL INTEGER. The fibre
    phi_d^{-1}(k) is a coset of a sublattice of index n, hence of covolume
    n*sqrt(d), so under the Gaussian heuristic its minimal element has norm of
    order n*sqrt(d). Naively substituting Y = n sqrt(d) gives table size
    T_naive = pi B^{1/2} n^{1/2} d^{-1/4} rho(u), which at d = n^{2/3} - the
    largest d for which the count formula is valid at X - would read n^{1/3+o(1)}
    IN TIME AND MEMORY. That number is WRONG, and the rest of this record is why.

    (D) THE PIN, AND IT IS A THEOREM MODULO BRAUER-SIEGEL, NOT A HEURISTIC. The
    factorisation demanded by Lemma L3 is a factorisation into ELEMENTS. If
    N(alpha) is B-smooth its ideal factors into prime ideals of norm at most B, and
    every balanced prefix is an IDEAL; that prefix is an element if and only if it
    is PRINCIPAL. The class group of R_d has order h(-4d), so under the
    equidistribution heuristic H2 the expected number of balanced ELEMENT splits of
    a smooth alpha is 2^{omega(N(alpha))}/h(-4d), and with B = exp(c sqrt(log n))
    the factor 2^omega is n^{o(1)}. Re-randomising over the coset - taking all
    alpha in phi_d^{-1}(k) of norm at most Y, of which there are (pi/(n sqrt d)) Y
    - the requirement that at least one be smooth AND element-splittable forces
    Y = n sqrt(d) * h(-4d) * n^{o(1)}, hence X = (B Y)^{1/2} and

      T = (pi/sqrt(d)) X * rho(u) = n^{1/2} * ( h(-4d) / sqrt(d) )^{1/2} * n^{o(1)}.

    THE COVOLUME GAIN AND THE CLASS-NUMBER PENALTY ARE THE SAME EXPONENT WITH
    OPPOSITE SIGNS. By the Brauer-Siegel theorem h(-4d) = d^{1/2 + o(1)}, so
    h/sqrt(d) = d^{o(1)} and T = n^{1/2 + o(1)} for EVERY admissible d, including
    d = O(1) where the construction degenerates to plain rational-integer
    multiplication and reproduces the birthday bound exactly.

    (E) THE SAME PIN IN THE OTHER FORMULATION, WHICH IS A CONSISTENCY CHECK AND NOT
    A SECOND RESULT. If instead d is taken to be the curve's OWN CM discriminant so
    that ideals act on the isogeny class and the meet-in-the-middle is keyed by the
    intermediate CURVE rather than by a scalar, the class-number penalty vanishes
    (non-principal ideals are usable) but the number of meeting objects is only
    h(O) = p^{1/2 + o(1)} instead of n, and the same bookkeeping gives
    T = n^{1/2} d^{1/4} rho^{1/2} = n^{3/4 + o(1)} at d of order p. Both
    formulations are at or above n^{1/2}; the element formulation is the better of
    the two and it is exactly tight.

    (F) WHAT WOULD BREAK IT, STATED SO A REFEREE CAN AIM AT IT. T falls below
    n^{1/2} exactly when h(-4d) = o(sqrt(d)) along an infinite family of admissible
    d, or when the balanced prefixes of smooth ideals are NOT equidistributed in
    the class group and are biased towards the principal class by a factor
    d^{epsilon}. The first is contradicted by Brauer-Siegel (recalled). The second
    is heuristic H2 and is DIRECTLY MEASURABLE at toy scale, which is the
    experiment.

  mechanism: >-
    THE TRACKED OBJECT is an element alpha of an auxiliary imaginary quadratic
    order representing the unknown scalar under a public ring homomorphism, and the
    thing followed through the computation is its NORM together with its
    factorisation type. The composition law is multiplication in R_d, which the
    homomorphism carries to multiplication in Z/n, which is exactly the operation a
    meet-in-the-middle needs.

    THE LOSSY-PROJECTION TEST (docs/inventor-protocol.md section 2), APPLIED. The
    map alpha -> (N(alpha), class of alpha) is a genuinely LOSSY projection of
    alpha - it forgets the unit and the position of alpha inside its class, and the
    fibre over a given (norm, class) pair has size of order the number of ideals of
    that norm, which is unbounded. The discard is COMPATIBLE with the operation
    that matters, because both coordinates are multiplicative - N(beta gamma) =
    N(beta)N(gamma) and [beta gamma] = [beta][gamma] in Cl(R_d). So the retained
    part propagates DETERMINISTICALLY under composition. This object therefore
    PASSES the lossy-projection test non-vacuously, which is precisely why it is
    worth costing rather than dismissing - and it is also why the failure, when it
    comes, is a cost failure and not a structural one. The second coordinate, the
    ideal class, is not decoration - it IS the obstruction, and the test is what
    made it visible.

    WHY THIS IS THE EXEMPLAR'S MACHINE AND NOT A LOOKALIKE. Component by
    component - external structural ingredient (there the Aubry-Oyono-Vincent
    degree bound, here the Minkowski/Gaussian bound on the coset minimum);
    smoothness splitting of a multiplicative quantity (there the degree, here the
    norm); a keyed meet-in-the-middle table (there keyed by codomain curve, here
    keyed by the point [s(beta)]P); a distribution heuristic supplying the success
    probability (there Canfield-Erdos-Pomerance / Dickman, here the same);
    re-randomisation to the average case (there a non-backtracking walk in the
    2-isogeny graph, here the free traversal of the coset phi_d^{-1}(k), whose
    "mixing" is exact rather than approximate because a coset is enumerated, not
    walked). Every part transplants. The exponent does not, and the record is the
    derivation of exactly why.

    ALGORITHM 1 (Require/Ensure). REQUIRE - E/F_p, P of prime order n, Q = [k]P,
    parameters d, B, X. ENSURE - k, or FAIL. Step 1, compute delta with delta^2 =
    -d mod n or report that -d is a non-residue and pick another d. Step 2,
    enumerate L = {beta = a + b sqrt(-d) : a^2 + d b^2 <= X, gcd(a,b) = 1, a^2 + d
    b^2 B-smooth}. Step 3, for each beta in L store ([s(beta)]P, beta) in a hash
    table keyed by the compressed point. Step 4, for each gamma in L compute
    [s(gamma)^{-1}]Q and probe the table; on a hit output k = s(beta)s(gamma) mod
    n. Step 5, if no hit, increase X and repeat. PROOF DECOMPOSITION - L1 size of L
    (pure counting in R_d), L2 runtime of steps 2-4 (one scalar multiplication per
    entry plus one hash probe), L3 correctness under the smooth-and-splittable
    condition, L4 success probability under heuristics H1-H3. The main statement
    only assembles per-attempt cost times inverse success probability, exactly as
    docs/target-result-profile.md A3 requires.

