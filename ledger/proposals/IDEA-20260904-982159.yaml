    - metric: >-
        P5 - the empirical CDF of the largest prime factor of N(alpha_min) against
        the Dickman-de Bruijn rho(u) prediction, with a tail check on the smoothest
        sample
      direction: different
      minimum_effect: >-
        Consistency in the sense of the exemplar's section 4.2 - the smoothest
        observed sample of M draws must be s-smooth with rho(u_s) within a factor 4
        of 1/M. A systematic excess of smoothness would RAISE the success
