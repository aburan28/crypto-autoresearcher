  assumptions:
    - >-
      n prime, gcd(n, p) = 1, and the ECDLP instance is public and self-generated;
      no live key, wallet, or deployed system is involved at any stage.
    - >-
      d ranges over squarefree positive integers with -d a quadratic residue mod n.
      Roughly half of all d qualify and delta is computed in polylog time, so the
      family is genuinely one-parameter and free.
    - >-
      B is set as in the exemplar, B = exp(c sqrt(log n)), so that B = n^{o(1)},
      rho(u)^{-1} = n^{o(1)} and 2^{omega} = n^{o(1)}. Every n^{o(1)} in this record
      hides a SUPERPOLYNOMIAL factor and that is disclosed, not absorbed.
    - >-
      Charged cost model - one unit per group operation, one unit per table entry
      stored, one unit per hash probe, plus the explicitly stated polylog bit costs
      for Tonelli-Shanks, norm factorisation and the final certificate check.
      Serialisation and transfer of the tables are charged at one unit per entry.

  proof_search_map:
    bottleneck: >-
      The ELEMENT-versus-IDEAL step of Lemma L3. Everything else in the transplant
      is mechanical; the entire exponent question is whether a balanced prefix of a
      smooth ideal is principal, and that is where the class number enters and where
      the covolume gain dies.
    baseline_embedding:
      parameter_slice: >-
        d = 1 (or any d = O(1)). Then R_d is a fixed order, elements of norm at most
        X number 2 sqrt(X) + O(1), the coset minimum is of order n, X = (Bn)^{1/2},
        the table has n^{1/2+o(1)} entries and the algorithm degenerates to a
        multiplicative meet-in-the-middle over Z/n at exactly the birthday bound.
      reproduction_check: >-
        SYMBOLIC AND FROZEN - substituting d = 1 and h = 1 into
        T = n^{1/2}(h/sqrt d)^{1/2} n^{o(1)} must return n^{1/2+o(1)} identically,
        and a small numeric fixture at n = 1009 must reproduce the exhaustive
        birthday count of the multiplicative meet-in-the-middle to within the
        stated constant. If the formula does not reproduce the baseline at d = 1 it
        is wrong everywhere.
    observation_collision:
      observable: >-
        The pair (T, success probability) predicted by the cost formula at a given
        (n, d, B).
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED - two structurally different orders R_{d1}
        and R_{d2} with d1 << d2 but h(-4d1)/sqrt(d1) = h(-4d2)/sqrt(d2), which the
        formula says must have the SAME cost although one has a table
        d2^{1/4}/d1^{1/4} times smaller before the class-number correction. Finding
        such a pair and measuring both is the sharpest available test that the
        cancellation is real rather than an artifact of the derivation. A pair whose
        measured costs DIFFER falsifies the formula and is the lead.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the ECDLP from the group Z/n, where the only composition is addition
          and the meet-in-the-middle is counting-blocked at n^{1/2}, into the ring
          R_d, where composition is multiplication, the norm is multiplicative, and
          smoothness splitting is available. Encoding - exact, phi_d is a ring
          homomorphism. Completeness - exact, phi_d is surjective. Soundness -
          exact, a collision certifies k. Cost loss - the DISCLOSED one, that a
          smooth ideal factorisation need not be an element factorisation, priced at
          h(-4d).
        predicted_gain: >-
          Would be n^{-delta/4} in table size at d = n^{delta}; is exactly zero after
          the class-number charge. The transform is recorded as EXECUTED AND
          NEUTRAL, which is a result about the representation and not a failure to
          find one.
      - transform: baseline_lift
        proposed_object: >-
          Enlarge the certificate family from "the true alpha is smooth" to "SOME
          alpha in the coset of norm at most Y is smooth and element-splittable",
          which is the re-randomisation step and is what converts a worst-case
          instance into an average-case one without a random walk.
        predicted_gain: >-
          Converts a per-instance success probability rho(u) into a certainty at the
          price of Y, and it is the step at which the class number is paid. Strict
          inward improvement over the naive single-alpha version, which fails with
          probability 1 - rho(u).
    quantifier_order: >-
      FOR ALL primes n, FOR ALL admissible d, THERE EXIST B and X such that FOR ALL
      k in Z/n, Algorithm 1 returns k in expected time and memory
      n^{1/2}(h(-4d)/sqrt d)^{1/2} n^{o(1)}, ASSUMING Heuristics H1, H2 and H3. The
      witness (B, X) is allowed to depend on (n, d) and is FORBIDDEN to depend on k;
      the implementation must enforce that separation and a static provenance check
      over the table-building code path is a blocking control. The n^{o(1)} is
      uniform in k but NOT uniform in d, and the record does not claim otherwise.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most - "for every admissible auxiliary order the smoothness-splitting
        meet-in-the-middle costs n^{1/2+o(1)} in time and n^{1/2+o(1)} in memory
        under H1-H3, hence never beats parallel rho and is strictly worse than rho
        on memory". It can NEVER certify that no smoothness-based ECDLP algorithm
        exists, because it quantifies only over rings with a multiplicative norm and
        a homomorphism to Z/n; it certifies nothing at cryptographic n beyond the
        asymptotic statement, which is conditional on three heuristics; and it
        proves no lower bound on the ECDLP.
      nearby_object_control: >-
        The nearby object where the hoped-for conclusion FAILS is the exemplar's own
        setting - a maximal order in the quaternion algebra B_{p,infinity}, where the
        composition structure is a GROUPOID (arrows are isogenies, objects are
        curves), there is no principality condition at all because a non-principal
        ideal is still a legal arrow, and the analogous cost is p^{1/3+o(1)}. A
        derivation that cannot distinguish the quadratic order from the quaternion
        order has not identified the load-bearing structure, and the specific
        distinguishing feature is named - commutative order, class-group penalty
        versus groupoid, object-count credit.
    proof_obligations:
      - claim: >-
          phi_d is a ring homomorphism onto Z/n and s(beta gamma) = s(beta)s(gamma).
        responsibility: correctness
      - claim: >-
          The number of elements of R_d of norm at most X is (pi/sqrt d) X (1+o(1))
          for X >> d, and exactly 2 floor(sqrt X) + 1 for X < d.
        responsibility: size
      - claim: >-
          The fibre phi_d^{-1}(k) is a coset of a rank-2 lattice of covolume
          n sqrt(d), and its minimal norm is of order n sqrt(d) under H1.
        responsibility: size
      - claim: >-
          With X = (B Y)^{1/2}, any B-smooth alpha of norm at most Y with a principal
          balanced prefix has both factors of norm at most X.
        responsibility: correctness
      - claim: >-
          Building and probing both tables costs one scalar multiplication and one
          hash probe per entry, plus the charged serialisation of the table.
        responsibility: runtime
      - claim: >-
          The expected number of principal balanced splits of a B-smooth alpha is
          2^{omega}/h(-4d) under H2.
        responsibility: success_probability
      - claim: >-
          d = 1 reproduces the multiplicative birthday bound exactly.
        responsibility: baseline
      - claim: >-
          No table-building code path reads k.
        responsibility: interface
      - claim: >-
          Every reported cost names n, d, B, X, the cost model and the charged units.
        responsibility: scope
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: >-
      The pair (norm, ideal class) of an auxiliary-order representative of the
      unknown scalar, followed through multiplication in R_d.
    lossiness: >-
      GENUINELY LOSSY and COMPATIBLY so - see mechanism. The fibre over a fixed
      (norm, class) pair is the full set of elements of that norm in that class,
      which is unbounded, so nothing here is a change of coordinates; and both
      coordinates are multiplicative, so the retained part propagates
      deterministically under the composition the algorithm uses. It passes the
      test, and the value of the test here is that it PRODUCED the obstruction -
      the class coordinate is the thing that is retained, and it is the thing that
      costs h.
    propagation: >-
      Exact and deterministic under multiplication in R_d; NOT defined under the
      group law on E, which is the additive operation, and the record makes no claim
      there. This is why the object escapes the rigidity theorem of
      IDEA-20260807-df906f, which quantifies over objects propagating under the
      TRANSLATION action - the object here propagates under a DIFFERENT operation
      that the algorithm supplies for itself.
    survival_score: >-
      Survives arbitrarily deep composition (it is a homomorphic image of a
      multiplicative monoid), which is the strongest survival any ECDLP object in
      this corpus has been claimed to have. It nevertheless yields no exponent,
      which is itself the finding - survival depth is necessary and not sufficient,
      and this record is the counterexample that separates the two.

  null_object_control: >-
    NULL-1, THE SHAM MODULUS (blocking, and the null specific to this record). Run
    the identical Algorithm 1 with n replaced by a random prime of the same bit
    length that is NOT the order of any curve in the run set, and with the "points"
    replaced by the residues themselves - i.e. solve the multiplicative
    meet-in-the-middle in Z/n directly. The predicted measured table size, split
    yield and class-number penalty must be IDENTICAL to the on-curve run to within
    sampling error, because the derivation contains no curve. IF THEY DIFFER, the
    on-curve measurement is contaminated by something the derivation does not
    model, and no exponent statement may be made until it is found.
    NULL-2, THE RANDOM-COSET NULL (blocking). Replace the coset phi_d^{-1}(k) by a
    coset of the same lattice chosen uniformly at random, and measure the minimal
    norm and its smoothness. If the curve-defined coset behaves differently from a
    random coset, heuristic H1 is false in the informative direction and that is a
    LEAD, not a nuisance - it would be exactly the "Y_min beats pigeonhole" theorem
    the exemplar's machine needs (see IDEA-20260904-7caed1).
    COMPARATOR 1 (blocking) - parallel Pollard rho with distinguished points and the
    negation map on the identical instances, charged in the identical units.
    COMPARATOR 2 (blocking) - BSGS on the identical instances, charged in the
    identical units, reported with its memory.
    POSITIVE CONTROL (blocking) - a PLANTED instance in which k is chosen as
    s(beta)s(gamma) for a known pair of small-norm elements. Algorithm 1 must find
    it at the predicted table size. An implementation that cannot solve the planted
    case cannot be trusted on the general case.
    CONTROL C - d chosen so that h(-4d) = 1 (the nine Heegner-type discriminants and
    their small-d relatives). There the class-number penalty is absent by
    construction and the formula predicts T = n^{1/2} d^{-1/4} n^{o(1)}; since d is
    then O(1) the prediction is still n^{1/2}, and the arm exists to show that the
    cancellation is not being smuggled in by the parameterisation.

  predictions:
    - metric: >-
        P1 - measured table size at first collision, T_meas(n, d), divided by the
        predicted n^{1/2}(h(-4d)/sqrt d)^{1/2}, over a ladder of at least six prime
        orders spanning a 100x range and at least five values of d spanning
        d = 1 to d near n^{2/3}
      direction: different
      minimum_effect: >-
        PRE-REGISTERED TWO-BRANCH RULE. A ratio lying in [1/4, 4] at every tested
        (n, d) records the PIN branch - the formula holds, the family is closed at
        n^{1/2+o(1)}, and the honest headline is a closure with a measured
        obstruction. A ratio below 1/10, reproduced at three or more (n, d) cells
        AND decreasing with d, records the LEAD branch and triggers mandatory
        independent review before any interpretation. Anything between is
        INCONCLUSIVE in advance. BASIS - these are pre-registered tolerances chosen
        from the n^{o(1)} slack at toy sizes; they are NOT measurements.
    - metric: >-
        P2 - the fitted exponent beta in T_meas ~ n^{beta} at fixed d
      direction: different
      minimum_effect: >-
        beta in [0.45, 0.55] records the pin. beta at or below 0.40, reproduced
        across the d ladder, records the lead. The rho and BSGS comparators must
        both return beta in [0.45, 0.55] on the identical instances or the
        instrument is not measuring an exponent at all and nothing is reported.
    - metric: >-
        P3 - the measured principal-split rate, i.e. the fraction of balanced
        prefixes of smooth alpha that are principal, versus the predicted 1/h(-4d)
      direction: different
      minimum_effect: >-
        Agreement within a factor 2 at every tested d records H2 as validated in
        scope. A measured rate exceeding 4/h(-4d) reproducibly is the SINGLE most
        interesting negative available here - it would mean smooth-ideal prefixes
        are biased towards the principal class, which is the one identified route to
        an exponent below 1/2 in this family, and it routes straight to independent
        review.
    - metric: >-
        P4 - the empirical distribution of the coset minimum norm Y_min(k) over
        random k, normalised by n sqrt(d), against the Gaussian-heuristic prediction
      direction: different
      minimum_effect: >-
        A distribution matching the random-coset null (NULL-2) within a
        Kolmogorov-Smirnov p-value above 0.01 records H1 as validated in scope.
        Systematic deficiency of the curve-defined cosets by a factor n^{c} with
        c > 0.05, reproduced across the n ladder, is the LEAD and is the exact
