idea:
  id: IDEA-20260816-29e596
  question_id: RQ-SIMSPK-f6a6c0
  added: '2026-08-16'
  title: 'The longest miss-in-the-middle as a function of the rotation triple: propagate difference
    SUPPORT patterns forward and backward through the AND-RX round with a one-sided-sound union rule,
    verify that rule against exhaustive reachability at word sizes where reachability is computable,
    and report the impossible-differential reach of every constant as a distribution rather than a
    verdict.'
  class: mechanism
  claim: '(A) Impossible-differential reach is the one portfolio measure that produces an integer
    with no probability attached: either a forward-reachable difference set and a backward-reachable
    difference set are disjoint at the meeting round or they are not. It is therefore the cheapest
    genuinely conclusive measure in the RQ''s portfolio and the one least contaminated by solver budget,
    because the propagation is deterministic set arithmetic rather than search. (B) The claim is that
    for SIMON-like round functions the forward propagation of difference SUPPORT, the set of bit positions
    that can be active, obeys a closed union rule: the AND of two rotated copies produces an output
    whose active-bit support is contained in the union of the two rotated supports, and the XOR of
    S^c contributes its own rotated support, so support propagates as S^a(supp) union S^b(supp) union
    S^c(supp), merged across the Feistel branches. This rule is sound in one direction only, which
    is exactly what an impossibility argument needs: it over-approximates reachability, so a disjointness
    it certifies is real, while a non-disjointness it reports is not a possibility claim. (C) The
    claim is that this rule can be verified rather than assumed, by computing exact reachable-difference
    sets by brute force at word sizes 4 through 8 and checking containment cell by cell, and that
    a containment failure is a defect in the rule and not in the cipher. (D) The claim is that r_imp(a,b,c),
    the largest round count admitting a certified impossible differential between a unit input difference
    and a unit output difference, is computable exhaustively over the whole constant space in minutes,
    giving the standardized triple''s rank under a measure the RQ names but the corpus has never computed.
    (E) NOT CLAIMED: that the rule is tight, that r_imp is the true impossible-differential reach
    rather than a lower bound on it, that any triple is anomalous, that unit differences are the optimal
    choice of endpoints, or any attack, distinguisher or security consequence for any variant.'
  mechanism: 'STAGE A, rule derivation: write the AND bitwise. For output bit i of (S^a x AND S^b
    x), the difference at position i depends only on the difference and value bits at positions i
    - a and i - b. If both input difference bits are zero the output difference bit is zero deterministically;
    if either is nonzero the output difference bit may be zero or one depending on the unknown value.
    This gives support propagation as a union and gives determinism only on the zero side, which is
    the one-sided soundness the impossibility argument needs. STAGE B, exhaustive verification: at
    word sizes 4, 6 and 8, compute for every triple and every input difference the exact set of reachable
    output differences by iterating over all inputs, take its support, and check containment inside
    the rule''s prediction. Any containment failure refutes the rule. STAGE C, forward and backward
    propagation: implement the rule on the Feistel state as a pair of supports, propagate forward
    r_f rounds from each of the 2n unit input differences and backward r_b rounds from each of the
    2n unit output differences, using the inverse Feistel for the backward direction with its own
    derived rule. STAGE D, miss-in-the-middle: for every pair of unit endpoints and every split r_f
    + r_b, test whether the forward support and the backward support are contradictory, meaning a
    position forced active on one side and forced inactive on the other. Record the maximum r_f +
    r_b over all endpoint pairs as r_imp(a,b,c). STAGE E, exhaustive sweep over the constant space
    at n = 8 and n = 16, producing the r_imp distribution, the standardized triple''s rank, and the
    orbit-weighted percentile. STAGE F, nulls run in the same invocation: a random-constant family,
    and a full-diffusion control whose round function makes every support saturate in one round and
    whose r_imp must therefore be near the floor.'
  novelty_status: unverified
  novelty_screen:
    method: grep -ril SIMSPK over ledger/proposals, ledger/hypotheses and experiments; grep -ril 'impossible
      differential' over ledger/proposals with the hit list inspected and the title block of IDEA-20260807-bbefda
      read; grep -ril 'miss-in-the-middle' over ledger and knowledge; grep -ril 'truncated differential'
      over ledger/proposals; read RQ-SIMSPK-f6a6c0 in full, which names impossible-differential reach
      as one of the five portfolio measures; read GOAL-SIMSPK-001's completion criteria; read KN-LIT-5292;
      listed knowledge/techniques and knowledge/open-problems in full.
    results: No proposal exists under RQ-SIMSPK-f6a6c0. Every 'impossible differential' hit in ledger/proposals
      lies in the AES area, chiefly the IDEA-20260805 series and IDEA-20260807-bbefda, and concerns
      AES-specific structures and counting models rather than a parameterized AND-RX round function;
      none propagates support patterns over a rotation-constant space. No record in ledger/ or knowledge/
      contains 'miss-in-the-middle'. KN-LIT-5292's recorded abstract mentions differential and linear
      characteristics only, with no mention of impossible differentials, though the entry is an abstract-level
      stub and its silence is not evidence about the paper. RQ-SIMSPK-f6a6c0 explicitly names impossible-differential
      reach as part of the FULL computable portfolio that prior evaluation, as far as this program's
      corpus shows, did not cover, which makes this measure one of the RQ's named extension axes.
    verdict: 'UNVERIFIED. No statement is made about what any external publication contains regarding
      impossible differentials for SIMON. Assembled from known parts: miss-in-the-middle is a standard
      technique; support or truncated-difference propagation with one-sided soundness is standard;
      exhaustive verification of a propagation rule against brute-force reachability is the inventor
      protocol''s validation-ladder step 1. Claimed new only in combination and only locally: the
      propagation rule stated and verified specifically for the AND-RX round as a function of the
      rotation triple, and r_imp computed exhaustively across the entire constant space so that the
      standardized triple''s position is a percentile in a measured distribution rather than a single
      quoted number.'
  object_first_candidate:
    tracked_object: 'The difference SUPPORT of the Feistel state: a pair of subsets of Z/n, one per
      branch, recording which bit positions can carry a nonzero difference. Equivalently a vector
      in {0,1}^{2n} where a zero means the difference bit is forced inactive and a one means it may
      be active. What is followed through the computation is that support pattern, forward from a
      unit input difference and, under the inverse rule, backward from a unit output difference.'
    lossiness: 'Genuinely and aggressively lossy. Passing from an exact difference in {0,1}^{2n} to
      its support discards which of the up to 2^{2n} concrete differences is present, retaining only
      2n bits of which-positions-can-be-active information, and it discards all probability. The discard
      is compatible with the target operation asymmetrically, and the asymmetry is the whole design:
      rotation permutes supports exactly, XOR unions them exactly, and the AND is exact on the zero
      side, since two inactive inputs force an inactive output, and over-approximating on the active
      side. So the retained part propagates deterministically as an over-approximation, which means
      a certified disjointness is a real impossibility while an observed overlap is nothing at all.
      This one-sidedness is stated in every downstream record because reading an overlap as a possibility
      claim would be the characteristic misuse of the object.'
    propagation: One round sends the support pair (P_L, P_R) to (P_R union S^a(P_L) union S^b(P_L)
      union S^c(P_L), P_L), where S^d(P) denotes the rotate-by-d image of the position set P and the
      union across branches follows the Feistel XOR. The round key contributes nothing, since a key
      XOR cannot change which difference positions are active. Backward, the inverse Feistel gives
      (P_L, P_R) mapping to (P_R, P_L union S^a(P_R) union S^b(P_R) union S^c(P_R)), which is the
      same rule with the branches exchanged. Both are deterministic set operations costing O(n) per
      round, so a full forward-plus-backward sweep over all 2n by 2n unit endpoint pairs costs O(n^2
      r) set operations per constant.
    survival_score: The support pattern survives exactly as long as it is not saturated. Once every
      position is marked possibly-active in both branches the object has dissolved and carries no
      further information, so the concrete survival number is r_sat(a,b,c), the round count at which
      the forward support from a unit difference first reaches full support on both branches. r_imp
      is bounded above by r_sat forward plus r_sat backward, and reporting both makes clear that the
      measure is bounded by a diffusion property rather than by search effort. Typical expectation
      for a well-diffusing round is saturation within a small number of rounds, so r_imp is expected
      to be small, in the single digits to low teens, and the interest lies entirely in its VARIATION
      across the constant space rather than in its absolute size.
  null_object_control: 'Two nulls, both executable in the same invocation. The primary null object
    is a rotation triple drawn uniformly from (Z/n)^3, with the identical forward-backward propagation
    and the identical miss-in-the-middle sweep, giving the r_imp distribution over random constants.
    For any statement about the standardized triple to mean anything, this distribution must first
    be shown to have nonzero spread: if every random triple gives the same r_imp, the measure has
    no resolving power and the standardized triple''s rank is tie-breaking noise. The secondary null
    is a full-diffusion control, a round function replaced by a map whose support rule saturates both
    branches in one round, for which the propagation must report r_imp at its floor of one or two;
    if this control reports a large r_imp the propagation implementation is faulty and the signal
    arm is void. A third calibration arm runs the identical propagation on a purely linear round function
    whose support rule is exact rather than over-approximating, where r_imp can be cross-checked against
    exhaustive reachability.'
  discriminated_from:
  - IDEA-20260807-bbefda and the AES impossible-differential proposals concern a fixed cipher's published
    localisation and counting claims. Here the cipher is a free parameter and the deliverable is a
    distribution of an integer over that parameter space, with no counting model and no attack complexity
    anywhere in the pipeline.
  - Generic U-method or UID-method automated impossible-differential search, as commonly taught, is
    applied to one cipher to find its longest impossible differential. The move here is to hold the
    method fixed and sweep the parameter, treating the method's output as a scalar score of a constant
    rather than as a result about a cipher.
  - The differential-trail measure of the companion contract tracks exact differences with probabilities
    and is dominated by solver budget. This entry tracks supports with no probability and no search,
    so its censoring behaviour is entirely different and it serves as an independent instrument whose
    disagreement with the trail measure would itself be informative.
  - Division-property or integral reach, the companion measure, tracks monomial exponent sets and
    is sound in the opposite direction, certifying balancedness rather than impossibility. Support
    propagation and division propagation are different objects with different soundness polarity and
    must not be conflated in the portfolio.
  - KN-LIT-5292's stub records only differential and linear content. This proposal makes no claim
    that impossible differentials were or were not studied there, and treats any recovered primary
    text as a comparison rather than as a correction.
  assumptions:
  - The round function has the form f(x) = (S^a x AND S^b x) XOR S^c x with a Feistel structure and
    a key XOR; pinned in STAGE 0 against the specification and its test vectors.
  - Two inactive input difference bits force an inactive output difference bit through the AND, which
    is the sole source of the rule's soundness and is verified exhaustively at n <= 8 rather than
    assumed.
  - Round keys cannot change difference activity, so key schedule and round constants are irrelevant
    to this measure. This makes the measure key-independent by construction and is checked at n =
    8 by recomputation under several fixed keys.
  - 'Unit input and output differences are an adequate endpoint family for the sweep. This is a restriction,
    not a theorem: r_imp computed over unit endpoints is a lower bound on the true impossible-differential
    reach over all endpoints, and is reported as such.'
  - Orbit representatives from the symmetry-quotient contract are used where available; otherwise
    the raw grid is used and the multiplicity distortion is stated.
  predictions:
  - metric: containment failures of the support rule against exhaustive reachability at word sizes
      4, 6 and 8, over all triples and all input differences
    direction: lower
    minimum_effect: 0
  - metric: spread of r_imp over the random-constant null family, measured as the number of distinct
      r_imp values and the interquartile range
    direction: higher
    minimum_effect: forced minimum of 2 distinct values for the measure to be reported at all; below
      that, r_imp is declared to have no resolving power at this word size and no rank is quoted
  - metric: r_imp reported by the full-diffusion control
    direction: lower
    minimum_effect: 2
  - metric: percentile rank of the standardized triple in the r_imp distribution over orbit representatives
    direction: different
    minimum_effect: 'explicit refusal to pre-commit: the campaign has never computed this measure
      for any constant, so any predicted percentile would be invented. What is pre-committed is that
      the full distribution, the tie structure, and the orbit-weighted percentile are all reported
      together, and that a percentile is never quoted without the tie count at that value.'
  minimal_test:
    design: 'The whole measure is cheap enough that the minimal test is nearly the full test, which
      is unusual and is the reason this entry is high priority. Fix word size n = 8, block 16 bits.
      Support propagation costs O(n) set operations per round, so one constant swept over all 16 unit
      input differences, all 16 unit output differences and all splits up to r = 20 costs about 16
      times 16 times 20 times 20 elementary set unions, roughly 100 thousand operations, and the entire
      512-triple constant space costs about 50 million, well under a minute in pure Python. The verification
      arm is the expensive part and is still small: exhaustive reachable-difference sets at n = 8
      cost 2^8 inputs per input difference per triple, about 33 million round evaluations across the
      space. Run the random-constant null and the full-diffusion control in the same invocation. The
      single discriminating output is the pair (containment failures, spread of r_imp on the null):
      zero failures with nonzero spread licenses the whole measure for the campaign; any containment
      failure kills the rule; zero spread on the null kills the measure''s resolving power at this
      scale and is a clean, reusable measured obstruction that saves the campaign from ranking on
      noise.'
    controls:
    - Exhaustive reachability containment check at word sizes 4, 6 and 8, which verifies the propagation
      rule against ground truth rather than assuming it.
    - Full-diffusion control whose support saturates in one round and whose r_imp must sit at the
      floor, proving the pipeline can report a small value.
    - Purely linear round-function control where the support rule is exact, allowing r_imp to be cross-checked
      against exhaustive reachability end to end.
    - Random-constant null family establishing the r_imp distribution when nothing is designed, reported
      before the real family is interpreted.
    - Key-independence recomputation under several fixed nonzero keys at n = 8, confirming the measure
      is unaffected as the derivation claims.
    required_metrics:
    - containment_failures as an exact integer, per word size, against exhaustive reachability
    - r_imp(a,b,c) for every orbit representative, at each tested word size
    - r_sat(a,b,c) forward and backward, the saturation round counts
    - number of distinct r_imp values and the tie count at the standardized triple's value
    - r_imp distribution on the random-constant null family, with its interquartile range
    - r_imp reported by the full-diffusion and linear controls
    - wall-clock seconds and peak resident memory per stage
  falsification_conditions:
  - Any containment failure of the support rule against exhaustive reachability, which refutes the
    rule and voids every r_imp computed from it.
  - The full-diffusion control reporting a large r_imp, which shows the miss-in-the-middle logic is
    finding contradictions that are not there.
  - The linear control's r_imp disagreeing with its exhaustively computed value, which invalidates
    the end-to-end pipeline.
  - Fewer than 2 distinct r_imp values over the random-constant null family, meaning the measure has
    no resolving power at this word size and no ranking may be quoted.
  - r_imp exceeding r_sat forward plus r_sat backward for any constant, which is arithmetically impossible
    under the rule and indicates an implementation fault.
  - Key-dependence appearing in the recomputation under different fixed keys, which contradicts the
    derivation and means the object is not what it is claimed to be.
  confounders:
  - 'Restricting endpoints to unit differences is a choice, not a neutral one: constants whose best
    impossible differentials use higher-weight endpoints would be systematically undervalued, and
    the resulting ranking would reflect the endpoint family as much as the constant. The restriction
    is named in every record and a low-weight extension to Hamming weight 2 is run as a robustness
    arm.'
  - Support saturation is a diffusion property, so r_imp may be almost entirely determined by the
    greatest common divisor structure of a, b, c and n rather than by anything cryptanalytically interesting;
    if r_imp turns out to be a simple arithmetic function of those quantities, that is the finding
    and must be reported as such rather than as a security-relevant ranking.
  - An over-approximating rule that is too loose reports no contradictions anywhere and yields r_imp
    uniformly small, which would look like a null when it is an instrument failure; the linear control
    distinguishes these cases.
  - Degenerate triples with a = b make the AND idempotent and change the support rule's tightness;
    they are reported as a separate stratum and never pooled.
  - Using the raw grid instead of orbit representatives inflates apparent spread by counting symmetric
    duplicates, so the percentile of the standardized triple would shift for reasons unrelated to
    the measure.
  interpretation_limits:
  - r_imp is a lower bound on impossible-differential reach under a specific over-approximating rule
    and a specific unit-endpoint family. It is not the true reach and may not be quoted as one.
  - A certified disjointness is a real impossibility for the modelled propagation; an observed overlap
    is not a possibility claim of any kind, and no record may read it as one.
  - An impossible differential of length r is not an attack on r rounds and implies no key-recovery
    cost, no data complexity and no security statement about any variant.
  - All results are scoped to the tested word sizes, the pinned round-function form, and the unit-endpoint
    family, and nothing about designer intent follows in either direction.
  target_complexity:
    time_exponent: 'No attack exponent is claimed. Instrument cost only: support propagation is O(n)
      per round per constant, so a full sweep over the constant space at word size n with endpoint
      family size E and round ceiling R costs O(n^3 E^2 R n) set operations, about 5 times 10^7 at
      n = 8 and about 10^{10} at n = 16 unless restricted to orbit representatives, which is why representatives
      are used.'
    memory_exponent: No attack memory exponent is claimed. Each support is 2n bits held as one Python
      integer, and the whole sweep holds O(E R) supports at a time, kilobytes. The verification arm
      holds one reachable-difference set of at most 2^n elements, 256 at n = 8.
    best_known: 'The incumbent for this measure inside this campaign is nothing: RQ-SIMSPK-f6a6c0
      states that impossible-differential reach is part of the portfolio prior evaluation did not
      cover as far as this program''s corpus shows, and the corpus contains no computed value for
      any constant. The incumbent for the technique is generic automated impossible-differential search
      applied one cipher at a time, which this proposal does not contest and merely re-points at a
      parameter sweep.'
    hidden_overhead: 'Hidden in the lower-order terms: the backward rule must be derived for the inverse
      Feistel independently rather than assumed symmetric, and getting it wrong produces contradictions
      that look like findings. Hidden in the human cost: deciding the endpoint family in advance and
      refusing to widen it after seeing which constants it favours. Hidden in the reporting: r_imp
      is an integer with heavy ties, so a percentile without a tie count is close to meaningless and
      the tie count must travel with every rank.'
  dominated_by: 'n/a (no result claimed). Pareto check performed across time, memory and data/queries:
    no attack, distinguisher or query procedure is produced, so no frontier row exists on any axis.
    Among instruments, exhaustive reachability dominates the support rule on tightness at every word
    size where it is computable, roughly n <= 10 here, and is dominated by it on reach at every larger
    size; the rule is used only above that crossover and is validated below it.'
  sota_delta: no attack; conceptual/measurement contribution only. The quantitative deliverables are
    the exact integer count of containment failures, predicted zero, the r_imp distribution over the
    constant space with its tie structure, and the crossover word size at which exhaustive reachability
    stops being computable in this environment. No time, memory or data complexity is compared against
    any cryptanalytic frontier because none is produced.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Part (A), that impossible-differential reach yields a budget-independent
    integer: 0.9, since the propagation is set arithmetic with no search. Part (B), that the union
    rule as stated is sound: 0.85, the zero-side determinism of the AND is elementary, and the residual
    is entirely in the Feistel and backward-rule bookkeeping where an error is easy to make and easy
    to catch. Part (C), that exhaustive verification confirms it with zero containment failures: 0.8,
    conditional on (B), with failures being informative rather than fatal since they would localize
    the defect. Part (D), that r_imp has enough spread across the constant space to rank anything:
    0.45, this is the real risk, because r_imp may be governed almost entirely by greatest-common-divisor
    arithmetic and collapse to two or three values; a collapse is a clean measured obstruction and
    is worth knowing before the campaign spends on trail search. That the standardized triple lands
    anywhere notable: not predicted, and deliberately so.'
