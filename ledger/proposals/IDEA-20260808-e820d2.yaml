    computes e, G, or the component dimensions. Externally it may be folklore inside MAYO''s
    design rationale, which is why novelty_status is unverified and the spec read is step
    one.'
  estimated_cost: 'Implementation low: a UOV/MAYO toy key generator (needed slice-wide anyway),
    an ideal saturation call, a point counter, a minors-ideal builder. Compute low: Part A
    is arithmetic; Part B is minutes per cell at q=4 and q=16 toy sizes.'
  recommended_priority: high
  honest_prior_of_survival: 'That the sign pattern holds across the slice: ~0.9, the only
    risk being my RECALLED tuples. That the two derived consequences hold at toy scale: ~0.8.
    That the closure in (iv) survives the saturation measurement: ~0.8. That the fingerprint
