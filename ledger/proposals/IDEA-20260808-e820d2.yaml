  source_refs:
  - MAYO, UOV, QR-UOV and SNOVA specifications -- REQUIRED READS, NOT YET READ BY THIS PROGRAM.
  - KN-TECH-004, KN-TECH-011 (internal: solving degree and degree of regularity).
  proof_search_map:
    bottleneck: Whether the differential rank condition on a plain-UOV-type map yields a constraint
      strictly stronger than the public system itself. If it does not, the whole differential-MinRank
      route is closed for this family.
    baseline_embedding:
      parameter_slice: e = 0 exactly (o = n-m). There the oil component and the generic component
        have equal dimension and the rank condition becomes exactly vacuous at the boundary;
        the criterion must return "no dominance, no MinRank" there.
      reproduction_check: Symbolic at e=0 plus a frozen toy fixture at (q,n,m,o) = (16,10,6,4),
        where both predictions are boundary values and any implementation that reports a strict
        effect is mis-calibrated.
    observation_collision:
      observable: The integer e, and the pair (dim V(P) top component, dim rank-drop locus).
      distinct_preimage_search: 'COLLISION FOUND AND CONCEDED: e is a function of (n,m,o)
        only, so a genuine UOV key and a random system with a planted o-dimensional isotropic
        subspace have the same e and the same predicted dimensions. The planted null is the
        additional condition that separates them, and if it does not separate them the honest
        reading is that e describes the regime rather than the scheme -- stated in advance
        rather than discovered later.'
    constructive_transforms:
    - transform: stronger_invariant
      proposed_object: Replace "the oil space is a solution component" by the graded pair
        (component dimension, rank-drop codimension), preserving more state than the dominance
        question alone requires -- and it is that extra state which produces the isolation
        gap G and hence the closure.
      predicted_gain: A closure with a computable margin (G) rather than a yes/no, so a future
        parameter tweak can be scored against it.
    quantifier_order: FORALL published parameter sets in the slice, and FORALL x in the rank-drop
      locus, membership of x in O is NOT implied by the rank condition unless G <= 0. The
      witness x is allowed to depend on the key; no uniform-over-keys statement is made, which
      is why HA-2's tail check hunts for individual weak keys where the locus collapses.
    method_ceiling:
      strongest_certifiable_claim: '"On plain-UOV-type maps the differential rank condition
        turns on exactly when the public system already dominates, so it is never strictly
        stronger." It cannot certify anything about MinRank on the span of the public matrices,
        which is the Rainbow route.'
    nearby_object_control: A Rainbow-style layered map at matched (n,m,o), where a low-rank
      element DOES exist in the span of the public matrices and MinRank genuinely bites. The
      method must distinguish that object from a plain UOV map; if it reports the same verdict
      for both, it has not identified the load-bearing structure.
    proof_obligations:
    - claim: e>0 iff the oil space is the top-dimensional component of V(P).
      responsibility: correctness
    - claim: e>0 iff the differential rank condition is non-vacuous.
      responsibility: correctness
    - claim: The rank-drop locus has codimension e*o.
      responsibility: size
    - claim: G > 0 at every published MAYO set, hence no isolation.
      responsibility: strictness
    - claim: The closure covers only the differential route, not the public-span route.
      responsibility: scope
