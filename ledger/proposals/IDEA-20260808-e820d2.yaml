idea:
  id: IDEA-20260808-e820d2
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-MAYO-001
  goal_id: GOAL-MAYO-001
  title: The excess defect e = o - (n - m) is one integer, positive for MAYO alone in this
    slice, and it is SIMULTANEOUSLY the condition for the oil space to be the top-dimensional
    component of V(P) and for the differential MinRank condition rank DP(x) <= n-o to stop
    being vacuous -- a coincidence which, worked through, CLOSES the differential-MinRank
    route because the two conditions are the same condition
  class: mechanism
  claim: 'DERIVED THIS SESSION. Let P be a UOV map with n variables, m equations, oil space
    O of dimension o over F_q, and DP(x) the m x n differential matrix with rows x^T P_a.
    THREE ELEMENTARY FACTS AND ONE CLOSURE. (i) V(P_1..P_m) in P^{n-1} contains P(O) of dimension
    o-1, while by Krull every other component has dimension at least, and generically exactly,
    n-1-m. So O is the TOP-DIMENSIONAL component precisely when o-1 > n-1-m, i.e. when e :=
    o - (n-m) > 0. (ii) For x, w in O we have x^T P_a w = 0, so the row space of DP(x) lies
    in O-perp and rank DP(x) <= n-o, while for generic x the rank is min(m,n) = m. The MinRank
    condition "rank DP(x) <= n-o" is therefore NON-VACUOUS precisely when m > n-o, i.e. precisely
    when e > 0. The same integer switches both on, and a third equivalent phrasing is "there
    are more public equations than vinegar variables". (iii) SIGN TABLE, RECALLED and to be
    re-read: MAYO-1 (16,66,64,8) e=+6; MAYO-2 (16,78,64,18) e=+4; MAYO-3 (16,99,96,10) e=+7;
    MAYO-5 (16,133,128,12) e=+7; uov-Ip (256,112,44,44) e=-24; QR-UOV flattened e strongly
    negative; SNOVA flattened (n=464,m=80,o=80) e=-304. Whipping is the unique structural
    addition in this slice that changes the sign. (iv) THE CLOSURE, derived from (i) and (ii)
    together. The rank-drop locus {x : rank DP(x) <= n-o} has expected codimension (m-(n-o))(n-(n-o))
    = e*o, hence dimension n-1-e*o; define the ISOLATION GAP G := (n-o) - e*o, so the locus
    isolates P(O) only when G <= 0. At RECALLED MAYO parameters G = 10, 19 and 37 -- it does
    not isolate. And intersecting the rank condition with the public system buys nothing,
    because at e > 0 the public system ALONE already has P(O) as its top component. So the
    differential-MinRank route turns on exactly when it becomes redundant. NAMED OBSTRUCTION:
    the two conditions are equivalent, so the rank condition can never be strictly stronger
    than what P(x)=0 already gives.'
  mechanism: 'Whipping exists so MAYO can take o far below m while keeping n close to m, which
    is what shrinks the public key; that choice is exactly what drives e positive. The consequence
    chain is dimension-theoretic and needs no genericity beyond Krull for the lower bound:
    small o with n near m gives o-1 > n-1-m, hence the oil space dominates V(P), hence a uniformly
    random F_q-solution of the PUBLIC system is an oil vector with probability 1 - O(q^{-e}),
    hence the reconciliation attack carries no q^{n-2o} guessing factor. The closure in (iv)
    is the same arithmetic read in the other direction.'
  why_not_a_renamed_known_approach: 'Nearest known methods: the reconciliation attack, and
    MinRank / rectangular MinRank on the differential, which is the line that broke Rainbow.
    Both are standard. What is not standard is the identification of ONE integer that switches
    both on, the computation of its sign across the whole slice, and the observation that
    its dual role is a closure rather than an opening. The record also explains a known fact
    it did not set out to explain: Rainbow fell to MinRank because a LAYERED structure puts
    a low-rank element in the span of the PUBLIC MATRICES, which is a different object from
    the differential at a point, and plain-UOV-type maps have no such element -- which is
    why the differential route is the only one available here and why it is subsumed. Nearest
    internal record: IDEA-20260805-258212 derives five identities on how whipping dilates
    the parameter triple; it produces no e, no component dimensions, and no rank locus.'
  predictions:
  - observable: e = o - (n - m) at every published parameter set of all five schemes
    metric: integer, sign
    predicted: Positive for MAYO only; negative for UOV, QR-UOV and SNOVA under both flattening
      conventions.
  - observable: number of F_q-solutions of the public system at toy cells with e swept from
      -2 to +3
    metric: count, against q^{max(o, n-m)}
    predicted: Matches q^o in e>0 cells and q^{n-m} in e<0 cells, with the crossover at e=0.
      A count matching q^{n-m} inside an e>0 cell falsifies fact (i).
  - observable: fraction of solutions of P(x)=0 lying in O, across the e-sweep
    metric: fraction in [0,1]
    predicted: 1 - O(q^{-e}), so above 0.99 already at q=16, e=2, and near q^{-|e|} for e<0.
  - observable: rank DP(x) for x in O versus generic x, at e>0 and e<0 cells
    metric: integer ranks
    predicted: A strict gap (<= n-o versus m) in e>0 cells and NO gap in e<0 cells, because
      there min(m,n) <= n-o already.
  - observable: dimension of the rank-drop locus, measured by ideal saturation at toy cells
    metric: integer dimension, against n-1-e*o
    predicted: Equal to n-1-e*o, and strictly greater than o-1 whenever G > 0 -- which confirms
      the closure. A measured dimension equal to o-1 while G > 0 would REOPEN the route and
      is the outcome that would make this record wrong in the most interesting way.
  minimal_test: 'PART A, zero compute: read the five specifications, tabulate (q, n, m, o)
    -- flattening SNOVA by ell^2 and QR-UOV by ell, and reporting both flattenings -- and
    compute e and G. One table. PART B, toy: at (q,n,m,o) = (16,8,7,3) [e=+2], (16,10,9,4)
    [e=+3], (16,10,7,4) [e=+1], (16,10,5,4) [e=-1], (16,10,4,4) [e=-2], with 20 keys each:
    count the F_q-solutions of the public system (exhaustively at q=4 replicas, algebraically
    at q=16), classify each as in O or not using the known secret, compute rank DP(x) on 1000
    oil and 1000 generic x, and measure the rank-drop locus dimension by saturating the ideal
    by I(O). Compare every measurement against the two nulls below.'
  controls:
  - 'PLANTED NULL, the decisive one: a random system of m quadratics constructed to vanish
    on a random o-dimensional subspace, at identical (q,n,m,o). If the e>0 UOV key behaves
    identically, the effect belongs to the REGIME and not to the UOV structure, and the record
    says exactly that -- which is still the correct and more useful answer.'
  - 'RANDOM NULL: a uniformly random system at the same (q,n,m). Solution count must match
    q^{n-m}; differential must show no rank gap.'
  - 'SIGN-FLIP CONTROL: every measurement repeated at an e<0 cell. An effect that survives
    the sign flip is an artifact.'
  - 'e-SWEEP: with (q,n,m) held fixed and o varied so e runs -2,-1,0,+1,+2,+3, the measured
    fraction-in-O must move monotonically through 1 - O(q^{-e}). A quantity that does not
    respond to e is the canonical artifact tell and voids the record.'
  confounders:
  - At toy sizes the non-oil components need not have their generic dimension n-1-m; the saturation
    measurement addresses this directly rather than assuming it.
  - Flattening SNOVA and QR-UOV to F_q is a modelling choice and a different flattening changes
    (n,m,o); both are reported, and the ambiguity is exactly what M1-05's twist-support measurement
    is designed to resolve.
  - 'e > 0 is NOT by itself a weakness: extra solutions do not make finding one easier if
    the remaining solve is a hard, barely-overdetermined MQ instance -- and barely-overdetermined
    is precisely the LARGE-d_reg regime. Both effects must be reported together or the comparison
    misleads in MAYO''s disfavour.'
  - MAYO's own analysis may already price reconciliation as a pure solve with no guessing
    factor, in which case fact (i) is in the design and the contribution reduces to the cross-scheme
    fingerprint plus the closure. That is a real possibility and is priced into the prior
    below rather than argued away.
  falsification_conditions:
  - Any published MAYO set has e <= 0, or any published UOV/QR-UOV/SNOVA set has e > 0.
  - Toy solution counts in e>0 cells match q^{n-m} rather than q^o.
  - The planted null reproduces every measured effect, making the finding a controlled null.
  - The measured fraction-in-O fails to move across the e-sweep.
  - The rank-drop locus is measured at dimension o-1 while G > 0, which would reopen the closed
    route.
  interpretation_limits: e is a parameter-counting fingerprint and a positive e is a statement
    about the geometry of the public variety, not a cost. No attack is claimed. The closure
    in (iv) is scoped exactly to the DIFFERENTIAL MinRank route on plain-UOV-type maps; it
    says nothing about MinRank on the span of the public matrices (the Rainbow route, which
    needs a layered structure absent here), about rank conditions over extension fields (which
    is M1-01's territory), or about the support-minors modelling of any other object. Toy
    measurements are toy (AGENTS.md rule 7). All parameter tuples are RECALLED until the specifications
    are read.
  assumptions:
  - Krull's height theorem bounds component dimension from below (rigorous).
  - The oil space is F_q-rational of dimension exactly o (definitional).
  - The expected codimension formula (m-r)(n-r) for rank <= r applies to the linear matrix
    pencil DP(x) (generic; measured in Part B).
  heuristic_assumptions:
  - id: HA-1
    statement: For a UOV public map, the components of V(P_1..P_m) other than P(O) have dimension
      exactly n-1-m, uniformly over (q,n,m,o) in the tested range.
    rigorous_ingredient: Krull's height theorem gives dimension at least n-1-m for every component
      of an intersection of m hypersurfaces in P^{n-1}; only the upper bound is heuristic.
    distribution_imitated: '"The non-oil part of a UOV system behaves like a generic system
      of m quadrics" -- the same imitation behind every semi-regularity assumption in this
      family.'
    validation_route: At each toy cell, saturate the ideal by I(O), take the dimension of
      the quotient exactly, for 20 keys, and compare against n-1-m. TOY SCALE, explicitly.
    tail_checks: Report the maximum observed excess dimension. A systematic excess of even
      1 means UOV keys carry a second unexpected component -- a finding in its own right that
      must be reported, not averaged away, since it would shift the e threshold.
  - id: HA-2
    statement: 'The rank-drop locus {x : rank DP(x) <= n-o} has codimension exactly e*o in
      P^{n-1}, uniformly for 1 <= e <= 3 and 2 <= o <= 4 at the tested q.'
    rigorous_ingredient: The determinantal codimension (m-r)(n-r) is an upper bound on codimension
      for ANY matrix of linear forms (the locus is cut by the (r+1)-minors), so the locus
      has dimension at least n-1-e*o unconditionally; only the exactness is heuristic.
    distribution_imitated: The generic determinantal variety codimension, i.e. "DP(x) behaves
      like a generic pencil of m x n matrices of linear forms".
    validation_route: Compute the rank-drop locus dimension by minors-ideal saturation at
      each toy cell for 20 keys and compare against n-1-e*o. TOY SCALE. Crucially, run the
      SAME measurement on the planted null, where the pencil is genuinely generic apart from
      the plant.
    tail_checks: Record the minimum observed dimension across keys. A key where the locus
      collapses to dimension o-1 is a weak key for the differential route and would reopen
      it for that key -- such a key must be reported individually, not averaged.
  target_complexity:
    time_exponent: 'No new attack. The comparative statement: in the e<0 regime the reconciliation
      attack carries a q^{n-2o} guessing factor; in the e>0 regime that factor is absent and
      the cost is the bare cost of solving m quadratics in n-o+1 variables. The exponent moved
      is the GUESSING exponent, from q^{n-2o} to q^0. The closure adds nothing to either,
      which is its content.'
    memory_exponent: Unchanged by this record. The reconciliation solve's memory is binom(n-o+d_reg,
      d_reg) field elements and must be charged in both regimes; the e>0 regime's barely-overdetermined
      shape makes d_reg LARGER, so the memory is worse exactly where the time factor is better.
    best_known_baseline: The published key-recovery rows of MAYO and of plain UOV. This record
      does not beat them; it determines which formula applies and closes one candidate improvement
      to them.
    hidden_overhead_disclosure: '"No guessing factor" hides that the remaining solve sits
      at m/(n-o+1) near 1, the large-d_reg regime. Reporting the guessing saving without the
      d_reg cost would be a one-sided accounting and is forbidden by the record''s own metrics
      list.'
    time_memory_tradeoff: Not applicable -- this is a parameter-regime statement, not an algorithm.
  sota_delta: 'No attack, hence no cost delta. Deliverables: a five-scheme table of one integer
    with its sign; the derived statement that whipping is the unique addition in the slice
    that flips it; the isolation gap G = (n-o) - e*o computed at every set (RECALLED 10, 19,
    37 for MAYO-1/3/5); and a closure of the differential-MinRank route with a named obstruction.
    Against the corpus this is new: no record contains e, G, or the component-dominance criterion.'
  dominated_by: 'As an attack: n/a (no result claimed). As a structural statement: not dominated
    by any corpus record. Frontier rows checked -- IDEA-20260805-258212 (dilation identities),
    IDEA-20260805-977e16 (alpha* underdetermination), IDEA-20260805-74e78c (emulsifier defect),
