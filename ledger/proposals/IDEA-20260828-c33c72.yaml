idea:
  id: IDEA-20260828-c33c72
  title: >-
    Repairing a red-team-identified defect in this program's only linear-
    cryptanalysis attempt: does two-round AES linear-hull coherence survive
    per-key evaluation, or is it an artifact of averaging over keys? --
    introducing the linear hull / expected-linear-potential (ELP) object,
    absent from every one of the 16 filed RQ-AES-001 proposals, correctly.
  class: control
  claim: >-
    Catalogue entry A1-3 (ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/A1.md,
    lines 280-347) computed a two-round AES linear-hull "coherence factor"
    F(alpha,beta) = |sum_gamma W(alpha,gamma) W(gamma,beta)| / (256^2 *
    max_gamma |W(alpha,gamma)W(gamma,beta)|/256^2) as a KEY-FREE sum of 255
    class-determined LAT terms with signs from Tr(b*0x63) alone. This
    program's OWN committed red-team review of that entry
    (ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/REDTEAM.md, line 249 and
    section 4 systemic defect 1) found this WRONG: "the linear hull of a
    KEYED super-box carries a key-dependent sign (-1)^{<gamma,k>} on each
    intermediate mask... F(alpha,beta) is not the key-free quantity the
    frozen histogram claims, and the r=2,3,4 measurement arms will not
    produce it." No filed RQ-AES-001 proposal has asked the REPAIRED
    question that defect leaves open, and none of the 16 filed proposals
    uses a linear-cryptanalysis lens at all (the RQ-AES-001 off-limits
    enumeration itself names integral/square, impossible differential,
    MITM/Demirci-Selcuk, boomerang, biclique, division property -- linear
    cryptanalysis is NOT among them, and its total absence from this
    program's AES ledger is a coverage gap, not a deliberate exclusion).
    THE REPAIRED OBJECT: for a FIXED (unknown) key, the true two-round hull
    correlation at an intervening mask set gamma is a SIGNED sum
    L_k(alpha,beta) = sum_gamma sign(gamma,k) * W(alpha,gamma) W(gamma,beta)
    / 256^2, where sign(gamma,k) = (-1)^{<gamma, k_mid>} depends on the
    actual (fixed, unknown) intermediate round-key bits k_mid -- standard
    Nyberg/Selcuk linear-hull theory (RECALLED, UNVERIFIED this session),
    under which the EXPECTED LINEAR POTENTIAL ELP(alpha,beta) =
    E_K[L_K(alpha,beta)^2] equals sum_gamma W(alpha,gamma)^2 W(gamma,beta)^2
    / 256^4 -- a SUM OF SQUARES, with cross terms cancelling in expectation
    over keys, NOT the sum-of-magnitudes A1-3 computed. TWO DISCRIMINATED
    OUTCOMES, tested by direct FIXED-KEY encryption measurement (never
    assembled from LAT class sums): (a) if the measured |correlation| at
    individual fixed keys clusters around sqrt(ELP) (this record's correctly
    re-derived prediction) and shows the key-to-key sign variation the ELP
    theory predicts, two-round hull structure is confirmed as a genuine,
    correctly quantified property of AES's fixed-key behavior, and a
    linear-analogue of IDEA-20260808-76260d's active-S-box LP-dual program
    (bounding LINEAR rather than differential trail weight) becomes a
    concrete, currently-unstarted successor lane; (b) if the fixed-key
    measurement instead matches an UNCORRELATED-SIGN null at the SAME
    magnitude as a random-bijective-S-box arm, A1-3's original headline is
    CLOSED as a key-averaging artifact rather than a fixed-key property, per
    docs/inventor-protocol.md section 4's closure standard.
  mechanism: >-
    Matsui's piling-up lemma extends across an XOR key-mixing layer by
    attaching a sign factor equal to (-1) raised to the inner product of the
    linear mask with the round-key bits at that layer; for a single trail
    this sign only flips the OVERALL sign of a correlation whose MAGNITUDE
    is unaffected by the key. For a HULL (multiple trails sharing input and
    output masks but differing in an intermediate mask gamma), each trail's
    contribution to the total correlation carries its OWN sign
    (-1)^{<gamma, k_mid>}, and because gamma ranges over 255 distinct
    nonzero values while k_mid is FIXED per key, different trails' signs
    depend on the SAME key through DIFFERENT linear functionals of it --
    they do not all align. A1-3's construction summed |W(alpha,gamma)
    W(gamma,beta)| directly (equivalent to assuming every sign is +1,
    i.e. implicitly averaging away the sign rather than tracking it), which
    the red-team review correctly identifies as measuring a KEY-FREE
    quantity with no operational meaning at a fixed key. THE TRACKED OBJECT
    here is the REPAIRED PAIR (L_K(alpha,beta), ELP(alpha,beta)): the
    signed, key-dependent hull correlation and its second moment over keys.
    This is a genuinely different, and correctly lossy, projection from
    A1-3's: it discards the individual trail identities and the specific
    intermediate mask values (many mask sets share one ELP), but --
    unlike A1-3's discard -- it does NOT discard the round-key's role in
    determining sign, which is exactly the discard the lossy-projection test
    (docs/inventor-protocol.md section 2) and the red-team review both flag
    as incompatible with the target's actual operations (a key-mixing layer
    genuinely acts on the retained quantity, not merely on the discarded
    part). Nearest established family: linear cryptanalysis / the linear
    hull effect (Nyberg 1994, RECALLED_UNVERIFIED as to exact citation and
    theorem statement this session) -- declared explicitly as the lens used,
    since RQ-AES-001's off-limits enumeration does not name it and its total
    absence from this program's 16 filed AES proposals is the coverage gap
    this record closes, correctly rather than by repeating A1-3's error.
  novelty_status: unverified
  citations:
    - ref: "ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/A1.md (entry A1-3, lines 280-347)"
      provenance: internal
      claim: >-
        Computed a "two-round linear-hull coherence factor" as a key-free
        sum of 255 LAT-class-determined terms, predicting F > 1 for many
        (alpha,beta) pairs.
      verified_by: "idea-generator subagent (read A1.md lines 214-347 in full during idea generation)"
    - ref: "ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/REDTEAM.md (line 249 and section 4, systemic defect 1)"
      provenance: internal
      claim: >-
        "A1-3 -> per-key computation only. The linear hull of a keyed
        super-box carries a key-dependent sign (-1)^{<gamma,k>} on each
        intermediate mask. The entry computes 'the exact 255-term hull'
        with no key anywhere, so F(alpha,beta) is not the key-free quantity
        the frozen histogram claims, and the r=2,3,4 measurement arms will
        not produce it." Independently confirmed as a systemic pattern
        (defect 1: "the lossy-projection test is passed on paper while the
        instrument, not the target, is what gets measured").
      verified_by: "idea-generator subagent (read REDTEAM.md in full during idea generation)"
    - ref: "Nyberg, 'Linear Approximation of Block Ciphers' (Eurocrypt 1994) and the subsequent linear-hull / expected-linear-potential literature (Selcuk and others), exact citation not confirmed this session"
      provenance: recalled
      claim: >-
        The expected linear potential over random keys of a linear hull
        equals the sum of squared correlations of its constituent trails,
        with cross-terms cancelling under a key-equidistribution assumption
        -- the standard theoretical basis for treating a hull's fixed-key
        behavior as distinct from its key-free (LAT-only) magnitude.
      verified_by: null
    - ref: "ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/A1.md (entry A1-1, lines 145-214, and DEDUP.md flag flag-3)"
      provenance: internal
      claim: >-
        A1-1 (the DDT-based differential class-collapse enumeration) shares
        one enumeration engine with A1-3, per this program's own dedup
        note; this record reuses only A1-3's LAT-class machinery, not A1-1's
        differential one, and states the distinction explicitly.
      verified_by: "idea-generator subagent (read A1.md and DEDUP.md in full during idea generation)"
  assumptions:
    - "The pinned FIPS-197 harness supplies the real AES S-box and MixColumns matrix used to build the LAT (linear approximation table) via Walsh-Hadamard transform."
    - "The intermediate round-key bits k_mid, as K ranges over real AES keys via the real key schedule, are equidistributed enough for the ELP cross-term-cancellation argument to approximately hold; NOT assumed to be exactly independent uniform bits, and named as HA-1 below with its own validation route."
    - "The two-round window (one AES super-box, matching A1-3's own scope) is the correct scope for a first test; extension to more rounds is explicitly deferred pending this record's own r=2 result, per A1-3's own untestable-beyond-r4 resolution argument."
  proof_search_map:
    bottleneck: >-
      Whether the sign-cancellation argument underlying ELP(alpha,beta) =
      sum_gamma W(alpha,gamma)^2 W(gamma,beta)^2 / 256^4 (cross-terms
      vanishing in expectation over keys) actually holds for AES's REAL key
      schedule, whose round-key bits are NOT independent uniform bits
      (per IDEA-20260828-25fae7's own annihilator computation, only
      448/448/672 bits of true freedom exist per key size) but a
      deterministic, highly structured function of a much smaller key.
    baseline_embedding:
      parameter_slice: >-
        The IDENTITY-S-BOX degenerate case (S replaced by the identity),
        whose hull must contain exactly one nonzero term and whose ELP
        collapses to the single-trail correlation squared -- a hand-known
        fixture A1-3 itself specifies as its known-answer gate.
      reproduction_check: >-
        This degenerate fixture must reproduce F = 1.000 (equivalently,
        ELP = single-trail correlation squared) for every (alpha,beta)
        before the real S-box's ELP is trusted.
    observation_collision:
      observable: >-
        the fixed-key measured |correlation| L_K(alpha,beta), compared
        against sqrt(ELP(alpha,beta)) on one hand and against A1-3's
        original (defective) key-free sum on the other.
      distinct_preimage_search: >-
        The dangerous collision is a fixed-key measurement that happens to
        match BOTH predictions within noise at the tested data volume,
        which would fail to discriminate; the pre-registered sample size is
        chosen so the two predictions differ by more than the measurement's
        resolution (sqrt(ELP) is generically far smaller than A1-3's
        unsigned sum whenever the 255 terms have mixed signs, by a
        square-root-versus-linear-in-255-terms gap).
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          the SIGNED, key-dependent hull correlation L_K(alpha,beta) and its
          second moment ELP(alpha,beta), replacing A1-3's unsigned key-free
          sum.
        predicted_gain: >-
          converts a red-team-identified defective instrument into a
          correctly quantified one, either confirming genuine per-key hull
          exploitability or certifying the original headline as a
          key-averaging artifact.
    quantifier_order: >-
      FOR a fixed pair of masks (alpha,beta) and two rounds, over a SAMPLE
      of independently drawn keys K, DOES the empirical distribution of
      L_K(alpha,beta) match the theoretical ELP-derived prediction (typical
      magnitude near sqrt(ELP), with sign varying roughly independently
      across keys) -- an existence-of-agreement question about ONE fixed
      mask pair and ONE round count, not a universal claim about all hulls
      or all round counts.
    method_ceiling:
      strongest_certifiable_claim: >-
        "for the tested mask pairs at r=2, the fixed-key hull correlation
        magnitude is consistent with sqrt(ELP), not with A1-3's original
        unsigned sum" -- a statement about THIS SPECIFIC repaired
        instrument at r=2, with no claim about r >= 5 (declared
        untestable-here in advance by A1-3's own resolution argument,
        inherited unchanged) and no claim about any other mask pair.
      nearby_object_control: >-
        A random-bijective-S-box arm at identical wiring (same branch
        number, no AES-specific algebra), which must show the SAME
        ELP-consistent behavior if the sign-cancellation mechanism is
        generic to any S-box of AES's shape rather than AES-specific --
        printed beside every AES result per A1-3's own control design.
    proof_obligations:
      - claim: "identity-S-box degenerate fixture reproduces F=1.000 / single-trail ELP exactly"
        responsibility: baseline
      - claim: "the LAT (build via Walsh-Hadamard transform) matches A1-3's own independently reported 255-class structure (max|W|=32)"
        responsibility: correctness
      - claim: "ELP(alpha,beta) is computed correctly as sum of squared per-trail correlations"
        responsibility: correctness
      - claim: "fixed-key measurement uses direct encryption sampling, never LAT-assembled sums"
        responsibility: interface
      - claim: "random-bijective-S-box null arm is run at identical wiring"
        responsibility: scope
      - claim: "sample size is pre-registered so the two competing predictions (sqrt(ELP) vs A1-3's original sum) are resolvable apart"
        responsibility: size
  predictions:
    - metric: "identity-S-box degenerate fixture's measured F (or ELP-derived equivalent)"
      direction: different
      minimum_effect: "exactly 1.000 (single nonzero term), reproducing A1-3's own known-answer gate"
    - metric: "fixed-key measured |correlation| L_K(alpha,beta) for a pre-frozen set of (alpha,beta) pairs, over >= 30 independent keys at r=2"
      direction: different
      minimum_effect: >-
        median magnitude across keys within a factor of 2 of sqrt(ELP(alpha,beta))
        as computed from the LAT; a median magnitude close to A1-3's ORIGINAL
        unsigned-sum value instead falsifies the repair's prediction and
        would (surprisingly) rehabilitate A1-3's original claim
    - metric: "sign of L_K(alpha,beta) across the >= 30 sampled keys, for a fixed (alpha,beta)"
      direction: different
      minimum_effect: "roughly balanced between positive and negative across keys (consistent with key-dependent sign, not a fixed sign)"
    - metric: "same fixed-key measurement on the random-bijective-S-box null arm"
      direction: different
      minimum_effect: >-
        statistically indistinguishable magnitude distribution from the AES
        arm, both consistent with their own respective ELP predictions -- if
        the AES arm departs from ITS ELP while the null arm matches its own,
        the departure is AES-specific and independently reportable
    - metric: "max|W(a,b)| over the LAT, independently recomputed"
      direction: different
      minimum_effect: "exactly 32 (correlation 2^-3), matching A1-3's own independently reported value, as a build-correctness gate"
  minimal_test:
    design: >-
      (1) Build the LAT via Walsh-Hadamard transform from the pinned
      harness's real S-box; verify max|W|=32 and the 255-class structure
      A1-3 itself reports, independently recomputed. (2) Run the
      identity-S-box degenerate fixture as the known-answer gate. (3)
      Compute ELP(alpha,beta) for a pre-frozen set of (alpha,beta) pairs
      (one-active masks, matching A1-3's own frozen set) from the LAT
      directly (sum of squared trail correlations), WITHOUT any key. (4)
      For >= 30 independently sampled real AES keys, measure the ACTUAL
      two-round correlation L_K(alpha,beta) by direct chosen-plaintext
      encryption sampling at the pre-registered data volume, never
      assembled from LAT class sums. (5) Compare the empirical distribution
      of |L_K| against sqrt(ELP) and against A1-3's original unsigned sum.
      (6) Repeat steps 3-5 on a random-bijective-S-box arm at identical
      wiring as the null.
    controls:
      - "Identity-S-box degenerate fixture (F=1.000 / single-trail ELP), run first."
      - "Random-bijective-S-box null arm at identical wiring, per A1-3's own control design."
      - "Independent recomputation of the LAT and its 255-class structure, not accepted from the catalogue's reported numbers."
      - "Pre-registered sample size and mask-pair set, committed before any AES-arm measurement is read (ordering control), so the resolution gap between the two competing predictions is fixed in advance."
    required_metrics: ["LAT max|W| and class count", "ELP(alpha,beta) per frozen pair", "per-key measured L_K(alpha,beta) magnitude and sign for >= 30 keys", "A1-3's original unsigned-sum value for the same pairs", "null-arm equivalents", "identity-fixture reproduction"]
  falsification_conditions:
    - "The identity-S-box degenerate fixture does not reproduce F=1.000 / single-trail ELP exactly -- instrument bug, stop."
    - "The independently recomputed LAT does not show max|W|=32 or the 255-class structure -- LAT build is wrong, stop before any ELP computation."
    - "The fixed-key measured |L_K(alpha,beta)| median matches A1-3's ORIGINAL unsigned-sum prediction rather than sqrt(ELP) -- this record's repair is itself wrong, or (less likely) the sign-cancellation argument fails for AES's structured (non-uniform) round-key bits, which would be a genuinely interesting positive finding requiring its own follow-up."
    - "The random-bijective-S-box null arm shows a magnitude distribution inconsistent with ITS OWN ELP prediction -- the measurement instrument itself (not the S-box algebra) is broken."
    - "Signs of L_K(alpha,beta) across sampled keys are NOT roughly balanced (e.g. all positive) -- the key-dependent sign mechanism is not behaving as theorized and HA-1 is falsified."
  confounders:
    - "The ELP cross-term-cancellation argument assumes round-key bits behave enough like independent uniform bits for the cancellation to hold approximately; AES's real key schedule constrains round-key bits far more (per IDEA-20260828-25fae7's annihilator computation), and this record's HA-1 names that gap explicitly rather than assuming it away."
    - "A1-3's own resolution argument declares r >= 5 untestable-here in advance (measurement resolution below the predicted effect size); this record inherits that ceiling unchanged and makes no r >= 5 claim."
    - "Sample-size limits at 30 keys may leave the sign-balance and magnitude-distribution checks noisy; the pre-registered sample size and its resulting resolution floor are reported explicitly alongside any result, not silently assumed sufficient."
  interpretation_limits: >-
    Toy/control tier, RQ-AES-001 ceiling. This record repairs a documented
    defect in an unfiled catalogue entry and introduces linear cryptanalysis
    to this program's RQ-AES-001 ledger for the first time; it is not a
    distinguisher, not a key recovery, and makes no claim about full-round
    AES or about the published linear-cryptanalysis literature's actual
    numbers (Nyberg/Selcuk citations here are RECALLED and UNVERIFIED). A
    positive result (fixed-key behavior matching ELP) opens, but does not
    itself constitute, a linear-analogue successor to
    IDEA-20260808-76260d's active-S-box LP-dual program; a negative result
    (A1-3-consistent behavior after all, or null-indistinguishable behavior)
    closes A1-3's original headline as a key-averaging artifact per
    docs/inventor-protocol.md section 4.
  heuristic_assumptions:
    - id: HA-1
      statement: >-
        As K ranges over real AES keys (via the real, structured key
        schedule, not independent uniform round-key bits), the sign
        (-1)^{<gamma, k_mid>} for each intermediate mask gamma in the hull
        is equidistributed over {+1,-1} closely enough that cross-terms in
        E_K[L_K(alpha,beta)^2] approximately cancel, imitating the classical
        assumption (used throughout provable-security treatments of Markov
        ciphers) that round-key material behaves like an independent
        uniform string for the purpose of averaging arguments -- the
        "stochastic equivalence" / wrong-key-randomization-style hypothesis
        this program has already named elsewhere (e.g. IDEA-20260808-4c309d's
        HA-1, for a different quantity).
      rigorous_support: >-
        Exact for round-key bits that are genuinely independent uniform;
        the real AES key schedule's round-key bits are a deterministic
        GF(2)-affine (pre-S-box) function of far fewer free bits (per
        IDEA-20260828-25fae7's own annihilator computation), so equidistribution
        of any SPECIFIC linear functional <gamma, k_mid> is not automatic
        and is exactly what this record tests rather than assumes.
      validation_plan: >-
        Directly measure, over >= 200 sampled real AES keys and each of the
        pre-frozen gamma values, the empirical fraction of keys giving each
        sign, and compare to the 50/50 split the cancellation argument
        needs; report the per-gamma imbalance (not just an aggregate),
        since a SINGLE badly-imbalanced gamma is enough to bias ELP for
        mask pairs where that gamma dominates the sum.
  target_complexity:
    time_exponent: >-
      No attack proposed. If this record's positive branch holds (fixed-key
      hull behavior matches ELP), it opens -- but does not itself execute --
      a LINEAR-cryptanalysis analogue of IDEA-20260808-76260d's active-S-box
      LP-dual/integrality-gap program (bounding LINEAR trail weight rather
      than differential), named here as forward guidance per
      docs/inventor-protocol.md section 4, not claimed as a result of this
      record.
    memory_exponent: "negligible -- LAT is 65536 entries (256KB-scale), hull enumeration 255 terms, measurement arms at most a few times 2^32 encryptions across ~30-50 keys."
    best_known: >-
      No linear-cryptanalysis result of any kind exists anywhere in this
      program's filed RQ-AES-001 ledger; A1-3's unfiled, red-team-identified-
      defective catalogue entry is the only prior attempt, and this record
      is its correction.
    hidden_overhead: "none disclosed beyond the stated resolution ceiling (r>=5 untestable-here, inherited from A1-3's own argument)."
    tradeoff_note: "not applicable; no attack, no time-memory tradeoff proposed by this record itself."
  dominated_by: >-
    Checked all 16 filed RQ-AES-001 proposals: none uses a linear-
    cryptanalysis lens, so none dominates or is dominated by this record on
    its actual question. Catalogue entry A1-3 is DOMINATED BY this record on
    CORRECTNESS (this record fixes A1-3's own committed red-team-identified
    defect) but is not itself a filed ledger competitor. External
    literature (Nyberg/Selcuk linear-hull theory) is the actual established
    frontier this record's ELP formula imitates; it is RECALLED and
    UNVERIFIED this session, and this record makes no claim to move that
    frontier, only to correctly introduce it into this program's ledger for
    the first time.
  sota_delta: >-
    Zero attack delta. The delta is closing a documented, red-team-identified
    defect in this program's only linear-cryptanalysis attempt and replacing
    it with the theoretically correct (ELP-based) discriminating test --
    either a genuine positive lead (per-key exploitable hull coherence,
    opening a linear-analogue successor to the active-S-box LP-dual program)
    or a scoped closure (A1-3's headline certified as a key-averaging
    artifact) -- where previously the corpus held only an unfiled entry
    already known, by its own red team, to measure the wrong quantity.
