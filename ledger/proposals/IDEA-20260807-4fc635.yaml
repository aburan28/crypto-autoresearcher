idea:
  id: IDEA-20260807-4fc635
  question_id: RQ-MODEL-e61cb2
  added: '2026-08-07'
  title: >-
    THE NULL OBJECT FOR "MODEL MATTERS" IS THE SAME MODEL UNDER A RANDOM CHANGE
    OF COORDINATES - build the PGL_2(F_p) null battery (random Moebius per
    variable, with the number of randomised variables as the decay parameter),
    plus the translation-conjugate shifted-Kummer null x_R(P) = x(P - R) which
    must reproduce every measurement EXACTLY after retargeting; without these two
    controls no number produced anywhere in L11 may be attributed to a model
  class: control

  claim: >-
    (A) THE CONTROL THIS LANE CANNOT DO WITHOUT, STATED AS AN OBJECT RATHER THAN
    AS A CAVEAT. Every L11 measurement compares a named model (Montgomery,
    Edwards, Hessian, Jacobi quartic, Kummer) against short Weierstrass on one
    fixed curve. Every one of those named models is, on the coordinate that
    matters, a Moebius reparametrisation of the Weierstrass x-coordinate. So the
    correct null is not "a different curve" and not "a random polynomial system" -
    it is THE SAME MODEL UNDER A RANDOM ELEMENT OF PGL_2(F_p). If a random Moebius
    substitution reproduces the effect a named model shows, the effect is a
    property of reparametrisation and carries no information about the model.

    (B) THE NULL BATTERY, SPECIFIED COMPLETELY SO IT CAN BE IMPLEMENTED WITHOUT
    FURTHER DESIGN.
      NULL-1 RANDOM MOEBIUS, PER VARIABLE. Draw mu_1,...,mu_m independently and
      uniformly from PGL_2(F_p). Substitute t_i -> mu_i(t_i) into the summation
      polynomial and clear denominators; substitute the same into the membership
      polynomial. DECAY PARAMETER r = the number of variables actually randomised,
      swept r = 0, 1, ..., m. At r = 0 every measurement must equal the Weierstrass
      baseline exactly. Predicted behaviour of the three key quantities as r grows:
        per-variable degree - EXACTLY CONSTANT at 2 (Moebius is degree-preserving);
        monomial support - jumps from 13 to 27 at r >= 1 and stays there;
        Groebner solving-degree proxy and wall time - [open], and this is the
        measurement that decides whether L11's other arms mean anything.
      NULL-2 RANDOM AFFINE, PER VARIABLE. The sub-battery mu_i(t) = alpha_i t +
      beta_i, which is exactly the Montgomery relation
      (IDEA-20260807-e6d79e). DECAY PARAMETER beta -> 0, at which the support must
      return to 13. This is the sharpest artifact test in the battery because it
      has a known endpoint.
      NULL-3 THE SHIFTED KUMMER COORDINATE, WHICH IS A NULL WITH ZERO TOLERANCE.
      For R in E(F_p) define x_R(P) := x(P - R). This is a degree-2 coordinate for
      every R (the degree-2 maps E -> P^1 are exactly the quotients by the
      involutions P -> Q - P, and x_R is the one with Q = 2R). It is NOT a Moebius
      transform of x - it is a genuinely different coordinate - yet the whole setup
      is translation-conjugate to the standard one: writing P_i = R + P_i', the
      condition sum P_i = target becomes sum P_i' = target - mR. So EVERY
      measurement must agree EXACTLY after retargeting: same degree, same support
      SIZE, same solving degree, same wall time up to noise. Any discrepancy is an
      instrument fault, not a model effect. NULL-3 is the battery's calibration
      standard because its predicted answer is exact equality rather than a
      distribution.
      NULL-4 THE SYMMETRY NULL. For any arm claiming a symmetry-induced sparsity
      (the Edwards parity grading of IDEA-20260807-78eafe, the Montgomery
      palindrome of IDEA-20260807-e6d79e), the null is the SAME CURVE WITHOUT THE
      RELEVANT RATIONAL TORSION. On a curve with no rational 2-torsion the parity
      grading cannot exist in any coordinate, so the check must FAIL there. A
      symmetry test that passes on a curve lacking the symmetry is measuring an
      implementation artifact.
      NULL-5 THE PLANTED-SIGNAL POSITIVE CONTROL, because a null battery that can
      only fail to detect is not an instrument. Construct a coordinate that
      genuinely does have a larger rational deck group - the coordinate x^2 on a
      j = 1728 curve with 4 | p - 1, whose deck group is mu_4 - and confirm the
      pipeline DOES report the predicted per-variable degree 4^(m-2) and Bezout
      B^(m-1)/4. An instrument that reports "no effect" for every arm including
      this one is broken.

    (C) WHY THIS IS A SEPARATE RECORD RATHER THAN A SECTION OF EACH ARM. Three
    reasons, each concrete. First, the battery is shared: implementing it once
    serves all eight sibling proposals and makes their numbers comparable, which
    is exactly the role DECOMPOSITION.md L14 assigns to instrumentation. Second,
    the battery has its own falsification conditions that are independent of any
    model claim - NULL-3's exact-equality prediction and NULL-5's planted-signal
    detection can both fail on their own, and either failure invalidates every
    other L11 number. Third, and most importantly under docs/inventor-protocol.md,
    "controls before belief" means the control must exist BEFORE the measurement,
    not be retrofitted to explain an inconvenient result.

    (D) THE PRE-REGISTERED INTERPRETATION TABLE, WRITTEN NOW SO IT CANNOT BE TUNED
    LATER. For any quantity Q measured on a named model M and on the Weierstrass
    baseline W:
      Q(M) = Q(W) and Q(NULL-1) = Q(W)  =>  Q is a model invariant. Report as such.
      Q(M) != Q(W) and Q(NULL-1) = Q(M) =>  Q is a REPARAMETRISATION artifact.
        No model claim may be made. This is the expected verdict for support size.
      Q(M) != Q(W) and Q(NULL-1) = Q(W) =>  Q is a genuine model effect. This is
        the only cell in the table that licenses a model claim, and it is expected
        to be occupied only by symmetry-derived quantities (parity grading,
        palindrome) on curves that actually have the relevant torsion.
      Q(NULL-3) != Q(W) after retargeting => INSTRUMENT FAULT. Halt; report nothing.
      Q(NULL-5) shows no effect => INSTRUMENT BLIND. Halt; report nothing.

  resource_label: >-
    "audit: consumes no resource" - this record mounts no attack, consumes no
    non-generic structure, and exists to make other records' resource claims
    checkable. Under DECOMPOSITION.md section 2 it is the L14 role applied inside
    L11.
  admissibility: admissible
  admissibility_argument: >-
    ADMISSIBLE VACUOUSLY AND DELIBERATELY SO. The admissibility filter asks
    whether a lane names a resource that escapes the generic-group closure
    (KN-FIND-b7e091, H-ENDO-001). A control record names no resource because it
    makes no claim about the ECDLP; it is an instrument. Filing it inside L11
    rather than deferring it to L14 is a scoping decision, not a resource claim:
    the nulls here are specific to coordinate change and would be wasted effort in
    a generic instrumentation lane.

  discriminated_from:
    - >-
      DECOMPOSITION.md L14 (RQ-INSTR-f8faa0), the campaign's general
      instrumentation lane. This record instantiates L14's requirement for the
      SPECIFIC null shape that coordinate change demands - a random element of
      PGL_2 acting per variable - which a general-purpose null battery would not
      contain.
    - >-
      The matched-random-system nulls used elsewhere in this program (for example
      the matched random polynomial systems in IDEA-20260806-e4f96e). Those match
      on SHAPE - variable count, degree multiset, support size, Newton polytope -
      and are the right null for a claim about a polynomial system. They are the
      WRONG null here, because the L11 claim is about the map from a curve to a
      coordinate, and the matched object must therefore be another coordinate on
      the same curve, not another polynomial of the same shape.
    - >-
      EV-REP-001's control structure, which compared Weierstrass Semaev against
      Weierstrass collinearity and diagnosed the difference as a formulation
      artifact. That was the right instinct applied to one arm; this record
      generalises it into a battery and applies it to every arm, including the
      Edwards one where EV-REP-001 did not apply it.
    - >-
      IDEA-20260807-1354d8, the METER proposal. That record asks WHAT to measure;
      this one asks WHAT TO MEASURE IT AGAINST. Both are needed and neither
      substitutes for the other: a good meter with no null produces confident
      artifacts, and a good null with a saturated meter produces confident
      nothings.

  object_first_candidate:
    tracked_object: >-
      THE ORBIT OF A MEASUREMENT UNDER PGL_2(F_p)^m - for each quantity Q the
      lane reports, the distribution of Q over random per-variable
      reparametrisations of the same curve and the same points.
    established_families_off_limits: >-
      Off-limits as primary lens: every attack family, since no attack is
      proposed. The object is a distribution of a statistic under a group action.
    lossiness: >-
      LOSSY AND COMPATIBLY SO, and the lossiness is what makes it a control rather
      than a duplicate computation. The projection "measurement -> its PGL_2 orbit
      distribution" forgets the particular coordinate entirely and retains only
      what is invariant under reparametrisation. It is not a change of coordinates
      in disguise - the fibre over a given orbit distribution contains every
      coordinate in the orbit, a set of size up to |PGL_2(F_p)| = p^3 - p. It
      propagates deterministically under the operation the lane performs - change
      of model - because model change IS an element of the group being averaged
      over, so applying a model change permutes the orbit and leaves the
      distribution fixed by construction. That is exactly why a quantity whose
      orbit distribution is a point mass is a model invariant and a quantity whose
      orbit distribution is spread is not.
    propagation: >-
      One step - apply one more random Moebius map - either leaves the quantity
      unchanged (invariant: degree, Bezout) or resamples it from the orbit
      distribution (non-invariant: support, coefficients, possibly wall time).
      Measuring which of the two happens IS the control, and it is a one-step
      measurement by construction.
    survival_score: >-
      Survives as long as the lane compares degree-2 coordinates, which is all of
      L11 except the Hessian-x arm. For a coordinate of degree n != 2 the group is
      not PGL_2 acting on one line and the battery must be extended - which is a
      named limitation rather than a silent gap, and it is why NULL-1 is not
      applied to IDEA-20260807-5f5ace's x arm without modification.

  mechanism: >-
    STEP 1 - IMPLEMENT THE SUBSTITUTION MACHINERY. A function that takes a
    polynomial in t_1,...,t_m, a tuple of PGL_2(F_p) matrices, and returns the
    reparametrised polynomial with denominators cleared and the result reduced to
    its squarefree part. Verified on the identity element (must return the input)
    and on a composition (mu then nu must equal mu-composed-with-nu applied once).
    STEP 2 - NULL-3 FIRST, BECAUSE IT HAS AN EXACT ANSWER. Implement x_R(P) =
    x(P - R), build the full decomposition system in that coordinate with the
    retargeted right-hand side, and confirm EXACT agreement with the baseline on
    every metric the lane reports. This is the calibration gate: if the pipeline
    cannot reproduce itself under a translation, no other null result is
    interpretable. GATE.
    STEP 3 - NULL-5 SECOND, BECAUSE AN INSTRUMENT MUST DETECT SOMETHING. Build a
    j = 1728 curve with 4 | p - 1, take the coordinate x^2 whose deck group is
    mu_4, and confirm the pipeline reports per-variable degree 4^(m-2) and Bezout
    B^(m-1)/4 rather than the generic 2^(m-2) and B^(m-1)/2. GATE.
    STEP 4 - THE DECAY SWEEP. For r = 0..m, apply r random Moebius maps, repeat
    over 30 independent draws, and record the distribution of every lane metric.
    Report per-metric: the value at r = 0, the distribution at r = m, and whether
    the two are distinguishable.
    STEP 5 - THE AFFINE SUB-BATTERY AND ITS ENDPOINT. Sweep beta from random to 0
    with alpha fixed and confirm the support returns to exactly 13 at beta = 0.
    STEP 6 - THE SYMMETRY NULL. On a curve with no rational 2-torsion, confirm the
    parity and palindrome checks of the sibling records FAIL. On a curve with
    rational 2-torsion, confirm they PASS in the diagonalising coordinate and FAIL
    under a random Moebius map. That two-by-two is the strongest evidence the lane
    can produce that a symmetry effect is real.
    STEP 7 - PUBLISH THE TABLE. Emit the interpretation table of (C) filled in for
    every metric the lane measures, so that each sibling record's headline number
    arrives with its verdict cell already assigned.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Grep over ledger/ and knowledge/ for "null object", "matched null", "decay
      parameter", "PGL", "change of coordinates" (2026-08-07). Full reads of
      docs-adjacent material via KN-TECH-056, DECOMPOSITION.md L14,
      ledger/EV-REP-001.yaml, ledger/proposals/IDEA-20260806-e4f96e.yaml.
    results: >-
      INTERNAL - the null-object discipline is established program practice
      (KN-TECH-056, docs/inventor-protocol.md, and the mandatory
      null_object_control field in this very batch's brief), and matched-random
      nulls appear in several proposals. "PGL" returns no hits. NO record specifies
      a random-reparametrisation null for a coordinate-change claim, and none uses
      the translation-conjugate shifted coordinate as an exact-equality
      calibration standard. The battery as a whole is new to this repository; the
      DISCIPLINE it implements is not, and no novelty is claimed for the discipline.
      EXTERNAL - no claim of novelty against external literature; randomised
      reparametrisation as a control is standard experimental practice.
    verdict: adaptation

  null_object_control: >-
    THIS RECORD IS THE NULL OBJECT, so its own control is the POSITIVE one:
    NULL-5, the planted signal. An instrument that reports "no effect" everywhere
    is indistinguishable from an instrument that is not connected, and the j = 1728
    coordinate x^2 with deck group mu_4 is the cheapest available object on which a
    real effect is predicted by theory (IDEA-20260807-dadcd2) and must be detected.
    DECAY PARAMETER for the positive control: the order of the deck group, swept
    over g = 2 (generic curve), 4 (j = 1728 with 4 | p - 1), 6 (j = 0 with
    6 | p - 1). The measured Bezout must track B^(m-1)/g across all three; a
    measurement that does not respond to g is blind and the battery is unusable.

  assumptions:
    - >-
      All arms compared under NULL-1 use degree-2 coordinates, so PGL_2 acting on
      the target line is the right group. The Hessian x arm needs a different
      group and is excluded from NULL-1 by construction.
    - >-
      "Exact agreement" in NULL-3 means exact for algebraic quantities (degree,
      support size, Bezout, solving degree) and within measurement noise for wall
      time. The noise model must be declared before the run, not after.
    - >-
      PGL_2(F_p) is sampled uniformly by rejection from 2x2 matrices with nonzero
      determinant; the sampler is itself tested for uniformity on small p.
    - >-
      j = 1728 and j = 0 curves with the required congruence conditions on p exist
      at toy scale, which is checked rather than assumed.

  proof_search_map:
    not_applicable_reason: >-
      This is a purely instrumental and empirical proposal. It asserts no theorem,
      no asymptotic bound, no certificate family and no reduction; it specifies a
      control battery and its pass/fail conditions. The one quasi-theoretical
      element - that x_R(P) = x(P - R) is a degree-2 coordinate for every R,
      because degree-2 maps E -> P^1 correspond to involutions P -> Q - P - is
      elementary, is used only to justify the null's construction, and is checked
      empirically by fibre enumeration in Step 2 rather than proved here. Where
      that fact is load-bearing for a claim it is carried by
      IDEA-20260807-dadcd2, whose proof_search_map covers it.

  predictions:
    - metric: >-
        per-variable degree of the reparametrised summation polynomial as the
        number of randomised variables r goes 0 -> m
      direction: different
      minimum_effect: >-
        EXACTLY CONSTANT at 2, for every r and every draw. Zero variance. Any
        variation falsifies the degree-preservation of Moebius substitution and
        invalidates every degree claim in the lane.
    - metric: >-
        monomial support size as r goes 0 -> m
      direction: higher
      minimum_effect: >-
        13 at r = 0, jumping to 27 for r >= 1 and staying at 27, in at least 28 of
        30 draws. This establishes that support 27 is the GENERIC value and that
        any model reporting less than 27 is genuinely structured.
    - metric: >-
        every lane metric under NULL-3 (shifted Kummer coordinate) after
        retargeting, compared to the Weierstrass baseline
      direction: different
      minimum_effect: >-
        EXACT equality for all algebraic metrics and agreement within the declared
        noise band for wall time. This is the calibration gate and it has zero
        tolerance on the algebraic side.
    - metric: >-
        monomial support under NULL-2 as the affine shift beta goes to 0
      direction: lower
      minimum_effect: EXACTLY 13 at beta = 0. A support that does not return is the canonical artifact tell.
    - metric: >-
        Bezout number under NULL-5 as the deck order g sweeps 2, 4, 6
      direction: lower
      minimum_effect: >-
        EXACTLY B^(m-1)/g at each g, i.e. a factor 2 drop from g = 2 to g = 4 and a
        factor 3 from g = 2 to g = 6. Failure to detect means the battery is blind
        and no negative from it is publishable.
    - metric: >-
        Groebner solving-degree proxy and wall time under NULL-1 at r = m, versus
        the same at r = 0
      direction: different
      minimum_effect: >-
        [open] AND THIS IS THE POINT. If a random reparametrisation changes the
        measured solving cost, then measured solving cost is not a model invariant
        and every wall-time comparison in L11 - including EV-REP-002's 0.09s versus
        31s - must be read against the reparametrisation distribution rather than
        against a single baseline. The size of that distribution's spread is the
        number this record most wants.

  minimal_test:
    design: >-
      STAGE 1 (minutes, GATE): substitution machinery, identity and composition
      tests.
      STAGE 2 (minutes, GATE): NULL-3 exact reproduction under the shifted Kummer
      coordinate.
      STAGE 3 (minutes, GATE): NULL-5 planted-signal detection at g = 4 on a
      j = 1728 toy curve.
      STAGE 4 (an hour): the r-sweep with 30 draws per r, recording every lane
      metric's distribution.
      STAGE 5 (minutes): the beta -> 0 affine endpoint test.
      STAGE 6 (an hour): the symmetry-null two-by-two (torsion present or absent)
      x (diagonalising coordinate or random).
      STAGE 7 (zero compute): publish the filled interpretation table.
    controls:
      - identity element of PGL_2 (must be a no-op)
      - composition consistency of two substitutions
      - shifted Kummer coordinate with exact-equality prediction
      - planted deck-group signal at g = 4 and g = 6
      - a curve without rational 2-torsion for the symmetry null
      - >-
        a deliberately broken substitution (denominators not cleared), which the
        identity test must catch
    required_metrics:
      - per-variable and total degree, per draw, per r
      - support size distribution, per r, with min, median, max over 30 draws
      - Bezout number, per arm and per g
      - Groebner proxy and wall time distributions, per r
      - exact-equality pass/fail for NULL-3, per metric
      - detection pass/fail for NULL-5, per g
      - the filled interpretation table

  falsification_conditions:
    - >-
      NULL-3 fails exact reproduction on any algebraic metric. INSTRUMENT FAULT;
      the entire L11 measurement programme halts until it is fixed, and no sibling
      record's numbers may be reported.
    - >-
      NULL-5 fails to detect the g = 4 planted signal. The battery is blind;
      every negative it would produce is uninterpretable.
    - >-
      Per-variable degree varies under NULL-1. Moebius substitution is not
      degree-preserving as implemented, which means the substitution machinery is
      wrong.
    - >-
      Support does not return to 13 as beta -> 0. Canonical artifact tell.
    - >-
      The identity element of PGL_2 is not a no-op. Implementation error.
    - >-
      The symmetry checks pass on a curve without the relevant rational torsion.
      The symmetry claims of the sibling records are artifacts and must be
      withdrawn.

  confounders:
    - >-
      DENOMINATOR CLEARING introduces a scalar and possibly a spurious factor;
      every substituted polynomial must be normalised and squarefree-reduced, and
      the normalisation convention frozen before Stage 4.
    - >-
      A random Moebius map can accidentally be close to the identity or can move a
      branch point to infinity, both of which produce atypical support. Report the
      full distribution over 30 draws, never a single draw.
    - >-
      Wall time at toy scale is dominated by sympy overhead rather than by the
      mathematics; the wall-time arm of this battery is therefore weak evidence and
      must be labelled so. The algebraic metrics carry the weight.
    - >-
      j = 1728 and j = 0 toy curves are rare and their availability depends on p
      mod 4 and p mod 3; a failed NULL-5 due to no suitable curve is an
      INFRASTRUCTURE outcome (AGENTS.md rule 5), not a blindness finding.
    - >-
      NULL-3 requires x(P - R) to be computed with the SAME code path as x(P), or
      an apparent discrepancy will be a code-path artifact rather than a
      mathematical one.

  interpretation_limits:
    - >-
      ASYMPTOTIC CEILING, STATED AS THE BRIEF REQUIRES. This record claims NO
      exponent change of any kind - it claims nothing about the ECDLP at all. It
      is an instrument. Its strongest possible output is a statement about which of
      L11's measured quantities are reparametrisation-invariant, which bounds what
      the other eight records may assert but does not itself assert anything about
      cost. Diem's and Gaudry's model-agnostic asymptotics are untouched and are in
      fact the reason the battery expects invariance.
    - >-
      The battery covers degree-2 coordinates. Higher-degree coordinates need a
      different group and are explicitly out of scope.
    - >-
      A null result from this battery bounds attribution, not existence: showing
      that support 27 is generic does not show that no coordinate has small
      support, only that any small-support coordinate is atypical and therefore
      structured - which is exactly what the lane wants to find.
    - >-
      Toy scale (p up to about 32 bits, pure Python); claim_tier toy.

  reachability_gate: >-
    TRIVIAL, AND FOR THIS RECORD IT IS TRIVIAL BY CONSTRUCTION IN BOTH DIRECTIONS.
    T5 (DECOMPOSITION.md section 3) charges a cost for reaching a SPECIFIED curve
    in an isogeny class. This record reaches no curve. NULL-1 and NULL-2 sample
    uniformly from a group of size p^3 - p that is reachable by drawing four field
    elements, so if anything the null is MORE reachable than any named model.
    NULL-3 requires a random R in E(F_p), which is one point sample. NULL-5
    requires a j = 1728 or j = 0 curve, which is NOT reachable from an arbitrary
    isogeny class (DECOMPOSITION.md T4 - j = 1728 requires D_0 = -4 and j = 0
    requires D_0 = -3, both class-determined), but this record CONSTRUCTS such a
    curve directly rather than walking to one, so no reachability cost is incurred
    and no attack is implied. The gate is passed and the record says so explicitly
    rather than leaving the field blank.

  target_complexity:
    time_exponent: >-
      NOT APPLICABLE - no algorithm is proposed and no attack exponent is claimed
      or affected. The record's own compute cost is 30 draws x (m + 1) values of r
      x a handful of curves, each a sympy elimination at 16 bits.
    memory_exponent: >-
      NOT APPLICABLE. Peak memory is that of the largest substituted polynomial,
      which is bounded by the dense (2,2,2) box, i.e. 27 coefficients at m = 3.
    best_known: >-
      For the ECDLP itself, unchanged and uncontested: rho at 0.886 sqrt(N) with
      O(1) memory (KN-TECH-001, KN-TECH-006), BSGS at sqrt(N)/sqrt(N)
      (KN-TECH-031), automorphism-discounted rho (KN-TECH-018), Semaev index
      calculus at exp(c sqrt(log N log log N)) (KN-FIND-f8c290). For CONTROLS
      specifically, the incumbent in this program is the matched-random-system null
      used in the DREG and BKK lanes; this battery is the coordinate-change
      analogue and does not replace it.
    hidden_overhead: >-
      None claimed, because nothing asymptotic is claimed. The honest cost
      disclosure is that the battery multiplies every L11 measurement by about 30x
      (the draw count), and that this is the price of being allowed to attribute
      any of them to a model.
    tradeoff_note: >-
      Not applicable to cryptanalysis. The one methodological tradeoff is draw
      count versus confidence: 30 draws distinguish a point mass from a spread
      distribution but not two nearby distributions; if a sibling record needs the
      latter, it must fund more draws and say so.
  dominated_by: >-
    AS AN ATTACK - n/a, no result claimed, and therefore dominated trivially by
    every row of the frontier, which was nevertheless checked so this field is not
    a bare null: parallel rho with distinguished points (0.886 sqrt(N) group
    operations, O(1) memory, 0 queries) KN-TECH-001/KN-TECH-006;
    automorphism-discounted rho on CM curves KN-TECH-018; BSGS (sqrt(N) time,
    sqrt(N) memory) KN-TECH-031; Semaev index calculus KN-FIND-f8c290 with BKK
    constants KN-FIND-2a8b7e/KN-FIND-c7d31e. None is approached on any of time,
    memory or queries.
    AS A CONTROL - dominates the current L11 practice, which has none: EV-REP-001
    and EV-REP-002 compared models without any reparametrisation null, so their
    "model-invariant" conclusion could not have distinguished invariance from a
    saturated metric. Dominated by nothing, because no coordinate-change null
    exists in this repository to be dominated by.
  sota_delta: >-
    Zero speedup against any attack baseline; none is sought. Quantified
    instrument delta: converts N unreplicated single-coordinate measurements into
    N distributions over 30 reparametrisation draws each, with a pre-registered
    four-cell interpretation table; adds two hard gates (NULL-3 exact reproduction,
    NULL-5 planted-signal detection at g = 4) that the existing L11 evidence base
    has never passed; and costs a 30x multiplier on toy-scale sympy time, which at
    16 bits is minutes.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.95 that per-variable degree is exactly invariant under NULL-1 - it is a
    property of substitution. 0.9 that support jumps to 27 and stays. 0.85 that
    NULL-3 reproduces exactly, with the residual risk being a retargeting sign
    error rather than mathematics. 0.7 that NULL-5 detects the g = 4 signal, the
    risk being that a suitable j = 1728 toy curve with the right congruence is
    awkward to build. And the honest headline expectation: 0.6 that the Groebner
    wall time under NULL-1 shows a SPREAD large enough to swallow the model
    differences the lane is trying to measure - in which case this control record
    is the one that produces L11's actual finding, which is that the lane's
    wall-time comparisons were never resolvable in the first place.

