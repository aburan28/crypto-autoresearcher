idea:
  id: IDEA-20261007-59fcd6
  added: '2026-10-07'
  status: proposed
  approved_by: null
  question_id: RQ-SSI-001
  title: >-
    Three rational 2-isogenies from y^2 = x^3 + x over F_17 have at
    least two distinct codomain j-invariants
  class: measurement
  claim: >-
    Toy instance only. Over F_17 the polynomial x^3 + x has three
    roots, so E: y^2 = x^3 + x has three affine rational 2-torsion
    points. Each gives a Vélu 2-isogeny and a codomain j-invariant in
    F_17. The number of distinct codomain j-invariants is at least 2.
    A count of 1 is the negative outcome. This is not an edge census
    of the supersingular subset and not a kernel-degree sum. The rho
    exponent stays 1/2.
  mechanism: >-
    PAIR. Representation: the set of codomain j-invariants.
    Operation set Sigma is the three 2-isogenies from the rational
    2-torsion. Sigma is not translation. Trichotomy: partial-action.
    The dual of each isogeny returns to E, and the update does not
    read a secret scalar. Lossy-projection test: discard kernel
    polynomials and keep the set of codomain j-invariants. The open
    number is the size of that set, predicted at least 2.
  novelty_status: unverified
  citations:
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Isogenous curves share group-structure invariants. Three
        codomain j-invariants are not three weakness classes.
      verified_by: coordinator session 2026-10-07 opened knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: Generic discrete logarithms need Omega(sqrt(p)) group operations.
      verified_by: coordinator session 2026-10-07 opened knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
  assumptions:
    - 17 ≡ 1 mod 4, so x^2 + 1 splits over F_17 and x^3 + x has three roots. Recalled from the congruence, checked by enumerating the seventeen field elements in the test.
    - Each rational order-2 point determines one Vélu isogeny of degree 2.
  proof_search_map:
    not_applicable_reason: A count of three codomain j-invariants, not a cost proof.
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
  predictions:
    - metric: number of distinct codomain j-invariants
      direction: higher
      minimum_effect: at least 2
  minimal_test:
    design: >-
      List the roots of x^3 + x over F_17. Require three roots. For
      each root R, compute the Vélu codomain j. Report the size of
      the set of those j-invariants.
    controls:
      - >-
        Root-count control: exactly three roots. Any other count
        invalidates the run.
      - >-
        Domain j is computed once and is not required to equal a
        codomain j. Collapsing a codomain with the domain is a
        separate recorded bit and does not change the codomain-set size.
    required_metrics:
      - rational_root_count
      - distinct_codomain_j
  falsification_conditions:
    - Three roots are found and the three codomain j-invariants are equal.
    - The root count is not 3. The run is invalid, not support.
    - A timeout is infrastructure, not a falsification.
  confounders:
    - Isomorphic codomain models share j. Count j, not coefficients.
    - The dual isogeny is not a fourth codomain from E. Do not add it.
  interpretation_limits:
    - At least two codomain j-invariants is not a path and not an exponent change.
    - This is not IDEA-20261005-5cbadc, which compares internal edges with edges that leave the F_p supersingular subset.
    - Negative evidence closes only this curve over F_17.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The three rational 2-isogenies from a curve with full rational
        2-torsion are not all isomorphic to one another, so at p = 17
        on y^2 = x^3 + x the codomain-j set has size at least 2.
      rigorous_support: >-
        Full rational 2-torsion gives three kernels. Equality of the
        three codomain j-invariants is not ruled out by that count.
        Distinctness is the unproved part.
      validation_plan: >-
        Enumerate the three roots and the three codomain j-invariants.
        No second curve in this proposal.
  target_complexity:
    time_exponent: p^{1/2} times (log p) to a constant power, unchanged
    memory_exponent: constant at this toy
    best_known: >-
      Supersingular 2-isogeny path finding remains p^{1/2} up to log
      factors. Three codomains do not change the exponent.
    hidden_overhead: No o(1) is claimed.
    tradeoff_note: Three evaluations. No table.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: >-
    Opened KR-RHO-755e35 and KR-RHO-13bf67. Neither states this
    three-codomain count. KR-RHO-13bf67 dominates any exponent
    reading. Exponent difference 0.
  sota_delta: >-
    Exponent difference 0. Counted delta: distinct codomain
    j-invariants at least 2, against the negative count 1.
