idea:
  id: IDEA-20261006-534e34
  question_id: RQ-CSIDH-64343f
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: coordinator
  title: >-
    Kronecker splitting and rational degree-l edges name the same
    four-prime set at p=47
  class: measurement
  claim: >-
    Let p = 47. Let L be the set {3, 5, 7, 11}. Let Split be the
    set of l in L with Kronecker symbol (-p / l) equal to 1. Let A
    be the smallest integer in {1, ..., p-2} such that the Montgomery
    curve E: y^2 = x^3 + A*x^2 + x over F_p is nonsingular and
    supersingular, where supersingular means the integer
    #E(F_p) - (p+1) is 0, and nonsingular means the curve is not
    singular. If no such A exists, the claim is false. Otherwise
    let Edge be the set of l in L for which E has a cyclic subgroup
    of order l defined over F_p whose quotient is supersingular and
    isomorphic over F_p to a Montgomery curve of the same shape.
    The claim is Split = Edge. A finished symmetric difference of
    size at least 1 is the concrete negative. This is not a check
    that the class group acts freely and transitively, it is not a
    count of distinct codomain j-invariants, and it states no
    security level.
  mechanism: >-
    The tracked object is a four-element comparison of two subsets
    of L. One subset is read from the Kronecker symbol. The other
    is read from rational cyclic kernels on one supersingular
    Montgomery curve. The representation is the Montgomery
    coefficient A. The operation set Sigma is the l-isogeny with
    cyclic kernel, for l in L, not Gauss composition. Class:
    coordinate-dependent, because membership in Edge depends on a
    kernel of this model. Lossy-projection test against Sigma: the
    isogenies are discarded and the set Edge is kept. Many kernels
    can share one codomain, so the projection onto the set of l is
    lossy. Two outcomes are separated before any run. Equal sets
    say that, on this curve and these four primes, splitting and
    the existence of a rational cyclic kernel name the same l. A
    nonempty symmetric difference says they do not. The question
    asks which primes act in the group action. This record scores
    that membership on four primes. It does not score the class
    group.
  novelty_status: unverified
  citations:
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Curves are isogenous over a finite field if and only if
        they have the same number of points, and an isogeny walk
        does not reach a curve with a different group-structure
        weakness. This record does not walk toward a weak curve.
        It asks which of four primes admit one rational kernel.
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
        on 2026-10-06
    - ref: KN-LIT-508
      provenance: kb
      claim: >-
        The note estimates an indivisibility count for class
        numbers. It does not compare a Kronecker symbol with an
        isogeny kernel.
      verified_by: knowledge/literature/KN-LIT-508.md
    - ref: >-
        CSIDH action of a split prime ideal of norm l
      provenance: recalled
      claim: >-
        The action is defined for primes l that split in the
        imaginary quadratic order, which is the Kronecker
        condition. Not opened as a primary text in this session.
        Used as the membership rule under test, not as a proof
        that the sets agree at p = 47.
      verified_by: null
  assumptions:
    - >-
      Supersingularity is the trace-zero test on #E(F_p), not a
      scan of every point of E(F_{p^2}).
    - >-
      A cyclic subgroup of order l defined over F_p is witnessed
      by a kernel polynomial of degree l with coefficients in F_p,
      or by an equivalent Vélu kernel. A kernel defined only over
      an extension is not in Edge.
    - >-
      The quotient must be supersingular and F_p-isomorphic to a
      Montgomery curve y^2 = x^3 + A'*x^2 + x. A quotient that is
      supersingular in short Weierstrass form but not brought to
      that Montgomery shape is not in Edge.
    - >-
      No quantum oracle and no security level enter the claim.
  predictions:
    - metric: size of the symmetric difference of Split and Edge
      direction: lower
      minimum_effect: equal to 0
  minimal_test:
    design: >-
      Compute the Kronecker symbol (-47 / l) for each l in
      {3, 5, 7, 11}. Search A from 1 upward for the first
      nonsingular supersingular Montgomery curve. If none exists,
      record the negative row no_curve and stop. Otherwise, for
      each l, search for an F_p-rational cyclic kernel of order l
      and test the quotient. Record Split, Edge, and the size of
      the symmetric difference.
    controls:
      - >-
        The prime l = 47 is not in L. An endomorphism of degree p,
        the Frobenius, is not a member of Edge.
      - >-
        On the singular curve y^2 = x^3, which has A = 0 and is
        outside the search range, the same kernel search must be
        refused. A kernel reported on that singular curve voids
        the run.
      - >-
        An ordinary Montgomery curve, the smallest A that is
        nonsingular with trace not 0, must not be the curve whose
        kernels fill Edge. Scoring the ordinary curve voids the run.
    required_metrics:
      - the integer A, or no_curve
      - the set Split
      - the set Edge
      - the size of the symmetric difference
  falsification_conditions:
    - >-
      A curve A is found, both sets are scored, and the symmetric
      difference has size at least 1. That size is the negative
      observation.
    - No eligible A exists.
    - A kernel defined only over an extension is counted in Edge.
  confounders:
    - >-
      A kernel polynomial search that stops before degree l can
      miss an edge. The search has to cover every monic polynomial
      of degree l over F_p that can be a kernel, or an equivalent
      complete enumeration of rational cyclic subgroups.
    - >-
      Two isomorphic Montgomery models of the quotient can carry
      different A. Isomorphism over F_p, not equality of A, is the
      membership test.
    - >-
      p = 47 is one prime. Agreement here is not agreement at a
      CSIDH-512 prime.
  interpretation_limits:
    - >-
      Equal sets on four primes do not prove the action is free or
      transitive, and they do not prove it at any larger p.
    - >-
      A nonempty difference closes only this curve and these four
      primes.
    - >-
      No exponent moves. A set of size at most 4 is not a runtime.
    - >-
      This is not a ratio of codomain j-invariants and not a lower
      bound of l isogenies of composite degree.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For a supersingular Montgomery curve over F_p with p
        congruent to 3 mod 4, a prime l distinct from p admits an
        F_p-rational cyclic kernel of order l with supersingular
        Montgomery quotient if and only if the Kronecker symbol
        (-p / l) equals 1. The biconditional is the heuristic
        under test at p = 47 and at four primes. It is not used
        as a theorem.
      rigorous_support: >-
        The splitting rule for the CSIDH action is recalled and
        was not opened as a primary text. No theorem opened in
        this session identifies that rule with the kernel search
        at p = 47. KR-RHO-755e35, as read, equates isogeny with
        equal point counts. It does not list which l split.
      validation_plan: >-
        The quantity sampled is the symmetric-difference size on
        one curve and four primes, a complete check of L, not a
        random draw of primes. The comparison is against 0. The
        tail check is the list of l that lie in exactly one of
        the two sets. The parameter is p = 47 and L as named.
        Transfer assumption: none. The set is not used at a
        512-bit prime.
  target_complexity:
    time_exponent: >-
      unchanged. No hidden-shift exponent is stated. Generic
      discrete log in a prime-order group remains exponent 1/2
      (KR-RHO-13bf67) and is not this set comparison.
    memory_exponent: unchanged. The output is two subsets of a four-element set.
    best_known: >-
      The question asks which primes act. This record does not
      improve a published quantum cost.
    hidden_overhead: >-
      None in an exponent. The gap between p = 47 and a
      cryptographic prime is not an o(1) term and is not claimed
      as one.
    tradeoff_note: >-
      No time-memory tradeoff. KR-RHO-ea34b8 is a preprocessing
      bound on a different problem and is not evaluated.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-13bf67
      - KR-RHO-ea34b8
      - KR-RHO-755e35
    nearest:
      - ref: KR-RHO-755e35
        provenance: internal
        relation: adjacent
        delta: >-
          That row says an isogeny preserves the number of points
          and does not reach a weaker group structure. This record
          asks whether four named primes that split are exactly the
          primes with one rational cyclic kernel on one curve. The
          symmetric-difference size can be as large as 4. The
          exponent delta is zero.
      - ref: KN-LIT-508
        provenance: kb
        relation: orthogonal
        delta: >-
          The note counts discriminants by indivisibility of the
          class number. This record outputs a set difference of
          size at most 4. The exponent delta is zero.
    searched:
      corpus_grep:
        - question_id: RQ-CSIDH-64343f
        - Kronecker splitting
        - p=47
      web: []
      blocked: []
  dominated_by: >-
    As a security claim, dominated by the question's own ceiling:
    no bit level is admissible from this record. Compared with
    KR-RHO-13bf67, KR-RHO-ea34b8, and KR-RHO-755e35, each opened
    on 2026-10-06. KR-RHO-755e35 dominates any claim that an
    isogeny changes the point count. It does not compute this
    four-prime symmetric difference. The recalled splitting rule,
    not opened, would dominate the equality if it had been read
    as a theorem. It was not, so the equality at p = 47 is not
    dominated by a row opened here.
  sota_delta: >-
    Zero change to any hidden-shift exponent and zero change to
    any ECDLP exponent. The numerical output is one integer in
    0..4, predicted equal to 0.
  proof_search_map:
    not_applicable_reason: >-
      This is a finite comparison of two subsets of a four-element
      set. It does not propose a theorem, a bound on a quantum
      cost, a certificate beyond the kernel search, a reduction,
      or a closure of the CSIDH action.
