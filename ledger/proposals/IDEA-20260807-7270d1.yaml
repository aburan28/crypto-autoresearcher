idea:
  id: IDEA-20260807-7270d1
  question_id: RQ-GGMB-6eaabc
  added: '2026-08-07'
  title: >-
    GRADED SIMULABILITY BY EXISTENTIAL WIDTH: the formal-linear-form simulator
    for an oracle whose answer is an existential over a candidate set of size Z
    errs with probability Z/N per query, so a simulability verdict is a closure
    only while q*Z = o(N); the VERIFY-form incidence oracle has Z = 1 and is
    closed, its SEARCH-form twin has the same signature and Z = binomial(L, m),
    which at the useful factor-base size is about N -- hence index calculus is
    not closed by Shoup and never was, and every SIMULABLE verdict in this
    campaign must carry its Z
  class: mechanism

  claim: >-
    (A) THE DEFECT IN THE BINARY VERDICT, STATED WITH THE STANDARD SIMULATOR IN
    HAND. The generic-group simulator maintains, for each handle, its formal
    linear form lambda = (alpha, beta) in (Z/N)^2, and answers questions by
    FORMAL comparison of linear forms -- because it does not know k. It is
    therefore WRONG whenever two formally distinct linear forms happen to
    coincide at the true k. Shoup's bound is exactly the union bound over those
    coincidences: with q formed linear forms the failure probability is at most
    binomial(q,2)/N. THE ENTIRE STRENGTH OF A SIMULABILITY VERDICT IS THE SIZE OF
    THAT UNION.

    (B) THE GRADED CRITERION, WHICH IS THE PROPOSAL. Let O be an augmenting
    oracle whose answer is determined by an EXISTENTIAL over a candidate set of
    size Z: "does there exist an object c in a candidate set C, |C| = Z, with
    property Pi(c, query)?" -- and, for a search oracle, "return such a c". Then:
      the formal simulator answers by checking Pi formally over C, i.e. it
      answers NO / bottom unless a formal identity holds; and it is WRONG on a
      given query exactly when some c in C satisfies Pi at the true k without
      satisfying it formally. Each candidate contributes a coincidence event of
      probability at most 1/N over the choice of k, so the per-query error is at
      most Z/N.
      Total success probability of an adversary making g group operations and q
      oracle queries is therefore bounded by
        O( (g + q)^2 / N )  +  q * Z / N.
      HENCE: a SIMULABLE verdict closes the augmented problem at exponent 1/2
      IF AND ONLY IF q * Z = o(N). A verdict reported without Z is incomplete,
      and a verdict with q*Z >= N is CORRECT AS A SIMULATION AND VACUOUS AS A
      CLOSURE.

    (C) THE WITNESS, AND IT IS THE MOST CONSEQUENTIAL OBJECT IN THE CAMPAIGN.
    Two oracles with the SAME subject matter and nearly the same signature:
      VERIFY FORM. INC_verify(i_1, .., i_m, h): "is
        h_{i_1} + ... + h_{i_m} = h?" Candidate set is the single supplied
        subset, so Z = 1. Per-query error 1/N. Simulator cost O(m) formal
        additions. CLOSED at exponent 1/2, unconditionally and for every
        parameter. This is the case KN-FIND-b7e091 adjudicates, and its recorded
        overhead "at most m group ops per query" is precisely the Z = 1 cost.
      SEARCH FORM. INC_search(h): "return m indices with
        h_{i_1} + ... + h_{i_m} = h, or bottom." Candidate set is every m-subset
        of the L-element base, so Z = binomial(L, m). Per-query error
        binomial(L, m)/N.
      Now put in the parameters index calculus actually uses. A random target
      decomposes with constant probability exactly when binomial(L, m) is about
      N, i.e. L about (m! N)^{1/m}. AT THAT PARAMETER Z/N IS ABOUT 1: THE
      SIMULATOR IS WRONG ON ESSENTIALLY EVERY QUERY, and the bound
      O((g+q)^2/N) + q*Z/N exceeds 1 immediately. THE CLOSURE IS VACUOUS EXACTLY
      WHERE THE ORACLE IS USEFUL. That is not a coincidence and it is the general
      shape of the phenomenon: an oracle is useful precisely to the extent that
      it resolves an existential the simulator cannot resolve.

    (D) THE ARITHMETIC CONSISTENCY CHECK, BECAUSE A CLAIM THAT SHOUP IS VACUOUS
    HERE HAD BETTER NOT BE A CLAIM THAT SHOUP IS WRONG. Suppose the adversary
    gets INC_search free over a factor base of its own construction,
    P_i = [a_i]P with a_i known. Build R = [a]P + [b]Q, query once. If the oracle
    returns indices, then a + b*k = sum of a_{i_j} (mod N), and with b invertible
    k FALLS OUT OF ONE QUERY. The adversary spent about L = N^{1/m} group
    operations building the base and O(log N) building R, so g is about N^{1/m},
    which is BELOW sqrt(N) for m >= 3. Shoup is not violated because the oracle
    is not simulable at these parameters -- the q*Z/N term is about 1 -- and the
    graded criterion predicts precisely this. Under the BINARY reading of
    "simulable", this adversary would be a counterexample to Shoup, which is how
    one knows the binary reading is wrong.

    (E) THE SCOPE QUESTION THIS RAISES FOR KN-FIND-b7e091, RAISED AS A SCOPE
    QUESTION AND NOT AS A CONTRADICTION. That finding is BINDING for this
    campaign (GOAL-ENDO-001 goal record) and this record does not revisit it. Its
    Oracle C is described as "an oracle reporting which factor-base subsets sum
    to the target Q" -- phrasing that could be read either way -- while both its
    stated overhead (O(m) per query) and its stated argument ("the oracle output
    is determined by group operations and equality tests") are the Z = 1 verify
    form. Two readings, and the campaign needs to know which is in force:
      READING 1 (verify form intended): the finding is correct exactly as
        written, and the SEARCH form is a NEW oracle class that this lane must
        adjudicate. That is the reading this record adopts and it requires no
        change to anything.
      READING 2 (search form intended): the stated O(m) overhead would then apply
        to an oracle with Z = binomial(L, m), and the closure would need the
        graded criterion to be restated.
    This record recommends READING 1 and files the search form as new. WHICH
    READING IS IN FORCE IS A COORDINATOR ADJUDICATION, NOT AN IDEA-GENERATOR
    ONE, and nothing here changes any status.

    (F) THE CAMPAIGN-WIDE CONSEQUENCE. Every SIMULABLE verdict this campaign
    issues must carry Z, and the verdict template of IDEA-20260807-63056d must
    require it at Q2. Applying it to what is already on the books:
      curve-measurable oracles (IDEA-20260807-413fcc): Z = 1, error 0 in fact
        since the answer does not involve k at all. Strongest possible closure.
      transport oracle (IDEA-20260807-d73e83): Z = 1. Closed.
      endomorphism-image oracle: Z = 1. Closed.
      incidence VERIFY: Z = 1. Closed.
      incidence SEARCH / decomposition: Z = binomial(L, m). NOT CLOSED at the
        useful parameter. Verdict COST, and its C is the open quantity of
        IDEA-20260807-070d03.
    So the graded criterion changes exactly one verdict in the campaign, and it
    is the one that matters.

  resource_label: 'audit: consumes no resource'
  admissibility: admissible
  admissibility_argument: >-
    Consumes no resource; it is an audit of how the admissibility filter is
    applied. Its effect on admissibility is to make the filter STRICTER in one
    direction and HONEST in the other: an oracle with Z = 1 is closed more firmly
    than before (the error term is exactly 1/N per query, not a hand-waved O(1)
    overhead), while an oracle with large Z may no longer be waved through as
    "simulable, therefore closed". The filter as written in DECOMPOSITION.md
    section 2 is unaffected; what changes is what may be concluded from passing
    it in one direction.

  discriminated_from:
    - >-
      KN-FIND-b7e091, BINDING and not revisited. This record accepts its Oracle C
      and D verdicts as stated for the Z = 1 forms, and files the Z > 1 search
      form as a new oracle class -- which is exactly what lane L12 exists to do
      ("extends KN-FIND-b7e091 to new oracle classes", RQ-GGMB-6eaabc). The
      reading question in (E) is flagged for the Coordinator rather than decided
      here.
    - >-
      IDEA-20260806-530fdd / H-AOM-8d4a83, the degree-budgeted algebraic oracle
      model AOM_d. That grades simulability by the ALGEBRAIC DEGREE d of the
      variety defining the oracle and bounds the simulator's overhead by Bezout /
      Lang-Weil point counts. This grades by the EXISTENTIAL WIDTH Z, which
      enters not as an overhead but as an ERROR PROBABILITY Z/N in the
      lower-bound union. The two are related where the candidate set is the
      F_p-point set of a variety -- there Z is a point count and AOM_d's bounds
      give Z -- but they are not the same quantity and they enter the argument at
      different places: d bounds work, Z bounds correctness. Where AOM_d is
      available it is the natural way to compute this record's Z, and the two
      compose rather than compete.
    - >-
      IDEA-20260807-5876b8, which states the four-cell dichotomy. This record
      supplies the refinement that makes cell (a) quantitative: cell (a) with
      q*Z = o(N) is a closure; cell (a) with q*Z >= N is a correct simulation of
      no consequence. The dichotomy can be right while this refinement is wrong
      and vice versa.
    - >-
      IDEA-20260807-070d03, which analyses the factor-base membership and
      decomposition oracles in the query and cost models. That record measures C
      (the implementation cost); this one explains why the SIMULATION argument
      does not dispose of the oracle before C is measured. Complementary, and
      neither is complete without the other.

  object_first_candidate:
    tracked_object: >-
      Z, the EXISTENTIAL WIDTH of an oracle: the size of the candidate set its
      answer quantifies over. Z = 1 for verify-form oracles, Z = binomial(L, m)
      for m-subset search over an L-element base, Z = |E(F_p)| for "find any
      point with property Pi", Z = the F_p-point count of the defining variety
      for an algebraically-specified oracle.
    lossiness: >-
      SEVERELY LOSSY: an oracle's entire mathematical content is projected onto
      one integer. What is discarded: what the oracle is about, how expensive it
      is to implement, whether it is realizable. What is retained: the exact
      quantity controlling the formal simulator's error rate. A projection that
      keeps the error rate and discards the mathematics is genuinely lossy, and
      it is not a change of coordinates because Z cannot be inverted -- infinitely
      many oracles share any given Z.
    propagation: >-
      Deterministic under the constructions that build oracles from oracles, and
      the rules are the reason to track Z rather than a verdict word:
        SEQUENTIAL COMPOSITION (query O_2 on the output of O_1): Z multiplies,
          Z = Z_1 * Z_2, because the composite quantifies over pairs.
        CONJUNCTION of properties over the same candidate set: Z unchanged.
        RELAXING VERIFY TO SEARCH over a base of size L at arity m:
          Z goes from 1 to binomial(L, m) -- the single largest jump available
          and the one that decides whether a closure is real.
        REPEATED QUERYING: Z unchanged, q grows, and the product q*Z is what the
          criterion reads.
      Z does NOT propagate under a change of the oracle's SPECIFICATION LANGUAGE
      -- two equivalent descriptions of the same mathematical map can have
      different apparent Z if one of them hides a search -- and that failure is
      the honest coordinate-dependence of this object, recorded rather than
      hidden.
    survival_score: >-
      Survives change of curve, of field size, of solver, and of model, because
      it is a combinatorial property of a specification. Dies at (i) an ambiguous
      specification, where Z is not well defined -- which is why Q0 of the
      adjudication procedure must freeze quantifier structure before anything
      else; (ii) oracles whose answer is not an existential at all (a
      real-valued measurement, e.g. a canonical height), where Z is undefined and
      a different argument is needed; (iii) the preprocessing model, where the
      error accounting is amortized over instances and Z/N per query is the wrong
      unit.

  mechanism: >-
    STEP 1 (zero compute) -- STATE AND PROVE THE ERROR BOUND. For an oracle
    quantifying over a candidate set of size Z, the formal simulator's per-query
    error is at most Z/N: each candidate c yields a formal linear identity that
    either holds identically (in which case the simulator is right) or holds at k
    with probability at most 1/N over uniform k, because a nonzero linear form
    over Z/N with N prime has at most one root. Union over Z candidates and over
    q queries. Three lines; it is the whole theorem.

    STEP 2 (zero compute) -- ASSEMBLE THE COMBINED BOUND
    O((g+q)^2/N) + q*Z/N and state the criterion q*Z = o(N). Note explicitly that
    the first term is Shoup's and the second is new, so the criterion degenerates
    to Shoup exactly at Z = 1.

    STEP 3 (zero compute, THE WITNESS) -- COMPUTE Z FOR BOTH INCIDENCE FORMS and
    substitute the index-calculus parameter L = (m! N)^{1/m}, obtaining
    Z/N about 1 for the search form. Then run the consistency check of (D): the
    one-query attack, its group-operation count N^{1/m}, and the confirmation
    that it does not contradict Shoup precisely because the criterion fails.
    THIS STEP IS THE PROPOSAL. If the arithmetic of (D) does not come out --
    if the one-query attack does not work, or if it works and the criterion still
    says "closed" -- the record is wrong and ends here.

    STEP 4 (zero compute) -- RECOMPUTE Z FOR EVERY VERDICT ALREADY ON THE BOOKS
    (paragraph (F)) and publish the table with Z beside each. Feed the Z field
    into IDEA-20260807-63056d's Q2 template.

    STEP 5 (toy compute, <= 60 minutes, INSTRUMENT CHECK ONLY) -- THE MEASURED
    ERROR RATE. At p <= 2^20 with N prime, build an L-element factor base of
    known logarithms, choose m, and MEASURE the fraction of random targets that
    admit an m-subset decomposition, as a function of binomial(L, m)/N over the
    ladder binomial(L,m)/N in {2^-8, 2^-4, 2^-1, 1, 2, 8}. The predicted curve is
    the standard occupancy form 1 - exp(-binomial(L,m)/N). This measures the
    quantity Z/N directly and checks that the theoretical error rate is the
    empirical decomposition rate -- which is the claim's physical content, and it
    is checkable in minutes with no Groebner engine.

    STEP 6 (zero compute) -- WRITE THE SCOPE QUESTION OF (E) TO THE COORDINATOR
    as an explicit request for adjudication, with both readings and the
    recommendation, and change no status.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      ripgrep via the harness Grep tool (semantics of `grep -ril`), 2026-08-07,
      over ledger/, knowledge/, docs/, analysis/. Patterns: "simulator overhead|
      T_sim|simulation overhead|charged work|overhead per query"; "existential
      width|search form|verify form|search-form|verify-form"; "Oracle A|Oracle B|
      Oracle C|Oracle D"; "simulab|simulator".
    results: >-
      36 occurrences of the overhead pattern across 18 files. The closest prior
      art is IDEA-20260806-530fdd / H-AOM-8d4a83, which grades simulability by
      algebraic degree and bounds simulator OVERHEAD by point counts; it does not
      state an error probability, does not distinguish verify from search form,
      and does not state a criterion for when a simulability verdict is a
      closure. IDEA-20260727-004 is recorded (in 530fdd's own claim text) as
      asking "when a SIMULABLE verdict actually closes a candidate" -- the same
      question -- but the corpus contains no answer in the form of a computable
      quantity. "existential width", "search form" and "verify form" return no
      hits as technical terms. No record computes Z for any oracle.
    verdict: adaptation
  novelty_screen_note: >-
    ADAPTATION. The error-probability accounting is the standard interior of
    Shoup's own proof, made explicit and parameterized; nothing about it is new
    mathematics and it is not claimed as such. What is proposed as new to this
    program is the quantity Z, the criterion q*Z = o(N), and the observation that
    the verify/search distinction moves exactly one campaign verdict. External
    novelty is not claimed and was not checked beyond the corpus; a published
    treatment of oracle-augmented generic bounds graded this way would be an
    ingredient and should be logged to knowledge/literature/ on sight.

  null_object_control: >-
    MANDATORY AND BLOCKING.
    NULL OBJECT: an oracle whose existential is over a candidate set of size Z
    but whose property Pi is INDEPENDENT OF k -- for example "does there exist an
    m-subset of the base whose INDEX SUM is even?" Z is the same
    binomial(L, m), but the answer never involves k, so the true error rate is 0
    and the criterion's Z/N bound is loose but sound. Measuring the empirical
    error rate for this null must give 0 at every Z. AN INSTRUMENT THAT REPORTS
    Z/N ERROR FOR A k-INDEPENDENT ORACLE IS READING THE BOUND, NOT THE OBJECT,
    and the record must be explicit that Z/N is an UPPER bound whose tightness
    depends on the property being genuinely k-dependent.
    DECAY PARAMETER: binomial(L, m)/N over the ladder {2^-8, 2^-4, 2^-1, 1, 2, 8}.
    The measured decomposition rate must follow 1 - exp(-binomial(L,m)/N) and
    must DECAY TO ZERO as binomial(L, m)/N goes to zero. A decomposition rate
    that stays constant as the ratio shrinks is the canonical artifact tell and
    indicates the factor base is not being drawn independently -- most likely the
    base and the target share structure.
    SECOND CONTROL, THE OTHER DIRECTION: an oracle with Z = 1 (verify form) must
    show a measured error rate indistinguishable from 1/N, i.e. zero at these
    sizes. An instrument that reports a detectable error rate for Z = 1 is
    miscounting.

  assumptions:
    - >-
      N is prime, so a nonzero linear form over Z/N has at most one root and the
      per-candidate coincidence probability is at most 1/N. For composite N the
      count changes and the criterion must be restated.
    - >-
      k is uniform and independent of the adversary's choices up to the point of
      the query. Adaptive choices are handled by the standard lazy-sampling
      argument and this record relies on it without reproving it.
    - >-
      The oracle's answer really is an existential over a well-defined candidate
      set. Oracles returning measurements rather than existentials (heights,
      pairings into a field) are outside the criterion and are named as such.
    - >-
      Z is computed from the FROZEN specification. An ambiguous specification has
      no Z and no verdict.
    - >-
      Shoup's bound in the form O(q^2/N) is cited, not reproved.

  proof_search_map:
    bottleneck: >-
      Step 3, the arithmetic consistency check of (D). The error bound (Step 1)
      is three lines and the criterion (Step 2) is bookkeeping; the entire risk
      is whether the one-query search-oracle attack and the criterion agree. If
      the attack works and the criterion still reports "closed", the criterion is
      unsound and the record is worthless; if the attack does not work, the
      witness evaporates and the verify/search distinction has no consequence.
      Zero compute, and it is where all the attention belongs.
    baseline_embedding:
      parameter_slice: >-
        Z = 1. At this slice the combined bound O((g+q)^2/N) + q/N degenerates to
        Shoup's O((g+q)^2/N) up to the lower-order q/N term, and the criterion
        q*Z = o(N) is satisfied for every q = o(N), so every Z = 1 oracle is
        closed exactly as before.
      reproduction_check: >-
        SYMBOLIC: substitute Z = 1 and check the bound reduces to Shoup's with no
        residual term of the same order. FROZEN FIXTURE: recompute the verdicts
        for KN-FIND-b7e091's Oracles C (verify) and D and for the three null
        oracles of IDEA-20260807-5876b8, and require them all to be unchanged.
        ANY CHANGE TO AN EXISTING Z = 1 VERDICT MEANS THE REFINEMENT IS NOT
        CONSERVATIVE AND HALTS THE LINE -- a refinement that reopens already-
        closed oracles is far more likely to be an error than a discovery.
    observation_collision:
      observable: >-
        The verdict SIMULABLE, and separately the pair (SIMULABLE, Z).
      distinct_preimage_search: >-
        REQUIRED AND IT SUCCEEDS, AND THE COLLISION IS THE ENTIRE POINT OF THE
        RECORD. INC_verify and INC_search have the same subject matter, nearly
        the same signature, and the same bare verdict SIMULABLE, while one is
        closed for every parameter and the other is vacuous at the only parameter
        anyone would use. The collision is a direct falsifier of the bare
        verdict's identifiability, and the additional condition that separates
        them is exactly Z. That is why the proposal is "carry Z" and not "change
        the verdict". A SECOND collision, in the opposite direction, bounds the
        refinement: two oracles with the SAME large Z, one k-dependent and one
        not (the null object above), have completely different true error rates
        while sharing the bound Z/N -- so Z is an upper bound on error, not a
        measurement of it, and a large Z is a reason to withhold a closure, never
        a reason to assert an attack.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Carry (verdict, Z) instead of verdict alone, and carry q*Z/N rather
          than a yes/no. The stronger state is what survives the operation that
          matters -- relaxing a verify oracle to a search oracle -- under which
          the bare verdict is invariant and therefore uninformative.
        predicted_gain: >-
          Converts one binary verdict into a criterion with a computable
          threshold, and changes exactly one campaign verdict (incidence search /
          decomposition) from "closed" to "cost, pending C". No attack speedup;
          the gain is that the campaign stops believing a closure it does not
          have.
      - transform: boundary_lift
        proposed_object: >-
          Treat Shoup's theorem as the Z = 1 boundary of a family of bounds
          indexed by Z, and prove the strict inward statement for Z > 1 rather
          than merely asserting feasibility. The lift is inward in the sense that
          it WEAKENS the conclusion as Z grows, which is the honest direction.
        predicted_gain: >-
          A one-parameter family in place of a point, with the incumbent
          recovered exactly at the boundary -- which is the baseline-embedding
          requirement of KN-TECH-080 satisfied by construction rather than by
          resemblance.
    quantifier_order: >-
      THE CLAIM, WITH THE ORDER THAT MAKES IT NON-TRIVIAL:
        FORALL oracles O with existential width Z over a well-defined candidate
        set, EXISTS a simulator S (the formal-linear-form simulator, fixed once
        and independent of O beyond reading its candidate set), FORALL generic
        adversaries A making g group operations and q oracle queries, FORALL
        distributions on instances with k uniform:
          Pr[A^O succeeds] <= O((g+q)^2/N) + q*Z/N.
        Hence FORALL O with q*Z = o(N), the augmented problem retains exponent
        1/2.
      NOTE WHAT IS NOT CLAIMED, AND IT IS THE CONVERSE: q*Z >= N does NOT imply
      the oracle is useful. It implies only that THIS ARGUMENT does not close it.
      Reading a failed closure as an attack is the exact inverse of the error
      this record exists to correct, and it would be worse.
      THE ORACLE'S OWN QUANTIFIER STRUCTURE IS THE INPUT: verify form is
      "FORALL supplied c, decide Pi(c)" (no existential, Z = 1); search form is
      "EXISTS c with Pi(c), and produce it" (existential over C, Z = |C|). The
      grading is literally a reading of the oracle's quantifier prefix, which is
      why Q0 of the adjudication procedure must freeze it before anything else.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For prime N, single instance, k uniform, an oracle with existential
        width Z admits a formal simulator with per-query error at most Z/N, so a
        generic adversary's advantage is at most O((g+q)^2/N) + q*Z/N." It can
        NEVER certify that a large-Z oracle is useful, that a large-Z oracle is
        implementable, or anything about the cost C of implementing it. It can
        never be used to claim an attack.
      nearby_object_control: >-
        THE k-INDEPENDENT LARGE-Z ORACLE (the null object above): same Z, true
        error 0. The method assigns it the same bound Z/N and therefore CANNOT
        distinguish it from a genuinely k-dependent large-Z oracle. That is the
        method's ceiling, stated before it is discovered: Z is an upper bound on
        the simulator's error and a lower bound on nothing. A second nearby
        object: an oracle whose candidate set is not enumerable (an existential
        over all of F_p, Z = p), for which Z/N > 1 and the bound is trivially
        vacuous even though the oracle may be perfectly harmless -- so a vacuous
        criterion is common and must never be reported as a signal.
    proof_obligations:
      - claim: >-
          Per-candidate coincidence probability is at most 1/N for prime N.
        responsibility: correctness
      - claim: >-
          The union bound gives per-query error at most Z/N and total error at
          most q*Z/N.
        responsibility: correctness
      - claim: >-
          The combined bound reduces exactly to Shoup's at Z = 1 and reopens no
          existing Z = 1 verdict.
        responsibility: baseline
      - claim: >-
          Z(INC_search) = binomial(L, m), and at L = (m! N)^{1/m} this is about
          N.
        responsibility: size
      - claim: >-
          The one-query attack of (D) recovers k and uses about N^{1/m} group
          operations, and is consistent with Shoup precisely because the
          criterion fails.
        responsibility: feasibility
      - claim: >-
          The measured decomposition rate follows 1 - exp(-binomial(L,m)/N) on
          the toy ladder.
        responsibility: success_probability
      - claim: >-
          Every reported SIMULABLE verdict in the campaign carries its Z.
        responsibility: interface
      - claim: >-
          The record changes no hypothesis or finding status and routes the
          KN-FIND-b7e091 reading question to the Coordinator.
        responsibility: scope

  predictions:
    - metric: >-
        number of existing campaign SIMULABLE verdicts changed by adding Z
      direction: different
      minimum_effect: >-
        EXACTLY ONE -- the incidence SEARCH / decomposition oracle. Pre-registered
        before the recomputation. If the refinement changes zero verdicts it is
        bookkeeping with no consequence and should be recorded as such rather
        than promoted; if it changes two or more, at least one already-closed
        oracle is being reopened, which is far more likely an error in this
        record than a discovery and halts the line pending review.
    - metric: >-
        empirical m-subset decomposition rate versus the predicted
        1 - exp(-binomial(L,m)/N), over the ladder binomial(L,m)/N in
        {2^-8, 2^-4, 2^-1, 1, 2, 8}, at p <= 2^20
      direction: different
      minimum_effect: >-
        Within 15 percent of the predicted occupancy curve at every rung, with at
        least 200 targets per rung. A systematic deviation means the factor base
        and targets are not independent and the Z accounting does not apply to
        that construction.
    - metric: >-
        group operations used by the one-query search-oracle attack of (D), as a
        function of N at fixed m = 3
      direction: lower
      minimum_effect: >-
        About N^{1/3} up to the constant (m!)^{1/m}, measured at three sizes and
        fitted; the fitted exponent must lie in [0.28, 0.40]. An exponent near
        0.5 means the base construction is dominating and the witness is not what
        it claims. NOTE: THIS IS NOT AN ATTACK MEASUREMENT -- the oracle is
        simulated by exhaustive search in the experiment and the exhaustive
        search is charged separately, so no sub-rho claim is made or implied.
    - metric: >-
        measured simulator error rate for the k-independent large-Z null oracle
      direction: lower
      minimum_effect: >-
        Exactly 0 at every Z. A nonzero rate means the harness is comparing the
        wrong thing, and the Z/N bound's looseness has been mistaken for a
        measurement.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, 2 hours, HARD GATE): prove the Z/N error bound;
      assemble the combined bound; verify the Z = 1 reduction to Shoup; run the
      (D) consistency check on paper. If (D) does not come out, stop.
      STAGE 1 (zero compute): recompute Z for every verdict on the books and
      check that exactly one changes.
      STAGE 2 (toy compute, <= 30 min): the occupancy measurement of Step 5 --
      decomposition rate versus binomial(L,m)/N on the six-rung ladder, 200
      targets per rung, at p in {2^16, 2^18, 2^20}, with N prime and the order
      factored (KN-TECH-030 hygiene).
      STAGE 3 (toy compute, <= 30 min): the k-independent null oracle at matched
      Z, and the Z = 1 verify oracle, both measured on the identical pipeline.
      STAGE 4 (toy compute, <= 30 min): instantiate the (D) attack with an
      exhaustively-searched decomposition oracle at m = 3 and three sizes; fit
      the group-operation exponent; charge the exhaustive search separately and
      report both numbers side by side so nothing reads as sub-rho.
      STAGE 5 (zero compute): the verdict table with Z, the Q2 template change,
      and the scope question written to the Coordinator.
    controls:
      - >-
        Z = 1 verify oracle: measured error rate must be 0 at these sizes
      - >-
        k-independent large-Z oracle: measured error rate must be 0 (bound
        looseness control)
      - >-
        occupancy ladder binomial(L,m)/N in {2^-8, 2^-4, 2^-1, 1, 2, 8}
        (decay test)
      - >-
        factored group order, largest prime factor, and #E != p per curve
        (KN-TECH-030, KN-TECH-033 hygiene)
      - >-
        matched rho and BSGS on identical instances, in the same operation unit,
        so the (D) attack's cost is reported against a real baseline
    required_metrics:
      - Z per oracle, with the candidate set named
      - q*Z/N per adjudicated oracle at its intended parameters
      - empirical decomposition rate per ladder rung, with target count
      - measured error rate for the Z = 1 and k-independent controls
      - group operations of the (D) attack, and separately the charged cost of
        the exhaustive decomposition search
      - count of existing verdicts changed by the refinement

  falsification_conditions:
    - >-
      The Z = 1 reduction does not recover Shoup's bound, or the recomputation
      changes an existing Z = 1 verdict. The refinement is not conservative; it
      is far more likely wrong than revelatory and the line halts pending review.
    - >-
      The (D) consistency check fails: either the one-query attack does not
      recover k, or it does and the criterion still reports the oracle closed.
      Either way the criterion is unsound as stated and the record is superseded.
    - >-
      The empirical decomposition rate does not follow the occupancy curve. The
      independence assumption behind the union bound does not hold for the
      construction used, and Z is not the right parameter for it.
    - >-
      The k-independent null oracle shows a nonzero measured error rate. The
      measurement is comparing the bound to itself; nothing is reported.
    - >-
      The refinement changes zero verdicts. It is correct and inconsequential;
      the honest disposition is a short note, not a promotion, and the record
      says so in advance so that a null outcome cannot be inflated.
    - >-
      An independent reviewer establishes that KN-FIND-b7e091's Oracle C was
      intended in the SEARCH form. Then reading 2 of (E) is in force, the scope
      question becomes a correction rather than an extension, and only the
      Coordinator may act on it. This record's mathematics is unaffected either
      way.

  confounders:
    - >-
      Z AS A MEASUREMENT RATHER THAN A BOUND. Z/N bounds the simulator's error
      from above; the true error can be zero. A large Z is grounds for
      WITHHOLDING a closure, never for asserting an attack, and the k-independent
      null exists to keep this visible.
    - >-
      SPECIFICATION-DEPENDENT Z. Two equivalent descriptions of one map can have
      different apparent Z if one hides a search inside a "function". Q0's freeze
      is the defence and reviewers should re-derive Z from the frozen signature
      rather than accepting the proposer's number.
    - >-
      TOY-SCALE OCCUPANCY. At p <= 2^20 with m = 3 the useful L is small and
      binomial(L, 3) is coarse-grained; the ladder rungs may not be attainable
      exactly. Report the achieved ratio, not the target ratio.
    - >-
      READING THE (D) ATTACK AS AN ATTACK. It uses a free oracle whose
      implementation is exhaustive search. Its group-operation count is real; its
      TOTAL cost is not sub-rho and must never be reported as such. Both numbers
      appear side by side in the required metrics for exactly this reason.
    - >-
      COMPOSITE N. The 1/N per-candidate probability uses primality. Toy curves
      with composite subgroup order would silently change the accounting.

  interpretation_limits:
    - >-
      This is a refinement of a closure criterion, not a result about ECDLP and
      not an attack. Its most likely effect is to make the campaign's negatives
      weaker and more honest.
    - >-
      Nothing here says index calculus beats rho over prime fields. It says the
      SIMULATION ARGUMENT does not dispose of it, which the program's own records
      (KN-FIND-f8c290, KN-FIND-5c1a03) already imply on other grounds.
    - >-
      No hypothesis or finding status is changed. The KN-FIND-b7e091 reading
      question is routed to the Coordinator and is not decided here.
    - >-
      Scoped to prime N, single instance, uniform k, oracles whose answers are
      existentials over enumerable candidate sets. Measurement-valued oracles and
      preprocessing models are outside it.
    - >-
      The Stage 2-4 measurements are toy scale and are instrument checks on the
      occupancy model. The bound itself is a scale-independent argument and its
      support is Stage 0.

  reachability_gate: >-
    NOT APPLICABLE: no curve motion is proposed. The analogous gate that binds is
    CANDIDATE-SET ENUMERABILITY -- Z is defined only when the oracle's candidate
    set is well specified. An oracle quantifying over an unenumerable set has
    Z undefined, the criterion is silent, and the honest verdict is OPEN rather
    than a default closure. That default matters: the failure mode this record
    guards against is an unenumerable existential being waved through as
    "simulable".

  heuristic_assumptions:
    - id: HEUR-1
      statement: >-
        CANDIDATE INDEPENDENCE FOR THE OCCUPANCY MODEL. For a factor base of L
        elements with logarithms drawn uniformly and independently, the
        binomial(L, m) subset sums behave like independent uniform elements of
        Z/N, so a random target admits an m-subset decomposition with probability
        1 - exp(-binomial(L,m)/N).
      rigorous_support: >-
        THE UNION BOUND IS RIGOROUS AND IS WHAT THE THEOREM USES: the per-query
        error is at most Z/N with no independence assumption whatsoever, because
        a union bound needs none. HEUR-1 is used ONLY to predict that the bound
        is TIGHT -- i.e. that the decomposition rate actually approaches the
        occupancy curve -- and therefore only to argue that the criterion is
        vacuous rather than merely unproven at the index-calculus parameter. The
        classical statement it imitates is the occupancy / balls-in-bins limit
        for uniform independent placements. If HEUR-1 fails, the theorem stands
        and only the claim "the closure is vacuous at the useful parameter"
        weakens to "the closure is unproven at the useful parameter", which is
        still enough to withdraw the closure.
      validation_plan: >-
        Sample directly: at p in {2^16, 2^18, 2^20} with N prime, m = 3, and L
        chosen to hit each rung of the ladder binomial(L,m)/N in
        {2^-8, 2^-4, 2^-1, 1, 2, 8}, measure the fraction of 200 random targets
        admitting a decomposition and compare the empirical CDF against
        1 - exp(-binomial(L,m)/N). Tail check: the rung at 2^-8, where the
        predicted rate is about 0.4 percent and a systematic excess would reveal
        dependence between the base and the targets. THIS IS TOY-SCALE
        VALIDATION, labelled as such, and it validates the occupancy model at
        p <= 2^20 only; nothing about cryptographic-size behaviour is claimed or
        supported.
    - id: HEUR-2
      statement: >-
        SPECIFICATION STABILITY OF Z. For the oracles this campaign will actually
        propose, Z computed from the frozen signature is stable under reasonable
        re-specifications of the same mathematical map.
      rigorous_support: >-
        None, and it is false in general -- the record says so in the propagation
        field. It is offered as an empirical expectation about the oracles at
        hand, not as a property of the definition.
      validation_plan: >-
        For three campaign oracles, have two independent adjudicators write the
        specification and compute Z, and compare. This rides along with the
        inter-rater check of IDEA-20260807-63056d at no extra cost, and a
        disagreement is a finding about the specification schema.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND THE RECORD IS DESIGNED SO THAT NONE CAN
      BE READ INTO IT. What changes is a bound's validity condition: the
      augmented problem retains exponent 1/2 when q*Z = o(N), and the bound is
      silent otherwise. The one campaign object whose status moves --
      decomposition at arity m -- moves from "closed at 1/2" to "exponent
      1/m in QUERIES with an unmeasured per-query cost C", which is not a claim
      that it is fast; it is a claim that the program does not currently know.
    memory_exponent: >-
      The audit itself is O(1) memory. The (D) witness attack, if instantiated,
      needs O(L) = O(N^{1/m}) storage for the factor base plus the exhaustive
      search's working set, and the exhaustive search is what makes it not an
      attack.
    best_known: >-
      Parallel Pollard rho with distinguished points at 0.886*sqrt(N) group
      operations and O(1) memory (KN-TECH-001, KN-TECH-006); automorphism-
      discounted on CM curves (KN-TECH-018); BSGS at sqrt(N) time and memory
      (KN-TECH-031). Unmoved by this record.
    hidden_overhead: >-
      The criterion q*Z = o(N) hides everything about IMPLEMENTATION: an oracle
      can fail the criterion (so the closure does not apply) and still be
      completely useless because implementing it costs more than rho. That is the
      normal case and it is why this record must always be read together with
      IDEA-20260807-070d03's cost analysis. Stated here so a failed closure is
      never mistaken for a live attack.
    tradeoff_note: >-
      No cryptanalytic tradeoff is introduced. There is a bookkeeping tradeoff
      worth noting: raising L raises Z (weakening the closure) and simultaneously
      raises the base-construction cost g, so the two effects push in opposite
      directions and the criterion should always be evaluated at the parameter
      the ORACLE'S OWN LANE intends, not at a parameter chosen to make the
      criterion fail.

  dominated_by: >-
    AS AN ATTACK: none mounted, and the record explicitly refuses to read its
    witness as one. Dominated on every axis by every row of the prime-field
    frontier, checked individually: parallel rho with distinguished points
    (0.886*sqrt(N) time, O(1) memory, 0 queries); automorphism-discounted rho on
    CM curves (KN-TECH-018), a further factor up to sqrt(6) on time; BSGS
    (KN-TECH-031) at sqrt(N) time and memory. This record occupies no point on
    the frontier and `null` would be a fabrication.
    AS A CLOSURE CRITERION: the incumbent is the binary simulability verdict of
    H-GGM-001 as applied in KN-FIND-b7e091. This record dominates it on
    CORRECTNESS OF SCOPE (it identifies a parameter regime where the binary
    verdict is vacuous) and is dominated by it on EVERYTHING ELSE THAT MATTERS
    OPERATIONALLY: the incumbent has an archived evidence record, a Coordinator
    decision, and is BINDING on this campaign; this is a proposal that raises a
    scope question about it. The nearest live competitor as a grading scheme is
    IDEA-20260806-530fdd's AOM_d, which dominates this on generality for
    algebraically-specified oracles (it bounds Z by point counts rather than
    requiring Z be computed by hand) and is dominated by it on applying to
    non-algebraic oracles at all.
  sota_delta: >-
    Zero speedup against any attack baseline: 0 time, 0 memory, 0 queries.
    Criterion delta in numbers: adds one integer Z per verdict; changes exactly
    1 of the campaign's SIMULABLE verdicts (predicted, pre-registered); moves the
    incidence-search / decomposition oracle from "closed at exponent 1/2" to
    "query exponent 1/m with per-query cost C unmeasured"; and quantifies the gap
    between the two incidence forms as a factor binomial(L, m)/m in candidate
    count, which at L = (m! N)^{1/m} is about N/m. The largest single number in
    the record is that ratio, and it is the size of the hole in a closure the
    campaign currently treats as complete.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.85 that the Z/N error bound and the Z = 1 reduction are correct -- they are
    the interior of a standard proof and I have written them out. 0.7 that the
    (D) consistency check comes out cleanly; the risk is that the one-query
    attack needs the adversary to know the factor-base logarithms, which it does
    in my construction but which a reviewer may argue is not the index-calculus
    setting, in which case the witness needs restating with an unknown-logarithm
    base and Z changes. 0.6 that the Coordinator adopts reading 1 of (E) rather
    than treating the whole record as a correction request. Priority is MEDIUM
    rather than HIGH for one honest reason: the record's main consequence is to
    make an existing closure weaker, it changes no other lane's work plan, and it
    requires a Coordinator scope adjudication before anything downstream can move
    -- so its information gain is high but its actionability this batch is low.

