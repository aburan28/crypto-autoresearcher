idea:
  id: IDEA-20260901-6a7a3e
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  added: '2026-09-01'
  title: >-
    THE delta_E LANDSCAPE IS MADE OF ORIENTATION PLATEAUS: a two-line theorem
    (every minimal conjugate isogeny phi: E -> E^{(p)} of degree d makes
    alpha = Frob o phi a trace-zero endomorphism with alpha^2 = -p*d, and alpha
    descends along every alpha-stable kernel) predicts BATCH-009's
    control-confirmed anomaly ANOM-1 exactly (100 percent of structural local
    minima of delta_E on the 2-isogeny graph are tied, null 35-57 percent),
    gives a Kronecker-symbol rule for which ell-neighbours are guaranteed to
    have delta no larger than their parent, identifies the c = 1 restricted
    list that lever L2 has been looking for as the alpha-stable ball, and
    reduces lever L4's gradient question to ONE measurable ratio -- the
    strict-decrease exit rate from a plateau against the ambient density of
    the lower stratum
  class: mechanism

  claim: >-
    STATED FIRST, BECAUSE RQ-SSIQ-9702af CONSTRAINT 1 REQUIRES IT: no algorithm
    is claimed, no exponent below 1/3 is claimed, and nothing here states or
    implies that p^{1/4} over F_{p^2} exists, is likely, or is near. What is
    claimed is a derivation-tier structural theorem, its exact match to an
    already-measured campaign anomaly, and two conditional numeric targets.

    (T1) THE ORIENTATION IDENTITY. Let E/F_{p^2} be supersingular, let
    phi: E -> E^{(p)} be a separable cyclic isogeny of degree d < p/4, and let
    Frob: E^{(p)} -> E^{(p^2)} = E be the p-Frobenius (frozen source line 57:
    the composition Frob o phi is a non-scalar endomorphism). Then
    alpha := Frob o phi lies in End(E), has Nrd(alpha) = p*d, and has
    Trd(alpha) = 0 (the trace-vanishing rule that IDEA-20260805-e7ee4a derives
    and EV-SSIQ-e43afd carries: |Trd| <= 2 sqrt(pd) < p together with
    Trd in pZ). Hence alpha^2 = -p*d and Z[sqrt(-p*d)] embeds in End(E).
    CONVERSELY, an embedding of Z[sqrt(-p*d)] into End(E) whose image is
    inseparable (divisible by Frobenius) yields a separable isogeny
    E -> E^{(p)} of degree d, cyclic or not. In words: delta_E, the minimal
    conjugate degree that the campaign's thirteen L4 batches label vertices
    with, is the smallest d such that E carries an inseparable
    sqrt(-p*d)-orientation.

    (T2) THE DESCENT RULE (derivation tier, elementary). Let alpha be as in
    T1 and let ell be a prime, ell != p. Every subgroup K of E[ell] of order
    ell that is alpha-stable (alpha(K) contained in K) satisfies: alpha
    descends to an endomorphism alpha_1 of E_1 = E/K with the same reduced
    norm p*d and trace 0, and alpha_1 is inseparable, so delta_{E_1} <= d.
    The alpha-stable order-ell subgroups are the eigenlines of alpha acting on
    E[ell] = (Z/ell)^2, whose characteristic polynomial is x^2 + p*d mod ell.
    Therefore the number g_ell(E) of GUARANTEED ell-neighbours with
    delta <= delta_E is: g_2(E) >= 1 for EVERY E (in characteristic 2 the
    polynomial x^2 + p*d is a square, so an eigenline always exists);
    for odd ell not dividing p*d, g_ell(E) = 1 + (-p*d / ell) (Kronecker
    symbol), i.e. 2 if -p*d is a square mod ell and 0 if it is not, except
    that g_ell = ell + 1 when alpha is scalar mod ell (the orientation is
    non-primitive at ell); for odd ell dividing d, g_ell(E) >= 1.

    (T3) THE ANOMALY IS A COROLLARY. Since g_2(E) >= 1 for every vertex, no
    vertex of the 2-isogeny graph can be a STRICT local minimum of delta_E:
    every structural local minimum has at least one 2-neighbour with EQUAL
    delta_E. This is precisely ANOM-1 of BATCH-009 (EV-SSIQ-0fc992 lines
    123-144, read this session): depth(m) == 0 for every one of 95/132/194/287
    structural local minima at p = 2437/3889/5737/7333, zero exceptions, on
    3-regular graphs, against a label-permutation null that reproduces only
    35-57 percent. The campaign recorded this as a "genuine, control-confirmed
    empirical anomaly" that "reframes rather than answers the funnel-structure
    mechanism question". T2 is the mechanism. It also predicts that the same
    universality FAILS on the 3-isogeny graph exactly at vertices with
    (-p*delta_E / 3) = -1, which is the discriminating test below.

    (T4) THE READING FOR THE EXPONENT QUESTION, IN TWO LEVERS. (L2 reading)
    The middle curve E' of ANY balanced split phi = eta o psi of the minimal
    conjugate isogeny satisfies ker(psi) contained in ker(phi) contained in
    ker(alpha), so psi is an alpha-stable step and E' lies on the SAME plateau
    S_d := {E'' : Z[sqrt(-p*d)] embeds inseparably in End(E'')}. The
    restricted family "alpha-stable paths from E of degree <= X" therefore
    contains the required psi with probability 1 and has cardinality
    Theta~(X) (one alpha-stable line per split prime, i.e. the ideal-count
    exponent c = 1 of IDEA-20260806-e4c719's identity) instead of X^2. This
    is the c = 1 family lever L2 asks for -- and its price is that
    enumerating it requires deciding, per neighbour, the COMPARISON predicate
    P(E_1 | E) := [delta_{E_1} <= delta_E] without knowing alpha. (L4 reading)
    Descent on delta_E must cross between plateaus. The guaranteed
    <=-neighbours of T2 are =-neighbours at a local minimum; a STRICT decrease
    at E with delta_E = d requires a neighbour E_1 whose lattice
    Hom(E_1, E_1^{(p)}) contains a vector of norm < d OUTSIDE the image
    sublattice eta^sigma o Hom(E, E^{(p)}) o eta-hat (whose norms are all
    >= ell^2 d). Under H2 below that is the ambient event, of probability
    Theta(d^{3/2} p^{-1/2}) -- the same as drawing a fresh uniform curve. The
    L4 gradient question is therefore the single ratio
    R(d) := Pr[delta_{neighbour} < d | delta_E = d] / Pr_uniform[delta < d],
    predicted O(1).

    NUMERIC CONDITIONS FOR AN EXPONENT BELOW 1/3, CONDITIONAL AND UNCLAIMED.
    Via L2: enumerating the alpha-stable ball of norm <= X = p^{1/6} costs
    p^{1/6} * B * C_cmp with C_cmp the cost of the comparison predicate; the
    time exponent falls below 1/3 iff C_cmp = p^{< 1/6}, and would reach 1/4
    iff C_cmp <= p^{1/12+o(1)}, at memory p^{1/6}. Via L4: the descent
    hitting time to the F_p stratum S_1 is p^{1/2+o(1)} / R with R the
    enrichment above; the descent phase alone falls below p^{1/3} iff
    R >= p^{1/6}. Both predicates currently have no candidate below the
    absolute-detection cost T^{1} of the incumbent, and this record's own
    prediction is R = O(1).

  mechanism: >-
    TRACKED OBJECT: the plateau label -- the pair (d, [alpha mod ell]) where d
    = delta_E and [alpha mod ell] is the conjugacy class of the mod-ell
    reduction of the orientation, followed across isogeny edges. What is
    discarded: the endomorphism ring, the isogeny phi itself, and the j
    invariant; what is retained: which quadratic order Z[sqrt(-p*d)] sits
    inseparably in End(E) and how it acts on E[ell]. The retained part
    propagates deterministically along alpha-stable edges (T2) and is
    DESTROYED along non-stable edges except for the Lipschitz bound
    delta_{E_1} <= ell^2 d (IDEA-20260808-8a6cb5's composition argument, read
    this session, is exactly this bound). The projection is genuinely lossy:
    (d, alpha mod ell) is O(log p) bits, and inverting it to phi is the
    problem itself. So the lossy-projection test of docs/inventor-protocol.md
    section 2 is passed non-vacuously.

    WHY THIS IS NOT THE PROGRAM'S EXISTING RESULTS IN NEW NOTATION. (i)
    IDEA-20260805-e7ee4a derives Trd(alpha) = 0 and uses it to fix the RANK
    of a lattice; it never composes alpha with a kernel and never states a
    neighbour rule. (ii) IDEA-20260806-e4c719 puts an "oriented cell" with
    c = 1 into an auxiliary-target census, where the orientation is GIVEN and
    the target differs; here the target is the incumbent's own E^{(p)}, the
    orientation is the UNKNOWN, and c = 1 is shown to be present inside the
    incumbent's own list at the price of a comparison predicate. (iii) The L4
    lineage (H-SSIQ-18dc91 through H-SSIQ-36e970, IDEA-20260805-de1490,
    IDEA-20260807-d53a93) MEASURES descent on delta_E and recorded ANOM-1
    without a mechanism; this record supplies the mechanism and a
    discriminating prediction they did not have. (iv) IDEA-20260808-8a6cb5
    (RQ-SSI-001) uses delta_{E_1} <= ell^2 delta_E; it does not have the
    reverse-direction guarantee delta_{E_1} <= delta_E on stable lines, which
    is what forces ties. (v) GOAL-SSI-001's orientation closure (EV-SSI-8aaad0
    Lane A, read this session) says a KNOWN orientation does not help EndRing
    in any intermediate regime; this record agrees and uses orientation as a
    hidden structure to be inferred, never assumed given.

    STAGE 0 (zero compute, hard gate). Write T1 and T2 with every step
    labelled: (a) descent of an endomorphism along an invariant kernel; (b)
    inseparability of alpha_1 from alpha_1 o eta = Frob_{E_1} o eta^{(p)} o phi;
    (c) the characteristic polynomial of alpha on E[ell] is x^2 - Trd x + Nrd
    for ell != p; (d) x^2 + c is a square over F_2. Check the nearby object
    where the conclusion must fail (see method_ceiling). Any step that does
    not close stops the record.

    STAGE 1 (archived data, zero new search). On the four committed labelled
    2-isogeny graphs (p = 2437, 3889, 5737, 7333; delta_E labels from
    RUN-SSIQ-a85692-b/f and run-h's 194 unbudgeted completions at p = 2437),
    compute for every vertex the count n_<=(E) of 2-neighbours with
    delta <= delta_E and n_<(E) with delta < delta_E. T2 predicts
    n_<= >= 1 for every vertex whose label is exact (the label class X = 23
    covers every delta <= (p/2)^{1/3} < 16 at these primes) -- a single
    exact-labelled vertex with n_<= = 0 refutes T2 outright.

    STAGE 2 (the discriminator). Build the 3-isogeny graph on the same
    primes via Phi_3, reuse the same delta_E labels, and classify every
    structural local minimum m by the Kronecker symbol (-p*delta_m / 3). T2
    predicts: every STRICT local minimum of the 3-graph has symbol -1 (and
    3 not dividing delta_m); vertices with symbol +1 are never strict minima.
    The label-permutation null (the BATCH-009 Red Team's own control,
    30 trials per prime) predicts symbol-independence. This separates the
    mechanism from generic spatial autocorrelation, which is what the
    campaign currently attributes ANOM-1 to.

    STAGE 3 (the L4 ratio). For each d in the observed alphabet, estimate
    R(d) from n_<(E)/3 averaged over vertices with delta_E = d, divided by
    the fraction of all vertices with delta < d. Prediction: R(d) within the
    bootstrap envelope of 1 for every d with adequate support, on every
    prime, and NOT growing with p across the four primes. An R(d) that grows
    with p is the L4 lead branch and triggers independent review before
    interpretation.

