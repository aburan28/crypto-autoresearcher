  assumptions:
    - >-
      d < p/4 so that the trace-vanishing rule applies; automatic for
      d <= (p/2)^{1/3}. Load-bearing for T1.
    - >-
      ell != p, so that alpha acts on E[ell] with the reduced characteristic
      polynomial. Load-bearing for T2; ell = 2 and ell = 3 are the tested cases.
    - >-
      The archived delta_E labels are EXACT at the four primes: the frozen
      search class X = 23 exceeds (p/2)^{1/3} < 16 there, and BATCH-013
      established that truncated searches bias labels UPWARD only, so any
      residual truncation would create spurious STRICT minima -- which is the
      direction that refutes T2, not the direction that rescues it.
    - >-
      Toy scale only for every measured number: p <= 7333 and whatever the
      Stage-2 3-graph build reaches. No number here transfers to cryptographic
      p and none is licensed to.

  proof_search_map:
    bottleneck: >-
      Two predicates, both currently as expensive as absolute detection:
      the COMPARISON predicate [delta_{E_1} <= delta_E] on a neighbour (L2
      reading) and the strict-decrease EXIT RATE from a plateau (L4 reading).
      Every exponent statement in this record is a function of one of these;
      the theorem itself moves no exponent.
    baseline_embedding:
      parameter_slice: >-
        d = 1. Then alpha = Frob, Z[sqrt(-p)] is the orientation, the plateau
        S_1 is the F_p-rational locus, the alpha-stable ell-steps are the
        F_p-rational ell-isogenies (kernels stable under Frobenius), and
        g_ell = 1 + (-p/ell) is the classical count of F_p-rational
        ell-isogenies. The comparison predicate is FREE there (is j in F_p),
        and the alpha-stable-ball meet-in-the-middle IS the Delfs-Galbraith
        F_p-subgraph search. The incumbent Algorithm 2 is the other slice:
        ignore the plateau, list everything (c = 2).
      reproduction_check: >-
        Symbolic: substituting d = 1 in T2 must return the F_p-rational
        isogeny count 1 + (-p/ell) for odd ell, and 'exactly one or all three'
        F_p-rational 2-isogenies for ell = 2 according to whether -p is a
        non-zero non-square or a square mod 8 -- checkable against any
        textbook table of F_p-rational 2-torsion of supersingular curves.
        Fixture: at p = 2437 the F_p-locus vertices' 2-neighbourhoods in the
        committed graph must show the predicted counts.
    observation_collision:
      observable: >-
        The tie n_<=(E) >= 1 (Stage 1) and the strict-minimum symbol class
        (Stage 2).
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED for Stage 1 alone: generic spatial
        autocorrelation of any coarse Lipschitz label on a 3-regular graph
        ALSO produces many ties, which is why the campaign could read ANOM-1
        as autocorrelation. The separating condition is the 3-graph Kronecker
        rule of Stage 2, which autocorrelation does not predict and T2 does.
        A second collision: a vertex whose only tied neighbour is a LOOP
        (E_1 isomorphic to E) satisfies T2 vacuously; loops are reported
        separately and excluded from the count before the test is scored.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Carry (d, alpha mod ell) instead of d alone across edges. The
          stronger state is what survives recursion along stable edges; the
          three maps are: strong state -> delta (take d); one-step
          preservation (T2); initialisation (any minimal phi).
        predicted_gain: >-
          Converts ANOM-1 from an unexplained control-confirmed anomaly into
          a corollary, and yields the Kronecker discriminator.
      - transform: representation_reduction
        proposed_object: >-
          Replace 'find a sub-quadratic list' (L2) by 'decide the comparison
          predicate below absolute detection', and 'find a delta gradient'
          (L4) by 'measure R(d)'. Encoding exact (T4); completeness exact
          (psi is alpha-stable); soundness spent at the predicate; cost loss
          is the whole question and is named.
        predicted_gain: >-
          Two named numbers replace two open levers.
    quantifier_order: >-
      T2: FOR ALL primes p, FOR ALL supersingular E/F_{p^2}, FOR ALL primes
      ell != p, FOR ALL alpha-stable order-ell subgroups K, THERE EXISTS an
      inseparable endomorphism of E/K of norm p*delta_E and trace 0. The
      witness depends on (E, K) and on the chosen minimal phi; NOT claimed:
      uniqueness of the plateau (a curve can carry several small orientations),
      nor that a tied neighbour lies on the SAME plateau when delta_{E_1} < d.
      T4's L4 prediction is heuristic (H2) and is 'for all d in the sampled
      alphabet, R(d) = O(1)'; the weaker reading actually tested is
      'R(d) within the null envelope at four primes'.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: T1 and T2 as derivations; ANOM-1 explained; at the tested
        primes, strict 3-graph minima obey the Kronecker rule and R(d) is
        within [these envelopes]. It can NEVER certify that no cheap
        comparison predicate exists (that is a statement about all
        algorithms), nor that R(d) = O(1) at cryptographic p, nor anything
        about the exponent of the supersingular isogeny problem.
      nearby_object_control: >-
        THE OBJECT WHERE THE HOPED-FOR CONCLUSION FAILS: the label
        delta'_E := minimal degree of an isogeny from E to a FIXED unrelated
        curve E_0 (the rank-4 Hom-lattice of e7ee4a's generic-pair cell). No
        trace-zero endomorphism arises, no orientation descends, and T2 has
        no analogue; the 2-graph must then show STRICT local minima at a
        positive rate. Running Stages 1-3 on delta' labels is the null
        object: if delta' also shows 100 percent ties the instrument is
        seeing autocorrelation, not orientation, and the record is a
        controlled null. A second nearby object: ell = 3 at vertices with
        symbol -1, where T2 guarantees NOTHING and strict minima are allowed.
    proof_obligations:
      - claim: >-
          alpha = Frob o phi has Trd 0 and Nrd p*d for d < p/4, so
          alpha^2 = -p*d.
        responsibility: correctness
      - claim: >-
          alpha descends along every alpha-stable kernel and the descended
          endomorphism is inseparable.
        responsibility: correctness
      - claim: >-
          g_2(E) >= 1 for every supersingular E; g_ell = 1 + (-p*d/ell) for
          odd ell not dividing p*d and primitive orientation.
        responsibility: size
      - claim: >-
          d = 1 reproduces the F_p-rational isogeny counts and the Delfs-
          Galbraith subgraph.
        responsibility: baseline
      - claim: >-
          The middle curve of every balanced split of the minimal phi lies on
          the plateau S_d, so the alpha-stable family contains psi with
          probability 1 and has cardinality Theta~(X).
        responsibility: feasibility
      - claim: >-
          Enumerating the alpha-stable ball costs p^{1/6} * B * C_cmp; the
          exponent moves iff C_cmp = p^{< 1/6}. This is the STRICTNESS
          obligation and it is NOT discharged here.
        responsibility: strictness
      - claim: >-
          Under H2 the strict-decrease exit rate equals the ambient density
          up to a constant.
        responsibility: success_probability
      - claim: >-
          Every measured number is scoped to p <= 7333, the frozen label
          class, and the stated graphs.
        responsibility: scope
    not_applicable_reason: null

  object_first_candidate:
    established_families_off_limits: >-
      OFF-LIMITS AS THE PRIMARY LENS: meet-in-the-middle over the full smooth
      list (the incumbent and 250e50/71c2b2/f313da); the degree-bound lever L1
      (closed in scope); memory tradeoffs (L5, 167fd9, e94ea3); and the
      delta_E DESCENT INSTRUMENT as a lens (thirteen batches). The plateau is
      what those instruments were walking on without naming it.
    tracked_object: >-
      (delta_E, class of alpha mod ell) -- the plateau label.
    lossiness: >-
      Genuinely lossy: O(log p) bits retained out of the endomorphism ring;
      inverting the label to phi is OneEnd itself.
    propagation: >-
      Exact along alpha-stable edges (T2); bounded by ell^2 along all edges;
      destroyed as an equality along non-stable edges.
    survival_score: >-
      Survives indefinitely along the plateau (which is why greedy strict
      descent stalls) and dies at the first non-stable edge unless an
      accidental short vector appears -- the L4 ratio R(d) is exactly the
      death rate.

