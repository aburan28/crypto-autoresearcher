    method: >-
      THE crypto-kb INDEX WAS EMPTY THIS SESSION (':memory:', verified by the
      orchestrator) and was NOT queried. Screening was by direct reading:
      the 20 RQ-SSIQ-9702af proposals listed in the task context (claim
      sections of e99afd, 7424a9, 71c2b2, e7ee4a, c60813, e4c719 read in full;
      the rest by title and context summary), H-SSIQ-545e66 (statement and
      mechanism), the BATCH-001 and BATCH-009 checkpoints, EV-SSIQ-0fc992
      lines 123-144, EV-SSI-8aaad0 lines 25-74, KN-LIT-078, KN-TECH-055/058/
      080, and greps over ledger/ for 'orient', 'class group', 'Kronecker',
      'eigenspace', 'alpha-stable', 'sqrt(-p' (case-insensitive). No web
      search was run; no external source was opened.
    results: >-
      The trace-vanishing rule and the rank-3 lattice are in e7ee4a and
      EV-SSIQ-e43afd. The oriented cell with c = 1 is in e4c719 as an
      auxiliary target. The Lipschitz bound is in 8a6cb5. ANOM-1 is recorded
      in EV-SSIQ-0fc992 as unexplained. NO record states alpha^2 = -p*d, the
      descent of alpha along stable kernels, the guaranteed-neighbour count
      g_ell, the ell = 2 universality, the 3-graph Kronecker discriminator, or
      the plateau reading of L4. Externally, the equivalence "d-isogenous to
      the Frobenius conjugate iff Z[sqrt(-p*d)]-oriented" is almost certainly
      classical (it underlies the F_p-locus = Z[sqrt(-p)] case of Delfs-
      Galbraith and the oriented-curve literature the frozen source cites as
      [40]); ABSENCE OF A LOCATED SOURCE IS NOT EVIDENCE OF NOVELTY, and the
      honest label is unverified.
    verdict: >-
      UNVERIFIED. T1 is claimed as a classical identity restated; T2 is
      elementary and claimed as a derivation, not new mathematics; the
      contribution is the exact match to ANOM-1, the discriminating 3-graph
      prediction, and the reduction of L2 and L4 to two named predicates.

