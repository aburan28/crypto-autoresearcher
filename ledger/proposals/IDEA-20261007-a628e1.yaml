      - ref: KR-IC-f3da82
        provenance: internal
        relation: orthogonal
        delta: >-
          The opened row is F4 trace reuse for decomposition systems.
          The top frontier match on this claim text was that row,
          score 4. This idea adds no Groebner trace. The exponent
          delta is 0.
      - ref: KR-RHO-755e35
        provenance: internal
        relation: orthogonal
        delta: >-
          The opened row is Tate's criterion that isogenous curves
          share a point count. This idea counts fields of definition
          of j. The exponent delta is 0.
  dominated_by: >-
    Compared with KN-TECH-027, opened: classical vectorization is
    subexponential in log p and the quantum cost is
    2^{O(sqrt(log p))}. Three degree-2 isogenies at p = 107 recover
    no ideal. They do not beat that baseline on time, memory, or data.
  sota_delta: >-
    The predicted count of codomain j-invariants in F_107 is 1, out of
    three. The exponent delta against 2^{O(sqrt(log p))} is 0.
