idea:
  id: IDEA-20261007-a628e1
  question_id: RQ-SSI-001
  added: '2026-10-07'
  status: proposed
  approved_by: null
  proposed_by: coordinator
  title: >-
    Exactly one of the three degree-2 Vélu codomain j-invariants from
    y^2 = x^3 + x over F_107 lies in F_107.
  class: measurement
  claim: >-
    Let p = 107 and let E be y^2 = x^3 + x over F_107. The polynomial
    x^3 + x = x(x^2 + 1) has one root in F_107, namely 0, and two roots
    in F_{107^2} and not in F_107. Let j0, j_plus, and j_minus be the
    j-invariants of the Vélu codomains of the three cyclic kernels of
    order 2 generated by those roots. The claim is that exactly one of
    {j0, j_plus, j_minus} lies in F_107, and the other two are distinct
    from it and are Frobenius conjugates. This is a count of field
    membership. It does not recover an ideal, and the exponent delta
    against the opened CSIDH costs is 0.
  mechanism: >-
    p ≡ 3 (mod 4) means -1 is not a square in F_p, so two of the three
    order-2 kernels are quadratic. The codomain j may still fall in F_p.
    The count of rational codomain j-invariants is the measurement.
    KN-TECH-027, opened, does not give this count at p = 107. OBJECT
    FRAME. Representation: three j-invariants. Operation set: the three
    Vélu quotients by the order-2 kernels of x(x^2 + 1). Not translation.
    Weierstrass coefficients are discarded. A j in F_p can come from a
    kernel that is not rational, so the projection is lossy.
  novelty_status: unverified
  citations:
    - ref: KN-TECH-027
      provenance: internal
      claim: >-
        The opened note states the commutative action and its costs.
        It does not count rational codomain j-invariants at p = 107.
      verified_by: coordinator, this session, via knowledge/techniques/KN-TECH-027.md
    - ref: KN-OPEN-015
      provenance: internal
      claim: >-
        The opened note says CSIDH publishes no torsion images. This
        idea uses only the public curve and the 2-division polynomial.
      verified_by: coordinator, this session, via knowledge/open-problems/KN-OPEN-015.md
  assumptions:
    - p = 107 is prime and 107 ≡ 3 (mod 4). The test checks both.
    - "#E(F_107) = 108. If it fails, the instance is missing."
    - x^2 + 1 is irreducible over F_107. If it splits, the kernel split is not the one stated.
  predictions:
    - metric: absolute difference between the base-field codomain count and 1
      direction: lower
      minimum_effect: 0
  minimal_test:
    design: >-
      Confirm the kernel split: one rational root and two conjugate
      roots of x^2 + 1. Build each order-2 Vélu codomain over F_{107^2}
      and record its j-invariant. Count how many of the three j lie in
      F_107. Check that the two non-rational j are Frobenius conjugates.
      Do not walk further and do not publish images of a secret isogeny.
    controls:
      - The kernel (0, 0) is rational of order 2, and its dual restores j(E).
      - The two roots of x^2 + 1 are absent from F_107 and are Frobenius conjugates.
      - Each codomain model is nonsingular. A singular codomain invalidates that kernel.
      - "#E(F_107) = 108."
    required_metrics:
      - rational_kernel_count
      - codomain_j_in_base_field_count
      - conjugate_pair
  falsification_conditions:
    - All three codomains are defined and the number of j in F_107 is not 1.
    - The two j outside F_107 are defined and are not Frobenius conjugates.
    - x^2 + 1 splits over F_107, so the stated kernel split is false and the comparison is not run.
    - "#E(F_107) is not 108."
  confounders:
    - Quadratic twists share a j-invariant. Field membership of j is not membership of a Weierstrass model.
    - A codomain j in F_107 does not mean the kernel was rational.
  interpretation_limits:
    - One prime and degree 2 only. No transfer to CSIDH-512.
    - This is not a return-length comparison and not an automorphism that squares to negation.
    - Exponent delta against KN-TECH-027 is 0.
  heuristic_assumptions:
    - id: H1
      statement: >-
        At p = 107 only, a non-rational order-2 kernel has codomain j
        outside F_p, and the rational kernel (0, 0) has codomain j in
        F_p. That split is not a theorem in the opened notes. No
        transfer to another prime is claimed.
      rigorous_support: >-
        KN-TECH-027, opened, does not identify kernels of x(x^2 + 1)
        with ideal classes. The test uses the three computed j values.
      validation_plan: >-
        Compute the three codomain j-invariants once at p = 107.
        Consistency checks are the kernel split, nonsingularity, the
        point count 108, and dual restoration for the rational kernel.
        Sample size three kernels, no tail.
  target_complexity:
    time_exponent: >-
      Three degree-2 Vélu quotients over a quadratic extension of a
      107-element field. Polynomial in the fixed p.
    memory_exponent: O(1) field elements.
    best_known: >-
      KN-TECH-027, opened: classical vectorization subexponential in
      log p, and quantum cost 2^{O(sqrt(log p))}. Those baselines are
      not claimed.
    hidden_overhead: No o(1) term. The output is one integer in 0..3 and a conjugate bit.
    tradeoff_note: No time-memory tradeoff. One curve, three kernels.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
