idea:
  id: IDEA-20260807-c98c3d
  question_id: RQ-TORS-8c7b79
  added: '2026-08-07'
  title: >-
    THE ELKIES/ATKIN SPLIT PATTERN AS A K-INDEPENDENT ISOGENY-CLASS FINGERPRINT --
    stated up front to carry zero information about k, and proposed instead as
    (i) a polylog class-membership sieve that replaces O(sqrt(p)) point counting in
    the enumeration L1 requires, and (ii) a cost predictor telling the campaign in
    advance which curves are cheap to walk from
  class: tooling

  claim: >-
    (A) THE K-INDEPENDENCE, STATED FIRST AND WITHOUT QUALIFICATION, BECAUSE THE
    LANE'S HARD CONSTRAINT DEMANDS IT. For each prime ell != p, the classification
    of ell as Elkies (X^2 - tX + p has a root mod ell, equivalently t^2 - 4p is a
    square mod ell), Atkin (no root), or ramified (ell divides t^2 - 4p) is a
    function of (t, p, ell) ALONE. The factorisation type of psi_ell over F_p and
    the Galois-module structure of E[ell] are likewise determined by the action of
    Frobenius, whose characteristic polynomial is X^2 - tX + p. NONE of these reads
    P or Q. Therefore the whole Elkies/Atkin fingerprint is a CURVE-ONLY statistic
    and is INDEPENDENT OF k BY CONSTRUCTION. No experiment is needed to establish
    that and none is proposed; the static provenance gate of IDEA-20260807-bd5d91
    would reject any k-correlation study of this statistic before it ran. This
    record therefore does not ask whether the fingerprint leaks k. It asks what
    else it is worth.

    (B) IT IS AN ISOGENY-CLASS INVARIANT, WHICH IS WHAT MAKES IT A FINGERPRINT.
    Two curves over F_p are F_p-isogenous exactly when they have the same number of
    points, hence the same trace t (Tate). Since the Elkies/Atkin classification
    depends only on (t, p, ell), the ENTIRE PATTERN over any set of primes is
    CONSTANT ON AN F_p-ISOGENY CLASS. So the pattern is a necessary condition for
    class membership: if E and E'' disagree at any ell, they are in different
    classes. This is [fact] and follows from DECOMPOSITION.md T4 ("fixing the class
    fixes t").

    (C) USE 1 -- A CLASS-MEMBERSHIP SIEVE, WITH THE ARITHMETIC DONE HONESTLY.
    L1 (RQ-ICINV-475b5e) is the campaign's gating lane and its decisive test
    requires ENUMERATING A WHOLE TOY ISOGENY CLASS. The naive route is to compute
    #E for every candidate curve: harness/toycurve.py offers order() at O(p) and
    order_bsgs() at O(sqrt(p)) scalar multiplications. The fingerprint route is:
      - For each ell in L = {3,5,7,11,13}, build psi_ell over F_p once per curve
        (degree (ell^2-1)/2, i.e. 4, 12, 24, 60, 84) and factor it over F_p.
      - Elkies detection: a Galois-stable order-ell subgroup exists exactly when a
        degree-(ell-1)/2 kernel polynomial divides psi_ell; found by testing which
        products of irreducible factors have a root set closed under the x-only
        group law.
      - For Elkies ell, the eigenvalue lambda in F_ell can be pinned by testing the
        eigenvalue relation on the kernel, giving t ≡ lambda + p/lambda mod ell.
        This determines t mod ell EXACTLY.
      - For Atkin ell, the split degree of psi_ell constrains t mod ell to a proper
        subset. This record marks the exact Atkin constraint as [open] -- it is
        standard SEA material but is NOT re-derived here, and the sieve's declared
        strength uses ONLY the Elkies primes.
    COST ARITHMETIC, stated as inequalities rather than as a promised speedup.
    Per curve the fingerprint costs O(sum_ell ell^2 * polylog p) field operations
    -- polynomial in log p and independent of p's size in the leading term --
    versus O(sqrt(p)) group operations for order_bsgs. At p ~ 2^32 that is roughly
    a few thousand field operations against ~65536 scalar multiplications, so the
    per-curve screen is cheaper by orders of magnitude at exactly the sizes this
    campaign runs. The sieve's SELECTIVITY is the measured quantity: a candidate
    curve survives only if its t mod ell agrees with the target class at every
    Elkies ell, and the retention rate is predicted to be about
    prod_{Elkies ell in L} (1/ell). With an expected 2 to 3 Elkies primes among
    {3,5,7,11,13} (see H1), the typical modulus is a product like 3*7 = 21 or
    3*7*13 = 273, so the predicted retention is between roughly 1/21 and 1/1001,
    with 1/15015 as the best case when all five are Elkies. THE RANGE IS WIDE AND
    IS REPORTED AS A RANGE; a single figure would be dishonest.

    (D) USE 2 -- A COST PREDICTOR FOR OTHER LANES. The number and identity of
    Elkies primes determines which small-ell transports (IDEA-20260807-053a55) are
    available from a given curve, hence the branching factor of any isogeny walk
    (IDEA-20260807-631e80), hence the cost of L2's volcano construction. A curve
    with zero Elkies primes among the declared L admits NO cheap small-ell
    transport at all and is a dead end for those lanes. Knowing this BEFORE
    spending a walk budget is the predictor's value. This is also, for
    completeness, the classical role of Elkies primes: they are what makes SEA
    subexponential rather than exponential in log p, and the least Elkies prime is
    bounded by (2 log 4q + 4)^2 under GRH (KN-LIT-1175, relayed from abstract).

    (E) TWO OUTCOMES, BOTH DELIVERABLES.
      OUTCOME 1 -- the sieve's measured retention rate matches prod 1/ell over the
        Elkies primes. The fingerprint is a working, quantified screen and the
        campaign gains a tool with a known selectivity, which is what L1 needs to
        size its enumeration budget.
      OUTCOME 2 -- the retention rate is materially worse than predicted. Then
        either the eigenvalue pinning is not determining t mod ell as claimed
        (an implementation or theory error, which the frozen fixture will localise)
        or the candidate curve population is not behaving like uniform t, which is
        itself a fact about harness/toycurve.py's generator that every other lane
        needs to know. Both are useful; neither is a non-event.

  resource_label: R5
  admissibility: admissible
  admissibility_argument: >-
    ADMISSIBLE AS A RESOURCE USE, WITH ZERO ATTACK VALUE CLAIMED. The fingerprint
    reads E[ell] as a Galois module -- the factorisation of psi_ell over F_p and
    the existence of Frobenius eigenvectors -- which is field-level data that the
    generic group oracle does not supply and cannot simulate: a GGM simulator
    holding only group handles has no access to psi_ell at all. So R5 genuinely
    escapes the generic model here. The escape buys nothing about k, and the record
    says so in claim (A) rather than trading on the admissibility label. This is
    the case the DECOMPOSITION.md filter does not directly cover: a resource can
    escape the generic model and still be useless for key recovery because it never
    touches the point. Recording that as a distinct outcome category is part of the
    contribution.

  discriminated_from:
    - >-
      EV-ICI-0bdaaa / DEC-20260804-d0c452 (Elkies ell-isogeny preimage augmentation
      of an index-calculus factor base, found indistinguishable from a random
      bijection). That line USES Elkies isogenies as maps on points to change
      relation yield. This record uses the Elkies/Atkin CLASSIFICATION as a
      curve-level label and mounts no index calculus. Different object, different
      metric, and this record makes no claim the earlier one refuted.
    - >-
      L2 / RQ-VOLC-f6253b (volcano level and endomorphism-ring depth). The
      Elkies/Atkin pattern is CONSTANT on the class; the volcano level is NOT. The
      two are complementary and are deliberately split: this record covers the
      class-constant part and IDEA-20260807-1d9c5f covers the within-class-varying
      part. Conflating them would produce a "fingerprint" that is not actually
      constant on the class, which would silently break the sieve.
    - >-
      SEA point counting itself. This is SEA's Elkies/Atkin machinery, applied to
      a different task (class membership screening at toy scale) rather than to
      point counting. No novelty is claimed against SEA and none is available.
    - >-
      IDEA-20260807-053a55. That record builds the transport primitive and needs
      the Elkies test as a subroutine; this record builds the classification and
      its selectivity measurement. They share code (psi_ell, kernel extraction) and
      must be implemented once, but they answer different questions and their
      failure modes are different -- transport can be correct while the sieve is
      badly selective, and vice versa.

  object_first_candidate:
    tracked_object: >-
      THE FINGERPRINT VECTOR f(E) = ( class_ell(E), t mod ell if Elkies )_{ell in L}
      for L = {3,5,7,11,13}, where class_ell in {Elkies, Atkin, ramified}.
    lossiness: >-
      Extremely lossy at the curve level and PASSES the lossy-projection test in
      the direction it needs to: f(E) forgets (a, b), forgets j(E), forgets the
      volcano level, and retains only t modulo a product of small primes. It is not
      a change of coordinates -- many curves share a fingerprint, which is exactly
      why it is a sieve and not an identifier. What it must NOT be read as: a
      lossy projection of the ECDLP INSTANCE. It forgets P and Q entirely, i.e. it
      is on the wrong side of the lane's hard constraint, and the record's honesty
      requirement is to say so rather than to let "lossy projection" carry an
      implication of usefulness for key recovery.
    propagation: >-
      Propagates PERFECTLY under isogeny: f(E) = f(E') whenever E and E' are
      F_p-isogenous, because t is an isogeny invariant. That is the sharpest
      possible propagation and it is exactly what makes the object a class label.
      It also makes the object useless for distinguishing curves WITHIN a class,
      which is the complementary statement and the reason
      IDEA-20260807-1d9c5f exists.
    survival_score: >-
      Survives every isogeny in the class, forever, unchanged. Dies as a
      DISCRIMINATOR the moment the question is about two curves in the same class,
      and dies as a k-statistic immediately and by construction.

  mechanism: >-
    STEP 1 -- build psi_ell over F_p for ell in {3,5,7,11,13} (shared code with
    IDEA-20260807-df906f and IDEA-20260807-053a55; degrees 4, 12, 24, 60, 84).

    STEP 2 -- classify each ell: compute t exactly at toy scale via
    harness/toycurve.py's order()/order_bsgs(), then test whether t^2 - 4p is a
    square, a non-square, or zero mod ell. Independently, factor psi_ell over F_p
    and search for a Galois-stable order-ell kernel. THE TWO ROUTES MUST AGREE ON
    EVERY CURVE: Elkies by the trace test if and only if a rational kernel exists.
    That agreement is a cross-check the implementation gets for free and is the
    single most valuable instrument control in this proposal, because it validates
    the kernel-extraction code that IDEA-20260807-053a55 depends on.

    STEP 3 -- eigenvalue pinning for Elkies ell: for a rational kernel C with
    kernel polynomial h_C, find lambda in F_ell with Frobenius acting on C as
    multiplication by lambda, by testing x(pi(T)) = x([lambda]T) for a root T of
    h_C, i.e. comparing x^p mod h_C against the lambda-th division-polynomial
    x-coordinate expression mod h_C. Then t ≡ lambda + p*lambda^{-1} mod ell.
    Cross-check against the exactly known t. AT TOY SCALE THIS CROSS-CHECK IS
    AVAILABLE AND IS MANDATORY -- it is the reason to do this at toy scale at all,
    because at cryptographic scale t is what one is trying to compute and no check
    exists.

    STEP 4 -- the sieve measurement: fix a target class by choosing one curve E_0
    and computing its fingerprint. Draw a large population of random curves over
    the same p. Report (i) the fraction surviving the fingerprint screen, (ii) the
    fraction of survivors that are ACTUALLY in the class (verified by exact point
    counting), and (iii) the total wall clock of the screened enumeration versus
    the unscreened one. Metric (ii) is the precision and metric (i) is the
    retention; a sieve with high retention and low precision has failed even if it
    is fast.

    STEP 5 -- the predictor table: for 50 curves per field size, record the number
    and identity of Elkies primes among L, and the resulting available transport
    branching factor. Hand this table to L1, L2, L13 and IDEA-20260807-631e80 as
    the budgeting input.

  novelty_status: known
  novelty_screen:
    method: >-
      Commands run 2026-08-07 from the repository root:
      `grep -ril "Elkies\|Atkin" ledger/ knowledge/ docs/ analysis/`;
      `grep -ri "Elkies" knowledge/SOURCES.md`;
      `grep -ril "SEA\b\|Schoof" knowledge/techniques/`; plus reads of
      KN-LIT-1175, KN-LIT-1310, EV-ICI-0bdaaa, DEC-20260804-d0c452,
      DECOMPOSITION.md sections 3 and 4.
    results: >-
      Elkies/Atkin appear in this corpus in exactly three roles: (i) the ICI
      factor-base augmentation line (EV-ICI-0bdaaa and its decisions), (ii) the
      Wesolowski isogeny cost model (KN-FIND-4e7a92), (iii) the external literature
      entries KN-LIT-1175 (counting function for Elkies primes; least Elkies prime
      bounded by (2 log 4q + 4)^2 under GRH for q >= 10^9), KN-LIT-1310 (asymptotic
      distribution of the Elkies-prime count is Gaussian), KN-LIT-403, KN-LIT-241 --
      all recorded at `confidence: reported` from abstracts. NO record uses the
      Elkies/Atkin pattern as a class fingerprint or as a membership sieve, and no
      record measures its selectivity.
    verdict: >-
      KNOWN as mathematics -- this is the Elkies/Atkin machinery of SEA and nothing
      about it is new. NEW TO THIS CORPUS as a stated tool with a measured
      selectivity, and filed because the L7 brief explicitly requires a proposal on
      the split pattern as a curve-level fingerprint, and because L1 cannot size
      its class enumeration without this number. External novelty for the
      SIEVE-SELECTIVITY MEASUREMENT specifically is UNVERIFIED (no web search
      performed this session).

  null_object_control: >-
    MANDATORY AND SUPPLIED. MATCHED NULL OBJECT: a RANDOM FINGERPRINT of the same
    shape -- assign each curve a vector of |L| labels drawn from the same marginal
    distribution as the real Elkies/Atkin labels (estimated from the population)
    but INDEPENDENT of the curve. Screening on the random fingerprint must retain a
    fraction equal to the product of the label match probabilities and must have
    PRECISION EQUAL TO THE CLASS'S BASE RATE -- i.e. it must find no true class
    members beyond chance. If the real fingerprint's precision does not exceed the
    random fingerprint's, the sieve is doing nothing and the tool is worthless.
    DECAY PARAMETER: the number of primes |L| in the fingerprint. The real
    fingerprint's precision must RISE toward 1 as |L| grows from 1 to 5, because
    each additional Elkies prime multiplies the constraint on t. A precision that
    is flat in |L| is the canonical artifact tell -- it would mean the screen is
    keying on something other than t. SECOND CONTROL, in the opposite direction:
    two curves KNOWN to be in the same class (constructed by applying one verified
    Elkies transport from IDEA-20260807-053a55) must have IDENTICAL fingerprints at
    every ell. A fingerprint that differs across a verified isogeny is not a class
    invariant and the tool is broken.

  assumptions:
    - >-
      t is exactly computable at toy scale, so both the classification and the
      eigenvalue pinning can be cross-checked against ground truth. This is the
      defining advantage of doing this at 16-32 bits and it disappears entirely at
      cryptographic scale; nothing measured here transfers as a validated
      procedure to a size where t is unknown.
    - >-
      ell <= 13 and ell != p, so psi_ell has degree at most 84 and pure-Python
      polynomial arithmetic over F_p is affordable. ell = 17 (degree 144) and
      beyond are explicitly outside this contract's budget.
    - >-
      The Atkin-prime constraint on t mod ell is NOT used in the declared sieve
      strength. It is standard SEA material, it would strengthen the sieve, and it
      is marked [open] here because this record does not re-derive it and will not
      assert it.
    - >-
      "Random curves over the same p" means curves drawn by a declared generator
      with recorded seeds. The measured base rate of class membership depends on
      that generator, and any retention/precision figure must be reported together
      with it.

  proof_search_map:
    bottleneck: >-
      The eigenvalue pinning (STEP 3): computing x^p mod h_C requires a modular
      exponentiation in F_p[x]/(h_C) with deg h_C = (ell-1)/2 <= 6 for ell <= 13,
      which is cheap -- but only AFTER the kernel polynomial h_C has been extracted,
      and the extraction (a search over products of irreducible factors of psi_ell)
      is the real bottleneck and the reason for the ell <= 13 cap.
    baseline_embedding:
      parameter_slice: >-
        ell = 3, where deg psi_3 = 4 and deg h_C = 1: the kernel polynomial is a
        single root of a quartic and the eigenvalue relation reduces to
        lambda in {1, 2} mod 3, checkable by hand. This slice reproduces the
        classical Elkies step in its smallest instance.
      reproduction_check: >-
        Frozen fixture: one 16-bit curve with 3 Elkies and its exactly known t;
        assert that the pinned lambda satisfies lambda + 3*lambda^{-1} ≡ t mod 3
        by exact integer arithmetic. A mismatch localises the error to STEP 3 and
        halts the line before any sieve number is produced.
    observation_collision:
      observable: >-
        The fingerprint vector f(E).
      distinct_preimage_search: >-
        REQUIRED AND GUARANTEED TO SUCCEED: the fingerprint is designed to collide.
        Every curve in a class shares it (that is the invariance), and curves in
        DIFFERENT classes share it whenever their traces agree modulo the Elkies
        primes. The second kind of collision is precisely the sieve's false-positive
        rate and must be MEASURED, not assumed small -- metric (ii) in STEP 4. A
        record reporting retention without precision has hidden this collision and
        is incomplete.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Build a problem-specific resource measure -- "candidate traces surviving
          the fingerprint" -- realised by specialising t to a residue class mod
          each Elkies ell, and add constraints only over DISTINCT primes so the
          CRT blocks are provably disjoint. The packed measure is the surviving
          count 4*sqrt(p) / prod_{Elkies ell} ell.
        predicted_gain: >-
          At p ~ 2^32 the Hasse interval holds about 4*sqrt(p) ~ 2.6 x 10^5
          candidate traces; dividing by a typical modulus of 21 to 273 leaves
          roughly 10^3 to 10^4, and by the best-case 15015 leaves about 17. These
          are ARITHMETIC CONSEQUENCES of the stated modulus, not measured results,
          and the modulus itself is a random variable whose distribution H1
          addresses.
    quantifier_order: >-
      Claimed: FORALL primes ell != p, FORALL pairs of F_p-isogenous curves E, E',
      class_ell(E) = class_ell(E'). The witness (the trace t) depends on the CLASS
      and on nothing else -- not on the curve within the class, not on the points,
      not on k. The dangerous weaker reading NOT claimed: "for every pair of curves
      with the same fingerprint there exists an isogeny between them", which is
      FALSE and is exactly the false-positive direction the precision metric
      measures. Stating the converse and marking it false is the point of this
      audit.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Two curves with different Elkies/Atkin fingerprints are not F_p-isogenous,
        and the screen costs O(polylog p) per curve." It can NEVER certify class
        membership (only non-membership), can never distinguish curves inside a
        class, and can never say anything about k.
      nearby_object_control: >-
        The nearby object where the desired conclusion FAILS is a pair of curves in
        DIFFERENT classes whose traces happen to agree modulo every Elkies prime in
        L. Such pairs exist and must be exhibited by construction (choose t and t'
        congruent mod prod ell but different in the Hasse interval). A sieve that
        cannot exhibit its own false positives has not been characterised.
    proof_obligations:
      - claim: class_ell depends only on (t, p, ell).
        responsibility: correctness
      - claim: F_p-isogenous curves have equal t.
        responsibility: correctness
      - claim: The trace test and the rational-kernel test agree on every curve.
        responsibility: correctness
      - claim: The pinned lambda satisfies t ≡ lambda + p/lambda mod ell against known t.
        responsibility: baseline
      - claim: Reported retention is accompanied by measured precision.
        responsibility: scope
      - claim: The Atkin constraint is not used in any declared strength figure.
        responsibility: scope

  predictions:
    - metric: >-
        Agreement between the trace-based Elkies test (t^2 - 4p a square mod ell)
        and the rational-kernel existence test, over 50 curves x 5 primes x 3 field
        sizes
      direction: different
      minimum_effect: >-
        100 percent agreement. A single disagreement is an implementation error in
        the kernel extraction and blocks IDEA-20260807-053a55 as well. BASIS -
        standard (Elkies condition equals existence of a Frobenius eigenvector on
        E[ell] equals existence of a Galois-stable order-ell subgroup); used here
        as a KNOWN-ANSWER CALIBRATION and NOT re-derived.
    - metric: >-
        Fingerprint equality across a verified Elkies transport E -> E'
      direction: different
      minimum_effect: >-
        Identical at every ell on 100 percent of transports. BASIS - derivation
        (t is an isogeny invariant); UNTESTED in this campaign.
    - metric: >-
        Sieve retention (fraction of random curves surviving) and precision
        (fraction of survivors truly in the class), at |L| = 1, 2, 3, 4, 5
      direction: lower
      minimum_effect: >-
        Retention must fall monotonically as |L| grows and must lie within a factor
        2 of prod_{Elkies ell used} (1/ell). Precision must rise monotonically
        toward 1. If retention is flat in |L|, the screen is not keying on t and
        the tool is void. BASIS - the retention target is an arithmetic consequence
        of eigenvalue pinning, PRE-REGISTERED with a factor-2 band chosen a priori;
        the monotonicity requirements are UNTESTED EXPECTATIONS.
    - metric: >-
        Wall clock of screened versus unscreened class enumeration over a fixed
        candidate population at 24 and 28 field bits
      direction: lower
      minimum_effect: >-
        The screened enumeration must be strictly faster at 28 bits, where
        order_bsgs dominates. NO SPECIFIC FACTOR IS PREDICTED, because the
        pure-Python constant for degree-84 polynomial factorisation is unknown to
        this record and guessing it would be fabrication. The measured factor IS
        the deliverable.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): write the k-independence statement (claim A) and the
      class-invariance argument (claim B). Both are complete without any run and
      both are required outputs regardless of what follows.
      STAGE 1 (hours): implement psi_ell and the two Elkies tests; run the
      100-percent agreement check. HARD GATE.
      STAGE 2 (hours): eigenvalue pinning with the exact-t cross-check on the ell=3
      frozen fixture, then across the grid. HARD GATE at ell = 3.
      STAGE 3 (hours): the sieve measurement -- retention and precision at
      |L| = 1..5, against the random-fingerprint null, at 20/24/28 field bits, with
      a declared candidate population of at least 200 curves per cell.
      STAGE 4 (minutes): construct false-positive pairs by choosing congruent
      traces, confirming the method ceiling empirically.
      STAGE 5 (hours): the predictor table for downstream lanes.
      BUDGET: ell capped at 13 (deg psi_13 = 84) because polynomial factorisation
      cost, not field size, is the driver in pure Python; the whole line is sized
      at a few CPU-hours and no cell exceeds 28 field bits.
    controls:
      - random-fingerprint null with matched label marginals (blocking)
      - fingerprint invariance across a verified transport (blocking)
      - trace-test versus kernel-test agreement (blocking)
      - eigenvalue pinning against exactly known t (blocking)
      - constructed false-positive pair (method-ceiling demonstration)
      - anomalous and smooth-order curve exclusion per KN-TECH-034 before any timing
    required_metrics:
      - class_ell per (curve, ell) by both routes, with agreement flag
      - pinned lambda and derived t mod ell versus exact t
      - retention and precision per |L| per field size, with the random-fingerprint null
      - wall clock, screened versus unscreened, per field size
      - Elkies-prime count distribution over the curve population
      - available transport branching factor per curve

  falsification_conditions:
    - >-
      The trace test and the kernel test disagree on any curve. Implementation
      error; the line halts and IDEA-20260807-053a55's kernel extraction is
      implicated too.
    - >-
      A verified Elkies transport changes the fingerprint. Then either the
      transport is not an isogeny or the fingerprint is not a class invariant; both
      are hard failures and neither is a mathematical result until replicated.
    - >-
      Pinned lambda gives t mod ell disagreeing with the exactly known t. STEP 3 is
      wrong; the sieve's selectivity claim is withdrawn.
    - >-
      Retention is flat in |L| or precision does not exceed the random-fingerprint
      null. The sieve is not working and the tool is not delivered. This is a real
      possible negative and it is the reason the null is blocking.
    - >-
      Screened enumeration is SLOWER than unscreened at every tested size. The tool
      is dominated by the incumbent and should not be adopted; this is a legitimate
      and informative negative, recorded with the measured constants.
    - >-
      Degree-84 factorisation exceeds the wall-clock budget at 28 bits. INFRASTRUCTURE
      outcome under AGENTS.md rule 5; the declared ell ladder is reduced and the
      reduction is recorded, not read as a mathematical result.

  confounders:
    - >-
      The ramified case ell | (t^2 - 4p) is neither Elkies nor Atkin in the clean
      sense and must be a third label. Folding it into either side corrupts both
      the classification and the retention arithmetic.
    - >-
      Curve-generator bias. harness/toycurve.py picks p and then searches
      deterministically for a curve with a usable subgroup; the resulting trace
      distribution is NOT guaranteed uniform, and the sieve's measured retention is
      a joint property of the sieve and the generator. Any figure must name the
      generator and its seeds.
    - >-
      Base rate. If the target class is large relative to the candidate population,
      precision is high for trivial reasons. The class size must be reported
      alongside precision or the number is uninterpretable.
    - >-
      Pure-Python constants. The screened-versus-unscreened timing compares a
      polynomial-arithmetic cost against a scalar-multiplication cost in the same
      interpreter; the crossover point is an artefact of the implementation and does
      not transfer to a compiled or Sage-based harness. Stated with every timing.

  interpretation_limits:
    - >-
      Zero information about k. This is the record's first claim, not a caveat, and
      any downstream citation that omits it is misusing the record.
    - >-
      The fingerprint proves NON-membership only. It never proves two curves are
      isogenous, and the false-positive construction in STAGE 4 exists to make that
      impossible to forget.
    - >-
      All figures are toy scale in pure Python; claim_tier capped at toy.
    - >-
      The Atkin-side strengthening is not claimed and not measured; a future record
      that adds it must re-derive the constraint rather than cite this one.
    - >-
      KN-LIT-1175 and KN-LIT-1310 are relayed from abstracts at
      `confidence: reported` in this corpus and are cited as context, never as
      support for any measurement here.

  heuristic_assumptions:
    - id: H1
      statement: >-
        Over the declared toy curve population, the number of Elkies primes among
        L = {3,5,7,11,13} behaves like a Binomial(5, 1/2) variable, so the sieve
        modulus prod_{Elkies ell} ell has median around 21 to 273 and reaches 15015
        on about 1 curve in 32.
      rigorous_support: >-
        Rigorous half: for a FIXED curve, ell is Elkies exactly when t^2 - 4p is a
        square mod ell -- a decidable condition with no randomness. Distributional
        half: this imitates the classical Chebotarev-type equidistribution of the
        Frobenius splitting condition over the population of curves, the same
        family of statements that KN-LIT-1310 reports as giving a Gaussian
        asymptotic for the Elkies-prime count and KN-LIT-1175 reports as bounding
        the least Elkies prime by (2 log 4q + 4)^2 under GRH. BOTH ARE RELAYED FROM
        ABSTRACTS in this corpus, neither was read in full here, and neither is
        being used as a proof of H1 -- they are named as the classical statements
        H1 imitates, which is what the contract requires.
      validation_plan: >-
        SAMPLE: at least 200 curves per field size at 20, 24, 28 bits from the
        declared generator with recorded seeds; t computed exactly. SHORTCUT: none
        needed -- exact point counting is affordable at toy scale, which is the
        whole reason to measure it here. COMPARISON DISTRIBUTION: empirical Elkies-
        count histogram against Binomial(5, 1/2) by chi-squared, and the empirical
        modulus distribution against the induced distribution of prod ell.
        TAIL CHECKS: (i) the fraction of curves with ZERO Elkies primes in L,
        against the predicted 1/32 -- these curves are unreachable by cheap
        transport and directly bound IDEA-20260807-631e80; (ii) the largest
        observed modulus against the maximum 15015. TOY SCALE ONLY, LABELLED AS
        SUCH: this is a property of a 20-28 bit curve population under one
        generator, not a cryptographic-scale distribution, and the Gaussian regime
        of KN-LIT-1310 concerns many primes and large q and is not tested here.

  reachability_gate: >-
    REQUIRED AND ANSWERED, because the sieve's purpose is to support movement
    between curves. IS A GOOD OBJECT REACHABLE, AND AT WHAT COST? The fingerprint
    is NOT a reachability tool -- it identifies the CLASS, not a curve within it,
    and by claim (B) it is constant on the class, so it can never guide a walk
    toward a particular curve. Under T5 that places it firmly on the "global
    address" side of the dichotomy for within-class navigation: useless. Where it
    DOES bear on reachability is one level up, as a NECESSARY-CONDITION FILTER on
    which candidate curves are even in the class before any walk is attempted, and
    as the predictor of how many small-ell transports exist from a given curve
    (STEP 5), which is the branching factor every walk cost depends on. Stating
    that it cannot guide within-class navigation is as important as stating what it
    can do, because "fingerprint" invites exactly the wrong inference.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED and none is available: the object never touches
      k. As a TOOL: O(sum_ell ell^2 * polylog p) field operations per curve for the
      screen, against O(sqrt(p)) group operations for order_bsgs and O(p) for naive
      counting. The screen's exponent in p is 0 in the leading term; the incumbent's
      is 1/2. That comparison is about ENUMERATION COST, not about attack cost, and
      conflating the two would be exactly the overclaim this record is written to
      avoid.
    memory_exponent: >-
      O(polylog p): one polynomial of degree at most 84 per (curve, ell). Negligible
      beside order_bsgs's O(1) and BSGS's sqrt(N).
    best_known: >-
      For class enumeration at toy scale, the incumbent in this harness is exact
      point counting: order() at O(p) and order_bsgs() at O(sqrt(p)) scalar
      multiplications (harness/toycurve.py). At cryptographic scale the incumbent is
      SEA, of which this machinery is a part; no improvement to SEA is claimed. For
      ECDLP itself the frontier is unchanged: rho at 0.886*sqrt(N) with O(1) memory
      (KN-TECH-001, KN-TECH-006), automorphism-discounted (KN-TECH-018), and BSGS
      at 2*sqrt(N) time and sqrt(N) memory (KN-TECH-031).
    hidden_overhead: >-
      The polylog screen hides a per-(curve, ell) polynomial construction and
      factorisation whose pure-Python constant is unknown to this record and is the
      measured quantity; at small p that constant can exceed the O(sqrt(p)) it is
      meant to replace, which is why the crossover is measured rather than asserted.
      Also hidden: the sieve's usefulness depends entirely on precision, and a fast
      screen with base-rate precision is worth nothing.
    tradeoff_note: >-
      Not an attack, so no cryptanalytic time-memory tradeoff. Operationally the
      screen trades a fixed polynomial-arithmetic cost against a p-dependent
      point-counting cost, so its advantage GROWS with p -- which is why the timing
      is measured at 28 bits and not only at 16.

  dominated_by: >-
    AS AN ATTACK: mounts none and cannot, so it is dominated on every axis by every
    row of the prime-field frontier, checked individually -- parallel rho with
    distinguished points (0.886*sqrt(N) group operations, O(1) memory per
    processor, KN-TECH-001/KN-TECH-006); automorphism-discounted rho on CM curves
    (KN-TECH-018); BSGS (2*sqrt(N) time, sqrt(N) memory, KN-TECH-031);
    Pohlig-Hellman as the instance-defining reduction (KN-TECH-030). Data/query
    axis: it consumes no oracle and produces no solve.
    AS A CLASS-ENUMERATION TOOL: dominated by SEA at any scale where SEA is
    available (this is a fragment of SEA), and dominated by exact point counting at
    field sizes small enough that O(p) is cheap -- the crossover being the measured
    quantity in STAGE 3. It is NOT dominated by anything currently in this harness,
    which contains no partial-SEA machinery at all.
  sota_delta: >-
    Zero speedup against any attack baseline; zero information about k, by
    construction and stated first. Tooling delta, quantified: replaces an
    O(sqrt(p))-per-curve membership test with an O(polylog p)-per-curve necessary
    condition whose measured retention is predicted within a factor 2 of
    prod_{Elkies ell} (1/ell) -- typically between 1/21 and 1/1001 and at best
    1/15015 -- turning the 4*sqrt(p) ~ 2.6 x 10^5 candidate traces at p ~ 2^32 into
    roughly 10^3 to 10^4 typical survivors, or about 17 in the best case. Every one
    of those figures is an arithmetic consequence of the stated modulus, not a
    measurement, and the measurement is the deliverable.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.99 that the k-independence and class-invariance claims are correct -- both are
    immediate from t being an isogeny invariant. 0.85 that the trace test and
    kernel test agree at 100 percent once implemented (the risk is the ramified
    case and the kernel-subset search, not the mathematics). 0.6 that eigenvalue
    pinning is implemented correctly at ell in {11, 13} on the first attempt.
    0.5 that the screened enumeration is measurably faster than unscreened at 28
    bits in pure Python -- the constants genuinely could go either way, and that
    uncertainty is the honest reason this is medium and not high priority. Near 1
    that the record is useful regardless, because L1 needs the retention number to
    size its enumeration and does not currently have it.

