    - metric: theta_loop (fitted exponent of the (m-1)-fold loop's cost in n at fixed m)
      direction: flat
      minimum_effect: 1 - 1/m within 0.05 (exact baseline; a deviation is an instrument defect).
    - metric: theta_closure (fitted exponent of the degree-D closure oracle's cost in n at fixed m, D bounded)
      direction: different
      minimum_effect: >-
        No directional pre-registration; reported with interval and degree
        profile. theta_closure below 1/2 - 1/m WITH a degree profile that
        does not grow along the ladder is the LEAD reading; theta_closure at
        or above the line, or a profile that grows with n, is the closure
        reading for that solver at toy scale.
    - metric: theta_null (the same fit on the same-support random-bilinear null)
      direction: higher
      minimum_effect: at or above the generic MQ value for square systems; a curve arm indistinguishable from the null at every m is the "no structure" reading.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): recompute (A), (B), (C) in Python; commit the
      corrected column and the line. STAGE 1 (cap-locus cells): for n in
      {17, 19, 23, 29, 31} and m in {2, 3, 4}, build V = {deg < d_cap(n, m)}
      on the CERTBIN ordinary curves (RC-1 at n = 17; the n = 19 cell; new
      random ordinary curves with #E = 2 * prime or 4 * prime at n in {23, 29,
      31}, orders recomputed at setup) and on the a = 0 Koblitz curves at the
      same n where #E/4 is prime (Koblitz arm); measure the sat fraction over
      200 subgroup targets by the (m-1)-fold loop (exact); tune d_cap by one
      if outside the band. STAGE 2 (the measurement): on each cell run (i) the
      (m-1)-fold loop with an operation counter (exact cost, exact certificate
      set), (ii) the degree-D closure oracle on the Weil-descended S_{m+1}
      (S_3 exists in macaulay.py; S_4 and S_5 builders are NEW), recording
      cost, the degree at which each instance is decided, and certificates;
      (iii) the same-support random-bilinear null; 40 targets per cell (20
      planted satisfiable, 20 random). STAGE 3 (fit): theta per solver per m
      across n, with intervals; degree profiles; write the outcome table. No
      attack, no linear algebra engine, no deployed parameter is run.
    cell:
      curve: >-
        RC-1 (n = 17, t^17 + t^3 + 1, A = 97044, B = 126251, #E = 4 * 32603);
        the n = 19 cell (t^19 + t^5 + t^2 + t + 1, A = 46693, B = 306147,
        h = 2); NEW ordinary curves at n in {23, 29, 31} with prime-cofactor
        orders found by random search at setup (orders recomputed and
        primality proved); KOBLITZ ARM: y^2 + xy = x^3 + 1 at n = 19 (#E = 4
        * 130873, my arithmetic, recompute) and at n in {23, 29, 31} where
        #E/4 is prime (verified at setup; cells failing are dropped and
        listed). GENERIC CONTROL: relabelled Z/lZ with a random subset base
        of size 2^{d_cap}, on which the loop's cost is the same and the
        algebraic oracle does not exist (the row reads "loop only").
      m: 2, 3, 4 (m = 2 is the reproduction of the existing CERTBIN cells).
      l: d_cap(n, m) = ceil((n + log2 m!)/m); at m = 3 that is 7, 8, 9, 11, 12 and at m = 4 it is 6, 6, 7, 9, 9 for n = 17, 19, 23, 29, 31.
      factor_base: V = {deg < d_cap} in polynomial basis; a size-matched random subspace as the null base on two cells.
      targets: 200 for the sat-fraction gate; 40 per cell for costs (20 planted with certificates, 20 random); seeds enumerated 0..39.
      seeds: enumerated, recorded; curve-search seeds recorded with the found curves.
    instrument:
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py (n = 17 only; general-n variant NEW, about 150 lines)
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py (group law, S_3 evaluation)
      - experiments/EXP-CERTBIN-e94b27/impl/macaulay.py, closure.py, elim.py (degree-D closure with certificates; S_3 descent builder exists)
      - 'NEW: S_4 and S_5 summation-polynomial builders and their Weil descent (about 200 lines); the (m-1)-fold loop with operation counter (about 60 lines); random ordinary-curve search with order computation at n <= 31 (about 150 lines, baby-step giant-step order counting)'
      - 'missing: a WDSat, CaDiCaL or msolve binary for a second solver arm; not installed, so Stage 2 (ii) is the pure-Python closure only and says so'
    procedure:
      - 1. Stage 0 recomputation; commit column and line.
      - 2. Build cells; recompute orders; prove primality; gate the sat fraction.
      - 3. Stage 2 (i)-(iii) per cell with certificates on every solve and refutation.
      - 4. Fit theta per solver per m; report degree profiles.
      - 5. Write the three-row outcome per (solver, m).
    metrics:
      - name: sat_fraction
        unit: fraction of 200 targets
        definition: targets with at least one decomposition found by the exact loop
      - name: cost_loop
        unit: group operations (instrumented)
        definition: additions plus membership tests per target
      - name: cost_closure
        unit: column-pass elimination operations and wall-clock seconds
        definition: cost to decide each instance (1 in W_D, or planted solution recovered) with the deciding degree
      - name: theta
        unit: dimensionless
        definition: least-squares slope of log2 cost against n at fixed m, per solver, with interval
      - name: degree_profile
        unit: integer per instance
        definition: least D at which the instance is decided
    controls:
      - EXACT LOOP as the baseline on every cell (blocking; its theta must read 1 - 1/m).
      - SAT-FRACTION GATE at the cap (blocking; a cell off the band is re-tuned, never read).
      - SAME-SUPPORT RANDOM-BILINEAR NULL (KN-FIND-5a8d3e's construction) on every cell.
      - SIZE-MATCHED RANDOM SUBSPACE base on two cells (the null object of the same shape).
      - ORDINARY versus KOBLITZ arms at matched n (the Koblitz control for any group-structure reading).
      - RELABELLED Z/lZ generic control (loop only; the algebraic oracle has no meaning there, which is the point).
      - CERTIFICATES on every solve and refutation; degree-disciplined witnesses for W_D per KN-FIND-5a8d3e.
    outcomes:
      positive: >-
        (LEAD) theta_closure below 1/2 - 1/m at some m in {3, 4} with a
        non-growing degree profile across the ladder and the null reading
        higher: the descended system at the cap locus has structure the
        line rewards; route to SEMBIN/SDEG review before any interpretation.
      negative: >-
        theta_closure at or above the line at every m, or a degree profile
        growing with n: the cap-locus algebraic oracle (pure-Python closure)
        does not reach the line at toy scale; the corrected column stands as
        the honest target and the lane's question is "which solver, at
        which m, reaches theta(m) < 1/2 - 1/m", stated with numbers.
      artifact: >-
        theta_loop off 1 - 1/m, or the sat fraction off the band, or the
        null reading below the curve arm: instrument or cell defect; nothing
        read.
    falsification_threshold: >-
      Stated before any run: the LEAD reading requires theta_closure's 95
      percent interval entirely below 1/2 - 1/m at m = 3 or m = 4 over at
      least four n, with the degree profile's maximum constant across the
      ladder and theta_null above the line. Anything else is negative or
      artifact.
    estimated_cost:
      implementation: medium
      compute: >-
        ESTIMATE, order of magnitude: the loop at (n, m, d) = (31, 4, 9) is
        2^27 / 6 additions per target, about 2^32 for 40 targets, hours in
        pure Python and the largest single item; closures at up to 36 Boolean
        unknowns and D = 4 (about 66000 columns) are minutes each; the m = 3
        cells are cheaper. Days of single-core time overall; the top loop
        cell may be sampled rather than exhausted, and any censoring is
        reported as a lower bound.
    required_metrics:
      - corrected column and line (Stage 0), with the Python recomputation attached
      - sat_fraction per cell; cost_loop and cost_closure per instance; degree_profile
      - theta per solver per m with intervals; theta_null
      - certificate pass rate; termination_reason per instance (completed | timeout | crash)

  falsification_conditions:
    - 'The Python recomputation of (A) fails to reproduce the finding''s four floors: the model is misidentified and (B) is void until re-derived.'
    - 'The corrected budgets differ from (B) by more than 0.5 bit on recomputation: arithmetic error, corrected before use.'
    - 'A cap-locus cell reads a sat fraction outside [0.5, 0.75] after one re-tune: the cap definition or the cell''s conventions are wrong for that cell; excluded and reported.'
    - 'theta_loop deviates from 1 - 1/m by more than 0.05: instrument defect.'
    - 'The LEAD reading fires: the corrected column is not merely a target but is approached at toy scale by the closure oracle; the record''s expectation is refuted in the interesting direction.'

  confounders:
    - >-
      CEILING OF d_cap. Rounding d_cap up moves mu by up to 2^m; the sat
      fraction gate exists to catch this and the actual mu per cell is
      reported.
    - >-
      SOLVER CHOICE. Only the pure-Python closure is available; a Groebner
      or SAT arm could have a different theta; the record names the missing
      engines and does not extrapolate across solvers.
    - >-
      PLANTED VERSUS RANDOM TARGETS. At the cap most random targets are
      satisfiable; planted targets have a known certificate; both arms are
      reported separately, never pooled (RQ-ICPERF-94c86e discipline).
    - >-
      LADDER LENGTH. Five n over 14 bits is a short lever for an exponent
      fit; intervals are reported and no transfer beyond the sign of
      theta - (1/2 - 1/m) is claimed.

  interpretation_limits:
    - >-
      NO ATTACK, NO EXPONENT CLAIMED. A cost-model correction (unconditional
      arithmetic given the model), a locus, a line, and a toy measurement of
      theta for named solvers.
    - >-
      KN-OPEN-020 CLASS: subspace base, scoped class, inherited.
    - >-
      The corrected budgets are model-relative: negation, the Z/4 class,
      dense versus sparse linear algebra and the unit of C move them by a few
      bits; the relative correction (about 17-20 bits at m >= 5) is robust to
      those choices and the absolute numbers are labelled model-dependent.
    - >-
      Nothing here says any solver reaches the line; Semaev 2015's argument
      is SEMBIN's to adjudicate and is only named as the kind of claim the
      line calls for.
    - >-
      FORWARD GUIDANCE: (i) the m = 5, 6 cells at the cap need n >= 37 to
      have d_cap >= 8 and are the natural next ladder once S_6, S_7 builders
      exist; (ii) an orbit-union base shifts the column by up to 2^7 in
      relations and 131^{m-1} in oracle calls (the FROB equivariance
      question) and is not applied here; (iii) the refutation-asymmetry lever
      (G2) should be priced AT the cap, where it is worth at most about 2.7.

  heuristic_assumptions:
    - id: H1
      statement: >-
        POISSON DECOMPOSITION COUNT. For a uniformly random target, the number
        of m-multisets from a subspace base of size B summing to it is
        Poisson with mean mu = B^m / (m! 2^131), so the satisfiable fraction
        is 1 - e^{-mu} and attempts per relation is 1/(1 - e^{-mu}).
      rigorous_support: >-
        The mean is exact (KN-FIND-007); the Poisson shape imitates the
        occupancy law and its failure mode is the additive concentration of a
        subspace base, which KN-FIND-007 measured for other bases.
      validation_plan: >-
        SAMPLE: the exact loop's decomposition counts over 200 targets per
        cap-locus cell (exhaustive at m <= 4, d <= 9). COMPARISON:
        chi-squared of the count histogram against Poisson(mu) with mu
        recomputed under the cell's sign convention; the sat fraction
        against 1 - e^{-mu}. TAIL: the maximum count against the Poisson
        tail. TRANSFER: the mean transfers exactly; the shape at n = 131 is
        not claimed.
    - id: H2
      statement: >-
        EXPONENT TRANSFER. A solver's fitted theta(m) over n in {17, ..., 31}
        at the cap locus, together with its degree profile, indicates the sign
        of theta(m) - (1/2 - 1/m) at larger n for that solver.
      rigorous_support: >-
        None; the loop's exponent is exact and serves as the calibration of
        the fit; the closure's exponent depends on the solving degree's
        growth in n, which is KN-OPEN-3c8f51 item (B) and is measured, not
        assumed.
      validation_plan: >-
        SAMPLE: the ladder itself. COMPARISON: theta_loop against 1 - 1/m as
        the known-answer calibration; theta_closure against theta_null.
        TAIL: the degree profile's maximum per cell. TRANSFER ASSUMPTION,
        stated: only the sign is transferred, and only as a heuristic.

  heuristic_note: >-
    (A)-(C) are arithmetic under the finding's model with H1's mean, which is
    exact. The measurement's expectation, stated in advance: theta_loop reads
    1 - 1/m exactly, theta_closure reads at or above the line with a degree
    profile that grows along the ladder, and the corrected column stands as
    an honest target rather than a reached one.

  target_complexity:
    time_exponent: >-
      NO EXPONENT MOVES. The record corrects the budget an oracle must meet:
      at the cap locus log2 C_budget = (1/2 - 1/m) n + const, i.e. 2^37.0 at
      m = 6 and 2^42.2 at m = 8 on ECC2K-130 against the finding's 2^18.0 and
      2^25.2. The exact loop sits at theta = 1 - 1/m, a full 2^{n/2} above
      the line at every m.
    memory_exponent: >-
      At the cap, the relation matrix is B_cap x B_cap sparse with m entries
      per row: about 2^34 bytes at m = 5 and 2^30 bytes at m = 6 on ECC2K-130,
      disclosed; the oracle's own memory is solver-dependent and unmeasured
      at n = 131.
    best_known: matched rho 2^60.81 (KN-FIND-aa2efc); within the family, the finding's table as corrected here.
    hidden_overhead: >-
      The unit of C (group-op equivalents versus solver operations) is the
      one conversion that could move the column by several bits and is
      measured on the toy cells (both units reported) rather than assumed.
    tradeoff_note: >-
      Moving B to the cap trades linear-algebra cost (still below rho at
      m >= 5) for one attempt per relation; relation collection remains
      embarrassingly parallel and the linear algebra at 2^27.6 unknowns
      (m = 5) is the binding sequential step, as IDEA-20260922-2e2a58 already
      prices for the lane.

  estimated_cost:
    implementation: medium
    compute: medium
    qualification: >-
      Stage 0 is seconds. Stage 1-2 need a general-n field module, S_4/S_5
      builders, the loop, and a curve search at n <= 31; the top loop cell is
      the cost driver (hours to a day in pure Python) and may be sampled.

  asymptotic_claim:
    problem: ECDLP on ECC2K-130 by subspace-base index calculus at arity m, cost model
    prior_best: KN-FIND-aa2efc's table (linear oracle-budget column); matched rho 2^60.81
    time_exponent: 'unchanged; the oracle budget at the cap is 2^{(1/2 - 1/m) n + const}, a target not a result'
    memory_exponent: B_cap-sized sparse matrix, 2^30 to 2^34 bytes at m in {6, 5}
    hidden_cofactor: the unit conversion of C, and the 1/(1 - e^{-mu}) attempt factor (at most 0.66 bit)
    claim_kind: cost_model_correction

  dominated_by: >-
    n/a (no result claimed on any cost axis): the record proposes no
    algorithm and occupies no point on the time-memory plane. Every row of
    the frontier was checked: matched rho 2^60.81 at O(1) per walk remains
    the best known on ECC2K-130; the finding's free-oracle floors are
    reproduced, not improved; the corrected budgets are conditions, not
    costs; the exact loop is dominated by rho by 2^{n/2} at every m. Not null
