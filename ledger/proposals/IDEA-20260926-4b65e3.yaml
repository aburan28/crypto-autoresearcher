  recommended_priority: high
  priority_rationale: >-
    Every proposal on this seam prices itself against the finding's
    oracle-budget column, and that column understates the budget at m >= 5 by
    about 20 bits; correcting it costs seconds and changes what "an oracle
    polynomial in m" has to achieve (2^37 at m = 6, not 2^18). The line
    (1/2 - 1/m) converts the lane's question into a single measurable
    exponent per m at a locus the CERTBIN instruments already occupy at
    m = 2. High because it is a building block every other record in this
    lane and in CERTBIN needs, not because it moves an exponent.

