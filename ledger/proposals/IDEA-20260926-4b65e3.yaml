idea:
  id: IDEA-20260926-4b65e3
  question_id: RQ-CERTBIN-836ce2
  added: '2026-09-26'
  status: proposed
  approved_by: null
  title: >-
    RE-DERIVING THE ECC2K-130 ARITY TABLE WITH THE PER-TARGET CAP: at
    B_cap = (m! 2^131)^{1/m} one attempt per relation and negligible linear
    algebra give oracle budgets of about 2^11, 2^33, 2^37, 2^42, 2^50 at
    m = 4, 5, 6, 8, 16 instead of 2^4.4 to 2^25, so the lever is the
    (1/2 - 1/m) exponent line, measurable on cap-locus toy cells

  class: mechanism

  claim: >-
    (A) THE FINDING'S MODEL, REPRODUCED EXACTLY. KN-FIND-aa2efc's free-oracle
    floors are the minima over B of T(B) = m! 2^131 / B^{m-1} + m B^2, i.e.
    relations = B, attempts per relation = m! 2^131 / B^m, linear algebra
    = m B^2, oracle = 1. MY ARITHMETIC, zero compute: m = 2 gives B = 2^43.33
    and T = 2^89.25; m = 3 gives B = 2^33.0 and T = 2^68.58; m = 4 gives
    B^5 = 9 * 2^131, B = 2^26.83, T = 2^55.09 + 2^55.66 = 2^56.40; m = 5 gives
    B^6 = 48 * 2^131, B = 2^22.76, T = 2^46.86 + 2^47.85 = 2^48.44. All four
    reproduce the finding's table to two decimals, so the model is
    identified. The finding's "oracle budget per attempt to tie rho" column
    (2^4.4, 2^12.4, 2^18.0, 2^25.2 at m = 4, 5, 6, 8) is then rho / T at
    that same B: the LINEAR reading, which holds B at the free-oracle
    optimum while charging the oracle.

    (B) THE CORRECTION, WITH THE PER-TARGET CAP. A target has on average
    mu = B^m / (m! 2^131) decompositions; for mu >= 1 the oracle need only find
    one, so attempts per relation is max(1, 1/mu) (about 1/(1 - e^{-mu}) at
    the kink, i.e. 1.58 at mu = 1 and 1.02 at mu = 4). With an oracle of cost
    C the honest question is: does there exist B with B * max(1, 1/mu) * C +
    m B^2 <= 2^60.81? Re-optimising B moves it TOWARD the cap B_cap = (m!
    2^131)^{1/m} where attempts are 1 and the linear algebra m B_cap^2 is
    small for m >= 5. MY ARITHMETIC (rho = 2^60.81): m = 3: no C >= 1 (the
    sub-cap optimum needs log2 C = -15.6; closed, as the finding says). m = 4:
    B_cap = 2^33.9 has LA 2^69.8 above rho, so the sub-cap regime binds;
    minimising 2^{135.585 - 3x} C + 2^{2 + 2x} gives 5x = 134.17 + log2 C and
    (5/3) 2^{2 + 2x} = 2^60.81, hence x = 29.04 and C_max = 2^11.0. m = 5:
    B_cap = 2^27.58, LA = 2^57.48, remaining 2^60.66, C_max = 2^32.4 at mu = 1
    (2^32.6 at mu = 4, B = 2^27.98). m = 6: B_cap = 2^23.42, LA = 2^49.42,
    C_max = 2^36.7 at mu = 1 and 2^37.0 at mu = 4. m = 8: B_cap = 2^18.29,
    C_max = 2^42.2. m = 10: 2^45.5. m = 12: 2^47.5. m = 16: B_cap = 2^10.95,
    C_max = 2^49.7. Against the finding's column the budgets at m = 5, 6, 8
    rise by about 20, 19 and 17 bits. The m <= 3 closure and the m = 4
    near-closure are unchanged; what changes is that "an oracle whose
    per-attempt cost grows slowly in m" was being asked to fit 2^12 at m = 5
    when the honest budget is 2^32.

    (C) THE EXPONENT LINE. At the cap, log2 B_cap = (n + log2 m!) / m and the
    budget is rho / B_cap, so for a Koblitz curve with cofactor 4 (l about
    2^{n-2}) and matched rho sqrt(pi l / (4n)),
    log2 C_budget(n, m) = (n - 2)/2 - 0.176 - (log2 n)/2 - (n + log2 m!)/m,
    with slope (1/2 - 1/m) in n. At n = 131, m = 6 this reads 64.5 - 0.18 -
    3.52 - 23.4 = 37.4, agreeing with (B). The whole arity lever is therefore
    ONE statement: index calculus at the cap locus beats matched rho iff the
    decomposition oracle at (m, d_cap = (n + log2 m!)/m), a Boolean system in
    about n unknowns after Weil descent, costs less than 2^{(1/2 - 1/m) n}
    up to the stated constants. Exhaustive evaluation of a Boolean system in
    n unknowns costs 2^n; the best generic MQ solvers are reported near
    2^{0.8 n} for square systems (recalled, not load-bearing); so the lever
    asks for a STRUCTURAL speed-up of the descended system by at least
    2^{0.3 n} at m = 6 and 2^{0.35 n} at m = 8, which is exactly the kind of
    claim SEMBIN adjudicates (Semaev 2015's disputed chained-S_3 first-fall-
    degree argument). This record does not adjudicate it; it fixes WHERE it
    must be measured and against WHICH line.

    (D) THE LOCUS IS ALREADY WHERE CERTBIN MEASURES AT m = 2. d_cap(17, 2) =
    (17 + 1)/2 = 9 and d_cap(19, 2) = 10: the RC-1 cell (n = 17, m = 2, l = 9)
    and the n = 19 cell (m = 2, l = 10) are cap-locus cells, so their sat
    fraction should be about 1 - 1/e (mu = 1), which is why 386 of 468
    subgroup-target descents in RC-1 were unsatisfiable rather than nearly
    all (KN-FIND-5a8d3e; the x(2E) target class and the negation convention
    shift mu by constants). The extension of that policy to m in {3, 4} at
    n in {17, 19, 23, 29, 31} gives d_cap = (7, 8, 9, 11, 12) at m = 3 and
    (6, 6, 7, 9, 9) at m = 4 (ceilings), which are the cells RQ-CERTBIN-
    836ce2's decision target (1) asks for "at a fixed (n', l) policy".

    (E) A CONSEQUENCE FOR THE SOLVER-SIDE LEVER. At the cap about 63 percent
    of targets are satisfiable, so the refutation asymmetry that
    TASK-20260926-aa3c9f's seam exploits (cheap UNSAT) is worth at most a
    factor about 2.7 at the locus where the arity lever lives; below the cap
    it is worth 1/mu. The two levers trade against each other, and the
    cap-locus ladder measures both arms.

    REPRESENTATION CLASS (RQ-ECDLP-623a32): R1, the x-coordinate subspace of
    dimension d_cap; the attack stage whose charged cost changes is the
    balance between RELATION COLLECTION and LINEAR ALGEBRA, and the
    per-attempt decomposition cost at the resulting locus.

  mechanism: >-
    OBJECT FRAME. Representation: R1, x in an F_2-subspace V of dimension
    d_cap in polynomial basis, exactly RQ-CERTBIN-836ce2's object. Operation
    set Sigma: translation by factor-base elements (Class I, index calculus's
    own), unchanged. This record introduces no new tracked object; it
    corrects the COST MODEL every object in the lane is priced with and
    fixes the locus on which the family's one open number (the oracle's cost
    exponent in n at fixed m) must be measured.

    TRICHOTOMY. Class I, partial-action, as for every F2 line; the record's
    content is the cost obligation of that class, which IDEA-20260806-c5d183
    names as coverage: at the cap, coverage is 1 - 1/e by construction and
    the obligation transfers entirely to the oracle.

    LOSSY-PROJECTION TEST. Not applicable to a cost-model correction, stated
    rather than omitted: no projection is proposed; the factor base is
    inherited (KN-OPEN-020 scoped class, subspace, membership linear).

    WHY THE LINEAR READING UNDERSTATES. Charging an oracle at the free-oracle
    optimum B keeps attempts per relation at m! 2^131 / B^m, which at m = 5
    and B = 2^22.76 is 2^{6.9 + 131 - 113.8} = 2^24.1 attempts per relation;
    moving B up to 2^27.6 makes attempts 1 at the price of 2^4.8 more
    relations and a linear algebra that is still 3 bits below rho. The
    finding's own text anticipates the correction ("the product law is a
    specification") without carrying it out; IDEA-20260808-2ef5c8 carries
    the cap as "trials >= 1" but with the total-trials bound B <= (m! N)^{1/
    (m-1)}, weaker than the per-target bound B <= (m! N)^{1/m}, and drops the
    linear algebra in its regime (ii), which at m = 5 with B = N^{1/4} is
    above rho; IDEA-20260803-fa9839's asymptotic threshold d < (m - 3)/4 is
    the uncapped balance and gives N^{1/2} at m = 5, above the cap. EV-ICEX-
    2be32e F-2 already names the kink B_k = (m! N)^{1/m} where mu = 1 on the
    prime-field ICEX contract; this record is that kink applied to the
    binary Koblitz table, which post-dates it and does not use it.

    OFF-LIMITS COMPONENTS USED, NAMED. F2 is the family and the only
    component; no new factor base, no new join.

