  citation_note: >-
    Every number in (A)-(C) is this session's hand arithmetic and must be
    recomputed in Python (seconds) before any record relies on it; the
    reproduction of the finding's four floors is the evidence that the model
    is identified. Semaev 2015 is a recalled pointer. The "2^{0.8 n} for
    generic MQ" remark is recalled and not load-bearing.

  assumptions:
    - >-
      The finding's model is the one to correct: relations = B, LA = m B^2
      (sparse), group order 2^131 for the decomposition count; negation
      (relations B/2) and the Z/4 class (targets in G) move constants by at
      most 2 bits and are disclosed, not applied.
    - >-
      The oracle's cost C is charged per attempt, and at mu >= 1 one attempt
      finds a decomposition when one exists; a solver that must find ALL
      decompositions to find one is charged at its full cost (this is what
      the (m-1)-fold loop does and is why it sits at theta = 1 - 1/m).
    - >-
      OFF-LIMITS COMPONENT DECLARED: F2 only.
    - Arithmetic only at deployed parameters; executable cells at n <= 31.

  proof_search_map:
    bottleneck: >-
      The cost exponent theta(m) of the decomposition oracle at the cap locus,
      defined by C(n, m) = 2^{theta(m) n + o(n)} at d = d_cap(n, m), against
      the line 1/2 - 1/m; the (m-1)-fold loop sits at theta = 1 - 1/m exactly
      and is the baseline every measured oracle must beat by 2^{n/2} to matter.
    baseline_embedding:
      parameter_slice: >-
        C = 1 reproduces the finding's floors exactly (A); m = 2 at n = 17
        and 19 reproduces the RC-1 and n = 19 cells as cap-locus cells with
        sat fraction near 1 - 1/e (D); the (m-1)-fold loop reproduces
        IDEA-20260904-96c4f3's closed form on every cell.
      reproduction_check: >-
        Symbolic and by frozen fixture: the four floors at m = 2..5 to two
        decimals; the loop's operation counter within [0.95, 1.1] of
        2^{(m-1)d}/(m-1)!; the measured sat fraction on the archived RC-1
        instances against 1 - exp(-mu) with mu recomputed under the cell's own
        conventions.
    observation_collision:
      observable: >-
        The pair (measured oracle cost at d_cap(n, m), fitted theta(m)) per
        solver.
      distinct_preimage_search: >-
        A low fitted theta could come from (i) a genuine structural speed-up
        of the descended system, or (ii) a solver whose cost is polynomial at
        the toy degrees only because the solving degree has not yet started to
        grow (KN-OPEN-3c8f51 item (B), persistence along n). Separated by the
        degree profile per cell (D at which 1 is reached, or the planted
        solution found) reported alongside the cost, and by the ladder's top
        cells: a theta that falls as n grows is the signature of (ii).
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The resource measure "total group-op equivalents at the cap locus"
          = B_cap * attempts * C + m B_cap^2, with attempts = 1/(1 - e^{-mu}),
          added over the proved-disjoint blocks (relation collection, linear
          algebra), specialised to each m.
        predicted_gain: >-
          The corrected column of (B) and the line of (C); zero compute.
      - transform: boundary_lift
        proposed_object: >-
          Extend the measured (m, d) cells of RQ-CERTBIN-836ce2 from m = 2 to
          m in {3, 4} along the cap locus rather than at fixed l, so that the
          quantity measured is theta(m) directly.
        predicted_gain: >-
          A measured exponent per m against the line, which is the form the
          lane's decision target asks for.
    quantifier_order: >-
      (B) FOR ALL m >= 4 THERE EXISTS B (near B_cap for m >= 5) such that an
      oracle with per-attempt cost at most C_max(m) ties matched rho under the
      finding's model; FOR ALL B, no oracle with cost above C_max(m) does.
      (C) FOR FIXED m, the tie condition in n is log2 C <= (1/2 - 1/m) n +
      const. NOT CLAIMED: that any oracle attains these budgets; the record
      measures theta at toy n for named solvers only.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Under the finding's model the oracle budgets are [column]; at the
        cap locus on n in {17, 19, 23, 29, 31}, m in {2, 3, 4}, the named
        solvers have fitted theta(m) = [values] with intervals against the
        line 1/2 - 1/m, with degree profiles [values]." It can NEVER certify
        theta at n = 131, nor anything about unnamed solvers.
      nearby_object_control: >-
        The (m-1)-fold loop (theta = 1 - 1/m exactly, the object where the
        lever fails by construction); and the same-support random-bilinear
        null of KN-FIND-5a8d3e, where the semi-regular degree of regularity
        governs and theta must read the generic MQ value.
    proof_obligations:
      - claim: The four floors of the finding are reproduced by the stated model.
        responsibility: baseline
      - claim: The corrected budgets at m in {4, 5, 6, 8, 10, 12, 16} with the cap, recomputed in Python.
        responsibility: correctness
      - claim: The line (C) with its constants for cofactor-4 Koblitz curves.
        responsibility: correctness
      - claim: d_cap(n, m) cells are built and their measured sat fraction matches 1 - exp(-mu) under the cell's conventions.
        responsibility: feasibility
      - claim: theta(m) is fitted from at least four n per m with intervals and a degree profile.
        responsibility: runtime
      - claim: Nothing here asserts theta at n = 131 or adjudicates Semaev 2015.
        responsibility: scope

  predictions:
    - metric: corrected_oracle_budget_column (log2 group-op equivalents at m = 4, 5, 6, 8, 16)
      direction: higher
      minimum_effect: >-
        11.0, 32.4-32.6, 36.7-37.0, 42.2, 49.7, recomputed within 0.5 bit;
