idea:
  id: IDEA-20260825-7efa27
  title: Transcript-filtration non-backtracking walk with certified entropy charge
  class: mechanism
  question_ids:
    - RQ-ECDLP-002
  goal_ids:
    - GOAL-ECDLP-001
  source_handoff: TASK-20260825-10a615
  status: proposed
  object: >-
    A lossy, operation-compatible transcript filtration and bounded potential
    carried through a public non-backtracking Pollard-style walk.
  depth_of_verified_structure: >-
    Conceptual mechanism only; no walk, mixing proof, implementation, or
    experiment was executed in this task.
  claim: >-
    A public non-backtracking ECDLP walk may be biased by a transcript-level
    filtration that tracks a lossy, operation-compatible scalar-coefficient
    object and stops on a certified entropy drop. If an exact optional-stopping
    argument shows that the walk reaches a collision or relation in fewer than
    p^(1/2) steps while the same filtration has no signal on matched random and
    ordinary-curve nulls, the method would provide a generic-path candidate. The
    current proposal predicts that the generic-group controls will likely erase
    the signal; that prediction is a falsifiable frontier result, not a closure.
  mechanism: >-
    Replace a static distinguished-point predicate with a public state filtration
    F_j of the walk transcript: affine coefficient pair, a bounded residue window,
    and a support-compatible potential that is updated from each public group
    operation. Choose non-backtracking steps by a pre-registered transition rule
    that maximizes the expected decrease in the potential while retaining an
    invertible scalar transcript. A collision certificate includes both endpoint
    equality and the complete coefficient transcript. The proof attempt charges
    the stopping time through a martingale or entropy potential; it may only claim
    a gain if the potential survives the same-shape random-walk null and the
    optional-stopping bound is uniform.
  nearest_record_delta:
    screened_against:
      - KN-TECH-006
      - KN-FIND-b7e091
      - 'KNOWLEDGE-FRONTIER: generic-rho and distinguished-point variants'
      - GOAL-ECDLP-001.next_action
    overlap_axes:
      - Pollard-style random walks
      - non-backtracking transitions
      - scalar transcript collisions
      - time-memory tradeoffs
    exact_delta: >-
      KN-TECH-006 uses a fixed easy distinguished predicate and standard random
      walks; this proposal uses an adaptive but public filtration and an explicit
      potential/optional-stopping proof obligation. It does not introduce an
      augmented oracle, endomorphism image, Semaev resultant, Frobenius projector,
      or target-local polynomial transducer. The delta is therefore a different
      stopping mechanism, not a claim that adaptive walk scheduling evades the
      generic lower bound.
  novelty_status: unverified
  duplicate_screen:
    corpus_scope: >-
      The handoff's 106 RQ-ECDLP-002 proposals and adjacent generic, endomorphism,
      representation, relation, multi-target, and cost-model records were the
      declared comparison corpus.
    method: >-
      Compared the tracked transcript object, transition rule, stopping
      certificate, and all-axis charge against standard rho, distinguished-point,
      automorphism, and generic-oracle families.
    outcome: >-
      No exact adaptive-filtration duplicate was identified in the available
      frontier summaries. The proposal is deliberately low-confidence because
      generic-group lower bounds may subsume the full construction.
    unresolved_gaps:
      - The 106 proposal bodies require a Coordinator ID-by-ID confirmation.
      - Any state that is not operation-compatible is merely a renamed coordinate system and fails the lossy-projection test.
  citations:
    - ref: RQ-ECDLP-002
      provenance: internal
      claim: >-
        Generic-group and augmented-oracle simulability, multi-target methods,
        and complete cost auditing are in scope for the research question.
      verified_by: ledger/questions/RQ-ECDLP-002.yaml:16-38
    - ref: KN-TECH-006
      provenance: internal
      claim: >-
        The mandatory generic baseline is a transcript-tracked Pollard walk with
        distinguished points and collision recovery.
      verified_by: knowledge/techniques/KN-TECH-006.md:14-20
    - ref: KN-FIND-b7e091
      provenance: internal
      claim: >-
        Incidence and ordinary endomorphism-image oracles are generic-group
        simulable on prime-order prime-field curves.
      verified_by: knowledge/findings/KN-FIND-b7e091.md:16-28
    - ref: KN-OPEN-019
      provenance: internal
      claim: >-
        An object-indexed taxonomy for ECDLP attack families remains open, so
        the proposed filtration is a scoped object sketch rather than a closure.
      verified_by: knowledge/open-problems/KN-OPEN-019.md:13-24
    - ref: KN-TECH-080
      provenance: internal
      claim: >-
        A proof-oriented stopping argument must state quantifiers, collisions,
        method ceiling, and nearby-object controls before compute.
      verified_by: knowledge/techniques/KN-TECH-080.md:26-124
  assumptions:
    - The filtration is a genuinely lossy projection of the transcript and propagates deterministically under the selected public step set.
    - The potential has a uniform bounded increment and an optional-stopping theorem applies at the declared stopping rule.
    - A lower potential corresponds to a certifiable collision opportunity rather than merely a biased encoding.
    - The walk's non-backtracking transition distribution remains sufficiently mixed for the collision analysis.
    - Any speedup is not caused by an accidental small-group or malformed distinguished predicate.
  proof_search_map:
    bottleneck: >-
      The bottleneck is converting a public adaptive stopping signal into a
      uniform collision-time improvement without violating generic-group
      transcript indistinguishability.
    baseline_embedding:
      parameter_slice: >-
        Freeze the step distribution to standard Pollard rho with a fixed
        distinguished-point predicate and reproduce its p^(1/2) collision law,
        memory, and data before enabling the filtration.
      reproduction_check: >-
        Use a frozen toy-group fixture with known scalar and replay the exact
        transcript, including inverse and non-backtracking bookkeeping, against
        the fixed-predicate baseline.
    observation_collision:
      observable: >-
        Filtration state consisting of coefficient residue window, potential,
        step-history tag, and distinguished endpoint encoding.
      distinct_preimage_search: >-
        Construct distinct transcripts with equal filtration state but different
        affine coefficients and endpoints; if the stopping rule treats them as
        equivalent without an endpoint certificate, identifiability fails.
    constructive_transforms:
      - transform: telescoping_potential
        proposed_object: >-
          A bounded martingale/entropy potential on the affine transcript and
          operation-compatible residue window.
        predicted_gain: >-
          A provable reduction in expected collision search or a lower memory
          frontier at fixed time; generic controls are expected to reject an
          exponent gain if the potential carries no non-generic information.
    quantifier_order: >-
      For every prime-order curve and every public P,Q in scope, there exists a
      public step rule and bounded potential such that for every valid transcript
      the martingale bound holds; only then may one assert that there exists a
      stopping schedule with expected cost below p^(1/2+o(1)).
    method_ceiling:
      strongest_certifiable_claim: >-
        The method can certify a scoped change in collision-time or memory for a
        declared walk family; it cannot certify generic ECDLP improvement if the
        filtration is simulable from the ordinary transcript.
      nearby_object_control: >-
        Apply the identical walk and filtration to a random cyclic group of the
        same order and to a curve with structure-destroying step labels. A real
        elliptic signal must disappear on both controls.
    proof_obligations:
      - claim: Lossy projection is deterministic under the step set
        responsibility: correctness
      - claim: Baseline collision law and transcript recovery
        responsibility: baseline
      - claim: Bounded increments and optional-stopping hypotheses
        responsibility: feasibility
      - claim: Uniform mixing/non-backtracking bound
        responsibility: success_probability
      - claim: Collision certificate and scalar orientation
        responsibility: interface
      - claim: Complete time-memory-data and parallel traffic charge
        responsibility: runtime
    not_applicable_reason: null
  predictions:
    - metric: expected collision steps at fixed memory and processors
      direction: lower
      minimum_effect: a pre-registered strict reduction versus fixed-predicate rho or the mechanism is rejected
    - metric: potential decay under increasing mixing/non-backtracking depth
      direction: lower
      minimum_effect: genuine signal must decay or stabilize as predicted; constant unchanging excess is an artifact tell
    - metric: null-control separation
      direction: different
      minimum_effect: elliptic signal must differ from random cyclic-group and destroyed-structure controls
    - metric: transcript collision false-positive rate
      direction: lower
      minimum_effect: zero after independent endpoint and coefficient verification
  minimal_test:
    design: >-
      Specify a toy-group replay with known scalars, a fixed baseline walk, and a
      filtration-enabled walk sharing the same step budget and memory. Increase
      the parameter intended to destroy structure, compare the full collision
      distribution and potential trajectory to nulls, and record all certificates.
    controls:
      - Standard Pollard rho with distinguished points on the same curve/group.
      - BSGS at the same toy sizes as a memory/time reference.
      - Random cyclic groups with identical order and step-count distribution.
      - Structure-destroying permutation of step labels and random residue windows.
      - Non-backtracking versus backtracking transition controls.
      - Q and -Q orientation and replayed transcript certificates.
    required_metrics:
      - collision steps, success probability, and false-positive rate
      - potential increments, decay, variance, and stopping-time tails
      - memory, processors, group operations, coefficient operations, and traffic
      - baseline versus filtration time-memory-data Pareto points
      - independent certificate verification and transcript reproducibility
  falsification_conditions:
    - The filtration is invertible or operation-incompatible, so it is only a coordinate rename or cannot be replayed.
    - The potential signal matches the random cyclic-group or destroyed-structure null.
    - Increasing the structure-destroying parameter leaves an unexplained constant excess.
    - Optional-stopping or mixing assumptions fail on the declared walk family.
    - Collision or scalar certificates produce any false positive or require hidden state.
    - The full path is not strictly below fixed-predicate rho after charging adaptive selection, memory, and traffic.
  confounders:
    - Adaptive step selection can bias the walk or invalidate the mixing argument.
    - A residue window may be correlated with the encoding or group partition rather than the curve structure.
    - Early stopping can reduce measured time while increasing restart and verification cost.
    - Toy groups can make entropy estimates and collision tails non-asymptotic.
  interpretation_limits:
    - A measured collision-time change is not an exponent claim without scaling data and a proof boundary.
    - A generic-group null match is evidence against this filtration only within the tested transcript model.
    - No deployed target, live key, or secret scalar is used or inferred.
    - Negative evidence narrows only the declared walk, filtration, group, and parameter range.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The non-backtracking walk reaches a distribution close enough to its
        declared stationary law before the stopping rule that the martingale
        collision calculation applies uniformly over the tested parameter range.
      rigorous_support: >-
        A finite-state walk can be analysed exactly on toy groups, but no uniform
        spectral or mixing theorem is asserted here for the proposed filtration.
      validation_plan: >-
        Estimate total-variation or collision statistics on enumerated toy groups,
        compare to random cyclic-group controls, vary walk depth, and report tail
        confidence intervals and transfer assumptions.
    - id: H2
      statement: >-
        The filtration potential has a structure-dependent excess that is absent
        from the random cyclic-group and label-permuted nulls and decreases under
        the proposed adaptive rule.
      rigorous_support: >-
        No theorem currently supports this; it is the central falsifiable
        empirical assumption and may be rejected by the mandatory controls.
      validation_plan: >-
        Measure matched potential trajectories at equal group order, step count,
        memory, and encoding shape; compare CDFs, means, variances, and extreme
        tails as the structure-destroying parameter increases.
  target_complexity:
    time_exponent: >-
      Unverified target below p^(1/2+o(1)); no honest exponent is assigned until
      scaling and optional-stopping bounds establish one. Generic baseline is
      p^(1/2+o(1)).
    memory_exponent: >-
      Potentially p^(o(1)) with distinguished storage or a declared time-memory
      tradeoff; adaptive metadata and verification may increase it.
    best_known: p^(1/2+o(1)) generic rho with standard memory-time tradeoffs
    hidden_overhead: >-
      Include restarts, adaptive selection, mixing burn-in, potential evaluation,
      transcript storage, false-positive verification, parallel synchronization,
      and all inverse-success-probability factors.
    tradeoff_note: >-
      The proposal may move along the rho time-memory frontier rather than change
      its exponent; every processor and distinguished-state replica is charged.
  cost_boundary:
    public_inputs: E, P, Q, p, n, public step partition, filtration state definition, and stopping threshold
    per_attempt: >-
      Generate non-backtracking steps, update scalar transcript and filtration,
      evaluate potential, test stopping predicate, verify endpoint collision, and
      recover scalar coefficients.
    preprocessing: >-
      Step tables, public partitions, potential constants, and any walk-mixing
      calibration, charged with build time and memory.
    online: >-
      Every group operation, coefficient update, potential evaluation, metadata
      write, distinguished-state insertion, restart, and certificate check.
    success_probability: >-
      Must be measured or proved for the stopping rule; total expected cost equals
      per-attempt cost times inverse success probability including restarts.
    time: >-
      Charge group and field operations, potential computation, collision lookup,
      endpoint verification, scalar recovery, and parallel coordination.
    memory: >-
      Charge distinguished states, transcript metadata, potential windows,
      collision tables, certificates, and replicas.
    data_queries: >-
      Charge public group operations, endpoint/partition observations, coefficient
      updates, verification requests, and worker communication.
    exclusions: >-
      No augmented oracle, hidden scalar, deployed endpoint, free preprocessing,
      secret key, or unverified walk-mixing assumption may be omitted.
  dominated_by:
    result: Fixed-predicate Pollard rho (KN-TECH-006) until a strict verified Pareto improvement exists
    frontier_checked: [Pollard rho, distinguished-point rho, BSGS, van Oorschot-Wiener time-memory tradeoff, random cyclic-group control]
    reason: >-
      Adaptive filtration currently has no verified non-generic information and
      is likely dominated by the baseline after potential, restart, and
      certificate costs are included.
  sota_delta:
    time_exponent: "0 verified; target strictly below 1/2 remains unverified"
    memory_exponent: "0 verified; metadata may increase memory"
    data_queries: "0 verified; adaptive and verification traffic unresolved"
    status: unverified
  estimated_cost:
    implementation: medium
    compute: medium
    rationale: >-
      A toy replay and null suite is manageable, but a proof-quality mixing,
      entropy, and full Pareto audit is substantial.
  priority: medium
  recommended_priority: medium
