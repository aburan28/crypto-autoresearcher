idea:
  id: IDEA-20260807-0a3272
  question_id: RQ-ICINV-475b5e
  added: '2026-08-07'
  title: >-
    A CANDIDATE FUNCTIONAL WITH A CLASS-VARYING CAUSE THE DECOMPOSITION'S T4
    LIST OMITS: the GROUP STRUCTURE of E(F_p) varies inside an isogeny class
    even though its ORDER does not, so the number of roots of x^3 + ax + b in
    F_p is 1 on some class members and 3 on others; that integer is
    gauge-invariant, it changes the ramification of the x-map and the
    non-transversality of the Semaev ideal, and it is the one candidate cause of
    within-class variance whose minimiser is LOCALLY DETECTABLE and therefore
    passes the T5 reachability gate
  class: mechanism

  claim: >-
    (A) THE OMISSION BEING REPAIRED. DECOMPOSITION.md T4 lists what a fixed
    F_p-isogeny class fixes (t, p, N, #E(F_p), embedding degree, K, D, whether
    j = 0 or 1728 occurs) and what varies inside it (j, the isomorphism class of
    (a, b), volcano level, h(End(E))). The list of what varies is INCOMPLETE in
    a way that matters for this lane: the GROUP STRUCTURE of E(F_p) also varies.
    For ordinary E with End_{F_p}(E) = O, Lenstra's theorem gives
    E(F_p) ~= O/(pi - 1) as O-modules [citation to be re-verified: H. W.
    Lenstra Jr., "Complex multiplication structure of elliptic curves",
    J. Number Theory 56 (1996)]. The ORDER #E(F_p) = p + 1 - t is a class
    invariant by Tate; the DECOMPOSITION Z/n_1 x Z/n_2 with n_1 | n_2 is not,
    because it is computed from O, and O varies with the volcano level. So
    within one class there are, in general, members with cyclic 2-part and
    members with full rational 2-torsion.

    (B) WHY THAT IS A CURVE-EQUATION FUNCTIONAL AND NOT A FUNCTION OF (p, N, t).
    Write r = #{x in F_p : x^3 + a x + b = 0}, so that
    #E[2](F_p) = 1 + r. For a non-singular curve a repeated root is impossible,
    so r is 0, 1 or 3 -- NEVER 2 -- and r = 0 holds exactly when #E(F_p) is odd.
    Since #E(F_p) is a class invariant, WHETHER r = 0 is fixed by the class; what
    is NOT fixed is the split between r = 1 and r = 3, because
        r = 3  <=>  E[2] subset E(F_p)  <=>  4 | #E(F_p) and the 2-part of
        E(F_p) is non-cyclic  <=>  (pi - 1)/2 lies in End(E),
    and the last condition is a condition on the ORDER End(E), i.e. on the
    2-volcano level. So r varies across the 2-isogeny volcano of a single class
    exactly when 2 divides the conductor of Z[pi] in O_K, and the classes this
    record studies are precisely those where both r = 1 and r = 3 occur.
    THE INTEGER r IS THEREFORE A FUNCTION OF THE CURVE AND NOT OF (p, N, t): two
    curves with identical p, identical N, identical t and identical #E(F_p) can
    have r = 1 and r = 3 respectively. Crucially r is ALSO GAUGE-INVARIANT:
    under (a, b) -> (u^4 a, u^6 b) the roots go to u^2 times the roots, so r is
    unchanged. This is the rare combination the lane needs -- a quantity that the
    class does not fix and that equation choice cannot move.

    (C) THE MECHANISM CONNECTING r TO ALGEBRAIC ATTACK COST. Two independent
    routes, both concrete:
      (C1) RAMIFICATION OF THE x-MAP. The degree-2 map x : E -> P^1 ramifies
        exactly over the roots of f and over infinity. A factor base V of
        x-coordinates contains r points with a SINGLE preimage (y = 0) and
        |V| - r points with two. Relation counting, sign handling and the
        negation symmetry that Semaev systems exploit (KN-TECH-002, KN-LIT-004)
        all treat those points differently.
      (C2) NON-TRANSVERSALITY OF THE SEMAEV IDEAL. The relation locus
        C_R : S_3(x1, x2, x(R)) = 0 meets the vertical line x1 = v
        non-transversally exactly when the quadratic S_3(v, ., x(R)) in x2 has a
        double root, i.e. when its discriminant vanishes; by the classical
        identity disc_{x3} S_3 = 16 f(x1) f(x2) together with the symmetry of
        S_3 [to be re-derived symbolically, not quoted], that happens exactly
        when f(v) = 0. SO THE IDEAL <S_3, f_V(x1), f_V(x2)> FAILS TO BE RADICAL
        PRECISELY AT FACTOR-BASE ELEMENTS THAT ARE 2-TORSION x-COORDINATES, and
        the number of such elements is a draw from a population of size r.
        Non-radicality inflates the Groebner staircase, which is what a
        solving-degree proxy measures.
      Both routes predict the SAME stratification and predict it to be
      TWO-LEVEL (r = 1 versus r = 3), not a continuum -- which is a strong,
      falsifiable shape prediction that noise does not produce.

    (D) WHAT THE TWO OUTCOMES MEAN, DECLARED BEFORE THE RUN.
      OUTCOME S (stratified): the solving-degree proxy differs between the
        r = 1 and r = 3 strata of the SAME class by more than the gauge
        interval. Then a genuine within-class cost difference exists, its cause
        is named and mechanistic rather than statistical, and -- this is the
        payoff -- IT IS LOCALLY DETECTABLE: an attacker at any vertex computes
        r in O(log^2 p) by factoring a cubic, so hill-climbing to the preferred
        stratum along the 2-volcano costs O(log p) steps. T5 IS PASSED. The
        campaign would then have to ask only whether the difference is a
        constant or an exponent, and the honest prior is a constant.
      OUTCOME F (flat): the proxy is indistinguishable across strata. Then the
        one class-varying, gauge-invariant, mechanistically motivated cause the
        lane can name does not move the cost, which is a much stronger negative
        than "we measured variance and found none" -- it is a negative against a
        NAMED mechanism, which is the closure standard.
      There is no outcome in which the measurement means nothing.

    (E) SCOPE, STATED UP FRONT. r is about 2-torsion, hence about the cofactor,
    hence NOT about G: N is a large prime and the ECDLP in G is untouched by the
    2-part. This record therefore claims nothing about the difficulty of the
    ECDLP; it claims that a RELATION-COLLECTION cost proxy may be stratified by
    a class-varying invariant. Confusing the two would be exactly the error
    H-ENDO-001 exists to prevent.

  resource_label: >-
    R5 (ell-torsion for ell != N as a Galois module: the rational 2-torsion is
    outside G entirely) + R2 (the curve equation, whose cubic's factorisation
    type is the observable) + R1 (x-coordinates as field elements, which is what
    the Semaev system reads).
  admissibility: admissible
  admissibility_argument: >-
    The observable r is the number of F_p-roots of the defining cubic. It is
    invisible to any algorithm restricted to group operations on G: G has prime
    order N and contains no 2-torsion at all, so no sequence of additions,
    negations and equality tests inside G can produce r. The resource is R5, a
    torsion module at a prime different from N, which DECOMPOSITION.md section 2
    lists as outside G by construction, and KN-FIND-b7e091's closed oracle
    classes (incidence, endomorphism-image) do not include it. H-ENDO-001 is not
    contradicted and not tested: every endomorphism still acts as a scalar on G,
    and nothing here applies one to a point of G.

  discriminated_from:
    - >-
      RQ-VOLC-f6253b / L2 (volcano level and endomorphism-ring depth). L2 asks
      whether DEPTH changes anything and stratifies by level, which is computed
      by counting rational ell-isogenies. This record stratifies by an
      EQUATION-LEVEL observable, r = #roots of f, which an attacker reads by
      factoring a cubic without building any isogeny graph, and it names a
      specific mechanism (ramification and ideal non-radicality) rather than
      asking whether depth matters in general. The two are correlated -- r is a
      2-volcano level indicator -- and that correlation is the point: this
      record supplies L2 with a mechanism and L2 supplies this record with the
      graph-theoretic context. Cross-citation is mandatory in both directions
      and neither may report the other's result as its own.
    - >-
      RQ-JINV-8fc13a / L3 (j-invariant special values). L3 is about j = 0,
      j = 1728 and small |D_0|. Nothing here depends on special j: the r = 1 and
      r = 3 strata both contain generic curves and coexist inside a single
      class.
    - >-
      IDEA-20260807-427cf3, which owns the algebraic-geometry derivation of the
      Macaulay rank profile and of transversality. This record owns the
      EMPIRICAL stratified measurement and borrows 427cf3's derivation as its
      mechanism (C2). If 427cf3's derivation fails, mechanism (C2) is withdrawn
      and this record must stand on (C1) alone -- and it says so rather than
      quietly retaining both.
    - >-
      IDEA-20260807-692e9b, which deliberately selects PRIME-ORDER classes.
      Those have odd order, hence r = 0 on every member, hence no
      stratification at all. The two records therefore study DISJOINT families
      of classes on purpose, and neither may cite the other's class selection as
      its own.
    - >-
      KN-TECH-030 (Pohlig-Hellman and prime-order-subgroup hygiene). That entry
      is why the 2-part is irrelevant to the ECDLP in G. This record does not
      dispute it; it claims only a relation-collection effect, and (E) states
      the distinction.

  object_first_candidate:
    tracked_object: >-
      THE FACTORISATION TYPE OF f(x) = x^3 + a x + b OVER F_p -- equivalently
      the integer r in {0, 1, 3}, equivalently the rational 2-torsion subgroup
      E[2](F_p) -- followed across every member of one F_p-isogeny class and
      across the gauge orbit of each member. On the classes this record selects
      (those with 4 | #E(F_p) and a non-trivial 2-volcano) r ranges over {1, 3}.
    lossiness: >-
      MAXIMALLY LOSSY: the whole curve collapses to a two-bit label. It forgets
      a, b, j, the group, the class, everything except one arithmetic feature of
      the cubic. LOSSY-PROJECTION TEST APPLIED, and it PASSES non-trivially:
      what is discarded (the actual roots, and hence the coordinates) is
      discarded COMPATIBLY with the operations at issue, because the gauge
      action moves the roots (by u^2) but not their NUMBER, and the Semaev
      system's transversality failure depends on the number and not on the
      values. A projection retaining the root VALUES would not be new -- it
      would be a re-encoding of (a, b). Retaining only the count is a genuine
      loss that still propagates deterministically under gauge, which is the
      definition the protocol asks for.
    propagation: >-
      Under gauge: EXACTLY invariant (roots scale by u^2, count unchanged).
      Under an ell-isogeny with ell odd: r can change, and it changes according
      to the 2-volcano structure, so it propagates deterministically only along
      2-isogenies (where it is the level indicator) and stochastically along
      others. That asymmetry is measurable and is one of the record's outputs.
      Under a quadratic twist: r is PRESERVED (the twist's cubic is
      x^3 + d^2 a x + d^3 b, whose roots are d times the original's), which
      makes the twist a control that holds r fixed while changing t.
    survival_score: >-
      Survives gauge, twist, and change of factor base. Dies when #E(F_p) is odd
      (r = 0 identically, nothing to stratify) and when the class has a trivial
      2-volcano (2 does not divide the conductor), in which case every member
      has the same r -- so the class selection must be done on that criterion
      FIRST, and a single-stratum class is a NULL CLASS for this record, which
      is exactly its matched null.

  mechanism: >-
    STEP 1 -- CLASS SELECTION ON A DECLARED CRITERION, BEFORE ANY MEASUREMENT.
    Enumerate complete classes at p in [2^12, 2^14] (as in IDEA-20260807-0ff796
    Step 2), compute r for every member, and retain only classes that contain
    BOTH strata with at least 8 members each. Classes with a single stratum --
    including every odd-order class, where r = 0 throughout -- are retained
    separately as the NULL CLASSES of Step 5. This selection is on r alone and
    never on the cost proxy, which would be circular.

    STEP 2 -- MEASURE THE COST PROXIES. On each retained member, at a COMMON
    factor base and a TRANSPORTED target with a re-verified certificate, run
    harness/semaev.py measure_s3_decomposition and record: Groebner basis size,
    Groebner basis maximum total degree, wall time, and the trivial-ideal flag.
    All four are implementation-bound proxies, exactly as that module states,
    and none is reported as a degree of regularity. Repeat >= 5 times per vertex
    with different factor-base seeds so the WITHIN-vertex variance is known
    before any BETWEEN-vertex comparison is made.

    STEP 3 -- STRATIFIED CONTRAST WITH THE GAUGE INTERVAL. For each class,
    compare the r = 1 and r = 3 strata using the gauge interval of
    IDEA-20260807-6eb96b as the reference spread: >= 8 gauge draws per member,
    the comparator reported as an interval, and the derived 2/n false-positive
    rate quoted beside every OUTSIDE verdict.

    STEP 4 -- THE MECHANISTIC SUB-MEASUREMENT, which distinguishes (C1) from
    (C2). Repeat Step 2 twice more per vertex: once with a factor base that
    EXCLUDES every 2-torsion x-coordinate, and once with a factor base that
    DELIBERATELY INCLUDES all r of them. If the stratification is caused by
    (C2), it must VANISH in the exclusion arm and be AMPLIFIED in the inclusion
    arm. If it survives the exclusion arm, (C2) is not the cause and (C1) or
    something unnamed is. This is the step that converts a correlation into a
    mechanism, and without it the record may report only a correlation.

    STEP 5 -- THE NULL CLASSES. Run the identical pipeline on classes with a
    single stratum, splitting their members arbitrarily into two groups of the
    same sizes as the real strata. The rule MUST return no effect there. This is
    the null-first check and it is run BEFORE the real arm is read.

    STEP 6 -- REACHABILITY BOOKKEEPING. If OUTCOME S fires, record: the cost of
    computing r at a vertex (one cubic factorisation, O(log^2 p)); the number of
    2-isogeny steps needed to move between strata (the 2-volcano height, O(1) to
    O(log p)); the size of the effect; and the resulting change, if any, in the
    total attack cost against 0.886 sqrt(N). The prediction recorded now is that
    the effect is a constant factor on the relation-collection stage only, hence
    baseline calibration by KN-TECH-018's standard and NOT an exponent.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Grep tool, 2026-08-07: "isogeny class" over the repository;
      "first.fall degree|first_fall|solving degree|degree of regularity" over
      the repository; "isomorphism class|quadratic twist|u\\^4|gauge" over
      ledger/. Targeted reads of DECOMPOSITION.md T4 and L2, KN-TECH-002,
      KN-TECH-004, KN-TECH-011, KN-TECH-030, harness/semaev.py,
      harness/toycurve.py, RQ-VOLC-f6253b.
    results: >-
      "solving degree"/"degree of regularity": 60+ files, concentrated in the
      DREG lane and its proposals; none of them stratifies by rational torsion
      or by group structure, and none mentions an isogeny class. "isogeny
      class": all hits are this campaign's own new records plus H-ICI-063e91.
      DECOMPOSITION.md T4's varies-within-class list does NOT include the group
      structure of E(F_p), which is the omission (A) repairs. No corpus record
      states that the Semaev ideal's transversality fails exactly at 2-torsion
      x-coordinates.
    verdict: >-
      ADAPTATION. Lenstra's structure theorem and the 2-volcano are standard and
      are claimed as nothing else; the identity disc_{x3} S_3 = 16 f(x1) f(x2)
      is classical and is marked for re-derivation rather than quotation. New to
      this program: the observation that the group structure varies within a
      class (repairing T4's list), and the use of r as a gauge-invariant,
      locally-computable stratification variable for a solving-degree proxy.
      External novelty is NOT claimed and a Stage 0 literature check is part of
      the design.

  null_object_control: >-
    MANDATORY, THREE LAYERS, ALL BLOCKING.
    (1) MATCHED NULL: single-stratum classes -- those with a trivial 2-volcano,
      or odd order where r = 0 throughout -- split arbitrarily into two groups
      of the same sizes as the real strata. Same p, same class structure, same
      measurement, same group sizes, and no r contrast. The rule must return
      nothing. Run FIRST.
    (2) GAUGE NULL: >= 8 gauge representatives per member. Because r is
      gauge-INVARIANT, the gauge arm cannot produce the stratification by
      construction, which is exactly why it is the right spread reference here
      and not a mode-1 null for THIS contrast (it is a mode-1 null for r itself,
      and the record says so).
    (3) DECAY PARAMETER: the factor-base size B. Mechanism (C2) predicts the
      effect DECAYS as r/B, because the stratification is driven by how many of
      the B factor-base elements are 2-torsion x-coordinates and there are at
      most 3 of them in all of F_p. An effect that does NOT decay as B grows is
      not (C2) and is very likely an apparatus artifact -- this is the canonical
      artifact tell for this record and it is stated before the run.
      FORCED VALUE, DERIVED NOW: under (C2) with a uniformly random factor base,
      the expected number of 2-torsion elements in V is rB/p, which is BELOW 1
      for every B and p in the toy range. So (C2) predicts a SMALL effect unless
      the factor base is deliberately loaded, which is precisely why Step 4's
      inclusion arm exists and why a large observed effect at random V would be
      EVIDENCE AGAINST (C2) rather than for it.

  assumptions:
    - >-
      [open, citation] Lenstra's structure theorem E(F_q) ~= O/(pi - 1) for
      ordinary E with End = O. Stated in (A) with the reference; the executor
      must re-verify the citation before it appears in a write-up. The record
      does NOT depend on the theorem operationally -- r is measured directly by
      factoring the cubic -- so a citation failure weakens the explanation, not
      the measurement.
    - >-
      [fact] r = #{x : f(x) = 0} lies in {0, 1, 3} for non-singular f, and
      #E[2](F_p) = 1 + r; r = 0 exactly when #E(F_p) is odd, which is a class
      invariant. Elementary.
    - >-
      [fact] r is gauge-invariant and twist-invariant. Verified by direct
      substitution and re-verified computationally.
    - >-
      [open] disc_{x3} S_3(x1, x2, x3) = 16 f(x1) f(x2), together with the
      symmetry of S_3 in its three variables. Classical; MUST be re-derived
      symbolically in sympy before mechanism (C2) is used. If it fails, (C2) is
      withdrawn.
    - >-
      [scope] The Groebner proxies are implementation-bound (harness/semaev.py
      says so). They are never reported as degrees of regularity, and any
      stratification found in them is a statement about this solver at this
      scale.
    - >-
      [scope] Toy scale, p <= 2^14, claim_tier toy.

  proof_search_map:
    not_applicable_reason: >-
      This record is an EMPIRICAL stratified measurement; it proves no theorem
      and constructs no bound. Its two mechanistic claims are proof-oriented and
      both are owned elsewhere with maps attached: the transversality derivation
      (C2) belongs to IDEA-20260807-427cf3, and the relation-count derivation it
      leans on belongs to IDEA-20260807-0ff796. What this record adds is the
      contrast, the stratification variable and the mechanism-discriminating arm
      of Step 4. Its one derived quantity -- the forced value rB/p for the
      expected number of 2-torsion elements in a random factor base -- is stated
      in null_object_control before the run, as pre-registration arithmetic
      rather than as a proof obligation.

  predictions:
    - metric: >-
        Groebner basis maximum total degree (implementation-bound proxy) on the
        r = 3 stratum minus the same on the r = 1 stratum, within one class, at
        a DELIBERATELY 2-TORSION-LOADED factor base
      direction: higher
      minimum_effect: >-
        At least 1 full degree, and outside the >= 8-draw gauge interval, in at
        least 2 of 3 independent classes. Anything smaller is not resolvable
        against solver noise at this scale and is declared INCONCLUSIVE in
        advance so neither branch can be reached by rounding.
    - metric: >-
        the same contrast at a factor base that EXCLUDES 2-torsion
        x-coordinates
      direction: different
      minimum_effect: >-
        PRE-REGISTERED: the contrast must FALL to inside the gauge interval. If
        it does not, mechanism (C2) is refuted and the record must either
        attribute the effect to (C1) with a new discriminating arm or report an
        unexplained correlation and say so.
    - metric: >-
        the effect size as a function of factor-base size B, over >= 4 values
      direction: lower
      minimum_effect: >-
        Must decay at least as fast as 1/B under (C2). A flat or growing effect
        in B is the artifact tell and forces the line to halt for instrument
        review rather than to report.
    - metric: >-
        the same pipeline on a single-stratum class with an arbitrary split
      direction: different
      minimum_effect: >-
        Must return NO effect. This verdict is computed and reported BEFORE the
        real arm's verdict is looked at (the null-first check).

  minimal_test:
    design: >-
      STAGE 0 (zero compute): re-derive disc_{x3} S_3 = 16 f(x1) f(x2) and the
      symmetry of S_3 symbolically; verify r is gauge- and twist-invariant on
      >= 100 curves; re-verify or downgrade the Lenstra citation. A failure at
      this stage costs minutes and removes mechanism (C2) before any Groebner
      run.
      STAGE 1 (~1 hour): enumerate complete classes at p ~ 2^13, compute r for
      every member, and confirm that BOTH strata occur inside at least one class
      -- which is the record's existence precondition and could itself fail.
      If no class at reachable p has both strata, the record is scoped out at
      toy scale and that is reported as a scope limit, not as a negative.
      STAGE 2 (hours, BLOCKING): the single-stratum null class, run first.
      STAGE 3 (hours): the stratified measurement at random, excluded and
      loaded factor bases, >= 5 seeds per vertex, >= 8 gauge draws per member.
      STAGE 4 (zero compute): apply the frozen rule; report the decay fit in B;
      record OUTCOME S or OUTCOME F with the reachability bookkeeping of Step 6.
    controls:
      - single-stratum class with an arbitrary split (matched null) -- BLOCKING, run first
      - gauge orbit, >= 8 draws, reported as an interval
      - factor base excluding 2-torsion x-coordinates (mechanism arm)
      - factor base loaded with 2-torsion x-coordinates (mechanism arm)
      - within-vertex repeat measurements to establish solver noise first
      - transport certificate on every transported target
    required_metrics:
      - r per class member, and the class's 2-volcano height
      - Groebner basis size, max total degree, wall time, trivial-ideal flag, per (vertex, seed, factor-base type)
      - within-vertex variance before any between-vertex contrast
      - gauge interval per member and its number of draws
      - the fitted B-decay exponent of the effect
      - the null-class verdict, reported before the real verdict

  falsification_conditions:
    - >-
      No class at reachable p contains both strata. The record's precondition
      fails at toy scale; reported as a SCOPE limit with the largest p reached,
      never as evidence that r has no effect.
    - >-
      The symbolic identity disc_{x3} S_3 = 16 f(x1) f(x2) fails, or S_3 is not
      symmetric as assumed. Mechanism (C2) is withdrawn and Step 4's arms lose
      their interpretation.
    - >-
      The single-stratum null class shows an effect. The rule fires on its own
      null; nothing is reported and measurement halts under P1.
    - >-
      The effect does not decay in B. Not (C2), probably apparatus; halt.
    - >-
      The contrast survives the 2-torsion-EXCLUDED factor base at full size.
      Then the named mechanism is wrong even if the correlation is real, and the
      honest report is "an unexplained within-class stratification by r", which
      is a weaker but still reportable observation and must not be dressed as
      mechanism (C2).
    - >-
      OUTCOME F (no stratification at any factor-base loading). The lane's one
      named, gauge-invariant, class-varying mechanistic cause does not move the
      cost proxy. This is the expected outcome and it is a NEGATIVE WITH A NAMED
      MECHANISM, which is the deliverable the closure standard asks for.

  confounders:
    - >-
      SOLVER NOISE DOMINATING. sympy's Groebner routine is not an optimised F4
      and its wall time varies substantially run to run. Within-vertex variance
      must be established first, and wall time must never be the primary metric.
    - >-
      r CORRELATES WITH VOLCANO LEVEL, which correlates with h(End(E)) and with
      the number of rational ell-isogenies. Any effect attributed to r could be
      an effect of level. The exclusion/inclusion arms of Step 4 are what
      separate them, because level does not change when the factor base is
      re-loaded but the (C2) mechanism does.
    - >-
      CLASS SELECTION. Selecting classes on r is legitimate; selecting them on
      the cost proxy is circular. The selection criterion is declared in Step 1
      and frozen.
    - >-
      GAUGE LEAKAGE. Each member must be measured at a canonical gauge
      representative or averaged over draws; otherwise gauge variance enters the
      stratum contrast.
    - >-
      SMALL STRATA. At toy p a stratum may have under 8 members, in which case
      no interval-based verdict is admissible. Stratum sizes are reported beside
      every contrast.
    - >-
      MULTIPLE PROXIES. Four proxies are recorded; reporting the one that fires
      is forking. All four verdicts are reported and their rates are not
      multiplied.

  interpretation_limits:
    - >-
      Nothing here bears on the ECDLP in G. r is a 2-part invariant and N is a
      large prime; by KN-TECH-030 the 2-part is irrelevant to the discrete
      logarithm. The claim is about a RELATION-COLLECTION proxy only.
    - >-
      A positive OUTCOME S at toy scale is a statement about this solver, this
      encoding, this p range and these classes. It is not a degree-of-regularity
      result and must never be summarised as one.
    - >-
      Passing the T5 gate (r is locally computable) establishes REACHABILITY,
      not benefit. A reachable minimiser of a functional that differs by a
      constant is baseline calibration by KN-TECH-018's standard, not an attack.
    - >-
      The Lenstra citation supports the EXPLANATION of why r varies; the
      measurement of r does not depend on it.

  heuristic_assumptions:
    - id: H1
      statement: >-
        Within a fixed F_p-isogeny class whose 2-volcano has height >= 1, both
        values r = 1 and r = 3 occur, and the fraction of members with r = 3 is
        bounded away from 0 and 1 as p grows.
      rigorous_support: >-
        The rigorous ingredient is the volcano structure: E[2] subset E(F_p)
        holds exactly at the levels where (pi - 1)/2 lies in End(E), so the
        strata are unions of volcano levels, and levels are non-empty by the
        standard structure of the ell-isogeny graph for ordinary curves. The
        heuristic part is the FRACTION, which imitates the classical
        expectation that class-group elements distribute evenly over the levels
        weighted by the class numbers h(D_0 f'^2).
      validation_plan: >-
        Exhaustively enumerate every class at p in {4001, 8191, 16381}, tabulate
        the empirical stratum fractions against the class-number-weighted
        prediction sum_{f' | f} h(D_0 f'^2), and check the tail: the classes
        with the most extreme fractions against the prediction. TOY SCALE ONLY
        and labelled as such; the fraction's asymptotic behaviour is not
        established by tens of classes at 13-bit primes.
    - id: H2
      statement: >-
        The number of 2-torsion x-coordinates in a uniformly random factor base
        of size B is Binomial(B, r/p) with mean rB/p, so mechanism (C2)'s effect
        on a random factor base scales as rB/p and is below 1 element for every
        (B, p) in the toy range.
      rigorous_support: >-
        Exact, not heuristic, for a uniformly random V: the r roots are a fixed
        set of size r <= 3 inside F_p. The heuristic element is only that the
        program's factor bases (built by build_factor_base in harness/semaev.py
        from hashed seeds) are close enough to uniform for this to hold.
      validation_plan: >-
        Measure the empirical count of 2-torsion elements in >= 1000 generated
        factor bases per (p, B) and compare against Binomial(B, r/p) by exact
        chi-square. A deviation means the harness's factor-base generator is not
        uniform, which is an instrument finding of independent value.

  reachability_gate: >-
    THIS IS THE ONE CANDIDATE IN L1 THAT PASSES T5 IF ITS EFFECT IS REAL, AND
    THAT IS THE REASON TO RANK IT ABOVE OTHER FUNCTIONALS. r is computable at
    any vertex in O(log^2 p) by factoring one cubic -- no isogeny graph, no
    class-group action, no global address. So goodness, if it exists, is
    LOCALLY DETECTABLE in the sense of DECOMPOSITION.md T5 route (R-local) of
    IDEA-20260807-c36472: an attacker walks 2-isogenies, reads r at each vertex,
    and stops at the preferred stratum after at most the 2-volcano height
    O(log p) steps, each step costing poly(log p). Transport of the instance
    costs the same walk (T1, with degree a power of 2, coprime to the odd prime
    N). TOTAL REACHABILITY COST: polylog(p), against a 0.886 sqrt(N) baseline --
    negligible. THE GATE IS PASSED ON COST. What remains entirely open, and what
    this record does NOT claim, is whether the prize is anything more than a
    constant factor on one stage of one attack family; the pre-registered
    expectation is that it is not.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS CLAIMED OR MOVED. If OUTCOME S fires with effect size
      delta on the solving-degree proxy, the honest statement is a
      CONSTANT-FACTOR change in one stage of point-decomposition index calculus
      at toy scale, which is baseline calibration by KN-TECH-018's standard. An
      exponent would require the stratum gap to grow with p; the mechanism (C2)
      predicts the opposite, since the effect scales as r/B with r <= 3 fixed.
    memory_exponent: >-
      Unchanged: the Semaev decomposition system's memory is a function of B and
      the arity, not of r. The measurement itself needs O(p) for enumeration and
      O(B) per system.
    best_known: >-
      0.886 sqrt(N) group operations at O(1) memory (KN-TECH-001, KN-TECH-006,
      with the negation discount per KN-TECH-018); BSGS at sqrt(N)/sqrt(N)
      (KN-TECH-031). For the decomposition stage: KN-TECH-003's heuristic and
      the program's DREG-lane degree measurements (KN-TECH-004, KN-TECH-011).
      None is changed by this record.
    hidden_overhead: >-
      The effect, if any, hides entirely inside "at a factor base loaded with
      2-torsion x-coordinates". A random factor base contains rB/p < 1 such
      elements at every toy parameter, so a real-world attacker would see
      nothing without deliberately loading -- and deliberate loading shrinks the
      usable factor base, a cost this record must charge and does.
    tradeoff_note: >-
      Loading the factor base with the r 2-torsion x-coordinates trades
      factor-base diversity for a possible staircase effect. That trade is
      measured directly by the inclusion/exclusion arms and is not assumed
      favourable.

  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES. Dominated on time by parallel
    rho at 0.886 sqrt(N) (KN-TECH-001, KN-TECH-006), by the
    automorphism-discounted variant (KN-TECH-018) and by BSGS at sqrt(N)
    (KN-TECH-031); dominated on memory by rho's O(1); dominated on data/queries
    because it reads the full curve equation and factors a cubic where rho reads
    only the group. Within the decomposition family it is dominated by the
    program's existing DREG-lane measurements on SCALE and MATURITY, and it
    dominates none of them -- it adds a stratification variable they do not
    have. dominated_by is NOT null.
  sota_delta: >-
    Zero speedup against any attack baseline. Quantitative deltas: (1) it names
    a within-class-varying, gauge-invariant invariant (r in {1,3} on classes
    with 4 | #E(F_p) and a non-trivial 2-volcano, equivalently E[2](F_p)) that
    DECOMPOSITION.md T4's varies-within-class list omits, and that is computable
    in O(log^2 p) at any vertex; (2) it converts the lane's within-class variance
    question, for one functional, from a 100-way unlabelled comparison into a
    2-level stratified contrast with a mechanism and a predicted 1/B decay;
    (3) if OUTCOME S fires, the reachability cost of the minimiser is polylog(p)
    rather than the p^{1/2} identification cost that IDEA-20260807-c36472 shows
    applies to unlabelled functionals -- a reduction of the T5 cost from p^{1/2}
    to polylog for this one functional, with the prize still unmeasured and
    expected to be a constant.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high

  honest_prior_of_survival: >-
    0.9 that r genuinely varies within reachable toy classes with 4 | #E(F_p)
    (the volcano structure guarantees it whenever 2 divides the conductor; the
    risk is that such classes are rare at 13-bit primes, which Stage 1 settles
    cheaply). 0.85 that the disc identity re-derives. 0.2 that OUTCOME S fires
    at a loaded factor base with a full degree of separation; 0.08 that it fires
    at a random factor base, which the forced value rB/p < 1 argues against and
    which would therefore be evidence against mechanism (C2) rather than for it.
    Overall the most likely honest headline is OUTCOME F: a negative against a
    NAMED mechanism, which is worth more than an unnamed null and is why the
    priority is high despite the low probability of a positive.

