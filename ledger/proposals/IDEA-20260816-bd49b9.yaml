idea:
  id: IDEA-20260816-bd49b9
  question_id: RQ-ALPF-001
  added: '2026-08-16'
  title: 'Before trusting any ALPF negative, establish that the screen can see a candidate that is
    really there: plant decomposition structure of a controlled, dialled magnitude into otherwise
    ordinary prime-field Semaev systems and measure the screen''s detection probability as a function
    of planted magnitude.'
  class: control
  claim: '(A) The ALPF campaign records many quiet cells and several explicit negatives -- EXP-ALPF-009
    SCOPED_NEGATIVE, EXP-ALPF-007 INCONCLUSIVE because the meter was not validated, H-ALPF-017 recording
    that no E(F_p)-native fixed-degree membership condition satisfies all three of its conditions.
    A negative from a screen is only interpretable if the screen''s detection probability is known,
    and this repository contains no measured detection curve for the ALPF first-fall screen. The campaign''s
    own positive control is a single planted system (three cubics with a shared quadratic factor)
    at one magnitude, which establishes detection at one point and nothing about the slope. (B) The
    claim is that a graded planted-positive family exists and is cheap: take a genuine prime-field
    Semaev system at the archived toy sizes and inject a syzygy of controlled weight w -- concretely,
    replace one factor-base generator by a combination that shares a degree-g factor with another,
    with g dialled from 1 upward, and additionally inject a planted decomposition by CONSTRUCTING
    the target point as a known sum of factor-base points so a solution provably exists. Detection
    probability as a function of (g, w) is then measurable, and the smallest planted magnitude the
    screen reliably detects is the screen''s resolution. (C) The claim is that this resolution number,
    not the binary METER_VALIDATED flag, is what licenses reading a quiet cell as a scoped negative:
    a quiet cell only excludes structure LARGER than the measured resolution. (D) NOT CLAIMED: that
    any real curve carries planted structure; that planted detection transfers to natural structure
    of the same nominal magnitude; that any negative in the ALPF lane is wrong; that any decomposition
    is feasible. Planted positives measure an instrument, and an instrument''s resolution is an upper
    bound on what its negatives exclude, never a positive result about elliptic curves.'
  mechanism: 'STAGE 1: construct planted instances with a certificate. Using harness/toycurve.py generate
    a toy prime-field curve and a point R defined as an explicit sum of k factor-base points, so a
    decomposition provably exists and its certificate is checkable by harness/semaev.py verify_decomposition_certificate.
    This is a planted positive at the DECOMPOSITION level. STAGE 2: construct planted instances at
    the ALGEBRA level: take the resulting Semaev system and inject a shared factor of degree g between
    two generators, for g = 1, 2, 3, holding the total degree profile fixed by compensating in the
    remaining generators, so the null and planted systems have identical profiles and differ only
    in the planted syzygy. STAGE 3: run the SAME meter used in the null-rate measurement over both
    arms in one invocation and record fired/quiet per instance, giving a detection rate per (g, k)
    cell. STAGE 4: sweep g upward until detection exceeds 0.9 and downward until it falls to the measured
    null rate; the crossing region is the resolution. STAGE 5: report, for every quiet cell in the
    archived ALPF tables, the smallest planted magnitude that would have been detected at that cell''s
    profile, and hence the exact scope of what that quiet cell excludes. Refutation: if detection
    is at or near the null rate for every g up to the largest that keeps the profile fixed, the screen
    has no resolving power at these sizes and every ALPF quiet cell is uninformative at that profile
    -- a strong, usable, measured obstruction.'
  novelty_status: unverified
  novelty_screen:
    method: 'grep -ril ''planted'' ledger/proposals/ ; grep -ril ''ALPF'' ledger/proposals/ ; grep
      -ril ''first-fall|first_fall|d_ff'' ledger/proposals/ ; read experiments/EXP-ALPF-011/analysis.md
      (meter self-validation table with POS-A, NEG-1, NEG-2), experiments/EXP-ALPF-006/analysis.md
      (gate FAIL, 0/3 positive controls fired), experiments/EXP-ALPF-007/analysis.md (METER VALIDATED:
      False, DEFECT-A), ledger/hypotheses/H-ALPF-017.yaml, harness/semaev.py function list.'
    results: '''planted'' appears in IDEA-20260811-565915 (RQ-VOLC-f6253b, identifiability collapse
      and f_E), IDEA-20260813-945a67 (RQ-SLHDSA-001, ADRS alias propagation), IDEA-20260807-61049d,
      IDEA-20260808-c4b462, IDEA-20260811-97e244, IDEA-20260809-2ba70c, IDEA-20260811-626f00 and IDEA-20260807-6eab6a
      -- none is a graded planted-positive detection curve for a first-fall screen, and none touches
      RQ-ALPF-001 (zero proposals reference ALPF at all). The closest committed work is INSIDE the
      ALPF artifacts themselves: EXP-ALPF-011 and EXP-ALPF-010 each publish a single positive control
      (POS-A, three cubics with a shared quadratic factor) firing at d_ff=4 against D_reg=7, and EXP-ALPF-006
      publishes a FAILED gate in which 0 of 3 positive controls fired, with the explicit note that
      merely having syzygies is insufficient if they cancel in the Hilbert series. EXP-ALPF-007 records
      METER VALIDATED: False and refuses to promote its quiet cells to negatives. So the program has
      already discovered, twice, that its positive control is fragile -- and has never measured the
      detection curve that would say by how much.'
    verdict: 'UNVERIFIED. No external-literature claim is made in either direction. Assembled from
      known parts: planted-signal positive controls (standard experimental practice and inventor-protocol
      section 3), the single-point POS-A control already inside EXP-ALPF-010 and EXP-ALPF-011, and
      the decomposition certificate machinery already present in harness/semaev.py. Claimed new relative
      to this repository: (i) GRADING the plant by a continuous magnitude parameter g so a detection
      curve rather than a point is produced; (ii) holding the leading-form degree profile FIXED between
      planted and null arms so the plant is the only difference the meter can see; (iii) reporting
      the resolution as an explicit scope qualifier attached to every archived quiet cell, which converts
      EXP-ALPF-006''s failed gate from a defect note into a number.'
  object_first_candidate:
    tracked_object: 'The planted syzygy itself: a degree-g common factor deliberately shared between
      two generators of an otherwise ordinary prime-field Semaev system, followed through the Macaulay
      construction to the degree at which it forces a rank deficit.'
    lossiness: Genuinely lossy. The tracked object retains only the degree g of the shared factor
      and the pair of generators it links, discarding the factor's coefficients, the curve, the factor
      base, and every other generator's content. This is compatible with the meter's operation because
      the meter reads only Hilbert-function drops, and a shared factor of degree g contributes a syzygy
      in degree d_i + d_j - g regardless of which factor it is. What is discarded -- the identity
      of the factor -- provably cannot affect the degree at which the syzygy first appears, only whether
      it cancels in the Hilbert series, and that cancellation is itself the phenomenon EXP-ALPF-006
      recorded and this measurement quantifies.
    propagation: One step is again the Macaulay degree increment D -> D+1. The planted syzygy propagates
      as a predicted rank deficit that first appears at degree d_i + d_j - g and then persists; the
      tracked object therefore has a predicted first-appearance degree computable in closed form from
      (d_i, d_j, g) with no computation. The measurement asks whether the meter's observed first-fall
      degree coincides with that predicted degree, and the gap between predicted and observed is the
      quantity that carries the information, because EXP-ALPF-006 documents exactly the case where
      the syzygy exists and the Hilbert function does not drop.
    survival_score: The planted structure survives from degree d_i + d_j - g up to the degree ceiling,
      so its detectability window is wide when g is large and vanishes when d_i + d_j - g exceeds
      the ceiling or exceeds D_reg_pred. Concretely, for the archived e-ring profile [2,2,2,4] a shared
      factor of degree g=1 between two degree-2 generators predicts a syzygy at degree 3, comfortably
      inside the ceiling; for the baseline profile [4,4,4,12] with g=1 it predicts degree 7. The structure
      dissolves as detectable exactly when the Hilbert series absorbs it, which is the boundary this
      proposal locates.
  null_object_control: 'The null object is the identical Semaev system with the plant removed -- same
    curve, same factor base, same degree profile, same seed, with the shared factor replaced by an
    independently drawn factor of the same degree so no syzygy is created. Both arms are constructed
    by the same builder function differing in one boolean and are run through the same meter in one
    invocation. For the planted arm to mean anything, the null arm must be QUIET at a rate consistent
    with the separately measured per-profile null rate; if the null arm fires at a comparable rate
    the detection curve is uninterpretable and the correct record is a controlled null. Additionally
    the decomposition-level plant carries a checkable certificate: the null arm''s target point is
    drawn uniformly and its decomposition is NOT constructed, so certificate verification must succeed
    on the planted arm and must not be claimed on the null arm.'
  discriminated_from:
  - The POS-A control inside EXP-ALPF-010 and EXP-ALPF-011 is one planted system at one magnitude
    producing one bit (fired). This measures a detection CURVE across g and k, with a matched null
    at every point, and reports a resolution rather than a flag.
  - EXP-ALPF-006's failed gate (0/3 positive controls fired) is a diagnosis that the meter missed
    three plants. It did not vary plant magnitude, did not hold degree profiles fixed across arms,
    and concluded INCONCLUSIVE; this proposal turns that same finding into a measured threshold and
    attaches it to the archived quiet cells as a scope qualifier.
  - IDEA-20260815-f9e978 (P(decomp) as a distribution) concerns the probability that a random point
    decomposes over a factor base. Here the decomposition is CONSTRUCTED to exist with a certificate,
    so decomposition probability is 1 by construction and is not the measured quantity.
  - The DREG ladder proposals (IDEA-20260815-ad4b55, IDEA-20260815-b751cf) sweep the degree of regularity
    for Semaev systems. This proposal holds the degree profile fixed by construction and varies only
    the planted shared-factor degree, which is the opposite manipulation.
  - IDEA-20260807-1354d8 reports a meter with no dynamic range on a different question. That is a
    symptom report; this supplies the calibration procedure that would have turned that symptom into
    a number, applied to the ALPF meter.
  assumptions:
  - A shared factor of degree g between two generators can be injected while holding the full leading-form
    degree profile fixed, by compensating in the remaining generators.
  - harness/semaev.py's verify_decomposition_certificate accepts a constructed decomposition of a
    point built as an explicit sum of factor-base points, so the decomposition-level plant is certifiable.
  - The meter used is the same pure-Python Macaulay-rank implementation whose control-row reproduction
    is established separately; without that, detection rates are not comparable to the archived campaign.
  - The archived toy sizes (13 to 17 bit primes, |FB| 3 to 9) are large enough that a planted syzygy
    is not swamped by accidental relations among the small number of field elements.
  - Detection of a planted syzygy is an upper bound on detection of a naturally occurring one of the
    same nominal degree; this is assumed for the scope statement and is explicitly listed as an interpretation
    limit, not proved.
  predictions:
  - metric: detection rate at g equal to the largest value keeping the profile fixed
    direction: higher
    minimum_effect: 0.9
  - metric: detection rate at g = 1
    direction: different
    minimum_effect: 'refuse to pre-commit: EXP-ALPF-006 recorded 0/3 detection on plants that did
      have syzygies, so the sign of the g=1 result is genuinely unknown and pre-committing would be
      dishonest'
  - metric: gap between predicted syzygy degree d_i + d_j - g and observed d_ff on detected plants
    direction: different
    minimum_effect: 0
  - metric: detection rate on the matched null arm
    direction: lower
    minimum_effect: 0.05
  - metric: certificate verification rate on the decomposition-level planted arm
    direction: higher
    minimum_effect: 1.0
  minimal_test:
    design: 'One profile, one prime, three plant magnitudes. Take the archived e-ring profile [2,2,2,4]
      at a 13-bit prime. Build 50 instances per arm: g=1, g=2, and null (no shared factor), all from
      the same curve family and seed list, all with the identical degree profile. Run one meter function
      over all 150 systems in one process and record fired/quiet. The discriminating comparison is
      three proportions: if g=2 detects near 1.0, g=1 detects near the null rate, and the null is
      quiet, then the screen''s resolution at this profile lies between g=1 and g=2 and every archived
      quiet cell at this profile excludes only structure of shared-factor degree 2 or more. If all
      three proportions are equal, the screen has no resolving power at this profile and that is the
      result. Total cost is a few CPU-minutes and one builder function with a boolean and an integer.'
    controls:
    - 'Matched null arm: identical construction with the shared factor replaced by an independent
      factor of the same degree, run in the same invocation.'
    - The three published meter control rows re-run in the same invocation, so the detection curve
      is anchored to the archived campaign.
    - 'Certificate control: verify_decomposition_certificate must accept every decomposition-level
      plant and must not be invoked as a claim on the null arm.'
    - 'Profile-invariance check: assert programmatically that the planted and null arms have byte-identical
      leading-form degree profiles before metering.'
    - 'Seed-block control: 5 disjoint seed blocks per cell so a detection rate is not a single-seed
      artifact.'
    - 'Curve-family control: repeat the smallest cell on a second, independently generated toy curve
      to show the resolution is not curve-specific.'
    required_metrics:
    - detection rate per (profile, g, k) with Clopper-Pearson interval
    - matched-null fire rate per cell
    - observed d_ff minus predicted syzygy degree d_i + d_j - g, per detected instance
    - certificate verification success rate on the planted decomposition arm
    - resolution g_min defined as the smallest g with detection rate above 0.9
    - profile-identity assertion pass rate between arms
    - positive-dimensional instance fraction per cell
  falsification_conditions:
  - Detection rate is statistically indistinguishable from the matched-null rate at every g, meaning
    the screen has no resolving power at that profile -- a usable measured obstruction, not a failure
    of the experiment.
  - The matched null arm fires at a rate above the separately measured per-profile null rate, indicating
    the plant/null construction is not matched and the whole comparison is void.
  - Any certificate fails to verify on the decomposition-level planted arm, invalidating the plant
    construction.
  - Profile-identity assertion fails between arms, invalidating the comparison.
  - Detection rate is non-monotone in g beyond seed-block noise, indicating an uncontrolled construction
    variable.
  - The three published control rows are not reproduced, in which case no detection curve is comparable
    to the archived campaign and none is reported.
  confounders:
  - Injecting a shared factor while holding the profile fixed necessarily changes generator coefficients,
    which may itself perturb the Hilbert function independently of the syzygy.
  - At 13-bit primes accidental common roots occur at non-negligible rate, blurring the g=1 arm into
    the null arm.
  - A planted syzygy that cancels in the Hilbert series is undetectable in principle, as EXP-ALPF-006
    records; low detection may reflect this algebraic fact rather than instrument insensitivity, and
    the two are hard to separate without a symbolic side-computation.
  - The decomposition-level plant makes the target point non-uniform, which is exactly the intended
    manipulation but means these instances are not representative of random ECDLP instances.
  - The degree ceiling truncates detection for large d_i + d_j - g, biasing detection downward at
    small g for high-degree profiles.
  interpretation_limits:
  - A measured resolution bounds what QUIET cells exclude; it says nothing about whether any real
    prime-field curve carries structure at or above that resolution.
  - Planted detection is assumed but not proved to upper-bound natural detection at the same nominal
    magnitude; a natural syzygy could be harder or easier to see.
  - The result is scoped to the tested profiles, primes and plant construction, and does not transfer
    to medium or cryptographic scale.
  - No decomposition speed, attack, or security consequence follows; the certified decompositions
    exist by construction and cost nothing to find.
  target_complexity:
    time_exponent: No attack exponent is claimed. Planted decompositions are constructed, not searched
      for, so their discovery cost is zero by construction and must never be cited as a solving time.
    memory_exponent: No attack memory exponent is claimed. Peak memory is the Macaulay matrix at the
      ceiling degree, same order as the null-rate measurement.
    best_known: The incumbent calibration for this screen is the single POS-A planted control published
      in EXP-ALPF-010 and EXP-ALPF-011, plus the three-plant gate that FAILED in EXP-ALPF-006 (0/3
      fired). The incumbent for the underlying problem remains Pollard rho at roughly sqrt(n) group
      operations, untouched here.
    hidden_overhead: 'Holding the degree profile fixed while injecting a shared factor is fiddly and
      is where the human cost sits; a mis-specified compensation silently converts the manipulation
      into a profile change, which the meter would detect for the wrong reason. Lower-order term:
      constructing certifiable decompositions requires the factor base and the target to be generated
      together, which couples this experiment''s instance generator to harness/semaev.py''s build_factor_base
      conventions.'
  dominated_by: 'n/a (no attack result claimed). Pareto check performed: this produces no point on
    any ECDLP time/memory/data frontier, so no frontier row dominates or is dominated. On the instrument-calibration
    axis it strictly dominates the incumbent single-point POS-A control in information (a curve and
    a threshold rather than one bit) at roughly 50x the compute, so it is dominated by the incumbent
    on cost.'
  sota_delta: 'No attack; measurement and control contribution only. Quantitatively: incumbent calibration
    is n=1 plant at one magnitude (EXP-ALPF-010/011) or n=3 plants with 0 detections (EXP-ALPF-006);
    this yields detection rates at 3 or more magnitudes with 50 instances each and Clopper-Pearson
    intervals near plus-or-minus 0.07, producing an explicit resolution g_min. Zero change to any
    ECDLP exponent.'
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'That a graded plant can be constructed with the profile held fixed: 0.7
    -- the compensation trick is straightforward for the low-degree profiles and awkward for [3,3,3,24].
    That the decomposition-level plant certifies through harness/semaev.py: 0.85, since verify_decomposition_certificate
    already exists. That a clean monotone detection curve appears with a well-defined g_min: 0.45
    -- EXP-ALPF-006''s 0/3 result is direct committed evidence that plants can be invisible to this
    meter, so a flat curve at the null rate is a real possibility. That the flat outcome, if it happens,
    is still a usable measured obstruction attachable to the archived quiet cells: 0.9, because it
    converts ''meter not validated'' into ''meter cannot resolve shared-factor degree below g at this
    profile''. Probability this changes any existing ALPF verdict: 0.25, and that is not the deliverable.'
