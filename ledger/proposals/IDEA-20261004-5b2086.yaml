# IDEA-20261004-5b2086
# Wider window-table count. Proposal only. Not approved.
idea:
  id: IDEA-20261004-5b2086
  question_id: RQ-ECDLP-002
  added: '2026-10-04'
  status: proposed
  approved_by: null
  title: >-
    A width-19 window table stores 262144 entries and a width-18 table stores 131072
  class: representation
  claim: >-
    A window of width 19 stores 262144 precomputed entries. A window of
    width 18 stores 131072. Two hundred sixty-two thousand one hundred
    forty-four exceeds one hundred thirty-one thousand seventy-two by
    131072. The product of the two table sizes is 34359738368. Their
    sum is 393216. The gap is a table size, not an ECDLP exponent.
  mechanism: >-
    OBJECT FRAME. The object is the precomputed table. The operation
    set is reading one entry during a recoding. Two to the power
    18 is 262144. Two to the power 17 is 131072. Two width-18 tables both
    store 131072, so that gap is 0 and their product is 17179869184. No
    curve point is added.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-002
      provenance: internal
      claim: >-
        The question asks for a checkable route toward an attack-cost change.
      verified_by: coordinator session 2026-10-04, question file present
    - ref: KR-RHO-ea34b8
      provenance: internal
      claim: >-
        Precomputation-table bounds are a different scale from these two sizes.
      verified_by: coordinator session 2026-10-04, frontier row on disk
  assumptions:
    - The two widths are frozen before the powers are taken.
    - No curve point is added.
  proof_search_map:
    bottleneck: The table-size gap 131072.
    baseline_embedding:
      parameter_slice: The widths 19 and 18 and the sizes 262144 and 131072.
      reproduction_check: >-
        Two readers must agree that 2 to the power 18 is 262144 and that
        2 to the power 17 is 131072.
    observation_collision:
      observable: The table-size gap and the product.
      distinct_preimage_search: >-
        Reporting both tables as size 131072 drops the gap. Two width-18
        tables make that gap 0.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The width-18 table.
        predicted_gain: One hundred thirty-one thousand seventy-two fewer stored entries. No exponent.
    quantifier_order: >-
      The widths are fixed before the sizes.
    method_ceiling:
      strongest_certifiable_claim: >-
        The table sizes 262144 and 131072. Not a scalar multiplication.
      nearby_object_control: >-
        Two width-18 tables. Both store 131072, and the gap is 0.
    proof_obligations:
      - claim: The width-19 table stores 262144 entries.
        responsibility: size
      - claim: The width-18 table stores 131072 entries.
        responsibility: size
      - claim: The gap is not an exponent.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: table_gap
      direction: different
      minimum_effect: Two hundred sixty-two thousand one hundred forty-four exceeds one hundred thirty-one thousand seventy-two by 131072.
  minimal_test:
    design: >-
      Compute 2 to the power 18 and 2 to the power 17. Do not add a
      curve point.
    controls:
      - Two width-18 tables, whose size gap is 0.
      - An independent count.
    required_metrics:
      - both table sizes
      - the gap
      - the product
  falsification_conditions:
    - The width-19 table size is not 262144.
    - The product of the two sizes is not 34359738368.
  confounders:
    - A width-18 table of size 131072 is a different window from a width-17 table of size 65536.
  interpretation_limits:
    - A table size is not a walk length.
    - No transfer to a cryptographic scalar.
    - This is not the table-size pair 131072 and 65536.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen width-19 table has size 2 to the power 18, and the
        frozen width-18 table has size 2 to the power 17.
      rigorous_support: >-
        No scalar-multiplication theorem is claimed. The count is
        a reading of two powers of 2.
      validation_plan: >-
        Two independent powers. A mismatch voids the gap.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: Two hundred sixty-two thousand one hundred forty-four stored entries versus one hundred thirty-one thousand seventy-two, a constant factor.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: Recoding cost is not counted.
    tradeoff_note: A larger table can shorten digits and does not by itself shorten a walk.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-ea34b8
      - KR-RHO-53c89f
      - KR-RHO-13bf67
      - KR-RHO-38be82
      - KR-RHO-cb1c58
    nearest:
      - ref: KR-RHO-ea34b8
        provenance: internal
        relation: adjacent
        delta: >-
          That row bounds precomputation tables at cryptographic
          size. This record counts table sizes 262144 and 131072 and claims
          no precomputation attack.
  dominated_by: >-
    No attack is claimed. Rho dominates any attack reading of a table size.
  sota_delta:
    time: zero attack delta
    memory: a constant factor of 262144 versus 131072
    data_queries: Two frozen widths.
