idea:
  id: IDEA-20260905-4dca34
  title: Canonical versus arbitrary lift structural-observable audit
  class: control
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  added: '2026-09-05'
  proposed_at: '2026-09-05'
  proposed_by: idea-generator
  claim: >-
    The testable prediction is that F(P)=x(P)^2/A modulo p^2 is unchanged by
    admissible short-Weierstrass model scaling, while its first lift digit can
    differ between the canonical lift and a bounded family of other lifts of
    the same ordinary residue curve. A difference would establish finite-scope
    deformation sensitivity, not a canonicality detector or an ECDLP advantage.
    These are proposal predictions, not observed results.
  mechanism: >-
    Use short-Weierstrass models y^2=x^3+Ax+B over Z/p^2Z, p>3, with A a unit
    and ordinary nonsingular reduction. For each nonidentity residue point in
    the frozen odd-order subgroup n>3 coprime to p, compare F=x^2/A on its
    unique n-torsion section across the canonical lift and the coefficient
    perturbations (A+p*a,B+p*b), with a,b in {0,1}, excluding (0,0).
    Certify rather than assume which perturbations are noncanonical. Apply
    two frozen admissible unit scalings to every model. The reusable structural
    question is whether the first-order response of F descends through the
    declared model equivalence and how it depends on the deformation direction;
    torsion-section uniqueness alone does not classify this response.
    Define the first lift digit using the fixed representatives 0,...,p-1:
    d(F)=(F-lift(F mod p))/p mod p. This digit convention is auxiliary;
    invariance of the finite-ring value does not make digit extraction intrinsic
    under arbitrary presentation changes. No scalar recovery is proposed.
  novelty_status: unverified
  citations:
    - ref: ledger/proposals/IDEA-20260807-ee6ef7.yaml
      provenance: internal
      claim: >-
        Prior proposal addresses Hilbert class polynomial and modular polynomial
        materialization costs; it expressly leaves cheaper local constructions open.
        This audit concerns structural observables rather than global construction.
      verified_by: '/root direct source read 2026-09-05; author received parent summary'
    - ref: knowledge/open-problems/KN-OPEN-3417fc.md
      provenance: internal
      claim: Parent identifies an open question about coordinate and valuation functionals.
      verified_by: '/root direct source read 2026-09-05; author received parent summary'
    - ref: knowledge/findings/KN-FIND-1ba0fe.md
      provenance: internal
      claim: >-
        Parent read all amendments: x-difference valuation has sign-fibre scope;
        toy records at (p,n)=(1009,47),(1013,41) do not close single-point statistics.
      verified_by: '/root direct source read 2026-09-05; no independent run verification here'
  assumptions:
    - Ordinary elliptic curves of good reduction; odd subgroup order n coprime to p.
    - Canonicality of each designated lift must be certified before comparison.
    - Coordinates, base ring, precision and allowed model transformations are frozen first.
    - Parent source summaries are the present evidence boundary; no exhaustive literature search is claimed.
  proof_search_map:
    bottleneck: Separate canonical structure from arbitrary representation choices.
    baseline_embedding:
      parameter_slice: One fixed ordinary residue curve and prime-to-p subgroup at fixed precision.
      reproduction_check: >-
        First reproduce torsion-logarithm vanishing and the sign-fibre valuation
        classification as mathematical baselines, with exact hypotheses recorded.
    observation_collision:
      observable: >-
        F(P)=x(P)^2/A modulo p^2 and its first lift digit d(F), under the
        explicitly fixed residue-representative convention.
      distinct_preimage_search: >-
        Ask whether an allowed coordinate change or a noncanonical lift gives the
        same expression; collisions delimit what the expression can certify.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: Coordinate-change equivalence class of the declared observable.
        predicted_gain: Possible removal of model artifacts; zero claimed solver improvement.
    quantifier_order: >-
      Freeze the curve, precision, coordinate equivalence and observable before
      examining lifts; any existential counterexample is confined to that frozen class.
    method_ceiling:
      strongest_certifiable_claim: Invariance or noninvariance of one observable in the declared class.
      nearby_object_control: >-
        Arbitrary good-reduction lifts with the same residue curve and torsion labels,
        plus isomorphic coordinate changes of the canonical lift.
    proof_obligations:
      - claim: Establish which compared lifts are canonical and which transformations preserve the setup.
        responsibility: feasibility
      - claim: Show a purported distinction survives the entire declared coordinate equivalence.
        responsibility: correctness
      - claim: Charge lift construction, precision growth and representation size separately.
        responsibility: runtime
      - claim: Bound the conclusion to the observable and lift family actually audited.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: number of changed finite-ring F values under the two admissible model scalings
      direction: lower
      minimum_effect: Predicted count zero; one certified mismatch falsifies the stated invariance or exposes a setup error.
    - metric: number of first-digit differences between the canonical lift and certified noncanonical perturbations
      direction: different
      minimum_effect: >-
        Predicted count at least one in the frozen finite panel. Zero differences
        falsifies that panel-specific sensitivity prediction only; a positive
        count establishes sensitivity and does not identify canonicality uniquely.
  minimal_test:
    design: >-
      Design-only request for a panel of at most four synthetic ordinary residue
      curves with 5<=p<=101, A nonzero modulo p and an odd subgroup n>3 coprime
      to p. A future contract must freeze exact curve tuples, subgroups, the
      canonical models, the three coefficient perturbations above, two unit
      scalings and the digit convention before inspecting values. Use precision
      r=2 and every nonidentity subgroup point, with residue point labels only.
      Compare the exact F values and digit-difference counts. Prove the scaling
      transformation law before compute. If canonicality cannot be certified,
      report an inconclusive comparison. No experiment is approved here.
    controls:
      - Same canonical lift expressed in two admissibly isomorphic integral models.
      - Arbitrary lift of the same residue curve with the same torsion-section convention.
      - Sign-fibre valuation and torsion logarithm as predetermined degenerate baselines.
    required_metrics:
      - Exact invariance or counterexample certificate.
      - p, subgroup order, precision and coordinate expression degree.
      - Lift construction cost, symbolic expression size, peak storage and precision loss.
      - Which canonicality property each proof step uses.
  falsification_conditions:
    - The frozen finite panel has zero first-digit differences from every certified noncanonical perturbation.
    - Every proposed distinction in the frozen candidate class disappears under admissible model changes.
    - The same property follows from prime-to-p torsion lifting without canonicality.
    - The observable reduces to the already classified sign-fibre statistic.
  confounders:
    - Unequal lift precision or unmatched base extensions.
    - Special small discriminant cases mistaken for uniform canonical behavior.
    - Circular canonicality certification or coordinate choices fitted after inspection.
  interpretation_limits:
    - Failure closes only the frozen observable class, never canonical-lift methods generally.
    - A distinguishing invariant is not a scalar coordinate or an ECDLP algorithm.
    - Earlier global construction costs do not rule out cheaper local lifts.
  heuristic_assumptions: []
  heuristic_assumptions_note: Exact structural audit; no random model or distribution hypothesis is asserted.
  target_complexity:
    time_exponent: 'No solver proposed; claimed exponent improvement = 0.'
    memory_exponent: 'No solver proposed; claimed exponent improvement = 0.'
    best_known: 'Baseline generic square-root group-work exponent 1/2; not a full frontier certification.'
    hidden_overhead: Lift construction, base extension, precision, expression expansion and coordinate normalization.
    tradeoff_note: No time-memory-data tradeoff claimed; each cost must be retained in any successor design.
  dominated_by: 'not established: structural audit only, no solver candidate compared; full frontier screen not performed'
