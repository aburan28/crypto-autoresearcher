idea:
  id: IDEA-20260816-8e0b9c
  question_id: RQ-SHAONE-081e3a
  added: '2026-08-16'
  title: 'Measure the identical-prefix to chosen-prefix cost ratio as a law rather than a folklore
    factor: run both attacks end to end at three scaled-down analogue widths where exhaustive verification
    is possible, and report the ratio and its trend with width against a random-target null.'
  class: measurement
  claim: '(A) The gap between an identical-prefix collision and a chosen-prefix collision is routinely
    described as a large factor, but a factor without a trend cannot be extrapolated and cannot be
    checked. The gap is a ratio R(w) = C_cp(w) / C_ip(w) between two measured total costs at analogue
    width w, and a ratio measured at three widths has a trend, which is a strictly stronger and strictly
    more falsifiable object than a single factor. (B) Both attacks are executable end to end at reduced
    widths on a truncated or reduced-step compression function, where every collision produced can
    be verified directly and exhaustively and no certificate rests on trust. Total cost is counted
    in compression-function evaluations, which is machine-independent and therefore immune to the
    timing-variance problems that dominate this program''s own instrument audits. (C) The claim is
    that R(w) is measurable with error bars at three widths, that its trend with w is reportable,
    and that the trend distinguishes two structurally different possibilities: a ratio that is asymptotically
    constant, versus one that grows with width. Which of those holds determines whether any single
    quoted factor can be carried across parameter sets at all. (D) WHAT IS NOT CLAIMED: no attack
    on any real hash, no extrapolation of R(w) to full width, no assertion that any published factor
    is right or wrong, and no security consequence. R measured at reduced widths is a statement about
    reduced widths, and the trend is a trend over three points, which is a weak object and will be
    labelled as one. (E) A measurement showing R(w) flat within error is as valuable as one showing
    growth, because a flat ratio is precisely the condition under which a single factor is a legitimate
    thing to quote.'
  mechanism: 'STAGE 1: build the analogue. Fix a reduced-step or truncated compression function at
    three widths, chosen so that the identical-prefix attack completes in minutes at the smallest
    and hours at the largest, and so that every produced collision is verifiable by direct recomputation.
    STAGE 2: implement both pipelines against the same analogue and the same evaluation counter --
    identical-prefix as a single-path search from a fixed common chaining value, chosen-prefix as
    a birthday phase into a target-difference set followed by chained near-collision blocks. Sharing
    the counter and the compression kernel is what makes the ratio meaningful; two separately optimised
    implementations would measure programming effort, not the attacks. STAGE 3: run each pipeline
    to a declared number of successes at each width, counting total evaluations per success. STAGE
    4: form R(w) with bootstrap intervals and report the trend across the three widths, explicitly
    as a three-point trend. STAGE 5: null control -- run the chosen-prefix pipeline against a target-difference
    set drawn uniformly at random with matched cardinality, which removes the structured target while
    preserving the two-phase shape, and report R_null(w). If R and R_null track each other, the ratio
    measures the two-phase shape rather than the chosen-prefix structure. STAGE 6: verify every collision
    by direct recomputation and emit certificates only for objects actually computed.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read RQ-SHAONE-081e3a and GOAL-SHA1-001 in full; the fourth listed opening in the bucket
      brief and the goal''s cost-model criterion both bear on this. Ran: grep -l ''RQ-SHAONE'' ledger/proposals/*.yaml
      (zero); grep -ril ''chosen-prefix'' ledger/proposals (four elliptic-curve false matches, read);
      grep -ril ''cost model'' ledger/proposals | wc -l (233, sampled titles); grep -l ''question_id:
      RQ-MDFIVE'' ledger/proposals/*.yaml (zero). Read knowledge/literature/KN-LIT-91b680.md and knowledge/techniques/KN-TECH-066.md;
      read ledger/goals/GOAL-MD5-001.yaml, which owns executable end-to-end collision generation.'
    results: No proposal exists against any hash research question, so no record measures either attack,
      let alone their ratio. GOAL-MD5-001 owns executable end-to-end collision generation and its
      non_duplication clause states that GOAL-SHA1-001 owns the chosen-prefix cost model while consuming
      MD5-scale measured anchors -- which places this proposal cleanly inside GOAL-SHA1-001's ownership
      while depending on GOAL-MD5-001's pipeline, a dependency named here rather than discovered later.
      The four chosen-prefix keyword matches in ledger/proposals are all under RQ-EWALK-8fa147 and
      RQ-EQIC-8cb959 and concern elliptic-curve walks.
    verdict: 'UNVERIFIED. Nothing is asserted about whether the identical-prefix to chosen-prefix
      ratio has been measured at reduced widths in published work. Claimed new only internally: this
      repository contains no measurement of either attack and no ratio law, and the design of measuring
      both with a SHARED evaluation counter and a shared kernel -- so that the ratio cannot be an
      artefact of differential optimisation effort -- is assembled from the program''s own instrument-validity
      discipline (RQ-INSTR-f8faa0) rather than from any external source.'
  object_first_candidate:
    tracked_object: 'The pair (phase, evaluations-spent-so-far): the attack''s position in its own
      cost structure, carried as which phase is active (birthday, near-collision block j, or single-path
      search) together with the running evaluation count attributable to that phase. What is followed
      through the computation is the ATTRIBUTION of work to phases, which is what a ratio between
      two attacks is actually comparing.'
    lossiness: Genuinely lossy, and modestly so. The projection discards every message, every chaining
      value and every intermediate state, retaining only a phase label and a counter. It is compatible
      with the operation because the phase transition rule is determined by the pipeline's control
      flow and not by the discarded state, so the retained pair propagates deterministically alongside
      the real computation. What is lost is any ability to say WHY a phase was expensive -- the object
      gives the attribution but not the mechanism -- which is why the near-collision restart statistics
      are collected as secondary metrics rather than being reconstructible from the tracked object
      itself.
    propagation: One step of the target operation is one compression-function evaluation. It increments
      the counter of the active phase; a phase-completion event transitions the label and freezes
      that phase's subtotal. The object is therefore a monotone accumulator with a small finite control
      state, and the ratio R is a function of the frozen subtotals alone.
    survival_score: The attribution object survives the entire attack by construction and dissolves
      only when phases overlap -- concretely, when a restart in near-collision block j forces re-entry
      into the birthday phase, at which point attribution becomes ambiguous and must be resolved by
      a declared rule. Measuring how often that happens is a required metric, and a high re-entry
      rate means the phase decomposition, and hence the ratio's interpretability, degrades. That is
      a real and reportable boundary rather than an assumption.
  null_object_control: 'Random target-difference set: run the identical chosen-prefix pipeline, in
    the same invocation and with the same kernel and counter, against a target-difference set drawn
    uniformly at random with cardinality matched to the structured set. This preserves the two-phase
    shape while removing the structure. The null must show a materially different R -- specifically
    a higher R, since an unstructured target should make the birthday phase harder without changing
    the identical-prefix baseline at all. If R_null tracks R across all three widths, the measured
    ratio reflects the generic cost of having two phases rather than anything about chosen-prefix
    structure, and the signal arm means nothing.'
  discriminated_from:
  - 'GOAL-MD5-001''s calibration work: that goal owns making the pipeline work at all and rediscovering
    a published path; this proposal consumes a working pipeline and measures a RATIO between two attacks
    at three widths, which that goal does not do and explicitly assigns to GOAL-SHA1-001.'
  - 'The birthday-phase efficiency proposal in this batch: that measures eta, an achieved-versus-ideal
    efficiency within one phase; this measures a ratio between two whole attacks. They share the analogue-width
    methodology and nothing else, and neither may cite the other''s number as its own.'
  - 'RQ-INSTR-f8faa0 timing audits: those measure machine variance in wall clock; this counts compression-function
    evaluations, which is deliberately machine-independent, so the two address different noise sources
    entirely.'
  - 'Restating a published cost factor: that would carry one number forward; this measures two costs
    at three widths with a shared counter and reports a trend with intervals and a null arm.'
  - 'KN-LIT-91b680: a filed survey note on the chosen-prefix framework at confidence reported, containing
    no measurement; this proposal asserts nothing about its content.'
  assumptions:
  - A reduced-step or truncated analogue preserves the STRUCTURAL relationship between the two attacks
    even though its parameters differ. This is the central extrapolation assumption and no numeric
    transfer to full width is performed.
  - A shared compression kernel and shared evaluation counter make the two pipelines comparable; differential
    optimisation effort is the main threat and this is the mitigation.
  - Compression-function evaluations are the right cost unit; memory is reported separately and never
    folded into the ratio.
  - Both pipelines succeed often enough at all three widths to give at least the declared number of
    successes within budget.
  - The phase-attribution rule for restarts is declared before running and not adjusted after seeing
    the re-entry rate.
  predictions:
  - metric: R(w) = chosen-prefix evaluations per success / identical-prefix evaluations per success,
      at the largest analogue width
    direction: higher
    minimum_effect: 10
  - metric: trend of R across the three widths
    direction: different
    minimum_effect: 'explicit refusal to pre-commit a slope: whether R is flat or growing is the question,
      and pre-committing a direction would make the experiment unable to deliver its own primary result.
      Reported as R at each width with bootstrap intervals and an explicit statement of whether the
      intervals overlap.'
  - metric: R_null (random target set) relative to R (structured target set) at each width
    direction: higher
    minimum_effect: 2
  - metric: birthday-phase re-entry rate during near-collision blocks
    direction: lower
    minimum_effect: 0.1
  minimal_test:
    design: 'The cheapest discriminating run uses the smallest analogue width only and asks a single
      question: with a shared kernel and shared counter, is R measurable at all with intervals tight
      enough to separate it from R_null? Run both pipelines to a declared 50 successes each at the
      smallest width, plus the random-target null arm in the same invocation, and bootstrap the ratio.
      This costs CPU-hours, no GPU, and produces certificates for every collision by direct recomputation.
      If the intervals for R and R_null overlap at the smallest width, the ratio measures two-phase
      shape rather than chosen-prefix structure and the three-width trend is not worth buying. If
      they separate cleanly, the two larger widths are justified and the trend becomes the deliverable.
      Either way the smallest-width run produces a measured ratio with an interval, which is more
      than the repository currently holds.'
    controls:
    - Random target-difference set of matched cardinality, same invocation, same kernel and counter.
    - Shared compression kernel and shared evaluation counter across both pipelines, verified by a
      byte-identical kernel hash recorded in the manifest.
    - Direct recomputation verification of every produced collision, so no certificate rests on the
      pipeline's own report.
    - An identical-prefix run against the reduced-step analogue with the near-collision machinery
      disabled, confirming the baseline is not accidentally paying chosen-prefix costs.
    - At least 50 successes per cell so the ratio carries a bootstrap interval rather than being a
      single draw.
    required_metrics:
    - compression-function evaluations per success, per pipeline, per width
    - R(w) with bootstrap confidence interval at each width
    - R_null(w) with interval at each width
    - peak memory per pipeline per width, reported beside time and never folded into R
    - birthday-phase re-entry rate and phase subtotals
    - count of collisions verified by direct recomputation versus produced
  falsification_conditions:
  - R and R_null intervals overlap at every width, showing the ratio reflects two-phase shape rather
    than chosen-prefix structure.
  - R at the largest width is below 10, refuting the premise that the two attacks differ by a large
    factor at analogue scale.
  - Birthday-phase re-entry exceeds 10 percent, making phase attribution ambiguous and R uninterpretable.
  - Any produced collision fails direct recomputation, voiding the run's certificates and every count
    derived from it.
  - The two pipelines cannot be made to share a kernel, so any measured ratio is confounded with implementation
    effort and no ratio may be reported.
  confounders:
  - Differential optimisation effort between two pipelines is the dominant threat and can produce
    any ratio; the shared kernel and shared counter are the only real defence and their sufficiency
    is itself arguable.
  - Reduced-step analogues can weaken one attack more than the other, so the ratio may be a property
    of the reduction rather than of the attacks.
  - Success-count thresholds interact with heavy-tailed cost distributions; a mean ratio over few
    successes can be dominated by one lucky or unlucky run.
  - Memory limits can throttle the chosen-prefix birthday phase specifically, inflating R for a reason
    that has nothing to do with the attack structure.
  interpretation_limits:
  - R measured at reduced widths is a statement about those widths; no extrapolation to full-width
    SHA-1 or MD5 parameters is performed or licensed.
  - A three-point trend is a weak object and will be labelled as one; it can suggest flat versus growing
    but cannot establish an asymptotic law.
  - The ratio compares evaluation counts only; memory and communication are reported separately and
    a Pareto comparison across all axes is not collapsed into R.
  - Nothing here bears on the security of any hash function or any deployed system.
  target_complexity:
    time_exponent: No attack exponent is claimed. R is a dimensionless ratio between two measured
      evaluation counts at declared reduced widths.
    memory_exponent: No attack memory exponent is claimed. Peak memory is reported per pipeline per
      width as a measured quantity beside the counts.
    best_known: The incumbent is the practice of quoting a single identical-prefix versus chosen-prefix
      cost factor with no trend and no error bar, which RQ-SHAONE-081e3a identifies as an inherited
      quantity. Nothing is beaten; a factor is replaced by three measured ratios with intervals and
      a null arm.
    hidden_overhead: Building both pipelines against a shared kernel is substantially more work than
      building either alone, and the shared-kernel constraint is exactly the part a rushed implementation
      would relax -- which would silently void the ratio. Heavy-tailed success costs mean the declared
      50 successes per cell may be too few, and discovering that mid-run is expensive. The largest
      analogue width's cost is hard to predict before the smallest is run.
  dominated_by: 'n/a (no result claimed). Checked across time, memory and data/query axes against
    the only frontier row this repository records for the domain, the UNVERIFIED chosen-prefix figure
    inside RQ-SHAONE-081e3a: this proposal produces no attack on any real primitive and therefore
    no frontier point, so domination in either direction is undefined rather than absent. Stated rather
    than left as null.'
  sota_delta: 'no attack; conceptual/measurement contribution only. Quantitatively: the repository
    currently holds no measured value of R at any width; the deliverable is three values with bootstrap
    intervals, three matched null values, and per-width memory reported separately. There is no speed
    comparison to state because no algorithm is proposed.'
  estimated_cost:
    implementation: high
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: 'Separable parts. (1) That both pipelines can be built against a genuinely
    shared kernel and counter: about 0.5, and this is the part that most determines whether the number
    means anything; a partially shared kernel is the likely compromise and would weaken the result
    substantially. (2) That R is measurable with separating intervals at the smallest width: about
    0.7, given 50 successes and a bootstrap. (3) That R and R_null separate: about 0.6 -- plausible
    but not assured, since the birthday phase dominates both arms. (4) That all three widths complete
    within budget so a trend exists at all: about 0.4, because the largest width''s cost is the least
    predictable quantity in the design. Composite roughly 0.08; the smallest-width ratio with its
    null, which is the minimal test, sits near 0.42.'
