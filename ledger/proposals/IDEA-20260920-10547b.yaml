  predictions:
    - metric: ghs_cover_genus
      direction: different
      minimum_effect: Stated genus or bound for each curve; comparison to the threshold where cover-IC beats rho.
  minimal_test:
    design: Freeze Diem; extract exact hypothesis; compute genus/bound for EcGFp5, EcMasFp5, one isogeny neighbour, and n = 11 control if applicable.
    controls:
      - Isogeny-class neighbour.
      - Parameter point inside Diem's stated safe regime.
    required_metrics:
