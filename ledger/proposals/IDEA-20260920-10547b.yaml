idea:
  id: IDEA-20260920-10547b
  question_id: RQ-GFPN-4ab8c7
  added: '2026-09-20'
  status: proposed
  approved_by: null
  title: >-
    Odd-character GHS cover genus for EcGFp5, EcMasFp5, and isogeny-class
    controls at n = 5
  class: mechanism
  claim: >-
    Both design notes rely on Diem's odd-characteristic GHS analysis (Pornin
    cites Diem and recommends prime extension degree) to dismiss Weil-descent
    covers at n = 5. The paraphrase "n ≥ 11" that appears in some secondary
    notes does not, on its face, cover n = 5. Computing the actual cover genus
    (or the precise Diem bound) for both curves and an isogeny-class neighbour
    decides whether GHS is a live transfer attack at these parameters.
  mechanism: >-
    Freeze Diem's odd-char GHS paper. Instantiate the GHS cover construction
    for the Artin–Schreier / Artin–Schreier–Witt data attached to each curve's
    Weierstrass model over F_{p^5}, compute the genus of the covering curve
    (or the bound Diem proves), and repeat for a random isogeny-class control.
    Compare to the genus threshold where index calculus on the cover beats
    rho on the elliptic curve.
  novelty_status: unverified
  origin:
    kind: user_supplied_idea
    date: '2026-09-20'
    scope: GFPN intake medium priority; token 10547b fixed by user.
    overlap_review: Measurement of a cited theorem's applicability, not a new cover attack.
  citations:
    - ref: inputs/PORNIN-2022-274-ECGFP5/paper_fulltext.md
      provenance: retrieved
      claim: Cites Diem (GHS in odd characteristic) and recommends prime extension degree.
      verified_by: KN-LIT-8aff72
    - ref: research/gfpn_ecmas_ecgfp5_intake_20260920.md
      provenance: internal
