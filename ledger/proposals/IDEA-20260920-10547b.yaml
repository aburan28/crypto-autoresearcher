  citation_note: No GHS genus number is quoted until Diem is frozen and read.
  assumptions:
    - Magma/Sage cover-genus computations are accompanied by reproducible scripts.
    - Isogeny-class control uses a public isogeny of small degree when available.
  proof_search_map:
    bottleneck: Whether Diem's theorem actually rules out GHS at n = 5 for these curves.
    baseline_embedding:
      parameter_slice: Pornin's security argument invoking Diem.
      reproduction_check: Quote the exact Diem statement after freeze before computing.
    observation_collision:
      observable: Cover genus (or Diem's bound) vs elliptic rho cost.
      distinct_preimage_search: Both curves plus isogeny-class neighbour and a known-safe null.
    constructive_transforms:
      - transform: baseline_reproduction
        proposed_object: Exact Diem bound evaluation at n = 5.
        predicted_gain: Either a closure (GHS ruled out) or a live transfer avenue.
    quantifier_order: Freeze Diem before any genus figure enters an evidence record.
    method_ceiling:
      strongest_certifiable_claim: Scoped genus/bound comparison; not a full GHS solve.
      nearby_object_control: Same computation at n = 11 if that is Diem's threshold.
    proof_obligations:
