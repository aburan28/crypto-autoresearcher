  minimal_test:
    design: >-
      STEP 1 (read, zero compute). Read Peikert 2019/725 in full and Kuperberg
      2005 Section 5, recording outcome (a), (b) or (c) above with verbatim
      excerpts. Stop if (a) or (b). STEP 2 (only on (c); arithmetic). Using
