  proof_search_map:
    bottleneck: >-
      The cost of preparing phase states with zero label in all but one CRT
      component, compared with the cost of solving at the full N.
    baseline_embedding:
      parameter_slice: >-
        Prime N (a single CRT component) reproduces the ordinary sieve exactly.
        For CSIDH-512 the baseline is Peikert's c-sieve figure at the actual N.
      reproduction_check: >-
        Reproduce one published Peikert 2019 cost figure at the actual N from its
        own stated switch settings before comparing anything (RQ-CSIDH-64343f's
        "reproduce each published figure FROM ITS OWN SWITCH SETTING").
    observation_collision:
      observable: Concrete query count and quantum memory at fixed N.
      distinct_preimage_search: >-
        Two N with the same bit length and different factorisations (prime N
        versus CSIDH-512's N) under the same sieve model. If the model returns
        the same cost for both, it does not see factorisation, and the switch is
        vacuous for that model.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The label group Z_N written as the direct sum of the Z_{q_i}.
        predicted_gain: >-
          At most the exponent ratio sqrt(log q_max / log N) = 0.723. The
          pre-registered expectation is no gain.
    quantifier_order: >-
      FOR the fixed N of CSIDH-512 and FOR each sieve model in the cost function,
      does the cost depend on N only through log N, or also through the
      factorisation?
    method_ceiling:
      strongest_certifiable_claim: >-
        "Under model X, CSIDH-512's factorisation changes (or does not change)
        the concrete cost by factor f." This is a model-level statement, not a
        security level.
      nearby_object_control: >-
        A prime N of 257 bits under the same model. Any claimed factorisation
        effect must vanish there.
    proof_obligations:
      - claim: CRT projection of labels commutes with the sieve's combine step.
        responsibility: correctness
      - claim: Cost of zeroing the non-target components (the whole question).
        responsibility: runtime
      - claim: Statement confined to the named models and N.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: Peikert 2019 treatment of N's factorisation (read at source)
