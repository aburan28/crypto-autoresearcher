      formulas, compute the cost of a sieve that zeroes the components 3, 37,
      1407181 and q_95 and then solves in Z_{q_135}. Compare with the flat cost
      at N and with the 257-bit prime-N control. No quantum computation.
    controls:
      - 257-bit prime N under the identical model (the effect must vanish)
      - Reproduction of one published Peikert figure from its own settings before any comparison
    required_metrics:
      - verbatim excerpts and page numbers for outcome (a), (b) or (c)
      - per model - flat cost, factorisation-aware cost, prime-N control cost, with switch settings named

  falsification_conditions:
    - >-
      Outcome (a) or (b) at Step 1. The question is already answered in the
      matched baseline, and the record closes as known.
    - >-
      Step 2 returns ratio 1 within model resolution, or a ratio that does not
      vanish on the prime-N control (model artifact). No factorisation switch
