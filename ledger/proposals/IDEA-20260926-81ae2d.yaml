  question_link_note: >-
    RQ-CSIDH-64343f is correct. Its targets are the parameterised cost function
    with named switches ("Kuperberg variant and its parameters") and the
    disagreement kernel. N's factorisation is a candidate switch.
  goal_context: [GOAL-CSIDH-001]
  added: '2026-09-26'
  proposed_by: idea-generator
  status: proposed
  title: >-
    Does CSIDH-512's class-group order factorisation (N = 3 * 37 * 1407181 *
    q_95 * q_135; largest prime factor about 2^134.5 against log2 N about
    257.1) lower any Kuperberg-family sieve's concrete cost below Peikert's
    arbitrary-cyclic-group c-sieve costing at the same N? Cost-only; no
    exponent moves.
  class: measurement

  claim: >-
    CEILING FIRST. Every Kuperberg-family hidden-shift algorithm on Z_N is
    2^{O(sqrt(log N))}. Nothing here changes that form, and nothing here
    adjudicates CSIDH's security level (GOAL-CSIDH-001 forbids a verdict).
    The question is one candidate SWITCH for RQ-CSIDH-64343f's cost function.
    CSIDH-512's class number, independently re-derived and cross-verified in
    KN-FIND-e22186, is
    N = 3 x 37 x 1407181 x 51593604295295867744293584889 x
    31599414504681995853008278745587832204909, with prime-factor sizes of about
    1.6, 5.2, 20.4, 95.4 and 134.5 bits (sum 257.1). Z_N is isomorphic to the
    direct sum of the Z_{q_i}. If a sieve could recover the hidden shift s
    componentwise, the cost would be governed by the largest factor, about
    2^134.5, rather than by N, about 2^257. Under 2^{c sqrt(log2 N)} that is
    sqrt(134.5)/sqrt(257.1) = 0.723 of the exponent, a concrete and
    decision-relevant difference. The PRE-REGISTERED EXPECTATION IS NO. In a
    Kuperberg-type sieve, the phase-state labels k in Z_N are combined
    additively. Isolating one CRT component requires sieving the other
    components to zero, whose cost depends on their sizes too. Kuperberg 2005's
    own general-N patch (N = 2^a M with automorphism relabelling, cited in
    KN-FIND-e22186) handles non-power-of-2 N without, as recalled, a
    largest-factor bound. Peikert 2019 already treats arbitrary cyclic N at the
    actual order. So the likely answer is "already accounted for, no gain", and
    the first test is a READ.
  mechanism: >-
    Tracked object: the CRT decomposition of the phase-state label group Z_N
    inside a collimation or Kuperberg sieve. Operation set: label addition and
    subtraction in Z_N, the sieve's combine step, and the CRT projection to each
    Z_{q_i}. TRICHOTOMY: not applicable in the ECDLP sense. This is a
    quantum-algorithm cost question about a cyclic group of known
    factorisation. LOSSY-PROJECTION TEST: projecting labels to one component
    Z_{q_i} is lossy. It is compatible with label addition, since CRT is a ring
    isomorphism, so component labels propagate deterministically under the
    combine step. The test is passed. The open quantity is the cost of producing
    states whose OTHER components are zero, which is where any gain would be
    eaten.
