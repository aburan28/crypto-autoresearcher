idea:
  id: IDEA-20261018-48eabc
  question_id: RQ-RELN-61638a
  added: '2026-10-18'
  status: proposed
  proposed_by: idea-generator
  title: >-
    Guess, then prove: holonomic (P-recursive) guessing as a second symbolic-regression
    engine for count-vector laws, with a degrees-of-freedom-matched failure certificate
  class: tooling
  claim: >-
    (a) The one open Stage-0c control of EXP-RELN-141a86, INV-7 p_exist =
    1 - C(n-B,B)/C(n,B), blocked at 12 to 14 hours of level-9 enumeration
    (EV-RELN-ed92ff), is recovered as a recurrence of order <=2 and degree <=4 in
    (n,B) from <=40 exact terms in under 60 s. Hand-derived anchor: f=C(n-B,B)/C(n,B)
    obeys (n-B)^2 f(B+1) = (n-2B)(n-2B-1) f(B). (b) For Z/N interval bases the
    exact E_m(B) = sum_r c(r)^2 (m=2,3, no wraparound) is a quasi-polynomial in B
    (degree 2m-1, period dividing 6, to be confirmed by the guess) and is recovered
    from <=40 terms. (c) For nested x-windows on prime-order E and for matched random
    bases, the increment sequence d_B = E_2(D_B) minus its proved random-law mean has
    NO recurrence with (r+1)(d+1) <= (L-r)/2 at L=200, certified by a trivial
    nullspace mod two primes. ALTERNATIVE: a nonzero recurrence on E, a structural
    law with a built-in proof route.
  mechanism: >-
    Object: the annihilating ideal of an exact integer or rational sequence in the
    Ore algebra of shifts, found by linear algebra (nullspace of a Hankel-type matrix
    with polynomial-coefficient unknowns). Lossy-projection test: the sequence of
    counts becomes (r,d) plus coefficient vector; every D-finite closed form
    projects to it and survives shifts, and the discard (initial values) is
    restored by r checked terms. Class: not a group-operation object (a tooling
    instrument, coordinate-dependent only through the data). It replaces
    expression-tree enumeration, whose cost explodes with node count, by cost
    polynomial in (r,d). A recovered recurrence is a proof obligation that is
    discharged by a ratio identity (hypergeometric) or induction with checked
    initial values, so the user's gold standard is met cheaply for the laws that exist.
    Honest ceiling: E x-line counts are Poisson-like and expected to have no law.
  novelty_status: unverified
  citations:
    - ref: EV-RELN-ed92ff
      provenance: internal
      claim: four of five recovery controls pass by targeted minimality; p_exist open by resource exhaustion at level 9
      verified_by: idea-generator this session, file read
    - ref: IDEA-20260906-1f6bfe
      provenance: internal
      claim: grammar search plus PySR over summary tables with recovery controls INV-1, INV-7, INV-8
      verified_by: idea-generator this session, lines 1-90 read
    - ref: IDEA-20260906-86cd30
      provenance: internal
      claim: m=2 exact random-base law 1 - C(n-B,B)/C(n,B)
      verified_by: restated in 1f6bfe, record not opened
    - ref: Petkovsek, Wilf, Zeilberger, A=B, 1996; Kauers, Guessing Handbook, RISC 2009
      provenance: recalled
      claim: hypergeometric and D-finite guessing and certificate-based proof
      verified_by: null
  assumptions:
    - Exact arithmetic over Q or mod two 61-bit primes; data from the sibling enumerator.
    - The d_reg control (INV-8) is a quasi-linear sequence in B and is recovered too.
  predictions:
    - metric: wall time to recover INV-7 p_exist by guessing
      direction: lower
      minimum_effect: under 60 s versus 12 to 14 h; recurrence matches the hand-derived ratio
    - metric: nullspace dimension for Z/N interval E_m(B) at the minimal (r,d)
      direction: higher
      minimum_effect: at least 1, predicting a held-out tail of 30 terms exactly
    - metric: nullspace dimension for E x-window increments and random bases at unknowns <= (L-r)/2
      direction: lower
      minimum_effect: exactly 0 in every (r,d) cell; i.i.d. Poisson control also 0
  minimal_test:
    design: >-
      Guess INV-1, INV-7 (both), INV-8, then Z/N interval and Bose-Chowla E_2, E_3
      (positive), then E windows and random bases (the open arm). Fit on L1 terms,
      predict T=30 further terms exactly. Report (r,d,unknowns,equations) for every
      cell. Dof control: an i.i.d. integer sequence must show a nonzero nullspace
      once (r+1)(d+1) >= L-r and zero below (L-r)/2.
    controls:
      - i.i.d. Poisson integer sequence of equal length (dimension-matched null)
      - Z/N interval and Bose-Chowla as known-structure positives
      - same code mod two different primes
    required_metrics: [order r, degree d, unknowns, equations, nullspace dimension, held-out exact match, seconds]
  falsification_conditions:
    - INV-7 p_exist not recovered at (2,4) refutes the engine for hypergeometric laws.
    - A nonzero nullspace on the i.i.d. control below (L-r)/2 unknowns means a bug.
    - A recurrence on E windows that also predicts the held-out tail is a structure candidate to prove.
  confounders:
    - Wraparound at B > N/3 breaks the Z/N polynomial law; the window sequence mixes a polynomial part with noise unless the proved mean is subtracted exactly.
  interpretation_limits:
    - A trivial nullspace closes only orders and degrees up to (r,d) at length L. Toy scale. No ECDLP claim.
  heuristic_assumptions:
    - id: H1
      statement: A random integer sequence of length L admits a nonzero (r,d) recurrence only when (r+1)(d+1) > L-r.
      rigorous_support: Rank of a generic matrix of that shape (exact linear algebra); imitates counting of unknowns against equations.
      validation_plan: 100 i.i.d. Poisson sequences at L=200 over a grid of (r,d); fraction with nonzero nullspace against the predicted threshold.
  target_complexity:
    time_exponent: no ECDLP algorithm; guessing costs O(((r+1)(d+1))^3) field operations
    memory_exponent: O(((r+1)(d+1))^2) toy
    best_known: p^(1/2) Pollard rho; the instrument moves no exponent
    hidden_overhead: none; closed forms of cost-relevant exponents are not claimed
    tradeoff_note: not applicable
  dominated_by: n/a (no result claimed)
  sota_delta: zero on every ECDLP axis; unblocks Stage 1 of EXP-RELN-141a86 if (a) holds
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
