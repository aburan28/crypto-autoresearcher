idea:
  id: IDEA-20260807-a27828
  question_id: RQ-AES-003
  added: '2026-08-07'
  title: >-
    Domination predictor: the measured margin function D(h), calibrated on
    this repository's own committed r=6 domination point, with the sub-h=12
    region recorded OUT OF ENVELOPE / DEFERRED_UNBOUNDED (A3-3, surviving
    arm after A3-10 was red-team-killed per INDEX.md ⚑7)
  class: control

  claim: >-
    Formalization of catalogue entry A3-3 (ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/A3.md,
    lines 320-390). Per INDEX.md section 2a row ⚑7, A3-3 absorbed A3-10's
    domination arm after the red team's K-9 finding (REDTEAM.md section 4c
    excerpt) that A3-10's "anytime-progress axis" was forced by the source
    code's return structure (not measured) and dominant only over a
    negligible fraction (2^-86) of the key space; A3-3 is the surviving arm
    and A3-10's killed content is NOT resurrected here. Tracks
    D(h) = log2(measured seconds of exhaustive search over the residual key
    space left by the hinted r=6 partial-sums construction given h hint
    bytes) - log2(measured seconds of the structured attack itself), for
    h in {12,...,15}. This repository holds exactly one anecdotal datum on
    this axis (EV-AES-005 / EV-AES-d33b1c OBS-B2-1: 69.39s dominated by
    ~25s at h=12). Pre-registered prediction: D(h) is strictly decreasing in
    h; D(12) < 0 reproducing the committed point within run-to-run variance;
    any zero crossing h* lies BELOW the measurable window, so D(h) < 0 for
    every h in {12,...,15} and the region h <= 11 is recorded OUT OF ENVELOPE
    / DEFERRED_UNBOUNDED rather than estimated — that discipline (a monotone
    measured curve plus an explicit bounded unmeasurable region) is the
    entry's deliverable, carried verbatim into this specification's
    scale_relevance and stopping_rules.

  mechanism: >-
    See A3.md lines 328-390 for the full mechanism (monotonicity argument:
    increasing h shrinks the residual, helping brute force at 2^-8 per byte,
    while helping the structured arm at most linearly) and the charged cost
    (4 values of h x 3 instances x 2 arms, ~35 min single core, plus a
    falsified-hint control and an r=5 unhinted-domination decoy control,
    ~20 min; structured arm ~70s/instance measured, brute-force arm at h=12
    ~57s single core re-measured in one binary, NOT the committed ~25s
    figure, with the discrepancy itself charged as a reason to re-measure
    both arms together rather than compare across records).

  novelty_status: unverified

  source_refs:
    - ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/A3.md (A3-3, lines 320-390)
    - ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/INDEX.md (section 2a, row ⚑7)
    - ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/REDTEAM.md (section 4c; K-9 finding on A3-10, lines 128-135)
    - ledger/goals/GOAL-AES-003.yaml (BATCH-001 checkpoint, r=6 domination outcome)
    - ledger/questions/RQ-AES-003.yaml
    - ledger/hypotheses/H-AES-d6405d.yaml (the r=6/r=7 construction this proposal extends; asserts no status change to it)

  review_refs: []
  disposition: proposed

  interpretation_limits:
    - >-
      Ceiling medium: a claim about the measured cost of two constructions on
      this machine, with the AES-facing part capped at toy and no full-round
      transcription. Risk band conservative.
    - >-
      OUT OF ENVELOPE / DEFERRED_UNBOUNDED region below h=11 is a NAMED,
      BOUNDED unmeasurable region, never estimated into a result and never
      silently dropped — carried into the specification verbatim.
    - >-
      No status change to EV-AES-005, EV-AES-d33b1c, EV-AES-d8a13e or any
      prior AES-003 decision is proposed or implied. The r=6 mode remains
      DOMINATED and r=7 remains not a key recovery, independent of outcome.
    - >-
      No comparison to published cryptanalysis in either direction (RQ-AES-003
      R3); the only comparison is between two constructions built and
      measured in this repository.

  recorded_by: coordinator
  recorded_at: '2026-08-07'
