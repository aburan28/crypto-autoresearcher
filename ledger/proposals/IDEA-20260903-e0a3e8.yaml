        value bounded away from 1 for some j would mean the e-box is not
        tight and (T2) must be restated with the true image box.
    - metric: >-
        P2 -- the ceiling 2/(m+1) against m/(2(m-1)) for m = 3..12
      direction: lower
      minimum_effect: >-
        Strictly below at every m (0.5 / 0.75, 0.4 / 0.667, 0.333 / 0.625,
        0.286 / 0.6, ...); exact rationals, zero tolerance.
    - metric: >-
        P3 -- Jochemsz-May basic-strategy eps_e for the symmetrized S_4 in
        (e_1, e_2, e_3), Stage 0
      direction: lower
      minimum_effect: >-
        Predicted below 1/2 (reach near 1/degree with total e-degree 4),
        hence eps_eff below 1/4 against the threshold 3/4. An eps_e above
        1/2 would be surprising and reportable but still closed at the
        ceiling; only an eps_e above 1 (impossible by the modulus bound)
        could reopen m = 3.
    - metric: >-
        P4 -- toy recovery exponent in e-coordinates at m = 3, p about
        2^24, planted windowed decomposition (Stage 2, proposed only)
      direction: lower
      minimum_effect: >-
        Recovered B^3/p at most p^{1/2} in eps_eff units, i.e. never above
        the ceiling; a recovery above 1/2 + 0.05, persisting at two p and
        absent on the scrambled-window null, falsifies the box model.

  minimal_test:
    design: >-
      THE CHEAPEST VALID DISCRIMINATOR IS STAGE 0 (i)-(ii): the tightness
      of the e-box and the inequality m^2 - 3m + 4 > 0, a half page, which
      closes full symmetrization at every m without any lattice
      computation. Stage 0 (iii)-(iv) adds the symmetrized S_4 exponents
      and the block table, an afternoon of algebra. Stage 1 is the u = x^3
      arithmetic. Stage 2 is a proposed toy lattice test of the box model
      only, not run this round (maximum_runs 0), and is worth running only
      if a reviewer disputes the box model of (T2).
    controls:
      - extension-field subring case must return no obstruction (blocking at derivation level)
      - c = 1 slice must reproduce 486ae2's eps (baseline embedding)
      - random-polytope null and scrambled-window null inherited from 486ae2 for any Stage 2 run
      - u = x^3 nearby object must come out closed by the same arithmetic (eps_eff = eps/3)
      - the block table must show c = 2, m >= 5 as the only cell above threshold at the ceiling
    required_metrics:
      - 'the e-box tightness ratio per (m, j) at B in {2^8, 2^12, 2^16}'
      - 'the table (m, ceiling 2/(m+1), threshold m/(2(m-1))) for m = 3..12'
      - 'Jochemsz-May s_j, s_p, eps_e and eps_eff for the symmetrized S_4'
      - 'the block table eps_eff(m, c) ceilings and required block reach for c in {1, 2, 3}, m in {3..8}'
      - 'if Stage 2 runs, recovered B^m/p per D, p, arm, with the ceiling drawn'

  falsification_conditions:
    - >-
      F1. The e-box is not tight (P1 fails). (T2) is restated with the
      image box; the closure survives iff the corrected exponent still
      exceeds m.
    - >-
      F2. A polynomial S_m-invariant coordinate system with a bound o(B^j)
      in degree j on the box is exhibited. (T4) is wrong; impossible by
      homogeneity, listed so it is checked.
    - >-
      F3. A small-root certificate over a non-box region containing the
      image e([0,B)^m) with volume near B^m is exhibited. The box model is
      wrong and the family reopens with that method as the new ingredient;
      this is the forward-guidance class.
    - >-
      F4. The extension-field control returns an obstruction. The
      derivation is measuring the wrong thing and is withdrawn.
    - >-
      F5. Everything holds (expected). Full symmetrization and blocks of
      size >= 3 composed with windows are closed at the information ceiling
      with the obstruction named (degree sequence of the invariant ring);
      pair blocks at m >= 5 remain open with the required reach 0.9375.

  confounders:
    - >-
      The constant c_m = prod C(m,j) is not negligible at small B and can
      make toy measurements look worse than the ceiling; the ceiling is
      asymptotic in B.
    - >-
      Root extraction from the lattice output can fail inside the bound
      (486ae2's algebraic-independence confounder); Stage 2 must separate
      bound failure from extraction failure.
    - >-
      The Jochemsz-May condition in (T3) is stated from recollection; the
      closure does not depend on it, but P3's number does, and the local
      PDF must be opened before P3 is reported.
    - >-
      Signed windows (-B, B) versus [0, B) change constants only.

