idea:
  id: IDEA-20260903-e0a3e8
  question_id: RQ-PFDR-ae2fba
  handoff_id: TASK-20260903-22c36b
  added: '2026-09-03'
  title: >-
    SYMMETRIZATION AND SMALLNESS DO NOT COMPOSE, AND THE OBSTRUCTION IS THE
    DEGREE SEQUENCE OF THE INVARIANT RING: the image of the window box
    [0,B)^m under the elementary symmetric map fills a box of volume
    prod_j C(m,j) B^j = c_m B^{m(m+1)/2} tightly, so any box-bounded
    small-root method in symmetric coordinates has effective reach
    eps_eff <= 2 eps_e/(m+1) <= 2/(m+1), which is below 486ae2's rho
    threshold m/(2(m-1)) for EVERY m >= 2 -- a closure at the information
    ceiling, independent of the Jochemsz-May exponents; no polynomial
    S_m-invariant coordinate of degree j is o(B^j) on the box (the minimal
    generating degrees of F[x]^{S_m} are 1..m), the j = 0 coordinate u = x^3
    inflates the box by B^2 per variable for the same reason, and the only
    cell the ceiling leaves open is pairwise (block size 2) symmetrization at
    m >= 5, which needs a block reach eps_e >= 0.9375
  class: composition

  claim: >-
    Setting as in IDEA-20260808-486ae2: E/F_p, window W = [0, B) on the
    x-line, factor base V = {R : x(R) in W}, decomposition unknowns
    x_1, ..., x_m with |x_k| < B, the system S_{m+1}(x_1, ..., x_m, x_R) = 0
    mod p (one equation) or a windowed tree of S_3's, solved by a
    Coppersmith / Howgrave-Graham / Jochemsz-May small-root method whose
    reach eps is defined by 'all roots inside a box of volume p^{eps} per
    equation are certifiably returned'. 486ae2 derives that windowed index
    calculus beats rho iff eps > m/(2(m-1)). Symmetrization (KN-LIT-004;
    IDEA-20260807-1ea327; H002 of the h100 ledger, recalled) rewrites
    S_{m+1}, which is symmetric in x_1..x_m, as a polynomial Sigma(e_1, ...,
    e_m, x_R) in the elementary symmetric functions, lowering the per-orbit
    solution count by m! and the total e-degree to at most 2^{m-1}.
    (T1) THE e-BOX IS TIGHT. On the box [0, B)^m, |e_j| <= C(m, j) B^j, with
    equality approached at x_1 = ... = x_m = B - 1; on the signed box
    (-B, B)^m the same bound holds and is approached. The smallest
    axis-parallel box containing the image e([0,B)^m) therefore has volume
    prod_j C(m,j) B^j = c_m B^{m(m+1)/2}, c_m = prod_j C(m,j) (c_3 = 9,
    c_4 = 96), against the source box volume B^m. The image itself has
    measure about B^m / m! -- it is a thin curved subset of its bounding
    box, of relative volume B^{-m(m-1)/2} m!^{-1} c_m^{-1}.
    (T2) THE INFORMATION CEILING. A box-bounded small-root method with
    reach eps_e in e-coordinates certifies all roots in a box of volume
    p^{eps_e}; applied to the e-box of (T1) this requires
    c_m B^{m(m+1)/2} <= p^{eps_e}, i.e. B^m <= p^{2 eps_e/(m+1)} up to the
    constant. So the EFFECTIVE reach in the units of 486ae2 is
    eps_eff = 2 eps_e/(m+1). Since Howgrave-Graham reach never exceeds the
    modulus (eps_e <= 1 for one equation), eps_eff <= 2/(m+1). The rho
    threshold is m/(2(m-1)); 2/(m+1) > m/(2(m-1)) iff m^2 - 3m + 4 < 0,
    which has no real solution. Hence for EVERY m the fully symmetrized
    window is closed at the information ceiling: m = 3 gives 0.5 against
    0.75, m = 4 gives 0.4 against 0.667, m = 5 gives 0.333 against 0.625,
    m -> infinity gives 0 against 0.5. This closure does not use any
    Jochemsz-May exponent; it uses only that the method's certificate is
    over a box.
    (T3) THE JOCHEMSZ-MAY CONDITION, STATED SO THE CLOSURE CAN BE SEEN IN
    IT. In the basic modular strategy (recalled; KN-LIT-2244 read at
    abstract level), with monomial sets M_k of f^k and shift polynomials
    x^i f^k p^{t-k}, the determinant condition is prod_j X_j^{s_j} < p^{s_p}
    with s_j = sum_{x^i in M_t} i_j and s_p a sum of modulus powers over the
    shifts. Substituting the e-bounds X_j = C(m,j) B^j gives
    B^{sum_j j s_j} < p^{s_p} c', i.e. B < p^{s_p / sum_j j s_j}; the
    exponent sum_j j s_j is the WEIGHTED degree sum of the shift monomials
    under deg e_j = j, which is the x-degree sum of the corresponding
    symmetric monomials. So the symmetrized condition is the unsymmetrized
    condition with the shift set restricted to symmetric monomials and the
    box exponent weighted by j: the degree drop (fewer shifts, smaller s_p)
    and the box inflation (weights j) enter the SAME exponent with opposite
    signs, and (T2) says the net can never reach the threshold. The exact
    Jochemsz-May value of eps_e for the symmetrized S_4 is a Stage 0
    obligation and is predicted below 1/2 by the reach-near-1/degree
    heuristic 486ae2 records; the closure does not depend on it.
    (T4) WHY THERE IS NO SMALL SYMMETRIC COORDINATE. Any polynomial
    coordinate system on the quotient A^m / S_m is a generating set of the
    invariant ring F[x_1..x_m]^{S_m} = F[e_1, ..., e_m] (fundamental theorem
    of symmetric polynomials, recalled), and every minimal homogeneous
    generating set has degrees exactly 1, ..., m. A nonzero homogeneous
    symmetric polynomial of degree j attains size of order B^j on the box
    (it cannot vanish on the cone spanned by the box), so every polynomial
    invariant coordinate of degree j is of size B^j there, and the product
    of bounds over any generating set is at least of order B^{m(m+1)/2}.
    Power sums p_j = sum x_k^j (|p_j| <= m B^j) and complete symmetric
    functions give the same exponent. The NON-polynomial fundamental domain
    x_(1) <= ... <= x_(m) (the sorted tuple) keeps every coordinate below B
    and the box at B^m, but restricting S_{m+1} to it changes neither the
    polynomial nor its degree, so nothing is gained on the degree side: the
    two quantities the composition wants -- lower degree and small box --
    are exchanged one for the other, never held together.
    (T5) THE NEARBY OBJECT u = x^3 IS NOT A SMALL COORDINATE, AND WHY.
    IDEA-20260807-1ea327's mu_3-invariant coordinate u = x^3 (j = 0 curves)
    lowers the membership degree by 3 and inflates deg S_3 to a norm of
    bidegree (6,6). For a window |x| < B it maps the box to |u| < B^3 (no
    wrap when B^3 < p), a box inflation of B^2 per variable, so the
    product of bounds goes from B^m to B^{3m}: effective reach eps_eff =
    eps_u / 3 <= 1/3, below the threshold m/(2(m-1)) for every m (the
    threshold exceeds 1/2). The same degree-sequence reason applies: the
    invariant ring of a scalar action of order r is generated in degree r.
    Composition with a window is closed for every finite-group invariant
    coordinate of degree above 1, for the same reason and with the same
    arithmetic (eps_eff = eps / r).
    (T6) THE ONE CELL THE CEILING LEAVES OPEN, STATED HONESTLY. Partial
    symmetrization in blocks of c leaves (e.g. the two leaves of each S_3
    node in a windowed tree, c = 2) inflates the box exponent from m to
    m(c+1)/2, so eps_eff = 2 eps_e/(c+1) <= 2/(c+1). Against m/(2(m-1)):
    c = 2 gives ceiling 2/3, which exceeds the threshold iff m > 4, i.e.
    the band is non-empty at the ceiling for m >= 5, requiring block reach
    eps_e > (3/2) m/(2(m-1)) = 0.9375 at m = 5, 0.9 at m = 6, 0.75 as
    m -> infinity; c = 3 gives ceiling 1/2 which never exceeds the
    threshold; c = 1 is no symmetrization. So the composed feasibility band
    -- the analogue of 486ae2's eps(m, tree) -- is: EMPTY for full
    symmetrization at every m and for blocks of size >= 3 at every m;
    NON-EMPTY at the ceiling for pair blocks at m >= 5 only, and there it
    demands a block reach above 0.9, against a reach that 486ae2's own
    heuristic puts near 1/deg = 1/16 for the m = 5 system. The band is not
    empty by arithmetic; it is empty by a factor of about 15 in reach under
    the only reach heuristic this program records, and that factor is the
    number a lattice implementation would have to overturn.

  mechanism: >-
    TRACKED OBJECT AND LOSSY-PROJECTION TEST. The object is the S_m-orbit
    of the decomposition tuple, represented by e = (e_1, ..., e_m). It is
    genuinely lossy (the ordering is discarded, fibre of size m!), and the
    discard is compatible with the target's operation S_{m+1} = 0, which is
    S_m-invariant, so the retained part propagates exactly (Sigma(e) = 0
    iff some ordering decomposes). That is why symmetrization is a
    legitimate object for the SOLVER. The record's content is that the
    discard is NOT compatible with the second operation the windowed
    family relies on -- the smallness certificate -- because the image of a
    small tuple under e is not small in the sense a box-bounded method can
    use: the projection loses the ordering but keeps, and inflates, the
    magnitude. In the language of docs/inventor-protocol.md section 2, e
    is a lossy projection for the algebra and a lossless-but-inflating
    change of coordinates for the archimedean structure, and the windowed
    family needs both at once.
    WHY THIS IS THE RIGHT CONTROL SETTING. The extension-field
    symmetrization of KN-LIT-004 composes with membership because the
    membership set F_q is a SUBRING: e_j of elements of F_q lies in F_q,
    so the membership constraint survives the quotient at degree 1 per
    variable. The window [0, B) is closed under e_j only up to size B^j; it
    is not a ring. This is the archimedean form of catalogue A1-11's
    restriction-of-scalars disanalogy and of 84cdb7 claim C, and it is the
    reason the derivation must NOT conclude that KN-LIT-004's method fails
    over F_{q^n} -- it does not, and (T2) applied there gives no bound
    because there is no box.
    STAGES. STAGE 0 (zero compute): (i) verify (T1) by evaluating e_j at
    x_k = B - 1 for m in {3, 4, 5}; (ii) derive (T2) and the inequality
    m^2 - 3m + 4 > 0; (iii) compute the Jochemsz-May basic-strategy
    exponents s_j, s_p for the symmetrized S_4 (m = 3) in (e_1, e_2, e_3)
    with the monomial set read off the symmetrized polynomial, and report
    eps_e and eps_eff = eps_e / 2 beside the threshold 0.75; (iv) the block
    table of (T6). STAGE 1 (zero compute): the u = x^3 arithmetic of (T5)
    and the r-general statement. STAGE 2 (toy, proposed only, maximum_runs
    0 this round): plant a windowed 3-decomposition at p about 2^24, build
    the shift lattice in e-coordinates with the e-box bounds, and measure
    the largest B^3/p at which the planted root is recovered, against the
    ceiling 1/2 in eps_eff units and against the unsymmetrized instrument
    of 486ae2 / e2315e on the same instance. A recovery above the ceiling
    would falsify the box model of (T2), which is the single load-bearing
    modelling step.

