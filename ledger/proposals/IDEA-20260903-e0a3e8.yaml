  assumptions:
    - >-
      The small-root method certifies completeness over an axis-parallel
      box (after coordinate rescaling); weighted norms rescale coordinates
      and do not change the box shape. This is the load-bearing modelling
      step and is the one Stage 2 tests.
    - >-
      Reach per equation is at most 1 (the Howgrave-Graham product bound
      cannot exceed the modulus power available); for k equations at most
      k in 486ae2's per-equation units.
    - >-
      The window is [0, B) or (-B, B); a rank-r GAP (c31f1c) is an affine
      image of a box and inherits the same inflation after the affine
      change.

  proof_search_map:
    bottleneck: >-
      Whether the two known prime-field degree levers -- symmetric or
      invariant coordinates (lower degree) and archimedean windows (small
      box) -- can be held simultaneously. (T2) says no at the ceiling for
      full symmetrization, (T6) says only pair blocks at m >= 5 survive the
      ceiling.
    baseline_embedding:
      parameter_slice: >-
        Block size c = 1 (no symmetrization) reproduces 486ae2's
        eps_eff = eps exactly; r = 1 in (T5) reproduces the unsymmetrized
        window; the extension-field subring case reproduces KN-LIT-004's
        composability because there is no box.
      reproduction_check: >-
        Symbolic: set c = 1 in eps_eff = 2 eps_e/(c+1) and recover eps;
        set B^j bounds to 'membership in F_q' and observe (T2) gives no
        constraint. Frozen: the m = 3 unsymmetrized Jochemsz-May exponents
        of 486ae2's Stage 0, if computed, must be reproduced by the same
        routine before the symmetrized ones are read.
    observation_collision:
      observable: >-
        eps_eff, the effective reach in B^m units, per (m, c).
      distinct_preimage_search: >-
        REQUIRED: the random polynomial with the same Newton polytope as
        the symmetrized S_{m+1} in e-coordinates must give the same eps_e
        (486ae2's null-curve control carried over); if it does, eps_e is a
        polytope invariant and the closure is about polytopes and boxes, not
        curves -- the expected and harmless collision. The collision that
        would matter: an instrument in e-coordinates recovering roots beyond
        the e-box ceiling, which would mean the method uses the image's
        shape and (T2)'s box model is wrong.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the polynomial system fixed and vary the coordinate: x,
          e, p (power sums), sorted tuple, u = x^r. The intrinsic invariant
          separating them is the degree sequence of the coordinate system
          against the box exponent it induces.
        predicted_gain: >-
          A single table (degree drop, box exponent, ceiling) per
          coordinate, replacing case-by-case intuition.
      - transform: specialization_pack
        proposed_object: >-
          The block-symmetrization resource measure eps_eff(m, c) =
          2 eps_e / (c+1), with charges added over disjoint blocks.
        predicted_gain: >-
          Locates the only non-empty cell (c = 2, m >= 5) and its required
          reach 0.9375.
    quantifier_order: >-
      CLAIMED: FOR ALL m >= 2, FOR ALL box-bounded small-root methods, FOR
      ALL polynomial S_m-invariant coordinate systems, eps_eff <= 2/(m+1) <
      m/(2(m-1)). FOR ALL m and FOR ALL block sizes c >= 3, eps_eff <=
      2/(c+1) <= 1/2 < m/(2(m-1)). NOT CLAIMED: anything about non-box
      certificates; the c = 2, m >= 5 cell is EXISTS-shaped (there exists a
      reach above 0.9375) and is left open with its number.
    method_ceiling:
      strongest_certifiable_claim: >-
        A derivation-level closure of full and c >= 3 block symmetrization
        composed with archimedean windows, plus a numerical target (block
        reach 0.9375 at m = 5) for the surviving cell. It cannot certify
        that no non-box small-root certificate exists.
      nearby_object_control: >-
        The extension-field subring membership (KN-LIT-004), where the
        composition is KNOWN to work: the derivation must and does return no
        obstruction there, because e_j of subring elements stays in the
        subring and no box is involved. A derivation that closed that case
        too would be measuring the wrong thing.
    proof_obligations:
      - claim: >-
          The e-box bound C(m,j) B^j is tight on the box.
        responsibility: size
      - claim: >-
          eps_eff = 2 eps_e/(m+1) and eps_e <= 1.
        responsibility: correctness
      - claim: >-
          m^2 - 3m + 4 > 0 for all real m, so 2/(m+1) < m/(2(m-1)) for all
          m > 1.
        responsibility: strictness
      - claim: >-
          Minimal generating degrees of F[x]^{S_m} are 1..m and a nonzero
          homogeneous degree-j invariant is of order B^j on the box.
        responsibility: correctness
      - claim: >-
          c = 1 reproduces 486ae2 and the subring case reproduces KN-LIT-004.
        responsibility: baseline
      - claim: >-
          The block table of (T6) is as stated and the c = 2 cell is left
          open.
        responsibility: scope
    not_applicable_reason: null

