  heuristic_assumptions:
    - id: H1
      statement: >-
        BOX-BOUNDED CERTIFICATES: every Coppersmith-type method whose
        completeness rests on the Howgrave-Graham lemma certifies roots
        over an axis-parallel box in its working coordinates, after at most
        a diagonal rescaling, and its reach per equation is at most 1.
      rigorous_support: >-
        RIGOROUS: the Howgrave-Graham lemma bounds a weighted norm, which
        is a box condition on the monomial vector after rescaling; the
        modulus bound is the determinant condition's ceiling. CLASSICAL
        STATEMENT IMITATED: the univariate reach 1/d and its saturation
        (e2315e's instrument control). The heuristic content is that no
        variant escapes the box shape; that is the one modelling step, and
        F3 names its failure.
      validation_plan: >-
        SAMPLE: the toy Stage 2 sweep at p about 2^24, m = 3, planted
        roots, D in {20, 40, 80, 160}, in e-coordinates with e-box bounds
        and in x-coordinates. COMPARISON: recovered B^3/p against the
        ceiling p^{1/2}. TAIL CHECK: the largest recovered B^3/p over all D
        and seeds, against the ceiling; and the same on the scrambled
        window, which must fail. TRANSFER: none; toy scale, one system
        shape.
    - id: H2
      statement: >-
        REACH NEAR 1/DEGREE: the Jochemsz-May reach of the symmetrized
        system is at most a constant times the reciprocal of its total
        e-degree, so the block reach at m = 5 (degree 16) is far below
        0.9375.
      rigorous_support: >-
        RIGOROUS: none beyond the univariate 1/d; this is 486ae2's HA and
        its 'reach near 1/deg' prediction, adopted and labelled. CLASSICAL
        STATEMENT IMITATED: Coppersmith's univariate bound N^{1/d}.
      validation_plan: >-
        SAMPLE: Stage 0 (iii)'s exact Jochemsz-May exponents for the
        symmetrized S_4 and, if feasible symbolically, the pair-blocked S_6
        at m = 5. COMPARISON: eps_e against 1/degree. TAIL CHECK: if the
        exact exponent exceeds 2/degree, H2 is weakened and the required
        reach 0.9375 must be compared with the exact value rather than the
        heuristic. TRANSFER: none.

