idea:
  id: IDEA-20260809-86ac51
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-CLGRP-66ab7f
  goal_id: GOAL-CLGRP-001
  title: >-
    The extrapolation interval is the result: report how uncertain the deployed
    size's security estimate actually is under two fit forms
  class: measurement
  claim: >-
    Extrapolating a measured curve from reachable discriminants to deployed ones
    spans a large gap, and the honest output is an interval rather than a point.
    The claim is that the interval is wide — plausibly wider than the differences
    that separate competing parameter recommendations — and that its width is
    stable enough across reasonable fit forms to be reported as the goal's
    headline result.
  mechanism: >-
    Fit at least two model forms to the measured sweep, propagate parameter
    uncertainty to the deployed size, and report both intervals along with the
    number of orders of magnitude of extrapolation involved.
  why_not_a_renamed_known_approach: >-
    Extrapolation with intervals is standard statistics. Making the INTERVAL the
    headline rather than the point estimate is a reporting decision with real
    consequences, and it is the opposite of the field's usual practice of quoting
    a bit level.
  predictions:
  - observable: interval width at deployed discriminant size
    metric: bits, per fit form
    predicted: Wide. A narrow interval would be a strong positive result for the current parameter practice and is equally worth recording.
  - observable: agreement between fit forms
    metric: overlap of the two intervals
    predicted: Substantial overlap; disjoint intervals would mean the conclusion depends on the fit form and the honest output becomes the disagreement itself.
  minimal_test: >-
    Two fit forms over the certified sweep, intervals propagated, both reported
    with the extrapolation distance stated in orders of magnitude.
  controls:
  - 'FIT-FORM PRE-DECLARATION: both forms are declared before fitting, since choosing a form after seeing the residuals is fitting to taste.'
  - 'EXTRAPOLATION-DISTANCE DISCLOSURE: the record states plainly how far beyond the data the estimate reaches, in the same sentence as the interval.'
  falsification_conditions:
  - The two intervals are disjoint, in which case no single interval may be reported.
  - Parameter uncertainty cannot be propagated because the sweep is too short, which is reported rather than approximated.
  interpretation_limits: >-
    An interval computed from five or six points extrapolated across many orders
    of magnitude is a weak inference. The record presents it as one, and the
    interval is not a security verdict about any deployed parameter.
  sota_delta: 'No attack. Delta: a stated uncertainty attached to a number normally quoted bare.'
  dominated_by: Downstream of IDEA-20260809-843eb6; not dominated by any corpus record.
  estimated_cost: Implementation small; compute negligible.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for extrapolation interval: parallel record exists in GOAL-PAIR-001 for a different curve. WEB NOT CHECKED.'
  source_refs:
  - Class group algorithm complexity statements -- RECALLED, REQUIRED READS.
