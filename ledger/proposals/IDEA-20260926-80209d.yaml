        readings are recorded.
    - metric: >-
        threefold row and genus-3 Jacobian column
      direction: different
      minimum_effect: >-
        No prediction; computed exactly.

  minimal_test:
    design: >-
      Zero-run except the enumeration itself. toy_ladder.py over n in {17,
      19, 23, 29, 31, 37, 41, 131} producing the JSON table; g <= 3 for all
      eight, g = 4 optional. Cell: no curve arithmetic on any ECDLP instance;
      the genus-2/3 enumeration is over F_2, F_4, F_8 only. Metrics with
      units: presence flags (boolean), class lists (polynomials), Jacobian
      flags (boolean, with the (N_1, N_2[, N_3]) witness), smooth-model counts
      (integers), tests performed (count), wall-clock (s, reported).
      Falsification thresholds stated before the run: any surface-row entry
      differing from the prediction; any torus triple differing; any
      unfiltered count off. Estimated cost: minutes at g <= 3 including
      curves; hours at g = 4 with sympy, minutes with the exact enumerator of
      IDEA-20260926-5c26f9 (estimates).
    controls:
      - >-
        n = 131 reproduction of exact_targets.json (104 and 234220
        candidates, 0 hits).
      - >-
        Modulus 5 at g = 1 and modulus 15 at g = 2 as known-present sanity
        cases; modulus 17 at g = 2 as a known-absent case by the derivation.
      - >-
        Genus-2 smooth-model count compared with the known number of
        isomorphism classes (the script reports the count; the comparison
        value is to be retrieved, not recalled here).
      - >-
        Unfiltered class counts 5, 35, 215.
    required_metrics:
      - 'per-n presence vector on both axes'
      - 'Jacobian witnesses (N_1, N_2[, N_3]) or absence with model coverage'
      - 'unfiltered class counts and n = 131 reproduction'

  falsification_conditions:
    - 'An abelian surface over F_2 with 17, 23, 29 or 31 points: the closed enumeration in the claim is wrong.'
    - 'A torus triple differs from the list: the Moebius product or the lemma of IDEA-20260926-6f2601 Part 1 is wrong.'
    - 'Unfiltered counts differ from 5, 35, 215: enumeration defect; no entry is trusted until fixed.'
    - 'The n = 131 row differs from exact_targets.json: harness defect.'

  confounders:
    - >-
      "Jacobian absent" depends on model coverage; an incomplete curve
      enumeration produces a false absence. The smooth-model count is
      reported for this reason.
    - >-
      At g = 3 the numerical census has a 4-class gap; the ladder uses the
      exact search, so the gap does not enter, but the g = 3 maximum 100
      quoted from census.json might be low by a class and is not relied on.
    - >-
      Axis-2 presence at g = 2 or 3 does not imply an explicit group law
      cheap enough for a factor base (IDEA-20260926-6f2601's lemma limits the
      linear shape at every n with ord_n(2) = n - 1 to the trace-zero
      hyperplane, and at the other primes to the 2^f stable subspaces); the
      ladder records existence, not usability.

  interpretation_limits:
    - >-
      A fixture. It supports no claim about ECC2K-130 and no claim that
      structure helps or hurts; it only makes such a claim testable with a
      matched pair.
    - >-
      Transfer to n = 131 is by the same enumerator, not by extrapolation;
      the 131 row is reproduced, not inferred.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Runtime only.) exact_targets.search costs about 300 sympy tests per
