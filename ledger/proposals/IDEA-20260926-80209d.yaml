        095df5) and the torus has dimension 48; the ladder must reproduce
        that row when run at n = 131 with g <= 4 (same script, same numbers
        104 and 234220).
      reproduction_check: >-
        exact_targets.json equality at n = 131; unfiltered counts 5, 35, 215.
    observation_collision:
      observable: >-
        Per n, the vector (stable-subspace count, torus dimension and order,
        elliptic present, surface present, surface Jacobian present,
        threefold present, threefold Jacobian present).
      distinct_preimage_search: >-
        A "present" surface entry could be an abelian variety that is not a
        Jacobian; the Jacobian column separates the two readings, and outcome
        C is exactly that split.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The seven-prime ladder with both axes tabulated.
        predicted_gain: >-
          Matched pairs (17, 19) and (31, 37) available to any later
          experiment at no further cost.
    quantifier_order: >-
      FOR EACH n in the ladder and EACH object class (torus, elliptic,
      surface, threefold, their Jacobians), THERE EXISTS or does not exist an
      object with a rational point of order n; decided exactly at g <= 3.
    method_ceiling:
      strongest_certifiable_claim: >-
        The table itself at g <= 3 with exact entries; "Jacobian absent"
        only as strong as the model-enumeration coverage, disclosed.
      nearby_object_control: >-
        Modulus 5 at g = 1 (present, the 5-point curve, which is also a
        Jacobian trivially) and the composite modulus 15 at g = 2 (h(3) = 15
        is achievable at a = 2, b = 0, so present) as sanity checks of the
        machinery on cases with known answers.
    proof_obligations:
      - claim: The surface-row enumeration over a in [-5, 5] and its achievable set {1..16, 19, 20, 25}.
        responsibility: correctness
      - claim: Torus orders 17, 57, 2047, 3277, 31, 4033, 205 and their divisibility by n.
        responsibility: correctness
      - claim: Genus-2 model enumeration is complete up to isomorphism (smooth-model count compared with the known class count).
        responsibility: size
      - claim: exact_targets.search reproduces the n = 131 JSON when run in the ladder harness.
        responsibility: baseline
      - claim: Runtime minutes at g <= 3 including curves; hours at g = 4 with sympy.
        responsibility: runtime

  predictions:
    - metric: >-
        surface row (g = 2) of the ladder
      direction: same
      minimum_effect: >-
        Present at n = 19 only, via h = x^2 + 3x + 1; absent at 17, 23, 29,
        31, 37, 41.
    - metric: >-
        torus column (k, dimension, Phi_k(2))
      direction: same
      minimum_effect: >-
        Exactly the eight triples listed in the claim.
    - metric: >-
        elliptic row
      direction: same
      minimum_effect: >-
        Empty at every ladder prime.
    - metric: >-
