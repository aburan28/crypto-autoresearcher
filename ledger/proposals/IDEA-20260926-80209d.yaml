idea:
  id: IDEA-20260926-80209d
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-26'
  status: proposed
  approved_by: null
  title: >-
    THE TOY CONTROL LADDER FOR ALGEBRAIC-GROUP FACTOR BASES, at primes n in
    {17, 23, 31, 41} (ord_n(2) < n - 1) versus {19, 29, 37} (2 a primitive
    root, as at 131): which elliptic curves, abelian surfaces and threefolds,
    genus-2 and genus-3 Jacobians, and cyclotomic tori over F_2 carry a
    rational point of order n, recorded so that a later Galois-invariant-base
    experiment has a matched "structure present / structure absent" pair,
    with the hand-derived prediction that the abelian-variety axis does NOT
    track ord_n(2)

  class: control

  claim: >-
    CEILING FIRST. A control fixture for RQ-BINSTD-b6f698's table (owner by
    the R2 rule); no arity, no oracle budget, no row moves, nothing on
    ECC2K-130's curve. It exists so that any future experiment claiming that
    "algebraic-group structure helps a Galois-invariant base" has, at toy
    scale, cells where the structure is present and matched cells where it is
    absent, on BOTH axes that the corpus has conflated.
    THE TWO AXES, SEPARATED. Axis 1, Frobenius-stable subspace richness:
    2^(1 + (n - 1)/ord_n(2)) stable subspaces (IDEA-20260918-9abf42), i.e.
    8, 8, 128, 8 at n = 17, 23, 31, 41 and 4, 4, 4 at n = 19, 29, 37, with 4 at
    131; the torus column lies on this axis exactly, because n | Phi_k(2) iff
    k = ord_n(2) x n^j (IDEA-20260926-6f2601 Part 1), so the minimal
    cyclotomic torus has dimension phi(ord_n(2)). Axis 2, existence of an
    abelian variety of small dimension with n | #A(F_2), which is a Weil-
    polynomial question independent of ord_n(2).
    THE LADDER, HAND-DERIVED BEFORE ANY RUN (the script confirms or refutes
    each entry). TORI: n = 17, k = 8, dim 4, Phi_8(2) = 17; n = 19, k = 18,
    dim 6, Phi_18(2) = 57 = 3 x 19; n = 23, k = 11, dim 10, Phi_11(2) = 2047 =
    23 x 89; n = 29, k = 28, dim 12, Phi_28(2) = 3277 = 29 x 113; n = 31,
    k = 5, dim 4, Phi_5(2) = 31; n = 37, k = 36, dim 12, Phi_36(2) = 4033 =
    37 x 109; n = 41, k = 20, dim 8, Phi_20(2) = 205 = 5 x 41; n = 131,
    k = 130, dim 48. ELLIPTIC CURVES OVER F_2: #E(F_2) in {1, 2, 3, 4, 5}
    (census.json validates the five classes), so NO prime of the ladder is
    carried by an elliptic curve; the elliptic row is empty at every n >= 7,
    not just at 131. ABELIAN SURFACES: h = x^2 + a x + b with |a| <= 5,
    real roots in [-2 sqrt 2, 2 sqrt 2] iff a^2 >= 4b and b >= 2 sqrt 2 |a| -
    8, and #A = h(3) = 9 + 3a + b; enumerating a from -5 to 5 gives the
    achievable counts {1, ..., 16} u {19, 20, 25} (a = 4 forces b = 4, giving
    25; a = 3 allows b in {1, 2}, giving 19 and 20; a = 5 is impossible since
    b <= 6 and b >= 6.14 conflict). Hence at g = 2 EXACTLY ONE ladder prime
    is present, n = 19, by the single class h = x^2 + 3x + 1, P(T) = T^4 +
    3T^3 + 5T^2 + 6T + 4 (LMFDB label 2.2.d_f by the labelling convention,
    inferred, recalled), and 17, 23, 29, 31 are absent although below the
    ceiling 33, while 37 and 41 exceed it. JACOBIAN OR NOT AT n = 19: #J =
    (N_1^2 + N_2)/2 - 2 = 19 with N_1 = 3 + 3 = 6 and N_2 = 5 - 9 + 10 = 6
    requires a genus-2 curve over F_2 with six rational points, all of whose
    F_4-points are rational; whether such a curve exists is decided by
    enumerating every model y^2 + h(x) y = f(x) with deg h <= 3, deg f <= 6
    over F_2 (2048 pairs) and counting points over F_2 and F_4; the record
    predicts nothing here and both answers are informative. ABELIAN
    THREEFOLDS: ceiling 197, multiples of n number 11, 10, 8, 6, 6, 5, 4 for
    n = 17, 19, 23, 29, 31, 37, 41; decided by exact_targets.search(3, n),
    about 300 exact tests per target (estimate from the 104 at target 131);
    genus-3 Jacobians decided by enumerating hyperelliptic models (deg f <= 8)
    and plane quartics (2^15 coefficient vectors) with N_1, N_2, N_3 by brute
    force over F_2, F_4, F_8. DIMENSION 4 (optional): 67 + 60 + 50 + 39 + 37
    + 31 + 28 = 312 targets at about 30000 tests each (from 234220 / 8 at
    n = 131) is about 10^7 sympy tests, hours (estimate); run only if the
    exact enumerator of IDEA-20260926-5c26f9 is available, where it is
    minutes.
    THE PREDICTION THAT CAN FAIL. Axis 2 is uncorrelated with axis 1: at
    g = 2 the only present prime is the primitive-root prime 19, while the
    subspace-rich primes 17, 23, 31, 41 are all absent; the torus column
    tracks axis 1 exactly (dimension phi(ord_n(2)), smallest at 17 and 31).
    So the matched pairs a later experiment needs are (17, 19): near-equal
    degree, 17 subspace-rich and surface-poor, 19 subspace-poor and surface-
    rich; and (31, 37): the richest lattice against the poorest, both
    surface-poor. THE OUTCOMES. (A) The script reproduces the hand-derived
    table (torus column, empty elliptic row, surface row present at 19 only,
    threefold row as computed, Jacobian columns as computed): the ladder is
    recorded as a fixture with a "present / absent" pair on each axis. (B) A
    hand-derived-absent entry is present (e.g. an abelian surface with 17
    points): the closed enumeration over a in [-5, 5] above is wrong and the
    record is corrected before use. (C) The surface class at 19 is not a
    Jacobian (no (6, 6) curve exists): the fixture gains a third column,
    "abelian variety present, Jacobian absent", which is exactly the
    distinction the dimension-5/6 census will need at 131.

  mechanism: >-
    OBJECT FRAME. No tracked object on a curve; the objects are (i) monic
    divisors of x^n - 1 over F_2 (axis 1), (ii) cyclotomic tori T_k and their
    orders Phi_k(2), (iii) real Weil polynomials of degree g <= 3 (optionally
    4) with h(3) = 0 mod n, (iv) genus-2 and genus-3 curves over F_2 with
    their zeta functions. Operation set: none; every entry is an exact
    enumeration. TRICHOTOMY and LOSSY-PROJECTION TEST: not applicable (a
    fixture, said plainly).
    WHY A LADDER AND NOT ONE TOY. The corpus's Koblitz toy cells (n = 17 and
    19 in IDEA-20260926-9c5694; n = 17 and 19 CERTBIN cells; n = 13 to 23 in
    KN-FIND-47da4e) sit on axis 1 only; the 9e5383 review's successor seam
    proposes the primitive-versus-non-primitive pair on axis 1. This record
    adds axis 2 and shows, by derivation, that the two axes point in
    different directions at the smallest primes, so that a future claim
    "algebraic-group structure helps" cannot be confounded with "the stable-
    subspace lattice is rich".
    WHY THE ELLIPTIC ROW MATTERS EVEN THOUGH IT IS EMPTY. It is the written
    Couveignes-Lercier construction, and at q = 2 it is empty for every prime
    n >= 7, not only at 131; the ladder records this so that no toy
    experiment is later designed on an elliptic-curve base over F_2 that
    cannot exist.
    INSTRUMENT SHAPE. analysis/couveignes-lercier-131/toy_ladder.py: imports
    exact_targets.search and exact_real_rooted_in_box (unchanged), adds
    ord_n(2) and the divisor count, Phi_k(2) by the Moebius product, genus-2
    and genus-3 model enumeration over F_2 with point counts over F_2, F_4,
    F_8 (a 40-line GF(2^k) helper or gf2n.py), the L-polynomial from N_1,
    N_2, N_3, and #J; output one JSON row per (n, object). Validation rows:
    unfiltered class counts 5, 35, 215 at g <= 3 (LMFDB 215 at g = 3
    retrieved by KN-OPEN-095df5's session; 5 and 35 classical), modulus 5 at
    g = 1 must find the 5-point class, and the genus-2 enumeration must
    produce the known point-count spread (N_1 <= 6) as a sanity floor.

