  citation_note: >-
    The surface-row derivation and the torus column are re-derived in the
    claim block from the two inequalities and the Moebius product; the only
    recalled items are the genus-2/3 zeta bookkeeping and an LMFDB label,
    neither load-bearing. No web search was run for this record.

  assumptions:
    - >-
      Honda-Tate over F_2 (as in IDEA-20260926-5c26f9): every real-rooted
      integer h in the box is a class; tested by the unfiltered counts.
    - >-
      Genus-2 curves over F_2 are covered by models y^2 + h(x) y = f(x) with
      deg h <= 3, deg f <= 6 (including the singular and lower-genus ones,
      which the script must filter by a genus/smoothness check); genus-3
      curves by hyperelliptic models and plane quartics. Missing a model
      would make a "Jacobian absent" entry unsafe, so the script reports the
      number of smooth models found per genus as a floor to be compared with
      the known isomorphism-class counts.
    - >-
      Runtime figures are labelled estimates.

  proof_search_map:
    bottleneck: >-
      Whether "group structure present" can be varied independently of
      "stable-subspace lattice rich" at toy scale; the hand derivation says
      yes at g = 2 (19 present, 17/23/31/41 absent), and the script decides
      the g = 3 row and the Jacobian columns.
    baseline_embedding:
