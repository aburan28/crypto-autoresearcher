idea:
  id: IDEA-20261017-2f80c9
  question_id: RQ-ECDLP-002
  added: '2026-10-17'
  title: >-
    Operation sets on the SNFS digit lattice, priced: rotation quotient, implicit norm-smooth factor base,
    and ideal-lattice Coppersmith relation finding (the recoverable volume does not grow with d)
  class: algorithm
  claim: >-
    p=m^d-c, pi=alpha-m, digit box D_H (unique Babai lifts). (A) Sigma_rot={x->m*x} is coordinate-dependent:
    the class of x(P+R) is not a function of the class of x(P), branching b>=1-O(ord(m)/p), loss log2 ord(m)
    bits (ord m=d for c=1; ~p-scale for c=19). (B) F_B={x: Babai lift has B-smooth norm<=Y} has |F|~Y*rho(u)
    and polynomial-time membership, but enumerate-and-test costs p/|F| per relation and the table needs |F|
    relations: total >=p, per target >=sqrt(p); the special form changes only the membership cost. (C)
    Cohn-Heninger Thm 1.3 (retrieved): roots with |sigma_i(w)|<lambda_i of f(w) in I are found when
    prod lambda_i<N(I)^(1/delta): a volume bound independent of d (2^(-O(d^2)) loss for poly time). So on S_3
    V*_special(d)<=V*_generic(1)=p^(1/delta_eff), delta_eff in [2,4]; a random-base ring (c'~m^(d-1)) loses
    c'^(d-1) more. Guess-and-LLL costs p^(1-1/delta_eff) per relation, in [p^(1/2),p^(3/4)], total >=p.
  mechanism: >-
    PAIR: representation = Z[alpha]-digit vector of x(P) (R1); Sigma = translation by factor-base points
    (Class I, partial-action) plus (A) as a second Sigma. TRICHOTOMY: (B),(C) partial-action; (A)
    coordinate-dependent. LOSSY TEST: the digit map is a bijection on D_H; the rotation class (A) and the
    smooth subset (B) are lossy but neither is a block system of the translation group; (C) discards
    nothing. PRICE: (A) b measured on toy Mersenne p vs identity and random-label controls; (B) p/|F| times
    membership; (C) LLL in dimension ~d*monomials. FACTOR-BASE (KN-OPEN-020): implicit membership. Stage:
    relation decomposition.
