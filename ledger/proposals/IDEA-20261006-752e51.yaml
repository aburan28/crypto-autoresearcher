idea:
  id: IDEA-20261006-752e51
  question_id: RQ-SSI-1946c9
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: Trace-zero split of the j=1728 and j=0 models over F_7
  class: control
  claim: >-
    Over F_7, each of the six models y^2 = x^3 + A x with
    A in {1,2,3,4,5,6} is nonsingular and has trace of Frobenius 0,
    so the trace-zero count on that family is 6. Each of the six models
    y^2 = x^3 + B with B in {1,2,3,4,5,6} is nonsingular and has trace
    not equal to 0, so the trace-zero count on that family is 0. Trace
    means 8 minus the number of projective F_7-points, with exactly one
    point at infinity. A recomputation that finds a trace-zero model in
    the B family, or a nonzero trace in the A family, falsifies the
    split. The census does not build a public-key encryption scheme, does
    not compute an endomorphism ring, and does not change the reported
    path-finding cost.
  mechanism: >-
    The two families are the nearby objects for each other. Outcome
    6 versus 0 means that, at this prime, every sampled model of shape
    y^2 = x^3 + A x is supersingular in the trace-zero sense and every
    sampled model of shape y^2 = x^3 + B is ordinary. A key-generation
    distribution that emits only the second shape at p=7 therefore emits
    0 supersingular curves. Outcome equal counts means the Weierstrass
    shape does not separate the two properties at p=7. LOSSY-PROJECTION
    TEST. The tracked object is the trace-zero bit of a short-Weierstrass
    model; the operation set is the F_7-isomorphism
    (x, y) |-> (u^2 x, u^3 y) for u in F_7^×, not translation on a
    prime-order subgroup. Discarded: the coefficients and the points.
    The bit propagates because an isomorphism preserves the number of
    rational points. It is lossy because all six A-models share one bit,
    so the bit is not a coordinate of the model.
