    hidden_overhead: >-
      Discriminant checks on 12 models. No o(1) attack term is claimed.
    tradeoff_note: >-
      The data is the full set of 12 models. Parallelism across models
      does not change either total. The p^{1/4} path cost is not a term
      in the trace totals.
