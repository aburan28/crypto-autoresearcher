    memory_exponent: >-
      One model at a time. No memory exponent.
    best_known: >-
      KN-OPEN-013 states, as reported and not re-proved here, an
      Otilde(p^{1/4}) cost for pure supersingular path-finding.
      KN-LIT-074 states an equivalence of endomorphism ring and
