  predictions:
    - metric: trace_zero_model_count
      direction: different
      minimum_effect: >-
        6 on y^2 = x^3 + A x versus 0 on y^2 = x^3 + B, a gap of 6
        models.
  minimal_test:
    design: >-
      For each of the 12 pinned models, evaluate the right-hand side at
      all 7 abscissae, count affine points by the Legendre symbol of
      that value (1 point if the value is 0, 2 if it is a nonzero
      square, 0 otherwise), add one point at infinity, and set the
      trace to 8 minus the total. Count how many models in each family
      have trace 0. Reject a model whose discriminant is 0.
    controls:
      - >-
        The B family is the nearby object for the A family. The claim
        predicts trace-zero count 0 there. A positive count falsifies
        the split.
      - >-
        The excluded cusp A=B=0 is computed separately and must not be
        entered in either tally. Entering it voids the run.
    required_metrics:
      - trace-zero count on the six A models
      - trace-zero count on the six B models
      - discriminant-zero count inside the twelve models, which must be 0
  falsification_conditions:
    - >-
      At least one A in {1,2,3,4,5,6} has trace not equal to 0. That
      single model is a negative.
    - >-
      At least one B in {1,2,3,4,5,6} has trace 0. That single model
      is a negative.
    - >-
      Any of the twelve models has discriminant 0, or any reported
      absolute trace exceeds 5. That voids the point-count
      implementation. It is not a trace split.
  confounders:
    - >-
      Forgetting the point at infinity shifts every trace by 1 and can
      turn a trace of 0 into a trace of 1. Both families must use the
      same convention.
    - >-
      Quadratic twist changes the sign of the trace. Trace 0 is stable
      under that sign change. A nonzero trace is not.
    - >-
      Several A values can be isomorphic over F_7. The claim counts
      models, not isomorphism classes, and all six A models have the
      same j-invariant 1728.
  interpretation_limits:
    - >-
      The split is at p=7 only. It does not transfer to a cryptographic
      prime, to a public-key encryption scheme, or to an endomorphism
      ring.
    - >-
      KN-OPEN-013's reported Otilde(p^{1/4}) figure is unchanged.
      Isogeny paths computed: 0.
    - >-
      A trace of 0 on these models is not a reduction to the
      endomorphism-ring problem named in KN-LIT-074.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The recalled congruence that j=1728 is supersingular for
        p congruent to 3 mod 4, and j=0 is ordinary for p congruent to
        1 mod 3, predicts the split at p=7. The congruence is not
        proved in this session. The claim under test is the 12-model
        count, not the general congruence.
      rigorous_support: >-
        Hasse's bound gives absolute trace at most floor(2 sqrt(7)),
        which is 5, so trace 0 lies in the interval. The point count
        itself is a finite Legendre-symbol sum and does not use a
        class-number formula.
      validation_plan:
        sampling: >-
          Enumerate all six A values and all six B values. At each of
          the 7 abscissae, classify the right-hand side as 0, nonzero
          square, or nonresidue in F_7.
        comparison: >-
          The two trace-zero totals against the predicted pair (6, 0).
        tail_check: >-
          Any model with absolute trace greater than 5 rejects the
          implementation. The cusp A=B=0 must stay outside both totals.
        parameters: >-
          Prime 7 only, twelve models, one point at infinity. No
          transfer to other primes, to EndRing hardness, or to a
          security game.
  target_complexity:
    time_exponent: >-
      No attack exponent. The census is 12 models times 7 abscissae.
