  assumptions:
    - >-
      Projective point count equals the number of affine solutions of
      y^2 = x^3 + A x + B plus one point at infinity. Trace is
      8 minus that count.
    - >-
      A model is included only when A and B are in the stated sets.
      The cusp y^2 = x^3, which is A=B=0, is excluded.
    - >-
      Nonsingularity means the discriminant -16(4 A^3 + 27 B^2) is
      nonzero in F_7. Characteristic 7 is not 2 or 3.
