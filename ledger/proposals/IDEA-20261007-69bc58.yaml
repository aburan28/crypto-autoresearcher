idea:
  id: IDEA-20261007-69bc58
  added: '2026-10-07'
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-623a32
  title: >-
    Legendre bias of the tangent slope on y^2 = x^3 + x + 6 over F_29
  class: measurement
  claim: >-
    Toy instance only, prediction fixed before any run. Let E be
    y^2 = x^3 + x + 6 over F_29. Let E_set be the affine points with
    y not 0, and let n be its size. For each such P let lambda(P) be
    the tangent slope (3 x(P)^2 + 1) times the inverse of 2 y(P). Let
    L be the number of those points whose Legendre symbol (lambda(P) / 29)
    equals 1. Let U be the number whose Legendre symbol ((x(P)+1) / 29)
    equals 1. Prediction: the absolute value of 2 L minus n is at least
    8, and the absolute value of 2 U minus n is at most 4. If the
    x-shift symbol is also at least 8 from n, the bias is not special
    to the slope and the claim fails. This claim does not say an ECDLP
    exponent changes.
  mechanism: >-
    The measured bit is the quadratic character of the tangent slope,
    not a trace coordinate and not a product of x-coordinates. The
    tangent reads y(P). The character can then sit away from one half
    of the eligible points. The null character is the same Legendre
    symbol on x(P)+1, which does not use the group law. Points with
    lambda = 0 are neither residue nor nonresidue and are counted in a
    separate zero bin. They stay inside n. No walk is run and no
    summation polynomial is formed.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-623a32
      provenance: internal
      claim: >-
        Toy measurements of a representation are in scope when they
        name a negative and do not claim an exponent.
      verified_by: >-
        coordinator session 2026-10-07 opened
        ledger/questions/RQ-ECDLP-623a32.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        Generic discrete logarithms need Omega(sqrt(p)) group
        operations. Exponent difference here is 0.
      verified_by: >-
        coordinator session 2026-10-07 opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KR-RHO-5b1c0a
      provenance: internal
      claim: >-
        A representation attack over F_{p^2} that costs p^{1.314} does
        not beat rho. This proposal is a character count on F_29, not
        that attack.
      verified_by: >-
        coordinator session 2026-10-07 opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-5b1c0a.yaml
  assumptions:
    - >-
      4 A^3 + 27 B^2 is nonzero modulo 29 for A = 1 and B = 6. The
      test recomputes the residue.
    - 29 is 3 mod 4 is not used. The Legendre symbol is Euler's criterion.
  proof_search_map:
    not_applicable_reason: >-
      This is one character count at p = 29, not a proof that an
      exponent changes.
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
  predictions:
    - metric: absolute value of 2 L minus n
      direction: higher
      minimum_effect: at least 8
    - metric: absolute value of 2 U minus n
      direction: different
      minimum_effect: at most 4
  minimal_test:
    design: >-
      List affine points by testing squares. Skip no point with y not 0.
      Compute lambda by the tangent formula. Score both Legendre counts
      with Euler's criterion, pow(a, 14, 29). A zero slope is symbol 0
      and is not counted in L.
    controls:
      - Legendre symbol of x(P)+1 on the same points.
      - Discriminant residue nonzero.
      - The zero-slope count is reported and does not by itself choose the row.
    required_metrics:
      - n
      - L
      - U
      - absolute value of 2 L minus n
      - absolute value of 2 U minus n
      - zero-slope count
  falsification_conditions:
    - The absolute value of 2 L minus n is at most 7.
    - The absolute value of 2 U minus n is at least 5.
    - A zero discriminant is an invalid run, not support.
    - A timeout is infrastructure, not a falsification and not support.
  confounders:
    - >-
      A large zero-slope bin shrinks the room for symbol 1. The bin is
      reported. It is not removed from n before the comparison.
  interpretation_limits:
    - A confirmed bias is a count at p = 29. It is not an exponent improvement.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The quadratic character of the tangent slope on this curve sits
        at least 4 points away from n/2, while the character of x+1
        sits at most 2 points away, as if the tangent imposed a bias
        the field shift does not share.
      rigorous_support: >-
        Euler's criterion is proved. No theorem opened in this session
        bounds the character sum of the tangent slope on this curve.
      validation_plan: >-
        Enumerate every eligible point at p = 29. Compare both absolute
        deviations with the frozen thresholds 8 and 4. Do not subsample.
  target_complexity:
    time_exponent: p^{1/2} unchanged
    memory_exponent: O(1) beyond the prime-field point list
    best_known: >-
      Pollard rho in Theta(p^{1/2}) group operations, matching
      KR-RHO-13bf67 up to the constant
    hidden_overhead: None claimed. No asymptotic algorithm is proposed.
    tradeoff_note: >-
      The measurement stores one symbol per point and does not define a
      discrete-logarithm tradeoff.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  dominated_by: >-
    KR-RHO-13bf67 dominates any exponent reading, exponent delta 0.
    KR-RHO-5b1c0a dominates any reading of this character as a
    representation attack over F_{p^2}. Neither row states this
    Legendre count of tangent slopes at p = 29.
  sota_delta: >-
    Exponent difference 0 against Omega(p^{1/2}). Counted delta: the
    slope character is at least 8 from n in the doubled scale, and the
    x+1 character is at most 4 from n, at p = 29.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp/generic-rho
    rows_checked:
      - KR-RHO-13bf67
      - KR-RHO-fb88e6
      - KR-RHO-5b1c0a
      - KR-RHO-6654ba
      - KR-IC-5a43e5
      - KR-IC-46d822
    nearest:
      - ref: KR-RHO-5b1c0a
        provenance: internal
        relation: orthogonal
        delta: >-
          That row is a p^{1.314} subset-sum representation over
          F_{p^2}. This proposal counts a character on F_29 and claims
          no cost below rho.
      - ref: KR-IC-46d822
        provenance: internal
        relation: orthogonal
        delta: >-
          Gaudry decomposition is an index-calculus cost on extension
          fields. This proposal does not decompose a point.
    searched:
      corpus_grep:
        - ledger/proposals on origin/main and titles on PR 1962 and PR 1960
        - skipped the trace-bucket, y1-fiber, kernel-polynomial, and 5-smooth claims already filed
      web: []
      blocked: []
