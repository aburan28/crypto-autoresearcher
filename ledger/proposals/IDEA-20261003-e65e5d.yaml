# IDEA-20261003-e65e5d
# Multiplication-degree count. Proposal only. Not approved.
idea:
  id: IDEA-20261003-e65e5d
  question_id: RQ-JINV-8fc13a
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    Multiplication by 11 has degree 121 and multiplication by 10 has degree 100
  class: measurement
  claim: >-
    Multiplication by 11 has degree 121. Multiplication by 10 has
    degree 100. One hundred twenty-one exceeds one hundred by 21.
    The product of the two degrees is 12100. Their sum is 221. The
    gap is a map degree, not an ECDLP exponent and not the degree
    pair 100 and 81.
  mechanism: >-
    OBJECT FRAME. R3 is the multiplication endomorphism. The
    operation set is reading the degree, which is coordinate-dependent
    on the integer multiplier and is not a translation of a curve
    point. Eleven squared is 121. Ten squared is 100. Two maps of
    degree 100 have gap 0 and product 10000. No point is mapped.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question treats End(E) as a ring and asks for any
        advantage beyond the automorphism discount.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-IC-f5c584
      provenance: internal
      claim: >-
        A first-fall degree of 2 is a different object from these
        two multiplication degrees.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The multipliers 11 and 10 are frozen before the squares are taken.
    - No point is mapped.
  proof_search_map:
    bottleneck: The degree gap 21.
    baseline_embedding:
      parameter_slice: The degrees 121 and 100.
      reproduction_check: >-
        Two readers must agree that 11 squared is 121 and that 10
        squared is 100.
    observation_collision:
      observable: The degree gap and the product.
      distinct_preimage_search: >-
        Reporting both degrees as 100 drops the gap. Two maps of
        degree 100 make that gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The degrees 121 and 100.
        predicted_gain: Integer gap. No mapping of a point.
    quantifier_order: >-
      The multipliers are fixed before the degrees.
    method_ceiling:
      strongest_certifiable_claim: >-
        The degrees 121 and 100. Not the degree pair 100 and 81.
      nearby_object_control: >-
        Two maps of degree 100. The gap is 0 and the product is 10000.
    proof_obligations:
      - claim: Multiplication by 11 has degree 121.
        responsibility: size
      - claim: Multiplication by 10 has degree 100.
        responsibility: size
      - claim: The gap is not the degree pair 100 and 81.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: degree_gap
      direction: different
      minimum_effect: One hundred twenty-one exceeds one hundred by 21.
  minimal_test:
    design: >-
      Square 11 and square 10, then subtract 100 from 121. Do not
      map a curve point.
    controls:
      - Two maps of degree 100, whose gap is 0.
      - An independent count.
    required_metrics:
      - both degrees
      - the gap
      - the product
  falsification_conditions:
    - The degree of multiplication by 11 is not 121.
    - The product of the two degrees is not 12100.
  confounders:
    - The degree pair 100 and 81 belongs to multipliers 10 and 9.
  interpretation_limits:
    - A map degree is not a walk length.
    - No transfer to a cryptographic endomorphism.
    - This is not the degree pair 100 and 81.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen multiplication by 11 has degree 121, and the
        frozen multiplication by 10 has degree 100.
      rigorous_support: >-
        No endomorphism theorem is re-proved here. The count is a
        reading of two squares.
      validation_plan: >-
        Two independent squares. A mismatch voids the gap.
  target_complexity:
