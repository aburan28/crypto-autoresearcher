idea:
  id: IDEA-20260808-11b8c7
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-DREG-001
  goal_id: GOAL-DREG-001
  title: The missing null is topology-matched, not support-matched — build a null that copies
    the chaining graph of the Semaev tree with the elliptic arithmetic removed, and find out
    whether the whole measured deficit is a property of variable sharing rather than of curves
  class: control
  claim: 'Every null this lane uses is SUPPORT-matched: it fixes the monomial support (T11)
    or the column set and randomises the coefficients. The chained Semaev system has a second
    structure the null does not copy — the CHAINING GRAPH: the tree of intermediate variables
    in which each internal node''s S_3 relation shares exactly two variables with its parent
    and one with each child, producing n quadratics and n cubics in 2n variables with a specific
    sparse variable-sharing pattern. CLAIM: a null built by replacing each node''s S_3 relation
    with a uniformly random polynomial of the SAME multidegree and the SAME variable set,
    keeping the tree topology exactly, reproduces the measured deficit at D = 4 and D = 5
    to within seed noise. If it does, the 8k-1 law, the 1322, and the D5 series are properties
    of a sparse chained system and carry no elliptic content, and GOAL-DREG-001 and GOAL-SIG-001
    can both be decided on committed data plus one null battery. If it does not, the residual
    (deficit_sem - deficit_topology_null) is the first elliptic-specific quantity this lane
    has ever isolated, and every previously reported deficit should be restated as that residual.'
  mechanism: 'Sparse systems with shared variables are far from generic in a way that support
    matching does not capture: the semi-regular prediction assumes the forms are generic in
    ALL variables, whereas a chained system''s degree-D products factor through a small number
    of node-local subsystems. That alone creates rank deficiency, because products of polynomials
    from disjoint subtrees satisfy commutation relations that a generic system does not have.
    KN-FIND-006''s own degree-3 mechanism supports this reading: the fall comes from a SUBSET-SUM
    of descended quadrics whose quadratic parts cancel — a cancellation available whenever
    the descended quadrics share the right variable structure, which is a property of the
    descent and the chaining, not obviously of the curve. The programme''s own precedent for
    this control is KN-FIND-a8990a''s NULL-B ("S_4 with elliptic structure removed"), which
    the monodromy experiment used and which rejected at 48.9 per cent — this record proposes
    the same move for the degree axis, where it has not been made.'
  why_not_a_renamed_known_approach: Nearest in-corpus null is the T11-support-matched semi-regular
    null, which matches monomial supports and column sets. The difference is that support
    matching randomises coefficients within a fixed monomial support, whereas topology matching
    preserves WHICH VARIABLES APPEAR IN WHICH EQUATION and randomises everything else — and
    it is the variable-sharing pattern, not the monomial support, that creates the cross-equation
    cancellations. Two nulls, two different structures held fixed; running both and differencing
    is what separates them.
  predictions:
  - observable: deficit against the semi-regular prediction, three arms
    metric: deficit_D at D in {4,5}, n in {12,15,18}, >= 3 seeds
    predicted: 'Arm sem (committed values, e.g. 1322 at n=12 D5) > arm topology-null > arm
      support-null (0 by construction). The DECISIVE QUANTITY is deficit_topology_null / deficit_sem.
      Near 1: the deficit is topology, not curves. Near 0: the deficit is elliptic. Anything
      in between is the honest answer and is reportable as a fraction.'
  - observable: the exact 8k-1 law at D = 4
    metric: deficit_4 in the topology null as a function of k
    predicted: If the law is topological, the null reproduces 8k-1 or another exact affine-in-k
      law; an exact law appearing in a curve-free null is by itself decisive and is checkable
      at k = 3,4,5,6 cheaply.
  - observable: growth direction
    metric: sign of d_reg(sem) - d_reg(topology-null)
    predicted: 'The committed record has d_reg(sem) >= d_reg(null) (wrong sign for an attack).
      Prediction: the topology null moves d_reg UP toward the sem value, shrinking the gap.
      If instead it overshoots, the topology is harder than the curve and that inversion is
      itself a finding.'
  minimal_test: 'Build the topology null: traverse the same tree that src/semaev_tree.py builds
    at t = 3, ti = 0, and at each node emit a uniformly random polynomial with the same variable
    set and the same multidegree as the S_3 relation it replaces (over GF(2), with the same
    Weil-descent expansion so the variable count and equation degrees match exactly). Run
    the existing exact-rank instrument at D in {4,5}, n in {12,15,18}, >= 3 seeds. Report
    the three-arm table. Do NOT attempt D = 6 in this battery: the D >= 6 null is the lane''s
    standing blocker and this control does not resolve it.'
  controls:
  - EQUATION-COUNT AND DEGREE MATCH: the null must have exactly n quadratics and n cubics
      in 2n variables. A cell where the counts differ is void — KN-FIND-006 records n = 9
      and n = 17 as deficient cells for exactly this reason and they are excluded.
  - SUPPORT-NULL ARM RUN SIMULTANEOUSLY, which must reproduce deficit 0 as committed. If it
    does not, the instrument has drifted from the archived one and no comparison is admissible.
  - 'SEED SPREAD: >= 3 seeds per cell with the spread reported; a single-seed null cannot
    bound seed noise and cannot support a "reproduces" claim.'
  - IDENTITY CHECK: replacing the random node polynomials by the true S_3 relations must reproduce
      the committed sem ranks exactly, bit for bit. This is a free and decisive plumbing gate.
  confounders:
  - Multidegree matching over GF(2) is ambiguous (a random cubic in a given variable set may
    be degenerate); the generation rule must be frozen and the realised degree distribution
    reported.
  - The Weil-descent step itself introduces structure (Frobenius relations) that is present
    in both arms and must not be counted as topology.
  - Random node polynomials may make the system inconsistent or the solution count zero, which
    changes the corank threshold; solution counts must be reported per cell as a covariate.
  - The chained system's intermediate variables are eliminated in some formulations and retained
    in others; the two arms must use the same convention.
  falsification_conditions:
  - The topology null reproduces the committed deficits within seed noise at n = 12 and 15,
    D = 4 and 5. The elliptic-content hypothesis is falsified at those cells and two goals
    can be closed on it.
  - The topology null shows deficit 0, like the support null. Topology is not the mechanism,
    the deficit is elliptic (or at least descent-specific), and the lane's current framing
    is vindicated.
  - The identity check fails to reproduce committed sem ranks. Plumbing failure; nothing readable.
  interpretation_limits: Toy tier, binary, D <= 5. It does not touch the quarantined D6 headline
    (17947) or the EV-SIG-008 7110, both of which sit at the degree where the lane's null
    is itself contested. It says nothing about prime fields. A "topology reproduces it" verdict
    closes the elliptic-content reading at the tested cells only, and per AGENTS rule 6 not
    one cell further.
  assumptions:
  - The archived instrument can be re-run unchanged on substituted node polynomials.
  - Semi-regular prediction values are recomputed for the null's actual degree sequence rather
    than reused.
  heuristic_assumptions:
  - id: HA-1
    statement: Rank deficiency in a chained sparse system arises predominantly from the variable-sharing
      pattern, so a topology-matched random system has the same expected deficit as the true
      system up to o(deficit).
    rigorous_ingredient: 'Rigorous: products of polynomials supported on variable-disjoint
      subtrees commute and generate relations absent from a generic system, so the deficit
      of a chained system is bounded BELOW by a topological count. Only the claim that this
      lower bound is essentially tight is heuristic.'
    distribution_imitated: 'The generic-versus-structured contrast used throughout this corpus:
      a random object with the same combinatorial skeleton stands in for "everything except
      the arithmetic".'
    validation_route: The three-arm battery IS the validation; additionally, vary the tree
      topology (balanced versus caterpillar at the same n) and check that the null deficit
      tracks the topology rather than n alone. TOY SCALE.
    tail_checks: Report the min and max null deficit over seeds per cell; if the sem value
      falls inside the null's observed range, "reproduces" is the honest verdict and no residual
      may be claimed.
  target_complexity:
    time_exponent: No attack exponent. Affects the interpretation of theta only through whether
      a claimed non-semi-regularity is elliptic or combinatorial.
    memory_exponent: Same as the archived instrument; the null is not larger.
    best_known_baseline: rho sqrt(N), untouched. For the sub-question, the incumbent null
      is the support-matched semi-regular series.
    hidden_overhead_disclosure: Random-polynomial generation over GF(2) at matched multidegree
      is not canonical and the rule chosen will influence the result; it is frozen and published
      with the battery.
    time_memory_tradeoff: Not applicable.
  sota_delta: 'Zero on attack axes. Deliverable: the fraction of every committed deficit (1322
    at n=12 D5; 1862, 1823, 1999, 2724 at n=15,17,18,21; the 8k-1 law at D=4) attributable
    to chaining topology rather than to elliptic arithmetic — a number that changes how six
    committed evidence records must be read.'
  dominated_by: Nothing dominates a control of this shape; the closest is KN-LIT-7605/7607,
    which prove the asymptotic boundedness this control cannot address, and KN-FIND-006, which
    already bounds the deficit's relative size (4.49 per cent to 1.37 per cent decaying).
    Attack frontier checked (rho, BSGS, VW, S T^2 = Omega~(N), sqrt(TN)); untouched.
  estimated_cost: Implementation low (substitute node polynomials in an existing generator);
    compute medium (a full null battery at n = 12,15,18 and D = 5, comparable to one existing
    cell per seed).
  recommended_priority: medium
  honest_prior_of_survival: 0.55 that the topology null reproduces a majority of the deficit
    — genuinely a coin flip, which is what makes it worth running; the degree-3 mechanism
    in KN-FIND-006 reads as topological, but the support-matched null's clean 0 shows that
    not every structural match reproduces the effect. 0.9 that the identity check passes.
  novelty_status: screened
  novelty_class: adaptation
  novelty_screen: EXISTING_PROPOSALS titles for RQ-DREG-001 (IDEA-20260801-002, IDEA-20260805-90a841,
    -2dc8de, -61f7f4, -f49efb, -e732ed) and RQ-SIG-001 (-d38a8c, -8a68d3, -bbfca9); EXISTING_HYPOTHESES
    H-DREG-152cff, H-DREG-5a3ac1; GOAL-DREG-001.yaml in full including its BATCH-001..003
    checkpoints; KN-FIND-006 in full; KN-FIND-a8990a (for the NULL-A/NULL-B precedent); KNOWLEDGE_BARRIERS;
    CATALOGUE_TITLES. The corpus's nulls are support/column matched; no topology-matched null
    appears. WEB SEARCH UNAVAILABLE.
  discriminated_from: The T11-support-matched semi-regular null holds the monomial support
    fixed and randomises coefficients; this holds the variable-sharing graph fixed and randomises
    the polynomials, which is a strictly different quotient of the system's structure and
    can be differenced against the first. IDEA-20260805-f49efb argues every measured deficit
    is against a null that is not the right null — this record constructs a specific alternative
    null and predicts its value, which f49efb does not. KN-FIND-a8990a's NULL-B is the same
    idea applied to the MONODROMY observable, not to the degree observable, and its rejection
    at 48.9 per cent is evidence the move has discriminating power in this corpus.
