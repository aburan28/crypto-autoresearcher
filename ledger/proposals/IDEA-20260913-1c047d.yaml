    - No secret scalars or uncharged oracles.
    - Only S = x+y is retained; if the implementation also keeps x or y, charge that as retained point information and reclassify.
    - y=0 is invalid for the doubling formula used in Stage 0.
    - This is not a Kummer-line / degree-d-function-on-E model proposal; no summation polynomial is formed.
    - F1 is a possible later consumer, not the primary lens.
