        design: Random field sums with no group law.
      - kind: known_false
        design: Claim S'=5 on P=(2,3)/F_19.
      - kind: invalid_input
        design: y=0 rejects.
      - kind: baseline
        design: Identity projection (retain (x,y)) has unary closure trivially and is the lossless control. 904d99 product on the same P is the matched bilinear control.
      - kind: pgl2_reparametrisation
        design: One public affine change of x; if unary closure appears only in one chart, it is chart artifact.
    required_metrics:
      - sum_identity_hold
      - unary_closure
      - L_and_b
    decision_threshold: >-
      REAL S and S' must match independent recomputation from the
      group law (5 and 8). Known-false invariance must fail. Unary
      closure is a separate yes/no on this curve only. No exponent
      claim. No Semaev / model-lever claim.
    stopping_rules:
      - Stop at the first failed exact identity or known-false control and classify it as a procedure defect.
      - No run is authorized here.
    required_artifacts:
      - frozen (p, A, B, P, [2]P, S, S') manifest
      - REAL / known-false / null / invalid outcomes
      - optional full-curve (S, S') table
    budget:
