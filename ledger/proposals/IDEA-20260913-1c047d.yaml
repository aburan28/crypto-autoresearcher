      this frozen curve and test functional dependence. Nearby-object:
      the 904d99 product Pi=6, Pi' on the same P as a matched
      different-bilinear control, not pooled.
    matched_null: Independent uniform field elements; their sum is not the doubling sum.
    known_false: S' = S = 5 on the frozen REAL point (wrong-value invariance).
    controls:
