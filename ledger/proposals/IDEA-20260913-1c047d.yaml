idea:
  id: IDEA-20260913-1c047d
  title: Affine sum x+y as a lossy joint coordinate under doubling
  class: representation
  claim: >-
    The single field element S(P) = x(P)+y(P) is a lossy R1 projection
    of an affine short-Weierstrass point (it discards the difference
    y-x). Paired with Sigma={[2]}, either (A) S([2]P) is a rational
    function of S(P) alone, so the fibres are a block system of <[2]>,
    or (B) S does not close and is priced by (L, b). KN-FIND-ffe1df
    lists joint (x,y) nonlinear members including x+y as not closed as
    sum-compatible filters under translation; 904d99 asks the same
    question of the product xy; dadcd2 treats Hessian x+y as a
    degree-2 Kummer-class model coordinate for summation polynomials.
    This is not that model use: it asks doubling-compatibility of the
    sum as a tracked predicate. Stage-0 is the frozen pair
    (S, S') = (5, 8). No exponent gain. Attack stage: collision
    structure.
  mechanism: >-
    Representation: affine coordinates (x, y) (R1), tracked object
    S = x+y. Operation set Sigma = {[2]}, not full translation.
    Trichotomy class: coordinate-dependent -- S is a function of the
    affine chart and is not a homomorphism of the group (Theorem C
    forbids an exact sum-compatible bucket of this shape). One-line
    reason: x+y is a linear chart polynomial, not a class function of
    <P>. R1 class. Attack stage: collision structure (whether S is a
    closed doubling-compatible predicate).

    LOSSY-PROJECTION TEST against Sigma={[2]}. What is discarded: the
    difference y-x (equivalently one of the two affine coordinates
    given the on-curve equation, up to the residual of the line
    x+y=s cut against E). The inventor-protocol section 2 example
    (Delta, Pi) = (x+y, x*y) loses nothing in characteristic 2 because
    {x, y} are the roots of t^2 + Delta t + Pi. Retaining ONLY S=x+y,
    and working in odd characteristic, is genuinely lossy: the fibre
    over a typical value is a line-cut of E of size greater than 1
    and is not a singleton. This is not the Kummer-line / degree-d
    model-lever use of Hessian x+y (dadcd2, closed at lever 1 as a
    factor-base coordinate): the object is not used as f: E -> P^1
    for a summation polynomial, and no Semaev S_m is formed.
    Discard compatibility: doubling supplies x', y' as rational
    functions of (x, y), so S' = x'+y' is well-defined. Compatibility
    with Sigma as a unary map on S alone is Outcome A versus B. If A,
    fibres of S are a block system of <[2]> and the open number is
    orbit-canonicalisation cost from the S label. If B, measure
    (L, b) against identity, random-label, and relabelled Z/NZ.

    PAIR (representation, Sigma) = (affine sum x+y, {[2]}).
    Not F2: no factor base, no Semaev. Not dadcd2 (Hessian x+y as a
    degree-2 map E -> P^1 for decomposition-system degree). Not
    904d99 (product xy). Not the lossless (Delta, Pi) pair.
    KN-OPEN-020 does not apply.

    STAGE-0 IDENTITY (independently computed on the frozen F_19 curve
    y^2=x^3+x-1, P=(2,3), [2]P=(16,11)): S = 2+3 = 5 and
    S' = 16+11 = 27 ≡ 8 in F_19.
