idea:
  id: IDEA-20260809-6090bf
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-QRE-6dba8c
  goal_id: GOAL-QRE-001
  title: >-
    Connectivity is an assumption, not a constant — cost the same circuit under
    nearest-neighbour routing and under the idealization the estimate uses
  class: measurement
  claim: >-
    Logical operations in a planar code are routed, and routing costs depend on
    the assumed connectivity. The claim is that re-costing the identical logical
    circuit under an explicit planar routing model rather than an idealized
    connectivity changes the wall-clock estimate by a measurable factor, that the
    factor grows with problem size, and that it is one of the assumptions least
    visible in a headline number.
  mechanism: >-
    Implement two routing models — idealized and explicit planar with a declared
    layout — and cost the same logical circuit under each, reporting the ratio at
    several problem sizes.
  why_not_a_renamed_known_approach: >-
    Layout and routing are studied in the fault-tolerance literature. Isolating
    routing as a SWEPT ASSUMPTION inside a reproduction pipeline, and reporting
    its factor separately, is what makes it comparable with the other assumptions
    ranked in this goal.
  predictions:
  - observable: wall-clock ratio between routing models
    metric: ratio at several problem sizes
    predicted: Greater than one and growing with size. A ratio near one would mean the idealization is harmless at these scales, which is a clean result.
  - observable: whether routing changes the qubit count as well as the time
    metric: qubit ratio
    predicted: Yes, through ancilla and routing space; the two ratios should be reported separately since a single scalar hides the tradeoff.
  minimal_test: >-
    Cost one logical circuit under both models at three problem sizes with the
    layout declared, reporting both ratios.
  controls:
  - 'IDENTICAL-CIRCUIT CONTROL: the logical circuit must be byte-identical across models, or the comparison measures compilation rather than routing.'
  - 'LAYOUT DISCLOSURE: the planar layout is declared and drawn in the run package; an undocumented layout makes the ratio unreproducible.'
  falsification_conditions:
  - The ratio is indistinguishable from one at every size.
  - The planar model cannot be implemented at the largest size within budget, which bounds the reported sizes rather than the conclusion.
  interpretation_limits: >-
    Both routing models are models. Neither is a hardware prediction, and the
    ratio is a statement about the assumption's influence.
  sota_delta: 'No feasibility claim. Delta: routing quantified as a swept assumption alongside the others.'
  dominated_by: Not dominated by any corpus record.
  estimated_cost: Implementation medium; compute low.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for routing/layout: no records. WEB NOT CHECKED.'
  source_refs:
  - Surface-code layout and routing references -- RECALLED, REQUIRED READS.
