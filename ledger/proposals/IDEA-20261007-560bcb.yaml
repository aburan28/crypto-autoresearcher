  assumptions:
    - id: A1
      statement: >-
        TrapCurveGen has expected-polynomial cost and non-negligible accepted
        mass, and outputs W equal to the full End(E), not a suborder.
    - id: A2
      statement: >-
        CanonicalBoundedEnd is representation-independent, polynomial on the
        sampler support, returns a degree-at-most-B noncentral evaluator, and
        is identical for every equivalent complete witness.
    - id: A3
      statement: >-
        The q-torsion and pairing algorithms are polynomial, q has the declared
        size, and sampling P until e_q(P,psi_E(P))!=1 is expected polynomial.
    - id: A4
      statement: >-
        CEST-XFER-KI is treated as a separate classical-ROM intermediate
        assumption covering the complete real public view. It is not EndRing.
    - id: A5
      statement: >-
        A bare or standard EndRing assumption does not automatically cover the
        structured curve distribution or auxiliary points P,A.

  proof_search_map:
    bottleneck: >-
      Extract a complete evaluable End(E) basis from an IND-CPA or same-scalar
      transfer adversary, rather than only one transfer value or one
      endomorphism action.
    baseline_embedding:
      parameter_slice: >-
        Substitute psi_E=[s] on a prime-order group. The algorithms become
        ordinary hashed static Diffie-Hellman.
      reproduction_check: >-
        Symbolically verify the same correctness identity and reject any
        purported EndRing proof that applies unchanged to this scalar baseline.
    observation_collision:
      observable: >-
        The action of psi_E on the reachable line <P>, all pads and all
        decryption outputs.
      distinct_preimage_search: >-
        Compare a complete W against the psi_E-only evaluator quotient, and
        seek non-equivalent complete rings/witnesses inducing the same action.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          IND-CPA -> CEST-XFER-KI -> canonical-endomorphism recovery ->
          complete EndRing, with each distribution explicit.
        predicted_gain: "identifies the first missing reverse arrow without relabeling assumptions"
      - transform: observable_fiber
        proposed_object: "fiber of complete ring witnesses over one reachable-line action transcript"
        predicted_gain: "either a scoped extraction obstruction or a needed injectivity premise"
      - transform: stronger_invariant
        proposed_object: "actions on enough independent torsion modules to identify the full ring"
        predicted_gain: >-
          may strengthen extraction, while also enlarging public leakage and
          changing the exact EndRing problem
    quantifier_order: >-
      For every accepted key, message and nonce, correctness is universal. For
      every PPT classical-ROM IND adversary A, the desired theorem requires a
      PPT EndRing solver B depending on A but not on hidden setup coins. Only
      the intermediate distinguisher is currently constructed.
    method_ceiling:
      strongest_certifiable_claim: >-
        Perfect accepted-key correctness and conditional classical-ROM IND-CPA
        under CEST-XFER-KI; no EndRing, quantum or concrete theorem.
      nearby_object_control: >-
        Scalar-only hashed DH has identical algebra but no complete ring role.
        A method that cannot separate it has not found an EndRing mechanism.
    proof_obligations:
      - claim: "real setup and canonical selection are polynomial and complete"
        responsibility: feasibility
      - claim: "actual-message correctness holds for every accepted key"
        responsibility: correctness
      - claim: "public data cannot compute same-scalar transfer"
        responsibility: interface
      - claim: "IND-CPA reduces to CEST-XFER-KI with the stated loss"
        responsibility: security_reduction
      - claim: "an IND attacker yields a complete AuxEndRing_CEST solution"
        responsibility: missing_security_reduction
      - claim: "all public auxiliary data is covered by every named assumption"
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: accepted-key correctness disagreements
      direction: lower
      minimum_effect: "exactly 0; one disagreement refutes the correctness claim"
    - metric: public scalar-transfer success probability
      direction: lower
      minimum_effect: >-
