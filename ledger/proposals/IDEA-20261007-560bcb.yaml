  minimal_test:
    design: >-
      Zero-run first stage: independently derive the algorithms and equality
      from scheme-contract.yaml, run symbolic public-data and known-false
      controls, and construct or refute each reduction arrow. If O1-O4 later
      survive, a separate approved toy implementation may enumerate accepted
      keys, messages and nonces, but no such experiment is run or approved by
      this record.
    controls:
      - kind: positive
        object: "accepted honest key and every symbolic r"
        expected: "psi_E([r]P)=[r]A and exact plaintext recovery"
      - kind: quotient
        object: "replace complete W by only the psi_E evaluator"
        expected: "identical Dec behavior, showing functionality alone does not identify EndRing"
      - kind: known_false
        object: "ciphertext additionally publishes S_snd, pad or plaintext"
        expected: "the random-world message-independence proof step fails"
      - kind: pairing
        object: "test a proposed transfer point S with e_q(P,S)=e_q(R,A)"
        expected: "decisional DH is publicly easy; only computation may remain"
      - kind: distribution
        object: "replace the real key sampler by a bare uniform-curve challenge"
        expected: "reduction halts absent a distribution compiler and witness pullback"
    required_metrics:
      - symbolic correctness verdict per validation branch
      - public transfer algorithm and cost bound
      - quotient transcript equality or collision certificate
      - exact reduction-arrow status and advantage loss
      - public-view coverage checklist
    stop_condition: >-
      Stop at the first broken O1-O4 gate or absent EndRing extraction arrow;
      retain the candidate and narrow result without inferring general
      impossibility.

  falsification_conditions:
    - >-
      Any accepted key, message and nonce for which recipient and sender hash
      different canonical strings refutes the correctness claim.
    - >-
      Two equivalent complete witnesses producing different canonical psi_E
      refute the selector definition.
    - >-
      A polynomial public ScalarTransfer(pk,R) algorithm with non-negligible
      success refutes recipient-only functionality.
    - >-
      Negligible accepted-key mass or superpolynomial selector/evaluator cost
      refutes efficient honest operation on the declared family.
    - >-
      A valid EndRing reduction that cannot simulate the real P,A auxiliary
      data or cannot output a complete ring refutes that proof attempt.
    - >-
      A reviewed correctly directed polynomial reduction from CEST-XFER-KI or
      IND-CPA to the exact EndRing problem would close the central open gap.

  confounders:
    - "The public pairing verifies transfer guesses and invalidates a DDH reading."
    - "The key sampler may land on a special, easier curve locus."
    - "A basis-dependent or noncanonical selector can make honest witnesses disagree."
    - "Finite q-torsion action may reveal only a quotient of the full ring."
    - "Random-oracle proofs in the classical ROM do not transfer automatically to the QROM."
