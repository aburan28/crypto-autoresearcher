  title: >-
    CEST-PKE: encode plaintexts with a cross-base scalar-transfer pad whose
    recipient evaluator is selected canonically from a complete End(E) witness
  class: composition

  claim: >-
    Suppose TrapCurveGen outputs a supersingular curve E, a complete evaluable
    witness W for End(E), a prime q and a polynomial-degree canonical
    noncentral endomorphism psi_E=CanonicalBoundedEnd(E,W,B) acting
    non-scalarly on E[q]. Let P have exact order q and A=psi_E(P) with
    e_q(P,A)!=1. The PKE candidate publishing (E,q,P,A), encrypting m with
    R=[r]P and pad H(pk,R,[r]A), and decrypting with pad
    H(pk,R,psi_E(R)) has perfect actual-message correctness on every accepted
    key because psi_E([r]P)=[r]A. Its classical-ROM IND-CPA game has a direct
    proposed reduction to the separately named CEST-XFER-KI game. No reduction
    from an IND attacker to complete EndRing is claimed: a complete EndRing
    solver breaks the scheme in the opposite direction, and decryption
    functionally factors through the strict quotient consisting only of a
    psi_E evaluator.

  mechanism: >-
    Replace public isogeny evaluation and label transport by scalar linearity.
    The sender knows the fresh scalar r and transfers from A to [r]A; the
    recipient knows an evaluable endomorphism and transfers from R=[r]P to
    psi_E(R). Key generation makes the endomorphism a deterministic function
    of the complete ring by enumerating bounded-degree noncentral ring elements
    and selecting the lexicographically first normalized rational map. This
    gives a precise correctness shell and an exact place to test whether the
    security dependency is really EndRing or merely hashed cross-base CDH.

  why_not_a_renamed_known_approach: >-
    The prior C-star, transporter, evaluator-reconstruction, recipient-lift and
    admission-decoder lanes attempted public isogeny-side operations or lifts.
    CEST-PKE performs no public isogeny composition: Enc uses only scalar
    multiplication on the published basis (P,A). Relative to the internal
    SÉTA pointer, the nearest comparison because both use secret endomorphism
    action, CEST-PKE replaces evaluated torsion-image ciphertext machinery by
    a hashed same-scalar rendezvous. Relative to the internal SiGamal and
    LIT-SiGamal pointers, it publishes neither an action label nor a transport
    diagram. These are unchecked deltas because no primary source was read in
    this task.

  novelty_status: unverified
