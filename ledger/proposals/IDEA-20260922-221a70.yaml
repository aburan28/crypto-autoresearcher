idea:
  id: IDEA-20260922-221a70
  question_id: RQ-DREG-c8ae8d
  added: '2026-09-22'
  proposed_by: idea-generator
  status: proposed
  title: Rebuilt Semaev system versus Vélu pullback
  class: control
  claim: >-
    For one F_p-rational ell-isogeny phi from E to E', with ell coprime to
    the group order, compare two presentations of the same point-decomposition
    problem. (R) rebuilds S_3 on E' from (a', b'). (P) substitutes the
    degree-ell rational map on x-coordinates into E's system and clears
    denominators. The attack stage is relation decomposition only, in an R1
    coordinate representation. The pullback is predicted to multiply
    generator degrees by ell; that prediction is heuristic H2, checked by
    exact polynomial arithmetic on this one isogeny, and it is not an unread
    theorem. If the apparent explosion is only that multiplier, (P) grows
    like ell and (R) has the same new_falls support as E. A classmate is a
    candidate low-degree outlier only if (R)'s fall profile drops while (P)
    scales by ell. If (R) rises above E on d_lf_obs or d_ff while (P) still
    scales by ell, the rebuilt profile exploded. That finished edge is not
    the multiplier match, not the drop, and not an unfinished matrix. If
    (R) matches (P) after the degree axis of (P) is divided by ell, and
    that common support differs from the support of E, the two
    presentations agree and the isogeny did not change the intrinsic
    degree between them. Agreement that is also the match with E is the
    multiplier reading, not this one. A matrix that does not finish is
    neither a drop, a rise, nor a match. The fall
    observable is new_falls as defined in IDEA-20260916-4b7c1e.
  mechanism: >-
    Object frame. Representation: R1, field coordinates on E and on E',
    plus the rational functions f, g in the map x(phi(P)) = f(x)/g(x).
    Attack stage: relation decomposition only. Operation set Sigma:
    Macaulay multiplication by monomials up to a frozen degree cap, and
    composition with that rational map followed by clearing denominators.
    Sigma is not the translation action. Trichotomy class of
    IDEA-20260806-c5d183: coordinate-dependent, because both presentations
    are properties of the equations, not of the group element. The
    projection discards the kernel of phi, the discrete logarithm, and the
    points, and retains the two new_falls vectors and the generator
    degrees. Those integers are lossy. They are reports of constructions
    Sigma performs; they are not claimed to propagate under translation.
    Vélu's formulas and the statement that a separable ell-isogeny induces
    a degree-ell map on x-coordinates are recalled and were not opened.
    H2 is how that recollection is tested. Shared instrument: new_falls,
    d_ff, and d_lf_obs from IDEA-20260916-4b7c1e, applied to E, to (R),
    and to (P). D_max on (P) must be at least ell times the cap used on E,
    or degrees of (P) past the cap are unmeasured rather than declared
    large. F2 is the component being presented two ways. F3 supplies the
    single edge and is not the lens.
  novelty_status: unverified
  citations:
    - ref: IDEA-20260916-4b7c1e
      provenance: internal
      claim: >-
        The fall-profile instrument. Applied here to three presentations
        of one edge. Not redefined.
      verified_by: idea-generator, lines 1-200 read 2026-09-22
    - ref: RQ-DREG-c8ae8d
      provenance: internal
      claim: >-
        Asks for the rebuilt system and the Vélu pullback as two
        presentations. Timeouts are not degree evidence.
      verified_by: idea-generator, full file read 2026-09-22
    - ref: IDEA-20260806-c5d183
      provenance: internal
      claim: Coordinate-dependent trichotomy class, representation rather than group element.
      verified_by: idea-generator, lines 1-70 read 2026-09-22
    - ref: RQ-ECDLP-623a32
      provenance: internal
      claim: R1 field representation of coordinates; stage is relation decomposition.
      verified_by: idea-generator, title and scope opening read 2026-09-22
    - ref: IDEA-20260901-2fb77b
      provenance: internal
      claim: >-
        Treats an ell-isogeny as a degree-ell rational map on
        x-coordinates and predicts a degree-inflation penalty for the
        pullback factor base. This control checks that penalty against
        the rebuilt system. It does not recount fibrations.
      verified_by: idea-generator, claim opening read 2026-09-22
    - ref: Vélu isogeny formulas and the x-coordinate rational map
      provenance: recalled
      claim: >-
        A separable isogeny of degree ell is given by rational functions,
        and the induced map on x-coordinates has degree ell. Not opened.
        H2 is the symbolic check that replaces this recollection.
    - ref: RQ-ICINV-475b5e
      provenance: internal
      claim: Parent question on within-class cost functionals. Cited, not restated.
      verified_by: idea-generator, title read 2026-09-22
    - ref: RQ-DREG-bd6c86
      provenance: internal
      claim: Parent question on solving-degree growth. Cited, not restated.
      verified_by: idea-generator, title read 2026-09-22
    - ref: RQ-VOLC-f6253b
      provenance: internal
      claim: Parent question on volcano depth. Cited, not restated.
      verified_by: idea-generator, title read 2026-09-22
    - ref: RQ-ECTD-001
      provenance: internal
      claim: Parent question on a rare endpoint. Cited, not restated.
      verified_by: idea-generator, title read 2026-09-22
  assumptions:
    - >-
      ell is coprime to the group order on the tested edge, so transport
      of the discrete log is the reason the two presentations are being
      compared. The degree check itself does not use that hypothesis.
    - >-
      f/g is the map the implementation actually substitutes. H2 is about
      those polynomials, not about a formula read from a paper.
    - >-
      IDEA-20260807-427cf3 is not assumed. (R) and E can differ at the
      same factor-base cardinality.
    - Same monomial order on E, (R), and (P).
  proof_search_map:
    bottleneck: >-
      An unfinished F4 run, or a degree-of-regularity value that cannot
      be planted. The control uses generator degrees, which are exact,
      and capped fall profiles.
    baseline_embedding:
      parameter_slice: >-
        The fall profile of E under IDEA-20260916-4b7c1e, before (R) and
        (P) are compared with it.
      reproduction_check: >-
        Rank identity for new_falls on E at every completed degree, then
        the same identity on (R) and on (P).
    observation_collision:
      observable: >-
        new_falls support of (R), and the support of (P) after dividing
        degrees by ell
      distinct_preimage_search: >-
        (R) and the scaled (P) are two presentations. The same support is
        a collision: the isogeny did not change the intrinsic degree.
        E and a gauge model of E are the coordinate null and must collide.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The pair of presentations (R) and (P) of one decomposition
          problem along one rational ell-isogeny.
        predicted_gain: >-
          Decides whether a degree change is the ell multiplier or a
          change in the rebuilt system. No ECDLP exponent gain.
    quantifier_order: >-
      There exists one toy rational ell-isogeny, ell in {2, 3, 5}, such
      that the symbolic degree check and both fall profiles finish. For
      all generators, H2 asserts total degree of the cleared pullback
      equals ell times the total degree on E. On every edge exactly one
      of M, C, N, X, or U applies, and M is not N. U is an unfinished
      matrix. M is support of (R) equal to support of E and support of
      (P) equal to ell times that set. C is a strict drop of d_lf_obs or
      d_ff on (R) against E while (P) still scales with E. N is scaled
      agreement of (R) with (P) whose common support differs from E. X is
      every other finished edge, including a strict rise of d_lf_obs or
      d_ff on (R) while (P) still scales with E. The minimal test does
      not quantify over every edge of a class.
    method_ceiling:
      strongest_certifiable_claim: >-
        On the tested edges, exactly one reading. M: the rebuilt profile
        is the domain profile and the pullback carries the multiplier.
        C: the rebuilt profile drops while the pullback still carries
        that multiplier. N: the two presentations agree after scaling and
        the common support differs from E, so this is not M. X: any other
        finished edge, including a rise of the rebuilt profile while the
        pullback still scales with E. U: an unfinished matrix. Toy tier
        only.
      nearby_object_control: >-
        The gauge orbit of j(E), which must reproduce E's profile, and
        one non-isogenous curve of the same order, whose rebuilt system
        is not a pullback of E and is not expected to match (P).
    proof_obligations:
      - claim: >-
          The integer ell used to scale degrees is the total degree of
          f/g actually substituted, and unfinished degrees of (P) are
          left unmeasured.
        responsibility: correctness
    not_applicable_reason: null
  predictions:
    - metric: cleared_pullback_degree_ratio
      direction: higher
      minimum_effect: >-
        On one rational ell-isogeny with ell in {2, 3, 5}, every cleared
        generator of (P) has total degree exactly ell times the total
        degree of the generator of E it came from. Any other positive
        integer withdraws H2 for that isogeny. Zero or an undefined
        degree after cancellation is a withdrawal, not a low-degree
        outlier.
    - metric: rebuilt_versus_pullback_reading
      direction: different
      minimum_effect: >-
        Exactly one of five labels, and M is not N. U: any required
        matrix did not finish. Otherwise the edge finished. M: the set of
        degrees with new_falls > 0 on (R) equals that set on E, and the
        set on (P) equals ell times that set, inside the degrees that
        finished. C: M does not hold, (R) has d_lf_obs strictly below
        d_lf_obs(E) or d_ff(R) strictly below d_ff(E), and (P) still
        matches the ell-scaled support of E on finished degrees. N: after
        dividing degrees of (P) by ell, the positive-fall set of (R)
        equals that scaled set, and that set differs from the
        positive-fall set of E. X: finished, and not M, C, or N. X
        includes a strict rise of d_lf_obs or d_ff on (R) above E while
        (P) still matches the ell-scaled support of E. Only C is a
        candidate low-degree outlier, and it still needs
        IDEA-20260922-f7de2a. X is not that candidate and is not
        unmeasured.
  minimal_test:
    design: >-
      Take one ordinary toy curve and one rational ell-isogeny, ell in
      {2, 3, 5}, degree coprime to the group order. Build E's S_3 system,
      the rebuilt system (R) on the codomain, and the cleared substitution
      (P). Record total degrees of every generator before any rank is
      computed. Then compute new_falls on each presentation up to a cap
      that covers E and (R), and up to ell times that cap for (P) where
      the matrix still finishes. Assign M, C, N, X, or U.
    controls:
      - Gauge orbit of j(E), same new_falls vector as E.
      - >-
        A random rational map of degree ell and the same bidegree shape
        as f/g, cleared the same way. If (P) matches that random
        substitution's degree pattern, the pattern is degree arithmetic,
        not isogeny structure. This comparison is reported beside
        M/C/N/X and does not by itself assign C.
      - Rank-identity check on one finished degree of each presentation.
      - Same factor-base rule and the same cardinality on E and on (R).
    required_metrics:
      - per-generator total degrees on E and on (P), and their ratio
      - new_falls supports of E, (R), and (P)
      - the label M, C, N, X, or U
      - whether the random degree-ell substitution matches (P)'s degree pattern
  falsification_conditions:
    - >-
      The degree ratio is not ell. H2 is false on that isogeny. No later
      sentence may say the pullback multiplies degrees by ell for that
      edge.
    - >-
      The label is N. The two presentations agree after scaling and the
      common support differs from E, so this is not the multiplier match.
      The isogeny did not change the intrinsic degree between the
      presentations on that edge. A class census that calls (P) an
      explosion without this label is measuring the multiplier.
    - >-
      The label is X. The edge finished and is not a low-degree outlier.
      A rise of (R) while (P) scales with E is X, not U and not C.
    - >-
      The label is U. The edge is unmeasured. It is not evidence that (P)
      is hard.
    - >-
      (R) drops, but the random degree-ell map drops by the same amount
      after rebuilding is replaced by substitution. The drop is then not
      an isogeny effect.
  confounders:
    - Denominator cancellation lowering a degree and being called an outlier.
    - Cap on (P) shorter than ell times the cap on E, so later falls are invisible.
    - Different monomial orders on (R) and (P).
    - ell sharing a factor with the group order.
    - Codomain model changed by a gauge transformation before rebuilding.
  interpretation_limits:
    - >-
      KN-OPEN-020: no new factor base. (P) is a presentation of the
      existing system, not a new relation source.
    - >-
      One edge does not decide O1, O2, or O3 for a class. Label C only
      nominates a pair for IDEA-20260922-805a59 and
      IDEA-20260922-f7de2a.
    - >-
      A flat profile does not prove the solving degree is small above
      the cap. H1 is not the Petit-Quisquater first-fall assumption.
    - >-
      ECDLP exponent unchanged. This control does not charge a walk and
      does not claim a faster discrete log.
    - Vélu's paper was not opened. H2 is not a citation of it.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Inside the cap, d_lf_obs tracks whether the solving degree of
        that same presentation is growing. This is not the
        Petit-Quisquater first-fall-degree assumption. A flat profile
        does not prove the solving degree is small above the cap.
      rigorous_support: >-
        none; this is the hypothesis under test. The rank identity in
        IDEA-20260916-4b7c1e is the fact being used as a meter, not a
        proof of the tracking claim.
      validation_plan: >-
        On E, if a degree-by-degree elimination finishes at some
        D* <= D_max, the highest degree it uses and d_lf_obs differ by
        at least 1 or they do not. A difference falsifies H1 on E.
        Parameters: the single toy edge. No transfer to cryptographic p.
        Tail check: zeros inside the cap are not reported as zeros above
        the cap, for E, for (R), and for (P) separately.
    - id: H2
      statement: >-
        Substituting x |-> f/g of degree ell into E's Semaev generators
        and clearing denominators multiplies each generator's total
        degree by ell. Stated as an identity to check on one toy
        isogeny, not as a theorem read from a source.
      rigorous_support: >-
        Imitates the composition-degree formula for nonconstant rational
        functions on the projective line, which was not opened this
        session. Clearing denominators can cancel factors, so that
        formula does not prove H2. none of the cleared-denominator
        equality is taken as proved; it is the hypothesis under test.
      validation_plan: >-
        One ordinary toy curve, one rational ell-isogeny, ell in
        {2, 3, 5}. Substitute the implementation's f/g, clear
        denominators over F_p, compare total degrees. Pass is equality
        with ell on every generator. Any other value withdraws H2 for
        that ell. This is an identity check, not a sample against a
        distribution.
  target_complexity:
    time_exponent: >-
      N^{1/2} for the ECDLP. No improvement is claimed.
    memory_exponent: >-
      O(1) for rho. The control stores three capped Macaulay matrices
      and the polynomials f, g.
    best_known: >-
      Pollard rho, time N^{1/2}, memory O(1). For the meter, one
      degree-capped rank profile, here paid three times on one edge.
    hidden_overhead: >-
      No attack exponent is claimed, so no o(1) term is hiding one.
      Label C still would not beat rho until a walk is charged, which
      this control does not do.
    tradeoff_note: >-
      One edge, exact arithmetic. Parallelism is irrelevant at this
      size. Not a rho tradeoff.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  dominated_by: >-
    As an ECDLP attack, Pollard rho dominates on time, memory, and
    queries. As a control, the comparison of (R) with a scaled (P) is
    not dominated by a single-curve fall profile or by a class census
    that never builds (P): those do not separate the multiplier from an
    intrinsic drop. Checked against IDEA-20260901-2fb77b, which predicts
    the inflation and compares an isogeny pullback with a random
    degree-ell map, and against IDEA-20260903-47f358, which mentions
    pullback of a factor base without this (R)-versus-(P) fall-profile
    split. Attack literature beyond rho was not surveyed; no attack is
    claimed.
  sota_delta: >-
    ECDLP time-exponent delta 0. Memory-exponent delta 0. Query delta 0.
    The control adds one symbolic degree comparison and two extra capped
    profiles on a single edge.
  discriminated_from: >-
    IDEA-20260731-016 compares classmates by several algebraic meters
    and can treat a non-finishing solve as hardness. This control
    compares two presentations of one edge and refuses that reading.
    IDEA-20260807-427cf3 is not assumed; (R) is allowed to differ from
    E at matched factor-base size.
    IDEA-20260807-8b9486 is about support at a = 0 and b = 0, not about
    pullback degree.
    IDEA-20260807-6eb96b is used as the gauge null on E, not reproposed.
    IDEA-20260807-f6137c: agreed that true degree of regularity is the
    wrong meter. Generator degrees and new_falls are the meters here.
    IDEA-20260807-899c5e: the reduced-basis degree is not the metric.
    IDEA-20260826-2259f8 stops at the first fall. This control compares
    the whole capped supports of (R) and (P).
    IDEA-20260903-47f358 searches for a lower first fall and argues
    constancy. This control is the explosion-versus-multiplier test
    that search does not contain.
    IDEA-20260916-4b7c1e is the instrument, applied to (R) and (P).
    IDEA-20260901-2fb77b predicts degree inflation from the count of
    fibrations. This record checks inflation on one explicit
    substitution against the rebuilt codomain system.
    Parent questions RQ-ICINV-475b5e, RQ-DREG-bd6c86, RQ-VOLC-f6253b,
    and RQ-ECTD-001 are cited and not restated.
