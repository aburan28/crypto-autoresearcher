idea:
  id: IDEA-20260807-4f43ac
  question_id: RQ-VOLC-f6253b
  added: '2026-08-07'
  title: >-
    WHAT IS A FREE LEVEL WORTH? End(E) admits a short certificate so verification
    is asymptotically cheaper than computation, and class-level volcano data
    amortizes to zero over many targets -- but a level oracle is a CURVE-ONLY
    CONSTANT and therefore trivially generic-group-simulable, so granting it for
    free changes nothing for any algorithm that does not also consume R1/R2/R5;
    the measurable corollary is that an x-coordinate-indexed precomputation does
    NOT transport across an isogeny, which answers lane L13's sharp question in
    the negative with a mechanism
  class: composition

  claim: >-
    (A) THE ASYMMETRY. KN-LIT-251 (Bisson-Sutherland, "Computing the endomorphism
    ring of an ordinary elliptic curve over a finite field", arXiv:0902.4670)
    records as a key claim: "As a byproduct, our method yields a short certificate
    that may be used to verify that the endomorphism ring is as claimed." THE
    ABSTRACT WAS READ; THE PAPER WAS NOT. Taking that claim at face value pending
    Stage 0 verification, End(E) sits in a verify-much-cheaper-than-compute
    regime. The same asymmetry holds, and is derivable here without citing anyone,
    for the volcano LEVEL: a descending path from E to the ell-floor, given as a
    list of j-invariants with kernel polynomials, is verified in O(h) Velu steps,
    whereas FINDING it costs O(ell * h^2) because each step must try up to ell+1
    neighbours. Verification is therefore cheaper by a factor of about ell * h,
    and this ratio is directly measurable at toy scale.

    (B) THE AMORTIZATION, WHICH SPLITS INTO A TRIVIAL CASE AND A REAL ONE.
    Class-level volcano data -- D_K, c, every height v_ell(c), the whole shape of
    every volcano -- depends ONLY ON THE TRACE t, hence is identical for every
    curve in the isogeny class. So it is computed once per class and amortizes to
    exactly zero over M targets. Per-CURVE level data does not amortize, but in
    the standard multi-target setting all targets live on ONE curve, so it is
    computed once too. THE ONLY SETTING WHERE LEVEL COST DOES NOT VANISH is
    multi-target across DIFFERENT curves of one class, and this record shows below
    that the setting has a much bigger problem than the level cost.

    (C) THE PUNCHLINE, AND IT IS A CLOSURE. Suppose the level -- or the whole
    endomorphism ring -- is handed to the attacker for free. Does anything change?
    THE LEVEL IS A FUNCTION OF THE CURVE ALONE. It does not depend on P, on Q, or
    on k. In the generic group model the curve is not part of the model at all;
    an oracle returning a fixed, publicly determined constant is simulated by a
    simulator that stores that constant and returns it. Hence A LEVEL ORACLE, AND
    INDEED AN End(E) ORACLE, IS GENERIC-GROUP-SIMULABLE, and by the Shoup bound
    an algorithm whose only other access is the group oracle remains at exponent
    1/2. This is the same argument shape KN-FIND-b7e091 uses to close the
    incidence and endomorphism-image oracles, applied to a new oracle class, and
    it is exactly the audit DECOMPOSITION lane L12 exists to perform. CONSEQUENCE
    FOR THIS LANE: a free level can only help an algorithm that also consumes
    R1, R2 or R5. Combined with IDEA-20260807-3c6bd8's finding that small-ell
    levels are cheap anyway, the cost of learning the level is simply not where
    the difficulty lives, in either direction.

    (D) THE MEASURABLE COROLLARY -- PREPROCESSING DOES NOT TRANSPORT. Lane L13
    asks: does a table built on E retain value on E' after transport? Here is a
    mechanism and a prediction. Index-calculus preprocessing is indexed by the
    FACTOR BASE, which is a set of x-COORDINATES defined by a vanishing or
    smallness condition (for example x < B, or x in a fixed subset V). An isogeny
    phi does NOT preserve x-coordinates: phi acts on x by a rational map of degree
    deg(phi), so the image of a smallness-defined factor base is a set of the same
    cardinality with, by prediction, NO smallness structure at all -- the fraction
    of phi(V) lying below B should be B/p, the value for a uniform random set.
    THE PREDICTION IS FALSIFIABLE IN BOTH DIRECTIONS: if some structure survives,
    even at degree 2, then preprocessing partially transports, L13 has a positive,
    and the surviving structure is an object worth naming. If nothing survives at
    degree 2, then transport destroys preprocessing at the very first step and
    L13's question is answered negatively with a mechanism rather than a shrug.

  resource_label: R8 (multi-instance / preprocessing structure), audited against R3/R4 acquisition cost; the transport measurement consumes R1
  admissibility: admissible
  admissibility_argument: >-
    Parts (A) and (B) are cost accounting and consume nothing. Part (C) is an
    ADMISSIBILITY VERDICT and it is negative: it establishes that a level oracle
    or an End(E) oracle is GGM-simulable, hence that any proposal consuming ONLY
    that oracle plus the group operation is inadmissible_generic_group and closed
    at exponent 1/2. Part (D) is admissible because the measured quantity is the
    distribution of x-COORDINATES as field elements (R1), which is not a group
    output and not simulable by the group oracle. The record therefore contains
    both an admissible measurement and an explicit inadmissibility finding, and
    labels which is which.

  discriminated_from:
    - >-
      KN-FIND-b7e091. That finding closes the INCIDENCE oracle and the
      ENDOMORPHISM-IMAGE oracle (which returns phi(G), phi(Q) -- group elements).
      This record closes a DIFFERENT oracle: one returning the LEVEL or the
      endomorphism RING, which are curve-only integers and ring data, not group
      elements. The simulation argument is even simpler (a constant is simulable)
      and the conclusion extends the finding's reach to a class it does not cover.
      The extension is stated as an extension, not as a rediscovery.
    - >-
      IDEA-20260807-3c6bd8. That audit prices ACQUISITION of the level. This one
      asks what the level is WORTH once acquired, and answers with a simulability
      argument plus an amortization schedule. Together they close the cost
      question from both ends: cheap to get, and worth nothing on its own.
    - >-
      DECOMPOSITION lane L13 / RQ-MTGT-2cabee. That lane asks the transport
      question; this record supplies a mechanism and a specific falsifiable
      prediction for it, at essentially zero compute. It does not attempt L13's
      full amortized-cost analysis and does not claim to.
    - >-
      IDEA-20260807-bb03d3. That record shows all curves in a class can be
      ascended to the crater cheaply but land on a TORSOR, so they do not converge
      to one curve. This record adds the second reason multi-target amortization
      fails even if they did converge: the table is x-coordinate-indexed and
      transport scrambles x-coordinates. Two independent obstructions to the same
      hope, deliberately kept separate so each can be falsified alone.

  object_first_candidate:
    tracked_object: >-
      THE FACTOR BASE AS A SET OF FIELD ELEMENTS -- specifically the indicator
      statistic "fraction of the set lying in the defining region" -- followed
      through one isogeny step. Secondarily, the (verify cost / compute cost)
      ratio for a level certificate, followed as (ell, h, log p) vary.
    lossiness: >-
      LOSSY: the factor base's statistic discards which points map to which, all
      group structure, and the curve equations at both ends. It is not a change of
      coordinates -- from "37 percent of the image lies below B" one cannot
      reconstruct the image, let alone the map. COMPATIBILITY: the statistic has a
      well-defined value after each isogeny step, so it propagates under the
      operation being studied, which is the requirement. Its propagation is
      predicted to be one-step total collapse to the uniform value, and a
      projection that collapses in ONE step is a legitimate tracked object whose
      survival score is simply 1 -- the inventor-protocol scoring permits a low
      survival score, it just requires the score to be stated.
    propagation: >-
      One isogeny step: V -> phi(V), a set of the same cardinality (phi is
      injective on x-coordinates only up to the +/- y identification, so
      cardinality is preserved up to the standard factor). Predicted statistic
      after one step: the uniform value B/p, i.e. total collapse.
    survival_score: >-
      PREDICTED 1 -- the structure dies at the first step. That is a genuinely low
      score and it is exactly the finding: an object that dies in one step tells
      you the operation destroys it, which is what L13 needs to know. If instead it
      survives 2 or 3 steps, the record's prediction is wrong and the surviving
      structure is the interesting object.

  mechanism: >-
    STEP 1 -- CERTIFICATE ASYMMETRY, MEASURED. Implement the level certificate:
    a descending path (list of (a, b) or j, plus the kernel polynomial and claimed
    direction at each step) from E to the ell-floor. Measure (i) the cost of
    FINDING it by Fouquet-Morain descent, (ii) the cost of VERIFYING a given path
    (recompute each Velu step, check each trace equals t, check the final vertex
    has exactly one rational ell-neighbour). Report the ratio as a function of
    (ell, h). Predicted ~ ell * h; measured is what counts.
    STEP 2 -- AMORTIZATION SCHEDULE. Compute, for M targets, the per-target cost
    of level knowledge in three settings: (a) all targets on one curve --
    amortizes to zero; (b) targets spread over M distinct curves of one class --
    per-target level cost stands, class data still amortizes; (c) targets spread
    over distinct classes -- nothing amortizes. Report the break-even M for each.
    This is arithmetic on the costs measured in IDEA-20260807-3c6bd8 and needs no
    new compute.
    STEP 3 -- THE SIMULABILITY ARGUMENT, WRITTEN OUT. Give the explicit simulator
    for a level oracle: on input "level of E", return the value stored at setup.
    Note the one condition under which the argument fails -- if the algorithm is
    allowed to CHOOSE the curve adaptively and the oracle answers about curves the
    simulator did not anticipate. Handle it: the level is computable from public
    data in the cost established by IDEA-20260807-3c6bd8, so the simulator
    computes it rather than storing it, at a cost that is polynomial for small ell.
    The argument is therefore uniform over adaptively chosen curves at small ell,
    and is stated as conditional at large ell. That conditionality is a real gap
    and it is named, not hidden.
    STEP 4 -- THE TRANSPORT MEASUREMENT. Fix a curve E and a smallness-defined
    factor base V = {x on E : x < B}. Apply phi of degree 2, 3, 5, 7 (composing to
    reach larger degrees), and after each step record: the fraction of the image
    x-coordinates below B; the Kolmogorov-Smirnov distance of the image
    x-distribution from uniform on [0, p); and the relation yield of an index
    calculus run using the IMAGE set as its factor base, compared against a fresh
    smallness-defined base of the same size on the codomain.
    STEP 5 -- THE NULL AND THE VERDICT. Compare against a random size-matched
    subset of the codomain's x-coordinates (the "already destroyed" reference) and
    against the codomain's own smallness base (the "not destroyed" reference).
    The image must sit at the first if the prediction holds.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Grep tool (ripgrep) on 2026-08-07 over ledger/, knowledge/, docs/,
      analysis/ for "certificate", "amortiz", "preprocessing", "transport",
      "simulable", "oracle". Read in full: KN-FIND-b7e091, KN-LIT-251, KN-LIT-309,
      DECOMPOSITION.md (L12 and L13), H-ENDO-001, harness/semaev.py,
      harness/fixed_curve_preprocessing.py (filename inspected; the module exists,
      indicating this program already has a preprocessing lane).
    results: >-
      KN-FIND-b7e091 closes exactly two oracle classes and neither is a level or
      ring oracle. The DECOMPOSITION's L12 entry explicitly scopes itself to
      "extend KN-FIND-b7e091 to the NEW oracle classes the other lanes invent",
      which is precisely what claim (C) does, so this record is executing a task
      the decomposition assigns rather than inventing a new one. L13's entry poses
      the transport question ("does a table built on E retain value on E' after
      transport, or does transport destroy it? This is a sharp, cheap question")
      and supplies no mechanism; claim (D) supplies one. No record in ledger/
      states the certificate-asymmetry ratio for a volcano level.
    verdict: >-
      ADAPTATION. The simulation argument is a two-line application of an argument
      already in the corpus; the certificate claim is relayed from an unread
      abstract; the transport prediction is elementary. The adaptation is the
      assembly and the decision to MEASURE the transport question rather than
      assert it.

  null_object_control: >-
    (N1) THE RANDOM-SUBSET NULL, primary: a uniformly random size-matched subset
      of the codomain's x-coordinates. The transported factor base must be
      STATISTICALLY INDISTINGUISHABLE from this if the destruction prediction
      holds. This is the "structure fully destroyed" reference.
    (N2) THE FRESH-BASE POSITIVE CONTROL: a smallness-defined base built directly
      on the codomain. It must be clearly DISTINGUISHABLE from N1 on the same
      statistics, or the instrument cannot detect the structure it is claiming is
      destroyed, and every negative it produces is void. This positive control is
      blocking and is the more important of the two.
    (N3) THE IDENTITY CONTROL: phi = identity (degree 1). The statistic must be
      unchanged. A pipeline that reports destruction under the identity map is
      broken.
    DECAY PARAMETER: the isogeny degree, and the number of composed steps. Genuine
    structure should decay MONOTONICALLY toward the N1 reference as degree or step
    count grows; the record's prediction is total collapse at the first step, so
    the honest artifact tell here is the OPPOSITE of the usual one: a statistic
    that stays away from the uniform value at high degree, and does so without a
    named mechanism, is the suspicious observation.

  assumptions:
    - >-
      KN-LIT-251's short-certificate claim is relayed from an abstract flagged in
      its own record as "claims are relayed from the paper's abstract without
      independent verification". NOT READ. Claim (A) is stated conditionally on it
      and the level-certificate half is derived here independently, so the record
      does not collapse if the citation is wrong.
    - >-
      The GGM simulation in (C) assumes the algorithm's non-group access is
      limited to the level/ring oracle. An algorithm also reading x-coordinates is
      outside the model and outside the closure, which is exactly the point.
    - >-
      The adaptive-curve-choice gap in Step 3 is real and the argument is uniform
      only at small ell, where the simulator can compute the answer itself.
    - >-
      Toy scale for all measurements: p <= 2^16, ell in {2, 3, 5, 7}, factor bases
      of a few dozen elements.
    - >-
      Velu's formulas act on x-coordinates by a rational map of degree deg(phi);
      standard, and verified operationally by checking that phi-hat composed with
      phi is [deg phi] on test points.

  proof_search_map:
    bottleneck: >-
      For the closure in (C): the simulator's ability to answer level queries about
      ADAPTIVELY chosen curves. That is the only step where the simulation could
      fail, and it is handled at small ell by having the simulator compute rather
      than store.
      For the measurement in (D): nothing is proved; the bottleneck is instrument
      sensitivity, addressed by the blocking positive control N2.
    baseline_embedding:
      parameter_slice: >-
        deg phi = 1 (identity) must reproduce the untransported statistic exactly.
        For the closure: an oracle returning a constant reduces to KN-FIND-b7e091's
        already-closed case when that constant is the trivial one.
      reproduction_check: >-
        Frozen fixture: identity map on a fixed factor base, exact equality of
        every statistic; plus a re-run of KN-FIND-b7e091's endomorphism-image
        simulator on the same instance to confirm the two arguments agree where
        they overlap.
    observation_collision:
      observable: >-
        The transported factor base's smallness statistic and KS distance from
        uniform.
      distinct_preimage_search: >-
        Search for two isogenies of DIFFERENT degree producing the same statistic.
        Expected to succeed immediately if the prediction of one-step collapse
        holds -- every degree gives the uniform value -- and that collision is a
        confirmation, not a falsifier, because it says the statistic saturates. The
        falsifying collision would be the reverse: a degree at which the statistic
        is NOT uniform, coinciding with one at which it is, indicating the
        statistic is not measuring what it claims.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the transported factor base's cardinality fixed and vary the
          isogeny; ask whether any intrinsic invariant of the image set (beyond
          cardinality) distinguishes images of structured bases from images of
          random bases. If one exists, preprocessing partially transports and it
          names the surviving structure.
        predicted_gain: >-
          Predicted: none survives. A surviving invariant would be the one genuine
          positive available in this record and would be a direct answer to L13.
    quantifier_order: >-
      CLOSURE (C): FORALL algorithms A whose non-group access is a level or
      End(E) oracle, THERE EXISTS a simulator S such that A's view is
      indistinguishable, hence A requires Omega(sqrt(N)) group operations. The
      simulator is allowed to depend on the curve family but NOT on k, and the
      argument is uniform over adaptively chosen curves only at small ell.
      MEASUREMENT (D): FORALL smallness-defined factor bases V and FORALL isogenies
      phi of degree >= 2 in the tested range, the image phi(V) is statistically
      indistinguishable from a uniform random subset of the same size. Stated as a
      universal because that is what makes it falsifiable by a single counterexample.
    method_ceiling:
      strongest_certifiable_claim: >-
        "A free level, or a free endomorphism ring, does not help any algorithm
        that otherwise only uses the group operation" plus "x-coordinate-indexed
        preprocessing does not survive one isogeny step at the tested scale". It
        can NEVER certify that the level is useless to an R1/R2/R5 algorithm --
        IDEA-20260807-cbe8c1 proposes exactly such an algorithm -- and it can
        never certify anything about a preprocessing scheme indexed by something
        other than x-coordinates.
      nearby_object_control: >-
        A preprocessing table indexed by an ISOGENY-INVARIANT quantity, if any
        exists -- for instance a table indexed by the class-group element rather
        than by x-coordinates. The method must be seen to say nothing about it. A
        version of this argument that appeared to also kill such a table would
        have proved too much and would be wrong.
    proof_obligations:
      - claim: A constant-valued oracle is GGM-simulable.
        responsibility: correctness
      - claim: The level is a function of the curve alone.
        responsibility: correctness
      - claim: The simulator handles adaptively chosen curves at small ell.
        responsibility: completeness
      - claim: Level-certificate verification is cheaper than computation by ~ell*h.
        responsibility: runtime
      - claim: Class-level volcano data amortizes to zero over M targets.
        responsibility: baseline
      - claim: phi acts on x by a rational map of degree deg(phi).
        responsibility: correctness
      - claim: The instrument can detect an undestroyed factor base (N2).
        responsibility: soundness
      - claim: The closure does not extend to R1/R2/R5 algorithms.
        responsibility: scope

  predictions:
    - metric: >-
        (cost of finding a level certificate) / (cost of verifying it), as a
        function of (ell, h)
      direction: higher
      minimum_effect: >-
        Ratio at least 3 at ell = 3, h = 2, and growing with both ell and h,
        fitted against the predicted ell * h. A ratio near 1 means the certificate
        carries no asymmetry and claim (A)'s level half is wrong.
    - metric: >-
        fraction of transported factor-base x-coordinates lying below B, after a
        degree-2 isogeny
      direction: different
      minimum_effect: >-
        Within 2 standard errors of B/p (the uniform value), i.e. TOTAL COLLAPSE
        AT THE FIRST STEP. Any reproducible excess over uniform, surviving N1 and
        with N2 passing, means structure partially transports and is a positive
        for lane L13 requiring independent review.
    - metric: >-
        relation yield of an index-calculus run using the transported base versus
        a fresh smallness base of the same size on the codomain
      direction: lower
      minimum_effect: >-
        Yield with the transported base statistically indistinguishable from yield
        with a random base of the same size, and clearly worse than the fresh
        smallness base. If the transported base performs like the fresh one,
        preprocessing transports and the record's central prediction is false.
    - metric: >-
        break-even number of targets M at which level-knowledge cost per target
        falls below 1 percent of the attack cost
      direction: lower
      minimum_effect: >-
        Predicted M = 1 in the same-curve setting, because class data and level
        data are both computed once. A break-even above 1 would mean level cost is
        non-amortizable, contradicting claim (B).
    - metric: >-
        an explicit simulator for the level oracle, written and checked
      direction: different
      minimum_effect: >-
        The simulator exists and its transcript is identical to the real oracle's
        on every query in the tested family. Failure to construct it -- especially
        in the adaptive-curve case -- is the interesting outcome and would leave a
        genuinely non-simulable oracle class open, which would be the first in this
        program.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE for claim (A)): read KN-LIT-251 and record
      what the certificate actually is and what it verifies. If the certificate
      claim is weaker than the abstract suggests, claim (A)'s first half is
      restated and the derived level-certificate half stands alone.
      STAGE 1 (minutes): write the simulator of claim (C) and check it on the
      tested family, including at least one adaptive query.
      STAGE 2 (hours): certificate find-versus-verify measurement over
      ell in {2, 3, 5} and h in {1, 2, 3}.
      STAGE 3 (hours): the transport measurement of Step 4 with N1, N2, N3.
      STAGE 4 (minutes): the amortization schedule arithmetic.
      This test needs the ell in {2,3} Velu code and the existing Semaev harness;
      no new heavy machinery.
    controls:
      - uniform random size-matched subset on the codomain (N1)
      - fresh smallness-defined base on the codomain (N2, blocking positive control)
      - identity isogeny (N3)
      - KN-FIND-b7e091's endomorphism-image simulator re-run for cross-agreement
      - matched rho and BSGS on domain and codomain, which must agree
    required_metrics:
      - find cost and verify cost per certificate, per (ell, h)
      - smallness fraction and KS distance to uniform, per isogeny degree and step
      - relation yield per factor-base variant
      - the simulator's transcript agreement rate
      - break-even M per amortization setting
      - pass/fail of every control, with N2's separation reported as an effect size

  falsification_conditions:
    - >-
      The simulator of claim (C) cannot be constructed for adaptively chosen
      curves even at small ell. The level oracle is then NOT simulable and the
      closure fails -- which would be a significant positive and would need
      independent review before anything else in this record is used.
    - >-
      Certificate find/verify ratio near 1. Claim (A)'s level half is false; the
      certificate has no value as a certificate.
    - >-
      Transported factor base retaining measurable smallness structure after a
      degree-2 isogeny, with N2 passing. Preprocessing partially transports; L13
      has a positive and this record's central prediction is refuted.
    - >-
      N2 failing to separate from N1 -- the instrument cannot tell a structured
      base from a random one. Every transport negative is then void; this is an
      instrument failure, not a mathematical result.
    - >-
      Reading KN-LIT-251 shows the certificate claim does not exist as relayed.
      Claim (A)'s citation half is withdrawn; the derived half stands.

  confounders:
    - >-
      The x-coordinate map identifies P and -P, so a factor base of x-coordinates
      corresponds to twice as many points; the cardinality bookkeeping across an
      isogeny must be exact or the "same size" comparisons are wrong by a factor
      of two.
    - >-
      At small p, B/p is not small and the uniform reference is close to the
      structured one, destroying the contrast. B and p must be chosen so N2
      separates from N1 by a large effect size BEFORE any transport is measured.
    - >-
      Composing many small isogenies is not the same as one large isogeny; the
      record measures composed small ones because that is what is implementable,
      and must say so rather than claiming a result about large-degree maps.
    - >-
      The "short certificate" of KN-LIT-251 may certify the RING and not the LEVEL,
      which are different objects. The record must not silently substitute one for
      the other, and the derived level certificate exists precisely so it does not
      have to.

  interpretation_limits:
    - >-
      Claim (C) is a closure over an ORACLE CLASS, not over the lane. It says a
      free level is worthless to a group-only algorithm, and explicitly says
      nothing about an R1/R2/R5 algorithm such as IDEA-20260807-cbe8c1's.
    - >-
      Claim (D) is measured at toy scale with composed small-degree isogenies and
      one style of factor base. It does not close preprocessing in general.
    - >-
      Claim (A)'s citation half is conditional on an unread abstract and is
      flagged as such in every use.
    - >-
      Nothing here changes any hypothesis status; the Coordinator alone does that.

  reachability_gate: >-
    THIS RECORD MOVES BETWEEN CURVES ONLY IN CLAIM (D), AND THE MOVE IS CHEAP AND
    ARBITRARY: any isogeny of degree 2, 3, 5, 7 will do, since the prediction is
    about the destruction of structure and not about arriving anywhere in
    particular. No good object needs to be reached, so the gate is passed
    trivially. The gate's relevance is INVERTED here: the record's finding is that
    even if a good curve WERE reachable, an x-coordinate-indexed precomputation
    could not be carried to it. That is a constraint on every future proposal that
    hopes to combine reachability with preprocessing, and it is cheaper to
    establish now than after such a proposal is built.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT. The closure asserts exponent 1/2 is preserved under a
      free level or End(E) oracle -- i.e. the oracle moves the exponent by exactly
      zero, which is the quantitative content. Certificate verification: O(h) Velu
      steps against O(ell * h^2) to find, a ratio of about ell * h.
    memory_exponent: >-
      Certificate size O(h) field elements. Amortized level storage O(1) per class
      plus O(1) per curve. All negligible; no memory tradeoff is created.
    best_known: >-
      Parallel rho at 0.886 sqrt(N), O(1) memory (KN-TECH-001, KN-TECH-006);
      automorphism-discounted rho (KN-TECH-018); BSGS at 2 sqrt(N) time and
      sqrt(N) memory (KN-TECH-031). For preprocessing specifically, the incumbents
      named in the DECOMPOSITION's L13 entry are the Bernstein-Lange / Mihailescu
      bounds and the AT^2 lower bounds -- NAMED THERE, NOT READ HERE, and any
      claim about preprocessing must be charged in that full-cost model, which
      this record does not attempt.
    hidden_overhead: >-
      Disclosed: (i) the simulation argument's adaptive-curve case is uniform only
      at small ell; (ii) the certificate ratio is measured at h <= 3, where h * ell
      is small, so the fitted trend is short-baseline; (iii) claim (A) depends on
      an unread abstract; (iv) composed small isogenies stand in for large-degree
      ones and the substitution is stated.
    tradeoff_note: >-
      The verify-versus-compute asymmetry is a genuine tradeoff and it is the one
      place this record contributes a positive: it means volcano structure can be
      PUBLISHED and cheaply checked, which matters for reproducibility of every
      other experiment in this lane even though it grants no attack advantage.

  dominated_by: >-
    AS AN ATTACK: mounts none and is dominated on every axis by every frontier row
