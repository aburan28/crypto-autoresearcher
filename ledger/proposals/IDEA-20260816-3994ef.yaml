      outer binomial tail.'
    results: 'Zero proposals in ledger/proposals/ mention a maximum likelihood decoder or an outer
      decoder as such. The HQC records treat the deployed two-stage decoder as the fixed object: H-HQC-18d1b4
      defines its space with ''the inner code ... decoded by maximum likelihood with the deployed
      deterministic tie rule'', i.e. ML PER BLOCK, which is precisely the composition whose cost this
      proposal measures; IDEA-20260808-9f9ed8 brackets the inner ML decoder analytically; IDEA-20260808-5d8b39
      factorises the model into three factors within the same two-stage structure; IDEA-20260805-15258a,
      db5afa and d21021 concern the error''s law rather than the decoder. EXP-HQC-982268''s objective
      is explicitly about the substitution turning a per-block bound into a binomial tail - an operation
      entirely inside the two-stage decomposition. No committed record compares the deployed decoder
      to any decoder of the whole concatenated code.'
    verdict: 'UNVERIFIED. No claim is made about published literature; this environment cannot read
      it, and the general fact that concatenated decoding is suboptimal relative to full ML is stated
      as elementary coding-theoretic reasoning verified here by direct computation, not as a citation.
      Claimed NEW relative to this repository: measuring P[D = 1] at all, and the n_e = 1 identity
      as a free executable null. ASSEMBLED FROM KNOWN PARTS: the pipeline, the inner ML decoder and
      the tie rule are H-HQC-18d1b4''s; the paired-on-identical-inputs estimator discipline is the
      campaign''s committed matched-pair method from EV-HQC-469c08; the exact decomposition P[deployed
      fails] = P[ML fails] + P[D = 1] is arithmetic.'
  object_first_candidate:
    tracked_object: The pair of decoder verdicts on one error vector - (deployed verdict, full-ML
      verdict) - and specifically its off-diagonal indicator D = 1{deployed fails, ML succeeds}. What
      is tracked is not a failure but a DISAGREEMENT between two decoders on the same input, followed
      across the composition ladder in n_e.
    lossiness: 'LOSSY. The pair of full decoder transcripts - two codeword decisions plus, on the
      ML side, a score over the entire outer codeword set - is projected onto a single bit D. Discarded:
      which codeword each returned, the margin of the ML decision, and the identity of the blocks
      responsible. The discard is compatible with the target operation because the quantity being
      decomposed, P[deployed fails], is itself a probability of a binary event, so the off-diagonal
      indicator is exactly the term the decomposition needs and nothing finer is required to state
      it. STAGE 4 deliberately un-discards one layer - decomposing D by cause - and that stage is
      honestly labelled as a richer object with a correspondingly higher risk of over-reading, rather
      than being folded into the headline number.'
    propagation: 'One step of the target operation is decoding one error vector. It acts on the tracked
      object by placing the trial in one of four cells: both succeed, both fail, deployed fails and
      ML succeeds (D = 1), or deployed succeeds and ML fails. The fourth cell must be EMPTY - a full-ML
      decoder cannot fail where a suboptimal decoder succeeds, since ML maximises the posterior over
      the same codeword set - so its count is a second free fail-closed gate on the implementation,
      and any occupancy there proves the ML decoder is not ML. Propagation across the ladder is in
      n_e: as blocks are added the composition has more opportunities to discard cross-block evidence,
      so the prediction is that P[D = 1] / P[deployed fails] grows with n_e.'
    survival_score: 'The object survives exactly as far as full ML remains computable, and that boundary
      is stated concretely rather than gestured at: the outer codeword set must be enumerable, so
      with an outer code of dimension k_out over GF(2^b) the ML search costs 2^{b k_out} block-score
      evaluations, which caps the ladder at roughly b k_out <= 24 for a run of this size. The survival
      score reported is therefore twofold: the largest n_e at which the exact comparison was executed,
      and the measured growth rate of P[D = 1] / P[deployed fails] across the executed ladder. Both
      are concrete and neither is extrapolated.'
  null_object_control: 'TWO nulls, both free and both executable in the same invocation. NULL-1, the
    n_e = 1 identity: with a single inner block the deployed decoder is maximum likelihood for the
    whole code, so D must be exactly 0 over the entire corpus. NULL-2, the empty-cell gate: the cell
    ''deployed succeeds, ML fails'' must be exactly empty at every n_e, because ML cannot lose to
    a suboptimal decoder on the same codeword set. FOR THE SIGNAL ARM TO MEAN ANYTHING BOTH MUST HOLD
    EXACTLY: a non-zero D at n_e = 1 proves the comparison or the ML implementation is wrong; a non-empty
    fourth cell proves the ML decoder is not ML. Neither is a statistical test - both are exact zero
    requirements, which is the strongest control available and costs nothing to run. A third, positive
    control: at a deliberately weakened outer radius the gap must widen in the predicted direction,
    demonstrating the instrument responds to the composition rather than to noise.'
  discriminated_from:
  - EXP-HQC-982268 and H-HQC-18d1b4 measure joint moments of block failures INSIDE the two-stage decomposition;
    the composition is their fixed frame. This measures the cost of that frame, which their estimand
    cannot express because it presupposes it.
  - IDEA-20260808-9f9ed8's second-order Bonferroni bracket bounds the inner ML decoder's failure probability
    analytically. That is a bound on one stage; this measures the loss from composing two stages,
    which no single-stage bound addresses.
  - IDEA-20260808-5d8b39 factorises the DFR model into three factors and argues two are measurable
    at deployed parameters. That factorisation lives inside the two-stage structure; the composition
    gap is a term that factorisation does not contain.
  - 'A proposal to build a better decoder for HQC would be a design contribution and would need to
    argue practicality. Nothing here proposes changing HQC: the full-ML decoder is an instrument confined
    to sizes where it is affordable, and its impracticality at deployed parameters is stated rather
    than worked around.'
  - A generic 'compare two decoders' study would report two failure rates. The design here reports
    the exact four-cell contingency with two cells forced to exact zero by mathematics, which is what
    makes it an instrument with fail-closed gates rather than a comparison.
  assumptions:
  - Exact ML over the concatenated code is affordable when the outer codeword set is enumerable, which
    caps the ladder; this is a size constraint that is respected rather than an approximation that
    is made.
  - The deployed decoder's inner stage is per-block ML with the deterministic tie rule, and its outer
    stage is bounded-distance - both taken from H-HQC-18d1b4's own statement of the setting.
  - ML cannot fail where the deployed decoder succeeds on the same codeword set; this is the basis
    of the empty-cell gate and is elementary, and the gate tests the implementation rather than the
    mathematics.
  - Pairing on identical error vectors is exact, so D is a per-trial observation and its variance
    scales with P[D = 1] rather than with the failure rate.
  - No conclusion transfers to deployed parameters, where full ML is not computable and the measurement
    cannot be made.
  predictions:
  - metric: D at n_e = 1, over the whole corpus
    direction: lower
    minimum_effect: 0.0
  - metric: count in the cell 'deployed succeeds, ML fails', at every n_e
    direction: lower
    minimum_effect: 0.0
  - metric: ratio P[D = 1] / P[deployed fails] at n_e = 7
    direction: higher
    minimum_effect: 0.05
  - metric: ratio P[D = 1] / P[deployed fails] as n_e increases across the ladder
    direction: higher
    minimum_effect: monotone increase across the executed rungs; a non-monotone ratio is treated as
      an instrument artefact and the growth claim is withdrawn.
  minimal_test:
    design: 'Two rungs and two gates, one invocation. Fix an inner code RM(1,4) of length 16 and an
      outer code over GF(16) with dimension 2, so the outer codeword set has 256 members and exact
      concatenated ML costs 256 block-score evaluations per trial. Run n_e = 1 and n_e = 5 at T =
      10^5 each, decoding every error vector with both the deployed two-stage decoder and the exact
      ML decoder, and fill the four-cell contingency at each rung. Require D = 0 exactly at n_e =
      1 and the fourth cell empty at both. Report P[D = 1] / P[deployed fails] at n_e = 5. This discriminates
      because the two exact-zero gates catch an incorrect ML implementation before any gap number
      is read, and because a single rung above n_e = 1 already establishes whether the composition
      costs anything measurable. Cost: minutes of single-core CPU.'
    controls:
    - 'n_e = 1 identity null: D must be exactly zero, fail-closed.'
    - 'Empty-cell gate: ''deployed succeeds, ML fails'' must be exactly empty at every rung, fail-closed.'
    - Pairing on identical error vectors so D is a per-trial observation with cancelled variance.
    - Weakened-outer-radius positive control, where the gap must widen in the predicted direction.
    - Independent verification that the ML decoder's score is the true correlation sum, by exhaustive
      comparison against brute-force enumeration at the smallest rung.
    required_metrics:
    - four-cell contingency (both succeed / both fail / D = 1 / fourth cell) at each n_e
    - P[deployed fails], P[ML fails] and P[D = 1] at each n_e with intervals
    - ratio P[D = 1] / P[deployed fails] at each n_e
    - 'decomposition of D by cause: wrong-inner-codeword versus outer-radius-exceeded'
    - largest n_e at which exact ML was executed and its cost per trial
  falsification_conditions:
  - 'D is non-zero at n_e = 1: the ML implementation or the pairing is wrong and no gap number is
    reportable.'
  - 'The fourth cell is non-empty at any rung: the ML decoder is not ML and the instrument is void.'
  - 'P[D = 1] is indistinguishable from zero at every executed n_e: the composition costs nothing
    measurable at these sizes, and that bound licenses reading deployed-decoder measurements as code
    measurements at the tested scale - a clean recorded obstruction.'
  - 'The ratio is non-monotone in n_e: the growth claim is withdrawn and the ratio is reported per
    rung without a trend.'
  - 'The weakened-radius positive control does not widen the gap: the instrument does not respond
    to the composition and its null result is uninterpretable.'
  confounders:
  - 'Outer-code choice: the gap depends on the outer code''s parameters, so a result at one outer
    code says little about another, and the ladder varies n_e at fixed outer rate to keep the comparison
    meaningful.'
  - Tie handling differing between the two decoders, which would populate the forbidden fourth cell
    for a reason unrelated to optimality; controlled by using the identical tie convention in both.
  - The affordable ML regime having outer dimensions so small that the outer code is unrepresentative
    of the deployed structure.
  - Elevated failure rates chosen for statistical power pushing the channel into a regime where the
    composition behaves differently than at low rates.
  - Shared randomness between the arms is intentional here, so any apparent variance reduction must
    be reported as pairing rather than as precision.
  interpretation_limits:
  - A positive gap means the deployed decoder leaves correctable errors uncorrected, which is a design-margin
    observation and not an attack; a better decoder lowers the failure rate.
  - The gap is measured at outer dimensions small enough for exact ML and does not extrapolate to
    deployed outer codes without a numbered heuristic, which is not offered.
  - Nothing here evaluates the analytic DFR model, whose correctness is a separate question.
  - The four-cell decomposition is exact but says nothing about which of the two probabilities the
    specification's model is trying to approximate; that question is raised by the measurement and
    not answered by it.
  target_complexity:
    time_exponent: No attack exponent is claimed. Exact concatenated ML costs O(|outer codeword set|
      * n_e) block scores per trial, which is 2^{b k_out} * n_e and is the binding constraint; the
      deployed decoder costs O(n_e * 2^m * m).
    memory_exponent: No attack memory exponent is claimed. Storage is the per-block correlation array
      plus the four-cell counters, i.e. kilobytes.
    best_known: The incumbent is the deployed two-stage decoder itself as implemented for EXP-HQC-982268,
      whose failure rate is the quantity the campaign reports. There is no incumbent full-ML comparison
      for HQC in this repository, so the gap has no prior measured value.
    hidden_overhead: 'The binding hidden cost is the outer codeword set''s size: exact ML is affordable
      only for outer dimensions far smaller than anything deployed, so the honest reach of the instrument
      is narrow, and defending the tested outer codes as informative is human argument rather than
      compute. A second is that decomposing D by cause in STAGE 4 is where an instrument quietly becomes
      an interpretation, and it needs its cause taxonomy fixed in advance or it will be fitted to
      whatever the data shows.'
  dominated_by: n/a (no result claimed) - no attack cost triple exists, so no Pareto frontier row
    applies and 'null' would be a fabrication under AGENTS.md rule 5. On the measurement axis, EXP-HQC-982268
    and EV-HQC-b71230 dominate on trial count, scale and certification depth, and do not address the
    composition gap at all; IDEA-20260808-9f9ed8's analytic bracket, if executed, would dominate on
    compute and address a different term.
  sota_delta: 'no attack; conceptual/measurement contribution only. Quantitatively: the repository
    reports deployed-decoder failure statistics at 1e7 trials and holds no value whatsoever for P[D
    = 1] or for the ratio P[D = 1] / P[deployed fails]; this run produces both across an n_e ladder
    with two exact-zero gates. The delta is a new decomposition term, not a better estimate of an
    existing one.'
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'By part. (i) That exact concatenated ML is implementable and passes the
    n_e = 1 identity null: ~0.85. (ii) That the forbidden fourth cell stays empty, confirming the
    implementation really is ML: ~0.8 - this is the gate I expect to catch a bug first, and catching
    one there is a success of the design. (iii) That P[D = 1] is strictly positive and measurable
    at n_e = 5 or above: ~0.8, since concatenated decoding discards cross-block evidence by construction.
    (iv) That the ratio grows monotonically with n_e: ~0.6. (v) That the affordable outer dimensions
    are large enough for the result to be interesting rather than degenerate: ~0.5, and this is the
    weakest link. (vi) That the run yields a defensible bound or value for the composition gap: ~0.85.'
