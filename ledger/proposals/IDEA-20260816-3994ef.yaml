idea:
  id: IDEA-20260816-3994ef
  question_id: RQ-HQC-001
  added: '2026-08-16'
  title: Separate the claim that HQC's failure model is wrong from the claim that its two-stage decoder
    is suboptimal by running a genuine maximum-likelihood decoder for the WHOLE concatenated code
    beside the deployed inner-then-outer decoder on identical error vectors, at reduced parameters
    where full maximum likelihood is affordable
  class: composition
  claim: '(A) THE CONFLATION THIS SEPARATES. ''HQC''s decoding failure rate'' names two different
    quantities that the campaign''s measurements do not distinguish: the probability that the DEPLOYED
    two-stage decoder fails, and the probability that the concatenated CODE cannot be decoded correctly
    at all. The gap between them is decoder suboptimality, and it is a property of the composition
    - decode each inner block independently, then hand hard symbol decisions to a bounded-distance
    outer stage - rather than of the code or of the analytic model. Nothing in this repository measures
    it. (B) THE CLAIM. At reduced parameters the gap is directly measurable. Define D := 1{the deployed
    decoder fails AND a maximum-likelihood decoder of the whole concatenated code succeeds} on the
    same error vector. Then P[deployed fails] = P[code fails under ML] + P[D = 1], an exact decomposition
    with no modelling, and P[D = 1] is the composition''s cost. The claim is that P[D = 1] is measurable,
    is strictly positive for n_e greater than 1, and that its ratio to P[deployed fails] is the number
    that tells a reader how much of any model-versus-measurement discrepancy could ever be a decoder
    story rather than a model story. (C) THE NULL THAT COMES FOR FREE. At n_e = 1 the deployed decoder
    IS maximum likelihood for the whole code, so D must be exactly zero. That is an executable null
    in the same invocation requiring no separate construction, and it is a fail-closed gate: any non-zero
    D at n_e = 1 proves the ML implementation or the comparison is wrong before any n_e > 1 number
    is read. (D) WHAT IS NOT CLAIMED. No attack, no break, no security consequence. A positive P[D
    = 1] means the deployed decoder leaves correctable errors uncorrected - which, if anything, is
    a DEFENSIVE observation about a design margin, and it is emphatically NOT a decryption-failure
    attack, since a better decoder lowers the failure rate. It is not claimed that a full-ML decoder
    is practical at deployed parameters; it is not, and the design confines itself to sizes where
    it is affordable. Nothing is claimed about the correctness of the specification''s analytic model,
    which this run does not evaluate. No attack, break, speedup or security consequence is claimed
    here or would follow from a run. No statement is made about what the published literature does
    or does not contain; this environment cannot reach external literature. No direction is declared
    impossible.'
  mechanism: 'STAGE 1: build the full-ML decoder for the concatenated code at sizes where it is affordable.
    For n_e blocks of an inner code with 2^{m+1} codewords and an outer code with a small number of
    codewords, exact ML over the concatenation is a search over the outer code''s codeword set, scoring
    each by summing per-block correlations. At small outer dimensions that set is enumerable, so ML
    is exact rather than approximate - this is what fixes the affordable regime and it is stated as
    a size constraint, not as an approximation. STAGE 2: the n_e = 1 null. Run both decoders at n_e
    = 1 and verify D is exactly zero over the whole corpus, which gates everything downstream. STAGE
    3: the composition ladder. Run both decoders on identical error vectors at n_e in {2, 3, 5, 7,
    12, 18} and measure P[deployed fails], P[ML fails] and P[D = 1] at each, reporting the exact decomposition
    and the ratio P[D = 1] / P[deployed fails]. Pairing on identical error vectors makes D a per-trial
    observation with almost all variance cancelled. STAGE 4: attribute the gap. Decompose D by cause
    - whether the deployed decoder failed because an inner block decoded to a wrong codeword that
    ML would have rejected using cross-block evidence, or because the outer bounded-distance radius
    was exceeded - which turns a scalar gap into a mechanism. Refutation: a P[D = 1] indistinguishable
    from zero at every n_e means the composition costs nothing measurable at these sizes, which is
    a clean bound and a licensing result for reading deployed-decoder measurements as code measurements.'
  novelty_status: unverified
  novelty_screen:
    method: 'Ran, from /home/user/crypto-autoresearcher: `grep -ril "hqc" --include=*.yaml --include=*.md
      .` (33 proposal files match), then extracted question_id and title for every one of those 33
      with a python3/yaml one-liner; `grep -ril "quasi-cyclic" ledger/proposals/` (8 files), `grep
      -ril "cyclic shift" ledger/proposals/` (7), `grep -ril "Reed-Solomon" ledger/proposals/` (2),
      `grep -ril "outer decoder" ledger/proposals/` (0), `grep -ril "syndrome weight" ledger/proposals/`
      (0), `grep -ril "local exponent" ledger/proposals/` (0), `grep -ril "failure boosting" ledger/proposals/`
      (7), `grep -ril "mutual information" ledger/proposals/` (15), `grep -ril "rejection sampling"
      ledger/proposals/` (19), `grep -ril "weight distribution" ledger/proposals/` (10), `grep -ril
