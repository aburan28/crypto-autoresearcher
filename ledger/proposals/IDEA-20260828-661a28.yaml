idea:
  id: IDEA-20260828-661a28
  question_id: RQ-MLKEM-001
  added: '2026-08-28'
  proposed_by: idea-generator
  status: proposed
  title: >-
    Does ML-KEM's exact CBD(eta) range constraint lower the Gröbner-basis
    degree of regularity below the binary/uniform-secret baseline enough to
    matter? A toy-scale, null-and-positive-controlled test of Steiner's
    algebraic-attack framework against FIPS 203's real noise law
  class: measurement

  claim: >-
    Steiner (arXiv 2402.07852 / ePrint 2024/313), retrieved this session at
    abstract level only, develops a degree-of-regularity framework for
    estimating Gröbner-basis attack cost on LWE, reporting sub-exponential
    complexity ESTIMATES for LWE with BINARY secret and BINARY error -- a
    far sparser, lower-entropy noise law than ML-KEM's actual CBD(eta),
    eta in {2,3}. No record in RQ-MLKEM-001's corpus applies any
    Gröbner/algebraic-degree framework to ML-KEM's real noise law; the
    corpus's existing CBD-related work is either statistical scoring for
    lattice reduction (IDEA-20260805-2b94fe) or combinatorial guess-then-
    decode against a DIFFERENT sparse-secret paper (IDEA-20260813-17acdf).
    This proposal tests, at TOY ring dimension, whether encoding CBD(eta)'s
    bounded support as a polynomial range constraint yields a MEASURABLY
    LOWER Gröbner degree of regularity than a matched uniform-secret null,
    and whether re-encoding CBD(eta) via 2*eta auxiliary BINARY variables
    (rather than one range-bounded variable) yields a further, competitive
    reduction relative to Steiner's own studied binary-secret case. H0
    (expected): CBD's advantage over uniform scales smoothly with support
    size and stays far short of anything competitive with BKZ at ML-KEM's
    real parameters -- algebraic attack remains dominated. H1 (falsifying,
    hypothesis-generating only per RQ-MLKEM-001's own toy-instance
    constraint): the auxiliary-binary re-encoding shows a materially larger
    advantage than the direct range constraint, warranting a scaled-up
    follow-up.

  mechanism: >-
    Instantiate FOUR toy arms at matched (n, k, q): (a) UNIFORM-secret null,
    no range constraint; (b) BINARY-secret/binary-error, reproducing
    Steiner's own studied case as a positive-control baseline; (c) CBD(eta)
    encoded directly via a single range-constraint polynomial per coordinate,
    product_{v in support(CBD(eta))}(x_i - v) = 0 (degree 2*eta+1); (d)
    CBD(eta) encoded via 2*eta auxiliary binary variables (x_i = sum b_j -
    sum b_j', each b degree-2 constrained), a standard linearization
    technique from algebraic/MQ modeling applied here to LWE noise for the
    first time in this corpus. Compute a Gröbner basis (degrevlex) for each
    arm's defining ideal and record the degree of regularity (max degree
    reached). First verify (b) and (c)/(d) produce the SAME solution variety
    on a planted instance (encoding-equivalence check) before comparing
    degrees of regularity across arms.

  novelty_status: unverified

  citations:
    - ref: "Matthias Johann Steiner, 'The Complexity of Algebraic Algorithms for LWE', arXiv:2402.07852 / ePrint 2024/313"
      provenance: recalled
      claim: >-
        Develops a degree-of-regularity/Macaulay-bound framework for
        Gröbner-basis attacks on LWE, reporting sub-exponential complexity
        estimates for general, binary-secret, binary-error LWE.
      verified_by: null
    - ref: IDEA-20260813-17acdf
      provenance: internal
      claim: >-
        Establishes the precedent discipline of testing whether an attack
        calibrated for a DIFFERENT secret distribution (there: Hou-Jiang's
        sparse-secret decoding speedup) survives at ML-KEM's actual dense
        CBD weights; this proposal applies the same discipline to a
        different (algebraic/Gröbner, not decoding) mechanism.
      verified_by: "idea-generator subagent (title/claim excerpt read this session; full record not read)"
    - ref: KN-TECH-075
      provenance: internal
      claim: >-
        Documents that solving-degree/Gröbner-attack estimates for
        algebraically simple designs have historically been miscalibrated
        and moved substantially once measured directly on the real system
        rather than assumed from a security argument -- the direct
        justification for this proposal's own null/positive-control
        discipline rather than trusting Steiner's abstract at face value.
      verified_by: "idea-generator subagent (read in full this session)"
    - ref: IDEA-20260805-690de8
      provenance: internal
      claim: >-
        Records that as of 2026-08-05 this container's environment has numpy
        available but sympy/sage/estimator raise ModuleNotFoundError --
        directly bears on whether this proposal's Gröbner stages are
        executable at all.
      verified_by: "idea-generator subagent (read in full this session)"
  assumptions:
    - >-
      That Steiner's abstract-level claim (sub-exponential estimates for
      binary-secret/binary-error LWE) is representative of the paper's
      actual content; Stage 0 of minimal_test explicitly re-attempts
      retrieval before this is relied upon further.
    - >-
      That the standard auxiliary-binary-variable linearization technique
      applies without modification to a SIGNED, symmetric-around-zero
      variable like CBD(eta) (as opposed to an unsigned bit-string); the sign
      convention is worked out explicitly in Stage 2, not assumed.

  proof_search_map:
    bottleneck: >-
      Whether CBD(eta)'s specific algebraic shape (difference of two
      independent Bin(eta,1/2) variables) admits a lower-degree polynomial
      encoding than its support size alone would predict for a generic
      bounded variable.
    baseline_embedding:
      parameter_slice: >-
        Binary-secret/binary-error LWE at the SAME toy (n,k,q) is Steiner's
        own best-studied case and is reproduced here as arm (b) rather than
        read off the (unread) paper's numbers.
      reproduction_check: >-
        Direct Gröbner computation of arm (b) at n=8..16; report the measured
        degree of regularity and flag any inconsistency with Steiner's
        general claim once/if the PDF is obtained.
    observation_collision:
      observable: "the degree of regularity of each arm's defining ideal"
      distinct_preimage_search: >-
        Encodings (c) and (d) of the SAME planted CBD(eta) instance must
        share the identical solution variety (checked directly by exact
        ideal-membership testing) despite differing in polynomial degree
        structure -- this is the collision the proposal exploits, not one it
        must avoid.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Re-encode CBD(eta) via 2*eta auxiliary binary variables, moving to
          a representation where Steiner's own binary-secret result is
          directly applicable to the transformed (higher-dimensional,
          lower-degree) system, with separate encoding-equivalence,
          completeness and cost-loss obligations tracked explicitly.
        predicted_gain: >-
          Not pre-specified; this is the genuinely open quantity the
          experiment measures (see predictions #2).
    quantifier_order: >-
      FOR the specific toy (n,k,q) cells tested, does the CBD-shaped ideal's
      measured degree of regularity fall strictly between the uniform and
      binary arms, or does the auxiliary-binary re-encoding place it at or
      below the binary arm? This is a per-cell empirical question, not a
      universal asymptotic claim, and is not extrapolated to n=256 by this
      record alone.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most, a measured degree-of-regularity ranking among four TOY-SCALE
        arms (n<=32), with an explicit, pre-registered decision rule for
        whether that ranking would matter if (unverified) extrapolated to
        n=256.
      nearby_object_control: >-
        The binary-secret/binary-error arm is the nearby object where an
        algebraic advantage is claimed by the literature; if this harness
        cannot show ANY separation between it and the uniform null, the
        harness -- not the mathematics -- has not identified the
        load-bearing structure.
    proof_obligations:
      - claim: "encodings (c) and (d) of the same planted instance share one solution variety"
        responsibility: correctness
      - claim: "binary-secret arm shows lower degree of regularity than uniform in this harness"
        responsibility: baseline
      - claim: "CBD-vs-uniform gap is reported per (n,k) cell, not asserted as monotone without checking"
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: "empirical degree of regularity, CBD(eta) range-constraint encoding vs matched uniform null, at n in {8,16}"
      direction: different
      minimum_effect: >-
        Strictly lower than the uniform null by at least 1 at every tested
        cell; a null result (indistinguishable from uniform) is itself
        reported as informative.
    - metric: "empirical degree of regularity, CBD(eta) auxiliary-binary encoding vs CBD(eta) range-constraint encoding, same planted instance"
      direction: lower
      minimum_effect: >-
        No magnitude pre-specified -- this is the open quantity. PRE-
        REGISTERED DECISION RULE: a drop of >= 2 that, extrapolated via
        Steiner's own (once-confirmed) asymptotic form, would cross below
        this program's pinned BKZ bit-security estimate for ML-KEM at
        n=256 makes this the highest-priority successor in the lane;
        otherwise the lane is closed with a measured ratio.
    - metric: "reproduction fidelity of the binary-secret/binary-error arm against Steiner's claim (once independently confirmed)"
      direction: different
      minimum_effect: >-
        Exact match not expected at toy scale; report the measured value and
        whether growth across n=8,16,32 is at least directionally consistent
        with a sub-exponential-looking trend.

  minimal_test:
    design: >-
      Stage 0 (~1-2h, zero compute): retry fetching the Steiner PDF via an
      alternate route (HTML abstract, mirror, or ePrint HTML) since this
      session's fetch returned HTTP 429; record the exact result either way.
      Stage 1 (minutes, zero compute): confirm actual Gröbner-capable tooling
      in this container (per IDEA-20260805-690de8, sympy/sage were absent as
      of 2026-08-05 -- re-check, since this changes what is executable).
      Stage 2 (hours, gated on Stage 1): build the four arms at n=8, k in
      {1,2}, small toy q; compute Gröbner bases and record degree of
      regularity for each; run the encoding-equivalence check first. Stage 3
      (hours, gated): repeat at n=16, 32 if tractable, checking whether the
      CBD-vs-uniform gap grows, shrinks, or stays flat with n.
    controls:
      - >-
        NULL (uniform secret, matched n/k/q): CBD arms must not score WORSE
        (higher degree of regularity) than this, or the encoding is broken.
      - >-
        POSITIVE (binary-secret/binary-error, Steiner's own case): must show
        lower degree of regularity than uniform; if it does not, the harness
        is broken and no CBD result may be reported.
      - >-
        ENCODING-EQUIVALENCE CHECK (zero extra compute beyond ideal-
        membership testing): confirm range-constraint and auxiliary-binary
        encodings of the same planted CBD instance share one solution
        variety before their degrees of regularity are compared.
      - >-
        GRADED, n in {8,16,32}: report whether the CBD-vs-uniform gap is
        flat, growing, or shrinking with n.
    required_metrics:
      - "degree of regularity per arm per (n,k) cell"
      - "wall-clock and pair-count per arm as a secondary cost proxy"
      - "solution-variety equality result between the two CBD encodings"
      - "environment check output: which CAS, exact version"

  falsification_conditions:
    - "Any CBD arm shows a HIGHER degree of regularity than the uniform null at any cell"
    - "The binary-secret positive control fails to show any advantage over uniform"
    - "The two CBD encodings disagree on solution variety"
    - "No Gröbner-capable tool is available at all (infrastructure outcome per AGENTS rule 3; report Stages 0-1 only)"

  confounders:
    - "TOY SCALE ONLY. n<=32 is far from n=256; per KN-TECH-075, solving-degree behavior for structured systems is scale-sensitive and sometimes non-monotonic -- no extrapolation is asserted."
    - "MODULUS MISMATCH. Toy q must be small for tractability, changing the noise-to-modulus ratio from real ML-KEM; reported as a divergence, not silently matched."
    - "TOOLING AVAILABILITY. sympy's native Gröbner routine is slow and may not reach n=32; Stage 3 may be infrastructure-gated."
    - "SECOND-HAND BASELINE. Absent a successful Stage-0 refetch, Steiner's binary-secret result is known only via an abstract-level paraphrase."

  interpretation_limits:
    - >-
      A negative outcome closes one specific algebraic-modeling avenue at
      TOY SCALE for ML-KEM's exact noise law; it does not close the
      algebraic-attack family in general (per inventor-protocol §4, other
      encodings and solvers such as crossbred remain open and are named).
    - >-
      A positive outcome is, per RQ-MLKEM-001's own constraint ("Toy-instance
      improvements are hypothesis-generating only"), exactly that --
      requiring the validation ladder's step 2 (fully-enumerable matched-
      shape scale) before any claim about ML-KEM's real parameters.
    - "Claim tier for every reported number here is `toy`; no bit-security claim about ML-KEM-512/768/1024 is made."

  heuristic_assumptions:
    - id: H1
      statement: >-
        The auxiliary-binary encoding of CBD(eta) preserves the ideal's
        solution set exactly while changing only the polynomial-degree
        structure of the generators -- imitating the standard tradeoff in
        Boolean/MQ modeling where introducing auxiliary variables to
        linearize a higher-degree constraint can lower the degree of
        regularity at the cost of more variables (RECALLED from general
        algebraic-cryptanalysis practice, not independently verified for the
        LWE setting this session).
      rigorous_support: >-
        Elementary: the auxiliary system's projection onto the original
        variables is the same variety by construction of the substitution --
        an encoding-equivalence claim, checkable exactly, not a distributional
        assumption.
      validation_plan: >-
        At n=8, verify by direct Gröbner/ideal-membership computation that
        both encodings of the SAME planted CBD(eta) instance produce ideals
        with identical solution sets before comparing their degrees of
        regularity.
    - id: H2
      statement: >-
        Steiner's reported sub-exponential estimate for binary-secret,
        binary-error LWE is reproducible in this program's toy-scale harness
        to within expected small-instance noise, providing the reproduction
        baseline the CBD result is compared against.
      rigorous_support: >-
        Steiner 2024 (RECALLED at abstract level only this session; no
        specific numeric degree-of-regularity value confirmed).
      validation_plan: >-
        Reproduce a small binary-secret/binary-error LWE instance end-to-end
        through the SAME Gröbner harness used for the CBD arms, report the
        measured degree of regularity, and flag any discrepancy with
        Steiner's paper once/if independently confirmed rather than
        presenting the reproduction as pre-validated against unread numbers.

  target_complexity:
    time_exponent: >-
      n/a directly -- no closed-form attack algorithm is proposed. IF
      Steiner's framework, once confirmed, gives genuinely sub-exponential
      complexity for a CBD-shaped system at ML-KEM's real n=256, that WOULD
      be exponent-class-moving (exponential BKZ -> sub-exponential algebraic);
      this toy-scale test is the cheapest possible discriminator for whether
      that is even plausible, not a claim that it holds.
    memory_exponent: >-
      Gröbner-basis memory is dominated by the matrix size at the solving
      degree and is documented (KN-TECH-075) to grow extremely fast; to be
      measured directly in Stages 2-3, not assumed.
    best_known: >-
      Classical/quantum lattice-reduction bit-security for ML-KEM as reported
      by this program's pinned estimator; algebraic/Gröbner attacks are not
      currently known to beat this for any standardized parameter set.
    hidden_overhead: >-
      Steiner's "sub-exponential" result (abstract-level-recalled) is for the
      more favorable binary case; extrapolating to dense CBD hides an
      unquantified degree-of-regularity gap this proposal is designed to
      measure, not assume.
    tradeoff_note: >-
      Gröbner/algebraic attacks are documented (recalled generalization, not
      proven here) to be essentially always memory-dominated relative to
      time at competitive sizes; any positive finding needs an explicit
      memory accounting against IDEA-20260805-cdc87d's memory-charged
      framework before any BKZ comparison is made.

  dominated_by: >-
    The classical/quantum lattice-reduction frontier this program already
    tracks (2^0.292*beta classical; see IDEA-20260828-411711 this session
    for the quantum comparison point) dominates on every currently-measured
    axis; this proposal's own H0 expectation is that algebraic attack remains
    dominated. Checked rows: cdc87d, 690de8, e805b6's cost figures, and the
    algebraic-attack literature found this session (Steiner 2402.07852); no
    published result was found where a Gröbner/algebraic attack beats
    lattice reduction for any standardized LWE-based scheme at its real
    parameters.
  sota_delta: >-
    No attack; no time/memory figure changes are claimed. The deliverable is
    a measured degree-of-regularity ratio between CBD-shaped and generic/
    binary-shaped toy systems at n<=32, plus a pre-registered decision rule
    for whether that ratio, if (unproven) extrapolated, would matter at
    n=256.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
  source_refs:
    - RQ-MLKEM-001
    - IDEA-20260813-17acdf
    - IDEA-20260805-690de8
  id_allocation_provenance: >-
    Minted with `python3 tools/allocate_id.py --next idea --date 20260828`,
    verified with `--check` before use.
