idea:
  id: IDEA-20261007-1e1e3c
  added: '2026-10-07'
  status: proposed
  approved_by: null
  question_id: RQ-SSI-001
  title: >-
    iota squared equals negation on y^2 = x^3 + x over F_361 and the
    same formula is not a homomorphism on y^2 = x^3 + 1
  class: measurement
  claim: >-
    Toy instance only. Let F_361 = F_19[z]/(z^2 + 1) and let s be a
    root of T^2 + 1. On E: y^2 = x^3 + x, the map iota(x, y) = (-x, s y)
    satisfies iota(iota(P)) = -P for every affine point P in E(F_361),
    and iota(P+Q) = iota(P)+iota(Q) for every pair of affine points,
    with addition the chord-and-tangent law. On E': y^2 = x^3 + 1 the
    same formula fails the homomorphism identity on at least one pair
    of affine points. This checks one endomorphism at j = 1728. It does
    not compute a discrete logarithm. The rho exponent stays 1/2.
  mechanism: >-
    PAIR. Representation: affine coordinates of a point on a fixed
    short-Weierstrass model. Operation set Sigma is {iota}, not
    translation. Trichotomy: partial-action, because iota is defined
    on this model and is not the group law. Lossy-projection test
    against Sigma: the test keeps the point and asks whether iota is a
    homomorphism. Discarded: isogeny paths and j-invariants. The open
    number is the count of affine points where iota twice differs from
    negation, predicted 0 on E and at least 1 failing pair on E'.
  novelty_status: unverified
  citations:
    - ref: KR-RHO-0528e7
      provenance: internal
      claim: >-
        An automorphism group of order 4 on j = 1728 cuts rho iterations
        by sqrt(4). This proposal checks the squaring identity of one
        map and does not run rho.
      verified_by: coordinator session 2026-10-07 opened knowledge/frontiers/ecdlp/generic-rho/KR-RHO-0528e7.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: Generic discrete logarithms need Omega(sqrt(p)) group operations.
      verified_by: coordinator session 2026-10-07 opened knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
  assumptions:
    - 19 ≡ 3 mod 4, so T^2 + 1 is irreducible over F_19 and s is not in F_19.
    - The chord-and-tangent law on a short-Weierstrass model is the group law. Recalled, not re-derived.
  proof_search_map:
    not_applicable_reason: A pointwise identity check, not an endomorphism-ring algorithm.
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
  predictions:
    - metric: count of affine points on E with iota(iota(P)) different from -P
      direction: lower
      minimum_effect: exactly 0
    - metric: count of affine pairs on E' failing the homomorphism identity
      direction: higher
      minimum_effect: at least 1
  minimal_test:
    design: >-
      Enumerate E(F_361) and E'(F_361). Apply iota twice on E and compare
      with negation. On E', search pairs until one homomorphism failure
      appears or the pairs are exhausted.
    controls:
      - >-
        Negation control: -(-P) = P on E. A failure invalidates the group law, not the claim.
      - >-
        Nearby curve E'. The formula must fail there. Success on both curves invalidates the contrast.
    required_metrics:
      - iota_square_failures_on_E
      - homomorphism_failures_on_E_prime
  falsification_conditions:
    - iota(iota(P)) differs from -P for some affine P on E.
    - Every affine pair on E' satisfies the homomorphism identity.
    - A timeout or a partial point enumeration is infrastructure, not a falsification.
  confounders:
    - A wrong addition law makes both curves fail. The negation control catches that.
    - Extra automorphisms at j = 0 are not this map. E' is the contrast, not a second endomorphism claim.
  interpretation_limits:
    - A passing check does not recover an endomorphism ring or beat p^{1/2}.
    - Negative evidence closes only these two models over F_361.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The complex multiplication by i on y^2 = x^3 + x descends to
        F_361 as (x, y) -> (-x, s y), and the same coordinate formula
        is not a homomorphism on y^2 = x^3 + 1.
      rigorous_support: >-
        The shape of the map is recalled from the j = 1728 automorphism.
        This session did not open a proof. The identities are the unproved part.
      validation_plan: >-
        Exhaustive check on E(F_361) and a failing pair on E'(F_361).
        No second prime in this proposal.
  target_complexity:
    time_exponent: p^{1/2} times (log p) to a constant power, unchanged
    memory_exponent: polynomial in log p for the point list
    best_known: >-
      Generic rho at p^{1/2}, and the j = 1728 automorphism saving a
      constant sqrt(4) iterations. This census does not run rho.
    hidden_overhead: No o(1) is claimed. The check is O(|E|^2) pair tests at this toy.
    tradeoff_note: No time-memory tradeoff for a path search is proposed.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: >-
    Opened KR-RHO-0528e7 and KR-RHO-13bf67. The first states a sqrt(4)
    iteration factor on j = 1728 and does not state this pointwise
    identity. The second dominates any exponent reading: Omega(sqrt(p)),
    exponent difference 0.
  sota_delta: >-
    Exponent difference 0. Counted delta: 0 points on E where iota twice
    differs from negation, and at least 1 failing pair on E'.
