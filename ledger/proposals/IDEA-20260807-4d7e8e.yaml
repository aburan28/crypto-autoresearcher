idea:
  id: IDEA-20260807-4d7e8e
  question_id: RQ-EQIC-8cb959
  added: '2026-08-07'
  title: >-
    A ZERO-COST STRUCTURAL THEOREM FOR THE LANE: on a j = 0 curve the on-curve
    condition for an x-coordinate depends only on the mu_3-INVARIANT u = x^3, so
    the entire universe of usable x-coordinates is already a disjoint union of
    complete phi-orbits and requiring a factor base to be phi-stable costs
    NOTHING in availability -- with an exact orbit count, a decisive
    seconds-long test against committed harness code, and the a != 0 curve as
    the object on which the statement must fail
  class: mechanism

  claim: >-
    (A) THE THEOREM. Let p > 3 with p = 1 mod 3, let zeta be a primitive cube
    root of unity in F_p, and let E : y^2 = x^3 + b over F_p with b != 0
    (so j = 0, a = 0). Write X_E = {x in F_p : x is the x-coordinate of an
    F_p-rational point of E} and phi(x, y) = (zeta x, y). Then:
      (i)  x lies in X_E if and only if x^3 + b is a square in F_p (zero
           counted as a square).
      (ii) The condition in (i) depends on x ONLY through u = x^3. Hence X_E is
           stable under x -> zeta x: X_E is mu_3-stable.
      (iii) For x != 0 the orbit {x, zeta x, zeta^2 x} has exactly three
           distinct elements, and either all three lie in X_E or none does.
      (iv) X_E \ {0} is therefore a DISJOINT UNION OF COMPLETE mu_3-ORBITS, and
           the number of orbits is exactly
             #{u in F_p^* : u is a cube and u + b is a square},
           where the cubes form the subgroup of index 3 in F_p^*, of order
           (p-1)/3. The point x = 0 is a fixed point of the action and lies in
           X_E iff b is a square; it is the unique degenerate orbit.
      (v)  CONSEQUENCE, WHICH IS THE POINT. Requiring a factor base V to be a
           union of phi-orbits imposes NO restriction on which points are
           available: every usable nonzero x-coordinate already sits in a
           complete orbit. The density penalty from the phi-stability constraint
           is exactly ZERO, and the only bookkeeping cost is rounding |V| to a
           multiple of 3 and excluding the single fixed point x = 0.
    PROOF of (i): standard -- x is an x-coordinate of a rational point iff the
    right-hand side is a square. Of (ii): x^3 + b is literally a function of
    x^3. Of (iii): (zeta^i x)^3 = x^3 so all three share the same u, and the
    three are distinct because zeta has order 3 and x != 0. Of (iv):
    x -> x^3 is a 3-to-1 group homomorphism F_p^* -> F_p^* with image the cubes
    and kernel mu_3, so the orbits are exactly the fibres. Of (v): immediate
    from (iv). The whole proof is four lines and requires no heuristic.

    (B) THE BICONDITIONAL, WHICH IS WHAT MAKES IT TESTABLE. For a generic curve
    y^2 = x^3 + a x + b with a != 0, the on-curve condition x^3 + a x + b in QR
    is NOT a function of x^3, and no scalar action x -> c x with c != 1
    preserves X_E in general. So statement (ii) -- and with it the whole
    zero-penalty conclusion -- holds IF AND ONLY IF a = 0. The a != 0 curve is
    therefore the exact nearby object on which the conclusion must fail, and it
    is free to construct.

    (C) THE DECISIVE TEST, AND IT RUNS AGAINST COMMITTED CODE IN SECONDS.
    harness/endomorphism_la.py::_build_phi_invariant_factor_base draws a
    candidate x, forms the orbit [x, zeta*x, zeta^2*x], and REJECTS the orbit
    unless E.lift_x(ox) is not None for ALL THREE members. Under the theorem,
    that three-fold test is logically equivalent to the single test on one
    member, so its acceptance rate must be the acceptance rate of ONE lift_x
    test, namely about 1/2. If on-curve-ness were independent across the orbit
    -- the naive expectation, and what the code's structure implicitly guards
    against -- the acceptance rate would be about 1/8. MEASURING THAT RATE IS
    THE ENTIRE MINIMAL TEST: about 0.5 confirms the theorem, about 0.125
    refutes it, and there is no third region. This is the cheapest decisive
    experiment in lane L4.

    (D) WHAT THE THEOREM BUYS AND WHAT IT DOES NOT. IT BUYS: the removal of an
    assumption. Every phi-stable-factor-base argument in this lane has to assume
    or measure that constraining V to orbits does not cost decomposition
    density; on j = 0 curves that assumption is now a four-line consequence of
    the curve equation rather than an empirical hope, and it holds exactly, not
    approximately. Combined with the scalar-action closure
    (IDEA-20260807-5dfe4a) it pins the entire phi-stable factor-base effect at
    matched cardinality to the single constant r = 3 in the unknown count, with
    no residual uncertainty about availability.
    IT DOES NOT BUY: any change of exponent, any change of the per-search
    success probability (which depends on |V| and arity only), or any new
    relation. THE RELATION ARITHMETIC IS UNCHANGED BY THIS THEOREM: a phi-stable
    V of cardinality 3m built from m complete orbits has m unknowns; each
    successful decomposition search yields exactly ONE independent equation over
    those m unknowns with coefficients in {+-1, +-lambda, +-lambda^2}; the
    phi-images of that relation are lambda-multiples and add rank 0. The theorem
    says only that the m orbits were free to choose.

  resource_label: R1, R2
  admissibility: admissible
  admissibility_argument: >-
    R1: the statement is about x-coordinates as FIELD ELEMENTS and about the
    quadratic and cubic residue structure of F_p; a generic-group simulator has
    no access to residuosity and cannot decide whether an opaque handle's
    x-coordinate is a cube, so nothing here is simulable in the sense of
    KN-FIND-b7e091. R2: the theorem is a statement about the curve EQUATION and
    holds if and only if a = 0, which is the sharpest possible demonstration
    that the resource consumed is the equation and not the group. phi is never
    applied to a point of G to gain information; indeed the theorem is about the
    x-line, where the group structure plays no role at all.

  discriminated_from:
    - >-
      H-STR-002 (weakened, DEC-20260727-009; DEFER-BATCH009-001 OPEN). NO
      INFERENCE ABOUT H-STR-002 IS DRAWN OR LICENSED IN EITHER DIRECTION, and
      the distinction is precise rather than formal. H-STR-002's fourth
      assumption concerns a RELATION-DENSITY PENALTY measured as a ratio between
      two experimental arms -- (random hit rate) / (phi-invariant hit rate) --
      and its predictions concern displacement rank and a linear-algebra saving.
      This record derives a statement about FACTOR-BASE AVAILABILITY: which
      x-coordinates exist to be chosen. Those are different quantities: one is
      an empirical hit-rate ratio between two collection runs, the other is a
      counting fact about the set X_E. The DEC-20260727-009 weaken rests on R1
      (missing artifacts), R2 (a one-variable displacement-rank comparison) and
      R3 (no assembled cost path); none of the three touches the counting fact,
      and this record touches none of the three. The mechanism the weaken
      explicitly did not test -- whether phi-invariance of the base yields an
      equivariant system -- is also not tested here.
    - >-
      IDEA-20260807-5dfe4a (the scalar-action closure). That record bounds what
      phi-IMAGES contribute (rank 0). This record bounds what phi-STABILITY
      costs (nothing, in availability). They are the two halves of the same
      accounting and neither implies the other: availability could have been
      costly with rank increment still 0, or free with rank increment positive.
      Together they determine the phi-stable factor-base effect at matched
      cardinality exactly.
    - >-
      IDEA-20260807-1ea327 (invariant coordinate u = x^3). That record uses the
      invariant to rewrite the POLYNOMIAL SYSTEM and measures Groebner cost.
      This record uses the same invariant to count the FACTOR-BASE UNIVERSE and
      proves an availability statement. Statement (ii) here is in fact the
      structural reason the membership polynomial factors as f_V(x) = g(x^3)
      there, so this record is a lemma the other one may cite -- an explicit
      dependency, recorded rather than duplicated.
    - >-
      KN-TECH-018 (rho automorphism discount). That is about walking on
      equivalence classes of POINTS for a different algorithm. This is about the
      cardinality and orbit structure of the x-coordinate universe. The two
      share the group Aut(E) and nothing else.

  object_first_candidate:
    tracked_object: >-
      THE SET X_E OF ON-CURVE x-COORDINATES, viewed as a subset of the x-line
      with its mu_3-action -- and specifically its ORBIT DECOMPOSITION: the
      partition of X_E \ {0} into fibres of x -> x^3.
    lossiness: >-
      GENUINELY LOSSY, twice over. First, X_E forgets the y-coordinate: each
      x in X_E \ {2-torsion} corresponds to a PAIR of points {P, -P}, so the
      projection E(F_p) -> X_E is 2-to-1 and discards the sign. Second, the
      orbit decomposition forgets which of the three cube roots is meant,
      discarding a further factor of 3. The composite forgets a set of size 6 =
      |Aut(E)| for j = 0 -- which is not a coincidence: the projection is
      exactly the quotient by the automorphism group.
    propagation: >-
      Deterministic and, for once, EXACTLY rather than heuristically: the
      retained datum u = x^3 determines on-curve membership through the single
      condition u + b in QR. What is discarded (the sign and the cube-root
      phase) is discarded compatibly with the operations the target performs,
      because Aut(E) acts on decompositions -- a decomposition of R by summands
      maps to a decomposition of phi(R) by the phi-images. THE HONEST LIMIT,
      stated here and not buried: the addition law does NOT descend to the
      u-line. E / Aut(E) is a rational curve, not a group, so u propagates
      through MEMBERSHIP but not through the group law, and any relation
      recovered on the u-line must be lifted back to x before it means anything.
      That limit is what confines this projection to factor-base bookkeeping and
      to the polynomial system (IDEA-20260807-1ea327), and it is why this record
      claims a counting theorem rather than an algorithm.
    survival_score: >-
      Survives: any factor-base size, any arity, any target, any solver, and
      composition with the negation quotient (which acts on a different
      coordinate). Dies immediately at a != 0, which is claim (B) and is the
      matched null. Degrades at j = 1728, where the analogous statement is
      "on-curve-ness of x depends only on x^2" for E : y^2 = x^3 + a x, which is
      TRUE (x^3 + ax = x(x^2 + a) is odd, so the condition on x and -x differ by
      the square class of -1 -- see the confounder below, this case is NOT the
      same and is the reason IDEA-20260807-5ddccf treats r = 2 separately rather
      than by analogy).

  mechanism: >-
    STEP 1 -- STATE AND CHECK THE THEOREM EXHAUSTIVELY AT SMALL p. For every
    prime p = 1 mod 3 with p < 2000 and every b != 0 in a sampled set, enumerate
    all x in F_p, compute X_E by direct residue testing, and verify by exact
    set comparison that zeta * X_E = X_E, that X_E \ {0} partitions into fibres
    of x -> x^3 of size exactly 3, and that the orbit count equals
    #{u cube : u + b square}. This is a complete verification, not a sample: at
    p < 2000 the whole set is enumerable. A single counterexample refutes the
    theorem.

    STEP 2 -- THE COMMITTED-CODE TEST OF CLAIM (C). Instrument (without
    modifying) the acceptance logic of
    harness/endomorphism_la.py::_build_phi_invariant_factor_base: count, over at
    least 10000 candidate draws per instance, how often all three orbit members
    lift and how often exactly one or two do. The theorem predicts the
    "exactly one" and "exactly two" counts are IDENTICALLY ZERO and the
    all-three rate is about 1/2. Any nonzero mixed count is either a refutation
    of the theorem or a bug in lift_x, and STEP 1 distinguishes the two.

    STEP 3 -- THE EXACT ORBIT COUNT, AND WHAT IT BOUNDS. Compute
      Omega(p, b) = #{u in F_p^* : u^{(p-1)/3} = 1 and (u+b)^{(p-1)/2} in {0,1}}
    directly for the instance, and compare with |X_E \ {0}| / 3 computed by
    enumeration. Equality is a second independent check of claim (iv). Omega is
    the exact number of orbits available, hence the exact ceiling on m for a
    phi-stable base, and it must be reported alongside any |V| = 3m so that the
    lane can never accidentally request more orbits than exist.

    STEP 4 -- THE MATCHED NULL. Repeat STEP 1 and STEP 2 verbatim on curves with
    a != 0 at the same p. There the mixed counts must be NONZERO and the orbit
    partition must fail -- and measuring exactly how often it fails quantifies
    what the a = 0 structure is worth. Predicted mixed-count rate on a generic
    curve if on-curve-ness were independent across the "orbit": 3/8 for exactly
    one, 3/8 for exactly two.

    STEP 5 -- THE CONSEQUENCE, RECORDED WITHOUT OVERREACH. Write the resulting
    statement as: "on j = 0 curves the phi-stability constraint costs zero
    factor-base availability, so at matched cardinality the phi-stable and
    random bases draw from universes of the same density; combined with
    IDEA-20260807-5dfe4a the entire effect is the constant r = 3 in the unknown
    count." Do not write anything stronger, and specifically do not write
    anything about hit-rate ratios measured in any prior experiment.

  novelty_status: known
  novelty_screen:
    method: >-
      Repository greps run 2026-08-07 in this session:
      (1) 'Veronese|norm of the summation|cube substitution|u = x\^3|
      x\^3 invariant|mu_3' over the repository, content mode;
      (2) 'x\^3|cube root|zeta_3|zeta3' over ledger/, files_with_matches;
      (3) 'phi-invariant|phi-orbit|phi-stable|equivariant",' over the
      repository, files_with_matches.
      Source read directly: harness/endomorphism_la.py lines 85-114 (the orbit
      acceptance logic), harness/semaev.py, harness/toycurve.py signatures,
      experiments/EXP-STR-004/derivation_note.md (Lemma 3a-3c, which derives
      index-level facts about the same construction), H-STR-002,
      DEC-20260727-009. External web searches as recorded in
      IDEA-20260807-1ea327.
    results: >-
      Grep (1) surfaced the mu_3 cluster in the XEDN canonical-lift lane,
      including TASK-20260724-234 validation_notes line 399 which states "Is the
      mu_3 automorphism claim right? Yes. x -> zeta x with zeta^3 = 1 fixes
      x^3" -- so the INVARIANCE OF x^3 is already noted in this repository, in a
      different lane and for a different purpose (free-x sections of a rational
      elliptic surface). What is NOT anywhere in the repository is the
      consequence drawn here: that X_E is a union of complete orbits, the exact
      orbit count Omega(p, b), the zero-availability-penalty conclusion, or the
      acceptance-rate test of claim (C) against the committed builder. The
      EXP-STR-004 derivation note's Lemma 3a-3c reasons about INDEX positions in
      the emitted factor-base list and explicitly assumes rather than derives
      that accepted orbits have all three members on the curve (its condition
      C-3 covers only whether the builder reached B).
    verdict: >-
      KNOWN as mathematics. Statement (i) is the definition of a Weierstrass
      x-coordinate and (ii) is the observation that x^3 + b depends on x^3; no
      part of the proof is new and none is claimed to be. It is filed because a
      four-line proof that removes an assumption from an entire lane is worth
      more than the same assumption measured, and because its consequence and
      its committed-code test are absent from this repository. NO EXTERNAL
      NOVELTY IS CLAIMED; this is folklore.

  null_object_control: >-
    MANDATORY AND SUPPLIED. MATCHED NULL: the a != 0 curve at the same p, with
    the identical pipeline, where claim (B) says the orbit structure must FAIL.
    The measured quantity is the mixed-count rate (orbits with exactly one or
    exactly two on-curve members): predicted IDENTICALLY ZERO at a = 0 and
    substantially nonzero at a != 0. A pipeline that reports zero mixed counts
    on BOTH is not testing anything -- most likely it is silently rejecting on a
    different criterion -- and the line halts.
    DECAY PARAMETER: this record's decay parameter is not epsilon but the
    CURVE COEFFICIENT a itself, ranging over a = 0 and a set of nonzero values
    sampled across the residue classes of F_p. The signal (zero mixed counts)
    must be present at a = 0 and absent at every a != 0 tested; unlike a
    continuous decay this is an on/off structure, which is stated plainly rather
    than dressed as a gradient. The continuous decay parameter that DOES apply
    to any downstream use of the theorem is epsilon, the orbit-breaking fraction
    of IDEA-20260807-b42544, and it is inherited rather than restated.
    ANTI-NULL (planted failure): artificially corrupt one orbit member's
    on-curve status in the instrumentation and confirm the mixed counter fires.
    A counter that cannot count a planted mixed orbit cannot certify their
    absence.

  assumptions:
    - >-
      p > 3 and p = 1 mod 3, so zeta exists and x -> x^3 is 3-to-1 on F_p^*.
      Both checked per instance.
    - >-
      b != 0, so the curve is non-singular (the discriminant of y^2 = x^3 + b is
      -432 b^2).
    - >-
      x = 0 is excluded from every phi-stable factor base. It is the unique
      fixed point and it breaks both the orbit partition and the factorisation
      f_V(x) = g(x^3). Recorded per cell rather than assumed silently.
    - >-
      The residue tests (u a cube, u + b a square) are computed by exponentiation
      mod p, which is exact. No heuristic enters the theorem; heuristics enter
      only the APPROXIMATION Omega ~ (p-1)/6, which is a Hasse-interval-level
      estimate and is reported as an estimate wherever it is used.

  proof_search_map:
    bottleneck: >-
      The theorem has no computational bottleneck. The step whose removal
      changes the statement is claim (ii): that x^3 + b depends on x only
      through x^3. Everything else follows formally. Correspondingly, the
      quantity whose behaviour the whole record turns on is the mixed-count rate
      of claim (C), which is why the minimal test measures exactly that.
    baseline_embedding:
      parameter_slice: >-
        a != 0 is the boundary: setting a to any nonzero value destroys claim
        (ii) and the family reduces to the ordinary situation in which a
        phi-stable base does not exist at all (there is no phi). The incumbent
        recovered at the boundary is the plain random factor base.
      reproduction_check: >-
        Frozen regression fixture: on a fixed a != 0 curve, the orbit builder
        instrumented as in STEP 2 must produce a nonzero mixed count, and the
        set zeta * X_E must differ from X_E as an exact set comparison. If it
        does not, either the null curve was mis-generated or lift_x is wrong,
        and no claim about a = 0 may be reported.
    observation_collision:
      observable: >-
        The mixed-count rate (fraction of candidate orbits with exactly one or
        two on-curve members).
      distinct_preimage_search: >-
        REQUIRED. Search for a curve with a != 0 whose mixed-count rate is also
        zero -- i.e. a distinct preimage of the observable on the wrong side of
        the conclusion. If such a curve exists the observable does not identify
        the a = 0 structure. A candidate class worth checking explicitly:
        curves with j = 1728 (b = 0), where the relevant action is x -> -x and
        x^3 + a x is ODD, so x and -x satisfy conditions differing by the square
        class of -1; when -1 is a square in F_p (p = 1 mod 4) that action DOES
        preserve X_E and the mixed count is again zero for the order-2 action.
        This is a genuine near-collision, it is predicted here before
        measurement, and it is the reason the r = 2 case must be treated
        separately rather than by analogy (IDEA-20260807-5ddccf).
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Specialize the general on-curve condition f(x) in QR to the case
          f(x) = x^3 + b, where f is a MONOMIAL PLUS A CONSTANT and therefore a
          function of the invariant of the scalar action. Measure the resulting
          orbit structure and pack the charge (zero availability penalty) over
          the proved-disjoint blocks, namely the fibres of x -> x^3, which are
          disjoint by construction.
        predicted_gain: >-
          Converts an empirical assumption used throughout the lane into an
          exact counting statement at zero compute, and supplies the exact
          ceiling Omega on the number of orbits available.
      - transform: stronger_invariant
        proposed_object: >-
          Track not just "X_E is mu_3-stable" but the full pair
          (u is a cube, u + b is a square) as a two-bit invariant of the orbit.
          The second bit is on-curve membership; the FIRST bit is the datum that
          says whether u has cube roots at all, and it is what makes Omega
          computable without enumerating x.
        predicted_gain: >-
          Orbits become enumerable directly on the u-line, at one exponentiation
          per orbit instead of three lift_x calls -- a constant-factor
          instrument improvement, claimed as exactly that and nothing more.
    quantifier_order: >-
      CLAIMED: FOR ALL primes p > 3 with p = 1 mod 3, FOR ALL b != 0 in F_p, FOR
      ALL x in F_p^*, x lies in X_E IF AND ONLY IF zeta x lies in X_E.
      This is a uniform statement with no instance-dependent witness -- the
      witness is the identity (zeta x)^3 = x^3, which depends on nothing.
      NOT CLAIMED: FOR ALL curves ... (false at a != 0); and NOT: the orbit
      count is exactly (p-1)/6 (that is an estimate; the exact value is Omega,
      which varies with b and with p in the Hasse interval).
    method_ceiling:
      strongest_certifiable_claim: >-
        "On j = 0 curves over F_p with p = 1 mod 3, the phi-stability constraint
        on a factor base costs zero availability, and the number of available
        orbits is exactly Omega(p, b)." It can NEVER certify: that phi-stability
        helps; that the per-search success probability is unchanged (that is a
        separate statement about DECOMPOSITION density, measured by
        IDEA-20260807-b42544 prediction 4, and this theorem supports but does not
        prove it); anything about a != 0; or anything about the ECDLP.
      nearby_object_control: >-
        Two of them, and the second is the sharp one. (1) The a != 0 curve,
        where the conclusion must fail. (2) The j = 1728 curve with p = 1 mod 4,
        where an ANALOGOUS conclusion holds for a different action -- the
        near-collision predicted in observation_collision. A method that
        conflates these two has not identified the load-bearing structure, which
        is "the on-curve polynomial is invariant under the action", not
        "the curve has extra automorphisms".
    proof_obligations:
      - claim: x in X_E iff x^3 + b is a square.
        responsibility: correctness
      - claim: the condition depends on x only through x^3.
        responsibility: correctness
      - claim: orbits of x != 0 have exactly 3 elements.
        responsibility: correctness
      - claim: X_E \ {0} is a disjoint union of complete orbits.
        responsibility: correctness
      - claim: the orbit count equals Omega(p, b) as defined.
        responsibility: size
      - claim: the conclusion fails at a != 0.
        responsibility: strictness
      - claim: the exhaustive check at p < 2000 finds no counterexample.
        responsibility: baseline

  predictions:
    - metric: >-
        mixed-orbit count (candidate orbits with exactly one or exactly two
        on-curve members) on a j = 0 curve
      direction: lower
      minimum_effect: >-
        EXACTLY ZERO, over at least 10000 candidate draws per instance and at
        every instance. Zero tolerance: a single mixed orbit refutes claim (ii)
        or exposes a lift_x bug, and STEP 1's exhaustive check adjudicates
        which.
    - metric: >-
        acceptance rate of the three-member lift test in the committed
        _build_phi_invariant_factor_base, excluding duplicate rejections
      direction: higher
      minimum_effect: >-
        About 0.50 (the single-test rate), and specifically NOT about 0.125
        (the independent-tests rate). The pre-registered decision band is
        [0.45, 0.55] for confirmation and [0.10, 0.15] for refutation; anything
        between is an instrument problem and is reported as such.
    - metric: >-
        mixed-orbit count on a matched a != 0 curve
      direction: higher
      minimum_effect: >-
        Substantially nonzero, with the exactly-one and exactly-two rates each
        near 0.375 if on-curve-ness is independent across the three points. A
        zero here means the null is not exercising the mechanism and blocks the
        comparison.
    - metric: >-
        Omega(p, b) computed on the u-line against |X_E \ {0}| / 3 computed by
        enumeration
      direction: different
      minimum_effect: >-
        Exact equality at every tested instance. This is an arithmetic identity
        and any discrepancy is a bug.
    - metric: >-
        orbit-enumeration cost, u-line method against three-lift_x method
      direction: lower
      minimum_effect: >-
        A factor of at least 2 fewer field exponentiations per accepted orbit.
        This is a CONSTANT-FACTOR instrument improvement and is labelled as such
        wherever it appears; it moves no exponent and is claimed as tooling.

  minimal_test:
    design: >-
      THE CHEAPEST VALID DISCRIMINATOR IS THE ACCEPTANCE-RATE MEASUREMENT AND IT
      COSTS SECONDS. Instrument the committed
      _build_phi_invariant_factor_base's three-member lift test on one existing
      12-bit j = 0 instance, draw 10000 candidates, and report the histogram of
      (0, 1, 2, 3) on-curve members per orbit. The theorem predicts the
      histogram is supported on {0, 3} alone with the 3-bucket at about 0.5;
      the naive alternative predicts a binomial(3, 1/2) shape with the
      1- and 2-buckets at 0.375 each. There is no overlap between the two
      predictions and the test discriminates them completely.
      THEN, minutes: STEP 1's exhaustive verification for every p = 1 mod 3
      below 2000 and a sample of b, which is a complete proof at those p rather
      than a sample.
      THEN, minutes: the same histogram on a matched a != 0 curve (the null).
      THEN, minutes: STEP 3's Omega computation and its comparison against
      enumeration.
    controls:
      - matched a != 0 curve, same p, identical pipeline (blocking)
      - >-
        j = 1728 curve with p = 1 mod 4 under the x -> -x action, the predicted
        near-collision
      - planted mixed orbit (anti-null): the mixed counter must fire
      - >-
        exhaustive enumeration at p < 2000, which is a verification and not a
        sample
      - x = 0 explicitly excluded and its exclusion recorded
    required_metrics:
      - histogram of on-curve members per candidate orbit, per curve, per p
      - acceptance rate of the three-member test, duplicates excluded
      - Omega(p, b) and |X_E \ {0}| / 3, as exact integers
      - orbit-enumeration cost in field operations, both methods
      - the exhaustive-check verdict at every p < 2000 tested
      - any counterexample recorded verbatim with its (p, b, x)

  falsification_conditions:
    - >-
      A single mixed orbit is found on a j = 0 curve and the exhaustive check
      confirms it is not a lift_x bug. Claim (ii) is false, the theorem is
      wrong, and the record is superseded. This is a hard, cheap, unambiguous
      falsifier.
    - >-
      The acceptance rate lands near 0.125 rather than 0.50. Same disposition.
    - >-
      The a != 0 null also shows zero mixed orbits across a range of a. The
      observable does not identify the a = 0 structure; the biconditional in
      claim (B) is wrong as stated; and the near-collision analysis in the
      proof_search_map becomes the main finding.
    - >-
      Omega computed on the u-line disagrees with enumeration. An arithmetic or
      implementation error; nothing is reported until it is resolved.
    - >-
      The exhaustive check cannot be completed within budget at the declared p
      range. A BUDGET outcome under AGENTS.md rule 5, not evidence about the
      theorem.

  confounders:
    - >-
      lift_x SEMANTICS. harness/toycurve.py's lift_x returns None when the
      right-hand side is a non-residue, which is what the theorem's condition
      (i) requires -- but its treatment of the case x^3 + b = 0 (a 2-torsion
      point, y = 0) must be checked, because a lift_x that rejects y = 0 would
      produce a spurious mixed orbit exactly at the orbit u = -b when -b is a
      cube.
    - >-
      DUPLICATE REJECTION. The committed builder also rejects an orbit if any
      member is already in xs. Those rejections must be separated from lift
      rejections before the acceptance rate is computed, or the measured rate is
      depressed for a reason unrelated to the theorem.
    - >-
      x = 0. The unique fixed point; including it makes the orbit partition
      false and breaks f_V(x) = g(x^3). Excluded by assumption and checked.
    - >-
      NON-UNIFORM CANDIDATE DRAWS. _seed_int-derived candidates are
      deterministic; if the draws correlate with cubic residuosity the
      acceptance rate is biased. The mitigation is to draw candidates directly
      as cubes u and take any cube root, which also makes the u-line
      enumeration natural.
    - >-
      j = 1728 FALSE ANALOGY. The x -> -x action preserves X_E only when -1 is a
      square (p = 1 mod 4); assuming the analogy without the residue condition
      would produce a wrong prediction for r = 2 and is flagged in advance.

  interpretation_limits:
    - >-
      NO INFERENCE ABOUT H-STR-002 IS DRAWN OR LICENSED IN EITHER DIRECTION;
      DEFER-BATCH009-001 remains open and untouched. The quantity derived here
      (availability of orbits in X_E) is not the quantity H-STR-002 assumes or
      predicts (an inter-arm hit-rate ratio and a displacement rank).
    - >-
      THE THEOREM IS NOT AN ADVANTAGE. It removes a possible DISadvantage. Its
      best possible effect is to make the constant r = 3 attainable without a
      density penalty, and a constant does not move an exponent.
    - >-
      Scoped to j = 0 curves over prime fields with p = 1 mod 3 -- a measure-zero
      family. By T4 of DECOMPOSITION.md a j = 0 curve cannot be reached by
      walking from an isogeny class that lacks D_0 = -3, so the theorem has no
      reach to a curve chosen adversarially, and no standardized curve in this
      program's target set has j = 0.
    - >-
      The theorem is about MEMBERSHIP, not about the group law. E / Aut(E) is a
      rational curve and the addition law does not descend to the u-line; any
      relation must be lifted back. This is stated in the object's propagation
      field and bears repeating because it is the limit that stops the invariant
      from becoming an algorithm by itself.
    - >-
      Omega ~ (p-1)/6 is an ESTIMATE; the exact orbit count varies with b. Any
      sizing argument must use the computed Omega, not the estimate.

  reachability_gate: >-
    NOT APPLICABLE TO THE DESIGN: the theorem is proved on paper and checked by
    enumeration on constructed curves; nothing walks an isogeny class, so T5
    does not bind and no reachability cost is incurred. BINDING ON THE SCOPE:
    T4 does apply -- j = 0 requires D_0 = -3, which is fixed by the isogeny
    class, so the family on which the theorem holds is not reachable from a
    class that lacks it at any price. The a != 0 null curve and the j = 1728
    near-collision curve are likewise CONSTRUCTED (choose a = 0 or b = 0), at
    zero reachability cost, and the record must not be read as implying that a
    target curve could be moved into this family.

  target_complexity:
    time_exponent: >-
      NO EXPONENT MOVES AND NONE COULD. The theorem removes an availability
      penalty; the surviving effect of a phi-stable base is the constant r = 3
      in the unknown count (IDEA-20260807-5dfe4a claim (B)), on an arity-2
      prime-field collection cost of about 2 c N / r, i.e. LINEAR in N. The
      instrument improvement in prediction 5 is a constant factor in
      field operations per orbit.
    memory_exponent: >-
      Unchanged. The u-line enumeration stores one field element per orbit
      instead of three, a factor-3 constant on the factor-base storage, which is
      subdominant to the relation matrix.
    best_known: >-
      Parallel rho with distinguished points at 0.886 sqrt(N) time and O(1)
      memory (KN-TECH-001, KN-TECH-006); automorphism-discounted rho on j = 0 at
      0.886 sqrt(N)/sqrt(6) (KN-TECH-018); BSGS at sqrt(N) time and memory. For
      the factor-base construction step specifically, the incumbent is the
      committed three-lift_x builder in harness/endomorphism_la.py.
    hidden_overhead: >-
      Nothing asymptotic hides. Two concrete disclosures: (a) the u-line
      enumeration needs a cube-root extraction when a point is actually
      required, which costs one exponentiation and is charged at the moment of
      use rather than at enumeration; (b) Omega must be computed per instance
      because the estimate (p-1)/6 can be off by the Hasse-level fluctuation,
      and a base sized against the estimate can request more orbits than exist.
    tradeoff_note: >-
      No time-memory tradeoff is introduced. Parallelization is unaffected:
      orbit enumeration is embarrassingly parallel on the u-line, marginally
      more so than on the x-line since no duplicate check across cube roots is
      needed.

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES. As an attack: none
    is mounted, so dominated on every axis by parallel rho with distinguished
    points (0.886 sqrt(N), O(1) memory, KN-TECH-001/006), by the
    automorphism-discounted rho on this exact family (0.886 sqrt(N)/sqrt(6),
    O(1) memory, KN-TECH-018), by BSGS (sqrt(N) time, sqrt(N) memory), and at
    one remove by prime-field point-decomposition index calculus itself
    (KN-TECH-003, KN-LIT-006), which is already dominated by all three. On
    data/queries no row is beaten. AS A FACTOR-BASE CONSTRUCTION the incumbent
    is the committed three-lift_x builder; this record dominates it on
    field operations per accepted orbit (one residue test instead of three
    lifts) and on the elimination of an assumption, and is dominated by it on
    maturity, since the committed builder is archived and exercised and this is
    a proposal.
  sota_delta: >-
    Zero speedup against any attack baseline. Quantitatively: the availability
    penalty for phi-stability goes from "unknown, assumed bounded" to exactly 0;
    the number of available orbits goes from unstated to exactly Omega(p, b);
    the factor-base construction cost goes from three lift_x calls per candidate
    orbit to one residue test, a constant factor of about 3 on a step that is
    negligible against relation collection; and the surviving phi-stable-base
    effect is pinned at the constant r = 3, against a collection cost linear in
    N and a rho baseline at 0.886 sqrt(N).

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.97 that the theorem is exactly correct -- it is a four-line consequence of
    x^3 + b depending on x^3, and the residual risk is an edge case at
    x^3 + b = 0 or at x = 0 rather than at the main statement. 0.90 that the
    acceptance-rate test lands in [0.45, 0.55] on committed code; the 0.10 is
    dominated by the duplicate-rejection confounder depressing the measured
    rate, which is a bookkeeping problem with a known fix. 0.75 that the
    a != 0 null shows substantial mixed counts, the residual being the
    near-collision family flagged in the proof_search_map. 0.00 that any of this
    yields an attack, and it is filed for the assumption it removes, not for a
    speedup.

