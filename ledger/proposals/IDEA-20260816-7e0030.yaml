idea:
  id: IDEA-20260816-7e0030
  question_id: RQ-SIMSPK-f6a6c0
  added: '2026-08-16'
  title: 'The rotation-constant space is not 4096 points but a set of orbits: test whether the unit-multiplier
    action u.(a,b,c) = (ua,ub,uc) on Z/n together with the AND-argument swap is an exact cipher-level
    conjugacy for SIMON-like round functions, and whether every portfolio measure is therefore a class
    function that must be evaluated once per orbit with its multiplicity carried alongside.'
  class: representation
  claim: '(A) For word size n the SIMON-like round function is F_{a,b,c}(x) = (S^a x AND S^b x) XOR
    S^c x, where S^a is rotation by a. Any bit-index map pi_u for u a unit mod n, acting by (pi_u
    x)_i = x_{u^{-1} i}, commutes with bitwise AND and XOR because both are coordinate-wise, and satisfies
    pi_u S^a = S^{ua} pi_u. Hence pi_u F_{a,b,c} pi_u^{-1} = F_{ua,ub,uc} exactly, with no probability
    attached. Commutativity of AND adds the swap (a,b,c) -> (b,a,c). These generate a group G of order
    at most 2 phi(n) acting on the constant space. (B) The claim under test is the CIPHER-LEVEL statement:
    if the round constants and key schedule are transported by the same pi_u, then r-round encryption
    under (a,b,c) and under (ua,ub,uc) are conjugate by pi_u for every r, so every measure computed
    from difference propagation, mask propagation, difference support, or division property is constant
    on G-orbits. (C) The operational consequence is a correction, not a discovery: a ranking computed
    over the raw n^3 grid counts each orbit as many times as the orbit is large, so the percentile
    rank of any triple, including the standardized one, is distorted by orbit multiplicity. This proposal
    claims the correction factor is computable exactly and cheaply and must be reported alongside
    every rank this campaign produces. (D) NOT CLAIMED: that G is the full symmetry group of the constant
    space; that the key schedule does transport, which is precisely what a run may falsify; that any
    triple is optimal, near-optimal, anomalous or unremarkable under any measure; that the prior study
    did or did not already quotient the space, which this program cannot adjudicate; and no attack,
    distinguisher, speedup, or security consequence for any SIMON variant at any round count.'
  mechanism: 'STAGE A, symbolic and zero-compute: write pi_u S^a = S^{ua} pi_u and pi_u(x AND y) =
    pi_u x AND pi_u y as index identities and verify them by direct substitution, giving the round-function
    conjugacy as an algebraic identity rather than a conjecture. STAGE B, exhaustive verification
    of the round-function identity at word sizes n in {4,6,8,10,12}: for every unit u, every triple
    (a,b,c), and every input x, check pi_u F_{a,b,c}(x) equals F_{ua,ub,uc}(pi_u x) bit for bit. Any
    single mismatch refutes STAGE A and is the result. STAGE C, the load-bearing step: extend the
    check from the round function to r rounds of the actual Feistel with the pinned key schedule and
    round-constant sequence, asking whether enc_{ua,ub,uc}(pi_u k, pi_u p) equals pi_u enc_{a,b,c}(k,p)
    for random keys and plaintexts, incrementing r until it fails. The round index at which it first
    fails, r_max, is the measured quantity, and r_max = 0 or 1 for some u is a clean falsification
    of the class-function claim at cipher level while leaving the round-function identity intact.
    STAGE D, orbit enumeration by union-find over the raw grid, producing the orbit count, the multiplicity
    histogram, the stabilizer of the standardized triple, and a frozen table mapping every triple
    to its orbit representative. STAGE E, impact measurement: take any cheap surrogate measure (the
    round-function differential weight of a single fixed difference is enough) and report the standardized
    triple''s percentile rank computed both ways, so the size of the correction is a number rather
    than an argument.'
  novelty_status: unverified
  novelty_screen:
    method: Ran grep -ril SIMSPK over ledger/proposals, ledger/hypotheses and experiments; ran grep
      -il 'simon|speck' over ledger/proposals/*.yaml and inspected the matching lines in all 11 hits;
      ran grep -ril 'constant space|constant-space|rotation constant' over ledger/ and knowledge/;
      ran grep -ril 'symmetry group' and grep -ril 'orbit' over ledger/proposals and read the title
      block of IDEA-20260815-a5a19f; listed knowledge/techniques and knowledge/open-problems in full;
      read ledger/questions/RQ-SIMSPK-f6a6c0.yaml, ledger/goals/GOAL-SIMSPK-001.yaml, knowledge/literature/KN-LIT-5292.md
      and docs/inventor-protocol.md sections 1 through 5 and 8 in full.
    results: 'grep -ril SIMSPK over ledger/proposals, ledger/hypotheses and experiments returned zero
      files: this research question carries no prior proposal in this repository. The 11 proposals
      matching ''simon'' all refer to Simon''s quantum period-finding algorithm or to the Simon 2026
      dihedral-coset paper KN-LIT-e204ab, a homonym and not the block cipher. The prior constant-space
      study the RQ instructed the campaign to locate IS present as KN-LIT-5292, ''Observations on
      the SIMON block cipher family'' by Koelbl, Leander and Tiessen, at confidence: reported and
      citation_verified: read, seeded 2026-07-24 from the first two pages of a local PDF with its
      claims relayed from the abstract and marked explicitly as not independently verified. Its recorded
      abstract says it derives efficiently computable expressions for exact differential and linear
      behaviour of SIMON-like round functions and investigates a large set of variants with different
      rotation constants. Whether it quotients the constant space by symmetry is NOT recorded in the
      entry, and this proposal asserts nothing about that either way. IDEA-20260815-a5a19f applies
      the same methodological move, quotienting by a computable equivalence before screening, to this
      program''s own proposal corpus.'
    verdict: 'UNVERIFIED. This program cannot read external literature, so no statement about what
      is or is not already published is made or implied. Assembled from known parts: the observation
      that bit permutations commute with bitwise operations is elementary; conjugation as a source
      of cipher equivalence classes is standard practice; union-find orbit enumeration is textbook.
      Claimed new here only as a combination and as a binding methodological precondition for THIS
      campaign: that the SIMON rotation triple''s orbit under the index-unit action is verified at
      cipher level including the key schedule, that the orbit multiplicity is carried into every rank
      this goal reports, and that failure of the cipher-level transport is itself recorded as a measured
      obstruction rather than discarded.'
  object_first_candidate:
    tracked_object: 'The G-orbit of the rotation triple (a,b,c) in (Z/n)^3, where G is generated by
      the unit multipliers u in (Z/n)* acting as (a,b,c) -> (ua,ub,uc) and by the AND-argument swap
      (a,b,c) -> (b,a,c). What is followed through the computation is the orbit label together with
      its multiplicity, not the triple: a measure is evaluated once per orbit representative and the
      orbit size travels alongside as the weight that any percentile rank must use.'
    lossiness: 'Genuinely lossy. The map triple -> orbit discards which representative of an equivalence
      class a constant set is, collapsing up to 2 phi(n) = 16 labels at n = 16 into one. What survives
      is exactly what conjugation-invariant measures can see. The discard is compatible with the target
      operation because the conjugating map pi_u is a bit permutation: it commutes with AND and XOR
      and normalizes the rotation group, so the retained orbit label propagates deterministically
      through every round rather than approximately. The lossiness is CONDITIONAL on the key schedule
      transporting, and that condition is the thing under test rather than an assumption. If the key
      schedule fails to transport, the projection discards information the cipher retains, the orbit
      is not the right object, and that outcome is the falsification and a reusable measured obstruction
      rather than an empty result.'
    propagation: One round maps (L,R) -> (R XOR F_{a,b,c}(L) XOR k, L). Applying pi_u to both halves
      gives (pi_u L, pi_u R) -> (pi_u R XOR pi_u F_{a,b,c}(L) XOR pi_u k, pi_u L), and by the round-function
      identity pi_u F_{a,b,c}(L) = F_{ua,ub,uc}(pi_u L), so the image is exactly one round of the
      (ua,ub,uc) cipher under round key pi_u k. The orbit label is therefore invariant under one round
      with probability one, not with a weight. Over r rounds invariance composes if and only if the
      key schedule and round-constant sequence commute with pi_u, which is the single load-bearing
      step and is measured directly by incrementing r until equality fails.
    survival_score: 'Exact survival with no decay whenever key-schedule transport holds: conjugation
      is a cipher isomorphism, so the orbit label survives the full round count of every variant.
      It dissolves precisely at the first round whose round constant or key-schedule word is not pi_u-equivariant.
      The concrete number reported is r_max(u, variant), the largest r for which enc_{ua,ub,uc}(pi_u
      k, pi_u p) = pi_u enc_{a,b,c}(k, p) holds for all sampled (k,p); r_max equal to the full round
      count means exact survival, r_max in {0,1} means the symmetry is broken by the schedule at the
      first opportunity, and any intermediate value is unexpected and would itself need explaining.'
  null_object_control: 'The null object is a bit permutation sigma drawn uniformly from the symmetric
    group S_n on bit indices, rejecting those of the affine form i -> u i + v, paired with a rotation
    triple drawn uniformly from (Z/n)^3. The IDENTICAL equivariance test runs against it in the same
    invocation: for each random sigma, search all n^3 triples for one satisfying sigma F_{a,b,c}(x)
    = F_{a'',b'',c''}(sigma x) for all x. The null must show zero passing sigma out of at least 1000
    draws at n = 16, and must show the orbit-size histogram over uniformly drawn triples agreeing
    with the Burnside orbit-counting prediction computed independently in STAGE A. If any non-affine
    random permutation passes, the equivariance check is detecting an implementation artifact or a
    degenerate test vector rather than a symmetry, and no orbit claim may be made from the signal
    arm.'
  discriminated_from:
  - 'IDEA-20260815-a5a19f defines a computable equivalence on this program''s proposed ECDLP attack
    systems and quotients the proposal corpus by it. Same methodological move, entirely different
    object: a corpus of research records versus a cipher''s integer parameter space, and no cipher-level
    conjugacy or key-schedule transport is at stake there.'
  - KN-LIT-5292 as recorded in this corpus reports scoring a large set of SIMON variants with different
    rotation constants. The entry does not record whether the set was quotiented by symmetry, and
    this proposal asserts nothing about whether it was; it computes the orbit count locally and treats
    agreement or disagreement with any recovered prior count as a reproduction outcome to be reported.
  - Affine-equivalence classification of S-boxes operates on a substitution table of a small function
    under arbitrary affine input and output maps. Here the object is a rotation-index triple in Z/n
    and the equivalence is induced only by index-affine bit permutations, a much smaller group acting
    on parameters rather than on tables.
  - IDEA-20260805-33a11e tracks algebraic degree in the key argument of one fixed cipher, AES, to
    bound how many round keys an integral object survives. It measures a quantity inside a single
    cipher; this entry measures a labelling of a parameter space and makes no degree claim about any
    cipher.
  assumptions:
  - The SIMON round function has the form F(x) = (S^a x AND S^b x) XOR S^c x on n-bit words. This
    form is the object under study and is pinned against the specification and its published test
    vectors in STAGE 0 rather than taken from memory; the RQ explicitly refuses to restate the standardized
    constants because they were not confirmed, and this proposal inherits that refusal.
  - Bitwise AND and XOR are coordinate-wise on bit indices, hence commute with every bit permutation.
    Elementary, and verified by exhaustive test at n <= 8 rather than asserted.
  - Rotation amounts are read modulo n and the index map i -> u i is a bijection on Z/n exactly when
    gcd(u,n) = 1.
  - Round constants and key schedule are part of the cipher under test. Their pi_u-equivariance is
    NOT assumed; it is the measured quantity and its failure is a reportable outcome.
  - A pinned reference implementation reproducing the specification's test vectors is available before
    any orbit claim is made, per the RQ's second constraint.
  predictions:
  - metric: number of G-orbits on (Z/16)^3 under the group generated by unit multipliers and the AND-argument
      swap
    direction: lower
    minimum_effect: 'forced: strictly fewer than 4096, with the exact count computed symbolically
      by Burnside in STAGE A and frozen in the preregistration before the exhaustive union-find enumeration
      in STAGE D; the two independent computations must agree exactly or the arm is invalid'
  - metric: r_max, the largest round count at which pi_u-conjugated encryption matches conjugated
      ciphertext for all units u under the pinned key schedule
    direction: different
    minimum_effect: 'forced to a dichotomy: either r_max equals the full round count for every u,
      or r_max is 0 or 1 for at least one u. Intermediate values are not predicted and, if observed,
      falsify the framing and must be reported as such.'
  - metric: count of non-affine random bit permutations passing the round-function equivariance check
      in the null arm
    direction: lower
    minimum_effect: 0
  - metric: absolute difference between the standardized triple's percentile rank on the raw n^3 grid
      and on the orbit quotient, under the STAGE E surrogate measure
    direction: different
    minimum_effect: 'explicit refusal to pre-commit a magnitude: the difference is a deterministic
      function of orbit multiplicities not known until STAGE D, so naming a number now would be fabricating
      it. What is pre-committed is that both ranks are always reported side by side and that only
      the quotient rank may be quoted in a conclusion.'
  minimal_test:
    design: 'The cheapest discriminating measurement is STAGE B plus STAGE C at a single small word
      size, and it needs no solver at all. Fix n = 8, giving 512 triples and phi(8) = 4 units. For
      every unit u, every triple, and all 256 inputs x, check the round-function identity bitwise:
      512 x 4 x 256 = 524288 comparisons, under a second in pure Python. Then build the full Feistel
      with the pinned key schedule scaled to n = 8, draw 64 random key and plaintext pairs, and for
      r = 1, 2, 3, ... check whether conjugated encryption matches. The round index at which equality
      first fails is the entire answer: full-round equality establishes the class-function property
      for this variant, and failure at round one localizes the break to the key schedule and is equally
      informative. In the same invocation, run the null arm over 1000 random non-affine bit permutations
      against the identical check. Total cost is minutes on one core with no dependency beyond the
      standard library, and the outcome decides whether every later rank in this goal is computed
      over 4096 points or over the orbit count.'
    controls:
    - 'Null arm: 1000 uniformly drawn non-affine bit permutations subjected to the identical equivariance
      search, which must all fail.'
    - 'Identity control: u = 1 and the identity swap must pass trivially at every round count; failure
      indicates an implementation fault and halts the run.'
    - 'Deliberately non-equivariant key schedule: replace the round-constant sequence with a fixed
      non-symmetric pattern known to break pi_u-equivariance and confirm the cipher-level check fails,
      so a pass in the signal arm is known not to be vacuous.'
    - 'Test-vector control: the pinned reference implementation must reproduce the specification''s
      published test vectors before any conjugacy result is recorded.'
    - 'Independent orbit count: Burnside computation in STAGE A versus union-find enumeration in STAGE
      D, computed by separate code paths, must agree exactly.'
    required_metrics:
    - orbit_count per word size n
    - orbit multiplicity histogram, and the stabilizer order of the standardized triple
    - round_function_identity_mismatches, an exact integer count that must be zero
    - r_max per unit u per variant, with the pinned key schedule named
    - null_arm_passes out of null_arm_draws
    - percentile rank of the standardized triple on the raw grid and on the quotient, under the surrogate
      measure
    - wall-clock seconds and peak resident memory per stage
  falsification_conditions:
  - Any bitwise mismatch in the STAGE B round-function identity at any tested n falsifies claim (A)
    outright and the proposal ends there.
  - Burnside orbit count and union-find orbit count disagree, which invalidates the enumeration instrument
    regardless of what it reports.
  - r_max is 0 or 1 for some unit u under the pinned key schedule, which falsifies claim (B) at cipher
    level and reduces the result to a round-function-only statement that must be scoped as such.
  - Any non-affine random permutation passes the null-arm check, which shows the check is measuring
    an artifact.
  - The observed orbit count equals 4096, meaning the group acts freely and trivially in effect, which
    would make the correction in claim (C) empty and the proposal not worth its own cost.
  - r_max takes an intermediate value strictly between 1 and the full round count for some u, which
    contradicts the predicted dichotomy and means the framing is wrong even if some symmetry exists.
  confounders:
  - A reference implementation with an accidentally symmetric key schedule, or a test run using an
    all-zero key, can make the cipher-level check pass for reasons unrelated to pi_u-equivariance;
    random nonzero keys and the non-equivariant-schedule control exist to catch this.
  - Word sizes with small phi(n) make the group nearly trivial, so an apparently large orbit count
    at n = 8 (phi = 4) may not indicate the behaviour at n = 16 or n = 24; the metric is reported
    per n and never pooled.
  - Triples with a = b or with c in the stabilizer have nontrivial stabilizers and small orbits, which
    biases any unweighted average over orbit representatives; multiplicity weighting is mandatory
    and its omission is itself a confounder.
  - Rotation amounts that are equal modulo n but written differently in a specification transcription
    would silently change orbit membership; the STAGE 0 pinning against test vectors guards this and
    its failure invalidates everything downstream.
  - A surrogate measure in STAGE E that happens to be constant across the whole grid would make both
    percentile ranks meaningless and the impact number vacuous; the surrogate's resolution is reported
    alongside.
  interpretation_limits:
  - A confirmed conjugacy says only that certain measures cannot separate constants within an orbit.
    It says nothing about whether the measures separate constants across orbits, and nothing about
    the security of any variant.
  - The group G is a lower bound on the symmetry. Failure to find further equivalences here is not
    evidence that none exist, and the orbit count is an upper bound on the number of genuinely distinct
    constant sets rather than the exact number.
  - Every result is scoped to the tested word sizes and to the specific key schedule pinned in STAGE
    0. A different key schedule is a different cipher for this purpose.
  - Nothing here bears on design intent, provenance, or motive, and no record produced under this
    proposal may be read in that direction, in either direction, per RQ-SIMSPK-f6a6c0's fifth constraint.
  target_complexity:
    time_exponent: No attack exponent is claimed and none is implied. The enumeration cost is O(n^3
      phi(n)) group actions, which is 32768 elementary operations at n = 16; the exhaustive round-function
      check is O(n^3 phi(n) 2^n), which is 2^27 at n = 16 and is the dominant term, minutes in pure
      Python.
    memory_exponent: No attack memory exponent is claimed. Peak working set is one orbit table of
      n^3 entries, 4096 machine words at n = 16, well under one mebibyte, plus a union-find array
      of the same size.
    best_known: 'The incumbent is the methodological convention this campaign would otherwise inherit:
      ranking rotation constants over the raw n^3 grid, which is how the corpus''s record of KN-LIT-5292
      describes scoring a large set of variants with different rotation constants, with no orbit quotient
      recorded. The incumbent is a convention rather than an algorithm, and no algorithmic frontier
      is being contested.'
    hidden_overhead: 'The expensive part is human and sits in STAGE 0: the RQ refuses to restate the
      standardized constants because they were not confirmed, so a primary source must be read and
      a reference implementation validated against test vectors, and that acquisition may fail under
      the network policy, in which case the campaign proceeds with a named missing baseline. Also
      hidden: the true symmetry group may be larger than the two named generators once the key schedule
      is included, and computing correct stabilizers rather than assuming free action is the step
      a naive orbit loop quietly gets wrong.'
  dominated_by: 'n/a (no result claimed). A real Pareto check was performed across the three axes:
    on time, memory and data/queries this proposal produces no attack, no distinguisher and no query-bounded
    procedure against any cipher, so there is no frontier row on any axis to compare against. The
    only comparison available is methodological, raw grid versus quotient, and that is not a cost
    frontier.'
  sota_delta: 'no attack; conceptual/measurement contribution only. The single number that moves is
    the size of the ranked set: from n^3 = 4096 raw triples at n = 16 to the orbit count, a reduction
    bounded above by the group order 2 phi(16) = 16 and bounded below by 1, with the exact factor
    and the standardized triple''s stabilizer order being the deliverable.'
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Part (A), the round-function conjugacy as an algebraic identity: 0.95,
    because it follows from AND and XOR being coordinate-wise and from pi_u normalizing the rotation
    group, and the residual 0.05 is transcription risk in the round-function form itself, which STAGE
    0 pinning addresses. Part (B), cipher-level transport including the key schedule: 0.35, because
    round constants exist precisely to break structural symmetries and a schedule that is pi_u-equivariant
    would be unusual; this is the part most likely to fail and its failure is still a usable measured
    obstruction. Part (C), that the multiplicity correction materially moves the standardized triple''s
    percentile: 0.5, entirely dependent on that triple''s stabilizer, which is unknown before STAGE
    D. Part (D), that the orbit count is strictly below 4096: 0.9, since only triples with trivial
    stabilizer under a group of order 16 could keep the count near the maximum, and such uniformity
    across the whole grid would be surprising.'
