idea:
  id: IDEA-20260802-007
  question_id: RQ-ECDLP-002
  title: >-
    Charged-unit cost model with a planted-bug positive control and mandatory matched
    frontiers - retiring wall clock as a decision variable across every cost-bearing lane
  class: tooling
  claim: >-
    A SINGLE SHARED CHARGED-UNIT ACCOUNTING LAYER - counting group operations, field
    multiplications and inversions, table entries and table-build charges with an
    amortization policy fixed in the contract - can be validated to a standard this
    campaign has never applied to a cost measurement, and doing so is the cheapest
    available repair of the failure that produced its most expensive false signal.
    SPECIFICALLY THE LIBRARY (i) REPRODUCES THE ARCHIVED EXP-DS-001 CHARGED-UNIT FIGURES
    FROM THE ARCHIVED RAW RESULTS - R = 1914080/130630800 = 0.01465 and
    R_null = 465080/486040 = 0.95688, against the wall-derived 0.03216 and 111.447 that
    the same package reported, a 2.20x and 116.5x proxy disagreement independently
    recomputed by the Coordinator at DEC-20260801-003 - to a relative tolerance of 1e-6;
    (ii) DETECTS A PLANTED ACCOUNTING BUG at every one of 20 planted instances spanning a
    ladder of injected distortion factors from 1.25x to 8x, with the DETECTION FRACTION
    REPORTED PER RUNG so that the detection floor is measured rather than asserted;
    (iii) RETURNS 1.000 +- 0.01 on an honest-versus-honest comparison of two independent
    implementations of the same algorithm; and (iv) EMITS THE THREE MATCHED FRONTIERS AS
    FIRST-CLASS OUTPUTS of every cost-bearing run - Pollard rho with negation, BSGS, and
    the Kuhn-Struik multi-target curve sqrt(L*N) for L targets. FALSIFIED if (a) the
    archived figures cannot be reproduced from the archived raw results, which would mean
    either the archived numbers or the library is wrong and either is decision-relevant;
    (b) any planted-bug rung above 2x escapes detection, which voids the harness; or
    (c) honest-versus-honest departs from 1.000 by more than 0.01, which is a calibration
    defect.
  mechanism: >-
    BATCH-020 produced this campaign's most expensive false signal and the mechanism is
    fully documented. A wall-clock ratio R_null of 111.447 was read as evidence of
    structure dependence; the SAME RUN's deterministic charged-unit ledger put the same
    quantity at 0.95688. The 116.5x gap was driven by the null arm rebuilding a
    4096-entry table inside every attempt while the real arm amortized its table once -
    an ACCOUNTING ASYMMETRY, not a mathematical difference. The same package's relation
    collection cost 64 * 1033.909835504201 = 66170.2 rho-equivalent group operations
    against a MEASURED 744-operation rho solve of the same instance, an 88.9x deficit
    that no wall-clock ratio would have surfaced.
    THE REPAIR IS NOT A POLICY, IT IS AN INSTRUMENT. A policy that says 'use charged
    units' does not prevent two arms from charging differently; only a shared ledger with
    a fixed amortization rule does. The library therefore fixes THREE things that a
    per-experiment ledger cannot - the unit definitions, the amortization policy for
    precomputed structures, and the identity of the matched baselines - and it validates
    all three against a plant whose detection floor is measured.
    THE PLANTED-BUG LADDER IS THE PART THAT MATTERS AND IT IS WHERE FOUR OF THIS
    CAMPAIGN'S FIVE INSTRUMENT FAILURES LIVE. A control that has never been shown to
    detect the defect it exists to detect certifies nothing; a control shown to detect an
    8x distortion but never tested at 1.25x has an UNMEASURED FLOOR and its non-firing
    means less than it reads. The ladder measures the floor, and a rung with no measured
    detection is reported as uncertified rather than quietly included.
    THE THREE FRONTIERS ARE MANDATORY OUTPUTS BECAUSE OF WHAT THEY GATE. Pollard rho and
    BSGS are already required by RQ-ECDLP-002's constraints. The Kuhn-Struik curve is
    added because IDEA-20260731-010's shared-factor-base multi-target amortization lane is
    LIVE AND UNCONSUMED, and any multi-target scheme must beat sqrt(L*N) total to be a
    result at all - emitting that curve automatically makes the gate impossible to skip
    and is the cheapest possible disposition of that lane.
  novelty_status: adaptation
  novelty_screen:
    screened_on: '2026-08-02'
    corpus_paths_grepped:
    - ledger/proposals
    - ledger/decisions/DEC-20260801-003.yaml
    - experiments/EXP-DS-001
    grep_results:
    - >-
      IDEA-20260731-011 installs a structure-destruction null gate for sub-birthday
      claims and includes a planted-false-speedup positive control. IT IS THE CLOSEST
      PRIOR RECORD AND IT IS COMPLEMENTARY, NOT DUPLICATIVE - that record decides whether
      a claimed speedup survives an object-level null; this record decides what the
      speedup number MEANS before any null is applied, by fixing the unit. The BATCH-020
      failure was not a missing null, it was a wall-clock proxy; the matched-algorithm
      null on Z/753848Z that followed was decisive precisely because it was read in
      charged units.
    - >-
      IDEA-20260727-004 concerns a simulation-overhead budget for GGM verdicts, a
      different object.
    - >-
      No corpus record proposes a shared charged-unit library with a measured
      planted-bug detection floor.
    literature_verified:
    - >-
      Kuhn and Struik, 'Random Walks Revisited - Extensions of Pollard's Rho Algorithm
      for Computing Multiple Discrete Logarithms', SAC 2001 - existence, authorship,
      venue and subject CONFIRMED by web search on 2026-08-02
      (link.springer.com/chapter/10.1007/3-540-45537-X_17). The sqrt(L*N) total figure is
      attributed to that line and the exact constant must be transcribed from the primary
      source before the curve is emitted as a baseline; a KN-LIT entry is owed.
    - >-
      Corrigan-Gibbs and Kogan, 'The Discrete-Logarithm Problem with Preprocessing',
      EUROCRYPT 2018 - CONFIRMED by web search on 2026-08-02, with the lower bound
      ST**2 = Omega(epsilon N) for generic preprocessing discrete-log, tight up to
      logarithmic factors (eprint.iacr.org/2017/1113). Included as a FOURTH frontier row
      to be emitted when a proposal makes a preprocessing claim.
    conclusion: >-
      Adaptation. Charged-unit accounting is standard practice; the contribution is the
      shared amortization policy, the measured planted-bug detection floor, and the
      automatic emission of four frontier rows so that `dominated_by` can never again be
      written as an unchecked null.
  assumptions:
  - >-
    The archived EXP-DS-001 raw results remain readable at their archived paths and are
    NOT edited, renamed or re-hashed by this work. Reproduction is read-only.
  - >-
    Unit definitions are fixed in a hash-bound specification BEFORE any reproduction is
    attempted, so that reproducing the archived figures is a test of the library rather
    than a fitting exercise. A unit definition adjusted after seeing a mismatch is a
    contract violation and the mismatch must be reported instead.
  - >-
    The amortization policy is stated as a rule (what is charged once, what is charged
    per attempt, and how a shared table is apportioned between arms) and applies
    identically to every arm of every experiment that uses the library.
  predictions:
  - metric: archived_figure_reproduction_relative_error
    direction: same
    minimum_effect: >-
      '<= 1e-6 on both R = 0.01465 and R_null = 0.95688 recomputed from the archived raw
      results. A point prediction that can fail, against numbers two independent sessions
      have already recomputed.'
  - metric: planted_bug_detection_fraction_per_rung
    direction: increasing
    minimum_effect: >-
      'Monotonically increasing across the distortion ladder {1.25, 1.5, 2, 4, 8}, with
      detection 20 of 20 at every rung at or above 2x and the detection fraction at 1.25x
      and 1.5x REPORTED AS THE MEASURED FLOOR rather than assumed. A ladder that does not
      increase means the detector is not responding to distortion and the harness is
      void.'
  - metric: honest_versus_honest_ratio
    direction: same
    minimum_effect: >-
      '1.000 +- 0.01 between two independently written implementations of matched rho on
      the same instances. A departure is a calibration defect and blocks use.'
  - metric: frontier_emission_completeness
    direction: same
    minimum_effect: >-
      'Four rows emitted on every cost-bearing run - rho with negation, BSGS,
      Kuhn-Struik sqrt(L*N), and the ST**2 preprocessing frontier - each with the cost
      model that produced it. A run that emits fewer is rejected by the library, which is
      how `dominated_by: null` stops being writable by accident.'
  - metric: amortization_asymmetry_detector
    direction: same
    minimum_effect: >-
      'Replaying the BATCH-020 asymmetry deliberately - one arm rebuilding its table per
      attempt, the other amortizing - must be FLAGGED by the library as an amortization
      mismatch, at 20 of 20 instances. This is the specific historical failure and the
      library must catch it by construction, which is a point prediction that can fail.'
  minimal_test:
    design: >-
      (1) Freeze unit definitions, the amortization policy and the four frontier
      definitions in a hash-bound specification. (2) Implement the library and a
      reference matched-rho, matched-BSGS and matched-Kuhn-Struik. (3) Reproduce the two
      archived EXP-DS-001 figures from the archived raw results, read-only. (4) Run the
      planted-bug ladder at 20 instances per rung and report the detection fraction with
      exact binomial intervals per rung. (5) Run honest-versus-honest between two
      independently written rho implementations. (6) Replay the BATCH-020 amortization
      asymmetry and confirm the mismatch flag fires. (7) Emit and archive the four
      frontier rows for a trivial reference workload as a schema check.
    controls:
    - >-
      PLANTED-BUG LADDER WITH A MEASURED FLOOR. Not a single planted defect - a ladder,
      because a control whose detection floor is unmeasured has an unmeasured meaning.
    - >-
      HONEST-VERSUS-HONEST NEGATIVE CONTROL, which must return 1.000.
    - >-
      BATCH-020 AMORTIZATION REPLAY as a historical known-answer control.
    - >-
      READ-ONLY REPRODUCTION of archived figures; nothing under experiments/EXP-DS-001 is
      written, renamed or re-hashed.
    required_metrics:
    - reproduction relative error on both archived figures
    - detection fraction per distortion rung with exact binomial intervals
    - honest-versus-honest ratio with its interval
    - amortization-mismatch flag rate on the replay
    - the four emitted frontier rows with their cost models, machine-readable
  falsification_conditions:
  - >-
    'Q1 - the archived figures are not reproduced to 1e-6: EITHER the archived numbers or
    the library is wrong. This is decision-relevant in both directions and must be routed
    to a correction record, never absorbed by adjusting a unit definition.'
  - >-
    'Q2 - any rung at or above 2x escapes detection: HARNESS VOID. The library may not be
    used by any experiment until repaired.'
  - >-
    'Q3 - honest-versus-honest departs from 1.000 by more than 0.01: calibration defect,
    blocks use.'
  - >-
    'Q4 - the amortization replay is not flagged: the library does not catch the one
    failure it was built for, and its value proposition is falsified.'
  confounders:
  - >-
    A charged-unit count can be gamed by choosing units that favour one arm - counting
    group operations when one arm does field work, for example. The unit set must cover
    every primitive both arms use and the specification must state what is NOT counted
    and why.
  - >-
    Amortization is genuinely ambiguous when a table serves several targets. The policy
    must pick one convention, state it, and require every ratio to be reported under BOTH
    the chosen convention and the per-attempt convention, so that a result that depends on
    the convention is visible as such.
  - >-
    Reproducing archived figures exercises the archived numbers, not the archived
    reasoning. A successful reproduction does not rehabilitate any BATCH-020
    interpretation and the record must say so.
  interpretation_limits:
  - >-
    THIS CANNOT MOVE AN EXPONENT AND CLAIMS NO MATHEMATICS. It is infrastructure. Its
    justification is that it unblocks IDEA-20260802-003's baselines, IDEA-20260802-005's
    entire decision variable, and IDEA-20260731-010's multi-target lane, and that it
    retires the proxy that produced this campaign's most expensive false signal.
  - >-
    Passing the library's gates is NECESSARY and not sufficient for any cost claim. A
    correctly counted cost on a structure-free algorithm is still a structure-free
    algorithm - EV-DS-003 and DEC-20260801-003 established exactly that for the
    degree-split lane, and IDEA-20260731-011's object-level null remains required
    independently.
  - >-
    Charged units are a MODEL of cost, not cost. A charged-unit ratio does not predict a
    wall-clock ratio and no deliverable may present one as the other.
  heuristic_assumptions:
  - id: HEUR-CU-1
    statement: >-
      Charged units under the frozen unit set are proportional, to within a factor
      bounded uniformly over the tested algorithms, to the asymptotically dominant cost of
      those algorithms - so that a charged-unit exponent equals the true exponent.
    rigorous_support: >-
      For rho and BSGS the dominant cost IS group operations and the proportionality is a
      theorem of their standard analyses. For index-calculus arms it is NOT - the sparse
      linear algebra and the Gröbner or lattice steps have their own units and the
      proportionality constant is not uniform. This is stated as an assumption precisely
      because it fails for the lane the campaign most wants to measure.
    validation_plan: >-
      Measured, not assumed - for each algorithm in the reference set, report the
      charged-unit count against the wall clock across at least three problem sizes and
      fit the exponent of each. A charged-unit exponent that differs from the wall-clock
      exponent by more than 0.05 on any algorithm is recorded as a NAMED LIMITATION of
      the model for that algorithm and travels with every result that uses it. TOY SCALE.
  target_complexity:
    time_exponent: >-
      n/a - infrastructure, no algorithm, no exponent claimed or moved.
    memory_exponent: n/a
    best_known: >-
      n/a as an attack. As an instrument, the incumbent in this campaign is per-experiment
      ad hoc accounting, which produced a 116.5x disagreement between two proxies inside a
      single validated run package.
    hidden_overhead: >-
      Instrumentation slows the measured code; the overhead must be measured and reported
      and must not enter any ratio, since it applies to all arms by construction only if
      the instrumentation is placed identically - which the specification must require and
      the honest-versus-honest control tests.
    tradeoff_note: n/a
  dominated_by: >-
    n/a - no attack result is claimed and no point on any Pareto frontier is occupied.
    Written explicitly rather than as an unchecked null, which is the discipline this
    record exists to automate.
  sota_delta: >-
    Zero on every ECDLP cost axis. The instrument delta is from an unmeasured detection
    floor and a proxy disagreement of 116.5x within one package, to a measured detection
    floor per distortion rung and a single ledger with a stated amortization policy.
  instrument_failure_guards:
    decision_variable: >-
      The reproduction relative error, the per-rung detection fraction, and the
      honest-versus-honest ratio.
    what_would_make_it_vary: >-
      The INJECTED DISTORTION FACTOR, which is an externally imposed knob with a known
      magnitude and a monotone expected effect on detection. That is the entire point -
      the campaign's four instrument failures all involved a statistic whose response to
      the perturbation was never measured, and here the perturbation IS the ladder.
    power_against: >-
      Multiplicative accounting distortions at or above the measured floor, and
      amortization asymmetries of the BATCH-020 kind.
    no_power_against: >-
      Errors shared by all arms (a unit definition that is wrong for everyone is invisible
      to a ratio - standing limit U1, which is why the archived-figure reproduction is
      included as an ABSOLUTE check against externally computed numbers rather than as a
      second sample); modelling error where charged units are not proportional to true
      cost, which HEUR-CU-1 measures and does not fix; and any mathematical question
      whatsoever.
    demonstrated_movement: >-
      BY MEASUREMENT, ACROSS FIVE RUNGS, WITH THE FLOOR REPORTED. And by the historical
      replay, which is a known-answer case whose correct outcome is documented in a
      committed decision record.
    lessons_addressed: >-
      Lesson 1 - the decision variable is a measured count, and the historical failure it
      repairs is exactly a decision variable that was a proxy rather than the quantity of
      interest. Lesson 4 - the planted distortion demonstrably creates the deviation it
      certifies against, at every rung above the measured floor. Standing limit U1 - the
      absolute check is reproduction of externally computed archived numbers, not a second
      sample.
  estimated_cost:
    implementation: medium
    compute: low
  compute_budget_note: >-
    Reproduction is arithmetic on archived JSON. The ladder is 100 short rho runs. Under
    an hour of compute in total; the cost is implementation, not compute.
  recommended_priority: high
  dependencies:
  - >-
    None blocking. It is a dependency OF IDEA-20260802-005 (which needs charged units for
    its entire decision variable) and a convenience for IDEA-20260802-003's matched
    baselines, and it is the cheapest gate available on IDEA-20260731-010's live
    multi-target lane.
  proposed_by: idea-generator
  proposed_at: '2026-08-02'
  inference:
    requested_policy: idea-generation
    resolved_model_id: claude-opus-5
    reasoning_effort: null
    fallback_used: true
    fallback_reason: >-
      This Claude Code harness cannot resolve the policy aliases in
