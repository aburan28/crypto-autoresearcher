idea:
  id: IDEA-20260806-530fdd
  question_id: RQ-ECDLP-002
  added: '2026-08-06'
  title: >-
    A COMPLETELY DIFFERENT COMPUTATIONAL MODEL: replace the program's
    case-by-case "oracle X is GGM-simulable" closures with a DEGREE-BUDGETED
    algebraic oracle model AOM_d, in which simulability is a theorem parameterised
    by one integer d and the Semaev summation polynomial is located at an exact
    coordinate d = 2^{m-2} -- turning a list of five killed oracles into an index
    set with a measurable threshold
  class: mechanism

  claim: >-
    (A) THE DEFECT IN THE CURRENT MODEL, STATED AS THIS PROGRAM'S OWN RECORDS
    STATE IT. KN-FIND-002 closes jet and endomorphism ECDLP oracles as
    GGM-simulable with O(1) overhead. KN-FIND-b7e091 closes the incidence and
    endomorphism oracle classes. IDEA-20260726-004 proposes machine-checkable
    GGM simulability certificates for augmented oracles. IDEA-20260726-006 gives
    a closed-form simulator for the endomorphism oracle. IDEA-20260727-004 asks
    when a SIMULABLE verdict actually closes a candidate. Every one of these is a
    verdict about ONE oracle. Under docs/inventor-protocol.md section 4 that is
    a count of screened-and-rejected mechanisms, whose honest status is
    `unverified` -- and the program says so about itself. What is missing is the
    thing that would make it a closure: a statement about ALL oracles, indexed.

    (B) THE MODEL. Fix E/F_p and a prime-order subgroup G = <P>. For an integer
    d >= 1 define the DEGREE-d ALGEBRAIC ORACLE MODEL AOM_d: the adversary gets
    the generic-group interface (opaque labels, group operations) AND, for any
    tuple of previously obtained group elements, may query any oracle O_f where
    f is a system of polynomials in the AFFINE COORDINATES of those elements
    with total degree at most d, receiving the F_p-points of the variety f = 0
    (or a membership bit). AOM_1 is the plain generic group with coordinate
    arithmetic; AOM_infinity is the standard model. The model is a LADDER, and
    every oracle this program has closed sits at a specific rung: the
    endomorphism oracle at d = O(1) (an isogeny of bounded degree is a bounded
    -degree rational map), the jet oracle at d = O(1) in the truncation order,
    the incidence oracle at d = 2 (a line meeting a cubic).

    (C) THE CLAIM, WHICH IS A SIMULATION THEOREM WITH A THRESHOLD.
      CONJECTURE AOM: there is a function T(p) such that for every d < T(p) and
      every constant arity t, every AOM_d oracle admits a generic-group
      simulator whose overhead is bounded by the number of F_p-points on the
      queried variety, i.e. by O(d^t) via Bezout and by the Lang-Weil estimate
      d^{t-1} p^{dim} + O(d^{c} p^{dim - 1/2}) when the variety is absolutely
      irreducible -- so the overhead is POLYNOMIAL IN d AND NOT IN p.
    The content is that the simulator's cost is controlled by a DEGREE-DRIVEN
    point count and by nothing else. If true, it subsumes KN-FIND-002 and
    KN-FIND-b7e091 as the d = O(1) corollary, and it says exactly what a
    non-generic algorithm must do to escape: drive d superpolynomially.

    (D) THE PAYOFF, AND IT IS A COORDINATE, NOT A SLOGAN. Semaev's m-th
    summation polynomial S_m has degree 2^{m-2} in each variable
    (KN-TECH-002). So point-decomposition index calculus is NOT "a clever
    non-generic idea"; under this model it is the assertion that the ONLY known
    way to leave the simulable regime is to pay degree 2^{m-2}, and the whole
    index-calculus lane is the study of one point on the AOM ladder. That is a
    falsifiable structural statement about the entire attack space, and it
    yields the enumeration the program says it lacks (KN-OPEN-019): the index
    set is the degree axis, and the question "is there a fundamentally new
    ECDLP algorithm" becomes "is there an oracle at intermediate d, between O(1)
    and 2^{m-2}, that is neither simulable nor already known".

    (E) WHAT WOULD REFUTE IT, WHICH IS THE MOST VALUABLE OUTCOME. Exhibit an
    oracle of degree d = polylog(p) that is provably NOT simulable with poly(d)
    overhead. Such an object would be a genuinely new non-generic handle on the
    ECDLP sitting BELOW the Semaev degree, and finding one is the constructive
    branch of this proposal. The proposal is designed so that the refutation is
    the interesting result and the theorem is the closure -- both are
    deliverables.

    (F) WHAT THIS IS NOT. It is NOT a claim that the ECDLP is hard. It is NOT a
    proof of any lower bound: the generic-group bound applies to AOM_1 only, and
    a simulation theorem transports it to AOM_d for d below the threshold and
    says NOTHING above it. It does NOT contradict any known attack: MOV /
    Frey-Ruck (KN-TECH-032) and Smart's anomalous attack (KN-TECH-033) are
    oracles of low degree that ARE simulable in this sense yet still break their
    curves, because they exploit the GROUP ORDER, not the coordinate structure --
    and the model must reproduce that, which is its baseline-embedding audit.

  discriminated_from:
    - >-
      KN-TECH-005 (generic group model and the square-root lower bound). That is
      AOM_1. The proposal is the ladder above it, and its content is precisely
      the transport of the bound up the ladder.
    - >-
      KN-FIND-002, KN-FIND-b7e091, IDEA-20260726-004, IDEA-20260726-006,
      IDEA-20260727-004. Each is a verdict at one rung, or an instrument for
      producing verdicts at one rung. None states a theorem quantified over d,
      and none locates Semaev on a common axis with the closed oracles.
      This proposal's deliverable is the quantified statement plus the location.
    - >-
      The Algebraic Group Model of the cryptographic-reduction literature. It
      appears in this corpus only in literature notes (30 files, all under
      knowledge/literature and knowledge/sources.json; ZERO proposals, ZERO
      hypotheses). The AGM constrains an adversary to output REPRESENTATIONS of
      group elements as linear combinations of its inputs, and is used to prove
      reductions between assumptions. AOM_d constrains the adversary's ORACLE
      QUERIES by coordinate degree and is used to ask whether a lower bound
      transports. Different restriction, different purpose; the relation between
      them is itself an obligation recorded below.
    - >-
      IDEA-20260803-fa9839 (the arity threshold) and IDEA-20260803-e2f5bd
      (Bezout bound composed with the arity threshold). Those fix a cost target
      for the decomposition ORACLE at a given arity m and ask how cheap it must
      be. This proposal fixes the DEGREE of an arbitrary oracle and asks whether
      the generic bound survives. The two meet at exactly one point -- Semaev at
      d = 2^{m-2} -- and that intersection is a consistency check this record
      owes, not a duplication.

  mechanism: >-
    STEP 1 -- WRITE THE MODEL DOWN PRECISELY, WHICH IS WHERE IT CAN DIE. The
    hard part is not the ladder, it is stating what the oracle returns. Three
    variants must be defined and kept apart, because they have different
    simulation costs and conflating them is the most likely way to produce a
    theorem about nothing:
      AOM_d^bit  -- returns one bit, "does f vanish somewhere on the queried
                    tuple's coordinates";
      AOM_d^pt   -- returns one uniformly random F_p-point of {f = 0};
      AOM_d^enum -- returns all F_p-points of {f = 0}.
    Semaev decomposition is an AOM^pt-style oracle: it wants ONE decomposition,
    not the whole fibre. The corpus's closed oracles are mostly AOM^bit or
    AOM^pt at bounded degree. Any theorem must name its variant in its
    statement.

    STEP 2 -- THE SIMULATOR AND ITS BUDGET. The generic simulator maintains a
    table of formal labels with known discrete logs relative to P. To answer an
    AOM_d query it must decide the vanishing of f on coordinates it has not
    committed to. The proposed argument: because f has degree d in the
    coordinates and the coordinates of a group element are constrained by the
    curve equation, the query defines a variety of dimension bounded by the
    arity and degree bounded by d; the simulator answers by SAMPLING a label
    with a fresh formal log and checking consistency, and the failure
    probability per query is bounded by (number of points on the variety) / |G|.
    Bezout gives d^t; Lang-Weil sharpens it for absolutely irreducible f. The
    theorem's threshold T(p) is the d at which d^t stops being negligible
    against |G| ~ p -- i.e. T(p) is roughly p^{1/t}. THAT IS THE PREDICTED
    THRESHOLD AND IT IS A NUMBER, so it can be wrong.

    STEP 3 -- THE BASELINE-EMBEDDING AUDIT, WHICH THE MODEL MUST SURVIVE FIRST.
    Two known attacks must appear correctly in the model or the model is wrong:
      - MOV / Frey-Ruck on low-embedding-degree curves. The pairing is a
        bounded-degree algebraic map, so it sits at small d and the theorem
        would call it simulable -- yet it breaks the curve. RESOLUTION THE MODEL
        MUST STATE: the pairing's power comes from mapping into a DIFFERENT
        group whose order shares the subgroup order, which is group-order
        structure, not coordinate structure; the simulator is a simulator
        relative to a FIXED group and the transfer changes the group. If the
        model cannot express that distinction cleanly, it is not a model.
      - Smart's anomalous-curve attack. The formal logarithm is a power series,
        i.e. unbounded degree in the naive reading, but it is exact because
        #E(F_p) = p. Same resolution class: group order.
    An attempt at this audit that cannot place both attacks is a Stage-0
    failure and ends the proposal at zero compute.

    STEP 4 -- LOCATE EVERY ORACLE THIS PROGRAM HAS EVER CONSIDERED ON THE
    LADDER. Produce one table: oracle, arity t, degree d, variant
    (bit / pt / enum), simulability verdict already recorded, and whether that
    verdict is consistent with the conjectured threshold. Inconsistencies are
    the finding. This step is zero compute and is the deliverable even if the
    theorem is never proved.

  novelty_status: speculative
  novelty_screen:
    method: >-
      grep -ril over ledger/, knowledge/, docs/ for "algebraic group model",
      "degree budget", "AOM", "simulable", "simulability", "Lang-Weil",
      performed 2026-08-06 against merge-base 0c856274.
    results: >-
      "algebraic group model" occurs in 30 files, ALL of them under
      knowledge/literature/ or knowledge/sources.json; ZERO proposals, ZERO
      hypotheses. Simulability verdicts occur in KN-FIND-002, KN-FIND-b7e091 and
      the IDEA-20260726/27 series, always for a NAMED oracle. No record in this
      repository states a simulation claim quantified over a degree parameter,
      and no record places Semaev's degree on the same axis as the closed
      oracles.
    verdict: >-
      SPECULATIVE. The ingredients (generic group model, Bezout, Lang-Weil,
      algebraic adversary models) are all standard and none is claimed as new.
      What is proposed as new to this program is the PARAMETERISATION and the
      resulting index set. No claim of novelty against the external literature
      is made: the possibility that a degree-parameterised generic-model
      hierarchy already exists in the published record is explicitly open, and
      Stage 0 includes a literature check whose negative result would demote
      this to `adaptation` rather than kill it.

  null_object_control: >-
    THE MODEL ITSELF NEEDS A NULL, AND IT IS THE ONE STEP MOST LIKELY TO BE
    SKIPPED. Instantiate AOM_d over a group where the ECDLP is EASY for
    structural reasons the model should NOT see -- an anomalous curve, and a
    curve of embedding degree 1 -- and confirm the simulation theorem's
    statement still holds there (it should: those attacks live in group-order
    structure, not coordinate degree). If the theorem as stated "predicts
    hardness" on a curve that is actually broken, the model is measuring the
    wrong thing and no positive statement may be made from it. Second null: a
    RANDOM degree-d polynomial system of the same support and arity as S_m --
    if the simulator's measured overhead is identical on the random system and
    on Semaev, then degree, not Semaev structure, is the whole story, which is
    the intended reading and must be confirmed rather than assumed.

  assumptions:
    - >-
      The curve is a prime-field short-Weierstrass curve with prime-order
      subgroup G of order N ~ p; Pohlig-Hellman hygiene (KN-TECH-030) is assumed
      applied so no small-subgroup structure is available.
    - >-
      "Coordinates" means affine (x, y) in a fixed curve model. The model is
      NOT model-independent: a change of curve model changes degrees, and the
      proposal must therefore state its model or its threshold is meaningless.
      This is recorded as a defect to be resolved, not hidden.
    - >-
      Bezout and Lang-Weil are used as quoted standard results. Neither is
      re-derived here and neither has been re-read in this session.

  proof_search_map:
    bottleneck: >-
      The per-query failure probability of the generic simulator when the query
      is a degree-d condition on coordinates the simulator has not committed to.
      Everything else in the argument is bookkeeping; this single bound is what
      determines whether the threshold is p^{1/t} or something far smaller.
    baseline_embedding:
      parameter_slice: >-
        d = 1, t = 2 must reproduce the plain generic group model of
        KN-TECH-005 exactly, including its sqrt(N) lower bound.
      reproduction_check: >-
        Symbolic: instantiate the simulator at d = 1 and check it is literally
        Shoup's simulator. Plus a frozen regression fixture: the measured query
        count to solve a toy ECDLP in the implemented AOM_1 must match the
        sqrt(N) prediction within the pre-registered band, at the same toy
        primes the program already uses for rho baselines.
    observation_collision:
      observable: >-
        The pair (d, simulation overhead) assigned to an oracle.
      distinct_preimage_search: >-
        REQUIRED AND SHARP: find two oracles with the SAME (d, t, variant) whose
        true simulability differs. That is a direct falsifier of the claim that
        degree alone controls simulability. The pairing oracle on an
        embedding-degree-1 curve versus the pairing oracle on a generic curve is
        the first candidate collision to test, and it is cheap: same degree,
        opposite consequence. If the model cannot separate them by some
        additional declared condition, the conjecture is refuted as stated and
        must be restated with that condition or abandoned.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the question "is this oracle non-generic" into the model where it
          becomes the exact numeric condition "d >= T(p)", with separate
          encoding, completeness, soundness and cost-loss obligations.
        predicted_gain: >-
          Converts an open-ended search over mechanisms into a search over one
          integer axis. The gain is in FALSIFIABILITY, not in attack cost, and
          the target_complexity block says so.
      - transform: boundary_lift
        proposed_object: >-
          Enlarge the certificate family of IDEA-20260726-004 from "certificate
          that THIS oracle is simulable" to "certificate that every oracle of
          degree <= d is simulable", and prove the strict inward improvement
          rather than mere feasibility.
        predicted_gain: >-
          One certificate replaces an unbounded sequence of per-oracle
          certificates, which is the difference between a fatigue report and a
          closure.
    quantifier_order: >-
      THE ORDER IS THE WHOLE DISPUTE AND IS STATED EXPLICITLY.
      Intended: EXISTS T(.) FORALL p FORALL d < T(p) FORALL arity t = O(1)
      FORALL oracles f of degree <= d EXISTS a simulator S with overhead
      poly(d, t, log p).
      The dangerous weaker reading, which must NOT be claimed: FORALL f EXISTS T
      -- letting the threshold depend on the oracle, which makes the statement
      vacuous. The audit obligation is to check at every step of the argument
      that the simulator's construction does not secretly depend on f beyond its
      degree and arity.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Below degree T(p), no oracle helps beyond the generic bound." It can
        NEVER certify hardness of the ECDLP, because the standard model is
        AOM_infinity and the theorem is silent there. Any write-up that blurs
        this is overclaiming under AGENTS.md rule 4.
      nearby_object_control: >-
        The multiplicative group F_p^*, where index calculus DOES beat the
        generic bound. The same ladder must be instantiable there, and the
        model must locate the smoothness oracle at its correct degree and
        correctly FAIL to certify hardness. A model that "proves" hardness for
        F_p^* has identified nothing and is refuted on the spot. This is the
        single cheapest and most decisive check in the whole proposal and it is
        Stage 0.
    proof_obligations:
      - claim: AOM_1 is exactly the generic group model of KN-TECH-005.
        responsibility: baseline
      - claim: Per-query simulator failure probability is bounded by d^t / N.
        responsibility: success_probability
      - claim: Simulator overhead is poly(d, t, log p) below the threshold.
        responsibility: runtime
      - claim: The three oracle variants are kept distinct throughout.
        responsibility: interface
      - claim: The F_p^* instantiation does not certify hardness.
        responsibility: scope
      - claim: MOV and Smart are correctly located and correctly not blocked.
        responsibility: correctness

  predictions:
    - metric: >-
        threshold degree T(p) at which the simulator's per-query failure
        probability becomes non-negligible, measured at toy primes
      direction: different
      minimum_effect: >-
        Predicted T(p) ~ p^{1/t} for arity t. Measured T must track p^{1/t}
        across at least four toy primes spanning a factor 16 in p, with the
        fitted exponent within 0.1 of 1/t. A measured threshold independent of p
        refutes the mechanism.
    - metric: >-
        simulator overhead on Semaev S_m queries versus on random systems of the
        same degree, support and arity
      direction: different
      minimum_effect: >-
        Predicted IDENTICAL within a factor 2. A material gap means Semaev
        structure, not degree, drives simulability, which refutes the model's
        central claim that degree is the index.
    - metric: >-
        number of previously recorded simulability verdicts inconsistent with
        the conjectured threshold
      direction: different
      minimum_effect: >-
        Predicted 0 of the recorded verdicts (KN-FIND-002, KN-FIND-b7e091 and
        the IDEA-20260726/27 series). Any inconsistency is a finding about the
        prior verdicts and must be reported as such.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE, in this order): (i) instantiate the
      ladder over F_p^* and check it does NOT certify hardness; (ii) locate MOV
      and Smart and check the model does not block them; (iii) check d = 1
      reproduces Shoup. Any of the three failing ends the proposal here at zero
      cost, and that is the intended cheap death.
      STAGE 1 (hours, implementation): implement AOM_d^bit, ^pt and ^enum over
      toy curves at the primes already used for the program's rho baselines,
      with the generic simulator instrumented to count queries and failures.
      STAGE 2 (minutes): measure T(p) by sweeping d upward until the failure
      rate crosses the pre-registered band; fit the exponent across primes.
      STAGE 3 (minutes): run the Semaev-versus-random-system comparison at
      m = 3, 4, with the random systems matched on degree, support and arity.
      STAGE 4 (zero compute): fill the ladder-location table for every oracle in
      the program's history and report inconsistencies.
    controls:
      - >-
        F_p^* instantiation -- the model must fail to certify hardness there
      - >-
        MOV and Smart location -- the model must not block known attacks
      - >-
        d = 1 must reproduce the generic group model exactly
      - >-
        random-system null matched on degree, support and arity
      - >-
        two independent implementations of the simulator must agree on query
        counts for a frozen seed before any threshold is fitted
    required_metrics:
      - per-(p, d, t, variant) simulator query count and failure rate
      - fitted threshold exponent with its confidence interval, per arity
      - Semaev-versus-random overhead ratio at m = 3 and m = 4
      - pass/fail of each Stage-0 gate
      - ladder-location table with one row per historical oracle

  falsification_conditions:
    - >-
      The F_p^* instantiation certifies hardness. The model is refuted outright;
      the record is superseded, not amended.
    - >-
      The model blocks MOV or Smart. Same disposition.
    - >-
      An observation collision is found: two oracles with identical
      (d, t, variant) and different true simulability, with no declared
      separating condition. The conjecture as stated is refuted.
    - >-
      Measured T(p) does not track p^{1/t} across the declared prime ladder.
      The threshold mechanism is wrong; the ladder may survive as a taxonomy but
      the theorem does not.
    - >-
      A degree-polylog(p) oracle is exhibited that is provably not simulable
      with poly overhead. THE CONJECTURE IS REFUTED AND THIS IS THE BEST
      OUTCOME IN THE RECORD: such an oracle is a new non-generic handle on the
      ECDLP below the Semaev degree, and it becomes the successor proposal.

  confounders:
    - >-
      Curve-model dependence. Degrees change under a change of coordinates
      (Weierstrass, Edwards, Montgomery, Kummer line), so a threshold measured
      in one model does not transfer. Every reported d must name its model, and
      the cross-model variation must be measured, not assumed small.
    - >-
      Arity smuggling. An oracle of low degree and high arity can be as powerful
      as one of high degree and low arity; the theorem is stated for constant t
      and any implementation that lets t grow with p is testing a different
      claim.
    - >-
      Simulator quality. A weak simulator produces a low threshold that reflects
      the implementation, not the model. Two independent implementations on a
      frozen seed are required before any threshold is reported, exactly because
      the alternative is measuring the programmer.

  interpretation_limits:
    - >-
      A simulation theorem below T(p) transports the generic lower bound below
      T(p) and NOWHERE ELSE. It is not an ECDLP hardness result and must never
      be summarised as one.
    - >-
      Locating Semaev at d = 2^{m-2} does not make index calculus infeasible; it
      states where on the axis it sits. The cost question stays with
      KN-OPEN-001 and the ICEX/DREG lanes.
    - >-
      Toy-scale threshold measurements bound the instrument, not cryptographic
      parameters. No statement about a 256-bit curve may be derived from them.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a degree-d, arity-t polynomial system f over F_p defining a variety
        V, the number of F_p-points of V behaves like that of a uniformly random
        variety of the same degree and dimension, so that
        #V(F_p) = d^{t-1} p^{dim V} (1 + O(d^c p^{-1/2})).
      rigorous_support: >-
        The rigorous side is the Lang-Weil estimate for absolutely irreducible
        varieties together with the Bezout bound d^t on the total degree; the
        heuristic side is that the queried systems behave like uniformly random
        systems of their degree, which is the classical random-variety model.
        Both are quoted as standard; neither was re-read in this session.
      validation_plan: >-
        Sample degree-d systems of arity t over toy primes, count points
        exactly by exhaustive enumeration (feasible for p <= 2^13, t <= 3),
        and compare the empirical distribution of #V(F_p) against the Lang-Weil
        prediction by exact multiset comparison. Tail check: the largest
        observed deviation against the predicted O(d^c p^{-1/2}) envelope.
        Toy scale only and labelled so; the crypto-scale behaviour of H1 is NOT
        validated by this and no claim is made that it is.
    - id: H2
      statement: >-
        A generic-group simulator that answers an AOM_d query by committing a
        fresh formal logarithm fails with probability at most #V(F_p) / N per
        query, independently across queries up to the union bound.
      rigorous_support: >-
        The single-query bound is the standard Schwartz-Zippel-style argument
        used in the generic group model; the independence across queries is the
        assumption, and it is exactly the step where generic-model proofs
        usually need care.
      validation_plan: >-
        Instrument the implemented simulator to record actual failures per
        query, and compare the empirical failure rate against the union bound
        across a sweep in d at fixed p. A measured rate materially ABOVE the
        bound refutes H2 and halts the line; a rate far below it means the bound
        is loose and the threshold estimate is conservative, which must be
        reported rather than quietly improved.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS CLAIMED FOR ANY ATTACK. The model's own output is a
      threshold T(p) ~ p^{1/t}, which is a property of the MODEL, not an attack
      cost. If the refutation branch fires and a non-simulable low-degree oracle
      is found, THAT object would carry an exponent claim, and it would need its
      own record with its own heuristics and cost table.
    memory_exponent: >-
      Simulator memory is O(queries); at toy scale, megabytes. Not a
      cost-relevant quantity for this proposal.
    best_known: >-
      For prime-field ECDLP the standing baseline is Pollard rho at
      p^{1/2} with O(1) memory (KN-TECH-001, KN-TECH-006) and the generic lower
      bound of KN-TECH-005. This proposal does not move either.
    hidden_overhead: >-
      The threshold p^{1/t} hides the arity t entirely, and t is exactly the
      knob an adversary would turn. This is disclosed as the model's principal
      weakness, not buried: a statement that holds only for constant t is
      substantially weaker than it reads.
    tradeoff_note: >-
      Not applicable to the model. If the refutation branch fires, the resulting
      object must be costed against the van Oorschot-Wiener tradeoff surface and
      KN-TECH-035 full-cost accounting before any comparison to rho.

  dominated_by: >-
    As an ATTACK: dominated by every row of the prime-field frontier this
    program records -- rho at p^{1/2} with O(1) memory (KN-TECH-001,
    KN-TECH-006), BSGS at p^{1/2} time and memory (KN-TECH-031), the
    preprocessing frontier, and every index-calculus variant in the ICEX lane --
    because the proposal mounts no attack. Checked across time, memory and
    data/query axes; nothing here improves any of the three.
    As a CLOSURE INSTRUMENT: the incumbent is the per-oracle simulability
    verdict (KN-FIND-002, KN-FIND-b7e091, IDEA-20260726-004). This proposal
    dominates that incumbent on coverage (one statement over a parameterised
    family versus one verdict per oracle) and is dominated by it on
    verifiedness (those verdicts exist; this theorem does not).
  sota_delta: >-
    Zero speedup. Coverage delta: replaces >= 5 recorded single-oracle verdicts
    with 1 conjecture over an integer axis, and assigns a numeric coordinate
    (d = 2^{m-2}, t = m) to the index-calculus lane that no record currently
    assigns. Predicted threshold exponent 1/t, testable to +/- 0.1 across a
    prime ladder spanning a factor 16. Stated numerically because "unifies the
    closures" is not a value.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.30 that Conjecture AOM survives Stage 0's three gates in the form stated
    (the F_p^* control is the most likely killer, and it is deliberately first
    and free). 0.65 that the ladder survives as a TAXONOMY even if the theorem
    does not, which alone discharges part of KN-OPEN-019. 0.05 that the
    refutation branch fires with an explicit low-degree non-simulable oracle --
    low, but it is the branch with by far the highest value, and the design puts
    it in reach at zero marginal cost.

