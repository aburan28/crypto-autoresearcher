    - metric: "eps_max for an unequal-fibre branching partition, measured on the LARGEST fibre"
      direction: higher
      minimum_effect: "FORCED >= 1/(M sqrt(2b)) with M = n/n_max, unchanged from the equal-fibre case. Any weakening would mean (C3) is wrong."
    - metric: "level-1 candidate count for a t-fold cover at fixed (M, b)"
