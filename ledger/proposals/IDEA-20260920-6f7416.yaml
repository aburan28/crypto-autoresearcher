  assumptions:
    - "A1. n is prime and G = <P>. Primality enters only through the absence of subgroups of G; the subgroups of G^m are used explicitly in the lossy-projection test."
    - "A2. Cost model M1 is imported unchanged and is stated for EQUAL fibres; (C3) closes the bound side of the unequal case and explicitly leaves the cost side as an obligation."
    - "A3. The auxiliary group A in (C2) is finite abelian. A non-abelian or non-group auxiliary register is outside the lemma and is named as an open sub-case, not silently included."
    - "A4. The tuple branching is with respect to COMPONENTWISE addition, which is what a merge performs. A rule branching under a different tuple operation (for instance one that permutes coordinates) is outside the lemma."
    - "A5. Off-limits components used: F1 inside M1 only; F7 as the branch-table charge only. No factor base, so KN-OPEN-020 is not engaged."

  proof_search_map:
    bottleneck: >-
      The step whose removal changes the theorem is the identification, in
      (C1), of a character of G^m with a DL character of a single DERIVED point
      sum_k [xi_k] R_k. Without it the tuple lemma yields a bias along an
      abstract character of G^m and the coordinate upper bound (A2) -- which is
      stated for functions of ONE point's coordinates -- cannot be applied, and
      the tuple escape stays open. The identification is exact, one line, and
      uses only bilinearity of the discrete logarithm.
    baseline_embedding:
      parameter_slice: >-
        SLICE 1, m = 1. (C1) must reduce EXACTLY to IDEA-20260920-b6ad24 (A1),
        with the derived point being R_1 itself and xi the single frequency. A
        derivation that does not degenerate cleanly at m = 1 has mis-stated the
        character identification.
        SLICE 2, r = 0 in (C2). The auxiliary group is trivial, psi is trivial,
        the dichotomy's second branch is empty, and (C2) reduces to (A1). A
        derivation whose dichotomy still has two live branches at r = 0 is
        wrong.
        SLICE 3, the coordinate projection (R_1, R_2) -> R_1 on G^2. Here
        b = 1, M = n, the fibres are cosets of {0} x G, the heavy character is
        (xi_1, 0) with xi_1 != 0, and the derived point is [xi_1] R_1. The
        conclusion must be that the object carries FULL information about R_1
        and none about R_2 -- an exact, lossy, useless object -- reproducing
        IDEA-20260902-63dbc0's "translations alone admit only shorter tuples".
      reproduction_check: >-
        SYMBOLIC, exact, with the group named on every line. (i) m = 1
        degeneration to (A1), checked by substitution. (ii) On H = Z/n x Z/n
        with sigma((u, v)) = floor(M(u+v)/n) (the diagonal interval key): b = 2
        EXACTLY when M divides n and at most 3 otherwise, computed on integer
        representatives in [0, n) of the SUM u+v, and the heavy character is
        (1, 1), so the derived point is R_1 + R_2 and the object is a
        single-point object in disguise -- the forced value that shows (C1)'s
        identification is not vacuous. (iii) On H = Z/n x Z/2^r with
        sigma((u, s)) = s (the pure auxiliary key): b = 1 EXACTLY, M = 2^r, the
        heavy character is (0, psi) with psi nontrivial on Z/2^r, xi = 0, and
        the dichotomy's SECOND branch fires -- the forced value that shows the
        dichotomy is not one-sided. (iv) Z/(a*a') x Z/(a*a') with sigma =
        reduction of the first coordinate mod a: b = 1 EXACTLY, and the chain
        must go silent at the coordinate bound because the group is not a
        prime-order curve subgroup.
    observation_collision:
      observable: "The heavy character (xi_1, ..., xi_m) in (Z/n)^m \\ {0} of a tuple fibre indicator, together with (M, b)."
      distinct_preimage_search: >-
        THE COLLISION IS REAL AND IS THE POINT OF (C1). Two genuinely different
        tuple objects -- sigma((u,v)) = floor(M(u+v)/n) and the single-point
        object sigma'(w) = floor(Mw/n) pulled back along (u,v) -> u+v -- have
        the SAME (M, b) and the SAME heavy character (1,1) up to the pullback,
        because they ARE the same object. That is the intended collision: the
        observable collapses the tuple family onto the single-point family, and
        the record's claim is exactly that this collapse is forced. A collision
        that would be a FALSIFIER, and must be hunted: two tuple partitions
        with the same (M, b) and the same heavy character, one of which admits
        an O(1)-computable branch rule and one of which does not. The heavy
        character does not see indexability, so it cannot certify the cost
        model; that separation is charged to H2 of IDEA-20260920-b6ad24.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the tuple state from E^m to the single derived point
          sum_k [xi_k] R_k in G, using bilinearity of log_P. ENCODING exact;
          COMPLETENESS every tuple branching object yields such a point once
          xi is known; SOUNDNESS the converse fails (a single-point object does
          not determine a tuple object) and is unused; TRANSFER: the attacker
          can FORM the derived point with m scalar multiplications and m-1
          additions, so the reduction is constructive on the algorithm side
          even though log_P is not; COST LOSS O(m log n) group operations per
          tuple, which is n^{o(1)} for m = O(1) and is charged.
        predicted_gain: >-
          Closes the pair-and-tuple escape by reducing it to the already-bounded
          single-point case, rather than requiring a new bound; and does so
          without contradicting IDEA-20260902-63dbc0, which handles the exact
          objects the same reduction sends to shorter tuples.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (M, b) fixed and vary the forgotten structure:
          the diagonal interval key on Z/n x Z/n versus the pure auxiliary key
          on Z/n x Z/2^r. The distinguishing intrinsic invariant is whether the
          heavy character's G-component xi is zero.
        predicted_gain: "Makes the (C2) dichotomy an observable test rather than a case distinction, and supplies its two forced fixtures."
      - transform: stronger_invariant
        proposed_object: >-
          Retain, per fibre, the heavy character AS A VECTOR in (Z/n)^m rather
          than as the scalar eps. The vector is what survives the reduction to
          a derived point; eps alone cannot name the point.
        predicted_gain: "The reduction of (C1) is not expressible without the vector, so this is the minimum state the argument requires."
    quantifier_order: >-
      (C1): FOR ALL prime n, FOR ALL m >= 1, FOR ALL equal-fibre partitions
      sigma of G^m into M fibres with one-step additive branching b <= M/2
      under componentwise addition, FOR ALL fibres i: THERE EXISTS a nonzero
      vector xi in (Z/n)^m with |sigmahat_i(xi)| >= |A|/sqrt(2b), and the
      function T -> 1_{A_i} evaluated along the derived point is a function of
      ONE group element. The witness xi may depend on n, sigma, b and i; it may
      NOT depend on the tuple being evaluated -- a rule whose xi varies per
      tuple is not a partition of the stated shape and is outside the
      quantifier. That is the escape the order exposes and it is named.
      (C2): ... THERE EXISTS a character (xi, psi) of G x A heavy for A_i, AND
      EXACTLY ONE OF xi != 0, xi = 0 holds. The dichotomy is on the WITNESS,
      not on the object, so an object may realise both branches at different
      fibres; the claim is then that the fibres with xi = 0 contribute no
      concentration on G, and that is the strictness obligation.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "branching objects on m-tuples and on state-carrying registers
        are subject to the same spectral lower bound as single-point branching
        objects, hence to the same coordinate upper bound and the same floor;
        unequal fibres and t-fold covers do not weaken the bound and raise the
        charge". IT CANNOT CERTIFY: that no tuple object exists; anything about
        non-abelian auxiliary registers; anything about rules branching under
        tuple operations other than componentwise addition; anything about
        objects whose witness xi depends on the tuple; or any exponent beyond
        what IDEA-20260920-b6ad24's floor already gives.
      nearby_object_control: >-
        The coordinate projection (R_1, R_2) -> R_1 on G^2, where the desired
        conclusion (that tuples buy nothing) HOLDS but for a trivial reason --
        the object is exact and useless. And Z/(a*a') x Z/(a*a') with reduction
        mod a in the first coordinate, where the conclusion FAILS because the
        coordinate bound does not apply off prime order. A method that cannot
        distinguish these two has not identified what is load-bearing.
    proof_obligations:
      - claim: "Lemma (A1) uses only the sumset bound, Cauchy-Schwarz and Parseval, hence holds in every finite abelian group"
        responsibility: correctness
      - claim: "a character of G^m evaluated on a tuple equals a DL character of sum_k [xi_k] R_k"
        responsibility: correctness
      - claim: "the attacker can form sum_k [xi_k] R_k in O(m log n) group operations once xi is known"
        responsibility: interface
      - claim: "m = 1 and r = 0 degenerate exactly to IDEA-20260920-b6ad24 (A1)"
        responsibility: baseline
      - claim: "in the xi = 0 branch of (C2), the emitted pair-sums are not concentrated on a fibre of G and M1's success condition fails"
        responsibility: strictness
      - claim: "(C3) the largest fibre has doubling at most b, so the bound survives unequal fibres"
        responsibility: size
      - claim: "(C3) cost side: M1 restated for unequal fibres, or explicitly left open"
        responsibility: scope
      - claim: "(C4) a t-fold cover multiplies insertion by t and candidates by t^2 while weakening no inequality"
        responsibility: runtime
      - claim: "the subgroups of G^m for prime n are exactly the F_n-subspaces, so an EXACT tuple object is a linear form"
        responsibility: correctness
    not_applicable_reason: null

  predictions:
    - metric: "the heavy character of a fibre indicator of an m-tuple branching partition of G^m"
      direction: different
      minimum_effect: >-
        FORCED NONZERO as a vector in (Z/n)^m whenever b <= M/2, with
