  heuristic_assumptions:
    - id: H1
      statement: >-
        CONCENTRATION REQUIRES GROUP BIAS. If every fibre indicator of a
        partition of G x A has heavy characters only with trivial G-component,
        then the level-1 emitted pair-sums have collision probability on G
        equal to (1 + o(1))/n, i.e. the Renyi-2 support exponent s of
        IDEA-20260829-3f0f4b is 1 - o(1) and M1's success condition fails.
      rigorous_support: >-
        The exact half is the energy identity of IDEA-20260901-d77aa8 (E1)-(E2)
        specialised to G: the collision probability of the emitted sums equals
        1/n plus a Parseval term built from the fibre transforms along
        NONTRIVIAL characters of G, so if all such coefficients are at the
        random level the collision probability is (1 + o(1))/n. What is
        heuristic is the passage from "no HEAVY character has nonzero
        G-component" to "all nontrivial-G coefficients are at the random
        level": the mass could sit just below the heaviness threshold, spread
        over many frequencies. The classical statement this imitates is the
        standard flat-spectrum-implies-uniform-convolution lemma.
      validation_plan: >-
        SYMBOLIC, zero compute. Write the Parseval term for a partition of
        G x A with all heavy G-components zero, bound it by
        threshold^2 * (number of frequencies) via Parseval, and determine
        whether that is o(1) relative to 1/n at the threshold 1/(4 sqrt b).
        COMPARISON: the pure auxiliary key (forced s = 1 exactly, the
        emitted sums being uniform on G) and the diagonal interval key (forced
        s = 2/3, the emitted sums being confined to an interval of the log).
        TAIL CHECK: the worst case where the spectrum is spread just below
        threshold over the maximum number of frequencies Parseval allows.
        TRANSFER ASSUMPTION: none; this is a per-partition symbolic bound.
        A MEASUREMENT ROUTE (exact FFT at 24 to 34 bits, per d77aa8 Stage 4)
        EXISTS AND WOULD REQUIRE A SCOPE EXTENSION; it is not proposed.
    - id: H2
      statement: >-
        TUPLE INDEXABILITY IS NOT EASIER. For an m-tuple branching partition,
        the branch index set is computable in O(1) from the source fibre
        indices no more often than in the single-point case; there is no tuple
        construction whose branch rule is closed-form while its single-point
        image's is not.
      rigorous_support: >-
        NONE SUPPLIED, and it is stated as an assumption rather than as
        support. The counting half of IDEA-20260920-b6ad24's H2 --
        min over t of #{(i,j) : t in B(i,j)} <= bM -- is group-agnostic and
        does transfer verbatim, so the CHARGE model transfers; what does not
        transfer for free is the existence of a closed-form rule. The classical
        analogue is that a linear form's low-bits rule is as cheap as a single
        variable's, which is evidence for the assumption and not a proof.
      validation_plan: >-
        SYMBOLIC, zero compute. For the diagonal interval key on Z/n x Z/n,
        write the branch rule explicitly and confirm it is O(1) (it is:
        floor(M(u+v)/n) branches over two values exactly as the single-variable
        interval key does). Then attempt to construct a tuple key with a
        closed-form rule whose derived single-point key has none; SUCCESS IS
        THE VALUABLE NEGATIVE OUTCOME and refutes H2, reopening tuples on the
        cost side even though (C1) closes them on the bound side. TRANSFER
        ASSUMPTION: a small construction refutes but never confirms.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND NO NEW EXPONENT IS PRODUCED. The record
      TRANSFERS IDEA-20260920-b6ad24's floor T >= n^{(4-2 lambda)/11} from
      single-point branching objects to (i) m-tuple branching objects for
      m = O(1), (ii) branching objects carrying finite abelian auxiliary state,
      in the xi != 0 branch, (iii) unequal-fibre partitions on the bound side,
      and (iv) t-fold covers, which additionally pay t on insertion and t^2 on
      candidates. Before this record those four classes had NO floor at all;
      IDEA-20260920-a5757d listed them as forward guidance.
    memory_exponent: >-
      Unchanged from IDEA-20260920-b6ad24: memory equals time under M1, so the
      transferred floor point is (T, S) = (n^{4/11}, n^{4/11}) with P = 0.
      The tuple representation additionally costs m log n bits of state per
      tracked object, which is n^{o(1)} for m = O(1) and is disclosed rather
      than absorbed.
    best_known: >-
      Pollard rho 0.886 sqrt(n) time, O(1) memory; BSGS (n^{1/2}, n^{1/2}); van
      Oorschot-Wiener total work n^{1/2}; automorphism-discounted rho
      sqrt(n/|Aut|); Shoup's generic Omega(sqrt n). As a STATIC result the
      incumbent on tuples is IDEA-20260902-63dbc0 (exact objects only) and on
      escapes generally IDEA-20260920-a5757d's forward-guidance list.
    hidden_overhead: >-
      Four disclosures. (i) Everything is conditional on IDEA-20260920-b6ad24's
      H1, the unextracted mixed character-sum bound; without it no floor exists
      to transfer. (ii) The (C2) dichotomy's second branch carries an unproved
      strictness obligation (H1 of this record), so the auxiliary-state escape
      is reduced, not closed. (iii) The tuple reduction costs O(m log n) group
      operations per object and is n^{o(1)} only for bounded m. (iv) (C3)
      closes the unequal-fibre case on the BOUND side only; M1's cost side for
      unequal fibres is not restated and is an open obligation.
    tradeoff_note: >-
      Not applicable to an attack. Pareto content: none of (C1)-(C4) creates a
      new time-memory point; (C4) strictly worsens the charge of the cover
      variant, which is the only quantitative movement and it is in the
      unfavourable direction for the attacker.

