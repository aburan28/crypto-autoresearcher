      minimum_effect: "FORCED EXACTLY 2 when M divides n and at most 3 otherwise, computed on integer representatives in [0, n) of the SUM u+v; heavy character FORCED (1, 1)."
    - metric: "the G-component xi of the heavy character for the pure auxiliary key sigma((u,s)) = s on Z/n x Z/2^r"
      direction: different
      minimum_effect: "FORCED EXACTLY 0, with b EXACTLY 1 and M EXACTLY 2^r. This is the fixture that makes the (C2) dichotomy two-sided; if no partition realises xi = 0 the dichotomy is vacuous and (C2) is not a contribution."
    - metric: "level-1 concentration achieved by a partition whose heavy characters all have xi = 0"
