      minimum_effect: "FORCED to multiply by exactly t^2 relative to the partition case, with insertion multiplying by t. Strictly worse; a derivation showing a t-fold cover is cheaper refutes (C4)."

  minimal_test:
    design: >-
      PAPER-LEVEL DISCRIMINATOR, ZERO COMPUTE, INSIDE THE RQ CLAIM BOUNDARY.
      STEP 1. Restate Lemma (A1) with H an arbitrary finite abelian group and
      verify, line by line, that no step uses cyclicity, primality, or the
      curve. This is a five-minute audit and it is the load-bearing claim of
      the record; if any step uses the structure of Z/n, (C1)-(C4) all fall.
      STEP 2. Write the character identification of (C1) and check it by
      substitution at m = 1 and on the diagonal interval fixture.
      STEP 3. Evaluate the four fixtures of reproduction_check exactly, by
      hand, with the group and character codomain named on each line.
      STEP 4. Attack the strictness obligation of (C2) directly: write the
      emitted-sum distribution of a partition whose heavy characters all have
      xi = 0, and derive its collision probability on G. Either it is 1/n up to
      o(1) -- in which case M1 fails and the dichotomy closes -- or it is not,
      in which case (C2)'s second branch is OPEN and the record must say so and
      reduce its claim to (C1), (C3), (C4). THIS STEP IS THE ONE THAT CAN
      RETURN A NEGATIVE AND IT IS THE REASON THE RECORD IS TESTABLE.
      STEP 5. Write the (C4) charge explicitly, in M1's own units.
      STEP 6 (archive check, zero compute). Record the exact sentence of
      IDEA-20260920-a5757d naming the four escapes, and the exact sentence of
      IDEA-20260902-63dbc0's claim header bounding its own scope to EXACT
      objects. Read 63dbc0 IN FULL before committing this record's (C1)
      relationship clause -- this session read only its header and that is a
      disclosed gap. No status change to either is proposed.
      REQUIRING A SCOPE EXTENSION AND NOT PROPOSED HERE: any FFT over (Z/n)^m.
    controls:
      - "DEGENERATION CONTROLS, answer known free: m = 1 and r = 0 must return IDEA-20260920-b6ad24 (A1) exactly. Failure voids the record."
      - "EXACT-OBJECT CONTROL: the coordinate projection (R_1,R_2) -> R_1 on G^2, forced b = 1 and heavy character (xi_1, 0); the conclusion must be 'shorter tuple, no concentration on G', matching IDEA-20260902-63dbc0."
      - "DIAGONAL POSITIVE CONTROL: sigma((u,v)) = floor(M(u+v)/n), forced b = 2 (M | n) and heavy character (1,1); the reduction must return the single derived point R_1 + R_2."
      - "AUXILIARY NULL: sigma((u,s)) = s, forced xi = 0, b = 1; the second branch of the dichotomy must fire and M1 must fail."
