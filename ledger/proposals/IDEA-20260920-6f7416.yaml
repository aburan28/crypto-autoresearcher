  title: >-
    THE BRANCHING LEMMA IS GROUP-AGNOSTIC, SO THREE OF IDEA-20260920-a5757d's
    FOUR NAMED ESCAPES CLOSE AT ONCE. Applying it on H = G^m closes
    pair-and-tuple-defined propagation (the escape IDEA-20260902-63dbc0 left
    open, having closed only the EXACT objects on tuples); on H = G x A it
    forces a DICHOTOMY -- either the heavy character is nontrivial on the G
    factor, in which case auxiliary state bought nothing and the coordinate
    bound applies unchanged, or it is trivial on G, in which case the fibre
    system is a function of the auxiliary coordinate alone and M1's level-1
    concentration is not achieved; and unequal fibres and t-fold covers lose
    strictly. What survives is exactly ONE class, named
  class: mechanism

  claim: >-
    REPRESENTATION CLASS AND ATTACK STAGE: R3 of RQ-ECDLP-623a32 (the m-tuple
    state (R_1, ..., R_m) as a point of E^m, a non-function representation of
    the single-point state), instantiated coordinatewise through R1. The attack
    stage is COLLISION STRUCTURE.

    (C0) THE LEMMA IS ABOUT AN ARBITRARY FINITE ABELIAN GROUP. Lemma (A1) of
    IDEA-20260920-b6ad24 -- one-step additive branching b implies every fibre has
    max over nontrivial characters of |Ahat(xi)| >= |A|/sqrt(2b) for b <= M/2 --
    uses only the sumset bound, Cauchy-Schwarz and the fourth-moment Parseval
    identity. None of those knows what group it is in. THIS OBSERVATION IS THE
    WHOLE RECORD, and the three consequences below are what it buys.

    (C1) TUPLES AND PAIR-DEFINED PROPAGATION. IDEA-20260920-a5757d's
    interpretation_limits name as open "propagation rules defined on pairs
    rather than on single elements". Such a rule is a projection sigma of
    H = G^m (m = 2 for pairs) with one-step additive branching under
    componentwise addition, which is exactly the operation a merge performs on
    the tracked pair. (C0) applies verbatim: some character of G^m, i.e. some
    nonzero vector (xi_1, ..., xi_m) in (Z/n)^m, satisfies
    |sigmahat_i(xi)| >= |A|/sqrt(2b). Evaluating that character on the tuple
    means evaluating e_n( sum_k xi_k log_P R_k ) = e_n( log_P ( sum_k [xi_k]
    R_k ) ), i.e. a DL character of the SINGLE point sum_k [xi_k] R_k, which
    the attacker can form explicitly once xi is known. Hence the m-tuple
    branching object is a single-point branching object on a derived point, the
    coordinate upper bound of IDEA-20260920-b6ad24 (A2) applies to it unchanged,
    and the floor of (A3) applies with M and b read off the tuple partition.
    RELATIONSHIP TO IDEA-20260902-63dbc0: that record closes the EXACT lossy
    objects on tuples (diagonal Gamma-quotients and the projective class, via
    2-transitivity of AGL_m(F_n)). It says nothing about BRANCHING objects on
    tuples, which is precisely the cell this closes. The two are complementary
    and neither subsumes the other.

    (C2) AUXILIARY STATE, AND THE DICHOTOMY. A branching object carrying r bits
    of auxiliary state is a projection of H = G x A for a finite abelian
    auxiliary group A of order at most 2^r, with branching under the product
    operation. (C0) gives a heavy character (xi, psi) of G x A. EITHER
    xi != 0 -- and then, writing the fibre indicator's restriction to each
    fixed auxiliary value s as A_i^{(s)}, the heavy character has a nonzero
    component on the G factor, the coordinate bound (A2) applies to the
    G-marginal, and the auxiliary state has bought nothing on the axis that
    matters -- OR xi = 0, and the entire heavy structure lives in the auxiliary
    coordinate. In the second case the fibre system is, to the accuracy of the
    energy bound, a function of the auxiliary state alone; the pair-sums it
    emits are then NOT concentrated on a fibre of G, so M1's success condition
    (l^2/M)^2 >= n/M is not met and the route is not sub-rho for a reason that
    has nothing to do with coordinates. THE DICHOTOMY IS THE CONTRIBUTION: the
    escape cannot have it both ways, and the quantitative version of the second
    branch is the record's single proof obligation marked `strictness`.

    (C3) UNEQUAL FIBRES. If fibre sizes are n_1, ..., n_M with n_max the
    largest, branching b gives |A_i + A_i| <= b * n_max for every i, so the
    LARGEST fibre has doubling at most b and
    eps_max >= n_max/(n sqrt(2b)) >= 1/(M sqrt(2b)), since n_max >= n/M. The
    bound of (A1) therefore survives unequal fibres VERBATIM, and the escape
    IDEA-20260920-a5757d lists as "unequal fibres" is closed on the bound side.
    (It remains open on the COST side, because M1 is stated for equal fibres,
    and that is stated as an obligation rather than glossed.)

    (C4) NON-PARTITIONS AND t-FOLD COVERS. If sigma is multivalued with each
    element in exactly t fibres, the same sumset bound holds with n_max in
    place of n/M, so (A1) survives with M replaced by n/n_max; meanwhile
    insertion cost multiplies by t and the level-1 candidate count multiplies
    by t^2. The escape strictly LOSES: it weakens no inequality and raises the
    charge. This is the obvious first evasion (IDEA-20260829-390ccc's
    confounder list names it) and it is closed by arithmetic, not by taste.

    (C5) WHAT SURVIVES, STATED AS A CLASS AND NOT AS A RESIDUE. After (C1)-(C4)
    and IDEA-20260920-b6ad24, the branching family's only surviving escape is a
    coordinate condition whose F_p ADDITIVE spectral norm n^lambda satisfies
    lambda >= 1/6 while its per-evaluation cost stays n^{o(1)} -- the
    decoupling of spectral norm from evaluation cost. That is
    IDEA-20260920-dd041a, and it is the forward guidance this record hands on.
    NOT CLAIMED: that no such condition exists.

  mechanism: >-
    OBJECT FRAME. REPRESENTATION: R3 of RQ-ECDLP-623a32 -- the tracked state is
    an m-TUPLE of points, an element of E^m, which is a non-function
    representation of the single-point state and is NOT a Kummer line and NOT a
    degree-d function on E, so the model-lever-1 closure is untouched. For (C2)
    the representation is R3 extended by an auxiliary register: the state is a
    point together with r bits that are not a function of the point.
    OPERATION SET SIGMA: COMPONENTWISE addition on G^m (equivalently: the
    simultaneous translation action of G^m on itself), together with the
    product operation on G x A in (C2). This is the operation a merge actually
    performs on a tracked tuple, and it is NOT the single-point full
    translation action -- but it CONTAINS the diagonal translation action, so
    per the constraint block the candidate is declared a BRANCHING OBJECT.
    TRICHOTOMY (IDEA-20260806-c5d183): CLASS II, BRANCHING, for every one of
    (C1)-(C4). Reason: the propagation rule is set-valued of size b > 1 in each
    case. The b = 1 sub-cell on G^m is NOT empty for m >= 2 -- the coordinate
    projections (R_1, ..., R_m) -> R_1 are exact and lossy -- but those are
    precisely the "shorter tuples" IDEA-20260902-63dbc0 already classifies, and
    they carry no partial-match structure because their fibres are cosets of
    G^{m-1}, which supplies no concentration on G. That is stated so the
    trichotomy placement is not read as a contradiction of 63dbc0.
    LOSSY-PROJECTION TEST AGAINST THE NAMED SIGMA. DISCARDED, in (C1):
    m*log(n) - log(M) bits, everything about the tuple except its fibre.
    COMPATIBLE WITH SIGMA: componentwise addition makes the fibre system's
    sumsets meet at most b fibres, which is the stated branching bound -- the
    only form of compatibility available, since a block system of the
    componentwise translation action of G^m would be a subgroup of G^m of index
    M, and the subgroups of G^m for prime n are exactly the F_n-subspaces, of
    index a power of n, hence index M forces M = n^k and the corresponding
    projection is a LINEAR form -- which is (C1)'s conclusion arrived at from
    the exact side and is why the branching side must be handled separately.
    LOSSY IN THE REPRESENTATION ACTUALLY USED: yes -- the tuple's coordinates
    are not recoverable from the fibre index once M < n^m.
    PRICED OPEN NUMBER: the (L, b) meter of IDEA-20260802-002 evaluated on
    G^m -- L = log_2(n^m/M) bits discarded and b the tuple branching -- with
    the record's content being that the SAME inequality binds them as on G, so
    moving to tuples buys no slack in (L, b).
    OFF-LIMITS COMPONENTS USED, NAMED: F1 only inside the imported cost model
    M1. F7 only as the charge on a non-O(1) branch rule. No factor base.

