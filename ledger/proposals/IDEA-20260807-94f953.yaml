idea:
  id: IDEA-20260807-94f953
  question_id: RQ-JINV-8fc13a
  added: '2026-08-07'
  title: >-
    At small |D_0| the isogeny crater has exactly h(D_0) vertices, so for the
    nine class-number-one discriminants it is a SINGLE curve whose address is
    free - which simultaneously abolishes the hard half of the T5 reachability
    gate and empties the space it was meant to search; the surviving research
    object is not the crater but the DESCENDING direction, where a j=0 curve sits
    at the surface with about p^{1/2} isogenous curves below it and the cheaply
    reachable subfamily is exactly the smooth part of the conductor f, governed
    by a named Dickman-de Bruijn heuristic
  class: mechanism

  claim: >-
    (A) THE CARDINALITY FACT, AND THE DICHOTOMY IT FORCES. For an ordinary
    isogeny class over F_p with fundamental discriminant D_0, the set of curves
    whose endomorphism ring is the MAXIMAL order O_K - the crater, i.e. the
    surface of every ell-volcano - is a principal homogeneous space under
    Cl(O_K), hence has exactly h(D_0) elements up to F_p-isomorphism. Therefore:
      h(D_0) = 1  ==>  the crater is a SINGLE curve.
      D_0 = -3    ==>  that curve is j = 0. D_0 = -4 ==> it is j = 1728.
    DECOMPOSITION.md's T5 states the campaign's central dichotomy: a random curve
    in the class is cheap to reach but a SPECIFIED one is the CSIDH vectorisation
    problem at about sqrt(h) ~ p^{1/4} classically. Both halves of that sentence
    are statements about h. At h = 1 the vectorisation problem is VACUOUS - there
    is one target and you are either on it or you are not, and the Hilbert class
    polynomial hands you its j-invariant for free. THE HARD HALF OF T5 DISAPPEARS
    EXACTLY WHEN THE SEARCH SPACE DOES. That is the named obstruction and it is
    a conservation law, not an accident: |crater| = h, and h measures both the
    freedom to optimise and the difficulty of exploiting it. You cannot buy one
    without the other, and this is why "find a better curve at the surface"
    cannot be a mechanism at small |D_0|.

    (B) WHAT THIS CLOSES, PRECISELY. Every L3 mechanism of the form "walk
    horizontally to a better curve in the class" is closed at small |D_0| by
    cardinality, with no experiment required: there is nowhere to walk. Combined
    with T4 - j = 0 requires D_0 = -3, and D_0 is an isogeny-class invariant, so
    no curve outside such a class can be walked into one - the horizontal
    direction contributes exactly nothing to this lane. This is a genuine closure
    at the docs/inventor-protocol.md section 4 standard: named obstruction
    (|crater| = h(D_0) = 1), argument (the Cl(O_K)-torsor structure), and forward
    guidance (below).

    (C) WHAT IT LEAVES OPEN, AND IT IS THE INTERESTING PART. The crater is one
    vertex but the CLASS is not. With D = t^2 - 4p = D_0 f^2, the total number of
    curves in the class is h(Z[pi]), which for h(D_0) = 1 is approximately
    f * product over ell | f of (1 - (D_0/ell)/ell), and
    f = sqrt((4p - t^2)/|D_0|) is of order p^{1/2}. SO A j=0 CURVE SITS AT THE
    TOP OF A STRUCTURE CONTAINING ABOUT p^{1/2} ISOGENOUS CURVES, EVERY ONE OF
    WHICH CARRIES THE SAME DISCRETE LOGARITHM k BY T1. The curve is not
    impoverished; it is maximally positioned. Descending is the direction with
    room in it.
    THE COST OF DESCENDING IS THE WHOLE QUESTION, AND IT IS ANSWERABLE. A
    descending ell-isogeny requires ell | f and costs Otilde(ell) by standard
    isogeny computation (or Otilde(ell^2) if the modular polynomial is built).
    So the CHEAPLY REACHABLE subfamily from j = 0 is generated by the SMALL prime
    factors of f: its size is the B-smooth part of f for a cost budget
    corresponding to B. That is a smoothness question about a specific integer,
    it has a classical governing distribution, and it is exactly the kind of
    quantity the target-result profile asks to be stated as a numbered heuristic
    with a validation route rather than assumed.

    (D) THE TWO OUTCOMES OF THE MEASURABLE PART, FIXED IN ADVANCE. The
    measurable part is: at toy scale, enumerate a whole isogeny class with
    D_0 = -3, locate the surface (j = 0), and evaluate every cost functional the
    campaign measures on every curve in the class, stratified by volcano level.
      O1 EVERY FUNCTIONAL IS CONSTANT ON THE CLASS. Then the descending
        direction is worthless too, L1's predicted invariance is confirmed on the
        one family where the surface is canonically identified, and L3's isogeny
        half is closed entirely. PREDICTED, per DECOMPOSITION.md section 5
        prediction 1 and 2.
      O2 SOME FUNCTIONAL VARIES WITH LEVEL. Then the campaign has a target and
        the question becomes precisely the smoothness question in (C): how much
        of the class is reachable within budget from the free surface address.
        This is the branch where heuristic H1 below becomes load-bearing, and it
        is the branch worth pre-registering the heuristic for.

    (E) WHAT IS CLAIMED BEYOND THE sqrt(|Aut|) CONSTANT: NOTHING TODAY. Under O1
    nothing is claimed at all. Under O2 the claim would be a constant-factor
    change in a cost functional plus a reachability cost, and it would have to be
    charged in full against rho before it meant anything. No exponent is claimed
    and the record does not license one.

  resource_label: >-
    R3 and R4 - End(E) as a ring (the order, the conductor, the class number)
    and the isogeny graph / class-group action on curves. Neither is a
    group-operation output.

  admissibility: admissible
  admissibility_argument: >-
    The resources are the endomorphism ring's ideal-class structure and the
    isogeny graph, both of which act on CURVES rather than on points of G
    (DECOMPOSITION.md section 2, R3 and R4). H-ENDO-001's scalar-action argument
    does not apply because nothing here applies an endomorphism to a point of G;
    the objects are the crater's cardinality and the conductor's factorisation.
    KN-FIND-b7e091's GGM closure does not apply because a generic group oracle
    returns no information about the isogeny class at all. Admissible.
    ONE HONEST QUALIFICATION: by T1 the transported instance has the SAME k, so
    the resource can only ever change the COST FUNCTIONAL, never the answer.
    That is why outcome O1 - constancy of every functional - would close the
    lane's isogeny half despite the resource being admissible. Admissibility
    buys the right to run the experiment, not a presumption that it will find
    anything.

  discriminated_from:
    - >-
      Lane L1 (RQ-ICINV-475b5e), the campaign's gating lane, which measures
      within-class variance of cost functionals on a general isogeny class. This
      proposal is the D_0 = -3 / D_0 = -4 SPECIALISATION, and the specialisation
      is not cosmetic: it is the only case in which the surface is a single
      canonically identified vertex, so "stratify by level" becomes "stratify by
      distance from j = 0", which is a well-defined integer rather than a
      relative label. If L1 runs first, this becomes its most informative
      stratum; if it does not, this can run alone.
    - >-
      Lane L2 (RQ-VOLC-f6253b), volcano level and endomorphism-ring depth. That
      lane asks whether depth changes anything on a general class. This proposal
      supplies the cardinality argument that makes the crater trivial at small h
      and shifts the question to the descending direction, plus the conductor
      smoothness heuristic that sets the descent budget. L2 does not contain
      either.
    - >-
      Lane L10 (RQ-CLGP-b99df5), class-group action and vectorisation. That lane
      seeks a reduction between vectorisation and ECDLP. This proposal makes the
      complementary observation that at h = 1 vectorisation is vacuous, which
      bounds what such a reduction could ever say about small-|D_0| curves.
    - >-
      IDEA-20260807-778375 (this batch), which asks what the CM ring makes
      computable while standing still. This one asks where you can move. Both use
      h(D_0) = 1; they use it for different things and neither implies the other.
    - >-
      KN-TECH-027 (CSIDH / class-group action), which records the vectorisation
      cost for SUPERSINGULAR curves over F_p oriented by an order. The
      cardinality argument here is the ordinary-curve analogue and the sqrt(h)
      cost figure is taken from that entry as the general shape rather than
      re-derived.

  object_first_candidate:
    tracked_object: >-
      THE VOLCANO LEVEL of a curve in a small-|D_0| isogeny class - i.e. the
      conductor of its endomorphism ring, equivalently its distance from the
      unique surface curve j = 0.
    lossiness: >-
      LOSSY: the level is a single integer (or a vector of ell-adic valuations)
      and it forgets the curve's j-invariant, its equation, its points, and
      everything about the discrete logarithm. Many curves share a level. It is
      genuinely a projection and not a relabelling.
    propagation: >-
      Deterministic under the operation this lane uses, which is taking an
      ell-isogeny: an ell-isogeny changes the ell-adic valuation of the conductor
      by exactly -1, 0 or +1 and leaves all other valuations fixed, and which of
      the three occurs is determined by the level and the direction. So the
      retained part propagates exactly, which is what makes volcano algorithms
      work at all. It does NOT propagate under isomorphism-invariant curve
      operations that are not isogenies, and it carries no information about
      points - which is precisely the H-ENDO-001 boundary this object stays on
      the right side of.
    survival_score: >-
      Survives the entire isogeny walk, at every degree, to arbitrary depth -
      one of the longest-surviving objects available in this campaign. Dies at
      the transition to points: no level statistic can depend on k, because the
      level is a property of the curve and k is a property of a point pair. That
      boundary is exactly the one lane L7 names as its obstruction and it applies
      here too.

  mechanism: >-
    STEP 1 (zero compute). Write out the cardinality argument in (A) and the
    conservation law it forces, and record the two corollaries: (i) at h = 1 the
    horizontal direction is empty, (ii) at h = 1 the surface address is free.
    Both are consequences of the Cl(O_K)-torsor structure and neither needs an
    experiment.

    STEP 2 (toy enumeration, moderate compute - THE MAIN EXPERIMENT). Choose toy
    primes p congruent to 1 mod 3 with 4p = t^2 + 3f^2 for a conductor f having
    at least two distinct small prime factors, so that the volcano has genuine
    depth in more than one direction. Enumerate the ENTIRE isogeny class: start
    at j = 0, walk all ell-isogenies for every ell | f, and label every curve
    with its full level vector (v_ell)_{ell | f}. Verify the class size against
    h(Z[pi]) computed independently from the order's class number. Verify T1
    directly: transport (P,Q) along each isogeny and check that k is unchanged by
    recomputing it - which also gives a certificate for every transport.

    STEP 3 (the functional sweep). On every curve in the class, at matched
    factor-base size and matched targets, measure: Groebner solving proxies from
    harness/semaev.py, relation yield, decomposition probability, rho step count
    and rho multiplication count. Stratify by level vector. Report within-class
    variance against between-class variance (different p, different t) and
    against the matched-null battery of IDEA-20260807-a3d644.

    STEP 4 (the level-zero question that only this family can ask). Because the
    surface is CANONICALLY j = 0, one specific comparison becomes available that
    no general isogeny class permits: is the surface curve distinguished from
    the rest of ITS OWN CLASS by any functional, beyond the automorphism effect?
    Run every functional on j = 0 with phi WITHHELD (the NULL-3 arm of
    IDEA-20260807-a3d644) against the depth-1 curves. Any surviving difference is
    a level effect and not an automorphism effect, and that separation is only
    possible here.

    STEP 5 (the conductor smoothness measurement, which is the crypto-scale
    half and needs no curve at all). For many primes p at crypto-relevant sizes
    admitting 4p = t^2 + 3f^2, compute f and measure the distribution of its
    largest prime factor and of its B-smooth part for a ladder of B. Compare
    against the Dickman-de Bruijn prediction (heuristic H1 below). THIS IS THE
    ONE PART OF THIS PROPOSAL THAT CAN BE RUN AT CRYPTOGRAPHIC PARAMETER SIZES,
    because it is integer arithmetic on f and needs no isogeny computation, and
    it is therefore the part that would carry any O2 finding beyond toy scale.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Run 2026-08-07 from the repository root.
      (1) grep -ril "crater\|volcano" knowledge/ -> 20+ files; read KN-TECH-024
          and KN-TECH-027 in full
      (2) read DECOMPOSITION.md T4, T5 and lanes L1, L2, L10 in full
      (3) grep -ril "hilbert class polynomial" ledger/ knowledge/ docs/ analysis/
      (4) grep -ril "class number\|class group" knowledge/
      (5) read ledger/questions/RQ-JINV-8fc13a.yaml
    results: >-
      Volcano and crater material in the corpus is concentrated on the
      supersingular / CSIDH side (KN-TECH-024, KN-TECH-027, KN-OPEN-013) rather
      than on ordinary prime-field classes. DECOMPOSITION.md states T5 in general
      terms - "reaching a SPECIFIED curve is the vectorization problem ...
      ~sqrt(h) ~ p^{1/4}" - and does NOT observe that at small |D_0| the same h
      that makes vectorisation hard is the h that makes the crater non-empty, so
      the two vanish together. NO RECORD IN THIS REPOSITORY STATES THE
      CARDINALITY DICHOTOMY OF CLAIM (A) OR THE CONDUCTOR-SMOOTHNESS BUDGET OF
      CLAIM (C).
    verdict: >-
      ADAPTATION. The Cl(O)-torsor structure of the crater (Deuring, Kohel,
      Fouquet-Morain) is standard and is not claimed as new; the conductor
      relation D = D_0 f^2 is definitional. What is new to this program is the
      composition: the conservation law |crater| = h tying T5's difficulty to
      T5's payoff, the redirection to the descending direction, and the
      pre-registered Dickman heuristic for the descent budget. No novelty is
      claimed against the external literature and a Stage-0 check for published
      work on descending-isogeny reachability from CM surface curves is part of
      the design.

  null_object_control: >-
    MANDATORY AND BLOCKING.
    N1 A LARGE-h CLASS AT MATCHED p. Enumerate a class with a generic D_0 (large
      h) at the same prime and run the identical functional sweep. This is the
      only comparison that separates "small |D_0|" from "we enumerated a class".
      If the within-class variance profile is the same in both, the small-|D_0|
      framing adds nothing and must be dropped.
    N2 RANDOM-RELABELLING NULL: permute the level labels among the curves of the
      class at random and rerun the stratified analysis. Any "level effect" that
      survives a random relabelling is an artifact of the analysis, not of the
      volcano. This is the sharpest control in the proposal because a stratified
      analysis over a small class is exactly where spurious structure appears.
    N3 THE PHI-WITHHELD SURFACE ARM (Step 4), which separates the level effect
      from the automorphism effect at j = 0.
    DECAY PARAMETER: the LEVEL ITSELF, and this is the canonical
    docs/inventor-protocol.md section 3 test for this lane. Any functional
    difference attributed to being at the surface must DECAY MONOTONICALLY with
    depth. A difference that is the same at depth 1, 2 and 3 is not a level
    effect - it is a difference between j = 0 and everything else, i.e. an
    automorphism or a coefficient artifact, and N3 will say which.
    SECOND DECAY PARAMETER: the class size. Any variance signal must shrink
    relative to the null as the class grows, because a larger class gives the
    null more room; a signal that does not is a small-sample artifact.

  assumptions:
    - >-
      Ordinary curves over F_p with p > 3; the class is the set of F_p-isogeny
      classes with a fixed trace t; End_{F_p}(E) is an order between Z[pi] and
      O_K with conductor dividing f, where t^2 - 4p = D_0 f^2.
    - >-
      The crater is a principal homogeneous space under Cl(O_K), so it has
      exactly h(D_0) elements. Standard (Deuring / Kohel / Fouquet-Morain);
      cited, not re-derived, and verified empirically at toy scale in Step 2 by
      counting the enumerated surface curves.
    - >-
      Twists are handled explicitly: the six sextic twists of a j = 0 curve have
      different traces and lie in DIFFERENT isogeny classes. "The class contains
      j = 0" means the specific twist whose trace matches, and the enumeration
      records which.
    - >-
      Descending ell-isogeny cost is taken as Otilde(ell) with the modular
      polynomial available, or Otilde(ell^2) to build it. Toy-scale ell are tiny;
      the crypto-scale statement in (C) uses the asymptotic form and marks it as
      an order-of-magnitude budget, not a measured cost.
    - >-
      Toy scale for Steps 2-4: p up to about 2^24 and class sizes small enough
      to enumerate exhaustively. Step 5 alone runs at crypto-relevant sizes and
      only on integers.

  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        Let p range over primes with 4p = t^2 + 3f^2 for some integers t, f
        (equivalently, over primes admitting an ordinary j = 0 curve with the
        given trace). Then f, of size approximately 2 sqrt(p/3), behaves with
        respect to smoothness like a uniformly random integer of the same size:
        for u = log f / log B, the probability that f is B-smooth is
        rho(u) * (1 + o(1)) where rho is the Dickman-de Bruijn function, and the
        expected value of log(largest prime factor of f) / log f tends to the
        Golomb-Dickman constant, approximately 0.6243.
      rigorous_support: >-
        RIGOROUS PART: for a FIXED f, the number of primes p with 4p = t^2 + 3f^2
        is governed by counting lattice points on a conic, and Cornacchia makes
        the correspondence explicit and invertible, so the map p -> f is not
        arbitrary and f is not free. What is rigorous is only that f is
        determined by p and lies in the stated size range. THE SMOOTHNESS
        DISTRIBUTION IS THE HEURISTIC PART.
        CLASSICAL THEOREM IMITATED: the Dickman-de Bruijn theorem, that the
        density of B-smooth integers up to x is rho(u) with u = log x / log B,
        together with the Knuth-Trabb Pardo / Golomb-Dickman result on the
        largest prime factor. The heuristic asserts that conductors arising from
        the CM equation inherit that behaviour, in the same way that the standard
        index-calculus and ECM analyses assert it for the auxiliary integers they
        produce.
        WHY IT COULD FAIL, STATED HONESTLY: f is constrained by a quadratic form,
        and quadratic-form values have known non-uniform divisibility biases - in
        particular f's divisibility by small primes is correlated with splitting
        conditions in Q(sqrt(-3)). The heuristic could be wrong by a constant, or
        systematically biased at small primes, and the validation is designed to
        detect exactly that.
      validation_route: >-
        WHAT TO SAMPLE: at least 10^5 primes p in each of the 256-, 384- and
        521-bit ranges admitting 4p = t^2 + 3f^2, obtained by sampling (t, f)
        and testing primality of (t^2 + 3f^2)/4 - which is the cheap direction
        and avoids any curve construction whatsoever. THIS IS THE SHORTCUT THAT
        MAKES CRYPTO-SCALE SAMPLING POSSIBLE HERE: no point counting, no isogeny,
        no Deuring correspondence needed, because the conductor is available
        directly from the CM equation.
        AT WHAT SCALE: crypto-scale, genuinely - f is a 128-bit to 260-bit
        integer and its full factorisation is obtainable by ECM plus a general
        method in seconds to minutes each, so a 10^5-sample distribution is
        affordable. THIS IS NOT TOY-SCALE VALIDATION AND MUST NOT BE LABELLED AS
        SUCH; equally, it validates a statement about INTEGERS, not about curves,
        and that limit is part of the label.
        AGAINST WHAT PREDICTION: the empirical B-smooth fraction against rho(u)
        for a ladder of B, and the empirical distribution of
        log(largest prime factor)/log f against the Golomb-Dickman law.
        TAIL CONSISTENCY CHECK: the extreme tail matters more than the bulk here,
        because a cheap descent needs f to be UNUSUALLY smooth. Report the
        empirical frequency of f being B-smooth for u in {2, 3, 4, 5} against
        rho(u) individually, and report the largest observed deviation in units
        of the binomial standard error. A bulk fit with a broken tail would mean
        the descent budget is mis-estimated in exactly the regime that matters.
        FALSIFICATION: an empirical B-smooth fraction differing from rho(u) by
        more than 3 standard errors at any u in the ladder, consistently across
        the three size ranges. H1 is then false as stated and any O2 reachability
        claim built on it is withdrawn.
    - id: H2
      formal_statement: >-
        Conditional on outcome O2 (some cost functional varies with volcano
        level), the functional's value at a curve reached by a descending walk of
        length L from the surface is, for L above a threshold, distributed as it
        is for a uniformly random curve at that level - i.e. the descending walk
        mixes within a level fast enough that the reachable subfamily is
        representative rather than special.
      rigorous_support: >-
        RIGOROUS PART: none is claimed. The crater is a Cayley graph of Cl(O_K)
        and is a rapid mixer under GRH (the fact DECOMPOSITION.md T5 cites), but
        that is a statement about the HORIZONTAL direction, which claim (A) shows
        is trivial here. The descending direction is a tree, not a Cayley graph,
        and no expander property is available for it.
        CLASSICAL ANALOGUE IMITATED: the rapid-mixing assumption standard in
        isogeny-graph random-walk arguments, transplanted to a setting where it
        is NOT justified by the same theorem. H2 IS THEREFORE THE WEAKER OF THE
        TWO HEURISTICS AND IS FLAGGED AS SUCH.
      validation_route: >-
        WHAT TO SAMPLE: at toy scale only, where the class is enumerable -
        compare the functional distribution over curves reached by descending
        walks of length L against the distribution over ALL curves at that level,
        for L in a ladder, using a two-sample test. TOY SCALE ONLY, AND LABELLED
        SO: there is no crypto-scale shortcut for H2 and this record does not
        pretend otherwise. If O1 holds, H2 is moot and is never tested.
        FALSIFICATION: a significant distributional difference at every L in the
        ladder means the descending walk does not mix and the reachable subfamily
        is special, which would invalidate any reachability argument built on it.

  proof_search_map:
    bottleneck: >-
      Two, and they are in different places. The ARGUMENT's bottleneck is the
      cardinality of the crater, which is h(D_0) and is settled. The
      MEASUREMENT's bottleneck is exhaustive enumeration of an isogeny class,
      whose size is about f ~ p^{1/2}, which caps the toy scale at p around 2^24
      and is the binding constraint on Steps 2-4.
    baseline_embedding:
      parameter_slice: >-
        A toy class with D_0 = -3 and f a product of two small primes, small
        enough to enumerate exhaustively. The enumeration must reproduce the
        independently computed h(Z[pi]) exactly, and must find exactly ONE curve
        with End = O_K, namely j = 0.
      reproduction_check: >-
        Frozen fixture: exact integer equality of the enumerated class size with
        h(Z[pi]) computed from the order, and exact identification of the unique
        surface curve as j = 0. Either mismatch halts the line - an enumeration
        that miscounts the class cannot support any variance statement.
    observation_collision:
      observable: >-
        The volcano level vector (v_ell)_{ell | f} of a curve.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED MASSIVELY: at any level below the
        surface there are many curves with the same level vector, so the
        observable is far from identifying. That is not a falsifier, it is the
        calibration: it means a level-stratified analysis can only ever detect a
        LEVEL effect, never a curve effect, and any per-curve variance must be
        attributed to instance noise unless a finer observable is introduced.
        The report must state the level multiplicities alongside every stratified
        statistic, or the stratification is uninterpretable.
    quantifier_order: >-
      Intended for the closure: FORALL ordinary isogeny classes over F_p with
      h(D_0) = 1, THERE IS EXACTLY ONE curve with maximal endomorphism ring, and
      THEREFORE FORALL cost functionals C, the minimum of C over the crater
      equals C at that curve.
      The dangerous weaker reading, NOT claimed: FORALL classes EXISTS a good
      curve somewhere - which is true and useless, because "somewhere" includes
      the p^{1/2} curves below the surface whose reachability is exactly the open
      question (C). The audit obligation is that the closure is stated for the
      CRATER and never for the class, and that no summary drops that word.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At h(D_0) = 1 the crater is a single vertex, so horizontal optimisation
        within the class is empty; and on the tested toy classes, cost
        functionals do (or do not) vary with volcano level." It can NEVER certify
        anything about crypto-scale classes, which cannot be enumerated, nor
        about the descending direction beyond what H1 and H2 are validated to
        support.
      nearby_object_control: >-
        A LARGE-h CLASS at matched p (control N1), where the hoped-for conclusion
        FAILS - there the crater has many vertices and horizontal optimisation is
        a real question with a real p^{1/4} cost. The method must distinguish the
        two: it must report crater size 1 in one and h in the other, and it must
        report a MEANINGFUL horizontal variance question in the second and a
        vacuous one in the first. A method that treats the two identically has
        not identified the load-bearing structure, which is h and not |D_0|.
    proof_obligations:
      - claim: "The crater is a Cl(O_K)-torsor, hence has h(D_0) elements."
        responsibility: correctness
      - claim: "For D_0 = -3 the unique surface curve is j = 0."
        responsibility: correctness
      - claim: "The enumerated class size equals h(Z[pi])."
        responsibility: baseline
      - claim: "T1 transport preserves k, verified by certificate on every edge."
        responsibility: soundness
      - claim: "Level-stratified statistics report level multiplicities."
        responsibility: scope
      - claim: "H1 is validated against Dickman-de Bruijn at crypto-relevant sizes."
        responsibility: success_probability
      - claim: "H2 is tested at toy scale only and labelled so."
        responsibility: scope

  predictions:
    - metric: number of curves with maximal endomorphism ring in a D_0 = -3 toy class
      direction: different
      minimum_effect: >-
        Exactly 1, and its j-invariant exactly 0, on every enumerated class. Any
        other count refutes the cardinality argument or the enumeration.
    - metric: enumerated class size versus independently computed h(Z[pi])
      direction: different
      minimum_effect: >-
        Exact equality on every class. Disagreement halts the line.
    - metric: >-
        within-class variance of each cost functional, divided by the matched
        between-instance variance at the same p
      direction: different
      minimum_effect: >-
        Predicted below 0.25 - i.e. within-class variation is small compared with
        instance noise, which is outcome O1 and is DECOMPOSITION.md section 5's
        own prediction. A ratio above 1.0 that survives the random-relabelling
        null N2 is outcome O2 and is the campaign's target.
    - metric: >-
        surface-versus-depth-1 difference on each functional, with phi withheld
      direction: different
      minimum_effect: >-
        Predicted indistinguishable at the 0.05 level. A surviving difference is
        a LEVEL effect rather than an automorphism effect and is the one result
        this family can establish that a general class cannot.
    - metric: >-
        empirical B-smooth fraction of the conductor f versus rho(u), at
        crypto-relevant p, for u in {2,3,4,5}
      direction: different
      minimum_effect: >-
        Agreement within 3 binomial standard errors at every u and across all
        three size ranges. Deviation falsifies H1.
    - metric: >-
        empirical mean of log(largest prime factor of f)/log f
      direction: different
      minimum_effect: >-
        0.6243 within 0.02 across at least 10^5 samples per size range.

  minimal_test:
    design: >-
      CHEAPEST VALID DISCRIMINATOR, AND IT COSTS NO COMPUTE: STEP 1. The
      cardinality argument settles the horizontal half of the lane outright - at
      h(D_0) = 1 there is exactly one curve at the surface, so there is nothing
      to optimise over and nothing to walk to, and the CSIDH-style p^{1/4}
      obstruction is simultaneously absent and irrelevant. Recording that
      conservation law is the deliverable and it requires an argument, not an
      experiment.
      THE CHEAPEST EMPIRICAL DISCRIMINATOR IS STEP 5, WHICH RUNS AT CRYPTO SCALE
      AND NEEDS NO CURVES: sample 10^5 conductors from 4p = t^2 + 3f^2 at 256
      bits and fit their smoothness against Dickman. That single distribution
      decides whether the descending direction is cheap enough to matter, before
      any isogeny is computed and independently of whether O1 or O2 holds - and
      if H1 fails, the entire reachability half of the lane is re-based before
      any toy enumeration is paid for.
      Steps 2-4 are the expensive part and are worth running only because L1
      needs them anyway and this is L1's most informative stratum.
    controls:
      - large-h class at matched p (N1)
      - random level relabelling (N2)
      - phi-withheld surface arm (N3)
      - T1 transport certificate on every isogeny edge
      - independently computed h(Z[pi]) against the enumeration
      - matched rho and matched BSGS on a sample of curves at each level
      - >-
        the matched-null battery of IDEA-20260807-a3d644, including the
        sixth-power representation gate, run before any functional is reported
    required_metrics:
      - class size, crater size, and the full level lattice
      - per curve: j, (a,b), level vector, every cost functional, seeds
      - within-class and between-class variance per functional, with intervals
      - level multiplicities alongside every stratified statistic
      - transport certificate pass rate (must be 100 percent)
      - conductor smoothness distribution versus rho(u), with tail table
      - largest-prime-factor statistic versus the Golomb-Dickman constant
      - H2 mixing test results at toy scale, labelled toy scale

  falsification_conditions:
    - >-
      More than one curve with maximal endomorphism ring is found in an
      h(D_0) = 1 class. The cardinality argument or the level detection is wrong;
      halt.
    - >-
      Enumerated class size disagrees with h(Z[pi]). The enumeration is
      incomplete and no variance statement is admissible.
    - >-
      A T1 transport changes k. T1 is elementary and this would be an
      implementation error; every number in the run set is void.
    - >-
      Within-class variance exceeds between-instance variance AND survives the
      random-relabelling null. Outcome O2: the lane has a target and the
      reachability question in (C) becomes load-bearing. Requires independent
      replication before interpretation.
    - >-
      H1 fails against Dickman at 3 standard errors. The descent budget is
      mis-modelled and every reachability statement is withdrawn until it is
      re-based on the measured distribution - which would itself be a reportable
      finding about conductors of CM primes.
    - >-
      Class enumeration exceeds budget at the largest declared p. INFRASTRUCTURE
      outcome under AGENTS.md rule 5; the toy ceiling is lowered and recorded,
      and nothing is inferred about variance.

  confounders:
    - >-
      SMALL CLASSES GIVE SPURIOUS STRATIFICATION. A class of 20 curves split
      across 4 levels has 5 curves per stratum; almost any functional will look
      stratified. N2's random relabelling is the only defence and it is blocking.
    - >-
      j = 0 IS BOTH THE SURFACE AND THE AUTOMORPHISM-RICH CURVE. Every
      surface-versus-depth comparison is confounded by |Aut| = 6 unless phi is
      withheld. N3 exists for exactly this and no surface claim may be made
      without it.
    - >-
      TWIST SELECTION. Which sextic twist is used determines the trace and hence
      the class; comparing across twists compares different classes. Recorded per
      instance.
    - >-
      THE CONDUCTOR IS NOT A FREE INTEGER. f is a value of a quadratic form and
      its small-prime divisibility is correlated with splitting in Q(sqrt(-3)).
      H1 could be biased for exactly this reason and the validation is designed
      to see it; assuming H1 without the validation would be the classic
      smoothness-heuristic error.
    - >-
      OUTCOME O1 IS NOT A PROOF OF INVARIANCE. Constancy on toy classes at
      p <= 2^24 does not establish constancy at crypto scale, and the record must
      say so wherever O1 is reported.

  reachability_gate: >-
    THIS PROPOSAL IS THE LANE'S REACHABILITY-GATE ANALYSIS AND IT ANSWERS T5 IN
    THREE PARTS.
    (i) HORIZONTAL, WITHIN THE CRATER: at h(D_0) = 1 there is one vertex. Cost to
      reach the best crater curve: ZERO if you are on it (a j = 0 curve is on it
      by definition, since End = O_{-3} is maximal), and there is no other. T5's
      p^{1/4} vectorisation obstruction is ABSENT - and so is the payoff. This
      half is closed.
    (ii) VERTICAL, DESCENDING FROM THE SURFACE: about p^{1/2} curves are below,
      every one carrying the same k by T1. Cost to reach a curve at depth
      (v_ell): sum over ell of v_ell steps, each Otilde(ell). The CHEAPLY
      reachable subfamily is the B-smooth part of f for the affordable B, and
      its expected size is governed by heuristic H1. This half is OPEN and its
      budget is measurable at crypto scale by Step 5 without any curve
      computation.
    (iii) VERTICAL, ASCENDING TO THE SURFACE from a non-surface curve: requires
      ell-isogenies for the ell dividing the curve's own conductor, with the
      same Otilde(ell_max) obstruction, and is the direction a defender's curve
      would have to be pushed along. Not needed for a j = 0 curve, which is
      already at the top - which is the sense in which j = 0 is the MOST
      structurally favourable position in its class, and the sense in which that
      favourable position is worth exactly nothing unless outcome O2 fires.
    T4 remains binding over all three: no curve outside a D_0 = -3 class reaches
    any of this at any price.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. The relevant exponents for the reachability
      accounting: class size about p^{1/2}; crater size h(D_0) = 1 = p^0;
      descending step cost Otilde(ell) with ell | f and f about p^{1/2}; the
      largest prime factor of f typically about f^{0.62} = p^{0.31} under H1, so
      a FULL descent to an arbitrary level costs about p^{0.31} - which is below
      rho's p^{1/2} and is the reason the descending direction cannot be
      dismissed on cost alone. It can only be dismissed if outcome O1 holds, i.e.
      if there is nothing down there worth reaching. THAT IS THE HONEST STATE OF
      THIS LANE AND IT IS WHY O1/O2 IS THE DECISIVE MEASUREMENT.
    memory_exponent: >-
      Isogeny walking is O(polylog p) memory per curve; the toy enumeration
      stores the whole class, about p^{1/2} curves, which is why it is
      toy-scale-only. Nothing here competes with rho's O(1).
    best_known: >-
      Parallel rho at 0.886*sqrt(N) with O(1) memory (KN-TECH-001, KN-TECH-006);
      automorphism-discounted rho on CM curves (KN-TECH-018); BSGS at sqrt(N)
      time and memory, full cost N^{2/3+o(1)} (KN-TECH-031). For the isogeny
      side, KN-TECH-027 records classical vectorisation at about sqrt(#Cl).
    hidden_overhead: >-
      Disclosed in three places. (a) The p^{0.31} descent estimate hides H1,
      which is a heuristic and is only validated for INTEGERS, not for the
      curve-side consequences. (b) It also hides the Otilde, which conceals the
      modular-polynomial cost that can be Otilde(ell^2) when the polynomial is
      not precomputed - potentially turning p^{0.31} into p^{0.62}, which is
      WORSE than rho, and the record states this rather than quoting the
      favourable form. (c) H2 has no rigorous support at all and is flagged as
      the weaker heuristic.
    tradeoff_note: >-
      The descent is a time-versus-reachability dial: a budget B on isogeny
      degree buys the B-smooth part of f in reachable curves, and H1 quantifies
      the exchange rate. Parallelisation: descending walks from the surface
      parallelise trivially across branches, which is favourable, and this is
      recorded so that any O2 cost accounting uses the parallel form.

  dominated_by: >-
    AS AN ATTACK: mounts none. Checked row by row. TIME - rho at 0.886*sqrt(N)
    (KN-TECH-001, KN-TECH-006) dominates; even the favourable p^{0.31} descent
    estimate buys only ACCESS to curves, not a solution, and under outcome O1
    those curves are no better. MEMORY - rho at O(1) versus storing an enumerated
    class; rho dominates. DATA/QUERIES - no advantage. CM-SPECIFIC -
    automorphism-discounted rho (KN-TECH-018) dominates on this family.
    MEMORY-RICH - BSGS (KN-TECH-031). ISOGENY-SIDE - classical vectorisation at
    sqrt(#Cl) (KN-TECH-027) is not a competitor because at h = 1 there is nothing
    to vectorise, which is claim (A). NOT null.
    AS A STRUCTURAL RESULT: dominated by nothing in this repository, since no
    record contains the cardinality dichotomy; externally the underlying torsor
    structure is classical and no priority is claimed.
  sota_delta: >-
    Zero speedup; no attack. Structural delta, quantitatively: reduces the L3
    horizontal search space from "the crater, size h" to "one vertex" for the 9
    class-number-one discriminants, i.e. from a claimed p^{1/4} vectorisation
    obstruction to no obstruction and no target; and reframes the open space as
    the roughly p^{1/2} curves below the surface with a descent budget of about
    p^{0.31} under H1 (or about p^{0.62}, i.e. WORSE than rho, if modular
    polynomials must be built). Heuristic delta: supplies one numbered heuristic
    (H1) with a genuinely crypto-scale validation route requiring no curve
    computation, which is the only crypto-scale-validatable quantity anywhere in
    this batch.

  estimated_cost:
    implementation: high
    compute: medium
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.97 that the cardinality argument holds - it is the standard torsor
    structure. 0.9 that the toy enumeration finds exactly one surface curve at
    j = 0. 0.8 that outcome O1 holds, i.e. that no functional varies with level
    beyond noise, matching DECOMPOSITION.md section 5's own predictions 1 and 2 -
    so the most likely headline is a clean negative that closes L3's isogeny half
    with an argument for the horizontal direction and a measurement for the
    vertical one. 0.7 that H1 validates against Dickman within 3 standard errors;
    the quadratic-form bias is a real risk and a failure there would itself be a
    reportable finding about CM conductors. Ranked medium: the argument half is
    free and near-certain, the measurement half is expensive and depends on L1's
    enumeration machinery existing, and the one part that could change the
    campaign's direction (O2) is the least likely branch.

