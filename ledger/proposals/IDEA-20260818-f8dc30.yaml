idea:
  id: IDEA-20260818-f8dc30
  question_id: RQ-QALG-122b59
  added: '2026-08-18'
  proposed_by: idea-generator
  title: >-
    TRANSFORM-DOMAIN (CYCLOTOMIC-COSET) AUDIT OF QC-SD: the Berlekamp-Massey
    weight threshold wt(h) <= n/(2w), the exact multiplicative deficit w that
    HQC's parameters put between it and reality, and the "2 primitive mod n"
    design choice that collapses n transform equations to one
  class: mechanism

  claim: >-
    Quasi-cyclic syndrome decoding at HQC's shape (R = 1/2, secret (x,y) with
    wt(x) = wt(y) = w, ring R = F_2[X]/(X^n - 1), n prime) is solvable in
    CLASSICAL polynomial time -- not merely quantum-accelerated -- whenever
    wt(h) <= n/(2w) - 1, by Berlekamp-Massey on the discrete Fourier transform
    of the syndrome over F_{2^{ord_n(2)}}; and it is NOT so solvable at HQC's
    actual parameters, where the obstruction is a specific finite number:
    E[wt(h)] = n/2 exceeds the threshold n/(2w) by a MULTIPLICATIVE FACTOR OF
    EXACTLY w (66 at HQC-128, 100 at HQC-192, 131 at HQC-256). Two testable
    consequences follow. (C1) The number of F_2-independent transform-domain
    equations is 1 + (n-1)/ord_n(2), not n; if ord_n(2) = n-1 (2 primitive mod
    n, an asserted HQC design criterion) the apparently massively
    overdetermined system of n equations in 2w unknowns collapses by Frobenius
    to ONE nontrivial F_{2^{n-1}}-equation plus one F_2 parity equation, and
    every algebraic/Groebner/Macaulay attack in the transform domain is
    underdetermined by construction. (C2) The route back to the threshold --
    find a multiplier c with wt(c)*w + wt(ch)*w <= n/2 -- is closed by a
    FIRST-MOMENT COUNTING BOUND, not by a search-cost bound: the expected
    number of such c at HQC-128 is 2^{-16414 +/- o(n)}, so Grover's square
    root over multipliers is irrelevant because the search space is empty.
  mechanism: >-
    Let n be an odd prime, m = ord_n(2), alpha a primitive n-th root of unity
    in F_{2^m}, and for a in R write a_hat_i = a(alpha^i). The DFT turns ring
    multiplication into pointwise multiplication, so the QC-SD key equation
    s = x + h*y becomes s_hat_i = x_hat_i + h_hat_i * y_hat_i for all i in Z_n.
    Because x has F_2 coefficients and weight w, x_hat_i = sum_{j in supp(x)}
    alpha^{i j} = sum_{l=1..w} X_l^i with X_l = alpha^{j_l} in mu_n. If
    wt(h) = t with supp(h) = {d_1..d_t}, then h_hat_i * y_hat_i =
    sum_{r=1..t} sum_{m'=1..w} (alpha^{d_r} Y_{m'})^i. Hence the sequence
    (s_hat_i)_{i in Z_n} is a sum of at most L = w + t*w distinct exponentials,
    i.e. a linear recurrent sequence of linear complexity <= L, and
    Berlekamp-Massey recovers its minimal polynomial from any 2L consecutive
    terms. We hold one full period (n terms). Therefore 2(w + t w) <= n gives
    the L nodes as the roots of the minimal polynomial; supp(h) is public, so
    the Y-family is identified as the t-tuples {alpha^{d_r} rho} that are all
    roots, and the remainder are the X-nodes. Taking discrete logs base alpha
    returns supp(x), supp(y). Cost: one DFT plus one Berlekamp-Massey, both
    O(n^2) F_{2^m}-multiplications, i.e. polynomial. THE MECHANISM'S RESEARCH
    CONTENT IS ITS BOUNDARY, not its interior. Two structural facts fix that
    boundary. (i) FROBENIUS COLLAPSE: h and s have F_2 coefficients, so
    h_hat_{2i} = h_hat_i^2 and s_hat_{2i} = s_hat_i^2, hence the equation at
    index 2i is the SQUARE of the equation at index i and carries no new F_2
    information. The independent equations are indexed by 2-cyclotomic cosets
    mod n, of which there are 1 + (n-1)/ord_n(2). With 2 primitive mod n there
    are exactly two, so "n equations in 2w unknowns" is an illusion: the real
    system is one F_{2^{n-1}}-linear equation sum_l X_l + h_hat_1 sum_m Y_m =
    s_hat_1 with X_l^n = Y_m^n = 1 -- which is the original subset-sum, restated.
    (ii) THE MULTIPLIER ROUTE: multiplying the key equation by any unit c gives
    c*s = c*x + (c*h)*y with node count wt(c)*w + wt(ch)*w, so reaching the
    threshold requires wt(c) + wt(ch) <= n/(2w). For fixed c and uniform h,
    c*h is uniform, so E[#{c : wt(c) <= a, wt(ch) <= b}] = C(n,<=a) C(n,<=b)
    2^{-n} EXACTLY (linearity of expectation, no heuristic in the first moment).
    At n = 17669, a = b = 66: log2 of that expectation is about -16414.
  novelty_status: unverified

