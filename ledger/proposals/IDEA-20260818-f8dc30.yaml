  assumptions:
    - HQC's h is a uniform ring element derived from a public seed by SHAKE.
    - n is prime and the ring is R = F_2[X]/(X^n - 1) as specified.
    - The attacker knows h and s (public key) -- the key-recovery setting.

  object_first_framing:
    established_families_declared_off_limits_as_primary_lens:
      - Grover/amplitude-amplification over information sets (Grover-Prange).
      - Quantum-walk-accelerated MMT/BJMM representation ISD (Kachigar-Tillich).
      - Circuit/qubit-count refinements of both (the 2021-2024 resource line).
      - The five objects already generated against this RQ, listed in
        TASK-20260813-9f7a4a/idea-report.yaml.
    tracked_object: >-
      THE MACAULAY/RANK PROFILE OF THE TRANSFORM-DOMAIN TWISTED POWER-SUM
      IDEAL -- concretely, the integer sequence (number of F_2-independent
      transform equations at each cyclotomic coset; linear complexity of
      (s_hat_i)) attached to an instance, NOT the error vector and NOT the
      error-locator polynomial.
    lossy_projection_test: >-
      PASSES, and the near-miss is worth recording because it is the exact trap
      docs/inventor-protocol.md section 2 describes. The ERROR-LOCATOR
      POLYNOMIAL is NOT an admissible tracked object: its roots are precisely
      the support, so the projection (supp(x),supp(y)) -> locator loses
      nothing and is a change of coordinates, exactly like (Delta,Pi) =
      (x^y, xy) in characteristic 2. What IS lossy is the pair (linear
      complexity L of the transform sequence; number of independent cyclotomic
      cosets): both are small integers, so their fibres are astronomically
      large -- at HQC-128, 2^{1064} support pairs map onto O(n) possible values
      of L. And the discarded information is discarded COMPATIBLY with the
      target's operations: L is sub-additive under addition of ring elements
      and satisfies L(a*b) <= L(a)L(b) under ring multiplication, so L
      propagates deterministically through exactly the operations QC-SD is
      built from. That is why the threshold statement is a theorem about L and
      not a restatement of the instance.
    survival: >-
      The object survives as long as L stays below n/2, i.e. as long as
      wt(h) <= n/(2w). It DISSOLVES at wt(h) > n/(2w) -- L saturates at n, the
      minimal polynomial is X^n - 1, and the projection carries zero
      information. HQC sits a factor of exactly w beyond the dissolution
      point. That distance, not the mechanism, is the deliverable.

  proof_search_map:
    bottleneck: >-
      The linear complexity L = w + wt(h)*w of the transform-domain syndrome
      sequence. Every claim here turns on whether 2L <= n.
    baseline_embedding:
      parameter_slice: >-
        wt(h) = 1 (h a monomial X^d). Then L = 2w and the threshold 2L <= n
        holds with enormous slack, so the method must recover (x,y) in
        polynomial time. This is the correct old-method boundary: for h = X^d
        the instance s = x + X^d y is trivially "solvable" in the sense that
        the QC code is a shift code, and any correct implementation MUST
        reproduce that. A second slice, h = 1 + X^d (wt = 2, L = 3w), must also
        succeed and is a stricter test because it exercises the t-tuple
        grouping step.
      reproduction_check: >-
        Frozen symbolic fixture at n = 31, 43, 59 (primes with 2 primitive) and
        w = 3, 4: construct (x,y), form s, run DFT + BM + node partition, and
        assert exact recovery of supp(x), supp(y) for wt(h) = 1, 2, 3. Stored
        as a regression fixture with seeds, not as a plot.
    observation_collision:
      observable: >-
        The minimal polynomial of (s_hat_i)_{i in Z_n} -- equivalently the node
        multiset {X_l} u {alpha^{d_r} Y_{m'}}.
      distinct_preimage_search: >-
        A collision exists and is REAL, and it is the correctness caveat of the
        method rather than a falsifier: over F_2 in characteristic 2, if a node
        appears an even number of times in the multiset it CANCELS, so distinct
        support pairs can share a minimal polynomial. This happens exactly when
        alpha^{d_r} Y_{m'} = alpha^{d_{r'}} Y_{m''} for (r,m') != (r',m''),
        i.e. when supp(y) has a repeated difference matching a difference in
        supp(h). Expected number of such coincidences ~ t w^2 / n, which is
        0.25 for t = 1 and grows linearly in t; at the threshold t = n/(2w) the
        expected number is w/2 = 33, so cancellations are NOT rare at the
        boundary. Consequence recorded honestly: the threshold as stated is an
        UPPER bound on where the method works, and the experiment must measure
        the practical threshold, which may be strictly below n/(2w).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The syndrome as a linear recurrent sequence over F_{2^{ord_n(2)}};
          the hypothesis "the support is sparse" becomes the exact algebraic
          condition "the sequence has linear complexity <= L".
        predicted_gain: >-
          Exponent collapse from 2^{2w(1+o(1))} classical / 2^{w(1+o(1))}
          quantum to n^{O(1)}, on and only on the region wt(h) <= n/(2w) - 1.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (number of independent cyclotomic cosets) fixed
          at 2 and vary n over primes; the intrinsic invariant distinguishing
          the resulting instances is ord_n(2).
        predicted_gain: >-
          Identifies ord_n(2) = n-1 as the single load-bearing design choice
          blocking the whole transform-domain algebraic lane, and hands a
          concrete falsifier: any standardized n with ord_n(2) < n-1.
    quantifier_order: >-
      FOR ALL odd primes n with 2 primitive mod n, FOR ALL w >= 1, FOR ALL
      h in R with wt(h) <= n/(2w) - 1, and FOR ALL (x,y) with wt(x) = wt(y) = w
      whose node multiset is cancellation-free, THERE EXISTS a deterministic
      algorithm running in O(n^2) F_{2^{n-1}}-operations recovering (x,y) from
      (h, s). Note the witness (the algorithm) does NOT depend on the instance
      -- it is uniform in h, which is what makes this a threshold rather than
      an instance-specific trick. The negative direction has the OPPOSITE and
      weaker quantifier order and must not be overstated: for wt(h) > n/(2w),
      THERE EXISTS NO ALGORITHM OF THIS FORM, which is a statement about this
      lane and about nothing else.
    method_ceiling:
      strongest_certifiable_claim: >-
        "QC-SD is polynomial-time when wt(h) <= n/(2w) - 1, and the transform
        domain supplies exactly 1 + (n-1)/ord_n(2) independent equations."
        This method can NEVER certify anything about HQC's actual instances: at
        wt(h) ~ n/2 the observable is constant (L = n) across the entire
        instance space, so it has zero discriminating power there.
      nearby_object_control: >-
        The nearby object on which the hoped-for conclusion fails is HQC
        itself: same ring, same w, same rate, wt(h) = n/2. The method cannot
        distinguish an HQC instance from a random ring element pair, which is
        precisely the statement that it does not attack HQC. A second control:
        BIKE/QC-MDPC, where wt(h) is ALSO ~n/2 but w = O(sqrt(n log n)) is
        larger; the threshold n/(2w) is smaller there, so the method is even
        further from applying -- and any implementation claiming otherwise is
        buggy.
    proof_obligations:
      - claim: 'L <= w + wt(h)*w for the transform syndrome sequence'
        responsibility: size
      - claim: 'DFT + BM + node partition costs O(n^2) F_{2^m}-operations'
        responsibility: runtime
      - claim: 'recovery is exact when the node multiset is cancellation-free'
        responsibility: correctness
      - claim: 'cancellation-free holds with probability 1 - O(t w^2 / n)'
        responsibility: success_probability
      - claim: 'independent equations number 1 + (n-1)/ord_n(2)'
        responsibility: baseline
      - claim: 'E[#threshold-reaching multipliers c] = C(n,<=a)C(n,<=b)2^{-n}'
        responsibility: size
      - claim: 'the claim is scoped to wt(h), not to HQC as specified'
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: ord_n(2) for n in {17669, 35851, 57637}
      direction: different
      minimum_effect: >-
        PREDICTED ord_n(2) = n - 1 for all three (2 primitive). ANY n with
        ord_n(2) < n - 1 is a positive finding and escalates immediately:
        the independent-equation count becomes 1 + (n-1)/ord_n(2) >= 3.
    - metric: number of 2-cyclotomic cosets mod n
      direction: lower
      minimum_effect: 'predicted exactly 2 (vs the naive count n)'
    - metric: bm_weight_threshold t* = floor(n/(2w)) - 1
      direction: different
      minimum_effect: >-
        predicted t* = 132 (HQC-128), 178 (HQC-192), 218 (HQC-256), computed
        from RECALLED parameters; the executor recomputes from the spec.
    - metric: multiplicative deficit E[wt(h)] / t*
      direction: higher
      minimum_effect: >-
        predicted = w exactly, i.e. 66 / 100 / 131. A measured deficit below
        10 at any standardized parameter set falsifies the recalled parameters
        or the analysis.
    - metric: 'log2 E[#{c : wt(c)+wt(ch) <= n/(2w)}]'
      direction: lower
      minimum_effect: >-
        predicted <= -10^4 at all three parameter sets (approx -16414 at
        HQC-128). Any value > -100 reopens the multiplier lane and makes a
        Grover search over c worth costing.
    - metric: practical BM threshold measured at toy n (largest wt(h) at which recovery succeeds in >= 95% of trials)
      direction: lower
      minimum_effect: >-
        predicted at or below the analytic t*, and predicted to fall below it
        by a factor consistent with the cancellation rate t w^2 / n. If the
        practical threshold EXCEEDS t*, the size bound L <= w + t w is wrong
        and must be re-derived.

  minimal_test:
    design: >-
      Three steps, all cheap, in order.
      STEP 1 (minutes, no quantum, no simulation): read n and w for
      HQC-128/192/256 from the 2025-08-22 specification (or from KN-LIT-b9e1a8);
      compute ord_n(2) by
      factoring n-1 and testing 2^{(n-1)/q} != 1 for each prime q | n-1;
      compute the cyclotomic-coset count, t* = floor(n/(2w)) - 1, the deficit
      E[wt(h)]/t*, and log2 of the exact first-moment multiplier count. Emit a
      table. This step alone decides the primitivity prediction.
      STEP 2 (hours, exact, classical): implement DFT + Berlekamp-Massey +
      node partition over F_{2^{ord_n(2)}} at toy primes n in
      {31, 43, 59, 83, 101, 131, 179, 251} with 2 primitive, w in {3,...,8},
      and sweep wt(h) from 1 up past floor(n/(2w)); measure the empirical
      recovery rate over 200 seeded trials per cell and locate the practical
      threshold. Compare against the analytic t* and against the predicted
      cancellation rate t w^2 / n.
      STEP 3 (hours, classical): at the largest toy n reachable, exhaustively
      or randomly sample c of weight <= a and record the empirical
      distribution of wt(c) + wt(ch); compare the observed minimum against the
      first-moment prediction and check for concentration (this is the only
      place a heuristic, H2, is load-bearing).
    controls:
      - >-
        POSITIVE CONTROL (mandatory, runs first): wt(h) = 1 and wt(h) = 2 at
        every toy n. Recovery MUST succeed at 100%. Failure means the
        implementation is wrong and no other cell may be interpreted.
      - >-
        NULL OBJECT 1: replace (x,y) by a uniform random pair of the SAME
        weights but with s drawn independently of them (an unsatisfiable
        instance). The pipeline must report failure, never a spurious
        recovery; any recovery is a measurement artifact.
      - >-
        NULL OBJECT 2: replace h by a uniform random ring element at the same
        toy n (wt(h) ~ n/2). Recovery rate must be indistinguishable from the
        unsatisfiable control. This is the direct test that the mechanism has
        NO power at HQC's operating point, and it is what stops this record
        being read as an attack.
      - >-
        NULL OBJECT 3 (measurement validity): a non-quasi-cyclic random
        [2n,n] code. The DFT step must be inapplicable; if the harness
        produces a number anyway, the harness is measuring something other
        than what is claimed.
      - >-
        STRUCTURAL TELL (inventor-protocol section 3.1): the recovery rate
        must DECAY as wt(h) increases past t*. A recovery rate that stays flat
        across wt(h) is the signature of an artifact (e.g. a leaked seed in
        the test harness), not of a wider threshold.
    required_metrics:
      - ord_n(2) and 2-cyclotomic-coset count per parameter set
      - analytic t* and measured practical threshold per (n, w)
      - empirical recovery rate with Wilson 95% intervals per (n, w, wt(h)) cell
      - observed cancellation count vs predicted t w^2 / n
      - empirical min of wt(c)+wt(ch) vs first-moment prediction
      - wall-clock and operation counts for DFT and BM at each n

  null_object_control: >-
    See minimal_test.controls NULL OBJECT 1-3. The load-bearing one is NULL
    OBJECT 2: uniform h at the same n. The mechanism's whole claim is that it
    separates wt(h) <= t* from wt(h) ~ n/2; if the measured recovery rate at
    uniform h is not statistically indistinguishable from the unsatisfiable
    control, then something other than sparsity of h is driving the result and
    the threshold interpretation is void.

  falsification_conditions:
    - >-
      ord_n(2) < n - 1 for any of the three standardized n. This falsifies the
      Frobenius-collapse claim (C1) at that parameter set, raises the
      independent-equation count to 1 + (n-1)/ord_n(2), and REOPENS the
      transform-domain algebraic lane; it must be escalated, not filed.
    - >-
      Measured practical BM threshold materially ABOVE the analytic
      t* = floor(n/(2w)) - 1 at two or more toy n. Falsifies the size bound
      L <= w + wt(h) w.
    - >-
      Recovery succeeds at uniform h (NULL OBJECT 2) at any toy n with rate
      above the unsatisfiable control at 99% confidence. Falsifies the
      dissolution claim and would be a genuine attack signal on random QC-SD.
    - >-
      An explicit c with wt(c) + wt(ch) <= n/(2w) found at any n >= 1000 with
      uniform h. Falsifies heuristic H2's concentration and reopens the
      multiplier lane.
    - >-
      Measured multiplicative deficit E[wt(h)]/t* differing from w by more
      than 10% at any parameter set. Falsifies either the recalled parameters
      or the derivation; both matter.

  confounders:
    - >-
      Toy primes are small enough that w^2/n is not small, so cancellation
      rates at toy scale OVERSTATE the practical threshold's shortfall
      relative to HQC scale. The extrapolation to HQC-128 must be stated as an
      extrapolation, with t w^2 / n as the stated scaling law and no claim
      beyond it.
    - >-
      An implementation that computes the DFT over an unnecessarily large
      field, or that silently uses a non-primitive alpha, will produce a
      correct-looking threshold for the wrong reason. Assert ord(alpha) = n and
      ord_n(2) = m in the harness.
    - >-
      Berlekamp-Massey over F_{2^m} with m ~ n is expensive at toy scale for
      the wrong reason (big-field arithmetic), which can be mistaken for the
      method failing. Separate correctness from cost in the metrics.
    - >-
      The recalled HQC parameters may be wrong or stale (the 2025 spec changed
      key derivation). Every number in predictions is conditional on Step 1
      re-reading them.

  interpretation_limits:
    - >-
      NOTHING HERE IS AN ATTACK ON HQC. The predicted outcome is that all
      three standardized parameter sets sit a factor w beyond the threshold and
      that the transform-domain lane is closed. The deliverable is two reusable
      numbers and a design criterion.
    - >-
      The polynomial-time claim is scoped to wt(h) <= n/(2w) - 1, to the ring
      F_2[X]/(X^n-1) with n prime, and to the Hamming metric. It says nothing
      about BIKE/QC-MDPC (different w regime), nothing about rank metric, and
      nothing about HQC's DFR model (RQ-HQC-001's subject).
    - >-
      Toy-scale (n <= 251) recovery-rate measurements are hypothesis-generating
      for the practical-threshold scaling law only. They are not statements
      about standardized HQC (RQ constraint).
    - >-
      The "polynomial" in the sub-threshold regime is a LARGE polynomial:
      O(n^2) multiplications in F_{2^{n-1}} is about 2^{56} bit operations at
      n = 17669 with schoolbook arithmetic, 2^{43} with fast multiplication.
      Quoting it as "poly-time" without this figure would be misleading.
    - >-
      The first-moment multiplier bound is an expectation. It rules out the
      lane on average over h; it is not a per-instance impossibility proof, and
      it is not claimed as one.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For h expanded from a public seed by SHAKE as specified, wt(h) is
        distributed as Binomial(n, 1/2); in particular E[wt(h)] = n/2 and
        Pr[wt(h) <= n/(2w)] <= exp(-2n(1/2 - 1/(2w))^2), which is below
        2^{-1000} for all three parameter sets.
      rigorous_support: >-
        The classical bound imitated is the Chernoff-Hoeffding tail for a
        Binomial, applied under the standard modelling of a XOF output as a
        uniform bit string. The rigorous half is that IF h is uniform in R then
        wt(h) IS exactly Binomial(n,1/2); the heuristic half is only that
        SHAKE's output is indistinguishable from uniform for this statistic.
      validation_plan: >-
        Sample 10^6 h from the HQC reference keygen at HQC-128 (seeded,
        recorded), compute the empirical CDF of wt(h), and compare against
        Binomial(17669, 1/2) by a two-sided Kolmogorov-Smirnov test at
        alpha = 0.01. TAIL CHECK: the minimum observed wt(h) over 10^6 samples
        must lie within the Binomial 10^{-6} quantile (n/2 - 4.75 sqrt(n)/2 =
        8518); an observed minimum below 8000 is a finding in its own right.
        Sampled parameters recorded: HQC-128 only; transfer to HQC-192/256 is
        an explicit assumption, re-tested at 10^5 samples each.
      falsification_condition: >-
        KS test rejects at alpha = 0.01, or minimum observed wt(h) below the
        10^{-6} Binomial quantile.
    - id: H2
      statement: >-
        For uniform h in R and any a, b, the count N(a,b) = #{c in R :
        wt(c) <= a, wt(ch) <= b} concentrates around its exact expectation
        C(n,<=a) C(n,<=b) 2^{-n}, in the sense that Pr[N(a,b) >= 1] <=
        (1 + o(1)) E[N(a,b)] whenever E[N(a,b)] = o(1), uniformly for
        a + b <= n/(2w).
      rigorous_support: >-
        The expectation is EXACT, not heuristic: for fixed c != 0 and uniform
        h, ch is uniform over R (multiplication by a unit is a bijection and
        the non-units form a negligible set for n prime), so
        Pr[wt(ch) <= b] = C(n,<=b) 2^{-n} exactly, and linearity of
        expectation gives the product form. The heuristic is only the
        first-moment-to-probability step, i.e. that N behaves like a sum of
        weakly dependent indicators -- the same step that Markov's inequality
        licenses rigorously in one direction and that the classical
        second-moment method licenses in the other for genuinely independent
        families.
      validation_plan: >-
        At toy primes n in {101, 131, 179, 251, 401, 601, 1021} with 2
        primitive, for 100 uniform h each, enumerate or randomly sample 10^7
        values of c with wt(c) <= a for a in {2,...,8} and record the empirical
        distribution of wt(c) + wt(ch), comparing the empirical minimum against
        the first-moment prediction argmin{v : C(n,<=a)C(n,<=v-a)2^{-n} >= 1}.
        TAIL CHECK: the smallest observed wt(c)+wt(ch) over all samples must
        not fall more than 2 standard deviations below the predicted minimum.
        Transfer assumption stated explicitly: concentration measured at
        n <= 1021 is extrapolated to n = 17669 with no measurement in between.
      falsification_condition: >-
        Observed minimum of wt(c)+wt(ch) below the first-moment prediction by
        more than 2 sigma at two or more toy n, or any single c found meeting
        the threshold bound at n >= 1000.
    - id: H3
      statement: >-
        For uniform supp(h) of size t and uniform supp(x), supp(y) of size w,
        the node multiset {X_l} u {alpha^{d_r} Y_{m'}} has all L = w + tw
        entries distinct except with probability at most t w^2 / n + w^2 / n.
      rigorous_support: >-
        Union bound over the at most t w^2 + C(w,2) pairs, each colliding with
        probability 1/n under the uniform-support model; this imitates the
        classical birthday/Poisson-approximation regime for balls in n bins
        with L = o(sqrt(n)) balls.
      validation_plan: >-
        Direct enumeration at toy n in {31,...,251}, w in {3,...,8}, t swept
        1..floor(n/(2w)): count actual node collisions over 200 seeded trials
        per cell and compare the empirical mean against t w^2/n + w^2/n; TAIL
        CHECK on the maximum collision count observed against the Poisson
        upper tail at the same mean.
      falsification_condition: >-
        Empirical mean collision count exceeding 2x the predicted value at two
        or more cells, which would mean the practical threshold is materially
        below t* and the closure margin is LARGER than claimed (a
        self-strengthening falsification, recorded as such).

  target_complexity:
    time_exponent: >-
      REGIME A (wt(h) <= n/(2w) - 1): n^{O(1)} classical -- concretely O(n^2)
      F_{2^{ord_n(2)}}-multiplications, about 2^{43}-2^{56} bit operations at
      n = 17669 depending on field arithmetic. REGIME B (HQC as specified,
      wt(h) ~ n/2): NO IMPROVEMENT. The method's cost is unchanged from the
      baseline because the method does not apply.
    memory_exponent: >-
      REGIME A: O(n * ord_n(2)) bits = O(n^2) = about 3.1 * 10^8 bits (39 MB)
      at HQC-128 to hold the transform, plus O(L * ord_n(2)) for the minimal
      polynomial. Classical RAM. NO QRAM, NO QRACM anywhere in this record.
      REGIME B: not applicable.
    qubit_and_depth_exponent: >-
      The core mechanism is CLASSICAL and uses zero qubits -- which is itself
      the point: if it applied to HQC it would be a classical break, not a
      quantum one. The only quantum component considered is Grover over
      multipliers c, and it is costed and rejected: index register
      ceil(log2 C(17669,67)) = 539 logical qubits plus a reversible ring
      multiplication circuit of Toffoli depth O(n log n) ~ 2^{18} and width
      O(n) = 2^{15} qubits. Assumes FULL FAULT-TOLERANT ERROR CORRECTION; NISQ
      is irrelevant at this depth. No QRAM required (h is classical and fixed,
      loaded as circuit constants). This costing is moot because the marked set
      is empty by H2: Grover over an empty search space returns nothing at any
      cost.
    best_known: >-
      Classical: ISD at 2^{2w(1+o(1))} * poly / sqrt(n) with DOOM, i.e. about
      2^{125} iterations at HQC-128 (2w = 132, R = 1/2, c = 1). Quantum:
      Grover-Prange at 2^{w(1+o(1))} = about 2^{66} iterations; quantum-walk
      BJMM/MMT claimed no better in the sublinear-weight regime up to o(1)
      (unverified in this corpus -- IDEA-20260813-fe3c5e's job).
    hidden_overhead: >-
      The o(1) in 2^{2w(1+o(1))} hides the polynomial per-iteration linear
      algebra, which is NOT negligible at these sizes (n^2 to n^3 bit
      operations, i.e. 2^{28} to 2^{43}); see IDEA-20260818-e0ce51, which
      charges it. Regime A's "polynomial" hides a factor of about 2^{43} that
      no asymptotic statement shows.
    tradeoff_note: >-
      No time-memory tradeoff: Regime A is single-shot with linear-in-n^2
      memory and is trivially parallelizable only in the DFT. No claw-finding
      structure, hence none of the van Oorschot-Wiener interpolation that
      dominates the exemplar's memory discussion.

  dominated_by: >-
    AT STANDARDIZED HQC PARAMETERS: dominated on every axis, by every row of
    the frontier, because no improvement is claimed there. Frontier rows
    checked individually: (1) classical Prange/Stern/Dumer/MMT/BJMM + DOOM,
    about 2^{125} iterations, polynomial memory for Prange -- dominates on time
    and memory; (2) Grover-Prange, about 2^{66} iterations, polynomial qubits,
    no QRAM -- dominates on time; (3) quantum-walk BJMM/MMT (Kachigar-Tillich),
    at most 2^{66} in this regime and needing QRACM proportional to list size
    -- dominates on time, is dominated on memory; (4) RLPN / Statistical
    Decoding 2.0 / Dual Attack 3.0, which beat ISD only for rate R < 0.3 and so
    are themselves dominated at HQC's R = 1/2 -- see IDEA-20260818-d5668d;
    (5) quantum dual-codeword sampling (Blanvillain-Chailloux-Tillich,
    arXiv:2509.24796), which requires a superposition of noisy codewords as
    input and does not apply to a fixed public key -- not on the frontier for
    this attack model; (6) brute-force support enumeration, 2^{1064} -- not on
    the frontier. IN REGIME A (wt(h) <= n/(2w) - 1): this record dominates
    every row above, polynomial versus 2^{Theta(w)}, on time, memory and
    queries simultaneously. NO STANDARDIZED PARAMETER SET IS PREDICTED TO LIE
    IN REGIME A, and the entire practical value of the record is the size of
    the gap between the two regimes.
  sota_delta: >-
    ZERO BITS at HQC-128/192/256 as specified (predicted outcome). Conditional
    and predicted-not-to-occur: if ord_n(2) < n-1 at some standardized n, the
    independent-equation count rises from 2 to 1 + (n-1)/ord_n(2) and the
    algebraic lane must be re-costed from scratch; if a standardized parameter
    set had wt(h) <= n/(2w), the delta would be 2^{66} -> 2^{43}-2^{56}
    classical operations, i.e. a complete break (about 66 bits against the
    quantum baseline, about 125 against the classical one). The record's
    positive deliverables are two REUSABLE NUMBERS: the multiplicative BM
    deficit, exactly w (66 / 100 / 131), and the multiplier counting deficit,
    about -16414 bits at HQC-128.

  obstruction:
    statement: >-
      The transform-domain linear complexity of a QC-SD syndrome is
      L = w + wt(h)*w, and Berlekamp-Massey needs 2L <= n. HQC's h is not
      sparse: E[wt(h)] = n/2 exceeds the threshold n/(2w) by a multiplicative
      factor of exactly w. Rewriting the instance by a multiplier c does not
      help because the required joint weight wt(c) + wt(ch) <= n/(2w) is met by
      an expected 2^{-16414} multipliers at HQC-128 -- the search space is
      EMPTY, not merely large, so quantum square-root search over it is
      irrelevant. Separately, the apparent overdetermination of the transform
      system is void: Frobenius makes equation 2i the square of equation i, so
      the n equations are 1 + (n-1)/ord_n(2) = 2 independent ones when 2 is
      primitive mod n. This is a claim about the OBJECT (the ring, the weight
      of h, the order of 2 mod n), not about any attempt.
    quantity: >-
      (q1) multiplicative BM weight deficit D_bm = E[wt(h)] / (n/(2w) - 1);
      (q2) log2 of the expected number of threshold-reaching multipliers
      D_mult = log2( C(n,<=a) C(n,<=b) 2^{-n} ) maximized over a+b = n/(2w);
      (q3) independent transform-equation count K = 1 + (n-1)/ord_n(2).
    value: >-
      PREDICTED, NOT YET MEASURED (this record proposes the measurement; no run
      exists). Predicted D_bm = 66.0 / 100.0 / 131.0 at HQC-128/192/256 with
      relative error dominated by the Binomial spread of wt(h), sigma =
      sqrt(n)/2, i.e. +/- 0.5% at HQC-128; predicted D_mult approx -16414 bits
      at HQC-128 (first moment, exact up to the C(n,<=a) vs C(n,a) rounding);
      predicted K = 2 at all three. UNITS: D_bm dimensionless ratio, D_mult
      bits, K a count. These are predictions with stated derivations, and under
      AGENTS rule 5 they are not to be quoted as measurements until STEP 1 runs.
    measured_by: []
    scope: >-
      Claimed only for R = F_2[X]/(X^n - 1) with n an odd prime, Hamming
      metric, rate-1/2 [2n,n] quasi-cyclic codes, secret weights
      wt(x) = wt(y) = w with w = o(n), and h uniform. NOT claimed for BIKE /
      QC-MDPC (different w), not for composite n, not for the rank metric, not
      for HQC's inner concatenated code, and not for the DFR model.
    resource_check:
      examined: true
      reading: >-
        THE OBSTRUCTION IS THE HYPOTHESIS OF A DESIGN THEOREM. D_bm = w says
        the security margin of the transform lane is not an accident of
        parameter choice but is pinned to the secret weight itself: any
        quasi-cyclic scheme that lowers w (to shrink keys or ciphertexts) moves
        the BM threshold n/(2w) UP proportionally and eats its own margin. That
        makes D_bm a design constraint of independent value: a variant with
        w = 10 and n = 17669 would have t* = 882, still far from n/2, but the
        ratio is the quantity a designer should track, and no HQC-family design
        rationale in this corpus states it. Second reading: K = 1 + (n-1)/
        ord_n(2) turns "2 is primitive mod n" from an implementation
        convenience (it makes X^n-1 factor into two irreducibles, which is
        usually motivated by avoiding folding attacks) into a QUANTIFIED
        algebraic-attack-surface parameter, and it hands a screening test
        applicable to every quasi-cyclic proposal, not just HQC. Third reading,
        which FAILED and is recorded as failing: D_mult approx -16414 is so far
        from 0 that no time-memory or quantum-amplitude theory takes it up --
        a 2^{16414} deficit is not a square root away from anything. No theory
        found that wants that number.
      spawned_ids: []

  estimated_cost:
    implementation: low
    compute: low
    detail: >-
      STEP 1 is arithmetic on three integers (minutes, any CAS). STEP 2 is a
      few hundred lines of Sage/Magma over F_{2^m} for m <= 250, roughly
      8 x 6 x 250 x 200 = 2.4 * 10^6 BM runs at toy size, comfortably under a
      core-day. STEP 3 is 10^7 ring multiplications per (n, h) cell, a few
      core-hours. No quantum simulation, no QRAM model, no cryptographic-scale
      run. Total: well under one core-week.

  recommended_priority: high
