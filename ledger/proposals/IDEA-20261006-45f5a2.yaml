idea:
  id: IDEA-20261006-45f5a2
  question_id: RQ-SCURVE-df94be
  added: '2026-10-06'
  status: approved
  approved_by: DEC-20261006-af8214
  title: Exact degree-bounded weighted CM relation census in the valid P-192 isogeny class
  class: measurement
  claim: >-
    Exhaustively enumerate canonical conjugacy representatives generated by
    ramified primes 5,11,31 and split primes 13,23,37,43,73,89,101,103,107,113
    whose integral relation norm L=product ell^|e_ell| is at most 2^48.
    Verify every identity by reduced-form composition and an independent ideal
    HNF replay, then determine whether any non-scalar relation can be oriented,
    constructed, evaluated, and charged cheaply enough to change a P-192 attack
    cost. The expected exact census is 4,974,348 canonical vectors including zero.
  mechanism: >-
    P-192 has ordinary CM order of discriminant
    -24109379060336110122544161233113975664949272517896865359515 if the
    frozen order, cofactor-primality, squarefreeness, and conductor-one checks
    succeed. Split/ramified prime ideals act through the class group. A short
    principal relation may close a walk algebraically, but only globally
    Frobenius-oriented kernels and explicit maps turn that identity into an
    evaluable operation. The contract therefore separates exact algebra,
    orientation, construction, evaluation, and end-to-end payoff gates.
  novelty_status: speculative
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp/generic-rho
    rows_checked:
      - KR-RHO-6239aa
      - KR-RHO-825bca
    nearest:
      - ref: KN-LIT-3339
        provenance: kb
        relation: adjacent
        delta: >-
          Class-group computations are known in isogeny protocols; this audit
          instead fixes the ordinary P-192 endomorphism order, an exact
          degree-norm box, and an explicit ECDLP payoff rejection gate.
      - ref: KN-LIT-973
        provenance: kb
        relation: adjacent
        delta: >-
          Binary-quadratic-form correspondences are used as an independently
          checked representation, not as evidence that a relation is an attack.
      - ref: KR-RHO-6239aa
        provenance: internal
        relation: adjacent
        delta: >-
          The charged relation/map pipeline must beat or alter the applicable
          generic-rho baseline; algebraic closure alone has delta zero.
  predictions:
    - metric: canonical_vector_count_in_exact_norm_box
      direction: different
      minimum_effect: 4,974,348 including zero and 4,974,347 nonzero, or the run is invalid.
    - metric: verified_non_scalar_buildable_relations_with_end_to_end_benefit
      direction: higher
      minimum_effect: At least one is required for a valid-isogeny weakness assertion.
    - metric: prior_unweighted_relation_check
      direction: different
      minimum_effect: No extra relation through word radius 16 inside the frozen generator set.
  minimal_test:
    design: >-
      Natively certify the P-192 order and CM discriminant, build the frozen
      oriented generator table, enumerate every canonical vector under L<=2^48,
      verify collisions/principal forms independently, reproduce the radius-16
      check, calibrate deterministic HOT/COLD operation tuples, and attempt
      oriented-map replay only for surviving candidates.
    controls:
      - D=-23 with g2^3 and alpha=(3+sqrt(-23))/2 of norm 8
      - P-192 ramified-square scalar relations g5^2, g11^2, and g31^2
      - symbolic P-192 relation g5*g11*g31*gC=1, kept outside the buildable generator set
      - zero, inverse, and immediate dual-backtrack exclusions
      - corrupted exponent, root, discriminant, certificate, and map rejection
      - toy explicit-root Velu map versus kernel-polynomial map
    required_metrics:
      - exact oriented and canonical vector counts and boundary digest
      - relation class, reduced form, exponent vector, alpha, norm, lambda, and HNF residual
      - raw HOT and COLD operation tuples and separately identified Q32 ranking scalar
      - map construction/evaluation availability, costs, and end-to-end payoff inequality
  falsification_conditions:
    - The exact vector count or independent ideal replay differs from the frozen result.
    - A relation marked buildable lacks globally consistent Frobenius orientation or explicit map replay.
    - A claimed weakness fails to improve the fully charged applicable attack baseline.
  interpretation_limits:
    - A zero hit means NO_WEAKNESS_FOUND_WITHIN_SCOPE only for this generator/norm box.
    - An abstract form relation without oriented kernels and point maps is candidate-only.
    - The degree-linear Velu proxy is explicitly uncalibrated and is not wall time or attack cost.
    - The symbolic C-degree relation is a positive algebra/cost-rejection control, not a weakness.
  target_complexity:
    time_exponent: No improvement claimed before an end-to-end candidate passes every gate.
    memory_exponent: Finite exact search capped at 5,000,000 canonical states.
    best_known: Parallel generic rho on the prime-order P-192 group remains the comparison baseline.
    hidden_overhead: Kernel construction, orientation, maps, endpoint isomorphisms, verification, serialization, and preprocessing are charged.
    tradeoff_note: HOT and COLD tuples are both retained; clock time is diagnostic only.
  estimated_cost:
    implementation: high
    compute: medium
  recommended_priority: high
  source_refs:
    - RQ-SCURVE-df94be
    - KN-LIT-3339
    - KN-LIT-973
    - KR-RHO-6239aa
    - KR-RHO-825bca
