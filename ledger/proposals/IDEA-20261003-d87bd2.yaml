# IDEA-20261003-d87bd2
# Multiplication-degree count. Proposal only. Not approved.
idea:
  id: IDEA-20261003-d87bd2
  question_id: RQ-JINV-8fc13a
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    Multiplication by 12 has degree 144 and multiplication by 11 has degree 121
  class: measurement
  claim: >-
    Multiplication by 12 has degree 144. Multiplication by 11 has
    degree 121. One hundred forty-four exceeds one hundred twenty-one
    by 23. The product of the two degrees is 17424. Their sum is 265.
    The gap is a map degree, not an ECDLP exponent and not the degree
    pair 121 and 100.
  mechanism: >-
    OBJECT FRAME. R3 is the multiplication endomorphism. The
    operation set is reading the degree, which is coordinate-dependent
    on the integer multiplier and is not a translation of a curve
    point. Twelve squared is 144. Eleven squared is 121. Two maps of
    degree 121 have gap 0 and product 14641. No point is mapped.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question treats End(E) as a ring and asks for any
        advantage beyond the automorphism discount.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-IC-f5c584
      provenance: internal
      claim: >-
        A first-fall degree of 2 is a different object from these
        two multiplication degrees.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The multipliers 12 and 11 are frozen before the squares are taken.
    - No point is mapped.
  proof_search_map:
    bottleneck: The degree gap 23.
    baseline_embedding:
      parameter_slice: The degrees 144 and 121.
      reproduction_check: >-
        Two readers must agree that 12 squared is 144 and that 11
        squared is 121.
    observation_collision:
      observable: The degree gap and the product.
      distinct_preimage_search: >-
        Reporting both degrees as 121 drops the gap. Two maps of
        degree 121 make that gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The degrees 144 and 121.
        predicted_gain: Integer gap. No mapping of a point.
    quantifier_order: >-
      The multipliers are fixed before the degrees.
    method_ceiling:
      strongest_certifiable_claim: >-
        The degrees 144 and 121. Not the degree pair 121 and 100.
      nearby_object_control: >-
        Two maps of degree 121. The gap is 0 and the product is 14641.
    proof_obligations:
      - claim: Multiplication by 12 has degree 144.
        responsibility: size
      - claim: Multiplication by 11 has degree 121.
        responsibility: size
      - claim: The gap is not the degree pair 121 and 100.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: degree_gap
      direction: different
      minimum_effect: One hundred forty-four exceeds one hundred twenty-one by 23.
  minimal_test:
    design: >-
      Square 12 and square 11, then subtract 121 from 144. Do not
      map a curve point.
    controls:
      - Two maps of degree 121, whose gap is 0.
      - An independent count.
    required_metrics:
      - both degrees
      - the gap
      - the product
  falsification_conditions:
    - The degree of multiplication by 12 is not 144.
    - The product of the two degrees is not 17424.
  confounders:
    - The degree pair 121 and 100 belongs to multipliers 11 and 10.
  interpretation_limits:
    - A map degree is not a walk length.
    - No transfer to a cryptographic endomorphism.
    - This is not the degree pair 121 and 100.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen multiplication by 12 has degree 144, and the
        frozen multiplication by 11 has degree 121.
      rigorous_support: >-
        No endomorphism theorem is re-proved here. The count is a
        reading of two squares.
      validation_plan: >-
        Two independent squares. A mismatch voids the gap.
