      1. (a) 10^4 random curves over each of 2^255 - 19, 2^256 - 2^32 - 977, and five random 256-bit primes; compute k for the large prime factor of N; compare distributions (KS test).
      2. (b) CADO-NFS polyselect with a fixed 24 CPU-h budget vs the special pair; report Murphy-E, log-norm sizes over the sieving region, and the L_p(1/3) constants 32/9 vs 64/9. No sieving.
      3. (c) one exact computation of ord_l(p).
