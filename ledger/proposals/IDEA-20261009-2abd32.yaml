  title: |-
    The only existing SNFS for ECDLP is pairing transfer; special p helps only the multiplicative side
  class: measurement
  claim: |-
    (a) the embedding-degree distribution of random curves over pseudo-Mersenne p is indistinguishable from random p (k about l); (b) for p = 2^255 - 19 the special pair (x^5 - 19, x - 2^51) beats the best GNFS polynomial CADO-NFS finds in a fixed budget by a large factor in Murphy-E and norm size; (c) ord_l(p) for Curve25519's l exceeds l/4.
  mechanism: |-
    MOV / Frey-Rueck maps E(F_p)[l] into F_{p^k}^*. If p = P(u) with small u, Joux-Pierrot / Kim-Barbulescu special polynomial selection applies (what cut BN254 to about 100 bits). p = 2^255 - 19 is P(u) = u^5 - 19 at u = 2^51, so F_p^* is SNFS-friendly; the curve is unaffected because its embedding degree is huge.
  novelty_status: unverified
