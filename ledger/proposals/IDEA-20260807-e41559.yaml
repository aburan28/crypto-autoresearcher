idea:
  id: IDEA-20260807-e41559
  question_id: RQ-MTGT-2cabee
  added: '2026-08-07'
  title: >-
    IS "MANY TARGETS ON DIFFERENT CURVES IN THE SAME ISOGENY CLASS" A THREAT
    MODEL WITH ANY INSTANCE AT ALL? An audit whose first finding is already
    rigorous and negative -- the one second curve deployments DO publish, the
    quadratic twist, has trace -t and is therefore NEVER in the same class for an
    ordinary curve -- and whose deliverable is an explicit affected-versus-safe
    scope split that this lane must carry on every result it produces
  class: measurement

  claim: >-
    (A) THE QUESTION, ASKED HONESTLY BECAUSE THE ANSWER IS PROBABLY NO. Lane L13
    can show that one preprocessing table serves an entire F_p-isogeny class
    (IDEA-20260807-a127ab). That statement is worth exactly as much as the threat
    model it presupposes: an attacker facing M targets spread over M DISTINCT,
    PUBLICLY KNOWN, MUTUALLY ISOGENOUS curves over the same prime field. If no
    deployed or standardised system ever puts two isogenous curves in an
    attacker's hands, the amortisation is a true theorem about an empty set, and
    saying so plainly is a deliverable rather than a defect. This record exists
    so that no downstream summary can quietly assume the model.

    (B) THE FIRST FINDING IS RIGOROUS AND COSTS NOTHING, AND IT KILLS THE MOST
    OBVIOUS CANDIDATE. The one "second curve" that real deployments genuinely do
    publish alongside E is its QUADRATIC TWIST E^d, because twist-security is a
    stated design goal of Montgomery-ladder systems: a system that accepts
    x-coordinates without validation effectively also offers the twist. But for
    E/F_p with trace t, the quadratic twist has trace -t (since
    #E + #E^d = 2p + 2). By Tate, two curves over F_p are F_p-isogenous exactly
    when their traces are equal. So E and E^d lie in the same isogeny class if
    and only if t = -t, i.e. t = 0, i.e. E is SUPERSINGULAR. Every ordinary
    prime-field curve in this program's target family has t != 0. THEREFORE THE
    QUADRATIC TWIST IS NEVER IN THE SAME F_p-ISOGENY CLASS, and the transport
    theorem T1 does not connect a curve to its twist. This is an elementary
    argument, it is decisive, and it removes the only ubiquitous multi-curve
    deployment pattern from the lane's affected scope before any compute is
    spent.

    (C) WHAT REMAINS TO BE AUDITED, AS A FINITE CHECKABLE LIST. The audit
    enumerates every publicly standardised prime-field curve this program tracks
    -- NIST P-192/224/256/384/521, secp256k1 and the SEC families, the Brainpool
    families, Curve25519/Ed25519, Curve448/Ed448, the FRP256v1 and SM2 curves,
    and the pairing-friendly BN/BLS families -- and for each PAIR asks the only
    two questions that matter:
      Q1. Same prime field p? (necessary; almost all pairs fail here)
      Q2. If same p, same trace t? (necessary and sufficient for F_p-isogeny)
    Both are read directly from published parameters (p and #E give t = p+1-#E)
    and require no computation beyond subtraction. PRE-REGISTERED EXPECTATION:
    ZERO pairs pass Q1 and Q2. The audit is falsifiable in the interesting
    direction: a single passing pair would be a genuinely useful discovery and
    would give lane L13 its first real instance.

    (D) THE FOUR CANDIDATE SOURCES OF MULTIPLE ISOGENOUS CURVES, AND WHY THREE
    ARE OUT OF SCOPE. Recorded so the audit does not conflate them:
      (i) MODEL CHANGES. Curve25519 (Montgomery) and Ed25519 (twisted Edwards)
        are related by a birational map. A birational equivalence of elliptic
        curves is an ISOMORPHISM, i.e. an isogeny of degree 1, so it changes the
        MODEL and not the curve. Transport by a degree-1 map is a relabelling of
        the same object, buys nothing, and is exactly the ell = 1 positive
        control of IDEA-20260807-0e8977 rather than an instance of the threat
        model. WHETHER THE PUBLISHED Ed25519/Curve25519 RELATION IS EXACTLY
        DEGREE 1 OR INVOLVES A SMALL-DEGREE ISOGENY IS MARKED [open] AND IS ONE
        OF THE AUDIT'S EXPLICIT CHECKS -- this record does not assert it from
        memory.
      (ii) ISOGENY-BASED PROTOCOLS (CSIDH, SIDH/SIKE, SQIsign, CSI-FiSh) publish
        many isogenous curves BY DESIGN. They are out of scope twice over: they
        are supersingular or work over F_{p^2}, and their security problem is
        the class-group action or path-finding, not the ECDLP on a prime-order
        subgroup. Transport says nothing about them and they say nothing about
        this lane. Recorded so no one is tempted to import them as an instance.
      (iii) FAULT AND INVALID-CURVE ATTACKS move a computation onto a DIFFERENT
        curve, which is a genuine multi-curve setting -- but the curve reached is
        the one produced by the fault, which generically has a different order,
        hence a different trace, hence a different class. The attacker there
        wants a WEAK curve, not an ISOGENOUS one. Out of scope, and the reason is
        worth recording because "attacks that touch two curves" is otherwise a
        tempting false positive.
      (iv) SELF-CHOSEN CLASSES. An attacker may generate as many isogenous
        curves as they like. This is the only setting where M > 1 is trivially
        available, and it is worthless: the attacker has no target on any of
        them. The amortisation is over CURVES, and targets are not attacker-
        supplied.

    (E) THE DELIVERABLE IS THE SCOPE SENTENCE. The audit's output is a single
    reusable paragraph that every L13 record must carry:
      AFFECTED SCOPE: systems that publish two or more mutually F_p-isogenous
      prime-field curves with the same prime-order subgroup and place targets on
      more than one of them. Instances known to this audit: [to be filled by the
      audit; pre-registered expectation is NONE].
      SAFE SCOPE: every standardised prime-field curve listed above, considered
      singly; and, rigorously by (B), every ordinary curve considered together
      with its quadratic twist.
    A scope sentence with an empty affected set is a complete and honest result.

  resource_label: >-
    audit: consumes no resource. This record consumes no R1-R8 resource because
    it mounts no attack and computes nothing about any group; it audits whether a
    threat model that OTHER records in this lane presuppose has any instance.

  admissibility: admissible

  admissibility_argument: >-
    The admissibility filter of DECOMPOSITION.md section 2 closes lanes that
    claim an advantage from a GGM-simulable resource. This record claims no
    advantage of any kind, so the filter does not apply; it is admissible in the
    same sense as lane L12 (RQ-GGMB-6eaabc), which likewise consumes no resource
    and exists to constrain the other lanes. The record does, however, carry the
    filter's SPIRIT into a new place: just as L12 asks "is your oracle
    simulable", this record asks "does your threat model have an instance", and
    a negative answer is as decisive a closure as simulability. Both are cheaper
    than running anything.

  discriminated_from:
    - >-
      IDEA-20260807-a127ab -- proves the amortisation and computes its cost.
      This record asks whether anyone is ever in a position to suffer it. The two
      are complementary and neither substitutes for the other; a127ab's
      interpretation_limits explicitly defers this question here.
    - >-
      Lane L8 (RQ-PAIR-21313f) -- also a scoping lane, asking which CM families
      have small embedding degree and whether any standard curve is near them.
      Same genre of deliverable (an affected-versus-safe split read from
      published parameters), different property. This record borrows that lane's
      shape deliberately.
    - >-
      The twist-security literature -- that literature asks whether the TWIST is
      cryptographically strong. This record asks the orthogonal question of
      whether the twist is ISOGENOUS, and answers it rigorously in the negative
      for ordinary curves. The two questions have been conflated informally in
      this program's scratch material and separating them is part of the value.
    - >-
      DECOMPOSITION.md T4 -- "fixing the class fixes t, hence fixes p, N,
      #E(F_p), the embedding degree, the CM field K and D". This record is the
      operational consequence of T4 applied to published parameter sets: T4 says
      the trace is the class label, so the audit is a trace comparison and
      nothing more.

  object_first_candidate:
    tracked_object: >-
      THE TRACE t = p + 1 - #E, treated as the CLASS LABEL of a published
      parameter set. Followed across the finite list of standardised curves.
    lossiness: >-
      Maximally lossy for a curve: (p, a, b, G, n, h) collapses to a single
      integer t. Everything about the curve except its isogeny class is
      forgotten -- the model, the j-invariant, the generator, the cofactor, the
      endomorphism-ring level.
    propagation: >-
      LOSSY-PROJECTION TEST, RUN AND PASSED. t is EXACTLY the invariant that
      F_p-isogeny preserves (Tate) and it is preserved by nothing else about the
      presentation: two curves share t if and only if they are F_p-isogenous.
      What t discards -- the model, the coordinates, the j-invariant -- is
      discarded compatibly with the operation "walk to an isogenous curve",
      because that operation does not move t. And t is NOT a change of
      coordinates: it strictly loses information (many curves share a trace).
      This is the cleanest passing instance of the test in the whole lane, which
      is worth noting precisely because the record that carries it claims nothing.
    survival_score: >-
      Survives every isogeny, every model change, every coordinate change and
      every choice of generator. Dies under a change of base field (t is
      p-specific) and under a twist (t -> -t), which is exactly the finding in
      claim (B).

  mechanism: >-
    STEP 1 -- BUILD THE TABLE. For each standardised prime-field curve in the
    declared list, record (name, p, #E, n, h, t = p + 1 - #E) from its published
    specification. Source every number to a citable document; a parameter that
    cannot be sourced is recorded as MISSING, never as estimated.
    STEP 2 -- Q1 PASS. Group by p. Report the size of each group. Expected: all
    groups of size 1 except where a family deliberately reuses a prime.
    STEP 3 -- Q2 PASS. Within any group of size > 1, compare traces. A pair with
    equal p and equal t is an F_p-isogenous pair and is the audit's positive
    finding.
    STEP 4 -- TWIST CHECK, ALREADY ANSWERED ANALYTICALLY. For each curve, record
    t and -t and confirm t != 0 (ordinariness). This makes claim (B) a per-curve
    recorded fact rather than a general assertion.
    STEP 5 -- MODEL-RELATION CHECK. For the declared Montgomery/Edwards pairs,
    determine from the published specifications whether the stated relation is a
    birational isomorphism (degree 1) or an isogeny of degree > 1, and record
    which. THIS IS MARKED [open] IN THIS RECORD AND IS RESOLVED BY THE AUDIT, NOT
    BY MEMORY.
    STEP 6 -- RANDOM-COINCIDENCE NULL. Generate a matched set of RANDOM curves at
    the same primes and count how often two of them share a trace. For random
    curves over F_p the trace is distributed over an interval of length
    4*sqrt(p) with the Sato-Tate-like density, so two random curves collide in
    trace with probability ~1/(4 sqrt(p)) up to the density factor. At p ~ 2^{256}
    that is ~2^{-129}: the audit's expected finding of ZERO isogenous pairs among
    standardised curves is therefore NOT evidence of deliberate avoidance, it is
    what chance predicts. Recording this prevents the audit from over-reading its
    own null.
    STEP 7 -- WRITE THE SCOPE SENTENCE of claim (E) with the affected set filled
    in from Steps 3 and 5.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Run 2026-08-07. Commands:
      (1) grep -rin "twist" knowledge/ ledger/ docs/
      (2) grep -rin "affected.{0,10}scope\|safe scope" docs/ knowledge/
      (3) grep -rin "same trace\|Tate.{0,20}isogen" analysis/ knowledge/
      (4) read of DECOMPOSITION.md T2/T4.
    results: >-
      (1) Twist material exists in the program (twist-security appears in scoping
      notes and in RQ-JMV-001's exclusion list "No supersingular, twist, or
      invalid-curve instances"), but NO record states that an ordinary curve and
      its quadratic twist are in DIFFERENT isogeny classes, which is claim (B).
      (2) The affected-versus-safe split is a required element of the target
      result profile (AGENTS.md, "Cost and scope honesty") and appears in several
      records as a requirement; no record supplies one for the multi-curve
      preprocessing model.
      (3) DECOMPOSITION.md T2/T4 state class-wide vulnerability and that t is the
      class label; the operational audit of published parameter sets against that
      label is absent.
      NO EXTERNAL LITERATURE CHECK WAS PERFORMED for the question "does any
      standard names two isogenous prime-field curves", which is why the verdict
      below is UNVERIFIED and not NOVEL.
    verdict: >-
      UNVERIFIED. The corpus contains no equivalent audit and claim (B) is not
      recorded anywhere in it, but no external search was run and the negative
      expectation in claim (C) is a hypothesis about the standards landscape, not
      a checked fact. Per agents/idea-generator.md, an unchecked literature
      position is recorded as `unverified` rather than as novel. The audit itself
      is what converts this to a checked status.

  null_object_control: >-
    MANDATORY: the RANDOM-COINCIDENCE NULL of Step 6. A matched set of randomly
    generated curves at the same primes, in the same numbers, with trace-sharing
    counted identically. Without it, "zero isogenous pairs among standards" would
    be reported as a property of standards when it is a property of arithmetic.
    DECAY PARAMETER: the number of curves audited, K. The chance rate of at least
    one isogenous pair grows like K^2 / (8 sqrt(p)); the audit must report, for
    its actual K and p, the probability that a null set of the same size shows
    zero pairs. If that probability is close to 1 -- which it will be -- the
    audit's negative carries LOW POWER and must be reported as low-power, not as
    a demonstration that standards avoid isogenous curves.
    SECOND NULL, FOR THE INSTRUMENT: seed the table with a DELIBERATELY PLANTED
    isogenous pair (a toy curve and an explicitly constructed 2-isogenous
    classmate, with their true traces). The audit pipeline must FIND it. An audit
    that cannot find a planted pair has not demonstrated it could find a real one
    and its zero is void.

  assumptions:
    - >-
      Two curves over F_p are F_p-isogenous if and only if #E = #E' (Tate's
      isogeny theorem for elliptic curves over finite fields). This is the
      audit's entire decision rule and it is a theorem, not a heuristic.
    - >-
      #E + #E^d = 2p + 2 for a curve and its quadratic twist over F_p, hence
      t^d = -t. Elementary and standard.
    - >-
      Published parameter sets are read as published. No parameter is inferred,
      recomputed from a partial specification, or taken from memory; a parameter
      without a citable source is recorded MISSING. This is the record's single
      most important discipline because the audit's whole output is a table of
      cited numbers.
    - >-
      The relation between published Montgomery and Edwards forms of the same
      named curve is [open] in this record and is resolved by Step 5 from the
      specifications.
    - >-
      The audit covers PUBLISHED standards only. It cannot see proprietary or
      internal parameter sets and does not claim to; the safe-scope sentence is
      scoped to the audited list.

  proof_search_map:
    not_applicable_reason: >-
      Predominantly an audit of published parameters, not a proof-oriented
      proposal. The one deductive element -- claim (B), that an ordinary curve
      and its quadratic twist are never F_p-isogenous -- is a two-line
      consequence of Tate's theorem and #E + #E^d = 2p + 2, is stated in full in
      the claim, and carries no bottleneck, no quantifier subtlety and no method
      ceiling beyond "it is about ordinary curves over prime fields". Recorded
      rather than omitted per docs/inventor-protocol.md section 8.

  predictions:
    - metric: number of (curve, curve) pairs in the audited list sharing both p and t
      direction: lower
      minimum_effect: >-
        ZERO, pre-registered. A single nonzero pair falsifies the expectation and
        is the audit's most valuable possible outcome: it would give lane L13 a
        real instance and would change every scope sentence in the lane.
    - metric: number of audited curves with t = 0 (supersingular)
      direction: lower
      minimum_effect: >-
        ZERO among the ordinary prime-field standards. A nonzero count would mean
        a standard curve is supersingular, which is already excluded by MOV and
        would indicate a data error in the table rather than a discovery.
    - metric: probability that a size-matched random null shows zero trace-sharing pairs
      direction: higher
      minimum_effect: >-
        Above 0.99 at the audited K and p, which means the audit's zero is
        LOW-POWER and must be reported as such. If the null probability were
        below 0.5 the zero would carry real information; it will not.
    - metric: planted-pair detection
      direction: higher
      minimum_effect: >-
        1.000. The pipeline must find every planted isogenous pair. A miss voids
        the audit.
    - metric: number of published Montgomery/Edwards relations that are isogenies of degree > 1
      direction: different
      minimum_effect: >-
        Reported as a count with per-curve citations. Marked [open] in advance;
        any nonzero count is an instance of a DEGREE-1-ADJACENT multi-model
        setting and must be classified per claim (D)(i) rather than counted as a
        threat-model instance.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, ALREADY DONE IN THIS RECORD): claim (B). The
      quadratic twist is out of the class for every ordinary curve. This alone
      answers the most common intuition about "two curves a deployment gives
      you" and costs nothing.
      STAGE 1 (an hour, no compute beyond subtraction): build the (name, p, #E,
      t) table with citations, group by p, compare traces. This IS the audit.
      STAGE 2 (minutes): the random-coincidence null and the power statement.
      STAGE 3 (minutes): the planted-pair instrument check on toy curves.
      STAGE 4 (reading): Step 5's model-relation determination from published
      specifications, with every finding cited.
      STAGE 5 (zero compute): write the scope sentence.
    controls:
      - random-coincidence null at matched K and p (power statement)
      - planted isogenous pair on toy curves (detection check)
      - supersingularity check t != 0 per curve (data-integrity check)
      - MISSING-parameter accounting: every unsourced number reported, never estimated
    required_metrics:
      - the full (name, p, #E, n, h, t) table with a citation per row
      - count of pairs sharing p; count of pairs sharing p and t
      - the null probability of zero pairs at the audited K and p
      - planted-pair detection outcome
      - count of rows with MISSING parameters
      - the final affected/safe scope sentence

  falsification_conditions:
    - >-
      A pair of standardised prime-field curves shares p and t. The
      pre-registered expectation is falsified and lane L13 acquires an instance.
      This must be independently verified from primary specifications before it
      is reported, since the most likely cause is a transcription error.
    - >-
      The planted-pair check fails. The audit pipeline cannot detect what it
      claims to detect; the zero is void.
    - >-
      More than a small number of rows are MISSING parameters. The audit's
      coverage is then too thin to support a safe-scope sentence and the sentence
      must be scoped to the rows actually filled.
    - >-
      The random-coincidence null shows that a size-matched random set would ALSO
      almost always show zero pairs -- which is expected. This is NOT a
      falsification; it is the reason the audit's negative must be reported as
      low-power, and reporting it as strong evidence of deliberate avoidance
      would be the over-read this record exists to prevent.

  confounders:
    - >-
      COFACTOR CONFUSION. The class is fixed by #E(F_p), not by the prime-order
      subgroup n. Two curves at the same p with the same n but different
      cofactors have different #E and are NOT isogenous. The table must record
      both n and h and the comparison must use #E = n*h.
    - >-
      FAMILY PARAMETERS. Pairing-friendly families (BN, BLS) are defined by a
      polynomial in a seed, so two curves from the same family have different p
      and cannot be isogenous. Recording them is still worthwhile because the
      question "does any family instantiate twice at the same p" has a definite
      answer.
    - >-
      MODEL VERSUS CURVE. A named curve given in two models is one curve. Counted
      once, and the model relation classified in Step 5.
    - >-
      EXTENSION-FIELD AND SUPERSINGULAR CURVES. Out of scope by construction; the
      table must not mix them in, since their trace arithmetic differs and they
      would create spurious matches.
    - >-
      PUBLICATION BIAS IN THE AUDITED LIST. Auditing only the curves this program
      already tracks could miss a niche standard that does publish isogenous
      curves. The list must be declared in advance and its selection criterion
      stated, and the safe-scope sentence scoped to it.

  interpretation_limits:
    - >-
      A zero finding is LOW POWER and says nothing about whether standards
      deliberately avoid isogenous curves; chance alone predicts zero. The audit
      may report "no instance found in the audited list", never "standards are
      designed to prevent this".
    - >-
      The audit cannot see unpublished, proprietary or future parameter sets.
      Its safe-scope sentence is scoped to the audited list and to the audit date.
    - >-
      Claim (B) about twists is rigorous and general for ORDINARY curves over
      PRIME fields. It does not extend to supersingular curves (t = 0, where the
      twist IS in the class) or to extension fields, and the record says so.
    - >-
      A positive finding would give L13 an instance but would NOT give it an
      attack: IDEA-20260807-a127ab's delta against every attack baseline is zero
      regardless of how many isogenous curves exist.

  reachability_gate: >-
    NOT APPLICABLE IN THE COMPUTATIONAL SENSE, AND THAT IS THE POINT WORTH
    RECORDING. This lane's other records must reach a specified classmate at
    p^{1/4+o(1)} (see IDEA-20260807-a127ab's gate). This record asks the prior
    question of whether a classmate WITH A TARGET ON IT EXISTS AT ALL. If the
    audit returns zero, the reachability gate of every other L13 record becomes
    moot -- not because the walk is too expensive, but because there is nowhere
    worth walking to. That is a stronger and cheaper form of closure than a cost
    argument, and this record is the only one in the lane that can deliver it.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT. The audit's own cost is O(K^2) integer comparisons for
      K audited curves, i.e. milliseconds. No algorithm is produced.
    memory_exponent: >-
      O(K) rows. Negligible.
    best_known: >-
      Unchanged: parallel rho at 0.886*sqrt(N) with O(1) memory (KN-TECH-001,
      KN-TECH-006), automorphism-discounted on CM curves (KN-TECH-018), BSGS at
      sqrt(N) time and memory with N^{2/3+o(1)} full cost (KN-TECH-031,
      KN-TECH-035), Bernstein-Lange preprocessing at S = T = N^{1/3} on the
      Corrigan-Gibbs--Kogan frontier (KN-LIT-013, KN-TECH-005), Kuhn-Struik
      multi-target rho at sqrt(M*N).
    hidden_overhead: >-
      None in the audit. The hidden cost is in what the audit CONSTRAINS: a
      downstream record that quotes L13's factor-M amortisation without the scope
      sentence is hiding an empty affected set behind a true theorem, and this
      record exists to make that impossible.
    tradeoff_note: >-
      Not applicable -- no algorithm. Recorded because the field is required.

  dominated_by: >-
    AS AN ATTACK: mounts none. Dominated on every axis by every row of the
    prime-field frontier: parallel rho (0.886*sqrt(N) time, O(1) memory), the
    automorphism-discounted variant on CM curves, BSGS (sqrt(N) time and memory,
    N^{2/3+o(1)} full cost), Bernstein-Lange preprocessing (N^{1/3}/N^{1/3}), and
    Kuhn-Struik multi-target rho (sqrt(M*N), negligible memory). Checked across
    time, memory and data/queries.
    AS A SCOPING INSTRUMENT: no incumbent exists in this corpus -- the novelty
    screen found no affected/safe split for the multi-curve preprocessing model,
    so there is nothing to be dominated by. Lane L8's embedding-degree scoping is
    the nearest analogue and dominates this record on maturity only.
  sota_delta: >-
    ZERO against every attack baseline; an audit produces no speedup. Scoping
    delta, quantitatively: converts 1 presupposed threat model into a table of K
    audited curves with 2 decision predicates (same p, same t); establishes 1
    rigorous exclusion (an ordinary curve and its quadratic twist are never
    F_p-isogenous, since t = -t forces t = 0) that removes the single most
    common multi-curve deployment pattern from the affected set at zero cost;
    and attaches 1 power statement to the expected zero so it cannot be
    over-read.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    1.00 that claim (B) holds -- it is two lines of standard theory. 0.90 that
    the audit returns ZERO isogenous pairs among standardised prime-field curves;
    the residual 0.10 is genuine, because niche or regional standards were not
    searched and the novelty screen recorded no external check, which is exactly
    why novelty_status is `unverified`. 0.85 that the audit's zero is low-power
    by the random-coincidence null, which will make the honest headline "no
    instance found, and chance alone predicts none" rather than "standards avoid
    this". Ranked medium rather than high because the expected finding is
    negative and constrains rather than advances -- but it is the record that
    keeps the rest of the lane honest, and a positive finding here would be the
    most valuable single outcome available to L13.

