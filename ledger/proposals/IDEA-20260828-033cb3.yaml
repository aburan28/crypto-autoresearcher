idea:
  id: IDEA-20260828-033cb3
  question_id: RQ-MLKEM-002
  added: '2026-08-28'
  title: >-
    Call-site specialization: does a single source-level comparison symbol
    fracture into distinct per-call-site silent sets under LTO/inlining,
    and does that undermine -25d3ca's "the shared routine transitively
    covers both sites" argument
  class: measurement

  claim: >-
    (A) THE TWO OPEN THREADS THIS RECORD CONNECTS. IDEA-20260821-121612
    measured whether a FIXED comparison symbol's stride and coverage are
    well defined across TOOLCHAIN CONFIGURATIONS (compiler, optimization
    level, -march), holding the call site fixed at one standalone
    translation unit, and explicitly named what it did not do: "LINK-TIME
    OPTIMISATION AND CALL-SITE SPECIALISATION... The stride in the
    standalone object file need not be the stride in the linked library...
    a declared limitation, not an oversight." IDEA-20260821-25d3ca
    separately asked, for the encapsulation modulus-check site, whether its
    comparison routine is "the SAME SYMBOL... as the one the decapsulation
    re-encryption comparison calls", and made the answer's two branches
    load-bearing: "SHARED: the lane's decapsulation-site gate transitively
    covers the encapsulation site... at zero additional instrument cost."
    That transitivity claim is a claim about SOURCE-LEVEL symbol identity
    implying SHARED DEFECT SURFACE. It is unaudited: neither record asks
    whether a compiler, given ONE shared symbol called from TWO OR MORE
    call sites within the same linked binary, can produce TWO OR MORE
    DISTINCT MACHINE BODIES for it -- which would mean a "shared routine"
    verdict at the source level does not, by itself, license the
    transitivity -25d3ca's own decision rule depends on.
    (B) THE MECHANISM THAT MAKES THIS A LIVE QUESTION, NOT A HYPOTHETICAL.
    Under link-time optimization (LTO) or ordinary single-translation-unit
    inlining, a compiler is permitted -- and in practice frequently chooses
    -- to generate a SEPARATE specialized body of an inlined or cloned
    function per call site, particularly when the call site supplies a
    compile-time-constant length argument that differs from another call
    site's, or when register allocation pressure differs at each call
    site's surrounding code. IDEA-20260821-121612 already demonstrated (via
    an attributed, unreproduced red-team compile observation it explicitly
    flags as not self-verified) that a SINGLE call site's compiled stride
    varies across compilers at fixed source; this record's question is the
    orthogonal one: HOLDING THE TOOLCHAIN FIXED, does a SINGLE COMPILED
    BINARY'S handling of one symbol vary ACROSS its own call sites. Both
    axes are compiler behavior the lane has never measured in combination.
    (C) THE OBJECT: PER-CALL-SITE COVERAGE, NOT PER-SYMBOL COVERAGE. For a
    comparison or select symbol invoked at K >= 2 distinct call sites within
    one linked artifact (built at one fixed toolchain configuration), this
    record tracks the map `call_site -> (w_source, coverage_set)` using
    IDEA-20260821-121612's own frozen v2 extractor applied separately at
    each call site's resolved code (whether that is one shared function
    body reached by K call instructions, or K distinct specialized bodies
    produced by cloning/inlining). The discriminating question is whether
    this map is CONSTANT across call sites (source-level sharing survives
    to the binary, licensing -25d3ca's transitivity) or VARIES (source-level
    sharing does not survive; each call site must be independently audited,
    and a "shared routine" census answer of the kind -25d3ca sought is
    insufficient on its own to close the isolation-versus-systemic
    question at a second site).
    (D) A CONCRETE, RETRIEVED CANDIDATE FOR THE POPULATION. PQClean
    ml-kem-1024/avx2 (pinned commit 10738d92323117d84bb6202c85722ddfd96dc1d4,
    retrieved this session) contains at least two structurally similar
    comparison-family primitives in one package -- `verify` (called once,
    at the ciphertext-comparison site) and `cmov` (called once, at the
    shared-secret-selection site) -- which are DIFFERENT symbols and
    therefore not a call-site-sharing case by themselves, but establish
    that this codebase is a legitimate, already-partially-audited target
    for the census this record proposes, and that at least ONE symbol
    (`verify`, if a future fix or a different backend reuses it at a
    second call site, e.g. a self-test harness invoking it directly) is a
    plausible candidate for genuine multi-call-site testing once such a
    second call site is confirmed to exist by source reading, per Stage 0
    below. Where no implementation with a genuinely shared, multi-call-site
    symbol is found within budget, this record reports that as the honest,
    reportable outcome (population size 0 on the fetched set), exactly as
    IDEA-20260821-121612 reported its own two-routine population honestly
    rather than inflating it.
    (E) WHAT IS NOT CLAIMED. No attack, no oracle, no exploitation path, no
    attack-cost estimate, no timing/power/EM/cache/fault measurement, no
    statement about MLWE hardness or ML-KEM security at any parameter set.
    No claim that any implementation's shared routine actually specializes
    per call site -- that is exactly the open, two-sided question this
    record poses. No claim about -25d3ca's own encapsulation/decapsulation
    pair specifically unless a genuine second call site of ITS shared
    symbol is confirmed to exist by source reading; this record's claim is
    about the GENERAL soundness of the "shared symbol implies shared defect
    surface" inference step, using whatever genuinely multi-call-site
    population can be found. Any newly observed conformance defect
    escalates to the coordinator per RQ-MLKEM-002 and is published by no
    agent.

  mechanism: >-
    STAGE 0 -- FIND A GENUINE MULTI-CALL-SITE POPULATION BEFORE ANYTHING
    ELSE, SINCE THE QUESTION IS VACUOUS WITHOUT ONE. Read
    experiments/EXP-MLKEM-009/analysis/second_implementation_selection.md
    (already read in full this session, matching IDEA-20260821-121612's own
    Stage 0 finding) and the source of every pinned candidate, specifically
    searching for: (i) any comparison or select symbol invoked from two or
    more distinct call sites within the same translation unit or the same
    linked library (a self-test harness calling the production comparator
    directly is an admissible second call site; a duplicated symbol name
    across two different backends selected by runtime dispatch is NOT --
    that is IDEA-20260821-121612's ALREADY-NOTED aws-lc/mlkem-native
    duplication, a different phenomenon this record does not re-examine);
    (ii) -25d3ca's own open discriminator, i.e. per implementation, whether
    the encapsulation modulus-check comparison and the decapsulation
    re-encryption comparison are confirmed the SAME symbol (a prerequisite
    -25d3ca left as a census question rather than an answered fact for any
    named implementation). Both PQClean's `verify`/`cmov` split (two
    DIFFERENT symbols, one call site each, as retrieved and quoted in the
    companion records IDEA-20260828-40db79 and IDEA-20260828-edec21 filed
    this session) and any implementation where -25d3ca's shared-routine
    question resolves SHARED for a named implementation are read for
    genuine multi-call-site candidates; where none exists within budget,
    that is Stage 0's own reportable, honest finding and the record
    proceeds no further into a build-based stage, exactly mirroring
    IDEA-20260821-121612's Stage 0 disposition of its own pinned population.
    STAGE 1 -- FREEZE THE TOOLCHAIN, VARY ONLY THE CALL SITE. Pick ONE
    toolchain configuration (one compiler, version, optimization level and
    -march) held constant for the entire stage -- the orthogonal design
    choice to IDEA-20260821-121612, which held the call site fixed and
    varied the toolchain over 40 cells. Build the candidate at that one
    configuration under two link modes: (a) WITHOUT link-time optimization
    (ordinary separate compilation, the mode most static analyses and most
    of this lane's own prior census work implicitly assumed), and (b) WITH
    link-time optimization enabled (`-flto` or equivalent), which is the
    mode most likely to expose call-site specialization since it is what
    grants the compiler visibility into all call sites simultaneously.
    STAGE 2 -- APPLY THE FROZEN v2 EXTRACTOR PER CALL SITE, NOT PER SYMBOL.
    Reusing IDEA-20260821-121612's frozen extractor UNCHANGED (memory-
    operand enumeration grouped by base pointer, unroll-normalized
    per-source-iteration width, static coverage-set computation at a fixed
    length), disassemble the LINKED ARTIFACT at each build (a) and (b) and
    locate every machine-code region reached by a call instruction
    targeting the symbol under study. If the symbol resolves to ONE
    address reached by K call instructions, record ONE tuple and report
    `determinacy_across_call_sites = 1` trivially (the symbol was not
    specialized). If the symbol resolves to K >= 2 DISTINCT addresses
    (the compiler cloned or fully inlined and specialized it per site),
    extract the tuple SEPARATELY at each address and report the SPREAD
    across them using the identical determinacy/spread metrics
    IDEA-20260821-121612 already defines for its own toolchain-variance
    axis, applied here to the call-site axis instead.
    STAGE 3 -- CALIBRATE AT BOTH ENDS, INHERITED FROM 121612 RATHER THAN
    REINVENTED. NULL-1 (a hand-written, non-inlinable routine marked to
    prevent cloning, e.g. via a linker-visible symbol with external
    linkage and `noinline`/`noclone` attributes where the toolchain
    supports them): FORCED to show determinacy 1 across call sites at both
    link modes, since it structurally cannot be specialized; a failure
    here indicts the extractor's call-site resolution, not the phenomenon.
    NULL-2 (a short, trivially inlinable static function called at two
    sites with DIFFERENT compile-time-constant length arguments, a
    textbook LTO/inlining specialization trigger): FORCED to show
    determinacy < 1 (at least two distinct compiled bodies) under link
    mode (b) at a `-O2`-or-higher optimization level, and its forced value
    is NOT asserted without a compile; if the actual toolchain used does
    not specialize this deliberately-provocative case, the record states
    that the compiler chosen is more conservative than assumed and
    downgrades the whole stage's sensitivity rather than asserting a
    forced value that did not obtain.
    STAGE 4 -- THE MATRIX AND ITS READING. For the genuine multi-call-site
    candidate(s) found in Stage 0, report the (call_site, w_source,
    coverage_set) tuple at each site, under both link modes, at the one
    fixed toolchain configuration of Stage 1. Two readings, declared before
    the run: DETERMINACY 1 across every call site and both link modes
    means source-level symbol sharing DOES survive to the binary for this
    candidate, and any shared-routine census answer of the kind
    -25d3ca sought (a source-level SHARED verdict) is a sound basis for its
    transitivity inference on this candidate, strengthening that record's
    argument by a stronger method than its own census could supply.
    DETERMINACY BELOW 1 at any call site under either link mode means the
    source-level SHARED verdict is INSUFFICIENT: the two call sites have
    genuinely different defect surfaces and each requires its own
    independent instrument-level audit, exactly as if they were two
    separate implementations -- a direct, actionable correction to how
    future shared-routine census answers in this lane should be read.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Retrieval this session used Grep over the repository (already run for
      the two companion records filed this session, IDEA-20260828-40db79
      and IDEA-20260828-edec21, and not repeated verbatim here) plus direct
      re-reading of the specific sections of IDEA-20260821-121612 and
      IDEA-20260821-25d3ca bearing on call-site specialization and
      symbol-sharing respectively. Grep of `ledger/proposals` (glob
      *MLKEM*) for `call.?site|LTO|link.?time optimi|specializ|cloning|
      noinline`, case-insensitive: the only hits are in
      IDEA-20260821-121612's own confounders block (which names the
      phenomenon and explicitly declares it a limitation of that record,
      not something it measures) and this record's own drafting; no other
      RQ-MLKEM-002 proposal mentions call-site specialization, cloning, or
      link-time optimization. All eight RQ-MLKEM-002 proposals were read in
      full or in their relevant sections this session.
      Web: no new web retrieval was performed for this record specifically;
      it relies on the PQClean source already retrieved this session for
      the two companion records (verify.c/kem.c at the pinned commit),
      cited below by reference rather than re-fetched.
    results: >-
      IDEA-20260821-121612 is the nearest prior work by a wide margin: it
      measures toolchain-configuration variance of a comparator's compiled
      stride at ONE call site per (routine, configuration) cell, and its
      own confounders block states plainly that call-site specialization
      and LTO are OUT OF ITS SCOPE ("a declared limitation, not an
      oversight"). IDEA-20260821-25d3ca poses the symbol-sharing question
      this record's motivation depends on but does not test whether a
      SHARED symbol remains ONE machine body; its own claim is explicitly
      about source-level census, stated as a discriminator with two named
      outcomes (SHARED / NOT SHARED) that this record's finding could, in
      principle, complicate further by adding a third possibility
      (source-level SHARED but binary-level SPECIALIZED) that neither
      record currently distinguishes from plain SHARED. No other record in
      this repository addresses call-site variance at all.
    verdict: >-
      UNVERIFIED. Claimed new relative to this repository: holding
      toolchain fixed and varying call site as an independent axis
      (the orthogonal complement of IDEA-20260821-121612's own design);
      identifying that -25d3ca's transitivity argument implicitly assumes
      call-site invariance without stating or testing it; and proposing the
      three-way outcome (shared-and-invariant / shared-but-specialized /
      not-shared) as a refinement of -25d3ca's binary SHARED/NOT-SHARED
      census. ASSEMBLED FROM KNOWN PARTS: the frozen v2 extractor, its
      calibration discipline (NULL-1/NULL-2 style must-not-vary and
      must-vary objects), and the coverage-set formalism are all
      IDEA-20260821-121612's, reused rather than reinvented; the
      shared-routine census question and its transitivity argument are
      IDEA-20260821-25d3ca's; LTO/inlining call-site specialization is a
      well-known, general compiler behavior, not a discovery of this
      record, and no specific academic citation for it was retrieved this
      session (the general fact is treated as recalled and uncontested
      rather than externally sourced).

  object_first_candidate:
    tracked_object: >-
      The map `call_site -> (w_source, u, coverage_set)` for a FIXED
      source symbol f, a FIXED toolchain configuration t, with call site
      ranging over the K >= 2 places f is invoked in one linked artifact --
      the exact orthogonal complement of IDEA-20260821-121612's own object
      `toolchain -> (w_source, u, coverage_set)` for a fixed call site. This
      record does not repeat 121612's axis; it holds it fixed and varies
      the axis 121612 declared out of scope.
    lossiness: >-
      Genuinely lossy in the same sense as 121612's own object: a compiled
      artifact carries thousands of bits of instruction encoding at each
      of its K call sites, and the projection keeps only a small tuple per
      site. It is compatible with the target's operation ("resolve a call
      to a shared symbol") because the tuple is defined and recomputed per
      resolved call target, the same discipline 121612 applies per
      toolchain cell. It is NOT a change of coordinates: two structurally
      different specialized bodies (one register-allocated one way at a
      call site with heavy surrounding pressure, another allocated
      differently at a lighter call site) can produce the IDENTICAL tuple
      (same w_source, same coverage_set) despite differing instruction
      selection, exactly the kind of non-singleton fibre 121612 already
      demonstrates for its own toolchain axis.
    propagation: >-
      One step of the operation of interest is "resolve one call
      instruction to its target code". The propagation law is empirical,
      not algebraic, exactly as 121612 states for its own axis: this
      record measures the one-step map `call_site -> tuple` directly and
      reports whether it is constant (source sharing survives) or varies
      (source sharing does not survive), rather than assuming either
      answer. A second operation, "change toolchain configuration",
      composes with this one and is explicitly held fixed within this
      record (that composition, varying BOTH axes at once, is future work
      this record does not attempt and says so).
    survival_score: >-
      Survives one step and stops at the boundary stated in advance. Step
      1, call-site resolution at fixed toolchain: measured directly, and
      the measurement includes an explicit not-specialized (determinacy 1)
      outcome as a first-class, fully reportable result. Step 2, ANY CLAIM
      ABOUT WHETHER A DEFECT ACTUALLY EXISTS AT ANY RESOLVED CALL TARGET:
      DISSOLVES here deliberately -- this record measures whether the
      SHARED-SYMBOL INFERENCE STEP is sound, not whether either call
      site's resolved code is itself defective, which remains the separate
      audit IDEA-20260821-25d3ca's own census, or the companion records
      filed this session, are responsible for.

  discriminated_from:
    - >-
      IDEA-20260821-121612 measures whether a comparator's stride is well
      defined and stable ACROSS TOOLCHAIN CONFIGURATIONS at ONE fixed call
      site. This record holds the toolchain fixed and measures variance
      ACROSS CALL SITES instead -- the precise complement that record's own
      confounders block names as out of its scope. Its frozen extractor is
      reused verbatim rather than re-derived, and this record does not
      repeat its 40-cell toolchain matrix.
    - >-
      IDEA-20260821-25d3ca poses the shared-routine census (is the
      encapsulation and decapsulation comparison the SAME SYMBOL) as its
      own discriminator, with a binary SHARED/NOT-SHARED outcome and a
      transitivity argument that assumes, without stating, that a SHARED
      answer implies a shared defect surface. This record supplies the
      missing audit of that assumption and proposes a finer, three-way
      outcome (shared-and-invariant / shared-but-specialized / not-shared)
      as a correction to how any future SHARED verdict in this lane should
      be read, without re-deriving -25d3ca's own arithmetic (the modulus-
      check tail analysis) at all.
    - >-
      IDEA-20260828-40db79 and IDEA-20260828-edec21, filed the same
      session, examine a select primitive's write-side coverage and a
      finalize expression's value-domain safety respectively, both at
      FIXED, single call sites read directly from source. Neither record
      varies call site or toolchain; this record is the only one of the
      three whose object is a VARIANCE axis rather than a single measured
      value, and none of the three depends on another's claim.
    - >-
      A constant-time / timing analysis of compiler transformations (cited
      as prior art in IDEA-20260821-121612, not re-cited here) asks
      whether execution TIME is preserved across a compiler pass.
      RQ-MLKEM-002 forbids timing measurement outright; nothing in this
      record measures time. The quantities measured are static: which
      binary addresses a symbol resolves to, and what byte-position tuple
      the frozen extractor reads at each.

