idea:
  id: IDEA-20260813-0cf345
  added: '2026-08-13'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-QALG-457b41
  goal_id: GOAL-QALG-001
  title: >-
    Reduction-side noise-budget audit: does ML-KEM's fixed, small module rank
    even land the MLWE-to-EDCP reduction inside ANY noise-tolerant DCP
    algorithm's operating regime, independent of whether Simon's Lemma 3 holds
  class: measurement
  claim: >-
    KN-OPEN-8a5965 poses two strictly ordered questions about the Simon 2026
    DCP claim: Q1 (is the proof correct) and Q2 (if correct, does it reach
    deployed schemes), explicitly noting "Q2 is worth no effort until Q1
    resolves." This proposal claims that a THIRD, logically prior question is
    both answerable now and independent of Q1: does the faulty-sample rate
    1/a(n) that the tightened Regev-BKSW reduction (KN-LIT-4706) induces when
    specialized to Module-LWE at FIXED small rank k in {2,3,4} and ring degree
    256 (KN-LIT-1744's IP-M-EDCP setting) even fall within the 1/O(log n)
    noise-tolerance budget that ANY hypothetical noise-tolerant DCP algorithm
    of this shape -- not only Simon's specific, currently-unverified
    construction -- would need to succeed. The claim discriminates between
    two explanations for why no exponent-moving quantum MLWE mechanism is
    currently known: (a) the algorithm-side gap (no correct noise-tolerant
    DCP algorithm has yet been published, but the reduction itself would
    already land in a workable noise regime at ML-KEM's actual, non-asymptotic
    parameters if one existed), versus (b) a reduction-side gap (the
    fixed-rank, fixed-ring-degree regime that concrete ML-KEM parameters
    occupy is asymptotically the wrong shape for the Regev/BKSW/IP-M-EDCP
    reduction to ever produce a noise rate inside 1/O(log n), regardless of
    what algorithm is eventually found for DCP itself). These are two
    different, independently closable obstructions, and conflating them
    (as the current single-threaded Q1-then-Q2 ordering risks doing) would
    waste effort verifying Simon's Lemma 3 before checking whether the
    reduction even reaches a useful regime at ML-KEM's actual parameters.
  mechanism: >-
    Tracked object: the induced faulty-sample rate a(n)^(-1) as a function
    purely of the reduction's own stated parameters (target SVP approximation
    factor, lattice/module dimension, and -- crucially, per KN-LIT-1744's
    stated dependence -- the RING DEGREE, not only the module rank), evaluated
    at ML-KEM-512/768/1024's actual (k, d=256, q=3329, CBD eta) values, held
    entirely separate from any question about whether Simon's or any other
    specific DCP algorithm's Lemma-level correctness holds. This is a
    reduction-quality measurement, not an algorithm-correctness audit: it
    asks whether the MAP from MLWE instances to (module-)EDCP instances,
    which is unconditionally well-defined and published (KN-LIT-4706,
    KN-LIT-1744), produces instances that fall inside a noise budget any
    future noise-tolerant DCP algorithm of the stated asymptotic shape could
    plausibly use, given that ML-KEM's actual n (effective DCP group-order
    exponent, roughly proportional to k*256) is FIXED and small (roughly
    512-3072) rather than an asymptotic free variable. The lossy-projection
    test: tracking only a(n) (the induced noise rate) discards the entire
    quantum algorithmic mechanism and retains only the reduction's own output
    parameter, which is exactly the interface boundary between the
    algorithm-side (Q1) and reduction-side (this proposal's) obstructions --
    a genuinely different quantity than S(d) in IDEA-20260813-4aecda, and
    compatible with the reduction's own operations because a(n) is literally
    the reduction's declared output, not a derived proxy for it.
  novelty_status: unverified
  novelty_screen:
    local_kb_status: >-
      crypto-kb MCP search_knowledge tools unavailable in this session (see
      retrieval-screen.yaml); screened via direct grep of committed
      knowledge/ and ledger/proposals/ at snapshot commit
      083ca0026281c05e85570e5bddf90adbd4954d69.
    screened_proposals: >-
      No prior RQ-QALG-457b41 filings exist (first batch). Compared against
      sibling IDEA-20260813-4aecda (this batch): that proposal audits
      algorithm correctness (Lemma 3) at toy scale; this proposal audits
      reduction quality at ML-KEM's actual concrete parameters and is
      explicitly designed to be answerable even if Lemma 3 is later refuted,
      since it bears on any future noise-tolerant DCP algorithm of the same
      asymptotic shape, not only Simon's.
    adjacent_corpus:
      - KN-LIT-4706
      - KN-LIT-1744
      - KN-LIT-21383c
      - KN-OPEN-8a5965
      - KN-TECH-d1bc4f
    external_screen: >-
      No live web search available this session. KN-LIT-1744's own entry
      states it was "generated during the 2026-07-24 bulk seeding pass from
      the local PDF's first two pages... claims are relayed from the paper's
      abstract without independent verification" -- this program has NOT yet
      extracted the explicit a(n)-versus-(rank,ring-degree) formula this
      proposal needs, which is itself the first concrete deliverable of the
      minimal test below, not something claimed as already known.
    nearest_neighbors: []
  assumptions:
    - >-
      This proposal treats "a noise-tolerant DCP algorithm with tolerance
      1/O(log n) exists" as a hypothetical, not as an endorsement of Simon
      2026's specific construction; the measurement is designed to be
      informative under that generic hypothesis regardless of which specific
      algorithm (if any) eventually instantiates it.
    - >-
      The precise functional dependence of BKSW's and IP-M-EDCP's induced
      noise rate on (module rank, ring degree, target approximation factor)
      is NOT currently extracted in this program's corpus (KN-LIT-4706 and
      KN-LIT-1744 are both flagged as not-fully-verified/abstract-only); the
      first step of the minimal test is reading both papers in full to pin
      this down, and this proposal's numeric conclusions are conditional on
      that extraction being accurate.
    - >-
      "Fixed small rank" is ML-KEM's actual deployed regime (k in {2,3,4}),
      not an asymptotic family; any asymptotic statement this proposal makes
      about "as n grows" refers to a hypothetical scaling of ML-KEM-shaped
      parameters (larger k or larger ring degree), not to ML-KEM itself,
      which is fixed. This distinction is preserved throughout.
  proof_search_map:
    bottleneck: >-
      Whether the specific numeric value of a(n)^(-1) produced by the
      Regev-BKSW-IP-M-EDCP reduction chain, evaluated at ML-KEM's actual
      (k, 256, q, eta), is smaller (worse, more noise) than 1/O(log n) for
      any n in ML-KEM's actual range (n roughly 512 to 3072 depending on k
      and standardized level), which would close the entire DCP-route family
      for ML-KEM's CONCRETE parameters regardless of algorithm-side progress.
    baseline_embedding:
      parameter_slice: >-
        The unstructured (non-module) LWE case, i.e. module rank k=1 acting
        on a single ring coordinate treated as scalar LWE, is the parameter
        slice that reproduces Regev's original (KN-LIT-21383c) and BKSW's
        (KN-LIT-4706) UNSTRUCTURED reduction exactly; the module/ring-degree-
        aware IP-M-EDCP extension (KN-LIT-1744) must reduce to that baseline
        formula when ring degree is set to 1 and rank is set to n (i.e. the
        module structure is "unwound" back to plain LWE of the same total
        dimension).
      reproduction_check: >-
        Symbolic check that the extracted a(n) formula, evaluated at ring
        degree 1, matches the published unstructured Regev/BKSW noise-rate
        formula exactly (a frozen algebraic identity, not a numerical
        coincidence check).
    observation_collision:
      observable: >-
        The single scalar a(n)^(-1) (induced faulty-sample rate) as a
        function of (module rank, ring degree, target approximation factor).
      distinct_preimage_search: >-
        Search for two distinct (rank, ring-degree) pairs with the same total
        dimension n = rank*ring-degree but different induced a(n)^(-1) values
        -- if the reduction's noise cost depends on ring degree independently
        of total dimension (as KN-LIT-1744's abstract claims: "the
        extrapolation depends not only on the noise rate, but also on the
        ring's degree"), then n alone is NOT a sufficient observable for the
        noise budget, and any prior corpus discussion (including
        KN-TECH-d1bc4f's table, which reports noise tolerance purely as a
        function of n) is incomplete for the module case and must be
        corrected before use.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          A target-specific measure: the ratio a(n)^(-1) / (1/O(log n))
          evaluated at exactly ML-KEM-512, ML-KEM-768, and ML-KEM-1024's
          published (k, d=256, q=3329, eta) values, using the extracted
          IP-M-EDCP formula.
        predicted_gain: >-
          Not a speed gain; a scope-narrowing measurement. If the ratio
          exceeds 1 (worse than the needed tolerance) at all three
          standardized levels, this closes the reduction-side branch for
          ML-KEM outright, independent of Q1. If it is below 1 at any level,
          the reduction-side bottleneck is not the obstruction there and
          effort should concentrate on Q1 (algorithm correctness) for that
          level specifically.
    quantifier_order: >-
      The claim under audit is implicitly: there exists a choice of (module
      rank, ring degree) reduction parameters such that, for ML-KEM's actual
      fixed n, the induced noise rate is within 1/O(log n). This proposal
      checks that existential claim directly at ML-KEM's three standardized,
      NON-asymptotic parameter triples, rather than asymptotically as n to
      infinity -- and explicitly does not claim the asymptotic "for all
      sufficiently large n" statement holds or fails, only the three
      concrete evaluations.
    method_ceiling:
      strongest_certifiable_claim: >-
        This measurement can certify, at best, that ML-KEM's three
        standardized parameter sets do or do not fall inside the noise budget
        a generic noise-tolerant DCP algorithm of Simon's stated asymptotic
        shape would need -- it cannot certify anything about whether such an
        algorithm exists (that is Q1, addressed by IDEA-20260813-4aecda), nor
        about parameter sets other than the three standardized ones.
      nearby_object_control: >-
        The nearby object is unstructured LWE at the SAME total dimension n
        (module rank 1, "ring degree" n): if a(n)^(-1) at ML-KEM's parameters
        is materially WORSE than the unstructured-LWE noise rate at the same
        n, that isolates the module/ring structure itself (not merely
        dimension) as the source of any closure, which is the more precise
        and more useful finding.
    proof_obligations:
      - claim: >-
          The extracted IP-M-EDCP noise-rate formula reduces to the published
          unstructured Regev-BKSW formula at ring degree 1.
        responsibility: baseline
      - claim: >-
          The formula is evaluated correctly at ML-KEM-512/768/1024's exact
          published (k, d, q, eta) values.
        responsibility: correctness
      - claim: >-
          The nearby-object (unstructured, same-n) comparison isolates
          whether any closure found is due to dimension alone or to module/
          ring structure specifically.
        responsibility: scope
      - claim: >-
          The result is reported as a measurement (a ratio at three fixed
          parameter triples), never smuggled into a claim about the
          asymptotic theorem's truth for all n.
        responsibility: interface
    not_applicable_reason: null
  predictions:
    - metric: induced_noise_rate_ratio_ml_kem_512
      direction: different
      minimum_effect: >-
        a(n)^(-1) / (target 1/O(log n) tolerance, with the O(.) constant
        taken directly from Simon 2026's own stated requirement) at
        ML-KEM-512's parameters; direction is "different" because the
        proposal does not predict whether the ratio exceeds or falls below 1.
    - metric: induced_noise_rate_ratio_ml_kem_768
      direction: different
      minimum_effect: same ratio evaluated at ML-KEM-768's parameters.
    - metric: induced_noise_rate_ratio_ml_kem_1024
      direction: different
      minimum_effect: same ratio evaluated at ML-KEM-1024's parameters.
    - metric: module_vs_unstructured_noise_gap
      direction: different
      minimum_effect: >-
        Whether the module/ring-structured reduction's induced noise rate at
        matched total dimension n differs from the unstructured-LWE
        reduction's rate, and by how much -- isolating structure-specific
        cost from dimension-driven cost.
  minimal_test:
    design: >-
      (1) Read KN-LIT-4706 (BKSW) and KN-LIT-1744 (IP-M-EDCP) in full --
      both currently abstract-only in this corpus -- and extract the explicit
      closed-form or algorithmic dependence of the induced faulty-sample rate
      a(n)^(-1) on (module rank, ring degree, target SVP approximation
      factor). (2) Symbolically check that formula reduces to the published
      unstructured Regev/BKSW rate at ring degree 1 (baseline embedding).
      (3) Evaluate the formula numerically at ML-KEM-512/768/1024's exact
      published parameters, using Simon 2026's own stated 1/O(log n)
      tolerance requirement (with its constant taken from the paper, not
      guessed) as the comparison threshold. (4) Evaluate the same formula at
      the nearby unstructured-LWE object (module rank 1, same total
      dimension) for comparison. (5) Report all four ratios with their
      derivation chain fully shown, so a reviewer can check the arithmetic
      independently. This record authorizes no execution beyond literature
      reading and closed-form/numeric evaluation; no ML-KEM implementation,
      lattice reduction run, or quantum simulation is authorized.
    controls:
      - >-
        Baseline-embedding check: the extracted formula must reduce to the
        published unstructured Regev-BKSW rate at ring degree 1, verified
        symbolically before any module-specific number is trusted.
      - >-
        Nearby-object (unstructured, same-n) comparison, to separate
        dimension-driven from structure-driven noise cost.
      - >-
        Sensitivity check: report how the three standardized-level ratios
        change under a plausible range of the O(.) constant in "1/O(log n)"
        (Simon's paper does not pin this constant down precisely, per
        KN-OPEN-8a5965 sub-question 4), so the conclusion's robustness to
        that unresolved constant is visible rather than hidden.
    required_metrics:
      - extracted a(n)^(-1) formula and its source citation (equation/section
        number in KN-LIT-4706 and KN-LIT-1744)
      - baseline-embedding symbolic check result
      - three standardized-level ratios (ML-KEM-512/768/1024) plus the
        unstructured nearby-object comparison
      - sensitivity range of the ratios under the O(.) constant's plausible
        range
  falsification_conditions:
    - >-
      The extracted formula does NOT reduce to the published unstructured
      Regev-BKSW rate at ring degree 1: this falsifies the proposal's own
      baseline embedding and blocks any further conclusion until resolved.
    - >-
      The ratio exceeds 1 (reduction-induced noise worse than needed) at all
      three standardized levels, robustly across the plausible O(.) constant
      range: this is a positive finding for this proposal's own hypothesis
      (b) -- a reduction-side obstruction independent of Q1 -- and should be
      recorded as a named, scoped closure of the reduction-side branch for
      ML-KEM's concrete parameters specifically.
    - >-
      The ratio falls below 1 at any standardized level, robustly: this
      refutes hypothesis (b) at that level and redirects all remaining effort
      in this RQ toward Q1 (algorithm correctness, IDEA-20260813-4aecda) and
      Q2's access-model question (IDEA-20260813-02479f) for that level.
  confounders:
    - >-
      Mixing up ML-KEM's fixed, small, non-asymptotic n with the asymptotic
      n-to-infinity regime the reduction papers were originally stated for;
      every ratio reported must be tagged with the exact fixed n it was
      evaluated at, never presented as an asymptotic statement.
    - >-
      Using an approximate or misremembered O(.) constant from Simon 2026
      instead of the paper's own stated value; the sensitivity check exists
      precisely to bound the damage if this constant turns out to be wrong or
      unpindownable.
    - >-
      Treating a closure of the reduction-side branch as a closure of the
      whole RQ; the sieve-direct route (IDEA-20260813-f35692) and any future,
      differently-structured reduction remain open even if this specific
      Regev-BKSW-IP-M-EDCP chain closes.
  interpretation_limits:
    - >-
      This proposal makes no claim about whether Simon's Lemma 3 (or any
      other noise-tolerant DCP algorithm's correctness) holds; it is
      deliberately orthogonal to IDEA-20260813-4aecda's audit.
    - >-
      A negative (ratio > 1) result closes only the SPECIFIC Regev-BKSW-IP-M-
      EDCP reduction chain at ML-KEM's THREE standardized levels; it does not
      close the possibility of a differently-optimized future reduction with
      a better noise-rate dependence on module rank and ring degree.
    - >-
      Results here do not transfer to RQ-QALG-122b59 or RQ-QALG-74bf20 per
      GOAL-QALG-001's non_duplication note, and do not transfer to
      GOAL-MLKEM-005's classical block-size-reduction line, which concerns an
      unrelated classical mechanism.
  heuristic_assumptions:
    - id: H1-formula-extraction-fidelity
      statement: >-
        KN-LIT-4706's and KN-LIT-1744's abstracts, as currently summarized in
        this corpus, accurately foreshadow the existence of a closed-form or
        efficiently-evaluable dependence of a(n) on (rank, ring degree,
        approximation factor); this is a claim about the papers' likely
        content, not yet independently confirmed, since neither is fully read
        in this corpus at time of writing.
      rigorous_support: >-
        No rigorous bound is invoked; this heuristic is explicitly
        provisional and is the FIRST thing the minimal test's step 1 must
        confirm or refute by reading the full papers, prior to any numeric
        step.
      validation_plan: >-
        Read both papers in full (a zero-compute, literature-only step) and
        record the exact extracted formula with equation numbers, before
        proceeding to any numeric evaluation; if no closed form exists, fall
        back to whatever algorithmic procedure the papers do specify and
        evaluate it as a numeric black box at the three standardized
        parameter triples instead.
  target_complexity:
    time_exponent: >-
      Not claimed. This proposal measures a reduction's noise-rate output,
      not an algorithm's runtime.
    memory_exponent: not applicable to this measurement.
    best_known: >-
      2^(0.2653 d + o(d)) time in the QRAM model (Laarhoven, KN-LIT-703), the
      RQ's own stated Grover-only quantum baseline; this proposal's
      measurement does not itself compete against that baseline, it tests a
      precondition for any mechanism that would.
    hidden_overhead: not applicable; no complexity claim is made.
    tradeoff_note: not applicable.
  estimated_cost:
    implementation: low
    compute: low
    note: >-
      Literature reading plus closed-form/numeric evaluation; no lattice
      software, no ML-KEM implementation, no quantum simulation required.
  dominated_by: >-
    n/a (no attack or algorithm result claimed). Checked against the same
    frontier as IDEA-20260813-4aecda: Grover/quantum-walk sieve at
    2^(0.2653 d + o(d)) (KN-LIT-703), quantum k-Sieve at
    2^(0.2989 d + o(d)) time / 2^(0.1395 d + o(d)) memory (KN-LIT-703), and
    the unverified Simon-2026-composed-with-BKSW claim (KN-LIT-e204ab); none
    is displaced by this measurement, which targets a precondition rather
    than a competing algorithm.
  sota_delta: >-
    Zero, quantitatively; this is a scope-narrowing measurement, not a
    speedup claim. Its deliverable is a ratio (reduction-induced noise rate
    versus needed tolerance) at exactly three standardized ML-KEM parameter
    triples, which will either close the reduction-side branch of the DCP
    route for ML-KEM specifically (a named, scoped obstruction per
    docs/inventor-protocol.md section 4) or redirect effort toward Q1 and Q2's
    access-model question with the reduction-side precondition confirmed.
  recommended_priority: high
  source_refs:
    - https://eprint.iacr.org/2026/155
    - knowledge/literature/KN-LIT-1744.md
    - knowledge/literature/KN-LIT-4706.md
    - knowledge/literature/KN-LIT-21383c.md
    - knowledge/open-problems/KN-OPEN-8a5965.md
    - knowledge/techniques/KN-TECH-d1bc4f.md
    - knowledge/literature/KN-LIT-703.md
  enumerated_closures: []
  open_directions:
    - >-
      If the reduction-side ratio is favorable (below 1) at some but not all
      standardized levels, that level-dependence itself is worth recording
      as a finding, since it would mean ML-KEM's own level structure (512
      versus 1024) determines exposure to this specific mechanism family.
    - >-
      A follow-on could search whether a differently-optimized (not yet
      published) module-aware reduction could improve the noise-rate
      dependence on ring degree specifically, if this audit shows ring degree
      is the dominant cost driver rather than rank.
