idea:
  id: IDEA-20260804-170692
  question_id: RQ-SSI-001
  title: Local transport signatures as a lossy quotient of supersingular paths
  class: mechanism
  claim: >-
    A path's action on a fixed finite collection of local l-adic neighbor-tree
    quotients is a genuinely lossy, concatenation-compatible transport
    signature.  Measuring whether matching signatures enrich exact endpoint
    collisions beyond a shape-matched local-action null can distinguish a
    usable global-local correlation from a coordinate artifact.  Only if a
    uniform enrichment and charged lifting theorem are found would a
    p^(1/6+o(1)) time/memory target be worth pursuing; no algorithm, attack,
    or validated improvement is claimed.
  object_first_candidate:
    tracked_object: >-
      The tuple of bounded-radius local transport states induced by a partial
      path on pre-fixed l-adic neighbor-tree quotients, reduced modulo the
      corresponding local stabilizers.
    established_families_off_limits: >-
      Effective-orientation/class-group vectorization, endomorphism-ring
      recovery as a coordinate system, full-graph MITM, public-torsion
      attacks, CSIDH hidden-shift/collimation, and FC0/CollimationSieve are
      excluded as primary lenses.
    newness_score: unverified; local path quotients may have prior art outside the checked corpus.
    testability_score: medium; finite quotients and exact toy path composition can be computed.
    survival_score: deterministic under concatenation through quotient-state composition; bounded radius may erase correlation quickly.
  mechanism: >-
    Fix local primes and finite quotient radii before instance generation.
    A path induces a tuple of local transport states; composition of paths
    composes those states, so a signature can be updated without retaining the
    full path.  Use equal signatures only to select candidate path halves and
    perform exact endpoint/path verification afterwards.  An enrichment over a
    random local-action null suggests a global-local correlation; no enrichment,
    or an effect reproduced by the null, rejects this mechanism at the tested
    boundary.
  novelty_status: unverified
  literature_context:
    - >-
      KN-LIT-074 reports, but does not fully verify in this corpus, a
      GRH-conditional equivalence of EndRing and path finding.  It does not
      state a local-signature algorithm and is not novelty verification.
    - >-
      KN-LIT-078 reports Otilde(p^(1/4)) expected/heuristic classical
      path-finding for F_p-rational curves; it is the only matched baseline
      context used here.
    - >-
      KN-LIT-079 reports a quantum p^(1/4) result in another machine model and
      cannot be substituted for the classical baseline.
  lossy_projection_identifiability_audit:
    projection: >-
      Full labeled partial path (including all kernels and endpoint) -> tuple
      of bounded local transport states modulo fixed local stabilizers.
    what_is_discarded: >-
      The global ideal/path, all kernel coordinates, endpoint j-invariant,
      transport outside the selected radii, and every global compatibility
      condition not represented locally.
    why_genuinely_lossy: >-
      A finite tuple of bounded local quotient states has many distinct global
      path preimages; changing a path outside the selected local neighborhoods
      can leave every retained component fixed.
    deterministic_propagation: >-
      For each selected quotient, append a path step by its precomputed
      quotient transition and compose the tuple componentwise.  The quotient
      transition system is frozen before sampling.
    identifiability_risk: >-
      Equal signatures do not determine a common endpoint, ideal, or isogeny.
      Exact path composition and endpoint equality are mandatory, so a
      signature collision is not a solution certificate.
    algebraic_precompute_verdict: >-
      Passes the lossiness test provided at least two enumerated toy paths
      share a signature; otherwise it degenerates into an injective coordinate
      change and is rejected before measurement.
  assumptions:
    - Local quotient transition tables are calculated from the toy graph and
      do not use a secret orientation, secret endomorphism ring, or public torsion images.
  proof_search_map:
    bottleneck: >-
      Whether bounded local transport retains enough endpoint-relevant
      correlation to reduce exact global joins after construction and lifting
      costs are included.
    baseline_embedding:
      parameter_slice: >-
        Same F_p-rational toy instances, path lengths, and endpoint sets as
        plain exact-endpoint MITM; local radius zero is the no-information
        boundary.
      reproduction_check: >-
        With all local components suppressed (radius zero), the implementation
        must equal the plain exact-endpoint baseline's candidate and verified
        join counts.
    observation_collision:
      observable: tuple of local transport quotient states.
      distinct_preimage_search: >-
        Exhaustively enumerate same-signature distinct paths, including pairs
        that do and do not exact-join, and search for a nearest-radius pair
        whose signatures collide but whose endpoint behavior differs.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: bounded local transport signature.
        predicted_gain: >-
          Conditional p^(1/6+o(1)) target if local signature fibers have a
          uniform favorable join-enrichment bound and exact lifting stays
          within the charged budget.
    quantifier_order: >-
      For every graph in the declared family, fix the local prime set, radii,
      quotient maps, and path length before paths are sampled or enumerated;
      then evaluate all signatures.  There does not exist an instance-chosen
      local quotient in the proposed claim.
    method_ceiling:
      strongest_certifiable_claim: >-
        A measured finite-family association between a frozen local signature
        and exact joins.  Even ideal association cannot prove a general
        EndRing/path reduction or reduce deployed security estimates.
      nearby_object_control: >-
        Use transition tables drawn uniformly from permutations with the same
        quotient-state cardinalities and outdegrees.  If they give equal
        enrichment, the apparent effect is finite-state bucket geometry.
    proof_obligations:
      - claim: quotient transition is well-defined under path concatenation
        responsibility: correctness
      - claim: signatures are genuinely noninjective on each tested graph
        responsibility: feasibility
      - claim: signature and exact-lift costs are fully counted
        responsibility: runtime
      - claim: exact-join enrichment is uniform over the stated family
        responsibility: success_probability
  predictions:
    - metric: signature_conditioned_exact_join_odds_ratio
      direction: higher
      minimum_effect: >-
        Odds ratio at least 1.5 versus the matched random-transition null at
        every pre-registered nonzero radius, with a monotone radius response
        until saturation.
    - metric: radius_zero_null_residual
      direction: lower
      minimum_effect: >-
        Radius zero must agree with plain endpoint matching within the
        pre-registered deterministic counting tolerance.
  minimal_test:
    design: >-
      On exhaustive F_p-rational toy graphs, freeze local quotient radii,
      enumerate partial paths, update signatures by transition tables, exact
      verify all same-signature candidate joins, and compare the charged
      outcome across radii to both controls.
    controls:
      - >-
        Shape-matched null made of random quotient transition permutations
        with the identical component cardinalities, outdegrees, and radii.
      - Radius-zero null-object control, which retains no local transport information.
      - >-
        Same real quotient tables with path-step labels permuted independently
        at every depth, preserving state sizes while destroying composition.
    required_metrics:
      - signature fiber CDF and collision entropy by radius
      - exact-join odds ratio conditioned on signature equality
      - radius-response curve and null-residual curve
      - construction, update, lookup, and exact-verification operation counts
      - maximum-fiber tail probability under real and null transitions
  falsification_conditions:
    - >-
      The radius-zero control differs from plain matching, demonstrating an
      instrument error rather than structure.
    - >-
      Real and random-transition odds ratios agree, or the effect survives
      independent step-label permutations.
    - >-
      Increasing radius fails to change retained information while its
      construction cost increases, so no favorable charged prefilter exists.
  confounders:
    - Local quotient tables may encode accidental toy-graph symmetries.
    - Selected local primes/radii can be post-hoc tuned unless frozen.
    - A finite local signature can correlate with endpoint labels without
      offering a uniform asymptotic fiber bound.
  heuristic_assumptions:
    - id: HEUR-LTS-1
      statement: >-
        For a fixed local-prime/radius tuple and normalized path length, the
        conditional exact-join odds given equal real local signatures are at
        least c > 1 times those given equal signatures from a
        cardinality-and-outdegree-matched random transition system, uniformly
        over the proposed graph family.
      rigorous_support: >-
        On each finite test graph, transition composition, fiber counts, and
        join counts are exact.  The null imitates the classical occupancy and
        random-mapping distribution for compositions of independent
        finite-state transitions; no cited result establishes this model for
        supersingular local transport.
      validation_plan: >-
        At toy scale, enumerate increasing graph families, compare signature
        fiber CDFs and conditional odds ratios with random-transition and
        radius-zero controls, and test maximum-fiber tails against simulated
        occupancy extremes.  This is explicitly toy-scale and supplies no
        crypto-scale validation route.
      falsification_condition: >-
        After preregistered multiplicity correction, the lower confidence bound
        for c is at most 1 at every declared radius and graph size.
  target_complexity:
    problem: pure F_p-rational supersingular isogeny path finding without auxiliary torsion data.
    time_exponent: >-
      Prospective conditional p^(1/6+o(1)); this is not a claimed complexity
      result and requires missing uniform correlation, size, runtime, and
      exact-lift lemmas.
    memory_exponent: >-
      Prospective conditional p^(1/6+o(1)); signature tables and all local
      transition storage must be charged.
    matched_best_known: >-
      KN-LIT-078 reports expected/heuristic Otilde(p^(1/4)) classical cost for
      the matching F_p-rational problem, not a verified cost bound in this record.
    unmatched_context: >-
      KN-LIT-079 reports p^(1/4) quantum cost; it differs in machine model and
      is reported only as non-comparable context.
    hidden_overhead: >-
      The unbounded parts include local table construction, quotient radius,
      signature collisions, exact global lifts, verification, and possible
      rerandomization; no o(1) factor has been derived.
    tradeoff_note: >-
      No time-memory tradeoff has been established.  Parallel signature
      enumeration must still charge replicated local tables and total exact
      lift work; it is not a free exponent reduction.
  dominated_by: >-
    The reported Delfs-Galbraith p^(1/4) classical method dominates the
    presently specified state because this proposal has no proved, implemented,
    or measured attack cost.
  sota_delta: >-
    No result claimed.  If all explicitly missing lemmas held, the target
    would be a 1/12 reduction in both p-exponents from the reported matched
    p^(1/4) baseline; current delta is zero.
  estimated_cost:
    implementation: high
    compute: low
    validation_cost: finite quotient construction and exhaustive toy path enumeration.
  recommended_priority: low
  interpretation_limits:
    - This is not IDEA-20260725-002: it assumes no known small-degree endomorphism and does not vectorize a class-group action.
    - This is not a claim about CSIDH, whose commutative hidden-shift setting and subexponential quantum context in KN-LIT-069/071 are unmatched.
    - KN-OPEN-013 and KN-OPEN-015 remain open; no experiment, evidence, conclusion, or breakthrough is produced.
  status: proposed
  proposed_by: idea-generator
  proposed_at: '2026-08-04'
