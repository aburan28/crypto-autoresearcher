idea:
  id: IDEA-20260816-2e03d4
  question_id: RQ-HQC-001
  added: '2026-08-16'
  title: The inner decoder resolves maximum-likelihood ties by a fixed deterministic rule rather than
    a coin, so every symmetry argument about HQC's failure statistics silently assumes something the
    deployed decoder does not do; measure the tie rate and run a random-tie-break arm beside the deterministic
    one to bound what the convention alone can move
  class: mechanism
  claim: '(A) THE ASYMMETRY NOBODY HAS PRICED. Maximum-likelihood decoding of a short Reed-Muller
    block over a binary channel produces exact ties: two or more codewords achieving the same maximal
    correlation. H-HQC-18d1b4''s own probability space is defined with ''the deployed deterministic
    tie rule of SPEC 3.4.3''. A deterministic rule resolves every tie in the same direction, which
    is not what a symmetry argument over codeword labels assumes, and not what a random-tie ML decoder
    does. (B) THE CLAIM, IN TWO PIECES. First, the tie rate is a measurable quantity of the decoder
    at given parameters and nobody in this program has measured it - so the size of the effect the
    convention could possibly have is currently unknown rather than small. Second, the effect itself
    is directly measurable by running the identical pipeline twice, once with the deterministic rule
    and once with a uniformly random tie-break, on the SAME channel realisations, so that the arms
    differ only where a tie actually occurs and the difference is a paired statistic with almost all
    the variance cancelled. (C) WHY THE PAIRING IS THE WHOLE DESIGN. If ties are rare, an unpaired
    comparison would need enormous trial counts to see anything, and the natural conclusion ''no effect''
    would be a statement about the trial count rather than about the convention. Pairing on identical
    channel realisations makes the estimator''s variance proportional to the tie rate, not to the
    failure rate, which is the difference between a measurable question and an unmeasurable one. (D)
    WHAT IS NOT CLAIMED. No attack, no break, no security consequence. It is not claimed that the
    tie rate is large; the honest expectation is that it is small and that the deliverable is an upper
    bound on the convention''s influence. It is not claimed that the deterministic rule is a defect
    - it is a specification choice, and a measured zero effect is a licensing result for every symmetry
    argument the campaign makes. Nothing here asserts what any implementation or standard text contains
    beyond the transcription already committed by this program, and if that transcription is incomplete
    about the rule, the run reports the gap rather than guessing. No attack, break, speedup or security
    consequence is claimed here or would follow from a run. No statement is made about what the published
    literature does or does not contain; this environment cannot reach external literature. No direction
    is declared impossible.'
  mechanism: 'STAGE 1: instrument the decoder to report, per block, whether a tie occurred at the
    maximum and how many codewords participated. That gives the tie rate and the tie multiplicity
    distribution at essentially no cost, since the correlation array is already materialised. STAGE
    2: build the paired arms. On each trial, decode the identical received blocks twice - once resolving
    ties by the deployed deterministic rule and once by a uniform random choice among the tied codewords
    - and record both block-failure vectors. On trials with no tie the two arms are bit-identical
    by construction, which is itself a fail-closed wiring gate. STAGE 3: compute the paired difference
    in per-block failure rate and in the count S, with its paired standard error, and report the ratio
    of unpaired to paired standard error as a demonstration that the pairing bought what it was supposed
    to buy - the same discipline the committed matched-pair work under EV-HQC-469c08 already uses,
    where the reported unpaired-to-paired ratio was 8.99. STAGE 4: a stress arm. Push the parameters
    toward a regime where ties are common - shorter blocks, higher duplication, or a channel crossover
    near the ambiguity point - and measure the effect where it is largest, to establish that the instrument
    can see an effect at all before concluding that there is none at realistic settings. Refutation:
    a paired difference consistent with zero at a measured tie rate is an upper bound on the convention''s
    influence, and that bound is the deliverable.'
  novelty_status: unverified
  novelty_screen:
    method: 'Ran, from /home/user/crypto-autoresearcher: `grep -ril "hqc" --include=*.yaml --include=*.md
      .` (33 proposal files match), then extracted question_id and title for every one of those 33
      with a python3/yaml one-liner; `grep -ril "quasi-cyclic" ledger/proposals/` (8 files), `grep
      -ril "cyclic shift" ledger/proposals/` (7), `grep -ril "Reed-Solomon" ledger/proposals/` (2),
      `grep -ril "outer decoder" ledger/proposals/` (0), `grep -ril "syndrome weight" ledger/proposals/`
      (0), `grep -ril "local exponent" ledger/proposals/` (0), `grep -ril "failure boosting" ledger/proposals/`
      (7), `grep -ril "mutual information" ledger/proposals/` (15), `grep -ril "rejection sampling"
      ledger/proposals/` (19), `grep -ril "weight distribution" ledger/proposals/` (10), `grep -ril
      "SampleFixedWeight" ledger/proposals/` (3), `grep -ril "hypergeometric" ledger/proposals/` (8),
      `grep -ril "autocorrelation" ledger/proposals/` (8), `grep -ril "circulant" ledger/proposals/`
      (14), `grep -ril "Toeplitz" ledger/proposals/` (4), `grep -ril "maximum likelihood decoder"
      ledger/proposals/` (0), `grep -ril "margin distribution" ledger/proposals/` (0), `grep -ril
      "tie-break" ledger/proposals/` (8), `grep -ril "soft information" ledger/proposals/` (1), `grep
      -ril "differential testing" ledger/proposals/` (2). Read in full: ledger/questions/RQ-HQC-001.yaml,
      ledger/goals/GOAL-HQC-001.yaml (first 120 lines incl. batch_checkpoints and campaign_budget),
      the statement head of ledger/hypotheses/H-HQC-18d1b4.yaml, the id/title/objective/status blocks
      of experiments/EXP-HQC-982268, EXP-HQC-bd30c0 and EXP-HQC-50ebe9 specification.yaml, the observations
      blocks of EV-HQC-b71230, EV-HQC-469c08 and EV-HQC-927899, knowledge/open-problems/KN-OPEN-3f7a21.md,
      and docs/inventor-protocol.md sections 1-8. Listed the HQC literature entries by title: KN-LIT-b9e1a8
      (Hamming Quasi-Cyclic spec), KN-LIT-1c9474 (HQC-RMRS), KN-LIT-2141, KN-LIT-4c1133, KN-LIT-5677ae,
      KN-LIT-7565, KN-LIT-de5373. Additionally ran `grep -ril "tie-break" ledger/proposals/` (8 files:
      IDEA-20260813-87106b, IDEA-20260805-554b9d, IDEA-20260807-9fb27c and five others) and read the
      observations of EV-HQC-469c08 for the committed matched-pair methodology and its reported unpaired-to-paired
      standard-error ratio.'
    results: 'Eight proposals mention tie-breaking, none under RQ-HQC-001 and none about a decoder:
      IDEA-20260805-554b9d is the Classic McEliece full-cost ISD re-costing, IDEA-20260813-87106b
      and IDEA-20260807-9fb27c are in unrelated areas. H-HQC-18d1b4 names ''the deployed deterministic
      tie rule of SPEC 3.4.3'' as part of its probability space definition, so the rule is recorded
      as a fixed feature of the setting and has never been varied. EV-HQC-469c08 and EV-HQC-927899
      establish that this campaign already runs matched-pair designs with paired and unpaired standard
      errors reported side by side (pooled ratio 8.987228 at k = m = 17), so the estimator discipline
      exists in committed form; what has never been paired is the tie convention. No committed record
      reports a tie rate for any decoder in this repository.'
    verdict: 'UNVERIFIED. Nothing here asserts what published literature or any implementation contains.
      Claimed NEW relative to this repository: measuring the inner decoder''s tie rate and multiplicity
      at all, and pairing the deterministic and random tie conventions on identical channel realisations
      so that the convention''s influence is estimable at variance proportional to the tie rate. ASSEMBLED
      FROM KNOWN PARTS: the matched-pair estimator and the practice of reporting unpaired-to-paired
      standard-error ratios come directly from the committed work under EV-HQC-469c08 and EV-HQC-927899;
      the decoder, the pipeline and the tie rule''s existence are H-HQC-18d1b4''s; and the idea that
      a deterministic convention breaks a label symmetry is elementary.'
  object_first_candidate:
    tracked_object: The tie event at the maximum of the inner decoder's correlation array - its indicator,
      its multiplicity, and the identity of the codeword the deployed rule selects - followed through
      to the block-failure indicator and the count S. The convention is the independent variable;
      the tie event is what carries its influence.
    lossiness: LOSSY, and the projection is unusually sharp. The full correlation array over all codewords
      is projected onto the pair (tie indicator, tie multiplicity), discarding the entire correlation
      spectrum and the received word. The discard is compatible with the target operation for the
      question asked, because the convention can only influence the output where a tie occurs - on
      tie-free trials the two arms are provably identical, and the wiring gate checks exactly that.
      So the projection retains precisely the support on which the independent variable acts and throws
      away everything the independent variable cannot touch. That is the strongest form of compatibility
      available and it is what makes the pairing exact rather than approximate.
    propagation: One step of the target operation - one inner-block decode - either encounters a tie
      or does not. Where it does not, the tracked object is null and the two arms propagate identically,
      bit for bit. Where it does, the convention selects a codeword and the block-failure indicator
      F_j takes a value that depends on the convention. The propagation law is therefore a two-case
      split, and the paired estimator measures the difference on exactly the second case while the
      first contributes exactly zero to the paired variance. The next step, the outer threshold on
      S, propagates any per-block difference into a difference in the decryption-failure event.
    survival_score: 'Two steps, with a concretely measurable attenuation at each. The tie rate tau
      is the fraction of blocks where the object exists at all; conditional on a tie the probability
      that the two conventions disagree about F_j is a second measured quantity; and the induced shift
      in P[S > delta] is the third. The survival score is the product, reported as a chain: tau, then
      the conditional disagreement rate, then the induced shift in the decryption failure event with
      its paired confidence interval. If tau is below 1e-6 at realistic settings, the chain terminates
      immediately and the bound is tight and cheap - which is a good outcome, not a failed one.'
  null_object_control: 'The null object is the tie-free subpopulation, which is available in the same
    invocation and requires no separate generation: on trials where no block ties, the deterministic
    and random arms MUST produce bit-identical block-failure vectors. FOR THE SIGNAL ARM TO MEAN ANYTHING
    THE NULL MUST SHOW: zero disagreements over the entire tie-free subpopulation - a single disagreement
    there proves the arms differ somewhere other than the tie rule and voids the whole comparison.
    A second null is a two-random-arm control: run the random tie-break twice with different randomness
    and pair those, which has a known expected difference of zero and a known variance, giving the
    estimator''s own noise floor empirically rather than by formula. And a positive control: the stress
    arm at parameters where ties are common must show a detectable paired difference, otherwise the
    instrument has no demonstrated power and its null result at realistic settings is uninterpretable.'
  discriminated_from:
  - EV-HQC-469c08 and EV-HQC-927899 run matched-pair designs on a defect-injection variable (the crossed/fresh-trial-range
    injection wrapper) and report paired versus unpaired standard errors. This borrows their estimator
    discipline exactly and applies it to a different independent variable - the tie convention - which
    those runs held fixed by construction.
  - H-HQC-18d1b4 fixes the deterministic tie rule as part of its probability space and measures joint
    moments within it. The rule is a constant there and the independent variable here, so no cell
    of that experiment bears on this question.
  - IDEA-20260808-9f9ed8's second-order Bonferroni bracket on the inner ML decoder is an analytic
    bound on failure probability under a stated decoding rule; it does not distinguish tie conventions
    and would need restating if the convention mattered, which is one concrete use for this measurement.
  - A timing or side-channel study of tie handling would measure execution time. Nothing here records
    timing, so this does not enter the separate implementation-attack claim class RQ-HQC-001 keeps
    apart.
  - A generic 'decoder implementation detail' audit would enumerate conventions. This isolates one
    convention with an exact pairing that makes tie-free trials contribute exactly zero variance,
    which is what makes a rare-event convention measurable at all.
  assumptions:
  - The deployed rule is faithfully recoverable from the transcription committed under GOAL-HQC-001
    BATCH-001; if it is not, the run reports the gap and measures only the tie rate and the random-versus-random
    noise floor, which remain useful.
  - Ties are detectable exactly, i.e. the correlation array is integer-valued or exactly representable,
    so that 'tie' is not a floating-point tolerance judgement; this holds for correlation counts over
    a binary channel and is checked.
  - Decoding the same received blocks twice is deterministic apart from the tie randomness, so the
    wiring gate's zero-disagreement requirement is exactly right rather than approximately.
  - Parameters exist at which ties are common enough for the stress arm to demonstrate power.
  - No conclusion transfers to deployed parameters without a numbered heuristic, and none is offered.
  predictions:
  - metric: tie rate tau at the primary parameter set
    direction: lower
    minimum_effect: 'no pre-commitment to a magnitude, with reason: no tie rate for any decoder has
      ever been measured in this repository, so any number pre-committed would be invented. The prediction
      that IS made is directional - tau falls as the inner block length grows at fixed crossover probability
      - and it is testable across the block-length ladder.'
  - metric: disagreements between arms on the tie-free subpopulation
    direction: lower
    minimum_effect: 0.0
  - metric: paired difference in per-block failure rate, deterministic minus random tie-break, at
      the primary set
    direction: different
    minimum_effect: 0.0
  - metric: paired difference in the stress arm where ties are common
    direction: different
    minimum_effect: detection at 3 paired standard errors, so that the instrument's power is demonstrated
      before any null result at realistic settings is interpreted.
  minimal_test:
    design: 'One parameter set, one invocation, T = 10^6, three arms decoded from the SAME received
      blocks: deterministic tie-break, random tie-break with seed A, random tie-break with seed B.
      Record per-block tie indicators and multiplicities, and the three block-failure vectors. Compute:
      the tie rate; the number of disagreements on the tie-free subpopulation, which must be exactly
      zero; the paired difference deterministic-versus-random with its paired standard error; and
      the paired difference random-versus-random, which is the estimator''s empirical noise floor.
      This discriminates because the noise floor and the signal are measured on the same data with
      the same estimator, so a null result is immediately interpretable as a bound rather than as
      an absence, and because a non-zero tie-free disagreement count exposes a wiring error before
      any conclusion is drawn. Cost: minutes.'
    controls:
    - Tie-free subpopulation zero-disagreement gate, exact and fail-closed.
    - Random-versus-random paired arm giving the estimator's empirical noise floor with no theory.
    - Stress arm at tie-rich parameters as a positive control demonstrating power.
    - Paired and unpaired standard errors both reported, following the committed EV-HQC-469c08 discipline,
      so the pairing's benefit is visible rather than asserted.
    - Tie multiplicity distribution reported, since a rule's influence depends on how many codewords
      a tie involves.
    required_metrics:
    - tie rate tau and tie multiplicity distribution per parameter set
    - disagreement count on the tie-free subpopulation
    - paired difference in per-block failure rate with paired and unpaired standard errors
    - paired difference in P[S > delta] with its interval
    - random-versus-random noise floor
    - stress-arm paired difference and its significance
  falsification_conditions:
  - 'The paired difference is consistent with zero at a measured tie rate and a demonstrated instrument
    power: the convention''s influence is bounded and the bound is the recorded obstruction.'
  - 'The tie-free subpopulation shows any disagreement: the arms differ somewhere other than the tie
    rule and the comparison is void.'
  - 'The stress arm shows no detectable difference either: the instrument has no demonstrated power
    and no null result may be interpreted.'
  - 'The random-versus-random noise floor is comparable to the deterministic-versus-random signal:
    the design cannot separate them at this trial count and reports that rather than a value.'
  - 'The transcription proves incomplete about the deployed rule: only the tie rate and the noise
    floor are reported, and the gap is recorded.'
  confounders:
  - Floating-point representation of correlations turning exact ties into near-ties or vice versa;
    controlled by keeping correlations integer-valued and checking exactness.
  - Duplication multiplicity changing the correlation alphabet and hence the tie rate, so tau measured
    at one duplication says little about another.
  - The stress arm's parameters being so far from realistic that its demonstrated power does not transfer
    to the primary set.
  - Random tie-break randomness leaking into the channel realisation if the seed streams are not separated,
    which would break the pairing.
  - Rare high-multiplicity ties dominating the effect while contributing few samples, making the estimate
    tail-driven.
  interpretation_limits:
  - A measured zero effect is a licensing bound on symmetry arguments at the tested parameters, not
    a proof that the convention is irrelevant everywhere.
  - No timing behaviour is measured, so nothing here bears on the implementation-attack claim class.
  - The tie rate is a property of the block length, duplication and crossover probability at the tested
    settings and does not extrapolate on its own.
  - The result says nothing about HQC's decryption failure rate value at any parameter set.
  target_complexity:
    time_exponent: No attack exponent is claimed. Decoding each block twice doubles the constant factor
      of the inner decode; total cost remains O(T * n_e * 2^m * m).
    memory_exponent: No attack memory exponent is claimed. Storage is three block-failure vectors
      plus tie indicators per trial, streamed into counters rather than retained.
    best_known: There is no incumbent tie-rate measurement in this repository for any decoder. The
      incumbent methodology is the committed matched-pair design of EV-HQC-469c08 and EV-HQC-927899,
      whose reported pooled unpaired-to-paired standard-error ratio of 8.987228 is the benchmark this
      design's pairing must at least match to justify itself.
    hidden_overhead: 'The hidden cost is exactness of tie detection: if correlations are ever computed
      in floating point, ''tie'' becomes a tolerance and the whole exact-pairing argument softens
      into a statistical one, which is a much weaker design. Keeping the arithmetic integral through
      the fast Walsh-Hadamard transform is fiddly and is the main implementation risk. A second hidden
      cost is that a rare-event measurement with an exact zero-variance null tempts over-reading of
      small paired differences, which is why the random-versus-random floor is mandatory rather than
      optional.'
  dominated_by: n/a (no result claimed). No attack cost triple exists here, so no Pareto frontier
    row applies and 'null' would be a fabrication under AGENTS.md rule 5. On the measurement axis,
    this repository holds no competing measurement of a tie convention's influence for any scheme,
    so there is nothing to dominate or be dominated by; the committed matched-pair runs dominate on
    scale and certification but address a different variable.
  sota_delta: 'no attack; conceptual/measurement contribution only. Quantitatively: the repository
    holds zero values for tie rate, tie multiplicity and tie-convention influence; this run produces
    all three with paired confidence intervals and an empirical noise floor. The delta is the creation
    of a bound where there is currently not even an order-of-magnitude guess.'
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'By part. (i) That the tie rate is measurable and the tie-free zero-disagreement
    gate passes: ~0.9. (ii) That the tie rate at realistic settings is small enough that the convention''s
    influence is bounded well below anything the campaign currently reports: ~0.8 - this is my expected
    outcome and it is the useful one. (iii) That the stress arm demonstrates power: ~0.85, since ties
    can be made common by construction. (iv) That the deterministic convention produces a detectable
    difference at realistic settings: ~0.15. (v) That the run produces a defensible licensing bound
    on the symmetry arguments the campaign relies on: ~0.9. The proposal is priced on (v) and on the
    fact that (ii) currently has no measured basis at all.'
