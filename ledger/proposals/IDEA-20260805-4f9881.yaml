idea:
  id: IDEA-20260805-4f9881
  question_id: RQ-ECTD-001
  goal_id: GOAL-ECTD-001
  added: '2026-08-05'
  title: >-
    The queued heavy-tail screen's primary meters are class-constant in the mean
    and capped at 1.582x in the ratio: a zero-compute forced-value audit showing
    that "max/median >= 100" cannot fire on three of EXP-ECTD-001's five meters,
    that its mandatory planted control cannot be built as written, and what to
    pre-register instead

  class: control

  claim: >-
    GOAL-ECTD-001's next_action queues BATCH-003 to execute EXP-ECTD-001: a
    ">=100x class max/median" heavy-tail screen over five frozen meters, with a
    MANDATORY planted positive control whose failure voids the run. Three of the
    five meters -- semaev_m3_relation_density, semaev_m4_relation_density,
    fb_decomposition_probability -- are decomposition-yield statistics, and
    KN-FIND-007 proves, by an exact counting identity requiring no experiment,
    that the mean per-target yield of ANY factor base of size B in ANY abelian
    group of order N is binomial(B + m - 1, m) / N, independent of how the base
    is chosen. Every curve in an ordinary F_p isogeny class has the SAME N, and
    EXP-ECTD-001's own invalidation rule forces the SAME B on every curve in a
    class. Four consequences follow by arithmetic, before BATCH-003 spends a
    second of its 40 CPU-hours.
    (1) FORCED VALUE 1.000. The class-internal max/median of the TRUE mean yield
    is exactly 1, on every class, for every m, for every base convention.
    (2) FORCED CAP 1.582. For the coverage-shaped meter, KN-FIND-007 also gives
    coverage <= min(1, lambda) with lambda the forced mean, so
    max/median <= min(1, lambda) / median_coverage; if the median curve sits at
    the generic value 1 - exp(-lambda) the ratio is at most
    min(1,lambda)/(1 - exp(-lambda)), which is maximised at lambda = 1 with the
    value 1/(1 - 1/e) = 1.5820 and is BELOW 1.582 FOR EVERY lambda. The frozen
    criterion asks for 100. It exceeds the arithmetic ceiling by a factor of 63.
    (3) IDENTIFIABILITY COLLISION. Since coverage <= min(1, lambda) for EVERY
    curve, "max/median >= 100" is logically equivalent to "median <= min(1,
    lambda)/100". It is a statement that the TYPICAL curve is degenerate, not
    that the outlier is exceptional -- and the frozen decision table reads it
    only the second way. Two different ground truths produce the same observable.
    (4) THE MANDATORY CONTROL CANNOT BE BUILT. CTRL-PLANTED-OUTLIER requires
    planting a ">=100x decomp probability" outlier at fixed B and fixed N. By (1)
    and (2) no such object exists. The experiment's own invalidation rule
    ("Planted control not recovered -> void for mathematical claims") would then
    fire, and BATCH-003 would return instrument_void for arithmetic reasons that
    were knowable at zero cost.
    THE DELIVERABLE IS NOT A COMPLAINT. It is (i) the four forced values with
    their derivations, (ii) the exact (B, m, N) grid on which each fires,
    computed for the frozen 40-56 bit range, and (iii) a constructive
    replacement -- a standardised statistic with an exactly known null mean, no
    median in the denominator, and strictly greater power -- offered to the
    Coordinator, who alone may re-register a frozen contract.

  object_first_candidate:
    tracked_object: >-
      THE FIRST MOMENT OF THE DECOMPOSITION COUNT, SEPARATED FROM THE HIGHER
      MOMENTS. Track c_D(r), the number of size-m multisets from the factor base
      D summing to a target r, as a random variable over targets r; then follow
      ONLY its mean E_r[c_D(r)] across the curves of one isogeny class, and
      separately its coverage functional P_r[c_D(r) >= 1]. The object being
      followed is a moment, not a curve and not a polynomial system, and the
      whole content is that the first moment is pinned while the higher moments
      are free.
    established_families_off_limits: >-
      Off-limits as the primary lens: Groebner/Macaulay solving-degree analysis
      (this proposal deliberately does NOT touch the two meters KN-FIND-007 does
      not cover, d_reg and Macaulay rank defect, and says so); isogeny-graph
      structure; endomorphism rings and conductors; MOV/anomalous/GHS transfer;
      Pollard rho variants. Semaev summation polynomials are not off-limits and
      are not the lens either -- the identity used holds in an arbitrary abelian
      group and never opens a summation polynomial.
    newness_score: >-
      The identity is already this program's own KN-FIND-007, established
      2026-07-24 with proof_status derivation and confirmed at 144 measured
      cells. Nothing mathematical here is new. What is new is the QUANTIFIER: no
      record has applied it ACROSS AN ISOGENY CLASS, where the shared N makes it
      bite, and no record has checked a frozen decision threshold against it.
      That is exactly the kind of gap the ANGLE-BRIEF's matched-null census
      (39 control runs out of 1694; arms_and_controls in 1 spec of 195) predicts.
    testability_score: >-
      Maximal and free. Every number below is a binomial coefficient or an
      exponential; the whole audit is minutes of exact integer arithmetic in pure
      Python, in a container verified to have numpy 2.4.6 and no Sage, sympy,
      PARI or gmpy2.
    survival_score: >-
      The forced mean survives every curve in every class at every size, because
      it depends on nothing but (B, m, N). It dissolves the moment the factor
      base size is allowed to differ between curves -- which is the one degree of
      freedom EXP-ECTD-001's invalidation rules explicitly remove.

  lossy_projection_identifiability_audit:
    projection: >-
      Full configuration (curve E, its group E(F_p) of order N, factor base
      D contained in E(F_p) with |D| = B, arity m, the whole geometry of D)
      --> the single real number lambda = E_r[c_D(r)].
    what_is_discarded: >-
      The curve, the group law, the geometry of the base, and every moment of
      c_D above the first.
    why_genuinely_lossy: >-
      Extremely lossy: the fibre over an observed lambda is every curve of order
      N and every B-element base in it.
    why_compatible_with_the_operations: >-
      Perfectly compatible: sum_r c_D(r) = binomial(B + m - 1, m) because every
      size-m multiset sums to exactly one target, so the projection commutes with
      the whole relation-collection pipeline and propagates deterministically.
    is_it_only_a_change_of_coordinates: >-
      NO -- IT IS THE MIRROR FAILURE, AND FINDING IT IS THE POINT. Checked
      against both named modes. It is not the KN-LIT-7595 mode (nothing
      discarded): almost everything is discarded. It IS the mirror mode named in
      the generation contract and in KN-TECH-1a5b7e: a projection so lossy that
      it is CONSTANT ACROSS THE INSTANCES BEING COMPARED, with ZERO COMPARATOR
      SPREAD. Within one isogeny class N is fixed by Tate's theorem and B is
      fixed by EXP-ECTD-001's own invalidation rule, so lambda is literally the
      same number on every curve compared. A statistic whose comparator spread is
      zero is a constant of the apparatus, and the frozen contract's primary
      metric divides one such constant by another.

  mechanism: >-
    DERIVED IN THIS RECORD from an in-corpus result, with the corpus figures
    cited rather than re-asserted.

    THE IDENTITY (KN-FIND-007, knowledge/findings/KN-FIND-007.md, claim_tier toy,
    proof_status derivation). For a finite abelian group G of order N and a
    factor base D contained in G \ {0} with |D| = B, and for m >= 1, let c_D(r)
    be the number of size-m multisets from D summing to r. Then
        sum over r in G of c_D(r)  =  binomial(B + m - 1, m)      (exactly),
    since every size-m multiset sums to exactly one target. Hence
        lambda := E_r[c_D(r)]  =  binomial(B + m - 1, m) / N
    FOR EVERY base of size B, independently of how D is chosen. KN-FIND-007
    records this as confirmed over 144 cells at N ~ 2^14 / 2^16 / 2^18 with the
    maximum absolute deviation of the exact cell mean from the formula EXACTLY
    ZERO, and records the further consequence
        coverage := P_r[c_D(r) >= 1]  <=  min(1, lambda),
    with equality iff no target has two decompositions.

    THE QUANTIFIER THAT MAKES IT BITE HERE. By Tate's isogeny theorem all curves
    in an F_p-isogeny class have the same #E(F_p) = N, and EXP-ECTD-001's inputs
    block freezes "identical convention across all curves in a class and all null
    arms" for the factor base, with a matching invalidation rule ("Factor-base
    convention differs across curves in a class -> void"). So B and N are both
    class-constant, hence lambda is class-constant. THE MEAN YIELD METER IS THE
    SAME NUMBER ON EVERY CURVE OF THE CLASS, EXACTLY, BEFORE ANY MEASUREMENT.

    CONSEQUENCE 1 -- THE PRIMARY STATISTIC'S TRUE VALUE IS 1. The frozen primary
    metric class_max_over_median_per_meter, evaluated on the true mean yield, is
    max(lambda,...,lambda)/median(lambda,...,lambda) = 1.000000 for every class
    and every m. Any observed departure from 1 on these three meters is
    estimator noise or higher-moment variation, and the contract nowhere
    distinguishes the two.

    CONSEQUENCE 2 -- THE ESTIMATOR NOISE IS TOO SMALL TO REACH 100 ANYWAY. If a
    curve's meter is estimated from S sampled targets, the estimator has relative
    standard deviation about 1/sqrt(S*lambda). Over a class of the frozen minimum
    size 64, the max sits about 2.2 standard deviations above the median, so
        max/median  ~  1 + 2.2 / sqrt(S * lambda).
    Reaching 100 requires sqrt(S*lambda) <= 2.2/99, i.e. S*lambda <= 0.0005 --
    fewer than one expected relation per two thousand curve-screens. FORCED:
    on the three yield meters the heavy_tail_hit branch is unreachable except
    through an estimator so starved that the median is 0 and the ratio is
    undefined.

    CONSEQUENCE 3 -- THE UNIVERSAL COVERAGE CAP, AND IT IS 1.582. For every
    curve, coverage <= min(1, lambda). Therefore
        max_coverage / median_coverage  <=  min(1, lambda) / median_coverage.
    If the median curve sits at the value a structureless base gives,
    1 - exp(-lambda), the bound becomes
        cap(lambda) = min(1, lambda) / (1 - exp(-lambda)),
    which equals 1.000 in the limit lambda -> 0, 1.0836 at lambda = 0.167,
    1.1565 at lambda = 0.3, is MAXIMISED AT lambda = 1 WITH THE VALUE
    1/(1 - 1/e) = 1.58198, and decreases back toward 1 for large lambda.
        FOR EVERY lambda WHATSOEVER, cap(lambda) <= 1.5820.
    The frozen threshold is 100. It exceeds the arithmetic ceiling by 63.2x.

    CONSEQUENCE 4 -- THE OBSERVATION COLLISION. Because coverage <= min(1,
    lambda) is a HARD ceiling that no curve can exceed, the event
    "max/median >= 100" is EXACTLY the event "median <= min(1, lambda)/100".
    The observable cannot distinguish (a) an exceptional outlier from (b) a
    degenerate typical curve; both produce the same primary statistic and the
    frozen decision table maps it to heavy_tail_hit either way. This is a direct
    identifiability failure of the primary metric, in the inventor-protocol
    section 8 audit-2 sense, and it is found at zero compute.

    CONSEQUENCE 5 -- THE MANDATORY POSITIVE CONTROL IS NOT CONSTRUCTIBLE. The
    frozen CTRL-PLANTED-OUTLIER demands a curve carrying a planted ">=100x
    decomp probability" relative to the class median under the frozen meters,
    and the frozen invalidation rule voids the run if it is not recovered. By
    consequences 1-3 no such object exists at fixed (B, m, N). What CAN be
    planted, per KN-FIND-007's own recorded measurements, is the opposite:
    the H017 small-multiples base is recorded there as COLLAPSING coverage to a
    ratio of 0.0021 at 2^18 while its concentration statistic reaches 1224x.
    So the plantable effects are a coverage COLLAPSE and a CONCENTRATION spike,
    not a mean or coverage increase. THAT IS THE REPAIR, AND IT IS ALREADY IN
    THE CORPUS.

    THE CONSTRUCTIVE REPLACEMENT, OFFERED NOT IMPOSED. Since lambda is known
    EXACTLY in closed form, the right statistic needs no median at all:
        z_E = (lambda_hat_E - lambda) / sqrt(Var_hat / S),  lambda = binom(B+m-1,m)/N,
    reported per curve with the class-wide multiple-comparison correction for
    the class size, plus the two free functionals KN-FIND-007 leaves free --
    coverage (bounded above, so tested one-sided against 1 - exp(-lambda)) and
    concentration max_r c_D(r) (unbounded above, the only one of the three where
    a large ratio is even possible). A test against an exactly known null mean
    is strictly more powerful than a ratio against an estimated median, and it
    cannot be satisfied by a degenerate denominator.

  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-05'
    corpus_paths_grepped:
      - knowledge/findings/KN-FIND-007.md
      - experiments/EXP-ECTD-001/specification.yaml
      - ledger/hypotheses/H-ECTD-001.yaml
      - ledger/proposals/IDEA-20260731-016.yaml
      - ledger/goals/GOAL-ECTD-001.yaml
    grep_results:
      - >-
        KN-FIND-007 is not cited by any ECTD record: not by IDEA-20260731-016,
        not by H-ECTD-001, not by EXP-ECTD-001, not by the goal record.
      - >-
        EXP-ECTD-001's five primary meters include three yield-shaped statistics
        and its primary metric is class_max_over_median_per_meter with a frozen
        >=100x threshold and a mandatory planted >=100x positive control.
      - >-
        No ECTD record contains the words conservation, forced value, or a closed
        form for the expected yield.
    conclusion: >-
      An in-corpus derivation applied to an in-corpus frozen contract. No
      external novelty is claimed and none is checkable: KN-OPEN-3f7a21 records
      that this corpus's novelty screens see almost nothing.

  assumptions:
    - >-
      "semaev_m*_relation_density" and "fb_decomposition_probability" are
      yield-shaped statistics in the sense of KN-FIND-007 -- a mean per-target
      decomposition count or the coverage functional. THE FROZEN CONTRACT DOES
      NOT DEFINE THEM PRECISELY, and this is the audit's own biggest exposure. If
      any of the three is in fact a concentration or a rank statistic, the
      identity does not bind it and the audit's scope shrinks accordingly.
      Stage 1 reads the run driver's definitions and reports which of the three
      the identity actually covers, BEFORE any conclusion is drawn.
    - >-
      The relevant subgroup has prime order N, so every curve in the class has
      the same cyclic group up to isomorphism. With a small cofactor the identity
      still holds with N the full group order; only the numbers change.
    - >-
      The class median curve is not itself pathological. Consequence 3's cap
      1.582 uses median_coverage = 1 - exp(-lambda); if the median curve's
      coverage is genuinely far below that, the ratio can exceed 1.582 -- and
      consequence 4 is exactly the statement that in that case the finding is
      about the median, not the max. Both readings are carried, neither is
      picked.

  predictions:
    - metric: >-
        TRUE-MEAN RATIO: max over class curves of lambda, divided by the median
        over class curves of lambda, where lambda = binomial(B+m-1,m)/N is
        computed in closed form for the frozen B, m and the class N
      direction: different
      minimum_effect: >-
        EXACTLY 1.000000, on every class, every m in {3,4}, every N in the 40-56
        bit range. Zero fitted parameters. If a computed lambda differs between
        two curves of the same class, either B differs between them (a frozen
        invalidation condition) or the curves are not isogenous, and the run
        reports an INSTRUMENT FAILURE with no mathematical content.
    - metric: >-
        COVERAGE CAP: cap(lambda) = min(1, lambda) / (1 - exp(-lambda)),
        tabulated over the frozen (B, m, N) grid
      direction: lower
      minimum_effect: >-
        <= 1.5820 at EVERY grid cell, with the maximum attained at lambda = 1.
        Derived before any run; the numbers 1.0836 at lambda = 0.167 and
        1.58198 at lambda = 1 are stated so a reviewer can check them by hand.
        The frozen threshold 100 is therefore unreachable by a factor of at
        least 63.2 on the coverage meter. FALSIFIED if any grid cell yields
        cap > 1.582 -- which would mean the algebra above is wrong.
    - metric: >-
        MEDIAN-DEGENERACY EQUIVALENCE: fraction of the frozen grid at which
        "max/median >= 100" is equivalent to "median <= min(1,lambda)/100"
      direction: higher
      minimum_effect: >-
        1.000 -- the equivalence is exact wherever coverage <= min(1,lambda)
        binds, i.e. everywhere. Reported as the identifiability finding.
    - metric: >-
        PLANTED-CONTROL CONSTRUCTIBILITY: number of the three yield meters on
        which a >=100x planted positive outlier can be constructed at fixed
        (B, m, N)
      direction: lower
      minimum_effect: >-
        EXACTLY 0. This is the decisive pre-run prediction and it is the reason
        the audit should run before BATCH-003, not after. If the executor CAN
        construct one, the derivation is wrong and this record is falsified --
        which would be the most useful outcome, because it would mean the frozen
        contract is sound as written.
    - metric: >-
        ESTIMATOR CEILING: the sample size S*lambda at which
        1 + 2.2/sqrt(S*lambda) reaches 100
      direction: lower
      minimum_effect: >-
        S*lambda <= 0.0005. Stated so that the executor can compare it against
        the sample size the run driver actually uses; if the driver's S*lambda
        exceeds 0.0005 by orders of magnitude, as it must for the meter to be
        estimable at all, the heavy_tail_hit branch is unreachable on these
        meters and the contract should say so.
    - metric: >-
        SCOPE OF THE AUDIT: number of EXP-ECTD-001's five primary meters that
        KN-FIND-007 does NOT constrain
      direction: different
      minimum_effect: >-
        EXACTLY 2 -- groebner_solving_degree_d_reg and
        macaulay_rank_defect_at_first_fall. The audit deliberately says nothing
        about them, the delta_d_reg >= 2 route to heavy_tail_hit remains fully
        live, and any downstream reading of this record as "the screen is dead"
        misrepresents it.

  minimal_test:
    design: >-
      Three stages, cheapest first; stage 1 can terminate the audit.
      STAGE 1 (reading, zero compute, DECISIVE): open EXP-ECTD-001's run driver
      and record the exact definition of each of the five primary meters. Report
      which are yield-shaped. If none is, the audit stops here and reports that
      -- the identity binds nothing and BATCH-003 proceeds unchanged.
      STAGE 2 (exact integer arithmetic, minutes): tabulate lambda =
      binomial(B+m-1,m)/N, cap(lambda), the median-degeneracy threshold
      min(1,lambda)/100, and the estimator ceiling, over the frozen grid
      (N bit sizes 40, 44, 48, 52, 56) x (m in 3, 4) x (B over a declared ladder
      spanning N^{1/m} by factors of 2). Pure Python integers; no floats in the
      binomial.
      STAGE 3 (small simulation, minutes, at toy N only): a direct Monte-Carlo
      confirmation in Z/N at N = 2^14, 2^16, 2^18 -- the exact sizes KN-FIND-007
      itself used -- measuring the empirical max/median over 64 independent
      random B-subsets and comparing against cap(lambda). This is a CONFIRMATION
      of a derivation, not an extrapolation, and it is labelled so.
    controls:
      - >-
        NULL OBJECT OF THE SAME SHAPE, FORCED VALUE DERIVED PRE-RUN, CAN FAIL:
        64 independent uniformly random B-subsets of Z/N -- matched on N, on B,
        on m, and on the estimator's sample size S, and containing no elliptic
        curve at all. FORCED VALUE: identical lambda, and an observed
        max/median that must lie below cap(lambda) = 1.582. THIS NULL CAN FAIL
        in a way that matters: if the random-subset arm's max/median differs
        materially from the curve arm's at matched (N, B, m, S), then the group
        is not the whole story, curve geometry does enter, and the audit's scope
        is wrong. That would be a positive finding and the design wants it found.
      - >-
        POSITIVE CONTROL WHERE THE EFFECT MUST APPEAR: the H017 small-multiples
        base, D = {small multiples of a generator}. KN-FIND-007 records for it a
        coverage ratio of 0.0021 at 2^18 and a concentration statistic reaching
        1224x. THE INSTRUMENT MUST REPRODUCE A COLLAPSED COVERAGE AND A LARGE
        CONCENTRATION THERE, at matched B. If it does not, the implementation
        cannot see structure at all and NO NEGATIVE MAY BE REPORTED FROM ANY ARM.
        Note what this control demonstrates: the plantable effect is downward on
        coverage and upward on concentration -- never upward on the mean.
      - >-
        GRADED CONTROL, 5 INTERIOR POINTS, MONOTONICITY REPORTED: interpolate
        from the uniformly random base to the small-multiples base by replacing a
        fraction f in {0, 0.25, 0.5, 0.75, 1.0} of the base with small multiples,
        at fixed B. Report coverage and concentration at each f. FORCED: lambda
        is invariant along the ENTIRE path (it depends only on B), so a lambda
        that moves with f is an implementation error, while coverage must fall
        and concentration must rise monotonically. A quantity that fails to
        respond to the parameter meant to move it is the canonical artifact tell,
        and this arm has one quantity that must move and one that must not --
        which is a stronger test than either alone.
      - >-
        ORDERING CONTROL: the random-subset null and the small-multiples positive
        control are computed, hashed and committed before the curve arm (if any)
        is read, and the decision rule is executed on the null first.
      - >-
        ARCHIVE CHECK (zero compute): prior measurements of the same observable.
        AVAILABLE, and cited rather than re-derived -- KN-FIND-007's 144 cells at
        2^14/2^16/2^18 with maximum absolute deviation exactly 0. Stage 3 does not
        re-measure them; it extends the same instrument to the max/median ratio,
        which those cells did not report.
    required_metrics:
      - verbatim meter definitions from the run driver, per meter
      - the lambda / cap / threshold / estimator-ceiling table over the frozen grid
      - empirical max/median per arm against cap(lambda), with the arm's B, m, N, S
      - coverage and concentration along the graded path, with monotonicity reported
      - an explicit statement of which of the five meters the audit does and does not cover

  falsification_conditions:
    - >-
      An executor constructs, at fixed (B, m, N), a curve whose mean yield or
      coverage exceeds the class median by >=100x under the frozen convention.
      The derivation is then wrong, this record is withdrawn as a superseding
      correction, and EXP-ECTD-001 is sound as frozen. This is the single
      cheapest way to kill the audit and it is stated first.
    - >-
      Stage 1 finds that none of the three named meters is yield-shaped. The
      audit's scope collapses and it reports that, rather than stretching the
      identity to cover a statistic it does not cover.
    - >-
      Any grid cell yields cap(lambda) > 1.5820. The algebra of consequence 3 is
      wrong and must be re-derived before any of it is cited.
    - >-
      The small-multiples positive control fails to show a coverage collapse.
      Instrument void; no negative may be reported (AGENTS.md rule 5).
    - >-
      The random-subset null and the curve arm disagree materially at matched
      (N, B, m, S). The group-only model is incomplete, curve geometry enters,
      and the audit is scoped to the group statement only.

  confounders:
    - >-
      METER DEFINITION AMBIGUITY. This is the audit's largest exposure and it is
      named first, not last: the frozen contract lists meter NAMES, not formulas.
      "fb_decomposition_probability" could be coverage (covered by the identity),
      a per-attempt success rate (covered), or something else entirely (not
      covered). Stage 1 exists solely to remove this confounder and no conclusion
      may be drawn past it.
    - >-
      COFACTOR. If N is not prime the identity uses the full group order and the
      relevant subgroup's targets are a coset structure; the numbers change and
      the conclusion does not, but the audit must report which N it used.
    - >-
      ESTIMATOR VS TRUTH. Consequence 1 is about the TRUE mean; a run measures an
      estimate. Consequence 2 bounds the gap. Conflating the two in either
      direction is the error the audit exists to prevent, and the report must
      keep them in separate columns.
    - >-
      CRITIC ASYMMETRY. Auditing another contract is cheap and reads as rigour.
      The audit is therefore designed with a positive control that can void it,
      a falsification condition an executor can trigger in an afternoon, and a
      CONSTRUCTIVE replacement statistic -- so that a purely destructive outcome
      is not the only available one.
    - >-
      AUTHORITY. This record proposes nothing about EXP-ECTD-001's status. Only
      the Coordinator may re-register, amend, or unfreeze a contract
      (AGENTS.md rule 1), and nothing here is an amendment.

  interpretation_limits:
    - >-
      THE AUDIT COVERS THREE OF FIVE METERS AND MUST NEVER BE CITED AS COVERING
      FIVE. groebner_solving_degree_d_reg and macaulay_rank_defect_at_first_fall
      are untouched; the delta_d_reg >= 2 route to heavy_tail_hit is fully live
      and is arguably now the ONLY live route, which makes it more important
      rather than less.
    - >-
      IT SAYS NOTHING ABOUT WHETHER RARE TRAPDOOR ENDPOINTS EXIST. It says the
      three yield meters cannot detect one via a max/median ratio. A mechanism
      question is not answered by a measurement audit, and reading this record as
      evidence against H-ECTD-001 would be exactly the premature-closure failure
      mode the inventor protocol treats as symmetric with overclaiming.
    - >-
      MANDATORY FORWARD GUIDANCE: what remains open after this audit is (i) the
      two Groebner/Macaulay meters, uncovered; (ii) the CONCENTRATION functional
      max_r c_D(r), which KN-FIND-007 leaves free and which reached 1224x on a
      structured base -- an unbounded statistic where a large ratio is possible
      and which the frozen contract does not measure at all; (iii) whether any
      curve-specific structure moves coverage at fixed B, which the null arm of
      this audit tests directly.
    - >-
      Toy tier throughout. The identity is size-independent algebra, so the
      arithmetic table is not an extrapolation; the Stage-3 simulation is a toy
      confirmation and is labelled one.

  heuristic_assumptions:
    - id: HEUR-ECTD-YIELD-1
      statement: >-
        NONE LOAD-BEARING FOR CONSEQUENCES 1, 3, 4 AND 5. Those rest on
        sum_r c_D(r) = binomial(B+m-1,m) and coverage <= min(1, lambda), both of
        which are exact counting facts recorded in KN-FIND-007 with
        proof_status derivation, not distributional assumptions. This entry
        exists to record that the audit's headline is UNCONDITIONAL where every
        prior ECTD heuristic (HEUR-ECTD-TAIL-1, -VERT-1, -DDH-1) is explicitly
        unsupported by any theorem.
      rigorous_support: >-
        Every size-m multiset from D sums to exactly one element of G; and a
        target with at least one decomposition contributes at least 1 to the
        mean. Both elementary, both re-derived above.
      validation_plan: >-
        Stage 2's table is exact integer arithmetic; Stage 3 confirms at the same
        toy sizes KN-FIND-007 used, where the recorded deviation was exactly 0.
    - id: HEUR-ECTD-YIELD-2
      statement: >-
        CONSEQUENCE 2 ONLY. The per-curve meter estimator behaves like a mean of
        S weakly dependent target draws, so its relative standard deviation is
        approximately 1/sqrt(S*lambda), and the maximum of 64 such estimates sits
        about 2.2 standard deviations above the median.
      random_model_justification: >-
        A normal approximation with the 1 - 1/64 quantile of the standard normal
        at 2.24. This IS a modelling assumption and is flagged as one; it affects
        only the quantitative form of consequence 2, and consequences 1, 3, 4, 5
        stand without it.
      validation_plan: >-
        Stage 3 measures the empirical max/median over 64 random subsets directly
        and compares it against 1 + 2.2/sqrt(S*lambda). A mismatch refutes this
        heuristic and nothing else.

