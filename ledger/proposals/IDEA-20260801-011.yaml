idea:
  id: IDEA-20260801-011
  question_id: RQ-HQC-001
  title: >-
    Decoding-failure-rate model falsification at reduced parameters: measure
    the analytic model's predictions against observable failure counts
  class: measurement
  claim: >-
    HQC's IND-CCA security rests on an analytic decoding-failure-rate model
    whose predictions can be measured directly at reduced parameters where
    failures are observable: at parameters where the modeled failure rate is
    in [1e-3, 1e-1], the measured failure count over repeated decodings either
    matches the model's prediction within the statistical tolerance or departs
    from it. A measured departure at 3+ reduced parameter sets falsifies the
    model's transferability and reopens the security margin question.
  mechanism: >-
    The decoding-failure-rate model expresses the failure probability as a
    function of the code parameters; at reduced parameters the probability is
    high enough to measure directly. The measurement is a controlled decoding
    experiment with fixed random instances, comparing the empirical failure
    rate to the model's prediction, with a stated statistical tolerance.
    Because the model is load-bearing for IND-CCA, a falsified transfer would
    change the security margin estimate.
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-01'
    corpus_paths_grepped:
      - knowledge/literature
      - ledger/proposals
    grep_results:
      - No existing proposal measures HQC's failure model at reduced
        parameters in this program.
    conclusion: >-
      Measurement proposal; novelty unverified against full literature; the
      measurement approach is standard and the specific gap is this program's
      absence of the measurement.
  assumptions:
    - Reduced parameters preserve the model's functional form (scaling
      direction).
    - Failures are independently observable at the reduced rates.
  predictions:
    - metric: measured_vs_model_failure_rate_ratio
      direction: different
      minimum_effect: >-
        A ratio outside the binomial tolerance band (target: outside 3 sigma)
        at 3+ reduced parameter sets constitutes a falsification signal.
  minimal_test:
    design: >-
      Select 3+ reduced HQC-like parameter sets with modeled failure rate in
      [1e-3, 1e-1]; for each, run >= 1e5 decoding trials with fixed random
      seeds; compare empirical failure counts to the model; report ratios and
      significance.
    controls:
      - Recompute the model's prediction independently.
      - Run the same trials with a parameter where the model predicts ~0
        failures (null control).
    required_metrics:
      - empirical failure rate per parameter set
      - model prediction per parameter set
      - ratio and significance
  falsification_conditions:
    - Measured ratios within tolerance at all sets (model transfers at
      reduced scale).
    - Measured ratio outside tolerance at 3+ sets (model falsified; margin
      question reopened).
  confounders:
    - Random-instance generation differing from the model's assumptions.
    - Reduced-parameter artifacts (small-n effects) breaking transfer.
  interpretation_limits:
    - Reduced-parameter measurement only; no crypto-scale break.
    - A falsified reduced-scale transfer is not a crypto-scale falsification
      but changes the direction of the margin estimate.
  heuristic_assumptions:
    - id: HEUR-HQC-FR-1
      statement: >-
        The analytic failure-rate model's functional form is preserved under
        parameter reduction, so reduced-scale departures indicate model
        error rather than scale artifacts.
      rigorous_support: None; the standard modeling assumption, tested by the
        null control and the 3+ set trend.
      validation_plan: The null control and the trend across sets validate the
        transfer assumption.
  target_complexity:
    time_exponent: n/a (measurement)
    memory_exponent: n/a
    best_known: n/a
    hidden_overhead: n/a
    tradeoff_note: n/a
  dominated_by: null
  sota_delta: >-
    No attack claimed. Deliverable is a measured failure-rate curve that
    either supports or falsifies the load-bearing model's transfer.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
