idea:
  id: IDEA-20260808-06aae4
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-AES-001
  goal_id: GOAL-AES-001
  title: Charge MEMORY ACCESS, not memory size, in Demirci-Selcuk meet-in-the- middle attacks
    on reduced-round AES, and compute the round count at which the memory-charged cost stops
    beating exhaustive search - the crossover is a decidable number and it re-ranks every
    table-based attack shape against every table-free one.
  class: composition
  claim: Demirci-Selcuk meet-in-the-middle attacks buy time with a precomputed table of delta-set
    multisets whose size is exponential in the number of free parameters. Standard accounting
    charges the table's SIZE in memory and charges each lookup as one unit of time. CLAIM
    - under an accounting that charges memory ACCESS at the cost real hardware imposes (a
    wire-length or square-root-area cost, or at minimum a measured cache-miss cost on this
    machine), the DS-MITM cost function gains an extra multiplicative term that grows with
    table size, and there is a round count r-star at which the memory-charged DS-MITM cost
    exceeds the definitional exhaustive-key-search reference at the same round count and key
    size. THE DELIVERABLE IS r-star AS A NUMBER, computed under three accounting conventions
    - unit-cost lookup, measured-cache-miss cost on this machine, and a square-root-area wire
    cost - together with the DISSECTION-style low-memory variant's r-star under the same three.
    THE DISCRIMINATION - if r-star is the same under all three conventions, memory accounting
    does not change the ranking and this program can stop worrying about it; if r-star differs
    by two or more rounds across conventions, then every table-based attack's standing depends
    on a convention nobody has pinned, and pinning it becomes a prerequisite for any comparative
    claim this program makes.
  mechanism: The exemplar profile requires memory beside time and a time-memory tradeoff for
    every asymptotic claim, and this program's cost model CM-3 already measures peak RSS.
    DS-MITM is the AES attack family whose standing is most sensitive to that requirement,
    because its whole advantage is a table. Dissection (recalled_unverified as a Dinur-Dunkelman-Keller-Shamir
    technique for multi-encryption) gives a generic recipe for trading table size against
    time in meet-in-the-middle searches; applying it to the DS-MITM table produces a family
    of variants on a curve rather than a point. Computing r-star for each point on the curve
    turns the observation that DS-MITM uses a lot of memory from a caveat into a number.
  why_not_a_renamed_known_approach: 'Nearest known methods - DS-MITM with differential enumeration
    and the dissection technique, both recalled_unverified and both established; this record
    composes them and prices the result under three explicit conventions, which is the part
    this program needs and does not have. Nearest internal record - GOAL-AES-001 names the
    Demirci-Selcuk matching object as one of its five ESTABLISHED FAMILIES, so per the inventor
    protocol I declare it OFF-LIMITS AS THE PRIMARY LENS: the tracked object here is NOT the
    matching multiset but the MEMORY-ACCESS COST FUNCTION and its crossover round, which is
    a different object living in the cost model rather than in the cipher. Also nearest is
    IDEA-20260805-8053e1, which observes that CM-1 does not state what margin it can RESOLVE
    - the same concern one level up. LOSSY-PROJECTION TEST - the tracked object is the pair
    (table size, access pattern locality), a projection of the attack that discards the table''s
    CONTENTS entirely and keeps only its size and the locality class of its access sequence.
    Compatibility - the cost model composes over attack stages using only these two quantities,
    so the retained part propagates deterministically through the attack''s own composition.
    Genuinely lossy. PASSES. NOTE it is a projection of the ATTACK, not of the cipher state,
    and that is stated rather than blurred.'
  predictions:
  - observable: r-star under unit-cost lookup, AES-128
    metric: round count
    predicted: a specific integer, pre-registered
  - observable: r-star under measured cache-miss cost on this machine
    metric: round count
    predicted: less than or equal to the unit-cost r-star; equality would mean memory access
      is free at these table sizes, which is falsifiable by direct measurement
  - observable: r-star under a square-root-area wire cost
    metric: round count
    predicted: less than or equal to the cache-miss r-star
  - observable: spread of r-star across the three conventions
    metric: rounds
    predicted: at least 1 round; a spread of 0 is a clean negative meaning the convention
      does not matter and this whole concern can be closed
  - observable: dissection variant's position
    metric: time and memory pairs on the tradeoff curve, all three conventions
    predicted: the dissection variant dominates the plain table under the wire-cost convention
      and is dominated under unit cost - i.e. the RANKING INVERTS across conventions, which
      is the sharpest form of the record's claim
  minimal_test: (1) Write the DS-MITM cost function symbolically with table size as a parameter,
    for r = 5, 6, 7 on AES-128/192/256. (2) MEASURE the per-access cost on this machine as
    a function of table size, by timing random reads into arrays from 2^10 to 2^30 entries
    - this is a direct measurement, not a model, and it is affordable. (3) Instantiate the
    three conventions and compute r-star for each. (4) Add the dissection variant and recompute.
    (5) Report the ranking under each convention side by side, with the convention named in
    every sentence.
  controls:
  - Sequential-access control alongside random-access when measuring per-access cost, so the
    measured penalty is attributable to locality and not to bandwidth.
  - A table-free baseline (exhaustive search over the same residual) measured on the same
    machine, which the campaign has already done once and found DOMINATED the r=6 recovery
    - that precedent is exactly the pattern this record generalises.
  - Reporting all three conventions always; publishing only the most favourable one is the
    failure mode this record exists to prevent.
  confounders:
  - Measured cache-miss cost on this machine is a property of this machine and does not transfer;
    the wire-cost convention is the one intended to be machine-independent, and the two must
    never be merged.
  - DS-MITM parameter choices are themselves optimised against a cost model; re-pricing without
    re-optimising the parameters biases against the attack. The re-optimisation must be done
    under each convention.
  - Dissection's applicability to the DS-MITM table structure is not automatic and must be
    checked rather than assumed - the table is not a plain multi-encryption.
  falsification_conditions:
  - Spread of r-star across conventions is 0 - memory accounting does not change the ranking;
    a clean and useful negative.
  - Dissection does not apply to the table structure - the low-memory arm dies and only the
    pricing arm survives.
  - Re-optimising parameters under the wire-cost convention restores the plain table's dominance
    - the ranking inversion does not occur and the claim's sharpest form is refuted.
  interpretation_limits: Reduced-round, RQ-AES-001 ceiling. This re-prices attack shapes;
    it does not produce an attack and does not claim any margin against the published state
    of the art. A crossover round r-star is a statement about the cost model and the round
    count actually analysed.
  assumptions:
  - CM-3's measured peak RSS and the machine's measured throughput are available (GOAL-AES-003
    records both).
  - DS-MITM's parameterisation can be written down from this program's own understanding without
    relying on a specific published table of complexities, since no published figure may be
    cited as authority here.
  heuristic_assumptions:
  - id: HA-1
    statement: FOR ALL table sizes S in the range of interest, the per-access cost on this
      machine is a + b*log(S) or a + b*sqrt(S) for constants a, b to be fitted, uniformly
      over access patterns of the same locality class.
    rigorous_ingredient: None mathematical; this is an empirical hardware law and is labelled
      as such rather than dressed as a theorem. What IS rigorous is that any monotone increasing
      cost function suffices for the qualitative crossover claim, so the record does not depend
      on the fitted form.
    distribution_imitated: not applicable - a hardware cost law.
    validation_route: Measure directly over table sizes from 2^10 to 2^30, both random and
      sequential access, fit both candidate forms, and report which fits better AND the residuals.
      This is a MEASUREMENT at the sizes that matter, not an extrapolation.
    tail_checks: Report the largest table size actually measured and state explicitly that
      any r-star depending on sizes beyond it is an EXTRAPOLATION, labelled as such - the
      campaign has been caught once already by an instrument roughly 30 bits too blunt (RQ-AES-003
      R4(1)) and this is the same failure shape.
  - id: HA-2
    statement: the square-root-area wire cost is the right machine-independent convention
      for large memories.
    rigorous_ingredient: It is the standard full-cost-accounting convention (KN-TECH-035,
      full cost accounting charging memory, wiring and communication, is already in this program's
      technique corpus).
    distribution_imitated: not applicable.
    validation_route: Not empirically validatable here; it is a CONVENTION and the record's
      discipline is to report all three rather than to pick one. Stated so no reader mistakes
      a convention for a measurement.
    tail_checks: not applicable; instead, every reported r-star names its convention in the
      same sentence.
  target_complexity:
    time_exponent: No new attack. The record computes, per convention, the round count r-star
      at which DS-MITM's charged cost crosses the definitional exhaustive-key-search reference
      (REF-A). The claimed movement is in the RANKING of existing shapes, not in any exponent.
    memory_exponent: This IS the memory-exponent record of the slice. It reports memory beside
      time for every shape and produces the tradeoff curve the exemplar profile requires,
      including the dissection arm's reduced memory at increased time.
    best_known_baseline: REF-A definitional exhaustive key search, and the campaign's own
      measured brute-force-over-residual baseline which already DOMINATED its r=6 recovery
      (69.39 s against about 25 s) - a committed precedent that this exact effect is real
      at small scale.
    hidden_overhead_disclosure: Measured cache costs are machine-specific and do not transfer;
      wire costs are a convention, not a measurement. Neither may be presented as the answer,
      and the record's whole point is that presenting one of them alone is the error.
    time_memory_tradeoff: central and explicit - the deliverable is a curve under three conventions,
      plus the dissection arm.
  sota_delta: Zero attack delta. The delta is a re-ranking under honest accounting, and a
    number (r-star, and its spread across conventions) where this program currently has an
    unstated convention. Given that GOAL-AES-002's red team brief names the cost model as
    the object most worth attacking, and that GOAL-AES-001's first red-team pass destroyed
    the campaign's only cost model, this is a targeted repair rather than a new frontier.
  dominated_by: IDEA-20260805-8053e1 (CM-1 does not state the margin it can resolve) is adjacent
    and dominates on the RESOLUTION question while saying nothing about access cost; IDEA-20260807-8e20fe
    and catalogue A3-1 (two implementations of one candidate, counted reads versus measured
    seconds) is the closest instrument and dominates on the counted-versus-measured axis for
    a SINGLE construction, while this record spans a FAMILY under three conventions. KN-TECH-035
    supplies the convention and is not a competitor. Checked all three plus the campaign's
    committed r=6 domination precedent.
  estimated_cost: Implementation LOW-MEDIUM; compute LOW (the access-cost measurement is minutes);
    one producer slot.
  recommended_priority: medium
  honest_prior_of_survival: Spread of r-star at least 1 round across conventions - 0.6. Ranking
    inversion between the plain table and the dissection arm - 0.35. Dissection applying cleanly
    to the DS-MITM table - 0.45. A determinate, archivable number for r-star under all three
    conventions - 0.85. Ranked medium because the deliverable is a cost-model repair rather
    than a cryptanalytic movement, and the program has already spent heavily on cost-model
    work.
  novelty_status: unverified
  novelty_class: adaptation
  novelty_screen: CATALOGUE_TITLES.txt (no memory-accounting entry for AES; A3-1's counted-reads-versus-measured-seconds
    is the nearest in spirit and is about one construction); EXISTING_PROPOSALS.txt IDEA-20260805-8053e1,
    IDEA-20260807-8e20fe, IDEA-20260805-72ec9a; EXISTING_HYPOTHESES.txt H-AES-9512e6 (reliability
    of converting counted table-reads into measured seconds for two implementations - THE
    CLOSEST RECORD, and the difference is that it validates a conversion for one pair of implementations
    while this computes a crossover round for a family under three conventions); KNOWLEDGE_BARRIERS.txt
    KN-TECH-035 (full-cost accounting, the convention source) and KN-TECH-044 (charging memory
    in lattice attacks, the same move in a different domain, cited as precedent that the move
    is standard elsewhere and absent here). EXTERNAL LITERATURE NOT SCREENED.
  discriminated_from: H-AES-9512e6 and IDEA-20260807-8e20fe validate the counted-to-measured
    conversion for two implementations of ONE candidate; this computes r-star across a FAMILY
    under three named conventions and reports the ranking inversion. KN-TECH-035 and KN-TECH-044
    are the general convention and its use in lattice cryptanalysis; this instantiates it
    for AES DS-MITM, where this program has never applied it.
