idea:
  id: IDEA-20260816-5c9c46
  question_id: RQ-SIMSPK-f6a6c0
  added: '2026-08-16'
  title: 'Run the control before the experiment and ask a different question of it: score structurally
    identical ciphers with uniformly drawn rotation constants through the entire portfolio FIRST,
    then publish each measure''s RESOLUTION, meaning how many distinct values it takes over the whole
    space and in which round-count window, because a measure returning three integers over 4096 constants
    cannot rank them.'
  class: control
  claim: '(A) RQ-SIMSPK-f6a6c0 and GOAL-SIMSPK-001 both require a random-constant null family before
    any anomaly is reported, and both frame it as establishing the spread each measure produces when
    there is nothing to find. This proposal accepts that requirement and adds the question that makes
    the null actionable rather than ceremonial: not what spread does the measure produce, but does
    the measure have enough RESOLUTION to rank anything at all, and over which round counts. (B) The
    claim is that resolution is the binding constraint on this whole campaign and is currently unmeasured.
    Every portfolio measure returns an integer: a trail weight, a round count, a reach. Over 4096
    constants a measure taking k distinct values partitions the space into at most k tie groups, and
    a percentile rank inside a tie group of size 3000 is not a rank, it is a tie-break. The claim
    is that k, and the round-count window in which k is large, are directly measurable on the null
    family alone, before any real constant is scored, and that they should gate which measures enter
    the portfolio. (C) The claim predicts a specific shape: resolution as a function of round count
    rises from a floor, where every constant has the same tiny weight and everything is tied, peaks
    in a middle window where the measure discriminates, and collapses as every constant saturates
    at the measure''s ceiling. Outside that window a ranking is noise, and the window''s location
    and width differ per measure. (D) The claim is that the deliverable is a per-measure licence:
    the round-count interval within which that measure may be used to rank, with its resolution, stated
    before any real constant is scored. (E) NOT CLAIMED: that a measure with low resolution is useless,
    since a coarse partition can still separate groups; that resolution is the only quality a measure
    needs; that the window measured on random constants is identical to the window on designed ones;
    that any constant is anomalous; and no attack, distinguisher or security consequence.'
  mechanism: 'STAGE A, draw the null family: sample M rotation constant sets uniformly from the constant
    space at each tested word size, with a recorded seed and the draw order logged, and pin structurally
    identical cipher instances differing only in those constants. STAGE B, score exhaustively across
    round counts: run every portfolio measure on every null member at every round count from 1 to
    the declared ceiling, recording exact values, censoring flags and budgets. Critically, this happens
    before any real constant is scored, and the run record shows the ordering. STAGE C, resolution
    curve: for each measure and each round count, compute k, the number of distinct values over the
    null family; the normalized entropy of the value histogram; the size of the largest tie group;
    and the fraction of the family inside it. Report all four as functions of round count. STAGE D,
    window extraction: define the usable window per measure as the maximal interval of round counts
    where k exceeds a declared floor and the largest tie group holds less than a declared fraction,
    with both thresholds frozen in advance, and report the window''s location and width. STAGE E,
    calibration of the resolution estimator itself against two objects with known answers: a degenerate
    measure that is constant by construction, such as block size, which must give k = 1 and entropy
    0; and a maximal measure, a fresh pseudorandom tag per constant, which must give k = M and entropy
    1. STAGE F, ceiling and floor diagnosis: for each measure report what fraction of the collapse
    at large r is saturation at the measure''s ceiling versus censoring, since the two look identical
    in a value histogram and mean opposite things.'
  novelty_status: unverified
  novelty_screen:
    method: grep -ril SIMSPK over ledger/proposals, ledger/hypotheses and experiments; grep -ril 'resolution'
      and 'tie' over ledger/proposals with hits sampled by area; grep -ril 'null family|null object|controlled
      null' over ledger and knowledge; read RQ-SIMSPK-f6a6c0's fourth target and third constraint,
      both of which make the random-constant null family a precondition rather than a robustness check;
      read GOAL-SIMSPK-001's second completion criterion and its next_action, which states the first
      technical gate is the null family run before the real constants are scored at all; read docs/inventor-protocol.md
      section 3 on controls before belief.
    results: No prior proposal under this question. The repository contains many null-object controls,
      and docs/inventor-protocol.md section 3 makes running the identical measurement against a null
      object a standing obligation, but the corpus's nulls are used to answer does the effect survive
      a control. No record found asks whether the MEASURE has resolution, which is a property of the
      null family alone and is answerable without any signal arm. The AES campaign's structure-free
      sieve nulls, which this program treats as established, are the closest in spirit and are also
      effect-oriented rather than resolution-oriented. RQ-SIMSPK-f6a6c0's fourth target and GOAL-SIMSPK-001's
      next_action both mandate the null family first, and GOAL-SIMSPK-001 says explicitly that running
      it afterwards would let a result be interpreted before its control exists; neither states what
      to compute from it beyond spread, which is the gap this entry fills.
    verdict: 'UNVERIFIED. No claim is made about what any external publication contains. Assembled
      from known parts: counting distinct values, histogram entropy and tie-group sizes are elementary
      descriptive statistics; the requirement to run a null family first is already the RQ''s and
      the goal''s, not this proposal''s. Claimed new only in combination and only locally: treating
      the null family as a measurement of the INSTRUMENT rather than of the effect, deriving a per-measure
      round-count licence from it before any real constant is scored, and calibrating the resolution
      estimator against a constant measure and a maximal-entropy measure whose answers are known by
      construction.'
  object_first_candidate:
    tracked_object: 'The per-measure empirical value histogram over the null family at a given round
      count: the multiset of values that measure m returns across M uniformly drawn constant sets.
      What is followed is the histogram''s shape, summarized by the number of distinct values k, the
      normalized entropy, and the largest tie group''s share, and what is followed THROUGH is the
      round count, so the object is a family of histograms indexed by r.'
    lossiness: 'Genuinely lossy. The histogram discards which constant produced which value, collapsing
      M labelled results into an unlabelled multiset, and the summary statistics discard the histogram''s
      shape beyond four numbers. That discard is compatible with the operation of interest because
      the question asked is about the measure and not about any constant: resolution is by definition
      a property of the value multiset, invariant under relabelling the constants, so the projection
      loses exactly the information a resolution question cannot use. It is worth stating plainly
      that a different question, such as which constants are extreme, would be destroyed by this projection,
      which is why this contract deliberately does not ask it and hands that question to the max-statistic
      contract instead.'
    propagation: 'The target operation is incrementing the round count by one. Under it the histogram
      evolves: at small r the measure''s values are bounded by a small maximum so the histogram is
      concentrated on few values; as r grows the reachable value range widens and the histogram spreads,
      raising k and the entropy; as r grows further every constant reaches the measure''s ceiling,
      or its search gets censored, and the histogram re-concentrates at the top. One step therefore
      acts on the four summary statistics in a way that is monotone in neither direction, and the
      non-monotonicity is exactly the predicted shape whose peak defines the usable window.'
    survival_score: 'The usable window itself is the survival score, stated concretely as the maximal
      interval [r_lo, r_hi] of round counts on which k exceeds the declared floor of 8 distinct values
      and the largest tie group holds less than 40 percent of the null family, both thresholds frozen
      in advance. Its width r_hi minus r_lo plus one is a single integer per measure per word size
      and is the number this contract exists to produce. A measure with an empty window at a word
      size has no licence to rank there, and that is a reusable measured obstruction rather than a
      failure: it tells every later session not to spend budget ranking constants under that measure
      at that scale, with a number attached rather than an impression.'
  null_object_control: 'The null family IS the object here, which inverts the usual arrangement and
    requires its own controls, since a measurement whose subject is a null needs calibration rather
    than a further null. Two calibration objects with known answers run in the same invocation. First,
    a degenerate measure that is constant by construction across the family, for which the block size
    is used: it must return k = 1, normalized entropy 0, and largest-tie-group share 1.0 at every
    round count, and any deviation means the resolution estimator is fabricating variation. Second,
    a maximal measure, a fresh pseudorandom tag drawn independently per constant from a seeded generator:
    it must return k equal to M up to birthday collisions, normalized entropy near 1, and largest-tie-group
    share near 1/M. These two bracket the estimator and must both pass before any portfolio measure''s
    resolution is reported. A third control, run per measure, is a duplicate-draw check: score the
    same constant twice under different draw orderings and confirm identical values, since a measure
    that is not deterministic would inflate k spuriously.'
  discriminated_from:
  - The random-constant null family required by RQ-SIMSPK-f6a6c0's fourth target and GOAL-SIMSPK-001's
    second completion criterion, which is the same data used to answer a different question. That
    requirement asks what spread a measure produces so an anomaly can be judged; this entry asks whether
    the measure can rank at all, which gates whether the anomaly question is even askable. Both are
    computed from one null run and neither replaces the other.
  - The max-statistic contract, which uses the same null draws to build a corrected percentile for
    the standardized triple. That contract needs a signal arm; this one deliberately has none and
    produces its output before any real constant is scored, which is what makes it a gate rather than
    an analysis.
  - The AES structure-free sieve nulls, which this program treats as established and which test whether
    an observed effect survives a matched control. Those are effect-oriented and require a signal;
    this is instrument-oriented and forbids one.
  - 'A power analysis, which asks how large an effect a design could detect. Resolution is upstream
    of power: a measure with three distinct values has no effect size scale on which power could be
    computed, and the two are not substitutes.'
  - 'IDEA-20260815-ad4b55, which measures the spread of Groebner solving degree across monomial orders
    before a scaling law is fitted. Same instinct of measuring the instrument''s variability first,
    different object and different failure mode: that entry measures disagreement between instrument
    settings, this one measures a single instrument''s discriminating granularity.'
  assumptions:
  - Each portfolio measure is deterministic given a constant, a round count and a budget, so repeated
    scoring returns identical values; this is checked by the duplicate-draw control rather than assumed.
  - Uniform draws from the constant space are the right null. If the symmetry-quotient contract has
    run, draws are uniform over orbit representatives weighted by multiplicity; otherwise uniform
    over the raw grid, with the choice recorded, since the two give different histograms.
  - Censoring is recorded per cell so that a collapse in resolution at large r can be attributed to
    saturation or to budget rather than left ambiguous.
  - The resolution thresholds, 8 distinct values and 40 percent maximum tie-group share, are declared
    and frozen before any scoring; they are conventions rather than truths and are stated as such
    so a later reader can recompute the window under different thresholds from the published histograms.
  - M is large enough that k is not limited by M itself; the contract reports k alongside M and flags
    any measure where k approaches M, since resolution cannot then be distinguished from sample size.
  predictions:
  - metric: distinct-value count k for the degenerate calibration measure (block size) at every round
      count
    direction: lower
    minimum_effect: 1
  - metric: normalized entropy of the maximal calibration measure (pseudorandom tag per constant)
    direction: higher
    minimum_effect: 0.95
  - metric: shape of the resolution curve k(r) for each portfolio measure
    direction: different
    minimum_effect: 'forced shape prediction: k(r) is predicted to be non-monotone with an interior
      maximum, rising from a small-r floor and collapsing at large r. A measure whose k(r) is monotone
      increasing across the entire reachable range falsifies the shape claim for that measure and
      means the ceiling was never reached within budget, which must be reported as a budget outcome
      rather than as unlimited resolution.'
  - metric: width of the usable window r_hi minus r_lo plus one, per measure per word size
    direction: different
    minimum_effect: 'explicit refusal to pre-commit: the campaign has never computed resolution for
      any of these measures, so a predicted width would be invented. What is pre-committed is that
      the window is reported per measure with its thresholds, that an empty window is reported as
      empty rather than widened by relaxing thresholds after the fact, and that the full histograms
      are published so any reader can recompute under other thresholds.'
  - metric: fraction of the large-r resolution collapse attributable to censoring rather than to ceiling
      saturation
    direction: different
    minimum_effect: 'forced reporting rule: the split is reported per measure whatever it is, and
      a collapse that is majority-censoring is labelled a budget outcome and may never be described
      as the measure saturating.'
  minimal_test:
    design: 'The minimal test needs no real constants at all, which is what makes it cheap and what
      makes it a gate. Fix word size n = 8 and M = 512, which at n = 8 is the entire constant space,
      so the null family is not a sample but the population and k is exact rather than estimated.
      Score every portfolio measure that has a validated contract on all 512 constants at every round
      count from 1 to that measure''s declared ceiling, recording values and censoring flags. Compute
      k, normalized entropy, largest tie-group share and its membership fraction per measure per round.
      Run the two calibration measures, block size and pseudorandom tag, through the identical pipeline,
      and the duplicate-draw determinism check on a 10 percent subsample. Extract the usable window
      per measure under the frozen thresholds. Total cost is dominated by the portfolio measures themselves
      rather than by this contract''s arithmetic, which is milliseconds. The discriminating outputs
      are the two calibration results, which must bracket at k = 1 and k near M, and the per-measure
      window widths: any measure with an empty window at n = 8 is disqualified from ranking there
      before a single real constant is scored, which is the cheapest possible way to learn it.'
    controls:
    - Degenerate calibration measure, block size, constant across the family, which must return k
      = 1 and entropy 0 at every round count.
    - Maximal calibration measure, a seeded pseudorandom tag per constant, which must return k near
      M and normalized entropy near 1.
    - Duplicate-draw determinism check on a 10 percent subsample, confirming each measure returns
      identical values on repeat scoring.
    - 'Censoring attribution: the large-r collapse is decomposed into ceiling saturation and budget
      censoring, since the two are indistinguishable in a bare histogram.'
    - 'Threshold sensitivity: the usable window is recomputed at three declared threshold pairs and
      all three are reported, so the window''s dependence on a convention is visible rather than hidden.'
    required_metrics:
    - distinct-value count k per measure per round count, with M reported alongside
    - normalized entropy of the value histogram per measure per round count
    - largest tie-group size and its share of the null family, per measure per round count
    - usable window [r_lo, r_hi] and its width per measure per word size, at each of three threshold
      pairs
    - censoring rate per measure per round count, and the censoring-versus-saturation decomposition
      of any large-r collapse
    - 'calibration results: k and entropy for the degenerate and maximal measures'
    - duplicate-draw determinism mismatches, an exact integer that must be zero
    - wall-clock seconds and peak resident memory per measure
  falsification_conditions:
  - The degenerate calibration measure returning k greater than 1, which shows the resolution estimator
    fabricates variation and voids every reported k.
  - The maximal calibration measure returning normalized entropy below 0.95, which shows the estimator
    compresses genuine variation.
  - Any duplicate-draw determinism mismatch, which means a measure is not deterministic and its k
    is partly noise.
  - k approaching M for a portfolio measure, which means resolution is limited by sample size rather
    than measured, and the arm must be rerun with the full space or a larger M.
  - A monotone increasing k(r) across the entire reachable range for a measure, falsifying the predicted
    shape and indicating the ceiling was never reached within budget.
  - An empty usable window for every portfolio measure at every tested word size, which would mean
    the campaign has no measure licensed to rank anything at reachable scale; this is a clean and
    highly consequential measured obstruction rather than a failure of the contract.
  confounders:
  - Censoring and ceiling saturation produce identical-looking histogram collapse and mean opposite
    things, one a budget outcome and one a property of the measure; the decomposition metric exists
    solely to separate them and its omission would be the single most misleading possible reporting
    choice here.
  - Drawing from the raw grid rather than from orbit representatives inflates apparent resolution
    by counting symmetric duplicates as distinct constants when their values are identical, which
    paradoxically lowers k relative to the number of draws; the record states which was used.
  - M smaller than the constant space makes k a sample statistic whose expectation grows with M, so
    comparing k across word sizes with different M is meaningless unless normalized; the entropy metric
    is reported precisely because it is less M-dependent than k.
  - A measure with a very coarse but well-separated partition, for example three groups of nearly
    equal size, has low k yet real discriminating power for a group-level question; the largest-tie-group
    share is reported so this case is distinguishable from a degenerate one.
  - Freezing thresholds in advance is essential but the thresholds are conventions, and a window that
    appears or vanishes under a small threshold change is fragile; the three-threshold sensitivity
    arm exposes exactly that.
  interpretation_limits:
  - Resolution measured on uniformly drawn constants is a property of the measure over the whole space.
    It does not establish that the measure discriminates in the neighbourhood of any particular constant,
    and a measure with a wide window may still tie the standardized triple with hundreds of others.
  - An empty window disqualifies a measure from ranking at that word size and round range only. It
    is not a statement that the measure is meaningless, that no constant differs under it, or that
    the direction is closed.
  - Nothing here is a statement about any constant, about security, or about design in any direction,
    because no real constant is scored in this contract at all.
  - The windows are scoped to the tested word sizes, the declared budgets and the frozen thresholds;
    a different budget changes the censoring and therefore the window, which is why censoring is reported
    per round count.
  - A measure passing this gate is licensed to rank, not validated as correct; correctness is its
    own contract's business and the two must not be confused.
  target_complexity:
    time_exponent: No attack exponent is claimed. This contract's own arithmetic is O(M log M) per
      measure per round count for the sorting and histogram, milliseconds; the cost is entirely inherited
      from running the portfolio measures across M constants and all round counts, which is the same
      order as one full null-family sweep the RQ already requires.
    memory_exponent: No attack memory exponent is claimed. Storage is M values per measure per round
      count, at M = 512 and 5 measures and 20 round counts about 51200 numbers, well under one mebibyte.
    best_known: The incumbent is the null family as the RQ and goal already specify it, reported as
      spread. That incumbent answers what variation a measure shows and is silent on whether the variation
      is fine-grained enough to support a rank. No algorithmic frontier is contested and no instrument
      is being replaced; this adds four descriptive statistics to a run the campaign is already obliged
      to perform.
    hidden_overhead: 'Almost all the cost is inherited from the portfolio measures, so the temptation
      is to compute resolution only for the cheap ones and assume the expensive ones are fine, which
      would defeat the gate exactly where it matters most. Hidden in the human cost: freezing the
      thresholds before seeing the histograms, and reporting an empty window as empty rather than
      relaxing a threshold until a window appears. Hidden in the reporting: publishing the full histograms,
      not only the summary statistics, so a later reader can recompute under different conventions.'
  dominated_by: 'n/a (no result claimed). A real Pareto check was performed across time, memory and
    data/queries: no attack, distinguisher or query-bounded procedure is produced, so no frontier
    row exists on any axis. As an instrument-assessment procedure there is no competing method in
    this corpus to be dominated by, and the only cost comparison available is against the null-family
    sweep the campaign must run regardless, on top of which this contract adds a negligible constant.'
  sota_delta: no attack; conceptual/measurement contribution only. The quantitative deliverables are,
    per measure per word size, the distinct-value count k as a function of round count, the normalized
    entropy, the largest tie-group share, and the usable window's width as an integer, together with
    the calibration bracket k = 1 and k near M. No time, memory or data complexity is compared against
    any cryptanalytic frontier because none is produced.
  estimated_cost:
    implementation: low
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'Part (A), that the null family must run first: 0.99, it is already the
    RQ''s third constraint and the goal''s stated first technical gate, so this is not a claim of
    this proposal so much as compliance with one. Part (B), that resolution is currently unmeasured
    and is the binding constraint: 0.8, since every portfolio measure returns an integer and no record
    in this corpus reports a distinct-value count for any of them. Part (C), the non-monotone rise-and-collapse
    shape of k(r): 0.65, with the main risk being that budgets stop the sweep before the ceiling is
    reached, in which case k(r) looks monotone and the honest report is a budget outcome. Part (D),
    that at least one portfolio measure turns out to have an empty or very narrow window at reachable
    word sizes: 0.55, and this is the outcome with the highest value to the campaign, because it would
    redirect budget before it is spent. That every measure has a comfortable window: 0.2, which would
    be a clean and welcome result licensing the rest of the portfolio.'
