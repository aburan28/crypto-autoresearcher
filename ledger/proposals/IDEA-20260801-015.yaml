idea:
  id: IDEA-20260801-015
  question_id: RQ-QRUOV-001
  title: >-
    Quotient-ring compression neutrality test: security comparison of
    QR-UOV's compressed keys against matched uncompressed UOV
  class: control
  claim: >-
    QR-UOV's quotient-ring key compression is security-neutral if and only
    if a matched toy comparison — QR-UOV-style compressed keys vs
    uncompressed UOV keys of the same underlying parameters — shows no
    material difference in best-known key-recovery attack cost. A controlled
    toy experiment measuring this ratio either confirms compression
    neutrality or shows that the quotient-ring structure leaks information
    beyond the uncompressed key.
  mechanism: >-
    Key compression in QR-UOV replaces part of the public key with a
    quotient-ring representation; if the quotient structure is invertible
    (publicly recoverable), neutrality holds trivially; if it discards
    information, the discarded structure may or may not affect attack cost.
    The toy comparison runs the same attack on both key types with matched
    parameters and measures the cost ratio.
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-01'
    corpus_paths_grepped:
      - knowledge/literature
      - ledger/proposals
    grep_results:
      - No existing proposal runs a matched compression-neutrality toy
        control for QR-UOV in this program.
    conclusion: >-
      Control experiment; novelty unverified against full literature, which
      is the point of the control.
  assumptions:
    - Toy parameters permit matched compressed and uncompressed instances.
    - The best-known attack at toy sizes is implementable on both.
  predictions:
    - metric: compressed_vs_uncompressed_attack_cost_ratio
      direction: different
      minimum_effect: >-
        A ratio outside [0.5, 2] at the largest toy size is a measurable
        compression-security effect.
  minimal_test:
    design: >-
      Build matched toy QR-UOV and plain-UOV instances (same field,
      variables, equations); run the same best-known attack on both;
      measure cost and success probability; report the ratio over multiple
      seeds.
    controls:
      - Same attack code on both key types.
      - Matched parameters.
      - Public-recovery check verifying that the compressed key publicly
        recovers the uncompressed one (the neutrality baseline).
    required_metrics:
      - attack cost per key type
      - success probability per key type
      - public-recovery outcome
  falsification_conditions:
    - Ratio ~1 with successful public recovery (compression neutral).
    - Ratio < 1 or public recovery fails (compression affects security or is
      lossy).
  confounders:
    - Toy sizes where all MQ instances solve trivially.
    - Quotient-ring parameter choices that change the comparison.
  interpretation_limits:
    - Toy control only; no crypto-scale claim about QR-UOV's parameters.
    - Neutrality at toy scale does not prove crypto-scale neutrality.
  heuristic_assumptions:
    - id: HEUR-QRUOV-NEUT-1
      statement: >-
        The relative attack cost of compressed vs uncompressed UOV keys at
        toy sizes is directionally representative of larger sizes.
      rigorous_support: None; heuristic, tested by the toy-size trend.
      validation_plan: Run the control at 2-3 toy sizes and check the ratio
        trend.
  target_complexity:
    time_exponent: n/a (control)
    memory_exponent: n/a
    best_known: n/a
    hidden_overhead: n/a
    tradeoff_note: n/a
  dominated_by: null
  sota_delta: >-
    No attack claimed. Deliverable is a measured compression-neutrality ratio
    that decides whether QR-UOV's key compression is security-neutral.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
