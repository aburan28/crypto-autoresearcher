idea:
  id: IDEA-20261007-1bcdf3
  added: '2026-10-07'
  status: proposed
  approved_by: null
  question_id: RQ-SSI-001
  title: >-
    The Vélu codomain of the kernel (0,0) on y^2 = x^3 + x over F_19
    has j in F_19 and different from the domain j
  class: measurement
  claim: >-
    Toy instance only. On E: y^2 = x^3 + x over F_19 the point (0, 0)
    is rational 2-torsion. The Vélu 2-isogeny with that kernel has a
    codomain short-Weierstrass model whose j-invariant lies in F_19
    and is not the j-invariant of E. The shifted curve
    y^2 = x^3 + x + 1 does not contain (0, 0); applying Vélu there is
    an invalid instrument, not a codomain. This is one isogeny from
    one kernel. It is not a path search and the rho exponent stays 1/2.
  mechanism: >-
    PAIR. Representation: the j-invariant of the Vélu codomain.
    Operation set Sigma is the singleton {the 2-isogeny with kernel
    generated by (0, 0)}. Sigma is not translation. Trichotomy:
    partial-action, because the isogeny is defined on this kernel and
    does not read a secret scalar. Lossy-projection test: discard the
    kernel polynomial coefficients beyond the codomain j. The open
    number is whether that j is rational and distinct from the domain j.
  novelty_status: unverified
  citations:
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Isogenous curves share the group-structure invariants Tate's
        criterion names. This proposal records one codomain j and does
        not walk to a weak curve.
      verified_by: coordinator session 2026-10-07 opened knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
    - ref: KR-IC-b0fcda
      provenance: internal
      claim: >-
        Frobenius-invariant factor bases speed subfield index calculus.
        This proposal does not build a factor base.
      verified_by: coordinator session 2026-10-07 opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-b0fcda.yaml
  assumptions:
    - (0, 0) lies on y^2 = x^3 + x and has order 2. That is y = 0 and 2P = O.
    - Vélu's formulas for a rational kernel of degree 2 produce a codomain over the same field. Recalled, not re-derived.
  proof_search_map:
    not_applicable_reason: One codomain j, not a path-finding proof.
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
  predictions:
    - metric: 1 if the codomain j is in F_19 and differs from the domain j, else 0
      direction: higher
      minimum_effect: equal to 1
  minimal_test:
    design: >-
      Confirm (0, 0) is on E and 2(0, 0) = O. Apply Vélu. Reduce the
      codomain to short Weierstrass, compute j, and compare with j(E)
      in F_19. Confirm (0, 0) is not on y^2 = x^3 + x + 1 before
      accepting the codomain.
    controls:
      - >-
        Domain point control: (0, 0) on E, not on y^2 = x^3 + x + 1.
        A failure invalidates the instrument.
      - >-
        Order control: 2(0, 0) = O on E. A failure invalidates the kernel.
    required_metrics:
      - codomain_j_in_F19
      - codomain_j_equals_domain_j
      - kernel_point_on_shifted_curve
  falsification_conditions:
    - The codomain j is not in F_19.
    - The codomain j equals the domain j.
    - The kernel controls fail. That run is invalid, not support and not a falsification.
  confounders:
    - An isomorphic model can change A and B and keep j. Compare j, not the coefficients.
    - A quadratic twist of the codomain shares j. The claim is about j, not the point count.
  interpretation_limits:
    - One rational codomain j is not an isogeny path and not a cost below p^{1/2}.
    - This is not the internal-versus-leaving edge split of IDEA-20261005-5cbadc.
    - Negative evidence closes only this kernel on this model over F_19.
  heuristic_assumptions:
    - id: H1
      statement: >-
        A rational 2-torsion kernel on a short-Weierstrass model over
        F_p produces a Vélu codomain whose j is F_p-rational, and for
        y^2 = x^3 + x over F_19 that j is not the domain j.
      rigorous_support: >-
        Rationality of the codomain of a rational kernel is recalled
        and not opened here. Distinctness from the domain j is the
        unproved part.
      validation_plan: >-
        Compute the one codomain j and the two kernel controls. No
        second kernel in this proposal.
  target_complexity:
    time_exponent: p^{1/2} times (log p) to a constant power, unchanged
    memory_exponent: constant at this toy
    best_known: >-
      Classical supersingular path finding at p^{1/2} times (log p)
      to a constant power. One Vélu evaluation does not change it.
    hidden_overhead: No o(1) is claimed.
    tradeoff_note: One kernel, one codomain. No table and no tradeoff.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: >-
    Opened KR-RHO-755e35 and KR-IC-b0fcda. Neither states this
    codomain j. KR-RHO-755e35 dominates any reading of the isogeny as
    a walk to a new weakness class. Exponent difference 0.
  sota_delta: >-
    Exponent difference 0. Counted delta: codomain j in F_19 and
    different from j(E), one integer comparison.
