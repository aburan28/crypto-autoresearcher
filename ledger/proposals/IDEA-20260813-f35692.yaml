idea:
  id: IDEA-20260813-f35692
  added: '2026-08-13'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-QALG-457b41
  goal_id: GOAL-QALG-001
  title: >-
    Method-ceiling and nearby-object control: does lattice sieving's own
    nearest-neighbor search bottleneck carry any hidden algebraic (hidden-
    subgroup-style) structure a quantum algorithm could exploit beyond Grover,
    or is it already at the unstructured-search ceiling
  class: control
  claim: >-
    RQ-QALG-457b41's stated scope lists three quantum mechanism families:
    Grover/amplitude-amplification on classical sieve inner loops (the
    established baseline, KN-LIT-703's Laarhoven figure of
    2^(0.2653 d + o(d))); quantum-walk sieve variants (also established,
    same source, giving the same constant-in-the-exponent family); and "any
    other quantum mechanism... proposed against MLWE/MSVP specifically." The
    three sibling proposals in this batch (IDEA-20260813-4aecda,
    IDEA-20260813-0cf345, IDEA-20260813-8aa6ea) all pursue the third,
    algebraic (LWE-instance-to-DCP) route. This proposal instead asks the
    question about the FIRST TWO, already-established families directly: is
    the sieve algorithm's own core subroutine -- nearest-neighbor search over
    a large list of quasi-random lattice vectors -- provably (or at least
    heuristically, under a stated genericity assumption) already at the
    unstructured-search ceiling that Grover-type quantum search cannot beat
    by more than a polynomial factor, per Bennett-Bernstein-Brassard-Vazirani
    (BBBV)-style adversary bounds for black-box search? The claim
    discriminates between: (a) the sieve's near-neighbor predicate is
    provably/heuristically GENERIC (no exploitable hidden algebraic symmetry
    under the standard random-lattice heuristic), so Laarhoven's
    2^(0.2653 d + o(d)) figure already sits close to this family's own
    ceiling and no exponent-moving improvement is available by attacking the
    sieve directly -- meaning any future exponent-moving mechanism for
    MSVP/MLWE, if one exists, MUST come through the algebraic/reduction
    route (the DCP family this batch's other proposals pursue) rather than
    through a better sieve; versus (b) the near-neighbor predicate DOES carry
    exploitable structure this program's corpus has not yet identified,
    reopening the sieve-direct route as a live target.
  mechanism: >-
    Tracked object: the near-neighbor search predicate used by heuristic
    lattice sieving (given a large list L of lattice-point-derived vectors,
    find pairs or points satisfying an inner-product/angle threshold),
    modeled as a black-box Boolean oracle over |L| items, compared against
    the class of oracles for which BBBV-type adversary arguments give a
    TIGHT Theta(sqrt(|L|)) quantum query lower bound (i.e. unstructured
    search) versus the class of oracles (hidden-subgroup, hidden-shift,
    periodicity-bearing) for which a genuinely super-quadratic quantum
    speedup is known to exist (Simon's problem itself, Shor's period-finding,
    the dihedral/abelian HSP family this batch's sibling proposals target).
    This is explicitly a method-ceiling and nearby-object-control exercise
    per docs/inventor-protocol.md section 8 / KN-TECH-080's fourth mandatory
    audit, applied here as the PRIMARY deliverable rather than as a
    preliminary check subordinate to a specific algorithm proposal. The
    lossy-projection test: modeling the near-neighbor predicate as a black-
    box oracle discards the predicate's actual geometric definition (inner-
    product threshold on real vectors) and retains only its query-access
    interface -- this loses real information (the geometric structure IS
    what the predicate actually is), so the projection's conclusions are
    explicitly bounded to "no exploitable structure VISIBLE at the black-box
    level," not "no exploitable structure exists at all"; this scope limit is
    stated up front rather than discovered after the fact.
  novelty_status: unverified
  novelty_screen:
    local_kb_status: >-
      crypto-kb MCP tools unavailable this session; screened via direct grep
      of committed knowledge/ and ledger/ at snapshot commit
      083ca0026281c05e85570e5bddf90adbd4954d69 (see retrieval-screen.yaml).
    screened_proposals: >-
      No prior RQ-QALG-457b41 filings exist. This is the only one of the
      five proposals in this batch that does NOT depend on the Simon 2026 /
      IP-M-EDCP external ingredient, deliberately providing an independent,
      DCP-agnostic angle on the same RQ.
    adjacent_corpus:
      - KN-LIT-703
      - KN-LIT-b875db
      - KN-TECH-d1bc4f
    external_screen: >-
      No live web search available this session. The BBBV quantum query
      lower bound for unstructured search is textbook material and is
      invoked here as an established analytical tool, not as a novel claim;
      what is unverified is whether it has been applied SPECIFICALLY to
      lattice sieving's near-neighbor predicate in exactly this framing
      anywhere in the accessible literature -- this program's corpus does
      not contain such an entry, and absence from this corpus is not
      evidence of absence in the wider literature, hence novelty_status
      remains unverified rather than a stronger label.
    nearest_neighbors: []
  assumptions:
    - >-
      "Established family, declared off-limits as the primary lens" per
      docs/inventor-protocol.md section 1 applies to PROPOSING Grover-only or
      quantum-walk sieving as the exponent-moving mechanism itself (already
      known, not new); it does not prohibit AUDITING those established
      families' own ceiling, which is a distinct, control-class activity this
      proposal undertakes deliberately.
    - >-
      The genericity/random-lattice heuristic invoked here is explicitly
      about the AVERAGE-CASE, heuristic-sieving regime that concrete ML-KEM
      security estimates are built on (per KN-LIT-b875db's own scope
      statement distinguishing this regime from provable worst-case SVP
      algorithms); this proposal does not address the provable worst-case
      frontier.
    - >-
      A finding here that the sieve-direct route is closed under the stated
      heuristic does NOT declare the RQ itself closed; per
      docs/inventor-protocol.md section 4 and the Idea Generator's own
      prohibition on declaring a direction impossible, this proposal at most
      closes ONE of several candidate routes with a named obstruction and
      redirects effort, exactly as forward guidance requires.
  proof_search_map:
    bottleneck: >-
      Whether the near-neighbor predicate sieving's inner loop searches over
      admits ANY quantum-exploitable periodicity or hidden-subgroup
      structure beyond what Laarhoven's quantum-walk construction already
      extracts, under the standard heuristic that sieve lists behave like
      generic (Haar-random-direction) point sets in high dimension.
    baseline_embedding:
      parameter_slice: >-
        The exact parameter slice reproducing the established baseline is
        Laarhoven's own stated quantum-walk sieve construction and its
        claimed 2^(0.2653 d + o(d)) figure (KN-LIT-703); this proposal must
        first confirm (by reading the cited construction, not re-deriving
        it from scratch) which specific quantum primitive (amplitude
        amplification alone, versus a quantum walk on a structured graph
        such as the Johnson graph) achieves that figure, since the two
        primitives have different BBBV-style ceilings and conflating them
        would invalidate the comparison.
      reproduction_check: >-
        A citation-level check (not a re-derivation) that the 2^(0.2653 d)
        figure is attributed correctly to a quantum-WALK construction
        (which already exploits some structure, specifically the sieve
        list's metric/graph structure via a Johnson-graph walk) rather than
        to naive Grover search alone (which would give a different,
        generally worse figure on an unstructured list of this size) --
        this distinction is the entire point of the audit and must be
        gotten right before any ceiling claim is made.
    observation_collision:
      observable: >-
        The BBBV-style adversary bound's OWN oracle model (a black-box
        Boolean predicate with no promised algebraic structure).
      distinct_preimage_search: >-
        Search for a nearby object (a search problem with genuine hidden-
        subgroup or periodic structure, e.g. Simon's problem itself, or the
        dihedral HSP this batch's DCP-route siblings target) that shares the
        SAME black-box observable (a Boolean membership/threshold oracle)
        but for which the BBBV bound is NOT tight, because the promised
        structure licenses Simon's or Shor's algorithm to beat sqrt(|L|).
        If the sieve's near-neighbor predicate is observationally
        indistinguishable, AT THE BLACK-BOX LEVEL, from problems where
        quantum algorithms beat Grover, the black-box framing itself is
        insufficient to conclude a ceiling, and the audit must fall back to
        the geometric (non-black-box) argument instead.
    constructive_transforms:
      - transform: observable_fiber_counterexample
        proposed_object: >-
          Hold the observable (black-box query access to the near-neighbor
          predicate) fixed and vary the forgotten structure (whether the
          underlying point set is drawn from a genuinely structured
          distribution -- e.g. a coset of a subgroup -- versus a Haar-random
          direction set matching sieve's own heuristic model), searching for
          an intrinsic invariant (a periodicity or subgroup-coset property)
          that would distinguish the two at the level a quantum algorithm
          could exploit.
        predicted_gain: >-
          If no such invariant is found under the standard random-lattice
          heuristic (the expected outcome, stated as such, not withheld),
          this certifies (heuristically, not rigorously) that the sieve-
          direct route offers no further exponent-moving headroom beyond
          quantum-walk sieving's already-established constant, redirecting
          the RQ's remaining search effort toward the algebraic/DCP route.
    quantifier_order: >-
      The claim under audit is: for ALL sieve-list instances arising from
      ML-KEM-scale lattices under the standard heuristic (average-case,
      random-direction point sets), NO black-box quantum algorithm can beat
      the quantum-walk sieve's established exponent by more than a
      polynomial factor. This is explicitly a heuristic, average-case, FOR-
      ALL-under-a-stated-distribution claim, not a worst-case or universal
      one; a witness instance where the heuristic fails (a structured, non-
      generic sieve list, e.g. arising from a weak or backdoored key) would
      not falsify the claim as stated, since the claim is scoped to the
      standard heuristic distribution -- this scoping is recorded explicitly
      so the audit is not later mistaken for a universal impossibility
      claim, which the Idea Generator is prohibited from asserting.
    method_ceiling:
      strongest_certifiable_claim: >-
        At best, this audit can certify that, UNDER THE STATED HEURISTIC and
        AT THE BLACK-BOX ORACLE LEVEL, the sieve-direct route shows no
        evidence of exploitable hidden-subgroup structure beyond what
        quantum-walk sieving already uses -- a heuristic, scoped, and
        explicitly non-universal finding, not a proof of Grover-optimality.
      nearby_object_control: >-
        The nearby object where the hoped-for "no further structure"
        conclusion is KNOWN to fail is precisely the dihedral-coset-based
        search this batch's sibling proposals target: DCP's own search
        problem, reformulated as a black-box oracle, is observationally
        similar to a generic search problem yet admits Kuperberg's sub-
        exponential and (if Simon 2026 survives) polynomial-time quantum
        algorithms -- demonstrating that black-box observational similarity
        alone does not certify a ceiling, which is exactly why this audit's
        strongest certifiable claim (above) is heuristic and scoped, not a
        proof.
    proof_obligations:
      - claim: >-
          The 2^(0.2653 d) baseline figure is correctly attributed to a
          quantum-walk (structure-exploiting) construction, not naive Grover
          alone.
        responsibility: baseline
      - claim: >-
          The observable-fiber search (structured vs generic point sets at
          the black-box level) is actually carried out, not merely asserted.
        responsibility: feasibility
      - claim: >-
          The nearby-object control (DCP as a black-box search problem that
          DOES beat the naive ceiling) is stated explicitly so the audit's
          own limits are visible.
        responsibility: scope
      - claim: >-
          The conclusion is reported as heuristic and average-case-scoped,
          never as a universal impossibility statement.
        responsibility: interface
    not_applicable_reason: null
  predictions:
    - metric: baseline_attribution_check
      direction: different
      minimum_effect: >-
        Confirmation of whether KN-LIT-703's 2^(0.2653 d) figure is
        attributed to a quantum-walk (Johnson-graph-structured) construction
        or to plain amplitude amplification on an unstructured list; this
        determines which BBBV-style comparison is even the right one to run.
    - metric: structured_vs_generic_predicate_distinguishability
      direction: different
      minimum_effect: >-
        Whether a battery of standard structural tests (periodicity checks,
        subgroup-coset tests) applied to small, classically-simulable toy
        sieve-list instances (dimension 8-20, fully enumerable) can
        distinguish a genuinely structured (e.g. deliberately planted
        periodic) point set from a Haar-random-direction one at the level a
        black-box quantum algorithm would need; direction is "different"
        because the proposal predicts the tests will succeed on the planted-
        structure positive control (validating the test battery) but does
        not predict what they will find on genuine sieve-list instances in
        advance.
  minimal_test:
    design: >-
      (1) Confirm, by reading the cited construction in KN-LIT-703 (or the
      underlying Laarhoven thesis it cites), exactly which quantum primitive
      achieves the 2^(0.2653 d) figure. (2) Build a small, classically-
      simulable toy near-neighbor search instance (dimension 8-20, fully
      enumerable point set sizes) under the standard random-lattice
      heuristic (Haar-random unit vectors). (3) Build a POSITIVE CONTROL
      instance of the same size with deliberately planted periodic/subgroup-
      coset structure (e.g. points restricted to cosets of a small
      subgroup), to validate that the structural test battery used in step 4
      can actually detect structure when it is present. (4) Apply a battery
      of standard structural/periodicity tests to both the generic and
      planted-structure toy instances, confirming the tests correctly flag
      the planted instance as structured and the generic instance as
      structureless (or reporting honestly if they do not distinguish them
      at this toy scale, which would itself be an informative negative
      result about the test battery's power). (5) Report the baseline
      attribution finding and the structural-test results together. This
      record authorizes no execution; it is a design for Coordinator
      approval, requiring no ML-KEM implementation or actual lattice
      reduction software, only toy-scale synthetic point-set generation.
    controls:
      - >-
        Planted-structure positive control (points restricted to a small
        subgroup coset): validates that the structural test battery can
        detect structure when genuinely present, before trusting a
        "no structure found" verdict on the generic instance.
      - >-
        Baseline-attribution check, confirming which quantum primitive
        (amplitude amplification vs quantum walk) the established figure
        actually uses, to avoid comparing against the wrong ceiling.
    required_metrics:
      - baseline-attribution finding (primitive used for 2^(0.2653 d))
      - structural test battery results on the planted-structure positive
        control (must correctly flag it as structured)
      - structural test battery results on the generic (Haar-random-
        direction) toy instance
  falsification_conditions:
    - >-
      The structural test battery fails to flag the planted-structure
      positive control as structured: this falsifies the test battery's
      power at this toy scale, and any "no structure" verdict on the generic
      instance must be reported as inconclusive rather than as a finding.
    - >-
      The structural test battery flags the GENERIC (Haar-random-direction)
      toy instance as structured: this would be a surprising, informative
      positive result supporting outcome (b) (exploitable structure exists),
      and should be escalated rather than dismissed as noise, though it must
      first be checked against a re-randomized re-run to rule out a fixed-
      seed artifact.
  confounders:
    - >-
      Mistaking "no structure found by THIS test battery at toy scale" for
      "no structure exists at any scale"; the interpretation_limits section
      states this explicitly and any downstream summary must preserve it.
    - >-
      Comparing against the wrong baseline primitive (naive Grover instead of
      the actual quantum-walk construction) would make the ceiling
      comparison meaningless; the baseline-attribution step exists
      specifically to prevent this.
    - >-
      Treating a "no further headroom in the sieve-direct route" finding as
      a closure of the entire RQ; per the assumptions section, it closes at
      most one candidate route among several and must be reported as such.
  interpretation_limits:
    - >-
      This audit operates entirely at toy scale (dimension 8-20) on
      SYNTHETIC point sets, not on actual ML-KEM-derived lattice bases; no
      claim about ML-KEM's concrete security follows from any outcome here.
    - >-
      The heuristic genericity assumption (random-lattice heuristic) is
      explicitly the same one the target-result-profile's own exemplar
      relies on for its distribution-theorem-based heuristics (A2); this
      proposal does not independently validate that ML-KEM's actual sieve
      lists satisfy it, only that the STANDARD heuristic assumption, if
      true, implies no further black-box quantum headroom.
    - >-
      Results here do not transfer to RQ-QALG-122b59 or RQ-QALG-74bf20 per
      GOAL-QALG-001's non_duplication note; HQC's ISD search structure and
      CSIDH's group-action search structure are different black-box search
      problems with their own established quantum baselines and would need
      their own separate ceiling audits.
  heuristic_assumptions:
    - id: H1-generic-sieve-list-heuristic
      statement: >-
        For a lattice sieve list L constructed from an ML-KEM-scale lattice
        basis under the standard heuristic-sieving model, the directions of
        vectors in L behave, for the purposes of near-neighbor search
        structure, like a Haar-random sample of unit vectors in dimension d,
        with no small-support algebraic (coset/subgroup) relations among
        them beyond what dimension and list size alone would predict by
        birthday-bound coincidence.
      rigorous_support: >-
        Imitates the classical random-lattice heuristic used throughout
        heuristic sieving complexity analysis (the same style of heuristic
        underlying the 2^(0.292 n) classical BDGL figure and the Pouly-Shen
        average-case exponent cited in KN-LIT-b875db); no rigorous bound is
        claimed here, only the standard heuristic already load-bearing for
        every concrete ML-KEM security estimate this program's corpus is
        aware of.
      validation_plan: >-
        Toy-scale (dimension 8-20) empirical test: generate sieve-list-like
        point sets from small random lattice bases via a standard heuristic
        sieve implementation (or a direct random-direction sample as a
        cheaper proxy), apply the structural test battery from the minimal
        test above, and compare against the planted-structure positive
        control; tail check by examining the single MOST structured-looking
        subset found in the generic instance (by whatever structure-
        detection statistic is used) against what the planted control
        produces at the same scale, analogous in spirit to the Wesolowski
        exemplar's smoothest-sample tail check (A7).
  target_complexity:
    time_exponent: >-
      Not claimed. This is a ceiling/closure-oriented control, not an
      algorithm proposal; its deliverable is a scoped verdict about whether
      headroom exists in the sieve-direct route, not a new time exponent.
    memory_exponent: not applicable.
    best_known: >-
      2^(0.2653 d + o(d)) time, quantum-walk sieve, QRAM model (Laarhoven,
      KN-LIT-703); 2^(0.2989 d + o(d)) time / 2^(0.1395 d + o(d)) memory,
      quantum k-Sieve, QRAM model (Kirshanova-Martensson-Postlethwaite,
      KN-LIT-703) as an alternative time-memory point on the same family's
      frontier.
    hidden_overhead: not applicable; no complexity claim is made by this
      audit.
    tradeoff_note: >-
      The two established figures above already instantiate a time-memory
      tradeoff within the quantum sieve family itself (Kirshanova-
      Martensson-Postlethwaite trading memory for the QRAM setting's
      structure versus Laarhoven's point); this audit does not add a new
      tradeoff point, only asks whether the family's exponent itself has
      further headroom.
  estimated_cost:
    implementation: low
    compute: low
    note: >-
      Toy-scale (dimension 8-20) synthetic point-set generation and
      classical structural testing; no ML-KEM implementation, no quantum
      hardware, no large-scale lattice reduction required.
  dominated_by: >-
    n/a (no attack or algorithm result claimed). Checked against every row
    this program's corpus records for quantum MSVP/MLWE: Grover/quantum-walk
    sieve 2^(0.2653 d + o(d)) and quantum k-Sieve 2^(0.2989 d + o(d)) time /
    2^(0.1395 d + o(d)) memory (both KN-LIT-703), and the unverified DCP-
    route claim under audit by this batch's sibling proposals (KN-LIT-
    e204ab). This proposal's own deliverable is a scoped ceiling verdict
    about the FIRST family, not a new competing figure, so it does not
    displace any row.
  sota_delta: >-
    Zero, quantitatively; this is a closure-oriented control, not a speedup
    claim. Its value is redirecting where the RQ's remaining search effort
    should concentrate: a clean "no headroom found" verdict (under the
    stated heuristic, at the stated toy scale, with the stated test-battery
    caveats) would be recorded as a NAMED, SCOPED obstruction per
    docs/inventor-protocol.md section 4 -- BBBV-style black-box optimality
    under the standard random-lattice heuristic -- with explicit forward
    guidance that any exponent-moving mechanism must come through the
    algebraic/reduction route this batch's other proposals pursue, not
    through the sieve's own search primitive.
  recommended_priority: high
  source_refs:
    - knowledge/literature/KN-LIT-703.md
    - knowledge/literature/KN-LIT-b875db.md
    - knowledge/techniques/KN-TECH-d1bc4f.md
  enumerated_closures: []
  open_directions:
    - >-
      If the baseline-attribution step reveals that 2^(0.2653 d) actually
      comes from plain amplitude amplification rather than a genuine
      quantum-walk construction, the comparison must be re-run against the
      correct (structure-exploiting) baseline before any ceiling conclusion
      is drawn.
    - >-
      If the structural test battery proves too weak even to flag the
      planted-structure control reliably at toy scale, a stronger test
      battery (e.g. explicit Fourier-analytic periodicity tests) should be
      designed before this audit is considered informative at any scale.
    - >-
      A full write-up of an ECDLP/lattice tracked-object enumeration
      (KN-OPEN-019's open sibling for this domain) would let this audit be
      posed more precisely; absent that enumeration, this proposal's
      family-to-object mapping is explicitly a sketch, not a taxonomy, per
      docs/inventor-protocol.md section 1.
