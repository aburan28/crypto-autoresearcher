idea:
  id: IDEA-20260820-653179
  question_id: RQ-SQISIGN-001
  added: 2026-08-20
  title: Adaptive-message conditional calibration of SQIsign transcript simulators
  class: multi-query simulator audit
  claim: >-
    Matching transcripts for fixed or iid messages may not imply matching the
    sequential law when each next public message is chosen from earlier public
    transcript strata. A preregistered adaptive-message calibration test may
    reveal conditional simulation error without asserting secret-ideal recovery
    or a production forgery.
  mechanism: >-
    Freeze a bounded public policy pi mapping prior transcript summaries to the
    next message from a fixed dictionary. Run the same policy against a real
    signer and a genuine simulator. At each step compute a prequential e-value
    from public algebraic and serialization features, conditional on message and
    history stratum. Because pi is fixed before evaluation, accumulated evidence
    targets the conditional joint law rather than a cherry-picked marginal.
  novelty_status: unverified
  status: proposed
  source_refs:
    - id: RQ-SQISIGN-001
      provenance: internal
      use: q-transcript simulator question
    - id: GOAL-SSI-001
      provenance: internal
      use: hard-problem ownership boundary
    - id: KN-TECH-057
      provenance: internal
      use: query, time, memory, and preprocessing accounting
    - id: KN-TECH-058
      provenance: internal
      use: current unconditional and conditional Fp2 boundary
    - id: EXP-SSI-7c41d9
      provenance: internal
      use: three-replicate qualified true-simulator precedent; unarchived
    - id: IDEA-20260813-93a735
      provenance: internal
      use: nearest q-transcript posterior proposal
  predictions:
    - True-simulator versus true-simulator sessions cross the anytime-valid alpha boundary in no more than the declared type-I fraction.
    - A planted conditional tilt activated only after a rare public history is detected more often adaptively than by a query-matched iid schedule.
    - Any real/sim discrepancy replicates under a held-out policy built from disjoint training transcripts.
  controls:
    true_simulator_null: two independent genuine-simulator sessions driven by the identical frozen adaptive policy
    planted_positive: simulator with a conditional tilt activated only after a preregistered rare public stratum
    nearby_object: iid message schedule with identical empirical message counts and transcript budget
    leakage_guard: policy receives only public transcript summaries, never internal state
  falsification_conditions:
    - Null e-values are not calibrated at the declared anytime-valid level.
    - The rare-stratum planted control fails at preregistered power.
    - Neither the discovery nor held-out policy distinguishes real from simulated sequences.
  confounders:
    - policy trained on evaluation transcripts
    - unequal rare-stratum reach probabilities from parser failures
    - optional stopping not covered by the e-process
    - message dictionary encoding unintended semantic differences
  interpretation_limits:
    - Null evidence covers only the frozen policies, features, q, and tested toy parameters.
    - A sequential distinguisher does not imply ideal recovery or forgery.
    - Real signer queries and simulator calls must be charged separately.
  heuristic_assumptions:
    - H-ADAPT-1: the frozen public policy reaches informative strata with non-negligible probability.
    - H-ADAPT-2: the conditional e-value model remains calibrated after cross-fitting.
  target_complexity:
    objective: detect sequential conditional mismatch using q signing queries; no recovery mapping assumed
    unconditional_fp2: p^(1/2)*(log p)^O(1) time, polynomial memory
    conditional_fp2: p^(1/3+o(1)) time and memory only under Heuristic 1, superpolynomial hidden overhead
    conditional_fp: retain a separate KN-TECH-057 row
    success_accounting: report q, policy-training data, reach probability, stopping time, and alpha spending
  cost_model:
    time: O(R*q*(C_sign+C_sim+C_feat)) for R seeded sessions
    memory: O(S*k) online calibration state plus any retained transcripts
    data_or_queries: R*q real signatures, null simulations, planted controls, and separate training data
    preprocessing: freeze dictionary, strata, policies, features, and e-process
    success_retries: charge sessions missing the rare stratum and all held-out replications
    verification: replay policy decisions from public logs and recompute each sequential e-value
  proof_search_map:
    exact_baseline_reproduction: reproduce fixed and iid calibration plus KN-TECH-057 full-cost rows
    observation_collision_search: find histories with identical policy summaries but distinct conditional laws
    quantifier_order: choose dictionary, policy, q, stopping rule, and alpha spending before evaluation
    method_ceiling: public-summary policies cannot see differences outside their history sigma-algebra
    nearby_object_control: query-matched iid messages isolate the incremental value of adaptivity
  nearest_neighbors:
    - id: IDEA-20260813-93a735
      discriminator: tests a frozen adaptive public message policy rather than estimating H(I|pk,T^q)
    - id: IDEA-20260813-b6c9b5
      discriminator: conditions on a sequential history policy rather than composing fixed public-stratum mixtures
  dominated_by: n/a (no result claimed)
  sota_delta:
    time_exponent: 0
    memory_exponent: 0
    data_or_queries: q adaptive queries per session plus three matched suites and training data
    quantitative_statement: no SOTA change; proposed delta is coverage of a different quantifier order
  recommended_priority: medium
  recommended_cost: medium-to-high because rare-stratum reach probability multiplies q
  recommended_prior: 0.15 probability of a replicating adaptive-only discrepancy at toy scale
  recommended_provenance: idea-generator judgement; unverified

