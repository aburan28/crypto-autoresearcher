    GOAL-ECDLP-001: Supplies the prime-field decomposition-cost ceiling that any SAT/SMT route to a prime-field
      ECDLP cost reduction must beat, priced in bits.
    GOAL-SDEG-001: Restates the hybrid boundary of IDEA-20260808-da1428 as a CDCL(T) measurement and supplies the
      root-finding propagator as the executable form of the enumerative leaf that lane charges.
    GOAL-SATIC-c49b77: Extends that campaign's binary toy SAT/UNSAT benchmark discipline (encoding soundness, SAT
      witness checks, matched nulls) to a prime- field instance family, so the ceiling question can be answered
      on both sides of the field boundary the SATIC question forbids transfer across.
