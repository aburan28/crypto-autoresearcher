      for complete character sums, vacuous on short intervals, so the distributional half is carried by measurement
      (as in 84cdb7''s H2).'
    validation_plan: 'SAMPLE the refutation-depth histogram at m = 3, s in {5..8} on UNSAT runs; SHORTCUT: propagation-only
