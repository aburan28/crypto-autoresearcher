idea:
  id: IDEA-20260816-76d133
  question_id: RQ-SNFS-005666
  added: '2026-08-16'
  title: Measure how much of any candidate distinguishing statistic separation between honest and
    SNFS-trapdoored primes is attributable to the prime generator rather than the trapdoor, by running
    the identical battery on two honest generators that differ only in incidental search strategy
  class: control
  claim: '(A) THE FAILURE MODE IS NAMED IN THE QUESTION ITSELF. RQ-SNFS-005666 requires that the honest
    and trapdoored classes agree on every public criterion, or the separation measured is a separation
    of the generators and not of the trapdoor. That constraint is stated but no instrument in this
    program measures whether it holds. This proposal supplies the instrument. (B) THE THREE-ARM DESIGN.
    Generate three classes of n-bit primes: honest generator A, which draws a random odd integer and
    increments by two until Miller-Rabin passes; honest generator B, which draws a fresh random odd
    integer on every failure; and the special-form arm T drawn from C(d,H). A and B are both honest
    by any definition, differ only in an incidental implementation choice that no verifier would ever
    check, and are indistinguishable by intent. Any statistic that separates A from B is measuring
    the generator. (C) THE MEASURABLE. For each statistic s in a frozen battery, define the generator-attributable
    fraction G(s) = sep(A,B) / sep(A,T), where sep is a fixed two-sample separation measure such as
    the area under the ROC curve rescaled to [0,1]. G(s) near zero means the statistic sees the trapdoor;
    G(s) near one or above means it sees the search strategy and its apparent trapdoor sensitivity
    is uninterpretable. The deliverable is the vector of G values over the battery, which is a per-statistic
    admissibility verdict computed before any detectability claim is made. (D) WHY THIS IS NOT A DETAIL.
    Incrementing to the next prime induces a well-known bias: the gap structure preceding p is correlated
    with p modulo small primes, so statistics involving residues, gaps or digit patterns can separate
    A from B substantially even though both are honest. If the trapdoored generator happens to use
    one strategy and the honest baseline the other, a large part of any measured separation is an
    artifact of the code rather than of the mathematics, and no amount of later analysis recovers
    the distinction. (E) WHAT IS NOT CLAIMED. This proposal claims no detector, asserts no separation,
    and takes no position on whether trapdoored primes are detectable. It claims only that G(s) is
    computable, that it is a prerequisite for interpreting any battery result, and that a battery
    whose statistics all have high G is measuring implementation choices. It says nothing about any
    real parameter set and nothing about anyone''s generator.'
  mechanism: 'STAGE ONE: freeze a battery of K statistics computable from p alone, each a pure function
    with no free parameters, and hash the battery file before any prime exists. STAGE TWO: implement
    three samplers behind one interface, sharing the identical Miller-Rabin routine and identical
    entropy source seeded per sample, differing only where the design requires. STAGE THREE: generate
    equal-sized samples from A, B and T at each bit size. STAGE FOUR: for every statistic, compute
    the three pairwise separations sep(A,B), sep(A,T) and sep(B,T) with bootstrap error bars, using
    an identical scoring path for all pairs. STAGE FIVE: compute G(s) and classify each statistic
    as generator-blind, contaminated or dominated by the generator, according to thresholds fixed
    at STAGE ONE. STAGE SIX: run the self-consistency control, sep(A,A prime) with two independent
    seeds of the same generator, which must be at chance for every statistic; any statistic that separates
    a generator from itself is broken and its G value is meaningless. The claim is established if
    G is computable, stable across seeds, and identifies at least one statistic whose apparent trapdoor
    sensitivity collapses once generator attribution is charged. It is refuted if all pairwise separations
    are at chance, in which case the battery has no power at all and G is undefined, which is itself
    a reportable and useful outcome about the battery.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read in full: RQ-SNFS-005666, which states the matched-generation constraint, and GOAL-SNFS-001,
      whose completion criteria charge the Red Team with checking freeze order. Read docs/inventor-protocol.md
      section 3 on controls before belief. Greps: grep -ril -E ''ROC|false.positive rate'' ledger/proposals/
      returned fifteen-plus files, headers inspected; grep -ril -E ''multiple comparison|max-of-K|look-elsewhere|selection
      inflation'' ledger/proposals/ ledger/hypotheses/; grep -ril -E ''special.form|SNFS'' ledger/hypotheses/,
      which returned nothing.'
    results: The corpus contains many records using null controls and ROC-style scoring, for example
      the ECDLP and isogeny lanes returned by the ROC grep, but none of them measures a generator-attributable
      fraction, and none concerns prime generation at all. No hypothesis mentions special form or
      SNFS. The nearest methodological neighbours are the program self-audit proposals named in this
      batch briefing as saturated, IDEA-20260815-bc26a3 on the program false-positive rate and IDEA-20260815-eaf0d1
      on audit crowd-out, which audit the program rather than an instrument on a mathematical object;
      this proposal audits a specific measurement instrument for a specific class and is not a program-level
      self-audit. IDEA-20260815-c13ef4 on designed versus sampled factor bases is the closest in spirit,
      since it also asks whether a construction choice rather than the mathematics drives an effect,
      but its object is a factor base over a curve and it is assigned to a different bucket.
    verdict: 'UNVERIFIED. No claim about external literature is made. Claimed new relative to this
      repository: the generator-attributable fraction G(s) as a defined, computed per-statistic admissibility
      quantity, and the specific A-versus-B honest pair built from incremental versus resampling prime
      search as the control that isolates it. Assembled from known parts: null controls are inventor-protocol
      section 3, two-sample separation and bootstrap error bars are standard, and the observation
      that incremental prime search biases residues is elementary. The assembly into a pre-detectability
      gate is what is offered.'
  object_first_candidate:
    tracked_object: 'The K-dimensional statistic vector s(p) attached to each prime, followed not
      through the arithmetic but through the sampling pipeline: the object of study is the map from
      generator to the distribution of s, and specifically the pairwise separations between the three
      induced distributions.'
    lossiness: 'Genuinely lossy. Each prime, an n-bit integer, is projected to K real numbers, and
      then each sample of primes is projected further to a single separation scalar per statistic
      pair. The arithmetic content of p is almost entirely discarded, including its factorisation-relevant
      structure, its witness if any, and all but K functions of it. The retained separations still
      propagate because the operation that matters, changing which generator produced the sample,
      acts directly on the distribution of s and needs none of the discarded structure. The one place
      the loss bites is stated: two generators can induce identical distributions of s while differing
      in ways a different statistic would see, so a low G is evidence about this battery only.'
    propagation: 'One step of the target operation is swapping the generator while holding the battery
      fixed. Under that swap the separation vector moves from the all-zero vector, when the two generators
      are the same code with different seeds, to whatever the generators induce. The propagation law
      being tested is additivity: if generator effects and trapdoor effects were independent contributions
      to a statistic, sep(B,T) would be predictable from sep(A,B) and sep(A,T) under a stated combination
      rule. Measuring the deviation from that rule per statistic tells whether the generator effect
      and the trapdoor effect interact, which is the difference between a correctable contamination
      and an inseparable one.'
    survival_score: 'The control survives exactly as far as the battery does: G(s) is defined and
      meaningful for every statistic whose self-consistency check sep(A,A prime) is at chance and
      whose sep(A,T) is above its own error bar. It dissolves for statistics that have no power at
      all, where G is a ratio of two noise terms, and the specification requires those statistics
      to be reported as undefined rather than assigned a value. Concretely, at samples of 2000 primes
      per arm, separations below about 0.55 area under the curve are inside the bootstrap band and
      G is not reported for them.'
  null_object_control: Two independent seeds of the SAME generator, A and A prime, scored by the identical
    battery in the identical invocation. The null must show every statistic at chance separation,
    area under the curve within the bootstrap band of 0.5. If any statistic separates a generator
    from itself, the scoring pipeline leaks the label or the statistic depends on sample order, and
    every G value in the run is void. This null is the strongest available because the two arms are
    provably identically distributed by construction, so any separation is definitionally an artifact.
  discriminated_from:
  - 'IDEA-20260815-c13ef4, designed versus sampled factor bases: same underlying worry, that a construction
    choice and not the mathematics produces an effect, but the object there is a factor base on a
    curve and the setting is index calculus. Here the object is a prime generator and the effect is
    a detectability statistic.'
  - 'IDEA-20260815-bc26a3 and IDEA-20260815-eaf0d1, the program-level self-audit records named as
    saturated in this batch: those audit the research program. This audits a single measurement instrument
    against a mathematical class and produces a per-statistic number, not a program-wide verdict.'
  - 'The power-lattice detector proposal in this batch: that proposal builds a detector and measures
    its ROC. This one measures whether any such ROC is interpretable at all, and would run before
    it rather than after.'
  - 'RQ-SNFS-005666 itself, which states the matched-generation constraint as a rule: a rule is not
    an instrument, and this record supplies the number that says whether the rule was satisfied.'
  assumptions:
  - Generators A and B are both honest in the sense that no verifier check distinguishes them; this
    is checked by running the public-criteria checklist on both and confirming identical pass rates.
  - The battery statistics are pure functions of p with no free parameters, so that no tuning can
    occur after generation; the hash of the battery file before generation is what enforces this.
  - Bootstrap resampling of the separation measure is valid at the sample sizes used, which is checked
    by the self-consistency null returning chance with the expected band width.
  - An area-under-the-curve separation measure rescaled to [0,1] is an adequate common currency across
    heterogeneous statistics; alternatives would change G quantitatively but not its interpretation.
  predictions:
  - metric: self-consistency separation sep(A,A prime), maximum over the battery
    direction: different
    minimum_effect: within 0.5 plus or minus the bootstrap band; any statistic outside voids the run
  - metric: number of battery statistics with generator-attributable fraction G above 0.5
    direction: higher
    minimum_effect: at least 1 out of K, since residue and gap statistics are expected to see the
      incremental search
  - metric: sep(A,B) for statistics involving p modulo small primes
    direction: higher
    minimum_effect: at least 0.60 area under the curve at 2000 primes per arm
  - metric: deviation of sep(B,T) from the additivity rule combining sep(A,B) and sep(A,T)
    direction: different
    minimum_effect: 'no pre-commitment: whether generator and trapdoor effects interact is precisely
      what is unknown, and naming a number would be assuming the answer'
  minimal_test:
    design: 'One invocation, four arms, one battery. Generate 2000 primes each from A, from A prime
      with a different seed, from B, and from T at n = 64 with d = 3 and H = 64. Freeze a battery
      of ten cheap statistics computed from p alone: p modulo each of the first four odd primes, the
      Hamming weight of p, the count of runs in its binary expansion, the largest gap between consecutive
      one-bits, the bit length of p minus 1 divided by two, and two digit-based summaries. Compute
      all pairwise separations with 1000 bootstrap resamples. The discrimination is immediate and
      needs no modelling: if sep(A,A prime) is at chance everywhere, the pipeline is clean; then the
      vector of sep(A,B) values says directly how much any statistic sees the search strategy, and
      dividing by sep(A,T) gives G. Cost is 8000 primality-searched primes plus ten cheap statistics
      each, minutes in pure Python, memory negligible.'
    controls:
    - The self-consistency null, two seeds of generator A, scored identically in the same invocation.
    - A shuffled-label control on every pair, which must return chance separation.
    - A public-criteria checklist run on A and B, confirming identical pass rates so both are honest
      by any verifier test.
    - A sample-size sweep at 500, 1000 and 2000 primes per arm to show the separations and the bootstrap
      bands behave as sample size demands.
    - A statistic-order permutation to confirm no statistic depends on the order primes were generated
      in.
    required_metrics:
    - pairwise separation per statistic for all six arm pairs with bootstrap intervals
    - generator-attributable fraction G per statistic
    - self-consistency separation per statistic
    - public-criteria pass rate per arm
    - shuffled-label separation per statistic
    - count of statistics classified generator-blind, contaminated, dominated
    - wall-clock seconds per arm
  falsification_conditions:
  - Any statistic separates generator A from generator A prime beyond the bootstrap band, voiding
    every G value in the run.
  - All statistics are at chance on every pair, so the battery has no power and G is undefined throughout.
  - The public-criteria checklist distinguishes A from B, meaning the two honest generators are not
    matched and the control is invalid as designed.
  - G values are unstable across the sample-size sweep, meaning the quantity is not estimable at these
    sizes.
  - Shuffled labels produce non-chance separations, indicating the scoring path leaks arm identity.
  confounders:
  - The trapdoored arm T necessarily uses a different search strategy from both honest arms, since
    it searches over polynomials and bases rather than integers, so part of sep(A,T) is generator
    effect by construction and cannot be fully removed, only bounded.
  - Bit-length pinning to exactly n interacts with incremental search near the top of the range and
    can create an artifact that looks like a residue effect.
  - Shared entropy sources across arms could induce correlation between samples if seeding is careless.
  - Statistics that are functions of one another inflate the apparent number of contaminated statistics
    without adding information.
  - Bootstrap intervals understate uncertainty for heavy-tailed statistics, making a marginal G look
    significant.
  interpretation_limits:
  - A low G for a statistic means it is generator-blind with respect to the A-versus-B contrast only,
    not with respect to every implementation choice a real generator might make.
  - The measurement says nothing about whether any statistic detects trapdoors; it says whether an
    observed separation can be attributed to the trapdoor at all.
  - Results are scoped to the frozen battery, the tested sizes and these three generators, and no
    statement follows about any real generator or any deployed parameter set.
  - Because the trapdoored arm cannot be generated by either honest strategy, generator effect and
    trapdoor effect are only partially separable and the residual is reported rather than eliminated.
  target_complexity:
    time_exponent: No attack exponent is claimed and no attack is run. Instrument cost is one prime
      generation plus K cheap statistic evaluations per sample, so linear in sample size, with prime
      generation dominated by Miller-Rabin at O(n^3) bit operations per candidate.
    memory_exponent: No attack memory exponent is claimed. Memory is O(sample size times K) reals
      for the score matrix plus the bootstrap resamples, a few megabytes at the sizes specified.
    best_known: The incumbent is the constraint text in RQ-SNFS-005666 requiring matched generation,
      which states the requirement but supplies no way to check it. This repository holds no generator-attribution
      measurement of any kind, so there is no numerical incumbent, and no external baseline is asserted.
    hidden_overhead: 'What hides here is that the trapdoored arm can never be produced by an honest
      generator, so a residual generator effect is structurally unavoidable and the honest deliverable
      is a bound rather than a correction. There is also a human overhead that is the real cost: the
      battery must be frozen and hashed before generation, and every incentive during analysis pushes
      toward adding one more statistic afterwards.'
  dominated_by: n/a for attack claims, none is made. As a control instrument, I checked every record
    this repository returned for ROC-style scoring and null controls, including the ECDLP and isogeny
    lane records surfaced by the ROC grep, plus the two program self-audit records named in the batch
    briefing, and none of them measures generator attribution for a prime class, so no row dominates
    this one. Against the alternative of simply asserting matched generation, this is strictly more
    informative at a cost of one extra sampling arm, and that comparison is the honest frontier check
    rather than an empty null.
  sota_delta: No attack; control and instrument-validity contribution only. Quantitatively the delta
    is from a stated rule with no verification procedure to a per-statistic number G with bootstrap
    error bars, plus a self-consistency null that can void a run. No speed, memory or data figure
    improves, and none is claimed to.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'That the self-consistency null passes and G is computable at all: about
    0.9, since it depends only on careful implementation. That at least one battery statistic shows
    G above 0.5, meaning real generator contamination exists: about 0.7, because incremental prime
    search is known to bias residues and gaps and the battery deliberately includes such statistics.
    That the additivity rule holds well enough for generator effect to be subtracted rather than merely
    bounded: about 0.2, and the low value is why the deliverable is written as a bound. That this
    changes how a later detectability record is written: about 0.6 if it runs before the detector
    work and near zero if it runs after, which is the argument for scheduling it first.'
