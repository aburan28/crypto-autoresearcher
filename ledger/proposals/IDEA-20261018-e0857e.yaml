idea:
  id: IDEA-20261018-e0857e
  title: PKM tower degree at m=3 N=21-27 (and m=4 N=24) on a 256-512 GB host
  class: measurement
  question_id: RQ-DREG-bd6c86
  area: DREG
  goal_ids:
  - GOAL-DREG-001
  status: proposed
  proposed_by: idea-generator (Sonnet subagent logging the missed items of the 2026-10-18 index-calculus
    review)
  added: '2026-10-18'
  claim: At m=3 the msolve degree is at least 8 at N=21 and at least 9 at N=24 (about one degree per eight
    unknowns, as at m=4 over N=12-20), so the PKM tower has no degree plateau in the prime-field line.
    A plateau, D <= 7 at N=21, would keep the m=3 prime-field exponent question open.
  mechanism: At m=4, N=20 msolve completed three productive degree-8 rounds before the 5 GB cap, giving
    D >= 8; at m=3, N=18-24 the 45-minute wall stopped every run at D >= 7. The kill test could be evaluated
    neither way. Memory and wall, not the instrument, block it; the positive control passed 16/16.
  novelty_status: unverified
  regime: prime field, PKM tower; exponent-level; 256-512 GB host
  citations:
  - ref: crypto:research/ic_leads_review_20261018/README.md 3.1, 2.2 (PKM tower row), 4 row 1
    provenance: internal
    claim: Source of the opportunity, the measured figures quoted here and the cost estimate; desk review,
      no new measurement, costs are the reviewer's estimates.
    verified_by: idea-generator
  - ref: crypto:research/pkm_lead1_m3n21_20261016/PROTOCOL.md
    provenance: internal
    claim: Frozen protocol for the m=3 N=21 run; progress.txt records the stop.
    verified_by: idea-generator
  - ref: crypto:backlog/XP-20261015-pkm-m3-n21-m4-n20
    provenance: internal
    claim: Backlog card naming the 256-512 GB requirement.
    verified_by: idea-generator
  - ref: crypto:research/ic_next10_20261014/03-pkm-degree/README.md
    provenance: internal
    claim: m=4 N=20 D >= 8 and m=3 N=18-24 stopped at D >= 7; positive control 16/16.
    verified_by: idea-generator
  - ref: crypto:research/elliptic_snfs_survey_20261016 (section 7)
    provenance: internal
    claim: The only question in the prime-field line that decides an exponent.
    verified_by: idea-generator
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
    - KR-IC-5931ee
    - KR-IC-0d2021
    - KR-IC-5a43e5
    nearest:
    - ref: KR-IC-5931ee
      provenance: internal
      relation: adjacent
      delta: Prime-field Semaev/PKM degree cells run at sizes blocked by memory; the row records the generic-cost
        obstruction, this measures the tower degree.
    searched:
      note: Positioned against the cited review and the records it names. The frontier map was not rendered
        or matched in this logging pass; the Coordinator should run tools/build_frontier_map.py --match
        before ranking. A missing row is not evidence of novelty.
  assumptions:
  - The frozen PROTOCOL.md is run unchanged apart from the host and wall limits.
  - N=21, 24, 27 (m=3) and N=20, 24 (m=4) are fixed before any run.
  predictions:
  - metric: msolve_degree_m3_N21
    direction: higher
    minimum_effect: At least 8.
  - metric: msolve_degree_m3_N24
    direction: higher
    minimum_effect: At least 9.
  - metric: msolve_degree_m4_N24
    direction: higher
    minimum_effect: At least 8, continuing the one-degree-per-eight-unknowns trend.
  minimal_test:
    design: Run msolve at m=3 N=21, 24, 27 and m=4 N=20, 24 on a 256-512 GB host per PROTOCOL.md, wall
      limit raised so the run completes or is censored by memory only. Positive control (16/16 cell family)
      run first on the same host.
    controls:
    - positive control cell family on the same host
    - A/A repeat of m=3 N=21
    - msolve version and options frozen in the protocol
    required_metrics:
    - highest completed degree round
    - peak RSS
    - rounds completed vs censored
    - kill-test verdict (D>=8 at N=21, D>=9 at N=24)
  falsification_conditions:
  - 'D <= 7 at N=21 completes without hitting a cap: plateau, the one-degree-per-eight-unknowns trend
    is wrong at m=3.'
  - 'D < 9 at N=24 after completion: same.'
  - A run stopped by the cap is censored and reported as such, never as a plateau.
  confounders:
  - monomial order
  - msolve internals
  - cap vs wall
  - draw variance
  interpretation_limits:
  - A degree is a stage diagnostic, not a speedup (AGENTS.md).
  - Prime-field line only.
  heuristic_assumptions:
  - id: H1
    statement: The PKM degree grows by about one per eight unknowns past the m=4 plateau.
    rigorous_support: m=4 N=12-20 measurements.
    validation_plan: Fit D(N) on the new points with N as the predictor; compare slope to 1/8.
  target_complexity:
    time_exponent: Decides whether the prime-field PKM tower line has a sub-generic degree plateau; an
      exponent-level question with no cost claim.
    memory_exponent: Memory is the blocker; 256-512 GB estimate from the backlog card.
    best_known: Matched generic rho, r^0.5 group operations; the index-calculus baseline is Table A/B
      of crypto:docs/ic/LEADERBOARD.md (5.23x to 21x matched rho on Koblitz, 5.47x to 13.5x on prime fields).
      Report this row's gap to matched rho (and to Bernstein-Lange where setup is excluded) as distance
      remaining.
    hidden_overhead: Every phase, cold, is charged; unpriced native work is priced at 0, 0.1 and 1 GAE
      per operation (AGENTS.md 5a) wherever two arms are ranked.
    tradeoff_note: Not applicable beyond the stated resource envelope.
  estimated_cost:
    implementation: low
    compute: high (shares the node with the Weil-descent cells; reviewer estimate)
  recommended_priority: high
  dominated_by: No attack result; the item is an unrun measurement or an unpaid baseline debt.
  sota_delta: None measured; closes or opens the m=3 kill test.
