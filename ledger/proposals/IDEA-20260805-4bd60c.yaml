idea:
  id: IDEA-20260805-4bd60c
  question_id: RQ-AES-002
  added: '2026-08-05'
  title: >-
    A full-round sensitivity ladder for GOAL-AES-002: ten-round AES-shaped
    objects with derived forced key-recovery costs, so that a C3 barrier
    statement rests on an instrument shown capable of firing -- with the
    all-identity-S-box rung already computed to have rank(M_K) = 128
  class: control

  claim: >-
    GOAL-AES-002 names completion criterion C3 -- a scoped barrier statement at
    the closure standard -- as the deliverable it most plausibly produces, and
    criterion C4 requires the Validator to check "null-control comparability
    including the round-count decay check". Nothing in the goal's ranked
    next_action builds the OTHER half of that pair: an object at the FULL round
    count on which a screening instrument MUST fire. Without one, a negative
    reading is uninterpretable, because no evidence exists that the instrument
    could have moved -- the failure mode this repository has measured at scale
    (82 per cent of its evidence records carry no positive control). This
    proposal builds the ladder. Its bottom rung is exact and already computed:
    replace SubBytes by the identity everywhere, in the encryption AND in the key
    schedule, and 10-round AES-128 becomes GF(2)-affine in (plaintext, key), with
    C = M_P * P + M_K * K + c; SESSION-COMPUTED on this machine at the full
    10-round count, the key map is affine (checked on 20 random key pairs) and
    rank(M_K) = 128 and rank(M_P) = 128, so THE MASTER KEY IS UNIQUELY DETERMINED
    BY ONE KNOWN PLAINTEXT/CIPHERTEXT PAIR and is recovered by GF(2) elimination
    in about 2^21 bit operations. That is a certifiable ten-round key recovery on
    an AES-SHAPED object, executable in milliseconds, which exercises the entire
    C1 pipeline -- certificate emission under the BLK-1 vocabulary extension,
    independent re-verification, CM-1 charging -- on an object whose answer is
    derived in advance. It is NOT a result about AES and every citation must say
    so in the same sentence.

  object_first_candidate:
    tracked_object: >-
      THE INSTRUMENT'S OWN RESPONSE, tracked across a graded family of ten-round
      AES-shaped SPNs that interpolate from provably affine to real AES-128. The
      independent variable is the amount of AES nonlinearity present; the tracked
      object is the screening statistic's value as that variable moves, and the
      question asked of it is not "is AES weak" but "can this instrument see
      weakness at all, at the full round count".
    established_families_off_limits: >-
      All thirteen families in RQ-AES-002
      objects_declared_off_limits_as_the_primary_lens are off-limits as the
      primary lens and none is used as one: differential and truncated
      differential; linear and multidimensional linear; integral / square /
      division property; impossible differential; meet-in-the-middle and
      Demirci-Selcuk; boomerang and retracing boomerang; biclique; algebraic
      (XSL-family) and Groebner; yoyo; mixture differential / exchange; subspace
      trail; partial sums. THE LADDER IS FAMILY-AGNOSTIC BY CONSTRUCTION: it is a
      set of OBJECTS with derived forced values, and any instrument from any
      family may be run against it. The bottom rung's recovery is Gaussian
      elimination on a 128x128 GF(2) system, which is linear algebra on an affine
      cipher and is NOT an algebraic attack on AES in the KN-TECH-071 sense --
      the object it solves has no S-box.
    newness_score: >-
      Positive controls are not a new idea and this record does not pretend
      otherwise; KN-FIND-029's practice rules already demand them and
      GOAL-AES-002 adopts those rules under instrument_inheritance. What does not
      exist in this repository is a FULL-ROUND-COUNT positive control for AES
      with a derived forced value, and its absence is precisely why a C3 barrier
      statement produced by this campaign would currently be unfalsifiable. The
      contribution is the ladder as a committed, reusable object set, and the
      exact rank computation that makes its bottom rung certain rather than
      hoped-for.
    testability_score: >-
      Maximal. The bottom rung is already computed. Every rung runs in
      milliseconds to minutes. The whole ladder is pure-Python plus optional
      numpy, both measured present.
    survival_score: >-
      The ladder is defined AT the full round count by construction, so the
      survival question does not arise for the object; it arises for the
      instruments run against it, which is exactly what the ladder measures.

  mechanism: >-
    DERIVED, AND WHERE MARKED SESSION-COMPUTED ON THIS MACHINE OUTSIDE THE
    HARNESS -- a candidate to re-run in-harness, never a run record.

    RUNG L0: AES-128 WITH THE S-BOX REPLACED BY THE IDENTITY EVERYWHERE.
    SubBytes becomes the identity on all 16 bytes in all 10 rounds, and SubWord
    in the key schedule becomes the identity too. Every remaining operation --
    AddRoundKey, ShiftRows, MixColumns, RotWord, the rcon XOR -- is GF(2)-linear
    or a constant, so the whole cipher is GF(2)-AFFINE JOINTLY IN PLAINTEXT AND
    KEY: C = M_P * P + M_K * K + c with M_P, M_K in GL-or-not(128, GF(2)) and c
    the constant obtained at P = K = 0.
    SESSION-COMPUTED at r = 10: affinity of the key map verified on 20 random
    pairs (E(0,K1) + E(0,K2) + E(0,K1 xor K2) = E(0,0) held in all 20);
    rank(M_K) = 128; rank(M_P) = 128.
    FORCED CONSEQUENCE: M_K is invertible, so from ONE known pair (P, C) the
    master key is K = M_K^{-1} (C + M_P * P + c), UNIQUE, recovered by Gaussian
    elimination over GF(2) at about 128^3 = 2.10e6 bit operations, i.e. about
    2^21 bit operations or about 2^15 64-bit word operations. Against the
    DEFINITIONAL exhaustive-key-search reference for a 128-bit key under CM-1 --
    2^127 full evaluations in expectation -- this is a margin of about 106 bits
    ON THE L0 OBJECT, AND THE L0 OBJECT IS NOT AES; the published-state-of-the-art
    comparison is UNADJUDICABLE in this environment and is asserted in neither
    direction, and no sentence anywhere may transcribe this as a margin against
    AES (RQ-AES-002 R5).
    WHY L0 EARNS ITS PLACE: it is the only object in reach that is simultaneously
    (i) at the FULL ten-round count, (ii) AES-shaped in every layer but one,
    (iii) solved with certainty by a derivation available before the run, and
    (iv) able to emit a real key-recovery certificate that the C1 verification
    path must accept. It converts the whole C1 pipeline from untested to tested.

    RUNG L1: GRADED NONLINEARITY. Replace SubBytes by the identity on exactly t
    of the 16 byte positions, in every round, keeping the real S-box on the other
    16 - t and keeping the real key schedule. t in {16, 12, 8, 4, 0} gives five
    rungs with t = 16 equal to L0-with-real-key-schedule and t = 0 equal to real
    AES-128. FORCED SHAPE, NOT FORCED VALUE: any sound sensitivity measure must be
    MONOTONE NON-INCREASING in (16 - t). That is the graded control with three
    interior points that docs/inventor-protocol.md prefers, and a non-monotone
    profile localises an artifact in the instrument instead of leaving "it did
    not work".

    RUNG L2: DIFFUSION REMOVED. Replace MixColumns by the identity in all rounds,
    keeping the real S-box and the real key schedule. FORCED STRUCTURAL VALUE,
    checkable at zero cost by a bit-flip dependency test: each ciphertext byte
    then depends on EXACTLY ONE plaintext byte and on EXACTLY 11 round-key bytes,
    those lying on one orbit of the ShiftRows byte permutation across the 11
    round keys. The dependency-set cardinalities must read exactly 1 and exactly
    11; any other reading means the object was built wrong. NOTE THE HONEST
    LIMIT: this record does NOT claim a key-recovery cost for L2, because the
    AES-128 key schedule couples the 16 byte channels through SubWord and the
    w[i] = w[i-4] xor w[i-1] recurrence, so the channels are independent in the
    ROUND FUNCTION but not in the KEY. Deriving L2's recovery cost is named as
    work, not asserted as a number.

    RUNG L3: REAL AES-128, 10 ROUNDS. Here the forced expectation is that NO
    instrument fires, and a firing is the campaign's headline event, routed to
    review-breakthrough at max under AGENTS.md rule 12.

    THE RULE THE LADDER ESTABLISHES, WHICH IS THE ACTUAL DELIVERABLE:
    AN INSTRUMENT THAT DOES NOT FIRE AT L0 HAS ZERO DEMONSTRATED SENSITIVITY AND
    MAY NOT LICENSE A C3 BARRIER STATEMENT. This is KN-FIND-029's practice rule
    ("a green states its covered cells or it states nothing"; "a repair is proved
    by execution") applied to the campaign's own screening, and GOAL-AES-002
    already adopts those rules by reference. The ladder makes the rule
    executable.

    THE SIBLING NULL THAT ISOLATES THE PROPERTY, AND CAN FAIL. For L0 the sibling
    is: real S-box in the ENCRYPTION, identity SubWord in the KEY SCHEDULE. That
    object's key schedule is affine but the cipher is not, so the affinity test
    must FAIL on it. If the affinity test passes on the sibling, the test is
    responding to the key schedule alone and not to the cipher, and L0's reading
    means nothing. This is exactly the sibling-null construction KN-FIND-029
    requires be built BEFORE the label is believed.

    INFRASTRUCTURE PRECONDITION, STATED BECAUSE IT BINDS. L0 PRODUCES A KEY
    RECOVERY. RQ-AES-002 names BLK-1 as a hard blocker: the certificate
    vocabulary in docs/claims-and-verification.md admits only
    discrete_log | decomposition | none, and check_run errors on any other value,
    so no conforming run may currently emit a key-recovery certificate. THIS
    LADDER MAY NOT BE DISPATCHED AS A CERTIFICATE-EMITTING CARD UNTIL
    protocol-amendment-GOAL-AES-002-001 IS AUTHORED, APPROVED AND COMMITTED.
    It may be dispatched earlier only in a non-certificate-emitting form, and the
    contract must say which. Separately, IDEA-20260805-01dfba establishes that
    the two-implementation verification path the certificate would use is not
    currently satisfiable as written in this container, so L0 is also the natural
    first exercise of whatever repair that audit produces.

  novelty_status: unverified

  literature_context:
    - >-
      NO PRIMARY SOURCE WAS READ AND NONE IS CITED. The AES structure used to
      build every rung is derived from the cipher's definition and pinned by
      local computation, per RQ-AES-002's provenance ruling.
    - >-
      KN-FIND-029 (internal, read): five false-green escapes across three repairs
      of one mutation control; coverage escapes closable by construction, evasion
      escapes not closable by an in-process instrument; a null control must
      ISOLATE the property it names and the sibling null is built before the label
      is believed. These are the rules this ladder implements, and GOAL-AES-002
      adopts them under instrument_inheritance.
    - >-
      EV-AES-005 (internal, read; RQ-AES-003, toy tier) is this program's own
      demonstration of why the ladder is needed: its r = 4 and r = 5 structural
      properties were RELABELLED BY ITS VALIDATOR, after the fact, as properties
      of any AES-SHAPED SPN rather than of AES, on the strength of a control the
      producer package did not contain. Cited as an INPUT carrying its original
      scope verbatim and not upgraded by being cited from a full-round question
      (RQ-AES-002 relationship_to_RQ_AES_001 (ii), (iii)).
    - >-
      EV-AES-004 (internal, read; RQ-AES-001, toy tier) records a first red-team
      pass that voided that campaign's only cost model, and records that the
      independent-confirmation half of its own gate is unsatisfiable under this
      harness. Cited for the methodological point only; it asserts no claim about
      AES at any round count and is not upgraded here.

  lossy_projection_identifiability_audit:
    projection: >-
      The full ten-round AES-shaped cipher --> the pair (instrument verdict,
      nonlinearity parameter). Everything about the cipher is discarded except
      how one screening statistic responds as nonlinearity is dialled in.
    what_is_discarded: >-
      The entire internal structure. Only a verdict per rung is retained.
    why_genuinely_lossy: >-
      Maximally lossy on the cipher side, and deliberately: the ladder is not
      trying to learn about AES, it is trying to learn about the instrument. The
      fibre over "instrument silent" contains both "the object is strong" and
      "the instrument is blind", and separating those two is the ladder's whole
      purpose -- which is exactly the identifiability failure that an
      uncontrolled negative suffers from silently.
    why_compatible_with_the_operations: >-
      Compatible because the nonlinearity parameter is a genuine one-parameter
      family of ciphers that share every other layer, so the response is
      attributable to the varied layer and to nothing else. That attribution is
      what a graded control buys and what a single null does not.
    is_it_only_a_change_of_coordinates: >-
      BOTH FAILURES CHECKED. NOT a change of coordinates: the map from a cipher to
      an instrument verdict is enormously many-to-one and irreversible. THE
      MIRROR FAILURE IS THE LIVE RISK AND IS THE ONE THE LADDER IS BUILT TO
      DETECT: an instrument whose verdict is CONSTANT across the whole ladder --
      silent at L0 as well as at L3 -- has zero comparator spread and is a
      constant of the apparatus, exactly the tell KN-TECH-1a5b7e catalogues. THE
      CHECK RETURNED: the ladder's forced values guarantee the OBJECTS have
      spread (L0 is affine and solvable in 2^21 bit operations; L3 is not known
      to be solvable at all), so any absence of spread in the verdict is
      attributable to the instrument and not to the objects. That is the design.

  assumptions:
    - >-
      That "AES-shaped" objects built by replacing one layer remain implementable
      in the pinned harness without touching the pinned AES ground truth. The
      contract requires the pinned FIPS-197 implementation to remain byte-identical
      and the rungs to be separate code paths, verified by re-running the
      known-answer vectors on the pinned implementation after the ladder is built.
    - >-
      That an instrument worth ladder-testing exists or will exist. If none does,
      the ladder is still the required precondition and is built first, which is
      the ordering this proposal argues for.

  predictions:
    - metric: >-
        L0_key_map_affinity: whether E(0, K1) + E(0, K2) + E(0, K1 xor K2) equals
        E(0, 0) for all tested key triples at r = 10 with identity S-box
        everywhere
      direction: different
      minimum_effect: >-
        EXACTLY 100 per cent over 1000 random triples. Forced by construction:
        every layer is GF(2)-linear or constant. SESSION-COMPUTED confirmation on
        20 triples. A single failure means the L0 object was built wrong.
    - metric: >-
        L0_rank_MK: GF(2) rank of the 128x128 matrix M_K = dC/dK at r = 10
      direction: different
      minimum_effect: >-
        EXACTLY 128. SESSION-COMPUTED on this machine: 128. If the in-harness
        value is below 128, the master key is NOT unique from one pair and the
        recovery cost is 2^{128 - rank} verifications instead of one -- in which
        case the rung must be redesigned and the forced value restated. THIS
        CONTROL CAN THEREFORE ACTUALLY FAIL, which is what makes it a control.
    - metric: >-
        L0_rank_MP: GF(2) rank of M_P = dC/dP at r = 10
      direction: different
      minimum_effect: >-
        EXACTLY 128 (the cipher must be a bijection in P for any fixed key).
        SESSION-COMPUTED: 128.
    - metric: >-
        L0_recovery_success: fraction of L0 instances whose master key is
        recovered from one known pair and re-verified by an implementation
        independent of the recovery code, over 100 random keys
      direction: higher
      minimum_effect: >-
        EXACTLY 100/100. This is the campaign's first end-to-end exercise of the
        C1 verification path and it MUST pass. Anything below 100/100 is an
        instrument or pipeline defect and NO negative result about any object may
        be reported until it is repaired.
    - metric: >-
        L0_sibling_null_affinity: whether the affinity test PASSES on the sibling
        (real S-box in the encryption, identity SubWord in the key schedule)
      direction: lower
      minimum_effect: >-
        MUST FAIL, at 0 per cent of triples passing. If the affinity test passes
        on the sibling, it is measuring the key schedule and not the cipher, and
        L0's reading is void. This is the null that can fail.
    - metric: >-
        L1_monotonicity: whether each instrument's sensitivity statistic is
        monotone non-increasing in (16 - t) over t = 16, 12, 8, 4, 0
      direction: different
      minimum_effect: >-
        Monotone at all five points, with the direction and the per-rung values
        reported. A non-monotone profile is the canonical artifact tell and halts
        interpretation of that instrument.
    - metric: >-
        L2_dependency_cardinalities: number of plaintext bytes and number of
        round-key bytes each ciphertext byte depends on, measured by exhaustive
        single-bit flips
      direction: different
      minimum_effect: >-
        EXACTLY 1 plaintext byte and EXACTLY 11 round-key bytes per ciphertext
        byte. Forced by the layer structure once MixColumns is removed. Any other
        reading means the rung was built wrong.

  minimal_test:
    design: >-
      Five stages, cheapest first, with the terminating stage named. STAGE 0
      (seconds, CAN END THE LINE): rebuild L0 and recompute rank(M_K) and
      rank(M_P) in-harness; if either is not 128, stop and restate the forced
      value before anything else is done. STAGE 1 (seconds): the sibling-null
      affinity check, read BEFORE the L0 treatment reading. STAGE 2 (minutes):
      the L0 end-to-end key recovery over 100 keys with independent
      re-verification, exercising the whole C1 path -- ONLY IF the BLK-1
      amendment is committed; otherwise this stage runs in a non-certificate
      form and says so. STAGE 3 (minutes): build L1 at t = 16, 12, 8, 4, 0 and
      L2, and verify their forced structural values. STAGE 4 (as instruments
      arrive): run each campaign screening instrument against the whole ladder
      and publish its sensitivity profile as a required artifact accompanying
      every future negative.
    controls:
      - >-
        NULL OBJECT OF THE SAME SHAPE, AND IT CAN FAIL: the L0 SIBLING -- real
        S-box in the encryption, identity SubWord in the key schedule. FORCED
        VALUE DERIVED BEFORE THE RUN: the affinity test must FAIL at 0/1000. It
        can fail as a control (i.e. it can pass and thereby void L0), which is
        exactly the property KN-FIND-029 requires and which the falsified-hint
        control catalogued at KN-TECH-1a5b7e lacked.
      - >-
        SECOND NULL: a uniformly random 128-bit bijection substituted for the
        whole cipher at every rung. Every structural forced value (affinity,
        dependency cardinalities) must FAIL on it. A test that passes on a random
        permutation is not testing structure.
      - >-
        POSITIVE CONTROL / NEARBY OBJECT WHERE THE EFFECT MUST APPEAR: L0 itself.
        The effect (recovery from one pair) MUST appear at the FULL ten-round
        count. If it does not, the pipeline is broken and no negative result may
        be reported at all. THIS IS THE POINT OF THE WHOLE PROPOSAL: the campaign
        currently has no such object.
      - >-
        GRADED CONTROL, >= 3 INTERIOR POINTS, MONOTONICITY REPORTED: L1 at
        t = 16, 12, 8, 4, 0, i.e. three genuine interior points, with monotonicity
        of each instrument's statistic reported as a first-class result.
      - >-
        ORDERING CONTROL: the sibling null and the random-permutation null are
        measured and hash-committed before any treatment rung is looked at.
      - >-
        PINNED-GROUND-TRUTH CONTROL: after the ladder is built, the pinned
        FIPS-197 known-answer vectors are re-run on the untouched reference
        implementation and must still pass byte-for-byte, proving the ladder did
        not perturb the ground truth.
      - >-
        ARCHIVE CHECK (zero compute): every archived full-round-count positive
        control for AES in this repository. NONE EXISTS -- no experiment with an
        AES-prefixed id exists at all, and EV-AES-001..005 are reduced-round or
        toy. Recorded as unavailable rather than claimed as a passed check.
    required_metrics:
      - rank(M_K), rank(M_P), and the affinity check counts, per rung
      - sibling-null and random-permutation readings, committed before treatment
      - L0 recovery rate with independent re-verification, and the certificate text if BLK-1 is resolved
      - L1 sensitivity profile per instrument with the monotonicity verdict
      - L2 dependency cardinalities from exhaustive bit-flips
      - re-run of the pinned FIPS-197 known-answer vectors after ladder construction

  falsification_conditions:
    - >-
      rank(M_K) < 128 in-harness. The bottom rung's forced value is wrong as
      stated here, the recovery is not unique from one pair, and the record must
      be superseded with the measured rank and the corrected cost
      2^{128 - rank}.
    - >-
      The L0 affinity check fails on any triple. The object was not built as
      described and nothing downstream stands.
    - >-
      The sibling null PASSES the affinity test. The test measures the key
      schedule rather than the cipher and L0's reading is void.
    - >-
      L0 recovery does not reach 100/100 with independent re-verification. A
      pipeline defect; no negative result about any object may be reported.
    - >-
      An instrument fires identically at L0 and L3. Its verdict has zero spread
      across an object family whose forced values differ by roughly 106 bits of
      recovery cost on the L0 object -- where the reference is exhaustive key
      search at 128 bits under CM-1 and the published-state-of-the-art comparison
      is unadjudicable in this environment -- so the verdict is a constant of the
      apparatus and the instrument is disqualified from licensing any barrier.

  confounders:
    - >-
      LADDER-SPECIFIC ARTIFACTS. An instrument might fire at L0 for a reason
      peculiar to affine ciphers and be blind to every realistic weakness. So a
      pass at L0 is a NECESSARY and NOT a sufficient condition for sensitivity,
      and every sensitivity claim must say which rungs it covers -- KN-FIND-029's
      "a green states its covered cells or it states nothing", applied here.
    - >-
      CONSTRUCTION LEAKAGE. Editing the pinned implementation in place to build a
      rung would contaminate the ground truth. Declared pre-run: rungs are
      separate code paths and the pinned implementation is re-verified against
      the known-answer vectors afterwards.
    - >-
      CATEGORY CONFUSION IN CITATION. The single most likely misuse of this work
      is a downstream sentence reading "this campaign achieved a ten-round key
      recovery". Declared pre-run: every statement of L0's result names, in the
      SAME SENTENCE, that the object has NO S-BOX and is not AES.
    - >-
      SESSION-COMPUTED VALUES ARE NOT HARNESS MEASUREMENTS. rank 128, rank 128
      and the 20-triple affinity check were taken outside the harness and are
      re-taken in stage 0. A discrepancy is reported, not reconciled.

  interpretation_limits:
    - >-
      L0 IS NOT AES AND NO STATEMENT ABOUT L0 IS A STATEMENT ABOUT AES. It is
      AES's round geometry with the nonlinear layer deleted. Its ~106-bit margin
      is a margin on the L0 object against exhaustive key search for a 128-bit
      key under CM-1, and the published-state-of-the-art comparison is
      UNADJUDICABLE in this environment and is asserted in neither direction.
    - >-
      A ladder pass licenses one sentence about an instrument: "this instrument
      fires at rungs X, Y and is silent at rungs Z, in this container, on this
      object set". It licenses nothing about AES.
    - >-
      The ladder does NOT make a barrier statement true. It makes one
      INTERPRETABLE. A C3 barrier still needs its own named obstruction,
      checkable argument and forward guidance.
    - >-
      Claim tier toy for every rung reading (RQ-AES-002 R7), notwithstanding the
      full round count, because the objects are structurally weakened analogues.
      The one exception the ceiling contemplates -- crypto tier through a
      re-verified full-round KEY RECOVERY certificate -- applies to AES and NOT to
      L0, and conflating the two would be the exact claim-tier violation R5
      names.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NONE LOAD-BEARING ON L0. That 10-round AES-128 with the identity S-box
        everywhere is GF(2)-affine in (P, K) is a structural fact -- every
        remaining layer is GF(2)-linear or a constant -- and rank(M_K) = 128 is a
        computed integer, not an assumption.
      rigorous_support: >-
        Layer-by-layer: AddRoundKey is XOR (linear), ShiftRows is a coordinate
        permutation (linear), MixColumns is multiplication by fixed GF(2^8)
        constants, which is GF(2)-linear on the byte's bit vector, RotWord is a
        permutation, the rcon XOR is a constant. SESSION-COMPUTED: affinity held
        on 20 random triples; rank(M_K) = rank(M_P) = 128 by exact GF(2)
        elimination.
      validation_plan: >-
        Stage 0 recomputes both ranks in-harness by exact GF(2) elimination and
        reports the matrices' digests, so a reviewer can recompute independently.
    - id: H2
      statement: >-
        SENSITIVITY MONOTONICITY. For any sound screening statistic, sensitivity
        is monotone non-increasing as AES nonlinearity is added along the L1
        ladder.
      rigorous_support: >-
        NOT A THEOREM AND NOT ASSUMED SAFE -- this is the weakest link in the
        record. It is a design expectation, not a derivation: one can construct
        statistics that respond non-monotonically to partial S-box replacement,
        for instance one keyed to the number of active byte positions. It is
        stated as a heuristic precisely so that a violation is reportable as a
        finding about the instrument rather than dismissed as noise.
      validation_plan: >-
        MEASURED at five points, with the profile published whether or not it is
        monotone. A violation is a first-class result about that instrument and
        is reported before any verdict the instrument would license.

  target_complexity:
    time_exponent: >-
      NO EXPONENT ABOUT AES IS MOVED, and the record says so plainly. On the L0
      object the recovery exponent is ~21 bit operations against the definitional
      exhaustive-key-search reference of 2^127 full AES-128 evaluations under
      CM-1 for a 128-bit key -- a margin ON L0 ONLY, with the
      published-state-of-the-art comparison UNADJUDICABLE in this environment and
      asserted in neither direction. L0 is not AES.
    memory_exponent: >-
      L0's recovery holds a 128x128 GF(2) matrix: 2 KiB. Negligible, stated
      beside time as required.
    best_known: >-
      For AES, the reference is exhaustive key search at the stated key size
      under CM-1; the published state of the art is unadjudicable here. For L0
      there is no meaningful "best known" because the object is constructed for
      this ladder.
    hidden_overhead: >-
      Building and maintaining the ladder is the overhead, measured in hours of
      implementation and minutes of compute, and it is charged once for the whole
      campaign rather than per candidate.
    tradeoff_note: n/a.

  dominated_by: >-
    "unresolvable in this environment: no primary source reachable; every
    recalled frontier row is unverified-from-memory". Set to this string and
    never to null, per RQ-AES-002 R5. Rows checked INSIDE this repository, across
    time, memory and data/queries: EV-AES-001..005, EV-AES-d33b1c, EV-AES-d8a13e;
    KN-FIND-028, KN-FIND-029; KN-TECH-063/069/070/071/074/075/079; the goal
    records GOAL-AES-001/002/003; the full experiment index, which contains NO
    experiment with an AES-prefixed id. No committed record in this repository
    contains a full-round-count positive control for an AES screening instrument.
    Absence of a search result is not evidence it was not done elsewhere.
  sota_delta: >-
    DEFINITIONAL-REFERENCE DELTA AGAINST AES: ZERO -- this proposal claims no
    attack on AES and therefore no margin whatsoever against exhaustive key
    search at any key size under CM-1, and the published-state-of-the-art
    comparison is UNADJUDICABLE in this environment and is asserted in neither
    direction (R5 clause, same sentence). The quantitative contribution is the
    ladder's forced values -- rank(M_K) = 128 at ten rounds, a ~2^21-bit-operation
    recovery on L0, dependency cardinalities 1 and 11 at L2 -- and the resulting
    rule that no instrument may license a C3 barrier without a published
    sensitivity profile across the ladder.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.97 that L0 behaves exactly as derived, because the rank has already been
    computed and the affinity is structural; the residual 0.03 is the chance that
    the harness's AES construction differs from the one this session built (for
    instance in the final round's MixColumns convention) in a way that changes
    the rank. Separately, 0.50 that at least one campaign screening instrument
    FAILS its L0 sensitivity check -- not lower because this repository has
    measured that 82 per cent of its evidence records carry no positive control
    and that named instruments elsewhere in the program have zero sensitivity
    demonstration, and not higher because an instrument built for full-round AES
    may reasonably be tuned to structure that L0 destroys along with everything
    else, which would be a legitimate reason to fail L0 and would itself have to
    be argued rather than assumed.
