idea:
  id: IDEA-20261006-52015b
  question_id: RQ-VOLC-f6253b
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    Floor-versus-crater gap in liftable roots of one S_3 slice on a toy
    ordinary 2-volcano
  class: measurement
  claim: >-
    On one complete ordinary 2-isogeny volcano over a prime p in
    (300, 2000), with j-invariants 0 and 1728 excluded, the mean number
    of liftable F_p-roots of S_3(x1, x2, X), where x1 and x2 are the two
    smallest nonnegative liftable x-coordinates on that curve, differs
    between the floor and the crater by at least 0.25.
  mechanism: >-
    The tracked object is Y(E), the number of roots of the univariate
    slice S_3(x1(E), x2(E), X) that are x-coordinates of affine F_p-points.
    Semaev's third summation polynomial has degree 2 in each variable, so
    Y(E) is an integer in {0, 1, 2}. The representation is the short-Weierstrass
    equation together with the ordered field elements x1 < x2, the two
    smallest nonnegative liftable abscissae. The operation set is the set
    of rational 2-isogenies used to label Kohel levels, not translation on
    the prime-order subgroup. A vertical 2-isogeny identifies the
    prime-order subgroups and therefore preserves any cost that factors
    through the abstract triple (group, base, target) under transport of
    points. It does not preserve the field ordering of abscissae. Y reads
    that ordering, so it is a coordinate-dependent statistic relative to
    the isogeny operation set. The projection is lossy: it discards the
    kernel polynomial, the conductor, and every abscissa except x1, x2,
    and the liftable roots. Whether Y is constant on levels is the
    measurement. Orbit canonicalisation is not required; each curve costs
    the extraction of at most two roots. This is not a first-fall degree,
    not a division-polynomial root, and not a claim that index calculus
    beats rho. KR-IC-5a43e5 already records that S_3 vanishes when three
    points sum to zero and that using summation polynomials to decompose
    over a factor base is the index-calculus framework. Y does not
    decompose a target point and does not propose a factor base.
  assumptions:
    - The sample is the first prime p in (300, 2000) whose ordinary 2-isogeny graph contains a crater and a floor, with at least two floor curves, and with no curve of j-invariant 0 or 1728 in that component.
    - Level labels come from graph distance to the crater in the rational 2-isogeny graph of one trace class. A component that does not yield two nonempty levels is replaced by the next prime and is not scored as a zero gap.
    - x1 and x2 are the two smallest nonnegative liftable x-coordinates on that curve, computed from the curve equation alone.
    - S_3 is the classical third summation polynomial, degree 2 in the free variable, with coefficients read from a and b.
  predictions:
    - metric: floor_minus_crater_mean_Y
      direction: different
      minimum_effect: >-
        The absolute difference between the floor mean of Y and the crater
        mean of Y is at least 0.25 on the full enumeration of that volcano.
  minimal_test:
    design: >-
      Search primes upward from 307 through 2000. For each prime, group
      ordinary short-Weierstrass curves by trace, connect F_p-rational
      2-isogenies, and keep the first component with a crater, a floor,
      at least two floor curves, and no j in {0, 1728}. On every curve
      compute Y. Compare floor and crater means. As a non-depth control,
      compute Y on four non-isogenous curves of four different traces at
      the same p and record their range. Run distinguished-point rho and
      BSGS on one planted logarithm per level, same scalar, as matched
      attack-cost controls.
    controls:
      - Four non-isogenous curves of distinct traces at the same p. Their Y range is the between-class comparison.
      - The conductor gap: floor and crater must differ by at least one graph step. If the labels coincide, the volcano was mis-built and the Y gap is not scored.
      - A formula check: on one curve, compare the S_3 slice with a direct search for collinear triples through the two points of abscissae x1 and x2.
      - Distinguished-point rho and BSGS on one shared planted scalar at one floor curve and one crater curve. Those operation counts are controls, not the primary metric.
    required_metrics:
      - Y on every curve of the component
      - floor mean of Y and crater mean of Y
      - graph-distance gap between floor and crater
      - Y range on the four non-isogenous curves
      - rho step count and BSGS operation count on the shared scalar
  falsification_conditions:
    - The absolute difference of the floor and crater means of Y is strictly less than 0.25.
    - The collinear-triple check disagrees with the S_3 root count on the audit curve, in which case the formula is wrong and the gap is not evidence.
    - Every curve in the component receives the same level label, so there is no depth contrast to score.
  confounders:
    - A volcano with two curves can make a 0.25 gap equal to a one-root difference. That is acceptable at this size and is not a population claim.
    - Twists and models with the same j but different (a, b) can reorder nonnegative abscissae. The design uses one reduced model per j, fixed before Y is computed.
    - Curves with a rational 2-torsion point have a repeated or zero abscissa. The two smallest nonnegative rule must be stated for that case before the run; changing it after seeing Y invalidates the gap.
  interpretation_limits:
    - A gap in Y is not a gap in rho steps and does not move the exponent 1/2.
    - Costs that factor through the transported prime-order subgroup are outside this claim. Y uses field-absolute abscissae.
    - The result closes only this slice of S_3 on the one volcano that the search returns, at claim tier toy.
    - This is not a first-fall-degree comparison, not the least rational root of a division polynomial, and not a minimal-polynomial weight.
    - Matching KR-IC-5a43e5 would mean restating that S_3 vanishes on sums to zero or that its degree is 2. This claim is a level-mean gap and does not restate that vanishing theorem.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For fixed liftable x1 and x2, the two roots of S_3(x1, x2, X) in
        the algebraic closure behave, as candidates for liftable F_p-abscissae,
        like two uniform draws in F_p, so the liftable-hit count Y has mean
        on the order of 2 times (number of liftable x) / p, which is about 1.
      rigorous_support: >-
        S_3 has degree 2 in the free variable, which is the degree
        2^{m-2} at m=3 recorded on KR-IC-5a43e5. That degree bound is the
        structural half. Uniformity of the roots among field elements is
        the distributional half and is not a theorem used as support here;
        it is the comparison model. Semaev's construction of S_3 is the
        frontier row just opened, not a new derivation.
      validation_plan: >-
        On every curve of the frozen volcano, compare the observed mean of
        Y with the uniform-hit prediction 2 * (number of affine
        x-coordinates) / p, and compare the floor mean with the crater
        mean. The pre-registered effect is an absolute floor-crater gap of
        at least 0.25, not a fit to the uniform model. The same prediction
        is evaluated on the four non-isogenous curves at the same p.
  target_complexity:
    time_exponent: >-
      Unchanged at 1/2. Enumerating at most two roots per curve is not an
      index-calculus attack and does not beat generic rho. Naive prime-field
      Semaev index calculus is already recorded as not beating generic
      algorithms (KR-IC-5931ee). KR-IC-5a43e5 prices the summation
      polynomial as the framework, not as a faster exponent.
    memory_exponent: >-
      Unchanged. The slice stores O(1) coefficients. It does not build a
      BSGS table of size sqrt(N) and does not shrink one.
    best_known: >-
      Generic rho at exponent 1/2 and polynomial memory (KR-RHO-13bf67),
      and the statement that isogenous curves share the group-structure
      weaknesses rho already sees (KR-RHO-755e35). This idea does not beat
      rho on time or memory.
    hidden_overhead: >-
      None. The polynomial degree 2 and the root cap 2 are explicit. No
      o(1) improvement is claimed.
    tradeoff_note: >-
      The measurement is not a point on the van Oorschot-Wiener curve.
      Rho and BSGS are recorded only as matched controls on one scalar.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  novelty_status: unverified
  citations:
    - ref: ledger/questions/RQ-VOLC-f6253b.yaml
      provenance: internal
      claim: >-
        Depth may be admitted as an attack-cost effect only if it survives
        stratified nulls and is routed through a named non-generic resource.
        On the prime-order subgroup every endomorphism acts as a scalar.
      verified_by: ledger/questions/RQ-VOLC-f6253b.yaml
    - ref: KR-IC-5a43e5
      provenance: internal
      claim: >-
        S_m vanishes exactly when points with those x-coordinates sum to
        zero up to signs. S_3 is explicit and has degree 2^{m-2} in each
        variable, hence degree 2 for m=3. Using summation polynomials to
        decompose over a factor base is the index-calculus framework, so
        novelty cannot be the phrase "use summation polynomials".
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Over a finite field, isogenous curves have the same number of
        points, and walking the isogeny class does not reach a different
        group-structure weakness.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        Generic discrete logarithms in a prime-order group require
        Omega(sqrt(p)) group operations.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KR-IC-5931ee
      provenance: internal
      claim: >-
        Under the stated statistical assumptions, naive Semaev index
        calculus over prime fields costs at least as much as generic
        algorithms.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5931ee.yaml
    - ref: ledger/proposals/IDEA-20260807-5cabfc.yaml
      provenance: internal
      claim: >-
        A vertical ell-isogeny induces an isomorphism on a prime-order
        subgroup of order different from ell, so a cost that factors
        through the abstract triple is constant across levels.
      verified_by: ledger/proposals/IDEA-20260807-5cabfc.yaml
    - ref: Kohel ell-isogeny volcanoes
      provenance: recalled
      claim: >-
        Rational ell-isogenies organise an ordinary isogeny class into
        levels by conductor. This session did not open Kohel's thesis.
      verified_by: null
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-IC-5a43e5
      - KR-RHO-755e35
      - KR-RHO-13bf67
      - KR-IC-5931ee
    nearest:
      - ref: KR-IC-5a43e5
        provenance: internal
        relation: adjacent
        delta: >-
          That row states the vanishing rule, the explicit S_3, and degree
          2^{m-2} (degree 2 when m=3), and it forecloses treating factor-base
          decomposition by summation polynomials as a new method. This idea
          does not decompose a target and does not change a solver. The
          separator is an absolute floor-crater gap of at least 0.25 in a
          mean of integers in {0, 1, 2} on one toy volcano, and the exponent
          movement against rho is 0.
        verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
      - ref: KR-RHO-755e35
        provenance: internal
        relation: adjacent
        delta: >-
          That row says isogenous curves share group order and
          group-structure weakness. This idea measures a field-absolute
          root count Y in {0, 1, 2} and asks for a floor-crater mean gap
          of at least 0.25. It does not claim a different group order, and
          the exponent movement is 0.
      - ref: KR-IC-5931ee
        provenance: internal
        relation: adjacent
        delta: >-
          That row says naive prime-field summation-polynomial index
          calculus does not beat generic algorithms. This idea enumerates
          at most two roots per curve on one toy volcano and claims no
          attack below rho. The separator is a mean gap of 0.25, not an
          exponent.
  dominated_by: >-
    Pollard rho at exponent 1/2 and polynomial memory dominates this
    enumeration on time and on queries. BSGS dominates it on any reading
    that would turn Y into a table. The root count does not beat either
    method. KR-IC-5a43e5 already owns the summation polynomial as a
    decomposition framework, and this count does not beat that framework
    or rho.
  sota_delta: >-
    The separator is an absolute gap of 0.25 in a mean of integers in
    {0, 1, 2}, on one volcano, against the degree-2 slice already stated
    by KR-IC-5a43e5. The distance to a sub-square-root algorithm is the
    full exponent 1/2, and this idea moves that exponent by 0.
