idea:
  id: IDEA-20260805-6eac55
  question_id: RQ-HAWK-001
  goal_id: GOAL-HAWK-001
  added: '2026-08-05'
  title: >-
    The tau-cocycle lattice as an integral quadratic form: a sieve-free,
    exact-integer certificate for Proposition 4.5 of the disclosed HAWK attack,
    with four forced values derived before any run and a matched null that can
    fail
  class: verification

  claim: >-
    The whole load-bearing step of the disclosed HAWK key-recovery attack
    (KN-LIT-7592, Straznickas-Weis) can be independently CHECKED without a
    lattice sieve, without fpylll, without Sage, and without solving any SVP
    instance, because the step is an assertion about an INTEGRAL QUADRATIC
    FORM and not about an algorithm. Proposition 4.5 asserts that the publicly
    computable rank-n lattice Lambda_B^(tau) carrying the tau-cocycle
    V_tau = B^{-1} tau(B) is isometric to
    sqrt(n/4) Z^{n/2+1} (+) sqrt(n/2) Z^{n/2-1}.
    That single sentence FORCES four integers that can be computed exactly in
    pure Python from the PUBLIC key alone: (F1) rank exactly n; (F2) Gram
    determinant exactly (n/4)^{n/2+1} * (n/2)^{n/2-1}; (F3) exactly n+2 vectors
    of squared length n/4, i.e. lambda_1^2 = n/4 with kissing number n+2;
    (F4) exactly n^2/2 + 2n - 2 vectors of squared length n/2. All four are
    stated here BEFORE any computation. The proposal is to build the lattice
    from Q alone by a defining linear system DERIVED IN THIS RECORD (the paper's
    Lemmas 4.1 and 4.3 were NOT read), measure F1-F4 at n = 4, 8, 16, 32, and
    report the comparison against a matched null and a positive control. Both
    outcomes are deliverables: agreement gives this program its first
    independently computed HAWK object and a toy-tier certified re-derivation of
    the attack's structural core; disagreement locates either an error in the
    derivation below (most likely) or in a relayed characterisation of the
    paper, and either is worth the day it costs.

  object_first_candidate:
    tracked_object: >-
      The tau-COCYCLE V_tau = B^{-1} tau(B) in M_2(R_n), followed NOT as a
      lattice-reduction target but as a point of an integral quadratic space:
      the Z-module Lambda_B^(tau) = {Y in M_2(R_n) : tau(Y) = adj(Y) and
      Q Y = ((c tau)(Y))^T tau(Q)} equipped with the rational quadratic form
      Q^(tau)(Y) = Tr_{F/Q}(det Y), F the degree-n/4 fixed field of <c, tau>.
      What is followed through the computation is the GRAM MATRIX of that form
      in an HNF basis of Lambda_B^(tau) -- an n x n integer matrix -- and the
      three invariants of it (rank, determinant, theta coefficients) that
      Proposition 4.5 pins to exact values.
    established_families_off_limits: >-
      Declared off-limits as the PRIMARY LENS for this proposal: (a) BKZ /
      progressive-sieve blocksize estimation and every core-SVP or AGPS20
      gate-count argument -- the whole point is that the check must not need a
      solver; (b) the primal/dual embedding attacks on module-LWE and NTRU;
      (c) hybrid meet-in-the-middle and combinatorial key guessing;
      (d) decryption-failure and side-channel routes (HAWK is a signature
      scheme and those are a different attack surface, e.g. the relayed
      sign-leakage claim of iacr:2026/1366);
      (e) the nrd-PIP / principal-ideal / class-group family (KN-OPEN-028) --
      that is a different lane of this same goal and this proposal deliberately
      does not enter it;
      (f) the OTHER order-2 symmetry, complex conjugation c, which is the lens
      every pre-2026 module-LIP paper used. Point (f) is the interesting one:
      the disclosed attack's whole engine was refusing (f), and this proposal
      inherits that refusal rather than re-deriving it.
    newness_score: >-
      The OBJECT is not new -- it is the paper's own Lambda_B^(tau). What is new,
      and what makes the record worth having, is the DECISION TO TREAT IT AS AN
      INTEGRAL FORM RATHER THAN AS A REDUCTION PROBLEM, which converts a check
      that appears to need a sieve into exact integer linear algebra, and the
      derivation below of an explicit Z-LINEAR defining system for it. Against
      this program's corpus the newness is unambiguous in a weaker but real
      sense: GOAL-HAWK-001 has run zero computations of any kind
      (EV-HAWK-001: "This program has run no HAWK experiment"), so any computed
      HAWK object is the first. Against the external literature the derivation
      below is very likely a re-derivation of the paper's Lemmas 4.1/4.3, which
      were NOT READ; that is stated as the expected case, not hidden.
    testability_score: >-
      Very high and unusually cheap. Everything is exact integer arithmetic on
      matrices of size at most 4n x 4n with n <= 32, i.e. at most 128 x 128,
      plus a shortest-vector ENUMERATION which is trivial precisely because the
      claimed basis is orthogonal. numpy 2.4.6 is present in this container
      (verified this session by `python3 -c "import numpy"`); sympy, Sage,
      fpylll and PARI are ABSENT (verified the same way). The design therefore
      uses Python integers and hand-written HNF/Smith-form routines and needs
      none of the absent packages.
    survival_score: >-
      The object survives the entire computation by construction -- it is a
      fixed integral form, not a statistic. The risk is not that it dissolves
      but that the DERIVED defining system below is not the paper's, in which
      case the instrument is measuring a different lattice. The positive control
      (V_tau computed from the secret must LIE in the constructed lattice with
      squared length exactly n/4) is what detects that, and it can genuinely
      fail.

  mechanism: >-
    ALL OF WHAT FOLLOWS IS DERIVED IN THIS RECORD. The paper's Lemmas 4.1 and
    4.3, which state the defining constraints, were NOT READ -- only the
    two-sentence summaries in KN-LIT-7592 and the verbatim fragments in
    coordination/goals/GOAL-HAWK-001/batches/BATCH-001/tasks/TASK-20260802-004/
    disclosed_attack_transcription.md. Every step below is therefore a CANDIDATE
    RE-DERIVATION to be tested, never a citation.

    SETUP. m = 2^ell, K = Q(zeta_m), R = Z[zeta_m], n = phi(m) = 2^{ell-1} = m/2
    is the ring degree. HAWK's secret key is B in SL_2(R); the public key is the
    Gram matrix Q = B* B where B* = c(B)^T and c is complex conjugation
    (c(zeta) = zeta^{-1}). Two further automorphisms are available:
    tau(zeta) = -zeta and c*tau.

    (D0) WHEN DOES tau EXIST. -zeta_m = zeta_m^{1 + m/2}, so tau = sigma_{1+m/2}.
    For sigma_{1+m/2} to be a field automorphism we need gcd(1 + m/2, m) = 1;
    if p is an odd prime dividing m then p | m/2, so 1 + m/2 == 1 mod p and the
    gcd condition holds automatically, while 1 + m/2 is odd exactly when 4 | m.
    Hence tau is defined iff 4 | m. Its order: (1 + m/2)^2 = 1 + m + m^2/4 ==
    1 + m^2/4 mod m, which is 1 mod m iff 4 | m. And tau = c iff
    1 + m/2 == -1 mod m iff m | m/2 + 2, which for m > 4 is impossible. So:
    **tau is an order-2 automorphism distinct from c iff 4 | m and m > 4.**
    This is a derivation, not a quotation; the paper is reported to state the
    complementary evasion criterion in the form "conductors m in {p^k, 2p^k}
    evade", which is the DIFFERENT and STRICTLY STRONGER condition
    "(Z/m)^x is cyclic". The gap between the two is the subject of the sibling
    proposal IDEA-20260805-128f35 and is not pursued here.

    (D1) THE COCYCLE IDENTITY. Put V = B^{-1} tau(B). Then
    tau(V) = tau(B)^{-1} tau^2(B) = tau(B)^{-1} B = V^{-1}, i.e.
    V * tau(V) = I. Also det V = det(B)^{-1} * tau(det B) = 1^{-1} * tau(1) = 1
    because B in SL_2(R). For a 2x2 matrix of determinant 1,
    V^{-1} = adj(V), so with V = [[a, b], [c, d]]:
      tau(a) = d,  tau(d) = a,  tau(b) = -b,  tau(c) = -c.
    THESE ARE Z-LINEAR CONDITIONS on the 4n integer coordinates of (a,b,c,d) in
    the power basis 1, zeta, ..., zeta^{n-1}: tau(zeta^j) = (-1)^j zeta^j, so
    tau acts diagonally with signs. Counting: d is determined by a (n free
    coordinates); tau(b) = -b kills the even-index coordinates of b, leaving
    n/2; likewise c leaves n/2. So the conditions of (D1) alone cut M_2(R)
    (Z-rank 4n) down to Z-rank n + n/2 + n/2 = 2n.

    (D2) THE PUBLIC-KEY CONDITION, LINEARISED -- the step that makes the lattice
    PUBLICLY computable. Since Galois acts through ring automorphisms and c
    commutes with tau, tau(B*) = tau(B)*. From tau(B) = B V:
      tau(Q) = tau(B* B) = tau(B)* tau(B) = (B V)* (B V) = V* Q V.
    Multiply on the left by (V*)^{-1}. Now
      (V*)^{-1} = (c(V)^T)^{-1} = (c(V^{-1}))^T = (c(tau(V)))^T = ((c tau)(V))^T,
    using V^{-1} = tau(V) from (D1). Therefore
      **Q V = ((c tau)(V))^T tau(Q).**
    tau(Q) is computed from the PUBLIC Q by applying tau entrywise; c*tau acts
    on coordinates by a sign pattern composed with the conjugation permutation.
    Both sides are Z-LINEAR in the coordinates of V, with coefficients built
    from Q alone. So
      Lambda_B^(tau) := {Y in M_2(R) : tau(Y) = adj-pattern(Y),
                                       Q Y = ((c tau)(Y))^T tau(Q)}
    is a Z-lattice computable from the public key, and V_tau lies in it. The
    paper reports rank n; (D1) gives 2n, so (D2) must remove exactly n further
    dimensions. THAT IS A PREDICTION OF THIS DERIVATION AND IS FORCED VALUE F1.

    (D3) THE LENGTH FORM. The transcribed fragment gives
    Q^(tau)(Y) := Tr_F(det Y) with F the degree-n/4 field fixed by c and tau.
    Consistency check performed here: for Y satisfying (D1),
    tau(det Y) = tau(a)tau(d) - tau(b)tau(c) = d a - (-b)(-c) = det Y, so
    det Y lies in K^tau = Q(zeta^2), degree n/2. That det Y is additionally
    c-invariant -- i.e. lands in F, degree n/4 -- does NOT follow from (D1)
    alone and must come from (D2); this record does not claim to have proved it
    and makes it an explicit instrument self-test (see minimal_test, CHK-3).
    Granting it, Q^(tau) is a rational quadratic form on a rank-n lattice, and
    Q^(tau)(V_tau) = Tr_{F/Q}(det V_tau) = Tr_{F/Q}(1) = [F : Q] = n/4.
    So lambda_1(Lambda_B^(tau))^2 <= n/4, unconditionally, for every B in
    SL_2(R). Note what this does and does not give: the UPPER BOUND n/4 is
    generic and follows from det B = 1 alone; the ORTHOGONAL SPLITTING is the
    2-power-specific content of Proposition 4.5 and is exactly what is unproven
    here and measured by the experiment.

    (D4) THE FOUR FORCED VALUES. If Lambda_B^(tau) is isometric to
    L := sqrt(n/4) Z^{k1} (+) sqrt(n/2) Z^{k2} with k1 = n/2 + 1,
    k2 = n/2 - 1, then, computed in this session and recorded before any run:
      F1  rank = k1 + k2 = n.
      F2  det(Gram) = (n/4)^{k1} * (n/2)^{k2}.
          n=4: 2. n=8: 2048. n=16: 549755813888.
          n=32: 2596148429267413814265248164610048.
      F3  #{v : Q^(tau)(v) = n/4} = 2*k1 = n + 2.
          n=4: 6. n=8: 10. n=16: 18. n=32: 34.
      F4  #{v : Q^(tau)(v) = n/2} = 4*C(k1,2) + 2*k2 = n^2/2 + 2n - 2.
          n=4: 14. n=8: 46. n=16: 158. n=32: 574.
      F4 is the second theta coefficient and is the sharpest of the four: it is
      quadratic in n, so an accidental match is far less likely than for F1-F3,
      and it distinguishes the claimed ORTHOGONAL SUM from any merely
      determinant-matching form.
    F3 also reproduces the paper's own downstream arithmetic, which is a
    consistency check on the derivation rather than on the paper: the
    transcription records "exactly two of the 2(n/2+1) shortest-vector
    candidates, +/- V_tau, satisfy Y == I (mod 2)", and 2(n/2+1) = n + 2 = F3.

    (D5) COST BOOKKEEPING FOR THE CHECK ITSELF. Building the linear system is
    O(n) applications of Galois elements to n-coordinate vectors plus one
    kernel computation over Q on a matrix of size at most 4n x 4n -- at n = 32
    that is 128 x 128 exact rational Gaussian elimination, milliseconds in
    Python. F2 is one integer determinant of an n x n matrix (Bareiss,
    O(n^3) big-integer operations). F3 and F4 need a short-vector ENUMERATION,
    which is cheap precisely because the hypothesis under test says the Gram
    matrix diagonalises: run LLL-free Fincke-Pohst on the HNF basis, and if the
    claim is true the enumeration tree has essentially no branching. If the
    claim is FALSE the enumeration may blow up, and that blow-up is itself
    diagnostic -- so the contract charges it with a node budget and reports
    exhaustion as a measured outcome, not as a timeout (see the experiment's
    infrastructure-failure disposition).

  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-05'
    what_the_screen_could_see: >-
      Corpus grep over ledger/, knowledge/, experiments/ and coordination/ for
      HAWK, module-LIP, cocycle and Lambda; plus the goal, question, evidence,
      correction and decision records of GOAL-HAWK-001 read in full. IT COULD
      NOT SEE: the body of the disclosed attack (only its abstract,
      introduction and the BATCH-001 transcription fragments were ever read by
      this program), the HAWK Round-3 specification (unread), iacr:2026/1318's
      body (Cloudflare-gated), or iacr:2026/1560 (abstract only, relayed from
      this session's scouting brief). Per KN-OPEN-3f7a21 and the literature
      sweep, this corpus's `citation_verified: read` field is unreliable at
      scale, so a corpus screen is a weak instrument and is not treated as one.
    result: >-
      GOAL-HAWK-001 holds exactly one prior proposal, IDEA-20260801-019, which
      proposes to "re-implement the reduction and the solver from the report's
      specification" and to compare "recovered-key success rate and cost".
      THAT PROPOSAL NEEDS AN SVP SOLVER THIS CONTAINER DOES NOT HAVE, states no
      forced value, and its only control is "sanity solver on random (non-key)
      module-LIP instances". This proposal is not a variant of it: it removes
      the solver from the critical path entirely and replaces a success-rate
      comparison with four pre-derived integers. Zero prior hypotheses, zero
      prior experiments, zero prior runs exist in area HAWK.
    conclusion: >-
      Novel WITHIN THIS CORPUS with high confidence. Against the external
      literature, the derivation in `mechanism` is expected to coincide with the
      paper's Lemmas 4.1/4.3 and is recorded as a re-derivation, not a discovery.

