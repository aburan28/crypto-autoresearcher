  batch: EC-STRUCTURE-20260825
  cluster: 'C4-harmonic: attacking DL circularity head-on'
  title: 'HARMONIC ANALYSIS ON THE ISOGENY CLASS: the ordinary F_p-isogeny class is a torsor under the
    class group, so every per-curve cost or yield functional is a function on a finite abelian group --
    compute its Fourier spectrum and find out whether the cheapest representative can be located in O(sqrt(h))
    or whether the class is spectrally flat'
  class: measurement
  claim_ceiling: unverified_zero_run_structural_proposal_only_no_experiment_no_implementation_no_status_change_no_novelty_conclusion
  status: proposed
  novelty_status: unverified
  novelty_note: The class-group torsor structure is classical CM theory and is recalled. The proposed
    contribution is treating the program's own COST FUNCTIONALS as vectors on that group and asking for
    their spectrum, which converts a search over the class into a signal-processing question with a clean
    null.
  claim:
    semantic_part: Fixing a base curve identifies the ordinary isogeny class with the class group Cl(O);
      any functional defined per curve -- decomposition yield of a canonically defined factor base, relation-matrix
      conditioning, realized rho constant, smallest isogeny degree -- is then a function on a finite abelian
      group whose Fourier spectrum is computable exactly at toy scale.
    evaluator_part: 'Unestablished: whether any functional has concentrated spectrum. Flatness is the
      expected outcome and would be a recordable controlled null closing a lane the ledger has reopened
      several times.'
    end_to_end_ecdlp_claim: false
    breakthrough_claim: false
  mechanism:
  - Enumerate a toy ordinary isogeny class explicitly and fix the torsor identification with Cl(O) by
    choosing a base curve and computing the ideal class of each isogeny.
  - Evaluate a chosen functional on every curve in the class.
  - Compute the Cl(O)-Fourier transform of the resulting vector; report the concentration profile.
  - If concentrated at low frequency, a descent to the extremal representative costs O(sqrt(h)) rather
    than h -- state the resulting search and charge it fully against what the extremal representative
    is actually worth, which may be nothing.
  - 'If flat, record a controlled null: the isogeny class carries no exploitable structure with respect
    to that functional, which is a closure with a mechanism rather than a fatigue report.'
  lossy_projection_test:
    tracked_object: a real-valued cost functional on the isogeny class
    what_is_discarded: everything about each curve except one number
    propagation: the class-group action translates the function, so the spectrum is the natural invariant
    verdict: 'PASSES: strongly lossy, and equivariance under the class-group action is exactly what makes
      the spectrum meaningful rather than arbitrary.'
  predictions:
  - id: P1
    status: established_formula
    statement: The ordinary F_p-isogeny class with fixed endomorphism ring is a torsor under Cl(O).
  - id: P2
    status: unestablished
    statement: The spectrum of the yield functional is flat to within the sampling null.
  - id: P3
    status: unestablished
    statement: No functional tested has enough concentration to beat exhaustive search over the class
      once the isogeny evaluations are charged.
  minimal_discriminating_test:
    status: specified_not_run
    test: One toy class with h in the low hundreds; compute three functionals on every member; transform;
      compare the concentration profile with a random relabelling of the same value multiset.
    pass: 'Profiles are indistinguishable from the relabelled null: flat, recorded as a controlled null.'
    fail: Concentration beyond the null on any functional is a positive requiring replication on a second
      class before any claim.
  controls:
  - Random relabelling of the class (destroys group structure, preserves the value multiset) -- the decisive
    null.
  - A deliberately planted low-frequency functional as the positive control that the transform detects
    concentration when it exists.
  - A second isogeny class with a different class-group structure, to separate group structure from curve
    arithmetic.
  confounders:
  - The torsor identification depends on the base curve; the spectrum's magnitude does not, but implementation
    errors in the identification look like structure.
  - Small h gives few frequencies and high variance.
  - A functional that is itself a class-group character by construction would trivially concentrate; functionals
    must be defined without reference to the group.
  falsification:
    semantic: Flat spectra on all tested functionals close the lane for those functionals and that class.
    evaluator: An error in the ideal-class computation scopes out that class.
    not_falsification: Inability to enumerate a class of the desired size.
  why_this_is_not_a_variant: IDEA-20260812-68e87f proposes an instrumented within-class cost census; that
    produces the value vector. This record says what to DO with the vector -- treat it as a function on
    a group and transform it -- and supplies the null that makes the reading interpretable. The two compose
    directly and this record cites that one as its data source.
  limits:
  - 'Zero-run: nothing here has been executed, measured, or independently reviewed.'
  - Proposal tier only; claim ceiling is stated in claim_ceiling and is not exceeded.
  - No end-to-end ECDLP algorithm, exponent, or cost claim is made.
  - 'Novelty is unverified: no literature screen was performed for this batch.'
  - Public parameters and toy instances only; no live key, wallet, or deployed target.
  sota_delta:
