idea:
  id: IDEA-20260807-a3d644
  question_id: RQ-JINV-8fc13a
  added: '2026-08-07'
  title: >-
    The matched-null battery for "special j", including the fact that an exact
    (p, N, cofactor) match across different D_0 is IMPOSSIBLE by T4 so the null
    must be built through the cofactor; plus the sixth-power representation null
    that no other L3 proposal can pass without; plus the |D_0| decay ladder
    3,4,7,8,11,19,43,67,163 -> h=2 -> generic, whose flat-then-jump profile is
    this lane's canonical artifact signature
  class: control

  claim: >-
    (A) THE LANE HAS NO USABLE NULL YET, AND THE OBVIOUS ONE DOES NOT EXIST.
    RQ-JINV-8fc13a and DECOMPOSITION.md section 4 (L3) both specify the
    comparison "curves with |D_0| in {3,4,7,8,11,...} against generic-D_0 curves
    at matched p and matched N". That comparison is NOT CONSTRUCTIBLE AS STATED
    when the cofactor is fixed. Reason, and it is T4: the isogeny class is
    determined by the trace t, and #E = p + 1 - t. Fixing p, fixing N and fixing
    the cofactor h fixes #E = hN, hence fixes t, hence fixes D = t^2 - 4p and
    therefore D_0. TWO CURVES OVER THE SAME p WITH THE SAME GROUP ORDER HAVE THE
    SAME FUNDAMENTAL DISCRIMINANT. [derived here from T4; elementary.]
    The null is therefore only reachable by letting the cofactor differ:
    #E = h1*N with D_0 = -3 and #E' = h2*N with generic D_0, same p, same prime
    N, h1 != h2. Such pairs exist and are findable at toy scale by search, but
    they are RARE and the search cost is part of this proposal's deliverable.
    Any L3 record that claims a "matched p and matched N" null WITHOUT saying
    how the cofactor differs has either not built the null or has silently
    matched something weaker, and this record exists so that no such claim
    passes unchallenged.

    (B) THE FOUR NULLS THIS LANE ACTUALLY NEEDS, IN INCREASING SHARPNESS.
      NULL-1 SAME-p, SAME-N, DIFFERENT-COFACTOR, GENERIC D_0. The nearest
        legitimate approximation to the brief's null. Isolates "small |D_0|"
        from "this prime" and from "this subgroup size". Cost: a search over
        curves at fixed p; the yield rate is measured and reported.
      NULL-2 SAME-p, SAME-BIT-LENGTH-N, GENERIC D_0. The cheap fallback when
        NULL-1 cannot be found at a given p. Weaker, and every use of it must
        say which of the two was used.
      NULL-3 THE WITHHELD-ENDOMORPHISM ARM. The SAME j=0 curve, the SAME
        instance, with phi denied to the algorithm. This separates two things
        every L3 measurement conflates: "being a curve with small |D_0|" and
        "using the automorphism". Predicted: NULL-3 is statistically
        indistinguishable from NULL-1 on every functional. If it is NOT, then
        something about j=0 curves is affecting the measurement WITHOUT the
        automorphism being used, which is either a curve-generation confound or
        the lane's only genuine finding - and either way it must be resolved
        before anything else in L3 is believed.
      NULL-4 THE SIXTH-POWER REPRESENTATION NULL, AND IT IS THE SHARPEST
        INSTRUMENT IN THE BATCH. Over F_p, the curves y^2 = x^3 + b and
        y^2 = x^3 + u^6 b are F_p-ISOMORPHIC for every u in F_p^*, via
        (x,y) -> (u^2 x, u^3 y). They have the same j, the same D_0, the same
        group order, the same N, and an ECDLP instance on one transports to the
        other in O(log p) with the same k. THEREFORE ANY INTRINSIC COST
        FUNCTIONAL MUST TAKE THE SAME VALUE ON BOTH. A measured difference is
        proof that the instrument is reading the REPRESENTATIVE (a,b) rather
        than the curve, and it voids the measurement outright. The analogous
        null at j=1728 is a -> u^4 a. Note the arithmetic that makes this
        non-vacuous: for p congruent to 1 mod 3 the sixth powers have index 6 in
        F_p^*, so b ranges over a coset of size (p-1)/6 within its isomorphism
        class and the null has plenty of room; the SIX cosets are the six sextic
        twists and they are genuinely different curves in different isogeny
        classes, which is the distinction the null tests the instrument's ability
        to make.

    (C) THE DECAY LADDER, WHICH IS WHAT TURNS A COMPARISON INTO A CONTROL.
    docs/inventor-protocol.md section 3 requires naming the parameter whose
    increase must destroy the signal. For this lane that parameter is |D_0|, and
    the ladder is the nine class-number-one discriminants
    {3, 4, 7, 8, 11, 19, 43, 67, 163}, then a class-number-two rung, then
    generic. ANY QUANTITY CLAIMED TO ARISE FROM "SMALL |D_0|" MUST DECAY ALONG
    THAT LADDER. The canonical artifact tell for L3 is a quantity that is FLAT
    across |D_0| = 3 to 163 and then JUMPS at generic: such a quantity is not
    tracking |D_0| at all, it is tracking "this curve was built by the CM method
    rather than by pseudorandom search", which is a property of the generation
    procedure and not of the curve. That confound is specific to this lane, it
    is easy to fall into because CM curves are generated differently from random
    ones, and no other L3 proposal can detect it alone.
    SECOND LADDER, ORTHOGONAL: |Aut|, which takes only the values 2, 4, 6 over
    prime fields with p > 3. A quantity claimed to come from the automorphism
    must be monotone in |Aut| across {generic, j=1728, j=0}; three points is few,
    but a non-monotone profile across three families with a predicted monotone
    law is decisive.

    (D) THE CALIBRATION THIS PROPOSAL ALSO FIXES, BECAUSE NOTHING ELSE DOES.
    KN-TECH-018 records the rho discount as sqrt(|Aut|). But this program's
    baseline convention is 0.886*sqrt(N) and KN-TECH-006 states that this
    convention ALREADY INCLUDES the sqrt(2) from negation. Therefore the EXTRA
    discount available at special j, measured against the program's own
    baseline, is
      sqrt(|Aut|/2) = sqrt(3) = 1.732 for j=0, and sqrt(2) = 1.414 for j=1728,
    NOT sqrt(6) and sqrt(4). Quoting sqrt(6) against an already-negation-
    discounted baseline double-counts negation and overstates the j=0 advantage
    by a factor sqrt(2). This record pins the number by measurement, and it can
    do so without stepping on H-RHO-bc6ea6, which explicitly places
    j in {0, 1728} OUT OF SCOPE - so the j=0 and j=1728 rho constants are
    UNMEASURED in this program and there is no duplication.
    THIS PROPOSAL CLAIMS NOTHING BEYOND THAT CONSTANT and is filed as baseline
    calibration plus instrumentation, never as an attack.

  resource_label: >-
    "audit: consumes no resource". This is a control and instrument proposal. It
    mounts no attack, consumes no R1-R8 resource, and exists so that the other
    L3 proposals' negatives are citable and their positives are challengeable.

  admissibility: admissible
  admissibility_argument: >-
    Instrumentation is not subject to the admissibility filter because it names
    no mechanism to escape the generic group with. Its own outputs are matched
    baselines and null objects, not advantages. Note the one place it touches
    the filter substantively: NULL-3, the withheld-endomorphism arm, is a
    DIRECT operationalisation of H-ENDO-001's scalar-action argument - if
    knowing phi confers nothing beyond the automorphism-quotient constant, then
    NULL-3 and the full j=0 arm must differ by exactly that constant and by
    nothing else. Measuring that difference is the cheapest empirical check on
    an argument the entire campaign leans on.

  discriminated_from:
    - >-
      Lane L14 (RQ-INSTR-f8faa0), which owns instrumentation, null objects and
      certificates campaign-wide. This proposal is the L3-SPECIFIC instance:
      NULL-1's impossibility argument, NULL-4's sixth-power construction and the
      |D_0| decay ladder are meaningful only for this lane. If the Coordinator
      prefers, it should be dispatched as an L14 task with an L3 scope; the
      content does not change.
    - >-
      H-RHO-bc6ea6 (specified), which measures the negation quotient's shortfall
      and its escape rules for r = 1, and which EXPLICITLY EXCLUDES j in
      {0, 1728}. This proposal measures the j=0 and j=1728 constants, which that
      hypothesis does not touch. Its escape-rule taxonomy is reused as an input
      rather than re-derived.
    - >-
      KN-TECH-018, which states sqrt(|Aut|) without saying against which
      baseline. Claim (D) resolves that ambiguity and the resolution changes the
      headline number by a factor sqrt(2).
    - >-
      IDEA-20260807-bfa86b (this batch), which is the POSITIVE control - a
      planted weakness the instrument must detect. This proposal is the NEGATIVE
      control - matched objects on which the instrument must detect nothing. An
      instrument needs both and neither substitutes for the other.
    - >-
      IDEA-20260807-51675e (this batch), the scope table. That record says which
      DEPLOYED curves are affected; this one says how to MEASURE anything about
      them without fooling yourself.

  object_first_candidate:
    tracked_object: >-
      THE MATCHED PAIR - two curve instances agreeing on every declared
      controlled variable and differing in exactly one (D_0, or the availability
      of phi, or the choice of isomorphism representative) - followed as the
      controlled variable is swept along its ladder.
    lossiness: >-
      LOSSY BY DESIGN AND THAT IS ITS WHOLE FUNCTION. The pair retains only the
      DIFFERENCE of a functional between two instances and discards both
      absolute values. Absolute values at toy scale are dominated by
      implementation constants and instance noise; differences at matched
      parameters are not. Nothing about either instance's discrete logarithm is
      recoverable from the pair.
    propagation: >-
      Propagates deterministically through the measurement pipeline: whatever
      transformation is applied to one member is applied identically to the
      other, so the difference is stable under any change of solver, seed policy
      or cost unit that is applied to both. It fails to propagate exactly when
      the matching breaks - which is the event the instrument is built to detect.
    survival_score: >-
      Survives every solver change and every cost-model change applied to both
      arms. Dies the moment the arms differ in something undeclared - a different
      p, a different N bit-length, a different factor-base construction, a
      different curve-generation procedure. NULL-4 is the strongest because it
      survives ALL of those by construction: the two arms are the same curve.

  mechanism: >-
    STEP 1 (search, low compute, and it produces a reusable asset). At each
    declared field size, search for NULL-1 pairs: same p, same prime N,
    different cofactor, one arm with D_0 = -3 (or -4) and one with generic D_0.
    Record the search cost and yield rate - which is itself a reportable number,
    because if NULL-1 pairs are very rare at toy scale then every future L3
    record must use NULL-2 and say so. Freeze the found pairs as a named
    instance set that later experiments cite rather than regenerate.

    STEP 2 (NULL-4, minutes, and it should be run FIRST on any new instrument).
    For each declared j=0 curve, generate three isomorphic presentations
    b, u1^6 b, u2^6 b, transport P and Q through (x,y) -> (u^2 x, u^3 y), and run
    the full measurement pipeline on all three. Assert exact equality of every
    intrinsic functional and of the recovered k. THIS IS A ZERO-COST GATE AND IT
    SHOULD BLOCK EVERY OTHER L3 RUN: an instrument that reports different
    Groebner solving degrees, different relation yields or different rho step
    counts for b and u^6 b is measuring the integer size of the coefficients and
    nothing else, and every number it has produced is void.

    STEP 3 (the ladder). Build instances at |D_0| in {3,4,7,8,11,19,43,67,163},
    at a class-number-two rung, and at generic, all at matched p where possible
    and at matched N bit-length otherwise. This requires CM-method curve
    construction at toy scale, which is feasible: for small |D_0| the Hilbert
    class polynomial is degree 1 or 2 and its roots mod p give j directly, and
    the curve is recovered from j by the standard formula with the twist chosen
    by point counting. Record the construction cost per rung.

    STEP 4 (NULL-3). For every j=0 and j=1728 instance, run each functional
    twice: once with phi available to the algorithm and once with it withheld.
    "Withheld" must be enforced structurally (the arm does not receive lambda or
    zeta and cannot compute them) and audited, not merely intended.

    STEP 5 (the rho calibration of claim (D)). Measure rho step counts on the
    three families at three sizes with a common walk, common escape rule and
    common cost unit (F_p multiplications, with the curve model named). Report
    the measured ratio to 0.886*sqrt(N) for each family. Predicted 1.00
    (generic), 1/sqrt(2) = 0.707 (j=1728), 1/sqrt(3) = 0.577 (j=0), each within
    a pre-registered band. Report BOTH the step-count ratio and the
    multiplication-count ratio, because the escape-rule overhead at |Aut| = 6 is
    unmeasured in this program (IDEA-20260807-f00729 forward guidance G3) and
    could make the realised constant materially worse than sqrt(3).

    STEP 6 (the deliverable). One frozen instance set, one gate script (Step 2),
    one ladder, and one table of measured null differences per functional. Every
    later L3 record cites this instead of building its own.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Run 2026-08-07 from the repository root.
      (1) read ledger/questions/RQ-JINV-8fc13a.yaml and DECOMPOSITION.md L3/L14
      (2) read docs/inventor-protocol.md section 3 (controls before belief)
      (3) read ledger/hypotheses/H-RHO-bc6ea6.yaml in full, noting its scope
          exclusion of j in {0,1728}
      (4) read knowledge/techniques/KN-TECH-006.md and KN-TECH-018.md in full
      (5) grep -ril "sextic twist\|quartic twist\|twist" knowledge/ -> 159 files,
          371 occurrences, overwhelmingly in literature entries about
          pairing-friendly constructions rather than about instrument controls
    results: >-
      The brief's own null ("matched p and matched N") is stated in
      RQ-JINV-8fc13a and in DECOMPOSITION.md L3 and is, as (A) shows, not
      constructible at fixed cofactor - a point no record in this repository
      makes. KN-TECH-006 states that the 0.886 convention includes negation;
      KN-TECH-018 states sqrt(|Aut|) without naming a baseline; NO RECORD
      RESOLVES THE RESULTING FACTOR-sqrt(2) AMBIGUITY. H-RHO-bc6ea6 excludes
      j in {0,1728}, so the special-j rho constants are unmeasured here. The
      sixth-power isomorphism null appears nowhere in ledger/ or knowledge/ as an
      instrument control.
    verdict: >-
      ADAPTATION. Isomorphism invariance, sextic twists and CM curve
      construction are all textbook; none is claimed as new. What is new to this
      program is (i) the T4 impossibility argument for the brief's own null,
      (ii) the sixth-power null promoted to a blocking gate, (iii) the |D_0|
      decay ladder with its flat-then-jump artifact signature, and (iv) the
      resolution of the sqrt(6) versus sqrt(3) baseline ambiguity.

  null_object_control: >-
    THIS PROPOSAL IS THE NULL OBJECT CONTROL, so the field records the control
    ON THE CONTROL - the instrument must be shown able to FAIL, or its passes
    mean nothing.
    META-NULL-A: deliberately break the matching in a known way (use a different
      p in the two arms) and confirm the pipeline reports a difference. An
      instrument that reports "no difference" between arms at different primes is
      not measuring anything.
    META-NULL-B: deliberately break NULL-4 by using u^2 b instead of u^6 b (a
      DIFFERENT curve, a sextic twist, not an isomorphic presentation) and
      confirm the pipeline reports a difference. This is the sharpest test that
      the instrument distinguishes isomorphism from twisting, which is the exact
      distinction the lane needs.
    DECAY PARAMETER for the meta-nulls: the size of the deliberate break. A
      pipeline whose reported difference does not grow as the break is made
      larger is insensitive and its nulls are vacuous.

  assumptions:
    - >-
      T4 as stated in DECOMPOSITION.md is correct: fixing p and t fixes
      D = t^2 - 4p and hence D_0. This is elementary and is re-derived rather
      than cited in claim (A).
    - >-
      CM curve construction at small |D_0| is feasible at toy scale: for
      h(D_0) = 1 the Hilbert class polynomial is linear, j is known outright,
      and the curve follows from j with the correct twist selected by point
      counting. For h = 2 it is quadratic. No large-|D| CM construction is
      attempted.
    - >-
      p congruent to 1 mod 3 for j=0 and 1 mod 4 for j=1728 so that the extra
      automorphism is rational; all curves ordinary and verified by point
      counting.
    - >-
      Costs are counted in F_p multiplications with the curve model named, per
      the convention H-RHO-bc6ea6 adopts. Step counts alone are not admissible
      as a comparison across families, because the automorphism-quotient walk's
      per-step cost differs.
    - >-
      Toy scale, p up to about 2^28 for the rho arm and 2^24 for the algebraic
      arms. Every recovered logarithm certified independently by
      harness/toycurve.py.

  proof_search_map:
    not_applicable_reason: >-
      Instrumentation, not proof: the deliverables are a frozen instance set, a
      blocking gate script, and a table of measured null differences. The one
      derived statement - claim (A)'s impossibility of an exact same-(p,N,h)
      cross-D_0 null - is a two-line consequence of #E = p+1-t and D = t^2-4p and
      is verified mechanically in Step 1 by exhaustive search at small p
      confirming that no such pair exists. That verification is recorded as a
      pre-registered prediction. No asymptotic bound, certificate family,
      reduction or closure argument is proposed, so the section-8 audits have no
      object to run against.

  predictions:
    - metric: >-
        existence of a same-p, same-N, same-cofactor pair with different D_0,
        by exhaustive search at small p
      direction: different
      minimum_effect: >-
        ZERO such pairs, at every p searched. A single such pair falsifies claim
        (A) and, since (A) is a two-line derivation from T4, would indicate an
        error in the search rather than in the mathematics - so it halts the
        line for audit rather than being reported.
    - metric: >-
        every intrinsic functional evaluated on b versus u^6 b (NULL-4)
      direction: different
      minimum_effect: >-
        EXACT equality for discrete-valued functionals (support size, BKK,
        Groebner basis size and max degree, relation counts) and agreement
        within 2 percent for timing-based ones. Any discrete-valued difference
        VOIDS the instrument, and this is a blocking gate rather than a
        reported metric.
    - metric: >-
        every functional on NULL-3 (j=0 with phi withheld) versus NULL-1
        (generic D_0, matched p and N)
      direction: different
      minimum_effect: >-
        Indistinguishable at the 0.05 level across at least five seeds. A
        significant difference means being a j=0 curve matters without using
        phi, which is the lane's only route to a finding that H-ENDO-001 does
        not already cover, and it must be replicated before interpretation.
    - metric: >-
        measured rho cost divided by 0.886*sqrt(N), by family, in F_p
        multiplications with a common walk and escape rule
      direction: lower
      minimum_effect: >-
        Predicted 1.00 +- 0.15 (generic), 0.707 +- 0.15 (j=1728), 0.577 +- 0.15
        (j=0). A j=0 value below 0.40 (i.e. better than sqrt(6) relative to an
        already-negation-discounted baseline) would exceed the KN-TECH-018
        ceiling and must be explained before any other number in the run set is
        trusted. A value above 0.85 means the |Aut| = 6 escape overhead has eaten
        most of the discount, which is a REPORTABLE FINDING about the constant
        (IDEA-20260807-f00729 guidance G3) and not a failure.
    - metric: >-
        any functional claimed to arise from small |D_0|, as a function of
        |D_0| along the ladder
      direction: lower
      minimum_effect: >-
        Monotone decay with at least a factor 2 between |D_0| = 3 and |D_0| =
        163. A flat profile with a jump only at generic is the artifact tell and
        the quantity is reported as tracking CM-method construction.
    - metric: NULL-1 pair yield rate per unit search at each field size
      direction: different
      minimum_effect: >-
        Reported as a number with its search cost, whatever it is. If the yield
        is below one pair per hour at the largest size, NULL-2 becomes the
        lane's standard null and every downstream record must say so.

  minimal_test:
    design: >-
      CHEAPEST VALID DISCRIMINATOR: STEP 2, THE SIXTH-POWER GATE, AND IT COSTS
      MINUTES. Take one existing j=0 toy instance, generate two isomorphic
      presentations with u1^6 b and u2^6 b, transport P and Q, and run every
      functional the lane intends to use on all three. If any discrete-valued
      functional differs, the lane's entire instrument is reading coefficient
      representatives and every L3 number - past or future - is void until
      fixed. This costs almost nothing, it can be run before any other L3 work
      is dispatched, and it is the single highest-leverage test in the batch
      because it can invalidate seven other proposals at once.
      Step 1's search and Step 5's rho calibration are the next cheapest.
    controls:
      - META-NULL-A: different primes in the two arms, which must show a difference
      - META-NULL-B: u^2 b (a genuine twist), which must show a difference
      - matched Pollard rho with negation on every instance
      - matched BSGS on every instance
      - >-
        planted-signal cross-check against IDEA-20260807-bfa86b, so that the
        instrument is shown to detect a real weakness as well as to reject fakes
      - certificate re-verification of every recovered logarithm
    required_metrics:
      - NULL-1 search cost and yield rate per field size
      - the frozen instance set: (p, a, b, N, cofactor, D_0, h(D_0), |Aut|, twist)
      - every functional on every null arm, with seeds and confidence intervals
      - rho cost in steps AND in F_p multiplications, per family, per size
      - measured ratio to 0.886*sqrt(N) with its pre-registered band
      - pass/fail of NULL-4 as a blocking gate, per instrument
      - pass/fail of META-NULL-A and META-NULL-B
      - the full |D_0| ladder profile for every functional the lane measures

  falsification_conditions:
    - >-
      NULL-4 fails: b and u^6 b give different discrete-valued functionals. The
      instrument is void and no L3 measurement may proceed until it is repaired.
      This is the strongest possible negative outcome for the lane and it is
      also the cheapest to find.
    - >-
      META-NULL-A or META-NULL-B fails: the pipeline reports no difference where
      one certainly exists. The instrument is insensitive and its nulls are
      vacuous.
    - >-
      An exact same-(p, N, cofactor) cross-D_0 pair is found. Claim (A) is
      wrong; audit the search before reporting anything.
    - >-
      NULL-3 differs significantly from NULL-1. Either a curve-generation
      confound or a genuine finding; requires replication before interpretation
      and blocks the lane's other conclusions until resolved.
    - >-
      Measured j=0 rho cost falls below 0.40 x 0.886*sqrt(N). The discount
      exceeds KN-TECH-018's ceiling and everything else in the run set is
      suspect.
    - >-
      NULL-1 pairs cannot be found at any tested size within budget. That is an
      infrastructure/searchability outcome, not negative mathematical evidence
      (AGENTS.md rule 5); the lane falls back to NULL-2 and records that it did.

  confounders:
    - >-
      CURVE-GENERATION PROCEDURE. CM curves are constructed from j; generic
      curves are found by random search. Any measured difference could be a
      difference of PROCEDURE rather than of curve. The ladder in (C) is the only
      defence and it is why the ladder is mandatory rather than nice to have.
    - >-
      COFACTOR. NULL-1 arms necessarily have different cofactors, so any
      functional that depends on the cofactor - notably anything touching the
      full group rather than G - is confounded. Such functionals must use NULL-2
      or NULL-3 instead and the choice must be recorded per functional.
    - >-
      TWIST SELECTION. The six sextic twists of a j=0 curve are different curves
      in different isogeny classes with different traces. Choosing the twist by
      "whichever has a large prime factor" introduces a selection effect on N
      that the generic arm does not experience. Twist selection policy is frozen
      and reported.
    - >-
      SMALL-p ARITHMETIC. At p below 2^12 the number of curves is small enough
      that "generic D_0" is not generic. The generic arm's D_0 distribution is
      reported, not assumed.
    - >-
      ESCAPE-RULE COUPLING IN STEP 5. The rho constant at |Aut| = 6 depends on
      the fruitless-cycle escape rule, which is unmeasured here for r > 1. A
      single escape rule is frozen across families so the comparison is fair, and
      the resulting constant is scoped to that rule and to nothing else.
    - >-
      MULTIPLE COMPARISONS. Sweeping 11 discriminant rungs times several
      functionals invites false positives. The decision rule is the LADDER SHAPE
      (monotone decay), not any single rung's significance, and that rule is
      pre-registered here.

  interpretation_limits:
    - >-
      This proposal produces NO finding about the ECDLP. Its outputs are an
      instrument, an instance set, and one calibrated constant.
    - >-
      The calibrated constant in (D) is a CONSTANT: at most sqrt(3) extra for
      j=0 against this program's own baseline, and it may well measure smaller
      once escape overhead is charged. Nothing here touches an exponent.
    - >-
      Toy scale. The rho constants are measured at sizes where the birthday
      constant is itself noisy; three sizes are the minimum for any statement
      about size-independence and even then it is scoped to the tested range.
    - >-
      NULL-3's "phi withheld" is an algorithmic restriction, not a mathematical
      one. It tests what an algorithm that does not use phi does; it says nothing
      about what one could do.
    - >-
      A passing null is not evidence FOR any hypothesis. It is a licence to
      report other measurements, and nothing more.

  reachability_gate: >-
    APPLICABLE IN A LIMITED SENSE AND IT SHAPES THE NULL. T4 says j=0 requires
    D_0 = -3 and that no curve outside such a class can be walked to one, so the
    null arms cannot be constructed by isogeny walking from the special arm -
    they must be constructed independently at the same p. That is why claim (A)'s
    impossibility matters operationally: the two arms are not related by any map
    at all, so every controlled variable has to be matched by search rather than
    by transport, and the search cost is a reported deliverable. T5's reachability
    question does not arise because no walk is performed.

  target_complexity:
    time_exponent: >-
      NO ATTACK IS PROPOSED. The only exponent-adjacent output is the calibrated
      rho constant, which multiplies sqrt(N) and does not change the 1/2
      exponent. Predicted constants: 0.886 (generic), 0.886/sqrt(2) (j=1728),
      0.886/sqrt(3) (j=0), each before escape overhead.
    memory_exponent: >-
      O(1) for the rho arms, matching the baseline. The algebraic arms' memory is
      the factor-base size and is reported per cell for feasibility only.
    best_known: >-
      Parallel rho with distinguished points at 0.886*sqrt(N) and O(1) memory
      (KN-TECH-001, KN-TECH-006) - which is exactly what this proposal
