idea:
  id: IDEA-20260816-c4e5e3
  question_id: RQ-SHATWO-f196c7
  added: '2026-08-16'
  title: The free-message-bit dimension of the SHA-256 expanded message schedule computed exactly
    as a GF(2) rank over conditioned bit positions per step count s, turning the degrees-of-freedom
    half of the frontier ledger into a fixed integer sequence obtained before any characteristic search
    is attempted
  class: theory
  claim: '(A) For a fixed carry pattern, the SHA-256 message expansion is exactly GF(2)-affine in
    the 512 message bits: each expanded word W_t for t in 16..63 is sigma1(W_{t-2}) + W_{t-7} + sigma0(W_{t-15})
    + W_{t-16} mod 2^32 as specified in FIPS 180-4, and once every carry bit of every modular addition
    is fixed to a chosen value the map from the 512-bit block to the 32s-bit expanded prefix is an
    affine map A_s over GF(2). This is not an approximation within a carry class; it is exact there.
    (B) Therefore, for any support set S of (step, bit) positions with step < s, three integers are
    computable by rank elimination alone and with no solver: rank_S = rank of the rows of A_s indexed
    by S; the surviving message freedom F(S) = 512 - rank_S; and the redundancy R(S) = |S| - rank_S,
    the number of imposed bit conditions that come free because they are linearly dependent on the
    others. The claim of this proposal is that F and R, as functions of s and of a declared family
    of condition supports, are well-defined integer sequences reproducible bitwise across two independent
    implementations, and that their crossing point - the least s at which F(S(s)) reaches zero for
    the declared support family - is a single integer computable in seconds. (C) NOT CLAIMED: that
    this integer equals, bounds, or predicts the reachable step count of any attack, published or
    otherwise; that a positive redundancy is exploitable; that the carry-fixed model captures the
    true schedule outside its carry class; that anything follows about full 64-step SHA-256, HMAC-SHA-256,
    or any deployed system. The deliverable is an integer sequence and its null comparison, not a
    frontier. Whether the sequence has any predictive relation to a measured frontier is the separate
    subject of the transfer test in this bucket, and that test may return that it has none.'
  mechanism: 'STAGE A. Implement SHA-256 message expansion twice independently in Python, validate
    both against FIPS 180-4 NIST test vectors through hashlib on the full compression function, and
    freeze both. STAGE B. Build the carry-fixed linearization: represent each of the 512 message bits
    as a basis vector, propagate sigma0, sigma1, rotations and shifts as bit permutations, and propagate
    each modular addition as XOR plus an explicit carry-bit term that is set to the chosen constant.
    All-zero carries recovers the ordinary XOR-linearized schedule; other carry patterns are sampled.
    Emit A_s as a bit-packed 32s x 512 GF(2) matrix. STAGE C. Declare condition-support families in
    advance: (f1) all bits of the last k expanded words; (f2) the support of a weight-w signed difference
    placed at a declared step; (f3) uniformly random supports of matched size. Compute rank_S by Gaussian
    elimination over GF(2) with numpy uint64 word packing. STAGE D. Emit F(S) and R(S) for every s
    in 1..64 and every declared family, plus the crossing index. STAGE E. Run the identical pipeline
    against null objects: the expansion recurrence with sigma0 and sigma1 replaced by uniformly random
    GF(2) linear maps of the same fan-in, and with random tap offsets of the same arity. STAGE F.
    Refutation route: if SHA-256 and the random-tap nulls produce statistically indistinguishable
    F and R profiles, then F and R are properties of the matrix shape rather than of the SHA-256 design,
    and the object is recorded as a controlled null with the measured indistinguishability, which
    closes this lane at the section 4 standard rather than by fatigue.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read /home/user/crypto-autoresearcher/ledger/questions/RQ-SHATWO-f196c7.yaml in full
      and /home/user/crypto-autoresearcher/ledger/goals/GOAL-SHA2-001.yaml. Read docs/inventor-protocol.md
      sections 1-5 and 8. Ran: grep -rl ''RQ-SHATWO'' over ledger/ experiments/ knowledge/ coordination/;
      grep -ril ''message schedule|message-schedule'' over ledger/proposals/ ledger/hypotheses/ knowledge/;
      grep -ril ''degrees of freedom'' over ledger/proposals/ knowledge/; grep -ril ''step-reduced|semi-free-start|neutral
      bit'' over ledger/proposals/ ledger/hypotheses/ knowledge/; grep -ril ''rotation constant'',
      ''SAT encoding|CNF'', ''signed-difference|generalized condition'', ''toy word size|scaled-down
      word'', ''Davies-Meyer'', ''ARX'', ''word size'' over ledger/proposals/ ledger/hypotheses/ knowledge/techniques/
      knowledge/findings/.'
    results: 'grep -rl ''RQ-SHATWO'' returned exactly three files: the question itself, ledger/goals/GOAL-SHA2-001.yaml,
      and ledger/questions/RQ-SHATHREE-cd2cb2.yaml. No proposal and no hypothesis in this repository
      references this question, so the lane holds zero prior ideation. ''message schedule'' matched
      two proposals, IDEA-20260813-878855 and IDEA-20260813-93a735, whose titles I read: both are
      signature-transcript and simulator-audit records in an unrelated lane. ''rotation constant'',
      ''SAT encoding|CNF'', ''signed-difference|generalized condition'' and ''toy word size|scaled-down
      word'' each returned ZERO hits across ledger/proposals/, ledger/hypotheses/, knowledge/techniques/
      and knowledge/findings/. ''degrees of freedom'' matched twelve proposals and KN-TECH-066 and
      KN-TECH-080; I read KN-TECH-080''s binding audits and the twelve are grep-level hits only, all
      ECDLP-lane filenames, and I did not read their bodies. ''step-reduced'' matched only knowledge/literature/
      entries and knowledge/sources.json, never a proposal.'
    verdict: 'UNVERIFIED. This program cannot read external literature and no record here may assert
      what that literature contains. What is claimed new: nothing about the mathematics. The carry-fixed
      affine linearization of an ARX schedule and GF(2) rank counting are standard, well-worn linear
      algebra, and treating the linearized message schedule as a code is an old idea in the general
      area. What is assembled from known parts is the specific deliverable: a frozen, declared-in-advance
      family of condition supports; the pair (F, R) emitted as a reproducible integer sequence with
      a bitwise cross-implementation check; and a matched random-tap null run in the same invocation
      so that the sequence is reportable as a property of SHA-256 rather than of the matrix shape.
      What is new WITHIN THIS REPOSITORY is verifiable and narrow: no proposal or hypothesis here
      references RQ-SHATWO at all, and the strings ''rotation constant'' and ''signed-difference''
      do not appear in any proposal. That is a statement about this corpus and nothing else.'
  object_first_candidate:
    tracked_object: 'The pair of integers (F(S), R(S)) = (512 - rank_S, |S| - rank_S) attached to
      a declared support set S of (step, bit) positions in the carry-fixed expanded schedule: the
      surviving GF(2) dimension of the message block after S linear bit conditions are imposed, and
      the number of those conditions that are linearly redundant. The object followed through the
      computation is the row space of the carry-fixed expansion matrix restricted to S, and what is
      carried from step to step is its rank.'
    lossiness: 'Genuinely lossy, and the loss is stated. Discarded: the actual 32-bit word values,
      the identity of the carry pattern beyond its being fixed, the nonlinear compression function
      entirely, and the distinction between any two supports of the same rank. Retained: a single
      non-negative integer per support. Enormously many distinct message sets and distinct condition
      placements share one value of (F, R), so this is a projection and not a change of coordinates.
      Why the rest still propagates: within a carry class the expansion is exactly affine, so rank
      is exactly compositional - appending step s+1 appends 32 affine rows and rank can only increase,
      never decrease - and no information beyond the row space is needed to compute the next value.
      The loss is compatible with the operation because rank of a row subset is invariant to everything
      the discarded data could have said.'
    propagation: One step of the target operation is one step of message expansion. Advancing s to
      s+1 appends the 32 affine rows of W_s to A_s. Restricted to a support S, rank_S is non-decreasing
      in s and increases by exactly the number of newly conditioned rows independent of the span already
      accumulated. Consequently F(S) is non-increasing and R(S) is non-decreasing, both by the same
      increment, and the two sequences are determined by one rank-increment sequence. The whole object
      is therefore a monotone integer staircase whose step heights are the per-step rank increments,
      computable by incremental elimination in one pass rather than by refactoring at each s.
    survival_score: 'Exact and total within a carry class for all s from 1 to 64: rank is never approximate
      there. The structure dissolves at exactly two named places. First, at the union over carry classes:
      the true schedule is the union of 2^(number of carry bits) affine pieces and rank is not defined
      on the union, so any statement about the real schedule is a statement about a class or about
      a distribution over classes, and this proposal makes the latter only as a sampled empirical
      distribution. Second, at the compression function: the round function''s Ch, Maj and modular
      additions are outside this object entirely, so the object says nothing about them and survives
      zero steps into them.'
  null_object_control: 'Two nulls, both executed in the same invocation as the signal arm and through
    the identical code path with only the tap definition swapped. NULL-1 random-tap: replace sigma0
    and sigma1 by uniformly sampled GF(2) linear maps on 32 bits with the same number of nonzero terms,
    and resample the four tap offsets uniformly from 1..16 preserving arity; 1000 draws. NULL-2 random-support:
    keep SHA-256 taps but sample S uniformly at random with matched cardinality; 1000 draws. For the
    signal arm to mean anything, NULL-1 must produce a rank-increment profile that differs from SHA-256''s
    at the declared threshold - if the two are indistinguishable, F and R are properties of a 32s
    x 512 matrix of that shape and the SHA-256 arm is recorded as a controlled null. NULL-2 must show
    generic behaviour, rank_S = min(|S|, 512) with redundancy zero, at a rate near 1; if random supports
    show the same redundancy as structured ones, the redundancy signal is an artifact of the elimination
    convention.'
  discriminated_from:
  - RQ-SHATWO-f196c7's own target-2 prose, which names the degrees-of-freedom-minus-conditions deficit
    as a computable integer but does not define which matrix, which support family, or which carry
    model computes it. This proposal supplies exactly that definition and refuses the predictive half.
  - 'KN-TECH-080 audit 1 (baseline reproduction) as instantiated elsewhere in this program: that audit
    reproduces a baseline result, whereas this computes a quantity that exists whether or not any
    baseline is reproducible, and is therefore executable while the reproduction lane in this bucket
    is still blocked on primary text.'
  - 'The twelve ledger/proposals hits for ''degrees of freedom'' (including IDEA-20260808-e7ba81,
    IDEA-20260806-7c1ae4, IDEA-20260815-862100): grep-level matches in ECDLP-lane files whose bodies
    I did not read; none references RQ-SHATWO and none concerns a hash message schedule, since ''message
    schedule'' matched only two proposals and both are signature-lane.'
  - 'Generic linear cryptanalysis of an ARX primitive: this computes no bias, no correlation and no
    approximation quality, only a rank. No probabilistic quantity appears anywhere in the object.'
  - The low-weight-codeword object proposed separately in this bucket, which is the KERNEL of the
    same matrix rather than the row space of a support restriction. Rank and minimum weight are independent
    - the same rank profile admits wildly different weight profiles - so these are two different objects
    on one matrix, and the entry that measures weight says so.
  assumptions:
  - FIPS 180-4 is the correct specification of SHA-256 and the two independent implementations agree
    with hashlib on the full NIST test vectors; an attack against a wrong SHA-256 is the failure mode
    this check exists to remove.
  - Within a fixed carry pattern, modular addition on 32-bit words is GF(2)-affine in the addend bits.
    This is exact, not an approximation, and is checkable by exhaustive comparison on small word widths.
  - The declared condition-support families are fixed before the run and not tuned after seeing rank
    output; the preregistration file is hashed before STAGE C executes.
  - GF(2) Gaussian elimination on a 2048 x 512 bit-packed matrix is exact integer arithmetic with
    no numerical tolerance, so replication is bitwise rather than statistical.
  - Sampling carry patterns uniformly is a stated modelling choice, not a claim that real attack messages
    have uniform carries; results are reported per carry class and as a sampled distribution, never
    as a property of the schedule as a whole.
  predictions:
  - metric: rank of A_16 (the first sixteen expanded words) over GF(2)
    direction: different
    minimum_effect: forced value 512 exactly, since W_0..W_15 are the message block itself and the
      map is the identity; any other value means the implementation is wrong and voids the run
  - metric: per-step rank increment of A_s restricted to full-word supports, SHA-256 arm versus NULL-1
      random-tap arm
    direction: different
    minimum_effect: at least three values of s in 17..48 whose SHA-256 increment lies outside the
      2.5th-97.5th percentile band of the 1000 NULL-1 draws
  - metric: redundancy R(S) for uniformly random supports of size 400 (NULL-2)
    direction: lower
    minimum_effect: 0 in at least 99 percent of 1000 draws; a nonzero redundancy on random supports
      indicts the elimination code before any SHA-256 number is read
  - metric: least s at which F(S) reaches 0 for declared family f1
    direction: different
    minimum_effect: explicit refusal to pre-commit a numeric value, because pre-committing an integer
      this proposal has not yet computed would be a fabricated measurement under AGENTS.md rule 5;
      what is pre-committed is that the value is a single integer identical across the two independent
      implementations
  minimal_test:
    design: 'Cheapest discriminating measurement: build the carry-all-zero linearization only, at
      s = 64, and compute exactly two numbers - the per-step rank-increment vector for SHA-256 and
      the same vector for 200 random-tap nulls - then check whether SHA-256''s vector falls inside
      the null band. This is a few thousand GF(2) eliminations on a 2048 x 512 bit-packed matrix,
      seconds of CPU, no solver, no search, and no compression function. It discriminates because
      the entire predictive story of this bucket rests on F and R being properties of SHA-256''s specific
      taps; if the increment vector is inside the null band, that story is dead before any expensive
      search is designed, and the measured indistinguishability is itself the reusable obstruction.
      Only if SHA-256 falls outside the band do the sampled carry classes, the structured support
      families and the SHA-512 arm become worth their cost. Everything above runs in one invocation
      from one script with a fixed seed, with the null arm and the signal arm sharing the identical
      elimination routine.'
    controls:
    - NULL-1 random-tap expansion, 1000 draws, identical code path, same invocation.
    - NULL-2 random-support of matched cardinality against SHA-256 taps, 1000 draws.
    - 'Positive control: a hand-built matrix with a planted rank deficiency of a known size, which
      the elimination must report exactly.'
    - 'Cross-implementation control: two independently written expansion linearizers whose A_s matrices
      must agree bit for bit.'
    - 'Full-hash correctness control: both implementations reproduce the NIST FIPS 180-4 test vectors
      through hashlib comparison before any rank is computed.'
    required_metrics:
    - rank_S per (s, support family, carry pattern)
    - surviving freedom F(S) = 512 - rank_S
    - redundancy R(S) = |S| - rank_S
    - per-step rank increment vector over s = 1..64
    - least s with F(S) = 0, per family
    - null-band percentiles of every above metric under NULL-1 and NULL-2
    - bitwise agreement flag between the two independent implementations
    - wall-clock seconds and peak memory of the elimination
  falsification_conditions:
  - SHA-256's per-step rank-increment vector lies inside the NULL-1 percentile band at every s, so
    the profile is a property of the matrix shape and not of the design.
  - rank(A_16) is not 512, which means the linearizer is wrong and every downstream number is void.
  - Random supports (NULL-2) show nonzero redundancy at an appreciable rate, indicting the elimination
    convention.
  - The two independent implementations disagree on any single bit of any A_s.
  - Sampled carry classes give F and R values whose spread exceeds the SHA-256-versus-null separation,
    so the carry-fixed model cannot support any statement about the real schedule.
  - The planted-rank-deficiency positive control is not recovered exactly.
  confounders:
  - 'Carry-pattern choice: the all-zero-carry linearization is the most convenient class and may be
    atypical; a separation seen only there is a statement about one class.'
  - 'Support-family choice: a family tuned after seeing output would manufacture redundancy, which
    is why the preregistration file is hashed before STAGE C.'
  - Random-tap nulls that accidentally reproduce sparse structure similar to sigma0 and sigma1 will
    shrink the apparent separation; the null draw distribution must be reported, not just its band.
  - Bit-ordering and endianness conventions differing between the two implementations would produce
    a spurious disagreement that looks like a real falsification.
  - Elimination pivoting order can change reported intermediate ranks if the code is buggy; final
    rank is order-invariant and the run must assert that across two pivot orders.
  interpretation_limits:
  - A rank is not an attack, a complexity, or a step count. Nothing here licenses any statement about
    how far any search can reach.
  - All statements are conditional on a carry class or on a sampled distribution over carry classes,
    and the true schedule is neither.
  - The compression function is absent from this object entirely, so nothing here constrains it.
  - Nothing here may be read as a statement about full 64-step SHA-256, HMAC-SHA-256, certificate
    chains, or any deployed system.
  target_complexity:
    time_exponent: 'No attack exponent is claimed. The measurement itself is polynomial and tiny:
      O(s * 32 * 512^2 / 64) bit operations per elimination with word packing, seconds per configuration
      on one core.'
    memory_exponent: No attack memory exponent is claimed. The measurement holds a 2048 x 512 bit-packed
      matrix, about 128 KiB, plus the null-draw summaries.
    best_known: 'There is no incumbent attack to beat because no attack is proposed. The incumbent
      PRACTICE this displaces is the one RQ-SHATWO-f196c7 names in its own scope block: a security
      margin quoted as a step count with no accompanying computable quantity behind it. The incumbent
      within this repository is nothing at all, since no proposal or hypothesis references RQ-SHATWO.'
    hidden_overhead: 'The linearizer is the whole cost and it is human, not machine: carry-term bookkeeping
      through sigma0, sigma1, rotations and shifts is where a silent sign or offset error hides, and
      it will not announce itself because a wrong matrix still has a rank. The two-implementation
      requirement and the rank(A_16) = 512 forced value exist to charge that cost visibly. Second
      hidden cost: declaring condition-support families honestly in advance is harder than it sounds,
      because the natural families are exactly the ones a later search would want to tune.'
  dominated_by: 'n/a (no result claimed). On the measurement''s own axes I checked every frontier
    row available inside this repository: grep -rl ''RQ-SHATWO'' over ledger/, experiments/, knowledge/
    and coordination/ returns only the question, GOAL-SHA2-001 and RQ-SHATHREE-cd2cb2, and no evidence
    record or experiment directory computes any rank of a hash message schedule, so there is no prior
    row here to dominate this one. Against external work this repository cannot adjudicate in either
    direction and does not.'
  sota_delta: 'no attack; conceptual/measurement contribution only. Quantitatively the delta is from
    an absent number to a present one: the program currently holds zero computed values of F or R
    for SHA-256 at any s, and a run would hold 64 values per declared family per carry class, each
    reproducible bitwise, together with a 1000-draw null band for each.'
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Split into three separable parts. (1) That F and R are computable, exactly
    reproducible integers within a carry class: ~0.97. This is linear algebra over a specification,
    and the only failure mode is implementation error, which the cross-implementation and rank(A_16)=512
    checks catch. (2) That SHA-256''s rank-increment profile is distinguishable from random-tap nulls
    at the declared threshold: ~0.45. The taps are sparse and structured, which argues for separation,
    but rank profiles of tall random sparse GF(2) matrices saturate quickly and generically, which
    argues that everything looks alike by s = 20; I genuinely do not know which wins and that is why
    this is the cheap first measurement. (3) That the crossing integer has any predictive relation
    to a measured reachable step count: ~0.15, and deliberately low, because the observation-collision
    audit proposed separately in this bucket exhibits an invertible message-basis change that leaves
    every rank invariant while changing the primitive, which is a standing reason to expect the observable
    not to identify the frontier. Part (3) is not tested here.'
