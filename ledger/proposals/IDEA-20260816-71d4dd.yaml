idea:
  id: IDEA-20260816-71d4dd
  question_id: RQ-SHAONE-081e3a
  added: '2026-08-16'
  title: 'Charge the birthday phase what it actually spends: measure the distinguished-point parallel
    collision search''s achieved-versus-ideal efficiency as a function of table memory, node count
    and interconnect latency on a truncated-hash analogue where every collision can be exhaustively
    enumerated and verified.'
  class: measurement
  claim: '(A) The birthday phase of a chosen-prefix attack is a parallel collision search over a restricted
    target-difference set, and its cost is quoted in device-hours. Device-hours express time alone.
    The same search run with a small distinguished-point table, or across nodes with a slow interconnect,
    or with a restart policy that discards partial trails, costs strictly more device-hours for the
    same output, and the excess is invisible in a device-hour figure. (B) Define the achieved efficiency
    eta = (ideal expected work for a collision inside the target set) / (measured work actually performed),
    where ideal work is computed exactly by enumeration on a truncated analogue. eta is a measurable
    dimensionless number between 0 and 1, and it is a function of the distinguished-point probability,
    the table capacity in entries, the number of parallel workers, and the simulated inter-node message
    latency. (C) The claim is that eta is materially below 1 across realistic table capacities, that
    its dependence on table capacity is the steepest of the four variables, and that this dependence
    is measurable to within a stated confidence at truncation widths where every collision in the
    target set can be exhaustively enumerated and the ideal denominator is therefore known exactly
    rather than modelled. (D) WHAT IS NOT CLAIMED: no attack, no cost figure for SHA-1, no dollar
    amount, no assertion that any published birthday-phase cost is understated or overstated, and
    no extrapolation of eta from truncated widths to full width. eta measured at width w is a statement
    about width w. (E) The value of a measured eta is that it converts a hidden assumption -- that
    parallel collision search runs at ideal efficiency -- into a number with error bars that any later
    cost model must either use or explicitly override.'
  mechanism: 'STAGE 1: build a truncated analogue. Take a real compression function and truncate its
    output to w bits, w small enough that the full function graph is enumerable. Define a target-difference
    set T of declared size inside the w-bit space. STAGE 2: compute the ideal denominator EXACTLY.
    By exhaustive enumeration over the truncated domain, compute the true expected number of function
    evaluations needed to land a collision inside T under an idealised memoryless birthday process.
    This is the step that is impossible at full width and is the entire reason the analogue exists.
    STAGE 3: run the actual distinguished-point search with a real bounded table, real trail storage,
    real trail-length limits, real restart on table eviction, and a simulated per-message interconnect
    delay. Count every function evaluation actually performed, including those in discarded trails.
    STAGE 4: form eta = ideal / measured for each parameter cell and map its surface over table capacity,
    distinguished-point probability, worker count, and latency. STAGE 5: null control -- replace the
    structured target set T with a uniformly random set of identical cardinality and rerun the identical
    search in the same invocation; eta for a random target set isolates the part of the inefficiency
    that is an artefact of the search machinery rather than of the target set''s structure. STAGE
    6: verify every reported collision against the truncated function directly, so the measurement
    carries certificates for the objects it actually computed.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read RQ-SHAONE-081e3a and GOAL-SHA1-001 in full. Ran: grep -ril ''distinguished point''
      ledger/proposals (128 hits, sampled 6); grep -ril ''van Oorschot'' ledger/proposals (110 hits);
      grep -ril ''golden collision'' ledger/proposals (4 hits, all read by title); grep -ril ''memory-charged|area-time|AT
      cost'' ledger/proposals; grep -l ''RQ-SHAONE'' ledger/proposals/*.yaml. Read the title and question_id
      blocks of IDEA-20260815-e94ea3, IDEA-20260805-b4bc59, IDEA-20260806-9c2f80, IDEA-20260805-f9e801,
      IDEA-20260807-59f5b7, and knowledge/techniques/KN-TECH-066.md.'
    results: 'Distinguished-point and van Oorschot-Wiener vocabulary is heavily represented (128 and
      110 proposals) but every sampled record sits under elliptic-curve or isogeny questions: IDEA-20260815-e94ea3
      is the p^(1/3) isogeny meet-in-the-middle memory record under RQ-SSIQ-9702af; IDEA-20260807-59f5b7
      is a negation-quotient renewal-reward charging record under RQ-EWALK-8fa147. None targets a
      hash-function birthday phase, none defines an achieved-efficiency ratio against an exhaustively
      enumerated ideal denominator, and RQ-SHAONE-081e3a carries zero proposals. The four golden-collision
      records concern isogeny and generic-group settings. No record in ledger/proposals measures interconnect
      latency as an independent variable.'
    verdict: 'UNVERIFIED. No claim is made about whether achieved-versus-ideal parallel-collision-search
      efficiency has been measured in published work; parallel collision search is a heavily studied
      primitive and it may well have been. What is new internally: this repository has 128 distinguished-point
      proposals and not one measures eta against an exactly enumerated ideal in a hash setting, and
      not one varies simulated interconnect latency. Assembled from known parts: the distinguished-point
      search itself, the memory-charging discipline already applied under RQ-RSA-afe33c, and the truncated-analogue
      validation ladder in docs/inventor-protocol.md section 6 step 2.'
  object_first_candidate:
    tracked_object: 'The distinguished-point trail: the sequence of iterates from a starting point
      to the first point satisfying the distinguished predicate, carried as the triple (start, endpoint,
      length). What is followed is the trail''s fate -- stored, evicted, truncated at the length limit,
      or matched -- across the whole search, and the accounting object is the total evaluations spent
      on trails that never contributed to a collision.'
    lossiness: Genuinely lossy. The trail projection discards every intermediate iterate, retaining
      only start, endpoint and length. This is compatible with the search operation because trail
      matching depends only on endpoints, and a matched pair can be re-expanded from its starts, so
      the retained part propagates and the discarded part is recoverable on demand at known cost.
      That recoverable-on-demand property is precisely the memory-time tradeoff being charged, so
      the lossiness here is not incidental -- it IS the object under study. The part that is genuinely
      lost and never recovered is the work spent on evicted trails, and counting it is the measurement.
    propagation: One step of the target operation is one iteration of the search function on one worker.
      It acts on the tracked object by extending a trail by one, and with probability equal to the
      distinguished-point probability it terminates the trail and hands it to the table, where it
      is stored, matched, or evicted. Eviction returns the trail's entire accumulated length to the
      wasted-work counter. The propagation is therefore a simple Markov chain whose absorbing states
      are match, eviction, and length-limit truncation, and whose expected wasted work is exactly
      what eta measures.
    survival_score: The trail object survives as long as trail endpoints remain collision-resistant
      enough to be usable as table keys, and it dissolves when the truncation width w is small enough
      that endpoint collisions are dominated by the truncation rather than by the search -- concretely,
      when the expected number of trails approaches 2^(w/2), the table becomes saturated with spurious
      matches and eta stops meaning what it is defined to mean. That crossover width is itself one
      of the reported quantities and marks the lower boundary of the usable analogue range.
  null_object_control: 'Two nulls, both executed in the same invocation as the signal arm. (1) Random
    target set: replace the structured target-difference set T by a uniformly random subset of identical
    cardinality and rerun the identical search with identical parameters. (2) Random iteration function:
    replace the truncated compression function by a random function on the same domain realised as
    a keyed permutation composition. The nulls must show that eta''s dependence on TABLE CAPACITY
    is essentially unchanged -- because that dependence should be a property of the search machinery,
    not the target -- while eta''s absolute level may differ. If eta''s table-capacity dependence
    differs sharply between signal and null, the measurement is confounded by the target set and no
    statement about search efficiency can be made from it.'
  discriminated_from:
  - 'IDEA-20260815-e94ea3 (van Oorschot-Wiener collision search replacing a keyed table in the p^(1/3)
    isogeny algorithm): that record asks whether the substitution moves a memory exponent in an isogeny
    algorithm; this one measures achieved efficiency against an exactly enumerated ideal in a truncated
    hash, and claims no exponent.'
  - 'IDEA-20260807-59f5b7 (renewal-reward charging of a conditional-on-success speedup for the negation
    quotient): shares the discipline of charging censored work, but its object is an elliptic-curve
    walk and its measurement is a re-analysis of existing 16- and 18-bit artifacts, not a new parametric
    search over table capacity and latency.'
  - 'RQ-INSTR-f8faa0 machine-variance and single-machine-timing audits: those measure this program''s
    own instrument noise. This measures a dimensionless ratio whose denominator is exactly enumerated,
    which is specifically designed to be robust to machine speed -- eta is a work RATIO in function
    evaluations, not a timing.'
  - 'A plain re-implementation of parallel collision search: that produces a working search; this
    produces eta as a function of four declared variables with an exactly known denominator and two
    nulls, and its deliverable is the surface, not the search.'
  - 'RQ-RSA-afe33c''s memory-charged factoring baseline: same charging philosophy, different object
    (relation collection and linear algebra versus trail storage), no shared parameter, and this proposal
    binds to whichever charging convention that goal fixes rather than inventing a second one.'
  assumptions:
  - A truncated compression function at width w is a valid analogue for the trail dynamics of the
    full-width search, in that the distinguished-point mechanics do not change with width. This is
    an extrapolation assumption and no numeric eta is transferred across widths.
  - Simulated interconnect latency, injected as a delay on table operations, is an adequate stand-in
    for a real network; a real cluster would be better and is out of budget, which is stated rather
    than hidden.
  - The exhaustive enumeration of the ideal denominator is correct; it is independently cross-checked
    against the analytic birthday expectation for the unstructured case.
  - Function evaluations are a fair unit of work across arms, since all arms use the identical iteration
    function.
  - Table eviction policy is a declared input, not a tuned parameter.
  predictions:
  - metric: eta at the smallest tested table capacity relative to eta at the largest
    direction: lower
    minimum_effect: 2
  - metric: eta at the largest tested table capacity
    direction: lower
    minimum_effect: 0.9
  - metric: difference between signal-arm and null-arm eta table-capacity slopes
    direction: different
    minimum_effect: 'explicit refusal to pre-commit a numeric threshold: the slope difference is the
      confound detector, and pre-committing a value would let a chosen threshold decide whether the
      experiment is confounded. Reported with bootstrap confidence intervals and adjudicated by whether
      the intervals overlap.'
  - metric: eta sensitivity to simulated interconnect latency at fixed table capacity
    direction: lower
    minimum_effect: 1.15x degradation from zero-latency to the highest tested latency
  minimal_test:
    design: 'The cheapest discriminating run fixes worker count and latency at one value each and
      sweeps table capacity alone at a single truncation width, in three arms (structured target,
      random target, random function) inside one process with one shared RNG stream. The ideal denominator
      at that width is enumerated once and reused. This costs a few CPU-hours, produces eta as a function
      of one variable with two nulls, and answers the only question that gates the rest: does eta
      depend on table capacity at all, and is that dependence the same in the nulls. If eta is flat
      in table capacity across all arms, the whole memory-charging premise for this phase is measurably
      wrong at this width and the line closes with a number rather than a verdict. If eta drops steeply
      and identically in all arms, the effect is machinery, which is the useful and expected outcome
      and licenses the full four-variable surface.'
    controls:
    - Random target-difference set of identical cardinality, same invocation.
    - Random iteration function on the same domain, same invocation.
    - Zero-latency arm to isolate the interconnect term from the table term.
    - Unbounded-table arm as the efficiency ceiling reference, which should give eta close to 1 and
      validates the denominator.
    - Repeat every cell with at least 20 independent seeds so eta carries an error bar rather than
      a point.
    required_metrics:
    - eta per parameter cell with bootstrap confidence interval
    - total function evaluations performed, and the subtotal spent on evicted or truncated trails
    - exactly enumerated ideal expected evaluations at each width
    - number of trails stored, evicted, matched, and truncated at the length limit
    - peak table occupancy in entries and in bytes
    - simulated latency-induced idle time as a fraction of wall clock
  falsification_conditions:
  - eta is flat in table capacity across the tested range in all three arms, refuting the premise
    that table memory is a materially uncharged cost at this width.
  - The unbounded-table arm does not give eta close to 1, which would show the enumerated denominator
    or the evaluation counter is wrong and invalidates every other cell.
  - Signal and null arms show significantly different table-capacity slopes, indicating the target
    set's structure confounds the machinery measurement.
  - Endpoint-collision saturation is reached at every tested width, so the trail object dissolves
    and eta is not measuring what it is defined to measure.
  - eta varies by more than its confidence interval across seeds at fixed parameters, showing the
    measurement is not stable enough to support any surface.
  confounders:
  - 'Truncation width interacts with table capacity: too small a width saturates the table with spurious
    endpoint matches and mimics an efficiency loss.'
  - Simulated latency is a software delay and can be absorbed by the operating system scheduler rather
    than by the search, inflating apparent robustness.
  - The eviction policy strongly determines wasted work and can be chosen to produce any desired eta,
    which is why it is declared and frozen.
  - Python-level overhead can dominate function evaluations and distort the wasted-work fraction if
    the counter is placed at the wrong level; the counter must sit inside the compiled kernel.
  interpretation_limits:
  - eta measured at truncation width w is a statement about width w and about this search implementation;
    it is not a correction factor for any published cost and may not be applied as one.
  - Simulated latency is not measured network behaviour, so the interconnect axis is a sensitivity
    study, not a hardware measurement.
  - A low eta is a statement about the cost of this search's memory discipline, not about the difficulty
    of any hash function.
  target_complexity:
    time_exponent: No attack exponent is claimed. eta is a dimensionless efficiency ratio, and the
      experiment reports the exponent of nothing.
    memory_exponent: No attack memory exponent is claimed. Table capacity is an independent variable
      of the measurement, reported in entries and in bytes, not as an exponent.
    best_known: The incumbent is the practice of quoting a birthday-phase cost in device-hours with
      parallel-search efficiency implicitly set to 1, which is exactly the practice RQ-SHAONE-081e3a
      was opened to examine. This proposal does not beat it on any cost axis; it supplies a number
      that quoting practice currently omits.
    hidden_overhead: The exhaustive enumeration of the ideal denominator is the real compute cost
      and grows with truncation width, capping the usable range far below where anyone would want
      it. In human cost, defending the eviction policy and the latency simulation as fair is most
      of the reviewing burden. Seeding 20 repeats per cell across four variables multiplies quickly
      and the parameter grid must be pruned deliberately rather than discovered to be too large mid-run.
  dominated_by: n/a (no result claimed). Checked across time, memory and data axes against the only
    frontier row this repository records for the object -- the device-hour figure carried at UNVERIFIED
    provenance in RQ-SHAONE-081e3a -- and this proposal places no point on it, because it produces
    a dimensionless efficiency ratio at truncated width rather than any cost for any real target.
    Not null; inapplicable, and stated so.
  sota_delta: no attack; conceptual/measurement contribution only. Quantitatively the deliverable
    is eta with confidence intervals over a declared four-variable grid at truncated widths, plus
    the exactly enumerated denominators that make it meaningful. There is no time, memory or data
    comparison to state because no competing algorithm is proposed.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'Separable parts. (1) That the ideal denominator can be exactly enumerated
    at some width where the search is still non-trivial: about 0.75; the window between enumerable
    and non-degenerate is narrow and may close. (2) That eta at realistic table capacities is measurably
    below 1 by at least 2x relative to the unbounded arm: about 0.7, since bounded-table search demonstrably
    wastes trails and the only doubt is magnitude. (3) That the interconnect axis shows a measurable
    effect at all under simulated latency: about 0.4, because a software delay is easy for the runtime
    to hide. (4) That signal and null slopes agree, making the measurement usable rather than confounded:
    about 0.65. Composite for all four is roughly 0.14; parts (1) and (2) alone, which are the reportable
    core, sit near 0.5.'
