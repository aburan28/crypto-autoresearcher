idea:
  id: IDEA-20260816-cddd6b
  question_id: RQ-RSA-d46f02
  added: '2026-08-16'
  title: 'Leaked bits that are sometimes wrong: hold the position set contiguous and corrupt a declared
    fraction of the revealed values, then measure how fast the achievable window collapses and whether
    a small-root construction degrades gracefully or falls off a cliff at a locatable error rate.'
  class: representation
  claim: '(A) A contiguous window of KNOWN-CORRECT bits and a contiguous window of MOSTLY-correct
    bits are different objects. The first fixes an exact residue class for the target prime; the second
    fixes only a Hamming ball around a residue, and the small-root machinery has no direct way to
    express a ball. The operative question this program can settle by measurement is how the achievable
    window length W collapses as the per-bit error rate e rises from zero, and whether the collapse
    is smooth in e or has a threshold. (B) The claim is that W(e) collapses far faster than the naive
    information-theoretic accounting predicts: writing W_info(e) for the window length at which the
    leaked information equals that of an exact window of length W(0), the claim is that W(e) is strictly
    below W_info(e) for every e above zero tested, because the construction can only use the leak
    by committing to an exact value, so an error rate acts as an outright loss of the affected bits
    and additionally as a loss of the bits below them in significance. (C) The claim includes a locatable
    structure: that the practical strategy of enumerating error patterns up to weight w and running
    the exact construction on each candidate turns the problem into a repeated exact problem, so W(e)
    should follow a curve set by the enumeration budget, and that curve should be predictable in advance
    from the binomial tail and the exact-window curve entry one measures. That predictability is the
    falsifiable content: predict, then measure. (D) WHAT IS NOT CLAIMED: no attack, no statement about
    any real side channel, and no claim that any real leakage has an independent per-bit error model
    - independence is a modelling choice made here for tractability and is stated as such. No claim
    that error-tolerant constructions beyond weight enumeration do not exist; failing to find one
    here is not evidence about their existence, and nothing in this entry declares that direction
    closed.'
  mechanism: 'Stage 1: fix the exact-window baseline from entry one at the same n and construction.
    Stage 2: define the noise model exactly - each revealed bit is flipped independently with probability
    e, the flips are recorded per instance so ground truth about which bits are wrong is available
    to the ANALYSIS but never to the solver. Stage 3: define the solver as weight-bounded enumeration:
    enumerate candidate error patterns of Hamming weight at most w over the revealed window, correct
    the window under each pattern, run the exact construction, and verify by exact division. The enumeration
    budget is declared in advance as a maximum number of candidate patterns. Stage 4: measure W(e),
    the largest window at which recovery succeeds on at least 90 percent of seeded instances within
    the declared enumeration budget, over a grid in e. Stage 5: compute the PREDICTED W(e) before
    the run from the binomial tail of the flip count and entry one''s exact curve, and compare. Refutation
    route: if measured W(e) exceeds the prediction, the enumeration is finding successes by paths
    the model does not describe, and the model is wrong in an interesting direction; if it falls far
    below, the enumeration budget rather than the structure is binding and that is reported as a budget
    outcome.'
  novelty_status: unverified
  novelty_screen:
    method: 'Base bucket screen. Additionally: grep -ril ''noisy leakage'' over ledger/proposals/
      returned 0; grep -rih for noise, erasure, error rate, Hamming weight across ledger/proposals/
      and reading matching lines; re-read RQ-RSA-d46f02''s targets and constraints, which specify
      leakage supplied by construction and say nothing about noise.'
    results: Zero proposals contain noisy leakage. Hamming weight appears in the corpus in an unrelated
      ECDLP context, in a proposal whose read list includes rational reconstruction, LLL, Hamming
      weight and height as candidate quantities; that is a different object entirely. No proposal
      in the corpus defines an error model over leaked bits, and no experiment directory under experiments/
      concerns leakage noise. RQ-RSA-d46f02 supplies leakage by construction and never specifies whether
      the supplied bits are exact, so this entry is filling a gap the anchor question leaves open
      rather than contradicting it.
    verdict: 'UNVERIFIED. Nothing asserted about external literature. Claimed new relative to this
      repository: the error rate on revealed bits as a swept independent variable, W(e) as the reported
      curve, and the pre-registered prediction of W(e) from a binomial tail composed with the exact-window
      curve. Assembled from known parts: the exact-window baseline (entry one of this bucket), the
      construction (KN-TECH-015), weight-bounded enumeration which is an entirely standard composition
      move, and the known-answer discipline of RQ-RSA-d46f02.'
  object_first_candidate:
    tracked_object: The corrupted window, carried as the pair (revealed bit string, unknown flip pattern),
      projected to the pair (window length W, flip count t). The flip pattern's identity is discarded
      and only its weight is retained.
    lossiness: 'Genuinely lossy. The full state is the exact flip pattern, a subset of window positions
      of size t. The tracked object keeps only t. That discard is compatible with the target operation
      because the enumeration solver treats all patterns of equal weight identically - its cost and
      its success depend on t and W but not on which positions flipped - so the retained pair propagates
      deterministically through the solver''s decision to succeed or exhaust its budget. The discard
      is not free and one consequence is named: if flips concentrate in the most significant positions
      of the window, the effective loss is larger than weight alone suggests, so flip POSITION is
      recorded and examined as a secondary variable rather than assumed irrelevant.'
    propagation: One step of the target operation is raising the error rate e by one grid step at
      fixed W. Under such a step the distribution of t shifts up by W times delta-e, the number of
      patterns of weight at most w that must be enumerated to cover a fixed probability mass grows
      like a binomial tail, and the success probability at a fixed enumeration budget therefore falls.
      The object propagates as a shifting binomial whose tail the budget truncates, and W(e) is where
      the truncation starts costing more than the window earns.
    survival_score: 'The (W, t) projection should survive while the enumeration budget dominates,
      that is while w stays small enough that the binomial tail is the binding term. It dissolves
      when e is large enough that typical t exceeds any affordable w, at which point the measurement
      degenerates to universal failure and carries no information beyond the location of that point.
      Concretely: expected to carry information for e up to a few percent at W of a few tens of bits,
      and to be degenerate beyond; locating the degeneracy point is the deliverable.'
  null_object_control: 'The identical measurement runs against a null in which the revealed window
    is drawn uniformly at random, so the error rate is effectively one half, with the same enumeration
    budget and the same verification. The null must fail in every cell, with an exact binomial upper
    bound; if weight-bounded enumeration ever succeeds against a random window, the search is finding
    factors by a route unrelated to the leak and every W(e) is void. A second null, and the important
    one, runs the enumeration solver at e = 0 with a nonzero weight budget w: it must reproduce entry
    one''s exact-window r_hat exactly, since enumerating error patterns that do not exist may cost
    time but must not change the answer. That arm calibrates the solver against the baseline in the
    same invocation.'
  discriminated_from:
  - 'Entry four of this bucket (non-contiguous position sets): that entry keeps values exact and varies
    positions. This one keeps positions contiguous and corrupts values. The tracked objects are disjoint
    and each entry''s design is the other''s natural control.'
  - 'Entry one of this bucket: measures the exact-window curve, which this entry consumes as an input
    and as the e = 0 calibration arm rather than re-measuring.'
  - 'Error-correcting-code style recovery from noisy secret bits as a general idea: this entry does
    not propose a decoder; it measures how far the ORDINARY construction plus a declared enumeration
    budget gets, which is the cheapest honest baseline and the thing that must exist before any decoder
    is worth proposing.'
  - 'KN-TECH-015: records the exact-root method with no notion of erroneous inputs.'
  - 'Hidden-number-problem work elsewhere in this repository under nonce leakage: those aggregate
    many noisy samples of a linear relation and can average; here there is a single instance and no
    averaging is available, which is the structural reason the two behave differently.'
  assumptions:
  - Independent per-bit flips are an adequate model for the purpose of measuring a collapse curve.
    This is a modelling choice, not a claim about any real channel, and it is stated as such wherever
    the curve is reported.
  - The enumeration solver at e = 0 reproduces the exact-window baseline; if it does not, the solver
    is not a faithful extension and the comparison is void.
  - Entry one's exact-window curve is available at the same n and construction; without it there is
    no denominator for W_info and no calibration arm.
  - The declared enumeration budget is the binding resource rather than memory, so a budget-limited
    cell is attributable.
  predictions:
  - metric: W(e) versus W_info(e) at every e > 0 tested
    direction: lower
    minimum_effect: 'Forced value: W(e) < W_info(e) strictly at every tested e above zero. No numeric
      gap is pre-committed because the gap size is the measurement.'
  - metric: measured W(e) against the pre-registered binomial-tail prediction
    direction: different
    minimum_effect: 0.0
  - metric: e = 0 enumeration arm r_hat versus entry one's exact-window r_hat
    direction: different
    minimum_effect: 0.0
  - metric: random-window null success rate at any e
    direction: lower
    minimum_effect: 0.0
  minimal_test:
    design: 'Fix n = 128 and one construction. Fix the enumeration budget at a declared maximum number
      of candidate patterns. Sweep e over {0, 0.005, 0.01, 0.02, 0.05} and, at each e, bisect on window
      length W to find the largest W with at least 90 percent success on 40 paired seeded instances.
      Run four arms in one invocation: the noisy signal arm, the e = 0 calibration arm with a nonzero
      weight budget, the random-window null, and a flip-position-recording arm that is the signal
      arm with per-instance flip positions logged for secondary analysis. Compute the predicted W(e)
      from the binomial tail and entry one''s curve BEFORE running, register it in the specification,
      and report predicted against measured. This discriminates because a pre-registered curve that
      misses in a consistent direction localises which term of the model is wrong, and because the
      e = 0 arm makes any discrepancy attributable to noise rather than to the solver.'
    controls:
    - Random-window null at effective error rate one half, same budget, same verification, same invocation.
    - e = 0 calibration arm with nonzero weight budget, which must reproduce the exact-window baseline.
    - Paired instances shared across e values so that the collapse curve carries no instance variance.
    - Flip positions recorded per instance so that a weight-only model can be checked against a position-sensitive
      alternative.
    - Verification by exact multiplication for every claimed recovery, so no success is inferred from
      a norm bound.
    required_metrics:
    - W(e) with exact binomial interval at each e
    - W_info(e), the information-matched window length, computed exactly from the declared noise model
    - pre-registered predicted W(e) and the signed residual against measurement
    - enumeration count used per successful instance, and the fraction of instances that exhausted
      the budget
    - flip weight t per instance and flip positions
    - reduction wall time and peak resident memory per cell
  falsification_conditions:
  - 'The e = 0 arm does not reproduce the exact-window baseline: the solver is unfaithful and the
    whole curve is void.'
  - 'The random-window null succeeds anywhere: the search is finding factors by an unrelated route,
    run void.'
  - 'Measured W(e) exceeds W_info(e) at any e: the central claim is refuted, and the mechanism by
    which the construction beat the information accounting must be reported.'
  - 'The residual against the pre-registered prediction is larger than the resolution floor and has
    no consistent sign or structure: the binomial-tail model is wrong in an unattributable way and
    only the raw curve may be reported.'
  - 'More than half the instances exhaust the enumeration budget at every e above zero: the curve
    measures the budget, and that is reported as a budget outcome rather than as a property of the
    construction.'
  confounders:
  - The enumeration budget interacts with W, since a longer window has more patterns of a given weight;
    the budget is declared as a pattern count rather than a time so that this is explicit and not
    hidden in the clock.
  - Flip position may matter, so a weight-only model could fit for the wrong reason; positions are
    logged and a position-stratified re-analysis is required before any curve is reported as weight-driven.
  - At small e most instances have zero flips, so the measurement is dominated by the exact case and
    has little power; the grid in e is chosen so that expected flip count is at least one at the smallest
    nonzero e.
  - Per-instance time caps bind harder at high e because enumeration is longer, which can masquerade
    as a steeper collapse; capped instances are reported separately.
  - W_info depends on the assumed noise model, so the comparison inherits that modelling choice entirely
    and cannot be read as model-free.
  interpretation_limits:
  - The curve is specific to the independent-flip model, the declared enumeration budget, and the
    reproduced construction; nothing follows for any real channel.
  - A steep collapse is not evidence that error-tolerant constructions cannot exist; this entry measures
    a baseline and explicitly does not close that direction.
  - No claim about deployed RSA or about any security consequence follows in either direction.
  - Where the enumeration budget bound, the result is a budget outcome and is labelled as one.
  target_complexity:
    time_exponent: No attack exponent is claimed. The solver's cost is a declared enumeration budget
      times the cost of one exact-construction run, and both are measured rather than asserted. Reporting
      the enumeration count is part of the deliverable, not a complexity claim.
    memory_exponent: No attack memory exponent is claimed. Weight-bounded enumeration is memory-light
      by design and peak resident memory is recorded per cell beside time to confirm that the budget,
      not memory, is the binding resource.
    best_known: 'The incumbent is the exact-leak assumption itself: every treatment of partial information
      in this repository, including RQ-RSA-d46f02''s own targets, assumes the revealed bits are correct.
      The incumbent measurement of W(e) is that none exists here, and the incumbent solver for noisy
      leaks in this repository is nothing at all, which is precisely why weight-bounded enumeration
      is the right baseline to measure first.'
    hidden_overhead: The lower-order term that bites is the per-candidate setup cost of rebuilding
      the lattice for each corrected window, which the enumeration pays repeatedly and which a smarter
      implementation would amortise; that amortisation is deliberately NOT done, so that the measured
      curve is attributable to a simple declared solver rather than to implementation cleverness.
      The human cost of pre-registering the predicted curve honestly, before seeing data, is the other
      real expense.
  dominated_by: 'n/a (no result claimed). No attack point is asserted and no solver is offered as
    competitive, so no time, memory or data frontier row applies. Stated explicitly rather than as
    null: no frontier rows were checked, because there is no claimed result that belongs on one.'
  sota_delta: No attack; conceptual and measurement contribution only. The deliverable is the pair
    of curves, measured W(e) against a pre-registered prediction, in a repository that currently holds
    no noisy-leakage object and no noisy-leakage measurement of any kind.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: 'The e = 0 calibration arm reproducing the exact baseline: 0.85, since
    it is the same construction with a redundant loop. W(e) strictly below W_info(e) at every tested
    e: 0.85, because committing to an exact value is genuinely all the construction can do. The pre-registered
    binomial-tail prediction matching measurement within the resolution floor: 0.35, which is low
    on purpose - the prediction is a real pre-commitment and the interesting outcome is a structured
    residual. The curve carrying information rather than degenerating to universal failure across
    the whole e grid: 0.6, dependent entirely on the grid being placed correctly, which is the part
    a Coordinator must check before approval.'
