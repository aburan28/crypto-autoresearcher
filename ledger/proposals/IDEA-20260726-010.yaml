idea:
  id: IDEA-20260726-010
  title: Hidden-CM curves — density of small square-free part of t^2-4p, and whether they are actually weaker
  class: measurement
  claim: >-
    Write Delta = t^2 - 4p = f^2 * Delta_K. If |Delta_K| is small, E sits at the
    floor of a volcano whose surface has small CM discriminant -- a "hidden
    CM-special" curve. Detecting this requires extracting the square part of a
    p-sized integer, which is factoring-hard, so such curves are not excluded by
    standard curve-generation hygiene and could in principle be deployed
    unknowingly. This record measures their density and tests whether they are
    weaker. Predicted outcome is a no-op: descending the volcano converts a
    small-norm surface endomorphism into one of norm ~ f^2 * N ~ p, and by
    IDEA-20260726-006 the endomorphism action on E(F_p) was free anyway, so
    there is nothing to exploit at the floor. The density figure is a genuine
    deliverable independent of the hardness null.
  mechanism: >-
    Two separable questions that are usually conflated. (a) Density: among
    random (p, t), how often does Delta have a large square part with small
    Delta_K? This is a Cornacchia-type representation condition -- for fixed
    Delta_K, t^2 - f^2*Delta_K = 4p constrains p to be represented by a binary
    quadratic form -- so the density is expected to be sparse but nonzero, and
    it is measurable directly rather than estimated. (b) Hardness: is such a
    curve weaker? The predicted answer is no, on a specific mechanism. The
    small-norm endomorphism lives on the volcano surface, where End is the
    maximal order; the deployed curve is at the floor, where End = Z[pi] has
    conductor f. Pulling the surface endomorphism down multiplies its norm by
    f^2, giving norm ~ p, so it is not efficiently evaluable at the floor. And
    even if it were, IDEA-20260726-006 shows its action on E(F_p) is
    multiplication by a freely computable integer. The record is worth running
    because "hidden CM" recurs in proposals and currently has no measured
    density figure or recorded null to cite against.
  novelty_status: unverified
  assumptions:
    - >-
      Toy sizes are used where factoring t^2 - 4p is feasible, so the square
      part is extracted exactly rather than estimated. The factoring-hardness
      point is about deployed sizes, not about the experiment.
    - >-
      "Hardness proxy" is operationalized as a set of measurable quantities
      (rho collision rate, m = 3 Semaev solving degree, decomposition yield)
      rather than as an informal notion of weakness.
    - >-
      A random-curve control band is established on the same p, so a deviation
      is measured against matched instances rather than against a prior.
  predictions:
    - metric: density_of_small_Delta_K_curves
      direction: different
      minimum_effect: >-
        A measured, reportable density as a function of the |Delta_K| cutoff,
        with confidence intervals. There is no directional prediction here --
        the number is the deliverable.
    - metric: hardness_proxy_deviation_for_hidden_CM_curves
      direction: different
      minimum_effect: >-
        Predicted null: all proxies for small-Delta_K curves lie inside the
        random-control band (within 3 sd of the control mean). Any proxy outside
        the band, reproducible across seeds, is the positive signal.
    - metric: minimum_evaluable_endomorphism_norm_at_volcano_floor
      direction: higher
      minimum_effect: >-
        Measured min norm scales as ~ f^2 * N, confirming that the surface
        endomorphism does not descend cheaply. A materially lower measured norm
        falsifies the descent argument.
  minimal_test:
    design: >-
      Toy scale, 24-40 bit p where t^2 - 4p factors quickly. (1) Sample several
      thousand random (p, curve) pairs; compute t, factor Delta = t^2 - 4p,
      extract f and Delta_K; tabulate the distribution of |Delta_K| and the
      density below a range of cutoffs. (2) For every small-Delta_K hit found,
      and for a size-matched random control set on the same p, measure the
      hardness proxies: rho collision rate, m = 3 Semaev solving degree, and
      decomposition yield. (3) For the hidden-CM curves, compute the minimum norm
      of an endomorphism evaluable at the floor and compare to f^2 * N.
    controls:
      - >-
        Matched random-curve band: >= 8 random curves per p with the same bit
        size and prime group order, establishing the control mean and sd for
        each proxy. This is the band the hidden-CM curves are tested against.
      - >-
        Known-CM positive control: a deliberately constructed small-discriminant
        CM curve (j = 0 or j = 1728). Its proxies must be distinguishable if the
        proxies can detect CM structure at all. Without this the null is
        uninformative -- it could just mean the proxies are blind.
      - >-
        Conductor ablation: curves with the same Delta_K but materially
        different f, to confirm that any observed effect tracks f rather than
        Delta_K alone.
      - >-
        Matched rho and BSGS counts per instance.
    required_metrics:
      - density of |Delta_K| below each cutoff, with confidence intervals
      - each hardness proxy for hidden-CM curves vs the random control band
      - measured min evaluable endomorphism norm at the floor vs f^2 * N
      - positive-control proxy separation, to establish proxy sensitivity
  falsification_conditions:
    - >-
      Any hardness proxy for a hidden-CM curve outside the random-control band,
      reproducible across seeds. This falsifies the no-op prediction.
    - >-
      Measured min evaluable endomorphism norm at the floor materially below
      f^2 * N, falsifying the descent-cost argument.
    - >-
      The known-CM positive control shows no proxy separation, which would mean
      the proxies cannot detect CM structure and the null is vacuous. This is a
      test-validity failure, not a mathematical result.
  confounders:
    - >-
      Small-Delta_K curves are rare, so the hit set may be too small for the
      band comparison to have power. The report must state the achieved power
      rather than presenting an underpowered null as a clean negative.
    - >-
      Selecting curves by a property of Delta while comparing proxies that also
      depend on t risks a selection artifact; the control set must be matched on
      the confounding quantities, not only on bit size.
    - >-
      The factoring-hardness framing applies at deployed sizes only. Nothing in
      this experiment demonstrates that such curves are hard to detect, since the
      experiment detects them by factoring.
    - >-
      j = 0 and j = 1728 have extra automorphisms, so the positive control
      differs from a generic small-Delta_K curve in more than one way.
  interpretation_limits:
    - >-
      Toy scale. The density figure is measured at toy sizes and its
      extrapolation to crypto sizes is a separate, unaddressed question.
    - >-
      A confirmed null closes hidden-CM as a weakness at tested scope and gives
      future proposals something to cite. It is not a statement about
      curve-generation policy, which is a separate engineering question.
    - >-
      No breakthrough claim in either direction.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: low
