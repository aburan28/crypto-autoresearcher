idea:
  id: IDEA-20260817-230971
  question_id: RQ-ECDLP-002
  added: '2026-08-17'
  title: >-
    Measure the characterization instead of citing it: the Minkowski-exponent audit of every
    lattice naturally attached to an ordinary prime-field curve, including the non-commutative
    matrix-order enlargements M_m(O) that are the obvious escape from "2D commutative
    endomorphism ring" -- and including the small-|D| Hasse-endpoint corner that KN-FIND-7e4b90's
    own escape clause leaves outside its negative
  class: measurement
  claim: >-
    (A) WHAT THIS TARGETS. KN-FIND-5c1a03 characterizes prime-field ECDLP hardness as MINIMAL
    ALGEBRAIC STRUCTURE: supersingular breaks at p^{1/3} because it carries a 4D quaternion
    algebra, extension fields beat rho because Frobenius supplies an algebraic factor base, and
    ordinary prime-field curves stay at rho because End(E) is only a 2D commutative imaginary
    quadratic order. KN-FIND-7e4b90 states the same diagnosis for the specific Wesolowski
    transfer. Both carry proof_status: derivation and evidence_level: mathematical_argument.
    Neither has been reduced to a measured obstruction with a quantity, units, error bars and a
    claimed scope, and the program's obstruction registry is empty. Under
    docs/inventor-protocol.md section 4 a closure in that form is a hypothesis about the search,
    not a proven barrier.

    (B) THE OPERATIONALIZATION. The algebraic leg of both findings is, at bottom, a statement
    about SHORT VECTORS IN LATTICES WITH A DEGREE FORM. Define, for any Z-lattice L of finite
    rank r attached to the curve and carrying a positive definite integral quadratic form q
    (degree, norm, or trace form), the MINKOWSKI EXPONENT e(L) = log_p(lambda_1(L, q)).
    Minkowski's theorem gives the a priori ceiling e(L) <= (1/r)*log_p(det L) + o(1). The
    prediction under audit is that EVERY lattice naturally attached to a GENERIC ordinary E/F_p
    has e = 1/2, exactly the rho exponent, whereas the supersingular Hom(E, E^{(p)}) lattice
    admits e = 1/3 by the Aubry-Oyono-Vincent bound.

    (C) THE OBVIOUS ESCAPE, WHICH NEITHER FINDING ADDRESSES. End(E) is 2D and commutative, but
    End(E^m) = M_m(O) is a Z-order of rank 2m^2 and is NON-commutative for m >= 2, and since
    2022-2023 (Kani's lemma as deployed in the SIDH attacks; Robert's higher-dimensional isogeny
    machinery) isogenies between PRODUCTS of elliptic curves are computationally accessible. So
    "prime-field curves have only 2D commutative structure" is FALSE as stated about the objects
    available to an attacker: rank 2m^2 non-commutative structure is available for every m. THE
    QUESTION THIS RECORD ASKS IS WHETHER THE RANK BUYS ANYTHING.

    (D) THE PREDICTION THIS AGENT COMMITS TO, AND WHY IT IS WORTH MEASURING ANYWAY. The natural
    trace form on M_m(O), q(alpha) = Tr(alpha * alpha-bar) = sum over entries of N(a_ij), is an
    ORTHOGONAL DIRECT SUM of m^2 copies of the rank-2 norm form of O. Therefore
    lambda_1(M_m(O)) = lambda_1(O) EXACTLY, and e = 1/2 for every m: rank grew but determinant
    grew in exact lockstep, det = (disc O)^{m^2}, so (1/r)*log det = (1/(2m^2))*(m^2)*log|disc O|
    = (1/2)*log|disc O| independent of m. THE RANK ESCAPE FAILS, AND IT FAILS FOR A REASON THAT
    CAN BE WRITTEN DOWN IN ONE LINE AND CHECKED WITH NO COMPUTE.

    (E) THE DIAGNOSIS THIS RECORD DISPUTES, AND IT DISPUTES ONLY THE DIAGNOSIS. KN-FIND-7e4b90's
    CONCLUSION -- that Wesolowski's theorem does not transfer to ordinary prime-field curves -- is
    ACCEPTED HERE AND NOT DISPUTED. Nothing in this record claims it does transfer. What is
    disputed is which ingredient is essential. 7e4b90 attributes the block to the absence of 4D
    quaternion structure. This record argues the operative ingredient is A THEOREM BEATING
    MINKOWSKI ON A PARTICULAR LATTICE, with AOV as the witness, and that 4D-ness is a property of
    the case where such a theorem happens to be known rather than the cause. The arithmetic:
    Minkowski on the rank-4 Hom(E, E^{(p)}) lattice gives only lambda_1 <~ p^{1/2}, the SAME
    exponent as the ordinary rank-2 case, so rank alone predicts nothing; the p^{1/3} comes from
    AOV, a specific arithmetic statement about that specific lattice.

    (F) AND THE FRAMEWORK REPRODUCES 7e4b90's OWN ESCAPE CLAUSE AS AN ARITHMETIC CONSEQUENCE,
    WHICH IS THE STRONGEST EVIDENCE THAT THE TWO RECORDS AGREE ON SUBSTANCE. 7e4b90 states that a
    short element of norm p^{1/3} "would require |D| ~ p^{2/3} and class number 1, which is not
    the case for generic curves". In the exponent framework that condition is not a bespoke
    clause but a substitution: for a rank-2 order O with |disc O| = |D|, Minkowski and the class
    number formula give lambda_1 ~ |D|^{1/2}, hence
        e = log_p(lambda_1) = (1/2) * log_p|D|.
    At generic |D| ~ 4p this is e = 1/2. At |D| ~ p^{2/3} it is e = 1/3, exactly 7e4b90's
    threshold. So the escape clause is the level set of a formula this audit measures directly,
    and the word "generic" in 7e4b90 is doing real scoping work: it puts the small-|D|
    Hasse-endpoint corner OUTSIDE the negative. An earlier draft of this record excluded that
    corner by construction through its class-size selection rule. THAT WAS THE WRONG CHOICE and
    it is corrected here: arm L1-DEG samples the corner deliberately.

    (G) NOT CLAIMED, AND ONE OF THESE MATTERS MORE THAN THE REST. No attack. No refutation of
    KN-FIND-5c1a03 or KN-FIND-7e4b90 -- claims (D), (E) and (F) SHARPEN them and, if measured,
    UPGRADE the algebraic leg from derivation to datum. CRITICALLY: a measured e = 1/3 on the
    L1-DEG corner would NOT mean the ECDLP falls there. Small-discriminant CM curves are the GLV
    setting, where a short endomorphism is known to buy only a constant-factor speedup in rho,
    not an exponent. That is stated up front so the degenerate arm cannot be mis-sold as a lead,
    and it is itself a second observation collision recorded below.
  mechanism: >-
    The audit is a lattice computation, not a cryptanalysis, and that is why it is cheap.

    THE PANEL OF LATTICES, declared in full before any measurement. For each toy ordinary E/F_p
    with D = t^2 - 4p:
    L1 = O = End(E) with the norm form; rank 2, det ~ |D| ~ 4p, sampled at GENERIC t. Predicted
         e = 1/2. THIS IS THE HEADLINE ARM, because lambda_1(L1) is the size of the smallest
         non-scalar endomorphism -- the quantity KN-LIT-1022's cited path-finding results take as
         input, and the quantity 7e4b90's escape clause is about.
    L1-DEG = the same lattice sampled at HASSE-ENDPOINT t, i.e. |t| chosen so that |D| = 4p - t^2
         lands in declared bands around p^{2/3}, p^{1/2} and p^{1/3}. Predicted e = (1/2)*log_p|D|
         by claim (F), hence 1/3, 1/4 and 1/6 respectively. THIS ARM COVERS THE CORNER 7e4b90's
         "generic" leaves outside, and its forced values are a second, independent check that the
         instrument tracks the formula rather than the prime.
    L2 = the ideal (pi - 1) with the norm form, whose index is #E(F_p); rank 2.
    L3 = Hom(E, E') for E' a class member reached by a smooth ideal, with the degree form; rank 2,
         det ~ |D|. Predicted e = 1/2 at generic t, i.e. no single short isogeny between class
         members even though the class is poly-navigable -- navigability uses COMPOSITIONS of
         small-norm ideals, not one short vector, and separating those two is a deliverable.
    L4 = M_m(O) = End(E^m) with the trace form, m in {2,3,4}; rank 2m^2, det = |disc O|^{m^2}.
         Predicted e = 1/2 by the orthogonal-sum argument, INDEPENDENT of m.
    L5 = Hom(E_1 x E_2, E_3 x E_4) for four class members, with the product-polarization degree
         form; rank 8. The Kani/Robert diamond shape, and the panel member most likely to break
         the pattern, because the form is NOT an orthogonal sum when the four curves are distinct.
    L6 = the DLP lattice {(a,b) in Z^2 : aP + bQ = O}; rank 2, det = n. Predicted e = 1/2 by
         Minkowski AND by the Gaussian heuristic; a POSITIVE CONTROL, because its shortest vector
         provably solves the DLP, so any measured e < 1/2 here is an immediate contradiction
         exposing a bug.
    L7 = the supersingular CONTRAST ARM: Hom(E_ss, E_ss^{(p)}) with the Nrd/p form, rank 4.
         Predicted e = 1/3 empirically (AOV) against a Minkowski ceiling of 1/2. This arm proves
         the instrument can SEE a theorem beating Minkowski when one exists.

    WHAT IS MEASURED. For each panel member at each toy prime: the rank r, the exact determinant,
    the Minkowski ceiling (1/r)*log_p(det), and the EXACT lambda_1 by complete SVP (ranks <= 32,
    trivially exact at toy sizes), then the fitted exponent e = log_p(lambda_1) across a sweep of
    primes with its confidence interval. The headline deliverable is the pair (Minkowski ceiling,
    measured e) per lattice, and the GAP between them, because the gap is exactly "how much a
    theorem beats generic geometry" and it is the quantity the whole characterization turns on.
    For L1 and L1-DEG the run additionally reports the fit of e against (1/2)*log_p|D| across the
    whole |D| range, which is the direct test of claim (F).

    HOW THE CHARACTERIZATION GETS FALSIFIED. If any panel member other than L7 and L1-DEG shows a
    fitted e significantly below 1/2 at generic t, then a curve-attached lattice with sub-1/2
    short vectors exists for GENERIC ordinary prime-field curves, and the universality of the
    diagnosis is refuted with a named witness. L5 is where this could happen and is the reason
    the panel is not just L1-L4. L1-DEG is NOT such a witness by construction -- it is the
    already-excluded corner, and reporting it as a refutation would be a scope error.

    WHY A NULL IS STILL THE FIRST OBSTRUCTION RECORD. If every generic arm returns e = 1/2 +- eps
    with a tight interval, the program acquires, for the first time, a measured obstruction block:
    quantity = fitted Minkowski exponent, value = 0.500 +- eps, units = dimensionless exponent in
    p, scope = the declared lattices over the swept primes. That is re-scopable, comparable and
    invertible by any later reader, which prose is not -- and by claim (E) it measures what
    7e4b90 asserts, on 7e4b90's own stated terms.
