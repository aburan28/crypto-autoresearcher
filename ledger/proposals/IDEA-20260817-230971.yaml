      agent did not open and does not claim to have opened.
    results: >-
      MY TEXTUAL SCREEN flagged blacklist neighbours "B3-Quaternion-Brandt@0719b4",
      "C3-CM-ideal-factorization-index-calculus-endomorphism-ring-class-group@0718",
      "C1-Noncommutative-CM-correspondence-relation-composition-quiver/groupoid@0717" and
      "B1-Kani-torsion-glued-genus-2-Jacobian-with-real-multiplication@0717b2"; none, as far as
