  object_first_candidate:
    tracked_object: >-
      The pair (Minkowski ceiling, measured lambda_1) of a curve-attached lattice with its
      degree/norm/trace form, summarised by the single exponent e = log_p(lambda_1) and by the GAP
      between e and the ceiling.
    lossiness: >-
      The projection L |-> (r, det, lambda_1) discards the entire lattice: the basis, the Gram
      matrix, every vector but one, and all arithmetic structure. It is maximally lossy. What it
      retains propagates deterministically under the operations that matter here: under orthogonal
      direct sum, lambda_1(L1 (+) L2) = min(lambda_1(L1), lambda_1(L2)) and det multiplies; under
      scaling by an ideal of norm N, det scales by N^r. Those two laws are exactly what makes the
      M_m(O) computation a one-liner rather than an experiment. Explicitly NOT lossy, and
      therefore excluded: passing from a lattice to a reduced basis of it, a change of coordinates.
    propagation: >-
      One step of the target operation -- enlarging from E to E^m, or from one class member to
      another, or from E to a product E_1 x E_2, or moving t toward the Hasse endpoint -- acts on
      the tracked pair by the laws above, one-sidedly and with correction terms stated. The run
      measures the realised lambda_1 against the propagated bound rather than assuming it is
      attained. The t-direction is the one where the propagation law is an EQUALITY,
      e = (1/2)*log_p|D|, which is why L1-DEG doubles as a check on the instrument.
    survival_score: >-
      The structure survives as far as the form stays an orthogonal sum. It DISSOLVES at L5, the
      four-distinct-curve Kani diamond, where the form is not an orthogonal sum and the
      propagation law gives only an inequality. That is why L5 is the member most worth measuring
      and the one where the diagnosis could break.
  null_object_control: >-
    (N1) RANDOM-LATTICE NULL. For each panel member, generate 30 random integral lattices of the
    SAME rank and SAME determinant with a random positive definite form, and measure lambda_1 by
    the identical exact SVP routine. The Gaussian heuristic forces
    lambda_1 ~ sqrt(r/(2*pi*e))*det^{1/r}; any curve-attached lattice whose lambda_1 sits inside
    this null distribution has NO arithmetic structure beyond its shape, and that is the honest
    reading of a null arm. NOTE this null is what makes L1-DEG interpretable: a small |D| lowers
    the null too, so the degenerate arm's e = 1/3 must be read against a null that also moved,
    and it is predicted to sit ON the null rather than below it -- i.e. shape, not a theorem.
    (N2) POSITIVE CONTROL WITH A FORCED VALUE. L7, the supersingular Hom(E, E^{(p)}) arm, MUST
    return a measured e near 1/3, materially below both its Minkowski ceiling and the
    random-lattice null. If it does not, the instrument cannot detect a theorem beating generic
    geometry and the whole run is void. This arm makes every null in the others interpretable.
    (N3) SECOND POSITIVE CONTROL. L6, the DLP lattice, must return e = 1/2 and its shortest vector
    must recover k on toy instances, verified by an independently recomputed certificate. A
    measured e < 1/2 on L6 is a bug, not a discovery.
    (N4) FORMULA CONTROL. Across L1 and L1-DEG the measured e must track (1/2)*log_p|D| over the
    whole sampled |D| range. This is a forced curve, not a forced point, and a departure from it
    means the exponent is not being measured correctly anywhere in the run.
  discriminated_from:
    - >-
      KN-FIND-7e4b90: shares the subject and ACCEPTS its conclusion. That record ARGUES, at
      evidence_level mathematical_argument, that Wesolowski's transfer is blocked by the absence
      of 4D quaternion structure. This record accepts the block, disputes only the diagnosis per
      claim (E), reproduces the record's own escape clause as the level set of a formula per claim
      (F), and MEASURES lambda_1 -- the quantity that clause is about -- including in the
      non-generic corner the clause explicitly leaves outside. Sharpening plus measurement, not
      duplication and not contradiction. Ruling recorded by the coordinator session that read
      7e4b90 in full.
    - >-
      KN-FIND-5c1a03 itself: that record ARGUES a characterization from three analyses. This
      record MEASURES one exponent per lattice and reports the gap to Minkowski. It does not
      re-run any of the three analyses and takes no position on the other two legs.
    - >-
      Blacklist "B3-QUATERNION-BRANDT@0719b4" and "C3-CM-ideal-factorization-index-calculus@0718":
      both propose using quaternion or CM ideal structure to build an ATTACK. Nothing here
      attacks; the deliverable is an exponent with error bars.
    - >-
      KN-LIT-1022 and the orienteering line: those take a small endomorphism as GIVEN and derive
      path-finding algorithms. This record measures whether a small endomorphism EXISTS, which is
      the input side of that work, and predicts it does not for generic curves (e = 1/2). The two
      are complementary rather than overlapping.
    - >-
      IDEA-20260817-84755b and IDEA-20260817-1e0111 in this same batch: those measure an
      information functional and a pruning ratio respectively, auditing the ANALYTIC leg and the
      structure-free-algorithm claim. This record audits the ALGEBRAIC leg.
    - >-
      IDEA-20260817-4c6519 and IDEA-20260817-f63307, both WITHDRAWN in this batch: neither shares
      an object with this record. Class members appear here only as sources of lattices in arms
      L3 and L5, with no transfer and no dependence on class navigability.
  assumptions:
    - Toy primes small enough that exact SVP on ranks up to 32 is instantaneous, and large enough that a fitted exponent in log p is meaningful over the sweep.
    - The degree form on Hom and the trace form on M_m(O) are positive definite integral quadratic forms, so exact SVP is well posed.
    - For the GENERIC arms L1, L3 and L5, ordinary curves are selected with h(D) large enough that the class arms have members to draw from. THIS SELECTION EXCLUDES THE SMALL-|D| CORNER, and that exclusion is no longer silent: arm L1-DEG exists precisely to sample the excluded region, and every generic-arm result is reported as scoped to generic t.
    - Hasse-endpoint classes are rare -- density roughly p^{-1/4} for |D| < p^{1/2} -- so L1-DEG samples t directly in declared bands rather than waiting for uniform sampling to produce them, and the run reports that this is a CONDITIONED sample, not a representative one.
    - The supersingular contrast arm L7 is constructed over F_{p^2} as the literature requires, and is reported as a CONTRAST, never as prime-field evidence, per KN-LIT-002's warning about borrowing asymptotics across field types.
    - No claim requires the Kani/Robert machinery to be run; L5 is measured as a lattice, and its computability is a separate question named in interpretation limits.
  heuristic_assumptions:
    - id: HEUR-1
      statement: >-
        GAUSSIAN-HEURISTIC NULL. For a uniformly random integral lattice of rank r and determinant
        Delta with a random positive definite form, lambda_1 =
        (1+o(1))*sqrt(r/(2*pi*e))*Delta^{1/r}, uniformly for 2 <= r <= 32 and Delta in the swept
        range. FOR ALL r in the panel, FOR ALL Delta in range, the empirical distribution of
        lambda_1/Delta^{1/r} concentrates at the stated constant.
      rigorous_support: >-
        Minkowski's convex body theorem supplies the rigorous upper bound
        lambda_1 <= 2*(Delta/V_r)^{1/r}; the Gaussian heuristic is the classical distribution
        statement it imitates, exact in the average over the Haar measure on the space of lattices
        (Siegel's mean value theorem).
      validation_plan: >-
        30 random lattices per (r, Delta) cell across the whole sweep, exact SVP, empirical
        distribution of lambda_1/Delta^{1/r} compared against the predicted constant, with a tail
        check on the smallest observed ratio against its predicted extreme-value probability.
        Sampled parameters recorded per cell, INCLUDING the small-Delta cells the L1-DEG arm needs.
      falsification_condition: >-
        The empirical mean of lambda_1/Delta^{1/r} differs from sqrt(r/(2*pi*e)) by more than 15
        percent in any cell, in which case the null is mis-specified and no arm's deviation from
        it may be read as structure.
    - id: HEUR-2
      statement: >-
        EXPONENT STABILITY AND THE DISCRIMINANT LAW. For each panel member, e = log_p(lambda_1)
        converges to a constant as p grows at fixed |D|/p scaling, and for the rank-2 arms it
        obeys e = (1/2)*log_p|D| + o(1) across the sampled |D| range. FOR ALL rank-2 panel
        members, the fitted e over primes in [2^12, 2^28] has residual consistent with that law
        plus O(1/log p).
      rigorous_support: >-
        For a rank-2 order the exponent is forced by Minkowski together with the class number
        formula: lambda_1 ~ |disc O|^{1/2}. At generic |D| ~ 4p this gives e = 1/2 exactly, so L1
        is a self-check rather than an assumption; at |D| ~ p^{2/3} it gives e = 1/3, which is the
        threshold KN-FIND-7e4b90 states as its escape clause. The heuristic content is extending
        stability to the arms whose determinant is not a clean power of p.
      validation_plan: >-
        Fit e per panel member over at least 8 primes spanning 2^12 to 2^28, report the residual
        and the fitted O(1/log p) coefficient; require L1's fitted e to come out 0.500 +- 0.02 and
        L1-DEG's to track (1/2)*log_p|D| within 0.03 across its declared |D| bands, as forced-value
        checks on the fitting procedure itself.
      falsification_condition: >-
        L1's fitted e is not 0.500 +- 0.02, or L1-DEG departs from (1/2)*log_p|D| by more than
        0.03 in any band, or any arm's residual shows monotone drift exceeding 0.05 in e across
        the sweep. Any of these voids the exponent reading and reduces the deliverable to
        per-prime values with no extrapolation.
    - id: HEUR-3
      statement: >-
        ORTHOGONAL-SUM EXACTNESS. The trace form on M_m(O), q(alpha) = Tr(alpha*alpha-bar), is
        isometric to the orthogonal direct sum of m^2 copies of the norm form of O. Consequently
        lambda_1(M_m(O), q) = lambda_1(O, N) EXACTLY, for all m >= 1 and all orders O.
      rigorous_support: >-
        This is not a heuristic in the distributional sense; it is an ALGEBRAIC IDENTITY that
        should be provable in a line and is listed here so that it is either discharged as a lemma
        or refuted, rather than assumed silently. Its rigorous support is the entrywise definition
        of the reduced trace on a matrix order.
      validation_plan: >-
        Verify computationally for m in {2,3,4} and 20 orders O -- including small-|D| orders from
        the L1-DEG bands -- by constructing the Gram matrix of q explicitly and checking it is
        block diagonal with m^2 identical 2x2 blocks, then confirming lambda_1 agrees with
        lambda_1(O) exactly, not approximately. A symbolic check costing seconds.
      falsification_condition: >-
        The Gram matrix is not block diagonal for some m and O, or lambda_1(M_m(O)) != lambda_1(O)
        for any tested pair. EITHER OUTCOME IS MORE INTERESTING THAN THE PREDICTED ONE, because it
        would mean the rank escape is not closed and a non-commutative enlargement does supply
        shorter vectors.
  proof_search_map:
    bottleneck: >-
      The step whose removal would change the theorem is: exhibiting, for an ordinary prime-field
      curve, a lattice-with-degree-form on which some theorem beats the Minkowski ceiling, as AOV
      does in the supersingular case. Everything else in the p^{1/3} template -- smoothness
      splitting, meet-in-the-middle, the mixing walk -- is generic and already available. Note
      that L1-DEG lowers lambda_1 without beating the ceiling, which is exactly the distinction
      this bottleneck statement is drawing.
    baseline_embedding:
      parameter_slice: >-
        m = 1 reduces L4 to L1 = O, whose exponent 1/2 is the known baseline and is forced by
        disc(O) ~ 4p at rank 2. Generic t reduces L1-DEG to L1. The supersingular arm L7 at its
        own baseline reproduces the Minkowski ceiling 1/2, against which AOV's 1/3 is the
        improvement.
      reproduction_check: >-
        Symbolic: at m = 1 the Gram matrix of q is exactly the norm form of O, and at generic t
        the discriminant law returns e = 1/2. Frozen fixture: the L1 arm must return
        e = 0.500 +- 0.02 at every prime, and the run is void otherwise.
    observation_collision:
      observable: The exponent e = log_p(lambda_1) of a curve-attached lattice.
      distinct_preimage_search: >-
        TWO collisions, both expected, both designed in, and together they are why e is never
        reported alone. FIRST: L1 (ordinary End, no attack) and L7's Minkowski CEILING
        (supersingular, where an attack exists) both sit at e = 1/2 -- so e does not identify
        attackability, and the reported observable is the PAIR (ceiling, measured) with the GAP as
        the diagnostic. SECOND, and it cuts the other way: L1-DEG at |D| ~ p^{2/3} returns
        e = 1/3, the SAME value as L7, while the ECDLP on such a curve is NOT broken -- small-|D|
        CM curves are the GLV setting, where a short endomorphism buys a constant-factor rho
        speedup and no exponent. So a low e does not imply a fast DLP either. The two collisions
        bracket the observable from both sides and are the record's strongest internal argument
        that lambda_1 is a diagnostic quantity rather than a cost.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace "rank of End" by the pair (Minkowski ceiling, measured lambda_1) as the invariant
          carried through the analysis, because the gap is what survives the comparison across
          field types and rank does not.
        predicted_gain: >-
          No cost gain. The gain is diagnostic: it re-poses the search from "find rank 4" to "find
          a lattice where a theorem beats Minkowski", a different and better-posed target, and it
          turns KN-FIND-7e4b90's escape clause into a level set of a formula.
      - transform: representation_reduction
        proposed_object: >-
          M_m(O) and the Kani diamond Hom(E_1 x E_2, E_3 x E_4) as candidate carriers of
          non-commutative structure for ordinary prime-field curves.
        predicted_gain: >-
          ZERO for M_m(O), by HEUR-3's orthogonal-sum identity. UNKNOWN for the Kani diamond, the
          one arm whose form is not an orthogonal sum.
    quantifier_order: >-
      The characterization under audit: FOR ALL mechanisms M achieving sub-rho cost, THERE EXISTS
      structural ingredient S required by M, such that S is absent from GENERIC ordinary
      prime-field curves. The word "generic" is inherited from KN-FIND-7e4b90's own escape clause
      and is load-bearing: the negative is quantified over generic t only. The audit attacks the
      inner existential over a DECLARED FAMILY of candidate S, and can refute universality but
      never establish it. A result on L1-DEG is a result about the EXCLUDED corner and refutes
      nothing about the generic statement.
    method_ceiling:
      strongest_certifiable_claim: >-
        Over the declared lattices and swept primes, the measured Minkowski exponent is
        0.500 +- eps for every generic ordinary arm, tracks (1/2)*log_p|D| on the degenerate arm,
        and is 1/3 for the supersingular contrast arm. That is a scoped measurement. It can NEVER
        certify that no curve-attached lattice has a small shortest vector, because the panel is
        finite and declared, and it can never certify that a small shortest vector yields an
        algorithm.
      nearby_object_control: >-
        The nearby object on which the desired conclusion FAILS is the supersingular arm L7: same
        kind of lattice, same kind of form, and a theorem that beats Minkowski. A SECOND nearby
        object, added with L1-DEG, is a small-|D| ordinary curve where lambda_1 IS small and the
        DLP is nevertheless not broken. A method that cannot separate L1 from L7, or L1-DEG from
        L7, has not identified the load-bearing structure.
    proof_obligations:
      - claim: q on M_m(O) is an orthogonal sum of m^2 copies of the norm form of O.
        responsibility: correctness
      - claim: lambda_1 of an orthogonal sum is the min of the summands' lambda_1.
        responsibility: correctness
      - claim: det(M_m(O)) = |disc O|^{m^2}, so the Minkowski ceiling is m-independent.
        responsibility: size
      - claim: For rank-2 orders, e = (1/2)*log_p|D|, reproducing KN-FIND-7e4b90's escape threshold at |D| ~ p^{2/3}.
        responsibility: correctness
      - claim: Exact SVP at ranks <= 32 and toy determinants is poly and instantaneous.
        responsibility: runtime
      - claim: The L7 contrast arm returns e near 1/3, proving the instrument sees theorems that beat Minkowski.
        responsibility: interface
      - claim: A low e does not imply a fast DLP; the L1-DEG collision is reported alongside every low reading.
        responsibility: scope
      - claim: Every number is scoped to the declared panel and to generic t except where L1-DEG is named; universality is not established by any null.
        responsibility: scope
  predictions:
    - metric: fitted_minkowski_exponent_e_per_panel_lattice
      direction: different
      minimum_effect: >-
        PRE-COMMITTED forced values: L1 = 0.500 +- 0.02; L4 = 0.500 +- 0.02 for every m in {2,3,4}
        and IDENTICAL to L1 to within measurement noise; L6 = 0.500 +- 0.02; L7 = 0.333 +- 0.03.
        L5 is the only arm left free: any fitted e <= 0.45 on L5 at GENERIC t, reproducible across
        primes and against the random-lattice null, is the positive signal and refutes the
        universality of the diagnosis.
    - metric: l1_deg_fitted_e_against_half_log_p_abs_D
      direction: different
      minimum_effect: >-
        forced curve: e must track (1/2)*log_p|D| within 0.03 across the declared bands, giving
        e = 0.333, 0.250 and 0.167 at |D| ~ p^{2/3}, p^{1/2}, p^{1/3}. This reproduces
        KN-FIND-7e4b90's escape threshold as a measured level set. A departure means the exponent
        is not being measured correctly anywhere in the run.
    - metric: lambda_1_of_M_m_O_minus_lambda_1_of_O
      direction: different
      minimum_effect: 'forced value: EXACTLY 0 for all m and all tested O including small-|D| orders, by HEUR-3. A nonzero value refutes HEUR-3 and reopens the rank escape.'
    - metric: gap_between_minkowski_ceiling_and_measured_e
      direction: different
      minimum_effect: >-
        Predicted ~0 for every ordinary arm INCLUDING L1-DEG -- the degenerate arm lowers
        lambda_1 and the ceiling together, so it should show no gap -- and ~0.17 for the
        supersingular arm L7. The gap, not e, is the reported diagnostic, and this prediction is
        what separates "small because |D| is small" from "small because a theorem beats geometry".
    - metric: random_lattice_null_ratio_lambda1_over_det_to_the_1_over_r
      direction: different
      minimum_effect: 'forced value: sqrt(r/(2*pi*e)) within 15 percent, else the null is mis-specified and the run is void'
    - metric: dlp_lattice_shortest_vector_recovers_k_rate
      direction: higher
      minimum_effect: 'forced value: 1.000 on toy instances, with an independently recomputed certificate per solve'
    - metric: matched_rho_cost_on_l1_deg_curves_versus_generic_curves
      direction: different
      minimum_effect: >-
        forced expectation: rho cost on small-|D| curves must remain p^{1/2} up to the known
        constant-factor GLV/automorphism discount, DESPITE e = 1/3 on those curves. This is the
        second observation collision measured rather than asserted, and it is what prevents the
        degenerate arm being mis-sold as a lead.
  minimal_test:
    design: >-
      Sweep p over at least 8 primes from 2^12 to 2^28 with n = #E(F_p) prime. Per prime:
      construct the panel lattices, build each Gram matrix exactly, compute exact lambda_1 by
      complete enumeration (ranks <= 32, exact integer arithmetic, no floating-point reduction),
      and record r, det, the Minkowski ceiling and lambda_1. Sample L1 at generic t and L1-DEG at
      t conditioned into declared bands around |D| ~ p^{2/3}, p^{1/2}, p^{1/3}. Run the
      random-lattice null (30 draws per (r,det) cell, including the small-det cells) in the same
      invocation. Run the L7 supersingular contrast arm over F_{p^2} and label every one of its
      numbers CONTRAST, NOT PRIME-FIELD EVIDENCE. Verify HEUR-3 symbolically for m in {2,3,4} over
      20 orders spanning both generic and small |D|. Fit e per arm across the sweep with
      residuals, and fit L1 + L1-DEG jointly against (1/2)*log_p|D|. Run the MANDATORY MATCHED
      CONTROLS: Pollard rho and BSGS on one toy instance per prime AND on the L1-DEG curves,
      reported in group operations and memory, so the audit's exponents are stated beside the
      incumbents and so the second observation collision is measured rather than asserted. Total
      cost: minutes to low hours; exact SVP at these ranks and determinants is not a bottleneck.
      THE CHEAPEST SUB-STEP, which should run first and costs no compute at all: the HEUR-3
      Gram-matrix block structure check.
    controls:
      - 'MANDATORY MATCHED CONTROL: Pollard rho on one toy instance per prime, group operations and memory reported, so e = 1/2 is anchored to a measured rho cost rather than asserted.'
      - 'MANDATORY MATCHED CONTROL: Pollard rho AND BSGS on the L1-DEG small-|D| curves specifically, since the whole point of that arm is that a low e coexists with an unbroken DLP.'
      - 'MANDATORY MATCHED CONTROL: BSGS on the generic instances, with its sqrt(n) memory reported, since the audit''s subject is what buys an exponent.'
      - 'N1 random-lattice null at matched rank and determinant, same exact SVP routine, including small-determinant cells.'
      - 'N2 supersingular contrast arm L7 with forced value near 1/3 -- the instrument check without which no null is interpretable.'
      - 'N3 DLP-lattice positive control L6 with certificate-verified k recovery.'
      - 'N4 formula control: L1 and L1-DEG jointly against (1/2)*log_p|D|.'
      - 'HEUR-3 symbolic check on the Gram matrix block structure, independent of any SVP.'
      - 'Second form per lattice where more than one natural form exists (degree vs trace), reported side by side so a favourable form cannot be chosen after the fact.'
    required_metrics:
      - rank_determinant_minkowski_ceiling_and_exact_lambda1_per_panel_lattice_per_prime
      - fitted_exponent_e_with_residual_and_ci_per_panel_lattice
      - l1_and_l1_deg_joint_fit_against_half_log_p_abs_D_with_residual
      - gap_between_ceiling_and_measured_e_per_panel_lattice
      - lambda1_M_m_O_minus_lambda1_O_per_m_and_per_order
      - gram_matrix_block_structure_verdict_per_m
      - random_lattice_null_distribution_per_cell
      - supersingular_contrast_arm_e_and_its_forced_value_check
      - dlp_lattice_k_recovery_rate_with_reverified_certificates
      - matched_pollard_rho_and_bsgs_cost_and_memory_per_prime_and_on_l1_deg_curves
  falsification_conditions:
    - L1 does not return e = 0.500 +- 0.02, refuting HEUR-2 and voiding every fitted exponent in the run.
    - L1-DEG departs from (1/2)*log_p|D| by more than 0.03 in any declared band, meaning the discriminant law is not being measured correctly and no exponent in the run is trustworthy.
    - The supersingular contrast arm L7 does not return e near 1/3, meaning the instrument cannot detect a theorem beating Minkowski, so every null in the ordinary arms is uninterpretable and the run is void.
    - The random-lattice null does not match the Gaussian heuristic within 15 percent, so structure and shape cannot be separated.
    - The DLP-lattice control returns e < 1/2 or fails to recover k, which is a bug and voids the run.
    - HEUR-3 fails, i.e. the Gram matrix of the trace form on M_m(O) is not an orthogonal sum. THIS REFUTES THE RECORD'S OWN CENTRAL PREDICTION AND IS THE MOST VALUABLE POSSIBLE OUTCOME, because it reopens non-commutative rank enlargement as an escape.
    - Any GENERIC ordinary arm returns e <= 0.45 reproducibly against the null, refuting the universality of the diagnosis with a named witness lattice. A low reading on L1-DEG is NOT such a refutation and must not be reported as one.
    - Measured rho cost on the L1-DEG curves falls materially below p^{1/2} beyond the known constant-factor GLV discount, which would be a genuine anomaly requiring independent review before any framing.
  confounders:
    - Choice of quadratic form. A lattice can look structured or unstructured depending on whether the degree form or the trace form is used; the design reports both wherever both exist, and does not eliminate the hazard.
    - The supersingular arm lives over F_{p^2} and its numbers are NOT prime-field evidence; KN-LIT-002 warns explicitly against borrowing extension-field asymptotics and the same caution applies to borrowing supersingular ones.
    - L1-DEG is a CONDITIONED sample. Hasse-endpoint classes have density roughly p^{-1/4} for |D| < p^{1/2}, so the arm selects them deliberately and its results describe that corner only, never the generic population. Reporting L1-DEG numbers without that conditioning stated would be a scope error of exactly the kind KN-FIND-7e4b90's word "generic" guards against.
    - At small p the class may be tiny, so L3 and L5 have few members and their lambda_1 is a high-variance order statistic over a small class; on the L1-DEG curves the class is small BY CONSTRUCTION, which is the point but also removes L3 and L5 from that arm.
    - Exact SVP at rank 32 with large determinants can blow up; the sweep is capped at the rank where exactness is guaranteed, and any cell falling back to approximate reduction is reported as such and excluded from the fit.
    - The Kani diamond L5 requires a choice of four class members and a product polarization; different choices give different lattices, and the run must sample many choices rather than reporting one.
    - A measured e is about SHORT VECTOR EXISTENCE, not about FINDING one, and not about whether finding one breaks anything. Both distinctions matter against KN-LIT-1022's cited result, which takes a small endomorphism as GIVEN and concerns PATH-FINDING rather than the DLP.
  interpretation_limits:
    - TOY TIER for every measured number. The forced values at L1, L6 and L7 are theory-anchored, but the fitted exponents are scoped to the swept primes and the declared lattices.
    - A null over the panel does NOT establish the characterization. The panel is finite and declared; universality cannot be measured, only refuted. Any writeup that reads the null as confirmation violates the quantifier order stated in proof_search_map.
    - Claim (E) accepts KN-FIND-7e4b90's conclusion and disputes only its diagnosis. Per the coordinator's ruling this is a sharpening, not a contradiction, and the record must never be cited as claiming that Wesolowski's theorem transfers to ordinary prime-field curves. It does not.
    - A LOW e IS NOT A BROKEN DLP. The L1-DEG arm is predicted to return e = 1/3 on small-|D| curves whose ECDLP is nevertheless p^{1/2} up to the constant-factor GLV discount. Any citation of a low e as an attack signal is a misreading the record forbids in advance, and the matched rho control on those curves exists to make the point measurable rather than rhetorical.
    - Claim (F)'s identification of the escape clause with the level set of e = (1/2)*log_p|D| is arithmetic and is a derivation artifact under docs/claims-and-verification.md, never "proved".
    - The Kani/Robert citation is `recalled` and the KN-LIT-1022 citation is `kb` against a corpus record that disclaims verification. Nothing depends on either being exactly right; L5 is measured as a lattice regardless, and KN-LIT-1022 only selects which arm is the headline.
    - This record takes NO position on the analytic (H-PSEUDO) or combinatorial (Betti-Yield) legs of KN-FIND-5c1a03. It audits the algebraic leg only, and says so.
  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. The audit's own runtime is polynomial and irrelevant. The
      exponent it MEASURES is e = log_p(lambda_1), predicted 0.500 for generic ordinary arms,
      (1/2)*log_p|D| on the degenerate arm, and 0.333 for the supersingular contrast arm. If a
      generic arm returned e < 1/2, the exponent implication would still require a separate
      algorithm to FIND the short vector and a further argument that finding it breaks anything --
      and the L1-DEG collision shows that second step is not automatic. The record claims neither.
    memory_exponent: >-
      Memory exponent 0 for the audit itself: exact SVP at ranks <= 32 needs O(polylog) space at
      these determinants. No memory claim about any attack is made.
    best_known: >-
      For prime-field ECDLP the incumbent is Pollard rho at n^{1/2+o(1)} time and O(1) memory,
      with BSGS at n^{1/2} time and n^{1/2} memory, and Shoup's Omega(sqrt n) generic lower bound.
      On small-|D| CM curves the incumbent is the same up to a constant-factor GLV/automorphism
      discount. For the supersingular contrast, the incumbent is Wesolowski's p^{1/3+o(1)} time
      and memory against the previous p^{1/2}*(log p)^{O(1)}. The audit compares the LATTICE
      INVARIANT that separates those worlds, not the algorithms.
    hidden_overhead: >-
      What hides in the o(1) of any hypothetical exponent gain from this direction, and is NOT
      measured here: the cost of finding a short vector once it is known to exist, which for
      rank-8 Kani lattices is not obviously poly; the cost of converting a short Hom element into
      an ECDLP-relevant map, which the L1-DEG collision shows can be infinite in effect since GLV
      converts a short endomorphism into only a constant factor; and the Kani/Robert dimension-8
      isogeny computation constant, which is large. Any of these can absorb an exponent.
    tradeoff_note: >-
      No time-memory tradeoff arises for the audit. On the baseline side the relevant frontier row
      remains van Oorschot-Wiener: wall clock n^{1/2}/m at memory w with total work unchanged,
      which is the row any future exponent claim from this direction would have to beat on TOTAL
      work, not on wall clock.
  dominated_by: >-
    n/a (no result claimed). Frontier rows checked one by one for prime-field ECDLP, n prime,
    generic short-Weierstrass, single instance, classical: (1) Pollard rho, n^{1/2+o(1)} time /
    O(1) memory; (2) BSGS, n^{1/2} / n^{1/2}; (3) vOW parallel rho, n^{1/2}/m wall clock, memory
    w, total work n^{1/2}; (4) kangaroo / Gaudry-Schost / Galbraith-Ruprai -- not applicable, no
    interval; (5) Pohlig-Hellman -- not applicable, n prime; (6) MOV / Frey-Ruck -- not
    applicable, large embedding degree; (7) SSSA anomalous -- not applicable, n != p; (8) GHS /
    Weil descent / Gaudry small-dimension index calculus -- not applicable over a prime field per
    KN-LIT-002; (9) Semaev summation polynomials over F_p -- no proven advantage, not a dominating
    row; (10) preprocessing frontier S*T^2 = N -- not applicable, no advice; (11) Kuhn-Struik
    multi-target sqrt(nL) -- not applicable, single instance; (12) Shor -- out of scope. For the
    L1-DEG small-|D| curves the applicable row is rho with the constant-factor GLV/automorphism
    discount, which the run measures directly. A measured lattice invariant is a point on none of
    these rows, so `n/a` is stated after the check rather than as a default.
  sota_delta: >-
    no attack; measurement contribution only. Quantitatively the deliverable is: the
    (rank, determinant, Minkowski ceiling, exact lambda_1, fitted e with CI) tuple per panel
    lattice per prime over an 8-prime sweep; the joint fit of L1 and L1-DEG against
    (1/2)*log_p|D| across three declared |D| bands, which turns KN-FIND-7e4b90's escape clause
    into a measured level set; the exact integer lambda_1(M_m(O)) - lambda_1(O) for m in {2,3,4}
    over 20 orders, predicted identically 0; the measured gap between ceiling and lambda_1,
    predicted ~0.00 for all ordinary arms and ~0.17 for the supersingular contrast; and matched
    rho cost on the small-|D| curves showing p^{1/2} persists despite e = 1/3. Against the current
    state, in which the algebraic leg of KN-FIND-5c1a03 and the whole of KN-FIND-7e4b90 are
    derivations at proof_status derivation and the obstruction registry is empty program-wide, the
    delta is the difference between a citation and a number -- and by claim (E) that number is one
    an existing line of work already consumes.
  planned_obstruction_record:
    note: >-
      NOT named `obstruction`: no measurement exists yet. This is the block the run would fill,
      stated so the coordinator can hold it to the schema.
    statement: >-
      About the OBJECT, not the attempt: "For generic ordinary E/F_p, every lattice in the
      declared curve-attached panel, under its natural degree or trace form, has shortest vector
      of size p^{1/2+o(1)}, meeting rather than beating its Minkowski ceiling; in particular the
      smallest non-scalar endomorphism has norm p^{1/2+o(1)}. The rank-2 exponent obeys
      e = (1/2)*log_p|D|, so KN-FIND-7e4b90's escape threshold |D| ~ p^{2/3} is the level set
      e = 1/3 and is realised on Hasse-endpoint curves -- where lambda_1 is genuinely small and
      the ECDLP is nevertheless p^{1/2} up to the GLV constant. The non-commutative enlargement
      End(E^m) = M_m(O) lowers nothing, because its trace form is an orthogonal sum of m^2 copies
      of the rank-2 norm form, so rank and determinant grow in exact lockstep."
    quantity: Fitted Minkowski exponent e = log_p(lambda_1) per panel lattice; the gap between e and the Minkowski ceiling; and the fitted coefficient of e against log_p|D| on the rank-2 arms.
    value: TO BE MEASURED; reported per lattice per prime with fit residuals and 99 percent CIs, units = dimensionless exponent in p.
    scope: The declared lattices, the 8-prime sweep from 2^12 to 2^28, ordinary curves with n prime, generic t for L1/L3/L5 and conditioned Hasse-endpoint t for L1-DEG, both natural forms where two exist, and m in {2,3,4}.
    resource_check_plan: >-
      The reversal, run at closure, and it has TWO named consumers rather than a hypothetical one.
      FIRST: KN-LIT-1022 records that a SMALL ENDOMORPHISM enables polynomial-time path-finding
      and endomorphism-ring computation. The L1 arm measures exactly how small the smallest
      endomorphism is, so a measured e = 1/2 is the quantitative statement of why that family does
      not fire for generic ordinary prime-field curves, in a form that line of work can cite --
      and the L1-DEG arm supplies the boundary at which it would. SECOND: KN-FIND-7e4b90 asserts
      its negative with an escape clause about |D| and the class number; this audit measures that
      clause's own quantity and returns it as a level set, upgrading a derivation to a datum on
      the derivation's own stated terms. Thirdly, an exponent that exactly MEETS Minkowski is the
      hypothesis of every argument needing curve-attached lattices to behave like random lattices,
      which a rigorous version of the H-PSEUDO flatness question would consume; and the
      orthogonal-sum identity tells anyone building non-commutative structure on products exactly
      which enlargements are futile. The check may still fail; "examined: true, no theory takes it
      up" is a complete answer.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    That HEUR-3's orthogonal-sum identity holds and M_m(O) buys nothing: 0.9. That L1, L6 return
    their forced 0.500: 0.95. That L1-DEG tracks (1/2)*log_p|D| within 0.03: 0.85, since the law
    is essentially Minkowski plus the class number formula and the risk is in conditioning t
    correctly, not in the mathematics. That the supersingular contrast arm returns near 0.333 and
    the instrument is therefore demonstrably able to see a theorem beating Minkowski: 0.7, the
    main risk being that the p^{1/3} bound is about a specific ideal I may construct incorrectly.
    That matched rho on the L1-DEG curves stays at p^{1/2} up to the GLV constant, confirming the
    second observation collision: 0.9. That the L5 Kani-diamond arm returns e <= 0.45 at generic t
    and refutes universality: 0.10. That any such refutation converts to an algorithm: 0.05
    conditional. Probability the run produces the program's first measured, re-scopable
    obstruction block on two of its own central derivations: 0.85. That number, the low cost, and
    the fact that the cheapest sub-step costs no compute at all, are why this is ranked high.
