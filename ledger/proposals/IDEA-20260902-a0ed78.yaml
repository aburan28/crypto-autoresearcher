      full; ECDLP-IDEA-043 opened in full), and 'PEGASIS|Clapoti|ideal-to-isogeny'
      (33 hits in the SQISIGN / ECTD / bba3dc lanes, not opened). Full reads of
      KN-FIND-61347e, the TASK-20260902-2fb7f8 candidate-mechanisms and
      source-novelty-audit files, IDEA-20260817-f63307, IDEA-20260808-726aa3,
      IDEA-20260829-4b34c5 (first 140 lines), IDEA-20260808-812554 (first 70 lines),
      IDEA-20260812-104e1a (first 80 lines), KN-TECH-3b593f, KN-TECH-06bb4e,
      KN-OPEN-018, KN-OPEN-020, KN-FIND-9d2f56, KN-FIND-c93d45, KN-FIND-5c1a03,
      KN-FIND-7e4b90 and the compiled prior-proposal list; and, after the
      Coordinator's lexical cross-check, a full read of IDEA-20260808-2e14f7.
      External: six WebSearch queries (recorded in the session accounting) and
      WebFetch attempts on eprint.iacr.org (blocked by the archive's redirect),
      hal.science (Anubis challenge page), link.springer.com (login redirect) and
      easychair.org (landing page fetched; PDF fetched but not renderable in this
      container).
    results: >-
      The AMBIENT reading of cover transfer is closed twice in the corpus: as the
      blacklist barrier D3-Gaudry-fixed-genus-over-F-p-IC-cost-barrier (cited by
      IDEA-20260817-f63307, which was withdrawn as its duplicate) and as
      KN-FIND-61347e (2026-09-02). Neither states the reduction lemma (R); both
      explicitly leave the RELATIVE reading open (61347e's F3; f63307's preserved
      successor note asks for the conorm-image arm run here as Stage 3). The
      cover-image factor base with cheap membership is KNOWN in the literature as
      Petit-Kosters-Messeng (KN-LIT-025, abstract-level in the corpus; primary not
      opened by this session either) and as the multiplicative-subgroup base
      (726aa3, 4b34c5), and this record claims neither as new. The rejected
      ECDLP-IDEA-043 (imprimitive-monodromy split-fibre descent) is the nearest prior
      art on monodromy-engineered covers: it proposes AMPLIFYING splitting via a block
      system and names Chebotarev as its likely fatal obstruction; it does not state
      (R), (S) or the tower classification, and it is an attack proposal where this is
      a closure with measurement. IDEA-20260808-2e14f7 is the nearest prior record
      using cover monodromy for a factor-base SIZE statement: its HA-1 applies
      Chebotarev with the Weil error on the Galois closure to a degree-d map OUT of E
      to P^1 and predicts the size of the preimage on E of a window on P^1. It does
      NOT contain the size law for the image on E of a cover INTO E, the fixed-point-
      proportion form, or (S1)-(S2); the same theorem is used in the opposite
      direction for a different quantity (details under discriminated_from, including
      a cross-check in which (S2) bears on its HA-1). No record was found stating
      that F3 reduces to index calculus on E over the image set, or the size law
      with its two consequences. All absences are floors, not novelty.
    verdict: >-
      UNVERIFIED. The reduction lemma and the size law are elementary compositions of
      standard results and are claimed as an ORGANISING closure of F3, not as new
      mathematics. Every external citation is recalled or snippet-depth; no novelty
      label above unverified is available to this record.

