  assumptions:
    - >-
      E ordinary, G of prime order; toy curves exclude anomalous, smooth-order and
      special-j cases per KN-TECH-034.
    - >-
      The covers used in the test are defined over F_p with the fibre polynomial
      computable explicitly; delta_phi is computed from the monodromy group's cycle
      structure, never assumed.
    - >-
      Costs are charged in field operations including membership tests; a yield count
      that omits the membership test cost is a count, not a cost.
    - >-
      Toy scale only: p at most 2^20 for exact enumeration; nothing transfers upward
      except by the stated argument, and the argument is what is being checked.

  proof_search_map:
    bottleneck: >-
      The per-E-relation cost of any relation-sourcing procedure that goes through a
      cover; (R) shows it is bounded below by the cost of an E-relation over F_phi
      produced by the same decompositions, so the bottleneck is the decomposition
      solver over F_phi, i.e. sigma.
    baseline_embedding:
      parameter_slice: >-
        phi = identity (d = 1, g_C = 1, delta = 1): F_phi = E(F_p), the relative index
        calculus is plain Semaev index calculus on E, and (C) reduces to
        IDEA-20260808-812554 unchanged. Second slice: the Kummer cover y^e = x of
        degree e, where F_phi is the base of IDEA-20260808-726aa3 with density 1/e.
      reproduction_check: >-
        Symbolic: substitute d = 1 into (S) to get #F_phi = #E(F_p) exactly; substitute
        the cyclic group Z/e into (S1) to get delta = 1/e. Frozen fixture: at one toy
        p, the Kummer cover's measured #F_phi must equal the direct count of
        e-th-power residues among x-coordinates of E(F_p) to the point.
    observation_collision:
      observable: >-
        The E-relation sum_i n_i phi(c_i) = O produced by a C-relation.
      distinct_preimage_search: >-
        FOUND BY CONSTRUCTION, and it is the content of (R): the pushforward phi_* has
        kernel of order Theta(N^{g_C - 1}) on Pic^0(C)(F_p), so Theta(N^{g_C - 1})
        distinct C-side divisor classes collapse onto one E-relation, and the
        observable cannot see which one it came from. This is a collision that HELPS
        the closure: it is why the ambient structure is invisible on the E side.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the relative index calculus from Pic^0(C) to E by pushforward.
          Encoding: exact. Completeness: exact (every E-relation used is a pushforward
          or a direct E-relation). Soundness: exact. Transfer: the cost obligations
          are membership cost and solver cost over F_phi, stated separately in (M) and
          (C).
        predicted_gain: >-
          Collapses an open forward direction to two named quantities that the corpus
          already prices, at zero compute.
      - transform: observable_fiber
        proposed_object: >-
          Hold the E-relation fixed and vary the C-side preimage (Stage 3): if the
          smoothness rate on the conorm image differs from uniform, the fibre carries
          structure the pushforward is not erasing.
        predicted_gain: >-
          Converts f63307's prose barrier into a measured quantity with a null.
    quantifier_order: >-
      (R): FOR ALL covers phi: C -> E over F_p, FOR ALL relation-sourcing procedures on
      C that output relations among F_p-points of C, the pushed-forward relations are
      relations in E among elements of F_phi. (S): FOR ALL covers, #F_phi is delta_phi
      p up to a Weil-size error. (C): conditional on the cost frame of 812554, FOR ALL
      cover-image bases, the exponent is a function of (beta, m, sigma) alone.
      NOT CLAIMED: that no cover admits sigma < 1 (that quantifies over solvers and is
      the open question); that polylog membership forces a tower (refuted by the
      sibling record's base).
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: 'the relative reading of F3 is index calculus on E over a cover-image
        base; its size obeys (S); its exponent is governed by sigma; on the tested toy
        covers the size law, the mean yield and the conorm smoothness rate matched
        their null predictions within [these] bands'. It can never certify that no
        cover-image base has a sub-exhaustive solver.
      nearby_object_control: >-
        The object where a cover DOES give sub-rho index calculus: E over an extension
        field F_{p^n}, where the Weil restriction is a cover-type construction and
        Gaudry / Diem obtain O~(q^{2-2/n}) via a Frobenius-defined base and a
        Weil-descended algebraic solver (KN-LIT-002 warning, recalled). Under (R) that
        case is ALSO index calculus on E over an image base; what differs is sigma < 1
        supplied by Weil descent. The argument therefore does not prove too much: it
        localises the extension-field gain in the solver axis, where it belongs, and
        predicts nothing for it beyond that.
    proof_obligations:
      - claim: >-
          phi_* is a homomorphism Pic^0(C) -> E sending [c] - [c_0] to
          phi(c) - phi(c_0), for every multiplicity of E in Jac(C).
        responsibility: correctness
      - claim: >-
          The fixed-point proportion of a transitive action of degree d is at least
          1/d with equality iff regular.
        responsibility: size
      - claim: >-
          #F_phi = delta_phi p + O(g sqrt p) with delta_phi computed in the correct
          Frobenius coset when G_arith differs from G_geom.
        responsibility: size
      - claim: >-
          Membership by fibre root-finding costs O~(d) and d >= p^{1-beta} for a base
          of size p^beta.
        responsibility: runtime
      - claim: >-
          The yield and conorm arms use the identical routine on the structured object
          and its null.
        responsibility: interface
      - claim: >-
          The identity and Kummer slices reproduce the incumbent counts exactly.
        responsibility: baseline
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: >-
      Named because the contract asks; NOT this record's lens. The object is the
      cover image F_phi together with the map P -> (number of F_p-rational preimages
      of P under phi), i.e. the fibre-rationality count n_phi(P) in {0, ..., d}.
    lossiness: >-
      Genuinely lossy: n_phi collapses E(F_p) onto d + 1 values and discards
      everything about P except the splitting type of its fibre. It is NOT compatible
      with the group law of E -- n_phi(P + Q) is not determined by n_phi(P) and
      n_phi(Q) -- so it is a coordinate-dependent object in the sense of
      IDEA-20260806-c5d183's trichotomy, exactly as every factor-base predicate is.
      Stating the incompatibility is the honest form of the test here: the object is a
      membership predicate, not a propagating invariant, and the record uses it only
      as a predicate.
    propagation: >-
      None under addition. Under the ISOGENY action the object does propagate:
      composing phi with an isogeny psi: E -> E' of degree coprime to N gives a cover
      of E' with the same monodromy and the same delta, and (S) is invariant; this is
      the one operation under which the object is carried, and it is not used by the
      attack side.
    survival_score: >-
      Survives as a closure for every cover and dies as an attack at the solver axis,
      which is disclosed as the record's own finding.

  null_object_control: >-
    NULL-1 (blocking, yield arm): a uniformly random subset of G of size #F_phi, freshly
    sampled per replicate, run through the identical decomposition-counting routine.
    KN-FIND-007 predicts equal means; equal variances and coverage are the random-model
    prediction and are what a structured base would have to beat.
    NULL-2 (blocking, conorm arm): uniform elements of Jac(C)(F_p) in Mumford form,
    same smoothness routine as the conorm-image sample.
    POSITIVE CONTROL A (blocking, size law): the Galois cover (K) must return
    delta = 1/e within the Weil band, and the non-Galois cover (P) must return the
    wreath-product proportion computed from the cycle index -- a pair with the same
    degree and different delta, showing the instrument distinguishes monodromy types.
    POSITIVE CONTROL B (blocking): the identity slice, phi = id, must return
    #F_phi = #E(F_p) to the point and the plain Semaev yield of KN-FIND-007.
    ARTIFACT TELL: any deviation in (i)-(iii) must shrink with p at the Weil rate
    g sqrt(p) / p; a deviation flat in p is an artifact and is reported as a controlled
    null.

  discriminated_from:
    - >-
      KN-FIND-61347e and DEC-20260902-4c82fd: the AMBIENT reading, closed by order
      inflation. This record closes the RELATIVE reading those records name as open,
      by a different mechanism (pushforward erases the ambient), and it does not
      re-derive the inflation argument.
    - >-
      IDEA-20260817-f63307 (withdrawn) and the D3 blacklist barrier: same ambient
      reading; this record executes its preserved successor arm (Stage 3) inside a
      record that has a mechanism predicting the arm's outcome, which the barrier
      string did not.
    - >-
      IDEA-20260808-2e14f7 (coordinate-degree optimisation), the nearest prior record
      using cover monodromy for a factor-base size statement. OPERATION-LEVEL
      DIFFERENCE: that record's cover is a degree-d map u_D: E -> P^1 OUT of E, its
      factor base is the PREIMAGE on E of a window W in P^1, and its size statement
      (HA-1) is about how many rational points of E lie over B chosen points of P^1.
      This record's cover is a map phi: C -> E INTO E, its factor base is the IMAGE on
      E of the rational points of C, and its size statement (S) is about the
      proportion delta_phi of points of E whose fibre contains a rational point of C,
      expressed through the fixed-point proportion of the monodromy, with the
      consequences (S1) delta_phi >= 1/d (equality iff Galois) and (S2) mean rational
      fibre count = #C(F_p)/#E(F_p). INGREDIENT OVERLAP: yes at the theorem level --
      both cite Chebotarev/Frobenius equidistribution on the Galois closure with the
      Weil error term, and 2e14f7's confounders correctly note that the Galois
      closure, not the cover, carries the monodromy -- and no at the statement level:
      2e14f7 contains neither the image-density form, nor (S1), nor (S2), nor any
      statement about covers into E. CROSS-CHECK THAT THE TWO RECORDS SHARE, stated
      because it may bear on 2e14f7's own prediction: applying (S2) to 2e14f7's map
      u_D gives a mean rational fibre count of #E(F_p)/#P^1(F_p) = 1 + O(1/sqrt p)
      over the points of P^1, so a window of B points of P^1 is predicted to carry
      about B rational points of E in total, not d*B; 2e14f7's HA-1 hedges its d*B
      with "times the rationality factor", and (S2) says that factor is 1/d on
      average, so the two records agree if the hedge is read that way and 2e14f7's
      matched-|V| control already guards against the double count. This is offered as
      a zero-compute consistency check for that record's Stage 1, not as a criticism
      this record depends on; nothing here rests on 2e14f7's outcome and nothing in
      2e14f7 rests on (R).
    - >-
      IDEA-20260808-726aa3 and IDEA-20260829-4b34c5: those own the multiplicative-
      subgroup base and its character-sum yield question. This record identifies that
      base as the depth-one abelian cover (K) and uses it as a positive control; it
      makes no claim about its yield beyond KN-FIND-007's mean.
    - >-
      KN-LIT-025 (Petit-Kosters-Messeng): owns the composed-map base and its Groebner
      analysis. This record identifies it as the small-degree tower (M2) and claims
      nothing about its solver beyond bdca13's split-quotient observation.
    - >-
      ECDLP-IDEA-043 (rejected): proposes engineering imprimitive monodromy to AMPLIFY
      complete splitting for an attack. This record uses monodromy only to STATE the
      size of the image and closes rather than opens; its (S1) is the quantity 043's
      "likely fatal obstruction" gestures at, made a measured number.
    - >-
      IDEA-20260812-104e1a and IDEA-20260808-bba3dc: Kani / higher-dimensional
      toolbox and torsion budgets on the isogeny class. No higher-dimensional isogeny
      is used here; covers enter only through their images on E.
    - >-
      IDEA-20260902-701458 (sibling, this session): a specific closed Bezout-tight
      base with point-counting membership, filed as a KN-OPEN-020 control. This record
      cites it as the reason (M) is a classification and not a closure; the two are
      independently falsifiable.

  predictions:
    - metric: >-
        Y1 -- #F_phi / #E(F_p) minus delta_phi, per cover, per p
      direction: different
      minimum_effect: >-
        Absolute value at most 3 * g_{C-tilde} * sqrt(p) / p at every tested p
        (Weil band, factor 3 pre-registered). A cover exceeding the band at two
        consecutive p values falsifies (S) as stated for that cover, most plausibly
        through a wrong arithmetic-versus-geometric monodromy coset.
    - metric: >-
        Y2 -- ratio of mean exact arity-3 decomposition counts, F_phi over NULL-1
      direction: different
      minimum_effect: >-
        Within 1 plus or minus 3 * sqrt(1 / (200 * lambda)) where lambda is the
        KN-FIND-007 mean; and the variance ratio within the same band. A ratio
        outside the band, reproduced at two p values and absent when F_phi is
        replaced by a second random subset, is a structured-yield lead and is routed
        to independent review before interpretation.
    - metric: >-
        Y3 -- genus-2 smoothness rate on conorm images minus the rate on uniform
        Jacobian elements
      direction: different
      minimum_effect: >-
        Within 3 binomial standard errors of zero at n = 10^4 per arm. A positive
        difference persisting at the next p would mean the E-fibre of the pushforward
        is enriched for smooth representatives, which (R) says cannot help the
        E-relation count but which would be an unexplained structure and a lead.
    - metric: >-
        Y4 -- the identity and Kummer slices (positive controls A, B)
      direction: different
      minimum_effect: >-
        Exact agreement for the identity slice; Weil band for the Kummer slice.
        KNOWN-ANSWER CALIBRATION; a miss voids the run set.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): the written (R), (S), (S1), (S2) with the
      two slices. STAGE 1 (hours): the three covers at p in {2^12, 2^16, 2^20} on
      three prime-order curves each, sizes by exhaustive fibre root-finding.
      STAGE 2 (hours): the yield arm with NULL-1, 200 targets per cell, exact counts.
      STAGE 3 (hours): the conorm arm on cover (B) with NULL-2, 10^4 per arm.
      STAGE 4: controls A and B. STAGE 5: only if any band is exceeded, one larger p.
      No attack is run on any deployed parameter; every instance is toy and
      self-generated.
    controls:
      - NULL-1 random subset of matched size through the identical yield routine (blocking)
      - NULL-2 uniform Jacobian elements through the identical smoothness routine (blocking)
      - POSITIVE CONTROL A Galois versus non-Galois cover at equal degree, delta computed from the cycle index (blocking)
      - POSITIVE CONTROL B identity slice reproduces the full curve and the KN-FIND-007 mean exactly (blocking)
      - membership cost charged per test in field operations and reported beside every count (blocking accounting check)
      - exclusion of anomalous, smooth-order and special-j toy curves per KN-TECH-034
    required_metrics:
      - '#F_phi, delta_phi, g_C, g_{C-tilde} and the Weil band per cover and p'
      - mean, variance and coverage of exact arity-3 counts for F_phi and NULL-1, with bootstrap intervals
      - conorm-image and uniform smoothness rates with binomial intervals
      - per-test membership cost in field operations for each cover
      - pass or fail of controls A and B, and wall-clock and peak memory per stage

  falsification_conditions:
    - >-
      G1. Stage 0 finds that phi_* is not well defined as stated when E has
      multiplicity greater than one in Jac(C), or that the Frobenius-coset form of
      (S) is misstated. The record is superseded, not amended.
    - >-
      G2. Y1 exceeds the Weil band for a cover at two consecutive p: (S) is wrong for
      that cover class; the closure loses its size law and must be re-derived.
    - >-
      G3. Y2 outside its band, reproduced, absent under a second random subset:
      a cover-image base with structured yield exists at toy scale. This is the
      lead outcome; it contradicts the random model behind (C) and reopens F3 with a
      witness. It would still be no attack until a solver and a charged cost table
      exist.
    - >-
      G4. Y3 positive and persistent: the conorm fibre is enriched for smoothness.
      (R) still holds, but the mechanism "the ambient is invisible" is incomplete and
      the record's forward guidance must be rewritten around the enrichment.
    - >-
      G5. All bands met (the predicted outcome): F3 is closed at the exponent level
      with a mechanism, and the honest headline is 'relative index calculus is index
      calculus on E over an image base; the open question is the solver'.
    - >-
      G6. A control fails: the run set is void and nothing is reported.
    - >-
      G7. Budget exhaustion: infrastructure outcome under AGENTS.md rule 5, never
      evidence about (R), (S) or (C).

  confounders:
    - >-
      Arithmetic-versus-geometric monodromy: for a cover whose geometric monodromy
      is a proper subgroup of the arithmetic one, delta must be computed in the
      Frobenius coset; using the whole group gives a wrong prediction that looks like
      a falsification of (S). Stage 0 names this and Stage 1 computes both.
    - >-
      Ramified points: fibres over branch points have fewer than d geometric points;
      at toy p the branch locus is a non-negligible fraction and must be counted
      separately, not absorbed into the error term.
    - >-
      Cofactor: if G has index 2 in E(F_p), F_phi intersected with G is what the yield
      arm must use; (S) is stated for E(F_p) and the restriction is charged as a
      factor of about 1/2, not ignored.
    - >-
      Toy-size Weil band: g sqrt(p) / p is not small at p = 2^12 for the genus-2 Galois
      closure of cover (P) (genus up to about 9), so Y1 is informative mainly at
      2^16 and 2^20; the 2^12 cell is a smoke test.
    - >-
      The yield arm's membership tests on the closing point dominate its cost for
      cover (P) and (B); reporting counts without that cost would overstate the base.

  interpretation_limits:
    - >-
      (R) is a statement about what a cover can contribute to relation collection on
      E; it is not a lower bound on the ECDLP and must never be cited as one.
    - >-
      (M) classifies KNOWN cheap-membership instances; it is not a theorem that others
      do not exist, and the sibling record exhibits one outside the two families.
    - >-
      (C) is conditional on the cost frame of IDEA-20260808-812554 (partially read)
      and, for its sigma = 1 clause, on IDEA-20260829-bdca13's split-quotient
      observation, which is a RECALLED pointer in this record (not opened); until a
      successor opens bdca13, the sigma = 1 clause is a prediction that the sibling
      record's Stage 4 measures, not an input.
    - >-
      Toy tier throughout; every number is scoped to the tested covers, curves, sizes
      and routines. No transfer to cryptographic p is licensed by the measurement; the
      argument, not the data, is what is claimed to transfer.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For the tested covers, the F_p-rational fibre-splitting events over points of
        E(F_p) are distributed as the Chebotarev prediction: the proportion of points
        whose Frobenius lies in a conjugacy class K of the monodromy group equals
        |K| / |G| up to an error of order g sqrt(p) / p, uniformly over the classes,
        already at p in {2^16, 2^20}.
      rigorous_support: >-
        RIGOROUS BOUND: the Chebotarev density theorem for function fields with Weil's
        Riemann-hypothesis error term (Murty-Scherk effective form, recalled). CLASSICAL
        DISTRIBUTION IMITATED: Frobenius elements equidistributed over conjugacy classes
        with Haar weight, the same statement whose number-field analogue is
        Chebotarev's theorem. The heuristic content is only that the toy sizes are
        inside the asymptotic regime; the bound itself is unconditional.
      validation_plan: >-
        SAMPLE: all points of E(F_p) for the three covers at p in {2^12, 2^16, 2^20}
        on three curves each (about 10^4 to 10^6 points per cell); no shortcut is
        needed at these sizes. COMPARISON DISTRIBUTION: the cycle-index prediction of
        per-class proportions against the observed splitting-type histogram, with a
        chi-square statistic. TAIL CHECK: the largest per-class deviation against the
        Weil band 3 g sqrt(p) / p, and its decay from 2^16 to 2^20 at the predicted
        rate p^{-1/2}. SAMPLED PARAMETERS RECORDED: p, curve, cover, d, g_C,
        g_{C-tilde}, monodromy group, seed. TRANSFER ASSUMPTION: none needed for the
        closure, which rests on the theorem; the toy data checks the instrument.
    - id: H2
      statement: >-
        For a cover-image base F_phi of size B, the number of arity-3 decompositions
        of a uniform target is distributed as for a uniformly random subset of G of
        size B: mean C(B + 2, 3) / N (KN-FIND-007), variance of the same order, and
        Poisson-type tails, uniformly for B between p^{1/4} and p^{1/2}.
      rigorous_support: >-
        RIGOROUS BOUND: the exact mean identity of KN-FIND-007 (internal; holds for
        every subset). CLASSICAL DISTRIBUTION IMITATED: the representation-count
        distribution of a random subset of a cyclic group, which is asymptotically
        Poisson with the stated mean (the standard random-model heuristic behind every
        yield count in this corpus). The assumption is exactly that F_phi has no
        additive structure in the discrete-log coordinate beyond a random set, which
        is the DL-circular quantity of KN-FIND-c93d45 and is what NULL-1 measures.
      validation_plan: >-
        SAMPLE: 200 uniform targets per (cover, p) cell with exact counts, and the
        same for NULL-1 with fresh random subsets per replicate, at p in
        {2^16, 2^20}. COMPARISON DISTRIBUTION: the empirical count histogram against
        Poisson with the KN-FIND-007 mean, and against NULL-1's histogram, by a
        two-sample test. TAIL CHECK: the maximum per-target count for F_phi against
        the maximum over an equal number of NULL-1 replicates (the extreme-value
        control of IDEA-20260805-c4f675, applied to counts rather than to character
        sums). DECAY PARAMETER: p, at fixed beta. SAMPLED PARAMETERS RECORDED: p,
        curve, cover, B, m = 3, seeds, membership cost.

  target_complexity:
    time_exponent: >-
      NO ATTACK IS CLAIMED. The record bounds the F3 family: by (R) and (C) its time
      exponent equals that of prime-field index calculus on E over an image base,
      2 / (2 + (m-1)(1 - sigma)) at the balance point of IDEA-20260808-812554, which
      is 1 at sigma = 1 (the value bdca13 gives for split membership quotients) and
      below 1/2 only if sigma < 1 - 2/(m-1). Nothing below N^{1/2} is claimed.
      LEMMA DECOMPOSITION for the bound: (R) correctness of the pushforward; (S) size
      bound; (M) membership runtime; (C) assembly through 812554.
    memory_exponent: >-
      That of the underlying index calculus: B = N^beta for the base and relation
      matrix, beta < 1/4 in the admissible region, so at most 1/4; membership tests
      add O(d) working memory for fibre root-finding, i.e. N^{1 - beta} for a generic
      cover, which is a second reason generic covers are inadmissible.
    best_known: >-
      Parallel Pollard rho with distinguished points and negation, 0.886 sqrt(N)
      group operations, O(1) memory per processor (KN-TECH-006); BSGS 2 sqrt(N) time
      and sqrt(N) memory; kangaroo on an interval promise; automorphism-discounted rho
      (KN-TECH-018); Pohlig-Hellman (KN-TECH-030); generic preprocessing at
      S T^2 = N.
    hidden_overhead: >-
      The O~ in the membership cost hides fast root-finding polylog factors; the Weil
      error constant depends on d; the m! of the sigma-threshold is charged, not
      absorbed. Nothing superpolynomial is hidden because nothing is claimed.
    tradeoff_note: >-
      No tradeoff is proposed. The closure holds at the family's own time-optimal
      parameterisation; a memory-for-time exchange inside index calculus does not
      move sigma.

  dominated_by: >-
    n/a (no result claimed). ROWS CHECKED before writing that: (1) parallel rho with
    negation, 0.886 sqrt(N), O(1) memory per processor -- dominates the F3 family on
    time and memory at sigma = 1; (2) BSGS, 2 sqrt(N) time, sqrt(N) memory --
    dominates on time; (3) kangaroo -- not comparable, interval promise; (4)
    automorphism-discounted rho -- dominates by up to sqrt(6); (5) Pohlig-Hellman --
    not comparable, fixes N; (6) generic preprocessing S T^2 = N -- dominates on
    online time, dominated on advice; not applicable to a relation-collection
    family. Data and query axis: no oracle queries; the measurement issues no solves
    beyond toy calibration. As a STRUCTURAL contribution the nearest incumbent is
    KN-FIND-61347e itself, which dominates on the ambient reading and is dominated
    here on the relative reading it left open.
  sota_delta: >-
    +0 on time, memory and queries. Quantified deltas actually claimed: (i) a
    two-line reduction closing the relative reading of F3 at zero compute; (ii) a size
    law with two consequences, the second of which (d >= p^{1-beta}) prices generic
    covers out of admissibility on membership cost alone at O~(p^{1-beta}) per test;
    (iii) a three-arm toy measurement with two nulls and two positive controls at an
    estimated few CPU-hours; (iv) for the F3 family, a NEGATIVE delta: at sigma = 1
    its exponent is 1 against rho's 1/2, i.e. a loss of N^{1/2}, about 2^{128} at
    256-bit N. If G3 fired the delta would be a structured-yield witness, which is
    not itself an exponent.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.9 that (R) survives review as stated (residual: the multiplicity and
    normalisation bookkeeping). 0.85 that (S) is confirmed within the Weil band on all
    three covers at 2^16 and 2^20 (residual: the arithmetic-geometric monodromy coset
    for cover (P)). 0.95 that Y2 and Y3 sit inside their bands. OUTCOME split: 0.80
    G5 (closure with mechanism), 0.10 instrument or control failure, 0.07 G2
    (a bookkeeping error in (S) for one cover), 0.03 G3 or G4 (a lead). Priority
    MEDIUM rather than low because it retires, cheaply and with a mechanism, the one
    forward direction the previous round explicitly could not specify, and because
    Stage 3 discharges a successor obligation the corpus has carried since
    2026-08-17.

