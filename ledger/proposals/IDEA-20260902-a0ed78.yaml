idea:
  id: IDEA-20260902-a0ed78
  question_id: RQ-ECDLP-002
  added: '2026-09-02'
  title: >-
    F3 HAS NO OBJECT OF ITS OWN: the E-component of any relation sourced on a cover
    C -> E is an ordinary arity-k relation on E among points of the COVER IMAGE
    F_phi = phi(C(F_p)), the ambient Picard group never enters, so the
    "factor-restricted / relative index calculus" that KN-FIND-61347e leaves open is
    index calculus on E over an image factor base -- whose size is
    delta_phi * p + O(g * sqrt(p)) with delta_phi the fixed-point proportion of the
    arithmetic monodromy (at least 1/deg phi, with equality exactly for Galois covers),
    whose two cheap-membership instances in the literature (Kummer / multiplicative
    subgroup; Petit-Kosters-Messeng composed maps) are exactly the towers of
    power-residue and small-degree steps, and whose exponent is therefore governed by the
    program's own sigma-threshold; the toy test is the size law, the mean-yield
    conservation against a random null, and the conorm-image smoothness arm that the
    withdrawn IDEA-20260817-f63307 asked for
  class: control

  claim: >-
    Setting: E/F_p ordinary, G = E(F_p) of prime order N (or the prime-order subgroup;
    nothing below depends on the cofactor beyond one factor of 2). A COVER is a
    nonconstant F_p-morphism phi: C -> E from a smooth projective geometrically
    irreducible curve C/F_p of genus g_C, of degree d = deg phi. By the Albanese /
    Poincare reducibility property of Jacobians, E is an F_p-isogeny factor of Jac(C)
    if and only if such a phi exists, so the embeddings that KN-FIND-61347e closes on
    the AMBIENT reading are exactly covers, and the forward direction F3 of that
    finding ("a factor-restricted or relative index calculus whose cost scales with the
    embedded factor's own size N") is a statement about what a cover can do for
    relation collection on E. Four statements, R, S, M, C, of decreasing
    unconditionality, followed by the measurement.

    (R) THE REDUCTION LEMMA (elementary, unconditional). Let phi_*: Pic^0(C) -> E be
    the pushforward (Albanese map composed with the projection to the E-factor,
    normalised so that phi_*([c] - [c_0]) = phi(c) - phi(c_0) for points c of C). Any
    relation among F_p-points of C in Pic^0(C), i.e. any principal divisor
    div(h) = sum_i n_i c_i with c_i in C(F_p), pushes forward to the relation
    sum_i n_i phi(c_i) = O in E, whose terms lie in the finite set
    F_phi := phi(C(F_p)) contained in E(F_p). Conversely, an index calculus that solves
    log_P(Q) on the E-factor consumes ONLY E-relations: every relation it feeds to its
    linear algebra is, after pushforward, a relation in E among elements of F_phi
    (plus P and Q). Hence the relative reading of F3 IS prime-field index calculus on E
    with factor base contained in F_phi. The ambient group order #Jac(C)(F_p) = N times
    Theta(N^{g_C - 1}) (KN-FIND-61347e) enters neither the count nor the meaning of the
    E-relations; the "order inflation" that closes the ambient reading is simply absent
    from the relative reading, in BOTH directions -- the cover neither inflates nor
    deflates the E-side bookkeeping. What a cover can contribute is exactly two things:
    a MEMBERSHIP DEVICE for the set F_phi, and possibly a DECOMPOSITION SOLVER for
    targets over F_phi. Nothing else survives the pushforward.

    (S) THE SIZE LAW (Chebotarev over function fields; the error term is Weil's).
    Let C-tilde -> E be the Galois closure of phi with group G_arith (arithmetic
    monodromy) acting on the d points of a generic fibre, and let delta_phi be the
    proportion of elements of G_arith (in the appropriate Frobenius coset; for a
    geometrically Galois-closed cover with G_arith = G_geom this is the whole group) that
    have at least one fixed point in that permutation representation. Then
        #F_phi = delta_phi * #E(F_p) + O(g_{C-tilde} * sqrt(p)),
    the O-constant depending only on d. Two elementary consequences: (S1) delta_phi is
    at least 1/d, because the elements with a fixed point contain a point stabiliser,
    which has index d; equality holds if and only if the action is regular, i.e. the
    cover is Galois; so a cover-image base of size p^beta REQUIRES d >= p^{1 - beta}.
    (S2) The mean number of F_p-rational preimages of a point of E is
    #C(F_p) / #E(F_p) = 1 + O(g_C / sqrt(p)), an identity, so a small image is
    compensated exactly by fibres that are full when they are non-empty: a Galois cover
    of degree d has every fibre either empty or fully rational, up to ramification.

    (M) THE MEMBERSHIP-COST CLASSIFICATION (a statement about known algorithms, NOT a
    theorem). For a general cover of degree d, deciding "phi^{-1}(P) has an F_p-point"
    is root-finding of a degree-d polynomial: O~(d) field operations, i.e.
    O~(p^{1 - beta}) per test by (S1), which at beta < 1/2 exceeds the per-target work
    the sigma-threshold can afford, so such bases are useless independently of any yield
    question. The cover-image bases with polylog membership known to this session are
    exactly two families, and both are TOWERS: (M1) abelian steps -- a Kummer step
    y^e = f, tested by one power-residue exponentiation f(P)^{(p-1)/e}; the depth-one
    case with f = x is the multiplicative-subgroup base of IDEA-20260808-726aa3 and
    IDEA-20260829-4b34c5; (M2) small-degree steps -- x(P) = f_1(f_2(...f_k(t))) with
    deg f_i bounded, tested by k successive small root-findings; this is the
    Petit-Kosters-Messeng construction (KN-LIT-025, PKC 2016). This record does NOT
    claim that polylog membership forces an abelian or small-degree tower: the sibling
    record IDEA-20260902-701458 exhibits a closed Bezout-tight base with polylog
    membership by point counting whose Galois structure is a class-group action, and its
    existence is the reason (M) is filed as a classification of known instances and not
    as a closure.

    (C) THE EXPONENT CASCADE (conditional on the program's own cost frame). By (R), F3's
    cost is the cost of prime-field index calculus on E over F_phi, so
    IDEA-20260808-812554 applies verbatim: with a solver exponent sigma (cost
    B^{(m-1) sigma} to find all m-decompositions of one target), relation collection
    costs m! * N * B^{(m-1)(sigma - 1)}, and beating rho requires
    sigma < 1 - 2/(m-1) together with beta < 1/4. For the Kummer family the membership
    polynomial x^B - 1 splits completely over F_p, and for the PKM family the
    membership predicate is a composition of split small-degree maps; in both cases
    IDEA-20260829-bdca13's Chinese-remainder argument (a RECALLED pointer in this
    record, not opened) says a Groebner solver over the split membership quotient is
    exhaustive, sigma = 1. So F3 changes an exponent if and only if some cover-image
    base admits a sub-exhaustive solver, which is the SAME open question every
    prime-field index-calculus record in this corpus already faces. That is the
    closure: named obstruction = the reduction lemma (R) plus the sigma-threshold;
    mechanism = pushforward erases the ambient structure; forward guidance = a solver
    on cover-image bases, or a non-tower cover with polylog membership, neither of
    which is claimed impossible.

    THE MEASUREMENT, stated so that both answers are results. On explicit toy covers
    (a Kummer cover, a PKM two-step composed cover, and a bielliptic genus-2 double
    cover), measure (i) #F_phi against delta_phi * p with the Weil-size error, (ii) the
    exact arity-3 decomposition counts of random targets over F_phi against a uniformly
    random subset of E(F_p) of the same size, and (iii) for the genus-2 cover, the
    smoothness rate of uniform elements of Jac(C)(F_p) against that of conorm images
    phi^*(E(F_p)). Prediction from (R), (S) and KN-FIND-007: (i) matches within the
    error band, (ii) the two mean yields agree within Poisson error, (iii) the two rates
    agree within binomial error. Any of the three failing is a lead, and each failure
    has a distinct meaning stated under falsification_conditions.

  mechanism: >-
    INGREDIENT-FIRST, as this lane's contract requires: the external ingredients are the
    Albanese / Poincare characterisation of isogeny factors by covers, the
    Chebotarev density theorem for function fields with Weil's error term, and the
    union-of-conjugates bound on fixed-point proportions of transitive groups; the
    generic conversion is a REDUCTION (pushforward), not a splitting or a claw. The
    tracked object is named under object_first_candidate because the contract asks for
    it, but it is not this record's lens.

    STAGE 0 (zero compute, HARD GATE). Write (R) with the normalisation of phi_* stated,
    including the case where E appears in Jac(C) with multiplicity greater than one
    (then phi_* is one of several projections and the lemma holds for each). Write (S)
    with the arithmetic-versus-geometric monodromy distinction made explicit: for a
    non-geometrically-Galois-closed cover delta_phi is the fixed-point proportion in the
    Frobenius coset of G_geom inside G_arith, not in G_arith itself. Write the two
    consequences (S1), (S2). Check (R) against the object where it must reduce to the
    incumbent: phi = identity or an isogeny of degree coprime to N, where F_phi =
    E(F_p) and the "relative index calculus" is plain Semaev index calculus; and
    against the Kummer cover of degree d, where F_phi is exactly the base of
    IDEA-20260808-726aa3 and delta_phi = 1/d.

    STAGE 1 (instrument, hours). In Sage or PARI, for toy primes p in
    {2^12 .. 2^20} and ordinary curves of prime order chosen per KN-TECH-034 exclusions:
    build three covers with their fibre polynomials -- (K) the Kummer cover
    y^e = x(P) of degree e | p - 1; (P) the composed cover x(P) = f_1(f_2(t)) with
    deg f_1 = deg f_2 = 2, fibre polynomial f_1(f_2(t)) - x(P) of degree 4, monodromy
    the wreath product S_2 wr S_2 whose fixed-point proportion is computed from its
    cycle index, not assumed; (B) a bielliptic genus-2 curve C: y^2 = sextic with an
    involution, with its degree-2 quotient map to E, delta = 1/2. For each cover
    compute #F_phi by direct fibre root-finding over all of E(F_p) and record
    delta_phi, g_C and the Weil-size bound.

    STAGE 2 (yield arm, hours). Choose parameters so that #F_phi is about p^{1/3}
    for each cover. For 200 uniformly random targets R in G, count EXACTLY the arity-3
    decompositions R = P_1 + P_2 + P_3 with P_i in F_phi by enumeration of pairs and a
    membership test on the closing point (the same routine used by the corpus's
    windowed counts). Run the IDENTICAL routine on a uniformly random subset of G of the
    same size, freshly sampled per replicate. Report both means, both variances, and
    coverage (fraction of targets with at least one decomposition).

    STAGE 3 (conorm arm, for cover (B) only, hours). Sample 10^4 uniform elements of
    Jac(C)(F_p) in Mumford representation and 10^4 elements of the conorm image
    phi^*(E(F_p)) (pullback of random points of E, reduced). For each, test genus-2
    smoothness: whether the reduced divisor is a sum of two F_p-rational points (the
    Mumford u-polynomial splits over F_p). Report the two rates with binomial intervals.
    This is item (ii) of IDEA-20260817-f63307's preserved successor note, run here
    because the reduction lemma predicts its outcome and a deviation would be the one
    way the ambient reading could feed the relative one.

    STAGE 4 (controls, see null_object_control). STAGE 5 (decay and artifact check):
    any deviation must be re-run at the next larger p and must not persist if it is an
    artifact; a deviation flat in p is the canonical artifact tell of
    docs/inventor-protocol.md section 3.

