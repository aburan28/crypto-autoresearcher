idea:
  id: IDEA-20261007-6c7d84
  question_id: RQ-ECDLP-623a32
  added: '2026-10-07'
  status: proposed
  approved_by: null
  title: >-
    Fraction of affine points with integer x greater than integer y
    on y^2 = x^3 + 5x + 2 over F_47
  class: measurement
  claim: >-
    On the nonsingular curve E: y^2 = x^3 + 5x + 2 over F_47, let A
    be the affine points, with x and y the representatives in
    {0, 1, ..., 46}. The fraction of points of A with x > y differs
    from 1/2 by at most 0.1. This is an R1 comparison of the integer
    lifts of the two coordinates. It is not a digit-sum filter, not
    a modular bucket of x, and not a slope.
  mechanism: >-
    OBJECT FRAME. The representation is the pair of integer lifts
    (x, y) in {0, ..., 46}^2. Sigma is the singleton {[2]}.
    TRICHOTOMY. Coordinate-dependent: the comparison x > y uses the
    chosen representatives, and negation sends y to 47 - y when
    y ≠ 0, which changes the comparison. LOSSY-PROJECTION TEST. The
    projection that keeps only the bit x > y has two values. |A| is
    larger than 2 by the Hasse window, so the bit is lossy. The bit
    of 2P is not a function of the bit of P, because doubling mixes
    the coordinates. The priced number is the fraction, not a stage
    cost. Families F1–F7 are not the lens.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-623a32
      provenance: internal
      claim: >-
        R1 includes the integer representatives of the coordinates.
        This proposal prices one comparison of those representatives.
      verified_by: ledger/questions/RQ-ECDLP-623a32.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A sub-square-root algorithm must exploit the representation.
        This proposal does not claim to go under the bound.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KR-RHO-0528e7
      provenance: internal
      claim: >-
        An automorphism of order m multiplies rho iterations by
        1/sqrt(m) and leaves the exponent 1/2 unchanged. This curve
        is not treated as a j = 0 or j = 1728 quotient.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-0528e7.yaml
  assumptions:
    - >-
      4·5^3 + 27·2^2 = 608 ≡ 44 (mod 47), so the discriminant is
      nonzero and E is nonsingular.
    - Representatives are the integers in {0, 1, ..., 46}, not a balanced residue system.
    - The curve y^2 = x^3 + x + 1 is not used.
  predictions:
    - metric: >-
        Absolute difference between the fraction of affine points
        with integer x > integer y and 1/2.
      direction: lower
      minimum_effect: '<= 0.1'
  minimal_test: >-
    Enumerate the affine points of E(F_47). Count how many have
    integer x > integer y. Report the absolute difference from 1/2.
    A second enumeration must agree. A null of 200 independent pairs
    drawn uniformly from {0, ..., 46}^2 must have its own fraction
    within 0.15 of 1/2, or the comparator is void. The negation check
    y mapped to 47 - y, for y ≠ 0, must flip at least one comparison
    on this curve, or the representative convention is void.
  controls:
    - two enumerations agree on the fraction
    - 200 random pairs in {0, ..., 46}^2 lie within 0.15 of 1/2
    - negation flips at least one comparison
    - y^2 = x^3 + x + 1 is not used
  falsification_conditions:
    - >-
      The absolute difference from 1/2 is strictly above 0.25, the
      two enumerations agree, the random-pair null is within 0.15 of
      1/2, and negation flips at least one comparison.
    - >-
      The random-pair null is more than 0.15 from 1/2, or negation
      flips no comparison. The comparator is then void, and the
      curve fraction is not evidence.
  confounders:
    - >-
      A balanced representative in {-23, ..., 23} is a different
      chart. Mixing the two systems voids the count.
    - >-
      The point at infinity has no affine (x, y). It is not in A.
  interpretation_limits:
    - >-
      A difference of at most 0.1 does not change the rho exponent
      1/2 and is not a sum-compatible homomorphism.
    - >-
      A difference above 0.25 falsifies this claim on this one curve
      only and is not yet an algorithm.
    - >-
      This is not a base-3 digit sum, not the largest bucket of x
      modulo floor(p^{1/3}), and not a tangent slope.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For the integer lifts on this curve, the bit x > y equals 1
        on a fraction within 0.1 of 1/2. A uniform random pair in
        {0, ..., 46}^2 has P(x > y) = (1 - 1/47)/2, which is within
        0.02 of 1/2. H1 says the curve points meet the wider 0.1 band.
      rigorous_support: >-
        The random-pair probability is a count of ordered pairs, not
        a theorem about E(F_47). Transfer from a uniform pair to a
        point of E is the heuristic.
      validation_plan: >-
        Compute the curve fraction and the 200-pair null. H1 fails
        if the curve differs from 1/2 by more than 0.25 while the
        null stays within 0.15 and negation flips at least one
        comparison. Sample size is all of A, plus 200 null pairs.
  target_complexity:
    time_exponent: >-
      Unchanged at 1/2. A comparison fraction is not an exponent.
    memory_exponent: >-
      Unchanged. The census stores O(p) integers at p = 47.
    best_known: >-
      KR-RHO-13bf67, Omega(N^{1/2}) generic-group operations. The
      file was opened for this proposal. KR-RHO-0528e7 keeps the
      exponent 1/2 when an automorphism is present; none is claimed
      here.
    hidden_overhead: >-
      No new o(1) cofactor is claimed.
    tradeoff_note: >-
      No time-memory tradeoff. The census is a single pass.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-13bf67
      - KR-RHO-0528e7
      - KR-RHO-fb88e6
      - KR-RHO-6239aa
    nearest:
      - ref: KR-RHO-13bf67
        provenance: internal
        verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
        relation: adjacent
        delta: >-
          The row bounds generic algorithms by N^{1/2}. This proposal
          measures one comparison of integer lifts. The exponent stays
          1/2. The gap is a deviation of at most 0.1 against a
          deviation above 0.25.
      - ref: KR-RHO-fb88e6
        provenance: internal
        verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-fb88e6.yaml
        relation: adjacent
        delta: >-
          Negation replaces y by p - y and can flip the comparison
          x > y. The claim uses that flip as an instrument check and
          claims no square-root-of-two iteration factor.
      - ref: KR-RHO-6239aa
        provenance: internal
        verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-6239aa.yaml
        relation: orthogonal
        delta: >-
          The row prices parallel rho with distinguished points. This
          proposal measures a comparison of integer lifts. It stores
          no distinguished points and claims no collision search.
  dominated_by: >-
    KR-RHO-13bf67 dominates a generic algorithm. No opened row states
    the fraction of affine points with integer x > integer y on this
    curve. The proposal prices that fraction and does not claim a
    faster discrete logarithm.
  sota_delta: >-
    Zero change to the exponent 1/2. The measured deviation from 1/2
    is claimed at most 0.1, against a failure strictly above 0.25.
