  title: Arity axis of bounded-degree refutation - does D_W(m,n,k) of UNSAT descended decompositions stay 4 for m=3..5/6?
  class: measurement
  claim: >-
    Conditional, exponent-relevant. At prime n<=13, enumeration-certified UNSAT chained-S_3 systems (t=m, Semaev
    eq.(5)) have D_W=min{D: 1 in W_D}=4 on >=90% of instances at each cell m in {3,4,5} (6 if reachable), for
    V={deg<k} and random V; support-matched null likewise, dense null not; log2(ops to refute) is linear in
    log2 N, N=(m-2)n+mk, not in l. Direct S_{m+1} (builder: m=3 only) is expected to need D_W>=6. R1 with Weil
    restriction (R3); stage: per-attempt solve. No attack; F2 is the setting.
  mechanism: >-
    PAIR (R1 Boolean coordinates of x_i in V and chain nodes u_j; Sigma = {multiply by a variable inside B_<=D,
    F_2-combine, re-echelon} = W_D, plus chain extension m->m+1), not translation. Trichotomy: coordinate-dependent
    (depends on the SET V and presentation, not a basis); index calculus stays Class I. Lossy test: I -> D_W(I)
    keeps one integer; Sigma-compatible (monotone least fixpoint, GL_N(F_2)-invariant); lossy. NEW AT m>=4: middle
    blocks S_3(u_{j-1},x,u_j) multiply two chain nodes, so the pilot mechanism (u affine) cannot carry; the
    support null tests this. M_4 rows/cols fall 0.43->0.06 with m: degree 4 never generic by counting. Only
    full-symbolic bounded D gives alpha<m/2-1; enumerating m-2 legs (IDEA-20260930-b26bbc) costs 2^((m-2)l),
    and m-2>m/2-1 for m>2.
