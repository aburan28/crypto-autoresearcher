idea:
  id: IDEA-20260904-a195ff
  question_id: RQ-ECDLP-002
  added: '2026-09-04'
  title: >-
    EVERY DEGREE-BASED NEGATIVE IN THIS CAMPAIGN IS AN UNCALIBRATED NULL: the
    program's prime-field solving-degree instrument has never been run on a
    parameter family where the answer is published and the structure demonstrably
    lowers the degree, so run it on the binary-field point-decomposition systems
    whose first-fall degrees are in the literature, against a null summation
    polynomial of identical support and a semi-regular analytic reference, and
    report whether the instrument can see the effect it is being used to rule out
  class: control

  claim: >-
    (A) THE EXACT CLAIM, AND IT IS ABOUT THE INSTRUMENT. This campaign's
    index-calculus negatives -- BKK Newton saturation at m <= 5, the
    solving-degree and first-fall measurements of the DREG and SIG clusters, the
    yield measurements behind H-PSEUDO -- are all NULLS produced by one family of
    toy-scale algebraic instruments. NO RECORD IN THIS CORPUS SHOWS THAT THOSE
    INSTRUMENTS FIRE ON A KNOWN POSITIVE. The claim under test is: at the
    parameter sizes this program can reach, the measured Gröbner solving degree
    and first-fall degree of a point-decomposition system SEPARATE a family where
    the summation structure is known to lower the degree below the generic
    prediction from a null system of identical support in which it cannot. If
    they separate, every prime-field null in the lane acquires the force its
    records currently assert. If they do not, those nulls are uncalibrated at the
    tested scale and their scope must be narrowed to say so.

    (B) WHY THIS IS NOT BOOKKEEPING. KN-OPEN-002 states that the low
    degree-of-regularity heuristic and the first-fall proxy are studied mostly
    over BINARY fields (KN-LIT-005, KN-LIT-010) and that whether first-fall
    tracks the true degree of regularity, and how both scale, is not settled over
    prime fields. That is a statement that the instrument's behaviour is known on
    one field family and unknown on the other -- which makes the binary family a
    KNOWN-ANSWER TEST for the instrument itself, and one this program has never
    run because it keeps prime-field and extension-field claims strictly
    separated (KN-LIT-025). The separation is right for CLAIMS and wrong for
    CONTROLS: a null object tells you a signal is an artifact, and a known
    positive tells you the absence of a signal is a fact rather than a blind
    instrument. This campaign has the former everywhere and the latter nowhere.

    (C) THE EXPONENT AT STAKE, STATED PLAINLY AND WITHOUT DRESSING. This record
    proposes NO algorithm and its own sota_delta is +0. Its best possible outcome
    is not an exponent improvement and it must not be ranked as though it were.
    What it adjudicates is whether the lane's exponent arithmetic is being
    settled by measurements that can see. In that arithmetic, with a factor base
    of size B = N^{1/m} the relation-collection cost is B * (cost of one
    decomposition) and the sparse linear algebra is Õ(B^2) = Õ(N^{2/m}); the
    whole question of whether any m puts the total below rho's N^{1/2} reduces to
    the growth of the decomposition cost, which is governed by the solving
    degree. The corpus calls that the lane's single live unbounded quantity. An
    instrument that cannot resolve a known degree drop cannot bound it.

    (D) A PRIOR-ART ITEM THAT MUST BE DISCHARGED BEFORE THE RUN, RECORDED HERE
    BECAUSE IT MAY CHANGE THE DESIGN. This corpus already holds KN-LIT-4558
    (Yokoyama, Yasuda, Takahashi, Kogure, J. Math. Cryptol. 14 (2020) 460-485),
    whose relayed abstract states that the ideal derived from the point
    decomposition problem has a special structure, that Gröbner basis computation
    for it is an extension of the extended Euclidean algorithm, that this yields
    a LOWER BOUND on the cost of that computation, and that with the lower bound
    they prove Semaev's naive index calculus method cannot be more efficient than
    generic methods. KN-OPEN-002 does not cite it. That entry's own frontmatter
    records that it was generated in a bulk seeding pass from the PDF's first two
    pages and should be upgraded after a careful read, so its content is a
    pointer and not yet a result. THE CONTRACT FOR THIS EXPERIMENT MUST, BEFORE
    ANY RUN, extract the exact statement, hypotheses and parameter regime of that
    lower bound from the local copy and pre-register it as a predicted curve in
    the prime-field arm. If it can be extracted, the arm becomes a two-sided
    known-answer test and this record's value rises sharply. If it cannot, that
    is recorded and the comparison is dropped rather than guessed.

  mechanism: >-
    A solving-degree instrument reports one number per system. Whether that
    number carries information about an attack depends entirely on whether it
    moves when the attack-relevant structure is present. Over binary fields the
    point-decomposition systems obtained by Weil restriction of a summation
    polynomial are documented to have first-fall degrees far below what a
    semi-regular sequence of the same degree profile would predict -- that gap IS
    the structure, and it is the reason extension-field index calculus is
    sub-generic while prime-field index calculus is not known to be. The
    mechanism proposed is therefore a three-point comparison in every cell: the
    structured system, a null system with the identical Newton polytope and
    solution count but random coefficients, and the analytic semi-regular
    prediction computed from the Hilbert series at zero compute. The structured
    minus null gap on the binary arm is the effect the instrument must reproduce;
    the same gap measured on the prime-field arm is then, and only then, an
    interpretable measurement.

  novelty_status: unverified

  citations:
    - ref: KN-OPEN-002
      provenance: internal
      claim: >-
        The low degree-of-regularity heuristic and the first-fall proxy are
        studied mostly over binary fields; whether first-fall tracks the true
        degree of regularity, and how both scale, is not settled over prime
        fields. This is a directly measurable toy-scale question.
      verified_by: this session read knowledge/open-problems/KN-OPEN-002.md in full
    - ref: KN-LIT-4558
      provenance: kb
      claim: >-
        Relayed abstract: a lower bound on the cost of Gröbner basis computation
        for the point decomposition problem, via a special structure of the ideal
        under which the computation is an extension of the extended Euclidean
        algorithm, from which the authors prove that Semaev's naive index calculus
        method cannot be more efficient than generic methods; under simple
        statistical assumptions on summation polynomials.
      verified_by: >-
        this session read knowledge/literature/KN-LIT-4558.md in full and records
        that the entry itself is marked as relayed from the PDF's first two pages
        and NOT independently verified. The claim is therefore a pointer, and the
        contract must discharge it from the local copy before any run.
    - ref: KN-LIT-005
      provenance: internal
      claim: >-
        Binary-field degree-of-regularity and first-fall-degree results for
        point-decomposition systems, as relayed by KN-OPEN-002's source_refs.
      verified_by: >-
        not opened in this session; cited as the corpus's own pointer for the
        published values the contract must extract
    - ref: KN-LIT-010
      provenance: internal
      claim: >-
        Second binary-field first-fall-degree source, as relayed by KN-OPEN-002's
        source_refs.
      verified_by: not opened in this session
    - ref: KN-LIT-025
      provenance: internal
      claim: >-
        Petit, Kosters and Messeng, PKC 2016 -- a prime-field decomposition
        construction, validated only at small parameters, explicitly hedged, with
        Gröbner behaviour identified as the bottleneck; and the corpus's rule that
        prime-field and extension-field claims are kept strictly separated.
      verified_by: this session read knowledge/literature/KN-LIT-025.md in full
    - ref: 'Amadori, A., Pintore, F. and Sala, M., On the discrete logarithm problem for prime-field elliptic curves, eprint 2017/609'
      provenance: retrieved
      claim: >-
        Abstract, fetched this session: a variation of Semaev's original approach
        for the prime-field case which outperforms both Semaev's method and the
        Petit et al. specialised algorithm, the improvement being obtained by
        reducing the necessary Gröbner basis computations to only one basis
        calculation.
      verified_by: >-
        this session fetched https://eprint.iacr.org/2017/609 and read the
        abstract; the body was NOT read and no complexity figure is taken from it
    - ref: 'McGuire, G. and Mueller, D., A new index calculus algorithm for the ECDLP and summation polynomial evaluation, eprint 2017/1262'
      provenance: retrieved
      claim: >-
        Abstract, fetched this session: an index calculus algorithm using fast
        evaluation of summation polynomials which, unlike all other algorithms
        using summation polynomials, does NOT involve a Gröbner basis computation.
        Recorded because it bounds the reach of any Gröbner-cost lower bound,
        including KN-LIT-4558's.
      verified_by: >-
        this session fetched https://eprint.iacr.org/2017/1262 and read the
        abstract; the body was not read

  assumptions:
    - >-
      The program's existing solving-degree harnesses (the DREG and SIG clusters)
      can be pointed at a binary-field system without modification beyond the
      coefficient field, or the difference is implemented once and recorded.
    - >-
      The published binary-field first-fall degrees are extractable as numbers at
      named parameter sets. If they are not, the arm degrades to a
      structured-versus-null comparison with no external anchor, which is weaker
      and must be labelled as such.
    - >-
      A timeout or an out-of-memory on any cell is an infrastructure signal and
      never a high solving degree. This is AGENTS.md rule 3 and it is the single
      most likely way this experiment produces a false negative.

  proof_search_map:
    bottleneck: >-
      Not a proof bottleneck but an inferential one: every closure in the
      index-calculus lane passes through the step "the measured degree did not
      drop, therefore the structure gives nothing". That step is valid only if the
      measurement would have shown a drop had one been present, and nothing in the
      corpus establishes that.
    baseline_embedding:
      parameter_slice: >-
        The binary-field arm at the exact published parameter sets IS the old
        method's boundary, and the instrument must reproduce the published
        first-fall degrees there. The prime-field arm at m = 3 with the Kummer
        factor base must reproduce whatever the existing BKK and DREG runs
        recorded at the same parameters.
      reproduction_check: >-
        A frozen regression fixture on the existing prime-field cells, run first;
        and an equality check against the extracted published binary values,
        recorded as pass or fail per parameter set before any new cell is
        interpreted.
    observation_collision:
      observable: >-
        The solving degree, and the first-fall degree as its proxy.
      distinct_preimage_search: >-
        Two distinct systems with the same observable are easy to produce and are
        the whole reason for the null arm: a structured summation system and a
        random system of the same support can share a first-fall degree while
        differing in true solving cost, and KN-OPEN-002 records that whether
        first-fall tracks the true degree of regularity is unsettled over prime
        fields. The wall-clock and the Macaulay matrix rank profile are therefore
        recorded alongside the degree in every cell, so a collision on the degree
        is visible rather than silent.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The fibre of the solving-degree observable -- the set of systems sharing
          a measured degree -- populated deliberately with a structured member, a
          null member of identical support, and the semi-regular analytic
          reference.
        predicted_gain: >-
          None on cost. The gain is inferential: it converts the lane's nulls from
          unfalsifiable absences into measurements with a demonstrated resolution.
    quantifier_order: >-
      FOR ALL cells in the declared binary parameter grid, the measured first-fall
      degree equals the published value, AND the structured-minus-null degree gap
      is strictly positive with an interval excluding zero. The negation --
      THERE EXISTS a cell where the instrument fails either check -- is the
      informative outcome and localises to that cell.
    method_ceiling:
      strongest_certifiable_claim: >-
        That the instrument does, or does not, resolve a known degree drop at the
        tested parameter sizes. It can never certify anything about prime-field
        ECDLP hardness, and a successful calibration adds no evidence for any
        prime-field conclusion beyond restoring the force the conclusion's own
        record already claims.
      nearby_object_control: >-
        The nearby object on which the desired conclusion is KNOWN FALSE is the
        binary-field system itself: there, "the structure gives no degree
        advantage" is false, because extension-field index calculus is
        sub-generic. An instrument that returns a null there is returning a null
        where the answer is known to be a signal, which is the exact failure this
        record exists to detect.
    proof_obligations:
      - claim: the binary arm reproduces the published first-fall degrees
        responsibility: baseline
      - claim: >-
          the null system has identical Newton polytope and comparable solution
          count, so the comparison is matched and not confounded by support
        responsibility: correctness
      - claim: >-
          the semi-regular Hilbert-series reference is computed correctly for each
          degree profile
        responsibility: correctness
      - claim: >-
          timeouts and memory exhaustion are recorded as infrastructure and never
          as degree measurements
        responsibility: scope

  object_first_candidate:
    tracked_object: >-
      The degree filtration of the relation ideal, projected to the single index
      at which the leading-term cascade completes -- the solving degree -- and its
      cheaper proxy, the first-fall degree.
    lossy_projection_test: >-
      This is a genuinely lossy projection of the Macaulay matrix tower: it
      discards which polynomials appeared, their coefficients, the rank profile at
      every intermediate degree, and the solutions themselves, retaining one
      integer. It is discarded COMPATIBLY with the operation, because the
      operation the solver performs is degree-by-degree linear reduction and the
      retained integer is exactly the level at which that process terminates, so
      the retained part propagates deterministically as the degree increases. It
      is not a change of coordinates: an entire family of systems shares each
      value, which is why the collision search above is mandatory and why the
      rank profile is recorded beside the integer.
    one_step_propagation: >-
      One step is one degree increment of the Macaulay matrix. The projection
      propagates by construction.
    survival_depth: >-
      Until the cascade completes. The object dissolves exactly when the solver
      exhausts memory, which is why an exhausted cell is an infrastructure record
      and not a large-degree observation.

  predictions:
    - metric: >-
        measured first-fall degree on the binary arm at the published parameter
        sets
      direction: different
      minimum_effect: >-
        equal to the published value at every extracted parameter set; a
        discrepancy of even one at any set halts interpretation and localises to
        the harness
    - metric: >-
        structured-minus-null first-fall degree gap on the binary arm
      direction: lower
      minimum_effect: >-
        the structured system's degree is at least 1 below the null system's, with
        a 95 percent interval over repeated random nulls excluding 0, in at least
        three of the declared cells
    - metric: >-
        structured-minus-null gap on the prime-field arm at matched factor-base
        size
      direction: different
      minimum_effect: >-
        reported with an interval; the pre-registered expectation is that it is
        indistinguishable from 0, which is the lane's standing null and is only
        interpretable if the binary arm's gap is non-zero
    - metric: >-
        measured degree against the semi-regular Hilbert-series prediction, both
        arms
      direction: lower
      minimum_effect: >-
        the binary structured arm must sit strictly below the semi-regular
        prediction; that gap is the definition of the structure being present
    - metric: >-
        growth of the prime-field measured degree in the factor-base size D at
        fixed m
      direction: higher
      minimum_effect: >-
        a fitted exponent with an interval, reported against the pre-registered
        curve extracted from KN-LIT-4558 if that extraction succeeds

  minimal_test:
    design: >-
      Three arms, one harness, one frozen contract. ARM B (known answer): the
      binary-field point-decomposition systems at the exact parameter sets whose
      first-fall degrees are published in KN-LIT-005 and KN-LIT-010, extracted
      into the contract as numbers before any run. ARM P (the lane's own
      question): prime-field point-decomposition systems at matched factor-base
      size and matched group size, with the two factor-base designs already used
      in this corpus -- the arithmetic small-x base and the Kummer base
      x^e = 1 -- at m in {3, 4} and D swept over four values per m. ARM N (the
      NAMED NULL OBJECT): for every cell of arms B and P, a null system built by
      replacing the summation polynomial with a random polynomial having the
      IDENTICAL Newton polytope and coefficients drawn uniformly from the same
      field, with the factor-base equations left untouched; ten independent nulls
      per cell. ARM S (zero compute): the semi-regular degree of regularity for
      each cell's degree profile and variable count, from the Hilbert series.
      Record, per cell, the first-fall degree, the maximal degree reached, the
      Macaulay rank profile, the wall clock and the peak RSS. Every cell carries a
      declared time and memory cap; an exhausted cell is recorded as exhausted.
    controls:
      - >-
        ARM N is the null object and it is named concretely: not "a random
        system", but THE SAME system with the summation polynomial replaced by a
        random polynomial of identical support. Support, variable count, field and
        factor-base equations are all held fixed; only the group structure is
        removed.
      - >-
        ARM B is the positive control. Its published values are the external
        anchor and are extracted into the contract before the run, so the
        comparison is pre-registered and cannot be adjusted afterwards.
      - >-
        ARM S is an analytic reference computed at zero compute, so that a cell
        that times out still has a stated expectation attached to it.
      - >-
        Solver control: every cell is run under at least two independent Gröbner
        implementations. A degree that differs between them is an implementation
        finding, not a mathematical one, and this corpus has already been bitten
        by two runs sharing 266 of about 270 executable lines and agreeing for
        that reason (KN-FIND-1ba0fe).
      - >-
        Seed control: ten independent nulls per cell, so the structured-minus-null
        gap has a distribution and not a single comparison.
    required_metrics:
      - first-fall degree and maximal degree reached, per cell and per solver
      - the Macaulay matrix rank profile by degree, per cell
      - >-
        the structured-minus-null degree gap with a 95 percent interval over the
        ten nulls, per cell
      - the semi-regular Hilbert-series prediction, per cell
      - wall clock, peak RSS, and cap-exhaustion status, per cell
      - >-
        pass or fail against each extracted published binary value, per parameter
        set

  falsification_conditions:
    - >-
      CALIBRATED: arm B reproduces every extracted published value AND shows a
      structured-minus-null gap with an interval excluding 0 in at least three
      cells. The lane's prime-field nulls are then interpretable at the tested
      scale.
    - >-
      UNCALIBRATED: arm B reproduces the published values but the
      structured-minus-null gap has an interval containing 0 in every cell. The
      instrument cannot see the effect it is being used to rule out, and every
      degree-based negative in the lane must have its scope narrowed to the
      resolution actually demonstrated. This outcome is a correction to standing
      records and would be the more valuable of the two.
    - >-
      HARNESS FAULT: arm B fails to reproduce a published value, or the two
      solvers disagree on a degree. Interpretation halts and the finding is an
      implementation finding.
    - >-
      UNINFORMATIVE: more than a third of the declared cells exhaust their caps.
      The experiment reports an infrastructure limit and no mathematical
      conclusion, per AGENTS.md rule 3.

  confounders:
    - >-
      First-fall degree is a proxy for solving degree, and KN-OPEN-002 records
      that whether it tracks the true degree of regularity is unsettled over
      prime fields. Both are recorded, and any conclusion drawn from first-fall
      alone is flagged as proxy-based.
    - >-
      A null system with the identical Newton polytope may still have a very
      different solution count, which independently moves the degree. The solution
      count is measured per cell by brute force at the smallest sizes and reported;
      cells where it differs by more than a factor 2 from the structured system
      are excluded from the gap statistic and reported separately.
    - >-
      Monomial order, field representation and solver tuning all move the measured
      degree by small amounts. They are frozen in the contract and identical
      across arms; the two-solver control is what detects a tuning artifact.
    - >-
      The binary arm's parameters are the ones the literature chose, which are the
      ones where the effect is visible. Reproducing them shows the instrument
      fires there and does not show it fires at the prime arm's sizes; the two
      arms are matched on factor-base size for exactly this reason, and residual
      mismatch is reported.
    - >-
      Cap exhaustion correlates with high degree, so dropping exhausted cells
      biases the measured degree downward. Exhausted cells are reported, never
      dropped, and never imputed.

  interpretation_limits:
    - >-
      This record produces no attack, no speedup and no bound. Its outputs are
      statements about an instrument.
    - >-
      A calibrated instrument does not make the lane's prime-field conclusions
      true; it makes them mean what their records already say. Any temptation to
      read a successful calibration as fresh support for those conclusions is
      exactly the inflation this record exists to prevent.
    - >-
      Toy scale on both arms. Nothing transfers to cryptographic parameters and
      no such transfer is asserted.
    - >-
      The KN-LIT-4558 comparison is conditional on a successful extraction from
      the local copy. If it fails, the prime arm has no external anchor and says
      so.

  standing_results_check:
    kn_find_ffe1df_theorem_c: >-
      HYPOTHESES NOT SATISFIED, and checked. Theorem C concerns a surjective
      homomorphism from a prime-order group onto a strictly smaller structure. The
      object here is the degree filtration of a polynomial ideal. There is no map
      out of E(F_p) anywhere in this record, so the argument's hypotheses are not
      met and it neither closes nor supports anything here.
    kn_tech_73630e: >-
      NOT APPLICABLE. No lift and no statistic of a lift's digits. Recorded
      against interest: the measured degrees ARE deterministic functions of public
      data, so this record offers nothing informational -- which is correct and
      expected, because it is a control and claims nothing informational.
    kn_find_61347e: >-
      NOT APPLICABLE. No genus change and no Poincare factor. Arm B changes the
      FIELD, not the genus, and it is a control arm rather than a proposed attack
      route; no claim is made that extension-field index calculus transfers to
      prime fields, and KN-LIT-025's separation of those claims is preserved.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (INSTRUMENT RESOLUTION.) FOR ALL cells in the declared binary parameter
        grid, THERE EXISTS a gap g >= 1 such that the measured first-fall degree
        of the structured system is at least g below the median first-fall degree
        of ten null systems of identical Newton polytope over the same field. The
        distribution concerned is that of the first-fall degree over uniformly
        random coefficient assignments on a fixed support.
      rigorous_support: >-
        The rigorous half is the Hilbert-series computation of the degree of
        regularity of a semi-regular sequence with the given degree profile and
        variable count, which is exact and is arm S. The classical distribution
        statement it imitates is that a random coefficient assignment on a fixed
        support yields a semi-regular sequence with probability tending to 1, so
        the null arm should concentrate at the arm-S value. H1 asserts that the
        structured system departs from that concentration by a resolvable amount,
        which is the published binary-field phenomenon.
      validation_plan: >-
        SAMPLED: ten independent null coefficient assignments per cell, across the
        declared binary grid, plus the structured system. SHORTCUT: none needed;
        the binary parameter sets are chosen small precisely because they are the
        published ones. COMPARED AGAINST: (i) the arm-S semi-regular prediction,
        as a point value, and (ii) the empirical distribution of the ten nulls, by
        median and interquartile range. TAIL CHECK: the MINIMUM first-fall degree
        over the ten nulls, so that a structured system beating only the null
        median but not the null minimum is not read as a signal. SAMPLED
        PARAMETERS RECORDED: field, n, m, factor-base dimension, monomial order,
        solver, seed. TRANSFER ASSUMPTION, stated explicitly: a resolution
        demonstrated on the binary grid is NOT assumed to hold at the prime arm's
        sizes; the arms are matched on factor-base size to make the assumption as
        small as possible, and the residual is reported.
    - id: H2
      statement: >-
        (PROXY FIDELITY.) FOR ALL cells in both arms, the first-fall degree and
        the maximal degree actually reached during the computation differ by at
        most 1.
      rigorous_support: >-
        There is no theorem here, which is the point: KN-OPEN-002 names exactly
        this as unsettled over prime fields. H2 is stated so that its failure is
        recorded as a finding rather than absorbed. The nearest rigorous statement
        is that first-fall is a lower bound on the degree at which a nontrivial
        degree fall occurs and hence does not exceed the maximal degree reached.
      validation_plan: >-
        SAMPLED: every cell of both arms, since both quantities are produced by the
        same run at no extra cost. COMPARED AGAINST: equality up to 1, as an
        empirical distribution of the difference over cells, separately per field
        family. TAIL CHECK: the maximum observed difference, reported per arm; a
        difference growing with D on the prime arm is itself a finding about the
        proxy and is exactly what KN-OPEN-002 asks for.
    - id: H3
      statement: >-
        (MATCHED NULL VALIDITY.) FOR ALL cells, the null system's F_q-rational
        solution count is within a factor 2 of the structured system's.
      rigorous_support: >-
        The Bezout and BKK counts are identical by construction since the Newton
        polytope is held fixed; the rational-point count is a Lang-Weil-type
        statement about a random member of a linear system on a fixed toric
        variety, and it is the part that can fail.
      validation_plan: >-
        SAMPLED: exhaustive solution counting at the smallest three cells of each
        arm, where the search space is enumerable; estimated by random sampling
        elsewhere. COMPARED AGAINST: the structured system's count in the same
        cell. TAIL CHECK: the cells with the largest ratio are listed explicitly
        and excluded from the gap statistic rather than averaged in.

  target_complexity:
    time_exponent: >-
      None claimed for this record. THE RECORD'S OWN BEST POSSIBLE OUTCOME IS NOT
      AN EXPONENT IMPROVEMENT, and it is filed as a required building block rather
      than as an exponent move. The exponent it serves is the lane's: with factor
      base B = N^{1/m}, relation collection costs B times the per-decomposition
      cost and the sparse linear algebra costs Õ(N^{2/m}), so the total falls
      below rho's N^{1/2} only if the per-decomposition cost is small, and that
      cost is what the solving degree governs.
    memory_exponent: >-
      None claimed. The lane's index calculus holds Õ(N^{1/m}) factor-base entries
      and a relation matrix with Theta(m*N^{1/m}) nonzeros, and per
      IDEA-20260806-3b91c7 must therefore be compared against the memory-matched
      generic baseline N^{1/2 - 1/(2(m+1))} rather than against N^{1/2}.
    best_known: >-
      Pollard rho at Theta(sqrt(N)) group operations with O(1) memory; BSGS at
      (N^{1/2}, N^{1/2}); the memory-matched chain frontier T = sqrt(N/S). No
      published prime-field index calculus beats any of these, and this record
      does not propose one.
    hidden_overhead: >-
      The measured degrees carry solver-dependent constants and an implicit
      dependence on the monomial order and field representation, none of which is
      asymptotic and all of which are frozen in the contract. Cap exhaustion is
      the dominant hidden cost and is reported rather than hidden.
    tradeoff_note: >-
      Not applicable to this record; the relevant tradeoff statement belongs to
      the configurations it helps adjudicate and is recorded there.

  estimated_cost:
    implementation: medium
    compute: medium

  recommended_priority: medium

  sota_delta: >-
    +0, and by construction: a control claims no improvement. This is stated in
    the record's own terms as the handoff requires -- an idea whose best possible
    outcome is not an exponent move must say so rather than be dressed up. Its
    justification for a slot is that it is a required building block: no exponent
    claim and no closure in the index-calculus lane is interpretable at the stated
    strength without it, and this campaign's results are currently all nulls from
    an instrument never shown to fire.

  dominated_by: >-
