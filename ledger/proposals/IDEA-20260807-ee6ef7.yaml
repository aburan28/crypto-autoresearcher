idea:
  id: IDEA-20260807-ee6ef7
  question_id: RQ-CANL-63098f
  added: '2026-08-07'
  title: >-
    THE REACHABILITY GATE OF THE CANONICAL LIFT, COSTED: h(D) = |D|^{1/2+o(1)}
    and |D| = 4p - t^2, so writing the canonical lift down through the Hilbert
    class polynomial costs |D|^{1+o(1)} = p^{1+o(1)} time and p^{1/2+o(1)}
    space -- the setup alone is p^{1/2} times the WHOLE rho attack -- and the
    only evasion is h(disc End) = O(1), a class that is cryptographically real
    (it contains j = 0 and j = 1728) but that the isogeny class cannot be
    walked into
  class: measurement

  claim: >-
    (A) THE GATE. DECOMPOSITION.md T5 makes reachability a mandatory second
    gate for every lane that moves between curves. L9 moves from E/F_p to its
    canonical lift, so it must pay for that move before any height or rank
    argument is allowed to count. This record pays the bill.

    (B) THE COST, WITH EXPONENTS. Let O = End_{F_p}(E), D_E = disc O, and
    h = h(D_E). Three facts compose:
      (i) SIEGEL: h(D) = |D|^{1/2 + o(1)}. So deg H_{D_E} = h = |D_E|^{1/2+o(1)}.
      (ii) The coefficients of H_D have logarithmic height Theta(sqrt(|D|) log|D|),
           so the TOTAL BIT SIZE of H_D is Theta(|D| log^{2+eps}|D|) =
           |D|^{1+o(1)}. The output alone is that large; no algorithm can beat
           it while writing it down.
      (iii) SUTHERLAND'S CRT METHOD attains that bound: expected running time
           O(|D|^{1+eps}) with O(|D|^{1/2+eps} log P) space under GRH
           (A. V. Sutherland, "Computing Hilbert class polynomials with the
           Chinese Remainder Theorem", arXiv:0903.2785 / Math. Comp.;
           VERIFIED VIA WEB SEARCH 2026-08-07, ABSTRACT ONLY, FULL PAPER NOT
           READ).
    For a curve at the bottom of its volcano, |D_E| = |D| = 4p - t^2, which
    is Theta(p) for the ~61% of curves with |t| <= sqrt(p). Therefore:
        canonical-lift construction: p^{1 + o(1)} time, p^{1/2 + o(1)} space.
    Against parallel rho at 0.886 sqrt(N) time and O(1) memory (KN-TECH-001,
    KN-TECH-006): THE SETUP COST FOR ONE CURVE EXCEEDS THE ENTIRE ATTACK BY A
    FACTOR p^{1/2}, AND ITS SPACE ALONE MATCHES BSGS. The gate fails at
    exponent 1 versus 1/2, which is worse than the failure mode
    RQ-CANL-63098f was set up to examine -- the height argument never gets to
    run.

    (C) WHY THE p-ADIC ROUTE DOES NOT RESCUE IT FOR PRIME FIELDS. The canonical
    lift over Z_p = W(F_p) is characterised by lifting Frobenius, i.e. by
    Phi_p(J, J^sigma) = 0 with sigma = identity on Z_p, so J is a Z_p-root of
    the one-variable polynomial Phi_p(X, X). Phi_p has degree p+1 in each
    variable and Theta(p^2) coefficients of height Theta(p log p), so merely
    writing Phi_p down is p^{2+o(1)} -- WORSE than the class-polynomial route.
    Satoh-style canonical lifting is efficient for F_{p^n} with p SMALL and n
    large, where the modular polynomial in play is Phi_p for a small p; over a
    prime field with p large there is no small prime to lift along.
    [open] THIS RECORD DOES NOT CLAIM THAT NO CHEAPER ROUTE EXISTS. It claims
    that the two standard routes cost p^{1+o(1)} and p^{2+o(1)} respectively,
    and it makes "is there an algorithm computing j(canonical lift) to
    precision p^n for E/F_p in time p^{o(1)}" an explicit open question and a
    Stage-0 literature target. A positive answer would be a significant result
    in its own right and would REOPEN this lane; that is why the question is
    written down rather than assumed shut.

    (D) THE EVASION, NAMED EXACTLY. The bound in (B) is driven by |D_E|, not
    by p. If |D_E| = O(1) then H_{D_E} is a FIXED polynomial of O(1) degree
    with O(1) coefficients and the canonical lift is written down in
    polylog(p) time. Concretely h(D_E) = 1 for
    D_E in {-3,-4,-7,-8,-11,-12,-16,-19,-27,-28,-43,-67,-163} and h <= 2 for a
    further known finite list. This happens exactly when End_{F_p}(E) is the
    maximal order of a small-discriminant imaginary quadratic field, i.e. when
    E sits at the CRATER of a volcano whose fundamental discriminant is small:
    j = 0 (D_0 = -3, whenever p = 1 mod 3), j = 1728 (D_0 = -4, whenever
    p = 1 mod 4), and the O(1) curves with j a root of a small H_{D_0}.
    IS THAT CLASS CRYPTOGRAPHICALLY RELEVANT? YES, AND THE RECORD SAYS SO
    PLAINLY: secp256k1 is y^2 = x^3 + 7, a j = 0 curve, so its canonical lift
    is a CM curve over Q with |D_E| = 3 and the reachability gate PASSES for
    it at polylog cost. Many GLV and pairing-friendly curves are built by the
    CM method precisely to have small |D_0| (DEC-20260806-160175 records the
    Hilbert-class-polynomial construction route in this program's own corpus).
    NO ATTACK ON ANY OF THOSE CURVES FOLLOWS: passing the reachability gate
    only earns the right to run the height argument, which
    IDEA-20260807-fd5a24 and IDEA-20260807-11b93d then show yields a constant
    factor and no exponent, and IDEA-20260807-6533fd shows is dominated on
    coordinate size alone.

    (E) AND THE EVASION IS NOT REACHABLE BY WALKING. DECOMPOSITION.md T4
    (fact): fixing the isogeny class fixes t, hence fixes D = t^2 - 4p, hence
    fixes D_0. "You cannot walk to a j = 0 curve from a curve whose class does
    not already contain one." Within a class, walking UP the volcano to the
    crater reduces |D_E| from |D_0|f^2 to |D_0| -- a genuine reduction by up
    to f^2 -- but the floor is |D_0|, which is Theta(p) for a random class.
    So the volcano gives a real but bounded improvement to the gate, and it is
    quantified here rather than asserted: ascending the full conductor reduces
    the class-polynomial cost from |D_0 f^2|^{1+o(1)} to |D_0|^{1+o(1)}, a
    factor f^{2+o(1)}, and f^2 <= |D|/3 so the best case is p^{o(1)} -- which
    is attained only when |D_0| = O(1), i.e. only in the class that already
    contained a small-discriminant curve.

  resource_label: >-
    R6 (lift to Z_p / characteristic zero -- the object being costed) and R3
    (End(E) as a ring -- disc, class number, and volcano level are the cost
    parameters); R4 enters only through the T4/T5 walking argument in (E).
  admissibility: admissible
  admissibility_argument: >-
    This record consumes no group-oracle output at all: every quantity in it
    is a function of (p, t, D_0, f_E) and of published algorithm complexities.
    It cannot be simulated in the generic group model for the trivial reason
    that it computes nothing about the group -- it computes the price of
    leaving it. That makes it admissible and also makes it, honestly, an
    AUDIT rather than an attack component. It is filed as a measurement
    because the gate it evaluates is mandatory for every other L9 proposal,
    and because a lane that skips it would report a height result whose setup
    cost already exceeded the attack it was compared against.

  discriminated_from:
    - >-
      IDEA-20260807-fd5a24 and IDEA-20260807-11b93d: those price the HEIGHT
      budget once the lift exists. This one prices the lift's existence. If
      this gate fails, their conclusions are still correct but moot for the
      generic curve, and the campaign should record that ordering.
    - >-
      DEC-20260806-160175, which mentions the "Hilbert class polynomial route"
      as a CURVE-CONSTRUCTION method (how a CM curve is generated, i.e. the
      CM method for producing curves of prescribed order). This record uses
      the same polynomial in the opposite direction: given a curve, price the
      recovery of its canonical lift. Same object, opposite arrow.
    - >-
      L1 / RQ-ICINV-475b5e and L2 / RQ-VOLC-f6253b: those measure cost
      functionals ACROSS a class and stratify by volcano level. This record
      uses the volcano only to compute how much ascending reduces |D_E|, and
      makes no claim about Groebner or relation-yield functionals.
    - >-
      GOAL-ICLIFT-001 / RQ-XEDN-001: the function-field lineage prices nothing
      of this kind; its cost model is a section-density exponent over F_p(t).

  object_first_candidate:
    tracked_object: >-
      THE DISCRIMINANT OF THE ENDOMORPHISM RING, D_E = D_0 f_E^2, followed as
      the single cost parameter of the lift. Everything the lane wants to do
      is priced by |D_E| and by nothing else about the curve.
    lossiness: >-
      EXTREMELY LOSSY AND THE LOSS IS THE POINT. From (E, p, t, j, model,
      points) the object retains one negative integer. It discards j entirely
      -- and that discard is compatible with the operation that matters,
      because the class polynomial's cost depends on its degree and coefficient
      height, both functions of D_E alone, and because all h(D_E) roots of
      H_{D_E} are Galois conjugate and hence equally hard to obtain. It is not
      a change of coordinates: the h(D_E) crater curves have distinct j and
      identical object, and a lane hoping one of them is cheaper is refuted by
      exactly that collapse.
    propagation: >-
      One step = one ell-isogeny. Ascending the volcano divides f_E by ell,
      dividing |D_E| by ell^2; descending multiplies it by ell^2; horizontal
      steps leave it fixed. So one-step propagation is exact, integral, and
      cheap to measure by counting rational ell-isogenies (the standard
      volcano-level test), which is already the instrument L2 proposes.
    survival_score: >-
      SURVIVES: every isogeny, every twist, every model change, every choice
      of point. DIES: only at a change of isogeny class, which by T4 is not an
      operation available to an attacker holding one instance.

  mechanism: >-
    STEP 1 -- TABULATE THE GATE. For a ladder of toy p and, symbolically, for
    standardised sizes (160, 192, 224, 256, 384, 521 bits), compute
    |D| = 4p - t^2 for the realised t, factor D = D_0 f^2, and evaluate
    h(D_0 f_E^2) for each volcano level f_E | f, using the analytic class
    number formula h = sqrt(|D|) L(1, chi_D)/pi with L computed from a
    truncated Euler product (mpmath). Report h, deg H, and the predicted
    bit size Theta(|D| log^2 |D|) at every level.

    STEP 2 -- CROSS-CHECK h AGAINST EXACT COUNTING AT TOY SCALE. For |D| below
    a few thousand, count reduced binary quadratic forms of discriminant D
    exhaustively (elementary loop over |b| <= sqrt(|D|/3)) and compare with
    the analytic value. This is the instrument check: any discrepancy means
    the L-value truncation is wrong and every downstream number is void.

    STEP 3 -- BUILD H_D DIRECTLY AT TOY SCALE AND MEASURE ITS ACTUAL SIZE.
    For |D| <= a few hundred, compute H_D by the complex-analytic method
    (sum over reduced forms of the j-value of the corresponding lattice, via
    the q-expansion of j with mpmath at sufficient precision), and record
    (a) deg H_D, (b) max coefficient bit length, (c) total bit length, and
    (d) wall clock. Fit total bit length against |D| in log-log; the predicted
    slope is 1. THIS IS THE MEASUREMENT THAT MAKES THE EXPONENT CLAIM
    FALSIFIABLE RATHER THAN QUOTED.

    STEP 4 -- VERIFY THE LIFT ACTUALLY LANDS. For a toy ordinary E/F_p with
    small |D|, check that H_D(j(E)) = 0 mod p, that j(E) is a simple root
    mod p, and Hensel-lift that root to a root of H_D in Z/p^n for n up to 8.
    That is the canonical lift's j-invariant to precision p^8, computed the
    expensive way, and it is the ground truth against which any claimed cheap
    route in Step 5 must be checked.

    STEP 5 -- THE OPEN QUESTION, MADE INTO AN EXPERIMENT RATHER THAN AN
    ASSERTION. Attempt the p-adic route on the same toy instances: form
    Phi_p(X,X) (feasible only for tiny p) and Hensel-lift its root; measure
    the cost and confirm it agrees with Step 4's answer. Then record the
    measured cost ratio and extrapolate the two exponents. If any third route
    is found in the Stage-0 literature check, it is measured on the same
    fixtures.

    STEP 6 -- THE EVASION CENSUS. Count, over a ladder of p, how many curves
    over F_p have h(disc End) <= H_max for H_max in {1, 2, 4, 8, 16}. The
    predicted count is sum over small D_0 of h(D_0) * (twists), i.e. O(1) per
    D_0 and O(H_max^{2+o(1)}) in total, against ~p curves -- a fraction
    p^{-1+o(1)}. Report the measured fraction and its decay slope.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      2026-08-07. grep -rn "Hilbert class polynomial|class polynomial|CM
      method|Atkin-Morain" over knowledge/ (18 files, all literature-index
      rows) and over ledger/ (2 hits). grep for "Serre-Tate|canonical lift"
      over ledger/ (RQ-CANL-63098f only). Read KN-TECH-018, KN-TECH-001,
      KN-TECH-006, DECOMPOSITION.md sections 2-4, and DEC-20260806-160175's
      surrounding lines. Web search for the Hilbert class polynomial
      complexity, which returned Sutherland arXiv:0903.2785 with the
      O(|D|^{1+eps}) time / O(|D|^{1/2+eps} log P) space statement under GRH.
    results: >-
      NO record in this repository states the cost of computing a canonical
      lift, states deg H_D = h(D) = |D|^{1/2+o(1)}, or compares that cost with
      the rho baseline. DEC-20260806-160175 mentions the Hilbert class
      polynomial only as a curve-CONSTRUCTION method. The Sutherland
      complexity is external, published, and cited here with its verification
      status recorded (abstract via web search, full paper not read).
    verdict: >-
      ADAPTATION. Every ingredient is standard published complexity theory;
      nothing external is claimed as new. What is new to this program is the
      composition into a T5 reachability gate for L9 with the exponents
      written down, and the identification of h(D_E) = O(1) as the exact
      evasion class together with its unreachability by walking.

  null_object_control: >-
    MANDATORY. NULL OBJECT for the cost measurement: a random monic integer
    polynomial of the SAME degree h(D) with coefficients of the same bit
    length, subjected to the identical size and Hensel-lifting measurements.
    The null isolates "the cost is a function of the polynomial's shape" from
    "the cost is a function of D". PREDICTION: the null matches on size and
    on Hensel cost, and DIFFERS on construction cost (the null is free to
    write down; H_D is not). If the null also matches on construction cost,
    the measurement is not measuring class-polynomial construction at all.
    DECAY PARAMETER: |D|. The measured total bit length of H_D must GROW like
    |D|^{1+o(1)}; the fraction of curves with h <= H_max must DECAY like
    p^{-1+o(1)}. A fraction that fails to decay as p grows is the canonical
    artifact tell and would mean the census is counting twists or isomorphism
    classes inconsistently.
    POSITIVE CONTROL: |D| in {-3,-4,-7}, where H_D is known in closed form
    (X, X - 1728, X + 3375). The instrument must return exactly those.

  assumptions:
    - >-
      Siegel's theorem h(D) = |D|^{1/2+o(1)} (ineffective constants). STANDARD;
      recalled, not re-derived. The o(1) is genuinely ineffective, which is
      disclosed rather than hidden: it means the crossover p above which the
      gate provably fails is not effectively computable from this argument
      alone, only the exponent is.
    - >-
      Sutherland's O(|D|^{1+eps}) expected time and O(|D|^{1/2+eps} log P)
      space under GRH (arXiv:0903.2785). VERIFIED VIA WEB SEARCH ABSTRACT
      2026-08-07; FULL PAPER NOT READ. If a better algorithm exists the gate's
      exponent falls, but not below the output size Theta(|D| log^2|D|)
      unless the lift is obtained without writing H_D down -- which is
      exactly the open question in (C).
    - >-
      Serre-Tate/Deuring: the canonical lift exists, has End = O, and its
      j-invariant is a root of H_{D_E}, congruent to j(E) mod p. STANDARD;
      recalled. Step 4 verifies the congruence constructively at toy scale.
    - >-
      The trace distribution used in "61% of curves have |D| >= 3p" is the
      semicircle law on [-2 sqrt p, 2 sqrt p]. The 0.609 figure is computed in
      IDEA-20260807-fd5a24 by elementary integration and is reused here; the
      semicircle law itself is recalled, not proved.
    - >-
      secp256k1 has curve equation y^2 = x^3 + 7 over its prime field, hence
      j = 0. A public standard parameter, stated for scope only. NO ATTACK ON
      IT IS PROPOSED OR IMPLEMENTED.

  proof_search_map:
    bottleneck: >-
      The single step that decides the gate is "the canonical lift cannot be
      obtained without an object of size Theta(|D| log^2 |D|)". Remove it --
      exhibit a route to j(canonical lift) mod p^n whose cost is p^{o(1)} --
      and the gate passes for every curve and the lane's centre of gravity
      moves entirely to the height argument. Everything else here is
      arithmetic around that one step.
    baseline_embedding:
      parameter_slice: >-
        |D| in {-3, -4, -7, -8, -11}, where H_D is a known closed form. The
        implementation must reproduce those polynomials EXACTLY before any
        measured cost is believed.
      reproduction_check: >-
        Frozen fixture with exact integer coefficients: H_{-3} = X,
        H_{-4} = X - 1728, H_{-7} = X + 3375, H_{-8} = X - 8000,
        H_{-11} = X + 32768. RECALLED VALUES -- to be confirmed against a
        source at Stage 0 and treated as unverified until then; a mismatch is
        an instrument failure and blocks the line.
    observation_collision:
      observable: >-
        The construction cost of the canonical lift, as a function of the
        curve.
      distinct_preimage_search: >-
        SUCCEEDS, AND THE COLLISION IS THE RESULT: all h(D_E) crater curves in
        one class have the SAME cost, because they are the roots of one
        polynomial and are Galois conjugate. So the observable cannot
        distinguish a "cheap" crater curve from an expensive one -- there is
        no cheap one. That collision is precisely what closes the T5 search
        for a cost-minimising curve within a class: the minimiser is the whole
        crater and its value is |D_0|^{1+o(1)}. A collision FAILURE -- two
        conjugate roots with materially different cost -- would falsify the
        Galois-conjugacy argument and reopen a within-class search.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "compute the canonical lift" by "compute disc End and its
          class number", which is the only part of the lift the cost depends
          on. Encoding: (p, t) -> D -> (D_0, f) -> h. Completeness: every
          curve has one; soundness: h determines deg H_D exactly; transfer:
          the cost bound is a function of h and |D| only; cost loss: none, the
          reduction is free.
        predicted_gain: >-
          Turns an expensive-to-evaluate predicate ("is this curve's lift
          cheap") into an O(polylog p) test, which is the LOCAL DETECTABILITY
          condition T5 requires. Note the consequence: goodness here IS
          locally detectable, and it is still useless, because the good set is
          unreachable by walking (T4) rather than undetectable.
      - transform: stronger_invariant
        proposed_object: >-
          Track the pair (h(D_E), volcano level f_E) rather than h alone, so
          the ascent gain f^{2+o(1)} is visible.
        predicted_gain: >-
          Quantifies exactly how much the one available move (ascend the
          volcano) buys: a factor f^{2+o(1)} off the gate, with floor
          |D_0|^{1+o(1)}.
    quantifier_order: >-
      THE CLAIM: FOR ALL ordinary E/F_p, THE COST of writing down the
      canonical lift by the class-polynomial route is |disc End|^{1+o(1)};
      and THERE EXISTS a subfamily (h(disc End) = O(1)) on which it is
      polylog(p). THE TRAP BEING HUNTED: swapping the quantifiers into "there
      exists a curve in every class whose lift is cheap", which is FALSE by
      the Galois-conjugacy collision above, and which is the exact error a
      T5-optimistic reading of this lane would make. The record states the
      false version explicitly so that no downstream summary can drift into it.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "by the two standard routes, constructing the canonical lift
        of E/F_p costs |D_E|^{1+o(1)} or p^{2+o(1)}; for the ~61% of curves
        with |D_E| = Theta(p) the first is p^{1+o(1)}, exceeding the rho
        attack by p^{1/2}; and the evasion class h(D_E) = O(1) is locally
        detectable but class-invariant." It CANNOT certify that no cheaper
        route exists -- that is open and is written down as open. It is NOT a
        lower bound on anything.
      nearby_object_control: >-
        The nearby object where the conclusion fails is E/F_{p^n} with p small
        and n large, where Satoh-style canonical lifting IS efficient and the
        gate passes comfortably. A method that reported "canonical lifting is
        expensive" there would have failed to identify the load-bearing
        structure (which is that the lifting prime must be small). The control
        is cheap to state and pins the claim to prime fields.
    proof_obligations:
      - claim: "deg H_D = h(D) = |D|^{1/2+o(1)} (Siegel)."
        responsibility: baseline
      - claim: "Total bit size of H_D is Theta(|D| log^{2+eps}|D|)."
        responsibility: size_bound
      - claim: "Sutherland attains O(|D|^{1+eps}) time under GRH."
        responsibility: baseline
      - claim: "Phi_p has Theta(p^2) coefficients, so the p-adic route is p^{2+o(1)}."
        responsibility: size_bound
      - claim: "|D| = 4p - t^2 = Theta(p) for 61% of curves."
        responsibility: correctness
      - claim: "h(D_E) = O(1) iff |D_0| = O(1) and f_E = O(1); the class fixes D_0 (T4)."
        responsibility: correctness
      - claim: "No cheaper route is claimed to be impossible."
        responsibility: scope

  predictions:
    - metric: >-
        fitted slope of log(total bit size of H_D) against log|D| over the
        toy range |D| <= 400
      direction: higher
      minimum_effect: >-
        Predicted 1.0 with a fit interval excluding 0.5. A slope near 0.5
        would mean only the degree, not the coefficient height, is growing,
        and the size argument would be wrong.
    - metric: >-
        exact h(D) from reduced-form counting versus the analytic formula
      direction: different
      minimum_effect: >-
        EXACT INTEGER AGREEMENT for every |D| <= 4000. One disagreement is an
        instrument failure and blocks the line.
    - metric: >-
        fraction of curves over F_p with h(disc End) <= 4, over a ladder of p
      direction: lower
      minimum_effect: >-
        Predicted decay with slope -1 in log-log against p (a count of O(1)
        against ~p curves). A slope materially above -1 means the census is
        over-counting and the evasion class is larger than the argument
        allows -- which would be the interesting failure.
    - metric: >-
        measured wall clock of the complex-analytic H_D construction against
        |D|
      direction: higher
      minimum_effect: >-
        Predicted superlinear in |D| at toy scale (the naive method is worse
        than Sutherland's). Reported as an implementation cost, NOT as
        evidence about the asymptotic exponent, which comes from the size
        bound.
    - metric: >-
        Hensel lift of j(E) to a root of H_D in Z/p^n, n = 1..8
      direction: different
      minimum_effect: >-
        Must succeed and must satisfy H_D(J) = 0 mod p^n exactly at every n.
        This is the constructive verification that the object exists; failure
        means the Serre-Tate identification as implemented is wrong.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): confirm the five closed-form H_D
      values against a source; confirm the Sutherland complexity statement
      against the arXiv abstract already retrieved; record both with
      verification status. A failure here downgrades the record's citations,
      not its arithmetic.
      STAGE 1 (minutes): exact reduced-form class number counting versus the
      analytic formula over |D| <= 4000.
      STAGE 2 (hours): complex-analytic H_D construction for |D| <= 400 with
      mpmath; record degree, coefficient bit lengths, total size, wall clock;
      fit the size slope.
      STAGE 3 (minutes): Hensel lift on toy curves; verify H_D(j(E)) = 0 mod p
      and lift to p^8.
      STAGE 4 (minutes): the evasion census over a ladder of p.
      STAGE 5 (zero compute): tabulate the gate at standardised sizes and
      charge against 0.886 sqrt(N); report both exponents.
    controls:
      - Closed-form H_D positive control (|D| in {-3,-4,-7,-8,-11}).
      - Random monic polynomial null of matched degree and coefficient size.
      - Exact reduced-form counting as an independent check on h.
      - Rho and BSGS baselines at the same N (KN-TECH-001, KN-TECH-006, KN-TECH-031).
    required_metrics:
      - "h(D), deg H_D, max coefficient bits, total bits, per |D|"
      - Fitted size slope with interval
      - Hensel lift success and residual at each precision
      - Evasion-class fraction per p with decay slope
      - Wall clock and peak memory per cell
      - Null-arm values for every metric

  falsification_conditions:
    - >-
      The fitted size slope is materially below 1. The class polynomial is
      smaller than claimed and the gate's exponent falls; the record is
      superseded with the measured exponent.
    - >-
      Exact and analytic class numbers disagree. Instrument failure; nothing
      reported.
    - >-
      A route is found (Stage 0 literature, or Stage 5) computing the
      canonical lift for prime-field E in p^{o(1)}. THE GATE PASSES, this
      record's central negative is withdrawn, and the lane's priority rises
      sharply. This is pre-registered as the outcome that would matter.
    - >-
      The evasion-class fraction does not decay with p. The good set is larger
      than argued and the T4 unreachability claim needs re-examination.
    - >-
      The closed-form positive control fails. No negative may be reported from
      any arm.
    - >-
      Wall clock exceeds budget before any |D| is resolved. INFRASTRUCTURE
      outcome under AGENTS.md rule 5, recorded as such, not as evidence.

  confounders:
    - >-
      Precision in the complex-analytic construction. Under-precision produces
      wrong coefficients that still look plausible; the closed-form control
      and an integrality check on every coefficient are mandatory.
    - >-
      Conflating H_D with a class-invariant polynomial (Weber functions and
      the like) whose coefficients are smaller by a constant factor in the
      exponent's cofactor. That changes constants, not the exponent 1, and any
      measurement must state which polynomial it built.
    - >-
      Twist and isomorphism-class counting in the evasion census. Six sextic
      twists of a j = 0 curve are six curves with the same |D_E|; whether they
      are counted once or six times changes the fraction by a constant and
      must be declared.
    - >-
      The ineffective o(1) in Siegel. It forbids any statement about a
      specific finite p being "provably past the crossover"; only the exponent
      is claimed.

  interpretation_limits:
    - >-
      Toy scale for every measured number; the crypto-size rows are ARITHMETIC
      EVALUATIONS of a formula, explicitly labelled as such, and are not
      experiments.
    - >-
      This closes no lane by itself. It orders the lane: for the ~61% of
      curves with |D_E| = Theta(p), the height argument is moot because the
      setup already lost; for the O(1)-class-number curves the height argument
      is the live question and is owned by fd5a24, 11b93d and 6533fd.
    - >-
      Naming secp256k1 as a j = 0 curve is a scope statement about which class
      is non-empty. It is NOT an attack, NOT a weakness claim, and NOT a
      recommendation about any deployed system. The record's conclusion for
      that class is a constant-factor negative.
    - >-
      "No cheaper lifting route exists" is NOT claimed and must never be
      quoted from this record. The claim is about two named routes.

  heuristic_assumptions:
    - id: HEUR-CANL-R1
      statement: >-
        FOR ALL ordinary E/F_p drawn uniformly, |D| = 4p - t^2 = Theta(p) with
        probability at least 0.6, and h(D) = |D|^{1/2+o(1)} with the o(1) term
        empirically below 0.1 in the toy range.
      rigorous_support: >-
        The first half is rigorous given the semicircle trace law (elementary
        integration, computed in fd5a24). The second half is Siegel's theorem
        with an ineffective constant; the "empirically below 0.1" clause is the
        heuristic part and imitates the standard use of the class number
        formula h = sqrt(|D|) L(1,chi)/pi with L in [|D|^{-eps}, log|D|], i.e.
        the classical distribution theorem being imitated is the
        Siegel-Tatuzawa bound on L(1,chi).
      validation_plan: >-
        Sample: every fundamental D with |D| <= 20000, exact h by reduced-form
        counting. Predicted distribution: h/sqrt(|D|) concentrating with mean
        L(1,chi)/pi and a left tail from small L. Compare the empirical
        distribution of h/sqrt(|D|) against the Euler-product prediction; tail
        check on the 20 smallest ratios, which are the potential
        counterexamples to "h is large". TOY SCALE ONLY -- this validates the
        formula's shape, not Siegel's asymptotic.
    - id: HEUR-CANL-R2
      statement: >-
        No algorithm computes j(canonical lift of E/F_p) to precision p^n in
        time p^{o(1)} * poly(n log p) for prime fields with p large.
      rigorous_support: >-
        NONE. This is explicitly a conjecture and is labelled as the record's
        open question, not as a result. The evidence for it is only that the
        two standard routes cost p^{1+o(1)} and p^{2+o(1)}, and that Satoh's
        efficiency depends on the lifting prime being small. It is stated as a
        numbered heuristic precisely so that it can be attacked; refuting it
        is the single most valuable outcome available in this lane.
      validation_plan: >-
        Stage 0 literature sweep with named search terms (canonical lift,
        Serre-Tate parameter, Satoh, AGM, Vercauteren, Kedlaya, deformation
        theory) recording every route found and its complexity, written to
        knowledge/literature/ with verification status. Then, on the toy
        fixtures of Stage 3, measure any found route against the Hensel
        ground truth. A route beating p^{1/2} is reported immediately and
        escalated, not absorbed.

  target_complexity:
    time_exponent: >-
      SETUP ONLY, and it is the point: 1 + o(1) in p for the class-polynomial
      route at |D_E| = Theta(p); 2 + o(1) for the modular-polynomial route;
      o(1) (polylog) when h(D_E) = O(1). No attack exponent is claimed because
      no attack is proposed.
    memory_exponent: >-
      1/2 + o(1) for Sutherland's method (O(|D|^{1/2+eps} log P) space under
      GRH), i.e. the same memory exponent as BSGS, obtained before any search
      begins. This is the axis on which the gate is worst relative to rho's
      O(1) memory and it must be quoted alongside time.
    best_known: >-
      Parallel Pollard rho with distinguished points at 0.886 sqrt(N) time and
      O(1) memory (KN-TECH-001, KN-TECH-006); automorphism-discounted on CM
      curves (KN-TECH-018); BSGS at sqrt(N) time and memory (KN-TECH-031). The
      canonical-lift setup at p^{1+o(1)} time and p^{1/2+o(1)} memory is
      dominated by ALL THREE simultaneously on both axes.
    hidden_overhead: >-
      Siegel's o(1) is ineffective, so no finite crossover point is claimed.
      The eps in Sutherland's bound hides polylog factors and a GRH
      dependence, both disclosed. The polylog(p) claim for h(D_E) = O(1) hides
      the cost of finding the right root of a fixed polynomial mod p and of
      Hensel lifting to the needed precision, which is genuinely polylog but
      is not free.
    tradeoff_note: >-
      There is a real time-memory tradeoff inside the class-polynomial
      computation (CRT method: more primes, less memory), and it is
      irrelevant here because both endpoints are dominated. Parallelisation:
      the CRT method parallelises almost perfectly across primes, so the gate
      is p^{1+o(1)}/P on P processors -- and rho parallelises equally well, so
      the p^{1/2} deficit is invariant under parallelisation. That invariance
      is the sharpest form of the gate's failure and is why it is stated here
      rather than left to a footnote.

  dominated_by: >-
    CHECKED ACROSS EVERY ROW OF THE FRONTIER ON TIME, MEMORY AND DATA. The
    canonical-lift setup at p^{1+o(1)} time, p^{1/2+o(1)} memory is dominated
    on BOTH axes by parallel rho (p^{1/2} time, O(1) memory), on time by BSGS
    (p^{1/2}) and tied-to-worse on its memory, and on time by the
    automorphism-discounted rho. It is also dominated by simply running rho
    and ignoring the lift entirely, which is the comparison that matters. As
    an audit instrument it has no incumbent in this repository: no prior
    record prices the canonical lift, so on the instrument axis
    dominated_by is "none found after checking knowledge/techniques (89
    records grepped for lift/class-polynomial cost) and ledger/". NOT null on
    the attack axis.
  sota_delta: >-
    Zero speedup; the mechanism this record prices is p^{1/2} SLOWER than the
    attack it would enable, before the attack runs. Quantitatively: setup time
    exponent 1 versus rho's total 1/2 (deficit p^{1/2}); setup memory exponent
    1/2 versus rho's 0 (deficit p^{1/2}); evasion class fraction p^{-1+o(1)}
    of curves; volcano ascent buys a factor f^{2+o(1)} with floor
    |D_0|^{1+o(1)}. As an instrument the delta is a new mandatory gate
    evaluation costing O(polylog p) per curve.

