  reachability_gate: >-
    THIS RECORD IS THE REACHABILITY GATE FOR LANE L9, and it reports FAIL for
    the generic curve and PASS for h(disc End) = O(1). Stated as T5 requires:
    (i) is a good object common enough to hit by random walking? NO -- the
    good set has density p^{-1+o(1)} among curves over F_p and, worse, is
    class-invariant: T4 fixes D_0, so a random walk inside the class never
    changes whether the class is good. (ii) Is goodness detectable by a LOCAL
    test at each step? YES, and cheaply: h(disc End) is computable in
    O(polylog p) from (p, t, f_E), and f_E is read off by counting rational
    ell-isogenies. So this lane is the unusual case where goodness IS locally
    detectable and the lane still dies -- not on detectability but on
    reachability, because the only move available (ascend the volcano)
    improves |D_E| by at most f^2 and cannot go below |D_0|, which the class
    fixed before the attacker arrived. COST OF THE ONE AVAILABLE MOVE:
    ascending f_E = f to 1 costs O(log p) isogeny steps (crater mixing, T5)
    and buys a factor f^{2+o(1)} off a p^{1+o(1)} bill.

