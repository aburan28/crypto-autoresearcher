    - metric: >-
        MITM per-attempt cost versus algebraic per-attempt cost at a
        DELIBERATELY constructed toy cell where |V| is large relative to
        arity (constructed so attempts is NOT dominant)
      direction: different
      minimum_effect: >-
        No specific value predicted; this is the genuinely open forward
        test (Stage 2 of minimal_test), reported as a measured ratio, not
        assumed.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, delivered in this record): the QSP-cell
      arithmetic reproduction above. STAGE 1 (toy, cheap, confirms the
      construction works at all): implement the two-list MITM subset-sum
      construction over a toy curve's factor base (n prime <= 41, arity
      m=2,3,4), verify every found "collision" against direct curve
      arithmetic, and confirm the relation-finding OUTCOME (which relations
      exist) is IDENTICAL to what this program's existing algebraic F2
      solver finds on the SAME toy instances -- a correctness/agreement
      check, not yet a cost comparison. STAGE 2 (the genuinely open forward
      test): construct a toy cell where |V| is deliberately LARGE relative
      to m (e.g. by NOT applying an injection-bound-style reduction, using a
      toy analogue of the plain SEMBIN point-decomposition factor base
      rather than the QSP-reduced one), and measure wall-clock/operation-
      count MITM cost against the SAME toy cell's algebraic solve cost
      (reusing whatever instrument RQ-ICPERF-94c86e or IDEA-20260916-b84e2d's
      ladder provides), to find whether and where the crossover
      |V|^{ceil(m/2)} < M(E) occurs in practice, not just in the idealized
      floor.
    controls:
      - >-
        Agreement check (Stage 1): MITM and the existing algebraic solver
        must find the IDENTICAL relation set on the same toy instances;
        disagreement is an instrument defect in one or the other, localised
        before any cost comparison is trusted.
      - >-
        Certificate re-verification on every MITM-found relation, per
        docs/claims-and-verification.md.
      - >-
        The QSP-cell reproduction (Stage 0) as the baseline any Stage 2
        finding must remain consistent with (a large-|V| toy cell is
        DELIBERATELY chosen to differ from the QSP cell's certified-small
        regime, and this must be stated, not conflated).
    required_metrics:
      - 'MITM per-attempt cost (additions, memory), per cell'
      - 'algebraic per-attempt cost (from existing instruments), per cell'
      - 'relation-set agreement between MITM and algebraic solvers'
      - 'certificate pass rate'

  falsification_conditions:
    - '2*2401^2 does not equal 2^23.46 within rounding: arithmetic error in this record, corrected before anything else is trusted.'
    - 'Stage 1''s MITM and algebraic solvers disagree on the relation set found on identical toy instances: instrument defect, localised before any cost claim.'
    - >-
      Stage 2 finds a crossover cell where MITM is cheaper AND the
      attempts-column success probability at that cell is also favourable
      enough to matter against a rho baseline at that toy size, without a
      matched-rho control confirming the comparison is fair: reported as
      requiring the matched-rho control before any further claim, per this
      lane's own baseline convention.

  confounders:
    - >-
      MITM's memory cost (O(|V|^{ceil(m/2)}) stored points) is a DIFFERENT
      kind of resource from the algebraic route's memory (Groebner staircase
      / SAT clause database size); a fair per-attempt comparison should
      report BOTH memory figures, not just time, since a time-memory
      tradeoff exists on each side independently.
    - >-
      The m!-symmetry and negation-sign bookkeeping this program's other F2
      lines already use must be applied IDENTICALLY inside the MITM
      construction or the relation counts will not be comparable; Stage 1's
      agreement check is designed to catch exactly this.
    - >-
      At the QSP cell, BOTH solvers are already dominated by the attempts
      column by such a wide margin (>=100+ bits) that the per-attempt
      comparison, while arithmetically clean, has NO practical consequence
      for that cell's already-closed verdict; this is disclosed plainly
      rather than presented as a live result.

  interpretation_limits:
    - >-
      A SOLVER-CHOICE contribution to the F2 family, not a new factor base,
      tracked object, or exponent. At the one cell it can check today (the
      QSP row), it changes no verdict; its value there is purely as a
      decision rule for future implementations.
    - >-
