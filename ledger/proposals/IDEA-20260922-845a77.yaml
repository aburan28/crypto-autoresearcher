      record (via dedup-surface.md), again a direct-enumeration idea, not a
      collision/table construction. Neither proposes the O(|V|^{ceil(m/2)})
      time/memory tradeoff or applies it to ECC2K-130's own certified factor-
      base bound. What this record adds beyond both: the explicit two-sided
      split with a hash table (the actual MITM construction, not a full or
      (m-1)-fold enumeration), the numeric comparison against M(E) at the
      QSP cell using this program's own already-computed numbers, and the
