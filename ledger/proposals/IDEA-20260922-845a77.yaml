      resource (not hidden in an o(1)); at untested, larger-|V| cells this
      memory could itself become the binding constraint, a time-memory
      tradeoff disclosed in tradeoff_note.
    tradeoff_note: >-
      Classic time-memory tradeoff: MITM trades O(|V|^{ceil(m/2)}) memory
      for the same order of time savings relative to a naive O(|V|^m)
      enumeration, and is embarrassingly parallel across both halves'
      enumeration; whether it beats the ALGEBRAIC route (a different
      resource profile entirely) is cell-specific and is exactly what
      Stage 2 of the minimal_test would measure.

