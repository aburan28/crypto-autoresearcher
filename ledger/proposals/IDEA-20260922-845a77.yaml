    point decomposition, priced against this program's own measured/bounded
    factor bases, was not found in the corpus and was not checked against
    external index-calculus literature.

  assumptions:
    - >-
      "Subset-sum of size k over V" here means: choose k elements of V
      (with the SAME repetition/ordering conventions this program's own
      m! symmetry-reduction already uses elsewhere, e.g. IDEA-20260916-
      3f7a1c's orbit and m! accounting), sum them as CURVE POINTS, and index
      the result by its x-coordinate; this record does not re-derive the
      symmetry reduction, it inherits it.
    - >-
      OFF-LIMITS COMPONENT DECLARED: F2 is the family; no new factor base is
      proposed, and the specific factor bases this record prices (QSP,
      a17f43's successor object) are inherited, not re-derived -- their own
      records' numbers are cited, not recomputed.
    - >-
      The comparison |V|^{ceil(m/2)} vs M(E) uses whichever M(E) candidate
      is appropriate per the cell being priced; where this program's own
      records disagree on M(E) (the QSP chain cell), BOTH candidates are
      reported, and the record does not adjudicate which is correct.

  proof_search_map:
    bottleneck: >-
      Whether, at ANY cell this program has bounded or will bound, the
      per-attempt cost min(algebraic solve, MITM) is EVER the limiting term
      rather than the attempts-column success probability -- and, separately,
      at the one cell already certified small (QSP, n'=33), which of the two
      solvers is cheaper per attempt, a question decidable today by
      arithmetic on already-computed numbers.
    baseline_embedding:
      parameter_slice: >-
        The QSP row (n'=33, m=4, |V|<=2401) is the exact parameter slice
        this program has already certified small (IDEA-20260916-3f7a1c); it
        is the baseline this record's MITM pricing must reproduce a
        CONSISTENT verdict on (attempts-column-dominated, hence void as an
        attack regardless of solver) before any forward-looking claim about
        other shapes is trusted.
      reproduction_check: >-
        ZERO COMPUTE ARITHMETIC. 2 * 2401^2 = 2 * 5,764,801 ~= 2^23.5 curve
        additions (corrected from the claim's 2^22.5 estimate -- recomputed
        here exactly: log2(2 * 2401^2) = log2(11529602) ~= 23.46), versus
        M(E) in {2^21.5, 2^31.0}; against the attempts column's own
        recomputed >= 110-bit total from IDEA-20260916-3f7a1c: MITM's
        ~2^23.5 per-attempt cost, multiplied by >= 2^110 attempts, still
        totals >= 2^133, unchanged from that record's own void verdict on
        the row's total cost. Any recomputation of 2*2401^2 that disagrees
        with 2^23.46 localises an arithmetic error in this record.
    observation_collision:
      observable: >-
        Per-attempt cost, per solver (algebraic vs MITM), and total cost
        (per-attempt cost times attempts, from the |F|^m/(m!*group_size)
        heuristic), per cell.
      distinct_preimage_search: >-
        Two different (m, |V|) cells could show the SAME total-cost verdict
        (both void, both dominated by attempts) while having OPPOSITE
        rankings of per-attempt solver cost (MITM cheaper at one, algebraic
        cheaper at the other) -- this is EXPECTED and is exactly why the
        record reports per-attempt solver choice SEPARATELY from the
        attempts-column verdict, rather than conflating "which solver is
        cheaper" with "does this cell beat rho".
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the algebraic elimination system (S_{m+1} in m variables,
          solved by Groebner/resultant/SAT) with a two-list collision search
          over EXACT curve-point sums of two halves of the factor base.
          Encoding: k1 + k2 = m factor-base slots split into two lists,
          each list's sums stored/probed by x-coordinate. Completeness:
          every solution of the algebraic system with all m points in V
          corresponds to exactly one collision between the two lists (both
          describe the SAME equation P_1+...+P_m=R). Soundness: every
          collision found is independently verified by direct curve
          arithmetic before being credited as a relation, per docs/claims-
          and-verification.md; hash collisions on the x-coordinate alone
          (without the matching y-coordinate / sign) are filtered exactly as
          this program's own negation-aware conventions already handle
          elsewhere. Transfer: to any m, any V, any curve -- the construction
          uses only group addition, which every curve this lane studies
          supports natively. Cost loss: none identified in completeness; a
          MEMORY cost of O(|V|^{k1}) is incurred that the algebraic route
          does not pay in the same form (the algebraic route's memory is
          Groebner-basis/staircase size, a different quantity), disclosed
          explicitly in target_complexity.
        predicted_gain: >-
          At the QSP cell: no change to the total-cost verdict (both solvers
          are dominated by the attempts column); a genuinely useful per-
          attempt cost comparison (MITM ~2^23.5 vs algebraic 2^21.5-2^31.0)
          that this program's future implementations can use to CHOOSE a
          solver without re-deriving the comparison. At not-yet-certified
          shapes (a17f43's successor object, SEMBIN m>=4): unknown, and
          named as the open direction.
    quantifier_order: >-
      EXISTS a factor base V and arity m (the QSP cell) at which the MITM
      per-attempt cost and the algebraic per-attempt cost are both computed
      and compared using ONLY numbers already in the corpus (not a forall
      claim over all cells). The record predicts, as its FALSIFIABLE claim,
      that at THIS cell the total-cost verdict (void, attempts-dominated) is
      UNCHANGED by the choice of solver -- a specific, checkable arithmetic
      claim, not an assertion about any other cell.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At the QSP (n'=33, m=4, |V|<=2401) cell, MITM's per-attempt cost is
        ~2^23.5 curve additions and ~2^21.5 stored points, versus an
        algebraic floor of 2^21.5-2^31.0; the row's total cost remains
        attempts-column-dominated (>=2^133) under EITHER solver, unchanged
        from IDEA-20260916-3f7a1c's own verdict." It cannot certify anything
        about the successor object's shape (a17f43) or SEMBIN m>=4, where
        |V| has not been certified small and the crossover has not been
        computed.
      nearby_object_control: >-
        The QSP row itself is BOTH the baseline-reproduction check AND the
        nearby-object control: it is a shape where the answer (void
        regardless of solver) is ALREADY KNOWN from IDEA-20260916-3f7a1c's
        independent route (the certified factor-base bound), so this
        record's arithmetic must reproduce "void" there or the comparison
        itself is suspect. A genuinely DIFFERENT nearby object -- a toy cell
        where |V| is LARGE ENOUGH that attempts is NOT dominant, constructed
        deliberately at small field size -- is the control that would show
        MITM's crossover behaviour actually mattering, named as the forward
        test in minimal_test Stage 2.
    proof_obligations:
      - claim: 2 * 2401^2 curve additions = 2^23.46, recomputed exactly from the certified |V|<=2401.
        responsibility: correctness
      - claim: MITM's total cost (per-attempt cost times attempts) is unchanged in its VERDICT (void) from IDEA-20260916-3f7a1c's own recomputation at the QSP cell.
        responsibility: baseline
      - claim: Every relation MITM finds is independently re-verified by direct curve arithmetic, at toy scale.
        responsibility: correctness
      - claim: The MITM construction correctly handles the same negation/sign and m! symmetry conventions this program's other F2 lines already use.
        responsibility: correctness
      - claim: A toy cell is constructed at which |V| is large enough that MITM's crossover against the algebraic solve is the genuinely deciding factor, for Stage 2 of the minimal_test.
        responsibility: feasibility

  predictions:
    - metric: >-
        MITM per-attempt cost (curve additions) at the QSP cell (n'=33,
        m=4, |V|<=2401), recomputed exactly
      direction: lower
      minimum_effect: >-
        Exactly 2*2401^2 = 11,529,602 curve additions, i.e. 2^23.46; any
