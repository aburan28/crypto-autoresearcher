  target_complexity:
    time_exponent: >-
      NO EXPONENT ON THE UNDERLYING PROBLEM IS CLAIMED OR MOVED. MITM is a
      DIFFERENT SOLVER for the same relation-search step: it changes the
      PER-ATTEMPT cost from M(E) (superpolynomial in m, d per Rojas'
