idea:
  id: IDEA-20260922-845a77
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-22'
  status: proposed
  approved_by: null
  title: >-
    A MEET-IN-THE-MIDDLE CLAW DECOMPOSITION OF THE POINT-DECOMPOSITION STEP
    ITSELF: split an m-way factor-base subset-sum into two halves joined by
    a curve-point hash table (O(|V|^{ceil(m/2)}) group additions and memory,
    no Semaev polynomial ever built or solved) versus the algebraic solve
    floor M(E), priced at ECC2K-130's own already-bounded factor-base sizes
    -- where it buys nothing because the attempts column dominates -- and
    handed forward to the one shape in this lane where |V| is not yet
    certified small

  class: algorithm

  claim: >-
    Search heuristic 3 (agents/idea-generator.md) asks, for any bottleneck
    search, whether the target splits into two enumerable halves joined by a
    collision/table lookup. This program's F2 lines on ECC2K-130 (SEMBIN,
    DREG, the QSP chain) solve the point-decomposition step -- given target R
    and factor base V, find P_1,...,P_m in V with P_1+...+P_m = R -- EXCLUSIVELY
    by fixing m-1 unknowns as free variables in the Semaev summation
    polynomial S_{m+1}(x_1,...,x_m,x_R) and solving the resulting system
    ALGEBRAICALLY (Groebner basis, resultant, or SAT/CNF-XOR), at a cost this
    program models by that system's ideal/Macaulay degree (M(E), or Rojas'
    bound, or the measured D_S of IDEA-20260916-b84e2d for the QSP chain
    specifically). NONE of the filed corpus (checked: dedup-surface.md's 164
    titles, and the QSP/FROB/SEMBIN records read in full this session)
    proposes the alternative, purely group-arithmetic decomposition: split
    the m factor-base slots into two halves of size k1 = ceil(m/2),
    k2 = floor(m/2); enumerate all |V|^{k1}/k1! (with repetition handled as
    every other line here already handles it) subset-SUMS of the first
    half as GENUINE CURVE-POINT ADDITIONS (not polynomial evaluations) and
    store each sum's x-coordinate in a hash table; enumerate all
    |V|^{k2}/k2! subset-sums of the second half, and for each, probe the
    table for R minus that sum; a match is a candidate decomposition,
    verified by direct curve arithmetic (a certificate, per
    docs/claims-and-verification.md). This costs O(|V|^{k1} + |V|^{k2})
    elliptic-curve point additions and O(|V|^{k1}) memory -- WITHOUT ever
    building or solving a Semaev polynomial system. This is a DIFFERENT
    SOLVER for the SAME F2 factor-base-decomposition object (representation
    R1, operation set Sigma = translation by factor-base elements, Class I
    partial action, index calculus's own declared component), not a new
    tracked object or a new factor base.
    THE PRICED, DISCRIMINATING QUESTION AT ECC2K-130'S OWN PARAMETERS. This
    program has ALREADY BOUNDED the ECC2K-130 factor-base size at the one
    shape it has closed: |V| <= 2401 at n' = 33 (IDEA-20260916-3f7a1c's
    certified injection bound, an EXACT count, not an estimate). At that
    |V|, for arity m = 4 (the row this lane's corpus already computes),
    k1 = k2 = 2, so the MITM route costs about 2 * 2401^2 ~= 2^22.5
    elliptic-curve point additions and about 2401^2 ~= 2^21.5 stored points
    -- TINY compared to the algebraic solve floor M(E) (2^21.5 to 2^31.0 per
    the two candidate formulas this program's own records disagree on, per
    IDEA-20260916-b84e2d's citation). So MITM is, per-attempt, CHEAPER or
    comparable to the algebraic route at this cell. BUT the per-attempt
    SUCCESS PROBABILITY at this |V| is governed by the SAME
    |F|^m / (m! * group_size) heuristic this program already uses throughout
    (e.g. IDEA-20260916-3f7a1c's own recomputed attempts column, >= 110
    bits at d = 3): with |V| <= 2401 << l^{1/4}, the ATTEMPTS column, not the
    per-attempt cost, is the bottleneck by a margin of many tens of bits,
    and MITM does not change the attempts column at all (it is a
    per-attempt SOLVER choice, not a factor-base-size or success-probability
    lever). So at ECC2K-130's own certified-small QSP cell, MITM buys
    NOTHING beyond what the already-tiny algebraic solve cost already gave
    for free -- both routes are cheap per attempt; neither closes the
    attempts-column gap. THIS IS THE RECORD'S PREDICTED, HONEST, NEGATIVE
    FINDING AT THE ONE CELL IT CAN CHECK TODAY, stated so it can fail: if
    the algebraic route's floor is actually the LARGER of the two candidate
    M(E) formulas (2^31.0, per the analysis-note reading IDEA-20260916-b84e2d
    flags as possibly wrong) rather than the SMALLER (2^21.5, per the
    paper's own Appendix A.1), MITM's 2^22.5 is CHEAPER than the algebraic
    route per attempt, even though neither changes the attempts-column
    verdict -- a genuinely useful, checkable fact about WHICH SOLVER this
    program's future implementations should default to at THIS cell, decided
    by simple arithmetic on numbers already in the corpus.
    THE FORWARD-LOOKING, GENUINELY OPEN CONTENT: MITM's per-attempt cost
    grows only as |V|^{ceil(m/2)} -- polynomial in |V| for fixed m -- while
    the algebraic route's M(E) grows FASTER in the relevant parameters
    (exponentially in m via 2^{m(m-1)}, and the QSP-specific chain's
    Rojas-style bound grows as (3d)^{4.876 m^2}, per IDEA-20260916-b84e2d's
    own citation). At ANY shape this program has NOT YET certified small --
    the successor QSP correspondence object of IDEA-20260916-a17f43 (whose
    own record predicts its Bezout floor exceeds budget, but does not
    compare it to the MITM alternative), or the plain SEMBIN point-
    decomposition shape at arity m >= 4 (where this program's own factor
    base is not reduced by an injection bound the way the QSP shape is) --
    the crossover |V|^{ceil(m/2)} < M(E) could occur at a |V| LARGE enough
    that the attempts column is NOT yet the dominant term, in which case
    MITM would be the genuinely cheaper solver and its use would matter.
    This record names that comparison as the reusable instrument and applies
    it to the one cell it can check today (the QSP row, predicted void on
    the attempts column but informative on which solver is cheaper), leaving
    the not-yet-certified shapes as the forward direction.

  mechanism: >-
    OBJECT FRAME. Representation: R1, curve points (both x-coordinate
    candidates and, for the actual subset-sum enumeration, full affine/
    projective points, since MITM needs genuine group ADDITION, not merely a
    root test). Operation set Sigma: translation by factor-base elements --
    EXACTLY F2's own declared Class I partial action (IDEA-20260806-c5d183);
    this record adds NO new Sigma, per the brief's instruction that F2 is
    this question's declared family and any addition beyond it must be
    named precisely: the addition here is SOLVER CHOICE (how the relation
    P_1+...+P_m = R is searched for), not the tracked object, the
    representation, or the operation set, all three of which are unchanged
    from ordinary index calculus.
    TRICHOTOMY. Class I, partial-action, identical to every other F2 line in
    this program; the relation vector propagates only under translation by
    factor-base elements, exactly as the standard theory requires. This
    record places itself here explicitly rather than claiming a new class.
    LOSSY-PROJECTION TEST. Not a new projection: MITM computes EXACT curve-
    point sums and exact matches; nothing is discarded relative to the
    algebraic solve, which finds the SAME solution set (both methods solve
    P_1+...+P_m = R exactly, over the SAME factor base V, with the SAME
    definition of a valid relation) -- they differ only in HOW the search is
    organized (algebraic elimination vs group-arithmetic collision), not in
    WHAT is tracked. This record states plainly that it is not proposing a
    lossy object and the lossy-projection test is therefore not applicable
    to the solver-choice question, though it IS applicable (and already
    passed, per the QSP corpus) to the underlying factor base V itself,
    which this record inherits unchanged.
    F2 DECLARATION, EXPLICIT. Index calculus IS F2 (the brief's own
    instruction); this record's contribution is a SOLVER for F2's relation-
    search step, named as such, with the algebraic solve (Groebner/SAT/
    resultant) as the established alternative this program has used
    throughout. What is added beyond F2 as filed: the explicit |V|^{ceil(m/2)}
    vs M(E) comparison as a decision rule for WHICH solver to instrument,
    which no record in this corpus currently states.
    KN-OPEN-020 CLASS. Unchanged from whichever factor base is being solved
    over: implicit-membership for the QSP shape (per IDEA-20260916-5c9d6e's
    own declaration), inherited, not re-derived.

  novelty_status: unverified

