idea:
  id: IDEA-20260815-6aa3e3
  question_id: RQ-SIG-001
  added: '2026-08-15'
  title: >-
    IS THE SYZYGY CASCADE A CURVE FACT OR A PRESENTATION FACT? Re-derive it
    under an independently generated equivalent presentation of the SAME
    decomposition problem, because a cascade that dissolves under re-
    presentation is a property of how the system was written down and cannot
    be exploited
  class: control

  claim: >-
    The cascade is a statement about syzygies of a specific generating set.
    Syzygy modules are NOT invariants of the ideal alone -- they depend on
    the chosen generators, and a different generating set for the same ideal
    has a different syzygy presentation. So there are two possibilities the
    lane has not separated: the cascade reflects genuine structure of the
    decomposition variety, or it reflects the particular generators the
    Semaev construction happens to produce. ONLY THE FIRST IS EXPLOITABLE.
    This record re-derives the cascade under independently constructed
    generating sets of the same ideal and reports whether it survives.

  mechanism: >-
    Construct at least three generating sets for the same decomposition
    ideal: the standard Semaev generators, a randomised basis obtained by
    invertible row operations, and a generating set derived from a different
    elimination order or a different curve model. Verify the ideals are
    equal by comparing reduced Groebner bases. Measure the cascade statistic
    under each. Report survival, and where the cascade dissolves, report
    which operation dissolved it -- that identification is the useful output
    either way.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Grep for 'syzygy' co-occurring with 'invariant', 'generating set',
      'presentation'; read of H-SIG-001 and the lane's cascade framing;
      check of IDEA-20260813-f2a6e7 (certificate-labelled syzygy
      fingerprints).
    results: >-
      IDEA-20260813-f2a6e7 uses syzygy fingerprints for attack-system
      EQUIVALENCE, which is adjacent but asks whether two systems are the
      same rather than whether a statistic is presentation-dependent. No
      record tests the cascade's invariance under re-presentation of the
      same ideal.
    verdict: >-
      UNVERIFIED. That syzygies depend on generators is textbook; applying
      it as an exploitability gate on this lane's central statistic is
      what is new here, and it is cheap enough that its absence is
      surprising.

  object_first_candidate:
    tracked_object: >-
      THE CASCADE STATISTIC, with the GENERATING SET promoted to the
      indexed variable.
    lossiness: >-
      Not a propagation object; an invariance control.
    propagation: >-
      Not applicable.
    survival_score: >-
      Survives as far as multiple generating sets of the provably same
      ideal can be constructed and compared at the tested degrees.

  null_object_control: >-
    NULL 1 -- IDEAL-EQUALITY CHECK via reduced Groebner bases, blocking: if
    the presentations do not generate the same ideal the comparison is void,
    and this is the single easiest way to produce a spurious dissolution.
    NULL 2 -- a TRIVIAL re-presentation (permute the generators), under
    which the cascade MUST survive; a cascade that dies under permutation is
    a bug in the statistic. NULL 3 -- a random system under the same three
    re-presentations, bounding how much the statistic moves for reasons
    unrelated to curve structure.

  discriminated_from:
    - >-
        IDEA-20260813-f2a6e7 (syzygy fingerprints for system equivalence).
        OPPOSITE DIRECTION: that record uses syzygies to decide whether
        two systems are equivalent; this one holds equivalence fixed and
        asks whether the syzygy statistic is stable across it.
    - >-
        The D>=6 null record in this batch. INDEPENDENT AND COMPLEMENTARY:
        that asks whether the cascade beats a null; this asks whether the
        cascade is well defined. A cascade that fails this record's test
        does not need the null.

  assumptions:
    - >-
        Ideal equality across presentations is checkable at the tested
        degrees via reduced Groebner bases. If the bases are not
        computable, equality is unverified and the comparison is
        inadmissible.
    - >-
        The cascade statistic is computable from any generating set, not
        only the Semaev one. If it is defined only for the standard
        generators, then it is presentation-bound by construction and the
        record's question is answered trivially and negatively.

  predictions:
    - metric: >-
        ideal equality across the three presentations
      direction: different
      minimum_effect: >-
        FORCED EQUAL by reduced Groebner basis comparison. Failure voids
        the comparison.
    - metric: >-
        cascade statistic under generator permutation
      direction: different
      minimum_effect: >-
        FORCED UNCHANGED. Any movement is a bug in the statistic.
    - metric: >-
        cascade statistic under randomised basis change
      direction: different
      minimum_effect: >-
        No direction pre-committed. Survival supports exploitability;
        dissolution is the record's more likely and more decisive
        outcome.
    - metric: >-
        random-system statistic movement under the same re-presentations
      direction: different
      minimum_effect: >-
        Bounds how much of any observed movement is generic rather than
        curve-specific.

  minimal_test:
    design: >-
      One curve, D = 4, three presentations, with ideal equality verified
      first and the permutation control run before anything else. This is
      small and decides a gate that sits upstream of the lane's expensive
      D>=6 work.
    controls:
      - >-
          Reduced Groebner basis equality check, blocking.
      - >-
          Generator permutation, under which the statistic must not
          move.
      - >-
          Random system under identical re-presentations.
      - >-
          Both curve models used, so a model effect is not read as a
          presentation effect.
    required_metrics:
      - >-
          Cascade statistic per presentation, paired per curve.
      - >-
          Ideal equality verdict per presentation pair.
      - >-
          Random-system movement under the same operations.
      - >-
          Identification of which operation dissolves the cascade, where
          it dissolves.
      - >-
          Artifact manifest with hashes and rebuild receipt.

  falsification_conditions:
    - >-
        Presentations do not generate the same ideal. Comparison void; fix
        the construction.
    - >-
        The statistic moves under permutation. Statistic is buggy; the
        lane's existing cascade numbers are suspect.
    - >-
        The cascade dissolves under randomised basis change. It is a
        presentation artifact and is NOT exploitable -- which would close
        a substantial part of the lane cheaply and is the outcome I
        consider most likely.
    - >-
        The cascade survives all re-presentations. It is a genuine ideal-
        level structure and the lane's exploitability question stands, now
        on much firmer ground.

  confounders:
    - >-
        INCOMPLETE IDEAL EQUALITY: a basis change that accidentally
        changes the ideal produces a dissolution that means nothing. The
        equality check is blocking for this reason and must use reduced
        bases, not spot checks.
    - >-
        DEGREE INTERACTION: a randomised basis change raises generator
        degrees and can change the statistic for degree reasons rather
        than structural ones. Degree profiles must be reported per
        presentation.
    - >-
        STATISTIC UNDERSPECIFICATION: if the cascade statistic is not
        defined presentation-independently, this record's question is
        malformed and Stage 1 must say so rather than force a comparison.

  interpretation_limits:
    - >-
        Tests well-definedness, not exploitability; survival is necessary
        and not sufficient.
    - >-
        Scoped to the tested curve, degrees and three presentations.
    - >-
        A dissolution closes exploitability for the tested presentations
        only, though a dissolution under a mere basis change is strong
        evidence for the lane.

  heuristic_assumptions:
    - id: HEUR-SIG-PRES-1
      statement: >-
        The Semaev cascade statistic, if it reflects decomposition-
        variety structure rather than generator choice, is invariant
        under any invertible change of generating set preserving the
        ideal.
      rigorous_support: >-
        The rigorous ingredient is that the ideal and its variety are
        unchanged by a change of generators, and that graded Betti
        numbers of the IDEAL (as opposed to the chosen presentation's
        syzygy module) are invariants. THE GAP: the cascade statistic as
        the lane defines it may be a property of the presentation's
        syzygy module rather than of the ideal's minimal free
        resolution, in which case invariance is not expected and the
        negative outcome is the correct one.
      falsification_condition: >-
        Cascade movement under a basis change that provably preserves
        the ideal.
      validation_plan: >-
        SAMPLE: >= 5 curves x 3 presentations x D in {3,4}, with ideal
        equality verified for every pair. COMPARISON: paired per-curve
        statistic across presentations. TAIL CHECK: curves with the
        largest movement, reported with their generator degree profiles
        to separate degree effects from structural ones. TRANSFER
        ASSUMPTION: none beyond the tested degrees.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Stated explicitly rather than omitted, as the
      ideation contract requires. Cost is three Groebner computations per
      curve instead of one, plus the equality checks.
    memory_exponent: >-
      Groebner-dominated; three times the lane's existing per-curve
      footprint.
    best_known: >-
      The incumbent is the lane's single-presentation cascade measurement,
      whose well-definedness this record tests.
    hidden_overhead: >-
      Reduced Groebner bases for the equality check can be more expensive
      than the cascade measurement itself, which is the practical reason
      this test has not been run.
    tradeoff_note: >-
      Testing invariance costs a small multiple of the lane's per-curve
      compute and can retire an expensive D>=6 programme before it starts.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed). As
    algebra: entirely dominated by standard commutative algebra on
    generator-dependence of syzygies, which is used and not improved. As a
    lane gate: nothing in this program currently tests the cascade's well-
    definedness, so it is not dominated there. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: a cheap upstream gate on
    whether the SIG lane's central statistic is a property of the curve or
    of how the system was written down; identification of the specific
    operation that dissolves it if it dissolves; and a permutation control
    that would catch a bug in the existing statistic.

  estimated_cost:
    implementation: low
    compute: medium
  recommended_priority: high

  honest_prior_of_survival: >-
    0.9 that ideal equality is checkable at D = 3 and 4. 0.75 that the
    statistic is even well defined for a general generating set, which Stage
    1 may answer negatively and trivially. 0.55 that the cascade DISSOLVES
    under randomised basis change -- I lean this way because syzygy
    structure is notoriously generator-dependent, and if so this record
    retires a large amount of planned lane compute for very little.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
