idea:
  id: IDEA-20260828-411711
  question_id: RQ-MLKEM-001
  added: '2026-08-28'
  proposed_by: idea-generator
  status: proposed
  title: >-
    A fresh quantum time-memory point on the SVP oracle frontier: does the
    October-2025 quantum 3-tuple sieve (2^0.2846d time, 2^0.1887d memory)
    change which oracle is Pareto-optimal at ML-KEM's own memory ceiling?
    Extending IDEA-20260805-cdc87d's crossover framework from classical-only
    to the quantum regime with a genuinely new external data point
  class: composition

  claim: >-
    IDEA-20260805-cdc87d derives a closed-form, calibration-free crossover
    formula for the classical enumeration/sieving tradeoff under memory
    charging, using classical constants (c_T=0.292, c_M=0.2075, both
    themselves relayed). It explicitly does not address the quantum regime.
    Separately, this program's quantum-related RQ-MLKEM-001 records
    (IDEA-20260807-abacec/KN-OPEN-8a5965, IDEA-20260805-e805b6) audit CLAIMED
    polynomial-time quantum breaks and find them wanting; none incorporates
    ORDINARY (exponent-improving, non-poly-time) recent quantum sieve
    literature into this program's own memory-charged cost-model machinery.
    Engelberts et al. (arXiv 2510.08473, Oct 2025 -- retrieved this session,
    abstract-level only) report a quantum 3-tuple lattice-sieving algorithm
    at time 2^{0.2846d+o(d)} and memory 2^0.1887d classical+QCRAM bits plus
    2^o(d) qubits, explicitly framed by its own authors as the fastest known
    quantum SVP algorithm when memory is capped at 2^0.1887d. This proposal
    applies cdc87d's own exponent-pair-propagation object to this new point,
    using this program's own already-archived ML-KEM memory-routing cost
    figures (14.3/22.6/30.6 bits raise at ML-KEM-512/768/1024, per the
    cost_baseline_report cited by IDEA-20260805-690de8). H0 (expected): the
    3-tuple sieve's memory saving is not large enough, given ML-KEM's actual
    memory ceiling, to make its WORSE time exponent (0.2846 > the recalled,
    unconfirmed ~0.2570 for the unconstrained quantum 2-list sieve)
    worthwhile -- nothing about ML-KEM's reported quantum security margin
    changes. H1 (falsifying): ML-KEM's realistic attacker memory ceiling is
    BELOW 2^{0.1887*beta} at one or more standardized block sizes, making the
    3-tuple sieve the new best available point for a memory-constrained
    quantum adversary, flagging this program's existing quantum bit-security
    figures as optimistic wherever they assume the memory-unconstrained
    2-list sieve.

  mechanism: >-
    Reuse cdc87d's exponent-pair-propagation object and derived formula
    machinery (cited internally, not re-derived), substituting (a) the new
    quantum 3-tuple exponent pair (0.2846, 0.1887) for the sieve pair, and
    (b) an EXPLICIT memory ceiling M_max read from the program's own archived
    cost_baseline_report, rather than an abstract alpha-charging exponent.
    For each ML-KEM parameter set's required block size beta (also read from
    the archived report, not asserted from memory), compute whether
    beta*0.1887 exceeds log2(M_max); if it does, the 3-tuple sieve is
    infeasible there and the comparison is moot; if not, compare its time
    exponent against the best quantum alternative the archived report
    already assumes for that memory budget.

  novelty_status: unverified

  citations:
    - ref: "Engelberts et al., 'An Improved Quantum Algorithm for 3-Tuple Lattice Sieving', arXiv:2510.08473"
      provenance: retrieved
      claim: >-
        Quantum SVP algorithm at time 2^{0.2846d+o(d)}, memory 2^0.1887d
        classical+QCRAM bits and 2^o(d) qubits, improving the prior quantum
        3-tuple exponent 0.3098; framed by its authors as the fastest known
        quantum SVP algorithm under a memory ceiling of 2^0.1887d.
      verified_by: >-
        idea-generator subagent (WebFetch of the arXiv abstract page this
        session, 2026-08-28; full PDF not read; the paper's own stated
        "heuristic assumptions verified by extensive experiments" were NOT
        independently checked)
    - ref: IDEA-20260805-cdc87d
      provenance: internal
      claim: >-
        Derives the closed-form crossover/Pareto framework for SVP oracles
        summarized by exponent pairs (c_T, c_M); records classical constants
        c_T=0.292, c_M=0.2075 (both themselves relayed, not independently
        verified there) and the derived beta*(1)=1433 / 35.1-35.9-29.7-bit-
        gap figures this proposal's harness must reproduce before trusting
        it on new inputs.
      verified_by: "idea-generator subagent (read in full this session)"
    - ref: IDEA-20260805-690de8
      provenance: internal
      claim: >-
        Records the archived cost_baseline_report path
        (coordination/goals/GOAL-MLKEM-001/batches/BATCH-002/tasks/
        TASK-20260722-206/cost_baseline_report.yaml) and its memory-routing
        cost figures (14.3/22.6/30.6 bits raise at ML-KEM-512/768/1024) used
        here as the memory-ceiling context.
      verified_by: "idea-generator subagent (read in full this session)"
    - ref: "recalled quantum 2-list ('quantum walk') sieve, ~0.2570 time and memory exponent (Laarhoven-style)"
      provenance: recalled
      claim: >-
        Commonly cited quantum 2-list sieve exponent, used here only as an
        UNCONFIRMED comparison baseline against the new 3-tuple point.
      verified_by: null

  assumptions:
    - >-
      That 'd' in the sieve papers and 'beta' in this program's own
      BKZ-based estimator denote directly comparable dimension conventions;
      this is common but not automatic and is checked in Stage 0.
    - >-
      That the program's own archived memory-routing cost figures are
      current and were not themselves already revised since 690de8 read them.

  proof_search_map:
    bottleneck: >-
      Whether ML-KEM's assumed attacker memory ceiling sits above or below
      2^{0.1887*beta} at its own required block sizes.
    baseline_embedding:
      parameter_slice: >-
        The classical-only regime already solved by cdc87d (alpha=0,1) is
        the baseline slice; this proposal is its direct quantum-regime
        extension using the same formula machinery.
      reproduction_check: >-
        Reproduce cdc87d's own classical numbers (beta*(1)=1433, the
        35.1/35.9/29.7-bit gaps) with the SAME arithmetic harness before it
        is trusted on the new quantum inputs.
    observation_collision:
      observable: "the crossover block size beta*(memory-ceiling)"
      distinct_preimage_search: >-
        Not a collision-search proposal; the relevant discriminator is a
        plain threshold comparison (is ML-KEM's required beta above or below
        the crossover), stated as such rather than framed as a collision.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Specialize cdc87d's general alpha-charging formula to the concrete
          memory-ceiling values this program has already recorded for
          ML-KEM, rather than leaving alpha abstract.
        predicted_gain: >-
          A concrete bit-gap number per parameter set, or a concrete "not
          applicable, memory ceiling not exceeded" verdict.
    quantifier_order: >-
      For each of ML-KEM-512/768/1024's own already-computed required beta:
      is beta*0.1887 <= log2(assumed memory ceiling)? A plain numerical
      inequality per instance, not a universally-quantified claim.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most, an arithmetic consequence of the cited external exponents
        and the program's own cited memory figures, both still second-hand.
      nearby_object_control: >-
        The classical-only case (cdc87d) is the nearby, already-solved
        object; the harness must reproduce it before being trusted on the
        new case.
    proof_obligations:
      - claim: "harness reproduces cdc87d's own classical crossover numbers"
        responsibility: baseline
      - claim: "0.1887 does not exceed the confirmed quantum 2-list memory exponent"
        responsibility: strictness
      - claim: "the memory-ceiling figures are shown to apply to a quantum adversary model, not only classical"
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        block size beta at which beta*0.1887 = log2(assumed attacker memory
        ceiling), for each of ML-KEM-512/768/1024's own required beta
      direction: different
      minimum_effect: >-
        No value pre-specified -- this is the genuinely open, decision-
        relevant quantity. PRE-REGISTERED DECISION RULE: if the ACTUAL
        required beta for any ML-KEM parameter set exceeds this crossover
        value, H1 is supported; otherwise H0 stands.
    - metric: >-
        time-exponent gap (0.2846 minus the confirmed quantum 2-list
        exponent) converted to bits at ML-KEM's actual beta, versus the
        memory saving in bits
      direction: different
      minimum_effect: >-
        Reported as a signed number (positive = 3-tuple sieve costs more
        time than it saves in memory-equivalent terms under cdc87d's own
        alpha-charging convention; negative = a net win). No magnitude
        pre-specified.

  minimal_test:
    design: >-
      Stage 0 (~1h, zero compute): re-attempt to confirm the quantum 2-list
      sieve baseline exponent (the weakest link, currently only recalled)
      via a second, independent search/fetch, and re-read the archived
      cost_baseline_report's memory-routing section and ML-KEM block sizes
      in full (currently known only second-hand via 690de8/cdc87d
      citations). Stage 1 (spreadsheet arithmetic, minutes, zero compute):
      apply cdc87d's closed-form machinery with the new (0.2846, 0.1887)
      pair and the confirmed baseline, computing the crossover and bit-gap
      for all three ML-KEM parameter sets. Stage 2 (optional): re-derive the
      memory-routing bit figures from scratch if checkable at low cost;
      otherwise relay them exactly as 690de8 already does.
    controls:
      - >-
        REPRODUCTION CONTROL: reproduce cdc87d's own classical numbers
        (beta*(1)=1433, 35.1/35.9/29.7-bit gaps) with the same arithmetic
        harness before trusting it on the new quantum inputs.
      - >-
        PARAMETRIC-BASELINE CONTROL: if Stage 0 cannot confirm the quantum
        2-list sieve exponent, report the comparison PARAMETRICALLY (a
        sensitivity table) rather than asserting a single verdict.
      - >-
        SANITY BOUND: 0.1887 must be checked against the trivial floor
        (>= 0) and against the confirmed quantum 2-list memory exponent
        (0.1887 should be markedly below it, per the paper's own "memory-
        limited" framing); a violation flags a transcription error and voids
        the comparison until fixed.
    required_metrics:
      - "confirmed or flagged-unconfirmed quantum 2-list sieve time/memory exponents, with source"
      - "ML-KEM-512/768/1024 required block sizes beta, with exact archived-report path"
      - "assumed attacker memory ceiling per parameter set, with source"
      - "computed crossover beta and bit-gap per parameter set"
      - "reproduction check of cdc87d's own classical numbers using this harness"

  falsification_conditions:
    - "The harness fails to reproduce cdc87d's own published classical crossover numbers"
    - "0.1887 exceeds the confirmed quantum 2-list sieve's memory exponent once verified (indicates a misread of the source paper's framing)"
    - "The archived cost_baseline_report, on full re-read, already incorporates a quantum tuple-sieve memory-constrained point (this record would then be a duplicate, not a new finding, and must say so)"

  confounders:
    - >-
      EVERY numeric exponent here (0.2846, 0.1887, 0.292, 0.2075, and the
      recalled ~0.2570) is either second-hand (abstract-level WebFetch) or
      already flagged as relayed by the internal record it is drawn from.
      This proposal changes no number's provenance; it recombines already-
      uncertain numbers, and the uncertainty compounds rather than cancels.
    - >-
      All exponents carry undisclosed o(d) terms; at ML-KEM's real block
      sizes (hundreds, not asymptotic), this is exactly the weakness cdc87d
      already flagged for its own classical constants, unchanged here.
    - >-
      The source paper's claim that its "heuristic assumptions were verified
      by extensive experiments" is relayed, not confirmed by this record.

  interpretation_limits:
    - >-
      This is a cost-model bookkeeping exercise, not new mathematics and not
      an attack. It recovers no key and proposes no new algorithm.
    - >-
      A finding that H1 holds would flag an INPUT to this program's security
      bookkeeping as potentially outdated; it would NOT itself constitute a
      new attack on ML-KEM, and any citation of this record as an attack
      would be a miscitation.
    - >-
      If Stage 0 cannot confirm the quantum 2-list sieve baseline, the
      quantitative verdict is suspended and only the parametric sensitivity
      table is a valid deliverable.

  heuristic_assumptions:
    - id: H1
      statement: >-
        The recalled quantum 2-list ("quantum walk") sieve exponent of
        approximately 0.2570 for both time and memory is the correct prior
        baseline to compare the new 3-tuple point against, imitating the
        standard practice (established for the classical case by BDGL/
        Kirshanova-Laarhoven) of comparing a new sieve variant against the
        best unconstrained-memory point on the same frontier.
      rigorous_support: >-
        RECALLED, NOT VERIFIED THIS SESSION -- the single weakest link in
        this proposal, flagged rather than hidden.
      validation_plan: >-
        A second, independent WebSearch/WebFetch (or an in-repo pinned
        quantum-cost reference, if one exists) to confirm the best-known
        quantum 2-list sieve time and memory exponents before finalizing any
        comparison; if unconfirmed, report the comparison parametrically.
    - id: H2
      statement: >-
        This program's own archived memory-routing cost figures apply
        unchanged to a QUANTUM adversary model, imitating the same
        accounting convention already used for the classical case in the
        same archived report.
      rigorous_support: >-
        None claimed as rigorous; an accounting-consistency assumption made
        explicit because 690de8 already flags that report's underlying
        external sources as relayed and unread.
      validation_plan: >-
        Re-read the archived cost_baseline_report's memory-routing section
        in full this session (not yet done) to confirm whether it is
        quantum-adversary-agnostic or classical-only, before the comparison
        is finalized; report explicitly if it does not address the quantum
        case at all.

  target_complexity:
    time_exponent: >-
      As reported externally, not re-derived: 2^{0.2846d+o(d)} (quantum
      3-tuple sieve) versus the recalled-unconfirmed ~2^{0.2570d} (quantum
      2-list sieve) versus 2^{0.292*beta} (classical, per cdc87d) -- all
      against the same dimension convention d ~ beta, itself to be checked
      for consistency in Stage 0.
    memory_exponent: >-
      2^{0.1887d} classical+QCRAM bits (new point) versus ~2^{0.2570d}
      (recalled, unconfirmed) versus 2^{0.2075*beta} classical (per cdc87d).
    best_known: >-
      Whatever this program's pinned lattice-estimator currently reports for
      ML-KEM-512/768/1024's classical and quantum bit-security, read from
      the archived cost_baseline_report, not re-derived here.
    hidden_overhead: >-
      All o(d) terms in every exponent above are undisclosed by the sources
      at hand; flagged, per cdc87d's own precedent, as the framework's
      central weakness rather than absorbed silently.
    tradeoff_note: >-
      This proposal IS the tradeoff analysis: it exists specifically to
      locate whether the new time-for-memory point changes which oracle a
      memory-constrained quantum adversary would use against ML-KEM.

  dominated_by: >-
    n/a for the audit itself (no new algorithm proposed). On the frontier it
    audits -- checked rows: classical BDGL 2-sieve (0.292/0.2075, per
    cdc87d), the recalled-unconfirmed quantum 2-list sieve (~0.2570/~0.2570),
    classical enumeration (per cdc87d's c_E), and the new quantum 3-tuple
    sieve point (0.2846/0.1887, this session) -- whether the new point
    dominates or is dominated at ML-KEM's specific memory ceiling is exactly
    the open question Stage 1 answers. It is NOT settled in advance; the
    honest interim answer is "contingent on Stage 0/1, reported both ways,"
    which is why this field cannot be collapsed to a single value before the
    arithmetic is run.
  sota_delta: >-
    No attack; no independently-verified time/memory figure for ML-KEM
    changes as a result of this proposal alone. The deliverable is either
    (a) confirmation that the program's existing quantum bit-security
    figures already dominate this new point (delta = 0, closes a lane
    cheaply) or (b) a flagged discrepancy of a specific number of bits at a
    specific parameter set, naming exactly where the program's bookkeeping
    should be revisited.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  source_refs:
    - RQ-MLKEM-001
    - IDEA-20260805-cdc87d
    - IDEA-20260805-690de8
