idea:
  id: IDEA-20260806-e4c719
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  added: '2026-08-06'
  title: >-
    The exponent identity has a third parameter and the committed census does not
    contain it: exponent = c*log_p(det)/(2*rank), where c is the degree-count exponent
    of the ambient morphism category -- one formula that returns 1/3, 1/2 and 1/4
    exactly, and one cell where IDEA-20260805-e7ee4a's two-parameter criterion returns
    the wrong number
  class: theory

  claim: >-
    IDEA-20260805-e7ee4a installs the admissibility criterion log_p(det)/rank <= 1/4 for
    an auxiliary target and censuses candidates against it. THAT CRITERION IS THE c = 2
    SPECIAL CASE OF A THREE-PARAMETER IDENTITY, AND IT RETURNS THE WRONG NUMBER ON A
    CELL WHOSE ANSWER IS DERIVABLE IN THREE LINES.
    Let a search be specified by (i) an ambient category of morphisms in which the
    number of morphisms of degree at most X out of a fixed object is Theta~(X^c) -- call
    c the DEGREE-COUNT EXPONENT -- and (ii) a target map tau whose Hom-lattice, under the
    degree form, has rank r and determinant D. Then Hermite gives a minimal degree
    m = Theta~(D^{1/r}); a balanced two-way split admits half-degrees up to
    X = Theta~(m^{1/2}); and the list on each side has cardinality Theta~(X^c). Hence
      TIME AND MEMORY EXPONENT  E(c, r, D) = (c / (2r)) * log_p(D).
    THREE CELLS, ALL DERIVED BEFORE ANY CENSUS, AND ALL REPRODUCING A NUMBER ALREADY
    ON THIS PROGRAMME'S FRONTIER:
      (c, r, D) = (2, 3, p)    -> E = 1/3. The incumbent. c = 2 because the number of
                                 cyclic isogenies of degree exactly d out of a fixed
                                 curve is d*prod(1+1/l) ~ d, so summing to X gives ~X^2/2
                                 -- which is exactly the frozen source's own bookkeeping
                                 (Lemma 3.2 upper bound Psi(X,B)*X*(log X + 2), and
                                 section 4.1's lower bound "using that the number of
                                 isogenies of degree d is at least d", both READ).
                                 r = 3 by the trace-vanishing selection rule that
                                 e7ee4a itself derives; D ~ p.
      (c, r, D) = (2, 4, p^2)  -> E = 1/2. The generic-pair cell: Hom(E, E') for
                                 unrelated E' has rank 4 and determinant ~p^2. This is
                                 the classical meet-in-the-middle / Delfs-Galbraith
                                 exponent and it is e7ee4a's own decided cell.
      (c, r, D) = (1, 2, p)    -> E = 1/4. The ORIENTED cell: morphisms are ideals of an
                                 imaginary quadratic order, and the number of ideals of
                                 norm at most X is Theta(X), so c = 1, not 2. THE
                                 TWO-PARAMETER CRITERION log_p(D)/rank RETURNS 1/2 HERE.
                                 THE THREE-PARAMETER IDENTITY RETURNS 1/4, AND 1/4 IS
                                 WHAT THE ELEMENTARY CLASS-GROUP ARGUMENT GIVES: the
                                 class number of an order of discriminant ~p is ~p^{1/2},
                                 and a birthday search over a group of size h costs
                                 h^{1/2} = p^{1/4}.
    THE DELIVERABLE IS THEREFORE TWOFOLD AND BOTH HALVES ARE FALSIFIABLE. (A) A CORRECTION:
    the census criterion this goal has adopted is missing a parameter and its
    admissibility test must be rewritten as c*log_p(det)/(2*rank) <= 1/4. (B) A NAMED
    THIRD LEVER: at the incumbent's own (r, D) = (3, p), reaching exponent 1/4 requires
    exactly c = 3/2 -- a listable family whose cardinality at degree bound X grows as
    X^{3/2} instead of X^2 while still containing a valid split of the minimal isogeny.
    NO SUCH FAMILY IS EXHIBITED AND NONE IS CLAIMED TO EXIST. Per RQ-SSIQ-9702af's
    standing constraint, 0.25 is a target and not a claim, and nothing here states,
    implies, or is structured to suggest that a p^{1/4} algorithm exists or is near.
    THE RECORD'S OWN EXPECTED OUTCOME IS A CLOSURE: c = 2 is a theorem for the full
    category, and every restriction with a p^{-o(1)} hit probability is argued below to
    leave c = 2 unchanged, so the honest predicted deliverable is a named obstruction on
    the c axis plus forward guidance naming the one class that escapes it.

  discriminated_from:
    nearest_existing_idea: IDEA-20260805-e7ee4a
    why_it_is_the_nearest: >-
      Both records treat the exponent as a function of the Hom-lattice attached to a
      choice of target, both use Hermite to get the minimal degree from (rank, det), and
      both propose a census of auxiliary targets against a numeric admissibility
      criterion. e7ee4a is the direct parent of this record and this record does not
      displace it.
    differing_observable: >-
      THE DEGREE-COUNT EXPONENT c, AND THE CELL WHERE ITS ABSENCE IS MEASURABLE.
      e7ee4a's tracked object is stated as "THE PAIR (rank, log_p det)" and its criterion
      is log_p(det)/rank <= 1/4. That is two numbers. This record's tracked object is a
      TRIPLE, and the third number is not cosmetic: on the oriented cell (r, D) = (2, p)
      the two-parameter criterion returns 1/2 and the three-parameter identity returns
      1/4, and 1/4 is independently derivable from the class number in three lines with
      no citation. THE DISCRIMINATING OBSERVABLE IS THEREFORE A SPECIFIC NUMBER ON A
      SPECIFIC CELL: run both formulas on the oriented cell and they disagree by a factor
      of 2 in the exponent. A census run under the two-parameter criterion would admit or
      reject cells on the wrong side of the line whenever c differs from 2, and the
      oriented cell is a worked example that this is not hypothetical.
    also_discriminated_from:
      - >-
        IDEA-20260805-250e50 -- prices the DEGREE THRESHOLD theta and a curve SCREEN with
        selectivity s. Its variables move the admitted degree and the fraction of curves
        attempted; neither is the cardinality growth rate of the morphism family at a
        fixed degree bound. Concretely: 250e50's identity is exact at c = 2 and is silent
        about any category with c different from 2, and its 1/5 result is obtained by
        moving theta, not c.
      - >-
        IDEA-20260805-062bee -- measures the covering law Pr[delta <= D] ~ c D^beta
        p^{-gamma} and derives exponent = gamma/beta. That is a DISTRIBUTION over curves
        at a fixed category; this record is a structural identity over CATEGORIES at a
        fixed distributional assumption. The two agree at the incumbent cell (both return
        1/3) and are independent elsewhere: 062bee's beta is a property of the vertex set,
        this record's c is a property of the morphism set.
      - >-
        IDEA-20260805-c60813 -- transports index calculus to the Deuring side and kills
        it on three prongs. Its tracked object is the relation. This record proposes no
        relation architecture and its kill, if it lands, is on a different axis.
      - >-
        ideas/catalogue-20260805/B1-8 and B1-10 (pre-ledger) -- the partner-map exponent
        theta_sigma/gamma_sigma and dimension-g displacement. Both vary the TARGET MAP at
        c = 2. Neither contains a degree-count exponent, and B1-10's g >= 2 cell would in
        fact need its own c computed before its exponent can be read, which is a concrete
        prediction this record makes about that entry.
      - >-
        ideas/catalogue-20260805/C1-6 (pre-ledger) -- "factorisation-shape-restricted
        listable families: compute the exchange rate from Dickman/CEP". That entry
        restricts the DEGREE SET (which multiplies the list by Psi-type densities, a
        p^{o(1)} effect at fixed c) and prices it against smoothness. This record's c is
        the exponent of the count of MORPHISMS, which at fixed degree d is ~d and is a
        geometric fact about cyclic subgroups, not a factorisation-shape fact. The two
        levers compose and are not the same lever; the record says so and computes both.

  object_first_candidate:
    tracked_object: >-
      THE TRIPLE (c, r, log_p D) attached to a pair (ambient morphism category, target
      map). Not the curve, not the isogeny, not the degree, and not the lattice: three
      numbers that jointly determine the achievable exponent through Hermite plus a
      balanced split. The triple is followed as the category and the target vary across a
      pre-registered census.
    one_step_propagation_rule: >-
      STATED EXPLICITLY, BECAUSE THE CENSUS PERFORMS EXACTLY TWO OPERATIONS AND THE
      TRIPLE MUST PROPAGATE THROUGH BOTH.
      (OP1) RESTRICT THE CATEGORY to a subfamily whose count at degree bound X is a
      X^{-epsilon} fraction of the full count. Then c -> c - epsilon, deterministically,
      by definition of the counting exponent. r and D are unchanged.
      (OP2) CHANGE THE TARGET to one whose Hom-lattice is a sublattice of index M in the
      old one, or a lattice of different rank. Then (r, D) -> (r', D') by the standard
      determinant rule (index-M sublattice of the same rank: D -> D*M^2), and c is
      unchanged.
      The two operations commute on the triple, and E(c, r, D) = c*log_p(D)/(2r) is a
      function of the triple alone. That is the deterministic one-step propagation the
      inventor protocol asks for, and it is what makes the triple a tracked object rather
      than three statistics reported side by side.
    established_families_off_limits: >-
      OFF-LIMITS AS THE PRIMARY LENS: (a) improving the degree bound for the target
      E^{(p)} itself -- lever L1, CLOSED-IN-SCOPE by EV-SSIQ-e43afd, and this record does
      not reopen it; (b) meet-in-the-middle and claw finding as ALGORITHMS -- they enter
      only as the fixed search architecture whose cost the identity expresses; (c) KLPT
      and quaternion-ideal algorithms; (d) orientation and CM descent AS AN ATTACK --
      CLOSED for GOAL-SSI-001 by DEC-20260804-3677f1 / EV-SSI-8aaad0 under the Deuring
      dichotomy, and the oriented cell appears here ONLY as a calibration cell whose
      answer is known, never as a proposed attack route; (e) torsion-image / Kani
      embeddings; (f) quantum models; (g) smoothness and Heuristic 1, which are the
      companion axis (C1's territory) and enter here only as the p^{o(1)} factor B.
      ALSO OFF-LIMITS: proposing any algorithm. This record proposes none.
    newness_score: >-
      The INGREDIENTS are entirely classical and this record says so: Hermite's bound,
      the count of cyclic subgroups of order d, the count of ideals of bounded norm, and
      the birthday bound. What this corpus does not contain -- verified in
      coordination/goals/GOAL-SSI-001/batches/BATCH-b3c87f/tasks/TASK-20260806-fd3518/duplication_audit.md
      -- is (i) the three-parameter identity in one expression, (ii) the demonstration
      that the committed two-parameter criterion misprices a cell whose answer is known,
      (iii) the identification of c as a lever with its exact target value 3/2 for
      exponent 1/4 at the incumbent's (r, D), and (iv) the closure argument on the c axis
      with its escape class named.
    testability_score: >-
      Very high and entirely zero-compute for the primary deliverable. Every cell is
      three lines of counting. The optional toy arm counts cyclic isogenies of degree
      <= X out of a fixed supersingular curve at small p and fits the exponent c, which
      is a direct empirical check that the identity's most load-bearing input is 2.
    survival_score: >-
      The triple survives every operation the census performs, by construction. It
      DISSOLVES when the search architecture is no longer a balanced two-way split on a
      Hermite-bounded minimal morphism -- for instance for a relation-collection
      architecture (IDEA-20260805-c60813's object), for which E(c, r, D) is simply not
      defined. That boundary is stated in interpretation_limits and is the record's
      honest domain of applicability.

  mechanism: >-
    ALL PAPER QUOTATIONS ARE FROM inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, READ IN
    THIS SESSION.

    STEP 1 -- THE DERIVATION, IN FOUR LINES, WITH EACH LINE ATTRIBUTED.
    (L1) MINIMAL DEGREE. Hermite/Minkowski on a positive-definite rank-r lattice of
    determinant D gives a first minimum m <= gamma_r * D^{1/r}, so
    log_p m = (1/r) log_p D up to constants. For the incumbent this is exactly e7ee4a's
    derivation: rank 3, determinant asymptotic to p, min <= gamma_3 (p/4)^{1/3} =
    (p/2)^{1/3}, reproducing Theorem 1.5's constant.
    (L2) THE SPLIT. Lemma 3.4 of the frozen source (lines 177-185, READ) splits the
    minimal morphism as phi = eta o psi with deg psi <= X and deg eta <= B*m/X, and
    balancing gives X = (B m)^{1/2}, i.e. log_p X = (1/2) log_p m + o(1). The balance is
    optimal because the cost is a SUM of two list sizes subject to a fixed PRODUCT
    constraint on the degrees; this is the "birthday optimality" fact this campaign has
    already closed, and it is inherited here rather than re-derived.
    (L3) THE LIST SIZE, WHICH IS WHERE c ENTERS AND WHERE THE COMMITTED CRITERION IS
    SILENT. The cost of one attempt is the cardinality of the list of morphisms of degree
    at most X out of the fixed object. For CYCLIC ISOGENIES OF ELLIPTIC CURVES that
    cardinality is Theta~(X^2): the number of cyclic subgroups of order exactly d is
    d*prod_{l|d}(1+1/l), so summing over d <= X gives ~X^2/2. The frozen source uses this
    on both sides -- Lemma 3.2's upper bound Psi(X,B)*X*(log X + 2) and section 4.1's
    "using that the number of isogenies of degree d is at least d" (both READ). So c = 2
    is not an assumption for the incumbent cell; it is the paper's own accounting.
    (L4) COMPOSE. E = log_p(list) = c * log_p X = (c/2) log_p m = (c/(2r)) log_p D.

    STEP 2 -- THE THREE CALIBRATION CELLS AND WHY THE THIRD ONE IS THE WHOLE POINT.
    Cell 1 (incumbent, unoriented, target E^{(p)}): c = 2, r = 3, log_p D = 1 -> 1/3.
    Cell 2 (unoriented, generic target E'): Hom(E, E') is a rank-4 lattice of determinant
    ~p^2 (the degree form on a rank-4 module over an order of reduced discriminant p),
    so c = 2, r = 4, log_p D = 2 -> 1/2. This is Delfs-Galbraith / meet-in-the-middle and
    it is e7ee4a's own already-decided cell, so cells 1 and 2 are BASELINE REPRODUCTIONS
    and not new content.
    Cell 3 (ORIENTED): here the morphisms are ideals of an imaginary quadratic order of
    discriminant of size ~p, and the count of ideals of norm at most X is Theta(X): c = 1.
    The two-parameter criterion sees only (r, D) = (2, p) and returns log_p(D)/r = 1/2.
    The three-parameter identity returns (1/(2*2))*1 = 1/4. THE INDEPENDENT CHECK,
    DERIVED IN-HOUSE SO THAT NO UNREACHABLE CITATION IS LOAD-BEARING: the class number of
    an imaginary quadratic order of discriminant of size ~p is ~p^{1/2} (Brauer-Siegel,
    up to p^{o(1)}), and a meet-in-the-middle over a group of size h costs h^{1/2}, i.e.
    p^{1/4}. THE THREE-PARAMETER IDENTITY AGREES WITH THE ELEMENTARY ARGUMENT AND THE
    TWO-PARAMETER ONE DOES NOT.
    STATED SO IT CANNOT BE MISREAD, PER RQ-SSIQ-9702af'S EXPLICIT CONSTRAINT: this cell
    is a CALIBRATION CELL for the identity. It is not evidence that exponent 1/4 is
    reachable for the general F_{p^2} problem, it is not the contested
    relayed_from_abstract Delfs-Galbraith figure of KN-LIT-078 (which is carried in this
    corpus at that confidence and is CONTESTED per KN-TECH-058 RC4, and which this record
    does NOT rely on), and reaching this cell at all requires an orientation, which is
    CLOSED for GOAL-SSI-001 by DEC-20260804-3677f1 under the Deuring dichotomy.

    STEP 3 -- THE LEVER, WITH ITS EXACT NUMERIC TARGET. Since E = c*log_p(D)/(2r), there
    are exactly three levers and this goal has censused two. At the incumbent's own
    (r, log_p D) = (3, 1), the exponent is c/6. Therefore:
      c = 2   -> 1/3   (incumbent)
      c = 3/2 -> 1/4   (this goal's stated target)
      c = 1   -> 1/6
    A LISTABLE FAMILY WITH c = 3/2 IS EXACTLY WHAT WOULD BE REQUIRED, AND STATING THAT
    NUMBER IS THE RECORD'S CONTRIBUTION TO THE LEVER MAP. RQ-SSIQ-9702af already names
    "restricted-family list constructions with measured cardinality-versus-hit-probability
    tradeoff" among its in-scope methods; no committed record has attached a numeric
    target to that method, and 3/2 is the number.

    STEP 4 -- THE CLOSURE THE RECORD EXPECTS TO REACH, WITH ITS MECHANISM. c = 2 is a
    theorem for the full category of cyclic isogenies, so lowering c means restricting to
    a subfamily F with |F ∩ {deg <= X}| = X^{c'} for c' < 2. The obstruction is the
    EXCHANGE RATE: for the algorithm to still succeed, F must contain the first half psi
    of the minimal isogeny. For a family chosen WITHOUT reference to phi, the probability
    that psi lands in F is the density of F, namely X^{c'-2}. Total cost is then
    (list size)/(hit probability) = X^{c'} * X^{2-c'} = X^2 -- IDENTICALLY UNCHANGED.
    THIS IS THE 1:1 EXCHANGE RATE, AND IT IS EXACT RATHER THAN HEURISTIC FOR ANY FAMILY
    INDEPENDENT OF THE TARGET. Two named worked examples, both computed here:
      (a) FIXED-PRIME-POWER FAMILY. Restrict to degrees that are powers of a single
      prime l. The count at degree <= X is ~X (c' = 1), so the list is p^{1/6} instead of
      p^{1/3} -- but the minimal degree is almost never a pure l-power, and the hit
      probability collapses by the same X factor. Net: unchanged.
      (b) SMOOTHNESS ITSELF. The incumbent already restricts to B-smooth degrees. The
      count drops by the smooth density and the success probability drops by P0 = p^{-o(1)},
      and the frozen source's own proof of Theorem 1.1 (lines 210-218, READ) shows the two
      cancel to p^{o(1)}. THE INCUMBENT IS THEREFORE ITSELF AN INSTANCE OF THE c LEVER
      OPERATING AT THE o(1) SCALE, WHICH IS EVIDENCE THAT THE 1:1 RATE IS THE GENERIC
      BEHAVIOUR RATHER THAN AN ARTIFACT OF ONE EXAMPLE.
    THEREFORE THE FORWARD GUIDANCE, WHICH IS THE PART THAT REMAINS OPEN: the only families
    that can beat 1:1 are TARGET-CORRELATED -- families whose membership is more likely
    for the actual half psi than for a random morphism of the same degree. Any future
    proposal on this axis must exhibit that correlation and report the two numbers
    (c', hit probability) separately. That is a screen no committed record currently
    imposes.

