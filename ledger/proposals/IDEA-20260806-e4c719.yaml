  lossy_projection_identifiability_audit:
    projection: >-
      A pair (ambient morphism category with its full degree-indexed morphism sets, target
      map tau with its Hom-lattice and Gram matrix) is projected to three real numbers
      (c, r, log_p D).
    what_is_discarded: >-
      The entire Gram matrix beyond its determinant, every successive minimum beyond the
      first, the isometry class of the lattice, the morphisms themselves, the curves, and
      all arithmetic structure of the degrees.
    why_genuinely_lossy: >-
      Two targets with the same (r, D) and wildly different successive-minima profiles --
      one balanced, one with lambda_1 far below Hermite and lambda_r far above -- have the
      same image. The fibre is the whole genus of lattices of that rank and determinant,
      which is large. Nothing about the underlying object is recoverable from three
      numbers.
    why_compatible_with_the_operations: >-
      The census performs exactly two operations, OP1 (restrict the category) and OP2
      (change the target), and the triple transforms under each by a deterministic rule
      given in one_step_propagation_rule: OP1 sends c -> c - epsilon and fixes (r, D);
      OP2 fixes c and sends (r, D) -> (r', D') by the determinant rule. The retained part
      therefore propagates deterministically under the operations the record actually
      performs.
    is_it_only_a_change_of_coordinates: >-
      NO. The canonical failure of docs/inventor-protocol.md section 2 -- (Delta, Pi)
      recoverable as roots of t^2 + Delta t + Pi -- fails to have an analogue: three real
      numbers cannot reconstruct a lattice, let alone a category.
      BUT THE HONEST CAVEAT, STATED RATHER THAN BURIED: relative to e7ee4a's PAIR, this
      record's TRIPLE is strictly more information, so with respect to that record alone
      the move is an ENLARGEMENT rather than a further projection. The record does not
      claim to be a new lossy object relative to e7ee4a; it claims e7ee4a's projection was
      TOO lossy -- it discarded a parameter that the propagation rule needs -- and that a
      projection which discards something the operations require is not a valid tracked
      object at all. That is the precise sense in which the two differ, and it is a
      testable difference (the oriented cell), not a framing difference.
    mirror_failure_check: >-
      CHECKED, AND THE CHECK RETURNS "NOT CONSTANT", WITH A DERIVED SPREAD. c is forced to
      vary across the census: it is exactly 2 for elliptic-curve cyclic isogenies (a
      counting theorem) and exactly 1 for ideals of an imaginary quadratic order (a
      counting theorem). Both values are occupied by cells the census must contain, so the
      comparator spread on c is at least 1 and the parameter is not constant. This is the
      KN-TECH-1a5b7e zero-spread tell, checked and not fired.

  null_object_control:
    primary_null: >-
      THE c-BLIND ARM. Run the identical census machinery with c HARD-WIRED TO 2 on every
      cell -- i.e. run e7ee4a's committed two-parameter criterion -- and compare the two
      output tables cell by cell. THE PRE-REGISTERED DISCRIMINATION: the two tables must
      AGREE on cells 1 and 2 (both c = 2) and DISAGREE by exactly a factor of 2 in the
      exponent on the oriented cell (1/2 versus 1/4).
    why_it_can_fail: >-
      IT CAN FAIL IN A WAY THAT DESTROYS THE RECORD. If the two tables agree everywhere,
      then c is not a live parameter in the census as implemented, the whole record is a
      re-labelling of e7ee4a, and it must be withdrawn by a superseding record. If they
      disagree on cells 1 or 2 -- the two cells whose answers are already committed -- then
      the three-parameter identity fails its own baseline reproduction and no cell may be
      reported.
    secondary_nulls:
      - >-
        FORCED-VALUE GATE ON c ITSELF. c for elliptic-curve cyclic isogenies is 2 by a
        counting theorem, not an estimate. The optional toy arm measures it by exact
        enumeration and must return 2.00 within the declared band. A measured c different
        from 2 at toy scale means the enumeration is wrong (or the record's counting is),
        and nothing downstream may be read.
      - >-
        NEARBY-OBJECT CONTROL WHERE THE IDENTITY MUST REFUSE TO APPLY. Present the
        machinery with the plain prime-field ECDLP on an ordinary curve -- an object with
        no target map and no Hom-lattice, where the answer is p^{1/2} by Pollard rho for
        reasons the identity does not model, and where KN-FIND-7e4b90 already records that
        the rank-4 quaternion structure is absent. THE MACHINERY MUST RETURN
        "NOT APPLICABLE" RATHER THAN A NUMBER. A formula that always returns something has
        no stated domain and its agreements are not evidence.
      - >-
        EXCHANGE-RATE CONTROL. For each restricted family in the closure argument, report
        c' and the hit probability SEPARATELY and check that their product reproduces
        X^2. A family for which the product is not X^2 either beats 1:1 -- the record's
        positive branch -- or has been miscounted.

  assumptions:
    - >-
      The search architecture is fixed: a balanced two-way split of a Hermite-bounded
      minimal morphism, joined by a keyed collision, as in Algorithm 2 of the frozen
      source. The identity is a statement about THAT architecture and about nothing else.
      Architectures outside it -- relation collection, descent, higher-dimensional
      embeddings -- are outside the identity's domain and the record refuses to score them.
    - >-
      The minimal degree is achieved at the Hermite bound up to p^{o(1)}. Where it is not,
      the exponent is set by the actual first minimum and the identity's D^{1/r} is an
      upper bound. This is exactly the distributional question IDEA-20260805-062bee
      measures, and this record inherits its uncertainty rather than resolving it.
    - >-
      Smoothness and Heuristic 1 contribute p^{o(1)} on both the list-size and
      success-probability sides and are carried as a single B factor. The record does not
      re-derive them and does not weaken the incumbent's conditionality.

  proof_search_map:
    bottleneck: >-
      The cardinality of the listable family at the split degree bound X. Every exponent
      in this architecture is c*log X, and nothing else in the pipeline carries an
      exponent once (r, D) are fixed.
    baseline_embedding:
      parameter_slice: >-
        (c, r, log_p D) = (2, 3, 1), which is the incumbent, and (2, 4, 2), which is the
        classical meet-in-the-middle / Delfs-Galbraith exponent.
      reproduction_check: >-
        SYMBOLIC AND EXACT: E(2,3,1) = 2/(2*3) = 1/3 and E(2,4,2) = 2*2/(2*4) = 1/2. Both
        are checked before any new cell is evaluated, and a failure of either halts the
        census. A third, independent embedding is available and is used: at theta = 1/4
        the incumbent's own campaign has committed the reading 3/8
        (IDEA-20260805-250e50 cites
        coordination/goals/GOAL-SSIQ-001/batches/BATCH-001/tasks/TASK-20260805-87e568/task_report.yaml);
        this record's identity at a lowered threshold must be shown to be COMPATIBLE with
        250e50's E(theta, s, gamma) at c = 2 rather than to contradict it, and that
        compatibility check is a required metric.
    observation_collision:
      observable: >-
        The exponent E. Two distinct triples with the same E are a collision.
      distinct_preimage_search: >-
        PERFORMED, AND COLLISIONS EXIST AND ARE REPORTED: (2, 3, 1) and (1, 3, 1/2) both
        return 1/3; (2, 4, 2) and (1, 2, 1) do NOT collide (1/2 versus 1/4), which is the
        separating pair the record is built on. The existence of E-collisions means the
        identity is NOT an identifiability claim about the underlying object -- two
        different categories can give the same exponent -- and the record must never be
        read as classifying objects by their exponent. What it classifies is search costs.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace the pair (rank, log_p det) by the triple (c, rank, log_p det). The
          motivation is exactly the transform's stated rationale: preserve more state than
          the final goal requires, because the extra state is what survives the census's
          own recursion (OP1 changes c and nothing else, so a census that does not carry c
          cannot follow its own operation).
        predicted_gain: >-
          No cost gain. The gain is correctness of the screen: cells with c different from
          2 are currently mispriced by a factor c/2 in the exponent.
      - transform: baseline_lift
        proposed_object: >-
          Enlarge the certificate family from "targets" to "(category, target) pairs" and
          ask for a strict inward improvement, i.e. a pair with E < 1/3 rather than merely
          a pair that is admissible.
        predicted_gain: >-
          The exact requirement c = 3/2 at (r, log_p D) = (3, 1) for E = 1/4. Predicted
          outcome: no such family, by the 1:1 exchange-rate argument, unless
          target-correlated.
    quantifier_order: >-
      THE CLAIM: for all primes p, for all pairs (C, tau) in the pre-registered census
      where C is a morphism category with degree-count exponent c and tau a target map
      whose Hom-lattice has rank r and determinant D, IF the search architecture is a
      balanced two-way split with a keyed collision, THEN the attempt cost is
      p^{c log_p(D)/(2r) + o(1)}.
      WHAT THE WITNESS MAY DEPEND ON: c, r and D may depend on p (they are p-indexed
      families); the implied constants may not depend on the instance E. THE FAILURE MODE
      THE ORDER IS WRITTEN TO EXPOSE: a "restricted family" whose definition depends on
      the instance's own minimal isogeny phi is NOT admissible under this order, because
      phi is not available to the algorithm. That is precisely the target-correlated class
      named as open in STEP 4, and writing the quantifier makes the illegality of the
      naive version explicit.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Within the balanced-split architecture, the attempt cost exponent is
        c*log_p(D)/(2r), and reaching 1/4 at (r, log_p D) = (3, 1) requires exactly
        c = 3/2." IT CAN NEVER CERTIFY that no such family exists, and it can never
        certify a lower bound for any architecture outside the balanced split. It is a
        cost identity plus a survey, not an impossibility theorem.
      nearby_object_control: >-
        The plain prime-field ECDLP (see null_object_control). The identity must refuse to
        apply. A method that scores an object with no target map has not identified the
        load-bearing structure.
    proof_obligations:
      - claim: The number of cyclic isogenies of degree <= X from a fixed supersingular E is Theta~(X^2).
        responsibility: size
      - claim: The number of ideals of norm <= X in an imaginary quadratic order is Theta(X).
        responsibility: size
      - claim: Balanced split minimises the sum of two list sizes at fixed degree product.
        responsibility: baseline
      - claim: A target-independent restriction to density X^{-epsilon} costs exactly X^{-epsilon} in hit probability.
        responsibility: success_probability
      - claim: The identity is undefined outside the balanced-split architecture.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        E_3(cell) - E_2(cell): the difference, in exponent, between the three-parameter
        identity and the committed two-parameter criterion, evaluated on the
        pre-registered census cells {incumbent, generic target, oriented, superspecial
        surface g=2, prescribed-torsion target, larger-field target}
      direction: different
      minimum_effect: >-
        EXACTLY 0 on the incumbent and generic-target cells (both c = 2), and EXACTLY
        +1/4 on the oriented cell (1/2 versus 1/4). A non-zero difference on either c = 2
        cell falsifies the identity's baseline reproduction and halts the census.
    - metric: >-
        c_measured: the fitted exponent of #{cyclic isogenies of degree <= X out of a
        fixed supersingular E} against X, by exact enumeration at toy p
      direction: different
      minimum_effect: >-
        2.00 +/- 0.10 over the declared X window with fit quality R^2 >= 0.98. This is a
        FORCED VALUE (a counting theorem, not an estimate) and a deviation is an
        instrument defect, not a finding.
    - metric: >-
        exchange_product: (list-size factor) x (hit-probability factor) for each restricted
        family in the pre-registered family list {fixed-prime-power, B-smooth, squarefree
        degrees, degrees in a fixed residue class, degrees with a divisor in a window}
      direction: different
      minimum_effect: >-
        EXACTLY X^2 (i.e. product of exponents summing to 2) for every target-independent
        family. Any family whose product is strictly below X^2 beats the 1:1 rate and is
        the record's positive branch; it would be the first named c-lever in this goal and
        would require immediate independent review before any statement outside the ledger.
    - metric: >-
        c_required(target-exponent): the value of c needed to reach a stated exponent at
        the incumbent's (r, log_p D) = (3, 1)
      direction: lower
      minimum_effect: >-
        DERIVED VALUES, PRE-REGISTERED: c = 2 for 1/3, c = 3/2 for 1/4, c = 1 for 1/6.
        The deliverable is these numbers as a screen, not a claim that any is achievable.
    - metric: >-
        compatibility_residual: |E_3(c=2, r=3, D=p^{3theta}) - E_250e50(theta, s=0, gamma=theta)|
        evaluated at theta in {1/6, 1/5, 1/4, 1/3}
      direction: lower
      minimum_effect: >-
        The two committed accountings must agree at c = 2 wherever both are defined, up to
        o(1). A residual bounded away from 0 means one of the two identities is wrong and
        the campaign has two incompatible cost models, which would itself be the most
        consequential outcome available here.

  minimal_test:
    design: >-
      ZERO COMPUTE FOR THE PRIMARY DELIVERABLE. Three stages, cheapest first.
      STAGE 0 (pen and paper, ~1 hour): write E(c, r, D), run the two baseline-reproduction
      gates symbolically (1/3 and 1/2), run the c-blind null arm on all six census cells,
      and run the not-applicable control on the plain ECDLP. If either baseline gate fails,
      the record ends here at zero cost.
      STAGE 1 (pen and paper, ~2 hours): compute (c, r, log_p D) for every cell in the
      pre-registered census, marking each cell CLOSED with its triple or OPEN with the
      exact quantity that must be computed. Compute exchange_product for each of the five
      restricted families. Compute compatibility_residual against IDEA-20260805-250e50 at
      four theta values.
      STAGE 2 (optional, minutes, pure Python + numpy, no SageMath): exact enumeration of
      cyclic isogenies of degree <= X out of a fixed supersingular curve at
      p in {103, 251, 503, 1019} and X up to the largest value the graph supports, fitting
      c_measured. This is the forced-value gate on the identity's single most load-bearing
      input, and it is TOY SCALE and labelled as such.
    controls:
      - >-
        c-BLIND NULL ARM (primary, can fail): the committed two-parameter criterion run on
        the identical cell list, compared cell by cell. Its output is written and
        hash-committed BEFORE the three-parameter table is read.
      - >-
        TWO BASELINE-REPRODUCTION GATES: E(2,3,1) = 1/3 and E(2,4,2) = 1/2, both forced,
        both checked symbolically before any new cell.
      - >-
        FORCED-VALUE GATE ON c: c_measured must return 2.00 at toy scale.
      - >-
        NOT-APPLICABLE CONTROL: the plain prime-field ECDLP must return NOT APPLICABLE.
      - >-
        GRADED CONTROL, >= 3 INTERIOR POINTS: exchange_product across five restricted
        families of decreasing density, with the product required to be flat at X^2 and the
        deviation reported per family rather than aggregated.
      - >-
        CROSS-MODEL CONTROL: compatibility_residual against 250e50 at four theta values.
    required_metrics:
      - the census table with (c, r, log_p D, E) per cell, machine-readable
      - the c-blind table on the same cells and the cell-by-cell difference
      - exchange_product per restricted family, with c' and hit probability reported separately
      - c_required at exponents {1/3, 1/4, 1/6}
      - compatibility_residual at four theta values
      - c_measured with its fit window, R^2 and residuals, labelled toy

  falsification_conditions:
    - >-
      Either baseline gate fails (E(2,3,1) != 1/3 or E(2,4,2) != 1/2). The identity is
      wrong and the record is withdrawn by a superseding record.
    - >-
      The c-blind null arm agrees with the treatment on EVERY cell including the oriented
      one. Then c is not a live parameter, the record is a re-labelling of
      IDEA-20260805-e7ee4a, and it must be withdrawn.
    - >-
      c_measured is not 2.00 within band at toy scale with the enumeration controls
      passing. Either the counting theorem is misapplied or the instrument is wrong; in
      both cases no cell may be reported.
    - >-
      compatibility_residual is bounded away from 0 at c = 2. Two committed cost models
      disagree and the discrepancy must be adjudicated before either is used.
    - >-
      Some target-independent restricted family has exchange_product strictly below X^2.
      The 1:1 closure of STEP 4 is FALSE, the c axis is open, and this is the record's
      positive branch.

  confounders:
    - >-
      c AND THE o(1) ARE NOT INDEPENDENT. The smoothness restriction changes the list count
      by Psi(X,B)/X and the success probability by P0, both p^{o(1)}. A census that read
      c to two decimal places at toy scale would be reading smoothness effects, not the
      geometric count. This is why c_measured is defined on the UNRESTRICTED cyclic count
      and why the forced value is exactly 2.
    - >-
      DETERMINANT CONVENTIONS. log_p D depends on whether the degree form or twice the
      degree form is used and on whether the lattice is the full Hom or a sublattice. A
      factor of 2 in D is a factor 1/(2r) in the exponent -- at r = 3, that is 1/6, which
      is the entire distance from 1/3 to 1/6. THE CONVENTION MUST BE PINNED IN STAGE 0 AND
      PRINTED ON EVERY ROW, and the two baseline gates exist precisely to catch a
      convention slip.
    - >-
      HERMITE VERSUS THE ACTUAL MINIMUM. The identity uses D^{1/r}; the real cost uses the
      actual first minimum. Where the lattice is far from generic these differ, and the
      difference is a distributional question this record does not settle.
    - >-
      CATEGORY VERSUS TARGET CONFOUNDING. Changing the target sometimes changes the
      category implicitly (an oriented target forces oriented morphisms). Cells must
      declare (C, tau) as a PAIR and never a target alone, and a cell that cannot state its
      category is reported OPEN rather than scored.

  interpretation_limits:
    - >-
      NO ATTACK IS PROPOSED, NO ALGORITHM IS EXHIBITED, AND NO EXPONENT IS CLAIMED TO MOVE.
      Per RQ-SSIQ-9702af's binding constraint, 0.25 is a target and not a claim; nothing
      here states or implies that a p^{1/4} algorithm exists, is likely, or is near.
    - >-
      The oriented cell is a CALIBRATION cell. It is not a proposed route: orientation is
      closed for GOAL-SSI-001 by DEC-20260804-3677f1 / EV-SSI-8aaad0 under the Deuring
      dichotomy, and getting an orientation for a random supersingular curve is at least as
      hard as the problem. This record must never be cited as evidence that the oriented
      exponent transfers to the unoriented problem.
    - >-
      The contested Delfs-Galbraith Otilde(p^{1/4}) figure (KN-LIT-078, carried at
      confidence relayed_from_abstract, CONTESTED per KN-TECH-058 RC4) is NOT used as
      support anywhere in this record. The oriented cell's 1/4 is derived in-house from the
      class number.
    - >-
      The identity is defined only for the balanced-split architecture. It scores no
      relation-collection, descent, or higher-dimensional-embedding architecture, and a
      cell that requires one is reported OPEN.
    - >-
      A negative here closes exactly: the c axis, for target-INDEPENDENT restricted
      families, within the balanced-split architecture. Forward guidance: target-correlated
      families remain open and any proposal on that axis must report (c', hit probability)
      separately; and the census cells that remain OPEN after Stage 1 remain open.

  heuristic_assumptions:
    - id: H-CRD-1
      statement: >-
        FOR ALL sufficiently large p, FOR ALL supersingular E/F_{p^2} and FOR ALL
        X in [1, p], the number of isogenies out of E with cyclic kernel and degree at most
        X is (kappa + o(1)) X^2 for an absolute constant kappa > 0.
      rigorous_support: >-
        The number of cyclic subgroups of order exactly d in E[d] is
        psi(d) = d * prod_{l | d} (1 + 1/l), a standard count; summing over d <= X gives
        (1/2) * (zeta(2)/zeta(4)) X^2 + O(X log X) by the classical mean value of psi. The
        frozen source brackets the same quantity from both sides: Lemma 3.2's upper bound
        Psi(X,B) X (log X + 2) and section 4.1's lower bound via "the number of isogenies
        of degree d is at least d" (both READ). The classical distribution statement it
        imitates is the mean value of a multiplicative function of average order d.
      validation_plan: >-
        TOY SCALE, LABELLED TOY. Enumerate cyclic isogenies of degree <= X out of a fixed
        supersingular curve at p in {103, 251, 503, 1019} using the 2- and 3-isogeny graph
        construction already demonstrated in this campaign, fit log(count) against log X
        over a declared window, and compare the fitted slope to 2 and the fitted constant
        to zeta(2)/(2 zeta(4)) = 0.9118... (computed exactly in Stage 0 before the run).
        Tail check: the largest X reached must not show curvature beyond the declared
        residual band.
      falsification_condition: >-
        Fitted slope outside [1.90, 2.10] with R^2 >= 0.98 and the enumeration controls
        passing.
    - id: H-CRD-2
      statement: >-
        FOR AN imaginary quadratic order O of discriminant of absolute value ~p, the number
        of invertible O-ideals of norm at most X is (kappa' + o(1)) X, and the class number
        is p^{1/2 + o(1)}.
      rigorous_support: >-
        RECALLED STANDARD. The ideal-counting statement is the Dedekind zeta residue
        formula for an imaginary quadratic order; the class-number statement is
        Brauer-Siegel, which is ineffective and GRH-sensitive in its lower bound. NO SOURCE
        WAS READ. It is used only to p^{o(1)} precision, and it is load-bearing ONLY for
        the calibration cell, not for the incumbent cell.
      validation_plan: >-
        ZERO COMPUTE, EXACT: compute h(-D) exactly for a declared list of discriminants at
        toy size by class-group enumeration in pure Python and fit the exponent against
        1/2; and count ideals of norm <= X exactly for the same orders and fit against 1.
        Both are forced values. Toy scale only.
      falsification_condition: >-
        Either fitted exponent outside its declared band. Then the calibration cell is
        wrong and the record's discriminating observable is void.
    - id: H-CRD-3
      statement: >-
        FOR ALL restricted families F defined WITHOUT reference to the instance's minimal
        isogeny phi, Pr[the first half psi of phi lies in F | deg psi <= X] equals the
        density of F among morphisms of degree at most X, up to p^{o(1)}.
      rigorous_support: >-
        NOT PROVED, AND THIS IS THE RECORD'S LOAD-BEARING ASSUMPTION FOR ITS CLOSURE. The
        intended support is that psi is determined by phi, that phi is the minimal vector of
        a lattice the family definition does not see, and that Heuristic-1-style
        randomness makes psi behave as a uniformly random morphism of its degree. The
        classical statement it imitates is the independence of a uniformly random object
        from a target-independent test set. IT IS EXACTLY THE ASSUMPTION A
        TARGET-CORRELATED FAMILY WOULD VIOLATE, which is why the record names that class as
        the open one rather than closing it.
      validation_plan: >-
        TOY SCALE. At toy p, compute delta(E) and its minimal isogeny exactly for every
        vertex, extract the first half psi at the balanced split, and measure
        Pr[psi in F] against the density of F for each of the five pre-registered families.
        The discriminating comparison is per family, not aggregated, and a single family
        with a significant excess is the positive branch.
      falsification_condition: >-
        Any target-independent family with measured Pr[psi in F] exceeding its density by a
        factor growing with p.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS CLAIMED TO MOVE. The record supplies the identity
      E = c*log_p(D)/(2r) and the derived requirement c = 3/2 for E = 1/4 at the
      incumbent's (r, log_p D) = (3, 1). The incumbent remains p^{1/3+o(1)}
      (frozen source Theorem 1.1, conditional on Heuristic 1).
    memory_exponent: >-
      Equal to the time exponent throughout this architecture: the list must be stored to
      be keyed, so memory is Theta~(X^c) and time is Theta~(X^c). The identity therefore
      prices BOTH axes simultaneously and a c-lever would move both. For the incumbent this
      reproduces the frozen source's own statement (section 1.1, READ: "its memory cost is
      essentially as high as the complexity p^{1/3+o(1)}").
    best_known: >-
      Time and memory p^{1/3+o(1)} conditional on Heuristic 1 (frozen source Theorem 1.1);
      previously p^{1/2}*(log p)^{O(1)} at polynomial memory. This record beats neither and
      claims to beat neither.
    hidden_overhead: >-
      The incumbent's o(1) hides a superpolynomial overhead disclosed by its own author
      (frozen source section 1.1, READ verbatim: "much larger than the previous
      (log p)^{O(1)} cofactor"). The identity is stated to exponent precision only and says
      nothing about that cofactor; no candidate's o(1) is assumed smaller than the
      incumbent's.
    tradeoff_note: >-
      The identity as written is the FULL-MEMORY corner. Under the van Oorschot-Wiener
      interpolation (frozen source section 1.1, READ: "sqrt(N^3/w) = p^{1/2+o(1)}/w^{1/2}")
      with N = X^c, the low-memory branch reads (3c/2) log_p X - (1/2) log_p w, so a
      c-lever moves the low-memory branch by 3/2 as much as it moves the full-memory
      corner. THAT IS A CONCRETE, DERIVED, CHECKABLE CONSEQUENCE and it is the record's one
      statement about the memory axis; it is not a claim that any c-lever exists.
      Parallelisation: unchanged from the incumbent, which "parallelizes perfectly"
      (section 1.1, READ).

  dominated_by: >-
    Wesolowski 2026 (inputs/P13-WESOLOWSKI-2026/paper_fulltext.md). ROWS CHECKED ACROSS
    TIME, MEMORY AND DATA/QUERIES before writing this, per docs/inventor-protocol.md
    section 5:
    (1) Wesolowski 2026: time p^{1/3+o(1)}, memory p^{1/3+o(1)}, queries 0.
    (2) Delfs-Galbraith: time p^{1/2}(log p)^{O(1)}, memory polynomial, queries 0.
    (3) van Oorschot-Wiener interpolation: time p^{1/2+o(1)}/w^{1/2}, memory w, queries 0.
    (4) Meet-in-the-middle: time p^{1/2}, memory p^{1/2}, queries 0.
    (5) Kohel 1996: time p*(log p)^{O(1)}, memory polynomial, queries 0.
    The data/queries axis is 0 on every row -- the problem takes a static curve input and
    consumes no oracle -- so the frontier is two-dimensional. THIS RECORD ADDS NO ROW: it
    contributes an identity that reproduces rows (1), (2) and (4) and a screening criterion,
    and it exhibits no algorithm. dominated_by is therefore row (1) trivially, on both axes.
  sota_delta: >-
    ZERO on every axis: no time, memory, query or preprocessing cost is reduced. THE
    QUANTITATIVE DELIVERABLE IS A CORRECTION OF SIZE 1/4 IN THE EXPONENT on one committed
    screening criterion (the oriented cell, where log_p(det)/rank returns 1/2 and
    c*log_p(det)/(2*rank) returns 1/4), plus a numeric target c = 3/2 that no committed
    record states, plus a closure on the c axis for target-independent families whose
    mechanism is the exact 1:1 exchange rate. The contribution to sota is a SCREEN: every
    future auxiliary-target or restricted-family proposal in this goal must now report three
    numbers rather than two, and its exponent is c*log_p(det)/(2*rank) whether or not it
    says so.

  estimated_cost:
    implementation: low
    compute: low
  compute_budget_note: >-
    Stages 0 and 1 are pen and paper. Stage 2 is pure Python plus numpy and reuses the
    supersingular graph construction whose cost this campaign has already reported
    (14.5 s at p = 1019, growing like p^3, per IDEA-20260805-062bee's feasibility probe).
    SageMath is not required and is not available.
  recommended_priority: high

  honest_prior_of_survival: >-
    0.90 that the identity reproduces both baseline cells and that the oriented cell
    disagrees with the committed two-parameter criterion exactly as pre-registered -- the
    arithmetic is elementary and the counting theorems are standard.
    0.08 that some target-independent restricted family beats the 1:1 exchange rate (the
    positive branch). IT IS NOT LOWER BECAUSE this programme's own red team found four of
    five named obstructions defective on audit (DEC-20260805-2be965) and the 1:1 rate is
    asserted in this corpus more often than it is derived; IT IS NOT HIGHER BECAUSE the
    argument in STEP 4 is exact for any family whose definition cannot see phi, and the
    incumbent's own smoothness restriction is a worked example of the rate holding.
    0.03 that the compatibility check against IDEA-20260805-250e50 fails, which would mean
    the campaign holds two incompatible cost models.

