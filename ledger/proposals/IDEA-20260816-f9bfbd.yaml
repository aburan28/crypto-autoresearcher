idea:
  id: IDEA-20260816-f9bfbd
  question_id: RQ-SLHDSA-001
  added: '2026-08-16'
  title: A layered signature's headline figure is a minimum over layers, but the layers share one
    public seed and one message digest; measure at scaled-down parameters whether per-layer forgery
    events are independent, using a signer with independently drawn per-layer seeds and digests as
    the executable control arm.
  class: composition
  claim: '(A) Every security figure this repository discusses for a layered hash-based signature is
    a minimum over per-layer terms, and a minimum is the correct composition only under an independence
    that nobody in this program has stated as an assumption, let alone tested. The layers do not run
    on independent inputs: one public seed keys every tweakable-hash call at every layer, and one
    message digest is split to drive both the few-time layer and the leaf selection. Shared inputs
    are the ordinary precondition for correlated failure. (B) The measurable object is the joint per-layer
    failure indicator vector: for each trial, a bit per layer saying whether a forgery attempt confined
    to that layer succeeded. The interesting quantity is not any single bit''s rate, which the other
    entries in this bucket measure, but the joint distribution -- specifically the pairwise mutual
    information and the pairwise correlation between layer indicators, both of which are exactly zero
    if the minimum composition is the right model. (C) The measurement becomes possible only by shrinking
    the object until failures are common: at hash outputs of 8 to 12 bits every per-layer indicator
    fires often enough that a joint distribution is estimable from 10^6 trials, whereas at any realistic
    size every bit is zero forever and the question is unaskable. That is the whole reason for the
    scaled-down regime, and it is also the reason the result cannot be extrapolated, which the contract
    states rather than hides. (D) The control is a signer identical in every respect except that each
    layer receives an independently drawn seed and an independently drawn digest. In that arm the
    layers are independent by construction, so the measured pairwise mutual information must be zero
    within its band. If it is not, the estimator is biased -- most likely by finite-sample entropy
    bias, which is severe for small probabilities -- and no number from the shared-seed arm is admissible.
    (E) WHAT IS NOT CLAIMED: no attack, no forgery against any real scheme, no weakness, no security
    level, no bit count, no statement that any composition figure is wrong, no statement about any
    FIPS 205 parameter set, no statement about SHA-2 or SHAKE, no statement about what the literature
    contains, and nothing about the fault or memory-corruption class. Measuring zero correlation is
    the expected outcome and a complete deliverable.'
  mechanism: 'STAGE A: define the per-layer forgery event precisely and identically across arms, since
    the whole measurement is a comparison of joint distributions and any asymmetry in the event definitions
    manufactures correlation. Each layer''s event is defined as success of a fixed, bounded, layer-confined
    attempt budget, with all other layers held ideal via the companion null harness so that a downstream
    failure cannot be attributed upstream. STAGE B: build the independent-seed control signer, in
    which every layer receives its own seed and its own digest block drawn independently, and verify
    by call-trace comparison that it differs from the shared-seed signer only in those draws. STAGE
    C: run both arms over 10^6 trials at hash outputs small enough that every per-layer indicator
    has a firing rate between roughly 10^-3 and 10^-1, tuned by choosing the output size per layer
    rather than by choosing the budget, since budget tuning would change the events. STAGE D: estimate
    pairwise mutual information and pairwise phi correlation between every pair of layer indicators
    in both arms, with an explicit finite-sample entropy bias correction and with the correction''s
    residual reported. STAGE E: compare the two arms pair by pair. The control arm''s values are the
    zero point; the shared-seed arm''s excess over that zero point, if any, is the measurement. STAGE
    F: sweep the shared component -- shared seed only, shared digest only, both shared -- as three
    configurations, so that any excess is attributable to a named shared input rather than to sharing
    in general.'
  novelty_status: unverified
  novelty_screen:
    method: grep -ril for independence, composition, minimum over layers, joint, correlation, PK.seed
      over ledger/proposals/, ledger/hypotheses/, knowledge/. Read RQ-SLHDSA-001 in full and the statement
      block of H-SLHDSA-3a403a, noting that its declared scope is the FORS layer only and that it
      states explicitly that nothing in it touches the WOTS+ layer or the hypertree. Read the what_this_is_not
      block of EXP-SLHDSA-9cbad4, which states that the contract computes ONE TERM of a figure that
      is a minimum over layers. Pulled question_id and title for all twelve SLH-DSA-touching proposals.
    results: 'The single most relevant line in the repository is in EXP-SLHDSA-9cbad4''s what_this_is_not
      block: it declares that the contract computes one term of a figure that is a minimum over layers.
      That sentence names the composition and immediately scopes out of it, which is exactly the gap
      this entry addresses. H-SLHDSA-3a403a does the same in its scope line, restricting itself to
      FORS and disclaiming the WOTS+ layer and the hypertree. IDEA-20260813-84d1bc builds a dependency
      DAG for reduction bad events, which is the closest thing in the repository to a composition
      object, but it is a structure over events inside a proof rather than a measured joint distribution
      over layer outcomes, and it produces no run. The PK.seed grep returns IDEA-20260805-fbe36a,
      IDEA-20260813-7f8d6e, IDEA-20260805-705614 and H-SLHDSA-3a403a, in every case with the seed
      as a parameter rather than as a shared input whose sharing is the object. No record measures
      a joint distribution across layers, and none proposes an independent-seed control signer.'
    verdict: 'UNVERIFIED. That a minimum over layers presumes something about their joint behaviour
      is an obvious observation, this program cannot read external literature, and it would be unsurprising
      if the composition were treated carefully in external analyses; nothing is asserted about that.
      What is claimed new is internal: eleven records on this question compute or argue about single-layer
      terms, EXP-SLHDSA-9cbad4 explicitly scopes the composition out, IDEA-20260813-84d1bc treats
      event dependence only inside a reduction and never measures anything, and the specific assembly
      here -- a joint layer-indicator distribution measured at deliberately shrunken parameters against
      an independent-seed control signer, with the shared component swept as three named configurations
      -- is built from standard parts this repository has not put together on this or, so far as the
      screen found, any target.'
  object_first_candidate:
    tracked_object: The joint per-layer failure indicator vector F = (F_FORS, F_WOTS, F_tree_1, ...,
      F_tree_d), one bit per structural layer per trial, recording whether a bounded layer-confined
      forgery attempt succeeded at that layer in that trial. The object followed is the empirical
      joint distribution of F over trials.
    lossiness: 'The projection discards which message, which key, which node, and by how much each
      attempt succeeded or failed -- every magnitude, every witness, every value. What survives is
      a vector of d+2 bits per trial. This is severely lossy: from F one cannot reconstruct any forgery,
      identify any layer''s witness, or recover any input. It propagates because the composition question
      is entirely a question about the joint law of these bits: a minimum over layers is the right
      figure exactly when the bits are independent, and is conservative or optimistic depending on
      the sign of their dependence, and neither statement reads anything the projection discarded.
      The boundary is explicit: any dependence that shows up in the magnitude of near-misses but never
      flips a bit is invisible here, which is a real limitation at small trial counts and is why the
      firing rates are tuned into a measurable band rather than left where they fall.'
    propagation: 'One trial produces one vector F, so the operation the object is followed through
      is not a signing step but a repetition, and the object''s dynamics is the accumulation of an
      empirical joint distribution. The structural rule connecting layers is what makes the bits potentially
      dependent: the same public seed enters every layer''s tweakable-hash calls, and the same digest
      is split between the few-time block and the leaf-index block, so a seed or digest value that
      happens to be favourable for one layer''s attempt is the same value the other layers see. Sweeping
      which component is shared is therefore the propagation experiment: sharing the seed alone, the
      digest alone, or both, changes exactly which coupling channel is open.'
    survival_score: The joint distribution is estimable while every marginal firing rate stays above
      roughly 10^-3 at 10^6 trials, which at these layer definitions means hash outputs of about 8
      to 12 bits and attempt budgets in the low thousands. Below 8 bits the layers saturate and every
      bit is 1, above about 14 bits the rare-event regime makes mutual-information estimates dominated
      by bias. So the object survives in a window roughly four bits wide, and the contract reports
      that window explicitly as the measurement's domain. Outside it the object does not dissolve
      mathematically -- the joint law still exists -- but it becomes unmeasurable at any trial count
      this program can run, which is stated as the reason no extrapolation is offered.
  null_object_control: 'An independent-seed, independent-digest signer: identical in structure, call
    sequence and attempt budgets, differing only in that each layer draws its own seed and its own
    digest block independently. Executed in the same invocation, on the same trial count and the same
    seeds for the trial loop. In that arm the layers are independent by construction, so every pairwise
    mutual information estimate must be zero within its band and every phi correlation must be zero
    within its band. That arm is not decoration: it is the measurement''s zero point, because finite-sample
    mutual information is biased upward for rare events by an amount that depends on the marginals,
    and quoting a shared-seed mutual information against a theoretical zero rather than against the
    control''s measured zero would manufacture a signal. If the control arm''s estimates are not zero
    within band after bias correction, the estimator is unusable at these marginals and no shared-seed
    number may be reported.'
  discriminated_from:
  - 'EXP-SLHDSA-9cbad4: states in its own what_this_is_not block that it computes one term of a figure
    that is a minimum over layers, explicitly scoping the composition out. This entry is that scoped-out
    question, and takes the single-layer terms as given rather than recomputing any of them.'
  - 'H-SLHDSA-3a403a: scoped by its own text to the FORS layer only, disclaiming the WOTS+ layer and
    the hypertree. A single-layer hypothesis cannot address a joint distribution across layers by
    construction.'
  - 'IDEA-20260813-84d1bc, dependency-DAG accounting for FIPS 205 reduction bad events: the nearest
    composition object in the repository, but a structure over events inside a reduction, derived
    symbolically, with no run and no measurement. This measures an empirical joint law over layer
    outcomes and says nothing about any reduction''s internal events.'
  - 'IDEA-20260805-fbe36a, IDEA-20260808-02a046, IDEA-20260805-88ecef and IDEA-20260801-009: all single-layer,
    all FORS, all producing a marginal quantity. This entry consumes marginals and produces only the
    dependence between them.'
  - 'The other entries in this batch''s bucket: the property table is symbolic and per layer, the
    reuse curve and up-set counts are single-layer combinatorics, and the null harness is an instrument.
    None measures a joint distribution across layers; this one depends on the harness and on the layer-confined
    event definitions the others establish.'
  assumptions:
  - Per-layer forgery events can be defined identically across arms and confined to one layer by holding
    the others ideal via the companion null harness; any asymmetry in the definitions manufactures
    correlation and is the contract's central risk.
  - Shrinking hash output sizes to make failures common preserves whatever dependence structure exists
    among layers; this is the assumption the whole design rests on, it is not established, and the
    contract states plainly that a null result at 10-bit outputs cannot be extrapolated upward.
  - Finite-sample mutual-information bias can be corrected sufficiently at the achieved marginals
    for the control arm to read zero within band; whether it can is measured, not assumed, and failure
    voids the contract.
  - The independent-seed control differs from the shared-seed signer only in the seed and digest draws,
    verified by call-trace comparison rather than assumed.
  - The layer decomposition used is the one recorded in this repository's structural description,
    which marks itself UNVERIFIED against primary text.
  predictions:
  - metric: pairwise mutual information between every pair of layer indicators, independent-seed control
      arm, after bias correction
    direction: lower
    minimum_effect: within the estimator's band at 10^6 trials; a forced value of exactly zero is
      not claimed because finite-sample bias is nonzero and claiming zero would be a fabrication.
      The band itself is the pre-registered quantity.
  - metric: pairwise mutual information in the shared-seed shared-digest arm, minus the control arm's
      value at matched marginals
    direction: lower
    minimum_effect: 0.001
  - metric: pairwise phi correlation between the few-time layer indicator and the leaf-selection-dependent
      layer indicator in the shared-digest configuration
    direction: different
    minimum_effect: explicit refusal to pre-commit a sign or magnitude. The digest is split between
      those two layers, so this is the one pair where a coupling channel is structurally open, and
      I decline to predict its direction because a favourable digest for one block says nothing a
      priori about the other. Pre-committing would make the sweep confirmatory.
  - metric: per-layer marginal firing rate in both arms
    direction: different
    minimum_effect: 'forced band: every marginal must land between 10^-3 and 10^-1, since outside
      that window the joint estimate is not usable and the configuration is out of scope rather than
      a result'
  - metric: difference in every pairwise estimate between the shared-seed-only and shared-digest-only
      configurations
    direction: different
    minimum_effect: 0.001
  minimal_test:
    design: The cheapest decisive version is the control arguing with itself before any shared-seed
      number is computed. Fix a toy signer at h = 4, d = 1, a = 2, k = 3, w = 4 with per-layer output
      sizes tuned so each of the four layer indicators fires between one in a thousand and one in
      ten, verified by a short pilot of 10^4 trials. Then run 10^6 trials of the independent-seed
      control arm alone and estimate all six pairwise mutual informations with bias correction, plus
      their bands by bootstrap. The discriminating observable is whether all six read zero within
      band. If they do not, the estimator cannot resolve dependence at these marginals and the entire
      contract is unrunnable as designed -- which is worth discovering in an hour rather than after
      building three shared configurations. Only if the control reads clean does the shared-seed arm
      get run, at which point the same six estimates against the control's measured zero point constitute
      the whole measurement. Total cost of the decisive step is one arm and one hour.
    controls:
    - Independent-seed, independent-digest signer arm, identical structure and budgets, same invocation,
      providing the measured zero point for every pairwise estimate.
    - Shared-component sweep as three configurations (seed only, digest only, both), so any excess
      attributes to a named shared input rather than to sharing in general.
    - Call-trace comparison between the shared and independent signers, requiring identical call sequences
      so only the draws differ.
    - Bootstrap bands on every mutual-information and correlation estimate, with the finite-sample
      bias correction's residual reported rather than absorbed.
    - 'Marginal-matching check: the shared and control arms must have per-layer marginals agreeing
      within band, since mutual-information bias depends on the marginals and a comparison at mismatched
      marginals is meaningless.'
    required_metrics:
    - per-layer marginal firing rate, both arms, all configurations
    - pairwise mutual information between every layer pair, bias-corrected, with bootstrap band, both
      arms
    - pairwise phi correlation between every layer pair, both arms
    - shared-minus-control excess per pair, per shared-component configuration
    - bias-correction residual per estimate
    - call-trace equality between shared and independent signers
  falsification_conditions:
  - 'The independent-seed control arm shows nonzero pairwise mutual information beyond band after
    bias correction: the estimator cannot resolve dependence at these marginals and no shared-seed
    number is admissible.'
  - 'Per-layer marginals fall outside the 10^-3 to 10^-1 window in either arm: the configuration is
    out of scope, not a result, and is retuned by output size rather than by attempt budget.'
  - 'Marginals differ between the shared and control arms beyond band: the comparison is at mismatched
    marginals and is void, since the bias depends on them.'
  - 'Call traces differ between the shared and independent signers beyond the seed and digest fields:
    the arms differ in more than the shared input.'
  - 'An excess appears in the both-shared configuration but in neither single-component configuration
    and no interaction mechanism can be named: reported as unattributed and explicitly not as a composition
    finding.'
  - 'The companion null harness has not cleared its self-consistency battery: layer confinement cannot
    be trusted and the contract is blocked upstream.'
  confounders:
  - Layer-confined events defined even slightly differently across arms manufacture correlation directly;
    this is the contract's dominant risk and is why event definitions are frozen in STAGE 0 and verified
    by trace comparison rather than by inspection.
  - Finite-sample mutual information is biased upward for rare events by an amount depending on the
    marginals, so an uncorrected estimate always looks like dependence; the control arm exists precisely
    to absorb this and its failure to read zero is a stopping condition rather than a nuisance.
  - Shrinking output sizes to make failures common may itself create dependence that does not exist
    at larger sizes -- for instance by making digest-block collisions common -- so an observed excess
    could be an artifact of the shrinking rather than of the sharing.
  - Holding other layers ideal while attacking one is itself an idealization that could suppress genuine
    cross-layer coupling, biasing the measurement toward independence; this is stated as a limit and
    its direction is the conservative one for the claim being made.
  - With d+2 layers there are many pairs and multiple comparisons inflate the chance of a spurious
    excess; the contract pre-registers the pair count and applies a stated correction rather than
    reporting the largest excess found.
  interpretation_limits:
  - A measurement at 8-to-12-bit outputs cannot be extrapolated to any realistic parameter size, and
    the contract offers no extrapolation; the shrinking is what makes the question askable and is
    also what confines the answer.
  - Measured independence supports the minimum composition at the tested toy parameters only; it is
    not a validation of any security figure for any scheme.
  - Measured dependence at toy sizes would be a finding about a toy signer and could as easily reflect
    the shrinking as the sharing, which the confounder list states and which no arm of this contract
    can separate.
  - Holding other layers ideal biases toward independence, so a null result is weaker than it looks
    and must be reported with that direction stated.
  - Nothing here concerns the fault or memory-corruption claim class.
  target_complexity:
    time_exponent: No attack exponent is claimed and no real scheme is attacked. The measurement costs
      10^6 trials times a bounded per-layer attempt budget times the number of layers, per arm per
      configuration, all at toy output sizes; this is instrument cost, not attack cost.
    memory_exponent: No attack memory exponent is claimed. The joint distribution over d+2 binary
      indicators is a table of at most 2^{d+2} counters, trivially small; the null harness's oracle
      table dominates memory and is capped at 2^24 entries with refusal at the boundary.
    best_known: 'The incumbent inside this repository is an explicit scope-out: EXP-SLHDSA-9cbad4
      states it computes one term of a figure that is a minimum over layers, and H-SLHDSA-3a403a disclaims
      every layer but one. The count of records here measuring anything joint across layers is zero,
      and IDEA-20260813-84d1bc, the nearest composition object, is symbolic with no run. No claim
      is made about what exists outside this repository.'
    hidden_overhead: The overhead is statistical and it is larger than it looks. Mutual information
      at rare-event marginals is one of the more treacherous estimands in applied statistics, its
      bias depends on quantities being estimated, and the honest cost of this contract is that its
      control arm may simply fail to read zero, ending the contract with an instrument result rather
      than a composition result. In human cost, freezing four to six layer-confined event definitions
      that are genuinely symmetric across arms is harder than implementing anything here, and a definition
      asymmetry produces a clean, significant, entirely spurious correlation that no downstream control
      detects.
  dominated_by: 'n/a (no result claimed). Checked against every frontier row this repository maintains
    across time, memory and data/queries: a joint-distribution dependence measurement over toy layer
    indicators is not an attack and has no coordinate on any of those axes. Nothing dominates it,
    it dominates nothing, and it is not entered on any frontier.'
  sota_delta: 'no attack; conceptual/measurement contribution only. Against this repository''s own
    state: the composition is named and scoped out in two records and measured in none, so this would
    produce the first joint measurement across layers, reported as pairwise excesses over a control
    arm''s measured zero point with bands, or as an instrument result if the control cannot read zero.'
  estimated_cost:
    implementation: high
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: 'Separable parts, and one of them is the reason I rate this below the
    bucket''s cheaper entries. (1) That the independent-seed control arm reads zero within band on
    all pairs after bias correction: about 0.5. This is the gate, and rare-event mutual-information
    estimation is genuinely difficult; if it fails, the contract ends with an instrument finding and
    no composition result, which is an honest outcome but not the one it was designed for. (2) That
    per-layer marginals can be tuned into the 10^-3 to 10^-1 window simultaneously across all layers
    by output size alone: about 0.6, since the layers have very different natural rates and a window
    that suits one may saturate another. (3) That, conditional on the control reading clean, the shared-seed
    arm shows no excess: about 0.8 -- independence is what I expect, and measuring it cleanly is the
    deliverable. (4) That any excess found, if one is, would be attributable to a named shared component
    rather than appearing only in the both-shared configuration: about 0.4, and an unattributed excess
    is reported as unattributed. (5) That a null result here is usable elsewhere in the program: about
    0.55, since it would support the minimum composition only at toy parameters, and the honest framing
    is that it removes a currently unexamined assumption from the unexamined list rather than establishing
    anything about deployed figures.'
