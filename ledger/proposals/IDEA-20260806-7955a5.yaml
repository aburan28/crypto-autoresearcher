idea:
  id: IDEA-20260806-7955a5
  question_id: RQ-SSI-001
  added: '2026-08-06'
  title: >-
    A CORRESPONDENCE THE PROGRAM RUNS BOTH HALVES OF AND HAS NEVER WRITTEN DOWN:
    the ECDLP is the RANK-ONE, HIDDEN-DEGREE case of exactly the input format
    the SIDH break consumes, so one integer triple
    (torsion-image rank, torsion order versus degree, is the degree public)
    indexes broken and unbroken assumptions alike -- and the ECDLP's rank
    deficit is provably unrepairable by this program's own Frobenius-collapse
    result
  class: mechanism

  claim: >-
    (A) THE TWO HALVES, AND THE FACT THAT NOTHING JOINS THEM. This program runs
    an ECDLP campaign (RQ-ECDLP-001/002) and a supersingular campaign
    (RQ-SSI-001), and KN-OPEN-015 asks in the abstract "when does publishing
    auxiliary structure collapse an isogeny/DL assumption, and which schemes are
    safe?". The answer is currently a narrative. This proposal makes it an
    INDEX, computable per assumption in minutes, that classifies the ECDLP and
    the surviving isogeny assumptions on the same axis.

    (B) THE INDEX. For an assumption A whose secret is a map phi from a curve
    (or a scalar acting on one), define the AUXILIARY TRIPLE
        tau(A) = (r, rho, delta)
      r     = the rank, as a Z/N-module, of the torsion-image data A publishes
              about phi -- i.e. how many independent points of E[N] have their
              phi-image published;
      rho   = the ratio N / deg(phi), i.e. whether the published torsion order
              exceeds the degree;
      delta = 1 if deg(phi) is public, 0 if it is secret.
    The Kani / higher-dimensional embedding machinery (KN-TECH-026) consumes
    exactly (r = 2, rho > 1, delta = 1). SIDH published precisely that triple
    and was broken. The claim is that tau is the right index -- that the
    published attacks and the standing safety arguments in this corpus are all
    statements about tau, and that no assumption in scope has ever been screened
    against it uniformly.

    (C) WHERE THE ECDLP SITS, AND THE OBSTRUCTION IS THIS PROGRAM'S OWN RESULT.
    An ECDLP instance (E, P, Q = kP) over F_p with N = ord(P) prime is the
    secret endomorphism [k], of degree k^2, with its action published on the
    cyclic group <P> only. So tau(ECDLP) = (r = 1, rho = N / k^2 < 1, delta = 0):
    it fails ALL THREE of Kani's input conditions simultaneously. And the rank
    deficit is not a presentational accident that a cleverer setup could repair:
      - E(F_p)[N] = ker(pi - 1)[N] is a single eigenspace of the Frobenius, so
        EVERY endomorphism of E restricted to it acts as a SCALAR mod N. Hence
        psi(P) lies in <P> for every psi in End(E), and no efficiently
        computable endomorphism can manufacture a second, independent published
        image. THIS IS EXACTLY THE FROBENIUS-COLLAPSE MECHANISM ALREADY RECORDED
        IN IDEA-20260726-006 AND CLOSED IN KN-FIND-002 / KN-FIND-b7e091 --
        recorded there as a GGM-simulability closure, and never once read as a
        statement about torsion-image rank, which is what it also is.
      - Raising the rank by moving to E[N] over an extension where the full
        N-torsion is rational makes [k] act as the scalar matrix k*I, so
        "knowing its action on a basis" IS knowing k. The rank is bought at the
        price of the secret; the construction is circular and the circularity is
        exact rather than approximate.
      - rho < 1 is a second, independent obstruction: Kani wants auxiliary
        torsion of order EXCEEDING the degree, and here the degree k^2 already
        exceeds N. Even a free rank-2 image would not suffice.
    THREE INDEPENDENT OBSTRUCTIONS, EACH SUFFICIENT. That is a closure at the
    docs/inventor-protocol.md section 4 standard -- named obstruction, argument,
    and the forward guidance in (D) -- and it is the first statement in this
    corpus of WHY the SIDH break does not touch the ECDLP, as opposed to the
    observation that it does not.

    (D) FORWARD GUIDANCE, WHICH IS WHERE THE DEFENSIVE VALUE IS. The index
    immediately marks the dangerous design pattern: ANY protocol built on a
    prime-field curve that publishes the image of a SECOND independent point
    under a secret endomorphism, together with that endomorphism's degree, moves
    r from 1 to 2 and delta from 0 to 1 and enters the regime the SIDH break
    consumes. That is not hypothetical -- it is a screen to run against
    proposed constructions, and the deliverable is the screen plus the census.
    The genuinely uncertain cell, and the one the census is really for, is
    (r = 2, delta = 0): assumptions that publish rank-2 torsion images while
    MASKING the degree. Whether hiding the degree is sufficient protection is
    open, and this index is what makes it a well-posed question instead of a
    per-scheme argument.

    (E) WHAT THIS IS NOT. NOT a new attack. NOT a claim that any assumption in
    scope is broken. NOT a claim that tau is a complete invariant -- an
    assumption can be broken for reasons entirely outside it, and the census must
    say so per row. The deliverable is a derivation, a screen, and a table.

  discriminated_from:
    - >-
      KN-TECH-026 (higher-dimensional Kani embedding, glue-and-split) and
      KN-TECH-025 (SIDH and the torsion-point-image structure). Those record the
      machinery and the broken scheme. Neither states the input requirement as a
      numeric triple, and neither applies it outside the isogeny setting.
    - >-
      IDEA-20260805-c4ae3d, which finds that SQIsign computes an SIDH-shape
      auxiliary datum at key generation and keeps it in the secret key. That is
      one row of the census, for one scheme, discovered by reading that scheme's
      specification. This proposal supplies the axis that row sits on and asks
      for every row, including the ECDLP row that c4ae3d does not address.
    - >-
      IDEA-20260726-006 and KN-FIND-002 / KN-FIND-b7e091 (Frobenius collapse;
      endomorphism-oracle simulability). Those establish the mathematical fact
      used in (C) and close the endomorphism oracle in the GENERIC GROUP MODEL.
      This proposal re-reads the same fact in the TORSION-IMAGE-RANK model,
      where it says something the GGM statement does not: not merely that an
      endomorphism oracle gives no generic advantage, but that no endomorphism
      can raise the published rank, which is what the Kani machinery needs. The
      novelty is in the re-reading, and the record says so plainly rather than
      claiming a new theorem.
    - >-
      The H-ALISO series (37 hypotheses tagged isogeny / supersingular / Kani).
      Those are autolab measurement packages -- probes, sweeps and verifiers for
      particular Kani-adjacent computations. None states an assumption-level
      screening criterion, and none mentions the ECDLP.

  object_first_candidate:
    tracked_object: >-
      THE AUXILIARY TRIPLE tau(A) = (r, rho, delta) of an assumption's published
      data. It is followed across assumptions rather than across a computation,
      which is unusual for this program's tracked objects and is stated so that
      the difference is not mistaken for a category error: the projection is
      from "the full specification of a scheme" to three numbers.
    lossiness: >-
      EXTREMELY LOSSY. An entire scheme collapses to three numbers. The fibre
      over any triple contains schemes with wildly different security. This is
      the honest limitation and it is the reason the census reports a
      NOT_IN_KANI_REGIME verdict rather than a safety claim: the index is
      sufficient to say when the machinery APPLIES and never sufficient to say a
      scheme is secure.
    propagation: >-
      Deterministic under the operations that matter here -- publishing more
      data can only raise r and delta, never lower them, so tau is MONOTONE
      along the direction schemes actually move when they add functionality.
      That monotonicity is what makes it usable as a design-time screen.
    survival_score: >-
      Survives every change of scheme parameters. Dies as an explanation the
      moment a break arrives through a mechanism other than the embedding, which
      is why the census must carry a per-row "other known attack surfaces"
      column that is never left empty by default.

  mechanism: >-
    STEP 1 -- STATE KANI'S INPUT REQUIREMENT EXACTLY, FROM PRIMARY TEXT. The
    triple is only as good as the requirement it encodes. Stage 0 obtains the
    precise hypotheses of the embedding construction -- what rank of torsion
    image, what relation between the torsion order and the degree, whether the
    degree must be known exactly or only up to a factorisation, and what
    happens for non-cyclic or unbalanced degrees -- and writes them into a
    knowledge technique entry. If the requirement is not expressible as a
    triple, the index is the wrong shape and the proposal ends at Stage 0 at
    zero cost. That is a real possibility and it is placed first for that
    reason.

    STEP 2 -- DERIVE tau(ECDLP) AND AUDIT ALL THREE OBSTRUCTIONS. Each of the
    three arguments in (C) is a few lines and each is independently checkable:
    the eigenspace argument for r, the circularity argument for the extension
    route, and the degree comparison for rho. All three are written out and
    checked symbolically. Note the direction of the last one carefully: it is
    NOT that k^2 is large in absolute terms, it is that N < k^2 for a typical
    k in [1, N], so the auxiliary torsion available on the rational subgroup is
    smaller than the degree, which is the wrong side of Kani's inequality.

    STEP 3 -- THE CENSUS. One row per assumption in this program's scope, with
    seven columns: assumption; secret map; is the degree public (delta); what
    torsion images are published and of what rank (r); torsion order versus
    degree (rho); Kani-regime verdict (IN / NOT_IN / UNDETERMINED with the exact
    missing fact); other known attack surfaces, never blank. Rows: SIDH/SIKE as
    the positive control, plain ECDLP on a prime-field curve, GLV/GLS curves
    with an efficiently computable endomorphism, CSIDH, CGL, SQIsign, and any
    masked-torsion variants recorded in this corpus. The SIDH row is the
    instrument's positive control: a screen that does not classify SIDH as
    IN_KANI_REGIME cannot detect the thing it was built to detect, and the
    census is void.

    STEP 4 -- THE DESIGN-TIME SCREEN. Turn the census into a checklist a
    proposal can be run through before it is built: does your construction
    publish a second independent torsion image under a secret map, is that map's
    degree recoverable from public data, and does the published torsion exceed
    it. Three questions, minutes to answer, and they are the questions SIDH
    would have failed.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      grep -ril over ledger/ and knowledge/ for "Kani", "torsion image",
      "auxiliary structure", "rank", cross-read against KN-OPEN-015,
      KN-TECH-025, KN-TECH-026 and the H-ALISO series, performed 2026-08-06
      against merge-base 0c856274.
    results: >-
      "Kani" occurs across 37 H-ALISO hypotheses (all autolab measurement
      packages), GOAL-SQISIGN-002, GOAL-SSI-001 and one correction record. The
      auxiliary-structure question is posed abstractly in KN-OPEN-015 and
      addressed for one scheme in IDEA-20260805-c4ae3d. No record states an
      input-requirement triple, no record screens more than one assumption
      against it, and no record connects the ECDLP to the Kani input format at
      all. The ECDLP and SSI campaigns share no record on this axis.
    verdict: >-
      ADAPTATION. Every mathematical ingredient is published or already in this
      corpus: Kani's criterion, the SIDH break, and this program's own
      Frobenius-collapse result. What is new is the joining -- the observation
      that the ECDLP is the degenerate corner of the same input format, and that
      the corpus's own GGM closure doubles as the proof that the corner cannot
      be escaped. No novelty is claimed against the external literature, and the
      possibility that this framing is folklore among isogeny researchers is
      explicitly open; Stage 0 checks for it and a hit would be an ingredient.

  null_object_control: >-
    THE POSITIVE CONTROL IS THE BLOCKING ONE HERE, WHICH IS THE UNUSUAL SHAPE OF
    THIS PROPOSAL. (1) SIDH/SIKE must be classified IN_KANI_REGIME by the screen
    applied mechanically, with no special-casing. If it is not, the screen
    cannot detect what it was built for and no other row may be reported.
    (2) NEGATIVE CONTROL: a plain prime-field ECDSA/ECDH parameter set must be
    classified NOT_IN_KANI_REGIME with all three obstructions cited. (3)
    ADVERSARIAL CONTROL: construct a deliberately unsafe toy protocol that
    publishes a second torsion image and its degree; the screen must flag it.
    A screen that has never flagged a constructed positive is a screen that has
    not been shown able to fail.

  assumptions:
    - >-
      Kani's input requirement is expressible as the stated triple. Checked at
      Stage 0; if false, the proposal ends there.
    - >-
      N = ord(P) is prime and the ECDLP instance is on a prime-field curve with
      Pohlig-Hellman hygiene applied (KN-TECH-030). Composite-order and
      small-subgroup settings are out of scope and are named as successor work.
    - >-
      "Efficiently computable endomorphism" means one evaluable in time
      polynomial in log p, as in the GLV/GLS setting (KN-TECH-018). The
      eigenspace argument applies to all endomorphisms regardless, so this
      assumption bounds the practical statement rather than the mathematical
      one.

  proof_search_map:
    bottleneck: >-
      The exact torsion-rank requirement of the embedding construction. Every
      claim in this proposal is downstream of it; if the machinery can be made
      to work at rank 1 with additional structure, the ECDLP row changes and so
      does every conclusion.
    baseline_embedding:
      parameter_slice: >-
        SIDH/SIKE with its published parameters is the exact slice on which the
        screen must reproduce the known break classification.
      reproduction_check: >-
        Symbolic: instantiate the triple from the SIKE specification's published
        values and verify (r = 2, rho > 1, delta = 1) mechanically from the
        specification rather than from memory of the attack.
    observation_collision:
      observable: >-
        The triple tau(A).
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, and the design accounts for it: find
        two assumptions with the same triple and different security. A secure
        scheme and a broken one sharing a triple does NOT falsify the screen --
        the screen claims only that the triple decides whether ONE machinery
        applies -- but it does bound every conclusion, and it is the reason the
        census carries an "other known attack surfaces" column that may not be
        left blank. If no collision can be found, that is worth reporting as
        unexpectedly strong.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the triple fixed at (r = 2, delta = 0) -- rank-2 images with a
          masked degree -- and vary the masking mechanism, looking for an
          intrinsic invariant that separates masking schemes the machinery can
          still consume from those it cannot.
        predicted_gain: >-
          This is the only cell where the answer is genuinely unknown, and it is
          where a real result would come from. Predicted gain: a sharper
          criterion than "hide the degree", or a demonstration that hiding it is
          insufficient.
      - transform: boundary_lift
        proposed_object: >-
          Enlarge the requirement family from (r = 2, rho > 1, delta = 1) to the
          largest triple set on which the embedding provably still applies, and
          prove a strict inward improvement rather than restating feasibility.
        predicted_gain: >-
          Moves the safe/unsafe boundary to where it actually is instead of
          where SIDH happened to sit, which is what a design-time screen needs.
    quantifier_order: >-
      Stated for the ECDLP row, where it is load-bearing:
      FORALL prime-field curves E/F_p, FORALL points P of prime order N in
      E(F_p), FORALL psi in End(E), EXISTS a scalar c mod N such that
      psi(P) = cP. The witness c depends on (E, N, psi) and that dependence is
      harmless; what matters is that NO psi is exempt, which is why the
      conclusion "the published rank cannot be raised by an endomorphism" is
      uniform. The failure mode to watch for is a reader silently weakening this
      to "for all efficiently computable psi", which would leave the general
      case open; the eigenspace argument gives the strong form and the write-up
      must keep it.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Assumption A is / is not in the regime where the higher-dimensional
        embedding machinery applies, given its currently published data." NEVER
        "A is secure". The distance between those two sentences is the whole
        interpretive risk of this proposal and it is stated here so that the
        write-up can be checked against it.
      nearby_object_control: >-
        A scheme with tau just outside the regime -- rank 2, degree masked. If
        the screen cannot distinguish it from SIDH by anything other than the
        delta bit, the screen has not identified the load-bearing structure and
        its verdicts on masked schemes are worthless. This is the sharpest
        available test of the index and it is cheap.
    proof_obligations:
      - claim: Kani's requirement is exactly the stated triple.
        responsibility: baseline
      - claim: Every endomorphism acts as a scalar on E(F_p)[N].
        responsibility: correctness
      - claim: The extension route makes the rank-2 data equivalent to knowing k.
        responsibility: correctness
      - claim: rho < 1 for a typical ECDLP instance.
        responsibility: size
      - claim: SIDH is classified IN_KANI_REGIME mechanically.
        responsibility: baseline
      - claim: A verdict of NOT_IN_KANI_REGIME is not reported as a safety claim.
        responsibility: scope

  predictions:
    - metric: >-
        classification of SIDH/SIKE by the mechanically applied screen
      direction: different
      minimum_effect: >-
        Must be IN_KANI_REGIME with all three components derived from the
        specification. Any other outcome voids the census entirely.
    - metric: >-
        number of independent obstructions blocking the ECDLP row
      direction: different
      minimum_effect: >-
        Predicted exactly 3 (rank, circularity of the extension route, rho < 1),
        each independently sufficient. Fewer than 3 surviving the Stage-2 audit
        weakens the closure and must be reported as such rather than rounded up.
    - metric: >-
        number of assumptions in RQ-SSI-001 scope with verdict
        UNDETERMINED after the census
      direction: different
      minimum_effect: >-
        Each UNDETERMINED must name the exact missing fact. An UNDETERMINED with
        no named missing fact is a defect in the census, not a research finding.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): obtain Kani's criterion from primary
      text; express it as a triple or halt.
      STAGE 1 (zero compute): write out and check the three ECDLP obstructions
      symbolically; verify the eigenspace argument against a toy curve by direct
      computation as a sanity check on the derivation, not as evidence for it.
      STAGE 2 (HARD GATE): run the screen mechanically on SIDH/SIKE and on the
      constructed adversarial toy protocol. Both must classify correctly.
      STAGE 3 (hours, zero compute): fill the seven-column census.
      STAGE 4 (zero compute): write the three-question design-time checklist and
      state the open cell (r = 2, delta = 0) as a successor research question.
    controls:
      - SIDH/SIKE positive control -- must classify IN_KANI_REGIME
      - plain ECDH/ECDSA negative control -- must classify NOT_IN_KANI_REGIME
      - >-
        constructed adversarial toy protocol publishing a second image and its
        degree -- must be flagged
      - >-
        toy-curve verification that psi(P) is in <P> for an explicit
        efficiently computable endomorphism on a GLV curve
    required_metrics:
      - tau(A) per assembled row, with the source line for each component
      - classification verdict and, for UNDETERMINED, the exact missing fact
      - pass/fail of all three controls
      - count of independent obstructions surviving the ECDLP audit

  falsification_conditions:
    - >-
      Kani's requirement is not expressible as the triple. The index is the
      wrong shape; the record is superseded, not amended.
    - >-
      SIDH is not classified IN_KANI_REGIME by the mechanical screen. Instrument
      failure; the census is void and nothing is reported.
    - >-
      A rank-1 instantiation of the embedding machinery is exhibited. The ECDLP
      row's first obstruction falls, and that is a far more interesting result
      than the census -- it would be a new handle on the ECDLP and would
      immediately become the successor proposal.
    - >-
      The eigenspace argument fails on an explicit curve. Either the derivation
      or the implementation is wrong; the run halts either way.

  confounders:
    - >-
      Reading NOT_IN_KANI_REGIME as "safe". This is the dominant risk of the
      whole proposal, it is a communication failure rather than a technical one,
      and it is why the census carries a mandatory "other known attack surfaces"
      column and why the method_ceiling names the exact sentence that may be
      written.
    - >-
      Specification drift. Published data inventories change between scheme
      versions; every row must cite the exact specification version and the
      exact field, in the style IDEA-20260805-244f78 uses for SQIsign's byte
      inventory.
    - >-
      Treating the triple as complete. An assumption can be broken by
      orientation attacks, self-pairings (IDEA-20260806-b7fdc3), class-group
      structure, or implementation faults, none of which tau sees.

  interpretation_limits:
    - >-
      The screen decides applicability of ONE machinery. It is not a security
      evaluation and no row may be summarised as one.
    - >-
      The ECDLP closure is scoped to prime-field curves with prime-order P and
      the currently known form of the embedding requirement. A change to that
      requirement reopens it, and the record names that as the revisit
      condition.
    - >-
      The (r = 2, delta = 0) cell is explicitly NOT closed by this work; it is
      identified as the open question and handed forward.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a uniformly random secret scalar k in [1, N-1] on a prime-field
        curve with N ~ p, the ratio rho = N / k^2 is below 1 with probability
        1 - O(N^{-1/2}); i.e. the degree of the secret endomorphism exceeds the
        available rational torsion order except for a negligible fraction of
        instances.
      rigorous_support: >-
        Rigorous side: k^2 >= N exactly when k >= sqrt(N), which holds for all
        but sqrt(N) of the N-1 possible scalars, an elementary count with no
        heuristic content. The heuristic side is only the assumption that k is
        drawn uniformly, which is a statement about key generation rather than
        about mathematics, and is exactly the assumption to check per scheme
        rather than assume.
      validation_plan: >-
        Direct enumeration at toy N: count the fraction of k with k^2 < N and
        compare against the predicted sqrt(N)/N across a ladder of toy primes.
        Comparison distribution: the exact count, not a sampled one, so the
        prediction is checked without statistical error. Tail check: the largest
        k with k^2 < N must equal floor(sqrt(N-1)) exactly. This is a
        derivation check rather than a distributional experiment, and it is
        labelled as such; H1's real content is the uniformity of key generation,
        which no toy computation validates.

  target_complexity:
    time_exponent: >-
      NOT AN EXPONENT PROPOSAL. No attack is proposed and no complexity is
      claimed against any problem. The census is O(1) analysis per assumption.
    memory_exponent: >-
      Negligible.
    best_known: >-
      Against the ECDLP: rho at p^{1/2} (KN-TECH-001, KN-TECH-006), unchanged.
      Against supersingular path-finding: KN-TECH-058 and the p^{1/3+o(1)}
      exemplar, unchanged. Against SIDH: the embedding attacks of KN-TECH-026,
      unchanged.
    hidden_overhead: >-
      None claimed. The honest cost is that Stage 0 requires primary text this
      repository may not hold, and the whole proposal is blocked until it does.
    tradeoff_note: >-
      Not applicable. If the (r = 2, delta = 0) cell ever yields an attack, that
      attack requires its own full-cost accounting against KN-TECH-035 and the
      quantum models of KN-TECH-051.

  dominated_by: >-
    As an ATTACK: mounts none, so dominated on every axis by every frontier row
    this program records for both campaigns -- rho at p^{1/2} time and O(1)
    memory for ECDLP, KN-TECH-058 and p^{1/3+o(1)} for supersingular
    path-finding, and the published embedding attacks for SIDH. Checked across
    time, memory and data/query.
    As an ANSWER TO KN-OPEN-015: the incumbents are the open problem's own prose
    and IDEA-20260805-c4ae3d's single-scheme finding. This proposal dominates
    both on coverage (an axis plus a census over >= 6 assumptions versus one
    scheme) and is dominated by c4ae3d on depth for the SQIsign row specifically,
    where that record read the specification and this one would cite it.
  sota_delta: >-
    Zero speedup. Coverage delta, numerically: converts one prose open problem
    (KN-OPEN-015) and one single-scheme finding into a 3-component index and a
    7-column census over >= 6 assumptions, with 3 mandatory controls; supplies
    the ECDLP row with 3 independently sufficient obstructions where the corpus
    currently has 0 recorded; and isolates exactly 1 open cell
    (r = 2, delta = 0) as the successor question. Stated as counts because
    "clarifies the landscape" is not a value.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.7 that Kani's requirement is cleanly expressible as the triple. 0.85 that
    the three ECDLP obstructions all survive the Stage-1 audit -- the eigenspace
    argument is elementary and the degree comparison is a count, so the risk is
    concentrated in the extension-route circularity argument. 0.9 that the
    census produces at least one UNDETERMINED row with a named missing fact,
    which is itself useful. The low-probability, high-value branch is the
    rank-1 instantiation falsifier, at 0.03.

  id_allocation_provenance: >-
    python3 tools/allocate_id.py --next idea --date 20260806 (random token, no
    state scanned), then --check IDEA-20260806-7955a5 returned
    "well-formed and free across the union" before this file was written.

