idea:
  id: IDEA-20260807-caf061
  question_id: RQ-INSTR-f8faa0
  added: '2026-08-07'
  title: >-
    THE CAMPAIGN'S DETECTION FLOOR AND ITS ADJUDICATION CONTRACT: one committed run
    already reports 37 statistical verdicts with no multiplicity accounting, so
    about 1.9 false positives are expected under a global null; declare one primary
    metric per lane, set the permutation resolution floor 1/(B+1) FROM the
    multiplicity budget rather than after it, analyse class labels blind, and audit
    every disposition tree for unreachable branches -- the defect that made
    EXP-STR-003's `mixed` branch impossible and left an instrument question
    permanently UNADJUDICATED
  class: control

  claim: >-
    (A) THE MULTIPLICITY IS ALREADY LIVE, WITH NUMBERS. RUN-ICINV-p4001-a's metrics
    block contains, for the target class and three control classes, seven
    statistical verdicts each (decomp_rate_m2, decomp_rate_m3, liftable_density,
    window_fb_size, s3_support, order, two_torsion_x), i.e. 28; plus three NULL-C
    permutation p-values; plus six window_decay permutation p-values. That is 37
    tests in ONE run of ONE lane, reported without any family declaration or
    multiplicity adjustment. Under a global null at the conventional level, the
    expected number of spurious "over-dispersed" or "significant" calls is
    37 * 0.05 = 1.85. The run reports over-dispersion on five of seven functionals
    in every class, so multiplicity is not the whole story there -- but a campaign
    that runs fourteen lanes at this density will accumulate hundreds of tests, and
    at that point the leading explanation for its most striking single result is
    that it ran many tests.

    (B) THE RESOLUTION FLOOR MUST BE SET BEFORE THE BUDGET IS SPENT, AND IT IS AN
    ARITHMETIC CONSTRAINT, NOT A PREFERENCE. A permutation p-value estimated from B
    draws cannot go below 1/(B+1) with the standard estimator. Holm-Bonferroni over
    a family of m tests requires the smallest p-value to fall below alpha/m. So the
    design must satisfy 1/(B+1) < alpha/m, i.e. B > m/alpha - 1. Concretely:
      m = 14 (one primary metric per lane), alpha = 0.05: threshold 3.571e-3,
        requiring B > 279. Comfortable.
      m = 37 (this one run's family), alpha = 0.05: threshold 1.351e-3, requiring
        B > 739. The committed NULL-C used B = 2000 (floor 4.998e-4) and passes;
        window_decay used B = 1000 (floor 9.990e-4) and passes, barely.
      m = 200 (a plausible campaign total), alpha = 0.05: threshold 2.500e-4,
        requiring B > 3999. NEITHER committed setting reaches it.
    So the campaign can already be shown, before running anything, to be one
    accounting decision away from a floor it cannot reach. Declaring ONE primary
    metric per lane buys a factor of about 14 in the required B and is the cheapest
    fix available. Secondary metrics remain reported, in a separate exploratory
    family with its own declared error control, and are never the basis of a lane's
    headline.

    (C) THE ADJUDICATION DEFECT THIS EXISTS TO PREVENT, NAMED FROM THE RECORD.
    DEC-20260727-009 documents an instrument question that ended UNADJUDICATED and
    blocked a conclusion. Two specific design defects are named there and both are
    checkable at contract-freeze time, before any compute:
      DEFECT 1 -- A CONTROL THAT IS EXISTENCE-VALID AND COMPARATIVE-INVALID. The
        decision records that arm E as frozen "was a valid EXISTENCE control and a
        MIS-SPECIFIED COMPARATIVE one, diverging by closure convention on an
        uncontrolled nuisance variable rather than by endomorphism content." An arm
        that shows a thing CAN happen is not an arm that shows WHY it happened. The
        preventive audit is a one-line declaration per control: is this an existence
        control or a comparative control, and if comparative, which nuisance
        variables are held fixed and by what mechanism? A comparative control with
        an unnamed nuisance variable is not approvable.
      DEFECT 2 -- AN UNREACHABLE BRANCH IN THE DISPOSITION TREE. The decision records
        that "the contract's own `mixed` branch, whose disposition is `inconclusive`,
        is unreachable by construction (S_i = not F_i) even though the measured S1
        pattern is literally mixed". A disposition tree whose criteria are defined as
        exact complements cannot reach an intermediate verdict, so the honest outcome
        has no branch to land in. The preventive audit is mechanical: enumerate the
        tree's branches, and for each one exhibit an assignment of the criteria that
        reaches it. A branch with no witnessing assignment is deleted or the criteria
        are redefined -- before the contract is frozen. This costs minutes and would
        have prevented the recorded failure.

    (D) BLINDING, BECAUSE THE FORKING PATHS ARE REAL HERE. The campaign's analyst
    chooses which classes to pool, which functionals to feature, which windows to
    show and which null to lead with. DEC-20260727-009 R2 records the concrete
    version of this risk: "the one-variable ablation EXP-STR-002's own specification
    declared at lines 36-39 and never implemented." The preventive design is
    two-stage and cheap: STAGE ONE, the executor computes every declared functional
    for every curve and emits a table with class labels REPLACED BY OPAQUE TOKENS;
    STAGE TWO, the analysis script is frozen and committed; STAGE THREE, the label
    map is joined and the script is run once. The commit order is the evidence, and
    it is verifiable by git rather than by assertion.

    (E) THE DELIVERABLE. A four-part campaign contract addendum: (i) the primary
    metric declaration, one per lane, with its null and its family; (ii) the
    B-from-m rule with the arithmetic worked for the declared m; (iii) the two
    disposition-tree audits, existence-versus-comparative and branch reachability,
    as approval gates; (iv) the blind-analysis commit order. Each part is a gate a
    lane contract passes or fails, and each costs minutes.

    (F) WHAT EACH OUTCOME MEANS. If the campaign's headline results survive Holm at
    the declared family size, they are strengthened and the strengthening is
    quantified. If they do not, the honest report is that the campaign's evidence is
    exploratory, which is a legitimate and common outcome and is far better
    discovered by this record than by an external reviewer. If a disposition tree is
    found unreachable during the audit, the audit paid for itself immediately.

  resource_label: 'audit: consumes no resource'
  admissibility: admissible
  admissibility_argument: >-
    No oracle, no attack, no resource. This governs how the campaign's fourteen lanes
    report, not what they compute. It is admissible trivially and its interest is
    that it is the only proposal in the lane whose object is the CAMPAIGN rather than
    a single instrument.

  discriminated_from:
    - >-
      IDEA-20260807-34754f, which fixes ONE null's validity. This fixes the error
      rate across many nulls. A perfectly valid null used 200 times without
      accounting produces about 10 spurious findings at the conventional level.
    - >-
      IDEA-20260807-efc8de, which produces the minimum detectable effect at a single
      test's alpha. Multiplicity RAISES the required alpha threshold and therefore
      RAISES delta*, so the two records must be composed: the campaign's true
      detection floor is efc8de's delta* computed at alpha/m, not at alpha. That
      composition is this record's quantitative contribution to efc8de.
    - >-
      IDEA-20260807-f6137c, which decides which instruments not to build. This
      decides how to report the ones that are built.
    - >-
      DEC-20260727-009 itself, which is cited as the source of the two named design
      defects. This record asserts nothing about H-STR-002, about phi_alpha, or about
      any verdict in that decision; it extracts two reusable, checkable design rules
      from its recorded contract analysis.

  object_first_candidate:
    tracked_object: >-
      THE CAMPAIGN'S DECLARED TEST FAMILY: the ordered list of primary metrics, one
      per lane, with each one's null, its family membership, and its permutation
      budget B.
    lossiness: >-
      GENUINELY LOSSY. It forgets every measured value, every curve and every
      functional's meaning, retaining a list of test identifiers and one integer per
      test. What it discards is discarded compatibly with the campaign's operations:
      re-running a lane, changing a functional's implementation, or adding curves
      changes the values and not the family, while adding a test changes the family
      and therefore changes every other test's threshold -- which is exactly the
      dependency an error-rate control must track and an individual lane cannot see.
    propagation: >-
      Under adding a lane the family grows by one and all thresholds tighten by
      alpha/m. Under splitting a metric into primary and exploratory the primary
      family shrinks and thresholds loosen. Deterministic and computable before any
      measurement, which is what makes it a design object rather than an analysis
      step.
    survival_score: >-
      Survives every implementation change and every re-run. Dies the moment a test
      is added after the data are seen, which is the event the commit order in (D)
      makes visible.

  mechanism: >-
    STEP 1 -- ENUMERATE THE FAMILY THAT ALREADY EXISTS. Count the tests in
    RUN-ICINV-p4001-a exactly (predicted 37: 4 classes times 7 verdicts, plus 3
    NULL-C, plus 6 window_decay) and recompute each reported call under
    Holm-Bonferroni at m = 37. Report which of the run's calls survive. This is
    arithmetic on committed numbers and needs no execution.

    STEP 2 -- DECLARE ONE PRIMARY METRIC PER LANE. Fourteen entries, each naming the
    functional, the null, the direction and the pre-registered effect threshold.
    Everything else is exploratory and is reported in a clearly separated family.
    This is the single decision that makes campaign-level control affordable.

    STEP 3 -- SET B FROM m. Compute B > m/alpha - 1 for the declared m and set every
    permutation budget accordingly, printing the floor 1/(B+1) beside every reported
    p-value so a floored value can never be read as strong. For m = 14, B = 500 is
    ample; for an exploratory family of 200, B = 5000 is needed and the cost is
    linear in B and negligible beside the measurement.

    STEP 4 -- THE TWO CONTRACT AUDITS, AS APPROVAL GATES.
      AUDIT A, existence versus comparative: for every control arm in every lane
      contract, one declared line -- existence or comparative; if comparative, the
      nuisance variables held fixed and the mechanism holding them.
      AUDIT B, branch reachability: enumerate the disposition tree's branches and
      exhibit, for each, a criteria assignment that reaches it. Any branch with no
      witness is deleted or the criteria are redefined. Both audits are performed
      before freezing and their results are part of the contract.

    STEP 5 -- BLIND ANALYSIS COMMIT ORDER. Executor emits the token-labelled table;
    the analysis script is committed; the label map is joined; the script runs once.
    The git order is the artifact and is checkable by a reviewer without re-running
    anything.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Commands run 2026-08-07: rg -i "Holm|multiplicity|family-wise|false discovery"
      across the repository; full read of DEC-20260727-009 including
      instrument_question_disposition and alternatives_considered; full read of
      harness/exp_icinv.py::permutation_null and harness/run_icinv.py's reporting
      path; read of RUN-ICINV-p4001-a's metrics block and of its window_decay block.
    results: >-
      "Holm accounting" appears once, in research_goals_20260723.md, as a control in
      an unrelated earlier design; there is no multiplicity control anywhere in
      GOAL-ENDO-001, no declared test family, and no primary-metric declaration in
      any lane. The permutation p-value estimator in harness/exp_icinv.py returns
      worse/iterations, which can be exactly 0 and which reports no floor -- and
      RUN-ICINV-p4001-a records exactly 0.0 at five of six window_decay cells. The
      two adjudication defects are recorded verbatim in DEC-20260727-009 but are not
      abstracted into a reusable rule anywhere.
    verdict: adaptation
  novelty_status_note: >-
    ADAPTATION. Holm-Bonferroni, primary-endpoint declaration and blinded analysis
    are standard experimental practice and none is claimed as new. What is specific
    is the arithmetic tying the permutation budget to the family size in this
    campaign's own numbers, and the abstraction of DEC-20260727-009's two recorded
    contract defects into pre-freeze audits. No external novelty is claimed.

  null_object_control: >-
    MANDATORY, AND IT IS A SIMULATION UNDER A GLOBAL NULL. Generate synthetic data in
    which NO functional depends on the class -- values drawn i.i.d. within the real
    class-size profile -- and run the entire declared reporting pipeline, including
    the primary declaration and Holm. The number of surviving "significant" calls
    must be at or below alpha over many repetitions. If the pipeline produces more
    than alpha, the multiplicity control is not working and the campaign's reports
    are not calibrated. SECOND NULL: the same simulation with the multiplicity
    control DISABLED, which must produce about alpha*m survivors -- 1.85 at m = 37 --
    demonstrating that the control is doing measurable work rather than being
    ceremonial.
    DECAY PARAMETER: the family size m. As m grows the number of surviving calls must
    stay flat at alpha under the control, and must grow linearly without it. A
    corrected pipeline whose survivor count GROWS with m is not controlling the
    family-wise rate, which is the canonical artifact tell for this instrument.

  assumptions:
    - >-
      Holm-Bonferroni controls the family-wise error rate under arbitrary dependence.
      Standard; it is chosen over less conservative procedures precisely because the
      campaign's tests are dependent in ways nobody has characterised -- the same
      curves, the same seeds, the same factor bases, and twist-paired classes.
    - >-
      The standard permutation p-value estimator is (1 + #{v <= obs})/(1 + B), whose
      floor is 1/(B+1). Elementary, and it differs from the committed
      worse/iterations, which can return 0.
    - >-
      Tests can be declared primary before the data are seen. This is a process
      assumption and the commit order in (D) is what makes it checkable rather than
      asserted.
    - >-
      The count of 37 tests in RUN-ICINV-p4001-a is exactly 4*7 + 3 + 6. Stated as a
      prediction to confirm in Step 1 against the committed metrics block, not as a
      fact.
    - >-
      Toy scale, as everything in this campaign is. Error-rate control does not make
      a toy result a crypto result and no record may read it that way.

  proof_search_map:
    not_applicable_reason: >-
      No theorem, asymptotic bound, certificate family, reduction or closure argument
      is proposed. The record's content is standard multiple-testing arithmetic
      applied to this campaign's declared design, plus two mechanical contract audits.
      The one inequality it relies on, B > m/alpha - 1, is immediate from the
      estimator's floor and is stated in full in the claim rather than needing a
      proof architecture.

  predictions:
    - metric: >-
        number of RUN-ICINV-p4001-a's reported calls surviving Holm at m = 37
      direction: lower
      minimum_effect: >-
        Fewer than the number currently reported. The liftable_density NULL-C call
        (p = 0.0005) survives 0.05/37 = 1.351e-3 and the decomp_rate_m3 call
        (p = 0.062) does not. Report the full survivor list; the exercise is
        arithmetic on committed numbers and cannot fail for technical reasons.
    - metric: >-
        required permutation budget B for the declared campaign family size m
      direction: higher
      minimum_effect: >-
        B > m/alpha - 1, i.e. 279 at m = 14, 739 at m = 37, 3999 at m = 200. Report
        the declared m and the chosen B side by side in every lane contract; a
        contract whose B is below the floor is not approvable.
    - metric: >-
        surviving significant calls under the global-null simulation, with and
        without multiplicity control
      direction: different
      minimum_effect: >-
        At or below alpha with control; about alpha*m without. At m = 37 that is
        about 0.05 versus about 1.85, a factor of 37, and observing that factor is
        what demonstrates the control works.
    - metric: >-
        number of unreachable branches found by Audit B across the fourteen lane
        contracts
      direction: higher
      minimum_effect: >-
        At least one is expected, because the defect occurred once already under a
        contract that was reviewed before freezing. Zero is a perfectly good outcome
        and would mean the campaign's contracts are better drafted than the
        precedent suggests.
    - metric: >-
        number of control arms declared comparative without a named nuisance variable
      direction: higher
      minimum_effect: >-
        Report the count. Each one is a contract that cannot be approved until the
        nuisance is named, and each one is a repeat of the recorded arm-E failure
        caught before it costs anything.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, and it is the whole cheap core of this record): count
      the tests in RUN-ICINV-p4001-a's committed metrics block and recompute the
      Holm survivors at m = 37. Arithmetic on numbers already in the repository.
      STAGE 1 (zero compute): compute B > m/alpha - 1 for m = 14, 37 and 200 and
      compare with the committed B = 2000 and B = 1000.
      STAGE 2 (minutes): the global-null simulation, with and without control, at
      m = 14 and m = 37, 1000 repetitions.
      STAGE 3 (zero compute): run Audit A and Audit B over every lane contract that
      exists; report the defect counts.
      STAGE 4 (zero compute): write the four-part contract addendum.
    controls:
      - global-null simulation with control, which must hold at alpha
      - the same with control disabled, which must show about alpha*m
      - the family-size sweep, whose survivor count must stay flat under control
      - the committed run's own numbers as the worked example
    required_metrics:
      - exact test count in the committed run, by category
      - Holm survivor list at m = 37, with each test's p-value and threshold
      - required B versus chosen B, per declared family
      - global-null survivor counts, controlled and uncontrolled, per m
      - Audit A and Audit B defect counts, per lane contract

  falsification_conditions:
    - >-
      The test count is not 37. The worked example is recomputed at the true count;
      the record's arithmetic is corrected rather than defended.
    - >-
      Every reported call survives Holm at the true m. Multiplicity is not currently
      binding on this campaign, the record's urgency is overstated, and it says so.
    - >-
      The global-null simulation exceeds alpha WITH the control applied. The
      implementation is wrong and nothing may be reported from it.
    - >-
      The simulation does not show about alpha*m without the control. The dependence
      among tests is strong enough that the naive count overstates the risk, which
      would itself be a useful measurement and would change the recommended m.
    - >-
      Audit B finds no unreachable branch anywhere. Good news, and reported as such;
      the audit remains a gate because its cost is minutes.

  confounders:
    - >-
      DEPENDENCE AMONG TESTS. The campaign's tests share curves, seeds, factor bases
      and twist-paired classes, so they are strongly dependent and Holm is
      conservative. The global-null simulation measures the actual dependence rather
      than assuming it, and a measured effective m below the nominal m is a legitimate
      and reportable refinement.
    - >-
      PRIMARY-METRIC GAMING. Declaring the primary metric after a pilot run is
      indistinguishable from declaring it before, unless the commit order shows
      otherwise. The blinding stage in (D) is the only defence and it must be
      enforced by artifact order, not by intention.
    - >-
      OVER-CORRECTION SUPPRESSING A REAL EFFECT. Holm at m = 200 raises the
      detection floor by about a factor of 4 in threshold, which by
      IDEA-20260807-efc8de's power curve raises delta* materially. That cost is real,
      is the price of the guarantee, and must be reported as the campaign's honest
      detection floor rather than hidden.
    - >-
      THE p-VALUE FLOOR MASQUERADING AS SIGNIFICANCE. A reported 0.0 is a floor, not
      a measurement. Printing 1/(B+1) beside every p-value is the fix and it is free.
    - >-
      SCOPE CREEP INTO POLICY. This record proposes contract gates, not ledger
      authority. Only the Coordinator approves contracts and changes status; nothing
      here alters that.

  interpretation_limits:
    - >-
      Error-rate control changes what a result MEANS, never what it IS. A
      Holm-surviving toy result is still a toy result under AGENTS.md rule 7.
    - >-
      A declared primary metric per lane is a reporting discipline, not a claim that
      the other metrics are uninteresting. Exploratory findings remain reportable in
      their own family.
    - >-
      The two contract audits are drawn from one recorded episode. One precedent is
      not a base rate, and this record does not claim that unreachable branches are
      common -- only that the audit costs minutes and the failure cost a batch.
    - >-
      Nothing here asserts anything about H-STR-002, phi_alpha, or any verdict in
      DEC-20260727-009.

  reachability_gate: >-
    NOT APPLICABLE, and stated rather than omitted: no movement between curves, no
    walk, no search, no curve of any kind is touched. T5 is untouched. The record's
    object is the campaign's reporting design.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR MOVED. Cost: Stages 0, 1, 3 and 4 are zero
      compute; Stage 2 is 1000 repetitions of a permutation over a few hundred
      values, seconds. Raising B from 2000 to 5000 costs 2.5 times the permutation
      time, which in RUN-ICINV-p4001-a was a small fraction of the 43.4-second run.
    memory_exponent: >-
      O(class size) floats. Negligible.
    best_known: >-
      Attack frontier unchanged: parallel rho at 0.886*sqrt(N) time and O(1) memory
      (KN-TECH-001, KN-TECH-006), automorphism-discounted rho on CM curves
      (KN-TECH-018), BSGS at sqrt(N) time and sqrt(N) memory. For REPORTING
      DISCIPLINE the incumbent is the campaign's current practice: no declared
      family, no multiplicity control, an estimator with no floor reported.
    hidden_overhead: >-
      The hidden cost is a HIGHER detection floor: controlling the family-wise rate
      at m tests raises the required effect size, and by IDEA-20260807-efc8de's power
      curve that is a real loss of sensitivity. Disclosed here rather than absorbed,
      because a campaign that discovers it after reporting a negative will have
      overstated what the negative excludes.
    tradeoff_note: >-
      The tradeoff is explicit and quantified: family size m against detection floor
      delta*(alpha/m). Declaring one primary per lane keeps m at 14 and the floor
      near delta*(0.0036); reporting everything as primary pushes m to about 200 and
      the floor to delta*(0.00025). The design choice is which findings the campaign
      is willing to be unable to see.

  dominated_by: >-
    AS AN ATTACK: mounts none; dominated on every axis by every row of the
    prime-field frontier -- parallel rho at 0.886*sqrt(N) time and O(1) memory
    (KN-TECH-001, KN-TECH-006), automorphism-discounted rho on CM curves
    (KN-TECH-018), BSGS at sqrt(N) time and sqrt(N) memory. Checked across time,
    memory and data/queries; nothing contested.
    AS A REPORTING CONTROL: there is no incumbent in this campaign to dominate --
    the current practice declares no family and applies no correction -- so the
    comparison is against the absence. It is dominated on SENSITIVITY by reporting
    without correction, which is exactly the tradeoff in tradeoff_note, and by less
    conservative procedures such as Benjamini-Hochberg, which would be preferable if
    the dependence structure were characterised; Holm is chosen because it is valid
    under arbitrary dependence and the dependence here is uncharacterised.
  sota_delta: >-
    Zero speedup against any attack baseline; no exponent moves. Reporting delta,
    quantitatively: converts an undeclared family of 37 tests in a single committed
    run into a declared family of 14 primaries plus an exploratory remainder;
    reduces the expected number of spurious calls under a global null from
    37 * 0.05 = 1.85 to 0.05, a factor of 37; supplies the constraint
    B > m/alpha - 1 with worked values 279, 739 and 3999 against committed budgets of
    2000 and 1000, showing that the current settings suffice at m = 37 and fail at
    m = 200; replaces an estimator that returned exactly 0.0 at five of six committed
    cells with one whose floor 1/(B+1) is printed; and adds two pre-freeze contract
    audits whose absence is documented to have cost one batch.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low

  honest_prior_of_survival: >-
    0.9 that the test count and the Holm recomputation come out as predicted -- it is
    arithmetic on committed numbers. 0.95 that the B-from-m inequality holds, being
    algebra. 0.5 that Audit B finds an unreachable branch in the current contracts,
    which is the record's one genuinely uncertain empirical prediction. Priority is
    LOW deliberately and the reason is stated rather than hidden: only one lane has
    reported, so multiplicity is not yet binding, and the record's value is almost
    entirely preventive. It should be adopted before the third lane reports, at which
    point deferring it further would mean retrofitting a family declaration onto data
    already seen -- which is exactly the thing it exists to prevent, and which would
    make it unadoptable rather than merely late.

