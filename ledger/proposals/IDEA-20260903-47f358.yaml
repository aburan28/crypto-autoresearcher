idea:
  id: IDEA-20260903-47f358
  question_id: RQ-ICINV-475b5e
  added: '2026-09-03'
  title: >-
    Certified exhaustive isogeny-class search for a prime-field curve model whose
    point-decomposition presentation has a lower first-fall / root-finding degree
  class: measurement
  claim: >-
    For a generic ordinary prime-field curve E/F_p with prime order, NO F_p-isomorphism
    class in the F_p-isogeny class of E presents the point-decomposition problem more
    cheaply than E itself or than a matched random curve outside the class, for the three
    presentations measured: (F1) the monomial support of S_3, (F2) the first-fall degree
    of {S_3(x1,x2,x_R), x1^h-1, x2^h-1} with a subgroup factor base of order h | p-1, and
    (F3) the F_p-root count of the fibre polynomial S_3(u1^k, u2^k, x_R) for the
    polynomial factor base x = u^k. Pre-registered values: F1 = 13 off j in {0,1728};
    F2 = h + 2; F3 mean = 1 with per-sample variance of order k. The claim is falsified
    by any member of a CERTIFIED (census-complete) class whose F3 mean lies more than
    four pooled standard errors outside the null band, or whose F2 differs from the null
    value, on a generic input (D_0 not in {-3,-4}).
  mechanism: >-
    (1) Tate: every F_p-rational isogeny of any degree stays in the trace class, which is
    finite of mass H(4p - t^2). (2) For prime N every rational isogeny is a bijection on
    F_p-points, so relations R = P1 + ... + Pm are preserved and only the polynomial
    PRESENTATION -- the model (a',b') and the pull-back of the factor base through the
    degree-ell x-map -- changes. (3) Degree functionals are F_p-isomorphism invariant, so
    the search object is the set of (j, twist) in the class, enumerated by a BFS over
    rational ell-isogenies found by factoring the division polynomial psi_ell (no modular
    polynomial), codomains by Velu/Kohel from the kernel polynomial, every codomain
    order-checked, Phi_2/Phi_3 checked, and the weighted count compared exactly with the
    Hurwitz-Kronecker class number. (4) The lossy-projection analysis (DESIGN.md section
    0 and 4) predicts constancy: F1 is pinned off j in {0,1728}, F2 by x1^{h-2} S_3 -
    c x2^2 (x1^h - 1) at degree h+2, and F3's fibre curve is the pull-back of a genus-one
    image curve through (u1,u2) -> (u1^k,u2^k), reducible only when x is a k-th power in
    F_p(E), i.e. b = 0. The search is run because an ARGUED negative is `unverified`
    under docs/inventor-protocol.md section 4 and an ENUMERATED, CERTIFIED negative is a
    closure with a measured obstruction the next factor-base map can be tested against.
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-09-03'
    corpus_paths_grepped:
    - ledger/ (isogen, summation, degree of regularity)
    - knowledge/techniques, knowledge/findings, knowledge/open-problems
    - analysis/endomorphism-isogeny-decomposition, analysis/isogeny-class-screening
    grep_results:
    - 'RQ-ISO-001 / H-ISO-001 / EV-ISO-001: 2/3/5-isogeny NEIGHBOURS of one curve at p ~ 2^13
      with a non-algebraic (smallest-x) factor base; d_reg pinned at 2 by construction;
      unresolved confound "larger degrees / longer walks untested". This proposal closes
      that confound by enumerating the whole class with a certificate.'
    - 'RQ-ICINV-475b5e / EV-ICINV-343679: one complete class (138 curves, one prime);
      Betti table, regularity, singular locus, elimination degree class-constant AND
      null-constant; disposition refine, asking for other functionals and primes. F3 is
      such a functional; the instrument is dependency-free and runs at any p < 2^24.'
    - 'KN-OPEN-002: growth of the prime-field summation-polynomial solving degree; F2 = h+2
      is a measured data point on its subgroup-factor-base variant.'
    - 'kb/ retrieval index queried; returned its documented empty-index error
      (CRYPTO_KB_QDRANT_URL = :memory:), so this screen is grep-only and absence there is
      not evidence of novelty.'
    literature_verified: []
    conclusion: >-
      Marked unverified because one citation is recalled (validator rule); substantively an adaptation: class enumeration by division-polynomial factoring plus Velu is
      standard; the novelty is the certified-exhaustive framing with pre-registered
      closed-form predictions and a matched null, applied to the presentation
      functionals rather than to the relation set.
  citations:
  - ref: KN-TECH-002
    provenance: internal
    claim: Semaev summation polynomial S_3 for short Weierstrass curves
    verified_by: this proposal -- formula reproduced and unit-tested in tools/isogeny_dreg_search.py
  - ref: KN-TECH-011
    provenance: internal
    claim: first-fall / solving degree as the Groebner cost driver
    verified_by: this proposal
  - ref: EV-ICINV-343679
    provenance: internal
    claim: class-constant AND null-constant functionals carry no isogeny-class information
    verified_by: this proposal -- record read in full
  - ref: EV-ISO-001
    provenance: internal
    claim: neighbour-level isogeny audit found no PDP effect at p ~ 2^13
    verified_by: this proposal -- record read in full
  - ref: Tate isogeny theorem (same trace <=> F_p-isogenous) and Velu's formulas
    provenance: recalled
    claim: class finiteness and codomain formulas; the code checks every codomain's order and Phi_2/Phi_3 independently of the recollection
    verified_by: null
  assumptions:
  - The input curve is ordinary with prime order N and a generic discriminant (D_0 not in {-3,-4}); j in {0,1728} classes are the positive control, not the target.
  - The class-generating set of small split primes reaches the whole class; the census detects when it does not, and the tool then refuses the word "exhaustive".
  - Order checks on random points with N prime prove #E' = N; for composite N they are a strong check, not a proof, and the census remains the binding certificate.
  proof_search_map:
    bottleneck: >-
      The polynomial presentation of the decomposition step, not the relation set: an
      isogeny of prime-order curves cannot change which decompositions exist.
    baseline_embedding:
      parameter_slice: >-
        The input curve itself (depth 0 in the BFS) is the baseline; every functional is
        measured on it with the same code and seed discipline.
      reproduction_check: >-
        tests/test_isogeny_dreg_search.py -- brute-force class enumeration at p = 211,
        codomain trace and Phi_ell identities, and the closed form d_ff = h + 2.
    observation_collision:
      observable: >-
        (F1, F2, F3) per F_p-isomorphism class; a collision is a class member whose
        observable differs from the input curve's while the relation set is the same.
      distinct_preimage_search: >-
        The BFS over the whole class IS the preimage search; the null set supplies
        distinct-class preimages of the same observable.
    constructive_transforms:
    - transform: observable_fiber
      proposed_object: >-
        The fibre curve S_3(u1^k, u2^k, x_R) = 0 per class member; its F_p-root density
        detects reducibility or degeneration of the presentation.
      predicted_gain: >-
        None expected (section 4 of DESIGN.md); a survivor would at most be a constant
        factor in root-finding degree until shown otherwise.
    quantifier_order: >-
      FOR the tested (p, k, h) and FOR ALL members E' of the certified class of E: does
      THERE EXIST a functional value outside the null band? Not: for all curves, for
      all factor-base maps.
    method_ceiling:
      strongest_certifiable_claim: >-
        Scoped negative with measured obstruction (F2 = h + 2, F3 band) over one certified
        class at one prime, or a survivor list to hand to /design-experiment.
      nearby_object_control: >-
        Random curves of a different trace at the same p, same k, h, samples and code.
    proof_obligations:
    - claim: enumeration is complete
      responsibility: correctness
    - claim: functionals are isomorphism-invariant
      responsibility: scope
    - claim: F2 = h + 2 on every model with a'b' != 0
      responsibility: strictness
    not_applicable_reason: null
  predictions:
  - metric: F1_support
    direction: different
    minimum_effect: any member with support != 13 on a generic (D_0 not in {-3,-4}) input
  - metric: F2_first_fall_degree
    direction: lower
    minimum_effect: any member with d_ff < h + 2
  - metric: F3_fibre_root_mean
    direction: higher
    minimum_effect: >
      more than 4 pooled standard errors above the null-band mean on a certified class
  minimal_test:
    design: >-
      The ladder python3 tools/isogeny_dreg_search_fast.py --ladder 20,24,28,32,36,40
      --seed S --workers 4: one random generic curve per field size, the whole
      F_p-isogeny class enumerated and certified (exact census), F1/F2/F3 on every
      member and on 8 different-trace null curves; plus --p 1009 --a 0 --b 7 as the
      positive control. A run counts only with exhaustive: true. Survivors go to a
      Groebner verification (Sage/msolve) under an approved EXP-* contract. The seed-7
      ladder is recorded in analysis/isogeny-dreg-search/runs/ as smoke output, not as
      RUN-* records.
    controls:
    - matched null of random different-trace curves at the same p (same code, seeds, sample counts)
    - positive control: a D_0 = -3 class must flag its j = 0 members as F1 survivors
    - structural tell: within-class F3 spread must not exceed the null spread beyond sampling error and must shrink with samples
    - per-codomain order check, Phi_2/Phi_3 check, exact Hurwitz-Kronecker census
    required_metrics:
    - certified (bool), class_size, coverage_fraction
    - per-member F1, F2, F3 (mean, max, histogram); null band; survivors with flags
    - order_checks_passed, modular_polynomial_checks_passed, timings
  falsification_conditions:
  - A certified class of a generic input with an F3 survivor reproduced on an independent seed.
  - Any member with F2 < h + 2 (would also indicate an instrument defect to rule out first).
  - Census failure that persists after adding all split primes up to 50: enumeration code defect, not a result.
  confounders:
  - Sampling noise in F3 at small `samples`; guarded by the pooled standard error and the decay-with-samples tell.
  - Choosing h or k that share factors with |Aut| or with the class conductor; report both and vary them.
  - Composite N: isogenies need not be bijections on F_p-points; the tool assumes N prime for the bijection argument and reports N.
  interpretation_limits:
  - Toy scale only (p < 2^24 on the reference engine, p <= 2^40 on the fast engine); nothing transfers to cryptographic p without the smooth-degree-ball fallback in DESIGN.md section 5, which is exhaustive over smooth degrees only.
  - Even a survivor is a constant-factor presentation effect until an exponent argument exists; dominated_by stays Pollard rho.
  - Exhaustive over the isogeny CLASS of the input curve; never over all primes below 2^40, which is ~2^55 models and out of reach by counting.
  heuristic_assumptions:
  - id: H1
    statement: >-
      For a fixed model, the number of F_p-roots in u2 of S_3(u1^k, u2^k, x_R) at random
      (R, u1) behaves like k times a Binomial(2, 1/k)-distributed count, mean 1.
    rigorous_support: >-
      Weil bound on the fibre curve (p + O(g sqrt p) points), with the mu_k orbit structure
      of roots; the Binomial shape is the random-model idealisation to be checked.
    validation_plan: >-
      Compare the pooled null histogram against the Binomial(2,1/k) prediction at samples
      >= 128 on >= 8 null curves; tail check on the maximum count (2k).
  target_complexity:
    time_exponent: not_applicable (measurement / control proposal; no attack claimed)
    memory_exponent: not_applicable
    best_known: p^{1/2} (Pollard rho)
    hidden_overhead: none claimed
    tradeoff_note: none
  dominated_by: Pollard rho at exponent 1/2; this proposal claims no attack and no exponent.
  sota_delta: >-
    No attack delta. Methodological delta: replaces neighbour-level audits (EV-ISO-001)
    with a certified whole-class enumeration and pre-registered closed-form predictions,
    dependency-free, minutes per class at p < 2^20.
  estimated_cost:
    implementation: low -- implemented in tools/isogeny_dreg_search.py (reference) and tools/isogeny_dreg_search_fast.py (flint), tests green
    compute: low (seconds per class at p <= 2^24; about 20 ms CPU per member, so roughly 3 CPU-hours for the ~5.5e5-member class at p ~ 2^40)
  recommended_priority: medium
  scope: >-
    Ordinary prime-order curves over F_p, p < 2^24 on the reference engine; whole
    F_p-isogeny class; factor bases x in the order-h subgroup of F_p^* (F2) and x = u^k
    (F3); m = 2 decomposition. Analysis note: analysis/isogeny-dreg-search/DESIGN.md.
