idea:
  id: IDEA-20261007-cefca4
  question_id: RQ-GFPN-c01af8
  added: '2026-10-07'
  status: proposed
  approved_by: null
  title: >-
    2-adic valuation of a toy double-odd group order against a cofactor-1 curve
  class: measurement
  claim: >-
    Let p' be the smallest prime >= 3 such that F_{p'^5} contains a
    nonsingular double-odd curve y^2 = x(x^2 + a x + b) with b a
    nonsquare and exactly one rational point of order 2, and a
    nonsingular ordinary curve of prime order. Let v2 count the
    factors of 2 in the group order, including infinity. The claim is
    v2 = 1 on the double-odd curve and v2 = 0 on the prime-order
    curve. The curve y^2 = x^3 + x is not used. Gaudry's exponent
    at n = 5 stays 8/5, and the delta versus that exponent is 0.
  mechanism: >-
    The double-odd model contributes the point (0, 0) of order 2, so
    2 divides the order. A rational point of order 4 would raise v2
    to at least 2. The prediction is that the smallest example has
    no such point. A prime-order curve has v2 = 0. The test is a
    point count. It does not build a summation ideal and it does not
    score a Macaulay rank.
  novelty_status: unverified
  citations:
    - ref: KR-IC-46d822
      provenance: internal
      claim: >-
        Gaudry's exponent at fixed n = 5 is 8/5. This count does not
        change it.
      verified_by: >-
        coordinator, 2026-10-07, opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-46d822.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic algorithm needs on the order of the square root of
        the group order. v2 is not that bound.
      verified_by: >-
        coordinator, 2026-10-07, opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
  assumptions:
    - A singular curve is instrument_failure, not a value of v2.
    - Prime order is checked by a deterministic point count at this toy size.
  predictions:
    - metric: v2 of the double-odd group order
      direction: different
      minimum_effect: exactly 1
    - metric: v2 of the prime-order group order
      direction: different
      minimum_effect: exactly 0
  minimal_test:
    design: >-
      Search primes p' >= 3 in order. Skip a prime that lacks either
      curve role. On the first prime that has both, count points over
      F_{p'^5}, including infinity, and report v2. Do not use
      y^2 = x^3 + x. Do not build a factor base.
    controls:
      - A zero discriminant voids the run.
      - The double-odd arm must have exactly one rational point of order 2 before v2 is scored.
      - The prime-order arm must have no rational point of order 2. A point of order 2 there is instrument_failure, not v2 = 0.
      - Repeating the point count must return the same order.
    required_metrics:
      - v2_double_odd
      - v2_cofactor_1
      - the prime p'
      - both group orders
  falsification_conditions:
    - v2 of the double-odd order is at least 2 after the torsion census passes.
    - v2 of the prime-order curve is at least 1 after that curve is confirmed to have prime order.
  confounders:
    - A curve with three rational points of order 2 is not the double-odd arm. It is not scored as the claim.
    - Infinity is included in the order. Omitting it shifts v2 and voids the run.
  interpretation_limits:
    - Toy scope: one prime p' and extension degree 5.
    - The exponent 8/5 is unchanged whether or not v2 equals 1.
    - This is not a statement about the ideal degree 2^16.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The smallest admissible double-odd curve has no rational
        point of order 4, so the single point of order 2 contributes
        the only factor of 2. This is not proved for every p'.
      rigorous_support: >-
        A rational point of order 2 forces v2 >= 1. Nothing opened
        in this session forces v2 = 1 rather than v2 >= 2.
      validation_plan: >-
        Compute v2 at the smallest admissible p' and at the next
        admissible prime. If the second prime has v2 >= 2 on the
        double-odd arm, H1 fails and no p'-independent valuation is
        inferred. The reading of the first prime is still recorded.
  target_complexity:
    time_exponent: unchanged at 8/5
    memory_exponent: >-
      Unchanged. The test stores one curve over F_{p'^5} at the
      smallest admissible p'.
    best_known: >-
      KR-IC-46d822, Gaudry O-tilde(q^{8/5}) at n = 5, against rho
      at exponent 1/2 of the group order (KR-RHO-13bf67).
    hidden_overhead: No o(1) term is claimed. The output is two integers.
    tradeoff_note: >-
      The discrete-log exponent stays 8/5 for Gaudry and 1/2 for a
      generic algorithm. This is not a van Oorschot-Wiener tradeoff.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: >-
    Checked KR-IC-46d822 and KR-RHO-13bf67, both opened 2026-10-07.
    KR-IC-46d822 dominates the exponent: a 2-adic valuation is not an
    exponent. The distance from 8/5 to the generic exponent on a
    group of size about q^5 stays in place. This count does not
    shrink it.
  sota_delta: >-
    Zero change to the exponent 8/5. The integers the test measures
    are v2 = 1 and v2 = 0. Relative to KR-IC-46d822 the leading term
    is unchanged, so the delta is 0.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-IC-46d822
      - KR-IC-955fd6
      - KR-IC-e2d81b
      - KR-RHO-13bf67
    nearest:
      - ref: KR-IC-46d822
        provenance: internal
        relation: orthogonal
        delta: >-
          Gaudry's cost is O-tilde(q^{8/5}). This proposal outputs
          two 2-adic valuations and states exponent delta 0.
      - ref: KR-RHO-13bf67
        provenance: internal
        relation: orthogonal
        delta: >-
          The generic bound is on the order of the square root.
          v2 does not undercut it.
    searched:
      corpus_grep:
        - "v2 of the group order"
      web: []
      blocked:
        - "No web search in this session; novelty stays unverified."
  proof_search_map:
    bottleneck: the 2-adic valuation of one toy group order
    baseline_embedding:
      parameter_slice: the prime-order curve over the same field, where v2 = 0 is the null
      reproduction_check: the point count is repeated and must agree
    observation_collision:
      observable: v2
      distinct_preimage_search: two curves with the same order and different torsion types, if found, are reported and do not change the threshold
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: the smallest admissible prime only
        predicted_gain: two integers, v2 = 1 and v2 = 0
    quantifier_order: >-
      There exists a smallest prime p' at which both curve roles
      exist and the two valuations match the claim. Not a statement
      for every prime.
    method_ceiling:
      strongest_certifiable_claim: v2 on two curves at one prime, plus the next prime as a stability check
      nearby_object_control: the prime-order curve
    proof_obligations:
      - claim: the torsion census matches the arm before v2 is scored
        responsibility: baseline
      - claim: a valuation is not an exponent
        responsibility: scope
    not_applicable_reason: >-
      No summation ideal is built. The selected transform is
      specialization_pack.
