idea:
  id: IDEA-20260805-411b60
  question_id: RQ-FRODO-3260cc
  added: '2026-08-05'
  title: >-
    A mutation control with a derived magnitude: predict, before the run, exactly
    how many bits FrodoKEM's decryption failure rate must move when one table entry
    is perturbed, and use the prediction to license or refuse the reproduction
  class: measurement

  claim: >-
    RQ-FRODO-3260cc requires a mutation control -- agreement with a published
    decryption failure rate counts as a reproduction only after the pipeline is
    shown to DETECT a seeded perturbation. This proposal asserts that the standard
    form of that control is too weak to do the job, and supplies the strong form.
    A control that merely asks "did the output change?" passes for any pipeline
    whose output depends on its input at all, including a pipeline that is wrong
    by a factor of a million. The strong form asks "did the output change BY THE
    AMOUNT DERIVED IN ADVANCE?", and that derivation is available here in closed
    form: the failure rate's sensitivity to a table entry factors through a single
    scalar -- the error term's variance -- with a computable derivative, so a
    one-unit perturbation of the tail entry has a PREDICTED response in bits that
    can be written down before the pipeline exists. On the excerpt table that
    prediction is 0.167 bits for a specific named perturbation. A pipeline that
    reports 0.02 bits or 2 bits has failed a control it would have passed in the
    weak form. This proposal further supplies a null object whose failure rate has
    an exact closed form (a Rademacher error distribution, for which the whole
    convolution collapses to a binomial tail), a positive control that pins the
    exact pipeline against sampling, and a pre-registered directional bracket
    derived from the table's kurtosis. NOTHING IS CLAIMED ABOUT WHETHER FRODOKEM'S
    PUBLISHED FAILURE RATES REPRODUCE. No run has happened and no primary text has
    been read.

  object_first_candidate:
    tracked_object: >-
      THE EXACT RATIONAL TAIL MASS OF THE DECRYPTION NOISE TOGETHER WITH ITS
      GRADIENT WITH RESPECT TO THE TABLE. Not the failure rate scalar: the pair
      (tail mass, d log2(tail mass)/d p_k for each table cell k). The gradient is
      the part that has never been computed anywhere in this corpus for any scheme,
      and it is what turns a mutation control into a quantitative instrument rather
      than a smoke test.
    established_families_off_limits: >-
      Off-limits as the primary lens: the lattice-estimator family in every form
      (GOAL-FRODO-001.non_duplication reserves it for GOAL-MLKEM-003 and -004);
      implementation-side attacks (KN-LIT-2088, KN-LIT-3859, KN-LIT-118,
      KN-TECH-047); decryption-failure ATTACKS and failure boosting as an attack
      technique (KN-TECH-048) -- the attack-cost lane is IDEA-20260805-f16b44's and
      mixing it in here is exactly the tier blurring
      GOAL-FRODO-001.next_action forbids; and Monte-Carlo estimation of the failure
      rate as the primary method, which cannot reach 2^-138 and would be a
      different claim entirely. The lens retained is exact rational convolution
      with a derived sensitivity.
    newness_score: >-
      Exact convolution to compute a decryption failure rate is standard practice
      and the designers did it. What is proposed here and is not in this corpus is
      the GRADIENT, used as a pre-registered response magnitude for the mutation
      control. The corpus's own controls census (39 of 1694 run directories are
      controls; 166 of 229 evidence records have no null anywhere; a positive
      control appears in 26 of 195 specifications) says the program has almost
      never built a control with a derived expected magnitude at all. The Rademacher
      null with its exact binomial closed form is likewise absent.
    testability_score: >-
      High for the control machinery, which is arithmetic on small objects, and
      GENUINELY UNCERTAIN for the full-dimension exact convolution, whose cost
      GOAL-FRODO-001.pause_conditions already flags as possibly exceeding the
      campaign budget. The proposal is therefore designed so the controls and the
      gradient are established at low cost FIRST and the full recomputation is the
      last and most expendable stage.
    survival_score: >-
      The tracked pair survives the whole convolution -- the gradient of a
      convolution with respect to a factor's parameters is itself a convolution, so
      it is computable by the same machinery at the same cost. It dissolves exactly
      where the independence of the summands does, which is the boundary the
      hypothesis's numbered heuristic marks.

  mechanism: >-
    THE STRUCTURE OF THE FAILURE EVENT. RECALLED, UNVERIFIED, AND A READ TARGET:
    FrodoKEM's decryption noise in one coordinate has the form

      X = sum_{i=1}^{n} ( e'_i s_i  -  s'_i e_i ) + e'' ,

    i.e. 2n independent PRODUCTS of two independent chi samples plus one further
    chi sample, and decryption of that coordinate fails when |X| >= t where t is the
    rounding threshold, t = q / 2^{B+1} for B extracted bits. The reported failure
    rate is then the union over the nbar x mbar coordinates of a shared key. For
    Frodo-640 the recalled values are n = 640, nbar = mbar = 8, q = 2^15, B = 2,
    hence 2n = 1280 product terms, t = 4096, and 64 coordinates. EVERY ONE OF THOSE
    IS RECALLED AND IS A READ TARGET; the mechanism below is stated so that it can
    be re-instantiated once they are read, and none of its structure depends on
    their exact values.

    WHAT MAKES THE SENSITIVITY COMPUTABLE IN CLOSED FORM. Let v = Var(chi). The
    summands are mean-zero and independent, so

      Var(X) = 2n * v^2 + v ,     dVar(X)/dv = 4 n v + 1 .

    In the far tail the failure probability behaves as exp(-t^2 / (2 Var X)) up to
    subexponential factors, so

      d log2 P(|X| >= t) / d Var(X)  =  t^2 / ( 2 * Var(X)^2 * ln 2 ) ,

    and chaining,

      d log2 DFR / dv  =  ( t^2 / (2 Var(X)^2 ln 2) ) * ( 4 n v + 1 ) .

    Finally the table enters v linearly: with the two-sided convention of
    IDEA-20260805-390957 (zero cell counted once, denominator M), v = (2/M) *
    sum_{k>=1} k^2 p_k, so moving one unit out of the cell at magnitude k and
    compensating at magnitude 0 gives exactly dv = -2 k^2 / M. THE WHOLE CHAIN IS
    ELEMENTARY AND THE POINT IS THAT IT PRODUCES A NUMBER.

    THE NUMBER, SCOUT-COMPUTED ON THE EXCERPT AND LABELLED AS SUCH. Using the
    Frodo-640 excerpt table (v = 64895/8192 = 7.9217529296875 exactly, from
    IDEA-20260805-390957's identity C2) and the recalled n, t:

      Var(X) = 1280 * v^2 + v = 80333.2587 ,   t / sqrt(Var X) = 14.4515
      d log2 DFR / dVar(X) = 1.8753e-3 per unit ,   dVar(X)/dv = 20280.6875
      d log2 DFR / dv = 38.033 bits per unit of v
      mutation "p_12 -= 1, p_0 += 2" gives dv = -288/65536 = -9/2048 exactly
      PREDICTED RESPONSE:  Delta log2 DFR  =  -0.1671 bits.

    THAT IS THE CONTROL. It is derived before any pipeline exists, it is a
    magnitude and not a direction, and it can fail in three distinguishable ways --
    wrong sign, wrong magnitude, or no response -- each of which localises a
    different defect. A pipeline that responds with the wrong sign has its variance
    bookkeeping backwards. One that responds by 0.002 bits is not propagating the
    table into the tail. One that responds by 2 bits is amplifying somewhere.
    ALL THREE ARE INVISIBLE TO A CONTROL THAT ONLY ASKS WHETHER THE OUTPUT MOVED.

    THE GRADED VERSION IS FREE. Because the response is linear in the perturbation
    size u to first order, perturbing by u in {1, 2, 4, 8, 16} must give responses
    in the ratio 1 : 2 : 4 : 8 : 16 with the same slope, and the departure from
    linearity at u = 16 is itself a derived quantity (it is second order in dv and
    is bounded by the second derivative of the same chain). So the graded control
    has five interior points, a forced monotone direction, and a forced slope,
    which is the strongest form the inventor protocol's controls-before-belief
    clause asks for.

    THE NULL OBJECT WITH A CLOSED FORM. Replace chi by the Rademacher distribution,
    chi_null(+1) = chi_null(-1) = 1/2. Then each product e'_i s_i is again
    Rademacher, and X is a sum of exactly 2n + 1 independent Rademacher variables,
    whose distribution is an EXACT shifted binomial:

      P( X = 2j - (2n+1) ) = C(2n+1, j) / 2^{2n+1} ,
      P( |X| >= t ) = 2 * sum_{ j : 2j - (2n+1) >= t } C(2n+1, j) / 2^{2n+1} ,

    an exact rational computable in one line from binomial coefficients, with NO
    convolution at all. The identical pipeline, fed this distribution, must return
    exactly that rational. This is a null of the same shape -- same number of
    product terms, same threshold machinery, same union over coordinates -- whose
    answer is known independently, and it CAN FAIL. It is also a stress test of the
    truncation policy, since the Rademacher sum's support is [-(2n+1), 2n+1] and t
    sits far inside it, so the pipeline is exercised in a regime where truncation
    must not be applied blindly.

    THE DIRECTIONAL BRACKET, INHERITED FROM THE TABLE'S KURTOSIS. From
    IDEA-20260805-390957's identity C5: for independent a, b ~ chi with mean zero,
    kurt(ab) = kurt(chi)^2, and the excerpt gives kurt(chi) = 2.99508 hence
    kurt(ab) = 8.970. The summands are therefore strongly LEPTOKURTIC, so at 14.45
    standard deviations the true tail must EXCEED the Gaussian tail at matched
    variance. SCOUT-COMPUTED: the Gaussian estimate at Frodo-640 gives per
    coordinate log2 P = -154.84, hence -148.84 after the union over 64 coordinates.
    So the pre-registered bracket is: THE EXACTLY COMPUTED log2 DFR MUST BE
    STRICTLY GREATER THAN -148.84 (under the recalled parameters). The excerpt's
    claimed -138.7 satisfies it with about ten bits to spare, which is the expected
    size of a leptokurtic correction at that many standard deviations and is
    therefore a consistency observation rather than a verification. A recomputation
    landing BELOW the Gaussian bracket would indicate a broken pipeline or wrong
    recalled parameters, not a FrodoKEM finding -- and fixing that reading in
    advance is what stops it being chosen afterwards.

    THE COST PROBLEM, STATED HONESTLY RATHER THAN WISHED AWAY. The exact
    distribution of X requires convolving 2n = 1280 copies of the product
    distribution (support 289 points, denominators 2^32) and one copy of chi. By
    binary exponentiation that is about 11 convolutions on a support of order 1e4
    to 4e5 points with numerators of order 2^{16*(2n+1)} ~ 2^20500 bits if carried
    fully exactly. That is beyond a reasonable batch budget and
    GOAL-FRODO-001.pause_conditions already anticipates it. THE RESOLUTION IS NOT TO
    ABANDON EXACTNESS BUT TO CHANGE WHAT IS EXACT: carry the pmf in fixed-point
    integers with DIRECTED ROUNDING, so every coefficient is an interval with
    rational endpoints, and propagate the interval through the convolutions. The
    output is then a CERTIFIED ENCLOSURE [lo, hi] containing the true DFR, with lo
    and hi exact rationals -- which is an exact-arithmetic result in the sense
    RQ-FRODO-3260cc.constraints demands (no floating point, no shared rounding
    convention with the published computation) while costing a factor of hundreds
    less. The enclosure width is a reported metric and the success criterion
    requires it to be narrower than the discrepancy being looked for. If it is not,
    that is a BUDGET outcome about a computation and never evidence about the
    number being computed (AGENTS.md rule 5), which the goal record already says.

  novelty_status: unverified

  literature_context:
    - >-
      NOT READ -- RELAYED CLAIM. FrodoKEM's specification and the primary
      failure-rate analysis are named in RQ-FRODO-3260cc.provenance and have NOT
      been read by this program. The failure rates 2^-138.7 / 2^-199.6 / 2^-252.5
      quoted there came from an extraction-damaged excerpt and are research targets.
    - >-
      RECALLED, UNVERIFIED. The structure of the decryption noise (2n products plus
      one term, threshold q/2^{B+1}, union over nbar*mbar coordinates) and the
      parameters n = 640, q = 2^15, B = 2, nbar = mbar = 8 are model memory. They
      determine the numbers in the mechanism and every one of them is a read target.
      If they are wrong the derivation's STRUCTURE survives and its NUMBERS do not.
    - >-
      IN-REPO AND READ: KN-TECH-048 (decryption-failure attacks and failure
      boosting). Cited here ONLY to mark the boundary: this proposal computes a
      failure rate and makes no attack claim, and the cost side is
      IDEA-20260805-f16b44's. KN-TECH-048's own operative conclusion is that for the
      NIST candidates assessed the required query count is above practical limits.
    - >-
      IN-REPO: this program's controls census, as recorded in the 2026-08-05
      scouting output -- 39 of 1694 run directories are controls, 166 of 229
      evidence records carry no null, 188 of 229 carry no positive control, and
      `arms_and_controls` appears in 1 of 195 specifications. This proposal is
      written against that base rate and its controls are the deliverable, not the
      packaging.
    - >-
      IN-REPO, METHOD ONLY, per GOAL-FRODO-001.non_duplication: GOAL-HQC-001's
      BATCH-001/002 sequence established the acquire-then-file-then-design ordering
      and the exact rational recomputation discipline this proposal adopts. Its
      RS-S3 finding is precedent that a printed number in a standardisation document
      can be wrong. It is NOT evidence about FrodoKEM.

  lossy_projection_identifiability_audit:
    projection: >-
      The joint distribution of the full error matrices (a product measure on
      Z^{2n*nbar*mbar}) --> the marginal distribution of a single noise coordinate
      X --> its tail mass beyond t, together with the gradient of that tail mass
      with respect to the thirteen table entries.
    what_is_discarded: >-
      All dependence ACROSS the nbar*mbar coordinates of a shared key. The
      coordinates share the secret matrices S and S', so their failure events are
      correlated; projecting to a single marginal and then taking a union bound
      discards that correlation entirely.
    why_genuinely_lossy: >-
      Genuinely and consequentially lossy: the fibre over a given marginal contains
      every joint law with that marginal, and the correlated and independent
      extremes give different total failure probabilities. This is not a
      re-parameterisation and cannot be inverted.
    why_compatible_with_the_operations: >-
      Compatible where it matters and NOT compatible everywhere, and saying which is
      the honest form of this audit. It IS compatible with the operation that
      dominates the computation -- summing independent products -- because the
      marginal of a sum of independents is determined by the marginals, exactly and
      deterministically, which is what makes the convolution well posed. It is NOT
      compatible with the union step, where the discarded correlation returns. That
      is why the union is a NUMBERED HEURISTIC (H1 below) with a falsification
      condition, rather than a step of the derivation.
    is_it_only_a_change_of_coordinates: >-
      NO, and both failure directions were checked. Not the KN-LIT-7595 failure: a
      25-point table and a 64-coordinate joint law are compressed to a single
      rational tail mass plus a 13-vector gradient, and the joint law is not
      recoverable from them. Not the mirror failure either: the tail mass varies by
      more than a hundred bits across the three parameter sets (recalled -138.7 /
      -199.6 / -252.5) and the gradient varies with v, so the comparator's spread is
      enormous rather than zero. The specific risk this object DOES carry is
      different from both and is named: the gradient is a first-order object and
      says nothing about a perturbation large enough to change the tail's SHAPE
      rather than its scale, which is exactly the distinction IDEA-20260805-f16b44
      is built around.

  assumptions:
    - >-
      That the table transcription has already passed IDEA-20260805-390957's
      conservation gate. This proposal takes a valid table as an INPUT and does not
      re-derive it; running it on an unvalidated transcription would make every
      number here meaningless. The dependency is explicit and ordered.
    - >-
      That the summands are independent as the mechanism states. If FrodoKEM's
      matrices introduce any coupling, the convolution is wrong at the first step.
      Read target.
    - >-
      That the published figure is a per-key failure probability over all
      coordinates rather than a per-coordinate one. The two differ by log2(nbar*mbar)
      = 6 bits at Frodo-640 -- a discrepancy larger than most of what this audit
      could hope to detect, arising purely from a definitional choice. Read target,
      and named here so that a 6-bit "discrepancy" is not reported as a finding.

  predictions:
    - metric: >-
        MUTATION RESPONSE: Delta log2 DFR for the perturbation "p_12 -= 1, p_0 += 2"
        applied to the Frodo-640 table
      direction: lower
      minimum_effect: >-
        -0.167 bits, DERIVED BEFORE ANY RUN, with an accepted band of [-0.33, -0.08]
        (a factor of two either way, because the derivation uses a Gaussian tail
        slope while the true tail is leptokurtic and the slope correction is
        first-order). OUTSIDE THAT BAND, IN EITHER DIRECTION, THE PIPELINE HAS
        FAILED ITS CONTROL AND NO AGREEMENT WITH A PUBLISHED FAILURE RATE MAY BE
        REPORTED AS A VERIFICATION. A zero response, or a positive response, is a
        hard failure.
    - metric: >-
        GRADED MUTATION: responses at u in {1, 2, 4, 8, 16} units of the same
        perturbation, and the fitted slope
      direction: lower
      minimum_effect: >-
        Strictly monotone decreasing in u, with the five responses in ratio
        1 : 2 : 4 : 8 : 16 to within 15 per cent at u <= 8. A response that
        saturates, or that is not monotone, localises the defect: saturation means
        the tail estimate is being clipped, non-monotonicity means the convolution
        is not reproducible.
    - metric: >-
        RADEMACHER NULL: log2 P(|X| >= t) for the closed-form null, as an exact
        rational, against the binomial-tail formula
      direction: different
      minimum_effect: >-
        EXACT EQUALITY, bit for bit, as Fractions -- not agreement to some number of
        digits. The formula is
        2 * sum_{j : 2j-(2n+1) >= t} C(2n+1, j) / 2^{2n+1} and it is computed
        independently of the pipeline. Any inequality is a pipeline defect.
    - metric: >-
        DIRECTIONAL BRACKET: exactly computed log2 DFR at Frodo-640 against the
        Gaussian-at-matched-variance estimate
      direction: higher
      minimum_effect: >-
        Strictly greater than the Gaussian estimate, which is -148.84 under the
        recalled parameters. FORCED by kurt(product) = kurt(chi)^2 = 8.97 > 3, a
        quantity computed from the table alone. A recomputation landing below the
        bracket indicates broken parameters or a broken pipeline and must NOT be
        reported as a FrodoKEM discrepancy.
    - metric: >-
        ENCLOSURE WIDTH: hi - lo of the certified interval, expressed in bits of
        log2 DFR
      direction: lower
      minimum_effect: >-
        Below 0.05 bits. This is an instrument-quality metric, not a result: if the
        enclosure is wider than the discrepancy being looked for, the run has not
        answered the question and reports a budget outcome (AGENTS.md rule 5), never
        a negative about the published number.
    - metric: >-
        REPRODUCTION: |recomputed log2 DFR - published log2 DFR| per parameter set
      direction: lower
      minimum_effect: >-
        NO PREDICTION IS MADE, DELIBERATELY. Predicting agreement would be
        predicting the answer to the question the goal exists to ask, and predicting
        disagreement would be worse. What is pre-registered is the DECISION RULE: a
        difference below 0.5 bits is reported as reproduced within the published
        figure's own printed precision (one decimal place in the exponent is
        +/- 0.05 bits of slack, so 0.5 bits is ten times the document's own
        resolution); a difference above 2 bits is reported as a stated discrepancy
        with its size; between 0.5 and 2 bits is reported as inconclusive with the
        enclosure width beside it. The rule is fixed here and may not be revised
        after any number is seen.

  minimal_test:
    design: >-
      Six stages, cheapest-first, with the expensive one LAST and expendable.
      STAGE 0 (GATE, READING, ZERO COMPUTE). The source gate of
      RQ-FRODO-3260cc.constraints[0]: acquire and file the specification and the
      primary failure-rate analysis as KN-LIT entries with provenance and extraction
      damage marked, and transcribe the noise structure, threshold, coordinate count
      and published figures with numbered assumptions. NOTHING BELOW EXECUTES FIRST.
      STAGE 1 (TABLE GATE, MILLISECONDS). Run IDEA-20260805-390957's conservation
      identities on the transcribed table. A failure TERMINATES the run.
      STAGE 2 (NULL WITH CLOSED FORM, SECONDS). Build the pipeline and validate it
      against the Rademacher binomial tail, exactly. A failure TERMINATES.
      STAGE 3 (POSITIVE CONTROL, MINUTES). See controls: pin the exact pipeline
      against direct sampling in a regime where sampling can reach.
      STAGE 4 (MUTATION AND GRADED CONTROL, cost of one recomputation times six).
      Establish the response magnitude BEFORE the unmutated published table is
      evaluated, and hash-commit it.
      STAGE 5 (REPRODUCTION, THE EXPENSIVE AND EXPENDABLE STAGE). Certified-enclosure
      recomputation at the true dimensions, one parameter set at a time, smallest
      first. If budget is exhausted, report the reduced-dimension ladder and the
      enclosure achieved, as a budget outcome.
      THE STAGE THAT CAN TERMINATE THE RUN IS STAGE 1, and it costs milliseconds.
    controls:
      - >-
        NULL OBJECT OF THE SAME SHAPE, CLOSED FORM, CAN FAIL. Rademacher chi_null,
        exact binomial tail as derived in the mechanism. Same number of product
        terms, same threshold, same union. FORCED VALUE derived pre-run and stated
        as an exact rational. This is the null the goal's completion criterion asks
        for ("a null-object control on a distribution with a closed-form answer")
        and it is instantiated rather than gestured at.
      - >-
        SECOND NULL, A DEGENERATE ONE THAT MUST RETURN ZERO. chi_null = point mass
        at 0. Then X = 0 identically and the failure probability is EXACTLY 0 for
        any t > 0. A pipeline returning anything non-zero has a leak. Declared
        explicitly as a control that a correct pipeline cannot fail, hence a smoke
        test and NOT counted as a sensitivity demonstration -- the
        KN-TECH-1a5b7e failure mode, named rather than committed.
      - >-
        POSITIVE CONTROL / NEARBY OBJECT WHERE THE EFFECT MUST APPEAR, WITH A
        DECLARED THRESHOLD. Lower the threshold t (or scale up chi) until the
        failure probability is about 2^-20, then estimate it by direct Monte-Carlo
        sampling with 2^26 draws and a seeded generator. The exact pipeline's answer
        MUST lie inside the sampling 99 per cent confidence interval. IF IT DOES
        NOT, THE EXACT PIPELINE IS BROKEN AND NO NEGATIVE RESULT MAY BE REPORTED AT
        ALL. This is the only control that tests the exact machinery against an
        independent method rather than against another derivation, and it is
        therefore the one that matters most.
      - >-
        GRADED CONTROL, FIVE INTERIOR POINTS, MONOTONICITY AND SLOPE REPORTED. The
        u in {1, 2, 4, 8, 16} mutation ladder, with the derived slope
        d log2 DFR / dv = 38.03 bits per unit of v as the comparator. Reporting the
        measured slope against the derived one localises an obstruction instead of
        leaving "it did not work".
      - >-
        REDUCED-DIMENSION LADDER AS A SEPARATE GRADED CONTROL. Run the identical
        pipeline at n' in {8, 16, 32, 64, 128} with the same chi and a scaled
        threshold, where a fully exact rational computation is affordable, and check
        that the certified enclosure brackets the fully exact answer at every rung
        and that the enclosure width grows as derived. This validates the
        interval-arithmetic policy itself, which is otherwise the least tested part
        of the design.
      - >-
        ORDERING CONTROL. Every null, positive and graded control result is
        hash-committed BEFORE the published table's unmutated failure rate is
        computed or looked at. The decision rule stated in the predictions is
        executed on the mutated arm first.
      - >-
        ARCHIVE CHECK, ZERO COMPUTE. Search for any prior exact failure-rate
        computation in this program. RESULT AS OF 2026-08-05: EXP-MLKEM-001 is
        recorded by KN-TECH-048's own text as having examined failure-probability
        modelling against a pinned estimator and closed at
        supported_within_toy_boundary without transferring to FIPS 203. THAT RECORD
        WAS NOT OPENED BY THIS PROPOSAL and is listed as the first thing a
        prior-art stage should read, not as support for anything here.
    required_metrics:
      - transcribed noise structure, threshold, coordinate count and published figures, with references
      - Rademacher null result as an exact rational, beside the independently computed binomial tail
      - positive-control sampling interval and the exact pipeline's value inside or outside it
      - mutation response in bits, and the graded ladder with its fitted slope, committed before the treatment arm
      - certified enclosure [lo, hi] per parameter set with its width in bits
      - the reduced-dimension ladder, with the fully exact answer beside the enclosure at every rung
      - the decision-rule verdict, with the rule quoted from this record

  falsification_conditions:
    - >-
      The mutation response falls outside [-0.33, -0.08] bits. The pipeline has
      failed its control; no reproduction and no discrepancy may be reported.
    - >-
      The Rademacher null does not return the binomial tail exactly. Hard pipeline
      failure; halt.
    - >-
      The positive control's exact value falls outside the sampling confidence
      interval. The exact machinery is broken; nothing negative may be reported.
    - >-
      The certified enclosure at the true dimensions is wider than 2 bits. The run
      cannot distinguish reproduction from discrepancy and must say so; this is a
      budget outcome about a computation, NEVER evidence about the number
      (AGENTS.md rule 5, and GOAL-FRODO-001.pause_conditions).
    - >-
      The exactly computed log2 DFR falls below the Gaussian bracket. Parameters or
      pipeline are wrong; re-read rather than report.
    - >-
      The recalled noise structure proves wrong on reading -- for example the noise
      is not a sum of 2n products, or the threshold is not q/2^{B+1}. The derived
      sensitivity number 0.167 is then wrong, though the derivation's structure
      survives; the correction is a superseding record with the new number, never an
      edit.

  confounders:
    - >-
      RECALLED PARAMETERS. n, q, B, nbar, mbar and the noise structure are model
      memory and they set every number in this record. The derivation is designed to
      be re-instantiated from read values; the numbers are not.
    - >-
      DEFINITIONAL DRIFT IN "FAILURE RATE". Per coordinate versus per key versus per
      ciphertext differ by up to 6 bits at Frodo-640 with no error anywhere. This is
      the single most likely source of a spurious "discrepancy" and it is named here
      before the run so it cannot be reported as a finding.
    - >-
      SHARED-METHOD AGREEMENT. Independence from the reference implementation is
      required by RQ-FRODO-3260cc.constraints. If this pipeline reproduces the
      designers' own convolution structure step for step, agreement tests
      transcription rather than mathematics. The Rademacher null and the sampling
      positive control are the two places where an independent method is actually
      applied, which is why both are mandatory rather than optional.
    - >-
      TRUNCATION AS A HIDDEN MODEL. Any convolution over a truncated support has
      discarded mass, and discarded mass in a TAIL computation is exactly the
      quantity being measured. The interval-arithmetic policy exists to make the
      discard a bounded interval rather than an unstated approximation, and the
      enclosure width is reported for that reason.
    - >-
      THE GRADIENT IS FIRST-ORDER. It predicts the response to a small perturbation
      and says nothing about a perturbation large enough to change the tail's shape.
      The graded ladder's u = 16 rung is where that limit is expected to appear and
      the departure from linearity there is a reported metric, not a surprise.

  interpretation_limits:
    - >-
      SPLIT CLAIM TIER, PER RQ-FRODO-3260cc.scope.claim_tier_ceiling AND
      GOAL-FRODO-001.next_action. The ARITHMETIC claim -- that a published failure
      rate does or does not reproduce under certified exact recomputation at the
      standardised parameters -- is reachable at CRYPTO tier, because the
      computation is finite at the real parameter sets and no extrapolation
      heuristic is used. Every SECURITY reading is capped at TOY. A batch that
      blurs the two has failed regardless of what it computed.
    - >-
      A DISCREPANCY IS NOT AN ATTACK. Per RQ-FRODO-3260cc.constraints, a discrepancy
      is a documentation or analysis defect until costed, and costing it is
      IDEA-20260805-f16b44's job. No record from this line may use the words break,
      attack, or vulnerable.
    - >-
      A reproduction verifies an arithmetic assertion about a published number and
      NOTHING ELSE. It does not verify the parameter choice, the IND-CCA argument,
      the FO transform, or LWE hardness at Frodo's dimensions.
    - >-
      The mutation control licenses the reproduction claim; it does not strengthen
      it. A pipeline that detects a 0.167-bit perturbation has shown it can detect
      perturbations of about that size, and says nothing about smaller ones. The
      detection floor is a reported metric.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Coordinate union) The nbar*mbar coordinate failure events of a single key
        are treated as independent, so that
        DFR_key = 1 - (1 - DFR_coord)^{nbar*mbar}, or by a union bound
        DFR_key <= nbar*mbar * DFR_coord.
      rigorous_support: >-
        The union BOUND is rigorous and requires no independence at all -- it is
        Boole's inequality and holds for any dependence structure. What is NOT
        rigorous is the equality form, since the coordinates share the secret
        matrices S and S' and their failure events are positively correlated
        through ||S||. Positive correlation makes the true DFR_key SMALLER than the
        independent product, so the union bound is CONSERVATIVE in the direction
        that matters for a security claim -- and that direction argument is stated
        here so a reader can attack it rather than take it on trust.
      validation_plan: >-
        Compute both forms, report both, and report their difference in bits. At
        DFR_coord ~ 2^-145 and 64 coordinates the two agree to far beyond any
        precision at issue, so this heuristic is expected to be non-binding at
        FrodoKEM's parameters -- and demonstrating that it is non-binding, with a
        number, is the validation. Separately, at the reduced-dimension ladder rungs
        where the DFR is large, the two forms diverge measurably and the correlation
        can be probed directly by sampling.
    - id: H2
      statement: >-
        (Gaussian slope for the control's predicted magnitude) In the far tail,
        d log2 P(|X| >= t) / d Var(X) = t^2 / (2 Var(X)^2 ln 2), i.e. the tail's
        sensitivity to variance is the Gaussian one.
      rigorous_support: >-
        This is exact for a Gaussian and approximate for a leptokurtic sum. It is
        LOAD-BEARING ONLY FOR THE CONTROL'S PREDICTED MAGNITUDE, not for any
        reported result, and that is why the acceptance band is a factor of two
        rather than a tight interval. The leptokurtic correction moves the true
        slope in a known direction (a heavier tail is LESS sensitive to variance at
        fixed t, because more of the tail mass comes from single large summands), so
        the derived 0.167 bits is expected to be a slight OVER-estimate of the true
        response.
      validation_plan: >-
        The pipeline itself computes the exact response at u = 1, so the heuristic
        is measured rather than assumed as soon as Stage 4 runs. Its validation is
        the graded ladder's fitted slope against the derived 38.03 bits per unit of
        v, reported as a ratio.
    - id: H3
      statement: >-
        (Truncation enclosure) The directed-rounding interval arithmetic used in
        Stage 5 produces [lo, hi] with lo <= true DFR <= hi, with all discarded mass
        accounted into hi.
      rigorous_support: >-
        Elementary and constructive rather than heuristic: every discarded
        coefficient is added to the upper endpoint and nothing is added to the
        lower, so the enclosure is valid by construction PROVIDED the implementation
        is correct. The assumption is therefore about the implementation, not the
        mathematics.
      validation_plan: >-
        The reduced-dimension ladder is exactly this heuristic's test: at n' <= 128
        the fully exact rational answer is affordable and must lie inside the
        enclosure at every rung. A single rung where it does not refutes H3 and
        halts Stage 5.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS MOVED AND NONE IS CLAIMED. This proposal computes a number that
      the designers already computed; its contribution is independence, exactness,
      and a control that licenses the comparison. The one quantity that could move
      an exponent is downstream and belongs to IDEA-20260805-f16b44: if a failure
      rate were wrong by many bits, the query exponent of a failure-boosting attack
      moves by the same number of bits. This record supplies the input to that
      calculation and performs none of it.
    memory_exponent: >-
      The dominant cost is the convolution's working support. Under the enclosure
      policy: O(W) fixed-point integers of O(lambda_prec) bits, with W the truncated
      support width (order 1e4) and lambda_prec a few hundred bits, so a few
      megabytes -- against O(W) integers of ~2^{16*(2n+1)} bits if carried fully
      exactly, which is the reason the enclosure policy exists. Both are reported.
    best_known: >-
      The designers' own computation, whose method this program has not read. There
      is no independent recomputation known to this program, and no search this
      program can run would reliably establish that (KN-OPEN-3f7a21).
    hidden_overhead: >-
      The enclosure width. A recomputation whose enclosure is wider than the
      discrepancy sought has produced nothing, and reporting the width beside the
      answer is what stops that being hidden.
    tradeoff_note: >-
      Precision against time is the whole design space of Stage 5, and the
      reduced-dimension ladder is where the trade curve is measured rather than
      guessed.

  dominated_by: >-
    n/a (no result claimed; no attack, no algorithm, no cost improvement, so no
    Pareto point exists to be dominated). FRONTIER ROWS CHECKED before writing null:
    (i) TIME -- against Monte-Carlo estimation, which cannot reach 2^-138 at any
    feasible sample count and is therefore not a competing method but a different
    claim; against the designers' own computation, whose cost is unknown to this
    program and which is not independent; (ii) MEMORY -- the enclosure policy's few
    megabytes against full exact rationals' astronomically larger requirement, both
    reported; (iii) DATA / QUERIES / PREPROCESSING -- one document read, zero oracle
    queries, zero samples except in the positive control, where the sample count is
    declared; (iv) the corpus's own frontier: no FRODO-area record of any kind
    exists as of 2026-08-05, and the nearest prior work, EXP-MLKEM-001, was not
    opened by this proposal and is named as a prior-art read target rather than
    treated as checked. Absence of a search result is not evidence of absence.
  sota_delta: >-
    No attack; measurement contribution only. Quantitatively: the deliverable is a
    certified enclosure of the failure rate at each standardised parameter set with
    a stated width in bits, against a published point figure printed to one decimal
    place in the exponent (i.e. +/- 0.05 bits of its own resolution), together with
    the first computed gradient of a decryption failure rate with respect to its
    error table in this corpus. Attack advantage delta: exactly zero, in time,
    memory, data and queries.

  estimated_cost:
    implementation: medium
    compute: high
  recommended_priority: medium
  honest_prior_of_survival: >-
    0.55 that a certified enclosure narrow enough to decide reproduction versus
    discrepancy is obtained at Frodo-640 within the campaign budget, and 0.35 that
    it is obtained at all three parameter sets. It is not higher because the exact
    convolution at the true dimension is genuinely expensive, because the container
    environment is disputed (one 2026-08-05 scouting sweep reports no numpy and
    another reports numpy 2.4.6 on the same machine, and this must be resolved
    before any stage is costed), and because the interval-arithmetic policy is the
    least-tested part of the design. It is not lower because the controls and the
    gradient -- which are the parts this proposal actually contributes -- cost
    almost nothing and are established at Stages 1 to 4 regardless of whether Stage
    5 completes, and because the reduced-dimension ladder produces a real,
    reportable, scoped result even if the full-dimension run is abandoned.
    SEPARATELY: 0.15 that a discrepancy above 2 bits is found, and that number is
    low because the designers' figures have stood through years of review and
    multiple independent implementations; it is not lower because nobody
    re-derives a published parameter set, which is what makes an error in one
    durable, and because this program's one prior attempt at exactly this kind of
    audit found an error on its first try (GOAL-HQC-001 BATCH-002).
