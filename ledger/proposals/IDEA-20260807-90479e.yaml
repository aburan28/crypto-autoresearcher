idea:
  id: IDEA-20260807-90479e
  question_id: RQ-HAWK-001
  added: '2026-08-07'
  title: 'HAWK: the exact-SVP call in dimension n/2+1 that the whole UNCONDITIONAL disclosed reduction
    bottoms out in has never been costed or measured by this program, the 2^108 / 2^182 figures
    are relayed from the paper''s own gate model, and the goal went dormant with completion criterion
    1 unmet a week before a recorded Round-3 tweak deadline'
  class: cost-model
  claim: 'KN-LIT-7592 (Straznickas-Weis, citation_verified: read) gives an UNCONDITIONAL, heuristic-free
    reduction of HAWK-n key recovery to poly(n) exact-SVP calls in dimension n/2 + 1, and reports
    cost falling from 2^150 to at most 2^108 (HAWK-512) and 2^288 to 2^182 (HAWK-1024). GOAL-HAWK-001''s
    completion criterion 1 asks for either a certified recovery at a HAWK-shaped instance or ''the
    specific heuristic that fails at HAWK parameters and the resulting true cost floor''. Its
    delivered output is paper analysis of a DIFFERENT, conditional attack: EV-HAWK-c99848 and
    EV-HAWK-21edba adjudicate iacr:2026/1318 (Heuristic 4''s ideal count omitted fractional O_F-ideals;
    Case C, super-polynomial), and EV-HAWK-c99848 states that no advantage ''over the 2^{n/2+1+o(n)}
    Straznickas-Weis baseline is established''. Nobody in this program has computed or measured
    the cost of the object the unconditional attack actually calls: exact SVP in dimension 257
    and 513. The goal''s next_action now reads ''No further action required''.'
  mechanism: Derive the cost of exact SVP at dimensions 257 and 513 under a cost model THIS PROGRAM
    OWNS -- sieve time and memory from the measured calibration, with the poly(n) = O(n^2 log
    n) oracle-call factor charged explicitly -- and state the resulting HAWK-512 and HAWK-1024
    key-recovery floor beside the relayed 2^108 / 2^182 AND beside the demonstrated SVP record
    ceiling. The tracked object is the triple (block size, charged cost, memory) at the two dimensions
    the reduction actually names.
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-07'
    grep_results:
    - 'IDEA-20260805-3a855d is explicitly a ZERO-COMPUTE arithmetic audit of the four RELAYED
      gate figures: it fits affine cost models to (452,150), (257,108), (940,288), (513,182),
      finds them jointly inconsistent, and flags the uncharged O(n^2 log n) oracle-call factor
      worth 21 and 23 bits. It audits the paper''s arithmetic; it does not derive or measure the
      SVP cost under any cost model this program owns.'
    - H-HAWK-c7a551 and H-HAWK-a28be6 verify the lattice SHAPE at ring degrees n <= 32, dimensions
      where SVP is trivial and cost is not the question.
    conclusion: Screened against ledger/proposals, ledger/hypotheses and knowledge/; external
      novelty UNVERIFIED and not claimed.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS as the primary lens: the conditional iacr:2026/1318
      attack and its four heuristics, which two evidence records already adjudicate. The object
      is the UNCONDITIONAL reduction''s SVP call.'
    tracked_object: The triple (block size beta needed for exact SVP at dimension d, charged time,
      charged memory) at d = 257 and 513.
    one_step_propagation_rule: poly(n) oracle calls multiply the per-call cost; memory is the
      max over calls. Exact bookkeeping.
    newness_score: Nil as mathematics. The content is that the one lattice target with an unconditional
      exponent-moving external result has an unowned cost floor.
  lossy_projection_identifiability_audit:
    projection: the reduction -> the resource triple of its dominant call.
    what_is_discarded: The reduction's mathematics, which is unconditional and taken as given.
    is_it_only_a_change_of_coordinates: NO, and candidly this is bookkeeping rather than mathematics;
      class is cost-model for that reason. Its value is that a Round-3 parameter decision rests
      on a number nobody here has derived.
    mirror_failure_check: 'CHECKED. The failure would be a floor that comes out at 2^108 by construction.
      It cannot: the derivation uses the program''s own measured constants and an explicitly charged
      oracle factor the paper''s figure does not include, so agreement would be informative rather
      than circular.'
  null_object_control:
    primary_null: THE DEMONSTRATED-RECORD CEILING. Express the derived floor as a multiple of
      the largest SVP instance anyone has publicly solved (SVP Challenge dimensions 151/153/155).
      If the derivation implies dimension-257 exact SVP is near-feasible, it is wrong, because
      the public record says otherwise -- this is KN-TECH-049's discipline applied as a control.
    secondary_nulls:
    - 'FORCED CONSISTENCY: the derivation applied at n = 452 and 940 must reproduce the paper''s
      own 2^150 and 2^288 within a stated tolerance, or the cost model does not describe the paper''s.'
    - 'SOURCE-BLOCKED DISCIPLINE: any term not derivable is marked, never estimated.'
  assumptions: []
  predictions:
  - metric: derived HAWK-512 key-recovery floor against the relayed 2^108
    direction: higher
    minimum_effect: A floor above 2^108 once the O(n^2 log n) oracle factor is charged; IDEA-20260805-3a855d
      already prices that factor at 21 bits.
  - metric: derived floor as a multiple of the demonstrated SVP record
    direction: higher
    minimum_effect: Any statement of this ratio, which currently does not exist anywhere in the
      corpus.
  minimal_test:
    design: Derive beta(d) for exact SVP at d = 257 and 513 from the measured sieve calibration;
      charge the oracle-call factor explicitly; report the floor with its memory term; run the
      record-ceiling null and the n = 452 / 940 consistency check.
    controls:
    - demonstrated SVP record ceiling
    - paper-reproduction consistency check
    - SOURCE-BLOCKED discipline
    required_metrics:
    - beta(d), charged time and charged memory at both dimensions
    - derived floor beside the relayed figure
    - ratio to the demonstrated record
  falsification_conditions:
  - 'The derived floor corroborates 2^108 within tolerance: the Round-3 parameter decision rests
    on a number this program independently reaches, which is a publishable corroboration.'
  - 'The derived floor is materially higher: the headline is optimistic for the attacker and the
    correction is the deliverable.'
  - 'The paper-reproduction check fails at n = 452: the cost model does not describe the paper''s
    and no comparison is admissible until reconciled.'
  confounders:
  - Exact SVP and approximate SVP have very different costs; the reduction's requirement must
    be read precisely from KN-LIT-7592 and stated.
  - Gate models and field-operation models are not interchangeable; state the unit.
  - This record depends on the measured calibration of IDEA-20260807-8fbc86; until that exists
    the derivation uses relayed constants and must say so.
  interpretation_limits:
  - A cost floor is not an attack and not a break.
  - The tweak-deadline context (recorded in GOAL-HAWK-001 as 2026-08-14) is a reason to act promptly,
    not a reason to lower the evidence standard.
  heuristic_assumptions:
  - id: HEUR-HAWKSVP-1
    statement: Sieve cost expressions calibrated at dimensions 50-85 extrapolate to 257 and 513.
    rigorous_support: None. This is a long extrapolation and is the derivation's weakest link.
    validation_plan: Report the extrapolation range explicitly and give the floor as an interval,
      never a point.
  target_complexity:
    time_exponent: The reduction is unconditional at 2^{n/2+1+o(n)}; this record derives the concrete
      constant.
    memory_exponent: Exact SVP at dimension 257 is memory-heavy; the memory term is reported,
      not assumed.
    best_known: Straznickas-Weis at most 2^108 (HAWK-512) and 2^182 (HAWK-1024), relayed.
    hidden_overhead: The O(n^2 log n) oracle-call factor, worth ~21 and ~23 bits per IDEA-20260805-3a855d
      and not included in the headline.
    tradeoff_note: A floor derived under an extrapolated calibration is an interval, and quoting
      its midpoint would be exactly the error this record exists to correct.
  dominated_by: 'Straznickas-Weis on the attack axis; this record proposes no attack and adds
    no row. Rows checked: HAWK''s own claimed 2^150 / 2^288; Straznickas-Weis 2^108 / 2^182; the
    conditional iacr:2026/1318 route, whose Case C is super-polynomial per EV-HAWK-c99848.'
  sota_delta: ZERO on attack axes. The one lattice target in the portfolio where an unconditional
    exponent-moving external result exists and its concrete cost floor is unowned; an independently
    derived floor either corroborates or moves the number the Round-3 parameter decision rests
