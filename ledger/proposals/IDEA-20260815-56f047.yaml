idea:
  id: IDEA-20260815-56f047
  question_id: RQ-SQISIGN-001
  added: '2026-08-15'
  title: >-
    SQIsign's SECURITY IS SCORED AGAINST THE ENDOMORPHISM-RING PROBLEM AND
    THAT PROBLEM'S BEST ATTACK JUST MOVED TO p^(1/3): recompute the scheme's
    claimed security level under the new baseline
  class: cost-model

  claim: >-
    SQIsign parameter sets were chosen against a p^(1/2) endomorphism-ring
    baseline. The Wesolowski result moves that baseline to p^(1/3+o(1)) with
    large memory. Whether the published parameter sets still meet their
    claimed security levels under the new baseline, once memory is charged,
    is arithmetic the program should do rather than assume someone has.

  mechanism: >-
    For each published parameter set, recompute the endomorphism-ring attack
    cost under the new algorithm with memory charged, and compare against
    the claimed security level. Report the margin under several memory-cost
    models.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of GOAL-SQISIGN-001 and the p^(1/3) result's scope statement
      naming the SQIsign family as affected; grep 'security level',
      'parameter set', 'NIST'.
    results: >-
      The source paper names the SQIsign family as affected and recommends
      parameter reevaluation; no record in this program performs that
      recomputation.
    verdict: >-
      ADAPTATION. The recomputation is the arithmetic the source paper
      explicitly recommends; the contribution is doing it in this
      program's charged-cost framework.

  object_first_candidate:
    tracked_object: >-
      THE SECURITY MARGIN of each published parameter set, under the new
      baseline with memory charged.
    lossiness: >-
      A claimed security level projects a whole attack landscape onto one
      number, which changes when the best attack changes.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while the new algorithm's cost model is instantiable at the
      relevant parameter sizes, which the source's own table demonstrates.

  null_object_control: >-
    NULL 1 -- the old p^(1/2) baseline, which must reproduce the parameter
    sets' originally claimed levels; failure means the recomputation differs
    from the design's own accounting. NULL 2 -- free memory, giving the most
    pessimistic margin and bracketing the answer.

  discriminated_from:
    - >-
        The memory-charged crossover record in this series, which locates
        where the new algorithm beats Delfs-Galbraith; this applies the
        outcome to a specific scheme's parameters and should consume that
        record's crossover.
    - >-
        The published SQIsign security analyses, which used the old
        baseline and are not wrong, merely superseded on this one input.

  assumptions:
    - >-
        The new algorithm's cost model is instantiable at SQIsign's
        parameter sizes, which the source's own concrete table supports.
    - >-
        The scheme's claimed levels are stated against the endomorphism-
        ring problem specifically, rather than against a different
        underlying problem.

  predictions:
    - metric: >-
        old-baseline reproduction
      direction: different
      minimum_effect: >-
        FORCED to reproduce the originally claimed levels; failure means
        the accounting differs from the design's.
    - metric: >-
        free-memory bracket
      direction: different
      minimum_effect: >-
        Gives the most pessimistic margin and brackets the answer.
    - metric: >-
        margin per parameter set under charged memory
      direction: different
      minimum_effect: >-
        The measurement; a negative margin would mean a published set no
        longer meets its claimed level, which requires review before any
        statement.
    - metric: >-
        sensitivity to the memory-cost model
      direction: different
      minimum_effect: >-
        If the verdict flips across plausible memory models, no single
        verdict may be quoted.

  minimal_test:
    design: >-
      One parameter set, three memory models, both nulls, consuming the
      crossover record's output.
    controls:
      - >-
          Old-baseline reproduction of claimed levels.
      - >-
          Free-memory pessimistic bracket.
      - >-
          Several memory-cost models, reported together.
      - >-
          The o(1) overhead the source discloses applied rather than
          dropped.
    required_metrics:
      - >-
          Margin per parameter set per memory model.
      - >-
          Old-baseline reproduction agreement.
      - >-
          Verdict sensitivity across memory models.

  falsification_conditions:
    - >-
        The old-baseline reproduction fails. The accounting differs from
        the design's and must be reconciled first.
    - >-
        Margins remain positive under every plausible memory model. The
        parameter sets survive the new baseline, which is the reassuring
        outcome and worth recording explicitly.
    - >-
        A margin goes negative under plausible memory charging. A
        published parameter set no longer meets its claimed level, which
        requires independent review before any characterisation.
    - >-
        The verdict flips across memory models. It is model-determined and
        must be reported as a range rather than a conclusion.

  confounders:
    - >-
        DROPPING THE DISCLOSED OVERHEAD: the source discloses a
        superpolynomial hidden term, and omitting it overstates the attack
        and could manufacture a negative margin.
    - >-
        PROBLEM MISMATCH: if the scheme's claimed level rests on a
        different underlying problem than the one the new algorithm
        attacks, the recomputation targets the wrong baseline entirely.

  interpretation_limits:
    - >-
        Recomputes a security margin under a published attack; mounts no
        attack and proposes nothing new.
    - >-
        Scoped to the recomputed parameter sets and swept memory models.
    - >-
        A negative margin is a cost-model result requiring review, not a
        break.

  heuristic_assumptions:
    - id: HEUR-SQI-BASE-1
      statement: >-
        SQIsign's claimed security levels are set by the endomorphism-
        ring problem's best known attack, so a change in that attack
        propagates directly to the margins.
      rigorous_support: >-
        Rigorous ingredient: the scheme's security reduction ties
        forgery to the endomorphism-ring problem, and the source paper's
        scope statement names the SQIsign family as affected. THE GAP: a
        scheme's parameters are usually set with margin against several
        attack routes, so the endomorphism-ring route may not be the
        binding one at every parameter set -- in which case a changed
        baseline moves a non-binding constraint and the margin does not
        move at all.
      falsification_condition: >-
        A parameter set whose binding security constraint is a different
        attack route.
      validation_plan: >-
        SAMPLE: every published parameter set, with all named attack
        routes costed, not just the endomorphism-ring one. TAIL CHECK:
        sets where two routes are close, since those are where the
        binding constraint could switch. TRANSFER: none; the
        recomputation binds the published sets.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Symbolic recomputation at published parameter
      sizes.
    memory_exponent: >-
      Negligible.
    best_known: >-
      Incumbents are the published SQIsign security analyses under the old
      baseline and the new p^(1/3) algorithm; both are used and neither is
      improved.
    hidden_overhead: >-
      The source's disclosed superpolynomial overhead is the term most
      likely to be dropped, and dropping it overstates the attack.
    tradeoff_note: >-
      Charging memory raises the attack's cost and shrinks the change to
      the margin; the answer lives between the free-memory and realistic-
      memory brackets.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As a security analysis: dominated by the
    published SQIsign analyses on every axis except this one input. As a
    recomputation under the new baseline: none exists here. Not null on any
    axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: SQIsign parameter-set
    security margins recomputed under the p^(1/3+o(1)) endomorphism-ring
    baseline with memory charged and the disclosed superpolynomial overhead
    retained, which is the reevaluation the source paper explicitly
    recommends.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.85 that the old-baseline reproduction works. 0.6 that the
    endomorphism-ring route is the binding constraint at the published sets,
    without which the recomputation moves nothing. 0.2 that a margin goes
    negative under plausible memory charging, which would require review
    before any statement.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
