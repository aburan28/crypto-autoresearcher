  proof_search_map:
    bottleneck: Whether the sieving stage's shared-object access rate is bounded below by
      a constant. Every charged factoring number the program will ever quote passes through
      that branch, and the branch is currently taken without evaluation.
    baseline_embedding:
      parameter_slice: theta = 0, where both branches coincide and return the classical c
        = (64/9)^(1/3), beta = (8/9)^(1/3).
      reproduction_check: 'Symbolic: S^0 = 1 identically. Plus the three-point calibration
        (BSGS, MITM, vOW), which reproduces conclusions already archived in KN-TECH-035 and
        KN-TECH-057 — reproduction against committed records, not against a plot.'
    observation_collision:
      observable: the scalar rho_amort.
      distinct_preimage_search: 'COLLISION EXHIBITED: two deployments with equal rho_amort
        can differ in whether the factor base is resident or streamed from a neighbouring
        node, and the wiring model does not distinguish them. SEPARATING CONDITION: spatial
        locality of accesses. If the record parameters cannot determine locality, the observable
        is not identifying and the honest verdict is (O-C) — which is why (O-C) is pre-registered
        rather than treated as an inconclusive failure.'
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: Replace "is sieving memory-light" by the exact predicate lim inf (shared-object
        accesses)/(elementary steps) > 0.
      predicted_gain: Converts the program's weakest RSA assumption into a checkable inequality
        on published parameters, at zero compute.
    - transform: observable_fiber
      proposed_object: Hold c fixed and vary which stage is charged; the separating invariant
        is beta.
      predicted_gain: A second discriminator, so an agreeing c cannot be mistaken for model
        agreement.
    quantifier_order: THERE EXISTS one criterion (HA-7), fixed before evaluation and already
      adopted by this program, SUCH THAT FOR ALL algorithms in the calibration set it reproduces
      the archived verdict, AND its verdict on sieving is determined by published parameters.
      The criterion may NOT be chosen after seeing the sieving parameters. The weaker order
      — for each algorithm there exists a criterion giving the archived verdict — is vacuous
      and is not claimed.
    method_ceiling:
      strongest_certifiable_claim: 'At most: that under the Wiener model as this program adopted
        it, and under a stated definition of the access ratio, sieving does or does not qualify
        for the exemption at record parameters, hence which of H-RSA-68884a''s two families
        applies. Cannot certify what any machine costs, cannot bound the o(1), cannot speak
        to batch or special NFS, cannot speak to a deployed key.'
      nearby_object_control: 'MUST HOLD: vOW, exempt per KN-TECH-057. MUST FAIL: BSGS and
        MITM, charged per KN-TECH-035/057. A criterion that cannot separate vOW from MITM
        has not identified the load-bearing structure.'
    proof_obligations:
    - claim: The evaluator reproduces archived verdicts for BSGS, MITM and vOW.
      responsibility: baseline
    - claim: rho_amort is well defined to within 2^2 from published parameters.
      responsibility: feasibility
    - claim: At theta = 0 both branches coincide.
      responsibility: correctness
    - claim: beta is reported beside c under every branch.
      responsibility: memory
    - claim: An unobtainable parameter is reported as acquisition failure, never as a verdict.
      responsibility: scope
    not_applicable_reason: null
