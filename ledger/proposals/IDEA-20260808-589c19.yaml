idea:
  id: IDEA-20260808-589c19
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-RSA-afe33c
  goal_id: GOAL-RSA-001
  title: HEUR-NFS-2 is the load-bearing, untested assumption of this program's whole RSA position,
    and KN-TECH-057's own access-rate criterion decides it on published sieving parameters
    alone — if the sieve's factor-base access rate does not vanish, the charged GNFS exponent
    is 2.2435 rather than 1.9496, an effect eleven times larger than the one the program is
    currently measuring
  class: control
  claim: 'SCOPE: GNFS relation collection, single key, heuristic asymptotics. COST MODEL ONLY
    — no factorization, no attack, no statement about deployed keys (RQ-RSA-afe33c.claim_tier_ceiling,
    binding). H-RSA-68884a charges relation collection at exponent 0 (per-processor storage
    assumed independent of B) and block Wiedemann at theta, names HEUR-NFS-2 "the weakest
    link", states its hole (factor-base replication across P processors), and does not test
    it. It also records the stake: if both stages are charged, c = (2+theta)(8/9)^(1/3) =
    2.2435 at theta=1/3 against the asymmetric 1.9496 — a gap of 0.294 in the L-exponent,
    versus the 0.0266 that record actually reports. THE PROGRAM IS MEASURING THE SMALL EFFECT
    AND ASSUMING THE LARGE ONE. CLAIM: the branch is decided by one dimensionless ratio, rho_amort
    = (elementary sieve operations per special-q) / (distinct factor-base entries read per
    special-q), evaluated against KN-TECH-057''s OWN stated exemption criterion (van Oorschot-Wiener
    escapes the wiring charge because its shared table is touched at amortized rate O(p^-1/6)
    per step). Three pre-registered outcomes: (O-A) rho_amort unbounded, HEUR-NFS-2 survives,
    charged exponent 1.9496; (O-B) rho_amort = O(1), HEUR-NFS-2 false, charged exponent 2.2435;
    (O-C) strategy-dependent (line vs special-q lattice sieving differ), so the charged exponent
    is a property of the DEPLOYMENT and must be quoted as a range with the architecture named.'
  mechanism: 'DERIVED IN-REPO from KN-TECH-035, KN-TECH-057 and H-RSA-68884a (all read in
    full). KN-TECH-057 does not state its exemption as "low memory" but as an ACCESS RATE
    with a named threshold; applying the same criterion to sieving is not an analogy but the
    same test on a different access pattern, and the program has already committed to the
    criterion in a published technique record. TRACKED OBJECT: accesses to the factor base
    per elementary sieve operation — not core-years, not bytes stored. LOSSY-PROJECTION TEST:
    the map from a sieving node''s full state to one rate discards all arithmetic detail;
    what it discards is discarded compatibly because the wiring charge depends on the access
    pattern ONLY through this rate (that is the model''s own structure, not an added assumption);
    and it is not a change of coordinates because infinitely many schedules share a rate.
    STRUCTURAL EXPECTATION, NOT A MEASUREMENT: special-q lattice sieving reduces every factor-base
    prime against the special-q lattice, i.e. one pass over the factor base per special-q,
    then sieves a region of about I*J cells; both I, J and the factor-base bounds are published
    for RSA-250. THREE NAMED ESCAPES, each checkable and each pushing toward (O-A): (1) the
    factor base is read-only and may be replicated per node, so P replicas of size B may give
    clock cycle B^(1/3) per node rather than (PB)^(1/3) — H-RSA-68884a''s stated hole may
    be stated backwards; (2) batching many special-q per factor-base pass raises rho_amort
    at a memory cost, which is then a tradeoff the record must state; (3) only small primes
    are densely touched, so the effective factor base in the ratio is much smaller than the
    nominal one.'
  why_not_a_renamed_known_approach: 'NEAREST KNOWN: the standard remark that NFS sieving is
    memory-light per node. Difference: this evaluates a NAMED, ALREADY-ADOPTED criterion with
    a threshold and a number instead of appealing to intuition, and it targets this program''s
    own hypothesis at its own declared weak point with the stake quantified in advance. Against
    IDEA-20260805-72bcb5: that charges the LINEAR ALGEBRA in bytes and does not touch relation
    collection. Against H-RSA-68884a: that ASSUMES HEUR-NFS-2; this tests it. Adversarial
    by design.'
  predictions:
  - observable: rho_amort at RSA-250's published sieving parameters
    metric: log2 of the ratio
    predicted: Between -2 and +2, i.e. O(1), hence NON-EXEMPT, outcome (O-B). Structural prediction,
      not a measurement; parameters are Stage-0 acquisition. Above 2^5 the prediction fails
      and (O-A) holds.
  - observable: line sieving vs special-q lattice sieving ratio
    metric: log2 difference
    predicted: Differ by more than 2^3. Agreement excludes (O-C) and makes the charge a property
      of GNFS rather than of the strategy.
  - observable: implied charged exponent and memory exponent at theta = 1/3
    metric: (c, beta)
    predicted: (1.949616, 0.835550) under (O-A); (2.243510, 0.961500) under (O-B). Both DERIVED
      from H-RSA-68884a's closed forms. beta is a SECOND, independent discriminator and may
      not be omitted.
  minimal_test: 'STAGE 0 (reading; RQ-RSA-afe33c forbids design before filing): extract from
    the RSA-240/RSA-250 announcements and CADO-NFS parameter files the sieving strategy, region
    dimensions I and J, factor-base bounds per side, special-q range and count, and any per-node
    memory statement; file as KN-LIT entries. STAGE 1 (zero compute): evaluate rho_amort for
    both strategies; run the BSGS positive control and the vOW null through the identical
    evaluator; classify (O-A)/(O-B)/(O-C); emit (c, beta). STAGE 2 (optional, toy, LABELLED
    TOY): a 40-60 bit toy sieve instrumented with an actual factor-base access counter, to
    check the parameter-derived ratio against an implemented one.'
  controls:
  - POSITIVE CONTROL — BSGS must return tau = n^(1/6) and full cost n^(2/3), the value KN-TECH-035
    attributes to Wiener. Failure forbids any statement about sieving. Deliberately the same
    control H-RSA-68884a declares as G4, so a failure is attributable.
  - NULL — van Oorschot-Wiener must return no charge, reproducing KN-TECH-057. A charged vOW
    means the evaluator is mis-specified.
  - DECAY TEST — artificially shrink the factor base; the charge must fall continuously to
    zero. A charge that does not decay when the charged object shrinks is the canonical artifact
    tell.
  - ARCHITECTURE CONTROL — evaluate at least two sieving strategies; an identical ratio across
    genuinely different access patterns means the wrong quantity is being read.
  confounders:
  - '"Distinct factor-base entries read per special-q" needs a stated definition (small primes
    are touched many times, large primes at most once); sensitivity to the definition must
    be reported, and two definitions landing on opposite sides of the threshold is a legitimate
    "cannot decide" verdict.'
  - ECM cofactorization has a different access pattern and O(1) state; the stage must be split
    or the ratio averages two incomparable regimes.
  - Published parameters reflect what operators CHOSE under their own RAM constraints, so
    the ratio partly measures the machine. This circularity is exactly why (O-C) is pre-registered.
  - Wiener's model is asymptotic with unextracted constants (KN-TECH-035's own limits); a
    ratio near threshold is unresolvable by it and must be reported unresolved.
  falsification_conditions:
  - rho_amort exceeds 2^5 on published parameters — HEUR-NFS-2 survives its own criterion;
    the control has CORROBORATED a previously untested assumption, which is a genuine result.
  - The BSGS positive control fails, or the vOW null is charged — no conclusion about sieving
    may be reported; the evaluator is broken and that is the finding.
  - Parameters unobtainable under the network policy — infrastructure outcome (AGENTS.md rule
    5), matching GOAL-RSA-001.pause_conditions, never evidence about NFS cost.
  interpretation_limits: A statement about a cost model and about one heuristic inside this
    program's own hypothesis. It factors nothing, does not claim any record computation is
    wrong (operators optimize what they pay for, not what a wiring model charges), moves no
    exponent of the factoring problem, and says nothing about deployed keys. Under KN-TECH-035's
    own caution a higher charged exponent makes step-count-based key sizing MORE conservative,
    so nothing here licenses relaxing anything.
  assumptions:
  - Wiener 3D wiring with theta = 1/3 per KN-TECH-035/KN-TECH-057; results also reported at
    theta in {0, 1/6, 1/2}.
  - H-RSA-68884a's closed forms are consumed, not re-derived; this record inherits its `proposed`
    status.
  - The announcements publish enough to evaluate the ratio; if not, that is Stage 0's reported
    outcome.
  heuristic_assumptions:
  - id: HA-7
    statement: (Access-rate exemption.) For all algorithms holding a shared object of size
      S, the Wiener clock cycle multiplying the step count is S^(1/3) if the fraction of elementary
      steps touching the shared object is bounded below by a positive constant, and O(1) if
      that fraction tends to zero as S grows.
    rigorous_ingredient: KN-TECH-057 states exactly this and applies it to exempt vOW at amortized
      rate O(p^-1/6); in-corpus, read, and already relied on by this program's isogeny baselines.
    distribution_imitated: None — an architectural criterion, labelled as such rather than
      dressed as a distributional theorem.
    validation_route: 'Evaluate the criterion on three algorithms whose verdicts this program
      has already archived (BSGS charged, MITM charged, vOW exempt) and confirm all three
      reproduce; then evaluate sieving. A three-point calibration against committed records,
      at zero compute. Neither toy nor crypto-scale: a symbolic check against archived conclusions.'
    tail_checks: Report behaviour in the unresolved band (access fraction decaying like an
      inverse power of log S) and state whether sieving falls in it.
  - id: HA-8
    statement: (Parameter sufficiency.) The published sieving parameters determine rho_amort
      to within a factor 2^2 without access to the implementation.
    rigorous_ingredient: None — an empirical claim about what announcements contain.
    distribution_imitated: none
    validation_route: 'Stage 0 itself: extract and report whether the ratio is determined.
      If two plausible readings differ by more than 2^2, HA-8 is refuted and the deliverable
      becomes a specification of the missing parameter.'
    tail_checks: Cross-check RSA-240, RSA-250 and DLP-240; the ratio should be similar across
      all three if it is a property of the strategy.
  target_complexity:
    time_exponent: (O-A) L[1/3, 1.949616]; (O-B) L[1/3, 2.243510]; uncharged baseline L[1/3,
      1.922999]. All DERIVED from H-RSA-68884a and inheriting its conditional status. NO EXPONENT
      OF THE FACTORING PROBLEM MOVES — these are accounting exponents.
    memory_exponent: beta = 0.835550 under (O-A), 0.961500 under (O-B). Reported beside every
      c without exception; a c quoted alone is inadmissible under RQ-RSA-afe33c.constraints.
    best_known_baseline: The program has NO charged factoring baseline — that absence is why
      GOAL-RSA-001 exists. Uncharged baseline L[1/3, (64/9)^(1/3)].
    hidden_overhead_disclosure: The whole o(1), uncontrolled at 829 bits; post-merge density
      treated as L[o(1)] while RELAYED as 252; polynomial selection and filtering charged
      nowhere; and — disclosed here because no RSA record in this corpus mentions it — KN-LIT-2663's
      early-abort ECM factor exp((c+o(1))(log 2^B)^(1/6)(log log 2^B)^(5/6)), which is L[1/6,
      c] and therefore a SUPERPOLYNOMIAL factor lying wholly inside the o(1) of every L[1/3]
      statement this program makes about factoring.
    time_memory_tradeoff: 'Escape route (2) is exactly a tradeoff: batching special-q raises
      rho_amort at a memory cost. If (O-B) holds, that curve is the natural follow-on deliverable.'
  sota_delta: 'Zero on attack cost. On the program''s own baseline: corroborates or replaces
    the charged exponent 1.9496 by 2.2435 — 0.294 in the L-exponent and 0.126 in the memory
    exponent, i.e. 11.1x the effect H-RSA-68884a currently reports.'
  dominated_by: 'CHECKED ROW BY ROW against every in-corpus factoring-cost record: H-RSA-68884a
    (tested here, does not dominate), IDEA-20260805-72bcb5 (different stage), IDEA-20260805-1775f2,
    IDEA-20260805-73cccc, KN-TECH-035, KN-TECH-057 (the model applied), KN-LIT-2663 (different
    regime). None dominates. EXTERNALLY UNCHECKED (web unavailable): the NFS implementation
    literature certainly discusses sieving memory, and a published statement of the access
    ratio would dominate the measurement though not the conclusion; named as the Stage-0 prior-art
    question.'
  estimated_cost: Implementation low (arithmetic on extracted parameters plus a three-point
    calibration). Compute negligible for Stages 0-1. Dominant cost is reading, already budgeted
    by GOAL-RSA-001.next_action.
  recommended_priority: high
  honest_prior_of_survival: '0.55 that the evaluation returns (O-B) or (O-C) rather than (O-A).
    Structural reason for leaning that way: a special-q lattice sieve makes one pass over
    the factor base per special-q and the region per special-q is not obviously larger than
    the factor base at record parameters. Honest counter: escape (3) — only small primes densely
    touched — is plausible and would push toward (O-A).'
  novelty_status: screened
  novelty_screen: 'SCREENED against ledger/hypotheses/H-RSA-68884a.yaml (full), ledger/proposals/IDEA-20260805-72bcb5.yaml
    (Part A), knowledge/techniques/KN-TECH-035.md and KN-TECH-057.md (full), knowledge/literature/KN-LIT-2663.md
    (full), and /tmp/ideas-ctx/{EXISTING_PROPOSALS,EXISTING_HYPOTHESES,REJECTED_TITLES, DEFERRED_TITLES,CATALOGUE_TITLES,KNOWLEDGE_BARRIERS}.txt.
    No in-corpus record evaluates the access-rate criterion on sieving. Also screened against
    my own X1.yaml (X1-01..X1-04): no overlap. `screened` asserted for in-corpus scope only;
    the external gap is stated.'
  discriminated_from: 'H-RSA-68884a: assumes HEUR-NFS-2 with a named hole; this supplies the
    test and threshold, and their conclusions are in direct opposition under (O-B). IDEA-20260805-72bcb5:
    linear-algebra bytes, disjoint stage and disjoint object. KN-TECH-057: states the criterion
    for isogeny algorithms; this is its first application outside that setting. X1-07 below:
    tests the same assumption by a completely different route (published batch-NFS exponents),
    sharing no inputs — agreement between them would therefore be meaningful.'
  source_refs:
  - ledger/hypotheses/H-RSA-68884a.yaml
  - ledger/questions/RQ-RSA-afe33c.yaml
  - ledger/goals/GOAL-RSA-001.yaml
