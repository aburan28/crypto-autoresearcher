idea:
  id: IDEA-20260807-44ba75
  question_id: RQ-CANL-63098f
  added: '2026-08-07'
  title: >-
    CM SUPPLIES THE RANK CONTROL XEDNI HAD TO BUY WITH MESTRE'S CONDITIONS, BUT
    IN THE FATAL DIRECTION: for a CM curve the rank is pinned by an L-value
    (Coates-Wiles/Rubin) rather than by construction, and the pinned value is
    generically 0 -- which does not make the lifted points short, it empties
    the set of liftable points, so the reduction map's image collapses to the
    O(1) torsion subgroup and the fraction of E(F_p) that lifts at all falls
    from Theta(B^{r/2}/(sqrt(Reg) N)) to O(1/N)
  class: mechanism

  claim: >-
    (A) WHAT XEDNI PAID FOR AND WHAT CM GIVES FREE. Silverman's construction
    (KN-LIT-020) needs the global curve through the lifted points to have SMALL
    Mordell-Weil rank, so that r+1 points are forced dependent, and it obtains
    that by imposing Mestre-style conditions -- which is exactly the cost
    centre Jacobson-Koblitz-Silverman-Stein-Teske (KN-LIT-021) charge as
    prohibitive. On the Serre-Tate canonical lift the rank is not imposed: the
    lift is a CM curve, and for CM curves the rank is controlled by an
    L-value. THE THIRD QUANTITY IN RQ-CANL-63098f'S DECISION TARGET -- the RANK
    of the lifted Mordell-Weil group -- IS THEREFORE GENUINELY CHANGED BY CM,
    from "expensively imposed" to "freely determined". This record asks what
    the free determination determines, and answers: the wrong thing.

    (B) THE DIRECTION, AND WHY IT IS FATAL RATHER THAN HELPFUL. Coates-Wiles
    (and Rubin's extension) give, for an elliptic curve with complex
    multiplication: L(E/K, 1) != 0 implies rank E(K) = 0. Analytic rank 0
    is the generic behaviour in any family with no forced parity obstruction.
    So the canonical lift's Mordell-Weil group is, generically, FINITE. And a
    finite Mordell-Weil group is not a small lattice with short vectors -- it
    is no lattice at all. Xedni's arithmetic needs r+1 points to be dependent
    AND to exist; CM optimises the first and destroys the second.

    (C) THE QUANTITY, DEFINED SO IT CAN BE MEASURED. Define the LIFTABLE
    FRACTION
        rho_lift(B) := |{P in E(F_p) : P = red(P~) for some P~ in Ẽ(H)
                          with hhat(P~) <= B}| / N.
    Counting lattice points in the Mordell-Weil lattice of rank r_Z and
    regulator Reg gives
        |{P~ : hhat(P~) <= B}| = V_{r_Z} B^{r_Z/2} / sqrt(Reg) * (1 + o(1)),
    where V_{r_Z} is the volume of the unit ball in R^{r_Z}, so
        rho_lift(B) <= V_{r_Z} B^{r_Z/2} / (sqrt(Reg) * N).
    AT RANK 0 THIS IS EXACTLY |Ẽ(H)_tors| / N = O(1)/N, for every B, forever.
    That is a strictly worse failure than JKSST's: not "the relation that
    exists has bounded coefficients", but "the points do not exist".

    (D) THE PRICE OF ESCAPING IT, IN EXPONENTS. To have rho_lift(B) = Omega(1)
    one needs B >= (N sqrt(Reg)/V_{r_Z})^{2/r_Z}. Since the canonical lift is
    a CM curve it has integral j-invariant, so Lang's height conjecture is a
    theorem for it (Hindry-Silverman, Inventiones 93 (1988) 419-450; RELAYED
    FROM A WEB-SEARCH ABSTRACT 2026-08-07, FULL PAPER NOT READ), giving
    hhat(P~) >= c log|Delta| for every non-torsion P~ and hence
    Reg >= (c log|Delta|)^{r_Z}. Substituting only makes B larger. So the
    rank must be BOUGHT, and CM refuses to sell: the same L-value that makes
    the rank free makes it 0.

    (E) THE TWO OUTCOMES, BOTH DELIVERABLES. OUTCOME 1: measured rho_lift on
    toy CM lifts tracks V_{r} B^{r/2}/(sqrt(Reg) N) within a constant. Then
    the height-budget model is validated, the rank is confirmed as the binding
    parameter, and the lane's cost is settled by IDEA-20260807-6533fd's
    exponent identity. OUTCOME 2: rho_lift on CM lifts is systematically
    HIGHER than on rank-matched, discriminant-matched non-CM curves. Then CM
    supplies an excess of low-height liftable points that the lattice count
    does not explain, the excess is a new object, and this lane reopens with a
    concrete target. There is no outcome in which the measurement says nothing.

  resource_label: >-
    R6 (the characteristic-zero lift and its Mordell-Weil group) and R3
    (End(E) as a ring: it is CM-ness that supplies the L-value rank control
    and the integral j-invariant that makes Lang unconditional).
  admissibility: admissible
  admissibility_argument: >-
    Nothing here applies an endomorphism to a point of G. The operative
    objects are a Mordell-Weil lattice in characteristic zero, an L-value, and
    a reduction map. H-ENDO-001's scalar collapse applies only downstream of
    reduction and is not used. The one place an inadmissibility could hide is
    the phrase "the reduction map is O-linear": that is a statement about a
    map between two O-modules, not an oracle call, and its content here is
    only that rank is preserved as an O-invariant. Note however the honest
    corollary: because reduction is O-linear and O acts on G by scalars, ANY
    structure the lift's O-module carries reduces to scalars on G -- which is
    why this record's positive branch must be about the SIZE of the liftable
    set, not about extra structure inside it.

  discriminated_from:
    - >-
      IDEA-20260807-fd5a24 and IDEA-20260807-11b93d: those hold the points
      fixed and ask what O does to the coefficient/height budget. This one asks
      whether the points exist at all, which is logically prior and is the
      quantity RQ-CANL-63098f calls "the RANK of the lifted Mordell-Weil
      group".
    - >-
      IDEA-20260807-6533fd: that record derives the covering exponent
      B ~ N^{2/r} and its consequences for coordinate size and
      meet-in-the-middle. This one is about where r comes from and why CM
      cannot raise it. They share the lattice-point count and must not be
      double-counted as independent evidence.
    - >-
      ECFG-P1543-R0/R1 (ledger/FINDING-PF-IC-001.md): the torsion-or-defect
      dichotomy shows that any SCALAR-COMPATIBLE lift of G is torsion with
      height zero. THAT IS A STATEMENT ABOUT MAPS; this is a statement about
      the SIZE OF THE IMAGE of the reduction map. They compose and neither
      implies the other: P1543 forbids a homomorphic lift, this one shows that
      even a set-theoretic lift has almost nothing to lift into.
    - >-
      H-XEDN-fe3446 (S1-S3): forces rank <= 8 and constant height 2 on all-I_1
      rational elliptic SURFACES over F_p(t) via Shioda-Tate. Different
      category (surfaces, geometric rank bound) from a number-field
      Mordell-Weil rank pinned by an L-value. The formal similarity -- a hard
      rank ceiling -- is worth noting and is not the same theorem.

  object_first_candidate:
    tracked_object: >-
      THE IMAGE OF THE REDUCTION MAP, red: Ẽ(H) -> E(F_p), followed as a
      filtered family indexed by a height bound: Im_B := red({P~ : hhat <= B}).
      The tracked quantity is |Im_B| as B grows.
    lossiness: >-
      LOSSY and compatibly so. It discards which global point produced each
      residue, the coordinates, the field H, and the O-action; it retains only
      a subset of E(F_p) and its growth rate in B. The discard is compatible
      because reduction is a group homomorphism: Im_B + Im_{B'} is contained
      in Im_{B''} for B'' governed by the parallelogram law, so the retained
      subset propagates under the group operation by a rule that needs none of
      the discarded data. It is not a change of coordinates: two lifts with
      the same |Im_B| profile and different Galois structure are
      indistinguishable to the object, and rank-matched CM/non-CM pairs are
      exactly such a pair -- which is what makes the null control meaningful.
    propagation: >-
      One step = adding a generator, or increasing B by one unit. |Im_B| grows
      like V_r B^{r/2}/sqrt(Reg) until it saturates at N; the saturation point
      B* is the object's single informative number. One-step propagation is
      measurable by direct enumeration at toy scale.
    survival_score: >-
      SURVIVES: twisting (rank changes, and the object tracks that, which is
      the point), model change, choice of prime above p. DIES: at rank 0,
      where the object is constant and carries no information -- and that
      degeneracy is the record's predicted generic outcome, so the object is
      honest about its own expected uselessness.

  mechanism: >-
    STEP 1 -- BUILD TOY CM LIFTS EXPLICITLY. Restrict to h(D_E) = 1 so the
    lift is a curve over Q (IDEA-20260807-ee6ef7's evasion class): the j = 0
    family y^2 = x^3 + k and the j = 1728 family y^2 = x^3 + a x. Choose p and
    the twist so that the reduction has a large prime-order subgroup.
    STEP 2 -- GET RANK AND GENERATORS WITHOUT SAGE. Use published rank tables
    for these two families where available, and independently confirm each
    used curve by (a) exhibiting generators found by naive search over
    x = u/w^2 with bounded u, w, and (b) a 2-descent-free consistency check:
    the found points must be non-torsion (torsion is computable by
    Nagell-Lutz) and Z-independent (verified by a numerical height Gram
    determinant bounded away from 0). RANK IS NOT CLAIMED, ONLY A LOWER BOUND
    FROM EXHIBITED INDEPENDENT POINTS -- an upper bound would need descent and
    is out of scope. Every statement is phrased with that asymmetry.
    STEP 3 -- MEASURE rho_lift DIRECTLY. Enumerate all global points with
    naive height below a ladder of bounds B, reduce each mod p, and count
    distinct images in E(F_p). Plot |Im_B| against B and fit the exponent
    against the predicted r/2.
    STEP 4 -- THE NULL. Repeat on a NON-CM curve over Q with (i) the same
    exhibited-independent-point count, (ii) minimal discriminant within a
    factor 2, (iii) the same p. Any CM excess must survive this comparison.
    STEP 5 -- THE RANK-0 ARM. Include at least three CM curves whose exhibited
    point search returns NOTHING below the largest B. Confirm |Im_B| equals
    the torsion image, i.e. O(1), for every B. This is the record's central
    predicted phenomenon and it must be observed, not assumed.
    STEP 6 -- CHARGE IT. Compute the B* at which |Im_B| would reach N, from
    the fitted exponent, and compare the implied coordinate bit-size against
    0.886 sqrt(N).

  novelty_status: adaptation
  novelty_screen:
    method: >-
      2026-08-07: the shared L9 screen (see IDEA-20260807-fd5a24), plus
      targeted greps for "Coates|Rubin|L-function|analytic rank|Heegner"
      across ledger/, knowledge/, docs/, analysis/; and reads of
      ledger/FINDING-PF-IC-001.md ECFG-P1543-R0/R1 and H-XEDN-fe3446.
    results: >-
      "Coates", "Rubin", "analytic rank" and "Heegner" return no substantive
      hits in ledger/ or knowledge/techniques. The liftable-fraction quantity
      rho_lift is defined nowhere in this repository. ECFG-P1543-R1's
      "Mordell-Weil coordinate gate" is the closest prior statement and is
      about EXPRESSING a target in a known basis, not about the SIZE of the
      reduction image.
    verdict: >-
      ADAPTATION. Coates-Wiles/Rubin and the lattice-point count are standard
      and are claimed as nothing new. New to this program: the composition
      into a liftable-fraction measurement, and the observation that CM's free
      rank control lands on the value that empties the lift.

  null_object_control: >-
    MANDATORY AND BLOCKING. MATCHED NULL: a non-CM elliptic curve over Q with
    the same number of exhibited independent points, minimal discriminant
    within a factor 2, reduced modulo the same p, subjected to the identical
    enumeration. DECAY PARAMETER: p. rho_lift MUST DECAY like B^{r/2}/N, i.e.
    with slope -1 against p at fixed B. A CM-versus-null excess that FAILS TO
    DECAY with p is the canonical artifact tell and means the enumeration is
    finding twist-related or torsion points rather than genuine independent
    lifts. SECOND NULL: replace E(F_p) by a random subset of the same size and
    recount -- the measured |Im_B| must be unchanged, since it is a property
    of the global side only; a dependence on the target set means the counter
    is contaminated. POSITIVE CONTROL: plant a lift by choosing P~ of known
    small height FIRST and defining the target as red(P~); the pipeline must
    find it at the corresponding B.

  assumptions:
    - >-
      Coates-Wiles/Rubin: for E with CM by an order in K, L(E/K,1) != 0
      implies rank E(K) = 0. RECALLED, NOT READ. The statement is classically
      for CM by the maximal order and over K itself; ITS EXTENSION TO THE RING
      CLASS FIELD H AND TO NON-MAXIMAL ORDERS IS FLAGGED [open] AND IS NOT
      USED QUANTITATIVELY -- the record's measurements do not depend on it,
      only its framing does. Stage 0 must either verify the extension or
      restate part (B) as "rank 0 is empirically generic in the tested
      families", which is weaker and sufficient.
    - >-
      Hindry-Silverman: Lang's height conjecture holds for elliptic curves
      with integral j-invariant. RELAYED FROM A WEB-SEARCH ABSTRACT 2026-08-07
      (Inventiones 93 (1988) 419-450); FULL PAPER NOT READ. Used only to say
      Reg is bounded below, which strengthens the negative; if false the
      negative weakens and the record says so rather than depending on it.
    - >-
      The lattice-point count |{hhat <= B}| = V_r B^{r/2}/sqrt(Reg)(1+o(1))
      is the standard asymptotic and is inaccurate at the small B reachable at
      toy scale. Every fitted exponent is therefore reported with the caveat
      that it is a small-B fit, and the null arm carries the identical bias.
    - >-
      Rank upper bounds are NOT established here. Only lower bounds from
      exhibited independent points. Every statement about "rank r" means "at
      least r independent points were exhibited".

  proof_search_map:
    bottleneck: >-
      The step whose removal changes everything is "rank 0 implies |Im_B| is
      O(1) for all B". It is immediate given rank 0 (Ẽ(H) is then finite), so
      the real bottleneck is one level up: whether the canonical lifts of toy
      ordinary curves generically have rank 0. That is an empirical question at
      toy scale and a theorem-shaped question in general, and the record
      separates them explicitly.
    baseline_embedding:
      parameter_slice: >-
        A named curve of known rank 1 from a public table with a known
        generator, reduced modulo a named p. The pipeline must reproduce
        |Im_B| for B up to the generator's height and must find exactly the
        multiples of the generator's reduction.
      reproduction_check: >-
        Frozen fixture with exact coordinates: the curve, the generator, the
        prime, the first ten multiples and their reductions, compared as exact
        field elements. Any mismatch halts the line as an instrument failure.
    observation_collision:
      observable: "|Im_B| as a function of B."
      distinct_preimage_search: >-
        EXPECTED TO SUCCEED AND THEREFORE BLOCKING. A rank-0 CM curve and a
        rank-0 non-CM curve give the identical observable (the torsion image),
        so the observable cannot attribute anything to CM in the generic case.
        A rank-2 CM curve and a rank-2 non-CM curve with equal regulators also
        collide. THE COLLISION IS THE EXPECTED RESULT and it says the liftable
        fraction is a function of (rank, regulator) and not of CM -- which is
        exactly the conclusion the record predicts and the reason the null arm
        is blocking rather than decorative. A collision FAILURE (CM and non-CM
        separating at matched rank and regulator) is Outcome 2 and reopens the
        lane.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold |Im_B| fixed and vary the forgotten structure: the O-action.
          The intrinsic invariant separating the fibres is whether the lattice
          admits an isometry of order 4 or 6 (equivalently, whether O has
          units beyond +-1). Building the pair (CM, non-CM) at matched rank
          and regulator is simultaneously the counterexample construction and
          the null.
        predicted_gain: >-
          None to an attacker. It isolates the exact claim CM could support
          and shows it is empty at matched (rank, regulator).
      - transform: stronger_invariant
        proposed_object: >-
          Track the pair (|Im_B|, the multiset of hhat values realised) rather
          than the count alone; the height spectrum detects whether the extra
          images come from short vectors or from a long tail.
        predicted_gain: >-
          Distinguishes "CM gives more points" from "CM gives the same points
          reached more cheaply", which the count cannot.
    quantifier_order: >-
      THE CLAIM: FOR ALL canonical lifts Ẽ with rank Ẽ(H) = 0, FOR ALL B,
      |Im_B| = |Ẽ(H)_tors| = O(1). THE TRAP: the inviting inversion "for all B
      there exists a lift with large |Im_B|", which is true (take a high-rank
      curve) and useless, because the lift is DETERMINED by E -- the attacker
      does not choose it. The record states that determinism explicitly: the
      canonical lift is a function of E, so no quantifier over lifts is
      available to the attacker, and any argument that uses one is invalid.
      The one place a choice does exist is the twist/lift parameter, which is
      IDEA-20260807-13c821's subject.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "on the tested toy CM families, the liftable fraction tracks
        the rank-and-regulator lattice count and shows no CM excess against a
        matched null; and on rank-0 members it is O(1)/N." It CANNOT certify
        that all canonical lifts have rank 0, cannot establish rank upper
        bounds, cannot speak about h(D_E) > 1 (where the lift lives over a
        larger field and the enumeration is infeasible here), and cannot bear
        on crypto scale.
      nearby_object_control: >-
        The nearby object where the hoped-for conclusion fails is a CM curve
        of exhibited rank >= 2 with an unusually small regulator; there
        |Im_B| is large at small B and a method reporting "lifting is
        hopeless" would be refuted on it. Such curves exist in the j = 0
        family and at least two must be included, or no negative may be
        reported.
    proof_obligations:
      - claim: "rank 0 implies Ẽ(H) finite implies |Im_B| = O(1)."
        responsibility: correctness
      - claim: "|{hhat <= B}| = V_r B^{r/2}/sqrt(Reg)(1+o(1))."
        responsibility: baseline
      - claim: "rho_lift(B) <= V_r B^{r/2}/(sqrt(Reg) N)."
        responsibility: size_bound
      - claim: "Reg >= (c log|Delta|)^r for integral-j curves (Lang via Hindry-Silverman)."
        responsibility: baseline
      - claim: "The canonical lift is determined by E; no quantifier over lifts is available."
        responsibility: scope
      - claim: "Only rank lower bounds are established, never upper bounds."
        responsibility: strictness

  predictions:
    - metric: >-
        fitted exponent of |Im_B| against B on CM lifts with exhibited rank r
      direction: different
      minimum_effect: >-
        Predicted r/2 with a fit interval excluding r/2 +- 0.5. An exponent
        materially above r/2 means points are being found that the lattice
        count does not predict, i.e. Outcome 2.
    - metric: >-
        rho_lift(B) on rank-0 CM lifts
      direction: lower
      minimum_effect: >-
        FORCED VALUE |Ẽ(H)_tors|/N, i.e. at most 16/N by the standard torsion
        bounds. Any value above 64/N falsifies the rank-0 arm as implemented.
    - metric: >-
        CM excess := rho_lift(CM)/rho_lift(matched null) at equal exhibited
        rank and equal discriminant magnitude
      direction: different
      minimum_effect: >-
        Predicted 1.0 within a factor 2. A ratio above 4, reproducible across
        at least three (curve, p) pairs and decaying correctly in p, is
        Outcome 2 and is the pre-registered reopening condition.
    - metric: >-
        B* := the height bound at which |Im_B| would reach N, extrapolated
        from the fit
      direction: higher
      minimum_effect: >-
        Predicted N^{2/r} to within the fit's uncertainty; reported together
        with the implied coordinate bit-size, which is the quantity that must
        be compared with sqrt(N) rather than B* itself.
    - metric: >-
        exhibited-rank distribution across the tested CM families
      direction: different
      minimum_effect: >-
        Reported as a histogram with no predicted value, because only lower
        bounds are available. A family in which most members exhibit rank 0 at
        the largest searched B supports part (B) empirically WITHOUT
        establishing it, and the write-up must say exactly that.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): verify or downgrade the Coates-Wiles/
      Rubin and Hindry-Silverman citations; if either fails to verify, restate
      parts (B) and (D) in their weaker empirical forms before proceeding.
      STAGE 1 (hours): implement naive global point search over x = u/w^2 with
      |u| <= U, w <= W; validate on the frozen known-generator fixture.
      STAGE 2 (hours): measure |Im_B| for a ladder of B on 10 CM curves
      (j = 0 and j = 1728 families) at 3 primes each.
      STAGE 3 (hours): the matched non-CM null on the identical pipeline.
      STAGE 4 (minutes): the rank-0 arm and the planted-lift positive control.
      STAGE 5 (zero compute): fit exponents, extrapolate B*, charge against
      0.886 sqrt(N).
    controls:
      - Matched non-CM curve at equal exhibited rank and discriminant.
      - Rank-0 CM arm (forced value O(1)/N).
      - Planted lift (instrument must detect a known signal).
      - Random-subset target control (|Im_B| must not depend on the target set).
      - Known-generator frozen fixture.
    required_metrics:
      - "|Im_B| per (curve, p, B), exact counts"
      - Fitted exponent with interval, both arms
      - Exhibited rank and numerical height Gram determinant per curve
      - Torsion order per curve
      - Extrapolated B* and implied coordinate bit-size
      - Wall clock and search bounds (U, W) per cell

  falsification_conditions:
    - >-
      The known-generator fixture does not reproduce. Instrument failure under
      AGENTS.md rule 5; nothing reported.
    - >-
      rho_lift on a rank-0 CM lift exceeds 64/N. The rank-0 arm is
      mis-implemented (most likely torsion or twist contamination).
    - >-
      The fitted exponent exceeds r/2 + 0.5 on CM arms but not on the null.
      Outcome 2: CM supplies unexplained liftable points; the lane reopens and
      this record is superseded by one that characterises them.
    - >-
      The CM excess ratio exceeds 4 reproducibly. Same disposition.
    - >-
      The excess does not decay with p. Artifact tell; no CM claim may be made.
    - >-
      The planted-lift control fails. The instrument cannot see a signal it is
      designed to see and no negative may be reported from any arm.

  confounders:
    - >-
      Rank lower bounds only. A curve reported "rank 0" may have rank > 0 with
      generators above the search bound; every such report is phrased as "no
      independent point below B" and never as "rank 0".
    - >-
      Torsion contamination. CM curves have larger torsion (up to 6-torsion on
      j = 0); torsion reductions inflate |Im_B| at every B and must be
      quotiented before counting.
    - >-
      Twist coupling. Changing the twist changes both rank and the reduction,
      so a CM/null pair must be matched after twisting, not before.
    - >-
      Small-B bias. The lattice asymptotic is poor at reachable B; both arms
      carry the identical bias, which is why only the CM/null RATIO is
      interpreted, never the absolute value.
    - >-
      Class number. This record is confined to h(D_E) = 1 so the lift is over
      Q; for h > 1 the lift lives over a degree-2h field and the enumeration
      is out of reach here. That confinement is a scope limit, not a result.

  interpretation_limits:
    - >-
      Toy scale, claim_tier toy, h(D_E) = 1 only, rank lower bounds only.
    - >-
      A negative here closes "CM's free rank control helps Xedni", with the
      named obstruction that the control lands on rank 0. It does NOT close
      lifting, does NOT close Xedni, and does NOT bear on any deployed curve.
    - >-
      Outcome 2 would not be an attack. It would be an unexplained excess of
      low-height liftable points, whose conversion into an algorithm is
      separate work with its own record and its own cost table.
    - >-
      Nothing here supersedes ECFG-P1543-R1. That record forbids a homomorphic
      point lift; this one measures the size of the set a non-homomorphic lift
      could draw from. Both obstructions must be cleared, not either.

  heuristic_assumptions:
    - id: HEUR-CANL-K1
      statement: >-
        FOR ALL curves in the tested toy CM families, the number of global
        points of canonical height at most B is
        V_{r} B^{r/2} Reg^{-1/2}(1 + o(1)) with the o(1) below 0.5 at the
        largest reachable B.
      rigorous_support: >-
        Rigorous as an asymptotic (standard lattice-point counting for a
        positive definite quadratic form, with error O(B^{(r-1)/2})); the
        heuristic part is only that the asymptotic is usable at the small B
        reachable here. The classical distribution theorem being imitated is
        the Gauss circle problem's error term, transported to rank r.
      validation_plan: >-
        Sample: for each curve with exhibited rank >= 1, enumerate all points
        below a ladder of B and compare the count with the prediction using
        the numerically computed regulator. Scale: at least 8 B-values per
        curve, at least 10 curves. Predicted distribution: counts within 50%
        of prediction for B above the largest generator height. Tail check:
        the worst relative error and the B at which it occurs. TOY SCALE ONLY.
    - id: HEUR-CANL-K2
      statement: >-
        Analytic rank 0 has density bounded away from 0 in the tested CM
        families, so "rank 0 is generic" is not vacuous.
      rigorous_support: >-
        None offered. It imitates the standard minimalist expectation that
        ranks are 0 or 1 with densities 1/2 each in families without forced
        parity. NO SUCH THEOREM IS QUOTED and the record's measurements do not
        depend on the density, only on the existence of rank-0 members, which
        is verified directly.
      validation_plan: >-
        Report the observed fraction of tested curves with no independent
        point below the largest B, with the search bound stated, as a LOWER
        BOUND on the rank-0 fraction and never as an estimate of it.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. The record's quantitative output is the
      liftable-fraction exponent: rho_lift(B) ~ B^{r/2}/(sqrt(Reg) N), giving
      B* ~ N^{2/r} and, at rank 0, rho_lift = O(1/N) for every B. Charged
      against rho at N^{1/2}, any mechanism built on this needs r > 4 merely
      to have sub-rho coordinate size (IDEA-20260807-6533fd).
    memory_exponent: >-
      The measurement stores the enumerated global points, O(B^{r/2}) entries,
      which is the binding toy resource. No attack memory is claimed.
