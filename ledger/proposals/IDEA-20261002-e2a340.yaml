idea:
  id: IDEA-20261002-e2a340
  question_id: RQ-ECDLP-002
  added: '2026-10-02'
  status: proposed
  approved_by: null
  title: >-
    Commutator of a multiplicative-base relation matrix with the shift of
    exponents, as the linear-algebra exponent
  class: mechanism
  claim: >-
    On a generic prime-order short-Weierstrass curve over F_p, index the
    implicit base H (abscissae in a fixed subgroup of F_p-star of order B)
    by exponents in Z/BZ. That indexing is R1 of RQ-ECDLP-623a32. The attack
    stage is linear algebra. Let M be the matrix of chord relations and let
    pi be the permutation of columns that adds 1 to every exponent. Either
    the Frobenius norm of pi M - M pi is at most B to the -1/2 times the
    Frobenius norm of M, or it is within a factor 2 of the same ratio for a
    random matrix of equal dimensions and equal sparsity. Only the first arm
    licenses replacing a B squared linear-algebra charge by B times (log B)
    to a constant, via the character table of H. In the dense-hit regime
    lambda = B to the 4 over N greater than 1 at arity m = 5, that
    replacement moves the model balance from a tie with N to the 1/2 to
    N to the 1/3 times a polylog. The proposal does not assert that the
    commutator is small. Pollard rho and BSGS are the matched baselines.
    No solve is claimed.
  mechanism: >-
    OBJECT FRAME. Representation: R1, the exponent coordinate on H, which
    is a choice of generator g and an ordering of the basis. Operation set
    Sigma: the permutation pi that sends the basis vector e_j to e_{j+1},
    i.e. multiplication of the corresponding abscissa by g. Sigma is a
    field-multiplication action on labels. It is not elliptic translation
    and does not contain it. F2 supplies the rows, as a named component:
    each row is a chord relation among base points. The lens is the
    commutator, not the existence of rows. TRICHOTOMY: coordinate-dependent.
    The commutator norm is a function of the ordered matrix, which is a
    representation choice. The same abstract set of relations written in a
    random order of H has a different commutator, typically that of a
    random matrix. A group-invariant of the unordered relation set would
    not see the ordering. This one does, so it is not a projection of the
    elliptic group. LOSSY PROJECTION: the norm discards the entries of M
    and keeps one nonnegative real. Many matrices share a norm. The
    discard is compatible with Sigma because the norm of the commutator
    with pi is unchanged by simultaneously conjugating M by a power of pi
    (a relabeling that Sigma itself generates). Keeping every entry would
    be the full matrix, which is the relation set in coordinates, not a
    lossy object. KN-OPEN-020 class: implicit-membership. Description of H
    is the integer B and the generator g. Membership is one exponentiation.
    If the commutator arm fails, this record does not move the base into
    another open class. It stops. DENSE-REGIME ARITHMETIC, to be expanded
    with constants in the reproduction check. Let lambda = B to the (m - 1)
    over N be the expected number of decompositions of a random target. The
    regime lambda > 1 is the one used here. At m = 5, lambda = B to the 4
    over N. The waiting time in seeds until the first hit is N over
    B to the (m - 2) = N over B cubed, under a uniform-seed model. About B
    relations give T_rel = N over B squared. Charging T_LA = B squared
    balances at N = B to the 4 and T = N to the 1/2, a tie with rho. Charging
    T_LA = B times (log B) to a constant, which is the FFT diagonalisation
    of a circulant matrix and is available only if pi M = M pi, balances at
    N = B cubed times (log B) to a constant and T = N to the 1/3 times a
    polylog in N. The commutator test is what chooses the charge. A matrix
    that merely has small bandwidth, or is sparse, is not circulant. The
    test does not accept sparsity as a substitute.
  novelty_status: unverified
  citations:
    - ref: KR-IC-5931ee
      provenance: internal
      claim: >-
        Naive prime-field index calculus does not beat generic methods
        under the row's statistical assumptions on the decomposition
        system. The row does not state a commutator for the relation
        matrix. Read from the rendered frontier map.
      verified_by: idea-generator session 2026-10-02
    - ref: KR-IC-0d2021
      provenance: internal
      claim: >-
        Degree-of-regularity refinements and a Las Vegas F4 bound are
        about solving the polynomial system, not about the shape of the
        integer relation matrix after relations are known. Read from the
        rendered frontier map.
      verified_by: idea-generator session 2026-10-02
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        Generic algorithms need Omega of square root of p group operations.
        A circulant solver that used only group operations would be
        generic and could not reach exponent 1/3. This record's FFT, if
        it applies, uses the multiplicative labeling of abscissae. Read
        from the rendered frontier map.
      verified_by: idea-generator session 2026-10-02
    - ref: KN-OPEN-020
      provenance: internal
      claim: >-
        Implicit membership is an open class. A cheap description does not
        by itself give a cheap linear algebra.
      verified_by: idea-generator session 2026-10-02
    - ref: KN-FIND-ffe1df
      provenance: internal
      claim: >-
        Theorem C as read: exact sum-compatibility on the prime-order group
        forces a homomorphism. The permutation pi acts on basis labels,
        not as a sum-compatible map on E.
      verified_by: idea-generator session 2026-10-02
  assumptions:
    - >-
      F2 is the source of rows only. The claim is about pi M - M pi after
      the rows exist.
    - >-
      Structured linear algebra is charged only if the commutator is
      exactly zero over the integers, or its norm is at most the stated
      B to the -1/2 fraction. Approximate commutativity is not enough for
      the FFT sentence, and the record does not use it.
    - >-
      The dense-regime waiting-time formula is a model. The reproduction
      check expands it before any exponent is repeated.
  predictions:
    - metric: >-
        Frobenius norm of pi M minus M pi, divided by the Frobenius norm
        of M
      direction: different
      minimum_effect: >-
        A ratio at most B to the -1/2, on a matrix with at least B rows,
        is the circulant arm. A ratio within a factor 2 of the median
        ratio of random 0-1 matrices with the same number of nonzeros is
        the unstructured arm.
    - metric: >-
        model linear-algebra exponent, 2 if unstructured and 1 if the
        commutator vanishes, measured as log of the charged solver cost
        over log B on the toy matrix
      direction: lower
      minimum_effect: >-
        Charged solver cost at most B times (log B) squared when the
        commutator is exactly zero. Any larger cost means the FFT
        sentence does not apply to this matrix even if the norm is small.
  minimal_test:
    design: >-
      One toy prime, N near 2 to the 16, B dividing p - 1 and near 2 to
      the 6, so that B to the 4 exceeds N and the dense-regime hypothesis
      can be checked by a direct count. Build M from chord relations among
      H-points, at least B rows, entries in {0, 1} after sign-folding.
      Compute the commutator ratio. Compare to 30 random matrices of the
      same shape and sparsity. If and only if the commutator is exactly
      zero, run an FFT solver and a dense solver on that same matrix and
      record both operation counts. Do not scale.
    controls:
      - >-
        Pollard rho and BSGS on the same curve, as cost baselines for the
        model tie at exponent 1/2.
      - >-
        Random-matrix null: 30 draws, same dimensions, same number of
        nonzeros, independent of the curve.
      - >-
        Random-order null: the same relations written in a random
        permutation of H. The commutator there must match the random-matrix
        null. If it is small, the norm is not about the exponent ordering.
      - >-
        Generic-group null: relations from a random Cayley table on Z/NZ
        injected into the same labels. A zero commutator there is an
        artifact of the indexing.
    required_metrics:
      - commutator ratio of M
      - median and maximum commutator ratio of the 30 random matrices
      - commutator ratio after a random reordering of H
      - dense-solver operation count and, if reached, FFT operation count
      - rho step count on the toy curve
  falsification_conditions:
    - >-
      The commutator ratio lies within a factor 2 of the random-matrix
      median. Structured linear algebra is not licensed. The model balance
      stays the tie with N to the 1/2.
    - >-
      The commutator is exactly zero, but the FFT solver's operation count
      exceeds B times (log B) squared. The character table does not
      diagonalise this matrix. Withdraw the N to the 1/3 charge.
    - >-
      lambda = B to the 4 over N is less than 1 on the chosen toy. The
      dense-regime derivation does not apply. Report lambda and do not
      quote 1/3.
    - >-
      The random-order null is as small as the exponent-ordered matrix.
      The ordering was not the mechanism.
  confounders:
    - >-
      Sign-folding can force extra symmetry. Report the commutator before
      and after folding. The decision uses the folded matrix only if the
      unfolded one is also recorded.
    - >-
      A short B makes B to the -1/2 a weak threshold (at B = 64, the
      threshold is 1/8). The random-matrix comparison is the decision. The
      power threshold is a second cut, not a substitute.
    - >-
      Relations that include the target point Q make a rectangular matrix
      whose square part may commute while the target column does not. The
      target column is included in M.
  interpretation_limits:
    - >-
      One toy prime. A zero commutator at B near 64 is not a statement
      about cryptographic B.
    - >-
      KN-OPEN-020 class: implicit-membership. A zero commutator does not
      place the base in the high-degree or target-dependent class.
    - >-
      Exponent 1/3 in the model is conditional on an exact commutator, on
      the dense-regime waiting time, and on H1. It is not a claimed attack
      cost.
    - >-
      KR-IC-5931ee is untouched: this record does not say the decomposition
      system is cheap. It says that even given the rows, the matrix shape
      chooses between a tie with rho and a conditional 1/3.
  heuristic_assumptions:
    - id: H1
      statement: >-
        In the regime B to the 4 over N greater than 1, at m = 5, the
        number of seeds inspected until the first chord hit on a uniform
        random target has mean within a factor 2 of N over B cubed.
      rigorous_support: >-
        Geometric waiting time for independent Bernoulli trials of success
        probability B cubed over N. The seeds are a scan of a group, not
        independent trials. The factor-2 window is the imitation.
      validation_plan: >-
        On the toy, for 50 random targets, record the scan position of the
        first hit and compare the sample mean to N over B cubed. Tail
        check: the slowest target in the 50 is at most 10 times the mean,
        or H1 fails and T_rel is not the model's T_rel.
    - id: H2
      statement: >-
        If pi M = M pi exactly over Z, then M is diagonalised by the
        character table of Z/BZ in B times (log B) squared arithmetic
        operations.
      rigorous_support: >-
        A circulant matrix is diagonalised by the Fourier matrix of the
        cyclic group. That is a theorem for complex circulant matrices.
        The imitation is that an integer relation matrix with the same
        symmetry reduces mod every prime in the same way, with bit-cost
        absorbed in the (log B) squared. Bit-cost may be larger.
      validation_plan: >-
        Only run if the commutator is exactly zero. Compare the FFT
        operation count to B times (log B) squared and to a dense
        elimination count on the same matrix. If the FFT count exceeds the
        bound, H2 fails for this encoding of the entries (in particular
        if the entries are not constant on diagonals in the way the
        theorem needs).
  target_complexity:
    time_exponent: >-
      Unstructured arm: model tie at N to the 1/2. Circulant arm, m = 5,
      dense regime, waiting-time model as written: N to the 1/3 times
      (log N) to a constant. The constant's degree is the reproduction
      check's job and is not pinned here beyond (log B) squared inside
      T_LA.
    memory_exponent: >-
      The matrix occupies B squared entries on both arms if it is stored
      densely. The circulant arm can store one column, B entries, if and
      only if the commutator is exactly zero. Otherwise memory exponent
      matches a dense matrix, 2 times the exponent of B, which at the
      unstructured balance B = N to the 1/4 is N to the 1/2.
    best_known: p to the 1/2 times polylog, Pollard rho, memory polylog
    hidden_overhead: >-
      (log B) squared for the FFT, bit size of the entries, and the factor
      2 in H1. These are polylog if H2 holds. They are not an o(1) in the
      exponent. If H2 fails, the overhead is the whole dense elimination,
      exponent 2 on B, and the time exponent returns to 1/2.
    tradeoff_note: >-
      Single target, no preprocessing. The one-column storage is available
      only on the circulant arm. Parallel FFT does not change the exponent.
      This is not a distinguished-point memory tradeoff and not the
      preprocessing tradeoff of l to the 1/3 online.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  proof_search_map:
    bottleneck: >-
      Exact commutation of M with pi. Without it the linear-algebra charge
      stays quadratic and the model ties rho.
    baseline_embedding:
      parameter_slice: >-
        A random ordering of the same rows. That slice must reproduce the
        random-matrix commutator and the dense balance T = N to the 1/2.
      reproduction_check: >-
        Expand T_rel = N over B squared and the two balances, B squared
        and B (log B) squared, on a page with the hypothesis lambda > 1
        written as B to the 4 > N. Confirm the circulant balance is
        N to the 1/3 times polylog only under that hypothesis. A missing
        factor B in T_rel flips the exponent and falsifies the page.
    observation_collision:
      observable: >-
        The commutator norm, a single real.
      distinct_preimage_search: >-
        Two matrices with the same commutator norm and different kernels.
        The norm does not determine solvability. A zero norm is the case
        where the fibre collapses to circulant matrices, and the random-order
        null is the search for a second preimage with a small norm.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The exponent ordering of H, against a random ordering of the
          same set.
        predicted_gain: >-
          If the exponent ordering drops the commutator from Theta(1) to
          exactly 0, the model linear-algebra charge drops from B squared
          to B (log B) squared and the dense-regime time exponent from
          1/2 to 1/3.
    quantifier_order: >-
      EITHER the commutator ratio of the exponent-ordered matrix is within
      a factor 2 of the random-matrix median (FOR ALL further solvers, the
      quadratic charge stands), OR the commutator is exactly zero AND the
      random-order null is not (EXISTS an ordering, the exponent ordering,
      that licenses the FFT charge). A small but nonzero commutator is
      neither arm and is reported as inconclusive.
    method_ceiling:
      strongest_certifiable_claim: >-
        Which charge the toy matrix licenses. The N to the 1/3 figure is
        a conditional model balance, not a certificate of a discrete log.
      nearby_object_control: >-
        The random Cayley table on Z/NZ with the same labels. A zero
        commutator on that object means commutation is an indexing
        artifact, and the elliptic matrix is not evidence.
    proof_obligations:
      - claim: >-
          Exact commutation implies the Fourier matrix diagonalises M over
          the cyclotomic field.
        responsibility: correctness
      - claim: >-
          In the dense regime the quadratic charge balances at exponent 1/2
          and the circulant charge at exponent 1/3, up to the polylog
          written on the check page.
        responsibility: runtime
      - claim: >-
          Sparsity alone does not imply commutation.
        responsibility: strictness
    not_applicable_reason: null
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-IC-5931ee
      - KR-IC-0d2021
      - KR-IC-73db3f
      - KR-IC-f3da82
      - KR-IC-e847d1
      - KR-IC-5a43e5
      - KR-IC-9e610d
      - KR-RHO-13bf67
      - KR-RHO-7d93f6
      - KR-RHO-ea34b8
    nearest:
      - ref: KR-IC-73db3f
        provenance: retrieved
        relation: orthogonal
        delta: >-
          That row chooses an F_2-subspace V so that dim V^(i) falls and
          the Weil-descent degree and variable count drop. This record
          never chooses a subspace and never descends. The object is the
          commutator of a prime-field chord matrix indexed by Z/BZ. No
          degree saving is claimed. The conditional cost gap, unmeasured,
          is linear algebra B squared versus B times (log B) squared,
          model time exponent 1/2 versus 1/3.
      - ref: KR-IC-5931ee
        provenance: retrieved
        relation: adjacent
        delta: >-
          The row prices decomposition, not the commutator of the relation
          matrix with a multiplicative shift. This record assumes rows can
          be built on a toy and asks only which linear-algebra charge they
          license. It does not claim the decomposition exponent the row
          lower-bounds.
      - ref: KR-IC-0d2021
        provenance: retrieved
        relation: orthogonal
        delta: >-
          Degree-of-regularity and Las Vegas F4 bound the polynomial
          solver. They do not speak about an integer matrix indexed by
          Z/BZ. No quantity is shared except the word matrix.
    searched:
      corpus_grep:
        - circulant relation matrix
        - commutator
      web: []
      blocked: []
  dominated_by: >-
    Unstructured arm: the model ties KR-RHO-13bf67 on the time exponent
    and loses on memory (dense matrix against polylog rho memory), so rho
    dominates that arm in the Pareto sense. Circulant arm: model time
    exponent 1/3 is better than rho's 1/2 and better than the online
    exponent only after noting KR-RHO-ea34b8 already states online
    exponent about 1/3 with preprocessing l to the 2/3. A one-column
    circulant matrix uses memory B = N to the 1/3 at the balance, with no
    preprocessing table. That point is not strictly dominated by
    KR-RHO-ea34b8 if the commutator is exactly zero, because the data axis
    (no preprocessing) differs. It is unmeasured. KR-RHO-7d93f6 prices
    generic collision memory, which does not include a circulant elliptic
    matrix.
  sota_delta: >-
    Unstructured arm: time-exponent delta 0 versus p to the 1/2, memory
    worse. Circulant arm: model time exponent 1/3, a delta of 1/6 below
    the rho exponent, memory exponent 1/3 if one column is stored, against
    rho memory polylog and against preprocessing memory about l to the 2/3
    for the generic online exponent 1/3. The 1/6 is the model gap, not a
    measurement.
