idea:
  id: IDEA-20261006-bc1250
  question_id: RQ-ECDLP-623a32
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: Tangent-slope fiber attains the degree-4 ceiling on one pinned Weierstrass chart
  class: measurement
  claim: >-
    On the nonsingular curve E: y^2 = x^3 + x + 6 over F_73, the tangent-slope
    map λ(P) = (3x(P)^2 + 1)/(2y(P)), defined on affine points with y(P) ≠ 0,
    has maximum fiber cardinality exactly 4.
  mechanism: >-
    Object frame. The representation is the R1 chart function λ in the pinned
    short-Weierstrass model (A, B) = (1, 6), not an abstract group element.
    Sigma is the singleton {doubling map [2]}, not the full translation action.
    Trichotomy class: coordinate-dependent. Under the legal chart change
    (x, y) ↦ (u^2 x, u^3 y), λ scales by u^{-1}, so λ is a function of the
    chart. Lossy-projection test against Sigma: expanding
    (3x^2 + A)^2 = 4λ^2 (x^3 + Ax + B) gives a degree-4 polynomial in x whose
    leading coefficient is 9, nonzero in F_73, and each simple root determines
    at most one point of that slope because λ(-P) = -λ(P). The Hasse window
    gives #E(F_73) ≥ 58 > 4, so the projection that keeps only λ is lossy.
    The discard does not propagate under doubling: λ(2P) is not a function of
    λ(P) alone, because the duplication formula still needs x(P). It is
    therefore not a block system of ⟨[2]⟩. That failed propagation clause is
    why the class is coordinate-dependent rather than partial-action. The open
    number priced here is the fiber cardinality, not an orbit-canonicalisation
    cost. Families F1–F7 are not the lens: there is no walk, factor base,
    isogeny path, pairing, p-adic lift, endomorphism-orbit walk, or
    preprocessing table. Negation is used only as the sign relation
    λ(-P) = -λ(P), not as a walk on {±P}.
  novelty_status: unverified
  citations:
    - ref: KR-RHO-fbd582
      provenance: internal
      claim: >-
        A shared inversion makes x(P−Q) cheap once x(P+Q) is known. This idea
        does not use that identity and does not price a baby-step/giant-step
        or kangaroo step.
      verified_by: idea-generator
    - ref: KR-RHO-fb88e6
      provenance: internal
      claim: >-
        Walking on {±P} multiplies the rho iteration count by about 1/√2 and
        creates fruitless cycles. This idea uses only the sign relation
        λ(−P) = −λ(P) and claims no iteration reduction.
      verified_by: idea-generator
    - ref: KR-RHO-0528e7
      provenance: internal
      claim: >-
        An automorphism group of order m multiplies rho iterations by 1/√m
        and leaves the exponent 1/2 unchanged. The pinned curve is not treated
        as a j = 0 or j = 1728 automorphism quotient.
      verified_by: idea-generator
    - ref: docs/object-frame-ideation.md
      provenance: internal
      claim: >-
        A tracked object is a pair (representation, operation set Sigma), and
        on a prime-order subgroup the lossy objects that propagate under Sigma
        are the block systems of the semigroup generated by Sigma.
      verified_by: idea-generator
  assumptions:
    - The model is fixed as y^2 = x^3 + x + 6 over F_73. A change of u rescales λ and is a different representation.
    - Discriminant −16(4A^3 + 27B^2) = −16·976 ≠ 0, so E is an elliptic curve. Characteristic is not 2 or 3, so λ is defined by the displayed formula and the slope polynomial has degree exactly 4.
    - Fibers are counted on affine points with y ≠ 0. The point at infinity and the 2-torsion, where y = 0, are outside the domain.
  proof_search_map:
    bottleneck: >-
      Whether any λ in F_73 has four distinct preimages on E(F_73). Removing
      that existence question leaves only the degree upper bound of 4, which
      does not say the bound is attained.
    baseline_embedding:
      parameter_slice: >-
        The negation identity λ(−P) = −λ(P) on this same curve. It pairs slopes
        but does not force any fiber to have size 4, nor size at most 2.
      reproduction_check: >-
        Before reading the histogram, check λ(−P) = −λ(P) for every affine
        point with y ≠ 0. A single failure voids the run.
    observation_collision:
      observable: the maximum fiber cardinality of λ
      distinct_preimage_search: >-
        Search for two affine points with the same λ and distinct x-coordinates.
        A fiber of size 4 is four such points. Two different slopes with the
        same fiber size are not a collision of the observable.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          For each attained λ, the univariate
          (3x^2 + 1)^2 − 4λ^2 (x^3 + x + 6) in F_73[x].
        predicted_gain: >-
          Replaces a search over points by counting F_73-roots, and certifies
          that no fiber can exceed 4.
    quantifier_order: >-
      There exists λ in F_73 such that there exist four distinct affine points
      of E(F_73) with that tangent slope. The quantifiers are not swapped: a
      universal statement over all curves is not claimed.
    method_ceiling:
      strongest_certifiable_claim: >-
        On this one curve the maximum fiber equals 4, or it is at most 3. The
        degree forbids a fiber of size 5 or more.
      nearby_object_control: >-
        A random degree-4 polynomial over F_73 can have four roots without
        being a slope polynomial of E. Counting those roots as successes would
        make the claim vacuous, so only slopes attained by points of E count.
    proof_obligations:
      - claim: The slope equation has degree exactly 4 over F_73.
        responsibility: size
      - claim: Two independent enumerations of E(F_73) produce the same maximum fiber.
        responsibility: correctness
      - claim: The statement is only about (A, B, p) = (1, 6, 73).
        responsibility: scope
  predictions:
    - metric: maximum number of affine points of E(F_73) with a common tangent slope
      direction: higher
      minimum_effect: >-
        The maximum equals 4, which is at least 1 above the failure outcome
        in which every fiber has size at most 3.
  minimal_test:
    design: >-
      Enumerate E(F_73), compute λ at each affine point with y ≠ 0, and record
      the maximum number of points sharing one value. Separately, for each
      attained λ, count roots of the degree-4 slope polynomial and require the
      two counts to agree.
    controls:
      - λ(−P) = −λ(P) holds for every point in the domain, checked before the histogram is read.
      - The same root counter on 200 random monic degree-4 polynomials over F_73, which must not be entered as slope fibers.
      - A PGL_2 reparametrisation of x, as required by RQ-ECDLP-623a32, rerun on the same points. If every reparametrisation still reports maximum fiber 4, the hit is not special to this pinning; if any reports maximum at most 3, the phenomenon is chart-dependent, which is the claimed class.
    required_metrics:
      - maximum fiber cardinality of λ
      - number of slopes with fiber size 4
      - number of domain points
      - agreement bit between the point histogram and the univariate root count
  falsification_conditions:
    - Every tangent slope attained on E(F_73) has at most 3 preimages. The claim is then false on this curve.
    - The point histogram and the degree-4 root counter disagree. The run is void and is not evidence against the algebraic degree.
  confounders:
    - Counting both P and a second model of the same point after a change of u double-counts a chart effect.
    - Vertical tangents at y = 0 are undefined, not fibers of a finite slope. Folding them into a fiber would invent a fifth point.
    - A repeated root can look like two points in floating output. The count must be over distinct points of E.
  interpretation_limits:
    - A fiber of size 4 on this curve does not change the Pollard rho exponent 1/2 and does not yield a homomorphism of a prime-order subgroup.
    - A miss at size at most 3 closes only (A, B, p) = (1, 6, 73), not every Weierstrass chart.
    - The result is a coordinate statistic. It is not a charged cost for factor-base membership, decomposition, collision search, or linear algebra.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For this pinned curve, the factorization type of the degree-4 slope
        polynomial, as λ varies over slopes attained by E(F_73), hits the
        complete-split type at least once. A uniform random element of S_4 is
        the identity with probability 1/24, and |S_4| = 24 by counting.
      rigorous_support: >-
        The slope polynomial has degree exactly 4 because its leading
        coefficient is 9 ≠ 0 in F_73. That bounds every fiber by 4. The
        probability 1/24 is the counting measure on S_4, not a theorem about
        this slope family. Transfer from a uniform polynomial to this
        parametric family is the heuristic.
      validation_plan: >-
        Sampling route: compute the splitting type of the slope polynomial at
        every attained λ on this curve, and on the same (A, B) reduced modulo
        each prime from 70 to 200 at which the reduction remains nonsingular
        and of characteristic not 2 or 3. Comparison: the empirical frequency
        of four distinct roots against 1/24. Tail check: whether the first
        prime in that list with no 4-root slope arrives earlier than a
        geometric wait of mean 24. Refutation: this curve has no 4-root slope,
        or the frequency of 4-root slopes across that prime list is 0.
  target_complexity:
    time_exponent: >-
      1/2, the generic rho exponent. This measurement does not change it.
    memory_exponent: >-
      0 in the security parameter. The histogram stores O(p) field elements
      at p = 73.
    best_known: >-
      Pollard rho collides in Θ(√|G|) group operations up to a √(log) factor,
      exponent 1/2. Automorphism and negation improvements, where they apply,
      are constant factors and are not claimed here.
    hidden_overhead: >-
      No new o(1) or polylog cofactor is claimed. The degree-4 root count is
      O(p) arithmetic operations on this toy field.
    tradeoff_note: >-
      No time–memory tradeoff and no parallel collision search. The census is
      a single pass over the rational points.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
