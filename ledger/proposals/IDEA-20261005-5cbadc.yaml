  dominated_by: >-
    KN-LIT-078 (opened note) is the baseline checked: Õ(p^{1/2}) on
    the full supersingular graph and Õ(p^{1/4}) on the F_p subgraph.
    No attack result is claimed against that baseline.
  sota_delta: >-
    One integer, |I - C|, predicted at least 1, at one prime p ≤ 300.
    The exponent delta against Õ(p^{1/4}) is 0.
