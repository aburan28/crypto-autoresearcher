idea:
  id: IDEA-20261005-5cbadc
  question_id: RQ-SSI-001
  added: '2026-10-05'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Internal 2-isogeny edges of the F_p supersingular subset differ in
    count from the edges that leave the subset, at the smallest odd
    prime where the subset has at least two j-invariants.
  class: measurement
  claim: >-
    Let p be the smallest odd prime, at most 300, such that the set
    S_p of supersingular j-invariants in F_p has at least two elements.
    Count undirected edges between distinct supersingular j-invariants
    by Vélu on order-2 kernels over the 2-torsion field, once each.
    Let I be the number of those edges with both ends in S_p, and let
    C be the number with exactly one end in S_p. The claim is I ≠ C.
    This is one pair of integers on the subgraph used by F_p
    path-finding. It is not a path search and it does not change an
    ECDLP exponent.
  mechanism: >-
    The computed objects are two edge counts on the supersingular
    2-isogeny graph. Agreement, I = C, means this edge split is absent
    at that prime, so the split supplies no structural imbalance for a
    path-finding walk to use. Disagreement, I ≠ C, means the F_p
    subset is edge-imbalanced at that prime. Either outcome is a toy
    gate on the surviving F_p path-finding graph. Neither outcome is
    an algorithm and neither changes the p^{1/2} or p^{1/4} baselines
    recorded in the opened notes.
    OBJECT FRAME. Representation: the j-invariant of a supersingular
    curve, a curve invariant rather than a point coordinate.
    Operation set Sigma: dual pairs of 2-isogenies. Sigma is not
    translation on a prime-order subgroup. TRICHOTOMY: partial-action.
    Reason: an undirected edge is fixed by taking the dual isogeny and
    is not a function of translating a rational point.
    LOSSY-PROJECTION TEST against Sigma. Discarded: vertex labels and
    all path lengths, including every pairwise distance. Retained: the
    two integers I and C. Many labeled graphs share one pair (I, C),
    so the projection is lossy. The mean distance on an 8-to-24-vertex
    graph is not computed.
  novelty_status: unverified
  citations:
    - ref: KN-TECH-024
      provenance: internal
      claim: >-
        The opened note states that the supersingular ell-isogeny
        graph is (ell+1)-regular on about p/12 vertices, and that
        generic path-finding is about O(p^{1/2}) classically and
        O(p^{1/4}) on the F_p subgraph. No edge-count table is in
        the note.
      verified_by: idea-generator, this session, via knowledge/techniques/KN-TECH-024.md
    - ref: KN-LIT-078
      provenance: internal
      claim: >-
        The opened note reports full-graph meet-in-the-middle at
        expected Õ(p^{1/2}) time and space, and Õ(p^{1/4}) after
        descending to the F_p-rational subgraph. The paper PDF was
        not opened.
      verified_by: idea-generator, this session, via knowledge/literature/KN-LIT-078.md
    - ref: KN-OPEN-013
      provenance: internal
      claim: >-
        The opened note asks how hard supersingular endomorphism-ring
        and isogeny-path finding are after the SIDH break, and it
        reports no sub-p^{1/4} generic attack in that note.
      verified_by: idea-generator, this session, via knowledge/open-problems/KN-OPEN-013.md
  assumptions:
    - Some odd prime p ≤ 300 has at least two supersingular j-invariants in F_p. If the cap is reached with none, the instance is missing.
    - Supersingularity of a j-invariant in F_{p^2} is decided by the trace of Frobenius of one short-Weierstrass model being divisible by p.
    - Edges are undirected and simple. A loop, meaning a 2-isogeny from a j-invariant to itself, is excluded from I and from C and is recorded separately.
  predictions:
    - metric: absolute difference |I - C|
      direction: different
      minimum_effect: 1
  minimal_test:
    design: >-
      For each odd prime p from 3 through 300, list j in F_p, test
      supersingularity by a point count, and stop at the first p with
      |S_p| ≥ 2. From each curve in S_p, enumerate order-2 kernels
      over the 2-torsion extension, apply Vélu, and keep the target
      j when it is supersingular and distinct from the source. Count
      each undirected pair once. Classify it as internal or cut.
      Do not compute distances. Stop after this prime.
    controls:
      - Every retained neighbor of a supersingular source is supersingular. A non-supersingular neighbor falsifies the enumeration.
      - Each undirected pair is stored once. A second insertion of the same pair is a double-count error.
      - Loops are counted in a separate integer and are absent from I and from C.
      - The same census on the lexicographically second model of one j in S_p, when two short-Weierstrass models exist, yields the same neighbor set.
    required_metrics:
      - selected_prime
      - s_p_cardinality
      - internal_edge_count
      - cut_edge_count
      - loop_count
  falsification_conditions:
    - I equals C at the selected prime.
    - No odd prime p ≤ 300 has |S_p| ≥ 2.
    - A neighbor j fails the supersingularity test.
    - Two short-Weierstrass models of the same j produce different neighbor sets.
  confounders:
    - Extra automorphisms at j = 0 and j = 1728 can send several kernels to one target j. Distinct-j counting is the rule, so raw kernel counts are not the metric.
    - A directed count would double every dual pair and can manufacture a difference. The metric is undirected.
    - A loop is neither internal nor cut. Folding loops into either count would change the comparison.
  interpretation_limits:
    - A difference at one prime is a graph statistic. It does not yield a walk, a path, or a lower exponent.
    - Equality at one prime removes this split at that prime. It does not close path-finding.
    - This measurement does not change an ECDLP exponent. The opened baselines Õ(p^{1/2}) and Õ(p^{1/4}) stay untouched.
    - Toy-only, as RQ-SSI-001 requires for an effect at this size.
  heuristic_assumptions:
    - id: HA-1
      statement: >-
        At the single selected prime, the pair (I, C) imitates a
        uniform random partition of the incident 2-isogeny ends of
        S_p in the configuration model of a 3-regular graph. The
        imitation is not a theorem about the supersingular graph.
        The sample is one prime, p ≤ 300. No transfer to a larger
        prime is claimed.
      rigorous_support: >-
        KN-TECH-024, opened, states that the supersingular ell-isogeny
        graph is (ell+1)-regular. For ell = 2 that is degree 3 before
        automorphism identifications. Distinct-j degree may be smaller.
        The test uses the observed neighbor sets.
      validation_plan: >-
        Compute I and C at that one prime. The consistency check is
        that every counted edge has two supersingular ends and that
        no pair is stored twice. Sample size one has no tail. No
        second prime is drawn.
  target_complexity:
    time_exponent: >-
      One point-count census of j in F_p for odd primes p ≤ 300,
      then one 2-torsion Vélu census at the selected prime. Cost is
      polynomial in that capped p. No p^{1/4} path search is run.
    memory_exponent: >-
      O(|S|) j-invariants at the selected prime. |S| is on the order
      of p/12 in the opened note KN-TECH-024, and p ≤ 300.
    best_known: >-
      KN-LIT-078, opened note: Õ(p^{1/2}) full-graph meet-in-the-middle
      and Õ(p^{1/4}) on the F_p subgraph. Those algorithms are the
      baseline not claimed.
    hidden_overhead: >-
      No o(1) term. The cap p ≤ 300 is explicit, and the output is
      two integers.
    tradeoff_note: >-
      No time-memory tradeoff and no parallel collision search. One
      graph slice at one prime.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: not_applicable
    not_applicable_reason: >-
      This is a toy edge count on the supersingular 2-isogeny graph,
