idea:
  id: IDEA-20260813-8aa6ea
  added: '2026-08-13'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-QALG-457b41
  goal_id: GOAL-QALG-001
  title: >-
    Galois-automorphism sample amplification for ring-structured DCP
    instances: does the cyclotomic ring's automorphism group relieve Simon
    2026's astronomical sample count, or does it break the pairwise-
    independence assumption Lemma 3 needs
  class: composition
  claim: >-
    Simon 2026's claimed algorithm needs Q = k*n^(c+1) coherent DSP samples
    with c >= 12, k > c -- KN-OPEN-8a5965 itself flags this as "polynomial
    and astronomically impractical simultaneously." ML-KEM's underlying ring
    R = Z[X]/(X^256+1) has a Galois automorphism group of order 128
    (generated by X -> X^i for odd i mod 512), and applying such an
    automorphism to a valid Module-LWE sample (A, b = A*s + e) deterministically
    produces another valid Module-LWE sample (sigma(A), sigma(b) =
    sigma(A)*sigma(s) + sigma(e)) for the Galois-conjugate secret sigma(s),
    at zero additional query cost against the public key. This proposal
    claims that composing this free algebraic symmetry with Regev's reduction
    to DCP and Simon's sampling procedure produces one of two genuinely
    different, discriminable outcomes: (a) the up-to-128 Galois-conjugate
    samples derived from one public MLWE instance behave, for the purposes of
    Lemma 3's counting argument, close enough to independently-drawn fresh
    samples that they can be counted toward Simon's required Q at zero extra
    query cost -- materially relieving (though not eliminating) the
    astronomical sample-count obstruction specifically at ML-KEM's ring-
    structured parameters; or (b) the Galois-conjugate samples are so
    strongly correlated (being deterministic images of one another under a
    known automorphism) that using them violates the pairwise-independence
    assumption KN-OPEN-8a5965 sub-question 2 already flags as unverified in
    Lemma 3's argument, in which case the ring structure that makes ML-KEM
    efficient is precisely what breaks this specific attack route at exactly
    the parameters that matter, a structural finding worth recording either
    way.
  mechanism: >-
    Tracked object: the correlation structure (specifically, the pairwise
    covariance of the phase-carrying quantities h_i, or equivalently of the
    per-sample subset-sum contributions b_i*y_i, in Simon's Algorithm 2
    sketch) among a set of DCP samples derived via Galois orbits of a single
    physical MLWE sample, compared against the same statistic for genuinely
    independent samples. This is a composition of two known ingredients
    (ring-LWE's Galois self-map, standard in the ring-LWE literature as a
    structural symmetry, and Simon's group-based sample-partitioning
    procedure) that -- as far as this program's corpus search found -- has
    not been examined together for its effect on DCP-route sample economy or
    on the specific independence assumption the erasure step needs. The
    lossy-projection test: tracking only the pairwise-covariance statistic
    (not the full Galois-orbit state) discards everything except the exact
    quantity Lemma 3's proof needs to be well-behaved (per KN-OPEN-8a5965 sub-
    question 2, "does the pairwise-independence argument survive the
    conditioning"), so the projection is compatible with the target
    computation's own operations by construction, not merely convenient.
  novelty_status: unverified
  novelty_screen:
    local_kb_status: >-
      crypto-kb MCP tools unavailable this session; screened via direct grep
      of committed knowledge/ and ledger/ at snapshot commit
      083ca0026281c05e85570e5bddf90adbd4954d69 (see retrieval-screen.yaml).
    screened_proposals: >-
      No prior RQ-QALG-457b41 filings exist. Distinct from sibling
      IDEA-20260813-4aecda (toy-scale Lemma-3 audit without ring structure)
      and IDEA-20260813-0cf345 (reduction-noise-budget measurement,
      no automorphism content); this proposal is the only one of the five
      that introduces the ring's Galois symmetry as its tracked object.
    adjacent_corpus:
      - KN-LIT-e204ab
      - KN-OPEN-8a5965
      - KN-TECH-d1bc4f
      - KN-LIT-1744
      - KN-LIT-21383c
    external_screen: >-
      No live web search available this session. Galois/automorphism self-
      reducibility of Ring-LWE is well-established background in the public
      ring-LWE literature (not independently re-verified here beyond the
      elementary ring-homomorphism argument stated in "mechanism" above,
      which is checkable from the ring axioms alone); its COMPOSITION with
      Simon 2026's specific sample-partitioning procedure and its effect on
      Lemma 3's independence assumption is not found anywhere in this
      program's corpus and is therefore recorded as unverified rather than
      novel, pending an actual literature check this session could not
      perform.
    nearest_neighbors: []
  assumptions:
    - >-
      The elementary claim that sigma(A), sigma(b) is a valid MLWE sample for
      secret sigma(s) is a direct consequence of sigma being a ring
      homomorphism commuting with the module structure (sigma applied
      coordinatewise across the module rank); this is checked symbolically as
      part of the minimal test, not assumed without derivation.
    - >-
      "Zero additional query cost" means zero additional queries against the
      PUBLIC KEY (no new decapsulation or oracle access); it does not mean
      zero additional classical or quantum computation to apply sigma and
      re-run the DCP-sampling arithmetic, which is charged in any cost
      accounting.
    - >-
      This proposal does not assume Simon's Lemma 3 is correct; it asks a
      question that matters under either verdict from IDEA-20260813-4aecda --
      if Lemma 3 fails outright, the independence-breaking finding here (b)
      becomes moot, but the sample-amplification finding (a) would still be
      informative for any FUTURE noise-tolerant DCP algorithm of the same
      general shape.
  proof_search_map:
    bottleneck: >-
      Whether Galois-orbit-derived samples can be treated as independent
      enough, for Simon's Lemma 3 counting argument specifically, to count
      toward the required Q = k*n^(c+1) sample budget. This is the exact
      point where "free" algebraic redundancy either rescues or wrecks the
      concrete-cost side of the DCP route for ring-structured schemes like
      ML-KEM.
    baseline_embedding:
      parameter_slice: >-
        Using zero Galois-derived samples (only physically independent
        draws) is the parameter slice that reproduces Simon's own stated
        Q = k*n^(c+1) requirement and Lemma 1/4 arithmetic exactly, with no
        modification; this must be reproduced before any Galois-augmented
        variant is evaluated.
      reproduction_check: >-
        Symbolic/arithmetic reproduction of Simon 2026's own Lemma 1 sample-
        budget count and Lemma 4 balls-in-bins arithmetic (already
        independently re-derived and found consistent in KN-LIT-e204ab's own
        review notes), at zero Galois augmentation, as the fixed baseline.
    observation_collision:
      observable: >-
        The pairwise covariance Cov(b_i y_i, b_j y_j) (or the analogous
        phase-alignment statistic) between two samples i, j drawn as
        Galois-conjugate images of one another, versus the same statistic for
        two physically independent samples.
      distinct_preimage_search: >-
        Search for parameter regimes (small toy ring degree, small
        automorphism-group order) where the Galois-derived covariance is
        numerically indistinguishable from the independent-sample covariance
        at the scale Lemma 3's argument actually uses it (i.e. whether the
        DIFFERENCE matters for the specific counting bound, not merely
        whether a difference exists in principle) -- if indistinguishable at
        that scale, outcome (a) (relief) is supported; if starkly different,
        outcome (b) (independence violation) is supported.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Represent the Galois orbit of one physical MLWE sample as a
          length-up-to-128 tuple of DCP samples, each tagged with which
          automorphism produced it, and re-run Simon's own subset-sum/
          balls-in-bins accounting treating orbit-tagged samples as a
          DEPENDENT block rather than as independent draws, to see whether
          the accounting still goes through with a corrected (not naive)
          dependence model.
        predicted_gain: >-
          If a corrected dependence model still yields the required
          concentration (Lemma 4's balls-in-bins bound, adapted for
          within-orbit dependence), the effective sample cost at ML-KEM's
          ring degree 256 could drop by up to a factor of 128 (one orbit's
          worth) relative to the naive independent-sample count -- still not
          enough by itself to make Q = k*n^(c+1), c>=12 practical, but a
          concrete, quantifiable relief worth recording.
    quantifier_order: >-
      Simon's Lemma 3 implicitly requires: for a random secret d and Q
      independently drawn faulty samples, the phase/count statistics are
      pairwise independent (over the sample randomness). This proposal tests
      whether that "independently drawn" precondition can be RELAXED to
      "drawn as an orbit under a known, public automorphism group, for a
      FIXED number of physical draws" without invalidating the conclusion --
      i.e. whether the witness (the specific dependence structure) can depend
      on the ring's automorphism group in a way the original claim's
      universal quantifier over "Q independent samples" did not anticipate
      and may not tolerate.
    method_ceiling:
      strongest_certifiable_claim: >-
        At best, this proposal can certify a quantitative relief factor
        (bounded by the automorphism group's order, at most 128 for ML-KEM's
        ring) in the physical sample count needed, OR a concrete
        demonstration that Galois-derived samples violate the specific
        independence property Lemma 3's counting bound uses -- it cannot
        certify anything about Lemma 3's correctness for genuinely
        independent samples, which is IDEA-20260813-4aecda's separate
        question.
      nearby_object_control: >-
        The nearby object where the hoped-for relief is known to fail is the
        DEGENERATE automorphism (the identity map): using "128 copies of the
        identity automorphism" trivially produces zero new information and
        must show zero relief in any correctly-built accounting; if the
        proposed method shows nonzero relief even under the identity-only
        control, the method itself (not the ring structure) is the artifact.
    proof_obligations:
      - claim: >-
          sigma(A), sigma(b) is a valid MLWE sample for sigma(s), verified as
          a ring-homomorphism identity.
        responsibility: baseline
      - claim: >-
          The identity-automorphism control shows zero relief, confirming the
          accounting method itself is sound before any nontrivial
          automorphism is used.
        responsibility: correctness
      - claim: >-
          The corrected (dependence-aware) Lemma-4-style concentration bound,
          if it exists, is derived and checked against the naive
          (independence-assumed) bound at small toy scale.
        responsibility: success_probability
      - claim: >-
          Any relief factor claimed is bounded by the automorphism group's
          actual order (at most 128 for ML-KEM's ring) and stated as such,
          not extrapolated beyond it.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: galois_pairwise_covariance_vs_independent
      direction: different
      minimum_effect: >-
        The measured gap between Galois-orbit-derived and physically-
        independent pairwise covariance at small toy ring degree (4, 8, 16);
        direction "different" because the proposal does not predict which
        way the gap falls.
    - metric: identity_control_relief_factor
      direction: lower
      minimum_effect: >-
        The identity-automorphism control's measured "relief factor" must be
        indistinguishable from 1 (no relief) within the reported confidence
        interval; a nonzero apparent relief here falsifies the accounting
        method itself, independent of any Galois-specific finding.
    - metric: nontrivial_galois_relief_factor
      direction: different
      minimum_effect: >-
        The measured relief factor (effective independent-sample-equivalent
        count achievable from one physical draw's Galois orbit) at toy ring
        degree, compared against the trivial upper bound (the automorphism
        group's order); direction is "different" because both a large
        relief (near the trivial bound, supporting outcome a) and a near-zero
        relief (supporting outcome b) are informative and neither is
        predicted in advance.
  minimal_test:
    design: >-
      (1) Formally verify (symbolic ring-homomorphism check, not simulation)
      that sigma(A), sigma(b) is a valid MLWE sample for sigma(s) at toy ring
      degree (e.g. Z[X]/(X^4+1) or Z[X]/(X^8+1)), for the automorphisms
      X -> X^i, i odd mod 2*(ring degree). (2) Implement Simon's Algorithm
      1-3 arithmetic skeleton (as in IDEA-20260813-4aecda) with an added
      sample-provenance tag distinguishing "physically independent" from
      "Galois-derived" samples. (3) Run the identity-automorphism control
      first, verifying zero relief. (4) Run the nontrivial-automorphism
      variant at toy ring degree, measuring the pairwise covariance gap and
      the effective relief factor in Lemma 4's balls-in-bins-style
      concentration bound. (5) Report both the covariance-gap and relief-
      factor metrics with their toy-scale caveats explicit. This record
      authorizes no execution; it is a design for Coordinator approval.
    controls:
      - >-
        Identity-automorphism (trivial orbit) control: must show zero relief;
        this is the null-object control per docs/inventor-protocol.md
        section 3, applied to the accounting method rather than to a
        cryptanalytic signal.
      - >-
        Physically-independent-sample baseline, reproducing Simon's own
        stated Lemma 1/4 arithmetic exactly with zero Galois augmentation.
      - >-
        Cross-check that the relief factor never exceeds the automorphism
        group's actual order (a hard combinatorial ceiling, not an empirical
        one) at every tested scale.
    required_metrics:
      - symbolic verification result for the ring-homomorphism identity
      - pairwise covariance gap (Galois-derived vs independent), by toy ring
        degree
      - identity-control relief factor (must be ~1)
      - nontrivial-automorphism relief factor, by toy ring degree, with its
        ratio to the automorphism-group-order ceiling
  falsification_conditions:
    - >-
      The ring-homomorphism identity fails to verify symbolically: this
      falsifies the proposal's own basic premise and halts the line
      immediately (this is the cheapest possible falsifier and should be
      checked first).
    - >-
      The identity-automorphism control shows nonzero relief: this falsifies
      the accounting METHOD, not the ring structure, and the method must be
      corrected before any nontrivial-automorphism result is trusted.
    - >-
      The nontrivial-automorphism relief factor is statistically
      indistinguishable from the identity control's (near 1) at every tested
      toy scale: this supports outcome (b), that Galois-derived samples are
      too correlated to help Lemma 3's counting argument, closing this
      specific relief mechanism with a named obstruction (deterministic
      algebraic dependence defeats the independence assumption).
  confounders:
    - >-
      Conflating "these samples are algebraically related" (a symbolic fact,
      always true) with "these samples are statistically too correlated for
      Lemma 3's argument" (an empirical, scale-dependent question); the
      identity control exists precisely to keep these separate.
    - >-
      Extrapolating a toy-ring-degree (4, 8, 16) relief or non-relief finding
      directly to ML-KEM's actual degree-256 ring without flagging the
      extrapolation as unverified; the automorphism group's order scales with
      ring degree (Euler-phi-like growth), so the toy-scale ceiling is not
      simply proportional.
    - >-
      Treating a positive relief finding as making Simon's algorithm
      practical; per KN-OPEN-8a5965, even a 128x reduction in required
      physical samples leaves Q = k*n^(c+1)/128, c>=12 still astronomically
      large at ML-KEM's n -- see IDEA-20260813-02479f for the dedicated
      concrete-cost audit of this exact point.
  interpretation_limits:
    - >-
      This proposal's toy-ring-degree results do not transfer quantitatively
      to ML-KEM's degree-256 ring without a separate, unaddressed scaling
      argument; only the QUALITATIVE verdict (relief-mechanism viable in
      principle, or independence-breaking) is claimed to transfer, and even
      that transfer is a heuristic assumption (H1 below), not a proof.
    - >-
      A positive finding here does not by itself make the DCP route
      practical against ML-KEM; it only relieves one specific, named
      component (physical sample count) of the larger obstruction analyzed
      across this batch's five proposals.
    - >-
      Results here do not transfer to RQ-QALG-122b59 or RQ-QALG-74bf20 per
      GOAL-QALG-001's non_duplication note; HQC's syndrome-decoding structure
      and CSIDH's noise-free Kuperberg regime do not share ML-KEM's
      cyclotomic Galois symmetry in the same way.
  heuristic_assumptions:
    - id: H1-toy-to-crypto-scale-transfer
      statement: >-
        The QUALITATIVE verdict (whether Galois-orbit dependence helps or
        hurts Lemma 3's counting argument) observed at toy ring degrees 4-16
        is representative of the qualitative behavior at ML-KEM's ring degree
        256, even though the QUANTITATIVE relief factor is not expected to
        transfer without a separate scaling derivation.
      rigorous_support: >-
        No rigorous bound is claimed; this mimics only the general
        expectation (standard in the ring-LWE hardness literature, not
        independently re-derived here) that algebraic properties of a
        cyclotomic ring's automorphism action tend to be structurally
        uniform across degrees within the same power-of-two family, the same
        family ML-KEM uses. This is explicitly the weakest heuristic in this
        proposal and should be treated as such by any reviewer.
      validation_plan: >-
        Test at toy ring degrees 4, 8, 16, and if compute budget allows, 32
        and 64, checking whether the qualitative verdict (relief-viable vs
        independence-broken) is STABLE across that range before asserting it
        would likely hold at 256; a verdict that flips between toy scales
        would falsify this heuristic outright and must be reported as such
        rather than resolved by picking the "nicer" scale.
  target_complexity:
    time_exponent: >-
      Not claimed. This proposal measures a sample-economy relief factor, not
      an algorithm's asymptotic runtime.
    memory_exponent: not applicable to this measurement.
    best_known: >-
      2^(0.2653 d + o(d)) time in the QRAM model (Laarhoven, KN-LIT-703), the
      RQ's own Grover-only baseline; this proposal targets a precondition
      (sample-count feasibility) for a hypothetical competitor to that
      baseline, not the baseline itself.
    hidden_overhead: >-
      Even a full (128x) relief factor leaves Simon's own Q = k*n^(c+1),
      c>=12 requirement reduced by only a constant factor, not by an exponent
      -- the dominant n^13-scale cost is untouched by this mechanism and must
      be disclosed as such in any downstream summary.
    tradeoff_note: not applicable; no time-memory tradeoff is proposed here.
  estimated_cost:
    implementation: low
    compute: low
    note: >-
      Symbolic ring-homomorphism check plus small toy-ring-degree classical
      simulation; no ML-KEM implementation or quantum hardware required.
  dominated_by: >-
    n/a (no attack or algorithm result claimed). Checked against the same
    frontier as the sibling proposals in this batch: Grover/quantum-walk
    sieve 2^(0.2653 d + o(d)) and quantum k-Sieve 2^(0.2989 d + o(d)) time /
    2^(0.1395 d + o(d)) memory (both KN-LIT-703), and the unverified Simon-
    2026-composed-with-BKSW claim (KN-LIT-e204ab); this proposal's own
    deliverable is a sample-economy relief factor for the latter, not a
    displacement of either established baseline.
  sota_delta: >-
    Zero, quantitatively. Even in the best case (full 128x relief, the
    automorphism group's actual order for ML-KEM's ring), the dominant cost
    term in Simon's own formula (n^13 at n roughly 512-3072) is untouched by
    a constant factor of at most 128, so this proposal's own deliverable
    cannot, even under its most favorable outcome, move the sota_delta of the
    RQ's decision target; its value is diagnostic (which of relief vs
    independence-breakage occurs), not competitive.
  recommended_priority: medium
  source_refs:
    - https://eprint.iacr.org/2026/1591
    - https://eprint.iacr.org/2026/155
    - knowledge/literature/KN-LIT-e204ab.md
    - knowledge/open-problems/KN-OPEN-8a5965.md
    - knowledge/techniques/KN-TECH-d1bc4f.md
    - knowledge/literature/KN-LIT-1744.md
  enumerated_closures: []
  open_directions:
    - >-
      If outcome (b) (independence-breaking) is confirmed, a natural
      follow-on is checking whether OTHER public symmetries of ML-KEM's
      instance (e.g. scalar multiples of the secret, if any survive
      standardization) share the same failure mode, to map the full extent
      to which ML-KEM's structure is protective against this specific route.
    - >-
      If outcome (a) (partial relief) is confirmed, combine with
      IDEA-20260813-02479f's access-model audit to see whether the combined
      relief (Galois orbits plus self-reduction) meaningfully changes the
      astronomical-sample-count verdict, or leaves it essentially unchanged.
