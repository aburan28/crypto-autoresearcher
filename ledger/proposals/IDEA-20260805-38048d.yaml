      faest-ref source: bavc.c (pos_in_tree, bavc_open, reconstruct_keys),
      instances.c/h (parameter macros), meson.build (parameter tables),
      faest_impl.c (hash_mu). FETCHED AND READ BY THIS SESSION 2026-08-06
      over raw.githubusercontent.com at ref 'main', HTTP 200. NO COMMIT SHA
      PINNED. KN-LIT-7619 is the corpus's record of this repository and
      states explicitly that "Code contents were not fetched or audited";
      this proposal is the first record here that reads them.
    - >-
      FAEST v2.0 SPECIFICATION: NOT READ. Whether the specification's
      soundness or zero-knowledge analysis quantifies over the accepted set A
      or over the full space C is UNKNOWN TO THIS PROGRAM and is the audit's
