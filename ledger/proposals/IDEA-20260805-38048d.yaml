idea:
  id: IDEA-20260805-38048d
  question_id: RQ-FAEST-001
  added: '2026-08-05'
  title: >-
    FAEST's Fiat-Shamir challenge is not uniform: the bAVC opening-size
    filter (nh - 2*tau + 1 <= T_open) conditions the challenge space, and
    the conditioning is adversarially selectable because pos_in_tree
    interleaves the tau instances
  class: mechanism

  claim: >-
    FAEST's signing loop does not accept every Fiat-Shamir challenge. The
    reference implementation's bavc_open() computes nh, the number of nodes
    on the union of the root-paths of the tau hidden leaves, and RETURNS
    FALSE -- rejecting the challenge and forcing the signer to re-grind --
    whenever nh - 2*tau + 1 > T_open (VERIFIED THIS SESSION, faest-ref
    bavc.c, Steps 5-17). Two consequences follow, and neither is recorded
    anywhere in this corpus.
    (A) THE PUBLISHED CHALLENGE DISTRIBUTION IS CONDITIONAL, NOT UNIFORM.
    Every honest FAEST signature carries a challenge drawn uniformly from
    the ACCEPTED set A = {c : revealed(c) <= T_open}, not from the full
    space C. If the security analysis models the challenge as uniform on C,
    there is a distribution gap of exactly the conditioning, and any
    simulator that samples uniformly on C produces transcripts an
    adversary can distinguish by recomputing revealed(c) -- a check that
    costs one tree walk.
    (B) THE CONDITIONING IS ADVERSARIALLY SELECTABLE. pos_in_tree()
    INTERLEAVES the tau instances across the leaf array: instance i's index
    j lands at leaf slot tau*j + i for j < 2^{k-1}. Hence a challenge whose
    components are all EQUAL puts the tau hidden leaves at tau CONSECUTIVE
    leaf slots, where the root-paths merge almost completely and
    revealed(c) is minimal; a challenge with spread components puts them in
    disjoint subtrees where revealed(c) is maximal. Acceptance is therefore
    a strongly non-uniform function of the challenge, and a forger who gets
    to CHOOSE some challenge components (the partial-cheating strategy every
    MPCitH forgery model uses) can choose them to sit near the others,
    raising its per-attempt acceptance probability above the average rho.
    The quantity
      G = max over (subset J of instances, values on J) of
          Pr[c in A | c_J fixed] / Pr[c in A]
    is a pure combinatorial number, computable exactly from the tree shape
    with no cryptography, and log2(G) is the number of bits by which a
    partial-cheating forgery model that assumes a uniform challenge
    UNDERSTATES the adversary. NO RECORD IN THIS CORPUS COMPUTES rho OR G,
    and neither number appears in any FAEST proposal.
    THIS PROPOSAL CLAIMS NO FORGERY. It claims that two named numbers are
    missing, that both are cheap, and that one of them can only move in the
    adversary's favour.

  object_first_candidate:
    tracked_object: >-
      The ENTROPY BUDGET of one Fiat-Shamir challenge, followed as a single
      object through three stages of the signer: (1) it is minted as
      lambda - w_grind bits of index entropy spread over tau instances;
      (2) it is mapped by pos_in_tree into a set of tau leaf positions in
      one GGM tree; (3) it is FILTERED by the opening-size predicate
      revealed(c) = |union of root-paths| - 2*tau + 1 <= T_open. The tracked
      quantity at every stage is the scalar revealed(c), and its
      distribution over the challenge space is the object.
    established_families_off_limits: >-
      Off-limits as the primary lens: Schwartz-Zippel/soundness-error
      analysis of the consistency check (owned by IDEA-20260731-019),
      commitment collision and binding analysis (IDEA-20260731-003), QROM
      extractor-loss reconstruction (IDEA-20260731-004), algebraic solving
      of the AES constraint system (IDEA-20260731-005), and the
      (kappa, tau) grinding cost model itself (IDEA-20260731-002). This
      proposal touches none of their objects. Its object is the
      OPENING-SIZE FILTER, which none of them names, and which was
      unavailable to all of them because they were written while the
      parameter blocker RSF-5 was open.
    newness_score: >-
      Rejection sampling in a signature scheme is not new (Lyubashevsky's
      rejection sampling is the canonical instance, RECALLED-UNVERIFIED as
      to exact reference). What appears to be absent, and what this proposal
      supplies, is the observation that FAEST's rejection predicate is a
      function of the CHALLENGE rather than of the signer's randomness, and
      that pos_in_tree's interleaving makes the accepted region strongly
      structured in a way an adversary who chooses challenge components can
      exploit. NO CLAIM IS MADE THAT THE FAEST TEAM OVERLOOKED THIS: the
      specification has not been read, the analysis may well treat A
      correctly, and the audit's first stage is to find out.
    testability_score: >-
      Very high, and pure Python with no dependencies: the whole object is a
      binary heap of 2L - 1 <= 2*22528 - 1 nodes and a set-union count.
      Monte Carlo over 10^6 challenges is seconds; the graded T_open sweep
      is the same loop.
    survival_score: >-
      The mechanism (a conditional challenge distribution) survives with
      near-certainty because it is read off the code. What may not survive
      is its SIZE: if revealed(c) never exceeds T_open the filter is vacuous,
      rho = 1, G = 1, and the whole lane closes in one run. That is the
      declared cheapest kill and it is stage 2.

  mechanism: >-
    ALL STRUCTURAL FACTS BELOW WERE READ FROM faest-ref SOURCE BY THIS
    SESSION on 2026-08-06 (files bavc.c, instances.c, instances.h,
    meson.build, fetched over raw.githubusercontent.com, HTTP 200, from the
    MOVING ref 'main' -- NO COMMIT SHA WAS PINNED, and pinning one is stage
    0). The FAEST SPECIFICATION PDF WAS NOT READ; every statement about what
    the SECURITY ANALYSIS does or does not assume is an OPEN QUESTION here,
    never an assertion.

    (1) THE PARAMETER MACROS, AND AN EXACT ENTROPY IDENTITY.
    instances.c defines, for each set:
      k     = floor((lambda - w_grind) / tau) + 1
      tau1  = (lambda - w_grind) mod tau
      tau0  = tau - tau1
      L     = tau1 * 2^k + tau0 * 2^{k-1}
    Instance i has N_i = 2^k leaves for i < tau1 and 2^{k-1} otherwise, so
      log2|C| = tau1 * k + tau0 * (k - 1)
              = tau * (k - 1) + tau1
              = tau * floor((lambda - w_grind)/tau) + ((lambda - w_grind) mod tau)
              = lambda - w_grind,   EXACTLY, for every parameter set.
    Hence log2|C| + w_grind = lambda IDENTICALLY: the grinding bits are
    exactly the entropy the index space gives up. This is a theorem about
    the macros, not a coincidence of the tables, and it is the FORCED VALUE
    against which any transcription of the specification's parameter table
    can be checked in one line. Worked instances from the verified table:
    faest_128f (lambda 128, tau 16, w_grind 8) gives k = 8, tau1 = 8,
    tau0 = 8, L = 8*256 + 8*128 = 3072, log2|C| = 8*8 + 8*7 = 120 = 128 - 8;
    faest_128s (tau 11, w_grind 7) gives k = 12, tau1 = 0, tau0 = 11,
    L = 11*2048 = 22528, log2|C| = 11*11 = 121 = 128 - 7.

    (2) THE OPENING-SIZE PREDICATE, DERIVED AND MATCHED TO THE CODE.
    bavc_open() marks, for each instance i, the node alpha =
    pos_in_tree(i, i_delta[i]) and every ancestor not already marked,
    counting nh marked nodes. Let S be that marked set: a subtree containing
    the root whose leaf set is exactly the tau hidden positions. Counting by
    branching type, S has tau leaves, tau - 1 nodes with two children in S,
    and therefore |S| - tau - (tau - 1) = |S| - 2*tau + 1 nodes with exactly
    one child in S. The opening publishes precisely the OTHER child of each
    of those, so
      revealed(c) = nh - 2*tau + 1,
    which is exactly the quantity bavc.c compares against T_open at Step
    16-17 ("if (nh - 2*tau + 1 > params->T_open) return false"). The decoder
    (reconstruct_keys) reads exactly T_open node slots and requires the
    unused tail to be zero, so T_open is enforced on both sides.

    (3) WHY THE FILTER IS NOT SYMMETRIC: pos_in_tree INTERLEAVES.
      pos_in_tree(i, j) = L - 1 + tau*j + i                    for j < 2^{k-1}
                        = L - 1 + tau*2^{k-1} + tau1*(j mod 2^{k-1}) + i
                                                               otherwise.
    So instance i's index j occupies leaf SLOT tau*j + i in the low range.
    Take all i_delta[i] = j with j < 2^{k-1}: the tau hidden leaves occupy
    slots tau*j, ..., tau*j + tau - 1, i.e. tau CONSECUTIVE leaves. For
    faest_128f (tau = 16) sixteen consecutive leaves aligned to a 16-boundary
    lie under one common ancestor four levels above the leaf level, giving
    |S| ~ (depth - 4) + 31 and revealed(c) ~ 8. Take instead sixteen indices
    spread over the range: the paths separate at the top and revealed(c)
    approaches its maximum, which for L = 3072 (leaf depths 11 and 12) and
    tau = 16 is bounded above by (1+2+4+8) + 16*9 - 31 = 128 by the same
    count. THE DEPLOYED T_open FOR faest_128f IS 110, STRICTLY BETWEEN THOSE
    ENDPOINTS. Therefore, IF the derivation is right, the rejection branch
    is live, rho = Pr[revealed <= T_open] is strictly between 0 and 1, and
    the accepted set A is a proper, highly structured subset of C. If the
    derivation is wrong -- if the true maximum is <= T_open -- the branch is
    dead code, rho = 1, and the lane closes; that is a genuine falsifier and
    it is stage 2.

    (4) THE TWO CONSEQUENCES, WITH THEIR COST BOOKKEEPING.
    (A) SIGNER COST AND TRANSCRIPT DISTRIBUTION. The signer must satisfy
    both the w_grind proof-of-work and acceptance, so the expected number of
    counter iterations is 2^{w_grind} / rho -- for faest_128f, 256/rho hash
    evaluations per signature. That is a performance number nobody here has,
    and it is also the statistical statement: the published challenge is
    uniform on A, not on C. The simulability question follows and is a
    QUANTIFIER question, not a cost question: does the simulator sample from
    A? If it samples from C, the distinguisher is "compute revealed(c) and
    reject if > T_open", which costs one tree walk and succeeds with
    advantage 1 - rho.
    (B) FORGER ADVANTAGE, PER-ATTEMPT COST TIMES INVERSE SUCCESS
    PROBABILITY. A partial-cheating forger fixes challenge components on a
    subset J (the instances it cheats in) and lets the hash choose the rest.
    Its per-attempt success probability is
      Pr[hash hits the fixed components] * Pr[accept | c_J fixed],
    while a model that assumes a uniform challenge charges
      Pr[hash hits] * rho.
    The ratio is exactly G = max_{J, values} Pr[accept | c_J] / rho, and by
    (3) the maximising choice is transparent: put the cheated components at
    indices whose leaf slots cluster with the others. G >= 1 always, and
    G > 1 unless acceptance is independent of every individual component --
    which the interleaving makes implausible. log2(G) is the number of bits
    the uniform-challenge model gives away. IT IS A NUMBER, IT IS SMALL OR
    ZERO OR LARGE, AND NOBODY HAS COMPUTED IT.

    (5) WHAT THIS IS NOT. It is not a claim that FAEST is broken, not a
    forgery, and not a claim about the specification's analysis, which has
    not been read. It is the identification of two computable quantities
    that the goal's own numbered-chain reconstruction needs and does not
    have, one of which (G) can only move the accounting toward the
    adversary.

  novelty_status: unverified

  literature_context:
