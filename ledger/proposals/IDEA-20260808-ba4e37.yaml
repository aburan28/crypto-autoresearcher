idea:
  id: IDEA-20260808-ba4e37
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ECTD-001
  goal_id: GOAL-ECTD-001
  title: 'CM self-pairings live on the CURVE torsor, not on the point group: the recent class-group
    self-pairing machinery gives a genuine trapdoor-DDH candidate for the ordinary class-group
    action, and provably none for DDH on G, because a DDH-solver on a cyclic G would be a
    non-degenerate pairing G x G -> mu_N which alternation forbids unless the embedding degree
    is 1 - so GOAL-ECTD-001''s priority (4) should be RESTATED, not abandoned'
  class: mechanism
  claim: '(A) THE TWO DDH PROBLEMS, SEPARATED. (i) POINT DDH: given (P, [a]P, [b]P, [c]P)
    in G of prime order N, decide c = ab. (ii) CLASS-ACTION DDH: given curves (E, a*E, b*E,
    c*E) in an F_p-isogeny class with the Cl(O)-action, decide c = ab. These are different
    problems on different objects, and this campaign''s priority (4) does not currently say
    which one it means. (B) POINT DDH IS CLOSED, WITH A ONE-LINE OBSTRUCTION. A map solving
    point DDH by evaluation is, in the standard formulation, a non-degenerate bilinear e :
    G x G -> mu_N. The Weil pairing is ALTERNATING, so it vanishes identically on G x G for
    cyclic G; the Tate-Lichtenbaum pairing is non-degenerate only after passing to F_{p^{k_emb}},
    and lands in mu_N there. So a pairing usable over F_p exists iff k_emb = 1 iff N | p -
    1 - the same degenerate cell as slice records E3-04 and E3-06 reach by different routes.
    A SECRET does not help: the pairing''s existence is a property of (N, p), both public,
    so there is nothing for a designer to hide. Point-DDH trapdoors on ordinary prime-field
    curves are therefore closed by publicness, not by difficulty. (C) CLASS-ACTION DDH IS
    OPEN AND IS WHERE THE RECENT MACHINERY BITES. The corpus already holds KN-LIT-7489 (Castryck,
    Houben, Merz and coauthors, "Weak instances of class group action based cryptography via
    self-pairings"), which constructs self-pairings on ORIENTED curves from the structure
    of the discriminant and uses them to break vectorization for special discriminants [corpus
    reference; the paper itself was NOT verified this session]. Ordinary prime-field curves
    are canonically oriented by End(E) = O, so the machinery applies to them directly. Its
    output is a pairing on the class torsor: it evaluates on CURVES, which is exactly problem
    (ii). (D) THE TRAPDOOR SHAPE THAT SURVIVES, STATED SO IT CAN FAIL. A designer chooses
    D with a self-pairing-friendly structure, publishes an ordinary class as the group-action
    domain, and retains the self-pairing evaluation as a private DDH distinguisher; the public
    may not evaluate it because doing so requires knowing End(E) exactly (Bisson-Sutherland,
    subexponential) or knowing the discriminant structure the designer chose. THE FALSIFIABLE
    CORE: is the self-pairing''s evaluability actually asymmetric between designer and public,
    or is it computable from D alone - and D is public, being determined by t? The record
    predicts the latter (D is a class invariant, hence public, hence no asymmetry) and therefore
    predicts the trapdoor FAILS - but this is a genuine prediction that a cheap computation
    decides, and if it fails the other way the campaign gets its first surviving trapdoor
    candidate. (E) WHAT MUST NOT BE CONCLUDED. Nothing here threatens ECDLP, and a class-action
    DDH trapdoor is a different primitive from the one GOAL-ECTD-001 was chartered for. The
    record''s recommendation is to RESTATE priority (4) as class-action DDH, or to record
    priority (4) as closed for point DDH with the obstruction in (B) - not to quietly drop
    it.'
  mechanism: A pairing is a bilinear form, and a bilinear form on a cyclic group is forced
    to be trivial by alternation; the only escape is to leave the base field, and the size
    of the required extension is a public function of (N, p). By contrast the class torsor
    is a Cl(O)-set with a rich quadratic structure coming from the discriminant, and self-pairings
    there are genuinely non-trivial. The separation is between a group of prime order with
    a one-dimensional endomorphism algebra and a torsor under a group with a quadratic form
    on it.
  why_not_a_renamed_known_approach: 'Nearest known: MOV/Frey-Ruck (KN-TECH-032), which is
    exactly the k_emb statement in (B) and is classical. Nearest corpus records: IDEA-20260807-464ff8
    (distortion maps for G) and IDEA-20260807-30868b (a one-point CM self-pairing on G) both
    close the POINT side. This record''s contribution is not the point-side closure - which
    it cites - but the SEPARATION: it identifies that the recent self-pairing literature,
    which this program already holds as KN-LIT-7489 and has so far applied only on the supersingular
    side (IDEA-20260806-b7fdc3, RQ-SSI-001), lands on the class torsor of ORDINARY prime-field
    curves and therefore speaks to GOAL-ECTD-001''s priority (4) rather than to its ECDLP
    core.'
  predictions:
  - observable: publicness of the self-pairing's input data
    metric: for toy ordinary classes, whether the discriminant data the self-pairing construction
      requires is a function of t alone (hence public) or requires knowledge of End(E) beyond
      the class
    predicted: a function of t alone in every tested instance, hence public, hence no designer/public
      asymmetry and no trapdoor. A single instance requiring curve-level (not class-level)
      data would falsify this and reopen (D)
  - observable: point-dependence of self-pairing values
    metric: the self-pairing value computed for a curve E' in the class, recomputed with a
      different distinguished point P of the same order
    predicted: identical (the value depends on the curve, not the point), in 100% of instances;
      point-dependence would be a major positive result and would contradict (B)
  - observable: class-action DDH distinguishing power
    metric: on a toy class where the self-pairing is non-trivial, the advantage of the self-pairing
      distinguisher over guessing on class-action DDH tuples
    predicted: advantage bounded away from 0 (the machinery works on the class side); this
      is the positive half and it must be demonstrated or the whole record's (C) is empty
  minimal_test: Toy, three parts, each cheap. (i) On 5-10 toy ordinary classes, determine
    whether the self-pairing construction's inputs are computable from t alone; record the
    determination with the computation. (ii) Evaluate the self-pairing on each curve of one
    small class, twice per curve with two different distinguished points, and check point-independence.
    (iii) Build 50 class-action DDH tuples in that class and measure the distinguisher's advantage
    against a matched null in which the tuple is random. Part (i) alone decides the trapdoor
    question and needs no code beyond discriminant arithmetic.
  controls:
  - 'NULL TUPLES: class-action DDH tuples with c chosen at random must give distinguisher
    advantage indistinguishable from 0. If the distinguisher "succeeds" on random tuples it
    is reading the sampler, not the pairing.'
  - 'POINT-SIDE NEGATIVE CONTROL: attempt to build a point-DDH distinguisher from the same
    machinery on a curve with k_emb > 1. It must fail. This is the control that separates
    (B) from (C) empirically rather than by assertion.'
  - 'DISCRIMINANT CONTROL: run on a class whose discriminant does NOT have the structure the
    self-pairing needs; the pairing must be degenerate there, confirming the construction
    is doing the work.'
  confounders:
  - Toy class groups are small, so a distinguisher can succeed by exhaustive search rather
    than by the pairing. The distinguisher must be constrained to a number of action evaluations
    far below h.
  - KN-LIT-7489's construction was NOT read this session; the record may be mis-stating what
    its inputs are. Part (i) of the test is written so that it also verifies the construction's
    input list, and the record's conclusions are conditional on that verification.
  - '"Oriented" in the supersingular literature and "canonically oriented by End(E)" for ordinary
    curves are related but not identical notions; the transfer must be checked, not assumed.'
  falsification_conditions:
  - 'Self-pairing inputs requiring curve-level data not determined by t: prediction 1 fails,
    a designer/public asymmetry may exist, and priority (4) reopens with a concrete candidate.
    This is the outcome that would make the record valuable in the positive direction.'
  - 'Any point-dependence of a self-pairing value: (B) is wrong.'
  - 'Zero distinguishing advantage on the class side even with a favourable discriminant:
    (C) is empty and the record reduces to the point-side closure alone.'
  interpretation_limits: The entire (C)/(D) half rests on a paper this session could not read.
    Everything asserted about KN-LIT-7489 is flagged and is to be replaced by a direct reading
    before any conclusion is drawn; the record's own minimal test includes verifying the construction's
    inputs for exactly that reason. Nothing here threatens ECDLP or any deployed curve. Toy
    scale.
  assumptions:
  - Alternation of the Weil pairing (hence triviality on a cyclic subgroup) [recall-confident,
    standard].
  - Tate-Lichtenbaum non-degeneracy requires F_{p^{k_emb}}; k_emb = ord_N(p) [corpus, KN-TECH-032;
    and E3-04's Balasubramanian-Koblitz input].
  - D = t^2 - 4p and D_0 are class invariants, hence public [corpus, DECOMPOSITION.md T4].
  - KN-LIT-7489 constructs self-pairings on oriented curves from discriminant structure [corpus
    reference; the paper NOT read this session].
  heuristic_assumptions:
  - id: HA-1
    statement: It is assumed that the self-pairing construction of KN-LIT-7489 transfers to
      ordinary curves over F_p canonically oriented by End_{F_p}(E), with the same input requirements.
      This is a TRANSFER assumption across a setting boundary (supersingular oriented curves
      to ordinary curves) and is the record's largest exposure.
    rigorous_ingredient: Ordinary curves over F_p are canonically O-oriented with O = End(E);
      the class group acts simply transitively on each level set. These are standard facts
      and are not in doubt; what is assumed is that the pairing construction only uses them.
    distribution_imitated: not_applicable
    validation_route: Read KN-LIT-7489 directly when web/corpus access permits, and verify
      the input list on 5-10 toy ordinary classes as part (i) of the minimal test. Until then
      no conclusion may be drawn from (C) or (D).
    tail_checks: not_applicable
  - id: HA-2
    statement: 'For the point-side closure only: it is assumed that every efficient point-DDH
      distinguisher on a cyclic group of prime order is, up to polynomial-time reduction,
      a non-degenerate bilinear pairing. This is a modelling assumption and is FALSE in full
      generality (a distinguisher need not be bilinear), so the point-side closure is stated
      for the pairing-shaped family only.'
    rigorous_ingredient: Alternation of the Weil pairing; the classification of bilinear forms
      on a cyclic group.
    distribution_imitated: not_applicable
    validation_route: None available - this is a scope limitation, honestly recorded. The
      record does NOT claim point DDH is hard; it claims the pairing-shaped trapdoor family
      is closed by publicness.
    tail_checks: not_applicable
  target_complexity:
    time_exponent: No ECDLP exponent claimed or moved. On the class side, a working self-pairing
      distinguisher would solve class-action DDH in polynomial time where the best generic
      attack is sqrt(h) = p^{1/4} - an exponent statement about a different problem, and stated
      as such.
    memory_exponent: Polynomial for the distinguisher; p^{1/4}-with-memory-w for the generic
      class-action baseline via van Oorschot-Wiener on the action.
    best_known_baseline: 'For class-action DDH: sqrt(h) = p^{1/4} generic (KN-TECH-027 analogue).
      For point DDH on G: no better than ECDLP itself, 0.886 sqrt(N).'
    hidden_overhead_disclosure: Computing Cl(O) at crypto scale is subexponential; any class-side
      statement inherits that cost, which is not hidden inside an o(1) here because it is
      stated as a precondition.
    time_memory_tradeoff: Not applicable to the pairing evaluation; the generic class-side
      baseline carries the usual kangaroo interpolation.
  sota_delta: 'Zero against ECDLP. Against GOAL-ECTD-001''s priority (4): converts an unstated
    ambiguity into two problems, closes one of them for the pairing-shaped family by publicness,
    and identifies a concrete external ingredient already in this corpus for the other.'
  dominated_by: n/a for ECDLP (no result claimed); frontier rows checked as in E3-07 and none
    approached. For class-action DDH the generic sqrt(h) = p^{1/4} attack dominates any negative
    result here and would be dominated by a working self-pairing distinguisher - which this
    record does not claim to have.
  estimated_cost: 'Implementation: medium (needs the self-pairing construction implemented
    on ordinary classes; the class-action harness is shared with E3-07). Compute: low. Literature:
    BLOCKED until web/corpus reading of KN-LIT-7489 is possible - this is the gating cost.'
  recommended_priority: medium
  honest_prior_of_survival: 0.85 that the point-side closure (B) holds as stated for the pairing-shaped
    family. 0.6 that the class-side machinery transfers to ordinary curves at all (HA-1 is
    a real exposure). 0.15 that a designer/public asymmetry survives part (i) and yields a
    genuine trapdoor candidate. Priority is medium rather than high because the record is
    literature-blocked and the most likely outcome is a restatement rather than a candidate.
  novelty_status: unverified
  novelty_screen: Same screen as E3-07, plus targeted reads of IDEA-20260807-464ff8 and IDEA-20260807-30868b
    (point-side pairing closures), IDEA-20260807-b92080 (embedding degree is a class invariant),
