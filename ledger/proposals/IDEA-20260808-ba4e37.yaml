  discriminated_from: IDEA-20260731-018 closes a private DDH predicate derived from a secret
    isogeny CHAIN; this record concerns a predicate derived from discriminant structure and
    separates the point and class problems, which 018 does not. IDEA-20260807-30868b closes
    CM self-pairings computable from ONE point on G; this record agrees and adds the class-side
    alternative, which 30868b does not consider. IDEA-20260806-b7fdc3 applies KN-LIT-7489
    to supersingular class-group cryptography; this record applies it to ordinary prime-field
    classes and to a trapdoor question, a different goal and a different setting.
