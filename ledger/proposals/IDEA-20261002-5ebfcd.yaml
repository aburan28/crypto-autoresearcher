idea:
  id: IDEA-20261002-5ebfcd
  question_id: RQ-BINSTD-b6f698
  added: '2026-10-02'
  status: proposed
  approved_by: null
  title: >-
    IS ONE n−1 DECOMPOSITION ATTEMPT CHEAPER THAN TWO CHAINED S_3 ATTEMPTS
    AT TOY BINARY CELLS? On n∈{17,19} with frozen ℓ∈{3}, compare median wall
    time of one Joux–Vitse-style n−1 decomposition attempt to two chained S_3
    attempts under a shared encoder/solver pin; test ≥2× cheaper or not.

  class: heuristic_validation

  claim: >-
    KR-IC-081a58 states that decomposing into n−1 points over F_{q^n} has a
    published cost formula and beats rho only for n≥5 asymptotically; it does
    not freeze a toy head-to-head wall-time band against chained S_3 on
    binary cells. CLAIM: at each toy cell (n,ℓ)∈{17,19}×{3}, over ≥20
    independent targets, median wall time of one n−1 decomposition attempt
    is ≤ (1/2)·median wall time of two chained S_3 attempts under the same
    pin — OR the ≥2× band fails and is recorded as n-1-not-cheaper-than-
    chained-S3 at this scale. CLAIM TIER: heuristic_validation. NO break.
    NO exponent. NO n≥131 transfer. Distinct from IDEA-20261001-161102
    (S_4 vs two S_3), 3f2d06 / 5c936b (solver races), and 99487f (halving
    reduction).

  mechanism: >-
    OBJECT FRAME. Representation: FB {P : x(P)∈V} with fixed dim ℓ=3;
    Operation A: one n−1 decomposition attempt (KR-IC-081a58 / KR-IC-46d822
    family); Operation B: two chained S_3 attempts (KR-IC-5a43e5); Observable:
    median wall-time ratio T_{n−1} / (2·T_{S3}) under a shared encoder/solver
    pin. Trichotomy: Class I instrument (attempt-cost meter). Lossy-projection:
    wall time discards which polynomial path dominates; null is a matched
    random Boolean system of the same N_var solved twice whose ratio is
    independent of Semaev structure. OFF-LIMITS: S_4 vs two S_3 (161102);
    Crossbred/Karabina engine races; torsion/halving reductions (99487f).
    WHAT IS NEW: a frozen ≥2× band for n−1 vs chained S_3 at RQ-BINSTD toys.

  novelty_status: unverified
