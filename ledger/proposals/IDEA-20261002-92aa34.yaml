  assumptions:
    - Frozen ℓ, α, seeds, encoder pin, and Karabina transform definition.
    - Encoder / symmetrisation path already admitted or cell is
      failed_infrastructure (do not provision).
    - Residue density ≠ wall-time race ≠ torsion cost ratio.
    - C_nl/N_var ≤ α ≠ practical binary IC (KR-IC-1fcdbc).

  heuristic_assumptions:
    - id: HEUR-BINSTD-92aa34-H1
      formal_statement: >-
        FORALL (n,ℓ)∈{17,19,23}×{3,4}: across ≥20 independent targets,
        median C_nl / N_var after Karabina symmetrisation ≤ α with α
        frozen at Stage 0.
      random_model_justification: >-
        Rigorous: KR-IC-8b9daa / KR-IC-955fd6 argue that symmetric
        coordinates remove redundant monomials from the descended system.
        Classical: if the remaining system is near-linear after the
        change of variables, residual nonlinear density is bounded by a
        small α independent of n at fixed ℓ; if hidden high-degree
        structure survives, the band fails. The α band is the
        pre-registered transfer hypothesis at toys — not a claim that
        symmetrisation beats rho.
      supporting_results:
        - KR-IC-8b9daa
        - KR-IC-955fd6
        - KR-IC-1fcdbc
      validation_experiment_ids: []
      falsification_condition: >-
        Median C_nl/N_var > α at a completed cell
        (symmetrisation-leaves-dense-nonlinear-residue), OR encoder /
        transform absent (infrastructure stop), OR fewer than 20
        completed targets after the budgeted catalog (inconclusive;
        expand or stop).

  predictions:
    - metric: median_Cnl_over_Nvar
      direction: upper_bounded
      minimum_effect: '≤ α at each (n,ℓ) cell'
    - metric: completed_target_count
      direction: lower_bounded
      minimum_effect: '≥ 20 targets per cell'
    - metric: null_unsymmetrised_Cnl_over_Nvar
      direction: larger_or_equal
      minimum_effect: 'null median ≥ treated median (symmetrisation does not increase density)'

  minimal_test: >-
    Stage 0: freeze ℓ∈{3,4}, α, seeds, encoder pin, Karabina transform.
    Stage 1: n=17 — ≥20 targets; report median C_nl/N_var.
    Stage 2: n∈{19,23} + unsymmetrised null. Budget: ≤6 CPU-hours.
    Stop if encoder / transform absent (IMP, never evidence; do not provision).

  controls:
    - ctl_frozen_alpha
    - ctl_shared_encoder_pin
    - null_unsymmetrised_encode
    - ctl_no_posthoc_alpha_edit
    - ctl_no_midtick_lib_provision
    - ctl_no_solver_bakeoff

  falsification_conditions:
    - Claiming practical binary IC from a toy residue-density band.
    - Equating this meter with a Karabina vs XOR-SAT wall-time race (5c936b).
    - Editing α after seeing densities.
    - Transferring the band to n≥131 without a new contract.
    - Counting linear Trace clauses as nonlinear residue.

