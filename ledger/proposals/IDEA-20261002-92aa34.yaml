idea:
  id: IDEA-20261002-92aa34
  question_id: RQ-BINSTD-b6f698
  added: '2026-10-02'
  status: proposed
  approved_by: null
  title: >-
    AFTER KARABINA SYMMETRISATION, DOES RESIDUAL NONLINEAR CLAUSE DENSITY
    STAY ≤ α·N_var? On binary toys n∈{17,19,23} with frozen ℓ∈{3,4}, encode
    S_3 PDP once with a shared pin, apply the Karabina symmetric-function
    reformulation, and test whether residual nonlinear clause count
    C_nl ≤ α·N_var with α frozen.

  class: heuristic_validation

  claim: >-
    KR-IC-8b9daa states that Karabina's symmetric-function / Weil-restriction
    reformulation reduces binary-curve PDP cost by a constant/polynomial
    factor; it does not freeze a residual nonlinear-clause density band
    C_nl / N_var ≤ α on toy cells. CLAIM: for each (n,ℓ)∈{17,19,23}×{3,4},
    across ≥20 independent targets under a shared encoder pin, median
    C_nl / N_var ≤ α with α frozen at Stage 0 — OR the band fails and is
    recorded as symmetrisation-leaves-dense-nonlinear-residue at this scale.
    CLAIM TIER: heuristic_validation. NO break. NO exponent. NO n≥131
    transfer. Distinct from IDEA-20261001-5c936b (Karabina vs XOR-SAT wall-
    time race), 99487f (2-torsion/halving ≥2× cost cut), and 878222
    (Trace-linear rank → clause count without symmetrisation).

  mechanism: >-
    OBJECT FRAME. Representation: FB {P : x(P)∈V} with fixed dim ℓ;
    Operation: encode descended S_3 PDP, apply Karabina symmetric-function
    change of variables (KR-IC-8b9daa / KR-IC-955fd6), count residual
    nonlinear clauses C_nl and variables N_var; Observable: median
    C_nl / N_var. Trichotomy: Class I instrument (post-symmetrisation
    residue meter). Lossy-projection: density discards which clauses are
    hard; null is the same encode without the symmetric change of
    variables, for which the α band is not claimed. OFF-LIMITS: solver
    bake-offs (5c936b / 3f2d06); torsion/halving cost ratios (99487f);
    Trace-linear predictors without symmetrisation (878222). WHAT IS NEW:
    a frozen α residual-density band after Karabina symmetrisation only.

  novelty_status: unverified
