idea:
  id: IDEA-20260905-7e154b
  title: 'Arithmetic characters of the curve group: representation-theoretic intake'
  question_id: RQ-CRYPTO-001
  goal_id: GOAL-CRYPTO-001
  added: '2026-09-05'
  status: proposed
  proposed_by: user
  recorded_by: coordinator
  task_id: TASK-20260905-755297
  class: representation
  claim: 'User conjecture: arithmetic structure might make a useful nontrivial group character accessible without
    already solving the discrete logarithm. No evaluator, output representation, decoding bound or speedup
    is supplied; these are the uncertainties to specify.'
  mechanism: Study homomorphisms from a finite curve subgroup into roots of unity, separating the existence
    of a character from its efficient evaluation and usable output encoding. Characters form a basis for complex-valued
    functions on a finite abelian group; that fact alone supplies neither the coefficients of a logarithm-related
    function nor an efficient inversion procedure. Arithmetic construction and information content are separate
    obligations.
  novelty_status: unverified
  source:
    kind: user_message
    verbatim: What if you drop it entirely and go after the group’s representation theory instead? The multiplicative
      characters of the curve group are a complete basis, and the discrete log is a linear functional in that
      basis. Nobody’s found a way to compute a single character cheaply, but I’ve never seen a serious argument
      that it’s impossible for special characters attached to the curve’s arithmetic — Tate pairings give you
      some, and those got used for MOV, but only in the degenerate small-embedding-degree case.
    complete: true
    missing_text: null
    editorial_note: Claim, controls and caveats are Coordinator intake annotations, not additional user assertions.
  design_readiness:
    ready: false
    approved_by: null
    reason: Character and output interface remain unspecified.
