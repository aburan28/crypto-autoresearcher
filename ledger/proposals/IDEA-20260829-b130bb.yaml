  minimal_test:
    design: >-
      STAGE 0, zero compute, hours of thought, AND IT IS THE CHEAPEST POSSIBLE
      FALSIFICATION. Complete C2's derivation to an if-and-only-if, including
      the degenerate branch 2 x^2 = 1 and the two sign choices, and write it
      out. If the only-if direction fails, the record dies at no machine cost
      and the failure itself tells every sibling record that exact valuations
      are not reachable by an Edwards symbol chain.
      STAGE 1, THE CHEAPEST VALID DISCRIMINATOR WITH COMPUTE, minutes, and it
      alone settles the instrument. THE CONSTRUCTED VALUATION LADDER. At a
      small prime, find by exhaustive search Edwards curves with true
      v_2 = 2, 3, 4 and 5 - they exist in abundance by the geometric
      distribution - and require the chain to return each EXACTLY. This is
      cheaper than a full census and it tests precisely the thing this record
      adds, namely the ability to tell 3 from 4. An instrument that has only
      ever returned 3 cannot certify 3.
      STAGE 2, minutes. THE EXHAUSTIVE CENSUS at four small primes, every d
      with chi(d) = -1, agreement reported per valuation bin; plus the
      chi(d) = +1 branch run separately to exhibit the predicted collisions.
      STAGE 3, seconds. Apply the frozen chain to
      (p = 2^414 - 17, d = 3617), emit the certificate, and apply the forcing
      theorem for the twist.
      STAGE 4, seconds. The six-row Edwards sweep and the eleven-row
      consistency sweep of C4.
      STAGE 5, minutes. The null control - 10^4 random d at the real p, chain
      only, for the terminal-length distribution.
    controls:
      - >-
        POSITIVE, BLOCKING, AND CONSTRUCTED - toy Edwards curves of known
        v_2 = 2, 3, 4 and 5. The chain must return each exactly. This is the
        control that tests the depth this record adds and nothing may proceed
        past it.
      - >-
        POSITIVE, SAME-p, AT FULL SIZE - Curve41417 itself is the family's
        only expected full-size positive firing of the depth-1 branch, which
        is why C1 makes this row the batch's control. Its depth-1 success at
        414 bits is one full-size input on which the positive branch is
        exercised.
      - >-
        DEGENERATE-INPUT CONTROL - a constructed toy curve with 2 x^2 = 1,
        exercising the declared degenerate branch, which must be handled
        explicitly and not by a caught exception silently reported as
        "not halvable".
      - >-
        NEGATIVE, MODEL-MATCHED - the five cofactor-4 Edwards rows at full
        size, identical code path, predicted to refuse at depth 1.
      - >-
        NEGATIVE, PARAMETER-MATCHED - d' = 3617 + k for the smallest k with
        chi(d') = +1 over the same p, which must be refused as not complete;
        and d'' the smallest value above 3617 with chi(d'') = -1 and
        chi(1 - d'') = -1, which must be refused at depth 1 while sharing the
        field and the code path.
      - >-
        NULL, SAME SHAPE - 10^4 uniformly random d at the real p through the
        identical chain, whose terminal-length distribution must be
        approximately geometric with P(v_2 = 2) near 1/2 and P(v_2 = 3) near
        1/4. THE DISCRIMINATOR AND ITS CONSEQUENCE - if v_2 = 3 occurs for
        about a quarter of random parameters at this prime, then Curve41417's
        cofactor 8 carries about two bits of design information and is not a
        structural surprise, and every record citing it must say so.
      - >-
        CROSS-IMPLEMENTATION - every Legendre symbol by Euler's criterion and
        by the binary Jacobi recursion; every square root by the (p + 1)/4
        fast path and by general Tonelli-Shanks, with each root verified by
        squaring. Disagreement voids the run.
      - >-
        CROSS-MODEL - IDEA-20260829-d052e6's Montgomery chain run on the
        converted (A, B) for every toy curve and for Curve41417, required to
        agree on the terminal valuation though not on the intermediate
        symbols. Disagreement localises the defect to the conversion.
    required_metrics:
      - 'the completed depth-2 derivation with its degenerate branch, as a frozen note'
      - 'per toy p, chain agreement fraction reported PER TRUE VALUATION BIN, with bin counts'
      - 'the constructed ladder results for v_2 = 2, 3, 4 and 5'
      - 'the exhibited collision pairs on the chi(d) = +1 branch'
      - 'for Curve41417, the full chain, its terminal length, s, and the derived v_2(#E^t)'
      - 'for the six Edwards rows, the depth-1 symbol and the refusal or firing outcome'
      - 'for the eleven complete rows, s and predicted versus published cofactor pairs'
      - 'the null terminal-length distribution over 10^4 random d at the real p, with seeds'
      - 'square-root verification transcripts and cross-implementation agreement rates'
      - 'wall clock per stage and the sha256 of every mirror file read'

  falsification_conditions:
    - >-
      The only-if direction of C2 fails in the Stage 0 derivation. The exact
      valuation is not reachable by this chain; the record is withdrawn and
      the failure is reported, since it tells every sibling record that
      published cofactors cannot be exactly derived by symbol chains in this
      environment.
    - >-
      Any toy curve on the chi(d) = -1 branch whose chain terminal length
      differs from its brute-force v_2, in any valuation bin. C2 is refuted as
      implemented; the 414-bit application is withdrawn and the
      counterexample is reported as a refutation artifact per
      docs/claims-and-verification.md.
    - >-
      The constructed ladder cannot produce a curve of some valuation, or the
      chain returns the same value for a v_2 = 3 curve and a v_2 = 4 curve.
      The instrument cannot do the one thing this record adds and nothing
      about Curve41417 is reported.
    - >-
      No collision found on the chi(d) = +1 branch across the whole census.
      The group-theoretic insufficiency argument inherited from
      IDEA-20260829-d052e6 is wrong and must be redone before any claim about
      the chain's reach is made.
    - >-
      chi(-3616) = -1 at p = 2^414 - 17. The family's only expected positive
      firing does not occur; either the published cofactor 2^3 is wrong or
      IDEA-20260829-b41d39's criterion is wrong, and the five sibling
      cofactor-4 verdicts lose their positive control. HALT AND ESCALATE -
      this is the single outcome in this batch most likely to invalidate
      several records at once.
    - >-
      The chain's terminal length for Curve41417 is not 3. This contradicts
      the published cofactor; a transcription or implementation error is far
      likelier than a finding and must be excluded first.
    - >-
      Any of the five cofactor-4 Edwards rows fires at depth 1 or 2. That
      row's published cofactor 2^2 is contradicted; halt and localise.
    - >-
      Any disagreement between the two Legendre implementations or the two
      square-root routines, or any square root that fails its verification
      squaring. Implementation failure; nothing is reported.

  confounders:
    - >-
      2-PART IS NOT COFACTOR. The chain certifies v_2(#E), not #E divided by
      the prime subgroup order. "Cofactor 8" additionally asserts that the odd
      part of #E divided by l is 1, which requires the odd part to be prime -
      a separate certificate this record does not supply and which
      IDEA-20260829-a40979's torsion sieve only partially approaches. Writing
      "cofactor 8 derived" without that qualifier is the most likely
      overstatement available here.
    - >-
      SIGN AND ROOT BOOKKEEPING. C2's chain involves two square roots, each
      with two roots, and a quadratic with two roots, so there are up to eight
      branches at depth 2. A rational preimage may exist on one branch and not
      another, so the criterion is an EXISTENTIAL over branches and an
      implementation that tries only one branch will report false negatives -
      which on this row would look exactly like a successful termination at
      depth 2 and would give the RIGHT ANSWER FOR THE WRONG REASON. Every
      branch must be enumerated and the count of branches tried must be
      reported.
    - >-
      WHICH CURVE IS THE TWIST. E_d is isomorphic to the B = 1 Montgomery
      curve when chi(1 - d) = +1 and to its twist otherwise. For Curve41417
      chi(1 - d) is predicted +1, so the cross-model control compares against
      the B = 1 curve; for the five cofactor-4 rows it is predicted -1 and the
      comparison must be against the TWIST. Getting this backwards would make
      the cross-model control disagree for a reason that has nothing to do
      with either chain.
    - >-
      TOY-SCALE ANOMALY RATE. At p near 2^13 to 2^20 degenerate curves -
      anomalous, supersingular, tiny order - are far commoner than at 414
      bits, as KN-TECH-033 states. The census must record how many toy curves
      are degenerate and must not let them dominate a bin.
    - >-
      A BIN WITH NO MEMBERS. A per-bin agreement fraction of 1.000 over zero
      members is not evidence. Every reported bin must carry its count and a
      bin below about 30 members must be labelled underpowered.
    - >-
      THE PUBLISHED TABLE DOES NOT CONTAIN THE ANSWER. SafeCurves' complete
      table reports two points of order 4 for every complete row, which is
      consistent with any cyclic 2-Sylow of order at least 4 and therefore
      cannot corroborate a depth-2 result. The only corroboration available is
      the cofactor cell in the twist table, which is a different page and a
      different transcription, and that independence should be stated as a
      small virtue rather than assumed.

  interpretation_limits:
    - >-
      A 2-adic valuation is not a security statement. It bounds the largest
      power-of-two small-subgroup confinement available in a chosen-input
      oracle model (KN-TECH-034, an ADJACENT-MODEL result) and says nothing
      about the ECDLP in the prime subgroup. Curve41417 having 2-part 8 rather
      than 4 is one extra bit of confinement in that model and nothing more.
    - >-
      THIS RECORD IS A BUILDING BLOCK AND SAYS SO. Its best case improves no
      exponent and moves no attack frontier; per agents/idea-generator.md's
      first search heuristic that would ordinarily make it low priority. It is
      recommended at medium-to-high priority ONLY because it is the blocking
      positive control for IDEA-20260829-b41d39 and hence for the five sibling
      Edwards records, and because without it every cofactor-4 verdict in this
      batch rests on an instrument never shown to fire.
    - >-
      C1 and C4 are finite observations against a published table; C3 is a
      per-instance certificate; C2's if-and-only-if is an obligation validated
      empirically at 13 to 20 bits and applied at 414, carried by heuristic H2
      with no rigorous support.
    - >-
      TRANSFER TO THE OTHER 19 CURVES, STATED EXACTLY. (a) THE CHAIN transfers
      FULLY to the other five untwisted Edwards rows but is PREDICTED TO
      REFUSE on all five at depth 1, so its transfer value there is as a
      negative control rather than as a measurement. (b) IT TRANSFERS AS A
      CONTROL to every record in this batch - once the chain has returned 2,
      3, 4 and 5 on constructed curves, IDEA-20260829-b41d39's depth-1
      criterion has a fired instrument behind it and the identically-shaped
      positive control in five sibling records becomes satisfiable. (c) IT
      DOES NOT TRANSFER to the Montgomery rows, where
      IDEA-20260829-d052e6's chain is the right instrument and this one would
      require a conversion; the cross-model control measures whether the two
      agree. (d) IT DOES NOT TRANSFER to twisted Edwards curves with a not 1,
      where the quartic and the quadratic must both be re-derived. (e) NO
      TRANSFER to any claim about the odd part, on any curve.
    - >-
      C4's statement that a cofactor pattern is forced is a statement about
      what was ACHIEVABLE on a given prime, not about what was intended. It
      does not diminish the design and it is not a criticism of it; it is an
      observation that one published cell is determined by another.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For p an odd prime and d drawn uniformly from the non-squares of F_p,
        the valuation v_2(#E_d) satisfies Pr[v_2 = 2 + j] = 2^{-(j+1)} for
        j at least 0, up to o(1) as p tends to infinity; that is, conditioned
        on the rigorous floor v_2 at least 2, the excess valuation is
        geometric with ratio one half, as it would be for the 2-part of a
        uniformly random integer in the Hasse interval conditioned on
        divisibility by 4.
      rigorous_support: >-
        Two rigorous halves. (i) The FLOOR v_2 at least 2 is proved
        unconditionally by IDEA-20260829-b41d39's C2 order-4 point and is not
        assumed. (ii) The FIRST STEP is rigorous - the symbol chi(1 - d) is
        equidistributed over d with density 1/2 + O(p^{-1/2}) by Weil's bound
        on character sums, so P(v_2 = 2) = 1/2 + O(p^{-1/2}) is a theorem, not
        a model. Only the deeper steps are modelled, and the classical
        statement being imitated is the Cohen-Lenstra and Gekeler-style
        heuristic that E(F_p) for varying E behaves like a random abelian
        group of its order, restricted to the 2-part. That heuristic is
        notoriously easier to state than to prove and the difficulty is
        recorded rather than hidden. NOTE THE SPECIFIC RELEVANCE HERE - the
        prediction P(v_2 = 3) near 1/4 is what makes the constructed ladder
        cheap, since a toy population of a few thousand curves will contain
        hundreds of every valuation up to about 5.
      validation_plan: >-
        SAMPLING - the exhaustive toy census gives the EXACT distribution of
        v_2 over all non-square d at four primes near 2^13 to 2^15, a complete
        population rather than a sample; plus 10^4 random d at the real
        414-bit prime for the terminal-length distribution. SCALE AND
        PARAMETERS RECORDED - the four primes, population sizes, and every
        seed. COMPARISON DISTRIBUTION - empirical CDF of v_2 - 2 against the
        geometric one-half CDF by an exact chi-square test on bins
        j = 0, 1, 2, 3 and 4-or-more with expected counts stated in advance;
        and the depth-1 marginal against the RIGOROUS interval
        1/2 plus or minus 2 p^{-1/2}, which is a proved bound. TAIL CHECK -
        the largest v_2 observed versus the predicted count p times
        2^{-(j+1)}; a population of about 10^4 should contain roughly one
        curve with v_2 at least 15 and none with v_2 at least 20. TRANSFER -
        validated at 13 to 20 bits and reported at 414 bits only as a NULL for
        interpreting Curve41417's v_2 = 3, never as a property of Curve41417.
    - id: H2
      statement: >-
        A halving chain whose output agrees with brute-force point counting on
        100 percent of an exhaustive toy population at 13 to 20 bits, in every
        valuation bin, is CORRECT at 414 bits; that is, the chain has no
        size-dependent failure mode - word size, overflow, modular reduction,
        square-root branch selection, or exponent range - first appearing
        above 20 bits.
      rigorous_support: >-
        NONE, and the record says so plainly. This is IDEA-20260829-d052e6's
        H2 and the archived plan's H4 inherited verbatim, and it is the
        weakest item here. It is WEAKER than in b41d39, because this chain
        computes square roots and enumerates up to eight sign branches rather
        than evaluating one symbol, so there is materially more code in which
        a size-dependent or branch-dependent defect could hide. That is a
        reason to weight the assumption more heavily against this record, not
        less, and it is stated that way. Partial mitigation, stated as
        mitigation and not as support - Python arbitrary-precision integers
        remove the word-size class of defect by construction, and every square
        root is verified by squaring at every size including 414 bits, so a
        wrong root is CAUGHT even though a wrong branch selection is not.
      validation_plan: >-
        Five partial checks, none of which discharges the assumption. (i) The
        per-bin exhaustive toy agreement, which must include bins 3 and 4 with
        at least 30 members each. (ii) Square-root verification by squaring at
        every size, and agreement between the (p + 1)/4 fast path and general
        Tonelli-Shanks at 414 bits on 10^4 inputs. (iii) Cross-implementation
        agreement of every Legendre symbol at 414 bits. (iv) Cross-model
        agreement with IDEA-20260829-d052e6's Montgomery chain on the terminal
        valuation at 414 bits, which is a full-size cross-instrument check by
        a structurally different route. (v) Agreement of the terminal value
        with the mirror's independently transcribed cofactor cell - a
        CONSISTENCY check between a derivation and a transcription, so if they
        agree neither is proved and if they disagree at least one is wrong,
        which is the informative case.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. As an audit instrument, O(v_2) square
      roots and O(v_2) Legendre symbols, that is about 3 v_2 modular
      exponentiations, hence O(log p) exponentiations in the worst case and
      O(log^3 p) bit operations with schoolbook arithmetic. Concretely at 414
      bits with the predicted v_2 = 3 this is about six exponentiations,
      microseconds to milliseconds in Python. Verification of the certificate
      by a second implementation is the same six exponentiations plus the
      squaring checks - succinct. This is about three times the cost of
      IDEA-20260829-b41d39's depth-1 test and buys exactly one additional bit
      of the valuation, which is the honest exchange rate and is stated
      rather than glossed.
    memory_exponent: >-
      O(log p) working memory and O(log p) certificate size. The toy census
      needs O(p) time and O(1) memory per curve and O(p^2) total across all d
      at a given p, which at p near 2^15 is about 10^9 elementary steps -
      minutes across the 14 available cores and the only nontrivial compute in
      this record. The 48 GB envelope is not a binding constraint anywhere.
    best_known: >-
      The best known route to an EXACT v_2 for an arbitrary 414-bit curve is a
      full SEA point count at roughly O(log^8 p) with large constants,
      unavailable in this environment. The best known route inside this
      program is IDEA-20260829-d052e6's Montgomery chain, which reaches the
      same depth in about a dozen exponentiations plus an unaudited birational
      conversion; this record reaches it in about six with no conversion, so
      it improves a CONSTANT FACTOR of roughly two and removes one unaudited
      step - a modest gain, disclosed as modest. The best known route for the
      VALUE is reading the mirror's cofactor cell, which is free and is the
      transcription this record replaces with a derivation. Against the ECDLP
      attack frontier - KN-TECH-001, KN-TECH-006, KN-TECH-018, KN-TECH-031,
      KN-TECH-032, KN-TECH-033, KN-TECH-035 - this record is dominated by
      every row because it is not an attack.
    hidden_overhead: >-
      No o(1) and nothing superpolynomial. The honest hidden costs are three.
      (i) The branch enumeration - up to eight sign branches at depth 2 and
      growing with depth, so the constant in "O(1) exponentiations per step"
      is not 1 and must be reported as measured rather than as claimed.
      (ii) Correctness at 414 bits rests on heuristic H2, which is weaker here
      than in the depth-1 record because there is more code. (iii) The
      instrument certifies a 2-part and not a cofactor, and the gap is the odd
      part's primality, which is not addressed at all.
    tradeoff_note: >-
      The genuine tradeoff is DEPTH against COST and it is linear and
      explicit - each additional level of the valuation costs about three
      modular exponentiations and buys exactly one bit, so certifying
      v_2 = k costs about 3 k exponentiations. Nobody needs k beyond about 5
      for a cryptographic curve, so the chain is short in practice and the
      linearity is not a constraint. There is NO time-memory tradeoff and the
      instrument is not on a van Oorschot-Wiener curve at all. Parallelisation
      is irrelevant at 414 bits, where the whole computation is
      milliseconds, and embarrassingly parallel for the toy census across the
      14 cores.

  dominated_by: >-
    CHECKED AGAINST EVERY FRONTIER ROW; `null` is not asserted. AS AN ATTACK
    it is dominated by rho (KN-TECH-001, KN-TECH-006), automorphism-discounted
    rho (KN-TECH-018), BSGS (KN-TECH-031, KN-TECH-035), MOV and Frey-Ruck
    (KN-TECH-032) and the trace-one transfer (KN-TECH-033) simultaneously on
    time, memory and data, because it is not an attack. AS A MEASUREMENT it is
    dominated on INFORMATION by SEA, which returns #E exactly, and is
    Pareto-incomparable with it on time; it is dominated on COST by the
    SafeCurves mirror, which publishes the cofactor cell for free and is the
    transcription under test; and it DOMINATES IDEA-20260829-d052e6 on the six
    Edwards rows by a factor of about two in exponentiations and by the
    removal of an unaudited conversion, while being dominated by that record
    on the five Montgomery rows where it does not apply without one. IT IS
    STRICTLY DOMINATED BY IDEA-20260829-b41d39 on cost for every question
    b41d39 can answer, and dominates it on exactly one axis - it can
    distinguish v_2 = 3 from v_2 = 4, which b41d39 provably cannot. That
    single axis is its whole case and it is stated at that size.
  sota_delta: >-
    ZERO speedup against any attack baseline on every axis. AS PRECISION,
    WHICH IS THE PRINCIPAL DELTA - every 2-adic instrument this program holds
    or has proposed returns "2" or "at least 3", so the published cofactor 2^3
    for Curve41417 is currently underdetermined by every derivation available
    here; this record would move it from a lower bound to an exact value at a
    cost of about three additional modular exponentiations, which is the
    difference between a bound and a number on the one row where the
    distinction is live. AS CONTROL, WHICH IS ARGUABLY WORTH MORE - the
    program currently has NO curve on which the 8-divisibility branch has been
    shown to fire, so five cofactor-4 verdicts in this batch would rest on an
    instrument that has only ever returned one answer; this record supplies
    the one full-size firing and a constructed ladder covering valuations 2
    through 5, which is what IDEA-20260807-98a970's blocking-control rule
    requires and what the archived audit plan's positive control P1 could not
    supply. AS EXPLANATION - the pattern (2^3, 2^3) is unique in the twenty-row
