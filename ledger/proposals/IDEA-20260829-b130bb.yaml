idea:
  id: IDEA-20260829-b130bb
  question_id: RQ-SCURVE-ea4f23
  goal_id: GOAL-SCURVE-334012
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    THE DEPTH-2 EDWARDS HALVING CHAIN, AND WHY CURVE41417 IS THE FAMILY'S ONLY
    FIRE CONTROL - extend the one-symbol 8-divisibility test to an exact
    valuation by halving the order-8 point in Edwards coordinates, on the one
    SafeCurves row where the deeper branch must fire; and show that this row's
    unique published cofactor pattern (2^3, 2^3), which no other curve in the
    twenty-row table exhibits, is FORCED by the residue class of its prime
    rather than chosen
  class: algorithm

  claim: >-
    Curve41417 is x^2 + y^2 = 1 + 3617 x^2 y^2 over p = 2^414 - 17. Four
    separable sub-claims.

    (C1) THE FIRE-CONTROL ARGUMENT, WHICH IS WHY THIS RECORD IS FILED AGAINST
    THIS ROW. IDEA-20260829-b41d39 establishes that for a complete Edwards
    curve, v_2(#E) is at least 3 exactly when chi(1 - d) = +1. Read against
    the repository mirror's published cofactor table, that instrument must
    return chi(1 - d) = -1 on E-222, Curve1174, E-382, Ed448-Goldilocks and
    E-521, whose cofactors are all 2^2, and must return +1 on CURVE41417
    ALONE, whose cofactor is 2^3. CURVE41417 IS THEREFORE THE ONLY ONE OF THE
    SIX EDWARDS ROWS ON WHICH THE INSTRUMENT'S POSITIVE BRANCH CAN FIRE. An
    implementation hard-wired to return -1 would agree with five of six rows
    and be undetectable from those five alone, which is exactly the failure
    mode IDEA-20260807-98a970 names when it rules that a measurement
    instrument never shown to fire cannot certify an absence. This row is not
    one audit among six; it is the blocking control for the other five.

    (C2) THE DEPTH-2 CRITERION, DERIVED TO AN EXPLICIT SHAPE HERE AND
    COMPLETED AS A PROOF OBLIGATION. b41d39's symbol certifies only "at least
    3", so on this row alone the published cofactor 2^3 is NOT fully derived
    by anything this program holds. The extension is an explicit finite
    computation in Edwards coordinates. Let e be a square root of 1 - d, which
    exists on the chi(1 - d) = +1 branch, and let x be a square root of
    (1 + eps e)/d for the sign eps in {+1, -1} making it a square - by
    b41d39's C2 exactly one sign works when d is a non-square. Then (x, x) is
    a rational point of order 8. Solving 2(u, v) = (x, x) with the Edwards
    doubling law, and writing S = u^2 + v^2 and P = u v, the first coordinate
    gives P = x S/2 and the second gives v^2 - u^2 = x(2 - S); squaring the
    second and substituting (v^2 - u^2)^2 = S^2 - 4 P^2 yields the QUADRATIC
    S^2 (2 x^2 - 1) - 4 x^2 S + 4 x^2 = 0, whose discriminant is
    16 x^2 (1 - x^2), so S = 2 x (x plus or minus w)/(2 x^2 - 1) where
    w^2 = 1 - x^2. THEREFORE the order-8 point is halvable only if
    chi(1 - x^2) = +1, and then only if, for at least one choice of sign and
    one root S, both S + 2P and S - 2P are squares, since
    (u + v)^2 = S + 2P and (u - v)^2 = S - 2P. THE CRITERION IS THUS A CHAIN
    OF AT MOST TWO SQUARE ROOTS AND THREE LEGENDRE SYMBOLS ON EXPLICITLY GIVEN
    FIELD ELEMENTS, about six modular exponentiations at 414 bits, with a
    declared degenerate case 2 x^2 = 1 where the quadratic collapses to
    S = 1 and must be handled separately rather than by accident. THE FINAL
    IF-AND-ONLY-IF IS A PROOF OBLIGATION, NOT A THEOREM ASSERTED HERE, and it
    is discharged by exhaustive toy census before any 414-bit use.

    (C3) THE EXACT VALUATION AND THE TWIST, DERIVED. If C2's chain terminates
    at depth 2, then v_2(#E) = 3 exactly. PREDICTED FOR CURVE41417, derived by
    hand in this record and to be re-derived by the executor -
    p + 1 = 2^414 - 16 = 16(2^410 - 1) with 2^410 - 1 odd, so v_2(p + 1) = 4
    and s = 1 + 4 = 5. Since 3 is less than 5, b41d39's forcing theorem gives
    v_2(#E^t) = v_2(#E) = 3 EXACTLY. So the twist cofactor's 2-part is exactly
    8, DERIVED and not read, matching the mirror's published twist cofactor
    2^3. This is the first fully derived cofactor PAIR at depth 3 anywhere in
    this program.

    (C4) THE PATTERN IS FORCED, NOT CHOSEN, AND THAT IS THE NON-OBVIOUS PART.
    Curve41417 is the ONLY row in the entire twenty-row table with the pattern
    (2^3, 2^3). Every other 8-cofactor row - M-221, Curve25519, M-383,
    Curve383187, M-511 - carries twist cofactor 2^2, and every other matched
    row carries (2^2, 2^2). SafeCurves' rigidity transcript for Curve41417
    says only that "Curve and twist cofactors limited to {4,8} for security",
    which permits four combinations. C3 shows that ONCE the curve cofactor is
    8 and the prime is 3 mod 4 with s at least 4, the twist cofactor 8 is
    FORCED - the designers could not have obtained (8, 4) on this prime, and
    the five rows that do carry (8, 4) are predicted to be exactly the rows
    with p = 1 mod 4, where s = 2 forces the mismatch instead. So a cell that
    reads like a design choice is a theorem about the modulus. FALSIFIABLE IN
    ONE PASS over eleven published rows at zero compute.

  mechanism: >-
    THE TRACKED OBJECT is the EDWARDS HALVING CHAIN, the finite sequence
    T(E_d) = (chi(d), chi(1 - d), chi(1 - x^2), chi(S + 2P), chi(S - 2P), ...)
    where each entry is a Legendre symbol on a field element produced by the
    previous halving step, and the chain TERMINATES at the first entry that is
    -1. Its LENGTH, not its content, is the quantity of interest -
    v_2(#E) = 2 plus the number of successful halvings.

    LOSSY-PROJECTION TEST (docs/inventor-protocol.md section 2), applied
    BEFORE any compute.
    WHAT IS DISCARDED. A 414-bit parameter, the base point, the j-invariant,
    the CM discriminant, the whole odd part of the group - which is the entire
    cryptographic group - and every coordinate of every intermediate point
    except the symbols of a handful of derived elements. A 414-bit object
    collapses to a chain of a few bits.
    IS IT A CHANGE OF COORDINATES? No. Nothing about d is recoverable from
    T(E_d); each symbol's fibre has size Theta(p) by Weil's bound, and the
    chain length is bounded by log_2 of the group order while the parameter
    space has size p.
    IS THE DISCARD COMPATIBLE WITH THE OPERATIONS THE AUDIT USES? Three
    operations, three answers. (i) HALVING, which is the operation the object
    exists for - each step's symbol determines whether the next step is
    defined, so the chain propagates deterministically by construction, and
    the terminal LENGTH is exactly v_2 minus 2. (ii) QUADRATIC TWISTING - the
    chain does NOT propagate to the twist, and this is a genuine asymmetry
    that must be disclosed rather than glossed; what propagates instead is the
    forcing theorem, which needs only the terminal length and s. (iii) ODD
    ISOGENY - #E is invariant, so the terminal LENGTH is invariant, but the
    intermediate symbols are not, so only the last entry of the object
    survives an odd isogeny. Two of three operations preserve only the
    terminal value, which is a strictly weaker compatibility than
    IDEA-20260829-b41d39's depth-1 object enjoys, and it is stated as such.
    WHERE THE STRUCTURE DISSOLVES, MEASURED AND STATED. At the degenerate
    parameter 2 x^2 = 1, where the halving quadratic loses its leading
    coefficient; at chi(d) = +1, where the 2-Sylow is non-cyclic and a single
    chain is PROVABLY INSUFFICIENT because it cannot see a second generator -
    the same boundary IDEA-20260829-d052e6 identifies in its Montgomery
    setting, inherited here rather than rediscovered; and at every depth
    beyond the first, where each step needs a square root and the cost grows
    while the information gained per step is one bit.

    WHY THE DEPTH MATTERS AND IS NOT POLISHING. Depth 1 answers "is the
    cofactor 4 or is it bigger", which is a two-way question. Depth 2 answers
    "is it exactly 8", which is what the published cell asserts. The
    difference is not cosmetic - a curve with cofactor 16 would satisfy every
    depth-1 test this program can run and would carry a materially different
    small-subgroup confinement cost, and the program currently has no way to
    tell the two apart on any curve. This record is explicitly a BUILDING
    BLOCK rather than an exponent-moving result, and per
    agents/idea-generator.md's first search heuristic it says so and justifies
    its priority on that basis - it is the control that licenses five sibling
    records' negatives, and without it those negatives rest on an instrument
    never shown to fire.

    EXECUTION. Step 1, zero compute - complete C2's derivation to an
    if-and-only-if and freeze it as code, including the degenerate branch.
    Step 2, EXHAUSTIVE TOY CENSUS - at several small primes, for every d with
    chi(d) = -1, run the chain and compare its terminal length against
    brute-force point counting, reporting agreement separately per true
    valuation so that a chain which is right for v_2 = 2 and wrong for v_2 = 4
    cannot hide in a pooled statistic. Step 3, the CONSTRUCTED-VALUATION
    LADDER - build toy Edwards curves with known v_2 of 2, 3, 4 and 5 by
    exhaustive search at small p and require the chain to return each exactly.
    Step 4, apply the frozen chain to Curve41417 and emit the certificate.
    Step 5, apply b41d39's forcing theorem for the twist. Step 6, the eleven
    row sweep for C4.

