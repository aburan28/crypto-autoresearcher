        cofactor-4 verdict it produced can be trusted; a count above 1 means a
        row whose published cofactor is 2^2 has v_2 at least 3, which
        contradicts the published table for that row.
    - metric: >-
        number of the eleven complete rows whose published cofactor pair is
        consistent with the forcing theorem given that row's own s, and in
        particular whether every (2^3, 2^2) row has p = 1 mod 4
