  assumptions:
    - >-
      The executor session has a shell and Python 3 with arbitrary-precision
      integers. No SEA, Sage or PARI. The chain needs only modular
      exponentiation and Tonelli-Shanks square roots.
    - >-
      IDEA-20260829-b41d39's C1, C2 and C3 have passed their exhaustive toy
      census. This record is their continuation and is meaningless before
      they are validated.
    - >-
      Square roots are computed by a routine correct for p = 3 mod 4 via the
      exponent (p + 1)/4 AND by a general Tonelli-Shanks routine, with the two
      required to agree. p = 2^414 - 17 is predicted to be 3 mod 4, so the
      fast path applies, but a record that uses only the fast path cannot be
      reused on a p = 1 mod 4 sibling and would silently return garbage there.
    - >-
      Curve parameters come from the question record's intake cross-checked
      against the mirror's equation and field tables. No parameter is typed
      from memory.
    - >-
      Scope is prime fields, odd characteristic, untwisted Edwards a = 1 with
      d a non-square. The chain is undefined on the chi(d) = +1 branch and
      must refuse there rather than return a number.

  proof_search_map:
    bottleneck: >-
      Certifying a 2-adic valuation EXACTLY rather than as a lower bound. Every
      instrument this program holds or has proposed stops at "at least",
      because each additional level costs a square root and a fresh symbol and
      nobody has written the second level down. The consequence is concrete
      and is the reason this matters - the published cofactor 8 for Curve41417
      is currently underdetermined by every derivation available here, and the
      five sibling rows' cofactor-4 derivations rest on an instrument whose
      positive branch has never been exercised.
    baseline_embedding:
      parameter_slice: >-
        Truncated at depth 1, this chain must reproduce
        IDEA-20260829-b41d39's chi(1 - d) verdict EXACTLY on every input.
        Truncated at depth 0, it must reproduce that record's completeness
        verdict. b41d39 is the best-known baseline inside this program and
        this record must CONTAIN it as a prefix, not merely resemble it.
      reproduction_check: >-
        A frozen regression fixture asserting bit-identical agreement of the
        depth-0 and depth-1 outputs with b41d39's, on 10^3 toy curves and on
        Curve41417 at 414 bits, run before any depth-2 output is trusted.
        Plus, at toy scale, exact agreement of the whole chain with
        brute-force point counting on every admissible d.
    observation_collision:
      observable: >-
        The chain T(E_d) and in particular its terminal length, which is the
        certificate carrying the exact-valuation conclusion.
      distinct_preimage_search: >-
        REQUIRED, AND IT IS THE CENTRAL EXPERIMENT. Search exhaustively at toy
        p for two parameters d and d' over the SAME p with equal chains but
        unequal v_2. PRE-REGISTERED PREDICTION WITH ITS TWO MEANINGS.
        Collisions are PREDICTED ABSENT on the chi(d) = -1 branch, because the
        cyclic 2-Sylow makes the halving chain determine v_2 exactly - finding
        one there falsifies C2's if-and-only-if outright and means v_2 is NOT
        determined by any bounded Edwards symbol chain. Collisions are
        PREDICTED PRESENT on the chi(d) = +1 branch, inherited from
        IDEA-20260829-d052e6's group-theoretic insufficiency argument for a
        non-cyclic 2-Sylow - finding none there would mean that argument is
        wrong and it must be redone before any claim about the chain's reach
        is made. Either surprise is a result.
        A SECOND COLLISION, SPECIFIC TO DEPTH 2 AND EASY TO MISS - the chain
        must distinguish v_2 = 3 from v_2 = 4, so the toy set must CONTAIN
        curves of both, or the discriminating power at exactly the depth this
        record adds has never been tested. That is why the constructed
        valuation ladder of Step 3 is blocking rather than optional.
    constructive_transforms:
      - transform: telescoping_potential
        proposed_object: >-
          Replace the single yes-or-no test "is the cofactor bigger than 4" by
          a monotone chain whose LENGTH is the answer, so that each additional
          modular exponentiation buys exactly one more bit of the valuation
          and the cost of an exact answer is explicit rather than unbounded.
        predicted_gain: >-
          An exact valuation in about 3 k modular exponentiations for
          valuation k, that is about six at 414 bits for the predicted k = 3,
          where the program currently has only a lower bound at any cost.
      - transform: stronger_invariant
        proposed_object: >-
          Retain the whole chain rather than only its terminal value, so that
          a disagreement with a published cofactor localises to a specific
          halving step and a specific field element instead of being reported
          as a bare mismatch.
        predicted_gain: >-
          A defect is localised to a step rather than to a curve, which is the
          difference between an actionable finding and a fatigue report; and
          the intermediate symbols become the cross-check against
          IDEA-20260829-d052e6's Montgomery chain, which produces a
          structurally different but order-equivalent sequence.
    quantifier_order: >-
      C1 IS A FINITE OBSERVATION about six rows of a published table.
      C2 IS CLAIMED UNIFORMLY AND CONDITIONALLY, AND ITS FINAL DIRECTION IS AN
      OBLIGATION RATHER THAN A THEOREM. FOR ALL odd p and FOR ALL d with
      chi(d) = -1 and chi(1 - d) = +1 and 2 x^2 not equal to 1, the order-8
      point is halvable in E_d(F_p) IF the stated square-class conditions
      hold; the ONLY-IF direction is listed as a proof obligation and is
      validated by exhaustive census before use, not asserted.
      C3 IS CLAIMED PER INSTANCE, EXISTENTIALLY IN THE CERTIFICATE. FOR THIS
      curve, v_2(#E) = 3 and v_2(#E^t) = 3, exhibited by the chain and by the
      forcing theorem.
      C4 IS CLAIMED UNIVERSALLY OVER A FINITE SET. FOR ALL eleven complete
      rows, the published cofactor pair is consistent with the forcing
      theorem given that row's own s. NOT CLAIMED - that the designers
      reasoned this way, which is unknowable, or that the pattern is forced
      for any curve outside the eleven.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For this (p, d), v_2(#E) = 3 and v_2(#E^t) = 3, certified by the
        attached chain and the 2p + 2 identity." It certifies NOTHING about
        the odd part, so it does NOT certify that the cofactor is 8 - only
        that its 2-part is 8. The published cell "cofactor 2^3" asserts more
        than this record can reach, and the gap is exactly the primality of
        the odd part, which needs IDEA-20260829-a40979's torsion sieve at
        best and a point count at worst. A record that writes "cofactor 8
        derived" without that qualifier has overstated it.
      nearby_object_control: >-
        THE FIVE COFACTOR-4 EDWARDS ROWS ARE THE MATCHED NEGATIVE CONTROL, and
        they are unusually good ones - same model, same untwisted a = 1 form,
        same code path, primes of 222 to 521 bits, and all five predicted to
        REFUSE the depth-2 chain because their depth-1 symbol is -1. A chain
        that returns a depth-2 answer for E-222 is reading something other
        than the curve. THE SHARPEST SINGLE CONTROL IS A CONSTRUCTED ONE - a
        toy Edwards curve with v_2 = 4, found by exhaustive search at small p,
        on which the chain must return 4 and NOT 3. The whole value added by
        this record is the ability to tell 3 from 4, so an experiment that
        never presents a 4 has not tested the thing it claims. A SECOND
        CONSTRUCTED CONTROL - a toy curve with 2 x^2 = 1, exercising the
        declared degenerate branch, which must be handled explicitly.
    proof_obligations:
      - claim: >-
          Solving 2(u, v) = (x, x) in the Edwards addition law yields
          P = x S/2 and S^2(2 x^2 - 1) - 4 x^2 S + 4 x^2 = 0 with discriminant
          16 x^2 (1 - x^2).
        responsibility: correctness
      - claim: >-
          A rational preimage exists if and only if chi(1 - x^2) = +1 and, for
          some root S and sign, both S + 2P and S - 2P are squares.
        responsibility: correctness
      - claim: >-
          The degenerate case 2 x^2 = 1 reduces the quadratic to S = 1 and is
          handled explicitly rather than by a silent division.
        responsibility: correctness
      - claim: >-
          On the cyclic branch the chain's terminal length equals v_2(#E)
          minus 2, and the chain terminates in at most log_2(#E) steps at O(1)
          exponentiations per step.
        responsibility: runtime
      - claim: >-
          The chain reproduces IDEA-20260829-b41d39's depth-0 and depth-1
          outputs bit for bit.
        responsibility: baseline
      - claim: >-
          The toy census is EXHAUSTIVE over admissible d and CONTAINS curves
          of true valuation 2, 3, 4 and 5.
        responsibility: scope
      - claim: >-
          The emitted certificate is verifiable by a second implementation in
          the stated number of exponentiations using only (p, d).
        responsibility: interface
      - claim: >-
          Correctness of the chain at 414 bits given validation at 13 to 20
          bits.
        responsibility: success_probability
    not_applicable_reason: null

  predictions:
    - metric: 'chi(3617) for p = 2^414 - 17'
      direction: different
      minimum_effect: >-
        PREDICTED -1, that is Curve41417 IS complete, matching the mirror's
        complete cell and its count of exactly one point of order 2. A value
        of +1 contradicts a retrieved table cell; halt and escalate.
    - metric: 'chi(1 - 3617) = chi(-3616) for p = 2^414 - 17'
      direction: different
      minimum_effect: >-
        PREDICTED +1, hence v_2(#E) at least 3, matching the published
        cofactor 2^3. THIS IS THE FAMILY'S ONLY EXPECTED POSITIVE FIRING AND
        ITS FAILURE WOULD BE THE MOST INFORMATIVE SINGLE OUTCOME IN THIS
        BATCH - a value of -1 would mean either that the published cofactor is
        wrong or that IDEA-20260829-b41d39's criterion is wrong, and would
        leave the criterion with no positive control anywhere in the family.
        SUB-PREDICTION, derived by hand here and to be re-derived - 3616 is
        2^5 times 113 and p is predicted to be 7 mod 8 since 2^414 is 0 mod 8
        and -17 is 7 mod 8, so chi(2) = +1 and chi(-1) = -1, whence
        chi(-3616) = -chi(113); the prediction chi(-3616) = +1 is therefore
        equivalent to chi(113) = -1 mod 2^414 - 17, which is an independently
        checkable restatement and a cheap self-test of the symbol routine.
    - metric: >-
        terminal length of the depth-2 chain for Curve41417, hence v_2(#E)
      direction: different
      minimum_effect: >-
        PREDICTED EXACTLY 3, that is the chain succeeds at depth 1 and FAILS
        at depth 2. A terminal value of 4 or more would CONTRADICT the
        mirror's published cofactor 2^3 and is a material discrepancy - halt,
        re-read the raw twist.html, and escalate before anything leaves the
        repository. THE HEADLINE ARTIFACT IS THE FAILURE AT DEPTH 2, not the
        success at depth 1, because only the failure pins the value.
    - metric: 's = 1 + v_2(p + 1) for p = 2^414 - 17, and the derived v_2(#E^t)'
      direction: different
      minimum_effect: >-
        PREDICTED s = 5, since p + 1 = 2^414 - 16 = 16(2^410 - 1) with
        2^410 - 1 odd; and hence, since 3 is less than 5, v_2(#E^t) = 3
        EXACTLY, twist cofactor 2-part exactly 8, DERIVED and not read. The
        mirror publishes 2^3 and that is the prediction target.
    - metric: >-
        fraction of toy curves with chi(d) = -1 for which the chain's terminal
        length equals brute-force v_2, reported SEPARATELY per true valuation
      direction: higher
      minimum_effect: >-
        PREDICTED EXACTLY 1.000 in every valuation bin, exhaustive census,
        zero exceptions. A pooled 1.000 that hides a bin with no members is
        NOT acceptable and the per-bin report is what makes the number
        meaningful. Anything below 1.000 in any bin falsifies C2's
        if-and-only-if and the 414-bit application is withdrawn.
    - metric: >-
        number of the six Edwards rows on which the depth-1 symbol returns +1
      direction: different
      minimum_effect: >-
        PREDICTED EXACTLY 1, namely Curve41417. A count of 0 means the
