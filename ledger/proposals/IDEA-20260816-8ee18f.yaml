idea:
  id: IDEA-20260816-8ee18f
  question_id: RQ-MQOM-001
  added: '2026-08-16'
  title: Do repetitions actually multiply? Instrument the cheating-success indicator per repetition
    in a toy shell where repetitions share a salt and a commitment root, and measure the covariance
    between repetition-level success events against the independence the composition step assumes.
  class: mechanism
  claim: '(A) INDEPENDENCE IS AN ASSUMPTION WITH A MEASURABLE PROXY. Composing tau repetitions by
    raising a per-repetition soundness error to the power tau presupposes that the events {repetition
    i accepts a cheating prover} are mutually independent under the challenge distribution. In a shell
    where repetitions share a salt and a commitment root, that presupposition is not automatic, and
    its failure has a direct measurable proxy: the pairwise covariance Cov(X_i, X_j) of the repetition-level
    acceptance indicators under the actual challenge derivation, and the higher-order deviation of
    E[prod X_i] from prod E[X_i]. (B) THE COVARIANCE IS COMPUTABLE EXACTLY AT ENUMERABLE SCALE AND
    ESTIMABLE BEYOND. Part (B) claims that at party count up to 8, repetitions up to 4 and field size
    up to 8, all moments of the indicator vector can be computed exactly by enumerating the joint
    challenge space, so the independence question becomes an exact identity check rather than a statistical
    test; and that beyond that grid, sampling with declared seeds gives the same quantity with reportable
    error bars. (C) THE SHARING FEATURE IS THE INDEPENDENT VARIABLE. The shell is built with a switch:
    repetitions either share salt and root, or use independently sampled ones. Part (C) claims that
    any nonzero covariance measured in the sharing arm and absent in the independent arm is attributable
    to the sharing, and that this attribution is a PARADIGM-LEVEL statement because the sharing pattern
    is a feature of the proof transform rather than of any underlying problem. (D) WHAT IS NOT CLAIMED.
    No forgery, no break, no speedup, no security consequence, and no assertion that any scheme shares
    salts or roots in the way modelled, since no specification has been read and the sharing pattern
    is a declared construction of this shell. It is NOT claimed that nonzero covariance would make
    composition invalid; a positive covariance would mean the composed error is larger than the product,
    which is a modelling gap, and quantifying it at toy scale is emphatically not evidence about deployed
    parameters. It is also NOT claimed that zero covariance proves independence: zero covariance is
    a necessary and not sufficient condition, which is why the higher-order product deviation is measured
    alongside it.'
  mechanism: 'STAGE 1 builds the toy shell with the sharing switch and a cheating prover whose per-repetition
    corruption choices are enumerable. STAGE 2 for a fixed corruption strategy, enumerates the joint
    challenge space and records the full indicator vector (X_1, ..., X_tau) for every challenge, giving
    the exact joint distribution rather than an estimate. STAGE 3 computes all pairwise covariances,
    the full product deviation D = E[prod X_i] minus prod E[X_i], and the maximum over corruption
    strategies of both. STAGE 4 runs the independent arm with independently sampled salts and roots
    through the identical pipeline, where the covariance must be exactly zero by construction; a nonzero
    value there is an instrument failure that halts the lane, and this is the null object. STAGE 5
    sweeps how much is shared: nothing, salt only, root only, both, so the effect is localized to
    a specific shared element rather than to sharing in general. STAGE 6 runs the structural tell
    from inventor-protocol section 3: covariance should DECAY as the challenge entropy per repetition
    grows, because more entropy should destroy the coupling. A covariance that stays constant as field
    size and party count grow is the signature of an artifact and is treated as such rather than as
    a finding, and the sweep is designed so that this decay check is available at four points on each
    axis. STAGE 7 reports D as a function of tau, since the composition assumption is used at the
    tau actually deployed and a coupling invisible at tau equal to 2 may be the whole story at tau
    equal to 4.'
  novelty_status: unverified
  novelty_screen:
    method: 'grep -rli in ledger/proposals for: repetition, soundness error, salt, MPCitH, GGM tree,
      Fiat-Shamir, independence. Read titles and class of IDEA-20260808-721f2b, IDEA-20260805-cec9b6,
      IDEA-20260805-7abf04, IDEA-20260808-aa551f, IDEA-20260813-2caec5, IDEA-20260813-6819af, IDEA-20260801-005.
      Read RQ-MQOM-001 in full and skimmed H-MQOM-a45638 and H-MQOM-a0a477 filenames in ledger/hypotheses.'
    results: 'IDEA-20260805-cec9b6 is the closest on the salt axis: it costs a lambda-bit salt''s
      birthday budget against a signing limit for MQOM and mentions a secret-key-root correlated GGM
      tree, i.e. it notices correlation as a structural feature but treats it as a proof-applicability
      question rather than measuring a covariance. IDEA-20260813-2caec5, hypercube opening-incidence
      rank deficit under view reuse, concerns reuse across views in the SDitH hypercube, a linear-algebraic
      rank object rather than a probabilistic independence check. IDEA-20260808-721f2b optimises the
      forger over the challenge structure but presupposes the structure''s composition. No record
      was found measuring pairwise covariance or the product deviation of repetition-level acceptance
      indicators.'
    verdict: 'UNVERIFIED. Nothing is asserted about published literature; independence analyses across
      repetitions may well be standard there. Assembled from known parts: joint-distribution enumeration,
      covariance, and switch-controlled ablation are elementary. Claimed new relative to THIS repository
      only: the repetition-level acceptance indicator VECTOR as the tracked object, its exact joint
      distribution by enumeration, the sharing-element ablation that localizes any coupling, and the
      decay-with-entropy structural tell used as an artifact detector rather than as a result.'
  object_first_candidate:
    tracked_object: The acceptance indicator vector X = (X_1, ..., X_tau) of a fixed cheating prover
      across repetitions, followed as a random vector over the joint challenge space, with its full
      joint distribution retained.
    lossiness: 'Genuinely lossy. The vector discards which challenge produced the acceptance, the
      corrupted shares, the transcript content, the salt value and the tree contents, retaining only
      tau bits per challenge. It propagates because the composed soundness error is exactly E[prod
      X_i] under the maximizing corruption, a functional of the joint distribution alone. The projection
      is strictly coarser than the transcript: many challenges map to the same indicator vector, and
      the covariance measurement is meaningful only because of that collapse. It is not a change of
      coordinates.'
    propagation: One step of the target operation is adding one repetition. Under it the indicator
      vector gains a coordinate, and the composition assumption says the new joint distribution is
      the product of the old one with a fresh marginal. The measurement is whether that product structure
      holds, coordinate by coordinate, so one step acts on the object either as a tensor extension
      or as something with a residual, and D quantifies the residual.
    survival_score: The product structure survives to whatever tau the sharing does not couple. The
      run reports the largest tau at which |D| stays below one part in 10000 of prod E[X_i], separately
      for each sharing configuration, and that number is the survival score. Because enumeration caps
      tau at 4, a survival score of 4 is the ceiling, stated openly, and any conclusion about larger
      tau is refused rather than extrapolated.
  null_object_control: 'The independent arm: the identical shell, identical cheating prover, identical
    enumeration, with independently sampled salt and commitment root per repetition, run in the same
    invocation. There the covariance is zero by construction, so the null must return exactly zero
    for every pair and D must be exactly zero. If it does not, the enumeration or the indicator extraction
    is faulty and no covariance from the sharing arm is admissible. A second null uses a random indicator
    vector of matched marginals with no protocol behind it, checking that the covariance estimator
    returns zero on a synthetic independent vector at the same sample sizes used in the sampled regime.'
  discriminated_from:
  - 'IDEA-20260805-cec9b6, MQOM salt birthday budget and correlated GGM root: costs a birthday bound
    and raises proof applicability. This measures a covariance of acceptance events and never computes
    a birthday budget.'
  - 'IDEA-20260813-2caec5, hypercube opening-incidence rank deficit under view reuse: a rank statistic
    over an incidence matrix in the SDitH lane; deterministic linear algebra rather than a joint distribution
    over challenges.'
  - 'IDEA-20260808-721f2b, optimal forger by dynamic programming: takes the composition structure
    as given and optimises within it, so a failure of independence is outside what it can observe.'
  - 'The entry in this same bucket that enumerates transcripts to measure soundness error: that measures
    the SCALAR maximum acceptance probability. This measures the joint distribution of the indicator
    vector, which is strictly more information, and it exists to explain any composition residue that
    measurement finds.'
  - A generic statistical independence test on simulated data. That would test an estimator; this
    enumerates the exact joint distribution wherever enumeration completes, so at those points there
    is no estimation at all.
  assumptions:
  - The shell's sharing pattern is a declared construction, not a model of any scheme. No specification
    has been read and none is claimed.
  - The cheating prover's corruption space is enumerable so the maximum over strategies is a maximum
    and not a lower bound; where it is not, results are labelled as lower bounds.
  - Commitments are idealized as perfectly binding, so any measured coupling cannot be attributed
    to the commitment layer. This is a scope restriction stated with every result.
  - Joint challenge enumeration is affordable at tau up to 4 with the declared N and field sizes;
    beyond that, sampled estimates carry declared-seed reproducibility and reported error bars.
  - Zero covariance is necessary but not sufficient for independence, so D is measured alongside and
    neither is reported without the other.
  predictions:
  - metric: maximum pairwise covariance in the independent (null) arm
    direction: lower
    minimum_effect: 0
  - metric: maximum pairwise covariance in the both-shared arm at the smallest field size
    direction: higher
    minimum_effect: 0.0001
  - metric: product deviation D at tau equal to 4 relative to prod E[X_i], both-shared arm
    direction: higher
    minimum_effect: 0.0001
  - metric: decay of measured covariance as challenge entropy per repetition increases
    direction: lower
    minimum_effect: 'refuse to pre-commit a rate: the decay shape is the structural tell being measured,
      and a pre-committed rate would let a constant covariance be read as agreement with expectation
      rather than as the artifact signature it is'
  minimal_test:
    design: Fix N equal to 4, field size 4, tau equal to 2 and 3, one placeholder relation. Build
      the shell with a four-way sharing switch (none, salt, root, both). For a fixed enumerable corruption
      space, enumerate the entire joint challenge space, record the indicator vector for every challenge,
      and compute exact marginals, pairwise covariances and D. Take the maximum over corruption strategies.
      Run all four sharing configurations through the identical pipeline in the same invocation, with
      the none configuration serving as the null that must return exactly zero. Repeat at field size
      8 and N equal to 8 to get two points on each entropy axis for the decay check. This is minutes
      of compute, involves no cryptography beyond idealized commitments, and answers whether sharing
      produces measurable coupling, which element produces it, and whether the effect decays as it
      should or is constant and therefore suspect.
    controls:
    - The none-shared arm, where covariance must be exactly zero by construction.
    - A synthetic independent indicator vector with matched marginals, checking the estimator returns
      zero at the sample sizes used in the sampled regime.
    - Sharing-element ablation (salt only, root only, both) so any effect is localized.
    - Entropy sweep on two axes (field size, party count) providing the decay-versus-constant artifact
      test.
    - tau equal to 1, where covariance is undefined and D must be identically zero; the code path
      must produce that rather than special-case it.
    required_metrics:
    - exact marginals E[X_i] per repetition per configuration
    - all pairwise covariances Cov(X_i, X_j)
    - product deviation D equals E[prod X_i] minus prod E[X_i]
    - maximum of covariance and of D over corruption strategies
    - covariance as a function of challenge entropy per repetition, for the decay check
    - joint challenge-space size enumerated per point
    - null-arm covariance, which must be exactly zero
  falsification_conditions:
  - The none-shared null arm returns nonzero covariance, voiding the instrument.
  - The synthetic matched-marginal control returns nonzero covariance at the declared sample sizes,
    showing estimator bias.
  - Covariance in the both-shared arm is exactly zero at every tested point, falsifying claim (A)
    that the sharing pattern is a measurable coupling at this scale.
  - Measured covariance does not decay as challenge entropy grows, marking the signal as an artifact
    under inventor-protocol section 3 rather than a finding.
  - The joint challenge space is not enumerable at the smallest grid point, so no exact moment is
    obtainable anywhere.
  - D is negative beyond numerical exactness, which for indicator variables under this construction
    indicates a counting error.
  confounders:
  - A cheating prover whose corruption choices are themselves correlated across repetitions, which
    would produce covariance for reasons unrelated to salt or root sharing. Mitigated by holding the
    corruption strategy fixed within each enumeration and by taking the maximum over strategies separately.
  - Small field sizes where the marginals are close to one, compressing covariance toward zero by
    range restriction. Mitigated by including field sizes and party counts far apart on the entropy
    axis.
  - Idealized commitments removing the very mechanism by which real sharing would couple repetitions.
    Stated as a scope limit rather than mitigated.
  - Enumeration bugs that double count challenges, which would inflate covariance uniformly. Mitigated
    by the none-shared null returning exact zero and by verifying enumerated space sizes against closed-form
    counts.
  interpretation_limits:
  - Any measured coupling is a property of the declared shell's sharing construction, not of any deployed
    scheme.
  - Zero covariance does not establish independence; D is reported alongside and even both together
    bound only up to the enumerated order.
  - The survival score is capped at tau equal to 4 by enumerability, so nothing is claimed about the
    tau values the family actually uses.
  - Because commitments are idealized, no conclusion touches the commitment or hash layer, where a
    real coupling might instead live.
  - A nonzero D at toy scale is a modelling gap in this shell, and the contract forbids reading it
    as evidence that any deployed composition is unsound.
  target_complexity:
    time_exponent: No attack exponent is claimed. Enumeration costs O(|corruptions| times |joint challenges|),
      exponential in tau by construction and bounded by the grid.
    memory_exponent: No attack exponent is claimed. Memory is O(2^tau) moment accumulators plus the
      enumeration frontier.
    best_known: The incumbent is the multiplicative composition step used throughout the family's
      soundness accounting, and within this repository the composition assumed by IDEA-20260808-721f2b
      and the correlated-root concern raised in IDEA-20260805-cec9b6.
    hidden_overhead: 'Hidden in the lower-order terms is the corruption strategy space: a coupling
      that only a jointly chosen corruption exploits would be invisible to per-repetition-fixed strategies,
      and enumerating jointly chosen corruptions is the term that explodes. Human cost hides in arguing
      whether the shell''s sharing construction resembles anything real, which no one in this environment
      can settle.'
  dominated_by: 'n/a (no result claimed). All frontier axes checked: no time, memory or query point
    is placed, since no forgery is attempted and no instance is solved.'
  sota_delta: no attack; conceptual/measurement contribution only
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'Part (A), that a measurable proxy for independence failure exists and
    is well defined: 0.9, since covariance and product deviation are definitionally available once
    the joint distribution is. Part (B), that exact enumeration of all moments is affordable at the
    declared grid: 0.7, with the joint challenge space at tau equal to 4 the main risk. Part (C),
    that a nonzero covariance appears in the sharing arm and is absent in the independent arm: 0.35,
    because idealized commitments may remove the coupling mechanism entirely, and a clean zero is
    the single most likely outcome. That any measured covariance passes the decay-with-entropy artifact
    test rather than being constant: 0.5 conditional on it being nonzero at all.'
