  source_refs:
  - MAYO specification (Beullens, SAC 2021 and the NIST additional-signatures submission)
    -- REQUIRED READ, NOT YET READ BY THIS PROGRAM. Everything about the emulsifier here is
    RECALLED and must be replaced by verbatim spec text.
  - KN-LIT-7620 (NIST IR 8610) -- confirms MAYO is a Round-3 candidate; contains no emulsifier
