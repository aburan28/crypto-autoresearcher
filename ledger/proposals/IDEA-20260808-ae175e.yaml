  proof_search_map:
    bottleneck: Deciding whether the m-dimensional public span of whipped quadratic forms
      contains an element of rank materially below kn. Removing this step is what converts
      "whipping is assumed neutral" into a checked statement.
    baseline_embedding:
      parameter_slice: k = 1. Then C(theta) is the 1 x 1 matrix (theta^{c(1,1)}), rank 1 =
        k, and the whipped map IS the underlying UOV map. The identity must reproduce plain
        UOV exactly at k = 1.
      reproduction_check: 'Symbolic: at k = 1 the Kronecker product degenerates to a scalar
        multiple of M_lambda, so rank = rank M_lambda, which is the plain-UOV statement. Frozen
        fixture: a toy k = 1 "whipped" key must be bit-identical to the plain UOV key it was
        built from.'
    observation_collision:
      observable: min_theta rank C(theta), an integer in [1, k].
      distinct_preimage_search: 'Two distinct exponent patterns c and c'' with the same min_theta
        rank C(theta) but different security consequences are easy to construct (any two full-rank
        patterns), so the observable is NOT identifying on its own -- it is a one-sided certificate:
        a low value certifies a defect, a full value certifies only the absence of THIS defect.
        This is stated rather than hidden, and it is why the record''s null branch is scoped
        narrowly.'
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: Move from the kn x kn whipped polar form to the pair (C(theta), M_lambda)
        in the eigenbasis of the emulsifier, where the hypothesis "the whipped span has a
        low-rank element" becomes the exact rank equation rank = rank C * rank M.
      predicted_gain: Search space for low-rank witnesses drops from an m-dimensional space
        of kn x kn matrices to m evaluations of a k x k rank -- a factor n^2 in the object
        size and a complete removal of the search.
    quantifier_order: 'FORALL published MAYO parameter sets, FORALL roots theta of the emulsifier
      generator''s minimal polynomial, rank_K C(theta) = k. The negation that would matter
      is: THERE EXISTS a parameter set and THERE EXISTS a root theta with rank_K C(theta)
      < k. Note the witness theta is allowed to depend on the parameter set; no uniformity
      in q or k is claimed.'
    method_ceiling:
      strongest_certifiable_claim: '"The K-span of the whipped public forms contains an element
        of rank at most (min_theta rank C(theta)) * n." It can never certify that no low-rank
        element exists, because non-eigen elements of the K-span are not covered.'
      nearby_object_control: 'The nearby object on which the hoped-for conclusion fails: a
        whipped map built from k(k+1)/2 INDEPENDENT random emulsifier matrices. There the
        method returns "no factorisation exists" and certifies nothing, even though a low-rank
        element may still be present. A method that reported a defect there would be measuring
        an artifact.'
    proof_obligations:
    - claim: The Kronecker identity holds in characteristic 2 with the stated conventions.
      responsibility: correctness
    - claim: rank(A tensor B) = rank(A) * rank(B) over a field.
      responsibility: baseline
    - claim: min_theta rank C(theta) is computable in O(m k^3) operations in K.
      responsibility: runtime
    - claim: A defect of corank (k-r)n yields a MinRank instance of a stated size.
      responsibility: interface
    - claim: Nothing here bounds the solvability of that MinRank instance.
      responsibility: scope
    not_applicable_reason: null
