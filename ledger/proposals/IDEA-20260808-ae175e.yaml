idea:
  id: IDEA-20260808-ae175e
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-MAYO-001
  goal_id: GOAL-MAYO-001
  title: The whipped public form factorises as a Kronecker product C(theta) tensor M_lambda
    over the splitting field of the emulsifier, so rank(whipped) = rank C(theta) * rank M_lambda
    exactly -- making min_theta rank C(theta) a seconds-long, key-free, decisive MinRank test
    on MAYO's published emulsifier
  class: mechanism
  claim: 'DERIVED IN THIS SESSION, four lines, verify it before believing it. Let P be MAYO''s
    underlying UOV map (m quadratic forms in n variables over F_q, q even), let E_ij in F_q^{m
    x m} be the emulsifier matrices, and write the whipped map as P*(x_1..x_k) = sum_{i<=j}
    E_ij B_ij(x), with B_ii(x) = P(x_i) and B_ij(x) = P''(x_i, x_j) the polar value. For any
    lambda in F_q^m, lambda^T P*(x) = sum_{i<=j} (E_ij^T lambda)^T B_ij(x). Now suppose every
    E_ij lies in the commutative algebra F_q[E] generated by one matrix E -- which is the
    efficient and, RECALLED-UNVERIFIED, the specified construction -- so E_ij = E^{c(i,j)}
    for an integer exponent pattern c. Pass to the splitting field K = F_q[z]/(g), g = minimal
    polynomial of E, and let lambda be a left eigenvector of E with eigenvalue theta in K.
    Then E_ij^T lambda = theta^{c(i,j)} lambda, so lambda^T P*(x) = sum_{i<=j} theta^{c(i,j)}
    * (lambda^T P)_{ij-slot}(x_i, x_j), whose polar (Gram) matrix on K^{kn} is EXACTLY the
    Kronecker product C(theta) tensor M_lambda, where C(theta) is the symmetric k x k matrix
    C(theta)_{ij} = theta^{c(i,j)} and M_lambda is the n x n polar matrix of the single underlying
    form lambda^T P. Consequently rank_K( polar of lambda^T P* ) = rank_K C(theta) * rank_{K}
    M_lambda. THE CLAIM: min over the roots theta of g of rank_K C(theta) is a k x k rank
    computation over K, costs seconds, needs no secret key, and decides a security question.
    If min_theta rank C(theta) = k for every root, the whipped span contains no eigen-direction
    rank defect and whipping introduces no MinRank instance by this route. If min_theta rank
    C(theta) = r < k for even one root, then the K-span of MAYO''s public whipped forms contains
    an element of rank at most r*n out of kn, i.e. a rank defect of (k - r) * n coordinates,
    which is a MinRank instance whose target corank is a fixed fraction of the ambient dimension.
    The degenerate extreme is exactly diagnostic: c(i,j) = a_i + a_j additive forces C(theta)
    = (theta^{a_i}) outer (theta^{a_j}), rank 1, and the whipped map collapses to the underlying
    map evaluated at the single vector sum_i theta^{a_i} x_i.'
  mechanism: The whipping construction is a bilinear pairing between an emulsifier side, living
    in F_q[E], and a polar-value side, living in the underlying key. Reading the emulsifier
    side in its own eigenbasis diagonalises it completely, and in that basis each of the m
    whipped equations becomes a SCALAR multiple pattern theta^{c(i,j)} applied blockwise to
    ONE underlying form. A blockwise scalar pattern applied to a fixed matrix is precisely
    a Kronecker product, and Kronecker rank multiplies. So the entire question of whether
    whipping can create a low-rank element in the public span reduces from a rank question
    about kn x kn matrices to a rank question about k x k matrices -- a reduction of the search
    space by a factor (kn/k)^2 = n^2, with no loss, because the factorisation is an identity
    and not a bound. The reason this is worth doing rather than assuming is that the exponent
    pattern c(i,j) is a specification choice made for EFFICIENCY (small, reusable powers of
    one matrix) and the rank condition it must satisfy is a condition over the SPLITTING FIELD,
    not over F_q. A designer who checked invertibility of F_q-combinations of the E_ij has
    not thereby checked rank C(theta) over K.
  why_not_a_renamed_known_approach: 'Nearest known method: MinRank / rectangular MinRank on
    a multivariate public key (Kipnis-Shamir 1999 through Beullens'' 2022 rectangular-MinRank
    break of Rainbow). The difference is the object and its size. Classical MinRank searches
    an m-dimensional F_q-span of n x n public matrices for a low-rank element encoding the
    SECRET oil structure, and the search is the expensive part. Here the low-rank candidates
    are produced in closed form by diagonalising a PUBLIC, KEY-INDEPENDENT matrix, the search
    collapses to m evaluations of a k x k determinantal rank, and the quantity that decides
    the outcome is a property of the specification rather than of any key. Nearest internal
    record: IDEA-20260805-74e78c, whose tracked object is the common LEFT KERNEL of the emulsifier
    combination matrices D_a(C), F_ab(C) inside F_q^{m x m} and whose consequence is a reduced
    EQUATION COUNT on a slice. This record''s object is a k x k matrix over F_{q^{deg g}}
    whose consequence is a RANK DEFECT of the whipped quadratic form, and the two are not
    computable from one another -- delta(C) = 0 for all slices is consistent with rank C(theta)
    < k, and vice versa. 74e78c explicitly declares MinRank off-limits and states its object
    "is not a MinRank instance"; this one is exactly a MinRank instance and says so.'
  object_first:
    established_families_named_off_limits: 'Off-limits as the primary lens for this record:
      Kipnis-Shamir invariant subspaces, reconciliation, Beullens intersection, direct/hybrid
      Groebner on the public key, Thomae-Wolf underdetermined solving, and all fault/side-channel
      routes.'
    tracked_object: The k x k matrix C(theta)_{ij} = theta^{c(i,j)} over the splitting field
      of the emulsifier's minimal polynomial, followed through the Kronecker factorisation
      of the whipped polar form.
    lossy_projection_test: 'PASSES. The projection (whipped public form) -> (C(theta) for
      each root theta) discards the entire underlying key M_lambda and keeps only the emulsifier''s
      eigen-pattern. It is lossy because C(theta) has k^2 entries where the whipped form has
      (kn)^2, a compression factor n^2, and the discarded part -- M_lambda -- is discarded
      COMPATIBLY because rank is multiplicative across a Kronecker product, so the retained
      part still propagates deterministically to the observable of interest (the rank of the
      whipped form). It is not a change of coordinates: from C(theta) alone one cannot reconstruct
      the whipped form, and two different underlying keys give the same C(theta).'
    survival_depth: 'The factorisation is exact for as long as every E_ij lies in one commutative
      algebra F_q[E]. It DISSOLVES the moment the emulsifier matrices generate a non-commutative
      algebra (no simultaneous eigenbasis), and that dissolution point is itself the measurement:
      the record''s null branch is "the E_ij do not commute, the factorisation does not exist,
      and whipping is protected by non-commutativity" -- a named, checkable structural reason.'
  predictions:
  - observable: min over roots theta of g (the minimal polynomial of MAYO's emulsifier generator
      E) of rank_K C(theta), C(theta)_{ij} = theta^{c(i,j)}
    metric: integer in [1, k]
    predicted: 'Primary prediction, stated as the security-supporting outcome: rank C(theta)
      = k for every root, at every published MAYO parameter set. Stated so that the opposite
      is a clean falsification of MAYO''s whipping-is-neutral position rather than of this
      record.'
  - observable: rank over K of the polar matrix of lambda^T P* for lambda a left eigenvector,
      computed DIRECTLY on a toy whipped key, versus the predicted product rank C(theta) *
      rank M_lambda
    metric: exact integer equality
    predicted: Exact equality at every toy cell. Any inequality falsifies the derivation itself
      and is the more important result.
  - observable: 'commutativity defect of the published emulsifier: dim of the F_q-span of
      {E_ij E_kl - E_kl E_ij}'
    metric: dimension, integer
    predicted: Zero (the E_ij commute) if the recalled powers-of-one-matrix construction is
      right. Nonzero collapses this record to its null branch and is recorded as such.
  - observable: 'additivity defect of the exponent pattern: min over integer vectors a of
      #{(i,j) : c(i,j) != a_i + a_j}'
    metric: count, integer in [0, k(k+1)/2]
    predicted: Strictly positive and large. Zero would mean the whipped map collapses to the
      underlying map at a single linear combination, which is inconsistent with MAYO signing
      being able to hit a uniform target, so a measured zero indicates the recalled emulsifier
      form is wrong.
  minimal_test: 'Zero-key, three-step, minutes of CPU. (1) Read MAYO''s Round-3 (or v1.0)
    specification and extract the emulsifier definition: the generator E or the defining polynomial,
    and the exponent pattern c(i,j) for 1 <= i <= j <= k. Record verbatim. (2) Compute g =
    minimal polynomial of E over F_q, factor it, and for each root theta in each splitting
    field compute rank_K C(theta) by Gaussian elimination on a k x k matrix. Report min_theta
    rank C(theta) per parameter set. (3) Independently, build a TOY whipped key at (q, n,
    m, o, k) = (16, 10, 6, 2, 3) and (16, 12, 8, 3, 4) with the SAME emulsifier construction
    shape, compute the polar matrix of lambda^T P* for an eigenvector lambda directly, and
    check the product identity rank = rank C(theta) * rank M_lambda exactly. Step 3 is the
    correctness control on step 2; step 2 is the deliverable.'
  controls:
  - 'NULL EMULSIFIER: replace the specified E_ij by k(k+1)/2 independent uniform matrices
    in F_q^{m x m}. These do not commute, the factorisation must fail to exist, and the direct
    rank of the whipped form must show no defect. If the null shows a defect, the measurement
    is broken.'
  - 'RANK-1 POSITIVE CONTROL: force c(i,j) = i + j (additive). The prediction is rank C(theta)
    = 1 exactly and the whipped form''s rank = rank M_lambda. A measurement apparatus that
    does not reproduce this known-degenerate case is not trusted on the real emulsifier.'
  - 'KEY-INDEPENDENCE CONTROL: recompute min_theta rank C(theta) for 20 independently sampled
    underlying keys P. The value must be identical for all of them, because the object does
    not depend on the key. Variation indicates a bug.'
  - 'FIELD CONTROL: repeat over F_4 and F_16 for the same exponent pattern. rank C(theta)
    depends only on theta and the pattern, so any q-dependence beyond the change of splitting
    field is a bug.'
  confounders:
  - E may not be diagonalisable over its splitting field (repeated roots of g). Then the eigen-argument
    must be replaced by the Jordan/rational-canonical form and C(theta) becomes a block object;
    the rank identity survives on each generalised eigenspace but the bookkeeping changes.
    This must be checked, not assumed.
  - 'Characteristic-2 quadratic-form conventions: the "polar matrix" of a quadratic form in
    char 2 is alternating with an ambiguous diagonal. The i = j blocks carry the quadratic
    parts and the i != j blocks the polar parts, and a convention slip moves rank by O(k).
    The toy check in step 3 exists to catch exactly this.'
  - The specification may define the E_ij not as powers of one matrix but as multiplication
    by k(k+1)/2 distinct field elements in a fixed field representation, which is the same
    thing in different words, or as something genuinely non-commutative, which is not. The
    commutativity defect prediction separates these before any rank is computed.
  - 'A low rank C(theta) over a LARGE extension K may still not yield a usable attack if the
    corresponding MinRank instance is over a matrix of size kn with target corank (k - r)
    n: solvability of that MinRank instance is a separate question this record does not settle.'
  falsification_conditions:
  - Step 3 finds rank(polar of lambda^T P*) != rank C(theta) * rank M_lambda at any toy cell.
    The derivation is then wrong and the record dies immediately.
  - The specification's emulsifier matrices do not commute. The eigen-factorisation does not
    exist and the record collapses to its named null branch.
  - min_theta rank C(theta) = k at every published parameter set AND the null and positive
    controls both behave as predicted. Then whipping introduces no eigen-direction rank defect,
    and the record converts into a scoped negative result supporting MAYO -- which is one
    half of GOAL-MAYO-001's second completion horn.
  interpretation_limits: 'A rank defect found here is a defect in the PUBLIC span over an
    extension field. It is a necessary, not sufficient, precondition for a MinRank attack:
    the resulting instance must still be solved, and its size (kn x kn with corank a constant
    fraction) may put it out of reach of support-minors modelling. Nothing here is a break.
    Conversely, rank C(theta) = k closes only this route and says nothing about non-eigen
    elements of the K-span, about F_q-rational combinations, or about the two-block bilinear
    structure pursued in M1-02. Every parameter tuple used is RECALLED and the record is void
    until the spec is read.'
  assumptions:
  - The MAYO emulsifier matrices lie in a single commutative F_q-algebra (RECALLED).
  - q is a power of 2 for the published MAYO parameter sets (RECALLED, q = 16).
  - The whipped map has the stated bilinear-in-polar-values shape (this is definitional).
  heuristic_assumptions:
  - id: HA-1
    statement: 'For a uniformly random symmetric exponent pattern c on {(i,j) : 1 <= i <=
      j <= k} with entries drawn from Z/ord(theta), and theta a primitive element of K, the
      matrix C(theta)_{ij} = theta^{c(i,j)} has full rank k with probability at least 1 -
      k/|K| * (1 + o(1)).'
    rigorous_ingredient: 'The Schwartz-Zippel bound applied to det C(theta), a polynomial
      in theta of degree at most max_sigma sum_i c(i, sigma(i)) <= k * max c, over the field
      K: the number of roots is at most that degree, so a uniform theta avoids them with probability
      at least 1 - k*max(c)/|K|.'
    distribution_imitated: '"det of a structured Vandermonde-like matrix behaves like a uniformly
      random element of K of its degree" -- the same imitation used when a generic-rank claim
      is made for Cauchy/Vandermonde/Moore matrices.'
    validation_route: 'Sample 10^5 random symmetric exponent patterns c at k = 4, 9, 10, 11,
      12 over K = F_{16^d} for d = 8, 16, 32, compute rank C(theta) for a fixed primitive
      theta, and compare the empirical rate of rank < k against the Schwartz-Zippel bound
      k*max(c)/|K|. Toy scale for k, EXACT for the quantity of interest (rank is an integer,
      not an estimate), so this is not an extrapolation -- it is a direct computation at the
      real k. LABELLED: real-k, real-K, so this is crypto-scale for THIS object even though
      every other measurement in this slice is toy.'
    tail_checks: Record the empirical minimum of rank C(theta) over all samples and over all
      roots, and check that the observed frequency of the worst case is consistent with the
      bound rather than merely below it. A measured rate ORDERS below the bound is expected
      (Schwartz-Zippel is loose); a rate ABOVE the bound indicates the sampling or the degree
      count is wrong.
  - id: HA-2
    statement: The underlying MAYO form lambda^T P has polar matrix M_lambda of rank n - eps
      with eps in {0, 1} for all but a q^{-1}-fraction of lambda in K^m, uniformly in the
      parameter range of the published sets.
    rigorous_ingredient: In characteristic 2 the polar matrix is alternating, hence of even
      rank, so rank <= n - (n mod 2) unconditionally; and the corank-r locus in a space of
      alternating matrices has codimension r(r-1)/2 or r(r+1)/2 depending on parity.
    distribution_imitated: The rank distribution of a uniformly random alternating matrix
      over F_q (the Landsberg / Fisher rank distribution for alternating matrices), which
      assigns mass 1 - O(q^{-2}) to full even rank.
    validation_route: 'On 10^4 toy UOV keys at (q, n, m, o) in {(16,10,6,2), (16,12,8,3),
      (16,16,12,4)}, sample lambda uniformly and tabulate the empirical rank distribution
      of M_lambda against the alternating-matrix rank distribution. TOY SCALE, explicitly:
      this validates the shape of the distribution, not its behaviour at n = 66..133.'
    tail_checks: Compare the observed minimum rank over 10^4 samples against the predicted
      probability of that corank; a minimum far below prediction indicates the UOV structure
      (not randomness) is driving the rank, which would itself be a finding.
  target_complexity:
    time_exponent: The TEST costs O(m * k^3) field operations in K -- negligible, under 2^{30}
      bit operations at every published parameter set. The CONSEQUENCE, if a defect is found,
      is a MinRank instance of size kn x kn over K with target rank r*n; support-minors modelling
      of that instance has time roughly binom(kn, r*n + 1)^{omega} which must be computed
      and compared honestly against MAYO's claimed level -- this record does NOT assert that
      comparison is favourable.
    memory_exponent: 'Test: O(k^2 + m) field elements, negligible. Consequence branch: support-minors
      memory equals its matrix size, binom(kn, r*n) * (x-monomials), which is the binding
      constraint and must be charged in full.'
    best_known_baseline: MAYO's own claimed key-recovery and forgery levels at each parameter
      set (RECALLED as NIST categories 1/3/5; must be read). The relevant published attack
      families are the direct/hybrid attack on the whipped system and oil-space recovery on
      the underlying map.
    hidden_overhead_disclosure: None in the test itself. In the consequence branch, the support-minors
      cost hides the usual "assume the modelling is generic enough to reach the predicted
      degree" overhead, which for structured (Kronecker) instances is exactly the assumption
      most likely to fail.
    time_memory_tradeoff: Not applicable to the test. In the consequence branch, MinRank admits
      a kernel-search variant that trades the huge support-minors memory for q^{r} enumeration;
      that interpolation must be stated before any level is claimed.
  sota_delta: 'As a test: no attack, so no delta. As a structural finding, the two branches
    have quantitatively different values -- rank C(theta) = k contributes a named obstruction
    and closes an attack route at zero cost; rank C(theta) = r < k exhibits a public-span
    element of corank (k - r) * n out of kn, e.g. (k - r) * 66 out of 594 at RECALLED MAYO-1,
    which would be the largest structured rank defect known in the scheme and would require
    MAYO''s key-recovery accounting to be redone.'
  dominated_by: 'For the TEST: nothing -- it is a new zero-cost check and there is no cheaper
    way to obtain min_theta rank C(theta). For the CONSEQUENCE branch: dominated by MAYO''s
    existing best-known attacks unless the resulting MinRank instance is solvable below the
    claimed level, which is not asserted here. Frontier rows checked: direct/hybrid attack
    on the whipped system (time), oil-space recovery via reconciliation/intersection on the
    underlying map (time and memory), IDEA-20260805-74e78c''s delta(C) route (equation count),
    IDEA-20260805-977e16''s alpha* re-accounting (time), and the generic MinRank/support-minors
    row (time and memory). None of these produces min_theta rank C(theta), so the test itself
    is Pareto-undominated on cost.'
  estimated_cost: 'Implementation low: a spec read, a k x k rank routine over an extension
    field, and a toy whipped-key generator that this slice needs anyway. Compute low: minutes.
    Total well under one batch.'
  recommended_priority: high
  honest_prior_of_survival: 'Probability that the derivation (the Kronecker identity) is correct:
    ~0.85 -- it is short and I checked the char-2 block bookkeeping, but the polar/quadratic
    convention in char 2 is exactly where such derivations break. Probability that MAYO''s
    published emulsifier exhibits min_theta rank C(theta) < k: ~0.08 -- designers who choose
    powers of one matrix normally check a non-degeneracy condition, and the additive-pattern
    degeneracy is visible enough that it would have been avoided; but the condition they check
    is plausibly over F_q rather than over the splitting field, which is the entire gap this
    record exploits. Probability the record produces a durable deliverable either way: ~0.9.'
