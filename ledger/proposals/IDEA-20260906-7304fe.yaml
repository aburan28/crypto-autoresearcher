    "title": "Interpolation-defect kernels for jointly target-labeled sections",
    "class": "mechanism",
    "claim": "R3 representation at the function-field section-incidence stage. Joint interpolation may concentrate section-rich surfaces without paying independent rare-section penalties, but only if the compatibility defect and the chance of a Q-informative relation remain small enough after all costs. The discriminating target is a factor-two reduction in cost per informative relation against independent surface sampling, with no claimed attack or exponent.",
    "mechanism": "Object: the shared-coefficient interpolation-defect module for several section identities. Operation set Sigma: add a section identity and its prescribed fibre value, eliminate shared surface coefficients, and retain compatibility constraints. Trichotomy: branching; this is a solver/representation object, not a lossy quotient under the full group translation action. Discarded information: surface coefficients eliminated from the defect module are forgotten but recoverable by certified back-substitution; section identities and labels are never replaced by Gram rank. Choose a nonsingular public fibre E_0/F_p. Require selected sections to specialize to known multiples of P and one to Q, then jointly solve their polynomial identities with the same a(t),b(t) satisfying a(t0)=a0,b(t0)=b0. Eliminate the shared coefficients first; the remaining compatibility module prices the apparent benefit of constructing surfaces from sections instead of sampling surfaces. A relation among resulting sections must have a nonzero Q coefficient modulo subgroup order before it is useful.",
