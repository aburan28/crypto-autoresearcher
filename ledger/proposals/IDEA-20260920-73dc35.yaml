idea:
  id: IDEA-20260920-73dc35
  question_id: RQ-GFPN-4ab8c7
  added: '2026-09-20'
  status: proposed
  approved_by: null
  title: >-
    Oracle-assisted static DH cost for EcGFp5 and EcMasFp5 (absent from both
    design notes)
  class: algorithm
  claim: >-
    Neither EcGFp5 (KN-LIT-8aff72) nor EcMasFp5 (KN-LIT-47d541) analyses the
    oracle-assisted static Diffie-Hellman (OA-SDH) setting. A fully charged
    cost — oracle queries plus offline work — for both curves is a missing
    security surface. Provisional intake band (~2^64 queries, ~2^85–2^93 work)
    is recalled/analysis-only until Joux–Vitse / Granger sources are frozen and
    the arithmetic is re-derived; it must not be cited as evidence.
  mechanism: >-
    After freezing the OA-SDH primary sources, instantiate the standard
    factor-base + static-DH-oracle relation pipeline on both curves at the
    cryptographic parameters as arithmetic, and on a toy-p ladder as executable
    cells. Charge every oracle query and all offline decomposition / linear
    algebra. Compare to ordinary ECDLP rho on the same group order.
  novelty_status: unverified
  origin:
    kind: user_supplied_idea
    date: '2026-09-20'
    scope: GFPN intake high priority; token 73dc35 fixed by user.
    overlap_review: >-
      OA-SDH is classical (Granger, Joux–Vitse). Novelty is the missing analysis
      on these two deployed-shape ZK curves, not the mechanism.
  citations:
    - ref: inputs/PORNIN-2022-274-ECGFP5/paper_fulltext.md
      provenance: retrieved
      claim: Design note contains no OA-SDH analysis.
      verified_by: KN-LIT-8aff72
    - ref: inputs/ECMASFP5-HACKMD-2025/note_fulltext.md
      provenance: retrieved
      claim: Design note contains no OA-SDH analysis.
      verified_by: KN-LIT-47d541
    - ref: research/gfpn_ecmas_ecgfp5_intake_20260920.md
      provenance: internal
      claim: Provisional ~2^64 query / ~2^85–2^93 work intake band; sources to freeze listed.
      verified_by: intake note
    - ref: knowledge/literature/KN-LIT-439.md
      provenance: kb
      claim: Corpus already knows OA-SDH as a named ECDLP variant (Granger / Joux–Vitse).
      verified_by: repository
  citation_note: >-
    Provisional query/work figures are not to be quoted as results. First gate
    is freezing JV/Granger primary texts.
  assumptions:
    - Static-DH oracle is a theoretical model; no live oracle against a deployed system.
    - Query cost and offline cost are reported separately and as a sum.
    - Recalled OA-SDH constants are replaced by frozen-source constants before scoring.
  proof_search_map:
    bottleneck: Whether OA-SDH undercuts the design notes' ≥2^142 ordinary-ECDLP story.
    baseline_embedding:
      parameter_slice: Ordinary ECDLP rho on the same prime-order group.
      reproduction_check: Reproduce a published OA-SDH toy instance before GFPN cells.
    observation_collision:
      observable: Oracle queries and offline work to one static DH shared secret.
      distinct_preimage_search: Both curves plus a prime-field null of similar group order.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Factor-base OA-SDH pipeline on F_{p^5} curves.
        predicted_gain: Cost below rho if the extension structure is usable; magnitude unknown until frozen.
    quantifier_order: Freeze sources and fix the cost model before any cryptographic-p arithmetic.
    method_ceiling:
      strongest_certifiable_claim: Scoped OA-SDH cost under a named model; not a deployed break.
      nearby_object_control: Same pipeline on a curve over F_p (no extension).
    proof_obligations:
      - claim: Every oracle query and offline operation is charged.
        responsibility: runtime
      - claim: No figure is taken from an unfrozen source.
        responsibility: scope
  predictions:
    - metric: oa_sdh_query_count_log2
      direction: different
      minimum_effect: A frozen-source re-derivation yields a stated query exponent; provisional ~64 is replaced or confirmed.
    - metric: oa_sdh_offline_work_log2
      direction: different
      minimum_effect: Offline work stated with model assumptions; provisional 85–93 replaced or confirmed.
  minimal_test:
    design: >-
      (1) Freeze JV/Granger. (2) Re-derive OA-SDH cost formulas. (3) Execute a
      toy-p OA-SDH cell end-to-end with query accounting. (4) Arithmetic-only
      table at cryptographic p under numbered assumptions.
    controls:
      - Prime-field null curve.
      - Ordinary ECDLP rho column on the same group.
    required_metrics:
      - oracle_queries
      - offline_field_ops_or_solver_cost
      - total_charged_cost_log2
  falsification_conditions:
    - After freeze, OA-SDH cost is ≥ rho under every reasonable model (avenue weakens).
    - Design notes are shown to already cover OA-SDH (claim of absence falsified).
  confounders:
    - Counting only offline work.
    - Using recalled constants after a freeze exists.
  interpretation_limits:
    - OA-SDH is a weaker assumption than ECDLP; a low OA-SDH cost is not an ECDLP break.
  heuristic_assumptions:
    - Standard OA-SDH decomposition heuristics once sources are frozen.
  heuristic_note: No heuristic may cite the provisional intake band as support.
  target_complexity:
    time_exponent: Unknown pending freeze.
    memory_exponent: Unknown.
    best_known: Design notes omit OA-SDH; ordinary ECDLP claim ≥2^142 (Pornin).
    hidden_overhead: Oracle model vs real interaction assumptions.
    tradeoff_note: Query/offline tradeoffs must be tabulated.
  estimated_cost:
    implementation: medium
    compute: medium
    qualification: Blocked on JV/Granger freeze before any number is evidence.
  dominated_by: unchecked
  sota_delta:
    time: Unmeasured.
    memory: Unmeasured.
    data_queries: Unmeasured.
  frontier_check:
    status: pending
    note: First action is source freeze, not an experiment launch.
  recommended_priority: high
  priority_rationale: Missing analysis on both design notes for a standard stronger attacker model.
  first_deliverable: Frozen JV/Granger package + re-derived cost worksheet.
  next_gate: Source freeze; then /design-experiment.
