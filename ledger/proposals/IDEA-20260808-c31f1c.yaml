idea:
  id: IDEA-20260808-c31f1c
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  title: 'Beyond intervals: rank-r generalized arithmetic progressions are the full lattice-describable
    factor-base family, affine changes of variable make all rank-1 GAPs equivalent, and only
    rank r >= 2 changes the Newton polytope the solver sees.'
  class: representation
  claim: 'The classification in E1-01 leaves "lattice-describable" as the one open factor-base
    family; this record delimits it. (A) INVARIANCE LEMMA: for any arithmetic progression
    V = {a + b*u : 0 <= u < B}, the substitution x = a + b*u is an invertible affine change
    of variable over F_p, so the summation system''s Newton polytope, and hence any small-root
    solver''s reach eps, is IDENTICAL to the interval case. Therefore there is no design freedom
    among rank-1 GAPs: all B-element APs are equivalent factor bases for both yield (KN-FIND-007)
    and solve (this lemma). (B) RANK LEVER: for a rank-r GAP V = {sum_{j<=r} a_j u_j : 0 <=
    u_j < B^{1/r}}, the substitution introduces r variables per slot with bounds B^{1/r} each;
    the system acquires m*r unknowns with the same total box volume B^m but a different polytope,
    and the small-root reach eps_r is a genuinely different number from eps_1. The claim is
    that eps_r is computable by the same Jochemsz-May procedure and that comparing eps_r against
    eps_1 decides whether the lattice-describable family has any internal design freedom at
    all.'
  mechanism: 'Small-root bounds depend on the Newton polytope and on the bound vector, not
    on the polynomial''s coefficients, which is why affine substitution is neutral. Splitting
    one bounded variable into r bounded variables with the same product does change the polytope:
    it replaces a single axis of extent d by an r-dimensional simplex-like structure of the
    same total degree, and the Jochemsz-May "extended strategy" is sensitive to that shape.
    More variables with smaller bounds is the configuration that historically HELPS lattice
    methods (it is why linear modular equations in many small unknowns are solvable up to
    the information bound), so the rank lever is the one place inside this family where the
    reach could plausibly rise toward eps -> 1.'
  why_not_a_renamed_known_approach: 'Not "choose a structured factor base" in the KN-FIND-007
    sense: yield is invariant here and no yield claim is made. Not the H-STR-002 GLV/phi-invariant
    line, which was weakened and whose only reproducible effect was a ~3x relation-collection
    constant; GAPs are not orbits of an automorphism and no displacement-rank claim is made.
    Not KN-TECH-007 (BKK): that reshapes the polytope by sparsity of the polynomial, this
    reshapes it by the variable substitution, and the two are composable but distinct.'
  predictions:
  - observable: reach for an AP factor base vs an interval factor base
    metric: eps-hat measured by planted-root recovery at matched B and p
    predicted: identical to measurement precision; a difference falsifies the invariance lemma
      and would indicate an implementation artifact
  - observable: reach for rank-2 GAP at matched total size
    metric: eps-hat_2 vs eps-hat_1 at B = 2^{16}, p ~ 2^24, m = 3
    predicted: eps-hat_2 > eps-hat_1 by a measurable margin if the "more variables, smaller
      bounds" intuition transfers; equal or lower if the degree growth per new variable cancels
      it. Both outcomes are informative and neither is assumed
  - observable: yield
    metric: decompositions per target for AP, interval and rank-2 GAP at matched size
    predicted: identical (KN-FIND-007 exact mean), with coverage differing at most by the
      Sidon-ceiling factor 1.107; a yield difference beyond that is an additive-structure
      artifact and must be reported
  minimal_test: 'Two-arm toy sweep at p ~ 2^24, m = 3, matched |V|: (i) interval, (ii) AP
    with random a, b, (iii) rank-2 GAP with random a_1, a_2. Measure planted-root recovery
    threshold and exact decomposition counts. The AP arm is the invariance control; the GAP
    arm is the experiment; the interval arm is the reference.'
  controls:
  - AP arm as an invariance control (must match the interval arm exactly).
  - Random-subset arm of equal size (must fail recovery entirely).
  - Exhaustive enumeration ground truth at the smallest cell.
  confounders:
  - A rank-2 GAP can be degenerate (a_1, a_2 multiplicatively related), collapsing to rank
    1; generators must be tested for genuine rank.
  - GAPs can overlap themselves, so |V| < B^{...}; measured size must be used, not nominal.
  falsification_conditions:
  - AP and interval arms differ in reach => the invariance lemma is wrong (most likely an
    implementation bug, which must be found before the GAP arm is interpreted).
  - eps-hat_2 <= eps-hat_1 for every tested configuration => the lattice-describable family
    has no internal design freedom and E1-01 stands or falls on the interval case alone, which
    simplifies the closure argument considerably.
  interpretation_limits: Reach measurements at toy p are toy and calibrate shape, not crypto-scale
    values. The invariance lemma is exact and needs no experiment; the experiment on it is
    a control.
  assumptions:
  - Small-root reach depends only on the Newton polytope and the bound vector.
  - Semaev system as in KN-TECH-002.
  heuristic_assumptions:
  - id: HA-1
    statement: A random rank-r GAP of nominal size B has actual size (1 - o(1))B, i.e. self-overlaps
      are negligible for r <= 3 and B <= p^{1/2}.
    rigorous_ingredient: '"Counting: overlaps require nontrivial linear relations among the
      a_j mod p, which are rare for random a_j."'
    distribution_imitated: '"Genericity of random linear forms mod p."'
    validation_route: '"Toy: measure |V| directly for 10^3 random GAPs at each rank; compare
      to nominal."'
    tail_checks: '"Any GAP with |V| below 0.9 * nominal is degenerate and must be excluded,
      not averaged in."'
  target_complexity:
    time_exponent: No exponent by itself; it supplies the parameter eps_r that E1-01's threshold
      eps > m/(2(m-1)) is evaluated against. If eps_r > eps_1 the E1-01 threshold becomes
      easier by exactly that margin.
    memory_exponent: '"N^{beta}, unchanged."'
    best_known_baseline: '"rho N^{1/2}."'
    hidden_overhead_disclosure: '"Lattice dimension grows with r (m*r variables), so LLL cost
      grows polynomially in r; charged, not hidden."'
    time_memory_tradeoff: '"n/a."'
  sota_delta: 'Zero directly. It is a required building block for E1-01: it either supplies
    a better eps or it closes the last design freedom in the last open factor-base family,
    and it says so.'
  dominated_by: 'Pollard rho / vOW at N^{1/2}, memory O(1) (as with all of E1-01''s family
    until eps clears the threshold). Frontier rows checked: rho/vOW, BSGS, Kuhn-Struik, preprocessing
    frontier, special-curve attacks.'
  estimated_cost: '"Implementation low (reuses the E1-01 harness with a substitution layer);
    compute low."'
  recommended_priority: medium
  honest_prior_of_survival: ~0.95 that the invariance lemma holds (it is a change of variable).
    ~0.2 that rank >= 2 measurably improves reach; ~0.05 that the improvement is large enough
    to matter for the E1-01 threshold.
