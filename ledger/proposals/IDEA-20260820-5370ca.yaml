idea:
  id: IDEA-20260820-5370ca
  question_id: RQ-SQISIGN-001
  added: '2026-08-20'
  title: Certificate-carrying likelihood branch-and-bound over ideal fibres
  class: algorithmic_decoder
  claim: >-
    A transcript score is useful for SQIsign secret recovery only if it can be
    compiled into a decoder that returns a coverage-certified list of ideals
    reproducing the public curve. This proposal tests whether interval-bounded
    transcript likelihoods can prune an explicitly generated ideal fibre enough
    to beat a fully charged current baseline. It asserts no present shrinkage,
    key recovery, or hard-problem improvement.
  mechanism: >-
    Fix a public key and a deterministic, auditable generator for candidate
    ideal representatives whose associated isogenies reproduce that public
    curve. Organize the candidates as a refinement tree. For every node, derive
    an upper interval on the best cumulative real-signer-versus-genuine-simulator
    score attainable by any descendant after q signatures. Retain nodes whose
    interval crosses a pre-registered coverage threshold and prune the rest.
    The output is not a classifier bit: it is a list L of ideal representatives,
    a public-curve reproduction witness for every member, and a replayable
    pruning certificate containing the interval bound used at every cut. Charge
    candidate generation, score construction, simulator queries, preprocessing,
    certificate production, and certificate verification before comparing L
    with KN-TECH-058 and KN-TECH-057.
  novelty_status: unverified
  status: proposed
  source_refs:
    - id: RQ-SQISIGN-001
      provenance: internal
      use: Defines the real-versus-genuine-simulator and public-curve-output boundary.
    - id: KN-TECH-058
      provenance: internal
      use: >-
        Current Fp2 comparison: unconditional p^(1/2)(log p)^O(1) time with
        polynomial memory, and conditional p^(1/3+o(1)) time and memory only
        under Heuristic 1, with hidden superpolynomial overhead and no concrete
        cost conclusion; reductions remain unverified and the GRH boundary binds.
    - id: KN-TECH-057
      provenance: internal
      use: Fully charged frontier rows, including the separate conditional Fp p^(1/4) mixing row.
    - id: EXP-SSI-7c41d9
      provenance: internal
      use: >-
        Three-replicate qualified toy true-simulator work; unarchived and therefore
        a design pointer, not evidence for this proposal.
    - id: KN-LIT-1248
      provenance: kb
      use: Unreviewed ideal-to-isogeny preprint pointer; it does not support novelty or correctness.
  predictions:
    - id: P1
      statement: >-
        Under a planted candidate-dependent score gap of lambda bits per signature,
        median certified log2 fibre shrinkage after q signatures is at least
        q*lambda minus the pre-registered multiple-testing and interval slack.
    - id: P2
      statement: >-
        Under a genuine simulator null, the true-candidate coverage failure rate is
        at most delta and apparent shrinkage disappears as the planted gap goes to zero.
    - id: P3
      statement: >-
        Any claimed exponent gain survives only when candidate generation, all q
        oracle calls, preprocessing, list materialization, and certificate verification
        are included; otherwise the outcome is baseline-dominated.
    - id: P4
      statement: Every returned ideal passes an independently implemented public-curve reproduction check.
  controls:
    genuine_simulator_null: >-
      Generate transcripts with the scheme's genuine simulator at matched public
      keys, messages, signature counts, rejection behavior, and byte encoding;
      run the identical scorer, tree, pruning rule, and verifier.
    planted_positive_control: >-
      Inject a keyed score tilt of known lambda into otherwise simulated transcripts,
      sweep lambda to zero, and require measured certified shrinkage to track the
      registered q*lambda law without changing candidate generation.
    nearby_object_control: >-
      Replace each candidate ideal by a public-curve-compatible randomized label
      with the same tree shape and score marginals; pruning should lose secret localization.
  falsification_conditions:
    - The genuine-simulator null produces non-vanishing shrinkage as lambda tends to zero.
    - The planted true ideal is excluded more often than delta under held-out repetitions.
    - A pruning certificate cannot be checked without secret information or regenerating the full search.
    - Candidate generation or verification restores the KN-TECH-058 baseline exponent or exceeds its concrete row.
    - Returned objects do not reproduce the public curve under an independent checker.
  confounders:
    - Variable-time rejection or conversion retries can masquerade as transcript information.
    - Multiple encodings of one ideal can create artificial list shrinkage.
    - Score calibration on the same transcripts used for pruning can invalidate coverage.
    - A toy fibre generator can hide cryptographic-scale preprocessing.
  interpretation_limits:
    - Passing toy controls would establish only decoder plumbing at the tested parameters.
    - A distinguisher or entropy estimate without a public-curve-reproducing ideal list is outside the claim.
    - SSI hard-problem conclusions and scheme-wide security transitions belong to GOAL-SSI-001 and the Coordinator.
    - No conditional KN-TECH-058 comparison is valid without carrying Heuristic 1, hidden overhead, unverified reductions, and the GRH boundary.
  heuristic_assumptions:
    - id: H1
      statement: Node score intervals upper-bound every descendant score with simultaneous probability at least 1-delta.
      falsification: Empirical or formal counterexample violates descendant coverage.
    - id: H2
      statement: Candidate generation is complete for the declared fibre and quotient convention.
      falsification: A valid public-curve-reproducing ideal lies outside the generated universe.
  target_complexity:
    baseline: >-
      Compare separately with unconditional Fp2 p^(1/2)(log p)^O(1) time and
      polynomial memory, conditional KN-TECH-058 p^(1/3+o(1)) time and memory
      under Heuristic 1 with hidden superpolynomial overhead, and the distinct
      conditional Fp p^(1/4) mixing row in KN-TECH-057.
    candidate_bound: >-
      For initial fibre size N(p)=p^beta and certified shrinkage s(q,p) bits,
      require |L| <= 2^(log2 N-s) with coverage at least 1-delta.
    success_accounting: Per-attempt total cost multiplied by inverse list-coverage and verification-success probability.
    exponent_claim: none
  cost_model:
    time: T_gen(p)+q*T_score(p)+T_tree(p,q)+T_cert(p,q)+T_verify(p,q)
    memory: M_fibre(p)+M_frontier(p,q)+M_cert(p,q)
    data_queries: q real signatures plus a separately reported calibration and holdout count
    preprocessing: Public-key-specific fibre generation and score-interval construction, never amortized unless the reuse population is declared.
    oracle: Every signer or genuine-simulator call, including retries and failures, is counted.
    verification: Independent public-curve reproduction for every list member plus every pruning-certificate node.
  proof_search_map:
    exact_baseline_reproduction:
      plan: Reproduce the charged KN-TECH-058 and KN-TECH-057 rows symbolically before inserting any shrinkage term.
      pass_condition: Every omitted factor is identified and the conditional rows retain their assumptions and overhead.
    observation_collision_search:
      plan: Find inequivalent candidate ideals with identical q-transcript score vectors and bound the largest collision class.
      pass_condition: The list-size theorem explicitly retains the measured or proved collision multiplicity.
    quantifier_order_statement:
      plan: State whether the key, candidate universe, calibration sample, messages, and q transcripts are fixed or sampled before the coverage probability.
      pass_condition: Simultaneous coverage is over all pruned nodes and not only an average candidate.
    method_ceiling:
      plan: Set the planted gap to zero and derive the smallest possible list under score collisions and certificate overhead.
      pass_condition: The ceiling cannot imply a gain in the genuine-simulator null.
    nearby_object_control:
      plan: Run the same proof skeleton on randomized candidate labels with matched tree shape and score marginals.
      pass_condition: Any secret-specific list shrinkage vanishes.
  nearest_neighbors:
    - id: IDEA-20260808-19876e
      discriminator: Adds an explicit list decoder and certificate; a constant distinguisher alone cannot change the exponent.
    - id: IDEA-20260808-287361
      discriminator: Compiles calibrated score intervals into a public-curve-reproducing candidate list instead of only estimating a posterior or entropy.
    - id: KN-TECH-058
      discriminator: Uses the current charged hard-problem row as a comparator and claims no replacement for it.
  dominated_by: n/a (no result claimed)
  sota_delta: >-
    Proposed measurable delta only: Delta_list(q,p)=s(q,p)/log2(p) in the
    candidate-list exponent, and Delta_e2e=max(0,alpha_baseline-alpha_total)
    after all six cost axes and inverse success are charged. Both are currently 0
    because no decoder result exists.
  priority: high
  cost: medium
  prior: 0.10
  provenance: agent_generated_under_TASK-20260820-a3c65a
