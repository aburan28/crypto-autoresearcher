idea:
  id: IDEA-20260808-5ee6b4
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ECTD-001
  goal_id: GOAL-ECTD-001
  title: An isogeny-class trapdoor has exactly log_2 h(O) = (1/2) log_2 p + O(log log p) bits
    of secret entropy, which coincides with the curve's own security level - so it operates
    at ZERO margin, and it collapses to p^{1/4} the moment the weak set is a coset of a subgroup
    of Cl(O), because a coset target admits meet-in-the-middle in the class group while an
    unstructured predicate does not
  class: mechanism
  claim: "(A) THE ENTROPY IDENTITY. A Teske-style designer's secret is the position of the\
    \ weak endpoint E_s inside the F_p-isogeny class of E_pub. By T1/T2 the class is a Cl(O)-torsor\
    \ of size h(O), so the secret carries at most log_2 h(O) bits. With h(O) = |D|^{1/2 +\
    \ o(1)} and |D| of order p, that is (1/2) log_2 p + O(log log p) bits - the SAME as the\
    \ security level log_2(0.886 sqrt(N)) of the curve itself. An isogeny-class trapdoor therefore\
    \ has no entropy margin: the address is exactly as long as the key. (B) THE ATTACKER'S\
    \ TWO OPTIONS, PRICED. (i) Ignore the trapdoor and run rho: 0.886 sqrt(N) group operations,\
    \ O(1) memory. (ii) Walk the class and test each curve for the weakness predicate W: expected\
    \ (h/g) * tau operations where g = #{E' in class : W(E')} and tau is one isogeny step\
    \ plus one W-test. With g small these are the same exponent, so the trapdoor neither gains\
    \ nor loses an exponent - it is exactly at the boundary. (C) THE COLLAPSE, WHICH IS THE\
    \ RECORD'S ACTUAL CONTENT. Option (ii) is a LINEAR scan because an arbitrary predicate\
    \ W gives the attacker no algebraic target. But if the weak set W is a UNION OF COSETS\
    \ of a subgroup H <= Cl(O) of index m, the attacker is no longer scanning: locating a\
    \ coset of H is a vectorization-type problem on the quotient torsor Cl(O)/H of size m,\
    \ solvable by meet-in-the-middle / kangaroo in O(sqrt(m)) class-group action evaluations\
    \ (Galbraith-Hess-Smart-style baby-step giant-step on an abelian group action) [recall-confident].\
    \ Taking m = h (i.e. H trivial, a single weak curve, but with the weak set *recognisable\
    \ as a coset*) gives sqrt(h) = p^{1/4} - HALF THE EXPONENT of rho. So:\n    unstructured\
    \ weak predicate  ->  attacker pays h * tau ~ p^{1/2}\n    coset-structured weak set \
    \   ->  attacker pays sqrt(h) ~ p^{1/4}\nand the entire security of an isogeny-class trapdoor\
    \ rests on the weak set having NO subgroup structure in Cl(O). (D) WHAT THIS DEMANDS OF\
    \ EVERY CANDIDATE ENDPOINT FAMILY, AS A CHECKLIST. For each candidate weakness the designer\
    \ must exhibit that W is not a union of Cl(O)-cosets. Two worked cases, opposite in outcome:\n\
    \  - \"E_s has endomorphism ring O' of conductor divisible by q\" - the set of\n    curves\
    \ with End = O' is a Cl(O')-TORSOR, not a coset of a subgroup of\n    Cl(O); the two class\
    \ groups are related by the surjection\n    Cl(O') ->> Cl(O_K) but the level sets are\
    \ not cosets of a subgroup of\n    the ACTING group on the crater. Not obviously collapsible:\
    \ this\n    candidate survives (C) and is the reason lane priority (2) is not\n    closed\
    \ by this record.\n  - \"E_s lies in the kernel of a self-pairing / a character of Cl(O)\"\
    \ -\n    the level sets of a character ARE cosets of its kernel, index m = order\n   \
    \ of the character. This family collapses to sqrt(m) immediately. Any\n    proposal whose\
    \ weakness is defined by a class-group character is dead\n    on arrival, and this record\
    \ is what kills it."
  mechanism: The class is a torsor under an abelian group whose structure is computable (in
    subexponential time, and instantly at toy scale). Searching a torsor for an element satisfying
    an arbitrary predicate is a linear scan; searching for an element in a coset of a known
    subgroup is a discrete-log-shaped problem and therefore square-root-able. The security
    of hiding a curve in its isogeny class is exactly the difference between those two situations,
    and no other feature of the trapdoor changes it.
  why_not_a_renamed_known_approach: 'Nearest known: the CSIDH vectorization cost sqrt(h) (KN-TECH-027)
    applied to the case where BOTH endpoints are known. That is not this: here one endpoint
    is unknown and only a predicate on it is known, which is why the generic case is a linear
    scan and not sqrt(h). The record''s content is the DICHOTOMY between predicate shapes
    and the fact that it moves the exponent by a factor of two. Nearest second: IDEA-20260805-4243e6,
    which establishes that the designer''s endpoint set is exactly the isogeny class; that
    record fixes the search space, this one prices searching it and says which search spaces
    are square-root-able.'
  predictions:
  - observable: entropy of the class address versus the security level
    metric: log_2 h(O) minus log_2(0.886 sqrt(N)), computed exactly on >= 200 toy ordinary
      classes at 24-32 bits
    predicted: the difference lies within +- 3 log_2 log p bits and does not drift with p;
      it is NOT bounded away from zero in either direction (so the trapdoor is at the boundary,
      not comfortably inside or outside it)
  - observable: collapse under coset structure
    metric: measured class-group operations to locate a curve in a designated coset of a subgroup
      of index m, by baby-step giant-step on the action, at m = 2^8 ... 2^16 in toy classes
    predicted: scaling as m^{1/2} with a small constant, against m for the linear scan; the
      crossover is immediate (m >= 4), so the collapse is not an asymptotic curiosity
  - observable: whether a natural weakness predicate is coset-structured
    metric: for each of the three named candidate endpoint families (conductor level; small
      |D_0| - impossible, since D_0 is a class invariant; and class-group-character kernels),
      a yes/no coset determination
    predicted: character kernels YES (collapse), conductor level NO (survives), and the third
      family is empty because D_0 is a class invariant (T4)
  minimal_test: Toy, arithmetic only. (i) On 200 toy classes at 24-32 bits compute h(O) and
    N; report the entropy gap distribution. (ii) In one toy class with h ~ 2^14, implement
    the class-group action by small-ell isogeny steps, pick a subgroup H of index m, and measure
    the cost of locating a curve in a designated coset by (a) linear scan and (b) baby-step
    giant-step, at m = 2^8, 2^10, 2^12, 2^14. (iii) For each named endpoint family, decide
    by inspection whether its level sets are unions of H-cosets, and record the determination
    with its argument. Part (ii) is the only part needing code and it reuses whatever isogeny-step
    implementation lane L2 builds.
  controls:
  - 'NULL PREDICATE: run the search with W a uniformly random subset of the class of the same
    size g. The baby-step giant-step arm MUST fail to beat the linear scan there. If it wins
    on a random subset, the implementation is exploiting something other than coset structure
    and the dichotomy is not being measured.'
  - 'PLANTED COSET: a coset of a known subgroup, where the speedup must appear at the predicted
    m^{1/2}. Two-directional control.'
  - Two independent class-group structure computations (form composition vs isogeny-graph
    traversal) to ensure the subgroup H is the same object in both arms.
  confounders:
  - Toy class groups are small enough that a linear scan is fast in absolute terms; the comparison
    must be in ACTION EVALUATIONS, never in seconds.
  - Cl(O) is often close to cyclic; a cyclic group makes coset location especially easy and
    could overstate the collapse. Report the group structure of each tested Cl(O) alongside
    the timing.
  - The entropy identity uses h(O) for the ACTUAL endomorphism ring; using h(O_K) instead
    understates the entropy by the conductor factor.
  falsification_conditions:
  - 'Measured entropy gap drifting systematically with p (say growing like log p rather than
    log log p): the identity in (A) is mis-stated and the "zero margin" conclusion fails.'
  - 'Baby-step giant-step failing to achieve m^{1/2} on a genuine coset: the collapse in (C)
    is wrong, and coset-structured weak sets are safe after all - which would be good news
    for the trapdoor goal.'
  - 'Baby-step giant-step succeeding on the random-subset null: the instrument is broken and
    neither direction may be concluded.'
  interpretation_limits: 'This prices HIDING, not weakness. It says nothing about whether
    any weak endpoint exists - GOAL-ECTD-001''s harder half - and a trapdoor with no weak
    endpoint is not made real by having good hiding. Toy scale for the measurements; the entropy
    identity is asymptotic with an ineffective o(1) (Siegel). The p^{1/4} collapse applies
    to the ATTACKER of a trapdoor, not to plain ECDLP: it does not threaten any ordinary curve,
    because a plain curve has no weak endpoint to locate.'
  assumptions:
  - T1/T2 transport and the simply-transitive Cl(O) action on the crater [corpus, DECOMPOSITION.md].
  - h(O) = |D|^{1/2+o(1)} (Siegel) and |D| of order p for non-degenerate t.
  - Square-root algorithms for locating an element in a coset of a known subgroup of an abelian
    group acting freely (baby-step giant-step / kangaroo on group actions) [recall-confident;
    KN-TECH-027 records the CSIDH analogue].
  heuristic_assumptions:
  - id: HA-1
    statement: 'For toy ordinary classes sampled uniformly over curves, Cl(O) has a subgroup
      structure rich enough that the coset experiment is not degenerate: specifically, for
      at least half of sampled classes there exists a subgroup of index m in [2^8, 2^14].'
    rigorous_ingredient: The Cohen-Lenstra-type structure of class groups of imaginary quadratic
      orders (a heuristic in general, but the EXISTENCE of a subgroup of a given index is
      a computable property of each sampled class, so the assumption is only about how often
      sampling succeeds, never about the conclusion).
    distribution_imitated: Cohen-Lenstra heuristics for the distribution of the odd part of
      Cl(O).
    validation_route: 'Directly measured: compute Cl(O) for each sampled toy class and tabulate
      divisors of h. TOY SCALE only; at crypto scale h is not computable without subexponential
      work and this record does not claim crypto-scale validation.'
    tail_checks: Report the fraction of sampled classes with h prime (no proper subgroup -
      the degenerate cell), against the Cohen-Lenstra prediction for cyclicity.
  - id: HA-2
    statement: It is ASSUMED, not proved, that a weakness predicate that is not a union of
      cosets admits no better-than-linear search in the torsor. This is the standing state
      of the art for unstructured search over an abelian group action.
    rigorous_ingredient: Generic lower bounds for unstructured search; the absence of any
      published sub-linear algorithm for predicate search on a group action.
    distribution_imitated: not_applicable
    validation_route: Literature scan when web access is restored; until then the assumption
      is flagged and the "unstructured predicates are safe" half is stated as conditional.
    tail_checks: not_applicable
  target_complexity:
    time_exponent: 'The record identifies an exponent MOVE against a trapdoor, not against
      ECDLP: p^{1/2} -> p^{1/4} for locating a coset-structured weak endpoint, with the standing
      ECDLP exponent unchanged at 1/2. This is an exponent-first result in the defensive direction
      and is flagged as such.'
    memory_exponent: The coset attack needs p^{1/8} memory for a balanced baby-step giant-step
      on a torsor of size m = h ~ p^{1/2}; with kangaroo it needs O(1) memory and time p^{1/4}
      up to constants. Both are far inside the rho frontier in memory.
    best_known_baseline: Linear scan of the class, h * tau ~ p^{1/2+o(1)}; and rho on the
      curve at 0.886 sqrt(N), which the attacker can always fall back on.
    hidden_overhead_disclosure: 'The class-group action must be computable, which requires
      knowing Cl(O) - subexponential L_{|D|}(1/2) at crypto scale. That cost is inside the
      "action evaluation" unit and is NOT hidden: for a crypto-scale trapdoor the p^{1/4}
      figure is p^{1/4} ACTIONS, each of which presupposes a subexponential precomputation.'
    time_memory_tradeoff: 'Kangaroo on the quotient torsor interpolates: time sqrt(m/w) *
      something with w stored distinguished points, the standard van Oorschot-Wiener shape,
      and it parallelises linearly.'
  sota_delta: 'Zero against plain ECDLP. Against a hypothetical class-hiding trapdoor: a factor-two
    exponent reduction (1/2 -> 1/4) whenever the weak set is coset-structured, plus an exact
    entropy accounting that says the trapdoor is at zero margin even when it is not.'
  dominated_by: 'For plain ECDLP: dominated by rho on every axis (this record proposes no
    ECDLP algorithm). Frontier rows checked: rho 0.886 sqrt(N) / O(1); BSGS sqrt(N) / sqrt(N);
    automorphism-discounted rho 0.886 sqrt(N/r) / O(1); van Oorschot-Wiener sqrt(N^3/w) /
    w. For the trapdoor-location problem the p^{1/4} coset attack is, to the author''s knowledge
    after corpus screening, not dominated by any recorded row - but that problem is not on
    the ECDLP frontier and the comparison is therefore against an empty column, which is stated
    rather than papered over.'
  estimated_cost: 'Implementation: medium (needs a working class-group action on toy classes
    - the same dependency lane L2 already has). Compute: low.'
  recommended_priority: high
  honest_prior_of_survival: 0.85 that the entropy identity measures as predicted. 0.8 that
    the coset collapse is demonstrated at toy scale (it is standard BSGS on a group action).
    0.4 that it ever binds on a real candidate, since the record's own analysis says the most-favoured
    candidate family (conductor level) is NOT coset-structured. Filed high because it is a
    cheap gate that any future ECTD proposal must pass, and because it kills the character-kernel
    family outright.
