idea:
  id: IDEA-20260901-c7e601
  question_id: RQ-VOLC-f6253b
  research_question: RQ-VOLC-f6253b
  goal_id: GOAL-ENDO-001
  added: '2026-09-01'
  title: >-
    HEIGHT ABOVE THE ell-FLOOR IS EXACTLY THE ell-ADIC PRECISION TO WHICH FROBENIUS
    IS A SCALAR, SO IT IS READ OFF THE SEMISIMPLICITY OF pi ON E[ell] WITHOUT
    WALKING ANYTHING: the degree d_ell(E) of the field of definition of the full
    ell-torsion equals ord(A mod ell) above the floor and ell times that at the
    floor -- a never-vacuous two-valued indicator costing O~(ell^2 log p) field
    operations against the O~(ell^3 h^2) of Fouquet-Morain walking, which strictly
    generalizes the rational-full-ell-torsion criterion of IDEA-20260807-cbe8c1
    from the A = 1 mod ell case to every A, and which forces H-VOLC-0e303a's
    COST-versus-INVISIBILITY dichotomy onto the invisibility branch for small ell
  class: algorithm

  claim: >-
    FIVE SEPARABLE CLAIMS. (A) AND (B) ARE DERIVATIONS COSTING NO COMPUTE. (C) IS
    THE COST STATEMENT. (D) IS THE DISCRIMINATION THE MEASUREMENT DELIVERS. (E) IS
    WHAT IS NOT CLAIMED.

    (A) HEIGHT IS SCALAR-PRECISION. Let E/F_p be ordinary with trace t,
    D = t^2 - 4p = f^2 D_0, End_{F_p}(E) = O_{f_E}, m = f/f_E = [O_{f_E} : Z[pi]],
    and pi = A + m theta as in IDEA-20260808-4d77a6. For a prime ell and an
    integer k >= 1 the following are EQUIVALENT:
      (i)   ell^k divides m, i.e. E sits at height at least k above the ell-floor
            (equivalently v_ell(f_E) <= v_ell(f) - k);
      (ii)  (pi - A)/ell^k is an endomorphism of E;
      (iii) pi acts on E[ell^k] as the scalar A mod ell^k.
    The implication (ii) => (iii) is immediate: if pi - A = ell^k psi then for
    T in E[ell^k], (pi - A)(T) = psi([ell^k] T) = O. The converse holds because
    E[ell^k] = ker[ell^k], and an isogeny vanishing on ker[ell^k] factors through
    [ell^k]. So HEIGHT ABOVE THE FLOOR IS THE ell-ADIC PRECISION TO WHICH
    FROBENIUS IS A SCALAR, exactly, with no approximation and no heuristic.

    (B) THE FIRST BIT IS READ OFF A GALOIS DEGREE, AND IT IS NEVER VACUOUS. For
    ell | f the characteristic polynomial of pi on E[ell] is (X - A)^2 mod ell,
    which is CLASS-DETERMINED and therefore carries no per-curve information. What
    is NOT determined by it is whether the matrix of pi on E[ell] is the SCALAR
    A * I or a non-trivial Jordan block -- and by (A) it is scalar exactly when
    ell | m, i.e. exactly when E is above the ell-floor. That distinction is
    visible in one publicly computable number, the degree
      d_ell(E) := [ F_p(E[ell]) : F_p ]  =  the order of the matrix of pi in GL_2(F_ell),
    which equals
      ord(A mod ell)          if E is above the ell-floor (pi scalar on E[ell]),
      ell * ord(A mod ell)    if E is at the ell-floor (non-trivial Jordan block).
    The two values differ by the factor ell for EVERY class with ell | f and every
    residue A, with no side condition. This is the never-vacuous property, and it
    is precisely what IDEA-20260807-cbe8c1's criterion lacks: that record's exact
    condition for full rational ell-torsion is ell | (m - 1) AND ell f_E | c, whose
    first clause is class-fixed and fails for most classes, making the indicator
    identically absent there. The present indicator is the same phenomenon read at
    the level of the GALOIS DEGREE rather than of rationality, and rationality is
    the special case ord(A mod ell) = 1.

    (C) THE COST, WITH ITS HONEST CROSSOVER. The first bit -- floor versus
    non-floor at ell -- costs one ell-torsion computation:
    O~(ell^{2 + o(1)} log p) field operations by computing the ell-division
    polynomial of degree (ell^2 - 1)/2 and determining the order of Frobenius on
    its splitting data, or O~(d_ell * log p) point operations over F_{p^{d_ell}}
    when the torsion field is small enough to work in directly. The FULL height k
    costs O~(ell^{2k + o(1)} log p) by the same route applied to E[ell^k]. The
    incumbent is Fouquet-Morain walking at O(ell h^2) isogeny computations of
    O~(ell^2) field operations each, i.e. O~(ell^3 h^2), which is the obstruction
    component (III) of H-VOLC-0e303a. So there is a genuine crossover surface and
    the record does not pretend otherwise: the torsion criterion strictly wins for
    the floor indicator and for small k, at a saving of a factor ell h^2; walking
    wins for large k at fixed small ell, because ell^{2k} beats h^2 only while
    2k log ell < 2 log h + 3 log ell. Both regimes are measurable and the
    crossover is a deliverable, not a claim.

    (D) WHAT THE MEASUREMENT DISCRIMINATES. H-VOLC-0e303a states the lane's
    dichotomy: either the level is expensive (COST -- any depth-consuming attack
    must pay a subexponential endomorphism-ring computation) or the level is cheap
    but useless (INVISIBILITY). Those are different closures with different
    forward guidance and the program has not decided between them. This record
    forces the decision for small ell: if (B) holds as measured, the FLOOR
    INDICATOR at small ell is polynomial and cheap, the COST branch is refuted at
    small ell, and the lane's negative -- if it stays negative -- must be recorded
    as INVISIBILITY with a named obstruction rather than as expense. If (B) fails
    as measured, the COST branch survives at small ell too and the obstruction is
    strengthened rather than weakened. Both outcomes move the campaign.

    (E) WHAT IS NOT CLAIMED. NOT a subexponential endomorphism-ring algorithm:
    the full ring needs every ell | f including large ones, where ell^{2k} is
    prohibitive and nothing here helps; the published subexponential algorithms
    are untouched. NOT an ECDLP speedup of any kind; sota_delta against the attack
    frontier is +0 in every branch, since the level so obtained is still a
    curve-only constant which IDEA-20260807-4f43ac argues is generic-group
    simulable and which IDEA-20260901-7b8856 shows cannot be certified from inside
    the prime-order subgroup at all. NOT that d_ell is new mathematics: the
    Galois-degree formula is a restatement of the standard ell-torsion Galois
    module structure and is very likely known.

  mechanism: >-
    The lane has been treating the volcano level as something you find by MOVING
    -- walking the isogeny graph until the structure of the neighbourhood tells
    you where you are. The mechanism proposed here is that you do not have to
    move, because the level is already written into the Galois action on the
    ell-torsion of the single curve in front of you. The causal chain: (1)
    End_{F_p}(E) contains (pi - A)/ell^k exactly when the curve is at least k
    above the floor -- this is the definition of the index m unpacked; (2) an
    endomorphism divisible by ell^k in that sense is the same thing as Frobenius
    acting as a scalar to ell-adic precision k, because kernels of division maps
    are exactly the torsion subgroups; (3) scalar action collapses the field of
    definition of the torsion, since a scalar matrix has small order in GL_2 while
    a Jordan block has order multiplied by ell. Each arrow is an equivalence, not
    an implication, so the level is not merely correlated with the torsion field
    -- it is determined by it, and conversely. The resource consumed is R5,
    ell-torsion for ell != N as a Galois module, which is the resource
    DECOMPOSITION.md section 2 lists as escaping the generic group model because
    it lives entirely outside G. That is the admissibility argument and it is the
    same one IDEA-20260807-cbe8c1 uses; this record's difference is that its R5
    quantity is a degree rather than a rationality predicate, which is what
    removes the vacuity.

  novelty_status: unverified

  citations:
    - ref: IDEA-20260807-cbe8c1
      provenance: internal
      claim: >-
        Derives E(F_p)[ell] = (Z/ell)^2 if and only if ell | (m - 1) and
        ell f_E | c, so full rational ell-torsion is present at every level except
        the floor -- a step at the floor, not a gradient in depth. This record
        generalizes exactly that step from rationality to Galois degree and
        removes the class-fixed side condition ell | (m - 1) that makes cbe8c1's
        indicator vacuous on most classes.
      verified_by: this idea-generator session, read in full through claim (B)
    - ref: H-VOLC-0e303a
      provenance: internal
      claim: >-
        Components (I) height free by division, (II) discriminant p-sized, (III)
        the LEVEL requires walking at O(ell h^2) isogeny computations of at least
        O(ell^2) field operations each -- polynomial in ell, exponential in
        log ell -- and that walk is where the obstruction actually is. Also states
        the COST-versus-INVISIBILITY dichotomy this record is designed to decide.
      verified_by: this idea-generator session, read statement and mechanism in full
    - ref: IDEA-20260808-4d77a6
      provenance: internal
      claim: >-
        pi = A + m theta with A = (t - f D_0)/2 and m = f/f_E, and
        n_1 = gcd(A - 1, m) is a publicly computable LOWER BOUND on the ell-volcano
        level, informative essentially only at ell = 2 and 3 and identically
        vacuous when ell does not divide A - 1. This record supplies the
        non-vacuous replacement and uses the same A.
      verified_by: this idea-generator session, read in full through claim (C)
    - ref: IDEA-20260807-b1b604
      provenance: internal
      claim: >-
        No code in this repository computes a volcano level; Sage is unavailable;
        proposes a pure-Python ell in {2, 3} certifier with three mutually
        independent labellers that must agree. This record's indicator is a
        natural FOURTH independent labeller and the cross-check against b1b604's
        three is the record's primary control.
      verified_by: this idea-generator session, read in full through claim (B)
    - ref: IDEA-20260807-3c6bd8
      provenance: internal
      claim: >-
        v_ell(c) = floor(v_ell(D)/2) for odd ell with an explicit 2-adic case
        split, obtained by repeated division without factoring; so the volcano
        HEIGHT is free per ell. Used here as the input that converts a measured
        height-above-floor into an absolute level.
      verified_by: this idea-generator session, read in full through claim (B)
    - ref: IDEA-20260807-4f43ac
      provenance: internal
      claim: >-
        A level oracle is a curve-only constant and therefore trivially
        generic-group simulable, so granting it for free changes nothing for any
        algorithm not also consuming R1, R2 or R5. Cited as the reason claim (E)
        disclaims any attack consequence.
      verified_by: this idea-generator session, read through claim (B)
    - ref: IDEA-20260901-7b8856
      provenance: internal
      claim: >-
        The level is not certifiable from inside the prime-order subgroup, because
        the scalar c*d is a valid group endomorphism multiplier for every divisor
        d of f. Cited as the complementary negative: this record makes the level
        cheap from OUTSIDE G, and 7b8856 proves it stays unavailable INSIDE G.
      verified_by: this idea-generator session, authored in the same session
    - ref: >-
        Kohel, 'Endomorphism rings of elliptic curves over finite fields' (PhD
        thesis 1996), especially the criterion relating the conductor index to the
        action of Frobenius on ell-power torsion; Schoof, 'Elliptic curves over
        finite fields and the computation of square roots mod p' (1985) and
        'Counting points on elliptic curves over finite fields' (1995);
        Fouquet and Morain (ANTS 2002); Ionica and Joux, 'Pairing the volcano'
        (ANTS IX, 2010); Sutherland, 'Isogeny volcanoes' (ANTS X, 2013)
      provenance: recalled
      claim: >-
        RECALLED, NOT OPENED THIS SESSION, AND LOAD-BEARING FOR THE NOVELTY LABEL
        RATHER THAN FOR CORRECTNESS. (i) The equivalence between ell^k | m and pi
        acting as a scalar mod ell^k on ell^k-torsion is, to this session's
        recollection, in Kohel's thesis and is used by the SEA and
        endomorphism-ring literature. (ii) Ionica and Joux give a pairing-based
        method for determining a curve's position in an ell-volcano that is
        cheaper than isogeny walking, which if recalled correctly means the COST
        half of this record's claim (C) is already known and possibly beaten, and
        the record's surviving contribution would be the explicit two-valued
        d_ell indicator, the strict generalization of cbe8c1, and the forcing of
        the H-VOLC-0e303a dichotomy. A reviewer with retrieval MUST chase Ionica
        and Joux before any novelty language survives.
      verified_by: null
    - ref: >-
        Erdos and Turan on the distribution of orders in symmetric groups; the
        standard estimate that the number of elements of F_ell^* of order at most
        y is at most y^2
      provenance: recalled
      claim: >-
        RECALLED, NOT OPENED. For a uniformly random a in F_ell^*, ord(a) exceeds
        ell^{1 - epsilon} for all but O(ell^{1 - epsilon}) values of a, since the
        number of elements of order dividing any fixed y is at most y. Used as the
        rigorous support for heuristic H1 on the size of d_ell.
      verified_by: null

  novelty_screen:
    method: >-
      FILESYSTEM AND LEDGER SCREENING ONLY. The crypto-kb MCP server is bound to
      ':memory:' with an empty index and returns nothing; it was NOT called and
      its silence is not read as novelty. Enumerated all 14 proposals carrying
      question_id RQ-VOLC-f6253b and read the claim block of each; read all three
      H-VOLC hypothesis heads in full or in part; read DECOMPOSITION.md sections 2
      to 4; read RQ-VOLC-f6253b, KN-FIND-002, KN-FIND-b7e091, KN-TECH-73630e and
      KN-TECH-033 in full. No external paper and no web source was opened.
    results: >-
      NEAREST FILED WORK, NAMED WITH ITS DIFFERENCE. (1) IDEA-20260807-cbe8c1 is
      the closest by MECHANISM and the relationship is containment, not overlap:
      cbe8c1's criterion is the special case of this record's indicator at
      ord(A mod ell) = 1, and cbe8c1 itself records that its first clause
      ell | (m - 1) is class-fixed, hence its indicator is identically absent on
      classes where that fails. This record replaces the rationality predicate by
      the Galois degree and is therefore defined on every class. cbe8c1 uses the
      criterion to route a depth effect into an R1 factor-base cost; this record
      uses it to price the LEVEL INSTRUMENT. Different consumer, strictly larger
      domain. (2) IDEA-20260808-4d77a6 gives a different cheap partial readout,
      n_1 = gcd(A - 1, m), from the group structure, and states its own expected
      vacuity at all but ell = 2, 3. This record's indicator is independent of
      that one and the two disagreeing on a curve is a reportable finding. (3)
      H-VOLC-0e303a asserts the level requires the walk; this record disputes that
      for small ell and is designed to decide it. (4) IDEA-20260807-b1b604 builds
      three independent labellers; this is a fourth, and cheaper. (5)
      IDEA-20260807-3c6bd8 prices the HEIGHT, not the LEVEL, and its output is an
      input here.
    verdict: >-
      UNVERIFIED, WITH AN EXPLICIT AND LIKELY ROUTE TO `known`. The equivalence in
      claim (A) is, by recollection, standard in the endomorphism-ring literature,
      and Ionica-Joux plausibly already give a cheaper-than-walking level method.
      If both recollections land, claims (A) and (C) are `known` and this record's
      surviving contribution is (i) the explicit two-valued d_ell formula as a
      never-vacuous indicator, (ii) the demonstration that it strictly contains
      cbe8c1's criterion, and (iii) the forcing of H-VOLC-0e303a's dichotomy onto
      the invisibility branch at small ell. That residue is worth the record and
      the record is written to survive the reclassification. No external source
      was opened, so `unverified` is the only permissible label.

  object_first_candidate:
    tracked_object: >-
      THE CONJUGACY CLASS OF THE FROBENIUS MATRIX ON E[ell] IN GL_2(F_ell),
      compressed to its ORDER d_ell(E) = [F_p(E[ell]) : F_p]. The object followed
      through the computation is a single integer dividing ell(ell^2 - 1),
      attached to the curve and to the prime ell. Established families declared
      OFF-LIMITS as the primary lens for this record: the level integer and level
      vector as labels; the conductor as a regressor; the endomorphism degree; the
      endomorphism scalar on G; the rational-torsion predicate; the walk and its
      height process; per-curve cost batteries.
    lossiness: >-
      PASSES THE LOSSY-PROJECTION TEST, AND THE FAILURE MODE IS EXACTLY THE ONE
      THE PROTOCOL NAMES. Consider first the projection that FAILS: E |-> the
      characteristic polynomial of pi on E[ell]. That is (X - A)^2 mod ell for
      every curve in the class, so it discards everything and retains nothing
      per-curve -- it is not a change of coordinates but a total collapse, and it
      is why the class-level data cannot see the level. Now the projection that
      passes: E |-> the conjugacy class of pi in GL_2(F_ell), compressed to its
      order. This discards the eigenvectors, the specific torsion points, the
      j-invariant, the class-group position and everything at primes other than
      ell, retaining one integer; the fibre over a given d_ell contains every
      curve of the class at the same floor-status, which is h(O) curves and is
      exponentially large. It is NOT a change of coordinates. And what is
      discarded is discarded COMPATIBLY with the operation that matters, an
      ell-isogeny step: a descending ell-isogeny multiplies the order by ell when
      it lands on the floor and an ascending one divides it, because it changes m
      by one factor of ell, so the retained integer propagates deterministically
      under the graph's generators. That compatibility is the whole content of
      claim (A).
    propagation: >-
      ONE-STEP PROPAGATION IS DEFINED AND DIRECTLY MEASURABLE. Under an ell-isogeny
      that descends one level, v_ell(m) decreases by one, so once v_ell(m) reaches
      zero the Frobenius matrix ceases to be scalar mod ell and d_ell jumps by the
      factor ell. Under a horizontal or ascending step d_ell either stays or
      divides by ell. Under an ell'-isogeny with ell' != ell, d_ell is UNCHANGED,
      because m changes only at ell' -- and that invariance is the sharpest
      available check on the object, since it predicts a null result along a whole
      direction of the graph and can be measured on an enumerated toy class in one
      pass.
    survival_score: >-
      Survives for every prime ell dividing the conductor f, at every height, on
      every ordinary class, with no side condition on A -- which is exactly the
      improvement over the nearest filed record. It dissolves in four named
      places. (i) When ell does not divide f there is no volcano and d_ell carries
      no level information, only class information -- the DEPTH-0 null. (ii) At
      large ell the object still exists but its computation costs ell^2 and stops
      being cheap, which is the honest half of claim (C). (iii) Beyond the first
      bit, distinguishing height k from height k + 1 requires E[ell^{k+1}] and the
      cost grows like ell^{2k}, so the object degrades from cheap to expensive as
      it is asked for more precision. (iv) In the supersingular case Frobenius
      acts on ell-torsion with a completely different structure and there is no
      volcano; the object does not transfer and is not claimed to.

  proof_search_map:
    bottleneck: >-
      The exact step is component (III) of H-VOLC-0e303a: obtaining the volcano
      LEVEL of a given curve, currently priced at O~(ell^3 h^2) by
      Fouquet-Morain walking and named there as the place where the obstruction
      actually sits. Removing it at small ell decides which of the two closures
      the lane is entitled to write.
    baseline_embedding:
      parameter_slice: >-
        IDEA-20260807-cbe8c1's rational-full-ell-torsion criterion is the exact
        parameter slice ord(A mod ell) = 1 -- equivalently A = 1 mod ell,
        equivalently ell | (A - 1), which is cbe8c1's first clause -- of this
        record's indicator: there d_ell = 1 above the floor and ell at the floor,
        and d_ell = 1 is precisely full rationality. The baseline is therefore
        embedded as a boundary case, not merely resembled.
      reproduction_check: >-
        A FROZEN SYMBOLIC FIXTURE. On any class with ell | gcd(A - 1, f), compute
        both the cbe8c1 predicate and d_ell and require d_ell = 1 exactly on the
        curves cbe8c1 calls non-floor, for every curve of the class. A single
        disagreement on the slice means one of the two derivations is wrong and
        halts both. On a class where ell does not divide A - 1, cbe8c1's predicate
        is absent while d_ell is defined -- and confirming that asymmetry on a
        real class is the reproduction check for the CONTAINMENT claim.
    observation_collision:
      observable: >-
        The observable carrying the conclusion is the integer d_ell(E).
      distinct_preimage_search: >-
        COLLISIONS EXIST AND ARE ENUMERATED HONESTLY. (i) Within a class, d_ell
        takes only two values, so every curve above the floor collides with every
        other curve above the floor -- the indicator resolves floor versus
        non-floor and NOTHING MORE at one prime, and it must never be reported as
        a level. (ii) Across classes, d_ell values collide freely, since
        ord(A mod ell) is a different quantity in each class; the indicator is
        therefore only interpretable relative to the class-level constant
        ord(A mod ell), which must be computed first from (t, f, D_0). (iii) The
        dangerous collision, which is the one the design must exclude: a class
        where ord(A mod ell) is itself divisible by ell, so that the two predicted
        values ord(A) and ell * ord(A) could be confused with each other across
        curves at different heights. Since ord(A mod ell) divides ell - 1 it is
        never divisible by ell, so this collision cannot occur at k = 1; at higher
        k, where the relevant order is taken mod ell^k and CAN be divisible by
        ell, it can, and that is the precise reason the record claims only the
        first bit as cheap.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace the rationality predicate 'E(F_p)[ell] is bicyclic' by the
          strictly stronger invariant 'the order of pi in GL_2(F_ell)', preserving
          more state than the floor test requires -- specifically the whole
          conjugacy class rather than the fixed-point count. The stronger state is
          what survives the removal of the side condition A = 1 mod ell.
        predicted_gain: >-
          Domain of applicability grows from classes with ell | (A - 1) -- a
          density about 1/ell of classes by the heuristic cbe8c1 itself states --
          to ALL classes with ell | f, a factor of about ell in coverage, at the
          same order of computational cost.
      - transform: representation_reduction
        proposed_object: >-
          Move from the isogeny graph, where the level is a global position, to
          the Galois module E[ell], where the level's first bit is an exact
          equality -- pi equals a scalar matrix -- checkable locally on one curve.
        predicted_gain: >-
          Removes the h^2 walking factor entirely from the floor indicator and
          replaces the ell^3 of walking with the ell^2 of an ell-division
          polynomial, with encoding, completeness and soundness all discharged by
          the equivalence of claim (A) and a certificate consisting of the
          division-polynomial factorization pattern.
    quantifier_order: >-
      EXPLICIT. For all ordinary E/F_p and all primes ell dividing f, and for all
      k >= 1: ell^k divides m if and only if pi acts on E[ell^k] as the scalar A
      mod ell^k. The witness -- the endomorphism (pi - A)/ell^k -- is allowed to
      depend on E, on ell and on k, and it does. The COST claim has the opposite
      shape and must not be read as uniform: there EXISTS a function
      C(ell, k, log p) = O~(ell^{2k} log p) such that FOR ALL E the indicator is
      computable within C -- so the cost is uniform in E but grows in ell and k,
      and the phrase 'the level is cheap' is true only inside a bounded range of
      ell and k which the measurement pins down. Reading the cost claim as uniform
      in ell is the error this audit exists to prevent.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest thing this method can certify is the exact height above the
        ell-floor of a given curve, at a cost polynomial in ell^k and log p,
        together with a re-verifiable certificate. It CANNOT certify the full
        endomorphism ring cheaply, because that needs every ell | f including
        large ones; it cannot certify anything about the ECDLP; it cannot beat the
        published subexponential endomorphism-ring algorithms in their own regime;
        and it says nothing about supersingular curves.
      nearby_object_control: >-
        THE NEARBY OBJECT ON WHICH THE CONCLUSION FAILS IS A CLASS WITH ell NOT
        DIVIDING f -- a volcano of height zero, where there is no floor, no level,
        and no information for the indicator to carry. The method must return the
        SAME d_ell for every curve of such a class, and any per-curve variation
        there is the indicator inventing structure. This is the mandatory
        null-object control and it is run before any positive reading. The second
        nearby object is a class where ell | f but ord(A mod ell) is large: there
        the two predicted values are far apart and the test is easy, whereas at
        ord(A mod ell) = 1 they are 1 and ell and the test is hardest to
        implement correctly -- both extremes must be exercised.
    proof_obligations:
      - claim: >-
          ell^k | m if and only if (pi - A)/ell^k is an endomorphism.
        responsibility: baseline
      - claim: >-
          (pi - A)/ell^k is an endomorphism if and only if pi acts as A on
          E[ell^k].
        responsibility: correctness
      - claim: >-
          d_ell = ord(A mod ell) above the floor and ell * ord(A mod ell) at the
          floor, with ord(A mod ell) never divisible by ell.
        responsibility: correctness
      - claim: >-
          The indicator costs O~(ell^{2 + o(1)} log p) for the first bit and
          O~(ell^{2k + o(1)} log p) for height k.
        responsibility: runtime
      - claim: >-
          Memory is O~(ell^{2k} log p) bits for the division-polynomial route.
        responsibility: memory
      - claim: >-
          The certificate -- the division-polynomial degree pattern plus the
          Frobenius order -- is re-verifiable independently of the computation
          that produced it.
        responsibility: interface
      - claim: >-
          Scope: ordinary curves, ell | f, ell != p, F_p-rational endomorphisms.
        responsibility: scope

  assumptions:
    - >-
      E is ordinary over F_p and ell divides the conductor f, so the volcano has
      positive height at ell. Where ell does not divide f the indicator is defined
      but carries no level information, and that case is the null control rather
      than an application.
    - >-
      D_0 and f are known, so A is computable. By IDEA-20260807-3c6bd8 the
      per-ell height v_ell(f) is free by repeated division and the full
      factorization of the p-sized D is routine at the sizes considered.
    - >-
      An implementation of ell-division polynomials and of Frobenius-order
      determination over F_p exists in pure Python; IDEA-20260807-b1b604 records
      that Sage is unavailable and that no volcano code exists in this repository,
      so this is a real dependency and is named rather than assumed.

  predictions:
    - metric: >-
        d_ell_two_valued: the number of DISTINCT values of
        d_ell(E) = [F_p(E[ell]) : F_p] observed across all curves of one
        enumerated toy isogeny class at a prime ell dividing f
      direction: different
      minimum_effect: >-
        EXACTLY 2, and the two values must be r and ell*r for a single integer r
        equal to ord(A mod ell) computed independently from (t, f, D_0). Three or
        more distinct values, or two values not in ratio ell, refutes claim (B) at
        that class. On the committed p = 4001, t = 30 class with ell = 2 and
        f = 16 this predicts exactly two values in ratio 2.
    - metric: >-
        floor_agreement: fraction of curves on which the d_ell indicator's
        floor-versus-non-floor verdict agrees with the verdict from an independent
        labeller (2-isogeny BFS, or the group-structure indicator
        n_1 = gcd(A - 1, m), or cbe8c1's rational-torsion predicate where it
        applies)
      direction: higher
      minimum_effect: >-
        1.000 with zero disagreements on the enumerated class. A single
        disagreement is a reportable finding that halts the reading and localises
        an error to one of two named labellers, which is more valuable than the
        agreement.
    - metric: >-
        containment_check: on a class with ell dividing gcd(A - 1, f), the number
        of curves where cbe8c1's rational-torsion predicate and d_ell = 1 disagree
      direction: lower
      minimum_effect: >-
        EXACTLY ZERO. This is the baseline-embedding check: cbe8c1's criterion
        must be recovered as the ord(A mod ell) = 1 slice. A disagreement means
        the containment claim is wrong and the strict-generalization language must
        be withdrawn.
    - metric: >-
        coverage_gain: the number of enumerated toy classes at a fixed ell on
        which d_ell is defined and two-valued, divided by the number on which
        cbe8c1's predicate is non-vacuous
      direction: higher
      minimum_effect: >-
        At least 2 at ell = 2 and at least 3 at ell = 3, against the heuristic
        prediction of about ell from the 1/ell density of ell | (A - 1). A
        measured ratio near 1 would mean the vacuity of cbe8c1's predicate was
        overstated and the coverage argument for this record collapses.
    - metric: >-
        instrument_cost_ratio: measured field operations of the d_ell indicator
        against measured field operations of Fouquet-Morain walking, on the same
        curves with the same primitives
      direction: lower
      minimum_effect: >-
        A ratio below 1 at ell = 2 and 3 on volcanoes of height at least 3, with
        the ratio decreasing as height grows -- the predicted saving is a factor
        ell*h^2, so it must GROW with h. A ratio that does not improve as h grows
        contradicts the cost model even if the indicator is correct, and the cost
        claim must then be withdrawn while the correctness claim survives.
    - metric: >-
        null_class_variation: the number of distinct d_ell values across all
        curves of a class where ell does NOT divide f
      direction: lower
      minimum_effect: >-
        EXACTLY 1. Any per-curve variation on a height-zero volcano means the
        indicator is reading something other than the level, and every positive
        reading is void. This is the blocking null-object control.

  minimal_test:
    design: >-
      SIX STEPS, TOY SCALE, PURE PYTHON, ell IN {2, 3, 5}. STEP 0 (blocking, first):
      the NULL CLASS -- select an ordinary class with ell not dividing f, compute
      d_ell for every curve, and require exactly one distinct value. If the
      indicator varies there, stop. STEP 1 (minutes): on the committed p = 4001,
      t = 30 class, re-derive (D_0, f, A) from scratch rather than importing them,
      compute r = ord(A mod 2), enumerate all 138 curves, and compute d_2 for each
      by determining the order of Frobenius on the 2-torsion -- at ell = 2 this is
      the factorization type of x^3 + ax + b over F_p and costs a root count.
      Require exactly two values in ratio 2. STEP 2 (minutes): the independent
      labeller cross-check -- compare the floor verdict against 2-isogeny BFS and
      against n_1 = gcd(A - 1, m), curve by curve, and report every disagreement
      individually rather than as a rate. STEP 3 (minutes): the CONTAINMENT check
      -- on a class with ell | gcd(A - 1, f), verify that d_ell = 1 exactly where
      cbe8c1's rational-torsion predicate holds. STEP 4 (tens of minutes): repeat
      STEPS 1 to 3 at ell = 3 and ell = 5 on classes chosen so that
      ord(A mod ell) is 1 in one class and greater than 1 in another, exercising
      both extremes of the indicator. STEP 5 (tens of minutes): the COST
      comparison -- implement Fouquet-Morain walking and the d_ell indicator over
      the SAME isogeny and field primitives, measure field operations for both on
      volcanoes of height 1 through 4, and report the ratio as a function of
      height. STEP 6 (minutes): the ell'-INVARIANCE check -- verify that d_ell is
      unchanged along ell'-isogeny steps for ell' different from ell, which is a
      prediction of a null along a whole direction and is the cheapest available
      test of the propagation rule.
    controls:
      - >-
        NULL OBJECT, BLOCKING AND RUN FIRST: a class with ell not dividing f,
        where d_ell must be constant. An indicator that varies on a height-zero
        volcano is reading noise.
      - >-
        THREE-LABELLER AGREEMENT: 2-isogeny BFS, n_1 = gcd(A - 1, m), and where
        applicable cbe8c1's predicate, all compared curve by curve against d_ell.
        This is IDEA-20260807-b1b604's design and this record adds a fourth
        labeller to it rather than replacing it.
      - >-
        BASELINE-EMBEDDING CONTROL: the ord(A mod ell) = 1 slice must reproduce
        cbe8c1's criterion exactly.
      - >-
        BOTH-EXTREMES CONTROL: at least one class with ord(A mod ell) = 1, where
        the two predicted degrees are 1 and ell, and one with ord(A mod ell) large,
        where they are far apart. An implementation correct only at one extreme is
        a common failure and this control catches it.
      - >-
        SHARED-PRIMITIVE CONTROL for the cost comparison: both instruments must
        use the same field and polynomial arithmetic, so the measured ratio is not
        an artifact of two implementations of different quality.
      - >-
        CERTIFICATE CONTROL: each d_ell value is accompanied by the
        division-polynomial degree pattern and is re-verified by an independent
        routine, per docs/claims-and-verification.md.
    required_metrics:
      - number of distinct d_ell values per class and their ratio (must be 2 and ell on a positive-height volcano, 1 on the null)
      - curve-by-curve agreement table against every independent labeller, with each disagreement listed individually
      - containment-check disagreement count on the ord(A mod ell) = 1 slice (must be 0)
      - coverage ratio of classes where d_ell is informative to classes where cbe8c1's predicate is non-vacuous
      - measured field operations for the indicator and for the walk, as a function of height, with the ratio
      - ell'-invariance violations along non-ell steps (must be 0)
      - division-polynomial certificates for every reported d_ell
      - artifact manifest with source hashes, seeds, and a rebuild receipt

  falsification_conditions:
    - >-
      More than two distinct d_ell values on a positive-height volcano, or two
      values not in ratio ell. Claim (B) is refuted at that class; the Galois
      degree is not the two-valued floor indicator and the record is withdrawn or
      rescoped to whatever it does measure, which must then be reported.
    - >-
      The null class shows per-curve variation in d_ell. The indicator is reading
      something other than the level and no positive result in the record may be
      believed. This is the artifact tell of docs/inventor-protocol.md section 3
      and it is blocking.
    - >-
      A curve where d_ell's floor verdict disagrees with the 2-isogeny BFS
      verdict. Either claim (A) is wrong or one of the two implementations is; the
      disagreement is the deliverable and must be localised before anything else
      is read.
    - >-
      A disagreement on the ord(A mod ell) = 1 slice with cbe8c1's predicate. The
      containment claim fails and the strict-generalization language is withdrawn.
    - >-
      The measured cost ratio against walking does not improve as height grows.
      The cost model of claim (C) is wrong even if the mathematics is right, and
      the record's practical claim -- that the level instrument is cheap at small
      ell -- is withdrawn, leaving H-VOLC-0e303a's COST branch alive.
    - >-
      d_ell changes along an ell'-isogeny step with ell' different from ell. The
      propagation rule is wrong, the object is not what claim (A) says it is, and
      the tracked object must be redefined before any measurement is interpreted.

  confounders:
    - >-
      ell = 2 IS DEGENERATE AND IS THE CHEAPEST CASE. At ell = 2 the ell-division
      polynomial is the cubic itself, GL_2(F_2) is tiny, and ord(A mod 2) is
      always 1, so the two predicted degrees are 1 and 2 and the test reduces to a
      root count. That makes ell = 2 both the easiest place to implement and the
      least informative place to validate. MITIGATION: ell = 3 and ell = 5 are in
      the minimal test and the both-extremes control requires a class with
      ord(A mod ell) greater than 1, which ell = 2 can never supply.
    - >-
      DEGREE VERSUS SPLITTING PATTERN. d_ell is the degree of the field of
      definition of the FULL ell-torsion, not the smallest degree over which some
      ell-torsion point is defined; conflating them gives the wrong answer for a
      Jordan block, where an eigenvector is rational over a smaller field than the
      whole module. MITIGATION: the definition is written out, and the
      implementation computes the order of the Frobenius MATRIX, cross-checked
      against the division-polynomial factorization pattern.
    - >-
      THE INDICATOR IS RELATIVE TO A CLASS CONSTANT. d_ell means nothing without
      ord(A mod ell), which must be derived from (t, f, D_0) independently. A
      pipeline that reports d_ell alone is uninterpretable. MITIGATION: r is
      computed and reported alongside every d_ell, and the verdict is the ratio.
    - >-
      HEIGHT VERSUS LEVEL. The indicator measures height ABOVE THE FLOOR, i.e.
      v_ell(m); the absolute level v_ell(f_E) is v_ell(f) minus that, and requires
      v_ell(f) from IDEA-20260807-3c6bd8. Reporting one as the other silently
      inverts the axis. MITIGATION: both are reported with their definitions
      attached, on every curve.
    - >-
      CHEAPNESS DOES NOT IMPLY USEFULNESS. Making the level cheap does not make it
      informative; IDEA-20260807-4f43ac and IDEA-20260901-7b8856 both argue the
      opposite. MITIGATION: claim (E) and the interpretation limits say so, and
      the record's stated purpose is to decide WHICH closure the lane writes, not
      to open an attack.

  interpretation_limits:
    - >-
      CLAIM TIER TOY, per RQ-VOLC-f6253b. Classes at p ~ 4000 to 65000, ell in
      {2, 3, 5}, heights up to about 4. No transfer to cryptographic scale is
      offered, and the cost claim is an analytic statement checked for consistency
      at toy scale, not a measured crypto-scale result.
    - >-
      THIS IS AN INSTRUMENT RESULT, NOT AN ATTACK RESULT. sota_delta against the
      ECDLP frontier is +0 in every branch. A cheaper level does not make the
      level useful, and two committed lines of argument in this program say it is
      not.
    - >-
      THE FIRST BIT IS CHEAP; THE FULL HEIGHT IS NOT. The record claims a
      polynomial floor indicator, and an ell^{2k} cost for height k. It must never
      be cited as making the endomorphism ring cheap, which would require every
      ell | f including large ones.
    - >-
      THE COST COMPARISON IS AGAINST FOUQUET-MORAIN WALKING AS IMPLEMENTED HERE,
      not against the published state of the art in endomorphism-ring computation,
      which this session could not open and which may already contain a cheaper
      method (the recalled Ionica-Joux pairing route in particular).
    - >-
      NOTHING HERE BEARS ON THE CONTESTED KN-FIND-002 AND KN-FIND-b7e091 RECORDS.
      The resource consumed is R5, outside G entirely, so neither the endomorphism
      oracle nor the incidence oracle reading is engaged, and the record takes no
      side on the recorded contradiction.

  heuristic_assumptions:
    - id: H1
      statement: >-
        SIZE OF THE TORSION FIELD DEGREE. For a class chosen without regard to
        ell, the class constant r = ord(A mod ell) behaves like the multiplicative
        order of a uniformly random element of F_ell^*: formally, the fraction of
        classes with r <= y is at most y^2/(ell - 1) (1 + o(1)), so r exceeds
        ell^{1 - epsilon} for all but an O(ell^{-epsilon}) fraction. Consequently
        the direct point-arithmetic route to d_ell, which works in
        F_{p^{d_ell}}, costs about ell times more than the naive hope and the
        division-polynomial route at O~(ell^2 log p) is usually the better one.
      rigorous_support: >-
        RIGOROUS INGREDIENT: in any cyclic group of order ell - 1 the number of
        elements of order dividing y is at most y, hence the number of elements of
        order at most y is at most y^2 -- an exact counting bound, not a heuristic.
        CLASSICAL STATEMENT IMITATED: the Erdos-Turan style statement that a
        random element of a cyclic group has near-maximal order, which is the
        distributional shape assumed for A mod ell as the class varies. THE GAP,
        STATED: A = (t - f D_0)/2 is not a random residue -- it is a specific
        arithmetic function of the class -- and it is constrained by
        A^2 - At + p = 0 mod (things), so its distribution mod ell may be biased.
        The assumption is that the bias is o(1); the validation plan measures it.
      falsification_condition: >-
        The empirical distribution of ord(A mod ell) over enumerated classes
        departs from the uniform-random-element prediction by more than 2 standard
        errors in at least three of the tested primes ell, or shows a systematic
        preference for small orders, which would make the point-arithmetic route
        cheaper than predicted and would be a useful positive finding rather than
        merely a falsification.
      validation_plan: >-
        SAMPLE: at each of at least four toy primes p spanning 14 to 26 bits,
        enumerate EVERY trace t in the Hasse interval -- a census, not a sample,
        since 4 sqrt(p) values are fully enumerable at these sizes -- compute
        (D_0, f, A) for each ordinary class, and record ord(A mod ell) for ell in
        {2, 3, 5, 7, 11, 13} restricted to classes with ell | f. SHORTCUT: none
        needed at toy scale; at larger p the shortcut is to sample t uniformly,
        which must be recorded as a change of estimator. COMPARISON: empirical
        distribution of r against the distribution of the order of a uniform
        element of F_ell^*, by a chi-square test on the divisor classes of
        ell - 1. TAIL CHECK: the frequency of r = 1 -- which is exactly cbe8c1's
        non-vacuity condition -- against the predicted 1/(ell - 1), since that
        frequency is also the coverage-gain denominator and the two must agree.
        TRANSFER: sampled parameters recorded in full; no extrapolation to
        cryptographic p.
    - id: H2
      statement: >-
        COST MODEL OF THE INDICATOR. Computing the order of Frobenius on E[ell^k]
        costs O~(ell^{2k} log p) field operations, i.e. soft-linear in the degree
        (ell^{2k} - 1)/2 of the division polynomial times the log p cost of a
        p-power Frobenius, assuming fast polynomial arithmetic.
      rigorous_support: >-
        RIGOROUS INGREDIENT: the ell^k-division polynomial has degree
        (ell^{2k} - 1)/2, and modular composition and p-power Frobenius modulo a
        degree-n polynomial cost n^{1 + o(1)} log p field operations with fast
        arithmetic. CLASSICAL STATEMENT IMITATED: the standard cost accounting of
        Schoof-Elkies-Atkin point counting, where exactly this modular
        exponentiation is the inner loop. THE GAP: pure-Python arithmetic at toy
        scale has none of these asymptotics, so the MEASURED cost will be
        dominated by constants and the ratio against walking must be read only for
        its trend in height, not for its absolute value.
      falsification_condition: >-
        The measured cost of the indicator grows faster than quadratically in ell
        at fixed k across ell in {2, 3, 5, 7}, or fails to be independent of the
        volcano height h at fixed k -- the latter being the whole point, since
        walking's cost carries h^2 and the indicator's should carry none.
      validation_plan: >-
        SAMPLE: the indicator and the walk run on classes of height 1, 2, 3 and 4
        at ell in {2, 3, 5}, at least 30 curves each. SHORTCUT: none. COMPARISON:
        fitted exponent of measured field operations in ell at fixed k, against
        the predicted 2; and fitted exponent in h, against the predicted 0 for the
        indicator and 2 for the walk. TAIL CHECK: the most expensive single curve
        against the predicted upper bound. TRANSFER: none claimed; the constants
        are Python constants and are reported as such.

  target_complexity:
    time_exponent: >-
      TARGET, FOR THE LEVEL INSTRUMENT AND NOT FOR THE ECDLP: the floor indicator
      at one prime in O~(ell^{2 + o(1)} log p) field operations, and height k in
      O~(ell^{2k + o(1)} log p). BEST KNOWN IN THIS PROGRAM, which is the baseline
      being displaced: Fouquet-Morain walking at O~(ell^3 h^2) as priced by
      H-VOLC-0e303a. The predicted saving on the floor indicator is a factor
      ell h^2 and it grows with height, which is the falsifiable part. THIS IS
      EXPLICITLY A BUILDING BLOCK AND NOT AN EXPONENT-MOVING RESULT for the
      central hard problem: per the search heuristics of agents/idea-generator.md
      an idea whose best case improves only an instrument's polynomial cost is low
      priority unless it is a required component of an exponent-moving idea, and
      this one is stated as a required component of two things -- the vertical
      navigation term of IDEA-20260901-48b364, whose second cost term is exactly
      C_isog(ell) and which this record reduces, and the adjudication of
      H-VOLC-0e303a's dichotomy, which the campaign cannot write without it.
    memory_exponent: >-
      O~(ell^{2k} log p) bits to hold the division polynomial and the Frobenius
      image, against O~(ell^2 + h) for walking. So the indicator TRADES MEMORY FOR
      TIME as k grows and is the memory-hungrier of the two at high precision;
      that is disclosed rather than omitted, and it is a second reason the record
      claims only the first bit as cheap.
    best_known: >-
      For the ECDLP on these curves, untouched: parallel Pollard rho with the
      negation map at n^{1/2 + o(1)} time and O(1) memory, BSGS at n^{1/2} time
      and memory, automorphism-discounted rho on CM curves (KN-TECH-018). For
      endomorphism-ring computation: the published subexponential algorithms,
      RECALLED and not opened, which this record does not challenge and whose
      regime it does not enter.
    hidden_overhead: >-
      DISCLOSED. The o(1) hides fast polynomial arithmetic that a pure-Python
      implementation will not have, so the MEASURED constants will be poor and
      only the trend is meaningful. Also excluded from the stated cost: the
      factorization of D to obtain (D_0, f, A), which is a p-sized factorization
      -- routine at toy and at 256-bit scale per IDEA-20260807-3c6bd8, but not
      polynomial-time proven, and it is charged to the caller rather than to the
      indicator.
    tradeoff_note: >-
      The two routes to d_ell trade off explicitly. The division-polynomial route
      costs O~(ell^{2k}) time and the same memory, independent of the torsion
      field degree. The direct point-arithmetic route costs O~(d_ell log p) point
      operations in F_{p^{d_ell}} and O(d_ell log p) memory, which is far cheaper
      when d_ell is small and far worse when it is near its maximum -- and by
      heuristic H1 it is usually near its maximum. The instrument should therefore
      compute r = ord(A mod ell) first, which is free, and choose the route. Both
      routes parallelize trivially across curves and neither parallelizes usefully
      within one curve.

  dominated_by: >-
    CHECKED ACROSS EVERY ROW OF THE FRONTIER, ON TIME, MEMORY AND QUERIES, BEFORE
    ANSWERING. As an ECDLP attack: n/a (no result claimed) -- no time, memory or
    query point is offered and no frontier row applies. As a level-determination
    method: PLAUSIBLY DOMINATED by the recalled Ionica-Joux pairing-based volcano
    method and by the standard endomorphism-ring literature, neither of which this
    session could open; this is stated first because it is the single most likely
    way the record loses its cost claim, and the correctness and containment
    claims survive it. Against the methods actually committed in this repository:
    NOT dominated -- IDEA-20260808-4d77a6's n_1 indicator is cheaper (O(log p)
    group operations) but is a partial LOWER BOUND that is vacuous whenever ell
    does not divide A - 1, and IDEA-20260807-cbe8c1's predicate is strictly
    contained in this one, so on the Pareto axis of (cost, coverage) the three sit
    at three distinct points and none dominates the others everywhere. As a
    mathematical statement: dominated by Kohel's thesis if the recollection lands.
  sota_delta: >-
    +0 AGAINST THE ECDLP FRONTIER on time, memory and queries, in every branch.
    Against this program's committed level instrument the delta is quantitative: a
    predicted factor ell*h^2 in field operations for the floor indicator, i.e. a
    factor of about 32 at ell = 2, h = 4, growing with h; and a coverage increase
    of about a factor ell in the set of classes on which a cheap non-floor
    indicator exists at all, relative to IDEA-20260807-cbe8c1. Against the
    external literature the delta is plausibly +0 and the record says so.

  discriminated_from:
    - >-
      IDEA-20260807-cbe8c1 derives the rational-full-ell-torsion criterion and
      routes it into an R1 factor-base cost. The relationship is CONTAINMENT, not
      overlap: cbe8c1 is the ord(A mod ell) = 1 slice of this record's indicator,
      and cbe8c1 itself records that its side condition is class-fixed and often
      absent. This record's contribution is the removal of that side condition and
      a different consumer -- the price of the level instrument rather than the
      price of a factor base.
    - >-
      IDEA-20260808-4d77a6 reads a partial level bound off the group structure at
      O(log p) group operations and states its own expected vacuity away from
      ell = 2, 3. That instrument is cheaper and weaker; this one is dearer and
      never vacuous. They are different Pareto points and each is a control on the
      other.
    - >-
      IDEA-20260807-b1b604 builds three mutually independent labellers by isogeny
      walking, the rational-torsion criterion, and LLL on j. This record adds a
      fourth, independent of all three, and its primary control is agreement with
      them; it does not replace that tooling record and depends on it.
    - >-
      H-VOLC-0e303a prices the level and locates the obstruction in the walk. This
      record disputes that pricing at small ell and is designed to decide the
      COST-versus-INVISIBILITY dichotomy that hypothesis poses; it is the
      adjudicating measurement for a committed hypothesis, not a restatement of it.
    - >-
      IDEA-20260901-48b364 (this session) needs the ascending-direction
      identification as its second cost term. This record reduces that term. The
      two compose and neither contains the other.
    - >-
      IDEA-20260901-7b8856 (this session) shows the level cannot be certified from
      inside the prime-order subgroup. This record makes it cheap from outside.
      Together they are the two halves of the RQ's decision target, and their
      conclusions point in opposite directions by design.

  estimated_cost:
    implementation: medium
    compute: low

  recommended_priority: high

  honest_prior_of_survival: >-
    0.9 that the equivalence in claim (A) is correct as stated, since both
    directions are short and standard. 0.8 that d_ell comes out exactly two-valued
    in ratio ell on a real enumerated class -- the residual risk is the
    degree-versus-splitting-pattern confounder, which is the most likely
    implementation error. 0.85 that the measured cost ratio favours the indicator
    at ell = 2 and 3 and improves with height. 0.45 that a reviewer with retrieval
    finds the criterion in Kohel and the cheap method in Ionica-Joux, in which
    case the surviving contribution is the containment result over cbe8c1, the
    coverage measurement, and the adjudication of H-VOLC-0e303a -- which is why
    all three are in the minimal test rather than deferred.

