  lossy_projection_identifiability_audit:
    projection: >-
      The complete instance-solution table for the prime p -- a non-scalar endomorphism
      for each of the ~p/12 supersingular j-invariants -- is projected to the advice
      string A_p of size S = p^sigma, and thence to the family of resolution fibers
      {R(a) : a in A_p}.
    what_is_discarded: >-
      All but p^sigma of the p^{1-o(1)} instance-specific solutions, and, at the second
      stage, the actual maximal orders: only WHICH curves are resolved is retained,
      not by what.
    why_genuinely_lossy: >-
      For sigma < 1 the advice cannot name every instance, so the projection is at least
      p^{1-sigma}-to-one on the instance axis. At the fiber stage the loss is larger
      still: distinct advice strings with the same reachability closure induce the same
      fiber family, and the number of advice strings of size S vastly exceeds the number
      of distinct fiber families of the same total mass. This is not invertible even in
      principle.
    why_compatible_with_the_operations: >-
      This is the part that makes it a tracked object rather than a bookkeeping label.
      The operations the target performs on an instance are isogeny walks. R(a) is
      CLOSED under exactly those operations: E in R(a) and a walked phi: E -> E' implies
      E' in R(a), with the witness the pushforward-and-saturate computation on End(E).
      The retained part therefore has a deterministic one-step propagation rule, and the
      rule is a closure property with a constructive witness, not a statistical claim.
    is_it_only_a_change_of_coordinates: >-
      NO. The canonical failure of docs/inventor-protocol.md section 2 -- tracking
      (Delta, Pi) = (x xor y, x*y), from which the unordered pair is recoverable as the
      roots of t^2 + Delta t + Pi -- has no analogue here. From R(a) one cannot recover
      a, the orders, the isogenies, or which advice element resolved which curve.
    mirror_failure_check: >-
      CHECKED, AND THE CHECK RETURNS "NOT CONSTANT". The mirror failure is a projection
      so lossy it is the same for every input (the KN-TECH-1a5b7e zero-spread tell).
      R(a) is forced to vary: it is empty for advice carrying no endomorphism data (the
      null object below) and is the whole vertex set for advice of size p with orders
      attached (the trivial corner). Both extremes are occupied by construction, so the
      comparator spread is the full range [0, p/12] and is p-growing.

  null_object_control:
    primary_null: >-
      RANDOM ADVICE. Replace A_p by a uniformly random set of S supersingular
      j-invariants WITH NO ENDOMORPHISM DATA ATTACHED, same size, same access pattern,
      same query budget. Its resolution fibers are EMPTY: knowing that a curve exists
      resolves no instance. The frontier computed against random advice MUST return
      T(S) = p^{1/3+o(1)} for every S -- i.e. exactly no improvement.
    why_it_can_fail: >-
      IT CAN FAIL IN A WAY THAT KILLS THE RECORD. If the accounting reports any
      improvement for random advice, then the accounting is scoring the SIZE of the
      advice rather than its CONTENT, every number in the frontier table is an artifact,
      and no row may be reported. This is a real risk in practice: it is exactly what
      happens if the walk-hits-the-set step is charged without checking that landing on
      a stored curve actually yields End of that curve.
    secondary_nulls:
      - >-
        TRIVIAL-CORNER KNOWN-ANSWER GATE: advice of size p^{1+o(1)} carrying an order
        for every supersingular j must return T = poly(log p). A frontier that does not
        collapse at the trivial corner is misimplemented.
      - >-
        ZERO-ADVICE GATE: at S = 0 the frontier must return exactly p^{1/3+o(1)}, the
        incumbent. This is the baseline embedding required by
        docs/inventor-protocol.md section 8 audit 1 and it is checked symbolically.
      - >-
        SHUFFLED-FIBER CONTROL: recompute Construction A with the database curves'
        orders randomly permuted among the curves. The frontier must return
        p^{1/3+o(1)} (no improvement), because a permuted order is the wrong order.
        A construction that still reports a speedup is measuring set membership rather
        than endomorphism knowledge.

  assumptions:
    - >-
      Pure OneEnd / EndRing / Isogeny instances: a supersingular curve over F_{p^2}
      given by its j-invariant, NO torsion images published under a secret isogeny, no
      SQIsign transcript, no CSIDH secret. RQ-SSI-001 places the SIDH/SIKE torsion-image
      setting out of scope as a positive target and this record stays inside that.
    - >-
      Classical computation throughout. The record states no quantum position and
      inherits none.
    - >-
      Advice is charged as memory that must physically exist. A frontier point at
      S = p^{2/3} is p^{170} entries at SQIsign NIST-I and is stated as physically
      impossible in the same sentence as it is derived, exactly as EV-SSI-59f7a2 states
      for the incumbent's own 2^{92.5} entries.

  proof_search_map:
    bottleneck: >-
      The growth rate of the resolution fiber |R(a)| per unit of advice. Every derived
      frontier row is a bound on that one quantity, and removing the bound is the only
      way any row moves.
    baseline_embedding:
      parameter_slice: >-
        S = 0. The frontier must return the incumbent p^{1/3+o(1)} time and
        p^{1/3+o(1)} working memory, i.e. Theorem 1.1 of the frozen source.
      reproduction_check: >-
        Symbolic: T(0) = min(p^{1/3+o(1)}, p^{1+o(1)}/0) = p^{1/3+o(1)} by convention
        that no advice gives no database hit. Additionally the S = p^{1/2} row must
        return T = p^{1/2}, reproducing the Delfs-Galbraith / MITM balance point, which
        is a second independent embedding.
    observation_collision:
      observable: >-
        The pair (S, T). The claim "advice below p^{2/3} buys nothing" is carried
        entirely by that pair.
      distinct_preimage_search: >-
        SEARCH PERFORMED AND A COLLISION WAS FOUND, AND IT IS REPORTED RATHER THAN
        HIDDEN. Construction A at sigma = 4/5 and Construction B at theta = 1/5 give
        the IDENTICAL observable (p^{4/5}, p^{1/5}) by two apparently different
        mechanisms. The separating condition is that B's curves are generated from
        maximal orders and therefore already carry their orders, so B is A in different
        notation. Reporting this collision is what converts 250e50's free-exact-screen
        branch from an open lever into a re-parametrisation.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the question from "is there a sub-p^{1/3} algorithm" to "is there an
          advice element with a fiber larger than the ball it can walk", which is an
          exact combinatorial condition on a set system rather than an algorithmic
          aspiration.
        predicted_gain: >-
          None in cost. The gain is falsifiability: the reduced question has a
          pre-registered numeric answer (fiber <= storage x time) that a single
          counterexample refutes.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (S, T) fixed at (p^{4/5}, p^{1/5}) and vary the forgotten
          structure (how the advice was produced). The intrinsic invariant separating
          the resulting objects is whether the stored curves carry orders.
        predicted_gain: >-
          Decides whether 250e50's screen branch is a distinct mechanism. Predicted
          answer: it is not.
    quantifier_order: >-
      INCUMBENT: for all p, for all supersingular E/F_{p^2}, Algorithm 3 finds a
      non-scalar endomorphism in expected time p^{1/3+o(1)} (Theorem 1.1, conditional on
      Heuristic 1).
      THIS RECORD: for all p, THERE EXISTS a string A_p depending on p alone with
      |A_p| = S, such that for all supersingular E/F_{p^2}, an algorithm with oracle
      access to A_p finds a non-scalar endomorphism in time T(S).
      THE WITNESS A_p IS ALLOWED TO DEPEND ON p AND FORBIDDEN TO DEPEND ON E. That
      single change of order is the entire content of the record, and it is why none of
      the twelve committed closures bears on it.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For every construction in the pre-registered closed list, T(S) >= min(p^{1/3},
        p/S)^{1-o(1)}, with the obstruction being that a resolution fiber is a walked
        ball." IT CAN NEVER CERTIFY A LOWER BOUND OVER ALL ADVICE STRINGS. This is a
        survey of named constructions plus one structural argument, not an impossibility
        theorem, and the record must never be cited as one.
      nearby_object_control: >-
        Apply the identical accounting to the ORIENTED (CSIDH-shaped) problem, where
        preprocessing is known to behave differently because the class group acts
        simply transitively and a precomputed relation lattice is reusable across all
        instances. If the accounting returns the same flat frontier there, it is not
        sensitive to the structure it claims is decisive and the argument is void.
    proof_obligations:
      - claim: Construction A costs S poly-time steps to build and p/S steps to query.
        responsibility: runtime
      - claim: R(a) is closed under walked isogenies with a constructive witness.
        responsibility: correctness
      - claim: Construction C's middle table needs p^2/(X1^2 X2^2) entries.
        responsibility: size
      - claim: Random self-reducibility of OneEnd via Algorithm 3's own walk.
        responsibility: scope
      - claim: The composite frontier is the min of the two rows.
        responsibility: baseline
    not_applicable_reason: null

  predictions:
    - metric: >-
        T_min(S): the smallest time exponent achieved by any construction in the
        pre-registered closed list {A, B, C, ignore-advice}, evaluated at
        S = p^{sigma} for sigma in {0, 1/6, 1/3, 1/2, 2/3, 4/5, 1}
      direction: different
      minimum_effect: >-
        PRE-REGISTERED VALUES, ALL DERIVED BEFORE ANY EVALUATION:
        sigma = 0 -> 1/3; 1/6 -> 1/3; 1/3 -> 1/3; 1/2 -> 1/3; 2/3 -> 1/3;
        4/5 -> 1/5; 1 -> 0 (poly). The window sigma in [0, 2/3] is FLAT AT 1/3. Any
        evaluation returning a value strictly below 1/3 anywhere in that window
        falsifies the composite and is the record's positive outcome.
    - metric: >-
        fiber_ratio(sigma) = log_p |R(a)| averaged over advice elements, minus
        log_p(storage per element)
      direction: different
      minimum_effect: >-
        Predicted 0 + o(1) for Constructions A and B (one element resolves one named
        curve plus whatever the query walk reaches, and the walk is charged as time).
        A measured or derived fiber_ratio strictly positive at any sigma is the exact
        event that breaks the frontier, and it is the single number a future
        advice-bearing proposal must report.
    - metric: >-
        null_frontier(S): the same accounting run against random advice carrying no
        endomorphism data
      direction: different
      minimum_effect: >-
        EXACTLY 1/3 at every S. Any deviation means the accounting scores size rather
        than content and NO row of the treatment table may be reported.
    - metric: >-
        construction_C_penalty = log_p T_C(S) - log_p T_A(S) at S = p^{sigma},
        sigma in {2/3, 4/5, 1}
      direction: higher
      minimum_effect: >-
        Strictly positive at every sigma > 0, with derived values
        (1 - sigma/2) - (1 - sigma) = sigma/2, i.e. 1/3, 2/5, 1/2. If any is
        non-positive, the k-way-with-p-only-middle route is NOT dominated and the
        birthday-optimality closure genuinely needed reopening -- which would be the
        most consequential outcome available in this record.

  minimal_test:
    design: >-
      THE PRIMARY DELIVERABLE IS ZERO COMPUTE. Three stages, cheapest first, each able
      to terminate the line.
      STAGE 0 (pen and paper, ~1 hour): write the four constructions with their exact
      (S, T) rows, run the S = 0 and S = p known-answer gates symbolically, and run the
      random-advice null symbolically. If the S = 0 gate does not return p^{1/3+o(1)},
      the accounting is wrong and the record ends here at zero cost.
      STAGE 1 (arithmetic, minutes, numpy only): instantiate the frontier at SQIsign
      NIST-I (log2 p = 256) and NIST-V (log2 p = 512) and print S in entries beside T in
      F_{p^2}-operations, with the physical-impossibility statement attached to every row
      whose S exceeds the incumbent's own 2^{92.5} entries (EV-SSI-59f7a2). This is the
      practitioner-facing output: it says how much storage an amortising adversary would
      need before amortisation pays, and the predicted answer is "more than the attack it
      is trying to beat".
      STAGE 2 (optional toy arm, minutes, pure Python + numpy): on the supersingular
      2-isogeny graph at p in {103, 251, 503, 1019} -- the construction demonstrated in
      IDEA-20260805-062bee's feasibility probe -- measure the hitting time of a random
      subset of density d for d in {1/2, 1/4, 1/8, 1/16, 1/32} and check it against the
      Theta(1/d) prediction that Construction A's query cost rests on. This validates
      H-ADV-1 at TOY SCALE ONLY and is labelled as such.
    controls:
      - >-
        RANDOM-ADVICE NULL (primary, can fail, run BEFORE the treatment): see
        null_object_control. Its result is hash-committed before the treatment rows are
        computed.
      - >-
        SHUFFLED-FIBER CONTROL: Construction A with orders permuted among database
        curves must return no improvement.
      - >-
        S = 0 and S = p KNOWN-ANSWER GATES: must return p^{1/3+o(1)} and poly
        respectively. Both are forced and both are checked symbolically before any other
        row is read.
      - >-
        GRADED CONTROL WITH >= 3 INTERIOR POINTS: the frontier is evaluated at seven
        sigma values, and T_min must be NON-INCREASING in sigma. A non-monotone frontier
        is an accounting defect, not a finding.
      - >-
        NEARBY-OBJECT CONTROL: the same accounting applied to the oriented/CSIDH-shaped
        problem must NOT return the same flat frontier (see method_ceiling).
    required_metrics:
      - the four (S, T) rows with their derivations, machine-readable
      - T_min(sigma) at the seven pre-registered sigma values
      - the null frontier at the same seven values
      - the fiber_ratio for each construction
      - concrete S in entries and T in F_{p^2}-operations at log2 p in {256, 512}
      - toy hitting-time table with the Theta(1/d) residuals, labelled toy

  falsification_conditions:
    - >-
      The S = 0 gate does not return p^{1/3+o(1)}. Accounting broken; nothing reported.
    - >-
      The random-advice null returns any improvement over p^{1/3+o(1)}. The instrument
      scores size rather than content; no treatment row may be reported.
    - >-
      T_min(sigma) < 1/3 for some sigma <= 2/3 under a construction in the closed list.
      The composite prediction is FALSE and this goal has a sub-p^{1/3} row in the
      non-uniform model. This is the record's positive branch and it would require
      immediate independent review at the non-degradable tier under AGENTS.md rule 12
      before any statement is made outside the ledger.
    - >-
      Construction C is not dominated by Construction A at some sigma. The
      birthday-optimality closure does not cover the p-only-middle case and must be
      re-derived.
    - >-
      H-ADV-2 is false -- the order-to-curve direction is NOT polynomial. Then
      Construction A's build cost exceeds S, every row moves in the defender's favour,
      and the frontier is even flatter than predicted. This falsifies the record's
      arithmetic while strengthening its conclusion, and must be reported as such rather
      than presented as a confirmation.

  confounders:
    - >-
      BUILD COST VERSUS QUERY COST. Construction A's advice costs S poly-time steps to
      build. An adversary amortising over fewer than S/p^{1/3} instances never recovers
      that cost. Every row must print the break-even instance count beside it, and the
      record's headline prediction is about the QUERY cost only.
    - >-
      THE o(1). The incumbent's o(1) hides a superpolynomial overhead disclosed by its
      own author (frozen source section 1.1, READ verbatim: "much larger than the
      previous (log p)^{O(1)} cofactor"). Construction A's poly(log p) per step does NOT
      carry that overhead, so at CONCRETE parameters the flat region may not be flat.
      This is a genuine confounder for the Stage 1 table and it is why Stage 1 is
      reported as a concrete-cost table with its own tier, never as an exponent
      statement.
    - >-
      MIXING. Construction A's query cost Theta(p/S) assumes the walk equidistributes.
      The supersingular graph is Ramanujan (Pizer; RECALLED, cited in this corpus's own
      BATCH-046 closure list as "Ramanujan mixing"), so the spectral gap justifies it
      above the mixing time, but for a set of density near 1 the constant matters.
      Charged as heuristic H-ADV-1.
    - >-
      SAMPLING UNIFORMITY. Construction A's database is only as good as the uniformity
      of the random-maximal-order sampler. A biased sampler produces a database whose
      curves cluster, shrinking the effective density and raising T. This is the same
      uniformity question the pre-ledger entry C1-8 raises for a different purpose, and
      it is inherited here rather than solved.

  interpretation_limits:
    - >-
      NO ATTACK IS PROPOSED, NO EXPONENT IS CLAIMED TO MOVE, AND NO SECURITY CLAIM IS
      MADE ABOUT SQIsign OR ANY OTHER SCHEME. The predicted deliverable is a table of
      dominated rows plus one sharpened open question.
    - >-
      A frontier over a CLOSED LIST OF NAMED CONSTRUCTIONS is not a lower bound. Nothing
      here forbids an advice construction outside the list, and the record must never be
      cited as showing that preprocessing cannot help.
    - >-
      Every advice size at or above p^{2/3} is physically impossible at cryptographic p
      (p^{2/3} at log2 p = 256 is 2^{170} entries, against the 2^{92.5} entries that
      EV-SSI-59f7a2 already calls physically impossible). The frontier is therefore of
      theoretical interest at deployed parameters and the record says so on its face.
    - >-
      The toy arm validates a mixing constant at p <= 1019. That is never crypto-scale
      evidence (AGENTS.md rule 7) and the claim tier for that arm is toy.
    - >-
      A negative here closes exactly: the four named constructions, under the classical
      single-prime advice model, at the stated quantifier order. Forward guidance if it
      closes: the two candidate shapes of STEP 5 remain open, and the fiber_ratio metric
      is the screen any successor must clear.

  heuristic_assumptions:
    - id: H-ADV-1
      statement: >-
        FOR ALL sufficiently large p and FOR ALL subsets G of the supersingular vertex
        set with |G|/(p/12) = d and d >= p^{-1+epsilon}, a non-backtracking random walk
        of length n = O(log p) followed by independent restarts hits G after
        Theta(1/d) restarts, with the implied constants absolute.
      rigorous_support: >-
        The rigorous ingredient is the Ramanujan property of the supersingular
        ell-isogeny graph (Pizer, via Eichler; RECALLED, and named as "Ramanujan mixing"
        in this campaign's own committed closure list at BATCH-046), which bounds the
        mixing time by O(log p) and makes a post-mixing walk endpoint statistically
        close to uniform. The classical distribution statement it imitates is the
        geometric hitting law for a uniformly random sample: Pr[miss after k draws] =
        (1-d)^k.
      validation_plan: >-
        TOY SCALE, LABELLED TOY. Build the supersingular 2-isogeny graph at
        p in {103, 251, 503, 1019} by the two independent constructions already
        demonstrated in this campaign, draw random target sets at five declared
        densities d, and compare the empirical hitting-time CDF against the geometric
        law with a Kolmogorov-Smirnov statistic; tail check on the 99th percentile
        against -ln(0.01)/d. Crypto-scale validation is NOT available for this
        assumption in this environment and no shortcut is claimed.
      falsification_condition: >-
        Measured mean hitting time outside [0.5/d, 2/d] at any tested density with the
        graph construction controls passing.
    - id: H-ADV-2
      statement: >-
        FOR ALL p and FOR a uniformly random maximal order O in B_{p,infinity}, a
        j-invariant j(E) with End(E) isomorphic to O, together with an efficient
        representation of a connecting isogeny from a fixed special curve, is computable
        in time polynomial in log p.
      rigorous_support: >-
        RECALLED AND EXPLICITLY UNVERIFIED. The intended support is the constructive
        Deuring correspondence: a connecting ideal from a special maximal order, KLPT to
        replace it by an equivalent ideal of smooth norm, and ideal-to-isogeny
        translation -- the same computation SQIsign performs when it signs. NO SOURCE
        FOR THIS WAS READ; eprint and arXiv are unreachable from this environment. The
        frozen source's section 4.2 (READ) uses only the EASY half of this move
        (sampling random maximal orders and computing in them) and says nothing about
        the order-to-curve direction.
      validation_plan: >-
        Two routes, in order of cost. (1) CORPUS ROUTE, zero compute: locate a committed
        KN-LIT or KN-TECH record stating the complexity of ideal-to-isogeny and record
        its confidence field; if none exists, log the gap to knowledge/open-problems and
        carry the assumption as unvalidated. (2) TOY ROUTE: implement the translation at
        p <= 2^20 and measure the exponent of the running time in log p against the
        predicted poly. Toy scale only, labelled as such.
      falsification_condition: >-
        The order-to-curve direction is superpolynomial, or requires an auxiliary input
        that is itself hard to produce. Then Construction A's build cost exceeds S and
        the frontier is reported with that correction rather than defended.
    - id: H-ADV-3
      statement: >-
        FOR ALL advice strings A_p in the pre-registered closed list and FOR ALL advice
        elements a in A_p, |R(a)| <= (storage charged to a) x (time charged to the
        query), up to p^{o(1)}.
      rigorous_support: >-
        NOT PROVED, AND THIS IS THE RECORD'S LOAD-BEARING CONJECTURE. The supporting
        argument is the closure rule of object_first_candidate: an advice element
        resolves a curve either by naming it (storage) or by the query walking to it
        (time), and both channels are individually charged. The classical statement it
        imitates is the generic time-memory tradeoff T*S = N for inverting a random
        function, which is the shape this reduces to when the fibers are singletons.
      validation_plan: >-
        The four-construction survey IS the validation, and it is a survey rather than a
        proof. The metric is fiber_ratio; the prediction is 0 + o(1); the falsifier is
        any construction with a strictly positive fiber_ratio. Additionally the record
        pre-registers the two candidate shapes of STEP 5 as the places a violation would
        live, so a future proposal cannot claim a violation without exhibiting the fiber.
      falsification_condition: >-
        Any exhibited advice element whose resolution fiber exceeds storage x time by a
        p^{Omega(1)} factor.

  target_complexity:
    time_exponent: >-
      NO NEW TIME EXPONENT IS CLAIMED. The record's own deliverable is the FRONTIER
      T(S) = min(p^{1/3+o(1)}, p^{1+o(1)}/S), whose best point at any advice size below
      p^{2/3} is exactly the incumbent p^{1/3+o(1)}. Its positive branch, if the
      composite is falsified, would be a time exponent below 1/3 in the non-uniform
      model; the record exhibits no such construction.
    memory_exponent: >-
      Two memory-like axes must be reported separately and the record insists on this.
      (i) WORKING memory: p^{1/3+o(1)} for the incumbent (frozen source section 1.1,
      READ: "its memory cost is essentially as high as the complexity"), poly(log p) for
      Construction A's query. (ii) ADVICE: 0 for the incumbent, p^{sigma} for
      Construction A. Collapsing the two into one number is the error this record is
      built to prevent.
    best_known: >-
      Time and memory p^{1/3+o(1)}, conditional on Heuristic 1 (frozen source Theorem
      1.1, READ). Previously p^{1/2}*(log p)^{O(1)} at polynomial memory
      (Delfs-Galbraith). At zero advice, no committed row beats p^{1/3+o(1)}.
    hidden_overhead: >-
      The incumbent's o(1) hides a superpolynomial overhead disclosed by its own author
      (frozen source section 1.1, READ verbatim). Construction A's per-step cost is
      poly(log p) with NO such overhead, so the two rows are not commensurable at
      concrete parameters and the Stage 1 table must print both cofactors rather than
      netting them. This record does not assume its own o(1) is smaller than the
      incumbent's; it asserts they are of different shape and reports both.
    tradeoff_note: >-
      The van Oorschot-Wiener interpolation (frozen source section 1.1, READ:
      "time essentially sqrt(N^3/w) = p^{1/2+o(1)}/w^{1/2} with memory w") lives entirely
      on the WORKING-memory axis at zero advice. This record's frontier lives on the
      ADVICE axis at polynomial working memory. THE TWO ARE ORTHOGONAL AXES OF ONE
      THREE-DIMENSIONAL FRONTIER (time, working memory, advice) and no committed record
      in this corpus plots that third axis. Parallelisation: Construction A's query is
      an embarrassingly parallel independent-walk search, matching the incumbent's own
      "parallelizes perfectly" (section 1.1, READ) with no shared table, which is a
      genuine practical asymmetry and is reported as such and not as a cost advantage.

  dominated_by: >-
    Wesolowski 2026 (inputs/P13-WESOLOWSKI-2026/paper_fulltext.md), at every point this
    record derives. ROWS CHECKED ACROSS TIME, WORKING MEMORY, ADVICE, AND DATA/QUERIES
    BEFORE WRITING THIS, as docs/inventor-protocol.md section 5 requires:
    (1) Wesolowski 2026: time p^{1/3+o(1)}, working memory p^{1/3+o(1)}, advice 0,
        queries 0.
    (2) Delfs-Galbraith: time p^{1/2}(log p)^{O(1)}, working memory poly, advice 0,
        queries 0.
    (3) van Oorschot-Wiener interpolation: time p^{1/2+o(1)}/w^{1/2}, working memory w,
        advice 0, queries 0.
    (4) Meet-in-the-middle: time p^{1/2}, working memory p^{1/2}, advice 0, queries 0.
    (5) Kohel 1996: time p*(log p)^{O(1)}, working memory poly, advice 0, queries 0.
    (6) THIS RECORD, Construction A: time p^{1-sigma+o(1)}, working memory poly,
        advice p^{sigma}, queries 0. Dominated by row (1) for every sigma <= 2/3 on
        time, and by row (1) on advice for every sigma > 0.
    (7) THIS RECORD, Construction C: time p^{1+o(1)}/S^{1/2}, working memory poly,
        advice S. Dominated by row (6) at every S.
    The data/queries axis is 0 for every row -- OneEnd takes a static single-curve input
    and consumes no oracle -- so the frontier is three-dimensional and no row is
    dominated on that axis. This record adds two dominated rows and one axis nobody had
    plotted.
  sota_delta: >-
    ZERO on every attack axis: no time, working-memory, advice, query or preprocessing
    cost is reduced by anything in this record. QUANTITATIVELY, the deliverable is the
    statement that the advice axis is worth exactly 0 bits of time exponent over the
    entire window sigma in [0, 2/3] and worth (1 - sigma - 1/3) = 2/3 - sigma of time
    exponent above it, at a storage cost that is p^{170} entries at SQIsign NIST-I --
    i.e. the amortising adversary that motivated the question does not exist. The
    record's contribution to sota is a SCREEN: any future SSI proposal that consumes
    p-dependent precomputation must report its fiber_ratio, and a fiber_ratio of 0 means
    its frontier is already on the table above.

