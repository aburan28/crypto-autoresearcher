idea:
  id: IDEA-20260806-9c2f80
  question_id: RQ-SSI-001
  goal_id: GOAL-SSI-001
  added: '2026-08-06'
  title: >-
    Every one of this goal's twelve closures quantifies "for all E, with no advice":
    the (S, T) preprocessing frontier for OneEnd under the changed quantifier
    "for all p, there exists advice A_p of size S, for all E" -- with the resolution
    fiber R(a) as the tracked object and a random-advice null that can fail
  class: mechanism

  claim: >-
    DEC-20260805-596d71 records twelve sub-p^{1/3} avenues closed by named
    structural obstructions and concludes that p^{1/3+o(1)} is the tight CLASSICAL
    exponent. EVERY ONE OF THOSE TWELVE IS A STATEMENT IN THE UNIFORM,
    SINGLE-INSTANCE MODEL: the algorithm gets j(E) and nothing else. The deployed
    setting is not that model. SQIsign fixes ONE prime per security level for ALL
    users (inputs/P13-WESOLOWSKI-2026/paper_fulltext.md section 4.1 evaluates at
    p = 5*2^248-1 for NIST-I and p = 27*2^500-1 for NIST-V, READ), so an adversary
    may pay an arbitrary p-dependent, instance-independent preprocessing cost once
    and amortise it across every key ever issued under that prime. Nobody in this
    corpus has written down what that buys.
    THE OBJECT IS THE FRONTIER T(S): the smallest per-instance time achievable
    given advice of size S that depends on p only. Four constructions are priced
    here at zero compute and the composite is PRE-REGISTERED AS A FALSIFIABLE
    PREDICTION:
      T(S) = min( p^{1/3+o(1)} , p^{1+o(1)} / S )   for every S,
    i.e. ADVICE STRICTLY BELOW p^{2/3} BUYS NOTHING AT ALL, the frontier is FLAT at
    the incumbent exponent across the entire window S in [p^{1/3}, p^{2/3}], and the
    first advice size that matches the incumbent's TIME is p^{2/3} -- at which point
    it is dominated on memory by a factor p^{1/3}.
    THE PREDICTION CAN FAIL, AND ITS FAILURE IS THE INTERESTING OUTCOME: exhibiting
    ANY advice construction with T(S) strictly below min(p^{1/3}, p/S) at any S
    would be a sub-p^{1/3} result in the non-uniform model, would not contradict a
    single one of the twelve closures (all of which quantify without advice), and
    would be the first genuinely new quadrant this goal has entered since BATCH-046.
    NO SUCH CONSTRUCTION IS EXHIBITED HERE AND NONE IS CLAIMED TO EXIST.

  discriminated_from:
    nearest_existing_idea: IDEA-20260805-250e50
    why_it_is_the_nearest: >-
      Both records ask what would have to be true for the admitted degree threshold
      to fall below theta = 1/3. 250e50 answers with a SCREEN priced by one number
      gamma (per-query time exponent) and one number s (selectivity).
    differing_observable: >-
      THE MEMORY/ADVICE EXPONENT S, AND THE QUANTIFIER THAT LICENSES IT.
      250e50's cost function E(theta, s, gamma) = (1/2 - 3theta/2)_+ + max(gamma, theta - s)
      HAS NO MEMORY VARIABLE AT ALL -- gamma is a TIME exponent per screen query, and
      the identity is memory-blind by construction, which its own record states. This
      record's observable is the PAIR (S, T) with S the size of an instance-INDEPENDENT
      string, and its quantifier is "for all p, exists A_p, for all E" rather than
      250e50's "for all p, for all E". A screen realised as a precomputed table has
      gamma = 0 in 250e50's accounting and is therefore scored as free, which is
      exactly the error this record exists to price: 250e50's own consequence (2) says
      a free exact screen returns E = 1/5, and the four constructions below show the
      cheapest realisation of a free exact screen costs S = p^{1/2 + 3theta/2} advice,
      which at theta = 1/5 is p^{4/5} -- an exponent 250e50 cannot express.
    also_discriminated_from:
      - >-
        IDEA-20260805-bc8246 -- the only other committed SSI record with a memory
        axis. Its w is WORKING memory consumed by one execution on one instance, and
        its tracked object is the cost functional M(A,T,n). This record's S is not
        working memory: it is written before any instance exists, read by every
        instance, and never rewritten. Under bc8246's own AT^2 functional the two are
        charged differently -- working memory is charged per execution, advice once
        across p^{1-o(1)} executions -- and that difference is a differing observable,
        not a framing.
      - >-
        IDEA-20260803-48e258 -- p*(w) varies w only inside the BASELINE's vOW cost.
        No advice term appears; the curve is a comparison of two single-instance cost
        curves. This record adds no crossover and computes no p*(w).
      - >-
        IDEA-20260801-007 -- measures the CSIDH group action's effective collision
        surface. Different problem (vectorization, not OneEnd), different object
        (reachable set of short action words), no advice quantifier.
      - >-
        ideas/catalogue-20260805/B1-9 (pre-ledger) -- a per-vertex terminal filter
        with cost curve p*C(M)/M^{3/2} at POLYNOMIAL memory. That entry's filter is
        recomputed at every vertex from j alone; this record's advice is computed once
        for all vertices and stored. B1-9's frontier has no S axis and its stated
        target is polynomial memory, which is the S = 0 corner of this record.
      - >-
        ideas/catalogue-20260805/A1-4 and A4-6/A4-7 (pre-ledger) do treat multi-target
        windows and an (S,T) preprocessing table -- FOR THE PRIME-FIELD ECDLP. Neither
        touches the supersingular problem, and the mechanism that flattens the
        supersingular frontier (random self-reducibility via Algorithm 3's own walk)
        has no ECDLP analogue in those entries.

  object_first_candidate:
    tracked_object: >-
      THE RESOLUTION FIBER R(a). For each element a of the advice string A_p, R(a) is
      the set of supersingular j-invariants E for which a alone, plus poly(log p) work,
      yields a non-scalar endomorphism of E. The advice string itself is constant under
      the target's operations and so is a degenerate tracked object; R(a) is not. R(a)
      is followed through the computation as: advice element a -> the curves it names ->
      the curves reachable from those by a poly-representable isogeny -> the instances
      resolved. The frontier is decided by ONE quantity: how fast |R(a)| grows relative
      to the storage a consumes.
    one_step_propagation_rule: >-
      STATED EXPLICITLY BECAUSE IT IS THE MECHANISM. If E is in R(a) and phi: E -> E'
      is an isogeny available in an efficient representation (Definition 2.1 of the
      frozen source, READ), then E' is in R(a): from End(E) and phi one obtains an
      order in End(E') by pushing the lattice through phi and saturating, in time
      polynomial in log deg(phi) and log p. So R(a) IS CLOSED UNDER ADDING ANY CURVE
      REACHED BY A KNOWN, WALKED PATH. It is therefore a union of graph balls, and its
      size is bounded by the number of curves the attacker actually walks to -- which
      is charged as TIME, not as advice. That single closure property is what forces
      T*S >= p^{1-o(1)} for every construction below, and its failure is the only way
      the prediction can be false.
    established_families_off_limits: >-
      OFF-LIMITS AS THE PRIMARY LENS FOR THIS RECORD, declared so a variant cannot
      arrive in new notation: (a) meet-in-the-middle / claw / golden collision and
      every van Oorschot-Wiener reparametrisation -- they enter only as the S = 0
      column of the frontier table; (b) KLPT and quaternion-side algorithms as attacks
      (KLPT enters only as the poly-time constructor of a database entry, and that use
      is flagged as heuristic assumption H-ADV-2); (c) orientation / CM descent --
      CLOSED for this goal by DEC-20260804-3677f1 / EV-SSI-8aaad0 and NOT reopened;
      (d) torsion-image / Kani higher-dimensional embeddings -- out of RQ-SSI-001 scope
      as a positive target; (e) quantum models -- this record is classical on its face;
      (f) SQIsign transcript statistics; (g) CSIDH collimation / FC0.
      ALSO OFF-LIMITS: proposing any new single-instance algorithm. This record
      proposes none.
    newness_score: >-
      The INGREDIENTS are old and this record says so: Hellman-style preprocessing,
      known-endomorphism-ring databases, and the walk-until-you-hit-a-known-curve
      attack are standard folklore, and the frontier T*S = p is the generic
      time-memory shape. What this corpus does not contain -- verified by the audit at
      coordination/goals/GOAL-SSI-001/batches/BATCH-b3c87f/tasks/TASK-20260806-fd3518/duplication_audit.md
      -- is (i) the observation that all twelve committed closures carry the no-advice
      quantifier and therefore say nothing about this quadrant, (ii) the resolution-fiber
      closure rule as the named mechanism that flattens the frontier, (iii) the
      derivation that Algorithm 3's own re-randomisation makes the MULTI-TARGET version
      of the question trivial, which is why the advice question is the non-trivial one,
      and (iv) the pre-registered composite T(S) = min(p^{1/3}, p/S) as a falsifiable
      screen every future advice-bearing proposal must clear.
    testability_score: >-
      Very high and entirely zero-compute for the primary deliverable: four
      constructions, four lines of arithmetic each, plus one closure argument. The
      optional toy arm (hitting times on a small supersingular graph) reuses the graph
      construction already demonstrated in IDEA-20260805-062bee's feasibility probe.
    survival_score: >-
      R(a) survives the whole pipeline -- it is defined by the pipeline's own reachability
      relation. It DISSOLVES precisely when the advice is not a set of curves-with-orders
      but some other p-dependent structure whose fibers are not graph balls. That
      dissolution point is the record's forward guidance and is stated in
      interpretation_limits.

  mechanism: >-
    ALL PAPER QUOTATIONS ARE FROM inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, READ
    IN THIS SESSION. Steps labelled RECALLED are candidates to check, never authority.

    STEP 0 -- WHY THE MULTI-TARGET QUESTION IS TRIVIAL AND THE ADVICE QUESTION IS NOT.
    Algorithm 3 (lines 195-208, READ) does not attack E. It walks E to a uniformly
    random E' and attacks that, repeatedly, pulling the solution back through the walk.
    OneEnd is therefore RANDOM SELF-REDUCIBLE BY THE INCUMBENT'S OWN CONSTRUCTION.
    Consequence, forced: an adversary holding M instances under one prime is no better
    off than an adversary holding one, for the task "break at least one", because the
    single-instance adversary can manufacture as many uniformly random instances as it
    likes for free. So batching buys nothing and there is nothing to measure there.
    What is NOT covered by self-reducibility is data written BEFORE any instance is
    seen. That is the object.

    STEP 1 -- CONSTRUCTION A, THE KNOWN-ENDOMORPHISM DATABASE. Build a set G of
    S = p^sigma curves with known End, then answer an instance by walking from E until
    the walk lands in G; on landing at F in G, the walked path phi: E -> F plus End(F)
    gives End(E) in poly time. Cost of a query: the walk must hit a set of density
    S/(p/12), so ~12p/S steps, each poly. HENCE T = p^{1-sigma+o(1)} AT MEMORY p^sigma.
    Construction cost, and this is the load-bearing step: G is built WITHOUT solving any
    instance, by sampling a random maximal order O in B_{p,infinity} and translating it
    to a curve. The frozen source's own section 4.2 (READ) uses the first half of
    exactly this move -- "we sample random maximal orders (uniformly random up to
    conjugation), compute the ideal P, and find the smallest vector in P" -- for its
    Heuristic-1 experiments at SQIsign-sized p. The second half (order -> j-invariant,
    via a connecting ideal, KLPT, and ideal-to-isogeny) is RECALLED as polynomial and is
    recorded as heuristic assumption H-ADV-2, not asserted.
    Frontier row: (S, T) = (p^sigma, p^{1-sigma}). It meets the incumbent's TIME at
    sigma = 2/3 and is worse at every smaller sigma: at sigma = 1/3, T = p^{2/3}, which
    is p^{1/3} SLOWER than simply ignoring the advice and running Algorithm 3.

    STEP 2 -- CONSTRUCTION B, THE PRECOMPUTED delta-SCREEN, WHICH IS WHERE 250e50's
    "FREE EXACT SCREEN" ACTUALLY LIVES. 250e50 shows that a free exact test for
    delta_E <= p^theta gives time exponent 1/5 at theta = 1/5, and does not exhibit one.
    Realise it as advice: store G_theta = {E : delta_E <= p^theta}. Its size follows
    from the rank-3 short-vector count already derived in this campaign
    (IDEA-20260805-2d2c41: the number of vectors of degree <= T in a rank-3 lattice of
    determinant asymptotic to p is ~ c T^{3/2} p^{-1/2}), giving
    |G_theta| ~ p^{1/2 + 3theta/2}. Walk until the instance lands in G_theta, then run
    Algorithm 2 at threshold p^theta: time p^{1/2 - 3theta/2} + p^{theta}, ADVICE
    p^{1/2 + 3theta/2}. Balanced at theta = 1/5: TIME p^{1/5}, ADVICE p^{4/5}.
    THAT IS 250e50's 1/5 WITH ITS PRICE TAG ATTACHED FOR THE FIRST TIME, and the price
    is an advice exponent 250e50's identity cannot express. But note the collapse:
    every curve in G_theta was generated from a maximal order, so its End is known
    anyway, so Construction B IS Construction A with a redundant extra step -- at
    S = p^{4/5}, Construction A gives T = p^{1/5} directly. The screen adds nothing.
    RECORDING THIS COLLAPSE IS PART OF THE DELIVERABLE: it says the free-exact-screen
    branch of 250e50 is not a new mechanism but a re-parametrisation of the database.

    STEP 3 -- CONSTRUCTION C, THE THREE-WAY SPLIT WITH A p-ONLY MIDDLE. This is the
    construction that formally reopens the "birthday optimality / compositional k-way
    split" closure, and it reopens it with a stated reason. THE OBSTRUCTION AS RECORDED
    (coordination/goals/GOAL-SSI-001/batches/BATCH-046/tasks/TASK-20260804-55952a/novel_angles_analysis.md,
    READ): "Compositional (k-way splits): Birthday scaling: k>2 gives worse collision
    probability; 2-way is optimal." WHY IT DOES NOT COVER THIS CASE: that argument
    charges every one of the k lists as instance-dependent work repeated per instance.
    A middle list that depends only on p is written once and read by p^{1-o(1)}
    instances, so its cost does not appear in the per-instance birthday accounting at
    all. The argument as stated therefore does not apply, and the case must be priced
    rather than inherited.
    PRICING IT: write phi = eta o sigma o psi with deg psi <= X1, deg sigma <= Xm,
    deg eta <= X2. The middle table M must contain the specific pair
    (cod psi, dom eta). cod psi ranges over the ~X1^2 curves in the smooth ball around
    E and dom eta over the ~X2^2 curves around E^{(p)}; both balls are instance-dependent
    and, by Ramanujan mixing, essentially uniform in the vertex set. So M must contain
    one of ~X1^2 X2^2 candidate pairs out of ~(p/12)^2, requiring
    |M| >= p^2/(X1^2 X2^2). With balanced lists A = X1^2 = X2^2, time is A and advice
    is p^2/A^2, i.e. T = p^{1+o(1)}/S^{1/2}. That is STRICTLY WORSE than Construction A
    at every S: p/S^{1/2} > p/S for S > 1. So k = 3 with a p-only middle is dominated,
    and the closure survives the reopening -- WITH A MECHANISM RATHER THAN BY
    INHERITANCE. That is the §4 standard and it is the honest expected outcome.

    STEP 4 -- THE COMPOSITE AND WHY IT IS FLAT. An attacker may always ignore the advice
    and run Algorithm 3 at p^{1/3+o(1)}. So T(S) <= p^{1/3+o(1)} for every S, and
    T(S) <= p^{1+o(1)}/S by Construction A. The prediction is that these two are the
    whole frontier. THE ARGUMENT, which is the resolution-fiber closure rule of
    object_first_candidate: any advice element a resolves exactly the curves it names
    plus those reachable from them by a path the attacker actually walks. Naming costs
    storage one curve at a time; reaching costs time one step at a time. Neither
    channel produces a fiber larger than (storage) x (time), so
    (number of instances resolvable per unit advice) x (time) <= p^{1+o(1)} unless a
    single advice element resolves a super-polynomially large set of curves it has not
    walked to. NO SUCH ADVICE ELEMENT IS KNOWN AND NONE IS CONSTRUCTED HERE. The claim
    is not that none exists; the claim is that the frontier question reduces to exactly
    that one question, which is a sharper open problem than "is there a sub-p^{1/3}
    algorithm".

    STEP 5 -- WHAT WOULD BREAK IT, STATED AS FORWARD GUIDANCE. An advice element whose
    fiber is not a walked ball. Two named candidate shapes, neither exhibited:
    (i) a p-only structure from which delta_E or its minimal vector is computable for
    an arbitrary j WITHOUT walking -- this is precisely 250e50's free exact screen in
    its non-database realisation, and the record for it to beat is now S = p^{4/5};
    (ii) a p-only structure that answers "are these two j-invariants connected by a
    smooth isogeny of degree <= X" for arbitrary pairs -- a p-only object with
    p^2-sized fibers, which the STEP 3 counting shows would need |M| >= p^2/(fiber),
    i.e. it is the same question again. Both are stated so that a future proposal must
    exhibit its fiber growth rather than assert a speedup.

