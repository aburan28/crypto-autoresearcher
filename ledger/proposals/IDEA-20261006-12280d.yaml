      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-fbd582.yaml
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-fbd7b1
      - KR-RHO-13bf67
      - KR-RHO-fbd582
    nearest:
      - ref: KR-RHO-fbd7b1
        provenance: internal
        relation: adjacent
        delta: >-
          That row states the probabilities 0.71875 and 0.5625 after
          1.5 sqrt(l) operations. This proposal asks for a difference
          of at least 8 successes on 64 targets at l=251 with cutoff
          23. The exponent movement is 0.
        verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-fbd7b1.yaml
      - ref: KR-RHO-13bf67
        provenance: internal
        relation: adjacent
        delta: >-
          That row is the Omega(sqrt(l)) floor. A gap of 8 successes
          inside a budget of 23 operations does not cross it. The
          exponent movement is 0.
  dominated_by: >-
    Pollard rho at exponent 1/2 and polynomial memory dominates any
    reading of this sample as an attack. KR-RHO-fbd7b1 already states
    the ordering probabilities this sample is compared with. The
    sample does not beat rho or that row.
  sota_delta: >-
    The separator is a difference of 8 successes in 64 trials at
    cutoff 23 on Z/251Z, against the probabilities already stated on
    KR-RHO-fbd7b1. The distance to a sub-square-root algorithm is the
    full exponent 1/2, and this proposal moves that exponent by 0.
