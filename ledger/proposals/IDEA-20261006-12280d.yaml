      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KR-RHO-fbd582
      provenance: internal
      claim: >-
        A shared inversion makes x(P-Q) cheap next to x(P+Q), and that
