idea:
  id: IDEA-20261007-7541f8
  question_id: RQ-ECDLP-4fcbd3
  added: '2026-10-07'
  status: proposed
  approved_by: null
  title: >-
    Sign disagreement of χ(x(P)) and χ(x(2P)) on
    y^2 = x^3 + 4x + 6 over F_71
  class: control
  claim: >-
    On the nonsingular curve E: y^2 = x^3 + 4x + 6 over F_71, let D
    be the affine points with y(P) ≠ 0, x(P) ≠ 0, and x(2P) ≠ 0.
    Let χ be the quadratic character of F_71. The fraction of points
    of D with χ(x(P)) ≠ χ(x(2P)) is at least 1/3. This is a
    disagreement rate of two characters. It is not the absolute sum
    of χ(x(P)+x(2P)), not the image of x(P)+x(2P), and not a
    comparison of the integer lifts of x and y.
  mechanism: >-
    The representation is the pair (χ(x(P)), χ(x(2P))). Sigma is the
    singleton {doubling}. Doubling defines the second character. It
    is not a rho step and not a factor-base relation. Each character
    is a sign, so the pair has at most four values and the
    projection is lossy once |D| > 4. The second sign is not assumed
    to be a function of the first: that independence is the priced
    fraction, not a theorem. The discrete log is not an input.
    Families of endomorphism walks are not the lens.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-4fcbd3
      provenance: internal
      claim: >-
        The question asks whether a coordinate function concentrates.
        This proposal prices a disagreement rate of χ(x) under one
        doubling and claims no discrete-log spectrum.
      verified_by: ledger/questions/RQ-ECDLP-4fcbd3.yaml
    - ref: KR-RHO-fb88e6
      provenance: internal
      claim: >-
        Negation preserves x, so χ(x(-P)) = χ(x(P)). The claim uses
        that identity and takes no iteration factor.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-fb88e6.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A sub-square-root algorithm must exploit the representation.
        This proposal does not claim an algorithm.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
  assumptions:
    - >-
      4·4^3 + 27·6^2 = 1228, so the discriminant is -16·1228 =
      -19648 ≡ 19 (mod 71), which is nonzero. The characteristic is
      not 2 or 3.
    - χ(0) is not used. Points with x(P) = 0 or x(2P) = 0 are outside D.
    - x(2P) is computed from the duplication formula, which needs y(P) ≠ 0.
  predictions:
    - metric: >-
        the fraction of D on which χ(x(P)) differs from χ(x(2P))
      direction: higher
      minimum_effect: the fraction is at least 1/3
  minimal_test: >-
    Enumerate E(F_71). Drop points with y = 0, x = 0, or x(2P) = 0.
    Compute χ(x(P)) and χ(x(2P)) and report the disagreement
    fraction. A second enumeration in reverse x-order must produce
    the same fraction. A control that replaces χ(x(2P)) by an
    independent fair sign must produce a disagreement fraction
    within 0.15 of 1/2 on the same D, or the character table is
    void. The fair-sign control is not a curve point.
  controls:
    - reverse-x enumeration agrees on the fraction and on |D|
    - the fair-sign control lands within 0.15 of 1/2, or the run is void
    - points with a zero x-coordinate are excluded
    - the discrete log is not an input
  falsification_conditions:
    - >-
      The disagreement fraction is strictly below 1/3, and the two
      enumerations agree, and the fair-sign control is within 0.15
      of 1/2. The lower bound is then false on this curve.
    - >-
      The two enumerations disagree, or the fair-sign control is
      more than 0.15 away from 1/2. The counter is then void.
  confounders:
    - Negation preserves x, so P and -P contribute the same pair of signs. The fraction is over points, and that repetition is part of the claim.
    - A point with x(2P) = 0 that is folded into D would require χ(0).
  interpretation_limits:
    - A fraction of at least 1/3 does not change the rho exponent 1/2.
    - A fraction below 1/3 falsifies only this curve.
    - The fraction is not the absolute sum of χ(x(P)+x(2P)) on any curve.
  heuristic_assumptions:
    - id: H1
      statement: >-
        If the sign χ(x(2P)) were an independent fair sign, the
        disagreement fraction would have mean 1/2. The claim is the
        weaker lower bound 1/3 on this one curve. Independence is
        the null, not a theorem about doubling.
      rigorous_support: >-
        A fair independent sign disagrees with a fixed sign half the
        time. No theorem is claimed that doubling mixes χ(x). The
        bound 1/3 is the prediction.
      validation_plan: >-
        Compute the disagreement fraction on this curve. H1 fails if
        the fraction is strictly below 1/3 while the two enumerations
        agree and the fair-sign control is within 0.15 of 1/2.
        Sample size is the whole set D.
  target_complexity:
    time_exponent: >-
      Unchanged at 1/2. A disagreement fraction is not an exponent.
    memory_exponent: >-
      Unchanged. The census stores O(p) field elements at p = 71.
    best_known: >-
      KR-RHO-13bf67, Omega(N^{1/2}) generic-group operations. The
      file was opened for this proposal.
    hidden_overhead: >-
      No new o(1) cofactor is claimed. The census is one pass over
      F_71.
    tradeoff_note: >-
      No time-memory tradeoff. The census is a single pass.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-13bf67
      - KR-RHO-fb88e6
      - KR-RHO-fbd582
    nearest:
      - ref: KR-RHO-fb88e6
        provenance: internal
        verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-fb88e6.yaml
        relation: adjacent
        delta: >-
          Negation preserves x, so the two points over one x share
          χ(x). This proposal measures how often doubling changes
          that sign. The gap is a fraction of at least 1/3 against a
          fraction below 1/3, with no square-root-of-two iteration
          factor.
      - ref: KR-RHO-13bf67
        provenance: internal
        verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
        relation: orthogonal
        delta: >-
          The row is a generic-group operation lower bound. This
