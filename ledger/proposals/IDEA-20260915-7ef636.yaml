      verified_by: idea-generator TASK-20260915-5ba08b (corpus record KN-LIT-102cdb read this session; the underlying paper was not opened)
    - ref: >-
        Kaplan-Meier product-limit estimator for right-censored samples (Kaplan and
        Meier, JASA 1958)
      provenance: recalled
      claim: >-
        RECALLED, THEREFORE A POINTER AND NOT SUPPORT. Standard nonparametric estimator
        of a median from right-censored observations; named so the reviewer can check
