idea:
  id: IDEA-20260915-7ef636
  title: >-
    Separate the branching-order effect from the structure effect with a 2x2 plus a
    PLANTED-CORE null: a structure-preserving relabelling makes the order random while
    holding the system fixed, and a random system built with a propagating ml-variable
    core makes the core exist while holding the algebra random - the four cells decide
    whether WDSat's advantage is the descended algebra, the existence of any
    propagating core, or the variable numbering the generator happens to emit
  class: control
  research_question_id: RQ-ICPERF-94c86e
  question_id: RQ-ICPERF-94c86e
  question_ids: [RQ-ICPERF-94c86e, RQ-SATIC-1ae57a]
  area: ICPERF
  goal_ids: [GOAL-ICPERF-e6b6a4]
  status: proposed
  proposed_by: idea-generator
  task_id: TASK-20260915-5ba08b
  recorded_at: '2026-09-15'
  kind: instrument

  claim: >-
    P3b and P6 of H-ICPERF-cc4847 are measured on objects that differ in TWO ways at
    once, and as measured in RUN-ICPERF-305ca3 they may be one mechanism rather than
    two. P3b changes the branching ORDER on a fixed instance (non-core-first, censored
    wall ratio lower bounds 51-1843x); P6 changes the instance CONTENT at fixed shape
    (matched random Boolean systems, 20.06x and 114.30x in conflicts where they
    finish, all six n19l6 nulls censored at 180 s). A random Boolean system differs
    from a structured one in content AND in whether its first ml variables propagate
    anything, so P6's ratio is an upper bound on the content effect and contains an
    unknown part of the order effect. This record claims the two are separable by a
    2x2 design plus one new null object, and predicts the separation quantitatively.
    Write L(content, order) = log2(median WDSat conflicts) over the four cells
    {structured, random-content} x {core-first order, random order}. Then:
    (D1) Delta_order := L(structured, random) - L(structured, core-first) >= 6 bits at
    l = 6 - i.e. scrambling the variable numbering of an OTHERWISE IDENTICAL system
    costs at least 64x in conflicts, which P3b's censored wall bound could not
    quantify;
    (D2) Delta_content := L(random, core-first) - L(structured, core-first) >= 3 bits;
    (D3) the effects are NOT additive in logs - the interaction
    L(random, random) - L(random, core) - L(structured, random) +
    L(structured, core) is <= -2 bits, because a core-first order can only pay off
    when a propagating core exists;
    and (D4, the discriminating cell) a PLANTED-CORE null - a random Boolean system
    whose N - ml non-core variables are defined as random XOR combinations of the ml
    core variables, so that assigning the core determines everything by unit
    propagation exactly as the Weil-descent linking equations e_k = sigma_k(x) do -
    lands within 2 bits of the structured instance under the core-first order. If D4
    holds, WDSat's advantage on these instances is the EXISTENCE of a propagating
    linear core, not the S_4 algebra, and P6's mechanism sentence ("Random systems of
    the same shape have no such core") is the whole of it. If the planted-core null is
    instead more than 4 bits slower than the structured instance, the descended S_4
    content contributes independently and P6's structure reading survives with a
    measured size.
    Nothing here is about any curve and no exponent is claimed.

  mechanism: >-
    THE OBJECT. WDSat is a DPLL solver with a STATIC branching order supplied by -g
    and a default order that is the variable numbering of the input file
    (KN-LIT-6e036d). Proposition 1 of KN-LIT-102cdb, quoted in H-ICPERF-cc4847's
    mechanism paragraph, says that assigning the ml core variables x_{i,j} determines
    every e-variable by unit propagation through the linking equations e_k =
    sigma_k(x), so a search that branches only on the core visits 2^{ml} leaves and
    never pays for the e-layer. That statement has TWO ingredients - a set of ml
    variables that determines the rest by propagation, and the algebraic content of
    the descended S_4 equations that prunes among those 2^{ml} assignments. The four
    arms below hold each fixed in turn.

    ARM 1, RELABELLING (order changed, system identical). Apply a uniformly random
    permutation pi to the variable indices of the shipped .anf and .dimacs, renaming
    only. The system is the SAME system - every model maps through pi, every equation
    is the same equation - so any change in conflicts is attributable to the order
    alone. This is the lossy-projection discipline applied to an instrument: the
    projection "which variables are the first ml in the file" discards everything
    about the algebra and is exactly what the default order reads, so relabelling
    isolates it. Run both (a) default order on the relabelled file, and (b) -g
    pi(core) on the relabelled file, which must reproduce the original conflict count
    EXACTLY (WDSat is deterministic and the search tree is isomorphic). Arm 1(b) is a
    hard identity check: if it does not reproduce, the relabelling script or -g is
    wrong and no other arm may be read.

    ARM 2, PLANTED-CORE NULL (core exists, algebra random). Generate a random Boolean
    system of the template's shape but with the propagation structure planted: choose
    the ml core variables; for each of the N - ml remaining variables e_k, emit a
    definition e_k = (random XOR of a random subset of the core monomials of the
    template's degree profile); then emit the template's number of remaining equations
    as random Boolean polynomials over all N variables matching the per-equation
    monomial-count and degree profile. Such a system has a core that determines
    everything by propagation and has no S_4 content. It is the null object the
    existing 18 nulls are NOT: `shape_matches_template: true` in RUN-ICPERF-305ca3
    matches variable count, equation count and degree profile, and says nothing about
    propagation.

    ARM 3, CONFLICT BUDGET INSTEAD OF A WALL TIMEOUT. RUN-ICPERF-305ca3 censors on
    wall (120 s for noncore_first, 180 s for nulls), so 22 of 30 noncore rows and 9 of
    18 null rows are right-censored on a hardware-dependent axis, and the reported
    ratios are lower bounds of unknown looseness on the hardware-INDEPENDENT metric the
    question designates as primary. Budget on conflicts instead (e.g. 2^{31} conflicts,
    with wall recorded but not used for censoring): every censored row then has a
    lower bound in the primary unit, and a per-cell Kaplan-Meier median over the
    censored sample is computable rather than a median over survivors only.

    WHAT EACH OUTCOME MEANS. If D1 and D2 both hold and D3 is negative, the boundary
    table needs TWO columns - an order-sensitivity column and a content column - and
    every wall time in it is conditional on the generator's numbering, which must then
    be recorded as an instance property. If D1 holds and D2 collapses (Delta_content
    under 1 bit), the entire measured advantage is order and P6 is not a structure
    result. If D4 holds, the mechanism is the linear linking layer - which is a
    property of Weil descent as such and transfers to every (m, l) and to the
    Nagao/chained presentations - and the correct headline is that the SAT advantage
    is bought by the descent's own linear structure and not by S_4.

  what_this_would_have_caught_in_RUN_ICPERF_305ca3: >-
    (1) The 20-114x null/structured conflict ratio (P6) is reported as "the solver's
    speed is a property of the descended structure, not of the size", but the nulls
    differ from the structured instances in propagation as well as in content, so the
    ratio cannot support that attribution; this design would have said which part is
    which. It is the same gap the review plan's own proves-too-much object 2 names -
    that object runs ONE relabelled instance as a review control; this record turns it
    into a measured axis with an error bar over K relabellings and adds the
    planted-core null, which no queued task has. (2) The >= 50x P3b bound is a
    right-censored WALL ratio (22 of 30 rows at the 120 s cap) on a question whose
    primary unit is conflicts; a conflict budget would have produced the number
    instead of a bound. (3) All six n19l6 nulls were censored at 180 s, so the P6
    aggregation reports `holds: true` with one of three cells null - a conflict budget
    plus a censored-median estimator would have given n19l6 a value or an honest
    lower bound in the primary unit.

  novelty_status: unverified
  novelty_screen:
    what_is_not_new: >-
      Variable-order sensitivity of DPLL is elementary and is the subject of C2 of
      SRC-SATIC-TRIMOSKA-2019 and of P3 of H-ICPERF-cc4847. Random-instance controls
      are standard. Isomorphism-invariance under variable renaming is a textbook
      property of CNF/ANF and is the basis of every graph-automorphism symmetry-breaking
      tool.
    what_is_new: >-
      Within this program: (i) the 2x2 with the relabelled arm as the order-only cell
      and the explicit interaction term, (ii) the PLANTED-CORE null, which no record in
      this corpus proposes and which is the object that separates "the descent's linear
      linking layer" from "the S_4 algebra", and (iii) censoring on conflicts rather
      than wall so the primary unit carries the bound. Whether the Trimoska line or any
      later SAT-for-PDP work already reports a planted-core control is UNCHECKED; the
      program's records of that line (KN-LIT-102cdb, KN-LIT-6e036d) are abstract- and
      code-level and do not mention one.
    searched: >-
      Read this session: RUN-ICPERF-305ca3 task-report.md, H-ICPERF-cc4847,
      the review plan (including its proves_too_much objects), KN-LIT-6e036d,
      KN-LIT-036049, and the four sibling proposals IDEA-20260915-{0d8e90, 3119c9,
      3f1964, eee7e4}. `rg` over ledger/proposals/ and knowledge/ for "relabel",
      "permutation", "null object", "planted", "branching order". No web search;
      hence unverified.

  citations:
    - ref: experiments/EXP-ICPERF-66fd51/runs/RUN-ICPERF-305ca3/task-report.md
      provenance: internal
      claim: >-
        UNREVIEWED OBSERVATIONS - noncore_first: 8 of 30 rows finished, 22 timeouts at
        120 s, censored wall ratio lower bounds 51.68-1843.32; null objects: 9 of 18
        finished, all 18 `shape_matches_template: true`, null/structured-U median
        conflicts 3540911.5/30978.5 = 114.30 at (15,5) and 5109609.75/254656.5 = 20.06
        at (17,6), n19l6 ratio null (all six nulls censored at 180 s); WDSat default U
        median conflicts 30978.5 / 254656.5 / 255301.0.
      verified_by: idea-generator TASK-20260915-5ba08b (read in full this session)
    - ref: ledger/hypotheses/H-ICPERF-cc4847.yaml
      provenance: internal
      claim: >-
        P3(b) words the non-core-first prediction on median WALL time with timeout rows
