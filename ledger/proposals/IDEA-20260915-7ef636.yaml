      conflict count in the boundary table's PDP row. If D4 holds, the mechanism behind
      the SAT column's cost is the descent's linear linking layer, which is present at
      every (m, l) and in the chained-S_3 presentation, so the attribution transfers
      across the table even though no exponent moves.
    memory_exponent: >-
      Unchanged. WDSat's memory is fixed at compile time; the relabelled and planted
      nulls have the template's variable count by construction, so all arms share one
      static build per cell.
    best_known: >-
      For the same measurement: nothing. P3b (censored wall ratios 51.68-1843.32) and
      P6 (20.06x, 114.30x in conflicts, one cell null) of RUN-ICPERF-305ca3, both
      unreviewed and both confounded in the way this record separates.
    hidden_overhead: >-
      The relabelling and planting scripts are O(instance size). The real hidden cost
      is that arm C at l = 6 may be censored at a high rate, in which case the reported
      Delta_order is a lower bound and must be stated as one - the same censoring
      problem this record criticises, moved from wall to conflicts where at least the
      unit is invariant.
    tradeoff_note: >-
      Not an algorithm. Operationally, K relabellings x 60 instances x 3 cells is
      embarrassingly parallel and the conflict budget bounds each row, so the cost is
      chosen rather than discovered.

  dominated_by: >-
    Not applicable as an algorithmic claim ("n/a (no cost result claimed)"): this
    record proposes a control, occupies no point on any time/memory/data frontier, and
    makes no attack faster. The frontier check that IS meaningful, and was done: the
    alternative ways to attribute the measured advantage are (i) the single relabelled
