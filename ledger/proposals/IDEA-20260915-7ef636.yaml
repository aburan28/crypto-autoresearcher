      verified_by: null

  assumptions:
    - >-
      A variable renaming of the .anf and .dimacs is a system isomorphism and WDSat's
      answer set maps through it. Verified by arm 1(b)'s exact conflict-count identity
      before anything else is read; if 1(b) fails, the whole design is void.
    - >-
      WDSat's default order is the file's variable numbering. Stated in KN-LIT-6e036d
      and checked by P3a of RUN-ICPERF-305ca3 (core_order reproduced default exactly
      on 60/60, unreviewed). If the default is instead an internal heuristic, arm 1(a)
      measures that heuristic's dependence on numbering, which is still a separation
      but must be reworded.
    - >-
      Rebuilding WDSat per cell with an exact __MAX_ID__ is required for every arm,
      including the planted-core null, whose variable count matches the template by
      construction.
    - This record approves nothing and runs nothing.

  proof_search_map:
    not_applicable_reason: >-
      Control/measurement proposal. No theorem, no bound, no certificate family. The
      audits are recorded where they bear, because D1-D4 are quantitative predictions
      that can fail.
    bottleneck: >-
      The attribution of the measured solver advantage. Every later ICPERF row's
      SAT column inherits it, and at present it is confounded between order and content.
    baseline_embedding:
      parameter_slice: >-
        The structured/core-first cell IS the shipped default configuration; its
        median conflicts must reproduce 30978.5 / 254656.5 / 255301.0 (U) from
        results.jsonl before any other cell is interpreted.
      reproduction_check: >-
        Exact conflict-count equality on arm 1(b) (relabelled file with the permuted
        core order) against the original default row, per instance, on all 60.
    observation_collision:
      observable: median WDSat conflicts per (content, order) cell.
      distinct_preimage_search: >-
        A 100x conflict ratio between a structured and a random instance has at least
        three preimages - the algebra prunes, the core propagates, the numbering
        happens to put the core first. The four cells plus the planted-core null are
        chosen so that each preimage predicts a different sign pattern for
        (Delta_order, Delta_content, interaction, planted-core gap). A pattern matching
        none of them is reported as unexplained rather than assigned.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The fiber of "same system, different numbering" - K uniformly random
          relabellings of one instance - and the fiber of "same shape and propagation,
          different algebra" - the planted-core nulls.
        predicted_gain: >-
          An error bar on the order effect (IQR over K = 32 relabellings) where the run
          has a single censored point estimate, and a decomposition of P6's 20-114x
          into a propagation part and an algebra part.
    quantifier_order: >-
      For each cell (n, l) in {(15,5), (17,6), (19,6)} and each label in {S, U}: over
      the 10 shipped instances and K = 32 relabellings each, the medians in the four
      cells satisfy D1-D3; over 10 planted-core nulls per cell, D4. Nothing is claimed
      for other engines, other orders, or l >= 7.
    method_ceiling:
      strongest_certifiable_claim: >-
        A decomposition, on these 60 instances with this solver on this host, of the
        measured advantage into an order component and a content component with error
        bars, plus the identification of the propagating-core layer as sufficient or
        not. It cannot certify anything about Groebner engines, about the PDP's
        asymptotic cost, or about any curve.
      nearby_object_control: >-
        A structured instance from a DIFFERENT (m, l) or from the chained-S_3
        presentation, where the core/e-layer split has a different shape: the
        decomposition must not depend on that shape in the same way, or Delta_order is
        measuring the file format rather than the search.
    proof_obligations:
      - claim: arm 1(b) reproduces the original conflict counts exactly
        responsibility: baseline
      - claim: the relabelling is a system isomorphism
        responsibility: correctness
      - claim: the planted-core null propagates the core exactly as the template does
        responsibility: correctness
      - claim: censored medians are estimated, not dropped
        responsibility: runtime
      - claim: every conclusion scoped to WDSat, these cells, this host
        responsibility: scope

  predictions:
    - metric: >-
        Delta_order = log2(median conflicts, relabelled default order) -
        log2(median conflicts, original default order), same instances, l = 6
      direction: higher
      minimum_effect: '>= 6 bits (64x), with IQR over K = 32 relabellings reported'
    - metric: >-
        Delta_content = log2(median conflicts, shape-matched random null, core-first)
        - log2(median conflicts, structured, core-first)
      direction: higher
      minimum_effect: '>= 3 bits (8x); under 1 bit falsifies the content half of P6'
    - metric: interaction term of the 2x2 in bits
      direction: lower
      minimum_effect: '<= -2 bits (sub-additive: the core order pays off only when a core exists)'
    - metric: >-
        planted-core-null median conflicts / structured median conflicts, core-first
        order, same cell
      direction: different
      minimum_effect: >-
        within 4x (i.e. <= 2 bits) if the propagating core is the whole mechanism;
        above 16x (>= 4 bits) if the S_4 algebra contributes independently. Both are
        reportable and they mean opposite things
    - metric: >-
        arm 1(b) conflict-count identity, relabelled file with permuted core order vs
        original default
      direction: different
      minimum_effect: exact equality on 60 of 60; any mismatch voids the design
    - metric: >-
        fraction of rows right-censored under a 2^{31}-conflict budget, versus the
        wall-censored fractions of RUN-ICPERF-305ca3 (22/30 noncore, 9/18 null)
      direction: lower
      minimum_effect: >-
        <= 20% of rows censored in every cell, so a censored median is estimable in the
        primary unit rather than reported as `none`

  minimal_test:
    design: >-
      Per cell (15,5), (17,6), (19,6) and per label S/U, take the 10 shipped instances.
      Build four arms: (A) original file, default order - the reproduction arm;
      (B) original file, -g listing a uniformly random permutation of ALL N variables
      (a complete order, so the search stays complete) - order-only, K = 8 seeds;
      (C) relabelled file (uniform permutation of variable indices in both .anf and
      .dimacs), default order, K = 32 seeds - order-only, and the arm the review plan's
      object 2 samples once; (C') relabelled file with -g pi(core) - the identity
      check; (D) shape-matched random null, default order and -g core - the existing
      null repeated under a conflict budget; (E) PLANTED-CORE null, default order and
      -g core, 10 seeds per cell. Every row is budgeted on 2^{31} conflicts with wall
      recorded, and WDSat is rebuilt per cell with the exact __MAX_ID__. Report per
      cell the four 2x2 medians with IQR, the interaction, the planted-core gap, and
      Kaplan-Meier medians where censoring occurs.
    execution_status: design_only_not_approved_in_this_record
    controls:
      - kind: reproduction
        design: arm A must reproduce the run's per-cell default medians from results.jsonl.
      - kind: identity
        design: >-
          arm C' must reproduce arm A's conflict counts EXACTLY per instance. This is
          the control that makes C interpretable as order-only.
      - kind: null_object
        design: >-
          the existing 18 shape-matched random systems (arm D), so the new
          decomposition is anchored to the run's own P6 numbers.
      - kind: known_false
        design: >-
          a relabelling that is NOT a permutation (e.g. mapping two variables to one
          index) must produce a DIFFERENT satisfying set or an error; if the harness
          accepts it silently, the relabeller is unsafe and arm C is void.
      - kind: matched_size
        design: >-
          a random null with the template's shape but a DIFFERENT variable count
          (+-10%), to confirm that Delta_content is not a size effect at the margin.
      - kind: load
        design: >-
          conflicts are the primary metric and are load-independent; wall is recorded
          and reported with loadavg per row, and no verdict rests on wall.
    required_metrics:
      - conflicts, decisions, status, wall_s, cpu_s, loadavg, seed and arm per row
      - per-cell median and IQR of conflicts per arm; Kaplan-Meier median where censored
      - Delta_order, Delta_content, interaction in bits with bootstrap CIs over instances and seeds
      - planted-core gap in bits per cell
      - arm C' identity result per instance (equal / not equal, with both counts)

  falsification_conditions:
    - >-
      Arm C' fails to reproduce arm A's conflict counts exactly on any instance: the
      relabelling or -g wiring is wrong, every other arm is uninterpretable, and the
      finding is a procedure defect, not a result.
    - >-
      Delta_order under 2 bits at l = 6: the order effect P3b measured on wall is not
      present in conflicts at this magnitude, and P3b's censored wall bound was
      measuring propagation cost per node rather than tree size.
    - >-
      Delta_content under 1 bit: content contributes nothing once the order is
      controlled, and P6 as a structure claim fails - the honest statement becomes
      "P3b and P6 measure one mechanism", exactly as the review plan's object 2
      anticipates.
    - >-
      The interaction term positive (super-additive): the two effects reinforce rather
      than gate each other, contradicting the propagation reading of Proposition 1, and
      the mechanism paragraph of H-ICPERF-cc4847 needs rewriting.
    - >-
      Planted-core null within 4x of the structured instance AND the existing
      shape-matched null more than 16x slower: then P6's 20-114x is essentially the
      absence of a propagating core, the descended S_4 algebra contributes under 4x,
      and the SAT advantage is a Weil-descent property rather than a summation-polynomial
      property. (This is a falsification of P6's wording and a positive mechanism
      result at the same time; it must be reported as both.)

  confounders:
    - >-
      Relabelling changes cache locality and the static arrays' access pattern, so
      WALL may move for reasons conflicts do not; this is why every verdict is on
      conflicts and wall is reported separately.
    - >-
      A uniformly random complete order (arm B) may by chance place many core
      variables early; with K = 8 seeds the distribution, not a single draw, is the
      measurement, and the fraction of the ml core inside the first ml positions is
      recorded per seed as a covariate.
    - >-
      The planted-core null's degree profile must match the template's per-equation
      monomial counts as well as its propagation structure, or it becomes an easier
      instance for an unrelated reason; the shape check that the existing nulls pass is
      necessary here too and is reported.
    - >-
      A conflict budget of 2^{31} is itself a censoring threshold; the fraction
      censored per arm must be reported, and a cell where arm C is censored at over
      50% supports only a lower bound.
    - >-
      Symmetry breaking (-b) interacts with the order (the run's unreviewed observation
      is a ~2.5x conflict reduction, not the m! = 6 the Coordinator expected); every arm
      is run WITHOUT -b for the primary 2x2, with -b as a secondary sweep.

  interpretation_limits:
    - >-
      Scoped to WDSat on the 60 shipped S_4 instances at l <= 6 on this host. It says
      nothing about Groebner engines, about other SAT solvers' order sensitivity, or
      about any curve.
    - >-
      A decomposition of a measured advantage is not a mechanism proof; it bounds how
      much of the advantage each candidate mechanism can explain on these instances.
    - >-
      The review plan already assigns ONE relabelled run to TASK-20260913-6c5729 as a
      proves-too-much control. If that control returns before this is dispatched, its
      single point must be treated as one draw from arm C's distribution and must not
      be substituted for the distribution.
    - >-
      Deciding D1-D4 does not move any hypothesis status; that is the Coordinator's act.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a fixed system, WDSat's conflict count under a uniformly random complete
        branching order is concentrated enough that K = 32 draws estimate its median to
        within a factor 2 with 95% confidence, i.e. the log-conflict distribution over
        orders has interquartile range under about 3 bits.
      rigorous_support: >-
        Rigorous side: the conflict count is deterministic given (system, order), so
        the only randomness is the order, and the sample median of K = 32 i.i.d. draws
        is within the empirical [0.34, 0.66] quantile band with probability about 0.95
        by the binomial tail - no distributional assumption needed for THAT. Imitated
        side: that the log-conflict distribution over orders is unimodal with moderate
        spread, in the same way that DPLL runtime distributions over random restarts
        are commonly heavy-tailed but log-concentrated in the bulk. The heavy tail is
        the named risk.
      validation_plan: >-
        Take one instance per cell and run K = 256 relabellings (cheap at (15,5):
        median 0.065 s default, and censored rows bounded by the conflict budget).
        Compare the empirical log-conflict CDF against a fitted log-normal and against
        a Pareto tail; report the estimated tail index. Tail check: the maximum over
        256 draws against the 99th percentile of the fitted bulk - if the maximum
        exceeds it by more than 4 bits, the distribution is heavy-tailed, K = 32 is
        insufficient, and every Delta must be reported as a quantile statement rather
        than a median ratio. Sampled parameters: 3 instances, K = 256; transfer to the
        other 57 instances is an explicit assumption, not a measurement.
    - id: H2
      statement: >-
        A random Boolean system whose N - ml non-core variables are random XOR
        definitions of the core behaves, under a core-first order, like a system with
        2^{ml} leaves and O(N) propagation per leaf - i.e. planting the definitions is
        sufficient to reproduce the template's propagation behaviour.
      rigorous_support: >-
        Rigorous side: if every non-core variable has a definitional XOR equation in
        terms of assigned variables, then unit propagation determines it, so the leaf
        count is at most 2^{ml} unconditionally - this direction is a proof, not a
        heuristic. Imitated side: that the REMAINING random equations prune the 2^{ml}
        assignments like independent uniform Boolean constraints, in the same way that
        a random k-SAT instance at fixed clause density is modelled by independent
        clauses.
      validation_plan: >-
        For the planted-core nulls, record decisions as well as conflicts and check
        decisions <= 2^{ml} exactly (a proof-backed inequality that the instrument must
        satisfy); compare the observed conflict count against the binomial prediction
        2^{ml}(1 - 2^{-E}) for E the number of non-definitional equations, over 10 seeds
        per cell. Tail check: the seed with the largest conflict count against the
        binomial 99th percentile. If decisions exceed 2^{ml} on any planted-core null,
        the planting is wrong and arm E is void.

  target_complexity:
    time_exponent: >-
