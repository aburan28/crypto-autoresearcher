idea:
  id: IDEA-20260918-c05e71
  question_id: RQ-SEMBIN-9fa4ba
  added: '2026-09-18'
  status: proposed
  approved_by: null
  title: In-regime coset-typed Semaev solver-degree conservation test
  class: algorithm
  claim: >-
    The disjoint/coset-typed factor-base mechanism is prior art and has already been
    partially tested by EXP-SEMBIN-92724f. The open question is narrower: when the
    experiment is moved into the regime where the finite-k counting cap approximates
    m! and the actual polynomial solver is measured, does the combinatorial gain
    survive as lower total cost per verified independent relation, or is it exchanged
    into solving degree, Macaulay growth, or lower relation rank?
  mechanism: >-
    Replace the single symmetric factor base F with typed bases F_i={P:x(P) in V+v_i}.
    Typing removes permutation identification on the relation domain. In Semaev's
    chained Boolean presentation each slot remains explicit, so the leading-degree
    argument is affine-invariant, but lower terms, fibre geometry and elimination
    order can still change the real solver trajectory. Measure yield and solver work
    together rather than infer cost from degree counts.
  novelty_status: unverified
  origin:
    kind: user_supplied_idea
    date: '2026-09-18'
    scope: Successor measurement for the Galbraith distinct-factor-base thread.
    overlap_review: >-
      Overlaps H-SEMBIN-c59e50 and EXP-SEMBIN-92724f by design. EV-SEMBIN-4614e7
      explicitly names the missing successor: an in-regime image-size measurement and
      a real solver/degree measurement. This proposal is that successor, not a new
      factor-base claim.
  citations:
    - ref: ledger/evidence/EV-SEMBIN-4614e7.yaml
      provenance: retrieved
      claim: Existing exhaustive cells were outside HEUR-YT's regime and measured no Groebner/F4 solving degree.
      verified_by: repository
    - ref: knowledge/literature/KN-LIT-ebd657.md
      provenance: retrieved
      claim: Nagao records disjoint coset-shifted factor bases and the 1/d! yield removal with larger final linear algebra.
      verified_by: repository
    - ref: inputs/GG-2014-806/paper_fulltext.txt
      provenance: retrieved
      claim: Galbraith-Gebregiyorgis describe distinct factor bases based on V+v_i and the factorial relation-yield effect.
      verified_by: repository
    - ref: inputs/NAGAO-2015-984/paper_fulltext.md
      provenance: retrieved
      claim: The chained binary-field system plus disjoint factor bases is the nearest published algebraic object; solver degree is the unmeasured quantity.
      verified_by: repository
  citation_note: No novelty is claimed for disjoint factor bases; only the controlled successor measurement is open.
  assumptions:
    - Generated/public benchmark curves only; no production keys or hidden private scalars.
    - Typed and untyped arms use the same curve, targets, subspace dimension, solver and verifier.
    - Score yield against the exact finite-k counting cap, not m! except as its large-k limit.
    - Timeouts and missing solver backends are infrastructure evidence, not mathematical evidence.
    - Full cost includes setup, relation search, solver work, extraction, verification, rank and final linear algebra.
  proof_search_map:
    bottleneck: Whether the factorial-sized combinatorial gain is conserved as solving-degree or matrix growth.
    baseline_embedding:
      parameter_slice: Untyped Semaev chain plus degenerate typing on the same V and targets.
      reproduction_check: Reproduce a conventional Semaev solve and EXP-SEMBIN builder/counting identities before new cells.
    observation_collision:
      observable: Cost per verified independent relation plus solver degree, Macaulay dimension, monomials, wall time and memory.
      distinct_preimage_search: Compare additive coset typing, degenerate typing and an equal-cardinality randomized typed null.
    constructive_transforms:
      - transform: symmetry_unquotient
        proposed_object: Distinct typed factor bases V+v_i in explicit Semaev slots.
        predicted_gain: Higher usable relation yield without a leading-degree increase; whether real solving work stays flat is the test.
    quantifier_order: There exists a preregistered in-regime ladder solved with identical backends and fresh held-out targets.
    method_ceiling:
      strongest_certifiable_claim: A scoped constant-factor or scaling trend on the declared ladder; no asymptotic claim.
      nearby_object_control: Symmetric-coordinate summation polynomials are a separate control where typing may add representation variables.
    proof_obligations:
      - claim: Typed and untyped accepted relations decode to the same group-law predicate.
        responsibility: correctness
      - claim: Chosen cells satisfy preregistered in-regime inequalities.
        responsibility: scope
      - claim: Solver and linear-algebra costs are charged consistently.
        responsibility: runtime
      - claim: Relation rank is measured, not inferred from raw count.
        responsibility: rank
  predictions:
    - metric: finite_k_image_over_cap
      direction: higher
      minimum_effect: Median typed image reaches at least 0.9 of the exact cap in at least two of three in-regime cells.
    - metric: total_cost_per_verified_independent_relation
      direction: lower
      minimum_effect: At least 20% lower complete cost than matched untyped Semaev at three increasing sizes with no rank loss.
  minimal_test:
    design: >-
      Start with candidate cells (n,k,m)=(24,6,3), (30,7,3), and (36,8,4),
      subject to exact feasibility and budget review. Require mk<=n-3 and 2^k
      large relative to m^2. Compare untyped, additive-coset typed, degenerate-typed
      and randomized typed-null arms on fresh matched targets. Run one Groebner/F4
      backend and one SAT/XOR backend when both consume the same descended predicate.
      Extract and group-law verify every accepted relation.
    controls:
      - Degenerate typing reproduces the untyped relation set.
      - Equal-cardinality randomized typed bases separate typing from special coset geometry.
      - Exact finite-k counting cap replaces asymptotic m! for scoring.
      - Fresh held-out targets prevent target-conditioned coset selection.
      - Independent group-law verifier checks every relation and matrix row.
    required_metrics:
      - image_over_finite_k_cap
      - verified_relations_per_target
      - independent_relation_rank
      - maximum_solver_degree
      - maximum_macaulay_matrix_dimension
      - monomial_count
      - solver_wall_seconds
      - peak_memory
      - extraction_and_verification_seconds
      - final_linear_algebra_dimension
      - total_cost_per_verified_independent_relation
  falsification_conditions:
    - Typed yield fails to approach the exact cap in the declared in-regime cells.
    - Solver degree or matrix growth erases at least 90% of the combinatorial gain at every size.
    - Any apparent speedup disappears on held-out targets or after relation-rank accounting.
    - The typed arm requires target-conditioned basis selection or uncharged preprocessing.
  confounders:
    - Finite-field saturation or starved point bases.
    - Solver-specific monomial ordering effects.
    - Comparing raw relation count instead of independent rank.
    - Treating first-fall degree as solving degree.
    - Different point-set cardinalities after curve membership filtering.
  interpretation_limits:
    - Proposal only; no experiment, run, approval or performance result is created here.
    - This does not revive falsified frozen predictions of EXP-SEMBIN-92724f.
    - A positive toy/medium trend is not an asymptotic ECDLP result.
  heuristic_assumptions:
    - HEUR-YT is tested only inside its declared large-k, low-saturation regime.
  heuristic_note: The missing question is whether the symmetry saving is paid back by the actual solver.
  target_complexity:
    time_exponent: Unknown; no improvement claimed.
    memory_exponent: Unknown; no improvement claimed.
    best_known: Matched untyped Semaev/benchmark solver on the same generated instances.
    hidden_overhead: Coset construction, membership filtering, solver setup, extraction, verification and final sparse linear algebra.
    tradeoff_note: A relation-yield gain can be Pareto-neutral or worse if matrix or degree growth offsets it.
  estimated_cost:
    implementation: medium
    compute: medium
    qualification: Solver availability and exact feasible cells must be established before approval.
  dominated_by: unchecked
  sota_delta:
    time: Unmeasured.
    memory: Unmeasured.
    data_queries: Unmeasured.
  frontier_check:
    status: pending
    note: Deduplicated against the current SEMBIN experiment as a successor measurement; broader historical overlap still needs coordinator review.
  recommended_priority: high
  priority_rationale: This directly measures the quantity the current evidence says is missing: whether symmetry gain survives the actual solver.
  first_deliverable: Frozen three-cell contract with exact in-regime inequalities, solver backends and end-to-end scoring.
  next_gate: Coordinator overlap/frontier review and solver-backend availability check, then a separately approved immutable experiment contract.
