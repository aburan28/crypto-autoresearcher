  assumptions:
  - Charts, domains and operations are fixed from public curve data before point fixtures.
  - Every discarded branch and exceptional point is accounted for; hidden full-state labels invalidate compression.
  predictions:
  - metric: Local fiber size, overlap compatibility width, cycle obstruction and total certificate description bits
    direction: different
    minimum_effect: The cycle plant forces a nonzero obstruction; any purported prime-order compression must pay
      for unresolved branches in total certificate size.
  minimal_test:
    design: Use finite sets with three overlapping domains and visible group operations at N=11 or 17. Include a
      consistent coset atlas on a composite group, a random same-size atlas and a pairwise-consistent but cycle-inconsistent
      plant.
    proposal_only: true
    controls:
    - type: matched_null
      description: Random partitions of identical chart and overlap sizes, with the same permitted transitions.
    - type: known_false
      description: A triangle of binary constraints with odd parity is pairwise satisfiable but globally inconsistent;
        the compatibility certificate must refuse it.
    required_metrics:
    - Local fiber size, overlap compatibility width, cycle obstruction and total certificate description bits
    - construction work, peak bytes, certificate size
    required_artifacts:
    - Exact fixtures
    - Independent certificates
    - Complete controlled outputs
    stopping_rule: First exact contradiction or stated finite panel; missing prerequisites and limits are inconclusive.
      No execution in this task.
  falsification_conditions:
