idea:
  id: IDEA-20260905-970b2f
  title: Compatible local projections with a priced gluing obstruction
  class: composition
  claim: 'Several lossy local observables can jointly propagate on restricted domains even when no nontrivial global
    exact quotient exists. Conjecture: for a coordinate-defined cover of a prime-order elliptic group, either the
    overlap consistency object grows to full-state information or an explicit compact gluing certificate identifies
    a new non-generic representation class.'
  mechanism: Each local chart retains a small feature valid under a restricted set of operations. Transitions leaving
    the chart require overlap data. Pairwise agreement need not imply global consistency; a cycle can carry nontrivial
    holonomy. Track the entire compatibility complex and charge the bits needed to select consistent branches. This
    re-reads global quotient rigidity as a resource for identifying where information must accumulate. A compact
    successful complex would be a structural object worth studying, while exponential consistency width would localize
    the obstruction. Neither branch supplies a key-recovery procedure.
  question_id: RQ-ECDLP-002
