    GOAL-ENDO-001: Extends the new-oracle audit to several partial features and their charged compatibility data.
    GOAL-ICEX-001: Prices consistency overhead that could otherwise be hidden in a proposed index-calculus representation.
    GOAL-PATH-001: Provides a wildcard proof architecture and generic/composite nearby-object controls before downstream
      work.
