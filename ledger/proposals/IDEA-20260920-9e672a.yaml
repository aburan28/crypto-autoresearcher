    arithmetic (extension degree n = 5 and the curves' group-order /
    subfield structure do not admit the variant's hypothesis). Filing the
    closure prevents accidental budget spend on a dead end. This is a
    documentation / arithmetic-check proposal, not an experiment to run at
    scale.
