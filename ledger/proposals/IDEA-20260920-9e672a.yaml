idea:
  id: IDEA-20260920-9e672a
  question_id: RQ-GFPN-c01af8
  added: '2026-09-20'
  status: proposed
  approved_by: null
  title: Joux-Vitse (n-1)-point variant for FULL ECDLP at p = 2^64 -- closure by arithmetic
  class: cost-model
  claim: >-
    The design note waves the Joux-Vitse variant away as "O(Cp^2), again above
    128" without a constant. The constant can be bounded from below without any
    experiment: decomposing into n-1 = 4 factor-base points succeeds with
    probability ~1/(p * 4!), ~p relations are needed, so ~p^2 * 24 ~ 2^132.6 PDP
    attempts at p = 2^64 before charging the PDP itself. Hence the (n-1) variant
    is above 2^132 for full ECDLP on both curves regardless of solver, and the
    only Joux-Vitse threat at this parameter set is the oracle-assisted SDHP
    (IDEA-20260920-73dc35). This record exists so the lane does not spend
    experiment budget on a variant arithmetic already closes.
  mechanism: >-
    Trade decomposition probability for a smaller system: with m = n-1 the
    number of m-sums of factor-base points is ~p^{n-1}/(n-1)! against a group of
    size ~p^n, so the success probability is ~1/(p (n-1)!). Relation collection
    needs ~|F| ~ p successes. Attempts ~ p^2 (n-1)!. The per-attempt cost is
    >= 1 F_p operation, so the bound is unconditional in the solver.
  novelty_status: unverified
  origin:
    kind: user_supplied_idea
    date: '2026-09-20'
    scope: Bookkeeping for the GFPN lane.
    overlap_review: None found.
  citations:
    - ref: https://eprint.iacr.org/2010/157
      provenance: recalled
      claim: The (n-1)-point variant and its regime n = Omega(cbrt(log q)); at q = 2^64, cbrt(64) = 4 < 5, so the variant is in-regime asymptotically but the p^2 relation-collection term is explicit.
    - ref: https://eprint.iacr.org/2022/274.pdf
      provenance: recalled
      claim: '"Joux and Vitse''s variant has cost O(Cp^2) for some constant C ... again above the 128-bit level."'
  citation_note: Recalled; the bound is arithmetic on the variant's own success probability.
  assumptions:
    - Factor base is the Gaudry one, size ~p up to negation.
    - Success probability model 1/(p (n-1)!) is the standard heuristic; a measured rate on the a639a1 ladder replaces it.
  proof_search_map:
