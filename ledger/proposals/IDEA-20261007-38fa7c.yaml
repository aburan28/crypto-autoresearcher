idea:
  id: IDEA-20261007-38fa7c
  question_id: RQ-SSI-001
  added: '2026-10-07'
  status: proposed
  approved_by: null
  proposed_by: coordinator
  title: >-
    The maximum order of an affine point of y^2 = x^3 + x over
    F_{103^2} equals 104.
  class: measurement
  claim: >-
    Let p = 103 and let E be y^2 = x^3 + x over F_103. Let
    F_10609 be F_103[z]/(z^2 + 1). Let m be the maximum order of
    an affine point of E(F_10609). The claim is m = 104. This is
    one integer, the exponent of the group of points over the
    quadratic extension. It does not evaluate a Frobenius square,
    it does not count distinct 2-isogeny neighbors, and the
    exponent delta against the opened path-finding cost is 0.
  mechanism: >-
    If E is supersingular then #E(F_103) = 104 and
    #E(F_10609) = 104^2. Cardinality does not decide the exponent.
    m = 104 means every affine point has order dividing 104. m > 104
    means the group is not killed by 104. KN-OPEN-013, opened, records
    the endomorphism-ring problem as open and states no sub-p^{1/4}
    generic path-finding attack. This idea does not search for a path.
    OBJECT FRAME. Representation: the order of an affine point.
    Operation set Sigma: addition on E(F_10609). TRICHOTOMY:
    full group law on one curve. LOSSY-PROJECTION TEST: the orders
    are discarded and only their maximum m is kept.
  novelty_status: unverified
  citations:
    - ref: KN-TECH-024
      provenance: internal
      claim: >-
        The opened note states the supersingular ell-isogeny graph
        and the path-finding costs O(p^{1/2}) and O(p^{1/4}). It does
        not state the exponent of E(F_{p^2}) at p = 103.
      verified_by: coordinator, this session, via knowledge/techniques/KN-TECH-024.md
    - ref: KN-OPEN-013
      provenance: internal
      claim: >-
        The opened note reports no sub-p^{1/4} generic attack. This
        idea does not claim one.
      verified_by: coordinator, this session, via knowledge/open-problems/KN-OPEN-013.md
  assumptions:
    - p = 103 is prime and 103 ≡ 3 (mod 4), so z^2 + 1 is irreducible. The test checks both.
    - The discriminant of x^3 + x is nonzero. If it vanishes, m is not defined.
    - Orders are computed in E(F_10609), not in a larger extension.
  predictions:
    - metric: absolute difference |m - 104|
      direction: lower
      minimum_effect: 0
  minimal_test:
    design: >-
      Confirm p = 103 is prime and 103 ≡ 3 (mod 4). Confirm the
      discriminant of y^2 = x^3 + x is nonzero and #E(F_103) = 104.
      Enumerate E(F_10609), or compute its invariant factors, and set
      m to the maximum order of an affine point. Do not evaluate
      Frobenius on points. Do not build a 2-isogeny graph.
    controls:
      - The discriminant is nonzero and #E(F_103) = 104. A different count invalidates m.
      - "#E(F_10609) = 104^2. A different count invalidates m."
      - The identity is not counted as an affine point.
      - Repeating the enumeration with a second Weierstrass model of the same j yields the same m.
    required_metrics:
      - point_count_E
      - point_count_quadratic
      - m
  falsification_conditions:
    - The cardinality checks pass and |m - 104| is at least 1.
    - "#E(F_103) is not 104, so m is not defined and the equality is not tested."
    - The discriminant is zero.
  confounders:
    - Reporting #E(F_10609) instead of the exponent always yields 104^2 and cannot see a cyclic group. The metric is the maximum order.
    - Stopping at the first point of order 104 reports a lower bound, not the maximum. The census must finish or certify the exponent.
  interpretation_limits:
    - One curve at p = 103. No transfer to another prime.
    - m = 104 is a group-structure fact at this prime. It is not an algorithm that recovers an endomorphism ring.
    - m ≠ 104 rejects the equality in this scope only.
    - Exponent delta against Õ(p^{1/4}) in the opened notes is 0.
  heuristic_assumptions:
    - id: H1
      statement: >-
        At p = 103 only, the group E(F_{p^2}) is modeled as having
        exponent p + 1. The model is not a theorem recorded in the
        opened notes. The sample is one curve. No transfer is claimed.
      rigorous_support: >-
        KN-TECH-024, opened, states path-finding costs and does not
        state this exponent. The cardinality #E(F_{p^2}) = (p + 1)^2
        is the usual trace-zero consequence and is checked, not assumed,
        by point_count_quadratic.
      validation_plan: >-
        Compute m once on this curve. The checks are the two point
        counts, a nonzero discriminant, and agreement across two
        models. Sample size one has no tail. No second prime is drawn.
  target_complexity:
    time_exponent: >-
      One group-structure computation at the fixed prime p = 103.
      Polynomial in that prime. No p^{1/4} path search is run.
    memory_exponent: >-
      The point list of E(F_10609), size (p + 1)^2 = 10816, plus
      one integer m. Memory is O(p^2) at this fixed p.
    best_known: >-
      KN-LIT-078, opened note: Õ(p^{1/2}) full-graph meet-in-the-middle
      and Õ(p^{1/4}) on the F_p subgraph. Those algorithms are not run.
    hidden_overhead: >-
      No o(1) term. The prime and the curve are explicit. The output
      is one integer m.
    tradeoff_note: >-
      No time-memory tradeoff and no collision search. One curve.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: not_applicable
    not_applicable_reason: >-
      This is a toy group-exponent measurement on one curve. It is
      not an ECDLP attack row. The opened frontier map has generic-rho
      and index-calculus rows, and none is claimed.
    nearest:
      - ref: KN-TECH-024
        provenance: internal
        relation: adjacent
        delta: >-
          The note records path-finding exponents. This idea adds the
          integer |m - 104| at p = 103. The exponent delta is 0.
      - ref: KN-OPEN-013
        provenance: internal
        relation: adjacent
        delta: >-
          The note records that no sub-p^{1/4} generic attack is known.
          This idea adds no attack. The numerical delta is |m - 104|.
      - ref: KR-RHO-6239aa
        provenance: internal
        relation: orthogonal
        delta: >-
          The opened row states that van Oorschot-Wiener parallel rho
          needs about sqrt(pi n / 2) iterations. This idea's exponent
          delta against that row is 0.
    searched:
      corpus_grep:
        - knowledge/techniques/KN-TECH-024.md
        - knowledge/open-problems/KN-OPEN-013.md
        - knowledge/frontiers/ecdlp/generic-rho/KR-RHO-6239aa.yaml
      web: []
      blocked:
        - web search was not run this session
  dominated_by: >-
    Compared with KN-LIT-078, opened: meet-in-the-middle is Õ(p^{1/2})
    time and space on the full graph and Õ(p^{1/4}) on the F_p
    subgraph. This measurement uses one group exponent, O(p^2) memory
    at a fixed prime, and no secret. It does not beat that baseline
    on time, memory, or data.
  sota_delta: >-
    The predicted gap is |m - 104| = 0, with m a positive divisor of
    104^2. The exponent delta against Õ(p^{1/4}) is 0.
  proof_search_map:
