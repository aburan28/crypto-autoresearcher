      verified_by: 'read lines 1-75 this session (idea-generator, 2026-08-29); not a full read'
    - ref: IDEA-20260816-08eda1 (this repository)
      provenance: internal
      claim: >-
        The nearest instrument-facing record - pins a commit and a named cost model, pairs every
