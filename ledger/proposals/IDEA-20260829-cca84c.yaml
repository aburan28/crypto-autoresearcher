idea:
  id: IDEA-20260829-cca84c
  question_id: RQ-MLKEM-003
  added: '2026-08-29'
  title: >-
    IDEA-20260805-522b48 showed the instrument maps MANY objects to ONE number. The complementary
    and unmeasured half is that it maps ONE object to MANY numbers - hold the algorithm, the
    parameter set and the input tuple exactly fixed and vary ONLY the instrument's version and its
    named cost model, so that every bit of movement is model and none is measurement. Report the
    dispersion of ML-KEM's quoted security across the instrument's own revision history against
    the committed margins of 2.800527 / 6.041285 / 1.276377 bits, and decide whether those margins
    are resolvable by this instrument at all
  class: measurement
  claim: >-
    (A) THE QUESTION IN ONE NUMBER. RQ-MLKEM-003 asks how much of ML-KEM's claimed security margin
    is model rather than measurement. There is a construction that answers a well-defined part of
    that question with no lattice computation whatsoever - fix the parameter set, fix the input
    tuple, fix the attack name, and vary only the instrument. Whatever the output does under that
    manipulation is, by construction, 100 percent model and 0 percent measurement. This program
    has never performed it, and its RQ names "lattice-estimator reproducibility" as an explicit
    target.
    (B) THE OBJECT. The map V x M -> log2(rop), where V ranges over pinned commits of the
    lattice estimator across its public history and M over the named cost models each commit
    supports, evaluated at the three FIPS 203 parameter sets and at the attacks this program
    quotes (primal_bdd above all, since EV-MLKEM-020's committed figures are primal_bdd under
    RC.MATZOV). The deliverable is the full matrix plus three derived numbers per parameter set -
    the across-version range, the across-version range WITHIN A FIXED COST-MODEL NAME, and the
    stability horizon, defined as the most recent date after which the range falls below 0.5 bits.
    (C) THE CLAIM PROPER, TWO-SIDED. EXPLANATION A, RESOLVABLE INSTRUMENT - the across-version
    range at fixed cost-model name is below 0.5 bits over the last three years of the instrument's
    history, in which case bit-level margins are meaningful things to argue about, this program's
    twenty-eight numerator proposals are arguing about a stable quantity, and the RQ's
    reproducibility target closes positively. EXPLANATION B, UNRESOLVABLE MARGIN - the range
    exceeds 1.276377 bits, the smallest committed margin, at at least one parameter set, in which
    case the sign of that committed verdict is not resolvable by this instrument and every margin
    statement in this lane must be re-quoted as an interval whose width is measured here.
    (D) THE SUB-FINDING THAT IS WORTH THE RUN EVEN IF (C) CLOSES POSITIVELY. A cost model that
    keeps its NAME while changing its VALUE across versions is a silent revision, and a program
    that cites "RC.MATZOV" without a commit is citing a moving target. The fixed-name column of
    the matrix measures exactly that, and it is a property of the instrument that no amount of
    reasoning about lattices can substitute for.
    (E) WHAT IS NOT CLAIMED. No attack. No statement that any estimator version is wrong. No claim
    that dispersion is an error bar - it is not, and part of this record's content is saying why
    (see interpretation_limits). No claim about FIPS 203's text. No status change to any committed
    record.
  mechanism: >-
    STAGE 0, FEASIBILITY AND PINNING. Establish the execution route. IDEA-20260805-522b48 records
    that "BATCH-012 established that a Sage-bearing route exists (passagemath-standard 10.8.7) and
    reproduced primal_bdd exactly", so at least one version runs in this environment today. Select
    at least eight commits of the public lattice-estimator repository spanning its history at
    roughly annual intervals plus every commit that this program has ever pinned in a committed
    record, and record for each the commit hash, date, and the exact dependency set required. A
    version that cannot be executed is recorded as EXCLUDED with the reason, never estimated, never
    interpolated.
    STAGE 1, THE FIXED INPUT. Construct the three FIPS 203 parameter tuples ONCE, in a
    version-independent serialised form (n, q, secret law, error law, sample count), and adapt it
    to each version's constructor by a per-version shim whose entire source is committed. The shim
    is the single largest confound in the design - a difference in how the tuple is built would
    masquerade as a difference in the model - and Stage 3's fixture control exists to catch it.
    STAGE 2, THE MATRIX. For each (version, cost model, parameter set, attack) cell, record
    log2(rop), log2(memory) where the version supplies it, the version's own selected attack
    parameters (beta, d, m, and any guessing dimension), and the wall-clock and exit status. Cells
    that error out are recorded as errors with the traceback - EV-MLKEM-020 already documents that
    `dual` raises AttributeError and `primal_hybrid` raises ZeroDivisionError on the pinned version
    this program uses, so instrument breakage IS part of the measured object and is reported, not
    hidden.
    STAGE 3, THE CONTROLS, RUN BEFORE ANY SIGNAL CELL IS READ. (i) THE FORCED FIXTURE - a tiny LWE
    instance whose cost every version must agree on (a planted instance recoverable by LLL, where
    the answer is bounded by a polynomial and no cost model can differ materially). Disagreement
    there means the shims differ, not the models, and the batch reports an instrument failure.
    (ii) THE ENVIRONMENT NULL - one version executed twice under two different Python/Sage
    environments; identical output required, or environment is a source of variance and must be
    pinned harder. (iii) THE UNRELATED-SCHEME NULL - the same matrix on a non-ML-KEM parameter set
    of similar shape, to establish whether the dispersion is a property of these parameters or a
    global property of the instrument's history.
    STAGE 4, THE DECOMPOSITION. Partition the observed movement into three named sources by design,
    not by regression - (a) cost-model change, isolated by comparing across models within one
    version; (b) silent revision, isolated by comparing one cost-model NAME across versions;
    (c) attack-model change, isolated by comparing the version's own selected attack parameters
    (a version that picks a different beta or a different d has changed its attack model, and the
    record reports the parameter change alongside the cost change).
    STAGE 5, THE COMPARISON THAT MAKES IT DECISION-RELEVANT. Put every derived range beside the
    committed margins 2.800527 / 6.041285 / 1.276377 and beside EV-MLKEM-020's own sensitivity
    coefficients (one bit of cutoff error moves c* by 0.0113 / 0.0076 / 0.0055), so the result
    lands in the units this lane already argues in.
  novelty_status: unverified
  novelty_screen:
    method: >-
      Read this session - RQ-MLKEM-003 in full; the 28-title inventory for this RQ;
      IDEA-20260816-08eda1 in substantial part (the nearest neighbour on the instrument axis);
      IDEA-20260805-522b48 (lines 1-75, the nearest neighbour on the identifiability axis);
      IDEA-20260821-472aa2 (lines 1-681); IDEA-20260828-5b7795; EV-MLKEM-020 lines 388-467 and
      595-634.
      Greps - `question_id: RQ-MLKEM-003` over ledger/proposals (28 files); a scan of all 28 titles
      for version, revision, reproducibility and drift language. The crypto-kb MCP index was not
      queried. No external search was run on whether anyone has published a version-dispersion
      study of the lattice estimator, which is the largest gap in this screen.
    results: >-
      IDEA-20260816-08eda1 tracks the estimator's signed residual against COMPLETED RUNS at a
      PINNED commit, over n <= 56, and states explicitly that it makes "no statement that any
      estimator is wrong at cryptographic dimensions". It varies dimension and holds version fixed.
      This record varies version and holds dimension fixed at 512 / 768 / 1024, and runs no lattice
      computation at all. The two are orthogonal manipulations of the same instrument and together
      they would give this lane both of the calibration numbers it lacks; neither substitutes for
      the other.
      IDEA-20260805-522b48 proves an input-side collision - many distinct cryptographic objects map
      to one estimator output, so the campaign's numbers are statements about unstructured LWE.
      This record measures the output-side spread - one fixed input maps to many numbers as the
      model is revised. Many-to-one and one-to-many are complementary halves of the same
      identifiability question and neither implies the other.
      IDEA-20260807-8fbc86 records that eighteen ML-KEM batches used relayed constants that were
      never measured. That is about the PROVENANCE of constants inside one model; this is about the
      DISPERSION of the model's output across its own history.
      No record in the lane holds a parameter set fixed and varies the instrument version.
    verdict: >-
      UNVERIFIED. No external literature was checked on this specific manipulation, and it is
      plausible that a version-dispersion study or a changelog analysis of the lattice estimator
      exists; a reviewer with retrieval should look, and finding one would be a good outcome that
      cheapens this record rather than voiding it. Claimed new RELATIVE TO THIS REPOSITORY - the
      version axis as the manipulated variable, the fixed-cost-model-name column as a silent-
      revision detector, the stability horizon as a reported statistic, and the pairing of the
      resulting range against the committed margins. Assembled from known parts - pinned-commit
      discipline is already this program's practice, the parameter sets are FIPS 203's, and the
      comparison targets are EV-MLKEM-020's.
  object_first_candidate:
    established_families_off_limits: >-
      Declared off-limits as the primary lens - every lens that computes a NEW security number and
      differences it against another, which EV-MLKEM-af61e7 is recorded (via IDEA-20260805-522b48)
      as naming the campaign's obstruction. Also off-limits - dual-versus-primal comparison, the
      memory-charge family with c free, the module-structure discount, the sieve constants, and the
      quantum resource triple. This record computes no new security level; it computes the
      dispersion of an already-computed one under a manipulation of the computing device.
    tracked_object: >-
      The output surface log2(rop)(version, cost-model name, parameter set, attack), together with
      the version's own selected attack parameters in each cell. One real number and a short
      parameter vector per cell, over a matrix of at least 8 versions x the available cost models x
      3 parameter sets.
    lossiness: >-
      LOSSY, and the discard is exactly what makes the object a measurement of the MODEL rather
      than of the lattice. The underlying state is the entire source tree of each estimator version
      - every formula, every constant, every branch, every bug - together with its internal
      optimisation over attack parameters. The projection retains one number per cell plus the
      chosen parameters. It discards the source entirely, so two versions that differ in a hundred
      lines and agree in output are the same object here, which is the correct identification for
      the question being asked.
      NOT A CHANGE OF COORDINATES - the map from source tree to output number is enormously
      many-to-one, and it is provably non-invertible because a version's output can be reproduced
      by a version with a completely different internal decomposition (the retained attack
      parameters are precisely the coordinate that sometimes, but not always, distinguishes them,
      which is why they are retained as a secondary metric).
      THE COMPATIBILITY CONDITION - the operation being modelled is CITATION - the act of a
      downstream record quoting a security level. A citation consumes exactly the retained scalar
      and nothing else, so the discarded structure is discarded compatibly with the operation, and
      the retained number propagates deterministically into every downstream comparison. That is
      the sense in which this projection is the right one - it retains exactly what the program's
      own practice propagates.
    propagation: >-
      One step is one increment along the version axis. Under it the output moves by a signed
      amount decomposable into the three named sources of Stage 4, and the decomposition is
      additive by design rather than by fit - cost-model change is read within a version, silent
      revision is read within a name, attack-model change is read off the selected parameters. The
      cheap internal falsifier - the three named sources must sum to the observed total movement in
      every cell, to the digit. A residual means a fourth source exists and the record must find
      and name it before reporting anything.
    survival_score: >-
      Survives as far back as a version can be executed, which is a dependency question, not a
      mathematical one - the object dissolves not gradually but abruptly, at the oldest commit
      whose dependencies can still be installed. That boundary is an honest and unusual one and it
      must be reported as a date, because a stability horizon computed over an executable window is
      a statement about that window and nothing earlier. It also dissolves for any (version,
      cost-model) pair the version does not implement, which is recorded as an absent cell and
      never interpolated.
  null_object_control: >-
    NULL-FIX, THE FORCED FIXTURE AND THE LOAD-BEARING CONTROL. A tiny planted LWE instance whose
    solution is recoverable by LLL, so its cost is bounded by a known polynomial and no cost model
    can materially disagree. Every version must return the same value within a stated tolerance.
    OBJECT REMOVED - the regime where cost models differ. OBJECT PRESERVED - the shim, the
    constructor, the invocation. CAN IT FAIL - yes, and if it does, the observed dispersion is a
    property of the shims and every signal cell is void. This is the control that decides whether
    the whole record measures anything.
    NULL-ENV, THE ENVIRONMENT NULL. One version, two environments, identical output required.
    NULL-SCHEME, THE UNRELATED-PARAMETER NULL. The same matrix on a non-ML-KEM parameter set of
    similar shape. If the dispersion is identical there, it is a global property of the
    instrument's history and the record must not present it as an ML-KEM finding.
    NULL-SELF, THE SAME-VERSION NULL. Each version run twice from a clean state; the output must be
    bit-identical, confirming determinism before any cross-version difference is interpreted.
    FORCED VALUES DECLARED BEFORE THE RUN. (1) A range is non-negative, and a matrix with one
    executable version has range zero and carries no information. (2) A version that errors
    contributes an absence, not a zero. (3) Cost models with different names are EXPECTED to differ
    - that is what a cost-model zoo is, it is already recorded in KN-TECH-040, and reporting it as
    a finding would be a forced-value error. The informative content is the FIXED-NAME column, the
    stability horizon, and the comparison against the committed margins.
  discriminated_from:
    - >-
      IDEA-20260816-08eda1 pins the version and varies the dimension, comparing predictions against
      completed runs at n <= 56. This pins the dimension at 512 / 768 / 1024 and varies the
      version, running no reduction at all. Orthogonal manipulations; complementary results; neither
      derivable from the other.
    - >-
      IDEA-20260805-522b48 exhibits an input-side collision (many objects, one number) at a fixed
      version. This measures output-side dispersion (one object, many numbers) across versions.
      Together they bound the instrument's identifiability from both sides, and the record
      recommends they be read as a pair.
    - >-
      IDEA-20260807-8fbc86 concerns the PROVENANCE of three constants relayed through eighteen
      batches. This concerns the DISPERSION of a whole model's output. A relayed constant is a
      static defect; a revision history is a moving one.
    - >-
      EV-MLKEM-020's sensitivity family sweeps parameters INSIDE one pinned version. Nothing in it
      varies the version. Its own record of two attacks raising exceptions on that version is,
      however, direct evidence that instrument state is load-bearing, and this record measures how
      load-bearing.
  citations:
    - ref: EV-MLKEM-020 (committed evidence record, this repository)
      provenance: internal
      claim: >-
        Committed primal_bdd/RC.MATZOV figures 140.1994731076207 / 200.9587149140538 /
        270.7236234535225 log2 rop against inherited cutoffs 143 / 207 / 272, i.e. margins
        2.800527 / 6.041285 / 1.276377 bits; H11's sensitivity, one bit of cutoff error moves c* by
        0.0113 / 0.0076 / 0.0055; and H12's validation note that on the pinned version `dual` raises
        AttributeError at estimator/prob.py:213 and `primal_hybrid` raises ZeroDivisionError, which
        is committed evidence that instrument state materially determines which attacks are even
        priceable.
      verified_by: >-
        Read directly this session (idea-generator, 2026-08-29), partial read - lines 388-467 and
        595-634 plus a targeted grep; not a full-file read.
    - ref: IDEA-20260805-522b48 (this repository)
      provenance: internal
      claim: >-
        Establishes the input-side collision - the estimator's parameter tuple contains no
        representation of the ring, so an unstructured LWE instance at matched parameters produces a
        bit-identical output - and records that "BATCH-012 established that a Sage-bearing route
