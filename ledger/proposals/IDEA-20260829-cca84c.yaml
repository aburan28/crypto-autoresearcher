      verified_by: 'read lines 1-100 this session (idea-generator, 2026-08-29); not a full read'
    - ref: 'KN-TECH-040 (core-SVP costing and the lattice cost-model zoo), corpus technique entry'
      provenance: recalled
      claim: >-
        Recorded elsewhere in this lane (quoted verbatim inside IDEA-20260821-472aa2, which was
        read this session) as cataloguing the cost-model zoo, carrying the conventions 2^(0.292b)
