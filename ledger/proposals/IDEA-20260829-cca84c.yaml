    - ref: RQ-MLKEM-003 (this repository)
      provenance: internal
      claim: >-
        Names as target 2 "lattice-estimator reproducibility - does an independent run reproduce
        the submitted numbers", which is the target this record addresses directly and which none of
        the 28 filed proposals manipulates the version axis to answer.
      verified_by: 'read in full this session, ledger/questions/RQ-MLKEM-003.yaml'
  assumptions:
    - >-
      At least three estimator versions can be executed in this environment. If not, the deliverable
      is a feasibility report naming exactly which dependencies blocked which commits, which is
      itself reusable and is reported as the result.
    - >-
      The per-version shim constructs the same mathematical parameter tuple in every version. This
      is not assumed - it is what NULL-FIX tests, and a shim failure voids the run rather than
      biasing it.
    - >-
      Versions are deterministic. Checked by NULL-SELF; a nondeterministic version is excluded and
      recorded as excluded.
    - >-
      A cost-model NAME is intended by its authors to denote a fixed model. If a version's
      changelog states that a named model was deliberately revised, that is not a silent revision
      and must be reclassified; Stage 4 reads changelogs where they exist and says when they do not.
  proof_search_map:
    bottleneck: >-
      The citation step - a downstream record quoting a security level as a number without a
      version. Removing that step (by quoting an interval, or a version-qualified number) changes
      what every margin statement in this lane is entitled to assert. The step is performed by every
      record in the lane, including the committed evidence.
    baseline_embedding:
      parameter_slice: >-
        A single version and a single cost model is the exact old-method boundary - the matrix
        collapses to one cell and must reproduce EV-MLKEM-020's committed
        140.1994731076207 / 200.9587149140538 / 270.7236234535225 exactly at the commit that record
        pinned. This is a runnable configuration, not a limit argument.
      reproduction_check: >-
        Frozen fixture - the committed triple, reproduced digit for digit at the pinned commit
        before any other version is run. A harness that cannot reproduce the program's own committed
        number has no standing to report a dispersion around it.
    observation_collision:
      observable: >-
        log2(rop) - the scalar this program cites as "ML-KEM's security level".
      distinct_preimage_search: >-
        COLLISION SEARCH IN THE OPPOSITE DIRECTION FROM 522b48, AND IT IS THE POINT. That record
        exhibits distinct ground-truth objects sharing one observable. Here the same ground-truth
        object is expected to produce DISTINCT observables under distinct instruments, which is the
        dual failure of identifiability - not "the observable cannot separate the objects" but "the
        observable is not a function of the object alone". The separating condition is to write the
        observable as log2(rop)(object, instrument) and always carry the second argument, which is
        this record's deliverable. A collision within the fixed-cost-model-name column - two
        versions agreeing exactly - is the positive outcome and is recorded as such.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the object fixed, vary the forgotten structure (the instrument), and find an
          intrinsic invariant distinguishing the resulting numbers - here the version's own selected
          attack parameters (beta, d, m, guessing dimension), which distinguish an attack-model
          change from a pure cost-model change and are recorded in every cell precisely for that.
        predicted_gain: >-
          An additive decomposition of the observed movement into cost-model change, silent
          revision, and attack-model change, each in bits, summing to the total by construction.
      - transform: representation_reduction
        proposed_object: >-
          Restate every margin claim in this lane as an inequality between an INTERVAL and a
          threshold rather than between a number and a threshold, with the interval's width supplied
          by this measurement, and with explicit obligations for what the interval does and does not
          cover.
        predicted_gain: >-
          Margin statements that survive the next estimator release, or that fail visibly instead of
          silently.
    quantifier_order: >-
      FOR EACH parameter set p and FOR EACH cost-model name m implemented by at least two executable
      versions, THERE EXISTS a range R(p, m) = max_v log2(rop) - min_v log2(rop) over executable
      versions v. THE DISCRIMINATING CLAIM, which can fail - THERE EXISTS a pair (p, m) with
      R(p, m) >= 1.276377 bits. NOT claimed - anything about versions that could not be executed,
      anything about future versions, anything about which version is correct, and nothing uniform
      over cost models (they are expected to differ, which is why the quantifier is over versions at
      FIXED name).
    method_ceiling:
      strongest_certifiable_claim: >-
        "Over the executable window [date_min, date_max], holding the input tuple and the cost-model
        name fixed, the instrument's reported log2(rop) for ML-KEM-p spans R bits, decomposing into
        A bits of silent revision and B bits of attack-model change, against a committed margin of M
        bits." Nothing about which value is right, nothing about the lattice, nothing about FIPS
        203's text, nothing outside the executable window.
      nearby_object_control: >-
        The nearby object where the hoped-for conclusion fails is a quantity that CANNOT drift - the
        forced fixture of NULL-FIX, whose cost is analytically pinned. The method must report zero
        dispersion there and nonzero dispersion on the ML-KEM cells. If it reports dispersion on
        both, it is measuring the shim; if it reports dispersion on neither, the executable window is
        too narrow to see anything and the record says so instead of reporting a stability claim.
    proof_obligations:
      - claim: The pinned-commit single cell reproduces EV-MLKEM-020's committed triple digit for digit.
        responsibility: baseline
      - claim: NULL-FIX returns identical costs across all executable versions.
        responsibility: correctness
      - claim: NULL-SELF returns bit-identical output on repeated runs of one version.
        responsibility: feasibility
      - claim: The three named sources sum to the observed movement in every cell, with no residual.
        responsibility: correctness
      - claim: Every non-executable version is recorded as excluded with its blocking dependency, never interpolated.
        responsibility: interface
      - claim: No version is described as correct or incorrect anywhere in the deliverable.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: >-
        across-version range of log2(rop) at ML-KEM-1024, at fixed cost-model name and fixed input
        tuple, over the executable window
      direction: higher
      minimum_effect: >-
        1.276377 bits - the committed ML-KEM-1024 margin. At or above it, the sign of that
        committed verdict is not resolvable by this instrument. Below 0.5 bits, the instrument is
        stable at that name and the reproducibility target closes positively.
    - metric: >-
        number of (version, cost-model) cells whose margin against the inherited cutoff 272 has a
        different SIGN from the committed cell
      direction: higher
      minimum_effect: 1
    - metric: >-
        stability horizon - the most recent date after which the across-version range at fixed
        cost-model name stays below 0.5 bits at all three parameter sets
      direction: different
      minimum_effect: >-
        Any date is reportable; the discriminating content is whether such a date exists inside the
        executable window at all. If none does, the instrument has not been stable at bit level
        during the window and the record reports that as its primary result.
    - metric: >-
        residual of the three-source decomposition (cost-model change plus silent revision plus
        attack-model change minus total movement), per cell
      direction: lower
      minimum_effect: >-
        0 to the last printed digit. Any nonzero residual means a fourth, unnamed source exists,
        and the record must name it before reporting any range.
  minimal_test:
    design: >-
      Two versions and one cost-model name is already a valid discriminator and is the minimal
      test - the commit this program pinned in EV-MLKEM-020 and the current HEAD of the public
      estimator, both evaluated on the three FIPS 203 tuples with primal_bdd under RC.MATZOV, with
      NULL-FIX and NULL-SELF run first. If the two disagree by more than 1.276377 bits at
      ML-KEM-1024, Explanation B is established with two data points and the full matrix becomes a
      quantification rather than a discovery. Compute is minutes; the cost is entirely in getting
      old dependencies to install.
    controls:
      - NULL-FIX, the forced fixture - identical cost across versions on an analytically pinned instance.
      - NULL-SELF, determinism of each version.
      - NULL-ENV, one version under two environments.
      - NULL-SCHEME, the same matrix on an unrelated parameter set of similar shape.
      - The pinned-commit baseline slice, reproducing the committed triple digit for digit.
      - Forced-value declaration recorded before the run, including that differently-named cost models are expected to differ.
    required_metrics:
      - log2(rop) per (version, cost model, parameter set, attack) cell
      - log2(memory) per cell where the version supplies it
      - the version's own selected attack parameters per cell
      - commit hash, date, and dependency set per version; exclusion reason for every version that did not run
      - exit status and traceback for every cell that errored
      - across-version range overall and at fixed cost-model name, per parameter set
      - stability horizon, and the three-source decomposition with its residual
  falsification_conditions:
    - >-
      If the across-version range at fixed cost-model name is below 0.5 bits at all three parameter
      sets across the whole executable window, the instrument is stable at bit level, Explanation B
      is REFUTED, and RQ-MLKEM-003's reproducibility target closes positively with a number. This
      would be the strongest single piece of good news available to this lane and it costs almost
      nothing to look for.
    - >-
      If NULL-FIX shows dispersion on the analytically pinned instance, the measurement is of the
      shims and no ML-KEM number is reported at all.
    - >-
      If fewer than three versions execute, no dispersion figure is reported and the deliverable is
      a feasibility report with per-version blocking dependencies.
    - >-
      If the three-source decomposition leaves a residual, the record reports the residual and
      withholds the range until the fourth source is named.
  confounders:
    - >-
      SURVIVORSHIP. The revision history contains only the revisions that were made. A model can be
      stable because it is right or because nobody looked, and dispersion of zero is therefore weak
      evidence of correctness while dispersion above zero is strong evidence of model dependence.
      The asymmetry is stated in the deliverable and not smoothed over.
    - >-
      The shim is a per-version piece of code written by this program, and a shim difference would
      appear as a model difference. NULL-FIX is the only defence and it is run first.
    - >-
      A version may change its DEFAULT attack selection without changing any cost formula, so a cell
      can move for reasons that are not about cost at all. This is why the selected attack
      parameters are retained in every cell and why the decomposition has an attack-model term.
    - >-
      Dependency archaeology can silently substitute a different numerical library, changing rounding
      at the last digits. Differences below the reporting tolerance are not interpreted, and the
      tolerance is set from NULL-SELF and NULL-ENV rather than chosen.
    - >-
      Cost models with different names differ BY DESIGN, and quoting the across-model range as if it
      were instrument instability would be the central error available in this design. The headline
      statistic is the fixed-name range, and the across-model range is reported separately and
      labelled as the cost-model zoo, which KN-TECH-040 already documents.
  interpretation_limits:
    - >-
      DISPERSION IS NOT AN ERROR BAR, and this is the record's most important limit. Estimator
      revisions are corrections, not random draws from a distribution around a true value - a later
      version is intended to be better, not merely different. The honest reading of a range R is
      "the number this program cites moved by R bits under model revision alone within the
      executable window", which is a lower bound on model dependence and NOT a confidence interval
      on ML-KEM's security.
    - >-
      The result is a statement about an instrument, not about a lattice. It cannot say which
      version is right, and nothing in it is evidence for or against any attack.
    - >-
      Everything is scoped to the executable window, which is a dependency-installation fact about
      this environment, and to the cost models each version implements. Absent cells are absent.
    - >-
      Claim tier - this produces no solve, no certificate and no attack, so it sits below the toy
      tier of docs/claims-and-verification.md entirely; it is instrument metrology and is reported
      as such.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The observed across-version movement decomposes additively and exhaustively into three
        sources - cost-model change (read within a version across models), silent revision (read
        within a cost-model name across versions), and attack-model change (read from the version's
        own selected attack parameters) - with zero residual in every cell.
      rigorous_support: >-
        The decomposition is exact by construction for the first two terms, since each is defined as
        a difference taken while the other coordinate is held fixed; that is ordinary
        finite-difference bookkeeping and imitates the classical two-factor decomposition of a
        response surface with no interaction term. What is HEURISTIC is exhaustiveness - the claim
        that no fourth source exists - and the residual check is precisely the test that can refute
        it. A nonzero residual is a positive discovery of a fourth source, not a nuisance.
      validation_plan: >-
        Sample - every cell of the executed matrix, at least 8 versions x 3 parameter sets, with the
        residual computed per cell and reported as a distribution rather than a mean. Compare the
        residual distribution against the exact-zero prediction, and run the tail check on the
        largest absolute residual observed rather than on the average. Transfer assumption, stated
        explicitly - exhaustiveness verified on the executed cells says nothing about excluded
        versions, and the record does not extend it to them.
    - id: H2
      statement: >-
        A cost-model NAME denotes a fixed intended model, so a change in output at fixed name and
        fixed input is a silent revision of that model rather than an intended redefinition.
      rigorous_support: >-
        This is a convention about naming, not a theorem, and it imitates the standard practice by
        which a named cost model is cited without a version in the literature - which is precisely
        the practice whose safety is being tested. The rigorous part is that a program citing
        "RC.MATZOV" without a commit is entitled to whatever the name denotes uniformly; if the name
        is not uniform, the citation is underdetermined regardless of anyone's intent.
      validation_plan: >-
        Sample - for every name that moves across versions, read the repository's changelog and
        commit messages for that path and classify the change as declared or undeclared, recording
        the commit that made it. Compare the count of declared against undeclared changes; a
        declared change is reclassified out of the silent-revision term and into the cost-model
        term, and the reclassification is reported. Tail check - the single largest movement at
        fixed name is traced to a specific commit diff or the record states that it could not be,
        which is itself the reportable fact.
  target_complexity:
    time_exponent: >-
      No attack and no algorithm is proposed, so no attack exponent is claimed. The computational
      complexity of the measurement itself is (number of versions) x (number of cost models) x 3
      estimator invocations, each seconds to minutes - trivial. The cost is dependency archaeology,
      not compute.
    memory_exponent: >-
      Not applicable to the measurement. The record reports each version's own memory figure per
      cell where it supplies one, precisely because EV-MLKEM-020 records that the primal path
      supplies none and that its memory number was assembled from a literal in an uncalled function.
      Whether that defect is version-dependent is a sub-question this matrix answers for free.
    best_known: >-
      MODEL-RELATIVE BY CONSTRUCTION, AND THAT IS THE SUBJECT RATHER THAN A CAVEAT. The "best known"
      security level for ML-KEM in this program is EV-MLKEM-020's 140.1994731076207 /
      200.9587149140538 / 270.7236234535225 log2 rop, which is an output of one commit of one
      instrument under one named cost model, evaluated at the p = 1 convention, against cutoffs the
      same record marks UNVERIFIABLE. It is not a run, its authors do not record it as tight, and
      this record's entire purpose is to measure how much of it is the commit.
    hidden_overhead: >-
      None hidden in this record's own measurement, which is exact arithmetic on program outputs.
      The overhead being measured is somebody else's - specifically, the o(1) and the convention
      choices that move when a model is revised, which is why the deliverable is a range rather than
      a corrected number.
    tradeoff_note: >-
      Not applicable - no time-memory tradeoff is involved in the measurement. The one tradeoff
      worth recording is between the width of the executable window and the effort of dependency
      archaeology - a wider window gives a more informative stability horizon at superlinear
      installation cost, and the record commits to reporting the window it achieved rather than the
      one it wanted.
  dominated_by: >-
    n/a (no attack, algorithm, or complexity result claimed). Pareto check performed against every
    row this program holds on the relevant frontier - EV-MLKEM-020's eighteen attack cells,
    EV-MLKEM-015's pinned-estimator figures, IDEA-20260816-08eda1's proposed residual table, and the
    external points recorded in the corpus (KN-LIT-110, KN-LIT-122). None computes a dispersion over
    the version axis; all of them are single-version quantities and are therefore inputs to this
    measurement rather than competitors to it. The one thing that WOULD dominate this record is a
    published version-dispersion or changelog study of the lattice estimator, which was NOT searched
    for this session - so this field is honestly incomplete on the external axis and Stage 0 must
    close it before the result is written up.
  sota_delta: >-
    Zero attack improvement, claimed unconditionally. The quantitative delta is an interval width in
    bits, to be attached to every margin statement in this lane. Its decision-relevance is fixed in
    advance by the committed margins - 2.800527 / 6.041285 / 1.276377 bits - so a measured range
    above 1.276377 bits at ML-KEM-1024 means the sign of a committed verdict is not resolvable by
    this instrument, and a measured range below 0.5 bits at fixed cost-model name means it is, and
    the delta is then honestly zero with a validated instrument as the deliverable.
