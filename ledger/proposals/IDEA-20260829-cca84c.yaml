      verified_by: null
    - ref: >-
        The public lattice-estimator repository and its commit history; the CRYSTALS-Kyber
        submission's own parameter-estimation scripts
      provenance: recalled
      claim: >-
        That the estimator is a public git repository with a multi-year commit history and named
        cost models, and that the Kyber submission shipped its own estimation script. Not fetched
