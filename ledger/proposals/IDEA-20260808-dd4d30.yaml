  - GOAL-FRODO-001.yaml (corpus, read in full) — including its non_duplication rule against
    re-estimating LWE hardness, which routes any numeric output away from this goal.
  - KN-TECH-041 (corpus, read in full) and KN-TECH-045 (title only) — GSA failure modes and
    the overstretched/dense-sublattice regime.
