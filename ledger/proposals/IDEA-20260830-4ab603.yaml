idea:
  id: IDEA-20260830-4ab603
  question_id: RQ-ICEX-001
  added: '2026-08-30'
  title: >-
    THE FREE DECOMPOSITION ORACLE IS NOT A BOUNDARY LIFT, IT IS A MEMORY PURCHASE,
    AND ITS PRICE IS EXACTLY B^2. At m=2 over an unstructured factor base the
    decomposition query is a sumset-membership query, so D and the space it needs are
    not independent knobs -- either D = Theta(B) with Theta(B) memory, or D = Theta(1)
    bought with a Theta(min(B^2,N)) precomputed table. IDEA-20260829-b5a2c8's
    free-oracle point (time N^{2/3}, memory N^{1/3}) is therefore unattainable; the
    attainable point is (N^{2/3}, N^{2/3}, precompute N^{2/3}), which BSGS dominates
    on BOTH axes, so the correct m=2 no-go is against BSGS and not merely against rho.
  class: cost-model

  claim: >-
    (A) THE COUPLING THAT THE TWO-TERM MODEL LEAVES OUT. In the charge
    T(B) = m!*N*D/(2^m*B^{m-1}) + c_LA*B^2 the per-trial decomposition cost D and the
    memory exponent are treated as independent, with memory reported as Theta(B) (the
    factor base plus the relation matrix) regardless of D. At arity m = 2 that is
    false, and demonstrably so. The m = 2 decomposition query is exactly
    "given R, is R in F + F, and with which pair" -- a sumset-membership query against
    a FIXED preprocessed set. Its cost is governed by a preprocessing tradeoff, not by
    a free parameter.
    (B) THE DICHOTOMY, STATED AS THE FALSIFIABLE CORE. For an unstructured factor base
    F of size B with query-time space S, the two realisable endpoints are:
    (B1) S = Theta(B), the stored factor base only. The sweep answers a query in
    D = Theta(B) charged operations by computing the 2B residuals. Total
    T = Theta(N) with memory Theta(B). This is IDEA-20260829-b5a2c8 part (B2) and it
    is not disputed here.
    (B2) S = Theta(min(B^2, N)), the precomputed sumset table keyed by target. A query
    is answered in D = Theta(1). Total T = Theta(N/B) + c_LA*B^2 + Theta(B^2)
    precompute, optimised at B = Theta(N^{1/3}) giving TIME Theta(N^{2/3}), MEMORY
    Theta(N^{2/3}), PRECOMPUTE Theta(N^{2/3}).
    THE CORRECTION. IDEA-20260829-b5a2c8 reports its free-oracle point as
    (N^{2/3}, N^{1/3}). The memory figure is wrong by N^{1/3}: it is the memory of the
    factor base, not of the structure that makes D = Theta(1) possible. With the
    memory correctly charged, the point is (N^{2/3}, N^{2/3}), which is dominated by
    BSGS at (N^{1/2}, N^{1/2}) on BOTH axes simultaneously, not merely by rho on time.
    (C) THE INTERPOLATION AND THE CLAIM THAT MAKES IT FALSIFIABLE. The two endpoints
    are joined by the obvious partial-table construction: store the sumset of a
    sub-base of size B_0 <= B and sweep the remainder, giving D = Theta(B - B_0) at
    space Theta(B_0^2 + B). CLAIMED: along this entire interpolation the product
    T * S never falls below Theta(N), and the time never falls below Theta(N^{2/3}).
    A construction achieving T * S = o(N) at m = 2 over an unstructured base falsifies
    this record and is a far more valuable object than anything it proposes.
    (D) WHY THIS IS NOT PEDANTRY ABOUT A MEMORY COLUMN. Three consequences that change
    what this question may conclude. (D1) The strongest available m = 2 statement
    strengthens from "dominated by rho on both axes" to "dominated by BSGS on both
    axes and by rho on both axes", which is a claim about a strictly larger comparator
    set. (D2) The "free oracle" ceases to be a boundary lift in the KN-TECH-080 sense
    -- it is not an idealisation that bounds the family from inside, it is a DIFFERENT
    ALGORITHM with a different resource profile, so the robustness argument
    "N^{2/3} survives every future improvement of the S_3 solve" does not follow from
    it. (D3) Any future measurement in this lane that reports a time exponent without
    the query-time space alongside it is reporting an unidentifiable quantity, because
    two m = 2 pipelines with the same time exponent can differ by N^{1/3} in space.

  mechanism: >-
    THE TRACKED OBJECT AND ITS LOSSY-PROJECTION STATUS. The object followed is the
    ORACLE'S ACCESS FOOTPRINT on one query -- the set of factor-base-derived words the
    decomposition routine must read before it can answer, projected to its cardinality
    and to the size of the persistent structure it reads from. This is a genuinely
    lossy projection of the routine: it discards the arithmetic performed, the order
    of access, the field representation, the monomial order and the solver entirely,
    retaining two integers. It is lossy COMPATIBLY because those two integers compose
    under the only operations the pipeline performs on the oracle -- repetition across
    targets multiplies the count and leaves the structure size fixed, and enlarging
    the base grows both by a rule that does not depend on what was discarded. Contrast
    the projection that FAILS the test and is not used here: the full solver
    transcript, which discards nothing and therefore says nothing.
    WHY THE COUPLING IS FORCED AT m = 2 SPECIFICALLY, AND NOT AT LARGER ARITY. At
    m = 2 the solution set of the decomposition problem is parameterised by ONE index:
    given the target R and a first summand P_v, the second summand is determined as
    R - P_v. There is no combinatorial search left for algebra to shorten -- the
    candidate set has size 2B and the question is a pure set intersection between the
    2B residuals and F. That is why the sweep at Theta(B) is not a weak oracle to be
    improved but the natural cost of the query, and why the only way to go below it is
    to have READ THE ANSWERS EARLIER, i.e. to hold the sumset. At m >= 4 the situation
    is genuinely different: the candidate set has size Theta(B^{m-1}) while the answer
    is one tuple, so an algebraic solve has something to shorten and D can in principle
    sit far below the candidate count without any table at all. THE COUPLING CLAIMED
    HERE IS THEREFORE SCOPED TO m = 2 AND IS ASSERTED NOWHERE ELSE.
    WHY THE PRODUCT BOUND IS THE RIGHT SHAPE. Time-space products are the standard
    currency for preprocessed search problems, and the two endpoints of the dichotomy
    already satisfy it with equality up to constants -- endpoint (B1) has
    T*S = Theta(N)*Theta(B) which is above N, and endpoint (B2) has
    T*S = Theta(N^{2/3})*Theta(N^{2/3}) = Theta(N^{4/3}), also above N. The claim
    T*S = Omega(N) is therefore a weak, testable conjecture over the interpolation
    rather than a repackaging of the endpoints, and the cheapest way to break it is to
    exhibit an intermediate construction, which is exactly what the minimal test
    invites.
    WHAT THIS DOES NOT DO. It does not lower any exponent, it proposes no attack, and
    it does not by itself decide RQ-ICEX-001. It removes one unattainable point from
    the lane's frontier table and replaces it with an attainable one, and it forces
    every future m = 2 row in this lane to carry a query-space column.

  novelty_status: unverified

  citations:
    - ref: IDEA-20260829-b5a2c8
      provenance: internal
      claim: >-
        Part (B1) states that even with D = Theta(1) the m = 2 total is
        Omega(N^{2/3}) at memory Omega(N^{1/3}), and calls this Pareto-dominated by
        rho on BOTH axes. Its target_complexity block reports memory_exponent
        Theta(B*) = Theta((N*D)^{1/(m+1)}) = N^{1/3} at m = 2 with D = 1, justified
        as "the factor base plus the relation matrix". Its constructive_transforms
        block labels the D = Theta(1) substitution a boundary_lift whose predicted
        gain is "a negative conclusion at m=2 that is robust to every future
        improvement of the S_3 solve".
      verified_by: >-
        Read in full this session (Read tool, 2026-08-29), file
        ledger/proposals/IDEA-20260829-b5a2c8.yaml, all 671 lines; the memory and
        boundary-lift limbs quoted above were read directly in its claim,
        constructive_transforms and target_complexity blocks.
    - ref: IDEA-20260803-fa9839
      provenance: internal
      claim: >-
        Introduces the two-term charge and states D_trial as the charged cost of
        deciding one candidate target including forming the target, running the
        solver and verifying the output, with "amortized precomputation (factor-base
        construction, tables) charged separately and must be stated, not folded into
        D_trial". That instruction is exactly what this record executes and what
        IDEA-20260829-b5a2c8's free-oracle row omits.
      verified_by: >-
        Read in full this session (Read tool, 2026-08-29), file
        ledger/proposals/IDEA-20260803-fa9839.yaml, all 493 lines, including its
        assumptions block where the precomputation instruction appears.
    - ref: IDEA-20260808-2ef5c8
      provenance: internal
      claim: >-
        Writes D_trial = c_D*B^theta and reports a memory column and a
        time-memory-product column alongside every alpha, with the explicit control
        that "a conclusion surviving only in the time-only column is labelled". It
        does not, however, couple theta to the space required to achieve it; its
        theta = 0 row inherits the same uncharged-table defect.
      verified_by: >-
        Read in full this session (Read tool, 2026-08-29), file
        ledger/proposals/IDEA-20260808-2ef5c8.yaml, all 233 lines.
    - ref: KN-FIND-8f2c90
      provenance: internal
      claim: >-
        Its committed proof sketch charges the m = 2 per-trial cost as B check
        operations, i.e. endpoint (B1) of the dichotomy, and its BKK variant halves
        the constant to B/2 without changing the exponent.
      verified_by: >-
        Read in full this session (Read tool, 2026-08-29), file
        knowledge/findings/KN-FIND-8f2c90.md, all 43 lines.
    - ref: KN-FIND-007
      provenance: internal
      claim: >-
        Supplies the exact per-target yield binom(B+m-1,m)/N used to convert queries
        into relations, and records that it says nothing about the cost of FINDING a
        decomposition, which is the quantity this record prices.
      verified_by: >-
        Read in full this session (Read tool, 2026-08-29), file
        knowledge/findings/KN-FIND-007.md, all 96 lines.
    - ref: >-
        Classical time-space tradeoffs for preprocessed set and sumset membership
        (Yao-style cell-probe lower bounds; Fiat-Naor function inversion; the
        S*T^2 = Omega-tilde(N) preprocessing frontier already carried in this corpus)
      provenance: recalled
      claim: >-
        The general shape "constant-time membership against a preprocessed sumset
        requires space proportional to the sumset, absent structure in the set" is
        standard folklore and there is a substantial cell-probe literature bounding
        preprocessed search problems. NO SOURCE WAS OPENED THIS SESSION and no
        specific theorem is relied upon; the record's claim is stated as a
        falsifiable conjecture over an explicit interpolation, precisely because the
        literature was not checked.
      verified_by: null

  assumptions:
    - >-
      Prime-order group of order N, arity m = 2, x-coordinate factor base F of size B
      with no exploitable additive structure. Structured bases are OUT OF SCOPE and
      are the named escape hatch: a base for which F + F has a succinct description
      breaks the dichotomy by construction, and finding one is a strictly better
      outcome than confirming this record.
    - >-
      One charged operation is one group operation; a table probe is charged at a
      declared rate frozen before any cell runs, with a sensitivity row at probe cost
      0.1, 1 and 10. Memory is charged in stored group elements, and PRECOMPUTE IS
      CHARGED SEPARATELY AND REPORTED, never amortised silently.
    - >-
      Precompute is amortised over the targets of a single DLP instance only. If a
      deployment amortises one table across many instances the accounting changes and
      the multi-target row must be computed separately; this record does not compute
      it and says so rather than implying it.
    - >-
      The linear-algebra charge is c_LA*B^2 with its memory Theta(B) for a sparse
      representation. The dichotomy's conclusion is unchanged for any linear-algebra
      exponent in [1, 2] because the table term Theta(B^2) alone forces the memory.

  proof_search_map:
    bottleneck: >-
      The decomposition query at m = 2, and specifically the pair (query time,
      persistent space read by the query). The exact step whose removal changes the
      theorem is "decide membership of the target in F + F and return the witness".
    baseline_embedding:
      parameter_slice: >-
        B_0 = 0 (no table) reproduces IDEA-20260829-b5a2c8 part (B2) and
        KN-FIND-8f2c90's committed 2RN/B charge identically. B_0 = B (full table)
        reproduces IDEA-20260829-b5a2c8 part (B1)'s TIME exponent N^{2/3} exactly
        while correcting its memory exponent from N^{1/3} to N^{2/3}.
      reproduction_check: >-
        Symbolic: the interpolated charge must collapse to 2RN/B at B_0 = 0 term by
        term. Frozen fixture: at KN-FIND-8f2c90's own cells (p = 1009 and p = 4001)
        the B_0 = 0 arm must reproduce its reported yield-retention gamma of 0.86 and
        0.75 and the derived 2*gamma speedup interval [1.5, 1.7]. If the
        recomputation misses that committed interval, the counting convention differs
        and nothing downstream may be read.
    observation_collision:
      observable: >-
        The reported m = 2 time exponent alone.
      distinct_preimage_search: >-
        COLLISION EXHIBITED, AND IT IS THE POINT OF THE RECORD. The value
        alpha = 2/3 at m = 2 is produced by at least three distinct preimages with
        materially different resource profiles: (i) IDEA-20260829-b5a2c8's free
        oracle as it reports itself, at claimed memory N^{1/3}; (ii) the same free
        oracle with its table charged, at memory N^{2/3}; (iii) the two-channel
        partial-relation pipeline of IDEA-20260830-f2e5b7 at beta = 1/3, at memory
        N^{2/3} with a Theta(B) oracle and no table at all. A single alpha therefore
        does not identify the pipeline, and the identifying triple is
        (time, query space, precompute). Every m = 2 row in this lane must carry all
        three or it is not identifiable.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          A problem-specific resource measure T*S for the m = 2 decomposition query,
          realised by the explicit sub-base-table specialisation with parameter B_0,
          with the two channels (table hits and swept residuals) charged over
          provably disjoint parts of the candidate set.
        predicted_gain: >-
          Converts an uncharged idealisation into a one-parameter family whose whole
          range can be evaluated and placed on the frontier. NO ATTACK EXPONENT IS
          MOVED IN EITHER DIRECTION.
      - transform: observable_fiber
        proposed_object: >-
          Hold alpha = 2/3 fixed and vary the forgotten structure (query space,
          precompute), exhibiting three preimages with distinct intrinsic profiles.
        predicted_gain: >-
          Establishes that the lane's reported observable is not identifying, and
          names the minimal identifying tuple.
    quantifier_order: >-
      CLAIMED. FOR ALL prime N, FOR ALL B, FOR ALL unstructured factor bases F of
      size B, FOR ALL query algorithms in the declared cost model that read a
      persistent structure of size S built from F alone, EXISTS an absolute constant
      c such that the expected query time D satisfies D * S >= c * B. Consequently
      FOR ALL B the end-to-end product T * S >= c' * N. Note the FOR ALL over
      geometry is genuinely restricted to UNSTRUCTURED bases and is not delivered by
      KN-FIND-007, which is about yield and not about query cost -- that restriction
      is the honest weak point of this record and it is stated here rather than in a
      footnote.
      NOT CLAIMED: FOR ALL arities. The coupling argument is m = 2 only.
      NOT CLAIMED: a cell-probe lower bound. No literature was checked and the
      quantified statement above is a conjecture whose falsification route is
      constructive.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At m = 2 over an unstructured factor base, the free-oracle configuration is
        realisable only at query space Theta(min(B^2,N)), so its Pareto point is
        (N^{2/3} time, N^{2/3} memory, N^{2/3} precompute) and it is dominated by
        BSGS on both time and memory." It can NEVER certify a lower bound on D for
        structured bases, anything at m >= 4, or that no intermediate construction
        beats T*S = Theta(N).
      nearby_object_control: >-
        THE STRUCTURED-BASE CONTROL, AND IT IS THE ONE THAT MATTERS. Instantiate the
        identical accounting on a base with strong additive structure -- a
        Bose-Chowla Sidon set and the H017 small-multiples base, both already
        characterised in KN-FIND-007's battery. For a Sidon set every pairwise sum is
        distinct, so F + F has size exactly binom(B+1,2) and admits no compression;
        for the small-multiples base F + F collapses to Theta(B) values and IS
        succinctly describable, so a Theta(1) query at Theta(B) space exists. The
        method must therefore return DIFFERENT verdicts on those two bases. A method
        that returns the same verdict on both has not identified the load-bearing
        structure and is measuring nothing.
    proof_obligations:
      - claim: >-
          The B_0 = 0 slice reproduces the committed 2RN/B charge and the 1.5-1.7x
          gamma interval.
        responsibility: baseline
      - claim: >-
          The full-table slice has query time Theta(1) at space
          Theta(min(B^2, N)) and its optimum is B = Theta(N^{1/3}).
        responsibility: memory
      - claim: >-
          The interpolated family has T * S = Omega(N) at every B_0.
        responsibility: strictness
      - claim: >-
          (N^{2/3}, N^{2/3}) is dominated by BSGS on both axes.
        responsibility: scope
      - claim: >-
          The structured-base control returns a different verdict on the Sidon base
          and on the small-multiples base.
        responsibility: correctness

  predictions:
    - metric: >-
        peak resident memory of the D = Theta(1) arm, in stored group elements, as B
        is swept over a 16x range at fixed p
      direction: higher
      minimum_effect: >-
        PRE-REGISTERED. Must scale as B^2, i.e. each doubling of B multiplies peak
        memory by 4.0 with a tolerance of plus or minus 20 percent, until the
        min(B^2, N) cap binds. A measured memory scaling of B^1 would mean a
        constant-time query was achieved at linear space and would falsify the
        dichotomy outright -- the single most valuable outcome available here.
    - metric: >-
        query time of the D = Theta(1) arm, in charged operations per target
      direction: different
      minimum_effect: >-
        PREDICTED FLAT IN B within a factor 1.2 across a 16x range. Combined with the
        memory prediction above, the pair identifies the endpoint. A query time that
        grows with B in the table arm means the table is not being used and the arm
        is mislabelled.
    - metric: >-
        product (total charged operations) x (peak query-space in elements) across
        the interpolation parameter B_0 at fixed p and B
      direction: different
      minimum_effect: >-
        PREDICTED never below 0.25*N at any B_0. A measured product below 0.1*N at
        any interpolation point falsifies the T*S = Omega(N) conjecture.
    - metric: >-
        structured-base control -- query space needed for a Theta(1) query on the
        H017 small-multiples base versus a Bose-Chowla Sidon base at matched B
      direction: different
      minimum_effect: >-
        FORCED SEPARATION. The small-multiples base must admit Theta(1) queries at
        O(B) space (its sumset collapses); the Sidon base must require
        Theta(B^2) space (its sumset is maximal and collision-free). A measured ratio
        of query spaces below 4 at B = 128 means the control is not discriminating
        and no verdict may be read from the main arms.
    - metric: >-
        Pareto placement of the corrected free-oracle point against BSGS
      direction: different
      minimum_effect: >-
        FORCED EXACT. (N^{2/3}, N^{2/3}) versus (N^{1/2}, N^{1/2}): dominated on both
        axes by a factor N^{1/6} each, verified symbolically. Any deviation is an
        algebra error and halts the record.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, minutes, HARD GATE). Reproduce KN-FIND-8f2c90's
      committed 2RN/B and its 1.5-1.7x gamma interval from the B_0 = 0 slice.
      Mismatch halts.
      STAGE 1 (zero compute, one page). Write the interpolated charge
      T(B, B_0) and S(B, B_0), emit (time, space, precompute) triples over a grid of
      (beta, B_0), verify the two endpoint reductions symbolically to 1e-12, and
      place every triple on a (time, memory) plane against rho, BSGS, van
      Oorschot-Wiener and the two-channel curve of IDEA-20260830-f2e5b7.
      STAGE 2 (low compute, pure Python, p in {2^12, 2^14, 2^16}, B <= 256, minutes
      per cell). Implement both endpoints and three interpolation points over ONE
      shared instance set and ONE shared operation counter, with an explicit
      allocator-level memory probe rather than an estimated figure. Arms: (A)
      B_0 = 0 sweep; (B) B_0 = B full sumset table; (C) B_0 in {B/4, B/2, 3B/4};
      (D) matched Pollard rho; (E) matched BSGS with its table charged, so the
      claimed domination is measured and not asserted. Sweep B over a 16x range.
      STAGE 3 (low compute). The structured-base control: rerun arms A and B on a
      Bose-Chowla Sidon base and on the H017 small-multiples base at matched B,
      recording query space for a Theta(1) query on each.
      STAGE 4 (zero compute). File as a correction-by-reference against
      IDEA-20260829-b5a2c8's memory row and boundary-lift limb, for the Coordinator,
      never as an edit; and emit the identifying triple requirement as a proposed
      reporting rule for every future m = 2 row in this lane.
      MEMORY DISCIPLINE. The largest object is the sumset table at B = 256, i.e. at
      most 32896 entries, plus a 256 x 256 matrix over Z/N. Under 20 MB. No Macaulay
      matrix and no Groebner basis is built.
    controls:
      - >-
        BASELINE REPRODUCTION (blocking): the B_0 = 0 arm against KN-FIND-8f2c90's
        committed charge and gamma interval.
      - >-
        MATCHED RHO ARM (blocking): must reproduce 0.886*sqrt(N) within the seed
        spread under the identical counting convention. A comparison whose baseline
        arm misses the textbook constant is not measuring a ratio.
      - >-
        MATCHED BSGS ARM WITH MEMORY CHARGED: the domination claim in (D1) is the
        headline and must be measured against a real BSGS arm on the same instances,
        not read off an asymptotic table.
      - >-
        STRUCTURED-BASE NEARBY-OBJECT CONTROL: Sidon versus small-multiples, required
        to separate.
      - >-
        ALLOCATOR-LEVEL MEMORY PROBE, not an estimate. The entire claim is a memory
        exponent; a memory figure derived from the model it is testing is circular
        and is forbidden.
      - >-
        PROBE-COST SENSITIVITY: report every row at table-probe cost 0.1, 1 and 10
        group operations. A conclusion that flips within that range is labelled
        convention-dependent.
      - >-
        SEED-INDEPENDENCE NULL: derived exponents are seed-free and bit-identical
        across seeds; only measured counts vary.
    required_metrics:
      - 'charged operations and peak query space per arm, per (p, B, B_0, seed)'
      - 'precompute operations and precompute peak memory, charged separately'
      - 'measured T x S product across the interpolation'
      - 'query time per target, per arm'
      - 'matched rho operations and matched BSGS operations plus BSGS table memory'
      - 'structured-base control query spaces at matched B'
      - 'symbolic endpoint reductions with residuals to 1e-12'
      - 'certificate verification pass/fail for every recovered logarithm'

  falsification_conditions:
    - >-
      The D = Theta(1) arm's measured peak memory scales as B^1 rather than B^2. The
      dichotomy is false, a constant-time m = 2 query exists at linear space, and this
      record is withdrawn -- and the construction achieving it is worth far more than
      the record.
    - >-
      The measured T x S product falls below 0.1*N at any interpolation point. The
      T*S = Omega(N) conjecture is falsified at the tested scale.
    - >-
      The B_0 = 0 arm does not reproduce KN-FIND-8f2c90's committed charge or gamma
      interval. The counting convention differs; the correction cannot be made and
      the record is withdrawn rather than re-scoped.
    - >-
      The structured-base control does not separate Sidon from small-multiples. The
      method is not measuring the structure it claims to measure and no verdict may be
      read from the main arms.
    - >-
      The matched rho arm misses 0.886*sqrt(N) outside the seed spread. Infrastructure
      failure under AGENTS.md rule 3, never negative mathematical evidence; the run is
      reported unrun.
    - >-
      Everything holds. Then IDEA-20260829-b5a2c8's free-oracle memory row is
      corrected from N^{1/3} to N^{2/3}, its boundary-lift robustness argument is
      withdrawn as stated, the m = 2 no-go strengthens to domination by BSGS on both
      axes, and this lane acquires a reporting rule requiring the identifying triple.

  confounders:
    - >-
      MEASURED MEMORY IS AN IMPLEMENTATION ARTEFACT AS MUCH AS A MATHEMATICAL ONE. A
      Python dict of B^2 entries has a constant factor of tens of bytes per entry and
      will dominate a small B x B matrix for reasons unrelated to the exponent. The
      metric must be STORED GROUP ELEMENTS counted by the program, with the
      allocator-level probe used only as a cross-check on the direction, and the two
      figures reported side by side.
    - >-
      PRECOMPUTE AMORTISATION. Charging the table once per instance versus once per
      deployment changes the verdict entirely. This record charges per instance and
      says so; a multi-target reading is a different row that this record does not
      compute and must not be quoted as computing.
    - >-
      THE UNSTRUCTURED-BASE RESTRICTION IS DOING REAL WORK. The claim is false by
      construction for bases whose sumset is succinct, which is exactly what the
      structured-base control demonstrates. Any quotation of the dichotomy without
      "unstructured" is an overclaim, and the small-multiples base is the standing
      counterexample.
    - >-
      SMALL-B DEGENERACY. At B = 8 the table has 36 entries and every asymptotic
      separation is invisible. Cells below B = 32 are reported but excluded from every
      fit, declared before the run.
    - >-
      MODEL-RELATIVITY. "Unattainable within this cost model" is not unattainable in
      fact; this qualifier travels with every quoted row.

  interpretation_limits:
    - >-
      NOT A LOWER BOUND IN ANY COMPLEXITY-THEORETIC SENSE. The quantified statement in
      quantifier_order is a conjecture with a constructive falsification route, not a
      cell-probe theorem, and no literature was checked. Anyone quoting it as a proved
      bound is overclaiming under AGENTS.md rule 5.
    - >-
      SCOPED TO m = 2 AND TO UNSTRUCTURED BASES. The coupling argument rests on the
      candidate set having size Theta(B) at m = 2, which is false at m >= 4, where an
      algebraic solve genuinely has combinatorial search to shorten. Nothing here may
      be quoted about m >= 4.
    - >-
      NO ATTACK IS PROPOSED AND NO EXPONENT IS IMPROVED. The deliverable is the
      removal of one unattainable point from the lane's frontier table, the
      strengthening of the comparator from rho to rho-and-BSGS, and a reporting rule.
    - >-
      FORWARD GUIDANCE. The classes this record leaves open, named explicitly so the
      next session does not read it as a closure: structured factor bases whose sumset
      admits a succinct oracle (the small-multiples base already exhibits the
      phenomenon at the cost of collapsed coverage, per KN-FIND-007 consequence 3 --
      whether any base achieves succinct F+F WITHOUT collapsing coverage is the open
      question this record hands forward); multi-instance amortisation of the table;
      and every arity m >= 4.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For an unstructured factor base F of size B drawn uniformly from the rational
        x-coordinates, the sumset F + F has size (1 - o(1))*binom(B+1,2) for
        B = o(sqrt(N)), i.e. essentially no additive coincidences occur, so a table
        supporting Theta(1) queries has Theta(B^2) entries and admits no compression
        below that.
      rigorous_support: >-
        The UPPER bound |F + F| <= binom(B+1,2) is a trivial count and is exact. The
        LOWER bound is the classical Sidon-set statement: a random subset of size B of
        a group of order N has expected number of coincident pairwise sums
        Theta(B^4/N), which is o(B^2) precisely when B = o(N^{1/2}), so a random base
        is asymptotically Sidon in the relevant range. This is the same
        random-set-behaves-like-a-Sidon-set imitation used throughout additive
        combinatorics, and KN-FIND-007 records the measured contrast directly: a
        Bose-Chowla Sidon base attains the coverage ceiling with ratio 1.1071 while
        the H017 small-multiples base collapses to a coverage ratio of 0.0021 with a
        concentration statistic of 1224x -- the two extremes of exactly this quantity.
      validation_plan: >-
        SAMPLE. At p in {2^12, 2^14, 2^16}, over 12 generated prime-order curves and
        20 random bases per (p, B) cell with B in {32, 64, 128, 256}, compute
        |F + F| exactly by enumeration.
        COMPARISON DISTRIBUTION. The ratio |F+F| / binom(B+1,2) against the predicted
        1 - Theta(B^2/N), with the same statistic computed for the Bose-Chowla base
        (predicted exactly 1) and for the small-multiples base (predicted Theta(1/B)).
        TAIL CHECKS. The maximum multiplicity of any single sum value against the
        Poisson upper tail at mean B^2/N; a heavy multiplicity tail means the base is
        not behaving as unstructured and the cell must be excluded.
        TRANSFER. None claimed beyond p <= 2^16; the exponent statement is a
        derivation within the cost model and is not validated at cryptographic scale
        by any part of this proposal.
    - id: H2
      statement: >-
        Over the interpolation, the sub-base table and the swept remainder cover
        disjoint parts of the candidate set, so their costs add without a
        cross-term and the product T*S is well defined by the two channels alone.
      rigorous_support: >-
        Rigorous by construction for the partition of F into the tabled sub-base and
        its complement -- a candidate pair is counted in exactly one channel. What is
        heuristic is only that no third algorithm exploits the PAIR of structures
        jointly to beat both, which is the same "no clever combination" clause every
        two-channel cost model carries, and which the T*S conjecture exists to expose.
      validation_plan: >-
        SAMPLE. Every Stage 2 interpolation cell, recording per-channel counts.
        COMPARISON. Measured total against the sum of the two channel predictions,
        required to agree within 15 percent. TAIL CHECKS. Cells where the measured
        total falls more than 15 percent BELOW the sum are the interesting ones and
        must be inspected individually, since an unmodelled cross-term in the
        favourable direction is precisely the falsifier of the T*S conjecture.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. The corrected endpoints at m = 2 are: sweep
      oracle T = Theta(N) at memory Theta(B); full-table oracle
      T = Theta(N^{2/3}) at B = Theta(N^{1/3}). Neither reaches rho's N^{1/2}. The
      correction moves no time exponent; it moves a memory exponent.
    memory_exponent: >-
      THE WHOLE POINT OF THE RECORD. Sweep oracle Theta(N^{0}) to Theta(B) = small.
      Full-table oracle Theta(min(B^2, N)) = Theta(N^{2/3}) at the optimum, versus
      the Theta(N^{1/3}) reported by IDEA-20260829-b5a2c8 -- an error of N^{1/3}
      (2^{85.3} elements at N = 2^256). Precompute is a third column and is also
      Theta(N^{2/3}).
    best_known: >-
      Pollard rho at 0.886*sqrt(N) time and O(1) memory (KN-TECH-001, KN-TECH-006);
      BSGS at (N^{1/2}, N^{1/2}) (KN-TECH-031), which is the comparator this record
      promotes to relevance at m = 2; van Oorschot-Wiener at sqrt(A^3/w) with memory
      w; the preprocessing frontier S*T^2 = Omega-tilde(N).
    hidden_overhead: >-
      DISCLOSED IN FULL. (i) The T*S = Omega(N) claim is a conjecture, not a theorem,
      and no literature was checked. (ii) The unstructured-base restriction is
      load-bearing and has a standing counterexample among structured bases.
      (iii) Constants in the table representation are large and implementation
      dependent, which is why the metric is counted elements and not bytes.
      (iv) Precompute is charged per instance; a multi-instance reading is not
      computed. (v) "Within the declared cost model" is the remaining overhead.
    tradeoff_note: >-
      This record IS a tradeoff statement. The family's curve is
      (time Theta(N/B_0 + N/B + c_LA*B^2), space Theta(B_0^2 + B)) and the conjecture
      is that its product never falls below Theta(N). Against rho, which sits at
      (N^{1/2}, O(1)), no point of the curve is competitive on either axis
      simultaneously; against BSGS at (N^{1/2}, N^{1/2}) the corrected free-oracle
      point loses by N^{1/6} on both. Parallelisation: table construction is
      embarrassingly parallel, queries are read-only and parallelise linearly, and
      the linear algebra is the Amdahl bottleneck -- none of which moves the exponent.

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES AGAINST EVERY FRONTIER
    ENTRY THIS LANE ENUMERATES. As an ATTACK this record mounts none, so every row
    dominates it: rho (N^{1/2}, O(1)); BSGS (N^{1/2}, N^{1/2}); multi-target rho
    sqrt(K*N) at O(1) memory; van Oorschot-Wiener sqrt(A^3/w) at memory w; the
    preprocessing frontier S*T^2 = Omega-tilde(N), which this record's own conjecture
    sits above rather than approaching; algebra-free meet-in-the-middle index calculus
    at (N^{1/2+1/m}, N^{1/2}) for m >= 3; the two-term optimum
    ((m!ND)^{2/(m+1)}, N^{1/(m+1)}) of IDEA-20260803-fa9839, whose memory column this
    record corrects at m = 2; and the two-channel curve of IDEA-20260830-f2e5b7,
    which dominates the corrected free-oracle point on TIME for beta < 1/3 at equal
    memory. Data and queries: query-free on both sides, no separation. NOT NULL ON
    ANY AXIS.
  sota_delta: >-
    Zero speedup on every attack axis; no exponent improved. Quantified deliverables.
    (i) A memory-exponent correction of N^{1/3} (2^{85.3} stored elements at
    N = 2^256) to a live committed proposal's headline free-oracle row.
    (ii) The m = 2 comparator set strengthens from rho alone to rho and BSGS, with the
    corrected point dominated by BSGS by N^{1/6} on each of two axes simultaneously.
    (iii) The withdrawal of a robustness argument -- "N^{2/3} survives every future
    improvement of the S_3 solve" -- which does not follow once the free oracle is
    seen to be a different algorithm rather than an idealisation of the same one.
    (iv) An identifiability result: three distinct pipelines share alpha = 2/3 at
    m = 2, so the lane's reported observable must become the triple
    (time, query space, precompute).

