idea:
  id: IDEA-20261018-1aff90
  title: GF(2) block Wiedemann (Coppersmith) consistency test on the Macaulay matrix as a memory-light
    plain-XL degree bound
  class: algorithm
  question_id: RQ-BINSTD-b6f698
  area: BINSTD
  goal_ids:
  - GOAL-DREG-001
  status: proposed
  proposed_by: idea-generator (Sonnet subagent logging the missed items of the 2026-10-18 index-calculus
    review)
  added: '2026-10-18'
  claim: A GF(2) block Wiedemann (Coppersmith) consistency test on the sparse Macaulay matrix decides,
    for the (4,6) cell at degree 5, whether the system is consistent at that degree using memory at least
    10x below the dense approach, and so gives the plain-XL degree as an upper bound on the solving degree.
    The closure studies show plain XL is 2-3 degrees pessimistic, so the result is a bound, not the measurement.
  mechanism: The repository's block Wiedemann is over Z/r only (koblitz_sparse_la.rs); a GF(2) implementation
    (cf. KN-LIT-017, Coppersmith) would operate on the sparse Macaulay matrix with memory O(nnz). It is
    a fallback for the large-memory cells (about 70 GB dense at (4,6)).
  novelty_status: adaptation
  regime: binary degree cells; used only if no large-memory node is available; bound, not measurement
  citations:
  - ref: crypto:research/ic_leads_review_20261018/README.md 3.1 last paragraph
    provenance: internal
    claim: Source of the opportunity, the measured figures quoted here and the cost estimate; desk review,
      no new measurement, costs are the reviewer's estimates.
    verified_by: idea-generator
  - ref: crypto:src/cryptanalysis/koblitz_sparse_la.rs
    provenance: internal
    claim: Block Wiedemann over Z/r only.
    verified_by: idea-generator
  - ref: KN-LIT-017, KN-TECH-008
    provenance: kb
    claim: Block Wiedemann over GF(2); sparse/structured LA.
    verified_by: idea-generator
  - ref: crypto:research/dreg_closure_driver_20261016/RESULTS.md
    provenance: internal
    claim: Closure refutes 2-3 degrees below XL; the sparse closure was too slow.
    verified_by: idea-generator
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
    - KR-IC-e847d1
    - KR-IC-0d2021
    nearest:
    - ref: KN-LIT-017
      provenance: internal
      relation: special_case
      delta: Coppersmith block Wiedemann over GF(2) is the established method; here applied to a Macaulay
        consistency decision.
    searched:
      note: Positioned against the cited review and the records it names. The frontier map was not rendered
        or matched in this logging pass; the Coordinator should run tools/build_frontier_map.py --match
        before ranking. A missing row is not evidence of novelty.
  assumptions:
  - Consistency can be decided probabilistically from Krylov sequences of the Macaulay matrix.
  - Error probability is controlled by repeated projections and stated.
  predictions:
  - metric: memory_vs_dense
    direction: lower
    minimum_effect: At most one tenth of dense peak RSS on the cells both complete.
  - metric: plain_XL_degree_bound
    direction: higher
    minimum_effect: Bound equal to the dense XL degree on every calibration cell; at or above the closure
      degree.
  minimal_test:
    design: Implement GF(2) block Wiedemann with a consistency decision, validate against the dense XL
      degree on cells where the dense matrix fits (positive controls), then run (4,6) degree 5.
    controls:
    - dense XL on cells that fit
    - known-inconsistent and known-consistent systems
    - A/A with different projections
    - closure degree as the true reference
    required_metrics:
    - consistency decision per degree
    - error bound
    - peak RSS
    - time in counted operations
  falsification_conditions:
  - Any disagreement with dense XL on a fitting cell rejects the test.
  - Memory within 10x of dense refutes the 'memory-light' claim.
  - A degree equal to dense XL where closure is lower gives only the bound, as stated.
  confounders:
  - probabilistic error
  - matrix sparsity pattern at high degree
  - GF(2) kernel quality
  interpretation_limits:
  - A bound 2-3 degrees above the closure degree cannot decide between 'degree 5 holds' and 'degree follows
    l' on its own.
  heuristic_assumptions:
  - id: H1
    statement: Macaulay matrices at the target degrees are sparse enough for Krylov methods to beat dense
      storage.
    rigorous_support: Row weights of the descended system are bounded by the input terms.
    validation_plan: Measure density on a cell that fits.
  target_complexity:
    time_exponent: Memory exponent only; no time exponent claim.
    memory_exponent: O(nnz) in the Macaulay matrix versus dense, which needs about 70 GB at (4,6) degree
      5.
    best_known: Matched generic rho, r^0.5 group operations; the index-calculus baseline is Table A/B
      of crypto:docs/ic/LEADERBOARD.md (5.23x to 21x matched rho on Koblitz, 5.47x to 13.5x on prime fields).
      Report this row's gap to matched rho (and to Bernstein-Lange where setup is excluded) as distance
      remaining.
    hidden_overhead: Every phase, cold, is charged; unpriced native work is priced at 0, 0.1 and 1 GAE
      per operation (AGENTS.md 5a) wherever two arms are ranked.
    tradeoff_note: Not applicable beyond the stated resource envelope.
  estimated_cost:
    implementation: medium-high
    compute: medium
  recommended_priority: low
  dominated_by: Dominated by the large-memory run of the degree cells if a node can be had; a fallback.
  sota_delta: None measured.
