  object_first_candidate:
    tracked_object: >-
      THE FIBER OF SMALL-COEFFICIENT REPRESENTATIONS of the deployed prime:
      the profile { (d, m) -> log2 (shortest vector of L(p,m)) } over a declared
      grid, tracked as d increases and as the base m ranges over powers of two
      and over the family's own seed powers. Not the curve, not the cost, not
      the canonical polynomial: the SET of ways the prime can be written down
      cheaply.
    established_families_off_limits: >-
      Declared off-limits as the primary lens: (F1) evaluating the canonical
      family polynomial's advantage (that is IDEA-20260809-1d1734); (F2)
      re-running polynomial selection for the TARGET FIELD's sieve polynomials
      (IDEA-20260809-172a9e, IDEA-20260815-bf1328) -- note this record is about
      representations of p itself, which is a different object from the tower
      sieve polynomials; (F3) cost-surface work of any kind (1fb37d, 1a5cb2,
      237e4e); (F4) smoothness and yield modelling (IDEA-20260818-17300c);
      (F5) executed DL calibration (15e1cd, 22a00c). This record may consume
      their outputs and may not use one as its lens.
    lossiness: >-
      LOSSY-PROJECTION TEST, applied before any experiment, costing no compute.
      The projection is (prime p, with its full 381-bit decimal expansion) ->
      (log2 lambda_1(L(p,m)))_{(d,m) in grid}. It DISCARDS: p itself, the
      curve, the group orders, the tower, and the coefficients of every witness
      polynomial (only their norm is retained). It RETAINS: a real-valued
      profile over the grid.
      The discard is COMPATIBLE with the operations that matter here, which are
      the two grid moves: increasing d by one embeds L(p,m) into a lattice of
      one higher rank with the same determinant, so the profile's next entry is
      predictable from the Gaussian heuristic alone, with no reference to p;
      and changing m to m' rewrites the lattice basis without changing the
      determinant. Under both operations the retained profile propagates by
      rules that mention only (d, m, det = p), which is exactly the sense in
      which the discarded structure is discarded compatibly.
      The projection is genuinely LOSSY: the number of primes of a given bit
      length sharing a given profile to any measurable precision is enormous,
      and p is not recoverable from the profile -- indeed the profile of a
      GENERIC prime is a deterministic function of its bit length alone, which
      is precisely why a departure from it is a signal. It is not a change of
      coordinates: contrast the (Delta, Pi) example of
      docs/inventor-protocol.md section 2, where the discarded pair was
      recoverable as the roots of a quadratic; here the fiber is recoverable
      only for the anomalous cases, and only up to sign and unimodular action.
      WHERE THE TEST BITES: retaining the WITNESS POLYNOMIALS rather than their
      norms would make the projection nearly invertible for special primes
      (f determines p as f(m)), and the object would collapse into "the prime
      itself in a different notation". Retaining only the norm profile is what
      makes it an object; that choice is deliberate and is stated here rather
      than discovered later.
    propagation: >-
      One-step propagation is defined, cheap and measurable. Increasing d by 1
      at fixed m: the generic profile increases the lattice rank and the
      predicted lambda_1 moves from ~ p^{1/(d+1)} to ~ p^{1/(d+2)}, a
      deterministic step; the OBSERVED step is what the detector compares
      against. Changing m within the grid: determinant fixed, profile entry
      re-drawn. The per-step residual (observed minus predicted, in bits) is
      the record's primary observable, and it is computable in milliseconds per
      cell.
    survival_score: >-
      The object survives while the observed profile is distinguishable from
      the generic Gaussian-heuristic profile, i.e. while a witness exists with
      ||f||_inf well below p^{1/(d+1)}. It DISSOLVES at large d: as d grows,
      p^{1/(d+1)} falls toward O(1) and EVERY prime admits a small-coefficient
      representation, so the detector's null and alternative merge and
      specialness ceases to be a property. That degeneracy degree d* is
      measurable, is a function of log2 p alone, and is reported as the
      record's scope boundary rather than left implicit. It is also the reason
      the grid must be declared in advance: sweeping d until a signal appears
      is exactly how this measurement would fool itself.
    newness_score: >-
      Genuinely-new-vs-repackaging, scored pessimistically. The detector is not
      new (IDEA-20260816-dd425d, and the external SNFS-detection line). The
      observation that pairing primes are special is not new
      (IDEA-20260809-1d1734, and universally known). What this program does not
      hold is (i) the minimisation over the fiber rather than evaluation at the
      canonical witness, and (ii) the two IN-FAMILY null populations that make
      a percentile statement about the deployed instance possible at all.
      Score: ADAPTATION, with the fallback that it is a null-object extension
      of 1d1734. Claimed as new only relative to this repository.

  null_object_control: >-
    NULL 1 -- GENERIC-PRIME CONTROL (forced, blocking, and expected to be
    UNINFORMATIVE by design). Run the detector on random primes of the same bit
    length. The deployed primes will beat them trivially, because every family
    prime is special by construction. This control exists to VALIDATE THE
    DETECTOR's null distribution against the Gaussian heuristic (heuristic H1),
    not to support any claim about the deployed curves, and the deliverable
    must say so in the same sentence in which it reports the result.
    NULL 2 -- DENSE IN-FAMILY CONTROL (forced). N >= 10^3 seeds x' of the same
    bit length drawn uniformly at random, retaining only those yielding valid
    family parameters (p prime, r prime, the family's congruence conditions).
    This is the population that isolates the SEED SPARSITY effect from the
    FAMILY effect.
    NULL 3 -- SPARSE IN-FAMILY CONTROL, matched Hamming weight (forced). N >=
    10^3 valid seeds of the same bit length AND the same Hamming weight as the
    deployed seed. This is the population against which claim F3's percentile
    is computed, and it is the only null that can distinguish "the family's
    engineering convention is special" from "this particular seed is special".
    NULL 4 -- GRID-SHOPPING CONTROL. Re-run the entire pipeline with the grid
    (range of d, set of bases m) drawn from a pre-registered list, and report
    the deployed seed's percentile under EACH grid. A percentile that is
    extreme under one grid and unremarkable under the others is a multiple-
    comparisons artifact, and the record reports the family-wise corrected
    statement or nothing.
    NULL 5 -- REDUCTION-ALGORITHM CONTROL. Both arms (deployed and null
    populations) are reduced by the IDENTICAL algorithm with identical
    parameters. Separately, on a subsample at d <= 8, run exact SVP by
    enumeration and record the LLL-to-exact ratio distribution (heuristic H2).
    A comparison is valid even if LLL is loose, PROVIDED the looseness is the
    same on both arms -- which this control is what establishes.

  discriminated_from:
    - >-
        IDEA-20260809-1d1734: evaluates the canonical family polynomial's
        special-form advantage and asks whether the deployed estimate uses the
        special variant. This record minimises over the whole representation
        fiber and places the deployed instance inside two in-family null
        populations. OVERLAP IS SUBSTANTIAL AND IS FLAGGED IN novelty_screen;
        the fallback is to merge this record into 1d1734 as its null-object
        extension.
    - >-
        IDEA-20260816-dd425d: builds the detector for general primes in the
        SNFS lane. This record is a consumer of that instrument, not a
        competitor; the family-conditioned null is what it adds.
    - >-
        IDEA-20260818-17300c: measures small-prime valuation bias of tower
        norms at a fixed representation. Orthogonal axis (arithmetic vs size),
        and the two compose into the effective smoothness parameter.
    - >-
        IDEA-20260809-172a9e and IDEA-20260815-bf1328: search over sieve
        polynomial selections for the target field. Different object: those
        search for polynomials defining the number fields used by the sieve;
        this searches for representations of the PRIME. The distinction must
        be stated in any experiment contract because the two are easy to
        conflate and the conflation would invalidate the null populations.

  assumptions:
    - >-
        The deployed seeds, the family polynomials, and the resulting primes
        are TRANSCRIPTION-CHECKED against two independent published statements
        before any lattice is built. This is not a formality: the null
        populations are generated from the family polynomial, so a wrong
        polynomial corrupts both arms in a correlated way that no downstream
        statistic would reveal.
    - >-
        Valid-parameter filtering for the null populations (primality of p and
        r, the family's congruence conditions, and any embedding-degree
        condition) is applied identically to the deployed seed and to the
        nulls. A filter that the deployed seed passes and the nulls do not is a
        confound that would manufacture the record's own hypothesis.
    - >-
        The grid of (d, m) is PRE-REGISTERED in the experiment contract. NULL 4
        exists because a grid chosen after seeing the deployed prime's profile
        is not a measurement.
    - >-
        No cost figure is recorded before RQ-PAIR-f2e31f constraint 1 is
        discharged. F1, F2 and F3 are measurements of coefficient sizes and are
        NOT cost figures; the H3 transfer step and any statement about which
        L-constant applies ARE, and are blocked.

  proof_search_map:
    bottleneck: >-
      The determination of WHICH L-notation constant applies to the deployed
      target field -- the general one or the special-form one. Every published
      bit level for these curves is downstream of that single choice, and the
      choice is a function of what representation of p an attacker may use,
      which is a search outcome and not a curve property.
    baseline_embedding:
      parameter_slice: >-
        The canonical family witness is an exact parameter slice: at the
        (d, m) corresponding to p = P(x) with m = x, the search must return a
        vector whose infinity norm equals the family polynomial's coefficient
        bound (up to the known scaling by 3 in the BLS12 case). It must also
        reproduce the generic Gaussian-heuristic profile on NULL 1's random
        primes.
      reproduction_check: >-
        FROZEN FIXTURE, not impression: the fixture stores, for each curve, the
        family witness's coefficient vector and the expected log2 norm, and for
        a declared set of random primes the expected generic profile. The
        search must recover the family witness EXACTLY at its own (d,m) cell --
        if it cannot recover a witness it is given the base for, its
        certification of optimality elsewhere is worthless.
    observation_collision:
      observable: >-
        The scalar h(p) -- the fiber minimum in bits, which is what a
        "specialness" verdict would rest on.
      distinct_preimage_search: >-
        DIRECTLY SEARCHED AND EXPECTED TO SUCCEED. Two primes can share h(p)
        while differing in the DEGREE at which the minimum is attained, and
        degree is not a free variable for the sieve: a witness of degree 4 and
        a witness of degree 12 with the same coefficient bound have different
        norm sizes in the tower, because the norm bound couples degree and
        coefficient size. So h alone does not determine sieve relevance, and
        the collision is a direct falsifier of h's identifiability as a
        specialness score. The additional condition separating the preimages is
        the (degree, coefficient-bound) PAIR, which is why the deliverable is
        the full profile over the grid and never the scalar minimum.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move from "is this prime special" to "what is the shortest vector of
          a rank-(d+1) lattice of determinant p" -- a model in which the
          hypothesis is an exact lattice quantity with a closed-form null,
          rather than a qualitative property. Encoding, completeness (every
          representation is a lattice vector), soundness (every short vector
          that evaluates to p is a representation, checked by evaluation) and
          cost are separately dischargeable.
        predicted_gain: >-
          Converts a judgment into a detector with a computable null
          distribution and a stated false-positive rate.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (the prime) fixed and vary the forgotten
          structure (which representation the attacker uses). The intrinsic
          invariant distinguishing the resulting attack settings is the
          (degree, coefficient-bound) pair, which the scalar label discards
          entirely.
        predicted_gain: >-
          Makes explicit that "the security of this curve" quantifies over
          representations, and that the published figure fixes one.
    quantifier_order: >-
      The published treatment asserts: THERE EXISTS a representation R (the
      family one) such that FOR ALL attackers, cost via R is at least 2^L. The
      honest statement is: FOR ALL representations R in the fiber there EXISTS
      a cost, and the attacker minimises over R, so the relevant quantity is
      min over R -- and the witness R is allowed to depend on the attacker's
      search budget, which the fixed-representation label forbids. This
      inversion is checkable with no compute and is the record's central
      methodological point.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest certifiable claim is: within the pre-registered grid, the
        shortest representation found for p has coefficient bound H at degree
        d, the deployed seed sits at percentile q within its matched null
        population, and no shorter representation exists in the grid to within
        the reduction algorithm's approximation factor. It CANNOT certify that
        no shorter representation exists outside the grid, cannot certify any
        attack cost, cannot determine which L-constant applies without the
        blocked model step, and cannot say anything about intent or about
        whether any curve is secure.
      nearby_object_control: >-
        The nearby object where the hoped-for conclusion must FAIL: a valid
        same-family seed of the same bit length and the same Hamming weight,
        chosen at random (NULL 3). If the method flags the deployed seed as
        anomalous and also flags a random matched peer at a similar rate, it
        has not identified anything about the deployed instance. A second
        nearby object: a DENSE seed of the same family (NULL 2), where the
        family effect is present and the sparsity effect is not -- the method
        must separate those two.
    proof_obligations:
      - claim: 'The search recovers the known family witness exactly at its own (d,m) cell.'
        responsibility: baseline
      - claim: 'The empirical null profile on random primes matches the Gaussian heuristic within a stated tolerance.'
        responsibility: baseline
      - claim: 'Null populations are generated and filtered identically to the deployed instance.'
        responsibility: correctness
      - claim: 'h(p) is at least 8 bits below the generic expectation at the minimising d.'
        responsibility: strictness
      - claim: 'Median h of sparse peers is at least 4 bits below median h of dense peers.'
        responsibility: strictness
      - claim: 'The deployed seed''s percentile is reported under every pre-registered grid, with a family-wise correction.'
        responsibility: correctness
      - claim: 'Reduction cost, memory and the largest lattice handled are stated.'
        responsibility: memory
      - claim: 'No statement about deployed-curve security, and none about intent, is derivable from the output.'
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: 'h(p) minus the generic Gaussian-heuristic expectation at the minimising d, in bits, for each deployed prime'
      direction: lower
      minimum_effect: >-
        <= -8 bits (i.e. at least 8 bits below generic). Less than 8 bits below
        generic falsifies F1 and would mean the deployed primes are, on this
        statistic, closer to generic than the family construction suggests --
        which would itself be surprising and reportable.
    - metric: 'existence of a witness strictly shorter than the canonical family polynomial, at any grid cell'
      direction: different
      minimum_effect: >-
        BINARY, and both outcomes are findings. FOUND: the canonical
        representation is not the attacker''s best and the published treatment
        evaluates a suboptimal witness. NOT FOUND across the whole grid: the
        canonical witness is certified optimal within the grid, which
        materially strengthens the published treatment and closes this
        direction with a measurement rather than an opinion.
    - metric: 'median h of the sparse in-family population minus median h of the dense in-family population, in bits'
      direction: lower
      minimum_effect: >-
        <= -4 bits. A gap smaller than 4 bits falsifies F2 and means the
        sparse-seed engineering convention is security-neutral on this
        statistic -- a clean, useful negative about a universal design
        practice.
    - metric: 'percentile q of the deployed seed within the matched sparse population'
      direction: different
      minimum_effect: >-
        PREDICTED UNREMARKABLE: q in [5, 95]. q < 1 under every pre-registered
        grid is the anomalous outcome and would be reported as a narrowly
        scoped instance observation with the intent disclaimer attached; q in
        the central band is the expected outcome and closes a standing worry
        cheaply.
    - metric: 'empirical null profile on random primes vs the Gaussian heuristic, in bits'
      direction: different
      minimum_effect: 'FORCED to agree within 0.5 bits in median. Disagreement halts the record (heuristic H1 falsified).'
    - metric: 'LLL-to-exact-SVP ratio distribution on the d <= 8 subsample'
      direction: different
      minimum_effect: >-
        Median <= 2^1. Above that, absolute H values are not trustworthy; the
        COMPARISON between arms survives (NULL 5), and the record must restrict
        itself to comparative statements.

  minimal_test:
    design: >-
      NO SIEVE IS RUN, NO RELATION IS COLLECTED, NO DISCRETE LOGARITHM IS
      ATTEMPTED. Five stages with stop gates.
      (S1) TRANSCRIPTION AND PRE-REGISTRATION, minutes: verify both seeds, both
      family polynomials and both primes against two independent published
      statements; freeze the grid (d in a declared range, m over a declared set
      of bases including powers of two and the seed powers), the null
      population sizes, the validity filter, and the reduction parameters.
      STOP GATE: a transcription mismatch halts everything.
      (S2) DETECTOR VALIDATION, minutes: reproduce the family witness exactly
      at its own cell; measure the empirical null profile on >= 10^4 random
      primes of the same bit length and compare against the Gaussian heuristic
      (H1). STOP GATE: failure of either halts the record and is the result.
      (S3) FIBER ENUMERATION, minutes to hours: compute the profile for both
      deployed primes over the whole grid; record the minimising cell, the
      witness, and whether it beats the canonical one.
      (S4) NULL POPULATIONS, hours: generate NULL 2 (dense) and NULL 3 (matched
      Hamming weight) at N >= 10^3 each with the identical filter, run the
      identical pipeline, and compute the deployed seed's percentile in each;
      repeat under every pre-registered grid (NULL 4). Run the exact-SVP
      subsample (NULL 5 / H2).
      (S5) TRANSFER, BLOCKED on RQ-PAIR-f2e31f constraint 1: convert the found
      coefficient bound into a sieve-relevant norm-size shift by the exact
      box-enumeration method of IDEA-20260816-9cfbac (H3), and report the shift
      in bits of norm -- NEVER a security level, NEVER a bit level, and never a
      statement about which L-constant applies until the KN-LIT filing exists.
      COST: one machine, minutes to a few core-hours. LLL on rank <= 33
      lattices with 381-bit entries is milliseconds per cell; the dominant cost
      is generating and filtering 2 * 10^3 valid family parameters, which is
      primality testing.
    controls:
      - 'NULL 1 generic-prime detector validation (forced, blocking, explicitly uninformative about the curves).'
      - 'NULL 2 dense in-family population (forced).'
      - 'NULL 3 matched-Hamming-weight in-family population (forced).'
      - 'NULL 4 grid-shopping / multiple-comparisons control across pre-registered grids.'
      - 'NULL 5 identical reduction on both arms, plus exact SVP on a d <= 8 subsample.'
      - 'Frozen fixture: exact recovery of the canonical family witness.'
      - 'Transcription check of seeds, family polynomials and primes against two independent published statements.'
    required_metrics:
      - 'full profile log2 lambda_1(L(p,m)) over the grid, for both deployed primes.'
      - 'the minimising cell and its witness polynomial, with the witness verified by evaluating f(m) = p.'
      - 'h(p) minus generic expectation, in bits, per d.'
      - 'median and full distribution of h over each null population.'
      - 'deployed percentile q per null population per pre-registered grid, with family-wise correction.'
      - 'LLL-to-exact ratio distribution on the subsample.'
      - 'the degeneracy degree d* above which every prime admits a small representation.'
      - 'wall-clock and peak memory, and the largest lattice rank handled.'

  falsification_conditions:
    - >-
        The empirical null profile on random primes departs from the Gaussian
        heuristic by more than 0.5 bits in median. H1 is falsified, the
        detector has no calibrated null, and the record halts. This is the
        cheapest failure and it comes in stage S2.
    - >-
        The search fails to recover the canonical family witness at its own
        cell. The implementation is wrong; nothing downstream may be reported.
    - >-
        h(p) is less than 8 bits below the generic expectation at every d. F1
        false.
    - >-
        No witness shorter than the canonical family polynomial exists anywhere
        in the grid. F1's optimisation half is false and the canonical
        representation is certified optimal within the grid -- a positive
        result for the published treatment, to be reported as such and not as
        a null.
    - >-
        Median h of sparse peers within 4 bits of dense peers. F2 false; the
        sparse-seed convention does not measurably increase special-form
        structure, which retires a plausible worry about a universal design
        practice.
    - >-
        The deployed percentile is extreme under one pre-registered grid and
        unremarkable under the others. Multiple-comparisons artifact; no
        instance claim may be made, and the record reports the corrected
        statement.
    - >-
        LLL-to-exact median ratio above 2^1 AND differing between arms. The
        comparison itself is confounded and even comparative statements are
        withdrawn.

  confounders:
    - >-
        FAMILY EFFECT MASQUERADING AS INSTANCE EFFECT: every seed in the family
        yields a special prime, so any comparison against generic primes is
        uninformative about the deployed instance. This is why NULL 2 and NULL
        3 are forced, and why NULL 1 is explicitly labelled uninformative about
        the curves in the deliverable itself.
    - >-
        VALIDITY-FILTER ASYMMETRY: the deployed seed satisfies constraints
        (subgroup order size, twist properties, congruence conditions) that a
        naive null population may not. Any filter applied to one arm must be
        applied to both, and every filter is enumerated in the contract.
    - >-
        MULTIPLE COMPARISONS OVER THE GRID: the grid has many cells and the
        minimum over many draws is biased low. The Gaussian-heuristic null must
        be applied to the MINIMUM OVER THE GRID, not per cell, and NULL 4
        bounds the residual.
    - >-
        HAMMING WEIGHT IS NOT THE ONLY SPARSITY: the deployed seed may be
        sparse in a signed or windowed representation rather than in plain
        binary. The matched population should be matched on the sparsity notion
        that actually drove the design choice, and if that notion is uncertain
        the record must report percentiles under more than one matching and
        say so.
    - >-
        INTENT IS NOT MEASURED AND NOT MEASURABLE HERE. A low percentile has
        many innocent explanations, beginning with the fact that designers
        optimise seeds for arithmetic and arithmetic correlates with
        structure. The record reports a number and must not phrase it as a
        finding about anyone's choices.

  interpretation_limits:
    - >-
        NO ATTACK IS MOUNTED and no statement that any deployed curve is broken
        or safe may be derived. Even the anomalous outcome (q < 1) is a
        statement about coefficient sizes of polynomial representations,
        nothing more.
    - >-
        Absence of a short representation outside the pre-registered grid is
        NOT established by anything here. The claim is scoped to the grid, the
        reduction algorithm, and its approximation factor.
    - >-
        The step from coefficient size to attack cost is heuristic H3, is
        blocked on the KN-LIT filing, and carries the two RECALLED L-constants
        on which the whole cascade argument rests. Until those are resolved
        against primary text, this record's output is a lattice measurement
        with no cost interpretation whatsoever.
    - >-
        No statement about intent, trapdoors, or the good faith of any designer
        is admissible output of this record under any outcome.

  heuristic_assumptions:
    - id: H1
      statement: >-
        FOR a uniformly random prime p of the deployed bit length and a base m
        generating (Z/pZ)^*, the first minimum of the rank-(d+1) power lattice
        L(p,m) of determinant p is distributed about the Gaussian-heuristic
        value sqrt((d+1)/(2 pi e)) * p^{1/(d+1)}, uniformly over the grid's d
        range.
      rigorous_support: >-
        Rigorous ingredient: Minkowski's convex body theorem gives an
        unconditional UPPER bound on lambda_1 of the right shape, and the
        determinant is exactly p whenever m generates, so the scale is not
        fitted. THE GAP, stated rather than hidden: the Gaussian heuristic is a
        statement about random lattices, and L(p,m) is a structured lattice
        (its basis is the power basis of m), so its first minimum need not
        follow the random-lattice law -- especially at small d, where the
        rank is too small for any asymptotic heuristic to be trusted. The
        assumption imitates the standard practice of using the Gaussian
        heuristic as the null in lattice-based detection.
      validation_plan: >-
        SAMPLE: >= 10^4 random primes of the deployed bit length, times a
        declared set of bases m, at every d in the grid; reduce identically to
        the main arm; record the empirical distribution of log2 lambda_1.
        COMPARE: empirical median and quantiles against the Gaussian-heuristic
        prediction, per d. TAIL CHECK: the shortest vector observed over the
        whole null sample, against the heuristic's predicted extreme -- this is
        the quantity that sets the detector's false-positive rate and it is the
        one that matters, since the deployed prime is being compared to a tail.
        TRANSFER ASSUMPTION, STATED: the null is measured at the same bit
        length and the same d range as the main arm, so no size extrapolation
        occurs; nothing is claimed for other bit lengths.
      falsification_condition: >-
        Empirical median departing from the heuristic by more than 0.5 bits at
        any d in the grid, or the empirical 10^-4 tail departing by more than 2
        bits. Either falsifies H1; the detector then has no calibrated null and
        the record halts rather than substituting an empirical null quietly.
    - id: H2
      statement: >-
        FOR the lattice ranks in the grid (d+1 <= 33) and 381-bit entries, the
        reduced first basis vector produced by the declared reduction algorithm
        is within a factor 2 of the true shortest vector, in median, and the
        approximation factor's distribution does not differ between the
        deployed arm and the null arms.
      rigorous_support: >-
        Rigorous ingredient: LLL's proved worst-case approximation factor
        2^{(n-1)/2}, which at these ranks is far too weak to be useful --
        stated plainly. The assumption is that the AVERAGE case is
        dramatically better, which imitates universal practice in lattice
        cryptanalysis but is not a theorem here.
      validation_plan: >-
        SAMPLE: for d <= 8, run exact SVP by enumeration on >= 200 lattices
        drawn from each arm; record the ratio of the reduced norm to the exact
        shortest norm. COMPARE: the ratio distributions across arms, by a
        two-sample test. TAIL CHECK: the largest ratio observed, and the
        largest d at which exact SVP is affordable -- above which the
        assumption is untested and is declared so. TRANSFER ASSUMPTION,
        STATED: the ratio measured at d <= 8 is assumed to hold in FORM at
        larger d; only the equality BETWEEN ARMS is relied on for the
        comparative claims, and no absolute claim is made at d > 8.
      falsification_condition: >-
        Median ratio above 2 at any tested d, or a two-sample test separating
        the arms' ratio distributions at p < 0.01. The first restricts the
        record to comparative statements; the second invalidates even those.
    - id: H3
      statement: >-
        FOR the exTNFS tower at the deployed parameters, a reduction of delta
        bits in the coefficient bound of the representation of p reduces the
        median sieve-relevant norm bit-size by c * delta with c > 0 determined
        by the norm formula, uniformly over the sieve box.
      rigorous_support: >-
        Rigorous ingredient: the norm of a sieve candidate is bounded above by
        a product in which the coefficient bound appears with a fixed exponent
        -- an INEQUALITY, valid unconditionally. THE GAP, stated rather than
        hidden: an upper bound on the norm is not the norm's distribution, the
        bound may be loose by many bits, and the actual median norm shift is an
        empirical quantity. This is precisely the gap
        IDEA-20260816-9cfbac's exact box enumeration was built to close, and
        this record delegates to it rather than assuming its own answer.
      validation_plan: >-
        SAMPLE: enumerate the norm bit-lengths over a fixed sieve box for the
        canonical representation and for the best found representation, exactly
        and with no sieve, following IDEA-20260816-9cfbac's method; >= 10^6 box
        points each. COMPARE: the two distributions' medians and their shift
        against the predicted c * delta. TAIL CHECK: the smallest norms
        observed in each arm, which is where relations actually come from and
        where a median shift can be misleading. TRANSFER ASSUMPTION, STATED:
        the box is at the deployed parameters, so no size extrapolation occurs;
        what does NOT transfer is any statement about relation YIELD, which
        additionally requires the smoothness law and is the subject of
        IDEA-20260818-17300c.
      falsification_condition: >-
        Measured median norm shift below 0.5 * c * delta, or a shift in the
        median with no shift in the lower tail. Either falsifies H3 and blocks
        the transfer step entirely; F1-F3 survive as pure lattice measurements
        with no cost interpretation.

  target_complexity:
    time_exponent: >-
      THE RECORD ITSELF PROPOSES NO ALGORITHM AND MOVES NO EXPONENT. What it
      bears on is WHICH exponent constant applies to the deployed target field:
      the RECALLED general-case c = (48/9)^{1/3} ~ 1.747 versus the RECALLED
      special-form c = (32/9)^{1/3} ~ 1.526 in L_Q[1/3, c] at Q = p^12. That is
      a difference between two exponents, not a constant factor, and it is the
      reason this record is not polishing. IT ASSERTS NEITHER VALUE and does
      not claim to settle which applies: settling that requires the blocked
      model step plus primary-text resolution of both constants. Its own cost
      is LLL on rank <= 33 lattices: milliseconds per cell, a few core-hours
      for the full null populations, dominated by primality testing.
    memory_exponent: >-
      NEGLIGIBLE AND STATED RATHER THAN OMITTED: a rank-33 lattice with 381-bit
      entries is a few kilobytes; the whole run holds at most 2 * 10^3 * |grid|
      such objects, well under 1 GB, on one machine. Communication: none; the
      work is embarrassingly parallel over seeds and grid cells with zero
      inter-worker traffic and no sequential depth. This record therefore has
      NO memory-time tradeoff to report, and says so rather than claiming a
      memory honesty it did not have to earn. The memory that matters in this
      lane lives in the linear-algebra step of the sieve, which this record
      does not touch and must not be credited for.
    best_known: >-
      Frontier rows checked for domination. (i) exTNFS general,
      L_Q[1/3,(48/9)^{1/3}], RECALLED. (ii) SexTNFS special-form,
      L_Q[1/3,(32/9)^{1/3}], RECALLED -- the row this record bears on. (iii)
      Kim-Jeong composite-degree extension, KN-LIT-3742, corpus title record.
      (iv) Published post-exTNFS key-size re-estimates, RECALLED. (v) Galois
      linear-algebra speedup, KN-LIT-7643. (vi) Lattice sieving of KN-LIT-4634.
      (vii) On the DETECTION axis rather than the attack axis: this program's
      IDEA-20260816-dd425d, and the external SNFS/trapdoored-prime line
      (RECALLED). THIS RECORD IMPROVES NONE OF THEM. It measures which of rows
      (i) and (ii) the deployed instances belong to, and it does not by itself
      decide that question.
    hidden_overhead: >-
      Named and substantial. (a) BOTH L-constants are recalled at second hand
      from another proposal's citation block; if either is wrong the cascade
      argument collapses. (b) The transcribed seeds and family polynomials are
      recalled from model memory and are NOT verified -- they gate everything,
      including the null populations. (c) LLL's approximation factor is
      assumed benign (H2) with only a d <= 8 check. (d) The minimum over a grid
      is biased low and the null must be applied to the minimum, not per cell.
      (e) The transfer from coefficient size to norm size is an inequality, not
      an identity (H3).
    tradeoff_note: >-
      No time-memory tradeoff in the measurement. The tradeoff that the
      measurement INFORMS is the attacker's: a representation with smaller
      coefficients at higher degree trades norm size against factor-base size
      and matrix dimension, which is exactly the frontier
      IDEA-20260818-1fb37d maps and IDEA-20260809-1a5cb2 prices. The
      (degree, coefficient-bound) pair this record reports is the input those
      records need, and reporting only the scalar minimum would destroy it --
      which is the observation-collision finding above.

  obstruction:
    statement: >-
      ANTICIPATED, TO BE MEASURED, NOT ASSERTED. The likely obstruction is
      DEGENERACY OF THE DETECTOR AT HIGH DEGREE: as d grows, the generic
      shortest vector p^{1/(d+1)} falls toward O(1), every prime of the given
      bit length admits a small-coefficient representation, and "special" stops
      being a property that distinguishes anything. Above that degree the
      object dissolves, and the dissolution is a property of the object, not a
      failure of the attempt.
    quantity: >-
      The degeneracy degree d*(log2 p): the smallest d at which the empirical
      null distribution of log2 lambda_1 over random primes of the deployed bit
      length overlaps the deployed prime's value at the 50th percentile.
    value: >-
      NOT YET MEASURED. Recording a value before the run would be fabrication
      under AGENTS.md rule 5.
    measured_by: []
    scope: >-
      To be claimed only for the deployed bit lengths, the pre-registered grid,
      and the declared reduction algorithm. Nowhere else.
    resource_check:
      examined: true
      reading: >-
        READ AS A RESOURCE, NOT A NUISANCE. d* is not merely where the detector
        stops working -- it is the degree above which EVERY prime has a cheap
        representation, and that is a statement an attacker can use: it bounds
        the degree range in which "specialness" is worth searching for at all,
        and hence bounds the polynomial-selection search space that
        IDEA-20260809-172a9e must cover to claim it explored the tail. The
        theory that wants this measurement is any analysis of how much search
        budget a special-form advantage is worth, and d* is precisely the
        cutoff such an analysis needs. Second reading: d* as a function of
        log2 p is a curve, and where a deployed prime sits relative to it is a
        curve-selection criterion that could be stated in advance for future
        parameter choices -- a constructive use of a negative. If neither
        reading is taken up, that is recorded honestly and is not a closure.
      spawned_ids: []

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES against the
    frontier in target_complexity.best_known.
    AS AN ATTACK: n/a -- no attack is proposed; every frontier row dominates
    trivially.
    AS A COST MODEL: dominated by the published exTNFS/SexTNFS analyses and the
    published key-size re-estimates, which state constants; this record states
    none.
    AS A SPECIAL-FORM DETECTOR: DOMINATED by IDEA-20260816-dd425d within this
    program, which owns the detector, its null and its ROC framing -- this
    record is a consumer. Externally, DOMINATED by the SNFS-detection and
    trapdoored-prime literature on the general question of whether a deployed
    prime is special (RECALLED; this session read no source, so this domination
    is asserted on recollection and the reviewer must confirm it).
    AS A CHARACTERISATION OF THE DEPLOYED PAIRING PRIMES SPECIFICALLY:
    IDEA-20260809-1d1734 dominates on the canonical-witness question. On the
    FIBER-MINIMUM question and on the in-family percentile, no dominating row
    was identified in the screened corpus -- but the screen was bounded and no
    external search was run, so the honest label is UNKNOWN, not absent.
    NOT NULL ON ANY AXIS.
  sota_delta: >-
    QUANTITATIVE, AND A PREDICTION RATHER THAN A RESULT. No exponent is
    improved and no constant is claimed. Deliverable versus incumbent: a full
    (degree, base) -> coefficient-bound profile for both deployed primes over a
    pre-registered grid, a binary certified answer to "does a representation
    shorter than the canonical family polynomial exist in the grid", a
    sparse-versus-dense in-family median gap predicted at >= 4 bits, and a
    percentile placement of each deployed seed within >= 10^3 matched peers --
    against an incumbent in which this program holds NO profile, NO fiber
    minimum, and NO in-family null population for either curve, and in which
    the nearest record (IDEA-20260809-1d1734) evaluates a single canonical
    witness. If every prediction fails, the delta is a certified statement that
    the canonical representation is optimal within the grid and that the
    deployed seeds are typical of their families -- which is a real reassurance
    this program does not currently hold either.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.75 that the detector validates against the Gaussian heuristic at S2 --
    the null is well understood and the ranks are small. 0.9 that h(p) is at
    least 8 bits below generic (F1's first half); this is close to a
    foregone conclusion given the family construction, and is included as a
    sanity check rather than as a discovery. 0.25 that a witness strictly
    shorter than the canonical family polynomial exists in the grid -- the
    family polynomial already has O(1) coefficients, so there is very little
    room, and the LIKELY outcome is a certification of optimality, which is why
    this record is classed `control` and priced at medium rather than high
    priority. 0.5 that the sparse-versus-dense median gap reaches 4 bits.
    0.9 that the deployed seed's percentile is unremarkable (q in [5,95]),
    i.e. the anomalous outcome is unlikely and the record's value is mostly in
    closing the question cheaply and on the record.

  blocked_on: >-
    Stage S5 only (the transfer to norm sizes and any statement about which
    L-constant applies) is blocked by RQ-PAIR-f2e31f constraint 1 -- the KN-LIT
    filing that IDEA-20260818-d44bba performs -- and additionally by
    primary-text resolution of the two RECALLED L-constants. Stages S1-S4
    produce no cost figure, need no retrieval beyond transcription checking the
    published curve parameters, and are executable on one machine today. A
    reviewer may also elect to merge this record into IDEA-20260809-1d1734
    before any execution; that is stated in novelty_screen as the fallback.

