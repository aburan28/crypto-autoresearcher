idea:
  id: IDEA-20260818-84ac92
  question_id: RQ-PAIR-f2e31f
  goal_id: GOAL-PAIR-001
  added: '2026-08-18'
  title: >-
    THE DEPLOYED SEED WAS CHOSEN SPARSE FOR ARITHMETIC SPEED, AND SPARSITY IS
    ALSO WHAT MAKES A PRIME SPECIAL FOR THE SIEVE: enumerate the FIBER of
    small-coefficient polynomial representations of the BLS12-381 and BN254
    primes over degree and base, and place the deployed seed against two
    in-family null populations
  class: control

  claim: >-
    A pairing-friendly prime is not one special form but a FIBER of them. Fix
    p. For each degree d and each base m, the power lattice
    L(p,m) = { a in Z^{d+1} : sum_i a_i m^i = 0 mod p } contains every degree-d
    polynomial representing p at m, and the sieve-relevant quantity is
    h(p) = min over (d <= D, m in a declared grid) of log2 ||f||_inf over
    nonzero f in L(p,m) with f(m) = p. The published treatment of these curves
    takes ONE member of that fiber -- the family polynomial, p = P(x) with P
    fixed and x the seed -- and asks what it gives the sieve. This record asks
    what the MINIMUM over the fiber gives, and whether the deployed instances
    sit where a same-shape peer would.
    (F1) FIBER STRUCTURE. For each of the two deployed primes, h(p) is at least
    G bits below the generic expectation log2 p/(d+1) at the minimising d, with
    G >= 8 bits. The family polynomial is one witness; the claim is that the
    lattice search either FINDS A STRICTLY BETTER WITNESS (smaller ||f||_inf at
    some (d,m) not of the family form) or CERTIFIES the family witness optimal
    within the searched grid. Both outcomes are informative and they mean
    different things.
    (F2) SPARSITY IS THE MECHANISM, tested against two nulls. Compare the
    deployed seed against (N-A) seeds of the same bit length drawn uniformly
    (dense), and (N-B) seeds of the same bit length AND the same Hamming
    weight (sparse peers), all yielding valid parameters of the same family.
    Claim: the sparse population's h is lower than the dense population's by
    >= 4 bits in median, i.e. the engineering convention "choose a sparse seed
    for fast arithmetic" measurably increases the prime's special-form
    structure. This is a claim about a SELECTION CRITERION, not about a curve.
    (F3) INSTANCE POSITION. The deployed seed's h sits at percentile q within
    its same-Hamming-weight peer population. PREDICTED: q is unremarkable, in
    the central 90%. If instead q is below the 1st percentile, that is a
    scoped, instance-specific observation -- "the deployed seed admits a
    representation with coefficients Z bits smaller than 99% of same-shape
    peers" -- and it is NOT a break, NOT a trapdoor claim, and NOT a statement
    about intent, and must never be written as one.
    NOTHING IN THIS RECORD MAY BE READ AS ASSERTING THAT ANY DEPLOYED CURVE IS
    BROKEN OR SAFE. The step from "smaller coefficients" to "lower attack cost"
    is a MODEL step (heuristic H3), it is where the recalled exTNFS/SexTNFS
    constants live, and this record measures the input to that step and not its
    output.

  mechanism: >-
    Two facts compose. FIRST, the special number field sieve's advantage comes
    from the algebraic norms being smaller, and the norms are bounded by a
    product in which the polynomial's coefficient bound H appears directly; so
    "how small can H be for this p" is the quantity that decides whether the
    special constant or the general constant applies. SECOND, the deployed
    seeds were chosen sparse in base 2 for arithmetic reasons -- low Hamming
    weight makes the Miller loop and the final exponentiation cheap -- and a
    sparse seed makes p = P(x) a sparse-ish polynomial in 2 of moderate degree,
    which supplies representations at bases m = 2^k that a dense seed does not.
    The two facts pull in opposite directions on the same design choice, and
    nobody has to have intended anything for the effect to be real.
    THE STRUCTURAL INGREDIENT is that the search is a LATTICE PROBLEM AND NOT A
    SEARCH: for fixed (d,m) the set of degree-d polynomials vanishing at m
    modulo p is a rank-(d+1) integer lattice of determinant p (whenever m
    generates), so its shortest vector is computable by LLL in milliseconds,
    its GENERIC first minimum is predicted in closed form by the Gaussian
    heuristic, and "is this prime anomalously special" becomes a
    signal-detection question with a computable null distribution. This
    program already holds that instrument: IDEA-20260816-dd425d builds exactly
    this detector for general primes under the SNFS lane, with the
    Gaussian-heuristic null and the ROC framing. This record does not rebuild
    it; it points it at the two deployed pairing primes and, critically,
    supplies the IN-FAMILY null populations that a general-prime null cannot
    provide -- because comparing a BLS12 prime against random primes of the
    same bit length is a foregone conclusion (every family prime is special by
    construction), while comparing it against its own family's seeds is not.
    THE CASCADE, and why this is not polishing. If the fiber minimum is
    materially below the family witness, then the applicable frontier row is
    not the one the label assumes: the whole gap between the RECALLED general
    constant (48/9)^{1/3} ~ 1.747 and the RECALLED special constant
    (32/9)^{1/3} ~ 1.526 hangs on which representation an attacker may use, and
    a representation is not a curve property but a search outcome. Determining
    which constant applies is not a constant-factor question; it is the
    difference between two exponents in L-notation at Q = p^12.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Corpus greps in this worktree on 2026-08-18, bounded to four queries per
      the dispatching Coordinator's instruction: 'question_id: RQ-PAIR-f2e31f'
      over ledger/proposals with 12 lines of context, recovering title, class
      and claim head for all 13 sibling proposals; 'RQ-PAIR-f2e31f' over
      ledger/ (18 files); targeted title/claim reads of IDEA-20260816-dd425d,
      IDEA-20260816-9cfbac and IDEA-20260815-f4deca. Read in full:
      RQ-PAIR-f2e31f and IDEA-20260818-1fb37d. NO WEB SEARCH, NO PRIMARY-TEXT
      FETCH by this session.
    results: >-
      NEAREST NEIGHBOURS, and how each differs. (a) IDEA-20260809-1d1734
      (same RQ): "Pairing-friendly primes are polynomials in a seed -- quantify
      what that special form gives the sieve, and check whether the deployed
      estimate uses the special variant at all." THIS IS THE CLOSEST RECORD IN
      THE PROGRAM AND THE OVERLAP IS SUBSTANTIAL. It takes the CANONICAL family
      polynomial as given and quantifies its advantage. This record optimises
      OVER the fiber of representations, may find a witness better than the
      canonical one, and adds the two in-family null populations that place the
      deployed instance within its own family. If a reviewer judges that
      difference insufficient, the honest resolution is to treat this record as
      a NULL-OBJECT EXTENSION of 1d1734 rather than an independent idea, and it
      should be merged into it rather than run separately. That judgment is the
      reviewer's, and this record states the case for both readings.
      (b) IDEA-20260816-dd425d (RQ-SNFS lane): builds the power-lattice
      shortest-vector detector over the hypothesis class C(d,H) with a
      Gaussian-heuristic null and an ROC evaluation against random primes of
      identical bit length. That is the INSTRUMENT this record uses; this
      record contributes the target and the family-conditioned null, not the
      detector. Dependency, not duplication -- and it must be cited as a
      dependency in any experiment contract.
      (c) IDEA-20260816-9cfbac (RQ-SNFS lane): measures the exact norm-bit
      distribution over a fixed sieve box for special versus general
      polynomials. That is the correct implementation of this record's H3
      transfer step, and is named there rather than reinvented.
      (d) IDEA-20260818-17300c (this session's companion): measures the
      small-prime valuation bias of tower norms. Orthogonal axis: 17300c holds
      the representation fixed and measures arithmetic; this record varies the
      representation and measures size.
      NOT FOUND in the screened set: any enumeration of the representation
      fiber for a deployed pairing prime; any in-family (same bit length, same
      Hamming weight) null population for a specialness statistic; any
      percentile placement of a deployed seed within its own family.
    verdict: >-
      UNVERIFIED, with the overlap against IDEA-20260809-1d1734 flagged as the
      specific duplicate risk and with a stated fallback (merge as a
      null-object extension). No external search was run, so nothing is claimed
      about the literature -- and the external risk here is high and named:
      detection of special-form primes, and the trapdoored-prime line of work
      it belongs to, is an established external topic (RECALLED, see
      citations), and the observation that pairing seeds are chosen sparse is
      universally known to implementers. The reviewer's semantic screen must
      resolve this before any novelty language is used.

  citations:
