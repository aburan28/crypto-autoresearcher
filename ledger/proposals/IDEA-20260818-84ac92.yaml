    - ref: 'Gordon, "Discrete logarithms in GF(p) using the number field sieve" (SNFS); and the trapdoored-prime line, RECALLED as Fried, Gaudry, Heninger, Thome on a 1024-bit trapdoored DH prime'
      provenance: recalled
      claim: >-
        RECALLED ONLY, NOT SEARCHED, NOT READ: that primes of special form
