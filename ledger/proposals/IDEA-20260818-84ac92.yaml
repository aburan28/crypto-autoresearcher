      provenance: internal
      claim: >-
        Restates SNFS trapdoor detection as a decision problem over the class
        C(d,H) of primes admitting a degree-d integer polynomial with
        coefficients bounded by H, fixes the detector as the LLL-reduced first
        minimum of the rank-(d+1) power lattice L(p,m) of determinant p,
        against the Gaussian-heuristic expectation
        sqrt((d+1)/(2 pi e)) * p^{1/(d+1)}, and evaluates it by ROC against
        random primes of identical bit length. This record adopts that detector
        unchanged and supplies a different target and a different null.
      verified_by: 'this session read the title block and the first lines of the claim of ledger/proposals/IDEA-20260816-dd425d.yaml via grep on 2026-08-18; it did NOT read the full record, and the experiment contract must re-read it before reuse'
    - ref: IDEA-20260816-9cfbac
      provenance: internal
      claim: >-
        Asserts that the entire SNFS-versus-GNFS advantage at fixed size can be
        reported as a shift of the norm bit-length distribution over a fixed
        sieve box, computable exactly by integer arithmetic alone with no
        sieve, no relation collection and no linear algebra, with a
        same-degree large-coefficient polynomial as the null object. This is
        the method this record's heuristic H3 calls for at its transfer step.
      verified_by: 'this session read the title block and the first lines of the claim of ledger/proposals/IDEA-20260816-9cfbac.yaml via grep on 2026-08-18; it did NOT read the full record'
    - ref: IDEA-20260809-1d1734
