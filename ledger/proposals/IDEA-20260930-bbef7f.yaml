  assumptions:
  - The curve is the ordinary binary Koblitz model with the same coefficient pattern at both degrees;
    n=11 and n=23 are prime, so there is no proper intermediate subfield over F_2. That fact is used only
    to avoid a subfield confounder. It is not a security claim.
  - A field element x lies in the coset C = c*mu_d if and only if x^{(2^n-1)/d} equals the same power
    of c. Points with x=0 and the point at infinity are excluded from C and enumerated as exceptional
    cases, not dropped silently.
  - Both y-lifts, when the Artin-Schreier equation is solvable, are charged. A coset element that does
    not lift is not a base point.
  - Subgroup membership is a multiplication by the subgroup order, computed by enumerating the curve before
    any decomposition. The order is an output of the test, not an input quoted from memory for n=23.
  - F2 is a named component (the three-point relation). Families F1 and F3-F7 are not the lens. The factor
    base is implicit-membership of a multiplicative coset. If a reviewer treats the degree-( (2^n-1)/d
    ) membership polynomial as a bounded-degree algebraic base already scoped out by KN-OPEN-020, the
    idea stops at the join-price measurement and does not claim an escape.
  - No summation polynomial is built. No SAT-versus-F4 comparison is made. No first-fall-degree is computed.
  proof_search_map:
    bottleneck: The charged field-multiplication count of finding three subgroup points with x-coordinates
      in a frozen multiplicative coset that sum to a public target. The split replaces per-pair coset-membership
      exponentiation by a slope-keyed join. Removing the join's collision replay, or the one-sided exponentiation,
      is the step whose cost decides the comparison.
    baseline_embedding:
      parameter_slice: 'Same curve, same coset, same targets, same sign and exceptional-point rules. The
        baseline is the one-sided enumerator: all swap-orbits of pairs, third point recovered as Q-(P+S),
        membership by one exponentiation plus half-trace plus subgroup check. The n=11 order-23 coset
        is the fully enumerable slice.'
      reproduction_check: On every target in the n=11 order-23 cell, the split and the one-sided enumerator
        must return the same set of verified triples. Any symmetric difference fails the embedding before
        costs are compared.
    observation_collision:
      observable: The chord slope lambda, together with the verified triple recovered after replay.
      distinct_preimage_search: Search for two distinct swap-orbits with the same lambda whose sums differ.
        That collision is expected; the replay must reject the false join. Also search for one lambda
        that comes from both a true relation and a non-relation. If replay accepts a non-relation, the
        observable does not carry correctness.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: Replace the per-pair membership exponentiation by a table keyed on chord slope,
        with swap canonicalisation.
      predicted_gain: Fewer field multiplications than the one-sided enumerator by a factor at least 1.25
        on the pre-registered cells, at equal verified yield.
    - transform: observable_fiber
      proposed_object: 'The fiber of one slope: all swap-orbits that produce it.'
      predicted_gain: The fiber size is the branching the join pays for. A large fiber is the mechanism
        of the negative outcome.
    quantifier_order: 'For all frozen (curve, coset C, target list) chosen before any cost is read: there
      exist the two procedures (split and one-sided). Compare them on every listed target. The cost ratio
      is not allowed to choose the coset or the target list.'
    method_ceiling:
      strongest_certifiable_claim: A finite constant-factor reduction in charged field multiplications
        of exact three-point decomposition on these two fields and these cosets, with identical verified
        triples. No group-order exponent below 1/2, and no transfer to n=131.
      nearby_object_control: The same split on a random subset of subgroup points of equal cardinality,
        with membership tested by a hash of an explicit list (O(1) expected) instead of an exponentiation.
        The hoped-for saving should shrink, because the one-sided membership test is then cheaper than
        a field exponentiation. If the coset still wins by the same factor, the saving is not coming from
        implicit membership.
    proof_obligations:
    - claim: Coset membership is exactly the power test x^{(2^n-1)/d} = c^{(2^n-1)/d}.
      responsibility: correctness
    - claim: Every triple accepted by either procedure satisfies P+S+R = Q in the subgroup, including
        both y-lifts.
      responsibility: correctness
    - claim: Charged multiplication counts include lifts, inversions, exponentiations, join replays, and
        exceptional branches.
      responsibility: runtime
    - claim: The left table stores one record per swap-orbit.
      responsibility: memory
    - claim: The procedures agree on the verified relation set before their costs are compared.
      responsibility: baseline
    not_applicable_reason: The proof_search_map applies in full. This field records that no block was
      skipped. The claim is a finite cost comparison, not a theorem that the ratio holds for all n.
  predictions:
  - metric: oneside_field_multiplications_over_split_field_multiplications
    direction: higher
    minimum_effect: 1.25
  - metric: symmetric_difference_of_verified_triple_sets
    direction: lower
    minimum_effect: 0
  - metric: slope_fiber_L_bits
    direction: higher
    minimum_effect: 0.5
  minimal_test:
    design: Freeze the Koblitz coefficient pattern, the polynomial basis, the cosets (n=11, d=23 and d=89;
      n=23, d=47), and a public target list equal to every subgroup point for n=11 and a pre-registered
      64-target subset for n=23 chosen by a fixed seed before any run. Build each base by the power test,
      half-trace, and subgroup check, charging those operations. Run the slope-join and the one-sided
      enumerator on every target. Count field multiplications, squarings, and inversions with a declared
      inversion weight equal to the measured schoolbook inversion cost on that field, recorded before
      the comparison. Replay every accepted triple by an independent group-law implementation. Do not
      use a summation polynomial and do not use a SAT solver.
    controls:
    - 'Identity: the curve group law, both procedures, same base.'
    - 'Random-label: replace stored slopes by independent uniform field elements of the same bit width
      and rerun the join. The verified-yield must collapse; if it does not, the replay is not checking
      the slope.'
    - 'Relabelled Z/rZ: transport the same base cardinality through a fixed random bijection to Z/rZ,
      replace chord slope by (label(P)-label(Q)) mod r, and run both procedures. This is the generic-group
      meter for L and b.'
    - 'Explicit-list membership control: a random subset of equal size with hash membership, as the nearby-object
      control.'
    - 'Exceptional control: targets and base points at x=0 and infinity, enumerated apart from the coset.'
    required_metrics:
    - field multiplications, squarings, inversions, and the inversion weight, per procedure, per coset
    - left-table records, right-probe count, join hits, false hits rejected by replay
    - verified triple-set digest of each procedure
    - L and b of the slope map on identity, random-label, and relabelled Z/rZ
    - base size after lift and subgroup filter, and the number of coset elements that did not lift
    - peak number of stored slope records
  falsification_conditions:
  - 'On the n=11 order-23 cell or the n=11 order-89 cell, oneside_field_multiplications / split_field_multiplications
    is at most 1 after the pre-registered inversion weight is applied. That is the negative outcome: the
    join costs at least as much as enumerating one side.'
  - The two procedures return different verified triple sets on any target that both finish.
  - A random-label slope table still reproduces the curve's verified triples. The replay is then not a
    function of the slope, and the run is invalid rather than a saving.
  - L = 0 on the order-89 cell. The slope map is then injective on swap-orbits there, the projection is
    not lossy, and the object fails the lossy-projection test on that cell.
  confounders:
  - An inversion weight chosen after seeing the ratio can manufacture either outcome. The weight is measured
    on a separate schoolbook inversion timing or operation count before the two procedures run.
  - Counting only the join and not the coset build hides the half-trace. Both procedures include the build
    or both exclude it; the choice is frozen and applied to both.
  - Sign handling can double one side only. Both procedures enumerate both y-lifts under the same rule.
  - n=23 targets are a subset. A ratio on 64 targets is not a ratio on the subgroup. The n=11 cells are
    exhaustive and are the decision cells.
  interpretation_limits:
  - 'KN-OPEN-020 class: implicit-membership (power test). The point set is not an F_2-subspace. No claim
    is made that this escapes the universal bounded-degree statement; the degree of the membership polynomial
    is (2^n-1)/d, and the idea stops at the finite join price if that degree is judged in-scope for the
    scoped-out class.'
  - Time exponent versus Pollard rho is unchanged at 1/2. A stage ratio at |C| <= 89 does not transfer
    to cryptographic n.
  - Same verified triples means the same useful relation yield on this predicate. It does not say the
    coset is a good index-calculus base.
  - No proper intermediate subfield is used. The result does not apply to a composite degree whose coset
    is a subfield.
  heuristic_assumptions:
  - id: H1
    statement: 'For the frozen cosets above, the map from swap-orbits of liftable pairs to chord slopes
      is equidistributed in F_{2^n} in the following quantitative sense: the total variation between the
      empirical slope histogram and the uniform distribution on F_{2^n} is at most 0.05, and the maximum
      bin count is at most the classical occupancy maximum for M uniform throws into q = 2^n bins (the
      max-load bound of the balls-and-bins model). This is a heuristic. It is not a theorem about chord
      slopes.'
    rigorous_support: 'For a uniformly random function from a set of size M to a set of size q, occupancy
      is the classical balls-and-bins law (Feller): bin counts are dependent Poisson in the sparse limit,
      and the empty-bin probability is (1-1/q)^M. That theorem applies to the random-label control exactly.
      It does not apply to chord slopes. The heuristic says the slope map imitates that random function
      closely enough that the join''s collision count stays within a factor 2 of M/q.'
    validation_plan: 'Sample: every swap-orbit of liftable pairs on the n=11 cosets d=23 and d=89 (exhaustive,
      M is the whole domain) and every swap-orbit on the n=23 order-47 coset. Comparison distribution:
      uniform on F_{2^n}, and the same histogram for the relabelled Z/rZ slope substitute. Tail check:
      max bin divided by the mean bin, against the balls-and-bins max load at that M and q; also the emptiest
      occupied bin. Tested parameters: n=11, q=2048, d in {23,89}; n=23, q=2^23, d=47. Transfer assumptions:
      none to n=131, none to a different curve model, none from the random-label control to the curve
      beyond the comparison itself. A total variation above 0.05 falsifies H1 and does not by itself falsify
      the cost claim; the cost claim has its own falsifier.'
  target_complexity:
    time_exponent: Unchanged. Pollard rho is Theta(r^{1/2}) group operations on a prime-order subgroup
      of order r. This stage is Theta(|C|^2) additions plus one exponentiation per pair on the one-sided
      side. No exponent below 1/2 is claimed, conditional or otherwise.
    memory_exponent: The split stores Theta(|C|^2) slope records. Pollard rho with distinguished points
      stores polylogarithmic memory. The split is worse in memory by that quadratic table. The one-sided
      enumerator stores Theta(|C|) points.
    best_known: Pollard rho, time exponent 1/2, binary-curve normalized cost S about 1.25 as named in
      the task brief. This session did not re-derive S. KR-IC-9e610d, read this session, records no consensus
      that binary ECDLP is subexponential and no practical index-calculus impact at deployed sizes.
    hidden_overhead: No o(1) term is claimed. The finite overhead that must be charged is the half-trace
      lift, the subgroup multiplication, the inversion inside each slope, the exponentiation inside one-sided
      membership, false-join replays, and exceptional points. None of these is hidden inside an asymptotic.
    tradeoff_note: 'The split trades memory Theta(|C|^2) for fewer membership exponentiations. It does
      not sit on a van Oorschot-Wiener curve against rho, because it does not solve the ECDLP. Parallelism:
      the left table and the right probes partition by coset element. The comparison is serial field-multiplication
      counts.'
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
  dominated_by: Pollard rho, time exponent 1/2 and distinguished-point memory polylogarithmic in r. Among
    the 24 KR-IC rows at commit 3bc2cd74f42074d37ed7c4e47da76ad28bdb63a2, none supplies a prime-degree
    binary index-calculus exponent below 1/2 that this idea improves on. KR-IC-889857 is disputed and
    is not a dominating algorithm. The stage baseline that dominates the split on the nearby explicit-list
    control is one-sided enumeration with O(1) membership.
  sota_delta: 'Time exponent versus rho: 1/2 versus 1/2, delta 0. Memory exponent versus distinguished-point
    rho: the split is Theta(|C|^2) records against polylog(r), so the memory delta is against this idea.
    No measured operation counts exist yet; the predicted stage ratio is at least 1.25 and is not a rho
    speedup.'
