idea:
  id: IDEA-20260930-bbef7f
  question_id: RQ-KIC-7502b9
  added: '2026-09-30'
  status: proposed
  approved_by: null
  title: Slope-join versus one-sided coset membership for an exact three-point sum
  class: algorithm
  claim: On the prime-degree binary Koblitz curves at n=11 and n=23, with the factor base equal to the
    subgroup points whose x-coordinate lies in one frozen multiplicative coset (implicit membership, not
    an F_2-subspace), splitting the exact three-point group-law search into a left table of chord slopes
    of pairs and a right probe of residual slopes costs at least 1.25 times fewer charged field multiplications
    than enumerating the pairs alone and testing the third point by coset membership, while the verified
    relation sets stay identical. Representation class R1 (the x-coordinate as a multiplicative coset
    label). The attack stage whose charged cost is predicted to change is relation decomposition. The
    group-order time exponent stays 1/2, the same as Pollard rho; this is a constant-factor stage comparison,
    not an exponent claim. A measured ratio at most 1 means the join costs at least as much as enumerating
    one side, and that outcome falsifies the predicted saving.
  mechanism: 'OBJECT FRAME. Representation: R1, each base x-coordinate is a field element of a fixed multiplicative
    coset C = c * mu_d inside F_{2^n}^*, with d a proper divisor of 2^n-1 (n=11 gives d in {23,89}; n=23
    gives the order-47 subgroup of F_{2^23}^*). This is not the polynomial-basis subspace span{1,z,...,z^{l-1}}.
    Operation set Sigma: unordered swap of the two legs of a pair. Sigma is not the translation action
    of the prime-order subgroup, and it does not contain full translation. Trichotomy: branching. Reason:
    the chord slope lambda(P,Q)=(y_P+y_Q)/(x_P+x_Q) is invariant under the swap, but distinct swap-orbits
    can share one slope, and matching that slope to the residual slope of (target, third point) is a collision
    event rather than a block system of a group acting on the prime-order subgroup.


    LOSSY-PROJECTION TEST, against Sigma = {swap}. The tracked object is lambda, not the point P+Q. Discarded:
    the intercept of the chord and the sum point (x,y). The discard is Sigma-compatible because swapping
    the legs does not change lambda, so the slope is constant on swap-orbits. It is lossy because lambda
    does not determine the pair: the expected number of swap-orbits per slope is about M/|F| for M pairs,
    which is greater than 1 on the order-89 cell (field size 2^11). A projection that kept (x,y) of the
    sum would be injective on that sum and is not the object used. The x-only Kummer coordinate of the
    sum is not the stored key.


    NAMED BOTTLENECK, not a summation polynomial. The bottleneck is the charged enumeration of pairs from
    the coset whose chord slope equals the residual slope of the target against a third coset point. Left
    half: every ordered pair of distinct liftable coset points, reduced by the swap, compute lambda, store
    lambda -> witness. Price: one inversion and a constant number of multiplications per pair, times the
    number of pairs, plus the half-trace lifts charged when the coset is built. Right half: every liftable
    coset point R, compute the slope of the chord from the target Q to R. Price: one inversion per R.
    Join: probe the left table and replay Q = P+S+R in the group for every hit, including sign choices
    already stored. Price: one group addition per hit, plus canonicalisation of the swap (pick the lexicographically
    smaller x-leg; cost O(1) comparisons). One-sided enumerator, the negative control: enumerate the same
    pairs, set the candidate third point to Q-(P+S), and test implicit membership of its x-coordinate
    by the single exponentiation x^{(2^n-1)/d} = c^{(2^n-1)/d}, then the half-trace lift and the subgroup
    check. No right table and no hash join. The predicted saving exists only if the exponentiations the
    join avoids cost more than the right half plus the collision replays. If they do not, the join is
    the more expensive side and the claim is false.


    What was avoided. Not IDEA-20260926-197ecf (tau-Horner chains). Not a Frobenius-closed factor base
    (KR-IC-b0fcda). Not summation polynomials as the method (KR-IC-5a43e5): the predicate is the group
    law. Not SAT versus F4 (KR-IC-5765d2). Not a first-fall-degree exponent (KR-IC-889857). Not V = span{1,z,...,z^{l-1}}
    (KR-IC-73db3f). Not the normal-basis Hamming-weight base. Not the explicit-list orbit-canonical pair
    table of H-KIC-c9c760, and not the affine flats of IDEA-20260921-f4a758 or H-KIC-c72d8b: those are
    F_2-affine, and this base is multiplicative. Not the prime-field coset/Dickson character-sum measurement
    of IDEA-20260928-4e2be7. F2 (factor-base decomposition) is a named component: it supplies the three-point
    relation and nothing else. Added: the priced slope join against one-sided implicit membership.


    OPEN NUMBER. Branching meter of IDEA-20260802-002, measured on the slope map. L = log2 of the mean
    number of swap-orbits per occupied slope. b = the mean, over slope pairs (s,t), of the number of distinct
    slopes of A+B as A runs over the fiber of s and B over the fiber of t, using the curve law (identity),
    a random relabeling of slope values (random-label), and addition in a relabelled Z/rZ with the same
    pair set (generic-group control). Canonicalisation of one swap-orbit is the O(1) lexicographic choice
    above and is charged inside the join.'
