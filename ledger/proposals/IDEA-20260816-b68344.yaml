    results: The 14 'circulant' matches are dominated by ISD-side and lattice-side records; the HQC
      ones are IDEA-20260805-baa4da and IDEA-20260808-a3bcf0, both about memory-charged ISD cost.
      The four 'Toeplitz' matches are unrelated to HQC. Of the 20 'exchangeab' matches, IDEA-20260808-cbb848
      is the HQC one and it uses exchangeability as a hypothesis it is trying to avoid assuming, in
      the service of an analytic sandwich on A17. H-HQC-18d1b4's own statement is explicit that its
      estimator mubar_k is defined 'with no independence and no exchangeability assumption' by averaging
      over all k-subsets - which is precisely the averaging that erases the separation profile this
      proposal wants. EV-HQC-3a0372 and EV-HQC-469c08 record a structural invariant on F[:, 0:n_e-1],
      showing per-block arrays exist in committed artefacts, but no committed record reports a per-block
      marginal vector or a separation profile.
    verdict: 'UNVERIFIED. No claim about published literature is made or possible here. Claimed NEW
      relative to this repository: the exact circulancy derivation as a stated zero-compute result,
      and the separation profile of pairwise block failures as a measurable object that the committed
      averaged estimator cannot express. ASSEMBLED FROM KNOWN PARTS: shift-invariance of fixed-weight
      laws is elementary; the exhaustive-at-n=7 verification technique is EXP-HQC-bd30c0''s; the block-failure
      indicators, the truncation and the pipeline are H-HQC-18d1b4''s; and the observation that averaging
      over subsets loses structure is a direct reading of that hypothesis''s own estimator definition,
      not an insight of mine.'
  object_first_candidate:
    tracked_object: The coordinate covariance function rho(d) = Cov(e''_i, e''_{i+d}) of the untruncated
      error, followed through the truncation to N coordinates and into the block-level pairwise joint
      failure matrix. The object is a function on Z_n, not a matrix, precisely because shift-invariance
      collapses the matrix onto it.
    lossiness: 'LOSSY, and by an exactly countable amount: the full joint law of e'''' over 2^n states
      is projected onto its second-order structure, and shift-invariance then collapses that from
      n(n-1)/2 numbers to floor(n/2) + 1. Discarded: all third and higher joint cumulants, and all
      information distinguishing coordinates that a shift relates. The discard is compatible with
      the target operation in a precise sense - the shift is a SYMMETRY of the sampling law and of
      the ring product, so quotienting by it loses nothing the operation could have used before truncation.
      Truncation breaks the symmetry, and that break is exactly where the block-level structure becomes
      observable: the retained object is Toeplitz rather than circulant, and the difference between
      those two is the entire empirical content of the proposal.'
    propagation: 'One step of the target operation is one inner-block decode acting on a length-n_2
      window of e-tilde. Under stationarity every window is a translate of every other, so each decode
      sees the same marginal law and the pair of decodes at blocks j and j'' sees a joint law depending
      only on the offset (j'' - j) * n_2. Propagation is therefore deterministic at the level of the
      covariance FUNCTION: the block-pair law is a fixed functional of rho restricted to the offsets
      that block separation realises. What is not deterministic is the passage from covariance to
      failure probability, which involves the decoder''s nonlinearity - and that is why the separation
      profile is measured rather than computed.'
    survival_score: Exactly two steps, and the second is the one at risk. rho survives truncation
      as a Toeplitz restriction (deterministic, exact), and survives block thresholding only insofar
      as the decoder's nonlinearity preserves separation dependence. The concrete survival score is
      the measured amplitude of the separation profile - max over d of |P[F_j F_{j+d}] - P[F_j] P[F_{j+d}]|
      as a function of d - divided by its Monte-Carlo null amplitude. A ratio near 1 means the object
      dissolves at the decoder and blocks are effectively exchangeable, which is a clean bound; a
      ratio well above 1 means it survives and the profile's shape is the deliverable.
  null_object_control: 'The null object is a matched exchangeable surrogate: block-failure vectors
    generated with the SAME per-block marginal and the SAME overall pairwise joint rate but with the
    pair identity randomised, so that by construction the separation profile is flat while every quantity
    the committed estimator reports is unchanged. It is generated and analysed in the same invocation,
    through the identical profile estimator. FOR THE SIGNAL ARM TO MEAN ANYTHING THE NULL MUST SHOW:
    (i) a separation profile flat to within its own Monte-Carlo error - a null arm showing structure
    means the profile estimator manufactures it and no signal-arm reading is admissible; (ii) identical
    values of mubar_2 and log2 A-hat_2 to the signal arm, which is what makes the surrogate matched
    and demonstrates that the committed estimator genuinely cannot see the difference; and (iii) in
    the exhaustive STAGE 2 arm, the circulancy check must PASS on the true law and FAIL on a deliberately
    shift-broken variant, establishing that the check has power.'
  discriminated_from:
  - H-HQC-18d1b4 and EXP-HQC-982268 define mubar_k by averaging over all k-subsets of blocks, which
    is deliberately invariant to which blocks are involved. That estimator cannot express the separation
    profile even in principle, so this is not a re-analysis of the same quantity in new notation -
    it is a different functional of the same joint law, and the matched exchangeable surrogate demonstrates
    the difference by construction.
  - IDEA-20260808-cbb848 seeks an analytic sandwich on A17 via negative association, treating exchangeability
    as an assumption to avoid. This derives stationarity as an exact consequence rather than assuming
    or avoiding exchangeability, and then measures the gap between the two.
  - IDEA-20260805-db5afa derives an exact parity identity from the ring's evaluation character - a
    first-order, F_2-valued invariant. This derives a second-order, integer-valued structural constraint;
    the two are independent and both are zero-compute.
  - EV-HQC-3a0372's F[:, 0:n_e-1] structural invariant is a validity gate on an injection wrapper
    - a check that certain array columns are untouched. It is not a measurement of block marginals
    and carries no separation information.
  - 'A generic ''the errors are correlated'' claim would be unfalsifiable. The separation profile
    is falsifiable in a specific way: stationarity forces the profile to be a function of one variable,
    so a measured dependence on (j, j'') beyond |j - j''| falsifies the derivation itself, which is
    a stronger test than testing the model.'
  assumptions:
  - The five inputs are mutually independent and each is drawn from a shift-invariant law; this is
    what the derivation needs and it is exactly assumption A1/A22 as recorded in H-HQC-18d1b4, so
    the derivation inherits that scope and no more.
  - n is prime with ord_n(2) = n-1, checked at run time; the derivation does not need primality but
    the rest of the pipeline does.
  - The n_e blocks occupy consecutive equal-length intervals in [0, N); if the deployed layout interleaves
    instead, the separation variable changes and the derivation must be restated - this is flagged
    as a derivation gap rather than assumed away.
  - Exhaustive enumeration at n = 7 and n = 11 with small weights is affordable in exact rational
    arithmetic.
  - No conclusion transfers to deployed parameters; the derivation itself is scale-free but says nothing
    about magnitudes.
  predictions:
  - metric: maximum deviation from circulancy of the exactly enumerated covariance matrix at n = 7
    direction: lower
    minimum_effect: 0.0
  - metric: spread of the per-block marginal failure rates across j, relative to their common Monte-Carlo
      error
    direction: lower
    minimum_effect: 1.0
  - metric: residual of the pairwise joint matrix after projection onto the separation profile, versus
      the matched exchangeable null
    direction: different
    minimum_effect: 0.0
  - metric: amplitude of the separation profile relative to its null amplitude
    direction: higher
    minimum_effect: 'no pre-commitment to a magnitude, with reason: the passage from covariance to
      failure probability runs through the decoder nonlinearity, whose amplification factor this program
      has never measured; inventing a threshold would be fabricating a prior.'
  minimal_test:
    design: 'STAGE 2 alone, at n = 7, discriminates the derivation for free and is the cheapest useful
      test in this batch. Enumerate the entire input space at n = 7 with weights w_x = w_y = w_r =
      w_e = 2, compute the exact joint law of e'''' by summation in exact rational arithmetic, form
      the covariance matrix, and check circulancy element by element. It must be exactly circulant;
      any deviation falsifies the derivation immediately and cheaply. Then run the same code on a
      deliberately shift-broken variant - one input drawn from a support-restricted law - and confirm
      the check FAILS there, which establishes that the check has power rather than being trivially
      satisfiable. Cost: seconds, exact arithmetic, no sampling and no statistics. Everything downstream
      is worth doing only if this passes.'
    controls:
    - Matched exchangeable surrogate with identical marginal and identical overall pairwise rate,
      analysed by the identical profile estimator in the same invocation.
    - Shift-broken variant at n = 7 on which the circulancy check must fail, establishing the check's
      power.
    - Exact rational arithmetic in the exhaustive arm, so the circulancy verdict is not a floating-point
      judgement.
    - Re-read of committed F arrays for the marginal-equality check before generating anything new.
    - 'Per-block marginal equality as a fail-closed gate on the sampled arms: unequal marginals mean
      the layout assumption is wrong and the separation reading is void.'
    required_metrics:
    - maximum element-wise deviation from circulancy in the exhaustive arm, in exact rationals
    - per-block marginal failure vector and its spread relative to Monte-Carlo error
    - full pairwise joint matrix P[F_j = F_j' = 1]
    - separation profile derived from that matrix, with confidence intervals per separation value
    - residual after projection onto the profile, versus the matched exchangeable null
    - mubar_2 and log2 A-hat_2 in both signal and surrogate arms, demonstrating the surrogate is matched
  falsification_conditions:
  - 'The exhaustive covariance matrix is not exactly circulant: the derivation is wrong, cheaply and
    decisively, and the proposal closes there.'
  - 'Per-block marginals differ beyond Monte-Carlo error: the block-layout assumption is wrong and
    the separation variable is mis-defined.'
  - 'The separation profile is flat within its null: blocks are effectively exchangeable at the tested
    parameters, the averaging the committed estimator performs is licensed, and the measured amplitude
    bound is the recorded obstruction.'
  - 'The matched exchangeable surrogate shows a non-flat profile: the profile estimator manufactures
    structure and the instrument is void.'
  - 'The pairwise matrix residual is large after projection onto separation: the joint law depends
    on (j, j'') beyond |j - j''|, which contradicts the derivation and points to a broken symmetry
    somewhere in the pipeline - a defect finding rather than a structural one.'
  confounders:
  - 'Block-layout interleaving: if blocks are not consecutive intervals, the separation variable is
    wrong and a genuine structure would appear as noise.'
  - Edge effects at the truncation boundary, where the first and last blocks are adjacent in the ring
    but far apart in the window - which is precisely where a circulant and its Toeplitz restriction
    differ most.
  - Monte-Carlo error growing with separation value because few block pairs realise the largest separations.
  - The decoder nonlinearity attenuating a real covariance structure below detectability, which would
    look identical to its absence.
  - Shared seeds between signal and surrogate arms shrinking the apparent variance of their difference.
  interpretation_limits:
  - The circulancy derivation is exact but is a statement about the untruncated error's second moments
    only; it implies nothing about higher cumulants and nothing about magnitudes.
  - A measured separation profile is a structural statement about e-tilde at the tested parameters
    and is not an attack or a security consequence.
  - A flat profile licenses the committed estimator's averaging at the tested parameters only, not
    at deployed ones.
  - Nothing here evaluates the correctness of the specification's analytic DFR value.
  target_complexity:
    time_exponent: No attack exponent is claimed. STAGE 2 costs O(C(n, w)^4 * n) in the worst case
      and is run only at n = 7 and n = 11 with tiny weights; STAGE 3 costs O(T * n_e * 2^m * m) plus
      O(T * n_e^2) for the pairwise matrix.
    memory_exponent: No attack memory exponent is claimed. The pairwise matrix is n_e^2 counters;
      the exhaustive arm holds an n-by-n rational covariance matrix.
    best_known: The incumbent is EV-HQC-b71230's mubar_k table, which is a strictly coarser functional
      of the same joint law and dominates this proposal on trial count and certification depth while
      being structurally unable to answer the separation question. There is no incumbent for the derivation,
      which is new to this repository.
    hidden_overhead: 'The hidden cost sits in the block-layout question: if the deployed layout is
      not consecutive intervals, the entire separation variable must be redefined and the exhaustive
      arm''s cheapness does not carry over. A second hidden cost is that the largest separation values
      are realised by few block pairs, so the profile''s tail is noisy for combinatorial rather than
      statistical reasons, and reporting it honestly requires per-separation-value pair counts rather
      than a single error bar.'
  dominated_by: n/a (no result claimed). No attack cost triple exists, so no frontier row applies
    and 'null' would be a fabrication. On the measurement axis EV-HQC-b71230 dominates on scale and
    certification and does not dominate on the object, since its estimator averages the separation
    structure away by construction - a point demonstrated in-run by the matched exchangeable surrogate
    rather than argued.
  sota_delta: 'no attack; conceptual/measurement contribution only. Quantitatively: the repository
    holds mubar_k for k = 2..18 and holds no per-block marginal vector and no separation profile at
    all; this run produces both, plus an exact circulancy verdict that currently has no counterpart.
    The delta is therefore the addition of a finer functional, not an improvement of an existing number.'
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'By part. (i) That the covariance is exactly circulant as derived: ~0.95
    - the argument is short and each step is elementary, and the exhaustive check at n = 7 either
    confirms it in seconds or kills it. (ii) That per-block marginals are measurably equal: ~0.9,
    conditional on the consecutive-interval layout. (iii) That the layout is consecutive intervals
    rather than interleaved: ~0.7, and this is the assumption I am least sure of. (iv) That the separation
    profile is measurably non-flat at n = 227 and T = 10^6: ~0.3 - the decoder nonlinearity is a strong
    attenuator and I expect a bound rather than a shape. (v) That the run produces a usable licensing
    bound on exchangeability either way: ~0.9.'
