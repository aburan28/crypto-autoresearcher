idea:
  id: IDEA-20260816-b68344
  question_id: RQ-HQC-001
  added: '2026-08-16'
  title: HQC truncates its length-n error to the first N equals n_e times n_2 coordinates before decoding;
    take the coordinate covariance of the untruncated error as the tracked object, derive at zero
    compute that it is exactly circulant, and test the forced consequence that pairwise block-failure
    probabilities depend only on block separation while per-block marginals are exactly equal
  class: theory
  claim: '(A) THE ZERO-COMPUTE DERIVATION. Uniform-fixed-weight laws on Z_n are invariant under the
    cyclic shift; ring multiplication commutes with the shift; addition preserves it. Therefore the
    joint law of e'''' = x*r_2 + r_1*y + e is EXACTLY shift-invariant, with no approximation and no
    heuristic. It follows immediately that Cov(e''''_i, e''''_j) = rho(j - i mod n) for a single function
    rho, i.e. the covariance matrix is exactly circulant and is determined by floor(n/2) + 1 numbers
    rather than by n^2. This costs nothing and is checkable by enumeration at small n. (B) THE FORCED
    CONSEQUENCE AT THE BLOCK LEVEL. Truncation to the first N coordinates restricts a circulant to
    a principal submatrix, which is Toeplitz. The n_e inner blocks occupy consecutive equal-length
    index intervals inside [0, N), so each block is a translate of every other within the retained
    window. Two consequences follow with no further assumption: (i) the per-block marginal failure
    probabilities P[F_j = 1] are EXACTLY equal across j; (ii) the pairwise joint probabilities P[F_j
    = F_j'' = 1] depend on (j, j'') only through |j - j''|. Statement (ii) is a strong, cheap, falsifiable
    law and it is not implied by the analytic model, which asserts the stronger and different statement
    that the joint factorises. (C) WHY THIS IS WORTH MEASURING GIVEN WHAT IS ALREADY MEASURED. EV-HQC-b71230
    measured the joint moments mubar_k, which average over all k-subsets and therefore DESTROY the
    separation structure by construction. The separation profile is a strictly finer object that the
    committed data was not designed to expose, and it distinguishes ''blocks are exchangeable'' from
    ''blocks are stationary but not exchangeable'' - two hypotheses the averaged moments cannot separate.
    (D) WHAT IS NOT CLAIMED. No attack, no break, no security consequence, no claim that rho is large,
    and no claim that any separation dependence moves the decryption failure rate at any parameter
    set. A flat separation profile - exchangeability - is a perfectly possible and useful outcome
    that would license the averaging the committed estimator performs. No attack, break, speedup or
    security consequence is claimed here or would follow from a run. No statement is made about what
    the published literature does or does not contain; this environment cannot reach external literature.
    No direction is declared impossible.'
  mechanism: 'STAGE 1, symbolic, zero compute: write the shift-invariance argument formally, including
    the step that needs care - that the five inputs are independent AND each individually shift-invariant,
    so the tuple is invariant under the SIMULTANEOUS shift, which is what makes the product shift-equivariant.
    Record the derivation as the artefact, since it is the part that either holds exactly or does
    not hold at all. STAGE 2, exhaustive verification at tiny n: at n = 7 and n = 11 with small weights,
    enumerate the full input space, compute the exact covariance matrix of e'''' by summation over
    all inputs, and verify circulancy to machine exactness in rational arithmetic. This converts the
    derivation from an argument into a checked identity, using the same exhaustive technique EXP-HQC-bd30c0
    applies at n = 7. STAGE 3, block-level measurement: at n = 227 and n = 587, measure the per-block
    marginal vector and the full pairwise joint matrix P[F_j = F_j'' = 1], then collapse the matrix
    onto its separation profile and test the residual - the part of the matrix not explained by separation
    - against its Monte-Carlo null. STAGE 4, re-read committed data: the F arrays already committed
    under EV-HQC-3a0372 and EV-HQC-469c08 include a per-block structure and may already permit the
    marginal-equality check without generating anything, which would be the cheapest possible confirmation
    and is attempted first. Refutation: a measured separation dependence that survives its null is
    a structural fact about e-tilde; a flat profile bounds it and licenses exchangeability. Both are
    recorded with numbers.'
  novelty_status: unverified
