idea:
  id: IDEA-20261007-c5a097
  title: "Unoriented torsion-transport kernel interface"
  area: SSI
  question_ids: [RQ-SSI-1946c9]
  goal_ids: [GOAL-SSI-2fa82a]
  status: proposed
  claim: >-
    Test whether a public pointed torsion-transport transcript of a smooth
    cyclic isogeny admits inversion from every complete evaluable End(E)
    basis; this packet currently records a typed obstruction at that inverse.
  mechanism: >-
    Publicly sample a kernel generator R and N-torsion basis P,Q from bare E,
    and publish E/<R> with phi_R(P),phi_R(Q). Attempt to compile an arbitrary
    complete ring basis to a torsion-attack-suitable endomorphism theta.
  predictions:
    - id: P1
      statement: "Sample and Eval type-check without a secret orientation or planted endomorphism word."
      metric: "all public inputs are derivable from E, parameters, and fresh coins"
    - id: P2
      statement: "The any-basis inverse fails unless a basis-invariant B-to-theta compiler is supplied."
      metric: "existence of explicit polynomial compiler and quantified success bound"
    - id: P3
      statement: "A successful inverse outline factors through theta unless theta reconstructs the full ring."
      metric: "non-factorization theorem or theta-to-complete-basis reconstruction theorem"
  minimal_test: "zero-run T1-T5 audit of public typing, every-basis inversion, smaller witnesses, reduction direction, and complete transcript view"
  controls:
    - "append R to the output as a publicly invertible known-false control"
    - "replace a full basis by theta to test exact factorization"
    - "reject P=O and lower-order P,Q as weakened-premise parser controls"
  falsification_conditions:
    - "Sample or Eval needs a hidden orientation, torsion basis, or connecting isogeny"
    - "no polynomial every-basis compiler B->theta is defined"
    - "inversion factors through theta without reconstruction of the complete ring"
    - "no attacker-to-complete-ring reduction can be stated in the correct direction"
  heuristic_assumptions:
    - name: any_basis_torsion_attack_compiler
      statement: "Every complete evaluable basis efficiently yields a theta satisfying the recovery theorem."
      validation_route: "derive a basis-invariant algorithm and prove degree, success, runtime, and basis-change bounds"
    - name: pointed_transport_kernel_binding
      statement: "The accepted transcript determines the kernel up to the declared unit-generator equivalence."
      validation_route: "prove a collision theorem on the exact n,N distribution"
  target_complexity:
    time_exponent: null
    memory_exponent: null
    comparator: "no supported baseline because Inv is undefined"
    note: "No asymptotic or concrete performance claim."
  cost:
    scientific_runs: 0
    estimated_followup: "one theorem-definition audit before any implementation"
  prior_art:
    checked_records: [KN-LIT-6572, KN-LIT-6628, KN-LIT-827, KN-LIT-1260]
