idea:
  id: IDEA-20260807-726e55
  question_id: RQ-SSI-001
  added: '2026-08-07'
  title: CSIDH / class-group-action quantum security has NO goal anywhere, its only lane was deferred
    as 'requires quantum resources' -- which is wrong, since a Kuperberg/collimation cost estimate
    is classical analysis -- and KN-OPEN-014's actual question has no hypothesis, no experiment
    and no evidence
  class: cost-model
  claim: 'RQ-SSI-001''s scope names ''class-group action / hidden-shift attacks (CSIDH)'' as an
    in-scope method and its motivation names KN-OPEN-014 as one of three open problems it addresses.
    EV-SSI-0eb0b1 screened five candidates across three lanes including a CSIDH-quantum lane (SSI-Q1/SSI-Q2).
    DEC-20260804-3677f1 and EV-SSI-8aaad0 record the batch outcome as ''orientation closed, transcript
    paused, quantum deferred (requires quantum resources)'' and name CSIDH quantum as one of two
    remaining viable directions. The tokens SSI-Q1/SSI-Q2 then appear in exactly three files repository-wide
    and never again after BATCH-045. No goal record in ledger/goals/ is titled for CSIDH. KN-OPEN-014''s
    actual question -- the concrete Kuperberg-sieve cost and hence the required CSIDH prime size
    -- has no hypothesis, no experiment and no evidence record. THE DEFERRAL RATIONALE IS ALSO
    WRONG: estimating a collimation-sieve cost is classical analysis and needs no quantum hardware.'
  mechanism: 'A single charged cost equation for the binary collimation sieve at CSIDH-512, -1024
    and -2048 with EVERY term instantiated: class-group-action oracle cost (the dominant and most
    often hand-waved term), query count, quantum memory, classical memory, retries, and error
    composition. Each row sourced or explicitly marked absent. The FC0 lane''s unfilled fields
    are imported as the initial GAP LIST rather than as a new formalism -- EV-SSI-039''s own boundaries
    state its single numeric output ''peak_byte_bound=24 ... is meaningless outside FC0-PEAKBYTE-TOY-PROTOCOL-R1'',
    and that the repeated QM-STOPPING FAIL retention since BATCH-023 is ''a search-process (fatigue)
    observation, not a mathematical impossibility or lane closure''.'
  novelty_screen:
    screened_on: '2026-08-07'
    corpus_paths_grepped:
    - ledger/goals
    - ledger/hypotheses
    - ledger/evidence
    grep_results:
    - No goal record is titled for CSIDH.
    - 'The ~30-batch FC0 lane (EV-SSI-014 through EV-SSI-042) is a resource-accounting FORMALISM,
      not a security estimate: EV-SSI-042 records its advance as a spec-internal set equality
      with sota_delta = 0. It has produced no query count, no gate count, and no bit of CSIDH
      security.'
    - IDEA-20260803-82b2b7 proposes terminating that lane and is still `proposed`.
    conclusion: KN-OPEN-014 is unaddressed as a security question.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS: the FC0 typed-resource-vector formalism as a
      framework to extend. This record imports its gaps and does not continue it.'
    tracked_object: The per-stage resource vector (oracle calls, gates, quantum memory, classical
      memory, success probability) of the collimation sieve.
    one_step_propagation_rule: Sieve stages compose by adding calls and taking the max of memory;
      retries multiply calls by the inverse success probability. Exact bookkeeping.
    newness_score: Nil as mathematics -- collimation costing is published. The content is that
      this program claims CSIDH in scope and has produced not one bit.
  lossy_projection_identifiability_audit:
    projection: the sieve -> a per-stage resource vector.
    what_is_discarded: All quantum-algorithmic detail.
    is_it_only_a_change_of_coordinates: 'NO, and openly: a WEAK object producing bit counts only.
      Class is cost-model for that reason.'
    mirror_failure_check: 'CHECKED. The failure would be an accounting that returns ''infeasible''
      or ''feasible'' regardless of input. It cannot: CSIDH-512 and CSIDH-2048 differ by orders
      of magnitude in the oracle term, so distinct values are forced.'
  null_object_control:
    primary_null: 'A HIDDEN-SHIFT INSTANCE WITH A FREE ORACLE: run the same accounting with the
      class-group-action oracle cost set to 1. The difference between that and the real accounting
      IS the oracle term, which is the term the literature most often omits. If the two agree,
      the accounting is not charging the oracle at all.'
    secondary_nulls:
    - 'FORCED VALUE: at CSIDH-512 the accounting must reproduce a figure in the range the published
      analyses span, or the discrepancy is the finding.'
    - 'SOURCE-BLOCKED DISCIPLINE: cells that cannot be sourced are marked, never estimated.'
  assumptions:
  - 'Primary sources for collimation costing are retrievable or the cells are marked SOURCE-BLOCKED.
    Measured 2026-08-07: arXiv full PDFs and NIST publications retrieve; eprint PDFs return a
    Cloudflare challenge while abstracts resolve.'
  predictions:
  - metric: fraction of the total cost carried by the class-group-action oracle term
    direction: higher
    minimum_effect: Above 50%, i.e. the oracle rather than the sieve dominates -- which if true
      reframes what a CSIDH parameter argument must establish.
  minimal_test:
    design: Build the three-parameter cost table with the free-oracle null alongside; report the
      required prime size implied by each published cost convention and the spread between them.
    controls:
    - free-oracle null
    - CSIDH-512 forced-value check
    - SOURCE-BLOCKED discipline
    required_metrics:
    - per-term cost with provenance
    - implied prime size per convention
    - spread across conventions
  falsification_conditions:
  - 'Every term is sourceable and the conventions agree: KN-OPEN-014 narrows sharply and the question
    may be retired for this program.'
  - 'The conventions disagree by more than an order of magnitude: that spread IS the open problem
    and is the durable output.'
  - 'The oracle term cannot be instantiated from any available source: recorded as the specific
    term that makes a numeric answer impossible, which is precisely what KN-OPEN-014 asks.'
  confounders:
  - Quantum memory models differ across the collimation literature and must not be mixed.
  - CSIDH parameter proposals differ in group structure; state which is costed.
  interpretation_limits:
  - A cost table is not a security proof and not an attack.
  - Relayed figures are not this program's results until primary sources are filed.
  heuristic_assumptions:
  - id: HEUR-CSIDH-1
    statement: Published collimation cost expressions apply to the CSIDH class-group action without
      structural correction.
    rigorous_support: None.
    validation_plan: The free-oracle null isolates exactly this assumption's contribution.
  target_complexity:
    time_exponent: Subexponential in log p for the sieve; the concrete constant is the unknown.
    memory_exponent: Quantum memory is the binding term and is reported explicitly.
    best_known: Published Kuperberg/collimation analyses, relayed until filed.
    hidden_overhead: The class-group-action oracle, which this record predicts dominates.
    tradeoff_note: A sieve cost quoted without its oracle term is not a cost.
  dominated_by: 'No attack proposed; nothing is dominated because nothing is claimed. Rows checked
    across time, memory and data/queries: Wesolowski 2026 p^{1/3+o(1)} time and memory; Delfs-Galbraith
    p^{1/2}(log p)^{O(1)} at poly memory; vOW p^{1/2+o(1)}/w^{1/2} at memory w; MITM p^{1/2} at
    p^{1/2}; Kohel p(log p)^{O(1)}. Queries 0 on every row.'
  sota_delta: ZERO. Closes or sharply narrows KN-OPEN-014, the only surviving-branch parameter-sizing
    question the program claims as in scope, and either retires the FC0 lane with a numeric output
    or names the term that makes one impossible.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 0.8 that the table is buildable with most cells sourced. 0.7 that
    the oracle term dominates. 0.4 that published conventions disagree by more than an order of
    magnitude, which would be the most valuable outcome. 0.0 that this produces an attack; it
    is not meant to.
