        second false-positive control if Stage 1 is unblocked.
    - id: PR-4
      metric: >-
        Stage r1 CONFIRMATORY ALIVE ARM: J5-2 - (aes, r5, amask=1, smask=1, 2^30, seed 531002,
        armid 1, threads 4), extended build; mask decomposition as co-primary
      direction: different
      minimum_effect: >-
        A determinate outcome under the preregistered rule: RX-ALIVE (p_extra <= 0.05, S_obs above
        null mean), RX-WEAK (0.05 < p_extra <= 0.15, or 531001-restatement direction not
        reproduced), or RX-DEAD (p_extra > 0.15 with S_obs at/below null mean). Subclass readings
        (active-word X, inactive-word X, mask composition) reported whatever the outcome, per seed,
        never pooled. Prior, disclosed: P(RX-ALIVE) ~ 0.30 -- the residual is real on committed
        data but n is tiny, the Z-field uniformity points away from the mechanism (J-F adverse),
        and mask-composition seed variance is unmeasured (J-C); the design's value is decidability,
        not confirmation.

  minimal_test: >-
    CHEAPEST DISCRIMINATING SUBSET: Stage r0 alone -- 0 cipher runs, seconds of exact analysis on
    committed receipts. Decides: the anchor passes on committed data (the repaired statistic reads
    maximally null on the dead arm, unlike its predecessor), and the unadjudicated residual becomes
    a named number under a named null (hypothesis-generating). Stage r1 (2 analysis-bearing arms +
    gates, one producer batch) decides the confirmatory question at the fresh seed. Stage 1 of the
    ramp is NOT part of this record's minimal test and stays gated.

  stages_and_budget:
    stage_r0:
      batch_shape: zero cipher runs; analysis only (fresh-code exact arithmetic on committed receipts)
      runs:
        - {id: A1, content: 'preregistration restatement - compute F, X, S for all 14 hits of runs/R4_gate0_j5.json and all 3 hits of runs/R5_r6_reference.json from committed fields (vanishing_word_mask, wt_e_byte); exact DP p-values under the naive uniform null', cost: 'seconds, 0 runs'}
      decides: >-
        Anchor pass/fail on committed data (PR-1); the seed-531001 excess-zero reading as a
        hypothesis-generating number (PR-2). Does NOT decide the carrier question (inspected data).
    stage_r1:
      batch_shape: one producer, 7 runs, wall clock ~1.5-2 h under the binding handoff baseline (~27 min per 2^30 arm at 4 threads; ~54 min for the 2-thread Gate-0 arm); measured campaign hardware is far faster (~94-155 s per arm per Stage 0 RESULTS.json elapsed_time_note -- flagged optimistic-relative, the handoff baseline is binding for budgeting)
      runs:
        - {id: G1, content: 'write-once preregistration file (statistic, class partition, null, anchor sequence, decision rule, seat tuples, allowed-diff list), mtime before first arm', cost: 'seconds'}
        - {id: G2, content: 'KAT pins on the extended build (pin + pinidentity)', cost: 'seconds'}
        - {id: G3, content: 'GATE-0 EXTENDED - (aes, r5, amask=1, smask=1, 2^30, seed 531001, armid 1, threads 2): field-by-field reproduction of L1-AES-R5-P30 under the extended allowed-diff list; collects the seed-531001 class baseline', cost: '~54 min baseline'}
        - {id: G4, content: 'FRESH DEAD ANCHOR - (aes, r6, amask=1, smask=1, 2^30, seed 531002, armid 1, threads 4): analyzed FIRST; anchor gate p_extra > 0.05 AND hits <= 8; tripwire >= 9 (F6)', cost: '~27 min baseline'}
        - {id: G5, content: 'CONFIRMATORY ALIVE ARM J5-2 - (aes, r5, amask=1, smask=1, 2^30, seed 531002, armid 1, threads 4): X statistic with run-internal empirical null; mask decomposition co-primary; admitted ONLY if G4 anchor passed', cost: '~27 min baseline'}
        - {id: G6, content: 'determinism double - extended build, log2N=20, threads=4, seed 531001, identical command twice; byte-identical including new counters and zero_mask_e', cost: 'seconds-minutes'}
        - {id: G7, content: 'post-arm digest re-verification of the frozen table-freeze file + source-diff audit record', cost: 'seconds'}
      decides: >-
        The confirmatory excess-zero reading at the fresh seed (RX-ALIVE / RX-WEAK / RX-DEAD);
        instrument validity of the extended build; the seed-531002 dead-arm anchor. Does NOT
        decide the ramp (Stage 1 stays gated on this outcome and a Coordinator decision).
    budget_honesty: >-
      Stage r1 fits one producer batch (7 runs <= 8-run precedent; ~1.5-2 h baseline wall clock,
      ~7200 s budget as in Stage 0). Memory O(1) per trial (counters only; per-hit detail capped
      at 64). Every stage boundary is a stopping point with committed reading: a halt after r0 is
      a restatement + anchor result; after G3 an instrument-validation result; after G4 an anchor
      result (rule 5: budget exhaustion reported as such, never as a result about e). Stage 1a/1b
      of 363851 (~4-4.5 h, 2 producer batches) is EXPLICITLY NOT spent by this record and must not
      be spent before the anchor passes and the Coordinator re-dispatches.

  preregistered_decision_rule: >-
    Committed in G1 before any fresh arm. STAGE r0 (committed data): (R0-ANCHOR-PASS) the repaired
    statistic on the committed r=6 arm reads p_extra > 0.05 (expected: 1.0 exactly) -> proceed to
    restatement; (R0-ANCHOR-FAIL) any other value -> executor recomputation error or field
    mismatch; halt and reconcile, no reading. STAGE r1: (RX-ALIVE) G4 anchor passes (p_extra >
    0.05, hits <= 8) AND at G5 p_extra <= 0.05 AND S_obs above its run-internal null mean ->
    excess-zero signature CONFIRMED at t=1 at a fresh seed under the repaired statistic; the
    carrier clause of e becomes measured-alive at t=1 within the tested scope; this record
    RECOMMENDS (Coordinator decision + decision record required) unblocking Stage 1a/1b of
    IDEA-20260901-363851 with the carrier statistic replaced by this record's X statistic
    (additive amendment to the frozen spec) under a claim-changing review round (review_plan
    written before any reviewer runs). (RX-WEAK) anchor passes AND 0.05 < p_extra <= 0.15 at G5,
    OR p_extra <= 0.05 at the 531001 restatement but > 0.15 at G5 -> signature weakened, not
    confirmed; carrier clause stays named-unmeasured; named successors: one 2^32 t=1 arm, or one
    adequately-powered interior ramp point if the Coordinator re-ranks; NO full ramp. (RX-DEAD)
    anchor passes AND p_extra > 0.15 at G5 AND S_obs at or below its null mean (residual not
    replicated) -> excess-zero signature FALSIFIED at t=1 within the tested scope (FX1); the
    carrier clause of e dies an F1-class death at t=1; Stage 1 carrier spend is OFF; the
    ramp-shape question (363851 C3) survives and the Coordinator may re-rank a shape-only reduced
    Stage 1 as a design change (new decision record), default is return to idea generation with e
    named non-carrier at t=1. (RX-ANCHOR-FAIL) p_extra <= 0.05 at G4 -> the repaired statistic
    FIRES ON THE DEAD ARM: statistic indicted (proves-too-much recurrence); halt and repair;
    invalid_measurement; NO alive reading admitted; never evidence about e (rule 5). (RX-GATE-FAIL)
    any gate failure (G2/G3/G6/G7) -> invalid_measurement, halt, repair (rule 5). STAGE 1
    INTEGRATION (only if RX-ALIVE unblocks it, under a new decision): at each testable interior
    point (n_hits >= 5) the same X test with run-internal baseline; CARRIER-CONFIRMED (adapted) =
    Holm-adjusted p_extra <= 0.05 at >= half the testable points AND the per-hit excess-zero rate
    decays jointly with the hit-count excess toward k -> 0 AND zero points read Holm-adjusted
    p_deficit <= 0.05 (anti-carrier); SHAPE-ONLY = excess present at >= 2 adequately-powered
    points (>= 50 hits each) with no Holm-adjusted excess-zero rejection at any -> carrier
    falsified along the ramp (FX2); SPLIT = recorded as live contradiction, Coordinator decides.
    Budget halts are resource_exhaustion, never readings.

  test_boundary: >-
    Toy tier; r=5 alive arms (one r=6 known-dead reference per seed); one probe cell (amask=1,
    smask=1); 2^30 exposure; the frozen nested position family S_k (if Stage 1 is unblocked), not
    the space of all S-boxes; bijective tables only; one key per seed family (key co-varies with
    the table by pinned convention). The strongest licensed sentences: 'within the tested probe
    cell at toy tier, the r=5 excess hits carry extra zero bytes of e beyond the forced envelope
    at seed 531002' (if RX-ALIVE) and 'the excess-zero signature is absent at t=1 within the
    tested scope' (if RX-DEAD) -- NEVER 'any S-box', never 'e is the only carrier', never anything
    about full-round or deployed AES; no published-frontier comparison in either direction (R3).

  falsification_conditions:
    - >-
      FX1 (MAIN CARRIER FALSIFIER - falsifies the excess-zero signature, not the instrument).
      RX-DEAD fires: anchor passes, p_extra > 0.15 at seed 531002 with S_obs at/below its null
      mean; the seed-531001 residual adjudicated as unreplicated. Then the carrier clause of e is
      falsified at t=1 within this statistic/probe cell/exposure/seeds; the sealed verdict's
      carrier wording stays named-unmeasured-to-dead at t=1 and H1 below is refuted within the
      tested scope. Complete result; the record's most valuable negative (it is the red team's
      boundary falsifier (4) at t=1).
    - >-
      FX2 (RAMP-LEVEL CARRIER FALSIFIER, only if Stage 1 proceeds). SHAPE-ONLY under the adapted
      Stage 1 rule: no excess-zero attraction at >= 2 adequately-powered interior points while the
      excess is present. Carrier falsified along the ramp within the tested family.
    - >-
      FX3 (WEAKENS, does not falsify). RX-WEAK: single-seed direction not reproduced, or marginal
      0.05 < p_extra <= 0.15. Recorded as measured with the weakening located; successor named.
    - >-
      FX4 (BLOCKING - statistic indictment). The repaired statistic fires toward extra zeros on a
      known-dead arm (p_extra <= 0.05 at G4, or the r0 anchor fails on committed data other than
      by executor arithmetic error). Proves-too-much recurrence; halt and repair; NO reading about
      e is admitted. This is closer in kind to an F4-class instrument indictment at the statistic
      level, per the red team's framing.
    - >-
      FX5 (BLOCKING - gate/instrument). Gate-0 extended-build identity fails, determinism fails,
      KAT pins fail, source-diff finds a stream/counter touch, or digest re-verification fails.
      invalid_measurement; repair (rule 5); never evidence about e.
    - >-
      NOT A FALSIFICATION - budget halts (rule 5); underpowered arms with n_hits < 5 (recorded,
      never tested); timeouts/crashes (rule 5); F6 tripwire (>= 9 hits at r=6) is an escalation to
      claim-changing review per the frozen spec, not a defect of this record.

  controls:
    - >-
      ANCHOR / DEAD-ARM CONTROL (preregistered, BINDING ORDER): the repaired statistic reads the
      known-dead r=6 arm BEFORE any alive reading is admitted -- on committed data (r0, 0 runs)
      and fresh at seed 531002 (G4, run and analyzed before G5). If it fires on the dead arm,
      halt/repair; the alive reading is never admitted. This is the exact inverse of the Stage-0
      failure mode (raw statistic: p = 3.95e-5 on the dead arm; repaired statistic: p_extra = 1.0
      by construction of the committed fields).
    - >-
      MASK-CONDITIONED RESTATEMENT AT ZERO RUNS: the committed per-hit fields already determine X
      for all 17 committed hits; the restatement costs no cipher time (red team's cheapest control
      executed as a preregistered stage).
    - >-
      RUN-INTERNAL CONDITIONAL NULL: each arm's null baseline comes from its own ~2^30 miss trials
      (class-wise), so the test auto-calibrates to each seat's zero-byte geometry (including the
      law-restoration at interior ramp points); no external seat needed for the statistic's null.
    - >-
      KNOWN-FALSE CONTROL (carried, Stage 1b of 363851 if unblocked): the amask=15
      structure-destroyed seat must not fire toward extra zeros (power at n ~ 1 disclosed).
    - >-
      SEED-VARIANCE CONTROL: readings per seed (531001 restatement, 531002 confirmatory), never
      pooled; mask composition reported per seed (the OBS-B16-3 / J-C discipline).
    - >-
      HYPOTHESIS-GENERATING vs CONFIRMATORY SPLIT: the 531001 reading is on data already inspected
      by the red team and counts as direction-generating only; the decision rule requires the
      untouched 531002 arm. No double-dipping into significance.
    - >-
      PRE-REGISTRATION AS COMMITTED DIGEST: statistic, class partition, null construction, anchor
      sequence, decision rule, thresholds, seat tuples, allowed-diff list committed before the
      first fresh arm (G1), re-verified post-arm (V-804-2).

  confounders:
    - >-
      INDEPENDENCE ASSUMPTION IN H0-X: the null treats non-forced bytes as independent Bernoulli;
      positive within-hit correlation would inflate Var(X) and could make the DP null
      anti-conservative. Mitigations, preregistered: (i) the anchor/dead-arm control is the
      empirical calibration check -- a systematically anti-conservative statistic fires on dead
      arms; (ii) on any arm with n_hits >= 50, report the first two moments of the per-hit X
      distribution against the null's mean/variance (overdispersion audit); (iii) at small n the
      variance-calibration limit is disclosed with the reading, never smoothed.
    - >-
      NAIVE vs EMPIRICAL NULL MISMATCH AT r0: the restatement uses the naive uniform null
      (committed receipts lack class baselines); the fresh arms use the run-internal empirical
      null. The two coincide at t=1 to within ~6% (pooled miss zero rate 3.906e-3 vs 1/256 =
      3.906e-3, computed this session from the committed ewhist_miss), so the mismatch is
      negligible at these seats; at interior ramp points only the empirical null is used.
    - >-
      ANCHOR POWER LIMIT: ~3 hits at r=6 gives the anchor little power against subtle
      miscalibration; it catches systematic firing (the actual historical failure mode). Disclosed;
      the amask=15 seat is the named second control.
    - >-
      SMALL HIT SAMPLE AT t=1: n ~ 14/19 limits power; RX-WEAK exists exactly for this; the
      subclass readings inherit the limit and are reported with it.
    - >-
      KEY-SCHEDULE CO-VARIATION, THREAD-COUNT PINNING, SHARED-HARNESS BUGS: inherited unchanged
      from 363851 confounders (the instrument lineage is the same); the r=6 anchor and Gate-0
      re-run police them as there.
    - >-
      Z-FIELD SEMANTICS: the logged Z counts zero bytes of q0^q1, NOT of e (affarm046e.c:388);
      this record's statistic uses Ze = 16 - wt_e_byte and never the Z field; the distinction is
      recorded because conflating them would silently corrupt X.

  interpretation_limits:
    - >-
      claim_tier toy. RX-ALIVE licenses 'within the tested probe cell at toy tier, the r=5 excess
      hits carry extra zero bytes of e beyond the forced envelope at seed 531002' - never 'any
      S-box', never 'e is the only carrier', never anything about full-round or deployed AES.
    - >-
      RX-ALIVE at t=1 is NOT carrier confirmation: the causal reading (excess rides on e) requires
      the joint decay along the ramp (C2), which stays unmeasured until Stage 1 runs under the
      repaired statistic (the red team's J-D stands against any one-point carrier language).
    - >-
      The X statistic is blind to any effect that acts only through the envelope's extent
      (lossy_projection_test); the one-sided linear candidate (04606c route (ii)) remains a live,
      named, unmeasured alternative whatever the outcome.
    - >-
      No published-frontier comparison in either direction (R3); recalled references are pointers,
      never support. Timeouts, crashes, infrastructure failures are never negative mathematical
      evidence (rule 5).

  heuristic_assumptions:
    - id: H1
      statement: >-
        EXCESS-ZERO CARRIER SIGNATURE AT t=1. Under the full AES table at r=5, hit trials carry
        more zero bytes of e beyond the forced vanishing-word envelope than the mask-conditional
        null: S_obs above its Poisson-binomial expectation, p_extra <= 0.05 at the fresh seed
        531002.
      rigorous_support: >-
        RIGOROUS PART - the envelope subtraction is a theorem (J-A); the null is exact conditional
        on its rates; satisfiability is proven above. WHAT IS HEURISTIC is the excess itself: the
        only committed signal is the unadjudicated 1-byte residual (3/10 inactive hits at X = 1 vs
        null mean 23/32; naive p = 0.0361, design-time computation) on inspected data, against the
        adverse J-F reading (13/14 hits at exactly the forced count). DISTRIBUTION IMITATED - none
        named; the fresh arm IS the validation, stated so an RX-ALIVE outcome is recognized as the
        assumption winning.
      validation_plan: >-
        Stage r0 (restatement, 0 runs) then stage r1 (G4 anchor, G5 confirmatory arm at 531002).
      falsification_condition: >-
        FX1 (RX-DEAD), FX3 (RX-WEAK weakening branches).

  obstruction:
    quantity: >-
      The excess zero bytes of e beyond the forced envelope per hit, at t=1, amask=1: X(h) and its
      sum S, with the mask-conditional null mean, at frozen 2^30 exposure.
    measured_value: >-
      From committed data (design-time recomputation this session, exact integer arithmetic): at
      seed 531001, S_obs = 3 over 14 hits (3 inactive-word hits at X = 1, 11 hits at X = 0),
      naive-null mean 23/32 = 0.71875, p_extra = P(S >= 3) = 0.0361 exact (DP over 10 x
      Bin(12,1/256) + 4 x Bin(16,1/256)); at the dead r=6 arm, S_obs = 0, p_extra = 1.0. Error
      bars: exact test at these n; the residual's status is UNADJUDICATED -- these numbers are the
      measurement the batch never tested, read from committed fields.
    runs_read_from: >-
      runs/R4_gate0_j5.json and runs/R5_r6_reference.json hit_e_detail (TASK-20260901-7e0b71
      producer package), ewhist_miss of the same receipts; red-team recomputation in
      TASK-20260901-6efcd8 (naive expectation ~0.61 under a 16-byte-per-hit variant of the null;
      this record's class-aware variant gives 0.71875 -- both recorded, executor recomputes from
      the definition).
    scope_claimed: >-
      Toy tier, one probe cell (amask=1, smask=1), r=5 alive / r=6 dead, seeds 531001 (committed)
      and 531002 (to be measured), 2^30.
    resource_check:
      examined: true
      reading: >-
        The obstruction IS this proposal's hypothesis: the same residual the Stage-0 design could
        not adjudicate (its statistic was definition-dominated) is the signal the envelope-relative
        statistic is built to test -- the indefiniteness of the old test is the new test's reason
        to exist. If RX-DEAD fires, the death localizes: the active-word subclass (the one class
        with NO envelope, 4/4 hits at X = 0 on committed data) reads hits indistinguishable from
        misses on e, and the carrier question passes to the one-sided linear candidate
        (IDEA-20260901-04606c route (ii)) and to schedule-side coordinates, both still open by
        name. If RX-ALIVE fires, the excess-zero signature becomes the ramp's tracked coordinate.
        Both readings named in advance; no third reading found unexamined.

  target_complexity:
    time_exponent: >-
      No attack, no exponent. Stage r0: seconds of exact analysis, 0 runs. Stage r1: 7 runs,
      ~1.5-2 h wall clock under the binding handoff baseline (~27 min per 2^30 4-thread arm,
      ~54 min for the 2-thread Gate-0 arm); measured campaign hardware ~94-155 s per arm
      (optimistic-relative, disclosed).
    memory_exponent: >-
      O(1) per trial (table-driven; fixed histograms; class counters; per-hit detail capped at 64
      records). Exact-test DP O(S_max * n_hits) for n_hits <= 2000, seconds.
    best_known: >-
      The committed endpoints are the baseline (14/19 hits at 2^30; null 1.0; dead at r=6). No
      improvement claimed on any cost axis.
    hidden_overhead: >-
      Disclosed: implementation is a small pure-read diff on affarm046e (class counters +
      zero_mask_e); the handoff cost baseline hides the machine difference vs measured Stage-0
      rates -- flagged optimistic-relative, binding as handed off.
    tradeoff_note: >-
      Evidential tradeoff stated: stage r0 alone adjudicates nothing (inspected data) but costs
      nothing; stage r1 buys one fresh confirmatory seed at ~2 fresh arms; the ramp-wide decision
      still needs Stage 1, explicitly NOT spent here. No time-memory tradeoff in content.

  dominated_by: >-
    CHECKED ROW BY ROW across time, memory, and data/queries. ROW 1 - IDEA-20260901-363851 (frozen
    ramp): its unconditional exchangeability statistic is the object repaired here; this record
    consumes its instrument/gates/family and replaces one field (the test statistic) plus one
    additive logging block - a repair, not dominated by it (363851 cannot adjudicate the carrier
    clause at all, per the red team). ROW 2 - TASK-20260901-6efcd8 red team's mask-conditioned
    restatement: executed as a 0-run CONTROL with a naive expectation, no preregistered test, no
    fresh arm, no anchor sequence; this record consumes and extends it - execution of a named
    control is succession, not domination (363851's own ROW-2 logic). ROW 3 - EV-AES-732f71:
    records the residual as unadjudicated; adjudicates nothing. ROW 4 - IDEA-20260901-04606c
    route (ii): a DIFFERENT statistic (one-sided perturbation), never measured; orthogonal
    candidate, no domination either way. ROW 5 - IDEA-20260901-69912d / 02f7c4 / 054dd4: layer
    autopsy / cross-lineage battery / cell-unit axes, no overlap with the envelope-relative
    statistic. ROW 6 - EV-AES-ec53f1 / b2910a: sealed verdict and battery, consumed inputs. Every
    row checked; none dominates; null written honestly. Published frontier unadjudicable (R3); no
    margin claimed.
  sota_delta:
    time_exponent: '0 (no attack)'
    memory_exponent: '0 (no attack)'
    data_or_query_exponent: '0 (no attack)'
    note: >-
      Evidential delta: (i) converts the tautological Stage-0 statistic into a provably
      satisfiable one (satisfiability proof above; the tautology reads as the null's mode), at a
      cost of one additive logging block; (ii) converts the unadjudicated 1-byte residual into a
      preregistered decidable test with a binding anchor-first dead-arm control; (iii) decides
      carrier-alive vs carrier-dead at t=1 for the sealed verdict's carrier clause at a total cost
      of 0 + 2 analysis-bearing arms (~4 min measured on campaign hardware), gating the ~4-4.5 h
      Stage 1 spend behind a ~2-minute discriminant. Published-frontier comparison unadjudicable
      (R3); toy tier only, no published-cryptanalysis comparisons in either direction.

  estimated_cost:
    implementation: low
    compute: low
  compute_budget_note: >-
    Stage r0: 0 runs. Stage r1: one producer batch, 7 runs, <= 8-run precedent, ~7200 s budget
    (Stage-0 precedent); 2 fresh analysis-bearing 2^30 arms + 1 Gate-0 re-run + gates. No
    memory-bound workload; every exposure the campaign has repeatedly demonstrated affordable.
    Stage 1 of the ramp is NOT budgeted here.
  recommended_priority: high

  honest_prior_of_survival: >-
    P(r0 anchor passes on committed data) ~ 1.0 (computed: p_extra = 1.0 exactly on the committed
    dead arm). P(RX-ALIVE at 531002) ~ 0.30 (the residual is nominally significant on committed
    data but n is tiny, J-F points away from the mechanism, mask-composition seed variance is
    unmeasured). P(RX-WEAK) ~ 0.25. P(RX-DEAD) ~ 0.40. P(RX-GATE-FAIL) ~ 0.05 (Gate 0 passed once
    on this lineage; the extension is pure-read counters). Every branch carries a committed
    reading: the record produces a determinate confirmation, a determinate weakening, a determinate
    falsification of the excess-zero signature at t=1, or a determinate statistic indictment, in
    all cases -- and keeps the ramp gated until then.

