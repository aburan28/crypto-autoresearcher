  title: >-
    ENVELOPE-RELATIVE CARRIER STATISTIC - the Stage-0 carrier statistic of IDEA-20260901-363851 was
    proven tautological at amask=1 by the BATCH-2f12ac red team (TASK-20260901-6efcd8): amask=1 pins
    supp(d = p0^p1) to PW word 0, so any hit vanishing on PW word 1/2/3 has wt(e) <= 12
    DETERMINISTICALLY for any round function, and the unconditional exchangeability test fired on the
    known-dead r=6 arm (p_small = 3.95e-5). DEC-20260901-d46348 therefore withholds Stage 1a/1b and
    routes through idea-generator for a repaired statistic. This record proposes one: the
    ENVELOPE-RELATIVE EXCESS-ZERO STATISTIC X(h) = (number of zero bytes of e on hit h) minus (the
    zero bytes forced by h's vanishing-word mask), tested one-sided toward EXTRA zeros against a
    per-mask-subclass conditional null built from the same run's miss trials (plus the exact 1/256
    RNG null on input-drawn diagonal bytes). The null is satisfiable by construction -- X = 0 on all
    hits is in its support for ANY round function, and the tautology itself predicts exactly X = 0,
    the null's mode. Preregistered anchor/dead-arm control first (the statistic must read null on the
    r=6 known-dead arm before any alive reading is admitted; on committed data it reads p_extra = 1.0
    there, maximally null), then a mask-conditioned restatement of the committed seed-531001 data
    (0 runs), then ONE fresh confirmatory arm (J5-2 at seed 531002, ~2 min measured on campaign
    hardware) preceded by a fresh r=6 seed-531002 dead anchor. Stage 1a/1b of the frozen ramp stay
    gated on this statistic passing its anchor. Additive repair only: the frozen dilution family,
    instrument lineage, digests, and gates of IDEA-20260901-363851 are preserved unchanged.

  object: >-
    TRACKED OBJECT - THE REPAIRED CARRIER STATISTIC FOR e = (q0^q1)^(p0^p1) AT amask=1. The sealed
    verdict's carrier clause (EV-AES-ec53f1 OBS-FE0-4, hardened by EV-AES-b2910a) names e as the
    candidate carrier of the r=5 residual, unmeasured under a nonlinear S-box; Stage 0
    (EV-AES-732f71) made the first wt(e) measurement and proved the preregistered statistic
    definition-dominated. The red team's named GENUINE support signature for any future carrier claim
    is: extra zero bytes of e BEYOND the forced vanishing-word envelope, decaying jointly with the
    excess along the ramp (TASK-20260901-6efcd8 boundary_statement). This record targets exactly
    that signature: per hit h, X(h) = Ze(h) - F(h), where Ze(h) = 16 - wt_e_byte(h) is the total
    zero-byte count of e and F(h) = 4 * popcount(vanishing_word_mask & {2,4,8}) is the number of
    zero bytes forced by the envelope theorem (J-A). No different signature is proposed: the
    alternative candidates (bit-weight tail, active-subclass-only test) are either dominated by the
    same envelope logic or are strict subclasses of this statistic (the active-word subclass, F = 0,
    rides inside it as a preregistered co-primary decomposition). The ramp coordinate (Stage 1 of
    363851) is inherited unchanged as the joint-decay discharge, gated on this statistic's anchor.

  lossy_projection_test: >-
    The projection (trial stream, cipher) -> (per-hit mask, X, subclass sums) discards the byte
    POSITIONS of extra zeros within a hit (partially retained: new arms add a zero-byte mask of e to
    the capped per-hit detail), discards all non-hit trials beyond their class-wise zero-byte
    baseline, and discards everything outside the probe cell. Fibres are enormous. Genuinely lossy.
    THE SHARP EDGE THIS RECORD OWNS: X subtracts exactly the theorem's content, so the statistic is
    BLIND to the envelope by construction -- a hit population that is 'word-vanishing events with
    otherwise random residual bytes' reads exactly at the null whatever the cipher, and only extra
    cancellations beyond the envelope move it. That blindness is the repair, and it is also the
    ceiling: X cannot detect a carrier that acts ONLY through the envelope's own extent (no such
    action exists at amask=1 -- the envelope is mask-determined -- but the limitation is stated).

  claim: >-
    Two statements, C1-C2, with the carrier clause carried as heuristic H1 below, never as
    established.

    (C1) THE EXCESS-ZERO SIGNATURE AT t=1 (Stage R, this record). Under the full AES table at r=5,
    2^30, the anchor seat family (seed 531001 restatement + fresh seed 531002), hit trials carry
    MORE zero bytes of e than the forced envelope: the one-sided exact test of S = sum of X(h)
    against the per-mask-subclass conditional null rejects toward extra zeros (p_extra <= 0.05) at
    the fresh seed 531002, with the committed r=6 known-dead arm reading null first (anchor). The
    seed-531001 reading is computed on already-committed, already-inspected data and is
    HYPOTHESIS-GENERATING only (the red team surfaced the residual); confirmation requires 531002.
    A null reading falsifies the excess-zero signature at t=1 within the tested scope (FX1).

    (C2) JOINT DECAY ALONG THE RAMP (inherited from 363851 C2, restated for X; ONLY IF Stage R
    unblocks Stage 1). As the nonlinearity dose k falls, the per-hit excess-zero rate (S vs its
    run-internal null expectation) and the excess (hit count) decay TOGETHER: every interior point
    with >= 5 hits is tested by the same preregistered X statistic with Holm correction; the
    signature is absent at k=0 by construction (the identity law holds everywhere; the statistic
    degenerates there, disclosed). Joint decay converts e from named candidate to measured carrier
    at toy tier; its absence falsifies the carrier reading along the ramp (FX2).

    (WHAT IS NOT CLAIMED) No statement about full-round or deployed AES; no published-frontier
    comparison in either direction (RQ-AES-003 R3); no claim that X exhausts the carrier question
    (the one-sided linear candidate of IDEA-20260901-04606c route (ii) stays out of scope, named);
    no claim that the seed-531001 restatement confirms anything (hypothesis-generating on inspected
    data); no claim that the ramp is spent (it stays gated).

  mechanism: >-
    The candidate mechanism is RESIDUAL-CARRIER COUPLING (IDEA-20260901-04606c H2) in its
    envelope-relative restatement: a nonlinear S-box layer makes the identity law q0^q1 = p0^p1
    fail on the overwhelming mass of trials, and the rare excess hits concentrate on trials where
    the composed S-box action along the trajectory is accidentally affine-compatible -- which, once
    the forced envelope is subtracted, appears as EXTRA zero bytes of e beyond the envelope on hit
    trials, at a rate above the mask-conditional null. The tautology exposed in Stage 0 is that the
    UNCONDITIONED statistic consumed the envelope theorem instead of the cipher: this record's
    statistic subtracts the theorem term-for-term, so whatever it detects is cipher-touched by
    construction of the test. ADVERSE EVIDENCE ON RECORD, stated up front: the t=1 data point AWAY
    from the mechanism within the envelope (13/14 hits at exactly the forced zero count, Z_qq = 4;
    red-team J-F); the only deviation is the unadjudicated 1-byte residual (3/10 inactive-word hits
    at X = 1 vs null expectation 23/32 over all 14 hits). This proposal exists to adjudicate that
    residual under a satisfiable null at a fresh seed, whatever the outcome. The rival branch
    (hits are word-vanishing events with random residual bytes; the excess rides on some other
    quantity) is fully specified as H0-X below and is the preregistered null, not an afterthought.

