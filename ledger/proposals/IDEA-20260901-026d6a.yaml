  repaired_statistic:
    quantity: >-
      Per hit h: e_i = (q0[i]^q1[i]) ^ (p0[i]^p1[i]) as in the frozen spec; Ze(h) = #{i : e_i = 0}
      = 16 - wt_e_byte(h) (zero-byte count of e; note the logged Z field counts zero bytes of
      q0^q1, a different quantity -- affarm046e.c:388 -- and is NOT used in the statistic);
      m(h) = vanishing_word_mask with bit j set iff (q0^q1) vanishes on PW word j;
      F(h) = 4 * popcount(m(h) & 0b1110) = the number of zero bytes of e forced by the envelope
      theorem (each vanished INACTIVE word j in {1,2,3} forces e = 0 on its four bytes; the
      vanished ACTIVE word forces e = d on the diagonal, which is input-drawn, not a forced zero);
      X(h) = Ze(h) - F(h) = extra zero bytes of e beyond the forced envelope. X(h) >= 0 is
      guaranteed: the forced bytes are zero by theorem and are counted in Ze. For W = 1 hits:
      inactive-word subclass (m in {2,4,8}): X = 12 - wt_e_byte, range [0,12]; active-word
      subclass (m = 1): F = 0, X = Ze = 16 - wt_e_byte, range [0,16]. W >= 2 hits (possible at
      interior ramp points): F sums over all vanished inactive words; the same definitions apply.
      Primary scalar: S = sum of X(h) over the arm's hits. Secondary (retained, logged): bit
      weight of e per hit, zero-byte mask of e per hit (new arms only).
    byte_class_partition: >-
      For each hit h, its 16 - F(h) non-forced bytes split into three functional classes that
      determine the null rate per byte:
      CLASS D0 - diagonal bytes of a VANISHED active word (bit 0 of m set): e_i = d_i, the drawn
      input difference; cipher-independent; null zero-probability p = 1/256 EXACT under the drawing
      model (p1 redrawn uniformly per amask word; the nontriviality exclusion is a word-level
      event with per-byte effect O(2^-32), disclosed and neglected).
      CLASS D1 - diagonal bytes when the active word did NOT vanish (bit 0 of m unset):
      e_i = (q0^q1)_i ^ d_i, cipher-touched; null rate p_diag = (zeros of e on the 4 diagonal
      positions over the arm's MISS trials) / (4 * n_miss) -- the same functional on miss trials.
      CLASS O - off-diagonal bytes of non-vanished words: e_i = (q0^q1)_i, cipher-touched; null
      rate p_off = (zeros of e on the 12 off-diagonal positions over the arm's MISS trials) /
      (12 * n_miss) -- the same functional on miss trials.
      The class membership of every non-forced byte is determined by m(h) alone; no data-dependent
      choice anywhere.
    null_model: >-
      H0-X (per arm, exact-conditional given the realized mask multiset and hit count): the
      non-forced bytes of e on hit trials are independent Bernoulli variables at their class rates
      (D0 at 1/256 exact; D1 at p_diag; O at p_off, both estimated from the SAME run's miss trials
      as exact rationals, ~2^30 trials at these seats so estimation relative error ~1e-3, declared
      approximation: the DP conditions on the point estimates). Hence X(h) is Poisson-binomial over
      its 16 - F(h) non-forced bytes, independent across hits. TEST STATISTIC: p_extra =
      P_{H0-X}(sum of X(h) >= S_obs), computed by exact dynamic-programming convolution of the
      per-hit Poisson-binomial pmfs for n_hits <= 2000 (exact rational or declared-precision
      integer arithmetic, O(S_max * n_hits), seconds). For n_hits > 2000 (possible at GRADUAL
      interior points): deterministic subsample = the first 2^20 hits in stream order (pinned, not
      data-dependent), exact DP on the subsample deciding, plus the full-sample mean-excess z-score
      reported as audit. One-sided carrier direction: EXTRA zeros (large S). p_deficit (small-S
      direction) computed and reported at every arm, descriptive only (systematic deficit would
      say hits avoid cancellations beyond the envelope -- anti-carrier, recorded per rule 8).
      Subclass readings (active/inactive separately, per seed, never pooled) are CO-PRIMARY with S.
    satisfiability_proof: >-
      PROVABLY NON-TAUTOLOGICAL AT amask=1: H0-X is satisfiable by construction for ANY round
      function, alive or dead. (i) The outcome X(h) = 0 for all hits lies in the support of H0-X
      with probability prod_h prod_bytes (1 - p_class) > 0, since every class rate is < 1. (ii)
      That outcome is realizable by any round function -- it is exactly the envelope filled and
      nothing beyond: realized by 13/14 hits at t=1 seed 531001 and by 3/3 hits on the dead r=6
      arm (committed data). (iii) The envelope theorem (J-A) forces EXACTLY F(h) zeros and no
      more -- it is a theorem about the forced bytes only, and has no implication for X(h), which
      counts the remaining bytes. Hence the tautology that killed the Stage-0 statistic predicts
      X = 0 almost surely, which is the MODE of H0-X: under the repaired statistic the tautology
      reads as a perfect null, not a rejection. Contrast: the Stage-0 H0 (hit weights iid from
      F_miss) was DETERMINISTICALLY false whenever a single inactive-word hit existed
      (F_miss(<=12) ~ 4e-7 vs the theorem's wt(e) <= 12), which is why it fired on the dead arm.
      H0-X can be false (the cipher may add cancellations on hitting trials -- that is the
      carrier), but it is never false by definition. This is the repair's entire content.
    proves_too_much_recheck: >-
      Preregistered recomputation on committed data (0 runs): apply the repaired statistic to the
      known-dead r=6 reference arm (3 hits, masks {1,1,2}, weights {16,16,12}): X values {0, 0, 0},
      S_obs = 0, p_extra = P(sum >= 0) = 1.0 EXACTLY -- maximally null on the dead arm, where the
      Stage-0 raw statistic read 3.9458e-5. Any future arm on which the repaired statistic fires
      toward extra zeros on a known-dead object is an indictment of the statistic (FX4), never a
      carrier reading.
    predicted_distribution_H_carrier: >-
      (a) t=1, fresh seed 531002: S_obs above its null expectation (null mean ~ n_hits * 12/256 to
      16/256 depending on mask composition, ~0.9-1.2 at ~19 hits); p_extra <= 0.05; the excess sits
      in extra zero bytes beyond the envelope (some hits with X >= 1), ideally visible in BOTH
      subclasses. (b) Along the ramp (if unblocked): per-hit excess-zero rate decays jointly with
      the hit-count excess toward k -> 0, where the statistic degenerates by law (all trials hit
      with mask 0b1110, e = 0 identically, no miss trials exist to build a baseline -- disclosed,
      k=0 is the ramp anchor not a carrier test point).
    predicted_distribution_H_null: >-
      X(h) at its Poisson-binomial null everywhere: p_extra > 0.05 at both seeds; subclass readings
      null; the unadjudicated seed-531001 residual (S_obs = 3) does not replicate at 531002
      (S_obs at or below its null mean). The excess (hit counts) may still decay with k -- the ramp
      shape is measured independently per 363851 C3 -- and the carrier clause of e is then dead at
      t=1 within the tested scope, with the residual adjudicated as small-sample noise.
    degenerate_points_disclosed: >-
      k = 0 (identity limit): no miss trials, all trials hit with mask 0b1110, e = 0 identically,
      X = 4 on every trial -- H0-X is undefined (no baseline exists) and the carrier question is
      moot by law; the X statistic is defined only at points with miss trials and n_hits >= 5
      (power floor inherited from the frozen spec). Near-zero-dose interior points: the miss-side
      baseline exists but the law-restoration raises class rates; the run-internal baseline absorbs
      this point by point (that is why the null is run-internal, not a fixed 1/256).

