idea:
  id: IDEA-20260807-32f96d
  question_id: RQ-ICEX-001
  added: '2026-08-07'
  title: Arity m >= 4 has ZERO measured cost cells anywhere in the corpus, and the obstruction
    that is supposed to kill large m is asserted rather than measured -- the one direction in
    which the program's own cost model IMPROVES is empty
  class: measurement
  claim: 'FINDING-PF-IC-001''s cost model is total ~ ell^{(1+gamma)/m}, DECREASING in m, and dismisses
    large m informally: ''minimized at large m, but the Semaev polynomial degree grows (doubly-exponentially
    in m)''. The only in-repo measurement of gamma, EV-R6-001, records in its own boundaries:
    ''m=4 arm censored entirely; no m=4 measurement exists in this evidence'', with ''even F=6
    (l~2^10.5) GB > 300 s''. Under AGENTS.md rule 3 those timeouts are infrastructure signals
    and NOT evidence about m = 4. So the competing informal obstruction has never been converted
    into a measured crossover: at what m, on this solver stack, does degree growth actually overtake
    the 1/m gain? The nearest record, IDEA-20260803-fa9839 with contract EXP-ICEX-146ff5, is stuck
    in a three-decision routing deadlock (DEC-20260805-bb162b declined it on ROUTING while confirming
    its core algebra is correct; DEC-20260806-8f7e4f returned reject_pending_repair; DEC-20260806-e91b0f
    routed it to GOAL-ICEX-001 and states ''TWO CONCRETE UNBLOCKING ACTIONS EXIST, NEITHER YET
    DISPATCHED'') and has measured nothing.'
  mechanism: Measure the crossover directly at the smallest scale where it is decidable, rather
    than arguing about it. For m = 3, 4, 5 on the SAME toy prime-field curves, with B tuned so
    the counting heuristic is matched across m, record per-decomposition wall time, group-operation
    equivalents, solving degree and success probability, and fit the charged exponent (1+gamma(m))/m
    per m. Timed-out cells are recorded as censored infrastructure with their budget, never as
    a result. A matched rho control runs on the same instances so every number is a ratio.
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-07'
    corpus_paths_grepped:
    - ledger/proposals
    - ledger/hypotheses
    - ledger/evidence
    grep_results:
    - No evidence record anywhere reports a per-decomposition cost, solving degree or charged
      total at m >= 4 over a prime field.
    - H-SDEG-3acfcf covers m in {3,4,5} and is status `proposed` with its EXP-SDEG-* contracts
      unrun.
    conclusion: The arity axis is empty of measurement. Novelty of the MEASUREMENT, not of the
      idea that m matters, is what is claimed.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS as the primary lens: new decomposition mechanisms,
      factor-base redesign, representation changes. The independent variable is ARITY and nothing
      else moves.'
    tracked_object: The charged per-target exponent (1+gamma(m))/m as a function of m.
    one_step_propagation_rule: Incrementing m raises the Semaev degree to 2^{m-2} and lowers the
      exponent's denominator by one step; both are exact and the measurement asks which wins.
    newness_score: Nil as mathematics -- the tradeoff is textbook. The content is that the program
      uses a cost model monotone in m and has never measured m > 3.
  lossy_projection_identifiability_audit:
    projection: the whole decomposition pipeline -> a single charged exponent per m.
    what_is_discarded: Everything about how the decomposition works.
    is_it_only_a_change_of_coordinates: 'NO, and the record is candid that this is a WEAK object:
      a scalar per arity. It cannot support a mathematical claim, only a cost one, and the class
      is measurement for that reason.'
    mirror_failure_check: 'CHECKED. The failure would be an exponent that is constant across m
      by construction. It is not: at m = 3 the value is already measured (EV-R6-001, alpha = 2.074),
      so the comparator is anchored to a committed number and any m = 4 value is free to differ.'
  null_object_control:
    primary_null: A matched Pollard rho run on the identical instances at every cell, so the charged
      exponent is always reported as a ratio to rho rather than in isolation. If index calculus
      at the best m is still above rho at every size -- which is the expected outcome -- the record
      says so as its headline.
    secondary_nulls:
    - 'REGRESSION at m = 3: reproduce EV-R6-001''s alpha within its CI before any m = 4 number
      is admitted.'
    - 'CENSORING DISCIPLINE: at least one cell is expected to time out. A run in which nothing
      is censored at m = 5 should be treated as suspicious, not as success.'
  assumptions:
  - 'The Groebner backend can complete at least one m = 4 cell at some (p, B) inside a declared
    budget. IF IT CANNOT AT ANY SETTING, that is the result: the obstruction is instrumental rather
    than mathematical, and the record says so.'
  - The counting heuristic can be matched across m by choice of B.
  predictions:
  - metric: charged per-target exponent (1+gamma(m))/m at m = 4 versus m = 3
    direction: different
    minimum_effect: Any value at m = 4 with a CI that excludes the m = 3 value; the cost model
      predicts LOWER, degree growth predicts higher.
  - metric: solving degree at m = 4 versus the S_4 prediction
    direction: different
    minimum_effect: A measured degree differing from the predicted 2^{m-2} scaling at more than
      one (p, B) cell.
  minimal_test:
    design: Three arities (3, 4, 5) x three field sizes x matched B, with a rho control per cell,
      a declared per-cell budget, and censored cells reported with their budget and partial progress.
    controls:
    - matched rho per cell
    - m = 3 regression against EV-R6-001
    - explicit censoring record
    required_metrics:
    - per-decomposition wall time and group-operation equivalents
    - solving degree
    - success probability
    - fitted (1+gamma(m))/m with CI
    - censored cell inventory
  falsification_conditions:
  - 'm = 4 exponent is measurably HIGHER than m = 3: the informal degree-growth obstruction is
    confirmed by measurement and becomes a genuine closure at the inventor-protocol section 4
    standard.'
  - 'm = 4 exponent is measurably LOWER and the trend continues at m = 5: the one monotone-improving
    direction in the program''s own cost model is NOT closed, and the standing negative''s scope
    must be restated.'
  - 'No m = 4 cell completes at any setting inside budget: an instrumental obstruction, recorded
    as such and not as a mathematical one.'
  confounders:
  - Groebner engine choice and monomial order change solving degree materially; pin both and report
    them.
  - Matching the counting heuristic across m changes B, which changes the linear-algebra stage;
    report the decomposition stage separately from the total.
  - 'Censoring is not random: it correlates with exactly the cells that would decide the question,
    which must be stated in any conclusion.'
  interpretation_limits:
  - Toy scale. No cryptographic-scale claim.
  - A measured crossover at toy sizes does not locate the crossover at crypto sizes; it converts
    an assertion into a measurement at one scale.
  - This record does not adjudicate the EXP-ICEX-146ff5 routing dispute; it measures the axis
    that dispute has left empty.
  heuristic_assumptions:
  - id: HEUR-ARITY-1
    statement: The direction of the m = 3 to m = 4 change at toy sizes is the same as at larger
      ell.
    rigorous_support: None. FINDING-PF-IC-001's model asserts monotonicity in m without measurement
      at m > 3.
    validation_plan: Measure at three ell per arity and report whether the m-ordering is stable
      across them.
  target_complexity:
    time_exponent: Measures (1+gamma(m))/m; claims no improvement.
    memory_exponent: Reported per cell; currently unrecorded at any m.
    best_known: Pollard rho at exponent 1/2.
    hidden_overhead: Semaev construction cost at m = 5, which is itself significant and must be
      charged separately.
    tradeoff_note: Even a favourable arity trend leaves index calculus above rho at these sizes;
      nothing here claims otherwise.
  dominated_by: 'Pollard rho at exponent 1/2. Rows checked across time, memory and data/queries
    before writing: Pollard rho (p^{1/2}, O(1) memory); BSGS (p^{1/2}, p^{1/2}); vOW parallel
    rho (p^{1/2}/w); Semaev index calculus at total exponent ~2.05 per target (FINDING-PF-IC-001,
    toy scale). Queries 0 on every row.'
  sota_delta: ZERO. Deliverable is the first measured cost cell at m >= 4 in this corpus, and
    either a measured closure of the arity direction or its reopening.
