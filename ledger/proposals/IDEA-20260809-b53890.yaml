  sota_delta: ZERO on every attack axis; no attack is proposed. Either closes a family gap explicitly,
    which the inventor protocol requires of any deprioritization and which the program has never
    done for BIKE, or opens the one code-based target where the published attack surface is a
    live MODEL DISPUTE rather than a parameter re-costing -- and a contested model is a materially
    better target than a settled one.
  estimated_cost:
