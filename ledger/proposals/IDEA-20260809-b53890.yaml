idea:
  id: IDEA-20260809-b53890
  question_id: RQ-MCE-e65b3c
  added: '2026-08-09'
  title: BIKE is the one code-based KEM this program never framed -- including in two papers it
    cites whose titles name all three schemes, and one of which is cited directly by an existing
    research question
  class: control
  claim: 'The corpus holds the full BIKE cryptanalytic line -- KN-LIT-3735 (''Exploring Decryption
    Failures of BIKE: New Class of Weak Keys and Key Recovery Attacks''), KN-LIT-5730 (''Partial
    Key Exposure Attacks on BIKE''), KN-LIT-1963 (QC-MDPC decoder), KN-LIT-c2c4d0 (Hall-Goldberg-Schneier
    reaction attacks, ancestor of the whole decoding-failure family) -- plus two comparative papers
    the program has ALREADY ENGAGED WITH: KN-LIT-5677ae (''Security analysis of the Classic McEliece,
    HQC and BIKE schemes in low memory''), which RQ-MCE-e65b3c cites directly, and KN-LIT-de5373
    (''Security analysis for BIKE, Classic McEliece and HQC against the quantum ISD algorithms'').
    Verified at HEAD: the string BIKE returns ZERO matches across the entire ledger/ tree -- no
    question, goal, hypothesis, proposal, experiment, evidence or decision record -- and QC-MDPC
    and MDPC likewise return zero. The program instantiated two of the three schemes named in
    a paper it cites and never recorded why the third was dropped.'
  mechanism: 'Two cheap, separable moves, and the first may be the whole answer. (1) A ONE-PAGE
    SCOPE RECORD stating whether BIKE is deliberately out of scope and why -- if the answer is
    ''Round-4, not selected'', that is a legitimate answer and belongs on the record rather than
    being inferred from silence, and the inventor protocol requires exactly this of any deprioritization
    (evidence, budget, boundary, remaining uncertainty, successor or revisit condition). (2) IF
    IN SCOPE: transcribe from KN-LIT-3735 the weak-key class definition and its claimed density,
    and check that density against BIKE''s published parameter sets as a FINITE ARITHMETIC COMPUTATION
    -- no decoder implementation needed, no attack run. The DFR-model question RQ-HQC-001 poses
    for HQC then has a stated BIKE counterpart that the memory-charged ISD baseline work under
    IDEA-20260805-baa4da can be pointed at without re-deriving anything.'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-09'
    grep_results:
    - 'RQ-HQC-001 asks exactly the right question about exactly the wrong scheme for this literature:
      it asks whether HQC''s decoding-failure-rate model -- the analytic claim its IND-CCA security
      rests on -- is correct at its selected parameters under independent measurement. HQC''s
      DFR is analytically modelled and the scheme is IND-CCA on that model; BIKE is where the
      DFR model is genuinely CONTESTED, where weak-key classes are published (KN-LIT-3735), and
      where the reaction-attack lineage (KN-LIT-c2c4d0) actually bit. RQ-MCE-e65b3c is Goppa-code
      ISD and shares no attack surface with QC-MDPC decoding. Neither question''s scope mentions
      BIKE and neither closure names it as excluded -- so the absence is inferred from silence,
      which docs/inventor-protocol.md treats as premature closure rather than a decision.'
    conclusion: Screened against all 459 records in ledger/proposals, 271 in ledger/hypotheses
      and knowledge/; external novelty UNVERIFIED.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS as the primary lens: running any decoder or attack.
      The object is a SCOPE DECISION and, if in scope, a finite arithmetic check.'
    tracked_object: The weak-key class density claimed in the literature, evaluated against BIKE's
      published parameter sets.
    one_step_propagation_rule: Density is a closed-form function of the parameters; evaluating
      it at each published set is exact arithmetic and composes trivially.
    newness_score: Nil as mathematics. The content is that BIKE is the one code-based KEM this
      program never framed -- including in two papers it cites whose titles name all three schemes,
      one of which is cited directly by an existing research question.
  lossy_projection_identifiability_audit:
    projection: the scheme -> a weak-key density figure per parameter set.
    what_is_discarded: The decoder and everything about its behaviour.
    is_it_only_a_change_of_coordinates: 'NO -- the density is a coarse summary. Honest caveat:
      a WEAK object, and a density figure says nothing about whether a weak key is exploitable.'
    mirror_failure_check: CHECKED. The scope record must be able to conclude OUT OF SCOPE. 'Round-4,
      not selected' is a legitimate answer and belongs on the record rather than being inferred
      from silence -- and the inventor protocol requires exactly this of any deprioritization.
  null_object_control:
    primary_null: THE SCOPE RECORD IS THE FIRST DELIVERABLE AND MAY BE THE WHOLE ANSWER. Only
      if BIKE is in scope does the arithmetic check follow.
    secondary_nulls:
    - 'If in scope: transcribe the weak-key class definition and its claimed density from KN-LIT-3735
      and check that density against BIKE''s published parameter sets as a FINITE ARITHMETIC COMPUTATION
      -- no decoder implementation, no attack run.'
    - The DFR-model question RQ-HQC-001 poses for HQC then has a stated BIKE counterpart.
  assumptions: []
  predictions:
  - metric: scope verdict for BIKE, with the deprioritization elements the inventor protocol requires
    direction: different
    minimum_effect: A recorded verdict either way; today it is inferred from silence.
  - metric: weak-key density at published BIKE parameter sets, if in scope
    direction: different
    minimum_effect: Any figure; none exists in this corpus.
  minimal_test:
    design: Write the one-page scope record with evidence, budget, boundary, remaining uncertainty
      and a successor or revisit condition; if in scope, do the finite density computation from
      the transcribed definition.
    controls:
    - scope record as the primary deliverable
    - finite arithmetic only, no decoder
    - explicit out-of-scope option
    required_metrics:
    - scope verdict with the five required elements
    - weak-key density per parameter set if in scope
    - stated BIKE counterpart to RQ-HQC-001's DFR question
  falsification_conditions:
  - 'BIKE is legitimately out of scope (Round-4, not selected): the record says so and the gap
    closes properly rather than by silence. This is a fine and likely outcome.'
  - 'The weak-key density is negligible at published parameters: a clean negative.'
  - 'The density is non-negligible: a live question that the memory-charged ISD baseline would
    then need to price.'
  confounders:
  - Weak-key density claims are parameterisation-sensitive; transcribe the definition exactly.
  - A density figure is not an attack cost and must not be reported as one.
  - Round-4 status may change, which is a reason to record the scope decision with a revisit condition
    rather than to treat it as permanent.
  interpretation_limits:
  - A scope record plus finite arithmetic. No decoder is implemented and no attack is run.
  - Deciding scope is a Coordinator act; this record supplies the analysis such a decision needs.
  heuristic_assumptions:
