# IDEA-20261003-6d3894
# Dual-degree count. Proposal only. Not approved.
idea:
  id: IDEA-20261003-6d3894
  question_id: RQ-JINV-8fc13a
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    An isogeny of degree 2 and its dual both have degree 2
  class: measurement
  claim: >-
    An isogeny of degree 2 and its dual both have degree 2. Their
    gap is 0. Their product is 4. Their sum is 4. The identity has
    degree 1, and 2 exceeds 1 by 1. The gap against the identity is
    a degree label, not an ECDLP exponent and not a map square.
  mechanism: >-
    OBJECT FRAME. R3 is the isogeny. The operation set is taking
    the dual. The dual keeps the degree. Two identity maps both
    have degree 1, so that gap is 0. No point is mapped.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question treats End(E) as a ring and asks for any
        advantage beyond the automorphism discount.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-RHO-0528e7
      provenance: internal
      claim: >-
        The automorphism square-root factor is a different object
        from a dual degree.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The two degrees are frozen before the subtraction.
    - No point is mapped.
  proof_search_map:
    bottleneck: The degree gap 0 between an isogeny and its dual.
    baseline_embedding:
      parameter_slice: The degrees 2 and 2, and the identity degree 1.
      reproduction_check: >-
        Two readers must agree that 2 minus 2 is 0 and that 2
        exceeds 1 by 1.
    observation_collision:
      observable: The dual gap 0 and the product 4.
      distinct_preimage_search: >-
        Reporting the dual degree as 1 drops the match. Two
        identity maps make a gap of 0 as well, at degree 1.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The degrees 2 and 2.
        predicted_gain: Integer gap. No mapping of a point.
    quantifier_order: >-
      The isogeny degree is fixed before the dual degree.
    method_ceiling:
      strongest_certifiable_claim: >-
        The dual gap 0 and the product 4. Not a map square.
      nearby_object_control: >-
        Two identity maps. Both have degree 1, and the gap is 0.
    proof_obligations:
      - claim: The isogeny and its dual both have degree 2.
        responsibility: size
      - claim: Their product is 4.
        responsibility: correctness
      - claim: Two exceeds the identity degree 1 by 1.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: dual_gap
      direction: different
      minimum_effect: The gap of the two degrees is 0.
  minimal_test:
    design: >-
      Subtract 2 from 2 and multiply 2 by 2. Do not map a curve point.
    controls:
      - Two identity degrees, whose gap is 0.
      - An independent count.
    required_metrics:
      - both degrees
      - the gap
      - the product
  falsification_conditions:
    - The gap is not 0.
    - The product of the two degrees is not 4.
  confounders:
    - The degree of multiplication by 2 as a rational map is a different number from this isogeny degree.
  interpretation_limits:
    - A dual degree is not a walk length.
    - No transfer to a cryptographic isogeny.
    - This is not the square of 2 read as a map degree.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen isogeny and its frozen dual both have degree 2,
        and the frozen identity has degree 1.
      rigorous_support: >-
        No dual-isogeny theorem is re-proved here. The count is a
        reading of three degree labels.
      validation_plan: >-
        Two independent readings. A mismatch voids the gap.
