  title: >-
    Multiplication by 22 has degree 484 and multiplication by 21 has degree 441
  class: measurement
  claim: >-
    Multiplication by 22 has degree 484. Multiplication by 21 has
    degree 441. Four hundred eighty-four exceeds four hundred
    forty-one by 43. The product of the two degrees is 213444. Their
    sum is 925. The gap is a map degree, not an ECDLP exponent and not
    the degree pair 441 and 400.
  mechanism: >-
    OBJECT FRAME. R3 is the multiplication endomorphism. The
    operation set is reading the degree, which is coordinate-dependent
    on the integer multiplier and is not a translation of a curve
    point. Twenty-two squared is 484. Twenty-one squared is 441. Two
    maps of degree 441 have gap 0 and product 194481. No point is mapped.
  novelty_status: unverified
