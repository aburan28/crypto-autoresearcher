# IDEA-20261004-259f16
# Wider window-table count. Proposal only. Not approved.
idea:
  id: IDEA-20261004-259f16
  question_id: RQ-ECDLP-002
  added: '2026-10-04'
  status: proposed
  approved_by: null
  title: >-
    A width-31 window table stores 1073741824 entries and a width-30 table stores 536870912
  class: representation
  claim: >-
    A window of width 31 stores 1073741824 precomputed entries. A window of
    width 30 stores 536870912. One billion seventy-three million seven
    hundred forty-one thousand eight hundred twenty-four exceeds five
    hundred thirty-six million eight hundred seventy thousand nine hundred
    twelve by 536870912. The product of the two table sizes is
    576460752303423488. Their sum is 1610612736. The gap is a table size,
    not an ECDLP exponent.
  mechanism: >-
    OBJECT FRAME. The object is the precomputed table. The operation
    set is reading one entry during a recoding. Two to the power
    30 is 1073741824. Two to the power 29 is 536870912. Two width-30 tables both
    store 536870912, so that gap is 0 and their product is 288230376151711744. No
    curve point is added.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-002
      provenance: internal
      claim: >-
        The question asks for a checkable route toward an attack-cost change.
      verified_by: coordinator session 2026-10-04, question file present
    - ref: KR-RHO-ea34b8
      provenance: internal
      claim: >-
        Precomputation-table bounds are a different scale from these two sizes.
      verified_by: coordinator session 2026-10-04, frontier row on disk
  assumptions:
    - The two widths are frozen before the powers are taken.
    - No curve point is added.
  proof_search_map:
    bottleneck: The table-size gap 536870912.
    baseline_embedding:
      parameter_slice: The widths 31 and 30 and the sizes 1073741824 and 536870912.
      reproduction_check: >-
        Two readers must agree that 2 to the power 30 is 1073741824 and that
        2 to the power 29 is 536870912.
    observation_collision:
      observable: The table-size gap and the product.
      distinct_preimage_search: >-
        Reporting both tables as size 536870912 drops the gap. Two width-30
        tables make that gap 0.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The width-30 table.
        predicted_gain: Five hundred thirty-six million eight hundred seventy thousand nine hundred twelve fewer stored entries. No exponent.
    quantifier_order: >-
      The widths are fixed before the sizes.
    method_ceiling:
      strongest_certifiable_claim: >-
        The table sizes 1073741824 and 536870912. Not a scalar multiplication.
      nearby_object_control: >-
        Two width-30 tables. Both store 536870912, and the gap is 0.
    proof_obligations:
      - claim: The width-31 table stores 1073741824 entries.
        responsibility: size
      - claim: The width-30 table stores 536870912 entries.
        responsibility: size
      - claim: The gap is not an exponent.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: table_gap
      direction: different
      minimum_effect: One billion seventy-three million seven hundred forty-one thousand eight hundred twenty-four exceeds five hundred thirty-six million eight hundred seventy thousand nine hundred twelve by 536870912.
  minimal_test:
    design: >-
      Compute 2 to the power 30 and 2 to the power 29. Do not add a
      curve point.
    controls:
      - Two width-30 tables, whose size gap is 0.
      - An independent count.
    required_metrics:
      - both table sizes
      - the gap
      - the product
  falsification_conditions:
    - The width-31 table size is not 1073741824.
    - The product of the two sizes is not 576460752303423488.
  confounders:
    - A width-30 table of size 536870912 is a different window from a width-29 table of size 268435456.
  interpretation_limits:
    - A table size is not a walk length.
    - No transfer to a cryptographic scalar.
    - This is not the table-size pair 536870912 and 268435456.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen width-31 table has size 2 to the power 30, and the
        frozen width-30 table has size 2 to the power 29.
      rigorous_support: >-
        No scalar-multiplication theorem is claimed. The count is
        a reading of two powers of 2.
      validation_plan: >-
        Two independent powers. A mismatch voids the gap.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: One billion seventy-three million seven hundred forty-one thousand eight hundred twenty-four stored entries versus five hundred thirty-six million eight hundred seventy thousand nine hundred twelve, a constant factor.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: Recoding cost is not counted.
    tradeoff_note: A larger table can shorten digits and does not by itself shorten a walk.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
