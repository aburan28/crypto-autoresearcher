idea:
  id: IDEA-20260805-f9e801
  question_id: RQ-WESO-8aff57
  added: '2026-08-05'
  title: >-
    The published middle-memory line is a SECTION, not a frontier: the smoothness
    bound B is optimised for the full-memory corner and then held fixed while the
    memory budget slides, and the paper's own five-row cost table has never been
    reproduced from the paper's own stated model
  class: control

  claim: >-
    TWO SEPARABLE CLAIMS, THE FIRST OF WHICH IS A PURE ARITHMETIC CHECK COSTING
    SECONDS AND WHICH THIS PROGRAMME HAS NEVER RUN IN FOUR BATCHES.
    (1) REPRODUCIBILITY OF THE PUBLISHED TABLE. Section 4.1 of the frozen paper
    states a complete cost model -- M = Psi(X,B) X with X = B^{1/2}(p/2)^{1/6},
    one F_{p^2}-operation per entry, memory ~ M, time ~ M/P0, P0 estimated as in
    Lemma 3.5, B optimised for best time -- and then publishes five rows of
    output: (256 bits, >= 2^106.5 ops, memory >= 2^92.5), (384, 2^157.5,
    2^138.6), (512, 2^204.2, 2^181.3), (576, 2^230.9, 2^206.0), (768, 2^302.4,
    2^272.2). A model plus its outputs is a FORCED VALUE. Either an independent
    re-implementation of the stated model returns those ten numbers, or it does
    not; and this goal has spent three batches calibrating the CONSTANT that
    multiplies M without ever checking that the published table follows from the
    published model. Both outcomes are useful, and the failure outcome is more
    useful.
    (2) THE INTERPOLATION IS NOT THE FRONTIER. The paper optimises B for the
    high-memory corner and then writes the middle-memory regime as
    p^{1/2+o(1)}/w^{1/2}, sliding w while B stays at its corner-optimal value.
    But B is a free parameter of the algorithm at EVERY memory budget, and the
    memory-constrained objective weights the table size differently: writing
    log T_hi = log M - log P0 for the full-memory branch and
    log T_w = (3/2) log M - (1/2) log w - log P0 for the memory-w branch, the
    coefficient on log M rises from 1 to 3/2 while the coefficient on -log P0
    stays at 1. The optimiser must therefore trade table size for retries
    differently, and the optimal B at memory w is strictly smaller than the
    optimal B at memory M for every w < M. Consequently the published line is an
    UPPER BOUND on the algorithm's own frontier, touching it only at the
    right-hand corner. Together with IDEA-20260805-07ff43's free parameter Y,
    the true frontier is a two-parameter minimisation over (Y, B) at each memory
    budget and the published curve is a one-dimensional section through it.
    NO EXPONENT MOVES. Both branches are p^{1/2+o(1)}/w^{1/2} because every term
    that differs is p^{o(1)}. The claim is entirely about the p^{o(1)}, which is
    exactly where this goal's own residual lives: DEC-20260802-48c72c records the
    remaining NIST-I margin width as 13.94 to 16.62 bits, dominated by terms
    inside that o(1). A proposal that says plainly "this moves no exponent, and
    the exponent is not where this goal's uncertainty is" is being honest about
    the target-result profile rather than dressing a cofactor as an exponent.

  object_first_candidate:
    tracked_object: >-
      The EXPONENT BUDGET SPLIT: the pair (a, b) where a = log_p(table size M)
      and b = log_p(retry count 1/(rho * P0)), followed as a function of the
      free parameters (Y, B) and of the memory budget. Every cost statement in
      the frozen paper is a statement about a + b or, in the memory-constrained
      branch, about (3/2)a + b - (1/2)log_p w. The tracked object is the point
      (a, b) in the plane, and the algorithm's design freedom is precisely the
      curve of admissible (a, b) that (Y, B) sweeps out.
    established_families_off_limits: >-
      Off-limits as the PRIMARY lens: van Oorschot-Wiener parallel collision
      search and every distinguished-point variant (they are the incumbent lens
      and re-deriving them in new notation is the regression this rule exists to
      prevent); claw-finding and meet-in-the-middle as ALGORITHMS rather than as
      cost terms; Delfs-Galbraith and its accelerations; quaternion/KLPT methods;
      and -- explicitly -- the per-entry-cost calibration lane of BATCH-002 and
      BATCH-003 (EXP-PEC-6be870, EXP-PEC-49c773, EV-PEC-2e67ff, EV-PEC-857664).
      That lane is off-limits both as lens and as INPUT: no c value, no gamma
      value and no margin row from it is used, cited as support, or contradicted
      anywhere in this proposal. A per-entry constant multiplies M identically at
      every (Y, B, w) and therefore translates the whole frontier without
      changing its shape or the location of its optimum, which is the only
      interaction between the two lanes and is stated here so that a reviewer can
      check that no other one is smuggled in.
    newness_score: >-
      Re-optimising a free parameter under a changed objective is not a new
      technique and this record makes no such claim; it is the most ordinary move
      in cost modelling. What is new here is only that nobody has done it for
      THIS algorithm, and that the paper itself does not: the paper's sentence
      about van Oorschot-Wiener is an aside in the introduction, and its Section
      4.1 optimisation is performed once, for the corner. The check in claim (1)
      is likewise elementary and is new only in the sense that it has not been
      run.
    testability_score: >-
      As high as it gets in this goal. Claim (1) is deterministic arithmetic in
      pure Python with numpy already present in the container (verified this
      session: numpy 2.4.6 imports; sympy and SageMath do NOT). Claim (2) is a
      one-dimensional minimisation of a smooth explicit function, repeated over a
      grid of memory budgets. Total compute: seconds. No network. No solver.
    survival_score: >-
      Claim (1) survives to a definite verdict at essentially zero cost and
      cannot be inconclusive: the reconstruction either reproduces the table or
      it does not, and if it does not the discrepancy is itself the finding.
      Claim (2) survives to a quantified frontier whose distance from the
      published line is a number of bits, and the sign of that number is forced
      (non-negative, zero at the corner).

  mechanism: >-
    All logarithms natural unless written log2. Put L = log(p/2), beta = log B,
    t = L/beta.

    PART A - THE RECONSTRUCTION, WRITTEN OUT SO IT CAN BE CHECKED LINE BY LINE.
    From the frozen paper, Section 4.1 and the proof of Theorem 1.1:
      X       = B^{1/2} (p/2)^{1/6},          log X = beta/2 + L/6
      w'      = log X / log B = 1/2 + L/(6 beta) = 1/2 + t/6
      Psi(X,B)= X * w'^{-w'(1+o(1))}          (Theorem 1.4, quoted in the paper)
      M       = Psi(X,B) * X                  (Section 4.1, "the size of the
                                               tables ... is at least M = Psi X")
      u       = log(p/2)/(3 log B) = t/3
      P0      = u^{-u(1+o(1))}                (Lemma 3.5)
      TIME    = M / P0   F_{p^2}-operations,  MEMORY = M.
    Hence, dropping the (1+o(1)) exactly as Section 4.1 does when it computes
    numbers:
      log M(beta)   = 2 log X - w' log w' = beta + L/3 - (1/2 + t/6) log(1/2 + t/6)
      -log P0(beta) = u log u = (t/3) log(t/3)
      log TIME(beta)= log M(beta) + (t/3) log(t/3).
    The paper's own asymptotic choice beta = (1/3) sqrt(L) gives t = 3 sqrt(L),
    u = sqrt(L), w' ~ sqrt(L)/2, and log TIME = L/3 + O(sqrt(L) log L), which is
    p^{1/3+o(1)} as claimed -- so the reconstruction is self-consistent at the
    asymptotic level before any number is computed. The NUMERICAL claim is that
    minimising log TIME(beta) over beta > 0 at log2 p in {256, 384, 512, 576,
    768} returns the ten published values. AMBIGUITIES THAT MUST BE RESOLVED AND
    RECORDED, NOT GUESSED: whether Psi and P0 are evaluated with u^{-u} or with
    the Dickman-de Bruijn rho(u) (the paper writes both -- Heuristic 1 uses
    u^{-u(1+o(1))} while Section 4.2 compares data against "rho(u)"); whether
    log means log2 or natural log in "log(p/2)"; and whether the -u log u form or
    the exact rho is used at these small u. The reconstruction must be run under
    ALL declared variants and the variant that reproduces the table identified.
    IF NO VARIANT REPRODUCES THE TABLE, THAT IS THE RESULT, and it is reported as
    a reproducibility finding about a published cost model, never as a
    mathematical objection to Theorem 1.1, which is untouched by it.

    PART B - WHY THE OPTIMUM MOVES UNDER A MEMORY BUDGET. In the memory-w branch
    the per-attempt claw cost rises from M to sqrt(M^3/w) (the frozen paper's own
    quoted van Oorschot-Wiener form with N = M), while the retry count 1/P0 is
    unchanged, so
      log T_w(beta) = (3/2) log M(beta) - (1/2) log w + (t/3) log(t/3).
    Substituting log M and writing the beta-dependence in terms of t:
      log T_w(t) = L/2 + (3/2)(L/t) - (3/2) w' log w' + (t/3) log(t/3) - (1/2) log w
    with w' = 1/2 + t/6. For large t the two p^{o(1)} terms combine as
      -(3/2)(t/6) log(t/6) + (t/3) log(t/3)
        = t[(1/3 - 1/4) log t - (1/3) log 3 + (1/4) log 6]
        = t[(1/12) log t + 0.0817...],
    whereas the full-memory branch gives
      log T_hi(t) = L/3 + L/t - (t/6) log(t/6) + (t/3) log(t/3)
                  = L/3 + L/t + t[(1/6) log t - 0.0676...].
    The stationarity conditions are therefore
      memory-w:   t^2 [(1/12) log t + 0.1651...] = (3/2) L
      full-memory: t^2 [(1/6)  log t + 0.0991...] = L,
    so the memory-constrained optimum sits at a strictly LARGER t, i.e. a
    strictly SMALLER B, for every w < M: halving the coefficient on log t while
    multiplying the right-hand side by 3/2 moves t up by a factor tending to
    sqrt(3) ~ 1.73, i.e. beta down by ~0.58, i.e. B_w ~ B_corner^{0.58}. THE
    DIRECTION IS FORCED AND IS DERIVED BEFORE ANY RUN: under a memory budget the
    algorithm should build a SMALLER table and accept MORE retries than the
    published parameterisation does. The size of the resulting saving is a number
    of bits and is NOT asserted here, because asserting it without running the
    arithmetic would be exactly the fabrication AGENTS.md rule 9 forbids.

    PART C - THE FORCED ZERO, WHICH IS THE NULL THAT CAN FAIL. At w = M the two
    objectives are algebraically identical: (3/2) log M - (1/2) log M = log M. So
    the re-optimised B at w = M must equal the published B, and the reported gain
    must be EXACTLY 0.000 bits, at every one of the five parameter sets, for the
    optimiser to be trusted at all. This is a null of the same shape as the
    treatment (same objective family, same optimiser, same grid) whose value is
    derived before the run and which CAN fail: any optimiser bug, any grid
    coarseness, any sign error shows up here as a nonzero gain at the corner.

    PART D - A SUB-VARIANT CHECKED AND REJECTED, WITH ITS ARGUMENT RATHER THAN AS
    A TALLY. One might hope to amortise the K = 1/(rho P0) independent attempts
    by running a SINGLE van Oorschot-Wiener instance over the concatenation of
    all K tables, since the concatenation contains one golden claw. Cost
    sqrt((KM)^3/w) = K^{3/2} sqrt(M^3/w) against K * sqrt(M^3/w) for running them
    separately: the concatenation is WORSE by a factor K^{1/2}. The mechanism is
    that van Oorschot-Wiener's cost is superlinear in the domain size while the
    number of golden claws does not grow with the concatenation, so pooling
    dilutes. Rejected, with the obstruction named; forward guidance: pooling
    would pay only if the number of golden claws grew at least linearly with K,
    which would require the attempts to share their claws, which they do not
    because each uses a fresh random curve.

    PART E - WHAT THE TWO-PARAMETER FRONTIER IS. Combining with the free
    parameter Y of IDEA-20260805-07ff43: at parameter (Y, B) the algorithm has
      M(Y,B) = Psi(X_Y, B) X_Y,  X_Y = B^{1/2} Y^{1/2},
      retries = 1/(rho_p(Y) P0(Y,B)),  rho_p(Y) = 8 Y^{3/2} p^{-1/2+o(1)},
    and at a memory budget w one may either hold the whole table (w >= M, cost
    M * retries) or run a claw search in memory w (cost sqrt(M^3/w) * retries).
    The frontier is the lower envelope over (Y, B) of both branches at each w.
    The published line is the single curve obtained by fixing Y = (p/2)^{1/3},
    fixing B at its Y-corner optimum, and sliding w. THE ENVELOPE IS BELOW OR
    EQUAL TO THE SECTION EVERYWHERE, WITH EQUALITY AT THE CORNER, BY CONSTRUCTION
    -- which is why the sign of the result is not in doubt and only its magnitude
    is worth measuring.

  novelty_status: unverified

  literature_context:
    - >-
      Benjamin Wesolowski, "The supersingular isogeny problem in time and memory
      p^{1/3+o(1)}". READ IN FULL at inputs/P13-WESOLOWSKI-2026/paper_fulltext.md.
      Every formula and every one of the ten numbers used above is quoted from
      that file: Section 4.1's model and table, Lemma 3.3, Lemma 3.5, Theorem
      1.4, and the Section 1.1 sentences on van Oorschot-Wiener. The paper's own
      caveat is quoted rather than paraphrased: "these estimates make optimistic
      assumptions on the actual cost of certain steps, hence should not be
      interpreted as accurate predictions."
    - >-
      P. C. van Oorschot and M. J. Wiener, J. Cryptology 12(1), 1999, the frozen
      paper's [43]. NOT READ. The form sqrt(N^3/w) is used ONLY as quoted from
      the frozen paper. In particular this record does NOT assert the constant
      2.5 that is commonly attached to that formula, does not assert how the cost
      behaves when there are several golden collisions, and treats both as open
      questions rather than as background knowledge.
    - >-
      Adj-Cervantes-Vazquez-Chi-Dominguez-Menezes-Rodriguez-Henriquez (frozen
      paper's [3]) and Costello-Longa-Naehrig-Renes-Virdia ([16]), named by the
      paper as the references for "extensive practical considerations on the van
      Oorschot-Wiener algorithm". NOT READ -- relayed claim. These are the two
      sources that would supply the concrete constants the reconstruction leaves
      open, and retrieving them is a named stage of the paired contract rather
      than an assumption. This is also the item this goal's own next_action has
      carried as "the free bibliographic subtask" through three consecutive
      red-team reports without execution; this proposal gives it a use, which is
      the only way such an item ever gets run.
    - >-
      Internal, and named to bound this proposal rather than to support it:
      EV-PEC-2e67ff and EV-PEC-857664 refuted Section 4.1's one-operation-per-
      entry convention and bracketed the correction. This proposal takes Section
      4.1's model AS WRITTEN, including that convention, because claim (1) is a
      reproducibility check of the PUBLISHED table and substituting a corrected
      constant would make reproduction impossible by construction. The corrected
      constant enters only as a stated post-hoc translation of the frontier, and
      no number from that lane is reused.

  lossy_projection_identifiability_audit:
    projection: >-
      The full algorithm -- curves, isogenies, modular polynomials, walks, table
      layout -- is projected to the two real numbers (a, b) = (log_p M,
      log_p(retry count)), and the cost of every variant is a fixed linear
      functional of (a, b) determined by the memory regime.
    what_is_discarded: >-
      All arithmetic detail: which curve, which primes, which representation,
      what a table entry costs, what an F_{p^2}-operation costs, cache behaviour,
      parallel communication. Everything except two exponents.
    why_genuinely_lossy: >-
      Enormously lossy -- the fibre over a point (a, b) is every algorithm with
      those two exponents, an infinite family with wildly different constants.
      And the loss is exactly what the goal's own history proves is dangerous:
      BATCH-002 and BATCH-003 measured that one discarded coordinate, the
      per-entry cost, and found it was 1843 to 94023 rather than the assumed 1.
      So this projection is known to discard something that matters by four
      orders of magnitude, and the projection is used here ONLY for a quantity
      that is invariant under it.
    why_compatible_with_the_operations: >-
      Compatible in the precise sense that matters: the operation this proposal
      performs is minimisation of a cost functional over (Y, B), and a constant
      multiplying M is an ADDITIVE CONSTANT in log-space that is independent of
      (Y, B) and therefore does not move the argmin. So the discarded coordinate
      cannot change the answer to the question being asked -- where the optimum
      is -- although it certainly changes the answer to a question this proposal
      does not ask -- how many operations the optimum costs. That distinction is
      the whole justification for the projection and is stated so a reviewer can
      attack it.
    is_it_only_a_change_of_coordinates: >-
      NO. Both failure modes checked.
      NOT failure mode 1 (nothing discarded): the fibre is infinite, see above.
      NOT failure mode 2 (constant across instances, zero comparator spread):
      THIS IS THE ONE THAT NEEDED CHECKING, because a cost functional evaluated
      at a fixed parameter really is a constant. The comparator here is the GAIN
      (published-line cost minus re-optimised cost) as a function of the memory
      budget w, and its spread is forced to be non-degenerate for a structural
      reason: it is exactly 0 at w = M by the algebraic identity in PART C, and
      it is strictly positive for w < M by the strict inequality between the two
      stationarity conditions in PART B. So the comparator provably varies. If
      the measured gain were constant in w -- in particular if it were nonzero at
      w = M -- that would be the artifact tell and the null control fires.

  assumptions:
    - >-
      That Section 4.1's stated model is complete enough to reproduce the table.
      It may not be: the paper says "optimizing B for best time" without stating
      the optimiser, the grid, or whether B is constrained to primes. Every such
      gap is enumerated in the contract as a declared variant and swept, rather
      than filled in by guessing and reported as a match.
    - >-
      That the van Oorschot-Wiener cost for this instance really is
      sqrt(M^3/w) at the exponent level. Taken from the frozen paper, NOT
      independently derived, and flagged: the standard derivation assumes the
      claw is one golden collision among ~M spurious ones, and the number of
      spurious collisions in this instance is a measurable quantity that
      IDEA-20260805-b4bc59 addresses. If it is materially different, the
      coefficient 3/2 changes and PART B's conclusion changes with it. The
      DIRECTION of PART B's conclusion, however, survives any coefficient
      strictly greater than 1.
    - >-
      That memory is charged as the table size in entries. Bits-per-entry, and
      whether an entry is a j-invariant (2 log2 p bits) or a full isogeny
      representation, are NOT settled by the paper and are recorded as an open
      factor of order log p that shifts memory rows uniformly.

  predictions:
    - metric: >-
        table_reproduction_error: max over the five published parameter sets and
        over both columns of |reconstructed log2 value - published log2 value|,
        under the best-fitting declared model variant
      direction: lower
      minimum_effect: >-
        FORCED TARGET 0.05 bits, tolerance 0.5 bits, since the published values
        carry one decimal place. A max error <= 0.5 bits across all ten numbers
        is REPRODUCTION. A max error > 2 bits under EVERY declared variant is a
        REPRODUCTION FAILURE and is the headline finding of the stage; between
        0.5 and 2 bits the result is "reproduced only under a variant the paper
        does not state", which must be reported with the variant named.
    - metric: >-
        corner_gain_bits: (published-line cost) minus (re-optimised cost) at
        memory w = M, in bits, at each of the five parameter sets
      direction: different
      minimum_effect: >-
        EXACTLY 0.000, to within the optimiser's declared numerical tolerance of
        1e-6 bits. This is an algebraic identity (PART C), not an expectation.
        A nonzero corner gain means the optimiser or the objective is wrong and
        NO frontier result may be reported from that run.
    - metric: >-
        reopt_gain_bits(w): (published-line cost) minus (two-parameter
        re-optimised cost) at memory budgets w = M * 2^{-k}, k in {0, 8, 16, 24,
        32, 48, 64}, at log2 p = 256
      direction: higher
      minimum_effect: >-
        Strictly >= 0 at every w, by construction (the envelope is below the
        section). Strictly > 0 for every w < M, by the strict inequality of the
        two stationarity conditions. NON-DECREASING as w decreases, at all seven
        grid points -- this is the graded monotonicity requirement and a
        violation localises an optimiser or model defect to a specific w rather
        than leaving "it did not work". NO BIT COUNT IS PREDICTED, deliberately:
        the magnitude is what the run is for.
    - metric: >-
        beta_ratio: (optimal log B at memory w) / (optimal log B at memory M),
        at log2 p = 256 and at the smallest w on the grid
      direction: lower
      minimum_effect: >-
        Strictly below 1.0, with an asymptotic target of about 0.58 derived in
        PART B. At log2 p = 256 the asymptotic ratio is not expected to be
        attained and the pre-registered admissible band is [0.40, 0.95]. A ratio
        >= 1.0 contradicts the derivation outright.
    - metric: >-
        dg_crossover_bits: the memory budget w at which the re-optimised frontier
        first beats the Delfs-Galbraith baseline that the frozen paper quotes as
        2^128 F_{p^2}-operations at log2 p = 256 with negligible memory
      direction: lower
      minimum_effect: >-
        Reported as a number of bits of memory, with the published-line crossover
        reported beside it. NO VALUE IS PREDICTED. What IS pre-registered is that
        the re-optimised crossover must be at a memory budget less than or equal
        to the published-line crossover, since the re-optimised cost is pointwise
        no larger. A strictly larger crossover is impossible and would indicate a
        defect.

  minimal_test:
    design: >-
      Four stages, cheapest-first, and stage 1 alone can end the line.
      STAGE 1 (seconds, pure Python + numpy which is verified present): implement
      Section 4.1's model under every declared variant and attempt to reproduce
      the ten published numbers. If no variant reproduces them, STOP and report a
      reproducibility finding; the frontier work is not meaningful against a
      model that does not reproduce its own published output.
      STAGE 2 (seconds): the forced-zero null at w = M, and the flat null.
      STAGE 3 (minutes): the two-parameter (Y, B) envelope over the memory grid,
      at all five parameter sets, with local slopes reported.
      STAGE 4 (zero compute): the Delfs-Galbraith crossover, and a statement of
      what changes if the per-entry constant is not 1 -- which is a pure
      translation and must be shown to be one.
    controls:
      - >-
        NULL 1, FORCED VALUE, CAN FAIL: corner gain at w = M must be exactly 0
        (PART C). Same optimiser, same grid, same objective family as the
        treatment -- a matched null, not a decoration. If it returns nonzero,
        nothing else in the run may be reported.
      - >-
        NULL 2, FLAT NULL, FORCED VALUE, CAN FAIL: run the identical optimiser on
        a DEGENERATE instance with no smoothness structure -- Psi(X,B) := X (every
        integer smooth) and P0 := 1 (no retries). Then log TIME = 2 log X =
        beta + L/3 is monotone increasing in beta with no interior optimum, both
        branches select the same boundary B, and the re-optimisation gain is
        forced to be EXACTLY 0 at every w. If the optimiser reports a nonzero
        gain on this instance it is finding a spurious interior optimum, and the
        treatment gains are numerical artefacts.
      - >-
        POSITIVE CONTROL / NEARBY OBJECT WHERE THE EFFECT MUST APPEAR: the
        published table itself (stage 1). It is a nearby object -- the same model
        at the same parameters -- on which the instrument MUST produce the known
        answer. If it cannot reproduce ten published numbers from a stated model,
        the instrument has no demonstrated sensitivity and no negative result
        about the frontier may be reported.
      - >-
        GRADED CONTROL, 7 interior points, monotonicity reported: the memory
        sweep w = M * 2^{-k}, k in {0, 8, 16, 24, 32, 48, 64}. Report the gain
        AND its local slope at every point. A non-monotone gain localises the
        defect to a memory decade.
      - >-
        VARIANT SWEEP AS A CONTROL AGAINST OVERFITTING: the declared model
        variants (u^{-u} versus Dickman rho; log2 versus natural log; B free
        versus B prime) are enumerated and FROZEN BEFORE the run, and every
        variant's reproduction error is reported. Selecting the variant after
        seeing which one matches is legitimate only if the full table of variants
        is published alongside, and the contract requires it.
      - >-
        ORDERING RULE: the two nulls and the variant sweep are executed and
        committed BEFORE the frontier arm is computed or looked at.
    required_metrics:
      - the ten reconstructed values against the ten published values, per variant
      - corner gain at w = M, to 1e-6 bits, per parameter set
      - flat-null gain at every w, to 1e-6 bits
      - gain and local slope at all seven memory grid points, all five parameter sets
      - optimal (Y, B) at every grid point, and beta_ratio
      - the exact source line of every published number used, quoted

  falsification_conditions:
    - >-
      No declared model variant reproduces the published table within 2 bits. The
      frontier claim cannot be evaluated against a model that does not reproduce
      itself, and the deliverable becomes a reproducibility finding about
      Section 4.1 -- which is a first-class negative and is what the stage is
      for.
    - >-
      The corner gain at w = M is not zero. The optimiser is wrong; nothing may
      be reported.
    - >-
      The flat null returns a nonzero gain. The gains are numerical artefacts.
    - >-
      beta_ratio >= 1.0 at every memory budget. PART B's derivation is wrong and
      the proposal's second claim is refuted.
    - >-
      The gain is non-monotone in the memory budget with no identifiable cause.
      The two-parameter envelope is not being computed correctly.

  confounders:
    - >-
      MODEL-VARIANT DEGREES OF FREEDOM. With three declared binary choices there
      are eight variants, and the chance that one of them reproduces ten numbers
      by accident is not negligible if the tolerance is loose. Mitigation: the
      tolerance is 0.5 bits on TEN numbers simultaneously, the full variant table
      is reported, and the variant set is frozen before the run.
    - >-
      THE PUBLISHED NUMBERS ARE THEMSELVES LOWER BOUNDS. Section 4.1 writes ">="
      throughout and calls its own estimate "a rough underestimation". A
      reconstruction that lands slightly below the published values is therefore
      consistent, and the tolerance is two-sided only because the published
      values also carry a stated optimism in the opposite direction (P0 may be
      underestimated per Remark 1). Both directions are declared before the run.
    - >-
      o(1) VERSUS CONSTANT. Every quantity in play is p^{o(1)}, so at the five
      finite parameter sets there is no asymptotic regime and the "derived
      direction" of PART B is an asymptotic statement being applied at finite p.
      The pre-registered admissible band on beta_ratio is deliberately wide for
      exactly this reason.
    - >-
      THE VW COST FORM IS INHERITED, NOT DERIVED. If the true middle-memory cost
      exponent is not 3/2, PART B's coefficient changes. The direction survives
      any exponent > 1, and that robustness is stated rather than relied on
      silently.

  interpretation_limits:
    - >-
      NO EXPONENT MOVES, AND THIS RECORD SAYS SO WHERE THE READER CANNOT MISS IT.
      Both the published section and the re-optimised envelope are
      p^{1/2+o(1)}/w^{1/2}. The entire content is inside the o(1). It is proposed
      anyway because this goal's own committed position (DEC-20260802-48c72c) is
      that its residual uncertainty is 13.94 to 16.62 bits wide and lives
      entirely inside that o(1), so a proposal that moved an exponent would be
      answering a question this goal does not have.
    - >-
      A reproduction failure at stage 1 is a finding about a published COST
      TABLE. It is not an objection to Theorem 1.1, to Corollary 1.2, to
      Heuristic 1, or to any mathematical claim in the paper, and no record
      derived from it may say otherwise.
    - >-
      Claim tier: theory/derivation for the algebra, and for the arithmetic a
      TOOL-VERIFICATION tier that is not an empirical measurement of anything --
      no curve is touched, no isogeny is computed, and the output is a property of
      a formula, not of the world.
    - >-
      NO STATUS CHANGE to H-WESO-001 or GOAL-P13-001 is proposed or implied, and
      nothing here bears on completion criterion 1, which concerns an empirical
      per-entry calibration this proposal deliberately does not touch.

  heuristic_assumptions:
    - id: HB-1
      statement: >-
        NONE OF THE PROPOSAL'S PRIMARY CONTENT IS HEURISTIC. Claim (1) is a
        deterministic recomputation of a published model. PART C's forced zero is
        an algebraic identity. PART B's direction is a comparison of two
        stationarity conditions. This entry exists to record that, and to isolate
        the two places where an assumption does enter, HB-2 and HB-3.
      rigorous_support: n/a
      validation_plan: n/a
    - id: HB-2
      statement: >-
        The middle-memory cost of the claw step is C * M^{3/2} w^{-1/2} for some
        M- and w-independent C.
      rigorous_support: >-
        Quoted from the frozen paper's Section 1.1, which attributes it to [43].
        NOT independently derived here and [43] NOT READ. The standard derivation
        assumes one golden collision among Theta(M) spurious ones; whether that
        holds for this instance is a separate measurable question addressed by
        IDEA-20260805-b4bc59.
      validation_plan: >-
        Retrieve [43], [3] and [16] and record the exponent and the constant
        verbatim with page references; report the reconstruction under the
        published constant as well as under C = 1. This is the bibliographic
        subtask that three red-team reports have requested, given a concrete use.
    - id: HB-3
      statement: >-
        rho_p(Y) = 8 Y^{3/2} p^{-1/2+o(1)}, imported from IDEA-20260805-07ff43 to
        make the second parameter Y meaningful.
      rigorous_support: >-
        Derived in that proposal from a class-number count with two exact
        anchors, and NOT YET MEASURED. Load-bearing only for the Y-axis of the
        envelope; the B-axis result of PART B is entirely independent of it, and
        the contract computes the B-only envelope separately so that HB-3's
        failure cannot contaminate it.
      validation_plan: >-
        Report the B-only envelope and the (Y,B) envelope as separate arms. The
        Y-axis is validated by EXP-WESO-f5166c, not here.

  target_complexity:
    time_exponent: >-
      Unmoved: p^{1/2+o(1)} w^{-1/2} in the memory-constrained branch and
      p^{1/3+o(1)} at the corner, before and after. The proposal's own exponent
      contribution is exactly zero and it is stated plainly rather than dressed
      up. What is targeted is the o(1), measured in bits at five standardised
      parameter sets, which is the axis this goal's residual actually lies on.
    memory_exponent: >-
      Unmoved as an exponent; the memory budget is the sweep variable. Memory is
      charged in TABLE ENTRIES throughout and the entry width in bits is recorded
      as an unresolved factor of order log p, declared rather than hidden.
    best_known: >-
      As quoted from the frozen paper: p^{1/3+o(1)} time and memory (Theorem
      1.1); p^{1/2}(log p)^{O(1)} time with negligible memory (Delfs-Galbraith);
      the interpolation p^{1/2+o(1)}/w^{1/2}; and the five-row concrete table of
      Section 4.1.
    hidden_overhead: >-
      This proposal is entirely ABOUT the hidden overhead and charges three
      components explicitly: Psi's smoothness loss, P0's retry factor, and the
      memory-regime exponent. It does NOT charge the per-entry F_{p^2}-operation
      cost (deliberately, so that claim (1) is a reproduction of the published
      table), nor bits per entry, nor parallel communication. Those three are
      named as uncharged.
    tradeoff_note: >-
      The deliverable IS a tradeoff curve. Axes charged: time and memory.
      Data/queries: structurally empty for this problem and recorded as empty.
      Communication: uncharged, and named as the axis on which the retry-based
      family of IDEA-20260805-07ff43 plausibly beats van Oorschot-Wiener, since
      independent attempts need no shared table.

  dominated_by: >-
    The published section itself dominates nothing and is dominated by nothing at
    the exponent level, because the re-optimised envelope is Pareto-EQUAL in both
    exponents; the difference is confined to the o(1). Frontier rows checked
    before writing this field, across time, memory and data/queries:
    (i) Delfs-Galbraith p^{1/2}(log p)^{O(1)} / negligible memory / no data --
    not dominated by this proposal, which is a re-parameterisation of a different
    algorithm and reduces to it only through IDEA-20260805-07ff43's Y = 1;
    (ii) Theorem 1.1's corner p^{1/3+o(1)} / p^{1/3+o(1)} / no data -- reproduced
    exactly, gain forced to 0 there;
    (iii) the published interpolation at every intermediate w -- equal in
    exponents, weakly better in the o(1) by construction;
    (iv) the parallel VW variant p^{1/2+o(1)}/(w^{1/2} n) -- unaffected, since n
    divides both branches identically;
    (v) the quantum setting of the frozen paper's [29] -- NOT READ, NOT compared,
    and no comparison asserted;
    (vi) this corpus: IDEA-20260801-006 (the only prior idea on this question)
    proposes a VW-versus-Delfs-Galbraith recomputation at 512-1024 bits with a
    charged golden-ratio tradeoff; it does NOT re-optimise B, does NOT reproduce
    the published table, and does not treat B as a free parameter under a memory
    budget. The overlap is the memory-charging motive and it is declared here
    rather than left for a reviewer to find.
  sota_delta: >-
    Exponents: 0.000 in time, 0.000 in memory, at every memory budget. That is
    the honest headline. The quantitative deltas the proposal produces are (a)
    the reproduction error of the published table in bits -- a number that does
    not currently exist anywhere, and whose two decisive values are "<= 0.5" and
    "> 2"; (b) the re-optimisation gain in bits at seven memory budgets and five
    parameter sets, forced to be exactly 0 at the corner and strictly positive
    elsewhere, magnitude unmeasured; and (c) the shift in the Delfs-Galbraith
    crossover memory, expressed in bits of memory. No bit count is asserted for
    (b) or (c) before the run.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.70 that the two-parameter envelope is strictly below the published section
    at every memory budget below the corner. It is not higher because the whole
    effect lives in p^{o(1)} terms evaluated at finite p, where the asymptotic
    algebra of PART B need not bite, and because HB-2's cost exponent is
    inherited rather than derived. It is not lower because the sign is forced by
    construction -- an envelope over a larger parameter set cannot be above a
    section through it -- so the only way to get zero is for the optimum to sit
    at the section by coincidence at every one of thirty-five grid points.
    SEPARATELY, and this is the number that should drive prioritisation: 0.45
    that the published five-row table is reproduced within 0.5 bits by at least
    one declared variant. That is deliberately near even odds. Section 4.1 states
    its model in one paragraph and leaves the optimiser, the smoothness
    estimator and the logarithm base unstated, so a first reconstruction failing
    is at least as likely as it succeeding -- and a failure is the more valuable
    outcome, because it means no one in this programme, including three batches
    of its own calibration work, has been able to derive the numbers every
    downstream margin row is anchored to.
