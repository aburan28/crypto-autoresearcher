idea:
  id: IDEA-20260816-f5dc22
  question_id: RQ-SHATWO-f196c7
  added: '2026-08-16'
  title: Run the identical solver-free rank pipeline on SHA-512 and on a deliberate chimera that wears
    SHA-512 word widths with SHA-256 rotation amounts, so the free nearby-object control decides whether
    the deficit integer tracks a design or merely tracks arithmetic shape
  class: control
  claim: '(A) SHA-512 is a nearby object this program gets for nothing: same Merkle-Damgard and Davies-Meyer
    skeleton, same recurrence shape in the expansion, but 64-bit words, a 1024-bit block, 80 steps,
    and different rotation and shift amounts in sigma0 and sigma1, all as specified in FIPS 180-4.
    Any solver-free deficit integer proposed as a property of SHA-256''s design must be computed on
    SHA-512 by the identical code and must produce a DIFFERENT normalized profile, because the designs
    differ. (B) The discriminating construction is a third object built specifically to fail: a chimera
    with SHA-512''s 64-bit words, 1024-bit block and 80 steps but with sigma0 and sigma1 taken from
    SHA-256''s rotation amounts, reused unchanged on the wider word. The chimera shares arithmetic
    shape with SHA-512 and constant choice with SHA-256, so it separates the two candidate explanations
    of any measured profile. If SHA-256, SHA-512 and the chimera all yield the same normalized deficit
    profile, the integer tracks arithmetic shape and nothing about either design; if SHA-512 and the
    chimera agree with each other but differ from SHA-256, the integer tracks word width; if the chimera
    sides with SHA-256, the integer tracks the rotation constants. (C) NOT CLAIMED: that any of these
    outcomes says anything about the reachable step count of any search on SHA-256 or SHA-512; that
    a difference between the two profiles corresponds to any published difference between them, since
    this program cannot read that literature and asserts nothing about it; that the chimera is a cryptographic
    object anyone should use; or anything about full-round SHA-256 or SHA-512, HMAC, or any deployed
    system. This contract emits three integer profiles and their pairwise comparisons, and its most
    likely useful outcome is the negative one that closes a predictive reading.'
  mechanism: 'STAGE A. Implement SHA-512 twice from FIPS 180-4 and cross-validate both against hashlib
    on the NIST test vectors, then implement the chimera once as a parameterized variant of the SHA-512
    code with only the sigma rotation and shift amounts substituted, and record the substituted triples
    explicitly. STAGE B. Run the identical carry-fixed GF(2) linearizer used for SHA-256 - same module,
    only the width, block size, step count and tap definitions differing - to produce the expansion
    matrix for each of the three objects. STAGE C. Impose the same construction of condition-support
    family at each object, scaled by a declared rule so that family sizes are comparable across 32-bit
    and 64-bit words. STAGE D. Compute the surviving-freedom and redundancy integers at every step
    count and normalize each profile by its object''s block size and step count, so profiles are on
    one axis. STAGE E. Emit the three normalized profiles and the three pairwise distances with the
    same random-tap null band computed per object. STAGE F. Refutation route: if all three normalized
    profiles fall inside each other''s random-tap null bands, the integer is a function of arithmetic
    shape alone and the whole predictive reading is closed with a measured number rather than an argument,
    which is the section 4 closure standard.'
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-SHATWO-f196c7 in full, including its explicit naming of SHA-512 as the paired
      nearby-object control, and ledger/goals/GOAL-SHA2-001.yaml. Read docs/inventor-protocol.md section
      8 audit 4 (method ceiling and nearby-object control) and KN-TECH-080's binding audits. Ran grep
      -rl 'RQ-SHATWO' over ledger/ experiments/ knowledge/ coordination/; grep -ril 'rotation constant'
      and grep -ril 'message schedule|message-schedule' over ledger/proposals/ ledger/hypotheses/
      knowledge/.
    results: RQ-SHATWO-f196c7 itself names SHA-512 as a free nearby-object control in its targets
      and scope, so the control is the question's own instruction rather than a discovery; what is
      not in the question is any chimera object or any pipeline. 'rotation constant' returned ZERO
      hits across ledger/proposals/, ledger/hypotheses/, knowledge/techniques/ and knowledge/findings/,
      so no record in this repository varies a rotation amount of anything. 'message schedule|message-schedule'
      matched only two proposals, IDEA-20260813-878855 and IDEA-20260813-93a735, whose titles I read
      and which are signature-transcript and simulator-audit records in an unrelated lane, plus knowledge/literature
      entries KN-LIT-2702 and KN-LIT-4885 which I did not open. RQ-SHATWO carries no proposals; the
      RQ-SHATWO grep returns only the question, GOAL-SHA2-001 and RQ-SHATHREE-cd2cb2.
    verdict: 'UNVERIFIED. No external literature is readable here and nothing is asserted about it,
      including anything about how SHA-256 and SHA-512 compare in published analysis. Claimed new:
      nothing about SHA-512, whose specification is public, and nothing about rank computation. The
      contribution claimed is the three-object design: adding a deliberately constructed chimera that
      shares word width with one object and rotation amounts with the other, so that a two-object
      comparison which could only say same-or-different becomes a three-way comparison that names
      WHICH factor a profile tracks. Assembled from known parts - nearby-object controls are inventor-protocol
      section 8 audit 4, and the chimera is an obvious construction once the audit is taken seriously.
      Within this repository, zero records vary a rotation constant and RQ-SHATWO carries no proposals.'
  object_first_candidate:
    tracked_object: The normalized surviving-freedom profile of the carry-fixed expanded schedule,
      computed identically for three objects - SHA-256, SHA-512, and the chimera carrying SHA-512
      widths with SHA-256 sigma rotation and shift amounts - and specifically the three pairwise distances
      between those profiles measured against each object's own random-tap null band.
    lossiness: 'Lossy, and the loss is what makes the three-way comparison possible. Discarded: word
      values, carry identity, the compression function, the step ordering beyond its index, and the
      raw scale of each object, since normalization divides out block size and step count. Retained:
      one real-valued profile per object on a common axis. Objects of different word width and step
      count collapse onto the same axis, so this is emphatically a projection - two objects with the
      same normalized profile are not the same object, which is exactly the identifiability risk this
      contract measures rather than assumes. Why the remainder still propagates: within each object
      the profile is computed by the same exact rank recursion as in the single-object case, so normalization
      is applied only at the end and does not disturb the propagation.'
    propagation: 'Within each object, one step of the expansion appends 32 or 64 affine rows and the
      rank increment is read as in the single-object pipeline. Across objects, the operation is substitution
      of the design constants: moving from SHA-512 to the chimera changes only the sigma rotation
      and shift amounts, holding width, block size and step count fixed, and moving from the chimera
      to SHA-256 changes only width, block size and step count, holding the sigma amounts fixed. The
      two substitutions therefore decompose the SHA-256-to-SHA-512 difference into a constants factor
      and a width factor, and the profile''s response to each substitution is the measured decomposition.'
    survival_score: 'Each object''s profile is exact across its full step range - 64 for SHA-256,
      80 for SHA-512 and the chimera - within its carry class. The three-way comparison survives only
      as far as the normalization rule is defensible, and it dissolves precisely there: a normalization
      that divides by block size and step count is one convention among several, and a different convention
      can reorder the pairwise distances. This is stated as the design''s binding limit, and the contract
      runs two normalization conventions rather than one so the reader can see whether the verdict
      is convention-dependent.'
  null_object_control: 'Per-object random-tap null bands, all three computed in the same invocation
    by the identical code: for each object, sigma0 and sigma1 are replaced by uniformly sampled GF(2)
    linear maps of matched fan-in on that object''s word width, 500 draws each, and the object''s
    own normalized profile is scored against its own band. For the three-way comparison to mean anything,
    at least one of the three real objects must fall outside its own random-tap band; if all three
    sit inside their bands, no pairwise distance among them is interpretable and the run records a
    controlled null closing the predictive reading. A second control is the identity check: the chimera
    with SHA-512''s own sigma amounts substituted back must reproduce the SHA-512 profile bit for
    bit, proving the substitution machinery changes nothing else.'
  discriminated_from:
  - RQ-SHATWO-f196c7's own target 4, which instructs that SHA-512 be used as a free control but specifies
    no pipeline, no normalization and no third object; the chimera and the two-convention normalization
    are what this adds.
  - The rank-ledger entry in this bucket, which computes one object's integers and explicitly declines
    cross-object comparison; this entry is the cross-object arm and depends on that pipeline rather
    than duplicating it.
  - KN-TECH-080 audit 4 (nearby-object control) in the abstract, which says to apply a method to the
    closest object where the conclusion should fail; here the closest object is constructed rather
    than found, which is the part the audit does not itself prescribe.
  - The constant-perturbation entry in this bucket, which sweeps many random rotation triples at one
    width to get a spectrum; this uses exactly one substituted triple - SHA-256's, on SHA-512's width
    - because the question here is a decomposition of a specific difference and not a distribution.
  - Any comparison of published SHA-256 and SHA-512 attack results, which this contract cannot and
    does not make, since this program cannot read that literature and asserts nothing about its contents.
  assumptions:
  - FIPS 180-4 is the correct specification for both SHA-256 and SHA-512, and both implementations
    of each match hashlib on the NIST test vectors before any rank is computed.
  - 'The chimera is well-defined: SHA-256''s rotation and shift amounts, all of which are smaller
    than 64, apply unchanged to 64-bit words, and the resulting sigma maps are recorded explicitly
    rather than derived by a rule.'
  - The condition-support family construction scales across word widths by a declared rule so that
    family sizes are comparable; this is a convention and its effect is bounded by running two conventions.
  - Normalizing a profile by block size and step count places 32-bit and 64-bit objects on a comparable
    axis; this is the design's weakest assumption and is why two conventions are run and reported
    side by side.
  predictions:
  - metric: identity check - chimera with SHA-512 sigma amounts substituted back, versus SHA-512 profile
    direction: different
    minimum_effect: 'forced value: bitwise identical, since the substitution machinery must change
      nothing else; any deviation voids the run'
  - metric: number of the three real objects whose normalized profile falls outside its own 500-draw
      random-tap null band
    direction: higher
    minimum_effect: at least 1; if zero, no pairwise distance is interpretable and the run reports
      a controlled null
  - metric: which pair among (SHA-256, SHA-512), (SHA-256, chimera), (SHA-512, chimera) has the smallest
      normalized profile distance
    direction: different
    minimum_effect: explicit refusal to pre-commit, because each of the three answers is a different
      and informative decomposition - constants-tracking, width-tracking, or shape-only - and pre-committing
      one would bias the reading of a three-way test built precisely to let the data choose
  - metric: agreement of the pairwise distance ordering between the two normalization conventions
    direction: different
    minimum_effect: must agree; a convention-dependent ordering means the verdict is an artifact of
      normalization and is reported as such rather than as a decomposition
  minimal_test:
    design: 'Cheapest discriminating version: compute all three profiles in the carry-all-zero class
      only, with a single condition-support family and a single normalization convention, and 100
      random-tap draws per object instead of 500. This is three matrix builds - 2048 x 512 for SHA-256
      and 5120 x 1024 twice - plus 300 null eliminations, all of which is seconds to a couple of minutes
      of CPU with bit packing, no solver anywhere. It already discriminates because the whole three-way
      decomposition reads only the ordering of three pairwise distances and whether any object escapes
      its null band, and both are available from this pass. Only if some object escapes its band,
      and the ordering is decisive, is the second normalization convention, the sampled carry classes
      and the full 500-draw bands worth their cost. The identity check - substituting SHA-512''s own
      amounts back into the chimera code and requiring bitwise reproduction - runs first and costs
      one extra matrix build.'
    controls:
    - Per-object random-tap null bands computed by identical code on each object's own width, same
      invocation.
    - 'Identity check: chimera with SHA-512 sigma amounts substituted back must reproduce SHA-512''s
      matrix bit for bit.'
    - Two normalization conventions reported side by side so a convention-dependent verdict is visible.
    - hashlib cross-validation of both SHA-512 implementations and both SHA-256 implementations on
      NIST test vectors before any rank is computed.
    - Forced value check rank(A_16) equal to the block size in bits for each object, which is 512
      for SHA-256 and 1024 for SHA-512 and the chimera.
    required_metrics:
    - normalized surviving-freedom profile per object
    - three pairwise profile distances under each normalization convention
    - per-object random-tap null band percentiles from 500 draws
    - identity-check bitwise agreement flag
    - rank(A_16) forced value per object
    - spread of each profile across sampled carry classes
  falsification_conditions:
  - All three real objects fall inside their own random-tap null bands, so no pairwise distance is
    interpretable and the predictive reading is closed with a measured number.
  - The identity check fails, showing the substitution machinery changes more than the sigma amounts.
  - rank(A_16) is not the block size for some object, showing that object's linearizer is wrong.
  - The pairwise distance ordering differs between the two normalization conventions, showing the
    decomposition is an artifact of normalization.
  - The two independent SHA-512 implementations disagree on any NIST test vector.
  - Carry-class spread within an object exceeds the smallest between-object distance, making the three-way
    comparison unresolvable at this carry sampling.
  confounders:
  - Normalization convention is the dominant confound and can reorder the pairwise distances by itself,
    which is why two conventions are mandatory rather than optional here.
  - SHA-512 has 80 steps against SHA-256's 64, so any profile compared step-for-step rather than in
    normalized position will differ for that reason alone; the normalization exists to remove this
    and may over-correct.
  - SHA-256's rotation amounts on a 64-bit word may be degenerate in a way that has nothing to do
    with either design, making the chimera an unrepresentative third point; the substituted triples
    are reported explicitly so this is visible.
  - Condition-support family scaling across widths is a second convention layered on the first, and
    its interaction with normalization is not separated by this design.
  - Carry-class choice may affect the three objects differently, since they have different numbers
    of carry bits; per-object carry spread is reported to expose this.
  interpretation_limits:
  - No outcome here bears on the reachable step count of any search on SHA-256 or SHA-512.
  - This contract makes no comparison to any published result for either function and asserts nothing
    about what the literature contains.
  - The chimera is a diagnostic construction and no property of it transfers to either real function.
  - All three profiles are computed in sampled carry classes and are statements about those classes.
  - Nothing here is a statement about full-round SHA-256 or SHA-512, HMAC, certificate chains, or
    any deployed system.
  target_complexity:
    time_exponent: No attack exponent is claimed. Cost is three matrix builds and a few hundred to
      a few thousand GF(2) eliminations on matrices of at most 5120 x 1024 bits, which is seconds
      to minutes on one core.
    memory_exponent: No attack memory exponent is claimed. The largest bit-packed matrix is 5120 x
      1024 bits, about 640 KiB, plus null-draw summaries.
    best_known: 'No incumbent attack. The incumbent this displaces is the state RQ-SHATWO-f196c7 itself
      describes: SHA-512 is named as a free control the question already has available, and no record
      in this repository has ever computed anything on it, so the incumbent is an unexercised control.'
    hidden_overhead: Two hidden costs, both conceptual rather than computational. The first is the
      normalization convention, which carries the entire cross-width comparison and admits no principled
      choice, so the honest response is to run two and report disagreement as a failure rather than
      to argue for one. The second is that the chimera is a construction nobody has a reason to trust
      as a representative third point - SHA-256's rotation amounts on 64-bit words may simply be degenerate
      - and reporting the substituted triples explicitly is the only cheap defence.
  dominated_by: 'n/a (no result claimed). Pareto check across time, memory and data/queries: I checked
    every frontier row present in this repository and found none - no experiment directory, evidence
    record, proposal or hypothesis computes anything about SHA-512, ''rotation constant'' returns
    zero hits everywhere, and RQ-SHATWO carries no proposals - so there is no prior row here to dominate
    this one. This repository cannot adjudicate against external work in either direction and does
    not attempt to.'
  sota_delta: 'no attack; conceptual/measurement contribution only. The delta is from an unexercised
    control to a three-point decomposition: currently zero computed values exist here for SHA-512
    of any kind, and a run would produce three normalized profiles, three pairwise distances under
    two conventions, three 500-draw null bands, and a bitwise identity check.'
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'By part. (1) That all three profiles are computable and the identity
    check passes: ~0.92; SHA-512 is a specification and the chimera is a one-line substitution in
    already-written code, with implementation error the only real risk. (2) That at least one real
    object escapes its own random-tap null band, without which nothing is interpretable: ~0.45, inheriting
    directly from the same uncertainty in the single-object rank-ledger proposal, since tall sparse
    GF(2) rank profiles saturate generically. (3) That the pairwise ordering is stable across both
    normalization conventions: ~0.5, and this is the part I trust least, because cross-width normalization
    has no principled form and I expect convention dependence to be common. (4) That the decomposition,
    if stable, tells us anything about a frontier: ~0.15, held low for the same reason as elsewhere
    in this bucket - the observation-collision audit here exhibits an invertible message-basis change
    leaving every rank invariant, which is a standing reason to doubt that these integers identify
    a frontier at all.'
