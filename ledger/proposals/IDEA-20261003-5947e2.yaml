# IDEA-20261003-5947e2
# Class-number count. Proposal only. Not approved.
idea:
  id: IDEA-20261003-5947e2
  question_id: RQ-JINV-8fc13a
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    The class numbers of discriminants -3 and -4 are both 1
  class: measurement
  claim: >-
    The frozen class number of discriminant -3 is 1. The frozen
    class number of discriminant -4 is 1. Their gap is 0. Their
    product is 1. Their sum is 2. The gap is a class-number label,
    not an ECDLP exponent and not a discriminant absolute value.
  mechanism: >-
    The two labels are the objects. No class polynomial is built
    and no curve is counted. Two copies of the class number 1 have
    gap 0. This is not a comparison of the absolutes 3 and 4.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question asks whether special j-invariants confer an
        advantage beyond the automorphism discount.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-RHO-0528e7
      provenance: internal
      claim: >-
        The automorphism square-root factor is a different object
        from these two class numbers.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The two class numbers are frozen before the subtraction.
    - No class polynomial is computed.
  proof_search_map:
    bottleneck: The class-number gap 0.
    baseline_embedding:
      parameter_slice: The class numbers 1 and 1.
      reproduction_check: >-
        Two readers subtract and must agree that 1 minus 1 is 0.
    observation_collision:
      observable: The class-number gap and the product.
      distinct_preimage_search: >-
        Reporting one class number as 2 drops the match. Two copies
        of 1 make that gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The class numbers 1 and 1.
        predicted_gain: Integer gap. No class polynomial.
    quantifier_order: >-
      The labels are fixed before the gap.
    method_ceiling:
      strongest_certifiable_claim: >-
        The class-number gap 0. Not a point count.
      nearby_object_control: >-
        Two copies of the class number 1. The gap is 0.
    proof_obligations:
      - claim: The frozen class number for -3 is 1.
        responsibility: size
      - claim: The frozen class number for -4 is 1.
        responsibility: size
      - claim: The gap is not an absolute-discriminant gap.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: class_gap
      direction: different
      minimum_effect: The gap of the two class numbers is 0.
  minimal_test:
    design: >-
      Subtract 1 from 1 and multiply 1 by 1. Do not build a class polynomial.
    controls:
      - Two copies of the class number 1, whose gap is 0.
      - An independent count.
    required_metrics:
      - both class numbers
      - the gap
      - the product
  falsification_conditions:
    - The gap is not 0.
    - The product of the two class numbers is not 1.
  confounders:
    - The absolute values 3 and 4 are a different pair from these class numbers.
  interpretation_limits:
    - A class number is not a point count.
    - No transfer to a cryptographic curve.
    - This does not compare the absolutes 3 and 4.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen class number of discriminant -3 is 1 and the
        frozen class number of discriminant -4 is 1.
      rigorous_support: >-
        No class-number theorem is re-proved here. The count is a
        reading of two labels.
      validation_plan: >-
        Two independent readings. A mismatch voids the gap.
  target_complexity:
