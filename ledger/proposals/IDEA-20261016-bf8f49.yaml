idea:
  id: IDEA-20261016-bf8f49
  question_id: RQ-XEDN-3bfe2e
  added: '2026-10-16'
  title: >-
    Opposite-sign descent signature: the independence lemma without primality,
    and 2-divisibility of the plus point as the necessary escape condition
  class: mechanism
  claim: >-
    E: y^2=x(x^2+Ax+B), P=(s^2,s*w), Q=(-t^2,t*z), m=s^2+t^2, D=A^2-4B,
    f_pm=A+2s^2 pm 2w. Assume D not in Q*^2 and B not in +-Q*^2.
    (S0) f_pm=((w pm m)^2+z^2)/m>0, a Q(i)-norm; positivity is automatic.
    (S1) f_+ not in {1,D}Q*^2 => P,Q independent mod torsion (no primality, no
    A>0, any rank). (S2) Conversely any relation aP+bQ in E(Q)_tors forces
    P in 2E(Q), i.e. f_+ or f_- is a rational square, with a odd and b even.
    (S3) S2 fails for same-sign pairs: (G,3G) with x(G) a square is dependent
    and neither point is in 2E(Q). So H-XEDN-0ea2b6 is S2's contrapositive on
    the prime-f_pm slice, and in opposite-sign arms the "nonprime discriminant
    pattern" leg of H-XEDN-4a5b50 is no escape unless f_+ or f_- is a square.
  mechanism: >-
    PAIR: representation = squareclass signature (alpha(P),alpha(Q),alpha(T);
    alpha' of dual preimages) in Q*/Q*^2; operation set = Z-linear
    combinations in E(Q). TRICHOTOMY: partial-action (alpha' lives only on
    ker alpha = phi^(E'(Q))). LOSSY-PROJECTION TEST: E(Q)->E(Q)/2E(Q) is a
    homomorphism with infinite-index kernel, so it discards compatibly with
    the group law; not a change of coordinates. Proof of S2: E(Q)/tors is
    free, so P=kH+t1, Q=lH+t2; alpha(tors) in {1,B} (D nonsquare, no 4-torsion
    as B nonsquare); F_2-linear algebra on alpha(H) forces k even, t1 in 2E.
    P in 2E iff alpha'(dual preimage)=f_pm in {1,D}Q*^2. S0: complete squares
    using w^2+z^2=m(A+s^2-t^2). Not an ECDLP object: it lives in char 0 and
    the F_p image of E/2E is the 2-part Pohlig-Hellman already gives.
