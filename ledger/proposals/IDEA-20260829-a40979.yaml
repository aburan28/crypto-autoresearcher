idea:
  id: IDEA-20260829-a40979
  question_id: RQ-SCURVE-49ee6d
  goal_id: GOAL-SCURVE-7b280d
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    RIGIDITY WITHOUT A TRANSCRIPT - E-382 is one of exactly four SafeCurves
    rows rated `fully rigid` with an EMPTY comments cell, so its generation
    recipe must be RECONSTRUCTED rather than executed; calibrate the
    reconstruction on the rows that DO publish a recipe, then measure how many
    bits of E-382's parameter choice a reconstructed rule explains, using a
    cheap small-odd-factor sieve on the group order built from division
    polynomials that needs no point counting
  class: measurement

  claim: >-
    E-382 is x^2 + y^2 = 1 - 67254 x^2 y^2 over p = 2^382 - 105. Four
    separable sub-claims.

    (C1) THE OBSERVATION, RETRIEVED AND CHECKABLE. In the repository mirror's
    rigidity table, exactly four of the twenty rows are rated fully rigid with
    an EMPTY comments cell - E-222, E-382, M-383 and E-521. Every other
    fully-rigid row carries a generation transcript, ranging from one line
    (M-221 and Curve383187 - "p is largest prime smaller than 2^221; B = 1;
    A greater than 2 is as small as possible") to a full paragraph
    (Curve25519, Curve1174). The mirror's own addendum records that the M-383
    empty cell is the CONFIRMED INSTANCE of defect MIRROR-DEF-1, where the
    tag-stripped text rendering can make an adjacent row's comment appear to
    belong to M-383, and states explicitly that attributing it to M-383 would
    be a false statement about which curve has a published generation recipe.
    So the emptiness is not an artifact - it is documented, and the four rows
    without a recipe are the four rows where SafeCurves' strongest rigidity
    rating rests on something this program cannot read.

    (C2) THE RECONSTRUCTION IS CALIBRATABLE, AND THAT IS WHAT MAKES IT MORE
    THAN GUESSWORK. The five rows with published PRIME-selection rules are a
    positive control set for a rule-recovery procedure - M-221 and
    Curve383187 ("largest prime smaller than 2^221" and than 2^383), M-511
    ("p = 5 mod 8 is largest prime smaller than 2^511"), Curve1174 (a stated
    window and residue class), and Curve41417 ("2^414 - 17 is uniquely
    closest" below a stated bound). A procedure that enumerates candidate
    rules and selects the ones consistent with a row's published prime MUST
    recover the published rule on all five, or it has no standing to propose a
    rule for E-382. PREDICTED - 5 of 5 recovered. Fewer than 5 and the
    reconstruction is withdrawn.

    (C3) E-382's PRIME-SELECTION CLAIM IS DECIDABLE, AND ITS DISCRIMINATING
    POWER IS LOW AND IS STATED IN ADVANCE. Two candidate rules - R_A, p is the
    largest prime below 2^382; R_B, p is the largest prime congruent to
    3 mod 4 below 2^382. Both are decided by primality tests on 2^382 - c for
    odd c below 105, at most 52 tests on 382-bit numbers, which is seconds.
    Only c congruent to 1 mod 4 gives p congruent to 3 mod 4, and 105 is
    congruent to 1 mod 4, so R_B is consistent by construction if no smaller
    such c is prime. PRE-REGISTERED HONESTY - the expected number of primes
    among the 52 smaller odd candidates is about 52 times 2/ln(2^382), which
    is about 0.39, so with probability roughly 0.68 there is NO smaller prime
    at all and R_A and R_B COINCIDE ON THIS ROW, in which case the test cannot
    distinguish them. That is a genuine limitation of the row, it is computed
    before the experiment rather than after, and it is why C2's calibration on
    five other rows carries the argument rather than this row's own sweep.

    (C4) E-382's PARAMETER-SELECTION CLAIM IS ONLY PARTLY DECIDABLE, AND THE
    UNDECIDED PART IS MEASURED IN BITS RATHER THAN GUESSED - THIS IS THE
    RECORD'S PRINCIPAL DELIVERABLE. Borrowing the rule form that SafeCurves
    publishes for the two sibling rows that do have one - Ed448-Goldilocks,
    "the first negative d where E and ~E have 4 times prime order", and
    Curve41417, "d is smallest qualifying integer in absolute value" with
    cofactors limited to 4 and 8 - the natural candidate rule for E-382 is
    R_d, the smallest absolute value negative d for which the curve is
    complete and both the curve and twist orders are 4 times a prime.
    Completeness costs one Legendre symbol and the cofactor 2-parts cost one
    more, by IDEA-20260829-b41d39's C2 and C3, since s = 1 + v_2(2^382 - 104)
    = 1 + 3 = 4 and a = 2 is less than 4 forces b = 2. The PRIMALITY of the
    odd parts is the expensive residue. THE NEW INGREDIENT IS A CHEAP PARTIAL
    SUBSTITUTE FOR IT - for a small odd prime r, whether r divides #E can be
    decided WITHOUT point counting by testing whether the r-division
    polynomial psi_r, of degree (r^2 - 1)/2, has a root in F_p whose
    y-coordinate is rational, which is one modular exponentiation in
    F_p[x]/(psi_r) plus one Legendre symbol. For r in {3, 5, 7, 11, 13} the
    degrees are 4, 12, 24, 60 and 84 and the whole sieve is milliseconds per
    candidate. PRE-REGISTERED PREDICTION WITH ITS DERIVATION - a random curve
    has order divisible by r with probability about r/(r^2 - 1), so applying
    the sieve to both the curve and the twist retains about 0.125 of
    candidates, and the two symbol conditions retain 0.25, giving about 3.1
    percent survival. Among the 67253 candidates of smaller absolute value
    that predicts about 2100 survivors, so about 11 bits of the choice of
    -67254 remain unexplained by everything this environment can compute, and
    about 5.0 bits are explained. THE CONSEQUENCE, WHICH IS THE FINDING -
    E-382's rigidity is NOT cheaply reproducible, in sharp contrast to
    Curve1174, whose prime-selection half is fully decidable; and a
    fully-rigid rating with no published transcript is therefore not
    independently checkable by this program at any budget it has.

  mechanism: >-
    THE TRACKED OBJECT is the SURVIVOR SET of a parameter enumeration under a
    filter - the ordered list of candidate parameters d, enumerated by
    absolute value, that pass every condition the environment can decide,
    together with the RANK of the published parameter within it. An integer
    and a list, extracted from a 382-bit tuple and a prose comment that does
    not exist.

    LOSSY-PROJECTION TEST (docs/inventor-protocol.md section 2), applied
    BEFORE any compute.
    WHAT IS DISCARDED. Every candidate's curve, group, base point and order;
    all that survives is a bit per candidate and a position for the published
    one. Sixty-seven thousand 382-bit objects collapse to one integer.
    IS IT A CHANGE OF COORDINATES? No. The fibre over a given rank is the set
    of all filter outcomes with that many survivors below the published index,
    an astronomically large set, and no candidate is recoverable from the
    rank.
    IS THE DISCARD COMPATIBLE WITH THE OPERATIONS THE AUDIT USES? The
    operation is RULE APPLICATION, and the projection is exactly equivariant
    under it - a rule of the form "smallest parameter satisfying conditions
    P_1 through P_k" depends on the candidate list ONLY through which
    candidates pass, so the survivor set determines the rule's output and
    nothing else is needed. Adding a condition can only SHRINK the survivor
    set, so the rank is monotone in the strength of the rule, which is what
    makes the measurement interpretable - the measured rank is an UPPER BOUND
    on how many candidates a complete rule could have rejected for reasons the
    environment cannot see. That monotonicity is the whole reason the
    incomplete filter still yields a sound number.
    WHERE THE STRUCTURE DISSOLVES, MEASURED AND STATED. At any rule that is
    NOT of the "smallest satisfying" form - a rule that hashes a seed, or that
    selects for an efficiency property like the Hamming weight of d, or that
    imposes a condition depending on the candidate's index, is invisible to
    this object and would produce an uninterpretable rank. It also dissolves
    at the enumeration CONVENTION - "smallest in absolute value" does not
    state a sign order or whether both signs are tried, and different
    conventions give different ranks, so the rank must be reported under every
    plausible convention rather than one.

    WHY THE DIVISION-POLYNOMIAL SIEVE IS THE LOAD-BEARING NEW INGREDIENT. The
    entire family campaign is blocked on the absence of a point-counting
    backend - the archived audit plan declares it in environment assumption
    E2, and every proposal filed today is built around avoiding it. But
    "compute #E" and "decide whether r divides #E for small r" are DIFFERENT
    PROBLEMS with different costs, and only the first is infeasible. The
    r-torsion test is the first half of Schoof's algorithm with the trace
    computation removed - E has a rational point of order r exactly when
    psi_r has a root x_0 in F_p with x_0^3 + a x_0 + b a square, and finding
    whether psi_r has any root in F_p is gcd(x^p - x, psi_r), one modular
    exponentiation in a quotient ring of degree (r^2 - 1)/2. That is
    O(r^2 log p) field operations, not O(log^8 p), and it is the reason this
    record can filter on the ODD part of the order at all where every sibling
    record can only filter on the 2-part. It is offered as a reusable
    instrument, not only as a step in this experiment.

    WHY THIS IS NOT IDEA-20260829-0daedf. That record EXECUTES a published
    transcript that states its rule completely; this record CONFRONTS the
    absence of one and must first establish that a rule-recovery procedure
    works at all, on rows where the answer is known. The two are the two
    halves of the same diagnostic - deterministic parameter-generation
    transcript audit - split by whether a transcript exists, and the split is
    not a matter of taste but a retrieved fact about four specific rows.

    EXECUTION. Step 1, zero compute - fix the candidate rule grammar and the
    enumeration conventions IN ADVANCE and freeze them, so no rule can be
    added after seeing a row's parameter. Step 2, THE CALIBRATION of C2 on the
    five rows with published prime rules. Step 3, C3's prime sweep for E-382
    and for the other three empty-comment rows. Step 4, build and validate the
    division-polynomial r-torsion sieve against brute-force order counts at
    toy scale. Step 5, THE RANK MEASUREMENT of C4. Step 6, report per row -
    rule recovered, rule not recovered with the reason, or row has a published
    rule and it was confirmed or contradicted.

  novelty_status: unverified
  novelty_rationale: >-
    The r-torsion test via division polynomials is the standard opening move
    of Schoof's algorithm and is textbook; the honest mathematical label is
    `known`. Rule recovery from published outputs is standard practice in
    measurement and is almost certainly `known` as a technique. What is
    asserted as absent is confined to this program - no record anywhere in
    ledger/ or knowledge/ implements any torsion test, reconstructs any
    generation rule, or notes that four SafeCurves rows are rated fully rigid
    with no published recipe. NO EXTERNAL PAPER WAS OPENED IN THIS SESSION and
    a live fetch of safecurves.cr.yp.to failed, so per agents/idea-generator.md
    the label is `unverified` regardless of how routine the mathematics is.
