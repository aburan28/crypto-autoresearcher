  assumptions:
    - >-
      The executor session has a shell and Python 3 with arbitrary-precision
      integers, a BPSW primality routine, and enough polynomial arithmetic to
      exponentiate in F_p[x]/(f) for f of degree up to about 100. No Sage, no
      PARI, no SEA.
    - >-
      No point-counting backend. The record is constructed so that no step
      needs one; the price is that the parameter-selection claim is only
      partly decidable and that price is measured rather than hidden.
    - >-
      IDEA-20260829-b41d39's C2 and C3 have passed their exhaustive toy
      census, otherwise the 2-adic filters are unvalidated.
    - >-
      Curve parameters come from the question record's intake cross-checked
      against the mirror's equation and field tables. No parameter is typed
      from memory.
    - >-
      The candidate rule grammar and every enumeration convention are FROZEN
      BEFORE any row's parameter is looked at. Without that freeze the
      procedure can fit any parameter and the whole record is worthless; this
      is the single most important procedural assumption in it.

  proof_search_map:
    bottleneck: >-
      Two, and they compound. First, four rows carry SafeCurves' strongest
      rigidity rating with no published recipe, so there is nothing to
      execute. Second, every rule anyone would propose for those rows ends in
      a prime-order condition, and this environment has no point-counting
      backend, so the rule cannot be evaluated on the rejected candidates.
      Removing the second bottleneck ENTIRELY is impossible here; removing
      part of it - the divisibility of the order by small odd primes - is
      possible at O(r^2 log p) and is the technical move the record turns on.
    baseline_embedding:
      parameter_slice: >-
        Restricted to r = 2 the division-polynomial sieve must reproduce
        IDEA-20260829-b41d39's chi(1 - d) verdict exactly - psi_2 is the
        2-division polynomial and rational 2-torsion is what the Edwards
        criterion already decides. Restricted to the rows with published
        prime rules, the rule-recovery procedure must output exactly the
        published rule. Both are boundaries this record must CONTAIN, not
        merely resemble.
      reproduction_check: >-
        A frozen fixture asserting, first, that the sieve's r = 2 verdict is
        bit-identical to b41d39's on 10^3 toy curves and on E-382 at 382 bits;
        and second, that the recovery procedure outputs "largest prime smaller
        than 2^221" for M-221 and the stated window rule for Curve1174, run
        before any empty-comment row is touched.
    observation_collision:
      observable: >-
        The survivor set and the rank of the published parameter within it -
        the object carrying every conclusion about how much a rule explains.
      distinct_preimage_search: >-
        REQUIRED, AND THE PREDICTED ANSWER IS THAT COLLISIONS ARE MASSIVE AND
        MUST BE WRITTEN INTO THE DELIVERABLE. Many distinct rules produce the
        same survivor set on a single row - "smallest complete d with cofactor
        4" and "smallest complete d with cofactor 4 and no rational 3-torsion"
        may agree on which candidate is first while disagreeing on hundreds of
        rejected ones. So the observable identifies a rule only up to
        agreement on ONE row's output, which is almost no constraint at all.
        THE SEPARATING CONDITION, AND IT IS WHY C2 EXISTS - require the SAME
        rule, with the same frozen grammar, to reproduce the published
        parameter on ALL rows for which one is published. Twelve rows agreeing
        is a far narrower fibre than one, and the deliverable must report how
        many rows a proposed rule reproduces, never that it reproduces E-382.
        A SECOND COLLISION, SHARPER AND UNAVOIDABLE - a rank of r is
        consistent with a complete rule that rejected all r on grounds the
        environment cannot see AND with a different rule that never considered
        them; the rank bounds the first and says nothing about the second.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Do not evaluate the full prime-order condition. Evaluate the finite
          conjunction of conditions the environment can decide - two Legendre
          symbols and five r-torsion tests - and SUM the evidence only over
          the candidates each condition actually rejects, reporting the count
          per condition rather than a pooled pass rate.
        predicted_gain: >-
          An honest per-condition accounting of explanatory power, predicted
          about 2.0 bits from the two symbol conditions and about 3.0 bits
          from the five torsion conditions, total about 5.0 of the about 16.0
          bits in the choice of an integer below 67254; the remaining about
          11 bits are attributed to the undecidable condition and NOT to the
          rule's specificity.
      - transform: boundary_lift
        proposed_object: >-
          Lift the divisibility question from "compute #E and factor it",
          which is infeasible, to "does E have a rational point of order r",
          which is a gcd in a quotient ring of degree (r^2 - 1)/2 and is
          feasible.
        predicted_gain: >-
          Small-odd-factor information about the group order at 382 bits in
          milliseconds per prime r, where the program currently has none at
          any budget. This is a reusable instrument whose value is not
          confined to this experiment.
    quantifier_order: >-
      C1 IS A FINITE OBSERVATION, universally quantified over a finite set.
      FOR ALL twenty rows of the mirror's rigidity table, the comments cell is
      empty exactly for E-222, E-382, M-383 and E-521.
      C2 IS CLAIMED EXISTENTIALLY OVER RULES AND UNIVERSALLY OVER ROWS. THERE
      EXISTS a rule in the frozen grammar such that FOR ALL five rows with a
      published prime rule, the rule's output equals the published prime. The
      rule is permitted to depend on the five-row sample, and it does.
      C3 IS A FINITE DECIDABLE COMPUTATION.
      C4 IS CLAIMED AS A MEASUREMENT, NOT AS A VERIFICATION. FOR THIS row and
      THIS frozen filter, the rank of the published parameter is r. NOT
      CLAIMED - that -67254 is the smallest qualifying parameter under any
      complete rule, which cannot be established without a point-counting
      backend and is not established here.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Four rows are rated fully rigid with no published recipe; a frozen
        rule grammar reproduces the published prime on k of five calibration
        rows; E-382's prime is or is not the largest prime of a stated form
        below 2^382; and E-382's parameter has rank r under a filter that
        decides completeness, the cofactor 2-parts, and divisibility of both
        orders by 3, 5, 7, 11 and 13." It certifies NOTHING about what the
        designers did, NOTHING about whether a fully-rigid rating is
        deserved, and NOTHING about safety. A reconstructed rule that fits is
        not the rule that was used.
      nearby_object_control: >-
        THE ROWS WITH PUBLISHED RULES ARE THE CONTROL AND THEY ARE THE ONLY
        THING SEPARATING THIS RECORD FROM CURVE-FITTING. The sharpest single
        one is M-511, whose published rule is unusually specific - p is
        5 mod 8, largest prime below 2^511, B = 1, (A - 2)/4 as small as
        possible for A greater than 2, A^2 - 4 not a square, curve order 8r
        and twist order 4r'. Every clause of it is decidable in this
        environment except the primality of r and r', and the last two clauses
        are exactly IDEA-20260829-b41d39's C1 and the p = 1 mod 4 branch of
        its C3. A recovery procedure that cannot reproduce M-511's rule from
        M-511's parameters has no standing anywhere. A SECOND NEARBY OBJECT -
        Ed448-Goldilocks, whose rule "first negative d where E and ~E have
        4*prime order" is the closest published analogue of the rule proposed
        for E-382, and which therefore tests whether that rule form can be
        made to work on ANY row before it is applied to a row with no rule at
        all.
    proof_obligations:
      - claim: >-
          The four empty comments cells are empty in pages/rigid.html and not
          only in tables/rigid.tsv.
        responsibility: baseline
      - claim: >-
          psi_r has degree (r^2 - 1)/2 for odd r and its F_p-roots with square
          y^2 are exactly the x-coordinates of rational r-torsion points.
        responsibility: correctness
      - claim: >-
          gcd(x^p - x, psi_r) computed by one modular exponentiation in
          F_p[x]/(psi_r) is correct and costs O(r^2 log p) field operations.
        responsibility: runtime
      - claim: >-
          The sieve's verdict agrees with brute-force order counting on every
          toy curve tested, for every r in the sieve set.
        responsibility: baseline
      - claim: >-
          Adding a filter condition can only shrink the survivor set, so the
          measured rank is an upper bound on a complete rule's rejections.
        responsibility: strictness
      - claim: >-
          The rule grammar and enumeration conventions were frozen before any
          row's parameter was inspected.
        responsibility: scope
      - claim: >-
          The prime sweep of C3 is exhaustive over the stated range and
          reports its primality tier per candidate.
        responsibility: scope
      - claim: >-
          The reported rank is a measurement of explanatory power and NOT a
          minimality verification.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        number of the twenty rigidity rows with a fully rigid rating and an
        empty comments cell, read from pages/rigid.html
      direction: different
      minimum_effect: >-
        PREDICTED EXACTLY 4 - E-222, E-382, M-383, E-521. A different count
        read from the raw HTML than from the tsv would mean the tsv extraction
        is itself defective, which would be a second instance of MIRROR-DEF-1
        and a material finding about the mirror.
    - metric: >-
        number of the five rows with published prime rules on which the frozen
        rule-recovery procedure reproduces the published rule
      direction: higher
      minimum_effect: >-
        PREDICTED 5 of 5. THIS IS THE BLOCKING CALIBRATION. Fewer than 5 and
        no rule may be proposed for any empty-comment row; the record then
        returns the calibration failure, which is a legitimate and informative
        negative and costs almost nothing.
    - metric: >-
        number of primes among 2^382 - c for odd c strictly below 105
      direction: lower
      minimum_effect: >-
        PREDICTED 0, with pre-registered probability about 0.68 under the
        prime number theorem, so this test has LOW POWER and is stated so in
        advance. If 0, then rules R_A and R_B coincide on this row and neither
        is distinguished; the row confirms both and separates neither. If any
        such c is prime and is congruent to 3 mod 4, then R_A is REFUTED for
        E-382 while R_B survives, which is the informative outcome and would
        be direct evidence that the residue class was a design constraint.
    - metric: >-
        agreement of the division-polynomial r-torsion sieve with brute-force
        order counting on toy curves, per r in {3, 5, 7, 11, 13}
      direction: higher
      minimum_effect: >-
        PREDICTED EXACTLY 1.000 on an exhaustive toy population. Anything
        below 1.000 means the sieve is wrong and the rank measurement is void;
        this is the cheapest place to catch a wrong division-polynomial
        recursion and it must be run before any 382-bit work.
    - metric: >-
        rank of -67254 among candidates of smaller absolute value passing the
        frozen filter
      direction: different
      minimum_effect: >-
        PREDICTED about 2100, in the interval 1500 to 2900 at three sigma,
        from the derivation that the two symbol conditions retain 0.25 and the
        five two-sided torsion conditions retain about 0.125. THE CONSEQUENCE
        - about 5.0 of the about 16.0 bits in the choice are explained by
        decidable conditions and about 11 are not, so E-382's rigidity is not
        cheaply reproducible. A rank near 0 would mean the decidable
        conditions alone nearly determine d, which would be a strictly
        stronger and genuinely surprising rigidity result. A rank far above
        2900 would mean the filter conditions are positively correlated and
        the predicted survival rate is wrong, which the null control measures
        directly.
    - metric: >-
        per-condition rejection counts within the filter, reported separately
        rather than pooled
      direction: different
      minimum_effect: >-
        PREDICTED approximately - completeness rejects about half, the
        cofactor condition about half of the remainder, r = 3 the largest
        single share of the torsion rejections at about 61 percent of what
        reaches it, and r = 13 the smallest at about 15 percent. Reporting
        only the pooled rate would hide which condition is doing the work and
        would make the bit-accounting uncheckable.
    - metric: >-
        chi(-67254), chi(67255), s = 1 + v_2(p + 1), and the derived curve and
        twist 2-parts for E-382
      direction: different
      minimum_effect: >-
        PREDICTED chi(-67254) = -1 so the curve is complete; chi(67255) = -1
        so v_2(#E) = 2 and the cofactor 2-part is exactly 4; s = 4 since
        p + 1 = 2^382 - 104 = 8(2^379 - 13) with 2^379 - 13 odd; and hence,
        since 2 is less than 4, v_2(#E^t) = 2 and the twist cofactor 2-part is
        exactly 4. All match the mirror's published 2^2 and 2^2. Any
        disagreement contradicts a published cofactor and halts the run.
    - metric: >-
        whether the four empty-comment rows share a reconstructible rule that
        also fails on the rows with published rules
      direction: different
      minimum_effect: >-
        REPORTED WITH NO TARGET, but pre-registered. If a single rule in the
        frozen grammar reproduces E-222, E-382 and E-521 - three rows by the
        same authors per their intake details - that is a substantive
        reconstruction; if each needs a different rule, the reconstruction has
        one free parameter per row and explains nothing, and the record must
        say so in those words.

  minimal_test:
    design: >-
      STAGE 0, zero compute, and it is the cheapest possible falsification of
      the record's premise. Re-read the four comments cells from
      pages/rigid.html directly. If any is non-empty, C1 is false, the record
      is about the wrong rows, and it dies at no machine cost.
      STAGE 1, THE CHEAPEST VALID DISCRIMINATOR WITH COMPUTE, minutes, and it
      is the CALIBRATION rather than anything about E-382. Freeze the rule
      grammar, then run recovery on the five rows with published prime rules.
      This uses only primality tests on 220 to 511 bit numbers, touches no
      curve arithmetic, and either establishes that the procedure works or
      kills the record before a single division polynomial is written.
      STAGE 2, minutes. Build the r-torsion sieve for r in {3, 5, 7, 11, 13}
      and validate it EXHAUSTIVELY against brute-force order counting at four
      toy primes near 2^13 to 2^15, on every curve in the family under test.
      STAGE 3, seconds. C3's prime sweep for E-382 and the other three
      empty-comment rows, under both readings R_A and R_B.
      STAGE 4, hours at most. The rank measurement over 67253 candidates, each
      costing two symbols plus five torsion tests on curve and twist - about
      10^6 modular exponentiations in small quotient rings, embarrassingly
      parallel across the 14 cores.
      STAGE 5, seconds. The per-condition accounting and the bit report.
    controls:
      - >-
        BLOCKING CALIBRATION CONTROL - the five rows with published prime
        rules. Recovery must succeed on all five. This is the control that
        distinguishes reconstruction from curve-fitting and nothing may
        proceed past it.
      - >-
        BLOCKING SIEVE CONTROL - exhaustive agreement of the r-torsion sieve
        with brute-force order counting at toy scale, per r, on both the curve
        and the twist. An instrument that has never disagreed with the truth
        on a curve WITH r-torsion has not been shown to fire, so the toy set
        must include, for each r, curves known by construction to have
        rational r-torsion.
      - >-
        POSITIVE, SAME-p - a candidate d at the real 382-bit prime constructed
        to be a square, which must be rejected by the completeness filter by
        construction, giving the filter one full-size input whose answer is
        known without any transcription.
      - >-
        NEGATIVE, PARAMETER-MATCHED - d' = -67254 + k for the smallest k
        making chi(d') = +1, over the same p, identical code path.
      - >-
        NULL, SAME SHAPE, AND IT IS WHAT VALIDATES THE PREDICTED SURVIVAL RATE
        - 10^4 uniformly random d at the real p through the identical filter,
        whose pass rate must be near 0.031 with a 3-sigma half-width about
        0.005. A rate far from that invalidates the predicted rank interval,
        though not the measured rank.
      - >-
        REFUSAL CONTROL - run the rule-recovery procedure on NIST P-256, whose
        rigidity comment says its coefficients were generated by hashing an
        unexplained seed. The procedure must REFUSE, because a hash-derived
        parameter is outside the frozen grammar by construction. A procedure
        that proposes a "smallest qualifying" rule for a hashed curve is
        fitting noise and every rule it proposes elsewhere is void.
      - >-
        CROSS-IMPLEMENTATION - every Legendre symbol by two routines, every
        primality verdict by BPSW and by 64-round Miller-Rabin with recorded
        bases, and every division polynomial by the standard recursion and by
        an independent direct construction at small r. Disagreement voids the
        run.
      - >-
        MIRROR-INTEGRITY CONTROL - recompute the sha256 of every mirror file
        read and compare against source_record_addendum_01.yaml.
    required_metrics:
      - 'the four comments cells re-read from pages/rigid.html, verbatim, empty or not'
      - 'per calibration row, the recovered rule and whether it matches the published one'
      - 'per r, the sieve agreement fraction against brute force, exhaustive, at toy scale'
      - 'the C3 prime sweep output for four rows under both readings, with primality tiers'
      - 'the rank of -67254 and the full survivor list below it'
      - 'per-condition rejection counts, unpooled, with the derived bit accounting'
      - 'chi(-67254), chi(67255), s, and the derived curve and twist 2-parts'
      - 'the null pass rate over 10^4 random d at the real p, with seeds'
      - 'the refusal outcome on NIST P-256'
      - 'wall clock per stage and the sha256 of every mirror file read'

  falsification_conditions:
    - >-
      Any of the four comments cells is non-empty in pages/rigid.html. C1 is
      false; the record is withdrawn and re-filed against whatever rows are
      actually empty, if any.
    - >-
      The rule-recovery procedure fails on any of the five calibration rows.
      No rule may be proposed for an empty-comment row; the record returns the
      calibration failure as its result, which is legitimate and cheap.
    - >-
      The r-torsion sieve disagrees with brute-force order counting on any toy
      curve, for any r. The sieve is wrong; the rank measurement is void and
      nothing about E-382's parameter is reported.
    - >-
      The sieve never rejects any candidate for any r on the toy set. The
      instrument has not been shown to fire and cannot certify an absence,
      per IDEA-20260807-98a970's rule; a curve with known rational r-torsion
      must be added to the toy set until it does.
    - >-
      chi(-67254) = +1, contradicting the mirror's complete cell for E-382, or
      chi(67255) = +1, contradicting its published cofactor 2^2. Halt, re-read
      the raw HTML, re-check the modulus and the sign of d, and escalate.
    - >-
      The null pass rate is not near 0.031. The filter conditions are
      correlated or a filter is inverted; the predicted rank interval is
      withdrawn and only the measured rank is reported, with the correlation
      noted.
    - >-
      The recovery procedure returns a rule for NIST P-256. The refusal
      control failed and the procedure is fitting noise; every proposed rule
      is void.
    - >-
      A single rule is claimed to reproduce the empty-comment rows but was
      chosen after their parameters were inspected. The freeze was violated
      and the entire reconstruction is worthless; this is a procedural
      falsification and it must be checked by the record's own audit trail,
      not by good faith.

  confounders:
    - >-
      RECONSTRUCTION IS NOT ATTRIBUTION. A rule that reproduces a parameter is
      consistent with the designers having used it and equally consistent with
      coincidence, especially when the rule has free clauses. The number of
      rows a rule reproduces is the only defence, and it must be reported
      beside every proposed rule. "We found the rule" is never a permitted
      phrasing; "a rule in the frozen grammar reproduces k of m published
      parameters" is.
    - >-
      THE RANK DEPENDS ON CONVENTIONS THAT THE SOURCE DOES NOT STATE.
      "Smallest in absolute value" fixes neither the sign order nor whether
      both signs are enumerated nor whether small degenerate values are
      excluded. Ed448's transcript says "first NEGATIVE d", Curve41417's says
      "smallest qualifying integer in absolute value" for a POSITIVE d, and
      E-222's published d is positive while E-382's and E-521's are negative -
      so the family does not use one convention. The rank must be recomputed
      under every plausible convention and the spread reported.
    - >-
      AN EMPTY CELL IS NOT AN ABSENT RECIPE. SafeCurves may rate a row fully
      rigid on the strength of a recipe published in the originating paper
      without repeating it. The Aranha-Barreto-Pereira-Ricardini paper is the
      obvious place and is named in the citations for exactly that reason.
      This record's C1 claims only that the MIRROR's cell is empty, and a
      reviewer who retrieves that paper may make the whole reconstruction
      unnecessary - which would be the best outcome and is stated as such.
    - >-
      SELECTION IN THE TORSION SIEVE. Only five small primes are sieved, so a
      candidate rejected by the true rule for having a factor of 101 in its
      order survives here and inflates the rank. The rank is therefore an
      upper bound in a second and independent sense beyond the monotonicity
      argument, and both senses must be stated.
    - >-
      TWIST BOOKKEEPING. The torsion sieve must be run on the twist as well as
      the curve, and which model is the twist depends on chi(1 - d) by
      IDEA-20260829-b41d39's confounder note. Sieving the curve twice under
      two names would silently halve the filter's strength and inflate the
      rank by about a factor of 8.
    - >-
      PROBABLE PRIMES. Every primality verdict in C3 is at the probable-prime
      tier unless certified, and the six published values in the calibration
      set are the ones most worth certifying properly.

  interpretation_limits:
    - >-
      NOTHING HERE IS A SECURITY STATEMENT. The question record's claim
      boundaries state that a failure of rigidity is not by itself an ECDLP
      break; the converse holds equally and a reconstructed recipe is not
      safety. A rank measurement is a statement about how much a rule
      constrains a choice, not about any curve's hardness.
    - >-
      C1 is a finite observation about a dated repository snapshot. C2 and C3
      are finite computations. C4's rank is a MEASUREMENT OF EXPLANATORY POWER
      and explicitly not a minimality verification, and it is an upper bound
      in two independent senses - the filter is incomplete, and the sieve
      covers only five small primes.
    - >-
      THE SIEVE CANNOT CERTIFY THAT AN ORDER IS PRIME. It can only certify
      that specific small primes do or do not divide it. A record that writes
      "the order is prime" on the strength of this instrument has committed a
      claim-tier violation.
    - >-
      TRANSFER TO THE OTHER 19 CURVES, STATED EXACTLY. (a) C1 IS ALREADY
      FAMILY-WIDE and names the other three empty-comment rows, E-222, M-383
      and E-521, so this record's premise transfers verbatim to their goals.
      (b) THE CALIBRATION of C2 is family-wide by construction and its result
      binds every row - if recovery fails on five rows with known answers, no
      row's reconstruction is trustworthy. (c) THE r-TORSION SIEVE transfers
      FULLY to all twenty rows and to every elliptic curve over every prime
      field, in any model once converted to short Weierstrass form; it is
      model-agnostic and is the most portable artifact in this record. (d)
      THE RANK NUMBER transfers to NO other row - each row needs its own
      enumeration under its own conventions. (e) The 2-adic filters transfer
      exactly as IDEA-20260829-b41d39's transfer note states, fully to the six
      Edwards rows and via IDEA-20260829-d052e6 to the Montgomery rows.
    - >-
      The mirror is a dated snapshot with recorded hashes and a documented
      defect in one derived view. Agreement with it is agreement with that
      snapshot, and C1 in particular is a statement about the snapshot and not
      about the live site.

  heuristic_assumptions:
    - id: H1
      statement: >-
        As d ranges over integers of absolute value below 67254 reduced mod p,
        the events "E_d is complete", "v_2(#E_d) equals 2", and "r divides
        #E_d" for r in {3, 5, 7, 11, 13} on the curve and on the twist behave
        as independent events with probabilities 1/2, 1/2 and about
        r/(r^2 - 1) respectively; hence about 3.1 percent of candidates
        survive the frozen filter.
      rigorous_support: >-
        Three parts, separated. (i) The two symbol conditions are
        equidistributed with density 1/2 + O(p^{-1/2}) by Weil's bound on
        character sums, which is RIGOROUS; only their mutual independence is
        modelled, and even that is supported by the same bound applied to the
        joint character sum. (ii) The r-divisibility probability
        r/(r^2 - 1) is the standard count of the proportion of isogeny classes
        with r dividing the order, and the classical statement being imitated
        is the Lenstra and Howe results on the distribution of #E(F_p) over
        varying E, which give exactly this density in the limit. (iii) The
        INDEPENDENCE ACROSS r, and between curve and twist, is the genuinely
        heuristic part; the curve and its twist have orders summing to
        2p + 2, so they are NOT independent, and for r dividing 2p + 2 the
        events are strongly coupled. That coupling is disclosed here and is
        exactly what the null control measures.
      validation_plan: >-
        SAMPLING - 10^4 uniformly random d at the real 382-bit prime through
        the identical filter, seeds recorded, plus the EXHAUSTIVE population
        of all 67253 candidates, which is a complete census at the real
        parameter scale rather than an extrapolation, plus an exhaustive toy
        census at four small primes where the true orders are known.
        COMPARISON DISTRIBUTION - the observed per-condition rejection rates
        against 1/2, 1/2 and r/(r^2 - 1), by exact binomial tests with
        expected counts stated in advance; and the joint survival rate against
        0.031. TAIL CHECK - explicitly test whether r divides 2p + 2 for each
        r in the sieve set, since that is the exact condition under which the
        curve and twist events couple, and report the measured curve-twist
        correlation per r beside its predicted zero. TRANSFER - none for the
        symbol conditions and the survival rate, which are measured at the
        real prime on the real candidate range; the toy census transfers only
        the CORRECTNESS of the sieve, which is heuristic H2.
    - id: H2
      statement: >-
        A division-polynomial r-torsion sieve whose verdicts agree with
        brute-force order counting on an exhaustive toy population at 13 to 20
        bits is CORRECT at 382 bits; that is, the polynomial arithmetic has no
        size-dependent failure mode first appearing above 20 bits.
      rigorous_support: >-
        NONE, and the record says so plainly. This is the same shape as
        IDEA-20260829-d052e6's H2 and IDEA-20260829-f89a3a's H2 and is the
        weakest item here. It is WEAKER than in those records, because the
        sieve does polynomial arithmetic in a quotient ring rather than plain
        modular exponentiation, so there is materially more code in which a
        size-dependent defect could hide. That is a reason to weight this
        assumption more heavily against the record, not less, and it is stated
        that way.
      validation_plan: >-
        Four partial checks, none of which discharges the assumption. (i)
        Exhaustive toy agreement per r, including curves constructed to HAVE
        rational r-torsion so the instrument is shown to fire. (ii) An
        independent construction of psi_r at small r, by direct expansion
        rather than by the recursion, checked as an exact polynomial identity
        at 382 bits. (iii) A degree invariant - deg psi_r must equal
        (r^2 - 1)/2 exactly at every size, checked at 382 bits, which is a
        full-size structural self-test needing no external data. (iv) The
        r = 2 boundary, where the sieve must agree bit for bit with
        IDEA-20260829-b41d39's independent Edwards criterion at 382 bits,
        which is one full-size cross-instrument agreement on a question both
        can answer by completely different routes.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. Audit cost, itemised. C1 is a file read.
      C2 and C3 are at most a few hundred BPSW tests on 220 to 521 bit
      integers, seconds. The r-torsion test is ONE modular exponentiation in
      F_p[x]/(psi_r), that is O(r^2 log p) field multiplications or
      O(r^2 log^3 p) bit operations with schoolbook arithmetic - for r = 13
      and p at 382 bits that is about 84 squared times 382, on the order of
      10^6 field multiplications, milliseconds. C4's full sweep is 67253
      candidates times ten such tests, on the order of 10^6 exponentiations in
      small rings, which is hours on one core and well under an hour across
      14. Verification of a single torsion verdict by a second implementation
      is the same one exponentiation - succinct.
    memory_exponent: >-
      O(r^2 log p) per torsion test, that is kilobytes; O(log p) per symbol;
      the survivor list is at most 67253 short records, a few megabytes. The
      48 GB envelope is not a binding constraint. The toy census is the only
      part that benefits from the 14 cores beyond the main sweep.
    best_known: >-
      For the ODD part of the order, the best known route is a full SEA point
      count at roughly O(log^8 p) with large constants, unavailable here; this
      record does not compete with it and answers a strictly weaker question
      at O(r^2 log^3 p). For the small-prime divisibility question
      specifically, the r-torsion test IS the best known method and this
      record TIES it rather than advancing it. For the rigidity question, no
      incumbent computation exists inside or outside this program that has
      been located. Against the ECDLP attack frontier - KN-TECH-001,
      KN-TECH-006, KN-TECH-018, KN-TECH-031, KN-TECH-032, KN-TECH-033,
      KN-TECH-035 - this record is dominated by every row because it is not an
      attack.
    hidden_overhead: >-
      No o(1) and nothing superpolynomial, but the r^2 in the torsion test is
      a real wall - extending the sieve from r = 13 to r = 101 costs a factor
      of about 60 in the polynomial degree and about 3600 in the
      exponentiation, which would turn an hour into months and is why the
      sieve set stops at 13. That truncation is the reason the rank is an
      upper bound in a second sense and it is disclosed rather than absorbed.
      The other honest hidden cost is epistemic - a reconstructed rule is not
      an attributed rule, and the deliverable's value collapses if that
      distinction is blurred anywhere.
    tradeoff_note: >-
      The tradeoff is SIEVE DEPTH against SWEEP WIDTH and it is quantitative.
      With a fixed budget, sieving more primes on fewer candidates or fewer
      primes on all candidates are genuinely different experiments - the first
      gives a tighter bound on a sample, the second an honest bound on the
      whole enumeration. This record chooses the second, because the rank is
      only meaningful over a complete enumeration, and says so. There is no
      time-memory tradeoff. Parallelisation is near-perfect across candidates
      and the 14 cores are used, which is the one place in this batch where
      they matter.

  dominated_by: >-
    CHECKED AGAINST EVERY FRONTIER ROW; `null` is not asserted. AS AN ATTACK
    it is dominated by rho (KN-TECH-001, KN-TECH-006), automorphism-discounted
    rho (KN-TECH-018), BSGS (KN-TECH-031, KN-TECH-035), MOV and Frey-Ruck
    (KN-TECH-032) and the trace-one transfer (KN-TECH-033) simultaneously on
    time, memory and data, because it is not an attack. AS A ROUTE TO THE
    GROUP ORDER it is dominated absolutely by SEA on information and by the
    SafeCurves mirror on cost, since the mirror publishes the twist subgroup
    order for every row at zero compute; this record does not dispute that and
    does not compete for it. AS A SMALL-PRIME DIVISIBILITY TEST it TIES the
    best known method, the standard r-torsion test, and claims no improvement.
    AS AN EXECUTABLE RIGIDITY DIAGNOSTIC it is not dominated by any incumbent
    located - IDEA-20260829-f5bcff refuses the rigid criterion outright, the
    archived audit plan closes it, and no external tool producing a rank
    measurement against a published parameter has been identified. That
    non-domination is narrow and is stated narrowly, and it rests on a closure
    this record challenges rather than on an absence of competitors in
    general.
  sota_delta: >-
    ZERO speedup against any attack baseline on every axis. AS CAPABILITY,
    WHICH IS THE PRINCIPAL DELTA - this program currently holds NO instrument
    of any kind that touches the odd part of a group order, at any budget. The
    archived audit plan declares point counting unavailable and every proposal
    filed today works exclusively on the 2-part. The r-torsion sieve moves
    small-odd-factor information about #E at 382 bits from "requires SEA,
    unavailable, therefore DEFERRED" to "milliseconds per prime", an
    infeasible-to-feasible transition inside this environment, and it is
    reusable by every one of the twenty goals. AS SCOPE - the rigid criterion
    moves from "refused, no computation can decide it" in
    IDEA-20260829-f5bcff to "prime-selection half decidable, parameter half
    measurable to about 5.0 of about 16.0 bits", which is a partial unblock of
    a fully closed lane, stated at that size and no larger. AS DATA - the
    program currently holds zero rank measurements, zero recovered generation
    rules, and no record of which SafeCurves rows publish a recipe; this would
    produce a twenty-row recipe census, a five-row calibration result, four
    prime sweeps, and one rank with a per-condition bit accounting, where
    there are currently none.
  estimated_cost:
    implementation: high
    compute: medium
    basis: >-
      Implementation is the largest in this batch - division polynomials by
      recursion plus an independent check, polynomial arithmetic and
      exponentiation in F_p[x]/(f), a frozen rule grammar and recovery
      procedure, a twist constructor, and a toy validation harness. Compute is
      about 10^6 exponentiations in degree-4 to degree-84 quotient rings,
      under an hour across 14 cores, plus minutes of toy census. No network
      access is required.
  recommended_priority: medium

