    "claim": "A simulator matching each unconditioned attempt can mismatch the accepted transcript law if acceptance or restart state depends on the hidden ideal. Equality of the resolvent-induced public distributions is a sharper pre-design condition than single-attempt equality.",
    "mechanism": "For hidden state x, let F_x be the substochastic kernel for failed attempts and A_x the kernel emitting accepted public outputs. The first accepted-output law is mu_x*(I-F_x)^-1*A_x when absorption occurs almost surely. Compare this law across secret states sharing the public key. The recently retrieved v3 failure-analysis sections motivate identifying distinct early-splitting and gluing-failure transitions; no retry counter is assumed public. The lossy object is the accepted-output measure, paired with renewal composition. It forgets failure history only after summing its effect. If failure probabilities are negligible, their contribution may be negligible, which is an explicit alternative outcome.",
