idea:
  id: IDEA-20260816-eed484
  question_id: RQ-HAWK-001
  added: '2026-08-16'
  title: Is 'unusually easy instance' a predicate anyone can evaluate without running the solver,
    or is it defined only by the solver succeeding? Measure the predictive power of cheap pre-solve
    predicates against exact ground truth at toy scale, with label shuffling as the null.
  class: control
  claim: '(A) The entire re-randomisation idea is a search for an ''unusually easy'' instance: draw
    conjugates until one appears that the subfield approach solves. KN-OPEN-028''s Q2 closure records
    that this representation search survives its cost correction. But every record in this corpus
    that mentions the easy stratum characterises it by the SOLVER SUCCEEDING, never by an independently
    evaluable property of the instance. If ''easy'' is only definable post hoc, then the search has
    no detector, every draw costs a full solve attempt, and the density question is not the only thing
    that matters - the per-draw cost is. Nothing here has ever checked which of those regimes holds.
    (B) The claim is that detectability is measurable at toy scale as a supervised prediction problem
    with exact ground truth and no attack implementation. Ground truth: for small ideal instances
    in small number fields, whether stage-one principality is decidable by exhaustive bounded search
    within a fixed budget - an exact, cheap, reproducible label. Predictors: a small frozen set of
    pre-solve features computable in time strictly less than the labelling procedure - norm factorisation
    type, number of prime factors, size of the smallest generator of the ideal''s norm, ramification
    pattern at small primes, class-group-independent local invariants. The claim is that the achievable
    prediction quality of any such cheap feature set, measured as area under the ROC curve against
    the exact labels, is the honest operational content of ''unusually easy'', and that it is a number
    nobody has. (C) The claim is that both outcomes are useful: high predictive power means the easy
    stratum has a cheap detector and any successor analysis must charge for detection rather than
    for solving; low predictive power means the stratum is defined only by the solve, and per-draw
    cost is the load-bearing quantity rather than density. (D) NOT CLAIMED: that any detector yields
    an attack or a speedup; that the toy labelling procedure is the subfield approach - it is not,
    it is a stage-one principality proxy and is named as a proxy throughout; that KN-OPEN-028 is reopened,
    its closures being consumed here as settled; and no statement about HAWK''s security in either
    direction.'
  mechanism: 'Stage 1 fixes the proxy and states its limits loudly: the label is ''stage-one principality
    decided within budget B by exhaustive bounded search'', which is a PROXY for solver-easiness and
    not the thing itself, and KN-TECH-081''s two-stage discipline is cited to make clear that stage
    one and stage two (short generator) are different problems that broke at different times in the
    commutative history. Stage 2 generates a labelled corpus: in a small CM field, sample ideals of
    a fixed relative norm across many norm targets, run the exact labelling procedure on each, and
    record the label plus the exact cost consumed. Stage 3 freezes the feature set BEFORE looking
    at any label, and records the freeze in the specification, because a feature set chosen after
    seeing labels manufactures predictive power. Stage 4 trains the simplest possible predictors -
    a single-feature threshold rule per feature, plus one logistic model over all features - with
    strict train/test splitting by norm target so that no target appears in both, which prevents the
    model from memorising target-specific structure. Stage 5 measures test-set area under the ROC
    curve per predictor. Stage 6 runs the null in the same invocation: shuffle the labels within the
    test set and recompute the curve, 2000 times, giving the exact null distribution of the metric
    at this sample size; a predictor''s area must exceed the 99th percentile of that distribution
    to count. Stage 7 runs the cost control: measure the wall-clock-free operation count of feature
    computation versus labelling, since a ''cheap'' detector that costs as much as the solve is not
    a detector, and report the ratio. Stage 8 emits per-feature areas, the null distribution, the
    cost ratio, and the verdict on which regime holds.'
  novelty_status: unverified
  novelty_screen:
    method: Read knowledge/open-problems/KN-OPEN-028.md in full including q1_closure and q2_closure,
      and knowledge/open-problems/KN-OPEN-027.md in full including its Q2 ('is the unusually easy
      instance density real? that density is a number, and it is the load-bearing quantity'). Read
      ledger/evidence/EV-HAWK-c99848.yaml and EV-HAWK-21edba.yaml in full. Read knowledge/techniques/KN-TECH-081.md
      in full for the two-stage PIP discipline. Grep -ril 'hawk|module-lip|nrd-pip|lattice isomorphism'
      over ledger/proposals/ (11 files, titles read). Grep -ril 'fractional ideal' over ledger/proposals/
      returned 0. Read docs/inventor-protocol.md sections 3 and 4.
    results: KN-OPEN-027's Q2 says explicitly that the easy-instance density 'is a number, and it
      is the load-bearing quantity', and KN-OPEN-028 closes the density question in direction. Both
      treat the easy stratum as something with a size; neither treats it as something with or without
      a DETECTOR, and the distinction between 'the stratum is thin' and 'the stratum is thin and undetectable'
      does not appear anywhere in the corpus. No proposal mentions fractional ideals or the easy stratum.
      The nearest methodological relatives in the wider portfolio are the null-control disciplines
      the program uses generally - the AES r=5..7 measured effects with their null controls are named
      in the anti-duplication list as established and must not be re-derived, and this contract does
      not touch them, borrowing only the label-shuffling null pattern which is generic. IDEA-20260801-019
      would implement the attack and would therefore produce solver-success labels directly, which
      is a different and far more expensive design than the proxy used here.
    verdict: 'UNVERIFIED. Claimed new: framing ''unusually easy'' as a DETECTABILITY question with
      an area-under-curve answer and a label-shuffling null, and the explicit separation of ''the
      stratum is thin'' from ''the stratum has a cheap detector'' as two independent quantities of
      which only the first has ever been discussed here. Assembled from known parts: the easy-stratum
      notion is from the route as recorded in KN-OPEN-027 and KN-OPEN-028; the two-stage principality
      discipline and the warning that stage one is not stage two are KN-TECH-081; label shuffling
      and train/test splitting are entirely standard; the null-before-belief discipline is docs/inventor-protocol.md
      section 3. This program cannot read external literature and asserts nothing about what is known
      outside.'
  object_first_candidate:
    tracked_object: The pair (cheap feature vector, exact easiness label) for an ideal instance, followed
      through the prediction pipeline. What is tracked is the mutual information between a frozen
      feature set and an exact label, operationalised as test-set area under the ROC curve, as a function
      of feature set and field.
    lossiness: 'Genuinely lossy. The feature vector retains a handful of integers per ideal - factorisation
      type, prime-factor count, ramification pattern - and discards the ideal itself, its generators,
      its class and its geometry. The discard is compatible with the operation of interest because
      the operation being modelled is a pre-solve decision: whether to spend a solve budget on this
      draw, which by definition must be made from cheaply computable data. What does not survive is
      anything requiring the solve, which is exactly the point - a feature that needs the solve is
      not a detector and is excluded by the cost-ratio control rather than by taste.'
    propagation: 'One step of the target operation is a single draw-and-test cycle: compute features,
      decide, optionally solve. Under this step the tracked object propagates as an update to the
      empirical confusion matrix, and the detector''s value propagates as expected saved cost per
      draw - features cost c, labelling costs L, and a detector with true-positive rate t and false-positive
      rate f changes expected cost per successful find in a way computable exactly from those four
      numbers. That expression is reported alongside the area under the curve, since area alone hides
      the cost ratio.'
    survival_score: 'Predictive structure, if present, survives while the field is small enough for
      exact labelling. Concretely: labelling is expected to be exhaustive at CM field degree 4 over
      Q for norm targets up to a stated size, and to become budget-bound at degree 8, so the detector
      question is answerable at degree 4 and marginal at degree 8. The reported survival number is
      the largest field degree at which at least 2000 exactly labelled instances were obtained.'
  null_object_control: 'Two nulls, both in the same invocation. Null one, LABEL SHUFFLING: permute
    the exact labels within the test set 2000 times and recompute the area under the curve each time,
    giving the exact null distribution of the metric at this sample size and class balance; a predictor
    counts only if its area exceeds the 99th percentile of that distribution. Null two, RANDOM SAME-SHAPE
    INSTANCES: replace the structured ideal corpus with ideals drawn from a field of the same degree
    but with class number 1, where every instance is principal and the label is constant; the pipeline
    must report an undefined or chance-level area there, confirming it does not manufacture discrimination
    from a degenerate label. For the signal arm to mean anything, null one must produce a distribution
    centred at 0.5 with the observed area outside its upper tail, and null two must not produce a
    usable area at all.'
  discriminated_from:
  - 'KN-OPEN-027 Q2 and KN-OPEN-028 Q1 (the density question): those ask how BIG the easy stratum
    is; this asks whether membership in it is PREDICTABLE from cheap data. The two are independent
    - a thin stratum can be perfectly detectable and a fat one undetectable - and conflating them
    is the specific error this entry exists to prevent.'
  - 'The fractional-ideal density-exponent contract elsewhere in this batch: that counts pool members
    and principal members and fits a decay exponent. This one takes instances as given and measures
    a predictor''s discrimination; it produces no density and no exponent.'
  - 'IDEA-20260801-019 (independent reimplementation of the reported attack): that would produce solver-success
    labels by running the attack. This uses an exact stage-one principality proxy at toy scale, implements
    no part of the attack, and names the proxy as a proxy in every output.'
  - 'KN-TECH-081''s two-stage discipline: that entry warns stage one and stage two are different problems.
    This contract labels stage one only and cites the warning rather than eliding it; a detector for
    stage-one easiness is explicitly not a detector for solver success.'
  - 'Generic machine-learning-on-cryptanalysis proposals: the deliverable here is deliberately not
    a model but a null-referenced discrimination number plus a cost ratio, and the simplest possible
    predictors are used precisely so that any measured discrimination is attributable to the features
    rather than to model capacity.'
  assumptions:
  - Exact stage-one labelling by exhaustive bounded search is feasible for at least 2000 instances
    in a small CM field within budget; if not, the contract reports a budget limit and no area.
  - The feature set can be frozen before any label is seen, and the freeze is enforced by the specification's
    commit order rather than by good intentions.
  - Train/test splitting by norm target prevents target memorisation; if performance collapses under
    that split relative to a random split, the difference is itself reported as evidence that any
    apparent detection was target memorisation.
  - Stage-one principality within a budget is a defensible proxy for 'unusually easy' at toy scale;
    this is the weakest assumption in the contract and is stated as such rather than defended.
  predictions:
  - metric: test-set area under the ROC curve of the best single frozen feature, degree-4 CM field
    direction: higher
    minimum_effect: 0.60, and above the 99th percentile of the label-shuffling null; below that the
      stratum has no cheap single-feature detector at this scale
  - metric: label-shuffling null distribution centre
    direction: different
    minimum_effect: 'forced value: 0.50; a centre elsewhere indicates a bug in the evaluation code
      and voids every number'
  - metric: ratio of feature-computation operation count to labelling operation count
    direction: lower
    minimum_effect: 0.1; a detector costing more than a tenth of the solve proxy is not operationally
      a detector and must be reported as not cheap
  - metric: drop in area under the curve from random splitting to target-grouped splitting
    direction: different
    minimum_effect: 'refusal to pre-commit: the size of any memorisation effect depends on how many
      norm targets are used and how they are chosen, and inventing a threshold before the corpus exists
      would be a fabricated expectation'
  minimal_test:
    design: 'One CM field of degree 4 over Q with class number greater than 1, one class-number-1
      null field of the same degree, one invocation. Generate at least 2000 ideals across at least
      20 relative-norm targets; label each exactly by exhaustive bounded principality search, recording
      the operation count consumed. Compute the frozen feature set on every instance, recording its
      operation count. Split train/test by norm target, no target on both sides. Fit one threshold
      rule per feature and one logistic model over all features; evaluate area under the ROC curve
      on the held-out targets. In the same invocation, shuffle test labels 2000 times for the null
      distribution, and run the whole pipeline on the class-number-1 field where the label is constant.
      The discriminating outputs are: best feature area versus the null''s 99th percentile; the all-feature
      model''s area; the feature-to-label cost ratio; and the random-split minus grouped-split gap.
      Cost is hours of exact integer arithmetic and no attack code whatsoever.'
    controls:
    - Label shuffling within the test set, 2000 permutations, same invocation, giving the exact null
      distribution at this sample size and class balance.
    - 'Class-number-1 null field where the label is constant: the pipeline must yield no usable area.'
    - Random split versus target-grouped split, both reported, so memorisation is visible rather than
      hidden.
    - 'Cost-ratio control: operation counts for feature computation and for labelling, reported per
      instance, since a detector must be cheaper than the thing it replaces.'
    - Feature-freeze commit order recorded in the specification, so that features demonstrably predate
      labels.
    required_metrics:
    - per-feature test-set area under the ROC curve, target-grouped split
    - all-feature logistic model area, target-grouped split
    - label-shuffling null distribution (centre, 99th percentile)
    - feature-computation to labelling operation-count ratio
    - random-split versus grouped-split area gap
    - class balance of the labelled corpus and the number of exactly labelled instances
    - class-number-1 null field result
  falsification_conditions:
  - 'No feature and no model exceeds the label-shuffling null''s 99th percentile: the easy stratum
    has no cheap detector at this scale, which is a usable measured obstruction and shifts the load-bearing
    quantity from density to per-draw cost.'
  - The label-shuffling null is not centred at 0.5, indicating an evaluation bug that voids all numbers.
  - The class-number-1 null field yields a usable area despite a constant label, proving the pipeline
    manufactures discrimination.
  - Area collapses from the random split to the target-grouped split, meaning any apparent detection
    was norm-target memorisation.
  - The feature-to-label cost ratio exceeds 1, meaning the 'cheap' features are not cheap and no detector
    claim is available.
  - Fewer than 2000 instances can be exactly labelled within budget, in which case a budget limit
    is reported and never a negative mathematical result.
  confounders:
  - 'Class balance drives area estimates: a corpus that is 95 percent one label makes area unstable,
    and the class balance must be reported with every number and controlled by target selection where
    possible.'
  - 'The labelling budget B defines the label: a different B gives different labels and possibly a
    different detector, so B is frozen and every conclusion is scoped to it.'
  - Norm-target selection can accidentally correlate a feature with the label through the sampling
    design rather than through arithmetic; grouped splitting mitigates but does not eliminate this.
  - Small fields have few distinct feature values, so threshold rules degenerate and area estimates
    are coarse.
  - Stage-one principality is a proxy and may be nearly uncorrelated with subfield-solver easiness;
    no result here transfers to the latter, and the contract says so in every output rather than in
    a footnote.
  interpretation_limits:
  - A detector for the toy stage-one proxy is not a detector for the route's easy instances; KN-TECH-081's
    two-stage warning applies directly and the proxy is named in every output.
  - All numbers are at CM field degree 4 (and possibly 8) over Q with small discriminants; no extrapolation
    to the fields arising at HAWK parameters is offered or licensed.
  - Detectability and density are independent quantities; a result here says nothing about the density
    settled in KN-OPEN-028, which remains closed.
  - No attack, speedup or security consequence follows from any value, including a high area under
    the curve.
  target_complexity:
    time_exponent: No attack exponent is claimed. The reported cost quantities are operation-count
      ratios between feature computation and labelling, which are relative and dimensionless, not
      exponents.
    memory_exponent: No attack memory exponent is claimed. Storage is a feature table of a few thousand
      rows.
    best_known: There is no incumbent detector in this corpus - the easy stratum has only ever been
      characterised by solver success - which is exactly the gap. For the route's overall standing
      the incumbent characterisation remains KN-OPEN-028's super-polynomial closure, which this contract
      does not touch.
    hidden_overhead: The feature freeze is the entire methodological load and is enforceable only
      by commit order; a run that quietly adjusts features after seeing labels will produce a confident
      and meaningless area. Second, the labelling budget B is presented as a parameter but is really
      a definition, and choosing it generously makes the label easy and the detection spurious.
  dominated_by: 'Checked against every route row in KN-OPEN-028''s live-surface table - Straznickas-Weis
    unconditional 2^{(n/2+1)+o(n)} (KN-LIT-7592); nrd-PIP super-polynomial, underived (KN-LIT-7674);
    definite/indefinite LIP reporting HAWK unaffected (KN-LIT-7648); the SLIP AM-intersect-coAM ceiling
    (KN-LIT-7671) - plus generic lattice reduction on the 2n-dimensional lattice. This contract claims
    no attack and enters no frontier row: n/a (no result claimed).'
  sota_delta: No attack; measurement contribution only. The quantity moved is the detectability of
    easy instances by cheap pre-solve features, which goes from never posed as a question to a null-referenced
    area under the ROC curve with a cost ratio, at toy field degree, on an explicitly named stage-one
    proxy.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: 'Part (B), that a corpus of at least 2000 exactly labelled instances is
    obtainable at degree 4: 0.6, with the exhaustive principality search the binding constraint -
    the same constraint that binds the density contract in this batch. That the best frozen feature
    exceeds the shuffling null: 0.5, genuinely a coin flip, since factorisation type plausibly correlates
    with principality but the correlation may be entirely absorbed by the class group in ways cheap
    features cannot see. That such a correlation, if found, survives target-grouped splitting: 0.35,
    because memorisation is the most common way this kind of result evaporates. Part (C), that both
    outcomes are usable: 0.85, since ''no cheap detector'' directly relocates the load-bearing quantity.
    Probability the proxy is so far from solver easiness that the whole contract is uninformative
    about the route: 0.4, recorded honestly because it is the contract''s weakest joint.'
