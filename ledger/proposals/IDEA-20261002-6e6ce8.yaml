idea:
  id: IDEA-20261002-6e6ce8
  question_id: RQ-ECDLP-002
  added: '2026-10-02'
  status: proposed
  approved_by: null
  title: >-
    Target-dependent coset of an implicit base: does the hit rate gain a
    power of N, or only a constant
  class: control
  claim: >-
    On a generic prime-order short-Weierstrass curve over F_p, let H_0 be a
    fixed public subgroup of F_p-star of order B and let the target-dependent
    base be the set of points whose abscissa lies in the coset x(Q) times
    H_0 (R1 of RQ-ECDLP-623a32). The attack stage is relation decomposition,
    through the hit probability pi only. A power saving pi_target /
    pi_fixed >= N to the 1/8, sustained as N grows through the toy grid,
    changes the balanced time exponent of the uniform-hit model from
    2/(m - theta) to 2(1 - epsilon)/(m - theta) with epsilon >= 1/8. A ratio
    bounded by 2 does not change the exponent. The proposal asserts neither
    arm. It asserts that the ratio, measured against a fixed-base control on
    the same curves, separates them. Pollard rho and BSGS stay the matched
    cost baselines. No attack is claimed.
  mechanism: >-
    OBJECT FRAME. Representation: R1, the coset representative of
    x(P) times x(Q) to the -1 in F_p-star over H_0, stored as the field
    element x(P) to the (p-1)/B times x(Q) to the -(p-1)/B. Operation set
    Sigma: multiplication of abscissae by elements of H_0. Sigma is not
    elliptic translation and does not contain it. TRICHOTOMY: partial-action.
    The cosets of H_0 are the blocks of the multiplication action of H_0 on
    F_p-star, a proper sub-action of the multiplicative monoid, and the
    tracked value is constant on each block. LOSSY PROJECTION: the value
    discards the ordinate and the position of x(P) inside its coset (B
    possible abscissae map to one value). The discard is exactly the block
    system of Sigma, so it is compatible with Sigma. It is not compatible
    with elliptic addition, and no such compatibility is claimed. A map that
    kept the full abscissa would be injective on the coset and is not the
    object. F2 enters only as the hit test (the degree-2 chord equation
    against the coset), named as a component. KN-OPEN-020 class:
    target-dependent, because the coset moves with Q, and
    implicit-membership, because membership is one exponentiation. Canonicalising
    a coset costs one exponentiation, O((log p) squared) field
    multiplications, and that cost is charged in every trial. The exponent
    arithmetic, conditional on a power epsilon in the hit rate and on the
    listing exponent theta of the companion sampler record: T_rel scales as
    N to the (1 - epsilon) times B to the (theta + 2 - m). Balancing against
    B squared moves the time exponent from 2/(m - theta) to
    2(1 - epsilon)/(m - theta). At m = 5 and theta = 1, any epsilon > 0
    drops the model exponent strictly below 1/2, while a constant-factor
    ratio does not, because constants sit inside Theta. The test's minimum
    effect is therefore a power, N to the 1/8, not a constant.
  novelty_status: unverified
  citations:
    - ref: KR-IC-5931ee
      provenance: internal
      claim: >-
        Algebraic factor bases over F_p, including the Petit–Kosters–Messeng
        tower as named on the row, are reported only at small parameters,
        and naive prime-field index calculus does not beat generic methods
        under the row's statistical assumptions. Read from the rendered
        frontier map.
      verified_by: idea-generator session 2026-10-02
    - ref: KN-OPEN-020
      provenance: internal
      claim: >-
        Target-dependent descriptions and implicit membership are outside
        the bounded-degree obstruction the open problem records as proved.
      verified_by: idea-generator session 2026-10-02
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic algorithm needs Omega(sqrt(p)) group operations. A hit-rate
        test that uses only group operations and equality cannot beat that
        bound. This test uses the field multiplication structure of the
        abscissa. Read from the rendered frontier map.
      verified_by: idea-generator session 2026-10-02
    - ref: 10.1016/j.ffa.2018.01.009
      provenance: retrieved
      claim: >-
        Amadori, Pintore, and Sala, introduction as read: their prime-field
        variant defines the factor base on the run from the targets
        themselves, which is a different target-dependent construction (the
        base is a list of random points, not a multiplicative coset). They
        state that beating rho remains open. The coset construction is not
        theirs.
      verified_by: idea-generator session 2026-10-02
  assumptions:
    - >-
      F2 is the hit test only. The base definition is the coset, not a
      summation polynomial.
    - >-
      If the coset polynomial is expanded into a dense polynomial of degree
      (p-1)/B and solved as a dense system, the base leaves the
      implicit-membership class. The implementation is forbidden to do that.
      Membership stays one exponentiation.
    - >-
      The companion exponent formula is an algebraic model, not a measured
      attack cost. This record only measures epsilon.
  predictions:
    - metric: >-
        log(pi_target / pi_fixed) divided by log N, the empirical epsilon,
        at m = 5, B nearest to N to the 1/4
      direction: higher
      minimum_effect: >-
        Empirical epsilon at least 1/8 on a majority of the toy primes in
        the grid. An epsilon below 1/16, or a ratio pi_target / pi_fixed
        inside [0.5, 2], is the constant-factor arm and does not move the
        exponent.
    - metric: >-
        membership-test count per hit, target-dependent arm versus fixed arm
      direction: different
      minimum_effect: >-
        A multiplicative gap of at least N to the 1/8 in hits per
        membership test. A gap of 2 or less is the null arm.
  minimal_test:
    design: >-
      Three toy primes with N near 2 to the 16, 2 to the 18, and 2 to the 20.
      B nearest to N to the 1/4. For 100 random targets, count hits of the
      degree-2 chord test into x(Q) H_0 and into a fixed H_0, using the same
      trial budget of B membership tests per target. Fit epsilon from the
      three primes. Stop at this grid.
    controls:
      - >-
        Pollard rho and BSGS on the same three curves, reported as costs,
        not as competitors to a hit rate.
      - >-
        Fixed-base arm: the same H_0, independent of Q.
      - >-
        Random-coset null: replace x(Q) by a uniform field element that is
        not an abscissa of a point in the subgroup. A power saving that
        appears there is an artifact.
      - >-
        Generic-group null: relabel the group as Z/NZ and use a random
        injection for the abscissa. The ratio on that object is the
        non-elliptic baseline.
    required_metrics:
      - pi_target and pi_fixed at each of the three primes
      - empirical epsilon
      - membership tests per hit on each arm
      - rho step count on each curve
  falsification_conditions:
    - >-
      pi_target / pi_fixed stays inside [0.5, 2] at all three primes. Epsilon
      is 0 in this range. The target-dependent coset does not move the
      exponent.
    - >-
      The ratio grows on the random-coset null at the same rate as on the
      real targets. The growth is not about Q.
    - >-
      Epsilon >= 1/8 but the extra hits are duplicate ordinates of a single
      abscissa. Then the power is a double-counting bug.
    - >-
      The symbolic step from epsilon to the exponent
      2(1 - epsilon)/(m - theta) fails when constants are written out. The
      exponent translation is withdrawn. The hit-rate measurement can still
      stand.
  confounders:
    - >-
      x(Q) = 0 is excluded. Those targets are a separate small set.
    - >-
      H_0 not dividing p - 1 makes the coset undefined. The implementation
      must pick B dividing p - 1 and record the cofactor (p - 1)/B.
    - >-
      At pi near 1 the ratio saturates at 1 even if a power existed at
      smaller B. Report raw hit counts, not only ratios of saturated rates.
  interpretation_limits:
    - >-
      Three toy primes only. A fitted epsilon is not a cryptographic
      exponent.
    - >-
      KN-OPEN-020 class: target-dependent and implicit-membership. Not a
      bounded-degree plane predicate. Not a high-degree interpolation
      polynomial.
    - >-
      This record does not claim a decomposition algorithm, a linear-algebra
      cost, or a solve.
    - >-
      A constant-factor ratio is compatible with KR-IC-5931ee and is a
      negative result only for the power-saving arm.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For targets drawn uniformly in the prime-order subgroup, pi_fixed
        equals c times B to the (m - 1) over N with 1/2 <= c <= 2, at
        m = 5 and B nearest N to the 1/4, on the three toy primes.
      rigorous_support: >-
        Balls-and-bins expectation for a domain of size B to the (m - 1)
        and a codomain of size N. The chord equation is not proved to be a
        uniform random mapping.
      validation_plan: >-
        The fixed-base arm of the minimal test is the check. If c falls
        outside [1/2, 2] at any of the three primes, H1 fails and epsilon
        is not interpreted inside the model. Tail check: the target with
        the most hits has at most 10 times the mean hit count.
    - id: H2
      statement: >-
        A ratio pi_target / pi_fixed that scales as N to the epsilon with
        epsilon >= 1/8 across the three primes is not produced by the
        multiplicative bijection x maps to x times x(Q) alone. That
        bijection preserves uniform hit rates on a random subset.
      rigorous_support: >-
        Multiplication by a fixed nonzero field element is a bijection of
        F_p, so it preserves the cardinality of any set. It does not by
        itself change a uniform hit rate. Any measured power is therefore
        a statement about the chord equation on that coset, not about
        cardinality.
      validation_plan: >-
        Apply the same bijection to the random-subset null. The ratio there
        must stay inside [0.5, 2]. If it scales as a power, H2 fails and
        the elliptic arm is not distinguishable from a relabeling.
  target_complexity:
    time_exponent: >-
      Conditional on epsilon >= 1/8, m = 5, and theta = 1: N to the power
      2(1 - epsilon)/4 <= N to the (7/16) at epsilon = 1/8. On the
      constant-factor arm: unchanged from N to the 1/2 in the model.
    memory_exponent: >-
      Matrix memory B squared. At the shifted balance B = N to the
      (1 - epsilon)/(m - theta). At the numbers above, memory exponent
      (1 - epsilon)/2 <= 7/16. Rho memory stays polylog.
    best_known: p to the 1/2 times polylog, Pollard rho
    hidden_overhead: >-
      One exponentiation per membership, (log p) squared field
      multiplications, plus the constant c in H1. No o(1) exponent term is
      used. The three-prime fit has no room to hide a log factor inside an
      o(1).
    tradeoff_note: >-
      Single target. The coset depends on Q, so a table built for one
      target is not a preprocessing table for a second target. Parallel
      membership tests speed the trial by a constant factor equal to the
      number of testers and do not change epsilon.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  proof_search_map:
    bottleneck: >-
      Whether pi_target / pi_fixed grows as a power of N. A constant ratio
      leaves the rho exponent in place inside the model.
    baseline_embedding:
      parameter_slice: >-
        epsilon = 0, the fixed-base arm, which is the uniform-hit model at
        exponent 1/2 when theta = 1 and m = 5 after constants are ignored
        inside Theta. The fixed arm is the baseline slice.
      reproduction_check: >-
        On the smallest toy prime, the fixed-arm hit count is within a
        factor 2 of B to the 4 over N times the trial count, at m = 5. If
        it is not, the baseline of the model is already false and epsilon
        is not computed.
    observation_collision:
      observable: >-
        The multiset of accepted abscissae on the target-dependent arm.
      distinct_preimage_search: >-
        Two targets with the same coset value and disjoint accepted sets.
        If every apparent extra hit is the same abscissa stored twice, the
        power is a collision of labels, not of points.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The fibre of the coset map x maps to x to the (p-1)/B, shifted
          by x(Q).
        predicted_gain: >-
          If the fibre over the identity carries N to the 1/8 more chord
          hits than a fixed fibre, epsilon >= 1/8 and the model exponent
          drops by at least 1/16 at m = 5, theta = 1 (from 1/2 to at most
          7/16).
    quantifier_order: >-
      EXISTS an epsilon, or FOR ALL three toy primes the ratio is O(1).
      Explicitly: either FOR ALL three primes the ratio lies in [0.5, 2],
      or the log-log slope across the three primes is at least 1/8. The
      record claims one of these two statements will hold on the data. It
      does not claim which.
    method_ceiling:
      strongest_certifiable_claim: >-
        A three-prime measurement of epsilon. The strongest model
        translation is a conditional exponent 2(1 - epsilon)/(m - theta),
        still heuristic, still toy-scoped.
      nearby_object_control: >-
        The random-coset null. A power saving there means the nearby
        object, which is not an ECDLP target, reproduces the effect, so
        the effect is not evidence about Q.
    proof_obligations:
      - claim: >-
          Multiplication by x(Q) is a bijection, so a uniform random set
          does not gain a power from the shift alone.
        responsibility: correctness
      - claim: >-
          At m = 5 and theta = 1, epsilon > 0 moves the model exponent
          strictly below 1/2, and a constant ratio does not.
        responsibility: runtime
      - claim: >-
          Membership stays one exponentiation on both arms.
        responsibility: memory
    not_applicable_reason: null
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-IC-5931ee
      - KR-IC-5a43e5
      - KR-IC-cd159a
      - KR-IC-9e610d
      - KR-IC-73db3f
      - KR-RHO-13bf67
      - KR-RHO-53c89f
      - KR-RHO-ea34b8
    nearest:
      - ref: KR-IC-5931ee
        provenance: retrieved
        relation: adjacent
        delta: >-
          The row covers naive prime-field summation systems and
          small-parameter algebraic bases. This record measures the hit
          rate of one target-shifted multiplicative coset, an
          implicit-membership description, and claims no Gröbner exponent
          and no speedup. A constant ratio is compatible with the row. A
          power N to the 1/8 would be outside what the row states. It is
          not asserted.
      - ref: KR-IC-cd159a
        provenance: retrieved
        relation: orthogonal
        delta: >-
          Xedni lifts the curve to characteristic zero. This record stays
          in F_p and uses no lift. The mechanisms share no steps.
    searched:
      corpus_grep:
        - target-dependent
        - coset of F_p
      web: []
      blocked: []
  dominated_by: >-
    On the constant-ratio arm, KR-RHO-13bf67 dominates time and memory:
    rho at exponent 1/2 with polylog memory, against a model that does not
    improve time. On the power-saving arm the conditional time exponent
    7/16 at epsilon = 1/8, m = 5, theta = 1 is not strictly dominated by
    the rows in rows_checked. KR-RHO-ea34b8 has a better online exponent
    only after preprocessing of size about l to the 2/3, a different data
    axis, and it is generic. KR-IC-73db3f chooses a linear subspace over
    a binary field. It does not apply to a multiplicative coset in F_p.
  sota_delta: >-
    Constant-ratio arm: time-exponent delta 0 versus p to the 1/2, memory
    worse by a positive power of N (the matrix). Power arm at the minimum
    effect epsilon = 1/8, m = 5, theta = 1: model time exponent at most
    7/16, which is 1/16 below 1/2, with memory exponent at most 7/16
    against rho's polylog memory. Unmeasured.
