idea:
  id: IDEA-20260811-332ce9
  question_id: RQ-JINV-8fc13a
  added: '2026-08-11'
  title: >-
    DISCHARGING IDEA-20260807-18d2f7 OUTCOME 2 FOR TWO STATED COMPUTATION
    CLASSES: an orbit invariant for an endomorphism alpha is a rational function
    f on E with deg(f o alpha) = deg(alpha)*deg(f), so exact invariance forces
    deg(alpha) = 1 - the sqrt(|Aut|) ceiling is a DEGREE identity, not a cost
    argument - and the pointwise version closes every f of degree
    d < N/(2(deg alpha + 1)); the surviving class is high-degree cheaply
    evaluable functions, of which the entire power-map family x^m is decided
    EXACTLY by one lcm computation whose value at j = 0 must be 3 and whose
    value at |D_0| in {7, 8, 11} is predicted to be p - 1
  class: mechanism

  claim: >-
    (A) THE OPEN RUNG BEING ATTACKED, QUOTED RATHER THAN PARAPHRASED.
    IDEA-20260807-18d2f7 (lane RQ-EWALK-8fa147) enumerates the quotient ladder
    H <= (Z/N)^*, shows that only COST 1 (canonicalisation, paid per step) binds,
    computes that a cheap H-invariant for |H| = N^{1/3} would give an N^{1/3}
    prime-field ECDLP algorithm - an exponent move from 1/2 to 1/3 - and argues
    that Shoup's bound does not forbid it because such an invariant is
    encoding-dependent and hence non-generic. That record's section (F) lists
    three failed candidates and states explicitly: "NOT EXHAUSTIVE ... The
    absence of a cheap invariant is an OPEN PROBLEM here, not a theorem". Its
    section (G) names OUTCOME 2 as the target: "someone proves no such invariant
    exists for a stated class of computations (e.g. low-degree rational
    functions of x). Then the sqrt(6) ceiling becomes a theorem rather than a
    cost argument". THIS RECORD SUPPLIES THAT PROOF FOR TWO STATED CLASSES AND
    FOR NO OTHERS, AND SAYS EXACTLY WHICH CLASS SURVIVES.

    (B) THE SETTING, FIXED ONCE. E/F_p ordinary, p > 3, G <= E(F_p) of prime
    order N. Let alpha be in End_{F_p}(E) with deg(alpha) = n >= 1. Since
    End_{F_p}(E) is commutative for ordinary E and [-1] is central,
    alpha o [-1] = [-1] o alpha, so x(alpha(P)) depends only on x(P): there is a
    rational map psi of P^1 with x o alpha = psi o x and
    deg(psi) = deg(x o alpha)/deg(x) = 2n/2 = n. By H-ENDO-001, alpha acts on G
    as multiplication by a scalar lambda in (Z/N)^*; write h for the
    multiplicative order of lambda. THE OBJECT AT ISSUE is a class label
    f: a function computable from the ENCODING of a single point with
    f(alpha(P)) = f(P) for all P in G, non-constant on G.

    (C) PROPOSITION 1 (EXACT-INVARIANCE FORM). Let f in F_p(E) be non-constant
    with f o alpha = f as elements of the function field. Then n = 1, i.e.
    alpha is in Aut(E), and therefore h divides |Aut(E)| <= 6.
    PROOF. Degrees of morphisms of smooth projective curves are multiplicative:
    deg(f o alpha) = deg(f) * deg(alpha) = d*n. If f o alpha = f then d*n = d
    with d >= 1, so n = 1. An endomorphism of degree 1 is an isomorphism
    E -> E, i.e. an element of Aut(E), whose order over F_p with p > 3 divides
    6 and equals 6 only at j = 0, 4 only at j = 1728, 2 otherwise. QED.
    [derived in this record; one line, checkable by hand.]
    THE CONTENT: the sqrt(|Aut|) ceiling for exactly invariant labels is a
    DEGREE IDENTITY. It does not depend on cost accounting, on the generic group
    model, on the size of N, or on any heuristic. This is what KN-TECH-018
    records as an empirical constant and what IDEA-20260807-f00729 explains by
    the non-homomorphism of the orbit map; neither derives it from degrees, and
    the degree route proves strictly more, because it covers labels that are not
    orbit maps at all.

    (D) PROPOSITION 2 (POINTWISE FORM - THE ONE AN ALGORITHM ACTUALLY NEEDS). An
    algorithm needs f(alpha(P)) = f(P) only for P in G, not as an identity of
    rational functions. Let f in F_p(E) be non-constant of degree d and suppose
    f(alpha(P)) = f(P) for every P in G at which both sides are defined. If
        N > 2*d*(n + 1)
    then f o alpha = f identically, and hence n = 1 by Proposition 1.
    PROOF. Put g = f o alpha - f in F_p(E). Its polar divisor is contained in the
    sum of the polar divisors of f o alpha and f, so deg(div_infinity(g)) <=
    d*n + d = d(n+1). g vanishes at every point of G except at most the
    d(n+1) points of G that are poles of either term, hence has at least
    N - d(n+1) zeros. If g is not identically zero its zero divisor and polar
    divisor have equal degree, so N - d(n+1) <= d(n+1), i.e. N <= 2d(n+1),
    contradicting the hypothesis. QED.
    [derived in this record; the divisor bookkeeping is deliberately loose by a
    factor 2 so that no pole-counting subtlety can be load-bearing.]

    (E) COROLLARY 1 (THE ARITHMETIC STRAIGHT-LINE-PROGRAM CLASS, WHICH IS THE
    CLASS 18d2f7 ASKS ABOUT). Suppose f is computed from the affine coordinates
    (x, y) of P by a straight-line program of length L over F_p using only
    +, -, *, / with constants in F_p. Then f is a rational function on E, and
    since deg(x) = 2, deg(y) = 3, and each arithmetic step at most adds the
    degrees of its two operands, deg(f) <= 3 * 2^L. Combining with Proposition 2:
      IF n >= 2 AND 3 * 2^{L+1} * (n + 1) < N, THEN NO SUCH f IS
      alpha-INVARIANT ON G.
    Equivalently, any arithmetic-SLP invariant for a non-automorphism alpha
    satisfies
        L >= log2(N) - log2(n + 1) - log2(6).
    THE HONEST READING, AND IT IS A LIMIT ON THIS RECORD, NOT A STRENGTH:
    L ~ log2 N is O(polylog), which 18d2f7's condition (D) explicitly ALLOWS.
    So this corollary closes the O(1)-and-low-degree part of the rung and does
    NOT close the polylog part. A degree-N invariant evaluable in log2 N field
    operations (e.g. a power map) is not excluded by any argument here, and if
    one existed with h = N^{alpha} it would still give an
    N^{(1-alpha)/2} * polylog algorithm. The rung is NARROWED, not closed, and
    any summary that says otherwise is overclaiming.

    (F) COROLLARY 2 (THE ENTIRE POWER-MAP FAMILY IS DECIDED EXACTLY BY ONE
    NUMBER). The natural inhabitants of the surviving class - high degree, cheap
    evaluation - are the power maps f = x^m (degree 2m on E, cost <= 2*log2(m)
    field multiplications) and, as the special case m = (p-1)/e, the power-residue
    characters. For these the invariance condition is decidable EXACTLY and
    CHEAPLY, with no search over m at all. Define, for P in G with x(P) != 0,
        r_P = psi(x(P)) / x(P) = x(alpha(P)) / x(P)  in  F_p^*.
    Then x^m is alpha-invariant on G if and only if r_P^m = 1 for every such P,
    i.e. if and only if m is a multiple of
        L(E, alpha) := lcm { ord(r_P) : P in G, x(P) != 0 }  (a divisor of p-1).
    So a non-trivial invariant power map exists if and only if L(E, alpha) < p-1,
    and when it exists the minimal one is f = x^{L(E,alpha)}. ONE lcm decides an
    infinite family.
    TWO PREDICTED VALUES, FIXED BEFORE EXECUTION:
      - j = 0, alpha = zeta_3 (n = 1): psi(x) = zeta_3 * x, so r_P = zeta_3 is
        CONSTANT and L = 3. The known invariant x^3 is recovered exactly, and
        this is the instrument's positive control - it MUST fire.
      - |D_0| in {7, 8, 11}, alpha the CM element of norm 2, 2, 3 (n >= 2):
        psi is a non-linear degree-n map, r_P varies over G, and L is predicted
        to be p-1 (no invariant power map). A value L < p-1 here is a direct
        falsifier of the prediction and reopens the exponent rung with a
        concrete object in hand.

    (G) WHAT THIS SAYS ABOUT RQ-JINV-8fc13a's ACTUAL QUESTION. The question asks
    whether special j confers an ECDLP advantage beyond sqrt(|Aut|). Propositions
    1 and 2 answer the label half of it in a form the lane did not have: the
    existence of a bounded-degree cheap class label is EQUIVALENT to alpha being
    an automorphism, and automorphisms of order > 2 exist only at j = 0 and
    j = 1728. Small |D_0| supplies CHEAP endomorphisms (degree 2 or 3, evaluable
    in O(1) field operations) but they are not automorphisms, and by Proposition
    2 their cheapness buys no bounded-degree label. THE ADVANTAGE OF SPECIAL j IS
    THEREFORE NOT "A CHEAP MAP" - small |D_0| has those too - IT IS "A CHEAP MAP
    OF DEGREE 1". That distinction is the lane's answer and it is a theorem, not
    a measurement.

    (H) WHAT IS NOT CLAIMED. No exponent is moved. No attack is proposed.
    sota_delta on every cost axis is zero. The result is a scoped impossibility
    for two named computation classes, and the residual class it names is
    explicitly still open.

  resource_label: >-
    R1 (x-coordinates as field elements) for the object being bounded, R3
    (End(E) as a ring) for the degree of alpha. The record itself consumes no
    resource: it is an argument plus one exact finite computation.

  admissibility: admissible
  admissibility_argument: >-
    The object bounded here - an encoding-dependent class label - is precisely
    the object IDEA-20260807-18d2f7 (E) argues is OUTSIDE KN-FIND-b7e091's
    closure, because in the generic group model labels are random and no
    function of one label can be constant on orbits without knowing the orbit
    structure. Bounding a non-generic object is admissible. H-ENDO-001 is used
    only as the admissibility filter (alpha acts on G as a scalar) and is not
    retested; note that the scalar action is what makes lambda well defined and
    is NOT what obstructs the label - the obstruction here is a degree identity
    that would hold even if the action were not scalar.

  discriminated_from:
    - >-
      IDEA-20260807-18d2f7, which POSES the rung, computes its N^{1/3} payoff,
      and explicitly declines to close it ("an OPEN PROBLEM here, not a
      theorem"), listing OUTCOME 2 - a proof for a stated computation class - as
      the target. This record is that proof for two stated classes. The degree
      identity deg(f o alpha) = deg(f)*deg(alpha) appears nowhere in 18d2f7; its
      candidates F1-F3 are the orbit sum, symmetric functions computed in the
      group, and modular/isogeny invariants, none of which is a degree argument
      and none of which covers x^m. Neither record contains the other.
    - >-
      IDEA-20260807-f00729 (this lane), which closes the class of mechanisms
      whose TRACKED OBJECT IS THE Aut-ORBIT and whose TRANSITION IS ADDITION,
      by the non-homomorphism of the orbit map. That obstruction is about the
      group law; this one is about degrees of morphisms and applies to labels
      that are never added and to groups H not contained in Aut(E). f00729's
      argument cannot bound anything for deg(alpha) >= 2 because such an alpha
      supplies no orbit map on E at all; this one cannot say anything about
      branching costs. The two are independent.
    - >-
      IDEA-20260807-778375 (this lane), which shows the CM ring's publicly
      usable output on G is the single GLV eigenvalue lambda. That record's
      obstruction is that lambda is a KNOWN SCALAR and known scalars are
      generic. This record asks the complementary question - whether lambda's
      ORBITS admit a cheap label - and answers it for bounded-degree labels.
      778375 does not mention labels, canonicalisation, or degrees.
    - >-
      IDEA-20260807-d329e2 and IDEA-20260807-477e40 (this lane), which use the
      j = 0 quotient coordinate (w = y^2, equivalently x^3) inside the
      summation-polynomial and factor-base constructions. Those records USE the
      invariant; this one explains why x^3 exists at j = 0 and why nothing of its
      kind exists for a degree-2 CM endomorphism, which is the question those
      records do not ask.
    - >-
      IDEA-20260802-005, whose mechanism text says "the only general way to
      canonicalize an orbit of size r is to generate it". 18d2f7 already notes
      that the word "general" is load-bearing. This record removes the word for
      the bounded-degree class and leaves it standing for the rest.

  object_first_candidate:
    tracked_object: >-
      THE CLASS LABEL f ITSELF, considered as a morphism E -> P^1 with a degree.
      The three axes: (i) which subgroup H = <lambda> of (Z/N)^* it is constant
      on; (ii) its degree as a morphism; (iii) its evaluation cost. The
      contribution is that (ii) and (i) are linked by an identity, so the object
      is not free to be chosen.
    lossiness: >-
      LOSSY, and the lossiness is exactly log2(h) bits: f discards which element
      of the orbit is held. The lossy-projection test's second clause -
      does the retained part propagate deterministically under the target's
      operations - is what this record answers, and it answers it in the
      negative for every bounded-degree f and every alpha of degree >= 2: there
      is no such f at all, so nothing propagates because nothing exists. For
      alpha of degree 1 (j = 0, j = 1728) f exists (x^3, x^2) and propagates
      through alpha but NOT through addition, which is f00729's separate
      closure. The two failure modes are at different places and this record is
      careful not to conflate them.
    propagation: >-
      Deterministic under alpha by construction when f exists. The record's
      content is that existence itself is bounded by a degree identity.
    survival_score: >-
      GENUINELY NEW TO THIS PROGRAM as an argument (the degree identity is
      classical mathematics and is not claimed as new against the external
      literature); CONCRETELY TESTABLE (Corollary 2 gives an exact finite
      decision procedure for an infinite family, with a positive control that
      must fire); SURVIVES to the boundary of its stated class and dies exactly
      at degree N/(2(n+1)), which is stated rather than hidden.

  mechanism: >-
    STEP 0 (ZERO COMPUTE, AND IT IS THE MAIN DELIVERABLE). Write out
    Propositions 1 and 2 and Corollaries 1 and 2 as above, with the divisor
    bookkeeping done explicitly. Nothing in Step 0 needs a machine.

    STEP 1 (INSTRUMENT VALIDATION - THE POSITIVE CONTROL, AND IT IS BLOCKING).
    Construct a toy j = 0 curve over F_p with p = 1 mod 3 and a prime-order
    subgroup G. Implement alpha = zeta_3 as (x, y) -> (zeta_3 * x, y). Compute
    r_P = x(alpha(P))/x(P) for every P in G with x(P) != 0 and report the
    multiset {r_P} and L(E, alpha) = lcm of the orders. REQUIRED OUTPUT: r_P is
    the CONSTANT zeta_3 on every P, and L = 3, recovering f = x^3. If the
    instrument does not return exactly this it is broken and every other number
    in the run is void. Repeat at j = 1728 with alpha = i, requiring r_P = -1
    constant and L = 2, recovering f = x^2.

    STEP 2 (THE TEST ARMS). Construct toy ordinary curves with CM by the orders
    of fundamental discriminant D_0 in {-7, -8, -11} (so |Aut| = 2, no
    automorphism beyond negation) with a large prime-order subgroup, and build
    the CM endomorphism alpha of norm n in {2, 2, 3} explicitly: alpha is a
    rational n-isogeny E -> E' composed with an F_p-isomorphism E' -> E, and its
    kernel is the unique rational subgroup of order n above the ramified or
    split prime, obtained by Velu from an n-torsion point. Verify alpha is an
    endomorphism by checking alpha^2 - t_alpha*alpha + n = 0 on sampled points,
    where t_alpha is the trace of the CM element. Then compute the same
    statistics: the multiset {r_P}, L(E, alpha), and whether L < p-1.
    PREDICTION: L = p-1 on every such curve, i.e. NO invariant power map, while
    alpha itself costs O(1) field operations to evaluate. That is the record's
    central empirical claim and it is a statement about an exhaustively searched
    family, not a sample.

    STEP 3 (THE BOUNDED-DEGREE ARM, WHICH IS A DIRECT TEST OF PROPOSITION 2).
    On the same curves, enumerate all rational functions of the form
    f = u(x)/v(x) with deg u, deg v <= d_max for d_max small enough that
    2*(2*d_max)*(n+1) < N, with coefficients in a declared finite set, and test
    alpha-invariance on G by evaluation. PREDICTION: none is invariant and
    non-constant, exactly as Proposition 2 requires, on every curve including
    the j = 0 control where the only invariants found must be functions of x^3.
    A single non-constant invariant of degree below the threshold on a curve
    with n >= 2 REFUTES PROPOSITION 2 and is the cheapest possible falsifier of
    the whole record.

    STEP 4 (FORWARD GUIDANCE - THE RESIDUAL CLASS, WRITTEN OUT SO THE NEXT
    SESSION DOES NOT HAVE TO REDERIVE IT). What survives Propositions 1-2 and
    Corollaries 1-2:
      S1 FUNCTIONS OF DEGREE >= N/(2(n+1)) THAT ARE STILL CHEAP TO EVALUATE.
        Power maps are handled by Corollary 2; what is NOT handled is a general
        cheaply evaluable high-degree function. Naming a second concrete family
        in this class (beyond power maps and characters) is the next piece of
        work and this record does not have one.
      S2 FUNCTIONS THAT ARE NOT RATIONAL FUNCTIONS OF THE CURVE AT ALL:
        comparisons and min/max on the integer representative of x, bit
        extraction, table lookups, hashing. These are exactly the "encoding"
        functions 18d2f7 (D) has in mind, and NO argument here touches them.
        Note that min-over-the-orbit costs h evaluations and is therefore COST 1
        again, so the open question is specifically whether a comparison-based
        label can be computed WITHOUT generating the orbit.
      S3 CHEAP SELECTORS RATHER THAN INVARIANTS. A walk needs a canonical
        representative, which is weaker than an invariant: a function
        s: G -> G with s(alpha(P)) = s(P) and s(P) in the orbit of P. Every
        argument here is about invariants f; a selector is an invariant composed
        with a choice, and the composition may be cheap where neither factor is.
        This is the sharpest surviving gap and it is named as such.
      S4 EXTENSION AND SUBFIELD CURVES, where Frobenius enlarges the set of
        degree-1-like cheap maps. Nothing here transfers off F_p.

