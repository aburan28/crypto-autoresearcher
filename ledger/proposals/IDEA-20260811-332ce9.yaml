  assumptions:
    - >-
      [fact] E/F_p ordinary, p > 3, so Aut(E) is cyclic of order 2, 4 or 6, with
      4 only at j = 1728 and 6 only at j = 0, and the extra automorphisms are
      F_p-rational only when p = 1 mod 4 respectively p = 1 mod 3.
    - >-
      [fact] End_{F_p}(E) is commutative for ordinary E, so every alpha commutes
      with [-1] and x o alpha factors through the x-line as psi o x with
      deg psi = deg alpha. Re-verified numerically in Step 1 on every curve.
    - >-
      [fact] Degrees of non-constant morphisms of smooth projective curves are
      multiplicative under composition. Standard; used, not re-derived.
    - >-
      [fact] G has prime order N, so by H-ENDO-001 alpha acts on G as a scalar
      lambda. Used as the admissibility filter, not retested.
    - >-
      [scope] Toy scale only for Steps 1-3: p up to about 2^20 so that G can be
      enumerated exhaustively, which is required because Corollary 2's decision
      procedure is an exhaustive statement over G and not a sample.
    - >-
      [scope] Step 3's enumeration uses a DECLARED finite coefficient set. A
      rational function over F_p has p^{O(d)} coefficient choices and the arm
      does not search them all; it searches a declared subset and reports its
      size. This is a stated limitation, not a hidden one.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For an ordinary E/F_p with CM by an order of fundamental discriminant
        D_0 not in {-3, -4}, and alpha a CM endomorphism of degree n >= 2 acting
        on the prime-order subgroup G, the ratios r_P = x(alpha(P))/x(P), for P
        ranging over the (N-1)/2 non-trivial x-classes of G, behave with respect
        to multiplicative order like independent uniformly random elements of
        F_p^*. Consequently
        Pr[ L(E, alpha) < p-1 ] = Pr[ the orders of ~N/2 independent uniform
        elements of F_p^* have lcm a proper divisor of p-1 ], which for
        N of order p is bounded above by
        sum over primes q | p-1 of (1/q)^{N/2}, i.e. is smaller than 2^{-N/2+1}.
      rigorous_support: >-
        RIGOROUS PART. (i) r_P is well defined and computable: psi exists with
        deg psi = n by the commutation fact above. (ii) The bound on the lcm
        being proper: for L to be a proper divisor of p-1 there must be a prime
        q | p-1 with q not dividing ord(r_P) for EVERY P, and for a single
        uniform element that has probability exactly 1/q; the union bound over
        the at most log2(p) prime divisors of p-1 is elementary. WHAT IS
        HEURISTIC IS ONLY THE INDEPENDENCE AND UNIFORMITY OF THE r_P.
        CLASSICAL STATEMENT IMITATED: the standard "values of a non-linear
        rational map behave like independent uniform field elements" heuristic
        used throughout index-calculus and Pollard-rho analysis, in the same way
        Dickman-de Bruijn smoothness heuristics are applied to auxiliary
        integers produced by an algebraic construction.
        WHY IT COULD FAIL, STATED HONESTLY: psi is not a random map. It is the
        x-line model of an endomorphism, so r_P = psi(x)/x is a fixed rational
        function of degree at most n+1 evaluated on the specific set x(G), and
        rational-function values on an algebraically defined set can have
        systematic multiplicative structure - for instance if psi(x)/x happened
        to take values in a proper subgroup of F_p^*, which is exactly the
        event H1 says is negligible. THE POSITIVE CONTROL AT j = 0 IS PRECISELY
        THE DEGENERATE CASE WHERE THIS FAILS COMPLETELY (r_P is constant), which
        is why that control is the right instrument test.
      validation_plan: >-
        WHAT TO SAMPLE: every P in G, on at least five toy curves per
        D_0 in {-7, -8, -11} with N prime and p between 2^14 and 2^20 - an
        EXHAUSTIVE computation over G, not a sample, so the reported L is exact
        per curve. WHICH SHORTCUT MAKES IT FEASIBLE: none is needed; the whole
        point of the r_P reduction is that an infinite family of candidate
        invariants collapses to one lcm over N elements, so the cost is
        O(N log p) field operations per curve.
        AGAINST WHICH PREDICTED DISTRIBUTION: the empirical distribution of
        ord(r_P) over P in G against the distribution of the order of a uniform
        element of F_p^* (which puts most mass on divisors of p-1 near p-1),
        reported as an empirical CDF of log(ord(r_P))/log(p-1); plus the exact
        value of L(E, alpha) per curve.
        TAIL CONSISTENCY CHECK: report the SMALLEST observed ord(r_P) and the
        largest prime q | p-1 that divides no ord(r_P); under H1 the latter
        should not exist for any q, and the observed minimum order should not be
        systematically small. A curve on which many r_P share a small order is
        the interesting event and is reported as a finding about psi, not
        absorbed as noise.
        SAMPLED PARAMETERS RECORDED: p, a, b, N, cofactor, D_0, n, the kernel
        point defining alpha, and the trace of alpha, per curve.
        TRANSFER ASSUMPTION, DECLARED: nothing about L(E, alpha) at toy p
        transfers to cryptographic p except through H1 itself, and H1's own
        bound 2^{-N/2+1} is what does the transferring. If H1 fails at toy
        scale the transfer is void and the record says so.
      falsification_condition: >-
        Any toy curve with n >= 2 on which L(E, alpha) < p-1. That single curve
        refutes H1 as stated, exhibits a genuine invariant power map for a
        non-automorphism endomorphism, and REOPENS 18d2f7's exponent rung with a
        concrete object. It must be routed to review-breakthrough before any
        record describes it (GOAL-ENDO-001 pause condition P3).
    - id: H2
      statement: >-
        Step 3's bounded-degree enumeration over a DECLARED finite coefficient
        set is representative of the full bounded-degree class in the following
        weak sense: if a non-constant invariant of degree <= d_max existed over
        F_p, the enumeration would find one for at least one of the declared
        coefficient sets on at least one of the tested curves.
      rigorous_support: >-
        RIGOROUS PART: NONE, and this is the weaker of the two heuristics.
        Proposition 2 already proves no such invariant exists, so Step 3 is a
        CONSISTENCY CHECK on the proposition and the implementation, not a
        search whose negative result carries independent weight. H2 is stated
        only so that the arm's null result is not mis-read as empirical support
        for the proposition. CLASSICAL ANALOGUE IMITATED: none; this is an
        implementation-adequacy assumption of the same kind as a regression
        fixture.
      validation_plan: >-
        WHAT TO SAMPLE: the declared coefficient set, with its size reported.
        AGAINST WHICH PREDICTION: the j = 0 positive control, where the
        enumeration MUST find the invariants that are functions of x^3 within
        the same declared coefficient set. If it does not, the enumeration is
        under-powered and its null on the n >= 2 arms carries no weight at all.
        TAIL CHECK: report the fraction of the declared set that is invariant on
        the j = 0 control; a fraction near zero means the coefficient set is
        badly chosen even though the control fired.
      falsification_condition: >-
        The enumeration fails to find any invariant on the j = 0 control. Then
        Step 3 is void and only Steps 1-2 and the propositions stand.

  proof_search_map:
    bottleneck: >-
      IDEA-20260807-18d2f7's COST 1: canonicalisation paid per step. The record
      shows COST 1 is the only binding cost and that it vanishes exactly when a
      cheap orbit label exists. The bottleneck this record removes is not a
      computational step but a missing impossibility argument: without one, the
      lane cannot tell the difference between "the sqrt(6) ceiling is a theorem"
      and "nobody has found a better label yet", and premature closure and
      overclaiming are equally available.
    baseline_embedding:
      parameter_slice: >-
        n = deg(alpha) = 1, i.e. alpha in Aut(E). There Proposition 1's
        conclusion is exactly the known state of affairs: the invariants exist
        and are x^3 at j = 0 (from psi(x) = zeta_3 x) and x^2 at j = 1728 (from
        psi(x) = -x), giving the KN-TECH-018 constants sqrt(6) and 2. The
        propositions must REPRODUCE this boundary and not exclude it.
      reproduction_check: >-
        FROZEN FIXTURE, BLOCKING. On a fixed toy j = 0 curve, the run must
        return r_P = zeta_3 for every P in G with x(P) != 0, L(E, zeta_3) = 3,
        and must verify symbolically that (x^3) o zeta_3 = x^3 with
        deg((x^3) o zeta_3) = 6 = deg(x^3) * deg(zeta_3), i.e. that the degree
        identity is satisfied with equality at n = 1. Any deviation makes the
        run INVALID.
    observation_collision:
      observable: >-
        The multiset { r_P = x(alpha(P))/x(P) : P in G } and its derived
        invariant L(E, alpha) = lcm of the multiplicative orders.
      distinct_preimage_search: >-
        A COLLISION EXISTS AND IS IDENTIFIED HERE RATHER THAN DISCOVERED LATER:
        alpha and -alpha induce the SAME psi, because x(-Q) = x(Q). So the
        observable cannot distinguish alpha from -alpha, and therefore cannot
        distinguish the subgroup <lambda> from <-lambda>. This is harmless for
        the claim (both have deg = n and the conclusion is about n), but it
        means the observable is NOT identifying for the endomorphism and no
        statement about which alpha was used may be made from the observable
        alone. A second, more dangerous collision to search for: two curves with
        different (D_0, n) but identical multiset {r_P} up to relabelling. If
        found, the observable is measuring something other than alpha and the
        arm must be re-designed. The search is cheap and is part of Step 2.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace "the orbit of P under <lambda>" (which carries only set
          membership) by "the morphism f: E -> P^1 that labels the orbit,
          together with its degree". The degree is the extra state preserved,
          and it is exactly the state that survives composition with alpha,
          because degrees are multiplicative and set membership is not.
        predicted_gain: >-
          Converts an open existence question into a one-line identity for the
          bounded-degree class, with an explicit threshold N > 2d(n+1) marking
          where the argument stops. No compute; the gain is that the lane's
          ceiling acquires a proof for a stated class and an explicit residual
          class for the next session.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (existence of a cheap label) fixed and vary the
          forgotten structure (the degree of alpha). The intrinsic invariant
          distinguishing the resulting objects is deg(alpha): at deg = 1 the
          label exists, at deg >= 2 it does not, and no cost-based argument sees
          the difference because both maps cost O(1) field operations to
          evaluate.
        predicted_gain: >-
          Identifies the load-bearing structure as degree-1-ness rather than
          cheapness, which is the record's answer to RQ-JINV-8fc13a's actual
          question and the reason small |D_0| is not a weaker j = 0.
    quantifier_order: >-
      CLAIMED IN THIS ORDER. FOR ALL ordinary E/F_p with p > 3, FOR ALL
      G <= E(F_p) of prime order N, FOR ALL alpha in End_{F_p}(E) with
      deg(alpha) = n, FOR ALL non-constant f in F_p(E) with deg(f) = d
      satisfying N > 2d(n+1): NOT ( f(alpha(P)) = f(P) for all P in G ) unless
      n = 1.
      THE WEAKER READING EXPLICITLY NOT CLAIMED: "for all alpha there EXISTS a
      degree bound below which no invariant exists" - that is trivially true and
      useless. The bound d < N/(2(n+1)) is uniform in E and alpha and is stated
      before any curve is chosen.
      THE STRONGER READING EXPLICITLY NOT CLAIMED: any statement quantified over
      all COMPUTABLE f rather than all RATIONAL f. Corollary 1 converts
      SLP-length into degree and therefore inherits the same restriction; a
      function that is not a rational function of the curve is outside every
      quantifier here.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For every ordinary prime-field curve and every endomorphism alpha of
        degree n >= 2, no rational function on E of degree below N/(2(n+1)) is
        constant on <lambda>-orbits in G; equivalently every arithmetic
        straight-line program computing such an invariant has length at least
        log2(N) - log2(n+1) - log2(6); and, conditional on H1 and verified
        exhaustively at toy scale, no power map x^m is such an invariant."
        IT CAN NEVER CERTIFY: anything about non-rational encoding functions
        (S2), anything about selectors as opposed to invariants (S3), anything
        about cheaply evaluable functions of degree above the threshold other
        than power maps (S1), anything about extension or subfield curves (S4),
        and nothing whatsoever about the hardness of the ECDLP.
      nearby_object_control: >-
        THE j = 0 CURVE WITH alpha = zeta_3, WHERE THE HOPED-FOR CONCLUSION
        FAILS. There deg(alpha) = 1, the invariant x^3 exists, and L = 3. The
        method must distinguish this object from the |D_0| = 7 curve with a
        degree-2 alpha - both have CM, both have a cheap explicitly computable
        endomorphism, both have a lambda of some order in (Z/N)^* - and it must
        distinguish them by the ONE quantity the claim says is load-bearing,
        namely deg(alpha). A method that returned "no invariant" on the j = 0
        control, or "invariant found" on the |D_0| = 7 arm, has not identified
        the load-bearing structure and the record is void.
    proof_obligations:
      - claim: "deg(f o alpha) = deg(f)*deg(alpha) for non-constant morphisms."
        responsibility: correctness
      - claim: "f o alpha = f implies deg(alpha) = 1, hence alpha in Aut(E)."
        responsibility: correctness
      - claim: >-
          Pointwise invariance on G with N > 2d(n+1) implies identical
          invariance, by the divisor-degree count.
        responsibility: strictness
      - claim: >-
          An arithmetic SLP of length L over F_p computes a rational function on
          E of degree at most 3*2^L.
        responsibility: size
      - claim: >-
          x^m is alpha-invariant on G if and only if L(E, alpha) divides m,
          so the whole power-map family is decided by one lcm.
        responsibility: correctness
      - claim: >-
          The j = 0 and j = 1728 positive controls return L = 3 and L = 2 and
          recover x^3 and x^2.
        responsibility: baseline
      - claim: >-
          H1's uniformity is validated by the reported order distribution and
          its failure is reported rather than absorbed.
        responsibility: success_probability
      - claim: >-
          The record closes only the bounded-degree and power-map classes and
          names S1-S4 as open.
        responsibility: scope

  predictions:
    - metric: >-
        r_P = x(alpha(P))/x(P) on the j = 0 control, over all P in G with
        x(P) != 0
      direction: different
      minimum_effect: >-
        CONSTANT, equal to a fixed primitive cube root of unity, on 100 percent
        of points. Any variation refutes the commutation fact or the
        implementation and voids the run.
    - metric: L(E, alpha) on the j = 0 and j = 1728 controls
      direction: lower
      minimum_effect: >-
        Exactly 3 and exactly 2 respectively. These are the positive controls
        and they are BLOCKING.
    - metric: L(E, alpha) on curves with D_0 in {-7, -8, -11} and deg(alpha) >= 2
      direction: higher
      minimum_effect: >-
        Exactly p-1 on every tested curve, i.e. no non-trivial invariant power
        map exists. Any curve returning L < p-1 is the falsifier of H1 and
        triggers pause condition P3.
    - metric: >-
        number of non-constant alpha-invariant rational functions of degree
        <= d_max found in Step 3 on curves with deg(alpha) >= 2, where
        2*(2*d_max)*(n+1) < N
      direction: lower
      minimum_effect: >-
        Exactly ZERO, as Proposition 2 requires. A single hit refutes
        Proposition 2 - the single cleanest falsifier in this record.
    - metric: >-
        number of non-constant invariants of degree <= d_max found on the j = 0
        control within the same declared coefficient set
      direction: higher
      minimum_effect: >-
        At least one, and every one found must be a function of x^3. Zero means
        the Step 3 enumeration is under-powered and its nulls carry no weight
        (H2 falsified).
    - metric: >-
        empirical CDF of log(ord(r_P))/log(p-1) on the deg(alpha) >= 2 arms
        against the same statistic for uniform elements of F_p^*
      direction: different
      minimum_effect: >-
        Agreement within 3 binomial standard errors in each decile, on every
        curve. Systematic deviation is a finding about psi and is reported as
        one, whether or not L < p-1.

  minimal_test:
    design: >-
      THE CHEAPEST VALID DISCRIMINATOR COSTS ZERO COMPUTE AND IS PROPOSITION 1.
      deg(f o alpha) = deg(f) * deg(alpha) forces deg(alpha) = 1 for any exactly
      invariant non-constant f. That single identity converts "the sqrt(|Aut|)
      ceiling is an observed constant" into "the ceiling is a degree identity"
      for the exact-invariance class, and it is checkable by hand in one line.
      It also immediately explains why the lane's small-|D_0| arm cannot be a
      weaker version of its j = 0 arm: cheapness of alpha is irrelevant, only
      deg(alpha) = 1 matters.
      THE CHEAPEST EMPIRICAL DISCRIMINATOR IS COROLLARY 2's lcm, AND IT IS
      EXACT RATHER THAN STATISTICAL: on one toy curve per arm, compute
      r_P = x(alpha(P))/x(P) for every P in G and report
      L = lcm of the orders. This decides the ENTIRE power-map family - an
      infinite family - with one O(N log p) computation, with a positive control
      (j = 0 must return the constant zeta_3 and L = 3) that fires or the
      instrument is broken. Minutes of compute at p ~ 2^16.
      Step 3's bounded-degree enumeration is the only part that needs real
      compute and it is a consistency check on Proposition 2, not an independent
      search; it is worth running only because a hit there would be the record's
      own falsifier.
    controls:
      - >-
        POSITIVE CONTROL, BLOCKING: j = 0 with alpha = zeta_3 must return
        r_P constant and L = 3, and Step 3 must find x^3-based invariants.
      - >-
        SECOND POSITIVE CONTROL: j = 1728 with alpha = i must return r_P = -1
        and L = 2. Two controls at two different |Aut| values is a stronger
        instrument test than one.
      - >-
        NULL OBJECT 1 - THE GENERIC CURVE: j not in {0, 1728} and D_0 generic,
        where the only endomorphisms are Z. Take alpha = [2] (n = 4). Predicted
        L = p-1 and no bounded-degree invariant. This is the null that shows the
        arms are not merely detecting "an endomorphism was applied".
      - >-
        NULL OBJECT 2 - THE CHEAP-BUT-SCALAR MAP: alpha = [2], which costs ONE
        group operation to evaluate - cheaper than the CM endomorphism - and
        generates a subgroup <2> of (Z/N)^* that is typically of order about N.
        If cheapness or subgroup size were the operative resource this null
        would show an invariant; it must not. THIS IS THE SHARPEST NULL IN THE
        RECORD because it holds cheapness and orbit size fixed and varies only
        degree.
      - >-
        NULL OBJECT 3 - RANDOM PERMUTATION: replace psi by a random permutation
        of x(G) with no algebraic structure and recompute L. Must return p-1
        with overwhelming probability; if it returns less, the lcm statistic is
        detecting bookkeeping and every number is void.
      - >-
        DECAY PARAMETER - deg(alpha), swept over n in {1, 2, 3, 4} via
        {zeta_3 at j = 0, norm-2 CM element at D_0 = -7 or -8, norm-3 CM element
        at D_0 = -11, [2] on any curve}. The predicted signal is a STEP, not a
        decay: present at n = 1 and absent at every n >= 2. A quantity that
        instead decays smoothly with n is measuring evaluation cost or map
        complexity rather than degree, and the interpretation must change
        accordingly. Stating in advance that the predicted shape is a step and
        not a decay is what makes this control informative.
      - >-
        SECOND DECAY PARAMETER - the degree bound d_max in Step 3, swept upward
        towards the threshold N/(2(n+1)). Predicted: zero hits at every d_max
        below the threshold. Hits appearing only as d_max approaches the
        threshold would indicate the bound is tight, which is itself a
        reportable calibration of Proposition 2.
    required_metrics:
      - per curve: p, a, b, j, D_0, n, N, cofactor, the kernel defining alpha
      - the full multiset {r_P} summarised by its order histogram
      - L(E, alpha) exactly, and whether L < p-1
      - the minimal invariant power map when one exists
      - Step 3 hit counts per (curve, d_max, coefficient set), with the set size
      - the symbolic degree check deg(f o alpha) = deg(f)*deg(alpha) per control
      - pass/fail of all three nulls and both positive controls

  falsification_conditions:
    - >-
      F1 (ZERO COMPUTE, THE PRIMARY FALSIFIER). A counterexample to Proposition
      1: a non-constant f in F_p(E) with f o alpha = f and deg(alpha) >= 2.
      Since the proof is a one-line degree identity, such a counterexample would
      mean the degree multiplicativity or the composition is being misapplied,
      and the whole record is withdrawn by a superseding proposal.
    - >-
      F2. A non-constant alpha-invariant rational function of degree
      d < N/(2(n+1)) found in Step 3 on any curve with n >= 2. Proposition 2 is
      false as stated; the divisor count is wrong; the record is withdrawn.
    - >-
      F3 (THE INTERESTING FALSIFIER, AND IT IS AN EXPONENT EVENT). Any toy curve
      with n >= 2 on which L(E, alpha) < p-1. A non-trivial invariant power map
      for a non-automorphism endomorphism exists; H1 is refuted; 18d2f7's
      exponent rung is reopened with a concrete object. GOAL-ENDO-001 pause
      condition P3 fires: work stops for an independent review-adversarial
      session before any record states it, and for review-breakthrough at max
      effort before any record calls it a break. NOTE THAT F3 IS ALSO THE ONLY
      OUTCOME IN THIS RECORD THAT COULD EVER MOVE AN EXPONENT, and its
      pre-registered handling is what keeps the record from being an experiment
      with no possible positive outcome.
    - >-
      F4. The j = 0 positive control fails: r_P is not constant, or L != 3.
      Instrument failure; every number in the run is void and returns to the
      executor as a defect.
    - >-
      F5. Null object 3 (random permutation) returns L < p-1 with non-negligible
      frequency. The lcm statistic is not measuring what it is claimed to
      measure and every arm is void.
    - >-
      F6 (THE MAIN NEGATIVE, AND IT IS THE INTENDED DELIVERABLE). Every
      prediction holds: L = 3, 2 on the controls and p-1 on every n >= 2 arm,
      and Step 3 finds nothing below threshold. Then IDEA-20260807-18d2f7's
      OUTCOME 2 is discharged for the bounded-degree class and the power-map
      class, the sqrt(|Aut|) ceiling becomes a theorem for those classes, and
      the residual open classes are exactly S1-S4. This is an archivable
      positive deliverable despite being a negative result, and it must be
      recorded with S1-S4 named or it has not finished
      (docs/inventor-protocol.md section 4).

  confounders:
    - >-
      alpha AND -alpha ARE INDISTINGUISHABLE BY THE OBSERVABLE, since
      x(-Q) = x(Q). No statement about which endomorphism was applied may be
      made from {r_P}. Identified in advance rather than discovered.
    - >-
      x(P) = 0 AND POINTS OF ORDER DIVIDING deg(alpha) ARE DEGENERATE. On a
      j = 0 curve x = 0 is a fixed point of the order-3 automorphism; on any
      curve the poles of psi must be excluded. These points are ENUMERATED AND
      REPORTED, never silently dropped, and their count is part of the required
      metrics.
    - >-
      CONSTRUCTING alpha EXPLICITLY IS THE IMPLEMENTATION RISK. A degree-2 CM
      endomorphism is a rational 2-isogeny composed with an isomorphism back to
      E, and getting the post-composition wrong yields a map that is an isogeny
      to a twist rather than an endomorphism. The blocking check is
      alpha^2 - t_alpha*alpha + n = 0 verified on sampled points; without it the
      arm measures nothing.
    - >-
      TOY SCALE CANNOT SEE A THRESHOLD OF THE FORM d < N/(2(n+1)) IF d_max IS
      NOT PUSHED CLOSE TO IT. At p ~ 2^16 and n = 2 the threshold is around
      N/6 ~ 10^4, which is reachable for polynomial invariants but not for the
      declared coefficient set. The arm therefore tests the proposition only in
      the far-below-threshold regime, and the record says so.
    - >-
      COROLLARY 1's SLP DEGREE BOUND 3*2^L IS LOOSE. Real programs rarely
      achieve degree doubling at every step, so the derived length bound
      L >= log2(N) - log2(n+1) - log2(6) is a LOWER bound on length that a
      cleverer degree accounting could only raise. Loose in the safe direction,
      but the looseness is disclosed.

  interpretation_limits:
    - >-
      claim_tier toy for every measured quantity; the propositions themselves
      are `derivation` artifacts under docs/claims-and-verification.md and are
      never labelled proved without external review.
    - >-
      THE RUNG IS NARROWED, NOT CLOSED. Corollary 1 permits an invariant
      computed by an SLP of length about log2 N, which is polylog and therefore
      inside 18d2f7's own admissible cost class. Any statement that this record
      closes the N^{1/3} rung is FALSE and is forbidden.
    - >-
      NOTHING HERE IS AN ATTACK AND NOTHING HERE IS EVIDENCE ABOUT THE HARDNESS
      OF THE ECDLP. sota_delta is zero on every axis.
    - >-
      Scoped to ordinary curves over PRIME fields with p > 3 and to a
      prime-order subgroup. Extension fields, subfield curves, supersingular
      curves and composite-order groups are all outside every argument here, and
      over extension fields Frobenius supplies additional cheap degree-1-like
      maps that the whole argument would have to be re-run for.
    - >-
      H-ENDO-001 is used as the admissibility filter and not retested;
      KN-FIND-b7e091's generic-group closure is treated as binding and is not
      revisited. This record's object is expressly the one 18d2f7 argues lies
      OUTSIDE that closure, and if RQ-GGMB-6eaabc later rules that an
      encoding-dependent orbit invariant IS simulable, this record's residual
      classes S1-S4 are closed by that ruling and not by anything here.
    - >-
      A NEGATIVE HERE DOES NOT SAY SPECIAL j IS WORTHLESS. It says the label
      route is capped at deg(alpha) = 1. IDEA-20260807-f8a045's index-calculus
      constant and IDEA-20260807-d329e2's quotient-coordinate construction are
      untouched.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS CLAIMED OR MOVED BY THIS RECORD. What it bounds is the
      exponent another record computed: IDEA-20260807-18d2f7 shows a cheap
      invariant for an orbit of size N^{alpha} would give total cost about
      N^{(1-alpha)/2} + N^{alpha}, minimised at alpha = 1/3 for N^{1/3}. This
      record proves that no such invariant exists among rational functions of
      degree below N/(2(n+1)) for any endomorphism of degree n >= 2, and that
      no power map is one (conditional on H1, validated exhaustively at toy
      scale). The surviving route to N^{1/3} is the residual class S1-S3, whose
      cost profile is unknown and is not estimated here.
    memory_exponent: >-
      Unchanged at O(1) for the rho baseline; this record proposes no algorithm
      and stores nothing. The toy verification stores G, i.e. O(N) at
      N <= 2^20, which is why it is toy-scale-only.
    best_known: >-
      Parallel Pollard rho with distinguished points at 0.886*sqrt(N) group
      operations and O(1) memory (KN-TECH-001, KN-TECH-006); on curves with
      |Aut| > 2 the automorphism-discounted variant, constant at most sqrt(6)
      (KN-TECH-018); BSGS at sqrt(N) time and sqrt(N) memory with full cost
      N^{2/3+o(1)} (KN-TECH-031); van Oorschot-Wiener at sqrt(N^3/w) time with
      memory w. Generic lower bound Omega(sqrt(N)) (KN-TECH-005, Shoup).
    hidden_overhead: >-
      Disclosed in three places. (a) Corollary 1's threshold is only
      L >= log2(N) - O(log n), and log2 N field operations is POLYLOG, which the
      rung's own cost condition permits - so the corollary does not close what
      it might appear to close, and this is stated in the claim itself rather
      than in a footnote. (b) H1's bound 2^{-N/2+1} is a heuristic
      independence assumption on values of a fixed rational map on an
      algebraically defined set, and the j = 0 case is a real instance where
      exactly that independence fails completely. (c) The divisor count in
      Proposition 2 is deliberately loose by a factor 2; the true threshold may
      be N > d(n+1), which would only strengthen the conclusion, and no credit
      is taken for the stronger form.
    tradeoff_note: >-
      Not applicable to this record's own content, which proposes no algorithm.
      For the object it bounds, the relevant tradeoff is 18d2f7's: orbit size
      N^{alpha} against canonicalisation cost, balancing at alpha = 1/3. This
      record removes bounded-degree rational functions and power maps from the
      set of things that could sit at that balance point, and leaves the
      tradeoff curve otherwise untouched.

  dominated_by: >-
    AS AN ATTACK: none is claimed, but the Pareto check is performed row by row
    so this is not a bare null. TIME - parallel rho at 0.886*sqrt(N)
    (KN-TECH-001, KN-TECH-006) dominates; this record proposes nothing that runs
    at all. MEMORY - rho at O(1) dominates; the verification stores O(N).
    DATA/QUERIES - no query advantage is claimed in any model. CM-SPECIFIC -
    automorphism-discounted rho (KN-TECH-018) dominates on the j = 0 and
    j = 1728 families and is the very constant this record explains. MEMORY-RICH
    - BSGS at sqrt(N)/sqrt(N) and van Oorschot-Wiener at sqrt(N^3/w) dominate on
    their own axes. GENERIC LOWER BOUND - Shoup's Omega(sqrt(N)) (KN-TECH-005)
    is not competed with. Every row checked; NOT null.
    AS A STRUCTURAL RESULT: dominated within this repository by nothing, since
    IDEA-20260807-18d2f7 poses the question this record answers and explicitly
    declines to answer it. AGAINST THE EXTERNAL LITERATURE: UNKNOWN AND STATED
    AS UNKNOWN - no external source was reachable this session (WebSearch and
    WebFetch both failed, knowledge retrieval empty), so no priority is claimed
    and the degree identity is presumed classical.
  sota_delta: >-
    Zero speedup on every cost axis; no attack; no exponent moved. Quantitative
