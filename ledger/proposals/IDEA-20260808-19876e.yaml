idea:
  id: IDEA-20260808-19876e
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-SQISIGN-001
  goal_id: GOAL-SQISIGN-001
  title: 'A constant-advantage transcript distinguisher cannot move the key-recovery exponent:
    only a leak that shrinks the candidate-curve set by a positive power of p can, and that
    dichotomy re-aims GOAL-SQISIGN-001 from distinguisher-hunting to set-shrinker-hunting.'
  class: mechanism
  claim: 'Let the matched baseline be bare-curve key recovery at p^{1/3+o(1)} (conditional
    on Heuristic 1). Suppose a transcript functional F yields, for a given public key, a set
    C(F) of candidate curves/ideals guaranteed to contain the truth, of density rho relative
    to the full search space. CLAIM (the conversion lemma): the ONLY way F changes the key-recovery
    exponent is through rho, and specifically through s := -log_p(rho) > 0, entering IDEA-20260805-250e50''s
    identity as E = (1/2 - 3 theta/2)_+ + max(gamma_F, theta - s), where gamma_F is the cost
    exponent of evaluating F. CONSEQUENCES, all derived before any run: (a) a distinguisher
    with advantage eps bounded away from 0 and 1 yields rho >= 1 - eps = Theta(1), hence s
    = 0, hence NO exponent change, for any constant eps -- including eps = 0.99; (b) the exponent
    moves only if the number of surviving candidates is p^{1-s} with s > 0, i.e. the leak
    must be a SET-SHRINKER, not a distinguisher; (c) break-even is gamma_F < 1/3 exactly as
    in the bare-curve case, so a set-shrinker that costs more than a table build is worthless
    however selective it is. THE RE-AIM IS THE DELIVERABLE: GOAL-SQISIGN-001''s completion
    criterion 1 accepts "a transcript distinguisher significant against a properly simulated
    null control ... with a stated conversion path to key information". This record supplies
    the conversion path and shows that for a large class of distinguishers the path is EMPTY.'
  mechanism: The key-recovery search is over a space of size ~p/12 (curves) or over the signer's
    ideal support. Cost scales with the size of the space that must be searched, not with
    how confident one is about the whole space. A distinguisher outputs one bit about the
    transcript; converting bits about the TRANSCRIPT into a reduction of the KEY search space
    requires the bit to be a function of the key, and a constant number of key bits reduces
    the space by a constant factor -- p^{o(1)}, absorbed. To get s > 0 one needs Omega(log
    p) key bits, i.e. a leak whose output length grows with the security parameter. That is
    the sharp statement, and it is why "significant at the 5 per cent level" and "moves the
    exponent" are unrelated properties.
  why_not_a_renamed_known_approach: 'IDEA-20260805-250e50 installs the identity for the BARE-CURVE
    problem, with a screen computed from j(E). This record instantiates the same identity
    with the screen supplied by a TRANSCRIPT rather than computed, and derives the constant-advantage
    corollary, which that record does not state because its screens are all computed and priced
    by gamma. Catalogue B3-1 ("Two-stage disclosure screen: residual entropy x named-constructor")
    is the nearest disclosure-side record; it grades disclosures by residual entropy, which
    is a bit count, and does not convert bits into an exponent through a cost identity.'
  predictions:
  - observable: the identity evaluated at a constant-advantage distinguisher
    metric: E(theta, s=0, gamma_F)
    predicted: min over theta of (1/2 - 3 theta/2) + max(gamma_F, theta) which is 1/3 at gamma_F
      >= 1/3 and strictly below only when gamma_F < 1/3 -- so a FREE constant-advantage distinguisher
      still gives 1/3. Forced.
  - observable: the bit-count threshold
    metric: number of key bits a leak must carry for s > 0
    predicted: Omega(log p), i.e. the leak's output length must grow with the security parameter.
      Any fixed-length leak gives s = 0.
  - observable: reproduction gate
    metric: the identity at (theta, s, gamma) = (1/3, 0, 1/3)
    predicted: EXACTLY 1/3, reproducing the frozen source's exponent; failure kills the record
      at zero compute.
  minimal_test: Zero compute. (i) Write the conversion lemma and check the three reproduction
    points. (ii) Take the corpus's existing transcript-side proposals -- IDEA-20260805-2a669e
    (retry conditioning), IDEA-20260807-cc84ad (secret-independence of [conj(J_i)J_j]), catalogue
    S3-2 (n_bt as a coincidence counter), S3-9 (pairing-relation rank deficiency) -- and classify
    each as distinguisher (s = 0) or set-shrinker (s > 0), stating for each what its output
    length is as a function of log p. That classification is the whole deliverable and it
    is an afternoon's work.
  controls:
  - 'POSITIVE CONTROL (must fire): a synthetic leak that publishes the top k bits of the secret
    ideal''s reduced norm. The classifier must return s = k/log2(p) > 0 for k growing, and
    s = 0 for k fixed. If it returns s > 0 for a fixed-length leak, the classifier is wrong.'
  - 'NULL: a leak that publishes k uniformly random bits independent of the key. The classifier
    must return s = 0.'
  - 'REPRODUCTION: the bare-curve case must recover IDEA-20260805-250e50''s own values 1/3
    at (1/3, 0, 1/3) and 3/8 at (1/4, 0, 1/4).'
  confounders:
  - The lemma treats the search space as unstructured. A leak that shrinks the space by a
    constant factor BUT ALSO changes its structure (e.g. confines the key to a subgraph with
    different mixing) is outside the lemma's scope, and that exclusion must be stated whenever
    the lemma is cited.
  - 's and gamma_F are not independent for a transcript-derived screen: the transcript is
    free, so gamma_F = 0, which is exactly why the corollary is sharp and also why a naive
    reading overstates its reach.'
  - Multi-target and multi-signature settings can accumulate leaks across q signatures; the
    lemma is stated per-key and its q-fold version needs the independence of the per-signature
    leaks, which S1b-01 measures.
  falsification_conditions:
  - The reproduction gate fails.
  - Someone exhibits a constant-advantage distinguisher that provably reduces the key search
    space by a positive power of p -- which would falsify step (a) and would be a substantial
    result.
  - The classification finds any existing corpus proposal to be a set-shrinker, which would
    immediately raise that proposal's priority and is the outcome the record most wants to
    be wrong about.
  interpretation_limits: A COST-ACCOUNTING LEMMA, not a security proof and not an impossibility
    result. It says nothing about EUF-CMA forgery, which need not go through key recovery
    at all; a constant-advantage distinguisher can be devastating for a forgery argument while
    being exponent-irrelevant for key recovery, and the record must never be quoted as "distinguishers
    do not matter". SC-3 forbids converting any of this into a bit figure.
  assumptions:
  - IDEA-20260805-250e50's identity is sound (consumed, not re-derived; this record falls
    with it).
  - The matched key-recovery baseline is the p^{1/3+o(1)} conditional tier of KN-TECH-058.
  heuristic_assumptions:
  - id: HB-2
    statement: SEARCH-SPACE PROPORTIONALITY. For the list-and-close family, the expected cost
      of key recovery restricted to a candidate set of density rho is rho times the unrestricted
      cost, up to p^{o(1)}.
    rigorous_ingredient: 'Lemma 3.5 of the frozen source: the per-attempt success probability
      is a property of the sampled curve, so restricting the sample space to a set containing
      the truth multiplies the number of attempts by rho.'
    distribution_imitated: The uniform distribution on the supersingular set, preserved by
      the re-randomising walk of Algorithm 3 at mixing length n = O(log p) (line 193, citing
      [37] and [6, Lemma 14]).
    validation_route: 'Toy: on the four committed graphs (p = 2437, 3889, 5737, 7333), restrict
      the sampler to a random subset of density rho and measure the attempt count against
      1/rho. LABELLED TOY. This is a property of the sampler, not of the arithmetic, so a
      toy check is informative about the model.'
    tail_checks: At rho = 1 the attempt count must reproduce the unrestricted measurement
      exactly; at rho = 1/|V| it must reproduce a single forced attempt.
  target_complexity:
    time_exponent: E = (1/2 - 3 theta/2)_+ + max(gamma_F, theta - s). At s = 0 it is 1/3 for
      every gamma_F, i.e. UNCHANGED from the incumbent. The record claims no improvement;
      it bounds what a class of leaks can deliver.
    memory_exponent: theta, unchanged, and equal to the time exponent at the incumbent point.
    best_known_baseline: p^{1/3+o(1)} time and memory conditional on Heuristic 1 (additionally
      GRH for Isogeny, SC-1); p^{1/2}(log p)^{O(1)} unconditional at polynomial memory.
    hidden_overhead_disclosure: Inherited unchanged and not assumed smaller; the record adds
      no new o(1).
    time_memory_tradeoff: Unchanged. A transcript-supplied screen is polynomial-memory and
      does not move the vOW curve.
