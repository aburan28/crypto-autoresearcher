idea:
  id: IDEA-20260805-baa4da
  question_id: RQ-HQC-001
  added: '2026-08-05'
  title: >-
    The memory-charged ISD baseline HQC, Classic McEliece and SDitH all name as
    deliverable one and none has built: a forced inequality M < G_Prange^{3/4}
    that decides, before any list is built, whether the advanced-ISD family
    survives full cost at HQC's own key-recovery parameters
  class: cost_audit

  claim: >-
    Under the full-cost composition FC = H . T_wall that this program has
    already adopted on its ECDLP, lattice and isogeny sides (KN-TECH-035,
    KN-TECH-044, SSI-FC-2026) and that ISD-FC-2026 instantiates for the
    code-based side, an information-set-decoding variant that holds M bits of
    list memory and performs A ~ M genuinely random accesses to it cannot cost
    less than A . M^{1/3} ~ M^{4/3} gate-op-seconds, whereas Prange's variant
    holds only polynomial memory and therefore costs its gate count G_Prange
    up to a polynomial factor. Hence the ENTIRE advanced family - Stern, MMT,
    BJMM, May-Ozerov and their nearest-neighbour descendants - can beat the
    full-cost baseline at HQC's selected parameters ONLY IF its list memory
    satisfies M < G_Prange^{3/4}. That is a single inequality between two
    numbers, both computable exactly in pure-Python integer arithmetic from
    HQC's published parameters, and it decides the ranking of the whole family
    before a single list is built. Whichever way it resolves, the output is the
    deliverable GOAL-HQC-001's own completion_criteria[0] names ("plus a
    memory-charged ISD baseline at those parameters"), that GOAL-MCE-001 and
    GOAL-SDITH-001 name identically, and that after three batches and 233
    experiment directories does not exist anywhere in this repository.

  object_first_candidate:
    tracked_object: >-
      The (G, M, FC) TRIPLE of an ISD execution - gate-ops under unit-cost RAM,
      memory volume in bits at ISD-FC-2026 section 3(a) occupancy, and full
      cost under U2/U4 - followed through the algorithm's own phase structure:
      permutation, Gaussian elimination, list construction, list query,
      candidate verification. The object is the triple, not the time exponent,
      and the whole proposal is that following the triple rather than its first
      component reorders the family.
    established_families_off_limits: >-
      Off-limits as the primary lens: (i) inventing a new decoding algorithm -
      nothing here proposes an attack, and a proposal that quietly became one
      would be the failure mode this record exists to avoid; (ii) the DFR /
      decryption-failure lane, which is IDEA-20260805-db5afa and
      IDEA-20260805-15258a and is where this goal's other three batches went;
      (iii) quantum ISD circuit optimisation (the corpus records ePrint
      2026/1411 as a ~22 per cent qubit / ~20 per cent Toffoli improvement -
      RELAYED, not read - which is a constant-factor result and says so);
      (iv) structural / quasi-cyclic algebraic attacks. The full-cost
      accounting family is the primary lens and it is the one this program
      already committed to everywhere except the code-based side.
    newness_score: >-
      The accounting basis is not new - it is Wiener's, and this program uses
      it on three other fronts. The ISD algorithms are not new. What is new,
      and measurably so, is the CONJUNCTION: grep across ledger/, experiments/
      and knowledge/ finds no experiment record, no evidence record and no
      cost record that charges memory for any ISD variant at any parameter set.
      GOAL-MCE-001's own checkpoint records TASK-20260803-f3aece reading
      Esser-Bellini Table 1 and DECLINING TO TRANSCRIBE IT, deferring to a
      binding convention that did not then exist. The convention now exists
      (ISD-FC-2026, produced by this goal's BATCH-001) and is still
      unadopted and unused - DEC-20260802-344883 D-6 left it pending. The gap
      is organisational, the corpus says so in its own words, and closing it
      needs no new mathematics.
    testability_score: >-
      Very high and almost free. G_Prange, its memory, and Stern's (G, M) as a
      function of its two free parameters are exact integer expressions in
      binomial coefficients; Python's arbitrary-precision integers evaluate
      them in milliseconds. No solver, no numpy, no external library is
      required for the decisive stage - which matters, because this container
      has numpy 2.4.6 but NO sympy and NO scipy (verified 2026-08-05), and the
      program-wide angle inventory records two scouting sweeps disagreeing
      about exactly this.
    survival_score: >-
      The inequality survives to cryptographic scale by construction: it is
      evaluated AT HQC's selected parameters, not at a toy analogue, because
      the objects being compared are cost expressions rather than executions.
      That is the unusual feature of this proposal within this goal - it is the
      only lane here that reaches the standardized parameter set without
      extrapolation. Its limit is stated in interpretation_limits: a cost model
      evaluated at crypto parameters is a MODEL claim, not a crypto-tier
      measurement, and the claim tier stays where RQ-HQC-001 puts it.

  mechanism: >-
    DERIVED IN THIS RECORD from ISD-FC-2026 (repo path
    coordination/goals/GOAL-HQC-001/batches/BATCH-001/tasks/TASK-20260802-0100a5/isd_costing_convention.md,
    READ IN FULL for rules U1-U6 and section 3(a)-(d)) plus elementary
    combinatorics. Numbers marked [SESSION-COMPUTED] were computed in this
    generation session with the stated formula and are PRE-REGISTERED
    INDICATIVE VALUES to be re-derived in-harness; they are not measurements
    and no evidence record may cite them.

    (1) THE INSTANCE. HQC's public key is (h, s = x + h.y) in
    R = F_2[X]/(X^n - 1) with w(x) = w(y) = w. Key recovery is therefore
    syndrome decoding of a quasi-cyclic [N, K] = [2n, n] code at target weight
    W = 2w. [SESSION-COMPUTED from SPEC Table 5: HQC-1 (N, K, W) =
    (35338, 17669, 132); HQC-3 (71702, 35851, 200); HQC-5 (115274, 57637, 262).]
    The alternative reading of SPEC section 4.1 - w is the TOTAL weight of the
    pair - gives W = w and is carried as a declared fork; resolving it is
    stage 0, exactly as in IDEA-20260805-db5afa, and the two proposals share
    the ambiguity because they share the sentence.

    (2) PRANGE, EXACTLY. One iteration picks an information set of size K and
    succeeds iff all W errors fall in the N - K redundancy positions:
      P = C(N-K, W) / C(N, W),   iterations = 1/P.
    Under U1 (one gate-op = one bit operation, NO free word parallelism), one
    Gaussian-elimination pass costs Theta((N-K)^2 . N) gate-ops. Hence
      G_Prange = (N-K)^2 . N . C(N,W)/C(N-K,W),   M_Prange = Theta(N^2) bits.
    [SESSION-COMPUTED with that exact expression, W = 2w:
      log2 G_Prange = 175.7 / 246.8 / 310.9 at HQC-1/3/5;
      with the alternative W = w reading: 109.4 / 146.5 / 179.6.]
    These are INDICATIVE AND DELIBERATELY CRUDE: they omit the DOOM
    quasi-cyclic factor (at most sqrt(n), i.e. 7.1 / 7.6 / 7.9 bits), omit the
    Canteaut-Chabaud style iterative-update refinement that removes most of the
    (N-K)^2.N per iteration, and use a Theta with the constant set to 1. Every
    one of those is a stage of the experiment, not an assumption of the
    proposal. What is NOT crude, and is the only thing the argument needs, is
    that M_Prange is POLYNOMIAL in N.

    (3) THE FULL-COST ASYMMETRY, WHICH IS THE WHOLE MECHANISM. ISD-FC-2026 U2
    fixes FC = H . T_wall with memory counted in H. For Prange, H = poly(N)
    processors-plus-memory and T_wall = G_Prange / (parallel width), so
    FC_Prange = G_Prange . poly(N): full cost and gate count agree up to a
    polynomial, because there is nothing expensive to hold. For any
    list-based variant holding M bits and making A random accesses, U4's
    bisection-limited model gives T_access >= A / Theta(M^{2/3}), and H >= M, so
      FC >= M . A / M^{2/3} = A . M^{1/3}.
    In every member of the advanced family each list element is written once
    and probed at least once, so A = Omega(M / e) with e the element width,
    giving FC = Omega(M^{4/3} / e). THE FORCED INEQUALITY follows immediately:
      an advanced variant beats the full-cost baseline only if
        M^{4/3} < G_Prange,  i.e.  M < G_Prange^{3/4}.
    [SESSION-COMPUTED under the W = 2w reading: the memory ceiling is
    2^131.8 / 2^185.1 / 2^233.2 at HQC-1/3/5.] This is a NECESSARY condition
    derived without knowing anything about the variant except that it stores a
    list, and it is checkable against a published memory figure in one
    comparison. Note carefully what it does NOT say: it does not say the
    advanced family fails. A ceiling of 2^131 is generous, and BJMM-class list
    sizes at these lengths are plausibly far below it. The proposal's value is
    that the question becomes a comparison of two computed numbers instead of
    a matter of opinion, and that the same inequality, evaluated at Classic
    McEliece's and SDitH's parameters with the same code, answers all three
    goals.

    (4) STERN, EXACTLY, AS THE FIRST NON-TRIVIAL POINT. Stern splits the
    information set in halves and matches on l syndrome bits:
      P_Stern = [C(K/2,p)^2 . C(N-K-l, W-2p)] / C(N, W),
      list size L = C(K/2, p),  M = 2 . L . (l + log2 L) bits,
      G per iteration = Gauss + 2.L.l (build) + collisions . (N-K-l) (check).
    Every term is an exact binomial expression; both p and l are free and are
    optimised. UNDER GATE COUNT ALONE the optimum drives p and l up, buying
    time with memory. UNDER FC the same optimisation acquires the M^{1/3}
    penalty and the optimum moves DOWN. The gap between the two optima, in
    bits, at HQC's parameters, IS THE DELIVERABLE, and it is computed by
    evaluating one closed-form expression on a grid of (p, l).

    (5) THE FORCED SHAPE, WHICH IS THE GRADED CONTROL. Define FC*(M_max) as
    the minimum full cost over all (p, l) whose memory is at most M_max. As
    M_max increases from polynomial to unbounded, FC*(M_max) is by construction
    NON-INCREASING (a larger feasible set cannot raise a minimum), and it must
    become CONSTANT once M_max passes the FC-optimal memory. So the curve
    FC*(M_max) must be a non-increasing step function that FLATTENS, and the
    location of the flattening point is the FC-optimal memory, predicted before
    the run by setting the derivative of log FC to zero along Stern's
    (p, l) family. THREE FAILURE SHAPES ARE PRE-DECLARED AND EACH IS
    DIAGNOSTIC: a curve that keeps falling to the largest M_max tested means the
    memory charge never binds and full cost changes the ranking by nothing -
    which is a real, publishable negative and the one all three goals asked
    for; a curve that RISES anywhere means the optimiser is broken, since the
    feasible sets are nested; a curve that flattens far below the gate-count
    optimum is the positive result.

    (6) WHAT THE ANSWER CHANGES, STATED WITHOUT INFLATION. HQC's claimed
    classical levels are 128 / 192 / 256 bits. The indicative Prange gate
    counts above (175.7 / 246.8 / 310.9 under W = 2w) sit ABOVE those levels,
    which means the claimed levels are set by the advanced family delivering
    roughly 47 / 55 / 55 bits of improvement over Prange. If full cost erases
    a material part of that improvement, the full-cost security floor is HIGHER
    than the published gate-count figure and HQC looks STRONGER, not weaker.
    That direction is stated here, before any computation, so that a result
    pointing that way cannot be quietly dropped: ISD-FC-2026's own rule U10
    inherits KN-TECH-050's sentence that the charge "must be applied even when
    it works against the conclusion being argued for", and a program that only
    reports re-costings that lower security estimates is running a biased
    instrument.

  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-05'
    corpus_paths_grepped:
      - ledger/ (all record types)
      - experiments/ (233 directories)
      - knowledge/literature, knowledge/techniques
      - coordination/goals/GOAL-HQC-001 (three batches)
    grep_results:
      - >-
        No experiment, evidence, or concrete_cost record charges memory for any
        ISD variant at any parameter set. The convention ISD-FC-2026 exists,
        is marked "proposed - binding only if a Coordinator ledger archive
        adopts it", and has never been applied to a number.
      - >-
        GOAL-MCE-001's checkpoint records its own producer reading
        Esser-Bellini Table 1 and declining to transcribe it.
      - >-
        GOAL-SDITH-001's next_action states "The first deliverable is the
        memory-charged ISD baseline, not an attack" - the same gap in a third
        goal.
    conclusion: >-
      The COMBINATION (full-cost accounting x ISD x HQC's selected parameters)
      is absent from this corpus. The individual components are all standard
      and none is claimed as novel: Wiener full cost is 1990s work, Prange is
      1962, Stern is 1988, and re-costing under a memory-aware model is what
      KN-TECH-040 records happening to lattice finalists. Whether the specific
      re-costing has been published externally for HQC is UNKNOWN here, and
      stage 0 is to look; a positive finding there converts this proposal from
      a derivation into a reproduction, which is still worth having and is
      still the deliverable the goal asked for.

  lossy_projection_identifiability_audit:
    projection: >-
      Full algorithm execution (an exponential-length transcript of
      permutations, matrix states, list contents and probes) -> the triple
      (G, M, FC), three integers.
    what_is_discarded: >-
      Everything except three numbers: which codewords were examined, in what
      order, with what success, and every structural feature of the code.
    why_genuinely_lossy: >-
      Extremely lossy - the fibre over a given triple contains every algorithm
      with the same resource profile, including ones that decode nothing at
      all. This is the ordinary and intended condition of a cost model.
    why_compatible_with_the_operations: >-
      Compatible because cost is ADDITIVE over the algorithm's phase
      decomposition and MULTIPLICATIVE in the U2 composition, so the triple of
      a composite algorithm is determined by the triples of its phases plus the
      declared occupancy intervals. That is exactly the propagation property
      the inventor protocol section 2 demands, and it is why a cost model can
      be reasoned about compositionally at all.
    is_it_only_a_change_of_coordinates: >-
      NO, in the strong sense: the projection maps an exponentially large
      object to three integers and nothing is recoverable. The
      (Delta, Pi) = (x XOR y, x.y) failure is structurally impossible here.
    which_failure_was_checked_and_what_it_returned: >-
      THE MIRROR FAILURE - constancy across instances, zero comparator spread -
      was checked, because a cost model that returns the same triple for every
      algorithm is exactly a worthless statistic. It returns NEGATIVE, with a
      derived separation rather than an asserted one: the third coordinate FC
      separates Prange from any list-based variant by construction, since
      FC_Prange = G_Prange . poly while FC_list >= M^{4/3}/e, and these differ
      whenever M is superpolynomial. The spread across the family under FC is
      therefore nonzero by theorem. What IS at risk, and is declared, is that
      the FIRST coordinate G is nearly constant across accounting bases up to
      the word-width factor - which is precisely why ISD-FC-2026 U3 forbids
      ranking on G and requires the triple.

  assumptions:
    - >-
      That HQC key recovery is [2n, n] quasi-cyclic syndrome decoding at weight
      2w. This follows from s = x + h.y with w(x) = w(y) = w and is subject to
      the same SPEC section 4.1 weight ambiguity flagged above; both readings
      are carried and stage 0 resolves it.
    - >-
      That U4's Theta(M^{2/3}) bisection bandwidth is the right access model.
      ISD-FC-2026 adopts it, argues it from KN-TECH-035 and from the internal
      reproduction check in TASK-20260728-007 F1, and DECLARES THE UPPER BOUND
      HALF A MODELLING ASSUMPTION rather than a proof. The square-root
      (planar) and logarithmic (addressing-only) models are carried as declared
      sensitivity rows, not hidden.
    - >-
      That A = Omega(M/e) - each stored element is touched at least twice.
      True for every list-based ISD variant this program can name, and FALSE
      for an algorithm that writes a table and never reads most of it, which no
      ISD variant does. Stated so a reviewer can attack it.
    - >-
      NO ASSUMPTION IS MADE about any published ISD cost figure. The proposal
      does not depend on Esser-Bellini, on any estimator's output, or on any
      number this program has not derived. Published figures enter only as an
      OPTIONAL comparison stage whose failure to obtain is an infrastructure
      outcome (AGENTS.md rule 5) and never a mathematical one.

  predictions:
    - metric: >-
        Exact integer value of log2 G_Prange at HQC-1/3/5 key-recovery
        parameters, under U1 gate-ops, recomputed in-harness
      direction: different
      minimum_effect: >-
        Reproduce the session-computed 175.7 / 246.8 / 310.9 (W = 2w reading)
        or 109.4 / 146.5 / 179.6 (W = w reading) to within 0.1 bits using the
        identical formula (N-K)^2 . N . C(N,W)/C(N-K,W). A departure means the
        parameter transcription is wrong and the package halts at stage 1.
    - metric: >-
        The memory ceiling G_Prange^{3/4}, in bits
      direction: different
      minimum_effect: >-
        2^131.8 / 2^185.1 / 2^233.2 under the W = 2w reading. This is a FORCED
        VALUE derived from the previous metric by a fixed exponent and admits
        no tuning.
    - metric: >-
        delta_FC = log2 FC*(unbounded memory) - log2 FC*(polynomial memory),
        i.e. how many bits the advanced family actually buys once memory is
        charged, computed over Stern's exact (p, l) family
      direction: lower
      minimum_effect: >-
        NO VALUE IS PREDICTED, deliberately, and that is not a dodge: the
        proposal's content is the METHOD and the inequality, and pre-registering
        a number here would be a fit. What IS pre-registered is the SIGN and
        the comparison: delta_FC <= delta_G, strictly, wherever the FC-optimal
        memory is superpolynomial, because charging a nonnegative penalty
        cannot increase an advantage. If the computation returns
        delta_FC > delta_G the implementation is wrong, and that is a hard
        invalidation rather than a finding.
    - metric: >-
        Shape of the curve FC*(M_max) over a ladder of at least 5 memory caps
        spanning polynomial to unbounded
      direction: lower
      minimum_effect: >-
        NON-INCREASING at every one of the >= 5 points, by nesting of the
        feasible sets. Any increase anywhere is an implementation defect and
        invalidates the package. The flattening point must coincide, to within
        one ladder step, with the FC-optimal memory computed analytically from
        the stationarity condition. A flattening point that disagrees with the
        analytic prediction by more than one step means the grid is too coarse
        or the analytic derivation is wrong, and the package reports which.
    - metric: >-
        POSITIVE CONTROL: full cost of baby-step giant-step for a group of
        order n, computed by the identical pipeline
      direction: different
      minimum_effect: >-
        n^{2/3+o(1)}, i.e. the pipeline must place the FC optimum at table size
        n^{1/3} and reproduce the published Wiener figure that this corpus
        carries at confidence established (KN-TECH-035 via KN-LIT-094), and
        that TASK-20260728-007 objection F1 already reproduced internally on
        the isogeny side. IF THE PIPELINE DOES NOT REPRODUCE n^{2/3}, IT IS
        BROKEN AND NO ISD NUMBER FROM IT MAY BE REPORTED, positive or negative.
    - metric: >-
        asymmetric_charge_audit (ISD-FC-2026 section 6): number of algorithm
        phases in which an access is charged on read but not on write, or on
        query but not on build
      direction: lower
      minimum_effect: >-
        EXACTLY 0, verified phase by phase against an enumerated phase list,
        and verified by a reader who is not the producer. ISD-FC-2026 U5
        records that this exact defect was found in this program's own isogeny
        derivation by TASK-20260728-007 F1 and forced a withdrawn exponent;
        "none found" by the producer is explicitly not a finding until an
        independent reviewer confirms it.

  minimal_test:
    design: >-
      Five stages, cheapest decisive first, pure-Python integers throughout -
      no solver, no numpy, no network. STAGE 0 (reading, zero compute): resolve
      SPEC section 4.1's weight ambiguity and transcribe (N, K, W) for the
      three levels; search for a published memory-charged HQC ISD figure and
      record whether one exists. STAGE 1 (arithmetic, seconds): compute
      G_Prange and the ceiling G_Prange^{3/4} at all three levels under both
      readings; this stage alone can terminate the line, because if the ceiling
      is below any plausible list size the advanced family is dead under full
      cost and the deliverable is written. STAGE 2 (positive control, minutes):
      run the BSGS reproduction and require n^{2/3}. STAGE 3 (Stern grid,
      minutes): optimise (p, l) under G and under FC separately, over an
      exhaustive grid, and report delta_G, delta_FC and the FC-optimal memory.
      STAGE 4 (graded ladder and sensitivity, minutes): the FC*(M_max) curve at
      >= 5 caps, plus the same computation under the planar M^{1/2} and
      logarithmic access models as declared sensitivity rows.
    controls:
      - >-
        NULL OBJECT OF THE SAME SHAPE (forced value derived pre-run, CAN FAIL):
        Prange itself, run through the identical FC pipeline. Its memory is
        polynomial, so the FORCED VALUE is FC = G up to the declared polynomial
        factor, i.e. log2 FC - log2 G <= 2 log2 N. This null CAN fail: if the
        pipeline returns a superpolynomial gap for an algorithm with no lists,
        the memory accounting is picking up something that is not there and
        every other number in the package is void.
      - >-
        POSITIVE CONTROL WHERE THE EFFECT MUST APPEAR: baby-step giant-step,
        whose full-cost answer n^{2/3+o(1)} is published, is carried in this
        corpus at confidence established, and has already been reproduced once
        internally. The memory charge MUST move its optimum from table size
        n^{1/2} to n^{1/3}. If it does not, the instrument cannot detect a
        memory penalty that is known to exist, and no negative ISD result may
        be reported.
      - >-
        GRADED CONTROL, >= 5 interior points, monotonicity reported:
        FC*(M_max) over memory caps spanning polynomial to unbounded, with
        non-increase required at every step and the flattening point compared
        against the analytic stationarity prediction. This localises a failure
        to the optimiser, the grid, or the derivation instead of leaving "the
        charge did not matter".
      - >-
        NEARBY OBJECT WHERE THE CONCLUSION IS EXPECTED TO FAIL: the same
        pipeline at Classic McEliece's parameters (much longer code, much lower
        rate) and at a low-weight regime where Prange is known to be
        competitive. A conclusion that HQC's parameters are special must
        survive being applied to a code where the balance is different; a
        pipeline that reports the same verdict everywhere is reporting the
        accounting basis rather than the parameters.
      - >-
        ACCOUNTING-BASIS SENSITIVITY ROWS: the identical computation under
        (a) unit-cost RAM (memory free) - which must reproduce the published
        style of figure and is the comparability leg U3 requires; (b) planar
        M^{1/2} access; (c) logarithmic addressing. Reporting three bases
        beside each other is what stops the headline from being an artifact of
        one choice, and ISD-FC-2026 requires it.
      - >-
        ORDERING CONTROL: the null (Prange) and the positive control (BSGS) are
        computed, hash-committed and reported BEFORE the Stern grid is run.
    required_metrics:
      - (G, M, FC) triple for every algorithm x parameter-set cell, never a scalar
      - log2 G_Prange and the ceiling G_Prange^{3/4} at three levels, both readings
      - delta_G and delta_FC over Stern's (p, l) family, with the optimal (p, l) for each
      - FC*(M_max) at >= 5 caps with monotonicity verdict and flattening point
      - BSGS reproduction exponent, reported before any ISD number
      - asymmetric_charge_audit, phase by phase, with the independent checker named
      - the three sensitivity bases side by side
      - the resolved reading of SPEC section 4.1's weight ambiguity, quoted

  falsification_conditions:
    - >-
      The BSGS positive control does not reproduce n^{2/3+o(1)}. The pipeline
      is broken; the package reports an instrument failure and NO ISD figure,
      in either direction.
    - >-
      The Prange null returns a superpolynomial FC-minus-G gap. The memory
      accounting is fabricating occupancy; package void.
    - >-
      FC*(M_max) increases at any ladder step. Feasible sets are nested, so
      this is an implementation defect and never a finding.
    - >-
      delta_FC > delta_G. Charging a nonnegative penalty increased an
      advantage; implementation defect.
    - >-
      The memory ceiling G_Prange^{3/4} turns out to exceed every plausible
      list size at all three levels by a wide margin. Then full cost does not
      bind at HQC's parameters, the advanced family's ranking is unchanged, and
      THE HONEST DELIVERABLE IS THAT NEGATIVE - stated with its exact tested
      boundary (these parameters, this access model, these variants) and with
      the sensitivity rows, so the next agent does not re-tread it.
      Pre-declaring this outcome as usable is deliberate: a re-costing exercise
      that can only "succeed" by finding a problem is not an instrument.

  confounders:
    - >-
      WORD-WIDTH DIVERGENCE. Published ISD figures count vector operations,
      machine-word operations, bit operations or gates, and the conversions
      differ by factors of hundreds. ISD-FC-2026 U1 fixes gate-ops and requires
      the conversion factor to be stated on every quoted comparison; a headline
      produced by silently comparing two bases would be worthless.
    - >-
      THE U4b LOCALITY EXEMPTION IS THE MOST ABUSABLE RULE IN THE CONVENTION,
      and ISD-FC-2026 says so. Any claim that a list probe is sequential must
      exhibit the concrete addressing order. Hash-keyed and nearest-neighbour
      probes are random by default. A producer who wants a low FC can get one
      by asserting locality, and the contract must not let that pass.
    - >-
      MY OWN PRANGE FIGURE IS CRUDE. The (N-K)^2.N per-iteration term ignores
      the standard iterative-update refinement and the DOOM factor; both LOWER
      G_Prange and therefore LOWER the ceiling G_Prange^{3/4}, i.e. they make
      the advanced family's task HARDER, so the crude figure is optimistic FOR
      THE ADVANCED FAMILY and the direction of the error is disclosed rather
      than hoped about. Refining it is a stage.
    - >-
      PARAMETER TRANSCRIPTION. Every number depends on SPEC Table 5, which this
      program transcribed once and whose neighbouring table already contained a
      documented error worth 50.7 bits at NIST-5 (the RS-S3 minimum distance,
      DEC-20260802-344883 D-2, resolved in CORR-20260802-3ae664). Stage 0
      re-reads Table 5 from the primary PDF rather than from the transcription.

  interpretation_limits:
    - >-
      A COST-MODEL COMPUTATION AT CRYPTO PARAMETERS IS NOT CRYPTO-TIER
      EVIDENCE. Nothing is executed at HQC's parameters; expressions are
      evaluated at them. RQ-HQC-001's toy ceiling stands, and any downstream
      citation must carry the distinction. This is the exact failure mode
      recorded across the corpus in KN-FIND-f8c290 and KN-FIND-2a8b7e, where a
      single solve at p = 1009 was extrapolated to N = 2^256.
    - >-
      NO ATTACK IS PROPOSED AND NO SECURITY LEVEL IS ASSERTED. The output is a
      BASELINE - the number an attack would have to beat - and a statement
      about which accounting basis it is on.
    - >-
      The conclusion is scoped to the variants actually costed. Stern is
      derivable in closed form here; MMT, BJMM and May-Ozerov are NOT costed
      from scratch in the decisive stage and any statement about them rests on
      the family-wide inequality M < G_Prange^{3/4}, which is a NECESSARY
      condition only. It does not certify that a variant satisfying it wins.
    - >-
      ISD-FC-2026 is PROPOSED, NOT ADOPTED (DEC-20260802-344883 D-6 left it
      pending). Using it here does not adopt it; adoption is a Coordinator act.
      If the Coordinator later adopts a different basis, every figure in this
      package is re-derivable from the same code by changing U4, and the
      package must be structured so that it is.

  heuristic_assumptions:
    - id: HEUR-HQC-ISD-1
      statement: >-
        FORALL list-based ISD variants V and FORALL parameter sets in the
        declared boundary, the number of genuinely random accesses A(V)
        satisfies A(V) >= M(V)/e(V), where e(V) is the stored element width in
        bits. The quantifier order matters and is stated deliberately: the
        bound is claimed uniformly over variants, not variant by variant.
      random_model_justification: >-
        Not a distributional claim at all - it is a counting statement about
        the algorithms, justified by the observation that a stored element
        that is never read could be omitted without changing the output, so
        any variant violating it has a strictly cheaper variant with the store
        removed. That argument is given here rather than cited.
      supporting_results: []
      validation_experiment_ids: [EXP-HQC-50ebe9]
      falsification_condition: >-
        Exhibit a list-based ISD variant whose stored elements are provably
        touched o(M/e) times and whose output is unchanged by removing the
        untouched part. That variant then escapes the M^{4/3} floor and the
        family-wide inequality must be restated as variant-specific.
    - id: HEUR-HQC-ISD-2
      statement: >-
        U4's Theta(M^{2/3}) bisection throughput is achievable, not merely a
        lower bound obstruction. FORALL stores of M cells there EXISTS a mesh
        layout and routing achieving Theta(M^{2/3}) random accesses per unit
        time.
      random_model_justification: >-
        The lower-bound half is a bisection-bandwidth argument and is
        rigorous; the achievability half is a MODELLING ASSUMPTION and
        ISD-FC-2026 declares it as one in its own text. It is inherited here
        with that status intact and is not upgraded.
      supporting_results: []
      validation_experiment_ids: [EXP-HQC-50ebe9]
      falsification_condition: >-
        The BSGS positive control fails to reproduce n^{2/3+o(1)} under this
        model. That is the only internal check available and it is why the
        control is mandatory rather than decorative.

  target_complexity:
    time_exponent: >-
      This proposal MOVES NO EXPONENT OF ITS OWN AND CLAIMS NONE. What it can
      move is WHICH exponent is the baseline: if the advanced family's
      advantage does not survive full cost at HQC's parameters, the baseline
      exponent for code-based key recovery is Prange's, and the same statement
      lands simultaneously at Classic McEliece and SDitH. That is a
      reordering, not an improvement, and calling it an improvement would be
      the overclaim.
    memory_exponent: >-
      THE POINT OF THE RECORD. Prange: polynomial. Stern and its descendants:
      superpolynomial, with the exponent computed in stage 3 rather than
      assumed. Reporting the memory exponent beside the time exponent is the
      requirement docs/claims-and-verification.md states as "memory complexity
      stated beside time, always", and which the program-wide census found 82
      of 229 evidence records violating.
    best_known: >-
      The published gate-count-only figures for advanced ISD at HQC's
      parameters. NOT TRANSCRIBED HERE, deliberately: GOAL-MCE-001's producer
      read Esser-Bellini Table 1 and declined to transcribe it, and this
      program does not have those numbers in any record. Obtaining them is
      stage 0 and their absence is an infrastructure outcome, never a
      mathematical one.
    hidden_overhead: >-
      The polynomial factor in FC_Prange = G_Prange . poly(N) is not pinned
      here and is declared; it is bounded by N^2 in the null control's pass
      condition. Wiener's o(1) is discussed in KN-OPEN-017 as possibly too
      loose at reachable sizes, and that entry's own words - "No source in this
      corpus computes the crossover under full cost" - are the reason this lane
      matters beyond HQC.
    tradeoff_note: >-
      The FC*(M_max) curve IS the time-memory tradeoff, computed rather than
      asserted, and its flattening point is the tradeoff's operating point.

  dominated_by: >-
    n/a for the AUDIT - no attack is proposed, so there is no Pareto point to
    dominate. Rows checked before writing that, across all three axes required
    by the inventor protocol section 5: TIME - the audit's own cost is
    milliseconds of integer arithmetic, and no cheaper route to a full-cost
    baseline exists because no route exists at all in this corpus. MEMORY -
    the audit holds a grid of a few thousand (p, l) cells. DATA / QUERIES -
    zero. ON THE QUESTION AUDITED, the incumbent is the published
    gate-count-only ISD estimate that sets HQC's claimed 128/192/256 levels;
    this proposal does not dominate it, it re-expresses it on a different and
    explicitly declared basis, and whether the two agree is the experiment.
  sota_delta: >-
    Quantitatively: memory-charged ISD baselines in this repository, before: 0
    across GOAL-HQC-001, GOAL-MCE-001 and GOAL-SDITH-001, all three of which
    name one as deliverable number one. After: 3 (the same code, three
    parameter families). Indicative magnitude of the effect being measured:
    Prange's gate count at HQC-1 exceeds the claimed 128-bit level by 47.7
    bits [SESSION-COMPUTED, W = 2w reading], so the advanced family is
    currently credited with roughly 47 bits at NIST-1 and the audit measures
    how many of those survive; the answer is bounded below by 0 and above by
    47.7 and is not predicted. Against the EXTERNAL state of the art: zero
    delta on any attack axis. No attack, no faster algorithm, no lower cost.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.90 that the pipeline produces a defensible (G, M, FC) triple for Prange
    and Stern at all three HQC levels and passes both controls. It is that high
    because every ingredient is a closed-form binomial expression and the
    positive control has already been reproduced once inside this repository.
    It is not higher because SPEC section 4.1's weight ambiguity can invalidate
    the parameter transcription, and because ISD-FC-2026 U4b's locality
    exemption gives an implementer enough freedom to get a wrong answer while
    following the rules.
    SEPARATELY, 0.35 that full cost materially reorders the family at HQC's
    parameters - i.e. that delta_FC is smaller than delta_G by more than 10
    bits. Not higher, because the derived ceiling M < 2^131.8 at HQC-1 is
    generous and plausible list sizes may sit far below it, in which case the
    charge simply does not bind. Not lower, because KN-TECH-040 records exactly
    this mechanism - re-costing an existing algorithm rather than finding a new
    one - producing a headline result in the lattice setting, and because the
    advanced ISD family is definitionally the shape a memory charge bites: each
    generation buys a lower time exponent with a higher memory exponent.
