idea:
  id: IDEA-20260820-74a93d
  question_id: RQ-SQISIGN-001
  added: '2026-08-20'
  title: Public-automorphism equivariance commuting-square audit for SQIsign simulators
  class: simulator_equivariance_diagnostic
  claim: >-
    If a public automorphism or representation isomorphism preserves the
    verifier relation, a correct simulator should satisfy a corresponding
    distributional commuting square. Auditing that square may detect a
    representation-dependent simulator defect. This is a new unverified test
    proposal, not evidence of an SQIsign weakness.
  mechanism: >-
    Freeze a finite family G of efficiently computable public transformations
    that map verifier-admissible public instances and transcripts to equivalent
    verifier-admissible ones. Compare two paths: simulate on a transformed
    public instance, and simulate on the original instance then transform the
    resulting public transcript. Use a coupled, label-blind two-sample statistic
    on public transcript orbits. The planted positive introduces a small
    representation-dependent serializer perturbation after just one path while
    preserving verifier acceptance.
  novelty_status: unverified
  status: proposed
  source_refs:
    - ref: RQ-SQISIGN-001
      provenance: internal
      verified_by: TASK-20260820-5f47b5
      use: simulator research scope
    - ref: KN-TECH-057
      provenance: kb
      verified_by: TASK-20260820-5f47b5
      use: conditional SQIsign context only; no theorem or security conclusion imported
    - ref: KN-TECH-058
      provenance: kb
      verified_by: TASK-20260820-5f47b5
      use: baseline caveats; all inherited reductions and heuristics remain unverified
  predictions:
    - id: P1
      statement: >-
        Under a genuine simulator and every frozen g in G, the label-blind
        commuting-square test rejects at familywise probability at most 0.05
        plus Monte Carlo error over 100 repetitions.
    - id: P2
      statement: >-
        A planted verifier-preserving serializer perturbation affecting at
        least 10% of one transformed orbit is detected with at least 80% power
        at the preregistered sample size.
    - id: P3
      statement: >-
        Swapping path labels leaves the signed statistic distribution symmetric
        to total-variation error at most 0.02 under the null.
  controls:
    true_simulator_null: >-
      Generate both commuting-square paths solely with the declared simulator,
      fresh independent coins, identical public transformations, and identical
      verifier filtering.
    planted_positive: >-
      On one path only, apply a public, verifier-preserving serializer
      perturbation to 10% of a designated orbit while leaving acceptance and
      public-instance frequencies unchanged.
    observation_collision: >-
      Enumerate distinct internal constructions with the same transformed
      public transcript; the orbit statistic must be identical.
    nearby_object: >-
      Apply an equal-size public bijection that does not preserve the verifier
      relation; the audit must refuse it at the eligibility check rather than
      manufacture an equivariance failure.
  falsification_conditions:
    - Any frozen g fails the public verifier-relation preservation check.
    - Genuine-simulator familywise rejection exceeds 0.05 beyond Monte Carlo error.
    - Path-label symmetry error exceeds total variation 0.02 under the null.
    - Power against the calibrated 10% planted perturbation is below 0.80.
  confounders:
    - automorphism-dependent canonical serialization
    - unmatched randomness or rejection sampling between square paths
    - transformations that alter the public-instance sampling measure
    - orbit-size imbalance and duplicate representatives
  interpretation_limits:
    - Rejection may identify a simulator or serializer equivariance defect only.
    - Passing covers the frozen transformation family G and public observables.
    - No endomorphism-ring, isogeny-path, secret-key, forgery, or asymptotic claim follows.
  heuristic_assumptions:
    - Each member of G is publicly computable and preserves verifier admissibility on the tested domain.
    - Orbit representatives and multiplicities can be computed without hidden witnesses.
    - KN-TECH-058 reductions and heuristic assumptions remain inherited and unverified.
  target_complexity:
    time: O(|G| * q * (C_sim + C_g + C_verify))
    memory: O(|G| * b)
    data: 2q simulated public transcripts per transformation
    scope: finite frozen public transformation family G and b orbit-summary bins
  cost_model:
    time: two simulator calls, two public transformations, and verifier replays per paired sample
    memory: orbit summaries for each frozen transformation
    data: 2*|G|*q transcript observations per condition
    preprocessing: prove public eligibility of G and freeze orbit statistic, bins, and multiplicity correction
    oracle_access: declared simulator only; no signing, secret, path, or endomorphism oracle
    verification: replay both paths, verifier acceptance, transformation eligibility, and orbit counting
  proof_search_map:
    exact_baseline_reproduction: Enumerate a toy verifier relation and prove the commuting square distribution exactly.
    observation_collision_search: Enumerate hidden-path collisions under each public transformation and require orbit-statistic equality.
    quantifier_order_statement: Freeze G, eligibility proof, bins, and test before generating evaluation transcripts.
    method_ceiling: Restrict conclusions to the tested public transformation group and orbit observables.
    nearby_object_control: Reject an equal-size bijection known not to preserve the verifier relation at the eligibility gate.
  nearest_neighbors:
    - IDEA-20260820-56f047
    - IDEA-20260820-a0649e
    - IDEA-20260820-c69c74
  dominated_by: n/a (no result claimed)
  sota_delta:
    metric: claimed SQIsign security exponent improvement
    baseline: 0
    proposed: 0
    delta: 0
    units: exponent
    rationale: new equivariance diagnostic only
  recommended:
    next_test: Prove eligibility on an enumerated toy verifier relation, then calibrate genuine-null and 10% serializer-positive power.
    stopping_rule: Stop if any transformation fails eligibility; otherwise stop at 100 repetitions per condition and frozen q.
    required_artifacts: [transformation_spec, eligibility_checks, orbit_map, seeds, path_transcripts, two_sample_report]

