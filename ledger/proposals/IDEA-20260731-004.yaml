idea:
  id: IDEA-20260731-004
  title: "QROM Fiat-Shamir extractor loss: is FAEST's claimed category backed by the charged QROM bound at the deployed parameter sets?"
  class: measurement
  claim: >-
    At the deployed faest_128f / faest_128s parameter set (spec v2.0,
    category-1, AES-128), the fully charged QROM security bound for FAEST's
    tau-round VOLEitH commit-and-open sigma protocol under the Fiat-Shamir
    transform — charging the concrete QROM extractor loss L_QROM(tau, kappa,
    q, digest, |C|, eps_cc) reconstructed from the current (2026-retightened)
    QROM analysis, the round-by-round soundness terms, and a real hash-query
    budget q — supports the claimed 128-bit category: charged_QROM_bound >=
    2^128, and >= the matched quantum AES-128 baseline under the same
    MAXDEPTH convention. Equivalently: the QROM extractor-loss link of the
    soundness chain is not the source of a quantum forgery below the claimed
    category. This is a verification/barrier lane: confirmation produces the
    GOAL-FAEST-001 scoped barrier statement for exactly this link; a
    reconstruction showing the charged bound degrades below the claimed
    category at the deployed set is a proof-gap/parameter finding that feeds
    the multi-round forgery model (IDEA-20260731-002) as the quantum side.
  mechanism: >-
    Exact attack object: the QROM Fiat-Shamir extractor loss term L_QROM as
    instantiated on FAEST's sigma protocol — the concrete reduction loss (in
    log2 bits) between (a) the success probability of a quantum adversary
    that produces an accepting FAEST signature using q hash queries and (b)
    the probability that the extractor (measure-and-reprogram /
    Renyi-divergence based) recovers the AES key (the witness) from that
    adversary, compounded over the tau rounds of the VOLEitH repetition
    structure, the grinding exponent kappa, and the commit-and-open challenge
    derivation. In the QROM the extractor cannot rewind (no-cloning), so the
    standard reductions convert the quantum adversary into a classical
    distributional game and charge a loss that grows with the query budget q
    and decays with the challenge min-entropy; for multi-round protocols the
    loss interacts with the round-by-round soundness structure that the
    VOLEitH analysis uses (KN-LIT-7638 abstract: "soundness of the
    Fiat-Shamir non-interactive version analyzed via round-by-round
    soundness") and with the tightness of the commit-and-open template:
    tight online extractability in the QROM is proven only for specific
    commit-and-open templates (element-wise hashing and Merkle trees —
    KN-LIT-969), and generic FS bounds are documented as often too weak for
    concrete multi-round instances (KN-LIT-7137); the question is whether
    FAEST's LeafCommit/bAVC instantiation falls inside the tight template or
    outside it. FAEST v2.0 claims a tight QROM proof (KN-LIT-7637, from the
    official resources page), yet reported 2026 work retightens the analysis
    via Renyi-divergence arguments (RQ-FAEST-001 motivation) — the
    previously claimed bound was not tight in at least one direction, and a
    bound that moved once can move again. The mechanism under test: whether
    the current tightest bound, charged at the deployed set with a real query
    budget q (each hash query charged at its AES-equivalent cost) and under a
    MAXDEPTH quantum convention, still dominates the claimed category — or
    whether a concrete multi-round forgery cost for a quantum adversary lands
    inside the slack. The re-derivation component fixes the bound's exact
    form from eprint 2023/996 full text + spec v2.0 security section + the
    2026 retightening work (to be filed as a KN-LIT entry first); the toy
    component measures, by exhaustive enumeration, the distributional
    quantities the bound is a function of — the Renyi-2 divergence between
    the real and simulated transcript/query distributions and the
    measure-and-reprogram bad-event probabilities — for the concrete
    transcript structure at toy scale, with scaling controls on the challenge
    entropy and the query budget (a loss that fails to grow with q or to
    decay with |C| is the canonical artifact tell, inventor-protocol §3).
  novelty_status: unverified
  assumptions:
    - >-
      The deployed tau, kappa, field, digest lengths, challenge space, and
      the claimed security category are UNVERIFIED placeholders until spec
      v2.0 (PDF body text unextractable in the sources task, KN-LIT-7637
      limit) and eprint 2023/996 full text are read. RSF-5 gates any
      deployed-set number; no experiment may be designed before the pinning
      (RQ-FAEST-001 constraint).
    - >-
      The 2026 Renyi-divergence retightening work named in RQ-FAEST-001's
      motivation is NOT filed in knowledge/ and has not been read by this
      program; it is the tightest-known QROM bound for FAEST's instance and
      filing + reading it is a hard dependency of the reconstruction (its
      absence is why novelty_status is unverified rather than adaptation).
    - >-
      FAEST v2.0's security analysis claims a tight QROM proof (KN-LIT-7637,
      reported from the official resources page, not read). The re-derivation
      must confirm what "tight" means in the spec before the comparison is
      valid.
    - >-
      RSF-1 data-budget caveat applies: FAEST's OWF inversion is one-pair key
      recovery; the classical biclique baseline is published at 2^88 chosen
      plaintexts and is a comparative lower bound. For this QROM lane the
      adversary is quantum, so the matched comparison uses the quantum AES
      baseline (Grover-class) under MAXDEPTH, stated separately from the
      classical 2^126.1.
    - >-
      This record isolates ONLY the QROM extractor-loss link. The
      consistency-check term (IDEA-20260731-019), the classical
      grinding/repetition forgery model (IDEA-20260731-002), and the
      commitment-binding term (IDEA-20260731-003) are separate links; a
      finding here must not be conflated with a finding on those.
  predictions:
    - metric: charged_qrom_bound_minus_claimed_category
      direction: higher
      minimum_effect: >-
        charged_QROM_bound - claimed_category >= 0 at the deployed set (the
        reconstruction's charged bound, sweep over feasible (q, tau), is at
        or above the claimed 128-bit category). The falsification direction
        is a charged bound below the claimed category at a named (q, tau).
    - metric: toy_extractor_loss_growth_in_query_budget
      direction: higher
      minimum_effect: >-
        Doubling the toy hash-query budget q increases the measured loss by
        >= 1 bit at every tested (tau, |C|) combination, matching the
        reconstructed bound's q-dependence exponent within an agreement
        window of [0.5, 2] on the slope. A loss that fails to grow with q is
        a harness artifact (inventor-protocol §3: the parameter that should
        move the quantity must move it).
    - metric: toy_extractor_loss_decay_in_challenge_entropy
      direction: lower
      minimum_effect: >-
        Doubling the toy challenge space |C| decreases the measured loss by
        >= 1 bit at every tested (tau, q) combination (canonical decay
        control: the loss must decay as the min-entropy that should destroy
        it grows). A loss that stays constant as |C| doubles invalidates the
        measurement.
    - metric: toy_measured_divergence_ratio_to_bound
      direction: lower
      minimum_effect: >-
        Measured Renyi-2 divergence / bad-event probability divided by the
        reconstruction's bound <= 1 at every tested toy point (the bound
        must not undercharge). A ratio > 1 is a bound-undercharging signal,
        toy-tier until re-derived at deployed parameters.
  minimal_test:
    design: >-
      Three components. (1) RE-DERIVATION (derivation artifact): file the
      2026 retightening work as a KN-LIT entry and read it; from eprint
      2023/996 full text + spec v2.0 security section + the retightening,
      write down the exact QROM bound for FAEST's FS instance: the extractor
      loss L_QROM as a function of (tau, kappa, q, digest length, challenge
      min-entropy, eps_cc, LeafCommit/bAVC template fit), the round-by-round
      soundness terms, and the claimed category; compute the charged bound at
      the deployed set under the MAXDEPTH convention with the hash-query
      budget q charged at the deployed hash's AES-equivalent cost. (2) TOY
      DISTRIBUTIONAL MEASUREMENT (run): at toy scale (challenge space |C| =
      2^3..2^8, tau = 1..8, toy commit-and-open with toy LeafCommit-shaped
      hashing, query budget q exhaustively enumerable), compute by
      enumeration the Renyi-2 divergence between the real transcript/query
      distribution and the simulated one, and the measure-and-reprogram
      bad-event probabilities, for a family of toy adversary strategies;
      compare against the reconstruction's bound at the same (tau, |C|, q);
      repeat at doubled |C| and doubled q for the scaling controls. (3)
      CHARGED-BOUND CHECK: assemble the pinned deployed numbers into the
      charged bound and the residual slack = claimed_category -
      charged_bound, with the q-sweep up to the budget implied by the matched
      baseline.
    controls:
      - >-
        Unstructured control: the generic QROM FS bound (DFMS-style loss
        shape, per KN-LIT-6524/969/7137) applied to a plain sigma protocol
        (no VOLEitH structure) at the same toy sizes. The harness must
        reproduce the known generic loss shape, validating the
        loss-measurement machinery before any FAEST-shaped measurement is
        interpreted.
      - >-
        Null-object control (inventor-protocol §3): the identical measurement
        with a truly random challenge function (exhaustively enumerable at
        toy scale) replacing the deployed-shaped hash. The measured loss must
        be identical within sampling noise — the concrete hash must not add
        loss beyond the model; if it does, the harness is measuring an
        artifact.
      - >-
        Scale/decay controls: (a) loss must grow with q (prediction P2); (b)
        loss must decay with |C| (prediction P3). A quantity that fails to
        respond to the parameter that should move it is the canonical
        artifact tell.
    required_metrics:
      - exact form of the reconstructed QROM bound and its charged value at the deployed set (derivation artifact)
      - measured vs predicted loss at every toy (tau, |C|, q) cell
      - ratio of measured to predicted per cell
      - q-growth slope and |C|-decay slope (validating the bound's shape)
      - final slack = claimed_category - charged_bound, with the q-sweep table
  falsification_conditions:
    - >-
      A re-derivation showing the charged QROM bound at the deployed set is
      below the claimed category (or below the matched quantum AES baseline
      under the same convention) at a named (q, tau) — a proof-gap /
      parameter finding, scoped to the exact bound and parameter set
      re-derived; it feeds IDEA-20260731-002's forgery model as the quantum
      side and requires independent review before any claim (AGENTS.md rule
      12 if it contradicts the scheme's stated security).
    - >-
      A toy measurement with measured divergence / bad-event ratio > the
      reconstruction's bound at any tested point — the bound undercharges.
      Toy-tier only: re-derived at deployed parameters before any claim about
      FAEST (AGENTS.md rule 7, claim_tier_ceiling of RQ-FAEST-001).
    - >-
      The unstructured control failing to reproduce the generic QROM FS loss
      shape, or the scaling controls failing (loss not growing in q / not
      decaying in |C|) — harness artifact; the test is invalid, not the
      bound.
  confounders:
    - >-
      Unread deployed inputs: tau, kappa, digest lengths, challenge space,
      and the claimed category are placeholders until spec v2.0 and eprint
      2023/996 full text are read (RSF-5); the charged bound must be
      re-parameterized from the pinned sources before any deployed-scale
      number is reported.
    - >-
      Unarchived 2026 retightening: if the retightening work is
      misrepresented or not filed, the "tightest bound" used as the
      comparison baseline is wrong; filing and reading it is a hard
      dependency.
    - >-
      Toy-scale quantum-to-classical reduction validity: the measured
      distributional quantities are necessary, not sufficient, conditions on
      a quantum adversary — the toy cells cannot certify the quantum
      adversary's strategy space and are labeled toy-tier; the deployed-scale
      statement is carried by the derivation.
    - >-
      Cost-convention ambiguity (KN-TECH-040): quantum charging (gate counts
      vs depth x width vs AES-equivalents under MAXDEPTH) can shift the
      charged bound by constant factors comparable to the slack being probed;
      the convention must be fixed identically on both sides of every
      comparison.
    - >-
      The round-by-round soundness terms (eps_cc) are the object of
      IDEA-20260731-019; a finding on the extractor loss must not be
      conflated with a finding on that term.
  interpretation_limits:
    - >-
      Confirmation closes exactly the QROM extractor-loss link, at exactly
      the tested parameter sets and quantum convention; it is a scoped
      barrier statement, not a statement about the whole soundness chain, and
      not an attack.
    - >-
      A bound-degradation finding is derivation/toy-tier until re-derived at
      deployed parameters and validated via a forgery certificate at reduced
      parameters (claim_tier_ceiling of RQ-FAEST-001).
    - >-
      This record creates no hypothesis, experiment, evidence, or decision
      record; it is a proposal whose minimal test, if approved, would be
      specified and executed under later tasks.
    - >-
      The classical (ROM) side of the Fiat-Shamir/grinding link is the object
      of IDEA-20260731-002; this record addresses only the quantum/QROM side.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The 2026 retightening work's Renyi-divergence bound is correct and is
        the tightest-known QROM bound for FAEST's FS instance at the deployed
        set.
      rigorous_support: >-
        Named in RQ-FAEST-001 motivation (reported, not archived); the
        Renyi-divergence technique is the standard tightening tool for QROM
        FS proofs, and the corpus's QROM FS records (KN-LIT-6524, KN-LIT-969,
        KN-LIT-7137) document that generic QROM FS bounds are loose for
        concrete multi-round instances — the retightening is the current
        best.
      validation_plan: >-
        File the 2026 work as a KN-LIT entry, read it, and re-derive its
        bound end to end; the reconstruction artifact is the validation, and
        the toy distributional measurement checks the bound's constants and
        compounding structure.
    - id: H2
      statement: >-
        The extractor loss for the tau-round VOLEitH FS instance is a
        function L_QROM(tau, kappa, q, |C|, eps_cc) of the form given by the
        reconstruction, growing with the query budget q and decaying with the
        challenge min-entropy at the predicted rates.
      rigorous_support: >-
        The shape of QROM FS proof-of-knowledge reductions
        (measure-and-reprogram / one-way-to-hiding; KN-LIT-6524) and the
        round-by-round soundness analysis claimed for the non-interactive
        VOLEitH version (KN-LIT-7638 abstract); the exact exponents are
        UNVERIFIED until the sources are read.
      validation_plan: >-
        Toy distributional measurement with the q-growth (P2) and |C|-decay
        (P3) controls; the measured slopes must match the reconstructed
        bound's exponents within the agreement window.
    - id: H3
      statement: >-
        The deployed category-1 claimed security is 128 bits, and the scheme's
        QROM analysis is intended to support it at the deployed set.
      rigorous_support: >-
        Placeholder — UNVERIFIED: spec v2.0 security section has not been
        read by this program (KN-LIT-7637 limit).
      validation_plan: >-
        Read spec v2.0 parameter/security tables; re-run the charged-bound
        computation with the pinned numbers; any input change that moves the
        output is recorded as a parameter-sensitivity finding.
    - id: H4
      statement: >-
        The adversary's hash-query budget q at the deployed set is bounded by
        the matched-baseline cost model: a forger whose charged cost (queries
        x per-query AES-equivalent, plus memory, under MAXDEPTH) exceeds the
        matched quantum AES baseline is not a threat to the claimed category.
      rigorous_support: >-
        The matched-baseline convention (KN-TECH-040: the convention is part
        of the claim); standard for concrete security statements.
      validation_plan: >-
        The charged-bound computation sweeps q up to the budget implied by
        the matched baseline; the critical output is the q at which the bound
        crosses the baseline, if any.
  matched_baseline:
    parameter_set: >-
      faest_128f / faest_128s (spec v2.0, category-1, AES-128). Deployed tau,
      kappa, field, digest lengths, and challenge space are UNVERIFIED
      placeholders (spec PDF body text not extractable in the sources task,
      KN-LIT-7637 limit); pinned from spec v2.0 + eprint 2023/996 full text
      before any experiment (RQ-FAEST-001 constraint).
    convention: >-
      Serial classical cost in AES-128-equivalent evaluations (one AES-128
      encryption = 1 unit); hash calls converted at the deployed hash's
      per-call AES count; memory in bits charged separately; data charged;
      quantum baselines stated separately under a depth-limited (MAXDEPTH)
      convention with the charged model (gate count vs depth x width) named.
      Identical convention on both sides of every comparison (KN-TECH-040).
      Because the adversary in this lane is a quantum (QROM) adversary, the
      matched comparison is against the quantum AES baseline; the classical
      2^126.1 is recorded for completeness.
    aes_key_recovery: >-
      Classical: 2^126.1 time for full 10-round single-key known-plaintext
      AES-128 key recovery, biclique (Bogdanov-Khovratovich-Rechberger;
      KN-LIT-2701, archived, confidence reported). RSF-1 caveat: FAEST's OWF
      inversion is one-pair key recovery; the biclique is published at ~2^88
      chosen plaintexts (data/memory detail UNVERIFIED in-repo) and is a
      comparative lower bound on the one-pair cost. Quantum (the matched side
      for a QROM adversary): Grover key search ~2^64 sequential AES
      evaluations (KN-LIT-679, archived query count); depth-limited charged
      estimates ~2^85.8 (Jaques-Schrottenloher — NOT archived, UNVERIFIED
      in-repo); NIST gate-count estimate ~2^143 (UNVERIFIED in-repo). FAEST's
      one-wayness assumption applies to f(k) = AES_k(x) for fixed public x
      (KN-LIT-7637); inverting f is one-pair key recovery.
    voleith_fs_soundness: >-
      Best known attack on the VOLEitH/Fiat-Shamir layer for a quantum
      adversary: the generic QROM FS forgery bound with the extractor loss —
      exactly the object this idea reconstructs. Shape (UNVERIFIED until the
      sources are read): extractor-lossy QROM reductions (KN-LIT-6524), with
      tight online extractability known only for specific commit-and-open
      templates (element-wise hashing, Merkle trees — KN-LIT-969) and with
      generic FS bounds documented as often too weak for concrete
      multi-round instances (KN-LIT-7137); the round-by-round soundness terms
      compound over tau rounds, and the 2026 Renyi-divergence retightening
      (unfiled) is the current tightest. Classical side: the generic
      transcript forgery 2^{kappa} * eps_cc^{-tau} * C_transcript is the
      object of IDEA-20260731-002. No structural QROM attack on FAEST's FS
      instance is published to this program's knowledge (prior-art grep of
      knowledge/ and ledger/ found no FAEST-specific QROM record).
  target_complexity:
    time_exponent: >-
      n/a — no attack claimed. The quantity under test is the extractor-loss
      exponent L_QROM(tau, kappa, q, |C|) in bits at the deployed set and the
      charged bound cost_QROM = 2^{L} x (round-by-round terms); the
      falsification is a charged value below the claimed category (or below
      the matched quantum AES baseline).
    memory_exponent: >-
      Quantum memory (qubits) and circuit depth charged under MAXDEPTH; the
      reconstruction must disclose the qubit counts and depth of the
      adversary circuits used in the bound, exactly as the matched quantum
      AES baseline is charged.
    best_known: >-
      Claimed category 2^128 at category-1 (UNVERIFIED — spec unread);
      generic QROM FS loss shape (KN-LIT-6524/969/7137, exact deployed form
      UNVERIFIED); quantum AES baseline Grover 2^64 (KN-LIT-679) with
      depth-limited charged estimates UNVERIFIED in-repo.
    hidden_overhead: >-
      The q-dependence (query-budget factor) and the tau-compounding are the
      hidden terms in any asymptotic "tight" claim; both are disclosed per
      component by the reconstruction — nothing folds into an o(1) term.
    tradeoff_note: >-
      The extractor loss trades against the query budget q (more queries =>
      more loss) and against the round count tau (more rounds => more
      round-by-round terms); the charged-bound sweep over (q, tau) is the
      tradeoff surface, and the depth-vs-width choice under MAXDEPTH is part
      of the convention, not a free parameter.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
