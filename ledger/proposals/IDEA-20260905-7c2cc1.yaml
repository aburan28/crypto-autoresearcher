idea:
  id: IDEA-20260905-7c2cc1
  title: Mixed Hecke differences as a test of conductor interactions
  class: mechanism
  claim: If an equation-dependent complexity statistic is a sum of separate local conductor contributions, its mixed
    difference around a commuting ell1/ell2 isogeny square vanishes after matched automorphism normalization. A
    nonzero, presentation-stable mixed difference would identify an interaction resource absent from one-prime volcano
    depth.
  mechanism: Distinct prime-degree ideal actions offer two routes between corresponding endpoints when the orientations
    and horizontal/vertical conditions permit a square. Apply Delta_ell1 Delta_ell2 to an exact rank-profile statistic
    rather than a noisy timing. A separable sum of local contributions is annihilated. A surviving mixed term can
    come from the arithmetic interaction of the order with a chosen factor-base presentation; an incorrectly matched
    square can produce the same signature. Special j vertices require stack/automorphism weights and cannot be treated
    as random controls.
