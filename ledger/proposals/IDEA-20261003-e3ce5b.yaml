  assumptions:
    - h(D0) = 1 and D0 < -4 for the primary strata, so O_K^* = {+-1}, the crater curve is unique, and every F_p-isomorphism class has (p-1)/2 short-Weierstrass representatives.
    - gcd(N, v D0) = 1 and v_N(f) = 1, so the N-volcano has exactly two levels and every descending N-isogeny from E0 ends on the floor.
    - Python with python-flint fq_default (repo extra `fast`, flint >= 0.7) is the F_{p^k} arithmetic; no Sage, no Magma.

  proof_search_map:
    bottleneck: >-
      Producing an F_p-rational N-floor curve E1 together with an evaluable
      descending map from E0 (Problem B). In the direct method the single
      expensive input is a generator of an order-N subgroup of E0[N], which
      exists only over F_{p^k}.
    baseline_embedding:
      parameter_slice: >-
        A1 at k = N - 1 (S1 cell k = 240 at N = 241) is Galbraith's
        construct-the-isogeny baseline; A2 is Galbraith's guess-a-floor-curve
        baseline at every S3 cell.
      reproduction_check: >-
        Frozen fixtures: S1 k = 240 cell (10 instances) and the S3 formula
        cells; both are run before any interpretation of the small-k cells.
    observation_collision:
      observable: >-
        The floor certificate: #E1(F_p) = p + 1 - t plus a point of order N^e
        in E1(F_{p^k}) where N^e exactly divides #E1(F_{p^k}).
      distinct_preimage_search: >-
        Known collisions: (i) group order alone -- every curve of the class has
        #E(F_p) = p + 1 - t, and for k != 1 the F_p-group structure does not
        see N at all, so no F_p-only invariant separates crater from floor;
        (ii) for v > 1 the crater holds v curves (conductors d | v), so
        j(E1) != j0 does not certify the floor. The certificate is chosen to
        separate both: on the crater E(F_{p^k})[N] = E[N] has rank 2, so no
        point of order N^e exists; on the floor it has rank 1 and the N-Sylow
        subgroup is cyclic. Consequence recorded as a finding to test, not a
        claim: certifying floor membership by this route itself costs
        O(k log p) F_{p^k}-operations. Collision with the literature: small k
        is the condition N | p^j - 1 for small j (an embedding-degree-like
        condition on N); whether Galbraith 1999/2024 state this is NOT
        VERIFIED.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The fibre of instances (E0, N) with the same (p bits, N) and varying
          k = ord_N(t/2); the cost of A1 is read along it with N fixed.
        predicted_gain: >-
          Separates the k-term from the N-term of the direct cost. No exponent
          gain on the worst case.
    quantifier_order: >-
      FOR EACH instance (E0, N) in the frozen generator distribution:
      cost_A1(E0, N) <= c1 k(E0, N) log2 p + c2 N F_{p^k}-mults, with k
      depending on (p, t, N); FOR EACH instance, E[trials_A2] =
      p^2/((p-1) #S2(E0, N)). There EXISTS no uniform small-k guarantee: the
      cheap subfamily is instance-dependent and thin (HEUR-K), and no claim of
      the form FOR ALL (E0, N), Problem B in O~(N), is made.
    method_ceiling:
      strongest_certifiable_claim: >-
        A toy-scale cost law for A1, A2 and A3 on the frozen instance
        distribution, with certificates. Classic Velu keeps A1 at Omega(N)
        F_{p^k}-ops even at k = 1, and typical k ~ N keeps A1 near N^2 polylog
        F_p-ops on random instances, so the worst-case Problem-B bound
        min(N^2, q^{1/2}) is untouched by this method.
      nearby_object_control: >-
        C1: the same routine from a floor curve of the same class (no
        descending N-isogeny exists). C1b: a curve whose conductor is NOT
        divisible by N (no N-crater/floor structure). C2: smooth-conductor
        class with no large prime, same sampler and metric.
    proof_obligations:
      - claim: pi = a (mod N End(E0)), a = t/2 mod N, hence scalar action, rationality of all N+1 kernels, and E0[N] in E0(F_{p^k}) iff a^k = 1 mod N.
        responsibility: correctness
      - claim: On the floor (v_N(f) = 1) Frobenius acts on E1[N] as a Jordan block, so E1(F_{p^k})[N] is a single line and the N-Sylow subgroup of E1(F_{p^k}) is cyclic.
        responsibility: correctness
      - claim: A1 cost bookkeeping, O(k log p) for the kernel point plus O(N) for Velu, per instrumented counter.
        responsibility: runtime
      - claim: "A2 per-draw success probability (p-1) #S2 / p^2 with the twist trick, and #S2 = (N - chi(N)) sum_{d | v} h(O_d)."
        responsibility: success_probability
      - claim: Verifier shares no Velu or scalar-multiplication code with the solver.
        responsibility: interface
      - claim: Conclusions are scoped to the tested p <= 2^40, D0 set, and classic Velu.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: slope of log M_mult vs log k (S1, k-dominated cells)
      direction: different
      minimum_effect: in [0.8, 1.2]
    - metric: slope of log M_mult vs log N (S2, k in {1, 2})
      direction: different
      minimum_effect: in [0.8, 1.2]; far below the N^2 slope of 2
    - metric: "mean A2 draws / (p^2/((p-1) #S2)) per S3 cell"
      direction: different
      minimum_effect: in [1/1.5, 1.5]
    - metric: partial slope of log A2 draws vs log N controlling for the predicted mean
      direction: different
      minimum_effect: in [-0.1, 0.1]

  minimal_test:
    design: >-
      EXP-VOLC-3fee23: CM instance generator (h = 1 discriminants), arms A1
      (direct), A2 (blind guessing), A3 (X_1(m)-biased guessing), A0 declared
      excluded; sweeps S1 (k), S2 (N), S3 (guessing scale law), S4 (bias), a
      k-census; independent verifier on every certificate.
    controls:
      - C1 floor-start null and C1b N-free nearby object
      - C2 smooth-conductor (no large prime) class
      - C3 uniform-sampler and filter check; C3b family-sampler check
      - C4 independent verifier, no shared Velu routine
      - C5 second discriminant
    required_metrics:
      - instrumented F_{p^k} multiplication and inversion counts
      - draws to first class hit and to first certified floor curve
      - wall time and peak RSS
      - certificate verification outcomes

  falsification_conditions:
    - S1 slope in k < 0.5 or > 1.5 with its 95% CI excluding [0.8, 1.2] (cost not k-governed).
    - S2 slope in N > 1.5 at k <= 2 with its 95% CI excluding [0.8, 1.2].
    - S3 draws depending on N (|partial slope| > 0.2) or missing the exact law by more than 2x in any cell, with the CI excluding the support band.
    - Any certificate failing independent verification makes the run invalid, not the hypothesis false.

  confounders:
    - F_{p^k} library operations not routed through the counter would undercount M_mult; every exponentiation is required to be square-and-multiply on the counted product.
    - A basis routine that multiplies a random point down to order N lands in a single line when the N-Sylow subgroup is non-homocyclic; that would bias kernel choice and could hide horizontal kernels.
    - c(v) = sum_{d | v} h(O_d) / v varies with v's primes unless they split in K; A2 strata restrict v to split primes.

  interpretation_limits:
    - Toy only, p <= 2^40. No cryptographic curve, no ECDLP solve, no asymptotic claim.
    - A small-k cost law is a statement about a thin subfamily; it does not answer KN-OPEN-f2f6dc (b).
    - A2 measures Problem B in Galbraith's form (some floor curve); the strict form (image of an N-isogeny from E0) is reached only when the ascent lands on E0, with rate 1/v.

  heuristic_assumptions:
    - id: HEUR-5f03b6-K
      statement: >-
        For instances generated with t drawn uniformly from its admissible
        range subject to p prime, a = t/2 mod N is equidistributed in F_N^*,
        so Pr[k = d] = phi(d)/(N-1) for d | N-1.
      rigorous_support: >-
        Equidistribution of an interval of integers of length >> N in residue
        classes mod N is elementary; independence from the primality of the
        quadratic value (t^2 + |D0| f^2)/4 is the heuristic part (prime values
        of quadratic polynomials in residue classes, Bateman-Horn type; recalled
        pointer, not verified).
      validation_plan: >-
        K-census KC in EXP-VOLC-3fee23: 2000 unsteered instances at each of
        alpha in {0.25, 0.50}, p ~ 2^32, D0 = -7; compare the count with
        k <= floor(sqrt N) and the mean of k/(N-1) with their instance-wise
        predictions.
    - id: HEUR-5f03b6-X1
      statement: >-
        Sampling the X_1(m) family (Tate normal form or the m = 2, 3 models)
        with a uniform parameter selects each F_p-isomorphism class E with
        Aut = {+-1} with probability r_m(E)/(2p) (1 + O(p^{-1/2})), r_m(E) the
        number of points of exact order m in E(F_p).
      rigorous_support: >-
        Derived by counting (E, +-P) pairs per parameter value; not taken from
        a read source. The recalled Lenstra/Howe density is a comparison column
        only.
      validation_plan: >-
        C3b: at p = 4093 every isomorphism class and its r_m enumerated, 10^6
        family draws per m, chi-square of class frequencies against
        r_m(E)/sum r_m; plus a 20-bit class-hit z-test for m in {3, 5, 7}.

  target_complexity:
    time_exponent: >-
      No exponent claim. A1: Theta(k log p + N) F_{p^k}-mults, i.e.
      O((k log p + N) M(k)) F_p-ops; A2: p^2/((p-1) #S2) ~ q^{1/2} draws.
    memory_exponent: >-
      A1 streams the Velu sums (O(1) F_{p^k} elements) except when the kernel
      polynomial is materialised (O(N)); A2/A3 O(1).
    best_known: >-
      min(N^2, q^{1/2}) up to polylog for Problem B (KN-LIT-ca35e0 as
      summarised); O~(q^{1/4}) for ascending.
    hidden_overhead: >-
      M(k) is k^2 schoolbook or O~(k) fast; the ~N^2 worst case hides one M(k)
      factor. Random-point retries and Tonelli-Shanks 2-adic depth add bounded
      constants.
    tradeoff_note: >-
      sqrt-Velu would replace the N term by O~(sqrt N); not implemented here.

  estimated_cost:
    implementation: medium
    compute: medium
    qualification: >-
      Advisory estimate 40-80 CPU-hours, dominated by A2 draws at 32-36 bits
      (~4e5 to 1e6 draws per search). Not a cap.

  dominated_by: >-
    CHECKED against every Problem-B-relevant statement available in the
    corpus: KN-LIT-ca35e0's direct (~N^2) and guessing (~q^{1/2}) baselines,
    its O~(q^{1/4}) ascent and Kani/MITM representation bounds, and its
    Theorem 5 O~(q^{2/5}) self-reduction; KN-OPEN-f2f6dc. The ECDLP frontier
    map has no row for this problem. This proposal is dominated by those
    baselines on the worst case on every axis (it re-measures them), and adds
    only a k-parameterisation and toy certificates.
  sota_delta:
    time: >-
      Zero on the worst case. On the small-k subfamily the direct method is
      O~(N) F_p-ops versus the quoted ~N^2; that subfamily statement is
      plausibly folklore and is not claimed as new.
    memory: n/a
    data_queries: n/a

  recommended_priority: high
  recommended_priority_rationale: >-
    ECC-first (GOAL-ENDO-001 is in the ECC area set); first executable,
    certified measurement on KN-OPEN-f2f6dc (b); cheap relative to its
    information value: it fixes the baseline every later Problem-B candidate
    must beat and quantifies (via the k-census) how rare the cheap direct case
    is.

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
