  title: >-
    PROBLEM B AT TOY SCALE, PARAMETERISED BY THE N-TORSION FIELD DEGREE: the
    direct descending N-isogeny from a class-number-one crater curve costs
    Theta(k log p + N) F_{p^k}-multiplications with k = ord_N(t/2), blind
    guessing costs p/#S2 ~ q^{1/2} draws independent of N and k, and the hard
    direct instances are exactly the large-k ones -- measured, certified, and
    controlled, with no claim of a new algorithm.
  class: measurement

  claim: >-
    Setting: ordinary E0/F_p with End(E0) = O_K, h(D0) = 1, D0 < -4, Frobenius
    discriminant t^2 - 4p = f^2 D0, f = N v with N an odd prime, gcd(N, v D0) = 1.
    (C1, structural, derivation) pi = a (mod N End(E0)) with a = t/2 (mod N), so
    Frobenius acts on E0[N] as the scalar a; all N+1 N-isogenies from E0 are
    F_p-rational, N - chi_{D0}(N) of them descend, and E0[N] lies in
    E0(F_{p^k}) with k = ord_N(a) (a^2 = p mod N, so k is ord_N(p) or twice it).
    (C2, measured cost law) the direct construction (point of order N in
    E0(F_{p^k}), classic Velu with F_p-rational kernel) uses
    Theta(k log2 p + N) instrumented F_{p^k}-multiplications; Galbraith's ~N^2
    is the k ~ N slice, not a uniform cost. (C3, measured cost law) blind
    uniform (a, b) guessing with the twist trick reaches the first certified
    N-floor curve after a geometric number of draws with mean
    p^2 / ((p-1) #S2) ~ p/#S2 ~ p/f, which is ~ q^{1/2} and independent of N
    and k beyond #S2. (C4, heuristic) for random instances a is equidistributed
    in F_N^*, so k is Theta(N) typically and small-k instances are a thin
    subfamily. Claim tier toy. No asymptotic improvement of Problem B is
    claimed; the expected deliverable is a certified toy-scale cost map.

  mechanism: >-
    OBJECT: the pair (E0[N] as an F_N[Frobenius]-module, its field of
    definition F_{p^k}). Because End(E0) has conductor prime to N while Z[pi]
    has conductor divisible by N, (pi - a)/N lies in End(E0) for the integer
    a = t * 2^{-1} mod N; hence pi acts on E0[N] as a scalar and every line in
    E0[N] is Galois-stable. The ONLY obstruction to writing down a kernel point
    is therefore the degree of the field over which E0[N] is defined, which is
    the multiplicative order k of a mod N. Once a kernel generator Q in
    E0(F_{p^k}) is known, Velu's sums over the (N-1)/2 kernel representatives
    are Galois-invariant and land in F_p, giving E1/F_p and an evaluation map
    in O(N) F_{p^k}-operations. Finding Q costs a point of E0(F_{p^k}) times the
    cofactor #E0(F_{p^k})/N^e, i.e. O(k log p) F_{p^k}-operations. So the
    direct cost is O(k log p + N) operations in F_{p^k}, which is
    O((k log p + N) M(k)) F_p-operations: ~N^2 polylog only when k ~ N. The
    blind-guessing baseline never touches E0[N]: each uniform (a, b) lands in a
    fixed F_p-isomorphism class with probability (p-1)/(2p^2), so its cost is
    governed by the number #S2 of floor classes, which is ~f, not by N or k.
    LOSSY-PROJECTION TEST: k discards the instance except one integer, and that
    integer propagates exactly into the cost of the direct method; it is not a
    change of coordinates. OFF-LIMITS AS THE PRIMARY LENS: modular-polynomial
    descent (Phi_N unavailable Sage-free at these N), Kani/MITM representation
    (Galbraith Sec. 7, solves a different problem: known target), sqrt-Velu
    (constant-exponent refinement of the Velu term, deferred).

  novelty_status: unverified
  novelty_note: >-
    The structural fact (Frobenius scalar on E0[N] at the crater, the N-torsion
    field degree governing the direct descent) is plausibly folklore in the
    volcano literature. KN-LIT-ca35e0 (Galbraith 2024, citation_verified read)
    as summarised in this corpus states the direct method as ~N^2 and the
    guessing method as ~q^{1/2}; whether the full text already states the
    k-dependence was NOT VERIFIED in this session (the ePrint is not vendored
    and only the corpus summary was read). KN-LIT-7630 (Galbraith 1999) has a
    vendored PDF that was NOT read in this session. No novelty is claimed.

