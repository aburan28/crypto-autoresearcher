  nearest_existing_record: IDEA-20260829-920b16
  delta_from_nearest: >-
    PROBLEM SOLVED - 920b16 uses a self-pairing on ell^k-torsion to decide WHICH CURVE in a
    class one is standing on, i.e. the addressing problem, and explicitly frames its payoff
    against the T5 reachability gate. This record uses the self-pairing on the PRIME-ORDER
    subgroup against the secret scalar s, which is a different problem, a different torsion
    group and a different pairing argument.
    DIRECTION - 920b16 argues the automorphism supplies a FREE ORIENTATION that the
    self-pairing machinery normally has to be given, i.e. it argues the automorphism helps.
    This record derives that on the prime-order subgroup the automorphism supplies NOTHING,
    because a scalar passes through a bilinear form as an exponent and an alternating form
    stays alternating. The two are consistent - they concern different torsion - and stating
    that they are consistent, rather than letting a later reader see a contradiction, is
    part of the delta.
    SECOND NEAREST, IDEA-20260811-8783a5 - owns the embedding-degree enumeration
    methodology at fixed N. This record does not propose a new method for that and would
    reuse it; what it adds is the argument that the embedding-degree distribution is the
    ONLY remaining pairing-side question for this RQ, plus the matched-generic comparison
    at the same p that 8783a5's fixed-N framing does not perform.
    THIRD NEAREST, the unread H-PAIR lane - a live duplication risk, declared.

