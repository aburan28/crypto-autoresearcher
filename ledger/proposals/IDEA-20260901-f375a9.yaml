  proof_search_map:
    bottleneck: >-
      Whether any bilinear construction available on a single F_p-rational point can be
      made nondegenerate. It is the only step that decides whether the pairing route is
      open for this RQ at all, and everything else in the pairing literature is downstream
      of having two independent arguments, which an ordinary curve does not supply.
    baseline_embedding:
      parameter_slice: >-
        k_emb = 1, i.e. N dividing p - 1. There mu_N is contained in F_p^*, P2's conclusion
        does not apply, the self-pairing may be nondegenerate, and the known state of
        affairs is recovered exactly: the MOV or Frey-Ruck reduction maps the ECDLP into
        F_p^*, which is the classical anomalous-adjacent weak case. The argument must NOT
        exclude this slice, and reproducing it is the proves-too-much check.
      reproduction_check: >-
        FROZEN FIXTURE, BLOCKING AND IT IS THE POSITIVE CONTROL. Construct a toy ordinary
        curve with k_emb = 1 - choose p and N with N dividing p - 1 - and require the
        implementation to return a NONTRIVIAL t_N(P, P) and to recover s^2 modulo N from
        t_N(Q, Q) = t_N(P, P)^{s^2}, then s up to sign, verified by s P = Q. If the
        instrument cannot exhibit a nontrivial self-pairing where one provably can exist,
        its triviality reports everywhere else carry no information whatever and the run is
        void. THIS IS THE SINGLE MOST IMPORTANT CONTROL IN THE RECORD.
    observation_collision:
      observable: >-
        The triple Theta(E) = (k_emb, t_N(P, P), e_N(P, alpha P)).
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, WHICH IS THE RESULT AND NOT A FALSIFIER. A j = 0
        curve, a j = 1728 curve and a generic curve at the same p with the same k_emb are
        three distinct ground-truth objects with the SAME observable (k_emb, 1, 1). That
        collision establishes that the self-pairing observable cannot distinguish special j
        from generic j, and therefore that no pairing-based argument in this lane may lean
        on "the automorphism gives an extra pairing". Reporting a pairing-based special-j
        claim without exhibiting this collision is prohibited.
        A SECOND, DANGEROUS COLLISION TO HUNT: a curve with a genuinely trivial pairing and
        a curve whose pairing the IMPLEMENTATION merely failed to compute both report 1. The
        separating datum is the k_emb = 1 positive control plus an explicit
        computed-or-not-computed flag per curve, which is a required metric.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable "the self-pairing is trivial" fixed and vary the forgotten
          structure - j, D_0, |Aut|, the class group. The intrinsic invariant distinguishing
          the objects on which the conclusion changes is NONE OF THEM; it is k_emb, an
          invariant of (p, N) alone. That is the record's answer to the RQ on this axis and
          it is obtained by the fibre argument rather than by measurement.
        predicted_gain: >-
          Relocates the question from the curve to the pair (p, N), which is a
          curve-generation statistic. A prohibition rather than a speedup: it forbids every
          downstream argument in this lane that leans on special-j pairing structure.
      - transform: representation_reduction
        proposed_object: >-
          Move the ECDLP into mu_N contained in F_{p^{k_emb}}^* via the self-pairing, where
          the hypothesis becomes an exact exponent relation s^2. Encoding exact;
          completeness holds only when the self-pairing is nondegenerate; soundness holds
          up to the sign ambiguity, resolved by one scalar multiplication.
        predicted_gain: >-
          ZERO for k_emb > 1, because the completeness obligation fails by P2 - and
          identifying exactly which obligation fails is the deliverable. For k_emb = 1 the
          gain is real but is already held by MOV and Frey-Ruck, so the transform adds
          nothing there either.
    quantifier_order: >-
      CLAIMED IN THIS ORDER FOR P2. FOR ALL primes p > 3, FOR ALL ordinary E/F_p, FOR ALL
      primes N dividing #E with cyclic F_p-rational N-torsion and embedding degree
      k_emb > 1, FOR ALL P in E(F_p) of order N: t_N(P, P) = 1. The universal quantifier
      over P comes last and is the content.
      THE WEAKER READING EXPLICITLY NOT CLAIMED - "for every curve there EXISTS a P with
      trivial self-pairing", which is vacuous since P = O works.
      THE STRONGER READING EXPLICITLY NOT CLAIMED - anything about pairings whose arguments
      lie in E(F_{p^{k_emb}}) but not in E(F_p), where the second eigenspace supplies a
      genuinely independent point and the classical MOV reduction applies with all its known
      cost; that is a different construction with a different cost and it is not this one.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On every ordinary prime-field curve with embedding degree above 1, the reduced Tate
        self-pairing and the automorphism Weil pairing on the prime-order subgroup are
        identically trivial, so no pairing construction on a single rational point yields
        any information about the secret; and, over the enumerated classes at the tested
        primes, the embedding-degree distribution of special-j classes does or does not
        differ from matched generic classes." IT CAN NEVER CERTIFY - anything about
        constructions using points outside E(F_p), anything about supersingular curves,
        where distortion maps DO exist and the whole argument changes, anything about
        cryptographic-scale embedding-degree statistics beyond what is enumerated, and
        nothing about the hardness of the ECDLP.
      nearby_object_control: >-
        THE OBJECT WHERE THE HOPED-FOR CONCLUSION FAILS AND ON WHICH THE METHOD MUST
        VISIBLY BEHAVE DIFFERENTLY: the SUPERSINGULAR curve, where End is non-commutative,
        distortion maps exist, and the modified self-pairing IS nondegenerate. A method that
        reports triviality there is not measuring pairings at all. Supersingular curves are
        outside RQ-JINV-8fc13a's declared scope, so this control requires an explicit
        Coordinator scope decision exactly as IDEA-20260829-a250ee's Arm S does; if refused,
        the k_emb = 1 ordinary positive control carries the instrument-validation load alone
        and the record must say so rather than reporting an unfalsifiable constant.
    proof_obligations:
      - claim: 'The Weil pairing is alternating, so e_N(P, P) = 1.'
        responsibility: correctness
      - claim: 'alpha acts as a scalar on G, so e_N(P, alpha P) = e_N(P, P)^lambda = 1.'
        responsibility: correctness
      - claim: >-
          Galois equivariance forces t_N(P, P) into mu_N intersect F_p^*, trivial unless
          k_emb = 1.
        responsibility: strictness
      - claim: 't_N(Q, Q) = t_N(P, P)^{s^2} by bilinearity, so a nondegenerate self-pairing solves the instance.'
        responsibility: correctness
      - claim: 'The k_emb = 1 positive control returns a nontrivial self-pairing and recovers s.'
        responsibility: feasibility
      - claim: >-
          The embedding-degree distribution comparison is made at matched p and over
          complete class enumerations, not samples.
        responsibility: baseline
      - claim: >-
          The record claims nothing about points outside E(F_p) and nothing about
          supersingular curves.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        t_N(P, P) over every enumerated ordinary class with k_emb > 1 at the tested primes,
        computed where the extension-field arithmetic is affordable
      direction: different
      minimum_effect: >-
        Exactly 1 on every curve, with ZERO exceptions. A single nontrivial value falsifies
        P2, contradicts Galois equivariance, and simultaneously constitutes an ECDLP break
        on that curve; it first indicts the implementation and requires independent review
        before any description.
    - metric: >-
        e_N(P, alpha P) on every j = 0 and j = 1728 class
      direction: different
      minimum_effect: >-
        Exactly 1, on every curve. This is the pairing-side statement of the sqrt(|Aut|)
        null and its confirmation is what licenses the lane to stop looking here.
    - metric: >-
        t_N(P, P) on the k_emb = 1 positive control, and recovery of s from
        t_N(Q, Q) = t_N(P, P)^{s^2}
      direction: different
      minimum_effect: >-
        NONTRIVIAL on at least one control curve, and s recovered and certified by s P = Q
        on at least one instance. BLOCKING. If the instrument returns 1 here it cannot
        detect a nondegenerate self-pairing at all and every triviality report elsewhere is
        void.
    - metric: >-
        empirical distribution of k_emb over special-j classes versus matched generic
        classes at the same p, over the complete class enumeration at each tested prime
      direction: different
      minimum_effect: >-
        NO DIFFERENCE, under an exact permutation test over class labels; the pre-registered
        expectation is that k_emb depends on (p, N) and not on j. A shift toward small
        k_emb on the special-j arm is H-embedding and triggers GOAL-ENDO-001 pause
        condition P3.
    - metric: >-
        count of enumerated special-j classes with k_emb below a declared bound B_emb,
        against the count for matched generic classes
      direction: different
      minimum_effect: >-
        Equal within the Poisson interval. The predicted SHAPE is equality, not a trend:
        this is a count comparison and it is stated in advance so that a difference cannot
        be discovered by choosing B_emb after the fact. B_emb is declared in Stage 0 and the
        analysis is repeated at three declared values as a robustness sweep.
    - metric: >-
        fraction of enumerated classes on which the pairing was actually COMPUTED rather
        than derived
      direction: higher
      minimum_effect: >-
        Reported explicitly per prime. A triviality claim on a class whose pairing was never
        evaluated is a derivation and must be labelled as one; conflating the two would let
        an implementation failure masquerade as a mathematical null, which is the single
        most likely way this record could be worthless while looking clean.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, and it is the bulk of the deliverable): write out P1, P2 and C
      with the Galois-equivariance step explicit; declare B_emb and the prime range; state
      the collapse - that the pairing question for this RQ reduces to an embedding-degree
      distribution question - so that a reviewer can reject the whole line on the algebra
      before any machine time is spent.
      STAGE 1 (positive control, BLOCKING): construct a toy ordinary curve with k_emb = 1,
      evaluate t_N(P, P), require it nontrivial, and recover s from
      t_N(Q, Q) = t_N(P, P)^{s^2}, certified by s P = Q with an independent verifier.
      STAGE 2 (the triviality arm): over the complete ordinary class enumeration at three
      toy primes, compute k_emb for every class; evaluate t_N(P, P) and e_N(P, alpha P) on
      every class whose k_emb is small enough for the extension arithmetic to be affordable;
      report the computed-or-derived flag per class.
      STAGE 3 (the distribution arm): compare the k_emb distributions of special-j and
      matched generic classes at the same p by an exact permutation test over class labels,
      at three declared B_emb values, reporting per class and never per curve since k_emb is
      a class invariant.
    controls:
      - >-
        k_emb = 1 POSITIVE CONTROL, BLOCKING - without a demonstrated nontrivial
        self-pairing somewhere, "the self-pairing is trivial" is an unfalsifiable constant
        and the record has measured nothing.
      - >-
        MATCHED GENERIC NULL OBJECT - generic-D_0 classes at the SAME p through the
        identical code path, for both the triviality arm and the distribution arm. This is
        the null object of the same shape RQ-JINV-8fc13a's constraints require.
      - >-
        SQRT(|Aut|) BASELINE AS THE NULL HYPOTHESIS - the prediction e_N(P, alpha P) = 1 IS
        the statement that the automorphism, which is the entire content of the null,
        contributes nothing on this axis. Reporting it as a finding rather than as the null
        would be exactly the error RQ-JINV-8fc13a's decision_target warns against, and the
        record labels it as the null in advance.
      - >-
        DECAY PARAMETER - k_emb itself, swept over 1, 2, 3, 4 where classes exist. The
        predicted shape is a STEP: nontrivial at k_emb = 1 and identically trivial at every
        k_emb above 1. A quantity that instead decays smoothly with k_emb is measuring
        numerical precision or a wrong final exponentiation, not the pairing.
      - >-
        FINAL-EXPONENTIATION CONTROL - the unreduced Tate pairing before the final
        exponentiation by (p^{k_emb} - 1)/N is generally nontrivial while the reduced one is
        not; an implementation that omits or misplaces the final exponentiation will report
        spurious nontrivial values and would manufacture an apparent ECDLP break. This is
        the dominant implementation risk and it is controlled by requiring the reduced value
        to be checked as an N-th root of unity before it is reported.
      - >-
        CERTIFICATE CONTROL - any recovered s re-verified as s P = Q by code sharing no state
        with the producer, per RQ-JINV-8fc13a's constraints and
        docs/claims-and-verification.md.
    required_metrics:
      - per class - p, t, N, cofactor, D_0, f, j, |Aut|, k_emb, class size
      - t_N(P, P) and e_N(P, alpha P) per class, with a computed-or-derived flag
      - the order of each reported pairing value in mu_N, required to be 1 or N
      - the k_emb = 1 control's pairing value, recovered s, and certificate result
      - the k_emb distributions per arm with the exact permutation test at three B_emb
      - the count of classes excluded for full rational N-torsion, with reasons

  falsification_conditions:
    - >-
      F1 (ZERO COMPUTE, PRIMARY). A counterexample to P2 on paper - a Galois-equivariance
      or alternating-property misapplication. The derivations are one line each, so a
      counterexample means the argument is being misapplied and the record is withdrawn by
      a superseding proposal.
    - >-
      F2 (THE CONSEQUENTIAL FALSIFIER). A measured nontrivial reduced t_N(P, P) on an
      ordinary curve with k_emb > 1, surviving the final-exponentiation control. That
      refutes P2 AND constitutes an ECDLP break on that curve. Work STOPS; GOAL-ENDO-001
      pause condition P3 fires; the finding goes to an independent review-adversarial
      session and, before any record calls it a break, to review-breakthrough at max effort
      per AGENTS.md rule 12. The prior probability is very low and the check is very cheap,
      which is the entire argument for running it.
    - >-
      F3. The k_emb = 1 positive control returns a trivial self-pairing. Instrument failure;
      every triviality report is void and the run returns to the executor as a defect, never
      as support for the null.
    - >-
      F4 (THE OTHER INTERESTING OUTCOME). The special-j k_emb distribution is shifted toward
      small values relative to matched generic classes at the same p, surviving the
      permutation test at all three B_emb values. That is a weak-instance-density finding on
      the data axis; pause condition P3 fires before any description, and the first
      hypothesis to test is that the enumeration is not matched on p or on N's divisor
      structure.
    - >-
      F5 (THE MAIN NEGATIVE AND THE INTENDED DELIVERABLE). Both pairings identically trivial
      at every k_emb > 1, the positive control firing, and the k_emb distributions
      indistinguishable. Then the pairing route is CLOSED for RQ-JINV-8fc13a with a named
      obstruction - Galois equivariance forces the self-pairing into mu_N intersect F_p^*,
      which is trivial above embedding degree 1 - and with forward guidance naming what
      remains open, or the record has not finished (docs/inventor-protocol.md section 4).
    - >-
      NOT A FALSIFICATION - the extension-field arithmetic exceeding budget on large-k_emb
      classes. That is an infrastructure outcome under AGENTS.md rule 5; those classes are
      reported as DERIVED rather than measured and the computed fraction is a required
      metric precisely so this cannot be hidden.

  confounders:
    - >-
      THE FINAL EXPONENTIATION IS THE DOMINANT IMPLEMENTATION RISK. The unreduced Tate
      pairing is generally nontrivial; only the reduced value is forced to 1. An
      implementation that omits, misplaces or mis-parametrises the exponentiation by
      (p^{k_emb} - 1)/N would report an apparent ECDLP break. The control requiring every
      reported value to be verified as an N-th root of unity targets exactly this.
    - >-
      LARGE k_emb MAKES THE PAIRING UNCOMPUTABLE, so the triviality arm is measured only on
      small-k_emb classes and DERIVED elsewhere. Presenting the derived cells as measured
      would let an implementation failure look like a mathematical null; the
      computed-or-derived flag is a required metric for this reason.
    - >-
      FULL RATIONAL N-TORSION BREAKS THE CYCLICITY ASSUMPTION and can occur at toy scale
      where N is small relative to p. Such classes are excluded, counted and reported rather
      than silently dropped.
    - >-
      k_emb IS A CLASS INVARIANT, being ord_N(p) with N a class invariant, so the unit of
      analysis for the distribution arm is the CLASS. Pooling over the roughly 2 sqrt(p)
      curves of a class would inflate every sample size by the class size and manufacture
      significance from nothing.
    - >-
      SPECIAL-j CLASSES ARE ONE PER PRIME, so the distribution arm is n = 1 per prime and
      its power comes only from sweeping p. This is the same structural limitation
      IDEA-20260901-054dd4 addresses in general, and that record's cell design should be used
      here rather than reinvented.
    - >-
      THE FOLKLORE ASSOCIATION OF j = 0 WITH PAIRING-FRIENDLINESS IS A SELECTION EFFECT and
      is the most likely source of a spurious expectation: Barreto-Naehrig and BLS12 families
      are CONSTRUCTED at D_0 = -3 because the CM equation is easy to parametrise there. A
      measurement over randomly enumerated classes is not a measurement over that
      construction, and the record must not be read as saying anything about deployed
      pairing-friendly curves, which are selected for small k_emb by design.

  interpretation_limits:
    - >-
      claim_tier toy, per RQ-JINV-8fc13a. P1, P2 and C are DERIVATIONS under
      docs/claims-and-verification.md; the enumeration verifies the implementation over a
      finite range, not the derivations.
    - >-
      NO EXPONENT AND NO ATTACK. On a fixed ordinary curve with k_emb > 1 this record's
      sota_delta is exactly zero on every axis, which is the expected answer. Its honest
      ceiling is not even a constant - it is a SCOPE STATEMENT, and it is worth a test
      because the scope statement removes an entire route from the lane's open list at
      essentially zero cost, and because its one low-probability positive outcome, a
      nondegenerate self-pairing, would be a complete break and is therefore worth ten
      minutes of measurement.
    - >-
      NOTHING HERE APPLIES TO SUPERSINGULAR CURVES, where distortion maps exist and the
      modified self-pairing is nondegenerate - that is the nearby object on which the
      conclusion fails, it is outside this RQ's scope, and using it as a control requires an
      explicit Coordinator scope decision.
    - >-
      NOTHING HERE APPLIES TO PAIRINGS WITH ARGUMENTS OUTSIDE E(F_p). The classical MOV and
      Frey-Ruck reductions use a second, non-rational point and are untouched; their cost is
      subexponential in p^{k_emb} and is the known baseline for small-embedding-degree
      curves.
    - >-
      NOTHING HERE BEARS ON IDEA-20260829-920b16 OR IDEA-20260811-85cfe9, which use
      self-pairings on other torsion for the addressing and vectorization problems. Those
      records are untouched and this one does not contradict them.
    - >-
      THE NOVELTY SCREEN IS INCOMPLETE. This program has an unread pairing lane
      (H-PAIR-713241, H-PAIR-27e16a, EXP-PAIR-b19f80, EXP-PAIR-7bfe2b) and duplication with
      it is a live possibility. A reviewer must open those records first.
    - >-
      Timeouts, crashes and infrastructure failures are never negative mathematical evidence
      (AGENTS.md rule 5).

  heuristic_assumptions:
    - id: H1
      statement: >-
        EMBEDDING-DEGREE INDEPENDENCE OF j. For ordinary isogeny classes enumerated at a
        fixed prime p, the embedding degree k_emb = ord_N(p) is distributed as the
        multiplicative order of a fixed element in the cyclic group (Z/N)^*, independently of
        the fundamental discriminant D_0 and hence of j; formally, for every bound B,
        Pr[ k_emb <= B | D_0 = -3 ] = Pr[ k_emb <= B ] + o(1), the unconditional probability
        being at most B^2 / (2 N) by the count of elements of small order.
      rigorous_support: >-
        RIGOROUS PART - k_emb depends only on (p, N) and not on the curve equation at all, so
        any j-dependence must come through the joint distribution of (p, N) across classes,
        not through j directly; and the count of elements of order at most B in a cyclic group
        of order N - 1 is at most B^2/2, which is the unconditional bound. What is heuristic is
        only that conditioning on D_0 = -3 does not bias the joint distribution of (p, N) - and
        it plainly biases it somewhat, since N is then constrained to
        4N = (t-2)^2 + 3 f^2 (see IDEA-20260901-c4730d).
        DISTRIBUTION IMITATED - the standard heuristic that ord_N(p) behaves like the order of
        a random element of (Z/N)^*, the same move used for eigenvalue orders in
        IDEA-20260901-6b63a4 H1 and for smoothness elsewhere.
        WHY IT COULD FAIL, STATED HONESTLY - k_emb small requires N to divide p^k - 1 for small
        k, i.e. N to divide a specific small integer built from p, and the CM constraint on N
        at D_0 = -3 restricts N to a thin set. Whether the two constraints interact is exactly
        what the distribution arm measures, and asserting they do not would be assuming the
        answer.
      validation_plan: >-
        WHAT TO SAMPLE - the COMPLETE ordinary class enumeration at every prime in a declared
        range, with k_emb computed exactly for every class, so the reported distribution is a
        census and not an estimate. AT WHAT SCALE - p up to about 2^24 for the census, and a
        curve-free (p, t) sweep to about 2^40 for the distribution alone, since k_emb depends
        only on (p, N); the transfer assumption is that the curve-free sweep is the same
        population up to the Hurwitz weighting, and it is declared rather than assumed.
        AGAINST WHICH PREDICTED DISTRIBUTION - the empirical CDF of log k_emb / log N against
        the distribution of the order of a uniform element of (Z/N)^*, computed from the
        factorisation of N - 1 rather than approximated, with the special-j and matched generic
        arms overlaid.
        TAIL CONSISTENCY CHECKS - the smallest observed k_emb in each arm, the count of classes
        with k_emb <= B_emb per arm, and the largest prime divisor of N - 1 that divides no
        observed k_emb. The small-k_emb tail is where the whole question lives, so the tail is
        reported in full rather than summarised.
        SAMPLED PARAMETERS RECORDED - the prime range, every (p, t, N, D_0, f, j, |Aut|,
        k_emb), and the factorisation of N - 1 per class.
      falsification_condition: >-
        A count of special-j classes with k_emb <= B_emb exceeding the matched generic count by
        more than 3 Poisson standard deviations, at any of the three declared B_emb, over the
        complete enumeration. H1 is refuted, H-embedding is live, and pause condition P3 fires.
    - id: H2
      statement: >-
        PAIRING-IMPLEMENTATION ADEQUACY. The implemented reduced Tate pairing returns, for
        every input, an element whose order in F_{p^{k_emb}}^* divides N, and it returns a
        primitive N-th root of unity on at least one input pair for which nondegeneracy is
        provable, namely the k_emb = 1 control.
      rigorous_support: >-
        RIGOROUS PART - the reduced pairing's image lies in mu_N by construction, so the order
        check is a necessary condition that a correct implementation passes automatically and
        a mis-exponentiated one fails. DISTRIBUTION IMITATED - none; this is an
        implementation-adequacy assumption of the same kind as a regression fixture, stated
        separately so that an implementation objection cannot be confused with an objection to
        P2.
      validation_plan: >-
        WHAT TO SAMPLE - every evaluated pairing, with its order in mu_N recorded. AGAINST
        WHICH PREDICTION - order dividing N on 100 percent of evaluations, and order exactly N
        on the k_emb = 1 control. TAIL CHECK - any evaluation whose order does not divide N is
        reported individually and halts the arm. TRANSFER - none; this is a statement about the
        code at the tested parameters.
      falsification_condition: >-
        Any evaluated value whose order does not divide N, or a trivial value on the k_emb = 1
        control. H2 is refuted, the triviality arm is void, and the run returns to the executor.

  target_complexity:
    time_exponent: >-
      1/2, UNCHANGED, and no algorithm is proposed for the k_emb > 1 case because P2 shows
      there is nothing to compute. For the k_emb = 1 case the construction described in C
      costs one pairing evaluation plus one discrete logarithm in F_p^*, i.e.
      L_p[1/3, 1.923] with the number-field-sieve constant, which is exactly the cost of the
      classical MOV or Frey-Ruck reduction that already applies there - so the self-pairing
      route matches the known baseline in its only live case and beats nothing. The exponent
      relevant to this RQ therefore does not move, and the honest ceiling of this record is a
      SCOPE STATEMENT rather than a constant.
    memory_exponent: >-
      O(1) for the pairing evaluations; the finite-field discrete logarithm in the k_emb = 1
      case inherits the sieve's own memory, which is not improved here and is not analysed.
      The measurement stores one triple per class.
    best_known: >-
      For k_emb > 1 on ordinary prime-field curves - parallel Pollard rho at 0.886*sqrt(N)
      with O(1) memory (KN-TECH-001, KN-TECH-006), automorphism-discounted at the special-j
      vertex to 1.2533*sqrt(N/|Aut|) (KN-TECH-018). For small k_emb - the MOV and Frey-Ruck
      reductions to a finite-field discrete logarithm at L_{p^{k_emb}}[1/3], which dominate rho
      whenever k_emb is small enough. Nothing here improves either.
    hidden_overhead: >-
      Disclosed in three places. (a) The k_emb = 1 route's cost is dominated by the finite-field
      discrete logarithm, whose L[1/3] constant hides substantial polynomial factors that this
      record does not analyse and does not claim to improve. (b) The triviality arm computes
      the pairing only where the extension arithmetic is affordable and DERIVES it elsewhere;
      the computed fraction is a required metric so that the derived cells cannot be presented
      as measured. (c) No o(1) is claimed anywhere in the derivations, which are exact.
    tradeoff_note: >-
      No time-memory tradeoff arises for this record's content. The tradeoff that does exist is
      EVIDENTIAL: the triviality arm is cheap and exhaustive at small k_emb and unmeasurable at
      large k_emb, so its coverage is inversely related to the regime where cryptographic
      curves actually live - and that inversion is stated rather than smoothed over, because it
      means the strongest part of the record is the derivation and not the data.

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES. TIME - parallel rho at
    0.886*sqrt(N) dominates on every ordinary curve with k_emb > 1, where this record proposes
    nothing that runs. MEMORY - rho at O(1) dominates. SMALL-EMBEDDING-DEGREE ROW - the MOV and
    Frey-Ruck reductions at L_{p^{k_emb}}[1/3] dominate whenever they apply, and the
    self-pairing construction of C MATCHES rather than beats them in its only live case, so
    they are the tight dominators there. CM-SPECIFIC - automorphism-discounted rho at
    1.2533*sqrt(N/|Aut|) (KN-TECH-018) dominates on j = 0 and j = 1728. MEMORY-RICH - BSGS at
    sqrt(N)/sqrt(N) and van Oorschot-Wiener at sqrt(N^3/w) dominate on their axes.
    MULTI-TARGET - Kuhn-Struik at sqrt(LN) dominates in its regime. DATA/QUERIES - no queries
    are consumed and none is claimed. GENERIC LOWER BOUND - Shoup's Omega(sqrt(N)) is not
    competed with. Every row dominates, so `null` is not available and is not written; the
    tight dominators are rho for k_emb > 1 and Frey-Ruck for k_emb = 1.
  sota_delta:
    time_exponent: '0 (no change)'
    memory_exponent: '0 (no change)'
    data_or_query_exponent: >-
      0 on a fixed instance; the only axis in play is the density of small-embedding-degree
      instances in a special-j generation population, which is measured and not yet a number
    note: >-
      ZERO on every cost axis, which is the expected answer and is not inflated. The delta is a
      scope statement and it is countable. (i) The pairing route is removed from
      RQ-JINV-8fc13a's open list by a two-line Galois-equivariance argument, at zero compute,
      with the removal conditional on nothing. (ii) The reason is identified precisely: not
      that pairings are weak here but that they are TOO STRONG - a nondegenerate self-pairing
      would recover the secret outright, so its triviality is forced rather than accidental.
      (iii) The residual live question is relocated to the embedding-degree distribution, where
      IDEA-20260811-8783a5 already owns the enumeration method and only the special-versus-
      matched-generic comparison at fixed p is missing. (iv) The folklore association of j = 0
      with pairing-friendliness is attributed, with a stated mechanism, to construction
      selection rather than to any property of randomly drawn curves - a correction the lane
      needs before any embedding-degree number is interpreted.

  estimated_cost:
    implementation: medium
    compute: low
  compute_budget_note: >-
    Stage 0 needs no machine and is the bulk of the deliverable. Stage 1's k_emb = 1 control is
    seconds, since the pairing lives in F_p. Stage 2 is affordable only for small k_emb and its
    coverage is reported rather than assumed. Stage 3 needs no curve construction and no pairing
    at all - k_emb = ord_N(p) is one modular order computation per class - so the distribution
    arm can sweep far more primes than the triviality arm, which is why the two arms have
    different declared ranges.
  recommended_priority: medium

  relation_to_existing_records:
    distinct_from: >-
      IDEA-20260829-920b16 and IDEA-20260811-85cfe9, which use self-pairings on other torsion
      for the addressing and vectorization problems. Different problem, different torsion, no
      contradiction, and the consistency is stated explicitly.
    reuses_a_method_from: >-
      IDEA-20260811-8783a5, whose embedding-degree enumeration at fixed N is the natural
      implementation of the distribution arm; this record adds the matched-generic comparison
      at fixed p and the argument that this distribution is the whole remaining question.
    should_use_the_design_of: >-
      IDEA-20260901-054dd4, since the special-j arm here is again n = 1 per prime and inherits
      exactly the single-cell limitation that record exists to fix.
    unread_duplication_risk: >-
      H-PAIR-713241, H-PAIR-27e16a, EXP-PAIR-b19f80, EXP-PAIR-7bfe2b - located by grep, NOT
      opened this session. A reviewer must open them before this record's novelty label is
      accepted.

