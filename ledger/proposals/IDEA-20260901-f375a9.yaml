  title: >-
    THE SELF-PAIRING WOULD SOLVE THE INSTANCE OUTRIGHT, WHICH IS EXACTLY WHY IT IS TRIVIAL.
    Bilinearity gives t_N(Q, Q) = t_N(P, P)^{s^2} for Q = sP, so a nondegenerate computable
    self-pairing recovers s up to sign in one pairing plus one finite-field discrete log -
    and Galois equivariance forces t_N(P, P) into mu_N intersect F_p^*, which is trivial
    for every embedding degree above 1, on EVERY ordinary curve. The automorphism adds
    nothing either, since e_N(P, alpha P) = e_N(P, P)^lambda = 1. So the special-j pairing
    question is not a pairing question at all: it collapses entirely to the embedding-degree
    distribution, which is a curve-GENERATION statistic. Test both halves - the identity by
    exhaustive measurement, the distribution against a matched generic null at the same p.

  object: >-
    TRACKED OBJECT - THE SELF-PAIRING TRIPLE
    Theta(E) = ( k_emb(E), t_N(P, P), e_N(P, alpha P) ),
    where k_emb = ord_N(p) is the embedding degree, t_N is the reduced Tate pairing on the
    prime-order subgroup, e_N is the Weil pairing, P is a generator and alpha is the
    generating automorphism where one exists. What is retained per curve is one small
    integer and two roots of unity - almost always the pair (1, 1). The curve equation,
    the points, the endomorphism ring, the class group and every coordinate are discarded.
    ESTABLISHED FAMILIES DECLARED OFF-LIMITS AS THE PRIMARY LENS, per
    docs/inventor-protocol.md section 1, for a heavily mined target: the automorphism-order
    function and the sqrt(|Aut|) discount (KN-TECH-018, H-JINV-db2776); Semaev support and
    degeneration screens (H-JINV-0e8819); the Cl(O)-orbit crater cardinality
    (IDEA-20260826-d61c49); the relation-collection battery (H-JINV-5a0b9e); the
    orbit-label morphism (IDEA-20260811-332ce9); the eigenvalue order spectrum
    (IDEA-20260901-6b63a4, this batch); and volcano DEPTH (RQ-VOLC-f6253b, concurrent).
    CANDIDATES ENUMERATED AND SCORED on (genuinely new here / one-step propagation
    definable and measurable / survival depth):
    (a) the embedding degree alone - IDEA-20260811-8783a5's object by its title; already
        owned, and on its own it cannot say WHY it is the operative variable;
    (b) the pairing value t_N(P, R) for a second independent point R - the classical MOV
        and Frey-Ruck object, known, and unavailable here because an ordinary curve's
        F_p-rational N-torsion is cyclic so no second independent rational point exists;
    (c) the automorphism self-pairing trace e_{ell^k}(P, alpha P) on TORSION ABOVE the
        prime-order subgroup - IDEA-20260829-920b16's object, used there for the within-class
        ADDRESS problem and not for the secret; adjacent and explicitly not this;
    (d) the SELF-PAIRING TRIPLE Theta - new in this corpus as an ECDLP-side object as far as
        this session could check; its one-step propagation is exact bilinearity, so
        Theta(E, sP) is determined by Theta(E, P) and s through the square map, which is
        precisely what makes it either fatal or trivial and nothing in between; it survives
        exactly as far as Galois equivariance permits, which is one step, and dies there -
        and that death IS the finding;
    (e) the full Tate pairing as a bilinear form on E(F_{p^k}) - carries strictly more,
        needs extension-field arithmetic, and its restriction to the object of interest is
        (d).
    (d) is adopted. KN-OPEN-019 applies: sketch, not taxonomy.

  lossy_projection_test: >-
    Theta discards the curve, the points and the ring, keeping one small integer and two
    roots of unity. The fibres are enormous - almost every ordinary curve over almost every
    p maps to the same value (k_emb large, both pairings 1) - so it is maximally lossy and
    is certainly not a change of coordinates.
    COMPATIBILITY WITH THE OPERATION THE RECORD USES IT UNDER. The operation is scalar
    multiplication on the prime-order subgroup, and under it the retained part propagates
    DETERMINISTICALLY and exactly, by bilinearity:
        t_N(sP, sP) = t_N(P, P)^{s^2}   and   e_N(sP, alpha(sP)) = e_N(P, alpha P)^{s^2}.
    That is an unusually strong propagation rule - the projection is equivariant for the
    very action the ECDLP hides - and it is why the object is worth naming. It is NOT
    compatible with isogeny to another curve, since N-torsion and embedding degree change,
    and the record never uses it across an isogeny.
    THE TEST'S SHARP EDGE, STATED RATHER THAN HIDDEN. A projection this equivariant is
    suspicious in exactly the way section 2 warns about: if it retained a nontrivial value
    it would recover s, so it would not be lossy in any useful sense - it would be the
    secret in disguise. The record's claim is that the projection is lossy precisely
    because the retained value is forced to be trivial, and identifying the forcing
    mechanism, Galois equivariance, is the deliverable.

  claim: >-
    Four statements. P1 and P2 are derivations, C is the collapse they force, and M is the
    measurement.

    (P1) THE AUTOMORPHISM SUPPLIES NO DISTORTION. Let E/F_p be ordinary, p > 3, G the
    subgroup of prime order N, alpha an automorphism of E acting on G as the scalar lambda
    (H-ENDO-001). The Weil pairing is alternating, so e_N(P, P) = 1 for every P, and
    therefore
        e_N(P, alpha P) = e_N(P, P)^lambda = 1
    identically. The extra automorphism at j = 0 and j = 1728, which is the entire content
    of the sqrt(|Aut|) null, contributes NOTHING to any Weil-pairing construction on G.
    This is the pairing-side statement of the same fact that ordinary curves admit no
    distortion maps, and it is reproduced here in one line so a reviewer can check it
    without a library.

    (P2) THE SELF-PAIRING IS TRIVIAL WHENEVER THE EMBEDDING DEGREE EXCEEDS 1, ON EVERY
    ORDINARY CURVE. Let k_emb = ord_N(p) be the embedding degree and let t_N denote the
    reduced Tate pairing on E(F_{p^{k_emb}})[N], with values in mu_N contained in
    F_{p^{k_emb}}^*. The reduced pairing is Galois equivariant: for sigma the p-power
    Frobenius of F_{p^{k_emb}} over F_p,
        t_N(sigma A, sigma B) = sigma( t_N(A, B) ).
    Take A = B = P with P in E(F_p), so sigma P = P. Then t_N(P, P) = sigma(t_N(P, P)),
    hence t_N(P, P) lies in F_p^*. But it also lies in mu_N, and
        mu_N intersect F_p^* is trivial unless N divides p - 1, i.e. unless k_emb = 1.
    THEREFORE t_N(P, P) = 1 for every F_p-rational P of order N on every ordinary curve
    with k_emb > 1 - and the argument uses only that P is F_p-rational. It is completely
    insensitive to j, to D_0, to |Aut| and to the class group.

    (C) THE COLLAPSE. By bilinearity, for Q = sP,
        t_N(Q, Q) = t_N(P, P)^{s^2}.
    So IF t_N(P, P) were a primitive N-th root of unity and computable, then one pairing
    evaluation on each of P and Q, followed by one discrete logarithm in the cyclic group
    mu_N contained in F_{p^{k_emb}}^*, recovers s^2 modulo N, hence s up to sign, and the
    sign is settled by one scalar multiplication. THE SELF-PAIRING IS NOT A SOURCE OF
    PARTIAL INFORMATION - IT IS EITHER THE WHOLE SECRET OR NOTHING. Combining with P2, the
    "nothing" branch is forced for every k_emb > 1, and the "whole secret" branch requires
    k_emb = 1, where N divides p - 1 and the ordinary MOV or Frey-Ruck reduction already
    maps the ECDLP into F_p^* directly - so the self-pairing adds nothing even there.
    CONSEQUENTLY the question "does special j confer extra pairing structure beyond the
    sqrt(|Aut|) automorphism discount" is NOT a question about pairings. It is exactly and
    only the question "is the embedding degree distribution of special-j classes different
    from that of matched generic classes at the same p", which is a curve-GENERATION
    statistic about a population, not a property of the j-invariant acting on an instance.

    (M) THE MEASUREMENT AND ITS THREE RIVAL EXPLANATIONS, AT MATCHED p.
      (H-null) Theta(E) = (k_emb large, 1, 1) on every enumerated special-j class exactly
      as on every enumerated generic class, and the empirical distribution of k_emb over
      special-j classes is statistically indistinguishable from that over matched generic
      classes at the same p. The pairing route confers exactly zero beyond sqrt(|Aut|) and
      the folklore association of j = 0 with pairing-friendliness is correctly attributed to
      CONSTRUCTION - the CM equation 4p = t^2 + 3 f^2 is easy to parametrise, so
      pairing-friendly families are BUILT at D_0 = -3 - rather than to any bias in randomly
      drawn curves. This is the pre-registered expectation and the archivable deliverable.
      (H-nondegenerate) A nontrivial t_N(P, P) is measured on a curve with k_emb > 1. That
      refutes P2, contradicts Galois equivariance, and would simultaneously be an ECDLP
      break on that curve. It first indicts the implementation and requires independent
      review before any description; it is the record's cheapest and most consequential
      falsifier.
      (H-embedding) The embedding-degree distribution of special-j classes is shifted
      toward small values relative to matched generic classes at the same p. That is an
      advantage beyond sqrt(|Aut|) on the data axis - a higher density of MOV-vulnerable
      instances in special-j curve generation - and it triggers GOAL-ENDO-001 pause
      condition P3 before any description.

    (WHAT IS NOT CLAIMED) No exponent, no attack, no advantage over the
    automorphism-discounted rho baseline. On a fixed curve with k_emb > 1 this record's
    honest sota_delta is exactly zero on every axis, and the derivations P1, P2 and C are
    DERIVATIONS under docs/claims-and-verification.md, not proved theorems of record. The
    record does not claim priority for the MOV or Frey-Ruck reductions, for Galois
    equivariance of the Tate pairing, or for the nonexistence of distortion maps on
    ordinary curves; all three are recalled classical facts reproduced so they can be
    checked.

  mechanism: >-
    Every pairing-based attack on an elliptic-curve discrete logarithm needs two things:
    a bilinear map that is nondegenerate on the pair of arguments it is given, and a way to
    compute it. Both arguments here are the SAME point, so the first requirement becomes
    self-pairing nondegeneracy, and that is settled by a symmetry argument rather than by
    any property of the curve: the value of a Galois-equivariant pairing on a pair of
    Galois-fixed points is itself Galois-fixed, and the only Galois-fixed N-th root of
    unity is 1 unless the roots of unity are already rational, which is the definition of
    embedding degree 1. The automorphism does not help because it is an endomorphism of the
    curve, so it acts on G as a scalar and a scalar passes through a bilinear form as an
    exponent, leaving an alternating form alternating. What is left is entirely the
    arithmetic question of whether N divides p^k - 1 for small k, which depends on p and N
    and not on the shape of the curve equation - and the reason special j LOOKS
    pairing-relevant is that the CM equation at D_0 = -3 admits convenient polynomial
    parametrisations, which is a fact about how curve designers search, not about how
    curves behave.

