idea:
  id: IDEA-20260802-003
  question_id: RQ-ECDLP-002
  title: >-
    The enumerate-and-join exponent is pinned at 1/2 identically in arity - and the one
    remaining escape, box-constrained small-root solving of the summation polynomial,
    has a MEASURABLE feasibility curve X_max(m, p, t) that decides the lane
  class: algorithm
  claim: >-
    TWO CLAIMS, ONE NEGATIVE AND ONE MEASURED, AND THEY ARE STATED SEPARATELY BECAUSE
    THEY HAVE DIFFERENT EPISTEMIC STATUS.
    CLAIM A - THE OBSTRUCTION, A COUNTING ARGUMENT. For a prime-field factor base F of
    size B and decomposition arity m, a random target has an expected
    B**m / (m! * p) decompositions, so B >= (m! p)**(1/m) is forced for the yield to be
    non-vanishing. Any decomposition procedure that ENUMERATES SUMS OF SUBSETS OF F AND
    JOINS THEM - which includes every balanced meet-in-the-middle claw over the m
    summands, including the degree-split construction of IDEA-20260731-007 - has a
    larger side of size at least B**(m/2) >= p**(1/2). THE EXPONENT IS 1/2 IDENTICALLY
    IN m AND IN THE CHOICE OF F. The degree-split lane's own assembled figure of about
    1/2, recorded at RT047-H3 inside DEC-20260801-003, is therefore not a parameter
    accident but an instance of this identity, and the class is CLOSED at exponent 1/2
    with that mechanism named.
    CLAIM B - THE ESCAPE, AND IT IS A MEASUREMENT. The only escape from Claim A is a
    decomposition oracle whose cost is NOT the enumeration cost - an algebraic solver
    that finds the box-constrained solution without listing the box. IDEA-20260727-003
    establishes that with a FREE decomposition oracle the assembled exponent is
    omega_LA / m, which at the measured-or-assumed omega_LA = 2 gives 0.4 at m = 5 and
    0.333 at m = 6, both strictly below matched rho's 1/2. So the entire prime-field
    exponent question reduces to ONE measurable quantity. Define X_max(m, p, t) as the
    largest box bound X for which a Coppersmith / Jochemsz-May lattice built from
    S_{m+1}(x_1, ..., x_m, x(R)) at shift multiplicity t recovers a PLANTED
    decomposition with every x_i < X. THIS RECORD PREDICTS X_max < p**(1/m) at every
    tested (m, t), with log_p X_max at least 0.15 below 1/m at m = 3 and m = 4, and
    predicts that the binding constraint is the per-variable degree 2**(m-1) of
    S_{m+1} rather than the lattice dimension - operationalized as the prediction that
    X_max on the real summation polynomial agrees to within 0.03 in log_p with X_max on
    a DEGREE-MATCHED RANDOM polynomial carrying the same planted root. FALSIFIED, AND
    THIS IS THE OUTCOME THAT MATTERS, IF X_max >= p**(1/m) AT ANY TESTED m >= 3, which
    would put the decomposition oracle at lattice cost and move the prime-field ECDLP
    time exponent from 1/2 to omega_LA/m; OR IF the real polynomial beats the
    degree-matched random null by more than 0.03 in log_p, which would be elliptic-curve
    content in the small-root problem and the first such signal this program has found.
  mechanism: >-
    Semaev's summation polynomial S_{m+1}(x_1, ..., x_m, x_R) vanishes exactly when
    there exist points P_i with x(P_i) = x_i summing to a point with x-coordinate x_R.
    It is symmetric and of degree 2**(m-1) in each variable (the corpus states this at
    IDEA-20260727-006 and it is consistent with the standard degree 2**(m-2) for S_m).
    Index calculus over F_p needs the solutions with all x_i inside a box I of size
    B = p**(1/m). Gröbner and resultant methods over F_p do not see the box - they solve
    the whole variety and the box is a post-filter, which is why the corpus's cost
    models charge enumeration. LATTICE SMALL-ROOT METHODS ARE THE ONE CLASSICAL FAMILY
    THAT DOES SEE THE BOX - Coppersmith's method finds roots of a polynomial modulo p
    that are smaller than a bound determined by the polynomial's degree, and the
    Jochemsz-May strategy (ASIACRYPT 2006) extends this to the multivariate case
    heuristically. The structural question is a competition of two exponents - the box
    NEEDS to reach p**(1/m), while the lattice CAN reach roughly p**(1/D) where D is a
    degree-derived quantity that for S_{m+1} grows like 2**m. For every m past the
    smallest, 1/D collapses far below 1/m and the method fails; the interesting content
    is the MEASURED GAP and whether it closes anywhere, because the gap's shape as a
    function of (m, t) is the quantitative form of the obstruction and nobody in this
    program has computed it.
    THE PLANT IS WHAT MAKES THE DESIGN CLEAN, AND THIS IS DELIBERATE. Planting the
    decomposition removes the dependence on the YIELD heuristic entirely - the question
    "does a decomposition exist" is answered by construction, so the experiment measures
    only "can the solver find one it is guaranteed exists". That is exactly the
    separation the campaign's five instrument failures argue for, and it is why the
    Weil-certification barrier of IDEA-20260727-006 does not contaminate this
    measurement.
    THREE OUTCOMES, EACH WITH A MEANING FIXED BEFORE THE RUN.
    (a) X_max well below p**(1/m) and matching the degree-matched random null - the
    obstruction is DEGREE, it is quantified as a curve, and the honest closure is that
    lattice small-root solving does not supply the decomposition oracle at any tested
    arity. Forward guidance then names what remains - solvers that exploit the SYMMETRY
    of S_{m+1} to reduce effective degree, factor bases that are not boxes so that the
    small-root bound is not the relevant one, and hybrid enumerate-a-few / solve-the-
    rest splits whose exponent interpolates.
    (b) X_max below p**(1/m) but the REAL polynomial beating the degree-matched null -
    the summation variety has structure the generic degree count does not capture, which
    is a mechanism finding independent of whether the gap closes.
    (c) X_max reaching p**(1/m) at some m - the lane reopens at exponent omega_LA/m and
    the result requires independent review-breakthrough handling before anything else
    happens.
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-02'
    corpus_paths_grepped:
    - ledger/proposals
    - ledger/hypotheses
    - ledger/decisions
    - knowledge/techniques
    grep_results:
    - >-
      'Coppersmith|small root|box-constrained|Jochemsz' returns NO match anywhere in
      ledger/proposals. The summation-polynomial lane in this ledger is exclusively
      Gröbner, resultant and enumeration based.
    - >-
      IDEA-20260727-003 supplies the free-oracle floor F(beta, m) = max(B, c_LA
      B**omega_LA) subject to beta >= 1/m, and states that admissibility needs
      m >= 2 omega_LA. THIS RECORD DEPENDS ON THAT RESULT AND DOES NOT RESTATE IT AS ITS
      OWN. Claim B's exponent arithmetic is that record's, applied to a new oracle
      candidate.
    - >-
      IDEA-20260727-006 supplies the Weil/Lang-Weil certification threshold
      beta_cert(m) = (m+1)/(2m) and the counting heuristic B**m/(m! p). Claim A's
      counting step is that record's counting heuristic; the MEET-IN-THE-MIDDLE
      IDENTITY B**(m/2) >= p**(1/2) is stated here as a consequence and is not found
      stated anywhere in the corpus in that form.
    - >-
      IDEA-20260731-007 is the degree-split Semaev claw and is an instance of the class
      Claim A closes; DEC-20260801-003 records its own accounting at about 1/2 and
      EV-DS-003 records the measured advantage as generic meet-in-the-middle with no
      elliptic-curve content, reproduced on Z/753848Z.
    literature_verified:
    - >-
      Jochemsz and May, 'A Strategy for Finding Roots of Multivariate Polynomials with
      New Applications in Attacking RSA Variants', ASIACRYPT 2006 - existence,
      authorship, venue and subject CONFIRMED by web search on 2026-08-02
      (link.springer.com/chapter/10.1007/11935230_18). The multivariate case is
      explicitly described as heuristic in the secondary sources. PRIMARY SOURCE NOT
      READ IN THIS SESSION; the exact bound must be transcribed from it before any
      protocol is frozen and a KN-LIT entry is owed.
    conclusion: >-
      No corpus prior art for applying lattice small-root methods to summation
      polynomials. External prior art is NOT ruled out - this is an obvious enough
      question that the absence of a literature check makes `unverified` the only honest
      status, and a literature deep-read is a precondition of any positive reading.
  assumptions:
  - >-
    Toy primes only, p in {2**24, 2**32, 2**40} region, prime-order subgroups, public
    parameters, no live keys, no discrete logarithm computed.
  - >-
    Summation polynomials S_4 and S_5 are constructible symbolically at these sizes. If
    S_6 construction is infeasible within budget, m = 5 is reported as NOT MEASURED
    rather than extrapolated.
  - >-
    The decomposition is PLANTED, so decomposition existence is not assumed and the
    yield heuristic is not exercised. This is a design property, stated as an assumption
    so that no reader mistakes a positive result for evidence about yield.
  predictions:
  - metric: log_p_X_max_at_m3
    direction: lower
    minimum_effect: >-
      'log_p X_max <= 0.183 at every tested shift multiplicity t, against the required
      1/m = 0.333. A measured value within 0.02 of 0.333 does NOT falsify the record on
      its own but MANDATES an extended t sweep before any reading.'
  - metric: log_p_X_max_at_m4
    direction: lower
    minimum_effect: 'log_p X_max <= 0.10 at every tested t, against the required 0.250.'
  - metric: positive_control_recovery_rate
    direction: same
    minimum_effect: >-
      '>= 0.95 over 100 instances of a LOW-DEGREE planted system whose root bounds sit
      strictly inside the published Jochemsz-May bound. THIS IS THE DEMONSTRATION THAT
      THE PERTURBATION MOVES THE STATISTIC - a plant that the machinery cannot find even
      when it is designed to certifies nothing, which is exactly the failure this
      campaign recorded twice.'
  - metric: real_versus_degree_matched_null_gap
    direction: same
    minimum_effect: >-
      '|log_p X_max(S_{m+1}) - log_p X_max(random degree-matched)| <= 0.03. A gap
      exceeding 0.03 IN FAVOUR OF THE REAL POLYNOMIAL is elliptic-curve content and is
      the interesting positive; a gap in favour of the null is an implementation
      asymmetry and must be explained before anything is read.'
  - metric: X_max_monotone_decay_in_m
    direction: decreasing
    minimum_effect: >-
      'ARTIFACT TELL. log_p X_max strictly decreasing across m in {3, 4} and, if
      reached, m = 5. If X_max does NOT fall as the per-variable degree doubles, the
      lattice is not responding to the polynomial and the harness is void - this is the
      quantity that should decay when the parameter meant to destroy it increases.'
  - metric: spurious_root_rate
    direction: same
    minimum_effect: >-
      '<= 0.05 on a NO-PLANT negative control at every tested X. A method that reports
      small roots when none were planted has a false-positive rate that must be
      subtracted from every positive reading, and it is measured rather than assumed.'
  minimal_test:
    design: >-
      For m in {3, 4} and p in {2**24, 2**32}, and t over a pre-registered ladder -
      (1) construct S_{m+1} symbolically over F_p; (2) plant a decomposition by drawing
      x_1..x_m uniformly below X, lifting to points, and setting R = sum P_i, so
      S_{m+1}(x_1..x_m, x(R)) = 0 holds by construction; (3) build the Jochemsz-May
      shift lattice at multiplicity t, reduce with LLL then BKZ at a fixed block size,
      and attempt root recovery through resultants or a Gröbner basis of the recovered
      short polynomials; (4) bisect on X over at least 10 steps to locate X_max, with
      50 planted instances per (m, p, t) cell and X_max defined as the largest X at
      which >= 25 of 50 instances recover; (5) repeat the entire pipeline on the
      degree-matched random null and on the no-plant negative control; (6) run the
      low-degree positive control first and abort if it does not reach 0.95 recovery.
    controls:
    - >-
      LOW-DEGREE POSITIVE CONTROL, RUN FIRST AND BLOCKING. Planted small roots inside
      the published bound for a system where the method is known to work. If it does not
      recover, nothing else in the experiment is read.
    - >-
      DEGREE-MATCHED RANDOM NULL. Same multidegree as S_{m+1}, random coefficients, same
      planted root, same lattice, same t. This is the OBJECT-LEVEL null that
      DEC-20260801-003 taught this campaign to demand - without it a measured X_max is
      a statement about lattices, not about summation polynomials.
    - >-
      NO-PLANT NEGATIVE CONTROL, measuring the spurious-root rate.
    - >-
      MATCHED BASELINES RECORDED BUT NOT COMPARED DIRECTLY - Pollard rho with negation
      and BSGS on the same instances, so the assembled-exponent bookkeeping of any
      positive branch has its denominator measured rather than quoted.
    - >-
      ALGEBRAIC-INDEPENDENCE ACCOUNTING. The number of short polynomials recovered and
      whether they are algebraically independent is recorded PER INSTANCE, because that
      is the Coppersmith multivariate heuristic and it is measurable here rather than
      assumable.
    required_metrics:
    - X_max and log_p X_max per (m, p, t) cell with the bisection trace
    - recovery rate per X in the bisection, with binomial intervals
    - positive-control recovery rate
    - degree-matched null X_max, paired per cell
    - spurious-root rate on the no-plant control
    - algebraic-independence failure rate per cell
    - lattice dimension, LLL/BKZ wall time and peak memory per cell
    - matched rho and BSGS charged operation counts on the same instances
  falsification_conditions:
  - >-
    'K1 - X_max >= p**(1/m) at any tested m >= 3, replicated on a second prime and
    surviving the degree-matched null and the spurious-root subtraction: Claim B is
    falsified in the direction that reopens the lane. This is an exponent claim and must
    route to independent review-breakthrough at max effort before ANY further step,
    including before it is described anywhere as a result.'
  - >-
    'K2 - the real polynomial beats the degree-matched null by more than 0.03 in
    log_p X_max: the degree explanation is incomplete and the summation variety carries
    exploitable structure. Mechanism finding, independent review required.'
  - >-
    'K3 - the positive control fails to reach 0.95 recovery: HARNESS VOID. Not a
    mathematical result in either direction (AGENTS.md rule 5 extended to statistical
    instruments by docs/inventor-protocol.md section 3).'
  - >-
    'K4 - X_max does not decay across m: harness void, same disposition as K3.'
  - >-
    'K5 - the expected outcome, X_max measurably below p**(1/m) with the null matching:
    Claim B is CONFIRMED as a barrier, and the deliverable is the barrier CURVE
    X_max(m, p, t), scoped to the tested arities, primes, lattice construction and
    reduction quality, with the forward guidance named in the mechanism field. This is
    NOT an impossibility claim and may not be written as one.'
  confounders:
  - >-
    BKZ block size and LLL delta silently determine reduction quality and therefore
    X_max. Both must be frozen in the contract and a sensitivity arm at a second block
    size is mandatory; an X_max that moves substantially with block size is a statement
    about the reducer, not about the polynomial.
  - >-
    The plant draws x_i uniformly below X; a decomposition with x_i clustered or with
    repeated values is atypical. Repeated x_i must be rejected at draw time and the
    rejection rate recorded.
  - >-
    Lifting x_i to a point requires x_i**3 + a x_i + b to be a square; the plant
    procedure's acceptance rate is about 1/2 per coordinate and must be recorded, since
    it silently changes the effective box.
  - >-
    Resultant-based root recovery can succeed for reasons unrelated to the lattice when
    m is small. The no-plant control bounds this and the bound is subtracted.
  interpretation_limits:
  - >-
    CLAIM A IS A DERIVATION, LABELLED AS SUCH, NOT A PROOF. It is a counting argument
    about a class of procedures, it is checkable, and it is not routed to a proof
    assistant. Its scope is procedures that enumerate subset sums of a factor base and
    join them; it says nothing about procedures that do not.
  - >-
    CLAIM B's measurement is at toy p. Lattice reduction quality at p = 2**24 is not
    lattice reduction quality at p = 2**256, and the direction of that difference is not
    obviously favourable. An extrapolation of X_max to cryptographic p is NOT offered
    and may not be constructed from this data without a separate argument.
  - >-
    A confirmed barrier closes lattice small-root solving for the tested construction.
    It does not close algebraic solvers generally, and in particular says nothing about
    symmetry-reduced formulations, hybrid partial-enumeration splits, or Gröbner methods
    with box-aware term orders.
  heuristic_assumptions:
  - id: HEUR-CM-1
    statement: >-
      The Coppersmith multivariate heuristic - the short polynomials output by lattice
      reduction are algebraically independent and their common zeros include the planted
      root, so that resultant or Gröbner elimination recovers it.
    rigorous_support: >-
      Coppersmith's univariate method is a theorem; the multivariate extension is
      explicitly heuristic in the Jochemsz-May line (confirmed by secondary sources,
      primary source unread in this session).
    validation_plan: >-
      MEASURED DIRECTLY IN THIS EXPERIMENT rather than assumed - the algebraic-
      independence failure rate is recorded per instance over 50 instances per cell, and
      X_max is reported both raw and conditioned on independence holding. If the failure
      rate exceeds 0.5 at any cell, X_max at that cell is reported as heuristic-limited
      rather than degree-limited, which is a DIFFERENT obstruction and must not be
      conflated with the degree one. TOY SCALE.
  - id: HEUR-YIELD-1
    statement: >-
      A random target has at least one decomposition into m factor-base points with all
      x_i < p**(1/m), with probability bounded below by a constant, per the counting
      heuristic B**m/(m! p) of IDEA-20260727-003.
    rigorous_support: >-
      Lang-Weil for the summation hypersurface supplies the density 1/p; the restriction
      to a box is NOT certified at admissible beta, and IDEA-20260727-006 computes the
      certification threshold beta_cert(m) = (m+1)/(2m), which exceeds the admissible
      beta about 1/m for every m. The heuristic is therefore uncertifiable by
      Weil-strength technology and this record does not pretend otherwise.
    validation_plan: >-
      NOT EXERCISED BY THIS EXPERIMENT, BY DESIGN. The decomposition is planted, so
      HEUR-YIELD-1 is decoupled from the measurement and no outcome here validates or
      refutes it in either direction. It re-enters only in the assembled exponent of the
      positive branch, where it must be validated separately before any end-to-end
      claim - and that validation is IDEA-20260727-006's minimal test, not this one.
  target_complexity:
    time_exponent: >-
      NEGATIVE BRANCH - 1/2 unchanged; matched rho remains the frontier and Claim A
      names the reason the whole enumerate-and-join class cannot leave it. POSITIVE
      BRANCH - max(omega_LA/m, 1/m) with omega_LA MEASURED and not assumed, which at
      omega_LA = 2 is 0.400 at m = 5 and 0.333 at m = 6, against 0.500 for matched rho.
      The relation-search step would then cost poly(lattice dimension) per relation
      rather than p**(1/2).
    memory_exponent: >-
      NEGATIVE BRANCH - n/a. POSITIVE BRANCH - B = p**(1/m) for the sparse relation
      matrix (0.200 at m = 5) plus the lattice, whose dimension is polynomial in t and
      in 2**m and therefore constant in p at fixed m. Memory is NOT the binding axis on
      the positive branch, which distinguishes it sharply from the p**(1/3) claw-finding
      exemplar where memory equals time.
    best_known: >-
      Pollard rho at 0.886 * sqrt(N) group operations with O(1) memory; BSGS at
      sqrt(N) time and sqrt(N) memory; with preprocessing, ST**2 = Omega(epsilon N)
      is a proven generic lower bound (Corrigan-Gibbs and Kogan, EUROCRYPT 2018,
      confirmed by search on 2026-08-02), so online time N**(1/3) after N**(2/3)
      advice is already known and is NOT beaten by anything here; multi-target
      L instances at sqrt(L N) total (Kuhn and Struik, SAC 2001, confirmed by search).
    hidden_overhead: >-
      STATED PLAINLY. The positive branch's 'polynomial time oracle' hides a lattice of
      dimension growing like (t * 2**(m-1))**m, so the constant is superexponential in
      m and is a constant only because m is fixed. At m = 5, t = 2 the dimension is
      already in the thousands and BKZ on it is not free. Any concrete-cost table for
      the positive branch must charge that dimension explicitly, and the exponent
      omega_LA/m is meaningless without it.
    tradeoff_note: >-
      The negative branch offers no tradeoff because it offers no algorithm. On the
      positive branch, memory is dominated by the B x B sparse relation matrix and the
      van Oorschot-Wiener interpolation does not apply, because the bottleneck is not a
      claw. Parallelization would be near-linear in relation collection and limited by
      the sparse solve, which is the standard index-calculus position.
  dominated_by: >-
    NEGATIVE BRANCH - dominated by Pollard rho on time at equal memory, by BSGS on
    time-memory product, and by the Corrigan-Gibbs/Kogan preprocessing frontier in the
    preprocessing model. Every frontier row this program tracks (rho, BSGS,
    ST**2 = N preprocessing, Kuhn-Struik sqrt(LN) multi-target) dominates a procedure
    with exponent 1/2 and non-trivial memory, and that is checked rather than asserted.
    POSITIVE BRANCH - dominated_by would be NULL only after checking those same four
    rows, since 0.400 at m = 5 beats rho's 0.500 and multi-target's per-instance
    sqrt(N/L) for L below N**(0.2), but does NOT beat the preprocessing model's online
    N**(1/3); the honest statement on the positive branch would therefore be 'dominated
    in the preprocessing model, undominated in the uniform model' and it must be written
    that way and not as a bare null.
  sota_delta: >-
    NEGATIVE BRANCH - quantitatively zero on every axis; the delta is a named
    obstruction plus a measured barrier curve X_max(m, p, t). POSITIVE BRANCH - time
    exponent 0.500 to 0.400 at m = 5 and to 0.333 at m = 6, at the cost of moving memory
    from O(1) to p**(1/m), with a superexponential-in-m constant disclosed above. No
    intermediate delta exists - the lane either supplies the oracle or it does not.
  instrument_failure_guards:
    decision_variable: >-
      X_max(m, p, t), located by bisection on a measured recovery rate.
    what_would_make_it_vary: >-
      The BOX BOUND X directly, and through it the lattice's ability to reach the
      planted root. X is an externally imposed knob with a monotone expected effect
      (recovery must fall as X rises), so the bisection itself is a demonstration that
      the statistic moves. Secondarily t and the per-variable degree.
    power_against: >-
      Infeasibility of the specific lattice construction at the tested arities, primes,
      shift multiplicities and reduction quality. That is a narrow class and it is
      stated narrowly.
    no_power_against: >-
      Any other algebraic solver (Gröbner with box-aware orders, symmetry-reduced
      formulations, hybrid partial-enumeration); lattice constructions other than the
      one frozen; cryptographic p, where reduction quality differs; arities beyond those
      reached within budget; and the yield question, which the plant deliberately
      removes.
    demonstrated_movement: >-
      BY MEASUREMENT AND BY CONSTRUCTION. The bisection on X produces a measured
      recovery curve from near 1 to near 0, so the perturbation provably moves the
      statistic within the experiment itself; the low-degree positive control
      additionally demonstrates that a planted root INSIDE the method's bound is
      actually recovered, which is the check that the plant can create the effect it
      certifies against.
    lessons_addressed: >-
      Lesson 1 - X_max is located by bisection on measured recovery, not computed from
      the protocol's parameters; the closed-form bound is the PREDICTION being tested,
      not the measurement. Lesson 3 - the alternative class is declared (lattice
      infeasibility at the frozen construction) and the classes with no power are listed.
      Lesson 4 - the plant is a root the method is designed to find and the low-degree
      control proves it can be found. Lesson 5 - the ladder is X and the statistic is
      recovery at X; they are the same construction. Standing limit U1 - the reference is
      the ABSOLUTE bound p**(1/m) required by the counting argument, not a second sample.
  estimated_cost:
    implementation: high
    compute: medium
  compute_budget_note: >-
    Symbolic construction of S_4 and S_5, lattice dimensions in the hundreds to low
    thousands, 50 instances per cell over roughly 12 cells with a 10-step bisection.
    Estimated single-digit CPU-days with a hard per-instance cap; a cap hit is an
    infrastructure signal and is reported as censoring, never as a failure to recover.
  recommended_priority: high
  dependencies:
  - >-
    Literature deep-read of Jochemsz-May and of any existing work applying lattice
    small-root methods to summation polynomials is a PRECONDITION. If such work exists,
    this record's status becomes `known` on Claim B and the deliverable reduces to
    reproducing and extending the published curve - which is still worth doing, and
    should be said rather than discovered late.
  - >-
    IDEA-20260802-007's charged-unit accounting is desirable for the matched baselines
    but is not blocking, since this record's primary decision variable is a recovery
    rate rather than a cost ratio.
