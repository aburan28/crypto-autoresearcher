idea:
  id: IDEA-20260829-172151
  question_id: RQ-ECDLP-165d4b
  added: '2026-08-29'
  title: >-
    THE CENSUS CANNOT REPORT AN EMPTY CELL WITHOUT A DETECTION FLOOR, AND THE
    LANE'S ONLY SPECIFIED DESIGN HAS A CLOSED-FORM ONE: derive the exact
    minimum-detectable-effect of the pre-registered eight-paired-group
    sign-permutation rule from the Rayleigh collision-time law, show that it
    depends on exactly one unmeasured quantity - the paired-walk log-work
    correlation rho - and measure rho, so that every "no non-generic behaviour
    found" cell in this census carries a power number instead of a silence
  class: control

  claim: >-
    (A) THE OBJECT. A census cell is a triple (curve family, instrument,
    scale) carrying a VERDICT. The verdict is a lossy projection of the run: it
    discards the whole work distribution and keeps one bit. This census is
    currently built so that the discarded part is exactly the part that decides
    what the retained bit MEANS - an empty cell can mean "the family is generic"
    or "the instrument is blind at this sample size", and nothing in
    RQ-ECDLP-165d4b, H-ECDLP-80fceb, H-ECDLP-f6d060 or H-ECDLP-e42bda
    distinguishes them.

    (B) THE CLOSED FORM, DERIVED HERE, ZERO COMPUTE. For an idealised rho walk
    on a cyclic group of order N, the collision time T satisfies T/sqrt(N) ->
    Rayleigh(1), so E[T] = sqrt(pi*N/2) = 1.2533*sqrt(N) (the negation-quotient
    convention 0.886*sqrt(N) of KN-TECH-006/KN-TECH-018 is exactly
    1.2533/sqrt(2)). Since T^2 is exponential, Var(log T) = (1/4)*psi'(1) =
    pi^2/24 = 0.4112 and sd(log T) = 0.6413. For a PAIRED comparison of two
    variants on the same group, sd(log ratio) = 0.6413*sqrt(2)*sqrt(1 - rho) =
    0.9070*sqrt(1 - rho), where rho is the correlation of the two variants'
    log-work under the shared pair token, target scalar and partition seed.

    (C) THE EXACT AUDIT OF THE LANE'S OWN PRE-REGISTERED RULE. H-ECDLP-e42bda
    pre-registers eight held-out paired groups, an exact two-sided 2^8
    sign-permutation test, and a family-wise Bonferroni alpha of 0.05 split as
    0.025 per ratio. With n = 8, the two-sided sign-permutation p-value for k
    minority signs is 2*sum_{i<=k} C(8,i)/256: k = 0 gives 0.0078, k = 1 gives
    0.0703. THEREFORE, AT alpha = 0.025, NOTHING WEAKER THAN ALL EIGHT PAIRS
    MOVING THE SAME WAY CAN REACH SIGNIFICANCE. This is arithmetic, not
    modelling, and it is checkable by hand.

    (D) THE POWER CONSEQUENCE, AS A FUNCTION OF THE ONE FREE PARAMETER. Let the
    true paired ratio be r and delta = -log r. Per-pair probability of the
    correct sign is q = Phi(delta / (0.9070*sqrt(1-rho))), and power = q^8.
    Under rho = 0 (independent walks): at the pre-registered r = 0.90,
    q = Phi(0.1162) = 0.546 and POWER = 0.546^8 = 0.032; at the full j=0
    automorphism discount r = 1/sqrt(3) = 0.577, q = Phi(0.606) = 0.728 and
    POWER = 0.079; 80 percent power requires q >= 0.9727, i.e. delta >= 1.745,
    i.e. a true speedup of 5.7x. Inverting on rho instead: detecting r = 0.90 at
    80 percent power with n = 8 requires sd(log ratio) <= 0.0548, i.e.
    rho >= 0.9964. THE ENTIRE VALIDITY OF THE LANE'S ONLY SPECIFIED DESIGN
    THEREFORE RESTS ON AN UNMEASURED CORRELATION EXCEEDING 0.9964, AND NO RECORD
    IN THIS PROGRAM MEASURES IT.

    (E) WHAT IS CLAIMED. Not that the design is wrong - that rho < 0.9964 is a
    prediction, and rho >= 0.9964 would be a genuine and reusable fact about
    seed-coupled quotient walks. What is claimed is that (C) is exact, that (D)
    is a one-parameter family, and that the parameter is cheap to measure. The
    deliverable is a MINIMUM-DETECTABLE-EFFECT TABLE indexed by (n, rho, alpha),
    plus the measured rho, so that every present and future cell of this census
    reports a floor alongside its verdict.

  mechanism: >-
    STEP 1 (zero compute). Write the exact sign-permutation p-value table for
    n in {4, 8, 12, 16, 24, 32} at alpha in {0.05, 0.025}, i.e. the minimum
    number of concordant pairs each (n, alpha) requires. This is a table of
    binomial tail sums and it immediately fixes what each design can and cannot
    conclude, independent of any curve.

    STEP 2 (zero compute). Compose the table with the Rayleigh log-variance of
    (B) to emit MDE(n, rho, alpha, power=0.8) in closed form, and the inverse
    sizing formula n_required(r, rho). Under rho = 0 and a sign test the
    large-n form is n ~ (z_{alpha/2} + z_beta)^2 / (4 (q - 1/2)^2); at r = 0.90
    this is about 1.1e3 paired groups against the 8 pre-registered.

    STEP 3 (low compute, THE MEASUREMENT). Instantiate the lane's own pairing
    convention: for each of ~40 toy prime-order ordinary curves at 12-16 bits,
    run C-BASE and C-NEG (and C-FULL where an F_p-rational automorphism is
    certified) under a SHARED pair token, target scalar, partition seed and
    stopping rule, 40 seeds each. Estimate rho as the Pearson correlation of
    log charged work across the paired variants, with a bootstrap CI, and
    estimate sd(log T) empirically to check it against the derived 0.6413.

    STEP 4 (low compute, THE PLANTED-POSITIVE DIAL). Add a synthetic,
    fully charged canonicalisation on a FAKE orbit structure of declared size s,
    which by construction delivers a known expected discount d(s) and no
    mathematics. Sweep d over {1.00, 1.05, 1.10, 1.20, 1.50, 1.73, 2.00} and
    measure the empirical detection rate of the lane's exact decision rule at
    n = 8. This produces the instrument's power CURVE directly, and it must
    agree with the closed form of STEP 2 at the measured rho. Agreement
    validates the formula for reuse; disagreement means the closed form is the
    wrong model and the empirical curve is the deliverable instead.

    STEP 5 (zero compute). Emit the reusable artifact: a per-cell schema field
    detection_floor = (n, rho_used, alpha, MDE at power 0.8), to be attached
    to every past and future null cell of this census. A cell whose measured
    effect is smaller than its own floor is recorded as UNRESOLVED, never as
    NEGATIVE.

  novelty_status: unverified

