        E[T] = sqrt(pi*N/2) and T^2 asymptotically exponential. Used in (B).
        Not opened in this session.
      verified_by: null
    - ref: null
      provenance: recalled
      claim: >-
        Wiener and Zuccherato, automorphism-class rho walks; van Oorschot and
