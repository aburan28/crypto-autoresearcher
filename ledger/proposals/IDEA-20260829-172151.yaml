      verified_by: null

  assumptions:
    - >-
      The idealised Rayleigh law is the NULL model for charged work, not a
      claim about the implemented walk. STEP 3 measures sd(log T) empirically
      and the closed form is discarded if the measured value differs from
      0.6413 by more than 20 percent.
    - >-
      The lane's decision rule is exactly as written in H-ECDLP-e42bda:
      Hodges-Lehmann paired median ratio with a two-sided 2^8 exact
      sign-permutation p-value and Bonferroni 0.025 per ratio. If the
      Coordinator's frozen contract differs, the audit is re-run against the
      frozen text and the numbers change.
    - >-
      The planted dial of STEP 4 delivers no mathematical advantage and is
      charged in full; its only role is to move the true effect size to a known
      value. Any implementation in which the dial leaks real structure voids
      STEP 4 and the peek-check is part of the design.
    - >-
      Power is computed for the SIGN test actually pre-registered. A different
      statistic (e.g. a paired t-test on log ratios) would have different power
      and the audit says nothing about it except by re-running STEP 2.

  proof_search_map:
    bottleneck: >-
      The step "convert an observed set of eight paired ratios into a verdict".
      Every null cell this lane can produce passes through it, and its
      operating characteristic has never been computed.
    baseline_embedding:
      parameter_slice: >-
        rho = 0 and n = 8 at alpha = 0.025 must reproduce the exact
        sign-permutation tail 2*C(8,0)/256 = 0.0078 for eight concordant pairs
        and 0.0703 for seven, which is a pure combinatorial identity.
      reproduction_check: >-
        Frozen fixture: enumerate all 256 sign assignments, tabulate the exact
        two-sided p-value for each k, and assert the two values above to the
        last digit. A symbolic check with no curve arithmetic; if it fails, the
        implementation of the lane's own test is wrong and that is the finding.
    observation_collision:
      observable: the cell verdict (detected or not detected)
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED: exhibit two planted dial settings -
        one with d = 1.00 (no effect at all) and one with d = 1.15 (a real 15
        percent effect) - that produce the SAME "not detected" verdict at n = 8
        with high probability. That collision is precisely the failure this
        record names, and finding it is the cheapest proof that the census's
        empty cells are not interpretable without a floor. Failure to find such
        a pair after the STEP 4 sweep would refute the record.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The per-cell detection floor MDE(n, rho, alpha, power) as a
          problem-specific resource measure attached to every census cell.
        predicted_gain: >-
          Converts every null cell in this census from an uninterpretable
          silence into a bounded statement "no effect larger than MDE", at zero
          marginal cost per cell once rho is measured once.
      - transform: observable_fiber
        proposed_object: >-
          The fibre of the "not detected" verdict - the set of true effect
          sizes consistent with it at the cell's own n and rho.
        predicted_gain: >-
          Names, as an interval rather than a hunch, exactly which non-generic
          effects this census would have missed.
    quantifier_order: >-
      Claimed: FORALL n, alpha and rho, EXISTS a computable MDE such that the
      lane's decision rule rejects with probability <= 0.8 for every true effect
      smaller than MDE. EXPLICITLY NOT CLAIMED: that any particular cell of this
      census contains a real effect; the record asserts nothing about curves.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The pre-registered eight-pair sign-permutation rule at alpha 0.025 has
        power P(r, rho) = Phi(-log r / (0.9070*sqrt(1-rho)))^8 under the
        Rayleigh null, and the measured rho at 12-16 bits is rho_hat +/- CI."
        It can never certify that a curve family is generic, that no non-generic
        mechanism exists, or that a larger n would find one.
      nearby_object_control: >-
        The SAME power computation applied to a design that is known to work -
        the 20-seed single-arm estimate of EV-ENDO-10109d, where sd 0.11 on a
        ratio-to-ceiling with n = 20 gives a standard error of 0.025 and a
        genuinely tight interval. The method must report that design as
        adequately powered and the eight-pair sign rule as not. A method that
        condemns both has not identified the load-bearing structure (which is
        the discreteness of the sign statistic, not sample size per se).
    proof_obligations:
      - claim: "At n=8, alpha=0.025 forces all-eight-concordant."
        responsibility: correctness
      - claim: "sd(log T) = 0.6413 under the Rayleigh null."
        responsibility: correctness
      - claim: "Power = q^8 with q = Phi(delta/sd(log ratio))."
        responsibility: success_probability
      - claim: "The measured rho is estimated under the lane's own pairing convention."
        responsibility: interface
      - claim: "The planted dial delivers no real advantage."
        responsibility: correctness
      - claim: "No statement is made about any curve family's genericity."
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        minimum number of concordant pairs required by the pre-registered
        n=8 exact two-sided sign-permutation test at alpha=0.025
      direction: different
      minimum_effect: >-
        Exactly 8 of 8. Any other value means the p-value table in
        H-ECDLP-e42bda has been mis-derived, which is itself decision-relevant.
    - metric: >-
        measured Pearson correlation rho of log charged work between paired
        C-BASE and C-NEG variants under a shared pair token and seed
      direction: lower
      minimum_effect: >-
        Predicted rho < 0.99, and specifically below the 0.9964 threshold that
        the pre-registered 0.90 effect requires at 80 percent power. A measured
        rho >= 0.9964 with a CI excluding 0.99 REFUTES this record's central
        claim and vindicates the design, and would be a reusable positive fact.
    - metric: empirical sd of log charged work per single walk arm
      direction: different
      minimum_effect: >-
        Predicted 0.6413 within 20 percent (i.e. in [0.513, 0.770]). Outside
        that band the Rayleigh null is the wrong model for the implemented walk
        and every closed-form number in this record is void; the empirical power
        curve of STEP 4 becomes the sole deliverable.
    - metric: >-
        empirical detection rate of the lane's exact rule at planted discount
        d = 1.10, n = 8, alpha = 0.025, over >= 200 replications
      direction: lower
      minimum_effect: >-
        Predicted below 0.15. A rate above 0.50 refutes the power calculation.
    - metric: >-
        number of distinct planted discounts in {1.00, 1.05, 1.10, 1.20} sharing
        the "not detected" verdict at >= 80 percent of replications
      direction: higher
      minimum_effect: >-
        Predicted >= 3 of 4, establishing the observation collision. Fewer than
        2 refutes the collision claim.

  minimal_test:
    design: >-
      TWO STAGES, THE FIRST COSTING NO COMPUTE AT ALL. STAGE A (minutes,
      symbolic): enumerate the 2^8 sign assignments, emit the exact p-value
      table, and evaluate Power(r, rho) = Phi(-log r / (0.9070*sqrt(1-rho)))^8
      on a grid r in {0.577, 0.80, 0.90, 0.95} x rho in {0, 0.5, 0.9, 0.99,
      0.996, 0.999}. This alone settles claim (C) and produces the reusable MDE
      table. STAGE B (hours): the rho measurement of STEP 3 on ~40 toy curves at
      12-16 bits, 40 seeds, using harness/toycurve.py and harness/rho.py under
      the lane's own pairing convention; then the planted-dial sweep of STEP 4
      at >= 200 replications per dial setting. Total well inside a single-digit
      CPU-hour budget at 12-16 bits.
    controls:
      - >-
        d = 1.00 NULL DIAL: an identically charged canonicalisation with orbit
        size 1, which delivers no discount. Detection rate must equal alpha
        (about 0.025) within Monte Carlo error; a higher rate means the rule is
        anti-conservative and every past p-value in this lane is suspect.
      - >-
        d = 1.73 POSITIVE DIAL matched to the sqrt(3) j=0 ceiling, so the sweep
        brackets the largest effect the lane's own mechanism can produce.
      - >-
        RELABEL CONTROL: a deterministic point relabelling with no structural
        content, which must behave exactly as the d = 1.00 dial.
      - >-
        SHUFFLED-PAIR CONTROL: break the shared pair token so the two arms use
        independent seeds; measured rho must drop to ~0, confirming that the
        estimator is measuring coupling and not bookkeeping.
      - >-
        PEEK-CHECK on the dial implementation, verifying it cannot access the
        target scalar or the underlying orbit.
      - >-
        The 20-seed single-arm design of EV-ENDO-10109d re-scored by the same
        power machinery, which must come out adequately powered.
    required_metrics:
      - exact sign-permutation p-value table for n in 4, 8, 12, 16, 24, 32
      - MDE(n, rho, alpha, power=0.8) grid, machine-readable
      - rho_hat with bootstrap CI, per bit size and per variant pair
      - empirical sd(log T) per arm, with CI, against the derived 0.6413
      - detection rate per planted dial setting, with binomial CI
      - the verdict-collision set (dial settings sharing a verdict)
      - pass/fail of every control above

  falsification_conditions:
    - >-
      The exact sign-permutation table does not force all-eight-concordant at
      alpha 0.025. Claim (C) is arithmetically wrong; the record is withdrawn
      and superseded.
    - >-
      Measured rho >= 0.9964 with a CI excluding 0.99. The pre-registered design
      is adequately powered for its stated effect, the central claim is refuted,
      and the positive fact (near-perfect seed coupling of paired quotient
      walks) is the deliverable instead.
    - >-
      Measured sd(log T) outside [0.513, 0.770]. The Rayleigh null is wrong for
      the implemented walk; all closed-form numbers here are void and only the
      empirical power curve survives.
    - >-
      The d = 1.00 null dial detects at materially above alpha. The rule is
      anti-conservative; this is an instrument defect and every number in the
      lane, including this record's, is suspended pending repair.
    - >-
      No two dial settings share a verdict at >= 80 percent. The observation
      collision does not occur and the interpretability argument fails.

  confounders:
    - >-
      SHARED-SEED COUPLING IS THE WHOLE QUESTION AND IT IS EASY TO FAKE. If the
      two arms share not only the seed but a deterministic prefix of the walk,
      rho can be driven arbitrarily close to 1 by construction rather than by
      mathematics. The shuffled-pair control and an explicit report of how much
      of each walk is shared are mandatory.
    - >-
      CHARGED-COST DEFINITION. rho is a correlation of CHARGED work, and any
      per-arm fixed overhead (setup, certificate replay, canonicalisation)
      inflates rho by adding a common constant. Fixed overheads must be reported
      separately and rho recomputed with and without them.
    - >-
      SMALL-N BOOTSTRAP BIAS. A correlation estimated from 40 curves x 40 seeds
      has real uncertainty; the CI must be reported and the threshold comparison
      made against the CI bound, not the point estimate.
    - >-
      FINITE-SIZE BIAS IN sd(log T) AT 12-16 BITS. The Rayleigh law is
      asymptotic. This confounder is exactly what IDEA-20260829-34f3ed measures,
      and until it is measured the sd comparison carries a scale caveat.
    - >-
      READING THIS AS A VERDICT ON THE LANE. It is not. An underpowered design
      is a design fact, not evidence that the automorphism mechanism is absent.

  interpretation_limits:
    - >-
      This record makes NO statement about any curve family's genericity, about
      the automorphism mechanism, or about the ECDLP. It is an audit of a
      decision rule.
    - >-
      Scoped to the exact statistic pre-registered in H-ECDLP-e42bda. A
      different statistic has different power and is not covered.
    - >-
      rho is measured at 12-16 bits. Whether the paired coupling strengthens or
      weakens with bit size is a transfer assumption and is NOT established
      here; it is the explicit hand-off to IDEA-20260829-34f3ed.
    - >-
      A measured detection floor bounds Type II error under the stated null
      model only. It does not convert an unresolved cell into a negative one.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a fully charged rho walk on a cyclic group of prime order N with a
        partition into r >= 20 branches, the charged collision time T satisfies
        T/sqrt(N) -> Rayleigh(1) in distribution as N -> infinity, uniformly
        over the tested family, so that E[T] = sqrt(pi*N/2), T^2 is
        asymptotically Exp(1/2), and Var(log T) = pi^2/24 = 0.4112.
      rigorous_support: >-
        The birthday bound and the classical random-mapping limit laws for
        rho-length in a random function on N points (Flajolet-Odlyzko random
        mapping statistics; the same limit underlying the 0.886*sqrt(n)
        convention recorded in KN-TECH-006 and KN-TECH-018). The rigorous
        ingredient is the exponential limit of the birthday waiting time; the
        heuristic step is that the IMPLEMENTED partition walk behaves like a
        uniformly random function of its size, which is the standard rho
        heuristic and is not proved for any concrete partition.
      validation_plan: >-
        Sample 40 toy prime-order ordinary curves at 12, 13, 14, 15 and 16 bits
        (N exactly known by exhaustive point count at this scale, so no
        estimation error enters), 40 seeds each, and compare the empirical CDF
        of T/sqrt(N) against the Rayleigh(1) CDF by a two-sample
        Kolmogorov-Smirnov statistic per bit size. Tail checks: the observed
        0.01 and 0.99 empirical quantiles against Rayleigh quantiles 0.1418 and
        3.0349, and the largest observed T/sqrt(N) against the predicted maximum
        of 1600 Rayleigh draws. Record sampled parameters (p list, seeds, N,
        partition branch count r) verbatim. TRANSFER ASSUMPTION, STATED: nothing
        here extrapolates the fitted sd beyond 16 bits; that extrapolation is
        the separate subject of IDEA-20260829-34f3ed.
    - id: H2
      statement: >-
        Under the lane's shared pair token, the pair (log W_BASE, log W_NEG) is
        bivariate with correlation rho independent of the group within the
        tested bit range, so that sd(log ratio) = 0.9070*sqrt(1-rho).
      rigorous_support: >-
        No rigorous support is claimed; this is a modelling convenience. The
        rigorous part is only the identity sd(X-Y) = sd(X)*sqrt(2(1-rho)) for
        equal-variance X, Y. Group-independence of rho is the heuristic.
      validation_plan: >-
        Estimate rho separately at each of 12, 13, 14, 15, 16 bits and test for
        homogeneity by a Fisher z-transform chi-square across bit sizes. If rho
        is heterogeneous, the MDE table is emitted per bit size rather than
        globally, and that heterogeneity is itself a census cell.

  target_complexity:
    time_exponent: >-
      1/2, unchanged. NO EXPONENT IS CLAIMED OR MOVED. This is an instrument
      calibration and it is a BUILDING BLOCK, offered as such: per the search
      heuristics it is low-ambition on its own and its priority rests entirely
      on the fact that every exponent-relevant negative result this lane can
      produce is uninterpretable without it.
    memory_exponent: >-
      O(1) for rho, unchanged. The audit itself stores O(n*seeds) scalars.
    best_known: >-
      Parallel rho at 0.886*sqrt(N) with O(1) memory (KN-TECH-001, KN-TECH-006);
      automorphism-discounted rho with a constant of at most sqrt(6)
      (KN-TECH-018).
    hidden_overhead: >-
      Disclosed: the closed form hides the assumption that charged work is
      Rayleigh-distributed at TOY size, where the asymptotic law is least
      accurate. H1's validation plan is the only defence and it is a
      finite-sample check, not a proof.
    tradeoff_note: >-
      Not applicable to the audit. Relevant to what it audits: the mechanism
      under test is a memory-free constant-factor rho variant, so no
      van Oorschot-Wiener interpolation is in play and parallelisation is
      embarrassingly parallel over (curve, seed).

  dominated_by: >-
    AS AN ATTACK: none is proposed, and the Pareto rows are still checked
    individually rather than left null. TIME - Pollard rho at 0.886*sqrt(N)
    dominates; this record proposes nothing that solves an ECDLP instance.
    MEMORY - rho at O(1) dominates. DATA/QUERIES - no query advantage claimed
    or possible. CM-SPECIFIC - automorphism-discounted rho (KN-TECH-018)
    dominates every variant this record calibrates. MEMORY-RICH - BSGS
    (KN-TECH-031). All rows checked; none is beaten.
    AS A CALIBRATION ARTIFACT: not dominated by any record in this repository -
    no ledger record computes the operating characteristic of any decision rule
    in this lane, and EV-ENDO-10109d reports dispersion without converting it
    into a detection floor. Against the external literature, standard power
    analysis obviously dominates the statistics; no priority is claimed and
    novelty_status is unverified accordingly.

  sota_delta: >-
    Zero on every attack axis: time exponent delta 0, memory exponent delta 0,
    data/query delta 0, cryptographic security bits reduced 0. Non-zero delta,
    quantified: converts an unbounded class of "no non-generic behaviour found"
    cells into bounded statements, and prices the lane's only specified
    experiment before its 18720-second budget is spent - if the derived power at
    the pre-registered effect is 0.032 as predicted, the audit costs single-digit
    CPU-hours and prevents a 5.2-CPU-hour run whose expected information is
    approximately 3 percent of a positive detection.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  status: proposed
  proposed_by: idea-generator
  proposed_at: '2026-08-29'
