idea:
  id: IDEA-20260816-466631
  question_id: RQ-SLHDSA-001
  added: '2026-08-16'
  title: Count the distinct tweaks a signer actually materializes over a transcript, separate that
    reachable count from the nominal address-space size, and measure whether a generic multi-target
    search against the tweaked family scales with the reachable count or the nominal one, with untweaked
    and maximally-tweaked signers as the two bracketing arms.
  class: composition
  claim: '(A) The domain-separation countermeasure in a hypertree signer is universally described
    in terms of what it is supposed to prevent and nowhere in this repository in terms of how many
    separations it actually creates. Those are different numbers. The nominal address space is astronomically
    large; the reachable tweak set after q signatures is bounded by the number of distinct hash calls
    the signer makes, which is q times a small structural constant early on and grows sublinearly
    once subtrees repeat. The gap between them is a countable object. (B) The countermeasure''s effect
    is testable rather than assumable, and the test is a bracket. Three signers, identical in every
    respect except domain separation: untweaked, where every call goes to one unkeyed function so
    all targets coincide; real, where the address is the tweak; and maximally tweaked, where every
    call receives a globally unique fresh tweak so no two targets ever coincide. A generic multi-target
    search run identically against all three must place the real signer''s cost strictly between the
    other two, and where it lands in that interval is the measurement. (C) The composition question
    is the point. Multi-target advantage is usually reasoned about per layer, but a transcript touches
    several layers at once and a search that can attack any of them sees the union of their reachable
    tweak sets. Measuring the union rather than the per-layer counts is what makes this a composition
    measurement and not a restatement of a per-layer bound. (D) At toy hash output sizes the search
    is exhaustive, so the cost is counted in evaluations rather than estimated, and the scaling in
    the target count is read off a curve rather than fitted to two points. (E) WHAT IS NOT CLAIMED:
    no attack on any real scheme, no forgery, no weakness, no speedup, no security level, no bit count
    for any FIPS 205 parameter set, no statement about SHA-2 or SHAKE, no statement about what the
    literature contains, and nothing about the fault or memory-corruption class. The untweaked and
    maximally-tweaked signers are constructed comparison objects, not variants of any deployed algorithm,
    and no artifact of this entry may describe them as such.'
  mechanism: 'STAGE A: instrument the signer to record every hash call''s tweak, and derive the reachable
    tweak set as the union over the transcript, per layer and overall. This is a byproduct of the
    null harness''s table and costs nothing extra. STAGE B: measure the reachable count as a curve
    in q for each toy parameter set, and compare it against the nominal address-space size and against
    the structural upper bound (calls per signature times q). The three-way gap is the first deliverable
    and requires no search at all. STAGE C: build the two bracketing signers. Untweaked collapses
    the tweak to a constant; maximally tweaked draws a globally unique tweak per call from a counter.
    Both are constructed objects and both are labelled as such in every artifact. STAGE D: run an
    identical generic multi-target search against all three: at output size n bits, evaluate the function
    on random inputs and check each output against the stored target set, counting evaluations to
    first hit, repeated to build a distribution. At n up to 20 bits this is exhaustive rather than
    sampled. STAGE E: vary the target-set size independently of the signer by subsampling the reachable
    set, so that the scaling exponent in the target count is read from a curve across many sizes rather
    than inferred from the three arms. STAGE F: report evaluations-to-hit against target count for
    each arm, the bracket check, and the exponent fitted over the curve with its confidence band.'
  novelty_status: unverified
  novelty_screen:
    method: grep -ril for multi-target, tweakable, ADRS, target count, domain separation over ledger/proposals/,
      ledger/hypotheses/, knowledge/. Read RQ-SLHDSA-001 in full and the statement block of H-SLHDSA-3a403a,
      noting clause (v) on the attack's memory. Read the claim of IDEA-20260813-945a67 in full and
      the titles of IDEA-20260805-88ecef and IDEA-20260808-ae34ad. Checked EXP-SLHDSA-9cbad4's what_this_is_not
      block for the constraints on constructed comparison objects, which is where the VARIANT-P labelling
      discipline is recorded.
    results: The multi-target grep returns many records across the repository, but on this question
      the relevant three are IDEA-20260805-88ecef, which builds a cost-convention register with the
      memory-access exponent and quantum depth cap as rows; IDEA-20260808-ae34ad, which argues the
      memory charge against multi-target FORS search is smaller than assumed because approximate set
      membership needs about ten bits per target; and IDEA-20260801-009, the original slack meter.
      All three take the target count as a given input to a cost model and none measures it. IDEA-20260813-945a67
      concerns ADRS aliasing under a single-fault model. H-SLHDSA-3a403a clause (v) reasons about
      the attack's memory being at least q*k cells, again taking the target count as given. EXP-SLHDSA-9cbad4
      records a strict labelling discipline for constructed comparison objects, requiring VARIANT-P
      be described as hypothetical and not as any standardized algorithm; that discipline is adopted
      verbatim here for the untweaked and maximally-tweaked arms. No record counts a reachable tweak
      set or measures a search's scaling against it.
    verdict: 'UNVERIFIED. Multi-target search cost scaling with target count is elementary and this
      program cannot read external literature, so nothing is asserted about what exists elsewhere;
      the bracketing-arms design is also an ordinary experimental move. What is claimed new is internal:
      three records on this question consume a target count and none produces one, so the number this
      repository''s cost models are built on has never been measured here. The specific assembly --
      reachable-tweak-set cardinality as a measured curve, a three-way bracket of untweaked, real
      and maximally-tweaked signers run identically, and the scaling exponent read from a subsampled
      target-size curve rather than inferred from the three arms -- is built from standard parts that
      this repository has not put together.'
  object_first_candidate:
    tracked_object: 'The reachable tweak set T_q: the set of distinct tweak values materialized by
      the signer over a transcript of q signatures, tracked as a set with per-layer decomposition
      and with its cardinality as the reported quantity.'
    lossiness: 'The projection discards every hash output, every secret, every message, the order
      of calls, and which signature created which tweak. What survives is set membership over the
      address space. This is genuinely lossy: from T_q one cannot recover a signature, a key, or even
      how many signatures were issued, since one signature may materialize many tweaks and repeated
      subtrees materialize none. It propagates because a generic multi-target search''s cost depends
      on the target set only through its cardinality and through whether targets coincide, both of
      which are functions of T_q alone -- so the discarded material is discarded compatibly with the
      operation being measured. The boundary is explicit: any attack that exploits a relation between
      two targets rather than their number is invisible to this object, and the entry claims nothing
      about such attacks.'
    propagation: One signature materializes a structurally determined set of new tweaks and re-hits
      any already created by an earlier signature in the same subtree. On the tracked object this
      is T <- T union (new tweaks), a monotone union, so |T_q| starts growing at its structural rate
      of calls-per-signature and bends downward as subtree reuse begins. That bend is the propagation
      law and its location in q is a measurement rather than an assumption. In the untweaked arm the
      same operation leaves |T| at one forever; in the maximally-tweaked arm it grows at exactly calls-per-signature
      forever; the real arm's curve lies between and its shape is the deliverable.
    survival_score: 'The reachable set is exact for any transcript the null harness can hold, which
      is bounded by its 2^24-entry table cap: at the toy parameter sets that is roughly 2^14 signatures
      before refusal, and the contract reports that refusal boundary per parameter set rather than
      sampling past it. The multi-target search is exhaustive rather than sampled at output sizes
      up to 20 bits and degrades to sampled with bands at 24 bits; above that it is out of scope.
      The object itself does not dissolve at any parameter -- it is a set cardinality -- but its usefulness
      dissolves when the search stops being exhaustive, because then the scaling exponent is fitted
      rather than counted, and the contract records which points are which.'
  null_object_control: 'Two constructed comparison signers bracket the real one, both executed in
    the same invocation with the identical search. The untweaked arm collapses every tweak to a single
    constant, so all targets coincide and the search sees exactly one target regardless of q: it is
    the null in which the countermeasure is entirely absent. The maximally-tweaked arm assigns every
    call a globally unique tweak, so no two targets ever coincide: it is the ceiling in which the
    countermeasure is perfect. For the real arm''s number to mean anything, the untweaked arm must
    show search cost independent of q and the maximally-tweaked arm must show cost falling with the
    full structural target count; if either fails, the search instrument is not sensitive to target
    count at all and the real arm''s position in the bracket carries no information. A third control
    subsamples the real arm''s reachable set to a chosen cardinality, decoupling target count from
    signer structure, so that the scaling exponent is measured on a curve rather than read from three
    points.'
  discriminated_from:
  - 'IDEA-20260805-88ecef: a cost-convention register in which the memory-access exponent and the
    quantum depth cap are rows rather than assumptions. It varies how a given advantage is charged;
    this varies how many targets exist. The target count is an input there and an output here.'
  - 'IDEA-20260808-ae34ad: argues the memory charge is smaller than assumed because approximate set
    membership needs about ten bits per target. It reasons about the per-target memory cost, taking
    the target count as given, and reaches a bits figure; this measures the count and makes no charging
    argument at all.'
  - 'IDEA-20260813-945a67: ADRS aliasing under a single-fault model, producing subtree-reuse certificates.
    No fault appears anywhere here; every tweak studied is materialized in honest operation, and the
    deliverable is a cardinality curve, not a certificate.'
  - 'H-SLHDSA-3a403a clause (v): reasons that the attack''s memory is at least q*k cells, again with
    the target count given. This entry does not compute an attack cost for any real parameter set
    and produces no memory charge.'
  - 'EXP-SLHDSA-9cbad4 and its VARIANT-P: a hypothetical nearby object reasoned about analytically
    and explicitly not executed. The untweaked and maximally-tweaked signers here are executed beside
    the real one in the same invocation, which is what makes them controls under inventor-protocol
    section 3, and they inherit VARIANT-P''s labelling discipline verbatim.'
  assumptions:
  - A generic multi-target search's cost depends on the target set only through its cardinality and
    through coincidences among targets; attacks exploiting relations between targets are outside the
    object and their exclusion is stated, not established.
  - The reachable tweak set recorded by the null harness's table is the complete set of tweaks the
    signer materializes, which requires the harness to have cleared its own self-consistency battery
    first.
  - The untweaked and maximally-tweaked signers differ from the real one only in domain separation,
    verified by call-trace comparison rather than assumed.
  - Toy output sizes of 16 to 20 bits leave enough dynamic range that a scaling exponent is resolvable
    across the swept target counts; whether they do is checked by the maximally-tweaked arm before
    the real arm is read.
  - The structural calls-per-signature constant used to bound |T_q| comes from a structural description
    this repository marks UNVERIFIED against primary text.
  predictions:
  - metric: ratio of the reachable tweak count |T_q| to the nominal address-space size at q = 2^12,
      toy parameters
    direction: lower
    minimum_effect: 'explicit refusal to pre-commit a magnitude: the gap is the deliverable and its
      size depends on the address encoding''s width, which is taken from an UNVERIFIED structural
      description. The binding pre-commitment is that all three quantities -- nominal size, structural
      upper bound, and measured reachable count -- are reported together and never one alone.'
  - metric: evaluations-to-first-hit in the untweaked arm as a function of q
    direction: different
    minimum_effect: 'forced value: constant in q, since all targets coincide. Any dependence on q
      indicates the search is sensitive to something other than target count and invalidates the bracket.'
  - metric: evaluations-to-first-hit in the maximally-tweaked arm versus the real arm at equal q
    direction: higher
    minimum_effect: 1.0
  - metric: fitted scaling exponent of evaluations-to-hit against subsampled target-set cardinality,
      maximally-tweaked arm
    direction: different
    minimum_effect: forced value -1 within its confidence band, the generic expectation for a search
      against T independent targets at fixed output size; a fitted exponent far from -1 means the
      search instrument is not measuring target count and no arm may be read
  - metric: position of the real arm's cost within the bracket, expressed as a fraction of the interval
      between the untweaked and maximally-tweaked arms
    direction: different
    minimum_effect: 'explicit refusal to pre-commit: this is the measurement, and pre-committing to
      a position would make the bracket confirmatory'
  minimal_test:
    design: 'One configuration decides whether the bracket has any resolution. Fix the toy signer
      at h = 6, d = 1, a = 2, k = 3, w = 4, with hash output n = 16 bits, and take q = 256 signatures.
      Record the reachable tweak set from the null harness''s table, giving |T_q| directly, and report
      it beside the nominal address size and the structural bound calls-per-signature times q. Then
      run the identical generic search -- draw random inputs, evaluate, test membership against the
      stored target set, count evaluations to first hit, repeat 10^3 times -- against three arms in
      one invocation: untweaked, real, maximally tweaked. The discriminating observables are two:
      whether the untweaked arm''s cost is flat in q while the maximally-tweaked arm''s falls, which
      establishes the instrument is sensitive to target count at all, and whether the real arm lies
      strictly between them. If the untweaked and maximally-tweaked arms give the same cost, there
      is no bracket and nothing else in the contract is worth running. Cost is minutes, and the failure
      mode is detected before any expensive sweep.'
    controls:
    - 'Untweaked signer arm: all tweaks collapsed to one constant, executed in the same invocation,
      expected flat in q.'
    - 'Maximally-tweaked signer arm: a globally unique tweak per call, same invocation, expected to
      fall with the full structural target count.'
    - 'Subsampled-target-set control: the real arm''s reachable set truncated to chosen cardinalities,
      decoupling target count from signer structure so the exponent is measured on a curve.'
    - Call-trace comparison across the three signers, requiring identical call-type and address-structure
      sequences so that only domain separation differs.
    - Ideal-oracle backend arm from the companion null harness, so that the whole bracket can be repeated
      with the hash replaced by an ideal object and any hash-specific contribution isolated.
    required_metrics:
    - reachable tweak count |T_q| as a curve in q, overall and decomposed per layer
    - nominal address-space size and the structural upper bound calls-per-signature times q, reported
      alongside
    - evaluations-to-first-hit distribution per arm per q
    - fitted scaling exponent of evaluations-to-hit against subsampled target cardinality, per arm,
      with confidence band
    - position of the real arm within the untweaked-to-maximally-tweaked bracket
    - call-trace equality across the three signers
  falsification_conditions:
  - 'The untweaked and maximally-tweaked arms give indistinguishable search costs: there is no bracket,
    the search instrument is insensitive to target count, and no arm may be interpreted.'
  - 'The untweaked arm''s cost varies with q: the search is responding to something other than target
    count.'
  - 'The maximally-tweaked arm''s fitted exponent is far from -1: the instrument does not measure
    what it is supposed to and the exponent for the real arm is meaningless.'
  - 'Call traces differ across the three signers beyond the tweak field: the arms differ in more than
    domain separation and are not comparable.'
  - 'The real arm falls outside the bracket in either direction: either the reachable set is not what
    the harness recorded, or the search sees structure the cardinality model does not capture; both
    are instrument failures to be diagnosed, not findings.'
  - 'The null harness has not cleared its own self-consistency battery: the reachable-set record is
    untrusted and the whole contract is blocked upstream.'
  confounders:
  - Toy output sizes make the search cheap enough that evaluations-to-hit is dominated by small-number
    effects, compressing the difference between arms for reasons unrelated to target count.
  - The maximally-tweaked arm materializes far more table entries than the real arm at equal q, so
    it hits the harness's cap sooner, and a cap-induced truncation would look like a saturation in
    target count.
  - Reachable-set cardinality and per-layer composition move together as q grows, so an apparent scaling
    in cardinality could be a composition effect; the subsampled control is what separates them and
    must be run at fixed q.
  - The untweaked arm collapses targets, which also collapses the memory the search needs, so any
    timing-derived observable would differ for a reason unrelated to the countermeasure; only evaluation
    counts are admitted, never timings.
  - The nominal address-space size depends on the address encoding width taken from an UNVERIFIED
    structural description, so the reported gap inherits that uncertainty in full and must never be
    quoted without it.
  interpretation_limits:
  - The untweaked and maximally-tweaked signers are constructed comparison objects and are not variants
    of any deployed or standardized algorithm; no artifact may describe them as such, following the
    discipline recorded in EXP-SLHDSA-9cbad4.
  - A measured position within the bracket is a statement about a toy signer at toy output sizes and
    is not a security margin, a bit count, or a statement about any FIPS 205 parameter set.
  - The object sees only target cardinality and coincidence; attacks exploiting relations among targets
    are outside it entirely.
  - A reachable count far below the nominal address size is an expected structural fact about any
    transcript of bounded length and is not by itself a weakness or a finding about adequacy.
  - Nothing here bears on the fault or memory-corruption claim class.
  target_complexity:
    time_exponent: No attack exponent is claimed for any real scheme. The contract measures an exponent
      for a generic search against a constructed toy target set, expected to be -1 in evaluations-to-hit
      against target cardinality at fixed output size, and reports it as an instrument calibration
      rather than as an attack cost.
    memory_exponent: No attack memory exponent is claimed. The instrument's memory is the stored target
      set, one entry per reachable tweak, bounded by the null harness's 2^24-entry cap with refusal
      rather than eviction at the boundary.
    best_known: 'The incumbent inside this repository is the assumed target count: IDEA-20260805-88ecef,
      IDEA-20260808-ae34ad and H-SLHDSA-3a403a clause (v) all take a target count as an input to a
      cost or memory argument, and the number of records here that measure one is zero. This entry
      beats nothing on any cost axis; it supplies an input those three currently assume. No claim
      is made about what exists outside this repository.'
    hidden_overhead: 'The overhead hides in the bracket''s construction, not the search. The maximally-tweaked
      arm materializes many more table entries at equal q and will hit the harness cap first, so the
      three arms cannot be run to equal q without either capping the maximal arm early or shortening
      all three, and choosing wrongly produces a truncation that looks like saturation. In human cost,
      verifying that the three signers differ only in domain separation is the real work: it means
      a call-trace comparison at every parameter set, and the temptation to verify it once and assume
      it thereafter is the failure mode most likely to invalidate the whole contract quietly.'
  dominated_by: 'n/a (no result claimed). Checked against every frontier row this repository maintains
    for time, memory and data/queries: the contract produces a cardinality curve and a calibration
    exponent for a constructed toy object, neither of which is an attack and neither of which has
    a coordinate on any frontier axis. Nothing dominates it, it dominates nothing, and it is not entered
    on any frontier.'
  sota_delta: 'no attack; conceptual/measurement contribution only. Against this repository''s own
    state: three records consume a multi-target count and zero produce one, so this would supply the
    first measured value of a quantity the lane''s cost models rest on, reported as a curve in q with
    its nominal and structural bounds beside it.'
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: 'Separable parts. (1) That the reachable tweak count can be measured as
    a clean curve in q with its per-layer decomposition: about 0.85, contingent entirely on the null
    harness clearing its self-consistency battery first, which is a real dependency and not a formality.
    (2) That the bracket has resolution, meaning the untweaked and maximally-tweaked arms give clearly
    different search costs at toy output sizes: about 0.7, and this is the part the minimal test exists
    to check early because if it fails nothing else is worth running. (3) That the maximally-tweaked
    arm''s fitted exponent comes out near -1, calibrating the instrument: about 0.8, with the residual
    dominated by small-number effects at 16-bit outputs rather than by anything conceptual. (4) That
    the real arm''s position within the bracket is informative rather than pinned against one end:
    about 0.45. My honest expectation is that at realistic q the real arm sits very close to the maximally-tweaked
    end, because subtree reuse is rare at small q, and if so the measurement''s content is the location
    of the bend rather than the position -- which I would report as such rather than as a null result.
    (5) That any of this changes a number in the cost-model lane: about 0.3, since those models are
    dominated by charging conventions rather than by the count itself.'
