idea:
  id: IDEA-20260828-400967
  title: >-
    Exhaustive small-scale enumeration of low-condition-count local-collision
    differential templates for reduced-round MD4/MD5, to measure whether
    "good" template scarcity — rather than message-modification execution
    difficulty — is the load-bearing obstruction an unguided automated
    search must overcome
  class: measurement
  claim: >-
    The density of "good" local-collision differential templates — an
    (input-difference, message-difference, round-count r) triple whose total
    sufficient-condition count c_total is below a threshold theta(r)
    declared BEFORE enumeration — among all templates exhaustively enumerable
    at small, reduced round counts (r covering 4, 8, 12, 16 steps of
    MD4/MD5, Hamming weight <= 2 differences) either (a) decays
    exponentially in r, naming template SCARCITY as the specific
    combinatorial obstruction any unguided automated search (such as the
    instrument proposed in IDEA-20260828-12ce12) must overcome, independent
    of whether message-modification EXECUTION works; or (b) stays roughly
    constant or decays only polynomially, in which case a failure of that
    same automated search is instead attributable to the search algorithm's
    inability to explore efficiently, not to genuine scarcity. This is an
    independent, cheap, purely combinatorial measurement that INTERPRETS
    (without duplicating) whatever a search-execution instrument finds.
  mechanism: >-
    STAGE 1 exhaustively enumerates the template space at reduced r: a
    single-bit (or Hamming-weight<=2) input state difference at step 0, and
    a message difference confined to the first few message words, giving a
    few hundred to a few thousand candidate templates at r<=16. STAGE 2
    computes each candidate's exact c_total via the SAME closed-form
    F/G/H/I bitwise truncated-differential probability derivation
    IDEA-20260828-12ce12 needs — implemented independently here purely for
    COUNTING, which doubles as a correctness cross-check of that proposal's
    own computation if both are ever executed. STAGE 3 classifies each
    template "good" iff c_total <= theta(r) (theta(r) declared before
    enumeration, e.g. theta(r) < 64, the point at which the template would
    beat generic 2^64 birthday). STAGE 4 repeats at r in {4,8,12,16} and fits
    a density-vs-r curve. STAGE 5 runs the identical enumeration against a
    null primitive whose bitwise round functions are structure-matched
    (same algebraic degree and width) but not MD4/MD5-specific, to confirm
    any observed decay is a property of F/G/H/I's specific choice rather
    than a generic property of "most templates have high condition count
    regardless of function."
  novelty_status: unverified
  citations:
    - ref: KN-TECH-066
      provenance: internal
      claim: >-
        Message modification / freedom-degree accounting as the general
        principle motivating why template scarcity, upstream of forcing,
        matters as a distinct question.
      verified_by: "idea-generator subagent (read in full during idea generation)"
    - ref: "RFC 1320/1321, pinned in this goal"
      provenance: internal
      claim: F/G/H/I definitions used for the closed-form differential-probability derivation.
      verified_by: "already pinned and validated in this goal"
    - ref: IDEA-20260816-3e6af3
      provenance: internal
      claim: >-
        Condition-counting instrument calibration (predicted-to-actual
        probability ratio) this record's closed-form derivation should
        ultimately be cross-checked against.
      verified_by: "idea-generator subagent (read proposal in full during idea generation, not yet executed)"
    - ref: IDEA-20260816-585c93
      provenance: internal
      claim: >-
        F_t/C_t freedom-accounting methodology for a single DECLARED
        skeleton, discriminated from this record's exhaustive enumeration
        across MANY candidate skeletons/templates.
      verified_by: "idea-generator subagent (read in full during idea generation)"
    - ref: IDEA-20260816-c20a5b
      provenance: internal
      claim: >-
        Mini-MD5 gain-curve proposal executing complete attack arms;
        discriminated from this record, which enumerates the TEMPLATE
        LANDSCAPE rather than executing any attack.
      verified_by: "idea-generator subagent (read in full during idea generation)"
    - ref: IDEA-20260828-12ce12
      provenance: internal
      claim: >-
        The automated search-execution instrument this proposal is designed
        to interpret: if that instrument's cost blows up at r=2/3, this
        proposal's density curve determines whether that is attributable to
        template scarcity or to search-algorithm weakness.
      verified_by: "authored in this same session (sibling record, not yet executed)"
    - ref: "arXiv 2212.02405, cube-and-conquer SAT approach to inverting hash functions"
      provenance: recalled
      claim: >-
        SAT/enumeration-based approaches to hash cryptanalysis exist as a
        broader technique family this proposal's lightweight exhaustive
        enumeration is a small instance of.
      verified_by: null
      note: >-
        Per RQ-MDFIVE-6870c1's own provenance disclosure, never read in
        primary text by any agent in this program; pointer only.
    - ref: "Wang et al., Aoki-Sasaki (message modification / local collision origin)"
      provenance: recalled
      claim: Origin of the local-collision-template concept enumerated here.
      verified_by: null
  assumptions:
    - >-
      The closed-form F/G/H/I bitwise differential-probability derivation is
      correct, cross-checked against exhaustive brute-force truth on a small
      template sample before being trusted for any density figure.
    - >-
      Restricting the enumerated space to Hamming weight <=2 input/message
      differences is representative enough at these round counts that the
      measured density is not a pure artifact of the restriction; this
      restriction is reported explicitly and no claim is made about the
      density of higher-weight templates.
    - >-
      theta(r) is declared BEFORE enumeration and never tuned after seeing
      the density curve (pre-registration discipline matching this goal's
      fixed_before_acquisition convention).
  proof_search_map:
    not_applicable_reason: >-
      This is an empirical/combinatorial enumeration measurement, not a
      claim about a theorem or a named hard-problem exponent; there is no
      baseline algorithm being reproduced or method ceiling being certified
      (contrast IDEA-20260828-69bde4, which does make a method-ceiling claim
      and fills this section in full). Rigor here is carried by the
      pre-registered threshold/weight-restriction discipline and the
      dual-threshold and null-primitive controls specified below.
  predictions:
    - metric: >-
        good-template density (fraction of enumerated templates with
        c_total <= theta(r)) at r=4, relative to r=16
      direction: higher
      minimum_effect: >-
        at least 4x higher density at r=4 than at r=16 if the
        exponential-decay hypothesis holds; the actual ratio is reported
        regardless of direction
    - metric: >-
        fitted exponential decay rate lambda across r=4,8,12,16, with
        goodness-of-fit and leave-one-out cross-validation residual
      direction: different
      minimum_effect: >-
        explicit refusal to pre-commit a numeric lambda (no prior
        measurement in this program); reported as observed with its CI
    - metric: >-
        good-template density on the structure-matched, non-MD5-specific
        null primitive, at the same r values
      direction: different
      minimum_effect: >-
        a null density within a factor of 2 of the signal-arm density at
        every r indicates the measured scarcity is NOT specific to MD4/MD5's
        F/G/H/I choice; a clear divergence indicates it is — both are
        genuine, informative outcomes, reported as observed
  minimal_test:
    design: >-
      Implement the closed-form F/G/H/I bitwise differential-probability
      computation and validate it against brute-force truth on <=20
      templates at r=4 (fully exhaustive, seconds). Then enumerate the full
      Hamming-weight<=2 template space at r=4, 8, 12, 16 (a few thousand
      templates each, O(r) condition-count computation per template — the
      whole sweep is well under a minute), classify by the pre-declared
      theta(r), and fit the density curve. Run the identical pipeline on the
      null primitive in the same invocation.
    controls:
      - >-
        Brute-force cross-check of the closed-form probability formula
        against exhaustive truth on a small sample at r=4.
      - >-
        Structure-matched, non-MD5-specific null primitive run through the
        identical enumeration and threshold.
      - >-
        MD4 vs MD5 paired enumeration at r<=16 (both share Round 1
        identically) — any divergence is an implementation defect.
      - >-
        theta(r) sensitivity sweep: report the density curve at TWO
        independently pre-declared threshold choices (conservative and
        liberal) to confirm the qualitative conclusion (decay vs. flat) does
        not depend on which threshold was chosen.
    required_metrics: [good-template count and total enumerated count per r, density per r per threshold choice, fitted decay rate lambda with CI and leave-one-out residual, null-primitive density per r, "MD4 vs MD5 identical-count check at r<=16", brute-force cross-check pass/fail on the closed-form probability formula]
  falsification_conditions:
    - >-
      The closed-form probability formula fails the brute-force cross-check
      on any sampled template — invalidates every downstream density figure.
    - >-
      MD4 and MD5 densities diverge at r<=16 (both inside round 1, identical
      between them) — an implementation defect, not a finding.
    - >-
      The density curve is flat within the declared null band across
      r=4..16 — falsifies the scarcity hypothesis at this scale, redirecting
      interpretation of any search-instrument failure toward algorithm
      defect rather than combinatorial hardness.
    - >-
      The null primitive's density curve is indistinguishable from
      MD4/MD5's — the measured decay (if any) is generic to any primitive of
      this shape, not specific to MD4/MD5's design.
    - >-
      The two threshold choices give qualitatively different conclusions
      (one decays, the other is flat) — the measurement is
      threshold-artifact-dependent and no single verdict may be reported.
  confounders:
    - >-
      Hamming-weight<=2 restriction may not represent higher-weight,
      structured differences real published attacks use — named as a scope
      limit, not corrected for.
    - theta(r) choice drives the entire measurement; the dual-threshold control exists specifically to catch this.
    - >-
      Extrapolation from r<=16 to r=64 (H1) is a large extrapolation in an
      exponential quantity; small rate errors compound severely.
    - >-
      The null primitive's design could itself be an unrepresentative choice
      of "generic" function.
  interpretation_limits:
    - >-
      Characterizes the template landscape at small, exhaustively enumerable
      round counts and a restricted difference-weight class; makes no claim
      about the full 64-step schedule beyond the explicitly-flagged,
      explicitly-uncertain H1 extrapolation.
    - >-
      A finding of "scarce good templates" at small r names a combinatorial
      obstruction an UNGUIDED search faces; it does not prove no efficient
      automated search exists, since a smarter (non-uniform) search
      algorithm is not evaluated here — that is IDEA-20260828-12ce12's job.
    - No claim is made about MD5's collision resistance, the quarantined path, or any published complexity figure.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The good-template density at reduced round count r, fit as
        density(r) ~ A*exp(-lambda*r), predicts the density at r=64 within
        four consecutive extrapolation-doublings (r=16 to r=64) of its fitted
        order of magnitude.
      rigorous_support: >-
        None — an explicit heuristic extrapolation, imitating the same
        extreme-value/large-deviations extrapolation style this goal's own
        HEUR-H3 already flags as a SECOND-ORDER, explicitly UNTESTED
        extrapolation for the E_d/D_r Poisson heuristic.
      validation_plan: >-
        Fit lambda using all four measured points (r=4,8,12,16), report
        goodness-of-fit, and additionally report the leave-one-out
        cross-validation (refit with r=16 excluded, check whether the r=16
        density falls within the refit's prediction interval) as the
        tail-consistency check analogous to H-MDFIVE-0ca596's HEUR-H1
        chi-square protocol.
  target_complexity:
    time_exponent: >-
      No attack exponent is claimed. The deliverable is a density-vs-round-count
      curve (dimensionless) and a fitted decay rate, valid only at the
      declared small round counts and weight restriction.
    memory_exponent: >-
      Negligible — at most a few thousand templates at r<=16, O(r) per
      template, well under 1 GB total.
    best_known: >-
      No existing incumbent in this RQ's corpus measures template-space
      density at any round count (the sibling proposals IDEA-20260816-3e6af3
      and IDEA-20260816-585c93 measure counting ACCURACY and freedom for a
      SINGLE declared skeleton respectively, neither enumerates the space of
      candidate templates). This is the first proposal in this RQ's corpus
      to measure template-space scarcity as a distinct quantity.
    hidden_overhead: >-
      The enumeration itself is cheap; the hidden cost is entirely whether
      the weight restriction and theta(r) thresholds are chosen honestly
      BEFORE seeing any result — the dual-threshold control exists
      specifically because this failure mode has no other mechanical check.
      The H1 extrapolation asks an exponential fit to hold far beyond its
      fitted range; this is disclosed as the largest source of unreliability
      in this record's forward-looking claim.
    tradeoff_note: Not applicable — a landscape-density measurement, not an algorithm with a tunable resource tradeoff.
  dominated_by: >-
    n/a (no result claimed). Checked against the UNVERIFIED 2^123.4 preimage
    figure, the seconds-scale collision figure, the birthday-enumeration
    cost anchor (EV-MDFIVE-f3e1ca O-2), and the sibling proposals in this
    RQ's corpus (3e6af3's counting-accuracy ratio, 585c93's F_t/C_t curves,
    c20a5b's executed-attack gain curves) — none measures template-space
    density, so this proposal occupies no axis any of them report.
  sota_delta: >-
    No attack; a landscape-characterization contribution whose value is
    entirely in INTERPRETING whatever an automated search (IDEA-20260828-12ce12
    or any future one) measures, by supplying an independent ground-truth
    answer to "how rare are good templates, really" at small scale.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
