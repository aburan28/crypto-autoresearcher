idea:
  id: IDEA-20260808-b188d0
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ALBIN-001
  goal_id: GOAL-DREG-001
  title: Extract the explicit m-dependence of the last-fall-degree bound and evaluate it on
    the Petit-Quisquater diagonal where m grows with n — either the rigorous bound reaches
    the subexponential binary-ECDLP claim and removes its heuristic, or it is vacuous exactly
    where the claim lives, and which of those is true is decidable from the literature alone
  class: algorithm
  claim: 'The corpus records (KN-LIT-7607, KN-LIT-7605) that the last fall degree of Weil-descent
    summation-polynomial systems is bounded INDEPENDENTLY OF THE EXTENSION DEGREE n, that
    the invariant is monomial-order independent unlike the degree of regularity, and that
    this does not yield a subexponential ECDLP algorithm. The corpus does NOT record why not,
    and there is a specific candidate reason that is checkable without any compute: the bound''s
    dependence on the DECOMPOSITION ARITY m. CLAIM: writing the bound as d_lf <= L(m) with
    L free of n, the Petit-Quisquater style analysis operates on a diagonal where m grows
    with n (Gaudry-Diem-style decomposition uses m of order n, and the PQ complexity 2^{O(n^{2/3}
    log n)} arises from balancing factor-base size against a first-fall degree that is assumed
    n-independent), so "independent of n" is evaluated at m = m(n) and the bound is L(m(n))
    — which is n-dependent after all. THE DECIDABLE QUESTION: is L(m) polynomial, exponential,
    or doubly exponential in m? If polynomial, the Macaulay matrix at degree L(m(n)) in nm
    variables has C(nm + L, L) = (nm)^{O(L)} columns and the PQ subexponential claim becomes
    UNCONDITIONAL on the first-fall assumption — a major result obtained by composition of
    two published statements. If exponential or worse in m, the bound is vacuous exactly on
    the diagonal and the first-fall assumption remains load-bearing, which is a named obstruction
    with forward guidance. EITHER ANSWER IS A DELIVERABLE, AND THE WORK IS TRANSCRIPTION PLUS
    ALGEBRA.'
  mechanism: 'This is the exemplar''s move — take an external structural theorem and ask what
    it converts — applied to the one place in this slice where a rigorous bound already exists.
    The programme''s binary lane is anchored on a heuristic (the first-fall-degree assumption)
    that KN-LIT-7607 itself reports is unlikely to hold for a constructed family, and simultaneously
    on a proved bound whose exact form has never been transcribed into this corpus. The composition
    is mechanical once the constant is known: solving cost is C(#variables + d, d)^omega with
    #variables = nm over GF(2) after descent, d = d_lf, so the entire subexponential question
    reduces to the growth of L(m) against the diagonal m(n) that the factor-base balance dictates.
    There is a second, sharper reason to do this: KN-LIT-7607 carries a STANDING CONSEQUENCE
    for this repository — no proposal may claim as new that Weil-descended Semaev systems
    violate semi-regularity, or that the deficit is bounded in system size, without citing
    it and stating what it adds. This record states exactly what it adds: the m-dependence,
    which the standing consequence does not cover and which decides whether the whole binary
    lane has a rigorous or a heuristic foundation.'
  why_not_a_renamed_known_approach: 'Nearest known approach: quoting the first-fall-degree
    assumption and deriving PQ''s 2^{O(n^{2/3} log n)}, which is the published route and is
    heuristic; or quoting the last-fall-degree boundedness, which is rigorous but is quoted
    at fixed m. The difference here is the composition of the two along the diagonal, i.e.
    asking a uniformity question (uniform in n, at m = m(n)) that neither source answers in
    the form needed. It is not a new algorithm and does not claim to be; it is a quantifier
    audit of two existing results, which is exactly the audit KN-TECH-080 mandates before
    compute.'
  proof_search_map:
    bottleneck: The growth of the last-fall-degree bound L(m) in the arity m.
    baseline_embedding:
      parameter_slice: m fixed, n -> infinity recovers the published statement (bound independent
        of n) exactly; that slice is the reproduction check.
      reproduction_check: Transcribe the theorem statement and verify that setting m constant
        gives a constant bound, matching KN-LIT-7605's reported headline.
    observation_collision:
      observable: the pair (d_lf bound, number of descended variables nm)
      distinct_preimage_search: Two systems with the same d_lf bound and very different solving
        costs are easy to construct (change nm at fixed d_lf), so d_lf alone does not determine
        cost. That is not a defect of the invariant but a warning that the cost statement
        needs BOTH factors, and any derivation quoting only "bounded last fall degree" as
        evidence of tractability is committing exactly this identifiability error.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: The composite bound C(nm + L(m), L(m))^omega as the rigorous cost statement,
        replacing the first-fall-degree-conditional one.
      predicted_gain: Removes one heuristic from the binary-ECDLP complexity claim, or localises
        precisely why it cannot be removed.
    quantifier_order: 'The published statement is: FOR ALL m THERE EXISTS L(m) such that FOR
      ALL n, d_lf <= L(m). The claim needed for a subexponential conclusion is: THERE EXISTS
      a slowly growing L such that FOR ALL n, with m = m(n), d_lf <= L(m(n)) AND C(n m(n)
      + L, L) is subexponential in n. The quantifier swap is the entire content, and it is
      exactly the swap the first-fall-degree assumption performs illegitimately.'
    method_ceiling:
      strongest_certifiable_claim: A conditional-free cost bound for binary ECDLP at the transcribed
        L(m), at best. It can never lower the true complexity, only remove or confirm a heuristic.
      nearby_object_control: The HFE systems in the same papers, where the analogous composition
        is reported to give quasi-polynomial claims that also depend on heuristics. If the
        method cannot distinguish the ECDLP case from the HFE case, it has not identified
        the load-bearing structure.
    proof_obligations:
    - claim: the exact form of L(m) as transcribed from primary sources
      responsibility: baseline
    - claim: the diagonal m(n) implied by the PQ factor-base balance
      responsibility: scope
    - claim: the composite Macaulay column count and its asymptotics
      responsibility: runtime
  predictions:
  - observable: transcribed L(m)
    metric: growth class of L in m
    predicted: 'THREE OUTCOMES WITH DISTINCT MEANINGS. Polynomial in m: PQ''s claim becomes
      unconditional and this is the most consequential result in the slice. Singly exponential
      in m: the bound is vacuous on the diagonal m ~ n and the first-fall assumption remains
      load-bearing; forward guidance is to attack the assumption directly. Doubly exponential
      (the shape of deg S_m = 2^{m-2} suggests it is at least singly exponential): the bound
      is vacuous even at modest m and its only use is at m <= 4.'
  - observable: the composite cost exponent on the diagonal
    metric: log_2 of C(n m + L, L)^omega as a function of n
    predicted: Reported as a curve, with the PQ published 2^{O(n^{2/3} log n)} plotted beside
      it. Concordance or crossing is the deliverable.
  - observable: internal consistency with KN-FIND-006
    metric: whether the transcribed statement predicts deficit(3) = 1 and deficit(4) = 8k-1
    predicted: KN-LIT-7607's record explicitly flags as undetermined whether the papers state
      these low-degree counts. Resolving it decides whether KN-FIND-006 has a publishable
      quantitative residue, which is a standing open item in this corpus.
  minimal_test: 'Literature transcription plus algebra; zero experimental compute. (1) Obtain
    the primary texts (IACR ePrint 2015/573 and arXiv 2103.07282, both already identified
    in-corpus). (2) Transcribe the exact theorem, its hypotheses, and the explicit m-dependence,
    into knowledge/literature/ with citation_verified: read. (3) Transcribe the PQ factor-base
    balance and the diagonal m(n) it forces. (4) Compose and emit the curve. (5) Record whether
    the low-degree counts of KN-FIND-006 appear in either source. IF THE SOURCES CANNOT BE
    OBTAINED, the record''s honest output is UNRUN — this session could not reach them (all
    web tooling failed with a backend model error, and eprint.iacr.org is separately recorded
    as 403 from this environment), and NO conclusion may be drawn from the failure.'
  controls:
  - TRANSCRIPTION FIDELITY: quote the theorem verbatim with its numbering; a paraphrase is
      not admissible, and any hypothesis dropped in paraphrase is exactly how a vacuous bound
      gets quoted as a strong one.
  - FIXED-m SLICE must reproduce the published n-independence headline; if the transcription
    does not, the transcription is wrong.
  - HFE NEARBY-OBJECT ARM: apply the same composition to the HFE systems the same papers treat
      and check the method distinguishes the two cases.
  - NEGATIVE CONTROL ON THE DIAGONAL: evaluate at m fixed (not on the diagonal) and confirm
      the composite cost is polynomial in n, as it must be; a composition that fails this
      check is mis-assembled.
  confounders:
  - '"Bounded independently of n" may be stated for a specific system family (a particular
    set of summation polynomials) rather than for the PQ family; the transcription must check
    family identity, and a mismatch voids the composition.'
  - The relation between last fall degree and the degree at which a Groebner basis is actually
    obtained may carry an additive or multiplicative term the headline omits.
  - PQ's analysis may use a different variable count than nm after its own optimisations.
  - Recollection risk: this session could not open any primary source, so every attribution
      here is unverified and is labelled as such.
  falsification_conditions:
  - The transcribed L(m) is polynomial and the composite curve sits below 2^{n^{2/3} log n}.
    The PQ claim becomes unconditional; this would require immediate independent review at
    the breakthrough tier under AGENTS rule 12.
  - The transcribed statement carries a hypothesis that fails on the PQ family. The composition
    is invalid and the record's premise is wrong.
  - The sources are unobtainable. Reported UNRUN, never as evidence in either direction.
  interpretation_limits: Binary fields only; nothing here transfers to prime fields, where
    E2-08 argues the membership degree floor blocks the analogous bound. No new algorithm
    is proposed and no attack is claimed. Any positive outcome is a statement about a published
    claim's dependence on a heuristic, not a new complexity result of this programme.
  assumptions:
  - The two identified sources are the correct primary references.
  - PQ's diagonal is recoverable from the published analysis.
  heuristic_assumptions:
  - id: HA-1
    statement: The last fall degree bound for Weil-descent summation systems has the form
      d_lf <= L(m) with L free of n, and the PQ analysis operates at m = m(n) growing.
    rigorous_ingredient: 'UNVERIFIED: the boundedness statement is relayed from KN-LIT-7605
      and KN-LIT-7607, whose own entries record that full texts were not read. The rigorous
      ingredient is therefore currently a corpus summary of a summary, and the confirmation
      route is step (2) of the minimal test.'
    distribution_imitated: None — this is a structural, not a distributional, assumption.
      It is listed here because it is the load-bearing unverified input.
    validation_route: Transcription from primary text. There is no sampling route; the quantity
      is a theorem, not a random variable. If the text is unobtainable the assumption stays
      unvalidated and the record stays UNRUN.
    tail_checks: Not applicable to a theorem transcription; the analogue is checking every
      hypothesis of the theorem against the PQ family.
  target_complexity:
    time_exponent: The object under audit is the published binary-ECDLP claim 2^{O(n^{2/3}
      log n)} against the generic sqrt(2^n) = 2^{n/2}. This record does not propose to beat
      either; it decides whether the subexponential statement rests on a heuristic or on a
      theorem.
    memory_exponent: The Macaulay matrix at degree d_lf in nm variables requires C(nm+d,d)
      columns; PQ-style analyses are routinely quoted in time and not in memory, and this
      record's composite must report memory beside time, which is itself a correction to how
      the claim is usually stated.
    best_known_baseline: 'For binary ECDLP: Pollard rho at 2^{n/2}, and the published Weil-descent/Groebner
      claims. Whether the latter actually beat the former at any concrete n is disputed in
      the sources themselves.'
    hidden_overhead_disclosure: Everything in the O() of 2^{O(n^{2/3} log n)}; the composition
      here does not resolve those constants and does not pretend to.
    time_memory_tradeoff: The Groebner route is memory-bound and the generic route is not;
      any comparison at fixed time that ignores memory favours the algebraic route artificially,
      and the record's output table must carry both columns.
  sota_delta: 'Potentially large and asymmetric. Best case: removes a heuristic from a published
    subexponential binary-ECDLP claim, which would be a target-class contribution obtained
    by composition rather than by new mathematics. Worst case: a named obstruction (L exponential
    in m makes the rigorous bound vacuous on the diagonal) plus forward guidance (attack the
    first-fall assumption directly, or work at bounded m where the bound bites). Expected
    case: the obstruction, at the cost of one transcription session.'
  dominated_by: 'For binary ECDLP the frontier rows checked are: Pollard rho 2^{n/2} with
    O(1) memory; the published Weil-descent/Groebner claims (heuristic); GHS-type cover attacks
    on weak curves; and the generic multi-target sqrt(T 2^n). This record produces no algorithm
    and occupies no row; its output changes the CONFIDENCE LABEL on one existing row, which
    is not a Pareto position. No row left unchecked.'
  estimated_cost: Implementation none; compute zero; one session IF the sources can be fetched.
    The blocking resource is document access, not CPU.
  recommended_priority: high
  honest_prior_of_survival: 0.75 that L(m) turns out to be at least singly exponential in
    m — deg S_m = 2^{m-2} makes anything polynomial surprising — so the modal outcome is the
    obstruction, which is still worth having because it is currently absent from the corpus.
    0.1 that the polynomial case obtains. 0.4 that the sources are obtainable at all from
    this environment given the recorded 403s.
