idea:
  id: IDEA-20260807-61049d
  question_id: RQ-EQLA-0d3f40
  added: '2026-08-07'
  title: >-
    THE FREE RELATIONS THAT SAY NOTHING: on a j=0 curve every phi-orbit is a
    horizontal line section, so P + phi(P) + phi^2(P) = O identically and a
    phi-stable factor base of size B hands over B/3 relations at zero search
    cost - and the same Z[phi]-module structure that produces them proves they
    span the trivial isotypic component, which lies inside the kernel of the
    evaluation map and therefore determines no logarithm at all

  class: mechanism

  claim: >-
    (A) THE FREE RELATIONS EXIST AND ARE ELEMENTARY. Let E : y^2 = x^3 + b over
    F_p, p = 1 mod 3, zeta a primitive cube root of unity in F_p, and
    phi(x, y) = (zeta x, y). For any affine point P = (x, y) the three points
    P, phi(P) = (zeta x, y), phi^2(P) = (zeta^2 x, y) all have the SAME
    y-coordinate, so they lie on the horizontal line Y = y. That line meets the
    cubic in the three roots of X^3 = y^2 - b, which are exactly x, zeta x,
    zeta^2 x. Three collinear points on a Weierstrass cubic sum to the point at
    infinity. Hence
      P + phi(P) + phi^2(P) = O  for every affine P on E,
    equivalently phi^2 + phi + 1 = 0 in End(E) - the minimal polynomial of a
    primitive cube root of unity, realised geometrically. A phi-stable factor
    base with B/3 complete orbits therefore contains B/3 relations of weight 3
    with right-hand side zero, obtainable with NO decomposition search: they are
    handed over by the construction of the factor base itself.

    (B) AND THEY CARRY EXACTLY ZERO INFORMATION. Consider the evaluation map
    e : Z^B -> G, e(a) = sum_i a_i P_i, whose kernel is the relation lattice L.
    Because the factor base is phi-stable, e is C_3-equivariant, where C_3 acts
    on Z^B by the orbit permutation sigma and on G by multiplication by lambda
    (the eigenvalue of phi, lambda^2 + lambda + 1 = 0 mod N). Any vector a fixed
    by sigma satisfies lambda e(a) = e(a), hence (lambda - 1) e(a) = O; since
    N is prime and lambda != 1, e(a) = O. SO THE ENTIRE TRIVIAL ISOTYPIC
    COMPONENT OF Z^B LIES IN THE RELATION LATTICE. The orbit-sum vectors
    e_i + e_{sigma(i)} + e_{sigma^2(i)} span exactly that component. They are
    free because they are forced, and they are forced because they are in the
    kernel - which is precisely why they determine nothing.

    (C) THE QUANTITATIVE CLAIM, WHICH IS WHAT MAKES THIS A TEST AND NOT AN
    ANECDOTE. Adding the B/3 orbit-sum rows to a relation matrix
      raises rank(M) by exactly B/3   (they are independent as vectors in F_N^B),
      raises rank(M restricted to V_lambda) by exactly 0,
    where V_lambda is the subspace the unknown logarithm vector inhabits
    (IDEA-20260807-0e4d83). Under folding, the orbit-sum row folds to
    1 + lambda + lambda^2 = 0: the zero row. So a relation counter, a rank
    counter and a matrix-density statistic all move by a predictable amount
    while the solvable system does not move at all. This is a concrete,
    pre-computable instance of "structure that inflates every progress metric
    the program currently records and inflates no progress".

    (D) THE DISCRIMINATION. Two explanations of any measured relation-yield
    advantage on a phi-stable factor base are separated by this test:
      EXPLANATION 1 - the phi structure genuinely produces more usable
        relations per unit search. Prediction: informative rank rises with the
        orbit-sum rows included, and the searches-per-informative-relation
        ratio against a size-matched generic base falls below 1.
      EXPLANATION 2 - the phi structure produces more ROWS, all of which are
        either shifts (IDEA-20260807-0e4d83) or orbit sums (this record), and
        the informative content is unchanged. Prediction: informative rank is
        flat, and the searches-per-informative-relation ratio is exactly the
        density penalty, with the factor 3 cancelling.
    EV-STR-003 O-11 measured "the one reproducible effect: a constant factor
    r = 3 in relation collection", searches per relation ROW, and interpreted it
    as the known automorphism-quotient saving. Whether that factor 3 is an
    information gain or a row-count artifact was NOT adjudicated by any arm of
    EXP-STR-002/003/004. This record adjudicates it, and the free orbit-sum rows
    are the sharpest available probe because their information content is
    provably zero and their row count is provably B/3.

    (E) THE J = 1728 CROSS-CHECK, which distinguishes a real mechanism from a
    coincidence. On y^2 = x^3 + a x with p = 1 mod 4 and i^2 = -1, the
    endomorphism is phi(x, y) = (-x, i y) with phi^2 = [-1], so the orbit of x
    under the x-action {x, -x} has length 2 and the "orbit sum"
    P + phi^2(P) = P - P = O is the NEGATION relation and nothing more - it is
    already built into any x-coordinate factor base and is not new. Predicted
    consequence: the free-relation count is B/3 for j = 0 and 0 (beyond
    negation) for j = 1728. A measurement that reported free relations at
    j = 1728 would be measuring its own bookkeeping.

  resource_label: >-
    R1 + R3. R3: the relation lattice as a Z[phi] = Z[zeta_3]-module and the
    identity phi^2 + phi + 1 = 0 in End(E). R1: the orbit is generated by
    multiplying the x-coordinate by zeta in F_p, and the collinearity that
    forces the relation is a statement about the CURVE EQUATION and the line
    Y = y, i.e. about field data, not about group-oracle outputs.

  admissibility: admissible

  admissibility_argument: >-
    Admissible, and its admissibility is instructive rather than incidental. The
    free relations are obtained WITHOUT any group operation and without any
    query to a group oracle: they follow from the shape of the curve equation
    and from the fact that a horizontal line cuts y^2 = x^3 + b in a
    zeta-orbit. A generic algorithm holding only opaque encodings could not know
    that three of its handles sum to the identity without performing the
    additions. So the resource is real and it is R1/R2-flavoured. What the
    proposal then demonstrates is that this real, non-generic, zero-cost
    resource has zero informational value for the linear-algebra stage - which
    is a strictly more useful statement than declaring it inadmissible would
    have been. Recording it as admissible-and-worthless is the honest label.

  discriminated_from:
    - >-
      IDEA-20260807-0e4d83, which concerns SHIFTED rows (phi-images of harvested
      relations) and proves they contribute zero informative rank. This record
      concerns rows that were never harvested at all: they exist before any
      search, they have right-hand side zero rather than a target coefficient,
      and their vanishing under folding is 1 + lambda + lambda^2 = 0 rather than
      a scalar-multiple identity. The two are complementary and their
      predictions are independent: 0e4d83's raw_gain is about 2R (R = harvested
      rows), this record's raw gain is exactly B/3 and does not depend on R.
    - >-
      IDEA-20260727-001, which computes factor-base logarithms by brute force to
      test determinacy of the UNKNOWNS. This record needs no logarithm and
      concerns an explicit generating set for a sublattice of the relation
      lattice. "Orbit sum", "trace relation" and the trivial-isotypic-in-kernel
      argument appear in no prior record of this repository.
    - >-
      EV-STR-002's "density penalty ~2-3x" and EV-STR-003 O-11's "searches per
      relation row, ratio 2.62x / 3.17x / 2.97x / 3.20x". Those are row-count
      measurements. This record supplies the quantity that converts them into
      information measurements and predicts, in advance, that the conversion
      removes the factor 3 entirely.
    - >-
      The classical automorphism-quotient factor-base reduction
      (Wiener-Zuccherato KN-LIT-042, Duursma-Gaudry-Morain, KN-TECH-018) and the
      Frobenius-orbit reduction of eprint 2020/1315. Those are the CORRECT way
      to spend the structure - work with orbit representatives from the start.
      This record's free relations are what you get if you do NOT quotient, and
      the point is that they are worth nothing, which is the same statement seen
      from the other side.

  object_first_candidate:
    tracked_object: >-
      THE TRIVIAL ISOTYPIC COMPONENT of the relation lattice: the sublattice
      L_0 = { a in Z^B : sigma(a) = a } together with its image under the
      evaluation map e : Z^B -> G. Followed as the factor base grows and as
      relations are harvested.
    lossiness: >-
      LOSSY, and provably so: the projection Z^B -> Z^{B/3} sending a to its
      orbit-sums forgets 2B/3 dimensions and a is not recoverable from its
      image. It passes the section-2 test in the discarded-compatibly sense as
      well: sigma acts as the identity on L_0 and as the primitive cube roots on
      the complementary components, so the operations never mix them back
      (Maschke, gcd(3, N) = 1). The finding is that the retained part
      propagates deterministically to ZERO - e(L_0) = {O} - which is the
      strongest possible form of "propagates deterministically" and the weakest
      possible form of "useful".
    propagation: >-
      One step, exactly: e(sigma a) = lambda e(a). On L_0 this gives
      e(a) = lambda e(a), hence e(a) = O. Under enlarging the factor base by one
      orbit, L_0 gains one generator and the free-relation count rises by 1.
      Under harvesting a relation, L_0 is unchanged - harvested relations never
      enter it, because a harvested relation has a nonzero right-hand side and
      L_0 consists of relations with right-hand side zero.
    survival_score: >-
      Survives: arity, factor-base rule, curve within the D_0 = -3 family,
      relabelling, and the choice of orbit representative. Dies at: orbit length
      2 (j = 1728, where the orbit sum degenerates to negation), at any curve
      with |Aut| = 2 (no orbits at all), and at any composite N (where
      lambda - 1 need not be invertible and the argument in (B) requires care -
      the lane's prime-order assumption is load-bearing exactly here, and that
      is worth recording because it is the one place a non-prime subgroup would
      change the conclusion).

  mechanism: >-
    STEP 1 (zero compute, derivation, archived first). Write out the
    collinearity proof of P + phi(P) + phi^2(P) = O and the
    trivial-isotypic-in-kernel argument of (B). Both are a few lines. Include
    the j = 1728 degeneration.

    STEP 2 (seconds). On each toy j = 0 instance, VERIFY the identity
    numerically: for 100 random affine points P, check that
    E.add(E.add(P, phi(P)), phi2(P)) is None (the point at infinity) using the
    existing harness/toycurve.py arithmetic. This is a known-answer test for the
    curve arithmetic as much as for the identity, and it costs nothing.

    STEP 3 (the measurement). Build a phi-stable factor base of B = 3k
    x-coordinates. Assemble:
      M_h  = the R harvested relation rows (with right-hand sides),
      M_f  = the B/3 free orbit-sum rows (right-hand side 0),
      M_hf = their concatenation.
    Report rank(M_h), rank(M_hf), and the folded ranks rank(tilde-M_h),
    rank(tilde-M_hf). Predicted: rank(M_hf) - rank(M_h) = B/3 exactly;
    rank(tilde-M_hf) - rank(tilde-M_h) = 0 exactly; and every folded free row is
    the zero vector, which is checkable entrywise before any rank is computed.

    STEP 4 (the conversion that matters). Define and report
      searches_per_informative_relation :=
        (total decomposition attempts) / (increase in folded rank),
    for the phi arm and for a size-matched generic factor base on the same
    curve with the same arity and budget. EV-STR-003 O-11 reported the same
    ratio with ROWS in the denominator and measured about 3. Predicted here:
    with folded rank in the denominator the ratio equals the measured density
    penalty, so the factor 3 disappears and the net is close to 1.

    STEP 5 (the free-relation stress test, and the one way this could be
    useful). Ask whether the free rows help ANY downstream step even though
    they add no rank: (a) do they reduce the number of harvested relations
    needed to reach full folded rank? Predicted no, by (B). (b) Do they change
    the peeling behaviour of structured Gaussian elimination by supplying
    weight-3 rows? That is a real, separable question and it is handed to
    IDEA-20260807-d20846 rather than answered here. (c) Do they serve as a
    zero-cost CERTIFICATE that the factor base is genuinely phi-stable and
    correctly lifted? YES, and this is a genuine deliverable: the identity fails
    the moment an orbit is truncated or a lift is inconsistent, so
    "all B/3 orbit sums evaluate to O" is a cheap, independent integrity check
    on exactly the two failure modes EV-STR-003 O-4 and EV-STR-004 IL0 flagged.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Ripgrep over the whole repository on 2026-08-07:
      "orbit sum|orbit-sum|trace relation|horizontal line|collinear"
      (case-insensitive); "isotypic|commutant|Wedderburn"; "relation lattice";
      "free relation"; "phi\\^2 \\+ phi \\+ 1|lambda\\^2 \\+ lambda \\+ 1".
      Full reads of IDEA-20260726-002, IDEA-20260727-001, H-STR-002, EV-STR-002,
      EV-STR-003, EV-STR-004, H-EQJ-001, EV-EQJ-001, H-ENDO-001.
    results: >-
      "lambda^2 + lambda + 1 = 0 mod n" appears in IDEA-20260727-001 and
      H-ENDO-001, in both cases as a statement about the EIGENVALUE on G. The
      corresponding identity phi^2 + phi + 1 = 0 in End(E), its geometric
      realisation as a horizontal line section, and the resulting free relations
      appear in NO record: "orbit sum", "orbit-sum" and "trace relation" return
      zero ECDLP-relevant hits, and "collinear" hits only unrelated Xedni and
      AES material. The trivial-isotypic-in-kernel argument appears nowhere; the
      only isotypic records are H-EQJ-001 / EV-EQJ-001 / DEC-20260718-006, on a
      different group and a different module.
    verdict: >-
      ADAPTATION. That a primitive cube root of unity satisfies
      t^2 + t + 1 = 0 and that three collinear points sum to O are both
      textbook, and their combination on y^2 = x^3 + b is elementary enough that
      it is very likely folklore in the GLV literature; no novelty is claimed
      against the external literature and a Stage-0 check is part of the design.
      New TO THIS CORPUS: the identity, the free-relation count B/3, the
      zero-information proof, the conversion of EV-STR-003 O-11's factor 3 from
      rows to information, and the use of the identity as a factor-base
      integrity certificate.

  null_object_control: >-
    MANDATORY AND BLOCKING.
    NULL 1 - FAKE ORBITS (the matched null of the same shape). Partition the
    SAME B x-coordinates into B/3 arbitrary triples that are NOT phi-orbits,
    matched on count, on weight-3 row structure and on column-orbit partition,
    and append their "orbit-sum" rows. PREDICTED: those rows are NOT relations -
    the three points do not sum to O - so appending them corrupts the system,
    and the check "does the row evaluate to O" must FAIL on essentially all
    B/3 fake triples while succeeding on all B/3 genuine ones. This is the
    sharp discriminator and it is a binary test with no free parameters.
    DECAY PARAMETER: the fraction f of genuine phi-orbits among the appended
    triples. The count of rows passing the "evaluates to O" check must be
    exactly f * B/3, i.e. it must decay LINEARLY to zero as f -> 0. Anything
    else means the check is not measuring what it claims.
    NULL 2 - RANDOM MATRIX OF IDENTICAL SHAPE AND DENSITY. A random 0/1 matrix
    with the same dimensions, weight-3 rows and the same column-orbit partition.
    PREDICTED: its folded rows are NOT zero (a random weight-3 row supported on
    one orbit folds to 1 + lambda + lambda^2 only if its three ones sit exactly
    on one orbit with equal coefficients). The fraction of folded-to-zero rows
    in the null is the false-positive rate of the "free relation" detector and
    must be reported.
    NULL 3 - PLANTED POSITIVE. A synthetic set of weight-3 rows that DO carry
    information (three independent factor-base elements from three different
    orbits summing to a known nonzero target). The instrument must report a
    folded-rank increase there, or it cannot see information and every zero it
    reports is void.

  assumptions:
    - >-
      E : y^2 = x^3 + b with b != 0, p = 1 mod 3, p > 3, so that j = 0 and a
      primitive cube root of unity exists in F_p. Checked per instance.
    - >-
      N is prime and lambda != 1 mod N. Load-bearing: the argument
      (lambda - 1) e(a) = O implies e(a) = O uses primality. On a composite-order
      subgroup the trivial component maps into the (lambda - 1)-torsion, which
      need not be zero, and the conclusion changes. Recorded because it is the
      one hypothesis whose relaxation would change the answer.
    - >-
      Every orbit in the factor base is complete (length exactly 3) and the
      x-coordinates in an orbit are distinct, which fails exactly when x = 0
      (the single point with x = 0 is fixed by phi). x = 0 must be excluded from
      the factor base and its exclusion recorded; it is the only fixed point of
      the x-action and it is a genuine degenerate case, not a rounding issue.
    - >-
      The chosen lift of each x-coordinate is consistent with phi. For j = 0
      this is automatic because phi preserves y; see IDEA-20260807-add964 for
      why it is NOT automatic at j = 1728.
    - Toy scale, p up to about 32 bits, claim tier `toy`.

  proof_search_map:
    bottleneck: >-
      None computational. The load-bearing steps are (i) a collinearity argument
      and (ii) a two-line equivariance argument. The lane's real bottleneck,
      which this record prices rather than removes, is relation collection.
    baseline_embedding:
      parameter_slice: >-
        Any j = 0 toy instance already generated by
        harness/endomorphism_la.py::_generate_j0_instance. The baseline being
        embedded is the classical automorphism-quotient factor base
        (KN-TECH-018): working with B/3 orbit representatives from the start.
        This proposal's claim is that the orbit-sum rows recover exactly zero
        beyond that baseline, so the baseline is reproduced by construction and
        the "improvement" is measured against it as exactly 0.
      reproduction_check: >-
        Symbolic: fold the orbit-sum row, obtain 1 + lambda + lambda^2, and
        evaluate it to 0 using the verified root of L^2 + L + 1 mod N. Plus a
        frozen fixture: 100 random points per instance passing
        P + phi(P) + phi^2(P) = O in the committed toy arithmetic.
    observation_collision:
      observable: >-
        The predicate "this weight-3 row evaluates to the point at infinity",
        and the integer count of rows satisfying it.
      distinct_preimage_search: >-
        REQUIRED. Distinct ground-truth objects with the same observable: a
        genuine phi-orbit, and any OTHER collinear triple on the curve - every
        line meets the cubic in three points summing to O, so there are about
        p^2 such triples and only about p/3 of them are phi-orbits. The
        collision is therefore massive and it bounds the claim precisely: "sums
        to O" does NOT identify a phi-orbit. The separating condition is that a
        phi-orbit is a collinear triple whose x-coordinates are in ratio
        1 : zeta : zeta^2, and that extra condition must be stated wherever the
        observable is used. This collision is a genuine restriction on the
        method and is recorded as such rather than waved away.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable ("sums to O") fixed and vary the forgotten
          structure: generic collinear triples versus phi-orbits. The intrinsic
          invariant distinguishing them is the x-ratio being a primitive cube
          root of unity, which is checkable in one field division.
        predicted_gain: >-
          Bounds what the free-relation detector can certify, and supplies the
          exact side condition that makes the factor-base integrity certificate
          of STEP 5(c) sound.
      - transform: stronger_invariant
        proposed_object: >-
          Track the whole trivial isotypic sublattice L_0, not just its
          generators. L_0 has rank B/3 over Z and is entirely inside the kernel;
          preserving that whole object rather than the B/3 rows is what makes
          the "zero information" statement uniform in the harvest history.
        predicted_gain: >-
          Uniformity: the conclusion holds regardless of which relations were
          harvested or in what order, which a per-row argument would not give.
    quantifier_order: >-
      Intended: FORALL j = 0 curves E/F_p with p = 1 mod 3 and N prime, FORALL
      affine P on E, P + phi(P) + phi^2(P) = O; and FORALL a in Z^B with
      sigma(a) = a, e(a) = O. Both witnesses (zeta and lambda) depend on the
      CURVE only. The dangerous weaker reading, NOT claimed: for each factor
      base there EXISTS a set of free relations - which would permit the free
      relations to depend on the harvest and would make the zero-information
      claim non-uniform.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On a phi-stable factor base over a j = 0 prime-field curve with prime
        N, the B/3 orbit-sum relations exist, cost nothing, and contribute
        exactly zero rank to the system determining the factor-base
        logarithms." It can NEVER certify anything about relation DENSITY, about
        harvested relations, about arity, or about any curve with |Aut| = 2.
      nearby_object_control: >-
        The nearest object where the hoped-for conclusion fails: a factor base
        stable under a SET map of x-coordinates that is not induced by an
        endomorphism - for instance closure under x -> u x for u of
        multiplicative order 5 in F_p^*. Those orbits do NOT sum to O and supply
        no free relations at all. A method that reported free relations there
        would be measuring its own bookkeeping and would have identified nothing.
    proof_obligations:
      - claim: P + phi(P) + phi^2(P) = O for every affine P on y^2 = x^3 + b.
        responsibility: correctness
      - claim: The trivial isotypic component of Z^B lies in ker(e).
        responsibility: correctness
      - claim: The orbit-sum row folds to the zero row over F_N.
        responsibility: correctness
      - claim: rank(M_hf) - rank(M_h) = B/3 exactly.
        responsibility: size
      - claim: The fake-orbit null fails the "evaluates to O" check.
        responsibility: soundness
      - claim: x = 0 is excluded and the exclusion is recorded.
        responsibility: scope

  heuristic_assumptions:
    - id: HEUR-L5-3
      statement: >-
        NO HEURISTIC IS LOAD-BEARING FOR (A), (B) OR (C). The collinearity
        identity, the kernel containment and the folded-row vanishing are exact.
        Recorded explicitly rather than by omission.
      rigorous_support: >-
        (A) is the group law on a Weierstrass cubic plus the factorisation of
        X^3 - (y^2 - b). (B) is equivariance plus primality of N. (C) is linear
        independence of the B/3 orbit-indicator vectors, which is immediate.
      validation_plan: >-
        Known-answer numerical check on 100 random points per instance; that
        validates the IMPLEMENTATION against the theorem and is reported as
        such, never as evidence for the theorem.
    - id: HEUR-L5-4
      statement: >-
        The measured density penalty of a phi-stable factor base against a
        size-matched generic base of the same B is a bounded constant
        independent of B, and lies in [2, 4] at toy scale.
      rigorous_support: >-
        EV-STR-002 reports "density penalty ~2-3x" and EV-STR-003 O-11 reports
        searches-per-row ratios 2.62 / 3.17 / 2.97 / 3.20 at four instances.
        Neither is a theorem and EV-STR-002's provenance is contested
        (DEC-20260727-009); this is an expectation imitating the standard
        heuristic that decomposition probability depends on factor-base SIZE and
        not on its algebraic shape - the same assumption that fails for
        arithmetic-progression bases (EV-STR-001, 17.5x to 4128x) and therefore
        must be measured rather than assumed.
      validation_plan: >-
        Measure hit rate on the phi arm and the size-matched generic arm at at
        least three B values spanning an order of magnitude, with enough targets
        that the per-cell standard error is below 20% (EV-STR-002's unresolved
        confound was exactly insufficient targets at large B). Predicted
        distribution: hit counts Poisson with mean (attempts) * B^m / (m! N).
        Tail check: instances with zero hits are reported, not smoothed, as
        EV-STR-001 did with its 14/36 zero-hit instances. TOY SCALE ONLY.

  predictions:
    - metric: free_relation_count (rows passing the "evaluates to O" check)
      direction: higher
      minimum_effect: >-
        EXACTLY B/3 on the phi arm (all genuine orbits), and at most a
        negligible false-positive count on NULL 1. A phi arm count below B/3
        localises a truncated or mis-lifted orbit and is a factor-base integrity
        failure, not a mathematical result.
    - metric: rank(M_hf) - rank(M_h) over F_N (unfolded)
      direction: higher
      minimum_effect: >-
        EXACTLY B/3. This is the size of the rank illusion contributed by the
        free rows and it is predicted exactly, in advance, with no tolerance.
    - metric: rank(tilde-M_hf) - rank(tilde-M_h) (folded, informative)
      direction: lower
      minimum_effect: >-
        EXACTLY 0. Every folded free row must be the all-zero vector, checkable
        entrywise before any rank computation. One nonzero folded free row
        falsifies either the identity or the implementation.
    - metric: >-
        searches_per_informative_relation, phi arm divided by size-matched
        generic arm
      direction: different
      minimum_effect: >-
        Predicted to equal the measured density penalty, i.e. in [2, 4] and NOT
        the value 1/3 that a naive reading of the orbit reduction would give,
        and NOT the value about 1/3 that EV-STR-003 O-11 measured with ROWS in
        the denominator. The gap between the row-denominated 1/3 and the
        information-denominated 2-4 is a factor of 6 to 12 and is the headline
        number of this proposal. A measured ratio below 1 would mean the phi
        structure genuinely buys information and would move the lane.
    - metric: free_relation_count under NULL 1 as a function of genuine fraction f
      direction: lower
      minimum_effect: >-
        Exactly linear in f: count = f * B/3 within Poisson noise, decaying to
        0 at f = 0. A flat or slowly decaying curve voids the detector.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): archive the two derivations.
      STAGE 1 (seconds): numerically verify P + phi(P) + phi^2(P) = O on 100
      random points per instance. HARD GATE - a failure is a curve-arithmetic
      bug and everything downstream is void.
      STAGE 2 (seconds): build B = 3k phi-stable factor bases excluding x = 0;
      assert 3 | B, sigma^3 = identity, B/3 orbits of length exactly 3.
      STAGE 3 (minutes): assemble M_h, M_f, M_hf; check every folded free row is
      zero ENTRYWISE; compute the four ranks; report the two differences.
      STAGE 4 (minutes): NULL 1 across f in {0, 1/4, 1/2, 3/4, 1}; NULL 2;
      NULL 3 planted positive.
      STAGE 5 (hours, the expensive part and the only expensive part): measure
      hit rates on the phi arm and the size-matched generic arm with enough
      targets for a 20% standard error, at three B values, and report
      searches_per_informative_relation for both.
      Everything except STAGE 5 runs in under a minute per instance in pure
      Python on the existing harness.
    controls:
      - >-
        NULL 1 fake-orbit triples, swept over the genuine fraction f - the decay
        test and the primary discriminator.
      - NULL 2 random weight-3 matrix of identical shape, density and column-orbit
        partition - gives the false-positive rate of the detector.
      - NULL 3 planted informative weight-3 rows - must raise folded rank.
      - >-
        Size-matched generic factor base with B columns on the same curve, same
        arity, same target budget - isolates phi structure from factor-base size.
      - >-
        j = 1728 arm: the same pipeline on a D_0 = -4 curve, where the predicted
        free-relation count beyond negation is 0.
      - >-
        Matched Pollard rho with negation (0.886 sqrt(N/6) on these curves) and
        matched BSGS, in group operations, for the Pareto row.
    required_metrics:
      - free_relation_count, phi arm and every null arm
      - rank(M_h), rank(M_hf), rank(tilde-M_h), rank(tilde-M_hf)
      - entrywise check that every folded free row is zero (boolean per row)
      - hit rate and attempts, phi arm and size-matched generic arm, per B
      - searches_per_informative_relation, both arms
      - NULL 1 decay curve over at least five values of f
      - count of excluded x = 0 and of truncated or incomplete orbits
      - sha256 of the factor base and of the row list per cell
      - matched rho and BSGS group-operation counts and BSGS memory

  falsification_conditions:
    - >-
      P + phi(P) + phi^2(P) != O for any affine P on a verified j = 0 curve.
      The identity is false as implemented; halt, because it is a two-line
      theorem and the failure is a curve-arithmetic bug that voids the entire
      STR line of work, not only this record.
    - >-
      Any folded free row is nonzero. Either lambda is the wrong root, or sigma
      does not match phi, or the orbit is truncated. Each is separately
      checkable and none is a discovery.
    - >-
      rank(M_hf) - rank(M_h) != B/3. The free rows are not independent as
      vectors, which means the factor base has repeated orbits or the row list
      was deduplicated - the same dedup pathology EV-STR-003 O-4 traced.
    - >-
      NULL 1 shows free relations at f = 0. The detector fires on non-orbits;
      it is measuring collinearity or bookkeeping, not phi structure, and every
      count it produced is void.
    - >-
      searches_per_informative_relation on the phi arm comes out BELOW 1 against
      the size-matched generic arm. Then the phi structure buys genuine
      information per unit search, EXPLANATION 1 fires, and the result requires
      independent review before any interpretation - this is the outcome the
      record would most like to be wrong about, and it is stated so that it
      cannot be quietly absorbed.

  confounders:
    - >-
      x = 0 IS FIXED BY phi. The single point with x = 0 (which exists on
      y^2 = x^3 + b iff b is a QR) has a length-1 orbit and 3P = O for it, i.e.
      it is a 3-torsion point. Since N is prime and N > 3, it is not in G. It
      must be excluded and its exclusion recorded; including it silently would
      corrupt both the orbit count and sigma.
    - >-
      COLLINEARITY IS NOT SPECIAL TO phi. Every line meets the cubic in a triple
      summing to O, so "sums to O" alone identifies nothing. The x-ratio
      condition is the separator and must be applied.
    - >-
      DEDUPLICATION. The committed harness suppresses duplicate rows
      (harness/endomorphism_la.py lines 303-304 and 350-351). If a free row
      coincides with a harvested row it will be silently dropped and the count
      will be short by an amount that depends on the harvest. Deduplication must
      be disabled or logged per row.
    - >-
      RIGHT-HAND SIDES. Free rows have right-hand side 0 and harvested rows do
      not. A driver that stores bare incidence vectors (EV-STR-003 O-9) cannot
      tell them apart and will produce a meaningless mixed system.
    - >-
      SMALL B. At B = 27 the free rows number 9 and the folded matrix is 9 x 9;
      any rank statement there has almost no resolution.

  interpretation_limits:
    - >-
      THE LINEAR-ALGEBRA STAGE IS NOT THE DOMINANT COST OF PRIME-FIELD INDEX
      CALCULUS - RELATION COLLECTION IS. EV-STR-001 measured the Wiedemann
      linear-algebra share at 0.4% to 3% of the charged total at every tested
      size. This record's headline quantity is a relation-collection quantity
      precisely because that is where the cost is; its linear-algebra half
      (rank illusion of size B/3) is a measurement-hygiene result and nothing
      more.
    - >-
      Toy tier only. Claim tier `toy`. No crypto-scale statement is licensed.
    - >-
      A confirmed zero-information verdict on the free relations is a scope
      correction on how relation YIELD is counted in this lane. It does not
      reject H-STR-002's mechanism, does not restore it, and moves no status.
    - >-
      The free relations remain genuinely useful for ONE purpose - as a
      zero-cost integrity certificate on factor-base construction - and that
      use survives every negative outcome above. It is a tooling contribution,
      not a cryptanalytic one, and must be labelled as such.

  reachability_gate: >-
    T5's isogeny-walk form does not apply: one curve, no movement between
    curves. T4 binds: the order-3 x-action, and hence every free relation in
    this record, exists only when D_0 = -3, which is fixed by the isogeny class
    and unreachable from a curve whose class lacks it at any cost. The lane is
    permanently scoped to the D_0 = -3 family, which is density zero among
    prime-field curves. Within that family the object is free - B/3 free
    relations for B multiplications by zeta. SCOPE NOTE, not an attack claim:
    secp256k1 has a = 0 and hence lies in this family; this record's own
    prediction is that the free relations there would carry zero information
    too.

  target_complexity:
    time_exponent: >-
      NO EXPONENT MOVES AND NONE IS CLAIMED. This record claims strictly LESS
      than a constant factor: it claims the constant is 1, i.e. the free
      relations buy nothing. The only constant genuinely available in the lane -
      3 in relations needed and 9 in linear-algebra operations against a
      size-matched generic base - is the published orbit reduction of eprint
      2020/1315 with extension degree n replaced by 3, and it is a constant
      because |Aut(E)| <= 6 over a prime field. Nothing here can produce
      anything super-constant and nothing is asserted to.
    memory_exponent: >-
      Unchanged. The free rows would ADD B/3 rows of weight 3 to storage while
      adding zero rank, so naive inclusion is a small memory regression, not a
      saving. Quantified: (B/3) * 3 = B extra stored entries for zero rank.
    best_known: >-
      Parallel rho with distinguished points, 0.886 sqrt(N) group operations,
      O(1) memory (KN-TECH-001, KN-TECH-006); automorphism-discounted rho on
      j = 0, about 0.36 sqrt(N) (KN-TECH-018); BSGS at 2 sqrt(N) time and
      sqrt(N) memory, full cost N^{2/3+o(1)} (KN-TECH-031). For the factor-base
      side specifically: the classical orbit-representative factor base, which
      already realises the factor 3 and against which the free relations add 0.
    hidden_overhead: >-
      No o(1) to disclose, since no asymptotic claim is made. Disclosed instead:
      the factor-3 relation saving that the orbit reduction genuinely offers is
      contingent on HEUR-L5-4 (bounded density penalty), and EV-STR-002's 2-3x
      measurement would cancel it exactly. The record does not assume either way.
    tradeoff_note: >-
      No cryptanalytic tradeoff. The one operational tradeoff: the free rows are
      free to GENERATE and cost storage and solver time to CARRY, so the correct
      engineering choice is to fold first and never materialise them - which is
      the same as using orbit representatives from the start.

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES, and not null. As an
    attack it mounts none and is dominated on every axis by (1) parallel rho at
    0.886 sqrt(N) time and O(1) memory (KN-TECH-001, KN-TECH-006); (2) the
    automorphism-discounted rho at about 0.36 sqrt(N) on exactly these j = 0
    curves (KN-TECH-018), which is the correct baseline here and dominates on
    time and memory; (3) BSGS at 2 sqrt(N) time and sqrt(N) memory
    (KN-TECH-031), which dominates on time and is the relevant competitor for
    any memory-heavy variant. As a RELATION-YIELD MECHANISM it is dominated by
    the classical orbit-representative factor base (KN-TECH-018, and eprint
    2020/1315 in the extension-field setting), which obtains the same factor 3
    without materialising any redundant row. As an INTEGRITY CHECK on
    factor-base construction it is dominated by nothing in this repository -
    there is currently no such check at all, which is why STEP 5(c) is the one
    part of this record that survives every negative outcome.
  sota_delta: >-
    Zero speedup against any attack baseline. Quantitatively: B/3 relations
    obtained at zero search cost, contributing exactly 0 to informative rank and
    exactly B/3 to raw rank; the predicted correction to EV-STR-003 O-11's
    reproducible factor of about 3 is that the information-denominated ratio is
    the density penalty (2-4) rather than 1/3, a discrepancy of 6x to 12x in how
    the lane's single reproducible effect has been read; and one new zero-cost
    integrity certificate covering the two failure modes (orbit truncation,
    lift inconsistency) that EV-STR-003 O-4 and EV-STR-004 IL0 left open.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.97 that P + phi(P) + phi^2(P) = O verifies numerically - it is a
    collinearity argument. 0.9 that the free rows fold to exactly zero and raise
    unfolded rank by exactly B/3. 0.85 that NULL 1 fails as predicted. The
    genuinely uncertain number is STAGE 5: about 0.45 that
    searches_per_informative_relation lands in [2, 4] as HEUR-L5-4 predicts,
    about 0.45 that it lands elsewhere for reasons the density measurement will
    expose, and about 0.10 that it lands below 1, which would be the one
    interesting event in the lane and would require independent review. The
    record is worth running because its cheap half is near-certain and settles
    how the lane's single reproducible number is read.

