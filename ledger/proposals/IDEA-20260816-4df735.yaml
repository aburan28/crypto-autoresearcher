idea:
  id: IDEA-20260816-4df735
  question_id: RQ-FAEST-001
  added: '2026-08-16'
  title: 'One proof shell, three relations: run the identical MPC-in-the-head machinery over a code-shaped
    relation, a Boolean-circuit-shaped relation and a quadratic-system-shaped relation with every
    proof-layer parameter held fixed, and attribute each measured difference to the relation rather
    than to the paradigm by construction.'
  class: composition
  claim: '(A) THE SHELL AND THE RELATION ARE SEPARABLE IN CODE, AND SEPARABILITY IS TESTABLE. An MPC-in-the-head
    proof shell can be written against a relation interface exposing exactly three operations: share
    a witness, evaluate the relation''s check on a share vector, and reconstruct. Part (A) claims
    that three relations of genuinely different character, a syndrome-decoding-shaped check, a Boolean-circuit-shaped
    check and a quadratic-system-shaped check, can all be expressed through that interface with no
    shell modification, and that whether they can is itself the first measurable outcome: a relation
    requiring a shell change has demonstrated that the paradigm is not relation-agnostic at the level
    claimed. (B) THE ATTRIBUTION IS BY CONSTRUCTION, NOT BY ARGUMENT. With shell parameters held fixed
    and only the relation swapped, any measured difference in soundness, opening size, party-count
    sensitivity or verifier work is attributable to the relation, and any measured QUANTITY THAT DOES
    NOT MOVE across all three relations is a paradigm-level quantity. Part (B) claims that at least
    two measured quantities are invariant across all three relations to within one part in a thousand,
    and at least one moves by more than ten percent, so the partition is nonempty on both sides. (C)
    THIS IS THE BUCKET''S STRUCTURAL GIFT EXECUTED RATHER THAN INVOKED. Three standardization candidates
    sharing one paradigm over three problems is a natural experiment that cannot be run on the schemes
    themselves, since they differ in a hundred ways at once. Running it on a shell where exactly one
    thing varies is the controlled version, and part (C) claims the controlled version is what licenses
    any paradigm-versus-scheme statement in this bucket. (D) WHAT IS NOT CLAIMED. No forgery, no break,
    no speedup, no security consequence. It is NOT claimed that the three shaped relations are SDitH''s,
    FAEST''s or MQOM''s relations; no specification has been read, and they are declared shapes chosen
    to differ in arity, field and check density. It is NOT claimed that an invariant quantity in the
    shell is invariant in the real schemes: the shell holds fixed what the real schemes do not, and
    that is the design''s strength as a control and its limit as a model. Extrapolating any measured
    invariance to the deployed schemes is forbidden by this contract.'
  mechanism: 'STAGE 1 defines the relation interface and implements the shell once. STAGE 2 implements
    three relations behind it: R1 a parity-check-shaped relation over a small field with a fixed-weight
    witness, R2 a Boolean-circuit-shaped relation with AND-depth as a parameter, R3 a quadratic-system-shaped
    relation over a small field. Each is a SHAPE, not a scheme''s relation, and each is instantiated
    at several sizes so relation size and relation kind are separated. STAGE 3 measures, at every
    (relation, N, tau, field) point, the same battery: exact soundness by enumeration where affordable,
    emitted signature bytes, verifier operation count, and opening size distribution. STAGE 4 computes
    the invariance table: for each measured quantity, the coefficient of variation ACROSS relations
    at matched shell parameters. Quantities with cross-relation variation below one part in a thousand
    are called shell-level; those above ten percent are called relation-level; the band between is
    reported as undetermined rather than forced into a column. STAGE 5 runs the null relation: a trivial
    relation whose check always passes regardless of the share vector. Every shell-level quantity
    must be unchanged by it, since it changes nothing about the shell, while every relation-level
    quantity must move. A quantity that moves under the null relation but was classified shell-level
    is misclassified, and this is the control that makes the partition falsifiable rather than definitional.
    STAGE 6 runs the shell-modification audit: it records, per relation, whether any shell line had
    to change, and reports that count as the primary evidence about part (A). A count above zero is
    the informative negative outcome, and it is a measured obstruction rather than a fatigue report
    because it names the exact shell line and the relation feature that forced it.'
  novelty_status: unverified
  novelty_screen:
    method: 'grep -rli in ledger/proposals for: MPCitH, cross-scheme, relation, three schemes, paradigm,
      TCitH, VOLE. Read titles and class of IDEA-20260805-7d97be, IDEA-20260807-f73d98 (which matched
      SDitH, FAEST and MQOM simultaneously), IDEA-20260805-7abf04, IDEA-20260808-721f2b, IDEA-20260813-c9bec2,
      IDEA-20260805-38048d. Read RQ-FAEST-001, RQ-SDITH-001 and RQ-MQOM-001 in full.'
    results: IDEA-20260807-f73d98 is the only proposal file found matching all three scheme names
      in one record, and IDEA-20260731-005 also matches FAEST and MQOM together; neither was found
      to implement a shell. IDEA-20260805-7d97be is the repository's existing cross-scheme control,
      but its arms are structured versus unstructured HARD PROBLEMS with MQOM as the unstructured
      null, i.e. it varies the problem to test an attack device, not the relation inside a fixed proof
      shell. IDEA-20260813-c9bec2 compares an actual MQ map against a parameter-matched random quadratic
      system, again a hard-problem control. No record was found that holds proof-layer parameters
      fixed and swaps the relation behind a common interface, and none reports a shell-modification
      count.
    verdict: 'UNVERIFIED. Nothing is asserted about published literature; relation-agnostic MPC-in-the-head
      shells are a normal engineering pattern and are certainly not new in general. Assembled from
      known parts: interface-based abstraction, one-factor-at-a-time ablation and cross-arm invariance
      tables are all standard, and IDEA-20260805-7d97be already establishes the matched-null discipline
      in this repository. Claimed new relative to THIS repository only: the shell-modification count
      as the primary measurement about relation-agnosticism, the invariance table with an explicit
      undetermined band, and the always-pass null relation used to make the shell-level classification
      falsifiable.'
  object_first_candidate:
    tracked_object: The measurement battery vector B(relation, shell parameters) = (exact soundness,
      emitted bytes, verifier operation count, opening-size distribution summary), followed as the
      relation is swapped with the shell parameters pinned.
    lossiness: Genuinely lossy. B discards the witness, the relation's algebraic content, the specific
      check equations, the field representation and every internal transcript, retaining four summary
      quantities per configuration. It propagates because the attribution question, which measured
      quantities belong to the paradigm, is a question about exactly those summaries and their variation.
      The projection is compatible with the target operation because swapping the relation changes
      only what enters through the three interface operations, and any leakage of relation detail
      into the shell would show up as a shell modification, which STAGE 6 counts rather than assumes
      away.
    propagation: One step of the target operation is swapping the relation while pinning shell parameters.
      Under it, B maps to a new vector, and the claim is that the map decomposes into coordinates
      that are fixed points and coordinates that move. The tracked object is therefore B together
      with the induced partition, and one step acts on it as a partial permutation plus a displacement,
      with the displacement's support being the deliverable.
    survival_score: 'The separability survives exactly as long as the relation interface suffices.
      It dissolves at the first relation requiring a shell change, and the run reports that as a count
      with the exact shell line and relation feature named. Additionally, the invariance classification
      survives across the sizes swept: the run reports the largest relation size at which a shell-level
      quantity remains within one part in a thousand across all three relations, and that size is
      the second survival number.'
  null_object_control: 'NULL-RELATION-TRIVIAL: a relation whose check always passes on any share vector,
    implemented behind the identical interface and run through the identical battery in the same invocation.
    Every quantity classified shell-level must be unchanged by it within the same tolerance; every
    quantity classified relation-level must move. If a shell-level quantity moves under the trivial
    relation, it was misclassified and the partition is void; if a relation-level quantity does not
    move, the classification has no discriminating power. A second null, NULL-RELATION-RANDOM, uses
    a relation whose check passes with a fixed declared probability independent of the shares, separating
    relation STRUCTURE from relation ACCEPTANCE RATE, which would otherwise be confounded.'
  discriminated_from:
  - 'IDEA-20260805-7d97be, MQOM as the unstructured null for structured-MQ attacks: varies the hard
    problem to test an attack device. This pins the attack surface entirely, runs no attack, and varies
    the relation inside a fixed proof shell.'
  - 'IDEA-20260813-c9bec2, actual MQ map versus parameter-matched random quadratic system: a hard-problem
    structure test using rank and invariant-subspace statistics. No rank statistic appears here and
    the relation shapes are declared, not drawn from any scheme.'
  - 'IDEA-20260807-f73d98 and IDEA-20260731-005, the records mentioning multiple schemes together:
    those discuss schemes; this implements one shell and swaps relations, and its central number is
    a shell-modification count that a discussion cannot produce.'
  - 'The cross-scheme accounting-attribution record elsewhere in this bucket: that perturbs a symbolic
    expression at three parameter shapes with zero compute. This executes a shell and measures emitted
    bytes and enumerated soundness. The two are deliberately complementary, symbolic and empirical,
    and agreeing or disagreeing between them is itself informative.'
  - A benchmark comparing three implementations of three schemes. That varies a hundred things at
    once and can attribute nothing; the entire design here exists to vary one.
  assumptions:
  - A three-operation relation interface is sufficient for the family. This is the claim under test
    and its failure is the informative outcome, not an obstacle.
  - The three relation shapes differ enough in arity, field and check density to make invariance meaningful.
    Their parameters are declared at Stage 0 and their pairwise differences are reported so a reader
    can judge.
  - Soundness enumeration remains affordable at matched shell parameters for all three relations.
    Where it is not for one relation, that asymmetry is itself reported rather than papered over by
    sampling one arm.
  - Commitments are idealized identically across all three arms, so the commitment layer contributes
    no cross-relation variation by construction.
  - Verifier operation counts are comparable across relations, counted in a declared unit (field multiplications
    plus Boolean gate evaluations counted separately, never summed into one number).
  predictions:
  - metric: shell modification count required to host all three relations
    direction: lower
    minimum_effect: 0
  - metric: number of measured quantities invariant across all three relations to within one part
      in a thousand
    direction: higher
    minimum_effect: 2
  - metric: number of measured quantities moving by more than ten percent across relations
    direction: higher
    minimum_effect: 1
  - metric: movement of shell-level quantities under NULL-RELATION-TRIVIAL
    direction: lower
    minimum_effect: 0.001
  minimal_test:
    design: 'Implement the shell once against a three-operation interface. Implement R1 parity-check-shaped
      over F_4, R2 Boolean-circuit-shaped with AND-depth 3, R3 quadratic-shaped over F_4, each at
      one size, plus NULL-RELATION-TRIVIAL and NULL-RELATION-RANDOM. Pin N equal to 4, tau equal to
      2. For each of the five relations, run the identical battery: enumerate soundness exactly, emit
      and measure signature bytes, count verifier operations, and record the opening-size distribution
      over 100 signings. Build the invariance table as the coefficient of variation of each quantity
      across the three real relations. Classify shell-level, relation-level or undetermined by the
      declared bands. Then check the trivial null: shell-level quantities must not move, relation-level
      quantities must. Record any shell line that had to change to host a relation, with the relation
      feature that forced it. Under an hour of compute and one shell, and the shell-modification count
      alone is worth the run.'
    controls:
    - NULL-RELATION-TRIVIAL, always-pass check, testing the shell-level classification.
    - NULL-RELATION-RANDOM, fixed declared acceptance probability, separating relation structure from
      acceptance rate.
    - Relation size sweep within each shape, separating relation KIND from relation SIZE.
    - Shell parameters pinned across all arms, verified by asserting the shell's configuration hash
      is identical in every run record.
    - 'An identical-relation repeat arm: R1 run twice with different seeds, whose cross-run variation
      bounds the noise floor against which cross-relation variation is judged.'
    required_metrics:
    - exact soundness per (relation, shell parameters)
    - emitted signature bytes, distribution
    - verifier operation count, field operations and Boolean gates reported separately
    - opening-size distribution summary
    - coefficient of variation of each quantity across the three relations
    - shell modification count with named lines and forcing features
    - noise floor from the identical-relation repeat arm
  falsification_conditions:
  - Any relation requires a shell modification, falsifying claim (A) as stated and yielding the named
    obstruction instead.
  - Fewer than two quantities are invariant across all three relations within one part in a thousand,
    so the shell-level column is empty or nearly so.
  - No quantity moves by more than ten percent, so the relation-level column is empty and the battery
    has no discriminating power.
  - A shell-level quantity moves under NULL-RELATION-TRIVIAL, voiding the partition.
  - Cross-relation variation is below the noise floor established by the identical-relation repeat
    arm, making every classification unsupported.
  - Soundness enumeration is affordable for some relations and not others at matched shell parameters,
    making the primary metric incomparable across arms.
  confounders:
  - Relation SIZE varying with relation KIND, so a difference attributed to kind is really size. Mitigated
    by the within-shape size sweep and by reporting kind effects at matched size.
  - Acceptance rate differing across relations, which changes the soundness measurement for reasons
    unrelated to structure. Mitigated by NULL-RELATION-RANDOM and by reporting soundness conditioned
    on matched acceptance where possible.
  - A shell written with one relation in mind, making the other two second-class citizens. Mitigated
    by implementing all three relations before the shell is frozen and by counting shell modifications
    explicitly.
  - Verifier operation counts summed across incommensurable units. Mitigated by never summing field
    operations and Boolean gates into one number, and reporting both columns.
  - Noise from seed choice masquerading as a relation effect. Mitigated by the identical-relation
    repeat arm establishing a noise floor.
  interpretation_limits:
  - 'Invariance in the shell is not invariance in the real schemes: the shell pins what the schemes
    vary, which is exactly what makes it a control and exactly what forbids the extrapolation.'
  - The three relation shapes are declared here and are not any scheme's relation, since no specification
    has been read.
  - A shell-modification count of zero shows the interface sufficed for three declared shapes, not
    for the family.
  - Classifications in the undetermined band are reported as undetermined and must not be read as
    either column.
  - Nothing measured here bears on the hardness of syndrome decoding, AES or MQ, which the design
    deliberately never touches.
  target_complexity:
    time_exponent: No attack exponent is claimed. Cost is O(relations times grid) signings plus enumeration
      cost per point.
    memory_exponent: No attack exponent is claimed. Memory is dominated by soundness enumeration and
      is bounded by the declared cap.
    best_known: The incumbent is per-scheme analysis, which is what every existing record in this
      bucket does, and within this repository the matched-null cross-arm discipline of IDEA-20260805-7d97be
      on different axes.
    hidden_overhead: 'Hidden in the lower-order terms is the interface itself: an interface general
      enough to host three shapes may be so general that the shell no longer resembles any real construction,
      and that resemblance is unmeasurable here. Human cost hides in implementing three relations
      well enough that none is a strawman, which is the single most likely way this run produces a
      misleading table.'
  dominated_by: 'n/a (no result claimed). All frontier rows considered: no time, memory or query point
    is placed, since nothing is attacked and no instance is solved.'
  sota_delta: no attack; conceptual/measurement contribution only
  estimated_cost:
    implementation: high
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'Part (A), that all three shapes host on an unmodified three-operation
    interface: 0.5, and a nonzero shell-modification count is genuinely the more interesting outcome,
    so I am close to indifferent. Part (B), that at least two quantities are invariant within one
    part in a thousand and at least one moves by more than ten percent: 0.6 for the invariant side,
    since emitted bytes and opening size should be relation-blind by construction, and 0.75 for the
    moving side, since verifier operation count almost must move. Part (C), that the controlled version
    licenses paradigm statements in this bucket: 0.5, a methodological claim that reviewers may reasonably
    reject on the grounds that the shell is not the schemes.'
