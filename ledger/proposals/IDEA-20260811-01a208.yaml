idea:
  id: IDEA-20260811-01a208
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ICINV-475b5e
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-aeeb17
  task_id: TASK-20260811-5ff234
  axis: A1
  claim_tier: toy
  title: >-
    THE TWIST PAIR SHARES ITS x-LINE AND ITS SUMMATION POLYNOMIAL EXACTLY, AND THAT
    IS PRECISELY WHY IT GIVES NOTHING: in the model d*y^2 = f(x) the curve and its
    quadratic twist have literally the same Semaev polynomial, so a factor base of
    x-values serves both at once -- but every solution with mixed labels SPLITS
    under Frobenius into one relation on each curve separately (obstruction
    O-EIGENSPLIT), and the fibre product E x_{P^1} E^d has no F_p-points off the
    2-torsion (obstruction O-EMPTYFIBRE). The pair is therefore a LOSSLESS
    relabelling of the x-line, fails the inventor-protocol section 2 test as a new
    object, and its single surviving residue is a factor-of-2 amortisation and the
    best matched null object the gating lane L1 has available
  class: mechanism
  resource: >-
    R1 (x-coordinates as field elements) and R2 (the curve equation / model). The
    record consumes the x-line as field data and the choice of quadratic-twist model
    as an R2 change; it consumes no group-operation output and applies no
    endomorphism to a point of G.
  admissibility: >-
    Admissible. The object is the PAIR of curves and the shared x-line, not the
    point group of either. H-ENDO-001 governs group homomorphisms applied to points
    of G; nothing here is such a map, and the record's own conclusion is a closure,
    not an attack. KN-FIND-b7e091's simulability argument does not apply because no
    oracle returning group elements is proposed.
  p2_p3_flags:
    p2_adjacent: false
    p3_triggered: false
    note: >-
      No phi-stable factor base appears -- the shared factor base here is stable
      under nothing but the identity and the sign, and the sign quotient is already
      the standard x-line. No candidate is compared against the
      automorphism-discounted rho baseline. Neither pause condition is engaged.

  claim: >-
    Let p > 3, E : y^2 = f(x) = x^3 + a x + b over F_p, t its trace, d a fixed
    non-square in F_p, and let E^d denote the quadratic twist.

    (A) [fact] THE MODEL IN WHICH THE x-LINE IS LITERALLY SHARED. Write the twist
        as C_d : d y^2 = f(x). C_d is F_p-isomorphic to the short Weierstrass curve
        y^2 = x^3 + a d^2 x + b d^3 via (x, y) -> (d x, d^2 y). THE SEED IN THE
        HANDOFF IS THEREFORE TRUE ONLY AFTER THIS IDENTIFICATION, AND THE RECORD
        STATES THE IDENTIFICATION RATHER THAN SUPPRESSING IT: in the short
        Weierstrass model the twist's x-coordinates are d times the curve's, and
        the x-lines coincide only after the linear substitution x -> d x. In the
        model C_d the coincidence is literal. Every statement below is made in the
        model C_d.
        In that model, for x in F_p: f(x) a nonzero square gives 2 points on E and
        0 on C_d; f(x) a nonzero non-square gives 0 on E and 2 on C_d; f(x) = 0
        gives 1 on each. Summing over x and adding the two points at infinity,
        #E(F_p) + #E^d(F_p) = 2p + 2, consistent with traces t and -t.

    (B) [fact] THE SUMMATION POLYNOMIAL IS THE SAME POLYNOMIAL, NOT MERELY THE SAME
        SHAPE. Over F_pbar the map C_d -> E, (x, y) -> (x, sqrt(d) y), is an
        isomorphism which is the IDENTITY on the x-coordinate. Semaev's S_m is by
        definition the reduced equation of the Zariski closure of the x-images of
        m-tuples of points of E(F_pbar) summing to O. Since the isomorphism does not
        move x, S_m^{C_d} = S_m^{E} as polynomials in F_p[x_1, ..., x_m]. A factor
        base of x-values is therefore SIMULTANEOUSLY a factor base for E and for its
        twist, at zero additional cost, and the relation-search variety is one
        variety, not two.

    (C) [fact] O-EIGENSPLIT -- THE NAMED OBSTRUCTION, AND IT IS THE WHOLE ANSWER TO
        "IS SOMETHING COMPUTABLE ON THE PAIR". Inside E(F_pbar), E(F_p) is the
        kernel of pi - 1 and the image of C_d(F_p) is the kernel of pi + 1, because
        pi(x, sqrt(d) y) = (x, -sqrt(d) y) for x, y in F_p and d a non-square.
        Suppose P_1, ..., P_r lie in ker(pi - 1), R_1, ..., R_s lie in ker(pi + 1),
        and sum P_i + sum R_j = O. Applying pi gives sum P_i - sum R_j = O. Adding
        and subtracting gives 2 sum P_i = O and 2 sum R_j = O. So a MIXED relation
        is equivalent to a relation internal to E together with a relation internal
        to E^d, up to 2-torsion, and carries no information that crosses between the
        two curves. Modulo the odd prime N this is exact: the mixed relation
        contributes the zero congruence.

    (D) [fact] O-EMPTYFIBRE -- THE SAME CONCLUSION FROM A SECOND, INDEPENDENT
        DIRECTION. The fibre product E x_{P^1, x} C_d over F_p is
        {(x, y, z) : y^2 = f(x), d z^2 = f(x)}, whence y^2 = d z^2. Since d is a
        non-square this forces y = z = 0, i.e. f(x) = 0. So the fibre product has
        F_p-points only over the roots of f -- the rational 2-torsion -- plus the
        points at infinity. There is no F_p-rational curve joining the pair and
        therefore no correspondence to push relations along. This is the pair-level
        analogue of the splitting obstruction IDEA-20260808-45af43 named
        O-SPLITRESTRICTION for the sextic family, obtained by a different and
        cheaper argument (a fibre product rather than a Weil restriction), and it is
        disclosed as such rather than presented as independent.

    (E) THE LOSSY-PROJECTION VERDICT (docs/inventor-protocol.md section 2), WHICH IS
        WHY THIS OBJECT IS NOT NEW AND THE ARGUMENT COSTS NO COMPUTE. Consider the
        projection Pi : E(F_p) disjoint-union E^d(F_p) -> P^1(F_p) sending a point
        to its x-coordinate. What Pi discards is (i) the sign of y and (ii) the
        label "which curve". But the label is RECOVERABLE from the image in O(log p)
        bit operations by one Legendre symbol chi(f(x)). So Pi discards only the
        sign -- exactly what the Kummer line already discards -- and the pair
        structure adds nothing beyond the single curve's own x-line. A projection
        that loses only what a known projection already loses is a change of
        coordinates, not a new object. THIS IS THE RECORD'S PRIMARY CONCLUSION AND
        IT IS ALGEBRAIC, NOT EMPIRICAL.

    (F) THE ONE SURVIVING RESIDUE, STATED HONESTLY AND WITHOUT INFLATION. Two things
        do survive (C)-(E), and neither is an exponent.
        (F1) A factor base of m x-values yields relations for E and for E^d from one
             evaluation of one variety. In a two-target setting this is an exact
             factor-2 amortisation of relation search and NOTHING MORE; it is a
             constant, it is filed as a constant, and under the program's
             exponent-first bias it is low priority on its own.
        (F2) E^d is the best matched null object available to lane L1. It fixes p,
             fixes the shared x-line, fixes S_m as a polynomial, and CHANGES the
             isogeny class (trace -t). Every other control the lane can build varies
             more. The quantitative form of this control is developed in
             IDEA-20260811-04a75a and is the reason that record, not this one, is
             recommended for execution first.

  mechanism: >-
    The x-line is the quotient of the curve by the sign, and the sign is exactly the
    datum the group law needs. Passing to the x-line therefore merges E and its twist
    into one object, and the merge is free because the two curves are the same curve
    over F_p(sqrt(d)) -- they differ only in which Frobenius eigenvalue their rational
    points carry. That is simultaneously why the merge is cheap and why it is empty:
    Frobenius is available to the algorithm, so the algorithm can always split a
    merged relation back into its eigencomponents, and an obstruction that the
    adversary can undo for free is not a resource. Symmetrically, the fibre product
    over the x-line is the geometric object that would carry a correspondence, and it
    degenerates to the ramification locus because "square" and "non-square" are
    complementary conditions on the same value f(x). Both arguments are one line and
    both point the same way, which is the shape docs/inventor-protocol.md section 4
    asks a closure to have.

  why_not_a_renamed_known_approach: >-
    Nearest known material, and what is different. (1) IDEA-20260807-e41559 proves
    that an ordinary curve and its quadratic twist are NEVER F_p-isogenous, since
    t = -t forces t = 0. THAT RECORD ALREADY ESTABLISHES THE HANDOFF'S SEED, and this
    record does not claim it: the seed VERIFIES, it is elementary, and it is
    pre-existing corpus content. What e41559 does not do is ask what the pair shares
    despite not being isogenous; this record answers that with (A)-(D).
    (2) IDEA-20260808-45af43 closes the SEXTIC twist family for j = 0 curves via
    Tate's theorem, gcd of orders, and a completely split Weil restriction. Its
    object is six curves and an abelian sixfold; this record's object is two curves
    and a P^1, its obstruction is a fibre product rather than a restriction of
    scalars, and its positive residue (F2) has no analogue there.
    (3) IDEA-20260807-dadcd2 generalises Semaev polynomials to an arbitrary
    coordinate function f with deck group Gamma_f and computes the degree law
    |Gamma_f|^{m-2}. That record varies the COORDINATE MAP with the curve fixed;
    this record varies the CURVE with the coordinate map fixed, and its content is
    the coincidence S_m^{C_d} = S_m^{E}, which is a statement dadcd2 does not make.
    (4) Twist-security literature asks whether the twist is strong. This record asks
    what the twist shares, which is orthogonal, and it reaches a negative.
    (5) The classical invalid-curve / twist attack requires an unvalidated x-only
    scalar-multiplication ORACLE. This record proposes no oracle and is not that
    attack; the oracle setting is explicitly out of scope and is recorded as a
    rejected object in the task's idea-report.

  proof_search_map:
    bottleneck: >-
      The step whose removal would change the conclusion is (C): if a mixed-label
      relation did NOT split under Frobenius, the shared variety would carry genuine
      cross-curve congruences and the pair would be a real object.
    baseline_embedding:
      parameter_slice: >-
        Setting s = 0 in (C) -- no twist points in the relation -- recovers the
        ordinary single-curve Semaev relation exactly, which is the baseline this
        construction must reproduce.
      reproduction_check: >-
        Symbolic, at zero compute: with s = 0 the identity 2 sum P_i = O is vacuous
        and (C) reduces to sum P_i = O, the standard relation. Frozen fixture:
        harness/semaev.py's s3_expr evaluated on E and on d y^2 = f(x) must return
        byte-identical polynomials; a difference falsifies (B) immediately.
    observation_collision:
      observable: >-
        The vanishing of S_m at an x-tuple, i.e. membership in the shared summation
        variety.
      distinct_preimage_search: >-
        REQUIRED and it is the point of the record: the observable is deliberately
        BLIND to the curve label, so distinct ground-truth objects -- an all-E
        relation, an all-E^d relation, and a mixed configuration -- collide on it.
        The additional condition that separates them is the Legendre symbol vector
        (chi(f(x_1)), ..., chi(f(x_m))), computable in O(m log p). Because the
        separator is cheap, the collision is not a barrier to the algorithm, and
        because the separator is complete, the collision carries no hidden
        information. Both halves matter: a collision with an EXPENSIVE separator
        would have been a resource, and the record must not be read as claiming
        one.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (S_m = 0) fixed and vary the forgotten structure (the
          label vector). The intrinsic invariant distinguishing the resulting
          objects is the Frobenius eigenvalue, and (C) shows it is recoverable from
          the relation itself, not merely from the labels.
        predicted_gain: >-
          Zero, and the record predicts zero. The transform is applied to establish
          that the fibre carries nothing, which is the closure.
      - transform: representation_reduction
        proposed_object: >-
          Move from "two curves over F_p" to "one curve over F_p(sqrt(d)) with a
          Frobenius grading", where the pair structure becomes an exact
          eigendecomposition rather than a heuristic coupling.
        predicted_gain: >-
          Turns (C) from a computation into a one-line linear-algebra identity on
          eigenspaces, which is why the argument is cheap.
    quantifier_order: >-
      CLOSURE CLAIM: forall p > 3, forall E/F_p with f separable, forall non-square
      d, forall m >= 3, forall x-tuples (x_1, ..., x_m) in F_p^m with S_m(x) = 0 and
      a lift whose labels are not all equal, THERE EXIST decompositions such that the
      E-part and the E^d-part each sum to a 2-torsion point. The quantifier order
      matters: the decomposition is allowed to depend on the tuple; no uniform
      decomposition is claimed, and none is needed.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest claim this method certifies is that the twist pair supplies no
        F_p-rational correspondence and no cross-curve congruence. It certifies
        NOTHING about the pair under an added oracle (invalid-curve setting), nothing
        over extension fields, and nothing about non-quadratic twists of j = 0 or
        j = 1728 curves, which IDEA-20260808-45af43 handles separately.
      nearby_object_control: >-
        The closest object where the desired conclusion FAILS is a supersingular
        curve over F_p with t = 0, where the twist IS in the same isogeny class and
        an F_p-isogeny does exist. The method must assign that object to a different
        cell, and it does: (C) still holds but (D)'s conclusion is joined by a
        genuine isogeny, so the closure is scoped to t != 0 and says so.
    proof_obligations:
      - claim: C_d is F_p-isomorphic to y^2 = x^3 + a d^2 x + b d^3 by (x,y) -> (dx, d^2 y).
        responsibility: correctness
      - claim: S_m is invariant under an isomorphism that fixes x, hence S_m^{C_d} = S_m^{E}.
        responsibility: correctness
      - claim: the image of C_d(F_p) in E(F_pbar) is ker(pi + 1).
        responsibility: correctness
      - claim: mixed relations split, with the 2-torsion remainder explicitly bounded.
        responsibility: strictness
      - claim: the fibre product has no F_p-points off f(x) = 0.
        responsibility: correctness
      - claim: the label is recoverable in O(log p), so the projection is not lossy.
        responsibility: scope

  predictions:
    - observable: identity of the summation polynomials
      metric: >-
        byte-wise equality of the expanded S_3 and S_4 computed for E : y^2 = f(x)
        and for C_d : d y^2 = f(x), over at least 200 random (p, a, b, d) at 12-24
        bits
      direction: different
      predicted: >-
        exact equality in 100 percent of cases. This is an identity, not a
        correlation; a single mismatch falsifies (B) or the implementation, and the
        two are separated by also checking S_3 for the SHORT WEIERSTRASS twist
        y^2 = x^3 + a d^2 x + b d^3, which must instead equal S_3^E with each
        variable scaled by d.
    - observable: splitting of mixed relations
      metric: >-
        over all solutions of S_3 = 0 in F_p^3 for toy p (12-14 bits) whose Legendre
        label vector is not constant, the fraction for which the E-part and the
        E^d-part each sum to a point of E[2]
      direction: different
      predicted: >-
        exactly 1.000. Any mixed solution whose parts do not each land in the
        2-torsion falsifies (C) and would be the single most consequential outcome
        available from this record.
    - observable: rational points of the fibre product
      metric: >-
        the number of F_p-points of {y^2 = f(x), d z^2 = f(x)} found by exhaustive
        enumeration over x in F_p
      direction: lower
      predicted: >-
        exactly the number of roots of f in F_p (0, 1 or 3), and no others. A single
        extra point falsifies (D) or means d was chosen square.
    - observable: cost of label recovery
      metric: >-
        field operations to decide, from x alone, which curve x lifts to
      direction: lower
      predicted: >-
        O(log p) via one Legendre symbol, measured and reported against the cost of
        one group operation. If label recovery were measured to be superpolynomial
        the lossy-projection verdict in (E) would flip and the pair WOULD be a new
        object -- this is the prediction whose failure would be interesting, and it
        is stated so the record has a live negative outcome.

  minimal_test:
    design: >-
      Two stages. Stage 0 costs nothing and can kill the record before any code runs.
      STAGE 0 (symbolic, zero compute). Expand S_3 for y^2 = f(x) and for
      d y^2 = f(x) using the existing harness/semaev.py s3_expr, symbolically in
      a, b, d. They must be identical. Separately expand S_3 for the short
      Weierstrass twist and check it equals S_3^E(x_1/d, x_2/d, x_3/d) times the
      appropriate power of d. If either check fails, the record is wrong and no
      further work is warranted.
      STAGE 1 (exhaustive, toy). Pick p in the 12-14 bit range so that F_p^3 is not
      enumerable but F_p^2 is. For each (x_1, x_2) in F_p^2 solve the quadratic
      S_3(x_1, x_2, X) = 0 for X, giving all solutions of S_3 = 0 in
      O(p^2) field operations. For each solution compute the Legendre label vector.
      Partition into all-E, all-E^d, and mixed. For each mixed solution, lift
      explicitly and check that the E-part and E^d-part each sum into E[2].
      Enumerate the fibre product directly over x in F_p.
      Budget: minutes on one core. No Groebner basis, no isogeny walk, no solver.
    controls:
      - >-
        NULL OBJECT for the splitting test: replace the Legendre labels by a
        uniformly random label vector of the same marginal distribution, keeping the
        solution set fixed. Under the random labelling the "mixed parts land in
        E[2]" rate must COLLAPSE to the chance level (roughly #E[2]/#E per test). If
        the random-label arm also reports rate 1.000, the test is measuring an
        artifact of the lifting code and not (C), and the result is void in both
        directions.
      - >-
        NULL OBJECT for the polynomial identity: a second, UNRELATED curve
        y^2 = x^3 + a' x + b' with a' , b' random. Its S_3 must differ from S_3^E.
        If the comparison code reports equality there, it is comparing nothing.
      - >-
        PLANTED SIGNAL: a supersingular curve over F_p with t = 0, where E and E^d
        ARE isogenous. The pipeline must still report (C) holding, and must report
        the isogeny class as shared -- confirming that the instrument distinguishes
        "shares an x-line" from "shares a class".
      - >-
        d-CHOICE CONTROL: repeat the whole of stage 1 with d a nonzero SQUARE. Then
        C_d is isomorphic to E over F_p, the labels are constant, the mixed class is
        empty, and the fibre product is large. Every prediction must invert. This is
        the cheapest available check that the code is sensitive to the one arithmetic
        fact the record rests on.
    required_metrics:
      - byte-equality verdict for S_3 and S_4, per (p, a, b, d)
      - counts of all-E, all-E^d, and mixed solutions of S_3 = 0
      - fraction of mixed solutions whose parts land in E[2], with the random-label null
      - F_p-point count of the fibre product, against the root count of f
      - field operations per label recovery, against field operations per group operation
      - the same five metrics under the d-square control, where all must invert

  controls:
    - >-
      Matched null: random label vectors with the same marginals, which must destroy
      the splitting statistic.
    - >-
      Matched null: an unrelated random curve, whose S_3 must differ.
    - >-
      Planted signal: a supersingular t = 0 curve, where the twist IS isogenous.
    - >-
      Inversion control: d square, where every prediction must reverse.
    - >-
      Baseline reproduction: the s = 0 slice of (C) must be the ordinary single-curve
      relation, checked symbolically.

  confounders:
    - >-
      MODEL CONFUSION IS THE PRINCIPAL RISK IN THIS RECORD. The literal sharing of
      the x-line holds in the model d y^2 = f(x) and NOT in the short Weierstrass
      model, where x-coordinates are scaled by d. Any measurement that silently
      switches models will produce a spurious mismatch or a spurious match. The
      required_metrics therefore demand the SHORT WEIERSTRASS comparison as a
      separate line item, with its own predicted answer.
    - >-
      2-TORSION. The splitting identity in (C) is exact only up to E[2]. Curves with
      rational 2-torsion will produce genuine mixed solutions whose parts are
      nonzero 2-torsion points. These are correct instances of (C), not
      counterexamples, and must be tabulated separately or the rate will look wrong.
    - >-
      d = 0 or f not separable. Degenerate inputs must be filtered before tabulation,
      not explained afterwards.
    - >-
      THE FACTOR-OF-2 IN (F1) IS NOT A SPEEDUP OF ANY ATTACK. Over a PRIME field
      there is no known subexponential index calculus at all; Semaev relations over
      F_p are an instrument this campaign measures, not an attack it runs. Reporting
      (F1) as an attack improvement would be a category error and the record says so
      here so that no downstream reader can make it.
    - >-
      Exhaustive enumeration of S_3 = 0 is O(p^2); at 20+ bits it stops being cheap.
      The record's claims are identities and are scale-free as mathematics, but the
      MEASUREMENTS are 12-14 bit measurements and are labelled as such.

  falsification_conditions:
    - >-
      S_3 computed for d y^2 = f(x) differs from S_3 for y^2 = f(x). (B) is false and
      the entire record collapses; the most likely cause is a model error and it must
      be excluded before any mathematical interpretation.
    - >-
      A mixed solution of S_3 = 0 whose E-part does not sum into E[2]. (C) is false,
      mixed relations carry genuine cross-curve content, and THE PAIR BECOMES A LIVE
      OBJECT. This is the one outcome that would reopen the axis and it must be
      independently replicated before interpretation.
    - >-
      An F_p-point of the fibre product with f(x) != 0. (D) is false or d is square.
    - >-
      Under the d-square control the predictions do NOT invert. The instrument is
      insensitive to the arithmetic and all of its negatives are void.
    - >-
      The random-label null reproduces the splitting rate. The splitting statistic is
      an artifact of the lifting code.

  interpretation_limits:
    - >-
      This is a CLOSURE record with a named obstruction, in the sense of
      docs/inventor-protocol.md section 4. It is not a lower bound, not evidence that
      ECDLP is hard, and not a statement that no use of a twist can ever exist -- it
      is a statement that the F_p-rational geometry of the pair supplies no
      correspondence and no cross-curve congruence.
    - >-
      Scoped to ORDINARY curves over PRIME fields with t != 0, quadratic twists only,
      and to the setting with NO added oracle. The invalid-curve attack setting, in
      which an unvalidated x-only ladder acts as a twist oracle, is a different model
      and is explicitly out of scope.
    - >-
      Says nothing about sextic or quartic twists of j = 0 and j = 1728 curves; those
      are IDEA-20260808-45af43's object.
    - >-
      (F1)'s factor of 2 is a constant. Under the program's exponent-first bias it is
      low priority on its own and is filed as a building block for (F2), not as a
      result.
    - >-
      Toy scale (12-14 bits) for all measurements. The identities are scale-free; the
      counts are not, and no crypto-scale behaviour is claimed.

  assumptions:
    - p > 3, f = x^3 + a x + b separable, d a fixed non-square in F_p, E ordinary.
    - >-
      Semaev's S_m exists and is the reduced defining polynomial of the x-image
      variety (KN-TECH-002), as implemented by harness/semaev.py for m = 3, 4.
    - >-
      Frobenius acts on E(F_pbar) with E(F_p) = ker(pi - 1); the twist's rational
      points embed as ker(pi + 1). [elementary, derived in (C) rather than cited.]
    - >-
      Tate's theorem: two curves over F_p are F_p-isogenous iff they have the same
      number of points. Used only to restate IDEA-20260807-e41559's finding, not to
      derive anything new.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Label balance.) For E/F_p ordinary and x uniform in F_p, the Legendre label
        chi(f(x)) takes the value +1 on (p + 1 - t - 2 - z)/2 values and -1 on
        (p + 1 + t - 2 - z)/2 values, where z is the number of roots of f in F_p;
        equivalently the label is balanced to within the trace, and sums of the label
        against any nontrivial additive character are O(sqrt(p)).
      rigorous_support: >-
        The count is RIGOROUS and is not a heuristic at all: it is the point-count
        identity in (A) rearranged, and #E = p + 1 - t is Hasse. The only heuristic
        content is the character-sum bound, which is itself the Weil bound for the
        curve y^2 = f(x) twisted by an additive character and is therefore also
        rigorous; the assumption is recorded here for completeness and because the
        companion record IDEA-20260811-157d66 makes it load-bearing.
      validation_plan: >-
        Sampled quantity: the exact counts of chi(f(x)) = +1, -1, 0 over all x in
        F_p, for 500 random curves at 12-16 bits. Shortcut: complete enumeration, so
        no sampling bias and no correspondence needed. Comparison distribution: the
        exact predicted counts from (A) with t obtained independently by the harness
        point counter. Tail check: the largest observed |count(+1) - count(-1) - t|,
        which must be exactly 0 for every curve; a nonzero value is an arithmetic
        bug, not a discovery. Transfer assumption: none needed, the identity is
        exact at every p.
    - id: H2
      statement: >-
        (Mixed-solution rarity.) The number of solutions of S_m = 0 in F_p^m with a
        non-constant Legendre label vector is O(p^{m-2}), i.e. a factor p smaller
        than the all-E and all-E^d classes, because (C) forces the parts into the
        2-torsion.
      rigorous_support: >-
        The rigorous ingredient is (C) itself: a mixed solution requires each part to
        sum into E[2], which is |E[2]| <= 4 conditions rather than a free choice, so
        the mixed class is cut out by one more equation than the pure classes. The
        distribution statement imitated is the Lang-Weil estimate for the number of
        F_p-points of a variety of given dimension.
      validation_plan: >-
        Sampled quantity: the counts of all-E, all-E^d and mixed solutions of
        S_3 = 0, by exhaustive enumeration at p = 2^12, 2^13, 2^14. Shortcut:
        enumerate (x_1, x_2) and solve the quadratic in x_3, which is O(p^2) rather
        than O(p^3). Comparison distribution: the predicted ratio
        mixed / (all-E + all-E^d) = O(1/p), fitted across the three sizes; the fitted
        slope in log p must be -1 within the resolution of three points. Tail check:
        the curves with the LARGEST mixed count, which should be exactly those with
        full rational 2-torsion, and this must be verified per curve rather than in
        aggregate. Transfer assumption: the O(1/p) rate is validated only at 12-14
        bits and the record does not extrapolate it.

  target_complexity:
    time_exponent: >-
      No attack exponent is claimed and none moves. The record's arithmetic content
      is a set of identities costing zero. The single cost statement it makes is
      (F1): relation search over a shared factor base serves two curves at the price
      of one, an exact factor 2 in a two-target setting, i.e. a CONSTANT and
      explicitly not an exponent. Label recovery costs one Legendre symbol,
      O(log^2 p) bit operations, per factor-base element.
    memory_exponent: >-
      Unchanged from single-curve relation search; the shared factor base is one
      table, not two, which is the memory form of the same factor 2.
    best_known: >-
      Parallel Pollard rho with distinguished points at 0.886 sqrt(N) group
      operations and O(1) memory (KN-TECH-001, KN-TECH-006); the
      automorphism-discounted variant (KN-TECH-018); BSGS at sqrt(N) time and memory
      (KN-TECH-031). Over PRIME fields there is no known subexponential index
      calculus to compare a Semaev-based relation search against, and this record
      does not invent one.
    hidden_overhead: >-
      Nothing hides in an o(1) because no asymptotic improvement is claimed. The
      honest disclosure runs the other way: (F1)'s factor 2 applies only when two
      DIFFERENT DLP instances, one on each curve, are actually wanted -- which is not
      the campaign's setting -- and outside that setting the factor is 1.
    tradeoff_note: >-
      Not applicable; no algorithm is proposed. If (F1) were ever used, its position
      is exactly that of ordinary relation search with the factor base shared, which
      does not move any point on the van Oorschot-Wiener curve.

  sota_delta: >-
    Zero. No attack, no speedup, no exponent. The record is a closure plus a control
    design.

  dominated_by: >-
    As an attack, dominated by everything, since it is not an attack. Checked against
    every row of the frontier the program maintains: parallel Pollard rho at
    0.886 sqrt(N) with O(1) memory (KN-TECH-001, KN-TECH-006); the
    automorphism-discounted variant (KN-TECH-018); BSGS at sqrt(N) time and memory
    (KN-TECH-031); the preprocessing frontier at N^{1/3} online with N^{1/3} advice
    (Corrigan-Gibbs-Kogan, charged in DEC-20260727-008). As a CLOSURE it is
    partially dominated by IDEA-20260807-e41559 (which already excludes the twist
    from the isogeny class) and by IDEA-20260808-45af43 (which already closes the
    sextic family by a splitting argument); the delta is (B), (C), (D), (E) and (F2),
    and that is the honest extent of it.

