    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: >-
    0.08 that the architecture survives all three prongs and is worth costing
    further. Not lower, because (a) every prong rests on at least one recalled
    and unverified fact, (b) DEC-20260805-2be965 records this goal's red team
    finding four of five of its own named obstructions defective on audit, so
    this program's obstruction fields have a measured failure rate near 80 per
