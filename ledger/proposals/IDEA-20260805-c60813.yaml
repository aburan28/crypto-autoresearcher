  interpretation_limits:
    - >-
      NO CLOSURE IS ASSERTED BY THIS RECORD. It proposes a kill; a kill becomes
      a closure only after Stage 0 verifies its ingredients and an independent
      review accepts it, and even then it closes three named routes at
      derivation tier, not the family.
    - >-
      NO EXPONENT IS CLAIMED IN EITHER DIRECTION. The cost equation's nominal
      exponent 0 in (2) is displayed precisely to be refuted by (3)-(5) and may
      not be quoted on its own.
    - >-
      The conditional tiers of this goal apply unchanged (SC-1, SC-2, SC-3).
      Nothing here produces an endomorphism, so SC-2's bound on log deg alpha
      is untested rather than satisfied.
    - >-
      Any statement about the external literature is out of scope: this record
      establishes only that the corpus does not contain the cost equation.

  proof_search_map_note: >-
    Proof-oriented (a closure argument). The paired hypothesis is
    H-SSIQ-90e07b, whose method_ceiling audit covers the strongest claim a
    lattice- or relation-based screen can certify and whose nearby-object
    control is the ordinary case named above, where relation collection is
    known to work.

  target_complexity:
    time_exponent: >-
      The architecture's NOMINAL exponent under (2) alone is 0, and that
      nominal value is the object of the kill, not a claim. If any prong bends,
      the real exponent must be recomputed with the linear-algebra stage
      charged -- which prong K3 puts at 1 unless a small stable submodule is
      exhibited. NO EXPONENT BELOW 1/3 IS CLAIMED.
    memory_exponent: >-
      Not assessed for a killed architecture. If it reopens, the Brandt module
      alone is p^{1+o(1)} entries and the memory charge must lead the analysis,
      not trail it -- the house exemplar is itself memory-Pareto-incomparable
      and this program's own records under-report memory.
    best_known: >-
      p^{1/3+o(1)} time and memory conditional on Heuristic 1 (and GRH for
      Isogeny, SC-1); p^{1/2}(log p)^{O(1)} unconditional at polynomial memory.
    hidden_overhead: >-
      Not assessed. The subexponential B of (2) would carry its own
      superpolynomial cofactor, and it is not assumed smaller than the
      incumbent's.
    tradeoff_note: >-
      A relation architecture is memory-hungry by construction (the relation
      matrix), so any revival must state its position on the van
      Oorschot-Wiener curve before claiming anything against the incumbent.

  dominated_by: >-
    n/a (no result claimed; a kill is proposed). Frontier rows checked before
