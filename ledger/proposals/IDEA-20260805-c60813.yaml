    0.70 that Stage 0 can verify or refute all four recalled facts in this
    environment WITHOUT quaternion arithmetic, since three of them are
    statements about counts that the committed toy graphs already realise.
    0.35 that Stage 3 (the two-sided class group order) is executable at all
