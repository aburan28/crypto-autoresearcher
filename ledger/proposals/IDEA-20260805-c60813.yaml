idea:
  id: IDEA-20260805-c60813
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  added: '2026-08-05'
  title: >-
    Write the other exponent equation down: a relation-collection cost
    architecture on the quaternion side, its one-page kill (the Brandt object
    is a groupoid whose abelianisation is trivial and whose Hecke module has
    dimension p/12), and the forward guidance that survives the kill
  class: mechanism

  claim: >-
    EVERY ATTEMPT UNDER THIS GOAL HAS STAYED INSIDE MEET-IN-THE-MIDDLE AND
    CLAW. EXP-SSIQ-4de240, EXP-SSIQ-58b642 and EXP-SSIQ-a85692 all measure
    properties of a search over lists of isogenies; EV-SSIQ-e43afd closes a
    degree bound feeding the same search. The one architecture that has moved
    exponents on every other central hard problem in this repository -- collect
    relations over a factor base, then do linear algebra -- has never been
    written down for the supersingular isogeny problem in this corpus, and the
    Deuring correspondence makes its ingredients look present: the left
    O_0-ideal classes are in bijection with supersingular curves, the ideals of
    small prime norm are an obvious factor base, and KLPT already functions as
    a relation oracle. THE PROPOSAL IS TO WRITE THE COST EQUATION AND KILL IT
    OR KEEP IT IN ONE PAGE.
    The kill this record proposes, offered for attack rather than asserted, has
    two independent prongs. (K1) THE OBJECT IS A GROUPOID, NOT A GROUP. Left
    O_0-ideal classes compose only when the right order of one equals the left
    order of the next, so "relations" are closed walks in the isogeny graph
    based at E_0 and their formal span is the graph's cycle space, of rank
    ~N/2 with N ~ p/12 -- not a rank-|FB| relation lattice over an abelian
    group. Index calculus needs commutativity to reorder a relation into a
    linear equation, and there is none. (K2) THE ABELIANISATION IS EMPTY. The
    natural commutative shadow is the two-sided ideal class group of O_0, which
    for B_{p,infinity} is generated by the single ramified ideal P with
    P^2 = pO_0 -- an object of order at most 2, carrying at most one bit. A
    relation architecture whose group has O(1) elements determines nothing.
    (K3) THE COMMUTATIVE STRUCTURE THAT DOES EXIST IS THE WRONG SIZE. The Hecke
    algebra acts commutatively on the free module on the ideal classes, but
    that module has dimension ~p/12, so merely writing down the linear algebra
    costs p^{1+o(1)} -- worse than the unconditional p^{1/2} baseline -- and a
    sub-p^{1/3} architecture would need a Hecke-stable submodule of dimension
    <= p^{1/3}, whose existence is a statement about the coefficient fields of
    weight-2 newforms of level p that this record does not know and does not
    assert.
    IF ANY PRONG IS WRONG, THIS IS THE HIGHEST-VALUE OPEN ARCHITECTURE IN THE
    GOAL. That is why the proposal is written as a kill to be attacked rather
    than as a closure: a fatigue report is not a closure (docs/inventor-protocol
    section 4), and each prong above is a named obstruction with an argument
    and a redirection.

  object_first_candidate:
    tracked_object: >-
      THE RELATION -- a formal Z-combination of factor-base ideals that
      evaluates to the trivial class -- followed from its definition through
      composition, through the attempt to reorder it, and into the linear
      algebra that would consume it. This is the tracked object of the index
      calculus family, transported to the Deuring side. It is deliberately NOT
      the isogeny, the curve, or the lattice vector; those are the objects
      every prior attempt under this goal has tracked.
    established_families_off_limits: >-
      OFF-LIMITS AS THE PRIMARY LENS, AND THIS IS THE POINT OF THE PROPOSAL:
      (a) meet-in-the-middle / claw finding, which is what the incumbent and
      every prior candidate here is; (b) the degree-bound family (lever L1),
      closed in scope; (c) descent on delta_E (lever L4); (d) time-memory
      tradeoffs (L5); (e) smoothness-probability improvements (F4). The whole
      value of this proposal is that it refuses all five and asks what a
      relation architecture would need instead. NOT off-limits: the Deuring
      correspondence and KLPT, because those are the transport, not the lens.
    newness_score: >-
      Index calculus is the oldest architecture in this repository and the
      Deuring correspondence is textbook. What is absent is the COST EQUATION
      for their combination on this problem: no record in this corpus balances
      a quaternion-side factor base against a smoothness probability for ideal
      norms. Absence of a search result is not evidence something was not tried
      externally, and this record makes no claim that the idea is new to the
      literature -- only that this program has never written it down, which is
      a statement about this corpus and is checkable.
    testability_score: >-
      The kill is testable in a day of algebra plus one small computation. The
      SURVIVAL of the architecture, were the kill to fail, would need
      quaternion order arithmetic that this environment cannot provide (no
      Sage, no Pari; sympy absent, numpy 2.4.6 present -- measured this
      session), and that gap must be declared in the contract rather than
      discovered mid-run.
    survival_score: >-
      Low, and stated as such: the groupoid objection is structural rather than
      quantitative and does not obviously bend. What survives regardless is the
      cost equation itself, which is the artefact a future agent needs in order
      not to re-tread this.

  mechanism: >-
    DERIVED HERE. Every ingredient is labelled by provenance; several are
    RECALLED and UNVERIFIED and each such step is a stage of the test, not an
    authority.

    (1) THE TRANSPORT. Fix p and a maximal order O_0 in B_{p,infinity} with
    known Deuring image E_0. The Deuring correspondence puts left O_0-ideal
    classes in bijection with supersingular j-invariants over F_{p^2}, of which
    there are N ~ p/12 (frozen source Section 2.1 and 4.2 supply the
    supersingular setting and the isometry used below; the class-number
    bijection itself is RECALLED, UNVERIFIED in this record). The isogeny
    problem becomes: given the class of an unknown ideal I connecting O_0 to
    O_E, express it.

    (2) THE ARCHITECTURE, WRITTEN OUT.
      FACTOR BASE: FB = {ideals of prime reduced norm l <= B}. For each prime
      l != p there are l + 1 left O_0-ideals of norm l (frozen source line 99,
      transported), so |FB| ~ sum_{l <= B} (l+1) ~ B^2/(2 log B). Note this is
      B^2, not B/log B: a naive port of the prime-field factor-base count is
      WRONG here by a whole power, and getting that wrong is the first way this
      architecture is mis-costed.
      RELATION: a word w in FB whose product is principal, i.e. a closed walk
      at E_0.
      SOLVE: given |FB| independent relations, invert a linear system.
      SMOOTHNESS: a random connecting ideal has reduced norm of size ~p^{1/2}
      (this is the rank-4 Hermite scale of IDEA-20260805-e7ee4a's cell (3)), so
      the Canfield-Erdos-Pomerance probability that its norm is B-smooth is
      u^{-u(1+o(1))} with u = (1/2) log p / log B -- the same shape as the
      frozen source's Heuristic 1 and Theorem 1.4 (lines 69 and 77).
      BALANCE: cost ~ |FB| / Pr[smooth] + LinAlg(|FB|). With |FB| = B^{2+o(1)}
      and Pr = u^{-u}, setting B = p^{beta} gives u = 1/(2 beta) = O(1), so
      u^{-u} = O(1) and the balance is dominated by |FB| = p^{2 beta} against
      the requirement that the relation count exceed |FB|. TAKING B
      SUBEXPONENTIAL, B = exp(c sqrt(log p)), gives |FB| = p^{o(1)} and
      u = sqrt(log p)/(2c) so u^{-u} = p^{-o(1)}: BOTH FACTORS ARE p^{o(1)} AND
      THE ARCHITECTURE'S NOMINAL EXPONENT IS 0. That is the seductive reading,
      and it is the reason someone should have written this down, and it is
      wrong for reasons (3)-(5) rather than for reasons of cost.

    (3) KILL PRONG K1 -- THE COMPOSITION IS NOT DEFINED. Left O_0-ideals do not
    multiply: I*J is defined only when O_R(I) = O_L(J). The set of ideal
    classes is a GROUPOID (the Brandt groupoid), and its "relations" are closed
    walks based at E_0. Their formal span is the cycle space of the isogeny
    graph, a free abelian group of rank |edges| - |vertices| + 1, which for the
    3-regular 2-isogeny graph on N vertices is N/2 + 1 = p/24 + O(1). The
    linear algebra of index calculus REORDERS a relation into an equation
    sum_i e_i log(g_i) = log(h); that step is commutativity, and it is exactly
    what is unavailable. THE OBJECTION IS NOT "IT IS HARD", IT IS "THE STEP
    DOES NOT TYPE-CHECK".

    (4) KILL PRONG K2 -- THE ABELIANISATION IS TRIVIAL. The standard repair
    when composition fails is to abelianise: pass to the two-sided ideal class
    group, where multiplication is defined everywhere. For a maximal order in
    B_{p,infinity} the two-sided ideals are generated by the rational primes
    and by the unique ramified ideal P with Nrd(P) = p and P^2 = pO_0 -- the
    same P that IDEA-20260805-e7ee4a's mechanism (2) uses. Modulo principal
    ideals this leaves a group of order at most 2 (RECALLED, UNVERIFIED: the
    two-sided class group of a maximal order in a definite quaternion algebra
    of prime discriminant is generated by P and is of order dividing 2; THIS IS
    A CANDIDATE TO CHECK AND IS THE FIRST STAGE OF THE TEST). A relation
    architecture over a group of order 2 recovers one bit. THE ABELIAN SHADOW
    OF THE OBJECT IS EMPTY, and this is the same shape as the commutator-
    collapse obstruction the corpus records as KN-OPEN-008 in another family --
    a cross-family connection worth recording whichever way this goes.

    (5) KILL PRONG K3 -- THE COMMUTATIVE STRUCTURE THAT DOES EXIST HAS THE
    WRONG DIMENSION. There IS a commutative algebra acting: the Hecke
    operators T_l, realised as Brandt matrices, act commutatively on the free
    Z-module on the N ideal classes. This is the honest home of "relations": a
    word in the T_l applied to [E_0] has a coefficient at [E] equal to the
    number of paths, and knowing the joint spectrum would give path counts. But
    the module has dimension N ~ p/12, so writing a Brandt matrix down is
    p^{1+o(1)} work, worse than the unconditional p^{1/2} baseline. For the
    architecture to reach sub-p^{1/3} it would need a Hecke-stable submodule of
    dimension <= p^{1/3} in which the target class is still separated. By
    Eichler / Jacquet-Langlands the Hecke-stable decomposition corresponds to
    Galois orbits of weight-2 newforms of level p (RECALLED, UNVERIFIED,
    CANDIDATE TO CHECK), whose typical orbit sizes are large; a submodule of
    dimension p^{1/3} would be an unusually small orbit AND would have to be
    computable without first computing the whole space. NEITHER IS ASSERTED
    FALSE HERE. The record says only that no such submodule is known to this
    record and that exhibiting one is what the architecture would require.

    (6) WHAT SURVIVES THE KILL -- FORWARD GUIDANCE, MANDATORY UNDER
    docs/inventor-protocol.md section 4.
      (a) ORIENTATION RESTORES COMMUTATIVITY. If E carries a K-orientation by
      an imaginary quadratic order, the orientation-preserving isogenies are
      acted on freely by the genuinely abelian Cl(O_K), and every index-calculus
      and class-group technique applies. The exponent question then MOVES: it
      becomes the cost of ORIENTING an arbitrary supersingular curve. That is
      cell C4 of IDEA-20260805-e7ee4a's census and the two proposals should be
      read together; the standing expectation that orienting is as hard as
      EndRing is RECALLED and UNVERIFIED and is the exact thing to check.
      (b) THE CYCLE SPACE IS A REAL Z-MODULE and it is not obviously useless --
      it is just p/24-dimensional. A relation architecture over a p^{o(1)}-
      dimensional QUOTIENT of it, if one existed that still separated classes,
      would evade K1 and K3 together. Naming the quotient is the open problem.
      (c) THE COST EQUATION IN (2) IS THE ARTEFACT. Whatever happens to the
      architecture, the equation |FB| ~ B^2/(2 log B) against
      u = (1/2) log p / log B is what a future agent needs in order to see in
      one line that the naive factor-base count is B^2 rather than B/log B, and
      that the smoothness scale is p^{1/2} rather than p^{1/3}.
      (d) EXPLICITLY NOT CLOSED: nothing here says that no relation-based
      architecture exists for this problem. It says that the three most obvious
      routes to one each hit a named obstruction, and it names what would have
      to be exhibited to get past each.

  novelty_status: unverified

  literature_context:
    - >-
      inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, Sections 2.1, 2.3 and 4.2
      -- READ IN FULL. Source of the supersingular setting, the three
      polynomially-equivalent problems (OneEnd, EndRing, Isogeny, lines
      119-127), and the Deuring-side isometry used in prongs K2 and K3.
    - >-
      The Deuring correspondence between left O_0-ideal classes and
      supersingular j-invariants, the class number ~p/12, the count l+1 of
      ideals of prime norm l, the two-sided class group of a maximal order in
      B_{p,infinity} being generated by the ramified ideal, Brandt matrices as
      Hecke operators, and Eichler / Jacquet-Langlands. EVERY ONE OF THESE IS
      RECALLED, UNVERIFIED. No citation is asserted because none was read for
      this record. Each is a CANDIDATE TO CHECK and each is a named stage of
      the paired test; a kill that rests on an unchecked recollection is not a
      kill.
    - >-
      KLPT as a relation oracle -- i.e. as an algorithm that, given a left
      O_0-ideal, produces an equivalent ideal of smooth norm in polynomial
      time. RELAYED, NOT READ. If this is materially different from the
      recollection, prong (2)'s "relations are cheap" premise changes and the
      architecture must be re-costed rather than abandoned.
    - >-
      knowledge/open-problems/KN-OPEN-008 (commutator collapse) and
      KN-OPEN-024, named by the session's angle brief as holding the groupoid
      question open. NOT READ FOR THIS RECORD -- named so a reviewer can check
      whether prong K2 is an instance of an obstruction the corpus already
      records in another family, which would be a cross-family connection worth
      recording independently of this proposal's outcome.
    - >-
      No claim is made that the external literature has not done this. The
      corpus's own bulk-seeding caveat (7,809 literature entries, the large
      majority carrying relayed-not-verified bodies while their machine-readable
      field says otherwise) means a negative corpus search establishes nothing
      about the literature, and this record's novelty_status is unverified for
      exactly that reason.

  lossy_projection_identifiability_audit:
    projection: >-
      A connecting ideal I (equivalently an isogeny E_0 -> E) --> the exponent
      vector (e_l) recording its factorisation over the factor base of
      small-norm ideals.
    what_is_discarded: >-
      THE ORDER OF THE FACTORS, and with it the intermediate orders. That is
      the whole content of the audit.
    why_genuinely_lossy: >-
      Very lossy in the abstract: many words have the same exponent vector.
    why_compatible_with_the_operations: >-
      IT IS NOT, AND THAT IS THE FINDING. For a projection to be usable the
      retained part must still propagate deterministically under the target's
      operations. Here the operation is ideal composition, which is defined
      only on matching orders; the exponent vector forgets exactly the data
      that decides whether a composition is defined. So the projection loses
      information the operations need, rather than information they do not use.
      This is a THIRD failure mode, distinct from the two the inventor protocol
      names, and it is worth recording as such: not "nothing discarded"
      (a change of coordinates), not "nothing retained" (a constant), but
      "the wrong thing discarded" -- the retained part does not propagate.
    is_it_only_a_change_of_coordinates: >-
      NO, and neither canonical failure fires. Not the (Delta, Pi) failure: an
      exponent vector does not determine the word. Not the mirror failure: the
      exponent vector varies enormously across instances and has ample
      comparator spread. The projection fails on the propagation clause
      instead, which is precisely prong K1 restated in the protocol's own
      vocabulary -- and the fact that the lossy-projection test independently
      reaches the same objection as the algebra is the strongest evidence this
      record has that the objection is real.

  assumptions:
    - >-
      That the recalled Deuring-side facts in (1), (4) and (5) are correct.
      They are the load-bearing ingredients of all three prongs and NONE has
      been verified in this session. Stage 0 of the paired test is to verify
      them or to record that they could not be verified in this environment;
      a kill built on unchecked recollections is a fatigue report.
    - >-
      That the connecting-ideal norm scale is p^{1/2}. This one IS derived, in
      IDEA-20260805-e7ee4a's cell (3), from the pair-independence of the
      Hom-lattice determinant, and is not a recollection.
    - >-
      That "index calculus" means an architecture requiring commutativity for
      its linear-algebra stage. A relation architecture that does NOT require
      commutativity -- for instance one solving a system over the cycle space
      directly -- is not addressed by prong K1 and is named in the forward
      guidance as the residual.

  heuristic_assumptions:
    - id: HEUR-SS-6
      statement: >-
        SMOOTHNESS OF IDEAL NORMS. The reduced norms of connecting ideals
        produced by the architecture's relation search behave, for smoothness
        purposes, like uniformly random integers of size p^{1/2}.
      rigorous_support: >-
        The same standing as the frozen source's Heuristic 1, which is stated
        for the degree of the smallest isogeny E -> E^{(p)} and justified by
        Theorem 1.4 (Canfield-Erdos-Pomerance, the source's reference [10]).
        The transport to connecting-ideal norms is NOT justified by that
        theorem and is a separate assumption of the same kind, inheriting the
        obligation rather than a waiver of it (this question's own constraint).
      validation_plan: >-
        Only load-bearing if the kill fails. Recorded so that it is not
        discovered later: if any prong bends, this heuristic must be numbered,
        stated, and validated before any cost is quoted.
      falsification_condition: >-
        Measured smoothness of connecting-ideal norms at toy p below the
        Dickman prediction by a factor growing in p.
    - id: HEUR-SS-7
      statement: >-
        NO SMALL HECKE-STABLE SUBMODULE. The Brandt module on N ~ p/12 ideal
        classes has no Hecke-stable submodule of dimension p^{1/3+o(1)} that
        both separates the target class and is computable without constructing
        the full module.
      rigorous_support: >-
        NONE. This is the honest status of prong K3 and it is stated as a
        heuristic rather than as an obstruction precisely so that it can be
        attacked. The supporting intuition -- that Hecke-stable pieces
        correspond to Galois orbits of newforms whose coefficient fields are
        typically large -- is RECALLED and UNVERIFIED.
      validation_plan: >-
        At toy p, construct the Brandt matrices directly (N <= 611 on the four
        graphs this campaign has already built) and compute the dimensions of
        the Hecke-stable decomposition. Measure the largest and smallest piece
        as a function of N. If the smallest non-Eisenstein piece grows like N,
        the heuristic is supported at toy scale; if pieces of size N^{1/3}
        appear, prong K3 is in trouble and the architecture reopens.
      falsification_condition: >-
        A Hecke-stable piece of dimension o(N^{1/2}) that separates a
        randomly chosen class, at three or more toy primes, with the dimension
        exponent fitted against an anchored estimator.

  predictions:
    - metric: >-
        |FB| for the small-norm ideal factor base at bound B, computed
        symbolically
      direction: different
      minimum_effect: >-
        FORCED VALUE ~ B^2/(2 log B), NOT B/log B. Derived before any run from
        the l+1 count of ideals of prime norm l. A record quoting B/log B has
        ported the prime-field count without transporting it and is wrong by a
        power of B -- and that specific error is the cheapest thing this
        proposal prevents.
    - metric: >-
        order of the two-sided ideal class group of a maximal order in
        B_{p,infinity}, computed at three toy primes
      direction: different
      minimum_effect: >-
        PREDICTED <= 2 for every p tested. If it exceeds 2 at any tested p,
        prong K2 is wrong, the abelian shadow is non-trivial, and the
        architecture reopens on its strongest branch. This is a one-line
        computation given quaternion order arithmetic and is the single
        cheapest decisive test in the proposal.
    - metric: >-
        rank of the cycle space of the constructed 2-isogeny graphs, at the
        four committed toy primes
      direction: different
      minimum_effect: >-
        FORCED VALUE |E| - |V| + 1 = N/2 + 1 for a connected 3-regular graph on
        N vertices, i.e. 102.5 -> 102 or 103 at N = 203 depending on the
        multi-edge convention, and 306 or 307 at N = 611. Any deviation means
        the graph is not 3-regular or not connected, which the committed
        correctness_gates claim it is -- so this doubles as an integrity check
        on the committed graphs at zero cost.
    - metric: >-
        dimension exponent of the smallest non-Eisenstein Hecke-stable piece of
        the Brandt module, fitted across toy primes
      direction: higher
      minimum_effect: >-
        Predicted indistinguishable from 1 (i.e. pieces grow proportionally to
        N). Pre-registered threshold: an exponent below 0.6 with a bootstrap CI
        excluding 1 falsifies HEUR-SS-7 at toy scale and reopens prong K3. The
        estimator must be anchored on an object of known dimension exponent
        first, per this goal's instrument_calibration standing practice.

  minimal_test:
    design: >-
      Cheapest gate first, and the cheapest gate can end the proposal in either
      direction. STAGE 0 (zero compute, ~2 hours): verify or fail to verify the
      four recalled facts -- the l+1 ideal count, the class number ~p/12, the
      two-sided class group generated by the ramified ideal, and the Brandt/
      Hecke commutativity. RECORD EACH AS VERIFIED, RELAYED, OR UNOBTAINABLE.
      If any fails, the corresponding prong is void and must be rewritten
      before anything else runs. STAGE 1 (zero compute, ~1 hour): write out the
      cost equation of (2) and the B^2 factor-base count; this is the artefact
      that survives whatever happens. STAGE 2 (minutes): the cycle-space rank
      check on the four committed graphs -- pure Python, and it also validates
      the graphs. STAGE 3 (environment-dependent): the two-sided class group
      order at three toy primes. THIS REQUIRES QUATERNION ORDER ARITHMETIC AND
      THE ENVIRONMENT HAS NEITHER SAGE NOR PARI NOR SYMPY (numpy 2.4.6 is
      present; sympy import fails -- measured this session). If it cannot be
      done, that is an INFRASTRUCTURE OUTCOME under AGENTS.md rule 5 and is
      reported as such, never as support for prong K2. STAGE 4 (optional):
      Brandt matrices at toy p and the Hecke decomposition, same environment
      caveat.
    controls:
      - >-
        NULL OBJECT (structure-free surrogate, and it can fail): run the same
        cycle-space and spectral computations on a RANDOM 3-regular graph on
        the same number of vertices. FORCED VALUES DERIVED BEFORE THE RUN:
        identical cycle-space rank N/2 + 1 (so this quantity carries NO
        supersingular information and the census must not read it as
        structure), and a spectral decomposition with no Hecke stability at
        all. If the supersingular graph's Hecke decomposition looks like the
        random graph's, prong K3's premise -- that there is a commutative
        structure to exploit -- is itself wrong and the analysis changes.
      - >-
        POSITIVE CONTROL (the effect MUST appear): the ORDINARY case. For an
        ordinary elliptic curve the endomorphism ring is an order in an
        imaginary quadratic field, the ideal classes DO form an abelian group
        Cl(O), and relation collection provably works -- this is the classical
        subexponential class-group computation. Running the architecture's
        bookkeeping on that object must produce a well-defined abelian group of
        size ~sqrt(|disc|) and a working reordering step. IF THE BOOKKEEPING
        CANNOT EVEN DESCRIBE THE CASE WHERE THE ARCHITECTURE IS KNOWN TO WORK,
        NO NEGATIVE MAY BE REPORTED ABOUT THE SUPERSINGULAR CASE.
      - >-
        GRADED CONTROL, >= 3 interior points: the ORIENTED case interpolates
        between the two. For a K-orientation by an order of discriminant d,
        the acting abelian group has size |d|^{1/2+o(1)}, which ranges from
        O(1) (no orientation, the supersingular case) to ~sqrt(p) (a full
        CM-like structure, the ordinary case). Evaluate the architecture's
        cost equation at |d| in {p^{1/4}, p^{1/2}, p^{3/4}, p} and report
        monotonicity. This localises the obstruction to the SIZE OF THE ABELIAN
        SHADOW rather than leaving "it does not work", and it is exactly the
        forward guidance (6a) made quantitative.
      - >-
        ARCHIVE CHECK (zero compute): every prior relation-collection cost
        equation in this corpus for an isogeny problem. NONE FOUND in the
        SSIQ, SSI or P13 lanes; recorded as an absence in this corpus, with the
        explicit note that this says nothing about the external literature.
      - >-
        VERDICT-ON-THE-NULL-FIRST: the decision rule is executed on the random
        3-regular graph before the supersingular graphs are read.
    required_metrics:
      - per recalled fact, its verification status and the source actually consulted
      - the cost equation, written once, with the B^2 factor-base count explicit
      - cycle-space rank, measured against the forced value, on both the real and null graphs
      - two-sided class group order at three toy primes, or the infrastructure failure that prevented it
      - the graded oriented-case cost table with monotonicity
      - the ordinary-case positive control's output

  falsification_conditions:
    - >-
      The two-sided ideal class group exceeds order 2 at any tested prime.
      Prong K2 is wrong and the architecture's strongest branch reopens.
    - >-
      A Hecke-stable submodule of dimension o(N^{1/2}) separating a random
      class is exhibited at toy scale. Prong K3 is wrong.
    - >-
      A relation architecture is exhibited that solves over the cycle space
      without a reordering step. Prong K1 does not apply to it and the kill is
      scoped out of that route -- which the forward guidance already names as
      the residual.
    - >-
      Any of the four recalled facts in Stage 0 turns out false. The prong that
      uses it is void and must be rewritten before the proposal is cited.
    - >-
      The ordinary-case positive control fails. Nothing negative may be
      reported at all.

  confounders:
    - >-
      RECALLED MATHEMATICS. Four load-bearing facts are model recollection with
      no source read. This is the dominant risk in the record and Stage 0
      exists solely to remove it. A kill resting on recollection would be worse
      than no kill, because it would look like a closure.
    - >-
      ENVIRONMENT. The decisive computations need quaternion order arithmetic
      and the container has no algebra system. A proposal whose cheapest
      decisive gate cannot be run in the available environment is an
      infrastructure request, and this record says so rather than designing
      around it.
    - >-
      KILL BIAS. A tidy three-pronged kill is satisfying to write and cheap to
      produce, and rejecting a direction needs no evidence under the ordinary
      incentives. The inventor protocol names this as the failure mode
      symmetric with overclaiming. Every prong is therefore stated as a
      falsifiable claim with an exhibited counterexample condition, and the
      proposal's honest prior of survival is stated for the ARCHITECTURE, not
      for the kill.
    - >-
      SCOPE CREEP INTO GOAL-SSI-001. Post-SIDH mechanism screening broadly
      belongs to GOAL-SSI-001. This proposal stays in scope because it is
      exponent-specific: it asks whether a relation architecture can reach an
      exponent below 1/3 for THIS problem, and any non-exponent-carrying
