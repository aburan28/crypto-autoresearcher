    (v) data/queries -- no oracle, no samples, recorded as not applicable.
  sota_delta: >-
    ZERO on every attack axis. What the proposal delivers quantitatively is the
    cost equation with its two corrected inputs -- factor base B^2/(2 log B)
    rather than B/log B, and smoothness scale p^{1/2} rather than p^{1/3} --
    together with three named obstructions each carrying an exhibited
    falsifier, and a graded oriented-case table showing how the cost moves as
    the abelian shadow grows from O(1) to sqrt(p). If a prong bends, the delta
    is the reopening of the only architecture in this repository that has ever
    moved an exponent on a comparable problem, and the result routes to rule-12
    review immediately.

