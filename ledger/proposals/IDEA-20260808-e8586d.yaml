idea:
  id: IDEA-20260808-e8586d
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-FAEST-001
  goal_id: GOAL-FAEST-001
  title: The optimal multi-stage forgery split against FAEST is a MINIMISATION over stage
    boundaries that the grinding parameter makes non-convex - compute the exact optimum over
    all splits including grinding, and check whether the deployed parameters sit at it or
    leave bits on the table.
  class: measurement
  claim: For Fiat-Shamir-transformed multi-round MPCitH-style protocols, a forger need not
    guess all challenge components at once; it can attack stage by stage, so the forgery cost
    is the minimum over splits of the sum of per-stage inverse success probabilities, rather
    than the inverse of the product - the Kales-Zaverucha-style attack shape (recalled_unverified).
    FAEST's parameter choice must be set against this. CLAIM - when a GRINDING or proof-of-work
    parameter is present, the per-stage costs are no longer symmetric (grinding raises the
    cost of one specific stage by a tunable amount), so the optimal split is a non-trivial
    minimisation whose optimum can move as the grinding parameter changes. THE DELIVERABLE
    - the exact optimum computed over ALL stage splits at the twelve deployed parameter sets
    with grinding charged, compared against the security level FAEST claims. TWO OUTCOMES
    - the deployed parameters sit at or above the optimum, which is a tightness confirmation
    for this link and a genuine contribution to GOAL-FAEST-001's chain reconstruction; or
    a split exists whose charged cost is below the claimed category, which is a fully charged
    forgery cost model of exactly the kind the goal's completion criterion names.
  mechanism: In a multi-round protocol made non-interactive, the adversary controls the transcript
    and can therefore retry stage i without redoing earlier stages, provided the stage-i challenge
    depends only on the prefix. The total cost is then additive across stages rather than
    multiplicative, and the adversary chooses where to place effort. Grinding is designed
    to make one stage expensive; its effect on the OPTIMAL SPLIT is what needs computing,
    because raising the cost of one stage can shift the optimum to a different split entirely
    rather than raising the minimum by the same amount. This is a small optimisation over
    a discrete set (splits by repetition counts), exactly computable, and it does not need
    any solver.
  why_not_a_renamed_known_approach: Nearest known method - the Kales-Zaverucha attack on Fiat-Shamir
    transforms of multi-round MPCitH protocols (recalled_unverified), which is almost certainly
    already accounted for in FAEST's parameter selection. THE RECORD DOES NOT CLAIM THE ATTACK
    IS NEW. What it claims is that the OPTIMUM WITH GRINDING INCLUDED is a computation that
    this program has not performed and whose result it does not know, and that GOAL-FAEST-001's
    whole purpose is to reconstruct the chain rather than to trust it. Nearest internal record
    - IDEA-20260731-002, the forgery model, which sets up the model; this record computes
    the OPTIMUM over splits within that model with grinding charged, which is the step that
    turns a model into a number. LOSSY-PROJECTION TEST - the tracked object is the STAGE-BOUNDARY
    VECTOR (which challenge components are guessed at which stage), a projection of the adversary's
    strategy space that discards everything about how each stage is executed and keeps only
    where the boundaries fall. Compatible because the cost decomposes additively across boundaries
    by the protocol's own round structure. Genuinely lossy. PASSES.
  predictions:
  - observable: optimal split at each of the twelve deployed sets, with grinding charged
    metric: split vector and total charged cost in bits
    predicted: a specific number per set, pre-registered before comparison with the claimed
      level
  - observable: whether the optimal split changes as the grinding parameter varies over its
      deployed range
    metric: split vector as a function of the grinding parameter
    predicted: at least one set exhibits a CHANGE of optimal split within the deployed range;
      if the optimum is constant, grinding is acting as a uniform additive cost and the analysis
      simplifies - a clean, reportable outcome
  - observable: gap between the optimum and FAEST's claimed level
    metric: bits
    predicted: non-negative at every set (parameters sound), with the record informative if
      it is 0 (exactly tight) or large (conservative)
  - observable: sensitivity to the per-hash unit price
    metric: optimum recomputed under A1-10's corrected per-attempt price
    predicted: the two records COMPOSE - a cheaper per-attempt price shifts the optimal split
      toward more grinding attempts, so the combined effect is not the sum of the separate
      effects and must be computed jointly
  - observable: EM variants versus AES variants
    metric: optimum per family
    predicted: different, because IDEA-20260805-b9047c establishes the two families pose structurally
      opposite one-wayness problems; a single optimum quoted for FAEST as a whole would be
      an error
  minimal_test: Exact discrete optimisation, no compute of consequence. (1) Pin the deployed
    parameters (repetition counts, field, grinding parameter, consistency-check degree) at
    the twelve sets from primary source - the same RSF-5 blocker the campaign already owns.
    (2) Write the per-stage success probabilities as explicit functions of those parameters.
    (3) Enumerate ALL stage splits (a small discrete set) and minimise total charged cost,
    in exact arithmetic. (4) Recompute under A1-10's corrected per-attempt price and report
    the JOINT optimum. (5) Compare against the claimed category and against the matched AES
    baseline 2^126.1 in the same sentence.
  controls:
  - Reproduce the SINGLE-STAGE (naive) cost first and confirm it exceeds the multi-stage optimum,
    which is a baseline-embedding check on the optimiser.
  - Verify the optimiser on a synthetic protocol with hand-computable optimum.
  - Exact rational arithmetic; these are products of small probabilities and floating point
    silently underflows.
  - Independent recomputation of the per-stage probabilities by a second session, since a
    wrong probability formula produces a confident wrong optimum.
  confounders:
  - The stage decomposition depends on the actual challenge-derivation order in the deployed
    scheme; assuming a decomposition the implementation does not have would produce a fictitious
    attack.
  - FAEST's own analysis may already publish this optimum, in which case the deliverable is
    a reproduction - which is still valuable under this program's rules and must be labelled
    a reproduction, not a discovery.
  - Charging grinding at its nominal parameter rather than at its measured per-attempt cost
    double-counts or under-counts depending on direction; this is exactly where A1-10 plugs
    in and the two must be run together or the joint effect is mis-stated.
  falsification_conditions:
  - No admissible multi-stage split exists because the challenge derivation is fully sequential
    in a way that forbids partial retries - the attack shape does not apply to FAEST and that
    is a positive structural finding.
  - The computed optimum matches FAEST's published analysis exactly - a reproduction, reported
    as such.
  - The optimum is above the claimed category at every set - parameters are sound with margin,
    and the margin is the deliverable.
  interpretation_limits: A charged cost model, not an executed forgery. GOAL-FAEST-001's completion
    criterion requires a verifiable forgery certificate at reduced parameters for the attack
    branch; this record can only reach the cost model, and reaching it is explicitly not a
    break.
  assumptions:
  - The deployed parameters are obtainable from primary source (RSF-5).
  - Round-3 tweaks due 2026-08-14 may change them; the audited version must be named.
  heuristic_assumptions:
  - id: HA-1
    statement: FOR ALL stage splits, the per-stage success events are independent given the
      prefix, so the total cost is the sum of inverse per-stage probabilities.
    rigorous_ingredient: Independence given the prefix follows from the challenge being derived
      by a hash of the prefix, modelled as a random oracle - the scheme's own model, inherited
      rather than added.
    distribution_imitated: independent geometric trial counts per stage.
    validation_route: TOY, LABELLED. Instantiate a scaled-down VOLEitH-shaped protocol with
      tiny repetition count and field, run an actual multi-stage forgery search, and compare
      measured attempt counts against the geometric prediction per stage. This is a toy protocol,
      not FAEST, and is never presented otherwise.
    tail_checks: Report the empirical 99th percentile of attempts per stage against the geometric
      prediction; a heavy tail means the additive cost model understates the attacker's variance
      and the optimum is being chosen on a mean the attacker does not experience.
  - id: HA-2
    statement: grinding cost is exactly the nominal number of bits of work per accepted candidate,
      independent of the stage it is charged to.
    rigorous_ingredient: by definition of a proof-of-work threshold, if the deployed grinding
      is a leading-zero condition on a hash output.
    distribution_imitated: geometric with success probability given by the threshold.
    validation_route: read the deployed grinding predicate from source and confirm it is a
      threshold condition; if it is not, this assumption is replaced by the actual predicate's
      success probability.
    tail_checks: confirm the predicate's acceptance probability empirically over 10^6 samples
      in a re-implementation, since an off-by-one in a threshold is a full bit.
  target_complexity:
    time_exponent: The deliverable is the FORGERY COST EXPONENT at the twelve deployed sets
      under the optimal split with grinding charged, stated in bits against FAEST's claimed
      category and against the matched AES baseline 2^126.1. No improvement is claimed in
      advance; the pre-registered deliverable is the optimum.
    memory_exponent: Negligible for the optimisation; the attack shape it prices is memoryless
      per stage, which is worth stating because a memoryless attack is not defensible by memory
      charging.
    best_known_baseline: FAEST's own claimed security levels at the twelve deployed sets.
    hidden_overhead_disclosure: The optimum is over the SPLITS THE PROTOCOL ADMITS. If the
      deployed challenge derivation forbids a split, that split is not merely expensive, it
      is unavailable, and including it would manufacture an attack. Establishing which splits
      are admissible is a source-reading task, not an arithmetic one, and it is the record's
      main risk.
    time_memory_tradeoff: Not applicable - the attack shape is memoryless; that is a strengthening,
      not an omission.
  sota_delta: Either a tightness confirmation for one link of the chain, or a charged cost
    below the claimed category. Against the published state of the art - not asserted; the
    comparison is to FAEST's own claim.
  dominated_by: IDEA-20260731-002 (the forgery model) is the row this extends and dominates
    it only in the sense of supplying the model this record optimises within; IDEA-20260801-005
    (chain reconstruction with per-round soundness error) dominates on breadth and stops short
    of the optimisation. IDEA-20260805-b9047c (AES versus EM one-wayness split) is an input
    this record must respect rather than a competitor. Checked all seven RQ-FAEST-001 records.
  estimated_cost: implementation LOW; compute LOW; one producer slot, gated on RSF-5 like
    every other FAEST item.
  recommended_priority: medium
  honest_prior_of_survival: The optimum being computable from pinned parameters - 0.8. The
    optimal split MOVING within the deployed grinding range - 0.35. The optimum landing below
    FAEST's claimed category - 0.08; designers of this family are acutely aware of the multi-stage
    attack and it is the first thing their parameter selection addresses. The record's expected
    value is therefore mostly in the CONFIRMATION branch, and I rank it medium rather than
    high for exactly that reason.
