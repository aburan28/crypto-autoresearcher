idea:
  id: IDEA-20260930-655544
  question_id: RQ-INSTR-f8faa0
  added: '2026-10-01'
  status: proposed
  approved_by: null
  title: >-
    THE OVERLAP-REVIEW INSTRUMENT FAILED ITS NEGATIVE DIRECTION THIS ROUND: the
    lane-context extract for L2 (context/L2-ENDO.md) lists zero proposals and
    zero hypotheses for nine of GOAL-ENDO-001's fourteen lanes while the ledger
    holds 141 proposals and 76 hypotheses whose question_id is one of those nine
    (counted by grep this session), so the brief's "several lanes with no
    proposal at all" was an instrument false negative that would have let two of
    this session's three candidates be filed as duplicates -- specify the
    extractor as a literal reader of every question_id in the goal head, with
    the two-directional control RQ-INSTR-f8faa0 demands (a planted record under
    a secondary token is listed; a record under a foreign question is not) and a
    regression that fails whenever any goal lane lists fewer records than a
    literal grep
  class: tooling

  claim: >-
    (A) THE MEASURED DEFECT. analysis/ecc-ideation-20260930/context/L2-ENDO.md
    ("generated 2026-09-30 from committed ledger state") lists 77 hypotheses and
    104 proposals, all with question_id in {RQ-ECDLP-912694, RQ-JINV-8fc13a,
    RQ-ICINV-475b5e, RQ-GGMB-6eaabc, RQ-INSTR-f8faa0} plus RQ-ECDLP-002, and
    none under the other nine lane questions of the goal head. A Grep over
    ledger/ for "question_id: RQ-(TORS-8c7b79|CLGP-b99df5|MTGT-2cabee|
    VOLC-f6253b|EQIC-8cb959|EQLA-0d3f40|EWALK-8fa147|CANL-63098f|MODEL-e61cb2)"
    run by this session returned 141 proposal files (MTGT 17, CLGP 18, TORS 13,
    EWALK 16, VOLC 21, EQIC 12, EQLA 13, CANL 16, MODEL 15) and 76 hypothesis
    files (TORS 8, CANL 11, EQLA 6, VOLC 10, MTGT 10, EQIC 8, EWALK 6, CLGP 10,
    MODEL 7), the per-lane counts being this session's own tally of the grep
    output. The handoff card and BRIEF.md section 2 state "fourteen lanes,
    several with no proposal at all" and instruct the generator to "prefer
    lanes where context/L2-ENDO.md shows no open proposal". Both statements
    rest on the extract. The extract was wrong on nine lanes.

    (B) WHY THIS IS AN RQ-INSTR-f8faa0 MATTER AND NOT A CLERICAL ONE. Every
    proposal's origin.overlap_review asserts a NEGATIVE: "this record is not
    one of the existing records". The decision_target of RQ-INSTR-f8faa0 says
    an instrument that cannot detect a planted signal cannot support a
    negative. The overlap instrument of this round -- the lane context extract
    -- demonstrably did not detect 141 existing signals, so no overlap_review
    written from it alone could support its negative. Concretely: this
    session's first TORS candidate (the Hom(Z/N, ell-primary) = 0 closure) is
    IDEA-20260807-6eab6a / H-TORS-9851f8 verbatim, and its first MTGT candidate
    (one table per isogeny class, pull the two targets) is IDEA-20260807-a127ab
    verbatim; both would have been filed under the extract's guidance and both
    were caught only by a literal grep. The defect is therefore a false
    negative of the campaign's novelty instrument, which is exactly the
    direction the lane exists to audit.

    (C) THE PROBABLE CAUSE, STATED AS A HYPOTHESIS AND NOT A FINDING. The
    card's objective names five questions explicitly and the other nine as "or
    one of"; the extract contains exactly the five (plus RQ-ECDLP-002 records
    that cite them). The likely mechanism is that the extractor was run over
    the five explicitly named ids rather than over the goal head's
    question_ids list. A second candidate mechanism is BRIEF.md section 1d's
    classification gap: tools/ecc_priority.py --classify reports the non-ECC
    tokens as non-ECC, and an extractor built on that classifier would drop
    them. Which mechanism operated is NOT determined here; the record's
    deliverable does not depend on it.

    (D) THE INSTRUMENT SPECIFICATION. An overlap extractor for a goal G reads
    ledger/goals/G/goal.yaml question_ids (and RQ-ECDLP-002 when the goal names
    a parent), then for every proposal and hypothesis under ledger/ matches
    question_id, question_ids[] and goal_ids[] LITERALLY (the 2026-09-05
    records carry question_ids lists and goal_ids rather than a single
    question_id, e.g. IDEA-20260905-809a81), and emits one row per record with
    id, status, question, title. Two-directional control, run before every
    ideation round: PLANTED -- a synthetic proposal file under a scratch
    directory with question_id equal to the goal's least-populated lane must
    appear in the extract; NULL -- a synthetic record under a question outside
    the goal must not. REGRESSION -- for every question_id in the goal head,
    the extract's count must equal the count of a literal grep for
    "question_id: <id>" plus list-form matches; any shortfall fails the build
    of the context directory. The regression asserts EQUALITY of two derived
    counts on the same tree, not a floor on corpus size, so it does not drift.

  mechanism: >-
    OBJECT FRAME, STATED AS NOT APPLICABLE WITH THE REASON (the card requires a
    placement or a named obstruction). The record tracks no projection of a
    group element and consumes no non-generic resource: it is an audit-lane
    tooling record of the same kind as IDEA-20260807-cb672c (resource_label
    "Audit: consumes no resource") and the review-pipeline instruments
    IDEA-20260808-b3c97b and IDEA-20260808-8aaddb. The trichotomy of
    IDEA-20260806-c5d183 and the lossy-projection test do not apply to a
    corpus-indexing tool; forcing a class would be the relabelling the
    protocol warns against. SIMULABILITY: not applicable; no oracle on G is
    consumed. NON-GENERIC RESOURCE: none.

    WHY THE INSTRUMENT'S FAILURE MODE IS THE SILENT ONE. A lane extract that
    lists SOME records looks complete; the reader has no second source and the
    brief's instruction to prefer empty lanes converts the omission into a
    bias toward exactly the lanes most likely to produce duplicates. The
    repair is not "be more careful" but a control that fails loudly: the
    planted record is cheap, the equality regression is exact, and both run
    at zero research cost before any generator is launched.

    WHAT THE RECORD DOES NOT CLAIM. It does not claim the five-lane scoping was
    unintended (the card may have meant the extract to cover the five); it
    claims only that the brief's statements about empty lanes and the
    instruction to prefer them were not supported by the extract, and that an
    overlap instrument must cover the goal head's full question list or say
    explicitly that it does not.

