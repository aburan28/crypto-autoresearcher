  assumptions:
    - The committed tree at the session's base (5cd61253a on claude/elliptic-curve-goals-3bfz9x) is the state the extract claims to summarise.
    - A proposal "exists in a lane" iff its question_id, or any entry of its question_ids list, equals the lane's RQ id; records that only CITE a lane id in prose are not counted and were not counted.
    - 'The goal head question_ids list (14 ids) is the authority on what the goal''s lanes are, per the head projection in context/L2-ENDO.md.'

  proof_search_map:
    bottleneck: >-
      Whether the overlap extract covers the goal's full question list; if it
      does not, every overlap_review written from it is unsupported.
    baseline_embedding:
      parameter_slice: >-
        The five explicitly named questions, on which the extract and a
        literal grep must AGREE (the record predicts they do; the counts in the
        extract for RQ-INSTR-f8faa0 and RQ-GGMB-6eaabc were not re-tallied this
        session and are listed as a required check).
      reproduction_check: >-
        For each of the five, count "question_id: <id>" matches in
        ledger/proposals and ledger/hypotheses and compare with the extract's
        rows; equality is the baseline.
    observation_collision:
      observable: >-
        Per lane: the extract's row count and the literal-grep count.
      distinct_preimage_search: >-
        A matching count can hide a swapped record (one missing, one spurious);
        the regression therefore compares the SETS of ids, not the counts, and
        reports symmetric differences.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The per-lane symmetric difference between extract ids and
          literal-grep ids, summed over the goal's question list, charged over
          disjoint lanes.
        predicted_gain: >-
          Zero research gain; the deliverable is that the next round's
          overlap_review negatives become supportable.
    quantifier_order: >-
      FOR ALL goals G and FOR ALL question ids in G's head, the extract's id
      set equals the literal match set -- a checkable equality on one tree.
      EXISTS a lane with a nonzero symmetric difference IS the defect; this
      session exhibits nine.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At tree T the extract and the literal matcher agree on every lane of
        G, and the planted/null controls pass." It certifies nothing about
        semantic duplication (two records under different ids saying the same
        thing), which remains the generator's reading task and
        IDEA-20260815-a5a19f's question.
      nearby_object_control: >-
        A goal whose head lists only ECC-token questions (any SCURVE goal): the
        ECC-classifier mechanism of (C) would NOT drop anything there, so an
        extractor built on the classifier passes on that goal and fails on
        GOAL-ENDO-001; if the fixed extractor's counts differ from the literal
        grep on a SCURVE goal too, the cause is not the classifier.
    proof_obligations:
      - claim: The nine per-lane counts in (A) equal a re-run of the stated grep.
        responsibility: correctness
      - claim: The planted record is listed and the foreign record is not, on every goal tested.
        responsibility: correctness
      - claim: The regression compares id sets, not sizes, and is exact rather than a floor.
        responsibility: strictness
      - claim: The extractor reads question_id, question_ids[] and goal_ids[] literally.
        responsibility: interface
    not_applicable_reason: null

  predictions:
    - metric: literal-grep proposal count per lane for the nine lanes of (A)
      direction: same
      minimum_effect: >-
        Exactly the nine counts stated in (A) at tree 5cd61253a (141 total); a
        different count on the same tree means this session mis-tallied and the
        record is corrected by supersession, never edited.
    - metric: symmetric difference between the fixed extractor's id set and the literal set, per lane
      direction: same
      minimum_effect: 'Empty on every lane of GOAL-ENDO-001; any nonempty lane fails the regression.'
    - metric: planted synthetic record under the least-populated ENDO lane
      direction: same
