    - metric: synthetic record under a question outside the goal
      direction: same
      minimum_effect: Not listed (negative direction).
    - metric: extract-versus-grep agreement on the five explicitly named questions
      direction: same
      minimum_effect: Equality (baseline); a disagreement there widens the defect beyond (C)'s hypotheses.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, minutes). Re-run the grep of (A) at the base
      commit and compare with the nine counts; re-tally the five named lanes
      against the extract (baseline). STAGE 1 (tooling, under an hour).
      Implement the extractor of (D) as a small script under tools/ (or as an
      option of whatever produced context/L2-ENDO.md, if it is a script -- not
      identified this session) reading the goal head's question_ids and
      matching question_id / question_ids[] / goal_ids[] literally; emit rows
      sorted by lane. STAGE 2 (controls). PLANTED: write a synthetic proposal
      under a scratch path included in the search with question_id equal to
      the least-populated ENDO lane and confirm it is listed; NULL: a synthetic
      record with question_id RQ-SSIQ-9702af must not be listed for
      GOAL-ENDO-001; REGRESSION: per-lane id-set equality against the literal
      matcher, exact. STAGE 3. Run on GOAL-ENDO-001 and on one SCURVE goal (the
      nearby-object control). OUTCOME TABLE. PASS: all four controls hold and
      the ENDO extract now lists 141 + the five lanes' records; the next
      ideation round's overlap_review negatives are supportable. FAIL-A: the
      literal matcher disagrees with (A) -- this record's numbers are wrong and
      are superseded. FAIL-B: the fixed extractor still misses records on a
      SCURVE goal -- the cause is not (C) and the record's cause hypothesis is
      dropped while its specification stands. NOTHING HERE IS A RUN RECORD:
      the counts are file-system facts and the controls are tool tests, capped
      at claim_tier toy as the RQ requires.
    controls:
      - 'PLANTED synthetic record under a secondary-token lane: must be listed.'
      - 'NULL synthetic record under a foreign question: must not be listed.'
      - 'REGRESSION: exact id-set equality per lane against a literal matcher; sets, not counts.'
      - 'BASELINE: extract-versus-grep equality on the five explicitly named questions.'
      - 'NEARBY OBJECT: a SCURVE goal with ECC-token questions only, on which the classifier mechanism cannot drop anything.'
    required_metrics:
      - per-lane literal counts for the nine lanes and the five, with the symmetric differences
      - pass/fail of the planted, null, regression and baseline controls
      - the extractor's source path and the command line used, recorded in the report

  falsification_conditions:
    - 'The nine counts in (A) are not reproduced by the stated grep at the base commit: the record is superseded with the corrected counts.'
    - 'The extract as committed DOES contain records for any of the nine lanes under another section this session failed to read: the defect is narrower than stated and the record is re-scoped by supersession.'
    - 'The planted record is not listed by the fixed extractor: the fix is wrong.'
    - 'The foreign record is listed: the fix over-matches (e.g. prose citations counted).'

  confounders:
    - >-
      Records in the 2026-09-05 batch carry question_ids lists and goal_ids
      rather than a single question_id; a matcher on "question_id:" alone
      under-counts them (this session's grep matched the singular key at
      column 3 and the list-form records that also carry a singular key; the
      list-only cases, if any, are not in the 141 and would only raise it).
    - >-
      Some hypothesis files carry a different area token from their question
      (e.g. H-ICEX-c3de6f under RQ-TORS-8c7b79); any extractor keyed on the id
      prefix rather than the question_id field will miss them, which is the
      same failure mode as (C)'s second mechanism.
    - >-
      Prose citations of an RQ id inside other records (hundreds of files
      matched the bare id string) must NOT be counted; the matcher must key on
      the field.

