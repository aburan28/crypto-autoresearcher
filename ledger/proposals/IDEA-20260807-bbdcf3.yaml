idea:
  id: IDEA-20260807-bbdcf3
  question_id: RQ-CLGP-b99df5
  added: '2026-08-07'
  title: >-
    THE SIZE GAP PRICED HONESTLY, IN BOTH DIRECTIONS: because h(O) ~ sqrt(p)
    while N ~ p, a bridge could carry at most HALF of k -- and half of k is
    exactly enough to move the ECDLP exponent from 1/2 to 1/4 by kangaroo on
    the residual interval -- so the prize is real; the same inequality
    h(O) < N is precisely what forces Hom(Z/N, Cl(O)) = 0 and kills every
    homomorphic bridge, and the record states the exact hypothesis that would
    have to fail for the route to reopen
  class: mechanism

  claim: >-
    (A) THE TWO NUMBERS, AND WHY THE GAP CUTS BOTH WAYS. For an ordinary
    E/F_p with Frobenius trace t, discriminant D = t^2 - 4p and
    End_{F_p}(E) = O:
      h(O) = O( sqrt(|D|) log|D| ) = O( sqrt(p) log p )   [unconditional]
      h(O) = |D|^{1/2 + o(1)}                             [Siegel, ineffective]
      N    = #E(F_p)/c >= (p + 1 - 2 sqrt p)/c            [Hasse]
    So the class group is QUADRATICALLY SMALLER than the point group. This
    single inequality is the hinge of the whole lane, and it does two opposite
    things at once. That is the content of this record.

    (B) THE PRIZE, COMPUTED. Suppose -- counterfactually -- that some
    efficiently computable map delivered the class-group coordinate of a
    k-dependent curve, i.e. delivered k mod M for some M ~ h ~ sqrt(N). Then:
      - obtaining that coordinate by SEARCH over Cl(O) costs O(sqrt(h)) =
        O(N^{1/4}) action evaluations (KN-TECH-027 baseline; meet-in-the-
        middle or kangaroo on the Cayley graph);
      - the residual unknown is k in an interval of width N/M ~ sqrt(N),
        solved by Pollard's kangaroo/lambda method in ~2 sqrt(N/M) = O(N^{1/4})
        group operations;
      - TOTAL: N^{1/4 + o(1)} time.
    That is an EXPONENT MOVE from 1/2 to 1/4 on prime-field ECDLP -- the class
    of result docs/target-result-profile.md exists to chase. The lane is
    therefore NOT a curiosity, and a shrug is not an acceptable deliverable.
    Note also the CEILING: Cl(O) has h elements, so ANY bridge into it carries
    at most log2 h ~ (1/2) log2 N bits. A bridge cannot deliver all of k. The
    best conceivable version of this route is exactly the half-and-half split
    above, and its exponent is exactly 1/4, never lower. Stating the ceiling
    before searching is what keeps the search honest.

    (C) WHAT WOULD HAVE TO BE TRUE -- FOUR CONDITIONS, EACH SEPARATELY
    NECESSARY. For the prize in (B) to be collectable there must exist a
    family of maps psi_{E,P} : G -> Cl(O) (or into the isogeny class, which is
    a Cl(O)-torsor) such that:
      (C1) COMPUTABILITY. psi is evaluable in polynomial time from public data
           (E, P, Q) with no discrete logarithm.
      (C2) NON-CONSTANCY. psi([k]P) varies with k, on a set of k of density
           bounded away from zero.
      (C3) STRUCTURE. psi is compatible enough with the arithmetic of Z/N that
           recovering psi(Q) yields a CONGRUENCE on k -- not merely a
           correlation. Anything less gives at most a distinguisher, and a
           distinguisher on curves is not a bit of k.
      (C4) IN-CLASS LANDING. psi's image lies in the isogeny class of E, so
           that the class-group search of (B) applies.
    (C3) is where "structure" must be made precise, and the only precise
    version available is: psi is a GROUP HOMOMORPHISM G -> Cl(O), possibly
    after composing with a torsor trivialisation.

    (D) OBS-5, THE COUNTING KILL -- THE SAME INEQUALITY, USED AGAINST THE
    ROUTE. G has PRIME order N. If N > h(O) then gcd(N, h(O)) = 1, and the
    image of any group homomorphism psi : G -> Cl(O) is a subgroup of Cl(O)
    whose order divides the prime N and divides h; hence the image is trivial
    and psi = 0. Therefore (C2) and (C3) are INCOMPATIBLE: any psi satisfying
    (C3) in its precise form is constant, violating (C2).
    The threshold is explicit: N > h(O) holds whenever the cofactor satisfies
      c  <  (p + 1 - 2 sqrt p) / (C sqrt p log p)  ~  sqrt(p) / (C log p),
    which covers every standardised curve (c <= 8) by an enormous margin.
    THE GAP IS THUS SELF-DEFEATING: it is large enough to make the prize
    worth p^{1/4}, and it is large enough to force gcd(N, h) = 1 and kill the
    only precise version of (C3).

    (E) THE EXACT ESCAPE HYPOTHESIS, STATED SO IT CAN BE ATTACKED. OBS-5 needs
    N > h(O). Two ways out, both named here rather than left implicit:
      (E1) N <= h(O), i.e. cofactor above ~sqrt(p)/log p. Then N | h is
           possible and a nonzero homomorphism EXISTS abstractly. This is a
           real regime, constructible at toy scale, and it is probed by the
           minimal test. PREDICTED OUTCOME: existence does not give
           computability -- Cl(O) has no canonical Z/N-quotient attached to
           the curve, and pinning one requires the class group structure
           (L_{|D|}(1/2) by Hafner-McCurley) AND an identification that the
           curve data does not supply. So a SECOND obstruction is predicted to
           appear exactly where the first lapses, and finding out whether it
           does is the experiment.
      (E2) Drop (C3)'s homomorphism requirement. Non-homomorphic psi are not
           excluded by counting. This is the honest residual open class and
           the record does NOT close it. What the record does is price it: a
           non-homomorphic psi still cannot carry more than log2 h bits by
           (B)'s ceiling, so even the best non-homomorphic bridge caps the
           route at exponent 1/4.

    (F) THE DELIVERABLE. Either a named quantity (the prize, 1/2 -> 1/4, with
    its ceiling), a named obstruction (OBS-5, unconditional, with an explicit
    cofactor threshold), and a named residual class (E1, E2) -- or, if the
    escape regime experiment surprises, a live lead. Both outcomes are
    informative, which is the quality bar.

  resource_label: >-
    R3 (End(E) as a ring: class number, ideal classes) with R4 as the setting
    (the class group acts on curves). The mechanism consumes the ARITHMETIC of
    O, not any group operation on G.
  admissibility: admissible
  admissibility_argument: >-
    Admissible: the resource is h(O) and the group structure of Cl(O), which
    are invisible to a generic group oracle for G -- a generic oracle cannot
    even express "the class number of the endomorphism ring". Nothing here
    applies an endomorphism to a point of G, so H-ENDO-001 does not bite and
    the oracle classes closed in KN-FIND-b7e091 are not used. The proposal is
    admissible and is then closed by OBS-5, a counting obstruction that is
    strictly stronger and cheaper than the admissibility filter.

  discriminated_from:
    - >-
      IDEA-20260807-5d7606 (forward reduction). That record kills the
      CANONICAL bridge by constancy (the kernel-ideal map exists and is
      constant). This record kills ALL HOMOMORPHIC bridges by counting, and
      separately prices the prize. Two different obstructions, and the counting
      one applies even to bridges that are not the kernel-ideal map.
    - >-
      IDEA-20260807-0fafe8 (backward reduction) uses the same Hom-vanishing
      count on the oracle's ANSWER space. Here it is used on the INSTANCE
      space, and it is paired with the exponent accounting, which that record
      does not do. The shared lemma is cited in both rather than duplicated,
      and both records say so.
    - >-
      KN-TECH-018 (automorphism-discounted rho) is the program's only recorded
      "structure gives a discount" result, and it is a CONSTANT sqrt(|Aut|)
      <= sqrt(6). This proposal is about an EXPONENT, and its conclusion is
      that the exponent is not available by this route -- so it neither
      extends nor competes with KN-TECH-018.
    - >-
      KN-FIND-5c1a03 records that prime-field ECDLP has minimal algebraic
      structure (2D commutative End, versus the 4D quaternion structure that
      buys Wesolowski's p^{1/3}). This record is the QUANTITATIVE version of
      that finding for one specific structure: the 2D commutative End does
      supply a group, and that group is exactly a factor sqrt(p) too small and
      coprime to N.

  object_first_candidate:
    tracked_object: >-
      THE PAIR OF ORDERS (N, h(O)) TOGETHER WITH gcd(N, h(O)) AND THE BIT
      BUDGET log2 h(O) / log2 N. Followed across the parameter space (p, t, c)
      and along the isogeny class.
    lossiness: >-
      EXTREMELY LOSSY and compatibly so: it discards the curve, the points,
      the ideals and every algorithm, keeping two integers and a gcd. The
      discarding is compatible with the target's operations because any
      structure-preserving bridge is a homomorphism, and homomorphism
      existence is a function of the orders alone -- so the retained part
      propagates deterministically under exactly the operations a bridge could
      use. This is not a change of coordinates: an entire family of
      algorithmic questions collapses onto a divisibility.
    propagation: >-
      One-step propagation is defined and trivially measurable: apply any
      isogeny step to move within the class; (N, h, gcd, bit budget) is
      unchanged, since N is a class invariant (fixed t) and h depends only on
      O, which changes only when the walk crosses volcano levels -- and there
      it changes by the explicit conductor formula h(O) = h(O_K) f prod_{l|f}
      (1 - (D_K/l)/l) / [O_K^*:O^*], which is computable, so the propagation
      is deterministic even across levels.
    survival_score: >-
      Survives every isogeny, every volcano level (via the conductor formula),
      and every cofactor below ~sqrt(p)/log p. DIES exactly at N <= h. The
      object therefore has a sharp, computable death boundary, which is the
      strongest form of a survival score: not "it degrades" but "here is the
      hypersurface where it stops being true".

  mechanism: >-
    STEP 1 (zero compute). Write the prize computation of (B) with explicit
    constants: kangaroo on width W costs ~2 sqrt(W); class-group MITM costs
    ~c sqrt(h) action evaluations; total N^{1/4} with the two constants and
    the cost of ONE action evaluation carried through, not hidden.

    STEP 2 (zero compute). Prove the ceiling: log2 h <= (1/2) log2 |D| + O(log
    log |D|) <= (1/2) log2 (4p) + O(log log p), so a bridge into Cl(O) carries
    at most half of k's bits. This bounds the ROUTE, not just one attempt, and
    it is what makes the record a closure rather than a report.

    STEP 3 (zero compute, HARD GATE). Prove OBS-5 with the explicit cofactor
    threshold. Unconditional.

    STEP 4 (toy compute). Measure the two numbers rather than trusting the
    asymptotics: over a ladder of toy primes, enumerate ordinary curves,
    compute (t, D, f, O, h(O), N, c), and produce the empirical joint
    distribution of (h/N, log2 h / log2 N, gcd(N, h)). Predicted:
    log2 h / log2 N concentrates near 1/2; gcd(N, h) = 1 on essentially all
    small-cofactor instances.

    STEP 5 (toy compute, THE ESCAPE-REGIME EXPERIMENT). Construct the regime
    (E1) deliberately: search toy parameters for ordinary curves whose
    prime subgroup order N DIVIDES h(O). This is feasible at toy scale
    because N can be made small (large cofactor) while |D| ~ 4p keeps h
    large. For each such instance:
      (a) confirm a nonzero homomorphism Cl(O) -> Z/N exists, by computing the
          structure of Cl(O) and exhibiting its Z/N-quotients; count them;
      (b) ask whether any is CANONICAL -- i.e. determined by (E, P, N) with no
          arbitrary choice. Test operationally: recompute the quotient from a
          DIFFERENT but equivalent presentation of Cl(O) (different generator
          set, different reduction convention) and check whether the same
          quotient map is obtained. A "canonical" map must be presentation
          independent;
      (c) if a canonical map is found, test whether composing it with any
          publicly computable instance-to-Cl(O) map is non-constant in k --
          which loops back to OBS-1 of IDEA-20260807-5d7606.
    PREDICTED: (a) yes, (b) no, (c) moot. A YES at (b) is the single most
    valuable outcome in this lane and would be escalated immediately.

    STEP 6 (zero compute). Record the residual class (E2) with its priced
    ceiling, and hand it to the R1 lanes.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Repository greps on 2026-08-07 over ledger/, knowledge/, docs/,
      analysis/: "class group|Cl\(O\)|class number|h\(O\)"; "vectoriz";
      "p^{1/4}|N^{1/4}"; "kangaroo"; "Cohen-Lenstra". Full reads of
      KN-TECH-027, KN-TECH-029, KN-TECH-018, KN-FIND-5c1a03, KN-FIND-b7e091,
      DECOMPOSITION.md, RQ-CLGP-b99df5.
    results: >-
      No record in ledger/ or knowledge/ computes what an ECDLP bridge into
      Cl(O) would be worth, and none states the log2 h ceiling. KN-TECH-029
      records p^{1/4} figures but for the SUPERSINGULAR isogeny problem
      (Delfs-Galbraith F_p-subgraph and Biasse-Jao-Sankar quantum), which is a
      different p^{1/4} and must not be conflated. KN-TECH-027 gives
      classical vectorization at O(sqrt(#Cl)). KN-FIND-5c1a03 states the
      structural gap qualitatively; this record quantifies one half of it.
    verdict: >-
      ADAPTATION. The class number bound, the Hasse bound, Lagrange, and the
      kangaroo cost are all textbook. New to this corpus: the explicit
      half-and-half exponent accounting that prices the prize at 1/4, the
      log2 h information ceiling on the whole route, and the observation that
      the same inequality h < N which makes the prize large is what makes the
      homomorphism vanish. No external novelty claimed; if this accounting
      exists in the literature, a citation is a better deliverable than this
      record.

  null_object_control: >-
    MANDATORY AND BLOCKING, and it is a PLANTED-BRIDGE control because the
    predicted result is a null. Construct a synthetic instance family in which
    a bridge EXISTS BY CONSTRUCTION: take an abstract cyclic group A of order
    N, a subgroup B <= A of index M with M | h, and define a fake "class
    coordinate" chi(Q) := (k mod M) mapped into a fixed Z/M-quotient of a
    synthetic Cl of order h with M | h. Run the entire detection and
    exponent-accounting pipeline on that family. It MUST report a non-constant
    bridge, MUST recover k mod M, and the measured total solve cost MUST fall
    to ~ sqrt(h) + sqrt(N/M). A pipeline that fails to recover the planted
    half is blind and every null it reports on real curves is void: the run
    set is INVALID, not negative.
    DECAY PARAMETER: M, the modulus the planted bridge carries. As M -> 1 the
    measured speedup must decay to 1 and the recovered-bit count to 0. A
    reported speedup that does NOT decay as M -> 1 is the canonical artifact
    tell and indicates the harness is leaking k through the instance
    generator.

  assumptions:
    - >-
      Ordinary curves; Cl(O) acts freely and transitively on the set of
      F_p-isomorphism classes with End_{F_p} = O
      (Deuring/Waterhouse/Kohel). Verified at toy scale by orbit counting.
    - >-
      The unconditional class number upper bound h(|D|) = O(sqrt|D| log|D|) is
      used for OBS-5. Siegel's lower bound h >= |D|^{1/2 - eps} is quoted only
      to say the gap is genuinely quadratic and is INEFFECTIVE; nothing in
      OBS-5 depends on it.
    - >-
      The prize computation assumes the counterfactual bridge would deliver
      k mod M with M ~ h. Any smaller M gives a proportionally smaller prize:
      with M = N^{alpha}, total cost is max(N^{alpha/2}, N^{(1-alpha)/2}),
      minimised at alpha = 1/2. The record carries the general formula, not
      only the balanced point, so a partial bridge is priced too.
    - >-
      Pollard's kangaroo/lambda method on an interval of width W costs
      ~2 sqrt(W) group operations with O(1) memory. Classical, named, and used
      only for the residual half.

  proof_search_map:
    bottleneck: >-
      Condition (C3): making "structure" precise. Everything else in the
      record is arithmetic. If (C3) can be weakened to something that is both
      (i) not a homomorphism and (ii) still yields a congruence rather than a
      correlation, OBS-5 does not apply and the lane reopens. Attacking (C3)
      is the highest-value red-team action against this record.
    baseline_embedding:
      parameter_slice: >-
        M = 1 (no bridge). The exponent accounting must then reduce exactly to
        the incumbent: 2 sqrt(N) kangaroo over the full interval, or 0.886
        sqrt(N) parallel rho (KN-TECH-001/KN-TECH-006). If the general formula
        max(N^{alpha/2}, N^{(1-alpha)/2}) does not degenerate to N^{1/2} at
        alpha = 0, the accounting is wrong.
      reproduction_check: >-
        Frozen fixture: solve three toy instances by kangaroo over the full
        interval and over a planted known-half interval, and check the
        measured operation counts against 2 sqrt(N) and 2 sqrt(N/M)
        respectively, within 25 percent. This validates the cost model before
        it is used to price a hypothetical.
    observation_collision:
      observable: >-
        The class-group coordinate psi(Q) in Cl(O) that a bridge would return.
      distinct_preimage_search: >-
        REQUIRED, AND THE COLLISION IS FORCED BY COUNTING RATHER THAN FOUND BY
        SEARCH: since |Cl(O)| = h < N, the pigeonhole principle guarantees at
        least N/h ~ sqrt(N) values of k share any given observable value, for
        ANY psi whatsoever, homomorphic or not. This is the record's cleanest
        statement: the observable's fibres have size at least sqrt(N)
        unconditionally, which IS the log2 h ceiling restated, and it bounds
        every conceivable bridge and not merely the ones we thought of.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The balanced split k = k_1 + M k_2 with M ~ sqrt(N): specialise the
          unknown into a class-group half and an interval half, measure each
          half's cost, and pack them into a total. This is the transform that
          produces the 1/4 exponent, and running it explicitly is what makes
          the prize a number instead of an intuition.
        predicted_gain: >-
          Exponent 1/2 -> 1/4 IF a bridge existed. Predicted actual gain:
          zero, because the bridge does not exist by OBS-5. The transform's
          value is that it prices the counterfactual precisely.
      - transform: boundary_lift
        proposed_object: >-
          Instances with N | h(O) (the escape regime E1), where OBS-5's
          hypothesis fails.
        predicted_gain: >-
          Either a second obstruction appears (canonicity/computability), in
          which case the closure is much stronger than a counting argument, or
          it does not, in which case the lane is live. Both are decisive.
    quantifier_order: >-
      INTENDED (the counterfactual a bridge would need): FORALL p, FORALL
      (E, O, P, N), THERE EXISTS a polynomial-time computable psi_{E,P} : G ->
      Cl(O), such that FORALL k in a density-Omega(1) subset of Z/N, psi([k]P)
      determines k mod M with M ~ h.
      WHAT OBS-5 ASSERTS: FORALL p, FORALL (E, O, P, N) with N prime and
      N > h(O), FORALL group homomorphisms psi : G -> Cl(O), psi = 0. No
      existential, no algorithmic quantifier -- a theorem.
      WHAT THE CEILING ASSERTS: FORALL functions psi : G -> Cl(O) whatsoever,
      THERE EXISTS a fibre of size at least N/h > sqrt(N)/log-ish. Also no
      algorithmic quantifier, and it is the statement that bounds the residual
      open class (E2).
      NOT CLAIMED: that no psi exists (they exist in abundance as functions);
      that no reduction exists (non-homomorphic, statistical and multi-
      instance routes are outside).
    method_ceiling:
      strongest_certifiable_claim: >-
        "For N prime with N > h(O): every homomorphic bridge G -> Cl(O) is
        zero, and every bridge of any kind has fibres of size at least N/h,
        capping the whole route at exponent 1/4." It can NEVER certify that
        the ECDLP is hard, that no reduction exists, or anything about
        composite-order or huge-cofactor curves. Dropping the "homomorphic"
        qualifier from the first clause is the specific overclaim to guard
        against.
      nearby_object_control: >-
        THE PLANTED SYNTHETIC FAMILY of null_object_control, where a bridge
        exists by construction and the exponent DOES drop to 1/4. The argument
        must NOT close that family. If a version of OBS-5 also "kills" the
        planted bridge, it is proving too much and has mis-identified the
        load-bearing structure (probably by assuming N > h where the planted
        family has M | h by construction).
    proof_obligations:
      - claim: h(|D|) = O(sqrt|D| log|D|), unconditional.
        responsibility: size
      - claim: >-
          N > h(O) whenever c < (p + 1 - 2 sqrt p)/(C sqrt p log p).
        responsibility: size
      - claim: gcd(N, h) = 1 implies Hom(Z/N, Cl(O)) = 0.
        responsibility: correctness
      - claim: >-
          Every function G -> Cl(O) has a fibre of size at least N/h.
        responsibility: correctness
      - claim: >-
          Knowing k mod M reduces ECDLP to kangaroo at ~2 sqrt(N/M).
        responsibility: runtime
      - claim: >-
          The balanced choice M ~ sqrt(N) minimises the total and gives
          N^{1/4}.
        responsibility: runtime
      - claim: >-
          The planted-bridge control does exhibit the 1/4 exponent.
        responsibility: soundness

  predictions:
    - metric: >-
        log2 h(O) / log2 N over toy ordinary curves with cofactor c <= 8
      direction: different
      minimum_effect: >-
        Concentrated in [0.40, 0.60] with median within 0.05 of 0.50 at the
        largest toy p. A median outside that band means the quadratic gap is
        not the right model at these sizes and the prize accounting must be
        redone with the measured exponent.
    - metric: >-
        fraction of toy instances with c <= 8 for which gcd(N, h(O)) > 1
      direction: lower
      minimum_effect: >-
        Zero, on the full enumerated set. A single counterexample with N prime
        and N > h would contradict elementary arithmetic and indicates an
        implementation error; a counterexample with N <= h is EXPECTED and is
        routed to the escape-set analysis, not counted here.
    - metric: >-
        on the PLANTED family, measured total solve cost versus N
      direction: lower
      minimum_effect: >-
        Fitted exponent in [0.20, 0.32] (predicted 0.25). If the planted
        family does not show the 1/4 exponent, the cost model is wrong and the
        prize computation cannot be trusted.
    - metric: >-
        in the escape regime (N | h), number of Z/N-quotients of Cl(O) that
        are reproduced identically under a change of presentation
      direction: lower
      minimum_effect: >-
        Zero (predicted: no canonical quotient). Any quotient that IS
        presentation-independent is a candidate canonical bridge and triggers
        immediate escalation and independent review.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): the three symbolic results -- prize,
      ceiling, OBS-5 with explicit threshold. If OBS-5's threshold does not
      cover c <= 8, stop and restate.
      STAGE 1 (minutes): toy enumeration producing (p,t,D,f,O,h,N,c) and the
      distributions of h/N, log2 h/log2 N, gcd(N,h).
      STAGE 2 (minutes, THE COST-MODEL CALIBRATION): kangaroo on full and
      planted-half intervals; check against 2 sqrt(W).
      STAGE 3 (hours): the planted-bridge synthetic family end to end; must
      exhibit the 1/4 exponent and must decay to 1/2 as M -> 1.
      STAGE 4 (hours, THE ESCAPE-REGIME EXPERIMENT): construct instances with
      N | h; compute Cl(O) structure; enumerate Z/N-quotients; test
      presentation independence.
      STAGE 5 (zero compute): write the residual class (E2) with its ceiling.
    controls:
      - >-
        planted-bridge synthetic family -- MUST show the 1/4 exponent and MUST
        decay to 1/2 as M -> 1
      - >-
        kangaroo cost-model calibration against 2 sqrt(W) before any
        hypothetical is priced
      - >-
        presentation-independence test for any candidate canonical quotient
        (two generator sets, two reduction conventions)
      - >-
        rho baseline at 0.886 sqrt(N) on the same instances
    required_metrics:
      - h(O), N, c, gcd(N,h), log2 h/log2 N per instance
      - kangaroo operation counts, full interval and half interval
      - planted-family total cost versus N, with fitted exponent and CI
      - escape-set size, and per-instance quotient counts and
        presentation-independence verdicts
      - decay curve of planted speedup against M

  falsification_conditions:
    - >-
      A presentation-independent (canonical) Z/N-quotient of Cl(O) is found in
      the escape regime AND composes with a publicly computable instance map
      to give something non-constant in k. The lane is LIVE; escalate to
      independent review before any further interpretation.
    - >-
      The planted family fails to exhibit the 1/4 exponent. The cost model is
      wrong; the prize in (B) is not established and must be withdrawn until
      the model is fixed. This does not resurrect the bridge, but it voids the
      quantitative half of the record.
    - >-
      log2 h / log2 N is measured far from 1/2 at the largest toy p in a way
      that persists as p grows. The quadratic gap model is wrong at these
      sizes; rescope every statement that used it.
    - >-
      A red-team argument shows (C3) can be weakened to a non-homomorphic
      condition that still yields a congruence. OBS-5 no longer covers the
      route; the record is superseded, and the ceiling (which is
      unconditional) is what survives.

  confounders:
    - >-
      TWO DIFFERENT p^{1/4}s. KN-TECH-029's p^{1/4} is the supersingular
      isogeny problem via the F_p-subgraph (Delfs-Galbraith) and the
      Biasse-Jao-Sankar quantum bound. The p^{1/4} here is
      sqrt(h) on an ORDINARY class plus kangaroo. Reporting one as the other
      would be a serious error and the write-up must name which is meant every
      time.
    - >-
      TOY-SCALE h IS SMALL AND NOISY. Cohen-Lenstra-type fluctuation in h(D)
      is large at small |D|, so log2 h / log2 N has heavy spread. Report the
      full distribution, never a single instance.
    - >-
      VOLCANO LEVEL CHANGES h. Curves in one class at different levels have
      different O and different h(O). Stratify, and use the conductor formula
      to predict the level-to-level ratio as a check on the implementation.
    - >-
      COFACTOR SELECTION. Instances in the escape regime are found by
      searching for large cofactors and are unrepresentative by construction.
      Every statistic on them is conditional on that search and must say so.
    - >-
      ACTION-EVALUATION COST. The prize counts sqrt(h) ACTION EVALUATIONS, not
      group operations. One action evaluation is polynomial but much more
      expensive than a point addition. A prize quoted in mixed units would be
      dishonest; the record fixes the unit and carries the conversion.

  interpretation_limits:
    - >-
      The prize in (B) is COUNTERFACTUAL. It prices a bridge that OBS-5 says
      does not exist in homomorphic form. It must never be quoted as an attack
      complexity, and any downstream summary that says "p^{1/4}" without the
      word "if" is misreporting this record.
    - >-
      OBS-5 closes homomorphic bridges only. Non-homomorphic bridges are
      priced (ceiling 1/4) but not excluded.
    - >-
      QUANTUM: subexponential quantum vectorization (Kuperberg/Regev;
      KN-TECH-027, KN-TECH-051, KN-OPEN-014) would make the class-group half
      of the counterfactual cheap, but it concerns the CLASS GROUP and not the
      ECDLP, and the missing bridge is the binding constraint regardless of
      how cheap that half becomes. The campaign is classical and no quantum
      claim is made or needed.
    - >-
      Toy scale for everything empirical, and the escape regime is
      deliberately constructed rather than natural. Nothing here is
      crypto-scale validation.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For ordinary E/F_p, log2 h(End_{F_p} E) / log2 N -> 1/2 as p -> infty
        along curves with bounded cofactor. Formally: h(O) = |D|^{1/2 + o(1)}
        with |D| = Theta(p), and N = Theta(p).
      rigorous_support: >-
        Upper bound unconditional (class number formula + L(1,chi) =
        O(log|D|)); lower bound |D|^{1/2 - eps} by Siegel's theorem, which is
        INEFFECTIVE -- so the two-sided statement has no explicit constant.
        The classical distribution statement imitated is Cohen-Lenstra:
        h(D)/sqrt(|D|) behaves like L(1, chi_D), whose distribution is known
        and has no mass at 0.
      validation_plan: >-
        Compute h(O) exactly for all toy discriminants on the ladder by
        counting reduced binary quadratic forms; plot the empirical
        distribution of h(D)/sqrt(|D|) and compare against the distribution of
        L(1, chi_D) computed directly from its Euler product truncation; tail
        checks on the smallest and largest observed ratios versus the
        predicted extreme-value behaviour. LABELLED TOY SCALE -- |D| up to
        2^32 is not |D| ~ 2^256 and the Cohen-Lenstra comparison at that size
        validates the instrument, not the asymptotic.
    - id: H2
      statement: >-
        A bridge delivering k mod M with M = N^{alpha} yields total ECDLP cost
        Theta(max(h^{1/2}, (N/M)^{1/2})) = Theta(max(N^{alpha/2},
        N^{(1-alpha)/2})), minimised at alpha = 1/2.
      rigorous_support: >-
        Pairs the rigorous kangaroo bound ~2 sqrt(W) on an interval of width W
        with the standard collision bound sqrt(h) for meet-in-the-middle in a
        set of size h. The heuristic content is only that the two halves
        compose without interaction, which is the standard per-attempt-cost
        times inverse-success-probability bookkeeping.
      validation_plan: >-
        Measure on the planted synthetic family at five values of alpha in
        {0, 0.25, 0.5, 0.75, 1}; the measured total must trace the predicted
        V-shape with its minimum at alpha = 1/2 and its endpoints at N^{1/2}.
        Tail check: the slowest observed solve at alpha = 0.5 versus the
        predicted kangaroo tail. LABELLED TOY SCALE.

  reachability_gate: >-
    T5 IS BINDING AND IS PRICED INTO THE PRIZE, not waved at. The
    counterfactual bridge would deliver an ADDRESS in Cl(O) -- a global
    coordinate -- which T5 says is exactly the expensive kind of information:
    reaching a SPECIFIED curve costs ~sqrt(h) = p^{1/4}. That cost is not an
    objection to the prize; it IS the first term of the prize, and the record
    carries it explicitly rather than assuming the address is free. The cheap
    side of T5 (a uniformly random curve is reachable in O(log p) steps under
    GRH-conditional rapid mixing) is unusable here, because a random curve's
    address is known by construction and therefore carries no information
    about the instance. So this lane sits squarely on the expensive side of
    the dichotomy and its accounting says so.

  target_complexity:
    time_exponent: >-
      COUNTERFACTUAL ONLY: N^{1/4 + o(1)} if a bridge delivering k mod M with
      M ~ sqrt(N) existed, from sqrt(h) action evaluations plus 2 sqrt(N/M)
      group operations. ACTUAL claimed exponent: NONE -- OBS-5 says the
      homomorphic bridge is zero, so the achieved exponent stays at 1/2.
    memory_exponent: >-
      Counterfactual: O(1) if both halves use kangaroo/rho with distinguished
      points; sqrt(h) = N^{1/4} if the class-group half uses meet-in-the-middle
      tables. Both points of the tradeoff are stated because quoting only the
      O(1) variant would understate the cost of the fastest version.
    best_known: >-
      Prime-field ECDLP: 0.886 sqrt(N) group operations, O(1) memory
      (KN-TECH-001, KN-TECH-006); BSGS sqrt(N)/sqrt(N); automorphism-
      discounted rho 0.886 sqrt(N/|Aut|) with |Aut| <= 6 (KN-TECH-018).
      Vectorization: ~sqrt(h) classical (KN-TECH-027).
    hidden_overhead: >-
      The o(1) in N^{1/4 + o(1)} hides (i) the polynomial cost of ONE class-
      group action evaluation, which includes an ell-torsion eigenspace
      computation and, for general classes, a relation-lattice decomposition
      (KN-LIT-3339's CSI-FiSh step); (ii) the log factor in the class number
      bound; (iii) the cost of computing Cl(O)'s structure at all, which is
      L_{|D|}(1/2) by Hafner-McCurley and is SUPERPOLYNOMIAL. Item (iii) is
      the largest and is disclosed prominently: a route quoted as "p^{1/4}"
      that requires an L_p(1/2) precomputation is not p^{1/4} for a single
      instance, only amortised over many instances in one class.
    tradeoff_note: >-
      The counterfactual route interpolates: with a table of size 2^m on the
      class-group half, time falls as h/2^m until the sqrt(h) collision floor;
      the kangaroo half parallelises linearly with O(1) memory per core
      (van Oorschot-Wiener). The L_p(1/2) class-group precomputation is
      per-CLASS, so the route would be a multi-target/preprocessing attack in
      the sense of lane L13 rather than a single-instance attack -- which is a
      material scoping point and is recorded here rather than in a footnote.

  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES against every row of the
    frontier. As an ATTACK this proposal mounts none, so it is dominated by
    parallel rho with distinguished points (0.886 sqrt(N) time, O(1) memory,
    KN-TECH-001/KN-TECH-006), by BSGS (sqrt(N)/sqrt(N)), by
    automorphism-discounted rho on CM curves (KN-TECH-018), and by kangaroo on
    a known interval (2 sqrt(W), O(1) memory). It consumes no data and no
    queries. The COUNTERFACTUAL route in (B), if it existed, would dominate
    all of those on time (N^{1/4} versus N^{1/2}) and would be dominated by
    rho on the per-instance side once the L_p(1/2) class-group precomputation
    is charged to a single instance -- which is the honest way to read it and
    is stated in hidden_overhead. dominated_by is NOT null.
  sota_delta: >-
    Zero speedup against any attack baseline: 0.886 sqrt(N) before and after.
    Quantitatively, the record's content is three numbers and a boundary:
    (i) the counterfactual prize, exponent 1/2 -> 1/4, with the general form
    max(N^{alpha/2}, N^{(1-alpha)/2}); (ii) the unconditional information
    ceiling log2 h ~ (1/2) log2 N bits, so no bridge of any kind beats 1/4;
    (iii) OBS-5, killing every homomorphic bridge for cofactors below
    ~sqrt(p)/log p, which covers all standardised curves by a margin of order
    sqrt(p)/log p over the actual c <= 8.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high

  honest_prior_of_survival: >-
    0.99 that OBS-5 holds exactly as stated (elementary counting, large
    margin). 0.95 that the ceiling holds (pigeonhole). 0.8 that the planted
    family reproduces the 1/4 exponent within the pre-registered band -- the
    risk is cost-model bookkeeping at tiny N, not mathematics. 0.85 that the
    escape-regime experiment finds NO canonical quotient. Roughly 0.05 that
    the escape regime produces something surprising, and that branch is the
    reason to run it. Priority HIGH because Stage 0 is free, the prize is
    genuinely exponent-moving if wrong, and the record supplies the lane's
    quantitative spine that the other eight proposals cite.

