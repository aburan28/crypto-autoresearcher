idea:
  id: IDEA-20260801-001
  question_id: RQ-CRYPTO-001
  title: >-
    Reproducible crypto-size ECDLP first experiment: fix the metric wall at
    secp256k1-adjacent primes before any new mechanism is funded
  class: tooling
  claim: >-
    The blocker for GOAL-CRYPTO-001 is not a missing mechanism but a missing
    shared ruler: a reproducible, single-host, fully charged group-operation
    (GOE) cost baseline on one recognized prime-field curve that every future
    experiment must beat. Until the GOE ruler from G30-001 is installed and
    published for at least one curve at >= 160-bit order, no new candidate
    mechanism can be honestly compared, so no mechanism work should be funded
    on this goal.
  mechanism: >-
    Build one canonical secp256k1 (or K-233) ECDLP benchmark: frozen point
    multiplication (Jacobian co-Z) microbenchmarks, a memory-charged Pollard
    rho harness with van Oorschot–Wiener accounting, seeded and identical
    machine-image reproducibility, and a published GOE curve. Every later
    experiment report cites this ruler for its speedup ratio; a claim without
    a ruler citation is not evidence under this goal.
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-01'
    corpus_paths_grepped:
      - knowledge/literature
      - ledger/proposals
    grep_results:
      - No existing ledger proposal installs a GOE ruler for GOAL-CRYPTO-001;
        G30-001 plans it at toy tier.
    conclusion: >-
      Infrastructure proposal; not a cryptanalytic claim. Novelty unverified
      against full literature; the specific gap (no shared crypto-size ruler in
      this program) is confirmed by local corpus.
  assumptions:
    - Single-host, single-machine-image reproducibility is achievable for the
      selected curve at the chosen bit size.
    - GOE (group-op-equivalent) accounting is accepted by reviewers as the
      comparison unit.
  predictions:
    - metric: fraction_of_experiments_citing_the_ruler
      direction: higher
      minimum_effect: >-
        After ruler publication, >= 80% of GOAL-CRYPTO-001 experiment reports
        cite it in their speedup ratio.
  minimal_test:
    design: >-
      Build ruler, run it on two distinct hosts with identical image, publish
      GOE numbers for secp256k1 order N with 10 seeds; require
      reproducibility within 2% across hosts and a committed artifact hash.
    controls:
      - Same binary, two hosts (must match within tolerance).
      - No LTO/compiler-flag drift between runs (pinned flags in image).
    required_metrics:
      - GOE per point multiplication
      - rho baseline GOE with memory charge
      - cross-host reproducibility delta
  falsification_conditions:
    - Ruler is published and reproducible but experiments still do not cite it.
    - A candidate mechanism beats rho on the ruler without any new algorithmic
      idea (i.e., ruler itself is wrong).
  confounders:
    - Host-specific instruction sets (AVX-512 vs scalar) changing GOE ratios.
    - Integer vs affine vs Jacobian baseline choice.
  interpretation_limits:
    - A ruler is a measurement instrument, not a result.
    - No security claim about secp256k1 is made or implied.
  heuristic_assumptions:
    - id: HEUR-CRYPTO-RULER-1
      statement: >-
        GOE-accounted rho cost at fixed N is stable within 2% across identical
        machine images on different hosts.
      rigorous_support: None; empirical reproducibility claim, tested by the
        minimal test itself.
      validation_plan: The two-host run is the validation; no asymptotic claim.
  target_complexity:
    time_exponent: n/a (infrastructure; no asymptotic claim)
    memory_exponent: n/a
    best_known: n/a
    hidden_overhead: n/a
    tradeoff_note: >-
        Ruler is a prerequisite for any honest time-memory tradeoff claim.
  dominated_by: null
  sota_delta: >-
    No attack claimed. Deliverable is the missing measurement standard for the
    goal; quantitative value is the reproducibility tolerance (<= 2%) and the
    published GOE baseline.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
