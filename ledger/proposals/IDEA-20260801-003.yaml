idea:
  id: IDEA-20260801-003
  question_id: RQ-ECDLP-002
  title: >-
    Closed-form target-descent cost gate: bind every sub-rho claim to an
    explicit descent-tree certificate before allocation
  class: governance
  claim: >-
    On GOAL-ECDLP-001, every hypothesis that claims a sub-rho result must
    first pass a closed-form target-descent gate: an explicit, charged
    descent-tree certificate from the target point to the factor base whose
    total cost, including tree construction, is stated as a closed-form
    function of the factor-base size B and the number of targets, and is
    independently verified to be below the matched rho baseline. Without such
    a certificate, the claim is incomplete under the goal's completion rules.
  mechanism: >-
    The completion criterion of GOAL-ECDLP-001 already requires full
    preprocessing, relation, linear-algebra, target-descent, verification, and
    memory accounting against rho and BSGS. The recurring failure mode in the
    batch history is a sub-rho relation-collection claim without a charged
    target-descent tree: relations alone do not imply descent. This idea makes
    the descent tree an explicit gate: for any claimed sub-rho algorithm, the
    proposal must include a certificate that (i) the tree has bounded depth and
    branching, (ii) each node's cost is charged, (iii) the total is a closed
    form in B and target count, and (iv) an independent verifier has checked
    the arithmetic against the matched rho baseline.
  novelty_status: adaptation
  novelty_screen:
    screened_on: '2026-08-01'
    corpus_paths_grepped:
      - ledger/proposals
      - ledger/hypotheses
    grep_results:
      - Prior batches repeatedly produce sub-rho relation-collection claims
        without charged descent (e.g., BATCH-028 RUN reclassified
        failed_infrastructure; BATCH-029 H-DS-001 closed inconclusive).
      - No existing proposal mandates a descent-tree certificate as a gate.
    conclusion: >-
      Governance adaptation of the goal's own completion rules; the missing
      gate is confirmed by batch history.
  assumptions:
    - An independent verifier can check the closed-form descent cost.
    - Charging conventions (GOE, memory) are fixed before the check.
  predictions:
    - metric: sub_rho_claims_with_descent_certificate
      direction: higher
      minimum_effect: >-
        After gate adoption, 100% of sub-rho claims include a verified descent
        certificate; before, the historical rate is 0%.
  minimal_test:
    design: >-
      Apply the gate retroactively to the two most recent inconclusive sub-rho
      batches (BATCH-028, BATCH-029): determine, from their committed
      artifacts, whether a closed-form charged descent tree exists; if not,
      record that the claim was incomplete at the time.
    controls:
      - A known-complete sub-rho proposal (if any exists) as positive control.
      - Matched rho baseline re-verified under the same charging conventions.
    required_metrics:
      - existence of descent certificate
      - closed-form cost expression
      - verification result vs rho baseline
  falsification_conditions:
    - A sub-rho claim passes the gate with a verified certificate, and its
      total charged cost is genuinely below rho (claim survives the gate).
    - The gate is unpassable by construction (no algorithm can be certified),
      which would itself be a scoped negative about the claim class.
  confounders:
    - Ambiguity in what counts as "target-descent" vs relation collection.
    - Charging-convention drift between gate and baseline.
  interpretation_limits:
    - A passed gate certifies the descent tree only, not the full algorithm.
    - No crypto-scale claim; toy-tier unless the charged total is at crypto
      parameters, which is not claimed here.
  heuristic_assumptions:
    - id: HEUR-ECDLP-DESCENT-GATE-1
      statement: >-
        For every sub-rho proposal admitted to this goal, a closed-form charged
        descent tree can be written down and independently verified.
      rigorous_support: None; structural claim about the proposal class, tested
        by the gate itself.
      validation_plan: The gate is the validation; failure to produce a
        certificate is recorded as an incomplete claim.
  target_complexity:
    time_exponent: n/a (governance gate)
    memory_exponent: n/a
    best_known: n/a
    hidden_overhead: n/a
    tradeoff_note: n/a
  dominated_by: null
  sota_delta: >-
    No algorithmic claim. Value is procedural: it converts the goal's
    completion rule into an auditable gate that batch history shows is
    systematically skipped.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
