  batch: EC-STRUCTURE-20260825
  cluster: 'C7-targets: what structure the real curves actually carry'
  title: 'A FREE, EXACT, ZERO-SECRET STRUCTURAL CENSUS OF THE DEPLOYED AND CHALLENGE-SIZED PRIME-FIELD
    CURVES: the program reasons about ''generic prime-field curves'' while its actual targets have wildly
    different structural endowments -- compute D, the conductor of Z[pi], |Aut| and ord(lambda), the embedding
    degree, twist structure, small-isogeny degrees and the shape of p, per target, and say which of this
    program''s lanes are even non-vacuous for each'
  class: measurement
  claim_ceiling: unverified_zero_run_structural_proposal_only_no_experiment_no_implementation_no_status_change_no_novelty_conclusion
  status: proposed
  novelty_status: unverified
  novelty_note: Every quantity is public and computable from published parameters; none of it is novel
    mathematics and none is claimed to be. The proposed contribution is that the program currently has
    no such table, so its lane-level reasoning cannot be checked against its own targets.
  claim:
    semantic_part: For each public prime-field target, the full set of curve-level structural invariants
      is computable exactly from published parameters with no secret input, and the resulting table determines
      which structural lanes in this program are non-vacuous for that target.
    evaluator_part: 'Unestablished: the lane-mapping column. Computing the invariants is routine; deciding
      which lane each value makes vacuous is a judgement that must be argued per row.'
    end_to_end_ecdlp_claim: false
    breakthrough_claim: false
  mechanism:
  - 'Targets: secp256k1, secp256r1 (NIST P-256), P-384, P-521, Curve25519 and edwards25519, brainpoolP256r1
    and brainpoolP256t1, and the prime-field challenge-sized parameter sets that are public.'
  - 'Per target compute: D = t^2 - 4p and its fundamental discriminant and conductor; the class number
    where feasible; |Aut(E)| and the multiplicative order of the GLV scalar lambda mod N; the embedding
    degree; the twist order and its factorization; the smallest l admitting a rational l-isogeny and the
    volcano depth at small l; and the additive shape of p, including its Solinas form and low-weight representation.'
  - 'Add the lane-mapping column: for each row, which of this program''s structural lanes could possibly
    bite. secp256k1 has D = -3 with the largest possible automorphism group, so the automorphism-quotient
    and lambda-order rows are maximal there and minimal for P-256, and any lane whose leverage is |Aut|
    is vacuous on the latter.'
  - Publish as a reproducible table with the computation for each cell, and state explicitly that it targets
    no secret and recovers no key.
  lossy_projection_test:
    tracked_object: the curve-level invariant vector (arity 0 in the taxonomy)
    what_is_discarded: the curve, keeping a fixed list of invariants
    propagation: not applicable at arity 0
    verdict: N/A -- arity-0 static census; the exemption is recorded rather than left implicit.
  predictions:
  - id: P1
    status: established_formula
    statement: All listed invariants are computable from published parameters with no secret input.
  - id: P2
    status: unestablished
    statement: At least two targets differ in a structural invariant that makes a lane in this program
      vacuous for one and non-vacuous for the other.
  - id: P3
    status: unestablished
    statement: No target has an invariant outside the range the program's 'generic prime-field curve'
      reasoning assumes.
  minimal_discriminating_test:
    status: specified_not_run
    test: Compute every cell twice with independent implementations and compare; cross-check against published
      values where they exist.
    pass: All cells agree across implementations and with published values.
    fail: Any disagreement is reported as a discrepancy rather than resolved by picking one.
  controls:
  - A curve with published invariants (P-256's order and embedding degree are documented) as the correctness
    control.
  - A randomly generated curve of the same size as the genericity baseline against which the deployed
    curves' invariants are read.
  - A deliberately weak curve (small embedding degree) to confirm the pipeline detects weakness when present.
  confounders:
  - Class number computation is expensive at cryptographic discriminants and may have to be reported as
    unavailable rather than estimated.
  - Twist conventions differ between sources; the convention must be stated per row.
  - '''Non-vacuous'' is a judgement and must be argued, not asserted, or the lane column is decoration.'
  falsification:
    semantic: A published invariant contradicting a computed cell falsifies that cell.
    evaluator: An implementation disagreement scopes out that cell until resolved.
    not_falsification: An invariant that is infeasible to compute; report it as infeasible.
  why_this_is_not_a_variant: 'The SCURVE goals audit SafeCurves SAFETY criteria per curve. This table
    is not a safety audit: it is an inventory of exploitable STRUCTURE, and its purpose is to tell this
    program which of its own lanes apply to which target. The two overlap in a few columns and differ
    in intent, and the overlap is stated here so a reviewer can check it.'
  limits:
  - 'Zero-run: nothing here has been executed, measured, or independently reviewed.'
  - Proposal tier only; claim ceiling is stated in claim_ceiling and is not exceeded.
  - No end-to-end ECDLP algorithm, exponent, or cost claim is made.
  - 'Novelty is unverified: no literature screen was performed for this batch.'
  - Public parameters and toy instances only; no live key, wallet, or deployed target.
  sota_delta:
    checked: true
    delta: No improvement. Reference data that would make lane-level reasoning checkable.
    dominated_by:
    - 'not applicable: no algorithmic claim'
    axes:
    - time
    - memory
    - preprocessing
    - queries
