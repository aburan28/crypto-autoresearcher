idea:
  id: IDEA-20260816-a7b433
  question_id: RQ-SLHDSA-001
  added: '2026-08-16'
  title: Build a finite layer-by-property requirement table for SLH-DSA in which each cell records
    which security property of the underlying keyed hash a given structural layer actually reads,
    with UNDETERMINED as a first-class cell value, then validate the table by breaking exactly one
    property in a toy instantiation and observing which layers fail.
  class: theory
  claim: '(A) The security of a layered hash-based signature is not carried by a single property of
    its hash function but by a finite matrix: rows are structural layers (FORS leaf hashing, FORS
    tree hashing, FORS root compression, WOTS+ chain iteration, WOTS+ public-key compression, per-subtree
    Merkle tree hashing, the d-fold hypertree composition, the message-digest map, the randomizer
    PRF, the secret-key PRF), columns are a declared finite property list (preimage resistance, second-preimage
    resistance, collision resistance, single-target vs multi-target versions of each, target-collision
    resistance, undetectability, pseudorandomness, and decisional second-preimage resistance), and
    every cell holds exactly one of REQUIRED, NOT-REQUIRED, or UNDETERMINED. (B) The table is constructible
    inside this program with zero access to external literature, because each cell is answered by
    a local question about what an adversary must produce to defeat that layer given everything the
    other layers hand it, and that question is answerable from the structure this repository already
    records. (C) The UNDETERMINED cells are the deliverable, not an embarrassment: a cell is UNDETERMINED
    when the layer''s failure mode is expressible only as a joint property of two or more hash calls
    that no single-call property in the declared column list names, and the count and location of
    those cells is a reusable measured obstruction under docs/inventor-protocol.md section 4. (D)
    The table is falsifiable and is falsified by injection: in a scaled-down signer whose hash is
    replaced by a construction that violates exactly one declared property while provably retaining
    the others at toy size, every layer whose cell says REQUIRED for that property must exhibit a
    measurable failure and every layer whose cell says NOT-REQUIRED must not. A single mismatch invalidates
    the cell, not the method. (E) WHAT IS NOT CLAIMED: no attack, no forgery, no security level, no
    bit count, no statement that any parameter set is adequate or inadequate, no statement about SHA-2
    or SHAKE, and above all no statement about what the published literature does or does not already
    contain. The table is this repository''s table, derived from this repository''s records, and it
    is offered as an internal audit instrument with UNVERIFIED novelty. It also carries no claim about
    the fault or memory-corruption class, which RQ-SLHDSA-001 requires be kept strictly separate.'
  mechanism: 'STAGE A, symbolic and zero-compute. Fix the row list and the column list as a frozen
    enumeration, written down before any cell is filled, so the audit cannot grow its own scope. For
    each row, write the adversary''s local goal at that layer as a sentence of the form: given the
    outputs the layer publishes and the inputs the layers below hand it, produce X. Then check each
    column property against that sentence by a single test: does an oracle violating the property
    alone suffice to produce X. Yes gives REQUIRED, a demonstrated alternative route that does not
    use the property gives NOT-REQUIRED, and inability to decide without a joint-call property gives
    UNDETERMINED with the joint property named. STAGE B, construction. For each column property that
    appears REQUIRED somewhere, build a toy hash that violates that property and only that property
    at the toy output size, and prove the retained properties by exhaustive enumeration of the toy
    domain rather than by argument. Properties for which no such separating construction exists at
    toy size are recorded as UNSEPARABLE and their rows stay UNDETERMINED by construction. STAGE C,
    injection. Instantiate the toy signer with each separating hash in turn and run a fixed transcript-and-forgery
    battery, recording per layer whether a forgery attempt at that layer succeeded above the ideal-arm
    rate. STAGE D, adjudication. Cross the STAGE C failure matrix against the STAGE A table cell by
    cell and report agreements, disagreements, and the cells no injection could reach. The disagreement
    list is the finding whichever way it points.'
  novelty_status: unverified
  novelty_screen:
    method: 'Ran, from the repository root: grep -ril on ledger/ knowledge/ for each of sphincs, SLH-DSA,
      SLHDSA, FORS, hypertree, WOTS, tweakable, preimage, second-preimage, undetectability, target-collision,
      multi-target, few-time, PK.seed, checksum, message randomizer. Read in full ledger/questions/RQ-SLHDSA-001.yaml,
      the head of ledger/hypotheses/H-SLHDSA-3a403a.yaml, experiments/EXP-SLHDSA-9cbad4/specification.yaml,
      and docs/inventor-protocol.md sections 1 through 5. Extracted id, question_id and title for
      all twelve proposals that mention any SLH-DSA noun, and read the claim field of IDEA-20260813-945a67
      and the head of knowledge/literature/KN-LIT-7077.'
    results: 'Twelve SLH-DSA-touching proposals exist and eleven sit on RQ-SLHDSA-001: IDEA-20260801-009,
      IDEA-20260805-fbe36a, IDEA-20260805-705614, IDEA-20260805-88ecef, IDEA-20260807-c4f1fc, IDEA-20260808-02a046,
      IDEA-20260808-ae34ad, IDEA-20260813-945a67, IDEA-20260813-84d1bc, IDEA-20260813-7f8d6e, IDEA-20260813-6d331f,
      IDEA-20260813-1fbefa. Every one of them is a probability, cost or reduction-structure record:
      the FORS interleaved-target occupancy moment (fbe36a, 02a046, 705614, 009), cost conventions
      and memory charges (88ecef, ae34ad), a bad-event dependency DAG for the reduction (84d1bc),
      fault-model ADRS aliasing (7f8d6e, 945a67), collision-witness extraction (6d331f) and key-conditioned
      tail slack (1fbefa). NONE of them contains a layer-by-property matrix, and the string undetectability
      occurs exactly once in the whole repository, in knowledge/literature/KN-LIT-b9d3e0.md, with
      no ledger record reading it. IDEA-20260807-c4f1fc is the closest in spirit: it observes that
      the hash primitives under SLH-DSA are modelled as ideal and probed in none. It proposes probing
      the primitives; it does not propose enumerating which property each layer reads.'
    verdict: 'UNVERIFIED. This program cannot read external literature and therefore asserts nothing
      about whether such a table exists outside this repository; per-layer property attributions of
      this kind are a standard mode of reasoning about hash-based signatures and it would be surprising
      if no external treatment existed. What is claimed new is narrow and internal: no record in this
      repository holds such a table, UNDETERMINED as a first-class cell value with the blocking joint-call
      property named is a deliberate departure from filling every cell, and the injection validation
      in STAGE C, which turns a prose table into something a run can contradict, is assembled from
      known parts (separating constructions, mutation-style injection) applied to a target where this
      repository has never applied them.'
  object_first_candidate:
    tracked_object: 'The per-layer requirement vector: for each structural layer, the 0/1/UNDETERMINED
      indicator over the declared finite property list, saying which properties of the underlying
      keyed hash that layer''s soundness reads. The object followed through the computation is this
      vector as one moves up the composition from FORS leaves to the hypertree root.'
    lossiness: 'The projection discards the hash function''s internal structure, all key and seed
      values, all message content, every output value, and every probability. What remains is a finite
      indicator vector per layer. This is genuinely lossy: from the whole table one cannot reconstruct
      a single hash output, a single signature, or a single number of bits. It propagates because
      the composition is by construction a chain in which layer L+1 consumes only layer L''s published
      output, so the question of what an adversary must produce at layer L+1 is answerable from layer
      L''s requirement vector plus the structural rule joining them, without reopening the discarded
      material. Where that is false, the cell is exactly the UNDETERMINED case and the failure of
      propagation is the recorded finding.'
    propagation: 'One step of the target operation is the promotion of a layer''s output into the
      next layer''s input. It acts on the tracked object by a rule with three cases: a compression
      step (many outputs to one) can convert a second-preimage requirement below into a collision
      requirement above; an iteration step (chain advance) preserves the requirement but multiplies
      the target count by the chain length; a domain-separation step (a fresh ADRS tweak) leaves the
      requirement identical but converts a multi-target column into its single-target column when
      and only when the tweak is unique on the reachable set, which is measured separately. Each of
      these is a deterministic map on the indicator vector, which is what makes the object propagable
      rather than merely descriptive.'
    survival_score: 'The vector propagates through a chain of finite length d+2 for a d-layer hypertree:
      FORS, WOTS+, and d Merkle layers. At toy parameters (d=2, h=4) that is four steps and every
      step is checkable by enumeration. The structure dissolves at the first step where the promotion
      rule requires a joint property of two hash calls not in the column list, which is precisely
      where UNDETERMINED enters; the survival score of this proposal is therefore reported as the
      number of the d+2 steps traversed before the first UNDETERMINED cell, per column, and it is
      expected to be smaller for the multi-target columns than for the single-target ones.'
  null_object_control: 'The identical STAGE C injection battery is run against a toy signer whose
    every tweakable-hash call is answered by a lazily sampled independent random oracle keyed by its
    address, in the same invocation and with the same transcript, seeds, and forgery budget. In that
    arm no declared property is violated, so the null must show a per-layer forgery success rate statistically
    indistinguishable from the structural floor (the rate a forger achieves by guessing at the layer''s
    output size), for every layer and every injection slot. If any layer in the null arm shows a rate
    above its floor, the battery is detecting the harness rather than the property and no cell in
    the table may be adjudicated. A second null permutes the injection labels: property P is injected
    while the layers whose cells say REQUIRED for a different property Q are watched, and the mismatched
    pairs must show the floor rate.'
  discriminated_from:
  - 'IDEA-20260807-c4f1fc: it observes that SLH-DSA''s primitives are modelled as ideal and probed
    in none, and proposes cryptanalytic probing of the primitives. This proposal never touches the
    primitive''s cryptanalysis; it enumerates which property each layer reads and treats the primitive
    as a black box that can be swapped for a separating construction.'
  - 'IDEA-20260813-84d1bc, dependency-DAG accounting for FIPS 205 reduction bad events: that object
    is the set of bad events inside a reduction and their dependencies. This object is the requirement
    vector over a declared property list per structural layer. A bad-event DAG can be complete while
    every property attribution remains UNDETERMINED, and vice versa, so neither subsumes the other.'
  - 'IDEA-20260805-fbe36a and IDEA-20260808-02a046: both compute one numeric term, the FORS multi-target
    probability, in closed form. This proposal computes no probability at all and produces no number
    with units of bits; it produces a matrix of three-valued cells.'
  - 'H-SLHDSA-3a403a: scoped in its own statement to the FORS layer only, under a random-oracle idealization.
    This table is exactly the object that idealization hides, and covers all d+2 layers.'
  - 'knowledge/literature/KN-LIT-b9d3e0.md, the only corpus file in which the string undetectability
    appears: a literature note, not a table, and no ledger record reads it. It is cited here as the
    source of one column name and for nothing else.'
  assumptions:
  - The row list (structural layers) and column list (properties) are declared in advance and frozen;
    the audit's conclusions are scoped to those lists and say nothing about properties outside them.
  - The structural description of SLH-DSA used to write the rows is taken from records in this repository
    (RQ-SLHDSA-001, H-SLHDSA-3a403a) and is UNVERIFIED against the primary standard text, which this
    program has not read.
  - A separating toy hash that violates exactly one declared property while retaining the others can
    be built and its retention verified by exhaustive enumeration at toy output sizes; where it cannot,
    the column is recorded UNSEPARABLE rather than silently skipped.
  - The scaled-down signer preserves the layer structure being audited, in the specific sense that
    every promotion step present at deployed parameters is present at toy parameters at least once.
  - Property violations injected one at a time do not silently co-violate a second declared property;
    this is not assumed but measured in STAGE B and any co-violation voids the corresponding injection.
  predictions:
  - metric: count of UNDETERMINED cells in the completed table
    direction: different
    minimum_effect: 'explicit refusal to pre-commit a number: the UNDETERMINED count is the deliverable,
      and pre-registering a target for it would give the audit an incentive to resolve or to inflate
      cells. The pre-commitment made instead is procedural and binding: every cell is filled with
      one of the three values, no cell is left blank, and every UNDETERMINED cell names the joint-call
      property that blocks it.'
  - metric: number of layers exhibiting an above-floor forgery rate under a single injected collision-only
      violation in the toy signer
    direction: higher
    minimum_effect: 1
  - metric: per-layer forgery success rate above the structural floor in the ideal-random-oracle null
      arm, maximum over layers and injection slots
    direction: lower
    minimum_effect: 0
  - metric: agreement rate between the STAGE A table cells and the STAGE C injection failure matrix,
      over cells an injection could reach
    direction: higher
    minimum_effect: 0.8
  minimal_test:
    design: 'The cheapest discriminating measurement is one column, one injection, two arms. Take
      collision resistance as the column. Build a toy hash on 16-bit outputs that is collision-prone
      by design (a 16-bit output with a deliberately halved image set, so collisions are found in
      about 2^4 work) but whose preimage difficulty is unchanged relative to its image size, verified
      by full enumeration of the 2^16 domain. Instantiate a toy signer with h=4, d=2, a=2, k=3, w=4
      twice: once with that hash, once with a lazily sampled random oracle of the same output size.
      Run the identical forgery battery of 10^4 attempts against each named layer separately in both
      arms inside one process invocation. The discriminating observable is the per-layer difference
      in above-floor forgery rate between the two arms. If the layers whose STAGE A cells say REQUIRED-for-collision
      light up and the others do not, the method is validated on one column at a total cost of minutes.
      If the null arm also lights up, the battery is broken and nothing is adjudicated. This single
      column costs well under an hour of compute and settles whether the remaining columns are worth
      building.'
    controls:
    - 'Ideal-random-oracle arm: the identical signer with every tweakable-hash call answered by a
      lazily sampled independent oracle keyed by its address, executed in the same invocation as the
      signal arm.'
    - 'Label-permutation control: inject property P and watch the layers whose cells say REQUIRED
      for a different property Q; mismatched pairs must show the structural floor.'
    - 'Retention verification: for each separating hash, exhaustive enumeration of the toy domain
      to confirm the properties it is supposed to retain are retained at that size.'
    - 'Floor calibration: for each layer, the guessing rate at that layer''s output size computed
      analytically and confirmed by a no-injection arm.'
    - 'Seed control: every arm repeated at three independent seeds, with the between-seed spread reported
      alongside every rate.'
    required_metrics:
    - per-cell table value in {REQUIRED, NOT-REQUIRED, UNDETERMINED} with the blocking joint property
      named for each UNDETERMINED
    - per-layer per-injection above-floor forgery rate, signal arm
    - per-layer per-injection above-floor forgery rate, ideal-oracle null arm
    - cell-versus-injection agreement count, disagreement count, and unreachable-cell count
    - count of UNSEPARABLE columns with the reason each could not be separated at toy size
    - between-seed spread of every reported rate
  falsification_conditions:
  - 'The ideal-random-oracle null arm shows above-floor forgery rates: the battery measures the harness,
    and no cell may be adjudicated until it does not.'
  - 'A layer whose cell reads NOT-REQUIRED for property P fails under a verified P-only injection:
    that cell is wrong and is superseded with the counterexample recorded.'
  - 'A layer whose cell reads REQUIRED for P shows no above-floor rate under a verified P-only injection
    at any tested budget: the cell is unsupported and reverts to UNDETERMINED with the budget stated.'
  - 'No separating construction exists at toy size for more than half the declared columns: the injection
    validation cannot carry the table and the deliverable degrades to a symbolic table with its validation
    gap stated.'
  - 'The label-permutation control lights up as strongly as the matched pairs: the observable is layer-generic
    and carries no property information.'
  - 'Two independent implementations of the toy signer produce different STAGE C matrices on the same
    seeds: the instrument is not trustworthy and entry SLHDSA-TOYIMPL must clear first.'
  confounders:
  - A separating hash that is collision-prone by image-set reduction is also entropy-reduced, which
    independently raises several layers' rates; the floor must therefore be computed against the reduced
    image size, not the nominal output size.
  - Toy output sizes small enough to enumerate are small enough that the structural floor is high,
    compressing the dynamic range between signal and null.
  - 'Layers are not independent in a real signer: an injected failure at FORS can present as a hypertree
    failure downstream, inflating that row. Per-layer attribution requires the battery to attack each
    layer with the others held ideal, which is itself an idealization and must be reported as one.'
  - The row list is written from this repository's structural description, which is UNVERIFIED; a
    missing layer produces a table that is complete-looking and wrong.
  - Property definitions differ in their multi-target quantifier, and a column that silently mixes
    single-target and multi-target versions will produce cells that agree with injections for the
    wrong reason.
  interpretation_limits:
  - The table is scoped to the declared row and column lists and to toy parameters; a REQUIRED cell
    says a layer reads that property at toy size, not that a deployed parameter set has any particular
    margin.
  - No cell, however confidently filled, is a statement about SHA-2, SHAKE, or any concrete hash function's
    resistance.
  - The injection validation reaches only cells for which a separating construction exists at toy
    size; unreachable cells carry the table's symbolic status only.
  - Nothing here bears on the fault or memory-corruption claim class, which RQ-SLHDSA-001 requires
    be reported separately and which no artifact of this proposal may appear alongside.
  target_complexity:
    time_exponent: No attack exponent is claimed. The deliverable is a three-valued matrix plus a
      toy-scale injection agreement count; the audit's own cost is O(rows x columns) human-symbolic
      work plus O(injections x attempts) toy hash evaluations, with attempts fixed at 10^4 per layer
      per arm.
    memory_exponent: No memory exponent is claimed. The instrument's own memory is the lazily sampled
      oracle table, bounded by the number of distinct tweaks materialized in a toy transcript, measured
      rather than assumed and capped at 2^24 entries.
    best_known: 'The incumbent inside this repository is the absence of any per-layer table: RQ-SLHDSA-001,
      H-SLHDSA-3a403a and all eleven RQ-SLHDSA-001 proposals refer to hash properties collectively,
      and IDEA-20260807-c4f1fc records that the primitives are modelled as ideal everywhere and probed
      nowhere. No claim is made about what exists outside this repository.'
    hidden_overhead: 'The human cost dominates and is not small: filling d+2 rows by ten columns honestly
      means writing d+2 adversarial goal sentences and defending 100-plus cells, and the temptation
      to fill an UNDETERMINED cell with a plausible value is the failure mode this proposal is most
      exposed to. In the lower-order terms of the compute: building separating constructions with
      verified retention is more work than building the signer, and the exhaustive retention proofs
      are what force the toy output size down, which in turn compresses the dynamic range the injection
      needs.'
  dominated_by: 'n/a (no result claimed). I checked this against every cost axis on which this repository
    maintains a frontier: time, memory, and data/queries. A three-valued requirement matrix has no
    coordinate on any of those axes, so there is no frontier row that dominates it and none it dominates.
    It is not entered on any frontier.'
  sota_delta: no attack; conceptual/measurement contribution only. The comparison is against this
    repository's own state, where the number of per-layer hash-property tables is zero and the deliverable
    would make it one, with its UNDETERMINED count reported as an integer.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Three separable parts. (1) That the symbolic table can be completed with
    every cell filled by one of the three values and every UNDETERMINED cell naming its blocking joint
    property: about 0.85. It is bounded work over a frozen finite grid and its main risk is the structural
    row list being wrong, since it is written from UNVERIFIED records. (2) That at least half the
    declared columns admit a separating toy construction with exhaustively verified retention: about
    0.5. Separating multi-target from single-target versions at 16-bit output sizes is the doubtful
    part, because the dynamic range between the two collapses when the target count is small. (3)
    That the STAGE C injection matrix agrees with the STAGE A table on at least 80 percent of reachable
    cells: about 0.45, and I expect the disagreements to be the most useful output, because a disagreement
    means a layer reads a property nobody wrote down. (4) That the UNDETERMINED count is nonzero:
    about 0.9 -- a table with no undetermined cells at these column definitions would itself be evidence
    that the audit was not run honestly.'
