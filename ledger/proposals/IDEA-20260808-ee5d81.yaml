idea:
  id: IDEA-20260808-ee5d81
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-SQISIGN-001
  goal_id: GOAL-SQISIGN-001
  title: 'A commitment-curve COLLISION across two signatures under one key yields a non-scalar
    endomorphism of that curve for free, hence End of the commitment curve, hence -- through
    the published response -- End of the public key: so SQIsign''s signing bound is birthday-limited
    by the ENTROPY OF THE COMMITMENT CURVE, and that entropy is the number nobody in this
    corpus has written down.'
  class: mechanism
  claim: 'In a SQIsign-shaped protocol each signature publishes a commitment curve E_com and
    a response isogeny sigma : E_com -> E_pk (or its dual) of known, verifier-evaluable degree.
    CLAIM, in three steps, each elementary: (1) if two signatures i != j share the same commitment
    curve E_com, then sigma_j-hat o sigma_i is an endomorphism of E_com of degree deg(sigma_i)
    deg(sigma_j), and it is non-scalar unless sigma_i and sigma_j differ by an automorphism
    -- an event of probability O(1/|V|) that the verifier''s own challenge-binding makes negligible
    when the challenges differ; (2) a non-scalar endomorphism of E_com solves OneEnd for E_com,
    hence EndRing for E_com by [35, Theorem 1] in probabilistic polynomial time; (3) End(E_com)
    plus the PUBLISHED isogeny sigma_i : E_com -> E_pk determines End(E_pk) in polynomial
    time (pushforward of the corresponding ideal), i.e. FULL KEY RECOVERY IN POLYNOMIAL TIME
    GIVEN ONE COLLISION. CONSEQUENCE: the signing bound q_max is birthday-limited at q_max
    ~ sqrt(N_com), where N_com is the effective number of distinct commitment curves the signer
    can produce. If N_com = |V| ~ p/12 then q_max ~ p^{1/2}/3.5, far above any deployment.
    If the commitment isogeny has degree 2^e with 2^e << p, then N_com <= 3 * 2^{e-1} and
    q_max ~ 2^{e/2}, and the question is whether 2^{e/2} exceeds the scheme''s claimed signing
    bound (commonly 2^64). THE DELIVERABLE IS THAT COMPARISON, and it needs one number from
    the Round-3 specification: the commitment walk''s length.'
  mechanism: 'This is the "two paths to the same curve" mechanism that underlies the CGL hash''s
    collision resistance, applied to a protocol''s own published data. The frozen source''s
    own history section records the same move in a different guise: [24, 26] look for "two
    distinct (separable) isogenies phi_i : E -> E^{(p)}" and deduce the endomorphism phi_2-hat
    o phi_1 (line 53). Here the two isogenies are supplied by the transcript rather than searched
    for, and they land on E_com rather than on a Frobenius conjugate. The security argument
    for the scheme must therefore contain, explicitly or implicitly, a claim that commitment
    collisions do not occur within the signing bound; the record''s contribution is to make
    that claim a numeric inequality and to identify the parameter it depends on.'
  why_not_a_renamed_known_approach: 'Nearest corpus records: IDEA-20260805-18a4d4 proves that
    [conj(J_i) J_j] is secret-INDEPENDENT for every pair of response codomains, and IDEA-20260807-cc84ad
    extends it. Those are statements about IDEAL CLASSES and they establish that the pairwise
    class carries no secret. This record concerns an actual CURVE COINCIDENCE, which is a
    different event: the class being secret-independent does not prevent the composite from
    being a non-scalar endomorphism, because non-scalarity is about the element, not its class.
    Catalogue S3-2 counts n_bt as a "published coincidence counter" between challenge and
    response; this counts coincidences among COMMITMENT CURVES across signatures and attaches
    a full key-recovery consequence. IDEA-20260805-bb4bf8 observes that the commitment curve
    is published and produced by a walk from a known start; it does not draw the collision
    consequence.'
  predictions:
  - observable: birthday threshold for commitment collisions in a surrogate signer
    metric: q at which the empirical collision probability crosses 1/2
    predicted: 1.177 * sqrt(N_com), the standard birthday constant. A measured threshold materially
      away from that indicates the commitment distribution is non-uniform, which is itself
      informative.
  - observable: key recovery given a collision
    metric: success rate of the three-step chain on toy instances where a collision is forced
    predicted: 1.000 minus the automorphism-coincidence rate, which is O(1/|V|) and directly
      measurable. If success is materially below 1, step (1) or (3) is wrong.
  - observable: the comparison the record exists to make
    metric: 2^{e/2} versus the scheme's claimed signing bound
    predicted: UNKNOWN AND NOT GUESSED. This program has read no Round-3 specification; the
      record explicitly declines to assert e. Producing e is the first task and it is a reading
      task.
  minimal_test: 'Two arms. ARM A (toy, days): on the four committed 2-isogeny graphs, run
    a surrogate signer, FORCE a commitment collision by construction, and execute the three-step
    chain end to end, verifying that the recovered order really is End(E_pk) by an independent
    check (the order''s discriminant and the action on a torsion basis). This validates the
    mechanism, and it can fail. ARM B (zero compute, blocked on document access): read the
    Round-3 specification, extract the commitment walk length e, and evaluate 2^{e/2} against
    the claimed signing bound. ARM B IS THE DECIDING ARM AND IT COSTS NO COMPUTE.'
  controls:
  - 'POSITIVE CONTROL (must fire): forced collision, as above. If the chain does not recover
    the key on a forced collision the record is void.'
  - 'NULL OBJECT: two signatures with DIFFERENT commitment curves. The identical chain must
    FAIL to produce an endomorphism -- if it ''succeeds'' there, the instrument is manufacturing
    endomorphisms and every reading is void.'
  - 'SCALARITY CONTROL: measure how often sigma_j-hat o sigma_i is scalar. Predicted O(1/|V|);
    a large scalar rate would mean the responses are constrained in a way that defeats the
    attack, which is the scheme''s real defence and must be reported as such.'
  - 'CHALLENGE-BINDING CONTROL: repeat with the two signatures sharing a challenge. The scheme
    should make that impossible; if the surrogate allows it, the surrogate is wrong.'
  confounders:
  - The surrogate is not SQIsign. In particular the higher-dimensional designs may not publish
    sigma in a form composable as stated; if the response is a 2-dimensional isogeny the composition
    step needs care and may fail. That is a real risk to step (1) and is named.
  - If commitment curves are derived deterministically from the message, collisions are message
    collisions and the birthday bound is on the hash, not the curve. The record must establish
    which.
  - Deployed schemes often bound signing volume explicitly; if the bound is already below
    2^{e/2} the finding is a tightness observation, not a vulnerability, and must be written
    that way.
  falsification_conditions:
  - The forced-collision positive control fails to recover the key.
  - The null (distinct commitments) produces an endomorphism -- instrument broken, stop.
  - The Round-3 specification shows commitment curves are drawn from a space of size >= 2^{2
    lambda}, in which case q_max exceeds any signing bound and the lane closes with a number
    attached, which is a complete and useful outcome.
  interpretation_limits: 'NO CLAIM ABOUT SQIsign IS MADE. This program has read no Round-3
    specification (GOAL-SQISIGN-002.next_action), so e is unknown and the record asserts nothing
    about whether the inequality binds. What the record supplies is the mechanism, the inequality,
    and the single parameter that decides it. Claim tier toy for all attack behaviour. SC-3:
    no bit figure may be carried from OneEnd to any scheme statement.'
  assumptions:
  - '[35, Theorem 1] (OneEnd -> EndRing, probabilistic polynomial time) as cited by the frozen
    source at line 21. CITED-NOT-VERIFIED in this corpus.'
  - Pushforward of an ideal along a known isogeny is polynomial-time given the ideal and the
    isogeny (standard Deuring machinery, KN-TECH-028).
  heuristic_assumptions:
  - id: HB-3
    statement: COMMITMENT UNIFORMITY. The commitment curve is distributed within total-variation
      p^{-Omega(1)} of uniform on its support, so the collision probability after q signatures
      is 1 - exp(-q^2/(2 N_com)) (1 + o(1)).
    rigorous_ingredient: Pizer's Ramanujan property for the supersingular ell-isogeny graph
      and the explicit mixing bound the frozen source cites ([6, Lemma 14], line 193).
    distribution_imitated: The classical birthday law for uniform sampling with replacement.
    validation_route: 'Toy, on the four committed graphs: measure the empirical collision
      curve against the birthday prediction and against a short-walk arm that has not mixed.
      LABELLED TOY. Crypto-scale validation requires the Round-3 commitment procedure and
      is blocked on document access, not on compute.'
    tail_checks: The early tail (q << sqrt(N_com)) must show collision probability ~q^2/(2
      N_com) with the right constant; a mismatch there indicates non-uniformity before the
      threshold is reached.
  target_complexity:
    time_exponent: POLYNOMIAL given one collision, against the matched baseline p^{1/3+o(1)}
      conditional for bare-curve key recovery. The cost of OBTAINING a collision is q ~ sqrt(N_com)
      signatures, i.e. a data cost, not a computation cost -- and that is the axis on which
      this record must be compared, which is why data/queries is charged explicitly below.
    memory_exponent: Polynomial (store q commitment curves, q ~ sqrt(N_com)); the dominant
      resource is the transcript store, and it is charged.
    best_known_baseline: p^{1/3+o(1)} time AND memory conditional on Heuristic 1, with NO
      data requirement. This record trades zero computation for sqrt(N_com) signatures.
    hidden_overhead_disclosure: 'None asymptotically, but the polynomial factors in [35, Theorem
      1] are NOT small: SC-3 records its only explicit exponent, Omega((log N)^{-12}) per-iteration
      success probability, which this corpus prices at 2^96-2^192 at log2 p = 256. So "polynomial"
      here is not "cheap", and the record must carry that qualification everywhere.'
    time_memory_tradeoff: 'Data-versus-time: fewer signatures can be traded for a partial
      search over the commitment space, giving a q * (search) curve that must be drawn before
      any comparison with the p^{1/3} baseline is made.'
  sota_delta: Zero until e is known. If 2^{e/2} is below a deployed signing bound the delta
    is a polynomial-time key recovery from sqrt(N_com) signatures against a p^{1/3+o(1)} computational
    baseline -- but the record asserts no such thing and the honest current delta is zero
    with one reading task attached.
  dominated_by: 'On the TIME axis nothing dominates a polynomial-time attack; on the DATA
    axis the incumbent p^{1/3+o(1)} attack dominates completely, because it needs zero signatures.
    ROWS CHECKED across all three axes: time (KN-TECH-058''s two tiers, KN-TECH-057''s four
    full-cost rows, frozen source Section 4.1); memory (same rows, plus the 2^{92.5}-entry
    endpoint); and data/queries (the incumbent needs none, so this record is dominated there
    and says so). Whether it is Pareto-incomparable or dominated depends entirely on e.'
  estimated_cost: Implementation medium-high (surrogate signer plus a working ideal/isogeny
    pushforward at toy scale). Compute low. ARM B is free and is the deciding arm.
  recommended_priority: high
  honest_prior_of_survival: 0.9 that steps (1)-(3) are correct as mathematics for a KLPT-style
    (dimension-1) response. 0.4 that they survive the higher-dimensional response format,
    which is the record's main mathematical risk. 0.1 that the inequality actually binds for
    deployed parameters -- designers usually size commitment spaces at 2^{2 lambda} precisely
    to defeat this, and the expected finding is a confirmed-tight design decision, which is
    still worth writing down because this corpus has never written it down.
