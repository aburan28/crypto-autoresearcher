        E/Q rank>=1: a d-dim GAP containing x-labels of a positive proportion
        rho of rational points holds <= A(E,d,rho)^r of them
      verified_by: idea-generator 2026-10-17, abstract fetched (v4, 2026-05-20)
    - ref: Shparlinski, FFA 14(1):132-141 (2008)
      provenance: retrieved
      claim: bilinear sums over E nontrivial only above ~q^(1/2+eps) points
      verified_by: H-PFDR-2765d2 structural_ingredients (abstract only)
    - ref: Kohel-Shparlinski, LNCS 1838:395-404 (2000)
      provenance: recalled
      claim: sup-norm bound for characters over x-intervals; pointer only
      verified_by: null
  assumptions:
    - Engine builds the base from a given label set; GAP sets are an input.
    - Group-element keys (x,y) in 64 bits need p < 2^32; satisfied.
  predictions:
    - metric: kappa_E = nontrivial pair coincidences / matched-random mean
      direction: different
      minimum_effect: >-
        absolute deviation of kappa_E from 1 at least 0.10 in some cell,
        calibrated z > 4
  minimal_test:
    design: >-
      Cell (p, theta, d), b <= 2^13. d=1 window; d=2 W={a+c*w}, w uniform in
      F_p, B1*B2=B; d=3 likewise. Curves per cell: enough prime-order curves
      (curve.py) that expected total coincidences are >= 2500, else the cell is
      inconclusive. Sort all b^2 signed pair sums as (x,y) keys; subtract the
      trivial coincidences ({P,Q}={P',Q'}, P+Q=O). Null: 20 random symmetric
      subsets per curve, same b. Report kappa_E, bootstrap CI over curves,
      per-theta slope.
    controls:
      - Matched random base on the same curve and size (the null above).
      - Positive control, a base containing a known-log AP, which must read kappa_E at least 1.15.
      - Null-vs-null z distribution must be N(0,1) within 10%.
    required_metrics: [kappa_E with CI, b, p, theta, d, curve count, z, planted recovery]
  falsification_conditions:
    - Every powered cell within 5% and the planted arm recovered closes interval/GAP excess at pair level in the tested range (scoped; not reject_scoped).
    - Any cell with kappa_E >= 1.10 at z > 4 on fresh curves survives as structure.
    - Planted arm not recovered at a cell makes that cell inconclusive, never null.
  confounders:
    - Hasse fluctuation of b; handled by a size-matched null at the observed b.
    - Negation symmetry doubles trivial counts; subtracted, and the null is symmetrized alike.
  interpretation_limits:
    - Pair level (h=2) only. Says nothing about h>=3 or N above 2^22 here.
    - A null does not exclude excess that grows with N (Part C's question).
  heuristic_assumptions:
    - id: H1
      statement: >-
        For b <= p^(2/3), Energy_nt(F) = (1+o(1)) b^4/N for window and GAP
        bases, as for a uniform random symmetric subset.
      rigorous_support: >-
        Parseval plus a Weil-type sup-norm bound gives it for b >= p^(2/3)
        (recalled); below that it imitates equidistribution of sumsets.
      validation_plan: >-
        Four primes, theta grid step 0.05, curves per cell as above; compare to
        the measured null mean; flag any z > 3 and replicate on fresh curves.
  target_complexity:
    time_exponent: no attack claimed
    memory_exponent: no attack claimed
    best_known: rho N^(1/2); tail-table family N^(max(h,m-h+1)/m), measured 0.67 at m=3
