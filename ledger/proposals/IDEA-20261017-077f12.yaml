idea:
  id: IDEA-20261017-077f12
  question_id: RQ-PFDR-ae2fba
  added: '2026-10-17'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Rank-d label-GAP bases on the base-size axis of the TT collision census:
    where does the random model stop being a theorem, and is anything below it
  class: measurement
  claim: >-
    R1 labels, stage relation decomposition (table-table coincidences, h=2,
    i.e. TT3/TT4). On prime-order E/F_p let F = {P : x(P) in W}, W a rank-d
    generalized AP in F_p (d=1,2,3; f(x) square). Its nontrivial pair-sum
    coincidence count is within 5% of a matched random symmetric base at every
    b = |F| = p^theta with theta in [0.30,0.65] and b <= 2^13, for p in
    {2^16,2^18,2^20,2^22}. A Weil-type sup-norm bound K <~ p^(1/2) log p
    (recalled) makes this a theorem only for theta >= 2/3. Listing F already
    costs rho at theta = 1/2, so every sub-rho interval or GAP base lies
    outside the proven range. The test locates the empirical departure from
    the random model, if any.
  mechanism: >-
    Pair (representation, Sigma) = (R1 x-labels in a rank-d GAP, translation by
    factor-base elements). Trichotomy: partial-action, Class I of
    IDEA-20260806-c5d183. Tracked object: the multiset of group pair sums P+Q,
    read as Energy(F) = #{P1+P2=P3+P4}. Lossy-projection test: the census keeps
    one integer and discards which pairs collide (b^2 sums to a count).
    Translation by T in F sends a coinciding pair to a coinciding pair, so the
    discard is Sigma-compatible. Exact in O(b^2) additions, no logarithms.
    Parseval: Energy = b^4/N + N^-1 sum_{chi!=1}|F^(chi)|^4 <= b^4/N + K^2 b, so
    the excess is negligible iff b^3 >> K^2 N, i.e. b >= p^(2/3). F2 is the
    lens (off-limits as primary). Added: d>=2 label GAPs (lattice-describable
    class of IDEA-20260808-486ae2 and digit GAPs of IDEA-20260830-84cdb7, so far
    tested only for solver reach or degree) and the theta axis (EXP-PFDR-011cd0
    and EXP-PFDR-0b3699 vary N at default b). KN-OPEN-020 class:
    lattice-describable window, outside the bounded-degree no-go. Ingredient:
    Choi, arXiv:2510.03828 (char-0 rigidity of x-labels of finite-rank
    subgroups); this is its F_p toy transfer. Derivation in the .notes.md.
  novelty_status: unverified
  citations:
    - ref: IDEA-20260811-7734c5
      provenance: internal
      claim: exact pair energy of a window base, O(B^2), no logarithms
      verified_by: idea-generator 2026-10-17, file opened
    - ref: arXiv:2510.03828
