idea:
  id: IDEA-20260816-da106b
  question_id: RQ-ALPF-001
  added: '2026-08-16'
  title: KN-OPEN-005 asks whether a non-generic representation is generic-group-model simulable; make
    that checkable for one concrete ALPF survivor by building the simulator and testing transcript
    equivalence, so the e-ring oracle either falls to a constructed simulator or resists it on a named
    input.
  class: representation
  claim: '(A) KN-OPEN-005 poses simulability as the sharp cheap screen to apply before spending compute
    on a representation candidate, and names jets, elliptic nets and incidence reporting as instances.
    The ALPF lane produced a concrete prime-field survivor -- the e-ring elementary-symmetric representation
    of the m=3 Semaev system, recorded firing at d_ff below D_reg_pred at |FB| = 4 and 5 and at 13
    and 15 bits in EXP-ALPF-011 -- and nobody has asked KN-OPEN-005''s question of it. (B) The claim
    is that simulability is checkable CONSTRUCTIVELY rather than argued: define the e-ring oracle
    precisely as the map from a queried tuple of factor-base indices to the elementary-symmetric coordinates
    of the corresponding x-values together with the Semaev residue; then attempt to build a simulator
    that answers every such query using only generic group operations plus public curve data and the
    queries already made, and test the two by transcript equivalence over many random query sequences.
    If the simulator succeeds on every sequence, the representation supplies nothing beyond the generic
    group on those queries; if it fails, the FAILING QUERY is a named, minimal witness of non-genericity
    and is the deliverable. (C) The claim is further that the failure, if any, will be localised to
    queries whose tuples share a factor-base element, because the elementary-symmetric coordinates
    couple entries of the tuple in a way that repeated entries make visible. (D) NOT CLAIMED: that
    the e-ring representation breaks any bound; that non-simulability would imply a sub-birthday relation
    supply or any speedup; that simulability would close the candidate family, since simulability
    is proved only for the tested query class. A constructed simulator is evidence about a specific
    oracle definition on a specific query class, and both are stated.'
  mechanism: 'STAGE 1 (zero compute): write the e-ring oracle''s signature down exactly -- inputs,
    outputs, and what public data the simulator is allowed -- and rewrite it with explicit quantifier
    order per inventor-protocol section 8 item 3, checking whether the simulator is allowed to depend
    on the instance, the curve, or the query sequence. STAGE 2 (zero compute): apply the observation-collision
    audit of section 8 item 2 by searching for two distinct ground-truth instances producing identical
    e-ring transcripts on a fixed query sequence; a collision means the transcript is not identifying
    and the oracle cannot carry instance information on that class. STAGE 3: implement the oracle
    against real toy curves via harness/semaev.py and harness/toycurve.py. STAGE 4: implement the
    candidate simulator, which given only group-operation access and public curve data attempts to
    produce the same outputs; the natural construction reconstructs elementary-symmetric coordinates
    from the x-coordinates it can obtain by generic queries, so the interesting cases are queries
    where those x-coordinates are not obtainable generically. STAGE 5: run transcript equivalence
    over 1000 random query sequences of varying length and structure, including sequences with repeated
    factor-base elements, and record the first divergence per sequence if any. STAGE 6: report either
    a simulator that matched every transcript, with its overhead measured in generic queries per oracle
    query, or the minimal divergent query with its full context. Refutation of the whole line: if
    the simulator matches everything with O(1) overhead, the e-ring representation is simulable on
    this query class and the ALPF survivor''s algebraic early fall carries no non-generic content
    on that class.'
  novelty_status: unverified
  novelty_screen:
    method: grep -ril 'simulab' ledger/proposals/ ; grep -ril 'ALPF' ledger/proposals/ ; grep -ril
      'power-sum|elementary symmetric|e-ring' ledger/proposals/ ; read knowledge/open-problems/KN-OPEN-005.md
      in full, experiments/EXP-ALPF-011/analysis.md firing rows, docs/inventor-protocol.md section
      8 items 2 and 3, ledger/questions/RQ-GGMB-6eaabc.yaml title.
    results: 'Zero proposals reference ALPF. ''simulab'' matches IDEA-20260806-c5d183 (RQ-ECDLP-002,
      translation-action orbit argument forcing tracked objects into three classes), IDEA-20260807-4cebed,
      IDEA-20260807-59fed3, IDEA-20260807-6eab6a (RQ-TORS-8c7b79, ell-primary coprimality obstruction),
      IDEA-20260807-9ecc6f, IDEA-20260807-cb672c, IDEA-20260811-b2806a and IDEA-20260815-86896b (RQ-ECDSA-87625f,
      deterministic ECDSA leakage) -- these are simulability arguments about other objects on other
      questions, none about the e-ring Semaev representation and none in the ALPF lane. KN-OPEN-005
      names jets, elliptic nets and incidence reporting as its instances and points at RQ-JETB-001,
      RQ-JET-001, RQ-NET-001 and RQ-INC-001; the elementary-symmetric Semaev representation is not
      among them. RQ-GGMB-6eaabc carries 11 proposals treating generic-group-model bounds as a BARRIER
      argument, which is the opposite direction of use: this proposal builds a simulator to test one
      oracle, and asserts no barrier.'
    verdict: 'UNVERIFIED. Nothing is asserted about what any publication contains; KN-OPEN-005''s
      own summary is cited as a repository record. Assembled from known parts: the simulability screen
      is KN-OPEN-005''s stated method, the transcript-equivalence test is standard, and the e-ring
      representation and its firing cells are already committed in EXP-ALPF-011. Claimed new relative
      to this repository: (i) applying KN-OPEN-005''s screen to the ALPF lane''s own concrete prime-field
      survivor rather than to the jets/nets/incidence instances it lists; (ii) making the screen CONSTRUCTIVE
      -- build the simulator and diff transcripts -- rather than argumentative, so a failure yields
      a named minimal witness query instead of an inconclusive discussion; (iii) predicting in claim
      (C) that any divergence localises to repeated-element tuples, which turns a yes/no screen into
      a falsifiable structural statement.'
  object_first_candidate:
    tracked_object: 'The oracle transcript: the ordered sequence of (query, answer) pairs produced
      by the e-ring oracle on a random query sequence, considered as an object to be reproduced by
      a simulator with only generic group access.'
    lossiness: 'Genuinely lossy. The transcript retains only what the oracle answers -- elementary-symmetric
      coordinates and a Semaev residue per queried tuple -- discarding the curve coefficients, the
      discrete logarithm, the full x-coordinates individually, and every internal computation. This
      is compatible with the operation of interest, which is answering the next query, because the
      oracle is by definition a function of the query and the instance. The projection is non-injective
      in a way that is directly testable: the collision audit in STAGE 2 asks whether two distinct
      instances give the same transcript, and a collision would prove the transcript strictly loses
      instance information. If no collision exists on any query class, the transcript determines the
      instance and the projection is a change of coordinates rather than a lossy object, which would
      itself be worth recording plainly.'
    propagation: One step of the target operation is one additional oracle query appended to the transcript.
      The propagation question is exactly whether the simulator's state -- prior queries, prior answers,
      public curve data and generic group access -- determines the next answer. For a tuple of distinct
      factor-base indices the elementary-symmetric coordinates are symmetric functions of x-values
      the simulator can obtain by generic queries, so the step is simulable by direct computation
      with overhead equal to the number of tuple entries. For a tuple with repeated indices the symmetric
      functions degenerate and the step is where claim (C) predicts the simulator either still succeeds
      trivially or diverges, which is why repeated-element sequences are made a separate query class.
    survival_score: 'The transcript object survives for as long as the simulator matches, so its survival
      score is literally the divergence index: the number of queries before the first mismatch, reported
      per sequence with its distribution. A simulator that never diverges over 1000 sequences of length
      up to 200 gives a survival score of at least 200000 queries, which is the concrete statement.
      A simulator that diverges at query 1 on repeated-element tuples gives a survival score of 0
      on that class and full survival on the distinct-element class, which is the most informative
      possible outcome.'
  null_object_control: 'The null object is a random oracle of the same signature: a function returning
    uniformly random elements of the same output shape for each distinct query, with consistency across
    repeats, carrying no curve behind it. The IDENTICAL simulator is run against it in the same invocation.
    The simulator must FAIL against the null -- immediately and on essentially every sequence -- because
    there is nothing there to reconstruct. If the simulator matches the null''s transcripts, the equivalence
    test is vacuous (for example the comparison is too coarse or the outputs are being canonicalised
    away) and no conclusion may be drawn about the e-ring oracle. A second null is a shuffled-answer
    oracle: the real e-ring oracle with its answers permuted across queries, which the simulator must
    also fail, confirming the test is sensitive to answer content and not only to output shape.'
  discriminated_from:
  - KN-OPEN-005 states the simulability screen and lists jets, elliptic nets and incidence reporting
    as instances. This applies it to a different, prime-field, ALPF-native representation and does
    so by constructing a simulator rather than by argument.
  - RQ-GGMB-6eaabc's 11 proposals use generic-group bounds as a barrier argument. No barrier is asserted
    here and no lower bound is claimed; the deliverable is a simulator or a named divergent query.
  - IDEA-20260806-c5d183 forces tracked objects into three classes by a translation-action orbit argument
    on RQ-ECDLP-002. That is a classification of objects; this is a constructive test of one specific
    oracle's transcript, and the orbit argument does not mention elementary-symmetric Semaev coordinates.
  - IDEA-20260815-f558e4's one-step rigidity/propagation ceiling bounds how far an object survives
    one group operation. This measures how far a TRANSCRIPT survives one additional query under a
    simulator, which is a different operation and a different survival notion.
  - IDEA-20260807-df906f's group-law rigidity theorem and its four escapes concern objects that are
    functions of one point. The e-ring oracle is a function of a TUPLE of factor-base points and a
    residue, so the rigidity theorem's hypothesis does not apply, and that non-applicability is stated
    rather than assumed.
  assumptions:
  - The e-ring oracle can be given a precise signature that both the real implementation and the simulator
    target without ambiguity.
  - harness/semaev.py's s3_expr, s4_expr and build_factor_base suffice to implement the real oracle
    at toy sizes.
  - Generic group access can be modelled faithfully in software as a handle-based interface over harness/toycurve.py
    points, so the simulator provably uses no more than group operations plus public data.
  - Transcript equality is well defined after a fixed canonicalisation of output ordering, and that
    canonicalisation does not itself hide a difference -- checked by the shuffled-answer null.
  - 1000 random sequences of length up to 200 at toy sizes fit comfortably in budget, which they should
    since no Groebner computation is involved.
  predictions:
  - metric: simulator transcript match rate on distinct-element query sequences
    direction: higher
    minimum_effect: 1.0
  - metric: simulator transcript match rate on repeated-element query sequences
    direction: different
    minimum_effect: 'refuse to pre-commit: this is the informative cell and pre-committing its value
      would be guessing at the very thing the experiment exists to find'
  - metric: simulator transcript match rate against the random-oracle null
    direction: lower
    minimum_effect: 0.01
  - metric: simulator overhead in generic group operations per oracle query, on matched sequences
    direction: different
    minimum_effect: 'forced: predicted equal to the tuple length, i.e. 3 for m=3, and any value growing
      with the field size falsifies the O(1)-overhead reading'
  minimal_test:
    design: 'One curve, two query classes, one simulator. Fix a single 13-bit toy curve with |FB|
      = 4. Implement the e-ring oracle and the candidate simulator behind one shared interface. Draw
      200 query sequences of length 50 with all-distinct tuples and 200 with deliberately repeated
      factor-base elements. Run both oracle and simulator on each sequence in the same process and
      record the index of first divergence, or none. In the same invocation run the simulator against
      the random-oracle null and the shuffled-answer null on 50 sequences each. The discriminating
      outcome is a 2x2: simulator matches distinct-element sequences and fails the nulls (test is
      sound), and then either matches or diverges on repeated-element sequences. A divergence gives
      a minimal witness query printed in full; a match gives a simulability statement scoped to this
      query class with a measured overhead. Cost is minutes.'
    controls:
    - Random-oracle null of the same signature, against which the simulator must fail, run in the
      same invocation.
    - 'Shuffled-answer null: real oracle answers permuted across queries, which the simulator must
      also fail, confirming sensitivity to content.'
    - 'Overhead accounting: every generic group operation the simulator performs is counted by the
      interface, so the O(1)-overhead question is measured not asserted.'
    - 'Query-class separation: distinct-element and repeated-element sequences reported separately,
      never pooled.'
    - Second curve replication at a different bit size for the smallest cell, to show a divergence
      is not curve-specific.
    required_metrics:
    - transcript match rate per query class
    - index of first divergence per sequence, with its distribution
    - the minimal divergent query in full, if any
    - simulator overhead in generic group operations per oracle query
    - match rate against the random-oracle null and the shuffled-answer null
    - collision count from the STAGE 2 observation-collision audit
    - sequence length and tuple-repetition rate per sequence
  falsification_conditions:
  - The simulator matches the random-oracle null, making the equivalence test vacuous and voiding
    all conclusions.
  - The simulator matches every sequence in both query classes with overhead equal to the tuple length,
    in which case the e-ring representation is simulable on this class and carries no non-generic
    content there.
  - The simulator diverges on distinct-element sequences, falsifying the reconstruction argument and
    indicating the oracle signature was mis-specified.
  - A divergence appears but is not reproducible on a second curve, indicating a curve-specific artifact
    rather than a structural property.
  - The observation-collision audit finds two distinct instances with identical transcripts on the
    tested class, showing the transcript is not identifying and bounding what any divergence could
    mean.
  - Simulator overhead grows with field size, falsifying the O(1)-overhead reading regardless of match
    rate.
  confounders:
  - The oracle signature is a modelling choice; a slightly different definition of what the e-ring
    oracle returns can make simulability trivially true or trivially false, and the result is only
    as meaningful as the signature is faithful to the representation used in EXP-ALPF-011.
  - What counts as 'public curve data' available to the simulator is a boundary that can be drawn
    to force either answer, and must be fixed in advance.
  - Canonicalisation of transcript outputs can hide genuine differences; the shuffled-answer null
    bounds but does not eliminate this.
  - The query distribution is chosen by the experimenter and a divergence may exist only outside it,
    so a clean match is a statement about the tested distribution.
  - Toy field sizes may permit accidental coincidences among symmetric coordinates that would not
    occur at larger sizes, in either direction.
  interpretation_limits:
  - A successful simulator establishes simulability on the tested query class under the fixed signature
    and public-data boundary, and closes nothing outside it.
  - A divergent query is a witness of non-genericity on that class and implies NOTHING about relation
    supply, sub-birthday behaviour, attack cost, or any security consequence.
  - The result is scoped to the m=3 e-ring representation at toy sizes and does not transfer to other
    representations or scales.
  - Neither outcome revises EXP-ALPF-011, whose early-fall observation is an algebraic measurement
    independent of the simulability question.
  target_complexity:
    time_exponent: No attack exponent is claimed. The simulator's cost is measured in generic group
      operations per oracle query and is predicted to be the tuple length; this is an overhead figure
      for a simulation, not an attack cost.
    memory_exponent: No attack memory exponent is claimed. The simulator's state is the transcript
      so far, linear in the number of queries.
    best_known: 'The incumbent is KN-OPEN-005''s own framing: the generic square-root bound is the
      barrier and a representation beats it only if non-generic and non-simulable, with the recurring
      kill argument being simulability or tautology. No simulator for the e-ring Semaev oracle exists
      in this repository. For the underlying problem the incumbent is Pollard rho at roughly sqrt(n)
      group operations, untouched here.'
    hidden_overhead: 'The entire scientific weight sits in the signature and the public-data boundary,
      and fixing those is unglamorous human work with no compute attached; a session that rushes it
      will produce a confident answer to a question nobody asked. Lower-order term: counting generic
      group operations honestly requires the group interface to be the only route to point arithmetic
      in the simulator, which is an engineering discipline more than a design.'
  dominated_by: 'n/a (no attack result claimed). Pareto check performed across time, memory and data/queries:
    no attack point is produced, so no frontier row applies. On the screening axis this constructive
    test dominates a prose simulability argument in decisiveness (it yields either a working simulator
    with a counted overhead or a printed witness query) and is dominated by it on cost, since a prose
    argument costs no compute at all.'
  sota_delta: 'No attack; conceptual and screening contribution only. Quantitatively: the incumbent
    state is zero simulators built for this oracle and zero transcript comparisons; this produces
    a match rate over 400 or more sequences per curve across two query classes with two nulls, plus
    a measured overhead in generic group operations per oracle query. Zero change to any ECDLP time
    or memory exponent, and no bound is claimed to be approached or beaten.'
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'That a faithful signature and public-data boundary can be fixed without
    begging the question: 0.6 -- this is the hard part and it is human, not computational. That the
    simulator succeeds on distinct-element sequences: 0.8, because symmetric functions of obtainable
    x-coordinates are computable by construction, which makes this half close to a foregone conclusion
    and I say so rather than dress it up. That a genuine divergence appears on repeated-element sequences:
    0.2, and I would not be surprised by 0.05; the honest expectation is that the e-ring representation
    is simulable and that the value of the entry is a clean, cheap, constructive closure of one candidate
    on a named query class rather than a discovery. That the nulls behave (simulator fails them):
    0.9. Overall probability the entry produces a usable scoped simulability statement either way:
    0.75.'
