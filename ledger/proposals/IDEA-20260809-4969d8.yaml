idea:
  id: IDEA-20260809-4969d8
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ROS-595c15
  goal_id: GOAL-ROS-001
  title: >-
    Where does the polynomial solver actually overtake generalized birthday?
    Measure the crossover instead of quoting the asymptotic separation
  class: measurement
  claim: >-
    Two solvers exist for the same problem: a sub-exponential generalized-birthday
    approach and the polynomial-time algorithm that applies once the number of
    sessions is large enough. The claim is that their measured crossover in
    concrete cost occurs at a session count and group order that can be located
    experimentally, that it does not coincide with the asymptotic threshold, and
    that the gap between the two matters for any protocol choosing a concurrency
    limit.
  mechanism: >-
    Implement both solvers, run them on identical instances across a grid of
    session counts and group orders, and record cost. The crossover is the
    boundary in that grid where the cheaper solver changes.
  why_not_a_renamed_known_approach: >-
    Both algorithms are published and their asymptotic relationship is known.
    Measuring the CONCRETE crossover on one implementation with matched instances
    is what turns an asymptotic statement into a parameter recommendation input,
    and it is not something the original papers set out to do.
  predictions:
  - observable: crossover boundary in the (session count, group order) grid
    metric: boundary curve
    predicted: Displaced from the asymptotic threshold, plausibly requiring more sessions than the asymptotic statement suggests. Coincidence with the asymptotic threshold is a clean result too.
  - observable: cost ratio at the crossover
    metric: ratio near the boundary
    predicted: Near one by definition, with a shallow gradient; a steep gradient would make the boundary sharp and easier to state, and this is worth reporting either way.
  minimal_test: >-
    A grid of three group orders by five session counts, both solvers on identical
    instances with declared seeds, ten trials per cell, cost recorded per solver.
  controls:
  - 'IDENTICAL-INSTANCE CONTROL: both solvers must run on the same instances, or the comparison measures instance difficulty rather than solver cost.'
  - 'IMPLEMENTATION-EFFORT DISCLOSURE: relative optimization effort spent on each solver is declared, since an unequal effort is the most likely confound in any solver comparison.'
  falsification_conditions:
  - No crossover exists within the reachable grid, in which case the record reports the grid's boundary rather than a curve.
  - The comparison is dominated by implementation effort, which the disclosure control is designed to expose.
  interpretation_limits: >-
    Crossovers measured on this program's implementations at small parameters do
    not transfer to optimized implementations at deployment scale, and the record
    says so.
  sota_delta: 'No attack. Delta: a concrete crossover boundary where the literature has an asymptotic separation.'
  dominated_by: Downstream of IDEA-20260809-47bb6d; not dominated by any corpus record.
  estimated_cost: Implementation medium (two solvers); compute moderate.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for generalized birthday: no records. WEB NOT CHECKED.'
  source_refs:
  - Wagner's generalized birthday algorithm -- RECALLED, REQUIRED READ.
  - The ROS insecurity reference -- RECALLED, REQUIRED READ.
