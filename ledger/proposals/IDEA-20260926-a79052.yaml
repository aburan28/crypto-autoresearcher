      verified_by: idea-generator, this session, cited through 1b16d7 and 153a90; cedd2f not reopened this session.
    - ref: IDEA-20260922-153a90
      provenance: internal
      claim: >-
        On a prime-order target subgroup no nontrivial translation-compatible
        lossy test exists; the only available levers act on legs in the
        composite-order full group. Places this record's filter on legs.
      verified_by: idea-generator, this session, record read in full.
    - ref: KN-FIND-aa2efc
