      verified_by: null

  citation_note: >-
    The membership identity is re-derived in full in claim (b = 1 case matches
    the BRIEF's Tr(x) = Tr(1/x) for a = 0). The only external pointer is
    recalled and hedged. No web search was run.

  assumptions:
    - Koblitz sibling y^2 + xy = x^3 + a x^2 + 1 over F_2[t]/(t^17 + t^3 + 1) with a in {0, 1}; b = 1 makes the 1/x term Tr(1/x). The ordinary RC-1 curve (A = 97044, B = 126251) is the matched control.
    - The membership test Tr(x) + Tr(1/x) + Tr(a) is computed by one field inversion and two half-traces per slot, once per slot; x = 0 is excluded (it is the 2-torsion x-coordinate and is handled as its own stratum).
    - Satisfiability of an attempt is decided by the enumeration/root-finding oracle over V (or V_T), never by a closure.
    - >-
      OFF-LIMITS COMPONENT: F2 as the family; V_T inside KN-OPEN-020's
      implicit-membership-cheap class; not escaped.

  proof_search_map:
    bottleneck: >-
      Whether restricting the factor base to the trace-membership set removes a
      measurable share of unsatisfiable attempts that the ordinary builder
      still pays for, or whether the builder already samples on-curve and the
      share is empty.
    baseline_embedding:
      parameter_slice: >-
        The RC-1 oracle A (oracles_rc1.py) is the exact builder whose sampling
        must be read; the ordinary curve's archived U62/S62/C20 split is the
        baseline the Koblitz sibling's split is compared against.
      reproduction_check: >-
        Read oracle A: it root-finds x_2 on the curve, so satisfiable pairs are
        on-curve by construction; the question is whether the UNSATISFIABLE
        attempts counted at the cell include off-curve x_1 slots. Reproduce the
        archived unsatisfiable count and classify each unsatisfiable attempt as
        by-non-membership or by-non-target, at zero new sampling on the ordinary
        curve.
    observation_collision:
      observable: The per-attempt (sat flag, membership-of-each-slot, unsat-reason class).
      distinct_preimage_search: >-
        A lower unsatisfiable share under V_T could come from (i) the
        membership filter or (ii) V_T simply being smaller (fewer attempts of
        every kind). Separated by holding |V_T| fixed and comparing against a
        RANDOM subset of V of the same size (the shape null): the random subset
        must NOT show the curve-aligned reduction, or the effect is a size
        artifact.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace V by V_T = V intersect {Tr(x) = Tr(1/x) + Tr(a)} as the
          factor base; membership is a precomputed O(1)-per-slot test;
          completeness (every relation over V_T is a relation over V) and
          soundness (every V_T relation certified by curve arithmetic) are
          explicit.
        predicted_gain: >-
          On the Koblitz sibling, the per-attempt mean cost drops by the
          measured by-non-membership share (predicted near half of the
          unsatisfiable column IF the ordinary builder does not already
          restrict; near zero under E-NULL). No exponent.
      - transform: observable_fiber
        proposed_object: V_T on the Koblitz sibling against a size-matched random subset of V on the same curve and against V_T on the ordinary curve.
        predicted_gain: Separates the curve-aligned membership effect from a plain size effect and from a coincidental trace balance.
    quantifier_order: >-
      Membership identity: FORALL x != 0, FORALL a, b = 1: x lifts iff
      Tr(x) + Tr(1/x) + Tr(a) = 0 (exact). Empirical: FOR the Koblitz sibling
      and the ordinary control at the cell, the by-non-membership share and the
      per-attempt cost shift are as measured with CP95 intervals.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On the n = 17 Koblitz sibling, V_T removes a fraction phi of
        unsatisfiable attempts (by-non-membership), shifting the per-attempt
        mean cost by phi times the solve cost, with the satisfiable solution
        set unchanged and 0 on-curve relations lost; on the ordinary curve and
        on the random-subset control the same test removes attempts with no
        curve-aligned reduction." Nothing about m >= 3, cost on ECC2K-130, or
        F4.
      nearby_object_control: >-
        The ordinary RC-1 curve (no Koblitz membership structure of this
        specific shape, though every binary curve has A lift condition; the
        control is that the SAME functional is not curve-aligned there in the
        way that halves the unsatisfiable column) and the size-matched random
        subset of V.
    proof_obligations:
      - claim: x lifts to a point iff Tr(x + a + b/x^2) = 0, and for b = 1 this is Tr(x) + Tr(1/x) + Tr(a) = 0.
        responsibility: correctness
      - claim: Every decomposition relation over V_T is a relation over V, and no relation over V uses an off-curve slot (completeness and soundness of the restriction).
        responsibility: correctness
      - claim: The RC-1 oracle A's sampling is read to decide whether off-curve slots are already excluded (the E-NULL check).
        responsibility: baseline
      - claim: The by-non-membership share is measured with an exact unsat-reason classifier, not inferred.
        responsibility: correctness
      - claim: The random-subset control shows no curve-aligned reduction.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: by-non-membership share of unsatisfiable attempts under V on the Koblitz sibling (fraction, CP95)
      direction: different
      minimum_effect: >-
        E-FILTER iff >= 0.30 (a real removable class); E-NULL iff <= 0.02 (the
        builder already restricts). Between is MIXED, reported.
    - metric: per-attempt mean solve cost, V_T versus V, Koblitz sibling (ratio)
      direction: lower
      minimum_effect: 'equal to 1 minus the by-non-membership share within measurement error; a larger drop indicates an additional effect to localise.'
    - metric: on-curve relations lost by the restriction (count)
      direction: same
      minimum_effect: 'exactly 0 (completeness); any loss falsifies the restriction.'
    - metric: by-non-membership share on the ordinary curve and on the size-matched random subset (fraction)
      direction: different
      minimum_effect: 'the curve-aligned reduction present on the Koblitz sibling must be absent (within CP95) on the random subset, or the effect is a size artifact.'

  minimal_test:
    design: >-
      CELLS. Koblitz sibling y^2 + xy = x^3 + a x^2 + 1 over
      F_2[t]/(t^17 + t^3 + 1), a in {0, 1}, whose order the run counts exactly
      (a = 1 gives 2 x 65587 per the session's Lucas re-derivation, checked in
      the run; a = 0 counted directly); ORDINARY control = the RC-1 curve
      A = 97044, B = 126251. m = 2, l = 9, V = {deg < 9}, and V_T = V intersect
      {Tr(x) = Tr(1/x) + Tr(a)}. Targets: subgroup targets in the odd-order
      part, 200 attempts, drawn by the Stage-1 rule from a fresh seed. RANDOM
      control: a random subset of V of size |V_T|.
      INSTRUMENT. experiments/EXP-CERTBIN-e94b27/impl/oracles_rc1.py (oracle A
      generalised to the Koblitz coefficients and to enumerate over V_T; its
      root-finding already gives the on-curve x_2), a small membership
      precompute (inversion + half-trace), and the enumeration oracle as
      satisfiability ground truth; the unsat-reason classifier is a few lines
      (an attempt is by-non-membership iff any fixed slot is off-curve; else
      by-non-target). No closure is needed for the primary metric; W_4 is run
      only as an optional cross-check that unsatisfiable-by-non-membership
      attempts are also refuted by the closure (consistency, not required).
      No external solver; nothing `missing`.
      PROCEDURE. (0) Re-derive the membership identity (done) and count both
      Koblitz orders. (1) Read oracle A's sampling to decide E-NULL by
      inspection. (2) On each curve, draw attempts, classify each unsatisfiable
      attempt, and record the by-non-membership share. (3) Compare V_T and V
      per-attempt mean cost (oracle root-findings, and optionally closure ops).
      (4) Completeness check: every V_T relation is a V relation, verified by
      curve arithmetic. SEEDS recorded; instance sets fixed by rule.
      METRICS (units). by-non-membership share (fraction, CP95); per-attempt
      mean cost (oracle root-findings; field operations); on-curve relations
      lost (count); shares on the ordinary curve and the random subset.
      CONTROLS. Ordinary RC-1 curve; size-matched random subset of V;
      completeness/soundness by curve arithmetic on every counted relation; no
      relabelled Z/NZ control (no group-structure claim, only curve
      membership). OUTCOME TABLE. POSITIVE (E-FILTER, share >= 0.30 on the
      Koblitz sibling, absent on the random subset): the ordinary cost law
      overcounts unsatisfiable attempts and V_T is the corrected base; the
      corrected law is handed forward. NEGATIVE (E-NULL, share <= 0.02, or the
      random subset shows the same reduction): the builders already restrict to
      on-curve slots and V_T = effective V; the seam item is closed with a
      measured obstruction (no removable class). ARTIFACT (any on-curve
      relation lost, any relation failing curve verification, or the order
      re-count disagreeing): the restriction or instrument is wrong; void.
      FALSIFICATION THRESHOLD. E-FILTER falsified iff the by-non-membership
      share <= 0.10 on the Koblitz sibling; E-NULL falsified iff it >= 0.10.
      COST (estimate): implementation low (membership precompute, oracle
      generalisation, classifier, about 150 lines); compute about 1 CPU-hour.
    controls:
      - Ordinary RC-1 curve as the matched non-Koblitz control.
      - >-
        Size-matched random subset of V (shape null): no curve-aligned
        reduction expected.
      - Completeness/soundness by curve arithmetic on every counted relation.
      - Exact order re-count of both Koblitz siblings before use.
    required_metrics:
      - by-non-membership share of unsatisfiable attempts, per curve and base (CP95)
      - per-attempt mean cost, V_T versus V (oracle root-findings, field operations)
      - on-curve relations lost by the restriction (count)
      - share on the ordinary curve and the random subset

  falsification_conditions:
    - 'E-FILTER falsified iff the by-non-membership share on the Koblitz sibling is <= 0.10 (verified classifier).'
    - 'E-NULL falsified iff that share is >= 0.10.'
    - 'The restriction is falsified iff any on-curve relation over V is lost, or any V_T relation fails curve verification.'
    - 'The effect is a size artifact iff the size-matched random subset shows the same reduction within CP95.'
    - 'A membership identity error (any x with Tr(x) + Tr(1/x) + Tr(a) = 0 that does not lift, or vice versa) voids the derivation and the record.'

  confounders:
    - >-
      Whether the ordinary index-calculus builder already samples on-curve is
      the whole question; if it does (E-NULL, likely from oracle A), the filter
      is a re-derivation of existing practice and the honest finding is a
      closure of the seam item, not a gain.
    - >-
      x = 0 (the 2-torsion x-coordinate) has Tr(0) undefined for 1/x; it is a
      separate stratum, excluded from V_T, and recorded.
    - >-
      The a = 1 sibling's membership condition differs by the constant Tr(a);
      both a are run so the constant is not conflated with the 1/x term.
    - One field, one V; the ordinary curve is the only non-Koblitz control at this size.

  interpretation_limits:
    - Toy tier; n = 17, m = 2. Nothing about m >= 3, cost on ECC2K-130, or F4.
    - The filter is a curve-membership restriction on legs, not a group quotient; it makes no security or exponent claim.
    - >-
      KN-OPEN-020 class: implicit-membership-cheap; not escaped.
    - The likely outcome is E-NULL (oracle A already restricts), in which case the value is a measured closure of the seam item, not a speedup.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Balance of the membership set.) The membership condition
        Tr(x) + Tr(1/x) + Tr(a) = 0 holds for a fraction 1/2 + o(1) of nonzero
        x in V as l grows, so |V_T| is about |V|/2 and the removable
        unsatisfiable share is about half of the by-non-membership column.
      rigorous_support: >-
        Exactly half of F_{2^n}^* lifts to the curve (the other half to the
        twist), a standard fact; the heuristic is only that the SUBSPACE V
        samples the two halves in near-equal proportion, imitating
        equidistribution of a trace-type functional over a linear family
        (checkable directly by counting on V without the curve).
      validation_plan: >-
        SAMPLE |V_T| exactly on V for l = 6..9 at both a; COMPARE the ratio
        |V_T|/|V| to 1/2; TAIL: the largest deviation across l. TRANSFER: none.

  heuristic_note: The membership identity is exact; H1 concerns only the size of V_T, computable without the curve.

  target_complexity:
    time_exponent: >-
      No exponent claim. Per attempt the membership filter changes the ATTEMPT
      MIX (removes by-non-membership unsatisfiable attempts) at O(1) precompute
      per slot; the solve exponent is unchanged. On ECC2K-130 the m = 3 row
      stays closed by the product law regardless of the mix.
    memory_exponent: Unchanged; one bit per slot for the membership flag.
    best_known: Rho at 2^60.81 on ECC2K-130; oracle A at 2^l root-findings per attempt at the cell.
    hidden_overhead: The inversion in the membership test; O(1) per slot, precomputed once.
    tradeoff_note: Not applicable; a precompute filter, embarrassingly parallel across slots and attempts.

  estimated_cost:
    implementation: low
    compute: low
    qualification: Estimate. About 150 lines (Koblitz coefficients in oracle A, membership precompute, unsat-reason classifier); about 1 CPU-hour on 200 attempts x 3 curves.

  asymptotic_claim:
    problem: Per-attempt attempt-mix on Koblitz prime-degree siblings (RQ-CERTBIN-836ce2)
    prior_best: Ordinary index calculus with unrestricted subspace V; no measured by-non-membership share in this program
    time_exponent: unchanged (attempt-mix constant, not an exponent); total ECDLP cost on ECC2K-130 unchanged and closed at m <= 3 by the product law
    memory_exponent: unchanged
    hidden_cofactor: the inversion in the membership test, O(1) per slot
    claim_kind: factor_base_restriction_plus_attempt_mix_measurement

  dominated_by: >-
    Checked row by row. At the cell: oracle A and rho dominate; the filter
    changes a constant in the attempt mix, not the dominant term. At
    ECC2K-130: rho at 2^60.81 dominates every m <= 3 oracle by the product law.
    The record dominates nothing; n/a (no attack claimed). If E-NULL holds the
    "gain" is zero by construction and the record is a closure.

  sota_delta:
    time: >-
      Zero on ECDLP axes. Against prior state: the re-derived Koblitz
      membership functional as a factor-base filter and the first measured
      by-non-membership share at the CERTBIN cells.
    memory: Zero.
    data_queries: Not applicable.

  frontier_check:
    status: pending
    note: >-
      The point-decompression lift condition is textbook (recalled); whether
      trace-membership has been used as an explicit factor-base filter with a
      measured removed-attempt share in the index-calculus literature was not
      checked. No web search was run.

  recommended_priority: medium
  priority_rationale: >-
    Cheap and sharply falsifiable, and either outcome is useful: E-FILTER
    corrects a cost law the program uses, E-NULL closes the seam item with a
    measured obstruction (the builders already restrict). Not high because the
    honest prior is E-NULL (oracle A root-finds on the curve) and because even
    a full half-column removal cannot move the product-law verdict on
    ECC2K-130. Ranked within CERTBIN, below exponent-targeting ECC work.

  first_deliverable: >-
    The re-derived membership identity (delivered here) and the E-NULL
    inspection of oracle A's sampling (step 1), which alone may close the seam
