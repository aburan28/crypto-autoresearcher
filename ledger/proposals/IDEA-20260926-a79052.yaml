idea:
  id: IDEA-20260926-a79052
  question_id: RQ-CERTBIN-836ce2
  added: '2026-09-26'
  status: proposed
  approved_by: null
  title: >-
    TRACE-CONDITIONED FACTOR BASES ON KOBLITZ SIBLINGS: x is an x-coordinate
    iff Tr(x) = Tr(1/x) + Tr(a) (re-derived here), so restricting V to that
    membership set doubles the fraction of factor-base slots that lift to real
    points and removes every unsatisfiable-by-non-membership attempt; measured
    as a per-attempt refutation-share and sat/unsat cost shift on the n = 17
    Koblitz sibling against the ordinary RC-1 curve
  class: representation

  claim: >-
    CEILING FIRST. m = 2, toy tier; oracle A and rho dominate the cell, so
    sota_delta is zero and no exponent moves. The record bears on arity m = 2
    (and, as a free filter, on any m) through the ATTEMPT MIX, not the
    per-attempt solve exponent, and on ECC2K-130 only via the product law: even
    halving the unsatisfiable share leaves the m = 3 free-oracle floor at
    2^68.58 against rho's 2^60.81 (KN-FIND-aa2efc), so the challenge is
    untouched; the deliverable is a corrected cost law at toy n and a named
    building block for the m >= 5 rows.

    THE MEMBERSHIP IDENTITY, RE-DERIVED. On E : y^2 + xy = x^3 + a x^2 + b over
    F_{2^n} with b != 0, put y = x z: x^2 z^2 + x^2 z = x^3 + a x^2 + b, divide
    by x^2, z^2 + z = x + a + b/x^2. This has a solution z in F_{2^n} iff
    Tr(x + a + b/x^2) = 0. Since Tr(u^2) = Tr(u), Tr(b/x^2) = Tr((sqrt b / x))^2
    = Tr(sqrt(b)/x), and for b = 1 that is Tr(1/x). So on a Koblitz sibling
    y^2 + xy = x^3 + a x^2 + 1 a nonzero field element x is the x-coordinate of
    a curve point iff Tr(x) = Tr(1/x) + Tr(a); for a = 0 this is exactly the
    BRIEF's Tr(x) = Tr(1/x), for a = 1 it is Tr(x) = Tr(1/x) + 1. Exactly half
    the nonzero field elements satisfy it (the twist takes the other half),
    since x -> Tr(x + a + 1/x^2) is a nonconstant F_2-affine-in-Tr functional of
    a balanced argument. THE TRACKED OBJECT is the factor base
    V_T = { x in V : Tr(x) = Tr(1/x) + Tr(a) }, the standard subspace V
    intersected with the (nonlinear, because of 1/x) membership set. It is NOT
    an F_2-subspace: 1/x is not additive, so V_T is a subset of V cut out by a
    degree-(2) rational condition, which is why it escapes nothing in
    KN-OPEN-020 and is priced as a target-independent membership test.

    WHAT IT BUYS, STATED AS A REFUTATION-SHARE. In the ordinary index-calculus
    convention a factor-base slot x in V is used whether or not it lifts to a
    point; a decomposition attempt that fixes m-1 slots off the curve is
    unsatisfiable BY NON-MEMBERSHIP and contributes to the unsatisfiable column
    that seam G2 says dominates per-attempt cost. Restricting to V_T removes
    that entire class of unsatisfiable attempts for FREE (the membership test is
    a half-trace and one field inversion per slot, O(1), computed once per slot
    in a precompute pass). The prediction: on the Koblitz sibling the fraction
    of unsatisfiable attempts that are unsatisfiable-by-non-membership (as
    opposed to unsatisfiable-because-the-sum-is-not-the-target) is measured, and
    V_T's per-attempt mean cost is lower than V's by exactly that fraction times
    the per-attempt solve cost, with the SOLUTION SET of satisfiable attempts
    unchanged (a completeness check: every relation over V_T is a relation over
    V, and no relation over V uses an off-curve slot). Representation class R1;
    attack stage: relation collection AND the per-attempt solve, through the
    attempt mix.

    THE TWO READINGS. E-FILTER: the membership condition removes a
    measurable and near-half share of unsatisfiable attempts, so V_T's sat/unsat
    attempt ratio is about double V's and its per-attempt mean cost drops
    correspondingly, on the Koblitz sibling and NOT on the ordinary curve of the
    same size, where the same test cuts V to its own random-looking half with no
    curve-aligned meaning. E-NULL: the ordinary index-calculus builders in this
    program ALREADY sample only on-curve x (they lift each slot to a point before
    use), so V_T = V's effective base already, the removed class is empty, and
    the filter buys nothing. Both are decidable by reading which x the RC-1
    oracle A actually enumerates and by the measured shares; E-NULL is the honest
    prior, because oracles_rc1.py's oracle A already root-finds x_2 on the curve.

  mechanism: >-
    OBJECT FRAME. Representation R1 (x-coordinate in F_{2^n}). Operation set
    Sigma: translation by factor-base elements (Class I partial action), plus
    the point-lift membership map x -> (x, y) which is the curve's own
    structure, NOT a group action on the target subgroup. TRICHOTOMY:
    COORDINATE-DEPENDENT for the membership object: whether a candidate x is
    retained depends on the representation's ability to test Tr(x) + Tr(1/x) +
    Tr(a), a property of the field element and the curve coefficients, not of
    any group element; the relation vector itself stays Class I partial-action.
    LOSSY-PROJECTION TEST against Sigma: the map x -> (in V_T or not) discards
    the value of x and keeps one bit (membership); it is Sigma-compatible in the
    weak sense that translation by an on-curve factor-base element preserves
    on-curve-ness of a SUM but NOT of an individual off-curve slot, which is
    exactly why the filter acts on LEGS (individual slots) and never on TARGETS
    (which are on-curve subgroup points by construction) -- the same
    leg-versus-target split IDEA-20260922-153a90 proves is forced. It is lossy
    because half of V collapses to "excluded". It is not a change of coordinates
    because the retained set V_T has a different size and a different
    decomposition yield than V, measurably. WHY THIS IS NOT A GROUP-STRUCTURE
    CLAIM: no relabelled Z/NZ control is needed because the condition is about
    curve membership of a coordinate, not about a quotient of the group; the
    membership half of IDEA-20260922-1b16d7's trace-parity lever is the E/2E
    coset bit Tr(x) + Tr(a), a DIFFERENT functional from this record's
    Tr(x) + Tr(1/x) + Tr(a), and this record states the difference explicitly:
    1b16d7 confines to a parity CLASS of on-curve points; this record decides
    on-curve-ness itself.
    OFF-LIMITS COMPONENT (docs/object-frame-ideation.md section 2): F2 is the
    family; the factor base is the standard subspace intersected with a
    target-independent membership condition, inside KN-OPEN-020's
    implicit-membership-cheap class (the test is O(1) per slot); nothing here
    escapes KN-OPEN-020 and the record says so. What is added beyond F2: the
    explicit re-derived Koblitz membership identity and its use as a
    precompute filter with a measured refutation-share, which no filed record
    states for the CERTBIN cells.

  novelty_status: unverified

  origin:
    kind: generator_search
    date: '2026-09-26'
    scope: >-
      TASK-20260926-aa3c9f, seam G2 item "trace-conditioned factor bases (on
      Koblitz y^2 + xy = x^3 + 1, x is an x-coordinate iff Tr(x) = Tr(1/x):
      re-derive this before using it)". Under RQ-CERTBIN-836ce2 (R2 rule): a
      measured decomposition mechanism on a prime-degree Koblitz sibling with
      the CERTBIN instruments and the ordinary curve as control.
    overlap_review: >-
      Grepped ledger/proposals for "Tr(1/x)", "trace-conditioned",
      "trace-parity", "2-torsion" and read the nearest in full:
      IDEA-20260913-cedd2f and IDEA-20260922-1b16d7 use pi(P) = Tr(x_P) +
      Tr(a), the E/2E COSET map on ON-CURVE points, as a yield/confinement
      lever; that functional is Tr(x) + Tr(a), which this record's membership
      functional Tr(x) + Tr(1/x) + Tr(a) is NOT (the 1/x term is what tests
      lift-ability rather than parity). IDEA-20260915-3119c9 aligns V to
      {Tr(x) = Tr(a)} by searching affine slices; again the parity functional,
      not the membership one, and it searches over subspaces rather than
      intersecting with a nonlinear condition. No record uses Tr(x) = Tr(1/x)
      as a membership test or measures a removed unsatisfiable-by-
      non-membership share. IDEA-20260922-6237e5 (HOLD-V) considers a
      DP-versus-decomposability correlation but preregisters its own null.

  citations:
