      verified_by: idea-generator, this session, file read in full.
    - ref: >-
        Menezes, Applications of finite fields / standard binary-curve point
        compression: x lifts to a point iff Tr(x + a + b/x^2) = 0 (recalled)
      provenance: recalled
      claim: >-
        RECALLED, NOT RETRIEVED. The lift condition is textbook point
