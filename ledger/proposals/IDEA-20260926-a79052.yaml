        classifies on-curve points, and it is the membership HALF that this
        record's identity concerns.
      verified_by: idea-generator, this session, record read in full.
    - ref: IDEA-20260913-cedd2f
      provenance: internal
      claim: >-
        The halving criterion and pi as a group homomorphism (via
        Fong-Hankerson-Lopez-Menezes and Pornin, retrieved by that record);
        the parity functional Tr(x_P) + Tr(a), distinct from the membership
