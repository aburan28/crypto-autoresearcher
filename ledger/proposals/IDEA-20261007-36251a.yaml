idea:
  id: IDEA-20261007-36251a
  question_id: RQ-OAKLEY-264353
  status: proposed
  added: '2026-10-07'
  approved_by: null
  title: >-
    Fixed-cardinality subspace sweep on the quintic tower: subfield versus
    Frobenius-stable versus trace-structured versus random V at |F| equal 2^p
  class: representation
  claim: >-
    On sibling curves E over F_{2^{5p}} with a equal 0 and b outside F_{2^p},
    at p in {5, 7}, for the four p-dimensional F_2-subspaces V of F_{2^{5p}}
    (Vsub equal the subfield F_{2^p}; Vstab equal a Frobenius-stable non-subfield
    V; Vtr equal a trace-structured V; Vrand equal a uniform random V) with
    factor base F equal {P : x(P) in V}, the yield per charged second of the
    five-point Gaudry-Diem step differs between the best and worst V class by
    a factor of at least 2, measured with failures, timeouts, preprocessing
    and memory all charged; the subfield is not assumed best, and either
    direction, including no measurable difference, satisfies the claim.
  mechanism: >-
    OBJECT FRAME. Representation: R1, the point x-coordinate written in a
    recorded tower basis of F_{2^{5p}} over F_2, with factor-base membership
    imposed as explicit F_2-linear equations (sigma^p(x) equal x for Vsub;
    the divisor-kernel equations of T^{5p}-1 for Vstab; one trace-linear form
    for Vtr; p dense linear forms for Vrand). Operation set Sigma: translation
    by factor-base elements only, the relation vector propagating by appending
    one coordinate. TRICHOTOMY: Class I, partial-action, as index calculus
    always is; the branching event is whether R decomposes over the given V.
    LOSSY-PROJECTION TEST against Sigma: the tracked object is the relation
    vector in F_2^{|F|}, discarding the group element and all non-member
    coordinates, compatible with translation by factor-base points; passes,
    and it is genuinely lossy (2^{|F|} vectors versus ~2^{5p} points).
    KN-OPEN-020: all four V are linear subspaces, inside the scoped-out class;
    no escape is claimed and the record stops there. THE MECHANISM. V shape
    controls three charged quantities at once: (i) the product-space dimension
    dim V^2, which sets the descended degree and equation count of the
    Weil-restricted S_6 system; (ii) the Frobenius-orbit multiplicity of
    relations, which divides the number of systems to solve when V is stable;
    (iii) the membership-predicate cost, field-like linear for Vsub and Vstab
    versus dense linear for Vrand. WHAT IS ADDED beyond Semaev, Gaudry-Diem,
    KR-IC-73db3f, KR-IC-b0fcda and the two Oakley siblings: a four-way
    comparison at FIXED |F| on the quintic-tower object itself, with
    size-matched random V as a built-in arm rather than a post hoc control,
    so subspace folklore becomes a measured factor or an explicit none.
  novelty_status: unverified
  citations:
    - ref: IDEA-20260922-af7396
      provenance: internal
      claim: >-
        Oakley endpoint parameters, the chained-S_3 SAT pricing, the 1/5!
        attempt heuristic H2, and the sibling-ladder construction this sweep
        reuses for its cells.
      verified_by: 'Pasted task context of RQ-OAKLEY-264353 brief; not independently retrieved in this session'
    - ref: IDEA-20260922-70a67c
      provenance: internal
      claim: >-
        The S_5-symmetrised S_6 Groebner constant K_5 framing and the exact
        2-torsion derivation showing sqrt(b) outside F_{2^p} blocks the D/16
        reduction on both Oakley curves.
      verified_by: 'Pasted task context of RQ-OAKLEY-264353 brief; not independently retrieved in this session'
    - ref: IDEA-20260922-c48e7d
      provenance: internal
      claim: >-
        Frobenius-stable subspace dimensions are characterised by divisors of
        T^m-1; stable V exists at IC-natural dimensions on most but not all
        binary degrees, and stability never touches solving cost.
      verified_by: 'Pasted task context of RQ-OAKLEY-264353 brief; not independently retrieved in this session'
    - ref: >-
        Galbraith, Granger, Merz, Petit on Frobenius-invariant factor bases
        (recalled pointer, unopened)
      provenance: recalled
      claim: >-
        Recalled only: tau-stable factor bases cut the number of systems by up
        to 1/n with an n^2 linear-algebra speedup; exact scope unchecked.
      verified_by: null
  assumptions:
    - >-
      Sibling cells: E over F_{2^{5p}}, p in {5, 7}, irreducible degree-5p
      binary modulus fixed per cell and recorded, tower basis recorded, a
      equal 0, b sampled uniform from F_{2^{5p}} minus F_{2^p} with rejection
      recorded, prime-order subgroup found by BSGS with order recorded. No
      instrument-friendly substitution: the same object at smaller q.
    - >-
      Endpoint parameters relayed from the siblings: Third Oakley Group
      f equal u^155+u^62+1, b equal 0x7338f, subgroup r 152-bit; Fourth
      Oakley Group f equal u^185+u^69+1, b equal 0x1ee9, subgroup r 183-bit.
    - >-
      Unconditional comparison audit: the factor-2 claim is decided by charged
      measurement at p in {5, 7}; transfer to p equal 31, 37 is extrapolation
      under H1 and H2, labelled as such wherever quoted.
  proof_search_map:
    bottleneck: >-
      The per-relation charged cost as a function of V shape: decomposition
      probability times per-attempt solver cost times membership overhead, all
      charged. No single unmeasured lemma blocks the comparison.
    baseline_embedding:
      parameter_slice: >-
        Vsub equal F_{2^p} at p in {5, 7} with the chained-S_3 WDSat figures
        of IDEA-20260922-af7396 as the reference arm; every other V is priced
        against it on identical target bytes.
      reproduction_check: >-
        Reproduce the Vsub decomposition-probability estimate against exact
        4-loop enumeration at p equal 5 before any Vstab, Vtr or Vrand cell is
        trusted.
    observation_collision:
      observable: >-
        Yield per charged second per V class, decomposed into attempt count,
        success count, solver conflicts, and membership time, so a total is
        never the only number.
      distinct_preimage_search: >-
        A high Vstab yield comes both from genuine orbit multiplicity and from
        double-counting Frobenius-conjugate relations as distinct; discriminate
        by canonicalising relations under Frobenius before counting, and a
        yield that collapsides under canonicalisation is the artifact branch.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace 'which factor base for the tower' by a four-arm horse race
          at fixed |F| with canonicalised counting.
        predicted_gain: >-
          Converts subspace folklore into a measured factor with a named
          winner, or an explicit none, feeding the Coordinator decision item
          (2) directly.
    quantifier_order: >-
      FORALL p in {5, 7}, FORALL b outside F_{2^p}, FORALL four V classes at
      dimension p: the best-to-worst charged-yield ratio is measured; EXISTS a
      class ordering stable across p is the hoped-for but unassumed outcome.
    method_ceiling:
      strongest_certifiable_claim: >-
        'At m equal 25 and 35 on this tower shape, V class X beats V class Y
        by factor Z per charged second, with decomposition-probability and
        solver-cost components stated separately.' Nothing about p equal 31,
        37 beyond H1/H2 extrapolation, nothing about non-linear factor bases.
      nearby_object_control: >-
        PROVES-TOO-MUCH: the same four-arm protocol at t equal 3 must
        reproduce the known direction that structured V helps modestly; if it
        reports a factor above 8 at t equal 3, the charging is wrong, not the
        curve.
    proof_obligations:
      - claim: Membership predicates are F_2-linear for all four V classes.
        responsibility: correctness
      - claim: Canonicalised relation counts per V class at p in {5, 7}.
        responsibility: correctness
      - claim: Charged-yield ratio best versus worst with error bars.
        responsibility: runtime
      - claim: Extrapolation boundary to p equal 31, 37 stated under H1, H2.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: best-to-worst charged-yield ratio across the four V classes
      direction: different
      minimum_effect: >-
        Ratio at least 2 at one of p equal 5, 7, or an explicit none with both
        ratios inside [0.7, 1.4] is reported as the none outcome.
    - metric: decomposition probability per V class versus C(q+4,5)/N
      direction: different
      minimum_effect: >-
        Agreement within a factor 2 for Vrand and Vsub at p equal 5; any class
        deviating by more than a factor 4 names a structural cause or
        withdraws H1 for that class.
    - metric: descended-system max degree per V class after Weil restriction
      direction: lower
      minimum_effect: >-
        At least one non-subfield class shows strictly lower max degree than
        Vsub on identical targets, or the degree table is published as equal.
    - metric: shape-matched random Boolean null-object yield fit
      direction: different
      minimum_effect: >-
        Null shows no V-class ordering correlated with the true ordering; a
        null that reproduces the ordering voids the structural reading.
  minimal_test:
    design: >-
      Build sibling cells p in {5, 7} with recorded moduli, bases, b values
      and subgroup orders. For each of 20 random prime-order targets per cell,
      attempt five-point decomposition over each of the four V classes with
      the chained-S_3 WDSat instrument on identical target bytes, charging
      conflicts, wall time, peak RSS, timeouts at a fixed conflict cap, and
      membership-predicate time separately. Canonicalise relations under
      Frobenius before counting. Fit per-class yield per charged second with
      binomial error bars; publish the degree tables of the descended systems.
    controls:
      - size-matched random subspace Vrand as a built-in arm, not a post hoc check
      - shape-matched random Boolean system at each cell with identical variable, equation, degree and XOR-density profile
      - Groebner-versus-SAT identity on same instance bytes at p equal 5 (outcome agreement before cost comparison)
      - Frobenius-canonicalised versus raw relation counts (double-count control)
      - non-decay check: any quantity claimed as V-structure must decay when V is replaced by Vrand
    required_metrics:
      - successes, attempts, timeouts and conflicts per V class per cell
      - wall-clock and peak RSS per attempt, charged including failures
      - membership-predicate time share per V class
      - descended-system degree tables per V class
      - null-object fit statistics and ordering correlation
  falsification_conditions:
    - Best-to-worst ratio inside [0.7, 1.4] at both p values: the sweep reports an explicit none and the RQ keeps Vsub by default.
    - Vrand beats every structured class by more than a factor 2: the structuring hypotheses behind Vstab and Vtr are withdrawn for this tower.
    - The null object reproduces the measured V ordering: the effect is instance shape, not curve or subspace structure.
    - Identity control disagrees (SAT versus UNSAT mismatch on same bytes at p equal 5): the instrument, not V, is at fault and no yield is reported.
  confounders:
    - WDSat variable-order heuristics may favour the sparser Vsub encoding; fix two orders and report both.
    - Timeout-cap choice truncates exactly the hardest class; report the full conflict distribution, not just means, and vary the cap once.
    - p equal 5 coincides the tower degree with the decomposition number; flag it and weight p equal 7 for the ratio claim.
    - Random-b sampling may hit a structured b; record b minimal-polynomial degrees and retest any outlier cell with a second b.
  interpretation_limits:
    - Every number is at m equal 25 and 35; p equal 31, 37 statements are extrapolations under H1 and H2.
    - A V-class winner here decides the factor base for the tower ladder only; it moves no exponent and claims no attack.
    - Nothing here bears on deployed-system security; RFC2409 EC2N groups are withdrawn objects.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For each fixed V class, the charged cost per attempt scales as
        q^{alpha_class} with alpha_class stable across p in {5, 7} and
        extending to p equal 31, 37.
      rigorous_support: >-
        Weil-restriction degree bounds fixing the descended-system shape
        independent of q, imitating the uniform-random Boolean system model in
        which solver cost at fixed shape is q-independent up to the
        membership-linear part.
      validation_plan: >-
        Fit alpha per class across p equal 5, 7 on 20 targets each; tail
        check: per-target costs within a factor 4 of the class median at each
        p; transfer to p equal 31, 37 explicit extrapolation.
    - id: H2
      statement: >-
        A uniform target decomposes over V with probability C(q+4,5)/N,
        independent of V class up to the measured class factor.
      rigorous_support: >-
        Expected-count identity for sums of independent uniform points,
        imitating the Poisson occupancy model for the number of
        representations.
      validation_plan: >-
        Exact 4-loop enumeration at p equal 5 per V class compared with 1 minus
        exp(-lambda); tail check: zero-success targets consistent with the
        Poisson lower tail, not clustered.
  target_complexity:
    time_exponent: >-
      Gaudry fixed-n heuristic O~(q^{2-2/5}) equal O~(q^{1.6}) per relation
      stage in q equal 2^p, unchanged by this idea; V choice moves only the
      leading constant and the charged yield factor.
    memory_exponent: >-
      Solver working memory polynomial in 20p plus the relation matrix with
      2^{p-1} rows of weight 5; unchanged in exponent across V classes.
    best_known: >-
      Parallel rho at the subgroups, 2^{75.8} and 2^{91.3} with negation only,
      and the GHS comparator of IDEA-20261007-a84eb9; this idea challenges neither
      and prices the factor base beneath both.
    hidden_overhead: >-
      Membership-predicate constants and WDSat per-conflict cost are measured
      and charged, not hidden; nothing resides in an o(1).
    tradeoff_note: >-
      Embarrassingly parallel over targets and V classes; no time-memory
      tradeoff is claimed.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  dominated_by: >-
    As an attack: dominated by parallel rho at both endpoints and by the GHS
    comparator wherever GHS applies; no attack is claimed. As a measurement:
    dominated by nothing on this object, the fixed-|F| four-way comparison on
    the quintic tower is absent from the corpus after checking every
    index-calculus row of the pasted map.
  sota_delta: >-
    Zero on every ECDLP cost axis. Against program state: first charged
    number selecting the factor base for the tower ladder, or an explicit
    none retiring subspace choice as a decision variable.
