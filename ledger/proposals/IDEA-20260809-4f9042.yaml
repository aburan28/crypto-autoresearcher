idea:
  id: IDEA-20260809-4f9042
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ROS-595c15
  goal_id: GOAL-ROS-001
  title: >-
    Ablate the multi-nonce construction to one nonce and watch the protocol fall
    back into ROS — the certificate that shows what the second nonce is buying
  class: mechanism
  claim: >-
    Two-round multisignature security rests on combining several nonces per signer
    with coefficients derived from the transcript. The claim is that reducing the
    nonce count to one in an otherwise identical reference implementation restores
    exactly the linear structure the ROS solver exploits, that a literal forgery
    follows, and that the forgery's cost as a function of the nonce count is a
    direct measurement of what the construction buys — a quantity currently
    expressed only as a proof.
  mechanism: >-
    Implement the protocol with the nonce count as a parameter. At one nonce the
    aggregate nonce is a fixed linear combination of per-session values and the
    ROS system becomes solvable; at two or more, the transcript-derived
    coefficients break the linearity. Sweep the parameter and measure.
  why_not_a_renamed_known_approach: >-
    That the multi-nonce trick is what defeats ROS is the design's stated purpose.
    Turning the design parameter into an experimental knob and MEASURING the
    forgery cost across it is different from citing the theorem, and it produces
    a certificate for the degenerate case that an implementer can be shown.
  predictions:
  - observable: forgery cost versus nonce count
    metric: cost at nonce count one, two, three
    predicted: Feasible at one, infeasible within the declared budget at two and above. Feasibility at two would be a major finding requiring immediate independent re-verification before any record is written.
  - observable: whether the coefficient derivation must be transcript-dependent
    metric: forgery cost with fixed rather than transcript-derived coefficients
    predicted: Fixed coefficients restore feasibility even at two nonces, isolating transcript dependence rather than nonce count as the load-bearing property.
  minimal_test: >-
    Reference implementation with nonce count and coefficient derivation as
    parameters; forgery attempts at each setting with declared budgets;
    certificates emitted where found and verified independently.
  controls:
  - 'HONEST-PATH CONTROL at every parameter setting: the protocol must produce valid signatures honestly before any forgery attempt at that setting.'
  - 'BUDGET DECLARATION: infeasibility is always relative to a pre-declared budget (AGENTS.md rule 3).'
  falsification_conditions:
  - No forgery even at one nonce, which would mean the ablation does not restore the structure and the mechanism account is wrong.
  - Fixed coefficients do not restore feasibility, contradicting the attribution to transcript dependence.
  interpretation_limits: >-
    Every certificate is against a deliberately ablated reference implementation
    and is labelled as such in the record title. No claim is made about the
    published protocol, which the ablation is designed to differ from.
  sota_delta: 'No attack on any protocol. Delta: a measured cost gradient across a design parameter that is otherwise justified only by a proof.'
  dominated_by: Downstream of IDEA-20260809-47bb6d; not dominated by any corpus record.
  estimated_cost: Implementation medium; compute moderate.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for MuSig / multisignature: no records. WEB NOT CHECKED.'
  source_refs:
  - MuSig2 and related two-round multisignature references -- RECALLED, REQUIRED READS.
