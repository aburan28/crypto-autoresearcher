  lossy_projection_identifiability_audit:
    projection: >-
      A complete mathematical result -- statement, proof, constants, context --
      is projected to the tuple (input type, output type, quantifier order,
      uniformity, charged precomputation, probability space).
    what_is_discarded: >-
      The entire proof, every constant, the techniques, and the theorem's
      truth. The audit deliberately never asks whether either result is correct.
    why_genuinely_lossy: >-
      Astronomically many-to-one: every correct result and every incorrect result
      with the same interface share a projection value, so the projection carries
      no information about validity at all. That is a feature here, because the
      question under audit is whether two results are ABOUT THE SAME THING, which
      is a property of the interface and not of the proofs.
    why_compatible_with_the_operations: >-
      The operation performed on results in this goal is COMPOSITION -- Corollary
      1.2 composes Theorem 1.1 with the reductions of [35]; the audit composes a
      claimed EndRing solver with the same reductions. Composition depends on the
      interface and on nothing else that the projection discards, so the retained
      part propagates deterministically under exactly the operation being applied.
      This is the strongest form of the compatibility condition.
    is_it_only_a_change_of_coordinates: >-
      NO, and the failure mode checked for FIRST here is the MIRROR one --
      constancy -- because "all theorems have an input and an output" is very
      nearly a constant projection and would have zero comparator spread. THE
      CHECK: the projection is non-constant on the specific pair under audit
      precisely if the leading hypothesis of PART B is right, i.e. if one GIVEN
      is a curve and the other is an order. So the comparator spread is the
      finding rather than a precondition for it -- and that is why the audit's
      outcome space is a trichotomy in which (c) is the case where the projection
      IS constant across the pair. Outcome (c) would mean the two results really
      are about the same interface, which is exactly when the audit stops being
      bookkeeping and becomes the most important record in the corpus. The
      first failure mode (a change of coordinates, nothing discarded) does not
      arise: the proofs are discarded entirely and are not recoverable.

  assumptions:
    - >-
      That the reductions of [35] and [33], as described by the frozen paper, are
      probabilistic polynomial time with no super-polynomial precomputation and
      no GRH dependence that would break the composition. THIS IS NOT SAFE: this
      goal's own H-WESO-001 already records, as a non-fatal defect found by
      earlier review, that Corollary 1.2 cites a Proposition 8.5 of [35] that
      does not exist and silently imports GRH. The composition argument of PART A
      therefore carries that caveat explicitly, and checking it is a stage rather
      than an assumption.
    - >-
      That the retrieval channel behaves as the angle brief measured it. Re-
      measured at stage 0; if it has changed, the retrieval plan is re-costed
      before anything else runs.

  predictions:
    - metric: >-
        trichotomy_verdict: which of (a) the GIVEN differs, (b) the OUTPUT
        differs, (c) neither differs, is supported by the retrieved text of
        ePrint 2026/1586
      direction: different
      minimum_effect: >-
        A single verdict with the deciding sentence quoted verbatim and located.
        PRE-REGISTERED PRIOR, recorded before retrieval so it cannot be adjusted
        afterwards: 0.75 on (a), 0.20 on (b), 0.05 on (c). If the verdict is (c)
        the finding is automatically routed as a claimed break of standardised
        schemes, which under AGENTS.md rule 12 requires review-breakthrough at
        max -- a tier this harness cannot supply -- so the honest disposition of
        (c) is ESCALATION, not a conclusion, and that is fixed here in advance.
    - metric: >-
        retrieval_status: HTTP status and channel for arXiv 2607.14624 (abstract
        and PDF), ePrint 2026/1586 (abstract and PDF), and a search for the
        published forms of [43] and [10]
      direction: different
      minimum_effect: >-
        PRE-REGISTERED FROM THE ANGLE BRIEF'S MEASUREMENT: arXiv abstract 200,
        arXiv PDF 200, ePrint abstract 200, ePrint PDF 403. Any departure means
        the network policy has changed since that measurement and the plan is
        re-costed. This prediction exists so that "the source could not be
        obtained" becomes a measurement with a status code rather than an
        assertion -- which matters, because this program has at least one goal
        whose pause condition rested on a source-availability claim the same
        brief found to be partly false.
    - metric: >-
        theorem_1_5_fidelity: whether arXiv 2607.14624's own statement of the
        bound matches the frozen paper's Theorem 1.5, including every hypothesis
      direction: different
      minimum_effect: >-
        FORCED EXPECTATION: faithful, with the bound (p/2)^{1/3} and no
        hypothesis beyond supersingularity over F_{p^2}. A dropped hypothesis --
        for example a restriction on p mod something, or a bound on the
        MINIMAL rather than the smallest CYCLIC degree -- would change anchor
        (A2) of IDEA-20260805-07ff43 and therefore a derived exponent, and would
        be the highest-value outcome of this proposal after (c).
    - metric: >-
        null_verdict: the same audit protocol applied to [10]
      direction: different
      minimum_effect: >-
        FORCED VALUE "faithfully represented, no dropped hypothesis". This null
        can fail and its failure invalidates the protocol's other findings. It is
        the sensitivity demonstration in reverse: it establishes that the audit
        does not manufacture discrepancies.
    - metric: >-
        loadbearing_discrepancy_rate: the fraction of audited citations, ordered
        by how load-bearing they are for this goal's conclusions, on which a
        material discrepancy is found
      direction: different
      minimum_effect: >-
        Reported as a graded readout over at least four citations ([10] as the
        null, then [43], then 2026/1586, then [4] as the most load-bearing),
        with the discrepancy rate as a function of position in that ordering. A
        rate that is flat across the ordering says the audit measures paraphrase
        noise; a rate that rises with load-bearingness says something worse and
        more interesting. Either readout is a deliverable.

  minimal_test:
    design: >-
      Four stages, cheapest and most decisive first.
      U0 (minutes): re-measure the retrieval channel and record status codes.
      U1 (one hour, zero compute, and it can end the line): write out the PART A
      composition in full, including the [35] Proposition 8.5 defect this goal
      has already recorded, and confirm that the trichotomy is exhaustive. If the
      composition does not go through -- for example because the reductions carry
      a super-polynomial factor the frozen paper's summary hides -- the audit's
      whole framing collapses and the line ends here for the cost of an
      afternoon.
      U2 (hours): retrieve, in this order, [10] (the null, first, deliberately),
      [43], ePrint 2026/1586's abstract page, and arXiv 2607.14624. Run the
      identical protocol on each. Record verbatim statements.
      U3 (zero compute): the verdict, the graded readout, and the escalation
      decision if the verdict is (c).
    controls:
      - >-
        MATCHED NULL, FORCED VALUE, CAN FAIL: [10] Canfield-Erdos-Pomerance,
        audited by the identical protocol, with the pre-declared expected verdict
        "faithfully represented". Same shape as the treatment -- a cited theorem,
        paraphrased in the frozen paper, retrieved and compared. If the protocol
        flags it, the protocol is over-sensitive and nothing else it says counts.
      - >-
        POSITIVE CONTROL WHERE THE EFFECT MUST APPEAR: arXiv 2607.14624 must be
        found to contain a degree bound of the shape (p/2)^{1/3}, because the
        frozen paper quotes it. If the retrieval-and-extraction instrument cannot
        recover a statement we already know is present, the instrument is broken
        and NO "could not verify" report may be filed from that run. This turns
        an unverifiable negative into a checkable one.
      - >-
        ORDERING CONTROL: the null citation [10] is audited and its verdict
        recorded BEFORE ePrint 2026/1586 is retrieved. Auditing the exciting
        document first and the null afterwards would let the null be calibrated
        against the finding.
      - >-
        PRE-REGISTERED PRIOR: the (0.75, 0.20, 0.05) trichotomy prior is written
        into this record before any retrieval, so that the verdict can be scored
        rather than merely reported.
      - >-
        GRADED CONTROL, four ordered citations, monotonicity reported: the
        discrepancy rate as a function of load-bearingness.
    required_metrics:
      - URL, UTC timestamp, HTTP status, byte length and SHA-256 for every fetch attempt
      - the verbatim statement of each audited claim, with its location in the document
      - the filled quantifier skeleton (Q1, Q2, Q3) for each audited claim
      - the trichotomy verdict with the deciding sentence quoted
      - the null verdict on [10], recorded before the 2026/1586 retrieval
      - a statement of what the audit did NOT check, in particular that no proof was verified

  falsification_conditions:
    - >-
      The PART A composition does not go through. The trichotomy is not
      exhaustive, the audit's framing is wrong, and the line ends at U1.
    - >-
      The null verdict on [10] reports a material discrepancy. The protocol is
      over-sensitive; every other finding is withdrawn.
    - >-
      The positive control fails: the retrieval-and-extraction instrument cannot
      recover Theorem 1.5's bound from arXiv 2607.14624. No unverifiability
      report may be filed and the instrument must be repaired first.
    - >-
      ePrint 2026/1586 turns out not to exist, or not to make the reported claim.
      The angle brief's relay was wrong; that is recorded as a correction to the
      relay and the audit's second half proceeds unaffected.

  confounders:
    - >-
      THE ENTIRE PREMISE IS RELAYED. Everything said about 2026/1586 comes from a
      scouting brief that itself says it read only an abstract. If the relay is
      wrong the audit's first half evaporates. The design accounts for this by
      making the second half -- this goal's own three unread load-bearing
      citations -- independent of the relay and independently worth doing.
    - >-
      AUDIT ASYMMETRY. Finding a discrepancy in someone else's paper is cheap to
      produce and reads as rigour. This is the failure mode the matched null
      exists for, and it is the reason the null is audited first.
    - >-
      PARAPHRASE IS NOT ERROR. A paper legitimately states a cited theorem in the
      form it needs. The audit's threshold is MATERIAL discrepancy -- a dropped
      hypothesis, a changed quantifier, or a changed object -- and the threshold
      is declared before the run.
    - >-
      PDF EXTRACTION. With pdftotext absent and pypdf reported to crash on import
      in this container, extraction is by a zlib-plus-regex route that can drop
      or garble mathematics. Any statement recovered that way is marked as
      extracted rather than read, and a garbled extraction is an instrument
      failure, not a discrepancy.

  interpretation_limits:
    - >-
      NO PROOF IS VERIFIED BY THIS AUDIT AND NO RESULT IS DECLARED WRONG. The
      strongest admissible conclusion about 2026/1586 is a statement about its
      GIVEN and its OUTPUT as written, with the deciding sentence quoted. This
      record explicitly does not assert that the paper is incorrect, and the
      angle brief it relies on says the same.
    - >-
      NO EXPONENT MOVES AND NO ATTACK IS PROPOSED.
    - >-
      Verdict (c) is an ESCALATION, not a conclusion: a claimed break of
      standardised schemes requires review-breakthrough at max under AGENTS.md
      rule 12, that tier is non-degradable, and this goal's own record states it
      is unavailable in this harness. Pre-committing that here removes the
      temptation to soften a (c) verdict into something reportable.
    - >-
      A faithful-representation verdict on [4] does NOT validate Theorem 1.5; it
      validates only that the frozen paper reports it correctly. The theorem's
      own correctness is outside every scope in this proposal.
    - >-
      NO STATUS CHANGE to H-WESO-001, to any KN-LIT entry, or to GOAL-P13-001 is
      proposed or implied. Superseding a literature record is a Coordinator act
      and is not requested here.

  heuristic_assumptions:
    - id: HD-1
      statement: >-
        NONE IS LOAD-BEARING. The composition of PART A is a chain of stated
        reductions; the trichotomy is exhaustive by logic; the retrieval is a
        measurement. The only assumption is the one recorded under assumptions:
        that the reduction network is genuinely polynomial with no hidden
        precomputation, which this goal's own record already flags as defective
        in one citation and which is therefore a checked stage rather than an
        assumption.
      rigorous_support: n/a
      validation_plan: >-
        Stage U1 writes the composition out with the [35] Proposition 8.5 defect
        carried explicitly, and reports whether the chain survives it.

  target_complexity:
    time_exponent: >-
      n/a for this audit -- no algorithm is proposed and no exponent is moved.
      The exponents AT STAKE are p^{1/3+o(1)} (the frozen paper, conditional on
      Heuristic 1) against a relayed poly(log p) claim. If the audit's verdict is
      (c) the exponent at stake is the whole of isogeny-based cryptography; the
      pre-registered prior on that is 0.05 and the disposition is escalation.
    memory_exponent: >-
      n/a. Noted only that the relayed claim is described as a rank-4 CVP, whose
      memory is polynomial, so a (c) verdict would also erase the memory
      obstruction this goal spends most of its effort on.
    best_known: >-
      p^{1/3+o(1)} time and memory under Heuristic 1 (frozen paper, Theorem 1.1);
      p^{1/2}(log p)^{O(1)} unconditional with negligible memory
      (Delfs-Galbraith, as reported by the frozen paper).
    hidden_overhead: >-
      Not assessed; the audit does not reach any cost analysis. That ordering is
      deliberate: there is no point costing a pipeline whose input specification
      has not been established, which is the same discipline
      IDEA-20260805-e805b6 applies in another goal.
    tradeoff_note: n/a -- no algorithm.

  dominated_by: >-
    n/a (no result claimed, no algorithm proposed). On the QUESTION audited, the
    incumbent frontier is the frozen paper's own p^{1/3+o(1)}, which the relayed
    claim asserts it beats by an enormous margin. Rows checked, across time,
    memory and data/queries, for an existing refutation or confirmation of the
