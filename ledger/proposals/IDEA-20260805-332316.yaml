idea:
  id: IDEA-20260805-332316
  question_id: RQ-WESO-8aff57
  added: '2026-08-05'
  title: >-
    Audit the GIVEN, not the theorem: a quantifier-order and input-specification
    audit of the two mutually incompatible 2026 complexities for the supersingular
    endomorphism problem, with a matched null drawn from a citation known to be
    faithfully represented
  class: control

  claim: >-
    Two results dated within one fortnight of each other in 2026 assign
    complexities to essentially the same object that differ by an enormous
    margin. The frozen input of this goal proves OneEnd, EndRing and Isogeny in
    p^{1/3+o(1)} under Heuristic 1, and states that the p^{1/2} barrier "had
    stayed remarkably stable" since 2006. A second preprint, ePrint 2026/1586
    (Isyanov), is reported -- ABSTRACT ONLY, BODY NOT READ BY ANYONE IN THIS
    PROGRAMME -- to claim recovery of a Z-basis of End(E) and the exact Gram
    matrix in poly(log p) via rank-4 CVP. These cannot both describe the same
    problem. THE AUDIT'S OBJECT IS NEITHER PROOF: it is the GIVEN -- the input
    specification and the quantifier order of each statement.
    THE CENTRAL DERIVED FACT, which makes the audit decisive rather than
    exploratory: the frozen paper's own Corollary 1.2 obtains EndRing and Isogeny
    from OneEnd through the polynomial-time reductions it cites as [35, Theorem
    1] and [35, Proposition 8.5], within a network of equivalences it attributes
    to [23], [45], [35] and [33]. Therefore, IF 2026/1586's input is a
    supersingular j-invariant and its output is a basis of End(E) in poly(log p),
    THEN Isogeny is solvable in poly(log p) and the CGL hash, the SQIsign family,
    GPS, PRISM and (x)-MIKE are all broken outright, not merely re-parameterised.
    That consequence is FORCED by reductions the frozen paper itself relies on.
    So the audit has an exhaustive trichotomy as its pre-registered outcome
    space: either (a) 2026/1586's GIVEN is not j(E) -- most plausibly it is
    already a maximal order O, in which case the Deuring direction it computes is
    the easy one and it is not solving EndRing at all; or (b) its OUTPUT is not a
    Z-basis of End(E) in the sense the reductions require; or (c) isogeny-based
    cryptography is broken and every other item in this goal is moot. Exactly one
    of (a), (b), (c) holds. An audit whose outcome space is exhaustive by
    construction cannot return "inconclusive" for want of a verdict, only for
    want of the document.
    THE SECOND HALF, and the reason this is a control record rather than a
    literature errand: the SAME audit applied to this goal's OWN load-bearing
    citations. Anchor (A2) of IDEA-20260805-07ff43 -- and, more importantly,
    Theorem 1.5, without which the frozen paper's entire algorithm has no
    guaranteed short isogeny to find -- rests on arXiv 2607.14624, which NOBODY
    IN THIS GOAL HAS READ across four batches. The middle-memory cost form rests
    on [43], NOT READ. Theorem 1.4 rests on [10], NOT READ. Three unread
    citations carry the theorem, the tradeoff and the smoothness law
    respectively. The angle brief for this session measured the retrieval channel
    as open for arXiv (abstract and PDF, 200) and for ePrint abstract pages
    (200), with only ePrint PDF bodies blocked (403) -- so at least the first of
    the three is retrievable today and has not been retrieved.
    NOTHING HERE IS AN ATTACK AND NO EXPONENT MOVES. The deliverable is a
    verdict on an incompatibility, and a provenance repair for the three
    citations this goal's own conclusions stand on.

  object_first_candidate:
    tracked_object: >-
      THE GIVEN: the tuple (input type, output type, quantifier order,
      uniformity, promised precomputation) extracted from a theorem statement and
      followed through any composition the statement is used in. Not the proof,
      not the algorithm, not the complexity -- the interface. This is the object
      that composition preserves and that a complexity comparison silently
      assumes is shared, and it is the object that two papers about "the same
      problem" most often differ in without saying so.
    established_families_off_limits: >-
      Off-limits as the primary lens: every cryptanalytic family. This proposal
      may not become an attempt to attack, improve or re-derive either result --
      no claw finding, no van Oorschot-Wiener, no Delfs-Galbraith, no quaternion
      arithmetic as a method, no lattice reduction as a method. It may only read
      statements and compose reductions. Also off-limits: this goal's per-entry
      cost calibration lane, no value from which is used. The reason for stating
      the prohibition this strongly is that an audit that starts attacking a
      paper stops being an audit and becomes an unreviewed cryptanalysis with
      none of the controls a cryptanalysis would need.
    newness_score: >-
      Quantifier-order auditing is prescribed by the inventor protocol section 8
      audit 3 and claims no novelty as a technique. What is new is that it has
      never been applied in this goal, that the specific incompatibility named
      here appears nowhere in this corpus, and that the audit is here given a
      MATCHED NULL -- which, as far as this session could determine, no
      bibliographic audit in this corpus has ever had.
    testability_score: >-
      Very high and almost free. The composition argument is pen and paper. The
      retrieval is a handful of HTTP requests over a channel this session's angle
      brief measured directly. The verdict is a choice among three
      pre-enumerated alternatives.
    survival_score: >-
      The object survives to a binding constraint on every downstream record:
      a GIVEN that turns out to differ invalidates every complexity comparison
      built on the assumption that it did not, and this goal has built eighteen
      margin rows on top of exactly such comparisons.

  mechanism: >-
    PART A - THE COMPOSITION THAT FORCES THE TRICHOTOMY. From the frozen text,
    Section 2.3 and Corollary 1.2: OneEnd (Problem 2.2), EndRing (Problem 2.3)
    and Isogeny (Problem 2.4) "are computational equivalent under probabilistic
    polynomial-time reductions", with the reduction network attributed to [23],
    [45], [35], [33]. Write R for that network. Let A be any algorithm with
      GIVEN: a supersingular j-invariant j(E) over F_{p^2},
      OUTPUT: four endomorphisms generating End(E) as a Z-module,
      COST: poly(log p).
    Then R o A solves Isogeny in poly(log p). The frozen paper's Section 1.1
    lists the schemes whose security rests on exactly that problem. So the
    existence of A is not a re-parameterisation event; it is a total break. The
    contrapositive is the audit: since the p^{1/2} complexity "had stayed
    remarkably stable" for twenty years and the frozen paper's own contribution
    is to move it to p^{1/3}, a poly(log p) claim from the same fortnight must
    differ in its GIVEN or in its OUTPUT, or the field is over. THE AUDIT
    ENUMERATES THE THREE AND PICKS ONE FROM THE DOCUMENT, RATHER THAN GUESSING
    FROM PLAUSIBILITY.

    PART B - THE SPECIFIC HYPOTHESIS ABOUT THE GIVEN, STATED SO IT CAN BE WRONG.
    The Deuring correspondence is asymmetric in exactly the way that matters.
    Going from a maximal order O in B_{p,infty} to a curve E with End(E) ~ O is
    tractable; going from E to O is EndRing and is the hard direction. The frozen
    paper uses the easy direction openly in Section 4.2, where it samples random
    maximal orders precisely BECAUSE computing the degree of the shortest isogeny
    for a random CURVE "is generally extremely costly". A rank-4 CVP computation
    producing a Gram matrix is a computation IN a lattice, and one must already
    have the lattice. The audit's leading hypothesis is therefore that
    2026/1586's GIVEN is the order, not the curve, and that its poly(log p) is
    the cost of the easy direction. THIS IS A HYPOTHESIS ABOUT AN UNREAD
    DOCUMENT AND IS LABELLED AS SUCH THROUGHOUT. It is stated in advance so that
    the audit can be wrong in public rather than converge on whatever the text
    turns out to say.

    PART C - THE QUANTIFIER-ORDER SKELETON TO BE FILLED FROM EACH DOCUMENT. For
    each of the two results, rewrite the headline with explicit quantifiers:
      EXISTS algorithm A. FORALL p. FORALL E supersingular /F_{p^2}.
        [with probability ... over ...] A(GIVEN) outputs OUTPUT in COST.
    and then check the three places a claim leaks:
      (Q1) is the algorithm allowed to depend on p (non-uniformity), or on a
           precomputation whose cost is not charged;
      (Q2) is the witness -- the basis, the Gram matrix, the short vector --
           allowed to depend on the instance in a way a uniform conclusion
           forbids;
      (Q3) is the probability over the algorithm's coins, over a random instance,
           or over a random choice the adversary does not control.
    The frozen paper's own statement is filled in here as the worked example, and
    it passes cleanly: Theorem 1.1 is EXISTS Las Vegas algorithm, FORALL E, with
    expectation over the algorithm's randomness, cost p^{1/3+o(1)} -- except that
    Heuristic 1 is stated for a UNIFORMLY RANDOM E, so the FORALL in Theorem 1.1
    is purchased by the re-randomising walk of Algorithm 3 step 3, which is
    exactly where the walk's mixing assumption enters. THAT IS A REAL
    QUANTIFIER OBSERVATION ABOUT THE FROZEN PAPER, obtained for free by running
    the audit on it first, and it identifies the mixing bound as load-bearing for
    the FORALL rather than merely for efficiency.

    PART D - THE PROVENANCE HALF, AND WHY IT IS THE SAME AUDIT. Three citations
    carry this goal's conclusions and none has been read here:
      [4] arXiv 2607.14624 (Aubry-Oyono-Vincent) -- Theorem 1.5, the guaranteed
          degree bound (p/2)^{1/3}. WITHOUT IT THE ALGORITHM HAS NO TARGET. It is
          also anchor (A2) of IDEA-20260805-07ff43, where a hypothesis attached
          to the bound would change a derived exponent.
      [43] van Oorschot-Wiener -- the middle-memory cost form, which prices this
          goal's objective (b) and which IDEA-20260805-b4bc59 needs a
          multiplicity exponent from.
      [10] Canfield-Erdos-Pomerance -- Theorem 1.4, the smoothness count that
          Heuristic 1 is calibrated against.
    For each, the audit records: retrieved or not, by which channel, with the
    HTTP status; the statement verbatim; whether the frozen paper's paraphrase is
    faithful; and any hypothesis the paraphrase drops. The angle brief for this
    session measured the channel: arXiv abstract and PDF return 200, ePrint
    abstract pages return 200, ePrint PDF bodies return 403, pdftotext is absent
    and pypdf crashes on import, so a zlib-plus-regex stream extractor is the
    working route. Those measurements are RELAYED from the brief and are
    re-measured as stage 0 rather than assumed.

    PART E - THE MATCHED NULL FOR A BIBLIOGRAPHIC AUDIT. This is the part that
    makes the deliverable trustworthy. An audit that looks for discrepancies will
    find them, because paraphrase always loses something; the question is whether
    it finds them at a rate above baseline. So the identical protocol is run on
    [10], a 1983 classical theorem whose statement in the frozen paper is
    standard and which there is every reason to believe is faithfully
    represented. FORCED VALUE, DECLARED BEFORE THE RUN: the audit returns
    "faithfully represented, no dropped hypothesis" on [10]. If it returns a
    material discrepancy there, the protocol is over-sensitive and every finding
    it makes elsewhere is an artifact of the protocol rather than a property of
    the citation. This null can genuinely fail.

  novelty_status: unverified

