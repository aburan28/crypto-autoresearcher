idea:
  id: IDEA-20260904-d84512
  question_id: RQ-ECDLP-002
  added: '2026-09-04'
  title: >-
    ADVICE LENGTH UNDER A CHARGED DECOMPRESSION TIME IS THE ONE PREPROCESSING
    QUANTITY THIS PROGRAM HAS NEVER MEASURED: the generic frontier S*T^2 =
    Theta~(N) is beaten by a NON-generic algorithm if and only if the discrete
    logarithm table of some declared structured x-coordinate set compresses by a
    positive exponent under a representation that still answers a query in
    polylog time, and that exponent is measurable exhaustively at 20 bits with
    an anomalous curve as a hard positive control
  class: measurement

  claim: >-
    (A) THE EXACT CLAIM. Fix E/F_p with G = <P> of prime order N = Theta(p).
    For a set V of x-coordinates of points of G with |V| = D, let Tab_V be the
    table {(v, k_v) : v in V, x([k_v]P) = v, 0 < k_v < N/2}. Fix a class C of
    representations, each of which must answer the two queries "is v in V" and
    "return k_v" in time polylog(p). Define the ADVICE EXPONENT
    gamma_C(V) by S_C(V) = (D * log_2 N)^{1 - gamma_C(V)}, where S_C(V) is the
    bit length of the shortest member of C representing Tab_V. THE CLAIM UNDER
    TEST is the null H1 below: for every C and every V in the declared design
    family, gamma_C -> 0 as p grows along the sampled ladder.

    (B) WHY THE EXPONENT IS THE WHOLE QUESTION, DERIVED HERE IN SIX LINES.
    Consider the compressed-distinguished-set algorithm. Preprocessing (free in
    the Corrigan-Gibbs-Kogan model, and NOT free in reality -- see hidden
    overhead) computes Tab_V and emits its shortest C-representation as the
    advice, so S = (D log N)^{1-gamma}. Online, given a target Q, run a
    pseudorandom r-adding walk from Q with known accumulated offset and with the
    distinguished-point predicate "x(current point) in V", testable in polylog
    time from the advice; the walk meets V after Theta~(N/D) steps, and the
    logarithm follows by subtraction. Writing D = N^theta,
        log_N S = theta*(1 - gamma),   log_N T = 1 - theta,
        S*T^2  = N^{2 - theta*(1 + gamma)}.
    The generic frontier is S*T^2 = Theta~(N) (lower bound Corrigan-Gibbs-Kogan,
    matching upper bound reproduced inside this program by IDEA-20260806-3b91c7).
    Hence this construction beats the generic frontier if and only if
    theta*(1 + gamma) > 1, which for theta <= 1 holds for some theta if and only
    if gamma > 0. At gamma = 0 the construction's best point is theta = 1, where
    it exactly reproduces the frontier's full-table corner and improves nothing.
    So gamma > 0 and "the generic preprocessing frontier is beaten on this curve
    family" are the same statement, and gamma is measurable.

    (C) WHAT THE TWO OUTCOMES MEAN, STATED BEFORE THE MEASUREMENT.
    OUTCOME NULL (expected): gamma_C is statistically indistinguishable from 0
    for every declared C and every declared V, while the positive control
    returns gamma_C >= 0.9. Reading: the declared representation classes are
    closed, and one named cell of the non-generic preprocessing question --
    the only cell in which a compressed-advice attack could live for these
    classes -- is closed with a measured obstruction rather than a tally. This
    is a genuine closure of a class, NOT of the question: gamma is
    class-relative and a richer class is not excluded.
    OUTCOME LIVE: some declared C and V give gamma_C >= 0.1 with a confidence
    interval excluding 0 and no decay in p, while both null objects stay at 0.
    Reading: E(F_p) admits compressed advice, S*T^2 = N^{2 - theta(1+gamma)} <
    N is achievable, and the generic frontier is beaten non-generically. That
    would be the first positive exponent result this campaign has produced and
    would immediately require an independent review-breakthrough round.

    (D) WHY THIS IS NOT THE KOLMOGOROV QUESTION ALREADY CLOSED IN THIS LEDGER.
    IDEA-20260806-071255 item D3 closes, correctly and by definition unfolding,
    the compression ratio of the sequence x(P), x(2P), ..., x(tP): that sequence
    is emitted by a program of size O(log p) -- the curve, P and a loop -- so its
    Kolmogorov complexity is O(log p) for every t and every curve, and the ratio
    measures t rather than k. THE ENTIRE DIFFERENCE HERE IS THAT THE
    DECOMPRESSION TIME IS CHARGED. That O(log p)-bit program answers a query in
    Theta(N) steps, which is the point (S, T) = (O(log p), N) with S*T^2 =
    N^2 * polylog -- catastrophically off the frontier, and exactly why the
    (S, T) model exists. Requiring polylog random access is what converts D3's
    vacuous quantity into a non-vacuous one, and it is the only difference.

  mechanism: >-
    The generic-group lower bound S*T^2 = Omega~(N) treats group elements as
    opaque labels. A concrete curve is not opaque: every point carries an
    x-coordinate in F_p, and the advice is free to be indexed by that coordinate
    rather than by an abstract label. The mechanism under test is therefore
    whether the composite map v |-> k_v, from an x-coordinate in a chosen
    structured set V to the discrete logarithm of the corresponding point, has
    ANY short description that a polylog-time online algorithm can use. On an
    anomalous curve (#E(F_p) = p) it demonstrably does: the formal-group /
    p-adic elliptic logarithm makes k_v an affine function of a polylog-computable
    coordinate function of v, so the whole table has an O(log p)-bit
    representation with polylog query, i.e. gamma = 1. The mechanism is thus
    known to be non-empty on a named curve family, and the question is whether
    any residue of it survives when the anomalous structure is removed. Because
    the mechanism is a statement about the REPRESENTATION and not about the group
    element, it is a TYPE III candidate in the trichotomy of IDEA-20260806-c5d183
    as reused by IDEA-20260806-071255, and it is therefore not touched by the
    constant-or-injective dichotomy that empties TYPE-free invariant searches.

  novelty_status: unverified

  citations:
    - ref: KN-LIT-013
      provenance: kb
      claim: >-
        Any generic discrete-log algorithm with an S-bit advice string, online
        time T and success probability epsilon in a group of prime order N
        satisfies S*T^2 = Omega~(epsilon*N). Corrigan-Gibbs and Kogan, EUROCRYPT
        2018.
      verified_by: >-
        resolved through this repository's corpus as KN-LIT-013, cited by
        knowledge/techniques/KN-TECH-005.md which this session read in full
    - ref: KN-TECH-005
      provenance: internal
      claim: >-
        The program's recorded baseline convention, including the preprocessing
        tradeoff S*T^2 = Omega~(n) and the explicit statement that the bound says
        nothing about attacks exploiting concrete structure.
      verified_by: this session read knowledge/techniques/KN-TECH-005.md in full
    - ref: IDEA-20260806-3b91c7
      provenance: internal
      claim: >-
        A derivation inside this program reproducing the MATCHING UPPER bound
        S*T^2 = Theta(N) for a fixed curve by stored deterministic walk chains,
        with memory S = N/L^2 and online time T = Theta(sqrt(N/S)).
      verified_by: this session read the first 70 lines of that record
    - ref: IDEA-20260806-071255
      provenance: internal
      claim: >-
        Item D3 -- the Kolmogorov complexity of x(P), ..., x(tP) is O(log p) for
        every t and every curve, so the unconditioned compression ratio is
        vacuous; the family is closed by definition unfolding.
      verified_by: this session read lines 1-120 of that record
    - ref: 'Smart, N. P., The discrete logarithm problem on elliptic curves of trace one, J. Cryptology 12 (1999) 193-196; Satoh and Araki 1998; Semaev 1998'
      provenance: recalled
      claim: >-
        For E/F_p with #E(F_p) = p (anomalous / trace one) the discrete logarithm
        is computable in polynomial time via the formal group logarithm. Used here
        ONLY as the positive control, and no step of this proposal depends on the
        exact reference.
      verified_by: null
    - ref: 'Lange, T. and Winterhof, A., Polynomial interpolation of the elliptic curve and XTR discrete logarithm, COCOON 2002'
      provenance: recalled
      claim: >-
        Lower bounds on the degree of polynomials interpolating the elliptic-curve
        discrete logarithm, with better bounds for curves carrying an endomorphism
        of degree 2 or 3. This is the reason the declared class C must contain
        more than dense polynomial interpolation, and the reason a null result
        restricted to polynomial interpolation would be uninformative.
      verified_by: null

  assumptions:
    - N is prime and the curve is given by a public short-Weierstrass equation.
    - >-
      The preprocessing model is the standard one -- advice bits are charged,
      preprocessing time is not. This is generous to the attacker and is the
      model in which the frontier being challenged was proved.
    - >-
      Every representation in C answers membership and lookup in polylog(p) time.
      A representation that does not is measured only as a non-admissible
      indicator and can never support a positive claim.
    - >-
      The online walk's distinguished-point predicate is charged at its true
      cost, which for a general V is the advice's own membership query.

  proof_search_map:
    bottleneck: >-
      The single step whose removal changes the theorem is the passage from "the
      advice must name D independent discrete logarithms" to "the advice must
      encode a table with a short description". The generic lower bound forces
      the former because a generic algorithm cannot index by anything but opaque
      labels; a concrete curve permits indexing by x, and the bottleneck is
      whether that indexing buys any description length.
    baseline_embedding:
      parameter_slice: >-
        gamma = 0 and theta = 1 must reproduce the frontier's full-table corner,
        S = Theta(N log N) bits and T = polylog, S*T^2 = N * polylog. gamma = 0
        with the chain construction of IDEA-20260806-3b91c7 must reproduce
        T = Theta(sqrt(N/S)) at every S. Both are exact old-method boundaries.
      reproduction_check: >-
        A symbolic check of the identity S*T^2 = N^{2 - theta(1+gamma)} at
        gamma = 0, theta in {1/3, 1/2, 1}, plus a frozen regression fixture
        asserting that the measured pipeline reports gamma = 0.00 +/- 0.02 on
        NULL-2 (matched-marginal shuffle) at every prime in the ladder.
    observation_collision:
      observable: >-
        The scalar gamma_C(V), i.e. the shortest admissible representation length
        of Tab_V.
      distinct_preimage_search: >-
        Two distinct objects with the same observable are easy to exhibit and
        must be exhibited before belief -- an anomalous curve's table and a
        deliberately planted table of the form k_v = a*lambda(v) + b for a
        declared polylog-computable lambda both give gamma = 1, and a generic
        curve's table and a uniformly random injection both give gamma = 0. The
        observable therefore does NOT identify the mechanism, only the
        compressibility; any positive must be followed by exhibiting the
        representation itself, which is a certificate that can be re-verified
        independently.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The advice string as an object in its own right, reduced from a table
          of D logarithms to the shortest member of a declared class C that
          supports polylog random access.
        predicted_gain: >-
          S*T^2 = N^{2 - theta(1 + gamma)} against the generic frontier N. Any
          gamma > 0 is an exponent gain at theta near 1; gamma >= 1/2 is needed
          for a gain at the balanced point S = T, where the online exponent
          becomes (1-gamma)/(2-gamma) against the frontier's 1/3.
    quantifier_order: >-
      EXISTS a representation class C in the declared list and EXISTS a design V
      in the declared family such that FOR ALL sufficiently large p in the
      sampled ladder, gamma_C(V) >= gamma_0 > 0. The null H1 is the negation:
      FOR ALL declared C and FOR ALL declared V, gamma_C(V) -> 0. Note the
      existential is over a DECLARED FINITE list fixed before the measurement;
      quantifying over all classes and all designs is not tested and is not
      claimed either way.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest thing this method can certify is: for the declared classes
        and designs, at the tested primes, the advice exponent is (or is not)
        bounded away from zero. It can NEVER certify that gamma = 0 for all
        classes, because gamma is class-relative and the class list is finite and
        chosen. A null therefore closes named classes and nothing more.
      nearby_object_control: >-
        The anomalous curve #E(F_p) = p is a nearby object on which the desired
        conclusion (gamma = 0) is KNOWN FALSE. If the pipeline reports gamma = 0
        there, the pipeline is refuted rather than the curve, and every null it
        produces elsewhere is uninterpretable. A second, weaker nearby object is
        a curve of small embedding degree k, where the table is compressible
        through the MOV reduction only to a subexponential-size object and the
        instrument should show a partial hit at best.
    proof_obligations:
      - claim: >-
          The compressed-distinguished-set algorithm is correct -- the walk's
          accumulated offset does recover log Q from k_v.
        responsibility: correctness
      - claim: The online walk hits V in Theta~(N/D) steps.
        responsibility: runtime
      - claim: >-
          The advice is exactly S_C(V) bits and the membership predicate is
          polylog, so no cost is hidden in the predicate.
        responsibility: memory
      - claim: >-
          S*T^2 = N^{2 - theta(1+gamma)}, and at gamma = 0 this reproduces the
          committed frontier rather than beating it.
        responsibility: baseline
      - claim: >-
          gamma_C measured at 13 to 24 bits transfers, or does not transfer, to
          cryptographic size.
        responsibility: scope
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: >-
      The pair (V, Tab_V) projected onto the length of its shortest admissible
      representation.
    lossy_projection_test: >-
      The projection is genuinely lossy: it discards the y-coordinates, the order
      in which points were enumerated, every point of G outside V, and the
      identity of the representation itself, retaining only a single length. What
      it discards is discarded COMPATIBLY with the operation the target performs,
      because the only operation the online algorithm applies to the advice is a
      random-access query, and the retained quantity is exactly the cost of
      supporting that query. The projection is not a change of coordinates: the
      table itself has D*log(N/D) bits of content by construction, and the entire
      content of the object is the GAP between that number and the projection,
      which is zero if and only if nothing was learned.
    one_step_propagation: >-
      One step is one online query. The object propagates deterministically under
      it by construction (random access is required of every admissible
      representation), which is precisely the requirement that D3 of
      IDEA-20260806-071255 does not impose and that makes this version
      non-vacuous.
    survival_depth: >-
      The object survives for the whole online phase, because the advice is
      static; there is no depth at which it dissolves. What can dissolve is the
      class C's adequacy, and the anomalous positive control is the test of that.

  predictions:
    - metric: >-
        gamma_C(V), the advice exponent, on generic prime-field curves, fitted
        across the prime ladder
      direction: >-
        different from the anomalous positive control and indistinguishable from
        the two null objects
      minimum_effect: >-
        |gamma_C| <= 0.02 with a 95 percent interval containing 0 at every prime,
        for every declared C and V
    - metric: gamma_C on the anomalous positive control
      direction: higher
      minimum_effect: >-
        gamma_C >= 0.9 for the affine-in-computable-coordinate class. A value
        below 0.5 here disqualifies the class as an instrument.
    - metric: >-
        the fitted trend d gamma_C / d log_2 p on generic curves over the ladder
      direction: different
      minimum_effect: >-
        indistinguishable from zero within the fitted interval; any monotone
        trend, in either direction, must be reported and blocks extrapolation
    - metric: gamma_C on NULL-2, the matched-marginal shuffle
      direction: lower
      minimum_effect: >-
        gamma_C <= 0.02, and it must reproduce whatever floor the generic-curve
        arm reports, or the generic-curve arm's value is a marginal artifact

  minimal_test:
    design: >-
      Exhaustive discrete-logarithm tables at toy scale, four representation
      classes, three curve types, three set designs. CURVE TYPES: (T1) generic
      ordinary prime-field curves with N prime, p in {2^13, 2^16, 2^18, 2^20,
      2^22, 2^24}; (T2) the POSITIVE CONTROL, an anomalous curve with
      #E(F_p) = p at the same bit sizes, found by scanning (a, b) over a fixed p
      until #E = p; (T3) a small-embedding-degree curve, k <= 6, as an
      intermediate control. For each curve compute the full table k |-> x([k]P)
      by one enumeration pass and invert it. SET DESIGNS: (V1) an interval
      {v : v < D}; (V2) a coset of a multiplicative subgroup mu_D with D | p-1;
      (V3) a uniformly random subset of x(G) of size D, which is also NULL-3.
      Take D = round(N^{1/3}) and D = round(N^{1/2}). REPRESENTATION CLASSES:
      (C1) interpolating polynomial over F_p of minimal degree, plus its sparse
      variant; (C2) minimal linear recurrence over Z/N by Berlekamp-Massey on the
      sequence k_v in the design's natural order; (C3) affine in a declared
      polylog-computable coordinate function lambda, k_v = a*lambda(v) + b mod N,
      with lambda ranging over a fixed published list that INCLUDES the truncated
      formal-group logarithm, so that the anomalous control can fire; (C4) a
      generic entropy coder, recorded as a non-admissible indicator only and
      never used to support a positive. Report S_C in bits and gamma_C with a
      bootstrap interval, per cell.
    controls:
      - >-
        POSITIVE CONTROL (T2), the anomalous curve. Named concretely: a curve
        E/F_p with #E(F_p) = p exactly, at the same bit size as the T1 arm, on
        which gamma is known to be 1. If the pipeline does not report gamma >= 0.9
        here, the pipeline is refuted and no null it produces is interpretable.
      - >-
        NULL-1, the structure-removed twin of the positive control: a DIFFERENT
        curve over the SAME prime p, same bit size, same code path, with
        #E(F_p) != p and prime. Only the anomalousness is removed. This is the
        named null object; "a random curve" is not used anywhere.
      - >-
        NULL-2, the matched-marginal shuffle: keep V and keep the multiset of
        logarithms, but reassign them to the elements of V by a uniformly random
        bijection. Marginals preserved, joint structure destroyed. This is the
        control that exposed popcount and digitsum as false positives in
        RT-EXP-1 of the O2 line and it is reused deliberately.
      - >-
        NULL-3, design removed: V a uniformly random subset of x(G) of the same
        size, curve unchanged. Separates "this SET is special" from "this CURVE
        is special".
      - >-
        Fishing correction: for each cell, also record the MINIMUM gamma_C over
        1000 independently drawn random designs of the same size, and compare a
        single design's value against that extreme-value distribution rather than
        against zero.
    required_metrics:
      - S_C in bits, per (curve type, set design, representation class, prime)
      - gamma_C with a 95 percent bootstrap interval, same cells
      - the fitted slope of gamma_C against log_2 p, with interval
      - >-
        the realised online walk length to hit V, measured, against the predicted
        Theta~(N/D) -- this is what makes T in the tradeoff a measurement and not
        an assumption
      - wall-clock and peak RSS per cell

  falsification_conditions:
    - >-
      LIVE-SIDE FALSIFICATION OF THE NULL: some declared C and V give
      gamma_C >= 0.10 with a 95 percent interval excluding 0, at three or more
      consecutive primes, with no decay in p, while NULL-2 and NULL-3 both report
      gamma_C <= 0.02 in the same cells.
    - >-
      NULL-SIDE CONFIRMATION, which closes the declared classes: every declared C
      and V gives |gamma_C| <= 0.02 with intervals containing 0 at every prime,
      WHILE the positive control T2 reports gamma_C >= 0.9. Both halves are
      required; the second half alone is a fatigue report.
    - >-
      INSTRUMENT REFUTATION: the positive control T2 reports gamma_C < 0.5. Then
      the declared class list is too weak, the experiment has measured the class
      and not the curve, and no conclusion about E(F_p) may be drawn.
    - >-
      MODEL REFUTATION: the measured online walk length to hit V departs from
      Theta~(N/D) by more than a factor 2 in a systematic direction, which would
      mean the T in S*T^2 is not the quantity derived in (B) and the exponent
      identity does not apply.

  confounders:
    - >-
      A generic entropy coder will always report some compression on a table of
      D integers each written in a fixed width, purely from the width padding.
      This is why C4 is a non-admissible indicator and why NULL-2 must reproduce
      whatever floor the generic arm shows.
    - >-
      At small p the table is small and every representation class has a
      finite-size floor of order log p bits that inflates gamma. The trend in p,
      not the value at one p, carries the conclusion.
    - >-
      Choosing V after seeing the table is fishing. V designs are declared in the
      contract before any table is computed, and the extreme-value correction
      above is the guard against the remaining freedom.
    - >-
      gamma is class-relative. A null is a statement about C, and reading it as a
      statement about E(F_p) is the specific overclaim this record forbids.
    - >-
      The anomalous control uses a different mathematical mechanism (the formal
      group) from anything expected on a generic curve, so its firing calibrates
      SENSITIVITY OF THE CLASS, not the plausibility of a generic-curve hit.

  interpretation_limits:
    - >-
      Toy scale, 13 to 24 bits, exhaustively. Under AGENTS.md rule 4 this is not
      cryptographic-scale validation and no transfer is asserted; the fitted
      trend in p is reported as a trend, and if it is flat that is a flat trend
      over eleven bits and nothing more.
    - >-
      The preprocessing model charges no preprocessing time. Building Tab_V at
      cryptographic scale requires solving D discrete logarithms, i.e. at least
      N^{theta} work, which is astronomically infeasible at theta near 1. Any
      positive result here is an ASYMPTOTIC statement about the frontier and NOT
      a deployable attack, and must be reported as such.
    - >-
      A positive result on the T3 small-embedding-degree arm would be a
      restatement of the MOV reduction and must not be reported as a new
      mechanism.
    - >-
      Nothing here bears on the single-target no-advice setting, where rho at
      Theta(sqrt(N)) with O(1) memory remains untouched.

  standing_results_check:
    kn_tech_73630e: >-
      NOT APPLICABLE, and checked. That boundary says the canonical prime-to-p
      torsion lift is a deterministic function of the input point, so any
      statistic of its digits is a deterministic function of data the querying
      party already holds, and can be computational at most. No lift appears
      here. The advice is not a function of data the ONLINE party holds -- it is
      the output of an unbounded preprocessing phase the online party does not
      run -- so the informational objection does not arise. Separately, and
      recorded against interest, the FINDING of this experiment (the value of
      gamma) is a deterministic function of the public curve, so the finding
      itself is computational in exactly the sense that boundary describes; that
      is consistent, since the claim under test is about advice LENGTH and not
      about information.
    kn_find_ffe1df_theorem_c: >-
      HYPOTHESES NOT SATISFIED, stated explicitly. Theorem C forbids a surjective
      homomorphism from a prime-order group onto a strictly smaller structure. The
      tracked object here is not a homomorphism, is not required to be
      structure-preserving, and is not a map out of E(F_p) at all -- it is a
      length assigned to a table indexed by x-coordinates. A compressed table
      would FOLLOW from a homomorphism, but the converse does not hold, so
      Theorem C forbids one route to compressibility and not compressibility.
      The anomalous curve settles this concretely: there gamma = 1 with no
      quotient homomorphism of the prime-order group anywhere in the argument.
    kn_find_61347e: >-
      NOT APPLICABLE. No cross-genus embedding, no Jacobian, no complementary
      abelian factor. Nothing here changes the ambient group.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (ADVICE INCOMPRESSIBILITY.) For every representation class C in the
        declared list {C1, C2, C3} and every design V in the declared family
        {V1, V2, V3}, and for every epsilon > 0, there is p_0 such that for all
        ordinary E/F_p with N = #E(F_p) prime and all p > p_0 in the sampled
        ladder, S_C(V) >= (1 - epsilon) * D * log_2(N/D) bits, equivalently
        gamma_C(V) <= epsilon.
      rigorous_support: >-
        The counting fact it imitates: a uniformly random injection from a
        D-element set into Z/N has entropy log_2(N!/(N-D)!) = (1 - o(1)) * D *
        log_2(N/D) bits, so no representation, in any class, can be shorter than
        that for all but a vanishing fraction of tables. H1 asserts that the
        ECDLP table behaves like such a uniformly random injection with respect
        to the declared classes. The rigorous half that is actually available is
        one-directional and weaker: Lange-Winterhof-type degree lower bounds
        (recalled) already rule out LOW-degree polynomial interpolation, which is
        the C1 corner of the claim; H1 extends that instance to the declared
        classes and is not implied by it.
      validation_plan: >-
        SAMPLED: the full table Tab_V for six primes p in {2^13, 2^16, 2^18,
        2^20, 2^22, 2^24}, three curve types, three designs, at D = N^{1/3} and
        N^{1/2}. Tables are computed exhaustively by one enumeration pass, so no
        shortcut or correspondence is needed and no sampling error enters the
        table itself. COMPARED AGAINST: the random-injection entropy
        D*log_2(N/D), as an empirical CDF of S_C over 200 independent curves per
        (p, design) cell, against the same CDF for NULL-2 and NULL-3. TAIL CHECK:
        the MINIMUM of S_C over 1000 random designs per cell, compared with the
        extreme-value prediction for the minimum of that many draws from the
        measured null distribution -- so that the smallest observed
        representation is scored against how small the smallest of 1000 draws
        should be, not against the mean. SAMPLED PARAMETERS RECORDED: p, the
        curve coefficients, N, D, the design, the class, and the random seed.
        TRANSFER ASSUMPTION, stated: none is made. The fitted trend in p is
        reported; extrapolation to 256 bits is explicitly refused in this record.
    - id: H2
      statement: >-
        (CLASS ADEQUACY.) For the class C3 (affine in a declared polylog-computable
        coordinate function), FOR ALL anomalous E/F_p with #E(F_p) = p in the
        sampled ladder, gamma_{C3} >= 1 - o(1).
      rigorous_support: >-
        The theorem it imitates is not a distribution statement but a
        constructive one: on a trace-one curve the formal-group logarithm gives
        an efficiently computable group isomorphism E(F_p) -> F_p^+ (Smart;
        Satoh-Araki; Semaev -- all recalled), under which k_v is an affine
        function of a polylog-computable coordinate function of v. H2 asserts
        only that the declared list of lambda functions actually contains that
        coordinate function, which is a property of the contract and is checkable
        by inspection before any run.
      validation_plan: >-
        SAMPLED: 20 constructed anomalous curves, found by scanning (a, b) over
        each of the six primes until #E(F_p) = p; the order is certified by an
        independent point-counting check and by verifying [p]P = O for 50 random
        points. COMPARED AGAINST: the point prediction gamma_{C3} = 1 - o(1),
        with the o(1) resolved as (bits of the affine coefficients) / (D log_2
        N). TAIL CHECK: the same measurement on NULL-1, the same-prime
        non-anomalous curve, which must return gamma_{C3} <= 0.02; a positive
        control that fires on its own null is not a control.
    - id: H3
      statement: >-
        (WALK MODEL.) FOR ALL declared designs V of size D and all sampled p, an
        r-adding pseudorandom walk on <P> meets V after (1 + o(1)) * N/D steps in
        expectation, with the distribution of the hitting time within 10 percent
        of Geometric(D/N) in Kolmogorov-Smirnov distance.
      rigorous_support: >-
        The classical statement it imitates is the hitting-time law for a walk
        mixing faster than 1/(hitting time) on a cyclic group, together with the
        equidistribution of x-coordinates of multiples of P in F_p to within
        Hasse and character-sum error. The rigorous half available is the
        equidistribution bound; the walk's mixing is heuristic, as it is in every
        rho analysis in this corpus.
      validation_plan: >-
        SAMPLED: 10^4 independent online walks per (p, design) cell, recording the
        realised hitting time. COMPARED AGAINST: Geometric(D/N) by empirical CDF
        and Kolmogorov-Smirnov distance reported as a distance, not a test. TAIL
        CHECK: the 99th percentile of the realised hitting time against the
        geometric prediction, since a heavy upper tail would inflate T and is the
        failure mode that would silently break the S*T^2 identity.

  target_complexity:
    time_exponent: >-
      Online T = Theta~(N^{1 - theta}) for the compressed-distinguished-set
      algorithm at D = N^theta, giving S*T^2 = N^{2 - theta(1 + gamma)}. At
      gamma = 0 the best achievable is S*T^2 = N (theta = 1), which is the
      frontier and no improvement. At gamma > 0 and theta = 1: S = N^{1-gamma},
      T = polylog, S*T^2 = N^{1-gamma} < N. At the balanced point S = T:
      T = N^{(1-gamma)/(2-gamma)}, against the frontier's N^{1/3}, so the
      balanced point improves only for gamma > 1/2.
    memory_exponent: >-
      S = N^{theta(1-gamma)} bits of advice; the online phase itself needs O(1)
      group elements beyond the advice.
    best_known: >-
      Generic frontier S*T^2 = Theta~(N), lower bound Corrigan-Gibbs-Kogan
      (KN-LIT-013, KN-TECH-005), matching upper bound reproduced in
      IDEA-20260806-3b91c7. Single-target, no advice: Pollard rho at
      Theta(sqrt(N)) group operations with O(1) memory.
    hidden_overhead: >-
      Three items, disclosed. (1) The polylog factors in the membership query and
      in the walk's step function are real and are charged in the measurement but
      not in the exponent. (2) Preprocessing time is uncharged BY THE MODEL and is
      at least N^theta actual discrete-logarithm computations, which at theta near
      1 is more work than solving the instance; the exponent claim is therefore
      about the frontier and not about a deployable attack. (3) gamma is
      class-relative and the class list is finite; the o(1) in "gamma -> 0"
      conceals every representation class not on the list.
    tradeoff_note: >-
      The whole content of the proposal is a point on the time-memory frontier,
      so the tradeoff is the claim rather than a footnote. Parallelization: the
      online walk parallelizes with the standard van Oorschot-Wiener linear
      speedup and the advice is read-only and shareable across all threads and
      all targets, which is the setting in which advice is most valuable and in
      which any gamma > 0 would matter most.

  estimated_cost:
    implementation: medium
    compute: low

  recommended_priority: high

  sota_delta: >-
    +0 as filed, and this is stated plainly: the record proposes a measurement,
    not an algorithm, and its expected outcome is the null. The quantitative
    stake is that the measurement decides whether S*T^2 = N^{2 - theta(1+gamma)}
    with gamma > 0 is reachable, i.e. whether the generic preprocessing frontier
    S*T^2 = Theta~(N) is beaten non-generically on prime-field curves. The
    improvement claimed today is zero; the improvement the measurement could
    license is N^{-gamma} on the S*T^2 product at theta = 1.

  dominated_by: >-
    As a measurement, dominated_by is not applicable -- no cost result is claimed.
    For the CONDITIONAL algorithm in part (B), the Pareto frontier was checked
    row by row on all three axes. TIME at O(1) memory: Pollard rho, Theta(sqrt N)
    -- the conditional algorithm at theta = 1 has T = polylog but S = N^{1-gamma}
    memory, so it does not dominate rho on memory and rho does not dominate it on
    time; incomparable. TIME at memory N^{sigma}: the chain construction of
    IDEA-20260806-3b91c7, T = sqrt(N/S) -- at gamma = 0 the conditional algorithm
    is DOMINATED by it (N/D versus sqrt(N/S) at the same memory), and at gamma > 0
    it dominates that row for theta > 1/(1+gamma). DATA AND QUERIES: no oracle
    queries are issued; single target; multi-target amortization is out of scope
    and is not claimed. BSGS at (N^{1/2}, N^{1/2}): dominated by the chain row and
    therefore not the binding comparator. CONCLUSION: at gamma = 0 the conditional
    algorithm is dominated by IDEA-20260806-3b91c7's chain construction on the
    time axis at matched memory, and the record says so; at gamma > 0 no row of
    the checked frontier dominates it.

  discriminated_from:
    - >-
      IDEA-20260806-071255 item D3 -- NEAREST NEIGHBOUR, and the one this record
      must escape. D3 closes the unconditioned Kolmogorov complexity of the
      x-sequence, correctly, because a loop of size O(log p) emits it. THE
      DIFFERENCE IS THAT DECOMPRESSION TIME IS CHARGED HERE. D3's O(log p) program
      answers a query in Theta(N) steps and therefore sits at S*T^2 = N^2 polylog,
      far off the frontier; requiring polylog random access is what makes the
      quantity non-vacuous, and it is the only difference. If a reviewer judges
      that the polylog-query requirement does not change D3's argument, this
      record should be withdrawn rather than defended.
    - >-
      IDEA-20260806-3b91c7 -- the nearest neighbour on the preprocessing axis. That
      record derives and calibrates the GENERIC frontier S*T^2 = Theta(N) and uses
      it to correct this program's comparator. It makes no non-generic claim and
      measures no property of the concrete curve. This record takes that frontier
      as given -- it is the baseline the exponent identity in (B) is stated
      against -- and asks the strictly different question of whether the concrete
      curve's coordinate structure lets the advice be shorter than the generic
      construction requires.
    - >-
      IDEA-20260808-9d6677, which explicitly scopes preprocessing, advice and
      multi-target OUT of its Pareto table. This record is inside the scope that
      record excludes, and does not touch the single-target no-advice claims it
      makes.
    - >-
      KN-OPEN-020 and the Bezout no-go for algebraically described factor bases.
      That line bounds the DESCRIPTION DEGREE of a factor base used for relation
      collection. This record charges the description LENGTH of an advice table
      used for lookup, in a model where preprocessing is free, and never collects
      a relation. Different object, different model, different cost axis.
    - >-
      KN-FIND-1ba0fe and the D1 collapse. That is a coordinate-valuation statistic
      of a canonical lift, and it collapses because the lift is a deterministic
      function of the point. No lift appears here and the advice is not derivable
      by the online party.

