    memory_exponent: n/a
    best_known: Wesolowski 2026 p^{1/3+o(1)}
    hidden_overhead: n/a
    tradeoff_note: No attack proposed.
  dominated_by: 'Wesolowski 2026, trivially. Rows checked across time, memory and data/queries:
    Wesolowski 2026 p^{1/3+o(1)} time and memory; Delfs-Galbraith p^{1/2}(log p)^{O(1)} at poly
    memory; vOW p^{1/2+o(1)}/w^{1/2} at memory w; MITM p^{1/2} at p^{1/2}; Kohel p(log p)^{O(1)}.
    Queries 0 on every row.'
  sota_delta: ZERO. The campaign's headline claim that p^{1/3+o(1)} is the tight classical exponent
    depends on this closure being correct, and the check is zero compute.
