idea:
  id: IDEA-20260807-6cdff2
  question_id: RQ-SSI-001
  added: '2026-08-07'
  title: 'The one avenue GOAL-SSI-001''s own producer called ''The only open avenue'' was closed
    by a SIBLING ARTIFACT from the same task, on an abstract-level reading, without doing the
    zero-compute action that same artifact called ''decisive and maximal-payoff'': read KN-LIT-7641'
  class: control
  claim: 'TASK-20260804-55952a produced two sibling artifacts under BATCH-046. mechanism_analysis.md
    calls dimensional (Morita) ascent from M_g(O) down to g=1 ''The only open avenue'', says a
    positive result would be ''comparable to Shor''s algorithm for RSA'', and ends ''Next action:
    READ KN-LIT-7641. This is zero-compute, decisive, and maximal-payoff.'' pip_bypass_analysis.md,
    from the SAME task, closes the SAME avenue ''by circularity'' on the ground that the g >=
    2 algorithm ''requires the ring as input'', and concludes ''p^{1/3+o(1)} is the standing classical
    barrier.'' KN-LIT-7641 is cited by ZERO records under ledger/, so the reading its own analysis
    called decisive was never done and the circularity closure rests on an abstract-level reading
    of the algorithm it closes against. The direct contradiction between the two sibling artifacts
    was never adjudicated in any ledger record; DEC-20260805-596d71 names only assess_completion_criteria
    and time_memory_tradeoff_analysis as next actions, neither of which is this. KN-OPEN-024 states
    the same gap independently and records that neither KN-LIT-7641 nor KN-LIT-7647 was read in
    full.'
  mechanism: 'Read KN-LIT-7641 and answer ONE binary question with a citation: is any step of
    the M_g(O) principal-ideal algorithm RANK-ESSENTIAL, or does it merely take the ring as input?
    ''Takes the ring as input'' is not circularity if the ring is recoverable at the target rank
    by other means, and it IS circularity if the algorithm''s complexity depends on g in a way
    that degenerates at g = 1. Then record the answer as evidence under GOAL-SSI-001 and reconcile
    the two BATCH-046 artifacts in a superseding record. Also answer KN-OPEN-024''s own step 3,
    which it states is answerable from the literature with no compute: characterize the unit group
    of a maximal order in B_{p,infinity} as a lattice under the log embedding and decide whether
    a stage-2 (short-generator) decoding argument is even formulable.'
  novelty_screen:
    screened_on: '2026-08-07'
    corpus_paths_grepped:
    - ledger
    - knowledge/open-problems
    grep_results:
    - KN-LIT-7641 is cited by ZERO records under ledger/.
    - 'IDEA-20260806-a3ef00 is the one RQ-SSI-001 proposal mentioning KN-OPEN-024 and explicitly
      disclaims the overlap in its discriminated_from: ''Those concern the PRINCIPAL IDEAL problem
      in quaternion orders. This proposal concerns the genus/spinor stratification of the ternary
      lattice.'''
    - Every other ledger reference to KN-OPEN-024 (GOAL-HAWK-001, EV-HAWK-21edba, DEC-20260805-ed4cd3,
      DEC-20260804-139a86, IDEA-20260805-c60813) is on the lattice/HAWK side, so the entry's explicitly
      supersingular reading is orphaned away from the goal that owns EndRing hardness.
    conclusion: The decisive reading is unframed and the sibling contradiction is unadjudicated.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS: proposing a new attack. This record does a reading
      and an adjudication.'
    tracked_object: Per algorithm step, the bit (does its cost or correctness depend on the matrix
      rank g?).
    one_step_propagation_rule: The algorithm is rank-essential iff at least one step's bit is
      set; the conjunction is exact.
    newness_score: Nil as mathematics. It is the single reading the campaign's own producer named
      as decisive and nobody performed.
  lossy_projection_identifiability_audit:
    projection: the M_g(O) algorithm -> a per-step rank-essentiality bit vector.
    what_is_discarded: The algorithm's mathematics, retained by citation.
    is_it_only_a_change_of_coordinates: NO, but candidly this is a WEAK object -- a bit vector.
      Its value is entirely that the campaign's headline claim depends on one of those bits and
      nobody has looked.
    mirror_failure_check: 'CHECKED. The failure would be a reading that returns ''rank-essential''
      for every algorithm. It does not: the g = 1 case is the classical PIP, for which no such
      algorithm is known, so the two answers are genuinely distinguishable and the reading is
      a real question.'
  null_object_control:
    primary_null: Apply the same rank-essentiality test to an algorithm KNOWN to be rank-agnostic
      (e.g. a generic lattice reduction step) and confirm it scores not-essential. A test that
      marks everything essential cannot support a closure.
    secondary_nulls:
    - If KN-LIT-7641 cannot be obtained, the cell is recorded SOURCE-BLOCKED and the circularity
      closure is downgraded to `unverified` rather than left standing.
  assumptions:
  - KN-LIT-7641 is retrievable. As measured on 2026-08-07, arXiv full PDFs and NIST publications
    are retrievable from this environment and eprint abstract pages resolve; eprint PDFs return
    a Cloudflare challenge. Retrieval route is recorded with the entry.
  predictions:
  - metric: rank-essentiality verdict for the M_g(O) principal-ideal algorithm
    direction: different
    minimum_effect: A cited yes or no. Either verdict changes what GOAL-SSI-001 may assert.
  minimal_test:
    design: Obtain and read KN-LIT-7641; score each algorithm step; emit a superseding record
      reconciling mechanism_analysis.md and pip_bypass_analysis.md; answer KN-OPEN-024 step 3
      from the literature.
    controls:
    - rank-agnostic algorithm null
    - SOURCE-BLOCKED discipline
    required_metrics:
    - per-step rank-essentiality bits with citations
    - reconciliation verdict on the two sibling artifacts
    - unit-group lattice characterization or an explicit gap
  falsification_conditions:
  - 'The algorithm IS rank-essential: the circularity closure is correct as stated and the program
    gets its first cited, non-circular obstruction for the dimensional-ascent lane.'
  - 'It is NOT rank-essential: the closure is wrong as stated, the avenue reopens, and GOAL-SSI-001''s
    ''tight classical exponent'' claim loses a supporting leg.'
  - 'KN-LIT-7641 is unobtainable: recorded SOURCE-BLOCKED; the closure is downgraded, not sustained.'
  confounders:
  - '''Requires the ring as input'' and ''is rank-essential'' are different properties and the
    closure conflates them; the audit must keep them separate.'
  - An abstract-level reading is what produced the disputed closure; a second abstract-level reading
    would repeat the error.
  interpretation_limits:
  - A reading result changes no status. Only the Coordinator may transition anything.
  - Reopening an avenue is not evidence that it leads anywhere.
  heuristic_assumptions:
  - id: HEUR-MORITA-1
    statement: Rank-essentiality is decidable from the paper's own statements without re-deriving
      the algorithm.
    rigorous_support: None.
    validation_plan: If it is not decidable from the text, record that as the finding.
  target_complexity:
