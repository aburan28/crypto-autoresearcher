idea:
  id: IDEA-20261006-300758
  question_id: RQ-SSI-001
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    The three order-2 kernels of y^2 = x^3 + x over F_67 produce
    fewer than three distinct codomain j-invariants.
  class: measurement
  claim: >-
    Let E be y^2 = x^3 + x over F_67, and assume the trace test
    #E(F_67) = 68 succeeds. Let the three kernels be the order-2
    subgroups generated by the three points with y = 0. Let n be the
    number of distinct j-invariants of their Vélu codomains, computed
    in F_{67^2}. The claim is n ≠ 3. This is the distinct-neighbor
    count at one vertex of the supersingular 2-isogeny graph. It does
    not search for a path, it does not partition edges into an
    internal set and a cut set, and the exponent delta against the
    opened Õ(p^{1/4}) baseline is 0.
  mechanism: >-
    The value n = 3 means the three kernels land on three distinct
    j-invariants, so this vertex has three distinct 2-isogeny
    neighbors and the simple-graph reading of degree 3 holds here.
    The value n < 3 means at least two kernels share a codomain
    j-invariant. Either outcome is a toy gate on one vertex of the
    graph used by F_p path-finding. Neither outcome is a walk, and
    neither changes the opened baselines Õ(p^{1/2}) and Õ(p^{1/4}).
    OBJECT FRAME. Representation: the j-invariant of a Vélu codomain
    of E, a curve invariant rather than a point coordinate. Operation
    set Sigma: the three 2-isogenies whose kernels are the order-2
    subgroups of E, together with their duals. Sigma is not
    translation on E(F_67). TRICHOTOMY: partial-action. Reason: Sigma
    contains only degree-2 isogenies out of this one curve.
    LOSSY-PROJECTION TEST against Sigma. Discarded: the three kernel
    x-coordinates and the codomain Weierstrass coefficients. Retained:
    the integer n. Distinct triples of codomain j-invariants can share
    one cardinality, so the projection is lossy.
  novelty_status: unverified
  citations:
    - ref: KN-TECH-024
      provenance: internal
      claim: >-
        The opened note states that the supersingular ell-isogeny
        graph is (ell+1)-regular on about p/12 vertices, and that
        generic path-finding is about O(p^{1/2}) classically and
        O(p^{1/4}) on the F_p subgraph. It gives no distinct-neighbor
        count at p = 67.
      verified_by: idea-generator, this session, via knowledge/techniques/KN-TECH-024.md
    - ref: KN-LIT-078
      provenance: internal
      claim: >-
        The opened note reports full-graph meet-in-the-middle at
        expected Õ(p^{1/2}) time and space, and Õ(p^{1/4}) on the
        F_p-rational subgraph. The paper PDF was not opened. No
        neighbor census at p = 67 is in the note.
      verified_by: idea-generator, this session, via knowledge/literature/KN-LIT-078.md
    - ref: KN-OPEN-013
      provenance: internal
      claim: >-
        The opened note reports no sub-p^{1/4} generic attack. This
        idea does not claim one.
      verified_by: idea-generator, this session, via knowledge/open-problems/KN-OPEN-013.md
  assumptions:
    - p = 67 is prime. The test checks that.
    - E is supersingular over F_67 exactly when #E(F_67) = 68. If that fails, n is not defined.
    - The three points with y = 0 are the full nontrivial 2-torsion. On this model they are the roots of x(x^2 + 1).
    - Codomains are identified by j-invariant, so F_67-twists with the same j contribute one value.
  predictions:
    - metric: absolute difference |n - 3|
      direction: different
      minimum_effect: 1
  minimal_test:
    design: >-
      On E: y^2 = x^3 + x over F_67, confirm #E(F_67) = 68. Factor
      x(x^2 + 1) over F_{67^2} and take the three roots x_T. For each,
      set t = 3 x_T^2 + 1 and w = x_T t, and form the codomain
      y^2 = x^3 + (1 - 5 t) x + (0 - 7 w). Compute its j-invariant in
      F_{67^2}. Set n to the number of distinct values among the three.
      Do not compute distances. Do not classify edges as internal or cut.
    controls:
      - The source point count is 68, and each codomain is supersingular by the trace test over its field of definition.
      - For each codomain, one dual 2-isogeny returns a curve with j(E). Failure invalidates the Vélu formula for that kernel.
      - Exactly three roots of x(x^2 + 1) are used. A missing root invalidates n.
      - Rebuilding E from its j and repeating the census yields the same set of codomain j-invariants.
    required_metrics:
      - point_count_E
      - kernel_x_count
      - n
      - codomain_j_list
  falsification_conditions:
    - n equals 3.
    - #E(F_67) is not 68, so the census is not run.
    - x(x^2 + 1) does not have three roots in F_{67^2}.
    - A dual 2-isogeny fails to restore j(E).
  confounders:
    - Counting kernels instead of distinct j-invariants always yields 3 and cannot see a collision. The metric is the distinct j count.
    - Identifying codomains by Weierstrass coefficients instead of j splits twists and can inflate n. The rule is j.
    - A codomain j defined over F_67 and the same integer lifted to F_{67^2} are one value. Field-of-definition tags are not part of n.
  interpretation_limits:
    - One curve at one prime. No statement about any other vertex or any larger p.
    - n = 3 means this distinct-neighbor defect is absent at this vertex. It does not close path-finding.
    - n < 3 is a collision of codomain j-invariants. It is not a shorter path-finding exponent.
    - Exponent delta against Õ(p^{1/4}) in the opened notes is 0.
    - Edges are not split into an internal count and a cut count. Distances are not computed.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The simple-graph reading of (ell+1)-regularity predicts n = 3
        at this vertex for ell = 2. That prediction is the null. It is
        not a theorem about distinct j-invariants at j = 1728. The
        sample is one curve at p = 67. No transfer is claimed.
      rigorous_support: >-
        KN-TECH-024, opened, states that the supersingular ell-isogeny
        graph is (ell+1)-regular. For ell = 2 that is degree 3 before
        any identification of codomain j-invariants. The test uses the
        three observed codomain j-invariants.
      validation_plan: >-
        Compute n once. The consistency checks are three kernel roots,
        supersingular codomains, dual restoration of j(E), and
        agreement across two source models. Sample size one has no
        tail. No second prime is drawn.
  target_complexity:
    time_exponent: >-
      Three degree-2 Vélu evaluations over F_{67^2}. Polynomial in
      the fixed p. No p^{1/4} path search is run.
    memory_exponent: >-
      Three field elements and three j-invariants. Memory is O(1) at
      p = 67.
    best_known: >-
      KN-LIT-078, opened note: Õ(p^{1/2}) full-graph meet-in-the-middle
      and Õ(p^{1/4}) on the F_p subgraph. Those algorithms are not run.
    hidden_overhead: >-
      No o(1) term. The prime p = 67 and the three kernels are
      explicit. The output is one integer n in 1..3.
    tradeoff_note: >-
      No time-memory tradeoff and no collision search. One vertex.
