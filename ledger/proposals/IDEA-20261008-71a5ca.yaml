  title: BDEB bounded-degree self-endomorphism evaluation binding
  class: mechanism
  claim: >-
    M=4D+1 full point evaluations bind every accepted degree<=D endomorphism
    representation to one rational map, so a mask from its canonical map is
    actual-message invariant. For the supplied polynomial bare-E scalar
    sampler, however, inversion is public and factors through one scalar;
    therefore this exact family is a typed obstruction, not an EndRing PKE.
  mechanism: >-
    Sample [a] with a^2<=D, evaluate it on M distinct public points, and accept
    any bounded-degree endomorphism matching every image. The difference of
    two accepted maps kills more points than its degree and must vanish,
    pending FORMAL-BDEB-1. Enumeration of a publicly inverts honest outputs
    while ignoring every complete End(E) basis.
  why_not_a_renamed_known_approach: >-
    It binds a source self-map by full evaluations, not a walk endpoint,
    parity mask, quotient curve, label transport, or code trapdoor. It remains
    adjacent to UTTK/CEST finite-witness controls because one endomorphism is
    sufficient; exact remote overlap is unverified.
