idea:
  id: IDEA-20260805-90df50
  question_id: RQ-MONO-001
  added: '2026-08-05'
  class: control
  title: >-
    The one Galois-flavoured statistic that is NOT identically trivial on the
    factor-base sublocus: the root-coincidence rate of the summation fibre, whose
    forced value is exactly 6(tau-1)/N at m=4 and 16tau/N + 24(tau-1)/N at m=5, is
    driven by the rational 2-torsion, and at m >= 5 is literally a relation counter.

  claim: >-
    GOAL-MONO-001 IS PAUSED ON A LITERAL QUESTION AND THIS RECORD ANSWERS IT. The
    next_action reads: "Either identify a statistic that discriminates ON that sublocus,
    or record a scoped no-go for the relation-rate half of KN-OPEN-009." EV-MONO-a0a89c
    OBS-5 shows the CYCLE TYPE is identically trivial there -- on the factor-base locus
    the summation fibre splits completely at every m, by the group law. But splitting
    completely is a statement about WHERE the roots live, and it says nothing about
    WHETHER THEY ARE DISTINCT. The root-multiplicity partition is a second Galois-side
    invariant of the same fibre, it is not implied by complete splitting, and it is not
    constant on the sublocus.

    THE STATISTIC. For a tuple (P_1,...,P_{m-1}) of factor-base points with distinct
    x-coordinates, let D = 2^{m-2} - #{distinct roots of S_m(x_1,...,x_{m-1},T)}. The
    roots are x(eps_1 P_1 + ... + eps_{m-1} P_{m-1}) over sign vectors modulo global
    negation, so two classes eps, eps' collide exactly when, with S = {i : eps_i != eps'_i},
      sum_{i in S} eps_i P_i  in  E[2]   or   sum_{i not in S} eps_i P_i  in  E[2].

    THE FORCED VALUE, DERIVED FROM COUNTING ALONE, BEFORE ANY RUN. Write N = #E(F_p) and
    tau = #E(F_p)[2] in {1,2,4}; note tau = Z + 1 where Z = #{x : f(x)=0}, so tau is the
    SAME curve invariant that already appears in EV-MONO-a0a89c OBS-3's exact m=3 density
    law. For uniform independent factor-base points, each branch contributes:
      |S| = 1  ->  probability 0   (P_i in E[2] would force f(x_i)=0, excluded);
      |S| = 2  ->  probability (tau-1)/N   (the E[2]-identity case is P_i = -+P_j,
                   i.e. x_i = x_j, excluded by the distinctness condition);
      |S| >= 3 ->  probability tau/N.
    Summing over the C(2^{m-2}, 2) unordered class-pairs:
      m = 4:  E[#colliding pairs] = 6 (tau-1)/N            [6 pairs, each (size 1, size 2)]
      m = 5:  E[#colliding pairs] = 16 tau/N + 24 (tau-1)/N [16 pairs (1,3); 12 pairs (2,2)]
    to leading order in 1/N.

    WHY THIS IS THE RIGHT KIND OF STATISTIC AND NOT A CURIOSITY.
    (E1) IT DISCRIMINATES ON THE SUBLOCUS, WHICH IS WHAT WAS ASKED FOR. Its value
    depends on the curve through tau, a genuine curve invariant, and it is defined on
    exactly the set where index-calculus relation search lives.
    (E2) IT CARRIES A NULL THAT CAN ACTUALLY FAIL, AND THE NULL IS FORCED TO ZERO. On a
    curve with tau = 1 (odd order, f irreducible) the m = 4 rate is EXACTLY 0 -- not
    small, zero -- while on a tau = 2 curve of comparable size it is 6/N. Two curves,
    same p, same protocol, forced values 0 and 6/N. This program's own census
    (relayed from the session ANGLE-BRIEF: 188 of 229 evidence records carry no positive
    control, and the two negative-window controls in this very lane pass for an EMPTY
    window) has repeatedly produced controls that cannot fail. This one can.
    (E3) AT m >= 5 IT IS A RELATION COUNTER. The |S| >= 3 branch is the event
    sum_{i in S} eps_i P_i = O, i.e. a VANISHING SIGNED SUBSET SUM OF FACTOR-BASE POINTS
    -- which is exactly an index-calculus relation of length |S|. So at m = 5 the
    coincidence rate is, term for term, 16/N times the density of length-3 signed
    relations plus a 2-torsion term. The "relation-rate half" of KN-OPEN-009 is
    therefore not merely adjacent to this statistic; at m >= 5 it is a summand of it.

  object_first_candidate:
    tracked_object: >-
      THE STABILIZER OF THE FIBRE UNDER THE SIGN TORSOR: the subgroup
      Stab = { eps in {+-1}^{m-1}/+-1 : sum eps_i P_i = sum P_i in x-coordinate },
      equivalently the set of nonempty proper subsets S with sum_{i in S} +- P_i in E[2].
      Followed through the computation: point tuple -> signed subset sums -> membership
      in E[2] -> collision pattern of the fibre -> root-multiplicity partition.
    established_families_off_limits: >-
      Off-limits AS THE PRIMARY LENS: (i) the Frobenius cycle-type census, which OBS-5
      shows is constant here and which is the instrument being replaced; (ii) smoothness
      / Dickman-rho yield modelling; (iii) Groebner solving-degree instrumentation;
      (iv) isogeny and class-group structure; (v) lifting-based relation sources
      (Xedni lineage); (vi) character-sum / Cayley-spectrum methods, which are the
      sibling proposal IDEA-20260805-a9a95d's lens and are deliberately excluded here so
      the two records are independently falsifiable.
    newness_score: >-
      The observation that two signed sums share an x-coordinate iff their difference or
      sum is 2-torsion is elementary; the counting is a first-year exercise. What is new
      is the USE: this corpus's monodromy lane measures cycle type and nothing else, and
      the record that closed the m = 3 case explicitly reports the cycle-type statistic
      as degenerate on the attack locus without asking what else the same fibre carries.
    testability_score: >-
      Total, and unusually cheap: pure-Python group arithmetic on toy curves, thousands
      of tuples per second, with an exact forced value per curve computed from (N, tau)
      before the run.
    survival_score: >-
      Survives at every m and every curve; the effect size is O(1/N) and therefore
      vanishes asymptotically, which is stated up front as the record's main limitation
      rather than discovered later.

  mechanism: >-
    DERIVED HERE IN FULL.

    (1) COLLISION CRITERION. x(A) = x(B) iff A = +-B. With A = sum eps_i P_i and
    B = sum eps'_i P_i, the two conditions A - B = O and A + B = O become
    sum_i (eps_i - eps'_i) P_i = O and sum_i (eps_i + eps'_i) P_i = O. Since
    eps_i - eps'_i is 0 where they agree and +-2 where they differ, and eps_i + eps'_i is
    +-2 where they agree and 0 where they differ, with S = {i : eps_i != eps'_i} these are
      2 * sum_{i in S} eps_i P_i = O    and    2 * sum_{i not in S} eps_i P_i = O,
    i.e. the two displayed E[2] membership conditions. Working modulo global negation
    makes S and its complement interchangeable, and S is nonempty and proper.

    (2) THE THREE BRANCH PROBABILITIES. Under the model "P_i are independent uniform in
    E(F_p) conditioned on distinct x-coordinates and f(x_i) != 0":
      * |S| = 1: the condition is P_i in E[2]. E[2] = {O} union {(x,0) : f(x) = 0}. Both
        are excluded by hypothesis. PROBABILITY EXACTLY 0. This is why m = 4 has a
        tau = 1 null forced to zero: at m = 4 every class-pair has a singleton branch.
      * |S| = 2: the condition is P_i +- P_j in E[2], which is O (excluded: it means
        x_i = x_j) or one of the tau - 1 nonzero 2-torsion points. A sum of two
        independent uniform points is uniform, so PROBABILITY (tau-1)/N.
      * |S| >= 3: same, but the O case is now a genuine 3-or-more-term relation and is
        NOT excluded. PROBABILITY tau/N.

    (3) THE PAIR COUNT. Unordered pairs of distinct sign classes: C(2^{m-2}, 2). Each
    pair determines the partition {S, S^c}. At m = 4 the partitions of {1,2,3} into two
    nonempty parts are all of type (1,2), and there are 6 pairs, giving
    6 * [0 + (tau-1)/N] = 6(tau-1)/N. At m = 5 the partitions of {1,2,3,4} are of type
    (1,3) (4 of them) and (2,2) (3 of them); each partition carries 4 sign
    configurations, giving 16 pairs of type (1,3) contributing 16 * [0 + tau/N] and 12
    pairs of type (2,2) contributing 12 * [2(tau-1)/N] = 24(tau-1)/N. Total
    16 tau/N + 24 (tau-1)/N.

    (4) WHAT THE HIGHER-ORDER TERMS ARE, SO THE PREDICTION IS HONEST. The displayed
    values are E[#colliding pairs], which upper-bounds P(at least one collision) by the
    union bound with a defect of order (2^{2m}/N)^2. At m = 4 and N ~ 10^3 that defect is
    below 10^-4 absolute and is negligible against the leading term; at m = 5 it is
    larger and the contract reports both the expected pair count and the at-least-one
    probability separately rather than conflating them.

    (5) WHY THE 2-TORSION AND NOT SOMETHING ELSE. tau is the only curve-dependent
    quantity in the answer. This is a substantive prediction, not a tautology: a
    reasonable prior would be that CM curves, or j = 0 with its order-6 automorphism
    group, behave differently -- and the derivation says they do NOT, except through
    their tau. That gives a sharp nearby-object control (see minimal_test): a j = 0 curve
    and a random ordinary curve with the SAME tau and comparable N must give the SAME
    rate, and any difference falsifies the derivation. The corpus's own concern about
    j = 0/1728 automorphism artifacts (RQ-MONO-001 constraint 2, KN-OPEN-009's closing
    sentence) is thereby converted from a caveat into a testable equality.

  novelty_status: unverified

  novelty_screen:
    screened_on: '2026-08-05'
    corpus_paths_read:
      - ledger/evidence/EV-MONO-a0a89c.yaml
      - knowledge/open-problems/KN-OPEN-009.md
      - ledger/questions/RQ-MONO-001.yaml
      - ledger/goals/GOAL-MONO-001/goal.yaml
      - ledger/proposals/IDEA-20260803-ff7415.yaml
    findings:
      - >-
        EV-MONO-a0a89c OBS-4 and OBS-5 establish complete splitting on the factor-base
        locus and its m-independence. Neither observation, nor the goal record, nor
        RQ-MONO-001, nor KN-OPEN-009 mentions root multiplicity, distinctness, or the
        collision set. The gap is exact and is the whole opening.
      - >-
        The one prior proposal on this question, IDEA-20260803-ff7415, counts
        decompositions and explicitly counts them "not roots of the summation fibre";
        multiplicity is outside its measured event.
      - >-
        tau = Z + 1 links this statistic to the Z already carried in OBS-3's committed
        exact density formula, so the two statistics share a curve invariant and can be
        cross-checked on the SAME committed 105-curve panel at no extra cost.
    literature_verified: []
    literature_unverified:
      - >-
        NOT READ -- NO SOURCE LOCATED. Degeneracy loci of summation polynomials are the
        kind of thing that may well be recorded in the summation-polynomial literature;
        no source was read and none is cited. Searching is a declared contract stage.
    conclusion: >-
      novelty_status unverified. Elementary mathematics; the corpus gap is measured; the
      contribution is a non-degenerate statistic on the exact locus the paused goal says
      has none.

  lossy_projection_identifiability_audit:
    projection: >-
      Full factor-base tuple (P_1,...,P_{m-1}) -- (m-1) log N bits -- projected to the
      collision pattern, i.e. the subgroup Stab of the sign group, and then to the single
      integer D = 2^{m-2} - #distinct roots.
    what_is_discarded: >-
      The points, their coordinates, the order of the group, the curve's endomorphism
      ring, everything except which signed subset sums happen to land in E[2].
    why_genuinely_lossy: >-
      The fibre over D = 0 is (1 - O(2^{2m}/N)) of the entire tuple space, so the
      projection retains O(2^{2m}/N) worth of information per tuple.
    why_compatible_with_the_targets_operations: >-
      The collision pattern is determined by group-law relations among the P_i, and the
      group law is the target's operation. Applying an automorphism, a translation of the
      whole tuple by a fixed point, or Frobenius maps collision patterns to collision
      patterns. So the retained part propagates deterministically.
    is_it_only_a_change_of_coordinates: >-
      NO. Checked against the (Delta, Pi) = (x xor y, x*y) failure: there the discarded
      data was recoverable as the roots of a quadratic. Here the tuple is not recoverable
      from D on cardinality grounds -- N^{m-1} inputs, a handful of outputs.
    mirror_failure_check: >-
      CHECKED, AND IT IS THE SERIOUS RISK FOR THIS OBJECT. A statistic whose value is 0
      on essentially every instance has near-zero comparator spread and is close to being
      a constant of the apparatus. That is why the design fixes the sample size FROM THE
      FORCED VALUE: at m = 4, tau = 2, N ~ 10^3, the rate is ~6/N ~ 0.006, so 20,000
      tuples give ~120 events and a relative standard error near 9 per cent. The spread
      is small but it is real, computed in advance, and the tau = 1 arm is forced to
      exactly 0 -- a two-valued comparator (0 versus 6/N) that is as far from constant as
      a rare-event statistic can be. STATED PLAINLY: this is the weakest of the three
      sibling proposals on exactly this axis, and the record says so rather than letting
      a reviewer find it.

  predictions:
    - metric: >-
        coincidence rate at m = 4 on the factor-base sublocus, distinct x_i, on curves
        with tau = 1
      direction: lower
      minimum_effect: >-
        EXACTLY 0 events in >= 20,000 tuples per curve. Not "small": zero. A single
        observed collision on a tau = 1 curve at m = 4 falsifies the derivation outright.
    - metric: >-
        coincidence rate at m = 4 on curves with tau = 2
      direction: higher
      minimum_effect: >-
        6/N, within 3 binomial standard errors. Pre-registered numerically per curve from
        (N, tau) before the run; e.g. 6/342 = 0.01754 for a curve of order 342 and
        6/1056 = 0.00568 for one of order 1056.
    - metric: >-
        coincidence rate at m = 4 on curves with tau = 4 (full rational 2-torsion)
      direction: higher
      minimum_effect: >-
        18/N, within 3 binomial standard errors. With the two rows above this is a
        GRADED CONTROL with three interior points and a forced linear law in (tau - 1):
        0, 6/N, 18/N. Monotonicity and the slope are both reported.
    - metric: >-
        coincidence rate at m = 5 on curves with tau = 1
      direction: higher
      minimum_effect: >-
        16/N, within 3 binomial standard errors. THIS IS THE SHARPEST PREDICTION IN THE
        RECORD: the same curve is forced to give exactly 0 at m = 4 and exactly 16/N at
        m = 5, so the statistic must switch on with m on an object where the 2-torsion
        contributes nothing. A model in which the effect is a 2-torsion artifact cannot
        produce it.
    - metric: >-
        j = 0 / j = 1728 versus random-ordinary equality at matched (tau, N)
      direction: same
      minimum_effect: >-
        Rates agree within 3 standard errors. The derivation forces this; the
        long-standing automorphism-artifact worry in this lane predicts it might not. A
        disagreement is the most interesting available outcome and would mean the
        derivation missed a curve-dependent term.

  minimal_test:
    design: >-
      Three stages, cheapest first. STAGE 0 (zero compute): compute N and tau for every
      curve on the pinned panel and emit the forced-value table BEFORE any tuple is
      drawn; the table is the pre-registration. STAGE 1 (pure-Python, minutes): draw
      >= 20,000 factor-base tuples per (curve, m) cell for m = 4 and m = 5, compute the
      2^{m-2} signed sums by group arithmetic, count distinct x-coordinates, and report
      both E[#colliding pairs] and P(at least one collision). STAGE 2: controls below.
      Stage 0 can terminate the line: if the panel contains no tau = 1 and no tau >= 2
      curve at comparable N, the graded control does not exist and the cell is not worth
      running.
    controls:
      - >-
        NULL OBJECT OF THE SAME SHAPE, FORCED TO ZERO, ABLE TO FAIL. The tau = 1 curves
        at m = 4. Same code path, same tuple count, same factor base construction; forced
        value exactly 0. If any collision appears there the derivation is wrong.
      - >-
        POSITIVE CONTROL WITH A PLANTED EFFECT (MANDATORY). On a tau >= 2 curve, PLANT
        collisions: choose P_1 uniformly and set P_2 = P_1 + T for the nonzero 2-torsion
        point T, so the pair {1,2} branch fires by construction and every planted tuple
        MUST report a collision. Forced detection rate 100 per cent. If the instrument
        misses planted collisions it cannot report an absence of natural ones and NO
        NEGATIVE MAY BE REPORTED (inventor protocol section 3).
      - >-
        GRADED CONTROL, 3 INTERIOR POINTS, MONOTONICITY REPORTED: tau in {1, 2, 4} with
        forced rates 0, 6/N, 18/N at m = 4. Report the fitted slope against (tau - 1)/N;
        the forced slope is 6.
      - >-
        SECOND GRADED CONTROL IN m: the same tau = 1 curve at m = 4 and m = 5, forced 0
        and 16/N. This separates "2-torsion effect" from "subset-sum-relation effect",
        which no single-m design can do.
      - >-
        SCALE CONTROL: the same tau at two primes with N differing by a factor >= 3. The
        rate MUST fall like 1/N. A rate that does not decay as N grows is the canonical
        artifact tell (inventor protocol section 3) and is the specific failure this
        control exists to catch.
      - >-
        DISTINCTNESS CONTROL: tuples with repeated x_i are excluded and counted
        separately. Pooling them injects the |S| = 2 identity branch and inflates the
        rate by an amount comparable to the whole effect.
    required_metrics:
      - forced-value table (curve, N, tau, m, predicted rate) emitted before any draw
      - observed collision counts, expected-pair-count and at-least-one-probability, separately
      - per-cell binomial standard error and z against the forced value
      - planted positive-control detection rate
      - excluded-tuple counts by exclusion reason
      - fitted slope in (tau-1) and fitted exponent in N

  falsification_conditions:
    - >-
      Any collision at m = 4 on a tau = 1 curve. The derivation is wrong; the record is
      withdrawn by a superseding record.
    - >-
      Measured rate outside 3 standard errors of the forced value on any cell where the
      planted positive control passed.
    - >-
      The m = 5, tau = 1 rate coming out at 0 rather than 16/N. Then the |S| >= 3 branch
      is wrong and the relation-counter interpretation (E3) collapses.
    - >-
      The rate failing to scale as 1/N across the scale control.
    - >-
      The planted positive control failing. Nothing may be reported at all --
      instrument outcome, never mathematical evidence (AGENTS.md rule 5).

  confounders:
    - >-
      SAMPLING MODEL. "Uniform independent factor-base points" is not exactly what an
      implementation does: drawing an x-coordinate and applying a fixed sign rule gives a
      point whose sign is a deterministic function of x, which is not the same as a
      uniform point. The derivation's branch probabilities are insensitive to this at
      leading order but not exactly. A SESSION-COMPUTED check (below) found agreement at
      -0.4 sigma on one curve and +1.9 sigma on another, and the +1.9 sigma cell is the
      first thing the contract must explain rather than absorb.
    - >-
      RARE-EVENT STATISTICS. At 20,000 tuples and a rate of 6/N the counts are in the
      hundreds at N ~ 300 and the low hundreds at N ~ 1000; at N ~ 10^4 the cell needs
      proportionally more tuples. The contract fixes the tuple count FROM the forced
      value rather than by convention.
    - >-
      NON-CYCLIC GROUPS. tau = 4 forces E(F_p) non-cyclic. An implementation indexing the
      group by a single discrete log will be wrong exactly on the most informative arm.
    - >-
      TOY SCALE AND VANISHING EFFECT. The effect is O(1/N) and therefore has NO
      asymptotic content whatsoever. It is a curve-family discriminator at toy scale and
      nothing more; any citation must carry that.
    - >-
      m = 5 COST. 8 signed sums per tuple instead of 4, plus a larger higher-order
      correction. Both are handled by reporting the two collision statistics separately.

  interpretation_limits:
    - >-
      CLAIM TIER toy. No ECDLP cost, exponent, crypto-scale or deployed-scheme claim, in
      any direction.
    - >-
      THIS MOVES NO EXPONENT AND THE RECORD SAYS SO WITHOUT HEDGING. A rate of O(1/N)
      cannot change any relation-collection cost by more than a 1 + O(1/N) factor. Its
      value is (a) it discharges the literal question GOAL-MONO-001's next_action poses,
      (b) it supplies a control that can fail in a lane whose existing negative-window
      controls pass for an empty window, and (c) at m >= 5 it is a direct, cheap measure
      of short-relation density on the factor base.
    - >-
      IT DOES NOT ANSWER KN-OPEN-009's relation-rate half on its own. The dominant
      relation-rate question is the second-moment question of IDEA-20260805-a9a95d; this
      record supplies a rare-event side channel to it, and the two must not be conflated.
    - >-
      IT IS NOT A NO-GO. Recording a scoped no-go for the relation-rate half was the
      alternative GOAL-MONO-001's next_action offered; this record deliberately takes the
      other branch, because a no-go recorded before a discriminating statistic had been
      looked for would be a fatigue report under inventor protocol section 4.
    - >-
      NO STATUS CHANGE to any record is proposed or implied.

  heuristic_assumptions:
    - id: HEUR-COIN-1
      formal_statement: >-
        For factor-base points drawn by the declared construction, sums of two or more
        distinct P_i are uniform on E(F_p) to within o(1/N) relative error, so
        P(sum in E[2]) = tau/N to leading order.
      rigorous_support: >-
        Exactly true for independent uniform points; the declared construction draws
        x-coordinates uniformly from the factor base and fixes the sign by a rule, so the
        points are uniform on a set of size ~N/2 closed under nothing in particular. THE
        GAP IS REAL AND IS THIS RECORD'S LOAD-BEARING ASSUMPTION.
      validation_plan: >-
        Measure both sampling conventions -- fixed-sign rule and random-sign -- in
        separate arms and report the difference. If they differ beyond the forced value's
        error the assumption is refuted and the correct statement is convention-dependent.
        The +1.9 sigma session-computed cell is the specific reason this is an arm rather
        than a footnote.
    - id: HEUR-COIN-2
      formal_statement: >-
        The union-bound defect (double collisions) is negligible at the tested (m, N).
      rigorous_support: >-
        Second-order term is O((2^{2m}/N)^2); at m = 4 and N >= 300 this is below 4e-4
        absolute against a leading term of 2e-2.
      validation_plan: >-
        Report expected-pair-count and at-least-one-probability separately; their ratio
        measures the defect directly.
    - id: HEUR-COIN-3
      formal_statement: >-
        The root set of S_m at a factor-base tuple is exactly the set of signed-sum
        x-coordinates, with multiplicity given by the collision pattern.
      rigorous_support: >-
        The set statement is EV-MONO-a0a89c OBS-5, independently verified there at 193/193
        for m = 4. The MULTIPLICITY refinement is derived here and is not in that record.
      validation_plan: >-
        On a subsample, construct S_4 explicitly by the resultant recursion
        S_4 = Res_X(S_3(x_1,x_2,X), S_3(x_3,T,X)) and compare its factorization
        multiplicities against the predicted collision pattern. Note that
        EV-MONO-a0a89c records its own red team getting garbage from a coefficient typo
        on the first S_4 attempt; a coefficient-level fixture check is therefore required
        before this arm is believed.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS MOVED, stated plainly. The measured quantity is O(1/N) and is a
      curve-family discriminator, not a cost term. If this record were dressed as an
      exponent result it would be cofactor polishing, and docs/target-result-profile.md
      forbids that dressing.
    memory_exponent: n/a
    best_known: >-
      Pollard rho at O(sqrt(N)) time and O(1) memory remains the prime-field baseline
      (KN-OPEN-001).
    hidden_overhead: none charged; no algorithm proposed
    tradeoff_note: n/a

  dominated_by: >-
    n/a (no attack, no Pareto point), and the check is listed rather than asserted. Rows
    examined: TIME -- Pollard rho sqrt(N), van Oorschot-Wiener parallel collision, the
    index-calculus family of KN-OPEN-001/002: none is competed with. MEMORY -- rho at
    O(1); the instrument here is O(2^{m-2}) points of working memory per tuple, i.e.
    bytes, charged and irrelevant. DATA/QUERIES -- none; public curve data only, no
    oracle. On the QUESTION, the incumbent statistic on this sublocus is the cycle type,
    whose spread there is exactly zero; a statistic with nonzero spread is not
    "dominated" by one with none, and no such comparison is claimed.
  sota_delta: >-
    Zero on every attack axis. On the instrument: from a statistic with comparator spread
    identically 0 on the factor-base sublocus (EV-MONO-a0a89c OBS-5) to one whose forced
    values on that same sublocus are 0, 6/N and 18/N across tau in {1,2,4} and 0 versus
    16/N across m in {4,5}. Quantitatively: two forced contrasts with ratio infinity
    (0 versus nonzero), which is the largest available separation for a rare-event
    statistic, at an effect size of O(1/N) which is the smallest available magnitude.
    Both halves of that sentence are the honest description.

  estimated_cost:
    implementation: low
    compute: low
  compute_budget_note: >-
    Pure-Python elliptic-curve arithmetic over F_p at p <= about 3000; 20,000 tuples per
    cell at m = 4 is seconds, at m = 5 is tens of seconds. No CAS, no solver. VERIFIED IN
    THIS ENVIRONMENT 2026-08-05: numpy 2.4.6 imports; sympy and sage do not. Nothing here
    needs either. The optional explicit-S_4 arm needs only integer polynomial arithmetic,
    which is also pure Python.
  recommended_priority: medium

  honest_prior_of_survival: 0.8
  honest_prior_of_survival_note: >-
    0.8 that the forced values survive at the tested cells. Not higher because the
    sampling model (HEUR-COIN-1) is genuinely approximate, because one of two
    session-computed tau = 2 cells sat at +1.9 sigma rather than within 1, and because
