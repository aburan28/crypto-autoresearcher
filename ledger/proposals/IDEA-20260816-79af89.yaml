idea:
  id: IDEA-20260816-79af89
  question_id: RQ-HAWK-001
  added: '2026-08-16'
  title: Treat the public quadratic form as the first rung of a projection ladder rather than as the
    instance, and find the first rung at which the re-randomisation action stops acting deterministically,
    delivering an honest lossy-projection verdict that names which rungs are mere changes of coordinates.
  class: representation
  claim: '(A) Everything in the nrd-PIP lane operates on the public Gram matrix G, and every downstream
    record - the conjugation re-randomisation, the reduction to nrd-PIP, the Case C bounded-denominator
    argument in EV-HAWK-c99848 - treats G as the object. Under docs/inventor-protocol.md section 2
    that is a claim requiring a test, and the test has never been applied to G in this corpus. (B)
    The claim is that G sits on a ladder of successively coarser representations - rung 0, the secret
    basis B; rung 1, the Gram matrix G = B-transpose B; rung 2, the R_n-quadratic form together with
    its module structure; rung 3, the isometry class; rung 4, the genus or a computable genus-like
    symbol; rung 5, a truncated theta-series prefix; rung 6, a single scalar such as the determinant
    - and that the honest verdict differs at every rung. Specifically: rung 1 is genuinely lossy relative
    to rung 0, discarding exactly the left orthogonal factor, and this is the loss the whole LIP problem
    is built on; but rungs 1 to 3 relative to each other are largely a change of coordinates for the
    purposes of the conjugation action, because that action is by definition an isometry-class-preserving
    re-representation, so the interesting content lives at rungs 4 and above. (C) The claim is that
    the ladder has a determinable BREAK POINT: the lowest rung at which the re-randomisation step
    G maps to U-star G U ceases to act as a well-defined deterministic map on the representation,
    becoming either constant (the representation is an invariant, so the action is trivial and the
    rung carries no information about which re-randomisation was applied) or ill-defined (the representation
    is not a function of the isometry class). Locating that break point is a finite, exactly computable
    question at toy ring degree, and it tells any successor construction which representation it is
    allowed to track. (D) NOT CLAIMED: that any rung yields an attack, a distinguisher or a speedup;
    that the ladder is complete or canonical; that HAWK''s actual public key is of the constructed
    shape - instances are HAWK-SHAPED by declared rule per H-HAWK-c7a551, and this program has not
    read the Round-3 specification; that KN-OPEN-028 is reopened, its closures being consumed here
    as settled; and no statement about HAWK''s security in either direction.'
  mechanism: 'Stage 1 writes the ladder down explicitly with, for each rung, the exact map from the
    rung below and the exact information discarded, stated algebraically and not in prose. Stage 2
    applies the section 2 test rung by rung: for rung k, exhibit either a reconstruction of rung k-1
    from rung k (in which case rung k is a change of coordinates and is recorded as such, exactly
    as the Delta-Pi example in docs/inventor-protocol.md is recorded), or an explicit pair of distinct
    rung k-1 objects with equal rung k images (a genuine collision, which is the proof of lossiness
    and is also the observation-collision audit of inventor-protocol section 8 item 2). At toy ring
    degree these collisions are exhibited by exhaustive search, not asserted. Stage 3 defines, for
    each rung, the induced action of the re-randomisation step and classifies it into one of three
    cases: faithful, meaning distinct U give distinct rung images; trivial, meaning all U give the
    same image so the rung is an invariant; or ill-defined, meaning the image depends on the choice
    of representative rather than on the class. Stage 4 locates the break point as the lowest rung
    whose classification is trivial or ill-defined, and reports it as an integer per ring degree.
    Stage 5 runs the identical classification against a null object - a random integral lattice of
    the same dimension and determinant with no module structure - so that any rung-dependence found
    is checked against what the same ladder does on an unstructured object. Stage 6 emits the ladder,
    the per-rung verdict with its witnessing collision or reconstruction, the break point, the null
    comparison, and the explicit statement of which rungs any successor may track.'
  novelty_status: unverified
  novelty_screen:
    method: Grep -ril 'quadratic form' over ledger/proposals/ returned 49 files; grep -ril 'Gram matrix'
      returned 21; grep -ril 'theta series' returned 3 (IDEA-20260805-fc6361, IDEA-20260806-a3ef00,
      IDEA-20260805-637a3b); grep -ril 'genus' returned 42; grep -ril 'spinor' returned 3 (IDEA-20260807-6cdff2,
      IDEA-20260811-444b45, IDEA-20260806-a3ef00). Inspected headers of IDEA-20260815-528b6e, IDEA-20260808-baf8bc,
      IDEA-20260806-c5d183 and IDEA-20260811-565915. Read docs/inventor-protocol.md sections 1, 2
      and 8 in full. Read knowledge/open-problems/KN-OPEN-027.md and KN-OPEN-028.md in full, ledger/evidence/EV-HAWK-c99848.yaml
      and EV-HAWK-21edba.yaml in full, and knowledge/techniques/KN-TECH-081.md.
    results: 'The tracked-object and lossy-projection lane in this repository is heavily occupied
      but on the ECDLP side: IDEA-20260806-c5d183 proves a five-line orbit argument forcing every
      lossy ECDLP object into three classes and feeds KN-OPEN-019; IDEA-20260815-528b6e extends the
      group-law rigidity theorem from objects on points to objects on pairs. Both are named in the
      anti-duplication list as owning the ECDLP tracked-object taxonomy space, and neither concerns
      lattices. The genus and spinor hits are concentrated on the isogeny side, principally IDEA-20260806-a3ef00,
      which decomposes EndRing information into genus, spinor and residual global bits on the Gross
      lattice - the same DECOMPOSITION IDEA applied to a completely different object, and the nearest
      methodological relative of this entry anywhere in the corpus. No proposal builds a representation
      ladder for the HAWK public form or asks where the re-randomisation action degenerates on it.
      KN-OPEN-028''s Q2 closure notes the re-randomisation is ''a search over instance representations
      rather than over solutions'' but does not enumerate the representations.'
    verdict: 'UNVERIFIED. Claimed new: the explicit seven-rung ladder for the HAWK-shaped public form,
      the per-rung faithful/trivial/ill-defined classification of the re-randomisation action, and
      the break-point integer as the deliverable that tells a successor which representation it may
      track. Assembled from known parts: the lossy-projection test itself is docs/inventor-protocol.md
      section 2 verbatim, including the requirement to declare a non-lossy rung a change of coordinates;
      the observation-collision audit is section 8 item 2; the decomposition-into-information-strata
      move is exactly what IDEA-20260806-a3ef00 does on the Gross lattice, and this entry is that
      move transplanted to a different object, which is stated rather than hidden; the genus and theta-series
      notions are standard. No claim about external literature is made or possible here.'
  object_first_candidate:
    tracked_object: 'The representation ladder itself: an ordered chain of maps rung 0 (secret basis)
      to rung 6 (determinant), with the re-randomisation action''s induced behaviour attached at each
      rung. What is followed through the computation is not any single representation but the classification
      vector - one label per rung - as ring degree varies.'
    lossiness: 'Split verdict, delivered honestly per rung, which is the whole point of the entry.
      Rung 0 to rung 1 (basis to Gram) is genuinely lossy: the left orthogonal factor is discarded
      and cannot be recovered, and this discard is compatible with the operations because unimodular
      re-basing acts on Gram matrices by congruence. Rung 1 to rung 2 (Gram to R_n-quadratic form
      plus module structure) DISCARDS NOTHING for module instances - the module structure is recoverable
      from the Gram matrix by finding the commuting R_n-action - and is therefore recorded as a change
      of coordinates, not a new object, in the exact sense of the Delta-Pi example in section 2. Rung
      2 to rung 3 (to isometry class) is lossy only in the sense of quotienting by the group the problem
      already quotients by, so it is lossy relative to a basis and trivial relative to the action.
      Rungs 4, 5 and 6 (genus symbol, theta prefix, determinant) are genuinely lossy and the losses
      are exhibitable by explicit collisions at toy degree. Stating that rungs 1 to 3 are largely
      coordinate changes is the uncomfortable half of the verdict and is stated first rather than
      buried.'
    propagation: 'One step of the target operation - conjugation G maps to U-star G U by a short unimodular
      U - propagates as follows: at rung 1 it acts faithfully (distinct U generally give distinct
      Gram matrices); at rung 3 it acts trivially by definition (the isometry class is preserved);
      at rungs 4 to 6 it acts trivially a fortiori, since those factor through rung 3. The propagation
      is therefore deterministic and completely understood at rungs 3 and above and is the informative
      question only at rungs 1 and 2, where whether the action is faithful is a computable finite
      question about stabilisers.'
    survival_score: The structure survives from rung 0 to the break point and dissolves there. The
      concrete prediction is that the break point is rung 3 - the action becomes trivial as soon as
      one passes to the isometry class - and the deliverable is the confirmation or refutation of
      that integer at ring degrees 4, 8 and 16, together with the stabiliser sizes at rungs 1 and
      2 that make the rung-1 and rung-2 actions less than faithful. A break point of 2 rather than
      3 (the action already trivial at the R_n-quadratic form) would be the surprising outcome and
      would materially constrain the re-randomisation idea.
  null_object_control: The null object is a random integral lattice of the same dimension 2n and the
    same determinant, generated without any R_n-module structure, put through the IDENTICAL ladder
    and the IDENTICAL faithful/trivial/ill-defined classification in the same invocation, with conjugation
    by the same generating set of short unimodular matrices. For the signal arm to mean anything,
    the null must show a break point at the same rung for the rungs that are structure-independent
    (3 and above, where triviality is forced by construction) and must show a MEASURABLY DIFFERENT
    stabiliser size at rungs 1 and 2, where module structure supplies extra stabilising elements.
    If the null shows identical stabiliser sizes at rungs 1 and 2, then the ladder is reading dimension
    and determinant rather than module structure, and every signal-arm number is void.
  discriminated_from:
  - 'IDEA-20260806-c5d183 and IDEA-20260815-528b6e (ECDLP tracked-object and rigidity lane): named
    in the anti-duplication list as owning the ECDLP taxonomy space. This entry is on lattices and
    quadratic forms, uses a different operation (congruence by unimodular matrices, not group translation),
    and produces a break-point integer rather than a class partition of maps.'
  - 'IDEA-20260806-a3ef00 (Gross-lattice genus/spinor/residual decomposition): the closest methodological
    relative - the same ''decompose the object''s information content into strata'' move - but applied
    to the endomorphism-ring object on the isogeny side. Different object, different operation, different
    corpus lane; named here rather than left unnamed.'
  - 'EV-HAWK-c99848''s Case C argument: that operates on the number-field O_F ideal count downstream
    of the reduction; this entry never leaves the lattice/quadratic-form side and never touches ideal
    counting.'
  - 'IDEA-20260805-6eac55 and IDEA-20260808-b1358c (tau-cocycle and involution lattices): those construct
    specific auxiliary lattices from Galois symmetries; this entry constructs no new lattice and only
    classifies representations of the given one.'
  - 'A bare ''invariants of quadratic forms'' survey: the entry''s content is not the invariants but
    the per-rung classification of how the re-randomisation ACTS, and specifically the requirement
    that each lossiness claim be witnessed by an exhibited collision or an exhibited reconstruction
    rather than asserted.'
  assumptions:
  - The R_n-module structure is recoverable from the Gram matrix at toy ring degree by an exact-integer
    search for the commuting action; if it is not recoverable in practice, the rung-1-to-rung-2 verdict
    changes from change-of-coordinates to lossy and the entry's most uncomfortable claim is refuted,
    which is a fine outcome.
  - A computable genus-like symbol exists at these dimensions using only exact integer arithmetic
    and local invariants at small primes; if not, rung 4 is replaced by a declared computable surrogate
    and the substitution is recorded as a scope limit.
  - Exhaustive or near-exhaustive collision search at rungs 4 to 6 is feasible at 2n up to 32 within
    budget.
  - Stabiliser computation at rungs 1 and 2 over the declared generating set is feasible; stabilisers
    are computed with respect to the finite generating set actually used, not the full unimodular
    group, and this restriction is stated with every number.
  predictions:
  - metric: break point rung index (lowest rung at which the conjugation action is trivial or ill-defined)
    direction: different
    minimum_effect: 'forced value: 3, the isometry class. A measured break point of 2 refutes the
      entry''s structural picture and is the informative surprise'
  - metric: stabiliser size at rung 2 (module arm) divided by stabiliser size at rung 2 (null arm),
      over the declared generating set
    direction: higher
    minimum_effect: 2.0; below this the ladder is not seeing module structure at rung 2
  - metric: number of exhibited rung-4 collisions (distinct isometry classes with equal genus-like
      symbol) at ring degree 8
    direction: higher
    minimum_effect: at least 1; zero collisions at this scale means rung 4's lossiness is unwitnessed
      and must be reported as unwitnessed rather than assumed
  - metric: rung-1-to-rung-2 reconstruction success rate (recovering the R_n-action from the Gram
      matrix)
    direction: higher
    minimum_effect: 0.95 across the sampled instances; below that, the change-of-coordinates verdict
      is withdrawn
  minimal_test:
    design: 'The ladder statement and the per-rung algebraic verdict cost nothing and are the primary
      deliverable; if the rung-1-to-rung-2 reconstruction is exhibited on paper the entry''s most
      contentious claim is settled before any run. The measured half is small: at ring degrees 4 and
      8, generate 100 HAWK-SHAPED instances by the declared rule and 100 null lattices matched on
      dimension and determinant, in one invocation. For each, attempt the rung-2 reconstruction (search
      for a commuting R_n-action in exact integer arithmetic) and record success. For each, conjugate
      by every word of length at most 3 in the declared short-unimodular generating set and record,
      per rung, how many distinct rung-images arise - giving the faithful/trivial classification and
      the stabiliser size directly as a count. At rung 4 attempt collision search across the pooled
      instance set. The discriminating outputs are the break-point integer per arm, the rung-2 stabiliser
      ratio between arms, and the reconstruction success rate. Cost is minutes at degree 4 and under
      a few hours at degree 8.'
    controls:
    - 'Null arm: random integral lattice of matched dimension and determinant, no module structure,
      same ladder, same generating set, same invocation.'
    - 'Trivial-action sanity control: conjugation by the identity word must give exactly one rung-image
      at every rung; failure indicates a bug in the representation code, not a finding.'
    - 'Reconstruction control: run the rung-2 reconstruction search on the NULL lattices, where it
      should overwhelmingly fail; a high success rate there means the search is finding spurious actions.'
    - 'Collision control at rung 6: the determinant is matched across arms by construction, so rung
      6 must show total collision; observing anything else means the matching failed.'
    - 'Generating-set dependence control: repeat the faithful/trivial classification with a second
      declared generating set and report both, since stabiliser sizes are defined relative to the
      set.'
    required_metrics:
    - break point rung index, per arm, per ring degree
    - distinct rung-image count per rung per instance (the raw stabiliser data)
    - rung-2 reconstruction success rate, per arm
    - number and witnesses of rung-4 collisions
    - rung-6 collision confirmation (determinant matching audit)
    - classification stability across the two generating sets
  falsification_conditions:
  - The rung-2 reconstruction succeeds on the null lattices at a comparable rate, meaning the search
    finds spurious module structures and the change-of-coordinates verdict is unsupported.
  - The measured break point is the same for module and null arms at every rung including 1 and 2,
    meaning the ladder does not distinguish structured from unstructured objects and is reading dimension
    and determinant only.
  - The classification flips between the two generating sets, meaning stabiliser-based classification
    is an artifact of the set rather than a property of the action.
  - No rung-4 collision is found at any tested degree, leaving that rung's claimed lossiness unwitnessed
    - reportable as unwitnessed, not as refuted.
  - The rung-1-to-rung-2 reconstruction fails on module instances, refuting the entry's central and
    deliberately uncomfortable claim that rung 2 is a change of coordinates.
  confounders:
  - Stabiliser sizes measured over a finite generating set are not stabiliser sizes in the full unimodular
    group, and the gap grows with word length; every number must carry its word length.
  - The genus-like symbol at rung 4 is a surrogate if a full genus computation is unavailable, and
    a weak surrogate collides more, inflating the collision count for reasons unrelated to lossiness.
  - Determinant matching between arms forces rung-6 collision by construction, so any claim about
    rung 6 is vacuous and must be labelled vacuous rather than counted.
  - The declared HAWK-SHAPED generation rule may produce instances with atypically large automorphism
    groups, inflating rung-1 and rung-2 stabilisers on the module arm for reasons of the rule rather
    than of module structure - which the null arm cannot fully control since it uses a different rule
    by necessity.
  - Exhaustive collision search at rung 4 is budget-limited, so absence of collisions is confounded
    with budget and must be reported jointly with the search size.
  interpretation_limits:
  - A break point is a statement about which representations can carry information about the re-randomisation,
    not about whether any of them yields an attack; no attack follows from any value.
  - All measurements are at ring degrees 4 and 8 on HAWK-SHAPED declared-rule instances, not on HAWK;
    RQ-HAWK-001's own constraint block forbids treating these as statements about deployed parameters.
  - 'Declaring rungs 1 to 3 a change of coordinates is a statement about information content, not
    about computational cost: two representations can be equivalent in information and wildly different
    in the cost of extracting anything from them.'
  - Nothing here bears on the ECDLP, and nothing here reopens any question closed in KN-OPEN-028.
  target_complexity:
    time_exponent: No attack exponent is claimed. Ladder classification costs at most (generating-set
      size to the word length) times the per-rung representation cost, all polynomial at fixed degree;
      rung-4 collision search is the only exponential-flavoured step and is budget-capped.
    memory_exponent: No attack memory exponent is claimed. Storage is a table of rung-images, megabytes
      at ring degree 8.
    best_known: For HAWK-shaped key recovery, Straznickas-Weis unconditional 2^{(n/2+1)+o(n)} (KN-LIT-7592)
      is the incumbent. For the specific question of which representation of the public form carries
      information about the re-randomisation, this corpus records no incumbent statement, which is
      why the break point is worth an integer.
    hidden_overhead: The algebraic verdicts at each rung are the real work and are entirely human;
      the code is trivial by comparison. The largest hidden cost is choosing a computable genus surrogate
      honestly - a surrogate chosen for convenience will silently determine the rung-4 result, and
      there is no automatic check for that.
  dominated_by: 'Checked against every route row in KN-OPEN-028''s live-surface table - Straznickas-Weis
    2^{(n/2+1)+o(n)} (KN-LIT-7592); nrd-PIP super-polynomial, underived (KN-LIT-7674); definite/indefinite
    LIP reporting HAWK unaffected (KN-LIT-7648); SLIP AM-intersect-coAM ceiling (KN-LIT-7671) - plus
    generic lattice reduction on the 2n-dimensional lattice. This entry claims no attack and enters
    no row: n/a (no result claimed).'
  sota_delta: 'No attack; representational and measurement contribution only. The quantities moved:
    the per-rung lossiness verdict for the HAWK-shaped public form goes from unstated to stated with
    exhibited witnesses, and the break-point rung index goes from unmeasured to an integer per ring
    degree with a null-arm comparison.'
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'Part (B), that the ladder is statable with a clean per-rung verdict:
    0.8, since the maps are elementary and the only real risk is the genus surrogate. Part (B)''s
    uncomfortable half specifically, that rung 1 to rung 2 is a change of coordinates: 0.6 - recovering
    a commuting R_n-action from a Gram matrix is plausible at toy degree but I have not done it and
    the search may be harder than it looks, in which case the verdict flips and the entry is more
    interesting, not less. Part (C), that the break point is exactly 3: 0.65, with the main alternative
    being 2. That the rung-2 stabiliser ratio between arms exceeds 2: 0.5, genuinely uncertain because
    the null arm''s automorphisms are not controlled by construction. Probability the whole thing
    is an elaborate restatement of ''the isometry class is the invariant'': 0.3, and if so the entry
    should be recorded as a change of coordinates under its own test.'
