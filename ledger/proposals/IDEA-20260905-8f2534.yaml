  assumptions:
  - Arity m=3 first; cover and base coordinates, including symmetric versus unsymmetric base, are explicit.
  - Special j=0,1728 appear as exception arms and never as random controls; signs and diagonals are retained with
    their correct weights.
  predictions:
  - metric: Stratum cardinalities, branch multiplicity, conditional relation rate and residual off the branch divisor
    direction: different
    minimum_effect: Apparent excess caused by branch concentration disappears under stratum-matched nulls; any off-locus
      residual has an explicit nonzero count.
  minimal_test:
    design: Review-only symbolic factorization of the m=3 discriminant, followed in a future task by exact finite
      fiber tables for self-generated p in {101,211}. Compare equal-size bases biased toward and away from named
      strata.
    proposal_only: true
    controls:
    - type: matched_null
      description: Random factor bases conditioned on the same stratum counts and rational 2-torsion type.
    - type: known_false
      description: A cover with full monodromy but a base concentrated entirely on a branch point must have non-generic
        fiber behavior; the theorem must permit it.
    - type: open_locus_residual_control
      description: Same fixed cover and equal masses on every named exceptional stratum; shift sampler mass epsilon
        from open u to open v with distinct rational multiplicities. Total relation mass changes by epsilon*(z(v)-z(u))
        and the revised model retains it in R_U, even though geometric monodromy is unchanged.
    required_metrics:
    - Stratum cardinalities, branch multiplicity, conditional relation rate and residual off the branch divisor
    - construction work, peak bytes, certificate size
    required_artifacts:
    - Exact fixtures
    - Independent certificates
    - Complete controlled outputs
    stopping_rule: First exact contradiction or stated finite panel; missing prerequisites and limits are inconclusive.
      No execution in this task.
  falsification_conditions:
  - The strata overlap without inclusion-exclusion correction, their union omits fibers, or a claimed monodromy
    consequence fails on a branch-concentrated control.
  - A claim that all excess is localized to named strata is refused unless an explicit bound on R_U is supplied;
    a nonzero R_U is an admitted outcome, not a contradiction of the accounting identity.
  confounders:
