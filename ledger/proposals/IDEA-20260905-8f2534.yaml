    bottleneck: Compact, complete certification of Disjoint branch-stratum intersection measure.
    baseline_embedding:
      named_baseline: Disjoint-stratum law of total expectation
      parameter_slice: Finite base X partitioned into disjoint named strata including open stratum U; identical
        fixed probability law mu and multiplicity z in arms A and B, with the same supplied frozen reference m_U
        used in both. The reference is arbitrary and need not equal their common open conditional mean.
      exact_expected_identity: M=sum_s mu(S_s) E_mu[z|S_s], with zero-mass strata contributing zero. Identical arms
        under the same frozen reference give M_A-M_B=0 and R_U,A-R_U,B=0. Each absolute residual equals mu(U)(E_mu[z|U]-m_U)
        and may be nonzero. If mu(U)=0 both absolute residual contributions are zero by convention without evaluating
        a conditional mean. Equal geometric monodromy alone fixes neither masses nor residuals.
      reproduction_check: Prospective symbolic subtraction of the two identical arm expressions under their common
        supplied frozen m_U must give zero mass difference and zero residual difference. If mu(U)>0 and m_U differs
        from the common open conditional mean, permit equal nonzero absolute residuals. No arithmetic verifier or
