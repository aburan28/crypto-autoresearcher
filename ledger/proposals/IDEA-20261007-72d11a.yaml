idea:
  id: IDEA-20261007-72d11a
  question_id: RQ-GFPN-c01af8
  added: '2026-10-07'
  status: proposed
  approved_by: null
  title: >-
    Multiplication count of t = x + b/x before a subfield membership test
  class: measurement
  claim: >-
    Over F_{p'^5} for the smallest prime p' >= 3 that admits a
    nonsingular double-odd curve y^2 = x(x^2 + a x + b) with b a
    nonsquare in the base field of the extension, a straight-line
    program in the monomial basis that computes t = x + b/x and then
    tests whether t lies in F_{p'} uses at least two multiplications
    more than a program that only tests whether x lies in F_{p'}.
    The same lower bound holds for a frozen nonsquare c that is not
    b, on a prime-order curve over the same field. The curve
    y^2 = x^3 + x is not used. The exponent 8/5 is unchanged and the
    delta versus Gaudry is 0.
  mechanism: >-
    Membership of one field element in the subfield is a linear
    condition on coefficients. Forming t requires an inversion and a
    multiplication by b before that linear test can start. The
    inversion is charged as multiplications in the monomial basis.
    The claim is an operation count, not a rank, and not a statement
    that the substitution changes an ideal degree.
  novelty_status: unverified
  citations:
    - ref: KR-IC-955fd6
      provenance: internal
      claim: >-
        Torsion symmetrization is priced as a constant about
        2^{omega(n-1)}, not as an exponent. This count is a piece of
        that constant, not a new exponent.
      verified_by: >-
        coordinator, 2026-10-07, opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-955fd6.yaml
    - ref: KR-IC-46d822
      provenance: internal
      claim: Gaudry's exponent at n = 5 is 8/5. Two multiplications do not move it.
      verified_by: >-
        coordinator, 2026-10-07, opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-46d822.yaml
  assumptions:
    - The basis is the monomial basis of the least irreducible of degree 5.
    - Addition and Frobenius-linear maps are not counted as multiplications. Inversion is counted by the multiplications in the frozen schoolbook inverse.
  predictions:
    - metric: extra multiplications to form t and test subfield membership, beyond the x-membership test
      direction: higher
      minimum_effect: at least 2
  minimal_test:
    design: >-
      Freeze the basis polynomial. Write the straight-line program
      for x in F_{p'} and the program for t = x + b/x followed by
      t in F_{p'}. Count multiplications. Repeat with a frozen
      nonsquare c on the prime-order arm. Do not enumerate points
      and do not build a Macaulay matrix.
    controls:
      - A basis polynomial that is reducible voids the run.
      - The x-only membership test must use zero multiplications. A nonzero count there voids the meter.
      - Swapping the names of the five coefficients must not change the multiplication count.
      - b = 0 is instrument_failure.
    required_metrics:
      - multiplications for the x-membership test
      - multiplications for the t-program
      - the difference
      - the same difference for the frozen c
  falsification_conditions:
    - The t-program uses fewer than 2 multiplications more than the x-membership test, after the x-only test has been confirmed to use zero multiplications.
    - The frozen-c program on the prime-order arm uses fewer than 2 extra multiplications while the double-odd arm uses at least 2. The cost is then special to b and the claim as stated for both arms is false.
  confounders:
    - A normal-basis implementation can change the multiplication count. The claim is only for the monomial basis named above.
    - Counting squarings as free would understate the inverse. Squarings are multiplications in this count.
  interpretation_limits:
    - The exponent 8/5 is unchanged. Two multiplications are inside the constant of KR-IC-46d822.
    - This does not measure a degree-4 Macaulay rank and does not speak to D = 2^16.
    - No transfer to a different basis is claimed.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Schoolbook inversion in the monomial basis of a degree-5
        extension uses at least two multiplications. The bound is
        the count of one frozen program, not a theorem for every
        addition chain.
      rigorous_support: >-
        An inverse in a degree-5 extension is not a linear form.
        No opened result gives the constant 2 for this basis.
      validation_plan: >-
        Count the multiplications in the frozen program and in one
        independently written program that is allowed to reorder
        linear operations but not to change the basis. If either
        program beats 2, H1 fails and the row is the negative.
  target_complexity:
    time_exponent: unchanged at 8/5
    memory_exponent: a straight-line program of fixed length, no new exponent
    best_known: >-
      KR-IC-46d822 at q^{8/5}. KR-IC-955fd6 prices torsion
      symmetrization as a constant, which is where these
      multiplications would sit.
    hidden_overhead: >-
      The O-tilde already hides n! times 2^{n(n-1)}. Two
      multiplications do not enlarge that disclosure.
    tradeoff_note: Exponent delta 0. Not a time-memory tradeoff.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  dominated_by: >-
    KR-IC-46d822 dominates the exponent. KR-IC-955fd6 already prices
    the symmetry as a constant. Both were opened 2026-10-07. A
    multiplication count of 2 does not change q^{8/5}. The gap that
    remains is the unmeasured ideal degree, which this count does
    not touch.
  sota_delta: >-
    Zero change to the exponent 8/5. The integer the test measures
    is an extra multiplication count, predicted to be at least 2.
    The delta versus Gaudry's leading term is 0.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-IC-46d822
      - KR-IC-955fd6
      - KR-IC-e2d81b
      - KR-RHO-13bf67
    nearest:
      - ref: KR-IC-955fd6
        provenance: internal
        relation: adjacent
        delta: >-
          The row prices S_m and torsion as a constant about
          2^{omega(n-1)}. This proposal counts multiplications in
          one coordinate change and does not re-derive that constant.
      - ref: KR-IC-46d822
        provenance: internal
        relation: orthogonal
        delta: >-
          Gaudry's cost is O-tilde(q^{8/5}). Two multiplications
          do not replace it.
    searched:
      corpus_grep:
        - "multiplications to form t = x + b/x"
      web: []
      blocked:
        - "No web search in this session; novelty stays unverified."
  proof_search_map:
    bottleneck: the multiplication count of one coordinate change
    baseline_embedding:
      parameter_slice: the x-only subfield test, predicted to use zero multiplications
      reproduction_check: a reordered linear program must keep that count at zero
    observation_collision:
      observable: the multiplication count
      distinct_preimage_search: two programs with the same count and different operation order are the same reading
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: the monomial-basis program for t = x + b/x
        predicted_gain: at least two extra multiplications, and no exponent change
    quantifier_order: >-
      For the frozen monomial basis, every program in the allowed
      class uses at least two extra multiplications. The class is
      one basis, not every basis.
    method_ceiling:
      strongest_certifiable_claim: a multiplication count on one basis
      nearby_object_control: the frozen nonsquare c on the prime-order arm
    proof_obligations:
      - claim: the x-only test uses zero multiplications
        responsibility: baseline
      - claim: the count is inside the constant, not the exponent
        responsibility: runtime
    not_applicable_reason: >-
      No point enumeration is required. The selected transform is
      representation_reduction.
