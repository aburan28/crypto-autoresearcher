idea:
  id: IDEA-20260906-aa6da3
  title: >-
    Level-N linearisation: translation by the prime-order subgroup acts
    F_p-linearly on the Riemann-Roch space L(N.O), giving the regular
    representation of G whose F_p-irreducible blocks have dimension ord_N(p) --
    the embedding degree -- so every theta-type or level-N model of a prime-order
    curve is the pairing transfer F4 in new notation, small-level embeddings
    yield only the injective object [n]P, and the R2 class is closed with two
    mechanisms and one forced factorisation pattern
  class: mechanism
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-623a32
  goal_id: GOAL-ECDLP-001
  added: '2026-09-06'
  proposed_at: '2026-09-06'
  proposed_by: idea-generator
  claim: >-
    REPRESENTATION CLASS R2 (curve models and embeddings: level-n theta and
    Riemann-Roch models). ATTACK STAGE examined: collision structure and linear
    algebra -- the representation turns the group law into matrix multiplication.
    NON-GENERIC OPERATION it makes cheap: none that survives; the record's content
    is that the one operation it linearises is the pairing map, already F4. The
    candidate is therefore RETURNED AS UNVERIFIED WITH ITS OBSTRUCTION NAMED
    rather than as a representation proposal, per the handoff's trichotomy rule
    for objects that cannot be placed (this one is injective on G).
    (A) THE LINEAR ACTION. E/F_p, P of prime order N, G = <P>, L = O_E(N.O),
    V = H^0(E, L) = L(N.O) of dimension N over F_p with the rational basis
    {1, x, y, x^2, xy, ...} of pole order at most N at O. For D in G,
    tau_D^* L = O_E(N.(-D)) is isomorphic to L because N.(-D) - N.O is principal
    (it is div g_D for the Miller-type function g_D with divisor N(-D) - N(O),
    defined over F_p since -D is rational). Hence M_D : f -> g_D . (f o tau_D) is
    an F_p-linear automorphism of V, computable by expanding in the basis in
    O(N^2 polylog p) field operations, and D -> M_D is a projective
    representation rho : G -> PGL_N(F_p) with M_D M_D' proportional to M_{D + D'}.
    (B) THE DECOMPOSITION. H^2(G, F_p^*) = 0 because |G| = N is coprime to
    |F_p^*| = p - 1 (generic prime-order curves), so rho lifts to a linear
    representation rho~ : G -> GL_N(F_p). Over the algebraic closure the theta
    group of L acts on V with the N distinct characters of G appearing once each
    (the level-N theta eigenbasis), so rho~ tensor F_p-bar is the regular
    representation of Z/N. Over F_p the characters fall into Galois orbits under
    Frobenius zeta -> zeta^p, of size ord_N(p) = k, the EMBEDDING DEGREE of
    KN-TECH-032. FORCED VALUE: the characteristic polynomial of M_P factors over
    F_p as (t - 1) times (N - 1)/k irreducible factors of degree k, each an
    F_p-irreducible factor of the N-th cyclotomic polynomial.
    (C) THE IDENTIFICATION WITH F4. The DLP M_Q = M_P^k' in <M_P> restricted to
    any k-dimensional block is the DLP in the multiplicative group of
    F_p[t]/(irreducible factor) = F_{p^k}^*, the MOV field; the block is
    computable from V in polynomial time in N, i.e. exponential in log N. So the
    level-N linearisation is the pairing transfer with the pairing computed
    through the theta group instead of Miller's algorithm, and it is closed by
    the embedding-degree obstruction (KN-TECH-032; KN-FIND-3a7d42: k of order
    N/2 for generic curves) and, independently, by the N^2 cost of writing V.
    (D) SMALL LEVELS. For n coprime to N the embedding by L(n.O) into P^(n-1)
    carries a projective-linear action of E[n], not of G; the E[n]-orbit of a
    point is the fibre of [n], so the orbit object of a point of G is [n]P, which
    is injective on G. Symmetric theta structures of level n with rational
    biquadratic addition laws need mu_n in F_p and rational n-torsion, absent on
    prime-order curves for every n < N. So no lossy object arises from small
    levels either.
    (E) WHAT REMAINS OPEN IN R2 AND IS FORWARDED. The un-eliminated decomposition
    presentation through Riemann-Roch spaces (points sum to R iff a section of
    L((m-1).O + R) vanishes on them) is already in this corpus
    (FINDING-PF-IC-001 section on L_R, and the presentation table of
    IDEA-20260904-e9675e); it is a presentation of F2, governed there by the
    auxiliary-count law, and is not re-proposed here.
  mechanism: >-
    THE PAIR. Representation: the point as its translation operator M_D on the
    Riemann-Roch space V = L(N.O) (equivalently, the level-N theta-type model).
    Operation set Sigma: composition of operators, i.e. the full group law
    linearised -- which is why the object is injective: the trichotomy of
    IDEA-20260806-c5d183 places it at the degenerate injective end, the same
    cell as F4 in KN-TECH-ee6696, and the record says so instead of forcing a
    class. One-line reason: rho~ is faithful because the characters separate G.
    LOSSY-PROJECTION TEST. The projection D -> M_D discards nothing (faithful
    representation), so it is a change of coordinates and is NOT returned as a
    representation candidate; the lossy quotients of V under G are the
    isotypic blocks, and projecting to one block is exactly composing with the
    pairing into F_{p^k}^*, which is KN-FIND-ffe1df Theorem C's injective
    homomorphism case. The record's deliverable is the identification, the forced
    factorisation pattern, and the closure of the R2 class with two mechanisms
    (embedding-degree rationality for level N; injectivity of [n] for small n).
    STAGE 0 (zero compute, hard gate). Derive (A)-(D) on paper, in particular
    that g_D is F_p-rational and that H^2(G, F_p^*) vanishes for gcd(N, p-1) = 1;
    write the forced factorisation pattern and its nearby-object counterpart.
    STAGE 1 (minutes to an hour). Toy N in {23, 31, 47, 59}, p about 16 bits,
    prime-order curves (cofactor 1 at these sizes means p is about N; use
    subgroups of prime order N in small curves if cofactor-1 toy curves at these
    N are awkward, and say which): build V, compute M_P and M_Q, verify
    M_P M_Q proportional to M_{P+Q} on all pairs (projective homomorphism gate),
    compute the characteristic polynomial and its F_p-factorisation, and compare
    the degree multiset with {1} union {k}^((N-1)/k), k = ord_N(p).
    STAGE 2 (minutes). Nearby object: a curve with N | p - 1 (k = 1): the
    polynomial must split into N distinct linear factors and the toy DLP must
    transfer to F_p^* and be solvable by a toy F_p^* index calculus (Frey-Ruck
    positive control). A second nearby object: composite subgroup order, where
    the lift of rho may fail to exist and the pattern changes.
    STAGE 3 (minutes). Controls below.
  novelty_status: unverified
