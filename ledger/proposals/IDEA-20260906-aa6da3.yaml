  assumptions:
    - Prime-order subgroup with gcd(N, p - 1) = 1 for the lift of rho; the N | p - 1 case is the nearby object.
    - The Miller-type function g_D with divisor N(-D) - N(O) is computed exactly (not modulo N-th powers) and expanded in the frozen basis of V.
    - >-
      Off-limits component used and named: F4 (pairing transfer) is what the
      representation reduces to; nothing is added to F4, which is the point.
    - Toy N only; V has dimension N and the construction is exponential in log N by design.
  proof_search_map:
    bottleneck: >-
      The Galois-orbit size of a nontrivial character of G under Frobenius, which
      is ord_N(p). If the characters were rational (k = 1) the representation would
      split into N linear characters and the DLP would transfer to F_p^*; the
      whole closure is that k is large for generic curves.
    baseline_embedding:
      parameter_slice: >-
        N | p - 1, k = 1: the level-N linearisation is the Frey-Ruck transfer to
        F_p^* and the characteristic polynomial splits completely.
      reproduction_check: >-
        On a toy curve with N | p - 1, the characteristic polynomial of M_P has N
        distinct linear factors, the eigenvalue on any nontrivial block is a
        primitive N-th root of unity in F_p, and the toy DLP transfers to F_p^*
        and is solved there by an independent index-calculus routine. Exact.
    observation_collision:
      observable: The multiset of degrees of the F_p-irreducible factors of the characteristic polynomial of M_P.
      distinct_preimage_search: >-
        Required: any two curves with the same N and the same p give the same
        multiset (it depends only on ord_N(p)), so the observable cannot
        distinguish curves and must never be used to; it distinguishes only the
        embedding degree, which is the intended content.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace 'level-N model of E' by 'regular representation of Z/N over F_p
          plus the Miller function g_D'; encoding exact, completeness exact,
          soundness exact, cost loss N^2 to write V.
        predicted_gain: Zero on every cost axis; the gain is the identification with F4 and the closure of the R2 class.
      - transform: observable_fiber
        proposed_object: >-
          Hold the block structure fixed and vary the level n below N: the
          forgotten structure is the rational level structure, and the invariant
          distinguishing the objects is [n]P, injective.
        predicted_gain: Records that small-level models produce no lossy object on G.
    quantifier_order: >-
      FOR ALL prime-order E/F_p with gcd(N, p - 1) = 1 and FOR ALL D in G, THERE
      EXISTS an F_p-linear M_D on L(N.O) representing translation, and FOR ALL
      generators P the characteristic polynomial of M_P has the forced factor
      degrees. NOT claimed: anything about composite subgroup order or about
      N | p - 1 beyond the nearby-object statement.
    method_ceiling:
      strongest_certifiable_claim: >-
        'On prime-order prime-field curves every level-N theta-type model
        linearises translation into the regular representation whose blocks are
        the MOV fields, and every level-n model with n < N carries only the
        injective object [n]P.' It can never certify a statement about genus-2
        theta models, about non-prime subgroup orders, or about any attack.
      nearby_object_control: >-
        The N | p - 1 curve, where the desired conclusion (large blocks, no
        transfer) FAILS and the transfer to F_p^* succeeds. A pipeline reporting
        the same pattern there as on generic curves has not computed ord_N(p).
    proof_obligations:
      - claim: tau_D^* L is isomorphic to L over F_p for D in G, via a rational g_D.
        responsibility: correctness
      - claim: 'H^2(G, F_p^*) = 0 for gcd(N, p - 1) = 1, so rho lifts.'
        responsibility: correctness
      - claim: The lifted representation is the regular representation of Z/N over F_p.
        responsibility: correctness
      - claim: 'Factor degrees are {1} and ord_N(p) with multiplicity (N - 1)/ord_N(p).'
        responsibility: strictness
      - claim: The N | p - 1 slice reproduces Frey-Ruck.
        responsibility: baseline
      - claim: Writing V and M_D costs Theta(N^2) field elements, exponential in log N.
        responsibility: runtime
      - claim: Small-level embeddings yield only [n]P on G.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: number of pairs (D, D') failing M_D M_D' proportional to M_{D+D'} among all pairs at toy N
      direction: lower
      minimum_effect: Exactly zero; any failure means g_D or the basis expansion is wrong and nothing is reported.
    - metric: multiset of F_p-irreducible factor degrees of the characteristic polynomial of M_P
      direction: different
      minimum_effect: 'Exactly {1} union {ord_N(p)} with multiplicity (N-1)/ord_N(p) on every generic toy cell; exactly N ones on the N | p - 1 control. Both halves required.'
    - metric: toy DLP transferred to F_p^* on the N | p - 1 control and solved by an independent routine
      direction: different
      minimum_effect: Solved with certificate [k]P = Q on every instance; failure is an instrument fault.
    - metric: field elements stored to represent V and M_P as a function of N
      direction: higher
      minimum_effect: Grows as N^2 across the N ladder; this is the disclosed cost, not a finding.
  minimal_test:
    design: >-
      Stages 0-3 of the mechanism in pure Python with a small polynomial
      factorisation routine, at N in {23, 31, 47, 59} and p about 16 bits, with
      one N | p - 1 control curve and one composite-order nearby object. No attack
      is run; the only solves are on the k = 1 control, certificate-backed;
      claim_tier toy.
    controls:
      - >-
        PGL_2(F_p) random-reparametrisation battery of IDEA-20260807-4fc635 on
        the Kummer coordinate before building the basis of V, and a random
        GL_N(F_p) change of basis of V; the factor-degree multiset must be
        invariant under both (it is a similarity invariant).
      - >-
        Translation-conjugate null of IDEA-20260807-4fc635, conjugating every
        M_D by M_R for random R; every metric must reproduce exactly.
      - Matched random prime-order curve at the same p and the same N where available; the pattern must depend only on ord_N(p).
      - Pollard rho with distinguished points and BSGS on the same subgroups as matched cost controls; the N^2 cost of V must be reported against them.
      - N | p - 1 positive control (Frey-Ruck) and composite-order nearby object.
    required_metrics:
      - projective-homomorphism failure count
      - factor-degree multiset per cell versus the forced value
      - ord_N(p) computed independently per cell
      - transfer-and-solve certificates on the k = 1 control
      - storage and wall clock for V and M_P per N
  falsification_conditions:
    - The factor-degree multiset differs from the forced value on any generic cell. Statement (B) is false as stated and the record is superseded.
    - The N | p - 1 control does not split completely or the transfer fails. Baseline not reproduced; instrument fault.
    - The projective-homomorphism gate fails. g_D or the expansion is wrong; nothing is reported.
    - >-
      A lossy G-invariant quotient of V is exhibited whose blocks are not
      isotypic. Then (B)'s decomposition is incomplete and an R2 object exists
      outside this closure; that is the valuable failure.
  confounders:
    - Choosing a subgroup of prime order N inside a curve of composite order changes nothing in (A)-(C) but must be stated, since the handoff's target is cofactor 1.
    - Non-reduced expansion of g_D . (f o tau_D) in the basis (failing to reduce by the curve equation) inflates the matrix and breaks the gate.
    - Toy N is tiny, so ord_N(p) can be accidentally small; report ord_N(p) per cell and include at least one cell with ord_N(p) = N - 1.
  interpretation_limits:
    - No attack, no exponent, no representation candidate. The deliverable is a closure of the R2 level-n and level-N classes on prime-order curves with two named mechanisms and a forced value.
    - >-
      Genus-2 theta models, composite subgroup orders and the Riemann-Roch
      decomposition presentation are outside this record and forwarded to their
      own lanes (IDEA-20260807-8027a2's genus-2 forward, IDEA-20260904-e9675e's
      table).
    - Toy tier; the closure at scale is derived from (B)-(C), not measured.
  heuristic_assumptions: []
  heuristic_assumptions_note: Exact structural closure; no distributional hypothesis is asserted anywhere in the record.
  target_complexity:
    time_exponent: 'No exponent claimed; improvement 0. The linearisation costs Theta(N^2) to set up, already above sqrt(N).'
    memory_exponent: 'Theta(N^2) field elements to hold V and one operator; strictly worse than every frontier row.'
    best_known: 'Pollard rho at 0.886 sqrt(N) with O(1) memory (KN-TECH-006); BSGS (KN-TECH-031); pairing transfer at L_{p^k}(1/3) only for small k (KN-TECH-032).'
    hidden_overhead: None hidden; the overhead is the explicit N^2 and the embedding degree, both disclosed as the closure mechanism.
    tradeoff_note: Not applicable; no algorithm below the frontier is proposed.
  dominated_by: >-
    As an attack, dominated on every axis by every frontier row, checked
    individually: parallel rho with distinguished points (KN-TECH-006),
    automorphism-discounted rho (KN-TECH-018), BSGS (KN-TECH-031), multi-target,
    preprocessing frontier S T^2 = Theta(N), and the pairing transfer itself
    (KN-TECH-032), which is the same algorithm with a cheaper pairing evaluation.
    As a closure, the nearest incumbent is KN-TECH-ee6696's F4 row, which this
    record extends to the level-N model class; nothing in the corpus dominates
    that extension.
  sota_delta:
    time_exponent_improvement_claimed: 0
    memory_exponent_improvement_claimed: 0
    data_query_improvement_claimed: 0
    scope: >-
      Zero on every cost axis. Deliverable delta: the R2 level-n and level-N
      class of RQ-ECDLP-623a32 is identified with F4 (level N) and with the
      injective [n]P (small n), with one forced factorisation pattern that can
      fail; the R2 class is closed at the section 4 standard for prime-order
      prime-field curves, forwarding genus-2 theta and the Riemann-Roch
      presentation.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
