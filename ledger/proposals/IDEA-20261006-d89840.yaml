idea:
  id: IDEA-20261006-d89840
  question_id: RQ-FROB-7d8dd4
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    Base-field third intersections of Frobenius chords on
    y^2 = x^3 + x + 2 over F_{11^3}
  class: measurement
  claim: >-
    On E: y^2 = x^3 + x + 2 over F_11, let S be the affine points of
    E(F_{11^3}) whose x-coordinate is not in F_11. For P in S let R be
    the third intersection of the chord through P and its coordinate
    11-power with E, when that chord is not vertical. Let C_frob be the
    number of such P for which x(R) lies in F_11. Let C_rand be the same
    count on the first |S| non-vertical ordered pairs in the frozen
    lexicographic order of points. The claim is C_frob >= 2 * C_rand.
    The representation is affine coordinates. The stage is a count in
    front of relation search. The discrete-log time exponent stays 1/2
    and the delta versus Pollard rho is 0. This is not the slope-image
    comparison of IDEA-20261006-922612: the integer is a count of
    base-field third intersections, not an image cardinality of slopes.
  mechanism: >-
    The operation is the coordinate 11-power map. Because the curve is
    defined over F_11, the image of a point is again on E, so the chord
    through P and that image is a chord of E.     The test keeps only whether x of the third point lies in F_11.
    A random chord of the same length is the null arm. Two readings are separated by the same
    integers. Endomorphism-sum says the Frobenius count is at least
    twice the random count. Unrelated-chords says it is not. The smaller
    count is the negative. No factor base is built.
  novelty_status: unverified
  citations:
    - ref: KR-IC-b0fcda
      provenance: internal
      claim: >-
        Frobenius-invariant factor bases cut the number of systems by at
        most 1/n and speed linear algebra by n^2. This proposal does not
        build that factor base.
      verified_by: coordinator design session, 2026-10-06, opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-b0fcda.yaml
    - ref: KR-IC-46d822
      provenance: internal
      claim: >-
        For fixed n, Gaudry decomposition is Õ(q^{2-2/n}). This proposal
        does not change that exponent.
      verified_by: coordinator design session, 2026-10-06, opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-46d822.yaml
    - ref: KR-RHO-037e22
      provenance: internal
      claim: >-
        Walking on Frobenius classes changes a square-root-of-degree
        factor in front of rho, not the exponent 1/2.
      verified_by: coordinator design session, 2026-10-06, opened knowledge/frontiers/ecdlp/generic-rho/KR-RHO-037e22.yaml
  assumptions:
    - >-
      The discriminant 4 + 27*4 = 112 is 2 mod 11. The run recomputes
      it. A zero discriminant voids the comparison.
    - >-
      The modulus is the least monic cubic over F_11, in lexicographic
      order of coefficients, that has no root in F_11. A reducible
      choice voids the run.
    - >-
      Vertical chords are dropped from both arms. A sample that drops
      more than one tenth of its pairs is void.
  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
    not_applicable_reason: >-
      This is a pre-registered count on one toy curve, not a proof.
  predictions:
    - metric: count of base-field third intersections
      direction: higher
      minimum_effect: C_frob is at least twice C_rand
  minimal_test:
    design: >-
      Enumerate E(F_{11^3}). Build S. Compute C_frob and C_rand. A
      second addition implementation on 20 sums must agree. The null
      arm is the same count on y^2 = x^3 + x + a, where a is the root
      of the modulus, and the coordinate 11-power of an affine point
      stays on that null curve for a count that must be 0.
    controls:
      - Discriminant recomputed nonzero.
      - Modulus has no root in F_11.
      - Two addition implementations agree on 20 points.
      - Null-curve affine count is 0.
    required_metrics:
      - size of S
      - C_frob
      - C_rand
      - null-curve affine count
  falsification_conditions:
    - C_frob is strictly less than twice C_rand, after the checks pass.
    - The size of S is below 20, or either count cannot be filled. That case is void.
    - The null-curve count is positive, or the two additions disagree.
  confounders:
    - Dropping vertical chords from only one arm biases the counts. Both arms drop them.
    - x(R) equals x(P+pi(P)). A slope-image comparison is a different integer and is not this claim.
  interpretation_limits:
    - One curve and one extension. No transfer to cryptographic size.
    - The discrete-log exponent stays 1/2 even if the inequality holds.
    - A passed inequality does not define a factor base.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Third intersections of chords through two uniformly chosen
        distinct points land in the base field about as often as a
        uniform x-coordinate does, which is 11 values out of 11^3.
        The frozen lexicographic sample is the object actually counted.
        The factor-of-two gap is the pre-registered minimum effect, not
        a proved tail.
      rigorous_support: >-
        A uniform element of F_{11^3} lies in F_11 with probability
        11/11^3. No opened row proves the third-intersection count for
        Frobenius chords.
      validation_plan: >-
        Repeat the random arm with each accepted pair reversed and
        compare that count to C_rand. If the two random counts differ
        by more than a factor of two, H1 is not used to interpret
        C_frob.
  target_complexity:
    time_exponent: "1/2"
    memory_exponent: "O(1) field elements beyond the point list"
    best_known: >-
      Pollard rho, exponent 1/2, with a class-walk factor on subfield
      curves (KR-RHO-037e22). Gaudry's Õ(q^{2-2/n}) (KR-IC-46d822) is
      not improved.
    hidden_overhead: >-
      No o(1) term. The comparison is two integers on a field of
      cardinality 1331.
    tradeoff_note: >-
      The discrete-log time exponent stays 1/2 and the delta versus
      Pollard rho is 0. No time-memory tradeoff is proposed.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: >-
    Checked KR-IC-b0fcda, KR-IC-46d822, KR-IC-955fd6, KR-IC-1fcdbc,
    and KR-RHO-037e22. None states a count of base-field third
    intersections of Frobenius chords. The factor-base row bounds a
    factor n. Gaudry's row bounds a q-exponent. The class-walk row
    bounds a square-root-of-degree factor. None is this integer.
  sota_delta: >-
    The discrete-log time exponent stays 1/2 and the delta versus
    Pollard rho is 0. The pre-registered gap is a factor of 2 between
    two counts on a field of 1331 elements.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp/index-calculus
    rows_checked:
      - KR-IC-b0fcda
      - KR-IC-46d822
      - KR-IC-955fd6
      - KR-IC-1fcdbc
      - KR-RHO-037e22
    nearest:
      - ref: KR-IC-b0fcda
        provenance: internal
        relation: orthogonal
        delta: >-
          That row is a factor at most n on the number of systems.
          This proposal compares two third-intersection counts by a
          factor of 2 and does not build a factor base.
      - ref: KR-IC-46d822
        provenance: internal
        relation: orthogonal
        delta: >-
          Gaudry's exponent is unchanged. The gap here is an integer
          factor of 2 on one extension, not a q-exponent.
    searched:
      corpus_grep:
        - "third intersection"
        - "base-field third"
      web: []
      blocked:
