idea:
  id: IDEA-20260930-704e43
  question_id: RQ-AUXIN-f8d8c0
  goal_id: GOAL-AUXIN-a93442
  added: '2026-10-01'
  status: proposed
  approved_by: null
  title: >-
    PRICING CHEON WITH MEMORY CHARGED: a toy-scale (40-64-bit r) reproduction
    of the r - 1 branch with stage 1 as a parallel collision search in the
    implicit group (distinguished points, polylog memory, W walks) and stage
    2 as a kangaroo on the width-d interval, against the BSGS stages and
    against memory-charged rho measured on the SAME toy curve, delivering the
    two constants (per-step cost c_step in group additions, walk constant a)
    that decide IDEA-20260930-68326c's STEP_UNIT_DEPENDENT cells, with a
    planted-2^16 positive control and a safe-prime divisor-free null
  class: algorithm

  claim: >-
    The memory-charged form of Cheon's r - 1 branch is known (DEC-20260802-204
    B032-C6: Takenaka-Yasuda PKC 2012 section 2.2, rho with distinguished
    points; KN-LIT-6736: a 160-bit instance solved in 1314 core-days). What
    is not known in this program, and is not reported in the sources read,
    is the PAIR OF CONSTANTS that converts Cheon steps to group additions on
    an elliptic curve and that fixes the gain against rho when d is capped:
    c_step (additions per fixed-base scalar multiplication by a known
    log2(r)-bit scalar, under a named method) and a (stage-1 steps divided by
    sqrt(m), m = (r - 1)/d, for the parallel distinguished-point walk). The
    claim is quantitative and falsifiable: on toy curves of prime order r
    with a planted divisor d = 2^16 of r - 1 and a supplied toy SRS
    [tau^i]P, i <= 2^16, the measured gain G = (rho additions)/(Cheon
    additions) at memory exponent 0 on both sides equals 0.936 sqrt(d)/(a
    c_step) within a factor 2, with a in [1.0, 1.6] and c_step/log2(r) in
    [1/8, 1.5] for the two scalar-multiplication methods declared below;
    and on a safe-prime null (d_max = 2) the same pipeline shows G <= 0.5,
    i.e. Cheon with the only available divisor is WORSE than rho by about the
    step unit. Transfer of (a, c_step/log2 r) to 255-bit r is a named
    assumption (H1, H2), and the record's deployed-parameter bearing is
    confined to feeding those constants into IDEA-20260930-68326c's verdict
    rule; no exponent moves, and nothing here acquires a power.

  mechanism: >-
    TRACKED OBJECT. The pair (c_step, a) for a declared implementation, plus
    the measured per-trial addition count on both arms and on the rho
    comparator. STAGE 1 (the DLP in the implicit group). Let zeta generate
    F_r^* (certified primitive; r - 1 factored, trivial at toy size), m =
    (r - 1)/d, and Q_d = [tau^d]P. Since tau^d lies in the order-m subgroup
    generated by zeta^d, write tau^d = (zeta^d)^k with k in [0, m). Two
    families of walks on points: tame walks start at [(zeta^d)^{a_0}]P and
    wild walks at [(zeta^d)^{a_0}] Q_d, both tracking their exponent a; the
    step function multiplies the current point by the fixed scalar
    (zeta^d)^{c(X)} with c(X) in {1..20} chosen by a hash of X (an r-adding
    walk in the implicit group, KR-RHO-cd86f5). A tame/wild collision at a
    distinguished point gives (zeta^d)^{a_t} = (zeta^d)^{a_w} tau^d, hence
    k = a_t - a_w mod m. This is van Oorschot-Wiener parallel collision
    search (KR-RHO-6239aa) on a set of size m, expected about 1.25 sqrt(m)
    steps in total across W walks, memory proportional to the number of
    distinguished points (polylog in m at fixed DP density), wall time
    divided by W. STAGE 2. tau = zeta^{k_0 + m t} with t in [0, d): [tau]P =
    [zeta^{k_0}] [zeta^{m t}]P is an interval DLP of width d in the implicit
    group generated by zeta^m, solved by a kangaroo (KR-RHO-898783, about 2
    sqrt(d) steps) or BSGS (sqrt(d) memory); at d = 2^16 this is 2^9 steps
    and negligible. PER-STEP COST. Each step is one scalar multiplication of
    a point by one of 20 fixed scalars of log2(r) bits. Method M1:
    double-and-add (about 1.5 log2 r additions, the upper end). Method M2:
    fixed-base comb with per-scalar precomputed tables (window w in {4, 8};
    about log2(r)/w additions plus table cost amortised over the walk, the
    lower end). c_step is measured as additions per step for each method.
    THE COMPARATOR. Ordinary rho on the same toy curve from (P, [tau]P): an
    r-adding walk with the negation map and distinguished points, measured
    additions per solve (predicted 0.886-0.936 sqrt(r), KR-RHO-fb88e6),
    measured, not assumed. LOSSY-PROJECTION TEST. The object (c_step, a)
    discards the curve, the walk's path and the recovered logarithm and
    keeps the two numbers that enter the verdict formula; it propagates
    deterministically under the operation "change r at fixed method" by H1
    and H2, which is exactly what is tested across the size ladder. WHY THE
    NULL IS INFORMATIVE. On a safe prime, the only divisors of r - 1 are 1,
    2, q', 2q'; with q_max = 2^16 the pipeline can use d = 2 at most, so
    stage 1 is a DLP of size (r - 1)/2 at c_step additions per step: G is
    predicted about 0.936 sqrt(2)/(a c_step), between 0.01 and 0.13. A null
    G above 0.5 means the pipeline is using information it was not charged
    for (e.g. reading tau from the SRS generator), and the whole run is void.
    OFF-LIMITS. The SRS is supplied by a seeded generator and charged as
    data; DEC-20260802-204's acquisition gate stands; nothing is claimed
    about ordinary ECDLP.

