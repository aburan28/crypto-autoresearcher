  citation_note: >-
    No web search was run for this record; the Cheon sources are cited
    through the internal records that read them. Every predicted number is
    arithmetic on the stated bracket and is labelled an estimate.

  assumptions:
    - >-
      Toy curves are constructed by CM (j = 0 over p = 1 mod 3, or j = 1728
      over p = 1 mod 4) searching p of B bits, B in {40, 48, 56} primary and
      64 optional, until a twist has prime order r with 2^16 | r - 1 (ARM-PLANT)
      or r - 1 = 2 q' with q' prime (ARM-NULL); orders are recomputed by an
      independent point count (ellcard) before use. A non-CM fallback (random
      curves with SEA counting) is permitted and recorded.
    - >-
      The toy SRS [tau^i]P for i <= 2^16 is generated from a seeded tau and
      charged as supplied data; the attack code never reads tau and the
      verifier checks the recovered scalar against [tau]P only.
    - >-
      Methods M1 and M2 are fixed before any run; c_step is reported per
      method, and the deployed-parameter bearing uses the bracket they span.
    - >-
      The comparator rho is run on the same curves with the same DP density
      and the same W; no rho number is taken from the literature for the
      toy comparison.
    - DEC-20260802-204's acquisition gate stands; the record's output is two constants and a reproduction, not an attack.

  proof_search_map:
    bottleneck: >-
      The unit conversion between Cheon steps and group additions, and the
      walk constant of the implicit-group collision search, which together
      decide whether capped-d Cheon is below memory-charged rho in group
      operations.
    baseline_embedding:
      parameter_slice: >-
        d = 1 on ARM-NULL reproduces an ordinary DLP of size r - 1 run
        through the Cheon pipeline: G must be about 0.936/(a c_step), the
        pure step-unit penalty (C-D1). The rho comparator at 0.886-0.936
        sqrt(r) additions is the second baseline (C-RHO).
      reproduction_check: >-
        C-D1 and C-RHO on every size before any planted number is read; a
        comparator outside [0.7, 1.3] x 0.936 sqrt(r) voids the run.
    observation_collision:
      observable: >-
        Per trial: additions to recovery, steps, c_step, DP entries, peak RSS,
        W, wall time, success flag; per size and arm: a with 95 percent
        interval, G with interval.
      distinct_preimage_search: >-
        A favourable G could come from (i) the planted divisor (the
        mechanism), (ii) an under-counted step unit (M2 table cost not
        amortised honestly), or (iii) uncharged information. (ii) is
        excluded by counting every addition including table construction;
        (iii) by ARM-NULL's G <= 0.5 threshold and by the verifier that
        checks against [tau]P only.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The per-(size, arm, method, W) tuple (a, c_step, G, memory) with
          the verdict formula of IDEA-20260930-68326c evaluated at the
          measured constants.
        predicted_gain: >-
          The STEP_UNIT_DEPENDENT band of that record collapses to a verdict
          per cell, labelled as an extrapolation under H1/H2.
      - transform: observable_fiber
        proposed_object: >-
          Hold d fixed and vary W in {1, 4, 16}: a must be W-independent
          (vOW linear speedup) while wall time divides by W; a W-dependent a
          is a DP-density artefact.
        predicted_gain: Separates the walk constant from the parallel bookkeeping.
    quantifier_order: >-
      FOR the declared toy curves, methods, d = 2^16 and W: the measured
      (a, c_step, G) are as reported with intervals. EXISTS a deployed cell
      whose verdict changes under the measured constants is an extrapolation
      under H1 and H2 and is labelled so wherever it appears; nothing is
      measured at 255 bits.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At r of 40-64 bits with d = 2^16 and W in {1, 4, 16}, Cheon's r - 1
        branch in memory-charged form recovers the planted scalar at
        a = (measured) sqrt(m) steps of c_step = (measured) additions, giving
        G = (measured) against rho on the same curve; the safe-prime null
        gives G = (measured) <= 0.5." It certifies nothing at 255 bits
        except through H1/H2, and no attack on any deployment.
      nearby_object_control: >-
        ARM-NULL (safe-prime order, where the conclusion "Cheon beats rho"
        must fail) and the d = 1 slice (where the pipeline is rho with a
        step-unit penalty); as the proves-too-much object, a run that
        reports G > 1 on ARM-NULL.
    proof_obligations:
      - claim: The tame/wild collision recovers k mod m exactly and stage 2 recovers tau; verified against [tau]P on every trial.
        responsibility: correctness
      - claim: Every addition is counted, including M2 table construction and DP bookkeeping; memory is peak DP entries plus tables.
        responsibility: runtime
      - claim: a is W-independent within intervals and matches 1.25 sqrt(m) within [1.0, 1.6].
        responsibility: success_probability
      - claim: The transfer to 255 bits is stated as H1/H2 and never as a measurement.
        responsibility: scope
      - claim: The SRS is charged as data and never read by the attack beyond [tau^d]P and [tau]P.
        responsibility: interface
    not_applicable_reason: null

  predictions:
    - metric: a = stage-1 steps / sqrt(m) on ARM-PLANT (mean over >= 50 trials per size, 95 percent interval)
      direction: same
      minimum_effect: in [1.0, 1.6] at every size and W; outside falsifies H2 of IDEA-20260930-68326c.
    - metric: c_step / log2(r) per method (M1, M2 with w = 4 and w = 8)
      direction: different
      minimum_effect: >-
        M1 in [1.2, 1.6]; M2 in [1/8, 1/3]. Either outside [1/8, 1.5]
        falsifies H1 of IDEA-20260930-68326c and revises its band.
    - metric: "G on ARM-PLANT at d = 2^16 (estimate at B = 56: 0.936 x 256 / (1.25 x c_step))"
      direction: higher
      minimum_effect: >-
        G in [2, 24] predicted across methods (2^1 to 2^4.6); measured G
        within a factor 2 of 0.936 sqrt(d)/(a c_step) using the measured
        a and c_step confirms the pricing formula.
    - metric: G on ARM-NULL (d = 2)
      direction: lower
      minimum_effect: G <= 0.5 required; predicted 0.01-0.13; G > 0.5 voids the run (uncharged information).
    - metric: parallel efficiency (steps at W = 16 divided by steps at W = 1)
      direction: same
      minimum_effect: in [0.8, 1.25] (vOW linear speedup); wall time ratio about 1/W.
    - metric: peak memory (DP entries) on stage 1 versus BSGS (sqrt(m) entries)
      direction: lower
      minimum_effect: at least a factor 100 below BSGS at B = 56 with DP density 2^-8; reported with the T^2 S product.

  minimal_test:
    design: >-
      CELLS. Sizes B in {40, 48, 56} (64 optional if budget allows) x arms
      {PLANT: 2^16 | r - 1; NULL: r - 1 = 2 q'} x methods {M1, M2(w=4),
      M2(w=8)} x W in {1, 4, 16}; d = 2^16 on PLANT, d = 2 and d = 1 on NULL;
      50 trials per (size, arm, method) at W = 1, 20 at W = 4 and 16; fresh
      tau per trial from the recorded PCG64 stream; DP density 2^-8 at B <=
      48 and 2^-10 at B = 56. INSTRUMENT. Pure Python with gmpy2 (or Sage/
      pari for curve construction and point counting), affine arithmetic
      with an explicit addition counter; a separate-process verifier that
      checks the recovered scalar against [tau]P. PROCEDURE. (0) Zero-run
      arithmetic: predicted a, c_step bracket, G per size. (1) Construct
      curves; recount orders; certify r prime and the arm property. (2)
      C-RHO: rho with negation and DPs on each curve, 50 trials. (3) C-D1 on
      NULL. (4) Cheon pipeline on both arms, both stages, all methods and W.
      (5) Verifier on every trial. (6) Aggregate with intervals; evaluate
      IDEA-20260930-68326c's verdict formula at the measured constants and
      label the result an extrapolation under H1/H2. OUTCOME TABLE.
      REPRODUCED (publishable): PLANT recovers tau in >= 95 percent of
      trials with a, c_step inside their brackets and G within a factor 2 of
      the formula; NULL G <= 0.5; the constants are handed to
      IDEA-20260930-68326c. BRACKET BROKEN (publishable): recovery succeeds
      but a or c_step/log2 r lies outside its bracket; the STEP_UNIT_DEPENDENT
      band is re-derived under a superseding record with the measured
      bracket - this is the more informative negative. ARTIFACT (void): any
      PLANT trial fails verification, NULL G > 0.5, C-RHO outside [0.7, 1.3]
      x 0.936 sqrt(r), or a W-dependent a. FALSIFICATION THRESHOLDS, FIXED
      NOW: formula falsified iff measured G differs from 0.936 sqrt(d)/(a
      c_step) by more than a factor 2 on PLANT at any size with the measured
      a, c_step; H2 falsified iff a outside [1.0, 1.6]; H1 falsified iff
      c_step/log2 r outside [1/8, 1.5] for the declared methods. COST
      (estimate): implementation medium (about 600 lines: CM search, implicit
      walks, DP store, kangaroo, verifier); compute low-medium (B = 56 stage
      1 is about 2^20.3 steps x up to 84 additions per trial, about 10^8
      additions, minutes in gmpy2; the whole grid on the order of 10-50
      CPU-hours; B = 64 adds about 16x and is optional).
    controls:
      - "ARM-PLANT positive: 2^16 | r - 1 with a supplied toy SRS; must recover tau (verifier) and land inside the predicted G band."
      - "ARM-NULL divisor-free: safe-prime r with the same SRS; d_max = 2; G <= 0.5 required; any G > 0.5 voids the run."
      - "C-D1: d = 1 through the Cheon pipeline on ARM-NULL reproduces rho with the step-unit penalty."
      - "C-RHO: ordinary rho with negation and DPs on each curve, measured, as the comparator."
      - "W-fiber: a at W in {1, 4, 16} must agree within intervals."
      - "Separate-process verifier against [tau]P on every trial; the attack never reads tau."
    required_metrics:
      - "per trial: additions (stage 1, stage 2, tables), steps, DP entries, peak RSS, wall time, success"
      - "per (size, arm, method, W): a and c_step with 95 percent intervals; G with interval; parallel efficiency"
      - C-RHO additions per solve with interval; C-D1 G
      - the verdict formula of IDEA-20260930-68326c evaluated at the measured constants, labelled extrapolation

  falsification_conditions:
    - "Pricing formula falsified iff measured G on ARM-PLANT differs from 0.936 sqrt(d)/(a c_step) (measured a, c_step) by more than a factor 2 at any size."
    - "H2 (walk constant) falsified iff a lies outside [1.0, 1.6] at any size or W."
    - "H1 (step-unit bracket) falsified iff c_step / log2(r) lies outside [1/8, 1.5] for a declared method."
    - "Instrument void iff any ARM-PLANT trial fails verification, ARM-NULL G > 0.5, C-RHO outside [0.7, 1.3] x 0.936 sqrt(r), or a depends on W beyond intervals."

  confounders:
    - "Toy sizes: constants at 40-64 bits transfer to 255 bits only under H1 (c_step linear in log2 r at fixed method) and H2 (a independent of m); both are named and the extrapolation is labelled."
    - "Python addition counts are engine-independent but the wall time is not; only addition counts enter G."
    - "DP density affects the in-flight tail at collision (KR-RHO-6239aa) and hence a; density is fixed per size and reported."
    - "CM curves have small automorphism groups (j = 0: order 6) that rho could exploit (KR-RHO-0528e7); the comparator uses the negation map only on both sides, and the Cheon walk uses none, so the comparison is at matched automorphism use; this is stated, not hidden."
    - "M2's table cost is amortised over a walk of 2^20 steps at B = 56; at smaller B it is not negligible and is reported separately."

  interpretation_limits:
    - "Toy tier: 40-64-bit r, d = 2^16, one SRS form, two scalar-multiplication methods. No measurement at 255 bits; no attack on any deployment; no exponent moves."
    - "The gain G is a constant factor at fixed d and is reported in group additions with memory charged; the Cheon-step column carries CORR-20260923-187ea3's labelling."
    - "Nothing about ordinary ECDLP; the SRS is supplied by construction (DEC-20260802-204 B032-C7)."
    - "A reproduced mechanism at toy scale is not evidence that any deployed cell is reachable; it is evidence about two constants."

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Step-unit scaling.) For a fixed method (M1, or M2 at fixed w),
        c_step grows linearly in log2(r): c_step(r) = kappa_method log2(r)
        with kappa_method constant across 40-255 bits.
      rigorous_support: >-
        Exact operation counts of double-and-add (about 1.5 log2 r
        additions) and of fixed-base comb methods (about log2 r / w additions
        plus 2^w-sized tables), both textbook; the heuristic content is only
        that no per-size effect beyond the count exists.
      validation_plan: >-
        SAMPLE c_step at B in {40, 48, 56} (64 optional) per method; FIT
        c_step = kappa log2 r; COMPARE residuals to zero within 5 percent;
        TAIL: the maximum per-step count never exceeds 1.5 log2 r. TRANSFER
        to 255 bits is linear extrapolation and is labelled so.
    - id: H2
      statement: >-
        (Walk constant.) The implicit-group r-adding walk with 20 branches
        and distinguished points collides after a sqrt(m) steps with a in
        [1.0, 1.6] independent of m for m >= 2^20 and independent of W.
      rigorous_support: >-
        Birthday bound sqrt(pi m / 2) = 1.2533 sqrt m for a random mapping;
        r-adding walks are within a sqrt(log m) factor rigorously
        (KR-RHO-93979e) and within a few percent empirically for r about 20
        (KR-RHO-cd86f5); vOW linear speedup (KR-RHO-6239aa).
      validation_plan: >-
        SAMPLE a over >= 50 trials per size and W; COMPARE the empirical
        distribution of steps/sqrt(m) to the Rayleigh-type distribution of
        a random mapping's collision time; TAIL: the longest trial against
        the predicted 99th percentile. TRANSFER to m about 2^226 assumes
        m-independence, labelled.

  heuristic_note: >-
    Correctness of both stages is exact (verified per trial); H1 and H2
    carry the only transfer and are the deliverable's stated conditions.

  target_complexity:
    time_exponent: >-
      No exponent moves. At capped d the memory-charged Cheon cost is
      a c_step sqrt(r/d) + 2 c_step sqrt(d) group additions against
      0.936 sqrt(r) for rho; the record measures a and c_step. Cheon's
      balanced r^{1/4} at d about sqrt(r) is known prior art and is not
      supplied by any deployment on the roster.
    memory_exponent: >-
      0 (distinguished points, polylog) for stage 1 and for the kangaroo
      stage 2, against sqrt(m) and sqrt(d) entries for the BSGS stages,
      which are run only as the a = 2 comparison rows.
    best_known: >-
      Memory-charged parallel rho with negation at 0.936 sqrt(r) additions
      (KR-RHO-825bca, KR-RHO-fb88e6), memory exponent 0, linear speedup; the
      rho/DP form of Cheon (DEC-20260802-204 B032-C6, KN-LIT-6736) at
      a sqrt(r/d) steps, whose constants in group additions this record
      measures.
    hidden_overhead: >-
      c_step is the overhead and is measured, not hidden; also charged:
      M2 table construction, DP bookkeeping, the generator of F_r^*
      (trivial at toy size, census-supplied at deployed size), and the
      verifier.
    tradeoff_note: >-
      Stage 1 sits on T^2 S = Theta(m) (KR-RHO-7d93f6) at S = polylog and
