idea:
  id: IDEA-20260826-506ba2
  question_id: RQ-EWALK-8fa147
  research_question: RQ-EWALK-8fa147
  added: '2026-08-26'
  title: >-
    THE sqrt(|Aut|) CEILING IS REALLY A CEILING ON sqrt(m)/kappa, WHERE m IS THE
    SIZE OF THE IDENTIFICATION GROUP AND kappa IS THE PER-STEP CANONICALIZATION
    COST: track the (m, kappa) tradeoff curve over ALL candidate identifications
    (automorphisms AND low-degree F_p-endomorphisms acting as scalars on G), and
    decide whether any point beats the automorphism point -- reframing "does
    anything exceed sqrt(|Aut|)" as a measured question about canonicalization
    cost, whose expected answer is a named obstruction, not a bound.
  class: mechanism

  claim: >-
    THREE SEPARABLE CLAIMS. NO ATTACK IS PROPOSED, NO EXPONENT MOVES, AND NO
    CANDIDATE IS ASSERTED TO EXCEED THE BASELINE -- any apparent excess is framed
    strictly as a test that triggers GOAL-ENDO-001 pause condition P3.

    (A) THE CEILING IS A RATIO, NOT A CONSTANT. A collision walk that identifies a
    point P with the orbit of P under a finite identification group Gamma of size
    m searches an effective set of size N/m, giving a sqrt(m) reduction in expected
    rho length. But EACH step must map the walk state to the canonical
    representative of its Gamma-orbit at some per-step group-operation cost kappa
    (the canonicalization cost). The net speedup over the unquotiented baseline is
    therefore sqrt(m)/kappa, not sqrt(m). The incumbent automorphism-discounted
    baseline (KN-TECH-018) is the single point (m = |Aut|, kappa = O(1)): the
    geometric automorphisms are cheap to canonicalize (negate / apply a known
    unit), so their kappa is a small constant and their net speedup is
    sqrt(|Aut|). CLAIM: "does anything exceed sqrt(|Aut|)?" is EXACTLY the question
    "is there an identification group with sqrt(m)/kappa > sqrt(|Aut|)/kappa_Aut?"
    -- a question about the (m, kappa) tradeoff curve, which no committed record
    plots.

    (B) THE ENDOMORPHISM CANDIDATES ARE ENUMERABLE AND EACH GIVES A MEASURABLE
    (m, kappa). By H-ENDO-001 every F_p-rational endomorphism psi acts on the
    prime-order subgroup G as multiplication by a scalar [lambda_psi], so the
    identification P ~ psi(P) is P ~ [lambda_psi]P, and the identification group it
    generates is the cyclic group <lambda_psi> <= (Z/N)^* of size
    m_psi = ord_N(lambda_psi). This can be MUCH larger than |Aut|: a single low
    -degree endomorphism can have a scalar of large multiplicative order.
    Naively that promises sqrt(m_psi) >> sqrt(|Aut|). CLAIM: the catch is kappa.
    Canonicalizing the <lambda_psi>-orbit {[lambda_psi^i]P : i} of size m_psi has
    no known O(1) canonical form -- the cheapest general method walks the orbit,
    costing kappa_psi = Theta(m_psi) group operations, so
    sqrt(m_psi)/kappa_psi = 1/sqrt(m_psi) < 1: WORSE than doing nothing. The
    automorphism point wins precisely because its orbit has a cheap canonical form
    and m_psi does not. This is the mechanism that would ENFORCE the ceiling, and
    it is measurable, not assumed.

    (C) THE DISCRIMINATION. Plot sqrt(m)/kappa for every enumerated identification
    on a battery of toy curves (generic j; j=0; j=1728; small-discriminant CM with
    a low-degree endomorphism). TWO BRANCHES, NAMED IN ADVANCE.
    (H-CANON-CAP) For every non-automorphism candidate, measured kappa grows at
    least as fast as sqrt(m), so sqrt(m)/kappa <= sqrt(|Aut|) for all of them and
    the automorphism point is the maximum. Then the sqrt(|Aut|) ceiling is
    confirmed AT THIS SCOPE and, crucially, the OBSTRUCTION IS NAMED: it is the
    canonicalization cost kappa = Theta(m), a measured quantity with units
    (group operations per step), not a bare inequality. This is the expected
    branch and the intended deliverable.
    (H-CHEAP-CANON) Some candidate exhibits a canonical form with
    kappa = o(sqrt(m)) at m > |Aut|, so its measured sqrt(m)/kappa exceeds
    sqrt(|Aut|). This does NOT get recorded as a speedup: it triggers P3 -- an
    independent review-adversarial session confirms it is not an instrument
    artifact (e.g. an unsound canonicalization that breaks distinguished-point
    collision detection, IDEA-20260807-15b468's constraint) BEFORE any record
    states an excess, and review-breakthrough at max effort before anyone calls
    it a break.

  mechanism: >-
    RQ-EWALK states this lane is on the wrong side of the generic-group
    admissibility filter by construction and exists to measure the ceiling
    precisely. The generic-group closure (KN-FIND-b7e091) and the scalar-action
    fact (H-ENDO-001) together predict that endomorphisms add coordinates but no
    congruence on G, so no endomorphism-based identification can move the exponent.
    But that argument bounds the SEARCH-SET reduction; it does not by itself
    explain WHY the achievable constant is capped at sqrt(|Aut|) rather than
    sqrt(m) for the largest available m. This record supplies the missing
    mechanism and makes it measurable: the cap is enforced by canonicalization
    cost. An identification group buys sqrt(m) only if its orbit has a canonical
    representative computable in cost sub-sqrt(m); the geometric automorphisms do
    (negation is one field operation, the j=0/j=1728 units are O(1) maps), and a
    generic cyclic scalar orbit of size m does not. So the ceiling is not a
    statement about which symmetries EXIST but about which admit a CHEAP CANONICAL
    FORM, and that is a property one can enumerate and time. The mechanism is not
    an attack; it converts a bound the program already believes into a measured,
    falsifiable cost curve, and names the obstruction (kappa = Theta(m)) that
    inventor-protocol section 4 requires for a real closure.

  novelty_status: unverified

