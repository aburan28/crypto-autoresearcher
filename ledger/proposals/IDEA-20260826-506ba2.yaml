  novelty_screen:
    method: >-
      Filesystem screening; crypto-kb bound to ':memory:', returns nothing. Read:
      RQ-EWALK-8fa147 in full; KN-TECH-018; IDEA-20260821-cae674 in full; the
      titles/tracked_object of the 22 EWALK-bound proposals via grep; GOAL-ENDO
      -001 head; the P3 pause condition. No web source opened for this record.
    results: >-
      NEAREST FILED WORK, NAMED. (1) IDEA-20260807-ebcae6 asserts a ceiling on
      End_{F_p}(E)-quotient walks. It states the bound; this record supplies and
      MEASURES the mechanism (kappa = Theta(m)) that would enforce it, and plots
      the (m, kappa) curve rather than asserting its supremum. (2)
      IDEA-20260807-6355c6 measures the negation-quotient net gain against a
      pre-registered rate -- a single point m = |Aut|; this record varies m across
      all candidate identifications. (3) IDEA-20260807-cbbcfd addresses the
      heavy-tailed-ratio estimator problem; orthogonal (it improves how the ratio
      is estimated, not what is identified). (4) IDEA-20260821-cae674 audits the
      committed ceiling result's resolution and its fruitless-cycle counter;
      complementary and a prerequisite -- this record's net-speedup measurements
      inherit cae674's requirement that the estimator's MDE be stated. (5)
      GLV/orbit-quotient walks are the established families and are declared
      off-limits as the primary lens.
    verdict: >-
      UNVERIFIED, and mechanism-distinct from all five. The new object is the
      (m, kappa) tradeoff curve over the full candidate-identification set and the
      canonicalization-cost obstruction that caps it; no filed record enumerates
      candidate identification groups by their scalar order m = ord_N(lambda) and
      times their canonicalization cost. GLV and automorphism quotients are
      classical; the honest label is `unverified` because no external source was
      opened.

  object_first_candidate:
    tracked_object: >-
      THE PAIR (m, kappa) = (size of the identification group Gamma =
      <lambda_Gamma> acting on G, per-step group-operation cost to canonicalize a
      Gamma-orbit), enumerated over every candidate Gamma on a curve: negation
      (m=2), the j=0 sextic and j=1728 quartic units, and each low-degree
      F_p-endomorphism psi with m_psi = ord_N(lambda_psi). Established families
      declared OFF-LIMITS as the primary lens: raw rho step counts, net-gain
      ratios, GLV split-walk functions, and orbit-quotient walk constructions --
      each of those FIXES one identification; the object here is the FUNCTION that
      maps identifications to their cost-size coordinates.
    lossiness: >-
      PASSES THE LOSSY-PROJECTION TEST. The projection (a candidate identification
      psi, with its full action on the whole group E(F_p) and its degree, kernel,
      and dual) |-> (m_psi, kappa_psi) discards the endomorphism entirely except
      for two integers: the multiplicative order of its scalar on G and the timed
      cost of one canonicalization. It is not a change of coordinates -- the fibre
      over a given (m, kappa) contains many distinct endomorphisms (any two with
      scalars of the same order and the same canonicalization cost), and knowing
      (m, kappa) does not recover psi. The discarded structure is discarded
      compatibly with the walk operation because the net speedup depends on the
      state ONLY through (m, kappa): two identifications with the same pair yield
      the same expected net speedup sqrt(m)/kappa, so the retained pair propagates
      deterministically into the observable.
    propagation: >-
      One-step propagation is defined and measurable: for a fixed Gamma, one walk
      step costs one base group operation plus kappa canonicalization operations,
      and reduces the effective state space by the factor m; the per-step
      quantities (base ops, canonicalization ops, whether the canonical
      representative is reached) are directly counted. Composing two commuting
      identifications Gamma_1, Gamma_2 gives m = |<Gamma_1, Gamma_2>| and
      kappa = kappa_1 + kappa_2 to leading order, a measurable composition rule.
    survival_score: >-
      Survives for any curve with a nontrivial F_p-rational automorphism or a
      known low-degree F_p-endomorphism -- generic j (negation only), j=0, j=1728,
      and small-discriminant CM curves. It dissolves when no cheap endomorphism is
      known (a floor-of-the-volcano curve whose smallest non-scalar endomorphism
      has degree ~ ell^{2n}, where kappa is astronomically large and only
      negation survives -- which is exactly the interface to RQ-VOLC and
      IDEA-20260826-f412a0), and for multiplicative-group or pairing DLPs out of
      scope here.

  proof_search_map:
    bottleneck: >-
      The step that turns "the automorphism speedup is sqrt(|Aut|)" into "nothing
      exceeds sqrt(|Aut|)". The first is a measured constant; the second is a
      supremum over all identifications, and the campaign has measured exactly one
      point (m = |Aut|). Removing this bottleneck -- exhibiting the (m, kappa)
      curve and its maximiser -- changes whether P3 can ever fire honestly, since
      P3 is defined relative to a baseline whose optimality has never been probed.
    baseline_embedding:
      parameter_slice: >-
        The committed negation-quotient / automorphism-quotient runs
        (EV-ENDO-10109d; IDEA-20260807-6355c6's EXP-RHO-60da4f), which are the
        single point (m = |Aut|, kappa = kappa_Aut) on the curve this record draws.
      reproduction_check: >-
        Recompute the automorphism point's net speedup from the committed runs and
        require it to equal sqrt(|Aut|)/kappa_Aut with the measured kappa_Aut; this
        anchors the curve at its known point before any new candidate is added. A
        mismatch is an instrument finding.
    observation_collision:
      observable: >-
        The net speedup sqrt(m)/kappa.
      distinct_preimage_search: >-
        A COLLISION IS NAMED. Two identifications -- a large-m expensive-canon one
        (m=100, kappa~100) and the small-m cheap-canon automorphism (m=2,
        kappa~1) -- can report the SAME net speedup while being completely
        different objects, and only the latter is usable in practice because its
        canonicalization is a true, sound class function. So net speedup alone does
        not certify usability; the soundness of the canonicalization (does it
        preserve distinguished-point collision detection, IDEA-20260807-15b468)
        is the additional condition that must accompany it, and is a required
        metric.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          A problem-specific resource measure: net speedup = (baseline expected
          rho ops) / (quotient expected rho ops including canonicalization),
          charged over the disjoint blocks "base step ops" and "canonicalization
          ops", per candidate identification.
        predicted_gain: >-
          Makes the ceiling an additive, per-candidate measured ratio directly
          comparable across identifications, which a single sqrt(m) count cannot.
      - transform: observable_fiber
        proposed_object: >-
          Hold net speedup fixed and vary the forgotten structure (which
          endomorphism, its degree, its canonicalization method); report which
          candidates at a given net speedup are SOUND (preserve collision
          detection) and which are not.
        predicted_gain: >-
          Separates a genuine usable identification from a fast-but-unsound one,
          which is the exact failure mode P3 exists to catch.
    quantifier_order: >-
      THE CLAIM WRITTEN OUT. Ceiling branch: FORALL candidate identifications
      Gamma on the tested curves, measured sqrt(m_Gamma)/kappa_Gamma <=
      sqrt(|Aut|)/kappa_Aut. The would-be-break branch: THERE EXISTS a candidate
      Gamma with measured net speedup strictly above the automorphism point AND a
      sound canonicalization -- an existential the automorphism-only baseline has
      never searched for. No uniform-over-all-curves claim is made; each statement
      is scoped to the tested battery.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On this battery of toy curves, over this enumerated set of candidate
        identifications, the maximum measured net speedup is (or is not) attained
        at the automorphism point, and the canonicalization cost of every larger-m
        candidate is Theta(m) (or is not), at claim_tier toy." It can NEVER certify
        a supremum over ALL identifications (only the enumerated ones), nor
        anything at crypto scale, nor any exponent movement.
      nearby_object_control: >-
        A GENERIC-j CURVE with |Aut| = 2 and NO known low-degree endomorphism:
        there the only candidate is negation, m=2, and the curve degenerates to a
        single point -- the net-speedup maximum must be exactly the negation point,
        a sanity floor. Second nearby object: a curve where a claimed cheap
        canonicalization is deliberately made UNSOUND (breaks the class-function
        property); the instrument must flag its collisions as spurious, or it
        cannot support any positive.
    proof_obligations:
      - claim: "net speedup over baseline = sqrt(m)/kappa for an m-fold identification with per-step cost kappa"
        responsibility: correctness
      - claim: "each endomorphism psi acts on G as [lambda_psi]; m_psi = ord_N(lambda_psi)"
        responsibility: baseline
      - claim: "generic cyclic scalar orbit of size m has canonicalization cost Theta(m) absent a special form"
        responsibility: runtime
      - claim: "a canonicalization used in a parallel walk must be a sound class function or collisions are spurious"
        responsibility: interface
      - claim: "any measured net speedup above the automorphism point is P3-gated before being recorded"
        responsibility: scope
      - claim: "toy tier, one prime per curve, enumerated candidate set only"
        responsibility: scope
    not_applicable_reason: null

  assumptions:
    - >-
      The net-speedup estimator's resolution is stated per IDEA-20260821-cae674:
      each measured sqrt(m)/kappa carries an MDE from the seed count, and no
      candidate is ranked above or below the automorphism point by less than that
      MDE. Ranking within the MDE is reported as a tie, never as an ordering.
    - >-
      The scalar lambda_psi is computed correctly (psi(P) = [lambda_psi]P verified
      on G by an independent scalar-recovery, e.g. solving a single small DLP at
      toy scale) before m_psi = ord_N(lambda_psi) is used. A wrong lambda gives a
      wrong m and voids the candidate's point.
    - >-
      Canonicalization cost kappa is measured in GROUP OPERATIONS, not wall time,
      so the observer effect of instrumentation does not inflate it
      (IDEA-20260821-cae674's confounder).

  predictions:
    - metric: >-
        net_speedup sqrt(m)/kappa per candidate identification, measured against
        the unquotiented rho baseline on identical seeds
      direction: different
      minimum_effect: >-
        H-CANON-CAP predicts every non-automorphism candidate sits at or below the
        automorphism point within the stated MDE; the largest-m endomorphism
        candidate is predicted BELOW 1.0 (net slowdown). A non-automorphism
        candidate measured above the automorphism point by more than the MDE
        selects H-CHEAP-CANON and triggers P3.
    - metric: >-
        canonicalization_cost kappa as a function of m across candidates
      direction: higher
      minimum_effect: >-
        A fitted exponent of kappa against m in [0.7, 1.3] (i.e. kappa = Theta(m))
        for endomorphism candidates confirms the mechanism of claim (B). An
        exponent below 0.5 for some candidate is the signature of a cheap
        canonical form and is the H-CHEAP-CANON tell.
    - metric: >-
        canonicalization_soundness: fraction of detected distinguished-point
        collisions that are TRUE collisions (same log) under each candidate's
        canonicalization
      direction: lower
      minimum_effect: >-
        Must be 1.0 (all collisions true) for a candidate to be counted as usable.
        A candidate with net speedup above the automorphism point but soundness
        below 1.0 is an UNSOUND canonicalization, not a break -- exactly the
        artifact P3 review must catch.
    - metric: >-
        automorphism_point_anchor: recomputed sqrt(|Aut|)/kappa_Aut against the
        committed automorphism-quotient net gain
      direction: different
      minimum_effect: >-
        Agreement within the committed run's MDE. A larger disagreement means the
        baseline point itself is mis-measured and the whole curve is uncalibrated.
    - metric: >-
        planted_cheap_canon recovery: on a synthetic identification given an
        artificially O(1) canonical form at m=8, the instrument must report net
        speedup ~ sqrt(8)/1 > sqrt(2)
      direction: higher
      minimum_effect: >-
        Recovered within MDE. A failure means the instrument cannot detect a real
        excess even when one is planted, so it cannot honestly support the ceiling
        (GOAL-ENDO-001 C4 / RQ-INSTR two-directional control).

  minimal_test:
    design: >-
      FOUR STEPS. STEP 1 (zero to minutes): for each battery curve, enumerate the
      candidate identifications -- negation always; the j=0 sextic / j=1728 quartic
      automorphisms where applicable; and the low-degree F_p-endomorphisms from the
      curve's CM order, computing each scalar lambda_psi on G and m_psi =
      ord_N(lambda_psi). STEP 2 (minutes): for each candidate, IMPLEMENT its
      canonicalization and TIME it in group operations, measuring kappa and its
      scaling with m; verify the class-function (soundness) property. STEP 3
      (minutes to hours): run the collision walk under each candidate on identical
      seeds against the unquotiented baseline; measure net speedup, with the MDE
      from IDEA-20260821-cae674's arithmetic pre-registered. STEP 4 (minutes):
      the two-directional instrument control -- the planted cheap-canonicalization
      positive control and the deliberately-unsound-canonicalization negative
      control. Repeat on generic-j, j=0, j=1728, and one small-discriminant CM
      curve.
    controls:
      - >-
        UNQUOTIENTED BASELINE on identical seeds, re-measured in the same run
        (the ratio's denominator, not carried forward), per KN-TECH-018 and
        RQ-EWALK.
      - >-
        AUTOMORPHISM ANCHOR: the (m=|Aut|, kappa_Aut) point recomputed and checked
        against the committed net gain, so the curve is calibrated at its known
        point.
      - >-
        PLANTED CHEAP-CANON POSITIVE CONTROL: a synthetic m=8 identification given
        an O(1) canonical form; the instrument must report the excess (RQ-INSTR /
        C4).
      - >-
        UNSOUND-CANON NEGATIVE CONTROL: a canonicalization that is not a true
        class function; its collisions must be flagged spurious
        (IDEA-20260807-15b468).
      - >-
        NULL CURVE: generic-j with |Aut| = 2 and no cheap endomorphism, where the
        maximum must be the negation point.
      - >-
        BIT-IDENTICAL SEEDS across candidates so differences are attributable to
        the identification, not the draw.
    required_metrics:
      - candidate list per curve with lambda_psi, m_psi = ord_N(lambda_psi), and degree
      - kappa per candidate in group operations, and its fitted scaling exponent against m
      - canonicalization soundness (true-collision fraction) per candidate
      - net speedup sqrt(m)/kappa per candidate against the matched baseline, with MDE
      - automorphism-anchor agreement with the committed run
      - planted-cheap-canon recovery and unsound-canon rejection
      - artifact manifest with seeds, source hashes, and a rebuild receipt

  falsification_conditions:
    - >-
      Every non-automorphism candidate's measured kappa scales as Theta(m) and its
      net speedup is at or below the automorphism point within MDE. H-CANON-CAP
      holds: the sqrt(|Aut|) ceiling is confirmed at this scope WITH the named
      obstruction kappa = Theta(m), a measured cost curve, which is the intended
      first-class negative deliverable.
    - >-
      Some candidate has measured net speedup above the automorphism point by more
      than the MDE AND soundness exactly 1.0 AND a fitted kappa exponent below 0.5.
      This is NOT recorded as a result: GOAL-ENDO-001 P3 fires, an independent
      review-adversarial session audits it for an unmodelled artifact, and only
      after that (and review-breakthrough at max effort before any "break"
      language) may any excess be stated.
    - >-
      A candidate has net speedup above the automorphism point but soundness below
      1.0. The canonicalization is unsound; its "speedup" is spurious collisions,
      not a break, and the deliverable is the identification of the unsound form.
    - >-
      The planted cheap-canonicalization positive control is not recovered. Under
      GOAL-ENDO-001 P1 the instrument cannot detect a real excess; measurement
      stops and all arms are attempted_and_inconclusive.
    - >-
      The automorphism anchor disagrees with the committed net gain beyond MDE.
      The curve is uncalibrated and every candidate reading on it is suspect until
      the anchor is reconciled.

  confounders:
    - >-
      MDE MASKING (IDEA-20260821-cae674). If the net-speedup estimator's MDE is ~7%
      as in the committed run, a real 3% excess is invisible and a 3% apparent
      excess is noise. MITIGATION: every ranking against the automorphism point is
      reported with its MDE and ties within MDE are declared ties; the seed count
      needed to resolve a target excess is pre-computed.
    - >-
      SCALAR MIS-IDENTIFICATION. If lambda_psi is computed wrongly, m_psi and the
      whole candidate point are wrong. MITIGATION: independent scalar recovery on G
      and a check psi(P) = [lambda_psi]P on multiple points.
    - >-
      CANONICALIZATION-COST DEFINITION. kappa depends on the implementation of the
      canonical form; a naive implementation inflates kappa and a hand-tuned one
      deflates it, so a fair comparison must fix the cost model (group operations,
      same primitive set) across candidates. MITIGATION: a single declared cost
      model and the same field-operation primitives for all candidates.
    - >-
      SOUNDNESS-SPEED TRADE. A cheaper canonicalization may be cheaper because it
      is unsound; net speedup and soundness must be read together, never
      separately. MITIGATION: soundness is a required metric alongside every
      net-speedup number.
    - >-
      TOY-SCALE ORBIT-SIZE INTERACTION. At small N, ord_N(lambda) can be small by
      accident, making an endomorphism candidate look cheap; the scaling of kappa
      with m must be read across several curves/primes, not from one N.

  interpretation_limits:
    - >-
      TOY TIER, A SMALL CURVE BATTERY, ENUMERATED CANDIDATES ONLY. Nothing
      transfers to cryptographic scale and no transfer is offered. The supremum is
      over the enumerated identifications, never over all of them.
    - >-
      NO EXPONENT MOVES IN EITHER BRANCH. The subject is a constant factor on
      exponent 1/2; the sqrt(|Aut|) discount is and remains a constant (KN-TECH
      -018). This record measures whether that constant is optimal among cheap
      identifications, not whether the exponent can be beaten.
    - >-
      INVISIBLE CONGRUENCE. By H-ENDO-001 no identification adds a congruence on G,
      so even the automorphism point does not change what problem is being solved;
      this is a measurement of collision-walk efficiency, not of ECDLP hardness.
    - >-
      RESULTS BEAR ON THIS WALK AND CANONICALIZATION IMPLEMENTATION. A different
      canonical form has a different kappa and a different point on the curve, and
      none of this transfers between implementations.

  heuristic_assumptions:
    - id: H1
      statement: >-
        CANONICALIZATION LOWER BOUND. For a cyclic identification group
        <lambda> <= (Z/N)^* of size m acting on a prime-order group with no
        additional exploitable structure, computing the canonical (e.g. lexicographically
        minimal) representative of an orbit {[lambda^i]P} costs Theta(m) group
        operations in expectation, because the orbit elements are pseudorandom
        points with no cheaper-than-enumeration ordering.
      rigorous_support: >-
        RIGOROUS INGREDIENT: for the automorphism cases the canonical form is O(1)
        (negation compares two y-coordinates; the CM units are fixed low-degree
        maps), which bounds kappa_Aut from above by a constant -- this half is
        proved by exhibiting the form. CLASSICAL STATEMENT IMITATED: the absence of
        a sub-linear canonical form for a generic cyclic orbit is the same
        obstruction that makes a generic m-element set require Omega(m) comparisons
        to minimise; the assumption is that the scalar orbit inherits this
        genericity, which the kappa-vs-m scaling metric tests directly.
      falsification_condition: >-
        Some endomorphism candidate's measured kappa scales as o(m) (fitted
        exponent below ~0.7) -- a cheap canonical form exists, H1 fails at this
        scope, and the candidate is exactly the H-CHEAP-CANON case to route to P3.
      validation_plan: >-
        SAMPLE: for each candidate, 200 orbits at each of several N (across the
        battery curves and primes), canonicalization cost counted in group
        operations. SHORTCUT: none needed at toy scale; orbits are enumerable.
        COMPARISON: fitted exponent of kappa against m, target 1.0 for
        endomorphism candidates and ~0 for automorphisms. TAIL CHECK: the most
        expensive orbit against the Theta(m) prediction. TRANSFER: the extrapolation
        from toy N to crypto N is explicitly NOT made; the lower bound is asserted
        only where measured.
    - id: H2
      statement: >-
        SEARCH-SET REDUCTION LAW. A sound m-fold identification reduces the expected
        rho collision length by exactly sqrt(m) relative to the unquotiented walk,
        i.e. expected length ~ sqrt(pi N / (2m)), when the quotient walk behaves
        like a random function on the N/m classes.
      rigorous_support: >-
        RIGOROUS INGREDIENT: for a uniformly random function on a set of size M the
        expected rho length is (1+o(1)) sqrt(pi M / 2); with M = N/m this gives the
        sqrt(m) factor. CLASSICAL STATEMENT IMITATED: the r-adding walk on the
        quotient behaves like a random function on the quotient -- the standard
        modelling assumption of every published automorphism-quotient rho analysis
        and the one IDEA-20260815-08fbb3 questions for real partitions.
      falsification_condition: >-
        The measured baseline-to-quotient length ratio departs from sqrt(m) by more
        than 25% for a SOUND candidate, indicating the quotient walk is not
        mixing like a random function (a partition effect, not a canonicalization
        effect).
      validation_plan: >-
        SAMPLE: 200 seeds per candidate per curve, quotient and unquotiented on
        identical seeds. COMPARISON: empirical length ratio against sqrt(m); a KS
        test of the quotient length distribution against the rho-length law on N/m
        classes. TAIL CHECK: longest observed quotient walk against the predicted
        upper quantile. TRANSFER: none; measured at the parameters used.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS CLAIMED OR MOVED. This lane is, by RQ-EWALK's own statement,
      on the wrong side of the generic-group admissibility filter; the record's
      job is to measure the ceiling's mechanism precisely, and it is explicitly a
      BUILDING BLOCK for GOAL-ENDO-001's P3 (a pause condition whose baseline
      optimality has never been probed cannot fire honestly). Experiment cost:
      per curve, enumerating a handful of candidates, 200 orbits of
      canonicalization timing, and 200-seed walk pairs -- of order 10^5-10^7 group
      operations at toy N, minutes on one core.
    memory_exponent: >-
      O(w) distinguished-point store for the walk plus O(m) transient per
      canonicalization; negligible at toy scale. No preprocessing table.
    best_known: >-
      The automorphism-discounted Pollard rho baseline of KN-TECH-018: expected
      steps ~0.886 sqrt(pi N / 2)/sqrt(r), r = |Aut|/2, O(w) memory, linear
      parallel speedup under van Oorschot-Wiener; and BSGS at ~sqrt(N) time and
      memory. Both are matched controls; neither is beaten. This record measures
      whether any enumerated identification improves the CONSTANT beyond
      sqrt(|Aut|), the expected answer being no with a named cost obstruction.
    hidden_overhead: >-
      NOTHING HIDES IN AN o(1) BECAUSE NO ASYMPTOTIC IS CLAIMED. What is disclosed:
      the net-speedup estimator has a finite MDE (IDEA-20260821-cae674), so a small
      true excess or shortfall is below the instrument's resolution unless the seed
      count is raised, and every ranking respects that MDE.
    tradeoff_note: >-
      The relevant tradeoff is soundness-vs-speed and parallel: a canonicalization
      that is not a true class function breaks van Oorschot-Wiener distinguished
      -point collision detection (IDEA-20260807-15b468), so any cheap-canon
      candidate must be checked against that soundness constraint before its net
      speedup is believed. This record makes soundness a required metric precisely
      because the tradeoff is where a spurious "excess" would come from.

  dominated_by: >-
    CHECKED ACROSS EVERY FRONTIER AXIS BEFORE ANSWERING. As an ECDLP attack: n/a
    (no result claimed) -- no time/memory/query point is offered and no candidate
    is claimed to beat the baseline. As a rho improvement: dominated by the
    published automorphism-quotient and GLV walks (recalled), which already occupy
    the (m=|Aut|, kappa=O(1)) point this record anchors at; the record proposes no
    new walk and competes with none. As a mechanism/measurement: partially
    anticipated by IDEA-20260807-ebcae6 (which asserts the ceiling) and required by
    IDEA-20260821-cae674 (which supplies the estimator's MDE); on the (m, kappa)
    -curve axis specifically, nothing in the corpus dominates it.
  sota_delta: >-
    ZERO on every attack axis in both branches. Time exponent unchanged at 1/2,
    memory unchanged, no query model touched, claim_tier toy. Quantitatively what
    changes is the campaign's characterization of its own ceiling: from a single
    measured point (m=|Aut|, net gain ~sqrt(|Aut|)) with an unstated notion of
    optimality, to a full (m, kappa) curve over enumerated identifications with a
    named, measured obstruction kappa = Theta(m) enforcing the maximum -- or, in
    the P3 branch, a flagged candidate for adversarial review.

  discriminated_from:
    - >-
      IDEA-20260807-ebcae6 asserts a ceiling on End_{F_p}(E)-quotient walks. This
      record does not assert the ceiling; it enumerates the candidate
      identifications and MEASURES the canonicalization cost that would enforce it,
      producing a curve and an obstruction rather than a supremum statement.
    - >-
      IDEA-20260807-6355c6 measures the negation-quotient net gain at the single
      point m=|Aut|. This record varies m over all enumerated identifications and
      is about which points exist above that one, not about the one.
    - >-
      IDEA-20260821-cae674 audits the committed ceiling result's resolution and its
      fruitless-cycle counter. It is a prerequisite (its MDE arithmetic is imported
      here) and is complementary: cae674 asks whether the instrument can measure
      the automorphism point precisely; this record asks what other points there
      are to measure.
    - >-
      IDEA-20260807-15b468 states the canonicalization-soundness constraint under
      parallel collision search. This record uses that constraint as a required
      metric (soundness must be 1.0) rather than as a standalone hypothesis.
    - >-
      IDEA-20260826-f412a0 (this session, RQ-VOLC) tracks the minimal endomorphism
      DEGREE mu(E) as a function of volcano depth and its per-step APPLICATION
      cost. This record instead tracks the scalar ORDER m = ord_N(lambda) and the
      CANONICALIZATION cost on a fixed curve; different object, different
      independent variable, complementary at the volcano floor where mu is huge and
      only negation survives.

  estimated_cost:
    implementation: medium
    compute: low

  recommended_priority: medium

  honest_prior_of_survival: >-
    0.9 that STEP 1-2 enumerate candidates and measure kappa cleanly. 0.75 that
    H-CANON-CAP holds -- every endomorphism candidate's kappa scales as Theta(m)
    and the automorphism point is the maximum -- consistent with the generic-group
    closure and H-ENDO-001. 0.15 that some candidate shows sub-Theta(m)
    canonicalization worth a P3 look, which is the branch that would matter and is
    why the curve is worth plotting rather than assuming the single point is the
    peak. 0.1 that the only surprises are unsound canonicalizations, a useful
    negative about the instrument.

