  title: >-
    DISTRIBUTION-BRIDGE COMPILER AUDIT: test whether structured PKE keys can be
    rerandomized to a declared plain-EndRing challenge without losing the
    decryption witness
  class: composition

  claim: >-
    Let D_ER be the exact challenge distribution of a claimed EndRing problem
    (field, curve distribution, auxiliary information, and output equivalence)
    and D_PK the candidate PKE public-key distribution. A black-box,
    single-instance reduction from breaking the PKE to solving EndRing that
    embeds its challenge as a public key must provide a polynomial-time bridge
    T whose output is within an explicit statistical or computational distance
    epsilon(lambda) of D_PK and a pullback algorithm that converts the
    reduction's recovered witness into a valid EndRing output. If T lands only
    in an oriented, F_p-rational, or level-structured subdistribution, the
    reduction supports only that named structured-EndRing variant. This is a
    necessary bookkeeping condition for this reduction shape, not proof that
    no other reduction or PKE exists.

  mechanism: >-
    Represent each source as a distribution contract. Attempt a compiler based
    on public random walks/rerandomization: sample an EndRing challenge curve,
    walk to a key-shaped curve while retaining a public transcript, generate
    the scheme's auxiliary data, and define how a recovered trapdoor pulls back
    through the dual walk. At toy sizes, enumerate both distributions exactly,
    compute support overlap and total-variation distance, and verify pullback
    on every supported instance. SÉTA's oriented locus and LIT-SiGamal's
    level-structure randomization are controls for mixing inside a structured
    graph; they are not assumed to mix to the uniform set of bare
    supersingular curves. A uniform unlabeled random-walk control tests mixing
    but is expected to lose the witness interface.

  why_not_a_renamed_known_approach: >-
    This is not a SÉTA, FESTA, SiGamal, or LIT-SiGamal variant. Those schemes
    use their own structured key distributions and hardness assumptions. The
    proposal asks whether a distribution-preserving compiler and witness
    pullback can bridge such structure to an independently specified EndRing
    challenge, and accepts a documented failure or a restricted assumption as
    a useful result.

  novelty_status: speculative
  novelty_note: >-
    Random-walk rerandomization is known in structured isogeny settings; no
    reviewed source supplied the full bridge, distance bound, and witness
    pullback required here for plain EndRing. Existence of such a compiler is
    explicitly unverified.

