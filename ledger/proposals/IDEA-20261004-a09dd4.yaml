  assumptions:
    - >-
      The reduction shape is black-box and embeds one EndRing challenge into
      one public key. Multi-instance, non-black-box, or worst-case reductions
      are outside the claim and must be analyzed separately.
    - >-
      D_ER names field of definition, curve sampling method, public auxiliary
      information, GRH conditions if used, and accepted EndRing output
      equivalence. "Random supersingular curve" is not sufficiently precise.
    - >-
      D_PK includes rejection sampling, weak-key exclusions, orientation,
      torsion bases/images, and all serialization-visible metadata.
    - >-
      Pullback must output an EndRing solution for the original challenge,
      not merely a path or order for the rerandomized key unless the declared
      equivalence reduction covers that conversion.

  heuristic_assumptions:
    - id: H1
      statement: >-
        The proposed walk mixes rapidly on its declared structured state graph.
      validation_route: >-
        Compute exact transition matrices and spectral gaps at toy sizes;
        compare t-step distributions to stationarity in total variation; seek
        a theorem or cite an applicable theorem before extrapolating.
    - id: H2
      statement: >-
        Projecting away orientation/level data does not introduce a hidden,
        key-dependent bias exploitable by the reduction or adversary.
      validation_route: >-
        Enumerate projected fiber sizes, condition on automorphism class and
        public metadata, and require an analytic fiber-weight bound at full size.

  proof_search_map:
    bottleneck: >-
      Simultaneously achieving negligible distribution distance and an
      efficient trapdoor/EndRing witness pullback after rerandomization.
    baseline_embedding:
      parameter_slice: >-
        Use published SÉTA-oriented and LIT level-structured toy state graphs
        as within-locus randomization baselines; use a uniform bare-curve walk
        as the distribution-only baseline.
      reproduction_check: >-
        Within-locus walks must reproduce their declared stationary support;
        dual-walk pullback must recover the original toy witness on every
        enumerated transition.
    observation_collision:
      observable: >-
        Canonical public-key serialization, source-locus tag, automorphism
        class, and existence/correctness of witness pullback.
      distinct_preimage_search: >-
        Find bare and structured states with the same projected curve but
        different numbers of lifts or incompatible pullback witnesses; these
        expose projection bias.
    constructive_transforms:
      - transform: reversible_random_walk
        proposed_object: >-
          A public isogeny walk plus dual transcript that maps D_ER challenges
          to candidate keys and pulls recovered witnesses back.
        predicted_gain: >-
          If distance is negligible and pullback polynomial, closes one exact
          distribution arrow in an EndRing reduction.
      - transform: rejection_corrected_projection
        proposed_object: >-
          Fiber-weighted rejection sampling from a structured state graph to
          the target public-key distribution.
        predicted_gain: >-
          Removes measurable key-distribution bias if fiber weights are
          computable without the hidden EndRing witness.
    quantifier_order: >-
      First fix security parameter and both distribution contracts; then draw
      the EndRing challenge, apply T, quantify over reduction/adversary coins,
      and require pullback for every successful recovered witness except an
      explicitly bounded failure event.
    method_ceiling:
      strongest_certifiable_claim: >-
        Exact toy support/distance/pullback results and, if found, a conditional
        compiler theorem. Failure at toy sizes names a distribution mismatch,
        not a global impossibility.
      nearby_object_control: >-
        A uniform unlabeled random walk should mix toward bare curves but fail
        witness-preserving key generation; a structured walk should preserve
        witnesses but remain on its restricted support.
    proof_obligations:
      - claim: T is polynomial time and uses no unavailable EndRing witness
        responsibility: reduction correctness
      - claim: distance between T(D_ER) and D_PK is negligible or computationally bounded
        responsibility: distribution theorem
      - claim: every accepted adversary output pulls back to the declared EndRing output relation
        responsibility: algebraic reduction
      - claim: auxiliary information supplied by T is simulatable and covered by the hardness assumption
        responsibility: security model
      - claim: any GRH use is isolated to the exact path/EndRing conversion that needs it
        responsibility: conditionality accounting
    not_applicable_reason: null

  predictions:
    - metric: total-variation distance between compiled and target key distributions at toy size
      direction: lower_is_better
      minimum_effect: exactly 0 in exhaustive toy cells for an exact compiler, or a predeclared negligible analytic bound
    - metric: pullback failures among supported compiled instances
      direction: equal
      minimum_effect: exactly 0; one unexplained failure refutes the compiler contract
    - metric: target public keys outside the compiler support
      direction: equal
      minimum_effect: exactly 0 for exact support, otherwise their mass must be explicitly bounded
    - metric: structured-locus membership advantage from public serialization
      direction: lower_is_better
      minimum_effect: no advantage beyond the declared distance bound

  minimal_test:
    design: >-
      At three toy primes, enumerate bare supersingular curves, the relevant
      SÉTA-oriented and LIT-level states, and candidate public-key
      serializations. Build exact transition matrices for walk lengths 0..t,
      project to public keys, compute support and total-variation distance,
      and execute dual-transcript witness pullback for every transition and
      every accepted normalized recovered witness.
    controls:
      - kind: positive
        object: identity compiler between two identical explicitly enumerated distributions
        expected: zero distance and zero pullback failures
      - kind: structured_positive
        object: SÉTA/LIT-shaped walk measured against its own structured stationary support
        expected: decreasing distance within that support, without a claim about bare curves
      - kind: negative
        object: uniform unlabeled supersingular walk with orientation/torsion metadata discarded
        expected: >-
          can approach a bare-curve distribution but fails to construct or
          pull back the candidate's structured decryption witness
    required_metrics:
      - exact support sizes and overlap
      - total-variation distance by walk length
      - projected fiber-size histogram
      - pullback failure count
      - simulator runtime and public transcript size
    stop_condition: >-
      Stop with a typed failed arrow if either distance or pullback cannot be
      established; name the resulting structured-EndRing assumption rather
      than upgrading it to plain EndRing.

  falsification_conditions:
    - >-
      A polynomial exact/negligible-distance bridge with verified pullback and
      auxiliary-information simulation falsifies the proposed distribution
      gap for that candidate and yields a constructive reduction component.
    - >-
      Any target key of non-negligible mass outside compiler support falsifies
      an exact embedding claim.
    - >-
      Any pullback failure on an accepted recovered witness falsifies the
      stated compiler unless included in a predeclared negligible event.

  confounders:
    - Toy mixing can be dominated by exceptional automorphisms or tiny graph diameter.
    - Curve-isomorphism uniformity differs from uniformity over serialized models.
    - Rejection sampling may require inaccessible fiber weights and leak timing.
    - A path transcript may itself reveal auxiliary structure absent from D_ER.
    - Computational indistinguishability could hold despite visible toy statistical distance, but requires its own assumption and proof.

  interpretation_limits:
    - No compiler is claimed to exist and no experimental outcome is asserted.
    - A failed bridge rules out only the specified black-box single-instance reduction shape.
    - GRH-conditional EndRing/path equivalence does not erase distribution or auxiliary-information mismatches.

  target_complexity:
    time_exponent: >-
      Desired bridge overhead polynomial in log p; no EndRing or PKE security
      exponent improvement is claimed.
    memory_exponent: desired polynomial in log p; unproved
    data_queries: one EndRing challenge per compiled key in the scoped reduction
    best_known_comparison: >-
      Reviewed schemes already provide polynomial-time key generation and
      encryption under structured assumptions. The proposal's best possible
      gain is reduction hygiene, not faster PKE; absent a bridge it is strictly
      dominated as a construction.
    hidden_overhead: mixing length, rejection rate, dual transcript, fiber weighting, and metadata simulation
    tradeoff: possible cleaner assumption at the cost of extra public transcript and unproved mixing/pullback

  estimated_cost:
    implementation: medium
    compute: medium
    detail: exact graph and distribution enumeration at toy primes plus symbolic reduction audit
  dependencies:
    - exact samplers for D_ER and D_PK
    - structured-state and bare-curve canonicalization
    - reversible toy isogeny walks and normalized EndRing outputs
  recommended_priority: medium

  dominated_by:
    verdict: yes_until_bridge_exists
    justification: >-
      Existing structured PKEs dominate on functionality and measured
      performance. This proposal has value only as a reduction component or a
      precise negative audit; it claims no construction advantage.
  sota_delta:
    time_exponent_change: 0
    memory_exponent_change: 0
    quantitative_audit_delta: >-
      Adds three required numbers to each claimed embedding: support-mismatch
      mass, distribution distance epsilon(lambda), and pullback-failure
      probability. Plain-EndRing labeling requires all three to be negligible.
  honest_accounting:
    object: distribution bridge T plus recovered-witness pullback
    depth_of_verified_structure: proposed exact toy enumeration; no full-size bridge theorem
    closures:
      - closure: within-locus rerandomization
        mechanism: Markov walk on the explicitly structured state graph
      - closure: plain-EndRing embedding
        mechanism: only a negligible-distance compiler plus polynomial pullback; presently open
    open_directions:
      - prove mixing and fiber-weight bounds for a candidate structured graph
      - search for a pullback-preserving walk that does not publish a path-side channel
      - formulate multi-instance or worst-case reductions if the single-instance bridge fails
