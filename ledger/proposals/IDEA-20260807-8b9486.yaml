  sota_delta: >-
    Zero speedup against any attack baseline; the exponent stays 1/2 and the rho
    constant stays 0.886. The quantitative delta is a CLOSURE with an exact
    constant: it identifies the complete within-class variation of the
    summation-polynomial support as a two-valued function supported on the O(1)
    crater curves of the classes with D_0 in {-3, -4}, and it caps the
    associated sparse-algebra saving at the computed ratio nnz_gen/nnz_special
