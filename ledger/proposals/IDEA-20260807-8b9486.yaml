    time_exponent: >-
      UNCHANGED AT 1/2. No exponent is claimed or moved. The best case is a
      constant-factor reduction in the sparse-linear-algebra stage of one attack
      family on the O(1) crater curves of classes with D_0 in {-3, -4}.
    memory_exponent: >-
      Unchanged. A sparser matrix costs less memory by the same constant factor
      R; the exponent is untouched.
    best_known: >-
      0.886 sqrt(N) group operations at O(1) memory (KN-TECH-001, KN-TECH-006),
      already discounted for negation (KN-TECH-018); BSGS at sqrt(N) time and
      memory (KN-TECH-031). On CM curves specifically the discounted rho
      baseline of KN-TECH-018 with sqrt(|Aut|) <= sqrt(6) is the binding row and
      is the one this record must be compared against.
    hidden_overhead: >-
      Nothing hides in an o(1) here because there is no asymptotic claim. What
      DOES hide is the transport cost Otilde(p^{1/4}), which is asymptotically
      negligible but is a real p^{1/4} of work that must be paid before the
      constant-factor prize is collected -- so for any concrete p the prize must
      exceed p^{1/4} in absolute terms to be worth taking, which at
      cryptographic sizes it does not.
    tradeoff_note: >-
      None introduced. The only trade is transport work against a constant-factor
      saving, and the record's own conclusion is that the trade is unfavourable
      at every concrete size.

  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES. Dominated on time by parallel
    rho at 0.886 sqrt(N) with O(1) memory (KN-TECH-001, KN-TECH-006), by the
    automorphism-discounted rho on exactly the CM curves this record singles out
