idea:
  id: IDEA-20260807-8b9486
  question_id: RQ-ICINV-475b5e
  added: '2026-08-07'
  title: >-
    THE ONLY WITHIN-CLASS VARIATION OF THE SUMMATION-POLYNOMIAL COEFFICIENT
    STRUCTURE, LOCATED EXACTLY AND CAPPED EXACTLY: the support of S_m is a
    function of the vanishing pattern of (a, b) alone, so it is constant on the
    open locus ab != 0 and degenerates only at j = 0 and j = 1728 -- each of
    which occurs at most once per class and only when D_0 = -3 or -4 -- and the
    resulting sparsity gain is a closed-form constant that this record computes
    rather than measures
  class: representation

  claim: >-
    (A) THE FUNCTIONAL. Take as the cost functional the SUPPORT of the m-th
    summation polynomial -- the set of monomials with non-zero coefficient --
    together with the derived quantities an algebraic solver actually pays for:
    the number of non-zero coefficients nnz(S_m), the density of the Macaulay
    matrix built from it, and the Newton polytope that governs BKK-type sparse
    elimination (KN-TECH-007). These are genuine costs: sparse linear algebra
    and polytope-driven elimination are charged per non-zero entry
    (KN-TECH-008), and the program has recorded BKK-based speedups
    (KN-FIND-2a8b7e, KN-FIND-c7d31e as cited by IDEA-20260806-e4f96e).

    (B) WHY IT COULD DEPEND ON THE EQUATION AND NOT ONLY ON (p, N, t), STATED
    EXACTLY. S_3(x1, x2, x3) for y^2 = x^3 + a x + b is
      (x1-x2)^2 x3^2 - 2[(x1+x2)(x1 x2 + a) + 2b] x3 + [(x1 x2 - a)^2 - 4b(x1+x2)].
    Its monomials fall into three groups: those with no a or b (present always),
    those carrying a (the terms a x3(x1+x2), a x1 x2 -- from expanding -- and
    a^2), and those carrying b (4b x3 and -4b(x1+x2)). Therefore
        support(S_3) is a function of the pair of BITS (a = 0?, b = 0?)
    and of nothing else. Since a = 0 <=> j = 0 and b = 0 <=> j = 1728, the
    support is constant on the open locus and takes exactly two other values.
    This is a curve-equation functional in the strictest sense: it reads (a, b)
    directly. It is ALSO gauge-invariant, since a = 0 <=> u^4 a = 0 -- so unlike
    the window functionals it cannot be moved by choosing a different equation
    for the same curve, and the gauge null of IDEA-20260807-6eb96b is a mode-1
    null for it, which this record states rather than discovers.

    (C) THE EXACT CLASS-LEVEL ANSWER. By T4 of DECOMPOSITION.md, a class
    contains a j = 0 curve only if D_0 = -3 and a j = 1728 curve only if
    D_0 = -4, and in those cases the special curve sits at the CRATER, where
    End(E) is the maximal order O_K = Z[zeta_3] or Z[i]. Hence:
      CLASS WITH D_0 not in {-3, -4}: support(S_m) is CONSTANT across the entire
        class. The functional is a class invariant, with the obstruction named
        (O-SUPPORT): the support depends on (a, b) only through their vanishing,
        the vanishing is an isomorphism invariant, and the only isomorphism
        classes with a vanishing coefficient are j = 0 and j = 1728, which the
        class does not contain.
      CLASS WITH D_0 = -3 (resp. -4): exactly the crater curves with j = 0
        (resp. 1728) have the smaller support. Within-class variance is
        NON-ZERO, it is TWO-VALUED, and the minimiser has a CLOSED-FORM ADDRESS.
    So this is the lane's cleanest example of a functional that is a class
    invariant on almost every class and provably non-constant on a thin,
    completely characterised family.

    (D) THE PRIZE, CAPPED BEFORE MEASUREMENT. This record does not measure a
    speedup; it computes a ceiling. Let nnz_gen(m) and nnz_0(m), nnz_1728(m) be
    the non-zero counts of S_m on the generic locus and at the two special j.
    The sparse-solver cost is linear in nnz, so the best possible gain from
    moving to the special curve is the ratio nnz_gen/nnz_special, a CONSTANT
    independent of p. For m = 3 this ratio is computable by hand and by sympy in
    seconds. And there is a second, independent cap already in the corpus:
    KN-TECH-018 records that the automorphism discount available at j = 0 and
    j = 1728 is at most sqrt(6), a constant, never an exponent, and L3's
    obstruction requires any claim on these curves to EXCEED that or be labelled
    baseline calibration. This record labels itself baseline calibration in
    advance.

    (E) THE TWO OUTCOMES. OUTCOME C (constant support within every class with
    D_0 outside {-3,-4}, two-valued otherwise): the derivation in (B)-(C) is
    confirmed, the functional is closed with the obstruction named, and the
    exact ratio is recorded as a permanently available constant. OUTCOME V
    (support varies inside a class with D_0 outside {-3,-4}): the reasoning in
    (B) is wrong -- some coefficient of S_m vanishes for a reason other than
    a = 0 or b = 0 -- and that would be a genuinely surprising algebraic fact
    about summation polynomials worth its own record. Both outcomes are
    deliverables and OUTCOME V is checkable exhaustively at toy scale.

  resource_label: >-
    R2 (the curve equation and model: the functional reads the coefficients
    (a, b) themselves) with a downstream effect on R1 (the field-element
    computations of the decomposition system).
  admissibility: admissible
  admissibility_argument: >-
    The support of S_m is read off the Weierstrass coefficients. No
    group-operation oracle can produce it: an algorithm restricted to add,
    negate and equality-test on G never sees a or b. It escapes KN-FIND-b7e091
    trivially, since neither the incidence nor the endomorphism-image oracle
    outputs a polynomial coefficient. It is admissible AND, by this record's own
    conclusion, worthless as an attack -- admissibility of the resource and
    value of the direction are different questions and this record separates
    them explicitly.

  discriminated_from:
    - >-
      RQ-JINV-8fc13a / L3, which owns j = 0, j = 1728 and small |D_0| as a lane.
      L3 asks whether special j changes anything at all beyond the
      automorphism-quotient rho constant. This record does not answer that
      general question: it answers one specific sub-question -- what does
      special j do to the SUPPORT of the summation polynomial -- and it answers
      it by derivation plus an exhaustive toy check rather than by a cost
      measurement. It also supplies L3 with the exact constant that L3's
      obstruction (exceed sqrt(6) or label as calibration) requires.
    - >-
      KN-TECH-007 (BKK and sparse elimination). This record uses the Newton
      polytope as an observable, not as a method, and it explicitly warns that
      for the standard system {S_3(., ., x_R), f_V(x1), f_V(x2)} the BKK bound
      is dominated by deg f_V = B and is therefore INSENSITIVE to the S_3
      polytope. The sensitive quantity is nnz and the SYMMETRISED system in
      elementary symmetric coordinates, not the raw mixed volume, and this
      distinction is stated up front rather than discovered mid-experiment.
    - >-
      IDEA-20260807-0ff796, which counts solutions of the same polynomial. That
      count is p - 1 - t and is a class invariant for a completely different
      reason (birational geometry). Support and solution count are independent
      observables of one object: the special curves have a smaller support and
      the SAME solution count.

  object_first_candidate:
    tracked_object: >-
      THE SUPPORT (equivalently the Newton polytope, equivalently the
      coefficient-vanishing pattern) of the summation polynomial S_m of E,
      followed across a complete F_p-isogeny class and across the gauge orbit.
    lossiness: >-
      LOSSY: it retains which monomials appear and discards every coefficient
      VALUE, hence discards a, b, j and the curve. LOSSY-PROJECTION TEST
      APPLIED, and the honest verdict is that it passes but WEAKLY: what is
      discarded (coefficient values) is discarded compatibly with the operations
      sparse linear algebra performs, since a sparse solver's cost depends on
      the pattern and not the values; but the retained part is only two bits, so
      the projection is so lossy that it can distinguish at most three classes
      of curves. That is precisely why the record's honest prior is low and its
      priority is low -- an object with a three-element range cannot carry an
      exponent.
    propagation: >-
      Under gauge: EXACTLY invariant (a = 0 iff u^4 a = 0). Under an isogeny:
      not functorial at all -- the isogeny relates the curves but not their
      summation polynomials by any support-preserving map -- so the support of
      S_m on E' must be recomputed from (a', b') and there is no propagation
      rule. That failure of propagation is what makes the class question
      non-trivial in the first place, and (B)-(C) answer it by pointing at j
      rather than by finding a rule.
    survival_score: >-
      Survives change of arity m (the argument is the same for S_4, S_5, with
      the vanishing pattern inherited through the resultant recurrence), change
      of p, change of factor base. Dies immediately at a change of MODEL: in
      Montgomery, Edwards or Hessian form the "a = 0" condition means something
      else entirely and the whole analysis must be redone -- which is the
      overlap with RQ-MODEL-e61cb2 / L11 and is that lane's business, not this
      record's.

  mechanism: >-
    STEP 1 -- EXACT SUPPORT COMPUTATION, ZERO COMPUTE BEYOND SYMPY. Compute
    S_3 and S_4 symbolically over Q[a, b][x_i] (harness/semaev.py already
    provides s3_expr and s4_expr, the latter by resultant). Tabulate the monomial
    support and nnz for (i) generic a, b; (ii) a = 0; (iii) b = 0. Report the
    exact ratios nnz_gen/nnz_0 and nnz_gen/nnz_1728 for m = 3 and m = 4. Also
    compute the Newton polytope vertices and its normalised volume in each case.
    This is the record's PRIMARY DELIVERABLE and it costs seconds.

    STEP 2 -- THE MIXED-VOLUME HONESTY CHECK. Compute the BKK bound for the
    actual decomposition system {S_3(., ., x_R), f_V(x1), f_V(x2)} in both the
    generic and the special cases, and confirm or refute the record's own
    prediction that it is dominated by B and therefore INSENSITIVE to the S_3
    polytope. Then repeat in the SYMMETRISED coordinates (e_1 = x1 + x2,
    e_2 = x1 x2), where S_3 becomes a polynomial in (e_1, e_2, x_R) whose
    support does change, and report whether the mixed volume there is sensitive.
    A record that reported a polytope gain without this check would be claiming
    a BKK improvement that the system does not have.

    STEP 3 -- EXHAUSTIVE TOY VERIFICATION OF THE CLASS STATEMENT. Enumerate
    complete classes at p in [2^12, 2^14]. For every member compute the support
    of S_3 and check: (i) support is constant across every class whose D_0 is
    not -3 or -4; (ii) classes with D_0 = -3 contain exactly one j = 0 curve
    and it is the unique member with the smaller support; likewise D_0 = -4 and
    j = 1728. This is a complete, exhaustive check at these p -- no sampling and
    no statistics -- and it either confirms (C) or exhibits a counterexample.

    STEP 4 -- THE COST TRANSLATION, WITH BOTH CAPS. Convert the nnz ratio into
    a bound on the sparse-linear-algebra stage of point-decomposition index
    calculus (cost linear in nnz per Wiedemann/Lanczos iteration, KN-TECH-008),
    and place it beside KN-TECH-018's sqrt(|Aut|) <= sqrt(6) automorphism
    discount, which applies to the SAME curves. Report the product as the total
    constant-factor advantage available on a crater CM curve, and state plainly
    that the exponent is unchanged at 1/2.

    STEP 5 -- THE REACHABILITY LINE, WHICH IS SHORT AND EXACT. When D_0 = -3,
    the good curve's address is known a priori (j = 0), so this is route
    (R-address) of IDEA-20260807-c36472: transport costs Otilde(p^{1/4}) [open]
    against a p^{1/2} baseline. So the gate is PASSED and the direction is still
    worthless, because the prize is a constant. That combination -- reachable
    and worthless -- is worth recording precisely because it is the one the lane
    is most likely to be accused of not having checked.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Grep tool, 2026-08-07: "isogeny class" over the repository;
      "first.fall degree|first_fall|solving degree|degree of regularity" over
      the repository. Targeted reads of KN-TECH-002, KN-TECH-007, KN-TECH-008,
      KN-TECH-018, DECOMPOSITION.md T4 and L3, RQ-JINV-8fc13a,
      harness/semaev.py (s3_expr, s4_expr).
    results: >-
      KN-TECH-002 states the degree of S_n in each variable is 2^{n-2} and notes
      symmetry exploitation, but says nothing about the SUPPORT'S dependence on
      (a, b). KN-TECH-007 covers BKK generally. KN-TECH-018 supplies the
      sqrt(|Aut|) cap. DECOMPOSITION.md L3 names the sqrt(6) obstruction. No
      record states that support(S_m) is a function of the vanishing pattern of
      (a, b) alone, and no record connects that to the class through
      D_0 in {-3, -4}.
    verdict: >-
      ADAPTATION, and deliberately a small one. Every ingredient is standard;
      the assembly -- support as a class functional, its exact degeneracy locus,
      and the resulting two-valued within-class variance on exactly the
      D_0 in {-3,-4} classes -- is new to this program and is offered as a
      complete, cheap, closed sub-answer rather than as a lead.

  null_object_control: >-
    MANDATORY. MATCHED NULL: the GAUGE ORBIT is a MODE-1 NULL for this
    functional and must not be used as its spread reference -- support is
    gauge-invariant by algebra, so the gauge arm's spread is EXACTLY ZERO and a
    control with zero spread is a constant of the apparatus (KN-TECH-1a5b7e mode
    1, "if your comparator's spread is zero, your statistic is a constant"). The
    record states this before the run instead of running it and passing. THE
    ADMISSIBLE NULL is a RANDOM-CURVE arm at the same p: draw curves uniformly,
    compute support, and confirm the support takes the generic value except on
    the O(1) curves with a = 0 or b = 0 -- i.e. with probability ~2/p. DECAY
    PARAMETER: p. The fraction of curves with a degenerate support must decay
    like 1/p; a fraction that does not decay would mean coefficients vanish for
    reasons other than a = 0 or b = 0 and would be OUTCOME V. SECOND NULL: a
    random polynomial with the same monomial support and random coefficients --
    its nnz is identical, which demonstrates that nnz alone reads the SHAPE and
    not the curve, and therefore bounds what any nnz-based conclusion may say.

  assumptions:
    - >-
      [fact, re-derivable] The support of S_3 depends on (a, b) only through
      which of them vanish. Verified by inspection of the displayed formula in
      (B); Step 1 re-verifies symbolically and extends to S_4.
    - >-
      [fact] Over F_p with p > 3, a = 0 <=> j = 0 and b = 0 <=> j = 1728, from
      j = 1728 . 4a^3/(4a^3 + 27b^2).
    - >-
      [fact, cited] T4 of DECOMPOSITION.md: a class contains a j = 0 curve only
      if D_0 = -3 and a j = 1728 curve only if D_0 = -4. Used as stated.
    - >-
      [open] That the crater curve of a D_0 = -3 class is the j = 0 curve. This
      is the standard CM statement (the maximal order's class polynomial has
      j = 0 as its root when D_0 = -3) and is checkable exhaustively at toy
      scale in Step 3 rather than quoted.
    - >-
      [scope] Toy scale, p <= 2^14 for exhaustive class enumeration, claim_tier
      toy. The SYMBOLIC part of the record (Steps 1, 2) is scale-free and is the
      part that carries the conclusion.

  proof_search_map:
    bottleneck: >-
      Step 2's mixed-volume honesty check. Everything else is a symbolic
      tabulation. If the BKK bound of the actual decomposition system is
      insensitive to the S_3 polytope -- as this record predicts -- then the
      polytope half of the functional is vacuous and only nnz survives, which
      shrinks the record's claim from "sparse elimination benefits" to "the
      matrix has fewer non-zeros by a constant factor". That single step decides
      how much the record is allowed to say.
    baseline_embedding:
      parameter_slice: >-
        Generic (a, b) with ab != 0. At that slice every quantity must reproduce
        the standard S_3 of KN-TECH-002 exactly, monomial for monomial, and the
        BKK bound must reproduce the value the program's existing BKK-lane
        records report for the same system.
      reproduction_check: >-
        Frozen symbolic fixture: assert equality of s3_expr(a, b) with the
        KN-TECH-002 displayed polynomial as a sympy expression difference equal
        to zero, and assert the monomial count against a hard-coded integer. Any
        mismatch is an instrument failure and halts the record.
    observation_collision:
      observable: >-
        nnz(S_m) and the Newton polytope of S_m.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, which is the point of the second null:
        a random polynomial with the same support has the same nnz and the same
        polytope. So the observable does NOT identify the curve, it identifies
        the shape -- and any conclusion drawn from it is a conclusion about the
        shape. Reporting an nnz-based gain without stating that collision is
        prohibited.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Specialise (a, b) to the two degenerate loci a = 0 and b = 0, measure
          the support there, and pack the result back as a statement about which
          isogeny classes contain such a specialisation. The specialisation is
          exact and the packing is T4.
        predicted_gain: >-
          Converts an open "does the coefficient structure vary within a class"
          into a complete case analysis with three cases and an exact constant
          in each. The gain is completeness, not speed.
      - transform: observable_fiber
        proposed_object: >-
          The fibre of the support map: the set of all curves with a given
          support. It has three elements as a set of supports, and its fibres
          are {ab != 0}, {a = 0}, {b = 0}. Exhibiting the fibres IS the closure.
        predicted_gain: >-
          Shows immediately that the functional cannot separate more than three
          families, hence cannot carry an exponent, before any measurement.
    quantifier_order: >-
      Claimed: FORALL p > 3, FORALL ordinary F_p-isogeny classes with
      D_0 not in {-3, -4}, FORALL members E of that class, support(S_m(E)) is
      THE SAME set of monomials. And: FORALL p > 3, FORALL classes with
      D_0 = -3, EXISTS EXACTLY ONE member (up to the sextic twists that share
      j = 0 and split across traces) whose support is strictly smaller. The
      quantifier trap avoided: it is NOT claimed that FORALL classes EXISTS a
      member with small support -- that is false for almost every class, and
      stating it would turn a sharp result into a wrong one.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The summation-polynomial support is constant on every F_p-isogeny class
        with D_0 outside {-3, -4}, and two-valued with a closed-form minimiser
        otherwise; the resulting sparse-linear-algebra gain is at most the
        constant nnz_gen/nnz_special, computed exactly." It can NEVER certify
        anything about solving degree, about relation yield, about the exponent,
        or about models other than short Weierstrass.
      nearby_object_control: >-
        THE NEARBY OBJECT ON WHICH THE CONCLUSION FAILS: a curve with a and b
        both non-zero but with a^3/b^2 chosen so that some OTHER coefficient
        combination vanishes -- e.g. 4a^3 + 27b^2 near zero (singular limit) or
        a value making a resultant coefficient vanish in S_4. If such a curve
        exists with a strictly smaller support, (B) is incomplete and OUTCOME V
        fires. The exhaustive toy sweep in Step 3 is precisely a search for this
        object and must be reported whether or not it finds one.
    proof_obligations:
      - claim: support(S_3) is determined by (a = 0?, b = 0?).
        responsibility: correctness
      - claim: The same holds for S_4 via the resultant recurrence.
        responsibility: correctness
      - claim: a = 0 <=> j = 0 and b = 0 <=> j = 1728 over F_p, p > 3.
        responsibility: baseline
      - claim: A class contains j = 0 only if D_0 = -3.
        responsibility: scope
      - claim: The BKK bound of the decomposition system is dominated by B.
        responsibility: strictness
      - claim: nnz_gen/nnz_special is a constant independent of p.
        responsibility: size

  predictions:
    - metric: >-
        nnz(S_3) and nnz(S_4) at generic (a, b), at a = 0, and at b = 0
      direction: lower
      minimum_effect: >-
        Strictly lower at a = 0 and at b = 0 than at generic (a, b); the exact
        integers are the deliverable. If the counts are EQUAL, (B) is wrong and
        the record collapses -- which is a two-second check.
    - metric: >-
        number of distinct supports of S_3 observed across a complete toy class
        with D_0 outside {-3, -4}
      direction: lower
      minimum_effect: >-
        EXACTLY 1. Any class with D_0 outside {-3,-4} exhibiting two supports is
        OUTCOME V and refutes (C). This is an exhaustive integer check with no
        statistical threshold.
    - metric: >-
        number of members with the smaller support in a class with D_0 = -3
      direction: different
      minimum_effect: >-
        EXACTLY 1 (the j = 0 crater curve of that trace). Zero or two would
        refute the crater identification in (C) and is checkable exhaustively.
    - metric: >-
        BKK mixed volume of {S_3(., ., x_R), f_V(x1), f_V(x2)} at generic versus
        special (a, b)
      direction: different
      minimum_effect: >-
        PREDICTED IDENTICAL, because the bound is dominated by deg f_V = B. A
        difference would mean the polytope IS sensitive and would strengthen the
        record; the prediction is recorded now so that "no difference" is a
        confirmed forced value rather than a null finding.

  minimal_test:
    design: >-
      STAGE 0 (seconds): symbolic support tabulation for S_3 and S_4 at generic,
      a = 0 and b = 0, plus the frozen fixture asserting s3_expr equals the
      KN-TECH-002 polynomial. This alone is the primary deliverable.
      STAGE 1 (minutes): the mixed-volume honesty check in both raw and
      symmetrised coordinates.
      STAGE 2 (~1 hour): exhaustive class enumeration at p in [2^12, 2^14] and
      the three integer checks of the predictions.
      STAGE 3 (zero compute): the cost translation with both caps
      (nnz ratio and KN-TECH-018's sqrt(6)), and the reachability line.
      Total cost is well under a day and most of it is Stage 2's enumeration,
      which is shared with IDEA-20260807-0ff796 and should not be paid twice.
    controls:
      - random-curve arm at the same p (degenerate support must be ~2/p rare)
      - random polynomial with matched support (nnz reads shape, not curve)
      - frozen symbolic fixture against KN-TECH-002
      - explicit statement that the gauge null is MODE-1 here and is not used
      - exhaustive rather than sampled class sweep, so no sampling control needed
    required_metrics:
      - exact monomial supports and nnz for S_3, S_4 in all three regimes
      - Newton polytope vertices and normalised volume in all three regimes
      - BKK mixed volume of the decomposition system, raw and symmetrised
      - number of distinct supports per class, per class, exhaustively
      - the class's D_0 and whether j = 0 or 1728 occurs
      - the product of the nnz ratio and the sqrt(|Aut|) discount

  falsification_conditions:
    - >-
      nnz at a = 0 equals nnz at generic (a, b). (B) is wrong; the record is
      superseded. Cost of discovering this: seconds.
    - >-
      Some class with D_0 outside {-3, -4} exhibits two distinct supports.
      OUTCOME V: a coefficient of S_m vanishes for a reason not captured by
      (a = 0?, b = 0?), which is an algebraic fact about summation polynomials
      worth its own record and which invalidates (C).
    - >-
      A D_0 = -3 class contains zero or two members with the smaller support.
      The crater identification in (C) is wrong.
    - >-
      The symmetrised mixed volume DOES differ between regimes. The record's
      prediction is refuted and the polytope half of the functional becomes
      live, which would raise the record's priority rather than kill it.
    - >-
      Exhaustive enumeration at p = 2^14 exceeds budget. INFRASTRUCTURE outcome
      under AGENTS.md rule 5; reduce p, report as such.

  confounders:
    - >-
      SEXTIC AND QUARTIC TWISTS. j = 0 has six twists and j = 1728 has four,
      distributed across SEVERAL traces. So "the class contains a j = 0 curve"
      must be checked per trace, not per j: only the twists whose trace matches
      the class belong to it. Pooling twists across traces would manufacture a
      fake count of 6 instead of 1.
    - >-
      SUPERSINGULARITY. j = 0 is supersingular when p = 2 mod 3 and j = 1728
      when p = 3 mod 4. Those curves are outside the ordinary setting; primes
      must be chosen so the intended case is ordinary, and the choice recorded.
    - >-
      SPARSITY IS NOT SPEED. nnz is a proxy for sparse-solver cost only under
      the assumption that cost is linear in nnz. Wiedemann/Lanczos iteration
      counts depend on other things too (KN-TECH-008), so the translation in
      Step 4 is a bound and is labelled as one.
    - >-
      MODEL DEPENDENCE. The whole analysis is short-Weierstrass. In Montgomery
      or Edwards form the degeneracy loci are different and none of this
      transfers; that is L11's territory.

  interpretation_limits:
    - >-
      This closes ONE functional -- the coefficient support -- and gives its
      exact within-class behaviour. It says nothing about solving degree, yield,
      Fourier structure, or the ECDLP.
    - >-
      The result is a CONSTANT-FACTOR statement by construction, and constants
      do not move the exponent 1/2 (KN-TECH-005, KN-TECH-018). The record labels
      itself baseline calibration and asks to be read as such.
    - >-
      Toy-scale enumeration verifies the class statement at p <= 2^14. The
      symbolic part is scale-free; the enumeration part is not, and neither is
      presented as crypto-scale validation.
    - >-
      A constant advantage on crater CM curves is not a weakness of any deployed
      curve: standard curves are not chosen with D_0 in {-3, -4} by accident and
      the scope statement must say which families are and are not affected.

  heuristic_assumptions:
    - id: H1
      statement: >-
        The cost of the sparse-linear-algebra stage of point-decomposition index
        calculus is linear in nnz of the Macaulay/relation matrix, so an nnz
        ratio of R translates into at most a factor-R saving in that stage.
      rigorous_support: >-
        Rigorous for the per-iteration cost of Wiedemann and Lanczos, which is
        one matrix-vector product, i.e. Theta(nnz) field operations
        (KN-TECH-008). The heuristic part is that the ITERATION COUNT does not
        change, which imitates the classical expectation that the iteration
        count depends on the matrix dimension rather than its density.
      validation_plan: >-
        Measure both nnz and the iteration count for matrices arising from
        generic and from j = 0 curves at matched dimension, over >= 20
        instances, and report the observed cost ratio against R. A ratio
        materially below R means the iteration count moved and the translation
        in Step 4 must be corrected. TOY SCALE, labelled.
    - id: H2
      statement: >-
        Among curves over F_p, the fraction with a = 0 or b = 0 is
        (2p - 1)/p^2 = O(1/p), so a random-curve arm sees the degenerate support
        with probability O(1/p).
      rigorous_support: >-
        Exact counting, not a heuristic: there are p - 1 non-singular curves
        with a = 0 and p - 1 with b = 0 out of ~p^2 pairs. Listed here because
        it is the DECAY PARAMETER of the null and must be checked rather than
        assumed of the harness's curve generator.
      validation_plan: >-
        Draw >= 10^5 curves from the harness generator at p = 4001 and count
        degenerate supports; compare against 2/p by exact binomial test. A
        deviation is an instrument finding about the generator.

  reachability_gate: >-
    ROUTE (R-address) OF IDEA-20260807-c36472, AND IT IS PASSED. When D_0 = -3
    the minimiser's address is known with no search at all: it is the curve
    j = 0, i.e. y^2 = x^3 + b for the b that gives the right trace among the six
    sextic twists, which is found by counting points on at most six curves.
    Transporting the instance to it requires an explicit connecting isogeny,
    costing Otilde(p^{1/4}) [open, per IDEA-20260807-c36472 H3] against a
    p^{1/2} baseline -- affordable. SO THE GATE IS PASSED AND THE DIRECTION IS
    STILL WORTHLESS, because the prize is a constant bounded by
    nnz_gen/nnz_special times sqrt(6) and constants do not move the exponent.
    Recording a passed gate with a worthless prize is deliberate: it is the
    exact configuration a reader would otherwise suspect the lane of having
    skipped.

