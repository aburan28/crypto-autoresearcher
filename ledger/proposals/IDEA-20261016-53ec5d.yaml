idea:
  id: IDEA-20261016-53ec5d
  question_id: RQ-CZLIFT-b9f765
  added: '2026-10-16'
  title: >-
    Carry law and height window: why the NAIVE section of F_p^* works exactly
    below p, and its elliptic transposition by rational reconstruction
  class: mechanism
  claim: >-
    (M) F_p^*, naive section s(a)=a in [1,p), q(a)=(a^(p-1)-1)/p, integer generator g,
    d in [2,n-2], k_d=floor(g^d/p) on the UNREDUCED power, a=g^d mod p. Exact:
    q(a)=d*q(g)+k_d/a mod p, so Smart's ratio is right iff p | k_d: success set =
    {d: g^d<p} U {d: p | floor(g^d/p)}; this predicts EXP-CZLIFT-bdae69 pair by
    pair (24 carry-free successes, rest at 1/p). (E) E/Q, G of infinite order, p
    good. Partial section s(R)= the rational point whose x is the rational
    reconstruction a/c of x(R) mod p (|a|,c<sqrt(p/2), c a square, y rational).
    s(dP)=dG iff h_x(dG)<=(1/2)log p; h_x(dG)=2d^2*hhat(G)+O(1), so the window is
    d<=d_max=sqrt(log p/(4*hhat(G))): d_max^2 linear in log p (F_p^*: d_max
    linear). 'Point addition always reduces' holds for sections built in F_p
    arithmetic, not for sections built in E(Q), which reduce only at the end. The
    window is polylog in p: the analogue exists and has no DLP content.
  mechanism: >-
    PAIR: representation = global rational point recovered from a residue (R3);
    Sigma = integer multiples m<=d_max and sums staying in the window (not
    translation). TRICHOTOMY: partial-action (closed while the height stays
    <=(log p)/2; past it reduction is still injective, rigorously hhat(R1-R2)>=
    log p-C_E for R1=R2 mod p, but the preimage is unrecoverable: that missing
    information is the carry). LOSSY TEST: reduction is a homomorphism
    (compatible with Sigma), injective on the window, i.e. a change of
    coordinates there (stated); only the window edge is claimed. PRICE: one
    continued fraction O(log^2 p) plus a square test per residue. No factor base.
