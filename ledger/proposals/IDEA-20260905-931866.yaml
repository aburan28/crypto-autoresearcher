      proposed_object: Primitive-norm marked point process.
      predicted_gain: Assign a measured success loss to dependence rather than an unexplained heuristic correction.
    quantifier_order: Fix form ensemble, residue primes, radius and B before observations; H1 is uniform only within
      that declared ensemble.
    method_ceiling:
