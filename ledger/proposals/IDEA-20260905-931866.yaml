  assumptions:
  - Positive-definite integral norm forms with explicit discriminant and primitive-vector convention.
  - Local weights use frozen primes and residue depth; truncation is disclosed.
  - The current finite reference uses independent Bernoulli marks conditional on frozen input entries and explicit
    p_i; the norm-arm ensemble and its weights must be frozen before moment comparison. Local residue weights are
    not themselves probabilities unless a normalization is explicitly supplied.
  predictions:
  - metric: Ratio R=M2_actual/M2_null with M2_null=lambda^2-sum_i p_i^2; first moment and zero-count probability
      reported separately
    direction: different
    minimum_effect: For M2_null>0, R outside [1/2,2] rejects H1 only on the frozen ensemble. The exact independent
      null has R=1. If M2_null=0, no ratio is reported; any nonzero actual second factorial moment fails the zero-null
      equality and otherwise that comparison is inconclusive.
  minimal_test:
    design: Prospective paper derivation of G(z)=product_i(1-p_i+p_i*z) for finite independent marks, retaining
      Gprime(1) and Gsecond(1) as stated. Freeze deterministic norm entries, local-weight-to-p_i rule and a separate
      norm-form/resampling ensemble before comparisons. The independent null must give R=1 exactly when its denominator
      is positive; only then compare the norm arm. No form enumeration, factoring or moment computation is executed
      here.
    controls:
    - 'Matched null: independently marked integers with identical size bins and residue weights.'
    - 'Known-false control: duplicated primitive directions with distinct vector labels but identical norm, which
      defeats independence.'
    required_metrics:
    - Local residue masses
    - First two factorial moments
    - Largest prime-factor bins
    - Primitive-direction multiplicities
    - Zero-count probability
    - Bernoulli diagonal sum_i p_i^2
    - M2_null and zero-denominator flag
    - Explicit finite probability-space weights
    fixtures: Integral ternary forms with coefficients at most 7, vector box [-3,3]^3, used only as proposed future
      mathematical fixtures.
    stopping_rule: Proposal only. Future separately approved paper audit stops at the first counterexample, unmet
      prerequisite, or 2-hour/2-GB bound. No mathematical experiment executed here.
  falsification_conditions:
  - At a frozen finite ensemble with M2_null>0, R outside [1/2,2] refutes H1 there. M2_null=0 invokes a nonzero-actual-moment
    failure or leaves the ratio comparison undefined.
  - Changing only labels changes the result, revealing multiplicity double counting.
  confounders:
  - Minimum selection bias
  - Fixed-prime truncation
  - Square factors and imprimitive vectors
  interpretation_limits:
  - Even a large smoothness constant does not improve F4 from exponent zero.
  - No cryptographic-scale transfer follows from bounded forms.
  heuristic_assumptions:
  - id: H1
    statement: 'H1: Fix the norm-arm finite ensemble, residue rule, radius, B and matching Bernoulli probabilities
      p_i before observations. When M2_null=lambda^2-sum_i p_i^2>0, E_norm[S(S-1)] lies in [M2_null/2,2*M2_null].
      A zero denominator invokes the separate exact-zero check and supplies no normalized ratio.'
    rigorous_support: Exact finite residue counts supply local masses; the random-integer smoothness analogy is
      reported in the target profile. Neither proves independence.
    validation_plan: Prospective exact finite ensemble comparison after the Bernoulli null passes its diagonal-corrected
      identity; compare M2_actual/M2_null, first moments and Pr(S=0) against product_i(1-p_i) for the reference.
      Coefficient growth and residue depth are separate axes. No norm sample or quaternion-to-curve transfer is
      verified in this revision.
  target_complexity:
    time_exponent: O(V*k+V*F(H)) for V supplied values, k residue tests, and explicit integer-factorization cost
      F(H).
    memory_exponent: O(V+k) words or O(k) streaming moments plus archived data.
    data_queries: V norm values, no external oracle.
    best_known: Conditional p^(1/3+o(1)) time and memory over F_p2; unconditional p^(1/2) polylog tier.
    hidden_overhead: Factoring and exact form enumeration are not polynomial-time assumptions.
    tradeoff_note: No movement from incumbent T=p^(1/2+o(1))/sqrt(w); this tests its probability inputs.
  estimated_cost:
