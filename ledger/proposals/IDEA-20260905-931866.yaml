idea:
  id: IDEA-20260905-931866
  title: Local-density corrected factorial moments for smooth primitive norm values
  class: mechanism
  claim: Conditioning smoothness on primitive norm representability requires a local-density correction and a dependence
    correction; separating them can falsify a random-integer heuristic without conflating congruence restrictions
    with an exponent change.
  mechanism: Retain deterministic primitive norm entries and their residue labels at frozen radius and prime set;
    they are not random merely because they form a multiset. For the finite independent reference, supply explicit
    Bernoulli probabilities p_i in [0,1] after the declared local weighting rule and independently draw marks X_i;
    S=sum_i X_i. The probability space is this finite product law, conditional on the supplied deterministic entries,
    bins and residue weights. Its generating polynomial G(z)=product_i(1-p_i+p_i*z) has Gprime(1)=lambda=sum_i p_i
    and Gsecond(1)=sum_{i!=j}p_i*p_j=lambda^2-sum_i p_i^2=:M2_null. For actual norm comparison, independently freeze
    a finite probability distribution on supplied form/box choices or labeled resampling units; smoothness marks
    are deterministic conditional on each member and expectation averages that declared ensemble. Deterministic
    norm data alone have no ensemble expectation. Compare actual second factorial moment with M2_null, retaining
    the diagonal correction and primitive-direction multiplicities. No Poisson equality is asserted. If a Poisson
    approximation is later considered, its exact second-moment discrepancy is sum_i p_i^2 and relative discrepancy
    is that quantity/lambda^2 when lambda>0; all further approximation claims require separate bounds.
