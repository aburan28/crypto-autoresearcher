  proof_search_map:
    bottleneck: Local bias and witness dependence are confounded in a marginal CDF.
    baseline_embedding:
      named_baseline: Finite independent Bernoulli marking
      parameter_slice: Supplied finite list p_i in [0,1]; independent marks, including the all-local-weights-one
        subcase after probabilities are separately specified.
      exact_expected_identity: Gprime(1)=sum_i p_i=lambda; Gsecond(1)=sum_{i!=j}p_i*p_j=lambda^2-sum_i p_i^2. Pr(S=0)=product_i(1-p_i).
      reproduction_check: Differentiate the finite product formally, with diagonal terms absent from the second
        derivative of each affine factor. Retain the exact correction and require reference ratio 1 if M2_null>0.
        Proposed identity audit only; no norm-value computation.
    observation_collision:
      observable: Locally corrected moment vector including lambda, sum_i p_i^2, M2_actual and zero-event probability.
      distinct_preimage_search: Equal means with independent versus perfectly correlated marks.
    constructive_transforms:
