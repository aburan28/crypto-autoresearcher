idea:
  id: IDEA-20260805-a25f11
  question_id: RQ-RELN-001
  goal_id: GOAL-RELN-001
  added: '2026-08-05'
  title: >-
    Only the collision deficit is free: an exact ceiling on P(decomp) at fixed
    factor-base size, a derived threshold B > (N/2)^{1/3} below which the best
    possible factor base is WORSE than a random one, and the graded
    additive-energy census that measures the one quantity the frozen protocol
    never names
  class: mechanism

  claim: >-
    For a prime-field Semaev factor base of B x-coordinates on E(F_p) with
    N = #E(F_p), the mean number of size-m decompositions of a random target is
    exactly mu(B,m) = C(2B+m-1,m)/N and is INDEPENDENT of how the base is chosen
    (KN-FIND-007's conservation double count, applied to the +/- symmetric point
    set W = V union -V of size 2B). Hence the entire measured curve
    p_exist(B) that GOAL-RELN-001 is chartered to produce is pinned between two
    derived bounds and its only free content is the collision deficit
    D(B) = mu - coverage. This proposal derives the deficit's exact floor and
    uses it to bound the whole factor-base-design lane. At m = 2: exactly B of
    the C(2B+1,2) = 2B^2 + B multisets consist of a point and its negative and
    therefore sum to the identity, so at most 2B^2 + 1 distinct targets can be
    covered and
        coverage <= (2B^2 + 1)/N  =  mu * (2B^2+1)/(2B^2+B).
    Comparing that ceiling against a matched random base (Poisson coverage
    1 - e^{-mu}) gives a threshold that appears nowhere in this corpus:
    a low-collision base beats a random base only when
        N < (2B^2 + B)^2 / (2(B-1)),  i.e. essentially  B > (N/2)^{1/3}.
    BELOW that threshold the negation-forced waste exceeds the collision loss it
    is meant to remove, and the best conceivable factor base is strictly worse
    than a random one. Evaluated on this goal's own frozen ladder the maximum
    achievable gain over a matched random base is 0.968 to 1.525 -- it is BELOW 1
    at three of the sixteen m = 2 cells and above 1.3 at only three -- against a
    global ceiling of 1.582 attained only at mu = 1 (KN-FIND-007). The proposal
    therefore reframes the goal's deliverable: instead of a 256-trial-per-stratum
    probability campaign whose headline is forced, run a graded additive-energy
    census that measures D(B) directly against matched nulls, and deliver
    GOAL-ICEX-001 a derived interval plus a measured deficit. The ceiling is an
    INSTRUMENT, NOT AN ATTACK, and the record says why: the deficit-minimising
    base is built from known discrete logarithms, which collapses index calculus
    into single-relation search whose cost is bounded below by the AM-GM
    two-table argument this program already recorded.

  object_first_candidate:
    tracked_object: >-
      The multiplicity function c_W : E(F_p) -> Z_{>=0}, where c_W(g) is the
      number of size-m multisets from W = V union -V summing to g. Not its mean
      -- the mean is forced -- but its HISTOGRAM: how many targets have 0, 1, 2,
      ... decompositions. p_exist is the mass at c > 0; the deficit is the mass
      wasted at c >= 2; the identity target's count is a forced value that
      calibrates the instrument.
    established_families_off_limits: >-
      Off-limits as the primary lens: summation-polynomial degree engineering;
      Groebner / solving-degree instrumentation; Weil descent and extension-field
      Gaudry-Diem transfer; rho and BSGS baselining; new prime-field
      decomposition maps; and -- specifically -- the "which geometry gives higher
      yield" family that DEC-20260724-020 and DEC-20260804-2bfc30 already
      scoped, because KN-FIND-007 refutes mean-yield claims on sight and this
      proposal accepts that refutation rather than working around it. The lens
      used instead is second-moment / additive-energy bookkeeping on the
      multiplicity histogram.
    newness_score: >-
      The conservation half is established internally (KN-FIND-007). The
      coverage ceiling min(1, mu) is stated there. What is not there, and what
      this proposal supplies, is (i) the exact negation-forced floor on the
      deficit for a +/- symmetric base, which KN-FIND-007 does not treat because
      it works with a general abelian group and a base D, not with W = -W;
      (ii) the resulting threshold B > (N/2)^{1/3}; and (iii) the observation
      that this makes the sign of the geometry effect change with B, so a census
      at one B cannot decide the question -- which is exactly the defect the
      corpus already suspects in DEC-20260804-2bfc30 ("3 geometries, one scale,
      no growth clause, no Sidon arm").
    testability_score: >-
      High and cheap. Every forced value is exact-integer and checkable by
      enumeration in pure Python at p <= 2^12 in seconds; the graded ladder needs
      no solver, no Groebner, no numpy. Environment verified this session: numpy
      2.4.6 present, sympy absent, Sage absent.
    survival_score: >-
      The ceiling and the threshold survive with near-certainty because they are
      counting statements. What may not survive is their usefulness: if measured
      deficits sit at the random-base value for every geometry that can actually
      be constructed without discrete logarithms, the honest conclusion is that
      the deficit channel is inert in practice, and that is a real scoped result
      rather than a failure.

  mechanism: >-
    Conservation (imported, exact). Every size-m multiset from a set W sums to
    exactly one group element, so sum over g of c_W(g) = C(|W|+m-1, m). With
    W = V union -V of size 2B this gives mu(B,m) = C(2B+m-1, m)/N exactly, for
    every base of size B, on every curve of order N (KN-FIND-007, extended to the
    symmetric point set; see IDEA-20260805-5ac0a2 for the +/- lifting argument).
    Coverage <= min(1, mu) with equality iff no target is hit twice.

    The forced floor on the deficit. W = -W is not an accident of the encoding;
    it is what "up to signs" in the summation-polynomial decomposition means, and
    it forces collisions no design can remove.
      m = 2. Exactly B multisets are of the form {P_i, -P_i}; all sum to O. Those
        B multisets cover ONE target instead of B, so at least B - 1 multisets are
        structurally wasted. Distinct targets <= (2B^2 + B) - B + 1 = 2B^2 + 1.
        coverage <= (2B^2 + 1)/N, i.e. coverage/mu <= (2B^2+1)/(2B^2+B), which is
        1 - (B-1)/(2B^2+B) ~ 1 - 1/(2B).
      m = 3. Exactly 2B^2 multisets contain a +/- pair (choose the pair, B ways;
        choose the third element from W, 2B ways; no size-3 multiset contains two
        distinct pairs). Each such multiset sums to its third element, so those
        2B^2 multisets land on only 2B distinct targets. Distinct targets
        <= C(2B+2,3) - 2B^2 + 2B.
      General m. The multisets containing a +/- pair are in bijection with
        (pair, size-(m-2) multiset from W) and sum to the (m-2)-multiset's sum, so
        they re-cover the (m-2)-level image; the wasted fraction is
        ~ m(m-1)/(4B), which is why the effect is a toy-scale effect that decays
        as 1/B and must not be extrapolated.

    The threshold. Write mu = (2B^2+B)/N at m = 2. A matched random base has
    Poisson coverage 1 - e^{-mu} = mu - mu^2/2 + O(mu^3). The best possible base
    has coverage mu(1 - (B-1)/(2B^2+B)). The best base beats random iff
        mu (B-1)/(2B^2+B)  <  mu^2/2
      <=> 2N(B-1) < (2B^2+B)^2
      <=> B > roughly (N/2)^{1/3}.
    This is a THRESHOLD IN B, not a constant, and its consequence is that the
    sign of the geometry effect flips as B crosses (N/2)^{1/3}. Checked against
    the derived numbers below: at bits = 16 the threshold is B ~ 25.4 and the
    computed maximum gains are 0.968, 0.989 (below threshold, B = 12, 20) then
    1.017, 1.062 (above, B = 32, 48); at bits = 12 the threshold is B ~ 10.1 and
    the gains run 0.980, 1.067, 1.185, 1.414 for B = 8, 14, 20, 28. Agreement is
    exact at every one of the sixteen m = 2 ladder cells.

    What the deficit is governed by. The number of pairs (multiset, multiset)
    with equal sums is the additive energy of W. Writing E(W) for the number of
    quadruples (a,b,c,d) in W^4 with a + b = c + d, the second moment of c_W at
    m = 2 satisfies sum_g c_W(g)^2 = (E(W) + lower-order diagonal terms)/4, and
    coverage = mu - (excess mass at c >= 2). So the deficit IS the additive energy
    of the factor base viewed inside the group E(F_p), and factor-base geometry
    enters the decomposition probability through that one channel and no other.
    This is the constructive statement the proposal is for: it names exactly which
    property of a factor base can move P(decomp) at fixed size, and bounds how far.

    Why the optimum is an instrument and not an attack. Minimising E(W) means
    choosing V so that S = {dlog(P) : P in V} is a Sidon set -- and, because W is
    symmetric, a B_3 (Sidon-of-order-3) set, since sums of the form s_i + s_j must
    also avoid s_k - s_l, which is a three-term condition. Bose-Chowla B_3 sets
    are the standard construction and this program's red team already reached a
    coverage ratio of 1.1071 with one (DEC-20260724-020, relayed from the decision
    record, not independently re-derived here). But a B_3 base is built by
    exponentiating known integers, so its discrete logarithms are known by
    construction, and then a SINGLE decomposition of R = aP + bQ solves the ECDLP
    outright -- which makes the resulting algorithm a one-relation search whose
    cost obeys the AM-GM two-table bound |A| + |B| >= 2 sqrt(N) that this program
    recorded as R10. So the low-energy optimum is a measuring rod for how much
    room the deficit channel has, not a route to an attack, and this record says
    so in advance rather than discovering it in review.

  novelty_status: unverified

  literature_context:
    - >-
      KN-FIND-007 (internal finding, established, toy tier). READ. Supplies the
      conservation identity, the ceiling coverage <= min(1, mu), the 1.582 bound
      on one-relation-per-target gain, and the measured coverage ratios this
      proposal treats as prior measurements: 1.1071 for a Bose-Chowla B_3 base
      and 1.0269 for a whole-group low-collision greedy, against 0.0021 for the
      H017 small-multiples base at N ~ 2^18, m = 3, on 12 generated prime-order
      curves. Those numbers are quoted FROM THE CORPUS RECORD and were not
      re-measured here.
    - >-
      DEC-20260724-020. NOT READ in full -- relayed via the 2026-08-05 scouting
      brief, which records its scope as six geometries, m = 3, unsigned multisets,
      N in {2^14, 2^16, 2^18}, 12 curves, yield and coverage only, with relation
      rank and independence not measured, and which publishes as forbidden the
      sentences "the F3 factor-base family is dead" and "structured factor bases
      cannot help index calculus". This proposal does not write those sentences.
      Note the scope word "unsigned multisets": if that decision's census used V
      rather than W = +/-V, its coverage numbers and this proposal's ceiling are
      about different objects, and reconciling them is a stage of the paired
      experiment rather than an assumption of it.
    - >-
      DEC-20260804-2bfc30 ("small-x is already optimal"). NOT READ -- relayed via
      the same brief, which records three geometries at one scale with no growth
      clause and no Sidon arm. The threshold derived here is the reason a
      one-scale census cannot settle the question: the sign of the effect changes
      at B ~ (N/2)^{1/3}.
    - >-
      KN-TECH-003 (point-decomposition index calculus). READ. Records the standing
      position for prime fields: "no good structured factor base is known;
      decomposition probability and Groebner cost make it uncompetitive with rho".
      This proposal is consistent with that and quantifies one half of it.
    - >-
      KN-LIT-009 and KN-LIT-025. NOT READ -- relayed claims; both corpus entries
      state the paper was not read. No claim about either is made here.

  lossy_projection_identifiability_audit:
    projection: >-
      (curve, factor base V, arity m)  -->  the multiplicity histogram of c_W,
      i.e. the vector (#{g : c_W(g) = 0}, #{g : c_W(g) = 1}, #{g : c_W(g) = 2}, ...).
      p_exist is one coordinate of this projection; the deficit is another.
    what_is_discarded: >-
      Which target has which count, the identity of the curve, the labels of the
      factor-base elements, and every algebraic property of V except its additive
      structure. Any relabelling of V that preserves additive energy preserves the
      histogram.
    why_genuinely_lossy: >-
      The fibre is large: histograms are invariant under the whole automorphism
      group of the additive structure and under relabelling the group, so
      exponentially many distinct factor bases share a histogram.
    why_compatible_with_the_operations: >-
      The histogram propagates deterministically under the operation the target
      uses -- summing m factor-base points -- because the count function is
      defined by that operation. Adding an element to V transforms the histogram
      by a rule that depends only on the histogram and on the new element's
      correlations, which is what makes the graded ladder interpretable.
    is_it_only_a_change_of_coordinates: >-
      Checked for BOTH failures, and it is neither. It is not a change of
      coordinates: the histogram genuinely cannot be inverted to recover V, unlike
      the (Delta, Pi) = (x xor y, x*y) example where the pair is recovered as the
      roots of t^2 + Delta t + Pi. It is not the mirror failure either, and this is
      the point of separating it from IDEA-20260805-5ac0a2: the histogram's FIRST
      MOMENT is constant across instances at fixed (B, m, N) -- zero comparator
      spread, which is why the mean is a reference and not a signal -- but its
      HIGHER MOMENTS are not, and the corpus already contains a measured spread
      of three orders of magnitude in coverage ratio (0.0021 for small-multiples
      against ~1.0 for random and 1.1071 for Bose-Chowla B_3). A projection whose
      first moment is forced and whose second moment spans three decades is
      exactly the object the lossy-projection test is looking for. The check
      performed was: compute the within-stratum spread of each moment; moment 1
      returns identically zero, moment 2 returns a measured three-decade range in
      the corpus. Both answers are recorded.

  assumptions:
    - >-
      That the decomposition search ranges over W = V union -V rather than over V
      alone. This is the same convention IDEA-20260805-5ac0a2 audits; if the
      protocol's intended reading is unsigned, the negation-forced floor vanishes,
      the threshold vanishes with it, and only the conservation half survives.
      The paired experiment tests the convention before it uses it.
    - >-
      That p_exist is per-target coverage and not per-attempt yield. Under the
      harvest-all convention KN-FIND-007 shows the relevant quantity is the mean,
      which is exactly geometry-invariant, and the deficit channel closes
      entirely. Which convention the ICEX consumer needs is an open question the
      experiment must ask, not answer.
    - >-
      That E(F_p) is cyclic or near-cyclic so that "Sidon set in the group" is
      meaningful in the intended way. Toy curves with large non-cyclic parts are
      excluded by construction and the exclusion is recorded.

  proof_search_map_note: >-
    The paired hypothesis H-RELN-66c079 carries the filled proof_search_map.

  predictions:
    - metric: >-
        identity_multiset_count at m = 2 on a 2-torsion-free base of size B
      direction: different
      minimum_effect: >-
        EXACTLY B. Forced, integer-exact, and independently falsifiable.
    - metric: >-
        pair_containing_multiset_count at m = 3
      direction: different
      minimum_effect: >-
        EXACTLY 2B^2 multisets, landing on EXACTLY 2B distinct targets. Forced.
    - metric: >-
        coverage_ceiling_ratio: max attainable coverage divided by mu, at m = 2
      direction: lower
      minimum_effect: >-
        <= (2B^2 + 1)/(2B^2 + B), i.e. 0.9167, 0.9359, 0.9485, 0.9633 at
        B = 4, 6, 8, 12 and 0.9899 at B = 48. NO measured base may exceed its
        cell's value. A single exceedance falsifies the ceiling derivation.
    - metric: >-
        sign_of_max_gain: whether the best-possible base beats a matched random
        base, as a function of B at fixed N
      direction: different
      minimum_effect: >-
        NEGATIVE (gain < 1) for B < (N/2)^{1/3} and POSITIVE for B above it, with
        the crossover reproduced to within one ladder step. Derived values on this
        goal's own ladder, computed with N set to p as a placeholder: bits 8 --
        1.048, 1.242, 1.525, 1.113; bits 10 -- 1.008, 1.163, 1.394, 1.261;
        bits 12 -- 0.980, 1.067, 1.185, 1.414; bits 16 -- 0.968, 0.989, 1.017,
        1.062. Three cells below 1 is the falsifiable part: if a measured
        low-energy base beats random at bits 16, B = 12, the threshold is wrong.
    - metric: >-
        graded monotonicity: coverage/mu across the additive-energy ladder
        V_k = union of k arithmetic progressions of length B/k in the exponent,
        for k = 1, 2, 4, 8, B, plus a Bose-Chowla B_3 arm
      direction: higher
      minimum_effect: >-
        Strictly increasing in k, with at least 3 interior points separated by
        more than their Clopper-Pearson intervals, and the B_3 arm at or above
        k = B. Anchored by the corpus's own measured endpoints (0.0021 for
        small-multiples, 1.1071 for Bose-Chowla B_3, both from KN-FIND-007's
        record and both toy scale). A non-monotone ladder localises the
        obstruction to a specific k rather than leaving "it did not work".
    - metric: >-
        global_gain_bound: max over all B and all geometries of
        coverage_structured / coverage_random at matched B
      direction: lower
      minimum_effect: >-
        <= 1.582 (= max over mu of min(1,mu)/(1 - e^{-mu}), attained at mu = 1;
        recomputed here to 1.58198). Any measured ratio above 1.582 at matched B
        falsifies either the conservation identity or the measurement.

  minimal_test:
    design: >-
      Specified in EXP-RELN-0a979f. Four stages, cheapest first. STAGE 1 (zero
      compute): derive the m = 2 and m = 3 forced floors and the threshold, and
      commit the forced-value table before any enumeration. STAGE 2 (seconds):
      exact enumeration of c_W on toy curves for the random arm, checking the four
      integer-exact forced values. STAGE 3 (minutes): the graded additive-energy
      ladder with matched nulls. STAGE 4 (zero compute): reconcile against
      DEC-20260724-020's published coverage ratios and report agreement or
      disagreement without adjudicating it.
    controls:
      - >-
        NULL OBJECT (matched, forced value pre-derived, CAN FAIL): a base of the
        same size B drawn uniformly from on-curve x-coordinates. Forced values:
        identical mu to every other arm (exact, zero deviation), and
        coverage/mu within the binomial interval of (1 - e^{-mu})/mu. This null
        can fail in two ways -- a different mu means the enumerator is wrong; a
        coverage far from Poisson on a uniform base means the toy curve is not
        behaving like a random group and the whole census is confounded.
      - >-
        POSITIVE CONTROL (the effect MUST appear): the small-multiples base
        V = {x(iG) : i = 1..B}. KN-FIND-007 records a coverage ratio of 0.0021 for
        this family at N ~ 2^18, m = 3. The instrument must reproduce a collapse of
        at least one order of magnitude at the corresponding toy cell. If it does
        not, the instrument cannot see additive energy and NO NEGATIVE RESULT MAY
        BE REPORTED from any arm of this experiment.
      - >-
        GRADED CONTROL (5 interior points, monotonicity reported): the k-ladder
        above, k = 1, 2, 4, 8, B, interpolating from maximum to minimum additive
        energy at fixed B, m, N. Report the monotonicity verdict and the k at
        which the deficit reaches the random-base value.
      - >-
        NEARBY OBJECT WHERE THE CONCLUSION FAILS: the same census on Z/N with the
        same exponent sets, i.e. the group with the curve removed. Every forced
        value must be identical, because none of them uses the curve. If the
        curve arm and the Z/N arm differ on any forced value, the difference is
        an artifact of the point arithmetic and must be found before anything else
        is read. This also isolates whether any measured deficit is a property of
        the exponent set or of the curve.
      - >-
        ORDERING CONTROL: the forced-value table is written to the run directory
        and hashed before the enumerator runs; the null arm's verdict is read and
        recorded before the structured arms are looked at.
    required_metrics:
      - per-arm exact multiset total against C(2B+m-1, m)
      - per-arm identity count at m = 2 against the forced B
      - per-arm coverage, coverage/mu, and its Clopper-Pearson interval
      - the measured k-ladder with its monotonicity verdict
      - the measured crossover B against the derived (N/2)^{1/3}
      - agreement or disagreement with DEC-20260724-020's published ratios, unadjudicated

  falsification_conditions:
    - >-
      Any arm exceeding its derived coverage ceiling (2B^2+1)/N at m = 2. The
      ceiling derivation is then wrong and the proposal is withdrawn.
    - >-
      A measured low-energy base beating a matched random base at a cell with
      B < (N/2)^{1/3}. The threshold is then wrong.
    - >-
      A measured structured/random coverage ratio above 1.582 at matched B. Either
      conservation or the measurement is broken; nothing may be reported until it
      is found.
    - >-
      The small-multiples positive control failing to collapse. Instrument
      insensitive; no negative result from any arm.
    - >-
      The Z/N nearby-object arm disagreeing with the curve arm on any forced
      value.

  confounders:
    - >-
      CONVENTION. Signed (W = +/-V) versus unsigned (V) multisets changes every
      forced value. DEC-20260724-020's scope line says "unsigned multisets", so a
      naive comparison of ratios across the two conventions is invalid. The
      experiment reports both conventions rather than choosing one.
    - >-
      SMALL-N GRANULARITY. At bits = 8 the group has ~250 elements and coverage is
      a ratio of small integers; Clopper-Pearson intervals are wide and the
      threshold prediction is only one ladder step away from the smallest B. The
      threshold claim must be tested at bits >= 12 where the crossover sits inside
      the ladder.
    - >-
      2-TORSION AND SMALL SUBGROUPS. A base containing a 2-torsion x-coordinate
      breaks |W| = 2B; a curve with a small cofactor makes some targets
      unreachable. Both are excluded by construction and the exclusion is checked,
      not assumed.
    - >-
      HARVEST CONVENTION. Under harvest-all solving the relevant quantity is the
      mean, which is exactly geometry-invariant, so the entire deficit channel is
      worth nothing; under one-relation-per-target it is worth at most 1.582. Which
      one GOAL-ICEX-001 consumes is not settled and the experiment must report the
      number under both.
    - >-
      SELECTION. Reporting only the arms that separate would manufacture a
      monotone ladder. All five k values plus both endpoints are pre-registered
      and all are reported.

  interpretation_limits:
    - >-
      Toy scale, and the effect itself decays like m(m-1)/(4B), so the negation
      floor is a SMALL-B phenomenon by construction. Extrapolating the threshold
      B > (N/2)^{1/3} to cryptographic N is arithmetic, but claiming anything about
      cryptographic decomposition probability from it is not permitted; the
      protocol's prohibited_claims list is inherited verbatim.
    - >-
      A confirmed ceiling does NOT say structured factor bases cannot help index
      calculus, and that sentence is on DEC-20260724-020's forbidden list. It says
      the coverage channel at fixed B and fixed m is bounded by a computable
      number. Relation rank and independence -- which DEC-20260724-020 explicitly
      did not measure -- remain entirely open and are named here as the successor.
    - >-
      The low-energy optimum is not an attack, for the reason given in the
      mechanism (known discrete logarithms; the AM-GM two-table bound). Any writeup
      that presents it as one is wrong.

  heuristic_assumptions:
    - id: HEUR-RELN-B1
      formal_statement: >-
        The conservation identity, the m = 2 identity count B, the m = 3 pair count
        2B^2, and the coverage ceilings derived from them are UNCONDITIONAL
        counting statements with no heuristic content.
      random_model_justification: not applicable
      supporting_results:
        - "KN-FIND-007 (internal, established): sum_r c_D(r) = C(B+m-1,m); coverage <= min(1, mu)."
      validation_experiment_ids: [EXP-RELN-0a979f]
      falsification_condition: An enumerated count differing from its forced integer value.
    - id: HEUR-RELN-B2
      formal_statement: >-
        For a uniformly drawn factor base on a toy curve of order N, the
        multiplicity function c_W behaves like a balls-in-bins allocation of
        C(2B+m-1,m) balls into N bins, so coverage = 1 - e^{-mu} + o(1).
      random_model_justification: >-
        The standard heuristic for a sum-set with no additive structure. It is
        stated here because the threshold derivation compares the exact ceiling
        against it, so the threshold inherits its validity. Its failure mode is
        known and directional: additive structure only DECREASES coverage, so the
        threshold as derived is conservative in the direction that matters.
      supporting_results:
        - "KN-FIND-007 consequence 3 (exact ceiling, no heuristic) bounds this from above."
      validation_experiment_ids: [EXP-RELN-0a979f]
      falsification_condition: >-
        Measured coverage on the uniform arm outside the Clopper-Pearson interval
        of 1 - e^{-mu} at three or more cells.
    - id: HEUR-RELN-B3
      formal_statement: >-
        A Bose-Chowla B_3 exponent set attains, up to the forced floor, the minimum
        additive energy available at size B.
      random_model_justification: >-
        B_3 sets have all three-term sums distinct by definition, which is the
        condition the symmetric point set imposes; the claim that Bose-Chowla
        attains the extremal size is standard additive combinatorics and is
        RECALLED, UNVERIFIED -- no source has been read for it in this session and
        checking it is a stage of the experiment.
      supporting_results:
        - "RELAYED: DEC-20260724-020's red team reported coverage ratio 1.1071 with a Bose-Chowla B_3 base. Not independently reproduced here."
      validation_experiment_ids: [EXP-RELN-0a979f]
      falsification_condition: >-
        A constructed base with lower measured additive energy than the B_3 arm at
        the same B.

  target_complexity:
    time_exponent: >-
      This proposal MOVES NO EXPONENT and says so plainly. It bounds a constant:
      the factor-base-geometry channel in prime-field point decomposition is worth
      at most 1.582x in coverage at matched size, and less than 1x below
      B ~ (N/2)^{1/3}. It is worth running because that constant is currently
      unbounded in this program's records, because GOAL-ICEX-001 is blocked on a
      relation-supply pin that this bounds, and because bounding it converts an
      open design lane into a closed-in-scope one with a named successor (relation
      rank and independence, which no record has measured).
    memory_exponent: >-
      n/a for the census. For the low-energy optimum viewed as an algorithm, the
      relevant bound is the AM-GM two-table statement |A| + |B| >= 2 sqrt(N)
      recorded as R10, i.e. it does not beat rho on any (time, memory) corner.
    best_known: >-
      KN-TECH-003: over prime fields, point-decomposition index calculus is
      uncompetitive with rho at O(sqrt(N)) time and negligible memory. Unchanged.
    hidden_overhead: >-
      The 1.582 bound is a coverage bound, not a cost bound; the cost of finding
      each decomposition is separate and is the subject of IDEA-20260805-96cb3d.
    tradeoff_note: >-
      Charged on all three axes as required: time (no change), memory (no change;
      the base is B points either way), data/queries (no change; both arms sample
      the same number of targets).

  dominated_by: >-
    Pareto rows actually checked before writing this field, on the question "is
    there a better bound on what factor-base design can buy for prime-field point
    decomposition": (TIME) rho at O(sqrt(N)) with negligible memory -- dominates
    the low-energy base viewed as an algorithm, by R10's AM-GM argument, and the
    record says so; (MEMORY) BSGS at sqrt(N) time and sqrt(N) memory -- also
    dominates it; (DATA/QUERIES) neither arm consumes oracle queries, so no row
    exists. On the CENSUS itself no frontier applies because no algorithm is
    proposed. Internal rows checked for a prior bound of this kind: KN-FIND-007
    (gives min(1,mu) and 1.582 but not the negation floor or the threshold),
    KN-TECH-003, DEC-20260724-020 and DEC-20260804-2bfc30 as relayed by the
    scouting brief, EV-RELN-001, and the frozen RELN protocol. None states a
    threshold in B. Absence of a search result is not evidence that none exists.
  sota_delta: >-
    Quantitative. Converts an unbounded design question into the interval
    [0.968, 1.525] of achievable coverage gain over a matched random base at this
    goal's own sixteen m = 2 ladder cells, against a global ceiling of 1.58198,
    and supplies a crossover B ~ (N/2)^{1/3} below which the achievable gain is
    strictly less than 1. Reduces the campaign the goal has queued: the mean is
    forced, so 256 trials per stratum measure a quantity known in advance, and the
    same budget spent on the deficit measures the only free coordinate.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.80 that the ceiling and the threshold survive exactly as derived. Not higher
    because both depend on the signed convention (see the assumptions; if the
    decomposition search is unsigned the negation floor is void), and because the
    Poisson comparator is a heuristic even though the ceiling is not. Not lower
    because the counts are integer-exact, because the m = 2 identity count B and
    the m = 3 pair count 2B^2 give two independent falsifiable checks, because the
    derived crossover reproduces the sign of the computed gain at all sixteen
    m = 2 ladder cells with no fitted parameter, and because the conservation half
    is already established internally. Separately, 0.35 that the graded census
    finds any constructible-without-discrete-logarithms geometry that beats a
    random base at a cell above the threshold -- low, because the only known
    minimiser needs the discrete logarithms, and that number is the honest reason
    the proposal is framed as a bound rather than as a search.
