  assumptions: []
  predictions:
    - metric: kappa_2 of D_sq vs full-group null, cofactor-2 curves, bits 16-20
      direction: higher
      minimum_effect: >-
        2.00 in [1.90, 2.10] at abs(z) > 4
    - metric: kappa_2 of D_sq vs 2E-restricted null
      direction: different
      minimum_effect: within 0.05 of 1
    - metric: Delta - 1 of qr_class at m = 3 on y^2 = x^3 + a x^2 + b x
      direction: higher
      minimum_effect: mu within 3 null sd
  minimal_test:
    design: >-
      Stage 0 (exhaustive, p about 2^10..2^12): verify P in 2E iff x(P) - e is
      a square for P outside {O, T}; derive the 4E criterion. Stage 1: ca5e01
      paircount kernel (read-only reuse), 3 cofactor-2 and 3 prime-order curves
      per bits in {16, 18, 20}: D_sq, window, qr_class; nulls on the full group
      and on 2E. Stage 2: RELN enumerator at m = 3 (IDEA-20261018-5fa71b identity).
    controls:
      - prime-order curve at the same bits (d = 1 by theorem); 2E-restricted null
      - Z/2r relabelled group with its index-2 subgroup (planted coset must give 2)
    required_metrics: [kappa vs both nulls, Delta, mu, descent violations]
  falsification_conditions:
    - Stage 0 finds a point violating the 2-descent criterion: recalled map misapplied.
    - D_sq kappa_2 outside [1.9, 2.1] vs the full-group null, replicated: mixture law wrong.
    - kappa vs the 2E-restricted null outside [0.95, 1.05], replicated: structure beyond blocks.
  confounders:
    - D_sq halves the window density (span reported); E[2] of order 4 gives d = 4.
  interpretation_limits:
    - Toy scale; mixture law and descent map exact, bands at tested rungs; kappa = d cancels on G.
  heuristic_assumptions:
    - id: H1
      statement: Within the reachable class a confined base has Poisson(d mu) counts, up to O(1/N).
      rigorous_support: conservation (KN-FIND-007) plus the homomorphism; binary case H-SEMBIN-83a856.
      validation_plan: variance-to-mean inside the class at three mu values and three curves.
    - id: H2
      statement: On ordinary E/F_p with E[2](F_p) = Z/2 the square class of x(P) - e is the E/2E class.
      rigorous_support: 2-descent homomorphism (Silverman X.1, recalled); exact once verified.
      validation_plan: exhaustive check at p <= 2^12 on 20 curves; zero violations required.
  target_complexity:
    time_exponent: none; kappa = d <= cofactor is a constant and reads 1 vs a null on G
    memory_exponent: unchanged
    best_known: rho N^(1/2); table family N^(h/(2h-1)); bbc53e needs kappa > 1.27 c U
    hidden_overhead: none; d is computed from the group order
