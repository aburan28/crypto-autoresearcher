idea:
  id: IDEA-20261018-9fc21f
  question_id: RQ-PFDR-ae2fba
  added: '2026-10-18'
  status: proposed
  approved_by: null
  proposed_by: idea-synthesist
  title: >-
    The block-system dichotomy: trace-parity confinement is kappa = d(V) at most
    the cofactor, has a prime-field twin by 2-descent, and is empty on prime order
  class: mechanism
  claim: >-
    BRIDGE of H-SEMBIN-83a856 (supported), IDEA-20261017-3db2a8, EXP-PFDR-ca5e01,
    EV-RELN-335cd2, IDEA-20260901-863e36. (A) pi: E(F_q) -> E/H a homomorphism
    of index d, H containing the prime-order subgroup G. If the h-sums of a
    base fall in one class, the count vector is a d-point mixture (zero on d-1
    classes, Poisson(d mu) on one): Delta = 1 + (d-1) mu, kappa_h = d exactly.
    This is 3db2a8's d(V) and the parity deficit of H-SEMBIN-83a856 read as the
    PFDR kappa: the one confirmed excess is the cofactor quotient, trivial on G.
    (B) On prime-order E/F_p, d = 1 for every base (no block system under
    translation on a prime-order group; Theorem C, KN-FIND-ffe1df), so ca5e01
    reads O-NULL at block level; a surviving flag could only be
    coordinate-dependent (077f12 H1). (C) F_p twin: on y^2 = (x - e)(x^2 + ax +
    b), quadratic irreducible, P in 2E iff x(P) - e is a square (2-descent,
    recalled), so D_sq = {P : x(P) - e a nonzero square, x in a window} is a
    factor base with no known log and kappa_2 = 2: a plant that is a factor
    base. For e = 0 it is RELN's qr_class base: Delta = 1 + mu on cofactor 2.
  mechanism: >-
    PAIR (R1 x-labels; Sigma = translation by base elements with the quotient
    homomorphism pi), Class I partial-action. pi keeps log2(d) bits and is
    Sigma-compatible since it is a homomorphism; cosets of H are the block
    system of the operation group (863e36). D_sq is scoped out by KN-OPEN-020.
  novelty_status: unverified
