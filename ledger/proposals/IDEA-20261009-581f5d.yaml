  heuristic_assumptions:
  - id: H1
    statement: |-
      The coefficient system for a bounded-height section through a prescribed fibre point is overdetermined with ~1 solution and its Groebner degree of regularity equals that of a random dense system of the same variable count and degrees; the MW-lattice structure of the union of solution sets gives no per-instance gain.
    rigorous_support: |-
      Semi-regular degree-of-regularity bounds (KN-LIT-029) for random systems; no theorem for structured systems, which is the gap under test.
    validation_plan: |-
      >= 5 p-sizes per (chi, solver) in 2^12..2^28; planted sections; d_reg and first-fall degree per Groebner run, structured vs random; oracle baseline with known generators; rho at every p; abort a solver line at median > 12 h.
  - id: H2
    statement: |-
      The Gaussian-heuristic degree d from SNFS-E4 is the right instance size: sections of height <= H(p, r) suffice to cover E(F_p).
    rigorous_support: |-
      Lattice point counting (Gaussian heuristic, recalled); measured on E1 lattices by SNFS-E4.
    validation_plan: |-
      Use SNFS-E4's measured N(H) fit; if E4 shows a 2x departure, re-derive d before running E3 cells.
  target_complexity:
    time_exponent: |-
      target under test: hypothesis predicts T_section > p^{1/2} poly(log p); the alive condition is T <= p^0.45 at matched d, which would be a constant-level toy observation until shown across >= 3 sizes, not an asymptotic claim
    memory_exponent: Macaulay matrix at d_reg on ~1.5 d unknowns, recorded as peak memory per cell
    best_known: Pollard rho, Theta(p^{1/2}) group operations (KR-RHO-13bf67)
    hidden_overhead: |-
      the number of unknowns ~1.5 d grows with p^{2/r}; at r <= 100 and 256 bits d is in the hundreds (SNFS-E4), which no toy run reaches
    tradeoff_note: |-
      hybrid guess-k-leading-coefficients trades 2^{k log p} enumeration for a smaller Groebner system; both sides are counted
