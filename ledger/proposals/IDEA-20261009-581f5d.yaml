  title: |-
    Bounded-height section through a prescribed fibre point - the decomposition step of a function-field index calculus
  class: algorithm
  claim: |-
    T_section(d, chi, p) at the Gaussian-heuristic d from E4 exceeds p^(1/2) poly(log p) for every solver, and the Groebner degree of regularity matches a random system of the same shape (no structural gain). Alive if any solver shows T <= p^0.45 at matched d across >= 3 p, or d_reg systematically below the random-system value.
  mechanism: |-
    Given S/F_p(t) with fibre E at t_0, the whole ECDLP reduces to r + 1 instances of one problem - find a section sigma = (x(t), y(t)) of height <= H (degree <= d) with sigma(t_0) = R for the target, or sigma(t_0) = O for each relation. As a polynomial system in the about 1.5 d coefficients it is overdetermined with about one solution by design, and the union of solution sets over all R is the MW lattice, structure a generic system lacks. Nobody has analyzed its complexity.
  novelty_status: unverified
