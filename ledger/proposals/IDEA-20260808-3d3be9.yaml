idea:
  id: IDEA-20260808-3d3be9
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-MCE-e65b3c
  goal_id: GOAL-MCE-001
  title: The published Goppa distinguishers are POLYNOMIAL TIME, so stop computing their thresholds
    and run them - evaluate the square-code dimension defect directly on real standardized
    public keys, with matched random and alternant nulls, and report a measured distance instead
    of a transcribed one
  class: measurement
  claim: 'GOAL-MCE-001 completion criterion 1 asks for the distance between the attack regime
    and Classic McEliece''s actual parameters, stated quantitatively, and the goal''s own
    hazards record that the relevant distinguisher entries (KN-LIT-13a01d, 71d1a0, 7ee1a9,
    4c8135) are all UNREAD, so any threshold arithmetic is only as good as a transcription
    this program has not made. CLAIM: that dependency is avoidable for the square-code family,
    because those distinguishers are polynomial-time statistics computable FROM THE PUBLIC
    KEY ALONE. Concretely, for the public parity-check code C-perp of dimension n - k = m
    t, the Schur square (C-perp)^{*2} has a dimension that can be computed by incremental
    Gaussian elimination over F_2 at n = 4608 to 8192 on ordinary hardware, and the defect
    against the generic value min(n, C(m t + 1, 2)) is the distinguishing statistic. SECOND
    CLAIM, A CRITERION THAT SHOULD BE APPLIED TO EVERY ENTRY IN THAT CLUSTER: a statistic
    that requires knowing the support L or the Goppa polynomial g is NOT a distinguisher,
    however informative; only public-key-computable statistics qualify. THIRD CLAIM, THE PREDICTED
    ANSWER: the defect is zero at every standardized set and the measured distinguishing advantage
    is exactly zero, making the "distance" a measured fact rather than an inferred one.'
  mechanism: 'The square-code distinguisher family detects that structured codes have anomalously
    small Schur squares relative to random codes of the same dimension. The computation is:
    take a basis of the dual code, form pairwise componentwise products, and maintain a reduced
    basis of their span with early termination once the span saturates at dimension n. At
    m t = 1248 to 1664 the number of products is about 10^6, each an n-bit vector, and the
    reduced basis never exceeds n vectors - so peak storage is a few megabytes and the work
    is bounded by (number of products) times (basis size) word-XORs, with saturation expected
    to terminate the loop far earlier. Nothing about this requires the secret. The matched
    nulls come free: the same computation on a uniformly random [n, k] code gives the generic
    value, and on a constructed alternant code of degree 2t at the same (n, m) gives the structured
    value, so the measurement is bracketed by two objects whose answers are known in advance.'
  why_not_a_renamed_known_approach: C1-11 in C1c.yaml proposes a NEW ALGORITHM (substituting
    the Schur defect for the hull inside Sendrier's per-coordinate signature) and computes
    a threshold distance at TOY scale from transcribed formulas. This proposes no algorithm,
    transcribes no threshold, and runs at DEPLOYED parameters on real keys - a different class,
    a different scale, and a different deliverable. It is also not H-MCE-31d438, whose delta(C,
    r) = dim C - (n - m r) is computed on a code given by a known (L, g) presentation and
    is a statement about the alternant REPRESENTATION; the square-code defect is computed
    from the public key with no presentation known, which is exactly the second claim's criterion.
    The two are complementary and 31d438's matched-null design is the model this record copies.
  predictions:
  - observable: dim (C-perp)^{*2} for real public keys at each ISO-scoped set.
    metric: Dimension, exact integer, and defect against min(n, C(m t + 1, 2)).
    predicted: Saturation at n, defect exactly zero, at every ISO-scoped set. A nonzero defect
      at any set is immediately security-relevant, must not be reported from this record,
      and must be routed to independent review under AGENTS.md rule 12.
  - observable: The same statistic on a uniformly random [n, k] code (null 1).
    metric: Defect.
    predicted: Zero. A nonzero value here means the generic bound is mis-implemented, which
      is the single most likely bug.
  - observable: The same statistic on a constructed high-rate alternant code where the distinguisher
      is expected to fire (null 2, positive control).
    metric: Defect.
    predicted: Strictly positive. If it is zero, the instrument cannot detect the effect it
      exists to detect and NO negative conclusion may be drawn about Classic McEliece - this
      is the control whose absence has defeated four previous arms in the sibling HQC campaign.
  - observable: Saturation profile - how many products are needed before the span reaches
      n.
    metric: Product count at saturation, per object.
    predicted: Far fewer than the full 10^6 for random codes; a structured code should saturate
      later or not at all. The profile is a finer statistic than the final dimension and may
      separate objects that the final dimension does not.
  minimal_test: Generate real public keys with a reference Classic McEliece implementation
    at each ISO-scoped set (or obtain KAT public keys), compute dim (C-perp)^{*2} with early
    termination, and run the identical computation on both nulls at matched (n, k). Report
    the four defects and the saturation profiles. Budget order 10^3 core-seconds; the dominant
    cost is bitsliced XOR reduction and the early termination is expected to dominate the
    saving.
  controls:
  - POSITIVE CONTROL FIRST. Run null 2 (the high-rate alternant code where the defect must
    be nonzero) BEFORE the real keys, and do not run the real keys until it fires. A negative
    result from an instrument never shown to produce a positive is a fatigue report, not evidence.
  - GENERIC-BOUND CONTROL. Verify the generic value min(n, C(m t + 1, 2)) against null 1 at
    several (n, k) before interpreting any defect.
  - CONVENTION CONTROL. Fix and state whether C * C is taken to contain C (over F_2 every
    x satisfies x * x = x, so the convention changes the bound); report both conventions rather
    than silently choosing one.
  - KEY-INDEPENDENCE CONTROL. Repeat on at least 10 independently generated keys per set;
    a defect that appears on one key and not others is a weak-key observation and a completely
    different claim from a family-wide one.
  confounders:
  - 'The generic bound saturates at n whenever C(m t + 1, 2) exceeds n, which it does by a
    wide margin at these parameters - so the statistic may be saturated for BOTH structured
    and random codes, in which case it has no resolving power and the honest answer is that
    this particular statistic cannot see anything here. That is a real possibility and would
    itself be the finding: it would explain why the distinguisher line is stated for high-rate
    codes and would locate the obstruction precisely.'
  - Which code to square (the public code, its dual, a shortening of either) matters and the
    published statements differ; report all four variants rather than picking one.
  - Classic McEliece's public key is a systematic matrix with the identity block omitted;
    reconstructing the full parity-check matrix must be done exactly per specification or
    the code being squared is not the public code.
  - The 6960119 set has n not a multiple of 8 and a documented last-byte convention; a mis-parsed
    key silently becomes a different code.
  falsification_conditions:
  - The positive control does not fire, so the instrument is blind and no conclusion may be
    drawn in either direction.
  - The statistic is saturated for every object including the positive control, so it has
    no resolving power at these dimensions - the honest negative, and it correctly redirects
    effort to shortened codes or to a different statistic.
  - A nonzero defect appears on real keys, which falsifies the predicted answer and triggers
    independent review rather than publication from this record.
  - The defect varies across keys within a set, indicating a weak-key structure and a different
    claim entirely.
  interpretation_limits: 'RQ-MCE-e65b3c''s TOY claim-tier ceiling is binding and this record
    does not relax it: a measured zero defect is a statement about ONE statistic on ONE family
    of keys, not a statement that Classic McEliece is secure, and it says nothing about the
    syzygy distinguisher, the degree-2 alternant line, or KN-LIT-7c4620''s unread attack.
    RQ-MCE-e65b3c''s "distinguisher is not break" constraint applies in both directions -
    this record neither promotes a distinguisher to a break nor promotes its absence to a
    security claim.'
  assumptions:
  - The square-code statistic as described is one of the published distinguisher family's
    statistics. The corpus entries are UNREAD; the statistic computed here is well defined
    regardless, and its relation to any published distinguisher must be established by transcription
    before the result is described as evaluating that distinguisher.
  - A reference implementation or KAT public keys can be obtained under the network policy;
    if not, the blocked route is recorded and is never negative mathematical evidence (AGENTS.md
    rule 5).
  heuristic_assumptions:
  - id: HA-1
    statement: For a uniformly random [n, k] binary code, dim (C-perp)^{*2} equals min(n,
      C(n - k + 1, 2)) with probability 1 - o(1).
    rigorous_ingredient: The dimension is bounded above by both quantities unconditionally;
      only attainment is assumed, and attainment is directly measurable on null 1 at the exact
      dimensions in question.
    distribution_imitated: The generic-behaviour statement for Schur squares of random codes,
      which is the same genericity assumption the whole distinguisher line rests on.
    validation_route: Measured directly on null 1 at the deployed (n, k), 10 independent codes
      per set - crypto-scale for this statistic, because the computation does not get harder
      with the security level in any way that matters here.
    tail_checks: Report the minimum observed dimension over the 10 random codes per set; a
      single low outlier would mean attainment is not overwhelming and the null is not sharp.
  target_complexity:
    time_exponent: The measurement is polynomial - about (m t)^2 / 2 products each reduced
      against at most n pivots, with early termination. No attack exponent is claimed, and
      the entire point is that a polynomial-time statistic needs no exponent analysis, only
      execution.
    memory_exponent: A few megabytes (n vectors of n bits plus a product buffer), which is
      why the measurement is feasible at deployed parameters on ordinary hardware.
    best_known_baseline: Currently this program has NO measured distinguisher statistic at
      Classic McEliece's parameters, only unread corpus entries. The external baseline is
      the published distinguisher analyses, which certainly state where their thresholds lie
      - and which this program has not read.
    hidden_overhead_disclosure: None in the computation. The hidden dependency is transcriptional
      - whether the statistic computed is the statistic the published distinguishers use -
      and it is named as assumption 1 rather than buried.
    time_memory_tradeoff: Not applicable; the computation is small in both. This is worth
      stating because it is the reason the measurement is available at all, in a goal where
      almost nothing else is.
  sota_delta: Replaces a transcribed distance (as good as an unread source) with a measured
    one (an artifact any reviewer can regenerate), at deployed parameters, for under 10^3
    core-seconds. It beats no attack and claims none; the delta is that GOAL-MCE-001's criterion
    1 gains a number that does not depend on the 137 unread entries the goal's own known_hazards
    flags.
  dominated_by: 'Almost certainly dominated by the published distinguisher papers'' own parameter
    analyses, and quite possibly by the Classic McEliece design rationale, both of which will
    state that these parameters are outside the distinguishable regime - RECALLED FROM MEMORY,
    UNVERIFIED, and none of those documents has been read by this program. What is not dominated
    is an independently regenerable measurement with matched nulls on real keys, which no
    transcription can supply. Inside the corpus: C1-11 in C1c.yaml overlaps in subject and
    not in method or scale; H-MCE-31d438 dominates the alternant -representation dimension
    question and is complementary here. Not a null.'
  estimated_cost: Implementation MEDIUM (key parsing per specification including the 6960119
    last-byte convention, bitsliced F_2 elimination, three control objects). Compute LOW-MEDIUM,
    order 10^3 core-seconds. Blocked on obtaining a reference implementation or KAT keys.
  recommended_priority: high
  honest_prior_of_survival: About 0.85 that the measurement runs and the nulls behave; about
    0.45 that the statistic has any resolving power at these dimensions rather than being
    saturated for everything; about 0.02 that a nonzero defect appears on real keys. The 0.45
    is the real risk and the confounder section names it as a finding rather than a failure.
  novelty_status: unverified
  novelty_screen: Screened against IDEA-20260805-554b9d, 9704d9, f58517, IDEA-20260807-c3267e,
