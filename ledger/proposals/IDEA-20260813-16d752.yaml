    - explanation: The systems are equivalent only on a dense open set.
      discriminator: All failures lie on the explicit projection rank-loss or denominator locus.
    - explanation: Shared planted roots alone create the apparent match.
      discriminator: Fibre multiplicities or canonical certificates disagree even when root cardinalities agree.
