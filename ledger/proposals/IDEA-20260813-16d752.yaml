idea:
  id: IDEA-20260813-16d752
  added: '2026-08-13'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-UOV-001
  goal_id: GOAL-UOV-001
  title: Same-instance incidence correspondence with recovery-certificate round trips
  class: representation
  claim: >-
    For a fixed toy plain-UOV public map and a fixed planted oil space, there is a
    parameter-explicit incidence variety whose three projections recover the
    intersection, Kipnis-Shamir, and reconciliation systems on dense open sets;
    the proposal is falsified if even one generic certified solution in the
    preregistered toy slice has no certificate-preserving lift and round trip.
  mechanism: >-
    Retain the latent oil-space basis, public-map equations, and auxiliary
    reconciliation variables in one incidence object instead of comparing three
    separately generated polynomial systems. Elimination and projection then
    provide candidate rational maps between formulations. A valid map must carry
    both a solution and a verifier-checkable oil-space recovery certificate, so a
    shared root count alone cannot masquerade as semantic equivalence.
  why_not_a_renamed_known_approach: >-
    IDEA-20260801-014 and IDEA-20260805-69af7c calibrate or charge attack costs;
    IDEA-20260805-ca92fd derives an intersection system with a planted-solution
    null. This proposal instead asks for explicit same-instance maps and
    certificate round trips among three attack formulations. The semantic-query
    receipt also surfaced QRUOV and MAYO ideas, creating sibling-lane collision
    risk, but those descendants are outside this plain-UOV task and are not used
    as evidence of novelty.
  predictions:
    - observable: Generic-fibre certificate round-trip rate across all six directed formulation pairs
      metric: Fraction of certified source solutions that lift, project, and verify as the identical oil space
      predicted: Exactly 1 on the preregistered dense-open toy slice if the correspondence exists; any nonzero generic failure falsifies the stated claim
    - observable: Exceptional-locus equations
      metric: Codimension and defining minors of projection/Jacobian rank-loss loci
      predicted: Failures, if confined to a proper locus, are explained by explicit nonvanishing conditions rather than silently discarded
    - observable: Fibre multiplicity under each projection
      metric: Scheme-theoretic length after specialization, with reduced-root count reported separately
      predicted: Multiplicity changes agree with the stated projection degree; equal set cardinality without multiplicity agreement does not support equivalence
  minimal_test:
    parameter_slice: >-
      Preregister two tiny field/parameter strata that permit exhaustive solution
      enumeration, including one regular planted instance and one singular or
      rank-deficient nearby instance generated from the same public-map interface.
    procedure:
      - Construct the common incidence equations directly from one fixed instance, without regenerating any formulation independently.
      - Eliminate auxiliary blocks to reproduce each of the three baseline systems exactly up to declared invertible coordinate changes.
      - Enumerate source solutions, apply every candidate lift and projection, and run the same recovery-certificate verifier after each round trip.
      - Compute projection fibres and rank-loss minors; label every discarded point by a preregistered denominator or nonvanishing condition.
    discriminating_outcomes:
      - Full certificate round trips with the predicted fibre degrees support a genuine semantic correspondence rather than merely shared attack costs.
      - Equal root counts but failed certificate identity support accidental enumerative agreement rather than semantic equivalence.
      - Failures only on explicit rank-loss loci support a dense-open statement rather than a universal one.
  controls:
    - Exact null: independently permute the public quadratic forms in one target formulation while preserving dimensions and equation counts; the lift-to-identical-certificate rate must collapse.
    - Planted positive: derive two copies of the intersection system from the same instance under a sampled invertible oil-basis change with a known inverse; every certificate must round trip.
    - Nearby counterobject: a uniformly sampled public quadratic map with the same dimensions and an artificially planted linear subspace, tested through the identical construction.
    - Reconciliation control: compare an independently generated reconciliation system only to demonstrate that same dimensions and root counts do not establish same-instance provenance.
  confounders:
    - Saturation or denominator choices can delete valid exceptional solutions.
    - Set-valued enumeration can conceal nonreduced fibres and multiplicities.
    - Basis canonicalization may make distinct certificates look equal or equal certificates look distinct.
    - Toy fields may place most samples on exceptional loci that vanish asymptotically.
  falsification_conditions:
    - A regular planted source certificate has no verifier-accepted lift into any one of the other formulations.
    - Elimination fails to reproduce a baseline system under the declared coordinate changes.
    - Round trips return a different oil space after canonicalization on the dense-open slice.
    - Claimed exceptional exclusions cannot be expressed as explicit algebraic nonvanishing conditions.
  interpretation_limits:
    - A successful toy correspondence does not establish a lower attack exponent or Round-3 concrete security.
    - Dense-open equivalence does not cover singular compressed-key instances without a separate distribution argument.
    - Enumeration at toy scale does not validate the distribution of exceptional loci at deployed parameters.
    - This proposal concerns plain UOV only and does not launch MAYO, QRUOV, or SNOVA work.
  assumptions:
    - The authoritative Round-3 UOV specification and primary attack definitions must be checked before any experiment approval.
    - All three systems can be instantiated from exactly the same public map and planted secret under a documented convention.
    - Recovery certificates have a basis-invariant canonical representation and an independent verifier.
  heuristic_assumptions:
    - id: H1
      statement: The preregistered regular toy slice intersects the generic open set of each projection.
      validation: Measure rank-loss and denominator-vanishing frequencies over an exhaustive tiny-field census and at least two larger toy strata; falsify transfer if they do not decrease or stabilize as predicted.
    - id: H2
      statement: Toy exceptional-locus frequencies are informative about the unverified Round-3 ensemble.
      validation: After primary-source reconstruction, compare the defining-minor statistics across increasing parameters and compressed versus uncompressed ensembles conditioned on the same planted oil space.
  proof_search_map:
    bottleneck: Prove that candidate projections are certificate-preserving and control every exceptional fibre, not merely that the systems have similar sizes or root counts.
    baseline_embedding:
      parameter_slice: Fixed tiny field, fixed UOV dimensions, one regular planted instance, and one rank-deficient nearby instance.
      reproduction_check: Exact elimination must reproduce the separately documented intersection, Kipnis-Shamir, and reconciliation ideals up to explicit invertible coordinate changes.
    observation_collision:
      audit: Search for two inequivalent oil-space certificates with identical projected roots, root counts, Hilbert functions, or verifier outputs before treating any observable as injective.
      failure_response: Refine the incidence variables or weaken the claim to a many-to-one correspondence with its fibre degree stated.
    constructive_transforms:
      - Elimination-derived rational lift with all denominators recorded
      - Basis-canonical certificate projection with an explicit inverse on the open set
      - Saturation decomposition separating generic and exceptional components
    quantifier_order: >-
      For every instance in a stated dense open subset, for every verifier-accepted
      solution certificate of each source formulation, there exists a lift in the
      incidence variety whose projections verify in each target formulation; the
      exceptional subset is fixed by instance equations before solutions are chosen.
    method_ceiling:
      statement: Incidence/elimination methods can prove only a toy or symbolic correspondence unless projection degrees and exceptional-locus bounds are parameter-uniform.
      nearby_counterobject: A random public quadratic map with a planted subspace may exhibit identical toy fibre counts while lacking a UOV-derived certificate map.
    proof_obligations:
      - Exact baseline-ideal reproduction lemma for each projection
      - Lift existence and certificate-correctness lemma on a declared open set
      - Round-trip identity lemma modulo basis equivalence
      - Exceptional-locus codimension or frequency bound
      - Complexity lemma charging elimination, certificate verification, memory, and preprocessing
    not_applicable_reason: null
  target_complexity:
    time_exponent: null
    memory_exponent: null
    best_known_baseline: >-
      The baseline to reproduce is the primary-source plain-UOV intersection,
      Kipnis-Shamir, and reconciliation attack cost on the same instance and
      parameter convention; no numeric exponent is asserted before that source check.
    hidden_overhead_disclosure: >-
      Gröbner elimination, saturation, extension-field arithmetic, exhaustive fibre
      enumeration, canonicalization, and certificate verification are fully charged;
      the proposed toy audit may be much more expensive than generating each system.
    time_memory_tradeoff: >-
      Storing elimination bases and all fibres reduces recomputation but can dominate
      memory; streaming source solutions saves memory while repeating lifts and
      verification. Both totals must be reported.
  sota_delta: >-
    Quantitative delta is 0 claimed bits and 0 claimed exponent improvement. The
    discriminating deliverable is six directed certificate-map success rates plus
    explicit fibre degrees and exceptional-locus frequencies, not a speedup.
