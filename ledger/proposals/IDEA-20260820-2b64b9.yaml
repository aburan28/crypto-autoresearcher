idea:
  id: IDEA-20260820-2b64b9
  question_id: RQ-SQISIGN-001
  added: '2026-08-20'
  title: Anytime ideal elimination with a held-out transcript firewall
  class: sequential_decoder
  claim: >-
    Sequential evidence may reduce average transcript and scoring cost while
    preserving a certified ideal list, provided adaptive elimination is isolated
    from held-out validation and every candidate score is attacker-computable.
    This is an experiment and proof design, not a claim of leakage or recovery.
  mechanism: >-
    Generate a declared candidate ideal fibre for the public curve and split
    transcript access into a selection stream and an untouched validation stream.
    Maintain a nonnegative e-process for each candidate using only attacker-visible
    transcript features. Eliminate a candidate when its score crosses a familywise
    threshold, but issue a final list only after a held-out sequential certificate
    confirms every elimination. Allocate signatures adaptively to unresolved
    collision blocks, record the stopping time per block, and output the surviving
    ideals with public-curve reproduction witnesses. Compare expected and tail
    time, memory, q, preprocessing, oracle calls, and verification against the
    complete KN-TECH-058/057 rows; early stopping is not credited unless holdout
    and failed-attempt costs are included.
  novelty_status: unverified
  status: proposed
  source_refs:
    - id: RQ-SQISIGN-001
      provenance: internal
      use: Defines the transcript, q-scaling, conversion, and ideal-output boundary.
    - id: IDEA-20260808-287361
      provenance: internal
      use: Static posterior predecessor; this proposal adds an anytime decoder and held-out coverage firewall.
    - id: EXP-SSI-7c41d9
      provenance: internal
      use: Three-replicate qualified toy true-simulator design pointer, currently unarchived and not supporting a result.
    - id: KN-TECH-058
      provenance: internal
      use: >-
        Retains unconditional Fp2 p^(1/2)(log p)^O(1) time with polynomial memory
        and conditional p^(1/3+o(1)) time and memory under Heuristic 1, including
        hidden superpolynomial overhead, absent concrete conclusion, unverified reductions,
        and the GRH boundary.
    - id: KN-TECH-057
      provenance: internal
      use: Fully charged frontier rows and separate conditional Fp p^(1/4) mixing comparator.
  predictions:
    - id: P1
      statement: >-
        With planted per-transcript drift mu, median stopping time for false
        candidates scales as O((log N+log(1/delta))/mu) while simultaneous
        true-ideal retention is at least 1-delta.
    - id: P2
      statement: >-
        Held-out validation removes apparent gains caused by adaptive score fitting;
        selection-only shrinkage that fails holdout is classified as an artifact.
    - id: P3
      statement: >-
        Under the genuine-simulator null, stopping times diverge to the registered
        cap and the certified survivor set remains the whole observational collision class.
    - id: P4
      statement: Any average-cost advantage disappears if tail stopping time, retries, holdout data, or candidate generation dominates.
  controls:
    genuine_simulator_null: >-
      Feed matched genuine-simulator transcripts through the identical selection,
      adaptive allocation, holdout, stopping, and public-curve verification pipeline.
    planted_positive_control: >-
      Add a known martingale drift for one candidate while preserving transcript
      shape; sweep the drift and require stopping-time and familywise-coverage curves
      to match the registered sequential bound.
    nearby_object_control: >-
      Randomly permute candidate labels after selection but before holdout; any
      retained localization beyond collision multiplicity must vanish.
  falsification_conditions:
    - The held-out familywise exclusion rate for the true ideal exceeds delta.
    - Score increments are not measurable from attacker-visible information or violate the e-process condition.
    - Genuine-simulator nulls show stable early stopping as planted drift tends to zero.
    - Tail rather than median stopping cost restores or exceeds the charged baseline.
    - Survivors cannot be emitted as ideals that independently reproduce the public curve.
  confounders:
    - Optional stopping can create false confidence if the e-process condition is only approximate.
    - Reusing signatures between selection and validation leaks adaptation into the holdout.
    - Candidate-dependent scoring latency can itself reveal the planted label.
    - Reporting median stopping time can hide catastrophic tails.
  interpretation_limits:
    - Sequential savings at toy scale do not imply an asymptotic improvement.
    - This proposal does not grant candidate-conditioned signer access.
    - SSI hard-problem impact is out of scope and remains owned by GOAL-SSI-001.
    - Every KN-TECH-058 conditional assumption, overhead, reduction caveat, and GRH boundary remains binding.
  heuristic_assumptions:
    - id: H1
      statement: Candidate score increments admit valid e-processes under the true-candidate null.
      falsification: Supermartingale calibration fails on genuine simulations or exact enumeration.
    - id: H2
      statement: Candidate blocks can be scored without secret-dependent work hidden in preprocessing.
      falsification: Score evaluation requires recovering the candidate secret or equivalent work.
  target_complexity:
    baseline: Preserve distinct unconditional Fp2, conditional Fp2, and conditional Fp comparison rows.
    expected_work: Sum over transcript steps of surviving_candidates(t)*T_score plus generation, holdout, witness, and verification costs.
    tail_work: Registered 0.99 or stronger quantile multiplied by inverse success probability.
    exponent_claim: none
  cost_model:
    time: T_gen(p)+sum_t N_survive(t)*T_score(p)+T_holdout(p,q)+T_witness(p)+T_verify(p)
    memory: M_candidate_state(p)+M_eprocesses(p)+M_holdout_certificate(p,q)
    data_queries: Selection signatures plus disjoint holdout signatures and all capped or failed sequential attempts
    preprocessing: Fibre generation, score calibration, e-process construction, and collision-block partitioning
    oracle: Every real-signer and genuine-simulator query, retry, abort, and adaptive message choice
    verification: Replay all elimination certificates and reproduce the public curve for every survivor.
  proof_search_map:
    exact_baseline_reproduction:
      plan: Expand each baseline row into per-attempt work, success, memory, and data before introducing early stopping.
      pass_condition: Median-only or free-holdout comparisons are rejected.
    observation_collision_search:
      plan: Identify maximal candidate blocks with identical score-increment laws for every adaptive query policy.
      pass_condition: Such blocks remain inseparable in the final list bound.
    quantifier_order_statement:
      plan: Order candidate generation, selection randomness, adaptive queries, stopping times, holdout sampling, and coverage probability explicitly.
      pass_condition: Holdout is sampled after the adaptive policy is frozen and remains disjoint.
    method_ceiling:
      plan: Let drift mu approach zero and solve both expected and tail stopping work at the transcript cap.
      pass_condition: The method claims no shrinkage or early-stop gain at zero drift.
    nearby_object_control:
      plan: Run label permutation between selection and holdout with identical stopping histories.
      pass_condition: Held-out localization vanishes beyond the registered false-exclusion rate.
  nearest_neighbors:
    - id: IDEA-20260808-287361
      discriminator: Replaces a static posterior endpoint with a constructive anytime elimination list and disjoint validation certificate.
    - id: IDEA-20260808-19876e
      discriminator: Requires secret-candidate elimination and public-curve witnesses, not a constant distinguishing bit.
    - id: EXP-SSI-7c41d9
      discriminator: Uses genuine simulation as a null-control pattern only and makes no evidentiary claim from the unarchived toy work.
  dominated_by: n/a (no result claimed)
  sota_delta: >-
    Proposed measurements: Delta_q=1-E[q_stop]/q_cap and
    Delta_list=(log N-log |L|)/log p, followed by Delta_e2e against each charged
    baseline using tail work and all six axes. All current deltas are 0 because
    no sequential run or proof exists.
  priority: medium_high
  cost: medium
  prior: 0.12
  provenance: agent_generated_under_TASK-20260820-a3c65a
