idea:
  id: IDEA-20260808-348896
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-SNOVA-001
  goal_id: GOAL-SNOVA-001
  title: The Frobenius twist-support profile of a SNOVA public key is a publicly computable
    invariant with exactly ell^2 slots, and its size is the precise measure of how far SNOVA
    is from being a UOV over F_{q^ell} -- with |S| = 1 meaning the extension-field reduction
    applies and the scheme falls to the matched QR-UOV-style baseline
  class: representation
  claim: 'SNOVA''s coefficient ring is A = F_q[S] with S of degree ell and irreducible characteristic
    polynomial, so A is isomorphic to F_{q^ell}; but the variables are full ell x ell matrices
    and the Q-twists do not commute with them, so the public map is F_q-quadratic and NOT
    A-quadratic. Every F_q-quadratic map from A^N to A has a unique Frobenius-bidegree expansion
    sum over 0 <= i,j < ell of c^{(i,j)}_{uv} Y_u^{q^i} Y_v^{q^j}. DEFINE the twist support
    S(pk) = {(i,j) : some c^{(i,j)} is nonzero}, a subset of (Z/ell)^2 computable from the
    PUBLIC key by one linear projection. CLAIM: (i) S(pk) is invariant under A-semilinear
    change of variables, so it is a genuine invariant of the key and not of its presentation;
    (ii) |S(pk)| = 1 (support {(0,0)}) if and only if the map is A-quadratic, in which case
    SNOVA reduces exactly to a UOV over F_{q^ell} with n and o A-ranks and is priced by the
    matched extension-field baseline -- the same baseline GOAL-QRUOV-001 is built on; (iii)
    if S(pk) is contained in the subgroup generated by (d,d) for some d dividing ell, the
    map is F_{q^d}-quadratic and a PARTIAL reduction to F_{q^d} applies, cutting the attacker''s
    variable count by a factor ell/d; (iv) for a uniformly random F_q-quadratic map the support
    is full, |S| = ell^2. The measurement is |S(pk)| for every published SNOVA parameter set,
    against the random null.'
  mechanism: 'Galois descent: an F_q-quadratic map between F_{q^ell}-vector spaces decomposes
    uniquely into Frobenius bidegree components, and the components that survive tell you
    the largest subfield over which the map is quadratic. Any attack that works over F_{q^d}
    sees d times fewer variables than one over F_q, so the support directly controls the effective
    system size. SNOVA''s designers chose the Q-twists specifically to break A-linearity;
    the support profile measures whether they broke it completely or only partially.'
  why_not_a_renamed_known_approach: 'Nearest known method: the "SNOVA is a UOV over a non-commutative
    ring, so lift/flatten it" family, and the reported group-action attacks. The difference
    is that flattening throws the ring away and lifting assumes it is usable; the twist support
    MEASURES which of the two is correct, with a forced value in each case. Nearest internal
    record: IDEA-20260805-54723a makes the group action measurable via the MULTIPLIER ALGEBRA
    of the public key. That object is the algebra of matrices commuting with the public forms;
    this one is the set of Frobenius bidegrees carrying nonzero coefficients. They are computed
    differently, take values in different sets, and a full multiplier algebra is consistent
    with any support.'
  object_first:
    established_families_named_off_limits: 'Off-limits as primary lens: wedge-product attacks,
      group-action stability attacks, Kipnis-Shamir, reconciliation, intersection, MinRank/support-minors
      on the flattened key.'
    tracked_object: The subset S(pk) of (Z/ell)^2 of nonzero Frobenius bidegrees.
    lossy_projection_test: 'PASSES. The projection discards every coefficient and keeps only
      a subset of ell^2 slots (at most 16 bits at ell = 4, against a public key of thousands
      of field elements). It is discarded COMPATIBLY because the support is closed under the
      operations that matter: an A-linear change of variables permutes coefficients within
      a bidegree slot and cannot create a slot that was empty, so the support propagates deterministically.
      It is not a change of coordinates: the key cannot be reconstructed from S(pk).'
    survival_depth: Survives every A-semilinear equivalence and every choice of key. It DISSOLVES
      under an F_q-linear change of variables that is not A-semilinear, which is exactly the
      secret transformation SNOVA applies -- so the honest statement is that S(pk) is invariant
      under the PUBLIC symmetry group and may be scrambled by the SECRET one, and whether
      it is scrambled is the measurement.
  predictions:
  - observable: '|S(pk)| for every published SNOVA parameter set (ell in {2,3,4})'
    metric: integer in [1, ell^2]
    predicted: Strictly between 1 and ell^2. A value of ell^2 means no reduction and SNOVA
      must be analysed flattened; a value of 1 means the extension-field reduction applies
      and SNOVA is priced by the QR-UOV-style baseline; an intermediate value that is a subgroup
      gives a partial reduction. All three outcomes are informative and the record commits
      in advance.
  - observable: '|S| for a uniformly random F_q-quadratic map on A^N'
    metric: integer
    predicted: ell^2 (full) with probability 1 - O(q^{-1}). This is the null.
  - observable: stability of S(pk) across 100 independently generated SNOVA keys at the same
      parameters
    metric: set equality
    predicted: Identical for all keys, because the support is determined by the Q-twist construction,
      not by the key. Key-to-key variation would mean the support is being scrambled by the
      secret transformation and the invariant is not usable as stated.
  minimal_test: Read SNOVA's spec, implement key generation at ell = 2 and 3 with small (v,o)
    -- e.g. (v,o,ell,q) = (4,2,2,16) and (6,3,3,16) -- and compute S(pk) by solving one linear
    system that expresses the flattened public forms in the Frobenius-bidegree basis. Report
    |S| and the exact slot pattern. Run the same code on (a) a uniformly random F_q-quadratic
    map, (b) a genuinely A-quadratic map (built by construction), as the two nulls. Then,
    if the spec permits, compute S(pk) at the published ell = 4 parameters, where key generation
    is still cheap even though attacks are not.
  controls:
  - 'A-QUADRATIC POSITIVE CONTROL: a map built to be A-quadratic by construction must return
    S = {(0,0)}. If it does not, the projection is implemented wrongly.'
  - 'RANDOM NULL: a uniformly random F_q-quadratic map must return the full support.'
  - 'BASIS-INDEPENDENCE CONTROL: recompute S(pk) after an A-semilinear change of variables;
    the set must be unchanged (up to the induced relabelling of bidegrees). Change indicates
    the invariant is not well-defined as implemented.'
  - 'ELL-SWEEP: |S| must respond to ell. A support size that does not change with ell is the
    artifact tell.'
  confounders:
  - The identification A = F_q[S] with F_{q^ell} requires a choice of isomorphism; the support
    is invariant under that choice only up to relabelling, which must be quotiented before
    keys are compared.
  - SNOVA's variables live in M_ell(F_q), which is A-module-isomorphic to A^ell, and that
    isomorphism is a choice; a bad choice can mix bidegrees. The basis-independence control
    catches this.
  - 'A small support does not automatically yield an attack: the partial reduction to F_{q^d}
    must still be constructed, and the oil module must be F_{q^d}-rational for it to apply.'
  falsification_conditions:
  - The A-quadratic positive control does not return S = {(0,0)}.
  - S(pk) varies key to key at fixed parameters.
  - '|S| = ell^2 at every published set AND no proper subgroup structure appears, which closes
    the reduction route and is recorded as a scoped negative supporting SNOVA.'
  interpretation_limits: The support is a necessary condition for a subfield reduction, not
    a sufficient one. A small support tells you which field the map is quadratic over; it
    does not by itself produce a cheaper attack until the oil module's rationality over that
    field is also established. Toy ell = 2, 3 measurements are toy; the ell = 4 computation
    is at published ell and is labelled accordingly.
  assumptions:
  - A = F_q[S] is isomorphic to F_{q^ell} (RECALLED from SNOVA's design; requires S to have
    irreducible characteristic polynomial).
  - The public key is available in a form from which the flattened quadratic forms can be
    extracted.
  heuristic_assumptions:
  - id: HA-1
    statement: For a uniformly random F_q-quadratic map A^N -> A, every one of the ell^2 Frobenius
      bidegree slots is nonzero with probability at least 1 - q^{-N}, uniformly in ell <=
      4.
    rigorous_ingredient: The Frobenius-bidegree expansion is a LINEAR bijection between the
      space of F_q-quadratic maps and the direct sum of the ell^2 slot spaces, so a uniform
      map has uniform independent slots; the bound is then exact, not heuristic. The only
      heuristic content is that the spec's key distribution is close to uniform in the slots
      it does populate.
    distribution_imitated: Uniformity of coefficients under a linear change of basis -- exact
      for a uniform map.
    validation_route: Sample 10^4 uniform F_q-quadratic maps at ell = 2, 3 and tabulate the
      empirical rate of empty slots against q^{-N}. TOY SCALE for ell, but the statement is
      exact so agreement should be to within sampling noise.
    tail_checks: Record the rarest observed slot pattern; a pattern appearing far more often
      than q^{-N} predicts indicates the sampler is not uniform and invalidates the null.
  target_complexity:
    time_exponent: 'Computing S(pk): one linear solve of size O((N ell)^2), negligible. The
      CONSEQUENCE, if |S| corresponds to a subfield F_{q^d}, is that every attack''s variable
      count drops from n ell^2 to n ell^2 / (ell/d), i.e. the exponent of any q^{c*variables}
      attack drops by the factor d/ell. At ell = 4, d = 2 that is a halving of the exponent
      -- a genuine exponent move, not a constant.'
    memory_exponent: 'Test: negligible. Consequence: every downstream attack''s Macaulay memory
      drops by the same factor in its exponent; the reduction is memory-favourable as well
      as time-favourable, which is stated because it is unusual.'
    best_known_baseline: SNOVA's claimed levels and the reported wedge-product and group-action
      attack costs (all secondhand in this program per GOAL-SNOVA-001's next_action and NOT
      to be cited as results).
    hidden_overhead_disclosure: The reduction, if it exists, requires the oil module to be
      defined over the smaller field; if it is not, the support is a distinguisher with no
      attack behind it. That gap is the main hidden overhead and is disclosed rather than
      assumed away.
    time_memory_tradeoff: Not applicable to the measurement.
  sota_delta: 'No attack claimed. Quantitatively, the three branches differ sharply: |S| =
    1 would mean SNOVA''s effective variable count is n ell rather than n ell^2, a factor-ell
    reduction in the exponent of every algebraic attack; |S| = ell^2 means no reduction and
    contributes a named obstruction; an intermediate subgroup gives a factor ell/d.'
  dominated_by: 'As an attack: n/a (no result claimed). As an invariant: not dominated by
    any corpus record. Frontier rows checked: IDEA-20260805-54723a (multiplier algebra), IDEA-20260805-70aa6e
    (A-module oil counting), IDEA-20260805-2f2863 (weak-key orbit invariance), IDEA-20260801-016
    (toy security map). None computes a Frobenius-bidegree support.'
  estimated_cost: 'Implementation medium: SNOVA key generation at small parameters plus a
    bidegree projector. Compute low: linear algebra on matrices of size a few thousand.'
  recommended_priority: high
  honest_prior_of_survival: 'That the invariant is well-defined and computable: ~0.9. That
    |S| is strictly between 1 and ell^2 (the interesting case): ~0.45. That |S| = 1 (the dramatic
    case): ~0.05. That the record yields a usable structural fingerprint either way: ~0.85.'
  novelty_status: unverified
  novelty_screen: Same corpus screen as M1-03, plus the titles/claims of IDEA-20260805-54723a,
    -70aa6e, -2f2863 and RQ-SNOVA-001 read in full. No corpus record contains a Frobenius-bidegree
    or twist-support analysis. WEB NOT CHECKED -- the SNOVA attack literature named in RQ-SNOVA-001
    remains unread by this program and this record does not cite it.
  discriminated_from: 'IDEA-20260805-54723a: multiplier algebra of the public key (a matrix
    algebra), not a bidegree support (a subset of (Z/ell)^2); independent values. IDEA-20260805-70aa6e:
    counts admissible oil objects; says nothing about which field the map is quadratic over.
    IDEA-20260805-2f2863: weak-key orbit invariance under a group action; different object.'
  source_refs:
  - SNOVA specification -- REQUIRED READ, NOT YET READ BY THIS PROGRAM.
  - The reported SNOVA wedge-product and group-action attacks -- explicitly NOT cited, per
    GOAL-SNOVA-001's instruction that the secondhand figures must not be restated.
