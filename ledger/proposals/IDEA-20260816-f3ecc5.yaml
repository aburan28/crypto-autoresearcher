idea:
  id: IDEA-20260816-f3ecc5
  question_id: RQ-AEADC-8db132
  added: '2026-08-16'
  title: 'Turn release of unverified plaintext from an adjective into a counted predicate: build scaled-down
    analogues of three decryption pipelines, hand the adversary the plaintext of every rejected ciphertext,
    and measure the distinguishing advantage that release buys as a function of how many rejected
    queries are released'
  class: mechanism
  claim: '(A) Release of unverified plaintext is usually discussed as a property a mode either has
    or lacks. It is instead a predicate with a countable price: for a decryption pipeline that emits
    candidate plaintext before the tag check completes, the quantity of interest is the distinguishing
    advantage that an adversary gains per released rejected ciphertext, and that quantity is measurable
    by exhaustion on scaled-down analogues where the plaintext space is small enough to enumerate.
    (B) Three pipeline shapes are distinguished and measured against each other in one instrument:
    a pipeline that releases the full candidate plaintext on tag failure, one that releases a truncated
    prefix (the streaming case, where the first blocks have already left the buffer), and one that
    releases nothing. The claim is that the advantage per released query differs measurably between
    the three, that it is graded in the number of released queries rather than jumping to one, and
    that the grading depends on the mode''s internal chaining and not on the block cipher. (C) The
    primitive slot is filled by a seeded ideal permutation, and the same measurement is repeated with
    a real primitive. A pipeline effect that vanishes under the ideal-primitive substitution is a
    primitive effect and is reported as out of this bucket. (D) NOT CLAIMED: no attack on any AEAD,
    deployed or otherwise; no assertion that any implementation releases unverified plaintext; no
    claim that the scaled-down analogues predict any full-size behaviour, since the advantage measured
    here is a number at those parameters and its transfer is an assumption the contract refuses to
    make; and no claim of a security consequence. The negative outcome -- all three pipelines showing
    the same advantage curve, indistinguishable from the null -- is a usable measured obstruction,
    because it would say that at these parameters the release predicate is not resolvable by this
    instrument and would put a floor under what any future measurement of it must beat.'
  mechanism: 'STAGE 1: define the scaled-down analogue precisely and freeze it before any measurement,
    following the discipline RQ-POLYMAC-7c89e4 imposes on its own analogues: the same mode structure,
    the same ordering of encryption and authentication, a reduced block width and a reduced tag width,
    so that the set of ciphertexts of a given length is enumerable and the tag check succeeds with
    a probability that is exactly computable rather than estimated. STAGE 2: implement three decryption
    pipelines over one shared mode implementation, differing only in what they return on tag failure
    -- full candidate plaintext, a declared prefix, or nothing but the failure symbol. STAGE 3: define
    a distinguishing game whose two worlds differ in a declared structural property of the plaintext
    (for instance whether the underlying message satisfies a fixed parity relation across blocks),
    fix an adversary strategy in advance, and run it against each pipeline with a budget of q rejected
    decryption queries. STAGE 4: sweep q and record the empirical distinguishing advantage with its
    confidence interval at each q, for each pipeline. STAGE 5: run the identical game against a null
    pipeline whose released plaintext is replaced by uniform random bytes of the same length, which
    is the shape-matched object that carries no mode structure at all. STAGE 6: repeat one column
    with a real primitive in the slot. Refutation: an advantage curve that is flat in q, or that matches
    the random-release null, retires the graded framing at these parameters.'
  novelty_status: unverified
  novelty_screen:
    method: 'Grepped ledger/proposals/, ledger/hypotheses/ and knowledge/ case-insensitively for:
      unverified plaintext, RUP, plaintext-aware, release of unverified. Grepped the same trees for
      aead, nonce-misuse, GCM-SIV, key commitment, partitioning oracle. Read RQ-AEADC-8db132 and RQ-POLYMAC-7c89e4
      in full, and the title, class and claim head of all eight proposals filed under RQ-AEADC-8db132.
      Read IDEA-20260809-47a08e in full. Read docs/inventor-protocol.md sections 1-5 and 8.'
    results: 'The phrase release of unverified plaintext appears in the knowledge corpus only inside
      knowledge/sources.json and a set of literature notes (KN-LIT-6958, KN-LIT-2689, KN-LIT-4304,
      KN-LIT-6290, KN-LIT-2499, KN-LIT-7249 were among the files matching the RUP-family grep, matched
      at the level of a filename list rather than a verified reading of each note) and in the generated
      knowledge/INDEX.md. It appears in NO proposal and NO hypothesis. Every AEADC proposal on record
      is a commitment record: IDEA-20260809-313546, 3a5c29, 33f26f, 3da508, 439aa8, 4719b8, 47a08e,
      44b750. RQ-POLYMAC-7c89e4 supplies the scaled-down-analogue discipline this record borrows but
      its object is the polynomial MAC, not the decryption pipeline.'
    verdict: 'UNVERIFIED. No claim is made about what the literature contains; release of unverified
      plaintext is plainly a named notion outside this repository and the corpus itself carries literature
      notes in that family. What is claimed new is internal and narrow: no proposal or hypothesis
      in this repository treats release as a counted predicate with a per-query advantage curve, and
      no AEADC record measures anything other than commitment. Assembled from known parts: the scaled-down-analogue
      discipline stated in RQ-POLYMAC-7c89e4, the ideal-primitive substitution named in this bucket''s
      own directive, and the null-object requirement of docs/inventor-protocol.md section 3.'
  object_first_candidate:
    tracked_object: The set of candidate plaintexts released across q rejected decryption queries,
      carried together with the mode-internal chaining values each one determines -- that is, the
      partial map from ciphertext blocks to intermediate mode state that each released candidate exposes.
    lossiness: 'Lossy, and deliberately so: the object discards the tag, the key, and every intermediate
      primitive output that the released candidate does not determine, keeping only the released bytes
      and the chaining relations they pin down. That discard is compatible with the mode''s operation
      because the chaining relations are exactly the part of the state that the decryption direction
      propagates independently of the tag check -- the tag check is a terminal predicate and touches
      no chaining value. The retained part therefore propagates deterministically under further rejected
      queries. If a measurement shows the object determines the whole state, the projection was not
      lossy and the entry reduces to a change of coordinates; that check is stage 1 and is reported
      either way.'
    propagation: 'One step is one additional rejected decryption query. It acts on the object by adjoining
      the newly released bytes and the chaining relations they determine, so the object grows as a
      union of partial constraints on mode state. The interesting structure is whether those constraints
      intersect: in a pipeline with strong chaining, query k+1 constrains state that query k already
      touched, so the object grows sublinearly and the advantage curve should bend; in a pipeline
      with no chaining across queries, the constraints are disjoint and the object grows linearly.'
    survival_score: The object survives until the accumulated constraints saturate the enumerable
      state space of the analogue. Concretely, survival is reported as the number of rejected queries
      at which the count of distinct chaining relations pinned by the released bytes stops growing,
      measured directly by counting the relations rather than inferred from the advantage curve. Expected
      to be reached inside the tested budget of q up to 4096 at the smallest analogue, and reported
      as not reached if it is not.
  null_object_control: 'A fourth pipeline, executed in the same invocation and driven by the same
    adversary code, that releases uniform random bytes of exactly the released length on every tag
    failure. This is the shape-matched random object: same interface, same volume of released data,
    no mode structure. For the signal arms to mean anything, the random-release null must show a distinguishing
    advantage indistinguishable from zero at every q, within its confidence interval. A second null
    is the release-nothing pipeline, which must show exactly the advantage of an adversary that only
    learns accept-or-reject, providing the floor the other arms are measured against.'
  discriminated_from:
  - IDEA-20260809-4719b8 builds a commitment test harness that returns a certificate or a derivation.
    This record builds no certificate and tests a decryption-time predicate, not a commitment property.
  - IDEA-20260809-439aa8 tests a padding-based commitment bound by attacking one bit below it. Both
    are graded tests, but the graded parameter there is padding length and the object is a key collision;
    here the graded parameter is released-query count and the object is a plaintext release.
  - RQ-POLYMAC-7c89e4 measures forgery probability against a bound on scaled-down analogues. This
    record borrows the analogue discipline but measures a distinguishing advantage from released plaintext,
    never a forgery probability, and would still run with a perfect unforgeable MAC in place.
  - The plain observation that releasing unverified plaintext is unsafe. This is not that; the deliverable
    is the per-query advantage curve and its dependence on pipeline shape, and a flat curve would
    be a usable result against the graded framing.
  - IDEA-20260809-3a5c29 separates key commitment from context commitment. That separation is about
    what a ciphertext binds; this is about what a failed decryption emits.
  assumptions:
  - The scaled-down analogue preserves the mode's ordering of encryption and authentication and its
    chaining structure, differing only in block width and tag width; this is asserted structurally
    in stage 1 and is the load-bearing assumption of the whole contract.
  - The declared distinguishing game is a fair test of what released plaintext buys, rather than of
    a quirk of the chosen plaintext property; two distinct plaintext properties are therefore run
    and compared.
  - The adversary strategy is fixed before any run and is not the optimal strategy, so every advantage
    is a lower bound.
  - An ideal permutation in the primitive slot is adequate for a mode-level measurement, so an effect
    that changes under substitution is a primitive effect.
  - Reduced tag width changes the accept probability but not the structure of what is released, so
    the release predicate is separable from the forgery probability; this is checked by running two
    tag widths.
  predictions:
  - metric: distinguishing advantage at q=1024, full-release pipeline versus release-nothing pipeline
    direction: higher
    minimum_effect: 0.1
  - metric: distinguishing advantage of the random-release null at every q
    direction: different
    minimum_effect: 0.02
  - metric: curvature of the advantage curve in q for the full-release pipeline, measured as the ratio
      of the gain from q=512 to 1024 over the gain from q=1 to 512 normalised per query
    direction: lower
    minimum_effect: 0.5
  - metric: gap between the full-release and prefix-release pipelines at q=1024
    direction: higher
    minimum_effect: 'explicit refusal to pre-commit: the gap depends entirely on how much of the chaining
      structure the declared prefix length covers, and pre-committing a number before the prefix length
      is fixed by the Coordinator would be a fabricated prediction'
  minimal_test:
    design: One invocation, four pipelines, one adversary. Build the analogue at 8-bit blocks and
      8-bit tags, with a message space small enough that the distinguishing game can be scored exactly
      rather than sampled. Fix one plaintext structural property and one adversary strategy, both
      frozen with file hashes. For each pipeline in {full release, prefix release, no release, random
      release} and each q in {1,4,16,64,256,1024,4096}, run 500 independent games and record the empirical
      advantage with a bootstrap interval. All four pipelines share one mode implementation and differ
      by a single branch, so the control arm is executable in the same call as the signal arm by construction.
      Then repeat the q sweep for the full-release pipeline at a second plaintext property, a second
      tag width, and with a real primitive in the slot. The discriminating comparison is full-release
      versus no-release, floored by random-release. Cost is under an hour on one core.
    controls:
    - Random-release null pipeline, identical interface and identical released volume, same invocation.
    - Release-nothing pipeline as the floor arm, giving the advantage available from accept-or-reject
      alone.
    - Second plaintext structural property, to separate a pipeline effect from a property-specific
      artifact.
    - Second tag width, to check that the release predicate is separable from the accept probability.
    - 'Primitive-substitution arm: seeded ideal permutation versus pinned real primitive at matched
      cells.'
    - Round-trip and known-answer validation of the analogue mode before any game runs.
    required_metrics:
    - empirical distinguishing advantage per pipeline per q, with bootstrap confidence interval
    - count of distinct chaining relations pinned by released bytes, per q
    - advantage curve curvature ratio in q
    - random-release null advantage at every q
    - release-nothing floor advantage at every q
    - exact accept probability per tag width, computed and compared against measurement
  falsification_conditions:
  - The full-release and release-nothing arms are indistinguishable at every q, retiring the counted-predicate
    framing at these parameters.
  - The random-release null shows a nonzero advantage, invalidating the adversary as an instrument.
  - The advantage curve is identical across the two declared plaintext properties in shape and in
    level, suggesting the game measures the property and not the pipeline, or differs so wildly that
    no pipeline statement survives either.
  - The measured accept probability disagrees with the exactly computed value at either tag width,
    indicating an implementation fault that voids everything downstream.
  - The effect disappears when the primitive slot is filled by an ideal permutation, relocating it
    out of this bucket.
  - The count of pinned chaining relations grows exactly linearly in q with no saturation anywhere
    in the tested budget, leaving the survival score undetermined.
  confounders:
  - Tag width sets the accept probability, which changes how many queries are rejected at all and
    can masquerade as a release effect; this is why two tag widths are run.
  - The chosen plaintext structural property may be unusually easy or hard to detect, confounding
    pipeline comparison; two properties are run.
  - At the smallest analogue the state space may be small enough that the adversary succeeds by exhaustion
    rather than by using released structure; the pinned-relation count separates the two.
  - Shared randomness between the game sampler and the mode key schedule would correlate arms; the
    seed schedule is declared disjoint.
  - Bootstrap intervals on an advantage bounded in [0,1] are skewed near the endpoints.
  interpretation_limits:
  - Every advantage is a lower bound, because the adversary strategy is fixed in advance and is not
    optimal.
  - The numbers are statements about the declared analogue at the declared widths and transfer to
    no full-size mode; the contract explicitly declines to extrapolate.
  - Nothing here asserts that any implementation releases unverified plaintext, and no such inference
    is licensed.
  target_complexity:
    time_exponent: No attack exponent is claimed. The instrument costs O(q) mode evaluations per game
      and O(q times games) overall.
    memory_exponent: No attack exponent is claimed. Memory is linear in the number of pinned chaining
      relations retained, bounded by the analogue state space.
    best_known: The incumbent is the qualitative statement that decryption pipelines which release
      unverified plaintext are weaker than those that do not. This record does not beat that statement;
      it attempts to put a per-query number under it at declared toy parameters, and can fail.
    hidden_overhead: 'The human cost is entirely in the analogue: an analogue whose chaining is accidentally
      trivial makes every pipeline look the same, and an analogue adjusted after seeing results measures
      the adjustment, which is why RQ-POLYMAC-7c89e4 makes freezing the analogue a constraint. Lower-order
      compute hides in the exact accept-probability computation at the larger tag width.'
  dominated_by: n/a (no result claimed). No attack, so no time, memory or data axis on which a frontier
    row exists. Checked against every AEADC proposal on record (all eight commitment records) and
    against RQ-POLYMAC-7c89e4's targets; none of them measures a release predicate, so there is no
    row this could sit below or above.
  sota_delta: no attack; conceptual/measurement contribution only. The quantitative deliverable is
    a four-arm advantage-versus-q table with confidence intervals and a pinned-relation count, where
    the corpus currently holds no measurement of release at all.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'By part. That a full-release pipeline shows a measurably higher advantage
    than a release-nothing pipeline at some q in the tested budget: about 0.85, because the released
    bytes are a strictly larger view and the analogue is small enough for that to register. That the
    advantage curve is graded and bends rather than jumping: about 0.55, since with a small analogue
    and a large query budget it may saturate almost immediately and look binary after all. That the
    prefix-release arm lands strictly between the other two: about 0.6, depending entirely on whether
    the declared prefix covers chaining structure. That the whole effect survives the ideal-primitive
    substitution: about 0.9, since the pipeline branch is a mode property by construction. That the
    pinned-relation count saturates inside the budget: about 0.5.'
