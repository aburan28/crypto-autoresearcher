idea:
  id: IDEA-20260830-f89eaf
  question_id: RQ-FBG-001
  added: '2026-08-30'
  title: >-
    MEASURE THE ONE CHANNEL KN-FIND-007 NAMES AS UNCAPTURED. Define the
    rank-saturation overhead kappa - harvested relations needed before the
    (B+1)-unknown index-calculus system attains full rank over F_N, divided by
    B+1 - and measure it per geometry with a growth arm, to discriminate
    "structured bases fail ONLY through coverage" from "structured bases are
    ADDITIONALLY rank-degenerate", and to supply the kappa_random that the rank
    channel's one-sided bound rests on.
  class: measurement

  claim: >-
    (A) THE GAP THIS FILLS, QUOTED FROM THE FINDING ITSELF. KN-FIND-007 closes
    the yield channel by identity and bounds the coverage channel, then states
    explicitly that "relation rank and independence are not captured - the mean
    scores a rank-deficient base as tied with a random base of the same size".
    The frozen battery's red team adds that the omission bounds the F3 family
    further rather than sparing it, but reports NO NUMBER. There is currently no
    measured rank value for any factor-base geometry anywhere in this repository.
    (B) THE QUANTITY. For a base D of size B in the group generated by P of prime
    order N, the index-calculus system over F_N has unknowns x_1..x_B = log D_j
    and k = log_P Q. Each harvested decomposition of a target R_i = a_i P + b_i Q
    as a size-m multiset contributes the row (e_i1, ..., e_iB, -b_i) with
    right-hand side a_i. Define
    kappa(D, N) = (number of harvested rows, in harvest order, before the
    coefficient matrix attains rank B+1) / (B+1), and kappa = infinity if a
    pre-registered budget of 10(B+1) rows is exhausted without full rank.
    (C) FOUR CLAIMS, EACH WITH A DIRECTION. (c1) kappa_random <= 1.05 at every
    tested rung - the baseline that the rank channel's one-sided bound needs.
    (c2) NO geometry in the panel has kappa below kappa_random by more than 0.01,
    i.e. the rank channel offers no advantage, only a penalty; since kappa >= 1
    holds for every base by counting alone, the best conceivable rank advantage
    is kappa_random itself, which (c1) puts at 1 + o(1). (c3) At least one panel
    geometry has kappa strictly above kappa_random by more than 0.05, and
    specifically a base containing two elements with a common x-coordinate has
    two identical columns and therefore kappa = infinity - a structurally FORCED
    deficiency the frozen battery already observed as an effective-size drop from
    94 to 92 at 2^14 without ever asking what it did to rank. (c4) The growth arm
    - the slope of (kappa_D - kappa_random) against log N, which is the only way a
    rank effect could be exponent-relevant, and which is predicted flat.
    (D) THE DISCRIMINATION, WHICH IS THE POINT. Two explanations are live for why
    structured geometries underperform, and they have never been separated.
    E1, PURE COVERAGE - a structured base loses because a random target decomposes
    less often (the H017 coverage ratio 0.0021), and once a decomposable target is
    found its relations are as good as anyone's. Prediction under E1 -
    kappa_D is indistinguishable from kappa_random for EVERY geometry, including
    the collapsed ones, and the entire penalty sits in target trials.
    E2, ADDITIONAL RANK DEGENERACY - a structured base also produces relations
    that span less, because its decomposable targets are few and its rows are
    correlated, so the penalties COMPOUND. Prediction under E2 - kappa_D exceeds
    kappa_random materially for the concentrated geometries, and can be infinite.
    These make opposite predictions on the same battery, and the pair is measured
    in one run at low cost. This is the discriminating content, not the raw kappa.
    (E) NOT CLAIMED. No attack, no break, no speedup. It is NOT claimed that a
    rank effect could produce an ADVANTAGE - the counting bound kappa >= 1 forbids
    more than kappa_random, and (c1) is the measurement of how small that ceiling
    is; this record is therefore expected to CLOSE its own channel and is designed
    so that closure is the informative outcome. It is NOT a displacement-rank
    measurement and makes no structured-solve claim. It runs no linear-algebra
    benchmark and reports no solve time.

  mechanism: >-
    WHY RANK IS A DIFFERENT OBJECT FROM COVERAGE AND NOT A RESTATEMENT OF IT.
    Coverage counts which TARGETS are reachable. Rank counts which DIRECTIONS in
    the unknown space are constrained. The two come apart in a way that is easy
    to state and has never been measured here - a base with tiny coverage can
    still produce abundant rows, because the concentration statistic says its few
    reachable targets each have very many decompositions (H017 at coverage ratio
    0.0021 with concentration 1224x), and every one of those decompositions is a
    DISTINCT equation in (x, k) even though they share a right-hand side. So the
    question "do many rows from few targets span the space" is not answered by
    either measured quantity, and its answer decides whether the two penalties
    add or multiply.
    THE LOSSY-PROJECTION TEST. The tracked object is the ROW SPACE of the
    harvested relation matrix, projected to its dimension - one integer standing
    in for a subspace of F_N^{B+1}. Violently lossy - it forgets which targets,
    which base elements, the coefficients, the curve and the field, and vast
    numbers of distinct matrices share it. Lossy COMPATIBLY with the operation
    relation collection performs, because appending one harvested row is a rank-1
    update - the dimension increases by exactly 0 or 1 and never by more - so the
    retained integer propagates deterministically under the very operation being
    performed, and the SHAPE of the resulting staircase (how quickly it
    saturates) is a richer reading than its endpoint. It is not a change of
    coordinates - two bases with identical (mean, coverage) can have different
    kappa, which is exactly the E1-versus-E2 separation and is why the object is
    worth tracking rather than derivable.
    WHY A FORCED DEFICIENCY EXISTS AND IS PREDICTABLE IN ADVANCE. Under the
    x-coordinate convention a factor base is a set of x-values, and two listed
    elements sharing an x-coordinate are the same unknown - so the corresponding
    two columns are identical and the matrix can never exceed rank B, giving
    kappa = infinity under the stated definition. The frozen battery observed
    exactly this collision in the wild, reporting an effective size of 92 instead
    of 94 at 2^14 for one matched-random base, and treated it as a size
    bookkeeping issue. It is also a rank issue, and it matters operationally
    because a base selected for EXP-R6-001 that silently carries a duplicate
    column produces a system that never solves - a failure mode invisible to
    every metric this bucket currently reports.

  novelty_status: unverified

