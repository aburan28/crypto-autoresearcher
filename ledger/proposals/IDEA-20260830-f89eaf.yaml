      provenance: recalled
      claim: >-
        Recalled - for uniform rows over F_q the probability that B + c rows fail
        to span is O(q^{-c}), and sparse random matrices with row weight at least
        3 have full rank with high probability. These supply the classical
        distribution H2 imitates. Not fetched or read this session, and neither is
