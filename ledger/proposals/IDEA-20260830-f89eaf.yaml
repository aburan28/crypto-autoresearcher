        and share columns across decompositions of the same target.
      verified_by: null

  assumptions:
    - >-
      The system solved is the standard one with B+1 unknowns (the base
      logarithms and the target logarithm k), so full rank means B+1. If the
      harness's actual solve uses a different unknown set the definition of kappa
      must be restated for it before any number is quoted; the contract fixes the
      unknown set in writing before the run.
    - >-
      Rank is taken over F_N with N prime, so exact linear algebra is available
      and no modular accident can occur; for non-prime group order the reduction
      to prime-order components is done explicitly rather than assumed.
    - >-
      Rows are harvested by exact decomposition enumeration using known
      logarithms at toy scale, so relation collection is a counting operation and
      not a solver output. No certificate is claimed for any solve because no
      solve is run; per docs/claims-and-verification.md this is a
      certificate kind none measurement run, and it says so.
    - >-
      Targets R_i = a_i P + b_i Q are drawn with a_i, b_i uniform and independent
      across i, and the harvest order is declared before the run.
    - >-
      Panel arms are verified against their labels from the committed source
      before any cell runs, because a live harness path builds the H017 geometry
      under a different name and has no seed variation.

  proof_search_map:
    not_applicable_reason: >-
      NOT A PROOF-ORIENTED PROPOSAL, and the reason is specific rather than a
      shrug. This record proposes no theorem, no certificate family, no reduction
      and no asymptotic claim. The only derivations it uses are elementary and
      already stated inline - that B+1 independent equations require at least B+1
      rows (hence kappa >= 1 for every base, with no assumption), and that two
      listed base elements sharing an x-coordinate give identical columns (hence
      rank at most B, hence kappa infinite). The section-8 audits that would
      otherwise be run are discharged inside minimal_test.controls - the matched
      random null is the baseline, the duplicated-column base is the positive
      control that proves the instrument can see a deficiency it was handed, and
      the row-permutation recomputation is the nearby-object control that
      separates a property of the base from a property of the harvest order. The
      asymptotic reading of kappa belongs to IDEA-20260830-772cff, which carries
      its own proof_search_map and cites this record as its rank limb.

  predictions:
    - metric: kappa for the matched random base
      direction: different
      minimum_effect: >-
        PREDICTED AT MOST 1.05 at every rung, and predicted to DECREASE toward 1
        as N grows since the singularity probability scales like 1/N. A value
        above 1.2 at any rung falsifies H2, and with it the one-sided rank bound
        that IDEA-20260830-772cff's channel 3 rests on - the single most valuable
        way this record can come out wrong.
    - metric: min over the panel of (kappa_D - kappa_random) at each rung
      direction: different
      minimum_effect: >-
        PREDICTED >= -0.01. A geometry at -0.05 or below reaches full rank in
        materially fewer relations than random and exhibits a genuine rank
        ADVANTAGE, which would reopen the channel; that is a real possible
        outcome and the metric is stated so it cannot be quietly skipped.
    - metric: kappa for the H017 small-multiples base minus kappa_random
      direction: higher
      minimum_effect: >-
        0.05, or infinity. Under E1 this difference is 0 within intervals and the
        entire H017 penalty is coverage; under E2 it is positive and the
        penalties compound. The two readings are mutually exclusive and both are
        reportable.
    - metric: kappa for the duplicated-column positive control
      direction: different
      minimum_effect: >-
        FORCED INFINITE. The matrix cannot exceed rank B. A finite value means
        the rank computation or the unknown-set definition is wrong and nothing
        else in the run is readable.
    - metric: slope of (kappa_D - kappa_random) against log2 N, per geometry
      direction: different
      minimum_effect: >-
        PREDICTED FLAT, with an interval containing 0, since kappa is a ratio to
        B+1 and carries no obvious N-dependence. An interval excluding 0 is the
        only way the rank channel could be exponent-relevant, in EITHER
        direction, and would be the headline of the run. No sign is
        pre-committed.
    - metric: >-
        agreement between kappa under the declared harvest order and kappa after
        a random permutation of the identical harvested rows
      direction: different
      minimum_effect: >-
        FORCED AGREEMENT within 0.02. Disagreement means kappa is a property of
        the harvest order rather than of the base, and every cross-geometry
        comparison in the run is void.
    - metric: >-
        number of DISTINCT decomposable targets contributing rows, per arm
      direction: lower
      minimum_effect: >-
        For H017, predicted O(B) rather than O(N), tracking the recorded coverage
        ratio 0.0021 at 2^18. Reported as the covariate that makes the
        E1-versus-E2 reading interpretable - if kappa is elevated ONLY where the
        distinct-target count is small, the mechanism is shared right-hand-side
        columns rather than the geometry as such.

  minimal_test:
    design: >-
      STAGE 0, ZERO COMPUTE, HARD GATE. Fix in writing the unknown set (B+1),
      the harvest order, the budget 10(B+1) at which kappa is declared infinite,
      and the panel. Verify each arm's constructed geometry against the committed
      source. Panel - matched random (null), high_bit_interval, small_height,
      coset_union, H017 small multiples (the concentrated extreme), a
      Bose-Chowla or low-collision near-ceiling base (the coverage extreme in the
      other direction), and a DUPLICATED-COLUMN base (positive control, kappa
      forced infinite).
      STAGE 1. At N ~ 2^12, 2^14, 2^16, 2^18 with B = ceil((6N)^(1/3)) and m = 3,
      for each arm, each of 4 curves and each of 4 seeds - draw targets
      R_i = a_i P + b_i Q with a_i, b_i uniform, enumerate ALL size-m
      decompositions of each decomposable target exactly, and append the rows in
      the declared order.
      STAGE 2. Maintain the rank incrementally over F_N and record the FULL
      STAIRCASE - rank as a function of rows appended - not merely the endpoint.
      Stop at rank B+1 or at the budget. Compute kappa.
      STAGE 3. Recompute kappa on a random permutation of the identical row
      multiset, and recompute the rank over a second representation as a
      consistency check on the arithmetic.
      STAGE 4. Report kappa per arm per rung with bootstrap intervals over curves
      and seeds, the differences against kappa_random, and the growth slopes with
      one Holm correction across the panel. Report the distinct-decomposable-
      target count per arm as the covariate that separates the two mechanisms.
      THE DISCRIMINATING OUTPUT is one table - seven arms by four rungs of kappa,
      with kappa_random in the first row and infinity in the last.
      ENVELOPE. Exact decomposition enumeration is the frozen battery's own
      O(B^3/6 + N), about 5e5 operations per cell at 2^18. Incremental rank over
      F_N on at most 10(B+1) rows of B+2 columns at B = 117 is a few times 10^7
      field operations per cell. Whole battery is core-minutes to a couple of
      core-hours; peak memory is one dense (10B) x (B+2) matrix over F_N plus one
      length-N count vector, under 1 GB at 2^18, reported. NO Groebner basis is
      built and no solver is invoked, so this cannot meet the GOAL-DREG-001
      memory wall, and any resource stop would be an infrastructure failure under
      AGENTS.md rule 3 and never negative mathematical evidence.
    controls:
      - >-
        MATCHED RANDOM BASE at identical negation-collapsed effective size, drawn
        in the same invocation at every rung. Every kappa is reported as a
        difference against it, never in isolation.
      - >-
        DUPLICATED-COLUMN POSITIVE CONTROL, a base with two elements sharing an
        x-coordinate, for which kappa must be infinite. BLOCKING - an instrument
        that cannot detect a rank deficiency it was handed cannot report an
        absence of one.
      - >-
        ROW-PERMUTATION RECOMPUTATION on the identical row multiset, separating a
        property of the base from a property of the harvest order.
      - >-
        SECOND ARITHMETIC PATH for the rank, so a modular or implementation
        accident cannot masquerade as a rank result.
      - >-
        EFFECTIVE-SIZE ACCOUNTING per arm, with the negation-collapse fraction
        reported, since the frozen battery observed a real 94-to-92 collapse and
        an unnoticed one would produce a spurious infinity.
      - >-
        DISTINCT-DECOMPOSABLE-TARGET COUNT per arm as a reported covariate, so an
        elevated kappa can be attributed to shared right-hand-side columns rather
        than to geometry when that is what the data say.
      - >-
        SEED-VARIATION AUDIT - arms built on a harness path with no seed
        dependence have identically zero spread across seeds, and reporting a
        seed interval for them would be meaningless and is prohibited.
    required_metrics:
      - kappa per arm, curve, seed and rung, with the budget flag when infinite
      - the full rank staircase, rank against rows appended, per cell
      - kappa_random per rung with bootstrap interval
      - (kappa_D - kappa_random) per arm per rung with interval
      - Holm-corrected growth slope of (kappa_D - kappa_random) vs log2 N
      - kappa under the declared order versus under a random row permutation
      - distinct decomposable targets contributing rows, per arm per rung
      - rows harvested per distinct target (the concentration covariate)
      - effective size and negation-collapse fraction per arm
      - rank agreement across the two arithmetic paths
      - peak RSS and wall time per rung

  falsification_conditions:
    - >-
      The duplicated-column positive control returns a finite kappa. The rank
      computation or the unknown-set definition is wrong and NOTHING in the run
      is readable.
    - >-
      kappa under a random row permutation differs from kappa under the declared
      order by more than 0.02 for the random arm. kappa is an artefact of harvest
      order and no cross-geometry comparison stands.
    - >-
      kappa_random exceeds 1.2 at any rung. H2 is falsified, the rank channel's
      one-sided bound in IDEA-20260830-772cff is withdrawn, and the channel is
      REOPENED.
    - >-
      Some geometry has kappa below kappa_random by more than 0.05. A rank
      ADVANTAGE exists, contradicting claim (c2), and RQ-FBG-001 gains a live
      channel.
    - >-
      Every panel geometry has kappa indistinguishable from kappa_random at every
      rung, including H017. EXPLANATION E1 is supported - structured bases fail
      through coverage alone, the penalties do not compound, and the rank channel
      is closed with a measured band.
    - >-
      H017 or another concentrated geometry has kappa materially above
      kappa_random. EXPLANATION E2 is supported - the penalties compound - which
      strengthens the scoped kill rather than weakening it, and additionally
      supplies EXP-R6-001 with a concrete disqualifying criterion for base
      selection.
    - >-
      The growth slope interval excludes 0 for any geometry in either direction.
      The rank channel is N-dependent, which is the only route by which it could
      be exponent-relevant, and it becomes the run's headline.

  confounders:
    - >-
      HARVEST ORDER. Rank saturation is order-sensitive by construction; the
      row-permutation control is the most important control in the design and its
      failure voids the comparison rather than merely qualifying it.
    - >-
      SHARED RIGHT-HAND-SIDE COLUMNS. Rows harvested from the same target share
      their b_i entry, so a concentrated geometry's rows are correlated in the
      last column for reasons that are about CONCENTRATION rather than about
      geometry. The distinct-target covariate exists to separate these and must be
      reported with every elevated kappa.
    - >-
      SMALL B AT THE LOW RUNGS. At N ~ 2^12, B is about 29 and kappa is quantised
      in steps of 1/30, so a 0.01 threshold is below the resolution at that rung;
      the resolution per rung is computed in Stage 0 and thresholds are applied
      per rung rather than globally.
    - >-
      x-COLLISIONS PRODUCE SILENT INFINITIES. A base that accidentally contains
      two elements with a common x-coordinate is rank-deficient for a bookkeeping
      reason and not a geometric one; effective-size accounting must run before
      kappa is attributed to a geometry.
    - >-
      ZERO SEED SPREAD ON DETERMINISTIC ARMS. One live harness path has no seed
      dependence, so its intervals are degenerate; treating a zero-width interval
      as a precise measurement would overstate every comparison against it.
    - >-
      BUDGET CHOICE. Declaring infinity at 10(B+1) is a convention; a geometry
      needing 12(B+1) rows would be recorded as infinite and as qualitatively
      different from one needing 9(B+1), which it is not. The staircase is
      reported in full so a later reader can re-scope the budget without a rerun.

  interpretation_limits:
    - >-
      A kappa value is NOT a solve time and NOT a speedup. No linear-algebra
      method is run, timed or compared; the record measures how many relations
      must be harvested, not what solving them costs.
    - >-
      The rank channel's best conceivable ADVANTAGE is kappa_random, by the
      counting bound kappa >= 1. So a favourable result here cannot be large, and
      this record is expected to close its own channel. That asymmetry is stated
      up front so that a null is not later presented as a disappointment.
    - >-
      Toy scale, N <= 2^18, m = 3, generated curves, B <= 117. A growth slope
      over four rungs is a trend with a wide interval, not an asymptotic rate.
    - >-
      Scoped to the standard (B+1)-unknown system. A different formulation of the
      index-calculus linear algebra would have a different kappa and this record
      says nothing about it.
    - >-
      NOVELTY IS NOT ADJUDICATED. The corpus was grepped and the nearest record
      (IDEA-20260816-dca08c, a DIFFERENT rank invariant) read in full; no
      external literature search was run for the specific pairing of factor-base
      geometry with ordinary rank saturation. Honest status is unverified.

  heuristic_assumptions:
    - id: H1
      statement: >-
        RANDOM-BASE RANK SATURATION. For D a uniformly random B-subset of a group
        of prime order N, and relation rows (e_i, -b_i) harvested from uniform
        targets R_i = a_i P + b_i Q by exact enumeration, the number of rows
        needed for the (B+1)-column coefficient matrix to attain rank B+1 over
        F_N is (B+1)(1 + O(1/N)); concretely kappa_random <= 1.05 for B >= 29 at
        every tested rung, and decreasing in N.
      rigorous_support: >-
        The RIGOROUS half is the counting bound kappa >= 1, which holds for every
        base with no assumption whatever, and it is the half that carries the
        one-sided conclusion regardless of what kappa_random turns out to be. The
        CLASSICAL DISTRIBUTION STATEMENT IMITATED is the rank distribution of
        random matrices over a finite field - the probability that B + c uniform
        rows fail to span a B-dimensional space over F_q is O(q^{-c}) - together
        with the standard full-rank results for random sparse matrices of row
        weight at least 3. The gap, stated plainly - the rows here are neither
        uniform nor independent. They are nonnegative integer exponent vectors of
        weight at most m with row sum exactly m, so they lie in an affine
        hyperplane; and rows harvested from the same target share their last
        column exactly. Whether that structure costs more than O(1/N) extra rows
        is what the measurement decides, which is why this is a heuristic and not
        a lemma.
      validation_plan: >-
        SAMPLE - 12 matched random bases per rung (4 curves x 4 seeds, minus
        degenerate cells) at N ~ 2^12, 2^14, 2^16, 2^18, harvesting to a budget
        of 10(B+1) rows and recording the full staircase, so the distribution of
        the excess is observed rather than summarised. COMPARISON DISTRIBUTION -
        the excess (rows to full rank) - (B+1) against the geometric tail with
        ratio 1/N implied by the random-matrix rank count, by Kolmogorov-Smirnov
        at the 1% level per rung. TAIL CHECKS - (a) the maximum excess across all
        draws against that tail; (b) the fraction of draws never reaching full
        rank within budget, predicted 0, with every such draw reported
        individually rather than averaged over; (c) kappa recomputed after a row
        permutation, which must agree within 0.02. TRANSFER ASSUMPTIONS - none.
        Nothing above 2^18 and nothing on standardised curves is claimed, and the
        decreasing-in-N clause is reported as a measured trend over four rungs.
    - id: H2
      statement: >-
        HARVEST INDEPENDENCE FROM ORDER. For every arm, kappa computed in the
        declared harvest order and kappa computed on a uniformly random
        permutation of the identical row multiset agree in distribution, so kappa
        is a property of the base and the target draw rather than of the
        harvester's scheduling.
      rigorous_support: >-
        The RIGOROUS ingredient is that the FINAL rank of a fixed row multiset is
        order-independent by definition of a row space - only the SATURATION POINT
        can depend on order, and it does so only through which rows arrive early.
        The CLASSICAL STATEMENT IMITATED is exchangeability - if rows were i.i.d.
        the saturation point would be exchangeable and order would be irrelevant
        in distribution. The gap - rows are harvested in blocks, one block per
        decomposable target, and blocks are internally correlated, so a
        target-major order is NOT exchangeable with a uniformly permuted order.
        For a concentrated geometry this is expected to bite, and the size of the
        bite is itself a reportable number.
      validation_plan: >-
        SAMPLE - every cell in the battery, recomputed under both orders, so this
        is a paired comparison with no extra harvesting cost at all. COMPARISON -
        the paired difference distribution against 0, per arm and rung, with the
        0.02 threshold applied per rung after the quantisation check. TAIL CHECK -
        the single largest paired difference across the battery, reported with
        its cell. TRANSFER - none. If the paired difference exceeds threshold for
        the RANDOM arm the whole comparison is void; if it exceeds threshold only
        for concentrated arms, that is a finding about block correlation and is
        reported as such rather than as a rank result.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND NONE IS MOVED. The quantity measured is a
      RATIO to B+1, so its best possible value is 1 and the largest advantage it
      could ever confer is kappa_random, predicted at most 1.05 - a constant, not
      an exponent, and by construction it cannot be otherwise. Under
      docs/target-result-profile.md A1 this record is explicitly NON-TARGET-CLASS
      and its priority rests on being the missing input to a closure and a
      disqualifying criterion for base selection, not on being an advance. The
      measurement itself costs one incremental rank computation over F_N on at
      most 10(B+1) rows of B+2 columns, i.e. O(B^3) field operations per cell.
    memory_exponent: >-
      One dense (10B) x (B+2) matrix over F_N plus one length-N count vector,
      under 1 GB at N = 2^18 with B = 117, reported per run. No large linear
      algebra, no meet-in-the-middle table, no Groebner basis.
    best_known: >-
      For the MEASURED QUANTITY there is no incumbent - KN-FIND-007 records the
      rank channel as uncaptured and the red team argues it with no number, so
      this repository holds zero kappa values. For the underlying linear-algebra
      stage the incumbent named in this program is generic sparse Wiedemann,
      which this record does not run, does not time and does not claim to beat.
      For prime-field ECDLP the frontier is Pollard rho at 0.886*sqrt(N) with
      O(1) memory; no algorithm is proposed here.
    hidden_overhead: >-
      Two disclosures. FIRST, kappa charges nothing for FINDING the decomposable
      targets - at toy scale they are found by exact enumeration with known
      logarithms, which is exactly the cost that dominates a real attack and is
      precisely what the coverage channel already accounts for. So kappa must
      never be netted against coverage; the two are reported side by side and the
      product is the honest quantity. SECOND, the budget 10(B+1) converts a large
      finite kappa into an infinity, which overstates the difference between a
      geometry needing 12(B+1) rows and one needing 9(B+1); the full staircase is
      published so any later reader can re-scope the budget without a rerun.
    tradeoff_note: >-
      Not applicable in the algorithmic sense - no algorithm is produced. The
      design tradeoff the record quantifies is between COVERAGE, which sets how
      many targets must be tried, and kappa, which sets how many relations must
      be collected once they are found. KN-FIND-007's conservation makes the
      first exactly geometry-invariant under harvest-all, so kappa is the only
      remaining multiplicative factor on relation collection and measuring it
      closes the accounting.

  dominated_by: >-
    CHECKED ROW BY ROW, NOT ASSERTED. AS AN ATTACK - none is mounted, so every
    frontier row dominates it on every axis - Pollard rho (0.886*sqrt(N) time,
    O(1) memory), BSGS, van Oorschot-Wiener, and the corpus's own m = 3
    chained-Semaev index calculus at 2.0e4..1.5e5x rho. Checked across time,
    memory and data/queries. AS A YIELD OR COVERAGE STATEMENT - dominated by
    KN-FIND-007 and by the 1.582 coverage envelope, neither of which this record
    touches. AS A RANK STATEMENT - IDEA-20260816-dca08c is the nearest row and it
    does NOT dominate, because it measures displacement rank relative to a
    declared shift operator and answers a structured-solve question, while this
    measures ordinary rank saturation against a relation count; neither implies
    the other, and if both run they should share a battery. As a MEASUREMENT it
    is dominated on cost by doing nothing, since it produces no algorithm. Not
    null on any axis.
  sota_delta: >-
    Zero on every ECDLP cost axis - no attack, no algorithm, no exponent.
    QUANTIFIED DELIVERABLE - this repository currently holds ZERO measured rank
    values for any factor-base geometry, with the channel named as uncaptured in
    a committed finding and argued qualitatively in a red-team objection. A
    completed run records kappa as an exact ratio for seven arms across four
    group sizes, four curves and four seeds, each with a bootstrap interval, a
    Holm-corrected growth slope, a paired order-permutation check, and the full
    rank staircase; it separates two named explanations (coverage-only versus
    compounding rank degeneracy) that no existing record separates; and it
    supplies IDEA-20260830-772cff's channel 3 with the kappa_random its one-sided
    bound depends on. No solve time, relation rate or cost exponent changes.

  estimated_cost:
    implementation: medium
    compute: low
    basis: >-
      Compute is dominated by exact decomposition enumeration at the frozen
      battery's O(B^3/6 + N), about 5e5 operations per cell at 2^18, plus an
      incremental F_N rank on at most 10(B+1) rows of B+2 columns, a few times
      10^7 field operations per cell - core-minutes to a couple of core-hours for
      the whole battery. Implementation is medium because the incremental rank
