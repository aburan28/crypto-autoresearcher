  falsification_conditions:
    - >-
      The (R1) arm shows a nonzero merge-failure fraction. Instrument defect;
      merging is exact for a deterministic class map by construction.
    - >-
      The constant-tag control does not match the (R1) arm. Code defect in the
      tagged path; nothing about tagging is learned.
    - >-
      The tagged detected fraction does not fall as 2^-d. The merging loss is
      not being exhibited; the derivation is unillustrated and must be reported
      as such, not as confirmed.
    - >-
      The reachable tagged state space is much smaller than (N/2)*r. The
      (R2a) penalty is overstated and the record must be superseded with the
      corrected count.
    - >-
      A fourth source of the missing bit is exhibited that is not advice from
      outside the walk. The enumeration in (C) is incomplete and the closure is
      void -- this is the single most valuable possible refutation and the
      quantifier_order block states that the enumeration is over the walk's own
      state and history only.
    - >-
      Crashes or memory exhaustion enumerating the tagged space. INFRASTRUCTURE
      outcome under AGENTS.md rule 5; report the largest size reached.

  confounders:
    - >-
      COLLISION-DETECTION METHOD. The merging argument applies to
      distinguished-point detection. A seen-set (as h041 used) or Floyd/Brent
      detects collisions differently and does not exhibit the 2^d loss -- but
      neither is the parallel baseline, and comparing a tagged walk under a
      seen-set against a canonicalised walk under DPs would be comparing
      detection methods, not walks.
    - >-
      CURVE MODEL. Short-Weierstrass versus Montgomery changes the arithmetic
      of both repairs by factors of two to three without changing the
      state-size or merging prices. Every number names its model.
    - >-
      TAG DEFINITION. Carrying x(R - T_{s_prev}) is one choice; carrying the
      previous x is another, with a different reachable-state count. The record
      measures the stated tag and notes that other tags change the (R2a)
      constant but not the (R2b) merging loss, which depends only on the tag
      being non-constant.
    - >-
      SMALL-N ENUMERATION LIMITS. The tagged space is r times larger than the
      class set, so enumeration stops r times sooner. At r = 20 and 14 bits
      this is already about 1.6*10^5 states, which is fine; at 18 bits it is
      about 2.6*10^6 and is the practical limit.

  interpretation_limits:
    - >-
      ANY MEASURED EXCESS OVER sqrt(|Aut|) IN THIS LANE IS A SUSPECTED
      INSTRUMENT ARTIFACT UNTIL A NULL CONTROL SAYS OTHERWISE
      (RQ-EWALK-8fa147 decision_target). In particular, a tagged walk that
      appeared to beat the canonicalised walk would almost certainly be
      counting x-collisions rather than DETECTED collisions -- the exact
      observation collision this record names -- and must be checked against
      the merge-failure metric before anything is claimed.
    - >-
      This is a CLOSURE OF ONE REPAIR FAMILY, with an obstruction and a
      quantified price. It is not a statement that x-coordinate representations
      are useless: the corpus's own orientation note explicitly says h041 is "a
      negative control rather than evidence against every x-coordinate
      representation", and this record narrows rather than widens that.
    - >-
      Nothing here concerns the exponent (KN-TECH-005) and nothing concerns
      index calculus, where x-coordinates as field elements are a genuinely
      different resource (R1) that this construction does not use.
    - >-
      Toy scale for the illustration; the derivation is instance-free but its
      experimental illustration is at 14-16 bits and is labelled so (AGENTS.md
      rule 7).
    - >-
      The forward guidance in (G) names what remains open and must travel with
      any citation of the closure.

  reachability_gate: >-
    DOES NOT MOVE BETWEEN CURVES; the negation automorphism exists on every
    curve with p > 3, so there is nothing to reach. Recorded because the
    campaign requires it and because the triviality is informative: this
    record's obstruction applies to EVERY prime-field curve without exception,
    which is unusual in a campaign whose other findings are gated on D_0.
    The one place reachability re-enters is (G)(ii): a Montgomery or Kummer
    MODEL of the same curve is reachable at zero cost by a change of
    coordinates (it is the same curve, not a different one), so the model-level
    question is genuinely open and cheap to pursue in lane L11 --
    unlike the D_0-gated questions elsewhere in L6.

  target_complexity:
    time_exponent: >-
      1/2 for every construction discussed; no exponent moves. The derived
      penalties are: (R2a) a factor sqrt(r) in the constant, so
      1.2533*sqrt(N r/2) against 1.2533*sqrt(N/2); (R2b) a factor 2^d in total
      steps to detection, so about 2^d * sqrt(N/2). Both are constants in the
      complexity-theoretic sense and both are enormous in practice -- 4.47x at
      r = 20 and 2^30 at the granularity of the largest completed computation
      (KN-LIT-097).
    memory_exponent: >-
      (R2a) stores the same O(1) per processor but its DP table fills at the
      same rate on an r-times-larger state space, so the table is comparable;
      (R2b) needs the DP table to hold about sqrt(N/2) entries for detection to
      work at all -- since detection now requires a birthday collision AMONG
      STORED POINTS -- which is sqrt(N) memory, i.e. the BSGS memory
      requirement with worse time. That is the sharpest way to state (R2b)'s
      failure: it degenerates into a worse BSGS.
    best_known: >-
      (R1), the canonicalise-then-add negation walk, at 0.886*sqrt(N) fully
      charged with fruitless-cycle handling (KN-TECH-006, KN-TECH-018,
      KN-LIT-042), as implemented in the 117.35-bit record computation
      (KN-LIT-097). Both alternatives priced here are derived to be worse.
    hidden_overhead: >-
      No o(1); no asymptotic claim. Disclosed: the (R2a) state count depends on
      the tag definition; the (R2b) loss depends on DP detection being the
      method, and a different detection method changes it.
    tradeoff_note: >-
      (R2b) is the striking case: it trades the merging property for the
      absence of fruitless cycles, and the trade converts a sqrt(N)-time
      O(1)-memory algorithm into one needing sqrt(N) memory and 2^d sqrt(N)
      time -- strictly dominated by BSGS on both axes. Stating the destination
      of the trade, rather than only its direction, is what makes this a
      closure.

  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES, and this record is unusual in
    that it can state the domination of its OWN proposed constructions
    quantitatively. (R2a) is dominated by (R1) on time by a factor sqrt(r)
    (about 4.47 at r = 20) at equal memory. (R2b) is dominated by BSGS on BOTH
    axes -- BSGS needs sqrt(N) time and sqrt(N) memory, (R2b) needs about
    2^d sqrt(N) time and sqrt(N) memory -- and by parallel rho with DPs at
    0.886*sqrt(N) time and O(1) per-processor memory (KN-TECH-001,
    KN-TECH-006) on both axes as well. Both are also dominated by the
    automorphism-discounted CM variant (KN-TECH-018, KN-LIT-042) where it
    applies, and neither competes with kangaroo / Galbraith-Ruprai
    (KN-LIT-7437) on the interval problem, which is a different problem. On
    data/queries nothing is consumed and nothing is dominated. There is no
    axis on which either proposed construction is undominated.
  sota_delta: >-
    NEGATIVE AND QUANTIFIED for both constructions priced: (R2a) is sqrt(r)
    times worse in time, about 4.47x at the Teske-recommended r = 20; (R2b) is
    about 2^d times worse in time and needs sqrt(N) memory instead of O(1),
    which at the 30-bit DP granularity of the largest completed ECDLP
    computation is a factor 2^30. Zero speedup is claimed and none exists. The
    non-cost delta: 1 exhaustive enumeration of the repairs for a broken
    projection (three sources, one of them a relabelling of another); 1
    quantified obstruction (2^d) where the corpus previously had only the
    qualitative statement that negation walks "require fruitless-cycle
    handling"; and 1 worked application of the lossy-projection test to the
    lane's own central object, which is the artifact
    docs/inventor-protocol.md section 2 asks for and which the corpus does not
    yet contain for the ECDLP.

