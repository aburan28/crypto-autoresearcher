idea:
  id: IDEA-20260807-4cebed
  question_id: RQ-EWALK-8fa147
  added: '2026-08-07'
  title: >-
    THE LOSSY-PROJECTION TEST APPLIED TO THE LANE'S OWN CENTRAL OBJECT, AND IT
    FAILS THE SECOND CLAUSE: the negation class IS the x-coordinate, x-only
    addition is not a function of x alone (it needs x(A-T) to pick between the
    two roots), so the projection is lossy but does NOT propagate -- and the
    two repairs are exhaustively enumerable, with canonicalise-then-add paying
    fruitless cycles and tag-tracing paying either a factor sqrt(r/2) in state
    size or a factor 2^d in lost distinguished-point merges; both branches are
    derived to be strictly worse, which makes this a closure with a QUANTIFIED
    obstruction rather than a fatigue report
  class: representation

  claim: >-
    (A) THE PROJECTION, AND THE FIRST CLAUSE IT PASSES. The negation quotient
    is not merely LIKE the x-coordinate map, it IS it: for A = (x, y) on
    y^2 = x^3 + ax + b, -A = (x, -y), so the map A |-> x(A) has exactly the
    Aut = {+-1} orbits as fibres. It is genuinely lossy -- one bit, the sign of
    y, is destroyed and A is not recoverable from x -- so it is not a change of
    coordinates in the sense of docs/inventor-protocol.md section 2, and it
    passes the first clause of the lossy-projection test cleanly.

    (B) THE SECOND CLAUSE, AND IT FAILS, EXACTLY AND CLASSICALLY. The test's
    second clause asks that what is discarded be discarded COMPATIBLY with the
    target's operations, so the retained part still propagates
    deterministically. It does not. Given x(A) and x(T) alone, x(A + T) is NOT
    determined: x(A+T) and x(A-T) are the two roots of a single quadratic whose
    coefficients depend only on x(A) and x(T), so the pair {x(A+T), x(A-T)} is
    determined and the individual values are not. THAT IS THE WHOLE STRUCTURAL
    CONTENT OF LANE L6 IN ONE SENTENCE, and it is why the lane has a
    fruitless-cycle problem at all: the projection that buys the factor sqrt(2)
    is exactly the projection that breaks determinism, and every device in the
    lane is a repair for that break.

    (C) THE REPAIRS ARE EXHAUSTIVELY ENUMERABLE, WHICH IS WHAT MAKES THIS A
    CLOSURE RATHER THAN A SURVEY. To make an x-only step deterministic one must
    supply the missing bit. There are exactly three sources of it and no
    fourth:
      (R1) SUPPLY IT FROM THE CLASS ITSELF -- canonicalise: lift x to the point
        with the canonical square root y, then add. Deterministic on classes.
        PRICE: the lift needs a square root (or, equivalently, the walk carries
        y and canon compares it), the comparison needs affine normalisation and
        hence an inversion, and the canon step re-injects a sign choice at
        every step, which is precisely the fruitless-cycle mechanism derived in
        IDEA-20260807-6355c6 at rate 1/(|Aut| r). This is the standard method
        and the rest of the lane measures it.
      (R2) SUPPLY IT FROM THE PAST -- tag tracing: carry the pair
        (x(R_t), x(R_t - T_{s_{t-1}})) so the next step is a pure differential
        addition, with no square root, no normalisation for canon, and NO SIGN
        CHOICE, hence NO FRUITLESS CYCLES AT ALL. This is the genuinely
        attractive branch and it is the one this record exists to price.
      (R3) SUPPLY IT FROM THE FUTURE -- choose the branch that makes some
        predicate true (e.g. always take the root with smaller encoding). This
        is a canonicalisation of the OUTPUT rather than the input and is a
        relabelled (R1); it has the same sign re-injection and the same cycle
        structure, and the record says so rather than counting it as a fourth
        option.
    So the enumeration is (R1), (R2), and (R3) = (R1). The lane's whole design
    space at this level is two points.

    (D) (R2) IS PRICED, IN BOTH OF ITS OWN BRANCHES, AND BOTH ARE LOSSES.
      (R2a) DECLARE COLLISIONS ON THE TAGGED STATE. The state is the pair
        (x, tag), and the reachable tagged state is determined by
        (R_t, s_{t-1}), so the state space has about (N/2)*r elements. The
        birthday law then gives expected steps 1.2533*sqrt(N r / 2) against the
        canonicalised walk's 1.2533*sqrt(N/2): a factor sqrt(r) WORSE. At the
        Teske-recommended r = 20 that is sqrt(20) = 4.47x worse, wiping out the
        sqrt(2) = 1.414 the projection bought and much more.
      (R2b) DECLARE COLLISIONS ON THE x-COMPONENT ONLY. The collision RATE is
        then restored -- any two trajectories sharing an x share a group
        relation up to sign, which is usable. But the MERGING PROPERTY IS
        DESTROYED: two trajectories that meet in x with different tags have
        different successors and diverge immediately. Van Oorschot-Wiener
        distinguished-point detection depends entirely on merging: it detects a
        collision because both walks, having merged, deterministically reach
        the SAME next distinguished point (KN-TECH-006). Without merging, a
        crossing is detected only if it occurs AT a stored point. With DP rate
        theta = 2^-d, after T total steps there are about theta*T stored
        points, and a birthday collision among STORED points needs
        theta*T ~ sqrt(N/2), i.e.
          T ~ 2^d * sqrt(N/2),
        a factor 2^d worse than the merging method. At the 30-leading-zero
        granularity used in the largest publicly completed ECDLP computation
        (KN-LIT-097) that factor is 2^30. THE OBSTRUCTION IS NOT MERELY
        QUALITATIVE; IT IS THE DP GRANULARITY ITSELF, WHICH IS THE PARAMETER
        THE WHOLE PARALLEL METHOD IS BUILT AROUND.
      Neither branch is close. (R2) is therefore closed on cost, with the
      obstruction named and quantified, and the closure is derivable at zero
      compute.

    (E) WHY THIS IS WORTH RECORDING RATHER THAN LEFT IMPLICIT. Three reasons,
    each concrete. FIRST, tag tracing is the obvious thing to try -- it removes
    the fruitless-cycle problem entirely, which is the lane's biggest headache,
    and a session that reaches for it without the pricing above would spend a
    batch. SECOND, the pricing localises exactly WHERE the negation quotient's
    cost sits: not in the sqrt(2), which is real and free, but in the repair of
    a broken propagation, and the two available repairs cost fruitless cycles
    or merging respectively. THIRD, it converts the lane's central folklore
    into a statement with a mechanism: "negation walks need fruitless-cycle
    handling" (KN-TECH-018, KN-LIT-042) becomes "the negation projection breaks
    determinism, and cycle handling is the price of the only repair that
    preserves merging."

    (F) THERE IS ALREADY AN AUDITED MEASUREMENT OF THE (R1)-WITHOUT-ESCAPE
    CASE, AND IT AGREES. inputs/h100_session/h041_xonly_walk.json ran exactly
    the (R1) construction with no escape rule -- its stated convention is
    "x_state: x-coordinate; representative = (x, min(y, p-y)); step:
    j = x mod r; P -> canon(P + A_j); state -> x of result" -- and enumerated
    the functional graph. It found 239-293 two-cycles at 16 bits and 383-439 at
    17 bits against a 50-draw random-function band of [0, 2]; largest
    components of 1806-3491 against a random mean of 16366; a useful-collision
    fraction of 0.07 and 0.05; and effective per-solve constants of 2.2988 and
    3.2189, which REVIEW-H100-20260717 correction C8 re-verified as 1.83x and
    2.57x WORSE than the 1.2533 plain-rho theory. Its partner-age histogram
    shows 183/200 and 185/200 collisions at age 2 -- i.e. almost every
    "collision" was the walk meeting its own immediate predecessor, which is
    the fruitless 2-cycle and not a relation. THAT IS THE SIGN RE-INJECTION OF
    (R1) MADE VISIBLE, and it is why this record's derivation and that
    artifact's numbers should be read together.

    (G) WHAT REMAINS OPEN AFTER THIS CLOSURE, NAMED AS THE STANDARD REQUIRES.
    (i) Repairs that supply the missing bit from a source OUTSIDE the walk --
    e.g. a small amount of shared precomputed advice, which changes the model
    to R8/preprocessing and is lane L13's territory, not this one. (ii) Curve
    models where the x-only step IS deterministic: on a Montgomery or Kummer
    model the differential addition is native, so (R2) is not a repair but the
    natural operation -- the state-size and merging prices derived in (D) still
    apply and are model-independent, but the ARITHMETIC price of (R1) changes
    and the comparison should be redone there (lane L11, RQ-MODEL-e61cb2).
    (iii) Interval and multi-target settings, where Galbraith-Ruprai
    (KN-LIT-7437) report that equivalence classes DO help the interval problem
    at a heuristic 1.36*sqrt(N) for groups with fast inversion, and note that
    the standard kangaroo method appears impossible to implement with
    equivalence classes -- a different problem with a different answer, and it
    is the direction a reader of this closure should go next.

  resource_label: >-
    R3 (End(E) as a ring -- the unit {-1}) with R1 present only as the
    x-coordinate encoding. No field structure is used to derive a relation;
    the whole argument is about whether a projection propagates.

  admissibility: inadmissible_generic_group

  admissibility_argument: >-
    INADMISSIBLE, AND THE R1 APPEARANCE IS A RED HERRING THE RECORD DEFUSES
    RATHER THAN LEANS ON. Working with x-coordinates looks like resource R1 --
    "x-coordinates as field elements" -- which is the resource that genuinely
    escapes the generic group model in index calculus. It does not escape here,
    because the x-coordinate is used only as an ENCODING of the negation class
    and never as an input to a polynomial system: no summation polynomial, no
    factor base, no decomposition. What the walk does with x is compare it,
    hash it, and test a predicate on it, all of which the generic group model
    permits on its random labels. The underlying action is the negation
    automorphism applied to points of a prime-order G, which is Oracle D of
    KN-FIND-b7e091, generic-group simulable and closed at exponent 1/2
    (KN-TECH-005, H-ENDO-001). Recording this explicitly matters because
    "x-coordinate walks" is precisely the kind of construction that could be
    mislabelled admissible by a reader scanning for R1.

  discriminated_from:
    - >-
      inputs/h100_session/h041_xonly_walk.json, which MEASURED the (R1)
      construction without an escape rule and reported the functional-graph
      census and effective constants quoted in (F). This record does not
      re-measure that; it supplies the derivation explaining those numbers and
      prices the (R2) alternative that artifact did not try.
    - >-
      IDEA-20260807-6355c6, which derives and measures the fruitless-cycle rate
      of the (R1) repair as |Aut| varies. This record asks the prior question:
      why is there a repair to make at all, and what are the alternatives.
    - >-
      IDEA-20260807-ebcae6, the sqrt(|Aut|) ceiling. That bounds the SPACE
      reduction; this analyses the PROPAGATION failure that makes the space
      reduction expensive. ebcae6's object_first_candidate.propagation block
      states the failure in one sentence and defers the enumeration of repairs
      to this record.
    - >-
      Lane L11 / RQ-MODEL-e61cb2 (curve models). Montgomery and Kummer models
      make differential addition native, which changes the ARITHMETIC price of
      the repairs but not the state-size or merging prices derived here. The
      boundary is drawn in (G)(ii) rather than left ambiguous.
    - >-
      CORR-20260806-2f98f4, which forbids citing "~2.5 percent degenerate
      collisions" or ">500x sqrt(N)" for the EXP-ECTD-001 driver. This record
      cites neither; the numbers it quotes are h041's own, independently
      re-verified by REVIEW-H100-20260717 C8.

  object_first_candidate:
    tracked_object: >-
      THE x-COORDINATE, tracked through the walk -- which is exactly the
      negation class, and which is the lane's central object stripped of
      terminology.
    lossiness: >-
      PASSES CLAUSE ONE. Exactly one bit is destroyed (the sign of y), the
      fibres are the Aut = {+-1} orbits, and A is not recoverable from x(A).
      Contrast the negative example of docs/inventor-protocol.md section 2 --
      tracking (Delta, Pi) = (x + y, xy), which loses nothing because the pair
      is recoverable as roots of a quadratic. Here the situation is precisely
      INVERTED, and the inversion is the point: it is the SUCCESSOR that is a
      pair of roots of a quadratic, not the state. Losing the bit is real;
      recovering the successor is what fails.
    propagation: >-
      FAILS CLAUSE TWO, AND THIS IS THE RECORD'S CONTENT. x(A + T) is not a
      function of (x(A), x(T)): the unordered pair {x(A+T), x(A-T)} is
      determined and the individual values are not. So the projection does not
      propagate deterministically under the target's operation. Determinism is
      recoverable only by supplying the missing bit, and (C) enumerates the
      sources exhaustively as (R1) from the class, (R2) from the past, (R3)
      from the output -- with (R3) = (R1). This is the cheapest kind of finding
      the inventor protocol describes: algebraic, zero compute, and decisive
      about what an experiment would even be measuring.
    survival_score: >-
      The propagation failure survives every change of r, escape rule, size,
      seed and |Aut| -- it is a property of the group law, not of the walk. It
      changes character on curve models with native differential addition
      (Montgomery, Kummer), where (R2) is the natural operation rather than a
      repair; the state-size and merging prices are model-independent and
      survive there too, which is stated in (G)(ii) rather than assumed.

  mechanism: >-
    STAGE 0 (zero compute, and it is most of the deliverable). Write out: the
    quadratic whose roots are {x(A+T), x(A-T)} in the short-Weierstrass model,
    exhibiting the non-determinism explicitly rather than asserting it; the
    three-source enumeration with (R3) = (R1); the (R2a) state-count
    (N/2)*r and its sqrt(r) penalty; and the (R2b) merging-loss derivation
    T ~ 2^d * sqrt(N/2).

    STAGE 1 (minutes, and it is the only compute worth spending). Use the
    enumeration instrument of IDEA-20260807-cbbcfd to MEASURE the merging loss
    directly rather than only deriving it. On a 14-16 bit curve:
      (a) build the tagged walk's functional graph on the state space of pairs
        (x, tag) and confirm its size is about (N/2)*r;
      (b) build the induced relation on the x-component and count, over all
        starting states, how many x-collisions occur between trajectories with
        DIFFERENT tags -- these are the crossings the DP method would miss;
      (c) report the MERGE-FAILURE FRACTION: the share of x-collisions that are
        not followed by a common distinguished point within the trail budget,
        as a function of d.
    PRE-REGISTERED: the merge-failure fraction is close to 1 - 2^-d, i.e.
    almost every crossing is missed, and the detected fraction falls as 2^-d.

    STAGE 2 (minutes). The (R1) comparison arm through the identical
    instrument, where merging is exact by construction: merge-failure fraction
    must be EXACTLY ZERO. That is the known-answer control which shows the
    instrument can tell the two apart.

    STAGE 3 (zero compute). Record the closure at the
    docs/inventor-protocol.md section 4 standard: named obstruction (the
    projection does not propagate; the repairs cost fruitless cycles or
    merging), argument (C)+(D), forward guidance (G).

  novelty_status: adaptation
  novelty_screen:
    method: >-
      grep -ril over ledger/, knowledge/, docs/, inputs/, experiments/,
      analysis/ on 2026-08-07 for "x-only", "x-coordinate walk", "differential
      addition", "Montgomery ladder", "tag", "tag tracing", "merge",
      "merging". Records read in full: inputs/h100_session/h041_xonly_walk.json,
      REVIEW-H100-20260717 C8, KN-TECH-006, KN-TECH-018, KN-LIT-042,
      KN-LIT-097, KN-LIT-7437, RQ-MODEL-e61cb2, CORR-20260806-2f98f4.
    results: >-
      "x-only": the h041 artifact and the orientation note in
      research/pollard-rho-generic/literature.md, which records h041 as "short
      cycles and poor useful-collision fraction for a tested x-only
      construction ... a negative control rather than evidence against every
      x-coordinate representation" -- i.e. the corpus explicitly leaves the
      x-coordinate representation question OPEN, which is the gap this record
      addresses. "tag tracing" / "tag-tracing": ZERO hits in ledger/,
      knowledge/ or docs/; the phrase appears only in
      research/idea_generation_20260727_claude*.md, an ideation scratch file,
      and not as a priced mechanism. "differential addition": ZERO hits. The
      merging-loss factor 2^d appears nowhere.
    verdict: >-
      ADAPTATION. That x-only addition needs a difference is textbook (it is
      why Montgomery ladders carry two points) and nothing about it is claimed
      as new. That distinguished-point detection needs merging is stated in
      KN-TECH-006 and in IDEA-20260806-37eab9 section (B), which uses the same
      property to kill adaptive walks -- this record applies THAT SAME
      ARGUMENT to a different construction and quantifies the loss as 2^d,
      which is the increment. Whether the tagged x-only rho walk has been
      priced in the external literature is UNVERIFIED and Stage 0 must check;
      a prior treatment would make this a replication.

  null_object_control: >-
    MANDATORY. THE MATCHED NULL IS THE (R1) CANONICALISED WALK run through the
    identical enumeration instrument on the identical curve and step table, for
    which merging is exact and the merge-failure fraction is EXACTLY ZERO by
    construction. THE DECAY PARAMETER IS d, THE DISTINGUISHED-POINT
    GRANULARITY: in the tagged (R2b) arm the DETECTED fraction of x-collisions
    must fall as 2^-d, halving with every added bit of d, while in the (R1)
    null it must stay at 1 for every d. A tagged arm whose detected fraction
    does NOT fall with d is not exhibiting the merging loss and the measurement
    is wrong. SECOND NULL: a tagged walk whose tag is a CONSTANT (so the tag
    carries no information and the walk degenerates to (R1)); it must reproduce
    the (R1) arm's merge-failure fraction of zero, which separates "the tag
    breaks merging" from "the tagged code path is buggy".

  assumptions:
    - >-
      Short-Weierstrass affine coordinates, where x-only addition requires the
      difference. On Montgomery or Kummer models differential addition is
      native; the state-size and merging prices are unchanged but the
      arithmetic comparison must be redone (G)(ii).
    - >-
      Van Oorschot-Wiener distinguished-point collision detection is the
      baseline, so merging is required (KN-TECH-006). Under a full seen-set or
      Floyd/Brent single-walk method the merging argument does not apply; those
      methods are not the baseline and are not parallelisable at the same
      efficiency, and h041's own convention used a seen-set, which is why its
      numbers illustrate (R1)'s cycles rather than (R2b)'s merging loss.
    - >-
      The tagged state space has about (N/2)*r reachable elements. This is a
      counting claim that Stage 1(a) VERIFIES by enumeration rather than
      assumes; a materially smaller reachable set would change the (R2a)
      penalty and is exactly what the measurement would catch.
    - >-
      N prime, p > 3, Aut = {+-1} for the base case; the argument is stated at
      |Aut| = 2 and its extension to |Aut| in {4, 6} is noted but not derived
      here.
    - >-
      The generic bound KN-TECH-005 holds; nothing here concerns the exponent.

  proof_search_map:
    bottleneck: >-
      The missing bit: which of the two roots of the quadratic is x(A+T). Every
      construction in the lane is a way of supplying it, and the cost of each
      repair is the cost of its supply. Removing this bottleneck -- an x-only
      step that is deterministic with no extra state and no sign choice --
      would eliminate fruitless cycles entirely and is the thing to look for.
    baseline_embedding:
      parameter_slice: >-
        (R1) with the canonical square root, r branches, no escape rule. That
        is exactly the construction h041 ran, so the baseline is not
        hypothetical: its census numbers at 16 and 17 bits are on record and
        were re-verified by REVIEW-H100-20260717 C8.
      reproduction_check: >-
        Re-running the (R1) arm through this record's instrument must reproduce
        h041's qualitative census on a curve of the same size: 2-cycle counts
        two to three orders of magnitude above a random-function band, largest
        components far below the random mean, and a useful fraction well under
        0.2. Exact numbers will differ (different curve, different table); the
        ORDER OF MAGNITUDE and the sign of every deviation must match, and a
        mismatch means the instrument is not reproducing a known object.
    observation_collision:
      observable: >-
        The x-collision count of a trajectory set.
      distinct_preimage_search: >-
        THE DANGEROUS COLLISION IS THE POINT OF THE RECORD: the (R1) walk and
        the (R2b) walk have the SAME x-collision count -- both collide in x at
        the birthday rate on N/2 states -- and radically different DETECTED
        collision counts, differing by 2^d. So x-collision count alone does NOT
        identify a usable algorithm, and a measurement reporting it would rank
        the two as equivalent. The separating observable is the DETECTED
        collision count under a DP predicate, and it is the required metric for
        exactly this reason. This is a clean instance of an observation
        collision that a naive experiment would have walked into.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the x-collision count fixed, vary the forgotten structure (the
          tag), and find the intrinsic invariant distinguishing the results:
          the merge-failure fraction. It is computable, it separates the two
          constructions completely, and it is zero for one and near one for the
          other.
        predicted_gain: >-
          Turns an equivalence that a naive metric would report into a factor
          2^d separation with a named cause.
      - transform: stronger_invariant
        proposed_object: >-
          Track (x, tag) rather than x, preserving more state than the goal
          requires -- which is exactly the (R2) construction. The transform is
          APPLIED here and then PRICED, and the price is the finding: the
          stronger invariant is what survives the step, and it is also what
          destroys the merging.
        predicted_gain: >-
          Negative, quantified: sqrt(r) in state size or 2^d in detection. A
          transform that is enumerated, applied, and found to cost is a
          completed audit, not a gap.
    quantifier_order: >-
      CLAIMED: FOR ALL short-Weierstrass E/F_p with p > 3 and FOR ALL step
      tables, THERE IS NO function g with x(A + T_s) = g(x(A), s) for all A --
      i.e. the non-determinism is universal, not instance-specific. And: FOR
      ALL distinguished-point granularities d, the (R2b) construction's
      detected-collision rate is about 2^-d times the (R1) construction's.
      NOT CLAIMED: that no repair exists outside the three enumerated sources.
      The enumeration is over sources of the missing bit given the walk's own
      state and history; advice supplied from outside the walk is a different
      model (R8, lane L13) and is named in the forward guidance rather than
      closed.
    method_ceiling:
      strongest_certifiable_claim: >-
        "In the short-Weierstrass model with distinguished-point collision
        detection, the x-only projection does not propagate, and the two
        available repairs cost fruitless cycles (R1) or a factor sqrt(r) in
        state / 2^d in detection (R2)." It can NEVER certify anything about
        Montgomery or Kummer models' arithmetic, about non-DP collision
        detection, about preprocessing models, or about the interval problem.
      nearby_object_control: >-
        THE MONTGOMERY MODEL, where differential addition is native and the
        very same tagged walk is the natural formulation rather than a repair.
        The method must NOT conclude that the tagged walk is bad there for
        arithmetic reasons -- only that its state-size and merging prices are
        unchanged. A version of this argument that "proved" x-only walks
        useless on Montgomery curves would be proving something the ladder
        literature contradicts, and that is the check.
    proof_obligations:
      - claim: >-
          {x(A+T), x(A-T)} are the roots of a quadratic in x determined by
          x(A) and x(T); the individual values are not.
        responsibility: correctness
      - claim: The three sources of the missing bit are exhaustive, with R3 = R1.
        responsibility: feasibility
      - claim: The tagged reachable state space has about (N/2)*r elements.
        responsibility: size
      - claim: >-
          Without merging, DP detection needs T ~ 2^d sqrt(N/2).
        responsibility: runtime
      - claim: The (R1) arm has merge-failure fraction exactly zero.
        responsibility: baseline
      - claim: >-
          The instrument reproduces h041's census qualitatively on the (R1) arm.
        responsibility: baseline
      - claim: No exponent claim is made; the exponent is 1/2 throughout.
        responsibility: scope

  predictions:
    - metric: reachable tagged state-space size
      direction: higher
      minimum_effect: >-
        About (N/2)*r, within a factor 1.5, measured by enumeration. A
        materially smaller value refutes the (R2a) penalty and would be the
        interesting outcome, since it would mean the tag is far more redundant
        than the counting suggests.
    - metric: merge-failure fraction of the tagged walk
      direction: higher
      minimum_effect: >-
        Close to 1 - 2^-d, and rising toward 1 as d grows. The (R1) arm must
        show EXACTLY 0 at every d.
    - metric: detected-collision count of the tagged walk under a DP predicate
      direction: lower
      minimum_effect: >-
        About 2^-d times the (R1) arm's, halving with every added bit of d. A
        detected fraction that does not fall with d means the merging loss is
        not being exhibited and the measurement is void.
    - metric: >-
        (R1) arm's functional-graph census against a random-function band
      direction: different
      minimum_effect: >-
        2-cycle count two or more orders of magnitude above the band, and
        largest component well below the random mean -- reproducing h041's
        qualitative signature. Failure to reproduce a known object means the
        instrument is not measuring what h041 measured, and no new conclusion
        may be drawn.
    - metric: constant-tag degenerate control's merge-failure fraction
      direction: different
      minimum_effect: >-
        Exactly 0, matching the (R1) arm. Anything else is a code defect in the
        tagged path rather than a property of tagging.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, the bulk of the deliverable): the quadratic, the
      three-source enumeration, the two price derivations, the forward
      guidance. This alone meets the closure standard and costs nothing.
      STAGE 1 (minutes): enumerate the tagged state space and the merge-failure
      fraction on one 14-bit curve at d in {2, 4, 6, 8}, with the (R1) arm and
      the constant-tag control on the identical instrument.
      STAGE 2 (minutes): reproduce h041's (R1) census signature qualitatively.
      THE CHEAPEST DECISIVE CELL IS STAGE 1 AT d = 2 AND d = 8: if the detected
      fraction does not fall by about a factor 64 between them, the merging
      loss is not being measured and the derivation stands unillustrated --
      which is acceptable, since the derivation does not depend on the
      measurement, but it must then be reported as underdetermined rather than
      as confirmed.
    controls:
      - (R1) canonicalised arm, merge-failure fraction exactly 0 (blocking)
