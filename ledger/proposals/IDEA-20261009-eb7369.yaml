idea:
  id: IDEA-20261009-eb7369
  question_id: RQ-QLWE-9108dc
  added: '2026-10-09'
  status: proposed
  approved_by: null
  title: >-
    Cyclotomic plus-class-number boundary census: where the classical-only
    ideal chain applies
  class: measurement
  claim: >-
    For every prime-power conductor m with phi(m) <= 100 (frozen list, at
    most 30 fields), the plus-part class number h+ of the maximal real
    subfield is computed exactly and tabulated against sqrt(m); the census
    delivers (a) the exact set {m : h+ <= sqrt(m)} — the region where the
    corpus-reported classical-only variant of the ideal chain applies — and
    (b) the fitted growth exponent of log h+ against log m with its 95%
    interval over the frozen list. The prediction to falsify: the boundary
    holds on a proper nonempty subset of prime-power conductors (a real
    boundary exists for the 'mild restriction' recorded in KN-LIT-4775),
    or holds everywhere tested (broad availability); either branch is the
    durable map. No deployed parameter set is touched; no quantum claim is
    made or weakened.
  mechanism: >-
    The object is h+(Q(zeta_m)^+) as a function of prime-power conductor
    m. KN-LIT-4775 reports that explicit Stickelberger generators remove
    almost all quantum steps from the CDW-style chain under the
    restriction h+ <= O(sqrt(m)); nothing in the corpus measures where
    that restriction holds, so the classical-only variant's applicability
    is an unexamined hypothesis inside a cited result. The census converts
    it into a committed boundary table: exact class numbers per real
    subfield (Sage/PARI, seconds per field at these conductors), the
    ratio r = h+/sqrt(m) per conductor, and a fitted growth law for log h+
    in m with its interval. Lossy projection: the table forgets every
    other field property and retains one scalar per conductor — an
    applicability that tracks r uses exactly the plus-class structure, and
    the boundary is where it stops. The null is the Brauer-Siegel-shaped
    generic model: log h+ of random totally real fields of matched degree
    and discriminant band, simulated rather than formula-only; the nearby
    control is a non-cyclotomic totally real family of matched degree
    scored by the same columns.
  novelty_status: unverified
  citations:
    - ref: KN-LIT-4775
      provenance: kb
      claim: >-
        Explicit Stickelberger generators remove almost all quantum steps in
        the CDW algorithm under the restriction h+ <= O(sqrt(m)); the
        restriction's actual boundary was not measured there.
      verified_by: knowledge/literature/KN-LIT-4775.md
    - ref: KN-TECH-046
      provenance: internal
      claim: >-
        The ideal chain's quantum step is the class-group computation;
        removing it leaves the classical chain whose applicability this
        census's boundary conditions.
      verified_by: knowledge/techniques/KN-TECH-046.md
    - ref: KN-LIT-117
      provenance: kb
      claim: >-
        The quantum class-group step is polynomial-time under GRH in
        arbitrary degree; the census prices the alternative route's
        applicability, not the quantum step's cost.
      verified_by: knowledge/literature/KN-LIT-117.md
  assumptions:
    - >-
      Sage/PARI computes real-subfield class numbers exactly for every
      conductor in the frozen list within hours; a field that does not
      finish is recorded not-computed (infrastructure), never as a zero.
    - >-
      The sqrt(m) scale is read in the conductor m as recorded; if the
      source means a different normalisation, the table's stored columns
      (h+, m, phi(m), discriminant) let any reading be re-derived without
      re-running, and the discrepancy is recorded.
  predictions:
    - metric: boundary_membership
      direction: different
      minimum_effect: >-
        The set {m : h+ <= sqrt(m)} is a proper nonempty subset of the
        frozen list, or all of it, or empty; each branch is
        pre-registered and any one is a deliverable.
    - metric: growth_exponent
      direction: different
      minimum_effect: >-
        The fitted exponent of log h+ against log m with its 95% interval
        and residual structure, whatever the value.
    - metric: generic_model_separation
      direction: different
      minimum_effect: >-
        Cyclotomic-plus log h+ sits measurably below the simulated
        Brauer-Siegel prediction on at least half the list
        (structure-specific smallness), or tracks it within the interval
        (no separation).
  minimal_test:
    design: >-
      (1) Freeze the conductor list (every prime-power m with phi(m) <=
      100, ascending, cap 30); commit it before any computation. (2) Per
      m: compute K+ = maximal real subfield of Q(zeta_m), h+(K+), phi(m),
      disc(K+); store the row. (3) Compute r = h+/sqrt(m); the boundary
      set is {m : r <= 1}. (4) Fit log h+ against log m and log|disc| with
      intervals. (5) Null: simulated matched-degree random totally real
      fields, tabulated. (6) Nearby control: a matched-degree
      non-cyclotomic totally real family, same columns.
    controls:
      - Simulated random totally real fields of matched degree and
        discriminant band (the generic null).
      - Non-cyclotomic totally real family of matched degree.
      - One conductor recomputed by a second exact method (quadratic-form
        enumeration where applicable) as an arithmetic cross-check.
    required_metrics:
      - per-conductor h+, m, phi(m), disc(K+), r = h+/sqrt(m)
      - the boundary set and its complement
      - fitted exponents with intervals and residuals
      - the generic-model prediction per row and the separation reading
  falsification_conditions:
    - >-
      The arithmetic cross-check disagrees on any conductor: the table is
      wrong and every derived reading is blocked.
    - >-
      The nearby control tracks the cyclotomic rows within intervals: the
      smallness reading is generic totally-real behaviour and the
      separation claim fails.
    - >-
      A corrected normalisation from the primary text makes the boundary
      empty everywhere: the restriction is vacuous as read, recorded as a
      scope correction to the corpus entry.
  confounders:
    - >-
      h+ grows fast; the phi(m) <= 100 cap keeps it feasible, and the
      fitted law is stated with its truncated-range uncertainty, not
      silently extrapolated.
    - >-
      The Brauer-Siegel model is asymptotic; at these degrees the null is
      simulated at matched degree, not asserted from a bare formula.
    - Prime-power scope only; conductors with multiple prime factors stay
      explicitly open.
  interpretation_limits:
    - Toy-to-mid conductors (phi(m) <= 100); no transfer to any deployed
      parameter set or statement about ML-KEM, ML-DSA, Falcon, Hawk,
      NTRU, FrodoKEM.
    - The census prices applicability of a classical variant; it does not
      weaken, verify or dispute the quantum step's correctness.
    - The fitted law describes the frozen list, not a theorem about all
      conductors.
  proof_search_map:
    bottleneck: >-
      The unexamined h+ <= sqrt(m) restriction inside a cited corpus
      result; measuring its boundary converts an assumed-mild condition
      into a committed applicability map for the classical-only chain.
    baseline_embedding:
      parameter_slice: >-
        The smallest conductor reproduces the textbook case h+ = 1 (the
        sanity anchor both exact methods must agree on); the generic null
        reproduces the Brauer-Siegel prediction at matched parameters.
      reproduction_check: >-
        The arithmetic cross-check agrees exactly on the sanity conductor
        before the table is read.
    observation_collision:
      observable: the ratio r = h+/sqrt(m) per conductor.
      distinct_preimage_search: >-
        Non-cyclotomic totally real fields of matched degree and
        discriminant band carry the same columns: if their r-profile
        matches the cyclotomic one, the observable is generic class-number
        behaviour, not plus-class structure.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: >-
          The classical-only chain's applicability region as a committed
          boundary table over prime-power conductors.
        predicted_gain: >-
          The exact boundary set and fitted growth law, turning a reported
          'mild restriction' into a measured map that decides which future
          toy experiments may skip the quantum step.
    quantifier_order: >-
      For every conductor in the frozen list (exists exact computation)
      the row is measured; the boundary statement is 'for all tested
      prime-power conductors', never all conductors; the fitted law
      carries its interval.
    method_ceiling:
      strongest_certifiable_claim: >-
        The exact boundary set and fitted growth law on the frozen list,
        with the generic-model separation read against a simulated null; no
        claim about conductors outside the list or any deployed system.
      nearby_object_control: >-
        Matched-degree non-cyclotomic totally real fields; without their
        separation the plus-class reading is unproven.
    proof_obligations:
      - claim: the sanity conductor agrees across methods
        responsibility: baseline
      - claim: every h+ is exact with method recorded per row
        responsibility: correctness
      - claim: the conductor list is frozen before computation
        responsibility: scope
      - claim: the fitted law carries interval and residuals
        responsibility: size
      - claim: the null is simulated at matched degree, not formula-only
        responsibility: interface
  heuristic_assumptions:
    - id: H1
      statement: >-
        The sqrt(m) normalisation read from KN-LIT-4775 is the intended
        scale of the restriction.
      rigorous_support: >-
        The corpus entry's own phrasing as parsed there; not re-derived
        from the primary text.
      validation_plan: >-
        A successor reading experiment over the primary PDF can fix the
        normalisation; the stored columns make that a recomputation, not a
        re-run.
    - id: H2
      statement: >-
        Brauer-Siegel-type growth for random totally real fields of
        matched degree and discriminant is the correct generic null model.
      rigorous_support: >-
        Classical analytic number theory (Brauer-Siegel theorem, reported;
        constants asymptotic).
      validation_plan: >-
        The null is simulated by sampling matched-degree random totally real
        fields and computing their class numbers, measuring the model's
        finite-range behaviour rather than asserting it.
  target_complexity:
    time_exponent: >-
      No exponent claimed. Exact class-number computation is
      subexponential in the discriminant, seconds-to-minutes per conductor
      on the frozen list.
    memory_exponent: negligible.
    best_known: >-
      The corpus-reported restriction itself (KN-LIT-4775); the census is
      the first measurement of its boundary. No attack or quantum claim is
      improved.
    hidden_overhead: >-
      The phi(m) <= 100 cap truncates the fitted law's range; the
      interval is reported with the truncation stated.
    tradeoff_note: none proposed.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  prior_art:
    frontier_map: not_applicable
    not_applicable_reason: >-
      Not an ECDLP question; no ECDLP known-results row covers cyclotomic
      class-number growth.
    nearest:
      - ref: KN-LIT-4775
        provenance: kb
        relation: same
        delta: >-
          The source reports the restriction as mild and unmeasured; this
          census delivers the exact boundary set, the fitted growth law
          with interval, and the generic-model separation.
      - ref: KN-LIT-117
        provenance: kb
        relation: adjacent
        delta: >-
          The quantum class-group step applies everywhere under GRH; this
          maps where it is unnecessary, pricing the classical alternative's
          applicability without touching the quantum claim.
      - ref: KN-LIT-115
        provenance: kb
        relation: orthogonal
        delta: >-
          Log-unit decodability is a different structural ingredient; not
          re-examined here.
  dominated_by: >-
    Baseline named: the corpus-reported restriction itself (KN-LIT-4775)
    and the exact quantum class-group step (KN-LIT-117) which applies
    regardless; the census beats neither and is a measurement, not an
    attack.
  sota_delta: >-
    Not an attack claim. Separator: the exact boundary set {m : h+ <=
    sqrt(m)} over the frozen prime-power list, the fitted log h+ growth
    exponent with its 95% interval, and the generic-model separation —
    the first measured applicability map for the classical-only chain
    variant.
