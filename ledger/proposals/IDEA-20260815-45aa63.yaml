idea:
  id: IDEA-20260815-45aa63
  question_id: RQ-SSIQ-9702af
  added: '2026-08-15'
  title: >-
    THE p^(1/3) RESULT IS THIS PROGRAM'S CANONICAL EXEMPLAR AND ITS OWN
    CONCRETE-COST TABLE FLAGS OPTIMISTIC ASSUMPTIONS: recompute the table
    with each flagged optimism removed in turn
  class: control

  claim: >-
    The source paper states plainly that its concrete estimates make
    optimistic assumptions and should not be read as predictions, and names
    both directions of error. This program uses that table as an exemplar
    and cites its numbers. Recomputing with each named optimism removed
    shows how much of the table survives its own caveats, which is what an
    exemplar should be able to withstand.

  mechanism: >-
    Extract each optimism the paper flags: one field operation per table
    entry as a conservative underestimate, the possibly overestimated
    inverse success probability, and the superpolynomial hidden overhead.
    Recompute the table with each removed in turn and with all removed.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of the paper's section 4.1 and its flagged-optimism
      disclosures; grep 'concrete cost table', 'optimistic', 'hidden
      overhead'.
    results: >-
      The table and its caveats are recorded; no record recomputes it with
      the caveats applied.
    verdict: >-
      ADAPTATION. The caveats are the paper's own; the contribution is
      applying them arithmetically rather than quoting them alongside
      unadjusted numbers.

  object_first_candidate:
    tracked_object: >-
      THE CONCRETE-COST TABLE as a function of which flagged optimism is
      applied.
    lossiness: >-
      Quoting the table without its caveats projects away exactly what the
      paper says it should not be read without.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives as symbolic recomputation; the hidden superpolynomial
      overhead has no stated form, which bounds how far it can be applied.

  null_object_control: >-
    NULL 1 -- all optimisms retained, which must reproduce the published
    table exactly. NULL 2 -- the previous-methods column, which must be
    unaffected since the caveats apply to the new algorithm's estimates
    only.

  discriminated_from:
    - >-
        The exponent-factor ranking record in this series, which asks
        which factor binds asymptotically; this concerns the concrete
        table.
    - >-
        The memory-charged crossover record in this series, which compares
        against Delfs-Galbraith; that comparison should consume this
        record's adjusted numbers rather than the unadjusted ones.

  assumptions:
    - >-
        Each flagged optimism is quantifiable, which holds for the
        operation-count assumption but NOT for the superpolynomial
        overhead, whose form the paper does not state.
    - >-
        The previous-methods column is computed independently of the
        caveats, which the paper's presentation implies but does not state
        explicitly.

  predictions:
    - metric: >-
        all-optimisms-retained reproduction
      direction: different
      minimum_effect: >-
        FORCED to reproduce the published table exactly; failure means
        the recomputation is wrong.
    - metric: >-
        previous-methods column
      direction: different
      minimum_effect: >-
        FORCED unaffected by the caveats.
    - metric: >-
        table with each optimism removed in turn
      direction: higher
      minimum_effect: >-
        The measurement; the security margins shrink and the question is
        by how much.
    - metric: >-
        the superpolynomial overhead
      direction: different
      minimum_effect: >-
        Reported as unquantifiable rather than assigned a value, since
        the paper does not state its form.

  minimal_test:
    design: >-
      Symbolic recomputation at the standardized parameter sets, both
      nulls first.
    controls:
      - >-
          All-optimisms-retained reproduction.
      - >-
          Previous-methods column invariance.
      - >-
          The unquantifiable overhead reported as such, never assigned a
          plausible value.
      - >-
          Each optimism applied separately before any combined figure.
    required_metrics:
      - >-
          Recomputed table per optimism removed and with all removed.
      - >-
          Change in the reported margin at each standardized parameter
          set.
      - >-
          Explicit statement of which caveats could not be quantified.

  falsification_conditions:
    - >-
        The reproduction fails. Recomputation wrong; halt.
    - >-
        The previous-methods column moves. The caveats are being
        misapplied to both sides.
    - >-
        The adjusted table changes the security picture materially. Every
        citation of the unadjusted table in this program needs revisiting,
        which is the record's payoff.
    - >-
        The adjustments are small. The table is robust to its own caveats
        and can be cited more confidently, which is also worth
        establishing.

  confounders:
    - >-
        UNQUANTIFIABLE OVERHEAD: the paper discloses a superpolynomial
        hidden term without stating its form, so any numeric treatment of
        it would be fabrication and it must stay qualitative.
    - >-
        ONE-SIDED APPLICATION: the paper names errors in both directions,
        and applying only the pessimistic ones would be as misleading as
        applying none.

  interpretation_limits:
    - >-
        Recomputes a published table under its own stated caveats;
        produces no new estimate and no new algorithm.
    - >-
        Scoped to the quantifiable caveats; the hidden overhead remains
        qualitative.
    - >-
        Adjusted figures inherit every other assumption of the source.

  heuristic_assumptions:
    - id: HEUR-SSIQ-TAB-1
      statement: >-
        The optimisms the paper flags are separable and can be removed
        one at a time from its cost table.
      rigorous_support: >-
        Rigorous ingredient: the table is built from a stated cost model
        whose terms the paper identifies individually, so the arithmetic
        is separable. THE GAP: the paper names errors in BOTH directions
        -- the table cost underestimated and the inverse success
        probability possibly overestimated -- so removing only the
        optimistic ones produces a one-sided adjustment that is not the
        paper's own position and must be reported alongside the balanced
        version.
      falsification_condition: >-
        An adjustment that cannot be applied without also changing a
        term the paper says errs the other way.
      validation_plan: >-
        SAMPLE: all standardized parameter sets, each optimism
        separately and combined. TAIL CHECK: the parameter set where
        adjustments matter most. TRANSFER: none; the recomputation binds
        the source's model.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Symbolic; no compute.
    memory_exponent: >-
      Negligible.
    best_known: >-
      The incumbent is the published table itself, which this record
      recomputes under the paper's own caveats rather than improving.
    hidden_overhead: >-
      The superpolynomial hidden overhead is disclosed without a form and
      is the largest term that cannot be applied at all.
    tradeoff_note: >-
      Applying the caveats gives a more honest table and a less quotable
      one; the paper's own position is that the unadjusted numbers are not
      predictions.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As a cost estimate: entirely dominated by
    the published table, which is the source. As a caveat-applied
    recomputation: none exists here. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: the exemplar's concrete-cost
    table recomputed with each of its own flagged optimisms removed in turn,
    with the errors the paper names in both directions applied symmetrically
    and the unquantifiable superpolynomial overhead reported as such rather
    than estimated.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.9 that the published table reproduces from the stated model. 0.85 that
    the quantifiable optimisms are separable. 0.4 that the adjusted figures
    change the security picture enough to require revisiting how this
    program cites the exemplar.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
