  goal_id: GOAL-P13-001
  title: Heuristic 1 restated as a smoothness-graded equidistribution statement for CM points
    of discriminant -4pd, which names an actual theorem family (Duke / Michel subconvexity)
    as the proof route and localises the whole difficulty in one explicit range gap, |D| ~
    p^{4/3} versus the p^{2+eps} where equidistribution is known.
  class: mechanism
  claim: 'A trace-zero element alpha of the two-sided ideal P with Nrd(alpha) = pd satisfies
    alpha^2 = -pd, so Z[alpha] is an order of discriminant -4pd embedded in End(E). CONSEQUENTLY:
    "delta_E <= T" is EXACTLY the statement that E lies in the image, under supersingular
    reduction at p, of the set of CM points of discriminant -4pd for some d <= T. Heuristic
    1 is therefore equivalent to a joint statement about how those CM point sets distribute
    over the ~p/12 supersingular points as d ranges over the B-SMOOTH integers below T. CLAIM:
    this reformulation is strictly more tractable than the random-integer model, because equidistribution
    of CM/Heegner points in the supersingular locus is a studied problem with a proof technique
    (subconvexity for the relevant Rankin-Selberg L-functions) rather than an open problem
    with no technique -- and the ONLY obstruction to importing it is a RANGE gap that can
    be stated in one line: the discriminants in play are |D| = 4pd with d <= p^{1/3}, i.e.
    |D| ~ p^{4/3}, whereas the equidistribution statements I can recall require |D| large
    compared to a fixed power of p (recollection: |D| >= p^{2+eps}), which p^{4/3} does not
    satisfy. THE DELIVERABLE IS THE GAP, NOT A PROOF. Two possible outcomes are pre-defined:
    (A) the range condition is as recalled, in which case Heuristic 1 is provably out of reach
    of current equidistribution technology and the honest status of the p^{1/3+o(1)} tier
    is "conditional on a statement strictly stronger than an open equidistribution problem"
    -- a materially stronger caveat than "unproven heuristic"; (B) the range condition is
    weaker than recalled, or an averaged-over-d version is available (averaging is exactly
    what Heuristic 1 needs, since it sums over d <= T), in which case a conditional proof
    of a WEAKENED Heuristic 1 becomes a concrete target and the p^{1/3+o(1)} tier''s conditionality
    can be reduced to GRH plus subconvexity.'
  mechanism: 'STEP 1, ALGEBRA (checkable in two lines). alpha in B_{p,infty} with Trd(alpha)
    = 0 satisfies alpha^2 = -Nrd(alpha). With alpha = phi-hat-Frobenius composed with phi
    and Nrd(alpha) = p deg(phi), we get alpha^2 = -p deg(phi). So Z[alpha] is the order of
    discriminant -4p deg(phi) inside Q(sqrt(-p deg phi)), and it embeds in End(E). STEP 2,
    GLOBAL COUNT (already in this corpus). Eichler''s optimal-embedding formula gives sum
    over E of the weighted embedding numbers as h(-4pd) times a local factor which is 1 at
    p because p ramifies. This reproduces the count c T^{3/2}/sqrt(p) of HA-1 by sum_{d <=
    T} h(-4pd)/(p/12) ~ sum_{d<=T} sqrt(pd)/p ~ T^{3/2}/sqrt(p). The corpus already has this
    as Route (b); the record consumes it. STEP 3, THE DISTRIBUTIONAL STATEMENT. What Heuristic
    1 needs is not the total but the SPREAD: that no supersingular point is systematically
    avoided by the union over B-smooth d <= T of the discriminant--4pd CM sets. That is an
    equidistribution statement, and equidistribution of CM points in the supersingular locus
    at a fixed p, as |D| grows, is the object of the Duke/Michel circle of results. STEP 4,
    THE GAP. Our |D| grows only as p^{4/3} while p also grows; the two limits are coupled,
    which is the hard "level aspect coupled to discriminant aspect" regime. Naming this coupling
    is the record''s contribution: the corpus currently records Route (a) (random lattices)
    as "intractable" and Route (d) (CEP for deterministic sequences) as "no known path", and
    does not record this route at all.'
  why_not_a_renamed_known_approach: 'Nearest prior art in this corpus is Route (b) of research/P13-HEUR-001,
    which is a FIRST-MOMENT trace-formula route. A first moment says how many (E, alpha) pairs
    exist in total; it says nothing about whether they pile up on few curves. That per-curve
    spread is precisely what Heuristic 1 asserts and precisely what equidistribution supplies.
    The two routes are complementary: Route (b) gives the mean, this route would give the
    spread, and Heuristic 1 needs both.'
  predictions:
  - observable: The identity alpha^2 = -p deg(phi) checked symbolically and then numerically
      on the corpus's own toy quaternion arm.
    metric: exact equality on every sampled trace-zero short vector
    predicted: Exact, with zero exceptions. Any exception means the trace-zero identification
      of the governing lattice is wrong and the corpus's D1 derivation falls with it.
  - observable: 'Per-curve CM-multiplicity histogram: for fixed d, the number of supersingular
      E admitting an optimal embedding of disc -4pd, versus the Poisson prediction with mean
      12 h(-4pd)/p.'
    metric: chi-squared of the observed multiplicity histogram against Poisson
    predicted: Consistent with Poisson at toy p. A systematic EXCESS of zeros (more curves
      missed than Poisson predicts) is the failure mode that would break Heuristic 1, and
      it is exactly what a failure of equidistribution would look like.
  - observable: The recalled range condition, checked against the primary sources once network
      access exists.
    metric: the exponent kappa in the condition |D| >= p^{kappa+eps}
    predicted: kappa = 2 (recollection, UNVERIFIED). The record's two branches (A) and (B)
      are defined by whether kappa > 4/3 or kappa <= 4/3, so the whole record is decided by
      one bibliographic fact.
  minimal_test: 'STAGE A, zero compute, one afternoon: write STEP 1 and STEP 2 out and check
    STEP 2 numerically at three toy primes against exhaustive enumeration of optimal embeddings.
    STAGE B, zero compute, blocked on network: retrieve the equidistribution statements and
    record kappa. This is a BIBLIOGRAPHIC TASK and it is the deciding one; it costs no compute
    and this program has an explicit standing complaint that such tasks keep being deferred
    (GOAL-P13-001 next_action item 3, "named as necessary in THREE consecutive red-team reports
    and executed in none"). STAGE C, toy: the multiplicity histogram at p <= 10^4 with the
    Poisson null.'
  controls:
  - 'POSITIVE CONTROL for the histogram instrument: d = 1. The curves with delta_E = 1 are
    exactly those with j in F_p, a set of known size ~p^{1/2} computable independently by
    root-finding on j^p - j. The instrument must return that set exactly. This control can
    fail and is not tautological.'
  - 'NULL: the same histogram for a random subset of the supersingular set of the same size.
    The signal is the excess over that null.'
  - 'NEARBY-OBJECT CONTROL: repeat for discriminants -4qd with q a small auxiliary prime rather
    than p. The CM sets then have nothing to do with the two-sided ideal, and any instrument
    that reports the same structure there is measuring lattice size and not the Frobenius
    structure.'
  confounders:
  - Weighting. Curves with extra automorphisms (j = 0, 1728) carry weights 1/|Aut| in every
    class-number identity and weight 1 under uniform-over- curves sampling. At toy p these
    are a non-negligible fraction and will distort a chi-squared. The convention must be fixed
    before the run.
  - p ramifies in every Q(sqrt(-pd)), so the local factor at p is degenerate and any statement
    borrowed from the non-ramified CM literature may not transfer. This is a real risk to
    the whole reformulation and is named rather than hidden.
  - '"Recollection" is doing load-bearing work in the range condition. I could not verify
    it this session and the record''s headline branch depends on it.'
  falsification_conditions:
  - The identity alpha^2 = -p deg(phi) fails on any sampled vector.
  - The bibliographic stage finds that the relevant equidistribution results are stated only
    for FUNDAMENTAL discriminants or only for discriminants coprime to the level p, in which
    case -4pd is excluded by hypothesis and the route is closed as stated (though possibly
    repairable by passing to the Eichler-order/level structure).
  - The toy multiplicity histogram shows a systematic excess of zero-classes growing with
    p. Heuristic 1 is then weakened in tested toy scope, which is a scoped negative and must
    be reported as toy (AGENTS.md rule 7).
  interpretation_limits: NO PROOF IS CLAIMED AND NONE IS NEAR. The realistic best outcome
    is a sharper statement of what Heuristic 1 is equivalent to, plus a named external theorem
    family and an explicit range gap -- i.e. exactly what GOAL-P13-001's completion objective
