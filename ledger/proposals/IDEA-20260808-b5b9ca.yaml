  assumptions:
  - Eichler's optimal-embedding formula as relayed by research/P13-HEUR-001.
  - That supersingular reduction of CM points is the right dictionary here. The record states
    this as the object being checked at STAGE A, not as a granted fact.
  heuristic_assumptions:
  - id: HA-4
    statement: SMOOTHNESS-GRADED EQUIDISTRIBUTION. For every supersingular E/F_{p^2} and every
      T in the stated range, the number of B-smooth d <= T for which E admits an optimal embedding
      of the order of discriminant -4pd is (1 + o(1)) times its average over E, uniformly,
      where the average is sum_{d <= T, d B-smooth} 12 h(-4pd)/p.
    rigorous_ingredient: The class-number totals themselves (Dirichlet class number formula,
      Siegel's lower bound), which are unconditional up to the ineffective constant, and the
      Eichler embedding formula for the total.
    distribution_imitated: Duke's equidistribution theorem for Heegner points and its supersingular
      / level-aspect descendants (Michel), i.e. the classical statement that CM points of
      large discriminant equidistribute.
    validation_route: 'TOY ONLY at the sizes where all optimal embeddings can be enumerated
      (p <= 10^4 via the corpus''s pure-Python quaternion arm; labelled TOY). The crypto-scale
      validation route runs the other way: the Deuring sampler produces delta_E for random
      E, and the induced empirical distribution of the SMALLEST d with an embedding is compared
      against the equidistribution-implied prediction 1 - exp(-sum_{d<=T} 12h(-4pd)/p). That
      comparison IS crypto scale and needs no new sampler.'
    tail_checks: The predicted Pr[delta_E = 1] = (#{j in F_p supersingular})/(p/12) ~ 12 p^{-1/2},
      a forced value checkable exactly, and the two published smoothest-sample tail facts
      at lines 250 and 252.
