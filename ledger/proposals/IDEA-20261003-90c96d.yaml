# IDEA-20261003-90c96d
# Model-degree count. Proposal only. Not approved.
idea:
  id: IDEA-20261003-90c96d
  question_id: RQ-ECDLP-623a32
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    An Edwards equation has degree 4 and a Weierstrass equation has degree 3
  class: representation
  claim: >-
    An Edwards equation has degree 4. A short-Weierstrass equation
    has degree 3. Four exceeds three by 1. The product of the two
    degrees is 12. Their sum is 7. The gap is an equation degree,
    not an ECDLP exponent and not a point count.
  mechanism: >-
    OBJECT FRAME. The object is the curve equation. The operation
    set is the group law written on that equation. Changing the
    model changes the equation degree and does not by itself change
    the group order. Two Weierstrass equations both have degree 3,
    so that gap is 0. No point is counted.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-623a32
      provenance: internal
      claim: >-
        The question asks which representations change a charged cost.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-IC-73db3f
      provenance: internal
      claim: >-
        Factor-base dimension is a different lever from an equation degree.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The two degrees are frozen before the subtraction.
    - No point is counted.
  proof_search_map:
    bottleneck: The degree gap 1.
    baseline_embedding:
      parameter_slice: The degrees 4 and 3.
      reproduction_check: >-
        Two readers subtract and must agree that 4 exceeds 3 by 1.
    observation_collision:
      observable: The degree gap and the product.
      distinct_preimage_search: >-
        Reporting both equations as degree 3 drops the gap. Two
        Weierstrass equations make that gap 0.
    constructive_transforms:
