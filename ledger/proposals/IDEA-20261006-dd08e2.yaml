idea:
  id: IDEA-20261006-dd08e2
  title: >-
    The order-4 automorphism hits the smaller square root of -1 on the
    lex-first point, for at least four primes
  class: measurement
  claim: >-
    For each prime p with 29 ≤ p ≤ 97 and p ≡ 1 (mod 4), let A be the
    smallest integer in {1, ..., p-1} such that E: y^2 = x^3 + A x is
    nonsingular and ordinary, where ordinary means the integer
    #E(F_p)-(p+1) is not 0. Let n be the largest prime factor of #E.
    Keep p when n ≥ 11 and n ≡ 1 (mod 4). Let i0 be the smallest
    integer in {1, ..., p-1} with i0^2 ≡ -1 (mod p). Let φ(x, y) =
    (-x, i0 y). Let P be the lexicographically first affine point of
    order n, x then least nonnegative y. Let m be the unique residue
    in {0, ..., n-1} with φ(P) = m P, if the search finds one. Let r
    be the smallest residue in {1, ..., n-1} with r^2 ≡ -1 (mod n).
    The claim is that at least four eligible primes have m = r. A
    finished count of three or fewer, when at least four primes are
    eligible, is the concrete negative. Fewer than four eligible
    primes also makes the count false. This is not an orbit-normalised
    mean of the doubling-slope character, and the iteration factor on
    j=1728 stays √4. The exponent stays 1/2.
  mechanism: >-
    OBJECT FRAME. Representation R2: the short-Weierstrass model
    y^2 = x^3 + A x, which has j=1728. The tracked value is the scalar
    m such that the rational order-4 automorphism φ sends the
    lex-first order-n point to m times itself. Operation set Sigma is
    {φ}, not the full translation action. Trichotomy:
    coordinate-dependent, because φ is written on (x, y) and the
    scalar is then read in the cyclic subgroup. LOSSY-PROJECTION TEST
    against Sigma. Passing from φ(P) to the residue m discards the
    coordinates and keeps one element of Z/nZ. The image is one
    residue, so the projection is lossy whenever the subgroup has more
    than one point. The priced number is a count of primes, not an
    iteration count. Off-limits families F1–F7 are not the lens. No
    walk is run. The known fact that an order-4 automorphism acts as
    some square root of -1 is the fence: the claim is which root the
    lex-first point selects, and that selection can miss r.
  novelty_status: unverified
  status: proposed
  added: '2026-10-06'
  proposed_by: coordinator
  approved_by: null
  question_id: RQ-JINV-8fc13a
  citations:
    - ref: KR-RHO-0528e7
      provenance: internal
      claim: >-
        An automorphism group of order 4 multiplies rho iterations by
        √4 on j=1728. The exponent stays 1/2. This idea counts which
        square root appears and does not count iterations.
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-0528e7.yaml
        on 2026-10-06
    - ref: KN-TECH-018
      provenance: internal
      claim: >-
        The discounted rho baseline already charges √|Aut|. A scalar
        convention on one point is not a new discount.
      verified_by: >-
        design session opened knowledge/techniques/KN-TECH-018.md
        on 2026-10-06
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        Generic discrete log remains Omega(√n). Matching the smaller
        root on four primes does not change that exponent.
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
        on 2026-10-06
    - ref: square root of -1 in F_p
      provenance: recalled
      claim: >-
        Pointer only. p ≡ 1 (mod 4) is why a square root of -1 can
        exist in F_p. The test searches for the smallest i0 and does
        not trust this recollection for a particular prime.
      verified_by: null
  assumptions:
    - >-
      Ordinary means #E(F_p)-(p+1) ≠ 0, with #E from a point count
      that includes the point at infinity.
    - >-
      φ is retained only when it preserves the equation on every
      affine point. A map that fails that check is not a scalar.
    - >-
      The scalar search tries m from 0 through n-1 by repeated
      addition. It does not use a closed form for the endomorphism.
  proof_search_map:
    bottleneck: >-
      Whether the lex-first point lands on the smaller root r, rather
      than on the other root of X^2+1 modulo n.
    baseline_embedding:
      parameter_slice: >-
        The √4 constant of KR-RHO-0528e7. No rho walk is reproduced.
      reproduction_check: >-
        For the retained φ, check φ(φ(φ(φ(P)))) = P and φ(φ(P)) = -P
        on the frozen point, by the group law.
    observation_collision:
      observable: the residue m
      distinct_preimage_search: >-
        An eligible prime with m ≠ r is a miss. Four or more hits are
        the positive count. Three or fewer hits are the negative.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The fibre of φ over the two roots of X^2+1 modulo n, sampled
          at the lex-first point.
        predicted_gain: >-
          A hit count of at least 4, or a miss count that leaves fewer
          than 4 hits.
    quantifier_order: >-
      At least four primes in the frozen interval are eligible and
      satisfy m = r.
    method_ceiling:
      strongest_certifiable_claim: >-
        A hit count on primes at most 97. Not a rho speedup and not a
        statement past 97.
      nearby_object_control: >-
        The other root, n-r, on the same points. If m = n-r on every
        eligible prime, the smaller-root claim fails and the order-4
        relation can still hold.
    proof_obligations:
      - claim: φ(P) = m P is checked by addition, not by a formula for the endomorphism ring.
        responsibility: correctness
      - claim: A hit count does not change exponent 1/2.
        responsibility: scope
    not_applicable_reason: >-
      This is a count of a scalar convention, not a theorem, bound,
      certificate, reduction, or closure.
  predictions:
    - metric: number of eligible primes with m = r
      direction: higher
      minimum_effect: at least 4
  minimal_test:
    design: >-
      Scan primes from 29 through 97 with p ≡ 1 (mod 4). For each,
      take the smallest A that makes y^2 = x^3 + A x ordinary, factor
      the point count, and keep the prime when n ≥ 11 and n ≡ 1
      (mod 4). Search i0, freeze the lex-first point of order n,
      search m by addition, and compare m with the smaller root r.
      Do not run a walk.
    controls:
      - >-
        Record n-r beside r. A prime with m = n-r is a miss for this
        claim and is still consistent with φ having order 4.
      - >-
        Check φ composed four times is the identity on P. A failure
        is an instrument row, not a miss.
      - >-
        If the addition search finds no m, that prime is not counted
        as a hit and is not counted as a clean miss. It is an
        instrument row.
    required_metrics:
      - number of eligible primes
      - number of primes with m = r
      - number of primes with m = n-r
      - whether φ^4(P) = P on each eligible prime
  falsification_conditions:
    - At least four primes are eligible and fewer than four of them have m = r.
    - Fewer than four primes in the interval are eligible, so the count of four hits is false.
    - >-
      On an eligible prime, m^2 ≢ -1 (mod n). The order-4 reading is
      then wrong for that point, and the prime is not scored as a hit.
  confounders:
    - >-
      Replacing the lex-first point by -P sends m to -m, which swaps
      the two roots when n > 2. The representative is frozen before
      the count.
    - >-
      Choosing the larger square root of -1 in F_p as i0 instead of
      the smallest one can swap φ with -φ. i0 is the smallest
      nonnegative search hit.
    - >-
      A cofactor greater than 1 can put the lex-first order-n point in
      a different component than a later point. The claim is about
      that frozen point only.
  interpretation_limits:
    - >-
      Four hits do not change the √4 iteration factor. KR-RHO-0528e7
      already states that constant.
    - The interval stops at 97. No transfer to a larger prime.
    - >-
      This is not the orbit-normalised doubling-slope character gap
      of IDEA-20261006-fc2714, and it is not a trace-divisibility
      census.
    - Not a factor base.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Conditional on m^2 ≡ -1 (mod n) and m not in {0, n/2}, the
        lex-first point selects each of the two roots with equal
        frequency across eligible primes, up to the dependence induced
        by the lex rule. The prediction of at least four hits is a
        count, not this frequency. The frequency is checked only as a
        flag inside the interval.
      rigorous_support: >-
        There are two roots of X^2+1 when n ≡ 1 (mod 4). Nothing
        opened in this session proves the lex-first point is uniform
        on them. KR-RHO-0528e7 fixes the iteration constant and is not
        a distribution on the roots.
      validation_plan: >-
        On the eligible primes in 29..97, record the hit count and the
        count of m = n-r. Tail check: if every eligible prime lands on
        n-r, H1's equal-frequency reading is false inside this
        interval and the claim's hit count is the raw count, which is
        then 0. A zero hit count does not become a hit.
  target_complexity:
    time_exponent: unchanged p^{1/2}
    memory_exponent: unchanged O(1) rho memory; the census stores one model per prime at most 97
    best_known: >-
      automorphism-discounted rho, iteration factor √4 on j=1728,
      exponent still 1/2 (KR-RHO-0528e7, KN-TECH-018)
    hidden_overhead: none; no new algorithm
    tradeoff_note: >-
      No time-memory tradeoff. The scan is one model per prime in a
      fixed interval.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  dominated_by: >-
    No opened row dominates the which-root count. Rows opened and not
    dominating that count: KR-RHO-0528e7 (√4 iteration constant; this
    idea does not count iterations), KR-RHO-fb88e6 (negation-map
    cycles; this idea does not walk), KR-RHO-13bf67 (exponent 1/2).
    KR-RHO-0528e7 dominates any attack reading that would treat a hit
    as a speedup beyond √4.
  sota_delta: >-
    Zero change to exponent 1/2. The iteration constant on j=1728
    stays √4. The new quantity is the number of primes in 29..97,
    among those eligible under the filters above, for which the
    lex-first order-n point is sent to the smaller square root of -1.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-0528e7
      - KR-RHO-fb88e6
      - KR-RHO-13bf67
    nearest:
      - ref: KR-RHO-0528e7
        provenance: internal
        relation: adjacent
        delta: >-
          That row fixes a √4 iteration constant on j=1728. This idea
          does not change that constant. It counts, on primes at most
          97, how often the lex-first point selects the smaller root
          of X^2+1 modulo the large prime factor. The claimed count is
          at least 4.
      - ref: KN-TECH-018
        provenance: internal
        relation: adjacent
        delta: >-
          The technique note says the discounted rho baseline is
          calibration. A scalar convention is not charged as a new
          discount.
    searched:
      corpus_grep:
        - >-
          origin/main ledger/proposals and PRs 1943 and 1940 for
          doubling-slope means, trace divisible by 4, and order-3
          coset collisions
      web: []
      blocked:
        - web search not run; novelty_status stays unverified
