idea:
  id: IDEA-20261001-20561e
  question_id: RQ-BINSTD-b6f698
  added: '2026-10-01'
  status: proposed
  approved_by: null
  title: >-
    AT FIXED dim(V)=ℓ, DOES PEAK RSS OF S_3 XOR-SAT ENCODE+SOLVE STAY INSIDE
    A PRE-REGISTERED BAND AS n GROWS? On binary toys n∈{17,19,23,29,31} with
    frozen V (dim ℓ∈{3,4}), measure peak RSS of one shared XOR-SAT pin and
    test whether it stays ≤ M₀·2^{α·ℓ} (α,M₀ frozen) or breaks the band.

  class: heuristic_validation

  claim: >-
    KR-IC-5765d2 and KR-IC-1fcdbc report SAT/XOR PDP costs at small n without
    a pre-registered memory law versus n at fixed ℓ. CLAIM: for each ℓ∈{3,4},
    across n∈{17,19,23,29,31} on a frozen V family and shared XOR-SAT pin,
    peak RSS of encode+one-shot solve satisfies
    peak_rss ≤ M₀ · 2^{α·ℓ} with (α,M₀) frozen before any run — OR the band
    is broken and recorded as memory-super-exponential-in-ℓ / n-sensitive at
    toys. CLAIM TIER: heuristic_validation. NO break. NO exponent. NO n≥131
    transfer. Distinct from IDEA-20261001-214fd3 (last-fall degree), 556cea
    (solving vs first-fall), febbe1 (N_var correlation), and solver races.

  mechanism: >-
    OBJECT FRAME. Representation: FB {P : x(P)∈V} with V an F_2-subspace of
    fixed dimension ℓ; Operation: encode the descended S_3 PDP as XOR-SAT
    (KR-IC-5765d2 / KR-IC-5a43e5) and solve once under a frozen pin; Observable:
    peak RSS (bytes) of the encode+solve process. Trichotomy: Class I
    instrument (memory law). Lossy-projection: RSS discards which clauses
    dominate; null is a matched random Boolean system of the same N_var whose
    RSS is independent of n by construction. OFF-LIMITS: last-fall / solving
    degree; dim(V·V)→N_var; engine bake-offs; yield. WHAT IS NEW: a frozen
    (α,M₀) peak-RSS band versus n at fixed ℓ on RQ-BINSTD toys.

  novelty_status: unverified
