  assumptions:
    - Frozen V family, seeds, XOR-SAT pin, and (α,M₀) band before any run.
    - Encoder/solver already admitted or cell is failed_infrastructure.
    - Peak RSS ≠ last-fall degree ≠ N_var correlation.
    - Band hold ≠ practical binary IC (KR-IC-1fcdbc).

  heuristic_assumptions:
    - id: HEUR-BINSTD-20561e-H1
      formal_statement: >-
        FORALL ℓ∈{3,4}, FORALL n∈{17,19,23,29,31}: on the frozen V family and
        shared XOR-SAT pin, peak_rss(encode+solve) ≤ M₀ · 2^{α·ℓ} with
        (α,M₀) frozen at Stage 0.
      random_model_justification: >-
        Rigorous: at fixed ℓ the descended variable count is governed by
        dim(V) and product-space structure (KR-IC-73db3f), not by n once
        Weil restriction is written; classical SAT memory scales with clause
        store size. If that channel dominates, RSS should be n-insensitive
        inside a frozen exponential-in-ℓ band; if n-dependent fill-in or
        solver heuristics dominate, the band breaks. The band is the
        pre-registered transfer hypothesis at toys — not a claim that SAT
        beats rho.
      supporting_results:
        - KR-IC-5765d2
        - KR-IC-73db3f
        - KR-IC-1fcdbc
      validation_experiment_ids: []
      falsification_condition: >-
        peak_rss > M₀·2^{α·ℓ} at any completed cell (band broken), OR
        encoder/solver absent (infrastructure stop), OR RSS probe unavailable
        (inconclusive; stop without evidence).

  predictions:
    - metric: peak_rss_bytes
      direction: upper_bounded
      minimum_effect: '≤ M₀ · 2^{α·ℓ} at each (n,ℓ) cell'
    - metric: n_insensitivity_ratio
      direction: upper_bounded
      minimum_effect: 'max_n RSS / min_n RSS ≤ 2.0 at fixed ℓ, else record n-sensitive'
    - metric: null_random_boolean_rss_independence
      direction: different
      minimum_effect: 'null catalog RSS independent of n by construction'

  minimal_test: >-
    Stage 0: freeze V family, seeds, XOR-SAT pin, (α,M₀), RSS probe.
    Stage 1: n=17, ℓ∈{3,4} — encode+solve; report peak_rss.
    Stage 2: n∈{19,23,29,31} + random-Boolean null. Budget: ≤8 CPU-hours.
    Stop if encoder/solver/RSS probe absent (IMP, never evidence).

  controls:
    - ctl_fixed_dim_V
    - ctl_frozen_V_family
    - ctl_shared_xorsat_pin
    - ctl_frozen_alpha_M0_before_runs
    - null_random_boolean_matched_Nvar
    - ctl_no_posthoc_band_edit

  falsification_conditions:
    - Claiming practical binary IC from a toy memory band (KR-IC-1fcdbc).
    - Equating peak RSS with last-fall or solving degree (214fd3 / 556cea).
    - Editing (α,M₀) after seeing RSS.
    - Transferring the band to n≥131 without a new contract.
    - Comparing across different XOR-SAT pins without a pin-fixed control.

  target_complexity:
    time_exponent: >-
      No exponent claimed. Memory instrument only; a held band does not move
      binary ECDLP vs rho (KR-IC-1fcdbc / KR-IC-9e610d).
    memory_exponent: >-
      Pre-registered upper band M₀·2^{α·ℓ} at toys; not an asymptotic claim.
    best_known: >-
      KR-IC-5765d2 (SAT/XOR PDP); KR-IC-1fcdbc (binary IC slower than rho).
    hidden_overhead: Encoder constants; solver heap fragmentation; OS RSS noise.
    tradeoff_note: >-
      A held RSS band can still hide super-linear wall time; this meter is
      memory-only.

  estimated_cost:
