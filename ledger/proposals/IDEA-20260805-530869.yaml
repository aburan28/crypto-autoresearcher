idea:
  id: IDEA-20260805-530869
  question_id: RQ-MLKEM-001
  goal_id: GOAL-MLKEM-005
  added: '2026-08-05'
  title: >-
    The ring-deleted matched null: build the instrument that can tell whether an
    ML-KEM mechanism uses the cyclotomic structure at all, calibrate it against
    three forced values, and make passing it a precondition on every candidate
    this goal measures

  class: instrument

  claim: >-
    GOAL-MLKEM-005's completion criterion C2 requires, of every measured
    mechanism, "a null object of the right shape -- the object removed NAMED,
    the statistic NAMED, and the statistic's sensitivity to that object
    DEMONSTRATED". For an ML-KEM mechanism there is exactly one object whose
    removal decides whether the mechanism is about ML-KEM or merely about
    noisy linear algebra: THE CYCLOTOMIC RING. This proposal builds that null
    -- a plain-LWE instance with A uniform in Z_q^{nk x nk}, matched to the
    module instance in dimension, modulus, secret law, error law and sample
    count, differing ONLY in that rot(A) is replaced by an unstructured matrix
    -- and calibrates it against three quantities whose values are FORCED and
    derived before any run:
      (F1) rot(A) commutes EXACTLY with Phi_k = I_k tensor rot(X); the
           commutator is the zero matrix. For the matched null it is nonzero
           with probability 1 - O(q^{-(nk)^2 + nk}).
      (F2) over R, the Gram matrix rot(a)^T rot(a) has EVERY eigenvalue of EVEN
           multiplicity, because the eigenvalues of rot(a) over C are the
           evaluations of a at primitive 2n-th roots of unity and these come in
           conjugate pairs. A matched null Gram matrix has simple spectrum with
           probability 1. VERIFIED NUMERICALLY HERE at n = 8 (ring: four
           eigenvalues each of multiplicity two; null: eight distinct).
      (F3) over F_q with q = 3329, X^256 + 1 splits into exactly 128
           irreducible QUADRATICS, because ord_512(3329) = 2 (computed here);
           so the characteristic polynomial of rot(A) has EVERY irreducible
           factor of degree dividing 2k, while a uniform matrix in
           M_{nk}(F_q) has an expected largest factor degree of order 0.62 nk.
    The deliverable is not a finding about ML-KEM. It is a reusable,
    hash-committed null generator plus a calibration battery whose three
    statistics have pre-derived values on both arms, and a rule: A MECHANISM
    WHOSE ADVANTAGE SURVIVES THE RING DELETION HAS PROVEN IT IS NOT USING THE
    STRUCTURE IT CLAIMS TO USE, and its novelty against generic LWE is void.
    This lane is not in GOAL-MLKEM-005's five-lane next_action; it is what the
    five lanes will need in BATCH-002 and do not have.

  object_first_candidate:
    tracked_object: >-
      THE ADVANTAGE RATIO of a candidate statistic between two instances that
      differ in exactly one structural feature: adv(module instance) /
      adv(matched unstructured instance). The tracked object is followed
      through the whole of whatever computation a candidate mechanism performs;
      the point is that the ratio, not the raw statistic, is what a claim about
      ML-KEM is entitled to be about. Its one-step propagation rule is the
      matching policy: every transformation applied to the treatment arm is
      applied verbatim to the null arm, so the ratio propagates by construction
      and any divergence is instrumented rather than assumed.
    established_families_off_limits: >-
      OFF LIMITS AS THE PRIMARY LENS: every attack family. This proposal
      deliberately proposes NO attack and NO mechanism. It refuses the
      dual/FFT family, primal/uSVP, hybrid MITM, decryption failures,
      side channels, the class-group/PIP family and coefficient-isometry
      amortisation as objects of study -- they are the CONSUMERS of the
      instrument, not its subject. The one thing not off limits is the ring
      itself, and it appears only as the object being DELETED, which is the
      opposite of an algebraic structure attack and so is untouched by the
      goal record's inherited "the algebra is closed at about 17 bits"
      constraint.
    newness_score: >-
      Matched nulls are not new as a method, and the corpus contains a
      technique entry for null sufficiency (KN-TECH-1a5b7e). What is absent is
      an ML-KEM-specific ring-deleted null with derived forced values: the
      ANGLE-BRIEF's own census records 39 of 1694 run directories as controls,
      `arms_and_controls` appearing in 1 specification of 195, and 166 of 229
      evidence records with no null anywhere. It also records that GOAL-FRODO-001
      "is the matched null object for every structured-lattice discount claim"
      and that nothing frames it that way. This proposal is that framing, made
      concrete and local so it does not depend on another goal executing.
    testability_score: >-
      Very high and entirely within this container's means. F1 is one matrix
      multiply; F2 is one call to a symmetric eigensolver (numpy 2.4.6 present,
      verified by import 2026-08-05); F3 needs characteristic-polynomial
      factorisation over F_q, which at toy nk (<= 64) is a few seconds of
      pure-Python Berlekamp or of distinct-degree factorisation, and does not
      need sympy (ABSENT, verified).
    survival_score: >-
      The object survives exactly as far as the matching policy is honest, and
      that is the failure mode to watch: a null that is matched on the wrong
      list of features is worse than no null, because it licenses a negative.
      The proposal therefore fixes the matching list explicitly and makes
      unmatched features a declared limitation rather than an oversight.

  mechanism: >-
    DERIVED HERE; the three numerical checks below were run on this machine on
    2026-08-05 (SCOUT-COMPUTED, to be re-run in-harness before citation).

    THE TWO ARMS.
    TREATMENT. R_q = Z_q[X]/(X^n + 1), A in R_q^{k x k}, s, e drawn
    coefficient-wise from CBD(eta), t = A s + e. Its Z_q-matrix form is
    rot(A), the nk x nk block matrix of negacyclic blocks.
    NULL. B uniform in Z_q^{nk x nk}, s, e drawn from the SAME coefficient law
    on Z_q^{nk}, t = B s + e. Same nk, same q, same eta, same number of
    samples, same seeds derived from the same rule.
    MATCHED ON: dimension nk; modulus q; secret law; error law; sample count;
    the encoding of instances into whatever the candidate mechanism consumes;
    the random-number stream discipline.
    NOT MATCHED, AND THIS IS THE POINT: the algebra. rot(A) lies in the image
    of a ring embedding; B does not.
    NOT MATCHED, AND THIS IS A DECLARED LIMITATION rather than a design
    choice: rot(A) has only nk^2 free Z_q-parameters against B's (nk)^2, so
    the two arms differ in ENTROPY as well as in structure. Any statistic that
    is sensitive to the number of free parameters will separate the arms
    without the ring being responsible. The proposal handles this with a THIRD
    arm rather than by ignoring it (see the entropy-matched arm below).

    FORCED VALUE F1 -- EXACT EQUIVARIANCE.
    Let Phi = rot(X) be the negacyclic shift and Phi_k = I_k tensor Phi. For
    any a in R_q, rot(a) rot(X) = rot(aX) = rot(X) rot(a) because R_q is
    commutative; extending blockwise, rot(A) Phi_k = Phi_k rot(A) EXACTLY.
    So the statistic ||[rot(A), Phi_k]||_infty is IDENTICALLY 0 on the
    treatment arm. On the null arm [B, Phi_k] = 0 forces B into the
    centraliser of Phi_k, an F_q-subspace of dimension nk^2 inside (nk)^2, so
    the probability is q^{-((nk)^2 - nk^2)} -- utterly negligible. VERIFIED at
    n = 8, k = 1: commutator sup-norm 0.0 on the ring arm, 3.404 on the null
    arm (real-arithmetic instantiation).
    THIS IS THE CHEAPEST POSSIBLE SENSITIVITY DEMONSTRATION and its cost is one
    matrix multiply. It is also the least interesting, because it is a
    property of the encoding rather than of the hardness, and the record says
    so: F1 certifies that the two arms ARE different objects, nothing more.

    FORCED VALUE F2 -- EVEN SPECTRAL MULTIPLICITY.
    Over C the eigenvalues of rot(a) are a(omega) for omega ranging over the
    primitive 2n-th roots of unity. For a with real (integer) coefficients,
    a(conj(omega)) = conj(a(omega)), so the multiset of eigenvalues is closed
    under conjugation and |a(omega)|^2 = |a(conj(omega))|^2. Hence every
    eigenvalue of the real Gram matrix rot(a)^T rot(a) occurs with EVEN
    multiplicity. VERIFIED at n = 8: the ring Gram spectrum is
    {0.222796 x2, 5.138518 x2, 10.896888 x2, 11.516132 x2} while a matched
    Gaussian null gives eight distinct values. This one MATTERS, because the
    Gram spectrum is the object every lattice-reduction profile statistic is
    built from: a "profile shape" finding on ML-KEM that does not survive the
    ring deletion is a finding about eigenvalue pairing.

    FORCED VALUE F3 -- THE CRT FACTOR-DEGREE CEILING.
    q - 1 = 3328 = 2^8 * 13, so Z_q^* contains the 256th roots of unity but not
    the 512th; the multiplicative order of q modulo 2n = 512 is 2 (computed).
    Therefore X^256 + 1 factors over F_q into exactly 128 irreducible
    QUADRATICS and R_q = prod_{i=1}^{128} F_{q^2}. In CRT slot i the block
    matrix acts as A_i in M_k(F_{q^2}), an F_q-linear map on a 2k-dimensional
    space, so
      charpoly_{F_q}(rot(A)) = prod_{i=1}^{128} charpoly_{F_q}(A_i),
    each factor of degree 2k. EVERY irreducible factor of charpoly(rot(A)) has
    degree dividing 2k -- at most 4 for ML-KEM-512, at most 8 for ML-KEM-1024,
    against nk = 512 and 1024. For a uniform matrix in M_{nk}(F_q) the largest
    irreducible factor degree is of order 0.62 nk (the Golomb-Dickman constant;
    RECALLED, UNVERIFIED, and NOT USED as an authority -- the null arm's
    distribution is MEASURED, which is the whole point of having a null).
    F3 is the deepest of the three because it is the statement of what ML-KEM's
    algebra actually IS: 128 independent rank-k instances over F_{q^2} glued by
    a map that is not an isometry.

    THE THIRD ARM, AND WHY THE INSTRUMENT NEEDS IT.
    ENTROPY-MATCHED NULL: draw B block-circulant over a DIFFERENT ring --
    concretely Z_q[X]/(X^n - 1), whose splitting over F_q is different (it has
    a rational root at X = 1 and its factor-degree profile differs), or a
    random block-diagonal matrix with nk^2 free parameters. This arm has the
    treatment arm's parameter count but not its algebra. A statistic that
    separates treatment from the uniform null but NOT from the entropy-matched
    null is responding to parameter count. This is the single most likely way
    for a ring-deletion claim to be wrong and it is instrumented rather than
    disclaimed.

    THE GRADED LADDER (>= 3 interior points, monotonicity reported).
    Interpolate from ring to unstructured through objects of the same size:
      L0 rot(A) over Z_q[X]/(X^n+1)          -- 128 quadratic CRT slots
      L1 rot(A) over Z_q[X]/(X^n-1)          -- different splitting, still commutative
      L2 block matrix, each block circulant but blocks independently drawn
      L3 block matrix, blocks drawn from a random nk^2-dimensional subspace
      L4 uniform B in Z_q^{nk x nk}
    Each statistic is reported at all five points and its monotonicity in the
    ladder index is reported. A statistic that jumps between L3 and L4 is
    reading parameter count; one that jumps between L0 and L1 is reading the
    splitting field; one that jumps only at L2 is reading commutativity. THE
    LADDER LOCALISES THE OBSTRUCTION instead of leaving "the null matched".

    THE RULE THE INSTRUMENT EXISTS TO ENFORCE.
    For any candidate mechanism M with claimed advantage adv(M) on ML-KEM:
    (i) adv must be measured on L0 and on L4 with the identical pipeline, seeds
    derived by the same rule, null arm committed and hashed before the
    treatment arm is read; (ii) the reported quantity is the RATIO, with per-
    group error bars; (iii) if the ratio is statistically indistinguishable
    from 1, M's claim to be about ML-KEM specifically is void and must be
    restated as a claim about LWE of that dimension; (iv) if it separates, the
    ladder localises which structural feature it uses. None of this makes M
    correct; it makes M's scope honest.

  novelty_status: unverified
  novelty_screen_limits: >-
    The screen was over this corpus: KN-TECH-1a5b7e (null sufficiency), the
    ANGLE-BRIEF's control census, the 195 experiment specifications' use of
    `arms_and_controls`, and the four prior MLKEM proposals. It CANNOT see the
    external literature, where structure-versus-unstructured comparisons of
    LWE are standard practice, and it CANNOT establish that no one has built
    this generator. The claim is: NO SUCH GENERATOR OR CALIBRATION BATTERY
    EXISTS IN THIS CORPUS. The three forced values F1-F3 are elementary facts
    about negacyclic matrices and are certainly known; their use as a
    pre-derived calibration battery for an ML-KEM null is what is proposed.

  lossy_projection_identifiability_audit:
    projection: >-
      A pair of complete instances (module instance, matched unstructured
      instance) --> a single ratio adv(L0)/adv(L4) per statistic, plus the
      ladder profile.
    what_is_discarded: >-
      Both instances entirely; every value of the statistic on either arm
      separately; all instance-specific structure. Only relative behaviour
      survives.
    why_genuinely_lossy: >-
      Massively lossy: the fibre over a given ratio contains every pair of
      instances whose statistics happen to stand in that relation. Nothing
      about either instance is recoverable.
    why_compatible_with_the_operations: >-
      Compatible by construction rather than by luck: the matching policy
      applies every operation of the candidate pipeline verbatim to both arms,
      so the ratio propagates deterministically through the whole computation
      whatever the pipeline is. This is the one projection in this session
      whose compatibility is enforced rather than argued.
    is_it_only_a_change_of_coordinates: >-
      NO, and both failure modes were checked and both are ABSENT.
      (i) Nothing-discarded failure: the ratio cannot reconstruct either arm.
      (ii) THE MIRROR FAILURE (constant across instances, zero comparator
      spread) IS THE ONE THAT WOULD KILL AN INSTRUMENT PROPOSAL, AND IT IS
      EXCLUDED BY EXHIBITED NUMBERS RATHER THAN BY ASSERTION. All three
      calibration statistics take DIFFERENT, PRE-DERIVED values on the two
      arms: F1 gives 0 against nonzero (measured 0.0 against 3.404 at n = 8);
      F2 gives even multiplicities against simple spectrum (measured
      {x2,x2,x2,x2} against eight distinct at n = 8); F3 gives max factor
      degree <= 2k against order 0.62 nk. A non-constant comparator with
      derived endpoints on both arms is exactly what the mirror failure test
      demands, and it is supplied before any experiment is authorised.
    residual_risk: >-
      A candidate mechanism's OWN statistic may still be constant across the
      arms even though the calibration statistics are not. The instrument
      certifies its own sensitivity, not the candidate's; every candidate owes
      its own sensitivity demonstration and the record says so rather than
      letting the battery stand in for it.

  assumptions:
    - >-
      That q - 1 = 3328 = 2^8 * 13 and ord_512(3329) = 2, hence 128 quadratic
      factors. COMPUTED HERE, not recalled. This is the one arithmetic fact the
      whole of F3 rests on and it is cheap to re-check.
    - >-
      That the candidate mechanisms this instrument will serve consume an LWE
      instance in a form that can be presented unstructured. A mechanism that
      is DEFINED only in ring terms (for example one that indexes CRT slots)
      cannot be run on the null at all -- and that unrunnability is itself a
      reportable outcome, not a defect of the instrument.
    - >-
      That the Golomb-Dickman order 0.62 nk for the largest factor degree is
      only illustrative. RECALLED, UNVERIFIED. The null arm's distribution is
      measured; no external constant is load-bearing.

  proof_search_map_note: >-
    NOT APPLICABLE and the reason is recorded rather than the field silently
    omitted: this proposal asserts no theorem, no asymptotic bound, no
    reduction and no closure argument. F1-F3 are elementary derivations used as
    calibration, not as results. The paired hypotheses in this batch
    (H-MLKEM-b1300f, H-MLKEM-dc51f5) carry filled maps; if this instrument is
    later promoted to a hypothesis of its own, the map becomes required at that
    point.

  predictions:
    - metric: >-
        NL-1 EQUIVARIANCE: sup-norm of [rot(A), Phi_k] on the treatment arm
      direction: lower
      minimum_effect: >-
        EXACTLY 0, over every drawn instance, at every tested (n, k). FORCED.
        A single nonzero entry means the rot() encoder is wrong and the whole
        battery is invalid.
    - metric: >-
        NL-2 EQUIVARIANCE ON THE NULL: sup-norm of [B, Phi_k]
      direction: higher
      minimum_effect: >-
        Nonzero on 100 per cent of drawn null instances. FORCED up to
        probability q^{-((nk)^2 - nk^2)}. If it is ever zero, the null
        generator is not drawing uniformly.
    - metric: >-
        NL-3 SPECTRAL MULTIPLICITY: fraction of eigenvalues of the real Gram
        matrix occurring with even multiplicity, per arm
      direction: different
      minimum_effect: >-
        1.00 on the treatment arm (all even), and at the numerical-coincidence
        floor on the uniform null arm, over >= 200 instances at each of
        n in {8, 16, 32}. FORCED on the treatment side by the conjugate-pair
        argument.
    - metric: >-
        NL-4 MAXIMUM IRREDUCIBLE FACTOR DEGREE of charpoly over F_q, per arm
      direction: different
      minimum_effect: >-
        <= 2k on the treatment arm for EVERY instance (FORCED, exactly), and a
        measured distribution with mean of order 0.6 nk on the uniform null
        arm. A single treatment instance exceeding 2k falsifies the CRT
        derivation and the record must be withdrawn.
    - metric: >-
        NL-5 ENTROPY-MATCHED SEPARATION: each calibration statistic evaluated
        on the entropy-matched arm
      direction: different
      minimum_effect: >-
        Pre-registered per statistic BEFORE the run, not after: F1 predicted to
        separate (the entropy-matched arm need not commute with Phi_k unless it
        is built to), F3 predicted to separate on the L1 arm by splitting type
        rather than by parameter count. Any statistic whose treatment-versus-
        uniform separation is REPRODUCED by the entropy-matched arm is reported
        as reading parameter count and is struck from the battery.
    - metric: >-
        NL-6 LADDER MONOTONICITY across L0..L4, >= 3 interior points
      direction: different
      minimum_effect: >-
        Each statistic's value reported at all five points with the transition
        index at which it changes. The prediction is that F1 changes at L2,
        F3 changes at L1, and F2 changes at L2 -- pre-registered, and a
        different transition pattern is informative rather than a failure.

  minimal_test:
    design: >-
      Three stages, cheapest first. STAGE 0 (zero compute, ~1 hour): re-derive
      F1, F2, F3 on paper, including the exact statement of the null's
      commutant dimension and the CRT factor-degree ceiling. If F2's
      conjugate-pair argument fails for even n, STOP. STAGE 1 (minutes, numpy):
      implement the two generators with a declared seed-derivation rule,
      commit and hash the null arm FIRST, then run NL-1 through NL-4 at
      n in {8, 16, 32}, k = 2, q = 3329. STAGE 2 (minutes to an hour): the
      entropy-matched arm and the full L0..L4 ladder, NL-5 and NL-6.
      Deliverable: a hash-committed generator, the battery's measured values
      with per-group error bars, and a written matching policy naming every
      matched and every unmatched feature.
    controls:
      - >-
        THE NULL IS THE DELIVERABLE, so the control structure is inverted and
        stated that way. The instrument's own null is the ENTROPY-MATCHED arm:
        forced value derived pre-run per statistic, and it CAN FAIL -- if it
        reproduces the treatment-versus-uniform separation, the statistic is
        reading parameter count and is struck.
      - >-
        POSITIVE CONTROL (the effect MUST appear). F1 on the treatment arm is
        exactly 0 and on the uniform arm is nonzero. If the implemented
        commutator does not return exactly 0 on the ring arm, the encoder is
        wrong and NOTHING else in the run may be reported. This is the
        instrument-adequacy gate in the KN-TECH-1a5b7e sense: removed object =
        the ring, statistic = the commutator sup-norm, sensitivity =
        0 against nonzero, threshold declared before the run.
      - >-
        GRADED CONTROL: the L0..L4 ladder with three interior points, reporting
        the transition index of each statistic. This is what turns "the null
        matched" into "the statistic reads the splitting field, not the
        parameter count".
      - >-
        DEGENERATE-INSTANCE CONTROL: draw A with a whole CRT slot zeroed. F3
        must then show a repeated factor and F1 must still be 0. This separates
        "the statistic reads the ring" from "the statistic reads genericity".
      - >-
        ARCHIVE CHECK (zero compute): enumerate every prior ML-KEM null in this
        corpus. EXPECTED: none matched on the ring. Recorded as an absence.
    required_metrics:
      - the seed-derivation rule and the hash of the committed null arm, recorded before treatment
      - NL-1..NL-4 per arm per (n,k) with instance counts and error bars
      - the entropy-matched arm's value for every statistic
      - the L0..L4 ladder table with each statistic's transition index
      - the written matching policy, with the UNMATCHED features enumerated

  falsification_conditions:
    - >-
      F1 is nonzero on any treatment instance. The rot() encoder is wrong; the
      battery is invalid and nothing is reportable.
    - >-
      F2's even-multiplicity claim fails at any tested n. The conjugate-pair
      derivation is wrong and must be withdrawn as a superseding record.
    - >-
      Any treatment instance has an irreducible charpoly factor of degree above
      2k. The CRT derivation is wrong; F3 is withdrawn.
    - >-
      Every statistic in the battery is reproduced by the entropy-matched arm.
      The battery reads parameter count, not algebra, and the instrument does
      not do what it claims. This is the outcome that would make the whole
      proposal worthless and it is checked explicitly.
    - >-
      A candidate mechanism is found that cannot be expressed on the
      unstructured arm at all. Not a falsification -- a scope limit, recorded
      as such, with the mechanism marked as unfalsifiable by this instrument.

  confounders:
    - >-
      ENTROPY, NOT ALGEBRA. rot(A) has nk^2 free parameters against (nk)^2 for
      B. This is the dominant confounder and the entropy-matched arm exists
      solely for it. It cannot be fully removed: an object with the treatment's
      algebra and the null's entropy does not exist.
    - >-
      A NULL MATCHED ON THE WRONG LIST IS WORSE THAN NO NULL, because it
      licenses a negative. The matching policy is therefore written down and
      its unmatched features enumerated, and a reviewer is invited to attack
      the list rather than the numbers.
    - >-
      TOY SCALE. n in {8, 16, 32} against 256. F1 and F2 are exact algebraic
      facts independent of n, so the toy arm CHECKS A DERIVATION. F3's null-arm
      distribution is genuinely n-dependent and the toy measurement of it does
      NOT extrapolate; the record must say so at every citation.
    - >-
      THE INSTRUMENT CANNOT CERTIFY A CANDIDATE'S SENSITIVITY. Passing the
      battery says the arms are distinguishable in principle, not that the
      candidate's own statistic can move. Every candidate still owes its own
      demonstration.

  interpretation_limits:
    - >-
      NO ML-KEM CLAIM OF ANY KIND. No attack, no cost, no parameter set
      affected or cleared. This is instrument construction.
    - >-
      A ratio indistinguishable from 1 for some future mechanism M does NOT
      show M is worthless; it shows M's claim is about LWE of that dimension
      rather than about ML-KEM. That is a scoping conclusion, not a refutation,
      and writing it as a refutation would be the overclaim this record is
      designed to prevent.
    - >-
      Conversely a ratio far from 1 does NOT show M is an attack. It shows M
      uses the structure. Usefulness is a separate question with a separate
      cost model.
    - >-
      claim_tier ceiling: `toy_scale` for every measured number; the forced
      values F1-F3 are derivations and are labelled `derivation`, not
      measurement. This proposal alone does not satisfy GOAL-MLKEM-005's C2,
      which demands a measured MECHANISM; it supplies the null that C2 demands
      of whichever mechanism is measured.

  heuristic_assumptions:
    - id: HEUR-NL-1
      statement: >-
        NONE OF F1, F2 OR F3 IS HEURISTIC. F1 is commutativity of R_q. F2 is
        closure of the eigenvalue multiset under complex conjugation for a
        real-coefficient element. F3 is the CRT decomposition of R_q given
        ord_512(3329) = 2. All three are theorems and all three were checked
        numerically at n = 8 before this record was written.
      rigorous_support: >-
        As stated. The only imported number is ord_512(3329) = 2, computed here.
      validation_plan: >-
        Recompute all three in-harness at n in {8, 16, 32} as stage 1. A
        failure is a derivation error, not a heuristic falsification.
    - id: HEUR-NL-2
      statement: >-
        The matching policy (dimension, modulus, secret law, error law, sample
        count, encoding, seed discipline) captures every feature a candidate
        statistic could be responding to other than the algebra.
      random_model_justification: >-
        There is none, and this is the record's genuinely heuristic
        assumption. It is a claim about an unenumerated space of statistics and
        it cannot be proved. The entropy-matched arm tests the one alternative
        the author could name; the record does not claim the list is complete.
      validation_plan: >-
        Report the entropy-matched arm for every statistic; invite reviewers to
        name a further unmatched feature; treat any named feature as a required
        additional arm rather than as an objection to be argued away.
      falsification_condition: >-
        A statistic that separates the arms and is later shown to be driven by
        a matched-on-paper but actually-unmatched feature. The battery is then
        revised by a superseding record.

  target_complexity:
    time_exponent: >-
      n/a for this audit. NO EXPONENT IS MOVED AND NONE IS CLAIMED. This is an
      instrument, and the record states so plainly rather than dressing a
      control as a result. Its value is that it is a precondition on the
      exponent claims the goal intends to make: an exponent claim that survives
      ring deletion is an exponent claim about generic LWE and would have to be
      restated.
    memory_exponent: n/a.
    best_known: >-
      n/a -- there is no incumbent instrument in this corpus to compare
      against, which is the gap being filled.
    hidden_overhead: >-
      The unmatched entropy gap, and the unenumerable space of statistics
      HEUR-NL-2 quantifies over.
    tradeoff_note: n/a.

  dominated_by: >-
    n/a (no result claimed) -- with the check listed rather than asserted. Rows
    checked across TIME, MEMORY and DATA/QUERIES for a prior instrument serving
    this function: (i) KN-TECH-1a5b7e -- a technique entry, not a generator,
    and it supplies no ML-KEM null; (ii) the 39 control run directories the
    ANGLE-BRIEF census locates (EXP-DREG-001/002, EXP-DS-001, EXP-FB3-001,
    EXP-STR-002, EXP-XEDN-002..007, EXP-YIELD-001/002) -- none is a lattice
    null and none is matched on a ring; (iii) GOAL-FRODO-001 as the
    program-level unstructured null -- it has no experiments and this proposal
    does not depend on it executing; (iv) the ML-KEM evidence records
    EV-MLKEM-b43de0, -ba6c25, -d777f0, which document nulls in the dual-attack
    lane matched on norms rather than on algebra. NO ROW SUPPLIES A
    RING-DELETED MATCHED NULL, and no row is dominated by this proposal because
    this proposal competes with nothing.
  sota_delta: >-
    No attack; instrument contribution only. Quantitatively: it supplies three
    calibration statistics with pre-derived two-sided values (0 against
    nonzero; multiplicity 2 against 1; factor degree <= 2k against order
    0.62 nk) where this corpus currently supplies zero such statistics for
    ML-KEM, and it converts GOAL-MLKEM-005's C2 sensitivity requirement from a
    per-mechanism obligation each candidate must invent into a fixed battery
    with a fixed cost of minutes.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.90 that F1-F3 hold exactly as derived -- they are theorems, they were
    checked numerically at n = 8 before this record was written, and the
    residual 0.10 is the risk that the in-harness rot() encoding convention
    differs from the one used in that check. 0.45 that the resulting battery
    survives the entropy-matched arm with at least two statistics intact; it is
    not higher because the parameter-count confound is real and F1 in
    particular may well be reading nothing but the encoding, and it is not
    lower because F3's factor-degree ceiling is a consequence of the splitting
    field rather than of the parameter count and should survive an
    entropy-matched arm built from a differently-splitting ring. 0.20 that any
    mechanism this goal later measures turns out to survive ring deletion --
    which would be the single most useful thing the instrument could report.
