idea:
  id: IDEA-20261007-611573
  question_id: RQ-ECDLP-bc7a54
  added: '2026-10-07'
  status: proposed
  approved_by: null
  title: Semaev S_3 hit rate inside the small-x set versus its complement
  class: measurement
  claim: >-
    On an ordinary prime-order subgroup of size N in (2^{10}, 2^{12}),
    let F be the ceil(N^{1/3}) subgroup points of smallest integer x,
    and let D_x be {Q : x(Q) < p^{2/3}}. The fraction of Q in D_x for
    which S_3(x(P1), x(P2), x(Q)) has a root in the x-coordinates of F,
    for some P1, P2 in F, is at most twice the same fraction for Q
    outside D_x. The metric is a hit count. It is not a total degree
    and not a monomial count.
  mechanism: >-
    PAIR. Representation R1, integer digits of x, restricted to an
    interval factor base. Operation set Sigma is addition of two factor
    base points, not the full translation action. TRICHOTOMY.
    Partial-action, the index-calculus relation: a hit propagates under
    addition by F and not under a generic translate. LOSSY-PROJECTION
    TEST. Keeping only the hit bit discards which pair in F was used.
    The test asks whether the small-x set is a richer source of
    relations than its complement. A richer source would be a chi for
    a set that is already decidable by one comparison. No relation is
    collected into a linear system.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-bc7a54
      provenance: internal
      claim: >-
        D_x is dense and decidable by one comparison, with no known
        inversion. A higher relation hit rate would be a different
        price for the same set.
      verified_by: ledger/questions/RQ-ECDLP-bc7a54.yaml
    - ref: KR-IC-f5c584
      provenance: internal
      claim: >-
        Weil descent of S_3 to F_2 has first fall degree 2 because the
        trace of x is a group morphism. This proposal does not descend
        and does not read a first fall degree.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-f5c584.yaml
    - ref: KR-IC-73db3f
      provenance: internal
      claim: >-
        On binary fields the factor base is a subspace V chosen so that
        product spaces stay small. This factor base is an interval of
        integer x on a prime field.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-73db3f.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        The generic-group bound stays Omega(N^{1/2}). A hit-rate ratio
        is not an operation count.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
  assumptions:
    - A root of S_3 is checked by the group law, P1 + P2 = Q or P1 + P2 + Q = O.
    - The curve y^2 = x^3 + x + 1 is not used.
    - No linear algebra is run. A hit is not a solved discrete log.
  predictions:
    - metric: >-
        Hit-rate ratio, mean of the S_3 hit bit on D_x divided by the
        mean on the complement.
      direction: lower
      minimum_effect: '<= 2'
  minimal_test: >-
    On the smallest ordinary prime-order curve with N in (2^{10},
    2^{12}), skipping y^2 = x^3 + x + 1, take F of size ceil(N^{1/3})
    by smallest integer x. For every affine subgroup point Q, record
    whether some pair in F gives an S_3 root at x(Q), checked by the
    group law. Report the hit-rate ratio of D_x over its complement.
    Repeat on a second ordinary curve. A random subset of size |D_x|
    is the null ratio, which must sit at most 2 or the threshold is
    void.
  controls:
    - the null ratio on a random subset of size |D_x| is at most 2
    - every reported root is checked by the group law
    - a second ordinary curve
    - y^2 = x^3 + x + 1 is excluded
    - "|F| is at least 2, or the cell is void"
  falsification_conditions:
    - >-
      The hit-rate ratio is strictly above 2 on both ordinary curves,
      and the random-subset null ratio is at most 2.
    - >-
      The null ratio on the random subset is above 2. The threshold is
      then void, and the D_x ratio is not evidence.
  confounders:
    - >-
      F is itself an interval of small x, so D_x and F overlap. Points
      of F are removed from both the numerator and the complement
      before the ratio is formed.
    - >-
      Negation preserves x, so a hit at Q is a hit at -Q. Each
      negation pair is counted once.
  interpretation_limits:
    - >-
      A ratio at most 2 does not say that no factor base favours D_x.
      It prices this interval factor base at this toy N.
    - >-
      A ratio above 2 would falsify this claim and would not yet be a
      relation-collection algorithm.
    - >-
      The integer is a hit count. It is not the total degree of an S_3
      system, not an orbit-substituted monomial count, and not the
      interpolation degree of IDEA-20261006-4c39d3.
  heuristic_assumptions:
    - id: H1
      statement: >-
        At N in (2^{10}, 2^{12}), S_3 hits of an interval factor base
        of size ceil(N^{1/3}) fall on D_x at most twice as often as on
        the complement, matching a random subset of the same size up
        to that factor.
      rigorous_support: >-
        No smoothness theorem is invoked. The null is an empirical
        random subset of the same subgroup, not a Dickman law. H1 is
        checked at the toy size and is not transferred to N = 2^{256}.
      validation_plan: >-
        Compute the null ratio on one random subset per curve. H1's
        threshold is void if that null ratio exceeds 2. Otherwise the
        ordinary ratio is compared with 2. Sample size is the whole
        subgroup, minus F.
  target_complexity:
    time_exponent: >-
      Unchanged at N^{1/2}. A hit-rate ratio of 2 would be a constant
      on relation yield, not an exponent.
    memory_exponent: >-
      Unchanged. The factor base has size about N^{1/3} and is stored
      only as the instrument.
    best_known: >-
      KR-RHO-13bf67 for the generic bound, and KR-IC-73db3f for
      subspace factor bases on binary fields. Both files were opened.
      Neither states this prime-field hit-rate ratio.
    hidden_overhead: >-
      No o(1) term is claimed. The hit bit is an integer 0 or 1.
    tradeoff_note: >-
      Index calculus trades factor-base size against relation yield.
      This test freezes the size at ceil(N^{1/3}) and asks only
      whether D_x is richer than its complement. It does not build
      the linear system.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-IC-f5c584
      - KR-IC-73db3f
      - KR-RHO-13bf67
    nearest:
      - ref: KR-IC-f5c584
        provenance: internal
        verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-f5c584.yaml
        relation: orthogonal
        delta: >-
          The row's integer is a first fall degree of 2 after Weil
          descent to F_2. This proposal's integer is a hit-rate ratio
          on a prime-field interval, claimed at most 2. There is no
          descent and no monomial count. The ECDLP exponent stays 1/2.
      - ref: KR-IC-73db3f
        provenance: internal
        verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-73db3f.yaml
        relation: adjacent
        delta: >-
          The row chooses an F_2-subspace factor base to shrink product
          spaces. This factor base is an interval of integer x on a
          prime field, and the measured quantity is a hit-rate ratio
          rather than a degree.
  dominated_by: >-
    KR-RHO-13bf67 dominates the generic operation count. A relation
    collector that does not beat rho on this toy group is dominated by
    that bound. KR-IC-73db3f dominates the binary-field subspace
    choice and does not price this prime-field interval. The gap that
    remains is whether some other factor base favours D_x. This
    proposal prices one hit rate and does not close that gap.
  sota_delta: >-
    Zero change to the exponent 1/2. The integer measured is a hit-rate
    ratio, claimed at most 2. No precomputation term in KR-RHO-ea34b8
    is reduced, and no first-fall degree is reported.
