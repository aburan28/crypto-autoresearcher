idea:
  id: IDEA-20260805-c8524f
  question_id: RQ-ICEX-001
  added: '2026-08-05'
  title: >-
    The frozen ICEX exponent observable is a ratio, not a slope:
    alpha = log C / log ell is unit-covariant and constant-contaminated, and
    applying the goal's own frozen estimator to the goal's own matched
    Pollard-rho control returns a tight CI that EXCLUDES 1/2 -- from below at
    the program's 0.886 convention and from above at the 1.2533 convention --
    for an algorithm whose true exponent is exactly 1/2
  class: control

  claim: >-
    GOAL-ICEX-001 has exactly one completion criterion: a Coordinator decision
    on "whether the charged toy IC exponent alpha has a CI excluding 1/2 within
    declared scope". The estimator that criterion is evaluated by is frozen in
    coordination/goals/GOAL-ICEX-001/batches/BATCH-001/tasks/TASK-20260731-021/
    ic_exponent_protocol.yaml, exponent_definition.per_coordinate_formula:
      alpha_coord[c] := log(C_IC[c]) / log(ell),
    with confidence_interval_rule "Across sealed replicas (minimum 3), compute a
    predeclared CI for alpha_primary", and seeds.replications_per_cell_minimum
    = 3 with replica_index inside cell_id. The CI is therefore a WITHIN-CELL CI
    at a SINGLE ell. Three consequences follow by algebra alone, before any run:
    (1) UNIT COVARIANCE. If the true cost law is C[c] = A_c * ell^{a_c}, then
    alpha_coord[c] = a_c + log(A_c)/log(ell). Rescaling the unit of the
    coordinate, C -> lambda C, sends alpha -> alpha + log(lambda)/log(ell). The
    protocol's own primary_coordinate_rule names "cpu_time_ns" as an admissible
    primary coordinate, and its additive_coordinates list is
    [cpu_time_ns, group_operations_by_declared_type, io_read_bytes,
    io_write_bytes, communication_sent_bytes, communication_received_bytes] --
    five of six carry units. Recording cpu_time in seconds instead of
    nanoseconds moves alpha by -log2(10^9)/n, i.e. by -3.737 at n=8 bits,
    -2.990 at n=10, -2.491 at n=12, -1.869 at n=16 (n = log2 ell). The SAME
    campaign yields "alpha far above 1/2" or "alpha far below 1/2" according to
    which unit was written down. A quantity that changes when you rename the
    unit is not an exponent.
    (2) THE NULL FAILS, AND IT FAILS TOWARD "SUCCESS". Pollard rho's exponent in
    group operations is exactly 1/2 by construction; it is the goal's own
    matched control (controls.CTRL-MATCHED-RHO). Under the frozen estimator its
    alpha is 1/2 + log2(A_rho)/n. This program's committed baseline convention
    is A_rho = 0.886 = sqrt(pi/4) (rho with negation; KN-TECH-035 "Why this
    program needs it", H-YIELD-001, H-DS-001, H-IT-001, GOAL-ECDLP-001), giving
    FORCED alpha_rho = 0.47822 / 0.48257 / 0.48548 / 0.48911 at n = 8/10/12/16
    -- BELOW 1/2 AT EVERY TOY CELL IN THE PROTOCOL'S OWN LADDER. Under the plain
    convention A_rho = sqrt(pi/2) = 1.2533, also live in this corpus
    (ledger/H-R6-001.yaml line 22 names "1.253 / 0.886 constants" together;
    REVIEW-H100-20260717.md line 95 uses 1.2533 as theory), the forced values
    are 0.54072 / 0.53257 / 0.52715 / 0.52036 -- ABOVE 1/2 at every cell. The
    verdict of the goal's only completion criterion is decided, at toy scale, by
    which of two rho constants this program writes down.
    (3) THE ESTIMATOR SEPARATES OBJECTS THAT SHARE THE PROPERTY IT MEASURES.
    BSGS also has group-operation exponent exactly 1/2. With A_bsgs = 1.5 (full
    baby table of size ceil(sqrt(ell)) plus mean sqrt(ell)/2 giant steps), the
    frozen estimator returns alpha_bsgs - alpha_rho = log2(1.5/1.2533)/n =
    +0.0324 / +0.0259 / +0.0216 / +0.0162 at n = 8/10/12/16. Two ground-truth
    objects with IDENTICAL true exponent are assigned different observables, and
    the gap is of the same order as the effect the goal exists to detect.
    THE REPAIR IS ALREADY IN THE PROTOCOL AND IS NEVER USED: fixture_ladder
    seals four distinct ell (bits 8, 10, 12, 16) and requires >= 3 replicas
    each, and an OLS slope of log C on log ell across those 12 points is
    unit-invariant by construction -- a unit change moves the intercept and
    leaves the slope untouched. No word in the 905-line protocol fits anything
    across cells; grep for slope/regress/fit returns nothing.
    NOTHING HERE IS AN ATTACK, A COST IMPROVEMENT, OR AN ECDLP CLAIM. It is an
    audit of one formula in one frozen design artifact, and its whole content is
    that the goal's completion criterion is not currently well-posed.

  object_first_candidate:
    tracked_object: >-
      The PAIR (log A_c, a_c) -- the intercept and the slope of the charged cost
      law in log-log coordinates -- followed through the protocol's estimator.
      The protocol's alpha_coord is the image of this pair under the map
      (log A, a) -> a + log A / log ell. That map is NOT injective on the pair
      and is NOT constant in log A; it is the composition of the thing we want
      (a) with a nuisance term that is large at toy ell. The object being
      tracked is therefore the nuisance term itself, log A / log ell, and the
      question is whether the instrument can separate it from a.
    established_families_off_limits: >-
      Off-limits as the primary lens for this proposal: Semaev summation
      polynomials and any decomposition/relation mechanism; Groebner /
      solving-degree instrumentation; factor-base geometry (Sidon, AP,
      small-x, structured supports); descent trees; endomorphism / GLV /
      isogeny leverage; multi-target amortization; xedni / lifting; incidence
      and sum-product bounds; spectral/expander framings; large-prime
      variations. This proposal proposes NO cryptanalytic mechanism at all and
      must not be read as one. The only family it uses is generic-algorithm
      cost accounting, and it uses it as the INSTRUMENT UNDER TEST rather than
      as a tool.
    newness_score: >-
      The algebra (log C = log A + a log ell) is trivial and certainly known to
      anyone who has fitted a power law. What is not in this corpus is its
      application as a pre-registered forced value against THIS goal's frozen
      estimator, with the matched rho control used as the null that fails.
      The nearest prior art is IDEA-20260802-007, and the distinction is exact
      and load-bearing: 007 repairs WHAT IS COUNTED (charged units, amortization
      policy, matched frontiers as mandatory outputs) and retires wall clock as
      a decision variable. It does not touch HOW A COUNT BECOMES AN EXPONENT.
      A perfect charged-unit library as specified by 007 leaves alpha =
      log C / log ell unchanged, still unit-covariant on the five unit-carrying
      coordinates, still contaminated by log A / log ell, and still separating
      rho from BSGS. The two proposals are complementary and neither subsumes
      the other; 007 is a prerequisite for this one being worth running on real
      data rather than a competitor to it.
    testability_score: >-
      Maximal, and almost free. Claim (1) is an identity checkable by hand.
      Claim (2) is four numbers, derived above, that a matched rho control run
      in pure Python at 8-16 bits either reproduces or does not; no Sage, no
      sympy, no Groebner, no SDEG/MONO/RELN feed. Claim (3) is a second four
      numbers from a BSGS run of the same shape. A synthetic cost oracle with
      programmable (A, a) decides the whole thing in microseconds.
    survival_score: >-
      The nuisance term survives every stage of the pipeline unchanged, because
      it is an artifact of the estimator and not of the object -- which is
      exactly why it is dangerous. It dies only under a two-parameter fit, and
      the honest limit of that fit is set by the ladder's lever arm, which is
      computed and reported below rather than assumed adequate.

  mechanism: >-
    DERIVED IN THIS RECORD. Every numeric value below was computed in this
    session from the stated closed forms and is labelled SESSION-COMPUTED; each
    is re-derivable by hand and each is re-computed as stage 1 of the paired
    experiment rather than taken on trust.

    SETUP. Let ell be the subgroup order of a sealed ICEX cell and n = log2 ell.
    Let c index a cost coordinate of rank-failure-resource-v1. Model the charged
    cost of an arm by C[c] = A_c * ell^{a_c} * (1 + o(1)), A_c > 0. This is the
    weakest possible model that makes the word "exponent" mean anything; if it
    does not hold, alpha_coord is not an estimator of anything and the objection
    is stronger, not weaker.

    (1) THE IDENTITY. alpha_coord[c] = log C[c] / log ell
                                     = a_c + log(A_c) / log(ell).
    Write B(n) := log2(A_c) / n for the bias in bits. Then:
      - B(n) -> 0 only as n -> infinity, and only at rate 1/n. To hold
        |B| < 0.05 at n = 16 requires |log2 A_c| < 0.8, i.e. A_c in
        [0.574, 1.741]. Any coordinate whose unit is nanoseconds or bytes has
        A_c of order 10^3 to 10^9, hence |B| between 0.6 and 1.9 at n = 16.
      - UNIT COVARIANCE. C -> lambda C gives alpha -> alpha + log2(lambda)/n.
        SESSION-COMPUTED, ns -> s (lambda = 10^-9): delta alpha =
        -log2(10^9)/n = -3.7372 (n=8), -2.9897 (n=10), -2.4914 (n=12),
        -1.8686 (n=16). Bytes -> KiB (lambda = 2^-10): delta alpha = -10/n,
        i.e. -1.25 at n=8. Only group_operations_by_declared_type is
        dimensionless, and even it is convention-covariant: counting
        {add, dbl, mixed_add} as one total versus charging only add moves the
        count by a factor between 1 and about 1.5, i.e. alpha by up to
        log2(1.5)/n = 0.0731 at n = 8.
      - THE DIFFERENCE IS INVARIANT, THE LEVEL IS NOT. For two arms measured in
        the SAME unit at the SAME cell,
          alpha_IC - alpha_base = log(C_IC / C_base) / log(ell),
        in which lambda cancels. This is the only unit-invariant single-cell
        statistic available, and the protocol does not compute it: its
        advantage_predicate_toy tests "primary_CI_entirely_below_1_2", i.e. it
        compares a unit-covariant quantity against a unit-free constant.

    (2) THE FORCED VALUE ON THE NULL. Pollard rho: under the standard birthday
    model for the walk (HEUR-ICEX-R1 below), the survival function of the step
    count is S(t) = exp(-t^2 / (2 ell)), so
      E[steps] = int_0^inf exp(-t^2/(2 ell)) dt = sqrt(pi ell / 2)
               = 1.2533 * sqrt(ell),
    and the true group-operation exponent is exactly 1/2 with A_rho =
    sqrt(pi/2). With the negation map the walk is on ell/2 classes, giving
    A_rho = sqrt(pi/4) = 0.886227, which is THIS PROGRAM'S COMMITTED BASELINE
    CONVENTION (KN-TECH-035: "The program's baseline convention is 0.886*sqrt(n)
    group operations, van Oorschot-Wiener parallelization assumed, fully
    charged"). Hence FORCED, SESSION-COMPUTED, PRE-RUN:
      alpha_rho(n) = 1/2 + log2(A_rho)/n
      A_rho = 0.886227:  0.47822 (n=8), 0.48257 (10), 0.48548 (12), 0.48911 (16)
      A_rho = 1.253314:  0.54072 (n=8), 0.53257 (10), 0.52715 (12), 0.52036 (16)
    Under the program's own convention the MATCHED CONTROL -- the object whose
    exponent is 1/2 by definition -- returns alpha < 1/2 at every cell in the
    protocol's ladder. A within-cell CI over 3 replicas of a k-attempt campaign
    has half-width t_{0.975,2} * sigma_{log2 C} / (n * sqrt(3 k)); with the
    Rayleigh spread derived in (4) and k = 16 this is about 0.070 at n = 8 and
    0.035 at n = 16, so the CI is tight enough to EXCLUDE 1/2 while sitting on
    an object of exponent exactly 1/2. That is the canonical controls-before-
    belief failure: the instrument fires on the null, in the direction that
    reads as success.

    (3) THE COLLISION, INVERTED. BSGS has group-operation exponent exactly 1/2
    too. For the implementation "build the full baby table of ceil(sqrt(ell))
    entries, then take giant steps until a hit", the expected total is
    sqrt(ell) + sqrt(ell)/2 = 1.5 sqrt(ell), so A_bsgs = 1.5 and
      alpha_bsgs(n) - alpha_rho(n) = log2(1.5 / 1.2533) / n
        = +0.03240 (n=8), +0.02592 (10), +0.02160 (12), +0.01620 (16).
    SESSION-COMPUTED. Inventor-protocol section 8 audit 2 asks whether two
    distinct ground-truth objects share the observable; here the failure is the
    mirror image and is worse for an estimator: one ground-truth property
    (exponent = 1/2) maps to two DIFFERENT observables. A statistic that
    separates rho from BSGS is not measuring the quantity in which they agree.

    (4) THE REPAIR AND ITS HONEST RESOLUTION LIMIT. The invariant estimator is
    the OLS slope of log2 C on n across the ladder, which absorbs log A into the
    intercept and is exactly unit-invariant. Its precision is fixed by the
    ladder, and this is a number the goal can be told BEFORE it runs anything:
    with cells n in {8, 10, 12, 16} and R = 3 replicas each, x-bar = 11.5 and
    S_xx = 3 * (3.5^2 + 1.5^2 + 0.5^2 + 4.5^2) = 105.0, so
      SE(a_hat) = sigma_{log2 C} / sqrt(105) = sigma / 10.247,
    and with t_{0.975,10} = 2.228 a deviation |a - 1/2| = eps is resolvable only
    if sigma_{log2 C} < eps * sqrt(105) / 2.228 = 4.598 * eps. SESSION-COMPUTED:
    eps = 0.20 needs sigma < 0.9198 bits; eps = 0.10 needs sigma < 0.4599;
    eps = 0.05 needs sigma < 0.2300 (cost reproducible to a factor 1.173).
    Now the per-replica spread is also derivable: for the Rayleigh birthday
    model, ln X = ln s + (1/2) ln(2E) with E ~ Exp(1), so Var(ln X) =
    (1/4)(pi^2/6) = 0.411234 and sigma_{log2 X} = 0.925164 BITS for a SINGLE
    rho attempt. Averaging k attempts per replica gives sigma/sqrt(k), so
      k >= (0.925164 / (4.598 eps))^2:  k >= 1.01 for eps = 0.20,
      k >= 4.05 for eps = 0.10, k >= 16.19 for eps = 0.05.
    THE PROTOCOL PINS replications_per_cell_minimum = 3 AND PINS NOTHING ABOUT
    ATTEMPTS PER REPLICA. It is therefore silent on the one parameter that
    decides whether its completion criterion is resolvable at all. Stating
    "k >= 17 attempts per replica to resolve eps = 0.05" is a concrete,
    pre-compute, actionable deliverable that costs nothing.

    (5) WHAT THIS DOES NOT SAY. It does not say the ICEX design is worthless;
    the feed pinning, the no-scalarization rule, the certificate obligations and
    the forbidden-transform list are unaffected and, on this reading, correct.
    It does not say alpha < 1/2 is unreachable. It says the observable named in
    the completion criterion is not an exponent, that its bias is derivable, and
    that a unit-invariant replacement is available inside the ladder the
    protocol already seals.

  novelty_status: unverified

  literature_context:
