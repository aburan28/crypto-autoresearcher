  lossy_projection_identifiability_audit:
    projection: >-
      The full charged campaign record (per-attempt costs at four group orders,
      all coordinates, all terminal codes) --> the single real number
      alpha = log C[c] / log(ell) at one cell, plus a within-cell replica CI.
    what_is_discarded: >-
      Everything about the cost's DEPENDENCE ON ell. The projection is evaluated
      at one ell, so the growth rate -- the only thing an exponent is -- is not
      in the image at all. Also discarded: the coordinate's unit, the terminal
      code of each attempt, the censoring fraction, and the identity of the arm.
    why_genuinely_lossy: >-
      Genuinely and catastrophically lossy: the fibre over an observed alpha at
      a single cell is the entire one-parameter family
      {(A, a) : a + log A / log ell = alpha}, a line in the (log A, a) plane.
      Every point on that line is consistent with the observation, including
      a = 0 and a = 1.
    why_compatible_with_the_operations: >-
      It is fully compatible with the aggregation operation the protocol uses
      (coordinatewise ⊕), which is why the defect is invisible in the artifact:
      alpha is a well-defined, deterministic, reproducible function of a sealed
      campaign. Reproducibility is not identifiability. This is the case the
      lossy-projection test is least equipped to reject on its own, and it is
      caught here by the second test.
    is_it_only_a_change_of_coordinates: >-
      No -- and the failure mode checked for is the MIRROR one, the
      IDEA-20260805-e805b6 / KN-TECH-1a5b7e failure rather than the
      (Delta, Pi) = (x XOR y, x*y) failure. The question asked was: does the
      projection retain the target quantity? CHECK RETURNED: it does not. It
      retains a + log A/log ell, and at toy ell the second term is comparable to
      or larger than the first, so the comparator's spread across arms is driven
      by the nuisance term. The diagnostic that settles it is the one this
      program has: ask what the measured quantity SHOULD do as the parameter
      meant to destroy the contamination (ell) increases. A genuine exponent
      estimator returns the SAME value at every cell. The frozen one must return
      a value drifting toward the truth exactly as 1/n. The pre-registered test
      is a regression of alpha(n) - 1/2 on 1/n across the four cells: forced
      slope log2(A), forced intercept 0. If alpha(n) is instead flat, this whole
      objection is wrong and is withdrawn.

  assumptions:
    - >-
      That the frozen protocol's alpha is evaluated per cell. Supported by
      log(ell) appearing in the formula and by replica indices living inside
      cell_id, but an ALTERNATIVE READING EXISTS and is recorded rather than
      dismissed: a reviewer might intend an informal across-cell comparison of
      the four alphas. Under that reading the unit-covariance objection is
      UNCHANGED (every alpha shifts, and the shifts differ by cell because the
      shift is log lambda / n), the rho/BSGS separation is UNCHANGED, and the
      only thing that changes is that the protocol still pins no estimator and
      no CI for the across-cell quantity. Stage 0 of the paired experiment
      records which reading the Coordinator holds BEFORE any number is produced.
    - >-
      That C = A * ell^a is an adequate local model over an 8-bit lever arm. If
      the true law carries a subexponential or log-correction factor, the OLS
      slope is itself biased by curvature; this is named as a confounder and
      bounded rather than assumed away.

  proof_search_map_note: >-
    The paired hypothesis H-ICEX-4ccbaa carries the filled proof_search_map for
    this proposal; it is not duplicated here.

  predictions:
    - metric: >-
        unit_covariance_delta: alpha computed on the same rho campaign with
        cpu_time recorded in nanoseconds minus alpha with the same campaign
        recorded in seconds, at n = 12
      direction: different
      minimum_effect: >-
        EXACTLY +2.4914 = log2(10^9)/12, to within floating-point tolerance
        1e-9. Derived before any run. If the measured difference is 0, alpha is
        unit-invariant, the identity in mechanism (1) is wrong, and this
        proposal is falsified outright.
    - metric: >-
        alpha_rho(n) under the frozen estimator on the group-operation
        coordinate, matched rho control, A_rho = 0.886227 convention, at
        n = 8, 10, 12, 16
      direction: lower
      minimum_effect: >-
        FORCED VALUES 0.47822 / 0.48257 / 0.48548 / 0.48911, each predicted to
        within the replica CI. All four BELOW 1/2. If any measured alpha_rho CI
        contains 1/2 at k >= 16 attempts per replica, the "the null fails"
        claim is falsified at that cell and must be reported as such.
    - metric: >-
        alpha_bsgs(n) - alpha_rho(n) on the group-operation coordinate, same
        cells, same units
      direction: higher
      minimum_effect: >-
        FORCED +0.03240 / +0.02592 / +0.02160 / +0.01620 at n = 8/10/12/16,
        i.e. exactly log2(A_bsgs/A_rho)/n with A_bsgs/A_rho measured from the
        two implementations' own mean op counts. The FORM is the prediction:
        the gap must be inversely proportional to n with R^2 > 0.95. A gap
        independent of n, or a gap of zero, falsifies the mechanism.
    - metric: >-
        R^2 of the regression of (alpha_arm(n) - 1/2) on 1/n, arm in
        {rho, bsgs}, four points each, and the fitted intercept
      direction: higher
      minimum_effect: >-
        R^2 >= 0.95 and fitted intercept within +/- 0.01 of 0. This is the
        structural-tell test: contamination that decays exactly as 1/n is the
        signature of the constant term. A flat alpha(n) refutes the whole
        mechanism; an intercept significantly different from 0 means the true
        exponent is not 1/2 and the arm was mis-modelled.
    - metric: >-
        Slope estimator recovery on the synthetic cost oracle: |a_hat - a_true|
        over the grid a_true in {0.40, 0.45, 0.50, 0.55, 0.60} crossed with
        A in {1, 10^3, 10^9}, on the protocol's own ladder shape
      direction: lower
      minimum_effect: >-
        |a_hat - a_true| < 0.01 for EVERY one of the 15 cells, INDEPENDENT of
        A. Simultaneously, the frozen single-cell estimator must return
        a_true + log2(A)/n, i.e. it must exceed 1/2 at every cell for every
        a_true in the grid when A = 10^9 (min excess log2(10^9)/16 - 0.10 =
        1.769). Both halves are exact arithmetic; both are checkable in
        microseconds; either failing falsifies the account.
    - metric: >-
        attempts_per_replica_floor k such that the ladder resolves
        |a - 1/2| = 0.05 at 95 per cent, computed from the MEASURED
        sigma_{log2 C} rather than the Rayleigh model
      direction: different
      minimum_effect: >-
        Predicted 17 (from sigma = 0.925164 bits and the derived threshold
        0.2300). Reported as a number whatever it is; a value far below 17 means
        the charged cost is much more concentrated than the birthday model and
        the ladder is in better shape than derived, which is a useful result in
        the opposite direction.

  minimal_test:
    design: >-
      Five stages, strictly cheapest-first, each able to terminate the line.
      STAGE 0 (zero compute, minutes): record from the Coordinator which reading
      of alpha is intended (per-cell vs across-cell) and whether cpu_time_ns or
      group_operations is the intended primary coordinate. If the answer is
      "across-cell OLS slope on group operations", the unit objection is void
      for the primary coordinate and the proposal collapses to the resolution
      -limit deliverable alone -- which is still worth the remaining hour, and
      saying so here prevents the audit from surviving on ambiguity.
      STAGE 1 (zero compute, minutes): re-derive by hand every SESSION-COMPUTED
      number in mechanism (1)-(4). Any disagreement halts the line.
      STAGE 2 (microseconds): synthetic cost oracle C = round(A * ell^a) on the
      exact ladder n in {8,10,12,16} x 3 replicas; run both estimators over the
      15-cell (a, A) grid. Pure integer/float arithmetic, no dependency.
      STAGE 3 (seconds to minutes, pure Python 3, no numpy required): matched
      Pollard rho (both with and without negation) and BSGS on deterministic
      toy prime-field curves at the ladder bit sizes, group-operation counters
      only, k attempts per replica with k reported. Measure alpha under the
      frozen estimator, the 1/n regression, and the slope estimator.
      STAGE 4 (minutes): report the resolution floor, the attempts-per-replica
      requirement, and the unit-invariant single-cell alternative
      log(C_IC/C_rho)/log(ell).
    controls:
      - >-
        NULL OBJECT (same shape, forced value pre-derived, CAN FAIL) -- the
        MATCHED POLLARD RHO CONTROL ITSELF, which the ICEX protocol already
        mandates as CTRL-MATCHED-RHO. Its true group-operation exponent is
        exactly 1/2. FORCED VALUES under the frozen estimator, derived before
        the run: 0.47822 / 0.48257 / 0.48548 / 0.48911 (A = 0.886) or
        0.54072 / 0.53257 / 0.52715 / 0.52036 (A = 1.2533). This null can
        genuinely fail: if the frozen estimator returned CIs containing 1/2 at
        every cell, the instrument would be vindicated and this proposal dead.
      - >-
        POSITIVE CONTROL / INSTRUMENT-SENSITIVITY DEMONSTRATION (if it does not
        fire, NO negative may be reported) -- the SLOPE estimator on the same
        rho data must return a_hat with CI containing 1/2 at every ladder
        configuration, and must return a_hat within 0.01 of a_true on all 15
        synthetic cells. If the slope estimator cannot recover a known exponent
        from data whose exponent is known by construction, the analysis
        pipeline is broken and nothing may be concluded about the frozen one.
      - >-
        GRADED CONTROL, 5 INTERIOR POINTS, MONOTONICITY REPORTED -- the
        synthetic oracle's A-ladder A in {1, 10, 10^3, 10^6, 10^9} at fixed
        a = 0.50. FORCED: the frozen estimator returns 0.5 + log2(A)/n, i.e. at
        n = 12: 0.5000, 0.7768, 1.3300, 2.1610, 2.9920 -- strictly increasing,
        with equal steps in log A. The slope estimator must return 0.500 at all
        five. A frozen-estimator response that is NOT monotone in A, or a slope
        response that IS, localises the defect elsewhere and the account must be
        revised rather than defended.
      - >-
        NEARBY-OBJECT CONTROL (the closest object where the hoped-for conclusion
        fails) -- BSGS. It shares the exponent 1/2 with rho and differs only in
        its constant. A statistic claiming to measure the exponent must not
        separate them. FORCED separation under the frozen estimator: +0.0324 at
        n=8 falling as 1/n. If the frozen estimator does NOT separate them, the
        constant-contamination account is wrong.
      - >-
        ARCHIVE CHECK (zero compute). Every prior measurement in this corpus of
        the same observable, listed. NOT AVAILABLE: EV-ICEX-001 records that no
        ICEX measurement has ever been executed and that the protocol PASS was
        design-only. The unavailability is recorded here rather than reported as
        a passed check.
      - >-
        VERDICT-ON-THE-NULL-FIRST (ordering control). The frozen decision rule
        "CI excludes 1/2" is executed and written down on the rho arm BEFORE the
        BSGS arm or any synthetic treatment is looked at. If it emits the same
        label on both arms, it discriminates nothing between them and that fact
        is the result.

  falsification_conditions:
    - >-
      alpha proves unit-invariant, i.e. the measured ns-vs-s difference at
      n = 12 is not log2(10^9)/12 = 2.4914. The identity is wrong and the
      proposal is withdrawn as a superseding record.
    - >-
      alpha(n) for the rho arm is flat in n rather than approaching 1/2 as
      c/n with R^2 >= 0.95. The constant-contamination mechanism is refuted.
    - >-
      alpha_rho CIs contain 1/2 at every cell with k >= 16 attempts per replica.
      The null does not fail and the headline is void.
    - >-
      The frozen estimator does not separate rho from BSGS at the derived
      magnitudes. Prediction (3) is refuted.
    - >-
      The slope estimator fails to recover a_true on the synthetic grid. NO
      negative may be reported at all; the finding is an implementation defect
      in the analysis, an infrastructure signal, not evidence about the
      protocol (AGENTS.md rule 5).
    - >-
      The Coordinator's stage-0 answer is that alpha was always intended as an
      across-cell slope on the dimensionless coordinate. The unit half of the
      objection is void and only the resolution-limit deliverable survives.

  confounders:
    - >-
      IMPLEMENTATION CONSTANT VS THEORY CONSTANT. A_rho for a real
      implementation is not exactly sqrt(pi/2); tail truncation, distinguished
      -point spacing, and the per-step operation count all move it. The
      experiment therefore measures A_rho from its own mean op count and uses
      the theory value only as the pre-registered prediction, never as a
      substitute for measurement.
    - >-
      CURVATURE OVER THE LEVER ARM. If the true cost law has a log-correction,
      the OLS slope over n in [8,16] is biased. This is bounded by re-fitting on
      the three-cell sub-ladders {8,10,12} and {10,12,16} and reporting the
      spread of slopes as a curvature diagnostic; a large spread means the
      ladder is too short for ANY slope claim and that is the honest finding.
    - >-
      GROUP-ORDER VS BIT SIZE. ell is not exactly 2^bits. All arithmetic uses
      the actual sealed ell, and the discrepancy log2(ell) - bits is reported
      per cell; at 8 bits a 20 per cent shortfall in ell moves n by 0.32 and
      alpha by about 0.02, which is not negligible relative to the effect.
    - >-
      SELF-SERVING CRITICISM. Auditing someone else's estimator is cheap to
      produce and reads as rigour. The design answers this with a null that can
      exonerate the estimator, a positive control that can invalidate the
      auditor's own analysis, and a stage-0 gate that can void the headline
      before any number is produced.
    - >-
      SCOPE CREEP INTO THE ICEX MEASUREMENT BAN. GOAL-ICEX-001's next_action and
      DEC-20260731-015 / EV-ICEX-001 forbid ICEX measurement. Nothing here
      consumes an SDEG, MONO, or RELN feed, assembles C_IC, runs a relation
      campaign, or produces an IC number. The rho and BSGS arms are generic
      baselines; the treatment is a synthetic oracle. That separation is a
      design constraint, not a convenience, and any drift across it invalidates
      the package.

  interpretation_limits:
    - >-
      A confirming outcome establishes that ONE FORMULA in ONE frozen design
      artifact is not an exponent estimator at the tested ladder. It does not
      establish that index calculus does or does not beat rho, does not close
      or advance KN-OPEN-001, does not move any exponent, and does not license
      any status change to GOAL-ICEX-001, RQ-ICEX-001, or EV-ICEX-001. Those
      are Coordinator decisions.
    - >-
      The protocol is not superseded, edited, or invalidated by this proposal.
      A correction, if warranted, is a NEW record under a new id naming the
      exact clause, per AGENTS.md rule 4.
    - >-
      Toy tier throughout, and it cannot be raised: the ladder is 8-16 bits and
      the arms are generic algorithms. Nothing transfers to crypto scale, and
      the resolution-limit result in particular is a statement about THIS
      ladder, not about exponent estimation in general.
    - >-
      The rho constant question (0.886 vs 1.2533) is REPORTED AS A LIVE
      DISAGREEMENT IN THIS CORPUS, not adjudicated. Both records that carry them
      remain valid; picking one would be exactly the failure AGENTS.md's
      retrieval policy item 7 forbids.

  heuristic_assumptions:
    - id: HEUR-ICEX-R1
      statement: >-
        The Pollard-rho walk on a cyclic group of order ell behaves as a uniform
        random function on its state space, so the number of steps to the first
        repeat has survival function S(t) = exp(-t^2 / (2 ell)) (1 + o(1)),
        giving E[steps] = sqrt(pi ell / 2) and Var(ln steps) = pi^2 / 24.
      rigorous_support: >-
        The functional form is the standard birthday computation and is DERIVED
        in this record from S(t), not imported: E[X] = int_0^inf S(t) dt, and
        ln X = ln s + (1/2) ln(2E) with E ~ Exp(1) gives Var(ln X) =
        (1/4) Var(ln E) = pi^2 / 24. What is HEURISTIC is only the step from a
        structured r-adding walk to a uniform random function; that step is
        known to be imperfect for small r and no source is cited for it here.
      validation_plan: >-
        Stage 3 measures the empirical mean and the empirical sd of log2(steps)
        directly at all four cells and reports them against 1.2533 sqrt(ell) and
        0.9252 bits. This heuristic is LOAD-BEARING ONLY FOR THE PREDICTED
        NUMBERS, not for the identity in mechanism (1): the unit-covariance
        result holds for any cost law whatsoever.
    - id: HEUR-ICEX-R2
      statement: >-
        Over the tested lever arm n in [8, 16], the charged cost of each arm is
        adequately modelled by C = A * ell^a with a single constant a (no
        curvature).
      rigorous_support: >-
        NONE. This is exactly the assumption the OLS repair requires and it is
        recorded as the repair's own weakest link rather than presented as safe.
        For rho it is provable (the cost is exactly Theta(sqrt(ell))); for a
        real IC pipeline it is false in principle, since subexponential
        behaviour is not a power law at all.
      validation_plan: >-
        Sub-ladder refits {8,10,12} vs {10,12,16} with the slope spread reported
        as a curvature diagnostic; if the spread exceeds the effect size, the
        deliverable is "this ladder cannot support a slope claim", stated with
        its boundary.

  target_complexity:
    time_exponent: >-
      n/a for this audit. NO EXPONENT IS MOVED AND NONE IS CLAIMED. The proposal
      moves no attack cost and offers no algorithm. What it does is decide
      whether the quantity in this goal's completion criterion is capable of
      carrying an exponent claim at all, which is a prerequisite for the lane
      rather than a result in it.
    memory_exponent: n/a -- no algorithm proposed.
    best_known: >-
      The incumbent for prime-field ECDLP remains Pollard rho at 0.886 sqrt(N)
      group operations (this program's convention, KN-TECH-035), unchanged by
      anything here.
    hidden_overhead: >-
      n/a. The proposal's own cost is stages 0-4 at under one CPU-hour, and it
      is stated rather than hidden.
    tradeoff_note: n/a.

  dominated_by: >-
    n/a (no result claimed). No attack, no cost improvement, no Pareto point, so
    there is no frontier row to be dominated by. ROWS CHECKED, so that this null
    is not the unchecked kind AGENTS.md rule 5 forbids: (i) time -- Pollard rho
    0.886 sqrt(N) and BSGS sqrt(N) processor steps, both unaffected; (ii) memory
    -- rho O(1) / distinguished-point w, BSGS sqrt(N), both unaffected; (iii)
    data/queries -- no oracle model is used and no queries are made; (iv) full
    cost / AT^2 -- KN-TECH-035's n^{2/3+o(1)} for BSGS, unaffected. On the
    METHODOLOGICAL question of how a charged cost becomes an exponent, the
    incumbent inside this corpus is the frozen ICEX formula itself, and the
    nearest adjacent work is IDEA-20260802-007's charged-unit library, which
    operates one layer below and is complementary. A search of
    ledger/proposals for a prior attack on the estimator's functional form found
    none; absence of a search result is not evidence none exists.
  sota_delta: >-
    No attack; measurement and conceptual contribution only. Quantitatively, the
    proposal claims exactly three numbers against the status quo: (a) the
    frozen estimator's unit sensitivity is log2(lambda)/n, worth 2.4914 in alpha
    at n = 12 for an ns-vs-s choice; (b) its bias on an object of known exponent
    1/2 is log2(A)/n, worth -0.02178 to -0.00544 (A = 0.886) or +0.04072 to
    +0.02036 (A = 1.2533) across the ladder, i.e. a verdict flip on the goal's
    sole criterion; (c) the ladder's exponent resolution is SE = sigma / 10.247
    per replica-set, requiring 17 attempts per replica to resolve
    |a - 1/2| = 0.05. Zero of these three numbers exists anywhere in this corpus
    today.

  estimated_cost:
    implementation: low
    compute: very low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.90 that the audit's central identity and its forced values survive the
    experiment. It is that high, and not lower, because claims (1) and (3) are
    arithmetic rather than empirical -- alpha's unit covariance is an identity,
    and the rho/BSGS separation follows from two constants both of which are
    measurable in the same run -- and because the frozen protocol text was read
    in full this session and contains no cross-cell estimator anywhere. It is
    not higher because three things could still void the headline: the
    Coordinator may declare the across-cell reading (stage 0, and the record is
    designed to lose gracefully if so); the measured A_rho for a real
    implementation may differ enough from the theory constant that the specific
    forced values miss while the mechanism holds; and the whole objection rests
    on a per-cell reading of a formula whose author is not available to confirm
    it. The probability that the WEAKER, unconditional deliverable lands -- the
    resolution floor and the attempts-per-replica requirement, which hold under
    every reading -- is about 0.97.
