      here so a reviewer can check the non-duplication claim rather than take
      it on trust.
    - >-
      The birthday model S(t) = exp(-t^2/(2 ell)) for a random walk on ell
      elements, and E[steps] = sqrt(pi ell / 2), are RECALLED-STANDARD and were
      RE-DERIVED IN THIS RECORD from S(t); no source is cited for them and
