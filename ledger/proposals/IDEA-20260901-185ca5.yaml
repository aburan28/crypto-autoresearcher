  novelty_screen:
    method: >-
      FILESYSTEM, LEDGER AND WEB. The crypto-kb MCP server was not available to
      this session (the orchestrating session's call returned collection
      crypto_knowledge_v1 does not exist, CRYPTO_KB_QDRANT_URL=:memory:).
      Grepped knowledge/ and ledger/ for invariant subspace, nonlinear
      invariant, Beierle, hidden sum, complementation, self-equivalence,
      automorphism group, slide attack, Wernsdorf, imprimitiv, dual cipher.
      Read the dedup list of all 60 AES proposals and the claim blocks of
      IDEA-20260808-ddb522, IDEA-20260805-4bd60c, IDEA-20260828-355431 and
      IDEA-20260828-01fc51. WebSearch located eprint 2017/463 and WebFetch
      retrieved the PDF, read as page images 1-14.
    results: >-
      NO FILED PROPOSAL OR HYPOTHESIS TRACKS W_L(D_K) OR APPLIES THE BCLR
      criterion to AES. Nearest internal records: IDEA-20260828-25fae7 and
      IDEA-20260808-4c309d treat GF(2)-linear relations of the key schedule
      (an annihilator and a key-guessing floor), which are properties of the
      schedule alone and do not involve L-invariance; IDEA-20260807-5ed21f
      studies a permanent-zero incidence set of the schedule; none computes an
      L-module. KN-TECH-070 names invariant attacks as uncovered by the
      wide-trail bound and names KN-LIT-5983 as the resistance argument, but
      records no application to AES. Externally, BCLR apply their criterion to
      Skinny-64, Prince, Mantis-7 and Midori-64 and explicitly do NOT treat
      key-dependent differences; whether any later paper applies the criterion
      per key to AES was NOT resolved this session (no search result surfaced
      one; absence of a result is not evidence). The AES weak-key literature in
      the corpus (KN-LIT-724, Grassi, weak-key subspace trails) concerns the
      whitening key and subspace trails, not BCLR-type invariants.
    verdict: >-
      UNVERIFIED, leaning ADAPTATION. The criterion, the module bound and the
      odd-cycle route are BCLR's; what is not in any record read is the object
      applied per key to AES, the invariant-factor computation of the AES
      linear layer at 128 bits, the exact-formula-versus-schedule comparison as
      a heuristic-validation experiment, and the two-branch reading (closure
      versus argument-unavailability with a codimension floor). No claim of
      novelty against the external literature is made, per RQ-AES-002
      provenance (c).

  object_first_candidate:
    tracked_object: >-
      THE L-INVARIANT SUBSPACE W_L(D_K) generated by the round-key differences,
      followed as a function of (key size, key, number of rounds included), and
      characterised by one integer, its dimension, plus the invariant-factor
      structure of L that bounds it for every key at once. Established families
      declared OFF-LIMITS as the primary lens and not used: differential and
      truncated differential; linear and multidimensional linear; integral,
      square and division property; impossible differential; meet-in-the-middle
      and Demirci-Selcuk; boomerang and retracing boomerang; biclique;
      algebraic and Groebner; yoyo; mixture differential and exchange; subspace
      trail; partial sums. The invariant-attack class (invariant subspace,
      nonlinear invariant) is ADJACENT to subspace trails and is used here ONLY
      as the class being closed, never as a lens; the lens is the module
      structure of the key schedule under L.
    lossiness: >-
      PASSES THE LOSSY-PROJECTION TEST, AND IN THE RIGHT DIRECTION. The
      projection K -> W_L(D_K) discards the key itself (2^128 keys map to a
      set of subspaces of GF(2)^128, and the dimension alone takes at most 129
      values), it discards the S-box entirely, and it discards which
      difference generated which cyclic piece. What it retains propagates
      deterministically under the target's operations in the only sense
      needed: adding a round adds a difference and can only enlarge the
      subspace (monotone in the number of rounds), applying L leaves it
      invariant by construction, and it is independent of the plaintext. It
      cannot collapse to a change of coordinates because it is not injective
      on keys. It is not an attack object; it is an obstruction object whose
      value bounds every attack in the named class.
    propagation: >-
      ONE-STEP PROPAGATION IS EXACT. Including round r adds the vector
      K_r xor K_1 and replaces W by W + W_L(K_r xor K_1); the dimension
      increment is the degree of the order polynomial of K_r xor K_1 modulo
      the current subspace, at most deg Min_L, and exactly computable. The
      profile dim(t) for t = 1..N_r - 2 is the record's structural-tell
      instrument: it must be non-decreasing and, under H1, must follow the
      exact random-generation curve; a profile that saturates early below
      127 is the argument-unavailability outcome, and a profile that
      saturates early AT the random curve's plateau is the closure outcome.
    survival_score: >-
      The object exists at every round count and every key size; it does not
      dissolve with rounds, it grows. It dissolves in exactly two named
      places: (i) if deg Min_L is small the object is capped below 127 for
      every key and the closure cannot fire, which is itself the result; (ii)
      the closure it supports covers only invariants that are separately
      S-invariant and L-invariant, so whole-round invariants survive it, and
      that boundary is written into the method ceiling.

  proof_search_map:
    bottleneck: >-
      Existence of a non-constant Boolean function g on GF(2)^128 that is an
      invariant of the AES S-box layer and of Add_{K_i} o L for every i, for a
      given key K. Removing it (proving none exists) closes the nonlinear
      invariant and invariant subspace attacks of the separately-invariant
      type at the full round count for that key. The exact step that decides
      the cost is whether dim W_L(D_K) reaches 127, and that is decided by the
      invariant factors of L (universal) and by H1 (per key).
    baseline_embedding:
      parameter_slice: >-
        INTERNAL FIXTURE, EXACT: restrict L to MixColumns on one column
        (32 bits); Min_MC = (X+1)^4, so dim W_MC(c) <= 4 for every c and the
        maximal dimension 4 is achieved (KN-FIND-028 kernel dimensions
        4, 1, 2, 1). EXTERNAL FIXTURE, BCLR's own: Midori-64 with
        D = round-constant differences gives W_L(D) = {0000, 0001}^16 of
        dimension 16, and Skinny-64 with their four differences gives 64; the
        pipeline reproduces at least the Midori-64 figure from an in-repo
        implementation of Midori's linear layer before any AES number is read.
      reproduction_check: >-
        A frozen regression fixture containing (a) the 32x32 GF(2) matrix of
        MixColumns with its computed minimal polynomial and the dimensions of
        W_MC(c) for 1000 random c, all <= 4 with maximum 4 attained; (b) the
        Midori-64 W_L(D) dimension 16. A mismatch on (a) means the L-matrix
        construction or the order-polynomial routine is wrong; a mismatch on
        (b) means the invariant-subspace generator is wrong. Neither AES
        figure is read until both match.
    observation_collision:
      observable: >-
        dim W_L(D_K), an integer in [0, 128], and the invariant-factor
        multiset of L. The conclusion (no BCLR-type invariant for key K) is
        monotone in the observable: any two keys with the same dimension get
        the same verdict, and that is correct because the verdict depends on
        the key only through the subspace.
      distinct_preimage_search: >-
        THE COLLISION THAT MATTERS IS ACROSS S-BOXES, NOT ACROSS KEYS. The
        observable ignores the S-box entirely, so two ciphers with the same
        (L, D_K) and different S-boxes share it. On one side, real AES; on the
        other, the same L and schedule-shaped differences with an S-box that
        HAS a non-trivial invariant under S alone. If dim W_L(D_K) >= 127 the
        verdict is the same for both (no invariant that is also L-invariant
        with those differences), and that is a correct consequence of
        Proposition 2, not a failure: it says the closure is S-box-independent
        exactly as BCLR state for Skinny-64. The collision to worry about is
        the converse: dimension below 127 with and without an S-box invariant
        collide on the observable while differing in the truth, which is why
        the tail keys are NOT closed by the dimension alone and go to the
        odd-cycle route.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move from Boolean invariants of a 128-bit map to GF(2)[X]-module
          membership: the existence question becomes an inequality on the
          dimension of a submodule generated by t explicit vectors, with
          separate obligations for encoding (L as a 128x128 matrix, verified
          against the pinned harness), completeness (Proposition 1's
          containment LS(g) >= W_L(D_K)), soundness (Proposition 2's degree
          bound), transfer (per-key statement via H1), and cost loss (none;
          the reduction is exact).
        predicted_gain: >-
          A closure for an attack class at the full round count from a
          computation that costs seconds per key, or an exact structural
          constant (the invariant factors of the AES linear layer) showing why
          the argument cannot apply, either recorded as a committed artifact.
      - transform: specialization_pack
        proposed_object: >-
          The per-round dimension increment profile dim(t), packed over
          disjoint cyclic pieces (primary components of the module) so that
          the exact generating probability is a product over components, each
          charged once.
        predicted_gain: >-
          Turns the single number dim into a component-wise diagnostic that
          says WHICH invariant factor the schedule fails to generate when it
          does, which is what the tail-key route needs.
    quantifier_order: >-
      UNIVERSAL PART (rigorous): FOR ALL keys K of a given size, dim W_L(D_K)
      <= S_t, the sum of the first t = N_r - 2 invariant-factor degrees of L.
      CLOSURE PART (per key, conditional on a computation): FOR EACH key K
      with dim W_L(D_K) >= 127, FOR ALL g invariant under the S-box layer and
      under Add_{K_i} o L for all i, g is affine or constant. FRACTION PART
      (heuristic): the fraction of keys satisfying the closure hypothesis is
      P_full computed from the invariant factors, tested by sampling. What is
      NOT claimed: a universal closure over all keys from a sample; the sample
      bounds the fraction with a binomial interval and the universal statement
      is only the bound S_t. The witness g is allowed to depend on K; the
      closure must hold for every g for that K, and Proposition 2 delivers
      exactly that order.
    method_ceiling:
      strongest_certifiable_claim: >-
        For every key in the measured full-dimension set, no non-trivial
        Boolean function is simultaneously an invariant of the AES S-box layer
        and of every Add_{K_i} o L, at the full round count, for the key size
        tested. Cannot certify: absence of invariants of the whole round
        function that are not separately S- and L-invariant; absence of
        invariants over a subset of rounds; anything about keys outside the
        measured set except through the universal bound; anything about the
        published state of the art.
      nearby_object_control: >-
        THE IDENTICAL-ROUND-KEY CIPHER, K_i = K for all i, so D_K = {0} and
        dim W_L(D_K) = 0. On that object the closure hypothesis fails for
        every key, and invariants of the S-box layer that are also L-invariant
        (g in U(S) with LS(g) L-invariant, existing for suitable S) become
        invariants of the whole cipher. The method must return NO CLOSURE on
        it. A second nearby object, AES with a Prince-like schedule K_i = K
        xor Rcon_i (the real Rcon in word 0 only), has D = {Rcon_i xor Rcon_j}
        confined to one byte position, and its dim W_L(D) is predicted small;
        the method must return a specific small number there, not 128, which
        is a sensitivity check that the routine is not saturating for trivial
        reasons.
    proof_obligations:
      - claim: >-
          The 128x128 GF(2) matrix L equals MixColumns o ShiftRows of the
          pinned harness on all of 10^4 random states.
        responsibility: baseline
      - claim: >-
          Min_MC = (X+1)^4 and dim W_MC(c) <= 4 with equality attained
          (internal fixture); Midori-64 dim W_L(D) = 16 (external fixture).
        responsibility: baseline
      - claim: >-
          Proposition 1 and Lemma 1 of BCLR, re-derived in-repo in one page,
          give LS(g) >= W_L(D_K) for the AES round structure with the last
          round (ShiftRows only) and the whitening key treated as extra
          constraints that can only shrink the set of invariants.
        responsibility: correctness
      - claim: >-
          Proposition 2 of BCLR, re-derived, gives g affine or constant when
          dim W_L(D_K) >= 127, given the AES S-box has no affine component
          (nonlinearity recomputed).
        responsibility: correctness
      - claim: >-
          dim W_L(D_K) <= S_t for all keys, from Theorem 1 of BCLR, with S_t
          computed from the invariant factors of L.
        responsibility: size
      - claim: >-
          Computing the invariant factors of L and dim W_L(D_K) for 10^5 keys
          per key size fits in one producer slot in pure Python.
        responsibility: runtime
      - claim: >-
          H1 holds at the sampled scale, i.e. the empirical dimension
          distribution matches the exact random-generation distribution
          within binomial error.
        responsibility: success_probability
      - claim: >-
          Scope is the separately-invariant class, the three key sizes, the
          full round count, the sampled keys plus the universal bound.
        responsibility: scope
    not_applicable_reason: null

  assumptions:
    - >-
      The pinned FIPS-197 harness (aes_reduced.py, KAT-verified under
      pycryptodome and openssl) is ground truth for MixColumns, ShiftRows, the
      S-box and all three key schedules, with its declared defect set attached
      and not reset.
    - >-
      BCLR's Propositions 1, 2, 4, Lemma 1, Theorem 1 and Corollary 1 are
      re-derived in-repo as a derivation artifact rather than cited as
      authority; each is a short argument and the record halts if any fails
      to re-derive.
    - >-
      Pure-Python GF(2) linear algebra at dimension 128 (integers as bit
      vectors) is fast enough: one order-polynomial computation is at most 128
      matrix-vector products, and 10^5 keys times 14 differences is about
      2 x 10^8 128-bit XOR-and-shift operations, minutes to an hour.

  predictions:
    - metric: >-
        deg_min_poly_L: the degree of the minimal polynomial of L = MC o SR
        over GF(2), and the full invariant-factor degree multiset
      direction: higher
      minimum_effect: >-
        PRE-REGISTERED BRANCH POINT. If deg Min_L >= 13 the record's closure
        branch is live; if deg Min_L <= 12 then S_10 <= 120 < 127 and the
        Proposition-2 closure is unavailable for EVERY AES-128 key, the record
        records the argument-unavailability outcome and reports 128 - S_t as
        the codimension floor for each key size. The author's expectation,
        stated as a prior and not as a result, is that Min_L has degree well
        above 12 because MixColumns entries 02 and 03 generate GF(2^8) and
        ShiftRows couples the four column modules; the MixColumns-only value
        (X+1)^4 shows that the expectation is not automatic.
    - metric: >-
        S_t: the sum of the first t invariant-factor degrees for t = 8, 10, 12
        (AES-128, -192, -256 differences), versus the threshold 127
      direction: higher
      minimum_effect: >-
        S_t >= 127 for the closure branch to be reachable at that key size; an
        S_t below 127 is the universal negative for that key size.
    - metric: >-
        full_dimension_fraction: fraction of 10^5 sampled keys with
        dim W_L(D_K) >= 127, per key size, with a binomial 95 percent interval
      direction: higher
      minimum_effect: >-
        Reported against the exact random-generation probability P_full
        computed from the invariant factors. Agreement within the interval
        supports H1; a shortfall of more than 3 standard errors is a measured
        structural dependency in the schedule and is reported per key size and
        per invariant factor.
    - metric: >-
        dimension_profile_dim(t): the mean dimension after including the first
        t differences, t = 1..N_r - 2, against the exact expected profile under
        H1
      direction: different
      minimum_effect: >-
        Must be non-decreasing (a decrease is a bug). Under H1 it must track
        the exact expected profile within 2 standard errors at every t; an
        early plateau below the random plateau localises the round at which
        the schedule stops generating new L-cyclic directions.
    - metric: >-
        null_match: the same profile and fraction for independent uniformly
        random round keys
      direction: different
      minimum_effect: >-
        Must match the exact formula to within binomial error at every t. A
        mismatch means the exact formula or the generator is wrong and no
        AES number may be read.
    - metric: >-
        nearby_object_dimension: dim W_L(D) for the Prince-like schedule
        K_i = K xor Rcon_i with the real AES Rcon
      direction: lower
      minimum_effect: >-
        Predicted well below 127 (the differences live in one byte position
        and generate at most a few cyclic pieces); a value of 128 here means
        the routine saturates for a trivial reason and is void.
    - metric: >-
        positive_control_recovery: on a designed AES-shaped toy with an S-box
        carrying a known invariant g0 and constants confined to LS(g0), the
        pipeline must report dim W_L(D) < n - 1 AND the odd-cycle route must
        FAIL to prove triviality
      direction: different
      minimum_effect: >-
        Exact: the designed invariant must survive the pipeline. If the
        pipeline closes the toy, it is closing everything and its AES verdict
        is void.
    - metric: >-
        tail_route_outcome: for the sampled keys with dimension below 127, the
        fraction on which BCLR's Proposition-4 plus Algorithm-1 route
        terminates with all invariants constant
      direction: higher
      minimum_effect: >-
        Reported with the codimension at which Algorithm 1 becomes infeasible
        (2^{128 - dim} cosets); keys beyond that codimension are recorded as
        OPEN, never as closed.

  minimal_test:
    design: >-
      FIVE STAGES, ALL ZERO-COMPUTE IN THE CRYPTANALYTIC SENSE AND ALL AT THE
      REAL BLOCK SIZE. STAGE 0 (derivation, no code): re-derive BCLR
      Propositions 1, 2, 4, Lemma 1, Theorem 1 and Corollary 1 in a one-page
      derivation note adapted to the AES round order (whitening key, nine
      MC o SR rounds, final SR-only round), stating explicitly that the extra
      layers only add constraints on g. STAGE 1 (minutes): build L as a
      128x128 GF(2) matrix from the pinned harness, verify on 10^4 random
      states, and run the two baseline fixtures (MixColumns-only, Midori-64).
      STAGE 2 (minutes): compute Min_L, its factorisation over GF(2), the
      invariant factors (rational canonical form via the order polynomials of
      a basis, or Smith form of XI - L), S_t for t = 8, 10, 12, and the exact
      random-generation distribution of dim for t random vectors; PRE-REGISTER
      the branch (closure live or unavailable) from S_t alone before any key is
      sampled. STAGE 3 (under an hour): for each key size sample 10^5 keys from
      a declared seed, expand with the harness, form D_K, compute dim W_L(D_K)
      and the profile dim(t), and compare with the exact distribution; run the
      identical code on independent uniformly random round keys (null) and on
      the Prince-like schedule (nearby object); run the positive-control toy.
      STAGE 4 (conditional): if the closure branch is live, recompute the AES
      S-box nonlinearity (no affine component) and cycle type, apply
      Proposition 2 to every full-dimension key, and run the Proposition-4
      plus Algorithm-1 route on the sampled tail keys up to codimension 20,
      reporting the rest as open. Every stage commits its digest before the
      next reads it.
    controls:
      - >-
        BASELINE FIXTURES (blocking): MixColumns-only dimension cap 4 with
        equality attained, and Midori-64 dimension 16 from an in-repo
        implementation; both must reproduce before any AES value is read.
      - >-
        RANDOM-ROUND-KEY NULL: the same measurement on independent uniformly
        random round keys, which must match the exact formula; this isolates
        the schedule's contribution from the linear layer's.
      - >-
        NEARBY OBJECT, PRINCE-LIKE SCHEDULE: constant differences confined to
        the Rcon byte, predicted small dimension; a saturation there voids the
        instrument.
      - >-
        POSITIVE CONTROL: the designed toy with a known invariant, which the
        pipeline must NOT close.
      - >-
        PRE-REGISTRATION: the branch point (S_t versus 127) and the exact
        distribution are committed before any key is sampled; sample seeds are
        declared in the committed stamp.
      - >-
        TWO-IMPLEMENTATION CHECK ON L: the matrix built from aes_reduced.py is
        cross-checked against MixColumns and ShiftRows re-implemented from the
        FIPS-197 constants independently in the same task, since a wrong L
        would produce a wrong invariant-factor structure silently.
    required_metrics:
      - Min_L, its GF(2) factorisation, and the invariant-factor degree multiset of L
      - S_t for t = 8, 10, 12 and the pre-registered branch verdict per key size
      - exact random-generation distribution of dim for each t, derived in-repo
      - empirical dim distribution and dim(t) profile per key size, with binomial intervals, seeds recorded
      - the same for the random-round-key null and the Prince-like nearby object
      - positive-control outcome (designed invariant survives)
      - AES S-box nonlinearity and cycle type as recomputed
      - per-key closure verdicts for the sampled full-dimension keys and the tail-route outcomes with codimensions
      - derivation note with the six re-derived statements, and artifact manifest with hashes and a rebuild receipt

  falsification_conditions:
    - >-
      deg Min_L <= 12, or S_t < 127 for a key size: the Proposition-2 closure
      is structurally unavailable for every key of that size. This KILLS the
      closure branch and is recorded as an argument-unavailability finding
      with the exact invariant-factor structure and the codimension floor; it
      is a result, not a failure of the record.
    - >-
      The random-round-key null does not match the exact distribution: the
      generator or the formula is wrong; no AES number may be read.
    - >-
      The empirical full-dimension fraction for real keys falls more than 3
      standard errors below the exact formula: H1 is falsified for that key
      size, a measured structural dependency in the schedule exists, and it is
      reported per invariant factor; the closure still holds for every key
      whose dimension is individually at least 127, but the FRACTION claim is
      withdrawn and replaced by the measured one.
    - >-
      The positive-control toy is closed by the pipeline: the instrument
      closes everything and every AES verdict is void.
    - >-
      The nearby Prince-like object reports dimension 128: the routine
      saturates for trivial reasons and is void.
    - >-
      The AES S-box is found to have an affine component or no odd cycle
      (contrary to recollection): Proposition 2 or the tail route,
      respectively, cannot be applied as written and the record must be
      revised before any closure is stated.

  confounders:
    - >-
      THE LAST ROUND HAS NO MIXCOLUMNS AND THE WHITENING KEY IS ADDED BEFORE
      ANY L. BCLR's picture has identical (S, L, Add) rounds. MITIGATION: the
      derivation note treats the extra layers as additional constraints on g
      (an invariant of the full cipher must also be an invariant of the
      sub-cipher consisting of the nine MC o SR rounds), so closing the
      sub-cipher closes the cipher; the direction of the implication is
      written down and is conservative.
    - >-
      THE CHOICE OF BASE ROUND KEY. D_K is defined with differences against
      K_1, but any base gives the same span; the code asserts this on 100
      keys.
    - >-
      THE EXACT FORMULA DEPENDS ON THE PRIMARY DECOMPOSITION, NOT ONLY ON THE
      DEGREE SUM. Two linear layers with the same S_t can have different
      full-dimension probabilities. MITIGATION: the formula is derived from the
      full invariant-factor structure and tested on the random null before
      use.
    - >-
      SAMPLING CANNOT ESTABLISH A UNIVERSAL CLOSURE. A fraction of 1 - epsilon
      leaves 2^128 epsilon keys unclosed. MITIGATION: stated in the quantifier
      order; the universal content is only S_t; the tail is named OPEN beyond
      the codimension Algorithm 1 can reach.
    - >-
      A DIMENSION OF EXACTLY 127 CLOSES BY PROPOSITION 2 BUT THE CASE n - 1
      DESERVES ITS OWN CHECK, since the paper's statement is dim >= n - 1;
      the derivation note re-derives that boundary case explicitly.

  interpretation_limits:
    - >-
      CLAIM TIER toy under RQ-AES-002 R7: this is structural computation and
      a derivation; it produces no key recovery, no distinguisher, no cost
      claim, and reaches at most a C3 barrier statement for the named class.
    - >-
      THE CLASS CLOSED IS THE SEPARATELY-INVARIANT CLASS (invariant under the
      S-box layer and under each Add o L), which BCLR describe as covering all
      published invariant attacks they were aware of in 2017; invariants of
      the whole round function that are not of this form are NOT closed and
      are named as forward guidance, with KN-LIT-2066's generic algorithm as
      the only known tool for the linear special case.
    - >-
      NO RELATION TO THE PUBLISHED STATE OF THE ART IS ASSERTED IN EITHER
      DIRECTION; whether the AES community already regards this class as
      closed for AES is unresolved here and the record does not say it is not.
    - >-
      NOTHING HERE MOVES AN EXPONENT. The construction branch (E) is written
      to define what a positive outcome would mean under CM-1; its prior is
      recorded below as essentially zero.
    - >-
      The recalled S-box cycle type and nonlinearity are recomputed; nothing
      rests on the recollection.

  heuristic_assumptions:
    - id: H1
      statement: >-
        RANDOM-GENERATION HEURISTIC FOR THE KEY SCHEDULE. For a uniformly
        random master key K of a given size, the t = N_r - 2 vectors
        K_i xor K_1 (2 <= i <= N_r - 1) generate the GF(2)[X]-module
        (GF(2)^128, L) with the same probability distribution over dimensions
        as t independent uniformly random vectors of GF(2)^128; in particular
        Pr[dim W_L(D_K) = 128] = P_full(L, t), the exact generating probability
        computed from the invariant factors of L, uniformly over the three key
        sizes.
      rigorous_support: >-
        RIGOROUS INGREDIENT: BCLR Theorem 1 and Corollary 1, which bound
        dim W_L(D_K) by S_t for every key, and the fact that the AES key
        schedule is a bijection on master keys so that the differences are
        not degenerate (K_2 xor K_1 has word 0 equal to
        SubWord(RotWord(K_1[3])) xor Rcon, which is zero for exactly one value
        of K_1[3], hand-derived this session and machine-checked at the gate).
        CLASSICAL DISTRIBUTION IMITATED: the exact probability that t random
        elements generate a finite module over a principal ideal domain,
        which for the cyclic-decomposition of (GF(2)^128, L) is a product over
        primary components of terms of the form 1 - 2^{-(degree) x (count)},
        the same shape as the probability that random elements generate a
        finite abelian group; BCLR's Theorem 2 states such a formula for
        uniformly random constants and it is re-derived in-repo. THE GAP,
        STATED: the differences are highly structured functions of one
        128-bit key (only 32 bits of nonlinearity enter per round of the
        schedule), they are not independent of one another, and the AES-128
        schedule has known GF(2)-linear relations among round-key words;
        H1 is therefore the hypothesis the random-round-key null and the
        dimension profile are designed to test, not a background assumption.
      falsification_condition: >-
        The empirical full-dimension fraction, or any point of the dim(t)
        profile, deviates from the exact formula by more than 3 standard
        errors at 10^5 keys; or the minimum observed dimension is below the
        smallest dimension the exact distribution assigns probability at
        least 10^{-6}.
      validation_plan: >-
        SAMPLE: 10^5 uniformly random master keys per key size from a
        declared seed, expanded with the pinned harness; this is sampling AT
        THE REAL PARAMETERS, so no correspondence or toy reduction is needed
        and no transfer assumption in the block size arises. SHORTCUT: none;
        one dimension computation is at most 14 order-polynomial
        computations of at most 128 steps each. COMPARISON: the empirical
        distribution of dim and the profile dim(t) against the exact
        random-generation distribution computed from the invariant factors;
        the same comparison on the independent-random-round-key null must
        agree to within binomial error, which validates the formula
        independently of AES. TAIL CHECK: the smallest and the second-smallest
        dimensions observed per key size against the exact tail
        probabilities, and the count of keys with dimension exactly 127
        versus 128. TRANSFER: the closure for a sampled key is exact for that
        key; the fraction transfers to the full key space only under H1, and
        the record says so.

  target_complexity:
    time_exponent: >-
      NO ATTACK IS CLAIMED AND NO EXPONENT IS MOVED; the record is a barrier
      instrument and says so, per the search heuristics that require an idea
      whose best case is not exponent-moving to say so and justify itself.
      Justification: RQ-AES-002 names a C3 barrier statement at the section-4
      standard as its most plausible deliverable, and this is the cheapest
      such statement available, at the real block size, for an entire attack
      class. CONSTRUCTION BRANCH (E), CONDITIONAL AND EXPECTED EMPTY: a
      BCLR-type invariant on a key fraction rho would give a distinguisher at
      O(1) AES-equivalents per candidate with about two known pairs, charged
      under CM-1(c) at 1/rho AES-equivalents against the definitional
      reference 2^{k-1}; the published-frontier comparison is unadjudicable.
    memory_exponent: >-
      The instrument uses O(128^2) bits for L and O(128 x t) bits per key;
      negligible. The construction branch would need O(1) memory.
    best_known: >-
      For the definitional reference, exhaustive key search at 2^{k-1}
      AES-k evaluations expected, negligible memory, about two known pairs.
      For the OBSTRUCTION, the best known is nothing: no committed record
      computes the invariant factors of the AES linear layer or
      dim W_L(D_K), and BCLR do not treat AES.
    hidden_overhead: >-
      Nothing hides in an o(1) because no asymptotic is claimed. What is
      hidden and must be reported: Algorithm 1 on tail keys costs 2^{128 - dim}
      coset checks and is feasible only for codimension up to about 20; keys
      beyond that are open, not closed.
    tradeoff_note: >-
      None for the instrument. For the construction branch, the weak-key
      trade is fraction against work: cost/rho with cost O(1), so the only
      quantity that matters is rho, and this record measures whether rho can
      be non-zero at all in the named class.

  dominated_by: >-
    unresolvable in this environment: no primary source reachable; every
    recalled frontier row is unverified-from-memory
  sota_delta: >-
    DEFINITIONAL-REFERENCE DELTA, EXPLICITLY LABELLED: +0. No attack, no cost
    below 2^{k-1} AES-k evaluations is claimed; the record is a barrier
    instrument. PUBLISHED FRONTIER: unadjudicable. What moves, internally and
    quantitatively: the number of committed structural constants of the AES
    linear layer goes from zero to one (the invariant-factor multiset of
    MC o SR at 128 bits), and the number of attack classes with a
    section-4-standard closure or a measured argument-unavailability under
    GOAL-AES-002 goes from zero to one. NOTE ON THE dominated_by STRING: it is
    the RQ-AES-002 R5 mandated value; this session DID retrieve and read three
    primary sources from eprint.iacr.org and iacr.org, which is the R6(i)
    route, but none is frozen under inputs/ and the ruling is not lifted by an
    idea record.

  discriminated_from:
