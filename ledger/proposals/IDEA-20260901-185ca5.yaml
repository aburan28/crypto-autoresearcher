idea:
  id: IDEA-20260901-185ca5
  question_id: RQ-AES-002
  research_question: RQ-AES-002
  goal_id: GOAL-AES-002
  added: '2026-09-01'
  title: >-
    THE L-MODULE GENERATED BY THE ROUND-KEY DIFFERENCES IS THE OBSTRUCTION
    QUANTITY FOR THE WHOLE ROUND-INVARIANT CLASS, AND IT HAS NEVER BEEN COMPUTED
    FOR AES: apply the Beierle-Canteaut-Leander-Rotella criterion PER KEY to
    full-round AES-128/192/256 with L = MixColumns o ShiftRows and
    D_K = {K_i xor K_1}, so that the invariant-factor degrees of L (a rigorous
    one-time computation at REAL parameters) bound dim W_L(D_K) for every key at
    once, the exact random-generation probability supplies the distribution
    heuristic, and the outcome is either a section-4 closure of the
    separately-invariant round-invariant class for all keys outside a computed
    tail, or a KN-FIND-028-style proof that the argument is structurally
    unavailable for AES together with the codimension floor it leaves
  class: mechanism

  claim: >-
    SIX SEPARABLE CLAIMS. (A) THE OBJECT. Let L be the AES linear layer
    MixColumns o ShiftRows viewed as an invertible GF(2)-linear map on
    GF(2)^128, let K_1, ..., K_{N_r - 1} be the round keys that are XORed after
    an L-layer (N_r = 10, 12, 14), and let D_K = {K_i xor K_1 : 2 <= i <=
    N_r - 1}. The tracked object is W_L(D_K), the smallest L-invariant GF(2)
    subspace containing D_K, together with its dimension. By Beierle, Canteaut,
    Leander and Rotella (CRYPTO 2017, eprint 2017/463, READ THIS SESSION), any
    Boolean function g that is an invariant of the S-box layer and of
    Add_{K_i} o L for all i has LS(g) (its linear space) L-invariant and
    containing every K_i xor K_j (their Proposition 1), hence LS(g) contains
    W_L(D_K) (their Lemma 1 and the definition of W_L(D)); and if
    dim W_L(D_K) >= n - 1 = 127 then g is affine or constant, so no non-trivial
    invariant of that type exists unless the S-box has a degree-1 component
    (their Proposition 2). (B) THE RIGOROUS SIZE BOUND. By their Theorem 1 and
    Corollary 1, for t differences dim W_L(D) <= sum of the degrees of the t
    largest invariant factors of L, and for one difference it is at most
    deg Min_L. THESE ARE PROPERTIES OF L ALONE, computable once, at the real
    128-bit block size, in pure Python, and they bound the object for EVERY key
    simultaneously: if the sum of the first t = N_r - 2 invariant-factor degrees
    is below 127, the Proposition-2 closure is unavailable for every key of that
    key size, which is an argument-unavailability result of exactly the
    KN-FIND-028 kind and is recorded as such. (C) THE DISTRIBUTION HEURISTIC.
    BCLR explicitly restrict to schedules where round keys differ by constants
    because, in their words, the difference between two round keys is dependent
    on the initial key (page 7). For AES it is, and that is the whole content
    of this record: D_K is a key-dependent set of t vectors, and the heuristic
    H1 below asserts that it generates the GF(2)[X]-module (GF(2)^128, L) with
    the same probability as t uniformly random vectors, a probability that has
    an EXACT closed form from the invariant factors (the analogue of the
    classical probability that t random elements generate a finite module).
    H1 is tested, not assumed, at 10^5 sampled keys per key size, against a
    matched null of independent uniformly random round keys. (D) THE TWO
    OUTCOMES, EACH A RESULT. If deg-sum >= 127 and the measured fraction of keys
    with dim W_L(D_K) >= 127 is 1 - epsilon, then for every such key there is
    NO non-trivial g invariant under both the S-box layer and every
    Add_{K_i} o L (given the AES S-box has no affine component, which the
    first gate recomputes), unconditionally for that key, at the full round
    count, for all three key sizes; the tail keys are handed to BCLR's
    odd-cycle route (their Proposition 4 plus Algorithm 1), which applies
    because the AES S-box is RECALLED to have an odd cycle (cycle type
    87, 81, 59, 27, 2, recomputed at the gate). That is a C3 barrier statement
    with an archived checkable derivation for the named class. If instead
    deg-sum < 127, the closure is structurally unavailable and the deliverable
    is the codimension floor 128 - deg-sum, the exact invariant-factor
    structure of the AES linear layer (a new committed structural constant of
    this program), and the redirection to the S-box side. (E) THE CONSTRUCTION
    BRANCH, STATED SO THE EXPONENT-FIRST READING IS HONEST. If a non-trivial
    invariant g of the BCLR type exists for a fraction rho of keys, the
    Todo-Leander-Sasaki nonlinear-invariant distinguisher applies to those keys
    with about two known pairs and O(1) work, so under CM-1 element (c) the
    charged cost is 1/rho AES-equivalents, which is below the definitional
    2^127 reference whenever rho > 2^{-127}. This record's honest prior is that
    rho = 0; the branch is written down because the record must define what
    every outcome means before it is run. (F) WHAT IS NOT CLAIMED. NOT any
    statement about invariants of the whole round function that are not
    separately S-invariant and L-invariant (BCLR name that class as the one
    their framework does not reach); NOT any statement about invariants that
    hold for a subset of rounds (subspace trails, an off-limits family); NOT a
    universal impossibility claim about AES; NOT any relation to the published
    state of the art, which is unadjudicable here in either direction.

  mechanism: >-
    The nonlinear-invariant and invariant-subspace attacks succeed on ciphers
    whose round keys differ only by constants that live in a small L-invariant
    subspace: Midori-64 has dim W_L(D) = 16 (BCLR section 3), and that is why
    its weak-key invariants exist. The mechanism this record tests is the
    converse pressure in AES: the AES key schedule is nonlinear and bijective,
    so the round-key differences are not constants and, if H1 holds, behave
    like random vectors, and a handful of random vectors generate an
    L-invariant subspace whose dimension is governed by the invariant factors
    of L. MixColumns alone is a poor generator (its minimal polynomial is
    (X+1)^4, consistent with KN-FIND-028's ord(M) = 4 and kernel dimensions
    4, 1, 2, 1), so on a single column W_MC(c) has dimension at most 4. Whether
    the composition with ShiftRows repairs this at the 128-bit level, i.e.
    whether Min_L has large degree and the first ten invariant factors sum to
    at least 127, is a finite linear-algebra question nobody in this program
    has asked, and it decides in one computation whether the cleanest
    available closure argument for an entire attack class applies to AES at
    all. The heuristic then converts the universal bound into a per-key
    statement with a measured tail, and the tail is handed to a second,
    S-box-aware argument that BCLR also supply.

  novelty_status: unverified

