  question_id: RQ-SBRG-f31cb2
  added: '2026-10-17'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Disjoint-branch flag-tensor identity: the structural Macaulay row space of a
    balanced tree is fixed by the two-parameter rank-profile table of ONE
    leaf-pair block, so reuse across branches shrinks the precomputed carrier
    about 270x at D=4 and 1200x at D=5 (balanced t=4, n=16)
  class: tooling
  claim: >-
    (A) IDENTITY. Let blocks A=(x1,x2,u1) and B=(x3,x4,u2) of a balanced tree have
    disjoint variable sets. In the Boolean ring R_A let U_A^c be the cumulative
    Macaulay row space at nominal degree cap c and R_A^{<=w} the monomials of
    degree <= w. A basis of R_A adapted to both flags exists (any two flags);
    write a_A(i), w_A(i) for its levels, and the same for B. The cumulative
    degree-D Macaulay row space of A and B together has dimension
    #{(i,k) : a_A(i)+w_B(k) <= D or w_A(i)+b_B(k) <= D}, a function of the two
    tables N_A(a,w), N_B(b,w) alone; A and B are isomorphic, so one table
    suffices. (B) POWER. The 1-D version using cumulative ranks only is predicted
    wrong exactly when the block has degree falls (fall_dim > 0). (C) NEGATIVE
    CONTROL. The chain shares u1, so it is not a tensor sum; the coupling defect is
    reported. (D) ARITHMETIC (hand-checked). Balanced t=4, n=16, b=5: block
    variables 26 against 52; columns C(26,<=5) = 83,682 against 2,893,164 (34.6x)
    and C(26,<=4) = 17,902 against 294,204 (16.4x), so carrier bits shrink about
    1200x and 270x, which removes the guard blocking of IDEA-20260829-cb4fd5 for
    the structural carrier. Limit: reducing the coupled target rows (u1,u2 enter
    the closing block) against an implicit tensor carrier is Stage 2, not claimed.
  mechanism: >-
    PAIR. R1 (F_2 bit coordinates), Sigma = multiply by a Boolean monomial and
    F_2-combine, on the product ring. Trichotomy: coordinate-dependent (monomial
    degree filtration). LOSSY-PROJECTION TEST. The table N_A(a,w) keeps joint
    counts of two flags and discards the rows; multiplication by a B-monomial acts
    as the identity on the A part and shifts only the B level, so the retained
    data propagates exactly. FACTOR-BASE ESCAPE. None needed; explicit V.
    Stage: relation decomposition (precompute). Priced by carrier bits and XORs.
  novelty_status: unverified
