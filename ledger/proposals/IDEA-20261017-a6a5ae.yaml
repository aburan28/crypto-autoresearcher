  minimal_test:
    design: >-
      Stage 0 zero compute: column-ratio table. Stage 1 compute N_A from one block
      with the in-tree eliminator (column order by degree) and compare with the
      monolithic balanced structural rank. Stage 2 chain defect and planted fall.
    controls:
      - Random same-support disjoint blocks (pure linear algebra, must pass).
      - Block with a planted degree-lowering relation (makes the 1-D formula fail).
      - Chain presentation (shared node) as the negative control.
    required_metrics: [N_A table, exact rank, formula rank, 1-D formula rank, chain defect, columns, peak RSS]
  falsification_conditions:
    - identity_mismatch > 0 in any cell (formula or implementation wrong; halt).
    - 1-D formula equals the exact rank everywhere including the planted-fall block (fall structure irrelevant).
    - Chain defect equal to 0 in every cell (sharing a node costs nothing at these degrees).
  confounders:
    - Cumulative versus per-layer multiplier convention; run both, cumulative is the KN-FIND-006 convention.
    - Guard skips are failed_infrastructure, never negatives.
  interpretation_limits:
    - Gives structural rank and an implicit carrier only; coupled-target reduction is untested. Constant 4^D, no exponent.
  heuristic_assumptions:
    - id: H1
      statement: Peak carrier memory is c*cols^2/8 bytes with c in [0.5, 2], in block and tree alike.
      rigorous_support: A rank-r echelon carrier over F_2 holds at most r*cols bits.
      validation_plan: Record peak RSS on every cell and fit c; admit a cell only if the fitted formula predicts under 8 GB.
  target_complexity:
    time_exponent: "Unchanged in n; structural elimination cost in v falls by (v_tree/v_block)^{D*omega}, about 2^{D*omega} for balanced trees."
    memory_exponent: "Carrier n^{2D}-type in v; v halves, so a constant 4^D, no exponent change."
