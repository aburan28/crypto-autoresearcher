  minimal_test:
    design: >-
      STAGE 0 (zero compute, hard gate). Write Lemma V and Theorem W in full
      (completion constant, n = p case, the bivariate form), retrieve the
      general Kohel-Shparlinski statement or record it unretrievable and
      restrict every d >= 2 claim to "conditional on a recalled bound"; write
      H1's first-moment derivation and its predicted A(1), A(2) table; hash it.
      STAGE 1 (THE DISCRIMINATOR; minutes to an hour). Ladder p in {2^10,
      2^11, ..., 2^16} (nearest primes with a prime-order curve). Per size: 20
      seeded random prime-order curves, 20 NULL-1 relabellings, 2 j = 0
      prime-order curves (p = 1 mod 3), 2 anomalous curves by CM with
      class-number-one discriminants D in {-11, -19, -43, -67, -163}
      (p = (1 + |D| v^2)/4 prime, twist chosen with #E = p) where such p exist
      in range. Exhaustive discrete-log table by one pass of [k]g. A(1) by the
      anchor-slope method (for each anchor, slopes (k_j - k_i)/(x_j - x_i) mod p
      over x_j != x_i, max multiplicity plus one); the argmax line and its
      point list are the certificate, re-verified by an independent module
      (recompute a x + b and compare with logs re-derived by scalar
      multiplication). Planted positives on NULL-1. A_Dx(1) on D_x(p^{2/3}).
      STAGE 2 (secondary arms, small n only). A(2) at n <= 2^10 (O(n^3)); the
      bivariate affine census (a x + b y + c) at n <= 2^10; the windowed
      census A(1, E) = max over lines of #{Q : (a x + b) - log Q mod n in
      [0, E)} minus its main term E, at p <= 2^10 and E in {n^{1/4}, n^{1/2}};
      the anomalous interpolation degree of G by exact Lagrange / linear
      algebra at p <= 2^12.
      OUTCOME TABLE. E-RANDOM: H1 survives; record regime (ii) of M_deg as
      closed at toy scale conditionally on H1 (obstruction quantity A(d), its
      values per size, scope the ladder) and the window (1/2, 3/4] as a Weil
      gap. E-POWER / E-WEIL-TIGHT surviving NULL-1 and the decay test: a
      non-genericity of the log-graph; route to a successor that tests whether
      the rich lines concentrate on a recognizable set (decision target (b)).
