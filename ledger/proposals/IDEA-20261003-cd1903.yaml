        (Random-graph incidences of the log-graph.) For every ordinary
        prime-order E/F_p and every d with 1 <= d <= p^{1/2}, the maximal
        agreement A(d) = max over deg F <= d of N(F) satisfies
        A(d) <= (1 + eps)(d + 1) ln p / ln((d + 1) ln p) + O(1), uniformly in p,
