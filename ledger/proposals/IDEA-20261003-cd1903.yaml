idea:
  id: IDEA-20261003-cd1903
  question_id: RQ-ECDLP-bc7a54
  goal_id: GOAL-ECDLP-001
  goal_id_note: >-
    Copied from RQ-ECDLP-bc7a54 goal_ids. Binding and any budget consequence
    are Coordinator decisions; this record makes none.
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    THE ALGEBRAIC-OMEGA MODEL OF THE INVERTIBLE HALF: a polynomial F of degree
    d agrees with log_g Q (F(x(Q)) = log_g Q as integers) on at most
    2 + K_d sqrt(p) (1 + ln(pn)) points of a prime-order E(F_p) (Kohel-
    Shparlinski plus completion), so a polylog-degree TOTAL omega -- which is
    its own chi by one scalar multiplication -- never beats sqrt(n), while a
    PROMISED-INPUT omega of degree n^{1-alpha} on a recognizable set is
    excluded only above alpha = 3/4; the window (1/2, 3/4], which contains the
    n^{1/3} target, is held open by the sqrt(p) error term alone, and the exact
    agreement census A(d) on toy curves measures whether the truth is
    Weil-tight or random-graph-like (A(d) about (d+1) ln p / ln((d+1) ln p))
  class: mechanism

  claim: >-
    WHICH SIDE. The impossibility side of the duality, in a NAMED MODEL. Model
    M_deg: omega is a polynomial F in F_p[X] (or, in the bivariate arm, a
    function F(x, y) in the coordinate ring of E) of degree d, applied to the
    affine coordinates of Q, its value lifted to [0, p) and compared with
    log_g Q in [0, n); omega is charged d field operations (dense Horner
    evaluation). Representation class R1 of RQ-ECDLP-623a32 (the
    x-coordinate as an element of F_p and its integer lift); attack stage: the
    omega step of HINTWALK (docs/n13-ecdlp-hint-family.md section 5).

    (A) LEMMA V (VERIFICATION; restated so this record stands alone; the
    graded form is IDEA-20261003-0c5564). If F is TOTAL (defined on every
    point) then chi_F(Q) := [ [F(Q)] g == Q ] decides the agreement set
    D_F = {Q : F(Q) = log_g Q} at cost c_F + O(log n) group operations, so
    (D_F, chi_F, F) is a hint family of density |D_F| / n. In M_deg the whole
    hint-family question for total omegas is therefore ONE number per degree:
    A(d) = max over deg F <= d of |D_F|. The recognizable/invertible duality
    is not a two-sided constraint for total coordinate omegas; it is a bound on
    A(d).

    (B) THEOREM W (AGREEMENT BOUND). Let E/F_p be ordinary, with group order
    n prime, g a generator. For every F in F_p[X] with 1 <= deg F = d,
      N(F) := #{Q != O : iota_p(F(x(Q))) = iota_n(log_g Q)}
           <= 2 + K_d sqrt(p) (1 + ln(p n)),
    where iota_p, iota_n are the integer lifts to [0, p) and [0, n) and K_d is
    the implied constant of the Kohel-Shparlinski bound for the degree-2d
    function F o x on E (plus 1/sqrt(p) for the point at infinity). PROOF
    SKETCH (five lines, to be written in full at Stage 0). Write both
    indicators of equality to u in [0, min(p, n)) by complete additive
    characters mod p and mod n; the (0,0) term is at most 1, the (0, t != 0)
    terms are O(ln n / p), and every term with c != 0 carries the mixed sum
    S(c, t) = sum_{Q != O} e_p(c F(x(Q))) e_n(t log_g Q), bounded by
    K_d sqrt(p) + 1; the remaining u-sum is a geometric sum bounded by
    min(U, 1/(2 ||c/p + t/n||)), and because gcd(p, n) = 1 the pn values
    (cn + tp) mod pn are all distinct, so the sum over (c, t) of those minima
    is at most U + pn (1 + ln(pn)). (For the anomalous case n = p the
    frequencies coincide in blocks of p and the same total O(sqrt(p) ln p)
    results; checked by hand, Stage 0 writes it out.) For d = 1 the mixed sum
    is exactly the retrieved Lemma 1 of Ahmadi-Shparlinski (Kohel-Shparlinski
    Corollary 1, any nonprincipal additive character composed with x, any
    group character); for d >= 2 the general Kohel-Shparlinski form is
    RECALLED (with K_d <= c d) and is a Stage 0 retrieval obligation.

    (C) THE TWO REGIMES, PRICED.
      REGIME (i), TOTAL OMEGA (chi by Lemma V). F of degree d = (log n)^{O(1)}:
      |D_F| <= sqrt(p) (log n)^{O(1)}, so alpha <= 1/2 + o(1) and HINTWALK
      costs at least n^{1/2 - o(1)}. CLOSED, conditional only on the cited
      character-sum bound: no polylog-degree polynomial omega is a hint family
      beyond the generic threshold.
      REGIME (ii), PROMISED-INPUT OMEGA. chi native (e.g. D_x(B) of the note,
      |D| = n^alpha); omega is a degree-d polynomial correct on a fraction s of
      D, budget d <= n^{1-alpha} (omega runs once, on the hit). Theorem W with
      K_d <= c d requires s n^alpha <= c n^{1-alpha} sqrt(p) (1 + ln pn), i.e.
      alpha <= 3/4 + o(1). EXCLUDED ONLY FOR alpha > 3/4. At alpha = 2/3
      (the n^{1/3} target, d = n^{1/3}) Theorem W allows agreement up to about
      n^{5/6} ln n, far above the n^{2/3} needed: the sqrt(p) error term of the
      Weil bound is the ONLY thing keeping (1/2, 3/4] open in this model.

    (D) THE HEURISTIC CLOSURE AND THE MEASURED OBJECT. If the log-graph
    Gamma_E = {(x(Q), log_g Q)} meets degree-d polynomial graphs no more often
    than a uniformly random graph does (heuristic H1: A(d) <=
    (1 + eps)(d + 1) ln p / ln((d + 1) ln p) + O(1), the first-moment count
    over p^{d+1} polynomials), then regime (ii) needs s n^alpha <= about
    3 n^{1-alpha}, i.e. alpha <= 1/2 + o(1): the algebraic-omega route to
    n^{1/3} is CLOSED for every alpha > 1/2. The exact census A(1) (all lines)
    and A(2) (all parabolas) on toy curves against the relabelled null is the
    measurement that decides between the two readings below. Hand estimates
    of H1's prediction (first moment, not a run): A(1) about 11 at p = 2^12
    and about 13 at p = 2^16 (p^2 lines each carrying Poisson(about 1)
    points; k! about p^2), against a Weil ceiling of about K_1 2^8 x 23 at
    p = 2^16.
      E-RANDOM: A(1), A(2) sit inside the relabelled null's band and grow like
      ln p / ln ln p; H1 survives its first test, regime (ii) is closed at toy
      scale conditionally on H1, and the window (1/2, 3/4] is recorded as a
      Weil-gap, not as an opening.
      E-WEIL-TIGHT (or E-POWER): some line captures order sqrt(p) (or p^theta,
      theta >= 0.15) points of Gamma_E on real curves and not on the null; the
      log-graph has incidence structure no random labelling has, which is a
      non-genericity of E(F_p) in the sense of note section 6 and a lead for
      RQ-ECDLP-bc7a54 decision target (b) at the promised-input regime.

    (E) CEILING, STATED BEFORE ANY RUN. Degree is not cost. An omega of huge
    degree but a short straight-line program (the Smart / Semaev-Satoh-Araki
    map on anomalous curves, x^{(p-1)/2}-type expressions) is outside M_deg,
    and Theorem W itself FORCES the anomalous logarithm, written y G(x), to
    have deg G at least about sqrt(p)/(K ln p) -- the model is blind to the
    one known (1, polylog) hint family by construction. The anomalous arm
    measures that blindness instead of hiding it: M_deg statements are about
    polynomial omegas, never about a curve's hardness.

  mechanism: >-
    OBJECT FRAME (docs/object-frame-ideation.md). Representation: R1, the
    affine x-coordinate (and in the bivariate arm (x, y)) as field elements
    with their integer lifts. Operation set Sigma: evaluation of a bounded-
    degree polynomial map, i.e. the F_p-algebra operations of degree <= d --
    NOT the translation action. Tracked object: the log-graph Gamma_E, a
    subset of F_p x [0, n) of size n - 1, and its incidences with graphs of
    degree-d polynomials. TRICHOTOMY: Class III, coordinate-dependent -- an
    omega in M_deg is a function of the representation, not of the group
    element, which is exactly why Lemma V turns it into a chi.
    LOSSY-PROJECTION TEST AGAINST SIGMA. The projection Q -> F(x(Q)) discards
    the sign of y (x is 2-to-1 on the subgroup), and F is many-to-one on F_p
    for d >= 2; it propagates deterministically under polynomial evaluation by
    definition; the discard is Sigma-compatible because Sigma acts on x only.
    It is lossy in the representation actually used (no point is recoverable
    from F(x(Q)) alone) -- not a change of coordinates.
    PRICED OPEN NUMBER: A(d), the maximal agreement, measured exactly by
    exhaustive incidence counting against the identity calibration (A(0) = 1
    forced: log is injective), the random-label null, and the relabelled
    generic group. WHY THIS IS NOT D_x OR D_w IN NEW NOTATION. It is not a set
    at all: it is a bound on a function class that holds for EVERY D, decidable
    or not, and it separates the two omega regimes (total versus promised
    input) that the note's section 5 charges at one common cost c. D_x enters
    only as the regime (ii) instance; D_w is outside M_deg because its omega
    is generation-based, not a coordinate function.
    OFF-LIMITS AS PRIMARY LENS: F1-F7 of IDEA-20260802-002 plus this lane's own
    closures (cubical lift IDEA-20260920-376b00, bounded branching
    IDEA-20260920-a5757d, query-bounded preprocessing IDEA-20260920-a92b0f,
    detector calibration IDEA-20260920-faca6f). F5 (p-adic lift) appears ONLY
    as the anomalous ceiling control, never as a lens.

