  citation_note: >-
    Every number in claim is hand-derived and labelled; no run exists. The d = 1
    character-sum input is retrieved at secondary level; d >= 2 is recalled.

  assumptions:
    - 'The group order n of E(F_p) is prime (prime-order curves; the toy ladder enforces it, so E(F_p) = <g>).'
    - Agreement is equality of integer lifts; values of F in [n, p) when p > n cannot agree and are counted as misses.
    - Omega cost in M_deg is the degree (dense evaluation). Sparse or straight-line-program-cheap polynomials are OUTSIDE the model and are named as its ceiling.
    - 'Off-limits component used: F5 (p-adic lift), only as the anomalous ceiling arm.'
    - No factor base appears; KN-OPEN-020 is not engaged.

  proof_search_map:
    bottleneck: >-
      The sqrt(p) error term of Theorem W. Closing the window (1/2, 3/4] in M_deg
      needs an agreement bound A(d) <= d n^{o(1)}, i.e. cancellation beyond the
      square root for this specific incidence problem -- or H1.
    baseline_embedding:
      parameter_slice: >-
        d = 0 (constant F): N(F) <= 1 exactly, because log is injective -- the
        theorem must reproduce "no constant omega". The relabelled generic
        group: the identical completion argument with the null's random mixed
        sums (|S| about sqrt(n ln(pn))) gives the same order sqrt(n) log --
        Theorem W is generic-strength, which is the honest reading of what Weil
        buys.
      reproduction_check: >-
        Frozen fixture: A(0) = 1 and the two-point floor A(1) >= 2 on every
        curve; on a planted null (labels set so that an affine F agrees on a
        random set of size n^{0.6}) the census returns >= the planted size; the
        orbit count on j = 0 curves is exactly (n - 1)/6.
    observation_collision:
      observable: A(d) (and the argmax polynomial with its agreement list).
      distinct_preimage_search: >-
        REQUIRED AND PREDICTED: an anomalous curve (where a (1, polylog) hint
        family exists) and a random curve (where none is known) are predicted
        to have the SAME A(1) band. A(d) therefore does not identify hint-family
        existence; it identifies polynomial-omega existence only. Any record
        that reads a null A(d) as curve hardness commits this collision.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Hint family with total omega -> agreement set D_F via Lemma V -> an
          incidence count between Gamma_E and degree-d graphs -> a mixed
          character sum bound. ENCODING exact (Lemma V); COMPLETENESS: every
          total polynomial omega is covered; SOUNDNESS: conditional on the
          cited bound; TRANSFER: the bound is uniform in p; COST LOSS: the
          (1 + ln pn) completion factor.
        predicted_gain: Regime (i) closed at alpha = 1/2 exactly; regime (ii) closed above 3/4.
      - transform: observable_fiber
        proposed_object: >-
          Hold A(1) fixed and vary the curve class (random, j = 0, anomalous,
          relabelled null); the intrinsic invariant that separates them
          (existence of a cheap SLP omega) is invisible to A(1) by prediction.
        predicted_gain: Locates the model's blind spot by measurement rather than assertion.
    quantifier_order: >-
      THEOREM W: FOR ALL ordinary E/F_p of prime order n, FOR ALL d >= 1, FOR
      ALL F of degree d: N(F) <= 2 + K_d sqrt(p)(1 + ln pn), with K_d depending
      on d only (not on E, F or p). H1: FOR ALL tested E, max over F of N(F)
      <= (1 + eps)(d + 1) ln p / ln((d + 1) ln p) + O(1) -- the max is inside
      the quantifier over E, so a single exceptional curve falsifies H1 at
      that curve. The witness F may depend on E; it may NOT depend on the
      target (no target-dependent omega in M_deg).
    method_ceiling:
      strongest_certifiable_claim: >-
        "In M_deg, every total omega of degree (log n)^{O(1)} has density at
        most n^{-1/2 + o(1)}; every promised-input omega within budget is
        excluded for alpha > 3/4 (conditional on the cited bound), and for all
        alpha > 1/2 under H1, whose toy-scale census is as measured." It
        cannot certify anything about straight-line-program-cheap omegas, about
        a curve's hardness, or about non-polynomial chi.
      nearby_object_control: >-
        The anomalous curve: a cheap omega exists, the model is predicted to be
        blind to it, and Theorem W forces its interpolation degree to be at
        least about sqrt(p)/(K ln p). A method that cannot tell the anomalous
        curve's polynomial-omega profile from a random curve's has correctly
        identified that degree is the load-bearing restriction.
    proof_obligations:
      - claim: Lemma V -- chi_F decides D_F exactly at cost c_F + O(log n).
        responsibility: correctness
      - claim: Theorem W for d = 1 from the retrieved Lemma 1, with the completion constant written out (including the n = p case).
        responsibility: correctness
      - claim: Theorem W for d >= 2 and the bivariate arm from the general Kohel-Shparlinski bound (retrieve first).
        responsibility: correctness
      - claim: Regime arithmetic -- (i) alpha <= 1/2 + o(1); (ii) alpha <= 3/4 + o(1); under H1 alpha <= 1/2 + o(1).
        responsibility: size
      - claim: The exhaustive A(1) census is O(n^2) modular operations per curve, A(2) O(n^3).
        responsibility: runtime
      - claim: Nothing is claimed outside M_deg; the anomalous arm states the ceiling.
        responsibility: scope
    not_applicable_reason: null

  null_object_control: >-
    NULL-1 (MANDATORY, THE GENERIC GROUP): Z/n relabelled by a uniformly random
    bijection onto the multiset of x-values of a matched curve, preserving the
    pairing label(k) = label(n - k) so that the 2-to-1 structure of x is
    matched; 20 draws per size. NULL-2: matched random prime-order curves, 20
    per size. POSITIVE CONTROLS: (a) planted affine agreement on NULL-1 at sizes
    n^{0.5}, n^{0.6}, n^{0.7} (must be returned); (b) j = 0 curves of prime order
    (RQ-mandated): the census must recover the exact beta-orbit structure of
    Gamma_E ((x, k) -> (zeta x, lambda k mod n), orbit count (n - 1)/6) and the
    orbit-extended agreement A^beta(1) = 6 x A_canonical(1) by construction; (c)
    anomalous curves (ceiling arm): the Smart map is computed and verified to
    agree on all n points, and A(1) is measured there. DECAY TEST: A(1) fitted
    against ln p across a 64x range of p; flat-in-n excess over the null is the
    artifact tell of docs/inventor-protocol.md section 3.

