    nearest_neighbors:
      - id: IDEA-20260807-05e12c
        precise_delta: Exact all-cell du/dv CSP and joint propagation replace singleton/per-class marginal rescaling.
      - id: IDEA-20260805-2b94fe
        precise_delta: Hard public labeled support and shared-y coupling replace separable exact likelihood.
      - id: IDEA-20260805-3d71ca
        precise_delta: A single-ciphertext M=1 decoder replaces best-of-M projected-norm target selection.
    external_screen: >-
      Primary sources read: FIPS 203 compression definitions, Algorithms 14-15,
      and Table 2; DDGR, LWE with Side Information (CRYPTO 2020), including its
