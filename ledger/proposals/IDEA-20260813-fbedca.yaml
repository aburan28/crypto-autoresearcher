  enumerated_closures:
    - >-
      If exact likelihood matches joint propagation, the public-cell algorithm
      is a renamed score correction and is closed at the tested boundary.
    - >-
      If toy pruning is real but projected fully charged gain is below 2 bits,
      only the representation/tooling result remains; no ML-KEM attack claim follows.
  open_directions:
    - Alternative sound constraint-propagation orders that avoid exponential state.
    - Composition with M>1 target selection, only after separately charging M.
    - Proof bounds on search-tree pruning from unequal modular cells.
