idea:
  id: IDEA-20260806-a3ef00
  question_id: RQ-SSI-001
  added: '2026-08-06'
  title: >-
    A FUNDAMENTALLY DIFFERENT DECOMPOSITION -- LOCAL-GLOBAL RATHER THAN
    DEGREE-SPLITTING -- APPLIED TO THE OBJECT THAT CARRIES SUPERSINGULAR
    HARDNESS: decompose EndRing's information content into
    (genus bits) + (spinor bits) + (residual global bits) on the Gross lattice,
    which this corpus's own DEFI cautionary entry says is exactly the axis that
    collapsed a scheme in classical polynomial time, and which nobody here has
    ever pointed at a supersingular curve
  class: mechanism

  claim: >-
    (A) THE CORPUS SAYS THIS IS THE THREAT AND HAS NEVER RUN THE CHECK.
    knowledge/literature/KN-LIT-7648 records the Kirschmer-Ling-Sadreddin
    cryptanalysis of DEFI: the scheme's hardness was supposed to come from
    isomorphism of quadratic forms, but genus is a cheap computable invariant
    (local data at every place), spinor genus refines it, and when class field
    theory forces genus = spinor genus = equivalence class, the "hard"
    isomorphism problem was never hiding anything. Classical, polynomial, no
    lattice reduction. The corpus's own commentary calls this "the strongest
    argument in this sweep that the algebraic-number-theory literature" matters,
    and KN-TECH-081 explicitly flags it as "the same shape of threat" facing
    quaternion-order problems. THE CHECK HAS NEVER BEEN RUN ON THE QUATERNION
    OBJECT THIS PROGRAM ACTUALLY DEPENDS ON.

    (B) THE OBJECT AND THE DECOMPOSITION. For a supersingular E over F_{p^2},
    End(E) is a maximal order O in the quaternion algebra ramified at p and
    infinity, and the GROSS LATTICE of E -- the trace-zero part of O, a TERNARY
    QUADRATIC LATTICE of discriminant governed by p^2 -- is the natural quadratic
    form attached to the curve. EndRing is then, up to the known equivalences, a
    quadratic-form recognition problem, and the DEFI axis decomposes its
    information content into exactly three additive parts:
        I(EndRing) = I_local (genus) + I_spinor + I_global (class in spinor genus).
    This is a LOCAL-GLOBAL decomposition. It is different in kind from every
    decomposition in this corpus's supersingular lane -- Delfs-Galbraith splits
    by a distinguished subset, Wesolowski splits an isogeny by degree, the
    Frobenius-orbit and local-transport proposals split a path into segments.
    None of them decomposes the INFORMATION rather than the object.

    (C) THREE PREDICTED VALUES, EACH CHEAPLY CHECKABLE, AND THE FIRST IS THE
    LOAD-BEARING ONE.
      B1 -- I_local = 0 BITS, EXACTLY. All maximal orders in a quaternion
        algebra are locally conjugate at every place. Hence every supersingular
        curve at a fixed p has a Gross lattice in the SAME genus, and the genus
        symbol -- the complete local invariant, at every prime including p, and
        at infinity -- is identical for all of them. Local data contributes
        exactly zero bits. THE DEFI COLLAPSE THEREFORE CANNOT HAPPEN HERE, and
        this is a positive assurance result rather than an attack.
      B2 -- I_spinor <= 1 BIT, AND PROBABLY 0. The number of spinor genera in a
        genus of ternary forms is a power of 2 determined by local spinor norm
        groups. For this genus it is predicted to be 1 or 2, i.e. at most one
        bit, and the prediction is CHECKABLE BY DIRECT COMPUTATION at toy p.
        This is the one number in the whole proposal that could surprise: a
        genus splitting into many spinor genera would be a computable coarse
        invariant of a supersingular curve, which is exactly what nobody has.
      B3 -- I_global = log2(h) BITS, h ~ p/12 the class number. Everything that
        distinguishes one supersingular curve from another is irreducibly
        global, which is a quantitative statement of where the hardness lives.
    Bit budget: 0 + (<=1) + log2(p/12). For a 256-bit p that is 0 + <=1 + ~252.4.

    (D) WHAT B1 EXPLAINS, AND THIS IS THE UNIFYING PAYOFF. If I_local = 0, then
    no invariant of a supersingular curve computed from PURELY LOCAL ARITHMETIC
    DATA -- completions, genus symbols, Hasse invariants, local conditions at any
    finite set of places -- can distinguish two curves at the same p. That is a
    single named obstruction covering an entire family of candidate invariants,
    and it is the supersingular counterpart of what IDEA-20260806-c5d183 did for
    the ECDLP: an argument over an enumerated index set rather than a tally of
    rejected mechanisms. IT MUST BE STATED CAREFULLY, and this record states it
    carefully: the program's existing neighbourhood-based proposals
    (IDEA-20260804-170692 local transport signatures, IDEA-20260804-4c9ac0
    kernel-Frobenius type profiles) are NOT ruled out by B1, because
    "local" in the isogeny-graph sense (a neighbourhood of a vertex) is not
    "local" in the arithmetic sense (a completion at a place) -- graph
    neighbourhood data is global arithmetic information. Conflating the two
    would be a serious misreading and the record flags it rather than risking it.

    (E) WHAT THIS IS NOT. NOT an attack. NOT a claim that EndRing is hard. NOT a
    claim that the Gross lattice determines the curve -- that is a separate
    published statement which this proposal cites as context and does not rely
    on. NOT a claim that computing the Gross lattice is feasible: it is not, it
    is EndRing-hard, and the proposal's whole point is that the bit-budget can
    be computed WITHOUT solving EndRing, because genus and spinor-genus counts
    are properties of the genus, not of an individual unknown lattice.

  discriminated_from:
    - >-
      KN-TECH-081 (the principal ideal problem beyond commutative orders) and
      KN-OPEN-024 (does rank-1 quaternion PIP inherit the tractability of matrix
      rings). Those concern the PRINCIPAL IDEAL problem in quaternion orders.
      This proposal concerns the genus/spinor stratification of the ternary
      lattice attached to a maximal order and its information content. KN-TECH-081
      names the DEFI collapse as a shape of threat; this proposal is the first
      record that turns that warning into a measurement, and it is a natural
      successor to that entry rather than a competitor.
    - >-
      IDEA-20260804-170692 and IDEA-20260804-4c9ac0. Those track path data
      through isogeny-graph neighbourhoods. As stated in (D), graph-local is not
      arithmetic-local, so B1 does not touch them; what B1 supplies is the
      reason their information must come from the graph structure rather than
      from any arithmetic completion, which is a constraint on how they can
      possibly work rather than a refutation.
    - >-
      IDEA-20260805-07ff43 and H-SSI-df550b (conjugate-degree density law, the
      delta statistic, its Lipschitz law). Those study a GLOBAL statistic --
      the minimal degree to the Frobenius conjugate. Under this decomposition
      they live entirely inside I_global, and B1/B2 explain why they had to:
      there was nowhere else for the information to be. That is a consistency
      relation between two records, not an overlap.
    - >-
      "Gross lattice", "local-global" and "Hasse principle" return ZERO hits
      across ledger/proposals, ledger/hypotheses, knowledge/techniques,
      knowledge/findings and knowledge/open-problems as of merge-base 0c856274.
      "spinor" occurs in four records, all on the lattice side (KN-OPEN-024,
      KN-OPEN-027, KN-TECH-081, and literature notes), none on the isogeny side.

  object_first_candidate:
    tracked_object: >-
      THE GENUS-STRATIFICATION COORDINATE of a supersingular curve: the triple
      (genus symbol, spinor genus, class) of its Gross lattice. The projection
      forgets the class and retains the genus and spinor genus.
    lossiness: >-
      MAXIMALLY LOSSY, AND THAT IS THE FINDING RATHER THAN A DEFECT. Under B1
      the genus projection has a single fibre containing every supersingular
      curve at that p, so it discards log2(p/12) bits and retains zero. Under
      the inventor protocol's section 2 test this is a projection that is lossy
      but useless -- the opposite failure mode from the "loses nothing" example
      the protocol gives, and worth recording as the second way section 2 can be
      failed.
    propagation: >-
      Deterministic and trivially so: the genus is constant across the entire
      isogeny class, hence invariant under every isogeny step. Perfect
      propagation, zero information -- which is precisely the degenerate corner
      of the propagation/lossiness tradeoff and is a useful calibration point
      for any future tracked-object enumeration on the supersingular side.
    survival_score: >-
      Survives every operation forever. Carries nothing. Recorded as the
      zero-information endpoint of the scale.

  mechanism: >-
    STEP 1 -- FIX THE LATTICE CONVENTION BEFORE ANYTHING ELSE. "The ternary
    lattice attached to a maximal order" has several conventions in the
    literature (trace-zero elements of O; Gross's lattice {2x - Tr(x)}; the
    reduced-norm form scaled variously), and they differ by scaling factors of 2
    and by discriminant conventions. The genus symbol and the spinor-genus count
    DEPEND on the convention, particularly at the prime 2. Stage 0 fixes one
    convention explicitly, records it, and every number reported afterwards
    names it. Skipping this step is the fastest way to produce a wrong spinor
    count and not notice.

    STEP 2 -- DERIVE B1 FROM LOCAL CONJUGACY. The statement "all maximal orders
    in a quaternion algebra are locally conjugate at every place" is standard;
    the derivation to write out is that local conjugacy of the orders implies
    local isometry of the associated ternary lattices under the fixed
    convention, hence a common genus. Then verify computationally at toy p by
    computing genus symbols for every supersingular curve at that p and checking
    they coincide EXACTLY. If two differ, either the convention is wrong or the
    derivation is, and the run halts.

    STEP 3 -- COMPUTE THE SPINOR-GENUS COUNT. This is a local computation on the
    genus: the number of spinor genera is the index of a subgroup determined by
    local spinor norm groups, computable place by place from the genus symbol
    alone. It does NOT require knowing any individual curve's lattice, which is
    what makes the whole proposal feasible despite EndRing being hard. Compute
    it for a ladder of p and report whether it is 1, 2, or larger, and how it
    depends on p mod 4, 8 and 12.

    STEP 4 -- THE BIT BUDGET, AND ITS CONSISTENCY CHECK. Report
    0 + log2(#spinor genera) + log2(h) and check it against the independently
    known class number h ~ p/12 from the mass formula. The two must agree; a
    mismatch means the stratification is not what is claimed.

    STEP 5 -- THE FORWARD GUIDANCE, WHICH IS THE DELIVERABLE FOR OTHER LANES.
    Write the explicit statement of what B1 forbids and, equally explicitly,
    what it does not: it forbids arithmetic-local invariants, it does NOT forbid
    graph-neighbourhood invariants, delta-type global statistics, orientation
    data, or theta-series truncations. That distinction is the whole practical
    content for the rest of the program and it must be stated in the same
    breath as the obstruction.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      grep -ril over ledger/, knowledge/, docs/ for "Gross lattice",
      "local-global", "Hasse principle", "spinor", "ternary quadratic",
      "theta series", "genus symbol", performed 2026-08-06 against merge-base
      0c856274.
    results: >-
      "Gross lattice", "local-global", "local global", "Hasse principle": ZERO
      hits anywhere in the repository. "spinor": four files, all lattice-side
      (KN-OPEN-024, KN-OPEN-027, KN-TECH-081 and literature). "theta series":
      eight files, all on the lattice/PQC side (ML-KEM, FrodoKEM, FN-DSA, HAWK
      hypotheses) with none on the isogeny side. "ternary quadratic": five
      files, none connecting the notion to supersingular endomorphism rings.
    verdict: >-
      ADAPTATION. Genus theory, spinor genera and the local conjugacy of maximal
      orders are classical; none is claimed as new, and the Gross lattice and
      its role are published mathematics. What is new to this program is the
      application: turning KN-TECH-081's own recorded warning into a computed
      bit budget on the supersingular side. No novelty is claimed against the
      external literature -- the spinor-genus count for this genus may well be
      recorded somewhere -- and Stage 0 checks for it, where a hit would supply
      the answer directly and make the proposal cheaper rather than pointless.

  null_object_control: >-
    THE INSTRUMENT MUST BE SHOWN ABLE TO REPORT MORE THAN ONE SPINOR GENUS, OR
    B2 IS UNFALSIFIABLE. POSITIVE CONTROL (blocking): run the identical genus /
    spinor-genus pipeline on a family of ternary lattices KNOWN to lie in at
    least two spinor genera -- classical examples exist and are small. The
    pipeline must report >= 2 there. A pipeline that has only ever returned 1
    has not been shown able to return anything else, which is the
    KN-TECH-1a5b7e / KN-TECH-6c0e15 null-sufficiency failure mode in its purest
    form. SECOND CONTROL: two maximal orders known to be NON-isomorphic at the
    same p must have identical genus symbols (that is B1) and must be separated
    by a class-level invariant (that is B3), demonstrating that the pipeline
    distinguishes the levels rather than collapsing them.

  assumptions:
    - >-
      All maximal orders in the quaternion algebra ramified at p and infinity
      are locally conjugate at every place. Standard; derived rather than
      assumed in Step 2, and verified computationally at toy p.
    - >-
      The chosen lattice convention is applied consistently. Fixed in Step 1 and
      named in every reported number.
    - >-
      The class number h for supersingular curves at p is ~ p/12 up to the
      standard correction terms depending on p mod 12. Used as an independent
      cross-check in Step 4, not as an input.
    - >-
      Toy p (up to roughly 10^4) is where the full supersingular vertex set and
      its orders can be enumerated. Every computed number is scoped there; the
      DERIVATIONS are what would carry to cryptographic p and the record does not
      pretend the computations do.

  proof_search_map:
    bottleneck: >-
      The number of spinor genera in the genus of the Gross lattice. If it is 1,
      the local-global decomposition contributes nothing beyond the assurance in
      B1. If it is large and computable from p alone, it is a coarse computable
      invariant of a supersingular curve, which would be a genuinely new object.
      Everything else in the proposal is bookkeeping around this one integer.
    baseline_embedding:
      parameter_slice: >-
        The smallest p with more than one supersingular curve (p = 11 upward)
        where the entire class set and all orders can be written down by hand.
      reproduction_check: >-
        Frozen fixture: the number of supersingular j-invariants at each toy p
        must match the classical mass-formula count exactly, computed
        independently, before any lattice is built. Exact integer comparison.
    observation_collision:
      observable: >-
        The genus symbol of the Gross lattice.
      distinct_preimage_search: >-
        NOT A SEARCH -- A DERIVATION, AND IT IS EXPECTED TO SUCCEED MAXIMALLY.
        B1 asserts that ALL h ~ p/12 supersingular curves share one genus
        symbol, so the collision class is the entire class set. The audit is
        therefore inverted: instead of hunting for a collision, the computation
        must CONFIRM total collision, and finding even one curve with a
        different genus symbol refutes B1 and is the single most interesting
        possible outcome of the whole proposal.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          A resource measure that charges information bits separately over the
          proved-disjoint blocks local / spinor / class, so that the budget is
          additive by construction rather than by assertion.
        predicted_gain: >-
          A closed, exhaustive accounting of where EndRing's difficulty lives:
          0 + <=1 + log2(p/12) bits. The gain is a complete index set, not a
          speedup.
      - transform: observable_fiber
        proposed_object: >-
          Hold the genus symbol fixed (which B1 says is automatic), vary the
          class, and look for an intrinsic invariant distinguishing the
          resulting lattices that is computable WITHOUT solving EndRing.
        predicted_gain: >-
          Predicted: none exists below EndRing cost. Any exception is a
          distinguisher on the supersingular set and would supersede this
          record's conclusion immediately.
    quantifier_order: >-
      B1, with quantifiers explicit:
      FORALL p, FORALL supersingular E, E' over F_{p^2}, the Gross lattices of
      End(E) and End(E') lie in the SAME genus -- i.e. FORALL places v EXISTS a
      local isometry at v. The order matters and is the content: the local
      isometry is allowed to depend on the place AND on the pair, and no global
      isometry is claimed or exists. A reader who reverses this to
      "EXISTS an isometry FORALL v" has read a false statement -- that would be
      a global isometry and would say all supersingular curves are isomorphic.
      The gap between the two orders is exactly I_global, which is the point of
      the decomposition.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The information distinguishing supersingular curves at a fixed p is
        0 bits local, at most log2(#spinor genera) bits spinor, and the rest
        class-level." It can NEVER certify that EndRing is hard, and it can
        never certify that the class-level bits are inaccessible -- only that
        they are not accessible through the genus stratification.
      nearby_object_control: >-
        DEFI's own quadratic forms, where genus = spinor genus = class and the
        problem collapsed. The method must give the OPPOSITE answer there and
        must be able to show why. A pipeline that reports "irreducibly global"
        for both DEFI's forms and the Gross lattices is not measuring the
        stratification -- it is asserting a conclusion. This is the single
        sharpest available check on whether the whole method is real, and it is
        cheap because the DEFI-side forms are small.
    proof_obligations:
      - claim: Local conjugacy of maximal orders implies a common genus.
        responsibility: correctness
      - claim: The spinor-genus count is computable from the genus symbol alone.
        responsibility: feasibility
      - claim: The bit budget is additive over the three strata.
        responsibility: correctness
      - claim: log2(h) matches the mass-formula count independently.
        responsibility: baseline
      - claim: The pipeline can report more than one spinor genus.
        responsibility: interface
      - claim: The DEFI control gives the opposite verdict.
        responsibility: scope

  predictions:
    - metric: >-
        number of distinct genus symbols among Gross lattices of all
        supersingular curves at a fixed p
      direction: different
      minimum_effect: >-
        Exactly 1, at every tested p, with zero exceptions. A single exception
        refutes B1 and is the most valuable outcome available here: it would be
        a locally computable distinguisher on the supersingular set.
    - metric: >-
        number of spinor genera in that genus, as a function of p
      direction: different
      minimum_effect: >-
        Predicted 1 or 2. A value of 4 or more at any tested p, together with a
        computable separator, is a material result and changes the bit budget.
        The p-dependence (through p mod 4, 8, 12) is reported whatever the value.
    - metric: >-
        computed class-level bit count log2(h) versus the mass-formula
        prediction log2(p/12)
      direction: different
      minimum_effect: >-
        Agreement within the standard correction terms at every tested p. A
        disagreement is an instrument failure, not a finding, and halts the run.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): fix the lattice convention; literature check for
      an existing spinor-genus count for this genus; derive B1.
      STAGE 1 (minutes, HARD GATE): enumerate supersingular j-invariants at
      p in a ladder (p = 11, 23, 43, 101, 251, 1019, ...) by two independent
      constructions that must agree exactly, and check the count against the
      mass formula.
      STAGE 2 (minutes, HARD GATE): run the positive control -- a ternary-lattice
      family known to have >= 2 spinor genera -- and require the pipeline to
      report >= 2.
      STAGE 3 (minutes to hours): compute maximal orders and Gross lattices at
      each toy p, compute genus symbols, and check B1 by exact comparison across
      the whole class set.
      STAGE 4 (minutes): compute the spinor-genus count from the genus symbol
      and report its p-dependence.
      STAGE 5 (zero compute): assemble the bit budget, run the DEFI-side
      contrast control, and write the forward guidance of Step 5 including the
      explicit arithmetic-local versus graph-local distinction.
    controls:
      - >-
        positive control -- a lattice family with >= 2 known spinor genera; the
        pipeline must report >= 2 or B2 is unfalsifiable
      - >-
        DEFI-side contrast -- the method must give the opposite verdict on forms
        where genus = spinor genus = class
      - >-
        mass-formula cross-check on the supersingular count at every p
      - >-
        two independent constructions of the supersingular vertex set must agree
        exactly before any lattice is built
    required_metrics:
      - number of distinct genus symbols per p, with the full symbol recorded
      - number of spinor genera per p, and its dependence on p mod 4, 8, 12
      - class number h per p, computed and mass-formula predicted
      - assembled bit budget per p
      - pass/fail of all four controls
      - wall-clock and memory per stage, and the largest p reached

  falsification_conditions:
    - >-
      Two supersingular curves at the same p have different genus symbols. B1 is
      refuted, and this is the outcome with by far the highest value: it would
      be a locally computable distinguisher on the supersingular set and would
      become the successor proposal immediately.
    - >-
      The positive control fails to report >= 2 spinor genera. The instrument
      cannot distinguish spinor genera at all; B2 is unfalsifiable as measured
      and nothing about it may be reported.
    - >-
      The DEFI-side contrast gives the same verdict as the supersingular side.
      The pipeline is not measuring the stratification; the line halts.
    - >-
      The class number disagrees with the mass formula. Instrument failure.
    - >-
      The convention chosen in Step 1 turns out to change the spinor count.
      Then the count is not an invariant of the curve and the bit budget's
      spinor term is meaningless as stated; the record must be superseded with
      the convention-dependence made explicit rather than quietly fixed.

  confounders:
    - >-
      THE ARITHMETIC-LOCAL VERSUS GRAPH-LOCAL CONFLATION. This is the dominant
      interpretive risk. B1 says nothing about isogeny-graph neighbourhood
      invariants, and a reader who takes it to close the local-transport or
      Frobenius-type-profile lanes has misread it. Stated in the claim, in the
      discrimination list, and again in the forward guidance, deliberately.
    - >-
      Convention dependence at the prime 2. Genus symbols and spinor norm groups
      at 2 are the classical source of errors in this area, and the trace-zero
      versus Gross-lattice scaling differs by exactly a factor that matters
      there.
    - >-
      Small-p degeneracy. At p = 11 the class set has one or two elements, so
      "all curves share a genus" is vacuous. The ladder must reach p where h is
      large enough for the statement to have content, and the smallest such p
      must be recorded rather than glossed.
    - >-
      Treating a zero-bit local budget as a hardness proof. It bounds one family
      of approaches. KN-TECH-058's corrected baselines and the p^{1/3+o(1)}
      exemplar are unaffected by anything here.

  interpretation_limits:
    - >-
      The bit budget is an information-theoretic accounting, not a computational
      one. Class-level bits being "where the hardness lives" does not mean they
      are hard to extract; it means the genus stratification does not extract
      them.
    - >-
      Computations are toy-scale. The derivations are what carry to
      cryptographic p, and a derivation error would not be caught at
      cryptographic scale by anything in this proposal.
    - >-
      Nothing here is a security claim about SQIsign, CSIDH or CGL. It is a
      statement about one stratification of one lattice invariant.

  heuristic_assumptions:
    - id: H1
      statement: >-
        The number of spinor genera in the genus of the Gross lattice is a
        function of p through congruence conditions on p alone (p mod 4, 8 and
        12) and not through finer arithmetic of p.
      rigorous_support: >-
        Rigorous side: the spinor-genus count is determined by local spinor norm
        groups, which for a quaternion algebra ramified exactly at p and infinity
        are governed by local conditions at 2, at p, and at infinity. The
        heuristic side is that no further dependence on p appears -- i.e. that
        the local conditions capture everything, imitating the classical
        behaviour of ternary genera of prime-power discriminant.
      validation_plan: >-
        Compute the count across a ladder of at least 20 primes chosen to cover
        every residue class mod 24, and check that the count is constant within
        each class. Comparison: the predicted congruence-class partition versus
        the observed partition, by exact equality of the induced partitions, not
        by a fitted statistic. Tail check: the primes where the count changes,
        if any, must be exactly the class boundaries. Toy scale only; this
        validates a congruence pattern at small p and is NOT a proof of it and
        NOT a crypto-scale validation, and the record says so.

  target_complexity:
    time_exponent: >-
      NOT AN EXPONENT PROPOSAL. No attack is proposed and no complexity claim is
      made against EndRing or path-finding. The output is a bit budget:
      0 + log2(#spinor genera) + log2(h).
    memory_exponent: >-
      Toy only. The dominant object is the set of maximal orders at p <= 10^4,
      which is O(p) lattices of constant size.
    best_known: >-
      Supersingular path-finding baselines are KN-TECH-058 (corrected classical
      figure, superseding KN-TECH-029's F_p^2 number) and the p^{1/3+o(1)}
      result in inputs/P13-WESOLOWSKI-2026/. Memory-charged variants are
      KN-TECH-050 and quantum models KN-TECH-051. NONE is moved by this
      proposal.
    hidden_overhead: >-
      The bit budget is information-theoretic and hides the entire computational
      question: log2(h) bits being "global" says nothing about the cost of
      obtaining them. Disclosed here because the budget's shape invites exactly
      that misreading.
    tradeoff_note: >-
      Not applicable; no algorithm is produced. If B1 is refuted and a local
      distinguisher appears, it would need full-cost accounting against
      KN-TECH-035 and KN-TECH-050 before any security consequence is stated.

  dominated_by: >-
    As an ATTACK: mounts none, so dominated on every axis by every supersingular
    frontier row this program records -- KN-TECH-058's corrected classical
    baseline, the p^{1/3+o(1)} exemplar, KN-TECH-050's memory-charged variants,
    and KN-TECH-051's quantum CSIDH models. Checked across time, memory and
    data/query.
    As an ANSWER TO "can the DEFI-style collapse happen to supersingular
    EndRing": nothing in this corpus dominates it, because KN-TECH-081 raises
    the question and no record answers it. As a general closure instrument it is
    dominated in scope by IDEA-20260806-c5d183, which indexes an entire attack
    space rather than one invariant family; this record covers a smaller family
    and says so.
  sota_delta: >-
    Zero speedup. Deliverable delta, as numbers: converts one recorded warning
    (KN-TECH-081's "same shape of threat") into a computed 3-term bit budget
    0 + (<=1) + log2(p/12), measured across a ladder of >= 20 primes covering
    every residue class mod 24, with 4 blocking controls including a positive
    control that has never been run in this program; and supplies one named
    obstruction covering the entire family of arithmetic-local invariants, with
    an explicit statement of the two invariant families it does NOT cover.
    Stated numerically because "rules out a class of attacks" is not a value.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.92 that B1 holds -- local conjugacy of maximal orders is standard and the
    residual risk is the lattice convention, not the mathematics. 0.7 that the
    spinor count is 1, 0.25 that it is 2, 0.05 that it is larger; the last is
    the branch worth the whole proposal. 0.85 that the pipeline can be built at
    toy p with existing quaternion machinery. So the most likely outcome is a
    clean assurance result -- the DEFI collapse cannot happen here, with an
