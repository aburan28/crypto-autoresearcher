idea:
  id: IDEA-20261006-fec972
  question_id: RQ-SSI-001
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: Full rational 2-torsion on every supersingular class over F_{p^2} at p = 23
  class: measurement
  claim: >-
    For p = 23, every F_{p^2}-isomorphism class of supersingular elliptic
    curves has three distinct points of order 2 rational over F_{p^2}.
  mechanism: >-
    Object frame. The representation is the R2 short-Weierstrass cubic
    f_E = x^3 + Ax + B of a model defined over F_{p^2}. Its roots are the
    x-coordinates of the three nontrivial geometric 2-torsion points. Sigma
    is the p^2-power Frobenius acting on those three roots, not the full
    translation action and not an isogeny walk. Trichotomy class:
    partial-action. Lossy-projection test against Sigma: Frobenius permutes
    the roots, and the number of roots lying in F_{p^2} is invariant, so the
    count propagates deterministically under ⟨Frobenius⟩. The count is lossy
    because it discards which roots, and a cubic over a field has 0, 1, or 3
    roots in that field, never exactly 2. The orbits of ⟨Frobenius⟩ on the
    three roots are the irreducible factors of f_E. Canonicalising one such
    orbit at p = 23 is cubic factoring, an O(1) field cost, not an isogeny
    search. F3 is not the lens: no path in an isogeny graph is built. F6 is
    not the lens: no endomorphism orbit is walked and no orbit representative
    is used as a rho state. The census asks whether the Frobenius action on
    E[2] is trivial for every supersingular class at this prime. A positive
    answer would mean that rational 2-torsion is implied by the supersingular
    F_{p^2} distribution at p = 23. A negative answer would mean it is an
    extra restriction. Neither answer is an attack, a path-finding algorithm,
    or a change to the p^{1/3} or p^{1/4} supersingular bounds.
  novelty_status: unverified
  citations:
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Over a finite field, isogenous curves have the same number of points,
        and walking the isogeny class does not reach a different weakness
        class of the sort named in that row. Equal point counts do not decide
        whether the group contains three rational points of order 2.
      verified_by: idea-generator
    - ref: RQ-SSI-001
      provenance: internal
      claim: >-
        The question asks for toy-scale mechanisms about auxiliary torsion on
        surviving supersingular assumptions, and it states that toy-only
        effects are hypothesis-generating only.
      verified_by: idea-generator
    - ref: docs/object-frame-ideation.md
      provenance: internal
      claim: >-
        Partial-action objects are those that propagate under a proper
        operation set and not under the full translation action.
      verified_by: idea-generator
    - ref: >-
        Deuring's correspondence between supersingular curves and maximal
        orders (standard textbook statement; the book was not opened)
      provenance: recalled
      claim: >-
        Supersingular j-invariants in characteristic p live in F_{p^2}. This
        is a pointer for the census, not a proof that 2-torsion is rational,
        and it was not read in this session.
      verified_by: null
  assumptions:
    - Supersingularity is tested over F_{p^2} by the trace of Frobenius, or by an equivalent criterion computed in the run. The criterion must be recorded with the class list.
    - Two models are the same class when an isomorphism over F_{p^2} exists. Quadratic twists that are not isomorphic over F_{p^2} are distinct classes and are both counted.
    - p = 23 is odd, so the 2-torsion is étale and is cut out by a separable cubic in a short Weierstrass model.
    - No claim is made that #E(F_{p^2}) equals (p ± 1)^2. That group-order formula was not opened in a source this session.
  proof_search_map:
    bottleneck: >-
      The splitting type of f_E over F_{p^2} for each supersingular class at
      p = 23. The claim dies if any class has 0 or 1 root in F_{p^2}.
    baseline_embedding:
      parameter_slice: >-
        Uniform factorization types of cubics, identified with S_3. Exactly
        one of the six permutations is the identity, so the complete-split
        type has density 1/6 under that counting measure.
      reproduction_check: >-
        On the model y^2 = x^3 − x over F_23, the cubic x^3 − x has roots
        0, 1, −1. The same root counter used for the census must return 3
        before any supersingular class is scored. This checks the counter.
        It does not assert that y^2 = x^3 − x is supersingular.
    observation_collision:
      observable: >-
        The fraction of supersingular F_{p^2}-isomorphism classes whose
        2-division cubic has three roots in F_{p^2}.
      distinct_preimage_search: >-
        Two non-isomorphic classes with the same splitting type collide in
        this observable. Keep the j-invariant and the twist parameter so a
        second count can see whether two classes were merged.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The set of supersingular classes at p = 23 whose cubic splits
          completely, against the classes whose cubic has a linear or cubic
          irreducible factor.
        predicted_gain: >-
          Turns the claim into a fiber count. One class outside the
          complete-split fiber falsifies fraction 1.
    quantifier_order: >-
      For every F_{p^2}-isomorphism class of supersingular curves at p = 23,
      the 2-division cubic has three roots in F_{p^2}. Existence of one
      split class is not the claim.
    method_ceiling:
      strongest_certifiable_claim: >-
        The fraction equals 1 at p = 23, or it does not. The census says
        nothing about other primes and nothing about isogeny path-finding.
      nearby_object_control: >-
        Ordinary curves over F_{p^2} with the same number of rational points
        as a supersingular class, when any exist, and 100 random cubics over
        F_{p^2}. If the ordinary matches also all split, supersingularity is
        not distinguished by this count. If a random cubic census returns
        complete split far from 1/6, the factorizer is void.
    proof_obligations:
      - claim: The identity element of S_3 has density 1/6.
        responsibility: baseline
      - claim: Each class is scored by roots of its own cubic over F_{p^2}.
        responsibility: correctness
      - claim: The universal quantifier stops at p = 23.
        responsibility: scope
  predictions:
    - metric: >-
        fraction of supersingular F_{p^2}-isomorphism classes at p = 23 with
        three rational points of order 2
      direction: higher
      minimum_effect: >-
        The fraction equals 1, which is 6 times the S_3 identity density 1/6
        and is 5/6 above that density.
  minimal_test:
    design: >-
      List the F_{p^2}-isomorphism classes of supersingular elliptic curves
      at p = 23, put each in short Weierstrass form over F_{p^2}, and count
      F_{p^2}-roots of x^3 + Ax + B. Report the fraction with three roots.
      Run the instrument check on y^2 = x^3 − x first.
    controls:
      - y^2 = x^3 − x over F_23 returns exactly the three roots 0, 1, −1.
      - One hundred random monic cubics over F_{p^2} have a complete-split frequency recorded beside 1/6. A frequency outside [0, 1/3] voids the factorizer at this sample size rather than supporting the supersingular claim.
      - For each supersingular class, an ordinary curve over F_{p^2} is not required to exist. If one with the same point count is found, its splitting type is reported as the nearby object and is not folded into the supersingular fraction.
    required_metrics:
      - number of supersingular F_{p^2}-isomorphism classes
      - number of those classes with three rational points of order 2
      - the resulting fraction
      - complete-split frequency of the 100 random cubics
      - pass or fail of the y^2 = x^3 − x instrument check
  falsification_conditions:
    - At least one supersingular F_{p^2}-isomorphism class at p = 23 has fewer than three points of order 2 rational over F_{p^2}. The fraction is then at most 1 − 1/C, where C is the number of classes, and the claim is false.
    - The instrument check on y^2 = x^3 − x fails. No supersingular fraction from that run is admissible.
  confounders:
    - Scoring j-invariants instead of F_{p^2}-isomorphism classes merges twists that can have different splitting types.
    - A singular model, or a cubic with a repeated root, is not a 2-torsion count. Those models are excluded and listed.
    - Declaring supersingularity from a j-invariant in F_p alone misses classes defined only over F_{p^2}, and the opposite error counts ordinary curves. The trace test, or the recorded equivalent, has to match the class list.
  interpretation_limits:
    - Fraction 1 at p = 23 does not change the supersingular isogeny exponents p^{1/3+o(1)} or p^{1/4}, and it is not a path-finding algorithm. The p^{1/4} figure for the F_p-restricted problem is not used.
    - Fraction 1 does not say rational 2-torsion is free auxiliary data at cryptographic size. The question caps toy effects as hypothesis-generating.
    - A single counterexample class closes the universal claim at p = 23 only. It does not describe the fraction at the next prime.
    - This is not a public-key encryption construction and not a security claim.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Under the counting measure on S_3, the complete-split type has
        density 1/6. The supersingular F_{p^2} distribution at p = 23 is
        assumed to put every class in that single type, a total bias relative
        to the counting measure. No mixing-time or equidistribution theorem
        was opened to force that bias.
      rigorous_support: >-
        S_3 has six elements and one identity, so the density 1/6 is a count.
        A cubic has 0, 1, or 3 roots in the base field because a degree-2
        factor leaves either one root or three. The identification of
        factorization types with conjugacy in S_3 is the classical counting
        model being imitated. Transfer of that measure onto the supersingular
        locus is the heuristic and was not read from a paper in this session.
      validation_plan: >-
        Sampling route: the same census for every prime p with 19 ≤ p ≤ 80,
        direct enumeration of supersingular classes over F_{p^2}, no Deuring
        sampling shortcut. Comparison: the empirical complete-split fraction
        against 1 and against 1/6. Tail check: the smallest p in the range
        whose fraction is at most 5/6. Refutation: any single prime in the
        range, including p = 23, has fraction at most 5/6. That observation
        kills both the p = 23 claim and the reading that the bias is total
        throughout the range.
  target_complexity:
    time_exponent: >-
      Unchanged. The archived supersingular isogeny algorithm remains
      p^{1/3+o(1)} time under its stated heuristic, and the unconditional
      generic exponent on a prime-order subgroup remains 1/2. This census
      moves neither.
    memory_exponent: >-
      Unchanged. The archived algorithm's memory exponent p^{1/3+o(1)} is
      not touched. The census stores O(1) classes at p = 23.
    best_known: >-
      Surviving supersingular path-finding and endomorphism-ring costs stay
      at the bounds already in RQ-SSI-001 and RQ-SSIQ-9702af. Equal point
      counts across an isogeny class are KR-RHO-755e35 and do not price this
      fraction.
    hidden_overhead: >-
      No new o(1) is claimed. The archived supersingular o(1) stays where
      that source put it. Cubic factoring at p = 23 contributes no
      asymptotic term.
    tradeoff_note: >-
      No time–memory tradeoff and no parallel isogeny search. Extending the
      census through p ≤ 80 is still a direct enumeration, feasible at toy
      size, and is the validation sample rather than an attack.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: not_applicable
    not_applicable_reason: >-
      The claim is a rational 2-torsion count on supersingular curves over
      F_{p^2} at one prime. It is not a cost, algorithm, or exponent on the
      ECDLP frontier. The pasted ECDLP rows were still checked so the count
      is not mistaken for one of them.
    rows_checked:
      - KR-RHO-755e35
      - KR-RHO-53c89f
      - KR-RHO-0528e7
      - KR-RHO-037e22
      - KR-IC-5ea2f8
      - KR-IC-cd159a
      - KR-IC-9e610d
    nearest:
      - ref: KR-RHO-755e35
        provenance: internal
        relation: adjacent
        delta: >-
          That row equates the number of rational points across an isogeny
          class. It does not decide the splitting type in {0, 1, 3}. The
          claimed gap is the fraction 1 versus the S_3 identity density 1/6,
          a difference of 5/6.
        verified_by: idea-generator
      - ref: KR-RHO-53c89f
        provenance: recalled
        relation: orthogonal
        delta: >-
          No embedding-degree or trace-1 statement is made. The numerical gap
          remains 1 versus 1/6 on the 2-torsion splitting type. The pasted row
          says MOV, Frey–Rück, and anomalous attacks apply only to special
          curves. This idea does not restate that row and does not propose a
          pairing transfer.
    searched:
      corpus_grep: []
      web: []
      blocked:
        - The Deuring correspondence was not opened. It is recalled only as a pointer.
  dominated_by: >-
    Checked every pasted index-calculus row and every pasted generic-rho row.
    None states the fraction of supersingular classes with three rational
    points of order 2. The nearest opened row, KR-RHO-755e35, does not
    dominate: it equates point counts and does not fix this splitting type.
    No pasted row dominates a fraction gap of 5/6 against density 1/6.
  sota_delta: >-
    Claimed fraction 1 versus the S_3 complete-split density 1/6, ratio 6,
    difference 5/6. One class with fewer than three rational points of order
    2 drops the fraction to at most 1 − 1/C.
