idea:
  id: IDEA-20261006-76e247
  title: >-
    Excess of traces divisible by 4 on y^2 = x^3 + x against
    y^2 = x^3 + x + 1, for primes congruent to 1 mod 4
  class: measurement
  claim: >-
    Among primes p with 29 ≤ p ≤ 149 and p ≡ 1 (mod 4), let N0 be the
    number of such primes for which the trace t = p + 1 - #E(F_p) of
    E0: y^2 = x^3 + x is divisible by 4, and let N1 be the same count
    for E1: y^2 = x^3 + x + 1. The claim is N0 - N1 ≥ 3. E0 has
    j-invariant 1728. The excess is a trace census. It is not an
    orbit count under the extra automorphism, and it is not a rho
    speedup. The automorphism discount stays the known factor sqrt(4)
    from KR-RHO-0528e7 and is not re-measured here.
  mechanism: >-
    The tracked object is the residue of the trace modulo 4, on two
    frozen equations, restricted to primes that split for the
    Gaussian integer so that a j = 1728 curve can carry an
    automorphism of order 4. The operation set is point counting by
    the Legendre sum, not a walk and not translation of a secret
    multiple. Trichotomy: coordinate-dependent, because the trace is
    a function of the equation and not of a group element. A gap of
    at least 3 would say the special equation hits the residue 0 more
    often on this finite set. A gap of at most 2 would say it does
    not, on this set. Neither number is an attack cost.
  novelty_status: unverified
  status: proposed
  added: '2026-10-06'
  proposed_by: idea-generator
  approved_by: null
  question_id: RQ-JINV-8fc13a
  citations:
    - ref: KR-RHO-0528e7
      provenance: internal
      claim: >-
        An automorphism of order m changes the rho constant by sqrt(m).
        For j = 1728 the factor is sqrt(4). This idea does not walk
        orbits and does not claim a larger factor.
      verified_by: >-
        design session opened knowledge/frontiers/ecdlp/generic-rho/KR-RHO-0528e7.yaml
        on 2026-10-06
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        The generic exponent remains 1/2. A trace-residue census does
        not move it.
      verified_by: >-
        design session opened knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
        on 2026-10-06
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Isogenous curves share their group order. This idea compares
        two equations at the same p and does not walk an isogeny class.
      verified_by: >-
        design session opened knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
        on 2026-10-06
    - ref: CM trace formulas for j = 1728
      provenance: recalled
      claim: >-
        Pointer only. A reviewer may know a closed form for the trace
        of y^2 = x^3 + A x. This proposal does not treat any such form
        as checked, and the test counts points by the Legendre sum.
      verified_by: null
  assumptions:
    - >-
      #E(F_p) is p + 1 plus the sum over x in F_p of the Legendre
      symbol of x^3 + A x + B, with the symbol computed as a power
      in F_p. The point at infinity is the added 1.
    - >-
      p ≡ 3 (mod 4) is excluded from both counts. A prime that makes
      either model singular is excluded from both counts.
    - >-
      The two equations stay frozen. No search over A and B is allowed
      after the counts are seen.
  proof_search_map:
    bottleneck: >-
      Whether the 4-divisible traces are more numerous on E0 than on
      E1 by at least 3, inside one explicit prime set. Removing the
      gap would leave two similar censuses, not a faster discrete log.
    baseline_embedding:
      parameter_slice: >-
        The sqrt(4) automorphism constant of KR-RHO-0528e7. This
        measurement does not run rho.
      reproduction_check: >-
        Recompute #E for one prime by the Legendre sum and check that
        the trace satisfies the Hasse bound |t| ≤ 2 floor(sqrt(p)) + 2,
        as an instrument check, not as a theorem under test.
    observation_collision:
      observable: the pair (1_{4 divides t(E0)}, 1_{4 divides t(E1)}) at each prime
      distinct_preimage_search: >-
        List primes where the two indicators differ. The signed excess
        N0 - N1 is the sum of those differences. An excess of at most 2
        is the falsifier.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: the trace modulo 4 on two frozen models
        predicted_gain: >-
          An integer excess. At least 3 is the claim. At most 2 is the
          negative. No exponent change.
    quantifier_order: >-
      For the set of primes p with 29 ≤ p ≤ 149 and p ≡ 1 (mod 4),
      after dropping singular models, N0 - N1 is at least 3.
    method_ceiling:
      strongest_certifiable_claim: >-
        One finite excess on primes at most 149. No cryptographic
        curve and no walk.
      nearby_object_control: >-
        The same census on E2: y^2 = x^3 + 2x + 2, which is not the
        j = 1728 equation. E2 is recorded and does not enter N0 or N1.
    proof_obligations:
      - claim: Both point counts use the same Legendre-sum procedure.
        responsibility: correctness
      - claim: An excess is not a rho speedup beyond sqrt(4).
        responsibility: scope
    not_applicable_reason: >-
      This is a finite census, not a theorem, bound, certificate,
      reduction, or closure.
  predictions:
    - metric: N0 - N1
      direction: higher
      minimum_effect: at least 3
    - metric: N0
      direction: different
      minimum_effect: recorded beside N1; the decision uses only the difference
  minimal_test:
    design: >-
      List primes from 29 through 149 that are 1 mod 4. Skip a prime
      if either model is singular. Count points on E0 and E1 by the
      Legendre sum. Tally N0 and N1. Also tally the same indicator on
      E2 and do not add it to the difference.
    controls:
      - Hasse instrument. A trace outside the stated bound voids that prime as an instrument failure and does not decrement the excess.
      - Same-procedure control. E0 and E1 use one implementation of the Legendre symbol.
      - Nearby equation E2 is counted and excluded from N0 - N1.
      - Primes congruent to 3 mod 4 are not in the denominator.
    required_metrics:
      - the list of primes admitted
      - N0, N1, and N0 - N1
      - the E2 tally
      - any prime voided by the Hasse instrument
  falsification_conditions:
    - N0 - N1 is at most 2 on the admitted set.
    - The admitted set is empty.
    - A trace used in N0 or N1 fails the Hasse instrument, so that prime is void rather than a vote.
  confounders:
    - >-
      The set is small. An excess of 3 can be a finite-set fluctuation.
      The claim is about this set only.
    - >-
      Conditioning on p ≡ 1 (mod 4) selects the split primes. The scope
      does not include inert primes.
    - >-
      j = 1728 is a property of E0 for A ≠ 0 and B = 0. E1 is the
      comparison equation, not a claim that its j is generic for every p.
  interpretation_limits:
    - A trace gap is not an ECDLP cost gap.
    - The automorphism-discounted baseline remains sqrt(4), unread as a new measurement.
    - Evidence would be claim_tier toy and would stop at p ≤ 149.
    - This does not restate an orbit count of (n - 1)/6.
  heuristic_assumptions:
    - id: H1
      statement: >-
        On this prime set, if the two equations were exchangeable under
        the Legendre-sum census, the difference N0 - N1 would have mean
        0. The claim asserts a shift of at least 3 away from that mean.
        No density theorem for traces modulo 4 is assumed, and none is
        cited as checked.
      rigorous_support: >-
        The Hasse bound is the instrument, not a distribution. No
        Chebotarev or CM trace formula is used as support. KR-RHO-0528e7,
        opened in this session, prices the automorphism constant and
        does not predict N0 - N1.
      validation_plan: >-
        Compute the census exactly. There is no Monte Carlo of primes.
        The nearby equation E2 is the second census. If E2's tally
        differs from N1 by more than N0 differs from N1, record that
        the E0 excess is not unique to the j = 1728 equation. That
        note does not change the sign of N0 - N1.
  target_complexity:
    time_exponent: unchanged p^{1/2}
    memory_exponent: unchanged O(1) for rho
    best_known: >-
      Pollard rho with the automorphism factor sqrt(4) on j = 1728,
      KR-RHO-0528e7, against the generic floor KR-RHO-13bf67
    hidden_overhead: none; no new algorithm
    tradeoff_note: >-
      No time-memory tradeoff. The census stores one trace per prime.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: >-
    KR-RHO-0528e7 dominates any cost reading of j = 1728: the factor
    is already sqrt(4), and this census does not beat it. The excess
    N0 - N1 is not a cost and is not dominated as an observable by
    that row, by KR-RHO-13bf67, or by KR-RHO-755e35.
  sota_delta: >-
    Zero change to exponent 1/2 and zero change to the sqrt(4)
    constant. The new quantity is N0 - N1 on primes from 29 through
    149 that are 1 mod 4, for y^2 = x^3 + x against y^2 = x^3 + x + 1.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-0528e7
      - KR-RHO-13bf67
      - KR-RHO-755e35
      - KR-RHO-fb88e6
    nearest:
      - ref: KR-RHO-0528e7
        provenance: internal
        relation: adjacent
        delta: >-
          That row states the sqrt(m) walk constant, including sqrt(4)
          at j = 1728. This idea does not walk. It scores a trace
          residue excess on a finite prime set.
      - ref: KR-RHO-fb88e6
        provenance: internal
        relation: orthogonal
        delta: >-
          The negation map is a sqrt(2) rho constant with fruitless
          cycles. This census does not use negation as a walk.
    searched:
      corpus_grep:
        - ledger/proposals on origin/main for j = 1728 and trace divisible by 4
        - PR 1940 and PR 1939 extra ideas, which are y-half, carry, chord-slope, Edwards, and Semaev degree rows
      web: []
      blocked:
        - web search not run; novelty_status stays unverified
