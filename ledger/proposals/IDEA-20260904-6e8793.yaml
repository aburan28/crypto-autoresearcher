  assumptions:
    - >-
      Both CSIDH curves are F_p-rational supersingular with the same Frobenius
      orientation by Z[sqrt(-p)] (or the order of discriminant -p for
      p = 1 mod 4), and the action is free and transitive on the locus up to the
      twist involution.
    - >-
      The class group Cl(Z[sqrt(-p)]) is known to the attacker as a
      precomputation. For CSIDH-512 the corpus records this as publicly computed;
      for larger parameters it is an L[1/2] preprocessing that this record
      charges and does not absorb.
    - >-
      An effective class-group action is available for verification (frozen
      source references [17], [18]), so step S5 is polynomial and every claimed
      recovery carries a re-verifiable certificate.
    - >-
      The alpha axis of IDEA-20260904-ec17aa is correct as a derivation. If it is
      not, the threshold in (B) is not 3/4 and must be recomputed from whatever
      relation actually holds between detection cost and total cost.

  proof_search_map:
    bottleneck: >-
      Step S1: the cost of EndRing on an F_p-RATIONAL supersingular curve.
      Everything else in Route 2 is polynomial or precomputation. Whether Route 2
      can beat Route 1 is therefore identically the question of whether the
      generic EndRing exponent alpha/3 can fall below the locus-specific 1/4 that
      Delfs-Galbraith already achieves.
    baseline_embedding:
      parameter_slice: >-
        alpha = 1, i.e. today. Then Route 2 costs p^{1/3}, Route 1 costs p^{1/4},
        the minimum is p^{1/4}, and the frozen source's safe listing is
        reproduced EXACTLY. A second slice: alpha = 3/4 exactly, where the two
        routes tie at p^{1/4} and the threshold is attained but not crossed.
      reproduction_check: >-
        Symbolic and frozen before any measurement: min(1/4, alpha/3) evaluated
        at alpha = 1 must return 1/4 and at alpha = 3/4 must return 1/4 with
        equality of the two arguments. Plus a toy fixture: at a CSIDH-like toy
        prime, a measured Route 1 cost must scale as h^{1/2} over at least three
        prime sizes before any Route 2 number is quoted.
    observation_collision:
      observable: >-
        The recovered class [a] in Cl(Z[sqrt(-p)]), and its certificate
        j([a]E_0) = j(E_1).
      distinct_preimage_search: >-
        THE COLLISION IS EXACT, KNOWN, AND TWO-FOLD. The pair (a, a^{-1}) has the
        same observable at the level of curves-up-to-twist, because the two
        conjugate embeddings of Z[sqrt(-p)] into the maximal order correspond to
        E and its quadratic twist, on which the action is inverted. So the
        pipeline as stated CANNOT distinguish a from a^{-1} without one extra
        evaluation. This is not a hypothetical: it is the standard twist
        symmetry, it is a genuine identifiability failure of the observable, and
        the separating condition is the single action evaluation of step S3.
        A SECOND, MORE DANGEROUS COLLISION: two DIFFERENT ideal classes can have
        the same connecting ideal up to principal ideals, so step S4 must reduce
        modulo principal ideals correctly; an implementation that skips the
        reduction returns a representative rather than a class and will verify
        correctly on E_0 while being useless for any other base curve. Both
        collisions are testable at toy scale and both are in the required
        metrics.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move CSIDH vectorization from the torsor -- where the only available
          operation is the action and where the generic bound sqrt(h) applies --
          into the quaternion order model, where the hypothesis becomes an exact
          lattice computation (the connecting ideal) and the generic bound does
          not apply because the adversary now touches structure outside the
          action. Encoding: curves to maximal orders. Completeness: exact given
          S1. Soundness: exact given S5's certificate. Transfer: the twist
          ambiguity, resolved by one action call. Cost loss: exactly the cost of
          S1, which is the whole point.
        predicted_gain: >-
          Replaces the exponent 1/4 by alpha/3. Zero or negative today
          (alpha = 1 gives 1/3 > 1/4); strictly positive iff alpha < 3/4.
      - transform: specialization_pack
        proposed_object: >-
          Build a resource measure equal to (EndRing calls) x (their cost) +
          (polynomial steps) + (class-group precomputation), realised by
          specialising to a toy CSIDH-like prime where all three blocks are
          separately measurable and provably disjoint, and add the charges over
          those blocks only.
        predicted_gain: >-
          Converts the folklore "polynomial-time reduction" into a measured
          operation count with the precomputation visible rather than absorbed
          into p^{o(1)}.
    quantifier_order: >-
      FOR ALL primes p of CSIDH shape, FOR ALL pairs (E_0, E_1) in the
      F_p-rational supersingular locus with E_1 = [a]E_0, IF THERE EXISTS an
      EndRing algorithm of cost p^{alpha/3+o(1)} valid for all F_p-rational
      supersingular curves, THEN a is recoverable in
      2 p^{alpha/3+o(1)} + poly(log p) + L_p[1/2] preprocessing. NOTE THE
      QUANTIFIER TRAP AND WHY IT IS NAMED: the hypothesis must hold for
      F_p-RATIONAL curves, not merely for uniformly random supersingular curves
      over F_{p^2}. An algorithm whose analysis assumes a uniformly random input
      -- which is exactly what Heuristic 1 and the outer walk of Algorithm 3
      assume -- says NOTHING about a curve drawn from the measure-zero
      F_p-rational locus, and pushing it there requires a separate argument that
      no record in this program has made. Naming that gap is a substantial part
      of this record's value; it is developed as the forced dichotomy of
      IDEA-20260904-9bf9c6.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: the threshold identity min(1/4, alpha/3) with its two symbolic
        slices; a measured, certificate-carrying implementation of steps S2-S5 at
        toy CSIDH-like parameters with its operation count, its twist-ambiguity
        behaviour and its class-group precomputation charged separately; and a
        cascade list naming which safe-list entries move together. It can NEVER
        certify that alpha < 3/4 exists, and it certifies nothing about CSIDH's
        quantum security, which is a different algorithm in a different model.
      nearby_object_control: >-
        THE OBJECT WHERE THE CONCLUSION IS KNOWN FALSE: an ORDINARY elliptic
        curve pair over F_p in the same isogeny class. There the same pipeline
        formally applies -- the class group acts, the connecting ideal exists,
        the orientation is Frobenius -- and yet the corpus has repeatedly and
        correctly closed that lane (IDEA-20260807-0afbab, IDEA-20260808-28361d,
        IDEA-20260812-a3720a) because the ECDLP is a class-group-INVARIANT
        problem there and the transport buys nothing. If the argument developed
        here also seemed to break the ordinary case, it would be proving too
        much. The separating condition is that CSIDH's SECRET IS the class-group
        element, whereas the ordinary ECDLP's secret is not, and stating that
        separation explicitly is required before any cascade claim.
    proof_obligations:
      - claim: CSIDH classical security = min(p^{1/4+o(1)}, p^{alpha/3+o(1)}).
        responsibility: baseline
      - claim: The threshold is alpha = 3/4, identical to 22428d's p^{1/4} condition.
        responsibility: strictness
      - claim: Steps S2-S4 run in poly(log p) given the class-group structure.
        responsibility: runtime
      - claim: >-
          The conjugate-embedding ambiguity is exactly two-fold and is resolved
          by one action evaluation.
        responsibility: correctness
      - claim: >-
          The class-group precomputation is L_p[1/2] = p^{o(1)} asymptotically
          and is charged, not absorbed.
        responsibility: size
      - claim: >-
          Step S5 produces a re-verifiable certificate, so any claimed recovery
          meets docs/claims-and-verification.md.
        responsibility: interface
      - claim: >-
          The EndRing hypothesis must hold on the F_p-rational locus
          specifically, not merely for uniformly random supersingular curves.
        responsibility: scope
      - claim: >-
          Route 2 cannot beat Route 1 by more than a constant unless alpha < 3/4,
          because Delfs-Galbraith already gives p^{1/4} on the locus.
        responsibility: feasibility

  object_first_candidate:
    established_families_off_limits: >-
      Declared off-limits as the primary lens: the entire quantum cost-model
      family (the ten RQ-CSIDH-64343f records, Kuperberg, collimation, oracle
      cost, depth limits); the dihedral hidden-shift decompositions
      (IDEA-20260813-55d3a0, IDEA-20260813-e6d55d); the group-action search
      structure itself (IDEA-20260901-871141's homomorphic digest,
      IDEA-20260801-007's collision surface); self-pairings as a weak-instance
      flag (IDEA-20260806-b7fdc3). The object here lives on the QUATERNION side
      and never touches the torsor except to verify.
    tracked_object: >-
      The connecting ideal class between the two maximal orders, as an element of
      Cl(Z[sqrt(-p)]).
    lossiness: >-
      Extreme and compatible: two rank-4 lattices collapse to one element of a
      group of order p^{1/2}, and the collapse commutes with the class-group
      action, which is the only operation CSIDH performs.
    propagation: >-
      One step is exact and multiplicative: acting on E_1 by an ideal b sends the
      connecting class to its product with [b]. This is measurable directly --
      compute the connecting class before and after a known action and check the
      product identity -- and it is required metric M4.
    newness_score: >-
      As mathematics, almost certainly OLD and folklore (see the novelty screen's
      verdict). As a record in this program, absent: no CSIDH proposal in the
      pool states Route 2. The threshold identity and the cascade list are the
      parts most likely to be genuinely new.
    testability_score: >-
      High. Steps S2-S5 are implementable at toy CSIDH-like primes with exact
      ground truth (plant a, recover it, verify), and the whole test is
      independent of whether any alpha < 3/4 exists.
    survival_score: >-
      The object survives for every oriented curve, which is why the cascade
      reaches (qt-)Pegasis and PQarrots as well. It dissolves the instant the
      curve is not oriented, i.e. off the F_p-locus, which is the exact boundary
      of the claim.

  predictions:
    - metric: >-
        M1 -- correctness rate of the S2-S5 pipeline on planted instances at toy
        CSIDH-like primes, over at least 500 planted secrets and three primes
      direction: higher
      minimum_effect: >-
        Predicted 1.0 after the twist ambiguity is resolved, and EXACTLY 0.5
        before it is resolved (returning a or a^{-1} with equal frequency). A
        pre-resolution rate that is not 0.5 means the ambiguity is not two-fold
        and claim (C2) is wrong.
    - metric: >-
        M2 -- measured operation count of steps S2 through S4 as a function of
        log p, fitted exponent
      direction: lower
      minimum_effect: >-
        Predicted polynomial, fitted degree at most 4 in log p, with no
        dependence on h beyond the precomputed table lookup. A fitted cost
        growing like a positive power of p refutes the folklore polynomiality and
        collapses claim (B) -- and that would be the single most valuable
        outcome, because it would mean CSIDH is safe for a structural reason
        rather than by an exponent margin.
    - metric: >-
        M3 -- the class-group precomputation cost, measured at the toy primes and
        reported separately from the online cost
      direction: higher
      minimum_effect: >-
        Predicted to DOMINATE the online cost at every tested size, and to be the
        term that makes Route 2 impractical long before it becomes
        asymptotically competitive. Reported as its own column so it can never be
        absorbed into p^{o(1)}.
    - metric: >-
        M4 -- the propagation identity: connecting-class([b]E_1) equals
        connecting-class(E_1) times [b], checked on random known b
      direction: different
      minimum_effect: >-
        Exact equality in the class group on every trial. Any failure means the
        tracked object does not propagate as claimed and the lossy-projection
        argument is void.
    - metric: >-
        M5 -- the threshold value at which the two routes cross, computed
        symbolically and confirmed against the two frozen slices
      direction: different
      minimum_effect: >-
        EXACTLY 3/4, and exactly equal to IDEA-20260901-22428d's independently
        derived p^{1/4} condition. A discrepancy means one of the two derivations
        is wrong and both must be re-examined.

  minimal_test:
    design: >-
      THE CHEAPEST DECISIVE DISCRIMINATOR IS THE PLANTED-INSTANCE PIPELINE TEST,
      AND IT DECIDES CLAIM (B) WITHOUT ANY PROGRESS ON alpha WHATSOEVER. Stage 0
      (zero compute): write the threshold derivation, freeze the two symbolic
      slices (alpha = 1 must reproduce the frozen source's safe listing;
      alpha = 3/4 must give equality), and write the cascade list of safe-list
      entries that move together. Stage 1 (hours): at three toy CSIDH-like primes
      -- p = 3 mod 4, p + 1 a product of small primes, h small enough to
      enumerate -- compute Cl(Z[sqrt(-p)]) exactly, enumerate the F_p-rational
      supersingular locus, and plant secrets. Stage 2 (hours): implement S2-S5
      with End(E_0) and End(E_1) SUPPLIED FROM GROUND TRUTH -- the test is of the
      reduction, not of EndRing -- and measure M1, M2, M4 and the twist behaviour.
      Stage 3 (hours): measure M3 separately. Stage 4: the nulls. NO ATTACK IS
      MOUNTED, NOTHING IS RUN AT A DEPLOYED PARAMETER SET, AND NO ENDOMORPHISM
      RING IS COMPUTED FROM A CURVE ANYWHERE IN THE TEST.
    controls:
      - >-
        PLANTED POSITIVE (blocking). Every instance has a known a; the pipeline
        must return it (up to the declared twist ambiguity) and the certificate
        j([a]E_0) = j(E_1) must verify independently of the pipeline that
        produced it.
      - >-
        SHUFFLED-SECRET NULL (blocking). Re-run with E_1 replaced by [a']E_0 for
        an independently drawn a'. The pipeline must return a' and NOT a; if it
        returns anything correlated with the discarded a, the implementation is
        leaking the plant.
      - >-
        OFF-LOCUS NULL (blocking). Replace E_1 by a supersingular curve NOT
        F_p-rational. The pipeline must FAIL LOUDLY at step S3 -- there is no
        Frobenius orientation to intersect -- rather than return a class. A
        pipeline that returns a plausible-looking class for an off-locus input is
        producing artifacts and every number is void.
      - >-
        ROUTE 1 CALIBRATION (blocking). Measure Route 1's own cost at the same
        toy primes and confirm it scales as h^{1/2} over at least three sizes
        before any comparison of the two routes is reported.
      - >-
        ORDINARY-CURVE PROVES-TOO-MUCH CONTROL. Run the same reduction logic on
        an ORDINARY F_p curve pair, where the corpus has already established the
        conclusion is false (the ECDLP is class-invariant). The pipeline must
        return the connecting class and that class must be USELESS for the
        ECDLP -- i.e. the run must confirm the separation stated in
        method_ceiling rather than assume it.
    required_metrics:
      - correctness rate before and after twist resolution, per prime, over >= 500 planted secrets
      - fitted operation-count exponent of S2-S4 in log p
      - class-group precomputation cost, as its own column
      - propagation-identity failures (must be zero)
      - Route 1 measured scaling exponent in h
      - off-locus failure mode, recorded as a category not a rate

  falsification_conditions:
    - >-
      F1. Steps S2-S4 are NOT polynomial, or the reduction does not exist as
      described. Claim (B) collapses; CSIDH's safety stops being a numerical
      margin and becomes structural, which is a STRONGER and more interesting
      result than the one proposed, and it must be written up as such rather than
      buried.
    - >-
      F2. The pre-resolution correctness rate is not 0.5. The ambiguity is not
      two-fold; claim (C2) is wrong and the pipeline's cost and certificate
      semantics must be re-derived.
    - >-
      F3. The off-locus null returns a plausible class. The instrument fabricates
      output on invalid input; every measured number is void until it fails
      loudly.
    - >-
      F4. The threshold is not 3/4, or disagrees with IDEA-20260901-22428d's
      independently derived p^{1/4} condition. One of the two derivations is
      wrong; both go back to the bench and nothing may be quoted meanwhile.
    - >-
      F5. Route 1's measured scaling is not h^{1/2}. The baseline is
      mis-specified and the entire comparison is meaningless.
    - >-
      F6. A reviewer with retrieval finds Route 2 and its threshold already
      published. Then novelty_status becomes known-in-the-literature, the record
      keeps its value as the corpus's first record of it, and the cascade list
      and the measured reduction remain the deliverable.

  confounders:
    - >-
      C1. Route 2's step S1 on the F_p-LOCUS is not the generic EndRing problem.
      Delfs-Galbraith already solves the locus case in p^{1/4}, so the GENERIC
      exponent alpha/3 must beat 1/4 to matter -- and a locus-specific
      improvement would matter even sooner. The record uses the generic exponent
      because that is the axis the program is pushing, but the locus-specific
      exponent is the tighter quantity and it is not tracked anywhere.
    - >-
      C2. Toy CSIDH-like primes have tiny class groups where every asymptotic
      statement is invisible and where the polynomial steps dominate trivially.
      Only the CORRECTNESS and the FITTED SHAPE transfer; no cost constant does.
    - >-
      C3. Ground-truth endomorphism rings are supplied in the test. That is
      exactly the resource a real attacker lacks, and the test therefore measures
      the reduction and nothing else. Any reading of the result as an attack cost
      is a category error.
    - >-
      C4. CSIDH's deployed secret is a SHORT EXPONENT VECTOR, not a uniform class
      group element. Route 2 returns the class, from which the short vector still
      has to be found -- a lattice CVP in the relation lattice, which is
      believed easy but is another uncosted step, and the record does not include
      it. For a pure vectorization attack the class alone suffices, so the gap
      matters only for key recovery in the deployed encoding.
    - >-
      C5. p = 1 mod 4 versus p = 3 mod 4 changes the order (Z[sqrt(-p)] versus
      the order of discriminant -p) and the two-torsion of the class group. The
      test must fix the congruence class in advance and report it, or the twist
      ambiguity and the class-group structure will be conflated.

  interpretation_limits:
    - >-
      NO ATTACK ON ANY DEPLOYED CSIDH PARAMETER SET IS CLAIMED OR ATTEMPTED, AND
      NO alpha BELOW 1 IS CLAIMED TO EXIST. At today's alpha the frozen source's
      safe listing is CORRECT and this record says so.
    - >-
      Classical costs only. CSIDH's quantum security rests on Kuperberg-style
      subexponential hidden-shift algorithms and is entirely untouched; nothing
      here may be quoted in a quantum context. The ten RQ-CSIDH-64343f records
      own that lane.
    - >-
      Route 2's polynomial reduction is RECALLED folklore and no source for it
      was opened. If it fails, claim (B) fails with it.
    - >-
      Every concrete CSIDH parameter mentioned is recalled and must be checked
      against the corpus's own parameter records before any bit figure leaves
      this proposal. No bit figure is given here for that reason.
    - >-
      SURVIVOR SCOPE. CSIDH publishes no torsion-point images under a secret
      isogeny; nothing in this record uses, assumes, or needs any, and the
      SIDH/SIKE break plays no role.
    - Academic and defensive cryptanalysis only, per RQ-SSI-001's constraints.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For CSIDH-shaped primes p, the class number h of the order of
        discriminant -p (or -4p) satisfies h = p^{1/2+o(1)}, and the class group
        is large and close to cyclic, so that generic vectorization costs
        h^{1/2} = p^{1/4+o(1)} with no Pohlig-Hellman-style decomposition
        available on the torsor.
      rigorous_support: >-
        RIGOROUS SIDE. The class-number formula h = sqrt(|D|) L(1, chi_D)/pi
        gives h = |D|^{1/2+o(1)} with the o(1) controlled by Siegel's theorem
        (ineffectively) and by GRH effectively; this is not an assumption about
        typical behaviour but a theorem up to the L-value. CLASSICAL
        DISTRIBUTION STATEMENT IMITATED. Cohen-Lenstra heuristics for the group
        structure of imaginary quadratic class groups, which predict that the odd
        part is cyclic with probability about 0.977 and that small odd-order
        subgroups are rare. H1 asks only that a CSIDH discriminant behave like a
        random one in this respect.
      validation_plan: >-
        WHAT TO SAMPLE. The exact group structure of Cl(Z[sqrt(-p)]) for CSIDH-
        shaped primes. SHORTCUT AND SCALE. Exact computation is feasible for
        |D| up to roughly 10^{10} with standard class-group algorithms, giving
        several hundred CSIDH-shaped primes; beyond that, sample structure
        statistics for random discriminants of the same size as a proxy and state
        the proxy as a transfer assumption. COMPARISON DISTRIBUTION. Empirical
        distribution of the largest invariant factor h_1/h against the
        Cohen-Lenstra prediction; empirical log h against (1/2) log |D|.
        TAIL CHECKS. (i) The smallest observed h_1/h, since a class group with a
        large non-cyclic part is precisely the case where a torsor-side
        decomposition might exist and Route 1 might be cheaper than h^{1/2};
        (ii) the largest observed small-prime torsion. PARAMETERS RECORDED: the
        prime, its congruence class mod 4, |D|, the full invariant-factor
        decomposition. NOTE: this heuristic bears on ROUTE 1's baseline, not on
        Route 2, and is included because a threshold is only as good as the
        baseline it is measured against. IDEA-20260809-6e7f67 already proposes
        certified class-group structure at small CSIDH-like parameters and this
        plan should be merged into it rather than duplicated.
    - id: H2
      statement: >-
        An EndRing algorithm whose analysis assumes a uniformly random
        supersingular curve over F_{p^2} attains the same exponent on the
        F_p-rational locus, which has density Theta(p^{-1/2}) in that set.
      rigorous_support: >-
        NONE, AND THIS IS THE WEAKEST ITEM IN THE RECORD BY A WIDE MARGIN. It is
        isolated here so a reviewer can reject it without touching the threshold
        derivation. The locus is a measure-zero family in the limit, it is
        exactly the family on which the incumbent algorithm DEGENERATES (delta = 1
        there, so Algorithm 2 returns Frobenius and nothing else), and no
        uniform-input analysis transfers to it for free. A rigorous version would
        need a locus-specific analysis and none exists.
      validation_plan: >-
        WHAT TO SAMPLE. The behaviour of the incumbent algorithm's own success
        statistics on locus curves versus uniformly random curves at the four
        committed toy primes: the delta value (predicted exactly 1 on the locus,
        Theta(p^{1/3}) off it), the returned endomorphism (predicted Frobenius on
        the locus, i.e. the algorithm degenerates), and the rank of the order
        generated by k independent runs. COMPARISON. Locus arm against uniform
        arm, matched on prime. PREDICTED OUTCOME: H2 IS FALSE AS STATED, and the
        experiment should confirm the degeneration rather than the transfer.
        That is why the record does not lean on H2 anywhere in claim (B): the
        threshold is stated in terms of a generic exponent alpha and the record
        explicitly flags in quantifier_order that pushing it onto the locus needs
        a separate argument. The forced dichotomy that this degeneration creates
        is developed in IDEA-20260904-9bf9c6 and should be run first.
        TAIL CHECK. Whether ANY locus curve at the toy primes has delta > 1,
        which would refute the elementary claim that E^{(p)} is isomorphic to E
        there and would indicate a bug in the graph labels.

  target_complexity:
    time_exponent: >-
      CSIDH classical vectorization: min(p^{1/4+o(1)}, p^{alpha/3+o(1)}). At the
      inhabited alpha = 1 this is p^{1/4+o(1)}, i.e. UNCHANGED from the baseline
      and no improvement is claimed. Below alpha = 3/4 it is p^{alpha/3+o(1)},
      which is strictly better than the baseline; at alpha = 1/2 it would be
      p^{1/6+o(1)}. Every value below 1/4 is conditional on an object that does
      not exist.
    memory_exponent: >-
      Route 1's baseline is p^{1/4} memory for plain meet-in-the-middle and
      tunable low memory for van Oorschot-Wiener distinguished points, so ROUTE 1
      DOMINATES ROUTE 2 ON MEMORY TODAY AND WOULD CONTINUE TO unless the EndRing
      algorithm supplying alpha has small memory. The incumbent EndRing algorithm
      has memory p^{1/3}, which at alpha = 1 exceeds Route 1's entire time cost.
      Route 2 is therefore a TIME-axis proposal that is memory-dominated
      throughout, and that is stated here rather than left to be discovered.
    best_known: >-
      Classical: p^{1/4+o(1)} by group-action meet-in-the-middle / kangaroo / vOW
      (corpus baseline in IDEA-20260901-871141). Quantum: Kuperberg-style
      subexponential hidden shift, exp(O(sqrt(log h))), which is far below any
      exponent in this record and is the actual binding constraint on CSIDH
      parameter choice; this record does not compete with it and does not
      comment on it.
    hidden_overhead: >-
      DISCLOSED. (i) The class-group precomputation is L_p[1/2], which is
      p^{o(1)} asymptotically and enormous concretely -- it was a headline
      computation at CSIDH-512 -- and it is charged as its own column, never
      absorbed. (ii) Route 2 inherits whatever o(1) the EndRing algorithm
      carries, which for the incumbent is the superpolynomial rho^{-1} smoothness
      retry. (iii) The effective class-group action used for verification carries
      its own polynomial constants which this record does not estimate.
    tradeoff_note: >-
      Route 1 interpolates on the van Oorschot-Wiener curve down to small memory.
      Route 2 has no such interpolation: its cost is dominated by an EndRing call
      whose own memory is p^{1/3} at alpha = 1, so Route 2 sits at a single point
      with bad memory and cannot be traded. A low-memory EndRing algorithm --
      which is exactly what IDEA-20260904-9b58ab proposes -- would change that,
      which is a dependency between the two records worth recording.

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES; NOT SET TO NULL.
    (i) Group-action meet-in-the-middle, time p^{1/4}, memory p^{1/4}, zero
    queries. DOMINATES Route 2 on TIME at every alpha > 3/4, hence today.
    (ii) van Oorschot-Wiener distinguished points on the torsor, time p^{1/4},
    memory TUNABLE DOWN TO POLYNOMIAL, zero queries. DOMINATES Route 2 OUTRIGHT
    on both axes at every alpha > 3/4, and dominates it on MEMORY at every alpha
    whatsoever unless the EndRing algorithm supplying alpha is low-memory. This
    is the row that matters and it is the reason this record's priority is not
    higher.
    (iii) Kuperberg / collimation quantum hidden shift, subexponential
    exp(O(sqrt(log h))). Dominates every classical row on time in its own model.
    It is not classically comparable and is recorded rather than ignored, because
    a reader deciding how much CSIDH's classical exponent matters must know that
    the quantum row is what actually sets CSIDH parameters.
    (iv) Self-pairing attacks at special discriminants, polynomial time
    (IDEA-20260806-b7fdc3, IDEA-20260901-871141). DOMINATE everything on exactly
    the instances where they apply; CSIDH's own discriminant -p is not one of
    them, which is why they do not bound this record, but the row is on the
    frontier and is checked.
    (v) IDEA-20260901-871141's conditional representation-technique route, time
    max(K/R, K^{1/2}). Not realised (no digest exists), so it dominates nothing;
    listed because it is the corpus's only other classical CSIDH proposal and a
    Coordinator ranking the CSIDH lane must weigh the two together. They are
    complementary: 871141 attacks Route 1, this record opens Route 2.
    (vi) Data/queries axis: all rows use zero data and zero oracle queries.
    Route 2 additionally consumes an L_p[1/2] PREPROCESSING that no other row
    needs, so on a preprocessing axis Route 2 is dominated by every row above.
  sota_delta: >-
    ON TIME: +0 today. The exponent min(1/4, alpha/3) equals the baseline 1/4 at
    every alpha >= 3/4, and no alpha below 1 is exhibited.
    ON MEMORY: NEGATIVE. Route 2 at alpha = 1 needs the incumbent EndRing's
    p^{1/3} memory, which exceeds Route 1's entire p^{1/4} time cost; against
    vOW's tunable memory the loss is a full exponent.
    ON PREPROCESSING: NEGATIVE. Route 2 adds an L_p[1/2] class-group
    computation that Route 1 does not need.
    QUANTIFIED DELIVERABLES INSTEAD:
    (1) The threshold alpha = 3/4, stated as an exact rational and shown
    identical to IDEA-20260901-22428d's independently derived p^{1/4} condition.
    (2) The margin: CSIDH's place on the frozen source's safe list rests on the
    exponent gap 1/3 - 1/4 = 1/12, the smallest margin on that list, which no
    record in this program has computed.
    (3) A cascade list: CSIDH, (qt-)Pegasis and the PQarrots threshold primitives
    all move together at alpha = 3/4 because they are class-group actions on the
    same F_p-rational set with the same two routes.
    (4) A measured, certificate-carrying implementation of a reduction the
    program currently treats as folklore, with the twist ambiguity and the
    class-group precomputation charged separately.

