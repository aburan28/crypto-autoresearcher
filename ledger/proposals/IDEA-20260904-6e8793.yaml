  null_object_control: >-
    NULL OBJECT ONE (blocking): the OFF-LOCUS input. A supersingular curve not
    defined over F_p has no Frobenius orientation, so step S3 has nothing to
    intersect and the pipeline MUST fail loudly rather than return a class.
    A pipeline that returns a plausible class for an off-locus input is
    fabricating structure and no measurement from it is admissible.
    NULL OBJECT TWO (blocking): the SHUFFLED SECRET. Replace E_1 by [a']E_0 for
    an independently drawn a' after the plant is fixed; the pipeline must return
    a' and show no correlation with the discarded a.
    PROVES-TOO-MUCH CONTROL (blocking): the ORDINARY F_p curve pair, where this
    program has already established that the connecting class buys nothing for
    the ECDLP. The reduction must run and its output must be USELESS there. An
    argument that appeared to break the ordinary case would be wrong somewhere
    nobody has read closely enough.
    KNOWN-ANSWER CALIBRATION (blocking): the two symbolic slices alpha = 1 and
    alpha = 3/4, plus Route 1 measured to scale as h^{1/2} over three primes.
    DECAY CHECK: the pre-resolution correctness rate must sit at 0.5 and must NOT
    drift with prime size. A rate that varies with p means the twist ambiguity is
    not the mechanism and something else is being measured.

