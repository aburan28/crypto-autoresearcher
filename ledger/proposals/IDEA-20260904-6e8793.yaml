idea:
  id: IDEA-20260904-6e8793
  question_id: RQ-SSI-001
  goal_id: GOAL-SSI-001
  handoff_id: TASK-20260904-9a7471
  added: '2026-09-04'

  title: >-
    CSIDH SITS ON THE FROZEN SOURCE'S "SAFE" LIST BY A MARGIN OF EXACTLY ONE
    NUMBER, AND THAT NUMBER IS alpha = 3/4: CSIDH key recovery has a SECOND
    route nobody in this program has costed -- recover both endomorphism rings
    and take the connecting ideal -- whose exponent is the supersingular
    detection exponent alpha divided by 3, so CSIDH's classical security is
    min(p^{1/4}, p^{alpha/3}) and it leaves the safe list the moment alpha drops
    below 3/4; the reduction that carries the cascade is believed polynomial,
    has a two-fold twist ambiguity, and has never been implemented or measured
    anywhere in this corpus

  class: mechanism

  claim: >-
    STATED FIRST. No attack on any deployed CSIDH parameter set is claimed, no
    value of alpha below 1 is claimed to exist, and the frozen source's
    arithmetic is not disputed -- at alpha = 1 its scope statement is CORRECT and
    CSIDH is safe from its algorithm. What is claimed is that the safety is a
    THRESHOLD, that the threshold is computable and equals 3/4, that the
    reduction carrying it is uncosted in this program, and that a small
    measurement decides whether the reduction works at all.

    (A) THE TWO ROUTES TO A CSIDH SECRET, AND WHY ONLY ONE IS EVER PRICED HERE.
    CSIDH vectorization: given E_0 and E_1 = [a]E_0 in the F_p-rational
    supersingular set acted on freely and transitively by Cl(O) with
    O = Z[sqrt(-p)] (or the order of discriminant -p), find a.
      ROUTE 1, GROUP-ACTION SEARCH. Meet-in-the-middle, kangaroo, or van
      Oorschot-Wiener inside the torsor. Cost h^{1/2} = p^{1/4+o(1)} where
      h = #Cl(O) = p^{1/2+o(1)} by the class-number formula. This is the only
      route any of the corpus's CSIDH records prices, and the generic-group-action
      lower bound makes it optimal against algorithms that use nothing but the
      action.
      ROUTE 2, ENDOMORPHISM RINGS. Compute End(E_0) and End(E_1) as maximal
      orders in B_{p,infinity}, form the connecting ideal, intersect with the
      Frobenius orientation to get a Z[sqrt(-p)]-ideal, and reduce its class in
      the (precomputed) class group. Cost = (cost of EndRing on an F_p-rational
      curve) + poly. Route 2 is invisible in this program: grep of the SSI
      proposal pool finds no record that states it, prices it, or tests it.

    (B) THE THRESHOLD, DERIVED. Under the detection axis of IDEA-20260904-ec17aa
    -- itself the alpha/3 identity of IDEA-20260821-e99afd -- a per-curve stratum
    detector of cost D^{alpha} yields EndRing in p^{alpha/3+o(1)}. Therefore

        CSIDH classical security = min( p^{1/4+o(1)} , p^{alpha/3+o(1)} ),

    and Route 2 overtakes Route 1 exactly when alpha/3 < 1/4, i.e.

        alpha < 3/4.

    At the currently inhabited value alpha = 1 the two routes are p^{1/4} and
    p^{1/3}, Route 1 wins, and the frozen source's "CSIDH is safe" is right --
    with a margin of exactly 1/3 - 1/4 = 1/12 in the exponent, which is the
    smallest margin on its entire safe list. NOTE THE COINCIDENCE AND ITS
    MEANING: IDEA-20260901-22428d already computed alpha <= 3/4 as the condition
    for reaching p^{1/4} on the F_{p^2} side. It is the same 3/4 because reaching
    p^{1/4} for the supersingular endomorphism problem IS reaching CSIDH's own
    baseline; the two thresholds were never independent and no record says so.

    (C) THE REDUCTION IS THE JOINT, AND IT IS UNTESTED. Route 2's cascade rests
    on the step
        (End(E_0), End(E_1) as explicit maximal orders)  ->  a in Cl(Z[sqrt(-p)])
    which is folklore-polynomial and which this program has never implemented,
    costed, or checked. It has at least three places to fail, all cheap to test:
      (C1) THE CONNECTING IDEAL. I(O_0, O_1) = the left O_0-ideal with right
      order O_1, computable by lattice linear algebra in polynomial time in
      log p. Believed routine; unverified here.
      (C2) THE ORIENTATION INTERSECTION AND ITS TWO-FOLD AMBIGUITY. Both curves
      are F_p-rational, so each carries the Frobenius orientation, but an
      embedding of Z[sqrt(-p)] into a maximal order comes in a conjugate PAIR
      (pi and -pi, equivalently E and its quadratic twist). Choosing the wrong
      one of the two returns a^{-1} instead of a. This is not a defect: it is a
      one-bit ambiguity resolved by ONE evaluation of the action. But it is
      exactly the kind of step that folklore statements skip and implementations
      get wrong, and it must appear in any charged cost.
      (C3) THE CLASS-GROUP REDUCTION. Reducing the resulting Z[sqrt(-p)]-ideal to
      its class requires the structure of Cl(Z[sqrt(-p)]), whose classical
      computation is subexponential L[1/2] = p^{o(1)} asymptotically and was a
      major computation at CSIDH-512 concretely. IT IS PREPROCESSING AND IT IS
      CHARGED IN THIS RECORD RATHER THAN ABSORBED, because "p^{o(1)}" hides a
      quantity that dominates every concrete number at deployed sizes.

    (D) WHAT MAKES THIS WORTH A SESSION RATHER THAN A FOOTNOTE. The frozen
    source's safe list -- CSIDH, (qt-)Pegasis, M(D)-SIDH, FESTA, POKE -- is
    justified in one sentence: "other cryptanalytic algorithms dominate the
    security analysis of these schemes". That sentence is a comparison of two
    exponents, and this record makes the comparison explicit and gives it a
    threshold. A program whose central lane is trying to move alpha should know
    that moving it past 3/4 does not merely improve a SQIsign figure -- it
    RELOCATES CSIDH from the safe list to the affected list, and it does so for
    (qt-)Pegasis and PQarrots at the same instant, because those are class-group
    actions on the same F_p-rational set with the same two routes. That cascade
    is a corollary obtained by citation and arithmetic, which is exactly the
    reduction-network pattern the target profile asks for.

    (E) NOT CLAIMED. That alpha < 3/4 exists or is near. That Route 2 is
    currently competitive -- it is not, by a factor p^{1/12}. That the
    class-group precomputation is cheap in practice -- it is not. That anything
    here bears on CSIDH's QUANTUM security, which is set by Kuperberg-style
    hidden-shift algorithms at subexponential cost and is untouched by any
    exponent in this record.

  mechanism: >-
    TRACKED OBJECT: the CONNECTING IDEAL CLASS between the two maximal orders,
    carried as an element of Cl(Z[sqrt(-p)]) rather than as a curve or an
    isogeny -- i.e. the CSIDH secret viewed through the quaternion side instead
    of through the group action.

    LOSSY-PROJECTION TEST (algebraic, zero compute). The projection sends the
    pair of maximal orders (O_0, O_1) -- each a rank-4 lattice carrying the full
    endomorphism structure -- to a single class in a group of order
    h = p^{1/2+o(1)}. It is massively lossy: the fibre over a class contains
    every pair of orders connected by an ideal in that class, and neither order
    is recoverable from the class. What is discarded -- everything about the
    orders except how they are connected along the orientation -- is discarded
    COMPATIBLY with the operation the attack applies, namely the class-group
    action: acting by an ideal b sends the connecting class to (class) * (class
    of b), so the retained part propagates deterministically and multiplicatively
    under exactly the operation CSIDH performs. That is the whole reason Route 2
    exists. CONTRAST WITH THE PROJECTION THAT FAILS THE TEST: the j-invariant of
    E_1 is a complete invariant of the curve, loses nothing, and is therefore a
    change of coordinates rather than an object -- which is why no attack
    tracking j alone has ever beaten h^{1/2}.

    THE PIPELINE, STATED SO IT CAN BE PRICED STEP BY STEP.
      S1. EndRing(E_0) and EndRing(E_1). Cost 2 * p^{alpha/3+o(1)} generically;
          on the F_p-locus specifically it is also achievable at p^{1/4+o(1)} by
          the Delfs-Galbraith locus walk, so Route 2's honest cost is
          2 * min(p^{alpha/3}, p^{1/4}) and Route 2 can never beat Route 1 by
          more than the constant 2 unless alpha < 3/4. Stating that ceiling
          up front is what keeps this record from overclaiming.
      S2. Connecting ideal I(O_0, O_1) by lattice linear algebra. poly(log p).
      S3. Intersect with the orientation: a = I cap Z[sqrt(-p)]-structure,
          resolving the conjugate-embedding ambiguity by one action evaluation.
          poly(log p) plus one action.
      S4. Reduce [a] in Cl(Z[sqrt(-p)]) using the precomputed group structure.
          poly(log p) given the precomputation; the precomputation itself is
          L[1/2] = p^{o(1)} and is charged separately.
      S5. Verify by evaluating [a]E_0 and comparing j-invariants. Polynomial via
          an effective class-group action (the frozen source's references [17],
          [18]), and this verification is what makes any claimed recovery
          CERTIFIABLE under docs/claims-and-verification.md rather than asserted.

  exponent_lever:
    is_exponent_moving: true
    axis: time
    assumption_attacked: >-
      CSIDH's commutative class-group-action vectorization assumption -- and, by
      the identical two-route argument, every effective-class-group-action
      construction on the same F_p-rational supersingular set, including
      (qt-)Pegasis and the PQarrots threshold primitives that the frozen source
      also lists as safe.
    baseline: >-
      p^{1/4+o(1)} classical, from group-action meet-in-the-middle / kangaroo /
      van Oorschot-Wiener in a class group of order h = p^{1/2+o(1)}; this is
      also the corpus's own recorded CSIDH baseline (IDEA-20260901-871141).
      Quantum baseline, untouched here: Kuperberg-style subexponential.
    target: >-
      p^{alpha/3+o(1)} classical whenever alpha < 3/4, which is strictly below
      p^{1/4}. UNINHABITED as filed -- no alpha below 1 exists -- and the
      deliverable is the threshold, the cascade list, and the measured reduction,
      not an attack.

  novelty_status: unverified

