      (IDEA-20260807-5d7606 uses the Deuring kernel-ideal correspondence for
      ordinary curves) but never for CSIDH key recovery.
    verdict: >-
      UNVERIFIED. Route 2 is almost certainly WELL KNOWN in the isogeny
      literature -- "knowing the endomorphism rings breaks oriented and
      CM-based schemes" is standard folklore and is very likely stated
      explicitly in Galbraith-Petit-Silva, in Wesolowski's HDR (frozen source
