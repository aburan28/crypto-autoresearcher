idea:
  id: IDEA-20260904-f7d47d
  question_id: RQ-ECDLP-002
  added: '2026-09-04'
  title: >-
    THE O2 LINE'S LOAD-BEARING HOLE IS A SECOND MOMENT NOBODY HAS MEASURED:
    Lemma 5 bridges the bucket-AVERAGED agreement rate to the attacker's
    per-bucket rate with the words "if the pi_c are equal", and the exact
    quantity that hypothesis asserts -- the relative variance of pi_c across
    target buckets -- is estimable on the existing 8-prime ladder, decides the
    j = 2 configuration at exponent 0.4167 in BOTH directions, and replaces a
    union bound over M^2 frequencies with an orthogonality step in the bucket
    variable
  class: measurement

  claim: >-
    (A) THE EXACT CLAIM. Let E/F_p have #E(F_p) = N prime, let h : E(F_p) -> [M]
    be a cheaply computable filter, let f be a combining rule, and for uniform
    independent P, Q write
        delta   = Pr[h(P+Q) = f(h(P), h(Q))],
        pi_c(d) = the same rate conditioned on the target bucket c and offset d,
        q_c     = the weight of bucket c,        delta = Sum_c q_c pi_c.
    Define the RELATIVE BUCKET VARIANCE
        W = Sum_c q_c * (pi_c/delta - 1)^2.
    Then by Cauchy-Schwarz, max_c pi_c/delta <= 1 + sqrt(W / min_c q_c), and
    since a Wagner level pays G = M * max_{c,d} pi_c(d) with M*delta = 1 + o(1)
    and q_c = Theta(1/M) for the covered families,
        G <= 1 + sqrt(M * W) * (1 + o(1)).
    THE CLAIM UNDER TEST: W admits the scaling law W = Theta(M^a * p^{-1/2})
    above a finite-sample floor, and the fitted a decides everything, because
    G = 1 + o(1) at M = p^{1/3} -- the j = 2 operating point -- requires
    M*W = o(1), i.e. M^{a+1} = o(p^{1/2}), i.e. a < 1/2.

    (B) WHY THIS IS THE RIGHT QUANTITY AND NOT ANOTHER RESTATEMENT.
    KN-FIND-ffe1df records, from red team RT-20260803-be45a8, that every theorem
    in the O2 line bounds delta, the bucket-AVERAGED rate, while a Wagner level
    fixes one bucket chosen AFTER seeing h and pays max_c pi_c >= delta. The
    entry states that O2_derivation_attempt.md Lemma 5 bridges this with the
    words "if the pi_c are equal" and that NOTHING ELSE IN THE LINE TOUCHES THAT
    HYPOTHESIS. The relative variance W IS that hypothesis, quantified: Lemma 5
    is the assertion W = 0, and the exact amount by which Lemma 5 is false is
    sqrt(M*W). The line's own repair attempt expands the single-bucket rate
    directly, obtains M^2 coefficients all of modulus 1, and reaches only
    M <= p^{1/4} -- a union bound over M^2 frequencies. The second moment
    performs the sum over c INSIDE the character expansion, where orthogonality
    in the bucket variable collapses the frequency count before the triangle
    inequality is taken, which is why a is a genuinely open exponent and not
    forced to 2.

    (C) THE TWO OUTCOMES, WITH THEIR MEANINGS FIXED BEFORE MEASUREMENT, AND THEY
    POINT IN OPPOSITE DIRECTIONS. This is the reason to run it.
    OUTCOME SMALL-W (fitted a < 1/2, with W decaying in p at the Weil rate
    p^{-1/2} after null subtraction): the buckets are near-equal at the scale
    that matters, the second-moment route is a live repair for Lemma 5, and a
    proof attempt is warranted whose success would move j = 2 from UNPROVED to
    closed -- i.e. it would RETIRE the exponent-0.4167 configuration.
    OUTCOME LARGE-W (fitted a >= 1/2, or W not decaying in p): the buckets are
    UNEQUAL by a growing factor, which is the ATTACKER-FAVOURABLE side -- an
    attacker who picks the bucket after seeing h collects max_c pi_c and not
    delta, so a non-decaying W is the first quantitative sign this program would
    have of a filtering gain, and it simultaneously closes the second-moment
    route as a proof technique. Both readings are recorded here in advance so
    that neither can be adopted after seeing the numbers.

    (D) WHAT IT DOES NOT DO. It is level 1 only. KN-FIND-ffe1df records that at
    levels >= 2 the inputs are conditioned on having matched at the previous
    level and are neither uniform nor independent, so no bound proved for
    uniform independent P, Q transfers as stated. That gap is untouched here and
    is named in the interpretation limits, not quietly absorbed.

  mechanism: >-
    A Wagner k-tree level is paid at the rate of the single target bucket the
    attacker selects. Whether the average rate delta controls that selected rate
    is exactly a statement about how the mass of the agreement event is spread
    across buckets, and spread is a second moment. The mechanism proposed is to
    bound max_c pi_c by (first moment) + sqrt(second moment / min bucket weight)
    rather than by expanding the single-bucket rate directly. The direct
    expansion loses a factor M^2 because it takes a triangle inequality over all
    M^2 pairs of bucket frequencies, each coefficient of modulus 1 -- the
    Cauchy-Schwarz step that both O2 derivations independently flagged. In the
    second moment, the sum over the bucket variable c can be carried out against
    the characters of [M] before any absolute values are taken, so the M^2 pairs
    collapse by orthogonality to the diagonal, leaving a four-point correlation
    on E(F_p) x E(F_p) of the type Theorem A-prime already handles, each
    non-trivial frequency of which is bounded at the Weil scale p^{-1/2}. The
    open quantity is how many frequencies survive the collapse, which is the
    exponent a, and it is measurable long before it is provable.

  novelty_status: unverified

  citations:
    - ref: KN-FIND-ffe1df
      provenance: internal
      claim: >-
        The bucket-averaging hole (RT-20260803-be45a8) is the largest gap in the
        O2 line and postdates every theorem in it; Lemma 5 bridges delta to
        max_c pi_c with the hypothesis that the pi_c are equal and nothing else
        in the line touches that hypothesis; the direct single-bucket repair
        reaches only M <= p^{1/4} while j = 2 needs M ~ p^{1/3}; measured at
        p = 65539, M = 40, M*max_c pi_c = 1.084 against M*delta = 1.002 with the
        SHA null at 1.082 and the excess decaying in p from 1.15 to 1.08;
        RT-EXP-1 found no attack signal for any cheap filter at M = N^{1/3},
        with popcount and digitsum reproduced exactly by the matched-marginal
        shuffle; Theorem C closes the EXACT quasigroup case only.
      verified_by: this session read knowledge/findings/KN-FIND-ffe1df.md in full
    - ref: KN-TECH-056
      provenance: internal
      claim: >-
        Controls before belief -- a reported signal is an artifact until the
        identical measurement has been run against a null object of the same
        shape; a quantity that fails to decay when the parameter meant to destroy
        it increases is the canonical artifact tell.
      verified_by: >-
        cited through AGENTS.md and docs/inventor-protocol.md, both read in this
        session; the technique abstract itself was not opened
    - ref: 'Wagner, D., A generalized birthday problem, CRYPTO 2002'
      provenance: recalled
      claim: >-
        The k-tree algorithm and its level structure, including that a level is
        paid at the rate of the selected bucket. Named so a reviewer can chase
        it; no step of this record depends on the exact reference.
      verified_by: null
    - ref: 'Weil, A., Sur les courbes algebriques et les varietes qui s en deduisent, 1948; Bombieri, E., On exponential sums in finite fields, 1966'
      provenance: recalled
      claim: >-
        Character sums along a curve of genus g over F_q are bounded by
        (2g - 2 + 2m) * sqrt(q) for non-degenerate characters. This is the
        p^{-1/2} scale the fitted law is stated against. KN-LIT-7639 and
        KN-LIT-f6de4b record that this program has traced this only partly for
        the multiplicative case and largely NOT for the additive case, and that
        limitation is inherited here.
      verified_by: null

  assumptions:
    - N = #E(F_p) is prime and h is computable in time polylog(p) per point.
    - >-
      q_c = Theta(1/M) for the filters under test, which must be measured per
      cell and not assumed; if a filter has a bucket of weight o(1/M) the
      Cauchy-Schwarz step degrades and that filter is reported separately.
    - >-
      f is a quasigroup, since a tree must invert f in each argument to index
      buckets. This is the same hypothesis Theorem C uses and is inherited.
    - >-
      Level 1 only. Uniform independent P, Q. This is a restriction, not an
      approximation.

  proof_search_map:
    bottleneck: >-
      The single step whose removal changes the theorem is Lemma 5's passage
      from delta to max_c pi_c. Every other step of the O2 line is proved or
      corrected; this one is a hypothesis stated in words. Removing it converts
      the line's level-1 bound from a statement about an average into a
      statement about the attacker's actual rate.
    baseline_embedding:
      parameter_slice: >-
        At W = 0 the bound G <= 1 + sqrt(M*W) returns G <= 1, which is exactly
        Lemma 5's conclusion; the new bound must reproduce the old one on its own
        hypothesis. At the measured cell p = 65539, M = 40, the pipeline must
        reproduce M*delta = 1.002 and M*max_c pi_c = 1.084 to the digits recorded
        in KN-FIND-ffe1df, and the SHA null at 1.082.
      reproduction_check: >-
        A frozen regression fixture pinning those three numbers from the existing
        artifacts, run before any new cell is measured. If the harness does not
        reproduce them the run is invalid and reports an infrastructure failure,
        not a result.
    observation_collision:
      observable: W, the relative bucket variance, and the derived bound on G.
      distinct_preimage_search: >-
        Two distinct objects with the same W must be exhibited and are: a filter
        whose pi_c are all equal to delta, and a filter with two buckets
        symmetrically displaced by +e and -e in a way that cancels in the first
        moment. Both give the same delta and different W, which is the point --
        the collision is on delta, and W is proposed precisely because it
        separates the two. In the other direction, W does NOT determine max_c
        pi_c: a single heavy bucket and many mildly heavy buckets can share a W,
        and the Cauchy-Schwarz bound is one-sided. So a SMALL measured W bounds
        the attacker; a LARGE measured W does not by itself exhibit an attack,
        and the record must not read it as one.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          The vector (pi_c)_c and its relative second moment W, replacing the
          scalar delta as the tracked invariant of a Wagner level.
        predicted_gain: >-
          Closure of the j = 2 configuration at exponent 0.4167 if a < 1/2, by
          moving the reachable alphabet from M <= p^{1/4} to M <= p^{1/(2(a+1))},
          which exceeds p^{1/3} exactly when a < 1/2.
    quantifier_order: >-
      FOR ALL filters h in the declared covered families and FOR ALL M in the
      declared grid, THERE EXISTS a > 0 and p_0 such that FOR ALL p > p_0 on the
      ladder, W(h, M, p) <= C * M^a * p^{-1/2}. The claim being tested is the
      value of a, not the existence of the law; if the fitted law itself is
      rejected -- for instance if W does not decay in p at all -- that is the
      LARGE-W outcome and is reported as such.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest claim this method can certify is a level-1, covered-family,
        bucket-selected bound on G at the tested primes and alphabets, with a
        fitted scaling law. It can never certify levels >= 2, never certify the
        families KN-FIND-ffe1df lists as uncovered (D, I, J, the non-x members of
        A and B, target-dependent h, O(1)-valued combining rules), and never
        convert a fitted exponent into a theorem.
      nearby_object_control: >-
        The nearby object on which the desired conclusion is KNOWN FALSE is the
        dlog-interval pullback filter, which Proposition 2 of
        O2_derivation_attempt.md exhibits with agreement about 1/2 at arbitrarily
        large M on EVERY prime-order group. Any argument that would bound its G
        by 1 + o(1) proves too much and is wrong. The measurement must therefore
        report a LARGE W for that filter -- it is included as an arm precisely so
        that a pipeline reporting small W everywhere is caught.
    proof_obligations:
      - claim: 'max_c pi_c/delta <= 1 + sqrt(W / min_c q_c)'
        responsibility: correctness
      - claim: 'G = M * max_c pi_c and M*delta = 1 + o(1) for the covered families'
        responsibility: baseline
      - claim: >-
          the sum over c can be carried against the characters of [M] before any
          absolute value is taken, collapsing M^2 frequency pairs to the diagonal
        responsibility: strictness
      - claim: >-
          the surviving four-point correlation is bounded at the Weil scale with
          a frequency count M^a for the fitted a
        responsibility: size
      - claim: >-
          the debiased estimator of W has bias below the effect being resolved at
          the declared sample size
        responsibility: success_probability
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: >-
      The bucket-conditional agreement rate vector (pi_c)_c of a filter, and its
      relative second moment W. The corpus's tracked object in this lane has been
      the scalar delta, which is the first moment of the same vector.
    lossy_projection_test: >-
      The joint distribution of (h(P), h(Q), h(P+Q)) is an M^3 table. The vector
      (pi_c)_c is M numbers, and (delta, W) is two. Both are genuinely lossy, and
      the projection to (delta, W) discards which bucket is heavy, all
      offset-dependence beyond the maximum, and the entire pair-level structure.
      What it discards is discarded COMPATIBLY with the operation of a Wagner
      level: a merge at a fixed bucket consumes pi_c and nothing else, and a
      merge at an adversarially selected bucket consumes max_c pi_c, which
      (delta, W) bounds. The projection is not a change of coordinates -- it is
      strictly coarser than the M^3 table and strictly finer than delta -- and
      the entire content of this record is that the corpus's existing projection
      to delta is one step TOO lossy, because it discards exactly the variation
      the attacker selects on.
    one_step_propagation: >-
      One step is one tree merge. At level 1 the propagation is defined and
      measurable, which is what this record measures. At levels >= 2 the inputs
      are conditioned and the propagation of (delta, W) is NOT defined by
      anything proved here; that is the survival depth.
    survival_depth: >-
      Exactly one level. This is stated as a limit, not a hope. The corpus notes
      a plausible bootstrapping argument for why level 1 should suffice to close
      a configuration and also notes that the argument has never been written
      down; this record does not assume it.

  predictions:
    - metric: >-
        the fitted exponent a in W = C * M^a * p^{-1/2}, for the covered filter
        families (x mod M, quadratic-character based), after null subtraction
      direction: different
      minimum_effect: >-
        a is resolved with a 95 percent interval of width below 0.4, sufficient
        to place it on one side of 1/2 or to report that it straddles 1/2
    - metric: >-
        the exponent of W in p at fixed M/N^{1/3}, for the covered families
      direction: lower
      minimum_effect: >-
        a fitted slope of at most -0.4 in log W against log p, consistent with
        the Weil scale p^{-1/2}, after subtracting the matched-marginal floor
    - metric: W for the SHA-256 null at identical M and sample size
      direction: different
      minimum_effect: >-
        indistinguishable from the covered families' W within the bootstrap
        interval; a covered family whose W exceeds the SHA null by less than the
        interval has no measured excess and must be reported as such
    - metric: W for the dlog-interval pullback filter, the known-large arm
      direction: higher
      minimum_effect: >-
        W exceeding the SHA null by a factor of at least 10 at every prime. If it
        does not, the estimator cannot resolve a real bucket imbalance and no
        null from it is interpretable
    - metric: >-
        W for the planted theta = p^{-1/9} discrete-log mixture calibrated to sit
        at M*T = 1
      direction: higher
      minimum_effect: >-
        separated from the SHA null with a 95 percent interval excluding equality
        at three or more primes; this is the sensitivity RT-EXP-1 established for
        G and that must now be re-established for W

  minimal_test:
    design: >-
      Reuse the RT-EXP-1 harness and its 8-prime ladder. For each prime, three
      curves. Alphabet grid M in {round(N^{1/4}), round(N^{1/3}),
      round(N^{2/5})}, which is what makes the exponent a identifiable rather
      than confounded with p. FILTER ARMS: (F1) x mod M and (F2) a
      quadratic-character-based filter, the two families the coverage table lists
      as closed at level 1 and therefore the ones for which a bound is meaningful;
      (F3) the dlog-interval pullback, the known-large arm; (F4) SHA-256
      truncated to M buckets, the in-arm null; (F5) the matched-marginal shuffle
      of F1 and F2; (F6) the planted theta = p^{-1/9} dlog mixture. ESTIMATOR:
      for each cell draw n = 10^7 independent uniform pairs (P, Q), accumulate
      the joint counts, and form a JACKKNIFE-DEBIASED estimator of W together
      with the measured q_c vector; at the two smallest primes also compute W
      EXACTLY by whole-group enumeration, as an exactness anchor for the
      estimator's bias. Report W, its bootstrap interval, the measured min_c q_c,
      the derived bound 1 + sqrt(W/min_c q_c), and the directly measured
      G = M*max_{c,d} pi_c(d) in the same cell so the bound can be checked
      against the quantity it bounds.
    controls:
      - >-
        NULL OBJECT, named concretely and not as "a random filter": SHA-256
        truncated to M buckets, evaluated on the SAME curves, at the SAME M, with
        the SAME sample size and the SAME estimator. This is the same curve with
        the algebraic structure of the filter removed and the cost profile kept.
      - >-
        MATCHED-MARGINAL SHUFFLE: replace h by h composed with a uniformly random
        permutation of E(F_p). This preserves every bucket weight q_c exactly and
        destroys all compatibility with the group law. It is the control that
        reproduced popcount and digitsum exactly in RT-EXP-1 and exposed them as
        false positives, and any excess in a covered family that the shuffle also
        reproduces is a marginal artifact.
      - >-
        KNOWN-LARGE ARM (a positive control for the estimator): the dlog-interval
        pullback, whose agreement is about 1/2 at arbitrarily large M on every
        prime-order group. The estimator must show a large W here.
      - >-
        BOUNDARY-SENSITIVITY ARM: the planted theta = p^{-1/9} mixture calibrated
        to sit at M*T = 1. KN-FIND-ffe1df records that the P2 control is flat by
        algebraic identity and calibrates only the maximal-signal end, never
        demonstrating that the instrument resolves the boundary where closure is
        decided. That criticism applies verbatim to any new estimator, so this
        arm is mandatory and P2 alone is not accepted.
      - >-
        EXACTNESS ANCHOR: whole-group enumeration of W at the two smallest primes,
        so the sampling estimator is checked against an exact value rather than
        against itself.
    required_metrics:
      - >-
        W with a 95 percent bootstrap interval, per (prime, curve, M, filter arm)
      - the measured bucket-weight vector q_c and its minimum
      - >-
        the derived bound 1 + sqrt(W/min_c q_c) and the directly measured
        G = M*max_{c,d} pi_c(d), side by side in every cell
      - >-
        the fitted a and the fitted p-exponent, each with an interval, from a
        joint regression over the M grid and the prime ladder
      - >-
        the exact W at the two smallest primes and the estimator's realised bias
        against it
      - wall-clock and peak RSS per cell

  falsification_conditions:
    - >-
      SMALL-W (the repair is live): the fitted a has a 95 percent interval lying
      entirely below 1/2 AND the fitted p-exponent lies entirely below -0.4,
      for both covered families, after null subtraction, with the known-large arm
      firing and the planted arm separating.
    - >-
      LARGE-W (the repair route is closed, and the attacker side is open): the
      fitted a has an interval lying entirely above 1/2, OR the fitted p-exponent
      interval contains 0, for either covered family. Under KN-TECH-056 a
      quantity that fails to decay when the parameter meant to destroy it
      increases is the canonical artifact tell, so this outcome triggers the
      shuffle and SHA arms as the first explanation and is only read as an
      attacker-side signal if both nulls decay while the covered family does not.
    - >-
      ESTIMATOR REFUTATION: the known-large arm F3 fails to exceed the SHA null
      by a factor of 10, or the planted arm F6 fails to separate from the null at
      three or more primes. Then no null from this estimator is interpretable and
      the run reports an instrument failure, not a mathematical result.
    - >-
      HARNESS REFUTATION: the regression fixture fails to reproduce
      M*delta = 1.002, M*max_c pi_c = 1.084 and the SHA null 1.082 at
      p = 65539, M = 40.

  confounders:
    - >-
      W is a variance and every sampling estimator of a variance is biased
      upward; at M = N^{1/3} the per-bucket counts are small and the bias is
      large. The jackknife debiasing, the exact anchor at the two smallest
      primes, and the identical-n null arms are the three guards, and none of
      them is optional.
    - >-
      max_c and max_d are maxima over M and over the offsets, so a growing M
      inflates the maximum even under perfect equidistribution. This is why the
      bound is stated through W and min_c q_c rather than through the raw maximum,
      and why the SHA null must be run at the SAME M.
    - >-
      Cauchy-Schwarz is one-sided. A small W bounds the attacker; a large W does
      not exhibit an attack. Reading a large W as an attack is the specific
      overclaim this record forbids, and the derived bound and the measured G are
      reported in the same cell so a reader can see the gap.
    - >-
      The filters F1 and F2 are the families the coverage table calls closed at
      level 1, and their closure is itself conditional -- (H1) is only partly
      traced and (H1-prime) is largely untraced per KN-LIT-7639 and
      KN-LIT-f6de4b. A small W does not repair those citation gaps.
    - >-
      Three curves per prime is a small curve sample; a curve-to-curve spread
      comparable to the effect must be reported and blocks the fit.

  interpretation_limits:
    - >-
      LEVEL 1 ONLY. At levels >= 2 the inputs are conditioned on matching at the
      previous level and are neither uniform nor independent. Nothing here
      transfers to level >= 2 and no bootstrapping argument is assumed.
    - >-
      COVERED FAMILIES ONLY. Families D (cubic, quartic, octic residue
      characters), I (popcount, digit sums), J, the y-based, joint and nonlinear
      members of A and B, target-dependent h, and O(1)-valued combining rules are
      untouched, exactly as KN-FIND-ffe1df records them.
    - >-
      Toy scale, N <= 65539 on the existing ladder. The fitted exponents are
      fitted over about three orders of magnitude in p and are reported as a
      fitted law with its interval; no cryptographic-scale claim is made and no
      extrapolation to M = p^{1/3} at 256 bits is asserted by this record.
    - >-
      A successful SMALL-W outcome licenses a PROOF ATTEMPT, not a proof. Eight
      toy primes are not a bound, which is the corpus's own words about RT-EXP-1
      and applies identically here.

  standing_results_check:
    kn_find_ffe1df_theorem_c: >-
      HYPOTHESES EXPLICITLY NOT SATISFIED, and this is the point of the record.
      Theorem C shows that EXACT sum-compatibility plus associativity forces h to
      be a surjective homomorphism E(F_p) -> ([M], f), which is impossible for N
      prime and M < N. That argument requires exactness. The object here is the
      APPROXIMATE case: h is not assumed to be a homomorphism, f is not assumed
      exactly sum-compatible, and the quantity measured is by construction the
      deviation from the exact case. KN-FIND-ffe1df itself lists "approximate
      quasigroup combining" as item 1 of what is NOT established, and this record
      lives entirely inside that item. Nothing here proposes an exact
      homomorphism, and if the measurement were run on one it would return
      W = 0 and delta = 1, which is the degenerate case Theorem C forbids
      constructing.
    kn_tech_73630e: >-
      NOT APPLICABLE. No lift, no p-adic construction, no statistic of a lift's
      digits. All quantities are computed from F_p-coordinates directly.
    kn_find_61347e: >-
      NOT APPLICABLE. No genus change, no Jacobian, no Poincare factor. The group
      is E(F_p) throughout.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (BUCKET-VARIANCE SCALING LAW.) FOR ALL filters h in the declared covered
        families {x mod M, quadratic-character based}, FOR ALL M in the declared
        grid, THERE EXIST constants C > 0 and a real a such that FOR ALL ordinary
        E/F_p with N = #E(F_p) prime on the sampled ladder,
        W(h, M, p) <= C * M^a * p^{-1/2}. The distribution concerned is the joint
        law of (h(P), h(Q), h(P+Q)) under uniform independent P, Q.
      rigorous_support: >-
        The rigorous half is Theorem A-prime as corrected by validation --
        eps <= 1/M + max_{t != 0} |T_t| with no factor M, for uniform independent
        P, Q -- together with the Weil-Bombieri bound |T_t| = O(D * p^{-1/2}) for
        non-degenerate characters along a genus-1 curve. The classical
        distribution statement it imitates is that the triple
        (h(P), h(Q), h(P+Q)) behaves, at the level of its second moment across
        target buckets, like the corresponding triple for a uniformly random
        function of the same marginal profile, whose relative bucket variance is
        the multinomial value M/n at sample size n and 0 in the population limit.
        The exponent a is exactly the count of frequencies surviving the
        orthogonality collapse and is NOT supplied by the rigorous half; it is
        the quantity being measured.
      validation_plan: >-
        SAMPLED: the joint counts of (h(P), h(Q), h(P+Q)) over n = 10^7 uniform
        independent pairs, per cell, on the existing 8-prime ladder with three
        curves per prime and M in {N^{1/4}, N^{1/3}, N^{2/5}}; plus the EXACT
        whole-group value at the two smallest primes. SHORTCUT USED: none is
        needed -- unlike the isogeny setting there is no correspondence to lean
        on, and the honest consequence is that the ladder tops out around
        N = 65539, which is recorded as a limit and not worked around. COMPARED
        AGAINST: the multinomial finite-sample prediction W_0 = (M - 1)/(n*delta)
        for the null, and the fitted law C*M^a*p^{-1/2} for the covered families,
        by joint regression over the M grid and the ladder with reported
        intervals. TAIL CHECKS: (i) the maximum of pi_c over c, reported
        alongside, must satisfy the derived Cauchy-Schwarz bound in every cell,
        and a violation indicates an estimator fault rather than a mathematical
        one; (ii) the 99th percentile of pi_c across buckets against the
        prediction from the fitted W, since a single heavy bucket with an
        otherwise flat profile is the configuration W is least able to see and
        the one an attacker would use. SAMPLED PARAMETERS RECORDED: p, curve
        coefficients, N, M, filter, n, seed. TRANSFER ASSUMPTION, stated: the
        fitted a is asserted only over the sampled range; its use at M = p^{1/3}
        and p of cryptographic size is an EXTRAPOLATION and is refused in this
        record.
    - id: H2
      statement: >-
        (BUCKET-WEIGHT REGULARITY.) FOR ALL declared filters and all M in the
        grid, min_c q_c >= c_0/M for an absolute constant c_0 > 0, on the sampled
        ladder.
      rigorous_support: >-
        For x mod M this follows from equidistribution of x-coordinates of points
        of E(F_p) in F_p to within Hasse and character-sum error, which is a
        rigorous statement at the p^{-1/2} scale. For the quadratic-character
        filter it follows from the same source. H2 is needed because the
        Cauchy-Schwarz bound divides by min_c q_c and is vacuous if some bucket
        is nearly empty.
      validation_plan: >-
        SAMPLED: the exact bucket-weight vector q_c by whole-group enumeration at
        every prime on the ladder -- this is a single pass over E(F_p) and is
        cheap even where the pair statistics are not. COMPARED AGAINST: the
        uniform prediction 1/M, by the empirical distribution of M*q_c and its
        minimum. TAIL CHECK: the minimum of M*q_c across buckets against the
        extreme-value prediction for the minimum of M multinomial cells, so that
        an ordinary smallest cell is not mistaken for a degenerate one. A filter
        failing H2 is reported separately and excluded from the fit rather than
        silently averaged in.
    - id: H3
      statement: >-
        (ESTIMATOR ADEQUACY.) FOR ALL cells, the jackknife-debiased estimator of
        W has absolute bias below one quarter of the smallest effect the fit must
        resolve, at n = 10^7.
      rigorous_support: >-
        The multinomial variance calculation for a plug-in estimator of a
        second moment over M cells at sample size n, plus the standard jackknife
        bias-reduction theorem which removes the leading 1/n term.
      validation_plan: >-
        SAMPLED: the estimator applied to the two smallest primes where W is also
        computed EXACTLY by whole-group enumeration, at every M in the grid, over
        200 independent draws of size n. COMPARED AGAINST: the exact value, by
        the empirical distribution of the estimator's error. TAIL CHECK: the
        upper 99th percentile of the error, since the estimator's failure mode is
        an upward tail that would manufacture a LARGE-W outcome. If the realised
        bias exceeds the threshold, n is raised or the alphabet grid is narrowed,
        and the contract records which.

  target_complexity:
    time_exponent: >-
      This record proposes no algorithm and claims no time exponent for itself.
      The exponent at stake is the one it adjudicates: KN-FIND-ffe1df's table
      gives, at decomposition length m = 16, exponent 0.4167 for j = 2 (needing
      M = p^{1/3}), 0.3750 for j = 3 (M = p^{1/4}) and 0.4000 for j = 4
      (M = p^{1/5}), against Pollard rho's 0.5. The j = 2 row is recorded as
      UNPROVED and the whole line's repair reaches only M <= p^{1/4}. A SMALL-W
      outcome would retire the 0.4167 row; a LARGE-W outcome leaves it open and
      is the first quantitative sign of a filtering gain this program would have.
    memory_exponent: >-
      Not applicable to this record. For reference, the configurations being
      adjudicated are Wagner trees, whose memory is the list size, of the same
      order as their time.
    best_known: >-
      Pollard rho, Theta(sqrt(N)) group operations at O(1) memory, exponent 0.5;
      and, at matched memory, the chain construction of IDEA-20260806-3b91c7 with
      T = sqrt(N/S), which is the memory-matched comparator any Wagner
      configuration must actually clear.
    hidden_overhead: >-
      Two items. (1) The per-call filter cost is never amortised over the roughly
      p^{1/3} calls of a single Wagner run anywhere in this line, which
      KN-FIND-ffe1df records as gap 9; a configuration that clears the exponent
      on filtering gain alone may still lose on filter cost, and this record does
      not close that. (2) The fitted a is an empirical exponent over three orders
      of magnitude in p, and any polylog correction is invisible at that range.
    tradeoff_note: >-
      The comparator matters: KN-FIND-ffe1df's table compares against rho at
      exponent 0.5 with O(1) memory, while a Wagner tree holds lists of size
      p^{1/3}. At that memory the correct generic comparator is
      sqrt(N/S) = N^{1/3}, not N^{1/2}, so the j = 3 row at 0.3750 and the j = 4
      row at 0.4000 are ALREADY dominated by a generic algorithm at their own
      memory, and only j = 2 at 0.4167 versus 0.3333 is likewise dominated. This
      is stated against interest: even a LARGE-W outcome does not by itself
      produce an attack that clears the memory-matched bar, and any follow-up
      must clear it.

  estimated_cost:
    implementation: low
    compute: low

  recommended_priority: high

  sota_delta: >-
    +0. No speedup, relation or solve is claimed. The record's value is negative
    information that redirects search, in the sense KN-FIND-ffe1df uses for the
    O2 line as a whole. Quantitatively, it decides whether the exponent-0.4167
    j = 2 configuration is retired or remains live, and it supplies the first
    measured value of the quantity Lemma 5 assumes to be zero.

  dominated_by: >-
    Not applicable in the Pareto sense -- no cost result is claimed, so there is
    no row to dominate. Recorded rather than left null: the CONFIGURATIONS this
    record adjudicates are dominated on the checked frontier. Against rho
    (N^{1/2} time, O(1) memory) the j = 2 row at N^{0.4167} would be an
    improvement on time; against the memory-matched chain row of
    IDEA-20260806-3b91c7 at memory N^{1/3}, which achieves T = N^{1/3}, all three
    rows (0.4167, 0.3750, 0.4000) are dominated or tied on time at their own
    memory. On the data and queries axis no oracle queries are issued and the
    setting is single-target. Every row of the frontier recorded in
    IDEA-20260806-3b91c7 was checked.

  discriminated_from:
    - >-
      RT-EXP-1 and its result record, the NEAREST existing work. RT-EXP-1
      measured G = M * max_{c,d} pi_c(d) directly at M = N^{1/3} across the
      8-prime ladder and found no attack signal for any cheap filter, with
      popcount and digitsum reproduced exactly by the matched-marginal shuffle.
      THIS RECORD MEASURES A DIFFERENT QUANTITY FOR A DIFFERENT PURPOSE: RT-EXP-1
      measured the maximum, at one alphabet, to look for an attack; this measures
      the second moment, across an alphabet GRID, to identify the scaling law a
      PROOF would have to establish. The corpus's own summary of RT-EXP-1 is that
      it lowers the probability that the gap conceals an attack and does NOT
      close the hole, because Lemma 5 is a proof gap and eight toy primes are not
      a bound. The variance and the alphabet grid are what turn eight points into
      a law with a fitted exponent, and the exponent is what a proof needs.
    - >-
      O2_composition_closure.md and Theorem A-prime. Those bound delta, the first
      moment. This record does not re-derive them and takes them as given; it
      addresses only the bridge from delta to max_c pi_c.
    - >-
      Theorem C. Exact case only, as stated above.
    - >-
      IDEA-20260904-d84512, filed in the same session. That record charges advice
      length in the preprocessing model and never forms a filter. Disjoint object,
      disjoint cost model.

