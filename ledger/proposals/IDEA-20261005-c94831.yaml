  predictions:
    - metric: enumerated_point_count_of_S_over_F_121
      direction: different
      minimum_effect: 144
    - metric: enumerated_point_count_of_C_over_F_121
      direction: different
      minimum_effect: 128
    - metric: absolute_gap_between_those_extension_counts
      direction: higher
      minimum_effect: 16
  minimal_test:
    design: >-
      Enumerate y^2 = x^3 + 1 over F_11 and over F_121. Enumerate
      y^2 = x^3 + x + 2 over F_11 and over F_121. Compare with 12, 144,
      16, and 128. Stop. Do not compute a Cartier-Manin matrix, an
      endomorphism ring, or an isogeny.
    controls:
      - If the F_11 count of S is not 12, do not interpret the F_121 count as the trace-0 formula.
      - The ordinary extension count must not equal 144.
      - Two independent F_121 enumerations of S must agree.
    required_metrics:
      - enumerated_point_count_of_S_over_F_11
      - enumerated_point_count_of_S_over_F_121
      - enumerated_point_count_of_C_over_F_11
      - enumerated_point_count_of_C_over_F_121
  falsification_conditions:
    - The square-test count of S(F_11) is not 12.
    - The square-test count of S(F_121) is not 144.
    - The square-test count of C(F_121) is 144, or is not 128.
    - A timeout or an unfinished extension-field enumeration is infrastructure, not a falsification of 144 or 128.
  confounders:
    - The quadratic twist of a trace-0 curve has the same order p+1 over F_p and must not be swapped with C.
    - An F_121 model change can hide the equation. Counts are taken on the stated models only.
    - Superspecial group-scheme language is a different invariant. A rank computation is not accepted as this count.
  interpretation_limits:
    - >-
      These integers do not improve endomorphism-ring recovery, CSIDH,
      CGL path-finding, or SQIsign. They do not touch SIDH torsion images.
    - >-
      This is not the Cartier-Manin separation of ordinary, intermediate,
      and superspecial p-torsion.
    - >-
      p=11 only. No extrapolation to a cryptographic prime.
    - The discrete-log time-exponent delta versus Pollard rho is 0.
  heuristic_assumptions:
    - id: HA-1
      statement: >-
        If an elliptic curve over F_p has trace 0, then its point count
        over F_{p^2} equals (p+1)^2. At p=11 that integer is 144. The
        ordinary control with trace -4 has extension count
        121 + 1 - (16 - 22) = 128. One prime. No distribution over
        supersingular j-invariants is claimed.
      rigorous_support: >-
        Cayley-Hamilton: tr(pi^2) = t^2 - 2p. Substituting t=0 yields
        -2p and the count (p+1)^2. Substituting t=-4 and p=11 yields
        -6 and the count 128. The Hasse bound is satisfied by both
        traces. No random model is imitated. The comparison is a point
        mass at 144 against a point mass at 128.
      validation_plan: >-
        Enumerate both curves over F_11 and over F_121 by square tests.
        Accept only if the four counts are 12, 144, 16, and 128. No
        further prime.
  target_complexity:
    time_exponent: >-
      O(p^2) field operations at p=11. The discrete-log time exponent
      stays 1/2. Delta versus Pollard rho is 0.
    memory_exponent: O(1) field elements
    best_known: >-
