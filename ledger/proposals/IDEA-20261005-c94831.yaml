idea:
  id: IDEA-20261005-c94831
  question_id: RQ-SSI-001
  added: '2026-10-05'
  status: proposed
  approved_by: null
  title: >-
    Supersingular y^2 = x^3 + 1 over F_11 has 144 points over F_121
  class: control
  claim: >-
    The curve S given by y^2 = x^3 + 1 over F_11 has enumerated count
    12, hence trace 0, and its base change to F_121 has enumerated count
    144, which is (11+1)^2. The ordinary control C given by
    y^2 = x^3 + x + 2 over F_11 has enumerated count 16, trace -4, and
    base-change count 128, which is not 144. R2 is the Weierstrass
    equation and R1 is the x-coordinate. No isogeny path is walked, and
    no Cartier-Manin rank is computed. Toy scope. The discrete-log time
    exponent is unchanged.
  mechanism: >-
    OBJECT FRAME. The representation is the pair (R2 model, R1
    x-coordinates over F_121). The operation set Sigma on the
    supersingular arm is scalar multiplication by -11, because a trace-0
    Frobenius over F_11 satisfies pi^2 = [-11]. Sigma does not contain
    the full translation group. Coordinate-dependent: 144 is a function
    of the equation y^2 = x^3 + 1, not of one group element.
    LOSSY-PROJECTION TEST. Discarded: the x-coordinates of the F_121
    points. Compatible with Sigma: multiplication by -11 permutes the
    prime-to-11 points and does not change the cardinality of the
    rational points. Lossy: 144 points map to one integer. Not a
    coordinate change. The priced open number is (L, b) = (144, 1).
    The ordinary arm is the same projection with predicted cardinality
    128, so the two equations are separated by 16 points. F1 through F7
    are not the lens. F3 is not used: no isogeny path is stored. F5 is
    not used: no p-adic lift. The group-scheme rank of the p-torsion is
    not the measured integer. Hand counts in this session pre-register
    12 and 16 over F_11. The extension integers are the Cayley-Hamilton
    images of those traces. A square-test recount that disagrees
    falsifies the corresponding integer.
  novelty_status: unverified
