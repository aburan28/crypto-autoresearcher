      verified_by: idea-generator, this session, read knowledge/open-problems/KN-OPEN-020.md
  assumptions:
    - p=11 is congruent to 2 modulo 3, which is the usual supersingularity setting for y^2 = x^3 + 1. The count 12 is still required, not inferred from the congruence alone.
    - The control equation is y^2 = x^3 + x + 2, not a twist of y^2 = x^3 + 1.
    - F_121 enumeration tests squares. It does not quote (p+1)^2 as the counter.
