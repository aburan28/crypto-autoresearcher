      isogeny path-finding is a different problem and is not run.
      KR-RHO-0528e7 and KR-RHO-fbd7b1 remain square-root discrete-log
      baselines.
    hidden_overhead: None. One extension field of 121 elements.
    tradeoff_note: No time-memory tradeoff and no parallel isogeny search.
