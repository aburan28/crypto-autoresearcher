idea:
  id: IDEA-20260808-726aa3
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ECDLP-002
  goal_id: GOAL-PATH-001
  title: 'Name the missing exponential-sum ingredient: quantify exactly how much cancellation
    beyond square-root a character-sum bound would need to certify the yield of a multiplicative-
    subgroup factor base, turning KN-FIND-c93d45''s closure into a searchable external target.'
  class: mechanism
  claim: 'Let H <= F_p^* be the subgroup of order B = (p-1)/d, so membership x in H is testable
    in O(log p) by x^B = 1 — the only known size-B subset of F_p with a polylog membership
    test and no archimedean structure. The windowed count of m-decompositions over V = {R
    : x(R) in H} expands by multiplicative characters as (B/(p-1))^m * sum over (chi_1,...,chi_m)
    of S(chi_1,...,chi_m), where each S is a multiplicative character sum over the Semaev
    hypersurface. The main term is the all-trivial tuple; the error is a sum of d^m - 1 nontrivial
    terms, each bounded by Weil/Deligne square-root cancellation, i.e. by C(m, deg) * p^{(m-1)/2}.
    THE CLAIM: the exact deficit is computable in closed form as a function of (m, beta) with
    beta = log_p B, and the required improvement is expressible as a single number gamma such
    that a bound of the form |S| <= C * p^{(m-1)/2 - gamma} would suffice. Producing gamma(m,
    beta) converts KN-FIND-c93d45 from "the Weil bound cannot close the gap" into "an exponential-sum
    bound with saving gamma would close it", which is a specific, citable target that a literature
    scout can search for and that a future external result could satisfy.'
  mechanism: Main term ~ B^m/p * (points on the hypersurface) and error ~ d^m * p^{(m-1)/2}
    with d = (p-1)/B = p^{1-beta}. The error beats the main term whenever m(1-beta) + (m-1)/2
    > m*beta + (m-2), i.e. for every beta below a threshold that is strictly above the operating
    point beta = 1/m. That inequality, written out, is the deficit, and gamma is the amount
    by which the exponent (m-1)/2 must drop for the inequality to reverse at beta = 1/m. This
    is exactly the shape of the DL circularity obstruction, but naming gamma is what makes
    it actionable.
  why_not_a_renamed_known_approach: 'KN-FIND-c93d45 states the closure ("the Weil bound cannot
    close the arithmetic factor-base yield gap") without a number. This record supplies the
    number and, crucially, the direction: it is ingredient scouting in the sense of the idea-generator
    contract heuristic 2, not a new attack. It is also not KN-FIND-007, which concerns the
    mean over targets; here the question is whether a SPECIFIC structured base attains it,
    which is a distribution question the mean does not answer.'
  predictions:
  - observable: gamma(m, beta) at the operating point beta = 1/m
    metric: the required saving in the exponent of p, derived symbolically
    predicted: gamma > 0 and growing with m, i.e. the required improvement over square-root
      cancellation increases with arity; if gamma turned out to be 0 or negative at some (m,
      beta), that cell is already certified and should be tested immediately
  - observable: whether any known bound family achieves saving gamma
    metric: a literature scan recorded in knowledge/literature/ with a yes/no per family (Weil-Deligne,
      Katz's sums over varieties, Bombieri, Fouvry-Katz, Burgess-type subgroup bounds)
    predicted: no; Burgess-type improvements exist for subgroup sums in some ranges and are
      the only plausible candidate, and confirming or refuting that is the deliverable
  - observable: toy-scale measured yield for a subgroup factor base
    metric: decompositions per target for V = preimage of H, vs a random subset of equal size
    predicted: equal to the KN-FIND-007 mean within Poisson error, since the mean is exact;
      the interesting statistic is the VARIANCE and the coverage, which the subgroup base
      may depress if H has additive structure
  minimal_test: 'Zero compute for the deficit derivation. Cheap compute for the check: at
    toy p with d in {2, 3, 5} (so B = (p-1)/d is large) and at d large (so B small), measure
    the exact decomposition counts for a subgroup base and a matched random base at m = 3,
    and record coverage and variance, not just the mean. Then record a literature note in
    knowledge/literature/ naming gamma and the families scanned.'
  controls:
  - Random-subset base of equal size (the mean must match exactly; anything else is a bug).
  - 'Coset control: use a coset of H rather than H itself; multiplicative structure is preserved,
    so any difference isolates the subgroup''s own additive behaviour.'
  confounders:
  - For small d, B is comparable to p and the regime is not the operating point; results there
    do not speak to beta = 1/m.
  - The x-coordinates of E(F_p) are a specific p/2-sized subset of F_p, so intersecting with
    H introduces a second bias that must be measured separately.
  falsification_conditions:
  - gamma(m, beta) <= 0 at some admissible (m, beta) => that cell is certified by existing
    bounds and must be tested computationally at once.
  - A known bound family with saving >= gamma is found => KN-FIND-c93d45's scope must be narrowed
    and the multiplicative-subgroup base reopened.
  - Measured coverage for the subgroup base falls materially below the random-base coverage
    => the base is additively degenerate and is closed for a second, independent reason.
  interpretation_limits: Deriving gamma does not produce an attack and does not weaken KN-FIND-c93d45;
    it makes the closure conditional on a stated external ingredient, which is the honest
    form for a closure whose obstruction is "no known bound is strong enough".
  assumptions:
  - S_{m+1} absolutely irreducible so Weil/Deligne applies with the stated degree constants.
  - H a subgroup of F_p^* of index d; membership test x^B = 1.
  heuristic_assumptions:
  - id: HA-1
    statement: 'The d^m - 1 nontrivial character sums do not conspire: their total is bounded
      by d^m * max|S| and is not systematically smaller by cancellation among tuples.'
    rigorous_ingredient: '"Each |S| is individually bounded by Weil/Deligne square-root cancellation."'
    distribution_imitated: '"Independence of character sums over distinct nontrivial tuples,
      the standard assumption in subgroup-sum estimates."'
    validation_route: 'Toy p: compute the full character-sum expansion exactly for small d
      and m = 2, 3, and compare the true error against d^m * max|S|. Label toy. This directly
      tests whether the closure''s own bookkeeping is tight or loose.'
    tail_checks: If the true error is systematically far below d^m * max|S|, the deficit is
      overstated and gamma is smaller than derived, which would be a genuine and reportable
      softening of KN-FIND-c93d45.
  target_complexity:
    time_exponent: '"None claimed. If an ingredient with saving gamma existed, the subgroup
      base would enter E1-03''s master formula at sigma determined by the x^B = 1 membership
      test, which is polylog; that is the prize and it is stated conditionally."'
    memory_exponent: '"N^{beta} if it were realised."'
    best_known_baseline: '"rho N^{1/2}."'
    hidden_overhead_disclosure: '"The Weil constant C(m, deg) grows with deg S_{m+1} = 2^{m-1}
      and is not a constant in m; it must be tracked or the deficit is understated."'
    time_memory_tradeoff: '"n/a."'
  sota_delta: Zero as an attack. As search guidance it converts a closed lane into a named
    external target, which is exactly the ingredient-scouting deliverable the idea-generator
    contract asks for, and it produces a knowledge/literature/ note whether or not anything
    is found.
  dominated_by: n/a (no result claimed). The underlying attack family, if it were realised,
    would be compared against rho/vOW N^{1/2}, BSGS, Kuhn-Struik sqrt(TN) and the preprocessing
    frontier; none of those is beaten by anything in this record today.
  estimated_cost: '"Implementation low; compute low; one literature note."'
  recommended_priority: low
  honest_prior_of_survival: ~0.8 that gamma is derivable cleanly. ~0.05 that any existing
    bound family meets it. Low priority, filed because the protocol requires closures to name
    what would reopen them.
  novelty_status: screened
  novelty_screen: Screened against EXISTING_PROPOSALS.txt, KNOWLEDGE_BARRIERS.txt (KN-FIND-c93d45
    index entry, KN-TECH-016), KN-FIND-007 in full, REJECTED_TITLES.txt. No record derives
    the required saving. External literature UNVERIFIED (no web access this session), which
    is itself part of what this record proposes to fix.
  discriminated_from: KN-FIND-c93d45 (states the closure without a quantified requirement
    — this supplies it); KN-TECH-016 (sum-product bounds, a different bound family); IDEA-20260727-006
    (Fourier-accessible interval factor base and two exponents — that record is about an interval
    and a Fourier-accessible base, not a multiplicative subgroup, and it does not derive a
    required saving).
  source_refs:
  - KN-FIND-c93d45 (in-repo index), KN-FIND-007 (in-repo, read), KN-TECH-016 (in-repo)
