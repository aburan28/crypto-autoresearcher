idea:
  id: IDEA-20260901-7d0bfd
  question_id: RQ-SHAONE-081e3a
  research_question: RQ-SHAONE-081e3a
  goal_id: GOAL-SHA1-001
  added: '2026-09-01'
  title: >-
    THE 32 CHECKED DISTURBANCE VECTORS ARE A CLAIMED LOW-COST SHELL OF THE SHA-1
    LINEAR EXPANSION CODE: enumerate that shell exactly by a meet-in-the-middle
    claw search over the code with the OJLCA per-block cost as the weight, and
    DECIDE whether the deployed detector's list equals the complete cost-bounded
    shell or is a strict subset -- a subset yields named uncovered disturbance
    vectors whose per-block cost is within a stated factor of the checked ones
    (an evader-candidate coverage gap and simultaneously a per-block cost-exponent
    statement), and equality is a real completeness result over the linear class.
  class: algorithm
  claim: >-
    FIVE SEPARABLE CLAIMS. (A) OBJECT AND COST. The SHA-1 disturbance vector (DV)
    is a codeword of the linear GF(2) message-expansion code: it is determined by
    16 free 32-bit words propagated by the fixed step recurrence, and the
    correction/local-collision structure is a function of that codeword alone. The
    per-near-collision-block search cost is 2^{w*(DV)}, where w*(DV) is the
    OJLCA-optimal count of uncontrolled sufficient conditions (KN-LIT-5099) for
    that DV, a functional concentrated in the steps AFTER the message-modification
    free region. Thus DV -> w*(DV) maps the codeword to the per-block cost
    exponent. (B) SHELL. The set S(tau) = { DV : w*(DV) <= tau } is finite for any
    tau and enumerable EXACTLY at zero cryptographic compute by a meet-in-the-middle
    claw decomposition of the code (split the 512-bit generator into two halves,
    enumerate low-weight combinations in each, and join on the expensive-region
    weight signature by a keyed table), which is a standard low-weight-codeword
    search accelerated to ~2^{k/2} time and memory for a k-bit search band. (C) THE
    DECISION. Whether the deployed counter-cryptanalysis detector's 32 checked DVs
    (KN-LIT-3185; the deployed criterion checks 32 DVs under a stated feasibility
    conjecture, internal frontier row LEGACY-SHA1-COLLISION-DETECTOR) equal
    S(tau_pub), modulo declared symmetry equivalence, at tau_pub = the cost of the
    cheapest published attack. If S(tau_pub) has members outside the checked set,
    each is a NAMED uncovered DV with a computed per-block cost within a stated
    factor of a checked DV -- a constructive coverage gap and, if its w* is below
    the checked ones, a cheaper-DV per-block cost-exponent statement. If
    S(tau_pub) equals the checked set up to symmetry, that is a real, reportable
    completeness statement over the linear single-block DV class at tau_pub. (D)
    WHAT IS NOT CLAIMED: no new collision of any kind is computed; an uncovered DV
    is a statement about the detector's TEST LIST and about attack COST, never a
    demonstrated attack on any deployed system, and a low-w* DV is not shown to
    admit a feasible message-modification here -- feasibility is a separate,
    harder obligation named in the interpretation limits. (E) The design cannot
    return nothing: it returns either a completeness statement over the class or a
    named non-empty gap, and in both cases it returns the map w*(DV) over the
    enumerated shell, which no record in this corpus holds.
  mechanism: >-
    STAGE 0 (gating, per RQ constraint): the counter-cryptanalysis specification
    (Stevens CRYPTO 2013, and the deployed sha1collisiondetection DV table with
    its unavoidable-bit-condition definitions) and the OJLCA paper must be filed
    as KN-LIT at stated provenance before the checked-32 list is used; this
    session holds them only at corpus-title level (KN-LIT-3185, KN-LIT-5099) and
    at WebSearch-snippet level, and the decision in claim (C) does not proceed
    past the checked-list extraction until primary text is read. STAGE 1: encode
    the SHA-1 message-expansion recurrence as a GF(2) linear map and generate the
    DV code; classify codewords by the standard type-I / type-II families (Manuel,
    recalled) and by offset. STAGE 2: define the weight functional w*(DV) as the
    OJLCA-optimal uncontrolled-condition count, with the message-modification free
    region declared as a step threshold; report both the raw step-localized
    Hamming weight and the OJLCA-corrected w*, since their gap is the honest model
    error. STAGE 3: run the MITM claw search to enumerate S(tau) for a grid of tau
    around tau_pub, reporting |S(tau)| as a function of tau rather than at one
    point. STAGE 4: extract the deployed 32-DV list and its UBC signatures
    mechanically from the STAGE-0 specification, dedup S(tau) by the declared
    symmetry group (rotations/offsets), and compute the set difference in both
    directions (uncovered shell members, and checked DVs whose w* exceeds tau).
    STAGE 5: for each uncovered shell member, report its w*, its cost ratio to the
    nearest checked DV, and its type. STAGE 6, null control: run the identical
    MITM enumeration on a random linear code of the same dimension and report its
    shell-size distribution, establishing what |S(tau)| a code of the same SHAPE
    but no SHA-1 structure produces, so a small or large shell is read against
    that baseline rather than in isolation.
  novelty_status: unverified
  citations:
    - ref: eprint 2020/014 (Leurent, Peyrin, SHA-1 is a Shambles)
      provenance: retrieved
      claim: >-
        Chosen-prefix collision on full SHA-1 at complexity 2^63.4 and
        identical-prefix at 2^61.2 on GTX 970; the attack uses one partial plus
        nine near-collision blocks per public reporting. Supplies tau_pub.
      verified_by: >-
        WebSearch 2026-09-01 returned the eprint and USENIX Security 2020 records
        and the 2^63.4 / 2^61.2 figures from the abstract; full primary PDF not
        opened this session and must be filed as KN-LIT before use.
    - ref: KN-LIT-5099
      provenance: kb
      claim: >-
        Optimal joint local-collision analysis computes the theoretical maximum
        success probability for a given set of dependent local collisions and the
        smallest message-condition set attaining it -- the basis for w*(DV).
      verified_by: >-
        Read the corpus entry (title and abstract level) this session; primary
        PDF not opened.
    - ref: KN-LIT-3185
      provenance: kb
      claim: >-
        Counter-cryptanalysis (Stevens): a detector that flags whether a message
        was built by a collision attack on MD5 or SHA-1 by testing disturbance-
        vector structure. Corpus entry is title-level only.
      verified_by: >-
        Read the corpus entry this session; it carries no abstract and the DV list
        must be read from primary text.
    - ref: internal frontier row LEGACY-SHA1-COLLISION-DETECTOR
      provenance: internal
      claim: >-
        The deployed detector's coverage is recorded as coverage of 32
        disturbance vectors under a conjecture about feasible DV attacks, and is
        explicitly not a proof of detecting every future SHA-1 collision method.
      verified_by: >-
        Read knowledge/frontiers/symmetric-cryptanalysis.yaml this session (the
        admitted-partial-frontier row and its limitations field).
    - ref: eprint 2017/173 (Stevens, Speeding up detection using unavoidable conditions)
      provenance: retrieved
      claim: >-
        Unavoidable bit conditions are conditions necessary for all feasible
        attacks in a declared class; the caveat that they must be shown necessary
        for every feasible variant is the completeness gap this record decides
        over the linear class.
      verified_by: >-
        WebSearch 2026-09-01 (eprint and USENIX records, abstract-level); primary
        PDF not opened.
    - ref: Manuel, Classification and generation of disturbance vectors for SHA-1 (2011)
      provenance: recalled
      claim: >-
        RECALLED, NOT OPENED. SHA-1 disturbance vectors form two families
        (type-I, type-II) of the linear expansion code and are enumerable by
        offset; used only to structure the enumeration.
      verified_by: null
    - ref: KN-TECH-066
      provenance: internal
      claim: >-
        Message modification spends message freedom to force early expensive
        conditions deterministically, leaving later conditions to probability --
        the basis for treating w* as concentrated in post-free-region steps.
      verified_by: Read in full this session.
  novelty_screen:
    method: >-
      Filesystem and ledger screening only; the crypto-kb MCP server is bound to
      an empty :memory: index and was not callable. Read RQ-SHAONE-081e3a and
      GOAL-SHA1-001 in full. Read the claim blocks of all 18 existing RQ-SHAONE
      proposals named in the dedup list, and read in full IDEA-20260816-3edd14
      (DV-class coverage enumeration), IDEA-20260816-1e36fa (N(k) counted
      difference-state object), IDEA-20260816-70b60d and IDEA-20260828-2804d3
      (detector as instrument / real-artifact grounding), and IDEA-20260828-ca6584
      (cross-family MD5 adversarial control). Read KN-TECH-066, KN-LIT-3185,
      KN-LIT-5099, KN-LIT-7165, and the SHA-1 frontier rows in
      knowledge/frontiers/symmetric-cryptanalysis.yaml. WebSearched the Shambles
      and counter-cryptanalysis primary sources.
    results: >-
      IDEA-20260816-3edd14 is the closest existing record: it enumerates the DV
      class by the local-collision recurrence and marks each element covered or
      uncovered by the re-implemented criterion, producing a coverage FRACTION.
      It does not weight elements by cost, does not use a meet-in-the-middle claw
      over the linear code, does not identify a minimum-cost shell, and does not
      tie coverage to the per-block cost exponent -- its own text states it
      "never runs the detector on a message" and produces a set-difference over
      an unweighted index space. IDEA-20260816-1e36fa counts N(k), the cardinality
      of reachable inter-block difference states, to build a cost curve C(k); it
      tracks a difference-STATE set, not the DV codeword, and has no completeness
      or minimum-weight-shell notion. No corpus record computes w*(DV) over the
      DV code or decides whether the checked 32 form the complete cost-bounded
      shell.
    verdict: >-
      UNVERIFIED. The DV-as-linear-codeword framing and low-weight-codeword MITM
      search are classical in SHA-1 cryptanalysis (Rijmen-Oswald, Pramstaller,
      Manuel; all recalled, not opened this session), so the enumeration method
      is an adaptation, declared as such. What is not in any committed record is
      (1) the OJLCA-weighted cost functional w*(DV) mapped over the enumerated
      shell, and (2) the decision of detector completeness over that shell. No
      external primary source was opened in full, so unverified is the only
      honest label.
  object_first_candidate:
    tracked_object: >-
      THE DISTURBANCE-VECTOR CODEWORD, carried as (type, offset) in the linear
      SHA-1 expansion code together with its OJLCA weight functional w*(DV).
      Established families declared OFF-LIMITS as the primary lens for this
      record: message-modification/neutral-bit accounting per block; the
      difference-STATE set N(k); the detector-as-instrument error-rate framing;
      the real-artifact streaming-boundary check. This record follows the
      codeword and its cost, not a message and not a flag decision.
    lossiness: >-
      PASSES THE LOSSY-PROJECTION TEST, MAXIMALLY. The projection DV -> w*(DV)
      collapses the 2^512 message freedom and all signs to a single scalar cost,
      retaining only the difference pattern's step-localized weight. It is not a
      change of coordinates precisely because almost everything is discarded, yet
      the retained cost still propagates deterministically: under the fixed
      message-modification controls, the per-block success probability is
      determined by the codeword alone via OJLCA, which is the compatibility
      condition. What is discarded -- the actual message words -- is exactly what
      a feasibility construction would need, which is why feasibility of an
      uncovered low-w* DV is named as a separate obligation and NOT claimed here.
    propagation: >-
      One step of the target operation is one step of the linear expansion
      recurrence acting on the codeword; the reachable set of codewords under the
      full 80-step recurrence IS the DV code, and the weight functional is
      accumulated deterministically along it. The MITM split is a decomposition of
      this deterministic propagation into two independently enumerable halves.
    survival_score: >-
      Survives the full 80 steps by construction, since codewords are defined over
      all steps. Dissolves as an ACCURATE cost proxy at two named places: (i) the
      boundary step where the message-modification free region ends, since w*
      counts only conditions past it and mis-declaring that boundary mis-costs
      every DV uniformly (a measurable, correctable offset); (ii) where OJLCA
      dependencies make the true probability deviate from 2^{-w*}, which is the
      raw-vs-OJLCA gap the record reports rather than hides.
  proof_search_map:
    bottleneck: >-
      Whether the deployed detector's checked DV set is the complete
      minimum-cost shell of the linear DV code at the published attack cost.
      Removing this converts the detector's coverage from a conjecture over 32
      vectors into a decided completeness statement over the linear class, which
      is the goal's highest-value deliverable.
    baseline_embedding:
      parameter_slice: >-
        The specific type-II disturbance vector used in the Shambles attack must
        appear in S(tau_pub) with w* reproducing the published per-block
        near-collision cost.
      reproduction_check: >-
        A frozen fixture at tau = published cost: enumerate S(tau), assert the
        Shambles DV is present, and assert its OJLCA w* predicts the published
        per-block cost within a pre-declared factor. A miss means the code
        encoding or the cost functional is wrong and the run halts there.
    observation_collision:
      observable: >-
        The weight functional w*(DV) and, for the decision, the UBC signature of
        each DV.
      distinct_preimage_search: >-
        Distinct DVs with equal w* are expected from the code's rotational and
        offset symmetry and are reported as multiplicity classes, not treated as a
        finding. The load-bearing collision is a checked DV and an UNCHECKED DV
        sharing (or beating) w* and UBC signature -- that pair IS the coverage-gap
        result, and the symmetry dedup is what prevents a spurious one.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the cost question into the linear expansion code, where "low
          per-block cost" becomes "low OJLCA weight," an exact combinatorial
          condition, with separate encoding (linearity, exact), completeness (MITM
          enumerates all codewords below tau, proved against brute force on a
          reduced instance), and cost-loss (raw-vs-OJLCA weight gap) obligations.
        predicted_gain: >-
          Turns an unbounded search for "a cheaper attack" into a bounded exact
          enumeration whose completeness is checkable, and yields the w*(DV) map
          as a by-product.
      - transform: specialization_pack
        proposed_object: >-
          The MITM half-split, added only over proved-disjoint weight bands so no
          codeword is double-counted or missed at the join.
        predicted_gain: >-
          Reduces the enumeration to ~2^{k/2} time and memory for a k-bit search
          band, making the shell affordable at zero cryptographic compute.
    quantifier_order: >-
      EXPLICIT. Falsifying (gap) form: there EXISTS a DV not in the checked-32
      set, and not symmetry-equivalent to one, with w*(DV) <= tau_pub -- settled
      by exhibiting one codeword. Positive (completeness) form: for ALL DVs with
      w* <= tau_pub, DV is symmetry-equivalent to a checked one -- a statement
      about the LINEAR single-block DV class under the declared cost functional and
      tau_pub only, quantifying over neither non-linear nor multi-block-coupled
      differentials.
    method_ceiling:
      strongest_certifiable_claim: >-
        Completeness (or a named gap) of the checked list over the linear DV class
        at declared tau under the declared cost functional. It CANNOT certify that
        an uncovered low-w* DV admits a feasible message-modification, nor
        anything about non-linear or cross-block-coupled differentials, nor any
        property of a deployed system.
      nearby_object_control: >-
        A DV just above tau that the detector does not check and that has no
        feasible message-modification (a known-infeasible codeword): the method
        must NOT report it as a coverage gap, since a gap is only meaningful for a
        codeword whose cost is genuinely below tau. Reporting such a codeword as a
        gap would show the cost functional, not the coverage, is doing the work.
    proof_obligations:
      - claim: The Shambles DV is present in S(tau_pub) with reproduced cost.
        responsibility: baseline
      - claim: MITM enumerates every codeword with w* <= tau (no misses).
        responsibility: correctness
      - claim: The shell cardinality |S(tau)| is bounded and computed exactly.
        responsibility: size
      - claim: The enumeration runs in ~2^{k/2} time and memory for band k.
        responsibility: runtime
      - claim: Scope is the linear DV class, declared cost functional, and tau.
        responsibility: scope
    not_applicable_reason: null
  assumptions:
    - >-
      The SHA-1 message expansion is exactly GF(2)-linear (standard) so DVs form a
      linear code; the local-collision correction is a deterministic function of
      the codeword.
    - >-
      The deployed detector's checked DV list and its UBC definitions can be
      extracted mechanically from primary specification; a remembered description
      is inadmissible (RQ constraint) and the decision halts until STAGE 0 is met.
    - >-
      OJLCA supplies a well-defined optimal uncontrolled-condition count w*(DV)
      per codeword; where it is intractable to compute exactly, a declared
      upper/lower bracket is used and reported as a bracket, not a point.
    - >-
      The symmetry group used to dedup the shell (rotations, offsets) is declared
      before the set difference and is not tuned to the answer.
  predictions:
    - metric: >-
        shell_cardinality |S(tau_pub)| after symmetry dedup, versus the checked-32
        count
      direction: different
      minimum_effect: >-
        Reported exactly. A deduped shell strictly larger than the checked set
        (beyond symmetry-equivalents of checked DVs) is a coverage gap; equality
        is a completeness statement. Either is a result; the record cannot be
        vacuous.
    - metric: >-
        checked_set_coverage_of_shell: fraction of deduped S(tau_pub) that is
        symmetry-equivalent to a checked DV
      direction: higher
      minimum_effect: >-
        Any value below 1.0 names at least one uncovered low-cost DV. A value of
        exactly 1.0 is the positive completeness outcome and is reported with the
        tau at which it holds.
    - metric: >-
        baseline_reproduction_ratio: OJLCA-predicted per-block cost of the
        Shambles DV divided by its published per-block cost
      direction: different
      minimum_effect: >-
        Within a pre-declared factor (e.g. 2x in the exponent's linear domain).
        Outside it, the cost functional is mis-specified and the shell's cost
        labels are void until corrected -- itself a diagnostic result.
    - metric: >-
        null_shell_size: |S(tau_pub)| for a random linear code of matched
        dimension
      direction: different
      minimum_effect: >-
        The SHA-1 shell must differ materially from the random-code shell-size
        distribution; if it does not, |S| is a property of code arithmetic, not of
        SHA-1 structure, and the coverage reading is weakened accordingly.
  minimal_test:
    design: >-
      SIX STEPS. STEP 0 (gating): file the detector spec and OJLCA as KN-LIT;
      extract the checked-32 list and UBC signatures mechanically. STEP 1
      (reduced-scale validation): build the linear DV code for a reduced-step
      SHA-1 (and/or an analogously linear reduced primitive) small enough that the
      full low-weight shell is enumerable by BRUTE FORCE, and confirm the MITM
      claw search returns the identical shell -- this validates completeness of
      the enumerator before it is trusted at full scale. STEP 2: define and freeze
      w*(DV) (raw and OJLCA-corrected) and the free-region boundary. STEP 3: run
      the full 80-step MITM enumeration of S(tau) over a tau grid; record |S(tau)|.
      STEP 4: reproduce the Shambles DV and its cost as the baseline fixture. STEP
      5: dedup by the declared symmetry group and compute the two-directional set
      difference against the checked-32 list; name uncovered members with their w*
      and cost ratios. STEP 6: run the random-linear-code null and report the
      shell-size comparison.
    controls:
      - >-
        BRUTE-FORCE COMPLETENESS CONTROL (blocking): on the reduced instance the
        MITM shell must equal the exhaustively enumerated low-weight set. A
        mismatch means the enumerator is incomplete and no full-scale count is
        admissible.
      - >-
        BASELINE FIXTURE: the Shambles DV must appear with reproduced per-block
        cost, or the cost functional is wrong.
      - >-
        SYMMETRY-DEDUP CONTROL: the shell is deduped by a pre-declared symmetry
        group; multiplicities are reported so a gap is never a relabelled checked
        DV.
      - >-
        RANDOM-LINEAR-CODE NULL: matched-dimension random code shell-size
        distribution, to attribute shell size to SHA-1 structure versus code
        arithmetic.
      - >-
        NEARBY-OBJECT CONTROL: a known-infeasible codeword just above tau must not
        be reported as a gap.
    required_metrics:
      - shell cardinality |S(tau)| over the tau grid, before and after symmetry dedup
      - checked-set coverage of the deduped shell at tau_pub
      - OJLCA-predicted versus published per-block cost for the Shambles DV
      - MITM-versus-brute-force shell agreement on the reduced instance
      - random-linear-code null shell-size distribution
      - explicit list of uncovered shell members with type, offset, w*, and cost ratio
      - frozen fixtures and an artifact manifest with source hashes and seeds
  falsification_conditions:
    - >-
      On the reduced instance the MITM search misses a codeword brute force finds.
      The enumerator is incomplete; every full-scale shell count and hence the
      completeness decision is inadmissible until fixed. This is the blocking gate.
    - >-
      The Shambles DV's OJLCA w* mispredicts its published per-block cost beyond
      the pre-declared factor. The cost functional is wrong; the shell's cost
      labels and the tau-bounded decision are void until the functional is
      corrected -- reported as a diagnostic, not buried.
    - >-
      The deduped shell S(tau_pub) equals the checked-32 set. This is NOT a
      failure of the record; it is the positive completeness outcome over the
      linear class at tau_pub and is reported with its scope and the classes that
      remain open (non-linear, multi-block-coupled).
    - >-
      The SHA-1 shell size is statistically indistinguishable from the random-code
      null. Then |S| reflects code arithmetic rather than SHA-1 structure and the
      coverage reading is correspondingly weakened.
  confounders:
    - >-
      OJLCA DEPENDENCIES. True per-block success probability is not exactly
      2^{-w*} because local collisions interact; MITIGATION: use the OJLCA-computed
      w*, report the raw-vs-OJLCA gap, and validate both against MD5-scale /
      reduced-step end-to-end block-search cost.
    - >-
      FREE-REGION BOUNDARY. The step at which message modification stops giving
      free conditions shifts every DV's w* by a common offset; MITIGATION: declare
      the boundary before enumeration and report shell membership as a function of
      it.
    - >-
      TAU IS A FREE PARAMETER. A generous tau manufactures a large shell; a tight
      one manufactures completeness; MITIGATION: report |S(tau)| and the coverage
      as curves over a tau grid anchored at the published cost, never at one
      point.
    - >-
      SYMMETRY DOUBLE-COUNTING. Without dedup, offset-shifted copies of checked
      DVs would appear as spurious gaps; MITIGATION: pre-declared symmetry group
      and reported multiplicity classes.
  interpretation_limits:
    - >-
      Completeness or gap is scoped to the LINEAR single-block-aligned DV class,
      the declared cost functional, and the declared tau. Non-linear differentials
      and multi-block-coupled DVs are explicitly out of scope and are the named
      forward-guidance classes that remain open.
    - >-
      An uncovered low-w* DV is an evader CANDIDATE and a per-block cost
      statement, NOT a demonstrated attack: feasibility of a message-modification
      realizing it is a separate, harder obligation this record does not discharge.
    - >-
      No statement is made about any deployed repository, certificate, or system;
      the claim tier is a cost map plus a scoped detector-completeness statement,
      per RQ claim_tier_ceiling.
    - >-
      The Shambles cost figures used to set tau are WebSearch-snippet level this
      session and are marked unverified until primary text is filed as KN-LIT.
  heuristic_assumptions:
    - id: H1
      statement: >-
        PER-BLOCK COST FROM CODEWORD WEIGHT. For a disturbance vector DV, the
        expected number of near-collision-block trials to satisfy the remaining
        sufficient conditions is 2^{w*(DV)}, where w*(DV) is the OJLCA-optimal
        uncontrolled-condition count; equivalently, uncontrolled conditions past
        the free region behave as independent Bernoulli events at their OJLCA
        probabilities.
      rigorous_support: >-
        RIGOROUS INGREDIENT: the message expansion is exactly GF(2)-linear, so DVs
        and their propagated differences are determined by the codeword (exact).
        CLASSICAL STATEMENT IMITATED: OJLCA (KN-LIT-5099) computes the theoretical
        maximum success probability for a set of dependent local collisions, i.e.
        the correct product accounting after dependencies are folded in. THE GAP:
        residual higher-order dependencies and the free-region boundary make
        2^{-w*} an approximation, which is why H1 is validated end to end at a
        scale where the block search actually runs.
      validation_plan: >-
        SAMPLE: a declared set of DVs spanning both type families and a range of
        w*, at reduced-step SHA-1 and at MD5 scale where GOAL-MD5-001's pipeline
        can run the block search end to end. SHORTCUT: reduced-step and MD5-scale
        block search substitutes for unreachable full SHA-1, and the substitution
        is recorded as a transfer assumption. COMPARISON: measured log2(trials per
        block) versus w*(DV), by regression, expecting slope 1 and an intercept
        equal to the declared free-region offset; empirical CDF of trial counts
        against the geometric prediction at rate 2^{-w*}. TAIL CHECK: the cheapest
        sampled DV's observed minimum trial count against its predicted quantile,
        since a level effect confined to the easy tail would bias tau. TRANSFER:
        all sampled parameters (step count, primitive, DV type/offset, free-region
        boundary) recorded; no numeric extrapolation of the intercept to full
        SHA-1 is made.
  target_complexity:
    time_exponent: >-
      NO SHA-1 ATTACK EXPONENT IS CLAIMED BY THE ENUMERATION ITSELF; it is a
      completeness decision plus a map of the per-block cost exponent w*(DV) over
      the DV space. THE EXPONENT-FIRST PAYOFF IS CONDITIONAL: if the shell
      contains an uncovered DV with w* strictly below the checked DVs, that is a
      lower per-block cost exponent (a cheaper near-collision-block search) and a
      genuine exponent statement; if not, the record is a completeness building
      block and says so. The enumeration cost is ~2^{k/2} claw-search operations
      for a k-bit low-weight band, feasible at zero cryptographic compute.
    memory_exponent: >-
      ~2^{k/2} table entries for the MITM join, the standard claw time-memory
      product; kilobytes-to-gigabytes depending on the band, with the
      time-memory tradeoff being the classic van Oorschot-Wiener interpolation on
      the claw.
    best_known: >-
      The deployed detector records coverage of 32 disturbance vectors under a
      feasibility conjecture, with no enumerated cost-bounded shell and no w*(DV)
      map in this corpus; published per-block costs exist only for the specific
      attack DVs.
    hidden_overhead: >-
      The o(1)-level model error is the raw-versus-OJLCA weight gap and the
      free-region boundary offset, both disclosed and both measured rather than
      hidden.
    tradeoff_note: >-
      The only tradeoff is the MITM claw's time-memory product; parallelization is
      trivial across weight bands and across the two halves.
  dominated_by: >-
