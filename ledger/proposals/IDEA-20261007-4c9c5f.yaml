      distinct_preimage_search: two bases with different means are reported and void the comparison
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: the lex-first ordinary curve over F_5 at n = 3
        predicted_gain: a mean weight at least 1/2 below the random mean
    quantifier_order: >-
      For this one curve and this one basis, w_frob is at most
      w_rand - 1/2. Not a statement for every basis.
    method_ceiling:
      strongest_certifiable_claim: two means on one curve
      nearby_object_control: the random-chord mean
    proof_obligations:
