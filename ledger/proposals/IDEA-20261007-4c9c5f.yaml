idea:
  id: IDEA-20261007-4c9c5f
  question_id: RQ-FROB-7d8dd4
  added: '2026-10-07'
  status: proposed
  approved_by: null
  title: >-
    Hamming weight of the Frobenius-chord numerator against random chords
  class: measurement
  claim: >-
    Let E be the lexicographically first nonsingular ordinary curve
    y^2 = x^3 + a x + b over F_5, skipping y^2 = x^3 + x + 1 if that
    equation would otherwise be selected. Write F_{5^3} in the monomial
    basis of the first monic irreducible cubic over F_5. Let S be the
    affine points of E(F_{5^3}) whose x-coordinate is not in F_5. Let
    w_frob be the mean number of nonzero coefficients of y(P)^5 - y(P)
    as P runs through S. Let w_rand be the mean number of nonzero
    coefficients of y(Q) - y(P) as (P, Q) runs through ordered pairs of
    distinct points of S. The claim is w_frob <= w_rand - 1/2. The
    concrete negative is w_frob > w_rand - 1/2. This is a mean Hamming
    weight of a numerator. It is not the number of distinct slopes, it
    is not the trace-zero share of affine x-coordinates, and it is not
    a count of extra multiplications in t = x + b/x. The rho exponent
    stays 1/2. The delta versus that exponent is 0.
  mechanism: >-
    The numerator of the chord through P and its coordinate 5-power is
    y(P)^5 - y(P), which is the image of an F_5-linear map. A random
    chord numerator y(Q) - y(P) is not confined to that image. The
    tracked object is the mean weight in a fixed basis. Representation
    class R1. No factor base is built.
  novelty_status: unverified
  citations:
    - ref: KR-IC-b0fcda
      provenance: internal
      claim: >-
        The recorded symmetry gain is a factor 1/n on the number of
        systems. A mean Hamming weight is not that factor.
      verified_by: >-
        coordinator, 2026-10-07, opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-b0fcda.yaml
    - ref: KR-RHO-037e22
      provenance: internal
      claim: >-
        Frobenius-class rho keeps exponent 1/2. This weight does not
        change it.
      verified_by: >-
        coordinator, 2026-10-07, opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-037e22.yaml
  assumptions:
    - A singular curve is instrument_failure, not a weight.
    - Pairs with y(P) = y(Q) are excluded from w_rand. A zero numerator is not scored as weight 0 of a chord.
  predictions:
    - metric: w_frob minus w_rand
      direction: lower
      minimum_effect: "<= -1/2"
  minimal_test:
    design: >-
      Enumerate S on the frozen curve. Average the Hamming weights of
      the two families of numerators in the frozen basis. Do not sample.
      Do not count distinct slopes. Do not use y^2 = x^3 + x + 1.
    controls:
      - A zero discriminant voids the run.
      - The basis polynomial is irreducible. A reducible polynomial voids the run.
      - Repeating the averages returns the same means.
    required_metrics:
      - w_frob
      - w_rand
      - the size of S
      - the curve coefficients a and b
  falsification_conditions:
    - w_frob is strictly greater than w_rand - 1/2 after the instrument checks pass.
  confounders:
    - The number of distinct slopes is a different integer. Recording it does not choose the row.
    - A change of basis can change the weight. The basis is frozen before the means are computed.
  interpretation_limits:
    - Toy scope: q = 5 and n = 3 on one curve.
    - The exponent 1/2 is unchanged whether or not the means differ by 1/2.
    - This is not a multiplication count for a coordinate substitution.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The image of the linearized map y |-> y^5 - y has mean Hamming
        weight at least 1/2 below the mean weight of unrestricted
        differences, in the frozen basis, at this field size. This is
        not a theorem.
      rigorous_support: >-
        y |-> y^q - y is F_q-linear. Nothing opened in this session
        forces a weight gap of 1/2.
      validation_plan: >-
        Repeat the means at n = 5 on the same curve shape, still over
        F_5. If the gap is below 1/2 there, H1 fails. The n = 3 reading
        is still recorded.
  target_complexity:
    time_exponent: unchanged at 1/2
    memory_exponent: >-
      Unchanged. The test stores one curve over F_{5^3}.
    best_known: >-
      KR-RHO-037e22 at exponent 1/2, and KR-IC-b0fcda at a factor 1/n
      on the number of systems.
    hidden_overhead: No o(1) term is claimed. The output is two means.
    tradeoff_note: No time-memory tradeoff. The exponent stays 1/2.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: >-
    Checked KR-RHO-037e22 and KR-IC-b0fcda, both opened 2026-10-07.
    KR-RHO-037e22 dominates the generic side at exponent 1/2. A mean
    Hamming weight is not an exponent and does not shrink that distance.
  sota_delta: >-
    Zero change to the exponent 1/2 and zero change to the factor 1/n.
    The quantities measured are two means. Relative to KR-RHO-037e22
    the leading term is unchanged, so the delta is 0.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
