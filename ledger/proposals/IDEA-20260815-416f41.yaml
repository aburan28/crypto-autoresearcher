idea:
  id: IDEA-20260815-416f41
  question_id: RQ-MONO-001
  added: '2026-08-15'
  title: >-
    THE GENERIC-FIBRE CYCLE-TYPE CENSUS WAS REJECTED AT SCOPE AT EVERY
    ARITY, SO PROBE THE SPECIALISED COVER INSTEAD: monodromy of the fibre
    over an ACTUAL target point, where the relation rate is actually
    consumed
  class: measurement

  claim: >-
    DEC-20260810-2f86db rejects the generic-fibre Frobenius cycle-type
    census as a probe of relation rate at every m, on EV-MONO-a0a89c OBS-5.
    That rejection is about the GENERIC fibre. Relation collection never
    touches the generic fibre -- it touches the fibre over specific target
    points. Those specialised fibres can have smaller monodromy than the
    generic one (specialisation can only shrink the group), and the
    exceptional locus the lane is hunting is by definition where
    specialisation drops it. This record censuses cycle types over sampled
    ACTUAL targets rather than the generic point, which is a different
    object and is not covered by the rejection.

  mechanism: >-
    For sampled targets, construct the specialised summation fibre, compute
    Frobenius cycle types over a range of primes, and compare the empirical
    cycle-type distribution against the full symmetric/wreath prediction.
    Report the fraction of targets whose specialised monodromy is provably
    smaller, and correlate that fraction with the measured decomposition
    rate on the same targets.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Read of DEC-20260810-2f86db and EV-MONO-a0a89c OBS-5 to establish
      the exact scope of the rejection; grep for 'specialized cover' (0),
      'specialised fibre', 'specialisation', 'generic fibre'.
    results: >-
      The rejection is explicitly scoped to the generic-fibre census.
      'specialized cover' returns zero and no record censuses monodromy
      over sampled targets.
    verdict: >-
      UNVERIFIED. The generic-versus-special distinction is standard
      algebraic geometry; what is new is noticing that the lane's
      rejection does not reach the specialised object that relation
      collection actually uses.

  object_first_candidate:
    tracked_object: >-
      THE FROBENIUS CYCLE TYPE OF THE SPECIALISED SUMMATION FIBRE over an
      actual target, rather than of the generic fibre.
    lossiness: >-
      Cycle type is a drastic lossy projection of the fibre's Galois
      action; the question is whether it retains enough to separate a
      shrunken specialisation from a full one.
    propagation: >-
      Not applicable; a census, not a tracked-object propagation claim.
    survival_score: >-
      Survives while specialised fibres are constructible and cycle types
      computable at toy arity; dies at arities where the fibre degree
      exceeds the factoring budget.

  null_object_control: >-
    NULL 1 -- the GENERIC fibre census on the same curve, which is the
    rejected object and is included precisely so the specialised result can
    be shown to differ from it rather than reproduce it. NULL 2 -- random
    degree-matched covers with known full monodromy, confirming the census
    can certify fullness. NULL 3 -- a PLANTED shrunken cover, which the
    census must detect; without it a null result is a statement about the
    census, not about the curve.

  discriminated_from:
    - >-
        EV-MONO-a0a89c and DEC-20260810-2f86db. EXPLICITLY OUTSIDE THE
        REJECTION: the decision rejects the generic-fibre census at every
        m. This record's object is the specialised fibre over sampled
        targets, which that evidence never measured. If the Coordinator
        judges the rejection to cover specialised fibres too, this record
        is withdrawn -- and that judgement should be recorded either way.
    - >-
        The RELN decomposition-rate lane. COMPLEMENTARY: this supplies a
        structural explanation for per-target rate variation that the RELN
        target-distribution record would measure empirically. Running both
        and correlating them is stronger than either alone.

  assumptions:
    - >-
        Specialised fibres are constructible per target at toy arity.
        Standard in outline, but the construction must be verified per
        target rather than assumed uniform.
    - >-
        Cycle types are computable over enough primes for the distribution
        to be estimable. This bounds the detectable deviation and is the
        census's resolution floor, which must be reported.

  predictions:
    - metric: >-
        planted shrunken cover detection
      direction: different
      minimum_effect: >-
        FORCED DETECTED, else the census cannot report absence of
        shrinkage.
    - metric: >-
        fraction of targets with provably smaller specialised monodromy
      direction: different
      minimum_effect: >-
        No direction pre-committed; this is the measurement. Compared
        against the generic-fibre census on the same curve.
    - metric: >-
        correlation between shrunken monodromy and decomposition rate on
        the same targets
      direction: different
      minimum_effect: >-
        A positive correlation is the record's exponent-relevant outcome
        and routes to its own proposal; no correlation closes this route
        at the tested scope.

  minimal_test:
    design: >-
      One curve, m = 3, >= 100 sampled targets, cycle types over >= 50
      primes, plus the generic-fibre comparison and both controls. Small,
      and it tests an object the lane's rejection does not cover.
    controls:
      - >-
          Generic-fibre census on the same curve, as the rejected
          reference.
      - >-
          Random degree-matched covers with known full monodromy.
      - >-
          Planted shrunken cover, which must be detected.
      - >-
          Special-j curves excluded from the main sample and reported
          separately.
    required_metrics:
      - >-
          Cycle-type distribution per target, with the number of primes
          used.
      - >-
          Fraction of targets with detectable shrinkage, above the
          stated resolution floor.
      - >-
          Decomposition rate on the same targets, for correlation.
      - >-
          Census resolution floor.
      - >-
          Artifact manifest with hashes and rebuild receipt.

  falsification_conditions:
    - >-
        Planted shrinkage undetected. Census not fit for purpose; no
        negative admissible.
    - >-
        Specialised census reproduces the generic one exactly. The
        rejection extends here too and the route closes.
    - >-
        No correlation with decomposition rate. The structural probe does
        not explain rate variation at this scope.
    - >-
        Fibre construction fails on a meaningful fraction of targets.
        Sample is biased; report rather than proceed.

  confounders:
    - >-
        SCOPE DISPUTE: whether DEC-20260810-2f86db already covers
        specialised fibres is a Coordinator judgement, not a technical
        fact, and running the record without settling it risks producing
        evidence the lane cannot use.
    - >-
        SMALL-PRIME NOISE: cycle-type distributions over few primes are
        noisy and manufacture apparent shrinkage; the resolution floor
        governs every claim.
    - >-
        SPECIAL-j CONTAMINATION: automorphisms shrink monodromy for
        reasons unrelated to the exceptional locus being hunted.

  interpretation_limits:
    - >-
        Does not revisit or contest the generic-fibre rejection; it
        measures a different object.
    - >-
        Toy arity and one curve; no crypto-scale or exponent claim.
    - >-
        A correlation would be an observation about relation rate, not an
        attack.

  heuristic_assumptions:
    - id: HEUR-MONO-SPEC-1
      statement: >-
        The specialised summation fibre over a uniformly sampled target
        has the same monodromy group as the generic fibre for all but a
        density-zero set of targets.
      rigorous_support: >-
        The rigorous ingredient is Hilbert irreducibility in its
        function-field form, which gives that specialisation preserves
        the Galois group outside a thin set. THE GAP: Hilbert
        irreducibility is a statement over infinite fields and its
        effective content over a fixed finite F_p is exactly what is not
        available, so over F_p this is a genuine heuristic and the thin
        set may be far from negligible.
      falsification_condition: >-
        A measured shrinkage fraction materially above the census
        resolution floor.
      validation_plan: >-
        SAMPLE: >= 3 curves x >= 100 targets x >= 50 primes. COMPARISON:
        shrinkage fraction against the random-cover null. TAIL CHECK:
        the 10 most-shrunken targets, reported with their curve
        invariants and checked against the special-j exclusion. TRANSFER
        ASSUMPTION: none beyond the tested arity and curves.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Stated explicitly rather than omitted. Cost is one
      fibre construction and a cycle-type census per target.
    memory_exponent: >-
      Negligible beyond one fibre's polynomial data.
    best_known: >-
      The incumbent is the lane's generic-fibre census, which was rejected
      at scope; this record does not improve it and measures a different
      object.
    hidden_overhead: >-
      Constructing specialised fibres per target is more expensive than
      the generic construction done once, so cost scales with sample size
      rather than being amortised.
    tradeoff_note: >-
      More targets buys shrinkage-fraction resolution; more primes buys
      per-target certainty. The split is fixed in advance.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed). As a
    monodromy probe: the generic-fibre census is broader but was rejected at
    scope, so neither dominates. As algebraic geometry: dominated by the
    classical specialisation literature, which is used and not extended. Not
    null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: a monodromy probe on the
    object relation collection actually consumes, explicitly outside the
    scope of the lane's existing rejection; a shrinkage-fraction measurement
    with a stated resolution floor; and a correlation test against
    decomposition rate that would connect the MONO and RELN lanes for the
    first time.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.8 that specialised fibres are constructible at m=3. 0.85 that the
    census detects planted shrinkage. 0.3 that a meaningful shrinkage
    fraction exists above the floor. 0.15 that it correlates with
    decomposition rate, which is the outcome that would matter. 0.35 that
    the Coordinator rules the existing rejection already covers this,
    retiring the record before it runs.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
