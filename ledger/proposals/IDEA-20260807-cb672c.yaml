idea:
  id: IDEA-20260807-cb672c
  question_id: RQ-CLGP-b99df5
  added: '2026-08-07'
  title: >-
    THE BRIDGE DETECTOR, AND THE NULL IT MUST CLEAR FIRST: a mutual-information
    instrument that measures how many bits any class-group-derived statistic of
    an ECDLP instance carries about k, calibrated against two matched nulls
    (resample k with the curve fixed, resample the curve with k fixed) and
    against a family of PLANTED bridges of known bit-width -- so that the
    lane's expected zero is a MEASURED zero with a stated detection floor,
    rather than an assertion
  class: control

  claim: >-
    (A) THE PROBLEM THIS SOLVES. Every other L10 proposal in this batch
    predicts a null: the bridge from ECDLP to Cl(O) is constant, or zero, or
    simulable. Under docs/inventor-protocol.md section 3 a reported signal is
    an artifact until measured against a matched null -- and symmetrically, a
    reported NULL is meaningless without a stated DETECTION FLOOR. "We found
    no correlation" is not a result unless the instrument is known to be able
    to find one. This record builds the instrument that makes the lane's
    negatives citable, and its central output is not a p-value but a floor:
    THE SMALLEST BRIDGE WIDTH THIS PIPELINE COULD HAVE DETECTED AT THIS SAMPLE
    SIZE.

    (B) THE MEASURED QUANTITY. For an isogeny class fixed by (p, t), define a
    STATISTIC as any efficiently computable map
        S : (E, P, Q) -> a finite alphabet A,
    where the computation may use the class group, the isogeny graph, and the
    endomorphism ring, but no discrete logarithm. Measure the empirical mutual
    information I(S ; k) over instances with the curve fixed and k uniform on
    (Z/N)^*, in bits, together with the Miller-Madow bias correction and a
    permutation-based null distribution. The candidate statistic list, fixed in
    advance so it cannot be tuned after seeing data:
      S1  the class-group coordinate of E/<Q> relative to E -- i.e. the
          canonical kernel-ideal bridge of IDEA-20260807-5d7606;
      S2  the class of the ideal (N, pi - 1), and its order in Cl(O);
      S3  the vectorization vector of E against a fixed base curve E_0 in the
          class, expressed in the small-prime generating set;
      S4  the crater position of the curve reached by a DETERMINISTIC walk
          whose step choices are derived from bits of x(Q) as a field element
          -- the one R1-flavoured statistic in the list, included precisely
          because the CAGG closure of IDEA-20260807-1b7241 does not cover it;
      S5  the number of F_p-rational ell-isogenies from E for each small ell
          (a pure curve statistic, expected to be k-independent and included
          as an internal negative control);
      S6  the low bits of the j-invariant of E/<Q>.
    Statistics S1, S2, S5 are curve-only and are PREDICTED to give exactly
    zero; including them is how the instrument's own bias is measured. S4 and
    S6 are the only entries that can be nonzero on structural grounds, and S4
    is the only one this batch does not already have an argument against.

    (C) THE TWO NULLS, WHICH ARE DIFFERENT AND BOTH REQUIRED.
      NULL-A (RESAMPLE k, FIX THE CURVE). Draw fresh k with (E, P) fixed. Any
      statistic that is a function of the curve alone is EXACTLY constant here,
      so its measured I must be the estimator's bias and nothing else. This
      null calibrates the FLOOR: the measured I on S1/S2/S5 IS the bias, and
      no statistic may be called informative unless it exceeds it. This is the
      canonical control the campaign's lane L7 already identifies as decisive.
      NULL-B (RESAMPLE THE CURVE, FIX k). Draw a fresh curve from the class
      with k held fixed. Any statistic that varies here but not in NULL-A is
      reading curve identity, not k. This separates "the statistic moves" from
      "the statistic moves WITH k", which is the confusion that turns a
      correlation into a false mechanism.
    A statistic is called a candidate bridge only if I is above the NULL-A
    floor AND the dependence survives NULL-B stratification.

    (D) THE PLANTED-BRIDGE LADDER -- THE POSITIVE DIRECTION, WHICH IS
    MANDATORY. An instrument that cannot see a bridge proves nothing by not
    seeing one. Construct synthetic instance families carrying a bridge of
    KNOWN width b bits: pick M | h with log2 M = b, fix an arbitrary embedding
    of Z/M into Cl(O) (arbitrary is fine -- the point is detection, not
    canonicity), and define the planted statistic S_plant(Q) := image of
    (k mod M). Sweep b over {0, 1, 2, 4, 8, 12, 16}. Measure I(S_plant ; k) and
    require it to track b. THE OUTPUT IS THE DETECTION FLOOR b_min(n): the
    smallest b at which the instrument reliably separates the planted family
    from NULL-A at the sample size n. Every negative result the lane reports is
    then quotable as "no bridge of width above b_min(n) bits, at this scale" --
    a bounded, honest, falsifiable statement instead of an assertion of
    nothing.

    (E) THE DISCRIMINATION. Three outcomes, all informative:
      OUTCOME 1 (predicted). Every real statistic sits at the NULL-A floor
      while the planted ladder tracks b down to a small b_min. Then the lane's
      negatives acquire a stated resolution and the other eight proposals'
      nulls become citable.
      OUTCOME 2. Some real statistic exceeds the floor and survives NULL-B.
      That statistic is a candidate bridge; it must then be checked against the
      log2 h ceiling of IDEA-20260807-bbdcf3 (it cannot exceed (1/2) log2 N
      bits) and converted, or not, into a congruence. This is the branch that
      would reopen the lane, and S4 is where it would most plausibly appear.
      OUTCOME 3. The planted ladder does NOT track b. The instrument is
      broken; nothing about real curves may be reported, and the run set is
      invalid rather than negative.

  resource_label: >-
    Audit: consumes no resource. The instrument MEASURES statistics built from
    R3 and R4 (and, for S4 only, R1), but the proposal itself mounts no attack
    and consumes no resource in the campaign's sense.
  admissibility: admissible
  admissibility_argument: >-
    Admissible as an instrument. The statistics measured are drawn from R3/R4
    (class group, ideals, isogeny graph) and one from R1 (x(Q) as a field
    element), all of which are outside the generic group. No statistic is a
    group-operation output, so H-ENDO-001's scalar collapse does not apply.
    Note the deliberate design point: S4 is included EXACTLY because it lies
    in the residual open class that IDEA-20260807-1b7241's CAGG closure cannot
    reach, so the instrument probes the one place the lane's closure argument
    does not cover.

  discriminated_from:
    - >-
      Lane L14 (RQ-INSTR-f8faa0), which owns instrumentation, null objects and
      certificates campaign-wide. This record is the L10-SPECIFIC instrument:
      its statistic list, its two nulls, and its planted ladder are all
      class-group specific and are not generic infrastructure. The coordinator
      should cross-file it with L14 rather than treat it as a competitor.
    - >-
      Lane L7 (RQ-TORS-8c7b79), whose decisive test is also "resample k with
      the curve fixed". L7 measures ell-TORSION statistics; this measures
      CLASS-GROUP statistics. The shared control is deliberate -- it is the
      canonical artifact control for any curve-versus-point question -- and the
      two lanes should share an implementation.
    - >-
      IDEA-20260807-5d7606, which PROVES S1 is constant. This record MEASURES
      it, which is not redundant: the measurement is what establishes that the
      pipeline can tell a constant statistic from an informative one, and S1
      is therefore an internal known-answer control rather than a research
      question.
    - >-
      IDEA-20260807-e9d57c, which supplies a NATURAL non-null (the
      composite-order kernel-ideal bridge of known width). That is a real
      calibrated positive; this record's planted ladder is a SYNTHETIC one of
      tunable width. Both are needed: the synthetic one sweeps b, the natural
      one proves the instrument works on genuine curve arithmetic rather than
      on a construction of the experimenter's own design.

  object_first_candidate:
    tracked_object: >-
      THE MUTUAL INFORMATION I(S ; k) IN BITS, for S ranging over the frozen
      statistic list, followed as (p, h, N, sample size n, planted width b)
      vary. The tracked object is a scalar per (statistic, instance family)
      and the whole instrument is a machine for propagating it.
    lossiness: >-
      LOSSY: it forgets the statistic's values, its alphabet, the curve and
      the instance, retaining one real number. The discarding is compatible
      with the target's operations because mutual information is invariant
      under relabelling of the alphabet -- which is exactly the invariance a
      bridge detector needs, since a bridge that permutes labels is still a
      bridge. It is not a change of coordinates: the whole point is that many
      structurally different statistics collapse to the same scalar, and the
      instrument's job is to find any whose scalar is nonzero.
    propagation: >-
      One-step propagation is defined and measurable in two directions. Under
      an increase of the sample size n, the estimator's bias falls like
      (|A| - 1)/(2 n ln 2) and the measured I on a true null must fall with
      it -- that is the decay test. Under an increase of the planted width b,
      the measured I must rise linearly with b until it saturates at
      log2 min(|A|, N). Both propagations are predicted quantitatively before
      any measurement, which is what makes the instrument falsifiable.
    survival_score: >-
      Survives changes of statistic, of curve, and of alphabet coarsening
      (mutual information is monotone under coarsening, giving a free internal
      consistency check). DIES when the alphabet size approaches the sample
      size, where the estimator's bias swamps everything -- and that death
      point is computable in advance and is what sets the binding constraint on
      the design (|A| must stay well below n).

  mechanism: >-
    STEP 1 (zero compute, and FROZEN BEFORE ANY DATA). Fix the statistic list
    S1-S6, the alphabet coarsening for each (so |A| <= n/50), the estimator
    (plug-in with Miller-Madow correction), the null procedure (permutation of
    k labels, 10^3 permutations), and the decision thresholds. Pre-registration
    is what prevents the classic failure of this design, which is choosing the
    statistic after seeing which one looks interesting.

    STEP 2 (toy compute). Build the instance generator: enumerate a toy
    isogeny class (fixed p, t), compute Cl(O) and the action, pick E and P,
    and generate n instances by drawing k uniformly. n = 10^5 per cell is
    reachable in pure Python at 16-24 bits.

    STEP 3 (toy compute, HARD GATE, THE PLANTED LADDER). Run the whole
    pipeline on the synthetic planted families at b in {0,1,2,4,8,12,16}.
    Extract b_min(n). If the measured I does not track b -- specifically, if
    it fails to rise above the NULL-A floor by b = 4 -- the instrument is
    broken and the line halts here before any real statistic is measured. This
    gate is deliberately placed BEFORE the real measurement so that a broken
    instrument cannot produce a publishable-looking null.

    STEP 4 (toy compute). Run NULL-A and NULL-B on the real statistics S1-S6.
    Report I with its permutation null distribution, its bias estimate, and
    the b-equivalent width of any excess.

    STEP 5 (toy compute, THE DECAY TEST). Repeat Step 4 at n in
    {10^3, 10^4, 10^5}. Every measured I on a true null MUST fall like
    1/n. A quantity that does NOT fall with n is the canonical artifact tell
    named in the inventor protocol and in this batch's brief, and it identifies
    a leak in the generator rather than a bridge.

    STEP 6 (toy compute). Repeat across a ladder of h. If any excess is found,
    check whether it decays as h grows -- a genuine bridge should NOT decay
    with h (it should carry up to log2 h bits), while a finite-size artifact
    should. This is the one place where the expected behaviours of signal and
    artifact differ in SIGN under the same parameter, which makes h the
    sharpest available discriminator.

    STEP 7 (zero compute). Report the floor. The headline sentence the lane is
    entitled to is exactly: "no class-group statistic in the frozen list
    carries more than b_min(n) bits about k, on this instance family, at
    p <= 2^24".

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Repository greps on 2026-08-07 over ledger/, knowledge/, docs/,
      analysis/: "mutual information"; "null object|matched null|planted";
      "resample k|curve fixed"; "class group"; "detection floor". Full reads:
      DECOMPOSITION.md sections 3-5 (lanes L7, L10, L14), RQ-INSTR-f8faa0,
      RQ-TORS-8c7b79, RQ-CLGP-b99df5, KN-TECH-056.
    results: >-
      The "resample k with the curve fixed" control is already named in
      DECOMPOSITION.md as lane L7's decisive test, so the control is NOT new
      to the campaign -- this record adopts it deliberately and says so.
      "mutual information": no record in ledger/ or knowledge/ measures
      I(statistic ; k) for any statistic. No record anywhere states a
      DETECTION FLOOR for a reported null. Lane L14 requires planted-signal
      detection in both directions but supplies no instrument for
      class-group statistics.
    verdict: >-
      ADAPTATION. Mutual-information estimation with Miller-Madow correction
      and permutation nulls is standard statistics; the resample-k control is
      already the campaign's. New here: the frozen class-group statistic list
      with S4 aimed deliberately at the CAGG closure's blind spot, the
      two-null design separating "varies" from "varies with k", the planted
      ladder yielding a numeric detection floor, and the h-decay test whose
      sign differs between signal and artifact. No external novelty claimed.

  null_object_control: >-
    THIS PROPOSAL IS ITSELF A NULL-OBJECT INSTRUMENT, so the field is filled
    with the controls that validate the instrument rather than the mechanism.
    MATCHED NULL OF THE SAME SHAPE: NULL-A (resample k, curve fixed) and
    NULL-B (resample curve, k fixed) -- both produce instance sets of exactly
    the same shape, size and alphabet as the real measurement, differing only
    in which coordinate is resampled.
    DECAY PARAMETER, PRIMARY: the sample size n. Every measured I on a true
    null must fall like (|A| - 1)/(2 n ln 2). A measured I that fails to fall
    when n grows tenfold is the canonical artifact tell and halts the line.
    DECAY PARAMETER, SECONDARY AND MORE DIAGNOSTIC: h. A finite-size artifact
    must decay as h grows; a genuine bridge must NOT (its capacity is log2 h,
    which grows). The opposite predicted signs under the same parameter make h
    the discriminating knob rather than merely a robustness check.
    POSITIVE CONTROLS, BOTH REQUIRED: the synthetic planted ladder (tunable
    width) and the natural composite-order bridge of IDEA-20260807-e9d57c
    (genuine curve arithmetic). Failing either voids the run set.

  assumptions:
    - >-
      k is uniform on (Z/N)^* in the real measurement. Enforced by the
      generator and verified by a uniformity test on the drawn k, because a
      biased generator would create apparent dependence out of nothing.
    - >-
      The statistics are computable without a discrete logarithm. Verified per
      statistic; a statistic that secretly needs k is a circularity and is
      excluded. S3 in particular uses vectorization against a FIXED base
      curve, which at toy scale is done by exhaustive walk and is legitimate,
      but the record notes that at crypto scale S3 would itself cost p^{1/4}.
    - >-
      Alphabet sizes are coarsened so |A| <= n/50, keeping the plug-in
      estimator's bias small and computable. Any statistic whose natural
      alphabet is too large (S6's j-invariant bits, S3's full vector) is
      coarsened by a FROZEN rule, and the coarsening is reported, because
      mutual information is monotone under coarsening and a post-hoc
      coarsening choice could manufacture or destroy a signal.
    - >-
      Toy scale only. p up to ~24 bits so that a whole isogeny class can be
      enumerated and Cl(O) computed exactly by counting reduced forms.

  proof_search_map:
    not_applicable_reason: >-
      PURELY EMPIRICAL PROPOSAL. It asserts no theorem, no asymptotic bound,
      no certificate family, no reduction and no closure argument; it builds a
      measuring device and reports a detection floor. The proof-oriented
      content of this lane lives in IDEA-20260807-5d7606, IDEA-20260807-0fafe8,
      IDEA-20260807-bbdcf3 and IDEA-20260807-1b7241, each of which carries its
      own proof_search_map. What this record owes instead of a proof map is a
      pre-registration and a detection floor, and both are specified above --
      the floor is the empirical analogue of a method ceiling and is reported
      with every negative.

  predictions:
    - metric: >-
        measured I(S ; k) in bits for the curve-only statistics S1, S2, S5,
        under NULL-A, at n = 10^5
      direction: lower
      minimum_effect: >-
        Below the Miller-Madow bias estimate (|A| - 1)/(2 n ln 2) plus two
        permutation-null standard deviations, on 100 percent of cells.
        Predicted essentially exactly zero, since these statistics are
        provably constant in k. An excess here is an instrument or generator
        fault, not a finding.
    - metric: >-
        measured I(S_plant ; k) as a function of planted width b
      direction: higher
      minimum_effect: >-
        Rising with b and within 20 percent of b for b <= 8 at n = 10^5. If
        the instrument does not track the planted width, it is broken and no
        real statistic may be reported.
    - metric: >-
        the detection floor b_min(n)
      direction: lower
      minimum_effect: >-
        At most 3 bits at n = 10^5. A floor above 8 bits would make the lane's
        negatives nearly vacuous (since the ceiling is (1/2) log2 N, which is
        12 bits at 24-bit p), and would mean the design must be scaled up
        before any negative is quoted.
    - metric: >-
        measured I for S4 (the x(Q)-derived walk statistic) minus the NULL-A
        floor
      direction: different
      minimum_effect: >-
        Predicted zero within the floor. An excess above the floor that
        survives NULL-B stratification and does NOT decay with n is the single
        most valuable outcome in the entire lane -- it would be a bridge in the
        exact residual class the CAGG closure cannot cover -- and triggers
        immediate escalation, replication with fresh seeds, and independent
        review before any interpretation.
    - metric: >-
        ratio of measured I at n = 10^4 to that at n = 10^5, on true nulls
      direction: higher
      minimum_effect: >-
        Approximately 10, matching the 1/n bias decay, within a factor 2. A
        ratio near 1 means the quantity is not bias-dominated and something is
        leaking.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): pre-register the statistic list, coarsening
      rules, estimator, null procedure and thresholds. Freeze.
      STAGE 1 (hours): instance generator over one toy class; uniformity test
      on the drawn k.
      STAGE 2 (hours, HARD GATE): the planted ladder; extract b_min(n). Halt
      if the ladder does not track b.
      STAGE 3 (hours): NULL-A and NULL-B on S1-S6; report I, bias, permutation
      null, and b-equivalent width.
      STAGE 4 (hours): the n-decay test at three sample sizes.
      STAGE 5 (hours): the h-ladder, checking the sign of any excess's
      dependence on h.
      STAGE 6 (minutes): run the natural composite-order positive control from
      IDEA-20260807-e9d57c through the identical pipeline.
      STAGE 7 (zero compute): report the floor and the headline sentence.
    controls:
      - NULL-A, resample k with the curve fixed
      - NULL-B, resample the curve with k fixed
      - synthetic planted ladder over b -- MUST track b
      - natural composite-order bridge -- MUST be detected
      - internal known-answer controls S1, S2, S5, provably constant
      - uniformity test on the generated k
      - alphabet-coarsening monotonicity check (I must not increase under
        coarsening)
    required_metrics:
      - I(S;k) in bits per (statistic, n, h, cell), with bias estimate and
        permutation-null quantiles
      - b_min(n) per sample size
      - the n-decay ratio per statistic
      - the h-dependence of any excess, with its sign
      - alphabet size |A| per statistic after coarsening
      - pass/fail of every gate control

  falsification_conditions:
    - >-
      The planted ladder fails to track b. Instrument broken; run set INVALID
      rather than negative; nothing about real curves may be reported.
    - >-
      A curve-only statistic (S1, S2, S5) shows I above the floor. Generator
      or estimator fault; halt and debug. These are provably constant in k, so
      an excess is definitionally an artifact.
    - >-
      Measured I on a true null fails to decay like 1/n. The canonical
      artifact tell; the pipeline leaks and every number is void.
    - >-
      S4 shows a persistent excess surviving NULL-B and the n-decay test.
      The lane's closure does NOT cover this case; escalate for independent
      review. This is a falsification of the lane's expectation, not of the
      instrument, and it is the outcome that would justify the whole batch.
    - >-
      b_min(n) exceeds the ceiling (1/2) log2 N at the tested sizes. The
      instrument cannot resolve any bridge the theory allows, so its negatives
      say nothing and must not be quoted; scale up or report only the floor.

  confounders:
    - >-
      ESTIMATOR BIAS. Plug-in mutual information is positively biased by
      roughly (|A| - 1)/(2 n ln 2). At |A| = 100 and n = 10^3 that is about
      0.07 bits, which is large enough to look like a signal. Miller-Madow
      correction plus the permutation null are both applied, and the raw and
      corrected values are both reported.
    - >-
      POST-HOC STATISTIC SELECTION. With six statistics and several cells, a
      5 percent threshold will fire somewhere. The list is frozen in advance,
      the multiple-comparison correction is declared in Stage 0, and any
      statistic added later is reported as exploratory and never as
      confirmatory.
    - >-
      COARSENING CHOICE. Mutual information is monotone under coarsening, so a
      coarsening chosen after seeing the data can only destroy signal -- but a
      coarsening chosen to CREATE apparent structure (e.g. binning on a
      k-correlated boundary) can manufacture it. The rule is frozen and the
      monotonicity check is run.
    - >-
      SMALL CLASSES. At h < 20 the alphabet for S3 is tiny and I saturates at
      log2 h, which can look like a ceiling effect or like nothing at all
      depending on the reading. Require h >= 100 for any interpreted cell and
      report h with every number.
    - >-
      GENERATOR LEAKAGE. The single most dangerous confounder: if instances
      are generated by a loop whose seed schedule correlates with k, EVERY
      statistic will appear informative. The n-decay test and the S1/S2/S5
      known-answer controls exist to catch exactly this, and both must pass
      before any real number is read.
    - >-
      S3 IS EXPENSIVE AND CIRCULAR AT SCALE. Vectorizing against a base curve
      costs sqrt(h) and is affordable only at toy scale. Its measured value is
      legitimate here, but a positive on S3 would NOT immediately be an attack,
      because computing S3 at crypto scale already costs p^{1/4}. This is
      recorded so a positive is not misread.

  interpretation_limits:
    - >-
      A NULL FROM THIS INSTRUMENT IS BOUNDED, NOT ABSOLUTE. The only
      defensible sentence is "no statistic in the frozen list carries more than
      b_min(n) bits about k, on this family, at this scale". Statistics not in
      the list are untested, and the list is short.
    - >-
      Toy scale. Enumerating a whole isogeny class and computing Cl(O) exactly
      caps p at roughly 24 bits. Nothing here is crypto-scale validation, and
      the detection floor at toy scale says nothing about the floor at
      cryptographic size.
    - >-
      Mutual information measures DEPENDENCE, not exploitability. A statistic
      carrying b bits about k is not automatically usable: converting
      dependence into a congruence is separate work with its own record, and
      the ceiling argument of IDEA-20260807-bbdcf3 caps whatever it could be
      worth at exponent 1/4.
    - >-
      QUANTUM: nothing in this instrument is quantum, and the subexponential
      quantum vectorization line (KN-TECH-027, KN-TECH-051, KN-OPEN-014)
      concerns the class group rather than the ECDLP. It would change the cost
      of computing S3, not its information content. The campaign is classical.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a statistic S with alphabet A that is genuinely independent of k,
        the plug-in mutual-information estimator on n samples has expectation
        (|A| - 1)/(2 n ln 2) + O(1/n^2), so the measured null floor scales like
        1/n at fixed alphabet.
      rigorous_support: >-
        The Miller-Madow expansion of the plug-in entropy estimator, a
        classical result in estimation theory; it is a theorem about the
        estimator, not an assumption about elliptic curves. Listed as H1 so
        the constant is verified empirically rather than trusted.
      validation_plan: >-
        Measure the null floor at n in {10^3, 10^4, 10^5} for each frozen
        alphabet on synthetic independent data; compare the empirical floor
        against the predicted (|A|-1)/(2 n ln 2); tail check on the 99th
        percentile of the permutation null against the predicted chi-squared
        limiting distribution of 2 n ln 2 times I. LABELLED TOY SCALE for the
        curve data, though the estimator statement itself is scale-free.
    - id: H2
      statement: >-
        A genuine bridge of width b bits produces measured I approaching
        min(b, log2 h, log2 N) and does NOT decay as h grows, whereas a
        finite-size artifact decays like 1/n at fixed h and decays in h at
        fixed n. The two therefore have OPPOSITE signs of dependence on h.
      rigorous_support: >-
        Combines the rigorous capacity bound I <= log2 |A| <= log2 h (the same
        pigeonhole that gives the ceiling in IDEA-20260807-bbdcf3) with the
        standard bias expansion of H1. The heuristic content is only that a
        real bridge would saturate rather than partially fill its capacity,
        which is why the prediction is stated as a SIGN of dependence rather
        than a magnitude.
      validation_plan: >-
        Sweep h over the toy ladder at fixed n for both the planted families
        (where the sign must be non-decreasing) and pure-noise families (where
        it must decrease); report the two curves side by side. Tail check: the
        single largest excess observed on a pure-noise family across all
        cells, compared against the multiple-comparison-corrected threshold.
        LABELLED TOY SCALE.

  reachability_gate: >-
    T5 APPLIES TO THE STATISTICS, NOT TO THE PROPOSAL, AND IT DIVIDES THE LIST
    INTO TWO PRICE CLASSES -- which is itself part of the deliverable. LOCALLY
    EVALUABLE, cheap at any scale: S1, S2, S5, S6 and S4 all require only
    computations at or adjacent to E, so they are exactly the "detectable by a
    local test evaluable at each step of a walk" case that T5 says a lane needs.
    GLOBAL ADDRESS, expensive: S3 requires the curve's class-group coordinate
    relative to a base curve, i.e. a vectorization, at ~sqrt(h) = p^{1/4}. So
    S3 is affordable at toy scale ONLY, and a positive on S3 would be a T5
    casualty rather than an attack -- the record says so in advance so that a
    positive is not over-read. This split is the practical content of the
    reachability gate for L10 and later proposals should inherit it.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR SOUGHT. The instrument's own cost is
      O(n) statistic evaluations per cell, plus sqrt(h) per instance for S3
      only. What the instrument PRODUCES is a bound on information content, in
      bits, not a complexity.
    memory_exponent: >-
      O(n + |A|) per cell, dominated by the sample of instances; at n = 10^5
      and coarsened alphabets this is megabytes. The isogeny class enumeration
      stores O(h) curves. Both are negligible at toy scale and are reported.
    best_known: >-
      There is no incumbent instrument for this question in this corpus. The
      adjacent incumbents are the lane L7 resample-k control
      (RQ-TORS-8c7b79) and the lane L14 planted-signal requirement
      (RQ-INSTR-f8faa0), both of which state the control principle without
      supplying a class-group instrument. As an ATTACK the best known remains
      0.886 sqrt(N) parallel rho (KN-TECH-001, KN-TECH-006), untouched.
    hidden_overhead: >-
      Two disclosures. First, S3's sqrt(h) cost makes it a toy-scale-only
      statistic, so a negative on S3 at toy scale does not extend to crypto
      scale by any argument given here. Second, the detection floor b_min(n)
      degrades as the alphabet grows, so a statistic with a large natural
      alphabet is tested in coarsened form and its negative is correspondingly
      weaker -- the coarsening is where the strength of the negative silently
      leaks, and it is reported per statistic rather than buried.
    tradeoff_note: >-
      The design's only tradeoff is n against |A|: finer alphabets resolve
      narrower bridges but raise the bias floor. The frozen rule |A| <= n/50
      picks a point on that curve and is stated in advance so it cannot be
      tuned to a desired outcome.

  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES. As an ATTACK: mounts none,
    therefore dominated on time by parallel rho with distinguished points
    (0.886 sqrt(N), O(1) memory, KN-TECH-001/KN-TECH-006), by BSGS
    (sqrt(N)/sqrt(N)), by automorphism-discounted rho on CM curves
    (KN-TECH-018) and by kangaroo on a known interval; it also uses far MORE
    memory than rho (O(n) samples versus O(1)) and consumes n instances of
    data where rho consumes one, so it is dominated on all three axes.
    As an INSTRUMENT: no incumbent exists in this corpus for class-group
    statistics, so on that axis it is not dominated; it is however dominated in
    SCALE by every attack baseline, since those run at any p and this runs only
    where a whole isogeny class can be enumerated. dominated_by is NOT null.
  sota_delta: >-
    Zero speedup against any attack baseline; 0.886 sqrt(N) before and after.
    The instrument delta, quantitatively: it converts the lane's expected
    negatives from unbounded assertions into a bounded statement with a
    numeric resolution b_min(n), predicted at most 3 bits at n = 10^5 against
    a theoretical ceiling of (1/2) log2 N = 12 bits at 24-bit p -- i.e. it
    resolves roughly the top three quarters of the bit range the theory
    allows. It also supplies the only test in the batch that probes the
    residual open class (S4) that the CAGG closure of IDEA-20260807-1b7241
    explicitly cannot reach.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.85 that the planted ladder tracks b and yields b_min <= 3 bits at
    n = 10^5 -- the risk is alphabet/bias bookkeeping, not concept. 0.95 that
    S1, S2 and S5 come out at the floor (they are provably constant, so an
    excess would be a bug). 0.9 that S4 comes out at the floor as well; the
    remaining 0.1 is the interesting branch and is the reason S4 is in the
    list at all. Priority MEDIUM rather than high: the lane's central results
    are algebraic and cost nothing, so the instrument is not on their critical
    path -- but it IS on the critical path for anything the lane wants to
    CITE as a measured null, and for probing the one gap the closure leaves.

