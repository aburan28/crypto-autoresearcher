# IDEA-20261003-080d8a
# Class-number count for discriminants -111 and -104. Proposal only. Not approved.
idea:
  id: IDEA-20261003-080d8a
  question_id: RQ-JINV-8fc13a
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    The class number of discriminant -111 is 8 and of discriminant -104 is 6
  class: measurement
  claim: >-
    Discriminant -111 has 8 reduced binary quadratic forms.
    Discriminant -104 has 6. Eight exceeds six by 2. The product of
    the two class numbers is 48. Their sum is 14. The gap is a class
    number, not an ECDLP exponent and not an absolute discriminant.
  mechanism: >-
    OBJECT FRAME. The object is the set of reduced forms. The
    operation set is counting those forms, which is coordinate-dependent
    on the discriminant and is not a translation of a curve point.
    Discriminant -111 has the forms with coefficients 1, 1, 28 and
    2, -1, 14 and 2, 1, 14 and 3, 3, 10 and 4, -1, 7 and 4, 1, 7 and
    5, -3, 6 and 5, 3, 6. Discriminant -104 has the forms with
    coefficients 1, 0, 26 and 2, 0, 13 and 3, -2, 9 and 3, 2, 9 and
    5, -4, 6 and 5, 4, 6. Two copies of class number 6 have gap 0.
    No curve is enumerated.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question asks whether a small discriminant confers an
        advantage beyond the automorphism discount.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-IC-889857
      provenance: internal
      claim: >-
        A first-fall-degree dispute is a different object from these
        two class numbers.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The two discriminants are frozen before the forms are counted.
    - No curve is enumerated.
  proof_search_map:
    bottleneck: The class-number gap 2.
    baseline_embedding:
      parameter_slice: The discriminants -111 and -104 and the counts 8 and 6.
      reproduction_check: >-
        Two readers must agree that the counts are 8 and 6.
    observation_collision:
      observable: The class-number gap and the product.
      distinct_preimage_search: >-
        Reporting both class numbers as 6 drops the gap. Two copies
        of class number 6 make that gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The two discriminants.
        predicted_gain: Integer gap. No curve enumeration.
    quantifier_order: >-
      The discriminants are fixed before the forms are counted.
    method_ceiling:
      strongest_certifiable_claim: >-
        The class numbers 8 and 6. Not an absolute discriminant.
      nearby_object_control: >-
        Two copies of class number 6. The gap is 0.
    proof_obligations:
      - claim: Discriminant -111 has 8 reduced forms.
        responsibility: size
      - claim: Discriminant -104 has 6 reduced forms.
        responsibility: size
      - claim: The gap is not an absolute discriminant.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: class_number_gap
      direction: different
      minimum_effect: Eight exceeds six by 2.
  minimal_test:
    design: >-
      Count the reduced forms of discriminants -111 and -104. Do not
      enumerate a curve.
    controls:
      - Two copies of class number 6, whose gap is 0.
      - An independent count.
    required_metrics:
      - both class numbers
      - the gap
      - the product
  falsification_conditions:
    - The class number of -111 is not 8.
    - The product of the two class numbers is not 48.
  confounders:
    - The absolute values 111 and 104 are not the class numbers.
  interpretation_limits:
    - A class number is not a walk length.
    - No transfer to a cryptographic discriminant.
    - This is not the class-number pair 8 and 2 of discriminants -95 and -88.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen discriminant -111 has class number 8, and the
        frozen discriminant -104 has class number 6.
      rigorous_support: >-
        No class-number theorem is re-proved here. The count is a
        reading of the reduced forms.
      validation_plan: >-
        Two independent counts of the reduced forms. A mismatch voids the gap.
  target_complexity:
