idea:
  id: IDEA-20260726-009
  title: Minimum-height representative in the isogeny class — is a weak model reachable below sqrt(p)?
  class: measurement
  claim: >-
    Ordinary isogeny paths are findable in L_p(1/2), i.e. below sqrt(p), and the
    discrete log is preserved exactly by an isogeny restricted to the
    prime-order subgroup. "Search the isogeny class for a weak representative"
    is therefore a well-posed attack rather than folklore. Since the group order
    is constant across the class, every order-based weakness is class-invariant,
    so the only remaining freedom is a representation-sensitive one: small
    coefficients, small j, or a special model admitting a low-height global lift.
    This record measures whether such a representative exists. Prediction: the
    class holds ~h(Delta) ~ sqrt(p) curves with j-invariants equidistributed in
    F_p, so the expected minimum satisfies min|j| ~ p/h(Delta) ~ sqrt(p) --
    far too large for a height-based lift to gain anything. The measurement is
    two-sided: a measured min|j| materially below the p/h(Delta) law would mean
    j is not equidistributed over the class, which is a real anomaly.
  mechanism: >-
    The reachability argument and the equidistribution argument are independent
    and both are needed. Reachability: within an ordinary isogeny class, smooth
    isogeny paths between curves are computable in subexponential time, and
    transporting P and Q along the path preserves k exactly. So an adversary is
    free to move to any representative. Equidistribution: the class is a torsor
    under Cl(Delta) of size h(Delta) = p^(1/2 + o(1)); if the induced j-invariants
    behave like an unstructured sample of that size from F_p, the expected
    minimum is p/h(Delta) ~ sqrt(p). A curve with j ~ sqrt(p) is nowhere near
    small enough for the canonical-height obstruction to relax -- the obstruction
    that closed xedni-style global-lift attacks. The measurement therefore tests
    the one quantitative assumption doing the work: that j is equidistributed
    over the class. This is the assumption most likely to be wrong, and it has
    not been measured in this ledger. Complements H-ISO-001 (rejected_scoped),
    which tested factor-base decomposition yield and Semaev solving degree on
    l-isogeny neighbours but did not measure the height/j distribution over the
    full class.
  novelty_status: unverified
  assumptions:
    - >-
      Small p is used so that the full isogeny class can be enumerated exactly,
      rather than sampled by random walks which could bias the observed minimum.
    - >-
      An isogeny restricted to the prime-order subgroup is injective, so the
      discrete log transports unchanged. Degenerate cases where the isogeny
      degree shares a factor with n are excluded and recorded.
    - >-
      "Height" of a representative is operationalized concretely -- min|j| as an
      integer representative in [0, p), and min coefficient height for a reduced
      Weierstrass model -- rather than left as an informal notion.
  predictions:
    - metric: min_abs_j_over_isogeny_class_vs_p_over_h_Delta
      direction: different
      minimum_effect: >-
        Measured min|j| agrees with the p/h(Delta) law within a constant factor
        of ~3 across the tested range. A measured minimum an order of magnitude
        below the law, reproducible across seeds, is the anomaly signal.
    - metric: j_equidistribution_over_class
      direction: different
      minimum_effect: >-
        A uniformity test on the class's j-invariants does not reject uniformity
        at the tested sizes. Rejection is the positive signal and is the more
        informative outcome.
    - metric: min_coefficient_height_over_class
      direction: different
      minimum_effect: >-
        No representative has coefficient height below the scale at which a
        global lift could have small canonical height. If one does, that
        representative must be examined directly.
  minimal_test:
    design: >-
      Small p (16-28 bits) where the full ordinary isogeny class is enumerable.
      For 8-12 classes: (1) compute t, Delta, h(Delta); (2) enumerate every
      curve in the class via l-isogeny graph traversal for small l until closure;
      (3) record the j-invariant and reduced coefficient height of each member;
      (4) compute min|j| and compare to p/h(Delta); (5) run a uniformity test on
      the j multiset; (6) for the minimum-height representative, attempt the
      cheapest global-lift diagnostic available and record whether the canonical
      height obstruction relaxes at all.
    controls:
      - >-
        Random-subset control: a uniformly random subset of F_p of size h(Delta),
        same p. Its min|j| distribution is the null against which the class's
        minimum is compared. This is the control that makes the p/h(Delta) claim
        falsifiable rather than definitional.
      - >-
        Class-size ablation: repeat across classes with materially different
        h(Delta) at fixed p, to confirm the minimum scales as p/h and not merely
        as a function of p.
      - >-
        DL-transport check: for a sampled pair of class members, transport P and
        Q along the isogeny path and verify the recovered k is unchanged. This
        validates the reachability premise rather than assuming it.
      - >-
        Matched rho cost on the base curve, so any claimed gain from moving to a
        better representative is priced including the path-finding cost.
    required_metrics:
      - min|j| and full j distribution per class, vs p/h(Delta)
      - uniformity test statistic and p-value per class
      - min coefficient height per class
      - measured isogeny path-finding cost, charged, per transport
      - matched rho baseline per instance
  falsification_conditions:
    - >-
      Reproducible min|j| an order of magnitude below p/h(Delta), i.e. j is not
      equidistributed over the class. This is a genuine anomaly requiring
      independent review before any attack framing.
    - >-
      A class member whose coefficient height is low enough that the canonical
      height obstruction measurably relaxes.
    - >-
      DL transport fails to preserve k on any non-degenerate path, which would
      invalidate the reachability premise and the entire framing.
  confounders:
    - >-
      At 16-28 bits h(Delta) is small, so the empirical minimum is a
      high-variance order statistic; many classes and seeds are needed before a
      deviation from p/h(Delta) is distinguishable from noise.
    - >-
      Enumerating the class by small-l traversal may not reach the whole class if
      the available l are not enough to generate Cl(Delta); partial coverage
      biases the minimum upward and must be detected and reported, not assumed
      away.
    - >-
      min|j| as an integer representative in [0, p) is one height notion among
      several; a class could be unremarkable in j and still contain a
      special-model representative. A null on j alone does not close the record.
    - >-
      The subexponential path-finding cost is asymptotic; at toy sizes the path
      cost may dominate and obscure the comparison being made.
  interpretation_limits:
    - >-
      Toy scale, and the order-statistic framing means a null bounds the effect
      only at the tested sizes and class sizes.
    - >-
      A confirmed null closes the height-based representative search at tested
      scope. It does not close isogeny-based routes generally, and it says
      nothing about the point-group channel closed by IDEA-20260726-006.
    - >-
      No breakthrough claim. Even a small min|j| would only reopen a lift
      attempt, not constitute one.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
