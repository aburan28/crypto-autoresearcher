  lossy_projection_identifiability_audit:
    projection: >-
      (surface, its sections, the census pipeline) --> the eligibility bit elig(S),
      and thence to the four aggregates reported in EV-XEDN-003.
    what_is_discarded: >-
      Everything about a surface except whether it passed six predicates; and, at the
      aggregate level, everything about which predicate rejected the surfaces that
      failed. n_eligible_by_p = {7:10, 13:10, 19:8, 31:2} is reported;
      n_rejected_by_clause is not reported anywhere.
    why_genuinely_lossy: >-
      Severely lossy and deliberately so -- that is what an eligibility filter is for.
      Lossiness is not the defect here.
    why_compatible_with_the_operations: >-
      Compatible in the weak sense that the bit propagates deterministically to the
      aggregates. But the propagation is one-way and destructive: once a surface is
      excluded, no downstream statistic can recover the fact, so the aggregates
      cannot be reweighted after the fact by anyone reading the record.
    is_it_only_a_change_of_coordinates: >-
      NO. The failure checked for is neither of the two canonical ones directly, and
      it is worth naming the third precisely. It is not the (Delta, Pi) =
      (x XOR y, x*y) characteristic-2 failure -- information is genuinely destroyed.
      It is a SHARPENED FORM of the mirror failure: the projection is not constant
      across all inputs, but on the domain the pipeline actually evaluates it on -- the
      eligible surfaces -- one of its components (the mu_3 indicator) IS constant, and
      provably so, because the eligibility condition a != 0 and the mu_3 predicate
      a*x*(omega-1) = 0 are the same condition written twice. The check performed was
      exactly this: solve the mu_3 predicate for its zero set and compare it with the
      eligibility set. They coincide. Zero comparator spread on the goal's headline
      control, established by algebra rather than by a null run.

  assumptions:
    - >-
      That run_census.sage as committed is the code that produced
      RUN-XEDN-004-MAIN. Verified in stage 0 against the run manifest and
      command.txt; if it fails, the gate-two and gate-three findings are withdrawn
      and only the gate-one identity survives, since that one is a property of the
      mathematics rather than of any implementation.
    - >-
      That the census sampler admits only a != 0 surfaces. Stated by the
      specification and by the sampler; to be confirmed by counting a = 0 records in
      the committed JSON, which should be zero.
    - >-
      That "distinct smooth fibres" in the specification means distinct values of t0
      in F_p. If it was intended over an extension field, gate three is void as
      stated -- but the code calls GF(p).random_element(), so the intent question does
      not change what was executed.

  proof_search_map:
    bottleneck: >-
      The predicate whose falsification would have overturned the goal's conclusion.
      For GOAL-XEDN-001 that is "mu_3 is absent AND the coefficient bound still
      holds". If the mu_3 clause is an identity on the eligible set, the conjunction
      reduces to the coefficient clause alone and the goal's distinguishing content
      is gone -- no further census, prime, or degree raise can restore it.
    baseline_embedding:
      parameter_slice: >-
        Set a(t) = 0 and the census becomes EXP-XEDN-003 exactly, where the mu_3
        predicate returns TRUE (orbits on the curve) because a*x*(omega-1) = 0 holds
        identically. That slice reproduces the isotrivial baseline and is the one
        parameter value at which the mu_3 control is informative.
      reproduction_check: >-
        Symbolic and immediate: substitute a = 0 into the identity and confirm the
        predicate flips. Then run mu3_check on one committed a = 0 surface from the
        EXP-XEDN-003 artifacts and confirm on_curve_orbits > 0. If it does not flip,
        the identity derivation is wrong and the proposal fails at stage 1. THIS IS
        THE POSITIVE CONTROL FOR GATE ONE AND IT IS THE WHOLE INSTRUMENT TEST.
    observation_collision:
      observable: mu3_absent_fraction, and the eligibility bit that gates it.
      distinct_preimage_search: >-
        Find two ground-truth objects with the same observable on opposite sides of
        the intended conclusion: (i) a non-isotrivial surface whose section set IS
        stable under a genuine order-3 automorphism of the fibration or under a
        3-isogeny, and (ii) one that is not. Both return mu3_absent_fraction = 1.0
        under the implemented test, because the implemented test only ever asks about
        x -> omega*x on a fixed model. If such a surface (i) exists in the frozen
        degree window, the collision is exhibited and identifiability fails outright.
        If none exists, that itself is the substantive statement the goal needed and
        never made, and it must be proved rather than assumed.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold mu3_absent_fraction fixed at 1.0 and vary the forgotten structure: the
          full automorphism group of the elliptic fibration and the 3-isogeny class
          of the generic fibre. The intrinsic invariant distinguishing the resulting
          objects is that group; the implemented observable is blind to all of it.
        predicted_gain: >-
          A mu_3-absence test that can return false, hence a control that can fail.
          No gain to any attacker.
      - transform: representation_reduction
        proposed_object: >-
          Replace the pass/fail eligibility bit by the vector of per-clause rejection
          counts, so that the census reports the shape of its own censoring. This
          moves the record from an assertion about surfaces to an exact statement
          about which surfaces were seen.
        predicted_gain: >-
          Makes the aggregates reweightable by a later reader; costs one counter per
          clause.
    quantifier_order: >-
      EV-XEDN-003's summary reads "mu_3 orbits on the curve were absent on eligible
      surfaces". With quantifiers: FOR ALL eligible surfaces, THERE IS NO section
      whose x -> omega*x image lies in the slot set. That is true, and it is true
      VACUOUSLY -- the eligibility quantifier already restricts to a != 0, on which
      the inner statement is a theorem. The claim the goal needed is different: FOR
      ALL eligible surfaces, THERE IS NO order-3 structure of ANY kind sustaining the
      coefficient bound. The quantifier over "structure" was silently narrowed to a
      single map on a single model. This is the quantifier-order defect in its
      purest form: the witness (the automorphism) is fixed in advance rather than
      allowed to depend on the surface, which is the opposite of what a
      no-such-structure claim requires.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that the three gates as implemented cannot return their falsifying
        values, so EV-XEDN-003's mu_3 and positive-control lines do not support what
        they are read as supporting. It CANNOT certify that mu_3-like structure is
        present on non-isotrivial surfaces, cannot certify that the coefficient bound
        fails, and must not be written up as either. It also cannot certify anything
        about GOAL-XEDN-002 or GOAL-XEDN-003 without separately reading their
        implementations, which this proposal has not done.
      nearby_object_control: >-
        The nearby object where the hoped-for conclusion FAILS is the a(t) = 0
        isotrivial surface, on which the mu_3 predicate is true rather than false. An
        audit that reports "control vacuous" on BOTH the a != 0 and the a = 0 family
        has misread the identity and must be discarded. Running the a = 0 slice is
        therefore mandatory, not optional -- it is the only way to show the repaired
        instrument can move.
    proof_obligations:
      - claim: "a*x*(omega-1) = 0 in F_p[t] with omega != 1 forces a = 0 or x = 0."
        responsibility: correctness
      - claim: "The census admits only surfaces with a != 0."
        responsibility: interface
      - claim: "mu3_absent_fraction = 1.0 therefore carries no information beyond eligibility."
        responsibility: scope
      - claim: "generic_relation_is_O implies specialisation to O at every good fibre."
        responsibility: correctness
      - claim: "20 distinct smooth fibres do not exist over F_p for p in {7,13,19}."
        responsibility: feasibility
      - claim: "The committed planted control recorded max_abs_coeff null with pass true."
        responsibility: baseline

  predictions:
    - metric: >-
        mu3_on_curve_orbit_count over every eligible surface record in
        RUN-XEDN-004-MAIN and RUN-XEDN-004-CTRL
      direction: lower
      minimum_effect: >-
        FORCED VALUE 0, on every record, derived from the identity before any run.
        Not "small"; exactly zero, necessarily. A single nonzero count refutes the
        identity derivation and the proposal collapses.
    - metric: >-
        mu3_on_curve_orbit_count on the a(t) = 0 positive-control slice
      direction: higher
      minimum_effect: >-
        > 0 on at least one surface with at least one section having x not
        identically zero. FORCED by the same identity read the other way. IF THIS IS
        ZERO THE INSTRUMENT IS BROKEN AND NO CONCLUSION MAY BE DRAWN FROM THE a != 0
        ARM. This is the sensitivity demonstration the committed run lacks.
    - metric: >-
        planted_relation_recovery_rate at planted infinity-norm k = 1, 2, 3, 4
      direction: higher
      minimum_effect: >-
        Pre-registered: 1.00 at k = 1, 1.00 at k = 2 and k = 3 (the alphabet reaches
        3 at support <= 3), and 0.00 at k = 4 (the alphabet stops at 3). The k = 4
        cell is the one that matters: the contract's falsification_criterion is
        "infinity-norm >= 4", so a measured recovery of 0.00 at k = 4 establishes
        that the criterion was unreachable through the primary path. Any nonzero
        k = 4 recovery falsifies that reading.
    - metric: >-
        n_distinct_t0_used per specialisation call, and n_rejected_by_clause per prime
      direction: different
      minimum_effect: >-
        n_distinct_t0 <= p, hence <= 7 at p = 7, against a recorded 20 successes:
        FORCED by counting. n_rejected_by_clause is currently unreported at every
        prime; the prediction is simply that it is nonzero and non-uniform across
        clauses, and its value is the deliverable rather than the test.
    - metric: >-
        max_abs_coeff_by_p recomputed on the population admitted by REPAIRED gates
        (eligibility decoupled from the sampler, generic exactness used instead)
      direction: different
      minimum_effect: >-
        This prediction is deliberately two-sided and CAN FAIL EITHER WAY. If the
        repaired population still returns 1 at every prime, EV-XEDN-003's number
        survives an audit it has not yet had and is STRENGTHENED; that is a genuine
        and reportable outcome. If it returns anything else, the censoring was
        material. No direction is preferred and none is predicted.

  minimal_test:
    design: >-
      Four stages, cheapest first; stage 1 alone can terminate the line. STAGE 0
      (reading, zero compute): open VAL-XEDN-004-01 and RT-XEDN-004 and record which
      of the three gate defects they already contain -- if all three are already
      recorded, STOP and report that, because re-finding a known finding is not a
      deliverable. Also hash-check run_census.sage against the run manifest. STAGE 1
      (algebra, one line, zero compute): the mu_3 identity, plus its a = 0 flip. If
      the identity is wrong the proposal ends here. STAGE 2 (pure Python over
      committed JSON, seconds; this container has numpy 2.4.6 but NO Sage, NO sympy
      and NO gp, verified this session): tabulate mu3 orbit counts, planted-control
      fields, specialisation successes versus p, and per-clause rejection counts.
      STAGE 3 (re-run with repaired gates; NEEDS SAGE, therefore an INFRASTRUCTURE
      REQUEST under AGENTS.md rule 5 and not an experiment until granted): planted
      relations at k = 1..4, eligibility decoupled from the sampler, a = 0 positive
      slice, per-clause rejection accounting.
    controls:
      - >-
        POSITIVE CONTROL / NEARBY OBJECT (the effect MUST appear). The a(t) = 0
        isotrivial slice, on which the mu_3 predicate must return orbits ON the
        curve. Threshold declared before the run: at least one on-curve orbit on at
        least one a = 0 surface carrying a section with x not identically zero. IF
        THE REPAIRED mu_3 TEST DOES NOT FIRE HERE, NOTHING NEGATIVE MAY BE REPORTED
        FROM THE a != 0 ARM AT ALL.
      - >-
        NULL OBJECT OF THE SAME SHAPE (CAN FAIL). A synthetic surface list in which
        a != 0 but the sections are drawn at random from the curve rather than
        enumerated by the frozen predicate, run through the identical gate stack.
        FORCED VALUES DERIVED BEFORE THE RUN: mu3 orbit count 0 (by the identity),
        planted-control pass true (the predicate n_slots >= 2 does not inspect the
        sections), specialisation pass rate equal to the a != 0 arm's. If any of
        those three differs, a gate is doing more than this audit credits it with and
        the reading narrows.
      - >-
        GRADED CONTROL, 4 interior points, monotonicity reported. Plant relations of
        infinity-norm k = 1, 2, 3, 4 and report recovery rate as a function of k.
        PREDICTED SHAPE, stated before the run: 1, 1, 1, 0 -- a step at exactly the
        alphabet bound. A smooth decay instead of a step means the alphabet is not
        the binding constraint and the reading is wrong; a flat 1 across all four
        means the code read is wrong. This localises the obstruction to a specific
        line rather than leaving "the control was weak".
      - >-
        ORDERING CONTROL. The forced values above are written into the run directory
        before any repaired arm executes, and the a = 0 positive slice is evaluated
        and committed before the a != 0 arm is looked at.
      - >-
        ARCHIVE CHECK. All prior XEDN runs are listed and their control blocks
        tabulated: EXP-XEDN-002 through EXP-XEDN-007. Whether their planted controls
        share the n_slots >= 2 predicate is NOT ASSERTED here -- only EXP-XEDN-004 was
        read -- and determining it is part of stage 2 rather than a claim of this
        record.
    required_metrics:
      - the mu_3 identity written out, with the a = 0 flip demonstrated on a committed surface
      - mu3 on-curve orbit counts per surface, both arms, with artifact paths
      - planted-relation recovery rate as a function of planted infinity-norm k
      - distinct-t0 count per specialisation call against p
      - per-clause rejection counts per prime, currently unreported anywhere
      - max_abs_coeff_by_p on the repaired population, beside the original

  falsification_conditions:
    - >-
      Any eligible a != 0 surface in the committed runs with a nonzero mu_3 on-curve
      orbit count. The identity is then wrong and the headline of this proposal is
      withdrawn.
    - >-
      The a = 0 positive slice failing to produce an on-curve orbit. The instrument
      is then broken and no part of this audit may be reported as negative.
    - >-
      A measured nonzero recovery of a planted infinity-norm-4 relation through the
      primary path. The alphabet-bound reading is then wrong.
    - >-
      VAL-XEDN-004-01 or RT-XEDN-004 already recording all three gate defects. The
      proposal is then a duplicate and must be withdrawn with that citation, not
      published.
    - >-
      run_census.sage failing its hash check against the run manifest, voiding gates
      two and three as statements about the executed code.

  confounders:
    - >-
      THE VALIDATION AND RED-TEAM REPORTS WERE NOT READ. EV-XEDN-003 records
      validation_verdict valid_with_findings and red_team_verdict
      conclusion_requires_narrowing, so findings of some kind exist and this
      proposal does not know what they are. This is the single largest risk to the
      record's novelty and stage 0 exists solely to remove it.
    - >-
      HINDSIGHT ON A CLOSED GOAL. Auditing a completed campaign is cheap and reads as
      rigour. The two-sided fifth prediction and the mandatory positive control are
      there so that a negative outcome for the audit costs something to reach.
    - >-
      GATE THREE MAY BE HARMLESS. Redundant verification is a common and defensible
      engineering choice, and the censoring it induces may be negligible. The audit
      must report the measured censoring magnitude and not argue from the defect's
      existence to its importance.
    - >-
      SCOPE CREEP ACROSS SIBLINGS. GOAL-XEDN-002 and GOAL-XEDN-003 reuse this lane's
      apparatus, but their implementations were NOT read here. No statement in this
      record extends to EXP-XEDN-005, -006 or -007, and none may be written as if it
      did.

  interpretation_limits:
    - >-
      A confirming outcome narrows what EV-XEDN-003's mu_3 and control lines support.
      It does not withdraw the coefficient measurement, does not show the bound
      fails, does not close the coefficient question, and does not touch the standing
      forbidden sentences of DEC-20260724-021 -- in particular nothing here licenses
      "the multi-section or Mordell-Weil relation-source route is closed".
    - >-
      NO STATUS CHANGE to GOAL-XEDN-001, EV-XEDN-003, DEC-20260725-001 or KN-FIND-004
      is proposed or implied; corrections supersede and never overwrite (AGENTS.md
      rule 4), and only the Coordinator may transition a record (rule 1).
    - >-
      Toy scale, p in {7,13,19,31}. No attack claim, no crypto-scale claim, no
      exponent.

  heuristic_assumptions:
    - id: HEUR-9A-1
      statement: >-
        NONE LOAD-BEARING. Every headline is an identity or a counting fact:
        a*x*(omega-1) = 0 forces a = 0 or x = 0 in the integral domain F_p[t];
        |F_p| = p < 20 for p in {7,13,19}; a relation equal to O in E(F_p(t))
        specialises to O at every good fibre. None is distributional, none is
        asymptotic, and none needs a random model. This entry exists to record that
        the proposal is unconditional where the campaign it audits was empirical.
      rigorous_support: >-
        Integral-domain cancellation; the pigeonhole principle; functoriality of
        specialisation at a good reduction, which is standard and is re-derived in
        stage 1 rather than cited.
      validation_plan: >-
        Exhaustive verification over the committed surface records -- a complete
        check of a finite set, not a sample. The a = 0 flip is verified on committed
        EXP-XEDN-003 artifacts.

  target_complexity:
    time_exponent: >-
      n/a. THIS PROPOSAL MOVES NO EXPONENT AND SAYS SO PLAINLY. It is a control
      audit on a toy-scale census. Its value is that it decides whether a closed
      goal's headline control ever tested anything, at a cost of one line of algebra
      plus seconds of pure Python, and that it repairs the instrument for whoever
      asks the coefficient question next.
    memory_exponent: n/a; the audit reads two committed JSON files.
    best_known: >-
      For ECDLP over F_p the incumbent is generic square-root, about 0.886 sqrt(p)
      group operations at negligible memory. This proposal is not on that frontier
      and does not approach it.
    hidden_overhead: >-
      None in the audit. The one real cost is that stage 3 needs Sage, which this
      container lacks; that is declared an infrastructure request rather than
      silently budgeted.
    tradeoff_note: n/a.

  dominated_by: >-
    n/a (no result claimed; no algorithm, no attack, no complexity statement). Rows
    checked before setting this: the six XEDN experiment contracts, both committed
    EXP-XEDN-004 run directories, the five XEDN evidence records, the three XEDN goal
    records, RQ-XEDN-002, and the ANGLE-BRIEF's F1 table plus sections 2 (T-B, T-C)
    and 5.2. None records the mu_3 identity, the planted-control null field, or the
    distinct-fibre impossibility. Cost axes considered: time (seconds for the
    decisive stages), memory (megabytes), data/queries (consumes only committed
    artifacts, generates no new instances). NOT CHECKED, and this is the honest gap:
    VAL-XEDN-004-01 and RT-XEDN-004 were not opened, and either could already contain
    one or more of these findings -- which is why stage 0 is reading them and why
    this field says "not checked" rather than "null". An unchecked null would be a
    fabrication under AGENTS.md rule 5.
  sota_delta: >-
    No attack, no exponent; measurement contribution only. Quantitatively: the
    audit replaces three predicates whose falsifying value is unreachable with three
    that can return either value, and it prices the substitution at roughly one CPU
    second for stages 1-2 against the 2 CPU-hours budgeted for EXP-XEDN-004. The
    concrete numeric delta against the standing record: EV-XEDN-003 reports
    mu3_absent_fraction_by_p = {7:1.0, 13:1.0, 19:1.0, 31:1.0} as measured evidence
    of mechanism removal; this proposal derives the same four numbers from the
    eligibility condition alone, with no surface, no section, and no run.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.85 that the mu_3 identity holds and the reported fraction is shown to be forced
    -- the derivation is three lines of polynomial algebra in an integral domain and
    the eligibility condition is stated in the contract's own text. It is not higher
    because VAL-XEDN-004-01 and RT-XEDN-004 were not read and one of them may already
    say this, in which case the finding is real but not new, and because the identity
    presumes the census never admits a section with x identically zero, which was
    not verified. It is not lower because the two facts it composes were each read
    directly from committed files at named line numbers rather than recalled.
    Separately: 0.90 that the planted-control gap is confirmed, since the null field
    and the true pass predicate were both read from the artifact; 0.95 that the
    distinct-fibre impossibility is confirmed, since it is 20 > 7; and only 0.30 that
    repairing the gates changes any reported aggregate, because the coefficient
    metric is plausibly forced for the independent reason set out in
    IDEA-20260805-bd61c3 -- in which case the repaired census returns 1 again and
    EV-XEDN-003's number survives with a better warrant than it now has.
