idea:
  id: IDEA-20260805-9a2b09
  question_id: RQ-XEDN-002
  added: '2026-08-05'
  title: >-
    The mu_3-absence control is the identity a(omega-1)x = 0: an eligibility-gate
    audit showing that all three population-defining controls of the XEDN census
    return their passing value by construction
  class: control

  claim: >-
    GOAL-XEDN-001 exists to test whether a coefficient bound survives the REMOVAL of
    the mu_3 automorphism, and EV-XEDN-003 reports mu3_absent_fraction_by_p =
    {7: 1.0, 13: 1.0, 19: 1.0, 31: 1.0} as the evidence that the removal succeeded.
    That fraction is FORCED to 1.0 by one line of algebra and is not a measurement.
    On y^2 = x^3 + a(t)x + b(t) with a point (x, y), the image (omega*x, y) under the
    order-3 map lies on the same curve iff omega^3 x^3 + a*omega*x + b = x^3 + a*x + b,
    i.e. iff a*x*(omega - 1) = 0; since omega != 1 in F_p this forces a = 0 or x = 0.
    But a != 0 is the census's own ELIGIBILITY CONDITION. Therefore every eligible
    surface has mu3 orbits off the curve, at every prime, for every section with
    x(t) not identically zero, necessarily and without computation. The control the
    goal is named after cannot fail. Two further gates fail the same way, and
    together the three of them define the population every XEDN number is computed
    over. GATE TWO: the planted positive control at run_census.sage line 606
    constructs a surface with two sections and passes on the single predicate
    rec["n_slots"] >= 2; the committed run records it as {"max_abs_coeff": null,
    "specialisation": null, "pass": true} -- it planted no relation, recovered no
    coefficient, and passed while measuring nothing, against a specification that
    demanded "a known short relation among constructed sections must be recovered
    with correct coefficients". GATE THREE: the specification requires relations
    "verified by specialisation to O at >= 20 distinct smooth fibres", but
    specialise_relation (line 255) draws t0 = GF(p).random_element() WITH REPLACEMENT
    and passes on ok >= 20; over F_7 there are seven possible fibres, so twenty
    DISTINCT smooth fibres do not exist at p = 7, 13 or 19 and the recorded twenty
    successes are necessarily repeats. That gate is also redundant for correctness --
    line 423 already checks generic_relation_is_O exactly in E(F_p(t)), which implies
    the relation at every good fibre -- so its only live function is line 435, where
    it decides ELIGIBILITY, i.e. which surfaces enter the population at all. This
    proposal asks what the census would have found had the three gates been able to
    fail, and it costs almost nothing to answer.

  object_first_candidate:
    tracked_object: >-
      THE ELIGIBILITY INDICATOR: the boolean-valued function elig(S) on surfaces that
      decides admission to the census, followed backwards from the reported
      aggregates to the predicates that compute it (a != 0, j non-constant, nonzero
      discriminant, height control, n_slots >= 2, specialisation pass). The tracked
      quantity is not any arithmetic invariant of a surface -- it is which surfaces
      the apparatus lets through, and how that selection correlates with the quantity
      being reported. Every aggregate in EV-XEDN-003 (max_abs_coeff_by_p,
      slope_vs_log_p, mu3_absent_fraction_by_p, n_eligible_by_p) is an average over
      the pre-image of elig = true, and no XEDN record characterises that pre-image.
    established_families_off_limits: >-
      Off-limits as the primary lens: (i) the algebraic-geometry lens entirely --
      Shioda height theory, Mordell-Weil lattices, root systems, Kodaira fibre types.
      That lens is the subject of IDEA-20260805-bd61c3 and reusing it here would make
      this proposal a variant of that one rather than an independent check;
      (ii) xedni and lifting as attack families; (iii) index calculus; (iv) the
      isotrivial / non-isotrivial dichotomy as an explanatory variable. The lens used
      instead is measurement audit: treat the census as an instrument with a
      specified transfer function and ask, for each predicate, what input would make
      it return its other value.
    newness_score: >-
      The individual observations are each a few minutes of reading and none requires
      new mathematics. What is new to this corpus is applying the audit to a goal
      that is already CLOSED: the ANGLE-BRIEF measures 188 of 229 evidence records
      (82%) carrying no positive control and 166 of 229 (72%) carrying no null, and
      it names the pattern -- a control that passes without being able to fail -- but
      no record applies it to the XEDN lane, where the control in question is the one
      the goal is titled after.
    testability_score: >-
      Very high and almost free. The mu_3 identity is a single line of polynomial
      algebra. The planted-control gap is a field lookup in a committed JSON file,
      already performed and reported below. The distinct-fibre impossibility is the
      inequality 20 > p for p in {7, 13, 19}. The only stage needing compute is the
      re-run with repaired gates, and its decisive part is pure Python.
    survival_score: >-
      The eligibility indicator survives to the very end -- it is the last thing
      applied before the aggregates are formed and the first thing forgotten when
      they are reported. It stops being trivial as soon as any gate is given a
      falsifying input, which is exactly what the paired experiment supplies.

  mechanism: >-
    DERIVED HERE, from files read in this session. Line numbers refer to
    experiments/EXP-XEDN-004/implementation/run_census.sage as committed.

    GATE ONE -- THE mu_3 CONTROL IS AN IDENTITY, NOT A MEASUREMENT.
    Let omega in F_p satisfy omega^3 = 1, omega != 1; this requires p = 1 mod 3, and
    mu3_check line 288 returns applicable: false otherwise. All four census primes
    satisfy it: 7 = 3*2+1, 13 = 3*4+1, 19 = 3*6+1, 31 = 3*10+1. Let S = (x(t), y(t))
    be a section of y^2 = x^3 + a(t)x + b(t). The map used at line 309 sends S to
    Q1 = (omega*x, y). Then
      Q1 on the curve  <=>  y^2 = (omega x)^3 + a (omega x) + b
                        <=>  y^2 = x^3 + a omega x + b   (since omega^3 = 1)
    and subtracting the defining equation y^2 = x^3 + a x + b gives
      0 = a x (omega - 1)   in F_p[t].
    F_p[t] is an integral domain and omega - 1 != 0, so Q1 is on the curve if and only
    if a(t) = 0 or x(t) = 0 identically. The census admits a surface only when a != 0
    (specification eligibility clause 1, code line 290 and the sampler). Hence for
    every eligible surface and every section with x not identically zero,
    E(w*x, y) at line 309 raises and line 313 continues, on_curve_orbits stays 0,
    and mu3_absent_as_expected is true. THE REPORTED FRACTION 1.0 AT ALL FOUR PRIMES
    IS A RESTATEMENT OF THE ELIGIBILITY CONDITION a != 0. It carries no information
    about whether the mu_3 MECHANISM of KN-FIND-003 was the thing sustaining the
    coefficient bound; it only records that the census excluded a = 0, which the
    census announces in its title.
    WHAT THIS DOES NOT SAY: it does not say the mu_3 explanation of EXP-XEDN-003 was
    wrong, and it does not say a != 0 surfaces have no order-3 structure. It says the
    IMPLEMENTED test is vacuous. A non-vacuous test exists and is cheap: an order-3
    automorphism of a NON-isotrivial surface, if any, does not act as x -> omega x on
    a fixed Weierstrass model, so the real question is whether the section set is
    stable under ANY order-3 element of the automorphism group of the fibration, or
    under a 3-isogeny, and that is a computation with two possible answers.

    GATE TWO -- THE POSITIVE CONTROL MEASURED NOTHING AND PASSED.
    planted_control (line 606) searches for a pair (x1, y1), (x2, y2) that both lie on
    a common surface with deg a <= 2, deg b = 6 and non-constant j, calls
    analyze_surface, and returns pass on the predicate at line 635:
      rec["n_slots"] >= 2 and rec.get("j_nonconstant").
    It plants two SECTIONS. It does not plant a RELATION, does not fix a target
    infinity-norm, and never compares a recovered coefficient vector against a known
    one. The committed record
    runs/RUN-XEDN-004-MAIN/raw-result.json controls.planted reads
      {"a": [6,0,2], "b": [5,5,3,1,0,0,3], "n_slots": 2, "max_abs_coeff": null,
       "specialisation": null, "j_nonconstant": true, "pass": true}
    -- max_abs_coeff is null and pass is true simultaneously. The instrument's
    sensitivity to the quantity it reports was therefore never demonstrated, and by
    docs/inventor-protocol.md section 3 and the generation contract's positive-control
    obligation, no negative result about coefficient growth is entitled to be read
    off this run. The specification asked for exactly the missing thing, in its own
    words: "Planted / synthetic relation control: a known short relation among
    constructed sections must be recovered with correct coefficients."

    GATE THREE -- THE ELIGIBILITY FILTER IS A DEGENERATE SAMPLER OVER A SET TOO SMALL.
    The specification's relation_verification field reads "specialisation to O at
    >= 20 distinct smooth fibres". specialise_relation (line 255) implements
      while tried < trials*4 and ok < trials:  t0 = GF(p).random_element()
      ... return {..., "pass": ok >= trials}   with trials = 20.
    t0 is drawn uniformly from F_p WITH REPLACEMENT. |F_p| = 7, 13, 19 at three of the
    four census primes, and smooth fibres are a subset of that, so twenty DISTINCT
    smooth fibres do not exist and cannot have been used; the twenty recorded
    successes are draws with repetition from at most p values. Two consequences, in
    opposite directions, and both must be reported. (i) FOR CORRECTNESS THE GATE IS
    REDUNDANT: line 423 sets generic_relation_is_O by evaluating the relation in
    E(F_p(t)) exactly, and a relation that is O generically specialises to O at every
    good fibre, so the twenty checks add nothing a single exact check has not already
    given. The gate is therefore not protecting the primary metric. (ii) FOR
    POPULATION DEFINITION THE GATE IS LOAD-BEARING: line 431-437 makes
    eligible_gram depend on rec["specialisation"]["pass"], so a surface whose
    relation is genuine but whose sampler happened to hit a bad fibre often enough is
    dropped from the census, while line 439 admits surfaces with NO relation at all
    under skip_reason "no_relation_in_observed_span". The population is thus
    censored by a random process, on the same variable the study reports, with no
    record of how many surfaces were dropped by which clause.

    WHY THE THREE COMPOSE INTO ONE FINDING. Each gate individually is a small defect.
    Together they mean that the census's population is defined by predicates that
    return their passing value by construction (gate one), its instrument's
    sensitivity was never demonstrated (gate two), and its inclusion rule is a noisy
    filter on the reported variable (gate three). The aggregate reported in
    EV-XEDN-003 -- max_|coeff| = 1 at 4 of 4 primes, slope 0.0, jackknife CI
    [0.0, 0.0] -- is computed over that population. The repair is cheap and each
    piece is independently decisive, which is why the paired contract orders them
    cheapest-first with the algebra gate able to terminate the line on its own.

  novelty_status: unverified

