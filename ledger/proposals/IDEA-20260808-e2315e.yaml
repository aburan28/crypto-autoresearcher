idea:
  id: IDEA-20260808-e2315e
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  title: 'Superpolynomial-dimension small-root solving: treat the Coppersmith shift-lattice
    dimension as a cost-bearing exponent D = N^delta and ask whether the reachable-box exponent
    eps(delta) grows fast enough to pay for itself.'
  class: algorithm
  claim: "Every published Coppersmith-type analysis takes the shift lattice dimension to infinity\
    \ at polynomial cost and reports the asymptotic reach eps(infinity) as THE bound. That\
    \ is a convention, not a theorem: nothing forbids lattices of dimension D = N^{delta}\
    \ with delta > 0, whose reduction costs N^{delta*omega'} for the reduction exponent omega'\
    \ of the chosen algorithm. Define eps(delta) as the reach achievable at dimension N^{delta}.\
    \ The claim is (i) eps(delta) is well defined, non-decreasing, and MEASURABLE at toy scale;\
    \ and (ii) for the windowed-decomposition system of E1-01 at arity m, the family beats\
    \ Pollard rho iff there exists delta with\n  1 - eps(delta)*(m-1)/m + delta*omega' < 1/2\
    \   and   2*eps(delta)/m < 1/2,\ni.e. iff the marginal reach gain d(eps)/d(delta) exceeds\
    \ omega'*m/(m-1) somewhere. This is a two-sided question with a cheap empirical answer,\
    \ and it is the only lever in the windowed family that does not require a new mathematical\
    \ ingredient."
  mechanism: 'Howgrave-Graham''s lemma is unconditional at every dimension: a short enough
    vector in the shift lattice yields an identity over Z. The asymptotic bound arises from
    optimising the shift set subject to keeping the dimension polylogarithmic; relaxing that
    constraint enlarges the admissible shift set (higher powers of the modulus, higher-degree
    multiples, more auxiliary variables), which strictly enlarges the lattice and can only
    weakly increase the reach. The question is quantitative: reach grows, cost grows, and
    the derivative decides. For a univariate degree-d polynomial the reach saturates at 1/d
    exactly, so the derivative is zero and the answer is no; for multivariate systems the
    saturation behaviour is not established, which is where the uncertainty lives.'
  why_not_a_renamed_known_approach: 'Not "run LLL with more shifts": that is the standard
    polynomial-dimension regime and is already inside eps(infinity) as conventionally computed.
    The novelty is treating the dimension as an exponent in N and charging it, which converts
    an implementation choice into a point on the time-reach frontier. KN-TECH-015 records
    the cost model O~(D^6 * bits^3) but never varies D beyond polylog. Distinct from E1-01,
    which fixes D = polylog and asks about eps at that dimension.'
  predictions:
  - observable: reach as a function of shift dimension for a fixed toy system
    metric: eps-hat(D) measured by planted-root recovery at fixed p, D swept over 2 decades
    predicted: eps-hat(D) saturates, with the increment per doubling of D falling below 0.01
      by D ~ 10^3; if instead it is still rising linearly in log D at the largest feasible
      D, the family is alive and must be pushed
  - observable: univariate control
    metric: eps-hat(D) for x^d - a mod p with planted small root
    predicted: saturation exactly at 1/d, confirming the instrument
  - observable: break-even derivative
    metric: d(eps)/d(delta) estimated from the fitted curve vs the threshold omega'*m/(m-1)
    predicted: below threshold at every measured point (omega' >= 2 for any practical reduction
      algorithm, so the threshold is >= 2.5 at m = 5)
  minimal_test: 'One frozen sweep: fixed toy p ~ 2^24, fixed system (S_4 with a planted windowed
    3-decomposition), shift dimension D in {20, 40, 80, 160, 320}, measure the largest B^m/p
    at which the planted root is recovered. Fit eps-hat(log D). Same sweep on the univariate
    control and on a random-polytope null. This is a few CPU-hours.'
  controls:
  - Univariate positive control with known saturation 1/d (instrument validity).
  - 'Random-polynomial null with identical Newton polytope: reach must match, else the measurement
    is picking up curve structure that should not be there (and that would itself be reportable).'
  - 'Scrambled-window null: a random size-B subset must NOT be recoverable at any D.'
  confounders:
  - LLL vs BKZ vs fplll defaults change omega' and the achieved reach; the reduction algorithm
    and block size must be pinned in the contract or the curve is uninterpretable.
  - 'Numerical precision: large-dimension shift lattices with huge entries can fail for precision
    rather than for mathematical reasons; failures must be classified.'
  - Root extraction (algebraic independence) can fail inside the bound; separate the two failure
    modes or eps-hat under-reports.
  falsification_conditions:
  - eps-hat(D) saturates with marginal gain below omega'*m/(m-1) at every measured D => the
    dimension lever is closed and E1-01 must live or die on eps(infinity) alone.
  - eps-hat(D) grows without saturation over two decades of D => a genuinely new time-reach
    tradeoff exists and the E1-01 threshold table must be recomputed against it.
  interpretation_limits: 'Toy-scale saturation behaviour is toy: it calibrates the shape of
    eps(D), it does not establish the crypto-scale reach. A negative here closes the lever
    only for the tested system shape and reduction algorithm.'
  assumptions:
  - Howgrave-Graham lemma; shift lattices as in KN-TECH-015.
  - Reduction cost N^{delta*omega'} with omega' >= 2 pinned in the contract.
  heuristic_assumptions:
  - id: HA-1
    statement: For the systems considered, eps(D) is concave and saturating in log D, so a
      two-decade sweep determines its asymptote to within 0.02.
    rigorous_ingredient: 'Monotonicity is rigorous: enlarging the shift set can only enlarge
      the set of recoverable roots. Only concavity and the saturation rate are assumed.'
    distribution_imitated: The univariate Coppersmith convergence, where dimension O(d/eps)
      suffices and the curve is concave and saturating.
    validation_route: Measure eps-hat(D) on the univariate control where the asymptote 1/d
      is known exactly, and check that a two-decade fit recovers it to within 0.02. Label
      toy.
    tail_checks: If the fitted asymptote on the control misses 1/d by more than 0.02, the
      fitting procedure is invalid and no multivariate conclusion may be drawn from it.
  target_complexity:
    time_exponent: "Conditional: >-\n  total N^{1 - eps(delta)(m-1)/m + delta*omega'}. At\
      \ delta = 0 this reduces\nto E1-01. The lever is worth an exponent only where d(eps)/d(delta)\
      \ > omega'*m/(m-1)."
    memory_exponent: max(N^{beta}, N^{delta}) — the lattice itself becomes a memory object
      at delta > beta, which is a new memory term E1-01 does not carry and must be charged.
    best_known_baseline: '"rho/vOW N^{1/2}, memory O(1)."'
    hidden_overhead_disclosure: omega' hides the entire practical cost of lattice reduction,
      including precision growth; the D^6 in KN-TECH-015 is a large polynomial and dominates
      concretely long before it matters asymptotically.
    time_memory_tradeoff: delta is simultaneously a time and a memory exponent for the lattice,
      so this lever moves the family from memory-light toward memory-heavy and must be compared
      against vOW at matched memory rather than against plain rho.
  sota_delta: Zero unless the derivative test passes. If it passes, it directly relaxes the
    E1-01 threshold from eps(infinity) > m/(2(m-1)) to a weaker condition, which is the difference
    between a closed and an open family.
  dominated_by: 'Pollard rho / vOW at N^{1/2}, memory O(1), dominates every currently derivable
    instance. Frontier rows checked: rho/vOW, BSGS, Kuhn-Struik multi-target sqrt(TN), preprocessing
    frontier S T^2 = N, special-curve attacks (out of scope for generic prime-field curves).'
  estimated_cost: '"Implementation medium (shift-lattice generator, fplll/flint); compute
    low (CPU-hours)."'
  recommended_priority: medium
  honest_prior_of_survival: ~0.10 that the derivative test passes anywhere. ~0.7 that the
    sweep produces a usable eps(D) curve that E1-01 needs regardless of the outcome, which
    is why it is worth doing once and only once.
  novelty_status: unverified
  novelty_screen: 'Grepped the dedup corpus for "Coppersmith|small root|Jochemsz|LLL": only
    KN-TECH-015, KN-TECH-020 and IDEA-20260807-0f49b6. No record varies lattice dimension
    as an exponent. Marked unverified because the external lattice literature could not be
    checked this session (WebSearch/WebFetch backend error); superpolynomial-dimension Coppersmith
    may have been considered elsewhere.'
  discriminated_from: E1-01 (fixes D = polylog and asks about eps); KN-TECH-015 (records the
    cost model but never varies D as an exponent); KN-TECH-020 / KN-TECH-042 (lattice reduction
    and enumeration cost models, not small-root reach).
  source_refs:
  - KN-TECH-015, KN-TECH-020 (in-repo)
  - '"UNVERIFIED external: Howgrave-Graham 1997; Jochemsz-May 2006. Cited from memory."'
  proof_search_map:
    bottleneck: '"The reachable-box exponent eps, and whether it is a hard limit or a cost-bearing
      parameter."'
    baseline_embedding:
      parameter_slice: '"delta = 0 reproduces standard Coppersmith exactly."'
      reproduction_check: '"Univariate control must reproduce reach 1/d at delta = 0."'
    observation_collision:
      observable: '"eps-hat(D)."'
      distinct_preimage_search: Two systems with different polytopes but identical eps-hat(D)
        would show the curve is not polytope-determined; sweep at least three distinct polytopes.
    constructive_transforms:
    - transform: boundary_lift
      proposed_object: '"Shift sets with modulus powers and auxiliary variables beyond the
        polylog regime."'
      predicted_gain: '"Unknown; the derivative is the deliverable."'
    quantifier_order: EXISTS delta > 0 and EXISTS m such that eps(delta)*(m-1)/m - delta*omega'
      > 1/2, FOR ALL sufficiently large p. The negation, established empirically for the tested
      shapes, is a scoped closure of the dimension lever.
    method_ceiling:
      strongest_certifiable_claim: '"An empirical time-reach frontier for one system family
        at toy scale."'
      nearby_object_control: "The univariate case, where the ceiling 1/d is proved and the\
        \ derivative is exactly zero: >-\n  any method that appears to beat it there is measuring\
        \ an artifact."
    proof_obligations:
    - claim: '"eps(D) is non-decreasing"'
      responsibility: correctness
    - claim: '"reduction cost is N^{delta*omega''} with omega'' pinned"'
      responsibility: runtime
    - claim: '"lattice memory N^{delta} is charged"'
      responsibility: memory
