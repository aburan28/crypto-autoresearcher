idea:
  id: IDEA-20260812-104e1a
  question_id: RQ-ECDLP-002
  added: '2026-08-12'
  proposed_by: idea-generator
  status: proposed
  class: representation

  title: >-
    The isogeny class DOES supply rank-2 rational N-torsion, so the blocker on
    the Kani / Robert higher-dimensional toolbox for ordinary prime-field ECDLP
    is not torsion RATIONALITY. Enumerate the Frobenius-stable maximal isotropic
    subgroups of the direct sum of E prime [N] over class members and decide
    which of three blockers is operative.

  object: >-
    TRACKED OBJECT. The Z/N-module M(S) = direct sum over E prime in S of
    E prime [N], for S a finite subset of the F_p-isogeny class, carried with
    (i) the product Weil pairing, (ii) the Frobenius operator, and (iii) the
    Z/N-linear maps induced by the class's isogenies. Nothing else is retained -
    not the j-invariants, not the curve equations, not the field arithmetic. The
    established families declared OFF-LIMITS as the primary lens for this record,
    because the corpus reports the target as heavily mined - isogeny transfer to
    a weak destination (EV-ECDLP-b3e847, closed), the graph spectrum
    (IDEA-20260806-bcbcf5, wrong null), the isogeny-graph query model
    (IDEA-20260806-d5a34e), Semaev heavy-tail screens (IDEA-20260731-016),
    minimum-height representatives (IDEA-20260726-009). Candidate objects
    enumerated and scored on (new / one-step propagation definable and
    measurable / survival depth) - the single curve's N-torsion module (known,
    this is IDEA-20260808-bba3dc's object / testable / dissolves as soon as one
    asks about a kernel spanning two curves); the kernel polynomial of a
    candidate isogeny (repackaging / testable / one step); the DIRECT SUM module
    over several class members with its pairing and Frobenius (new here /
    testable, its one-step propagation is an explicit matrix action /
    survives arbitrarily many curves, since adding a curve adds a rank-2 block);
    the Galois cohomology class of the pair (speculative / propagation not
    definable within budget / not scored). The direct-sum module is the lens.
    KN-OPEN-019 records that this programme has no written object-enumeration for
    the ECDLP, so the above is a sketch, not a taxonomy.

  lossy_projection_test: >-
    The projection (a tuple of curves in one class, with their N-torsion) -> the
    Z/N-module M(S) with its pairing and Frobenius is genuinely lossy - it
    discards the curve equations entirely and keeps a rank-2|S| free module over
    Z/N with an alternating form and one operator. What it discards is discarded
    COMPATIBLY with the operations the target performs - an F_p-isogeny between
    class members induces a Z/N-linear map on the module that commutes with
    Frobenius and multiplies the pairing by its degree, and a quotient by a
    maximal isotropic subgroup is an operation defined entirely inside the
    module. The retained part therefore propagates deterministically under
    exactly the operations any Kani-style construction performs. It is not a
    change of coordinates - one cannot recover a j-invariant from M(S).

  claim: >-
    Let E/F_p be ordinary with prime N = #E(F_p) and p not congruent to 1 mod N,
    and let S be a set of curves in its F_p-isogeny class. This record makes
    three statements, B1-B3, of which B1 and B2 are decided by LINEAR ALGEBRA
    MOD N alone and B3 is a cost statement.

    (B1) THE RATIONALITY BLOCKER IS NOT THE OPERATIVE ONE, AS STATED. Frobenius
    acts on E prime [N] with eigenvalues 1 and p mod N, distinct by hypothesis.
    The eigenvalue-1 eigenspace of E prime [N] is exactly E prime (F_p)[N], a
    line of F_p-RATIONAL points. Hence W_1(S), the direct sum of those lines
    over S, is a free rank-|S| Z/N-module of RATIONAL points, and it is ISOTROPIC
    for the product Weil pairing because the pairing of two points in one cyclic
    group is trivial and distinct factors of a product polarisation pair
    trivially. So M(S) contains a maximal isotropic subgroup of order N^{|S|}
    all of whose points are individually rational, and it contains further
    Frobenius-STABLE maximal isotropic subgroups whose quotients are therefore
    defined over F_p even though their points are not rational. This is a
    REFINEMENT of, and a partial challenge to, IDEA-20260808-bba3dc, which
    locates the blocker in the extension degree ord(pi mod M) needed for an
    M-torsion BASIS - kernel SPECIFICATION over F_p does not require a rational
    basis, only Galois stability, and Galois-stable kernels are abundant here.

    (B2) THE OPERATIVE BLOCKER, STATED AS A CHECKABLE CLASSIFICATION. Because
    Frobenius acts semisimply with two distinct eigenvalues, every
    Frobenius-stable subgroup of M(S) splits as L_1 + L_p with L_1 inside the
    eigenvalue-1 space and L_p inside the eigenvalue-p space. The claim is that
    every Frobenius-stable maximal isotropic subgroup of M(S) that is COMPUTABLE
    FROM PUBLIC DATA (the curves, the isogenies between them, and the instance
    points P and Q) is either (i) a split subgroup, whose quotient is a product
    of elliptic curves and carries no information beyond the individual
    N-isogenies, or (ii) the graph of a scalar which is a known function of the
    ECDLP answer k, so that writing it down requires already knowing k. There is
    predicted to be NO third type. If a third type exists - a Frobenius-stable
    maximal isotropic subgroup, independent of k, whose quotient does not split
    as a product - the higher-dimensional toolbox acquires an entry point for
    ordinary prime-field ECDLP that this programme has never recorded, and the
    direction reopens.

    (B3) THE COST BLOCKER, INDEPENDENT OF B2. Even granting a useful kernel, the
    quotient is an (N,N)-isogeny with N PRIME of size about p. Every known
    algorithm for computing such an isogeny (Richelot / theta chains) is
    polynomial in the LEVEL, not in its logarithm, and requires the level to be
    smooth; for prime N of size p the cost is Omega(p), which exceeds Pollard
    rho's p^{1/2} outright. So even the falsification of B2 would not by itself
    yield an attack, and any record claiming one must supply a smooth-level
    route.

    DISCRIMINATION. The three outcomes are distinguishable by the same
    enumeration - B1 false (no rational isotropic subgroup of the claimed rank)
    indicts the implementation or the eigenvalue hypothesis; B1 true and B2 true
    means the blocker is "every usable kernel is the graph of the answer", which
    is a DIFFERENT blocker from the one currently recorded and names a different
    escape (find a kernel construction that does not require the graph, e.g. from
    an auxiliary curve outside the class); B1 true and B2 false means an
    unexplored entry point exists and B3 becomes the binding question.

  mechanism: >-
    The 2022-2026 higher-dimensional toolbox works because a maximal isotropic
    subgroup of a product of torsion groups defines an isogeny of principally
    polarised abelian varieties, and Kani's lemma says that when the subgroup is
    the graph of an unknown isogeny the quotient reveals it. Applying that to the
    ECDLP means treating multiplication by the unknown k as the map to be
    recovered. The natural kernels are graphs of k, which is circular. The
    question this record makes precise is whether the isogeny class - which
    supplies h(O) curves, each contributing one rational line of N-torsion -
    supplies enough EXTRA Galois-stable structure to build a non-circular
    kernel. The mechanism by which it might is that Galois stability, not
    rationality of points, is what a kernel needs, and the class supplies Galois
    stability cheaply. The mechanism by which it probably does not is that
    Frobenius semisimplicity forces every stable subgroup into an
    eigenspace-by-eigenspace form, and inside the eigenvalue-1 space the only
    thing distinguishing one line from another is a scalar - which is the answer.

  novelty_status: adaptation
  novelty_note: >-
    CORPUS CHECKED, WEB NOT AVAILABLE. WebSearch returned a backend model error
    for every query this session; no external source was verified and no KN-LIT
    entry is written by this record. Corpus greps run - "Kani", "isotropic",
    "Clapoti", "higher.dimension", "torsion.point attack", over knowledge/,
    ledger/proposals/, inputs/ and ideas/. The single closest record is
    IDEA-20260808-bba3dc (torsion-rationality budget for the higher-dimensional
    toolbox on ordinary prime-field curves, RQ-ECDLP-002), and this record is
    deliberately positioned as its successor and partial challenger - bba3dc
    measures ord(pi mod M) for ONE curve and concludes the toolbox is blocked by
    the field of definition of an M-torsion BASIS; B1 observes that a
    higher-dimensional kernel needs Galois STABILITY rather than a rational
    basis, and that the CLASS supplies rank-2|S| structure a single curve does
    not. Those are different claims with different escape conditions, and the
    enumeration in the minimal test decides between them. Other near neighbours
    checked - inputs/refs/research/oriented_ideal_kani_recovery.md develops
    balanced oriented-ideal Kani recovery in the SUPERSINGULAR/oriented setting
    and states explicitly that isogeny recovery transports a discrete logarithm
    without solving it; this record targets the ECDLP endomorphism directly and
    is about the ordinary F_p class. IDEA-20260806-7955a5 checks Kani's input
    conditions against a different published surface. IDEA-20260807-7d8ba9 builds
    a five-row table of auxiliary-data functionals against the Kani template.
    IDEA-20260811-85cfe9 cites bba3dc's budget for a different construction.
    None enumerates Frobenius-stable maximal isotropic subgroups of a direct sum
    over class members, which is this record's object. Kani's lemma, the
    eigenvalue structure of Frobenius on E[N], and the triviality of the Weil
    pairing on a cyclic group are all standard and are NOT claimed as new; the
    contribution claimed, and unverified against external literature, is the
    classification question B2 and the observation B1 that it is stability, not
    rationality, that a kernel requires.

  assumptions:
    - >-
      E/F_p ordinary, N = #E(F_p) prime, E(F_p) cyclic of order N, and p not
      congruent to 1 mod N so that Frobenius has two distinct eigenvalues on
      E[N]. The last is CHECKED per instance, never assumed, and an instance
      failing it is excluded with a recorded reason (it is the degenerate cell
      where the eigenspace decomposition fails and the classification must be
      redone with a Jordan block).
    - >-
      The product polarisation on a product of elliptic curves is the one in
      force, and "maximal isotropic" is taken with respect to the product Weil
      pairing on M(S). Other polarisations are out of scope and are named as
      such.
    - >-
      Only F_p-isogenies are considered; the class is the F_p-isogeny class.
      Extension-field bridges are excluded by obstruction 3 of EV-ECDLP-b3e847
      (isogeny-finding cost Omega(p^{k/2})) and are not revisited here.
    - >-
      Lawful defensive cryptanalysis on public constructions and toy benchmarks.

  proof_search_map:
    bottleneck: >-
      The step whose removal would change the cost - constructing, from public
      data alone, a Frobenius-stable maximal isotropic subgroup of M(S) whose
      quotient is not a product of curves. Every Kani-style recovery reduces to
      having such a kernel; if none exists that is independent of k, the toolbox
      cannot start, and if one does, B3's smoothness cost becomes the next
      bottleneck.
    baseline_embedding:
      parameter_slice: >-
        Taking |S| = 1 recovers exactly IDEA-20260808-bba3dc's setting, where the
        only maximal isotropic subgroup of E[N] of order N is a line and the
        question degenerates to which lines are rational - the parameter slice at
        which the existing recorded blocker is the whole story. Taking S to be a
        supersingular pair over F_{p^2} with full rational M-torsion recovers the
        SIDH-attack setting where the toolbox demonstrably works.
      reproduction_check: >-
        A frozen fixture in the supersingular arm - the same enumerator, run on a
        toy SIDH-shaped instance with full rational M-torsion, must find the
        non-split Frobenius-stable maximal isotropic subgroups that the
        Castryck-Decru-style attack uses. If it does not, the enumerator cannot
        see the structure it is being asked to rule out, and no ordinary-arm
        result may be read.
    observation_collision:
      observable: >-
        The isomorphism type of the quotient of M(S) by a Frobenius-stable
        maximal isotropic subgroup, together with whether that quotient splits as
        a product of elliptic curves.
      distinct_preimage_search: >-
        Search for two DISTINCT subgroups - one a graph of the ECDLP scalar k,
        one independent of k - with the SAME quotient observable. If they exist,
        the observable does not carry the information a recovery would need and
        B2's classification is the wrong question; if the only subgroups
        producing a non-split quotient are the k-graphs, the observable and the
        answer are in bijection and the circularity is exact. Both outcomes are
        informative and both are decided by the same enumeration.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          M(S) as a Frobenius-equivariant symplectic Z/N-module, replacing the
          tuple of curves.
        predicted_gain: >-
          The classification of usable kernels becomes finite linear algebra over
          Z/N with an explicit 2|S| by 2|S| Frobenius matrix, decidable in
          seconds at toy scale, instead of an argument about isogeny algorithms.
      - transform: observable_fiber
        proposed_object: >-
          The fiber of the "quotient splits / does not split" observable over the
          set of Frobenius-stable maximal isotropic subgroups.
        predicted_gain: >-
          None as an attack. Predicted structure - the non-split fiber consists
          exactly of the k-graphs, which is the precise statement of
          circularity and is the deliverable.
    quantifier_order: >-
      FOR ALL ordinary E/F_p with prime N and p not congruent to 1 mod N, FOR ALL
      finite S inside the F_p-isogeny class, FOR ALL Frobenius-stable maximal
      isotropic subgroups K of M(S) that are computable from public data without
      k, DOES THERE EXIST one whose quotient is not a product of elliptic curves?
      Predicted - NO. The order matters - S is quantified universally, so no
      favourable set of curves may be chosen after seeing the answer, and K is
      required to be public-data-computable BEFORE its quotient is examined.
    method_ceiling:
      strongest_certifiable_claim: >-
        A toy-scale, exhaustive classification statement - for the enumerated
        classes and the enumerated |S|, every Frobenius-stable maximal isotropic
        subgroup is split or a k-graph. It certifies nothing about |S| beyond the
        enumerated sizes, nothing about non-product polarisations, nothing about
        auxiliary curves OUTSIDE the isogeny class, and nothing about
        cryptographic N. It is not a proof that the toolbox cannot be applied; it
        is a classification of one module family.
      nearby_object_control: >-
        The nearby object on which the desired conclusion FAILS - a supersingular
        pair over F_{p^2} with full rational M-torsion, where non-split
        Frobenius-stable maximal isotropic subgroups exist in abundance and the
        SIDH attack uses them. That is the positive control and it is what makes
        the ordinary-arm null readable. A second nearby object - an ordinary
        curve with p congruent to 1 mod N (Frobenius not semisimple on E[N]),
        where the eigenspace argument degenerates and the classification must be
        redone; if the enumerator returns the same answer there, it is not
        actually using the semisimplicity and its output means less than claimed.
    proof_obligations:
      - claim: >-
          Frobenius acts on E[N] with eigenvalues 1 and p; the eigenvalue-1
          eigenspace is E(F_p)[N]
        responsibility: baseline
      - claim: W_1(S) is maximal isotropic of order N^{|S|} and its points are rational
        responsibility: correctness
      - claim: >-
          Every Frobenius-stable subgroup splits along the two eigenspaces when
          the eigenvalues are distinct
        responsibility: correctness
      - claim: >-
          Every public-data-computable Frobenius-stable maximal isotropic subgroup
          is split or a k-graph
        responsibility: strictness
      - claim: >-
          An (N,N)-isogeny at prime level N of size p costs Omega(N) by known
          algorithms
        responsibility: runtime
      - claim: >-
          The enumerator finds the non-split kernels in the supersingular positive
          control
        responsibility: feasibility

  predictions:
    - metric: >-
        rank over Z/N of the rational (eigenvalue-1) submodule of M(S), measured
        by explicit eigenvector computation
      direction: same
      minimum_effect: >-
        Exactly |S|, on every tested class and every tested S, with zero
        exceptions. A rank below |S| falsifies B1 and indicts the instance
        selection; a rank above |S| is impossible and indicts the implementation.
    - metric: >-
        number of Frobenius-stable maximal isotropic subgroups of M(S) whose
        quotient does not split as a product of elliptic curves AND which are
        computable without k
      direction: same
      minimum_effect: >-
        Exactly zero, on every tested class and every |S| in {1, 2, 3}. A single
        such subgroup, surviving a re-run with a fresh instance and a fresh k, is
        the finding that reopens the direction and requires independent review
        before being described.
    - metric: >-
        number of such subgroups in the SUPERSINGULAR positive control with full
        rational M-torsion
      direction: higher
      minimum_effect: >-
        Strictly greater than zero, and matching the count predicted by the
        symplectic-subgroup count for the corresponding level. If it is zero, the
        enumerator is blind and no ordinary-arm null is readable.
    - metric: >-
        measured cost, in field multiplications, of computing one (N,N)-isogeny
        at prime level N, as a function of N over the tested range
      direction: higher
      minimum_effect: >-
        Growth consistent with a positive power of N and inconsistent with
        polylog(N); concretely, the fitted exponent of N must exceed 0.5 over the
        tested range. A polylog fit falsifies B3 and would be a significant
        algorithmic surprise.

  minimal_test:
    design: >-
      Two arms, both pure linear algebra plus a small amount of curve arithmetic;
      NO cryptographic-size computation and NO higher-dimensional isogeny
      evaluation in the minimal test. ARM 1 (ordinary, the question). For at
      least four toy ordinary curves over primes in [2^12, 2^20] with prime N and
      p not congruent to 1 mod N - enumerate part of the F_p-isogeny class by
      explicit Velu isogenies; for S of sizes 1, 2 and 3 build the explicit
      2|S| by 2|S| Frobenius matrix on M(S) and the explicit alternating form
      (using the Weil pairing on each factor and the degree scaling induced by
      the connecting isogenies); enumerate ALL Frobenius-stable maximal isotropic
      subgroups by eigenspace decomposition plus enumeration of the pairs of
      lines in the two eigenspaces, which is O(N^{|S|}) at toy N and is the
      reason N must stay small; for each, record whether it is split, whether it
      is a graph of a scalar, whether that scalar is a known function of k, and
      whether the quotient splits. ARM 2 (supersingular positive control, run
      FIRST and blocking). The identical enumerator on a toy supersingular
      instance over F_{p^2} with full rational M-torsion, where the SIDH-attack
      kernels are known to exist; the enumerator must find them. Only after Arm 2
      passes is Arm 1 read. B3 is measured separately and cheaply by timing
      existing (ell,ell)-isogeny code at increasing PRIME levels and fitting the
      exponent; it is a cost measurement, not a classification.
    controls:
      - >-
        POSITIVE CONTROL, BLOCKING - Arm 2 above. If the enumerator cannot find
        the non-split Frobenius-stable maximal isotropic subgroups in the setting
        where they are known to exist, nothing is read from Arm 1 in either
        direction. This is the instrument-can-see-an-effect control.
      - >-
        NULL OBJECT - the identical enumerator run on M(S) with the Weil pairing
        REPLACED by a random alternating form of the same shape (seeded,
        recorded), and separately on a direct sum of N-torsion modules of curves
        with DIFFERENT group orders (non-isogenous, matched p). The count and the
        classification must CHANGE on the null; if the enumerator returns the same
        classification whatever form or curves it is given, it is measuring its
        own code and not the object.
      - >-
        DEGENERATE-CELL CONTROL - one instance with p congruent to 1 mod N (or
        the nearest available analogue), where Frobenius is not semisimple on
        E[N]; reported separately, never pooled.
      - >-
        k-BLINDING CONTROL - the enumerator is run by a process that does NOT
        have k, and the identification of a subgroup as "a k-graph" is performed
        afterwards by a separate process that does. This prevents the
        classification from silently using the answer, which is the exact failure
        mode B2 is about.
      - >-
        FRESH-INSTANCE REPLICATION - the whole enumeration repeated with a second
        k on the same curves; any subgroup class whose membership changes with k
        is by definition k-dependent.
    required_metrics:
      - rank of the eigenvalue-1 submodule, per class per |S|
      - >-
        full census of Frobenius-stable maximal isotropic subgroups with the
        four boolean labels (split / graph / k-dependent / quotient splits)
      - the same census on each null object and on the positive control
      - >-
        fitted exponent of the (N,N)-isogeny cost against prime level, with the
        fit residuals
      - >-
        a blinding attestation - which process held k at which stage, recorded in
        the run manifest
      - complete-enumeration flag; a truncated enumeration voids every "exactly zero" claim

  falsification_conditions:
    - >-
      A Frobenius-stable maximal isotropic subgroup of M(S), computable without
      k, whose quotient does not split as a product of elliptic curves,
      reproduced on a fresh instance and a fresh k under blinding. B2 is false,
      the higher-dimensional toolbox has an entry point for ordinary prime-field
      curves that this programme has not recorded, and B3 becomes the binding
      question. Independent review is required before this is described as
      anything.
    - >-
      The rational eigenvalue-1 submodule has rank below |S| on any conforming
      instance. B1 is false as stated and the record reduces to bba3dc's existing
      claim.
    - >-
      The supersingular positive control returns zero non-split kernels.
      Instrument failure - no reading is taken.
    - >-
      The null objects return the same classification as the real module.
      Instrument failure - the enumerator is not sensitive to the pairing or to
      isogeny, and nothing is read.
    - >-
      The (N,N)-isogeny cost at prime level fits a polylog model over the tested
      range. B3 is false and the cost blocker is not what is claimed.

  confounders:
    - >-
      The number of maximal isotropic subgroups grows like N^{|S|}, so the
      enumeration is only exhaustive for very small N and very small |S|. A
      truncated or sampled enumeration cannot support "exactly zero" and must be
      reported as a sample with its coverage fraction.
    - >-
      "Computable from public data" is a modelling choice, not a mathematical
      predicate. It must be fixed IN THE CONTRACT before the run, as an explicit
      list of allowed inputs (curve equations, the isogenies enumerated, P, Q,
      the Frobenius matrix), and any subgroup constructed outside that list is
      recorded as out-of-model rather than silently admitted or excluded.
    - >-
      The degree scaling of the Weil pairing under the connecting isogenies is
      easy to get wrong by a factor; an error there makes isotropy tests wrong in
      one direction and silently. It is verified against the explicit pairing
      values on the toy instance rather than assumed.
    - >-
      Twists share a j-invariant; deduplicating S by j merges curves whose
      N-torsion modules differ, and the direct sum then has the wrong rank.
    - >-
      A subgroup can be k-independent as a SET while its construction procedure
      consulted k; this is why the blinding control exists and why it is not
      optional.

  interpretation_limits:
    - >-
      Toy scale, claim tier toy. Nothing here is evidence about P-256 or about
      any cryptographic parameter set.
    - >-
      A null result classifies one module family at small |S| and small N. It is
      not a theorem that the higher-dimensional toolbox cannot be applied to
      ordinary prime-field ECDLP; it is a scoped classification with a stated
      coverage fraction.
    - >-
      B1 refines IDEA-20260808-bba3dc; it does not refute bba3dc's measurement,
      which is about the field of definition of a torsion BASIS and remains
      correct on its own terms. What is challenged is only the inference from
      that measurement to "the toolbox is blocked", and the challenge is
      resolved by enumeration, not by argument.
    - >-
      B3 is a statement about KNOWN (N,N)-isogeny algorithms. It is not a lower
      bound and must not be cited as one.
    - >-
      Timeouts, crashes and infrastructure failures are never negative
      mathematical evidence (AGENTS.md rule 5).

  heuristic_assumptions:
    - id: H-KAN-1
      statement: >-
        For a uniformly random ordinary curve E/F_p with prime N = #E(F_p), the
        Frobenius eigenvalues 1 and p are distinct modulo N with probability
        1 - O(1/N); equivalently the embedding degree ord_N(p) exceeds 1 for all
        but a negligible fraction of curves, so the eigenspace decomposition used
        throughout B2 is available.
      rigorous_support: >-
        Rigorous ingredient - the characteristic polynomial of Frobenius is
        x^2 - t*x + p and N divides p + 1 - t, so the eigenvalues mod N are 1 and
        p and they coincide exactly when N divides p - 1. Distribution imitated -
        that p mod N behaves like a uniformly random residue, the same
        idealisation that underlies the standard statement that random curves
        have large embedding degree (the MOV/Frey-Ruck non-applicability
        heuristic, KN-TECH-032 in this corpus).
      validation_plan: >-
        Sample at least 10^3 random ordinary toy curves over primes in
        [2^16, 2^32] with prime N, compute ord_N(p) exactly, and compare the
        empirical distribution of ord_N(p)/N against the prediction for a random
        residue's multiplicative order (Erdos-Pomerance-type statistics). Tail
        check - the smallest observed ord_N(p) over the whole sample against the
        predicted minimum over that many trials; a systematic excess of small
        embedding degrees would be a finding in its own right and is reported
        rather than discarded. Sampled parameters and the seed are recorded.
        Transfer assumption stated - this statistic is size-insensitive in a way
        cost statistics are not, but nothing is claimed for any specific
        cryptographic curve.
    - id: H-KAN-2
      statement: >-
        The number of Frobenius-stable maximal isotropic subgroups of M(S) is
        the number predicted by the eigenspace-splitting count - the pairs
        (L_1, L_p) of complementary-dimension subgroups of the two eigenspaces
        satisfying the isotropy condition - with no additional subgroups arising
        from non-semisimple behaviour or from unexpected coincidences among the
        connecting isogeny degrees mod N.
      rigorous_support: >-
        Rigorous ingredient - semisimplicity of a diagonalisable operator forces
        every stable subgroup to be a direct sum of its intersections with the
        eigenspaces. Imitated - that the connecting degrees behave like random
        residues mod N, so no accidental degeneracy collapses the count.
      validation_plan: >-
        The predicted count is computed in closed form BEFORE the enumeration and
        frozen; the enumeration then either matches it or does not, and a
        mismatch is a first-class result pointing at either a degeneracy or an
        implementation defect. Tail check - the classes with the largest observed
        deviation from the predicted count are re-enumerated with an independent
        routine. Toy scale only; no transfer claimed.

  target_complexity:
    time_exponent: >-
      Not applicable as an attack. If B2 were falsified AND a smooth-level route
      were found, the toolbox evaluates the relevant isogenies in time polynomial
      in the level's largest prime factor, and the surrounding search would set
      the exponent - a search this record does not supply and does not claim
      exists. The record's own computation is O(N^{|S|}) enumeration at toy N,
      which is a measurement cost, not an attack cost.
    memory_exponent: >-
      O(N^{|S|}) to hold the census at toy scale; the toolbox itself is
      polynomial space. Neither is an attack figure.
    best_known: >-
      Pollard rho with negation at 0.886*sqrt(N)/sqrt(2) time and O(1) memory
      (KN-TECH-001, KN-TECH-006); BSGS at sqrt(N)/sqrt(N). For the
      higher-dimensional comparison - the (N,N)-isogeny algorithms whose level
      dependence B3 measures.
    hidden_overhead: >-
      The entire content of B3 is an overhead that "polynomial time" statements
      about higher-dimensional isogenies conceal when the level is prime and
      large. Any record quoting polynomial time for such a construction without
      charging the level's smoothness is wrong in this setting, and this record
      exists partly to put that charge on the books.
    tradeoff_note: >-
      Not applicable - no attack is proposed. If B2 were falsified the relevant
      tradeoff would be between |S| (more curves, larger module, richer kernel
      supply) and the enumeration cost N^{|S|}, and that tradeoff is itself a
      finding to be reported.

  dominated_by: >-
    n/a for an attack claim, because none is made. For the QUESTION of which
    blocker is operative there is one competing instrument in this corpus,
    IDEA-20260808-bba3dc's ord(pi mod M) measurement, and this record does not
    dominate it - the two measure different quantities and B1 is precisely the
    assertion that bba3dc's quantity does not settle the question. For the
    ECDLP-cost frontier, every row dominates any outcome here - Pollard rho with
    negation (0.886*sqrt(N)/sqrt(2) time, O(1) memory, 0 queries); BSGS
    (sqrt(N)/sqrt(N)); van Oorschot-Wiener parallel rho; the multi-target
    frontier sqrt(L*N); the preprocessing frontier S*T^2 = Omega(epsilon*N). All
    checked as recorded in this corpus (IDEA-20260802-005); the two external
    frontier citations were NOT independently re-verified this session because
    web search was unavailable.
  sota_delta:
    time_exponent: >-
      0 (no change). No algorithm is proposed.
    memory_exponent: 0 (no change).
    data_or_query_exponent: 0 (no change).
    note: >-
      The delta is entirely in which blocker the corpus records for the
      2022-2026 higher-dimensional toolbox in the ordinary prime-field lane.
      Recording the wrong blocker is not cost-free - it names the wrong escape
      condition, and a lane closed for the wrong reason reopens for the wrong
      reason too. If B2 is falsified the delta becomes potentially large and
      unquantified, and this record explicitly declines to quantify it in
      advance.

  estimated_cost:
    implementation: medium
    compute: low
  compute_budget_note: >-
    The ordinary arm at N below 2^13 with |S| up to 3 is an N^3 enumeration, so
    of order 10^11 subgroup tests in the worst cell - that is too many, and the
    contract must therefore either cap N near 2^8-2^10 for |S| = 3 or replace
    exhaustive enumeration by an exhaustive enumeration of the LINE PAIRS
    (which is O(N^{|S|-1}) after quotienting by scaling) and report the coverage
    fraction honestly. This sizing is flagged here rather than discovered during
    execution. The supersingular positive control is small and cheap. The B3
    timing arm is minutes.
  recommended_priority: medium

  relation_to_existing_records:
    challenges: >-
      IDEA-20260808-bba3dc, on the narrow point that kernel specification needs
      Galois stability rather than a rational torsion basis. The challenge is
      resolved by enumeration, not by argument, and bba3dc's own measurement
      stands regardless.
    distinct_from: >-
      inputs/refs/research/oriented_ideal_kani_recovery.md (supersingular/oriented
      isogeny RECOVERY, which explicitly does not solve a discrete logarithm);
      IDEA-20260806-7955a5 (Kani input conditions on a different surface);
      IDEA-20260807-7d8ba9 (auxiliary-data functional table).
    complements: >-
      IDEA-20260812-a3720a, which says the ECDLP instance is invariant along the
      class; this record asks whether the class nonetheless supplies module
      structure a single curve lacks. If a3720a's A3 holds and this record's B2
      holds, the two together say the class supplies neither an easier instance
      nor a richer kernel supply.
