      verified_by: TASK-20260901-56c0aa (lines 1-260 read this session)
    - ref: IDEA-20260805-e7ee4a
      provenance: internal
      claim: >-
        |Trd(x)| <= 2 sqrt(Nrd(x)) and Trd in pZ force Trd = 0 for
        conjugate isogenies of degree below p/4.
      verified_by: TASK-20260901-56c0aa (lines 1-110 read this session)
    - ref: IDEA-20260821-e99afd
      provenance: internal
      claim: >-
        alpha/3 identity; the rigorous first moment sum_{d<=T} H(4pd) =
        Theta(p^{1/2} T^{3/2}); T = 1 as the stratum where detection is a
