idea:
  id: IDEA-20260901-22428d
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  added: '2026-09-01'
  title: >-
    THE ABSOLUTE DETECTION PREDICATE HAS AN ALGEBRAIC FORM, AND ITS FORM
    NAMES THE CEILING: the stratum S_{<=D} = {E : delta_E <= D} is exactly
    the set of supersingular F_{p^2}-roots of G_D(x) = prod_{d<=D}
    Phi_d(x, x^p) -- the modular polynomials evaluated on the graph of
    Frobenius -- equivalently of the class polynomials of the orders
    Z[sqrt(-p*d)] mod p; every F_{p^2}-root of Phi_d(x, x^p) is
    supersingular; the useful root count is p^{1/2} D^{3/2} against a
    polynomial degree of p D^2; and the only two aggregation structures on
    {Phi_d(x, x^p)} are the multiplicative one the incumbent already spends
    (c = 2 lists) and the Galois one that exists only at d = 1 (x^p - x) --
    so lever L3's alpha < 1 requires a THIRD structure, which this record
    names and does not exhibit
  class: representation

  claim: >-
    STATED FIRST: no algorithm, no exponent below 1/3, and no suggestion
    that p^{1/4} exists or is near. This record gives lever L3 (the
    collision mechanism fed by F3) and the alpha lever of
    IDEA-20260821-e99afd an exact algebraic object to attack, three
    checkable identities, and a ceiling with a named escape class.

    (I1) THE LOCUS IDENTITY. For a prime p and an integer d < p/4 with
    p not dividing d, let Phi_d be the classical modular polynomial of
    level d (cyclic d-isogenies). Then j(E) is a root of Phi_d(x, x^p) in
    F_{p^2} iff E admits a cyclic d-isogeny to E^{(p)} (immediate: j(E^{(p)})
    = j(E)^p, frozen source line 57 context). Hence
    S_{<=D} = {supersingular E : delta_E <= D} equals the set of
    F_{p^2}-roots of G_D(x) := prod_{d <= D} Phi_d(x, x^p) that are
    supersingular -- and by (I2) the qualifier is empty.

    (I2) NO ORDINARY ROOTS (offered as a derivation). If E/F_{p^2} is
    ordinary and phi: E -> E^{(p)} is a cyclic d-isogeny then alpha = Frob o
    phi is in End(E), and End(E) tensor Q is an imaginary quadratic field K
    in which p splits (ordinary case). But alpha has reduced trace 0 and
    reduced norm p*d (the trace-vanishing rule of IDEA-20260805-e7ee4a,
    read, applied inside End(E) tensor Q which is commutative here), so
    alpha^2 = -p*d and K = Q(sqrt(-p*d)), in which p RAMIFIES. Contradiction.
    So every F_{p^2}-root of Phi_d(x, x^p) with d < p/4 is supersingular, and
    G_D detects S_{<=D} with no supersingularity test.

    (I3) THE COUNT. The number of F_{p^2}-roots of Phi_d(x, x^p) counted with
    multiplicity equals the total number, over all supersingular E up to
    isomorphism, of cyclic d-isogenies E -> E^{(p)}, which is a Brandt-matrix
    column sum and by Deuring-Eichler a class-number expression of size
    (p*d)^{1/2+o(1)} (the rigorous first moment IDEA-20260821-e99afd carries,
    read). Summed over d <= D: p^{1/2} D^{3/2+o(1)} roots in F_{p^2}, out of
    a polynomial degree of about p * sum_{d<=D} psi(d) = p D^{2+o(1)}.
    G_D is therefore a polynomial almost all of whose roots lie OUTSIDE
    F_{p^2}, and its F_{p^2}-part is the product over d <= D and over orders
    O containing Z[sqrt(-p*d)] of the class polynomials H_O(x) mod p (the
    class-polynomial form; the orientation identity of IDEA-20260901-6a7a3e
    T1). This is D1's density law (E-count p^{1/2} D^{3/2} over p/12 curves)
    read as a statement about root counts.

    (I4) THE CEILING, AS A CLOSURE ARGUMENT AT THE inventor-protocol
    SECTION 4 STANDARD. Detection of delta_E <= D means deciding G_D(j) = 0.
    NAMED OBSTRUCTION: aggregation. Evaluating Phi_d(j, j^p) ONE d AT A TIME
    costs at least psi(d)^{1-o(1)} (the evaluated polynomial has degree
    psi(d); the frozen source's own listing pays that per neighbourhood at
    line 156), so degree-by-degree detection costs sum_{d<=D} d = D^2:
    alpha = 2, WORSE than the incumbent's alpha = 1. The incumbent beats it
    by aggregating across degrees MULTIPLICATIVELY: the smooth ball shares
    prefixes, so the D^2 collapses to a list of size D (F3's c = 2 count at
    radius D^{1/2}). The d = 1 stratum is detected in O(log p) by a
    different aggregation entirely: S_1 is the fixed locus of Frobenius on
    X(1), so the sparse polynomial x^p - x, of degree p but straight-line
    size log p, vanishes exactly on it. THE ARGUMENT: S_d for d > 1 is the
    image in X(1) of the fixed locus of (Atkin-Lehner w_d) o Frobenius on
    X_0(d) -- the F_p-points of the w_d-twist of X_0(d) -- a Galois-type
    locus on a DIFFERENT curve for each d; the union over d <= D is a
    Galois-type locus on no single curve of size p^{o(1)}, so the sparse
    Frobenius trick has no single polynomial to act on. REDIRECTION: alpha
    < 1 through algebra needs a THIRD structure -- an object of size D^{alpha}
    whose F_{p^2}-vanishing locus contains S_{<=D}: a straight-line program
    for a multiple of the class-polynomial product of size below its degree
    p^{1/2} D^{3/2}, or a modular curve of small gonality parametrising all
    d <= D at once. None is exhibited and none is claimed.

    NUMERIC CONDITION FOR AN EXPONENT BELOW 1/3 THROUGH THIS LEVER: a
    straight-line program of size D^{alpha} with alpha < 1 for a polynomial
    vanishing on S_{<=D} inside F_{p^2}, for D = p^{1/3}; alpha <= 3/4 for
    the 1/4 target (e99afd's number, reached here by a different road).
    The record's own prediction is that no such program exists in the
    families it can name, which is a fatigue statement about those families
    and is labelled unverified as inventor-protocol section 4 requires.

  mechanism: >-
    TRACKED OBJECT: the polynomial G_D (or its F_{p^2}-part, the class-
    polynomial product) as a function of D -- specifically the pair (degree,
    number of F_{p^2}-roots) and its straight-line size. What it discards:
    everything about individual curves; what it retains: the whole stratum
    at once. It is lossy (a single polynomial cannot be inverted to any
    particular phi) and it propagates with D multiplicatively (G_{D+1} =
    G_D * Phi_{D+1}(x, x^p)), which is exactly the multiplicative aggregation
    the incumbent uses and no other.

    WHY THIS IS NOT e99afd IN NEW NOTATION. e99afd defines alpha and names
    the SHAPE of an answer ('an arithmetic predicate on j'). This record
    writes the predicate down -- G_D(j) = 0 -- proves it needs no
    supersingularity test (I2), counts its roots (I3), identifies the two
    aggregation structures it admits, and shows that the d = 1 case
    e99afd cites as 'where alpha < 1 provably holds' works for a reason
    (Frobenius-fixed locus on X(1)) that does not extend. e99afd's
    measurement is of alpha for detectors that EXIST; this record's is of
    the polynomial's own invariants, which exist whether or not a detector
    does.

    STAGE 0 (zero compute): write I1-I3 and the d = 1 reproduction; check
    I2's trace argument in the commutative (ordinary) case separately from
    e7ee4a's quaternion case, since the inequality |Trd| <= 2 sqrt(Nrd)
    holds in both.

    STAGE 1 (exact toy check, minutes): at p in {2437, 3889, 5737, 7333} (the
    committed graphs with archived delta_E labels) and d in {2, 3, 4, 5, 6,
    7}, compute the F_{p^2}-roots of Phi_d(x, x^p) directly (Phi_d for these d
    are classical and small), verify (a) every root is a supersingular j
    (I2), (b) the root multiset matches {j : E has a cyclic d-isogeny to
    E^{(p)}} read off the archived delta labels and the graph (I1), (c) the
    root count with multiplicity equals the Brandt column sum computed from
    the graph (I3).

    STAGE 2 (the aggregation measurement, hours): for D up to 7 at the four
    primes, compute the F_{p^2}-part of G_D (gcd with x^{p^2} - x) and record
    (deg G_D, deg of the F_{p^2}-part, and the size of the smallest
    representation this environment can produce: dense degree, and the
    straight-line size of the product form). Report the ratio
    deg(F_{p^2}-part)/deg(G_D) against the predicted p^{-1/2} D^{-1/2}.

    STAGE 3 (nearby-object control): repeat Stage 2 with x^p replaced by
    j_0, a fixed unrelated supersingular j: G'_D(x) = prod Phi_d(x, j_0),
    whose roots are the degree-<=D ball around E_0. There every root is in
    F_{p^2} (supersingular j's are), the F_{p^2}-part IS the whole
    polynomial, and no sparse proxy exists at any d including d = 1. The
    contrast with G_D (mostly non-F_{p^2} roots; sparse proxy at d = 1) is
    the structural tell that the conjugate target is special.

  novelty_status: unverified

  novelty_screen:
    method: >-
      crypto-kb empty this session, not queried. Direct reading of the 20
      RQ-SSIQ-9702af proposals (context list; e99afd, e7ee4a, e4c719,
      c60813, 7424a9, 71c2b2 by claim section), H-SSIQ-545e66, EV-SSI-8aaad0,
      KN-TECH-055/058/080, and greps over ledger/ for 'class polynomial',
      'Hilbert class', 'Atkin', 'twist', 'x^p' (case-insensitive) in the
      SSIQ lane. No web search; no external source opened.
    results: >-
      No record writes the detection predicate as a polynomial, states I2,
      or identifies the aggregation structures. IDEA-20260805-c60813 kills a
      relation architecture on the Hecke module of dimension p/12; this
      record's Brandt-column-sum count (I3) touches the same object from the
      root-count side and does not contradict it. The frozen source's
      reference [15] (Corte-Real Santos, Costello, Shi, 'fast subfield root
      detection', line 288) is the d = 1 sparse-proxy idea used inside
      Delfs-Galbraith; it was NOT opened and is a recalled pointer only.
      Externally, the twisted-X_0(d) description of curves d-isogenous to
      their conjugate is very likely classical; unverified.
    verdict: >-
      UNVERIFIED. I1 is immediate; I2 and I3 are elementary derivations; the
      contribution is the ceiling argument I4 and the three exact toy checks.

  citations:
    - ref: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md
      provenance: internal
      claim: >-
        Frob o phi non-scalar and inseparable (lines 57, 220); Theorem 1.5
