      verified_by: TASK-20260901-56c0aa (author)
    - ref: >-
        Corte-Real Santos, Costello, Shi, 'Accelerating the Delfs-Galbraith
        algorithm with fast subfield root detection', CRYPTO 2022 (frozen
        source reference [15])
      provenance: recalled
      claim: >-
        HEDGED: detects whether Phi_ell(j, Y) has a root in F_p faster than
        finding roots, using the sparse structure of x^p - x -- the d = 1
