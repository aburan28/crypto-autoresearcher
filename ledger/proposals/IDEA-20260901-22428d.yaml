      verified_by: null

  assumptions:
    - >-
      d < p/4 and p not dividing d throughout (Theorem 1.5's range).
    - >-
      Classical modular polynomials Phi_d for composite d count CYCLIC
      d-isogenies; the record's counts are for cyclic kernels, matching
      Definition 3.1 (line 131).
    - >-
      At toy p the archived delta labels are exact (X = 23 exceeds
      (p/2)^{1/3} < 16), so the Stage-1 comparison is against ground truth.
    - >-
      Toy scale only for every measured number.

  proof_search_map:
    bottleneck: >-
      The straight-line size of a polynomial vanishing on S_{<=D} inside
      F_{p^2}: alpha = log_D of that size. The incumbent realises alpha = 1
      through the smooth list; d = 1 realises alpha = 0 through x^p - x.
    baseline_embedding:
      parameter_slice: >-
        D = 1: G_1 = Phi_1(x, x^p) = x - x^p, whose F_{p^2}-roots are F_p --
        the Delfs-Galbraith stratum, detected in O(log p). The incumbent is
        the other slice: evaluate G_D by enumerating the smooth ball on both
        sides, cost D^{1+o(1)}.
      reproduction_check: >-
        Symbolic at D = 1 (immediate). Frozen fixture: at p = 2437 the
        F_{p^2}-roots of x^p - x among supersingular j must be exactly the
        F_p-locus vertices of the committed graph.
    observation_collision:
      observable: >-
        The value G_D(j) (zero or not) and the invariants (deg G_D,
        #F_{p^2}-roots, straight-line size).
      distinct_preimage_search: >-
        Two curves with the same delta and different endomorphism rings have
        the same observable and are meant to. The dangerous collision is
        between S_{<=D} and a LARGER locus that a sparse polynomial might
        vanish on: e.g. x^{p^2} - x vanishes on all of F_{p^2}, size log p,
        and 'contains S_{<=D}' vacuously. The separating condition, stated
        in the numeric target, is that the polynomial's F_{p^2}-vanishing
        locus be S_{<=D} up to a p^{o(1)} factor in size -- a sparse
        polynomial vanishing on far more than S_{<=D} detects nothing.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move 'detect delta_E <= D' to 'evaluate G_D at j'. Encoding exact
          (I1); completeness exact; soundness exact given I2; transfer: the
          cost of evaluating G_D is the cost exponent alpha; cost loss: the
          degree-by-degree evaluation is alpha = 2, so the representation
          must be paired with an aggregation to be useful at all.
        predicted_gain: >-
          An exact object for L3 plus the closure argument I4.
      - transform: observable_fiber
        proposed_object: >-
          Hold the root set fixed (S_{<=D}) and vary the polynomial: dense
          product, class-polynomial product, twisted-X_0(d) point sets. Search
          for an intrinsic invariant (gonality, straight-line size) separating
          the d = 1 fibre from d > 1.
        predicted_gain: >-
          Records which representations were exhausted; the deliverable is
          useful even if no sparse form exists.
    quantifier_order: >-
      I1-I3: FOR ALL p, FOR ALL d < p/4 with p not dividing d. I4's ceiling:
      FOR ALL straight-line programs in the two named aggregation families,
      size >= D^{1-o(1)}; NOT CLAIMED: for all programs (the third structure
      is exactly the escape). The numeric target is THERE EXISTS a program of
      size D^{alpha} with alpha < 1 whose F_{p^2}-vanishing locus is S_{<=D}
      up to p^{o(1)}; the witness may depend on p and D but not on j.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: I1-I3 as derivations, verified exactly at four toy primes for
        d <= 7; the aggregation argument as a closure of two named families
        with an explicitly named third class left open. It can NEVER certify
        that no sparse program exists (that would be a circuit lower bound),
        and it certifies nothing about the exponent.
      nearby_object_control: >-
        THE OBJECT WHERE THE SPARSE PROXY FAILS EVEN AT d = 1: the unrelated
        target E_0 (Stage 3). There G'_1 = Phi_1(x, j_0) = x - j_0 detects one
        curve, and the ball polynomial G'_D has every root in F_{p^2} with no
        Frobenius structure to exploit; alpha = 1 (enumerate the ball) is the
        floor and the ceiling. A method that reports a sparse proxy for G'_D
        is measuring itself. THE OBJECT WHERE IT WORKS: d = 1 for the
        conjugate target. The record must see the pair as different.
    proof_obligations:
      - claim: I1 -- root of Phi_d(x, x^p) iff cyclic d-isogeny to the conjugate.
        responsibility: correctness
      - claim: I2 -- no ordinary F_{p^2}-roots for d < p/4.
        responsibility: correctness
      - claim: I3 -- root count equals the Brandt column sum, of size (p d)^{1/2+o(1)}.
        responsibility: size
      - claim: D = 1 reproduces the F_p-locus and O(log p) detection.
        responsibility: baseline
      - claim: >-
          Degree-by-degree evaluation costs D^{2}; multiplicative aggregation
          gives the incumbent's D; Galois aggregation exists only at d = 1.
        responsibility: runtime
      - claim: >-
          Any sparse candidate must have F_{p^2}-vanishing locus of size
          |S_{<=D}| p^{o(1)}, not merely contain S_{<=D}.
        responsibility: strictness
      - claim: All measured numbers scoped to the four primes and d <= 7.
        responsibility: scope
    not_applicable_reason: null

  object_first_candidate:
    established_families_off_limits: >-
      OFF-LIMITS AS THE PRIMARY LENS: the smooth list and its restrictions
      (the incumbent, 7424a9, 71c2b2), descent (L4), memory (L5), the
      quaternion-side relation architecture (c60813). The object here is a
      polynomial, not a list, a walk, or a lattice.
    tracked_object: >-
      G_D and its F_{p^2}-part, with the invariants (degree, F_{p^2}-root
      count, straight-line size).
    lossiness: >-
      Total: a single polynomial for the whole stratum; not invertible to any
      isogeny.
    propagation: >-
      Multiplicative in D; no other propagation known -- which is the
      finding.
    survival_score: >-
      Survives as an exact description for every D; dies as a detection
      method above D = 1 unless a third aggregation exists.

  null_object_control: >-
    NULL (blocking): the unrelated-target polynomial G'_D of Stage 3, on the
    same primes and the same d. Its F_{p^2}-root fraction must be ~1 while
    G_D's must be ~p^{-1/2} D^{-1/2}; if the two fractions agree, the
    instrument is not seeing the Frobenius structure. KNOWN-ANSWER
    CALIBRATION (blocking): d = 1 must return exactly the F_p-locus. DECAY
    CHECK: the F_{p^2}-root fraction of G_D is predicted to FALL as p grows
    at fixed D (like p^{-1/2}); a fraction flat in p is an artifact.

  discriminated_from:
    - >-
      IDEA-20260821-e99afd / H-SSIQ-545e66 (NEAREST). They define alpha and
      the shape 'arithmetic predicate on j'. EXACT DELTA: this record writes
      the predicate (G_D(j) = 0), proves I2, counts roots, and gives the
      aggregation argument for why d = 1 does not extend; its measurement is
      of the polynomial's invariants rather than of a detector's cost.
    - >-
      IDEA-20260901-6a7a3e (same task). Uses the orientation identity for
      NEIGHBOUR structure (plateaus, L2/L4, comparison predicate). DELTA:
      this record uses it for the ABSOLUTE predicate (L3/alpha) and its
      algebraic representation; different lever, different test (root
      counts versus neighbour counts), different closure.
    - >-
      IDEA-20260805-c60813. Kills a relation architecture via the Hecke
      module's size. DELTA: this record's I3 is the same Brandt object read as
      a root count, used to bound what a POLYNOMIAL detector must carry, not
      to kill linear algebra.
    - >-
      IDEA-20260806-d5a34e. Attempts a query lower bound in the isogeny-graph
      query model. DELTA: this record's ceiling is in an ALGEBRAIC model
      (straight-line programs for polynomials in j), where the query model's
      bound does not apply and vice versa; the two are complementary
      closures of L3.
    - >-
      IDEA-20260815-86b09c and IDEA-20260821-167fd9. Table collision rate and
      streaming recogniser for the codomain set. DELTA: 167fd9's 'streaming
      RECOGNISER for C(E)' is a recogniser for a LIST; this record's object
      recognises a STRATUM and is indifferent to memory.

  predictions:
    - metric: >-
        M1 -- number of F_{p^2}-roots of Phi_d(x, x^p) that are ordinary, for
        d in {2,...,7} at the four primes
      direction: lower
      minimum_effect: EXACTLY 0 (I2). One ordinary root refutes I2.
    - metric: >-
        M2 -- agreement between the root multiset of Phi_d(x, x^p) and the
        set of vertices with a cyclic d-isogeny to their conjugate, read from
        the committed graphs and labels
      direction: different
      minimum_effect: >-
        Exact equality as multisets (I1, I3). Any discrepancy beyond
        automorphism-weight conventions at j = 0, 1728 refutes I1 or the
        instrument.
    - metric: >-
        M3 -- F_{p^2}-root fraction of G_D versus its degree, at fixed D across
        the four primes
      direction: lower
      minimum_effect: >-
        Decreasing in p consistent with p^{-1/2}; flat records an artifact.
        G'_D's fraction stays near 1 (NULL).
    - metric: >-
        M4 -- straight-line size of the smallest representation of a
        polynomial with F_{p^2}-vanishing locus S_{<=D} found in the two named
        families, as a function of D
      direction: different
      minimum_effect: >-
        Predicted: no better than D^{1-o(1)} in either family at any D
        tested. LEAD BRANCH: a representation of size D^{0.9} or smaller
        whose vanishing locus is S_{<=D} up to a factor 2 in size, on all four
        primes -- route to independent review before interpretation.

  minimal_test:
    design: >-
      STAGE 0 (hours, zero compute): I1-I3 written, d = 1 reproduction.
      STAGE 1 (minutes): M1, M2 at d <= 7 on the four committed graphs.
      STAGE 2 (hours): M3, M4 for D <= 7. STAGE 3 (hours): the unrelated-
      target null. No attack, no list, no search beyond root-finding of
      small modular polynomials at toy p.
    controls:
      - unrelated-target polynomial G'_D (blocking null)
      - d = 1 F_p-locus known answer (blocking)
      - automorphism-weight convention at j = 0 and 1728 fixed before scoring M2
      - decay check of the root fraction in p
    required_metrics:
      - ordinary-root count per (p, d)
      - root multiset agreement per (p, d)
      - (deg G_D, deg F_{p^2}-part, ratio) per (p, D), real and null
      - smallest representation size found per D with the family named

  falsification_conditions:
    - F1. An ordinary F_{p^2}-root of Phi_d(x, x^p) with d < p/4. I2 false; record superseded.
    - F2. M2 disagreement not attributable to automorphism weights. I1 or the graph labels are wrong; stop.
    - F3. G'_D and G_D show the same root fraction. Instrument sees no Frobenius structure; controlled null.
    - F4. M4 lead branch fires and survives the null. I4's two-family closure is incomplete in the direction that helps L3; review.
    - F5. Budget exhaustion before Stage 2. Infrastructure outcome only.

  confounders:
    - >-
      Multiplicities: Phi_d(x, x^p) can have repeated roots at curves with
      several conjugate d-isogenies or extra automorphisms; M2 is scored as
      multisets with the convention fixed in advance.
    - >-
      At toy p the degrees pd and root counts (pd)^{1/2} are close, so the
      'mostly non-F_{p^2}' contrast is weak; the four-prime trend, not a
      single ratio, is the evidence.
    - >-
      'Smallest representation found' is a search over families this
      environment can build; it upper-bounds the true straight-line size and
      never lower-bounds it.

  interpretation_limits:
    - >-
      I4 closes two named aggregation families with an argument and names
      the third class; it is not a lower bound and the record's
      novelty_status and closure status are both unverified.
    - >-
      Nothing here changes the exponent; the conditional exponent in
      target_complexity is inhabited by nothing.
    - >-
      Every measured number is toy tier at four primes and d <= 7.

  heuristic_assumptions:
    - id: H1
      statement: >-
        The root count of Phi_d(x, x^p) in F_{p^2}, summed over d <= D,
        is p^{1/2} D^{3/2+o(1)} uniformly for D <= (p/2)^{1/3}.
      rigorous_support: >-
        The first moment sum_{d<=D} H(4pd) via Deuring-Eichler is rigorous
        (as carried by e99afd); H1 is the statement that the F_{p^2}-root
        count of the polynomial equals that Brandt sum, i.e. I3, which is
        offered as a derivation and needs no distributional assumption. It
        is listed as a heuristic only until the derivation is reviewed.
