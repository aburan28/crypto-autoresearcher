      verified_by: TASK-20260901-56c0aa (lines 1-160 read this session)
    - ref: IDEA-20260805-c60813
      provenance: internal
      claim: >-
        The Hecke module on ideal classes has dimension about p/12; the
        two-sided class group of O_0 has order at most 2.
      verified_by: TASK-20260901-56c0aa (lines 1-100 read this session)
