  assumptions:
    - Matched pair is unit of evidence: same (n,m,k), same seeds/order/routine, same S_3 family; n<=24 exact finite algebra only.
    - No Groebner engine; degree-4 Macaulay rank certificates over GF(2) in pure Python fit budget per DEC-20260913-47bbb7.
    - Every reported degree carries its label (Def5-true, Def6-fake, Semaev-d_F4, Macaulay-rank-fall); unlabelled records incomplete.
    - Refs Nagao 2013/548 and 2013/549 are recalled only and provide no support.
    - No claim about any deployed curve's security at any outcome; scope is tested n,m,k, characteristic 2, labelled degree bound, with transfer assumptions stated.
  proof_search_map:
    bottleneck: whether the degree-4 bound survives the affine coset shift, compounded by Def.5/Def.6 conflation.
    baseline_embedding:
      parameter_slice: n<=24, small m,t, v=0 EQS2 unshifted baseline at same (n,m,k).
      reproduction_check: recompute unshifted triple with corrected XOR product; must reproduce expected structural low fall (KR-IC-f5c584 FFD 2 neighbourhood / prior EQS2 values) before any shifted comparison counts.
    observation_collision:
      observable: per-side labelled triple (Def5-true value, Def6-fake value, Macaulay-rank-fall present/absent+degree) plus C(N+4,4) dims.
      distinct_preimage_search: same observable divergence from routine bug (XOR product, order, basis) vs true non-invariance; searched via seed/order swap, basis variation, random-label shuffle, generic-Boolean control.
    constructive_transforms: []
    quantifier_order: FORALL tested matched pairs compute the labelled triple; EXISTS >=1 divergent pair with labelled gap suffices to establish Def-split non-invariance at tested scope; no FORALL-n claim beyond tested n,m,k.
    method_ceiling:
      strongest_certifiable_claim: scoped divergence/agreement of labelled degrees at tested (n,m,k) over F_{2^n}; no transfer beyond stated assumption.
      nearby_object_control: v=0 EQS2 baseline; odd-p control deferred to IDEA-20261006-486aa2; random-shift null deferred to IDEA-20261006-839ced.
    proof_obligations:
      - claim: per-pair labelled triple correctly computed with corrected routine
        responsibility: future executor under frozen contract (not this proposal)
      - claim: divergence counted only on matched pairs with identical routine
        responsibility: future validator (matched-pair audit)
    not_applicable_reason: "Proof-oriented constructive transforms N/A: measurement proposal claiming no theorem or closure; bottleneck/collision/quantifier/ceiling audits retained, transforms honestly empty."
  predictions:
    - metric: divergence rate D=1-mean(agreement) where agreement=1 iff (Def5-true, Def6-fake, rank-fall) all agree v=0 vs v!=0 with same <=4/>4 status
      direction: different
      minimum_effect: D>=1/N_batch (>=1 divergent matched pair with >=1 degree-step gap or present/absent flip, degrees labelled)
    - metric: preservation gap G=(rate Def6-fake<=4 preserved)-(rate Def5-true<=4 preserved) over batch
      direction: higher
      minimum_effect: G>=0.2 absolute or >=1 pair with Def6-fake<=4 while Def5-true>4
  minimal_test:
    design: |
      Batch of matched pairs at largest exactly-computable n<=24 (small m,t): per pair build degree-4 Macaulay matrices (exact C(N+4,4)) for v=0 EQS2 and v!=0 EQS4 with identical seeds/order/routine and corrected XOR product; record labelled triple per side. NEGATIVE outcome (all triples agree and stay <=4) fails to falsify invariance at tested scale and is the corroborating direction.
    controls:
      - v=0 EQS2 baseline at same (n,m,k,seeds/order/routine)
      - seed/order swap replicate
      - random-label shuffle of coset labels
      - generic random-Boolean system of same (N,degree) as solver-artifact control
    required_metrics:
      - per-side Nagao Def.5 true-FFD value (labelled)
      - per-side Nagao Def.6 fake-FFD value (labelled)
      - per-side Macaulay degree-4 rank-fall present/absent plus fall degree (labelled) and C(N+4,4) dims
      - per-pair agreement/divergence indicator and batch rates D and G
  falsification_conditions:
    - Zero divergent pairs across the maximal-n batch with corrected routine falsifies the divergence claim at tested scope (does not prove invariance beyond tested n,m,k).
    - Reproduction failure on v=0 baseline (triple does not match expected EQS2 behaviour) invalidates the batch, not the proposition.
  confounders:
    - XOR-product implementation (use corrected routine; record version)
    - monomial order, F2-basis choice, (m,t) slicing
    - y-recovery ambiguity on binary curves
    - B-coefficient variation (record; B-sweep deferred to curve-blindness lane)
    - rank-tolerance/threshold for fall detection
  interpretation_limits:
    - Scope is tested n,m,k, characteristic 2, labelled degree notions only; transfer to larger n requires unstated stability assumption which is NOT established.
    - Success (divergence/Def-split) FAILS to corroborate Nagao Theorem 1: ordinary scoped science, preferred; no breakthrough implication.
    - Full-agreement outcome (all triples agree <=4) WOULD corroborate the disputed proposition and is breakthrough-adjacent: flag explicitly, requires breakthrough-tier review, and still makes NO claim about any deployed curve's security.
    - A timeout/crash/budget miss is infrastructure signal, never evidence on the proposition.
  heuristic_assumptions:
    - id: H1
      statement: |
        FORMAL (proposition under test, conditional): IF Nagao Def.6-fake bound d_fake<=4 is preserved under affine coset shift V->V+v_i for the tested (n,m,k) family, THEN Nagao Def.5-true bound d_true<=4 is preserved on the same matched pairs (i.e. Def.6 preservation implies Def.5 preservation at tested scale).
      rigorous_support: |
        No rigorous support for the implication; it is the disputed step (KR-IC-889857). Partial analogue only: unshifted S_3 descent has structural low fall via Tr(x) morphism under HPS conditions (KR-IC-f5c584), and last-fall boundedness holds under HKY conditions independently of n (KR-IC-fbdb61); neither covers the shifted Def.6=>Def.5 implication.
      validation_plan: |
        Sampling: matched (v=0,v!=0) batch at maximal exact n<=24 plus smaller-n sweep. Comparison distribution: batch divergence rate D and gap G vs null of zero divergence (exact binomial/Fisher test on pairs). Tail checks: divergence rate vs n and vs coset dimension; stability across seed/order shuffles; report parameters and transfer assumption explicitly.
  target_complexity:
    time_exponent: no exponent change claimed; diagnostic at fixed n<=24 with per-system cost poly in N via C(N+4,4) rank over GF(2)
    memory_exponent: no exponent change claimed; matrix C(N+4,4) columns at tested N only
    best_known: vOW parallel rho ~2^{n/2} generic at FIPS binary labels; KR-IC-1fcdbc measured negative (summation far slower than rho at tested sizes)
    hidden_overhead: none claimed; binomial C(N+4,4) made exact, not N^4
    tradeoff_note: memory-heavy rank certificate at fixed toy N; no time-memory tradeoff claimed beyond exact matrix dims
