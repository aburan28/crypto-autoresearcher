idea:
  id: IDEA-20261006-8f4f02
  question_id: RQ-SEMBIN-9e8f82
  status: proposed
  added: '2026-10-06'
  approved_by: null
  title: "Matched-pair Def.5-true vs Def.6-fake vs Macaulay-rank split under Nagao coset shift at maximal exact n"
  class: measurement
  claim: |
    On matched (n,m,k,seed/order/routine) pairs with n<=24, the Nagao coset shift (v_i!=0, EQS4) preserves Nagao Def.6 fake-FFD <=4 while Nagao Def.5 true-FFD exceeds 4 or degree-4 Macaulay rank fall diverges (present/absent flip or >=1 degree-step gap) on >=1 pair; i.e. the three labelled quantities disagree after shift, showing the proposition conflates distinct degrees. Falsified at tested scope if zero divergent pairs occur with the corrected routine.
  mechanism: |
    OBJECT FRAME: point representation R_bin = x-coordinate of E/F_{2^n}: y^2+xy=x^3+Ax^2+B restricted to Nagao affine coset V+v, encoded as m-bit vector in a fixed F2-basis of F_{2^n}, Weil-descended to F2 via S_3=(x1x2+x1x3+x2x3)^2+x1x2x3+B (Nagao Def.1 / KN-LIT-fa346d family); y recovered via curve equation where needed. Operation set Sigma_Fb = translation by factor-base elements only, P->P+Q for Q in Fb, partial (defined only while the chained-S_3 relation search stays inside the coset pattern).
    TRICHOTOMY: Class I partial-action, because the tracked relation/degree descriptor propagates deterministically only under Sigma_Fb translations and is undefined under arbitrary group translations; not branching (no search-tree split tracked) and not coordinate-dependent (y-recovery ambiguity priced as confounder, not tracked state).
    LOSSY-PROJECTION TEST vs Sigma_Fb: tracked object D=(degree-label in {Def5-true, Def6-fake, Semaev-d_F4, Macaulay-rank-fall}, value, C(N+4,4) dims). Discard: full Macaulay entries, coefficient values, monomial-order details, relation order. Sigma-compatibility: translation by Q in Fb permutes coset labels/relation indices deterministically so D recomputed on the translated system equals D translated, without discarded entries. Lossiness: many distinct full systems (different bases/seeds preserving the coset pattern) map to one D; many-to-one, hence genuinely lossy, not a coordinate change.
    PRICE THE OPEN NUMBER: open number = per-pair agreement of the labelled triple. Plan: build degree-4 Macaulay matrices of exact size C(N+4,4) over GF(2) in pure Python at toy (n<=24, small m,t), record per-side triple (Def5-true value, Def6-fake value, rank-fall present/absent+degree) on matched v=0 EQS2 vs v!=0 EQS4; controls: v=0 identity baseline, random-label shuffle, generic random-Boolean system of same (N,degree) to detect solver artifact.
    F2 DELTA: adds the Def-split beyond Semaev descent + Nagao cosets; proposes no new descent, factor base, or solver. Extends IDEA-20260913-352163 (which decides invariance without splitting Def.5/Def.6) and reuses the corrected XOR product of IDEA-20260929-688ea4.
    FACTOR-BASE ESCAPE: inside KN-OPEN-020 scoped-out class (explicit low-degree affine-coset membership); no escape claimed; stops per constraint (f).
  novelty_status: unverified
  citations:
