idea:
  id: IDEA-20260828-b0694b
  question_id: RQ-SHAONE-081e3a
  added: '2026-08-28'
  title: 'Audit the fragmentation, not just the criterion: real independently-versioned deployed copies
    of the SAME nominal counter-cryptanalysis specification (git.git''s pinned submodule commit, upstream
    HEAD, and at least one independent re-implementation) diverge on flag decisions for a battery of
    boundary-case messages, and no single-copy audit in this batch can see that divergence.'
  class: control
  claim: '(A) Every detector-audit proposal in this batch -- the symbolic coverage enumeration (IDEA-20260816-3edd14),
    the error-rate instrument (IDEA-20260816-70b60d), the real-artifact floor check (IDEA-20260828-2804d3),
    and the cross-family adversarial construction (IDEA-20260828-ca6584) -- audits EXACTLY ONE implementation
    of the detector at a time, whether re-implemented from specification or obtained as a single real
    build. None asks whether "the deployed detector" is actually a SINGLE artifact at all. It is not:
    git.git vendors sha1collisiondetection as a submodule pinned to a specific historical commit (publicly
    documented as commit 007905a93c973f55b2daed6585f9f6c23545bf66, retrieved via WebSearch 2026-08-28),
    which can lag behind the upstream cr-marcstevens/sha1collisiondetection repository''s current HEAD
    by an arbitrary amount of time; and at least one independent re-implementation in a different language
    exists and is separately deployed (pjbgf/sha1cd, a Go re-implementation, retrieved via WebSearch
    2026-08-28). A message that is safe under one deployed copy''s exact pinned version and unsafe (or
    vice versa) under another is a real, concrete coverage gap that exists ENTIRELY INDEPENDENTLY of
    whether the underlying mathematical criterion is complete -- it is a SUPPLY-CHAIN and VERSION-FRAGMENTATION
    object, structurally disjoint from anything a single-copy mathematical audit can see, however thorough.
    (B) This is measurable without constructing any new SHA-1 collision: build the git.git-pinned commit,
    the current upstream HEAD, and the independent re-implementation (to the extent each is buildable
    within this harness''s environment), and run all three against an IDENTICAL battery of inputs --
    the real public SHAttered/SHAmbles artifacts IDEA-20260828-2804d3 already establishes provenance
    for, plus a battery of near-collision-adjacent synthetic messages built with this batch''s own message-modification
    machinery (KN-TECH-066) at points specifically chosen to sit near any documented change between
    the pinned commit and current HEAD, if the commit history between them names a detection-logic change
    at all. (C) The claim is that pairwise agreement or disagreement across the three real, independently-versioned
    copies is directly observable, that any disagreement localises to a specific commit-range or implementation-language
    boundary rather than to an abstract mathematical gap, and that this is a genuinely different -- and
    genuinely simpler to demonstrate, since it needs no adversarial construction at all -- kind of coverage
    finding than anything else filed against this RQ: a real user running "the same" safety check via
    two different real, currently-deployed paths (e.g. `git commit` locally versus a CI pipeline built
    on a different language binding) could, if this proposal finds disagreement, receive two different
    answers about the identical bytes. (D) WHAT IS NOT CLAIMED: no new SHA-1 collision, no assertion
    about which of any disagreeing copies is "correct" (STAGE 6 localises but does not adjudicate correctness
    beyond what direct recomputation against the mathematical specification can establish), no assertion
    about any specific deployed repository''s actual exposure, and no claim that version staleness in
    general is dangerous -- only a measured statement about these specific real, obtainable copies. (E)
    A finding of full agreement across all three copies on every tested input, including the boundary-case
    battery, is a fully valuable and genuinely informative result: it would be the first evidence this
    program''s corpus holds that the detector''s coverage is STABLE across real independent deployments
    and implementation languages, which is a precondition for the RQ''s detector-completeness question
    meaning anything for actual users rather than for one audited copy in isolation.'
  mechanism: 'STAGE 1: obtain and build three real artifacts -- (i) the exact commit git.git currently
    vendors as its sha1collisiondetection submodule (publicly documented pinned commit, to be confirmed
    against the actual git.git source tree rather than carried from a search snippet), (ii) the current
    upstream HEAD of cr-marcstevens/sha1collisiondetection, and (iii) an independent re-implementation
    in a different language if one is obtainable and buildable within this harness''s environment (e.g.
    pjbgf/sha1cd in Go) -- recording exact commit hashes, build commands, and build success or failure
    for each. Any copy that cannot be built within budget is reported as unavailable, not silently dropped.
    STAGE 2: retrieve the commit history between (i) and (ii) from the real, public repository and read
    it for any commit whose message or diff describes a detection-logic change (a new or corrected disturbance
    vector, a UBC fix, a changed threshold) as opposed to a build-system, portability, or performance-only
    change -- this reading is itself zero-compute and gates STAGE 4''s battery design. STAGE 3: run all
    three buildable copies against the real public SHAttered and SHAmbles artifacts (sharing IDEA-20260828-2804d3''s
    provenance-confirmed downloads rather than re-acquiring them) and report pairwise agreement. STAGE
    4: if STAGE 2 identifies any detection-logic-changing commit between the pinned and HEAD versions,
    construct a synthetic message battery specifically targeting the boundary that commit changed (e.g.
    a message satisfying the old criterion''s conditions but not the new one''s, or vice versa, built
    with this batch''s message-modification machinery); if STAGE 2 finds no such commit, this arm is
    reported as not applicable rather than fabricated. STAGE 5: run all three copies against a general
    boundary-case battery of near-collision-adjacent synthetic messages (reusing or adapting IDEA-20260816-70b60d''s
    corpus-construction discipline) regardless of STAGE 2''s outcome, since undocumented behavioural
    drift (a bug fix not described as detection-relevant, or a silent regression) is exactly the kind
    of divergence a changelog reading alone would miss. STAGE 6: for every disagreement found across
    any pair of copies on any input, localise it to the specific commit range (for the two C-language
    copies) or to the implementation-language boundary (for the Go re-implementation), and report the
    disagreeing input, its digest, and the specific flag values from each copy -- never as a bare disagreement
    count. STAGE 7, null control: run all three copies against a battery of matched-length benign random
    messages, confirming that any observed disagreement is attributable to near-collision-adjacent structure
    and not to an unrelated implementation quirk (e.g. an encoding or line-ending handling difference)
    that would show up on ordinary inputs too.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read RQ-SHAONE-081e3a and GOAL-SHA1-001 in full. Read all fourteen filed proposals against
      RQ-SHAONE-081e3a in full (the ten from 2026-08-16 and the four filed earlier today), with particular
      attention to IDEA-20260828-2804d3, the closest relative (real deployed library, real public artifacts),
      whose own text builds and tests exactly ONE library copy and never mentions a second deployed
      version, a pinned-commit-versus-HEAD comparison, or an independent re-implementation. Grepped
      ledger/proposals for ''version drift|vendored|submodule|pinned commit|fragmentation'' (matches
      outside the SHAONE bucket confirmed unrelated by sampled inspection; zero hits combining any of
      these terms with SHA-1 or the detector). WebSearched to confirm the real, public existence of
      multiple independently-maintained copies: git.git''s vendored submodule at a documented pinned
      commit, the upstream cr-marcstevens/sha1collisiondetection repository''s independent commit history,
      and pjbgf/sha1cd as a real, separately-maintained Go re-implementation.'
    results: 'No proposal filed against RQ-SHAONE-081e3a, and none found by the targeted greps elsewhere
      in ledger/proposals, treats the deployed detector as a MULTIPLICITY of independently-versioned
      real artifacts rather than a single audited copy. IDEA-20260828-2804d3 explicitly builds "the
      actual open-source counter-cryptanalysis library exactly as deployed" (singular) and its own discriminated_from
      list does not mention a second copy or a version-comparison axis. IDEA-20260816-70b60d and IDEA-20260816-3edd14
      both concern a single re-implementation''s error rate or symbolic coverage, never a comparison
      across real deployed variants. WebSearch confirms three real, independently obtainable artifacts
      exist: git.git''s pinned submodule commit (007905a93c973f55b2daed6585f9f6c23545bf66, per search
      result, to be confirmed against the actual source tree before use), the upstream repository''s
      current HEAD, and pjbgf/sha1cd as a genuinely independent Go re-implementation.'
    verdict: 'UNVERIFIED. No claim is made about whether cross-deployment version-drift auditing of
      this specific detector has been performed by anyone outside this program -- git and GnuPG maintainers
      plausibly track upstream changes routinely as part of ordinary dependency maintenance. What is
      claimed new internally: this repository holds zero proposals treating detector coverage as a MULTI-ARTIFACT
      supply-chain property rather than a single implementation''s mathematical or empirical property,
      and the specific construction -- three real buildable copies, a changelog-driven boundary-case
      battery conditional on STAGE 2''s findings, a general boundary-case battery regardless, and a
      benign-message null separating structural disagreement from incidental implementation quirks --
      is assembled from IDEA-20260828-2804d3''s real-artifact discipline plus this program''s own null-control
      methodology, applied to an object (multiplicity of real deployments) no existing SHAONE proposal adopts.'
  citations:
    - ref: "https://github.com/git/sha1collisiondetection"
      provenance: retrieved
      claim: "Git.git vendors Marc Stevens's sha1collisiondetection library as a pinned-commit submodule, described as \"for use by git.git as its submodule\"; a WebSearch result reports the pinned commit as 007905a93c973f55b2daed6585f9f6c23545bf66."
      verified_by: "WebSearch 2026-08-28; the exact pinned commit hash and its currency must be independently confirmed against the real git.git source tree before STAGE 1 proceeds, per this proposal's own STAGE 1 requirement -- the search-reported hash is not treated as ground truth without that confirmation."
    - ref: "https://github.com/cr-marcstevens/sha1collisiondetection"
      provenance: retrieved
      claim: "Upstream repository with an independent, ongoing commit history separate from git.git's pinned vendored copy, including commits by cr-marcstevens and other contributors with Makefile, performance, and portability fixes over time."
      verified_by: "WebSearch 2026-08-28, repository and commit-history existence confirmed; full commit-by-commit diff review not performed by this session and is STAGE 2's own task."
    - ref: "https://github.com/pjbgf/sha1cd"
      provenance: retrieved
      claim: "An independent Go re-implementation of SHA-1 with collision detection, described as \"SHA1 implementation with collision detection\", a separately-maintained artifact in a different implementation language from the C reference."
      verified_by: "WebSearch 2026-08-28, repository existence and description confirmed; source not read, buildability within this harness's environment not yet confirmed."
    - ref: "eprint 2017/173 (Stevens, \"Speeding up detection of SHA-1 collision attacks using unavoidable attack conditions\")"
      provenance: retrieved
      claim: "The underlying mathematical specification all three real artifacts nominally implement, and the primary text against which any localised disagreement must ultimately be checked."
      verified_by: "WebSearch snippet 2026-08-28; full primary text not opened. File as KN-LIT before STAGE 1, per RQ constraint, shared with IDEA-20260828-2804d3's and IDEA-20260828-20f0fb's identical gating requirement."
    - ref: KN-TECH-066
      provenance: internal
      claim: "Message-modification/degrees-of-freedom accounting supplies the construction method for this proposal's synthetic boundary-case battery."
      verified_by: "Read in full this session, knowledge/techniques/KN-TECH-066.md."
    - ref: "IDEA-20260828-2804d3"
      provenance: internal
      claim: "Establishes the real public-artifact acquisition and provenance-confirmation step (SHAttered/SHAmbles digests) this proposal shares rather than duplicates, and audits a single detector copy, the object this proposal generalises to multiple copies."
      verified_by: "Read in full this session."
  object_first_candidate:
    tracked_object: 'The flag-decision VECTOR across real, independently-versioned deployed copies for
      a single input: (copy identity, exact commit or version, flag outcome), carried per tested message.
      What is followed is the AGREEMENT PATTERN across real deployments -- not across entry points or
      delivery mechanisms as IDEA-20260828-2804d3 tracks, but across genuinely distinct, independently
      maintained ARTIFACTS nominally implementing the same specification.'
    lossiness: 'Genuinely lossy. The projection discards the full source code and implementation details
      of each copy, retaining only a flag bit per (copy, input) cell plus, where a disagreement is found,
      the localising commit range or language boundary. It is compatible with the detector''s operation
      because the flag decision is exactly what each copy computes and reports, and pairwise comparison
      of flag vectors is well-defined regardless of how each copy''s internals differ. What is lost is
      any WHY beyond the coarse localisation STAGE 6 performs -- a disagreement is attributed to a commit
      range or a language boundary, not to a specific line of code, which is why STAGE 6 explicitly retains
      the disagreeing input and its digest for follow-up rather than discarding it once the localisation is reported.'
    propagation: 'One step of the target operation is running one input through one buildable copy.
      It adds one cell to the (copy, input) -> flag table; the table is complete once every buildable
      copy has processed every battery input, at which point pairwise agreement is a direct set comparison
      requiring no further computation.'
    survival_score: 'The object survives as long as at least two of the three targeted copies are buildable
      within this harness''s environment -- if only one builds, the entire cross-deployment comparison
      collapses to a single-copy audit IDEA-20260828-2804d3 already performs, and this proposal degrades
      gracefully to reporting that boundary as a build-availability outcome rather than a coverage finding.
      It also depends on STAGE 2 finding at least one genuine implementation difference between the
      pinned commit and HEAD (a version gap must actually exist for "version drift" to be a meaningful
      object at all); if the pinned commit and HEAD are identical or near-identical with no detection-relevant
      changes, the object still exists (the comparison is still run) but the finding degenerates to
      "no drift has yet accumulated," which per claim (E) is itself a valuable, reportable outcome.'
  null_object_control: 'A battery of matched-length, non-near-collision-structured benign random messages,
    run through all three buildable copies in the same invocation as the boundary-case battery. If any
    pair of copies disagrees on BENIGN messages at a rate comparable to their disagreement rate on the
    boundary-case battery, the observed divergence is attributable to an incidental implementation quirk
    (encoding handling, buffering, an unrelated bug) rather than to genuine detection-logic drift, and
    the version-drift finding is void until the confound is identified and separated out.'
  discriminated_from:
    - 'IDEA-20260828-2804d3 (real deployed library run against real public artifacts, entry-point/chunk-boundary
      sensitivity): audits exactly ONE real library build against real artifacts, testing whether the
      flag decision is invariant to HOW bytes are delivered to that single copy''s API; this proposal
      audits MULTIPLE real, independently-versioned copies against the SAME inputs delivered identically,
      testing whether the flag decision is invariant to WHICH real deployed copy answers. The two objects
      are orthogonal (delivery-mechanism invariance versus cross-deployment agreement) and this proposal
      explicitly shares 2804d3''s artifact-acquisition and provenance-confirmation work rather than repeating it.'
    - 'IDEA-20260816-70b60d (detector as instrument, false/true-positive rates): measures error rates
      for a single re-implementation against declared corpora; this proposal never computes a false-positive
      or true-positive rate and instead computes pairwise agreement across real, distinct artifacts,
      an entirely different statistical object.'
    - 'IDEA-20260816-3edd14 (disturbance-vector coverage enumeration): a purely symbolic audit of one
      criterion''s mathematical coverage; this proposal never enumerates disturbance vectors symbolically
      and instead compares real, executable artifacts'' behaviour, a supply-chain object with no symbolic analogue in that proposal.'
    - 'IDEA-20260828-ca6584 (cross-disturbance-vector-family adversarial construction): tests whether
      ONE independently-derived detector, built by this program, generalises across attack FAMILIES;
      this proposal tests whether MULTIPLE real, independently-maintained deployments of the SAME nominal
      specification agree with EACH OTHER, a disjoint axis (family generalisation of one artifact versus
      version/implementation agreement across several).'
    - 'IDEA-20260828-20f0fb (detector timing side channel): concerns the detector''s running-time behaviour
      as an information source; this proposal concerns the detector''s flag-decision agreement across
      real deployed variants, sharing no observable and no measurement methodology with that proposal.'
    - 'A generic warning that "software has versions and versions can drift": that is an assertion; this
      proposal builds three specific real artifacts, reads their actual commit history for detection-relevant
      changes, constructs a boundary-case battery informed by what that reading finds, and reports pairwise
      agreement with a benign-message null and per-disagreement localisation.'
  assumptions:
    - 'The counter-cryptanalysis specification (eprint 2017/173) is obtainable in primary text and filable
      as KN-LIT, per the RQ''s binding constraint, shared with this batch''s other detector-audit proposals; if not, STAGE 1 does not proceed.'
    - 'At least two of the three targeted real copies (git.git''s pinned commit, upstream HEAD, the
      independent re-implementation) are buildable within this harness''s environment; a copy that cannot
      be built within budget is reported as unavailable, per AGENTS.md rule 3, rather than silently omitted from the comparison''s scope statement.'
    - 'The publicly reported pinned-commit hash for git.git''s vendored submodule is confirmed against
      the actual current git.git source tree before use, rather than trusted from a single search result;
      if the reported hash is stale or wrong, STAGE 1 re-derives the correct pinned commit directly from the source.'
    - 'A disagreement found between two copies is attributable to an actual implementation or version
      difference and not to a build-environment artifact (differing compiler flags, differing default
      configuration); STAGE 7''s benign-message null and consistent build-recording across copies are
      the mitigations, and their sufficiency is stated as a limitation if a disagreement cannot be cleanly localised.'
    - 'Reading the commit history between the pinned commit and HEAD for detection-relevant changes
      (STAGE 2) is a reliable way to identify candidate boundary-case inputs; an undocumented or poorly-described
      change could be missed by this reading, which is exactly why STAGE 5''s general boundary-case
      battery is run regardless of STAGE 2''s findings rather than replacing it.'
  proof_search_map:
    not_applicable_reason: >-
      This is an empirical comparison of real, existing software artifacts' behavioural agreement, not
      a proof of a theorem or a claimed algorithmic ceiling. There is no bottleneck step whose removal
      changes a theorem, no certificate-carrying observable requiring a collision search, and no constructive
      transform being attempted; KN-TECH-080's proof-architecture apparatus does not apply. The nearest
      analogue is the benign-message null control in `mechanism` STAGE 7, which separates genuine detection-logic
      drift from incidental implementation quirks.
  predictions:
    - metric: pairwise flag-decision agreement rate across all three buildable copies, on the real SHAttered/SHAmbles artifacts
      direction: higher
      minimum_effect: 'predicted full agreement (all copies flag all four real artifacts); this is the
        well-known, expected outcome and any disagreement here would be this batch''s most significant single finding'
    - metric: count of detection-logic-changing commits identified between the pinned commit and upstream HEAD (STAGE 2)
      direction: different
      minimum_effect: 'explicit refusal to pre-commit a count: whether such commits exist at all, and
        how many, is an empirical fact about a real, specific commit range this proposal has not yet
        read, and pre-committing a number would fabricate a finding before the reading is done'
    - metric: pairwise flag-decision agreement rate on the boundary-case battery (STAGE 4-5), conditional
        on at least two copies building
      direction: different
      minimum_effect: 'no pre-committed value: the entire design exists to discover whether disagreement
        occurs at all on inputs specifically chosen to probe version and implementation boundaries,
        and pre-committing a rate would prejudge the result'
    - metric: pairwise flag-decision agreement rate on the matched-length benign-message null (STAGE 7)
      direction: higher
      minimum_effect: 'predicted at or near full agreement; any material disagreement here indicates
        an incidental implementation quirk unrelated to detection logic, and voids attribution of any
        boundary-case disagreement to genuine version drift until the quirk is identified and separated out'
  minimal_test:
    design: 'The cheapest discriminating step is STAGE 1 plus STAGE 2 alone, with no message battery
      run yet: build the git.git-pinned commit and the upstream HEAD (the two C-language copies, deferring
      the Go re-implementation as a stretch goal), confirm the pinned commit hash directly against the
      real git.git source tree, and read the commit history between the two for any detection-logic-changing
      commit. This costs a build and a reading task, no cryptographic compute, and settles the question
      that determines whether the rest of the design has anything to find: does version drift between
      these two specific real artifacts actually exist at the detection-logic level, or are they identical
      or near-identical? If STAGE 2 finds no such commit, the proposal proceeds directly to STAGE 5''s
      general boundary-case and STAGE 7''s null (skipping the STAGE 4 changelog-targeted arm as not
      applicable) and reports a "no known drift" finding, which per claim (E) is fully valuable. If STAGE
      2 finds one or more such commits, the STAGE 4 targeted battery becomes the highest-value next step,
      since it tests exactly the boundary a real, documented change moved.'
    controls:
      - 'Matched-length benign random-message null battery, run through all buildable copies in the same invocation as any boundary-case battery.'
      - 'Exact commit hash and build configuration recorded for every copy, so any future re-run can be checked for drift in the AUDIT''s own build, not only the audited artifacts.'
      - 'Digest-match confirmation for the real SHAttered/SHAmbles artifacts, sharing IDEA-20260828-2804d3''s provenance chain rather than re-deriving it.'
      - 'Every disagreement retained with the disagreeing input, its digest, and the specific flag value from each copy -- never collapsed to a bare disagreement count.'
    required_metrics:
      - 'build success/failure and exact commit hash or version identifier, per targeted copy'
      - 'count and description of detection-logic-changing commits found between the pinned commit and HEAD'
      - 'pairwise flag-decision agreement rate on the real public artifacts, per copy pair'
      - 'pairwise flag-decision agreement rate on the boundary-case battery (changelog-targeted and general), per copy pair'
      - 'pairwise flag-decision agreement rate on the benign-message null, per copy pair'
      - 'for every found disagreement: the input, its digest, and the specific flag value from each copy'
  falsification_conditions:
    - 'Fewer than two of the three targeted copies can be built within budget, collapsing the comparison
      to a single-copy audit already performed by IDEA-20260828-2804d3 and reported as a build-availability boundary rather than a coverage finding.'
    - 'The two C-language copies (pinned commit and HEAD) disagree on the real SHAttered/SHAmbles artifacts
      themselves, which would be a startling and immediately reportable finding, or -- more likely per
      claim (E) -- they agree fully, closing that specific arm with a clean positive.'
    - 'Any pair of copies disagrees on the benign-message null (STAGE 7) at a rate comparable to their
      boundary-case disagreement rate, showing the divergence is an incidental implementation quirk
      rather than genuine detection-logic drift, voiding attribution until the quirk is separated out.'
    - 'The publicly reported pinned-commit hash cannot be confirmed against the actual git.git source
      tree, indicating the citation is stale or wrong and requiring STAGE 1 to re-derive the correct commit before proceeding.'
    - 'A found disagreement cannot be localised to a specific commit range or implementation-language
      boundary within budget, in which case it is reported as an unresolved observed disagreement rather than a fully attributed finding.'
  confounders:
    - 'Build-environment differences (compiler version, platform, optimisation flags) between the copies
      could produce behavioural differences unrelated to the copies'' own version or implementation logic;
      recorded build configuration per copy is the mitigation, and the benign-message null is the direct check.'
    - 'The Go re-implementation, being in a different language entirely, may differ from the C copies
      in ways attributable to language-level semantics (integer overflow behaviour, endianness handling)
      rather than to the collision-detection LOGIC specifically; any disagreement involving the Go copy
      is reported with this caveat explicitly stated rather than treated identically to a C-versus-C disagreement.'
    - 'Commit-message text (STAGE 2) may understate or misdescribe the actual behavioural effect of a
      change, or a change described as build-system-only could have an incidental detection-logic side
      effect; this is why STAGE 5''s general boundary-case battery is run regardless of what STAGE 2''s reading concludes.'
    - 'The publicly reported pinned-commit hash may itself be stale relative to this proposal''s execution
      date if git.git has since updated its submodule pin; STAGE 1''s direct confirmation against the
      real source tree is the mitigation, not the search-result citation.'
  interpretation_limits:
    - 'A found disagreement is a statement about these three specific real artifacts at these specific
      versions, confirmed at execution time; it is not a permanent property of "the detector" and would
      need re-confirmation against the then-current versions of each artifact to remain current.'
    - 'This proposal does not adjudicate which of any disagreeing copies is "correct" relative to the
      mathematical specification beyond what direct recomputation can show; a full adjudication would
      require the same primary-text-grounded criterion audit IDEA-20260816-3edd14 performs, separately.'
    - 'A finding of full agreement across all tested copies and inputs is evidence of stability for THESE
      copies at THIS point in time; it is not a guarantee that no future version will diverge, and this
      record makes no forward-looking claim.'
    - 'Nothing here is a statement about the security of any specific deployed system, repository, or
      certificate, per the RQ''s binding constraint; a finding here is a statement about the relationship
      between specific public software artifacts, not about any consequence for a system that runs one of them.'
  heuristic_assumptions:
    - id: H1
      statement: >-
        Independently-versioned real deployments of a nominally identical security-critical specification
        accumulate behavioural drift at a rate proportional to the elapsed time (or commit distance)
        since their common ancestor, and detection-relevant drift specifically (as opposed to build-system
        or performance drift) is a small but nonzero fraction of total commits -- treated here as a testable
        hypothesis rather than a known rate, analogous to a mutation-accumulation model where most changes
        are neutral (build/performance) and a small minority are functionally consequential (detection logic).
      rigorous_support: >-
        No proved theorem; it is a general software-engineering regularity (dependency staleness accumulates
        with elapsed time and most commits to a mature security library are non-functional maintenance)
        applied here as a scale expectation for how likely STAGE 2 is to find a detection-relevant commit
        at all, which this proposal treats as the untested step to check empirically rather than assume.
      validation_plan: >-
        Sample: the single real, specific commit range between git.git's pinned submodule commit and
        upstream HEAD, n=1 population (there is exactly one such range at any given execution time,
        not a distribution to sample from); the commit-by-commit reading in STAGE 2 is exhaustive over
        this range rather than a sample of it. Shortcut: none needed, since this is direct reading of
        a real, public, finite commit log rather than a computational sampling problem. Comparison:
        the reported count and description of detection-logic-changing commits found, compared against
        H1's qualitative expectation ("most commits are non-functional, a minority are detection-relevant")
        by simple proportion, not a fitted distribution given the small population. Tail check: if the
        commit range is large, the single most consequential-looking commit (by description) is the
        one STAGE 4's targeted battery is built against first, since it is the tail case most likely
        to produce an observable disagreement if H1's premise (that detection-relevant drift exists at all) holds.
  target_complexity:
    time_exponent: >-
      No attack exponent is claimed. The deliverable is a pairwise agreement/disagreement table across
      real software artifacts at declared versions.
    memory_exponent: >-
      No attack memory exponent is claimed. Memory cost is that of building and running a small number
      of real open-source libraries against a modest message battery, negligible and not a cryptanalytic quantity.
    best_known: >-
      The incumbent is the unstated assumption -- shared by every other detector-audit proposal filed
      against this RQ, including today's own real-artifact floor check (IDEA-20260828-2804d3) -- that
      auditing ONE deployed copy of the detector characterises "the detector" as a real-world safety
      mechanism, when in fact multiple independently-versioned real deployments of the nominal same
      specification exist and could disagree with each other on the identical bytes. No algorithm is
      beaten; an unaudited multiplicity is audited for the first time in this repository.
    hidden_overhead: >-
      Building three real open-source artifacts, each with its own build system and dependencies, within
      this harness's environment is genuine infrastructure work with a real chance that one or more
      copies simply will not build here, which is disclosed as the design's primary risk (mitigated
      by degrading gracefully to whichever subset builds, per `null_object_control` and `assumptions`)
      rather than smoothed over. Reading a real commit history for detection-relevant changes (STAGE
      2) is open-ended human-analyst-style work whose thoroughness cannot be fully automated.
    tradeoff_note: >-
      not applicable; no time-memory tradeoff is exercised by comparing real software artifacts' flag decisions on a fixed message battery.
  dominated_by: >-
