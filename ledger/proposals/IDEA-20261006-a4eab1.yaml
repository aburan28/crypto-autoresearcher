idea:
  id: IDEA-20261006-a4eab1
  question_id: RQ-SDEG-001
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    Grevlex quotient dimension equals the witness count, or equals 1,
    on eight hits at F_43
  class: measurement
  claim: >-
    On one ordinary short-Weierstrass curve over F_43, one factor base
    of B = 5 abscissae, take eight hit targets whose witness count w
    lies in {1, 2, 3, 4}. A witness is an unordered pair of distinct
    base points that sum to the target or to its negative. Let q be
    the number of standard monomials in the reduced grevlex basis of
    the ordinary S_3 ideal with the two membership polynomials. Either
    q equals w for at least six of the eight targets, or q equals 1
    for at least six of the eight. The first reading means the
    quotient still counts decompositions. The second means the basis
    has collapsed those witnesses to a one-dimensional quotient. A
    finished eight in which q equals w on at most five targets and q
    equals 1 on at most five targets is the concrete negative: neither
    reading holds. Representation class R1; attack stage is the shape
    of the reduced basis inside relation decomposition. No exponent
    is moved.
  mechanism: >-
    The tracked object is the pair (w, q) on hit targets. w is counted
    by point addition. q is counted from the grevlex standard
    monomials. The solver is not the witness counter. Representation:
    R1, the coefficient array of ordinary S_3 and of the degree-B
    membership polynomials. Operation set Sigma: grevlex reduction,
    then enumeration of monomials outside the leading-term ideal.
    Sigma is not group translation. Trichotomy class:
    coordinate-dependent, because a standard monomial is a property of
    the polynomial representation and of the order. Lossy projection
    against Sigma: the pair (w, q) discards the actual basis
    polynomials and keeps two integers. The priced open number is the
    count of targets on which q = w, with separator 6, and the count
    on which q = 1, with the same separator.
  novelty_status: unverified
  citations:
    - ref: KR-IC-5a43e5
      provenance: internal
      claim: >-
        S_3 vanishes when the abscissae are those of points that sum
        to the identity up to signs. The row does not state the
        dimension of the quotient.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
    - ref: KR-IC-5931ee
      provenance: internal
      claim: >-
        Naive prime-field Semaev index calculus does not beat generic
        methods under the assumptions of that row. Baseline only.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5931ee.yaml
    - ref: KN-OPEN-002
      provenance: internal
      claim: >-
        Prime-field solving degree is open. Quotient dimension is a
        different coordinate on the same systems.
      verified_by: knowledge/open-problems/KN-OPEN-002.md
  assumptions:
    - >-
      w counts unordered pairs of distinct lifted base points summing
      to the target or its negative. Ordered pairs and signs are not
      double-counted.
    - >-
      q is the number of monomials in x1, x2 that the reduced grevlex
      basis does not reduce, including the constant 1 when it remains.
    - >-
      Only hits with w in {1, 2, 3, 4} enter the eight. A target
      outside that range is skipped and is not a disagreement.
    - >-
      No symmetrized summation polynomial is introduced.
  predictions:
    - metric: >-
        number of the eight hits with q = w, and number with q = 1
      direction: different
      minimum_effect: >-
        at least six targets with q = w supports the counting
        reading; at least six with q = 1 supports collapse. Both
        counts at most five is the concrete negative.
  minimal_test:
    design: >-
      On one ordinary curve over F_43, draw one factor base of size 5.
      Draw targets until eight hits with w in {1, 2, 3, 4} are
      collected, or until 64 targets have been drawn. For each scored
      hit, reduce the S_3 ideal and count standard monomials. Compare
      the two counts with the separator 6.
    controls:
      - >-
        Witnesses are counted by point addition before the solver
        runs. The solver does not label w.
      - >-
        Eight support-matched random consistent systems, each planted
        with a known number of roots s in {1, 2, 3, 4}. If q equals s
        on fewer than six of them, the monomial counter is not
        counting roots and the Semaev comparison is void as an
        instrument failure.
      - >-
        A second build recomputes q on the first scored hit.
    required_metrics:
      - eight pairs (w, q)
      - count of q = w
      - count of q = 1
      - random-arm count of q = s
      - second-build match
  falsification_conditions:
    - >-
      The eight hits are complete and q equals w on at most five of
      them and q equals 1 on at most five of them. Neither reading
      holds. That is the concrete negative.
    - >-
      The random arm has q equal to the planted root count on fewer
      than six systems. The instrument is then not counting roots.
      That outcome is not a Semaev negative.
    - >-
      After 64 draws, fewer than eight hits in range have been
      collected. The comparison is inconclusive.
  confounders:
    - >-
      Distinct pairs can share an abscissa pattern and contribute two
      geometric points or one. w is the number of point pairs, and q
      counts monomials. A mismatch of those units is the measurement,
      and it is recorded per target rather than repaired after the fact.
    - >-
      A basis that is not fully reduced can inflate q. The second
      build must match, and the random arm must count its planted
      roots.
  interpretation_limits:
    - >-
      One prime and B = 5. Agreement of q with w here is not a
      certificate format for large factor bases.
    - >-
      This does not compare hits with misses, and it does not measure
      a solving-degree mean.
    - >-
      A one-dimensional quotient is not a statement that the discrete
      log is unique.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For a radical zero-dimensional ideal over a field, the number
        of standard monomials equals the number of distinct roots,
        counted without multiplicity when the roots are simple. On
        this S_3 cell the witness count w is that number of roots.
      rigorous_support: >-
        The equality of quotient dimension and the number of points
        is the usual shape lemma for a radical ideal in a polynomial
        ring over a field. This session did not open a textbook proof
        of that lemma. The assumption that w, as counted by point
        addition, equals the number of distinct affine roots of the
        specialized ideal is the part that can fail, because of signs,
        order, and shared abscissae. The random arm, whose roots are
        planted, is the check that the monomial counter implements the
        equality. No transfer beyond p = 43 and B = 5 is assumed.
      validation_plan: >-
        The eight planted random systems must show q = s on at least
        six replicates. Tail check: the maximum of q minus s among
        the eight. Parameters stop at this cell.
  target_complexity:
    time_exponent: >-
      not beaten. Pollard rho remains Theta(N^{1/2}) group operations.
    memory_exponent: >-
      not beaten. A toy quotient dimension is not a memory exponent.
    best_known: >-
      Pollard rho at Theta(N^{1/2}); KR-IC-5931ee is the prime-field
      Semaev comparison under its stated assumptions.
    hidden_overhead: >-
      None claimed. Multiplicities and shared abscissae, if they
      dominate, are visible in the per-target pairs.
    tradeoff_note: >-
      No time-memory tradeoff is proposed. The datum is two integers
      per target.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-IC-5a43e5
      - KR-IC-5931ee
      - KR-IC-0d2021
      - KR-IC-e847d1
    nearest:
      - ref: KR-IC-5a43e5
        provenance: internal
        relation: adjacent
        delta: >-
          That row says S_3 vanishes on summing points. This idea
          counts, on eight hits at p = 43 and B = 5, whether the
          grevlex standard-monomial count equals the witness count
