      - ref: KR-IC-e847d1
        provenance: internal
        relation: orthogonal
        delta: >-
          Crossbred preprocesses a Boolean Macaulay matrix and then
          searches. This measurement does not preprocess for search
          and does not use a Boolean system.
      - ref: KN-OPEN-002
        provenance: internal
        relation: adjacent
        delta: >-
          The open problem is about solving degree. Quotient
          dimension is a different readout on one prime-field cell.
    searched:
      corpus_grep:
        - question_id RQ-SDEG-001 titles on origin/main and on PRs 1936 and 1937
        - quotient dimension and witness count in the opened frontier rows
      web:
        - not performed this session
      blocked:
        - hit versus miss degree means
        - peak nonzero counts
        - the S_4 degree spread at p = 37
  dominated_by: >-
    Pollard rho at Theta(N^{1/2}) group operations, checked against
    KR-IC-5931ee. No attack result is claimed. A toy quotient count
    does not change that baseline.
  sota_delta: >-
    Exponent delta is 0 against Theta(N^{1/2}) time and against
    polylog rho memory. The separator is six of eight targets with
    q = w, or six of eight with q = 1, against both counts at most
    five, at p = 43, B = 5.
  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: >-
        The planted random systems are the baseline for the monomial
        counter.
      reproduction_check: >-
        A second build reproduces q on one frozen hit.
    observation_collision:
      observable: q
      distinct_preimage_search: >-
        Two hits may share a quotient dimension. The collision is
        recorded and is not a discrete-log relation.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: hits with a given pair (w, q)
        predicted_gain: none as an attack
    quantifier_order: >-
      Empirical counts on one declared cell. No attack quantifiers.
    method_ceiling:
      strongest_certifiable_claim: >-
        On this cell at least six targets have q = w, or at least six
        have q = 1, or both counts are at most five.
      nearby_object_control: random consistent systems with planted roots
    proof_obligations:
      - claim: no theorem is offered
        responsibility: scope
    not_applicable_reason: >-
      Quotient-count measurement. The planted systems are the nearby
