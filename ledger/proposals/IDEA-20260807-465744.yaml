idea:
  id: IDEA-20260807-465744
  question_id: RQ-MTGT-2cabee
  added: '2026-08-07'
  title: >-
    THE x-SUPPORT AS A TRACKED OBJECT, AND THE DIRECTION ASYMMETRY NOBODY IN THIS
    CORPUS HAS RECORDED: because phi commutes with negation, x(phi(R)) is a
    degree-ell rational function of x(R) alone, so a preprocessed set's x-support
    is a genuinely COMPATIBLE lossy projection -- and under it, PUSHING a
    factor base FORWARD preserves its description degree exactly (a resultant
    bound) while PULLING one BACK multiplies that degree by ell, so transport is
    direction-asymmetric for field-level preprocessing and symmetric for
    group-level preprocessing; the measurable question is whether ANY isogeny in
    a class maps a box to a set with above-random additive energy
  class: representation

  claim: >-
    (A) THE OBJECT, AND WHY IT PASSES THE LOSSY-PROJECTION TEST WHERE THE OBVIOUS
    ALTERNATIVES FAIL. For a set A of points on E, define its x-SUPPORT
    X(A) := {x(R) : R in A} subset F_p. This is a lossy projection: it forgets
    the y-coordinates (hence the sign of each point), the logarithms, and the
    group structure entirely. It is nevertheless a COMPATIBLE projection for the
    operation "apply an isogeny", for a precise reason: an F_p-isogeny of curves
    in Weierstrass form satisfies phi(-R) = -phi(R), so x(phi(R)) is a function
    of x(R) alone. Write it f_phi, a rational function of degree
    deg phi = ell. Then
        X(phi(A)) = f_phi( X(A) )   EXACTLY, as sets.
    The retained part propagates deterministically and the discarded part (sign,
    logarithm) is never consulted. Contrast the two projections that FAIL the
    test and are recorded here as the boundary: the distinguished-point predicate
    (discards the group structure, retains the encoding, and the encoding is what
    phi scrambles) and the y-coordinate alone (not even well defined as a
    function of the point up to negation). X(A) is the one field-level projection
    of a preprocessing set that survives the test, which is why it is the object
    worth tracking rather than an arbitrary choice of coordinates.

    (B) THE DIRECTION ASYMMETRY -- THE STRUCTURAL FINDING, AND IT IS DECIDED BY
    ALGEBRA AT ZERO COMPUTE. Let F = {R in E : g(x(R)) = 0} be a Semaev-style
    factor base cut out by a polynomial g of degree B (for the classical
    prime-field choice, g = prod_{v in [0,B)} (x - v), i.e. an interval).
      FORWARD (push F to E' by phi). The image X(phi(F)) = f_phi(X(F)) has at
      most B elements, because a map sends B points to at most B points. Its
      vanishing polynomial is
          g'(X) = Res_x( g(x), X*den_phi(x) - num_phi(x) ),
      which has degree at most B in X. SO THE DESCRIPTION DEGREE IS PRESERVED:
      deg g' <= deg g = B, generically with equality.
      BACKWARD (pull a factor base on E' back to E by the same phi). The
      preimage f_phi^{-1}(V) of a set V of size B has up to ell*B elements, and
      its vanishing polynomial has degree up to ell*B. SO THE DESCRIPTION DEGREE
      IS MULTIPLIED BY ell.
      CONSEQUENCE, AND IT IS ACTIONABLE: for FIELD-LEVEL preprocessing the
      direction of transport matters and forward is strictly better. For
      GROUP-LEVEL preprocessing (a known-log table) both directions are free and
      identical (T1). THIS ASYMMETRY IS ABSENT FROM EVERY RECORD IN THIS CORPUS
      and it is the concrete reason why IDEA-20260807-a127ab's Mode B (pull the
      TARGET back, which is two POINTS and has no description degree) is safe
      while "pull the factor base back" would not be.

    (C) WHAT IS PRESERVED IS NOT WHAT IS USEFUL, AND THAT IS THE MEASURABLE
    QUESTION. Degree preservation is necessary for the Groebner route and says
    nothing about the two other routes to decomposition:
      ENUMERATION. Gaudry/Semaev-style decomposition over an INTERVAL is testable
      by comparison: given a candidate x, "is x < B" costs one comparison. Over
      f_phi([0,B)) there is no such test short of membership in an unstructured
      set of size B. Interval-ness is not a degree property and is predicted
      destroyed.
      LATTICE / SMALL-ROOT. Box-constrained solving needs the constraint to be a
      BOX, i.e. an interval in the additive group. Predicted destroyed for the
      same reason.
    The graded statistic that captures both, and that has an exact positive
    control, is the ADDITIVE ENERGY
        E(V) := #{ (v1,v2,v3,v4) in V^4 : v1 + v2 = v3 + v4 }.
    For an interval of size b, E ~ (2/3) b^3; for a uniformly random set of size
    b in F_p with b >> sqrt(p), E ~ b^4/p + b^2. THE PREDICTION:
      at ell = 1 (an F_p-isomorphism, which acts on x by x -> u^2*x for short
      Weierstrass), E(f_phi(V)) = E(V) EXACTLY, because dilation is an
      automorphism of (F_p, +) -- a RIGOROUS positive control, checkable by exact
      integer equality;
      at ell >= 2, E(f_phi(V)) at the random baseline.
    A single ell >= 2 with E above the random baseline by a factor 2 would mean
    an isogeny x-map preserves additive structure, which would be a genuinely new
    fact about isogenies and would reopen the class-wide factor-base search.

    (D) THE SEARCH THAT MAKES THIS MORE THAN A SANITY CHECK. A toy isogeny class
    contains many curves and many small-ell edges. Enumerate ALL of them and ask:
    does ANY edge in the class map a box to a set with above-random additive
    energy? This is a search over a structured family of low-degree rational
    maps, not a single measurement, and it is the only place in lane L13 where a
    positive result is even conceivable. PRE-REGISTERED EXPECTATION: no. But the
    search is cheap, the null is exact, and the positive control is rigorous --
    which is the profile of a measurement worth taking rather than asserting.

  resource_label: >-
    R1 primary (x-coordinates as field elements, which is what escapes the
    generic group model), R4 (the isogeny graph supplies the family of maps
    f_phi). R8 only in framing, since the object measured is not the
    preprocessing accounting but the set the preprocessing lives on.

  admissibility: admissible

  admissibility_argument: >-
    A generic-group oracle returns opaque labels and cannot answer "what is the
    additive energy of the x-support of this set", "is x(R) in [0, B)", or "what
    is the degree of the polynomial vanishing on this x-set". Those are questions
    about F_p, i.e. resource R1, which the DECOMPOSITION.md section 2 taxonomy
    lists precisely because it is not group-operation output. The
    KN-FIND-b7e091 closure covers incidence and endomorphism-image oracles and
    does not reach here. The record is admissible and its expected answer is
    still negative -- an admissible resource whose measured contribution is zero
    is the honest and most likely outcome, and stating that in advance is what
    keeps the record from being a fishing trip.

  discriminated_from:
    - >-
      IDEA-20260807-e0ddc6 (this lane, same batch) -- states the three-class
      transport CRITERION and includes the resultant bound as one item. This
      record is the deep dive on the single object that criterion identifies as
      interesting: it adds the BACKWARD direction and the degree-times-ell
      asymmetry, which e0ddc6 does not contain, and it adds the class-wide search
      of section (D). The overlap is the ell = 1 positive control, which both
      records need and which is stated once here in full.
    - >-
      analysis/o2-sum-compatible-filters/ -- measured whether x(P+Q) carries
      usable partial information from x(P), x(Q), and found it does not, closing
      the k-tree escape. That is about the GROUP LAW's action on x-coordinates on
      ONE curve. This record is about an ISOGENY's action on x-coordinates
      BETWEEN curves. Different map, different question; the o2 result is cited
      as the closest methodological precedent for measuring additive structure on
      x-coordinates in this program, and its negative is not evidence here.
    - >-
      KN-TECH-016 and KN-TECH-010 (sum-product thresholds, incidence bounds) --
      supply the language of additive energy and the expander-form incidence
      bound. They are used as MEASUREMENT VOCABULARY and as sources of the random
      baseline, not as claimed mechanisms.
    - >-
      Lane L4 (RQ-EQIC-8cb959) -- phi-EQUIVARIANT factor bases on ONE curve, with
      phi an endomorphism. This record moves a factor base BETWEEN curves with
      phi an isogeny. It must not be read as re-asserting H-STR-002, which is
      `weakened` under DEC-20260727-009 with an open replication obligation
      (DEFER-BATCH009-001); nothing here touches that hypothesis.
    - >-
      Lane L1 (RQ-ICINV-475b5e) -- within-class variance of Semaev-side cost
      functionals. Section (D)'s search is adjacent and its positive branch would
      feed L1; the record hands that over rather than claiming it.

  object_first_candidate:
    tracked_object: >-
      X(A) subset F_p, the x-SUPPORT of a preprocessed point set, tracked under
      the induced degree-ell rational map f_phi along an isogeny path.
    lossiness: >-
      LOSSY: forgets the y-coordinate and hence the sign of every point, forgets
      every logarithm, forgets the group law, forgets the curve equation beyond
      what f_phi encodes. A set of S points becomes a set of at most S field
      elements.
    propagation: >-
      LOSSY-PROJECTION TEST, RUN AND PASSED, WITH THE EXACT REASON. What X
      discards -- the sign of each point -- is discarded COMPATIBLY with phi,
      because phi(-R) = -phi(R) means the sign is exactly the information f_phi
      does not need. The retained part propagates deterministically:
      X(phi(A)) = f_phi(X(A)) as sets, with no approximation. And X is NOT a
      change of coordinates: it is 2-to-1 on the curve and strictly loses
      information. This is the cleanest passing instance in the lane of a
      FIELD-LEVEL object, and it is the reason this record exists separately from
      the group-level ones.
    survival_score: >-
      X itself survives every isogeny step -- the map is always defined. What
      dies is the STRUCTURE inside X: interval-ness is predicted to die at step
      one, description degree is preserved forward indefinitely and inflated by
      ell per step backward. The object survives; its useful attributes are
      predicted not to, and separating those two is the whole point of tracking
      it rather than tracking "the factor base".

  mechanism: >-
    STEP 1 -- ZERO-COMPUTE ALGEBRA, HARD GATE. Write f_phi explicitly for ell = 2
    and ell = 3 from Velu. Form g' = Res_x(g, X*den - num) symbolically for a
    small interval g and confirm deg g' <= deg g. Separately confirm that
    f_phi^{-1} of a single point has up to ell preimages, establishing the
    backward degree inflation. If either fails, section (B) is wrong and the
    record is superseded before compute.
    STEP 2 -- INSTRUMENT VALIDATION ON KNOWN ANSWERS. Compute E(V) for V an
    interval of size b (must equal the exact interval formula), for V a random
    set (must match the random baseline), and for V = u^2 * interval (must equal
    the interval value EXACTLY, by dilation invariance). Only after all three
    pass may any isogeny image be measured.
    STEP 3 -- THE ell = 1 ARM. For each F_p-isomorphism class representative,
    compute f_phi(V) and confirm E(f_phi(V)) = E(V) exactly. This is the rigorous
    positive control and it is blocking.
    STEP 4 -- THE ell SWEEP. For ell in {2, 3, 5, 7, 11, 13}, compute f_phi(V)
    and measure: additive energy, 3-term arithmetic progression count,
    |f_phi(V) intersect V|, the size of the largest interval contained in
    f_phi(V), and the maximum of |f_phi(V) intersect (any interval of length b)|.
    Compare each against the interval value, the random baseline and the ell = 1
    value.
    STEP 5 -- PATH LENGTH SWEEP. Compose 1, 2, 3 steps and confirm monotone decay
    of every retained-structure statistic to the random baseline.
    STEP 6 -- THE CLASS-WIDE SEARCH of section (D). Enumerate every small-ell
    edge of an enumerable toy class and record the additive energy of the image
    of a fixed box under each. Report the MAXIMUM over the class, with its
    multiple-comparison correction stated in advance: for K edges tested at
    significance alpha, the expected number of spurious exceedances is K*alpha
    and the reporting threshold is set accordingly BEFORE the search runs.
    STEP 7 -- THE DIRECTION EXPERIMENT. Push a factor base forward and record
    deg g'; pull a factor base back and record the degree of the vanishing
    polynomial of the preimage. Confirm the predicted B versus ell*B.
    STEP 8 -- DOWNSTREAM CONSEQUENCE, MEASURED NOT ASSUMED. Run the harness's
    m = 3 Semaev decomposition measurement on E' over the pushed-forward factor
    base and on E over the original, matched seeds, and report the solving-degree
    proxy for both. Predicted: no difference beyond run-to-run spread, because
    the description degree is what the Groebner route sees.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Run 2026-08-07. Commands:
      (1) grep -rin "additive energy" . --glob '!research_digest/**'
      (2) grep -rin "x-support\|x-coordinate.{0,30}image\|f_phi" ledger/ knowledge/ analysis/
      (3) grep -rin "resultant" knowledge/techniques/ ledger/proposals/
      (4) grep -rin "preimage" ledger/proposals/ knowledge/
      (5) read of analysis/o2-sum-compatible-filters/claim_a_adjudication.md section 3
      (6) read of KN-TECH-016 and KN-TECH-010.
    results: >-
      (1) Additive energy and sum-product material exist and are applied to the
      GROUP LAW on one curve (analysis/o2-sum-compatible-filters/, KN-TECH-016,
      KN-TECH-010). ZERO hits apply it to an isogeny x-map.
      (2) ZERO records define the x-support of a preprocessed set as a tracked
      object or state that x(phi(R)) depends only on x(R).
      (3) ZERO records use a resultant to bound the description degree of a
      transported factor base.
      (4) ZERO records record the backward degree inflation.
      (5) The o2 analysis is the methodological precedent and is cited as such.
    verdict: >-
      ADAPTATION. Every ingredient is standard: isogenies commute with negation,
      resultants bound image degrees, dilations preserve additive energy, and
      additive energy has a known random baseline. What is new to this program is
      the assembly -- the x-support as a compatible projection, the forward/
      backward degree asymmetry, and the class-wide search with an exact positive
      control. The forward degree bound is the item most likely to exist
      externally and is flagged for a Stage-0 literature check; a hit there is an
      ingredient, not a defeat.

  null_object_control: >-
    MANDATORY AND BLOCKING, THREE-PART.
    (1) RANDOM-SET NULL: a uniformly random subset of F_p of the SAME SIZE as
      f_phi(V), measured on the identical statistics pipeline. Every "structure
      destroyed" claim is a claim of agreement with this null, so the null is
      simultaneously the control and the prediction, and the test is whether the
      treatment DEVIATES from it.
    (2) RIGOROUS POSITIVE CONTROL: the ell = 1 arm, where E(u^2*V) = E(V) must
      hold as EXACT INTEGER EQUALITY. An instrument failing this cannot
      distinguish "the map destroyed the structure" from "the pipeline never
      applied the map", which is precisely the EXP-ISADV-001 failure mode.
    (3) PLANTED-STRUCTURE CONTROL: inject a set that IS an interval but is
      presented through the same pipeline as an image; the pipeline must report
      interval-level additive energy. An instrument that reports random-level
      energy for an actual interval is broken.
    DECAY PARAMETER: ell, and secondarily the path length L. Every
    retained-structure statistic must decay MONOTONICALLY from its ell = 1 value
    to the random baseline as ell grows and as L grows. A statistic that does not
    decay is the canonical artifact tell (docs/inventor-protocol.md, controls
    before belief) and voids the run set.

  assumptions:
    - >-
      phi(-R) = -phi(R) for an F_p-isogeny of Weierstrass curves, hence x(phi(R))
      is a function of x(R). Standard; verified constructively at ell = 2, 3 in
      Step 1 rather than assumed, because the whole object depends on it.
    - >-
      deg f_phi = deg phi for a separable isogeny. Standard; verified in Step 1.
    - >-
      The additive-energy random baseline E ~ b^4/p + b^2 for a uniform set of
      size b, and the interval value E ~ (2/3) b^3, are elementary counts.
      Computed exactly at toy sizes rather than used asymptotically.
    - >-
      The Groebner solving-degree proxy in Step 8 is the program's existing
      implementation-bound one (harness/semaev.py, sympy Buchberger, per its own
      honesty note). All Step 8 comparisons are within-implementation only.
    - >-
      Toy scale. Additive energy costs O(b^2) to O(b^3); with b up to ~2^8 and
      p up to ~2^{20} this is cheap, and it is the binding scale constraint. No
      crypto-scale statement is licensed.
    - >-
      Velu evaluation at ~6*ell field operations and sqrt-Velu at O~(sqrt(ell))
      are relayed from KN-LIT-780, a bulk-seeded entry marked "not verified
      here". Confidence: reported. Only used for cost bookkeeping, not for the
      structural claims.

  proof_search_map:
    bottleneck: >-
      Section (B)'s two degree statements -- forward deg g' <= B and backward
      degree up to ell*B. Everything else is a measurement. These are the steps
      whose failure would change the record's structural conclusion rather than
      its numbers.
    baseline_embedding:
      parameter_slice: >-
        ell = 1, phi an F_p-isomorphism. The forward bound must give deg g' = B
        exactly and the backward bound must give B (not ell*B = B, trivially
        consistent), and additive energy must be exactly preserved.
      reproduction_check: >-
        Exact integer equality E(u^2*V) = E(V) for at least 20 values of u at a
        declared prime, and deg g' = deg g exactly. Any inequality is an
        instrument or algebra fault and halts the line before any ell >= 2 number
        is produced.
    observation_collision:
      observable: >-
        "Additive energy at the random baseline."
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED. A pipeline that never applied f_phi,
        a pipeline that applied it to the wrong set, and a genuinely destroyed
        image ALL produce random-baseline energy. The disambiguators are the
        ell = 1 arm (must show interval-level energy) and the planted-structure
        control (must show interval-level energy). Reporting an ell >= 2 baseline
        result without both is prohibited by this record. This is exactly the
        collision that made EXP-ISADV-001's null uninformative, and naming it in
        advance is the point of the audit.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace the binary "is it still a box" by additive energy, a graded
          statistic with an exact interval value, an exact random baseline and an
          exact dilation-invariance property.
        predicted_gain: >-
          Makes a monotone decay test possible and supplies a rigorous positive
          control, neither of which a binary predicate admits.
      - transform: representation_reduction
        proposed_object: >-
          Replace "the transported factor base" by "the polynomial vanishing on
          its x-support", turning transport into a resultant and the direction
          question into a degree comparison.
        predicted_gain: >-
          Decides the forward/backward asymmetry by algebra at zero compute, and
          predicts that the Groebner-side difficulty transports while the
          enumeration-side does not.
    quantifier_order: >-
      INTENDED for the structural half: FORALL separable F_p-isogenies phi of
      degree ell, FORALL polynomials g of degree B, the image polynomial g' has
      deg g' <= B and a preimage polynomial has degree at most ell*B.
      INTENDED for the measured half: FORALL edges phi of the enumerated toy
      class with ell >= 2, FORALL boxes V of the declared sizes, the additive
      energy of f_phi(V) is at the random baseline.
      The DANGEROUS weaker reading, NOT claimed, and the one section (D) exists
      to test: EXISTS an edge phi for which structure survives. The search in
      Step 6 is precisely the search for that existential, run with a
      pre-registered multiple-comparison threshold so that finding one by chance
      over K edges cannot be reported as a discovery.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On the enumerated toy classes, at the declared box sizes, no isogeny of
        degree 2..13 maps a box to a set with above-random additive energy, and
        forward transport preserves factor-base description degree while backward
        transport inflates it by ell." It can NEVER certify anything at
        cryptographic p, anything about larger ell, anything about non-box
        structured sets, or anything about whether index calculus works.
      nearby_object_control: >-
        A degree-ell rational map that is NOT an isogeny x-map -- e.g. a random
        rational function of the same degree. Its image of a box must show the
        SAME random-baseline energy. If the isogeny x-maps differ from random
        maps of equal degree, that difference is the finding; if they do not, the
        measurement is about degree-ell maps in general and no isogeny-specific
        claim may be made. This control decides whether anything measured is
        about ISOGENIES or merely about DEGREE.
    proof_obligations:
      - claim: x(phi(R)) is a function of x(R) alone.
        responsibility: correctness
      - claim: deg Res_x(g, X*den - num) <= deg g.
        responsibility: correctness
      - claim: the preimage of a B-element set has at most ell*B elements.
        responsibility: correctness
      - claim: E(u^2*V) = E(V) exactly.
        responsibility: baseline
      - claim: the random baseline used is the exact finite-p count, not an asymptotic.
        responsibility: soundness
      - claim: the class-wide search reports its multiple-comparison threshold, fixed in advance.
        responsibility: soundness
      - claim: every reported statistic names ell, L, b and p.
        responsibility: scope

  predictions:
    - metric: additive energy of f_phi(V) normalised to the random baseline, ell >= 2
      direction: lower
      minimum_effect: >-
        Ratio in [0.8, 1.25] at every tested ell and every tested box size. A
        ratio above 2 at any ell >= 2, surviving the random-map nearby-object
        control and the multiple-comparison threshold, is the falsifier and would
        be the lane's only genuinely new fact.
    - metric: additive energy at ell = 1 relative to E(V)
      direction: different
      minimum_effect: EXACT integer equality. Anything else halts the line.
    - metric: deg g' for forward transport
      direction: different
      minimum_effect: >-
        <= B in 100% of cells and = B in at least 90%. A systematic drop below B
        must be checked against the trivial explanation that f_phi collides
        distinct roots, which the multiplicity profile detects.
    - metric: degree of the vanishing polynomial of a pulled-back factor base
      direction: higher
      minimum_effect: >-
        Between B and ell*B, with the ell-dependence visible: a linear fit of
        degree against ell with slope in [0.5*B, 1.2*B]. Slope indistinguishable
        from zero refutes the backward-inflation half of section (B).
    - metric: >-
        maximum additive-energy ratio over all small-ell edges of an enumerated
        class (the section (D) search)
      direction: different
      minimum_effect: >-
        Below the pre-registered multiple-comparison threshold for K edges. The
        expected report is "no edge exceeds threshold", and that is a result.
    - metric: m = 3 Semaev solving-degree proxy, E' over pushed base vs E over original
      direction: different
      minimum_effect: >-
        No difference beyond run-to-run spread. A systematic difference of >= 1
        surviving the random-g null is a within-class variance signal, belongs to
        lane L1, and is handed over rather than claimed here.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): Step 1's symbolic resultant and preimage
      count at ell = 2, 3.
      STAGE 1 (minutes): Step 2's three known-answer instrument validations. No
      isogeny image may be measured until all three pass.
      STAGE 2 (minutes, THE CHEAP DISCRIMINATOR): the ell = 1 arm and one ell = 2
      arm at p ~ 1009 with b = 32. Two additive-energy numbers, one of which is
      predicted exactly and one at the random baseline. This separates the
      dichotomy and validates the instrument in a single short run.
      STAGE 3 (low hours): Steps 4, 5, 7 -- the ell and path-length sweeps and
      the direction experiment.
      STAGE 4 (hours): Step 6's class-wide search with its pre-registered
      threshold, and Step 8's Semaev consequence measurement.
    controls:
      - random-set null of matched size
      - ell = 1 dilation positive control (exact integer equality)
      - planted-interval control through the same pipeline
      - random degree-ell rational map (isogeny-versus-degree disambiguator)
      - multiplicity profile of g' (trivial-collapse control)
      - pre-registered multiple-comparison threshold for the class-wide search
    required_metrics:
      - additive energy, 3-AP count, box intersection, largest contained interval
      - deg g' and its multiplicity profile, forward and backward
      - exact random and interval baselines at the tested (b, p)
      - per-edge statistics for the class-wide search, with K reported
      - Semaev solving-degree proxy and basis size per arm
      - wall clock and peak memory per cell

  falsification_conditions:
    - >-
      deg g' > deg g in any cell. Section (B)'s forward bound is false; the
      record is superseded rather than amended.
    - >-
      The backward degree does not grow with ell. Section (B)'s asymmetry is
      false and the actionable consequence (push forward, do not pull back)
      evaporates.
    - >-
      E(u^2*V) != E(V) exactly. Instrument broken; no ell >= 2 number is
      reportable.
    - >-
      Additive energy of f_phi(V) exceeds twice the random baseline at any
      ell >= 2, above the multiple-comparison threshold and surviving the
      random-map control. Isogeny x-maps preserve additive structure; this is the
      positive branch, is a new fact about isogenies rather than an attack, and
      requires independent replication before any interpretation.
    - >-
      Retained-structure statistics do not decay with ell or with path length.
      Artifact tell; the run set is void.
    - >-
      The random-map nearby-object control shows the SAME behaviour as isogeny
      maps in a case where isogeny maps showed structure. The measurement is
      about degree, not about isogenies, and no isogeny-specific claim may be
      made.

  confounders:
    - >-
      SMALL b RELATIVE TO sqrt(p). The random additive-energy baseline changes
      regime at b ~ sqrt(p): below it the b^2 diagonal term dominates and every
      set looks structured. Box sizes must straddle sqrt(p) and the regime must
      be reported with every number.
    - >-
      ROOT COLLISION. f_phi is ell-to-1 on the x-line, so distinct box elements
      can map together, shrinking the image and inflating per-element statistics.
      The image size must be reported alongside every statistic.
    - >-
      POINTS AT INFINITY AND POLES. f_phi has poles at the x-coordinates of
      kernel points; box elements hitting a pole map to infinity and must be
      excluded explicitly and counted, not silently dropped.
    - >-
      MODEL DEPENDENCE. The x -> u^2*x form of an F_p-isomorphism is specific to
      short Weierstrass. One model is frozen for the whole line, and the ell = 1
      control is model-specific.
    - >-
      MULTIPLE COMPARISONS in the class-wide search. With K edges tested, some
      will exceed any fixed threshold by chance. The threshold is fixed before
      the search and K is reported.
    - >-
      x-ONLY AMBIGUITY. X(A) identifies R with -R, so a set of S points may have
      fewer than S x-values. Reported per set.

  interpretation_limits:
    - >-
      The predicted outcome is negative on the interesting axis: field-level
      structure is destroyed. That negative is scoped to the tested ell, box
      sizes, primes and classes, and to short Weierstrass models.
    - >-
      Degree preservation does NOT mean prime-field index calculus transports
      usefully. A degree-B constraint polynomial is hopeless on both curves and
      transport preserves hopelessness; the record says so rather than presenting
      degree preservation as good news.
    - >-
      A positive in the class-wide search would be a fact about isogeny x-maps,
      not an attack, and would need its own proposal with its own cost model and
      its own reachability analysis.
    - >-
      Toy scale only, claim_tier: toy. Additive-energy behaviour at p ~ 2^{20}
      licenses no statement at p ~ 2^{256}.
    - >-
      Nothing here touches H-STR-002 (weakened, DEC-20260727-009) or its open
      replication obligation.

  reachability_gate: >-
    LOWEST IN THE LANE. The measurements need EDGES, not destinations: every
    statistic is computed from a single isogeny out of a curve, and the
    class-wide search of section (D) wants MANY edges rather than a SPECIFIED
    curve. So the vectorization hardness of T5 does not bind at all -- the record
    consumes exactly the cheap half of the dichotomy in DECOMPOSITION.md T5
    ("a uniformly random curve in the class is reachable in O(log p) isogeny
    steps: cheap"). Cost per edge: one kernel-subgroup search plus one Velu
    construction, O(ell^3) field operations in the conservative ordinary-curve
    model (research/JMV004_branch_a_scouting_20260726.md, SCOUTING). At toy scale
    the class is fully enumerable and every edge is available by breadth-first
    search. If a positive were found in section (D), the reachability question
    would immediately become binding -- because exploiting a good edge means
    reaching its source curve -- and that is recorded here as the cost the
    positive branch would have to pay.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. This record measures a structural property.
      Its own cost is O(b^2) per additive-energy evaluation times K edges times
      the ell and L sweeps; at b <= 2^8 and K <= a few hundred this is minutes.
      If the section (D) search were positive, the resulting proposal would carry
      its own exponent claim and this record does not anticipate one.
    memory_exponent: >-
      O(b) for the sets and O(B*ell) for the resultant. Negligible. The binding
      constraint is the O(b^2)-to-O(b^3) time of the energy computation, not
      memory.
    best_known: >-
      Unchanged and untouched: parallel rho at 0.886*sqrt(N) with O(1) memory
      (KN-TECH-001, KN-TECH-006), automorphism-discounted on CM curves
      (KN-TECH-018), BSGS at sqrt(N) time and memory with N^{2/3+o(1)} full cost
      (KN-TECH-031, KN-TECH-035), Bernstein-Lange preprocessing at
      S = T = N^{1/3} on the Corrigan-Gibbs--Kogan frontier (KN-LIT-013,
      KN-TECH-005), Kuhn-Struik multi-target rho at sqrt(M*N).
    hidden_overhead: >-
      The structural half hides nothing -- resultant degree bounds are exact. The
      MEASURED half hides the usual small-p power problem: at toy sizes the
      random baseline is noisy and "indistinguishable from random" has weak
      power, so every null must be reported with its power. The class-wide search
      additionally hides its multiple-comparison burden, which is why K and the
      threshold are pre-registered.
    tradeoff_note: >-
      Not applicable to the structural claims. The one genuine tradeoff the
      record exposes is the transport DIRECTION: forward preserves description
      degree at cost S*O(ell) evaluations, backward inflates degree by ell at the
      same evaluation cost. That is a correctness tradeoff rather than a
      time-memory one, and it is the record's actionable output.

  dominated_by: >-
    AS AN ATTACK: mounts none. Dominated on every axis by every row of the
    prime-field frontier -- parallel rho with distinguished points (0.886*sqrt(N)
    time, O(1) memory), the automorphism-discounted variant on CM curves, BSGS
    (sqrt(N) time and memory, N^{2/3+o(1)} full cost), Bernstein-Lange
    preprocessing (N^{1/3} advice, N^{1/3} online), and Kuhn-Struik multi-target
    rho (sqrt(M*N) time, small memory). Checked across time, memory and
    data/queries.
    AS A STRUCTURAL MEASUREMENT: the nearest incumbent is
    analysis/o2-sum-compatible-filters/, which measured additive structure under
    the GROUP LAW on one curve and closed the k-tree escape. This record does not
    dominate it and is not dominated by it -- different map, disjoint conclusion.
    Against the transport criterion of IDEA-20260807-e0ddc6 this record dominates
    on resolution (adds the backward direction, the class-wide search, and the
    random-map disambiguator) and is dominated on breadth (e0ddc6 covers all
    three classes; this covers one object).
  sota_delta: >-
    ZERO against every attack baseline; no speedup is claimed or possible from a
    structural measurement. Structural delta, quantitatively: establishes one
    exact degree bound (forward, deg g' <= B, slack 0) and one exact inflation
    factor (backward, up to ell*B) that together make transport direction-
    dependent for field-level preprocessing and direction-free for group-level
    preprocessing; supplies one rigorous positive control (E(u^2*V) = E(V), exact
    integer equality) absent from the program's prior transfer instrument; and
    searches K small-ell edges of an enumerated class for above-random additive
    energy with a pre-registered threshold, expected finding zero.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.97 that x(phi(R)) depends only on x(R) -- standard. 0.85 that the forward
    resultant bound holds exactly as written; the risk is denominator bookkeeping,
    not falsity. 0.90 that the backward inflation is observed. 0.95 that
    E(u^2*V) = E(V) reproduces exactly. 0.80 that additive energy of f_phi(V)
    sits at the random baseline for every tested ell -- and the residual 0.20 is
    the single largest genuine uncertainty anywhere in lane L13, because nobody in
    this corpus has looked, low-degree rational maps sometimes retain more
    structure than expected, and the class-wide search of section (D) is a real
    search over hundreds of maps rather than one measurement. Ranked medium
    rather than high because the expected outcome is negative and the lane's
    accounting records are more immediately useful; ranked above the other
    negatives because it is the only record here whose positive branch would be a
    new mathematical fact rather than a bookkeeping change.

