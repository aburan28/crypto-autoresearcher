idea:
  id: IDEA-20260809-a3ecbb
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-TECDSA-8d340d
  goal_id: GOAL-TECDSA-001
  title: >-
    Enumerate the preconditions, then check whether each protocol version has a
    proof for every one — and record the undetermined cells as undetermined
  class: measurement
  claim: >-
    Each attack in this family exploits a precondition: a value out of range, a
    modulus with structure, a commitment not bound to a session. The claim is that
    the preconditions can be enumerated from the protocol's message structure
    rather than only from published attacks, that each published protocol version
    can be checked for a corresponding proof, and that the cells with no
    corresponding proof — or where the correspondence cannot be determined from the
    text — are the deliverable.
  mechanism: >-
    For each message a party sends, enumerate the properties an honest party's
    message satisfies. Each such property is a precondition an adversary could
    violate. Check the protocol's proof set for a proof of each, citing the passage.
  why_not_a_renamed_known_approach: >-
    Published attacks enumerate preconditions in the reverse direction: from
    attack to missing proof. Enumerating forward from the message structure can
    surface preconditions no published attack has exploited, which is the whole
    point, and the undetermined cells are a documentation finding either way.
  predictions:
  - observable: number of enumerated preconditions without an identified proof
    metric: count per protocol version
    predicted: >-
      At least one undetermined cell per version. A version covering every
      enumerated precondition explicitly would be a strong positive result for
      that design and is recorded as such.
  - observable: preconditions surfaced by forward enumeration that no published attack exploits
    metric: count
    predicted: Nonzero; each is a candidate for attack construction, and failing to construct one is recorded as a bounded negative rather than as safety.
  minimal_test: >-
    Enumerate preconditions from the message structure for one protocol version,
    check each against the proof set with passage citations, and list undetermined
    cells.
  controls:
  - 'PASSAGE CITATION per cell; an uncited cell is undetermined by definition.'
  - 'INDEPENDENT ENUMERATION: the precondition list is produced twice independently and merged, since a single reading will miss cases.'
  falsification_conditions:
  - Independent enumerations differ substantially, indicating the method is not reproducible.
  - The message structure does not determine preconditions cleanly, in which case the forward enumeration is abandoned and the record says why.
  interpretation_limits: >-
    An undetermined cell is a statement about what this program could determine
    from a document, never a claim that a protocol is insecure.
  sota_delta: 'Delta: forward enumeration, which can surface preconditions no attack has yet exploited, plus an honest undetermined column.'
  dominated_by: Not dominated by any corpus record.
  estimated_cost: Acquisition-dominated; implementation small.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for precondition enumeration: no records. WEB NOT CHECKED.'
  source_refs:
  - Threshold ECDSA protocol specifications -- REQUIRED READS.
