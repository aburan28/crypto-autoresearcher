idea:
  id: IDEA-20260905-8829cc
  title: Information-retention audit for ordinary versus explicitly marked cohomological objects
  class: measurement
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  added: '2026-09-05'
  proposed_at: '2026-09-05'
  proposed_by: idea-generator
  claim: >-
    For a smooth proper elliptic curve over a characteristic-zero field K and
    distinct K-rational marks P,Q, the proposed baseline prediction is that
    relative de Rham cohomology H1_dR(E,{P,Q}) has dimension three and maps onto
    ordinary H1_dR(E) with a one-dimensional kernel. Thus these dimensions
    collide for all such marked pairs. This exact-sequence claim is a proof
    target here, not a newly validated result. Whether additional structured
    extension data retains useful marked information remains a separate question.
  mechanism: >-
    Fix the concrete relative object H1_dR(E,D), D={P,Q}, and derive its
    long exact sequence with H0_dR(E), H0_dR(D) and H1_dR(E). Audit the
    dimension triple and the natural map H1_dR(E,D) to H1_dR(E) as an explicit
    information-losing summary. Separate this rank-only null from any proposed
    filtration, connection or extension-class invariant; each additional
    structure needs its own equivalence and basis-independence statement.
    Relative de Rham cohomology alone does not supply a Frobenius operator.
    Any Frobenius extension requires a separately specified compatible marked
    pair and coefficient construction, including how Frobenius acts on the marks.
    No cover decoder, path-based recovery or scalar-relation procedure is proposed.
  novelty_status: unverified
  citations:
    - ref: ideas/rejected/ECDLP-IDEA-019_target_dependent_kummer_cover_zeta_decoder_hypothesis.md
      provenance: internal
      claim: >-
        Parent read a prior marked-point to Kummer-cover to Frobenius or zeta
        fingerprint proposal. This audit overlaps its information question and
        does not propose a novel cover decoder or subgroup-chain solver.
      verified_by: '/root direct source read 2026-09-05; author received parent summary'
    - ref: ECDLP-IDEA-114
      provenance: internal
      claim: >-
        Parent identifies punctured elliptic Magnus path signatures and the
        obstruction that signatures distinguish chosen paths without supplying
        a canonical endpoint-only path; the present audit checks that distinction.
      verified_by: '/root direct source read 2026-09-05; record identifier supplied without guessed path'
    - ref: ECDLP-IDEA-021
      provenance: internal
      claim: >-
        Parent identifies unipotent Albanese path coordinates with overlapping
        auxiliary-path dependence; its rejection is not assumed to be a universal theorem.
      verified_by: '/root direct source read 2026-09-05; record identifier supplied without guessed path'
  assumptions:
    - Ordinary and marked constructions are compared on the same fixed curve and field.
    - The marked object and all auxiliary data are specified before inspecting outputs.
    - Trace-only summaries can discard information retained by the full marked object.
    - No claim that the Kedlaya construction itself is a canonical curve lift is made.
  proof_search_map:
    bottleneck: Locate exactly where marked data enters and where a cohomological summary forgets it.
    baseline_embedding:
      parameter_slice: Forget all markings while holding the curve fixed.
      reproduction_check: >-
        Recover the usual mark-independent Frobenius characteristic polynomial
        and point count; the baseline must remain unchanged under replacing marks.
    observation_collision:
      observable: >-
        The dimension triple (dim H1_dR(E,{P,Q}), dim H1_dR(E),
        dim kernel of the natural map), predicted to be (3,2,1);
        additional structured extension invariants are outside this baseline test.
      distinct_preimage_search: >-
        Seek different markings with identical output, and identical endpoints
        with different auxiliary choices producing different outputs. Record
        these two collision or dependence questions separately.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: Forgetful-map diagram recording fibres for marked and unmarked invariants.
        predicted_gain: Exact classification of retained information; zero claimed solver improvement.
    quantifier_order: >-
      Fix the construction and auxiliary-data equivalence first; then quantify
      over markings and admissible auxiliary choices. Existential nonconstancy
      does not imply injectivity, uniform efficient construction or scalar decoding.
    method_ceiling:
      strongest_certifiable_claim: A proved retention, collision or auxiliary-choice dependence statement for one construction.
      nearby_object_control: >-
        Ordinary unmarked Frobenius data on the same curve with different marks
        must coincide. An argument extracting distinct marked information from
        this unchanged object proves too much.
    proof_obligations:
      - claim: Derive the relative de Rham exact sequence for distinct rational marks and verify the proposed dimension triple.
        responsibility: baseline
      - claim: Any successor Frobenius construction must specify compatible markings and coefficients before an operator is assumed.
        responsibility: interface
      - claim: Define the marked object, its morphisms and its forgetful map without an implicit choice oracle.
        responsibility: interface
      - claim: Prove the unmarked baseline is independent of the marking.
        responsibility: baseline
      - claim: Separate endpoint information from information about selected auxiliary paths or covers.
        responsibility: correctness
      - claim: Charge cover degree, cohomology rank, field extension and p-adic precision where applicable.
        responsibility: size
      - claim: Bound retained information claims to the chosen invariant and explicitly exclude scalar decoding.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: dimension triple of relative cohomology and its natural map under changed distinct marks
      direction: lower
      minimum_effect: Predicted zero dependence and triple (3,2,1); one valid counterexample falsifies this exact baseline.
    - metric: dependence of the dimension triple on a change of presentation
      direction: lower
      minimum_effect: Predicted exact zero; any discrepancy requires correction of the construction or the stated prediction.
  minimal_test:
    design: >-
      Prepare a symbolic audit of the relative de Rham long exact sequence for
      a connected smooth proper elliptic curve over K and two distinct rational
      marks. A future contract must freeze K, E and two marked pairs for any
      examples. Prove or refute the dimension triple and mark-collision prediction.
      Record which information the rank summary discards without asserting that
      every additional structure also discards it. List the extra compatibility
      obligations before any Frobenius-based successor is considered. No
      implementation, recovery procedure or experiment is approved here.
    controls:
      - Same curve and different marks after all marked data is forgotten.
      - Same marked endpoints with two admissible auxiliary choices.
      - Isomorphic marked objects in different presentations.
    required_metrics:
      - Exact equality, collision or dependence certificate.
      - Dimensions or ranks of marked and unmarked cohomology and the forgetful map.
      - Extension degree, cover degree, precision and representation size where applicable.
      - Which auxiliary data must be supplied and its construction or storage cost.
      - Proof gaps and the precise scope of any inconclusive outcome.
  falsification_conditions:
    - The dimension triple differs from (3,2,1) under all stated smoothness, connectedness and distinct-rational-mark hypotheses.
    - An invariant proposed in a successor as mark-sensitive factors completely through the unmarked curve.
    - A claimed endpoint invariant varies with an admissible auxiliary choice.
    - A purported information distinction is solely an inconsistent basis or representation choice.
  confounders:
    - Confusing a Frobenius trace with all information in a marked cohomological object.
    - Introducing target-dependent global objects without charging their size.
    - Treating a chosen path as a canonical function of its endpoints.
  interpretation_limits:
    - Nonconstancy of an invariant is not injectivity or an efficiently usable scalar relation.
    - No cover-decoder or path-signature novelty is claimed relative to the cited proposals.
    - Failure of one construction does not close marked cohomological methods.
    - Unresolved well-definedness or missing construction is inconclusive, not evidence against the general direction.
  heuristic_assumptions: []
  heuristic_assumptions_note: Deterministic information and well-definedness audit; no distribution assumption asserted.
  target_complexity:
    time_exponent: 'No solver proposed; claimed exponent improvement = 0.'
    memory_exponent: 'No solver proposed; claimed exponent improvement = 0.'
