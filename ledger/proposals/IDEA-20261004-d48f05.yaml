  title: >-
    Multiplication by 28 has degree 784 and multiplication by 27 has degree 729
  class: measurement
  claim: >-
    Multiplication by 28 has degree 784. Multiplication by 27 has
    degree 729. Seven hundred eighty-four exceeds seven hundred
    twenty-nine by 55. The product of the two degrees is 571536. Their
    sum is 1513. The gap is a map degree, not an ECDLP exponent and not
    the degree pair 729 and 676.
  mechanism: >-
    OBJECT FRAME. R3 is the multiplication endomorphism. The
    operation set is reading the degree, which is coordinate-dependent
    on the integer multiplier and is not a translation of a curve
    point. Twenty-eight squared is 784. Twenty-seven squared is 729. Two
    maps of degree 729 have gap 0 and product 531441. No point is mapped.
