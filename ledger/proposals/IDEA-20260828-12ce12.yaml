idea:
  id: IDEA-20260828-12ce12
  title: >-
    Round-scaled automated local-collision / message-modification
    differential-path search, structurally distinct from the already-executed
    birthday-enumeration proxy, to test whether genuine sufficient-condition
    amortization is achievable by an unguided algorithm rather than only by
    hand-selected paths
  class: tooling
  claim: >-
    A genuine automated differential-characteristic search instrument — one
    that (i) derives candidate local-collision templates (single/low-weight
    input-difference propagation through MD4/MD5's F/G/H/I step function)
    purely from the closed-form bitwise truncated-differential structure of
    F/G/H/I as specified in RFC 1320/1321 (never from the quarantined Wang
    payload), and (ii) applies message modification — deterministic use of
    unconsumed message-word freedom (the F_t quantity already defined in
    IDEA-20260816-585c93) to force early-round conditions, per the general
    principle stated in KN-TECH-066 — will, at round-reduced MD4/MD5 (r in
    {1,2,3} rounds, i.e. 16/32/48 steps), find a satisfying local-collision
    path at empirical cost that tracks 2^(c_late(r)) (conditions NOT
    forceable by available message freedom) rather than 2^(c_total(r)) (the
    naive total sufficient-condition count), where c_total(r) is the same
    quantity IDEA-20260816-3e6af3's calibration instrument is built to
    validate. THIS IS DIFFERENT IN KIND from the calibration already executed
    in EV-MDFIVE-f3e1ca: that instrument was a bounded 2^21-block birthday
    enumeration (disclosed substitution, O-7) that fails by construction
    (needs ~2^64 blocks); this proposal builds and measures the actual
    instrument class the RQ names for target 3, and does so ONLY on
    round-reduced, publicly-derived templates — it does not touch the
    quarantined payload or the full 64-step schedule.
  mechanism: >-
    STAGE 1 derives, directly from RFC 1320/1321's textual definitions of
    F(x,y,z)=(x&y)|(~x&z), G, H, I, the exact bitwise truncated-differential
    propagation table for each function (a closed-form computation: for each
    function and each input-difference bit pattern, the probability that a
    given output-difference bit results, conditioned on the values of the
    non-differing bits — this is standard bitwise DDT arithmetic, re-derivable
    from the public specification with no reference to any specific attack
    path). STAGE 2 uses this table plus the pinned word/shift schedule to
    compute, for a chosen low-weight input/message difference, the exact
    sufficient-condition count c_total(r) at round count r, and separately
    c_late(r) = the subset of those conditions imposed at steps where the
    consumed message word is still unconsumed elsewhere (F_t > 0, per
    IDEA-20260816-585c93's accounting). STAGE 3 implements message
    modification: for each condition in c_late(r), directly solve for the
    message-word bit(s) that force it (a triangular back-substitution over
    the still-free word, exploiting that early conditions constrain distinct
    bit positions of a still-unconsumed word), leaving only c_total(r) -
    c_late(r) conditions to probability. STAGE 4 measures wall-clock and
    candidate-evaluation cost to find a template whose full round-r output
    difference is confirmed by independent straight-line recomputation
    (never inferred from the partial forcing alone). STAGE 5 sweeps r =
    1,2,3 and compares the empirical cost curve to the two competing
    closed-form predictions (2^c_total(r) and 2^c_late(r)), both computed
    BEFORE the search runs.
  novelty_status: unverified
  citations:
    - ref: KN-TECH-066
      provenance: internal
      claim: >-
        Message modification / freedom-degree accounting as the correct
        frame for unkeyed differential cryptanalysis; message modification
        forces early conditions at amortised cost near one.
      verified_by: "idea-generator subagent (read in full during idea generation)"
    - ref: "RFC 1321 (MD5), pinned at coordination/goals/GOAL-MD5-001/batches/BATCH-1f30fe/inputs/rfc1321-md5.txt, sha256 284a79d148400d9cd2a423211d1103b5cef0fb9256a4cbe6d7ebe5197c3149dd"
      provenance: internal
      claim: F/G/H/I definitions and the Round 1-4 word/shift/constant schedule.
      verified_by: "already pinned and validated in this goal (TASK-20260821-420070); reused, not re-fetched"
    - ref: "RFC 1320 (MD4), pinned at coordination/goals/GOAL-MD5-001/batches/BATCH-af29f6/inputs/rfc1320-md4.txt, sha256 f727b15e...2421c7"
      provenance: internal
      claim: MD4's Round 1-3 word schedule and F.
      verified_by: "already pinned and validated in this goal"
    - ref: EV-MDFIVE-f3e1ca
      provenance: internal
      claim: >-
        The executed blind calibration used bounded birthday enumeration,
        NOT a differential/message-modification search, by disclosed
        substitution (observation O-7, deviation 1); cost anchor ~54-55s
        wall for a doomed 2^21-block search that never reached a 128-bit
        match.
      verified_by: "idea-generator subagent (read ledger evidence record in full during idea generation)"
    - ref: IDEA-20260816-3e6af3
      provenance: internal
      claim: >-
        Proposed condition-counting-instrument calibration (predicted/actual
        probability ratio) that c_total(r) in this proposal should ultimately
        be checked against.
      verified_by: "idea-generator subagent (read proposal in full during idea generation, not yet executed)"
    - ref: IDEA-20260816-585c93
      provenance: internal
      claim: >-
        F_t (unconsumed message-freedom) step-indexed accounting this
        proposal's c_late(r) computation reuses.
      verified_by: "idea-generator subagent (read proposal in full during idea generation, not yet executed)"
    - ref: IDEA-20260816-c20a5b
      provenance: internal
      claim: >-
        Adjacent mini-MD5 gain-curve proposal executing a collision arm that
        "forces conditions using free words" without specifying how the
        differential template is discovered; discriminated from this
        proposal, which is specifically about whether an UNGUIDED algorithm
        can find the template at all, not about the overall attack-cost gain
        once a template is given.
      verified_by: "idea-generator subagent (read in full during idea generation)"
    - ref: IDEA-20260821-ea35d1
      provenance: internal
      claim: >-
        Validated toy-scale MITM harness and E_d/D_r propagation-support
        methodology this proposal's HEUR-H2 validation route reuses.
      verified_by: "idea-generator subagent (read in full during idea generation)"
    - ref: "Wang, Yu, 'How to Break MD5 and Other Hash Functions' / 'A New Attack on the MD5 Collision' (quarantined payload, coordination/goals/GOAL-MD5-001/quarantine/MD5-COLLISION-PATH-WANG-2004-199.yaml)"
      provenance: recalled
      claim: Origin of the message-modification / local-collision technique family.
      verified_by: null
      note: >-
        Quarantined; never read by any agent in this program. Pointer only —
        this proposal's templates are derived independently from the public
        F/G/H/I specification, not from this source.
  assumptions:
    - >-
      The instrument derives templates ONLY from the closed-form F/G/H/I
      differential structure computed from RFC 1320/1321's public text; it
      never reads coordination/goals/GOAL-MD5-001/quarantine/, and this must
      be attested exactly as the goal's contamination firewall already
      requires.
    - >-
      "Unconsumed word freedom" at step t is exactly F_t as defined in
      IDEA-20260816-585c93; if that proposal has not been executed, this
      proposal's c_late(r)/c_total(r) split is computed independently
      in-line rather than assumed correct by citation.
    - >-
      A satisfying template is certified only by independent straight-line
      recomputation of the full round-r output difference, never by the
      partial (early-condition) forcing alone.
  proof_search_map:
    bottleneck: >-
      The step whose removal changes the result: deriving the local-collision
      template purely from the public F/G/H/I differential structure AND
      having genuine message-word freedom (F_t > 0) available at the steps
      carrying the template's expensive conditions. Remove the second half
      (run a template whose expensive conditions fall on already-consumed
      words) and no forcing is possible; empirical cost must then equal
      2^c_total(r) exactly — a corroborating negative control, not the
      interesting case.
    baseline_embedding:
      parameter_slice: >-
        The naive baseline is direct verification of 2^c_total(r) randomly
        drawn message pairs against the template, exactly reproducible at
        every r.
      reproduction_check: >-
        Over >=10^4 randomly drawn messages at r=1, the observed satisfaction
        rate of the template's full-round-1 output difference must match the
        closed-form 2^-c_total(1) prediction within a chi-square test at
        alpha=0.05, BEFORE any "amortized" search-cost claim is trusted.
    observation_collision:
      observable: >-
        Candidate-evaluations-to-first-satisfying-template, and the resulting
        message pair's full round-r output difference.
      distinct_preimage_search: >-
        Many distinct message assignments realize the SAME template (this is
        exactly what message modification exploits — many messages satisfy
        the forced early conditions); the promotion condition to "found" is
        the full round-r output-difference match, verified independently, so
        a template-level "collision" among candidate messages does not by
        itself certify success.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace naive 2^c_total(r) random-message verification with a
          message-modification forcing routine that deterministically fixes
          c_late(r) conditions and leaves only c_total(r)-c_late(r) to
          probability.
        predicted_gain: >-
          MODELED, NOT YET MEASURED: empirical cost approx 2^(c_total(r) -
          c_late(r)) rather than 2^c_total(r). The actual gain, and whether
          the algebraic-dependence residual (per IDEA-20260816-3e6af3)
          erodes it, is exactly what this proposal's run would measure.
    quantifier_order: >-
      EXISTS a message pair (M, M') differing only in the declared input
      difference such that the round-r output difference matches the
      template's target difference, FOR the declared template and declared
      round count r — an existential, per-template claim. NOT CLAIMED: for
      all r a satisfying template is found within budget. NOT CLAIMED: the
      found template is the cheapest possible one.
    method_ceiling:
      strongest_certifiable_claim: >-
        At declared r in {1,2,3}, an automated instrument derived purely
        from public specification found (or, within a declared budget,
        failed to find) a satisfying local-collision differential path at
        measured cost C(r), independently re-verified by direct
        recomputation of the round-r output difference.
      nearby_object_control: >-
        The already-executed birthday-enumeration instrument (EV-MDFIVE-f3e1ca)
        is the nearby object with a KNOWN verdict: FAIL/FAIL, doomed
        by a ~2^64-block search space. This proposal's instrument must be
        shown to differ from it IN KIND (measuring condition-forcing cost on
        a bounded template, not birthday-table-collision cost on the whole
        digest) — if it collapses to the same table-collision behavior under
        analysis, this proposal has re-implemented the already-doomed
        approach under a different name and that finding must be reported as
        such.
    proof_obligations:
      - claim: >-
          The closed-form F/G/H/I bitwise differential-probability table,
          computed from RFC text, is validated against exhaustive
          brute-force truth on >=20 small template samples before being
          trusted for c_total(r)/c_late(r).
        responsibility: correctness
      - claim: >-
          The message-modification forcing routine's claimed forced
          conditions are verified to hold with empirical probability 1 (not
          merely high probability) over >=1000 independently drawn fixed
          values of the non-forced words, at r=1.
        responsibility: success_probability
      - claim: >-
          Every result is scoped to r in {1,2,3} rounds of MD4/MD5, publicly
          derived templates only, and the quarantined payload is never read;
          any downstream citation for the full 64-step schedule is out of
          scope.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: >-
        ratio of empirical search cost (candidate evaluations to first
        verified satisfying template) to the naive 2^c_total(1) baseline, at
        r=1 (16 steps)
      direction: lower
      minimum_effect: >-
        at least 16x (2^4) reduction if message modification amortizes as
        the closed-form c_late(1) prediction implies; the actual ratio is
        reported regardless of which side it falls on
    - metric: >-
        same ratio at r=2 (32 steps), compared in advance to the two
        competing closed-form predictions 2^c_total(2) and 2^c_late(2)
        computed before the run
      direction: lower
      minimum_effect: >-
        the observed cost must fall within a declared null band of ONE of
        the two pre-computed curves (2^c_total(2) or 2^c_late(2)); falling
        outside both bands is itself a reportable third outcome
    - metric: >-
        MD4-vs-MD5 cost ratio R at matched r, using the identical
        instrument and templates (only shifts/constants differ)
      direction: different
      minimum_effect: >-
        R outside [0.5, 2.0] at any r is a reportable finding (mirrors the
        R-ratio convention already established in H-MDFIVE-bf7767/0ca596);
        R inside that band is the expected controlled null at this bounded
        scale, per the same convention.
  minimal_test:
    design: >-
      Run r=1 (16 steps, single round, cheap and brute-force-checkable)
      first: derive the closed-form F table, validate it against brute
      force, compute c_total(1) and c_late(1), run the forcing search, and
      measure cost against both curves. Only if r=1 completes and the
      forcing routine's PO (forced conditions hold with probability 1) is
      discharged does the run proceed to r=2, then r=3, each declared with
      its own wall-clock ceiling and halt rule (per this goal's established
      convention: a halt is a budget outcome, never negative evidence about
      MD5). The quarantined payload and the full 64-step schedule are never
      touched at any stage.
    controls:
      - >-
        Random-bijection null: replace F/G/H/I with a message-keyed random
        bijection of matched width; message modification should show no
        amortization advantage there (local-collision propagation depends on
        F's specific bitwise structure), so the c_late/c_total cost gap
        should collapse to noise.
      - >-
        MD4-vs-MD5 paired run at identical r, reusing the paired-control
        filter already established by IDEA-20260816-e40ea1.
      - >-
        Dependency disclosure: if IDEA-20260816-3e6af3's condition-counting
        calibration has not been executed, this run computes and reports its
        own independent c_total(r)/c_late(r) accuracy check in-line rather
        than assuming the sibling instrument is correct.
    required_metrics: [candidate evaluations and wall-clock to first verified template per r, c_total(r) and c_late(r) closed-form per r, forced-condition empirical satisfaction rate must be 1.0, MD4/MD5 cost ratio R per r, null-primitive cost per r]
  falsification_conditions:
    - >-
      At r=1, cost does NOT show at least 16x amortization over 2^c_total(1)
      despite F_t accounting showing sufficient free words — falsifies the
      message-modification amortization claim (H2) at this scale.
    - >-
      At r=2, the search fails to converge within the declared budget while
      a birthday/brute-force enumeration over the SAME restricted space
      succeeds — locates the bottleneck in the search algorithm, not the
      primitive.
    - >-
      The random-bijection null shows amortization comparable to real
      F/G/H/I — the measured gain is a harness artifact.
    - >-
      R (MD4/MD5 cost ratio) stays inside [0.5, 2.0] at every tested r — a
      controlled null (per this goal's convention), not a defect.
  confounders:
    - >-
      Hand-tuned template-selection heuristics inadvertently encoding the
      author's prior knowledge of Wang-style local collisions — mitigated by
      deriving templates only from the closed-form, auditable F/G/H/I DDT.
    - Condition-count instrument miscalibration (dependency on IDEA-20260816-3e6af3).
    - Small-round-count effects not generalizing to r=4 (Round 4).
    - >-
      Engineering-effort asymmetry between the message-modification search
      and the brute-force baseline (mirrors IDEA-20260816-c20a5b's own named
      confounder).
  interpretation_limits:
    - >-
      Scoped to r in {1,2,3} rounds (at most 48 of 64 steps) of MD4/MD5; no
      claim about the full 64-step schedule, the quarantined path, or MD5
      collision resistance in general.
    - >-
      A failure at r=2 or r=3 is a budget/algorithm-capability statement
      (AGENTS.md rule 3), never evidence about MD5.
    - >-
      This instrument's success at small r does not, by itself, license any
      extrapolation to full-scale cost; that extrapolation is explicitly not
      attempted here.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The per-bit truncated-differential propagation probability of
        F/G/H/I, computed under the assumption that the "gating" register's
        bits are independent and uniform, accurately predicts a step's local
        condition count.
      rigorous_support: >-
        RFC 1321 sec 3.4's proved single-step F-balance property (if the
        bits of X,Y,Z are independent and unbiased, each bit of F(X,Y,Z) is
        independent and unbiased) — the same rigorous fact already used as
        HEUR-H1's justification in H-MDFIVE-bf7767/0ca596.
      validation_plan: >-
        Reuse (or independently reimplement and cross-check)
        IDEA-20260816-3e6af3's enumeration-based calibration instrument:
        exhaustively enumerate the true satisfying-input fraction for a
        16-bit ARX toy primitive at condition counts c=1..12, compare to the
        2^-c prediction via chi-square, and report the predicted-to-actual
        ratio as this proposal's own error bar rather than assuming it is 1.
    - id: H2
      statement: >-
        Conditions imposed by steps whose message word is still unconsumed
        (F_t > 0) can be forced to hold with probability 1, up to the
        algebraic-dependence residual measured by 3e6af3/585c93.
      rigorous_support: >-
        None proven in this program; this is exactly the KN-TECH-066-stated
        principle (message modification forces conditions at amortised cost
        near one), imitating the classical idea that a free variable can
        satisfy several near-triangular equations simultaneously when the
        equations act on disjoint or triangularizable bit ranges.
      validation_plan: >-
        At r=1, using the same toy-scale infrastructure validated in
        IDEA-20260821-ea35d1, sample >=1000 independently seeded fixed-word
        assignments and measure the empirical satisfaction rate of the
        template's "forced" early conditions (predicted: exactly 1.0) versus
        its "probabilistic" late conditions (predicted: 2^-1 per condition),
        via a binomial test against each prediction, reporting the observed
        rate and its 95% CI rather than assuming success.
  target_complexity:
    time_exponent: >-
      No attack exponent is claimed. The deliverable is a measured
      (evaluations, wall-seconds) pair per round count r in {1,2,3}, and a
      comparison to the two closed-form curves 2^c_total(r) and 2^c_late(r),
      valid only in this bounded regime.
    memory_exponent: >-
      Small — a message-word freedom table and a local template store, well
      under 1 MB at these round counts.
    best_known: >-
      The only existing calibration instrument for RQ target 3
      (harness/run_md5_calib.py, EV-MDFIVE-f3e1ca) measures a
      BIRTHDAY-ENUMERATION proxy, not a differential/message-modification
      search; its cost anchor (~54s for a doomed 2^21-block search) is not a
      measurement of this instrument class at all. There is no existing
      incumbent for the specific quantity this proposal measures.
    hidden_overhead: >-
      The real test of message modification's GENERAL applicability (not
      per-path amortization) hides in whether automated TEMPLATE SELECTION
      itself is exponentially hard — if the space of possible templates at
      r=2/3 is astronomically large with only a tiny "good" fraction, the
      search may spend its whole budget selecting a template rather than
      forcing conditions, and this cost is easy to under-report if only
      successful runs are logged. (This is exactly the quantity
      IDEA-20260828-400967 below is designed to measure independently.)
    tradeoff_note: >-
      Not a birthday/table-based tradeoff — this is a satisfy-and-force
      search, not a meet-in-the-middle match; if a table-based amortization
      across multiple templates emerges it is reported as a separate
      finding, not assumed.
  dominated_by: >-
    n/a (no result claimed). Checked against the UNVERIFIED 2^123.4 preimage
    figure, the seconds-scale collision figure (both in RQ-MDFIVE-6870c1),
    and the birthday-enumeration cost anchor (EV-MDFIVE-f3e1ca O-2, ~54s for
    a doomed 2^21-block search). This proposal's deliverable (an
    evaluations-per-round-count curve for a structurally different
    instrument class) occupies no axis on any of them.
  sota_delta: >-
    No attack. The genuine RQ-target-3 instrument class (differential /
    message-modification search) has not yet been measured by this program
    at all — the only executed calibration run used birthday enumeration by
    explicit disclosed substitution (EV-MDFIVE-f3e1ca O-7). This is the
    first proposal to attempt the actual instrument class the RQ names.
  estimated_cost:
    implementation: high
    compute: medium
  recommended_priority: high
