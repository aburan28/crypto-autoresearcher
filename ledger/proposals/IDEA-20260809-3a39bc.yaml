idea:
  id: IDEA-20260809-3a39bc
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-AEADC-8db132
  goal_id: GOAL-AEADC-001
  title: >-
    ChaCha20-Poly1305 has a different authenticator algebra — measure whether its
    commitment failure is equally cheap, and if not, exactly what makes it harder
  class: measurement
  claim: >-
    Poly1305 evaluates a polynomial over a prime field with a clamped key and
    adds a keystream-derived value, while GHASH works over a binary field with an
    unclamped subkey. The claim is that the commitment-collision construction
    transfers but with a measurably different cost, that the difference is
    attributable to specific named features (clamping, prime-field reduction,
    keystream-derived mask), and that isolating which feature carries the
    difference is more useful than the certificate itself.
  mechanism: >-
    Set up the analogous linear conditions for two keys over the prime field,
    accounting for clamping as a restriction on the achievable subkeys, and solve.
    Then ablate: repeat the construction with clamping removed and with the mask
    fixed, measuring the cost change attributable to each.
  why_not_a_renamed_known_approach: >-
    Multi-key collisions for both AEADs are discussed in the literature. The
    ABLATION — attributing the cost difference to individual design features,
    with each feature disabled in turn in this program's own implementation — is
    the part that produces transferable design guidance rather than another
    certificate.
  predictions:
  - observable: construction cost for the two-key certificate, ChaCha20-Poly1305 versus GCM
    metric: ratio of construction times
    predicted: Within a small factor; a very large ratio would indicate a structural obstruction worth naming precisely.
  - observable: cost attributable to clamping
    metric: cost with and without clamping in the ablated implementation
    predicted: Nonzero but not decisive. If clamping alone blocks the construction, that is a significant and directly usable design finding.
  minimal_test: >-
    Produce certificates for both AEADs at full standard parameters, then run the
    ablation with clamping disabled and with the mask fixed, recording cost in
    each configuration and verifying every certificate independently.
  controls:
  - 'ABLATED IMPLEMENTATIONS ARE NOT THE STANDARD: every ablated configuration is labelled as non-standard in the record, and no certificate against an ablated variant is presented as a certificate against the AEAD.'
  - 'TEST-VECTOR PRECONDITION for the unablated implementation.'
  falsification_conditions:
  - The construction does not transfer to the prime-field authenticator at all, which would be a strong structural result and must be verified rather than assumed.
  - Ablations show no cost attribution, meaning the difference is implementation noise.
  interpretation_limits: >-
    Adversary chooses both keys. Not confidentiality, not forgery. Ablated
    variants are laboratory objects and say nothing about the standard.
  sota_delta: 'No attack. Delta: a feature-level attribution of commitment cost differences between the two fielded AEADs.'
  dominated_by: Downstream of IDEA-20260809-313546; not dominated by any corpus record.
  estimated_cost: Implementation medium; compute negligible.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for Poly1305: GOAL-POLYMAC-001 owns forgery bounds, a different property. WEB NOT CHECKED.'
  source_refs:
