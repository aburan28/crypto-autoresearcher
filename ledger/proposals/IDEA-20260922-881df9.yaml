idea:
  id: IDEA-20260922-881df9
  question_id: RQ-DREG-d7b6d6
  added: '2026-09-22'
  status: proposed
  proposed_by: idea-generator
  title: >-
    Three-arm attribution of a named-degree gap: isogeny class versus
    different-trace curves versus support-matched non-elliptic systems
  class: control
  claim: >-
    Representation class R3 of RQ-ECDLP-623a32 (Weil restriction of the
    chained summation coordinates), attack stage relation-decomposition
    Gröbner degree. A gap of at least 1 in certified last-fall degree or in
    grevlex solving degree among F_4-isogenous curves on LADDER-W is an
    isogeny-class effect only when the same gap is absent from different-trace
    curves over F_4 and absent from support-matched non-elliptic systems. If
    either null shows a range at least as large, the gap is coefficient noise
    or monomial-shape noise. A volcano-level split inside the class is a
    degree-profile statement and is not an attack-cost result for
    RQ-VOLC-f6253b. No ECDLP exponent is claimed.
  mechanism: >-
    PAIR AND OPERATION SET. The representation is the same R3 boolean Weil
    restriction as IDEA-20260922-f1e5b7. Sigma on arm A is the set of
    F_4-rational Vélu isogenies of degree 2 or 3 acting on models. Arms B and
    C have no isogeny action. Sigma is not group translation. TRICHOTOMY:
    coordinate-dependent (IDEA-20260806-c5d183 Class III). The within-arm
    range of a named degree is a property of a coefficient ensemble, not of a
    group element. LOSSY PROJECTION. The tracked object is the triple of
    ranges (range_A, range_B, range_C) of one named degree at one rung. The
    triple discards which system produced which degree. Two different
    assignments of degrees to curves can share a range. That collision is the
    point of the control. A range that loses nothing would be the list of
    ideals. F2 is the component system. What is added beyond F2, and beyond
    the slope census, is the attribution rule. WHAT THE THREE ARMS SEPARATE.
    Arm A is the certified F_4-isogeny class (same trace). Arm B is ordinary
    curves over the same F_4 with a different trace, coefficients drawn from
    the same seed width. Arm C keeps the monomial support of the base chained
    system and replaces coefficients by a frozen uniform draw, destroying the
    Weierstrass relation. OUTCOMES, NAMED BEFORE THE RUN. (A-only) range_A >= 1
    and range_B = 0 and range_C = 0. The gap is organized by the isogeny
    class and is not reproduced by trace changes or by the monomial shape.
    Still not an attack. (Trace noise) range_B >= range_A. Variation across
    different traces is at least the within-class variation. Moving along
    isogenies is not a special source of degree scatter. (Shape noise)
    range_C >= range_A. The elliptic relation is not required for a gap of
    that size. (Flat) all three ranges are 0 on finished cells. No gap to
    attribute. (Unmeasured) a cell whose basis did not finish contributes to
    no range. TATE CONFOUND, STATED. Over a fixed finite field, same trace
    is the same F_q-isogeny class. Arm B cannot match the group order. A
    difference between A and B is confounded with the trace. The within-A
    range is the only quantity that varies a model inside the class. Arm B
    answers a different question, whether that within-class range is small
    compared with the range across traces. VOLCANO STRATUM. If the certified
    class has two or more Kohel levels, split arm A into level ranges and
    apply the same rule. A level gap is believed only when a shuffle of the
    level labels on the same degree list kills the gap (the shuffled range
    difference is 0 while the true level range difference is at least 1).
    What this adds beyond RQ-VOLC-f6253b. That question asks whether volcano
    depth changes any ECDLP attack cost and routes a depth effect through a
    named non-generic resource. This control does not measure rho, pairings,
    or endomorphism evaluation. Its observable is the Gröbner degree profile
    only. A depth effect here would be a degree-profile effect at toy scale,
    which VOLC does not fix as the observable, and it would still not be an
    attack cost. If the class has one level, the stratum is not_applicable
    and is reported, not imputed.
  novelty_status: unverified
  citations:
    - ref: RQ-DREG-d7b6d6
      provenance: internal
      claim: >-
        Requires a same-shape null. An isogeny-only census cannot separate an
        isogeny effect from coefficient variance.
      verified_by: idea-generator
    - ref: EV-ISO-001
      provenance: internal
      claim: >-
        At prime-field m=3 the only solving-degree variation sat in both the
        isogeny arm and the coefficient controls. That is the attribution
        pattern this control is built to detect at a ladder that is not m=3.
      verified_by: idea-generator
    - ref: DEC-20260716-003
      provenance: internal
      claim: >-
        The m=3 neighbor screen is rejected_scoped. This control must not
        rerun it as its primary observable.
      verified_by: idea-generator
    - ref: RQ-VOLC-f6253b
      provenance: internal
      claim: >-
        Asks whether endomorphism-ring depth changes any measurable ECDLP
