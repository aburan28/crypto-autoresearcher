      verified_by: null
  assumptions:
    - >-
      Identifier assigned by handoff TASK-20260922-d7b6d6. Proposal only.
    - >-
      Uses the same LADDER-W system shape as IDEA-20260922-f1e5b7 so the two
      proposals can share a later run, but the claim here is attribution, not
      the slope.
    - >-
      F2 is the component. The closed m=3 screen is the baseline slice, not
      the arm comparison.
    - >-
      Arm B changes the trace on purpose. That confound is interpreted, not
      removed.
    - >-
      If the certified class has fewer than two vertices, arm A has no range
      and the control reports "class too small", which is not a flat profile.
  proof_search_map:
    bottleneck: >-
      A nonzero within-class degree range can be produced by coefficient
      noise or by monomial shape. The bottleneck is an observable that is
      present in arm A and absent in arms B and C.
    baseline_embedding:
      parameter_slice: >-
        EV-ISO-001, where solving-degree variation at m=3 appeared in both
        the isogeny arm and the controls, so the attribution was coefficient
        variance.
      reproduction_check: >-
        On a frozen m=3 prime-field slice, the three-arm rule must return
        "trace noise" or "flat", not "A-only", in agreement with
        DEC-20260716-003. An A-only reading at m=3 is an instrument failure.
    observation_collision:
      observable: >-
        The triple (range_A, range_B, range_C) for one named degree at one
        rung. Many degree assignments share one triple.
      distinct_preimage_search: >-
        Keep the per-curve degree list. A label shuffle of arm A is a second
        preimage with the same multiset of degrees. The volcano test is
        believed only when the unshuffled level split differs from the
        shuffled split by at least 1.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The fiber of a degree gap over three ensembles. A gap is an
          isogeny-class effect only on the fiber where B and C are zero.
        predicted_gain: >-
          Turns a within-class range into an attributed range. No complexity
          gain.
    quantifier_order: >-
      THERE EXISTS a named degree D in {last-fall degree, grevlex solving
      degree} and a rung n in {1, 2} such that range_A(D, n) >= 1 AND
      range_B(D, n) = 0 AND range_C(D, n) = 0, with all three ranges computed
      on finished cells only. The negation used as the noise explanation is
      range_B >= range_A OR range_C >= range_A. Quantifiers do not leave
      LADDER-W.
    method_ceiling:
      strongest_certifiable_claim: >-
        On LADDER-W, a finished gap is either A-only, trace noise, shape
        noise, or flat. Toy attribution only. Not an algorithm.
      nearby_object_control: >-
        The m=3 slice, where A-only is the wrong answer, and a label-shuffle
        of arm A, where a volcano split that survives the shuffle is an
        artifact.
    proof_obligations:
      - claim: The m=3 slice does not read A-only.
        responsibility: baseline
      - claim: >-
          Ranges use certified last-fall degree or grevlex solving degree
          from finished bases only.
        responsibility: correctness
      - claim: The margin is an integer gap of at least 1.
        responsibility: strictness
      - claim: Attribution is scoped to LADDER-W's finished cells.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: >-
        Attribution label of the grevlex solving-degree range at the rung
        where the base degree is largest among finished cells
      direction: different
      minimum_effect: >-
        The label is one of {A-only, trace noise, shape noise, flat,
        unmeasured, class too small}. A-only is the isogeny-class
        explanation. Either noise label, or flat, rejects it. Unmeasured is
        neither.
    - metric: >-
        Absolute difference between the true volcano-level range and the
        label-shuffled level range, if at least two levels exist
      direction: lower
      minimum_effect: >-
        Difference 0 means the level split is an artifact of the labels. A
        difference of at least 1 is a degree-profile depth split at toy
        scale, still not an attack cost.
  minimal_test:
    design: >-
      Reuse LADDER-W from IDEA-20260922-f1e5b7. Arm A is the certified class.
      Arm B is eight ordinary non-isogenous curves over F_4 from a frozen
      seed, each with trace different from the base, singular draws rejected.
      Arm C is eight systems with the base monomial support and coefficients
      redrawn uniformly from F_2 on the boolean generators, frozen seed,
      checked to be unequal to the base coefficient vector. At each rung,
      compute the three named degrees only when the grevlex basis finishes,
      and always store a finished full-column rank profile through degree 4.
      Apply the attribution rule separately to last-fall degree and to
      grevlex solving degree. If arm A has at least two Kohel levels, compute
      the level range and one frozen shuffle of those labels. If it has one
      level, record not_applicable.
    controls:
      - Arm B, different trace, same field.
      - Arm C, same monomial support, elliptic relation destroyed.
      - Label shuffle inside arm A before any volcano split is believed.
      - >-
        m=3 prime-field slice as the nearby object on which A-only is false.
      - >-
        Decay check from inventor protocol section 3. Compare the arm A range
        at n=1 and at n=2. A range that stays constant while the base degree
        increases is recorded as an artifact suspect, not as a stable isogeny
        effect.
    required_metrics:
      - range_A, range_B, range_C for last-fall degree and for grevlex solving degree, per rung, finished cells only
      - attribution label per named degree
      - volcano level of each arm A vertex, or not_applicable
      - shuffled-label range difference when two levels exist
      - count of unmeasured cells, excluded from every range
  falsification_conditions:
    - >-
      range_B >= range_A or range_C >= range_A on every finished named degree.
      The isogeny-class explanation is rejected on LADDER-W. The gap, if any,
      is noise.
    - >-
      All three ranges are 0. There is no gap. The A-only explanation is
      vacuous, not confirmed.
    - >-
      The m=3 slice returns A-only. The instrument is wrong. No LADDER-W
      label is kept.
    - >-
      A volcano split that is unchanged by the label shuffle is an artifact.
      It does not answer RQ-VOLC-f6253b.
    - >-
      Unfinished bases do not enlarge a range and do not count as a large
      degree.
  confounders:
    - >-
      Arm B changes the group order. A large range_B may be an order effect
      rather than unstructured coefficient noise. The label "trace noise"
      includes that confound on purpose.
    - >-
      Eight curves is a toy sample, not a tail estimate. H1 forbids
      extrapolating the sample range to the set of all curves.
    - >-
      Arm C can accidentally satisfy a Weierstrass equation. Reject and
      redraw under the frozen seed if the support-matched system is the
      summation ideal of an elliptic curve.
    - >-
      A class with two vertices can show range_A >= 1 by a single bad model.
      Report the vertex count beside the label.
    - >-
      Kohel level estimated from rational isogeny counts can be wrong if the
      walk is uncertified. Do not stratify an uncertified coverage fraction.
  interpretation_limits:
    - >-
      Toy attribution only. A-only does not yield an algorithm and does not
      change the rho exponent p^{1/2}.
    - >-
      The walk is not charged. Galbraith ePrint 2024/924 remains recalled and
      unread. A degree gap smaller than a charged walk would still not be an
      exponent improvement, and this proposal does not claim one.
    - >-
      No new factor base. Same reused subspace shape as the companion
      measurement. Not a KN-OPEN-020 escape.
    - >-
      Does not answer RQ-VOLC-f6253b's attack-cost question. A positive level
      split is a degree-profile observation at toy scale only.
    - >-
      Does not rerun the m=3 screen as the result. The m=3 slice is a control.
    - >-
      Geometric isogenies are excluded. Trace, order, and extension point
      counts are checks, not arm-A variables.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The attribution is a finite comparison of ranges on the finished
        cells of LADDER-W. It imitates no classical distribution. The range
        of eight arm-B curves is not an estimate of an extreme-value minimum
        over a cryptographic isogeny class.
      rigorous_support: >-
        A range of a finite set of integers is defined without a tail law.
        IDEA-20260807-f6137c closure 2 records why a class minimum at
        cryptographic size is a different estimand. This control does not
        estimate that minimum.
      validation_plan: >-
        Publish the degree list, not only the range. A reader can recompute
        the label. No larger-field sample is claimed.
  target_complexity:
    time_exponent: >-
      Measurement cost. At most a few dozen grevlex bases or degree-4
      Macaulay ranks on at most about 12 boolean variables. Not a p-power
      attack exponent.
    memory_exponent: >-
      One Macaulay matrix with at most C(16, 4) columns per cell. No rho table.
    best_known: >-
      Pollard rho at about p^{1/2} group operations. Algebraic baseline
      FINDING-PF-IC-001 sits above that exponent at m=3. This control beats
      neither.
    hidden_overhead: >-
      None claimed. Unfinished cells are dropped from the range rather than
      charged as a large degree.
    tradeoff_note: >-
      No ECDLP exponent is claimed. No time-memory collision tradeoff.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
  dominated_by: "n/a (no result claimed)"
  sota_delta: >-
    No change to the p^{1/2} rho exponent. Relative to DEC-20260716-003, which
    already attributed m=3 solving-degree scatter to coefficient controls,
    the delta on offer is an attribution label at t=4 on LADDER-W, a
    qualitative flag in a set of five labels, not a faster algorithm. An
    A-only gap of integer size at least 1 remains a polynomial change in one
    Macaulay matrix. Frontier checked against rho, the m=3 closure, and
    RQ-VOLC-f6253b's attack-cost question, which this idea does not answer.
