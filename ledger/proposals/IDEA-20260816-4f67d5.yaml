    question, a different protocol, and an object that is a prefix of compression calls rather than
    an upward closure over a tree poset.'
  - 'IDEA-20260816-79aec0, IDEA-20260816-585c93, IDEA-20260816-3d23e2, IDEA-20260816-3edd14: all returned
    by the Merkle grep, all concerning Merkle-Damgard iteration or hash-function internals on other
    research questions. Different structure entirely; the shared string is the name Merkle and nothing
    else.'
  - 'The companion leaf-collision entry in this batch: that one tracks an elementwise-maximum chain-position
    accumulator in the one-time layer. This one tracks node membership in the tree layer. Different
    poset, different closure, different operation; they share only the transcript they read.'
  - 'IDEA-20260813-945a67: node and subtree reuse under a single-fault model producing alias certificates.
    Every revelation here is honest and fault-free, the object is set membership, and no certificate
    is produced.'
  assumptions:
  - The closure is upward only; computing a child from a parent and a sibling is a preimage problem
    and is assigned no cost, which is stated as a modelling choice rather than established.
  - A signature reveals exactly the leaf and its h siblings at each layer, as recorded in this repository's
    structural description, which marks itself UNVERIFIED against primary text.
  - Node values are treated as opaque; the object cannot see collisions or any value-level structure,
    and any question depending on those is outside it.
  - Matching revealed cardinality exactly between arms is the right way to isolate arrangement from
    quantity; a reader who thinks quantity is the interesting variable should read the |K|-against-q
    curve instead, which is reported separately.
  - Behaviour at enumerable heights is representative of the closure's structure at larger heights,
    which is a claim about a monotone closure over a finite poset and is the weakest assumption in
    the contract.
  predictions:
  - metric: '|K| in the signal arm minus |K| in the uniform-random null at matched revealed cardinality,
      at h = 12 and q = 64'
    direction: higher
    minimum_effect: 'explicit refusal to pre-commit a magnitude: the size of the advantage is the
      deliverable, and I genuinely do not know whether the path pattern''s closure advantage is large
      or vanishing, since paths close many ancestors but also overlap heavily. The binding pre-commitment
      is that the difference is reported at matched cardinality with the null''s spread, never as
      a bare signal number.'
  - metric: root-known indicator in the signal arm after one signature
    direction: different
    minimum_effect: 'forced value 1: a single authentication path closes the entire root path by construction,
      and any other outcome is a closure-implementation failure rather than a finding'
  - metric: root-known probability in the uniform-random null after the same number of revealed nodes
      as one signature
    direction: lower
    minimum_effect: 0.5
  - metric: crossover height at which the signal and uniform-null |K| curves become indistinguishable
      at matched cardinality
    direction: different
    minimum_effect: 'explicit refusal to pre-commit: locating this height, or establishing that no
      crossover occurs within the enumerable range, is the deliverable'
  - metric: one-away leaf count in the signal arm versus the contiguous-subtree null at matched cardinality
    direction: different
    minimum_effect: 0.1
  minimal_test:
    design: 'One height decides whether the comparison has content. Fix h = 12, so the tree has 8191
      nodes and enumerates instantly, and take q from 1 to 512 on a logarithmic grid. For each q,
      draw q leaf indices uniformly, reveal each leaf plus its 12 siblings, apply the upward closure
      by fixed-point iteration over a bit array, and record |K|, the one-away leaf count, and the
      root indicator. In the same invocation, count the exact number of distinct nodes the signal
      arm revealed at each q, draw that many distinct nodes uniformly at random from the tree, apply
      the identical closure, and record the same three quantities. Repeat on three seeds. The discriminating
      observable is the difference in |K| at matched cardinality, with the null''s between-seed spread
      as the resolution. Two checks must pass first: the signal arm''s root indicator must be 1 after
      a single signature, which validates the closure, and the null arm at cardinality one must produce
      a closure of exactly one node. Cost is seconds. If the two curves coincide at h = 12, that is
      the measured obstruction and the sweep to larger heights is a matter of confirming its extent
      rather than hunting for an effect.'
    controls:
    - Uniform-random-revelation null at exactly matched revealed cardinality, identical closure, same
      invocation, three seeds.
    - Contiguous-subtree null at matched cardinality, which shares the signal arm's locality without
      its path structure and separates locality from arrangement.
    - 'Single-signature root-closure check: the signal arm must reach the root after one signature
      by construction, validating the closure implementation.'
    - 'Singleton check: a null arm at cardinality one must close to exactly one node, validating that
      the closure does not over-propagate.'
    - Concrete-hash leaf selection arm alongside uniform leaf selection, confirming the pattern's
      effect does not depend on how leaves are chosen.
    required_metrics:
    - '|K| as a curve in q, signal arm, per height'
    - '|K| at exactly matched revealed cardinality, uniform-random null, with between-seed spread'
    - '|K| at matched cardinality, contiguous-subtree null'
    - one-away leaf count per arm and per q
    - root-known indicator and, in the nulls, root-known probability
    - crossover height, or an explicit statement that no crossover occurs within the enumerable range
  falsification_conditions:
  - 'The signal arm fails to reach the root after one signature: the closure is misimplemented, since
    a single authentication path closes the root path by construction, and nothing else may be read.'
  - 'A null arm at revealed cardinality one closes to more than one node: the closure over-propagates,
    most likely by a wrongly included downward or sideways rule.'
  - '|K| decreases anywhere as q grows: the closure is not monotone and the implementation is wrong.'
  - 'Signal and uniform-null curves coincide within spread at every tested height: recorded as a measured
    obstruction with its height range and resolution -- the path arrangement confers no closure advantage
    over cardinality there, and later analyses may count revealed nodes and ignore their arrangement.'
  - 'The contiguous-subtree null matches the signal arm while the uniform null does not: the effect
    is locality, not path structure, and must be reported as locality.'
  - 'Concrete-hash and uniform leaf selection give materially different curves: leaf-index distribution
    is confounding the measurement and the question routes to the randomizer-distribution entry.'
  confounders:
  - 'Revealed cardinality in the signal arm is not q times (h+1): paths overlap, so the count must
    be measured rather than computed, and matching the null to a computed rather than measured cardinality
    would silently bias the comparison.'
  - At large q both arms saturate the tree and all differences vanish for a trivial reason; the contract
    reports the saturation q per height and marks which points lie beyond it.
  - The uniform null reveals nodes at all depths, while the signal arm's revelations concentrate near
    the leaves, so a difference in |K| could reflect depth distribution rather than path structure
    -- which is exactly what the contiguous-subtree null is for, and neither null alone separates
    it.
  - One-away leaf counts are sensitive to how the closure treats already-known leaves, and an off-by-one
    in that bookkeeping produces a smooth, plausible, wrong curve.
  - Leaf indices drawn uniformly versus by a concrete truncated hash differ in their collision rate,
    which changes path overlap and therefore revealed cardinality, entangling this measurement with
    the index-distribution question owned by another entry.
  interpretation_limits:
  - Knowing a Merkle node means knowing a public hash value; nothing in this object concerns secrets,
    and no artifact may imply that a large closure is a key-recovery or forgery consequence.
  - Results are exact at heights up to about 22 and say nothing about deployed hypertree geometries,
    which lie outside the enumerable range.
  - The upward-only closure is a modelling choice; an observer with a preimage capability is outside
    the object entirely and no bound here applies to one.
  - A coincidence between signal and null is an obstruction about arrangement, not evidence that transcripts
    reveal nothing -- the |K|-against-q curve, reported separately, is where quantity is addressed.
  - Nothing here bears on the fault or memory-corruption claim class.
  target_complexity:
    time_exponent: No attack exponent is claimed and nothing is attacked. The closure costs O(h *
      2^h) worst case per evaluation by fixed-point iteration over a bit array, and O(q * h) in practice
      by processing only the affected ancestors, at heights up to 22.
    memory_exponent: No attack memory exponent is claimed. The knowledge set is one bit per node position,
      about one megabyte at h = 22 and about sixteen megabytes at h = 26 packed.
    best_known: 'The incumbent inside this repository is silence with a cost term attached: four records
      mention the authentication path, all as a signature-size or charging term, and none treats revealed
      nodes as an object or computes anything about them. The count of node-closure measurements here
      is zero. No claim is made about what exists outside this repository.'
    hidden_overhead: 'The overhead hides in cardinality matching, not in the closure. Because paths
      overlap, the signal arm''s revealed-node count must be measured per draw and the null re-drawn
      to match it exactly, per q and per seed, which turns a one-line null into a bookkeeping exercise
      and is the place a subtle bias would enter unnoticed. The second hidden cost is the closure''s
      asymmetry: the upward-only rule is a modelling decision that looks like an implementation detail,
      and a wrongly included sideways rule produces curves that are smooth, monotone and completely
      wrong, which is why the singleton and single-signature checks are stated as gates rather than
      as sanity checks.'
  dominated_by: 'n/a (no result claimed). Checked against every frontier row this repository maintains
    across time, memory and data/queries: a closure-size curve over public node positions is not an
    attack and has no coordinate on any of those axes. Nothing dominates it, it dominates nothing,
    and it is not entered on any frontier.'
  sota_delta: 'no attack; conceptual/measurement contribution only. Against this repository''s own
    state: the authentication path appears as a cost term in four records and as an object in none,
    so this would produce the first closure curve, with a matched-cardinality null attached and either
    an advantage or an obstruction reported as a number.'
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'Separable parts. (1) That the closure can be implemented and validated
    by the singleton and single-signature gates: about 0.95, it is a fixed-point iteration over a
    bit array and the gates are decisive. (2) That the signal arm shows a closure advantage over the
    uniform-random null at matched cardinality at small heights: about 0.75, since a path closes its
    whole root chain while scattered nodes mostly close nothing -- but I hold this loosely, because
    at matched cardinality the null gets many more distinct positions in play than intuition suggests.
    (3) That the advantage persists to the top of the enumerable height range rather than crossing
    over: about 0.4, and locating a crossover would be the more interesting outcome. (4) That the
    contiguous-subtree null separates locality from path structure cleanly, meaning it lands strictly
    between the signal arm and the uniform null: about 0.5, and if it coincides with the signal arm
    the honest conclusion is that the effect is locality and should be described as locality. (5)
    That the result is usable by other work in this bucket: about 0.6 either way, since a coincidence
    licenses later analyses to count revealed nodes and ignore arrangement, which is a genuinely useful
    simplification and is why a negative here is not a wasted run.'
