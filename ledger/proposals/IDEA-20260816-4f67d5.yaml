idea:
  id: IDEA-20260816-4f67d5
  question_id: RQ-SLHDSA-001
  added: '2026-08-16'
  title: Track the set of Merkle nodes a transcript observer can compute under upward closure after
    q signatures, measure how that set grows against random node revelation of the same cardinality,
    and report the height at which the authentication-path pattern stops conferring any structural
    advantage over cardinality alone.
  class: mechanism
  claim: '(A) A signature transcript reveals nodes in a highly structured pattern: one leaf plus its
    sibling path to the root, per signature, per layer. Whether that structure matters, or whether
    only the number of revealed nodes matters, is a question about a set and its closure, and it is
    answerable by enumeration at heights this program can fully enumerate. (B) The right object is
    the knowledge set K: the nodes an observer can compute, closed upward under the rule that a parent
    is known once both its children are known, and closed under nothing else, since the hash is one-way
    downward. This closure is the whole content of what a transcript gives away structurally, and
    it is a purely combinatorial object requiring no hash and no probability. (C) Two quantities are
    measurable exactly: |K| as a curve in the number of signatures q, and the count of one-away leaves
    -- leaves whose value would become computable if one additional specific node were revealed --
    which measures how close the transcript comes to over-determining the tree. Both are exact at
    heights up to about 22 by direct enumeration. (D) The null is what makes either number mean anything:
    reveal the same number of nodes uniformly at random from the tree, apply the identical upward
    closure, and compare. If the path pattern confers structural advantage, the signal arm''s closure
    must be strictly larger at equal revealed cardinality. If the two match, the pattern is worth
    nothing beyond its cardinality -- which is a usable measured obstruction, not a null result, because
    it tells every later analysis that counting revealed nodes suffices and their arrangement can
    be ignored. (E) WHAT IS NOT CLAIMED: no attack, no forgery, no key recovery, no weakness, no security
    level, no statement about any FIPS 205 parameter set, no statement about SHA-2 or SHAKE, no statement
    about what the literature contains, and nothing about the fault or memory-corruption class. Knowing
    a Merkle node is knowing a public hash value; nothing in this object touches a secret, and no
    artifact may imply otherwise.'
  mechanism: 'STAGE A: define the closure precisely and defend the asymmetry. Upward: if both children
    of a node are known, the parent is known. Downward: nothing, because computing a child from a
    parent is a preimage problem, and the object deliberately assigns it no cost. Sideways: nothing,
    because a sibling is not determined by its brother and their parent without inverting the hash.
    Getting this asymmetry wrong is the single way to produce a wrong and plausible answer, so it
    is stated first and encoded as a test. STAGE B: implement the closure as a fixed-point iteration
    over a bit array indexed by node position, which terminates in at most h rounds and is exact.
    STAGE C: generate signal-arm revelations by drawing q leaf indices and revealing, per leaf, the
    leaf itself plus its h siblings; generate null-arm revelations by drawing the same total number
    of distinct nodes uniformly from the tree. Both go through the identical closure. STAGE D: measure
    |K|, the one-away leaf count, and the root-known indicator, as curves in q. STAGE E: sweep h and
    locate the crossover height, if any, at which the signal and null curves become indistinguishable
    at matched cardinality. STAGE F: repeat the signal arm with leaf indices drawn from a concrete
    truncated hash rather than uniformly, to check that the pattern''s effect does not depend on how
    leaves are selected, which is the only place this entry touches the index-distribution question
    owned by the randomizer entry.'
  novelty_status: unverified
  novelty_screen:
    method: 'grep -ril for Merkle, authentication path, node, closure, tree hashing over ledger/proposals/,
      ledger/hypotheses/, knowledge/. Read RQ-SLHDSA-001 in full and the statement block of H-SLHDSA-3a403a.
      Checked the question_id of every proposal the Merkle grep returned, since the string appears
      in several 2026-08-16 records from sibling buckets in this batch: IDEA-20260816-79aec0 and IDEA-20260816-585c93
      are on RQ-MDFIVE-6870c1, IDEA-20260816-3d23e2 on RQ-BLAKE-584719, IDEA-20260816-3edd14 on RQ-SHAONE-081e3a,
      IDEA-20260816-8639e7 on RQ-WFS-e776b6. Read the titles of all five.'
    results: 'The Merkle grep is dominated by Merkle-Damgard, not Merkle trees: IDEA-20260816-79aec0
      concerns Merkle-Damgard strengthening and padding in MD5, IDEA-20260816-585c93 counts MD5 degrees
      of freedom, IDEA-20260816-3d23e2 is a BLAKE output-side injectivity audit, IDEA-20260816-3edd14
      is a SHA-1 disturbance-vector enumeration, IDEA-20260816-8639e7 concerns a reusable transcript
      prefix in a public-coin protocol on RQ-WFS-e776b6. None is about a hash tree and none is on
      this research question. The authentication-path grep returns IDEA-20260805-fbe36a, IDEA-20260808-02a046,
      IDEA-20260805-88ecef and H-SLHDSA-3a403a, in every case as a signature-size or cost term inside
      a FORS-focused argument, never as an object. IDEA-20260816-8639e7 is the nearest in spirit anywhere
      in the repository -- it measures a reusable transcript prefix as a counted object -- but it
      is on a different question, a different protocol and a different structure, and its object is
      a prefix of compression calls rather than a closure over a tree.'
    verdict: 'UNVERIFIED. Reasoning about what a Merkle authentication path reveals is basic to the
      whole construction and this program cannot read external literature, so nothing is asserted
      about what exists elsewhere; a closure over known nodes is an obvious formalization that others
      have very likely written down. What is claimed new is internal and modest: this repository mentions
      authentication paths only as cost terms in four records, has no record treating tree-node knowledge
      as an object, and the specific comparison proposed -- the path-pattern closure against a uniform-random-revelation
      null at matched revealed cardinality, swept for a crossover height -- is assembled from elementary
      parts that nobody here has assembled on this or any other target.'
  object_first_candidate:
    tracked_object: 'The knowledge set K: the set of Merkle tree node positions an observer can compute
      from a transcript, closed upward under the rule that a parent is known once both children are
      known. The object is followed as signatures accumulate, and its associated quantities are |K|,
      the one-away leaf count, and whether the root is reached.'
    lossiness: 'The projection discards every node''s actual hash value, the secret key, the messages,
      the WOTS+ signatures carried alongside the paths, and the order in which nodes were revealed.
      What survives is membership over node positions -- a bit per node. This is heavily lossy: from
      K one cannot compute a single node value, verify a single signature, or determine which message
      revealed which leaf. It propagates because the closure rule reads only membership: whether a
      parent becomes known depends on whether both children are known, never on their values. That
      is precisely why the object is exact and hash-free. The boundary is explicit: any question about
      what an observer can do with the values -- find a collision, invert a node -- is invisible here
      by construction, and the entry claims nothing about such questions.'
    propagation: One signature reveals a leaf and its h siblings, so the object updates as K <- closure(K
      union {leaf} union siblings). Because the closure is monotone and idempotent, K only grows and
      the update is order-independent. Structurally, a single signature's path always closes the entire
      root path -- each ancestor has both children known once the sibling is supplied -- so the first
      signature already yields h+1 new nodes plus h closure nodes, and later signatures on nearby
      leaves contribute progressively fewer new nodes as their paths share ancestors. That decay is
      the propagation law and its rate against q is what the null arm is compared on.
    survival_score: The closure is exact at every height h with 2^{h+1} node positions representable,
      which on this hardware means h up to 22 comfortably (about 8 million nodes as a bit array) and
      h up to 26 with a packed representation and more patience. Beyond that, the object survives
      as a sampled estimate over subtrees with bands. The object does not dissolve at a parameter
      boundary in the mathematical sense -- it is a monotone closure over a finite poset at any height
      -- but its measured comparison against the null loses resolution once q is large enough that
      both arms saturate the tree, and the contract reports the saturation q per height rather than
      running past it.
  null_object_control: 'A uniform-random-revelation arm: draw exactly the same number of distinct
    node positions uniformly at random from the whole tree, apply the identical upward closure, and
    measure the identical quantities, in the same process invocation and on the same seeds. Cardinality
    is matched exactly, not approximately, so the only difference between arms is arrangement. For
    the signal arm to mean anything, its closure size must exceed the null''s at equal revealed cardinality;
    if the two curves coincide, the recorded result is that the authentication-path arrangement confers
    no closure advantage over cardinality at that height, which is a measured obstruction with a number
    attached and is reported as the finding rather than as an absence. A second null reveals the same
    cardinality in random contiguous subtrees rather than uniformly, which is a stronger null because
    it shares the signal arm''s locality without sharing its path structure, and separates locality
    from path-specific arrangement.'
  discriminated_from:
  - 'IDEA-20260805-fbe36a, IDEA-20260808-02a046 and IDEA-20260805-88ecef: all mention the authentication
    path as a signature-size or cost term inside FORS-focused occupancy or charging arguments. None
    treats revealed nodes as a set, none computes a closure, and none has a null.'
