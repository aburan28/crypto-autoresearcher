idea:
  id: IDEA-20260816-d202cf
  question_id: RQ-PMA-001
  added: '2026-08-16'
  title: Test whether the divisor-parity obstruction verdict is invariant under the twenty-four index
    relabellings of the four-element index set and under all four anchor choices, since a verdict
    that depends on the frozen anchor-1 triple selection is a property of the gauge and not of the
    prescribed minor table
  class: control
  claim: '(A) The obstruction predicate of IDEA-20260726-012 is defined relative to a CHOICE: H-PMA-001
    freezes anchor index 1 and the three triples (1,2,3), (1,2,4), (1,3,4), and forms Delta_ijk for
    exactly those. But the prescribed data p_S is indexed by subsets and carries no distinguished
    index, so relabelling the four indices by any permutation sigma in S_4 carries one prescribed
    table to another and must carry realizability to realizability -- a matrix realizes the relabelled
    table if and only if the permuted matrix realizes the original. (B) It follows that a SOUND obstruction
    predicate must be equivariant: the verdict on a table must equal the verdict on every relabelled
    table, and in particular must not depend on which of the four indices is used as the anchor, nor
    on which three of the four available anchored triples are selected. (C) The proposal is to measure
    that equivariance directly. For each prescribed table in a frozen grid, compute the verdict under
    all four anchor choices and, independently, under all twenty-four relabellings, and report the
    size of the verdict orbit. A verdict orbit of size 1 everywhere is the required behaviour. Any
    table with a verdict orbit of size 2 is a measured instrument defect: the predicate reports OBSTRUCTED
    for one gauge and NOT_OBSTRUCTED_BY_THIS_GATE for another on the same mathematical object. (D)
    What is NOT claimed: that a disagreement would refute the underlying square-class mathematics.
    It would not. An odd valuation exhibited under any single anchor is still a valid obstruction
    certificate under the one-directional reading, so a disagreement would refute only the exact-classifier
    framing that H-PMA-001 freezes, and it would do so cheaply and before any brute-force decider
    is built. (E) Also NOT claimed: that S_4 is the full symmetry group of the problem. Diagonal conjugation
    and transposition also act, and this entry deliberately tests only relabelling. (F) No attack,
    speedup, or security consequence is claimed.'
  mechanism: 'Stage 1 builds the relabelling action explicitly: sigma in S_4 sends the table (p_S)
    to (p_{sigma^{-1}(S)}), and the corresponding matrix action is simultaneous row and column permutation,
    which preserves every principal minor up to the same relabelling. This is verified computationally,
    not assumed, by checking on random matrices that the minors of P_sigma A P_sigma-transpose equal
    the relabelled minors of A exactly. Stage 2 implements the predicate as a pure function of (table,
    anchor, triple-set) with no hidden global state, so that the gauge is an explicit argument rather
    than baked in. Stage 3 evaluates, per table, the four-element verdict vector over anchors and
    the twenty-four-element verdict vector over relabellings, and records the orbit size and, where
    the orbit is nontrivial, the exact minimal disagreeing pair with both discriminants printed. Stage
    4 runs the null arm. Stage 5 separates two distinct failure sources that a naive run would conflate:
    a verdict difference caused by a genuinely different square class, versus one caused by a degenerate
    branch (some q_ij vanishing under one anchor but not another), which is not a disagreement at
    all and must be classified into the declared degenerate class per RQ-PMA-001''s constraints. The
    entry is refuted as an instrument if stage 1''s minor-relabelling identity fails, since then the
    action is misimplemented and every orbit size is meaningless.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read ledger/proposals/IDEA-20260726-012.yaml in full, including its confounders block,
      ledger/hypotheses/H-PMA-001.yaml in full including test_boundary.parameters, ledger/questions/RQ-PMA-001.yaml
      constraints in full, and the controls block of experiments/EXP-PMA-001/specification.yaml. Grepped
      ledger/proposals/ and ledger/hypotheses/ for: anchored triple, anchor, equivarian, relabel,
      permutation invarian, gauge choice, symmetry group.'
    results: 'anchored triple returns ZERO hits outside IDEA-20260726-012 and H-PMA-001. IDEA-20260726-012''s
      confounders block comes closest of anything in the repository: it warns that the three anchored
      quadratics share entries and gauge choices and that counting them as statistically independent
      would overstate evidence. That is a warning about DOUBLE COUNTING evidence across the three
      triples; it is not a test of whether the verdict depends on the gauge, and it proposes no equivariance
      measurement. EXP-PMA-001''s four declared controls are CTRL-PMA4-GROUND-TRUTH, CTRL-PMA4-CHAR2,
      CTRL-PMA4-DEGENERACY and CTRL-PMA4-GROEBNER; none of them varies the anchor or the index labelling,
      so the frozen contract would run the predicate at exactly one gauge and never learn whether
      the gauge mattered. The parameters block fixes anchor index 1 and the three triples as a frozen
      constant.'
    verdict: 'UNVERIFIED. Nothing is asserted about literature outside this repository. Claimed new
      inside it: equivariance of the obstruction verdict under index relabelling as a measured control,
      and the observation that the frozen contract holds the gauge constant and therefore cannot detect
      gauge dependence. Assembled from known parts: the gauge-sharing concern is already voiced in
      IDEA-20260726-012''s confounders; the predicate, the formulas for q_ij, c_ijk and Delta_ijk,
      and the degenerate-branch discipline are all taken verbatim from that proposal and from RQ-PMA-001''s
      constraints. The new content is turning a stated worry into a number.'
  object_first_candidate:
    tracked_object: 'The VERDICT VECTOR of the predicate over the gauge group: for a fixed prescribed
      table, the function from (anchor, triple-set) or from sigma in S_4 to the ternary value OBSTRUCTED,
      NOT_OBSTRUCTED_BY_THIS_GATE, DEGENERATE. What is followed through the computation is that vector
      and its orbit size, not any individual discriminant.'
    lossiness: 'Genuinely lossy, and aggressively so. Each Delta_ijk is a rational function in k(t)
      with a full divisor; the tracked object retains only a ternary label per gauge element, discarding
      the divisor, the degree, the residual constant class and the discriminant itself. That is compatible
      with the target operation because relabelling acts on tables and hence on verdicts, and the
      verdict is exactly the quantity the predicate is contracted to produce -- so the retained part
      propagates by definition of the predicate. The loss is what makes the control cheap: the orbit
      size of a ternary vector is computable without ever comparing two rational functions.'
    propagation: One step of the target operation is composing with a transposition of two indices.
      It permutes the fifteen prescribed values, permutes the four available anchors, and permutes
      the four anchored triples among themselves; the induced action on the verdict vector is therefore
      a permutation of coordinates, and the orbit size is invariant under it by construction. The
      content of the measurement is whether the VALUES at those coordinates are constant, which the
      action does not force and which is exactly what is unknown.
    survival_score: 'The structure survives exactly as far as the predicate is defined: all four anchors
      and all twenty-four relabellings at n = 4, for every table on the nondegenerate locus. It dissolves
      the moment a q_ij vanishes under one gauge and not another, which is not a disagreement but
      a branch, and that dissolution point is itself a measured quantity here -- the fraction of tables
      whose verdict vector contains at least one DEGENERATE entry. It also dissolves at n at least
      5, where the anchored-triple construction of IDEA-20260726-012 is not defined at all and this
      entry has nothing to say.'
  null_object_control: 'Two nulls, both run in the same invocation as the signal arm and through the
    identical code path. NULL 1 (the essential one): replace the predicate by a gauge-blind reference
    verdict function that depends only on the table -- concretely, a fixed hash of the canonicalised
    table mapped to the same ternary alphabet with matched marginal frequencies drawn from a declared
    seed. This null must show verdict orbit size exactly 1 on every table, because it cannot see the
    gauge; a nonzero orbit-size-2 count in NULL 1 proves the orbit measurement itself is buggy. NULL
    2: apply the real predicate to uniformly random prescribed tables of the same shape rather than
    to tables from the frozen grid, to measure whether any observed gauge dependence is specific to
    the structured p_S = (t+1)/(t+d_S) family or is generic. For the signal arm to mean anything,
    NULL 1 must show zero non-trivial orbits and the signal arm must be compared against NULL 2''s
    rate rather than against zero.'
  discriminated_from:
  - 'IDEA-20260726-012''s confounder about the three anchored quadratics sharing entries and gauge
    choices: that is a warning against treating three correlated tests as independent evidence. This
    entry does not aggregate evidence at all; it asks whether one verdict changes when the gauge changes,
    which the confounder neither asks nor answers.'
  - 'EXP-PMA-001''s CTRL-PMA4-DEGENERACY: that control feeds deliberately degenerate fixtures and
    checks they are branched correctly. This entry feeds NONDEGENERATE tables and varies the gauge,
    and treats a degenerate branch as a classification rather than as the object of study.'
  - 'EXP-PMA-001''s CTRL-PMA4-GROUND-TRUTH (the independent constructive decider): that establishes
    truth per instance at real cost. This entry needs no ground truth at all -- self-inconsistency
    across gauges is a defect regardless of which verdict is correct -- which is why it is orders
    of magnitude cheaper and can run first.'
  - 'Entry 1 and entry 2 of this bucket: those enumerate matrices over finite constant fields. This
    entry never enumerates a matrix and works over k(t), where the predicate actually lives.'
  - 'A generic randomised-testing or metamorphic-testing practice: the relation tested here is not
    an arbitrary metamorphic relation but the specific equivariance forced by the fact that RQ-PMA-001''s
    prescribed data is indexed by subsets and carries no distinguished index.'
  assumptions:
  - Simultaneous row and column permutation by P_sigma preserves principal minors up to relabelling
    of the subset index; this is elementary and is CHECKED in stage 1 on random matrices rather than
    assumed.
  - Realizability of a prescribed table over k(t) is invariant under index relabelling, which follows
    from the previous assumption and is the load-bearing premise of the whole control.
  - The predicate can be implemented as a pure function of (table, anchor, triple-set) with the gauge
    as an explicit argument; any hidden dependence on evaluation order or on a global anchor constant
    would invalidate the orbit measurement and is checked by a determinism control.
  - Exact rational-function arithmetic over k(t) is available with canonical reduction, so that two
    discriminants differing only by a square factor are recognised as such; approximate or unnormalised
    arithmetic would manufacture disagreements.
  predictions:
  - metric: nontrivial_verdict_orbit_fraction_signal_arm
    direction: lower
    minimum_effect: 0 -- the pre-committed prediction is that a sound predicate is equivariant, so
      every nondegenerate table in the grid should have verdict orbit size exactly 1 across all four
      anchors and all twenty-four relabellings
  - metric: null1_nontrivial_verdict_orbit_count
    direction: lower
    minimum_effect: exactly 0, by construction -- any nonzero value proves the orbit measurement is
      buggy and voids the signal arm
  - metric: minor_relabelling_identity_violations
    direction: lower
    minimum_effect: exactly 0 across 10^4 random matrices times 24 permutations
  - metric: tables_with_at_least_one_degenerate_gauge
    direction: higher
    minimum_effect: 'I refuse to pre-commit a value. Reason: this is the frequency with which some
      q_ij vanishes under some anchor for the structured family p_S = (t+1)/(t+d_S), which I have
      not computed and cannot honestly estimate; guessing would be a fabricated statistic under AGENTS.md
      rule 5.'
  minimal_test:
    design: 'Take ONE prescribed table from the frozen family with a valid parameter assignment, and
      evaluate the predicate at all four anchors. That is four discriminant computations over k(t)
      and costs seconds. If the four verdicts disagree, the exact-classifier framing of H-PMA-001
      is already in trouble and the finding is complete at a cost near zero. If they agree, extend
      to all twenty-four relabellings of the same table, which is twenty-four more evaluations. Only
      if a small batch of tables all show orbit size 1 does the full grid run. Crucially, this design
      needs NO brute-force existence decider, NO Groebner cross-check and NO matrix enumeration: a
      self-inconsistency is a defect regardless of ground truth, so the expensive half of EXP-PMA-001
      is simply not required to reach the discriminating measurement. The determinism control (same
      input, same gauge, twice, byte-identical output) runs alongside and costs nothing.'
    controls:
    - 'NULL 1: gauge-blind reference verdict function with matched marginal frequencies, which must
      produce orbit size 1 on every table; run in the same invocation through the identical orbit-measurement
      code.'
    - 'NULL 2: the real predicate on uniformly random prescribed tables of the same shape, to establish
      the background rate of gauge dependence outside the structured family.'
    - 'Minor-relabelling identity control: minors of P_sigma A P_sigma-transpose equal relabelled
      minors of A, on 10^4 random matrices times all 24 permutations.'
    - 'Determinism control: identical (table, gauge) input evaluated twice must give byte-identical
      discriminants and verdicts.'
    - 'Degenerate-branch separation control: any gauge where a required q_ij vanishes or a discriminant
      is zero is classified DEGENERATE and excluded from orbit-size scoring, with the count reported
      separately, per RQ-PMA-001''s constraint that degenerate loci are never counted as obstructions.'
    - 'Canonical-reduction control: two discriminants that differ by a square factor in k(t) must
      be recognised as the same square class by an independent square-class routine.'
    required_metrics:
    - per-table verdict vector over the four anchors and over the twenty-four relabellings
    - verdict orbit size per table, and the fraction of tables with orbit size greater than 1
    - for every nontrivial orbit, the minimal disagreeing gauge pair with both reduced discriminants
      and both divisor certificates printed
    - count of tables containing at least one DEGENERATE gauge, and the degeneracy class of each
    - NULL 1 nontrivial orbit count (must be 0) and NULL 2 nontrivial orbit fraction
    - minor_relabelling_identity_violations and determinism_violations
    - square-class agreement between the predicate's internal reduction and the independent square-class
      routine
  falsification_conditions:
  - 'NULL 1 produces any nontrivial verdict orbit: the orbit measurement is buggy and no signal-arm
    number may be reported.'
  - 'The minor-relabelling identity fails on any sampled matrix and permutation: the group action
    is misimplemented and every orbit size is meaningless.'
  - 'The determinism control fails: the predicate has hidden state and is not a function of (table,
    gauge).'
  - 'The signal arm shows a nonzero nontrivial-orbit fraction on nondegenerate tables: the pre-committed
    prediction of equivariance fails, which is a measured instrument defect in the frozen predicate
    and refutes the exact-classifier framing of H-PMA-001 without touching the one-directional obstruction
    reading.'
  - 'The independent square-class routine disagrees with the predicate''s internal reduction on any
    table: canonical reduction is unreliable and apparent disagreements cannot be attributed.'
  - 'The signal arm''s nontrivial-orbit fraction is indistinguishable from NULL 2''s: any gauge dependence
    found is generic to the shape and is not a property of the structured prescribed family.'
  confounders:
  - 'Degenerate branches masquerading as disagreements: a vanishing q_ij under one anchor produces
    a different code path, not a different mathematical verdict. Conflating the two would manufacture
    a defect that is not there, and the separation control exists for exactly this.'
  - 'Incomplete canonical reduction: an unreduced common square factor makes two identical square
    classes look different. The independent square-class routine is the defence.'
  - Only three of the four anchored triples are frozen in H-PMA-001; comparing a three-triple verdict
    against a four-triple verdict is a comparison of two different predicates, not a gauge test, and
    the triple-set must be an explicit argument.
  - Rational-function arithmetic over Q can blow up coefficient sizes across relabellings unevenly,
    so a timeout in one gauge and not another could be misread as a disagreement; a timed-out gauge
    must be recorded as UNDECIDED and excluded, never as a verdict (AGENTS.md rule 3).
  - The twenty-four relabellings are not independent tests -- S_4 is generated by transpositions and
    the verdicts are heavily correlated -- so the orbit size, not a count of agreeing pairs, is the
    only honest summary.
  interpretation_limits:
  - Equivariance is a NECESSARY property of a sound verdict function and never a sufficient one; a
    perfectly equivariant predicate can still be wrong on every table, and this control cannot detect
    that.
  - A disagreement refutes the exact-classifier framing frozen in H-PMA-001, not the one-directional
    obstruction mechanism of IDEA-20260726-012, which stands on any single exhibited odd valuation.
    The record must say so explicitly.
  - Only index relabelling is tested. Diagonal conjugation, transposition, and any scaling symmetry
    are untested here and could carry defects this control cannot see.
  - Results are scoped to n = 4 and to the anchored-triple construction as frozen; nothing transfers
    to other sizes, where that construction is not defined.
  target_complexity:
    time_exponent: No attack exponent is claimed. Cost is 24 predicate evaluations per table for the
      relabelling arm and 4 for the anchor arm, each evaluation being a fixed number of exact rational-function
      operations over k(t).
    memory_exponent: No attack exponent is claimed. Memory is the size of a handful of rational functions
      in k(t) plus a ternary vector of length 24 per table.
    best_known: The incumbent gate on this predicate is EXP-PMA-001's CTRL-PMA4-GROUND-TRUTH, the
      independent constructive existence decider with witness reverification, which is budgeted within
      H-PMA-001's 1.75 total CPU hours across 60 grid instances. That control establishes truth; this
      one establishes self-consistency at a small fraction of the cost and can run before it.
    hidden_overhead: 'The hidden cost is making the gauge an explicit argument at all: the frozen
      construction bakes anchor 1 into its formulas, so implementing the predicate as a pure function
      of (table, anchor, triple-set) is a real refactor and is where a subtle asymmetry could be introduced
      by the very act of testing for asymmetry. Second hidden cost: separating degenerate branches
      from genuine disagreements is judgement-heavy and is where an honest run turns into an equivocal
      one.'
  dominated_by: 'n/a (no result claimed). Checked across time, memory and data/query axes: this entry
    produces no cryptanalytic quantity and no source-to-scalar candidate, so there is no frontier
    row it could sit on or under. Within this repository it is not dominated by CTRL-PMA4-GROUND-TRUTH
    because it answers a different question (self-consistency versus truth) at a different cost.'
  sota_delta: 'no attack; conceptual/measurement contribution only. The only quantitative comparison
    is internal: one table costs 4 or 24 predicate evaluations here versus one full branch-and-witness
    existence decision under CTRL-PMA4-GROUND-TRUTH, and the equivariance defect, if present, is detectable
    without any existence decision at all. That is a control-ordering fact, not a speedup against
    any method.'
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Part A-B (the equivariance requirement is correctly derived, i.e. relabelling
    really does preserve realizability): 0.93. It follows from simultaneous row-column permutation
    preserving principal minors, which I am confident of and which stage 1 checks directly; the residual
    is the possibility that the frozen ordinary-PMA4 setting imposes an ordering I have not seen.
    Part C (the measurement runs cleanly, NULL 1 gives orbit size 1 everywhere, and orbit sizes are
    computable): 0.85; the main risk is canonical reduction over Q. Part D (the signal arm actually
    shows equivariance, i.e. the frozen predicate passes): 0.6 -- genuinely uncertain and that is
    the point. The frozen construction selects three of four triples and anchors index 1, which is
    an asymmetric choice made for convenience; asymmetric choices in verdict functions frequently
    do leak. I would not be surprised either way, which is why this is worth running. Part E (a disagreement,
    if found, is attributable to a square class rather than to a degenerate branch): 0.5, conditional
    on a disagreement existing; attribution is the hardest part of this contract.'
