idea:
  id: IDEA-20260815-862100
  question_id: RQ-EDDSA-9b8473
  added: '2026-08-15'
  title: >-
    BUILD THE Ed25519 VERIFICATION DIVERGENCE MATRIX AS LITERAL
    ACCEPT/REJECT CERTIFICATES ACROSS IMPLEMENTATIONS, NOT AS A PROSE TABLE
  class: measurement

  claim: >-
    Ed25519 verification differs across implementations in cofactor
    handling, canonical encoding, and small-order point rejection. Prose
    comparisons exist and go stale. A matrix of concrete signatures, each
    with the implementations that accept and reject it, is checkable,
    regenerable, and does not depend on anyone reading a specification
    correctly.

  mechanism: >-
    Construct signatures exercising each known divergence axis: non-
    canonical S, non-canonical R, small-order A, small-order R, cofactored
    versus cofactorless equations. Run each against every available
    implementation and record literal verdicts as certificates.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of GOAL-EDDSA-001 objective; grep 'verification semantics' (2),
      'cofactored' (4), 'divergence matrix'.
    results: >-
      The goal names this deliverable explicitly and it is not built.
      External divergence work exists and is well known.
    verdict: >-
      ADAPTATION. The divergence axes are published; the contribution is
      executable certificates in this program's evidence format rather
      than a narrative.

  object_first_candidate:
    tracked_object: >-
      THE ACCEPT/REJECT VERDICT of each implementation on each constructed
      signature.
    lossiness: >-
      A verdict is one bit per (signature, implementation) pair and
      discards the reason, which the record captures separately where the
      implementation exposes it.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while implementations are runnable; each is version-pinned
      since verdicts change across releases.

  null_object_control: >-
    NULL 1 -- a plainly valid signature, which every implementation must
    accept. NULL 2 -- a plainly invalid one, which all must reject. Any
    implementation failing either is misconfigured and its other verdicts
    are void.

  discriminated_from:
    - >-
        Published divergence surveys, which are prose and unversioned;
        this produces regenerable certificates pinned to implementation
        versions.
    - >-
        Malleability records in this corpus, which concern signature
        malleability generally rather than verification-equation
        divergence.

  assumptions:
    - >-
        Implementations are installable and version-pinnable.
    - >-
        Constructed edge-case signatures are valid instances of their
        intended class, verified independently of the implementations
        under test.

  predictions:
    - metric: >-
        valid and invalid control signatures
      direction: different
      minimum_effect: >-
        FORCED: unanimous accept and unanimous reject respectively.
    - metric: >-
        cofactor-axis signatures
      direction: different
      minimum_effect: >-
        Predicted to split implementations; a unanimous verdict would
        mean the axis has closed since the surveys.
    - metric: >-
        count of axes where implementations disagree
      direction: different
      minimum_effect: >-
        The deliverable, reported per pinned version set.

  minimal_test:
    design: >-
      Three implementations, all five axes, both controls. Small and
      immediately useful.
    controls:
      - >-
          Valid and invalid control signatures.
      - >-
          Version pinning recorded per implementation.
      - >-
          Independent verification that each edge-case signature is in
          its intended class.
    required_metrics:
      - >-
          Full accept/reject matrix with versions.
      - >-
          Reason strings where exposed.
      - >-
          Count of disagreeing axes.
      - >-
          Artifact manifest with hashes and rebuild receipt.

  falsification_conditions:
    - >-
        A control fails on any implementation. That implementation is
        misconfigured; its column is void.
    - >-
        No axis splits. Divergence has closed in the tested versions,
        which is a useful and reportable state.
    - >-
        An edge-case signature is not in its intended class. Construction
        wrong; rebuild before testing.

  confounders:
    - >-
        VERSION DRIFT: verdicts are version facts and an unpinned matrix
        is misinformation.
    - >-
        API SEMANTICS: some libraries expose several verification entry
        points with different behaviour, so 'the implementation' is
        underspecified unless the entry point is recorded.

  interpretation_limits:
    - >-
        Documents behaviour; makes no security claim about any
        implementation.
    - >-
        Scoped to the pinned versions and the constructed axes.

  heuristic_assumptions:
    - id: HEUR-EDDSA-AX-1
      statement: >-
        The five constructed axes cover the divergence classes present
        in deployed Ed25519 verifiers.
      rigorous_support: >-
        Rigorous ingredient: the axes are read off the verification
        equation's degrees of freedom -- encoding canonicity, cofactor
        multiplication, and small-order handling. THE GAP: coverage is
        not proved, and an implementation could diverge on an axis
        nobody has enumerated.
      falsification_condition: >-
        An observed inter-implementation disagreement not explained by
        any constructed axis.
      validation_plan: >-
        SAMPLE: all axes x all pinned implementations. TAIL CHECK: any
        disagreement unexplained by the axis set, which is the signal
        that coverage is incomplete. TRANSFER: none beyond tested
        versions.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is one verification per (signature,
      implementation) pair.
    memory_exponent: >-
      Negligible.
    best_known: >-
      Incumbents are the published Ed25519 divergence surveys, which are
      broader in discussion and weaker as evidence.
    hidden_overhead: >-
      Keeping the matrix current requires re-running on every
      implementation release; a stale matrix is worse than none.
    tradeoff_note: >-
      Certificates are precise and version-bound; prose is durable and
      imprecise. This record chooses precision and accepts the maintenance
      cost.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As documentation: dominated by published
    surveys in breadth. As evidence: none in this corpus. Not null on any
    axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: literal accept/reject
    certificates across pinned implementations for five divergence axes,
    replacing a prose comparison with a regenerable artifact.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.9 that three implementations are installable and pinnable. 0.85 that
    at least one axis splits them. 0.3 that a disagreement appears that no
    constructed axis explains, which would be the most interesting outcome.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
  source_refs:
    - RQ-EDDSA-9b8473
    - GOAL-EDDSA-001
    - KN-TECH-056
    - KN-TECH-080
    - docs/inventor-protocol.md
  id_allocation_provenance: >-
    Minted with `python3 tools/allocate_id.py --next idea --date 20260815`
    and verified free with `--check` before use; no state was scanned for a
    "next free number".
