idea:
  id: IDEA-20260823-a06dba
  record_type: research_idea
  schema_version: "1.0"
  added: "2026-08-23"
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-e51cf7
  task_id: TASK-20260823-8f096a
  title: "Adaptive target-blind transcript for a direct pre-elimination shared-leaf locator"
  class: algorithm
  novelty_status: unverified
  claim_ceiling: unverified_zero_run_reachable_image_transcript_theorem_or_scoped_collision_only
  authority:
    changes_goal_status: false
    approves_experiment: false
    records_evidence: false
    claims_breakthrough: false
  claim:
    scope: >-
      A proof-design packet asks whether target-independent public elliptic
      structure can be queried by an adaptive, possibly multi-modulus
      transcript and then separated, decoded, replayed, and verified below
      the generic rho baseline. No exact transcript instantiation, reachable
      separation theorem, decoder theorem, or reachable same-transcript
      different-answer collision is supplied, so no candidate is selected.
    not_claimed:
      - "No ECDLP algorithm, exponent improvement, or cryptographic break is claimed."
      - "No universal lower bound follows from the five B59 cubic routes."
      - "No failure of the adaptive or multi-modulus transcript class is claimed."
      - "No novelty, literature priority, implementation, experiment, or empirical observation is claimed."
  mechanism:
    intended_pipeline:
      - "Precompute target-independent public elliptic source data."
      - "For target Q, build tau_Q=(sigma_0,...,sigma_r) with each adaptive choice C_i=f_i(S_pre,T_Q,F_Q,H_Q,sigma_<i)."
      - "Use a proved separator to identify the target-bearing reachable fibre without target-trained source advice."
      - "Decode per-occurrence information, replay complete elliptic charts and signed local branches, and verify a scalar relation."
    supplied_status: >-
      Only the dependency form and proof obligations are specified. The
      values of r, the choices C_i, output dimensions, reachable-image map,
      separator, decoder, and complete elliptic replay are unknown.
    non_renaming_rationale: >-
      The intended semantic delta from IDEA-121 and B59 is adaptivity across
      multiple target-blind queries with a total transcript bound, not a sixth
      presentation of the five screened Theta(B^3) representations. Because
      that delta is not instantiated, it is not promoted to a candidate.
  predictions:
    - id: P1
      statement: >-
        A valid positive construction must give exact public-to-reachable
        source lineage and bound total calls, total modulus degree, every
        transcript output cardinality, and every adaptive dependency.
      observable: "A complete dependency DAG and reachable-image certificate with no unknown load-bearing field."
    - id: P2
      statement: >-
        A valid separator/decoder route must prove that the frozen transcript
        distinguishes every reachable target answer needed by replay, with
        quantified success and retry cost.
      observable: "A separation lemma plus decoder, replay, and verification lemmas with all multiplicities."
    - id: P3
      statement: >-
        A valid negative disposition for one frozen transcript may instead
        exhibit two reachable elliptic instances with identical complete
        transcripts and different required answers.
      observable: "An exact reachable collision with full chart and source replay; a generic polynomial collision does not qualify."
  minimal_discriminating_test:
    experiment_runs: 0
    type: proof_audit
    discriminates:
      - "a complete target-blind adaptive locator with an end-to-end decoder"
      - "an underspecified or target-trained transcript that merely hides elimination cost"
      - "a frozen transcript refuted by a reachable same-transcript/different-answer collision"
    procedure:
      - "Freeze the quantifier order and every allowed dependency before seeing a target answer or common factor."
      - "Specify the complete reachable elliptic image, charts, Hasse derivatives, local parameters, trivializations, overlaps, and per-occurrence signed markers."
      - "Prove separation plus decoder/replay/verification, or give an exact reachable collision for the same frozen interface."
      - "Charge the expected-cost identity and every resource axis against BSGS, rho, campaign, and conditional fresh-target gates."
    outcome_in_this_record: "Not executable as a proof test because load-bearing definitions are unknown; disposition is REVISE/select-none."
  controls:
    - "B59 matched F_1009 product-circuit pair: identical short synopsis and distinct degree-2 common factor; generic control only."
    - "Reviewer squarefree F_101 low-jet collision; generic control only."
    - "Explicit degree-B^3 norm input rejected before downstream credit."
    - "Supplied-G modulus/source table: B^2 conditional decode is legitimate, but supplied G is not an end-to-end locator."
    - "Random matched product circuit lacking curve-specific reachable structure."
  confounders:
    - "Target-dependent construction or advice hidden in a purported public source table."
    - "Counting coordinates as operations, traffic, peak memory, or advice without separate accounting."
    - "Endpoint multiplicity that collapses distinct per-occurrence marker codes."
    - "Using an additive-line resultant as though it were complete elliptic addition replay."
    - "A generic polynomial collision presented as a collision in the reachable elliptic image."
    - "A conditional decoder given G mistaken for a locator that constructs G."
  falsifiers:
    - "Any allowed choice C_i depends on G, a root, the desired answer, or target-trained source advice."
    - "Two reachable elliptic instances have the same complete frozen transcript and different required replay answers."
    - "The expected end-to-end cost reaches or exceeds the claimed baseline on any load-bearing resource axis."
    - "The proof also accepts one of the five proves-too-much controls."
    - "A required output, fibre, retry, chart, marker, or resource bound remains unknown."
  falsification_conditions:
    exact_scope: >-
      A reachable collision falsifies only the frozen transcript/interface it
      instantiates. Missing definitions or an inability to construct a
      collision is not evidence against the mathematical class.
  assumptions:
    - id: A1
      statement: "B=N^(1/5) is the campaign scaling variable and the target subgroup has order n within the declared elliptic instance."
      status: symbolic_only
    - id: A2
      statement: "All preprocessing and source advice are target independent."
      status: required_not_established
    - id: A3
      statement: "A complete reachable elliptic image admits the proposed transcript, separator, decoder, and replay."
      status: required_not_established
  heuristic_assumptions: []
  costs:
    identity: "C_expected=C_pre+(C_target+C_transcript+C_decode+C_replay+C_verify)/s"
    status: not_computable
    reason: "s, failure cost, retries, target count, transcript dimensions, decoder/replay multiplicities, and resource axes are unknown."
  target_complexity:
    bsgs: "time B^(5/2+o(1)); memory B^(5/2+o(1)) where applicable"
    rho: "time B^(5/2+o(1))=N^(1/2+o(1)); low memory"
    campaign_gate: "time B^(9/4+o(1))=N^(0.45+o(1)), with all other axes disclosed"
    fresh_target_gate: "B^(5/4+o(1))=N^(0.25+o(1)) only where a separately quantified reusable-preprocessing claim is made"
    candidate: unknown
  estimated_cost:
    aggregate_work: unknown
    peak_live_memory: unknown
    coordinate_traffic: unknown
    advice_or_data: unknown
    output: unknown
    communication: unknown
    processors: unknown
  pareto:
    dominated_by: unknown
    sota_delta: unknown
    realized: "No candidate and no realized cost."
    conditional: "A future complete construction must be compared axis by axis; no conditional dominance claim is made here."
    unknown:
      - aggregate_work
      - peak_live_memory
      - coordinate_traffic
      - advice_or_data
      - output
      - communication
      - processors
