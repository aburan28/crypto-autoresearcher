idea:
  id: IDEA-20260807-bbefda
  question_id: RQ-AES-003
  added: '2026-08-07'
  title: 'The AES campaign''s Tier-1 publication candidate rests on a 32-bit localisation that
    CORR-20260803-8fa302 records as ''HALF ESTABLISHED, HALF NOT'', and the discriminating statistic
    is far cheaper than the 2^38 brute rung the record prices: condition on k=3 and measure P(k=4
    | k=3) against 1/256 directly, instead of differencing two large nested counts'
  class: measurement
  claim: 'TWO JOINED DEFECTS. (i) LOCALISATION. CORR-20260803-8fa302 defect_3 records the 32-versus-24-bit
    localisation as ''HALF ESTABLISHED, HALF NOT'': the negative half is strong (k=1 at [0.99941,
    1.00036] on 16.7M events, k=2 at [0.99114, 1.00645] on 65k, excluding a byte-local mechanism
    by about four orders of magnitude), but BY NESTING the 13 excess k=4 events already sit inside
    the k=3 count, and removing them leaves 266 against 255.0, z = +0.69 -- so ''full 32-bit word,
    not three-byte'' is ''one notch stronger than the data supports''. EV-AES-8b8dcf lists it
    under unresolved_confounds and prices the fix at ''roughly 2^38 trials, about 20 hours here'';
    EV-AES-837cd8, dated 2026-08-05, still lists it as open. It is absent from GOAL-AES-003.next_action''s
    ranked BATCH-015 plan, with no stated deprioritization rationale. (ii) THE k-PROFILE. MEAS-GOAL-AES-003-004
    measured excess ratios 1.6 / 6.4 / 11.8 / 13.6 at k = 1..4 with verdict ''NOT CONFIRMED AND
    NOT REFUTED at this resolution''; PUBLICATION-CANDIDATES.md reports the pooled three-seed
    version (1.38 / 5.52 / 11.80 / 13.60), concludes ''neither candidate law describes the data
    across the range'', records that ''the producer''s post-hoc 2^k DDT explanation is disfavoured''
    and states ''no replacement is asserted''. That measurement exists ONLY as a coordination
    artifact whose own measured_by field says ''coordinator-side corroboration, NOT independent
    validation''; none of the twenty EV-AES-* records carries it, so it never reached a Validator
    or Red Team and has no claim tier.'
  mechanism: 'For (i), the discriminating statistic is cheaper than the brute rung by construction:
    CONDITION ON THE k=3 EVENT and measure P(k=4 | k=3) against 1/256 directly, rather than measuring
    k=3 and k=4 separately and differencing two large nested counts whose 0.8-sigma difference
    is invisible by construction. The conditional estimator has variance set by the number of
    k=3 events, not by the total trial count, which is exactly why it escapes the 2^38 pricing.
    For (ii), re-run the k-sweep as a PREREGISTERED arm with the campaign''s now-standard matched
    null and the round-decay check the inventor protocol requires -- does the k-profile FLATTEN
    as r increases? -- and test the one law family the data actually permit, a saturating occupancy
    / coupon-collector law over the k-active-byte event set, against the two the data reject.'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-07'
    grep_results:
    - No H-*, EXP-* or IDEA-* frames the localisation question; naming an item in an evidence
      record's boundaries block creates no successor, because boundaries are immutable prose and
      nothing in the harness converts them into a queue item.
    - No IDEA-*, H-* or EXP- proposes any successor mechanism for a growth that is monotone, sub-exponential
      and saturating in the active-byte count; the campaign has run BATCH-001 through BATCH-015
      without returning to it.
    - 'EV-AES-005 is a different object and its scoping correction cuts the other way: the validator
      established that the r=4 bijection and mod-8 forcing ''follow from round GEOMETRY alone''
      and ''carry NO information about the AES S-box'' (uniformly random bijective S-boxes reproduced
      both at 120/120). A dependence on the NUMBER OF ACTIVE BYTES is precisely the kind of quantity
      that could carry S-box information, so the unexplained k-profile is the one measured constraint
      EV-AES-005''s correction does not dissolve.'
    conclusion: Screened against ledger/proposals, ledger/hypotheses and knowledge/; external
      novelty UNVERIFIED.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS as the primary lens: the r=4 coset bijection
      and the mod-8 forcing, both shown to be geometry-only. The object is the ACTIVE-BYTE-COUNT
      PROFILE of the r=5 excess.'
    tracked_object: The conditional probability P(k=j+1 | k=j) of extending a zero-difference
      event by one more byte, as a function of j and of the round count r.
    one_step_propagation_rule: Each additional active byte multiplies the event probability by
      the conditional; the profile is the sequence of conditionals, and independence predicts
      a constant 1/256.
    newness_score: The distinguisher is very likely known (PUBLICATION-CANDIDATES.md Tier 3 says
      so). The conditional profile is a statement about its INTERNAL STRUCTURE, which is what
      the document argues forecloses cheaper statistics.
  lossy_projection_identifiability_audit:
    projection: the plaintext pair -> the number of zero-difference bytes in the active word.
    what_is_discarded: Which bytes, and their values.
    is_it_only_a_change_of_coordinates: 'NO -- a 32-bit condition is projected to a count in 0..4.
      Honest caveat: the projection is coarse enough that a genuine S-box dependence could be
      invisible in it, so a flat profile is weaker evidence of absence than a structured profile
      is of presence.'
    mirror_failure_check: 'CHECKED, and this is the inventor protocol''s canonical tell. The round-decay
      check IS the mirror-failure test: a genuine structural effect must DECAY as r increases,
      and an excess essentially identical across rounds is the signature of an artifact. The committed
      data already show the excess vanishing at r=5 for the r=4 objects, so the instrument is
      known to be capable of showing decay.'
  null_object_control:
    primary_null: The campaign's standard matched null -- uniformly random bijective S-boxes --
      run on the identical conditional statistic. EV-AES-005 showed this null reproduces the r=4
      objects at 120/120, so if it also reproduces the k-profile, the profile carries no S-box
      information and the campaign's last unexplained constraint dissolves.
    secondary_nulls:
    - 'ROUND-DECAY CHECK: measure the profile at r = 4, 5, 6 and require decay.'
    - 'INDEPENDENCE FORCED VALUE: under byte independence P(k=4 | k=3) must be exactly 1/256;
      that is the null hypothesis the conditional estimator tests directly.'
  assumptions: []
  predictions:
  - metric: P(k=4 | k=3) against 1/256
    direction: different
    minimum_effect: A deviation resolvable with the available k=3 events; this is the estimator
      that decides 32-bit versus 24-bit localisation.
  - metric: k-profile shape at r=5 against a saturating occupancy law
    direction: different
    minimum_effect: Agreement or rejection at three seeds, pre-registered before the run.
  - metric: k-profile flatness as r increases
    direction: lower
    minimum_effect: Decay toward the unconditional rate; absence of decay is the artifact tell.
  minimal_test:
    design: Estimate P(k=4 | k=3) conditionally at r=5 with the matched random-bijective-S-box
      null; separately re-run the k-sweep at r = 4, 5, 6 with the occupancy law pre-registered;
      file the result as an EV-AES-* evidence record with a claim tier, which the existing measurement
      does not have.
    controls:
    - random bijective S-box matched null
    - round-decay check
    - 1/256 independence forced value
    required_metrics:
    - P(k=4 | k=3) with CI and the number of conditioning events
    - k-profile at each r with CIs
    - occupancy-law agreement
    - claim tier assigned by an independent reviewer
  falsification_conditions:
  - 'P(k=4 | k=3) is 1/256 within CI: the fourth byte is independent, the effect is 24-bit, and
    PUBLICATION-CANDIDATES.md Tier-1 item 1 must be restated -- its ''strict 32-bit coincidence
    with no graded shadow'' claim cannot stand.'
  - 'It differs from 1/256: the 32-bit localisation is established and the Tier-1 claim holds
    at its stated strength.'
  - 'The matched null reproduces the k-profile: the profile carries no S-box information, exactly
    as EV-AES-005 found for the r=4 objects, and the campaign''s last unexplained constraint dissolves.'
  - 'The profile does not decay with r: artifact, per the inventor protocol''s structural tell.'
  confounders:
  - 'Nesting: k=4 events are inside the k=3 count, which is what defeated the differencing approach;
    the conditional estimator must be built to avoid re-introducing it.'
  - The number of k=3 events bounds the conditional's resolution; report it and state the achievable
    resolution before running.
  - Pooling across seeds hid structure once already (1.6/6.4/11.8/13.6 versus 1.38/5.52/11.80/13.60);
    report per seed.
  interpretation_limits:
  - Reduced-round AES only. No claim about full AES.
  - The distinguisher itself is very likely known; the claim concerns its internal structure.
  - Assigning a claim tier is a reviewer act; this record proposes the measurement and the evidence
    record it owes.
  heuristic_assumptions:
  - id: HEUR-AESK-1
    statement: A saturating occupancy law over the k-active-byte event set is the right family
      for the k-profile.
    rigorous_support: None. Two other families are already rejected by the data and the producer's
      2^k DDT explanation is disfavoured.
    validation_plan: Pre-register the occupancy law and report its departure, which is the test.
  target_complexity:
    time_exponent: n/a -- distinguisher structure, not a key-recovery cost.
    memory_exponent: n/a
    best_known: The published reduced-round AES distinguisher family (Tier 3 of PUBLICATION-CANDIDATES.md
      records the distinguisher itself as very likely known).
    hidden_overhead: n/a
    tradeoff_note: A structural fact about a known object is a different contribution from a new
      attack, and this record claims only the former.
  dominated_by: 'The known reduced-round AES distinguisher family dominates on the attack axis;
    no attack is proposed. Rows checked: integral/square attacks at 4-6 rounds, impossible differential,
    boomerang/yoyo, and exhaustive key search as the definitional bound.'
  sota_delta: ZERO on attack axes. It is the only measured quantity constraining any mechanism
    for the r=5 effect and it is the campaign's own Tier-1 publication candidate; without an evidence
    record it cannot be cited in any deliverable under the program's own citation rule.
  estimated_cost:
    implementation: low
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 0.9 that the conditional estimator resolves the question with the
    existing k=3 event count -- its variance is set by that count, not by 2^38. 0.5 that P(k=4
    | k=3) comes out at 1/256, which would force the Tier-1 claim to be restated. 0.6 that the
    matched null reproduces the k-profile, given that it reproduced the r=4 objects at 120/120.
