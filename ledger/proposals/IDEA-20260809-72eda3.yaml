idea:
  id: IDEA-20260809-72eda3
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-CSIDH-64343f
  goal_id: GOAL-CSIDH-001
  title: >-
    Impose a maximum circuit depth and watch the ranking of the models change —
    depth limits are a policy input, not a physical constant
  class: measurement
  claim: >-
    Cost comparisons change qualitatively when a maximum circuit depth is imposed,
    because algorithms with long sequential structure must be parallelized at a
    cost while others are unaffected. The claim is that under a declared depth
    limit the ORDERING of the published CSIDH estimates changes relative to the
    unlimited-depth ordering, and that the limit at which the ordering flips can
    be computed exactly within the common model.
  mechanism: >-
    Add a depth constraint to the common cost function; where an algorithm exceeds
    it, apply the parallelization penalty its structure implies; recompute totals
    and orderings as the limit is swept.
  why_not_a_renamed_known_approach: >-
    Depth-limited costing is standard practice in post-quantum security level
    definitions. Applying it INSIDE this reconstruction and reporting the flip
    point is the specific contribution, and it converts a policy parameter into a
    measured boundary.
  predictions:
  - observable: ordering of estimates versus depth limit
    metric: ordering at several limits, with the flip point
    predicted: >-
      An ordering flip within the range of depth limits used in practice. No flip
      would mean the comparison is depth-robust, a useful and clean result.
  - observable: parallelization penalty per analysis
    metric: factor per analysis at a fixed limit
    predicted: Materially different across analyses, because their algorithmic structures differ; identical penalties would suggest the model is not capturing the structural difference.
  minimal_test: >-
    Sweep the depth limit across a declared range, recompute totals per analysis,
    and report orderings and the flip point with the parallelization rule stated.
  controls:
  - 'UNLIMITED-DEPTH ANCHOR: at an effectively infinite limit the totals must equal those of IDEA-20260809-66ef77 exactly.'
  - 'PENALTY-RULE DISCLOSURE: the parallelization rule is stated and applied uniformly; a per-analysis rule is fitting in disguise.'
  falsification_conditions:
  - No ordering change across the entire declared range.
  - Parallelization penalties cannot be derived uniformly from the algorithms' structures, making the comparison arbitrary.
  interpretation_limits: >-
    Depth limits are policy or engineering assumptions. Nothing here says which
    limit is right, and no security level for CSIDH is asserted at any limit.
  sota_delta: 'No verdict. Delta: an explicit dependence of the comparison on a policy parameter, with the flip point computed.'
  dominated_by: Downstream of IDEA-20260809-66ef77; not dominated by any corpus record.
  estimated_cost: Implementation small; compute negligible.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for MAXDEPTH / depth limit: no records. WEB NOT CHECKED.'
  source_refs:
  - Depth-limited security level definitions -- RECALLED, REQUIRED READS.
