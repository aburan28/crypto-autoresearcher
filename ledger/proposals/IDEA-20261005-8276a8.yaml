idea:
  id: IDEA-20261005-8276a8
  question_id: RQ-CANL-63098f
  title: >-
    p-denominator share of duplication height on the j=0 lift versus two
    non-CM nulls at p=19
  class: measurement
  claim: >-
    Let p=19. Let C_cm be y^2=x^3+1 over Q with integral point P_cm=(2,3),
    C_n1 be y^2=x^3+x+1 over Q with P_n1=(0,1), and C_n2 be y^2=x^3-x+1
    over Q with P_n2=(1,1). For a non-torsion point P write x(2^n P)=a/b in
    lowest terms, h the logarithmic naive height log max(|a|,|b|),
    hhat_n(P)=h(2^n P)/4^n, and lambda_{p,n}(P)=v_p(b)*log(p)/4^n, using the
    same natural log in both. The named quantity is Q_n(P)=lambda_{p,n}(P)/hhat_n(P)
    when hhat_n(P)>0, and is undefined when hhat_n(P)=0. The claim is that
    CM structure on this global model, which is the Serre-Tate canonical lift
    of its ordinary reduction at p=19 only if that reduction is ordinary,
    changes this height-growth share: |Q_4(P_cm)-Q_4(P_n1)|>=0.25 and
    |Q_4(P_n1)-Q_4(P_n2)|<=0.10, after the test has checked that the
    reduction of C_cm at 19 is ordinary and that C_n1 and C_n2 are not CM
    by the Frobenius-discriminant test below. Xedni is not claimed to work.
    KR-IC-cd159a remains the standing negative result for lift-to-Q attacks.
    If the CM-null gap is smaller than 0.25, or the null-null gap is larger
    than 0.10, this quantity does not witness a CM effect at p=19 and the
    claim fails.
  mechanism: >-
    Object frame. Representation (R2): three short-Weierstrass models over Q,
    one of them the j=0 model. Operation set Sigma is duplication P |-> 2P on
    the Mordell-Weil group, not translation by an arbitrary point and not the
    translation action on E(F_p). Trichotomy of IDEA-20260806-c5d183:
    partial-action, because Q_n is computed along the doubling orbit, where
    both the p-denominator count and the naive height are read after the same
    4^n normalization, and adding an unrelated point leaves that orbit.
    Lossy-projection test against Sigma: the projection discards y, every
    prime valuation except p, and the archimedean size except as the
    denominator of Q_n, and retains one real ratio. It is lossy: many points
    can share a ratio. It propagates under doubling only to the extent the
    ratio is stable; the test therefore requires |Q_4-Q_3|<=0.05 on each
    point that is used, and a larger drift means the projection does not
    survive Sigma and the claim fails. F5 (p-adic lift of an unknown
    finite-field point) is not the lens. The ordinary reduction of the j=0
    model is used only to name which global model is the canonical lift of
    its special fiber. No discrete log is lifted. The quantity is the
    p-local share of the duplication height estimator, which is one piece of
    the canonical-height growth that RQ-CANL-63098f asks about. It is not the
    liftable-fraction claim of IDEA-20260807-44ba75, not the rank-budget
    identity of IDEA-20260807-6533fd, and not the class-polynomial bit-size
    claim of IDEA-20260811-dcbea4. Jacobson-Koblitz-Silverman-Stein-Teske, as
    recorded in KN-LIT-021 and KR-IC-cd159a, already conclude that xedni
    fails; this record does not reopen that conclusion.
  novelty_status: adaptation
  citations:
    - ref: KR-IC-cd159a
      provenance: internal
      claim: >-
        Silverman's xedni calculus was shown by Jacobson-Koblitz-Silverman-Stein-Teske
        to succeed with negligible probability, and lifting-based ECDLP
        approaches inherit that obstruction. Forecloses treating a
        characteristic-zero lift as an ECDLP method.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-cd159a.yaml
    - ref: KN-LIT-021
      provenance: internal
      claim: >-
        The note records a negative conclusion: xedni is virtually certain to
        fail asymptotically, driven by an absolute bound on the coefficients
        of any relation the lifted points can satisfy. The full paper was not
        read in that note.
      verified_by: knowledge/literature/KN-LIT-021.md
    - ref: KN-LIT-020
      provenance: internal
      claim: >-
        The note describes xedni as lifting points and seeking a low-rank
        global curve through them. It presents the method as a candidate
        whose practicality was left open by that paper, not as a break.
      verified_by: knowledge/literature/KN-LIT-020.md
    - ref: KN-TECH-018
      provenance: internal
      claim: >-
        Automorphisms reduce rho's iteration count by about sqrt(|Aut|), a
        constant. For j=0 the factor is sqrt(6). The exponent stays 1/2.
      verified_by: knowledge/techniques/KN-TECH-018.md
    - ref: RQ-CANL-63098f
      provenance: internal
      claim: >-
        The decision target, read in the question file, says xedni fails
        because lifted points have canonical height of order N, and a
        proposal must state how CM changes that quantity. Evidence under the
        question is capped at toy claim tier.
      verified_by: ledger/questions/RQ-CANL-63098f.yaml
  assumptions:
    - >-
      (2,3) lies on y^2=x^3+1, (0,1) lies on y^2=x^3+x+1, and (1,1) lies on
      y^2=x^3-x+1, by direct substitution. None of these is asserted to
      generate the Mordell-Weil group or to have positive rank beyond what
      the height estimator measures.
    - >-
      Q_4 is an operational ratio of two exact integer functions of 2^4 P.
      It is not asserted to equal a Néron local height unless the stability
      check |Q_4-Q_3|<=0.05 holds on that point.
    - >-
      The automorphism factor sqrt(6) on a j=0 curve is a rho constant from
      KN-TECH-018. It is a different quantity from Q_n and is not evidence
      about height growth.
  proof_search_map:
    not_applicable_reason: >-
      This is a toy comparison of one height-growth ratio on three explicit
      points, not a proof that a lift solves or fails ECDLP beyond the
      negative result already recorded in KR-IC-cd159a.
    bottleneck: >-
      The step that would have to move for CM to matter, inside this record,
      is the p-adic valuation of the denominator of x(16P) relative to the
      naive height of that same point. Rank, class-polynomial degree, and the
      rho automorphism factor are different quantities and are not this
      bottleneck.
    baseline_embedding:
      parameter_slice: >-
        p=19, n=4, three named models and three named integral points.
      reproduction_check: >-
        Each starting point satisfies the named cubic, and each doubling is
        the chord-and-tangent law on that model, checked by the curve equation
        at 2P, 4P, 8P, and 16P.
    observation_collision:
      observable: Q_4
      distinct_preimage_search: >-
        C_n1 and C_n2 are two non-CM models at the same p. If their Q_4
        values differ by more than 0.10, the same observable arises from
        curve identity rather than from the CM label, and the claim fails.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: Q_4 on the doubling orbit of each named point
        predicted_gain: >-
          A gap of at least 0.25 between the j=0 model and C_n1, with the
          two nulls inside 0.10, or an explicit failure of that gap.
    quantifier_order: >-
      exists three named points on three named models such that, after the
      ordinary and non-CM checks, |Q_4(P_cm)-Q_4(P_n1)|>=0.25 and
      |Q_4(P_n1)-Q_4(P_n2)|<=0.10. Not forall CM curves, and not forall
      primes.
    method_ceiling:
      strongest_certifiable_claim: >-
        At p=19 and n=4, either this denominator share differs between the
        j=0 model and C_n1 by at least 0.25 while the two nulls differ by at
        most 0.10, or it does not. No ECDLP solve is certifiable from Q_4.
      nearby_object_control: >-
        At p=17 the curve y^2=x^3+1 has trace 0 (supersingular; 17≡2 mod 3).
        The procedure must refuse to label that reduction as an ordinary
        Serre-Tate canonical lift and must not emit a Q_4 for it as if the
        claim applied. Emitting a finite comparison there falsifies the
        identification of the object.
    proof_obligations:
      - claim: >-
          Q_4 is computed from the denominator valuation and the naive height
          of the same point 16P.
        responsibility: correctness
  predictions:
    - metric: >-
        absolute gap |Q_4(P_cm)-Q_4(P_n1)|, gated by |Q_4(P_n1)-Q_4(P_n2)|<=0.10
      direction: different
      minimum_effect: >-
        CM-null gap at least 0.25 and null-null gap at most 0.10
  minimal_test:
    design: >-
      On each of the three models, double the named point four times with
      exact rational arithmetic. At n=3 and n=4 record v_19 of the
      denominator of x, the naive logarithmic height, hhat_n, lambda_{19,n},
      and Q_n. Before comparing, compute #C_cm(F_19) and require it unequal
      to 20. For C_n1 and C_n2, compute the square-free kernel of t_q^2-4q
      at q=5,7,19; if the three kernels are identical and nonzero, that model
      fails the non-CM check and the claim is not scored. Also run the same
      Q_4 procedure's guard on y^2=x^3+1 at p=17 and require refusal.
    controls:
      - >-
        Null-null control: |Q_4(P_n1)-Q_4(P_n2)| must be <=0.10. A larger
        gap means the CM-null gap is not distinguishable from ordinary
        curve-to-curve variation, and the claim fails.
      - >-
        Stability control: |Q_4-Q_3|<=0.05 on each scored point. A larger
        drift means the ratio is not stable under Sigma and the claim fails.
      - >-
        Supersingular refusal: the p=17 j=0 reduction must not be scored as
        an ordinary canonical lift.
      - >-
        Rho-constant control, not a collision search: record sqrt(6) from
        KN-TECH-018 as the j=0 automorphism factor on rho's iteration count.
        That factor is dimensionless and is not Q_4. A writeup that treats
        sqrt(6) as a change in the height share is invalid. F1 is not run.
    required_metrics:
      - "#C_cm(F_19) and whether it equals 20"
      - square-free kernels of t_q^2-4q at q=5,7,19 for C_n1 and C_n2
      - hhat_3, hhat_4, lambda_{19,3}, lambda_{19,4}, Q_3, Q_4 on each scored point
      - "|Q_4(P_cm)-Q_4(P_n1)| and |Q_4(P_n1)-Q_4(P_n2)|"
      - the p=17 guard result (refuse or not)
  falsification_conditions:
    - The reduction of C_cm at 19 is supersingular, so the canonical-lift label does not apply and the claim fails for this pin.
    - Either null fails the non-CM kernel test, so there is no matched null and the claim is not established.
    - hhat_4=0 on any scored point, so Q_4 is undefined there and the comparison fails.
    - "|Q_4-Q_3|>0.05 on any scored point."
    - "|Q_4(P_cm)-Q_4(P_n1)|<0.25."
    - "|Q_4(P_n1)-Q_4(P_n2)|>0.10."
    - The procedure emits a Q_4 comparison for the supersingular j=0 reduction at p=17.
  confounders:
    - >-
      An integral point can have v_19=0 through n=4 on every model, which
      forces every Q_4 to 0. That is a failed gap, not a numerical error.
    - >-
      A single unlucky factor of 19 in one denominator can open a gap that
      the second null does not share. The null-null bound is the check.
    - >-
      Coefficient size and rank are not held fixed by these three models.
      The claim is only about Q_4 on these points, not about all CM curves.
  interpretation_limits:
    - >-
      KR-IC-cd159a already says lift-to-characteristic-zero ECDLP attacks
      fail. A large or small Q_4 does not revive xedni and does not move the
      prime-field discrete-log exponent.
    - >-
      Q_4 is not the canonical height of order N in the decision target of
      RQ-CANL-63098f unless a later argument identifies them. This record
      measures only the p-denominator share at n=4.
    - >-
      Toy claim tier only. p=19 and n=4 do not transfer to cryptographic
      primes.
    - >-
      The sqrt(6) rho discount on j=0 is a constant on a different algorithm.
      It is not a height result.
  heuristic_assumptions:
    - id: H1
      statement: >-
        No random model is used. Q_4 is a ratio of two exact functions of the
        integers a,b in x(16P)=a/b. No distribution of heights is assumed.
      rigorous_support: >-
        The duplication map on a Weierstrass model is a rational map given by
        the chord-and-tangent formulas, and v_p and the naive height of a
        reduced fraction are exact. KN-LIT-021 records an asymptotic failure
        of xedni; it is not used as a distribution for Q_4.
      validation_plan: >-
        Recompute 16P on each of the three named models from the same three
        starting points, twice, with independent rational arithmetic. Sample
        is these three orbits only, at p=19 and n=3,4. Comparison
        distribution: equality of the two reduced fractions x(16P), not a
        probabilistic law. Tail check: the curve equation holds at 16P, and
        gcd(a,b)=1, so no cancelled p-factor remains in a tail.
  target_complexity:
    time_exponent: 1/2
    memory_exponent: 1/2
    best_known: >-
      Pollard rho at exponent 1/2. On the j=0 model the iteration count is
      discounted by sqrt(6), a constant, as in KR-RHO-0528e7 and KN-TECH-018.
      KR-IC-cd159a says xedni and characteristic-zero lifts do not beat that
      baseline.
    hidden_overhead: >-
      None is claimed. Coordinate bits of 2^n P grow like 4^n times the
      naive height; at n=4 that is a measurement cost, not an o(1) term in
      an attack.
    tradeoff_note: >-
      No time-memory tradeoff is proposed. Rho's collision tradeoff and the
      van Oorschot-Wiener curve are unchanged.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: >-
    KR-IC-cd159a dominates any claim that a characteristic-zero lift, CM or
    not, solves the prime-field ECDLP; this record makes no such claim, and
    the discrete-log exponent delta is 0. Opened baselines that do not
    dominate the comparison of Q_4: KN-LIT-020 and KN-LIT-021 (xedni and its
    failure, without this ratio), IDEA-20260807-44ba75 (liftable fraction),
    IDEA-20260807-6533fd (height budget Theta(N^{2/r})), IDEA-20260811-dcbea4
    (class-polynomial bit size), and IDEA-20260905-4e26ed (successive
    minima). None of those evaluates v_p(denominator of x(16P))/hhat_4 on
    this matched triple.
  sota_delta: >-
    Prime-field ECDLP time-exponent delta is 0 relative to rho at exponent
    1/2, including the sqrt(6) constant on j=0. The quantity that is claimed
    to change is Q_4, the 19-denominator share of the duplication height
    estimator, between y^2=x^3+1 and y^2=x^3+x+1 at n=4.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-IC-cd159a
      - KR-RHO-0528e7
      - KR-RHO-13bf67
      - KR-RHO-755e35
      - KR-IC-5931ee
    nearest:
      - ref: KR-IC-cd159a
        provenance: internal
        relation: adjacent
        delta: >-
          The row says xedni and characteristic-zero lifts fail with
          negligible probability. This idea does not contradict that row and
          does not claim a lift attack. It adds one operational ratio Q_4 at
          p=19 on three named points. Exponent delta 0.
      - ref: KR-RHO-0528e7
        provenance: internal
        relation: orthogonal
        delta: >-
          The row's sqrt(m) automorphism discount, sqrt(6) on j=0, changes
          rho's constant and not the exponent. Q_4 is not that constant.
          Exponent delta 0.
    searched:
      corpus_grep:
        - ledger/proposals question_id RQ-CANL-63098f
        - knowledge KR-IC-cd159a KN-LIT-020 KN-LIT-021
      web: []
      blocked:
        - Silverman 2000 and Jacobson-Koblitz-Silverman-Stein-Teske 2000 were not opened beyond the knowledge notes.
  status: proposed
  added: '2026-10-05'
  approved_by: null
