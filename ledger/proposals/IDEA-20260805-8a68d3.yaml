idea:
  id: IDEA-20260805-8a68d3
  question_id: RQ-SIG-001
  added: '2026-08-05'
  title: >-
    Plant a syzygy family of known size: GOAL-SIG-001 has ten evidence records,
    eight experiments and 1694-run-era infrastructure behind an instrument that
    has never once been shown able to detect the quantity it reports

  class: control

  claim: >-
    Every number this goal owns -- residual_4 = 2n/3 + 1 at six sizes,
    residual_5 = 344/878/1158/974, residual_6 = 2615/2722, the D3 non-Koszul
    singleton, the 8n/3 D4 deficit law -- is an output of one pipeline:
    build the boolean Macaulay matrix, compute its kernel dimension, enumerate a
    model syzygy family K_D, subtract, then subtract an inherited closure
    A_{D-1}. The pipeline's NEGATIVE behaviour has been validated repeatedly
    (nulls returning extra = 0 at D <= 5, determinism reruns matching exactly,
    anchor reproductions passing). Its POSITIVE behaviour has never been
    validated at all: no record in this goal exhibits an object with a
    non-rewritable syzygy family of KNOWN dimension k and shows that the pipeline
    returns k. Until that is done, "residual_5 = 878" is a reading of an
    uncalibrated instrument, and both possible errors are live -- an instrument
    that under-reports would have hidden a real cascade, and one that over-reports
    has been manufacturing the goal's entire signal. Build the planted object,
    graded in k, and read the recovery curve. The construction is elementary: take
    the frozen system, adjoin a polynomial that is a KNOWN F_2-linear combination
    of existing generators multiplied by chosen monomials, and the added syzygy
    dimension is known by construction before any run.

  object_first_candidate:
    tracked_object: >-
      A syzygy family of KNOWN dimension k, planted by construction and followed
      through the identical measurement chain the goal has used eight times:
      planted relation -> Macaulay row set -> kernel dimension -> minus rank(K_D)
      -> minus closure A_{D-1} -> reported residual_D. The tracked quantity is the
      RECOVERY FRACTION (measured excess over the unplanted baseline) / k, and the
      object is the planted family itself, not the system.
    established_families_off_limits: >-
      Off-limits as the primary lens: any new mathematical hypothesis about the
      Semaev ideal (this proposal asserts nothing about the ideal); semi-regularity
      and Hilbert-series modelling (the planted family's dimension is known by
      construction and needs no model); null construction (a null answers a
      different question and this goal already has nulls); F5 signature theory as
      an authority (it is the instrument); d_reg / solving-degree arguments.
    newness_score: >-
      Positive controls are not a new idea; their ABSENCE here is the finding.
      The ANGLE-BRIEF's method-gaps census measures 188 of 229 evidence records
      program-wide with no positive control and 26 of 195 specifications
      mentioning one. Reading the ten EV-SIG records and eight EXP-SIG
      specifications in this session: the controls that exist are C1 anchor
      reproduction, C2 lower-degree anchors, C3 D6 validation, C4 determinism, C5
      variety ground truth, C6 sanity identities, and the various null arms. Every
      one of them checks that the instrument returns the RIGHT NUMBER ON A KNOWN
      SYSTEM or the SAME number twice. None checks that it returns a DIFFERENT
      number when a different answer is planted.
    testability_score: >-
      Very high. The planting is algebraic and the answer is known before the run.
      The cheapest cell (n = 9, D = 4, k = 1) is a hand-checkable object.
    survival_score: >-
      A planted family survives by construction; the question is only whether the
      instrument sees it. That asymmetry is what makes this a control rather than
      an experiment about mathematics.

  mechanism: >-
    CONSTRUCTION. Let F = (f_1, ..., f_{2n}) be the frozen boolean chained Semaev
    system at size n, and fix a target degree D. Choose a monomial mu and indices
    i, j and set g = mu * f_i + f_j restricted to the case where g has degree <= D
    and is not already in the row span at its degree. Adjoining g to the system
    adds exactly one row-family and, by construction, exactly one new syzygy
    relation g + mu f_i + f_j = 0 of known degree. Repeating with k independent
    choices whose relations are F_2-independent as row-index vectors plants
    exactly k new kernel dimensions. Independence is verified BEFORE the run by
    rank of the k planted bitmasks, which is a k x nrows rank computation and is
    cheap; it is not left to the measurement to establish.
    WHY THE PLANTED FAMILY IS NON-REWRITABLE IN THE GOAL'S SENSE. The goal's
    rewritable family K_D is generated by pairwise Koszul relations
    f_j (mu f_i) + f_i (mu f_j) and the principal Frobenius relations
    (1 + f_i) mu f_i. A relation of the form g + mu f_i + f_j with g an ADJOINED
    generator is of neither shape, because g is not a product of two members of
    the original system. Whether the instrument nonetheless absorbs it into K_D is
    exactly what the control measures, and an instrument that absorbs it is
    reporting rewritability where there is none.
    THE GRADED READ. Run at k = 0, 1, 2, 4, 8, 16 at n = 9 and n = 12, D = 4 and
    D = 5. The forced value is
    residual_D(k) - residual_D(0) = k, exactly, with slope 1 in k.
    Three failure shapes are distinguishable and each localises a different
    defect: slope 0 (the instrument is blind -- every reported residual is a
    constant of the apparatus and no negative result from this goal may stand
    unqualified); slope strictly between 0 and 1 (partial absorption -- the
    reported residuals are systematic UNDER-counts and the cascade is LARGER than
    recorded, which would strengthen H-SIG-001); slope greater than 1 (the
    planting induces collateral syzygies -- the reported residuals are
    OVER-counts and the goal's growth laws need rescoping).
    WHY THE SLOPE IS THE RIGHT STATISTIC AND NOT THE INTERCEPT. The unplanted
    baseline residual_D(0) is the goal's own committed number and the control
    does not need it to be correct; it needs the DERIVATIVE with respect to a
    known perturbation. That is what makes this control independent of every
    modelling assumption in the lane, including semi-regularity, the freeze law
    and the null construction.
    COST BOOKKEEPING. Per-cell cost is one Macaulay build plus one rank at the
    same size the goal already runs, times 6 values of k, times 2 sizes, times 2
    degrees = 24 cells. The n = 9 and n = 12 D <= 5 cells are the ones the goal
    has repeatedly completed inside budget (D5 at n = 12: nrows 31512, ncols
    46709, a cell EV-SIG-008 completed); D6 is deliberately excluded because it is
    the cell that has broken every budget in this lane and no calibration result
    should depend on it.

  novelty_status: unverified

  literature_context:
    - >-
      INTERNAL, READ IN FULL: ledger/EV-SIG-002.yaml, EV-SIG-003.yaml,
      EV-SIG-004.yaml, EV-SIG-005.yaml, ledger/evidence/EV-SIG-006.yaml,
      EV-SIG-008.yaml, EV-SIG-009.yaml, EV-SIG-010.yaml, and the control lists in
      experiments/EXP-SIG-002/, -003/, -006/ specifications. The absence of a
      planted positive control is an observation about those files, made by
      reading them, and it is the only claim of absence this record makes.
    - >-
      INTERNAL, RELAYED from the session ANGLE-BRIEF (method-gaps sweep, not
      independently recounted here): 188 of 229 evidence records program-wide
      carry no positive control and arms_and_controls appears in 1 of 195
      specifications. Those counts are RELAYED and are not load-bearing for this
      proposal, which rests only on the SIG files read directly.
    - >-
      The methodological obligation is docs/inventor-protocol.md "controls before
      belief" and its statement that any reported signal is an artifact until the
      identical measurement has been run against a matched object. This proposal
      supplies the half of that obligation the goal has never met: the goal has
      matched NULLS in quantity and matched POSITIVES not at all.

  lossy_projection_identifiability_audit:
    projection: >-
      The full syzygy structure of the perturbed system --> the single integer
      residual_D(k), and thence to the slope d(residual_D)/dk.
    what_is_discarded: >-
      Which syzygies were planted, where, and everything about the system except
      one dimension count -- deliberately, because the control must see exactly
      what the goal's pipeline sees and nothing more. Any extra visibility would
      make the control non-representative.
    why_genuinely_lossy: >-
      Lossy in the same way and to the same degree as the measurement it audits,
      by construction. That identity of projection IS the design requirement.
    why_compatible_with_the_operations: >-
      Exactly compatible: the projection is the goal's own pipeline, unchanged.
    is_it_only_a_change_of_coordinates: >-
      Neither failure applies, and the mirror failure is the one this proposal
      is built to DETECT rather than to avoid. Not a change of coordinates: k is
      an input the pipeline cannot see and residual_D(k) is not invertible to the
      planted family. Not constant-across-instances by assumption -- but whether
      it is constant is precisely the measurement, and slope 0 is a pre-declared
      outcome. This is the rare case where the mirror failure is the hypothesis
      under test rather than a design flaw, and saying so is the honest reading:
      if residual_D turns out constant in k, then residual_D was constant in
      everything and the goal's 33.8x span of lam values (IDEA-20260805-d38a8c)
      measures instance size, not structure.

  assumptions:
    - >-
      That the pinned instrument reproduces its committed anchors before any
      planted cell is run. EV-SIG-008 records a reimplementation drift caught by
      exactly this gate (A4_5 = 242 against the recorded 444) and the gate is
      mandatory here.
    - >-
      That k planted relations are F_2-independent as row-index vectors. Verified
      by rank pre-run, not assumed.
    - >-
      That adjoining a generator does not change the degree histogram in a way
      that invalidates comparison to the unplanted baseline. It does change it,
      and the control handles this by comparing planted-vs-unplanted at the SAME
      augmented histogram (k = 0 means adjoining k generators that are exact
      duplicates of existing rows, contributing k trivial syzygies, so the
      histogram is held fixed across the sweep). Getting this wrong would make
      the whole sweep uninterpretable and it is the single most delicate part of
      the design.

  predictions:
    - metric: >-
        slope of residual_D against k over k = 0, 1, 2, 4, 8, 16 at (n = 9, D = 4)
      direction: higher
      minimum_effect: >-
        1.00 exactly, forced by construction before any run. Acceptance band
        0.90 to 1.10. Slope below 0.50 means the instrument absorbs more than
        half of a planted non-rewritable family and NO NEGATIVE RESULT FROM THIS
        GOAL MAY BE REPORTED WITHOUT THAT CORRECTION ATTACHED.
    - metric: same slope at (n = 12, D = 5)
      direction: higher
      minimum_effect: >-
        1.00, band 0.90 to 1.10. This is the cell that carries residual_5 = 878,
        the most-cited number in the lane.
    - metric: >-
        R^2 of the linear fit of residual_D against k
      direction: higher
      minimum_effect: >-
        >= 0.98. A ragged response at exact-integer planting is itself a defect:
        the relationship is deterministic, so anything but a near-exact line
        indicates the pipeline is not measuring dimensions cleanly.
    - metric: >-
        intercept residual_D(0) against the goal's committed value at the same
        cell
      direction: different
      minimum_effect: >-
        EXACT equality (residual_4(n=9) = 24 or the EV-SIG-004/EV-SIG-002
        alternative, residual_5(n=12) = 878). A mismatch is a reproduction
        failure and stops the sweep before the slope is read -- this is the
        archive check, ordered first.
    - metric: >-
        rank(K_D) with and without the planted generators
      direction: different
      minimum_effect: >-
        The planted relations must NOT enter K_D. Predicted change in rank(K_D)
        from planting: the k trivial Koszul relations the new generators
        legitimately create, a number computable in advance from the enumerator's
        own loop bounds. Any excess means the instrument is classifying planted
        non-rewritable relations as rewritable, which is the specific failure that
        would have suppressed a real cascade.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): re-read the closure and K_D code paths and derive,
      in advance, the exact change in rank(K_D) that k adjoined generators must
      produce. STAGE 1 (archive check, minutes): reproduce the committed
      unplanted residuals at (n = 9, D = 4) and (n = 12, D = 5). A mismatch stops
      everything. STAGE 2 (hand-checkable cell, minutes): n = 9, D = 4, k = 1,
      with the planted syzygy verified in the kernel by direct substitution and
      the expected residual computed by hand. THIS STAGE CAN END THE LINE: if
      k = 1 is not recovered, nothing further is worth running and the finding is
      already the deliverable. STAGE 3 (the sweep): k = 0, 1, 2, 4, 8, 16 at both
      cells, 3 seeds per cell for the choice of planting sites. STAGE 4 (only if
      slope is in band): repeat at (n = 15, D = 5) to check size-independence of
      the calibration.
    controls:
      - >-
        NULL OBJECT OF THE SAME SHAPE, FORCED VALUE PRE-DERIVED, CAN FAIL: the
        k = 0 arm implemented as k adjoined DUPLICATES of existing rows. Forced
        value: residual_D unchanged from the committed baseline, and the k
        trivial syzygies absorbed entirely into K_D. If residual_D moves on the
        duplicate arm, the pipeline is sensitive to the histogram change rather
        than to the planted structure and the whole sweep is confounded.
      - >-
        POSITIVE CONTROL: the k = 1 hand-checked cell of stage 2, where the
        planted syzygy is exhibited explicitly and verified in the kernel by
        substitution. The effect MUST appear. If it does not, the instrument is
        blind and no negative from stages 3-4 may be reported.
      - >-
        GRADED CONTROL WITH >= 3 INTERIOR POINTS AND MONOTONICITY REPORTED:
        k = 1, 2, 4, 8 are the interior points; report every consecutive
        difference, not only the fitted slope, so a saturation (slope 1 up to
        k = 4 then flat) is visible rather than averaged away. Saturation would
        be the most informative single outcome available: it would mean the
        instrument has a detection CEILING, and the goal's residuals of order
        10^3 would all sit far above it.
      - >-
        REWRITABILITY CONTROL, the nearby object where the effect must NOT
        appear: plant k genuinely rewritable relations (products of existing
        generators) instead. Forced value: residual_D UNCHANGED, because a
        rewritable family belongs in K_D by definition. A pipeline that reports
        those as residual is over-counting and the goal's numbers are inflated.
        This arm and the treatment arm together bracket the instrument.
      - >-
        ORDERING CONTROL: the duplicate-arm and rewritability-arm results are
        computed, recorded and hash-committed before any planted-arm number is
        read.
    required_metrics:
      - slope, intercept, R^2 and every consecutive difference, per cell
      - rank(K_D) planted vs unplanted, against the pre-derived expected change
      - the k=1 planted syzygy exhibited as a row-index vector with its substitution check
      - duplicate-arm and rewritability-arm residuals, reported first
      - seed variance across the 3 planting-site seeds per cell

  falsification_conditions:
    - >-
      Slope below 0.90 at either primary cell: the instrument under-reports and
      every committed residual in this goal is a lower bound of unknown
      tightness.
    - >-
      Slope above 1.10: the instrument over-reports and the growth laws need
      rescoping.
    - >-
      residual_D moving on the duplicate (k = 0) arm: the measurement is
      histogram-sensitive and the sweep is void.
    - >-
      residual_D moving on the rewritability arm: K_D fails to absorb genuinely
      rewritable families and every "non-rewritable" count is inflated.
    - >-
      Stage 1 failing to reproduce a committed residual: a reproduction failure,
      reported as such, and no calibration conclusion drawn.

  confounders:
    - >-
      PLANTING CHANGES THE OBJECT. Adjoining generators changes the ideal, the
      variety, the column set and the degree histogram. The duplicate arm exists
      to hold the histogram fixed, but the variety still shrinks. At D <= 5, well
      below the freeze degree (6/7 at n = 9/12), the variety does not drive the
      rank, which is why the sweep is confined to D <= 5. At D6 it would.
    - >-
      SITE DEPENDENCE. Where a relation is planted may matter as much as how
      many. Three seeds per cell address this weakly; a strong treatment would
      stratify by block position and is named as follow-up rather than claimed.
    - >-
      A CLEAN SLOPE OF 1 PROVES LESS THAN IT LOOKS. It would show the instrument
      detects relations of the PLANTED SHAPE at the planted sizes. A cascade
      syzygy of a different shape could still be missed. The interpretation limit
      below states this and it must survive into any evidence record.
    - >-
      CONFIRMATION PRESSURE RUNS BOTH WAYS HERE. A slope of 1 validates eight
      experiments; a slope of 0 invalidates them. Ordering the duplicate and
      rewritability arms first, and hash-committing them, is the mitigation.

  interpretation_limits:
    - >-
      Toy scale (AGENTS.md rule 7): n <= 15, D <= 5, boolean chained Semaev.
    - >-
      A passing calibration does NOT support H-SIG-001, does NOT make any D >= 6
      quantity admissible, and does NOT bear on the null-baseline blocker. It
      removes one reason to doubt the goal's numbers and nothing else.
    - >-
      A failing calibration does NOT show the cascade is absent. It shows the
      instrument's response to a planted family of a specific shape is not
      unity, and it would require every committed residual to be reported with a
      correction factor. Forward guidance if it fails: the next object is a
      planted family of CASCADE shape (a relation between relations, matching the
      A3/A4/A5 closure structure) rather than a flat adjoined relation, and the
      calibration must be redone at that shape before any residual is cited
      again.
    - >-
      No status change to H-SIG-001 and no goal transition is proposed. This is a
      control, and its output is a correction factor or a clean bill, both of
      which are inputs to a Coordinator decision rather than decisions.

  heuristic_assumptions:
    - id: HEUR-PLANT-1
      statement: >-
        None load-bearing. The planted family's dimension is known by
        construction and verified by an independent rank computation before the
        measurement; the expected response is an identity, not a distributional
        prediction. This entry records that the control is unconditional, which
        is unusual in this lane and is the reason it is worth running first.
      rigorous_support: >-
        k F_2-independent adjoined relations contribute exactly k dimensions to
        the kernel of the augmented Macaulay matrix; independence is checked by
        rank of the k bitmasks.
      validation_plan: The k = 1 hand-checked cell and the duplicate arm.
      falsification_condition: >-
        The k planted bitmasks failing the pre-run independence check, in which
        case the sweep's k axis is mislabelled and must be rebuilt.

  target_complexity:
    time_exponent: >-
      THIS PROPOSAL MOVES NO EXPONENT AND CLAIMS NONE. It is a calibration. Its
      value is that eight experiments, ten evidence records and one Tier-1 goal
      currently rest on an uncalibrated reading, and the exponent-first ambition
      of this program is not served by refining a number nobody has shown the
      instrument can produce.
    memory_exponent: >-
      Bounded by the (n = 12, D = 5) cell the goal has already completed
      (nrows 31512, ncols 46709). D6 is excluded by design.
    best_known: n/a -- no algorithmic claim.
    hidden_overhead: >-
      The 24-cell sweep multiplies a per-cell cost the goal already pays; if
      per-cell cost is dominated by the Macaulay build rather than the rank, the
      builds can be shared across k and the sweep is nearly free. That
      optimisation is named, not assumed.
    tradeoff_note: n/a.

  dominated_by: >-
    null, after this check. TIME: no algorithm; the only comparable activity is
    the goal's own null construction, which costs more (a full system build plus
    validation at every degree) and answers a different question, so it neither
    dominates nor is dominated -- they are complementary and the ANGLE-BRIEF's
    T-A/T-C split says so. MEMORY: this proposal deliberately confines itself to
    cells the goal has already completed inside budget, so it is strictly below
    the lane's memory frontier. DATA / QUERIES: it reuses the frozen instance
    family and adjoins generators; no new instance family is drawn. Rows checked
    for an existing positive control in this lane: the controls lists of
    EXP-SIG-002/003/006 specifications, all ten EV-SIG records' observations and
    controls fields, and EXP-SIG-006/analysis.md (SESSION-CHECKED 2026-08-05).
    Found: C1 anchor reproduction, C2 lower-degree anchors, C3 D6 validation, C4
    determinism, C5 variety ground truth, C6 sanity identities, and null arms
    N0/N1/N2 -- no planted positive. Absence of a search result is not evidence
    that nothing exists.
  sota_delta: >-
    Quantitative, and it is a validity delta rather than a performance one. The
    lane currently reports residuals spanning 24 to 2722 with zero seed variance
    and no demonstrated sensitivity; after this control every one of those
    numbers carries either a measured recovery slope in [0.90, 1.10] or an
    explicit correction factor. Cost to obtain: 24 cells at sizes the goal
    already runs, with the decisive cell (n = 9, D = 4, k = 1) hand-checkable in
    minutes. Against the status quo -- eight experiments and one Tier-1 decision
    resting on an uncalibrated instrument -- the delta is the difference between
    a measurement and a reading.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.75 that the recovery slope lands in [0.90, 1.10] at both primary cells. It
    is not higher because the closure step (subtracting A_{D-1}) is exactly the
    place a planted relation could be misattributed as inherited, because
    EV-SIG-008 records a real reimplementation drift in that closure path
    (A4_5 = 242 against 444) which shows the step is delicate, and because a
    planted flat relation is not the same shape as a cascade relation so a clean
    slope could still be a false reassurance. It is not lower because the
    pipeline's determinism and anchor reproductions have passed repeatedly, and
    because a pipeline that computes kernel dimension minus a rank is
    structurally the kind that responds linearly to added kernel dimensions.
    Separately: 0.95 that the control reaches a decisive reading, because stage 2
    is a single hand-checkable cell and the forced value is an identity.
