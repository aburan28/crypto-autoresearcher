idea:
  id: IDEA-20260815-05c761
  question_id: RQ-SDEG-001
  added: '2026-08-15'
  title: >-
    THE SOLVING DEGREE IS NOT THE DEGREE OF REGULARITY AND THE SEMAEV
    LITERATURE ROUTINELY CONFLATES THEM: measure the gap directly, because
    every C_decomp(p,m) extrapolation in this program's numerator inherits
    whichever quantity was actually fitted
  class: measurement

  claim: >-
    GOAL-SDEG-001 must deliver a scoped C_decomp(p,m) as the NUMERATOR of
    the ICEX exponent comparison. Every such model is fitted against a
    measured degree, and there are THREE distinct quantities in play that
    the literature uses near-interchangeably: the SOLVING DEGREE (the
    highest degree reached by the actual F4/F5 run), the DEGREE OF
    REGULARITY (the index of the first non-positive coefficient of the
    Hilbert series of the homogenised ideal), and the CASTELNUOVO-MUMFORD
    REGULARITY of the ideal. For semi-regular sequences these coincide
    asymptotically, and THE SEMAEV SYSTEMS ARE NOT SEMI-REGULAR -- that is
    precisely why the lane exists. So the coincidence cannot be assumed, and
    a cost model fitted to one while extrapolated as another is an evidence-
    integrity failure rather than a modelling choice. This record measures
    all three on the same frozen systems and reports the gap as a function
    of (p, m). THE DECISION-RELEVANT OUTCOME IS THE GAP'S TREND: if the gap
    is constant, any of the three may be used with a stated offset and the
    ICEX numerator is safe; if the gap GROWS with p or m, then every
    extrapolation in the lane is silently exponent-changing and the whole
    numerator must be refitted against the solving degree alone.

  mechanism: >-
    STAGE 1: freeze the S_3 and S_4 system generation at toy p on a declared
    curve ladder, with the certificate contract of GOAL-ECDLP-001 attached
    to every instance. STAGE 2: for each instance record, separately and by
    independent code paths, (a) the maximum degree actually reached by the
    solver, instrumented from the solver itself and not inferred from
    timing, (b) the degree of regularity from the Hilbert series of the
    homogenised ideal, and (c) the Castelnuovo-Mumford regularity via a free
    resolution where computable, with an explicit 'not computable within
    budget' record where it is not. STAGE 3: report the pairwise gaps as
    functions of p and m, with confidence intervals over the curve ladder.
    STAGE 4: re-fit any existing C_decomp model in the ledger against each
    of the three and report how much the fitted exponent moves. THAT LAST
    NUMBER IS THE DELIVERABLE -- it converts a definitional worry into a
    quantity.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Grep over ledger/ and knowledge/ for 'degree of regularity' (44),
      'semi-regular' (64), 'solving degree', 'Castelnuovo' (4),
      'regularity gap' (1), plus a read of the SDEG goal objective and its
      deferred protocol.
    results: >-
      The three quantities all appear, and the SDEG lane is explicitly
      about a scaling law, but no record MEASURES THE GAP BETWEEN THEM on
      one frozen system set, and no record reports how much a fitted
      exponent moves depending on which is used. 'Castelnuovo' appears 4
      times and 'regularity gap' once, neither in a Semaev cost-model
      context.
    verdict: >-
      UNVERIFIED. The distinction between the three degrees is textbook
      commutative algebra and nothing mathematical is claimed. What is new
      to this program is measuring the gap as a decision-relevant quantity
      for its own cost model, and quantifying the exponent movement it
      causes.

  object_first_candidate:
    tracked_object: >-
      THE DEGREE ITSELF, treated as three distinct observables rather than
      one. The lane's existing framing treats 'the degree' as a single
      measurable; this record treats the choice among the three as a free
      parameter whose effect on the downstream exponent is measurable.
    lossiness: >-
      Each degree is a drastic lossy projection of the full Groebner
      computation to a single integer. That is exactly why the choice
      among them matters: three different projections of the same
      computation, each discarding different information, and the cost
      model consumes only the integer.
    propagation: >-
      Not a propagation question; this is an instrument-calibration
      measurement inside an existing lane.
    survival_score: >-
      Survives as long as the systems are non-semi-regular, which is the
      lane's own premise. If the systems turn out semi-regular at the
      tested sizes, the three coincide, the gap is zero, and that is
      itself a clean and useful negative for the lane.

  null_object_control: >-
    NULL 1 -- RANDOM SEMI-REGULAR SYSTEMS at matched shape (same number of
    variables, same degrees), where the three quantities are PREDICTED BY
    THEORY TO COINCIDE. This is the positive control for the measurement
    code: if the pipeline reports a gap on a semi-regular system, the
    instrumentation is wrong and no Semaev number from it is admissible.
    NULL 2 -- random dense systems at matched shape, as the generic
    reference. NULL 3 -- a system with a KNOWN large gap, constructed
    deliberately, which the pipeline must detect.

  discriminated_from:
    - >-
        The existing GOAL-SDEG-001 protocol. NOT A REPLACEMENT: that
        protocol measures a scaling law; this record measures whether the
        quantity being scaled is well defined. It should run BEFORE or
        ALONGSIDE the scaling protocol, and its output changes how the
        scaling protocol's numbers are read rather than competing with
        them.
    - >-
        KN-OPEN-002 (growth of Groebner solving degree). SAME LANE,
        NARROWER QUESTION: that open problem asks how the degree grows;
        this asks which degree is growing. A growth answer for the wrong
        quantity does not settle KN-OPEN-002 and may silently misreport
        it.
    - >-
        The BKK / mixed-volume lane (KN-OPEN-004). DIFFERENT COMPLEXITY
        PREDICTOR ENTIRELY: that lane uses Newton polytopes and mixed
        volume to predict elimination cost. This one is about Hilbert-
        series-derived degrees. Named because both are 'algebraic cost
        predictors for Semaev' and an index scan would merge them.

  assumptions:
    - >-
        The solver can be instrumented to report the maximum degree
        actually reached, rather than having it inferred. IF THE SOLVER
        CANNOT BE INSTRUMENTED the record's primary observable is
        unavailable and the lane must say so rather than substitute an
        inferred value.
    - >-
        The homogenised ideal's Hilbert series is computable within budget
        at the tested sizes. Likely at S_3 toy scale, uncertain at S_4,
        and the 'not computable' cells must be recorded rather than
        dropped -- a systematically missing cell at large m would bias the
        gap trend in exactly the direction that matters.
    - >-
        The curve ladder is representative. Special-j curves must be
        excluded or reported separately, since their automorphisms change
        the system's symmetry and therefore its degrees.

  predictions:
    - metric: >-
        the three degrees on matched semi-regular control systems
      direction: different
      minimum_effect: >-
        FORCED TO COINCIDE within the theoretical prediction. A gap here
        is an instrumentation bug and blocks every Semaev number in the
        run.
    - metric: >-
        solving degree minus degree of regularity on Semaev S_3 systems,
        as a function of p
      direction: different
      minimum_effect: >-
        No direction pre-committed -- this is the unknown the record
        exists to measure. What IS pre-committed is that the trend, not
        the value at any single p, is the deliverable.
    - metric: >-
        movement of the fitted C_decomp exponent when refitted against
        each degree
      direction: different
      minimum_effect: >-
        If the exponent moves by less than its own confidence interval,
        the choice is immaterial and the lane may proceed with a stated
        offset. If it moves by more, every existing extrapolation in the
        lane is suspect and must be reported as such.
    - metric: >-
        fraction of cells where Castelnuovo-Mumford regularity is not
        computable in budget
      direction: different
      minimum_effect: >-
        Reported explicitly per (p, m). A silently dropped cell is the
        specific failure this metric exists to prevent.

  minimal_test:
    design: >-
      S_3 only, one curve ladder, p across the smallest four sizes where
      all three quantities are computable, with the semi-regular positive
      control at matched shape. That alone decides whether the gap exists
      and whether the instrumentation is trustworthy, and it is a small
      fraction of the full SDEG protocol's cost.
    controls:
      - >-
          Matched semi-regular systems where the three must coincide.
      - >-
          Random dense systems at matched shape.
      - >-
          A deliberately constructed known-gap system the pipeline must
          detect.
      - >-
          Special-j curves excluded from the main ladder and reported
          separately.
      - >-
          Every 'not computable in budget' cell recorded, never dropped.
    required_metrics:
      - >-
          All three degrees per instance, by independent code paths.
      - >-
          Pairwise gaps with confidence intervals over the curve ladder.
      - >-
          Refitted C_decomp exponent under each degree choice.
      - >-
          Per-cell computability status.
      - >-
          Artifact manifest with hashes and a from-scratch rebuild
          receipt.

  falsification_conditions:
    - >-
        The three degrees differ on a semi-regular control.
        Instrumentation bug; no Semaev number admissible.
    - >-
        The solver cannot be instrumented for the actual maximum degree.
        Primary observable unavailable; report and stop.
    - >-
        The gap is zero throughout at the tested sizes. Clean negative --
        the choice is immaterial in the tested range, which the lane may
        then rely on WITHIN that range only.
    - >-
        Computability failures cluster at large m. The gap trend is then
        unmeasurable where it matters and must not be extrapolated across
        the missing cells.

  confounders:
    - >-
        SOLVER-VERSION DEPENDENCE. The solving degree is a property of the
        ALGORITHM as much as of the ideal; a different F4 implementation
        or a different monomial order gives a different number. The order
        and the implementation must be frozen and recorded, and the record
        must never present the solving degree as an invariant of the
        ideal.
    - >-
        HOMOGENISATION CONVENTION. The degree of regularity depends on how
        the system is homogenised and whether field equations are
        included; two defensible conventions give two different numbers.
        Fix one, record it, and report the other as a sensitivity check.
    - >-
        TOY-SIZE DEGENERACY. At very small p the degrees are small
        integers and a gap of one is both large in relative terms and
        possibly an artifact of rounding in the ladder. Trends must span
        enough sizes that a unit gap is not the whole signal.

  interpretation_limits:
    - >-
        This calibrates an instrument. It produces no cost model, no
        exponent, and no evidence about index calculus versus rho.
    - >-
        Scoped to the tested curve ladder, arities and monomial order. A
        gap measured at S_3 says nothing about S_4 until measured there.
    - >-
        A zero gap is scoped to the tested range and is not a theorem that
        the quantities coincide.

  heuristic_assumptions:
    - id: HEUR-SDEG-GAP-1
      statement: >-
        For the frozen Semaev S_3 systems at the tested toy sizes, the
        solving degree and the degree of regularity differ by a quantity
        whose growth in p is bounded by a constant.
      rigorous_support: >-
        The rigorous ingredient is the standard result that for semi-
        regular sequences the degree of regularity bounds the solving
        degree, together with the classical Hilbert-series
        characterisation of the degree of regularity. The distributional
        ingredient is absent and that is the point: THE SEMAEV SYSTEMS
        ARE KNOWN NOT TO BE SEMI-REGULAR, so the standard bound is not
        known to apply and this statement is a genuine heuristic rather
        than a corollary.
      falsification_condition: >-
        A gap growing with p across the tested ladder, beyond the
        confidence interval.
      validation_plan: >-
        SAMPLE: the full curve ladder x four p values x both arities
        where computable, with >= 10 curves per cell. COMPARISON: paired
        per-instance gap, reported as a trend not a mean. TAIL CHECK:
        the 10 instances with the largest gap, reported with their curve
        invariants, to check whether the tail is a special-j or small-
        order artifact. TRANSFER ASSUMPTION, STATED AND UNJUSTIFIED:
        that a toy-range gap trend persists at larger p. Nothing
        supports this and it is recorded as an open extrapolation.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm.
      Its own cost is one Groebner computation plus one Hilbert-series
      computation per instance, which is the dominant term and is the same
      order as the SDEG lane's existing per-instance cost.
    memory_exponent: >-
      Dominated by the Groebner basis computation, which is the SDEG
      lane's existing memory profile; the added Hilbert-series work is
      negligible beside it.
    best_known: >-
      For the underlying question the incumbent is the SDEG lane's own
      deferred protocol, which this record calibrates rather than competes
      with. For the algebra, the incumbent characterisations of the three
      degrees are classical and are used, not improved.
    hidden_overhead: >-
      The hidden cost is interpretive: publishing three numbers where the
      lane expected one invites cherry-picking whichever supports a
      desired exponent. The record must pre-commit to reporting all three
      in every downstream citation.
    tradeoff_note: >-
      Instrumenting the solver costs implementation effort and buys the
      only degree that is not a proxy. Skipping it is cheaper and leaves
      the lane fitting a quantity it did not measure.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed) -- no
    attack is proposed and no ECDLP frontier row applies. As a cost model:
    this record produces none and is dominated by the SDEG lane's protocol
    on that axis. As algebra: entirely dominated by the classical literature
    on solving degree versus degree of regularity, which is cited and not
    improved. Not null on any axis.
  sota_delta: >-
    No attack, no speedup, no exponent. Content delivered: the first
    measurement in this program of the gap between three degree quantities
    its own cost model depends on; a quantified statement of how much the
    fitted C_decomp exponent moves under each choice; and a semi-regular
    positive control that makes the lane's degree instrumentation testable
    at all. Against the prior state -- a lane about to fit a scaling law to
    an unspecified 'degree' -- the delta is the specification and the
    sensitivity number.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high

  honest_prior_of_survival: >-
    0.9 that the three quantities are measurable on S_3 at toy scale. 0.5
    that Castelnuovo-Mumford regularity is computable at S_4 within any
    reasonable budget -- free resolutions are expensive and I expect that
    column to be largely empty, which is why its computability is itself a
    reported metric. 0.6 that a nonzero gap exists at the tested sizes,
    since the systems are not semi-regular and there is no reason for the
    quantities to agree. 0.3 that the gap is large enough to move the fitted
    exponent beyond its confidence interval, which is the outcome that would
    matter most to the lane.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
