    coverage_classification: >-
      A Q21.104 bootstrap interval covers the exact target only if its lower
      endpoint is at most gamma_lo/reference_denominator and its upper endpoint
      is at least gamma_hi/reference_denominator. It misses below or above only
      when separated from the whole bracket. Endpoint overlap with an
      unresolved bracket is invalid, never guessed.
    acceptance_rule: >-
      In each of 12 gamma-by-eta cells, 500<=covered<=512 and lower_misses<=7
      and upper_misses<=7. All 12 cells must pass. This is twelve pointwise
      coverage gates; no simultaneous 0.99 familywise coverage claim is made.
    early_stop_rule: >-
      Stop only when covered_so_far+remaining<500, lower_misses>7,
      upper_misses>7, a fit fails, a bracket is uncertified, or a hard resource
      cap is reached. Preserve all partial bits and records. Favorable stopping
      and draw regeneration are forbidden.

  controls:
    execution_order:
      - CTRL-BASELINE-AND-SEED
      - CTRL-MATCHED-MEAN-CLUSTERING
      - CTRL-REPEATED-COVERAGE
      - CTRL-BALANCED-ANTISYMMETRIC
      - CTRL-EXACT-QUOTIENT
      - CTRL-PLANTED-GAMMA-1-6
      - CTRL-PLANTED-GAMMA-5-18
      - CTRL-PLANTED-GAMMA-3-10
      - CTRL-ISOMORPHISM-APPARATUS
      - signed_y_treatment
    treatment_admission_rule: >-
      Every preceding control, exact compiler equality, throughput gate, and
      resource reserve must pass. A missing, capped, nonconverged, or failed
      control prohibits treatment and is not ECDLP evidence.
    balanced_antisymmetric: >-
      On odd prime Z/NZ, H=(N-1)/2. Derive a unit a and c mod H, put
      pi(t)=a*t+c mod H, and for nonzero r use r=epsilon*u with
      u=min(r,N-r), h_null(r)=epsilon*(pi(u-1) mod M) mod M; h_null(0)=0.
      This is exactly antisymmetric and balanced within one count.
    exact_quotient: >-
      For b in {18,21,24,27,30}, U=2^(b/3), M=U-1, K=M^3, G=Z/KZ, L=M,
      and h_q(x)=x mod M. Run the same selector, exact equality, scalar
      reconstruction, and Boolean verification with one zero-padded bucket.
    planted_gamma: >-
      Three independent arms use gamma_star in {1/6,5/18,3/10}. Select
      quotient mode with exact generator probability K^(-1/3+gamma_star) and
      balanced mode otherwise, before any map call. Evaluate one selected map;
      no labels, lists, buckets, pairs, roots, or outputs are reused.
    matched_mean_clustering:
      sizes: [262144, 2097152, 16777216, 134217728, 1073741824]
      clusters_per_size: 32
      roots_per_cluster: 8192
      roots_per_size: 262144
      construction: >-
        Key-rank the 32 clusters; 16 have A_c=1024 and 16 have A_c=3072.
        Diffuse: first A_c ranked roots have (D,Y,X,V,S)=(1048576,1,1,1,1).
        Concentrated: with kappa=2^(b/3), first A_c/kappa roots have
        (1048576,kappa,kappa,kappa,1). Other roots have D=1048576 and zeros.
      exact_counts:
        common_sum_X_each_size: 65536
        common_sum_Y_each_size: 65536
        common_E_X: '1/4'
        common_E_Y: '1/4'
        diffuse_kappa: [1, 1, 1, 1, 1]
        diffuse_successes: [65536, 65536, 65536, 65536, 65536]
        concentrated_kappa: [64, 128, 256, 512, 1024]
        concentrated_successes: [1024, 512, 256, 128, 64]
        concentrated_sum_X_squared: [4194304, 8388608, 16777216, 33554432, 67108864]
      exact_bridge: >-
        Every cluster satisfies sum X^2=kappa*sum X and sum S=sum X/kappa.
        Every legal resample preserves delta_kappa=+1/3 and
        delta_ratio=-1/3 at eta=0. Both arms have equal E[X]=E[Y]=1/4;
        diffuse gamma_s=1/3 and concentrated gamma_s=0.
      gates: >-
        Zero integer mismatch; diffuse eta=0 slopes within 1e-8 of zero;
        concentrated LCB(delta_kappa)>0.3133333333333333 and
        UCB(delta_ratio)<-0.3133333333333333 under all eta; eta=0 gamma gap
        within 1e-8 of 1/3 and interval excludes zero.
    repeated_coverage: 'Exactly the eta_complete_coverage_contract above.'

  unequal_isomorphism_fixture:
    id: CTRL-ISOMORPHISM-APPARATUS
    timing: hard_pre_treatment_gate
    admitted_curves: 160
    noncanonical_models_per_curve: 3
    equal_fixtures_per_curve: 8
    unequal_fixtures_per_curve: 8
    equal_fixture_count: 1280
    unequal_fixture_count: 1280
    model_generator: >-
      Rejection-sample nonzero u. Require (u^4,u^6) pairwise distinct and
      different from (1,1), with accepted curves having nondegenerate A and B.
      Define E_u:y^2=x^3+(A*u^4)x+B*u^6 and
      phi_u(x,y)=(u^2*x,u^3*y), phi_u(O)=O.
    equal_generator: >-
      Rejection-sample distinct nonzero r1..r4 and nonzero a, derive known k,
      and set b_eq=r1+r2+r3+r4-a*k mod N. Compute R_j=[r_j]P,
      A0=R1+R2, B0=R3+R4, T0=A0+B0, and Q_eq=[a]Q+[b_eq]P.
    unequal_generator: >-
      From the disjoint unequal key rejection-sample delta uniformly from
      {1,...,N-1}. Set D_delta=[delta]P, b_neq=b_eq+delta mod N, and
      Q_neq=Q_eq+D_delta. Set
      k_hat_neq=a^(-1)*(sum_j r_j-b_neq) mod N.
    noncollision_proof: >-
      T0=[sum r_j]P and Q_neq=[sum r_j+delta]P. Equality would imply
      [delta]P=O, hence delta=0 mod N because P has prime order N, contradicting
      delta in {1,...,N-1}. Each phi_u is bijective, so equality after
      transformation is equivalent to equality before it. Thus all accepted
      unequal fixtures are noncolliding without probabilistic appeal.
    mandatory_checks:
      - Every canonical and transformed point is on its declared curve.
      - Every forward point round-trips to identical canonical bytes.
      - The three positive homomorphism sums and final equality hold.
      - 'T0!=Q_neq and phi_u(T0)!=phi_u(Q_neq) for all models.'
      - 'phi_u(Q_eq)+phi_u(D_delta)=phi_u(Q_neq).'
      - 'k_hat_eq=k and [k_hat_eq]P=Q in all four models.'
      - 'k_hat_neq!=k and [k_hat_neq]P!=Q in all four models.'
    fixture_record_schema: >-
      One fixed 160-byte little-endian record per curve/fixture pair: 16-byte
      identifiers; ten u32 scalars r1..r4,a,b_eq,delta,b_neq,k_hat_eq,
      k_hat_neq; 32-byte equal canonical transcript SHA-256; 32-byte unequal
      canonical transcript SHA-256; 32-byte aggregate transformed transcript
      SHA-256; u32 check mask; u32 model mask. Curve certificates retain p,N,
      coefficients, P,Q,k and all u constants. The record plus certificate and
      seed domain reconstructs every point and outcome exactly.
    archive_records: 1280
    archive_record_width_bytes: 160
    archive_bytes: 204800
    pass_rule: >-
      Every one of the 1280 equal and 1280 unequal fixtures passes on the
      canonical model and all three noncanonical models before treatment.

