  eta_complete_coverage_contract:
    status: prospective_not_executed
    gamma_values:
      - {numerator: 0, denominator: 1}
      - {numerator: 5, denominator: 18}
      - {numerator: 3, denominator: 10}
      - {numerator: 1, denominator: 3}
    eta_values: [-4, 0, 4]
    datasets_per_gamma: 512
    unique_datasets: 2048
    gamma_eta_cells: 12
    point_fits: 6144
    bootstrap_draws_per_point_fit: 8191
    bootstrap_refits: 50325504
    total_fit_attempts: 50331648
    refit_identity: '2048*3*8191=50325504; 50325504+2048*3=50331648.'
    generator: >-
      For b in {18,21,24,27,30}, gamma=g_num/g_den, and cluster sign
      z in {-1,+1}, compare a keyed uniform uint128 U with the frozen T below.
      Put S=X=Y=V=1[U<T], D=1048576. Exactly 16 clusters use each z, selected
