idea:
  id: IDEA-20260811-4a55dd
  question_id: RQ-MSI-f760b2
  added: '2026-08-11'
  title: >-
    LINEARITY FORCES A LATTICE, AND "SHORT" IS EXACTLY WHAT MAKES THE LATTICE
    EASY: if the truncated l-adic period map is a homomorphism of Z-modules --
    which pairing homology against forms is, by construction, unless the paper
    inserts a non-linear normalisation -- then MSI at parameters (N, l, m, S) IS
    Bounded Distance Decoding in the coset x_0 + ker(A) of an explicitly
    computable rank-n lattice of determinant l^{m r}, its security parameter is
    n = rank H_1(X_0(N), cusps; Z) ~ N/6 and NOT p, and any parameter set in
    which the intended hardness comes from p (N polylogarithmic in p) is broken
    in polynomial time by LLL plus Babai. The single cheapest discriminator in
    this whole portfolio is an ADDITIVITY TEST on three encoder calls.
  class: mechanism

  claim: >-
    (A) THE STRUCTURAL CLAIM, STATED CONDITIONALLY AND WITH ITS ESCAPE NAMED.
    Let M = H_1(X_0(N), C, Z) be the relative homology (modular symbols) module
    of the abstract, C the cusps, and let

        Per_m : M ---> (Z/l^m Z)^d

    be the paper's truncated l-adic period map, d the number of weight-2 cusp
    forms paired against. CLAIM L1 (LINEARITY): Per_m is a homomorphism of
    Z-modules. The reason is that every ingredient named in the abstract is
    bilinear or additive -- a period is a pairing of a homology class with a
    differential; Coleman integration is additive in the path and linear in the
    form; truncation mod l^m is a ring quotient. THE ESCAPE IS NAMED AND IS THE
    WHOLE POINT OF THE TEST: linearity fails if and only if the paper's map
    inserts a step that is not additive in the class -- a multiplicative integral
    whose value is NOT subsequently passed through a logarithm, a base point or
    branch of log chosen as a function of the class, a canonical-representative
    normalisation applied per class, or a reduction step that is not a module
    map. Exactly one of these is true and A CHECK ON THREE ENCODER CALLS DECIDES
    WHICH.

    (B) WHAT L1 IMPLIES, IMMEDIATELY AND WITH NO FURTHER MATHEMATICS. Fix an
    integral basis of M (rank n) or, alternatively, the Manin generating set of
    size |P^1(Z/NZ)|. Per_m is then a d-by-n matrix A over Z/l^m Z that is
    computable from PUBLIC data alone -- N, l, m and the choice of form basis --
    with no knowledge of the oriented curve. The preimage set of a published
    vector v is exactly the coset

        x_0 + L,   L = {x in Z^n : A x = 0 mod l^m},   det(L) = l^{m r},

    r the rank of A mod l. "Recover a SHORT representative" is therefore
    verbatim Bounded Distance Decoding at radius S in the coset x_0 + L. MSI is
    then a lattice problem in disguise -- decision-target state (A) -- and it
    inherits BDD's cost exactly, with no isogeny-theoretic hardness used
    anywhere.

    (C) THE THREE REGIMES, WITH THEIR BOUNDARIES WRITTEN OUT. Write
    G = sqrt(n/(2 pi e)) and D = l^{m r / n}, so the Gaussian heuristic predicts
    lambda_1(L) ~ G D.
      REGIME 1 -- ILL-POSED. If S >= c sqrt(n) D for an absolute constant c,
      Minkowski's theorem plus a ball-volume count gives 2^{Omega(n)} distinct
      short preimages of v. Every one of them is "a short homology
      representative", so MSI is trivially solvable AND its answer is not
      determined by its input. The encoding is not a one-way function; it is not
      a function of its own output.
      REGIME 2 -- POLYNOMIAL-TIME BROKEN. If S <= 2^{-n/2} G D, Babai nearest
      plane on an LLL-reduced basis of L returns x_0 exactly, in time
      poly(n, m log l). More generally BKZ with block size beta succeeds when
      S <= delta_beta^{-n} G D, delta_beta ~ (beta/(2 pi e))^{1/(2(beta-1))}, at
      cost 2^{Theta(beta)}.
      REGIME 3 -- THE SURVIVING WINDOW, AND WHAT IT IS WORTH. Between them lies
      the ordinary lattice-cryptography window. IT IS EXPONENTIALLY WIDE IN THE
      RATIO S/D AND THIS RECORD DOES NOT PRETEND OTHERWISE -- there is no cheap
      "no window exists" verdict available here, and claiming one would be the
      overclaiming half of the failure pair. But the window's existence is not
      a defence of MSI, it is a RELABELLING of it: inside the window MSI's cost
      is BKZ's cost at dimension n and gap D/S, a quantity with no p in it.

    (D) THE EXPONENT STATEMENT, WHICH IS THE ACTUAL DELIVERABLE. For N prime,
    X_0(N) has 2 cusps and genus g, so n = 2g + 1 and d = g, giving the clean
    relation n = 2d + 1 and D = l^{m r/n} ~ l^{m/2} at full rank. Therefore
    under L1 the MSI security parameter is n ~ N/6, and:
      (D1) IF N IS POLYLOGARITHMIC IN p -- the natural choice if one believes
      the hardness comes from the supersingular side, since the encoding only
      needs to separate the ~p/12 supersingular points and d m log_2 l bits
      suffice for that with N polylog -- THEN n is polylogarithmic in p, LLL
      runs in time poly(log p), and MSI IS BROKEN IN POLYNOMIAL TIME. This is a
      cheap pre-compute falsification of MSI hardness for a NAMED parameter
      range, and it is the headline.
      (D2) HARDNESS THEREFORE REQUIRES N = Omega(lambda) for security level
      lambda, INDEPENDENT OF p. At lambda = 128 the crude lattice-security rule
      of thumb n >~ 400 forces N >~ 2400. That is a parameter constraint the
      published abstract does not state and which any MSI-based construction
      must carry.
      (D3) CONSEQUENTLY, UNDER L1, THE ORIENTED SUPERSINGULAR INPUT CONTRIBUTES
      NO HARDNESS. It contributes an instance distribution. That is decision
      target (A), stated at the level of an exponent rather than as an opinion.

    (E) THE TENSION THAT MAKES THIS SHARP, IN ONE SENTENCE. Shortness and
    hardness pull in opposite directions: the shorter the representative the
    smaller S, the larger the BDD gap G D / S, and the easier the lattice
    instance -- so the very adjective "short" in the problem statement is the
    adjective that puts the instance in Regime 2. If the representative is made
    long enough to escape Regime 2 it is no longer short and the encoding no
    longer encodes what the paper says it encodes.

    (F) THE FOUR OUTCOMES, EACH DECISION-RELEVANT.
      O1: additivity holds and toy instances land in Regime 2 -- verdict (A),
      MSI easy at the tested parameters, with the p-independence of the security
      parameter as the transferable statement.
      O2: additivity holds and toy instances land in Regime 1 -- verdict (A) in
      its ill-posed form: MSI is not a well-defined inversion problem at those
      (N, l, m, S) and no construction can use it as stated.
      O3: additivity holds and toy instances land in Regime 3 -- verdict (A) in
      its strongest defensible form: MSI is exactly BDD, its cost curve is
      BKZ's, and the program should analyse it with lattice tools and not
      isogeny tools. Idea IDEA-20260811-0f89a9 then becomes the live attack.
      O4: ADDITIVITY FAILS. Then L1 is false for the paper's actual map, (A) is
      refuted, and the identity of the non-additive step is the paper's real
      cryptographic contribution and the most valuable thing this session could
      find. This record treats O4 as a success of the test, not a failure of the
      idea.

  mechanism: >-
    STAGE 0 (ZERO COMPUTE, HARD GATE, AND THIS SESSION COULD NOT PERFORM IT).
    Read the body of arXiv:2603.29789 and extract, verbatim and with page
    references, five things: (i) the definition of the attaching map from an
    O-oriented curve to a class in H(X_0(N), C, Z); (ii) the definition of
    "short homology representative" and the norm or combinatorial length it
    refers to, including whether shortness is measured in an integral BASIS of M
    or in the overdetermined MANIN GENERATING SET (these give different lattices
    of different ranks and different attacks, and the distinction is
    load-bearing); (iii) the exact definition of the l-adic period and whether it
    is an additive Coleman integral, a multiplicative integral, or a
    multiplicative integral composed with a logarithm; (iv) the definition of d;
    (v) any normalisation applied per class. THE SESSION THAT WROTE THIS RECORD
    HAD NO WORKING WEB TOOL -- WebFetch and WebSearch both failed with a backend
    model error -- AND NO LOCAL PDF EXISTS IN THIS WORKTREE (the two paths named
    in KN-LIT-1662 under downloads/ do not exist here). EVERY STATEMENT ABOVE
    ABOUT THE PAPER'S CONSTRUCTION IS AN INFERENCE FROM THE PUBLISHED ABSTRACT
    ALONE AND IS MARKED UNVERIFIED.

    STAGE 1 (THE ADDITIVITY TEST -- MINUTES, AND THE CHEAPEST VALID
    DISCRIMINATOR IN THE PORTFOLIO). Using the encoder built by
    IDEA-20260811-626f00, sample pairs (x, y) of homology classes at small N and
    check whether

        Per_m(x + y) = Per_m(x) + Per_m(y)   in (Z/l^m Z)^d

    holds exactly, over at least 10^3 pairs per (N, l, m) cell, including pairs
    whose sum is short and pairs whose sum is not. Also check
    Per_m(k x) = k Per_m(x) for k = 2..10. THREE ENCODER CALLS DECIDE THE ENTIRE
    STRUCTURAL QUESTION, and no lattice machinery is needed to run them.

    STAGE 2 (BUILD A, MEASURE ITS RANK AND THE GAP). Compute A by encoding each
    basis element (or each Manin symbol). Record rank(A mod l), rank(A mod l^m),
    the elementary divisors, det(L) = l^{m r}, the Gaussian prediction G D, and
    the measured lambda_1(L) by exact SVP at n <= 40 and by BKZ estimate above
    it. Record the empirical shortness S of genuine instances produced by the
    attaching map. The single reported number per cell is the GAP
    gamma = G D / S.

    STAGE 3 (RUN THE ATTACK AND PLOT SUCCESS AGAINST PREDICTED GAP). LLL plus
    Babai nearest plane, then BKZ-beta for beta in {2, 10, 20, 30, 40}. Report
    success rate per cell against gamma. THE PREDICTION UNDER L1 IS NOT MERELY
    "IT WORKS" BUT A SPECIFIC CURVE: success should switch on where
    log gamma crosses n log delta_beta, and the location of that switch should
    agree with the RANDOM-LATTICE NULL of identical determinant and rank to
    within the measured Hecke-module deviation. A success curve that does NOT
    track gamma is evidence that something other than the lattice geometry is
    controlling the outcome, and that is a finding.

    STAGE 4 (THE p-INDEPENDENCE CHECK, WHICH IS WHAT MAKES THIS AN EXPONENT
    STATEMENT). Hold (N, l, m) fixed and vary p across at least four values
    spanning a factor of 2^20 in size, generating instances by the attaching
    map. Under L1 the attack cost must be FLAT in p and the success rate
    unchanged. If cost or success moves with p at fixed (N, l, m), then p enters
    the instance distribution in a way the linear model does not capture, and
    verdict (A) is weakened in a specific, diagnosable way.

    STAGE 5 (ZERO COMPUTE): write the regime boundaries of claim (C) as a table
    in (N, l, m, S) and state, for the parameter ranges the paper's own examples
    use if Stage 0 finds any, which regime they occupy.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Greps across knowledge/ and ledger/ for "modular symbol", "Bruhat",
      "Coleman", "period vector", "MSI"; reads of KN-OPEN-013, KN-OPEN-015,
      KN-TECH-3b593f, KN-TECH-027, KN-LIT-1662, KN-LIT-865, KN-LIT-1214,
      H-MOD-e9d87e, DEC-20260810-2c7e3c, RQ-CLGP-b99df5, RQ-SSIQ-9702af,
      IDEA-20260807-dbb250, docs/target-result-profile.md,
      docs/inventor-protocol.md.
    results: >-
      No ledger record and no technique, finding or open-problem record
      mentions modular symbols, MSI, or the linearity-to-lattice argument.
      KN-LIT-1662 is the only corpus entry on the source paper and is
      confidence "reported" with a transcription error in its summary line.
      Three corpus literature entries are adjacent and were read
      (KN-LIT-865 Amoros-Iezzi-Lauter on supersingular graphs and Bruhat-Tits
      trees; KN-LIT-1214 on Bruhat-Tits path-finding for endomorphism rings;
      KN-LIT-192 on the Morava stabiliser action on the Bruhat-Tits building),
      none of which concerns modular symbols or period inversion. The
      "target module" argument of IDEA-20260807-dbb250 is the closest
      methodological relative in this repository -- it also decides a family of
      p-adic constructions by a type-signature argument rather than by
      computation -- and is cited as prior methodology, not prior result.
    verdict: >-
      UNVERIFIED, and deliberately not stronger. The corpus was checked and is
      empty on this material, but the EXTERNAL literature was NOT checked in
      this session because both web tools failed. "Truncated linear map plus
      shortness equals BDD" is the standard reduction of lattice cryptography
      and is certainly not new mathematics; what is unchecked is whether anyone,
      including the paper itself, has already published this observation about
      MSI specifically. Any reviewer must run that external check before this
      record is cited as an original observation.

  object_first_candidate:
    tracked_object: >-
      The coset x_0 + ker(A) inside Z^n, together with its Euclidean geometry --
      that is, the residue of the homology class modulo the kernel of the
      truncated period map, plus the norm used to define shortness. What is
      followed through the computation is the residue, not the class.
    lossiness: >-
      LOSSY EXACTLY WHEN THE ENCODING IS NON-INJECTIVE ON SHORT CLASSES, AND
      THAT IS A MEASURED QUANTITY, NOT AN ASSERTION. The projection
      x |-> A x mod l^m discards ker(A) and keeps a d m log_2 l-bit residue. The
      discard is compatible with the target's operation -- addition of homology
      classes -- precisely because A is linear, which is claim L1; that
      compatibility is what makes the retained part propagate deterministically,
      and it is the same fact that turns the problem into BDD. THE LOSSY-
      PROJECTION TEST THEREFORE HAS A SHARP ANSWER HERE: if S is small enough
      that A is injective on the short set, the projection loses nothing on the
      relevant domain and is a change of coordinates, not a new object -- and
      "a change of coordinates" is exactly decision-target verdict (A). If A is
      not injective on the short set, the projection is lossy and the problem is
      ill-posed instead. The test does not merely screen this object; its answer
      IS the decision.
    propagation: >-
      One step = adding a homology class, or applying a Hecke operator T_q. The
      residue propagates by A(x + y) = Ax + Ay and by A(T_q x) = (A T_q) x, both
      exact and both computable without the secret. Deterministic one-step
      propagation is therefore available and cheap, which is the second
      inventor-protocol axis.
    survival_score: >-
      SURVIVES the whole computation under L1, because linearity is preserved by
      every operation the module supports. DIES at exactly one place -- a
      non-additive step in the encoder -- which is outcome O4 and is what
      Stage 1 hunts.

  null_object_control: >-
    MANDATORY AND BLOCKING, THREE NULLS.
    NULL 1 (RANDOM LATTICE OF MATCHED SHAPE): replace A by a uniformly random
    d-by-n matrix over Z/l^m Z, generate a target by adding a random error of
    the same norm S, and run the identical attack. If the success-versus-gap
    curve is indistinguishable from the real one, the arithmetic of X_0(N)
    contributed nothing beyond the dimensions, and every claim in this record is
    a claim about q-ary lattices, not about modular symbols. THAT IS AN
    ACCEPTABLE AND INFORMATIVE OUTCOME AND MUST BE REPORTED AS SUCH.
    NULL 2 (RANDOM TARGET): replace v by a uniformly random vector of
    (Z/l^m Z)^d. The attack must FAIL to return a short preimage at the rate
    predicted by the ball-volume count. A pipeline that "succeeds" on random
    targets is finding short vectors of L rather than decoding, and every
    positive result from it is void.
    NULL 3 (SHUFFLED PAIRING): permute which encoded vector belongs to which
    instance. Recovery must collapse to the Null 2 rate.
    DECAY CONTROL: the parameter that is supposed to destroy the signal is the
    gap gamma. Success rate MUST decay as gamma decreases. A success rate flat in
    gamma is the artifact signature named in docs/inventor-protocol.md section 3
    and means the harness is leaking the answer.

  discriminated_from:
    - >-
      H-MOD-e9d87e (the zero-bit closure). WHY THIS RECORD IS NOT CAUGHT BY IT,
      IN THREE INDEPENDENT WAYS. (i) DIFFERENT OBJECT: H-MOD-e9d87e concerns
      functions on a single FIBRE of X_1(N) -> X_0(N) over one point; this
      record concerns the relative homology H_1(X_0(N), cusps; Z) of the whole
      curve, which is not a fibre, not a set of points, and not acted on by the
      diamond operators in the way F2 requires. (ii) DIFFERENT GROUP ACTION: the
      closure's engine is that the diamond action of (Z/N)^*/{+-1} is FREE AND
      TRANSITIVE on the fibre, so invariants are constant; the action here is
      the HECKE action on a module of rank 2g + c - 1, which is neither free nor
      transitive on anything and whose invariants are eigenspaces, not
      constants. (iii) DIFFERENT INSTANCE: H-MOD-e9d87e's instance is a rational
      ECDLP triple (E, P, Q = kP) over F_p with N = ord(P) prime; this record's
      instance is an O-oriented supersingular curve over F_{p^2} and there is no
      k, no P and no fibre coordinate anywhere in it. The closure is real and is
      not re-entered.
    - >-
      DEC-20260810-2c7e3c (the closed CM canonical-lift lane). WHY THIS IS NOT
      THAT LANE, STATED IN THE TERMS THE DECISION DEMANDS. The lane is closed by
      a quantity -- the canonical height of a LIFTED POINT of an ECDLP instance
      curve, of order N, against rho's exponent 1/2 -- and any variant must say
      what CM does to that quantity. THIS RECORD LIFTS NO POINT AND HAS NO
      CANONICAL HEIGHT IN IT. Coleman integration here is l-adic analysis
      performed on the MODULAR CURVE X_0(N), integrating a weight-2 cusp form
      along a path between cusps; the object integrated is a differential on a
      moduli space, not an ECDLP instance curve, and nothing is lifted from
      characteristic p to characteristic 0 except the modular curve itself,
      which lives over Z by construction. There is no Mordell-Weil lattice, no
      regulator, no lifted point, and therefore no canonical height to move. The
      distinction is stated here explicitly because the decision requires it,
      and it is structural rather than a matter of degree.
    - >-
      KN-TECH-3b593f (the genus-1 applicability boundary). This record makes NO
      claim about prime-field ECDLP and proposes no route to it. Its target is
      the hardness of a newly proposed isogeny-side assumption, in the
      KN-OPEN-013 family. Neither of the two closed mechanisms -- Smith's
      tractable subgroups, and the Kani/SIDH torsion budget -- appears anywhere
      in it, and no torsion images of any secret map are used.
    - >-
      IDEA-20260807-dbb250 (the target-module gate). Methodological relative,
      not overlap. That record decides a family of p-adic invariants by their
      type signature (target module and homogeneity degree) and concludes they
      vanish. This one decides a family by ADDITIVITY and concludes the problem
      is BDD. Both are zero-compute type-level audits; the objects, the targets
      and the conclusions are disjoint. Declared so a reviewer compares them
      deliberately.
    - >-
      Standard lattice cryptanalysis (LLL, Babai, BKZ). No new lattice technique
      is proposed and none is claimed. The increment claimed is the
      IDENTIFICATION of MSI as an instance of the standard problem, plus the
      p-independence consequence (D3). If the source paper already states this,
      the increment is zero -- and this record cannot rule that out, because its
      session could not read the paper.

  assumptions:
    - >-
      C in H(X_0(N), C, Z) denotes the CUSPS, so the group is the classical
      modular symbols module H_1(X_0(N), cusps; Z). INFERRED FROM THE ABSTRACT'S
      OWN GLOSS "i.e. modular symbols"; not verified against the body.
    - >-
      d = dim S_2(Gamma_0(N)) = genus of X_0(N), the natural reading of "pairing
      with weight-2 cusp forms". INFERRED, NOT VERIFIED. If d is instead the
      dimension of a single Hecke eigencomponent or of a new subspace, every
      determinant in claim (C) changes and the arithmetic must be redone.
    - >-
      rank H_1(X_0(N), cusps; Z) = 2g + c - 1 with c the number of cusps, and the
      Manin symbol presentation has |P^1(Z/NZ)| generators subject to the 2-term
      and 3-term relations. STANDARD (Manin; Cremona; Stein), RECALLED AND NOT
      RE-READ IN THIS SESSION. It is checkable to the last digit at toy N by any
      modular symbols implementation and Stage 2 does check it.
    - >-
      Coleman integration is additive in the path and linear in the form.
      STANDARD FOR THE ADDITIVE INTEGRAL, RECALLED NOT READ. It is precisely the
      hypothesis Stage 1 tests empirically rather than assumes.
    - >-
      The Gaussian heuristic applies to ker(A) up to a deviation this record
      measures rather than assumes -- see HEUR-MSI-L1.
    - >-
      The oriented-instance generator of IDEA-20260811-626f00 exists. This
      record cannot be executed without it, and says so.

  proof_search_map:
    bottleneck: >-
      ADDITIVITY OF THE ENCODER IN THE HOMOLOGY CLASS. It is the only property
      of the paper's construction the entire argument uses. Remove it and every
      statement in this record evaporates; keep it and the reduction to BDD is
      immediate and the exponent statement (D) follows by counting. There is no
      intermediate: the bottleneck is a single yes/no algebraic fact and Stage 1
      measures it directly.
    baseline_embedding:
      parameter_slice: >-
        Random q-ary lattices of the same rank n and determinant l^{m r}, with
        planted errors of norm S -- the standard BDD baseline whose success
        curve against the gap is documented lattice-cryptanalysis practice. The
        MSI lattice must reproduce that curve as a parameter slice, or differ
        measurably; either is a result.
      reproduction_check: >-
        Frozen fixture: for a fixed seed, a fixed random q-ary instance at
        n = 30, l = 2, m = 8, planted error norm S, LLL plus Babai must return
        the planted error exactly. Integer equality, not similarity of a curve.
        A failure means the lattice harness is broken and no MSI number from it
        may be reported.
    observation_collision:
      observable: >-
        The truncated period vector v = Per_m(x) in (Z/l^m Z)^d.
      distinct_preimage_search: >-
        THE COLLISION SEARCH IS THE EXPERIMENT, AND IT IS TWO-SIDED. Under L1,
        distinct short preimages of the same v exist exactly when Regime 1 holds,
        and they are FOUND CONSTRUCTIVELY by enumerating short vectors of ker(A)
        and adding them to x_0. A found collision falsifies identifiability and
        settles outcome O2. Absence of collisions at the tested (N, l, m, S) is
        NOT evidence of hardness and must never be recorded as such -- it merely
        places the cell in Regime 2 or 3, where the gap decides.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "invert the l-adic period encoding" by "decode in the coset
          x_0 + ker(A)". ENCODING: the d-by-n matrix A over Z/l^m Z, built from
          public data. COMPLETENESS: every short representative of v is a short
          coset element, by L1. SOUNDNESS: every short coset element is a valid
          answer to MSI as the abstract states it ("A short homology
          representative", not "the"). TRANSFER: exact under L1, void without
          it. COST LOSS: none in the reduction itself; the cost is BKZ's.
        predicted_gain: >-
          Converts an unanalysed new assumption into a fully analysed old one,
          and yields the exponent statement (D): security parameter n ~ N/6,
          with no dependence on p.
      - transform: observable_fiber
        proposed_object: >-
          Hold v fixed and vary the homology class over the fibre ker(A); ask
          for an intrinsic invariant of the ORIENTED CURVE distinguishing the
          fibre elements.
        predicted_gain: >-
          Under L1 the fibre is a full sublattice coset and carries no such
          invariant beyond the norm, which is what makes shortness the only
          available side condition. An exception found here would be a genuine
          new handle and would supersede this record.
    quantifier_order: >-
      THE CLAIM: FOR ALL N, l, m and FOR ALL x, y in M,
      Per_m(x + y) = Per_m(x) + Per_m(y); and THEN, FOR ALL (N, l, m, S) with
      S <= 2^{-n/2} G D, THERE EXISTS a polynomial-time algorithm (LLL plus
      Babai) that FOR ALL instances returns the unique short preimage. THE TRAP,
      NAMED: the inverted order "for all instances there exists a lattice in
      which it is easy" is vacuous, since one may take the lattice generated by
      the answer. The content is that A is fixed BEFORE the instance and is
      computed from public data only -- which is exactly what makes the attack an
      attack. Stage 2 must therefore build A without ever calling the attaching
      map, and the run record must show that it did.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "for the tested (N, l, m, S, p) cells, the truncated period map
        is additive and MSI instances fall in the named regime, with measured
        LLL/BKZ success rates and a measured deviation from the random-lattice
        null." It can NEVER certify that MSI is easy at untested parameters, can
        never certify a lower bound of any kind, and cannot certify hardness --
        absence of a successful attack in a toy cell is not evidence of
        hardness (RQ-MSI-f760b2 constraint 1) and this record forbids that
        reading in advance.
      nearby_object_control: >-
        THE NEARBY OBJECT WHERE THE HOPED-FOR CONCLUSION MUST FAIL IS A
        DELIBERATELY NON-LINEAR ENCODER: take the same A, then apply a fixed
        public bijection of (Z/l^m Z)^d that is not additive (for example
        coordinatewise squaring composed with a fixed permutation). The identical
        pipeline MUST fail on it. A pipeline that succeeds on both has not used
        linearity and its verdict on the real map is worthless. THIS CONTROL IS
        BLOCKING and it is the sharpest single check in the record.
    proof_obligations:
      - claim: Per_m is additive in the homology class.
        responsibility: correctness
      - claim: A is computable from public data without the instance.
        responsibility: interface
      - claim: det(ker A) = l^{m r} with r = rank(A mod l).
        responsibility: size
      - claim: Babai after LLL decodes when S <= 2^{-n/2} lambda_1.
        responsibility: correctness
      - claim: 2^{Omega(n)} short preimages exist when S >= c sqrt(n) D.
        responsibility: size
      - claim: attack cost is poly(n, m log l) at LLL and 2^{Theta(beta)} at BKZ-beta.
        responsibility: runtime
      - claim: the success curve tracks the gap and not p.
        responsibility: success_probability
      - claim: every conclusion is scoped to the tested cells.
        responsibility: scope

  predictions:
    - metric: >-
        additivity violation rate -- fraction of sampled pairs (x, y) with
        Per_m(x + y) != Per_m(x) + Per_m(y)
      direction: lower
      minimum_effect: >-
        PREDICTED EXACTLY 0 over at least 10^3 pairs per cell. A single genuine
        violation that is not an implementation bug refutes L1 and triggers
        outcome O4, which is the most valuable outcome available.
    - metric: >-
        rank of A mod l, against d
      direction: different
      minimum_effect: >-
        Predicted equal to d generically, and STRICTLY LESS at congruence primes
        -- which is the hypothesis IDEA-20260811-0f89a9 owns. Any rank deficit
        multiplies det(L) down by l^{m(d - r)} and moves every regime boundary,
        so it must be measured here and not assumed.
    - metric: >-
        LLL plus Babai exact-recovery rate as a function of the predicted gap
        gamma = G D / S
      direction: higher
      minimum_effect: >-
        Predicted above 0.95 for log_2 gamma > 0.6 n and below 0.05 for
        log_2 gamma < 0.1 n, with a transition whose midpoint agrees with the
        random-lattice null to within 15 percent in log_2 gamma. A transition
        displaced by more than that against the null is a Hecke-module effect
        and is itself a finding worth its own record.
    - metric: >-
        attack wall-clock and success rate at fixed (N, l, m) as p varies over
        four values spanning 2^20
      direction: different
      minimum_effect: >-
        PREDICTED FLAT -- no trend in p beyond noise, since no p appears in the
        lattice. Any monotone trend in p at fixed (N, l, m) contradicts the
        purely linear model and is the single most informative negative this
        record can produce.
    - metric: >-
        number of distinct short preimages found in Regime 1 cells
      direction: higher
      minimum_effect: >-
        Predicted to grow like the ball-volume count, exponentially in n once
        S exceeds c sqrt(n) D. Finding exactly one preimage where the count
        predicts many means either the norm model or the Gaussian heuristic is
        wrong at these parameters, and that must be diagnosed before anything
        else is reported.
    - metric: >-
        non-linear-encoder control success rate
      direction: lower
      minimum_effect: >-
        PREDICTED 0. Any success on the deliberately non-additive encoder voids
        every other number in the run.

  minimal_test:
    design: >-
      STAGE 0 (hard gate, zero compute): read the paper body and record the five
      definitions. If (iii) reveals a non-additive normalisation, stop and
      rewrite this record around it; that is outcome O4 obtained for free.
      STAGE 1 (hard gate, minutes): the additivity test on 10^3 pairs per cell
      over a grid of N in {11, 17, 19, 23, 37, 43, 67}, l in {2, 3, 5, 7},
      m in {1..12}. This alone discriminates (A) from (C) at the structural
      level and is the recommended first experiment of the whole portfolio.
      STAGE 2 (hours): build A, record rank, elementary divisors, det, Gaussian
      prediction, exact lambda_1 by SVP at n <= 40, and the empirical S.
      STAGE 3 (hours to a day): LLL/Babai and BKZ across the grid, with the
      random-lattice null, the random-target null, the shuffled null, and the
      non-linear-encoder control.
      STAGE 4 (hours): the p-independence sweep at fixed (N, l, m).
      STAGE 5 (zero compute): the regime table and the scoped verdict.
    controls:
      - Random q-ary lattice of matched rank and determinant (Null 1).
      - Random target vector (Null 2).
      - Shuffled instance-to-vector pairing (Null 3).
      - Deliberately non-additive encoder, which must defeat the pipeline.
      - Frozen planted-error fixture for harness validation before any MSI run.
      - Exact SVP at n <= 40 as ground truth for the Gaussian heuristic.
    required_metrics:
      - Additivity violation count per cell, with the exact violating pair if any.
      - rank(A mod l), elementary divisors, det(L), G D, measured lambda_1.
      - Empirical shortness S of genuine instances, with its full distribution.
      - Predicted gap gamma and measured recovery rate per cell.
      - Recovery rate on each of the three nulls and on the non-linear control.
      - Wall clock and peak memory per cell, and the p-sweep table.

  falsification_conditions:
    - >-
      Additivity fails on genuine encoder output that is not an implementation
      bug. L1 is false, decision-target (A) is refuted for the paper's map, and
      this record is superseded by one built around the non-additive step. THIS
      IS THE OUTCOME MOST WORTH HAVING AND IT IS NOT A FAILURE.
    - >-
      The frozen planted-error fixture fails. The lattice harness is broken; no
      MSI number may be reported (AGENTS.md rule 5).
    - >-
      The non-additive-encoder control is defeated by the pipeline. The pipeline
      is not using linearity; every conclusion in the run is void.
    - >-
      Recovery rate is flat in the predicted gap. The measured success is not
      being produced by the lattice geometry; diagnose the harness before
      reporting anything.
    - >-
      Recovery rate or wall clock trends with p at fixed (N, l, m). Claim (D3)
      is weakened and the mechanism by which p enters must be found.
    - >-
      Stage 0 finds that "short" is measured in the Manin generating set rather
      than in a basis, and the induced relation lattice has rank and geometry
      different enough that the regime boundaries of claim (C) do not apply. The
      arithmetic of (C) must then be redone in the correct lattice before any
      attack claim is made.

  confounders:
    - >-
      NORM CONVENTION. l^1 in the Manin generating set, l^2 in a basis, and
      combinatorial path length are three different shortness measures that give
      three different lattices and three different values of S. Every reported
      gap must name its convention, and the Stage 0 read decides which one is the
      paper's.
    - >-
      RANK DEFICIENCY OF A. det(L) = l^{m r}, not l^{m d}, and r can be smaller
      than d at congruence primes. Using d in place of r silently overstates the
      determinant and therefore the gap, making the instance look harder than it
      is. This is the confounder most likely to produce a wrong verdict, and it
      is exactly what IDEA-20260811-0f89a9 is for.
    - >-
      THE LATTICE IS NOT RANDOM. ker(A) is a module over the Hecke algebra. The
      Gaussian heuristic and the BKZ simulator are calibrated on random lattices;
      the deviation is measured (HEUR-MSI-L1) rather than assumed away, and a
      large deviation is a result rather than a nuisance.
    - >-
      INSTANCE DISTRIBUTION. Instances produced by the attaching map are not
      uniform short vectors. A recovery rate measured on uniform planted errors
      does not transfer to genuine instances; both must be run and reported
      separately.
    - >-
      TOY-SCALE DIMENSION. At n <= 60 nearly every lattice instance is easy for
      LLL, and a success there says almost nothing about n ~ 400. The
      SUCCESS-VERSUS-GAP CURVE, not the raw success rate, is the transferable
      quantity, and the record must report it that way.
    - >-
      PRECISION. l-adic quantities are computed to finite precision; a wrong m
      in the implementation is indistinguishable from a rank deficiency in the
      output unless the elementary divisors are recorded.

  interpretation_limits:
    - >-
      MSI IS NEW AND ITS HARDNESS IS UNVERIFIED BY DEFAULT. Nothing here may be
      read as evidence that MSI is hard, and a cell in which the attack fails is
      a cell in Regime 3, not a security claim (RQ-MSI-f760b2 constraint 1).
    - >-
      EVERY STATEMENT ABOUT THE PAPER'S CONSTRUCTION IS AN INFERENCE FROM THE
      ABSTRACT. The body was not read: this session's WebFetch and WebSearch both
      failed with a backend model error and no local PDF exists in this
      worktree. Stage 0 is a hard precondition and the record says so.
    - >-
      Toy scale only. N <= 67 in the first grid, n <= 25 or so, which is far
      below any regime where lattice hardness is the operative question.
    - >-
      No claim about prime-field ECDLP is made, implied, or reachable from this
      record. The target is an isogeny-side assumption in the KN-OPEN-013 family.
    - >-
      If the source paper already contains the linearity observation, this
      record's increment is zero on the mathematics and non-zero only on the
      program's parameter accounting. That possibility is open and unchecked.

  heuristic_assumptions:
    - id: HEUR-MSI-L1
      statement: >-
        FOR ALL (N, l, m) in the tested range, the lattice L = ker(A) inside Z^n
        has first minimum lambda_1(L) = (1 + eps(n)) sqrt(n/(2 pi e))
        det(L)^{1/n} with |eps(n)| bounded by a constant independent of N, l and
        m -- that is, L behaves like a uniformly random lattice of its
        determinant with respect to its first minimum, uniformly over the grid.
      rigorous_support: >-
        The rigorous ingredient is Minkowski's convex body theorem, which gives
        the unconditional upper bound lambda_1 <= 2 (det L)^{1/n} V_n^{-1/n}, and
        the classical distribution statement being imitated is the Gaussian
        heuristic for random lattices, exact in expectation for the Haar measure
        on unimodular lattices by Siegel's mean value theorem and used
        throughout lattice cryptanalysis for q-ary lattices. THE ASSUMPTION IS
        THAT THE HECKE-MODULE STRUCTURE OF ker(A) DOES NOT MOVE lambda_1, WHICH
        IS PRECISELY WHAT MIGHT FAIL -- module lattices are the one family where
        it is known to fail in other settings.
      falsification_condition: >-
        Measured lambda_1 differing from the Gaussian prediction by more than a
        factor 2 in either direction at n <= 40, systematically across the grid
        rather than in isolated cells.
      validation_plan: >-
        SAMPLE: exact shortest vectors of ker(A) by fplll/SVP for every cell with
        n <= 40, across N in {11, 17, 19, 23, 37, 43}, l in {2, 3, 5, 7},
        m in {1..12} -- of order 10^2 to 10^3 cells, each seconds to minutes.
        SHORTCUT USED TO REACH SCALE: none is needed at n <= 40; above it the
        BKZ Hermite factor is used as a proxy and the proxy's own error is
        reported. COMPARISON DISTRIBUTION: the Gaussian prediction
        sqrt(n/(2 pi e)) det^{1/n}, and separately the empirical distribution of
        lambda_1 over 10^2 random q-ary lattices of identical rank and
        determinant. TAIL CHECK: report the 20 cells with the smallest measured
        lambda_1 / prediction ratio explicitly, since a systematically short
        first minimum is exactly how a module structure would announce itself and
        would make MSI EASIER, not harder. TRANSFER ASSUMPTION, STATED: that a
        deviation measured at n <= 40 persists in sign and rough magnitude at
        n ~ 400. THIS IS NOT JUSTIFIED BY ANYTHING AND IS RECORDED AS AN OPEN
        EXTRAPOLATION.
    - id: HEUR-MSI-L2
      statement: >-
        FOR ALL instances produced by the attaching map at the tested p, the
        shortness S of the genuine homology representative satisfies
        S <= c1 * (path length) in whichever norm Stage 0 identifies, with c1 an
        absolute constant, and the distribution of S over random instances has
        sub-Gaussian tails around its median.
      rigorous_support: >-
        NONE UNTIL STAGE 0. The classical statement being imitated is the linear
        growth of the l^1 norm of a Manin-symbol expression in the number of
        symbols used, which is definitional once the shortness measure is known
        but is entirely unknown while it is not. This is the assumption with the
        least support in the record and it is flagged as such rather than
        buried.
      falsification_condition: >-
        S growing faster than linearly in path length, or having heavy tails
        that put a non-negligible fraction of instances in a different regime
        from the median instance.
      validation_plan: >-
        SAMPLE: at least 10^3 instances per (N, l, p) cell from the attaching
        map, recording S and the path length side by side. COMPARISON: linear
        regression of S on path length with reported residual structure, and the
        empirical CDF of S against a sub-Gaussian fit. TAIL CHECK: report the 20
        largest and 20 smallest S explicitly and state which regime each falls
        in, since a bimodal S distribution would mean the security of a
        construction is set by its worst instances, not its median ones.
        TRANSFER: toy p only; no extrapolation to cryptographic p is offered.

  target_complexity:
    time_exponent: >-
      Under L1 and HEUR-MSI-L1, MSI at (N, l, m, S) costs: poly(n, m log l) --
      LLL plus Babai -- whenever S <= 2^{-n/2} sqrt(n/(2 pi e)) l^{m r/n}; and
      2^{Theta(beta)} with BKZ block size beta chosen so that
      delta_beta^{-n} sqrt(n/(2 pi e)) l^{m r/n} >= S, i.e. 2^{Theta(n/log n)}
      at the hardest point of the surviving window. WITH n = 2d + 1 ~ N/6 FOR
      PRIME N, THE EXPONENT IS IN N AND THERE IS NO p IN IT. In particular, for
      N = (log p)^{O(1)} the cost is (log p)^{O(1)} -- polynomial-time broken.
    memory_exponent: >-
      poly(n, m log l) for LLL/Babai -- negligible. BKZ-beta needs 2^{Theta(beta)}
      for sieving-based SVP oracles or poly memory for enumeration at
      2^{Theta(beta log beta)} time; both operating points are reported. Memory
      is NOT the binding constraint here, unlike the p^{1/3+o(1)} isogeny
      algorithm whose memory equals its time.
    best_known: >-
      FOR MSI ITSELF: NONE. MSI was proposed in 2026-03 and this program knows
      of no published cryptanalysis; the only implicit baselines are exhaustive
      search over short representatives, cost (2S+1)^n, and its meet-in-the-
      middle square root. FOR THE ADJACENT ISOGENY PROBLEMS THAT MSI MIGHT
      INHERIT FROM: the supersingular isogeny / EndRing / OneEnd problem at
      p^{1/2} (log p)^{O(1)} unconditional (Delfs-Galbraith, as recorded in
      docs/target-result-profile.md) and p^{1/3+o(1)} in time AND memory
      conditional on Wesolowski's Heuristic 1
      (inputs/P13-WESOLOWSKI-2026/paper_fulltext.md). THE Otilde(p^{1/4}) FIGURE
      CARRIED IN KN-OPEN-013 IS NOT USED AS A BASELINE HERE: RQ-SSIQ-9702af
      constraint 2 records it as being for the F_p-restricted problem, at
      confidence relayed_from_abstract, and contested across retrievals. The
      discrepancy between KN-OPEN-013 and RQ-SSIQ-9702af on this figure is
      flagged for the corpus curator and is not resolved by this record.
    hidden_overhead: >-
      The poly(n, m log l) hides the cost of BUILDING A, which requires n
      encoder calls -- and the encoder's own cost is unknown until Stage 0,
      since l-adic Coleman integration to precision l^m may itself be expensive
      in m. If the encoder costs more than the attack, MSI cannot support a
      construction at all, which is why IDEA-20260811-626f00 measures encoder
      cost as a first-class metric. The 2^{Theta(beta)} hides the constant in
      the sieving exponent, currently about 0.292 beta classically, and hides
      the fact that BKZ simulation is calibrated on random lattices while this
      one is a Hecke module.
    tradeoff_note: >-
      Standard BKZ time-memory interpolation applies: enumeration gives
      2^{Theta(beta log beta)} time at poly memory, sieving 2^{0.292 beta + o(beta)}
      time at 2^{0.208 beta + o(beta)} memory. Parallelisation of BKZ is
      routine and near-linear in the sieve. THE CONTRAST WITH THE ISOGENY SIDE IS
      THE POINT: the p^{1/3+o(1)} algorithm sits on the van Oorschot-Wiener curve
      with memory equal to time, whereas the lattice attack on MSI is
      memory-cheap. If MSI is a lattice problem it is attacked on a completely
      different cost surface from the problem it is supposed to be built on, and
      a construction's designer must cost BOTH.

  dominated_by: >-
    CHECKED AGAINST EVERY FRONTIER ROW THIS PROGRAM HOLDS FOR THE ADJACENT
    PROBLEMS, ON TIME, MEMORY AND DATA. As an attack on MSI there is no
    incumbent to be dominated by -- MSI has no published cryptanalysis known here
    -- so `dominated_by` is NOT null and is instead stated as: nothing dominates
    this on MSI because nothing else addresses MSI, and that absence is a
    statement about the literature's age, not about this record's quality. As an
    attack on the ISOGENY problems MSI is adjacent to, this record is dominated
    outright by every row: p^{1/2}(log p)^{O(1)} at polynomial memory
    (Delfs-Galbraith), p^{1/3+o(1)} time and memory conditional on Heuristic 1
    (Wesolowski), and on the oriented/class-group side by meet-in-the-middle at
    sqrt(#Cl(O)) classically and Kuperberg at 2^{O(sqrt(log p))} quantumly
    (KN-TECH-027) -- because this record attacks none of them and produces no
    isogeny path. As a LATTICE technique it is dominated by all of LLL, BKZ and
    sieving, none of which it improves by a single constant. THE RECORD'S ENTIRE
    CLAIM TO VALUE IS CLASSIFICATION, NOT SPEED.
  sota_delta: >-
    Zero speedup against every named baseline, on every axis, and no new
    algorithm is proposed. QUANTITATIVE CONTENT DELIVERED IF L1 HOLDS: MSI's
    security parameter is identified as n = rank H_1(X_0(N), cusps; Z) = 2g + c - 1,
    approximately N/6 for prime N, with NO dependence on p; the polynomial-time
    break of every parameter set with N = (log p)^{O(1)}; the explicit regime
    boundaries S >= c sqrt(n) l^{m r/n} (ill-posed) and S <= 2^{-n/2} sqrt(n/(2 pi e))
    l^{m r/n} (LLL-broken); and the concrete constraint N >~ 2400 for a
    128-bit claim under standard lattice sizing. If L1 fails, the delivered
    content is instead the identity of the non-additive step, which is strictly
    more valuable and is why the test is worth running either way.

  constraint_compliance:
    hardness_unverified: >-
      RQ-MSI-f760b2 constraint 1 honoured explicitly in interpretation_limits
      and in method_ceiling: no cell in which the attack fails may be reported as
      evidence of hardness, and the record pre-registers that reading as
      forbidden.
    not_ecdlp_route: >-
      RQ-MSI-f760b2 constraint 2 honoured: no prime-field ECDLP claim, no
      higher-dimensional isogeny mechanism, no torsion advice, and neither of
      KN-TECH-3b593f's two closed routes appears.
    not_canonical_lift: >-
      RQ-MSI-f760b2 constraint 3 honoured with the required explicit statement,
      in discriminated_from item 2: Coleman integration here is l-adic analysis
      on the modular curve, no point of any ECDLP instance is lifted, and there
      is no canonical height in the record for CM to act on.
    not_h_mod_closure: >-
      RQ-MSI-f760b2 constraint 4 honoured with three independent separations in
      discriminated_from item 1 -- different object (relative homology of X_0(N)
      versus a single X_1(N) fibre), different group action (Hecke versus a free
      transitive diamond action), different instance (oriented supersingular
      curve over F_{p^2} versus a rational ECDLP triple).
    lit_entry_corrected: >-
      RQ-MSI-f760b2 constraint 5 honoured: this record uses the published
      abstract as quoted in RQ-MSI-f760b2, not KN-LIT-1662's summary line, and
      records that the body remains unread and that this session's web tools
      failed.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.85 that Per_m is additive in the class, because every named ingredient is
    a pairing or an integral and non-additivity would have to be inserted
    deliberately; the residual 0.15 is concentrated on a multiplicative integral
    without a logarithm or a per-class normalisation, and it is exactly the 0.15
    worth paying three encoder calls to resolve. 0.9 that, conditional on
    additivity, toy instances land in Regime 2 or Regime 1 rather than Regime 3,
    because toy n is small and LLL is strong there -- WHICH IS ALSO WHY A TOY
    SUCCESS PROVES ALMOST NOTHING and why the success-versus-gap curve is the
    reported quantity. 0.5 that the Hecke-module deviation from the Gaussian
    heuristic is measurable at n <= 40. 0.25 that the paper already states the
    linearity observation, in which case the increment is only the parameter
    accounting.

