idea:
  id: IDEA-20260808-778f82
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-UOV-001
  goal_id: GOAL-UOV-001
  title: The polar-orthogonal split meet-in-the-middle is the only claw decomposition the
    UOV oil-vector search admits, and it is blocked by an exact inequality (n-o)(m+2) > 4n
    at every published parameter set -- a closure with a named obstruction and a design threshold
    that whipping moves toward at rate sqrt(k)
  class: algorithm
  claim: 'DERIVED THIS SESSION. A meet-in-the-middle on the oil-vector search needs the quadratic
    map to SPLIT across the two halves. Writing x = u + w, P_a(u+w) = P_a(u) + P_a(w) + P''_a(u,w),
    so the split works exactly on pairs of subspaces (U,W) with P''_a(U,W) = 0 for all a.
    TWO EXACT COUNTS. (1) EXISTENCE: the condition is m*d^2 linear conditions on a pair of
    d-dimensional subspaces, whose parameter space has dimension 2d(n-d), so a generic pair
    exists only if 2(n-d) >= m*d, i.e. d <= 2n/(m+2). (2) USEFULNESS: for O to meet U + W
    we need o + 2d > n, i.e. d >= (n-o)/2. Combining, the split MitM is feasible iff (n-o)(m+2)
    <= 4n. CLAIM: this fails at every published parameter set in the slice -- at RECALLED
    uov-Ip (112,44,44) it reads 68*46 = 3128 > 448; at RECALLED MAYO-1 underlying (66,64,8)
    it reads 58*66 = 3828 > 264 -- so the claw route is closed, with the obstruction NAMED
    (too many equations relative to the ambient dimension to build a mutually polar-orthogonal
    pair large enough to meet O). SECOND CLAIM, the forward guidance: on the whipped system
    the same inequality reads (kn - ko)(m+2) <= 4kn, i.e. it is UNCHANGED by k, because both
    sides scale by k -- so whipping does NOT move the threshold, contradicting the naive sqrt(k)
    intuition, and the record states which parameter does move it: m, linearly. A scheme with
    m <= 4n/(n-o) - 2 would be MitM-vulnerable; every published set has m two orders above
    that.'
  mechanism: Claw decompositions need separability, and a quadratic map is separable exactly
    on polar-orthogonal pairs. That is the whole mechanism, and the obstruction is a linear-algebra
    dimension count with no heuristics in it. The reason it is worth writing down rather than
    assuming is that this program's search heuristics mandate looking for meet-in-the-middle
    splits, and a closure that says WHY none exists is worth more than a silent omission.
  why_not_a_renamed_known_approach: 'Nearest known method: generic MQ meet-in-the-middle,
    which fails on the cross term and is usually dismissed in one line. This record does not
    dismiss it; it computes the exact condition under which it would work and shows the condition
    is a two-order-of-magnitude miss, then converts that into a design threshold. Nearest
    internal record: none -- no corpus record considers a MitM against any scheme in this
    slice.'
  predictions:
  - observable: (n-o)(m+2) versus 4n at every published parameter set in the slice
    metric: two integers and their ratio
    predicted: Ratio between 7 and 15 for plain UOV, above 14 for MAYO underlying maps, above
      20 for SNOVA and QR-UOV flattened. All fail. A ratio below 1 anywhere would be a live
      attack and would invert the record.
  - observable: at toy cells engineered to SATISFY the inequality, e.g. (q,n,m,o) = (16,20,2,4),
      the measured cost of the split MitM versus exhaustive search over the oil space
    metric: field operations and table size in field elements
    predicted: MitM cost ~q^{(n-o)/2} = q^8 versus q^{n-2o} = q^{12} for the guessing attack
      -- a real gain, confirming the mechanism is sound and only the parameters are hostile.
      If the MitM does NOT win even there, the mechanism is wrong and the closure is vacuous.
  - observable: 'relaxed version: orthogonality imposed on only s < m equations, with the
      remaining m - s used as filters'
    metric: total cost as a function of s
    predicted: Monotone worse than the exact version at every published parameter set, because
      the filter stage costs q^{m-s} per surviving pair. A relaxed optimum that beats the
      exact version at a published set would reopen the lane.
  minimal_test: 'Two parts. PART A, zero compute: evaluate (n-o)(m+2) vs 4n for all published
    sets and the relaxed-s cost curve; one table. PART B, positive control: at the engineered
    cell (q,n,m,o) = (16,20,2,4) and (16,24,2,5), construct a mutually polar-orthogonal pair
    (U,W) by solving the m*d^2 linear system, run the MitM to a certified oil vector, and
    compare the measured cost against exhaustive search. Part B exists so the closure is not
    a fatigue report: it demonstrates the mechanism works where the inequality permits.'
  controls:
  - 'The engineered-cell positive control IS the primary control: a closure that cannot show
    its mechanism firing anywhere is not a closure.'
  - 'RANDOM-PAIR NULL: run the same MitM with a pair (U,W) that is NOT polar-orthogonal. The
    claw must fail (no matches beyond birthday noise). Matches there would mean the harness
    is matching on something other than the intended condition.'
  - 'DIMENSION-COUNT CONTROL: verify computationally that the solution space of the m*d^2
    linear system has the predicted dimension 2d(n-d) - m*d^2 at several (n,m,d), including
    a cell where the count predicts zero.'
  confounders:
  - The linear system for (U,W) is not generic (it is bilinear in the two subspace bases),
    so the naive parameter count could be wrong in either direction; the dimension-count control
    settles it empirically at toy sizes.
  - U and W need not have equal dimension; the asymmetric optimum d_U != d_W could relax the
    threshold. The record must optimise over (d_U, d_W) rather than assuming symmetry.
  - Non-linear U and W (arbitrary sets rather than subspaces) are not covered by the count
    and are named as remaining open.
  falsification_conditions:
  - The positive control fails, i.e. the MitM does not beat guessing even where the inequality
    holds.
  - The asymmetric optimisation over (d_U, d_W) satisfies the inequality at any published
    set.
  - The dimension-count control shows the pair space is larger than 2d(n-d) - m d^2.
  interpretation_limits: 'This closes exactly one family: claw decompositions based on EXACT
    polar-orthogonal linear splits of the ambient space. It does not close MitM over non-linear
    sets, MitM on the k-tuple system rather than the single-vector system, or quantum claw
    finding. Those are named as open. Per the Idea Generator prohibitions, nothing here declares
    a direction impossible.'
  assumptions:
  - Characteristic 2 or odd, both handled (the polar form is the same object up to a factor
    2).
  - The oil space has dimension exactly o (definitional).
  - Published tuples as RECALLED.
  heuristic_assumptions:
  - id: HA-1
    statement: For random public forms, the variety of pairs of d-dimensional subspaces (U,W)
      with P'_a(U,W) = 0 for all a is nonempty and of the expected dimension 2d(n-d) - m d^2
      whenever that number is nonnegative, uniformly for d <= n/3.
    rigorous_ingredient: The conditions are m d^2 linear equations on the affine chart of
      a pair of subspaces, so the solution space of the LINEARISED problem has dimension at
      least 2d(n-d) - m d^2; only nonemptiness of the honest (non-linearised) variety is heuristic.
    distribution_imitated: '"A system of bilinear conditions on a product of Grassmannians
      behaves like a generic linear section" -- the standard incidence-variety dimension count.'
    validation_route: At (n,m,d) with the count positive, zero, and negative, solve the actual
      system for 100 random keys and record the dimension of the solution set. TOY SCALE.
      Compare against the predicted integer; the zero and negative cells are the informative
      ones.
    tail_checks: Record any key for which a solution exists when the count predicts negative
      dimension; such keys would be a weak-key family and are a finding in their own right.
  target_complexity:
    time_exponent: Where feasible, q^{(n-o)/2} time versus the guessing attack's q^{n-2o}.
      The split MitM wins exactly when (n-o)/2 < n - 2o, i.e. when n > 3o -- which is MAYO's
      regime and not plain UOV's. That crossover is stated because it is why the closure matters
      most for MAYO.
    memory_exponent: q^{(n-o)/2} field elements -- memory equals time, the classic claw-finding
      position. A van Oorschot-Wiener interpolation gives time q^{3(n-o)/4}/sqrt(w) at memory
      w, which is the honest low-memory statement and is worse than guessing at every published
      set.
    best_known_baseline: Kipnis-Shamir-style guessing at q^{n-2o} poly, and the intersection
      attack. Both dominate the MitM at every published parameter set.
    hidden_overhead_disclosure: The q^{(n-o)/2} figure ignores the cost of CONSTRUCTING (U,W),
      which is a linear solve of size m d^2 -- polynomial, but at d ~ (n-o)/2 that is a matrix
      with ~m(n-o)^2/4 rows, which is not free and is charged in the table.
    time_memory_tradeoff: Stated above; the interpolation makes the MitM strictly worse, which
      strengthens the closure rather than weakening it.
  sota_delta: 'Negative delta, stated quantitatively: at RECALLED uov-Ip the split MitM would
    need d >= 34 while the existence count permits d <= 2; the miss is a factor 17 in d, i.e.
    the route is not close. The deliverable is the exact inequality and the design threshold
    m <= 4n/(n-o) - 2.'
  dominated_by: 'Dominated by Kipnis-Shamir guessing and by the intersection attack at every
    published set, on both time and memory. Frontier rows checked: KS q^{n-2o} poly (time,
    negligible memory), intersection attack (time, Macaulay memory), reconciliation (time,
    Macaulay memory), direct attack (time, memory), and the corpus rows IDEA-20260805-ca92fd
    and -69af7c. dominated_by is NOT null and could not be.'
  estimated_cost: 'Implementation low-medium: a linear solver for the pair condition, a hash-table
    claw, a certificate checker. Compute low: the engineered cells are tiny by construction.'
  recommended_priority: medium
  honest_prior_of_survival: 'That the inequality is correct: ~0.9. That it fails at every
    published set: ~0.95. That the positive control fires at the engineered cell: ~0.7 (the
    risk is that a polar-orthogonal pair large enough to meet O simply does not exist even
    when the count permits it). Value of the record is mostly in the closure and the named
    threshold, which survive either way.'
  novelty_status: unverified
  novelty_screen: Same corpus screen as M1-03. No corpus record proposes or closes a MitM
    against any scheme in this slice; KN-FIND entries on meet-in-the-middle concern isogeny
    claw finding (KN-TECH-050, KN-TECH-055) and do not apply. WEB NOT CHECKED.
  discriminated_from: 'KN-TECH-055 (Wesolowski-style MitM over a keyed table): same generic
    move, entirely different object -- there the split is over isogeny degrees, here over
    a quadratic form''s polar orthogonality, and the feasibility condition is new. No multivariate
    corpus record addresses MitM at all.'
  source_refs:
  - KN-TECH-055 (internal) -- the meet-in-the-middle search heuristic this record applies.
  - UOV and MAYO specifications -- REQUIRED READS, NOT YET READ.
  proof_search_map:
    bottleneck: Separability of the quadratic map across a direct-sum decomposition of the
      variable space. Removing it is the only way a claw decomposition of the oil-vector search
      can exist.
    baseline_embedding:
      parameter_slice: 'm = 1: a single quadratic form. Then the existence bound is d <= 2n/3
        and the usefulness bound d >= (n-o)/2, which is satisfiable -- reproducing the classical
        fact that a single quadratic form''s isotropic vectors are easy to find.'
      reproduction_check: 'Symbolic: at m = 1 the inequality (n-o)*3 <= 4n holds for all o
        >= 0, matching the known easiness. A formulation failing this is mis-derived.'
    observation_collision:
      observable: The pair of integers ((n-o)(m+2), 4n).
      distinct_preimage_search: Two parameter sets with the same ratio but different real
        security are easy to build, so the observable certifies only the MitM route's status,
        never security. Stated.
    constructive_transforms:
    - transform: boundary_lift
      proposed_object: Relax exact polar-orthogonality to orthogonality on s of the m equations,
        enlarging the certificate family, and ask for a strict inward improvement.
      predicted_gain: None at published parameters -- the filter stage costs q^{m-s} and the
        record computes the full curve rather than asserting it.
    quantifier_order: FORALL published parameter sets in the slice, FORALL pairs of subspaces
      (U,W) with dim U = d_U, dim W = d_W satisfying the polar-orthogonality condition, it
      holds that d_U + d_W < n - o. The witness pair is allowed to depend on the key; no uniformity
      in the key is claimed, which is why the weak-key tail check exists.
    method_ceiling:
      strongest_certifiable_claim: '"No exact linear polar-orthogonal split large enough to
        meet the oil space exists at these parameters." It cannot certify anything about non-linear
        splits or about splits adapted to the (unknown) oil space.'
      nearby_object_control: A quadratic map with m = 2 and the same n, o, where the inequality
        DOES hold. The method must return "feasible" there. A method that returns infeasible
        everywhere is measuring nothing.
    proof_obligations:
    - claim: Separability holds exactly on polar-orthogonal pairs.
      responsibility: correctness
    - claim: The pair-existence dimension count is 2d(n-d) - m d^2.
      responsibility: size
    - claim: The usefulness condition is o + d_U + d_W > n.
      responsibility: feasibility
    - claim: MitM cost is q^{max(d_U,d_W)} time and memory.
      responsibility: runtime
    - claim: Non-linear and oil-adapted splits are not covered.
      responsibility: scope
    not_applicable_reason: null
