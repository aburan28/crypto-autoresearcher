idea:
  id: IDEA-20260922-77bf31
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-22'
  status: proposed
  approved_by: null
  title: >-
    THE DESCENT COLUMN IS NOT ONE COLUMN, IT IS TWO, AND ONLY ONE OF THEM IS
    LEGITIMATELY ZERO. For every DECOMPOSITION column (Semaev/Gaudry/Nagao/QSP,
    single-level factor base V) the individual logarithm is exactly one expected
    successful decomposition, so its charge is a fraction g/B of the relation
    phase -- below 2^-25 at every standardized binary row -- and this record
    supplies the argument instead of the omission. For the COVER column on the
    five composite-degree ANSI curves the same argument FAILS by construction
    and the cell is OPEN, not zero. The one quantity neither limb settles is the
    per-attempt RE-RANDOMIZATION cost, where the free Koblitz re-randomizer tau
    is provably worth zero new trials and the cheap translate-by-W walk is
    unmeasured: that is the branching parameter b of the decomposability
    indicator and it is measurable at n <= 41 in minutes.
  class: measurement

  claim: >-
    (A) THE DICHOTOMY, WHICH IS A PROPERTY OF THE FACTOR BASE AND NOT OF THE
    CURVE. Call a factor base SINGLE-LEVEL if a uniformly random group element
    decomposes over it with probability bounded below by a constant times
    1/m! -- i.e. the base is already a complete smoothness base for the whole
    group. Every decomposition-based column in this program's reach is
    single-level: Gaudry/Diem with V an F_2-subspace of dimension l ~ n/m,
    Semaev's chained S_3, Nagao's disjoint-coset bases, and the quasi-subfield
    bases of RQ-QSP-f9bbdb. For a single-level base the INDIVIDUAL LOGARITHM IS
    NOT A DESCENT AT ALL: the target Q is re-randomized to R = [a]P + [b]Q and
    fed to the same point-decomposition routine that produces relations, and one
    success finishes the phase. There is no descent tree, no special-Q, no
    intermediate large-prime level.
    (B) THE BOUND, AND THE ASYMMETRY INSIDE IT. Let C_att be the fully charged
    cost of one decomposition attempt, p the per-attempt success probability, B
    the factor-base size and R_need the number of relations needed. Relation
    phase = R_need * C_att / p. Descent phase = 1 * C_att / p + C_rerand.
    Therefore descent/relations = 1/R_need + (C_rerand * p)/(R_need * C_att).
    THE ASYMMETRY: on a Koblitz or subfield row every ORBIT-GAIN factor g that
    the Frobenius grants relation collection -- g = n free tau-shifted relations
    per solve on K-m and ECC2K-130, g = k on the five c2pnb* rows -- applies to
    R_need and NOT to the single descent solve, because one relation is one
    relation whatever its orbit. The descent share is therefore g/B, not 1/B.
    (C) THE COMPUTED ROWS (this session's arithmetic, formula shown, no figure
    recalled). With l = ceil(n/m) and B = 2^l: ECC2K-130 (n = 131, m = 4)
    B = 2^33, g = 131 < 2^7.04, share < 2^-25.9; ECC2K-130 (m = 5) B = 2^27,
    g = 2^7.04, share < 2^-19.9; K-163 (m = 4) B = 2^41, g = 2^7.35, share
    < 2^-33.6; K-571 (m = 4) B = 2^143, g = 2^9.16, share < 2^-133.8;
    c2pnb368w1 via a subfield-curve base (n = 368, m = 4) B = 2^92, g = k = 23
    < 2^4.53, share < 2^-87.5. VERDICT: charging the descent column at zero is
    CORRECT for every decomposition column at every standardized binary row, to
    within a relative error below 2^-19. That is a closure with a certificate,
    not an omission, and it is the first time this corpus states it.
    (D) WHERE THE SAME ARGUMENT FAILS, WHICH IS THE HALF THE TABLE MUST NOT
    INHERIT. On the five composite-degree ANSI curves c2pnb176v1, c2pnb208w1,
    c2pnb272w1, c2pnb304w1 and c2pnb368w1 the GHS/cover column transports the
    ECDLP to a Jacobian J_H(F_{2^16}) of a covering curve H, and there the
    factor base is the degree-one prime divisors -- a PARTIAL base, whose
    smoothness probability for a random Jacobian element is subexponentially
    small in the genus. The individual logarithm there IS a genuine multi-level
    smoothness descent and its cost is governed by the genus g_H actually
    obtainable at m/16, which this program has not computed. THE CELL IS OPEN,
    the missing quantity is named (g_H, and the descent's smoothness exponent as
    a function of it), and it must not be filled with the zero that limb (C)
    earns for a different column.
    (E) THE ONE MEASURABLE RESIDUE, AND IT IS SHARED WITH RELATION COLLECTION.
    Limb (B) prices re-randomization at C_rerand. On a Koblitz row the FREE
    re-randomizer is tau, and it is worth EXACTLY ZERO new trials: if V is
    tau-stable and R = P_1 + ... + P_m with P_i in V, then tau(R) = tau(P_1) +
    ... + tau(P_m) with tau(P_i) in V, so the decomposability indicator is
    constant on tau-orbits. The next-cheapest re-randomizer is the translate
    R <- R + W by a fixed small point (one group operation, versus about 1.5n
    for a fresh scalar multiplication). Whether ITS successive indicators are
    independent is UNMEASURED anywhere in this corpus, and it is exactly the
    branching parameter b of IDEA-20260802-002 for this object. CLAIMED: the
    lag-1 autocorrelation of the indicator along a W-translate walk is below
    0.05 in absolute value while the tau-orbit control reads exactly 1.0. Either
    outcome is a result: correlation near zero cuts the per-attempt overhead of
    BOTH the descent and the relation phase to one group operation; correlation
    above 0.05 means every yield number in this program measured with a
    walk-based target generator is biased by a factor 1/(1 - rho_1) and must be
    re-read.

  mechanism: >-
    OBJECT FRAME. Representation: the point R in affine F_{2^n} coordinates with
    the factor base V a tau-stable F_2-subspace of F_{2^n} realised as
    x-coordinates (class R1 of RQ-ECDLP-623a32; the attack stage whose charged
    cost is claimed is the INDIVIDUAL-LOGARITHM stage, with a shared consequence
    for the relation stage's per-attempt overhead). Tracked object: the
    DECOMPOSABILITY INDICATOR chi_V,m(R) in {0, 1}, one bit saying whether R
    lies in the m-fold sumset of V.
    TWO OPERATION SETS, TWO TRICHOTOMY CLASSES, AND THAT IS THE POINT.
    (i) Sigma_tau = <tau>, the Frobenius endomorphism of the Koblitz or subfield
    curve. Against Sigma_tau the indicator propagates DETERMINISTICALLY:
    chi(tau R) = chi(R), because V is tau-stable and tau is additive. The
    indicator's fibres are therefore a block system of <tau> acting on the
    subgroup, which is precisely the licensed shape of IDEA-20260901-863e36.
    CLASS I, PARTIAL-ACTION.
    (ii) Sigma_W = translation by a fixed W. Against Sigma_W the indicator
    propagates only probabilistically -- it cannot do otherwise, since a lossy
    projection deterministic under the full translation action is constant or
    injective (IDEA-20260806-c5d183, KN-FIND-ffe1df Theorem C), and chi is
    neither. CLASS II, BRANCHING, with branching parameter b exactly the
    quantity limb (E) measures.
    LOSSY-PROJECTION TEST, AGAINST EACH NAMED SIGMA. What chi discards: the
    whole point, keeping one bit; loss L = log_2 |G| - H(chi) bits, and since
    Pr[chi = 1] is about 1/m! the retained entropy is under 2 bits at m = 4, so
    the projection is maximally lossy in the representation actually used (the
    tau-orbit of an x-coordinate is not recoverable from the bit). Compatibility
    with Sigma_tau: exact and unconditional, by the additivity of tau and the
    tau-stability of V -- the discard is compatible because tau permutes V, so
    it permutes the fibres of chi. Compatibility with Sigma_W: NONE claimed;
    that is the branching case and its parameter is measured, not asserted.
    A projection that loses nothing would be a change of coordinates; chi loses
    all but one bit and is not one.
    WHY THE FREE SYMMETRY IS USELESS EXACTLY BECAUSE IT PROPAGATES. The same
    equivariance that makes chi a deterministic Class I object under Sigma_tau
    makes tau worthless as a re-randomizer: an operation under which the
    observable is CONSTANT supplies no new observation. This is not a defect of
    the Koblitz structure; it is the general price of a deterministic
    propagation rule, stated here for the one place in this lane where it
    changes a charged cost. The orbit-canonicalisation cost -- the open number
    of IDEA-20260901-863e36 for a quotient object -- is here exactly zero
    (tau is a squaring in a normal basis, a free relabelling), and zero
    canonicalisation cost is the same fact as zero information gain.
    OFF-LIMITS COMPONENTS DECLARED. F2 factor-base decomposition is the
    declared component; what is added beyond "index calculus on curve X" is the
    PHASE-LEVEL dichotomy (C) versus (D) and the branching measurement (E),
    neither of which is a statement about the decomposition step itself. F6
    endomorphism orbit appears only as the positive control in (E), never as the
    lens. No new factor base is proposed, so KN-OPEN-020 is not engaged; the
    bases referenced are the ones their owning questions already define.
    WHAT THIS RECORD DOES NOT DO. It does not re-litigate relation yield
    (RQ-RELN-001), solving degree (RQ-SDEG-001, RQ-DREG-*), the Frobenius
    decomposition mechanism (RQ-FROB-7d8dd4), or the correctness of any chained
    S_3 construction (the SEMBIN questions). It consumes p and C_att from
    whichever of those supplies them and charges one phase the population table
    currently leaves blank.

