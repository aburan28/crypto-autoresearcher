  citation_note: >-
    Limbs (A), (B) and (E)'s tau-equivariance are derived here in full and need
    no source. Limb (C)'s numbers are this session's arithmetic on the formula
    share = g/B with l = ceil(n/m), B = 2^l, g = n on Koblitz rows and g = k on
    the c2pnb rows; the inputs n, m/16 = k and the prime-degree fact come from
    the in-repo audit, which is itself a secondary source. Limb (D) rests on a
    RECALLED property of the hyperelliptic-descent literature and is therefore
    filed as OPEN, never as a cost. novelty_status is unverified: the corpus and
    the ledger were grepped, the external literature was not.

  assumptions:
    - >-
      Single-level means the base is a complete smoothness base for the group:
      a uniform random element decomposes with probability bounded below by
      c/m! for an absolute c > 0. Gaudry/Diem with l = ceil(n/m) is assumed to
      satisfy this at the standardized rows; that assumption is OWNED by
      RQ-RELN-001 and the SEMBIN questions and is consumed, not re-derived. If
      p decays faster than 1/m! the ratio in limb (B) is unchanged, because p
      cancels between the two phases.
    - >-
      Charged operation convention: one group operation on E(F_{2^n}); C_att is
      whatever the owning instrument (RQ-ICPERF-94c86e) reports for one
      decomposition attempt, in the SAME unit on both sides of the ratio. The
      ratio in limb (B) is unit-free by construction, which is why it survives
      the identifiability objection of IDEA-20260805-c8524f and
      IDEA-20260805-bb4488 -- it is a ratio of two costs in one unit, not an
      exponent fitted in a unit-covariant coordinate.
    - >-
      R_need is taken as B/g on orbit-gain rows and B otherwise. The rank
      question -- whether tau-shifted relations add rank -- is NOT settled here;
      it is the subject of IDEA-20260922-b19793 in this same lane, and if that
      record's orbit-collapse limb holds then R_need = B/g exactly and limb (B)'s
      share is g/B as written. If instead shifted relations add full rank, the
      share is 1/B and the bound only gets stronger. Both readings support (C).
    - >-
      Uses F2 (factor-base decomposition) as its declared component and F6
      (endomorphism orbit) only as a control. No new factor base is introduced,
      so no KN-OPEN-020 class is claimed.
    - >-
      Deployed curves are ARITHMETIC ONLY. Limb (C)'s rows are computed under
      l = ceil(n/m); nothing at m >= 131 is executed. Executable cells are
      Koblitz and ordinary binary curves over F_{2^n}, n prime, 17 <= n <= 41.

  proof_search_map:
    bottleneck: >-
      The exact step whose removal changes the theorem is "produce the next
      independent decomposition attempt": in the descent phase one such attempt
      is the whole phase, and the ratio descent/relations is therefore decided
      by how many independent attempts a unit of re-randomization buys. tau
      buys zero (proved here); a fresh scalar multiplication buys one at cost
      about 1.5n group operations; the W-translate buys 1 - rho_1 of one at cost
      one group operation, and rho_1 is the unmeasured number.
    baseline_embedding:
      parameter_slice: >-
        Setting g = 1 (no orbit gain, i.e. the B-m and c2tnb null rows) collapses
        limb (B) to the textbook "descent costs one relation out of B" and must
        reproduce the standard single-level accounting term for term. Setting
        rho_1 = 0 and C_rerand = 0 collapses the whole record to the zero the
        corpus currently assumes, so the incumbent convention is an exact
        parameter slice of this record and not a strawman.
      reproduction_check: >-
        Symbolic, zero compute: with g = 1 the ratio must equal 1/R_need exactly.
        Numeric, on the toy cells: the measured descent operation count divided
        by the measured relation-phase operation count must equal the predicted
        g/B within a factor 1.5 on the same frozen instance set (pairing per
        IDEA-20260815-95fefb). A mismatch beyond that means the two phases are
        not sharing a counting convention and nothing downstream may be read.
    observation_collision:
      observable: >-
        "The descent phase costs zero" as it appears in a cost table.
      distinct_preimage_search: >-
        COLLISION EXHIBITED AND IT IS THE RECORD'S REASON TO EXIST. The same
        printed zero is produced by at least three distinct states of the world:
        (i) a single-level base where the descent genuinely costs g/B of the
        relation phase and the zero is correct to 2^-19 (limbs A-C); (ii) a
        multi-level cover base where the descent is a full smoothness descent and
        the zero is an omission of unknown size (limb D); (iii) an accounting in
        which the re-randomization cost of every attempt -- descent AND relation
        -- was dropped, which understates BOTH phases and whose error is
        C_rerand/C_att, not g/B. A table cell reading zero does not identify
        which of the three it is. The identifying triple is (base level, g/B,
        C_rerand/C_att), and this record proposes that every descent cell carry
        all three.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the printed descent cost at zero and vary the hidden structure
          (single-level versus cover base; re-randomizer charged versus not),
          exhibiting three preimages with materially different charges.
        predicted_gain: >-
          Splits one table column into two with different verdicts and names the
          identifying triple. NO ATTACK EXPONENT IS MOVED.
      - transform: specialization_pack
        proposed_object: >-
          The decomposability indicator chi specialised to the two operation
          sets Sigma_tau (deterministic, canonicalisation cost zero) and Sigma_W
          (branching, parameter b), giving a one-parameter family whose whole
          range is measurable at n <= 41.
        predicted_gain: >-
          Converts "re-randomization is free" from an unstated assumption into a
          measured coefficient shared by the descent and relation phases.
    quantifier_order: >-
      CLAIMED. FOR ALL binary curves E/F_{2^n} in the population, FOR ALL
      tau-stable F_2-subspace factor bases V and FOR ALL m, the map chi_V,m
      satisfies chi(tau R) = chi(R) for every R -- unconditional, a two-line
      consequence of additivity of tau and tau-stability of V. Consequently,
      FOR ALL Koblitz and subfield rows, EXISTS no sequence of tau-applications
      producing a second independent descent trial.
      CLAIMED, CONDITIONALLY. FOR ALL single-level bases, the descent/relation
      charge ratio is 1/R_need + (C_rerand p)/(R_need C_att), which is an
      identity given the definitions and the assumption block.
      NOT CLAIMED: any statement about the cover column's descent cost. NOT
      CLAIMED: that rho_1 is small -- that is the measurement. NOT CLAIMED: any
      exponent for any phase; limb (C) is a ratio, not an exponent.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For every decomposition column over a single-level base at every
        standardized binary row, the individual-logarithm phase costs at most a
        fraction g/B < 2^-19 of the relation phase, so charging it at zero is
        correct to that relative error; for the cover column on the five
        composite-degree ANSI curves the cell is OPEN and the missing quantity
        is the covering genus g_H." It can NEVER certify the cover column's
        cost, any statement about a base this program has not defined, or that
        the re-randomizer overhead is negligible -- that last is measured on toy
        cells only and transfers nowhere by itself.
      nearby_object_control: >-
        THE ONE THAT MATTERS IS THE NULL CURVE. Run limb (E) identically on the
        pseudorandom binary curve of the same field (B-m against K-m, a c2tnb
        row against a c2pnb row at toy scale: an ordinary binary curve
        y^2 + xy = x^3 + a x^2 + b with b != 1 over the same F_{2^n}), where tau
        is NOT an endomorphism of E and no tau-orbit exists. The tau-orbit
        control must read autocorrelation 1.0 on the Koblitz cell and must be
        UNDEFINED (no orbit to form) on the null cell; if the instrument
        produces a number on the null cell it is measuring the field and not the
        curve. Second nearby object: the same V made NOT tau-stable by deleting
        one element per orbit, on which chi(tau R) = chi(R) must FAIL at a
        measurable rate -- if it does not fail, tau-stability is not what is
        driving the equivariance and the whole (i) limb is mis-attributed.
    proof_obligations:
      - claim: >-
          chi(tau R) = chi(R) for every R, on every toy Koblitz cell with a
          tau-stable V, verified exhaustively over the whole group at n <= 23
          and on 10^5 samples at 29 <= n <= 41.
        responsibility: correctness
      - claim: >-
          The g = 1 slice reproduces the textbook 1/R_need term symbolically.
        responsibility: baseline
      - claim: >-
          Measured descent/relation operation ratio matches g/B within 1.5x on
          the frozen toy instance set.
        responsibility: memory
      - claim: >-
          The non-tau-stable V control breaks the equivariance at a measurable
          rate.
        responsibility: correctness
      - claim: >-
          The cover-column cell is emitted as OPEN with g_H named, and no number
          is written into it.
        responsibility: scope

  predictions:
    - metric: >-
        tau_orbit_indicator_concordance -- fraction of tau-orbits on which
        chi is constant, on a toy Koblitz cell with tau-stable V
      direction: higher
      minimum_effect: >-
        FORCED EXACT 1.000, with zero tolerance. Any orbit on which chi is not
        constant is an implementation defect (V not actually tau-stable, or the
        indicator not actually computing sumset membership) and halts the run.
        This is the instrument's positive control and it cannot be passed by
        accident.
    - metric: >-
        lag_1_autocorrelation of chi along an R <- R + W translate walk, W a
        fixed non-factor-base point, on the same toy Koblitz cell
      direction: different
      minimum_effect: >-
        PRE-REGISTERED BAND. |rho_1| < 0.05 is the "cheap re-randomizer is
        sound" reading and licenses charging C_rerand at one group operation for
        BOTH phases. |rho_1| >= 0.05 is the "cheap re-randomizer is correlated"
        reading; the effective independent-attempt count is inflated by
        1/(1 - rho_1) and every yield measured with a walk-based target
        generator inherits that factor. A value in [0.02, 0.05] is reported as
        indeterminate at this sample size and the sample is extended rather than
        interpreted.
    - metric: >-
        measured descent-phase charged operations divided by measured
        relation-phase charged operations, on one frozen toy instance set
      direction: lower
      minimum_effect: >-
        Must equal the predicted g/B within a factor 1.5, with g the actual
        orbit size used and B the actual base size. A ratio exceeding 10*g/B
        means the descent is not one expected decomposition on that cell and
        limb (A) is wrong for that base -- the single most informative negative
        available here.
    - metric: >-
        null-curve control -- same measurement on the matched ordinary binary
        curve of the same field
      direction: different
      minimum_effect: >-
        FORCED SEPARATION. The tau-orbit concordance must be UNDEFINED (no
        endomorphism, no orbit) on the null curve while the W-walk
        autocorrelation is measured on both. If the two curves give
        indistinguishable W-walk autocorrelations, the W-walk statistic is a
        property of the field and the group order, not of the Koblitz structure
        -- which is a legitimate and useful finding, and is reported as such.
    - metric: >-
        descent-column verdict emitted per (curve, column) cell
      direction: different
      minimum_effect: >-
        FORCED TWO-VALUED. Decomposition columns must emit COMPUTED with the
        g/B bound and its inputs; the cover column on the five c2pnb rows must
        emit OPEN with g_H named. A run that emits the same verdict for both is
        not implementing the dichotomy.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, one page, HARD GATE). Write out limb (B)'s identity
      and check the g = 1 slice against the textbook term. Write out the
      tau-equivariance proof. Emit limb (C)'s table with the formula and every
      input traced to the audit. If the g = 1 slice does not reproduce, stop.
      STAGE 1 (low compute, minutes per cell). Toy Koblitz curves
      y^2 + xy = x^3 + 1 over F_{2^n} for n in {17, 19, 23, 29, 31, 37, 41},
      with V a tau-stable F_2-subspace built as ker g(tau) per the construction
      IDEA-20260915-8fe0ef describes, dimension l = ceil(n/m), m in {3, 4}.
      ARM A (positive control): enumerate tau-orbits of sampled targets and
      check chi is constant on each. At n <= 23 do it exhaustively over the
      whole group; above that on 10^5 sampled orbits.
      ARM B (the measurement): from each of 10^3 seeds, walk R <- R + W for 10^3
      steps, recording chi at each step; estimate rho_1 and rho_2 of the binary
      series, with a block bootstrap for the interval.
      ARM C (negative control): same V with one element deleted per orbit, so V
      is not tau-stable; ARM A's concordance must drop measurably.
      ARM D (null object): matched ordinary binary curve over the same field,
      ARM B repeated; ARM A undefined by construction and recorded as such.
      ARM E (independence anchor): the same rho_1 estimate where successive
      targets are drawn by fresh scalar multiplication; predicted 0 within the
      bootstrap interval, and this arm calibrates the estimator's own bias at
      this sample size.
      STAGE 2 (low compute). End-to-end on the smallest cells only (n <= 29):
      run relation collection to R_need relations and then the individual
      logarithm, both on ONE frozen certificate-carrying instance set with
      matched pure-rho beside it (pairing per IDEA-20260815-95fefb, operation
      counts alongside wall clock per IDEA-20260815-66496a), and report the
      measured descent/relation operation ratio against g/B.
      STAGE 3 (zero compute). Emit the descent column of the reachability table:
      one cell per (curve, index-calculus column) with verdict COMPUTED plus the
      g/B bound and its inputs for decomposition columns, and OPEN plus the named
      missing quantity g_H for the cover column on the five c2pnb rows.
      MEMORY DISCIPLINE. The largest object is a table of 2^l field elements at
      l <= 14, plus a 10^3 x 10^3 bit series. Under 100 MB. No Groebner basis is
      built and no Macaulay matrix is formed; chi is computed by sumset
      enumeration at these sizes, so the measurement does not inherit any
      solver's behaviour.
    controls:
      - >-
        POSITIVE CONTROL (blocking): tau-orbit concordance exactly 1.000 on the
        tau-stable V. This is the only control that proves the indicator is
        computing what it says.
      - >-
        NEGATIVE CONTROL (blocking): non-tau-stable V must break concordance.
      - >-
        NULL OBJECT: matched ordinary binary curve of the same field, per the
        question's own null-object requirement.
      - >-
        INDEPENDENCE ANCHOR: fresh-scalar-multiplication re-randomization,
        calibrating the autocorrelation estimator's bias at this sample size so
        a small measured rho_1 is not read as signal.
      - >-
        BASELINE REPRODUCTION: the g = 1 symbolic slice against the textbook
        single-level term.
      - >-
        PAIRED INSTANCE SET: Stage 2's two phases and the matched rho arm all
        run on one frozen instance set with certificates (IDEA-20260815-95fefb),
        and operation counts are reported alongside wall clock
        (IDEA-20260815-66496a).
      - >-
        W-CHOICE SENSITIVITY: repeat ARM B for three independent W, and for
        W in V. A conclusion that flips with W is a property of W and is
        labelled as such.
    required_metrics:
      - tau_orbit_concordance_fraction_per_cell
      - lag_1_and_lag_2_autocorrelation_of_chi_with_block_bootstrap_interval
      - effective_independent_attempt_count_1_over_1_minus_rho1
      - charged_operations_descent_phase_and_relation_phase_per_instance
      - measured_ratio_versus_predicted_g_over_B
      - null_curve_and_non_stable_V_control_values
      - certificate_pass_rate_for_every_recovered_logarithm
      - per_cell_descent_column_verdict_with_inputs

  falsification_conditions:
    - >-
      tau-orbit concordance is not exactly 1.000 on a genuinely tau-stable V.
      The equivariance proof is wrong or the implementation is; the record is
      withdrawn and the defect is the finding.
    - >-
      The measured descent/relation ratio exceeds 10*g/B on any toy cell. Limb
      (A) is false for that base -- the individual logarithm is NOT one expected
      decomposition -- and the descent column cannot be charged at zero even for
      decomposition columns. This is the most valuable negative available.
    - >-
      |rho_1| >= 0.05 for the W-walk on the Koblitz cells. The cheap
      re-randomizer is correlated; C_rerand must be charged at fresh-scalar cost
      or the attempt count inflated by 1/(1 - rho_1), and every yield number in
      this program measured with a walk-based generator inherits that factor.
      This does not touch limb (C)'s conclusion, which survives either way,
      because C_rerand << C_att on both readings.
    - >-
      The independence anchor (ARM E) itself reports |rho_1| >= 0.05. The
      estimator is biased at this sample size; ARM B is uninterpretable and the
      sample is extended rather than the result reported.
    - >-
      The null curve and the Koblitz curve give indistinguishable W-walk
      autocorrelations. Legitimate and reported: the branching parameter is a
      property of the field and the base, not of the Koblitz structure.
    - >-
      Everything holds. Then the reachability table gains a descent column with
      COMPUTED cells carrying an explicit bound below 2^-19 for every
      decomposition column at every standardized row, an OPEN cell with a named
      missing quantity for the cover column, and a measured re-randomization
      coefficient shared with the relation phase.

  confounders:
    - >-
      THE RATIO IS UNIT-FREE BUT THE TWO PHASES MUST SHARE A COUNTER. If the
      descent arm and the relation arm are instrumented separately the ratio is
      a comparison of two counting conventions. One counter, one process, one
      instance set, enforced by the harness, or the ratio is not reported.
    - >-
      SMALL-ORBIT DEGENERACY. At n <= 23 some tau-orbits are short (fixed points
      of tau on V, elements of proper subfields), and a short orbit inflates
      concordance trivially. Orbits of size < n are reported separately and
      excluded from the headline concordance, declared before the run.
    - >-
      AUTOCORRELATION OF A RARE BINARY SERIES IS HARD TO ESTIMATE. With
      Pr[chi = 1] about 1/m! = 1/24 at m = 4, a 10^3-step series has about 40
      ones and the lag-1 estimator has substantial variance. That is exactly
      what ARM E calibrates; without ARM E no value of rho_1 may be interpreted.
    - >-
      THE W-WALK VISITS A CYCLE. R <- R + W is a walk on a cyclic group of order
      the order of W; if ord(W) < 10^3 the series repeats and the
      autocorrelation is an artefact. ord(W) is checked and required to exceed
      the series length by a factor 10.
    - >-
      g/B IS A RATIO OF TWO MODELLED QUANTITIES AT DEPLOYED ROWS. Limb (C) is
      arithmetic on l = ceil(n/m), which is a modelling choice owned elsewhere;
      a different optimal l moves B and therefore the bound. The bound is stated
      as a function of l and is recomputed, never quoted, when l changes.
    - >-
      MODEL-RELATIVITY. "Correct to within 2^-19" is correct within this
      accounting; it says nothing about a pipeline that charges phases
      differently.

  interpretation_limits:
    - >-
      NO ATTACK IS PROPOSED AND NO EXPONENT IS MOVED. The deliverable is a phase
      column split into two with different verdicts, a bound for one of them,
      and a measured coefficient shared with a neighbouring phase.
    - >-
      LIMB (D) IS A REFUSAL TO FILL A CELL, NOT A COST. Nothing here may be
      quoted as a statement about the GHS/cover descent cost on c2pnb176v1,
      c2pnb208w1, c2pnb272w1, c2pnb304w1 or c2pnb368w1. The missing quantity is
      named; a session that computes g_H at m/16 can fill it, and this record
      hands that forward explicitly.
    - >-
      The toy measurement is at n <= 41 and transfers to deployed rows only
      through the stated assumptions with the extrapolation distance shown
      (n = 41 to n = 131 is a factor 3.2 in field degree and about 2^90 in group
      order). No security statement about any named curve follows.
    - >-
      The factor bases referenced are defined by their owning questions
      (RQ-FROB-7d8dd4 for tau-stable V, RQ-QSP-f9bbdb for quasi-subfield bases).
      No new base is proposed, so no KN-OPEN-020 escape class is claimed.
    - >-
      FORWARD GUIDANCE, so this is not read as a closure of more than it closes.
      Left open: the cover-column descent on the five composite-degree rows
      (missing quantity g_H); the descent cost of any base that is NOT
      single-level, including a large-prime or two-level variant of a
      decomposition base, which would reinstate a genuine descent tree and is
      the natural successor object; and whether a re-randomizer cheaper than a
      scalar multiplication but less correlated than a single translate exists
      (an r-adding walk over several fixed adders is the obvious candidate and
      is not measured here).

  heuristic_assumptions:
    - id: H-BINSTD-DESC-1
      statement: >-
        NONE FOR THE EQUIVARIANCE. chi(tau R) = chi(R) whenever V is tau-stable
        is unconditional: tau is a group endomorphism of E, so tau applied to a
        decomposition is a decomposition, and tau(V) = V returns the summands to
        V. Recorded so the absence of a heuristic here is explicit rather than
        assumed.
      rigorous_support: >-
        Two lines, given above. Verified computationally by ARM A as a
        correctness check on the implementation, not as evidence for the
        statement.
      validation_plan: >-
        SAMPLE. Exhaustive over the whole group at n in {17, 19, 23}; 10^5
        sampled orbits at n in {29, 31, 37, 41}. COMPARISON. Predicted
        concordance exactly 1.000. TAIL CHECK. Any single violating orbit is
        inspected individually and halts the cell. TRANSFER. None needed; the
        statement is a theorem.
    - id: H-BINSTD-DESC-2
      statement: >-
        The decomposability indicator along an R <- R + W translate walk behaves
        as a stationary binary series whose lag-1 autocorrelation is O(B^m/N),
        i.e. asymptotically zero -- the walk's successive states are close enough
        to uniform that membership in a fixed m-fold sumset of density B^m/(m! N)
        is essentially independent from step to step.
      rigorous_support: >-
        The RIGOROUS ingredient: chi cannot propagate deterministically under the
        full translation action at all, by IDEA-20260806-c5d183 and KN-FIND-ffe1df
        Theorem C, since chi is neither constant nor injective; so rho_1 = 1 is
        excluded outright and the object is branching. THE GAP: nothing in that
        argument bounds rho_1 AWAY from 1 quantitatively, and a single fixed
        adder is the LEAST mixing translation walk available. The classical
        distribution theorem this imitates is the equidistribution of a
        single-generator orbit in a cyclic group against a fixed set of density
        delta, where the discrepancy is controlled by the Fourier coefficients of
        the set indicator at the generator's characters -- exactly the
        character-bias statistic IDEA-20260805-a9a95d formulates for factor
        bases, and exactly the mixing-time question IDEA-20260906-fc429b answers
        for MULTI-adder walks on a prime field. Neither supplies the binary-curve
        single-adder number, and a Frobenius-stable V is a highly structured set
        whose indicator may well have a large Fourier coefficient somewhere.
      validation_plan: >-
        SAMPLE. 10^3 seeds x 10^3 steps per cell, n in {17, 19, 23, 29, 31, 37,
        41}, m in {3, 4}, three choices of W plus one W in V.
        COMPARISON DISTRIBUTION. rho_1 against 0 with a block-bootstrap interval,
        and against the ARM E fresh-scalar anchor which measures the estimator's
        own bias at this sample size. Predicted |rho_1| = O(B^m/N), which at the
        toy cells is numerically indistinguishable from 0.
        TAIL CHECKS. The run-length distribution of consecutive chi = 1 against
        the geometric distribution implied by independence; a heavy tail is the
        signature of correlation even when rho_1 is small. Also the maximum
        number of successes in any window of 50 steps against its binomial upper
        tail.
        TRANSFER. None claimed beyond n <= 41. A measured rho_1 at n = 41 is NOT
        evidence about n = 131 or n = 163; the record says so and the deployed
        rows carry the fresh-scalar charge unless a separate argument is
        supplied.
    - id: H-BINSTD-DESC-3
      statement: >-
        At the standardized rows the relation phase needs R_need = B/g relations
        on orbit-gain rows and B otherwise, with l = ceil(n/m) the cost-optimal
        subspace dimension.
      rigorous_support: >-
        Neither limb is proved here. R_need = B/g is the orbit-collapse reading
        argued in IDEA-20260922-b19793 of this lane; l = ceil(n/m) is the
        standard Gaudry/Diem balance consumed from RQ-SDEG-001 and
        RQ-RELN-001. Both are INPUTS. The record's conclusion is robust to both:
        with R_need = B the bound in limb (C) only improves by the factor g, and
        a different l moves B but not the sign of any verdict, since the bound is
        below 2^-19 across the whole plausible range of l.
      validation_plan: >-
        SAMPLE. Recompute limb (C)'s table for l in {ceil(n/m) - 2, ..., ceil(n/m)
        + 2} and for R_need in {B/g, B}, a twenty-row sensitivity grid, at zero
        compute. COMPARISON. The verdict "charging descent at zero is correct to
        better than 2^-15" must hold across every cell of the grid, or the
        headline is restated with the grid's worst case. TAIL CHECK. The row with
        the smallest B (ECC2K-130 at the largest m) is the binding one and is
        reported explicitly. TRANSFER. This is arithmetic, not extrapolation; the
        transfer assumption is only that l and R_need lie in the swept range.
  heuristic_note: >-
    The record's two conclusions have very different epistemic status and are
    deliberately not blended. Limb (A)-(C) is a derivation plus arithmetic: it is
    conditional only on definitions and on inputs owned by other questions, and
    its honest form is "charging zero is correct to a stated relative error",
    never "descent is free". Limb (E) is a genuine measurement of an unmeasured
    coefficient with a preregistered band and a calibrated null, and its
    a-priori expectation is stated so neither outcome reads as interesting after
    the fact: a small rho_1 confirms an assumption the whole program already
    relies on silently, and a large rho_1 inflates a multiplier in several
    existing instruments. Limb (D) claims nothing at all and exists to stop the
    other limbs' zero from leaking into a cell it does not cover.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR MOVED. The phase this record charges has
      time exponent equal to that of ONE decomposition attempt divided by p,
      i.e. it is asymptotically a 1/R_need = g/B fraction of the relation phase
      and contributes nothing to the pipeline's exponent. Stated as an exponent:
      if relation collection is N^{a} then descent is N^{a - log_N(B/g)}, which
      for B = N^{1/(m+1)} is N^{a - 1/(m+1) + o(1)}.
    memory_exponent: >-
      Descent adds O(1) elements beyond the factor base and the solved
      logarithm vector already held; the phase's marginal memory exponent is 0.
      The pipeline's memory is set by the relation matrix and is charged in
      IDEA-20260922-b19793 and IDEA-20260922-2e2a58 of this lane, not here.
    best_known: >-
      Matched rho with the curve's own symmetries: for ECC2K-130, 2^60.9
      iterations estimated with negation and the Frobenius class reduction
      already applied (KN-LIT-096), under van Oorschot-Wiener parallelisation
      (KN-LIT-012). rho has NO descent phase at all, so on this column the
      incumbent is not "cheaper", it is "absent" -- which is precisely why an
      index-calculus table that prints zero here must earn the zero.
    hidden_overhead: >-
      DISCLOSED. (i) The g/B bound consumes p, C_att, l and R_need from other
      questions and is only as good as they are. (ii) The cover-column cell is
      OPEN and its true cost could be anything; nothing here bounds it. (iii)
      The re-randomization coefficient is measured at n <= 41 only. (iv) The
      whole statement is inside this accounting convention.
    tradeoff_note: >-
      There is no time-memory tradeoff inside the descent phase itself -- it is
      one attempt. The tradeoff this record exposes is between RE-RANDOMIZATION
      COST and INDEPENDENCE: one group operation per attempt at correlation
      rho_1, versus about 1.5n group operations per attempt at correlation zero,
      with effective cost per independent attempt
      min(C_W/(1 - rho_1), C_scalar). That curve is shared with relation
      collection, where it multiplies the dominant phase rather than the
      negligible one -- which is the only reason limb (E) is worth running.
      Parallelisation: the descent phase is a single attempt sequence and
      parallelises trivially across independent re-randomizations; it is never
      the Amdahl bottleneck, which is charged in IDEA-20260922-2e2a58.

  estimated_cost:
    implementation: low
    compute: low
    qualification: >-
      Stage 0 is symbolic and costs an hour. Stage 1 needs a tau-stable subspace
      constructor (the ker g(tau) construction of IDEA-20260915-8fe0ef), a
      sumset-membership routine over F_{2^n} at n <= 41 with l <= 14, and a
      binary-series autocorrelation estimator with a block bootstrap. Stage 2
      reuses whatever end-to-end toy pipeline RQ-ICPERF-94c86e builds and adds a
      descent arm on the same counter. Single machine, hours, under 100 MB.

  asymptotic_claim:
    problem: >-
      ECDLP on the standardized binary population of RQ-BINSTD-b6f698 -- the
      individual-logarithm phase of decomposition-based index calculus
    prior_best: >-
      Not applicable as an attack. The incumbent for this phase in this corpus is
      an UNSTATED ZERO; the incumbent for the problem is matched rho with the
      curve's own symmetries.
    time_exponent: >-
      Unchanged. The phase is shown to be a g/B fraction of the relation phase,
      which removes a possible error term rather than adding a speedup.
    memory_exponent: Unchanged; the phase's marginal memory is O(1).
    hidden_cofactor: >-
      The re-randomization factor 1/(1 - rho_1), currently unmeasured and set to
      1 by assumption throughout this corpus. It multiplies the relation phase,
      not just the descent phase.
    claim_kind: accounting_correction
  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES AGAINST EVERY ROW
    THIS QUESTION'S BASELINE CLAUSE ENUMERATES. As an ATTACK this record mounts
    none, so every row dominates it: matched rho with negation and the Frobenius
    class reduction on every Koblitz and subfield row (2^60.9 iterations
    estimated for ECC2K-130, KN-LIT-096), memory-free to within the
    distinguished-point table and with a van Oorschot-Wiener linear parallel
    speedup (KN-LIT-012); matched rho with negation alone on the pseudorandom
    rows; BSGS at (N^{1/2}, N^{1/2}); multi-target pooled rho at sqrt(K N); the
    completed 117.35-bit binary record as the feasibility ceiling (KN-TECH-036).
    Against every one of those, an index-calculus pipeline on these curves
    remains un-competitive at the exponent level, and this record does not change
    that by one bit -- it removes an unpriced term from one phase of the
    challenger's cost and marks another cell OPEN. On the (time, memory,
    data/queries) axes the record itself claims no point. NOT NULL ON ANY AXIS.
  sota_delta:
    time: >-
      Zero speedup on every attack axis; no exponent improved in either
      direction. Quantified deliverables instead: a bound of g/B < 2^-19 on a
      phase that was previously charged at an unstated zero at every
      standardized row; a column split producing a DIFFERENT verdict (OPEN) for
      the cover lane on five deployed curves; and a measured value for the
      re-randomization multiplier 1/(1 - rho_1) that currently sits at an
      assumed 1 in every relation-yield instrument in this program.
    memory: >-
      No change. The descent phase's marginal memory is O(1) and is shown to be
      so rather than assumed.
    data_queries: >-
      Not applicable on either side; both rho and index calculus are query-free
      here. The one query-like quantity, the number of INDEPENDENT decomposition
      attempts bought per unit of re-randomization work, is the record's
      measured object and currently has no filed value at all.
  frontier_check:
    status: pending
    note: >-
      The single-level/multi-level distinction and the fact that an individual
      logarithm over a complete smoothness base is one relation are standard in
      the index-calculus literature (RECALLED; no source opened this session).
      What was searched and not found in this corpus: any record that states the
      dichotomy for the binary standardized population, any bound on the descent
      share, and any measurement of the decomposability indicator's
      autocorrelation under a cheap re-randomizer. A Coordinator literature check
      should look for (i) explicit descent-cost accounting in the Gaudry/Diem
      binary-curve line and (ii) the covering genus actually obtainable for the
      five c2pnb curves at m/16, which would convert limb (D)'s OPEN cell.
  recommended_priority: medium
  priority_rationale: >-
    Best case is not an exponent: limbs (A)-(D) are an accounting correction and
    a refusal, and limb (E) is a constant-factor multiplier. Under
    docs/target-result-profile.md that is not target-class on its own and the
    record says so. It is nonetheless medium rather than low for three specific
    reasons, each naming the exponent-moving line it serves. First, limb (D)
    stops a zero earned on the decomposition columns from being inherited by the
    cover column on the five deployed composite-degree curves, which is the one
    place in this population where a Weil-descent exponent claim could be made
    and where an unpriced descent phase would flatter it. Second, limb (E)'s
    multiplier sits in front of the RELATION phase, which is the dominant term in
    every exponent this program is trying to move, so a measured 1/(1 - rho_1)
    materially sharpens RQ-ICPERF-94c86e's boundary table and RQ-RELN-001's
    yield instruments at near-zero cost. Third, the whole record is cheap: Stage
    0 is a page of algebra and Stage 1 is minutes per cell.
  first_deliverable: >-
    Stage 0's one-page derivation -- the tau-equivariance proof, limb (B)'s
    identity with its g = 1 baseline slice checked symbolically, and limb (C)'s
    computed table with every input traced to analysis/binstd-curve-audit/ and
    the formula printed beside each row -- plus the descent-column verdict list
    (COMPUTED with bound, or OPEN with named missing quantity) for all thirty
    standardized rows. Zero compute, no run, no status change.
  next_gate: >-
    Coordinator decision on whether Stage 1 is worth an EXP-BINSTD-* contract on
    its own or is better folded into the RQ-ICPERF-94c86e phase instrument as an
    additional arm, since it shares that instrument's counters, its frozen
    instance set and its matched rho baseline.
