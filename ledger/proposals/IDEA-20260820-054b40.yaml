idea:
  id: IDEA-20260820-054b40
  question_id: RQ-SQISIGN-001
  added: 2026-08-20
  title: Programmable-challenge fork coupling for SQIsign simulators
  class: proof-coupling audit
  claim: >-
    A simulator matching every single-transcript marginal may still fail to
    reproduce the joint law when one public commitment is coupled to two
    programmed challenges. Measuring that fork coupling may expose a proof gap
    or conversion-choice dependency. This white-box toy audit is not a
    production signing attack and makes no recovery claim.
  mechanism: >-
    In a controlled harness, freeze commitment-side public randomness and
    evaluate two independently programmed challenges. Compare the joint response
    distribution of the real construction with a simulator instrumented to share
    exactly the state authorized by the proof. Test common-ancestor depth,
    response-ideal norm relations, and verifier-fibre intersection size. The
    target is joint coupling error invisible to one-transcript tests.
  novelty_status: unverified
  status: proposed
  source_refs:
    - id: RQ-SQISIGN-001
      provenance: internal
      use: transcript/simulator question and toy ceiling
    - id: GOAL-SQISIGN-001
      provenance: internal
      use: goal and oracle scope
    - id: GOAL-SSI-001
      provenance: internal
      use: ownership boundary for hard-problem conclusions
    - id: KN-TECH-057
      provenance: internal
      use: fully charged baseline rows
    - id: KN-TECH-058
      provenance: internal
      use: unconditional and heuristic-conditional Fp2 caveats
    - id: EXP-SSI-7c41d9
      provenance: internal
      use: three-replicate true-simulator control precedent; unarchived
    - id: KN-LIT-1248
      provenance: kb
      use: unreviewed ideal-to-isogeny pointer only
  predictions:
    - Correctly shared genuine-simulator forks match independent null replicates on all preregistered joint invariants.
    - A planted control that independently resamples one conversion choice preserves both marginals but is detected by a joint test.
    - Any real/sim discrepancy persists after conditioning on commitment strata and challenge-weight bins.
  controls:
    true_simulator_null: genuine simulator run twice with only proof-authorized public state shared
    planted_positive: marginal-preserving wrong coupling from independently resampling one conversion choice
    nearby_object: two independent commitments matched on public strata, where no fork relation should remain
    boundary: white-box programmable-challenge harness; not an available signing-oracle query
  falsification_conditions:
    - The marginal-preserving planted coupling is not detected at preregistered power.
    - The correctly shared genuine-simulator null is rejected.
    - Every preregistered real/sim joint invariant remains inside the null confidence region.
  confounders:
    - unintended shared pseudorandom state
    - challenge collision or unequal challenge strata
    - commitment bytes that are not actually identical
    - conversion instrumentation changing the sampled law
  interpretation_limits:
    - A positive result is confined to the white-box joint law and is not an online attack.
    - A null result does not cover ordinary transcript leakage outside fork couplings.
    - No secret ideal is recovered unless a later task outputs and certifies one.
  heuristic_assumptions:
    - H-FORK-1: the proof specifies an implementable boundary between shared public state and fresh private randomness.
    - H-FORK-2: selected joint invariants separate the planted wrong coupling from the correct coupling.
  target_complexity:
    objective: bound joint fork-coupling distance; no decoder, recovery, or attack exponent
    unconditional_fp2: time p^(1/2)*(log p)^O(1), polynomial memory
    conditional_fp2: p^(1/3+o(1)) time and memory under Heuristic 1, superpolynomial hidden overhead
    conditional_fp: preserve as a distinct KN-TECH-057 cost row
    success_accounting: charge two responses per fork, failed reuse, strata, and inverse detection power
  cost_model:
    time: O(N*C_fork + N*k) protocol work and invariant evaluation
    memory: O(N) paired transcripts or O(k*S) streaming summaries
    data_or_queries: N controlled forks and 2N responses in each of real, null, and positive suites
    preprocessing: instrument commitment freezing and prove the allowed simulator sharing rule
    success_retries: charge unusable forks, collisions, and at least three seeded replications
    verification: replay both verifier paths, compare commitment bytes, and audit state-sharing logs
  proof_search_map:
    exact_baseline_reproduction: reproduce single-transcript null and KN-TECH-057 full-cost rows first
    observation_collision_search: construct couplings with identical marginals and distinct joint invariants
    quantifier_order: freeze sharing rule and invariants before programming challenge pairs
    method_ceiling: a joint distinguisher does not imply an online oracle attack or recovered ideal
    nearby_object_control: independent matched commitments measure dependence from public strata alone
  nearest_neighbors:
    - id: IDEA-20260813-93a735
      discriminator: studies a marginal-preserving two-challenge coupling on one commitment rather than q ordinary transcripts and posterior entropy
    - id: IDEA-20260813-87106b
      discriminator: tests joint fork response law rather than a verifier accept-fibre marginal
  dominated_by: n/a (no result claimed)
  sota_delta:
    time_exponent: 0
    memory_exponent: 0
    data_or_queries: two responses per controlled fork plus two matched control suites
    quantitative_statement: no SOTA delta; this is a proof-audit discriminator
  recommended_priority: high
  recommended_cost: medium due to white-box state-sharing instrumentation
  recommended_prior: 0.30 probability that the joint audit finds a marginal-invisible implementation or proof mismatch
  recommended_provenance: idea-generator judgement; unverified

