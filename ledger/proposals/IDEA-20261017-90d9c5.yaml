    rows_checked: [KR-RHO-7d93f6, KR-RHO-6239aa, KR-IC-5931ee, KR-IC-955fd6, KR-IC-f3da82, KR-RHO-13bf67, KR-RHO-cd0049, KR-RHO-1c2928]
