  dominated_by: >-
    Pollard rho: time N^(1/2) < N^(h/(2h-1)) and memory O(1) < N^(1/(2h-1))
    (KR-RHO-6239aa, KR-RHO-7d93f6, Yun 2015 for the n-DL floor sqrt(nN))
