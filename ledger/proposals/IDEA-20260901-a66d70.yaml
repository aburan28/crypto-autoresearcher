idea:
  id: IDEA-20260901-a66d70
  question_id: RQ-ECDLP-160d89
  goal_id: null
  added: '2026-09-01'
  title: >-
    ORDER-JOIN RIGIDITY AND THE SFT CASCADE: the one output-sensitive join the
    corpus's cost model cannot see is the sorted two-pointer scan, and on a
    prime-order group a sound two-pointer key forces its rank map to be an
    approximate homomorphism into R/Z, which by a Fourier-coefficient argument
    plus the Akavia-Goldwasser-Safra sparse-Fourier learner yields a
    polynomial-time discrete logarithm -- so the certificate is satisfiable by
    an order key only if the ECDLP is polynomial-time, and the conditional
    exponent of that branch is 0, not 1/3
  class: mechanism

  claim: >-
    Setting. G = <P> of prime order N, Q = [x]P. An ORDER KEY is a map
    nu from G to Z/N (ties allowed), computable per point in (log N)^{O(1)}
    field operations, fixed before the lists are drawn and independent of Q.
    The TWO-POINTER JOIN with windows (J, J') of lengths w and w' (cyclic
    intervals of Z/N) sorts both source-labelled lists by nu and emits every
    pair (R, S) with nu(R) + nu(S) in J', in O(L log L + output) operations.
    Its ACCEPTED SET is D = nu^{-1}(J), of size sigma, and it is
    (1-eta)-SOUND if at least a (1-eta) fraction of emitted pairs satisfy
    R + S in D. This join class is exactly the class the fibre-system cost
    model of IDEA-20260829-390ccc (assumption A4, scan charged as
    |A_c| + |B_c| per rectangle) cannot represent, because a sorted range
    query touches log L elements per row whatever the fibre sizes.

    (T1) EXACT ORDER RIGIDITY (derivation tier, elementary). Let nu be
    injective (a cyclic order on G) and let D be any subset with
    2 <= |D| <= (N-1)/2 such that EVERY translate D - T, T in G, is a
    nu-interval. Then nu = plus-or-minus a*log_P + c for some a != 0, and D
    is a log-interval. PROOF SKETCH. Translates are pairwise distinct (prime
    order: D - T = D - T' forces D + (T' - T) = D, and T' - T generates G, so
    D is trivial). There are exactly N cyclic intervals of width w = |D|, so
    the N translates are all of them. Translation preserves intersection
    sizes; for w <= (N-1)/2 two distinct width-w intervals meet in w - 1
    points iff they are shifts by one step; so every translation induces an
    automorphism of the N-cycle of width-w intervals, embedding G into the
    dihedral group D_N. For odd prime N the only order-N subgroup of D_N is
    the rotations, so the start-position map s(T) = start(D - T) satisfies
    s(T + T') = s(T) + rho(T') with rho an injective homomorphism G -> Z/N,
    i.e. rho = a*log_P. The width-w interval system determines the cyclic
    order, so nu is a log order. No hypothesis on how nu is computed is used.

    (T2) SOUNDNESS OF A TWO-POINTER JOIN IS APPROXIMATE ADDITIVITY. Suppose
    the join is (1-eta)-sound with w' >= (1-eta')w. Then for all but a
    3*delta fraction of pairs (R, R'), with delta = O(eta + eta'),
        || f(R + R') - f(R) - f(R') ||_{R/Z} <= C*(eta + eta')*w/N,
    where f = nu/N maps G into R/Z. PROOF SKETCH. Soundness on the row of R
    says the row-window nu^{-1}(J' - nu(R)) lies inside D - R up to an
    eta*w' exceptional set; equal sizes up to (1-eta') then force the
    symmetric difference of D - R and that interval to be O((eta+eta')w),
    for most R. The interval approximating D - R has START j' - nu(R), an
    exact affine function of nu(R). Translating by -R' and comparing with the
    interval approximating D - (R + R') gives two width-w intervals whose
    symmetric difference is O((eta+eta')w), hence whose starts differ by
    O((eta+eta')w): nu(R + R') = nu(R) + nu(R') + O((eta+eta')w) mod N. At
    w = N^{2/3} and constant eta this is additive precision N^{-1/3+o(1)}.

    (T3) THE CASCADE. Let g = e(f) = exp(2*pi*i*f). Then
    E_{R,R'} g(R+R') conj(g(R)) conj(g(R')) = sum_xi ghat(xi)|ghat(xi)|^2,
    whose real part is at least 1 - gamma with gamma = O(delta + w/N) by T2;
    Parseval then gives a frequency xi_0 with Re ghat(xi_0) >= 1 - gamma,
    i.e. e(f) has a (1-gamma)-heavy Fourier coefficient at the character
    R -> e(xi_0*log_P(R)/N). Consequently the function t -> e(f([t]P)) on
    Z/N has a heavy coefficient at xi_0, and t -> e(f([t]Q)) has one at
    xi_0*x mod N. The Akavia-Goldwasser-Safra sparse Fourier transform
    (recalled, below) recovers a tau-heavy coefficient of a function on Z/N
    from poly(log N, 1/tau) queries; two runs give xi_0 and xi_0*x, hence x.
    THEREFORE: an order key satisfying the certificate's soundness row at
    constant eta below an absolute threshold yields a discrete-logarithm
    algorithm costing (log N)^{O(1)} evaluations of nu. The conditional
    exponent of the four-list route through such a key is 0.

    (T4) WHAT THIS DOES NOT SAY. It does not say no sub-rho four-list route
    exists. It says the ORDER-JOIN branch, which is the only join primitive
    that reaches gamma = 1 without a hash quotient, cannot be occupied at
    exponent 1/3 without being occupied at exponent 0, so any surviving
    certificate must use a join that is neither a hash join (390ccc) nor a
    range-query join (this record) nor a polynomial-relation join
    (IDEA-20260901-730f23).

  mechanism: >-
    THE TRACKED OBJECT is the RANK of a point in a public cyclic order,
    coarsened to a window of width w: the sorted position of R, not R. What
    the projection discards is the fine position within a window; what it
    retains is which window. The discard is compatible with the join's
    operation (window arithmetic) exactly when nu is approximately additive,
    which is why additivity, not concentration, is the load-bearing quantity.

    WHY THE ARGUMENT HAS THE SHAPE IT HAS. Every closure record in this lane
    ends with the slogan 'the key is a coarse discrete logarithm'. That
    slogan is only a negative if computing a coarse logarithm is expensive,
    which IDEA-20260829-390ccc carries as its heuristic H3 with the
    validation route 'literature check against the hidden number problem'.
    This record turns H3 into a theorem-shaped statement by observing that a
    coarse logarithm available on EVERY point is not advice about x (the
    object IDEA-20260829-7169d6 prices) but an oracle, and an oracle whose
    output is a heavy-Fourier-coefficient function of the logarithm is
    exactly what the SFT and hidden-number literature converts into a full
    logarithm in polynomial time.

    STAGE 0 (zero compute, HARD GATE). Write T1 with the dihedral step in
    full and run it against the object where its conclusion MUST fail: the
    composite cyclic group Z/(d*e) with D a coset of the order-e subgroup and
    nu the 'sort by coset, then arbitrarily within the coset' order. There
    every translate of D is a nu-interval, the translates are NOT pairwise
    distinct, the dihedral embedding is not injective, and nu is NOT a log
    order. If the derivation cannot see that it fails there, it is wrong.
    Second control: F_2^{3m} with the lexicographic order and D a prefix
    subspace; translates (XOR-shifts) of D are dyadic intervals, no log
    order exists, and the theorem must be silent because the group is not
    of prime order. Third, the positive control: Z/N with nu the identity,
    where T1 returns the identity and the cascade is vacuous because the
    logarithm is already known.

    STAGE 1 (symbolic). Write T2 with explicit constants, tracking the
    three approximation steps (soundness on a row, size matching, translate
    comparison) and the union bound that produces the 3*delta fraction.
    State the threshold on eta + eta' below which T3's real part exceeds
    zero, and state honestly that above it the record has no conclusion.

    STAGE 2 (symbolic). Write T3 as three lemmas: (i) the Fourier identity
    and the Parseval extraction of xi_0; (ii) transfer of the heavy
    coefficient from G to the functions t -> e(f([t]P)) and t -> e(f([t]Q))
    on Z/N; (iii) the two SFT calls and the division xi_0*x / xi_0. Lemma
    (iii) depends on a recalled external theorem and is the record's only
    external dependence; it is marked as such.

    STAGE 3 (symbolic, the 1-percent regime). Record what happens when
    coverage is a constant bounded away from 1 rather than near 1: T2's
    size-matching step fails and the record only has 'additivity on a dense
    set of pairs'. The known route from there (Balog-Szemeredi-Gowers plus
    a Freiman-type theorem) yields agreement with an affine function of the
    logarithm on a dense subset, i.e. a noisy coarse-log oracle with unknown
    error positions; whether the hidden-number-with-errors literature closes
    that gap in polynomial time is recorded as heuristic H2, not claimed.

