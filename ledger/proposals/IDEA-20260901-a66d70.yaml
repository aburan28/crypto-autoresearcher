  assumptions:
    - >-
      A1. N prime, G = <P> the full prime-order subgroup; T1 uses that every
      nonzero element generates G and that N is odd.
    - >-
      A2. nu is fixed before the lists are sampled and does not read Q;
      data-dependent orders are outside every statement here.
    - >-
      A3. Lists are uniform independent samples of G via source labels
      (a, b); soundness measured on sampled pairs equals population soundness
      up to concentration (H1).
    - >-
      A4. Emitted count Theta(L) requires w' = Theta(N/L) = Theta(N^{2/3});
      the record's constants are stated at w' >= (1 - eta')w and the regime
      w' << w is deferred to Stage 3.
    - >-
      A5. No exact nontrivial quotient of G is assumed; T1 proves the interval
      system IS the quotient by nothing, i.e. the log coordinate.

  proof_search_map:
    bottleneck: >-
      Converting the lane's slogan 'the key is a coarse discrete logarithm'
      into a cost. Without T3 the slogan is a heuristic (390ccc H3); with it
      the order-join branch has conditional exponent 0, which is the
      decision-changing number.
    baseline_embedding:
      parameter_slice: >-
        Z/N with nu the identity and D a genuine interval: the log-interval
        positive control of 390ccc and 7169d6. T1 returns nu = identity, T2
        holds with zero defect, and T3 is vacuous because log is known.
      reproduction_check: >-
        Symbolic: with nu = id, the start map is s(T) = j - T and rho(T') =
        -T', an injective homomorphism, as T1 predicts. Fixture at N = 23:
        complete enumeration of the 23 width-5 intervals and of the 23
        translates of one of them must coincide as sets, and translation by
        each T must act as a rotation of the interval cycle by exactly -T.
    observation_collision:
      observable: >-
        Emitted pair count Theta(L) from a sorted scan with window w'.
      distinct_preimage_search: >-
        Two objects share it and lead to opposite conclusions: (a) the log
        order on Z/N, where the scan is sound (eta = 0); (b) the x-coordinate
        integer order of K-EC-XINTERVAL-1 used as a two-pointer key, where
        the scan emits exactly as many pairs but is sound only at rate
        w/N = 1/L, i.e. it is the independent pair coin of JPR-REV-4 with
        expected time N. The separating condition is soundness, which T2
        identifies with the additivity defect of nu.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Encode the join's soundness row as an approximate-homomorphism
          condition on f = nu/N, then as a heavy Fourier coefficient of
          e(f), then as an SFT instance. Interface obligations: encoding
          (T2), completeness (every sound scan gives the condition),
          soundness (a heavy coefficient gives x), transfer (from G to Z/N
          via t -> [t]P and t -> [t]Q), cost (poly(log N) SFT queries times
          the cost of nu).
        predicted_gain: >-
          Moves the branch's conditional exponent from 1/3 to 0, i.e. shows
          the certificate row is satisfiable only by a polynomial-time break.
      - transform: observable_fiber
        proposed_object: >-
          Hold the emitted count fixed and vary the order: log order, x
          order, and planted corrupted log orders with a declared corruption
          fraction. The intrinsic invariant distinguishing them is the
          Fourier mass of e(nu/N) at its heaviest frequency.
        predicted_gain: >-
          A single computable statistic that predicts, for any candidate
          order key, whether its scan can be sound; zero compute here, toy
          computable later.
    quantifier_order: >-
      T1: FOR ALL odd primes N, FOR ALL injective nu, FOR ALL D with
      2 <= |D| <= (N-1)/2, IF every translate of D is a nu-interval THEN
      THERE EXIST a, c with nu = plus-or-minus a*log_P + c. T3: FOR ALL prime
      N, FOR ALL efficiently computable nu fixed before the lists and
      independent of Q, FOR ALL windows with w' >= (1-eta')w, IF the
      two-pointer join is (1-eta)-sound with eta + eta' below the absolute
      threshold of Stage 1, THEN THERE EXISTS an algorithm, depending on nu
      but not on Q, computing log_P(Q) for EVERY Q with (log N)^{O(1)}
      evaluations of nu. The witness may depend on nu; it may not depend on
      Q or on the list randomness. NOT CLAIMED: anything for eta above the
      threshold, or for orders chosen after seeing Q.
    method_ceiling:
      strongest_certifiable_claim: >-
        A conditional impossibility for ONE join primitive (sorted range
        scan with a predeclared order), conditional on ECDLP not being
        polynomial-time. It can NEVER certify anything about hash joins,
        polynomial-relation joins, data-dependent orders, or joins tolerating
        constant coverage loss (Stage 3), and it is not an ECDLP lower bound.
      nearby_object_control: >-
        Where the conclusion FAILS: F_2^{3m} with the lexicographic order and
        a prefix-subspace accepted set. The scan is sound and complete, no
        log order exists, and there is no logarithm to recover; T1's
        distinct-translates step fails because the stabilizer of D is D
        itself, and T2's additivity is false because XOR is not addition of
        ranks. A version of this argument that closed XOR would prove too
        much. Second control: composite Z/(d*e) with coset intervals, where
        T1's dihedral embedding is not injective.
    proof_obligations:
      - claim: Translates of a nontrivial D in a prime-order group are pairwise distinct.
        responsibility: correctness
      - claim: >-
          For w <= (N-1)/2, distinct width-w cyclic intervals meet in w-1
          points iff they are adjacent, so translation acts on the interval
          cycle by graph automorphisms.
        responsibility: correctness
      - claim: >-
          G of odd prime order embeds in D_N only as rotations; hence the
          start map is affine in log_P.
        responsibility: strictness
      - claim: >-
          Soundness plus size matching gives approximate additivity of nu
          with defect O((eta+eta')w) on a 1 - 3*delta fraction of pairs.
        responsibility: correctness
      - claim: >-
          The Fourier identity sum_xi ghat(xi)|ghat(xi)|^2 = E g(x+y)conj(g(x))conj(g(y))
          and the Parseval extraction of a heavy frequency.
        responsibility: correctness
      - claim: >-
          Heavy coefficient of e(f) on G transfers to heavy coefficients of
          t -> e(f([t]P)) and t -> e(f([t]Q)) on Z/N at xi_0 and xi_0*x.
        responsibility: interface
      - claim: >-
          AGS SFT recovers a tau-heavy coefficient in poly(log N, 1/tau)
          queries in the query model this record uses.
        responsibility: feasibility
      - claim: >-
          Total cost is (log N)^{O(1)} evaluations of nu plus poly(log N)
          group operations; memory poly(log N).
        responsibility: runtime
      - claim: >-
          The theorem is silent on F_2^n and on composite N, and the
          log-order control is reproduced exactly.
        responsibility: scope
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: >-
      The window index floor(nu(R)*K/N) of a point in a public cyclic order,
      K = N/w windows.
    lossiness: >-
      Genuinely lossy: log2(w) bits of the log2(N)-bit rank are discarded.
      The discard is compatible with the join's operation (window
      arithmetic with carries) exactly to the extent nu is approximately
      additive; T2 shows soundness of the scan is the same thing as that
      compatibility, so the lossy-projection test of
      docs/inventor-protocol.md section 2 is not assumed but measured by eta.
    propagation: >-
      Under the group law: approximately deterministic with defect
      O((eta+eta')w/N) if and only if the scan is sound (T2). Under the
      translation action on interval systems: exact (T1). The object
      therefore passes the test only for log orders, which is the content.
    survival_score: >-
      For a log order it survives every level of a k-tree with one bit of
      carry per level; for any other order it dies at the first join, and
      the death is certified by the Fourier statistic rather than measured.

  null_object_control: >-
    NULL-1 (blocking, zero compute): a uniformly random cyclic order on G.
    T2's additivity holds with probability w/N per pair, so the Fourier
    statistic of e(nu/N) is O(N^{-1/2}) at every frequency and the scan is
    sound at rate 1/L; this is the JPR-REV-4 pair coin at expected time N
    and must be reported as such. NULL-2: the x-coordinate integer order,
    same prediction, which is the record's statement that K-EC-XINTERVAL-1
    cannot be two-pointer joined. POSITIVE CONTROL (blocking): Z/N with the
    identity order, eta = 0, Fourier mass 1 at frequency 1. PLANTED
    CONTROL (FUTURE, separate authority): the log order with a declared
    fraction q of points re-ranked at random; predicted heaviest Fourier
    mass (1 - q)^2 and SFT recovery down to a q threshold that the record
    predicts in advance from tau. DECAY PARAMETER: q. A recovery rate that
    does not fall as q rises is an artifact.

  discriminated_from:
    - >-
      IDEA-20260829-390ccc. NEAREST RECORD. It closes sound BALANCED
      RECTANGLE covers with an O(L polylog) scan charged per fibre, via
      Cauchy-Davenport and Vosper, and lists non-rectangle joins as open.
      EXACT DELTA: (i) join class -- a sorted range scan costs L log L
      regardless of fibre size and is outside A4, so 390ccc is silent on it
      and this record closes it; (ii) tool -- dihedral rigidity of interval
      systems plus Fourier stability, not sumset growth; (iii) conclusion
      strength -- 390ccc ends at 'the key is a coarse log' and carries the
      cost of that as heuristic H3; this record ends at 'the key yields a
      polynomial-time logarithm' via T3, upgrading H3 from heuristic to
      conditional theorem. The two agree at the corner and neither implies
      the other.
    - >-
      IDEA-20260829-7169d6. It prices advice about ONE scalar (top bits of
      x) at exponent (1-mu)/2 and ceilings the guessed variant at 1/2. This
      record prices a KEY on EVERY point, which is strictly more, and finds
      the price is polynomial time, which is strictly more too. Quantifier
      delta: 'exists advice about x' versus 'exists nu for all R'.
    - >-
      IDEA-20260807-df906f and IDEA-20260901-863e36. Both classify
      translation-compatible PARTITIONS. T1 classifies translation-compatible
      INTERVAL SYSTEMS, an order-theoretic object with no partition analogue;
      the proof step 'the group embeds in the automorphism group of the
      structure' is shared and is acknowledged.
    - >-
      IDEA-20260823-cab6c6 (K-EC-XINTERVAL-1). That record freezes the x
      interval as a BUCKET key with no enumerator. This record explains why
      no two-pointer enumerator exists for it (NULL-2) and gives the
      statistic that would have predicted that at zero compute.
    - >-
      IDEA-20260901-133fd3 (RQ-ECDLP-002). Its balance law prices
      re-randomisation into promise classes; it does not concern keys on
      points or joins. Consistent with this record: an order key that
      worked would make R(W) = (log N)^{O(1)}/sqrt(N), far below 1, i.e. a
      polynomial-time break, which is what T3 says.

  predictions:
    - metric: >-
        M1 -- outcome of the Stage 0 controls: T1 on Z/(d*e) with coset
        intervals, on F_2^{3m} with the lex order, and on Z/N with the
