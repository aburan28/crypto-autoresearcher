      direction: different
      minimum_effect: >-
        FORCED: T1's hypothesis (pairwise distinct translates) must FAIL on
        the composite and XOR objects and its conclusion must HOLD on Z/N
        with rho = -id. Any other outcome voids the record.
    - metric: >-
        M2 -- the absolute threshold on eta + eta' below which T3's Fourier
        real part is positive, derived with explicit constants
      direction: different
      minimum_effect: >-
        A number strictly between 0 and 1/6; the record predicts on the
        order of 1/20 from the union bound 3*delta plus cos(2*pi*C*eta) and
        pre-registers that any derivation giving a threshold above 1/6 has
        dropped a term.
    - metric: >-
        M3 -- the exponent of the four-list route through a sound order
        key, after T3
      direction: lower
      minimum_effect: >-
