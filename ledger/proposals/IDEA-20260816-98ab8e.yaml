idea:
  id: IDEA-20260816-98ab8e
  question_id: RQ-FBG-001
  added: '2026-08-16'
  title: 'Reproduce the bounded-degree factor-base obstruction as a measured curve rather than a theorem
    citation: build factor bases as image loci of plane curves of increasing degree, and test whether
    measured coverage genericity tracks the intersection degree the derivation says controls it'
  class: theory
  claim: '(A) THE AUDIT THIS SKIPS OTHERWISE. The inventor protocol''s proof-architecture section
    requires baseline reproduction before expensive work: name the exact bottleneck and the parameter
    slice that reproduces the best-known baseline, and verify the reproduction symbolically or against
    a frozen fixture, because a curve that merely looks similar is not an embedding. This program
    owns a scoped bounded-degree obstruction for algebraically described factor bases whose stated
    control parameter is an intersection degree Delta bounding the base size via Bezout. That obstruction
    has never been reproduced as a measurement. (B) THE CLAIM. If Delta really is the control parameter,
    then factor bases built as the curve-points whose x lies in the image locus of a plane polynomial
    of degree d should behave, on the coverage channel, in a way that depends on d only through the
    resulting realised base size and its intersection degree - and NOT through any additional structure
    the locus carries. Concretely the claim is a NULL-SHAPED prediction with teeth: measured coverage
    excess against a matched random base of the same realised size should be flat in d, within intervals,
    across a ladder of degrees d equal to 1 through 8, because the derivation''s content is that such
    loci are counted, not structured. A measured deviation from flatness would be a falsifier of the
    reading that Delta is the whole story, and would locate exactly where the derivation''s hypotheses
    stop describing the object. (C) WHY A FLAT RESULT IS THE VALUABLE ONE HERE. Most measurements
    in this bucket hope for structure. This one predicts its absence and is designed so that absence
    is informative: a flat excess curve across eight degrees, with a stated detection floor, is a
    reproduction of the obstruction in the coverage coordinate and is quotable by any later agent
    proposing a low-degree algebraic base. That converts a citation into a number with error bars,
    which the closure standard requires. (D) WHAT IS NOT CLAIMED. No attack, no break, no speedup,
    no security consequence. It is NOT claimed that the bounded-degree obstruction is true, false,
    or extended - the contract measures one consequence of one reading of it in one coordinate. It
    is NOT claimed that high-degree loci are covered; degrees above the tested ladder are outside
    scope, and the derivation''s own escape list names high-degree interpolation descriptions as open.
    It is NOT claimed that flatness in coverage implies flatness in any other channel - relation rate,
    decomposition cost and linear algebra are untouched. It is NOT a proof of anything and does not
    close KN-OPEN-020.'
  mechanism: 'STAGE 1. For each degree d in 1 through 8, fix a plane polynomial f_d of that degree
    over the prime field with coefficients drawn under a recorded seed, and define the x-locus L_d
    as the image set of f_d evaluated over the field, or equivalently the set of x with f_d(x, y)
    equal to 0 for some y, depending on the declared locus form. Compute the realised base as the
    curve points whose x lies in L_d, recording the realised size and the measured intersection count.
    STAGE 2. Because realised sizes differ across d, trim or extend each to a common target size B
    under a declared rule, and record the trimming. Matched random bases are drawn at the same realised
    size in the same invocation. STAGE 3. Measure exact coverage over the complete target space for
    every locus base and its matched null, forming the excess ratio with bootstrap intervals over
    seeds and curves and a permutation band. STAGE 4. Fit excess against d and test flatness: the
    slope against d with its interval, plus a per-degree comparison against the null band. STAGE 5.
    Independently record, per d, the measured base size before trimming and compare it with the Bezout-style
    bound the derivation predicts, which is the derivation''s own quantitative content and the part
    most directly reproducible. STAGE 6. Refutation route. A nonzero slope in d, or any single degree
    outside its band after correction, falsifies flatness and locates the degree at which the counting
    reading stops. A size bound violated by measurement falsifies the reproduction outright and is
    the more serious finding of the two.'
  novelty_status: unverified
  novelty_screen:
    method: Read KN-OPEN-020 in full, including its statement that the bounded-degree theorem bounds
      the factor base by 3d or by Delta via Bezout and that tuple-image counting bounds the reachable
      target set. Read docs/inventor-protocol.md section 8 audits 1 through 4. Read RQ-FBG-001, H-FBG-001,
      EV-FBG-001. Greps over ledger/proposals and ledger/hypotheses for 'bounded degree', 'Bezout',
      'intersection degree', 'image locus', 'plane curve', 'baseline reproduction'. Read the head
      of IDEA-20260801-021.
    results: IDEA-20260801-021 and its artifact own the bounded-degree factor-base theorem and its
      algebraic-degree generalisation with explicit finite intersection degree Delta; KN-OPEN-020
      cites both and states the universal question remains open. The derivation exists as a derivation-level
      obstruction. I found no record that measures a consequence of it, and no record that builds
      factor bases as image loci across a degree ladder. EV-FBG-001's six geometries include a small-height
      family and interval families but none defined by a polynomial locus of tunable degree. The blacklist
      places Semaev summation-polynomial degree-of-regularity ladders off limits; that is a solving-degree
      object in the DREG lane and is unrelated to a locus-degree ladder on the factor base itself,
      which is what this contract sweeps.
    verdict: 'UNVERIFIED. Nothing is asserted about external literature; Bezout bounds and image loci
      are classical and no publication claim is made. What is claimed new here is running the program''s
      own scoped obstruction as a baseline-reproduction audit in the coverage coordinate, with a flat-curve
      prediction and a stated detection floor, so the obstruction becomes a measured number rather
      than a citation. Assembled from known parts: the derivation and its Delta parameter, already
      recorded; the exact coverage pipeline and matched null from the frozen battery; the section
      8 audit discipline from the inventor protocol.'
  object_first_candidate:
    tracked_object: THE INTERSECTION PROFILE of the defining locus with the curve - the multiset recording,
      for each x admitted by the locus, how many curve points lie above it - carried alongside the
      locus degree d through the coverage computation.
    lossiness: Lossy. The intersection profile discards the polynomial's coefficients, the geometry
      of the locus in the plane, the field's multiplicative structure and the identity of the admitted
      points, retaining only how many points the locus contributes at each admitted abscissa. That
      is discarded compatibly with the target operation, because the operation is forming size-m multisets
      and summing them, which depends on the base only as a set of group elements; the profile determines
      the realised size exactly and determines the negation structure exactly, which are the two quantities
      the counting identity and the matched-null definition need. Very many distinct polynomials share
      a profile. What the projection cannot see, and the contract says so, is whether the admitted
      points are arranged in the group in any special way - and that is precisely what the coverage
      measurement tests for, so the projection and the measurement are complementary rather than redundant.
    propagation: One step of the target operation - admitting one more abscissa from the locus - adds
      either 0, 1 or 2 points to the base according to whether the curve equation has no root, a double
      root or two roots above that x. So the profile propagates as a deterministic three-way branch
      driven by the quadratic character of the curve's right-hand side at that abscissa, and the accumulated
      realised size is a sum of independent-looking increments whose expectation is 1 per admitted
      abscissa. That expectation is the derivation's counting content in its simplest form, and deviation
      from it across the degree ladder is directly measurable.
    survival_score: 'The profile survives as an explanatory object across the whole tested degree
      ladder, since realised size is exactly determined by it at every d. It dissolves as a PREDICTOR
      of coverage the moment coverage excess departs from flatness - at that point the profile has
      been shown insufficient and some property it discarded is doing work. Concretely: the object
      is expected to explain realised size at all eight degrees and to explain coverage excess at
      all eight, and the measurement is designed to locate the degree, if any, where the second explanation
      fails while the first still holds.'
  null_object_control: 'The null object is a MATCHED RANDOM BASE at the same realised size, drawn
    in the same invocation and measured by the identical exact counter - the mandatory null for this
    bucket. A second null is required and is the sharper one: a RANDOM SET OF ABSCISSAE of the same
    cardinality as the locus, pushed through the identical point-admission step so it acquires the
    identical three-way branch structure and the identical negation closure, but carrying no polynomial
    structure at all. For the degree ladder to mean anything, this abscissa-null must show coverage
    excess of 1.00 within intervals at every ladder rung, and its realised size distribution must
    match the locus bases'' within intervals. If the abscissa-null itself shows excess, the admission
    step - not the polynomial - is producing the signal, and the ladder measures nothing about degree.
    A third control is the degenerate locus at d equal to 0, the whole x-line, which must reproduce
    the whole-curve base exactly.'
  discriminated_from:
  - 'IDEA-20260801-021 and its bounded-degree factor-base theorem artifact: that record derives the
    obstruction. This contract does not re-derive it, adds no mathematical strength, and instead measures
    one consequence of one reading of it, which the inventor protocol''s audit 1 requires and which
    has not been done.'
  - 'KN-OPEN-020: states the universal question. This contract explicitly declines to address the
    universal statement and confines itself to a degree ladder from 1 to 8.'
  - 'The Semaev summation-polynomial degree-of-regularity ladders owned by the DREG lane and named
    on the blacklist: those sweep the degree of the polynomial system being solved and measure solving
    degree. This sweeps the degree of the locus defining the factor base and measures coverage; no
    polynomial system is solved and no solving degree is computed.'
  - 'H-FBG-001 and EV-FBG-001: six named geometries with a growth-in-N clause on yield ratio. This
    sweeps locus degree at fixed N and measures coverage, and its headline prediction is flatness
    rather than growth.'
  - 'IDEA-20260815-c13ef4: designed versus sampled bases, with no degree parameter and no connection
    to the derivation being reproduced.'
  assumptions:
  - The locus form is declared before any run - image set of a univariate map, or projection of a
    plane curve - and the two are not mixed, since they give different profiles at the same nominal
    degree.
  - Realised base sizes at different degrees can be brought to a common target by a declared trimming
    rule without destroying the property under test; the abscissa-null undergoes the identical trimming.
  - Coverage is the free coordinate, mean yield being size-forced by the counting identity, so an
    excess ratio is meaningful.
  - Bezout-style size bounds apply in the form the derivation states them at these degrees and field
    sizes; a measured violation is treated as a reproduction failure and reported, not explained away.
  predictions:
  - metric: slope of coverage excess against locus degree d over the ladder 1 to 8
    direction: different
    minimum_effect: 'forced value: slope interval must contain 0, that is flatness within intervals;
      a slope interval excluding 0 falsifies the counting reading and is the falsifier this contract
      is built to find'
  - metric: coverage excess of the abscissa-null at every ladder rung
    direction: different
    minimum_effect: 'forced value: 1.00 within intervals at every rung; any excess voids the ladder'
  - metric: realised base size before trimming, against the derivation's stated Bezout-style bound
    direction: lower
    minimum_effect: 'forced value: measured size must not exceed the stated bound at any degree; a
      single violation is a reproduction failure and halts the run'
  - metric: mean number of curve points admitted per locus abscissa
    direction: different
    minimum_effect: 1.0
  minimal_test:
    design: 'One curve, one size, eight degrees, three arms, one invocation. Take a toy prime-order
      curve with N near 2^14, declare the locus form, and for d in 1 through 8 draw a polynomial of
      degree d under a recorded seed, form the locus, admit the curve points above it, record realised
      size and the measured Bezout comparison, then trim to a common B. In the same invocation build
      the abscissa-null at matched cardinality through the identical admission and trimming path,
      and draw the matched random base at the same realised size. Measure exact coverage over the
      complete target space for all three arms at all eight degrees. The discriminating output is
      one plot with three lines: locus excess against d, abscissa-null excess against d, and the interval
      half-width. Flatness of the first within the third, with the second pinned at 1.00, is the reproduction.
      Any Bezout violation halts the run before coverage is even computed, since a size bound failure
      invalidates the reproduction regardless of what coverage does. Cost is eight degrees times three
      arms times one exact count, minutes at this size.'
    controls:
    - Matched random base at the same realised size, drawn and measured in the same invocation.
    - 'Abscissa-null: a random set of abscissae of matched cardinality pushed through the identical
      admission and trimming path.'
    - Degenerate d equal to 0 locus, the whole x-line, which must reproduce the whole-curve base exactly.
    - Bezout-style size comparison per degree, checked before coverage is computed.
    - 'Closed-form total check per cell: summed multiset count equals binomial(B_eff + m - 1, m) exactly.'
    - Multiple independent polynomials per degree under different seeds, so a per-degree result is
      not one polynomial's accident.
    required_metrics:
    - realised base size per degree before trimming, with the Bezout comparison
    - exact coverage per arm per degree
    - coverage excess ratio with bootstrap interval, per arm per degree
    - fitted slope of excess against d with interval
    - mean curve points admitted per locus abscissa
    - permutation-null band per cell
    - closed-form total residual per cell
  falsification_conditions:
  - 'A measured realised base size exceeds the derivation''s stated Bezout-style bound at any degree:
    the reproduction fails outright and the run halts.'
  - 'The abscissa-null shows coverage excess outside its interval at any rung: the admission step
    generates the signal and the ladder is void.'
  - 'The fitted slope of excess against d has an interval excluding 0: flatness is falsified and the
    counting reading does not describe the coverage channel at these degrees.'
  - 'An individual degree sits outside its permutation band after correction while the slope is flat:
    a localised deviation, which is reported as such rather than averaged into flatness.'
  - The d equal to 0 degenerate control does not reproduce the whole-curve base.
  - Independent polynomials at the same degree give incompatible excesses, showing the per-degree
    quantity is a polynomial accident rather than a degree property.
  confounders:
  - Realised size varies strongly with d before trimming, and trimming to a common size is itself
    a structural intervention; the abscissa-null undergoes identical trimming precisely to absorb
    this, but only if the trimming rule is applied identically, which is easy to get wrong.
  - 'Negation closure: admitting points above an abscissa admits negation pairs, so every locus base
    is negation-closed while an exponent-side comparison would not be; this contract keeps everything
    on the x-line to avoid mixing the two, which limits scope rather than removing the confounder.'
  - A single polynomial per degree conflates degree with coefficient choice; multiple seeds per degree
    bound this.
  - The declared locus form determines the profile, and a different form at the same nominal degree
    gives different sizes, so cross-form comparison is not permitted.
  - Small field sizes make Bezout bounds loose enough that a violation would be surprising, weakening
    the reproduction's discriminating power at the low end.
  interpretation_limits:
  - Flatness in coverage across degrees 1 to 8 reproduces one consequence of one reading of the obstruction;
    it is not evidence that the obstruction is true and is not progress toward the universal statement.
  - High-degree interpolation descriptions are outside the tested ladder and are named in the derivation's
    own escape list as open; nothing here touches them.
  - Nothing here bears on relation rate, decomposition cost, linear algebra, or whether index calculus
    beats the generic square-root method.
  - Toy field sizes only; Bezout bounds and coverage saturation both behave differently at larger
    scale and no extrapolation is made.
  target_complexity:
    time_exponent: No attack exponent is claimed. The measurement costs one exact coverage computation
      per arm per degree, order N times B squared at arity 3, plus locus evaluation linear in the
      field size.
    memory_exponent: No attack memory exponent is claimed. Peak memory is one count vector of length
      N plus the locus membership bitmap, linear in N at toy sizes.
    best_known: The incumbent is the derivation itself as recorded in this program - a scoped bounded-degree
      obstruction stated with an intersection degree Delta and a Bezout-style size bound, cited by
      KN-OPEN-020 and never measured. On the coverage channel the incumbent reference row is the matched
      random base at excess exactly 1.000. There is no incumbent measured degree curve in this repository.
    hidden_overhead: 'The lower-order terms hide the trimming: bringing eight loci of wildly different
      realised sizes to a common target size costs structure that no accounting captures, and the
      abscissa-null absorbs it only under the assumption that trimming acts identically on structured
      and unstructured sets, which is asserted rather than proved. The human overhead hides in declaring
      the locus form and the Bezout bound in the exact shape the frozen derivation uses; a paraphrase
      produces a reproduction of something else.'
  dominated_by: 'n/a (no result claimed) on attack axes; no algorithm and no attack cost point is
    produced, so no attack frontier row is displaced. On the coverage measurement''s own frontier
    the check is real and I ran it against every row this repository records: the matched random base
    at 1.000 dominates on construction cost; the ceiling-attaining Bose-Chowla row at 1.1071 recorded
    in EV-FBG-001''s red-team objection dominates on excess and is unreachable by any locus base here,
    since a locus base is x-line-defined and negation-closed; the whole-group greedy at 1.0269 and
    coset_union at 1.0012 both dominate on excess any flat result this contract predicts. The contract
    expects to add no new best row and says so in advance, which is the point of a reproduction.'
  sota_delta: 'No attack; reproduction and measurement contribution only. Quantitatively: the bounded-degree
    obstruction is currently recorded with zero measured consequences, so the reproduction moves it
    from 0 measured degrees to 8, each with a realised-size-versus-Bezout comparison and a coverage
    excess with intervals, plus a fitted slope. On the excess axis this contract predicts values statistically
    indistinguishable from 1.000 and therefore adds nothing to the recorded frontier of 1.0012, 1.0269
    and 1.1071. No attack cost, relation rate or exponent changes.'
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'Bezout-style size bound holding at every tested degree: about 0.85 -
    it is a theorem-shaped statement and the main risk is that I reproduce the bound in the wrong
    form rather than that the mathematics fails. Abscissa-null staying at 1.00: about 0.8, with the
    residual risk concentrated in the trimming step. Flatness of coverage excess across degrees 1
    to 8: about 0.6 - I genuinely do not know, and the interesting outcome is the other one; low-degree
    loci over small fields have visible arithmetic structure and a localised deviation at d equal
    to 1 or 2 would not surprise me at all. Independent polynomials at the same degree agreeing: about
    0.7 at high degree and lower at d equal to 1, where a single linear map is nearly the whole story
    and coefficient choice matters most. Overall probability the run produces a defensible degree
    curve with intervals in either direction: about 0.7; probability it produces a clean flat reproduction
    that a later agent can quote: about 0.45.'
