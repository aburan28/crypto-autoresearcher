  assumptions:
    - >-
      p odd and p not dividing the cover degree, so that step 2's tameness
      hypothesis holds; the battery is built at p >= 101 with degrees at
      most 4.
    - >-
      A fixed labelling of each fibre is maintained across base points and
      across k, otherwise the generated subgroup is meaningless.
    - >-
      Fields F_{p^k} for k <= 4 are constructible in the harness's arithmetic
      layer. At p = 101 this is F_{101^4}, about 10^8 elements, which is used
      only for sampling, never enumerated.

  proof_search_map:
    bottleneck: >-
      Certifying a GEOMETRIC group from data collected at F_p-points. Every
      census route in this lane runs through this step and none of them has
      stated it. Removing the bottleneck changes what a census verdict is
      allowed to say, which is why the deliverable is a protocol and a
      disqualification criterion rather than a number.
    baseline_embedding:
      parameter_slice: >-
        At k = 1 the protocol's step 3 IS the lane's existing census, so the
        incumbent is an exact parameter slice of the proposal and must be
        reproduced by it.
      reproduction_check: >-
        On the Semaev symmetric-base cover, step 3 at k = 1 must reproduce
        IDEA-20260830-1a08f9's class histogram exactly on the same base
        points and the same seed; a mismatch means the protocol's classifier
        differs from the lane's and the comparison is void.
    observation_collision:
      observable: >-
        The subgroup generated by realized Frobenius elements, as a function
        of k.
      distinct_preimage_search: >-
        FOUND, AND IT IS THE POINT OF THE RECORD: at k = 1 the observable
        takes the value (Z/2)^2 both for the planted separator h_sep (whose
        geometric group is Z/2) and for a genuine (Z/2)^2 cover such as
        (Y^2 - a(e))(Y^2 - b(e)) with a, b independent modulo squares over
        F_p-bar. Two objects, same observation, different geometric answers.
        The ladder is precisely the refinement that separates them, and the
        battery contains both preimages so the separation is tested rather
        than asserted.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          The sequence (R_1, R_2, R_3, R_4) of realized groups along the
          base-change ladder, replacing the single realized group R_1.
        predicted_gain: >-
          Separates two covers that R_1 cannot separate, at a cost of three
          extra census passes; on h_sep the invariant moves from 4 to 2 while
          R_1 is constant in the number of base points.
      - transform: boundary_lift
        proposed_object: >-
          Inertia at the branch divisors as an algebraic lower bound on
          G_geom, run alongside the statistical one.
        predicted_gain: >-
          Supplies the only lower bound on G_geom that does not depend on
          sampling at all, and is what lets step 5 ever say DECIDED.
    quantifier_order: >-
      FOR ALL covers in the battery, THERE EXISTS k <= 4 such that the
      realized group R_k equals the geometric monodromy. Note this is an
      existential over a BOUNDED range, which is what makes it falsifiable:
      a battery member whose R_k has not stabilised by k = 4 falsifies the
      bounded form of the protocol even if the unbounded statement is true.
    method_ceiling:
      strongest_certifiable_claim: >-
        For a cover whose degree is small enough that all classes are
        realized in the sampled base, the protocol certifies G_geom exactly.
        NOT certifiable: fullness for large groups, where unrealized classes
        cannot be distinguished from unsampled ones without an effective
        Chebotarev bound this program does not have; and any statement about
        a cover whose constant-field degree d exceeds the tested k range.
      nearby_object_control: >-
        A degree-100 cover with an index-2 subgroup whose classes have
        density 1/100 each: the protocol will report UNDECIDED, and it must,
        because the sample cannot exhaust the classes. That object is
        included in the battery as the case where the honest answer is
        refusal, so that the protocol is shown to refuse rather than to
        always answer.
    proof_obligations:
      - claim: >-
          R_k stabilises to G_geom for k divisible by the constant-field
          degree d.
        responsibility: correctness
      - claim: >-
          h_sep has G_arith of order 4 and G_geom of order 2.
        responsibility: baseline
      - claim: >-
          Inertia generate G_geom for the tame battery members.
        responsibility: strictness
      - claim: >-
          The battery is constructible and classifiable at p >= 101 for
          k <= 4.
        responsibility: feasibility
      - claim: >-
          A protocol verdict of DECIDED requires L = R_stab = U.
        responsibility: interface

  predictions:
    - metric: >-
        realized-group order on the planted separator h_sep at k = 1 versus
        k = 2
      direction: lower
      minimum_effect: >-
        EXACTLY 4 then EXACTLY 2. This is the record's central forced
        contrast. If the order does not drop, the base-change ladder is not a
        valid geometric probe and the protocol is void -- a clean self-
        falsification.
    - metric: >-
        realized-group order on the Semaev symmetric-base cover at
        k = 1, 2, 3, 4
      direction: same
      minimum_effect: >-
        EXACTLY 8 at every k, on every panel curve. A drop would falsify
        IDEA-20260830-1a08f9 STEP 4 and, by the same argument, cast doubt on
        KN-FIND-a8990a Theorem A's arithmetic-equals-geometric clause -- the
        most consequential possible outcome of this record and the reason it
        is worth running even though a drop is not expected.
    - metric: >-
        realized-group order on a uniformly random quartic over F_p at
        k = 1, 2
      direction: same
      minimum_effect: >-
        24 at both, within the caveat that all 5 classes must be realized in
        the sample; a systematic drop would mean random quartics carry
        constant-field extensions, which would indicate an instrument defect
        rather than mathematics.
    - metric: >-
        realized-group order on the purely constant cover Y^3 - c (c a
        non-cube, p = 1 mod 3) at k = 1 versus k = 3
      direction: lower
      minimum_effect: >-
        EXACTLY 3 then EXACTLY 1. This is the extreme case where the
        geometric group is trivial and the census over F_p reports a
        nontrivial group; a protocol that cannot return 1 here cannot return
        a geometric verdict anywhere.
    - metric: >-
        sensitivity of R_1 on h_sep to the number of sampled base points
        (10^3 versus 10^5)
      direction: same
      minimum_effect: >-
        UNCHANGED at 4. The pre-registered claim is that the fixed-p census
        is blind to G_geom no matter how much data it collects; a change with
        sample size falsifies that claim and would mean the blindness is a
        sampling artifact rather than a structural fact.
    - metric: >-
        protocol verdict on the degree-100 sparse-class control
      direction: different
      minimum_effect: >-
        UNDECIDED, with both bounds reported. A protocol that returns DECIDED
        here is overclaiming and must be rejected regardless of its
        performance on the other battery members.

  minimal_test:
    design: >-
      STAGE 0, zero compute: write the battery with its forced outputs --
      N1 the Semaev symmetric-base cover (8, 8, 8, 8), N2 = h_sep (4, 2, ...),
      N3 a random quartic (24, 24), N4 = Y^3 - c (3, -, 1), N5 the degree-100
      sparse-class control (UNDECIDED) -- and freeze the table before any
      code runs. STAGE 1, minutes: implement the fixed-labelling Frobenius
      classifier and the subgroup-generation routine, and run k = 1 on all
      five members. STAGE 2, minutes to an hour: run k = 2, 3, 4 by sampling
      base points in F_{p^k}^2 (never enumerating), with the sample size
      fixed in advance from the smallest class density of each member.
      STAGE 3: steps 1 and 2 of the protocol (structural upper bound and
      inertia lower bound) computed by hand for each member and recorded, and
      the step-5 verdict emitted per member.
    controls:
      - >-
        IDENTICAL-OBJECT NULL. Two independently generated random quartics
        over the same F_p. Forced: both report 24 and no separation is
        claimed between them. A protocol that separates two draws from the
        same distribution has a false-positive problem and its other verdicts
        are suspect.
      - >-
        TRUE-(Z/2)^2 CONTROL, THE SEPARATOR'S TWIN. (Y^2 - a(e))(Y^2 - b(e))
        with a, b non-associate squarefree non-constant. Forced: 4 at every
        k, because the geometric group really is (Z/2)^2. Paired with h_sep
        this is the discrimination the whole record exists for: same k = 1
        observation, different ladder behaviour.
      - >-
        SAMPLE-SIZE CONTROL. R_1 on h_sep at 10^3 and 10^5 base points;
        forced identical.
      - >-
        LABELLING CONTROL. Recompute the generated subgroup under a second,
        independently chosen labelling of each fibre; the ABSTRACT group must
        be isomorphic and its order identical. A labelling-dependent order is
        an implementation defect.
      - >-
        REPRODUCTION CONTROL. On N1 at k = 1, reproduce
        IDEA-20260830-1a08f9's five class counts exactly on the same base
        points.
    required_metrics:
      - frozen battery table with forced outputs, emitted before any code runs
      - R_k per member per k, as a group order and as a generator list
      - structural upper bound U and inertia lower bound L per member
      - step-5 verdict per member (DECIDED with the group, or UNDECIDED with both bounds)
      - sample size and smallest observed class density per member per k
      - labelling-control agreement flag
      - artifact manifest with hashes and a rebuild receipt

  falsification_conditions:
    - >-
      h_sep failing to drop from 4 to 2 at k = 2. The ladder is not a valid
      geometric probe; the protocol is void and the record is withdrawn by a
      superseding record.
    - >-
      The true-(Z/2)^2 control dropping at any k. Then the ladder drops for
      reasons other than constant-field extension and cannot be interpreted.
    - >-
      N4 failing to reach 1 at k = 3. The protocol cannot detect a purely
      constant cover, which is the easiest possible case.
    - >-
      R_1 on h_sep changing with sample size. Then the fixed-p blindness
      claim (O1) is wrong as stated and must be re-derived.
    - >-
      The Semaev cover N1 dropping at any k. Then arithmetic is strictly
      larger than geometric for it, contradicting IDEA-20260830-1a08f9 STEP 4
      and the corresponding clause of KN-FIND-a8990a Theorem A; this must be
      reported as the headline, not as a footnote.
    - >-
      The degree-100 control returning DECIDED. Overclaiming protocol;
      rejected outright.
    - >-
      Any battery member failing to be constructible or classifiable.
      Instrument outcome, never mathematical evidence (AGENTS.md rule 3);
      nothing may be reported for that member in either direction.

  confounders:
    - >-
      SAMPLING IN LARGER FIELDS. The base over F_{p^k} has p^{2k} points and
      must be sampled, not enumerated; a class of small density can go
      unrealized purely for sample-size reasons and masquerade as a drop.
      The sample size is therefore fixed in advance from the smallest class
      density, and every reported drop must survive a tenfold sample
      increase.
    - >-
      LABELLING DRIFT ACROSS k. Fibres over F_{p^k}-points must be labelled
      compatibly or the generated subgroups are incomparable. This is the
      most likely implementation defect and it produces exactly the kind of
      spurious drop the record is designed to detect.
    - >-
      A DROP IS NOT AN EXCEPTIONAL LOCUS. If a specialised Semaev fibre ever
      does drop, the correct reading is a constant-field extension of that
      presentation, not a curve-specific relation-rate anomaly. Conflating
      the two is exactly the error the record exists to prevent, and it must
      be stated in the run record as well as here.
    - >-
      SCOPE OF THE CRITICISM. (O2) concerns IDEA-20260815-416f41's
      interpretation, not its arithmetic or its right to be run. Whether the
      lane's existing rejection covers specialised fibres is a Coordinator
      judgement; this record takes no position on it and its own value does
      not depend on the answer.
    - >-
      TOY SCALE. p = 101 to 1009, degrees at most 4, groups of order at most
      24 except the deliberately hard degree-100 control. Nothing here
      extrapolates.

  interpretation_limits:
    - >-
      CLAIM TIER toy for every measurement; the exact sequence and the
      inertia lemma are RECALLED external mathematics and must be cited as
      recalled, never as verified.
    - >-
      NO ECDLP CLAIM AND NO EXPONENT IN EITHER DIRECTION. This record
      produces an instrument and a disqualification criterion.
    - >-
      IT DOES NOT INVALIDATE ANY COMMITTED RESULT. KN-FIND-a8990a discharges
      the obligation by argument for its own cover; the criticism reaches
      only census routes that have not discharged it.
    - >-
      A PASSING BATTERY DOES NOT CERTIFY ANY PARTICULAR CENSUS. It certifies
      that the protocol separates arithmetic from geometric on five known
      objects at toy scale.
    - >-
      NO STATUS CHANGE to any record, and no assignment of work, is proposed
      or implied.

  heuristic_assumptions:
    - id: HEUR-AG-1
      statement: >-
        For a tame finite cover of a simply connected base over an
        algebraically closed field, the geometric monodromy is generated by
        the inertia subgroups at the branch divisors, so step 2's L is a
        genuine lower bound for G_geom.
      rigorous_support: >-
        Grothendieck's tame specialisation theory (SGA1); over C it is the
        statement that pi_1 of a divisor complement is generated by loops.
        RECALLED, NOT FETCHED. THE GAP: it is a tame statement, so it applies
        only while p does not divide a ramification index, which is enforced
        by building the battery at p >= 101 with degrees at most 4.
      validation_plan: >-
        SAMPLE: on every battery member with a known answer (N1, N2, N3, N4),
        compare L computed by hand from the discriminant factorisation
        against R_stab measured by the ladder. PREDICTED: L = R_stab on all
        four. TAIL CHECK: N4, where L = 1 and the whole content is that
        inertia is empty because the cover is unramified. TRANSFER: none
        beyond tame degrees at toy p. If L and R_stab ever disagree, the
        disagreement is the deliverable and the lemma's applicability, not
        the measurement, is what is in doubt.
    - id: HEUR-AG-2
      statement: >-
        For k in {1,2,3,4} and the battery's class densities, the sampled
        base realizes every class of the arithmetic monodromy over F_{p^k}
        that has density at least 1/24, with probability at least 0.999 at
        the pre-registered sample size.
      rigorous_support: >-
        A coupon-collector bound on the sample size given a class-density
        floor; the density floor itself is the Chebotarev prediction, which
        is EXACTLY the assumption at issue, so this is circular unless the
        floor is taken from the structural upper bound rather than from the
        data. It is therefore stated as a heuristic and the sample size is
        fixed from U, not from the observed histogram.
      validation_plan: >-
        SAMPLE: tenfold sample increase on every member where a class was
        unrealized; a class that appears only at the larger sample was a
        sampling artifact and every verdict depending on its absence is
        withdrawn. COMPARISON: observed smallest class density against
        1/|U|. TAIL CHECK: the degree-100 control, where the floor is 1/100
        and the protocol is expected to refuse.
    - id: HEUR-AG-3
      statement: >-
        The constant-field degree d of every battery member divides some
        k <= 4, so the ladder reaches G_geom within the tested range.
      rigorous_support: >-
        True by construction for N1 (d = 1), N2 (d = 2), N4 (d = 3) and, by
        the same construction, for the twin control (d = 1). It is NOT
        guaranteed for an arbitrary cover, which is why the protocol's
        bounded form is stated as a falsifiable existential in
        quantifier_order.
      validation_plan: >-
        SAMPLE: report R_k for all k <= 4 on every member, including members
        where stabilisation is expected at k = 1, so a non-stabilising
        sequence is visible rather than inferred. TAIL CHECK: any member
        whose R_k is still changing at k = 4 is reported as
        NOT-STABILISED and carries no geometric verdict.

  target_complexity:
    time_exponent: >-
      NO ATTACK, NO EXPONENT. Stated plainly. Instrument cost is
      O(S) fibre classifications per (member, k), with S the sample size and
      arithmetic in F_{p^k}; at p = 101, k <= 4 and S = 10^5 this is under a
      minute per cell in pure Python.
    memory_exponent: >-
      Negligible; a generator list per member per k, at most a few dozen
      permutations.
    best_known: >-
      Pollard rho at p^{1/2} time and O(1) memory (KN-OPEN-001) remains the
      prime-field ECDLP baseline and is untouched. On the instrument axis the
      incumbent is the lane's fixed-p Frobenius census (EXP-MONO-4b50b6
      lineage as described in the records read), which reports a group name
      from realized classes at k = 1 only.
    hidden_overhead: >-
      None charged; no algorithm is proposed. The honest overhead is
      methodological: two of the record's three structural ingredients are
      RECALLED and unfetched, and the battery is designed so that each is
      cross-checked against a measurement rather than trusted.
    tradeoff_note: >-
      Extra k costs a full census pass each and buys geometric validity;
      extra base points at fixed k cost linearly and buy nothing for the
      geometric question, which is the record's central asymmetry and the
      reason the sample-size control is included.

  dominated_by: >-
    n/a (no result claimed on any attack axis), checked row by row. TIME:
    Pollard rho p^{1/2}; van Oorschot-Wiener parallel collision search; the
    prime-field index-calculus family of KN-OPEN-001/002 -- none competed
    with. MEMORY: rho at O(1); this instrument's memory is a permutation
    list. DATA/QUERIES/ADVICE: none; public curve data, no oracle. On the
