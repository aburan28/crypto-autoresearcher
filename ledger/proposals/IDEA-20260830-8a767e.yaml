idea:
  id: IDEA-20260830-8a767e
  question_id: RQ-MONO-001
  added: '2026-08-30'
  status: proposed
  proposed_by: idea-generator
  class: control

  title: >-
    A FROBENIUS CENSUS OVER A FIXED F_p MEASURES THE ARITHMETIC MONODROMY AND
    THE QUESTION ASKS FOR THE GEOMETRIC ONE -- the first missing obligation of
    every census route in this lane; discharge it with a base-change ladder
    over F_{p^k} and a planted separator whose two groups differ by a factor
    of 2, or stop calling any census verdict geometric.

  claim: >-
    THE OBLIGATION. For a cover X -> B over F_p there is an exact sequence
      1 -> G_geom -> G_arith -> Gal(F_{p^d}/F_p) -> 1,
    where F_{p^d} is the algebraic closure of F_p in the function field of X.
    Frobenius elements at F_p-points of B lie in G_arith and generate a
    subgroup of it; they never see G_geom directly. RQ-MONO-001 asks about
    the GEOMETRIC monodromy. Therefore:
    (O1) A census over a fixed F_p yields a LOWER bound on G_arith and
    nothing else. It is not an upper bound on anything (unrealized classes may
    simply be unsampled) and it is not a statement about G_geom (the two can
    differ by any cyclic quotient).
    (O2) THE MISSING OBLIGATION, NAMED. No committed record in this lane
    supplies an arithmetic-equals-geometric certificate for the SPECIALISED
    covers that IDEA-20260815-416f41 proposes to census. Its headline
    quantity -- the fraction of targets whose specialised monodromy is
    provably smaller -- is, without that certificate, a fraction of targets
    whose ARITHMETIC monodromy is smaller, and a drop caused by a
    constant-field extension is not an exceptional locus of curves. Stated
    fairly and symmetrically: KN-FIND-a8990a Theorem A DOES discharge the
    obligation for the ordered Semaev cover, by an argument, and
    IDEA-20260830-1a08f9 STEP 4 does so for the symmetric-base cover; those
    two are not affected by this record, and saying so is part of the claim.
    (O3) THE OBLIGATION IS EXECUTABLE, NOT MERELY CONCEPTUAL. Over F_{p^k},
    the arithmetic monodromy is the subgroup generated by G_geom and Frob^k.
    As k runs over 1, 2, 3, ..., the realized group is non-increasing on
    multiples of d and STABILISES at exactly G_geom once d divides k. So the
    protocol is: run the census over F_p, F_{p^2}, F_{p^3}, F_{p^4}; report
    the stabilised realized group as the certified lower bound for G_geom,
    the structural containment as the upper bound, and DECIDED only where the
    two meet. This is a finite, cheap procedure that turns a conceptual
    caveat into a measurement.
    (O4) A PLANTED SEPARATOR WITH A FACTOR-OF-2 GAP EXISTS AND IS TRIVIAL TO
    BUILD. Let c be a fixed non-square in F_p and a(e) a non-constant
    squarefree polynomial. The quartic
        h_sep(Y) = (Y^2 - a(e)) (Y^2 - c a(e))
    has G_arith = (Z/2)^2 of order 4 over F_p(e), because a and c a are
    independent modulo squares there; and G_geom = Z/2 of order 2, because
    over F_p-bar the constant c is a square and the second factor's root is
    sqrt(c) times the first's. A census over F_p reports 4; the true
    geometric group is 2. Any protocol that answers RQ-MONO-001 by censusing
    must return 2 on this object.
    (O5) THE SECOND HALF OF THE OBLIGATION, WHICH IS ABOUT FULLNESS RATHER
    THAN ABOUT GEOMETRY. Even for G_arith, a census certifies fullness only
    if it realizes every class AND an independent structural containment
    caps the group. For groups small enough to exhaust -- D_4 at order 8 is --
    that is achievable and is exactly what IDEA-20260830-1a08f9 does. For
    large groups it is not, because no effective Chebotarev bound over a
    fixed small F_p is available to this program. A verdict of the shape "the
    histogram is consistent with full monodromy" is therefore not a decision,
    and this record supplies the shape that is: realized-lower-bound meets
    structural-upper-bound.

  mechanism: >-
    THE PROTOCOL, in five steps, each with a forced output on the planted
    battery.

    STEP 1 (structural upper bound, algebraic, no statistics). Present the
    cover as a tower and read off the containment: fibre products of degree-2
    Kummer steps give (Z/2)^r; adding a symmetrisation gives a wreath
    product; a random quartic gives only the trivial bound S_4. Output: a
    group U with G_arith contained in U.

    STEP 2 (ramification lower bound, algebraic, no statistics). Factor the
    discriminant of the fibre over the base, identify the branch divisors, and
    compute the inertia generator at each. For a tame cover of a simply
    connected base, the inertia generate G_geom (this is the record's one
    recalled ingredient, HEUR-AG-1). Output: a group L with L contained in
    G_geom.

    STEP 3 (realized lower bound over F_p). Census: sample or exhaust base
    points, compute the Frobenius permutation of each fibre under a FIXED
    labelling, and take the generated subgroup R_1. Output: R_1 contained in
    G_arith.

    STEP 4 (base-change ladder, which is the new instrument). Repeat step 3
    over F_{p^k} for k = 2, 3, 4, obtaining R_k. Because the arithmetic
    monodromy over F_{p^k} is generated by G_geom and Frob^k, the sequence
    R_k is non-increasing along divisibility and equals G_geom for every k
    divisible by d. Output: R_stab, the value R_k takes for all sufficiently
    divisible k in the tested range, as the certified estimate of G_geom.

    STEP 5 (verdict discipline). Report DECIDED only when L = R_stab = U (or
    R_stab = U with L a witness). Report UNDECIDED, with both bounds, when
    they do not meet. Never report a group name from step 3 alone; never
    report a geometric verdict without step 4.

    WHY THE LADDER IS THE RIGHT PROBE AND NOT A RESTATEMENT OF THE PRIME
    COUNT. IDEA-20260815-711932 measures how many PRIMES a census needs to
    separate two candidate groups, i.e. the statistical resolving power at
    fixed geometry. This record varies the EXTENSION DEGREE at fixed prime,
    which is not a sample-size axis at all: no number of base points over F_p
    can distinguish h_sep's geometric group from its arithmetic one, and a
    single base point over F_{p^2} begins to. The two records measure
    orthogonal properties of the same instrument and neither substitutes for
    the other.

    WHAT A DROP MEANS, AND WHAT IT DOES NOT. A drop from R_1 to R_2 means a
    constant-field extension, i.e. the cover is geometrically smaller than it
    looks over F_p. That is NOT an exceptional locus of curves and NOT a
    relation-rate anomaly; it is a property of the presentation. Conversely,
    no drop across the whole ladder is evidence -- not proof -- that the
    constant field is F_p, which is why step 2's algebraic lower bound is
    retained alongside it.

  novelty_status: unverified

