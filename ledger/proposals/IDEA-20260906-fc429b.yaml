idea:
  id: IDEA-20260906-fc429b
  question_id: RQ-RELN-001
  goal_id: GOAL-RELN-001
  added: '2026-09-06'
  title: >-
    THE PROTOCOL'S IID TRIAL MODEL IS A STATEMENT ABOUT A CAYLEY GRAPH
    NOBODY HAS LOOKED AT: a relation collector that re-randomises by adding
    factor-base elements walks on Cay(Z/N, log W), whose spectral gap is
    EXACT at toy scale (an FFT of the log indicator) and whose random-base
    value sqrt(ln(N/2)/B) is what Alon-Roichman's c_eps log|G| threshold
    imitates -- so at the ladder's small-B cells (B = 8, N = 4099:
    lambda_2 about 0.98, mixing time about 400 steps against an IID hitting
    time of 30) the walk-driven hit process is predicted to violate the
    protocol's Bernoulli model by a computable margin, and at B = 48 to obey
    it; the autocorrelation of the hit indicator is predicted EXACTLY from the
    spectrum of 1_{mW}, with an AP-in-logs base as the planted non-mixer
  class: composition

  claim: >-
    SETTING. Prime-order curve, G = <P> of order N, factor base W = V union
    -V of size 2B with logs l_w. The frozen protocol's sampling model draws
    each trial's target R = aP + bQ afresh (one scalar multiplication, about
    log N group operations) and treats the decomposition outcomes as IID
    Bernoulli(cov) within a stratum (OBL-PROBABILITY-GATE requires declared
    IID). A practical collector re-randomises more cheaply: R_{j+1} = R_j + w_j
    with w_j uniform in W (one group addition), which is the simple random
    walk on the Cayley graph Cay(Z/N, {l_w}) started at a uniform point. The
    hit indicator is X_j = [R_j in mW], where mW is the m-fold sumset.

    THE OBJECT AND ITS EXACT SPECTRUM. Cay(Z/N, log W) is 2B-regular on a
    cyclic group, so its normalised eigenvalues are the character sums
    lambda_k = (1/B) sum_{i=1}^{B} cos(2 pi k l_i / N), k = 0..N-1, and
    lambda_2 = max_{k != 0} |lambda_k|. At toy scale the logs are known
    (BSGS), so lambda_2 and the whole spectrum are EXACT, by one FFT of the
    indicator of {l_w} over Z/N. Moreover the autocorrelation of the hit
    process at stationarity is exactly
      rho(k) = Cov(X_0, X_k)/Var(X_0) = sum_{j != 0} lambda_j^k |hat 1_{mW}(j)|^2 / sum_{j != 0} |hat 1_{mW}(j)|^2,
    with hat 1_{mW} the Fourier transform of the sumset indicator -- a
    second FFT. Nothing in the toy-scale prediction is heuristic; the
    heuristic enters only in what the RANDOM-base spectrum looks like.

    THE RANDOM-BASE LAW (HEUR-1) AND ITS NUMBERS. For uniformly random logs
    each lambda_k with k != 0 is a mean of B cosines of mean 0 and variance
    1/2, so lambda_k is approximately N(0, 1/(2B)) and the maximum over
    (N - 1)/2 characters is about sqrt(ln(N/2)/B). This is the cyclic-group
    face of the Alon-Roichman theorem (retrieved: c_eps log|G| random
    generators give E[lambda_2] <= eps), which fixes the threshold
    B about ln(N/2)/eps^2. Forced values: N = 4099: B = 8 gives 0.98,
    B = 12 gives 0.80, B = 48 gives 0.40. N = 65537: B = 12 gives 0.93,
    B = 48 gives 0.47. Mixing time ln(N)/(1 - lambda_2): about 400 steps
    at (4099, 8), about 40 at (4099, 12), about 14 at (4099, 48). The IID
    hitting time 1/cov at (4099, 8, m = 2) is about 30 steps
    (IDEA-20260906-86cd30's exact law). Therefore, PREDICTED: at B = 8 the
    walk-driven hit process is far from IID over the timescale on which
    relations are collected -- long runs of hits and long droughts,
    hitting-time distribution heavier than geometric(cov) -- and at B = 48
    it is IID to within the protocol's tolerance. The crossover is
    B* about ln(N/2)/(1 - lambda*)^2 for the target lambda*, computable per
    cell.

    WHAT THE COLLECTOR PAYS AND WHAT IT SAVES, HONESTLY. Per trial the walk
    saves about log N group operations (a scalar multiplication) and pays
    one addition; the decider call (at least B operations for the claw,
    IDEA-20260830-21e7c4) is unchanged, so the saving is a cofactor at
    most log N on the trial cost and NO EXPONENT MOVES. The price is
    structural: the first hit of a walk gives a row involving (a, b) of
    weight m + j after j steps, and every later hit gives a PURE factor-
    base row (differences of consecutive hits are walk segments), of
    weight m + (steps between hits). Row weight therefore scales as 1/cov
    unless the walk is reset, which is exactly the log-cofactor trade
    IDEA-20260815-c3f707 names as rerandomisation cost; and the rows are
    the non-uniform-target collector mode that IDEA-20260905-029c9c
    predicts will shorten the dependency lattice (its O-MODE case).

    WHAT THE CLAIM DISCRIMINATES. (a) IID HOLDS at a cell: the empirical
    hitting-time law is geometric(cov) and rho(k) is below 0.05 for k >= 2 --
    the protocol's model is adequate for walk collectors there. (b) IID
    FAILS as predicted: hitting-time excess and rho(k) match the exact
    spectral prediction -- the protocol's stratified-IID declaration is
    false for walk collectors at that cell and the Clopper-Pearson p_L
    must be replaced by a Markov-chain interval (batch means). (c) IID
    FAILS but NOT as predicted: rho(k) departs from the spectral formula --
    the sumset indicator's spectral weight is mis-computed or the walk is
    not at stationarity; localised by NULL-A. Outcomes (a) and (b) are
    both useful; (c) voids the instrument.

  mechanism: >-
    Spectral theory of reversible chains on abelian groups. The walk is
    the Markov chain with transition operator T = (1/2B) sum_w (shift by
    l_w); on Z/N the characters diagonalise every shift, so T's spectrum is
    the character sums and the covariance of any function f along the
    chain is sum_j lambda_j^k |hat f(j)|^2. With f = 1_{mW} this is exact.
    The classical distribution statement imitated by HEUR-1 is Alon-
    Roichman / Landau-Russell: O(log|G|) uniformly random generators give
    an expander with high probability; on a cyclic group the sub-Gaussian
    tail of the cosine sums gives the explicit sqrt(ln(N/2)/B) scale. The
    hit process is a function of the chain, so its hitting-time law is
    controlled by lambda_2 and by the spectral weight of 1_{mW} on the
    near-top eigenspaces; both are computed, not assumed, at toy scale.

  novelty_status: unverified

