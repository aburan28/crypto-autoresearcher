  assumptions:
    - Prime-order toy curves at 8-16 bits; logs of W obtained by BSGS at toy scale only, as a measurement shortcut, never as part of any collector.
    - The walk starts at a uniform point (a fresh aP + bQ) and W is symmetric, so the chain is reversible and stationary from step 0.
    - The decider is the exact sumset membership of IDEA-20260830-21e7c4 (precomputed mW), so the hit process is the mathematical one and no solver censoring enters.
    - Toy scale only; nothing here authorises a collector run under the protocol.

  proof_search_map:
    not_applicable_reason: >-
      Not a proof-oriented proposal: the spectral formulas are standard and
      exact at toy scale; the content is a pre-registered measurement of the
      protocol's IID assumption against them.

  object_first_candidate:
    tracked_object: >-
      The hit process X_j = [R_j in mW] along the Cayley walk on
      (Z/N, log W), summarised by its hitting-time law and autocorrelation,
      together with the exact spectrum (lambda_k) of the walk.
    established_families_off_limits: >-
      Off-limits as the primary lens: factor-base geometry for mean yield
      (KN-FIND-007); rho-style collision walks (59fed3 owns Teske mixing for
      rho); isogeny-graph mixing (1cc763, 3182cf); Groebner instrumentation;
      the dependency lattice as a statistic (029c9c owns it; this record
      supplies its O-MODE input).
    lossiness: >-
      GENUINELY LOSSY: (walk state R_j) -> X_j keeps one bit and forgets
      the point; (W) -> spectrum keeps N real numbers invariant under
      relabelling of W and under the automorphisms of Z/N that fix the
      generator set as a set. The one-step propagation is the Markov
      transition, which is deterministic on distributions and exact on
      the spectral side (the covariance sequence is a linear functional of
      the spectrum). Under translation by a base element the object
      propagates by construction (that IS the walk step), which places it
      in Class I, partial action, exactly as index calculus itself
      (IDEA-20260806-c5d183); the discard (the point) is compatible because
      membership in mW is all the collector needs.
    propagation: >-
      Exact under walk steps; the autocorrelation sequence is determined by
      the spectrum and the sumset's Fourier weights and does not depend on
      the start point at stationarity.
    survival_score: >-
      Survives every base and every m with the same formulas; its
      information content dies when lambda_2 is small (the walk is IID and
      the object reduces to the protocol's Bernoulli model). Honest score:
      informative exactly at small B, uninformative at large B, and that
      crossover is the finding.

  null_object_control: >-
    NULL-A, BLOCKING, MATCHED: the abstract cyclic group Z/N with a
    uniformly random symmetric log set of size 2B and the SAME sumset
    rule -- the exact spectral prediction and the simulated hit process
    must agree with the curve arm in distribution; the curve contributes
    nothing beyond the logs. NULL-B: the protocol's own IID collector
    (fresh aP + bQ each trial) at the same cells, whose hitting law is
    geometric(cov) by construction and whose rho(k) is 0 -- the reference
    the walk is compared to. PLANTED POSITIVE CONTROL, BLOCKING: the
    AP-in-logs base W = {+-[k]P : k <= B}, for which
    lambda_2 = (1/B) sum_{k<=B} cos(2 pi k/N) = 1 - O(B^2/N^2): a walk on a
    line; the hit process must show autocorrelation near 1 over hundreds of
    steps and a hitting-time law far from geometric. DECAY PARAMETER q:
    fraction of the AP generators replaced by uniformly random ones,
    q in {0, 0.25, 0.5, 0.75, 1}; the exact lambda_2 must fall monotonically
    toward sqrt(ln(N/2)/B) and the measured rho(2) with it. A lambda_2 flat
    in q is the artifact tell of docs/inventor-protocol.md section 3 and
    voids the arm. ORDERING CONTROL: the exact spectra and rho(k) for every
    cell are computed and hashed before any walk is simulated.

  discriminated_from:
    - >-
      IDEA-20260815-c3f707 -- NEAREST RECORD. It charges failed attempts
      and names rerandomisation cost as a missing counter. EXACT DELTA:
      this record specifies the cheap rerandomiser (a Cayley walk), shows
      its cost saving is at most a log N cofactor, and measures the
      statistical price c3f707 does not consider -- the loss of IID and the
      growth of row weight -- against an exact spectral prediction.
    - >-
      IDEA-20260905-029c9c. Predicts that non-uniform-target collectors
      shorten the dependency lattice (O-MODE) and treats collector mode as
      an independent variable. Delta: this record constructs the collector
      mode, predicts WHEN it is non-uniform (lambda_2 close to 1) and by
      how much, and hands its row stream to 029c9c's instrument as the
      planted O-MODE case rather than restating that instrument.
    - >-
      IDEA-20260807-59fed3. Teske mixing for rho walks on the Aut-quotient.
      Delta: different object (collision search, not relation collection),
      different graph (walk on the group with r table points versus the
      Cayley graph on the factor base), and this record's spectrum is exact
      at toy scale from the logs rather than a Teske constant.
    - >-
      IDEA-20260815-1cc763 / IDEA-20260812-3182cf. Spectral gap of isogeny
      graphs and the JMV re-randomiser. Delta: this record's graph is the
      Cayley graph of the target group on the factor base, with the
      Alon-Roichman law as its classical reference; no isogeny appears.
    - >-
      IDEA-20260805-061f97 and IDEA-20260905-1a8cb3. Relations needed and
      entropy per relation. Delta: the walk's pure factor-base rows are
      inputs to those accountings; this record measures the trial process,
      not the rank.

  predictions:
    - metric: M1 -- exact lambda_2 of Cay(Z/N, log W) for random bases versus sqrt(ln(N/2)/B), all default cells
      direction: different
      minimum_effect: >-
        Within a factor 1.3 of the prediction on 90 percent of 50 random
        bases per cell (the maximum of Gaussians has relative spread of
        order 1/ln N); a systematic factor above 1.5 refutes HEUR-1 at that
        cell.
    - metric: M2 -- measured rho(k), k in {1, 2, 4, 8, 16}, of the walk's hit process versus the exact spectral formula, per cell
      direction: different
      minimum_effect: >-
        PREDICTED EQUALITY within 3 SE over 10^5 walk steps per cell; a
        departure replicated across seeds while NULL-A agrees is outcome
        (c) and voids the curve arm.
    - metric: M3 -- hitting-time law of the walk versus geometric(cov), per cell
      direction: different
      minimum_effect: >-
        At (4099, B = 8, m = 2): variance-to-mean ratio of the hitting time
        at least 2x the geometric value (pre-registered from the spectral
        prediction; the exact factor is written per cell before the run).
        At (4099, B = 48) and (65537, B = 48): within 1.2x. A cell at B = 8
        with ratio below 1.3x refutes the record's headline.
    - metric: M4 -- planted AP arm rho(k) and its q-decay
      direction: higher
      minimum_effect: >-
        rho(16) >= 0.9 at q = 0 and lambda_2 monotone in q reaching the
        random value at q = 1 within a factor 1.3; otherwise the instrument
        is blind.
    - metric: M5 -- mean row weight of the walk's relations per cell versus m + 1/cov
      direction: different
      minimum_effect: >-
        Within a factor 1.5 of m + 1/cov for the IID cells and above it for
        the non-mixing cells (droughts lengthen segments); a mean below m
        is impossible and voids the collector.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): derive the spectral formula for
      rho(k) and verify it against direct simulation on Z/N at N = 101 with
      a 6-element generator set (exact 101 x 101 transition matrix).
      STAGE 1 (seconds per cell): BSGS logs of W on the toy curve; FFT of
      the log indicator (lambda_k) and of 1_{mW}; exact rho(k) and the
      predicted hitting-time moments; hash. STAGE 2 (minutes per cell,
      pure Python on harness/toycurve.py): simulate 10^5 walk steps per
      cell with exact sumset membership; empirical rho(k), hitting-time
      law, row weights; NULL-A on Z/N; NULL-B IID collector; planted AP arm
      with its q ladder. All default m = 2 cells at 8, 10, 12, 16 bits and
      the m = 3 cells at 12 bits. STAGE 3 (zero compute): apply the
      pre-registered tolerances and classify each cell as (a), (b) or (c).
      CHEAPEST VALID DISCRIMINATOR: Stage 1 plus Stage 2 at the single cell
      (N about 4099, B = 8, m = 2) -- minutes; if rho(2) there is neither
      near the spectral prediction nor near 0, the instrument is void and
      nothing else is worth running.
    controls:
      - NULL-A abstract Z/N with random symmetric logs (blocking; must match the curve arm).
      - NULL-B the protocol's IID collector at the same cells (blocking; the geometric reference).
      - Matched random factor base of the same size at the same p is the arm under test.
      - Planted AP-in-logs base with q-decay ladder (blocking).
      - Exact 101-vertex transition-matrix check of the spectral formula (Stage 0).
      - Mandatory Pareto rows on one instance per p, Pollard rho with negation (0.886 sqrt(N)) and BSGS (sqrt(N) time and memory), in group operations, as controls only.
    required_metrics:
      - exact lambda_2 and full spectrum per base and cell; predicted versus measured rho(k)
      - hitting-time mean, variance and empirical CDF versus geometric(cov)
      - row-weight distribution of walk relations; count of pure rows versus (a, b) rows
      - group operations per trial for the walk and for the IID collector, identical counters
      - planted-arm lambda_2 and rho(k) along the q ladder with monotonicity verdict
      - sha256 of every base, log table, spectrum and seed list
      - matched rho and BSGS operation counts and BSGS memory

  falsification_conditions:
    - F1. Stage 0 finds the spectral formula disagreeing with the exact transition matrix. The derivation is wrong; the record is superseded.
    - F2. M1 fails systematically (random-base lambda_2 far from sqrt(ln(N/2)/B)). HEUR-1 is refuted at that cell; the exact spectrum is still used and the record's headline is re-derived from it.
    - F3. M2 departs from the spectral prediction on the curve arm while NULL-A agrees. The curve arm's walk or logs are wrong; outcome (c); nothing is read.
    - F4. M3 at B = 8 shows a geometric hitting law (ratio below 1.3x) despite lambda_2 near 1. The hit indicator has negligible spectral weight on the near-top eigenspaces -- a genuine and useful finding that the protocol's IID model survives even a slow walk; the headline is refuted and the mechanism is reported as the reason.
    - F5. The planted AP arm does not show near-1 autocorrelation or does not decay in q. Instrument blind to non-mixing; no IID verdict may be issued.

  confounders:
    - PERIODICITY. Cay(Z/N, W) on odd N with symmetric W is aperiodic; eigenvalues near -1 would still slow convergence and are reported as |lambda| not lambda.
    - START DISTRIBUTION. A walk started at a non-uniform point is not stationary; the protocol's fresh aP + bQ start is uniform and is used.
    - SUMSET SIZE. rho(k) depends on 1_{mW}'s Fourier weights, which for a sparse sumset can concentrate on characters unrelated to lambda_2; that is why rho(k) is predicted from the full spectrum, not from lambda_2 alone.
    - LOG SHORTCUT. BSGS logs are a toy-scale measurement device only; any collector that used them would be circular, and the record's collector never touches them.
    - SOLVER CENSORING. Using a budgeted algebraic decider instead of exact sumset membership would confound the hit process with censoring (AGENTS.md rule 3); excluded by design.
    - SMALL N. At 8 bits the number of characters is small and the maximum-of-Gaussians prediction is crude; HEUR-1 is validated per cell and 8-bit cells are reported but not used to test HEUR-1.

  interpretation_limits:
    - Toy tier (claim_tier toy) at 8-16 bit p; no transfer assumption; the Alon-Roichman scale is validated only where measured.
    - NO ATTACK, NO EXPONENT MOVED. The walk saves at most a log N cofactor per trial and costs row weight; nothing about relation-collection exponents changes.
    - A verdict that the IID model fails at a cell is a statement about walk collectors; the protocol's fresh-target collector remains IID by construction and is unaffected.
    - The record does not amend the frozen protocol; it supplies a pre-registered audit the Coordinator may or may not adopt.
    - No experiment, hypothesis, approval, status transition or run is created by this record.

  heuristic_assumptions:
    - id: HEUR-1
      statement: >-
        RANDOM-BASE SPECTRUM. For W with uniformly random logs, the
        normalised eigenvalues lambda_k (k != 0) of Cay(Z/N, log W) are
        approximately independent N(0, 1/(2B)) across k and
        lambda_2 = sqrt(ln(N/2)/B) (1 + o(1)).
      rigorous_support: >-
        Alon-Roichman (retrieved via Landau-Russell): c_eps log|G| random
        generators give E[lambda_2] <= eps, so lambda_2 -> 0 once
        B >> ln N; the sub-Gaussian tail of a mean of B bounded cosines
        (Hoeffding) gives P[|lambda_k| > t] <= 2 exp(-B t^2), and a union
        bound over N/2 characters gives the stated scale as an upper bound.
        The heuristic content is the matching lower bound (that the maximum
        is attained at the Gaussian scale), imitating the extreme-value law
        of independent Gaussians.
      validation_plan: >-
        Exact FFT spectra of 50 random bases per cell at 8-16 bits; compare
        the empirical distribution of lambda_2 with the maximum of (N - 1)/2
        Gaussians of variance 1/(2B); tail check on the largest lambda_2
        over bases against its predicted quantile; sampled parameters
        recorded; toy scale, no transfer.
    - id: HEUR-2
      statement: >-
        STATIONARITY OF THE HIT PROCESS. Started at a uniform point the walk
        is stationary and the covariance formula applies from step 0.
      rigorous_support: >-
        Exact for a random walk on a group started at the uniform
        distribution (the uniform measure is invariant under every shift);
        no heuristic content beyond the uniformity of aP + bQ, which the
        protocol's sampler guarantees and a KS test on (a, b) confirms.
      validation_plan: >-
        KS test of a/N and b/N against uniform per cell; rho(k) measured in
        two halves of every walk and compared.

  target_complexity:
    time_exponent: >-
      NO ATTACK, NO EXPONENT. Per-trial cost of the walk collector is one
      group addition plus the decider; the IID collector's is about log N
      additions plus the decider. The saving is a cofactor bounded by
      log N and vanishes against any decider costing more than log N.
      Measurement cost is O(N log N) per FFT and O(steps) per walk.
    memory_exponent: O(N) words for the spectra and sumset indicator at toy scale.
    best_known: >-
      Pollard rho with negation at 0.886 sqrt(N) and O(1) memory; BSGS at
      sqrt(N) and sqrt(N); no proven prime-field index-calculus advantage;
      the generic sumset claw at N^{k/(2k-1)} (IDEA-20260829-66a876).
    hidden_overhead: >-
      Nothing asymptotic is claimed. The row-weight growth 1/cov is the
      hidden price of the walk and is measured (M5), not hidden.
    tradeoff_note: >-
      Walk length between resets trades the log N rerandomisation cost
      against row weight and IID quality; the record measures both ends
      and does not choose.

  dominated_by: >-
    AS AN ATTACK: none is mounted; checked row by row on the prime-field
    frontier: parallel rho with negation (0.886 sqrt(N), O(1)); BSGS;
    van Oorschot-Wiener; the generic sumset claw of IDEA-20260829-66a876;
    preprocessing S T^2 = N; Pohlig-Hellman, MOV, SSSA, Weil descent n/a;
    Shor out of scope. Every row dominates trivially. AS A COLLECTOR: the
    protocol's fresh-target IID collector dominates the walk on
    independence and row weight at every cell; the walk dominates it on
    per-trial rerandomisation cost by at most log N. AS A MEASUREMENT: no
    record occupies the axis 'IID audit of the trial model'; the nearest,
    IDEA-20260905-029c9c, dominates on generality of its lattice statistic
    and is fed by this record rather than replaced.
  sota_delta: >-
    Cryptanalytic delta: 0 on time (a log N cofactor at most, paid back in
    row weight), 0 on memory, 0 on data. Measurement delta: from an
    undeclared IID assumption to an exact per-cell spectral prediction of
    the walk collector's autocorrelation and hitting law, with the forced
