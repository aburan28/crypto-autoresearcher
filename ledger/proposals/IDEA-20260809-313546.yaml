idea:
  id: IDEA-20260809-313546
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-AEADC-8db132
  goal_id: GOAL-AEADC-001
  title: >-
    The two-key GCM certificate at full standard parameters, derived from the
    authenticator's linear structure rather than searched for
  class: mechanism
  claim: >-
    For AES-GCM the authentication tag is a polynomial evaluation in a
    key-derived point, and the equality of two tags under two different keys is a
    LINEAR condition on the ciphertext blocks over the field. The claim is that a
    ciphertext valid under two chosen keys is therefore obtained by solving a
    small linear system rather than by search, that the construction runs in
    milliseconds at FULL standard parameters, and that the resulting certificate
    is a few hundred bytes any reader verifies with a stock library.
  mechanism: >-
    Fix two keys, derive each one's hash subkey and tag mask, and treat the tag
    equations as two linear constraints over the ciphertext blocks. Solve for a
    block assignment satisfying both, then let the remaining blocks carry
    arbitrary chosen plaintext under each key.
  why_not_a_renamed_known_approach: >-
    This construction is published and is the basis of the known
    message-franking and partitioning results. This record does not claim the
    technique; it claims the ARTIFACT — a certificate produced and re-verified
    inside this program at full parameters, which is the instrument every other
    record in this goal depends on and which the corpus does not currently
    contain.
  predictions:
  - observable: construction time for a two-key certificate at standard parameters
    metric: milliseconds
    predicted: Milliseconds. A construction requiring search rather than linear solving would indicate the mechanism is misunderstood and must halt the goal's premise.
  - observable: independent verification of both decryptions
    metric: two boolean checks by a second implementation and a stock library
    predicted: Both accept. Either rejecting means the certificate is invalid and nothing is recorded.
  minimal_test: >-
    Produce ten certificates with declared seeds, each carrying two distinct
    meaningful plaintexts, verify each with two independent implementations, and
    record the bytes in the run package.
  controls:
  - 'STOCK-LIBRARY CHECK: at least one verification uses an implementation not written for this goal, since a certificate verified only by its author''s code proves nothing.'
  - 'SINGLE-KEY CONTROL: each ciphertext must fail authentication under a third, unrelated key, confirming the collision is engineered rather than a broken tag check.'
  - 'TEST-VECTOR PRECONDITION: the GCM implementation passes the specification test vectors before any certificate is minted.'
  falsification_conditions:
  - The linear system is inconsistent at standard parameters, meaning the construction does not apply as described.
  - An independent implementation rejects a certificate.
  interpretation_limits: >-
    A key-commitment certificate requires the adversary to CHOOSE BOTH KEYS. It is
    not a confidentiality break, not a forgery under an unknown key, and no
    record may present it as either. Nothing here is a statement about any
    deployed product.
  sota_delta: >-
    No new attack. The delta is instrumentation: this program acquires a
    top-tier, instantly verifiable artifact at full parameters, which every later
    record in the goal is scored against.
  dominated_by: >-
    Externally dominated by the original publication of the technique, and this
    record says so plainly. Not dominated by any corpus record: no ledger entry
    contains an AEAD commitment certificate.
  estimated_cost: Implementation small; compute negligible.
  recommended_priority: high
  novelty_status: known
  novelty_screen: 'Corpus grep for key commitment / GCM collision: no records. Technique RECALLED as published; WEB NOT CHECKED.'
