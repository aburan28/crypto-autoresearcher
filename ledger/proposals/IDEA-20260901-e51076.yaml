  novelty_screen:
    method: >-
      FILESYSTEM AND LEDGER SCREENING, WEB FOR THE ALPHA LITERATURE. Grepped
      ledger/proposals for Murphy, alpha value, root property, Dickman; read
      the hits. Web search located Murphy's thesis and the Bai-Bouvier-
      Kruppa-Zimmermann note; neither could be opened. The crypto-kb MCP
      server was unavailable.
    results: >-
      The rho-shift heuristic and alpha are standard; the asymptotic
      statement that root properties are a lower-order effect is folklore
      in the NFS literature (RECALLED) but this session found no source
      stating the ceiling as a constant factor with the O(1)-primes budget
      argument, nor a planted-versus-null test of additivity at large
      shifts. IDEA-20260818-17300c is the only ledger record mentioning
      alpha and it is about tower estimation sensitivity.
    verdict: >-
      UNVERIFIED. The ceiling is very probably known in spirit to
      practitioners and possibly stated in Murphy's thesis or the BBKZ note,
      neither of which was read; the planted-shift additivity test is not
      found. Honest label unverified.

  object_first_candidate:
    tracked_object: >-
      THE LOCAL SPLITTING VECTOR (omega_f(p))_(p <= B') OF A POLYNOMIAL,
      collapsed to the scalar alpha_f, and followed from the selection
      lattice through the smoothness probability into the balance. Off-
      limits as the primary lens: every size-based polynomial selection
      (base-m, Kleinjung, Montgomery, Prest-Zimmermann), which act on sigma
      and are IDEA-20260901-d88b5c's object; Coppersmith's multiple
      polynomials; sieving variants.
    lossiness: >-
      PASSES. The projection f -> (omega_f(p))_p -> alpha_f discards the
      polynomial and its size and keeps a vector of small integers, then one
      real number; it is lossy and not a change of coordinates. What is
      discarded is discarded compatibly with the sieve, because the
      divisibility of F(a, b) by p depends on (a : b) modulo p and on
      omega_f(p) only, so the retained vector propagates deterministically
      through the sieve's per-prime step; what the further collapse to alpha
      discards, the distribution of the p-adic valuations beyond their
      expectation, is exactly what the additivity test probes.
    propagation: >-
      One step is one prime: the expected log p-part of F(a, b) is a
      deterministic function of omega_f(p), and the alpha sum is the
      accumulation over primes. The record's test asks whether the
      accumulated shift acts on u as the sum says, i.e. whether the per-prime
      steps compose additively into the smoothness probability.
    survival_score: >-
      Survives for every polynomial and every sieve; dissolves as an
      exponent-relevant object at the first line of claim (B), which is the
      point -- the object is well-defined and its reach is a constant.

  proof_search_map:
    bottleneck: >-
      The argument u of the Dickman term. The decision-changing question is
      whether any constructible modification of the polynomial shifts u by
      an amount that grows with N; the record derives that the root property
      shifts it by O(1 / log log N) within any subexponential budget.
    baseline_embedding:
      parameter_slice: >-
        k = 0 forced primes gives alpha of a generic polynomial and the
        unmodified balance; the ceiling formula at k = 0 must return gain
        exactly 1, and at the classical parameters (delta^3 = 3, beta^3 =
        8/9) with k = 3 it returns exp(delta C_3 / (3 beta)), which is
        computed and stored as the fixture.
      reproduction_check: >-
        Symbolic: expand rho(u - Delta) / rho(u) with rho(u) = u^(-u(1+o(1)))
        and Delta = (delta C_k / beta) / log log N, confirm the limit is
        exp(delta C_k / (3 beta)); numeric: the fixture value at k = 3 with
        C_3 = log 2 + (log 3)/2 + (log 5)/4.
    observation_collision:
      observable: >-
        The smooth fraction over the box, compared between the planted and
        null arms. Two polynomials with the same alpha but different
        splitting vectors (few primes with many roots versus many primes with
        one extra root each) could give different smooth fractions if
        additivity fails in a prime-dependent way; the record includes both
        patterns at matched alpha as a fiber pair.
      distinct_preimage_search: >-
        Construct, at matched size and matched alpha within 0.05 nats, a
        planted polynomial concentrating its roots on k = 2 primes and one
        spreading them over k = 6 primes; equality of smooth fractions is the
        additivity prediction, inequality localises where the heuristic
        bends.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          A resource measure (alpha) that lower-bounds the gain, a
          specialisation (CRT-forced splitting) that makes it large, and a
          packing over disjoint blocks (distinct primes) whose additivity is
          exactly what is tested rather than assumed.
        predicted_gain: >-
          The method's intrinsic ceiling, a constant, stated in closed form
          with its constant measured -- which is what section D of KN-TECH-080
          asks a specialise-measure-pack argument to end with.
    quantifier_order: >-
      FOR ALL polynomial-selection procedures with budget L[1/3, s] for any
      fixed s, and FOR ALL N, the u-shift obtainable from root properties is
      at most (delta C_(3s/delta) / beta) / log log N (1 + o(1)), assuming
      the rho-shift heuristic; the witness polynomial may depend on N and s,
      the bound may not. The toy test quantifies over the tested u range and
      box only.
    method_ceiling:
      strongest_certifiable_claim: >-
        A closed-form constant-factor ceiling for root-property gains under
        the rho-shift heuristic, plus a measured additivity ratio at toy u.
        It cannot certify the heuristic beyond the u range tested and cannot
        say anything about size-based selection or about more than two
        polynomials.
      nearby_object_control: >-
        THE SPECIAL-FORM POLYNOMIAL x^d - c, whose root property is
        structurally rich (roots modulo every p with p = 1 mod d contributing
        d roots) and whose alpha is far from generic; on it the additivity
        prediction is known in practice to be used successfully (RECALLED),
        so it is the object where the conclusion is expected to hold and
        serves as the positive anchor for the instrument.
    proof_obligations:
      - claim: >-
          The density of completely split degree-d polynomials modulo p is
          1 / d! (1 + O(d^2 / p)) and the CRT-forced sublattice has index
          P^(d+1) for planting and (d!)^k in density for counting.
        responsibility: size
      - claim: >-
          The budget-to-primes conversion k = 3 s / delta + o(1).
        responsibility: runtime
      - claim: >-
          The u-shift limit and the constant-factor gain formula.
        responsibility: correctness
      - claim: >-
          alpha has O(1) standard deviation over the base-m ensemble and its
          extreme value over K samples grows like sqrt(log K).
        responsibility: success_probability
      - claim: >-
          Scope: two polynomials, base-m lattice, the rho-shift heuristic,
          the u range tested.
        responsibility: scope

  assumptions:
    - >-
      Exact alpha is computable for every polynomial in the test from root
      counts modulo primes up to 2000 (standard formula, to be taken from
      the BBKZ note or CADO's implementation, with the formula recorded).
    - >-
      The base-m lattices and smoothness-counting instrument of
      IDEA-20260901-d88b5c and IDEA-20260816-9cfbac are available; this
      record adds the CRT planting and the null construction.

  predictions:
    - metric: >-
        ceiling_fixture, the constant exp(delta C_k / (3 beta)) at the
        classical parameters for k = 1..6
      direction: different
      minimum_effect: >-
        Reproduces exactly from the closed form; at k = 3 the value is
        exp(1.4422 times 1.6448 / (3 times 0.9615)) = exp(0.822) = 2.28,
        computed here by hand and to be recomputed. A mismatch is a
        derivation error.
    - metric: >-
        additivity_ratio, measured smooth-fraction ratio planted over null
        divided by the rho-shift-predicted ratio, per u in [3, 8] and per k
        in {2, 4, 6}
      direction: different
      minimum_effect: >-
        (ADD) within [0.77, 1.3] everywhere; (SUB) below 0.6 at some u with
        a monotone trend in the planted alpha; (SUPER) above 1.6 likewise.
        Between is reported as a weak deviation with its direction.
    - metric: >-
        pattern_fiber_gap, the ratio of smooth fractions between the
        concentrated (k = 2) and spread (k = 6) planted polynomials at matched
        alpha and matched size
      direction: different
      minimum_effect: >-
        Within [0.8, 1.25] under additivity; outside means alpha is not a
        sufficient statistic for the gain and the splitting vector must be
        retained.
    - metric: >-
        alpha_extreme_slope, the fitted coefficient of sqrt(2 log K) in the
        minimum alpha over K random base-m polynomials, K up to 10^6
      direction: different
      minimum_effect: >-
        A fitted slope within 30 per cent of the measured standard deviation
        of alpha, i.e. Gumbel-consistent; a slope growing faster than
        sqrt(log K) would mean the alpha distribution has a heavy tail and
        the sampling ceiling is understated.
    - metric: >-
        inflation_check, measured coefficient inflation of the planted
        polynomials relative to the unplanted base-m shortest vector
      direction: higher
      minimum_effect: >-
        Equal to P^(1 - 1/(d+1)) within the LLL constant band for CRT
        planting; this confirms the size accounting used in the ceiling.

  minimal_test:
    design: >-
      FIVE STEPS. STEP 0 (zero compute): symbolic derivation of the ceiling
      and the fixture table. STEP 1: for 20 semiprimes at 128 and 192 bits
      and d in {4, 5}, build the base-m lattice, and for k in {2, 4, 6}
      construct (i) PLANTED polynomials by CRT-forcing complete splitting at
      the first k primes then reducing, (ii) NULL polynomials by CRT-forcing
      a random residue pattern with the generic expected root count at the
      same primes then reducing, so both arms carry the identical inflation
      P; record coefficient sizes and exact alpha for every polynomial. STEP
      2: over one fixed coprime box per (N, d), count B-smooth norm products
      for B from 2^14 to 2^22 with trial division, both arms; compute the
      rho-shift-predicted ratio from the measured mean log norms and the
      exact alphas; report the additivity ratio per u. STEP 3: the fiber
      pair, concentrated versus spread planting at matched alpha. STEP 4:
      sample up to 10^6 random base-m polynomials at one (N, d), compute
      alpha, fit the extreme-value slope. STEP 5: the special-form anchor,
      x^d - c on a matching special N, run through the same instrument.
    controls:
      - >-
        SIZE-MATCHED NULL with identical CRT inflation, so the only
        difference between arms is the splitting pattern.
      - >-
        POSITIVE ANCHOR, the special-form polynomial where the heuristic is
        expected to hold.
      - >-
        FIBER PAIR at matched alpha and size, distinguishing alpha from the
        splitting vector.
      - >-
        PRE-REGISTRATION of primes, boxes, bounds, thresholds and the alpha
        formula before any count.
      - >-
        THE k = 0 SLICE (no planting) reproducing IDEA-20260901-d88b5c's
        Dickman ratios as the baseline of the instrument.
    required_metrics:
      - ceiling fixture values
      - per-arm coefficient sizes and exact alphas
      - smooth fractions per arm, per B, with binomial intervals
      - additivity ratio per u and k
      - fiber-pair gap
      - alpha extreme-value slope and the alpha standard deviation
      - anchor results, seeds, box definitions, rebuild receipt

  falsification_conditions:
    - >-
      The ceiling fixture does not reproduce. Derivation error, nothing read.
    - >-
      Additivity ratio in the (SUB) or (SUPER) band with a monotone trend in
      alpha. The rho-shift heuristic bends at large shifts; the ceiling's
      constant is recalibrated and the deviation is reported as a scoped
      finding about the heuristic at toy u -- which would also bear on every
      polynomial-selection score in use.
    - >-
      Fiber-pair gap outside its band. alpha is not sufficient; the
      splitting vector is the object and the ceiling must be restated on it.
    - >-
      Inflation check fails. The size accounting is wrong and the budget-to-
      primes conversion must be redone.
    - >-
      Anchor fails. The instrument is broken and nothing is read.

  confounders:
    - >-
      SIZE AND ROOT PROPERTY ARE CORRELATED in any lattice reduction (a
      polynomial forced to split is a different lattice vector with a
      different size). MITIGATION: the null carries the identical CRT
      constraint structure and inflation, and residual size differences are
      corrected through the measured mean log norm before the prediction is
      formed.
    - >-
      PROJECTIVE ROOTS AND RAMIFIED PRIMES complicate alpha. MITIGATION:
      the exact alpha formula used is recorded and the same for both arms;
      primes dividing the leading coefficient or discriminant are excluded
      from planting.
    - >-
      SMALL-u REGIME. At u below 3 rho is close to 1 and the ratio is
      insensitive. MITIGATION: bounds chosen so u spans 3 to 8.
    - >-
      TRIAL-DIVISION SMOOTHNESS at 2^22 is slow over a large box.
      MITIGATION: box sized to 10^6 pairs per arm; intervals reported.

  interpretation_limits:
    - >-
      CLAIM TIER (a) for the ceiling, a conditional statement under the rho-
      shift heuristic, and tier (b) for the additivity measurement at 128-192
      bits. No constant, exponent or cofactor moves; the record's whole
      content is that they cannot via this object, and how the heuristic
      underneath behaves at toy u.
    - >-
      Root-property gains at practical sizes are real constant factors that
      practitioners exploit; nothing here says they are small in practice,
      only that they are constants in the L-analysis.
    - >-
      The additivity result is scoped to the box, bounds and u range run and
      says nothing about record-scale u.
    - >-
      Nothing here is a statement about any deployed key.

  heuristic_assumptions:
    - id: H1
      statement: >-
        RHO-SHIFT ADDITIVITY. For a binary form F over a coprime box, the
        probability that F(a, b) is B-smooth equals rho((log|F| + alpha_F) /
        log B) (1 + o(1)) uniformly for u in a range including
        (log N)^eps < u < (log N)^(1-eps) and for alpha_F up to a constant
        fraction of log|F| -- the last clause being the untested part.
      rigorous_support: >-
        RIGOROUS INGREDIENT: for each prime p the density of (a, b) with
        p^j dividing F(a, b) is exactly computable from omega_F(p) by
        Hensel lifting, so the EXPECTED log of the B'-smooth part of F is a
        theorem for any fixed set of primes. CLASSICAL STATEMENT IMITATED:
        Dickman-de Bruijn for a random integer of size |F| e^alpha; the
        bounded-u rigorous version for forms is BBDT 2012 and the conditional
        polynomial version with local factors is Martin 2002. THE GAP: the
        cofactor after the forced part is assumed random-like independently
        of how much was forced.
      falsification_condition: >-
        Additivity ratio outside [0.77, 1.3] with a monotone trend in
        alpha, or a fiber-pair gap outside [0.8, 1.25].
      validation_plan: >-
        SAMPLE: 10^6 coprime pairs per arm per (N, d, k), 40 polynomials,
        bounds 2^14 to 2^22. SHORTCUT: none needed. COMPARISON: measured
        ratio of smooth fractions against the rho-shift prediction from
        exact alphas and measured mean log norms. TAIL CHECK: the largest-
        prime-factor CDF of the planted arm against the shifted prediction,
        and the smoothest observed norm against its predicted probability.
        TRANSFER: none claimed beyond the u range run.
    - id: H2
      statement: >-
        ALPHA ENSEMBLE. Over the base-m lattice's short vectors, alpha is
        approximately normal with bounded variance and its minimum over K
        independent samples grows like sqrt(2 log K) times the standard
        deviation.
      rigorous_support: >-
        RIGOROUS INGREDIENT: the variance of alpha is a convergent sum over
        primes of (log p)^2 Var(omega(p)) / (p-1)^2 when omega(p) behaves as
        the number of roots of a random polynomial modulo p (mean 1, bounded
        variance). CLASSICAL STATEMENT IMITATED: the central limit theorem
        and the Gumbel extreme-value law for i.i.d. normal maxima; the
        BBKZ note (RECALLED) is believed to give the distribution. THE GAP:
        lattice vectors are not independent samples and short vectors may
        have biased root counts.
      falsification_condition: >-
        Extreme-value slope outside 30 per cent of the measured standard
        deviation, or a heavy tail in the alpha histogram.
      validation_plan: >-
        SAMPLE: 10^6 short-ish vectors of one base-m lattice by randomised
        reduction, exact alpha each. COMPARISON: histogram against normal;
        running minimum against sqrt(2 log K) times sd. TAIL CHECK: the
        overall minimum against the Gumbel quantile. TRANSFER: none.

  target_complexity:
    time_exponent: >-
      NO CHANGE CLAIMED. L[1/3, 1.923] before and after; the root property's
      reach is a constant factor exp(delta C_k / (3 beta)) with k = O(1),
      derived in claim (B). This record is EXPLICITLY a building block, the
      closure of the second term of the balance, and says so; its priority
      is that of completing the section-4 closure IDEA-20260901-d88b5c
      begins, so that the two-polynomial lane has a named obstruction on
      BOTH terms.
    memory_exponent: >-
      Unchanged.
    best_known: >-
      For root-property exploitation in practice, Murphy's alpha and
      Kleinjung's size-and-root optimisation as used in the records
      (RECALLED); no asymptotic claim to compare against exists in the
      sources reached.
    hidden_overhead: >-
      DISCLOSED. The constant itself depends on which primes are forced and
      on delta and beta; at toy sizes the same mechanism gives factors of a
      few, which is why practitioners care and why the L-analysis does not.
    tradeoff_note: >-
      None; the object does not touch memory or parallelism.

  dominated_by: >-
    CHECKED, n/a (no result claimed). No attack point. As an analysis it may
    be dominated by Murphy's thesis or the BBKZ note if either states the
    constant-factor ceiling, neither of which was read; as a measurement it
    is not dominated by any record in this ledger.
  sota_delta: >-
