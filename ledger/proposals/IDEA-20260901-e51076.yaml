idea:
  id: IDEA-20260901-e51076
  question_id: RQ-GNFS-c6ce52
  research_question: RQ-GNFS-c6ce52
  goal_id: null
  added: '2026-09-01'
  title: >-
    THE OTHER TERM OF THE BALANCE IS THE DICKMAN ARGUMENT, AND THE ONLY
    CONSTRUCTIBLE HANDLE ON IT IS THE ROOT PROPERTY. Derive the ceiling of
    root-property exploitation inside any subexponential polynomial-selection
    budget -- forced complete splitting at O(1) small primes shifts u by
    O(1 / log log N) and buys a CONSTANT factor exp(delta C / (3 beta)),
    while extreme-value sampling of L[1/3, s] candidates buys a factor
    1 + o(1) -- so the root property cannot move the constant, the o(1), or
    even a log cofactor; then test the Murphy rho-shift heuristic that the
    ceiling rests on in the regime where nobody has validated it, planted
    shifts that are a constant fraction of u at toy sizes, against a size-
    matched null with generic splitting, so that additivity, sub-additivity
    or super-additivity of the shift is measured rather than assumed
  class: control

  claim: >-
    FOUR SEPARABLE CLAIMS. (A) THE TERM. IDEA-20260901-d88b5c shows the
    polynomial pair enters the L[1/3] balance through the norm-size term
    sigma and closes the two-polynomial route on that term. The balance has
    one other term, the smoothness probability rho(u) with u = log(norm) /
    log B, and the only handle a polynomial-selection procedure has on it is
    the root property: a polynomial f with omega_f(p) roots modulo p has
    values whose expected log of the p-part exceeds a random integer's by
    (omega_f(p) - 1) log p / (p - 1) per prime, summarised by Murphy's alpha,
    and the standard heuristic (RECALLED from Murphy 1999 and its successors;
    the Bai-Bouvier-Kruppa-Zimmermann analysis could not be reached this
    session) is that F(a, b) is B-smooth as often as a random integer of size
    |F| exp(alpha_f). (B) THE CEILING, DERIVED HERE. With d + 1 = delta
    (log N / log log N)^(1/3) and B = L[1/3, beta], forcing f in the base-m
    lattice to split completely modulo the first k primes costs a density
    (d!)^(-k) in the lattice (the fraction of degree-d polynomials over F_p
    that split completely is about 1 / d!), hence a coefficient inflation of
    (d!)^(k/(d+1)) and a search cost of about (d!)^k = exp(k d log d) trials;
    a selection budget of L[1/3, s] therefore allows k = 3 s / delta + o(1),
    a CONSTANT number of primes. The alpha gain is (d - 1) C_k with C_k the
    sum of log p / (p - 1) over those primes, so the u-shift is (d - 1) C_k /
    log B = (delta C_k / beta) (log log N)^(-1) (1 + o(1)), which tends to
    ZERO, and the smoothness gain is rho(u - Delta u) / rho(u) = exp(Delta u
    (log u + 1)) = exp(delta C_k / (3 beta)) (1 + o(1)), a CONSTANT --
    numerically about e^1 at the classical parameters for k = 3 or 4. The
    coefficient inflation costs (k / (d + 1)) log d! = O(k log d) in log-norm,
    which is o(log B) and hence also inside the constant. Random sampling
    does worse: alpha over the lattice ensemble has O(1) standard deviation
    (its variance is a convergent prime sum), so the best of K = L[1/3, s]
    samples has alpha of order sqrt(log K), a u-shift of order (log N)^(-1/6)
    and a gain of 1 + o(1). CONCLUSION: the root property moves neither the
    constant, nor the o(1), nor a (log N)^c cofactor; it is a constant-factor
    ingredient, and RQ-GNFS-c6ce52's search-heuristic rule says so must be
    said plainly. (C) THE HEURISTIC UNDERNEATH IS UNTESTED WHERE IT IS
    LARGEST. The ceiling and every practical polynomial-selection score rest
    on the rho-shift heuristic. It is validated in practice at |alpha| of a
    few nats against u of ten or more (RECALLED); at toy sizes -- small d,
    small log B -- a planted shift can be a constant fraction of u, and that
    is exactly where the heuristic's additivity is a hypothesis. The record
    plants complete splitting at k small primes by CRT in the base-m lattice,
    builds a SIZE-MATCHED null with the same CRT inflation and a generic
    residue pattern, and measures the ratio of smooth fractions over the same
    box against the rho-shift prediction computed from the two polynomials'
    exact alpha values. Three pre-registered outcomes: (ADD) the measured
    ratio equals the predicted ratio within a factor 1.3 across u in [3, 8];
    (SUB) the measured ratio is materially below the prediction, the forced
    small-prime divisibility being worth less than the shift says, which
    would mean the cofactor after removing the forced part is not random-
    like; (SUPER) materially above. Each outcome recalibrates the ceiling's
    constant and none changes its order. (D) NOT CLAIMED. No constant or
    exponent moves; no polynomial-selection method is proposed; nothing is
    said about any deployed key.

  mechanism: >-
    The smoothness gain from a shift Delta of log-norm is, to leading order,
    rho(u - Delta / log B) / rho(u) = exp((Delta / log B)(log u + 1)), and in
    the NFS regime log u is (1/3) log log N; so a gain that is not a constant
    needs Delta / log B to grow, i.e. Delta to grow faster than (log N)^(1/3)
    (log log N)^(2/3). The root property supplies Delta = (d - 1) C_k which
    grows like (log N)^(1/3) (log log N)^(-1/3) times C_k, and C_k grows only
    with the number k of forced primes, which the budget pins at O(1) because
    forcing each prime multiplies the search by d!. The two growth rates
    differ by exactly one power of log log N, which is why the u-shift
    vanishes and the gain is a constant. The toy test does not test that
    arithmetic; it tests the premise that the shift acts on u additively,
    which is what 'a random integer of size |F| e^alpha' means and what
    breaks first if forced divisibility and the residual cofactor are
    correlated.

  novelty_status: unverified

