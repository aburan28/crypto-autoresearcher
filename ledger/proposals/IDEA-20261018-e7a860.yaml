idea:
  id: IDEA-20261018-e7a860
  title: Measure K, the column-touch to group-operation conversion for the m=4 oracle
  class: measurement
  question_id: RQ-ICPERF-94c86e
  area: ICPERF
  goal_ids:
  - GOAL-ICPERF-e6b6a4
  status: proposed
  proposed_by: idea-generator (Sonnet subagent logging the missed items of the 2026-10-18 index-calculus
    review)
  added: '2026-10-18'
  claim: K, the number of ecbench group operations (GAE) per Macaulay column touch in the current m=4
    oracle, is measurable, and the sign of the ECC2K-130 m=4 rows (+7.6 to +10.32 bits over rho, in unconverted
    column-touch units) flips only if log2 K < -7.6 (resp. -10.32); K above 1 widens the gap.
  mechanism: Every m=4 price row is in column touches while rho is in group operations with the measured
    2^60.81 constant. Count the field multiplications, squarings and inversions per column touch inside
    the oracle and convert them to the counted group-operation unit used by ecbench, then recompute the
    rows. perf-ipc refuses to estimate on hosts without a hardware PMU; on such hosts use instrumented
    field-operation counters, not cycles.
  novelty_status: unverified
  regime: binary m=4 Weil-descent oracle; unit conversion; 2-4 days with the other integrity items
  citations:
  - ref: crypto:research/ic_leads_review_20261018/README.md 3.2 bullet 2, 1 item 4-5, 4 row 3
    provenance: internal
    claim: Source of the opportunity, the measured figures quoted here and the cost estimate; desk review,
      no new measurement, costs are the reviewer's estimates.
    verified_by: idea-generator
  - ref: crypto:research/notes/ecc2k130/RESEARCH_ECC2K130_DESCENT_DEGREE.md
    provenance: internal
    claim: 'Points 6-8: rows in unconverted column-touch units; rho 2^60.81.'
    verified_by: idea-generator
  - ref: crypto skill ecbench-bounds / perf-ipc
    provenance: internal
    claim: Counted-unit and PMU-detection rules.
    verified_by: idea-generator
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
    - KR-IC-5765d2
    - KR-IC-955fd6
    - KR-IC-889857
    nearest:
    - ref: KR-IC-889857
      provenance: internal
      relation: adjacent
      delta: The disputed binary subexponential rows are priced in unconverted units; this supplies a
        measured conversion factor, no new algorithm.
    searched:
      note: Positioned against the cited review and the records it names. The frontier map was not rendered
        or matched in this logging pass; the Coordinator should run tools/build_frontier_map.py --match
        before ranking. A missing row is not evidence of novelty.
  assumptions:
  - K is approximately constant over the cells priced; if it depends on degree or n, K(d,n) is reported.
  - The group-operation unit is ecbench GAE with field-op costs from the harness.
  predictions:
  - metric: log2_K
    direction: different
    minimum_effect: Reported with interval; prediction is that the row's sign does not flip (log2 K >
      -7.6).
  - metric: ECC2K130_m4_row_converted_bits_over_rho
    direction: different
    minimum_effect: Recomputed row in group operations, with the 0/0.1/1 GAE unpriced-work band.
  minimal_test:
    design: Instrument the current m=4 oracle for field multiplications, squarings and inversions per
      column touch, run a perf-ipc session (or the counter fallback where no PMU) on one fixed cell, convert
      with the harness field-op costs, repeat at two more cells to test constancy, and recompute the three
      price rows.
    controls:
    - A/A repeat
    - known field-op microbenchmark as positive control
    - two further cells for constancy of K
    required_metrics:
    - field mul/sqr/inv per column touch
    - K with interval
    - converted row bits over rho
    - PMU availability
  falsification_conditions:
  - Measured log2 K > -7.6 with interval excluding it refutes 'the conversion alone can decide the sign'
    in the favourable direction.
  - K varying by more than the interval across cells refutes a single-constant conversion.
  confounders:
  - bit-sliced vs word-level implementation
  - cache effects
  - PMU absent on cloud VMs
  interpretation_limits:
  - Converts units; does not change the algorithm. A relabelling/accounting result unless it moves a verified
    end-to-end S.
  heuristic_assumptions:
  - id: H1
    statement: K is constant across degrees at fixed m.
    rigorous_support: Same kernel at every degree.
    validation_plan: Measure at three cells and test for equality.
  target_complexity:
    time_exponent: No exponent. Accounting debt that can decide the sign of the +7.6 to +10.3 bit rows.
    memory_exponent: No exponent claimed; memory is the measured constraint, reported as peak RSS.
    best_known: Matched generic rho, r^0.5 group operations; the index-calculus baseline is Table A/B
      of crypto:docs/ic/LEADERBOARD.md (5.23x to 21x matched rho on Koblitz, 5.47x to 13.5x on prime fields).
      Report this row's gap to matched rho (and to Bernstein-Lange where setup is excluded) as distance
      remaining.
    hidden_overhead: Every phase, cold, is charged; unpriced native work is priced at 0, 0.1 and 1 GAE
      per operation (AGENTS.md 5a) wherever two arms are ranked.
    tradeoff_note: Not applicable beyond the stated resource envelope.
  estimated_cost:
    implementation: low
    compute: low (one perf-ipc session)
  recommended_priority: high
  dominated_by: No attack result; the item is an unrun measurement or an unpaid baseline debt.
  sota_delta: Not an improvement (accounting); a prerequisite for reading any m=4 row.
