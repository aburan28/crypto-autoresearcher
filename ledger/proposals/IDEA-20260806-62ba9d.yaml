idea:
  id: IDEA-20260806-62ba9d
  question_id: RQ-SSI-001
  goal_id: GOAL-SSI-001
  added: '2026-08-06'
  title: >-
    SCOPE AND COST-MODEL WORK, NOT EXPONENT WORK: the campaign's 2^{120-123} figure is
    quoted for SQIsign but the theorem it rests on is about OneEnd, and the two
    polynomial-time reductions bridging them have never been charged -- a reduction
    resource ledger with a trivial-reduction null that must return zero
  class: cost-model

  claim: >-
    STATED FIRST AND PLAINLY, AS THE HANDOFF REQUIRES: THIS RECORD MOVES NO EXPONENT AND
    CLAIMS NONE. The reductions it charges are polynomial-time, so the exponent 1/3 is
    unaffected by anything here. It is scope and cost-model work, and its value is that it
    decides what this campaign's single headline number is a number ABOUT.
    EV-SSI-59f7a2 records "The theoretical security of SQIsign NIST-I under Wesolowski's
    algorithm is 2^{120-123} AES-equivalent (6-8 bits below 128)" and DEC-20260805-596d71
    repeats it. SQIsign key recovery is the ISOGENY / EndRing problem. THE THEOREM IS NOT
    ABOUT THAT PROBLEM. Theorem 1.1 of the frozen source (inputs/P13-WESOLOWSKI-2026/
    paper_fulltext.md line 19, READ) is about OneEnd: "finds a non-scalar endomorphism
    alpha in End(E) \ Z". The bridge is Corollary 1.2 (line 23, READ), which reaches
    EndRing and Isogeny "applying the computational reductions [35, Theorem 1] and
    [35, Proposition 8.5]" -- two external results this corpus has never opened, never
    charged, and never scoped.
    A POLYNOMIAL-TIME REDUCTION IS NOT A FREE REDUCTION, AND FOUR SPECIFIC CHARGES ARE
    NAMEABLE IN ADVANCE:
      (R1) CALL COUNT. EndRing wants four generators of a rank-4 lattice; OneEnd returns
           one non-scalar endomorphism. If the reduction makes k calls to OneEnd, the
           concrete cost is k * 2^{120-123}, i.e. log2(k) bits added to a figure whose own
           disputed margin is 6-8 bits. k = 4 is 2 bits; k = 16 is 4 bits. THE CAMPAIGN
           HAS NEVER WRITTEN DOWN k.
      (R2) PEAK MEMORY. Each OneEnd call holds a table of 2^{92.5} entries (EV-SSI-59f7a2,
           and the frozen source's section 4.1, both READ). If the reduction needs two
           calls' outputs but not two tables simultaneously, memory is unchanged; if it
           needs concurrent tables, memory rises by log2(k). The campaign's memory-
           infeasibility finding -- the load-bearing reason the attack is called
           theoretical -- is stated for ONE table.
      (R3) SATURATION AND ITS INTEGER OBLIGATION. The endomorphisms Algorithm 3 returns
           have the shape omega_hat o phi o alpha o omega (line 207, READ), whose degree
           carries the square of the re-randomising walk degree, so they are LARGE-NORM and
           the suborder they generate has an index in End(E) that is an integer of size
           polynomial in p but of unknown factorisation. Saturating a lattice at an unknown
           index is the step where "polynomial time" most often hides a conditional. THIS
           IS RECALLED AND UNVERIFIED and is exactly the kind of step Corollary 1.2's
           citation makes invisible.
      (R4) DIRECTION AND ORDER. Isogeny(E, E') needs BOTH endomorphism rings, so it is at
           least two independent EndRing solves, each of which is at least k OneEnd solves.
           The multiplier compounds.
    THE DELIVERABLE IS A REDUCTION RESOURCE LEDGER: for each edge of the chain
    OneEnd -> EndRing -> Isogeny, the charged vector (calls, peak memory, auxiliary integer
    obligations, unconditional/conditional), and a scope statement partitioning every
    committed claim in this goal into "about OneEnd" and "about SQIsign". PRE-REGISTERED
    AND IT CAN FAIL IN BOTH DIRECTIONS: if the total charge is under 3 bits, the campaign's
    figure survives its own scope audit strengthened, and the record says so; if it exceeds
    6-8 bits, THE COMMITTED GAP BELOW 128 IS CONSUMED BY A STEP NOBODY CHARGED and the
    headline finding is a statement about OneEnd only.

  discriminated_from:
    nearest_existing_idea: IDEA-20260805-d66193
    why_it_is_the_nearest: >-
      d66193 is the only committed record that audits the RELATIONSHIP between a complexity
      claim and the problem it is a claim about, and it explicitly uses the
      connecting-ideal-plus-KLPT consequence chain as its reasoning device, labelling that
      chain "RECALLED, UNVERIFIED -- verifying it against a corpus record is a stage".
    differing_observable: >-
      THE CHARGED RESOURCE VECTOR OF THE REDUCTION, VERSUS THE QUANTIFIER PREFIX OF A
      THEOREM. d66193's observable is the (forall/exists) prefix of two theorem statements
      and its question is which INPUT each is about; its output is a two-branch fork about
      an external paper. This record's observable is a triple of numbers -- (k, peak memory
      exponent, number of unconditional steps) -- attached to an EDGE of a reduction chain,
      and its output is a bit count added to a committed concrete-cost figure. Concretely:
      d66193 would be fully answered without knowing k, and this record would be fully
      answered without resolving d66193's fork. They share the reduction chain as a subject
      and measure different things about it.
    also_discriminated_from:
      - >-
        IDEA-20260805-332316 (RQ-WESO-8aff57) -- the sibling quantifier audit of the same
        two 2026 complexities. Same distinction as d66193: quantifier prefix versus charged
        resources.
      - >-
        IDEA-20260803-48e258 -- computes the crossover curve p*(w) from committed numbers.
        Its cost model runs entirely inside OneEnd and never leaves it; the reduction chain
        appears nowhere in it. If this record finds k > 1, every point of p*(w) shifts by
        log2(k) bits, which is a concrete dependency and a concrete difference.
      - >-
        IDEA-20260805-bc8246 -- charges the cost FUNCTIONAL over one algorithm's tradeoff
        curve. This record charges the COMPOSITION of several invocations of that algorithm
        plus auxiliary arithmetic. bc8246's three functionals are all applied to a single
        (A, T) pair; here the question is what (A, T) pair the campaign should have been
        applying them to.
      - >-
        IDEA-20260725-001 -- full-cost re-baselining of MITM vs low-memory vs
        Delfs-Galbraith, disposition confirmed_baseline_cost_model_closed. It compares
        ALGORITHMS for one problem; this record charges the REDUCTIONS between problems.
        The lane 725-001 closed is the algorithm-comparison lane and this is not it.
      - >-
        No pre-ledger catalogue entry in slices B1, B2, B3, C1 or C2 charges a reduction.
        C1-10 is "the o(1) ledger: an exact, signed accounting of every o(1) and polylog in
        the chain" -- and its chain is the chain INSIDE Theorem 1.1's proof (Lemma 3.3 ->
        Lemma 3.5 -> Theorem 1.1), not the chain from Theorem 1.1 to Corollary 1.2. That
        boundary is exactly where this record starts, and the two compose.

  object_first_candidate:
    tracked_object: >-
      THE CALL GRAPH of the reduction chain, projected to a RESOURCE VECTOR
      v = (calls to OneEnd, peak simultaneous memory in table-units, count of auxiliary
      integer obligations, conditionality flags). Not the mathematics of any reduction:
      four numbers per edge.
    one_step_propagation_rule: >-
      The vector composes deterministically under the two ways reductions compose, and the
      rules are exact rather than heuristic.
      SEQUENTIAL COMPOSITION (A then B): calls add, peak memory is the MAX, obligations
      concatenate, conditionality is the OR.
      NESTED COMPOSITION (A calls B m times): calls multiply by m, peak memory is
      max(A's own, B's) if outputs are consumed one at a time and is m * B's if they are
      held, obligations concatenate with multiplicity, conditionality is the OR.
      THE MEMORY RULE IS THE ONE THAT CAN GO EITHER WAY AND IT IS THE ONE THE LEDGER MUST
      DECIDE PER EDGE. That is a genuine one-step propagation rule with a decidable
      branch, not bookkeeping.
    established_families_off_limits: >-
      OFF-LIMITS AS THE PRIMARY LENS: every attack family. This record proposes no
      algorithm, no mechanism and no improvement. Specifically off-limits: MITM/claw/vOW,
      KLPT as an attack (it appears only as a subroutine whose cost is being charged),
      orientation/CM (closed by DEC-20260804-3677f1), torsion-image/Kani, quantum,
      SQIsign transcript statistics, CSIDH/FC0. ALSO off-limits: re-litigating the
      2^{120-123} figure itself, which is committed and which this record takes as given
      and asks only what it is a figure about.
    newness_score: >-
      As mathematics, nil -- charging a reduction is bookkeeping. As a scope audit it is
      the one bridge in this campaign's whole argument that has never been inspected, and
      the audit at
      coordination/goals/GOAL-SSI-001/batches/BATCH-b3c87f/tasks/TASK-20260806-fd3518/duplication_audit.md
      records that no committed record and no pre-ledger catalogue entry charges it.
    testability_score: >-
      High for the structure, blocked at one point and the record says where. The
      composition rules, the null arms and the scope partition are pen and paper. The
      actual values of k and the saturation obligation require [35], which is UNREACHABLE
      from this environment, so the ledger's honest output is a SET OF CELLS, some filled
      with derived bounds and some marked SOURCE-BLOCKED with the exact question to ask.
      A cell marked SOURCE-BLOCKED is a deliverable; a cell filled by guessing is a
      fabrication and is forbidden.
    survival_score: >-
      The resource vector survives arbitrary composition depth by the rules above. It
      dissolves when a reduction is not a black-box call -- e.g. if [35] uses the internal
      structure of the OneEnd solver rather than its output -- and that possibility is a
      pre-registered cell of the ledger rather than an afterthought.

  mechanism: >-
    STEP 1 -- ESTABLISH THE GAP BY QUOTATION, NOT BY ASSERTION. Frozen source line 19
    (READ): "Theorem 1.1. Assuming Heuristic 1, there is a Las Vegas algorithm which,
    given a supersingular elliptic curve E/F_{p^2}, finds a non-scalar endomorphism
    alpha in End(E) \ Z in expected time and memory p^{1/3+o(1)}." Line 23 (READ):
    "Corollary 1.2. Assuming Heuristic 1, there is a Las Vegas algorithm of expected
    complexity p^{1/3+o(1)} for the supersingular endomorphism ring problem ... and for the
    supersingular isogeny problem". Line 21 (READ): "applying the computational reductions
    [35, Theorem 1] and [35, Proposition 8.5]". Line 234 (READ), which is the ONLY place
    concrete numbers appear: ">= 2^106.5 F_{p^2}-operations and memory >= 2^92.5" for
    log2 p ~ 256 -- and section 4.1's derivation (line 226-230, READ) is entirely about
    ALGORITHM 2's TABLE, i.e. about OneEnd. THE PAPER'S OWN CONCRETE COST SECTION NEVER
    CROSSES THE REDUCTION. EV-SSI-59f7a2 inherits section 4.1's model, corrects its
    ops-per-entry, and then quotes the result as SQIsign security. The uncharged step is
    exactly the corollary.

    STEP 2 -- THE FOUR CHARGES, EACH WITH ITS DERIVED OR SOURCE-BLOCKED STATUS.
    (R1) CALL COUNT k. DERIVABLE IN PART, ZERO COMPUTE. End(E) is a rank-4 Z-lattice
    containing Z. One OneEnd call yields one non-scalar alpha, so Z[alpha] has rank 2.
    Rank 4 therefore needs at least 2 further independent outputs, so k >= 3 on pure rank
    grounds, INDEPENDENT OF WHAT [35] DOES. Whether independence holds with constant
    probability per call, and how many calls the actual reduction makes, is SOURCE-BLOCKED.
    LOWER BOUND log2(3) = 1.585 bits, DERIVED HERE AND CHECKABLE.
    (R2) PEAK MEMORY. Algorithm 3's output is a single endomorphism in an efficient
    representation of size poly(log p); the 2^{92.5}-entry table is destroyed at the end of
    each attempt. So sequential calls with outputs retained cost max(one table, k * poly)
    = one table. PREDICTED CHARGE: 0 bits of memory, unless the reduction requires calls on
    RELATED curves whose tables must coexist. Deriving that predicted 0 and stating the one
    condition under which it fails is the useful output.
    (R3) SATURATION. The endomorphisms returned have degree deg(omega)^2 * p * deg(phi)
    with deg(omega) = 2^n, n = O(log p) (lines 193, 207, READ), so their norms are
    p^{O(1)}. The suborder they generate sits in End(E) at some index M, and recovering
    End(E) means saturating at every prime dividing M. RECALLED, UNVERIFIED: standard
    saturation needs the primes of M, i.e. a factorisation of an integer of size p^{O(1)}.
    IF that is required and unconditional factoring is not assumed, "polynomial time"
    carries a conditional this campaign has never stated. THE LEDGER'S JOB IS TO RECORD THE
    QUESTION PRECISELY, NOT TO ANSWER IT FROM MEMORY. Note the walk length is a free
    parameter: shortening n reduces the norms and hence M, which is a concrete mitigation
    the ledger should price, and it interacts with Heuristic 1's uniformity requirement.
    (R4) ISOGENY NEEDS TWO. Isogeny(E, E') requires End(E) and End(E'), so its charge is
    2 * (EndRing charge) plus the connecting-ideal and KLPT costs. DERIVED: at least
    1 bit on top of EndRing, before any KLPT constant.
    RUNNING TOTAL, DERIVED HERE AND PRE-REGISTERED: EndRing >= 1.585 bits above OneEnd;
    Isogeny >= 2.585 bits above OneEnd. Against a committed gap of 6-8 bits below 128, a
    derived floor of 2.585 bits consumes a THIRD of it before a single source-blocked cell
    is filled.

    STEP 3 -- THE SCOPE PARTITION, WHICH IS THE HALF THAT NEEDS NO EXTERNAL SOURCE AT ALL.
    Partition every committed claim in GOAL-SSI-001 into (a) claims about OneEnd, which the
    theorem and section 4.1 directly support; (b) claims about EndRing or Isogeny, which
    require Corollary 1.2 and therefore the uncharged reductions; (c) claims about SQIsign,
    which require (b) plus the identification of SQIsign key recovery with Isogeny at
    SQIsign's actual parameters. EV-SSI-59f7a2's headline sentence is a (c) claim resting
    on an (a) computation. Producing that partition is zero compute, needs nothing
    unreachable, and is by itself a usable correction to how the campaign states its result.

  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-06'
    corpus_paths_read:
      - inputs/P13-WESOLOWSKI-2026/paper_fulltext.md (Theorem 1.1, Corollary 1.2, Problems 2.2-2.4, Algorithm 3, section 4.1 READ)
      - ledger/evidence/EV-SSI-59f7a2.yaml (full), ledger/decisions/DEC-20260805-596d71.yaml (full)
      - ledger/proposals/IDEA-20260805-d66193.yaml (head), -332316.yaml (head), -48e258.yaml (head)
      - ideas/catalogue-20260805/INDEX.md and the full heading lists of all nine slices
    findings:
      - >-
        A grep of ledger/ for "Corollary 1.2|OneEnd.*EndRing.*reduction|reduction.*cost.*OneEnd"
        returned 15 files; none charges the reduction. The hits are hypothesis and evidence
        records that CITE the equivalence as background.
      - >-
        EV-SSI-59f7a2's boundaries block lists five limitations and none of them is the
        reduction. Its unresolved_confounds lists three and none of them is the reduction.
        This is a reading of that record, not an accusation: the gap is a gap in the
        campaign, not a defect the record concealed.
      - >-
        The paper's own section 4.1 preamble (line 226, READ) says "Let us estimate a lower
        bound on the concrete cost of the algorithm", singular, and every row is a table
        size. The paper does not claim its five rows are SQIsign key-recovery costs.
    literature_verified: []
    literature_unverified:
      - >-
        [35] (the source of both reductions) WAS NOT READ AND IS UNREACHABLE. Every cell of
        the ledger that depends on it is marked SOURCE-BLOCKED with the exact question to
        ask, and none is filled by recollection.
      - >-
        The saturation-needs-factorisation step is RECALLED, UNVERIFIED. It is stated as a
        question, never as a defect of any published result.
    conclusion: unverified.

  lossy_projection_identifiability_audit:
    projection: >-
      The full reduction -- its mathematics, its correctness proof, its intermediate
      objects -- is projected to a four-component resource vector per edge.
    what_is_discarded: >-
      Everything mathematical: why the reduction is correct, what the intermediate ideals
      are, how independence is achieved. Only counts, a maximum, a list of obligations and
      a flag survive.
    why_genuinely_lossy: >-
      Two reductions with completely different mathematics and the same (k, memory,
      obligations, flags) are indistinguishable under this projection, and such pairs
      certainly exist -- any two ways of assembling four generators from k calls. The
      projection cannot reconstruct a proof, an ideal, or an algorithm.
    why_compatible_with_the_operations: >-
      The operations here are composition of reductions, and the vector composes under both
      sequential and nested composition by the exact rules in one_step_propagation_rule.
      That is what makes it a tracked object: the charge of a chain is computable from the
      charges of its edges without reopening any edge.
    is_it_only_a_change_of_coordinates: >-
      NO. From the vector one cannot recover the reduction. The honest caveat: this is a
      WEAK object -- the projection is so lossy that it can only ever produce bit counts,
      never a mathematical statement -- and the record's class is cost-model precisely
      because of that. A weak object with an exactly-composing propagation rule is still an
      object; it is just not one that can move an exponent, and the title says so.
    mirror_failure_check: >-
      CHECKED. The mirror failure is a projection constant across inputs. The vector is
      forced to vary: it is (0, 0, none, unconditional) on the trivial EndRing -> OneEnd
      edge and at least (3, ?, ?, ?) on the OneEnd -> EndRing edge by the rank argument.
      Two distinct values are therefore forced before any source is consulted, so the
      comparator spread is non-zero and the KN-TECH-1a5b7e tell does not fire.

  null_object_control:
    primary_null: >-
      THE TRIVIAL-REDUCTION NULL. Run the identical accounting on the edge
      EndRing -> OneEnd, which is free by inspection: given four generators of End(E), any
      generator not in Z is a OneEnd solution. THE LEDGER MUST RETURN
      (calls = 0, peak memory = 0, obligations = none, unconditional).
    why_it_can_fail: >-
      IT CAN FAIL AND ITS FAILURE INVALIDATES EVERY OTHER CELL. If the accounting charges
      anything on an edge that is free by inspection, it is charging the SHAPE of a
      reduction rather than its content, every derived bit count is inflated by the same
      spurious term, and the ledger may not be used. This is a real risk: an accounting
      built to find hidden costs will find them everywhere unless it is calibrated on an
      edge that has none.
    secondary_nulls:
      - >-
        IDENTITY-REDUCTION GATE: the edge OneEnd -> OneEnd must return
        (calls = 1, memory = 1 table, obligations = none, unconditional). A known-answer
        gate at the other trivial corner.
      - >-
        CAN-THE-LEDGER-SAY-SUPERPOLYNOMIAL CONTROL. Feed the accounting a deliberately
        constructed edge that requires factoring an integer of size p with no auxiliary
        structure, and check that it reports a CONDITIONAL or SUPERPOLYNOMIAL verdict. IF
        EVERY PATH THROUGH THE ACCOUNTING RETURNS "POLYNOMIAL", THE LEDGER IS A CONTROL
        THAT CANNOT FAIL (KN-TECH-1a5b7e) and must be rewritten before use. This programme's
        own record contains 33 consecutive batches of exactly that failure mode and this
        control exists because of them.
      - >-
        SOURCE-BLOCKED-CELL DISCIPLINE CONTROL: at least one cell must end the exercise
        marked SOURCE-BLOCKED. A ledger that fills every cell without [35] has filled at
        least one from recollection, which is a fabrication under AGENTS.md rule 9.

  assumptions:
    - >-
      The reductions are treated as BLACK-BOX callers of a OneEnd oracle. If [35] uses the
      internal structure of a particular OneEnd algorithm, the black-box charge is a lower
      bound only, and that is a pre-registered cell rather than a hidden caveat.
    - >-
      SQIsign key recovery is the Isogeny problem at SQIsign's parameters. This is the
      standard identification and it is used as an assumption, listed here so that the
      scope partition's step (c) is visible rather than implicit.
    - >-
      Everything inherits Heuristic 1 exactly as the frozen source states it. This record
      neither strengthens nor weakens that conditionality.

  proof_search_map:
    bottleneck: >-
      The number of OneEnd invocations k and whether their tables must coexist. Every bit
      in the ledger comes from those two quantities.
    baseline_embedding:
      parameter_slice: >-
        k = 1, memory = one table, no obligations: this must reproduce EV-SSI-59f7a2's
        committed 2^{118.5}-2^{123} bracket and 2^{92.5} entries exactly, since that record
        is a OneEnd computation.
      reproduction_check: >-
        Arithmetic against the committed bracket. A ledger whose k = 1 row does not
        reproduce the committed figure is misimplemented and nothing else may be read.
    observation_collision:
      observable: The resource vector.
      distinct_preimage_search: >-
        COLLISIONS ARE ABUNDANT AND ARE REPORTED RATHER THAN HIDDEN: any two reductions with
        the same call count and memory profile collide. The record therefore CANNOT and
        DOES NOT claim to identify which reduction [35] uses; it claims only to bound the
        charge given the call count, and the call count itself is the source-blocked input.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Build a problem-specific resource measure (the four-component vector), realise it
          by specialising to the actual chain OneEnd -> EndRing -> Isogeny, and add charges
          only over composition steps proved disjoint by the sequential/nested rules.
        predicted_gain: >-
          A derived floor of 1.585 bits (EndRing) and 2.585 bits (Isogeny) with no external
          source, plus a named list of source-blocked cells.
    quantifier_order: >-
      THE CAMPAIGN'S CURRENT IMPLICIT CLAIM: for all p at SQIsign NIST-I parameters, SQIsign
      key recovery costs 2^{120-123}.
      WHAT THE THEOREM SUPPORTS: for all p, for a uniformly random supersingular E/F_{p^2},
      OneEnd costs p^{1/3+o(1)}, whose section-4.1 instantiation at log2 p ~ 256 is the
      2^{106.5} lower bound that EV-SSI-59f7a2 corrects.
      THE MISSING QUANTIFIER STEP: there exists a reduction R such that for all EndRing
      instances, R solves them with k OneEnd calls. k is inside an existential this
      campaign has never opened.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The chain OneEnd -> EndRing -> Isogeny costs at least log2(3) and log2(6) bits
        more than OneEnd respectively, and the following cells are source-blocked." IT CAN
        NEVER certify an upper bound on the reduction's cost without [35], and it can never
        say anything about the correctness of Corollary 1.2, which this record does not
        question.
      nearby_object_control: >-
        The trivial EndRing -> OneEnd edge (primary null): the nearest object on which the
        hoped-for conclusion (a non-zero charge) FAILS. A ledger that cannot distinguish the
        two directions of the same equivalence has not identified the load-bearing
        structure.
    proof_obligations:
      - claim: k >= 3 on rank grounds alone.
        responsibility: size
      - claim: Sequential calls do not multiply peak memory.
        responsibility: memory
      - claim: The k = 1 row reproduces the committed 2^{118.5}-2^{123} bracket.
        responsibility: baseline
      - claim: Saturation's integer obligation is stated as a question, not an answer.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        derived_floor_bits: the minimum additional cost, in bits, of EndRing and of Isogeny
        over OneEnd, derived without any external source
      direction: higher
      minimum_effect: >-
        PRE-REGISTERED: EndRing >= log2(3) = 1.585 bits; Isogeny >= log2(6) = 2.585 bits.
        A derived floor of 0 would mean the rank argument is wrong and the record's premise
        fails.
    - metric: >-
        gap_consumed_fraction = derived_floor_bits / (committed gap below 128), using
        EV-SSI-59f7a2's committed 6-8 bit gap
      direction: higher
      minimum_effect: >-
        PRE-REGISTERED: 2.585/8 = 0.32 to 2.585/6 = 0.43 for the Isogeny row. If the
        source-blocked cells are later filled and push this above 1.0, the committed gap is
        fully consumed and the headline finding is about OneEnd only. If the filled cells
        keep it below 0.5, the finding survives its scope audit strengthened. BOTH
        OUTCOMES ARE DELIVERABLES.
    - metric: >-
        peak_memory_multiplier: the factor by which peak memory rises across the chain
      direction: different
      minimum_effect: >-
        PREDICTED 1.0 (zero bits) on the ground that each attempt destroys its table before
        the next begins. A multiplier above 1 would raise the 2^{92.5}-entry figure that is
        the campaign's stated reason for calling the attack physically impossible, i.e. it
        would strengthen the defender's position, and must be reported with equal weight.
    - metric: >-
        source_blocked_cells: the count of ledger cells that cannot be filled from
        reachable material
      direction: higher
      minimum_effect: >-
        AT LEAST 1. Zero means a cell was filled from recollection.
    - metric: >-
        scope_partition: the count of committed GOAL-SSI-001 claims in each of classes
        (a) about OneEnd, (b) about EndRing/Isogeny, (c) about SQIsign
      direction: different
      minimum_effect: >-
        The partition must be non-trivial in all three classes. A partition placing every
        claim in one class means the classification rule is not discriminating and must be
        rewritten.

  minimal_test:
    design: >-
      ZERO COMPUTE. Three stages.
      STAGE 0 (~30 minutes): run the two trivial-edge nulls and the can-it-say-
      superpolynomial control. If the EndRing -> OneEnd edge charges anything, stop.
      STAGE 1 (~1 hour): fill every derivable cell -- the rank argument for k, the memory
      composition rule, the Isogeny doubling -- and mark the rest SOURCE-BLOCKED with the
      exact question to ask of [35]. Reproduce the k = 1 row against EV-SSI-59f7a2's
      committed bracket as the known-answer gate.
      STAGE 2 (~1 hour): produce the scope partition of every committed claim in this goal
      into classes (a), (b), (c), citing the record id for each.
    controls:
      - trivial-reduction null on EndRing -> OneEnd (primary, can fail, run FIRST)
      - identity-reduction gate on OneEnd -> OneEnd
      - can-the-ledger-say-superpolynomial control
      - source-blocked-cell discipline control
      - k = 1 known-answer gate against EV-SSI-59f7a2's committed bracket
    required_metrics:
      - the reduction resource ledger, one row per edge, machine-readable
      - derived_floor_bits and gap_consumed_fraction
      - peak_memory_multiplier with its composition rule shown
      - the list of source-blocked cells with the exact question for each
      - the scope partition table with record ids

  falsification_conditions:
    - >-
      The trivial-reduction null charges a non-zero cost. The accounting is invalid and no
      cell may be reported.
    - >-
      The can-it-say-superpolynomial control returns "polynomial" on a deliberately
      superpolynomial edge. The ledger is a control that cannot fail and must be rewritten.
    - >-
