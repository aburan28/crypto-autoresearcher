  heuristic_assumptions:
    - id: H-RED-1
      statement: >-
        FOR ALL supersingular E/F_{p^2}, three independent OneEnd outputs together with Z
        generate a finite-index sublattice of End(E) with probability bounded below by an
        absolute constant.
      rigorous_support: >-
        RANK ONLY, WHICH IS RIGOROUS: End(E) has rank 4 and Z has rank 1, so at least three
        further generators are needed. INDEPENDENCE with constant probability is the
        heuristic part; the classical statement it imitates is that k random vectors in a
        rank-4 lattice span a finite-index sublattice with constant probability for k = 3.
