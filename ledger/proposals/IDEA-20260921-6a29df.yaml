idea:
  id: IDEA-20260921-6a29df
  id_allocation_provenance: >-
    Minted by the top-level coordinator session with `python3
    tools/allocate_id.py --next idea --date 20260921` and confirmed free with
    `--check` on 2026-09-21. Not derived by scanning state. Authored under the
    idea-generator role contract (agents/idea-generator.md, read in full
    before generation) in the coordinator's session: the dedicated
    idea-generator runtime agent failed its environment bootstrap (AWS
    DescribeInstances AuthFailure) on three consecutive dispatch attempts and
    a general-runtime dispatch of the same handoff was cancelled before
    producing files. A runtime substitution under the interchangeable-runtimes
    clause of AGENTS.md, recorded here honestly; the handoff, objective,
    write scope, and object-frame constraints were TASK-20260921-IDEAS against
    RQ-CRYPTO-001 as dispatched.
  proposed_by: idea-generator
  proposed_at: '2026-09-21'
  question_id: RQ-CRYPTO-001
  goal_id: GOAL-CRYPTO-001
  added: '2026-09-21'
  status: proposed
  title: >-
    THE LAMBDA-REGISTRY: ONE NUMBER PER COORDINATE STATISTIC DECIDES BOTH GATES
    OF THE BRANCHING-WINDOW LANE. The F_p-additive spectral norm
    ||vhat||_1 = n^lambda of a coordinate statistic v determines (i) whether
    the spectral-learning conversion threshold lambda > 1/4 of
    IDEA-20260904-f68c7f (D) is met, and (ii) the spectral floor
    T >= n^{(4-2*lambda)/11} of IDEA-20260920-b6ad24 that any branching-window
    construction keyed on v must beat -- and lambda is EXACTLY MEASURABLE by
    FFT over the additive characters of F_p at O~(p) per statistic per prime,
    so the lane's reachability question reduces to a census it has never run:
    measure lambda for every natural coordinate statistic in the corpus and
    read off, per statistic, whether the n^{1/3} corner and the sub-rho
    learning route are open, floor-blocked, or conversion-blocked.
  class: measurement
  claim: >-
    REPRESENTATION CLASS AND ATTACK STAGE (one clause, per
    docs/object-frame-ideation.md section 4): the representation is class R1
    of RQ-ECDLP-623a32 (field representation of the coordinate x(R) in F_p
    post-processed by a statistic v: F_p -> C), and the attack stage whose
    cost this measurement decides is COLLISION STRUCTURE (the level-1 merge
    of IDEA-20260920-a5757d's cost model M1 keyed on v-buckets). CLAIM: for
    each named natural coordinate statistic v, the exponent lambda(v) defined
    by ||vhat||_1 = n^{lambda(v)+o(1)} over a ladder of prime sizes is
    measurable by exact additive FFT in O~(p) time per prime, and the
    two-sided gate [lambda > 1/4 for the learning route; lambda >= 1/6 for
    the n^{1/3} corner of model M1 under the b6ad24 floor] then decides, per
    statistic and with no further heuristic, which coordinate projections the
    branching-window lane may key on. The census falsifies the lane's current
    implicit prior -- that natural statistics beyond digit-sum populate the
    band -- or confirms the band's census with digit-sum as its only
    inhabitant, which is itself the recorded negative that redirects the lane
    to synthetic statistic design.
  mechanism: >-
    PAIR AND OPERATION SET: the tracked object is the fibre statistic v(x(R))
    on the prime-order subgroup G = <P>, R1 field representation of x; the
    operation set Sigma it must survive is the one-step additive branching
    operation of the a5757d merge -- a partial-action slice, since v-fibres
    propagate only through the keyed table join, never under the full
    translation action (which is closed for lossy objects by
    IDEA-20260806-c5d183 and KN-FIND-ffe1df Theorem C). TRICHOTOMY: the
    fibre statistic is a BRANCHING object (one-step additive branching b in
    the sense of a5757d: v-fibre sums meet at most b v-fibres, measured not
    asserted), because the discard (everything about R except v(x(R))) is not
    compatible with any deterministic sub-action of translation -- the
    summation of two points is not a function of their v-values.

    WHY THE MEASUREMENT IS EXACT AND CHEAP. lambda(v) is a property of v on
    F_p alone, not of the curve: the additive Fourier transform
    vhat(k) = sum_{x in F_p} v(x) e_p(-kx) is computable exactly by FFT over
    a prime-length transform (Bluestein/Rader) in O~(p) time and O(p) memory,
    with no sampling error -- this is a CENSUS of an exact quantity, not an
    estimate of a distribution. The two gates it feeds are both already
    committed in the lane: f68c7f (E) supplies the upper bound
    eps <= ||vhat||_1 n^{-1/2+o(1)} and (D) the conversion threshold
    A(v) > n^{-1/4+o(1)}, i.e. lambda > 1/4; b6ad24 (A1)-(A3) supplies the
    floor M*sqrt(2b) >= n^{1/2-o(1)}/n^lambda and the optimised cost floor
    T >= n^{(4-2*lambda)/11} for lambda <= 1/6, with the n^{1/3} corner
    requiring lambda >= 1/6. b6ad24's H1 explicitly flagged exact FFT of
    fibre indicators as the sampling route and explicitly did NOT propose it;
    this record proposes it, over the additive characters of F_p where the
    transform is exact and cheap, and extends it from one statistic to the
    full registry the lane's next construction step needs.
  novelty_status: unverified
  citations:
    - ref: IDEA-20260920-a5757d
      provenance: internal
      claim: >-
        Cost model M1 with T = max((nM)^{1/4}, b(n/M)^{1/2}), optimised to
        b^{1/3} n^{1/3} at M* = b^{4/3} n^{1/3}; the beat-rho condition
        b < sqrt(M); the open window omega(1) <= b < sqrt(M).
      verified_by: "coordinator session, read via IDEA-20260920-b6ad24's citation block and the ecc_priority open-ideas digest on 2026-09-21; full record not re-opened this session"
    - ref: IDEA-20260920-b6ad24
      provenance: internal
      claim: >-
        (A1) the threshold-free Parseval floor eps_i >= 1/(M sqrt(2b));
        (A3) the optimised floor T >= n^{(4-2*lambda)/11} for lambda <= 1/6,
        the n^{1/3} corner requiring lambda >= 1/6; H1's flagged but
        NOT-PROPOSED exact-FFT sampling route.
      verified_by: "coordinator session, full read of the record on 2026-09-21"
    - ref: IDEA-20260904-f68c7f
      provenance: internal
      claim: >-
        (E) eps <= ||vhat||_1 n^{-1/2+o(1)} on the recalled
        Kohel-Shparlinski / Lange-Winterhof lineage; (D) the conversion
        threshold A(v) > n^{-1/4+o(1)}; the committed digit-sum measurement
        ||vhat||_1 ~ p^{0.39} attributed to KN-FIND-ffe1df.
      verified_by: "coordinator session, read of the citation and H-block of IDEA-20260920-b6ad24 quoting f68c7f on 2026-09-21; f68c7f itself not re-opened this session"
    - ref: IDEA-20260920-dd041a
      provenance: internal
      claim: >-
        The lambda >= 1/6 band is nonempty with exactly one corpus inhabitant
        (the digit-sum statistic at lambda ~ 0.39).
      verified_by: "coordinator session, ecc_priority open-ideas digest on 2026-09-21"
    - ref: KN-FIND-ffe1df
      provenance: internal
      claim: >-
        Theorem C: an exactly sum-compatible bucket index on a prime-order
        subgroup is a surjective homomorphism onto a group of order dividing
        n, impossible for prime n and 1 < M < n -- the lossy-object closure
        under the full translation action, validator-confirmed.
      verified_by: "coordinator session, cited via docs/object-frame-ideation.md section 1 read in full on 2026-09-21"
    - ref: RQ-ECDLP-623a32
      provenance: internal
      claim: >-
        The R1/R2/R3 representation classes and the requirement that a
        representation proposal carry the lossy-projection audit before any
        experiment, with the PGL_2 random-reparametrisation battery as a
        mandatory control for any measurement attributed to a representation.
      verified_by: "coordinator session, full read of the record on 2026-09-21"
  assumptions:
    - >-
      OFF-LIMITS COMPONENT, NAMED: this measurement serves constructions in
      family F1/F2-adjacent territory (the a5757d merge is a walk-collision
      variant with a keyed table); the census itself makes no attack claim and
      adds the exact-FFT instrument the lane lacks. What is added: a
      per-statistic two-sided gate no existing record computes.
    - >-
      The ladder of primes transfers: lambda(v) is fitted over
      p in [2^12, 2^26] and extrapolated; the transfer assumption is stated
      in interpretation_limits and is testable in-band by residual analysis.
  proof_search_map:
    bottleneck: >-
      Not a proof proposal; the bottleneck it unblocks is the lane's inability
      to say, for any candidate key statistic v, whether the n^{1/3} corner
      (lambda >= 1/6) or the learning route (lambda > 1/4) is even in
      principle available to a construction keyed on v.
    baseline_embedding:
      parameter_slice: >-
        Digit-sum at lambda ~ 0.39 (KN-FIND-ffe1df via f68c7f (D)) is the
        exact reproduction target: the census must reproduce it within the
        fitted-exponent error before any new statistic's lambda is believed.
      reproduction_check: >-
        Fitted lambda(digit-sum) in [0.36, 0.42] across at least 6 ladder
        points with monotone residuals; failure blocks the whole census.
    observation_collision:
      observable: >-
        ||vhat||_1 as a function of p -- an exact integer-computable
        quantity, so the usual collision risk is numerical, not structural:
        the transform must be over the ADDITIVE characters of F_p
        (e_p(kx) = exp(2*pi*i*k/p)), not over the multiplicative group or the
        log coordinate, and not a DFT over a composite-length surrogate.
      distinct_preimage_search: >-
        Two statistics with visibly different fibres can share lambda
        (e.g. an interval indicator and an AP indicator both expected near
        0); the census reports lambda as a GATE readout, never as an
        identification of the statistic, and the registry table carries the
        fibre geometry beside the number.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The reachability question 'can a branching-window construction
          keyed on v reach n^{1/3} / the learning route' reduced to the single
          measured exponent lambda(v) via the two committed gates.
        predicted_gain: >-
          Converts an open design question into a table row per statistic;
          no complexity gain claimed.
    quantifier_order: >-
      For every named statistic v in the registry there exists a measured
      lambda(v) (exact computation, no forall-asymmetry); the gate statement
      is per-statistic and introduces no unmeasured generality.
    method_ceiling:
      strongest_certifiable_claim: >-
        Per-statistic gate verdicts at the measured ladder sizes with an
        explicit fitted-exponent error bar; NO claim about synthetic
        statistics not in the registry, and no claim that lambda >= 1/6
        suffices for an attack (the gates are necessary conditions, read off
        as one-sided decisions).
      nearby_object_control: >-
        The random-function null: for v drawn uniformly at random with the
        same normalisation, lambda must measure ~ 1/2 + o(1) (Parseval
        trivial level); an anomalous random-null reading calibrates the
        pipeline. The all-ones statistic (lambda = 0 exactly) is the
        analytic endpoint control.
    proof_obligations:
      - claim: the FFT computes the exact additive transform over F_p
        responsibility: correctness
      - claim: the ladder fit yields lambda with a stated error bar
        responsibility: size
      - claim: the two gates are applied one-sidedly (necessary conditions only)
        responsibility: scope
    not_applicable_reason: >-
      Proof-architecture audits that assume a theorem target (quantifier
      order over a proved class, method ceiling over a proof method) are
      recorded structurally above; no theorem is proposed, so the remaining
      audits reduce to the reproduction and null controls already stated.
  predictions:
    - metric: fitted lambda for interval and AP fibre indicators
      direction: lower
      minimum_effect: >-
        lambda <= 0.05, i.e. essentially-zero additive spectral norm; these
        statistics are then floor-blocked at T >= n^{4/11} AND
        conversion-blocked (lambda < 1/4), scoping them out as keys.
    - metric: fitted lambda for digit-sum
      direction: different
      minimum_effect: >-
        Replication of the committed p^{0.39} measurement within the fitted
        error bar; the band census then counts its one known inhabitant.
    - metric: fitted lambda for multiplicative-coset and quadratic-residue indicators
      direction: lower
      minimum_effect: >-
        Prior (square-root cancellation of multiplicative structure,
        Weil-level): lambda near 0. Any such statistic measuring
        lambda > 1/4 would be a NEW band inhabitant and names the next
        construction step; this is the census's live outcome.
    - metric: random-function null
      direction: different
      minimum_effect: >-
        lambda ~ 1/2 + o(1); deviation beyond the fit error indicates a
        pipeline defect and blocks every other reading.
  minimal_test:
    design: >-
      Exact additive FFT (Bluestein over prime p) of a fixed registry of
      coordinate statistics -- interval indicator, AP-family indicators,
      digit-sum in bases 2/3/10, multiplicative-coset indicator of index-ell
      subgroups for ell in {2,3,5}, quadratic-residue indicator, low-bit
      masks, the all-ones and random-function controls -- over a ladder of at
      least 8 primes from 2^12 to 2^26, at least 3 random curves per prime
      where the statistic is curve-dependent. Fit log||vhat||_1 vs log p per
      statistic; emit the registry table with per-row gate verdicts.
    controls:
      - all-ones statistic at lambda = 0 exactly (analytic endpoint)
      - random-function null at lambda ~ 1/2 (Parseval level)
      - digit-sum reproduction of the committed p^{0.39}
      - PGL_2-reparametrised coordinate (v composed with a random Moebius
        map on the x-line) must read within error of v itself, per the
        RQ-ECDLP-623a32 null battery, or the statistic is
        representation-artifactual
    required_metrics:
      - fitted lambda per statistic with error bar and residual plot
      - gate verdict per statistic (corner open / floor-blocked; learning
        route open / conversion-blocked)
      - transform wall-time per prime (the census's own charged cost)
  falsification_conditions:
    - >-
      Digit-sum fails to replicate in [0.36, 0.42]: the census pipeline is
      defective and every reading from it is void (infrastructure failure,
      not evidence).
    - >-
      The random-function null reads outside 1/2 + fit error: miscalibration,
      same consequence.
    - >-
      A PGL_2-conjugated statistic reads a lambda differing from its parent
      beyond error: the parent statistic's reading is attributed to the
      representation, not to the function, and is discarded from the registry.
    - >-
      All registry statistics measure lambda <= 1/4 except digit-sum: the
      census closes with the band's single known inhabitant, and the recorded
      negative is 'no NATURAL coordinate statistic beyond digit-sum opens
      either gate' -- scoped exactly to the registry, with synthetic
      statistic design named as the successor.
  confounders:
    - normalisation of v changes lambda by an additive constant; the registry
      fixes one normalisation (||v||_2 normalised to 1, so lambda is measured
      relative to the L2-normalised statistic) and states it in the table
    - FFT over a composite-length surrogate instead of the prime field itself
      silently measures a different quantity
    - statistics whose fibres depend on the curve (coset indicators restricted
      to x(E)) conflate curve structure with statistic structure; the census
      measures v on F_p and separately reports the restriction effect
    - finite-ladder curvature masquerading as exponent (small-lambda rows are
      the most vulnerable); residual analysis and a second ladder spacing
      are the guards
  interpretation_limits:
    - >-
      GATES ARE NECESSARY, NOT SUFFICIENT: lambda >= 1/6 does not certify an
      n^{1/3} construction exists keyed on v; it only fails to block one.
      The census never licenses an attack claim.
    - >-
      Scope is the registry and the ladder: statistics not measured are
      unmeasured, and lambda extrapolated beyond 2^26 carries the fitted
      error bar explicitly.
    - >-
      Toy/medium measurement only; no crypto-scale claim of any kind.
  heuristic_assumptions:
    - id: H1
      statement: >-
        LADDER EXTRAPOLATION. The exponent lambda(v) fitted on
        p in [2^12, 2^26] is the asymptotic exponent: log||vhat||_1 is
        linear in log p over the ladder up to a residual of order
        O(1/log p).
      rigorous_support: >-
        Not a distributional heuristic: for each registry statistic with a
        closed form, the exact value is computable at every ladder point, so
        the assumption is only about the regularity of the interpolation, in
        the spirit of a Pade/least-squares fit to an exactly-known sequence.
        The analogue that fails when the assumption fails is a statistic with
        genuine oscillatory correction (e.g. lambda-varying digit-sum
        anomalies at powers of the base), which the residual plot exposes.
      validation_plan: >-
        Two ladder spacings (dyadic and 1.5x) must agree on lambda within
        error; residuals must show no monotone trend; the digit-sum row must
        reproduce the committed 0.39. Tail check: the largest-prime point
        must not be an outlier under jackknife.
    - id: H2
      statement: >-
        GATE COMPOSITION. The committed upper bound
        eps <= ||vhat||_1 n^{-1/2+o(1)} (f68c7f (E)) and the Parseval floor
        (b6ad24 (A1)) both apply to the same normalised observable, so the
        two-sided gate is sound as applied.
      rigorous_support: >-
        Both inequalities are already committed on file in the cited records;
        this record assumes only their composability, which is exactly what
        b6ad24 (A2) already composes. The o(1) terms are inherited
        unmodified.
      validation_plan: >-
        No sampling: the composition is checked by re-deriving the gate
        algebra from the two records' statements (blind re-derivation of the
        inequality chain, not of the FFT); disagreement with b6ad24's (A2)
        blocks the registry's gate column.
  target_complexity:
    time_exponent: >-
      The census itself: O~(p) per statistic per prime, i.e. about p log^2 p
      with Bluestein; the full ladder to 2^26 is hours of single-core time.
      No attack exponent is claimed.
    memory_exponent: O(p) machine words per prime (the transform buffer).
    best_known: >-
      Not applicable as an attack: the reference costs the census decides
      about are rho at n^{1/2} and the a5757d corner at n^{1/3} (model M1).
    hidden_overhead: >-
      Bluestein's log factor and the multi-curve repetition are the entire
      overhead; no o(1) is hidden anywhere in the gate algebra beyond what
      the two committed records already carry.
    tradeoff_note: >-
      Massively parallel (one statistic-prime-curve cell per worker); memory
      is a single p-word buffer per cell, so the census parallelises flat.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
