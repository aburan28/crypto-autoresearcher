idea:
  id: IDEA-20260816-b5b822
  question_id: RQ-RSA-d46f02
  added: '2026-08-16'
  title: 'Locate the binding step of the small-root construction by ablation rather than argument:
    disable or degrade exactly one stage at a time - shift-set shape, modulus-power multiplicity,
    Howgrave-Graham scaling, reduction strength, root read-off - and report which single change moves
    the achieved unknown-bit fraction furthest.'
  class: mechanism
  claim: '(A) A Coppersmith-style small-root pipeline is a composition of five separable stages, and
    the program currently has no measurement of which one is binding at any concrete parameter. The
    stages are: S1 the shift-set shape, that is which monomial multiples of the target polynomial
    enter the basis; S2 the multiplicity of the modulus power carried by each shift; S3 the diagonal
    scaling that converts a modular root condition into an integer norm condition; S4 the reduction
    strength applied to the basis; and S5 the read-off, meaning how many short vectors are used and
    how their common roots are extracted. (B) The claim is that at any fixed grid point exactly one
    of these stages binds, in the operational sense that degrading it by one declared notch moves
    the measured 90-percent-success unknown fraction r_hat by more than the other four notches combined,
    and that WHICH stage binds changes with modulus size and lattice dimension in a way that is measurable
    at moduli small enough for exhaustion to certify ground truth. (C) The claim is further that the
    binding stage is not S4. The reduction is the stage the whole field instruments and the stage
    this repository already has tooling for, so the default expectation is that reduction strength
    dominates; the specific prediction here is that at small dimension the construction stages S1
    and S2 bind and S4 does not, and that the crossover to S4 binding is locatable to within one notch
    on the tested grid. (D) WHAT IS NOT CLAIMED: no attack, no speedup and no improvement to the construction;
    identifying a binding stage is not a recipe for strengthening it. No claim is made that the five-stage
    decomposition is the only one, only that it is separable in code so that each notch is executable.
    No claim is made about a construction other than the one reproduced, and no claim is made that
    a stage which does not bind here is unimportant elsewhere. A stage that binds only because the
    per-cell budget is small is a budget finding and is reported as one.'
  mechanism: 'Build the pipeline so that each of S1 through S5 is a parameter rather than a hard-coded
    choice, then define one degradation notch per stage in advance: S1 rectangular shift set replaced
    by a strictly smaller triangular subset of the same dimension; S2 maximum modulus-power multiplicity
    reduced by one; S3 diagonal scaling replaced by a uniform scaling that ignores the per-monomial
    bound; S4 reduction replaced by the next weaker setting in a pre-declared ladder; S5 read-off
    restricted from the top k short vectors to the top one. Each notch is a single named change and
    every notch is applied against the SAME baseline cell, never stacked. For each notch, re-measure
    r_hat by the same bisection and success threshold as the baseline entry, on the same seeded instances.
    The deliverable is a per-cell ranking of the absolute change in r_hat across the five notches,
    with an exact binomial interval on each. Refutation route: if two or more notches produce overlapping
    intervals at every cell, no stage binds in the stated sense, the decomposition is not resolving
    anything, and the honest output is a measured obstruction saying the pipeline behaves as a single
    inseparable stage at these sizes.'
  novelty_status: unverified
  novelty_screen:
    method: 'Same base screen as the bucket: read RQ-RSA-d46f02 and RQ-RSA-afe33c in full, grep -rl
      RQ-RSA-d46f02 over ledger/proposals/ (empty), grep -rlie for coppersmith, howgrave, small-root,
      shift polynomial, Jochemsz over ledger/proposals/ and ledger/hypotheses/, and read KN-TECH-015
      in full. Additionally for this entry: grep -ril ablation over ledger/proposals/ (25 files) and
      grep -rih for shift set and determinant lines.'
    results: Ablation as a design pattern is well represented in the corpus, with 25 proposal files
      mentioning it, but every instance found is in the ECDLP, isogeny or lattice-KEM lanes, not in
      a small-root pipeline. IDEA-20260808-e2315e varies ONE parameter of a Coppersmith pipeline,
      the dimension, and does so asymptotically for a Semaev system; it does not separate the pipeline
      into stages and does not ablate scaling, multiplicity or read-off. KN-TECH-015 names the stages
      implicitly in prose but records no per-stage measurement. No proposal in the corpus ablates
      a small-root construction.
    verdict: 'UNVERIFIED. Nothing is asserted about external literature. Claimed new relative to this
      repository: the five-stage separable decomposition of the small-root pipeline with one pre-declared
      degradation notch per stage, and the per-cell ranking of the change in r_hat as the deliverable.
      Assembled from known parts: the ablation pattern already used elsewhere in this program, the
      construction itself (KN-TECH-015), and the known-answer instance discipline from RQ-RSA-d46f02''s
      constraints.'
  object_first_candidate:
    tracked_object: The ordered pair (binding stage, magnitude of the change in r_hat at that stage),
      a label drawn from a five-element set together with a magnitude, followed through the grid of
      modulus sizes and lattice dimensions.
    lossiness: 'Genuinely lossy. The full state is the entire five-dimensional configuration space
      of the pipeline and its success surface. The tracked object retains only, at each grid point,
      which single-notch degradation hurt most and by how much, discarding all interaction terms between
      stages and the whole shape of the surface away from the baseline. That discard is compatible
      with the operation of moving across the grid because the notch definitions are identical at
      every cell, so the argmax is comparable cell to cell. The discard is real and its cost is stated:
      a pipeline whose stages interact strongly has no well-defined single binding stage, and detecting
      that is precisely the refutation route in the mechanism.'
    propagation: 'One step of the target operation is moving to the adjacent grid cell, increasing
      dimension by one notch or modulus size by one step. Under such a step the baseline r_hat moves,
      and the claim is that the argmax label is piecewise constant in the grid with a locatable boundary:
      at small dimension the construction stages bind, and beyond a crossover the reduction stage
      binds. The object propagates as a label that either stays put or flips once.'
    survival_score: 'Expected to survive across the whole dimension ladder at fixed small n, and to
      dissolve where two notches become statistically indistinguishable, which is predicted to happen
      near the crossover cell itself. Concretely: survival expected at D = 8 and D = 48 with a clean
      argmax, dissolution expected in a band of one or two dimensions around the crossover, and that
      band is the reportable measurement rather than a failure.'
  null_object_control: The identical five-notch ablation runs against a null pipeline in which the
    target polynomial is replaced by a random polynomial of the same degree and coefficient size with
    NO planted root, everything else identical. The null must show r_hat undefined in every arm because
    no arm recovers anything, so that all five changes are zero within their intervals and no argmax
    exists. If the null produces a non-degenerate ranking, the ranking in the signal arm is a property
    of the lattice-building code rather than of root recovery, and the measurement is void. A second
    null re-runs the baseline cell with a NO-OP notch, a change of an irrelevant parameter such as
    the internal ordering of identical basis rows, which must produce a change indistinguishable from
    zero and calibrates the resolution of the whole ranking.
  discriminated_from:
  - 'IDEA-20260808-e2315e: varies one parameter, the dimension, asymptotically and in a Semaev setting.
    This entry holds dimension fixed at each cell and varies four other stages that proposal never
    touches, in the RSA setting where ground truth is constructible.'
  - 'The achievability-ratio entry of this bucket: that entry measures the level of r_hat against
    a declared reach. This entry measures DIFFERENCES in r_hat under single-stage degradation and
    does not need the asymptotic denominator at all, which makes it approvable even while that entry''s
    KN-LIT gap is open.'
  - 'KN-TECH-015: records the method and a cost model; no stage is separated and no per-stage effect
    is measured.'
  - 'A hyperparameter sweep of a lattice reducer: those vary S4 alone and report basis quality. Here
    S4 is one of five arms and the deliverable is a ranking against the four construction-side arms,
    with a no-op notch calibrating resolution.'
  - 'The 25 ablation-mentioning proposals elsewhere in the corpus: all in ECDLP, isogeny or KEM lanes
    with different tracked objects; none ablates a small-root pipeline.'
  assumptions:
  - The five stages are separable in code so that each notch is a single named change with everything
    else byte-identical.
  - The baseline cell has r_hat well defined, which the achievability-ratio entry tests directly;
    if it does not, this entry has no baseline and must not run.
  - One notch per stage is a fair comparison unit. This is an assumption, not a fact, and the no-op
    null calibrates only resolution, not fairness.
  - Interactions between stages are weak enough near the baseline that a single-notch argmax is meaningful;
    the refutation route catches the case where they are not.
  predictions:
  - metric: argmax stage over the five notches at D = 8, small n
    direction: different
    minimum_effect: 'Forced value: the argmax is S1 or S2, not S4. This is the pre-commitment; if
      S4 is the argmax at the smallest dimension the prediction is wrong.'
  - metric: change in r_hat of the argmax notch versus the sum of the other four
    direction: higher
    minimum_effect: 1.0
  - metric: change in r_hat of the no-op notch
    direction: lower
    minimum_effect: 0.01
  - metric: number of grid cells at which two notches have overlapping 95-percent intervals
    direction: lower
    minimum_effect: No pre-committed count. The width of the ambiguous band is the thing being measured
      and pre-committing to it would be pre-committing to the answer.
  minimal_test:
    design: 'One cell only. Fix n = 128 and one lattice dimension at which the achievability-ratio
      entry has established a baseline r_hat. Generate 60 known-answer instances from recorded seeds.
      Run six arms in a single invocation: baseline and the five single-notch degradations, and separately
      the no-op notch and the random-polynomial null. For each arm bisect on the unknown fraction
      u to r_hat using the identical threshold and the identical instances, so that arm-to-arm differences
      carry no instance variance. Report the five changes with exact binomial intervals, the no-op
      value as the resolution floor, and the null as the validity gate. This discriminates because
      a stage decomposition that cannot separate any two arms in one well-instrumented cell will not
      separate them across a grid, and because the no-op arm makes the claim that a difference is
      real checkable rather than asserted. Expected cost a few CPU-hours.'
    controls:
    - 'No-op notch arm: an irrelevant parameter change that must produce a change below the declared
      resolution floor.'
    - Random-polynomial null with no planted root, run in the same invocation.
    - 'Paired instances: every arm uses the identical seeded instance set so differences are within-instance.'
    - 'Order control: the five notches are applied in a randomised order across replicate blocks to
      catch any state leakage between arms.'
    - 'Determinant cross-check: each notched basis has its exact log determinant recomputed and compared
      against the symbolic prediction for that notch.'
    required_metrics:
    - r_hat per arm with exact binomial interval
    - change in r_hat per notch relative to baseline
    - argmax notch label per grid cell
    - change in r_hat of the no-op notch, reported as the resolution floor
    - exact log determinant per notched basis
    - reduction wall time and peak resident memory per arm
  falsification_conditions:
  - 'The no-op notch produces a change comparable to a real notch: the measurement has no resolution
    and every ranking is void.'
  - 'The random-polynomial null produces a non-degenerate ranking: the ranking measures the code,
    not the recovery.'
  - 'All five notches have mutually overlapping intervals at every tested cell: no stage binds in
    the stated sense and the honest deliverable is that measured obstruction.'
  - The argmax label is not stable under re-seeding at the same cell.
  - A notched basis fails its determinant cross-check, meaning the notch was not the single change
    it was declared to be.
  confounders:
  - A notch that changes dimension as a side effect confounds a construction effect with a reduction-cost
    effect; every notch is declared dimension-preserving and the determinant cross-check verifies
    it.
  - Reduction is stochastic in some implementations; seeds are pinned and replicate blocks are run.
  - Per-cell time caps bind different arms differently, since a weaker reduction is faster; time-capped
    cells are reported separately and never merged into the ranking.
  - The notch magnitudes are not calibrated to a common unit, so the ranking is a ranking of the chosen
    notches, not of the stages in the abstract. This is stated in every report of the ranking.
  - Read-off restriction S5 interacts with reduction strength S4 by construction, since weaker reduction
    gives fewer usable short vectors; this pair is the most likely source of a spurious argmax and
    is examined separately.
  interpretation_limits:
  - A binding stage is binding for these notch definitions, this construction and this budget, and
    not in any absolute sense.
  - Nothing here says the construction can be improved; locating a bottleneck is not evidence that
    the bottleneck is removable.
  - No statement is made about deployed RSA or about any published bound.
  - Where arms are time-capped, the ranking reflects the cap and is reported as a budget outcome.
  target_complexity:
    time_exponent: No attack exponent is claimed. Wall time per arm is measured. The ablation deliberately
      makes some arms cheaper than the baseline, so arm times are not comparable as costs of a method
      and are reported only as budget accounting.
    memory_exponent: No attack memory exponent is claimed. Peak resident memory per arm is measured
      and reported beside time.
    best_known: 'The incumbent is the undifferentiated pipeline: KN-TECH-015 records the method as
      a whole with a single cost model and no per-stage attribution, and no proposal in this repository
      ablates it. The incumbent answer to which stage binds is therefore an argument, not a measurement.'
    hidden_overhead: The engineering cost of making five stages independently swappable without changing
      anything else is the real expense, and it is easy to get wrong in a way that silently couples
      two arms. The determinant cross-check exists because that failure is otherwise invisible.
  dominated_by: n/a (no result claimed). No solver is proposed, so there is no point to place on a
    time, memory or query frontier, and I did not check frontier rows for that reason rather than
    because they came back empty.
  sota_delta: No attack; conceptual and measurement contribution only. The deliverable is a five-way
    ranking with a calibrated resolution floor where the repository currently holds no per-stage attribution
    at all.
  estimated_cost:
    implementation: high
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'Five stages being cleanly separable in code with dimension-preserving
    notches: 0.6, since S1 and S2 are entangled in most natural implementations and separating them
    may force an awkward parameterisation. The no-op notch coming in below the resolution floor: 0.85.
    A clean argmax existing at the smallest dimension: 0.55. The specific pre-commitment that the
    argmax is S1 or S2 rather than S4 at small dimension: 0.5, deliberately near even, because the
    opposite outcome is entirely plausible and would itself be the useful measurement. The whole ablation
    dissolving into overlapping intervals: 0.25, and that outcome is a usable measured obstruction
    rather than a wasted run.'
