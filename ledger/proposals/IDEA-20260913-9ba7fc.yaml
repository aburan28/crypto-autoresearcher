idea:
  id: IDEA-20260913-9ba7fc
  question_id: RQ-SEMBIN-fa2e3f
  question_ids:
    - RQ-SEMBIN-fa2e3f
  goal_ids:
    - GOAL-SEMBIN-5078bc
  status: proposed
  proposed_by: idea-generator
  session: sembin-20260913-9d649f
  title: >-
    The Assumption 1 boundary is a surface in (n, k), and the useful direction
    of it is certifiable in 1 GiB: a one-sided degree-4 non-solvability
    certificate that reproduces Semaev's n=40 and Kosters' n=45 and n=25 cells
    at 0.4-1.3 GiB instead of 126 GB, plus the fixed-k ladder nobody has run
  class: measurement

  claim: >-
    (C1) LOCATION IS A SURFACE, NOT A POINT. The only two external data points
    in existence (KN-LIT-e77232) differ in BOTH n and k: Semaev reports degree 4
    at (n, m, k) = (40, 2, 20) and Kosters degree 5 at (45, 2, 23). The
    published framing "the m = 2 boundary lies between n = 40 and n = 45" is
    therefore under-determined: the same pair is equally consistent with a
    boundary in k alone at k in (20, 23], with n irrelevant. The paper's own
    timings favour the k reading: at m = t = 3 the solve time is flat in n at
    fixed k (137.32 s at n = 19, 133.54 s at n = 21) and jumps by 8.69x when k
    goes 6 -> 7 at nearly fixed n. And the paper itself concedes growth in k at
    fixed n -- end of Section 4.5.1: "the maximal degree (regularity degree)
    generally exceeds 4 when k > ceil(n/m) though the first fall degree is still
    4". We claim the solving degree of the descended chained system is, to
    within the reach of measurement, a function of k alone plus a weak
    dependence on n, i.e. d_solv(n, k) = phi(k) + o(1) with phi
    non-decreasing and phi(k) >= 5 for some k <= 23.

    (C2) THE USEFUL DIRECTION IS ONE-SIDED AND CHEAP. Deciding "degree 4 does
    NOT suffice" needs only the degree-4 truncation, not a Groebner basis. Let
    R_4 be the fixed point of the degree-4 capped closure over the Boolean ring
    (IDEA-20260913-449d2b), let s be the exact number of solutions obtained by
    enumeration over V^t, and let M_{<=4} be the number of squarefree monomials
    of degree <= 4. Then SOLV4 holds iff dim R_4 = M_{<=4} - s, and
    NOT SOLV4 certifies that every complete degree-by-degree procedure must take
    a productive step of degree >= 5. Sizes computed in this session: the
    degree-4 Macaulay matrix is 32,840 x 102,091 (0.39 GiB dense) at Semaev's
    n = 40, m = t = 2 cell; 48,690 x 179,447 (1.02 GiB) at Kosters' n = 45,
    m = t = 2 cell; 35,800 x 294,204 (1.23 GiB) at Kosters' n = 25, m = t = 3
    cell. Kosters needed 126 GB and 111 GB of MAGMA for the same two cells and
    did not finish the second. **The decisive question at the exact published
    disputed cells is therefore two orders of magnitude cheaper than the
    computation that raised it**, and fits on this program's 15 GiB machine.

    (C3) THE CONVERSE DIRECTION IS NOT AFFORDABLE AND WE SAY SO. Certifying
    that degree 5 SUFFICES needs the degree-5 truncation: 731,790 x 1,550,201,
    132 GiB dense at n = 45, m = 2, and 209 GiB at n = 25, m = 3. That is
    outside this machine by an order of magnitude and is declared as an
    impediment, not as evidence. Consequence for experimental design: the
    experiment is built to FALSIFY Assumption 1 cell by cell, and a cell where
    SOLV4 holds is recorded as "degree 4 sufficed here", never as "the degree is
    4" -- a distinction the published tables do not make.

    (C4) THE LADDER NOBODY RAN. Neither Semaev nor Kosters varied n at FIXED k,
    which IDEA-20260913-9c54f9 shows is the axis the cost claim actually depends
    on. Semaev's tables contain three such ladders by accident -- k = 4 at
    n = 13..16, k = 3 at n = 13..15, k = 7 at n = 19, 21 -- all reporting 4, and
    he never remarks on them. Running the fixed-k ladder out to the reach of the
    certificate (k = 4 at n = 13..28; k = 7 at n = 19..30; k = 9 at n = 25..30;
    k in {15, 20, 23, 25} at m = 2 for n = 30, 40, 45, 50) measures phi and the
    rate d phi / d k, and the rate is the input the cost audit needs.

  mechanism: >-
    The factor-base variables are k*t of the n(t-2) + kt Boolean unknowns and
    they are the only ones carrying the search; the n(t-2) auxiliary unknowns
    are determined by the chain once the x_i are fixed. Increasing n at fixed k
    adds auxiliary unknowns AND adds equations at the same rate (the system is
    n(t-1) equations in n(t-2) + kt unknowns, so the excess of equations over
    unknowns is n - kt, growing in n), i.e. it makes the system more
    overdetermined and should not raise the solving degree. Increasing k at
    fixed n enlarges the search space without adding equations and makes the
    system less overdetermined: the excess n - kt shrinks and vanishes at
    k = n/t, which is exactly the diagonal. That is why the diagonal is the
    hardest locus of the surface at fixed n, why the paper concedes the degree
    exceeds 4 beyond it, and why the boundary should be read in k.

  novelty_status: adaptation
  citations:
    - ref: KN-LIT-fa346d
      provenance: retrieved
      claim: >-
        The conceded sentence at the end of Section 4.5.1 ("the maximal
        degree(regularity degree) generally exceeds 4 when k > ceil(n/m) though
        the first fall degree is still 4"); the system shape n(t-1) equations in
        n(t-2) + kt variables; Assumption 1's restriction to k = ceil(n/m);
        Table 2's timings at fixed k; Table 2's single large cell (n, m, t, k) =
        (40, 2, 2, 20) with d_F4 = 4 over 100 random z, 28 of them satisfiable.
      verified_by: idea-generator, session sembin-20260913-9d649f
    - ref: KN-LIT-e77232
      provenance: internal
      claim: >-
        Kosters (2015-05-02, with the Caramel team): n = 45, m = t = 2
        completed, two solutions, "reached step degree 5", 126 GB of RAM; and
        n = 25, m = t = 3 with solutions "seems" to reach step degree 5,
        unfinished at 111 GB, its degree-4 step needing only 11 GB. The record
        states these have never been reproduced and that curve, factor base,
        instance generation, MAGMA version and monomial order are all unstated.
      verified_by: idea-generator, session sembin-20260913-9d649f
    - ref: IDEA-20260913-449d2b
      provenance: internal
      claim: Supplies the SOLV4 predicate and its algorithm-independence argument.
      verified_by: idea-generator, session sembin-20260913-9d649f
    - ref: IDEA-20260913-9c54f9
      provenance: internal
      claim: >-
        Shows the cost claim depends on the solving degree at fixed k rather than
        on the diagonal, which is why the fixed-k ladder of C4 is the ladder to
        run.
      verified_by: idea-generator, session sembin-20260913-9d649f
    - ref: EXP-DREG-001
      provenance: internal
      claim: >-
        Existing checkpointable block-m4ri exact-GF(2)-rank instrument
        (src/h012c_block_m4ri.py) with validated anchors (n=15 sem rank 69,073;
        n=18 rank 143,882 by two engines) and a semi-regular rank predictor
        (src/h012_peel_rank.py). It is a Sage script and Sage is NOT installed in
        this container, which is an infrastructure impediment to reuse, not
        evidence about anything.
      verified_by: idea-generator, session sembin-20260913-9d649f

  assumptions:
    - >-
      The descended system is built from the frozen S_3 = (x1x2 + x1x3 +
      x2x3)^2 + x1x2x3 + B for Y^2 + XY = X^3 + AX^2 + B, with V the subspace of
      polynomials of degree < k in a root alpha of an irreducible f of degree n.
      Kosters' curve and V are unstated, so an exact reproduction of his cells is
      impossible in principle; only the (n, m, t, k) cell can be reproduced.
    - >-
      A one-sided certificate is accepted as evidence about Assumption 1 only
      under the reconciliation of IDEA-20260913-449d2b; if that proposal finds
      SOLV4 and d_F4 unrelated, this experiment measures the solving degree
      surface and says so, which is still the quantity the cost audit needs.

  proof_search_map:
    bottleneck: >-
      "d_F4 <= 4 for any 2 <= t <= m and any n" -- the single inequality that
      makes the per-decomposition cost polynomial. Everything this proposal does
      is to make its failure certifiable at the cells where failure has been
      reported.
    baseline_embedding:
      parameter_slice: >-
        (n, m, t, k) = (40, 2, 2, 20), the paper's own largest cell, where it
        reports d_F4 = 4 with 28 satisfiable instances out of 100; and
        (21, 3, 3, 7), its largest m = 3 cell. Reproducing degree-4 sufficiency
        at both is the exact parameter slice that embeds the published baseline.
      reproduction_check: >-
        Frozen fixture: those two rows of inputs/SEMAEV-2015-310/tables.yaml.
        SOLV4 must hold at both on both arms; if it fails at (40, 2, 2, 20), the
        instrument or the system builder is wrong and the ladder is void until
        fixed. Secondary fixture: the EXP-DREG-001 validated ranks (69,073 at
        n = 15; 143,882 at n = 18) must be reproduced by any reimplemented
        GF(2) rank engine before a new cell is trusted.
    observation_collision:
      observable: >-
        "SOLV4 fails at this cell."
      distinct_preimage_search: >-
        Search for two cells with the same k and different n on opposite sides
        of the SOLV4 boundary, and for two cells with the same n and different k
        likewise. If only the second pair exists, the boundary is in k and C1
        holds; if only the first, C1 is refuted and the boundary is in n; if
        both, the boundary is a genuine curve and phi is not a function of k
        alone. All three outcomes are informative and the experiment is designed
        to distinguish them, which is the point.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "run F4 to completion and read its maximum step degree" by
          "decide dim R_4 = M_{<=4} - s", an exact GF(2) rank identity.
        predicted_gain: >-
          126 GB -> 1.02 GiB at Kosters' n = 45 cell; 111 GB (unfinished)
          -> 1.23 GiB at his n = 25 cell; and the answer becomes an integer
          identity with a checkable certificate rather than a solver's
          verbosity line.
      - transform: boundary_lift
        proposed_object: >-
          Extend the certificate family from the diagonal k = ceil(n/m) to the
          whole rectangle (n, k) with k <= n/t, and prove a strict inward
          improvement: a cell where SOLV4 fails at k and holds at k-1 pins the
          boundary to a unit interval in k at that n.
        predicted_gain: >-
          Converts "somewhere between n = 40 and n = 45" into a unit-resolution
          bracket in the variable the cost model is sensitive to.
    quantifier_order: >-
      Assumption 1: FORALL n, m, t, V: d_F4 <= 4. Its negation, which this
      experiment can establish, has the cheap quantifier order: EXISTS n, m, t,
      V, EXISTS an instance: SOLV4 fails. One certificate at one cell falsifies
      the universal statement. The positive direction has the expensive order
      (FORALL instances at a cell) and is reported only as a per-cell frequency
      over the sampled instances, never as a universal.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At (n, m, t, k) = X, with curve B and factor base V as specified,
        degree 4 is insufficient for a fraction p of instances stratified by
        satisfiability, with exact ranks and an independently recomputed
        solution count." Reach on this machine: m = 2 up to n = 50 (1.87 GiB),
        m = 3 up to n = 25-27 (1.23 GiB), at degree 4 only. It cannot certify
        the degree is exactly 5, cannot reach n = 409 or 571, and cannot say
        anything about MAGMA's F4.
      nearby_object_control: >-
        The k-excess family k = ceil(n/m) + j at the same n, where the paper
        itself asserts the conclusion FAILS. A certificate that cannot separate
        j = 0 from j = 1 has not identified the load-bearing structure. That
        separation is the dedicated experiment of IDEA-20260913-915511 and is a
        gate on this one.
    proof_obligations:
      - claim: SOLV4 iff dim R_4 = M_{<=4} - s
        responsibility: correctness
      - claim: >-
          NOT SOLV4 implies every complete degree-by-degree procedure takes a
          productive step of degree >= 5
        responsibility: correctness
      - claim: The degree-4 closure fixed point is reached in finitely many
          rounds and the round count is recorded
        responsibility: feasibility
      - claim: >-
          The GF(2) rank engine reproduces the EXP-DREG-001 anchors exactly
        responsibility: baseline
      - claim: s is computed independently of the rank computation
        responsibility: interface
      - claim: >-
          Memory and time per cell stay within 8 GiB / 8 CPU-hours, and a cell
          that exceeds them is recorded as censored
        responsibility: memory

  predictions:
    - metric: SOLV4 failure rate at (n, m, t, k) = (45, 2, 2, 23), satisfiable arm
      direction: higher
      minimum_effect: >-
        > 0.10 over >= 100 satisfiable instances, if Kosters' report reflects a
        property of the cell rather than of his instance. A rate of 0 is a
        direct, publishable failure to reproduce the only counter-datum in the
        literature -- and is the outcome that most strengthens Semaev.
    - metric: SOLV4 failure rate at (40, 2, 2, 20), both arms
      direction: lower
      minimum_effect: >-
        < 0.02, reproducing the paper's own d_F4 = 4 at its largest cell. A
        failure rate above 0.10 here contradicts Table 2 and localises the
        disagreement below n = 40.
    - metric: >-
        d phi / d k, the increase in the certified-insufficient degree per unit
        of k, measured on the m = 2 ladder k = 15, 20, 23, 25 (n = 30, 40, 45, 50)
      direction: higher
      minimum_effect: >-
        a fitted rate distinguishable from 0 at the 90% level. The linear rate
        implied by Kosters' two points is 1/3 per unit k; IDEA-20260913-9c54f9
        prices a rate of 1/3 at 2^{233} versus 2^{186} at n = 571.
    - metric: >-
        SOLV4 failure rate along the fixed-k ladders (k = 4, n = 13..28;
        k = 7, n = 19..30)
      direction: different
      minimum_effect: >-
        flat in n (consistent with 0 slope) under C1; a rising rate in n at
        fixed k refutes C1 and is the worse outcome for the audited claim, since
        it is the axis IDEA-20260913-9c54f9 identifies as load-bearing.
    - metric: >-
        wall time and peak RSS per certified cell
      direction: lower
      minimum_effect: >-
        < 8 CPU-hours and < 4 GiB at n = 45, m = 2, degree 4. Estimated here as
        6.65e12 word operations dense (about 1.8 h single-threaded plain C,
        under 30 min with a four-Russians engine) and 1.02 GiB.

  minimal_test:
    design: >-
      (1) Build the descent of eq. (5) directly from the frozen S_3, over
      F_{2^n} = F_2[x]/(f), with V = span(1, alpha, ..., alpha^{k-1}); verify the
      system's solution set against brute-force point arithmetic on E.
      (2) Implement two things in C (gcc is available; Sage, Singular, msolve
      and MAGMA are not): a four-Russians GF(2) row-echelon/rank routine, and
      the degree-4 capped closure on top of it. Gate both on reproducing the
      EXP-DREG-001 anchor ranks.
      (3) Certificate run, cell by cell, in this order (cheapest decisive first):
      (30,2,2,15) 0.05 GiB -> (40,2,2,20) 0.39 GiB, the Semaev baseline ->
      (21,3,3,7) 0.29 GiB -> (45,2,2,23) 1.02 GiB, the Kosters counter-datum ->
      (25,3,3,9) 1.23 GiB, the second Kosters cell -> (50,2,2,25) 1.87 GiB, one
      cell beyond anything published. >= 100 instances per arm per cell, exact
      satisfiability and exact solution count s by enumeration over V^t.
      (4) Off-diagonal gate: at n = 40, also run k = 21 and k = 22 (m = 2 is
      already the diagonal, so this is the k-excess direction) to check the
      certificate separates the paper's conceded failing family from the
      diagonal. If it does not, stop and report.
    controls:
      - >-
        Satisfiability stratification with exact enumeration
        (IDEA-20260913-191ed2), since the one external datum that reports degree
        5 reports it only for instances WITH solutions.
      - >-
        T11-style support-matched semi-regular null at every cell: same monomial
        support and degree profile, randomised coefficients. A SOLV4 failure
        that the null also exhibits is a property of the shape, not of Semaev.
      - >-
        Two independent GF(2) rank routines on the identical matrix; a
        disagreement invalidates the cell.
      - >-
        Solution count s computed twice, once by enumerating V^t against the
        polynomial system and once by point arithmetic on E, and required to
        agree.
      - >-
        Field-representation control: MAGMA's default/sparse f versus a random
        irreducible f, and V = low-degree polynomials versus a random
        k-dimensional subspace -- exactly the four starred rows of Table 1,
        where the paper reports a 2.4x time difference it does not explain.
      - >-
        Censoring discipline: any cell exceeding 8 GiB or 8 CPU-hours is
        recorded as censored with its partial state, never as a degree
        observation.
    required_metrics:
      - SOLV4 boolean per instance with dim R_4, M_{<=4}, s and the closure
        round count
      - per-cell failure rate per arm with bootstrap CI
      - fitted d phi / d k on the m = 2 ladder and d phi / d n on the fixed-k
        ladders, with intervals
      - null-arm failure rate at every cell
      - peak RSS, wall time, censoring status per cell

  falsification_conditions:
    - >-
      SOLV4 holds at (45, 2, 2, 23) on both arms over >= 100 instances each:
      Kosters' degree-5 report does not reproduce as a solving-degree statement,
      and either it was a strategy artifact of MAGMA's F4 or his instance family
      differed. C1's "phi(k) >= 5 for some k <= 23" is refuted and the boundary
      moves above k = 23.
    - >-
      SOLV4 fails at (40, 2, 2, 20): contradicts Table 2's own d_F4 = 4 at the
      paper's largest cell, which under the IDEA-20260913-449d2b reconciliation
      would mean the two quantities differ already there. Either way the
      instrument must be re-validated before the result is claimed.
    - >-
      The fitted d phi / d k is indistinguishable from 0 across k = 15..25 at
      m = 2 while a d phi / d n is not: C1's reading of the boundary is wrong
      and n is the variable after all.
    - >-
      The null arm fails SOLV4 at the same rate as the Semaev arm: the
      certificate is measuring the shape of the system and not its arithmetic,
      and no cell may be cited as evidence about Assumption 1.
    - >-
      The certificate cannot separate the diagonal from k = ceil(n/m) + 1 at
      any n: the method ceiling has been reached and the whole approach is
      reported as unable to see the effect the paper itself concedes.

  confounders:
    - >-
      Kosters' curve, factor base, instance generation, MAGMA version and
      monomial order are all unstated (KN-LIT-e77232 records this explicitly).
      Any non-reproduction is therefore consistent with a difference in setup and
      may not be reported as a contradiction of his figure.
    - >-
      Satisfiability, and within it the decomposition multiplicity: an instance
      with many solutions has a larger s and a correspondingly smaller required
      truncation, so the SOLV4 identity must use the exact s per instance and
      never a per-cell average.
    - >-
      At m = 2 the decomposition problem is solvable directly in 2^k field
      operations (for each x_1 in V, S_3(x_1, X, z) is a quadratic in X, solved
      by a trace test), so m = 2 cells are diagnostically useful but
      cryptographically irrelevant, and a degree observation there transfers to
      m = 12 only under an explicit assumption.
    - >-
      Degenerate solutions (x_1 = x_2, x_i = R_X, a vanishing intermediate
      point) may dominate the small-|V| cells; they must be a separate stratum.
    - >-
      Reimplementing the system builder introduces a second possible source of
      disagreement with EXP-DREG-001; the builder-equality check of
      IDEA-20260913-449d2b is a prerequisite.

  interpretation_limits:
    - >-
      Everything here is at n <= 50 and m <= 3. Nothing transfers to n = 409 or
      571; the deliverable is a measured surface and a rate, to be consumed by
      the sensitivity table of IDEA-20260913-9c54f9 as an input, not as a bound.
    - >-
      A degree-4 insufficiency certificate does not establish what the degree IS.
      Certifying degree 5 at n = 45 needs a 132 GiB dense degree-5 matrix
      (731,790 x 1,550,201) and is out of reach here: declared impediment.
      Gaudry's 2015 offer of a 512 GB machine, recorded in KN-LIT-e77232, is the
      obvious external route and is noted for the Coordinator, not acted on.
    - >-
      A failure to reproduce Kosters is a failure to reproduce an unpublished,
      under-specified blog comment. It is evidence about the cell as specified
      here and about nothing else.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Solving degree is a function of k.) There is a non-decreasing function
        phi: Z_{>0} -> Z_{>0} such that for the Weil descent of eq. (5) with
        dim V = k and any n with kt <= n, the solving degree satisfies
        |d_solv(n, k) - phi(k)| <= 1 for all but an o(1) fraction of instances.
      rigorous_support: >-
        Rigorous ingredient: the excess of equations over unknowns is exactly
        n(t-1) - n(t-2) - kt = n - kt, which is non-decreasing in n at fixed k
        and strictly decreasing in k at fixed n, so the system's
        overdeterminacy -- the quantity the semi-regular degree of regularity
        depends on -- is controlled by n - kt. Distribution statement it
        imitates: for a semi-regular Boolean system the degree of regularity is
        a function of the (equations, variables) ratio alone
        (Bardet-Faugere-Salvy, recalled), and at fixed k that ratio tends to a
        constant as n grows.
      validation_plan: >-
        Two orthogonal ladders on the same instrument. Fixed k, growing n:
        k = 4 over n = 13..28 and k = 7 over n = 19..30, >= 100 instances per
        arm per cell, predicted flat. Fixed n, growing k: n = 40 with
        k = 18..22 and n = 25 (m = 3) with k = 8..10, predicted rising. Compared
        against: the constant function 4 and the matched semi-regular
        prediction for each shape. Tail checks: the maximum d observed at the
        largest n of each fixed-k ladder, and the smallest k at which any
        instance fails SOLV4. Sampled parameters recorded per cell; the transfer
        assumption to n = 409/571 is explicitly NOT made -- phi is reported on
        its measured domain and handed to the cost model as a range.

  target_complexity:
    time_exponent: >-
      No new exponent. The audited claim's exponent is a function of phi:
      IDEA-20260913-9c54f9 prices phi == 4 at 2^{186} (n = 571),
      phi(k) = 4 + log2(k/20) at 2^{213}, and phi(k) = 4 + (k-20)/3 at 2^{233},
      all against rho's 2^{285.5}. This proposal measures phi on k <= 25.
    memory_exponent: >-
      Of the audited algorithm: unchanged. Of the EXPERIMENT: 0.05-1.87 GiB per
      cell at degree 4, against 111-126 GB for the MAGMA computations that
      produced the disputed data -- a 2-orders-of-magnitude reduction in the
      cost of the decisive question, which is the proposal's operative content.
    best_known: >-
      For the measurement itself, the best known instrument is a full Groebner
      basis computation (MAGMA F4 as used by Semaev and Kosters), which answers
      more but costs 126 GB at n = 45. For the underlying ECDLP, the frontier is
      as enumerated in IDEA-20260913-449d2b.
    hidden_overhead: >-
      The four-Russians engine's constant is unmeasured here; the 1.8 h estimate
      at n = 45 is a word-operation count (6.65e12 / 1e9 ops per second) and
      could be off by an order of magnitude in either direction. The closure may
      require several rounds, multiplying the cost by the round count, which is
      bounded but unmeasured.
    tradeoff_note: >-
      Sparse storage would cut the n = 45 degree-4 matrix from 1.02 GiB dense to
      about 5.3e7 nonzeros (0.2 GiB as uint32 indices), but elimination
      densifies; a block-Wiedemann rank at degree 5 would keep memory near the
      nonzero count (7.9e8 entries at n = 45) at a time cost of about 1.3e16
      operations, which is the honest route to degree 5 and is out of budget
      here. Recorded as the successor route.

  dominated_by: >-
    As a measurement instrument, dominated by MAGMA F4 on information content
    (it returns the full basis and every step degree) and dominating it by
    100-250x on memory at the decisive cells. As an ECDLP result: none claimed,
    frontier checked as in IDEA-20260913-449d2b -- vOW rho, plain rho,
    Petit-Quisquater conditional, Gaudry/Diem non-prime, Semaev 2015 -- and this
    proposal occupies no point on it.
  sota_delta: >-
    Moves no exponent. Reduces the cost of the single decisive empirical
    question in the audit lane from 126 GB (Kosters, n = 45) and 111 GB
    (unfinished, n = 25) to 1.02 GiB and 1.23 GiB, which is what makes the only
    unreproduced counter-data in this literature reproducible at all on
    commodity hardware; and produces the first measurement of the solving-degree
    surface in (n, k) rather than a single number per (n, m) cell, including the
    first fixed-k ladder, which decides between a 2^{186} and a 2^{233} cost at
    n = 571.

  test_boundary:
    instances: >-
      Cells, in run order: (30,2,2,15), (40,2,2,20), (21,3,3,7), (45,2,2,23),
      (25,3,3,9), (50,2,2,25); off-diagonal gate at (40,2,2,{21,22}) and
      (25,3,3,10); fixed-k ladders k = 4 over n = 13..28 and k = 7 over
      n = 19..30. >= 100 instances per arm per cell; curves B = 1 and random B;
      both field representations and both V constructions at one cell.
    parameters:
      max_D: 4 (degree 5 declared out of budget, with sizes stated)
