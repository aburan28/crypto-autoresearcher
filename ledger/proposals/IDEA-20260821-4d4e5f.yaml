    - claim: 'R3''s bracket and floor are attributed to ePrint 2024/1373 and IDEA-20260805-630606 / EXP-MLDSA-8c8fa2, never presented as this record''s.'
      responsibility: scope
    - claim: 'No entry is presented as a statement about attack cost against FIPS 204 parameters.'
