  sota_delta: >-
    No attack; conceptual and accounting contribution only. Quantitatively: this record adds
    zero bits to and subtracts zero bits from every published estimate. Against the incumbent -
    a qualitative sentence with no number - the delta is the replacement of that sentence by a
    table with at least one numeric row (Q_S* between 2^17.6 and 2^18.9 for the t0 property,
    retrieved, not derived here), at least one symbolic row with a stated exponent and a stated
    offset, and one calibration against a known 2^64. If every route returns exponent 0, the
