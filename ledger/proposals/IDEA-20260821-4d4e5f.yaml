  heuristic_assumptions:
  - id: H1
    statement: >-
      For each transcribed route, the term carrying the highest power of Q_S dominates the
      bound throughout the range of Q_S in which Bits_r crosses the category floor, so that
      the solve for Q_S* using only the dominant term errs by at most one bit in Bits_r.
    rigorous_support: >-
      The rigorous ingredient is that each bound is a finite sum of monomials in
      (Q_S, Q_H, epsilon, and the underlying problem advantages), so dominance is decidable
      term by term once the exponents are known. The classical statement being imitated is the
      ordinary asymptotic-dominance argument for a polynomial in several variables restricted
      to a ray - it is exact away from crossover regions and can fail near them.
    validation_plan: >-
      For each transcribed bound, evaluate the FULL sum and the dominant term alone on a grid
      of log2 Q_S from 0 to 128 at the frozen evaluation point, and report the maximum
      discrepancy in Bits_r over the grid and specifically at the crossing. TAIL CHECK: report
      the discrepancy at the two grid points bracketing the crossing, where dominance is
      weakest by construction. Where a bound is symbolic and the constants are unobtained, run
      the same check over the declared constant range and report the worst case. Sampled
      parameters: the three FIPS 204 categories, Q_H in {2^48, 2^64, 2^96}. TRANSFER
      ASSUMPTION: none - this check is exact for any obtained bound and is only inconclusive
      for symbolic rows, where it is reported as inconclusive. With ePrint 2023/246 obtainable,
      R1 is expected to be an obtained bound and therefore exactly checkable.
  - id: H2
    statement: >-
      The Q_S* produced by route R3 for the property "t0 remains secret" transfers across the
      three FIPS 204 categories within the range the source states (2*10^5 to 5*10^5), i.e.
      the per-category values lie inside that bracket and are not extrapolated beyond it.
    rigorous_support: >-
      The source states the range as covering all three security levels. No structural theorem
      is invoked; this is a restatement of a reported experimental range, and the assumption is
      only that the reported range means what it says. The matching LOWER end of the row is not
      an assumption of this record at all: IDEA-20260805-630606's 34 / 60 / 58 is an
      information-theoretic floor derived there under that record's own named heuristics, and
      it is imported with them attached.
    validation_plan: >-
      Obtain the full text of ePrint 2024/1373 and extract the per-level figures rather than
      the bracket, replacing the bracket with three numbers. Until then the bracket is carried
      as a bracket and the ledger reports an interval, not a point. If the full text is
      unobtainable, the row stays an interval permanently and says so - and per stage 0 that
      unobtainability must be re-probed and dated, not inherited. NO SAMPLING IS PERFORMED
      BY THIS PROGRAM and no reproduction of that attack is claimed or planned under this
      record.
  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND NONE IS MOVED. The deliverable is a table of Q_S*
      values and exponent vectors. Its own computational cost is negligible - polynomial
      evaluation on a grid, seconds. The exponents that appear in the record are exponents of
      Q_S and Q_H inside SOMEONE ELSE'S BOUND, not attack complexity exponents, and must never
