idea:
  id: IDEA-20260821-4d4e5f
  question_id: RQ-MLDSA-001
  added: '2026-08-21'
  title: >-
    The signature-count ledger. "ML-DSA does not degrade in security with the number of
    signatures produced" is a sentence about a model; make it a NUMBER by computing Q_S*,
    the signature count at which each of three independent and non-interchangeable budgets
    expires - the Fiat-Shamir-with-aborts reduction's own Q_S-dependence TRANSCRIBED FROM
    ePrint 2023/246 (re-probed 2026-08-24 and OBTAINABLE, contrary to a stale 403 this
    program had been designing around), a transcript-leakage budget, and the empirical
    budget of 2*10^5 to 5*10^5 signatures after which t0 is fully recovered - and report the
    smallest, with the calibration that the same ledger applied to SLH-DSA must return its
    known 2^64. The empirical row is NOT this record's: IDEA-20260805-630606 already places
    that published count against a derived floor of 34 / 60 / 58 signatures, and this record
    imports both.
  class: composition
  claim: >-
    (A) THE SENTENCE UNDER TEST, QUOTED FROM A RETRIEVED SOURCE. The IETF ML-DSA security-
    considerations draft states (Section 3.2-5) "It is secure to use a single key pair for
    signing many messages...ML-DSA does not degrade in security with the number of signatures
    produced, under the standard security model." The trailing clause is doing all the work
    and is never quantified anywhere this session could find.
    (B) THE OBJECT. Define, per FIPS 204 category k and per route r, the function
    Bits_r(k, Q_S, Q_H) = the number of bits of security that route r still guarantees after
    Q_S signatures and Q_H hash queries, and define Q_S*(k, r) = the largest Q_S at which
    Bits_r(k, Q_S, 2^Q_H_floor) is at or above the category floor (128 / 192 / 256). The
    ledger is the table of Q_S*(k, r) over k and r, plus its row-wise minimum.
    (C) THE THREE ROUTES, AND THEY MEASURE DIFFERENT THINGS - THIS IS THE WHOLE POINT.
    R1, PROOF, AND IT IS NOW A TRANSCRIPTION ROUTE RATHER THAN A SYMBOLIC ONE: the
    CMA-to-NMA-to-SelfTargetMSIS chain in ROM and QROM. Q_S enters through the signing-oracle
    simulation. The source is ePrint 2023/246 (Barbosa, Barthe, Doczkal, Don, Fehr, Gregoire,
    Huang, Hulsing, Lee, Wu, "Fixing and Mechanizing the Security Proof of Fiat-Shamir with
    Aborts and Dilithium"), whose abstract states it provides "new, fixed proofs for the
    affected CMA-to-NMA reduction, both for the ROM and the QROM" and "a concrete security
    analysis for the case of Dilithium". A 2026-08-05 decision in this program recorded HTTP
    403 on that paper; THAT WAS A FACT ABOUT A MOMENT AND IT NO LONGER HOLDS - see
    novelty_screen.method for the 2026-08-24 probe. The deliverable is the EXPONENT VECTOR of
    Q_S and Q_H in the dominant term of the fixed reduction, read off the transcribed theorem;
    the symbolic-unknown fallback survives only as a contingency if the transcribing session
    cannot render the PDF.
    R2, TRANSCRIPT: the accepted responses z = y + c*s1 are Q_S hints on s1. Under
    Fiat-Shamir with aborts the accepted z is exactly uniform and independent of s1, so the
    naive hint budget is INFINITE; the honest question is what the OTHER published components
    (h, and the c-tilde that selects c) budget, and whether a Hint-MLWE-style accounting -
    which requires Gaussian secrets and noise flooding, not uniform secrets and rejection -
    can be transferred at all. A documented failure to transfer is an acceptable and useful
    deliverable for this route.
    R3, EMPIRICAL, AND IT IS AN IMPORT ON BOTH SIDES - THIS RECORD ORIGINATES NEITHER HALF.
    ePrint 2024/1373 (CRYPTO 2025) reports "between 200,000 and 500,000 signatures are
    sufficient to recover t_0 on a desktop computer", i.e. Q_S*(k, R3) is between 2^17.6 and
    2^18.9 for the property "t0 is still secret"; the same paper states "The knowledge of t_0
    has no impact on the black-box cryptographic security of Dilithium, as can be seen in the
    security proof." AND THE PROGRAM ALREADY OWNS THE OTHER SIDE OF THAT ROW:
    IDEA-20260805-630606 (RQ-MLDSA-ffa0f5) derives an information-theoretic floor of 34 / 60 /
    58 signatures for the same property from the hint vector's entropy, places the published
    2-5 x 10^5 against it, and charges the resulting factor of 3.4 x 10^3 to 1.5 x 10^4;
    experiments/EXP-MLDSA-8c8fa2/specification.yaml computes that floor as a committed
    contract. R3 CONTRIBUTES NOTHING NEW TO THIS LEDGER except placement of an existing row
    beside the proof routes, and the first version of this record failed to say so.
    (D) THE DISCRIMINATION, AND IT IS SHARP BECAUSE THIS REPOSITORY ALREADY HOLDS THE OTHER
    HALF. IDEA-20260808-5a748c computes Delta_beta, the core-SVP gap in bits between the
    t1-only MLWE instance a key-only adversary faces and the full-t instance. R3 says that gap
    CLOSES after about 2^18 signatures. Two outcomes, both informative and mutually exclusive:
    (i) Delta_beta is at or near 0 bits, in which case R3's budget costs nothing in bits, the
    quoted sentence survives with a footnote, and the binding budget is R1 or R2; (ii)
    Delta_beta is materially positive, in which case there IS a signature-count-dependent
    movement in the concrete MLWE hardness a real adversary faces, it completes at a Q_S
    NAMED BY A PUBLISHED EXPERIMENT rather than by a proof artefact, and the unqualified
    sentence is scoped in a way that matters operationally even though the security PROOF is
    untouched.
    (E) WHAT IS NOT CLAIMED. No break, no forgery, no contradiction of any security proof. R3
    is a published result restated, and its internal floor is IDEA-20260805-630606's, not this
    record's. Claiming that a proof bound becoming vacuous at Q_S means the scheme is broken at
    Q_S would be a category error and is explicitly forbidden by this record's own method
    ceiling. No FIPS-204-parameter security claim of any tier is made; the ledger reports what
    stated bounds and published measurements say, with every entry carrying its provenance.
  mechanism: >-
    STAGE 0, PROBE EVERY DECLARED BLOCKER BEFORE DESIGNING AROUND IT. This stage exists
    because the first version of this record did not do it. A recorded fetch failure is a fact
    about the moment it was recorded, never a standing property of a source, and a design that
    routes around an unobtained document must re-probe that document at design time and record
    the probe with its date. Executed 2026-08-24 for ePrint 2023/246: see
    novelty_screen.method. Result - the abstract page returns content and the PDF downloads
    (about 625 kB); what this session lacks is a PDF text extractor, not access. Any session
    that has one can transcribe R1 directly.
    STAGE 1, TRANSCRIBE. For each route, transcribe the bound EXACTLY as stated in its source,
    with the source recorded, and mark every symbol as obtained or unobtained. R1's source is
    ePrint 2023/246 and its status is OBTAINABLE-BUT-UNRENDERED-HERE: the executing session
    must render the PDF (poppler-utils or equivalent) and transcribe the ROM and QROM
    CMA-to-NMA statements, then extract (a, b), the exponents of Q_S and Q_H in the dominant
    term. THE SYMBOLIC FALLBACK REMAINS DEFINED BUT IS NO LONGER THE PLAN: if and only if
    rendering fails, the route is carried as a SYMBOLIC row with the exponent recorded as an
    unknown from a small declared set (linear, quadratic, square root) and Q_S* reported as a
    function of it, with the undetermined offset (1/a)*log2(constant) stated explicitly. A
    symbolic row is now a DEGRADED outcome to be reported as such, not a design feature.
    STAGE 2, COMMON UNITS. Convert every route to the same triple (bits guaranteed, Q_S, Q_H)
    at a frozen evaluation point declared before any arithmetic: Q_H = 2^64 hash queries,
    category floor 128 / 192 / 256 bits, classical core-SVP convention for the lattice side.
    Report the ledger's sensitivity to each of those three choices, because a ledger whose
    conclusion flips under the evaluation point is reporting the evaluation point.
    STAGE 3, SOLVE. Solve Bits_r(k, Q_S) = floor(k) for Q_S per (k, r). Report the table, its
    row minimum, and which route supplies the minimum at each category.
    STAGE 4, THE CALIBRATION THAT CAN FAIL. Run the identical ledger machinery on SLH-DSA,
    where a signature limit is real, known and standardised (2^64 per key, recalled from FIPS
    205 and to be re-checked from the primary text). The ledger must return a finite Q_S* of
    that order. If it returns infinity or 2^128 for SLH-DSA, the machinery is not measuring
    signature limits and no ML-DSA row is reportable.
    STAGE 5, COMPOSE WITH THE REPOSITORY. Multiply R3's Q_S* by IDEA-20260808-5a748c's
    Delta_beta to produce the single sentence the ledger exists for: "after Q_S signatures, a
    passive collector holds t0, and the concrete MLWE instance it faces is Delta_beta bits
    easier than the one a key-only adversary faces" - with Delta_beta taken from that
    proposal's own run if it has one, and left symbolic if it does not. NO NUMBER IS INVENTED
    FOR Delta_beta HERE. R3's own bracket is imported from IDEA-20260805-630606 together with
    that record's derived floor of 34 / 60 / 58, and both are attributed in the table's
    provenance column.
  novelty_screen:
    method: >-
      TWO PASSES, AND THE FIRST ONE'S DEFECTS ARE DISCLOSED RATHER THAN OVERWRITTEN. FIRST
      PASS (2026-08-21): the crypto-kb MCP retrieval index is UNAVAILABLE this session
      (in-memory Qdrant), so no kb-provenance citation appears here. RIPGREP over
      /home/user/crypto-autoresearcher with the Grep tool (ripgrep, -i): "FO ledger|Frodo.*
      ledger|tightness ledger" over ledger/proposals/ returned 11 files - IDEA-20260816-d270bc,
      -adf2a2, -9bec34, -8596af, -7b9457, -72e5e5, -583998, -32c366, -3949c8, -1418f4 and
      IDEA-20260805-57fc49 - and I read the id, question_id, title and claim head of
      IDEA-20260816-583998, which is under RQ-FRODO-a2dbe2 and states a ROM-to-QROM gap as a
      six-entry EXPONENT VECTOR for one KEM transform. A combined count-mode pass for
      "hedged|deterministic mode|SampleInBall|ExpandMask|multi-target|multi-user|QROM|abort
      rate|rejection sampling" over ledger/proposals/ returned 611 occurrences across 174
      files, too coarse to screen with. "ML-DSA|Dilithium" over knowledge/ returned 40 files;
      glob ledger/hypotheses/H-MLDSA-* returned 7. READ IN FULL: RQ-MLDSA-001, GOAL-MLDSA-001
      (including next_action and the ePrint 2023/246 blocker recorded there), KN-FIND-720727,
      KN-LIT-4f3b80, the 7-title inventory of pre-existing RQ-MLDSA-001 proposals,
      docs/inventor-protocol.md (all sections), docs/target-result-profile.md, KN-TECH-1a5b7e.
      Read the title and claim head of IDEA-20260808-5a748c. WEB SEARCHES bearing on this
      record: "Hint-MLWE Dilithium number of signatures rejection sampling security reduction";
      "multi-user security ML-DSA Dilithium tightness multi-target forgery N public keys";
      '"Uncompressing Dilithium''s Public Key" CRYPTO 2025 recover t0 from signatures hints
      abstract'; '"number of repetitions" OR "rejection rate" Dilithium leaks secret key norm
      per-key acceptance probability distribution'. FETCHED AND READ:
      https://www.ietf.org/archive/id/draft-connolly-cfrg-ml-dsa-security-considerations-02.html
      (Section 3.2-5 quoted; explicitly checked for a signature-limit statement and none
      found beyond that sentence), https://eprint.iacr.org/2024/1373 (abstract verbatim),
      https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.204.ipd.pdf. FETCH FAILURE recorded:
      https://eprint.iacr.org/2024/2046.pdf returned unrenderable binary.
      THAT PASS READ PROPOSAL TITLES AND A HYPOTHESIS FILE COUNT, opened no hypothesis body and
      no experiment specification, opened nothing under the sibling question RQ-MLDSA-ffa0f5,
      MISREPORTED the status of H-MLDSA-d1e509, and DID NOT ATTEMPT ePrint 2023/246 at all,
      treating a 2026-08-05 HTTP 403 as a standing property. All four defects were found by an
      independent red-team screen and all four are corrected below.
      SECOND PASS (2026-08-24), by path and by command. (a) A Grep for
      "question_id: RQ-MLDSA-ffa0f5" over ledger/proposals/ returned 11 files, ten of them the
      sibling question's: IDEA-20260805-031ce2, -630606, -bb52fa, IDEA-20260808-4f83f6,
      -e5f947, IDEA-20260821-60ba98, -6109f8, -65739b, -6d1b97, -71fc18. The head of
      IDEA-20260805-630606 was read directly and its title states the floor and the gap
      verbatim. (b) ALL SEVEN H-MLDSA-* hypothesis BODIES were opened. H-MLDSA-d1e509 WAS READ
      DIRECTLY AND ITS STATUS IS `specified`, with experiment_id EXP-MLDSA-3f7ab2 and
      source_idea IDEA-20260805-3f7ab2; the first pass reported it `inconclusive` and that was
      simply wrong. (c) A Glob of experiments/EXP-MLDSA-*/specification.yaml returned SEVEN:
      1c66ac, 15866e, 2b6f17, 462ea2, 3f7ab2, 8c8fa2, a8d531; the head and claim_ceiling of
      EXP-MLDSA-8c8fa2 were read and it is the committed contract that computes the 34 / 60 /
      58 floor. A Glob of experiments/EXP-MLDSA-*/runs/*/*.yaml shows committed run records
      under 2b6f17, 3f7ab2 and a8d531 only - EXP-MLDSA-3f7ab2 is the experiment attached to
      H-MLDSA-d1e509 and it HAS a run record.
      (d) THE BLOCKER PROBE, WHICH IS THE PART THAT CHANGES THE DESIGN. On 2026-08-24 this
      agent fetched https://eprint.iacr.org/2023/246 and received the paper's page: title
      "Fixing and Mechanizing the Security Proof of Fiat-Shamir with Aborts and Dilithium",
      authors Barbosa, Barthe, Doczkal, Don, Fehr, Gregoire, Huang, Hulsing, Lee, Wu, and the
      abstract verbatim, including "We provide new, fixed proofs for the affected CMA-to-NMA
      reduction, both for the ROM and the QROM, and we perform a concrete security analysis for
      the case of Dilithium to show that the claimed security level is still valid after
      addressing the gap." A second fetch of https://eprint.iacr.org/2023/246.pdf returned the
      PDF itself, about 625 kB, which was saved locally. THE 403 IS STALE. What this session
      could NOT do is render the PDF's text: no PDF text extractor is installed here (an
      attempted page render failed with "pdftoppm is not installed"), so THIS AGENT HAS NOT
      READ THE THEOREM STATEMENT and does not transcribe any bound. The honest status of R1 is
      therefore: SOURCE OBTAINABLE, THEOREM NOT YET TRANSCRIBED, and the transcription is a
      task for a session with poppler-utils or equivalent - not a research obstruction.
    results: >-
      The Hint-MLWE search returned the KLSS Crypto'23 assumption and a rejection-free ZK
      framework built on it (Springer chapter 10.1007/978-3-032-13301-4_6), confirming that
      Hint-MLWE is stated for DISCRETE GAUSSIAN secrets - which is the named transfer gap for
      route R2 and is why R2 is carried as a documented-obstruction route rather than as a
      number. The multi-user search returned no ML-DSA signature-limit analysis. The retrieved
      IETF draft contains the sentence under test and nothing else on the subject. Inside the
      repository: the eleven "ledger"-matching proposals are all in the ML-KEM and FrodoKEM
      lanes and concern KEM transform tightness; IDEA-20260816-583998 is the closest in method
      and is a ROM-to-QROM exponent-vector object for one transform, with no empirical route
      and no Q_S* solve.
      THE SECOND PASS OVERTURNS TWO STATEMENTS THE FIRST PASS MADE. (1) THE CLAIM THAT "no
      RQ-MLDSA-001 proposal mentions a signature limit, Q_S, or the number of signatures per
      key" WAS TRUE OF RQ-MLDSA-001 AND MISLEADING, because the sibling question owns exactly
      that quantity: IDEA-20260805-630606 (RQ-MLDSA-ffa0f5) is titled around it - "What 'a small
      number of signatures' can mean at most: the hint vector is the only t0-bearing channel in
      an ML-DSA signature, its entropy is at most log2 sum_{i<=omega} C(256k, i) bits, and the
      resulting floor is 34 / 60 / 58 signatures against a published 2-5 x 10^5 -- a factor of
      3.4 x 10^3 to 1.5 x 10^4 that nobody has charged". That is route R3's content, derived,
      with the gap already charged, and experiments/EXP-MLDSA-8c8fa2/specification.yaml is the
      committed contract that computes it (claim_ceiling: "TIER crypto for the floors ...
      no algorithm of any cost determines t0 from fewer than 34 / 60 / 58 signatures"). R3 is
      therefore an IMPORT, not a contribution, and the record now says so in claim (C).
      (2) THE STATUS OF H-MLDSA-d1e509 WAS MISREPORTED. The first pass wrote that it "is
      recorded `inconclusive` pending exactly the blocked PDF". The committed file reads
      `status: specified`, it carries experiment_id EXP-MLDSA-3f7ab2, and that experiment has a
      committed run record. Nothing in this record may rest on the earlier statement, and the
      "adjacent to a live, stalled hypothesis" framing is withdrawn.
      (3) THE INFRASTRUCTURE BLOCKER IS STALE. ePrint 2023/246's abstract page and PDF both
      returned content on 2026-08-24 (see method (d)). The entire architectural justification
      for carrying R1 symbolically - "the ledger is designed to be computable without that PDF"
      - was therefore a design around a condition that had already lapsed. R1 is rewritten as a
      transcription route and the symbolic form is demoted to a contingency.
    verdict: >-
      UNVERIFIED. The sentence "Corpus novelty is checked and clean for RQ-MLDSA-001" is
      WITHDRAWN: it was written from proposal titles and a file count, it did not cover the
      sibling question, and the sibling question owns one of this record's three routes.
      The honest classification, route by route, is now: R3 is INTERNAL PRIOR ART - it belongs
      to IDEA-20260805-630606 and EXP-MLDSA-8c8fa2 and is imported with attribution, adding
      zero. R1 is TRANSCRIPTION of somebody else's theorem from a source this program can now
      obtain, and its novelty is nil by construction; what is new is only that the program
      would hold the exponent vector at all. R2 is expected to yield a named obstruction rather
      than a bound. WHAT REMAINS CLAIMED AS NEW is narrower than the first version asserted and
      is exactly three things: the ASSEMBLY of heterogeneous routes onto one Q_S axis with a
      per-row provenance and tier column; the SLH-DSA calibration that can fail; and the
      composition with IDEA-20260808-5a748c's Delta_beta into a single operational sentence.
      External novelty is NOT established: four searches, four successful fetches, and the two
      primary proof sources (ePrint 2023/246 for R1, the KLSS Hint-MLWE paper for R2) remain
      UNREAD IN THIS SESSION - 2023/246 now for want of a PDF renderer rather than for want of
      access. It is likely that the Q_S-dependence of the Dilithium reduction is written down
      explicitly in 2023/246, in which case R1 is pure transcription, which is the intended
      outcome and lowers this record's cost. ASSEMBLED FROM KNOWN PARTS: the exponent-vector
      transcription method is IDEA-20260816-583998's and is cited as such, not claimed; every
      route's underlying bound is somebody else's theorem; R3's floor is 630606's.
  novelty_status: unverified
  object_first_candidate:
    tracked_object: >-
      The GUARANTEE BUDGET as a function of Q_S: a single scalar, "bits still guaranteed",
      followed from the statement of a bound, through substitution of the FIPS 204 parameters
      and the frozen evaluation point, to the solve for Q_S*. It is tracked along three
      routes that share the axis (Q_S) and share nothing else - one proof-theoretic, one
      transcript-theoretic, one experimental.
    lossiness: >-
      SEVERELY LOSSY AND THAT IS THE DESIGN. Each route's full content - a theorem with its
      adversary class, its oracle model, its simulation strategy, its statistical distances -
      is projected onto one real number per (k, Q_S). Everything that distinguishes a ROM
      argument from a QROM argument from a laboratory measurement is discarded. The discard is
      compatible with the operation the ledger performs, which is a MINIMUM over routes: a
      minimum needs only a common ordered scale, and "bits at a frozen evaluation point" is
      one. It is emphatically NOT a change of coordinates: from the scalar one cannot recover
      the route, the model, or the adversary class, which is exactly why the ledger reports
      WHICH route supplies each minimum alongside the number, and why the method ceiling below
      forbids reading a small Q_S* as a break.
    propagation: >-
      One step is one substitution into the bound. The propagation law is the exponent vector:
      if the dominant term carries Q_S^a * Q_H^b, then a unit increase in log2 Q_S costs a
      bits and the whole route is characterised by (a, b). That is the one-step observable and
      it is measurable by symbolic differentiation of the transcribed bound. NOTE THAT THE
      JUSTIFICATION HAS CHANGED: the first version of this record said this property was
      "precisely what makes the ledger computable while ePrint 2023/246 is unreachable". That
      paper is reachable. The exponent vector is still the right one-step observable, because
      it is what makes routes with incomparable constants comparable at all - not because a
      source is missing.
    survival_score: >-
      The object survives the entire computation for R1 and R3 and dissolves partway through
      R2. R1: the exponent vector propagates from the theorem statement to Q_S* intact. R3:
      the published signature count is already a number on the axis and needs only the
      Delta_beta multiplier to become bits. R2: the object dissolves at the Gaussian-versus-
      uniform mismatch, because a hint budget stated for discrete Gaussians has no defined
      value for a rejection-sampled uniform response. Reporting exactly where it dissolves,
      with the mismatch named, is R2's deliverable and is a section-4-standard closure rather
      than a gap.
  null_object_control: >-
    THE SLH-DSA CALIBRATION, and it can fail. Apply the identical ledger machinery, the
    identical frozen evaluation point and the identical solve to SLH-DSA, whose per-key
    signature limit is real, standardised and known (2^64, recalled from FIPS 205 and to be
    re-read from the primary text before use). DECLARED BEFORE THE RUN: the machinery must
    return a finite Q_S* within two orders of magnitude of 2^64 for at least one route. If it
    returns infinity, or a value above 2^100, the machinery cannot detect a signature limit
    that exists and NO ML-DSA row is reportable. SECOND CONTROL, the derived-zero arm: apply
    the machinery to a route whose bound has NO Q_S dependence at all (a one-time-signature
    bound stated per signature); its exponent vector must come out as exactly (0, b) and its
    Q_S* as unbounded. If a Q_S-free bound yields a finite Q_S*, the transcription step is
    manufacturing dependence. THIRD CONTROL, transcription independence: two transcribers
    independently extract the exponent vector from the same stated bound without seeing each
    other's work; a disagreement means the bound's statement is being interpreted, not read,
    and the row is marked contested rather than averaged. FOURTH CONTROL, ADDED 2026-08-24 AND
    IT IS THE ONE THIS RECORD OWED ITSELF: every source declared unobtainable by any record is
    re-probed at design time and the probe is recorded with its date and its result. The first
    version of this record failed that check against ePrint 2023/246 and built an entire route
    architecture on the failure; the control exists so that the next record does not.
  discriminated_from:
  - >-
    IDEA-20260805-630606 (RQ-MLDSA-ffa0f5) OWNS ROUTE R3 AND THIS RECORD DOES NOT COMPETE WITH
    IT. That proposal derives the information-theoretic floor - the hint vector is the only
    t0-bearing channel, its entropy is at most log2 sum_{i<=omega} C(256k, i) bits, hence 34 /
    60 / 58 signatures - places the published 2-5 x 10^5 against it and charges the factor of
    3.4 x 10^3 to 1.5 x 10^4. Everything R3 contains is either that record's or ePrint
    2024/1373's. WHAT THIS RECORD ADDS AROUND IT is placement: R3 becomes one row of a table
    whose other rows are proof-theoretic, with a common evaluation point, a provenance column
    and a tier column, and with a minimum taken across rows. If a reviewer judges that
    placement insufficient to justify a separate record, the correct remedy is to fold this
    ledger into 630606's line rather than to run both.
  - >-
    experiments/EXP-MLDSA-8c8fa2/specification.yaml (H-MLDSA-2ae88d, RQ-MLDSA-ffa0f5,
    GOAL-MLDSA-002) is the COMMITTED CONTRACT that computes 630606's floor, with a graded
    resampled-t0 null and a reduced-cell positive control, and its claim_ceiling states the
    floors at TIER crypto. This record must not recompute that floor, must not restate its
    numbers as its own, and must cite it wherever R3's row is quoted.
  - >-
    IDEA-20260816-583998 (RQ-FRODO-a2dbe2) turns a ROM-to-QROM gap for ONE KEM transform into
    a six-entry exponent-vector difference. Same method family, explicitly credited. Different
    lane, different primitive, different object: 583998's object is the GAP BETWEEN TWO MODELS
    at fixed query counts; this record's object is a SOLVE FOR Q_S along one axis, across three
    routes one of which is empirical - a route class 583998 has none of.
  - >-
    IDEA-20260808-5a748c prices t0 as a core-SVP gap Delta_beta between the t1-only and full-t
    MLWE instances. That is a static quantity at Q_S = 0. This record supplies the missing
    dynamic half - the signature count at which the gap closes - and composes the two. Neither
    contains the other, and the composition is stated as a product, not as a new estimate.
  - >-
    H-MLDSA-d1e509 (RQ-MLDSA-001, GOAL-MLDSA-001) concerns the CMA-to-NMA tightness FACTOR
    applied to KN-LIT-056 Table 2 estimates. ITS COMMITTED STATUS IS `specified` - an earlier
    version of this record stated `inconclusive` and that was a misreport of a repository fact,
    corrected here. It carries experiment_id EXP-MLDSA-3f7ab2, which has a committed run
    record. This record does not touch that hypothesis's status, does not assume its answer,
    and now shares its primary source: both want what ePrint 2023/246 states, and the
    2026-08-24 probe showing that paper obtainable is material to d1e509 as well as to R1.
  - >-
    IDEA-20260821-4c0246 turns the N (targets) dial. This record turns the Q_S (signatures per
    key) dial. They are orthogonal axes of the same resource space and could be combined later;
    neither is assumed by the other.
  - >-
    ePrint 2024/1373 is a published attack on t0. This record does not reproduce it, does not
