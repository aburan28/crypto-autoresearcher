idea:
  id: IDEA-20261007-9e4433
  question_id: RQ-TORS-8c7b79
  added: '2026-10-07'
  status: proposed
  approved_by: null
  title: >-
    Doubling preimage size on y^2 = x^3 + 7x + 3 over F_47 is 0 or
    the rational 2-torsion count
  class: control
  claim: >-
    Let E be y^2 = x^3 + 7x + 3 over F_47. If the discriminant is 0
    the model is singular and the run is an invalid setup. Otherwise
    let n2 be the number of points T of E(F_47), counting the point
    at infinity, with 2T = O. Let P be the affine point with least
    x-coordinate, then least y in {0, 1, ..., 46}. Let h be the
    number of points Q of E(F_47) with 2Q = P. Then h = 0 or h = n2.
    A positive h different from n2 is a negative. This is not a
    comparison of the number of roots of x^3 + 7x + 3 with the number
    of affine points satisfying 2P = O. No discrete logarithm is
    computed, and the generic-group exponent 1/2 is unchanged.
  mechanism: >-
    PAIR (representation, Sigma): the representation is the affine
    point Q. Sigma is the doubling map, not translation by a secret
    scalar. Trichotomy class: partial-action, because doubling is a
    group endomorphism and the fibre size is constant on the image.
    The projection keeps only the integer h and discards the halves.
    Explanation A: 2Q = P is either insoluble or has a fibre of size
    equal to the full rational 2-torsion count, including infinity.
    Explanation B: a positive fibre whose size is not n2 means the
    instrument is not counting a coset of E[2](F_47). No factor base
    is built.
  novelty_status: unverified
  citations:
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic algorithm needs a square-root number of group
        operations. This idea does not produce one.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Isogenous curves share the group-structure class of weakness.
        A doubling fibre is not used as a hidden endpoint.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
    - ref: RQ-TORS-8c7b79
      provenance: internal
      claim: >-
        The question asks whether ell-torsion carries public
        information about k. This fibre is point-dependent and does
        not read a discrete logarithm.
      verified_by: ledger/questions/RQ-TORS-8c7b79.yaml
  assumptions:
    - The model is nonsingular. A zero discriminant is a failed setup.
    - Points are counted in E(F_47), including the point at infinity inside n2.
    - Two representations of the same point are counted once.
  predictions:
    - metric: absolute difference of h and n2, given that h is positive
      direction: lower
      minimum_effect: exactly 0 whenever h is positive, and h may also be 0
  minimal_test:
    design: >-
      Enumerate E(F_47). Count n2 and h for the least eligible P.
      Do not run Pollard rho and do not factor a division polynomial.
    controls:
      - A zero discriminant makes the run invalid.
      - The identity satisfies 2O = O, so n2 is at least 1. A count of 0 is an invalid setup.
      - If the least point is not on the curve, the enumeration is invalid.
    required_metrics:
      - h
      - n2
      - x_P
      - discriminant_is_zero
  falsification_conditions:
    - h is positive and h is not equal to n2, on a nonsingular model.
    - The discriminant is 0. No fibre from that run is admissible.
  confounders:
    - Omitting the point at infinity from n2 makes a fibre of size 4 look like a mismatch against an affine count of 3. Infinity is included.
    - Listing both (x, y) and (x, -y) as one point undercounts h.
  interpretation_limits:
    - A fibre of size n2 does not reveal k and does not change the exponent 1/2.
    - The scope is this one curve at p = 47.
    - This is not the statement that the number of roots of the cubic equals the number of affine points with 2P = O.
  heuristic_assumptions:
    - id: H1
      statement: >-
        In an abelian group, the equation 2Q = P has either no
        solution or a fibre whose size equals the number of solutions
        of 2T = O. At this one curve that number is n2, counting
        infinity. The heuristic is that the enumeration implements
        that group law.
      rigorous_support: >-
        KR-RHO-13bf67, opened, bounds generic algorithms and does not
        state this fibre size. KR-RHO-755e35, opened, is about isogeny
        classes and does not state h.
      validation_plan: >-
        At this one curve, record h and n2. If h is positive and
        different from n2 while the discriminant is nonzero, H1 is
        false for this implementation. No second prime is claimed.
  target_complexity:
    time_exponent: >-
      One enumeration of the affine plane at p = 47. The generic-group
      exponent 1/2 is unchanged.
    memory_exponent: O(1) points beyond the group list
    best_known: >-
      KR-RHO-13bf67, opened, gives the square-root generic bound.
      A fibre count beats nothing.
    hidden_overhead: >-
      No o(1) term. The test is one curve.
    tradeoff_note: >-
      No time-memory tradeoff.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-13bf67
      - KR-RHO-755e35
      - KR-IC-5a43e5
    nearest:
      - ref: KR-RHO-13bf67
        provenance: internal
        relation: orthogonal
        delta: >-
          The opened row is a square-root lower bound for generic
          algorithms. This idea runs no algorithm on a secret scalar.
          The quantitative addition is the pair (h, n2), with h equal
          to 0 or to n2, at the prime 47. The exponent distance to
          that bound is the whole 1/2, which is not claimed.
  dominated_by: >-
    Pollard rho, at the square-root exponent in KR-RHO-13bf67,
    dominates any reading of this fibre count as an attack. The
    integer h does not beat that baseline.
  sota_delta: >-
    No exponent is derived. The quantitative delta is the integer
    h - n2 when h is positive, predicted equal to 0, at the prime 47.
    The generic-group exponent stays 1/2.
