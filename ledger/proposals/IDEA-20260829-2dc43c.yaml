idea:
  id: IDEA-20260829-2dc43c
  question_id: RQ-ECDLP-165d4b
  added: '2026-08-29'
  title: >-
    THE AUTOMORPHISM COLUMN OF THIS CENSUS IS FINITE AND CLOSABLE, NOT
    SAMPLEABLE: the unit group weight w(D) = |Aut(E)| that a 2026 distribution
    law uses to make CM orders equidistribute in ordinary isogeny classes is the
    SAME quantity as the rho discount's sqrt(|Aut|), so the population-average
    automorphism discount over random ordinary prime-field curves is exactly
    1 + 3.02/p - derive it, then verify by EXHAUSTIVE enumeration whether the
    |Aut| > 2 locus is exactly 6 + 4 curves per prime or is over-represented
  class: measurement

  claim: >-
    (A) THE TRACKED OBJECT - the unit weight. For an ordinary E/F_p with
    End(E) = O_D, Aut(E) = O_D^*, so |Aut(E)| = w(D), which is 6 for D = -3,
    4 for D = -4, and 2 otherwise. The tracked object is the RATIONAL NUMBER
    1/|Aut(E)| attached to each curve - a mass, not a curve. It is a genuinely
    lossy projection: it discards j, the coefficients, the point set and the
    order, retaining one of three values. It is NOT a change of coordinates -
    nothing is recoverable from it. And it propagates deterministically under
    the census's operation of aggregation: masses ADD over disjoint sets of
    curves, which is exactly the operation a census performs, so the retained
    part survives every census step. It fails to propagate under the group law -
    but the census never applies the group law to it, which is why this object
    is admissible where IDEA-20260807-f00729's orbit object is not.

    (B) THE EXTERNAL INGREDIENT, RETRIEVED THIS SESSION. arXiv 2605.07626,
    el baraka and ezzouak, "Weighted Distributions of Complex Multiplication
    Orders in Ordinary Isogeny Classes" (submitted 2026-05-08): the distribution
    of CM orders within an ordinary isogeny class is expressed in terms of the
    WEIGHTED class number h*(D) = h(D)/w(D), and the natural density of primes
    admitting a curve with a prescribed CM order O_D is 1/(2 h(D)) by Chebotarev
    and ring class field splitting. THE POINT FOR THIS CENSUS - the weight that
    makes that distribution law clean is exactly the automorphism count that
    KN-TECH-018's rho discount is a function of. The census's "how special is
    this family" axis and its "how often does this family occur" axis are the
    SAME quantity, read twice.

    (C) THE ZERO-COMPUTE CENSUS LAW. Take D = -3 - h(-3) = 1, so the density of
    primes admitting an ordinary curve with CM by Z[zeta_3] is 1/(2*1) = 1/2,
    which reproduces the textbook fact that j = 0 is ordinary exactly when
    p = 1 mod 3, a density-1/2 condition. Likewise D = -4, h(-4) = 1, density
    1/2, reproducing p = 1 mod 4. THAT IS THE BASELINE REPRODUCTION CHECK FOR
    THE RETRIEVED FORMULA AND IT COSTS NOTHING. Now the per-prime count - over
    F_p with p = 1 mod 3 there are exactly 6 F_p-isomorphism classes with j = 0
    (the sextic twists), and with p = 1 mod 4 exactly 4 with j = 1728 (the
    quartic twists), against about 2p classes in total. So the density of
    |Aut| > 2 curves is (6 + 4)/(2p) = 5/p, and
    E[sqrt(|Aut|/2)] = [ (2p - 10) + 6*sqrt(3) + 4*sqrt(2) ] / (2p)
    = 1 + (6*0.7321 + 4*0.4142)/(2p) = 1 + 3.02/p.
    THE POPULATION-AVERAGE AUTOMORPHISM DISCOUNT OVER UNIFORMLY RANDOM ORDINARY
    PRIME-FIELD CURVES IS THEREFORE 1 + 3.02/p EXACTLY, NOT MERELY "NEGLIGIBLE".
    At p about 2^256 that is 1 + 2^(-254.4). The census cell
    "automorphism-rich" is at most TEN curves wide per prime and is therefore
    EXHAUSTIVELY CENSUSABLE at any p, not sampleable - one of the very few
    columns of this census that can be closed rather than estimated.

    (D) THE DISCRIMINATION. Two mutually exclusive readings, separated by an
    exhaustive enumeration costing minutes.
      READING 1 - the counts are exactly 6 and 4 (restricted to the ordinary,
      prime-order sub-population by the twists' traces), the measured
      population-average discount matches 1 + 3.02/p, and the automorphism column
      of this census is CLOSED with an exact number. The RQ's decision_target
      then reads - endomorphism-orbit methods are worth exactly the ceiling
      already measured at the at most 10 curves per prime that have one, and
      their POPULATION value is 1 + 3.02/p. That is a priced closure, not a
      fatigue report.
      READING 2 - the enumeration finds |Aut| > 2 curves outside j in {0, 1728},
      or the counts exceed 6 and 4, or the ordinary prime-order sub-population
      is over-represented relative to the w(D) weighting. Then Aut(E) = O_D^* is
      failing over F_p in a way this program has not recorded, the weighting is
      not the right census null, and the endomorphism-orbit arm has more
      population mass than believed. This is the outcome worth escalating.

    (E) WHAT IS NOT CLAIMED. No exponent moves; 1 + 3.02/p is a constant-factor
    statement about a population and is offered as a CEILING, which is its whole
    value. The identification w(D) = |Aut(E)| is standard for ordinary curves
    and is derived here, not taken from the retrieved paper, whose full text was
    NOT read - only its arXiv abstract page.

  mechanism: >-
    STEP 1 (zero compute). Derive (A) and (C) explicitly: Aut(E) = End(E)^* for
    ordinary E; the unit groups of imaginary quadratic orders are plus/minus 1
    except for D = -3 (order 6) and D = -4 (order 4); the sextic and quartic
    twist counts; the aggregation identity for E[sqrt(|Aut|/2)]. Record the
    arithmetic to the stated precision.

    STEP 2 (zero compute, the baseline reproduction). Check the retrieved
    density formula 1/(2h(D)) against the two cases where the answer is already
    known from congruence conditions - h(-3) = h(-4) = 1 give density 1/2 each,
    matching p = 1 mod 3 and p = 1 mod 4. Then check ONE case where the answer
    is not a congruence - D = -23, h(-23) = 3, predicted density 1/6, tested by
    counting primes in a declared window that admit an ordinary curve with CM by
    the maximal order of discriminant -23. IF THAT CHECK FAILS, the retrieved
    formula is not being applied correctly and every downstream number is void.
    This is the cheapest possible guard against misreading an abstract.

    STEP 3 (low compute, THE EXHAUSTIVE ENUMERATION). For a declared list of 60
    primes at 16, 18 and 20 bits (stratified - 15 with p = 1 mod 12, 15 with
    1 mod 3 only, 15 with 1 mod 4 only, 15 with neither), enumerate ALL
    F_p-isomorphism classes of elliptic curves - about 2p of them - and for each
    compute the order by BSGS in the Hasse interval (about 4*p^(1/4) group
    operations, so about 64 operations per curve at 16 bits and about 180 at 20
    bits), the j-invariant, the automorphism group by direct computation of the
    F_p-rational automorphisms of the Weierstrass model, and the ordinary and
    prime-order flags. Tabulate the exact counts by (automorphism count,
    ordinary, prime-order) and compute the empirical population-average discount.

    STEP 4 (low compute, THE CROSS-CHECK). Independently of the j-invariant,
    detect |Aut| > 2 by a purely computational test - count the F_p-rational
    solutions (u, r, s, t) of the Weierstrass isomorphism equations fixing the
    curve - so that the count does not presuppose the j in {0, 1728}
    classification. Agreement between the two detectors is the instrument
    certificate; a disagreement IS READING 2 and is the single most valuable
    output.

    STEP 5 (zero compute). Emit the closed automorphism column - for every
    (p, automorphism count, ordinary, prime-order) cell, an EXACT count with a
    completeness certificate (2p curves enumerated, none skipped), plus the
    derived population discount and its measured value. This is a census column
    that is complete rather than sampled, and it is the artifact.

  novelty_status: unverified

  citations:
    - ref: "arXiv:2605.07626"
      provenance: retrieved
      claim: >-
        "Weighted Distributions of Complex Multiplication Orders in Ordinary
        Isogeny Classes", el baraka and ezzouak, submitted 2026-05-08. The
        distribution of CM orders within an ordinary isogeny class is expressed
        via the weighted class number h*(D) = h(D)/w(D) with w(D) the number of
        roots of unity of the associated imaginary quadratic field, and the
        natural density of primes admitting a curve with prescribed CM order
        O_D is 1/(2 h(D)), proved via Chebotarev density and ring class field
        splitting conditions.
      verified_by: >-
        this idea-generator session, WebFetch of the arXiv abstract page on
        2026-08-29. ABSTRACT PAGE ONLY - the full text was NOT read, no theorem
        numbering was checked, and the exact hypotheses under which the density
        1/(2h(D)) holds were not verified. Any use beyond the two h(D)=1 cases
        checked in STEP 2 requires reading the paper.
    - ref: "arXiv:2512.23921"
      provenance: retrieved
      claim: >-
        Cullinan and Kaplan, "The probability of isomorphic group structures of
        isogenous elliptic curves over finite fields", 2025-12-30 - determines
        the proportion of primes p for which E(F_p) and E'(F_p) are isomorphic
        for ell-isogenous curves over Q. Recorded as an adjacent ingredient; it
        is NOT used by this record, because in this RQ's prime-order scope group
        structure is forced cyclic.
      verified_by: >-
        this idea-generator session, WebFetch of the arXiv abstract page on
        2026-08-29; the abstract states no explicit formula and none is used.
    - ref: KN-TECH-018
      provenance: internal
      claim: >-
        The rho speedup factor is about sqrt(|Aut|); the 0.886*sqrt(n)
        convention already contains the sqrt(2) negation factor, so the EXTRA
        discount is sqrt(|Aut|/2); the effect is a constant, not an exponent.
      verified_by: this idea-generator session, 2026-08-29, read in full
    - ref: EV-ENDO-10109d
      provenance: internal
      claim: >-
        The sqrt(|Aut|/2) ceiling is ATTAINED in practice - j=0 ratio-to-ceiling
        mean 1.0043 (sd 0.1128) and j=1728 mean 1.0442 (sd 0.1059) over 20 seeds
        at p=100057, with fruitless-cycle counts zero in 38-40 of 40 samples.
      verified_by: this idea-generator session, 2026-08-29, read in full
    - ref: RQ-ECDLP-912694
      provenance: internal
      claim: >-
        A sibling question already covers whether an ordinary special-j curve
        can LEAVE its CM automorphism locus by a public rational odd-degree
        isogeny, at 7-9 bits with ell in {3,5,7,11,13}. Cited to declare the
        boundary - this record counts the locus, it does not study exits from it.
      verified_by: this idea-generator session, 2026-08-29, read in full
    - ref: null
      provenance: recalled
      claim: >-
        For an ordinary elliptic curve over a finite field, Aut(E) is the unit
        group of End(E), and the unit groups of imaginary quadratic orders are
        plus/minus 1 except for discriminants -3 (order 6) and -4 (order 4); the
        sextic and quartic twist counts (6 for j=0 when p = 1 mod 3, 4 for
        j=1728 when p = 1 mod 4) are the standard Silverman X.5 statements.
        Load-bearing for (A) and (C); NOT opened in this session, and STEP 4's
        independent automorphism detector exists precisely so the enumeration
        does not rest on this recollection.
      verified_by: null

  assumptions:
    - >-
      p > 3 throughout; the twist counts 6 and 4 are false in characteristic 2
      and 3 and the enumeration excludes those fields by construction.
    - >-
      "About 2p F_p-isomorphism classes" is an approximation that is exact only
      up to the j = 0 and j = 1728 corrections; the enumeration counts exactly
      and the derived 1 + 3.02/p is reported with its exact denominator, not the
      approximation, in the final artifact.
    - >-
      The retrieved density formula is used ONLY for the two h(D) = 1 cases
      where it reproduces a known congruence, plus one falsification check at
      h(-23) = 3. No other use is made of a paper whose full text was not read.
    - >-
      The RQ scope restricts to ordinary, prime-order, non-anomalous curves.
      The 6 and 4 twist counts are counts of ALL curves with that j; how many
      are ordinary and prime-order is determined by the twists' traces and is
      MEASURED, not assumed.

  proof_search_map:
    bottleneck: >-
      The step "estimate how often the census's special-j cell is occupied".
      Every population-level statement about endomorphism-orbit methods depends
      on it, and this program has only ever sampled it. The bottleneck dissolves
      because the cell turns out to be finite and exhaustively enumerable.
    baseline_embedding:
      parameter_slice: >-
        D = -3 and D = -4, where h(D) = 1 and the retrieved density formula
        1/(2h(D)) must return 1/2, reproducing p = 1 mod 3 and p = 1 mod 4.
      reproduction_check: >-
        Symbolic plus a finite count - over a declared window of the first 10^4
        primes, the measured proportion admitting an ordinary j=0 curve must be
        1/2 within binomial error, and likewise for j=1728. If either misses,
        the retrieved formula is being misapplied and STEP 3 does not run.
    observation_collision:
      observable: >-
        the automorphism count |Aut(E)| in {2, 4, 6}, and the aggregated
        population discount E[sqrt(|Aut|/2)]
      distinct_preimage_search: >-
        REQUIRED IN BOTH DIRECTIONS. (i) Collision expected - all 6 sextic
        twists of j=0 share |Aut| = 6 while having six DIFFERENT traces and
        therefore six different orders and hardness profiles, so the observable
        cannot distinguish an ordinary prime-order sextic twist from a
        supersingular or composite-order one, which is exactly why the
        enumeration carries the ordinary and prime-order flags alongside the
        automorphism count. (ii) Collision that must NOT occur - a curve with j
        not in {0, 1728} and |Aut| > 2. STEP 4's independent detector searches
        for it directly; finding one refutes the recalled Aut(E) = End(E)^*
        statement over F_p as this record uses it and is the record's designated
        falsifier.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the open-ended question "how common are automorphism-rich
          curves" by the finite question "how many of the exactly 6 sextic and 4
          quartic twists per prime are ordinary and prime-order".
        predicted_gain: >-
          Converts a sampling problem into an exhaustive count, so the census
          column is CLOSED with a completeness certificate rather than estimated
          with a confidence interval.
      - transform: specialization_pack
        proposed_object: >-
          The mass 1/|Aut(E)| as a problem-specific resource measure, summed
          over disjoint curve sets, giving E[sqrt(|Aut|/2)] = 1 + 3.02/p.
        predicted_gain: >-
          An exact population ceiling for the entire endomorphism-orbit arm, at
          zero compute, valid at cryptographic p by the same algebra.
    quantifier_order: >-
      Claimed - FORALL primes p > 3, the set of F_p-isomorphism classes with
      |Aut| > 2 has size at most 10 (6 iff p = 1 mod 3, 4 iff p = 1 mod 4), and
      the uniform-population average of sqrt(|Aut|/2) equals
      1 + 3.02/p + O(1/p^2). EXPLICITLY NOT CLAIMED - FORALL curve-generation
      procedures. A procedure that deliberately selects j = 0 has population
      average sqrt(3), not 1 + 3.02/p, and the record states this so the ceiling
      is not misread as a statement about adversarially chosen curves.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The automorphism-rich cell of this census contains at most 10 curves
        per prime, is exhaustively enumerable, and contributes a population
        discount of exactly 1 + 3.02/p." It can NEVER certify that
        endomorphism structure is useless (the sqrt(3) ceiling is real on those
        curves and EV-ENDO-10109d shows it is attained), nor anything about
        curves selected non-uniformly, nor anything about End-orders of
        discriminant other than -3 and -4, whose class numbers exceed 1 and
        which carry NO extra automorphisms at all.
      nearby_object_control: >-
        THE SUPERSINGULAR CURVE, where the hoped-for conclusion FAILS - over
        F_(p^2) the automorphism group of a supersingular curve can be larger
        and End(E) is a quaternion order, so Aut(E) = End(E)^* has a different
        meaning entirely. The method must show the automorphism-rich cell
        BLOWING UP there while staying at 10 over F_p. A method that reports 10
        in both has not identified the load-bearing structure (ordinariness plus
        rationality over the prime field) and its count is void.
    proof_obligations:
      - claim: "Aut(E) = End(E)^* for ordinary E over F_p."
        responsibility: correctness
      - claim: "Unit groups of imaginary quadratic orders are plus/minus 1 except D = -3 and D = -4."
        responsibility: correctness
      - claim: "Exactly 6 sextic twists at j=0 (p=1 mod 3) and 4 quartic at j=1728 (p=1 mod 4)."
        responsibility: size
      - claim: "E[sqrt(|Aut|/2)] = 1 + 3.02/p over the uniform population."
        responsibility: correctness
      - claim: "The retrieved density formula reproduces 1/2 at h(D)=1."
        responsibility: baseline
      - claim: "The enumeration is exhaustive, with a completeness certificate."
        responsibility: feasibility
      - claim: "The supersingular nearby-object control shows the cell blowing up."
        responsibility: strictness
      - claim: "No statement is made about non-uniform curve selection."
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        exact count of F_p-isomorphism classes with |Aut| > 2, by exhaustive
        enumeration, per prime
      direction: different
      minimum_effect: >-
        Exactly 6 when p = 1 mod 3 and not 1 mod 4; exactly 4 when p = 1 mod 4
        and not 1 mod 3; exactly 10 when p = 1 mod 12; exactly 0 when p = 11
        mod 12. Any other value on any of the 60 tested primes is READING 2 and
        escalates.
    - metric: >-
        number of curves with j not in {0, 1728} detected as |Aut| > 2 by the
        independent Weierstrass-isomorphism detector of STEP 4
      direction: different
      minimum_effect: >-
        Predicted exactly 0 across all 60 primes and all about 2p curves each. A
        single such curve refutes the record's central algebraic assumption and
        is the highest-value output available here.
    - metric: >-
        measured uniform-population average of sqrt(|Aut|/2) minus 1, times p
      direction: different
      minimum_effect: >-
        Predicted 3.02 within 5 percent at every tested p = 1 mod 12, and the
        corresponding partial sums (4.39 for p = 1 mod 3 only, 1.66 for
        p = 1 mod 4 only, 0 for p = 11 mod 12). A systematic deviation means the
        twist counts or the aggregation are wrong.
    - metric: >-
        proportion of primes in a declared 10^4-prime window admitting an
        ordinary curve with CM by the maximal order of discriminant -23
      direction: different
      minimum_effect: >-
        Predicted 1/6 within binomial error, per the retrieved 1/(2h(D)) formula
        with h(-23) = 3. A miss means the formula is being misapplied and every
        downstream use in this record is withdrawn.
    - metric: >-
        fraction of the 6 sextic and 4 quartic twists that are simultaneously
        ordinary and of prime order
      direction: different
      minimum_effect: >-
        Reported as an exact count per prime, with no prediction pre-registered
        beyond "at most 6 and at most 4". This is the census cell the RQ's scope
        line "CM and special-j candidates with a verified F_p-defined
        automorphism" actually refers to, and its exact occupancy is the record's
        primary deliverable.

  minimal_test:
    design: >-
      STAGE A (zero compute, hours): the derivations of (A) and (C), plus the
      STEP 2 baseline reproduction on 10^4 primes for D = -3, -4 and the
      falsification check at D = -23. STAGE A alone yields the exact ceiling
      1 + 3.02/p and can be independently reviewed with no runs. STAGE B (low
      compute, hours): the exhaustive enumeration of STEP 3 at 16 bits over 20
      stratified primes (about 2p = 1.3e5 curves each, about 64 BSGS group
      operations per curve, so about 1.7e8 group operations total - comfortably
      within a single-digit CPU-hour budget with harness/toycurve.py), including
      the STEP 4 independent detector on every curve. STAGE C (low compute):
      repeat at 18 and 20 bits on 20 primes each to confirm the counts do not
      drift with p, which they must not, since the prediction is p-independent.
    controls:
      - >-
        p = 11 mod 12 NULL PRIMES - the |Aut| > 2 cell must be EXACTLY EMPTY.
        A nonzero count there is an instrument failure, since j=0 and j=1728 are
        supersingular in that case.
      - >-
        SUPERSINGULAR NEARBY-OBJECT CONTROL over F_(p^2) on a small sample - the
        automorphism-rich cell must be visibly larger, showing the method is
        sensitive to the ordinariness hypothesis rather than proving too much.
      - >-
        TWO INDEPENDENT AUTOMORPHISM DETECTORS (j-invariant classification
        versus direct Weierstrass-isomorphism solution counting) that must agree
        on every one of the about 2p curves; disagreement is blocking.
      - >-
        ORDER CERTIFICATE - every curve's order is verified by recomputing
        #E times P = O for a random P and by the Hasse bound, so no count rests
        on an unverified BSGS result.
      - >-
        ANOMALOUS AND SMALL-k SCREENS applied to every enumerated curve
        (KN-TECH-033, KN-TECH-032), so the census records those cells in the
        same pass at no extra cost.
      - >-
        Matched Pollard rho baseline row per RQ constraint, on a subsample.
    required_metrics:
      - exact per-prime counts by automorphism count, ordinary, prime-order, anomalous and small-k
      - enumeration completeness certificate (curves enumerated vs the exact class count)
      - agreement rate between the two automorphism detectors, which must be 1.000
      - measured p times (population average minus 1) per prime, against the predicted 3.02
      - the D = -3, -4 and -23 density checks against 1/2, 1/2 and 1/6
      - the p = 11 mod 12 empty-cell control
      - the supersingular control's cell size

  falsification_conditions:
    - >-
      Any curve with j not in {0, 1728} is detected with |Aut| > 2 over F_p,
      p > 3. The record's central algebraic assumption is false as used, the
      exact ceiling 1 + 3.02/p is withdrawn, and the automorphism column of this
      census is NOT closable - this is READING 2 and the lane's forward
      direction.
    - >-
      The counts differ from 6 / 4 / 10 / 0 on any tested prime with the two
      detectors agreeing. The twist counts are wrong as used and the derivation
      is withdrawn.
    - >-
      The measured p times (population average minus 1) deviates systematically
      from 3.02. The aggregation is wrong; recompute before any ceiling is
      quoted.
    - >-
      The D = -23 density check misses 1/6 outside binomial error. The retrieved
      formula is misapplied; every use of arXiv 2605.07626 in this record is
      withdrawn and the two h(D) = 1 cases are re-derived from congruences alone
      (which they can be, so the rest of the record survives - this is stated in
      advance so the dependency is honest).
    - >-
      The p = 11 mod 12 control returns a nonempty cell. Instrument failure;
      every count void.
    - >-
      The supersingular control shows the same cell size as the ordinary case.
      The method proves too much and its closure is void.

  confounders:
    - >-
      F_p-ISOMORPHISM VERSUS ALGEBRAIC-CLOSURE ISOMORPHISM. Over the algebraic
      closure there is ONE curve with j = 0; over F_p there are six. Every count
      in this record is over F_p-isomorphism classes and the two must never be
      mixed - a count that silently uses the closure would report 1 instead of 6
      and would change 3.02 to a different number.
    - >-
      F_p-RATIONALITY OF THE AUTOMORPHISM. A j = 0 curve over F_p with
      p = 2 mod 3 is supersingular, and its order-3 automorphism is not
      F_p-rational. The RQ scope demands a VERIFIED F_p-defined automorphism and
      the detector must test rationality, not merely the j-invariant.
    - >-
      THE DISCOUNT IS NOT THE OCCUPANCY. A curve in the cell is genuinely
      sqrt(3) cheaper (EV-ENDO-10109d shows the ceiling is attained). The
      population average being 1 + 3.02/p says nothing about an adversary who
      is handed such a curve, and quoting it as if it did would be a misreading
      the record explicitly forbids.
    - >-
      ORDINARY AND PRIME-ORDER ARE SEPARATE FILTERS from the automorphism count
      and can correlate with it through the twists' traces. The counts must be
      reported as a joint table, never as marginals multiplied together.
    - >-
      DEPENDENCE ON AN ABSTRACT-ONLY READING. The retrieved paper's full text
      was not read. STEP 2 is the guard, and the record is constructed so that
      failing STEP 2 costs it only the D = -23 prediction, not the main
      derivation.

  interpretation_limits:
    - >-
      This is a POPULATION statement under uniform curve selection. It is not a
      statement about any particular curve, about standardized curves, or about
      adversarially selected curves, and it makes none of them safer.
    - >-
      Scoped to ordinary curves over prime fields with p > 3 and F_p-rational
      automorphisms. The supersingular control shows how fast it fails outside.
    - >-
      The exhaustive enumeration is at 16-20 bits. The DERIVATION of 1 + 3.02/p
      is p-independent algebra and is not a toy-scale claim, but its EMPIRICAL
      verification is, and the two are reported separately.
    - >-
      Closing the automorphism column closes ONE column. Per KN-OPEN-019 this
      program has no object enumeration for the ECDLP, so a closed column is not
      a closed census and must not be summarized as one.
    - >-
      The retrieved distribution law is used as a NULL for occupancy, not as
      evidence for any attack. No claim is made that it was verified beyond its
      abstract.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a uniformly random prime p in a declared bit window and a uniformly
        random F_p-isomorphism class of elliptic curves over F_p, the
        distribution of CM orders O_D among ordinary classes agrees with the
        h*(D) = h(D)/w(D)-weighted distribution, so that the occupancy of the
        |Aut| > 2 cell is governed by w(D) alone and equals 6 times the
        indicator of p = 1 mod 3 plus 4 times the indicator of p = 1 mod 4, out
        of the exact class count.
      rigorous_support: >-
        Pairs (i) the rigorous structural fact that for ordinary E/F_p,
        Aut(E) = End(E)^* and the only imaginary quadratic orders with more than
        two units are those of discriminant -3 and -4 - which is what makes the
        cell finite - with (ii) the classical distribution statement it imitates,
        the weighted class-number distribution of CM orders in ordinary isogeny
        classes and the Chebotarev density 1/(2h(D)) of primes admitting a
        prescribed CM order (arXiv 2605.07626, abstract page retrieved
        2026-08-29). This is the same rigorous-bound-times-classical-distribution
        composition the target-result profile requires.
      validation_plan: >-
        SAMPLING - exhaustive, not random: all about 2p F_p-isomorphism classes
        at 60 primes stratified over the four congruence classes mod 12 at 16,
        18 and 20 bits, with two independent automorphism detectors and an order
        certificate per curve. COMPARISON DISTRIBUTION - the exact predicted
        counts 6 / 4 / 10 / 0 by congruence class, and the predicted value 3.02
