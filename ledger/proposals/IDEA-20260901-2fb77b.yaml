  object_first_candidate:
    tracked_object: >-
      THE FIBRE PARTITION OF THE x-LINE INDUCED BY AN F_p-RATIONAL ell-ISOGENY:
      the partition of x(E(F_p)) into the level sets of the degree-ell map
      g(x) = x(phi(P)), followed through the relation-collection computation
      together with its multiplicity pattern. Established families declared
      OFF-LIMITS as the primary lens for this record: the level integer or vector;
      the conductor as a regressor; the endomorphism scalar or degree; the walk
      and its height process; the Galois degree of the torsion; per-curve cost
      batteries stratified by level. The object here is a partition of a set of
      field elements, not a label on a curve.
    lossiness: >-
      PASSES THE LOSSY-PROJECTION TEST, AND THE MARGIN IS THIN ENOUGH TO STATE
      CAREFULLY. The projection is x(P) |-> g(x(P)), i.e. remember which fibre a
      point's x-coordinate lies in and forget which element of the fibre it is. It
      is genuinely lossy exactly when the fibres have size greater than one, which
      happens when ell divides #E(F_p) so that phi is ell-to-1 on rational points;
      and it is NOT lossy -- it degenerates to a change of coordinates, the exact
      failure mode docs/inventor-protocol.md section 2 warns about -- when ell does
      not divide #E(F_p), because then phi is a bijection on rational points and
      the fibre determines the point. THIS RECORD STATES THAT DEGENERACY UP FRONT
      RATHER THAN DISCOVERING IT LATER, and it is why claim (B) is a derivation
      and the group half of the experiment has a foregone answer. What is retained
      does propagate compatibly with the operations of interest: the projection
      commutes with the group law in the strong sense that g-fibres are cosets of
      ker phi translated along the group, so a sum of points maps to a sum of
      fibre labels -- which is precisely the property that makes the pullback
      factor base solve the same combinatorial problem, and precisely the property
      a RANDOM degree-ell map lacks. The null object of claim (D) is therefore not
      an arbitrary control: it is the same projection with the compatibility
      removed, which is the cleanest possible isolation of what the compatibility
      is worth.
    propagation: >-
      ONE-STEP PROPAGATION IS DEFINED AND MEASURABLE. Composing with a further
      ell-isogeny multiplies the degree of g by ell and coarsens the partition by
      a factor ell; ascending then descending along the same edge returns the
      identity partition up to the dual, since phi-hat composed with phi is
      multiplication by ell, whose fibre partition is by cosets of E[ell]. These
      rules are checkable directly on an enumerated toy curve by tabulating g on
      every rational x-coordinate, which costs one pass over at most #E(F_p)
      elements.
    survival_score: >-
      Survives as long as an F_p-rational ell-isogeny exists, which by claim (A)
      is exactly as long as the class has positive height at ell or ell splits or
      ramifies in O_K -- so it survives everywhere the volcano is non-trivial and
      dissolves precisely at the height-zero inert case, which is the record's
      null class. It also dissolves as a source of GAIN immediately, by claim (B),
      whenever ell does not divide the group order, which is the generic case: the
      object survives as a well-defined tracked object far longer than it survives
      as a potentially useful one, and that gap is the honest content of the
      record.

  proof_search_map:
    bottleneck: >-
      The exact step is the enumeration of channels by which the volcano level can
      reach an index-calculus cost functional. If claim (A)'s enumeration is
      complete, then measuring the fibration channel and finding it null closes the
      depth-to-R1 route with a named obstruction; if the enumeration is incomplete,
      the closure is invalid however the measurement comes out, so the enumeration
      is the load-bearing step and is stated as a claim rather than assumed.
    baseline_embedding:
      parameter_slice: >-
        The direct factor base on E is the ell = 1 slice: g is the identity, the
        partition is discrete, the defining degree is 1, and the pulled-back system
        is literally the direct system. Every measured quantity must coincide there
        by construction.
      reproduction_check: >-
        A FROZEN REGRESSION FIXTURE: run the pullback pipeline with phi set to the
        identity and require bit-identical relation counts, first-fall degree and
        solving degree against the direct pipeline. A discrepancy at ell = 1 means
        the two code paths differ for reasons unrelated to the isogeny and voids
        every comparison in the record.
    observation_collision:
      observable: >-
        The observable is the pair (first-fall degree, solving degree) of the
        Semaev system for a given factor base.
      distinct_preimage_search: >-
        A COLLISION IS NAMED AND IT IS THE REASON FOR THE RANDOM-MAP CONTROL. Two
        very different factor bases -- one cut out by an isogeny pullback, one by
        an arbitrary degree-ell map with no group meaning -- can easily produce
        identical first-fall and solving degrees, because those degrees are
        governed by the degree profile of the system rather than by its arithmetic
        provenance. That is not a defect to be avoided; it IS outcome (S1), and it
        is the reason the record's discriminator is the GAP between the two rather
        than the value of either. A second collision to guard: two curves at
        different levels admitting maps of the same degree give the same
        observable, so the level enters only through the COUNT of available maps,
        which is why claim (A) pre-registers that count rather than a per-level
        cost.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (degree profile of the Semaev system) fixed and vary
          the forgotten structure (whether the defining map is a group
          homomorphism), then look for an intrinsic invariant separating the two.
          The candidate invariant is the Macaulay rank profile or the syzygy
          structure, which could differ even at equal degrees.
        predicted_gain: >-
          If no such invariant is found, the depth-to-R1 channel is closed with a
          measured obstruction rather than an assertion. If one is found, it is
          outcome (S2) and is the only route in this record to anything positive.
      - transform: representation_reduction
        proposed_object: >-
          Move the relation-collection problem from E to E' by transport, where it
          becomes an exact equality of combinatorial problems with a degree-1
          factor base condition.
        predicted_gain: >-
          Zero, provably, on the group axis -- and stating that as a derivation
          rather than measuring it is the point: encoding is exact, completeness
          and soundness are both immediate from bijectivity, the transfer loss is
          zero and the cost loss is the isogeny evaluation. The transform is
          included because a proposal that omitted it would look like it had not
          noticed that the two problems are the same.
    quantifier_order: >-
      EXPLICIT. For all ordinary E/F_p, for all primes ell dividing the conductor
      f with ell different from N, and for all F_p-rational ell-isogenies phi out
      of E, there EXISTS a degree-ell rational map g with x(phi(P)) = g(x(P)) for
      all P; and FOR ALL factor bases F' on the codomain, the pullback problem and
      the direct problem have equal relation counts. The COUNT claim has the other
      shape: for all levels there EXISTS an exact integer (ell + 1, or 1, or 0 or
      2) equal to the number of rational ell-isogenies. Note what is NOT claimed
      and would be the quantifier error: it is NOT claimed that for all factor
      bases the pulled-back system has higher solving degree -- that is a
      prediction about the specific Semaev construction with a specific base
      shape, and a base chosen adversarially could behave otherwise.
    method_ceiling:
      strongest_certifiable_claim: >-
        THE CEILING IS LOW AND IS STATED BEFORE THE EXPERIMENT. The strongest
        thing this method could certify, even under ideal tuning, is a change in
        the ALGEBRAIC cost of relation collection -- first-fall degree, solving
        degree, Macaulay rank -- at fixed relation yield. It CANNOT change the
        decomposition probability, which for an m-fold factor base of size B in a
        group of order N is a group-theoretic quantity of order m! B^m / N and is
        invariant under transport by claim (B); and since the prime-field
        index-calculus cost is bounded below by the relation requirement, which is
        set by that probability, NO REARRANGEMENT OF THE FACTOR BASE ALONG AN
        ISOGENY CAN MOVE THE EXPONENT. The method's ceiling is therefore a
        constant-factor or polynomial change in the algebra stage of a method that
        does not currently beat rho on prime fields at all.
      nearby_object_control: >-
        THE NEARBY OBJECT IS THE RANDOM DEGREE-ell MAP, on which the hoped-for
        conclusion (that isogeny structure helps) is known false by construction,
        since a random map has no group structure to help with. It is the
        record's central control precisely because it differs from the isogeny in
        exactly one property. A method that cannot distinguish the pair has not
        identified any load-bearing structure -- which is outcome (S1) and is the
        expected one.
    proof_obligations:
      - claim: >-
          An F_p-rational ell-isogeny acts on x-coordinates by a degree-ell
          rational map.
        responsibility: baseline
      - claim: >-
          The count of rational ell-isogenies is ell + 1 at the crater, 1 in the
          interior and at the floor, and 0, 1 or 2 at height zero by the splitting
          of ell.
        responsibility: correctness
      - claim: >-
          If ell does not divide #E(F_p) then phi is a bijection on rational points
          and the two relation problems are isomorphic with equal relation counts.
        responsibility: correctness
      - claim: >-
          The pulled-back factor base has defining degree ell and the summation
          system's total degree rises accordingly.
        responsibility: size
      - claim: >-
          No factor-base rearrangement along an isogeny changes the decomposition
          probability m! B^m / N.
        responsibility: strictness
      - claim: >-
          The planted-positive generator produces systems with an exactly known
          solution and degree ell^k.
        responsibility: interface
      - claim: >-
          Scope: prime field, ordinary, toy sizes, one solver, declared base shape.
        responsibility: scope

  assumptions:
    - >-
      A working prime-field Semaev or summation-polynomial pipeline with a
      measured first-fall and solving degree exists in this repository. The ALPF
      lane's committed experiments (EXP-ALPF-007, EXP-ALPF-009, EXP-ALPF-010, as
      referenced by IDEA-20260816-c1314e and IDEA-20260816-bd49b9) indicate one
      does; this record depends on it and names the dependency rather than
      assuming an instrument that may not exist.
    - >-
      An ell-isogeny construction with Velu evaluation at ell in {2, 3} exists or
      is built per IDEA-20260807-b1b604. Without it there is no pullback and the
      record cannot be tested.
    - >-
      ell is different from N and, for the bijection half of claim (B), ell does
      not divide #E(F_p). Both are checked per instance and the ell | #E case is
      run separately rather than folded in.

  predictions:
    - metric: >-
        rational_isogeny_count: number of distinct F_p-rational ell-isogenies out
        of each curve of an enumerated toy class, tabulated by volcano level
      direction: different
      minimum_effect: >-
        EXACTLY ell + 1 at the crater and at every interior vertex, EXACTLY 1 at
        every floor vertex, and on a height-zero class exactly 2, 1 or 0
        according to whether ell splits, ramifies or is inert in O_K. Zero
        tolerance; any deviation refutes claim (A)'s enumeration and with it the
        record's completeness argument. On the committed p = 4001 class at
        ell = 2 this predicts 3 at each of the 3 crater curves, 3 at each
        interior vertex, and 1 at each of the floor curves.
    - metric: >-
        relation_count_difference: number of relations found by the direct
        pipeline on E' minus the number found by the pullback pipeline on E, at
        matched base size, matched target, matched budget and matched seed
      direction: different
      minimum_effect: >-
        EXACTLY ZERO when ell does not divide #E(F_p). This is a derivation, not a
        statistic, and a non-zero difference means one of the two pipelines is
        wrong. It is the cheapest correctness gate in the record and it runs
        before anything is interpreted.
    - metric: >-
        first_fall_degree_penalty: first-fall degree of the pulled-back system
        minus that of the direct system, at matched m and matched base size
      direction: higher
      minimum_effect: >-
        At least +1 at ell = 2 and growing with ell. A penalty of zero would mean
        the degree bookkeeping of claim (C) is wrong -- an informative outcome,
        since it would say the summation system's difficulty is not governed by
        the defining degree of the base.
    - metric: >-
        isogeny_vs_random_gap: first-fall and solving degree of the isogeny
        pullback minus those of a random degree-ell map pullback, at identical
        degree, identical base size, identical solver and identical seed
      direction: different
      minimum_effect: >-
        THE PRIMARY DISCRIMINATOR. A gap of zero within solver noise is outcome
        (S1) and closes the channel. A gap of at least -1 (isogeny strictly
        easier), reproduced across at least three curves and two base sizes, is
        outcome (S2) and must be escalated rather than reported as a speedup. A
        positive gap is outcome (S3) and voids the instrument.
    - metric: >-
        relations_per_field_operation: measured relation yield divided by measured
        field operations, direct versus pullback
      direction: lower
      minimum_effect: >-
        The pullback must be strictly worse, by a factor of at least 1.5 at
        ell = 2, if claim (C) holds. A pullback that is not worse contradicts the
        degree-penalty prediction and must be explained before the record's
        closure language is used.
    - metric: >-
        planted_solution_recovery: fraction of planted decompositions, transported
        backwards through phi, that the screen recovers, as a function of the
        composed degree ell^k
      direction: lower
      minimum_effect: >-
        A monotone decreasing detection curve in k, reaching below 0.5 at some
        measurable k. A curve that does NOT decay as k grows is the canonical
        artifact tell of docs/inventor-protocol.md section 3 and means the screen
        is not responding to the planted magnitude at all.

  minimal_test:
    design: >-
      SIX STEPS, TOY SCALE, ell = 2 PRIMARY AND ell = 3 CONFIRMATORY. STEP 0
      (blocking): the IDENTITY-MAP fixture -- run the pullback pipeline with phi
      the identity and require bit-identical outputs against the direct pipeline.
      A discrepancy stops everything. STEP 1 (minutes): on an enumerated toy class
      with positive height at ell, tabulate the number of rational ell-isogenies
      per curve and compare against the pre-registered per-level counts of claim
      (A); this is a pure counting gate and needs no solver. STEP 2 (minutes):
      pick one interior curve E and its unique ascending 2-isogeny phi to E';
      build a declared factor base F' on E', form the pullback F on E by Velu, and
      verify the relation-count equality of claim (B) exactly, with the ell | #E
      and ell not dividing #E cases run separately and reported separately. STEP 3
      (tens of minutes): measure first-fall and solving degree and field
      operations for the direct system on E' and the pulled-back system on E, at
      matched m in {2, 3} and at two base sizes. STEP 4 (tens of minutes): THE
      DISCRIMINATOR -- repeat STEP 3 with a uniformly random degree-ell rational
      map in place of phi, same degree, same base size, same solver, same seeds,
      at least 20 random maps to give the gap an error bar, and report the gap
      distribution. STEP 5 (tens of minutes): the NULL CLASS -- repeat STEPS 1 to
      4 on a class of height zero with ell inert, where no rational ell-isogeny
      exists and the method must be INAPPLICABLE rather than merely null; an
      apparatus that returns a pullback measurement there is fabricating one.
      STEP 6 (optional, minutes): the planted-positive generator of claim (E) --
      transport a known decomposition backwards through composed ascending
      isogenies of degree 2^k for k = 1, 2, 3 and measure the screen's recovery
      rate as a function of k, delivering a graded detection curve to the ALPF
      lane.
    controls:
      - >-
        RANDOM DEGREE-ell MAP NULL, THE PRIMARY CONTROL: identical degree,
        identical base size, identical solver, identical seeds, no group
        structure. The whole informational content of the record is the gap
        against this null.
      - >-
        IDENTITY-MAP FIXTURE: the ell = 1 slice must reproduce the direct pipeline
        bit-identically, so that no measured difference can be a code-path
        artifact.
      - >-
        INAPPLICABILITY CONTROL: a height-zero class with ell inert, where no
        rational ell-isogeny exists. The apparatus must refuse, not report.
      - >-
        RELATION-COUNT EQUALITY GATE: the derived exact equality of claim (B) must
        hold before any degree measurement is read; it is the correctness check on
        both pipelines.
      - >-
        MATCHED-BASE-SIZE CONTROL: comparisons are at equal factor-base
        cardinality, never at equal defining-set size, since the pullback can
        change cardinality when ell divides the group order.
      - >-
        SEED AND SOLVER CONTROL: the same Groebner engine, the same monomial
        order, the same degree bound and the same random seeds across all arms;
        first-fall degree is notoriously sensitive to all four.
    required_metrics:
      - per-curve rational ell-isogeny counts against the pre-registered per-level values
      - exact relation-count difference between direct and pullback (must be 0 in the coprime case)
      - first-fall and solving degree for direct, isogeny-pullback and random-map arms, with error bars
      - the isogeny-versus-random gap distribution over at least 20 random maps
      - relations per field operation for each arm
      - inapplicability control outcome on the inert height-zero class
      - planted-solution recovery rate as a function of composed degree
      - solver configuration, seeds, monomial order and degree bounds recorded verbatim
      - artifact manifest with source hashes and a rebuild receipt

  falsification_conditions:
    - >-
      The per-curve rational ell-isogeny counts do not match the pre-registered
      per-level values. Claim (A)'s enumeration is wrong, the completeness
      argument fails, and no closure may be written from this record whatever the
      solver measurements show.
    - >-
      The relation-count difference is non-zero in the ell coprime to #E(F_p)
      case. One of the two pipelines is wrong; every downstream measurement is
      void until it is localised.
    - >-
      The isogeny-versus-random gap is zero within noise. Outcome (S1): the
      depth-to-R1 channel is closed with the named obstruction that the
      Groebner solver sees only the degree profile and not the group structure,
      and the honest deliverable is that measured gap with its confidence
      interval, recorded as an obstruction block with units and error bars rather
      than as prose.
    - >-
      The isogeny pullback is strictly easier than the random map, reproduced
      across at least three curves and two base sizes. Outcome (S2): a genuine
      algebraic signal, which must be escalated under GOAL-ENDO-001's gating
      before any record calls it an advantage, and which is NOT to be reported as
      a speedup on the evidence of one batch.
    - >-
      The isogeny pullback is strictly harder than the random map. Outcome (S3):
      the instrument is mis-specified, since the isogeny system is a special case
      of the random family, and nothing may be read from either arm.
    - >-
      The apparatus returns a pullback measurement on the inert height-zero class
      where no rational ell-isogeny exists. The pipeline is fabricating an object
      and every measurement is void.
    - >-
      The planted-solution recovery rate does not decay as the composed degree
      grows. The screen is not responding to the planted magnitude and the
      generator of claim (E) is not calibrating anything.

  confounders:
    - >-
      FIRST-FALL DEGREE IS SOLVER-DEPENDENT. It depends on the monomial order,
      the degree bound, the elimination strategy and the seed, and small changes
      move it by a whole degree. MITIGATION: every arm uses one frozen solver
      configuration, recorded verbatim, and the deliverable is a GAP between arms
      under identical configuration rather than an absolute degree.
    - >-
      FACTOR-BASE CARDINALITY DRIFT. When ell divides #E(F_p) the pullback can
      change the base cardinality, which changes the decomposition probability and
      confounds the degree comparison. MITIGATION: the two cases are run and
      reported separately, and comparisons are at matched cardinality.
    - >-
      RANDOM DEGREE-ell MAPS ARE NOT A UNIFORM FAMILY. A random rational map of
      degree ell may be reducible, have small image, or have degenerate fibres,
      making it an unfair null. MITIGATION: the null draws maps with the same
      numerator and denominator degree profile as the Velu map, at least 20 of
      them, and reports the gap distribution rather than a single comparison;
      degenerate draws are recorded and excluded by a pre-declared rule.
    - >-
      TOY SIZES CANNOT SEPARATE SMALL DEGREE DIFFERENCES. At the ALPF lane's 13 to
      17 bit sizes the solving degrees are small integers and a difference of one
      is either everything or noise. MITIGATION: the comparison is repeated across
      at least three curves, two base sizes and two values of m, and a gap is
      reported only if it is consistent across all of them.
    - >-
      PRIME-FIELD INDEX CALCULUS DOES NOT BEAT RHO AT ALL. Every arm of this
      experiment measures the internal cost of a method that is not competitive on
      prime fields. MITIGATION: stated in the method ceiling and the
      interpretation limits; the record's value is a closure and an instrument,
      not a candidate attack, and the rho baseline is quoted alongside every
      figure.

  interpretation_limits:
    - >-
      CLAIM TIER TOY, per RQ-VOLC-f6253b. One or two toy classes, ell in {2, 3},
      m in {2, 3}, one solver, at the ALPF lane's committed sizes. No transfer to
      cryptographic scale is offered and none is implied by any outcome.
    - >-
      THE METHOD CEILING IS PART OF THE RESULT, NOT A CAVEAT. No factor-base
      rearrangement along an isogeny can change the decomposition probability,
      which is a transport invariant; therefore no outcome of this experiment,
      including the favourable one, can move an exponent. sota_delta is +0 in
      every branch and is stated so in advance.
    - >-
      A CLOSURE HERE IS SCOPED TO THE FIBRATION CHANNEL. Finding outcome (S1)
      closes the depth-to-R1 route THROUGH ISOGENY PULLBACK, conditional on claim
      (A)'s enumeration being complete. It says nothing about R2 (curve models,
      lane L11), about R5 (torsion, lane L7 and IDEA-20260807-cbe8c1), or about
      any channel not enumerated.
    - >-
      THE PLANTED-POSITIVE GENERATOR IS AN INSTRUMENT CONTRIBUTION TO ANOTHER
      LANE. It measures a screen's resolution; a screen's resolution is an upper
      bound on what its negatives exclude and is never a positive result about
      elliptic curves, as IDEA-20260816-bd49b9 states.
    - >-
      NOTHING HERE BEARS ON THE CONTESTED KN-FIND RECORDS. The resource is R1,
      field elements rather than group elements, so neither the endomorphism
      oracle nor the incidence oracle reading is engaged and no side is taken.

  heuristic_assumptions:
    - id: H1
      statement: >-
        DEGREE GOVERNANCE OF THE SUMMATION SYSTEM. For the declared factor-base
        shape and the declared solver, the first-fall and solving degrees of the
        m-th summation system are governed by the total degree profile of the
        system in its variables, so replacing a degree-1 defining condition by a
        degree-ell one raises the first-fall degree monotonically in ell, at fixed
        m and fixed base cardinality. Formally, the system behaves like a generic
        system of the same degree profile in the sense of the semi-regularity
        assumption used to predict the degree of regularity.
      rigorous_support: >-
        RIGOROUS INGREDIENT: substituting a degree-ell rational expression for a
        variable in a polynomial of degree d yields, after clearing denominators,
        a polynomial of degree at most ell*d -- an exact bound. CLASSICAL
        STATEMENT IMITATED: the semi-regularity or generic-system heuristic used
        throughout Groebner cost analysis to predict the degree of regularity from
        the degree profile alone -- the standard assumption that a structured
        system behaves like a random one of the same shape. THE GAP, AND IT IS THE
        WHOLE EXPERIMENT: summation systems are NOT generic, and the isogeny
        pullback is a maximally structured substitution; if the structure is
        visible to the solver, semi-regularity fails and that failure is outcome
        (S2). So H1 is not a background assumption here, it is the hypothesis
        under test, and the random-map arm is its control.
      falsification_condition: >-
        The measured first-fall degree of the isogeny-pullback system is lower
        than that of the random degree-ell arm, reproduced across three curves and
        two base sizes. H1 fails for isogeny substitutions specifically, which is
        precisely outcome (S2).
      validation_plan: >-
        SAMPLE: at least 3 curves x 2 base sizes x 2 values of m x (1 isogeny arm
        + 20 random-map arms), at the ALPF lane's committed toy sizes, with all
        solver parameters frozen. SHORTCUT: none is available or needed; the
        systems are solved directly at these sizes, which is why the lane works at
        13 to 17 bits at all. COMPARISON: measured first-fall degree against the
        semi-regularity prediction computed from the degree profile, for both the
        isogeny and the random arms; the deliverable is the difference of the two
        residuals. TAIL CHECK: the extreme random draws -- the easiest and hardest
        of the 20 -- must bracket the isogeny arm if H1 holds; an isogeny arm
        outside the bracket is the signal. TRANSFER: none claimed; the degrees are
        measured at the sizes used and no scaling law is fitted, since
        IDEA-20260816-c1314e records that the lane's own scaling behaviour is
        itself unresolved.
    - id: H2
      statement: >-
        TRANSPORT INVARIANCE OF THE DECOMPOSITION PROBABILITY. For an m-fold
        factor base of cardinality B in a group of prime order N, the probability
        that a uniformly random target decomposes is asymptotically m! B^m / N,
        and this quantity is unchanged by transport along an isogeny of degree
        coprime to N because the transport is a group isomorphism on the relevant
        subgroup. This is what fixes the method ceiling.
      rigorous_support: >-
        RIGOROUS INGREDIENT: transport along an isogeny of degree coprime to N is
        an isomorphism on the order-N subgroup (T1), and any counting quantity
        defined purely by the group structure and the image of the base is
        therefore preserved exactly. CLASSICAL STATEMENT IMITATED: the standard
        birthday-style estimate m! B^m / N for the decomposition probability of a
        random element over an m-fold sum of a base of size B, treated as if the
        m-fold sumset were spread uniformly. THE GAP: the sumset is not uniform,
        and EV-ENDO-10109d records unexplained within-class over-dispersion of
        exactly this decomposition rate, with H-VOLC-707f6c attributing it at one
        prime to a sampler artifact and a group-structure mixture. So the
        classical estimate is known in this program to be imperfect at toy scale,
        and H2's transport-invariance half does not depend on it -- only the
        numerical value does.
      falsification_condition: >-
        A measured difference in decomposition rate between a curve and its
        isogenous image at matched base cardinality and matched sampler, exceeding
        the sampler-induced variance recorded in H-VOLC-707f6c. That would
        contradict transport invariance and would be a far more important finding
        than anything else in this record.
      validation_plan: >-
        SAMPLE: at least 500 random targets per curve on at least 4 isogenous
        curve pairs, with the target sampler held fixed and, per H-VOLC-707f6c,
        with the exact functional |mV(E)|/#E scored in addition to the sampled
        rate so the sampler is removable. COMPARISON: measured decomposition rate
        on E against E', paired; and both against m! B^m / N. TAIL CHECK: the
        curves with non-cyclic rational group structure, where H-VOLC-707f6c
        predicts the sampler misbehaves, must be flagged and analysed separately.
        TRANSFER: none; the invariance is a derivation and the sampling here tests
        the implementation of transport, not the mathematics.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS CLAIMED OR MOVED, AND THE METHOD CEILING SAYS NONE CAN BE.
      The best conceivable outcome of this record is a change in the ALGEBRA-STAGE
      cost of prime-field relation collection at fixed relation yield -- a
      polynomial or constant-factor effect on a method that does not beat generic
      square-root algorithms on prime fields at all. Stated against the required
      baseline: target time exponent 1/2, best known 1/2, delta zero. This record
      is explicitly NOT an exponent-moving idea and per the search heuristics of
      agents/idea-generator.md it justifies its priority instead as (i) the
      closure of the last enumerated depth-to-R1 channel, which the campaign needs
      before it can write any closure for L2 at the inventor-protocol standard,
      and (ii) a graded planted-positive generator that another lane has recorded
      as a blocking instrumentation gap.
    memory_exponent: >-
      Unchanged from the underlying pipeline: the Groebner stage dominates and the
      pullback changes the system's degree, not its variable count, so memory
      moves by whatever factor the degree change costs the solver -- measured, not
      predicted. Against the ECDLP baseline, memory exponent target and best known
      are both those of the incumbent, O(1) for rho with distinguished points.
    best_known: >-
      Parallel Pollard rho with the negation map, n^{1/2 + o(1)} group operations
      and O(1) memory per processor; BSGS at n^{1/2} time and memory;
      automorphism-discounted rho on CM curves (KN-TECH-018). Prime-field index
      calculus is not on this frontier at all -- there is no subexponential
      prime-field ECDLP algorithm known (RECALLED) -- which is why every figure in
      this record is quoted alongside the rho baseline rather than against another
      index-calculus variant.
    hidden_overhead: >-
      DISCLOSED. Nothing hides in an o(1) because no asymptotic is claimed. What
      IS hidden in the measured numbers and must be reported: the Velu evaluation
      cost of the pullback, charged per factor-base element and omitted from naive
      relation-yield accounting; the solver configuration, which moves first-fall
      degree by a whole integer; and the fact that the ALPF lane's own
      toy-to-larger transfer behaviour is unresolved (IDEA-20260816-c1314e), so no
      figure here may be extrapolated in size.
    tradeoff_note: >-
      There is no useful time-memory tradeoff to state, because the record claims
      no attack point. The one tradeoff worth recording is internal: the pullback
      buys a larger set of available factor-base definitions -- ell + 1 of them at
      the crater instead of 1 -- at the price of a degree-ell defining condition,
      and claim (C) predicts that trade is strictly unfavourable. Parallelization
      is across curves and across random-map draws and is embarrassingly parallel
      in both.

  dominated_by: >-
    CHECKED ACROSS EVERY ROW OF THE FRONTIER, ON TIME, MEMORY AND QUERIES, BEFORE
    ANSWERING. As an ECDLP attack: DOMINATED, and not marginally -- parallel
    Pollard rho with the negation map dominates every arm of this experiment on
    time, on memory and on queries simultaneously, since prime-field index
    calculus has no subexponential form and the record's best case is an
    algebra-stage constant. `null` here would be a fabrication. As a statement
    about isogeny pullbacks: dominated by the transport theorem itself, which
    already implies claim (B); the record's contribution is the enumeration, the
    contrast against the random map, and the inversion. As an instrument: not
    dominated -- IDEA-20260816-bd49b9 records that no graded planted-positive
    family exists in this repository, so the generator of claim (E) is at a point
    on the instrumentation frontier that nothing currently occupies.
  sota_delta: >-
    +0 ON EVERY ATTACK AXIS IN EVERY BRANCH, INCLUDING OUTCOME (S2). Time exponent
    1/2 before and after, memory unchanged, query model untouched, claim tier toy.
    Quantitatively, what the record can move is internal: the number of enumerated
    but unmeasured depth-to-R1 channels in lane L2, from one to zero; and the
    number of graded planted-positive generators available to the ALPF screen,
    from zero to one, with a measured detection curve over composed degrees
    2, 4 and 8.

  discriminated_from:
    - >-
      IDEA-20260807-cbe8c1 routes depth into an R1 cost VIA R5, using rational
      ell-torsion to enable a translation-symmetrized factor base, and predicts a
      step at the floor. This record routes depth into R1 DIRECTLY, using the
      isogeny as a degree-ell map on the x-line, and predicts a degree-inflation
      penalty with no group-theoretic change; its independent variable is the
      COUNT of available maps rather than the presence of torsion, and its
      discriminator is a random-map null rather than a shape in depth. Disjoint
      mechanism, disjoint control, disjoint predicted signature.
    - >-
      IDEA-20260807-4f43ac shows an x-indexed PRECOMPUTATION does not transport.
      This record asks whether the DEFINING CONDITION of a factor base changes
      usefully under transport. A table losing its meaning and a condition
      changing degree are different phenomena with different measurements.
    - >-
      RQ-EQIC-8cb959 / lane L4 concerns phi-STABLE factor bases for an
      ENDOMORPHISM phi of a single curve, and is another agent's lane. An isogeny
      between two distinct curves is not an endomorphism, induces no orbit
      structure on one curve, and gives no equivariance; this record does not test
      any L4 mechanism and must not be read as re-asserting H-STR-002.
    - >-
      IDEA-20260816-bd49b9 designs a detection-curve experiment for the ALPF
      screen and asks for planted positives. This record supplies a generator with
      an exactly known planted solution and a natural grading, and does not
      duplicate the detection-curve design; the two compose.
    - >-
      IDEA-20260901-48b364 (this session) supplies the deterministic ascending
      chain used to compose maps of degree ell^k. Different object, different
      claim; this record is a consumer of that one.

  estimated_cost:
    implementation: medium
    compute: medium

  recommended_priority: medium

  honest_prior_of_survival: >-
    0.9 that the rational-isogeny counts match the pre-registered per-level
    values, since they are the defining volcano structure. 0.9 that the relation
    counts are exactly equal in the coprime case, since that is a derivation. 0.75
    that outcome (S1) obtains -- no gap between the isogeny and random arms --
    which is the record's own prediction and would close the channel with a
    measured obstruction. 0.15 for outcome (S2), which is small but is the entire
    reason to run the experiment rather than assert the closure, and which the
    inventor protocol's symmetric treatment of premature closure requires be given
    a real chance to appear. 0.1 that the instrument fails one of its controls, in
    which case the deliverable is the instrument finding.

