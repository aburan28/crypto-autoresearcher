idea:
  id: IDEA-20260901-2fb77b
  question_id: RQ-VOLC-f6253b
  research_question: RQ-VOLC-f6253b
  goal_id: GOAL-ENDO-001
  added: '2026-09-01'
  title: >-
    DEPTH BUYS EXACTLY ONE THING IN THE INDEX-CALCULUS LANE AND IT IS A COUNT OF
    RATIONAL ell-ISOGENY FIBRATIONS OF THE x-LINE -- ell+1 at the crater, 1 in the
    interior and at the floor, 0 or 2 at height zero -- so the ONLY depth-to-R1
    channel is that a deeper class supplies more degree-ell pullback factor bases;
    transport makes every such base solve the SAME group problem with the SAME
    relation count while multiplying the defining degree by ell, which predicts a
    strict degree-inflation penalty, and the discriminating measurement is the
    isogeny pullback against a RANDOM degree-ell map of identical shape, because
    only a gap between those two is isogeny structure rather than degree
  class: composition

  claim: >-
    FIVE SEPARABLE CLAIMS. (A) AND (B) ARE DERIVATIONS. (C) IS THE PREDICTED
    PENALTY. (D) IS THE ONE MEASUREMENT THAT CAN COME OUT EITHER WAY. (E) IS THE
    INVERSION AND WHAT IS NOT CLAIMED.

    (A) THE ONLY DEPTH-TO-R1 CHANNEL, ENUMERATED. DECOMPOSITION.md L2 records the
    obstruction that on the prime-order subgroup the level is invisible, so any
    depth effect must be routed through R1, R2 or R5. R5 is taken by
    IDEA-20260807-cbe8c1 and IDEA-20260901-c7e601. This record takes R1, and
    asserts that the routing is essentially unique: the only structure a curve's
    volcano position confers on the x-line is the SET OF F_p-RATIONAL
    ell-ISOGENIES out of it, because an ell-isogeny phi is precisely a degree-ell
    rational map g on x-coordinates, x(phi(P)) = g(x(P)), and nothing else in the
    volcano touches coordinates. The number of such maps is an exact function of
    the level and is pre-registered here: on a volcano of positive height,
    ell + 1 at the crater and at every interior vertex (one ascending and ell
    descending), exactly 1 at the floor (the unique ascending one); on a
    volcano of height zero, 2 if ell splits in
    O_K, 1 if ramified, 0 if inert. So DEPTH IS A COUNT OF FIBRATIONS, and that
    count is a discrete, derived prediction with no free parameter.

    (B) EVERY FIBRATION SOLVES THE SAME GROUP PROBLEM, EXACTLY. Let phi : E -> E'
    be F_p-rational of degree ell with ell != N. By transport (T1) phi is
    injective on the prime-order subgroup and carries the instance (E, P, Q, k) to
    (E', phi(P), phi(Q), k) with the same k. If in addition ell does not divide
    #E(F_p) then phi is injective on ALL rational points and, since
    #E(F_p) = #E'(F_p), it is a BIJECTION E(F_p) -> E'(F_p). Consequently, for any
    factor base F' on E' the pullback F := phi^{-1}(F') has the same cardinality
    and a subset of F sums to phi^{-1} of a target if and only if the
    corresponding subset of F' sums to the target. THE TWO RELATION-COLLECTION
    PROBLEMS ARE ISOMORPHIC AS COMBINATORIAL PROBLEMS, with identical relation
    counts and identical decomposition probabilities. Nothing group-theoretic is
    gained, and this is a derivation, not an expectation.

    (C) WHAT DOES CHANGE IS THE ALGEBRAIC DEGREE, AND IT CHANGES ADVERSELY. A
    Semaev-style factor base on E' is cut out by a condition on x of degree 1 in
    the base variable -- membership of x(P') in a declared set V. Its pullback to
    E is cut out by g(x(P)) in V with deg g = ell, so the defining condition has
    degree ell. In the m-th summation polynomial the pullback therefore replaces
    each variable by a degree-ell expression, and the standard degree bookkeeping
    predicts the total degree of the system, and with it the first-fall and
    solving degrees, to rise. PREDICTION, STATED BEFORE MEASUREMENT: the
    first-fall degree of the pulled-back system is strictly greater than that of
    the direct system, the relation count is exactly equal, and therefore the
    relations per field operation is strictly lower for the pullback by a factor
    that grows with ell. The pullback is a STRICT LOSS in the cost model this
    program measures, and the record predicts its own null.

    (D) THE ONE MEASUREMENT THAT CAN GO EITHER WAY, AND IT IS THE POINT OF THE
    RECORD. Compare the isogeny pullback against a NULL OBJECT OF THE SAME SHAPE:
    a uniformly random degree-ell rational map h on the x-line, used to define a
    factor base by h(x(P)) in V, with the same degree, the same base size and the
    same solver. The random map is NOT a group homomorphism and carries no isogeny
    structure. Three outcomes, each with a distinct meaning fixed in advance:
      (S1) isogeny pullback and random pullback have the same first-fall and
           solving degrees. Then the penalty is a pure DEGREE effect, no isogeny
           structure is visible to the Groebner solver, and the depth-to-R1
           channel is closed with a named obstruction -- the strongest and most
           likely outcome.
      (S2) the isogeny pullback solves at a strictly LOWER degree than the random
           map of the same degree. Then the solver is seeing the group-homomorphism
           structure of phi, which is a genuine algebraic signal that no committed
           record in this program has measured, and it is the one result here that
           would justify further work -- gated by GOAL-ENDO-001 before any record
           calls it an advantage.
      (S3) the isogeny pullback solves at a strictly HIGHER degree than the random
           map. Then the instrument is mis-specified, since the isogeny system is a
           special case of the random one, and nothing may be read from either.

    (E) THE INVERSION, AND WHAT IS NOT CLAIMED. The obstruction in (C) --
    degree inflation by a factor ell -- is read as a RESOURCE, as
    docs/inventor-protocol.md section 4 requires: the pullback is a CONTROLLED
    GENERATOR of Semaev systems with a KNOWN PLANTED SOLUTION (transport any known
    decomposition on E' back through phi) and a TUNABLE DEGREE (compose ascending
    steps to multiply the degree by ell each time, using the deterministic ascent
    of IDEA-20260901-48b364). That is exactly the graded planted-positive family
    IDEA-20260816-bd49b9 asks for in the ALPF lane in order to measure a screen's
    detection curve, and it is arguably the record's most durable deliverable
    whatever (D) returns. NOT CLAIMED: any speedup, any exponent movement, any
    subexponential prime-field index calculus, or that a larger factor base
    obtained this way helps -- it cannot, because by (B) the decomposition
    probability is a transport invariant.

  mechanism: >-
    The lane's standing obstruction is that depth is invisible on the prime-order
    subgroup, so an effect must be routed through a resource that is not a group
    operation. The mechanism proposed is the narrowest available such route and it
    is named precisely: an F_p-rational ell-isogeny is simultaneously (i) a group
    homomorphism, which by transport makes it useless for changing the difficulty
    of the group problem, and (ii) a degree-ell rational map on x-coordinates,
    which does change the algebraic description of any factor base defined by a
    condition on x. Depth enters only through how many such maps exist, and that
    count is exactly determined by the level. The record therefore isolates the
    single place where volcano position can touch index calculus, states in
    advance that the group half is a provable null and the algebraic half is a
    predicted penalty, and puts the whole informational weight on one comparison
    -- isogeny map versus random map of the same degree -- which is the only
    contrast in which the group-homomorphism property is the sole difference. That
    contrast is what converts a foregone conclusion into an experiment.

  novelty_status: unverified

