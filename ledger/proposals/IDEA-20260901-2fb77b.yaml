  novelty_screen:
    method: >-
      FILESYSTEM AND LEDGER SCREENING ONLY. The crypto-kb MCP server is bound to
      ':memory:' with an empty index and returns nothing; it was NOT called and
      its silence is not read as novelty. Enumerated all 14 proposals carrying
      question_id RQ-VOLC-f6253b and read the claim block of each; read
      DECOMPOSITION.md L1, L2, L4, L11, L13, L14 and section 3; read
      IDEA-20260816-bd49b9 and IDEA-20260816-c1314e for the ALPF instrumentation
      context. No external paper and no web source was opened.
    results: >-
      NEAREST FILED WORK, NAMED WITH ITS DIFFERENCE. (1) IDEA-20260807-cbe8c1 is
      the closest depth-to-R1 record. Its channel is R5 into R1 -- rational
      ell-torsion enabling a translation-symmetrized factor base -- and its
      predicted signature is a step at the floor. This record's channel is R1
      directly: the isogeny as a degree-ell map on the x-line, with the count of
      such maps as the depth variable, and the predicted signature is a
      degree-inflation penalty with no group-theoretic change at all. The two do
      not overlap in mechanism, in measured quantity, or in predicted shape. (2)
      IDEA-20260807-4f43ac states that x-indexed precomputation does not transport;
      that is about a TABLE built on one curve losing meaning on another, whereas
      this is about the DEFINING CONDITION of a factor base changing degree.
      Complementary and both negative for different reasons. (3) L4 / RQ-EQIC-8cb959
      concerns phi-STABLE factor bases where phi is an ENDOMORPHISM of one curve;
      that lane is another agent's and this record does not enter it -- an isogeny
      between two distinct curves is not an endomorphism and gives no orbit
      structure on a single curve. (4) IDEA-20260816-bd49b9 asks for planted
      positives in the ALPF lane; this record supplies a generator for them but
      does not duplicate its detection-curve design.
    verdict: >-
      UNVERIFIED. The transport argument in claim (B) is elementary and certainly
      known; the degree bookkeeping in (C) follows standard summation-polynomial
      accounting and is likely folklore. What is not in any committed record here
      is (i) the enumeration of the fibration count as the unique depth-to-R1
      channel with its pre-registered values by level, (ii) the isogeny-versus-
