  title: >-
    The n = 19 cell. On F_2[t]/(t^19 + t^5 + t^2 + t + 1), m = 2, l = 10,
    V = {deg < 10}, one rule-drawn curve, measure the degree-4 mutant closure
    W_4 BESIDE plain M_4 on 400 unsatisfiable subgroup-target S_3 descents,
    with the ell-substituted fall profile (RC-B) computed first, an N-ELL-type
    control at W_4 (RC-C), an N-CONV-type arm, same-support nulls, the x(2E)
    split, degree-disciplined certificates (RC-D) and author-independent
    verification. Question: does the W_4 refutation rate stay near the n = 17
    value or decay toward the nulls' 0?
  class: measurement

  claim: >-
    CEILING FIRST. No cost claim of any kind. At m = 2, oracle A (2^10 = 1024
    quadratic root-findings over V per attempt at l = 10) decides
    satisfiability outright, and parallel Pollard rho dominates the DLP. The
    quantity is a REFUTATION DEGREE of one family of Boolean systems under
    declared closures. It is exponent-adjacent only: refutation degree along
    Semaev's diagonal is the quantity Semaev's Assumption 1 and KN-OPEN-d218ec
    reason about, and nothing here tests that assumption.

    At n = 17 (one curve, h = 4) the whole unsatisfiable subgroup-target arm
    is refuted by W_4: 386/386, quoted per DEC-20260924-e61f3b NA-4 as 82
    certified in RC-1 (62 W_4 by review witnesses, 20 by M_4-row certificates)
    plus 304 reviewed Stage-1 flags (EV-CERTBIN-4a9d2f exact_scoped_claim (d)).
    Plain M_4 refutes 324/386 = 0.839, CP95 [0.799, 0.875] (KN-OPEN-3c8f51).
    The load-bearing ingredient at n = 17 is that S_3's M_4 is far from
    semi-regular (KN-FIND-5a8d3e section 2). Two readings at n = 19:
    E-PERSIST: the degree-4 refutation property is a property of the S_3
      descent along the diagonal. W_4 refutes >= 90% of unsatisfiable
      subgroup-target attempts at n = 19.
    E-DECAY: it is a small-n effect. W_4 refutes <= 10%, as the nulls do.
    Both, and PARTIAL, are possible and decidable from predefined counts with
    exact CP95 intervals.

  mechanism: >-
    STRUCTURE (Coordinator derivation, n-uniform; checked per instance by the
    contract). For Y^2 + XY = X^3 + AX^2 + B over F_{2^n},
    S_3(x_1, x_2, x_R) = phi(x_1 x_2) + x_R^2 (x_1 + x_2)^2 + B with
    phi(y) = y^2 + x_R y, which is F_2-linear with kernel {0, x_R}. With
    l = (n + 1)/2 the Boolean quadratic part lies in the span of the n
    convolution forms Q_s = sum_{i+j=s} v_i v_{l+j} (s = 0..n-1) through phi,
    of rank n - 1. The cokernel functional c_k = Tr(t^k / x_R^2) gives the
    linear consequence ell = sum_k c_k f_k = Tr(x_1) + Tr(x_2) + Tr(B / x_R^2),
    because Tr(phi(y) / x_R^2) = 0 and Tr(z^2) = Tr(z). So ell exists at every
    odd n (Tr(1) = 1 puts v_0 + v_l in it). Its variable support is
    {v_j, v_{l+j} : j < l, Tr(t^j) = 1}. COORDINATOR READING of
    experiments/EXP-CERTBIN-a58c63/runs/RUN-CERTBIN-0b8f3a/cells.json (n19-l6,
    tau = Tr(t^j), j = 0..18, for the modulus t^19 + t^5 + t^2 + t + 1): tau is
    1 exactly at j = 0 and j = 17. Restricted to V (j < 10) only j = 0, so
    ell = v_0 + v_10 + Tr(B / x_R^2) at n = 19. The contract re-derives this
    (C-ELL) and uses whatever it finds.

    WHY PERSISTENCE IS PLAUSIBLE. The source of the n = 17 degree falls (the
    rank-(n - 1) convolution image and the cokernel fall) is n-uniform. At
    n = 17 S_3's substituted degree-4 space contained all of B'_{<=3} on 61/62
    (EV-CERTBIN-4a9d2f O-7), far beyond the semi-regular [0, 0, 16, 288].
    WHY DECAY IS PLAUSIBLE. The semi-regular deficit at degree 4 grows with n:
    h_4 = 612 for 17 quadratics in 18 variables and 1425 for 19 in 20
    (RT-20260924-d95e70 j8-nulls/series.json via its J8 series block). The row
    count of M_4 grows more slowly than its column count (2924 x 4048 at
    n = 17; 4009 x 6196 at n = 19). S_3's falls must fill proportionally more
    of B_{<=4} for W_4 to reach 1.

