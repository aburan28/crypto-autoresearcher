  assumptions:
    - Satisfiability is decided exactly by exhaustive evaluation over all 2^20 Boolean assignments (and, for curve-algebra systems, by O(2^l) root-finding as well), never by a closure.
    - The curve is reused from RUN-CERTBIN-0b8f3a as literal parameters only; every property the design needs is re-verified in-run.
    - '"About 400 subgroup targets" (KN-OPEN-3c8f51; DEC-20260923-f25b97 NA-5) is read as 400 UNSATISFIABLE subgroup-target attempts, the denominator of the rate, matching the n = 17 unsatisfiable arm of 386.'

  proof_search_map:
    see: H-CERTBIN-e3ac93 proof_search_map (the hypothesis carries the full map)

  predictions:
    - metric: w = verified W_4 refutations among 400 unsatisfiable subgroup-target S_3 attempts at n = 19
      direction: different
      minimum_effect: E-PERSIST w >= 360; E-DECAY w <= 40; PARTIAL otherwise (EXP-CERTBIN-060020 N19-DR-1)
    - metric: excess of the ell-substituted degree-3 fall dim(R'_4 cap B'_{<=3}) over the semi-regular 360, per S_3 instance
      direction: higher
      minimum_effect: positive on >= 90% of instances (non-semi-regularity persists) or zero on >= 90% (semi-regular at n = 19); MIXED otherwise (N19-DR-3)

  minimal_test:
    design: >-
      One frozen run with the pinned fast engine crypto_autoresearcher.gf2.
      Subgroup targets drawn by the Stage-1 rule until 400 unsatisfiable ones
      are collected; per system M_3, M_4, W_4 and the ell-substituted R'_3,
      R'_4; degree-disciplined certificates verified by a separate process and
      again, author-independently, in review.
    controls:
      - N-ELL19 (one linear fall, otherwise same-support generic; RC-C)
      - N-CONV19 (S_3's exact quadratic part, random lower-degree bits)
      - same-support nulls N-F219 (independent draws) and N-AFF19 (five independent affine families)
      - satisfiable controls in every arm
      - the x(2E) split on uniform x_R (x(2E), x(E) \ x(2E), twist)
    required_metrics: [w and CP95, M_4 rate and CP95, RC-B profiles, control rates at W_4 and M_4, x(2E) split]

  falsification_conditions:
    - E-PERSIST is falsified iff w <= 200 of 400 (scaled rule if fewer).
    - E-DECAY is falsified iff w >= 201 of 400.
    - A refuted satisfiable control, a counted refutation whose certificate fails, or an engine-provenance failure falsifies the instrument (void run), never either reading.

  confounders:
    - >-
      n and the curve's cofactor change together: the n = 17 cell has h = 4
      (subgroup targets lie in x(4E)); the reused n = 19 curve has h = 2
      (subgroup targets are exactly x(2E)). EXP-CERTBIN-3f06d1 (an h = 2 cell at
      n = 17) calibrates the h-dependence of the M_4 rate; W_4 is not measured
      there.
    - One curve and one V at n = 19.
    - The n = 17 W_4 reference 386/386 imports 304 Stage-1 flags (OBJ-7).

  interpretation_limits:
    - Toy tier. n = 19, one curve, one V. No statement about n >= 23, m >= 3, F4 step degree, or Semaev's Assumption 1.
    - A W_4 non-refutation is a degree-4 statement only; it is never a proof of hardness.

  heuristic_assumptions: []
  heuristic_assumptions_note: No heuristic is assumed. Every quantity is an exact closure measurement on drawn systems; the semi-regular description is a reference profile read per instance (RC-B), not an assumption.
  target_complexity: null
  target_complexity_note: No complexity claim.
  dominated_by: >-
    Per attempt at m = 2: oracle A (2^10 = 1024 quadratic root-findings over
    V) decides satisfiability and returns the solutions; it dominates every
    closure here. For the DLP at q = 261823: parallel Pollard rho, about
    sqrt(pi q / 4), roughly 450 group operations (Coordinator arithmetic with
    the formula RT-20260924-d95e70 used at n = 17); BSGS about 2 sqrt(q),
    roughly 1020 operations. FES and WDSat not compared.
  sota_delta: zero on every ECDLP cost axis (time, memory, data)
  test_boundary:
    field: F_2[t]/(t^19 + t^5 + t^2 + t + 1)
    m: 2
    l: 10
