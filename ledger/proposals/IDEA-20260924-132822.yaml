# unsatisfiable m = 2 S_3 subgroup-target descents on Semaev's diagonal persist
# from n = 17 to n = 19, or decay toward the nulls? (KN-OPEN-3c8f51 item (B),
# resolution criterion 2.)
#
# PROVENANCE (stated honestly): this is NOT an idea-generator proposal. The cell
# was named by KN-OPEN-3c8f51 resolution criterion 2, scheduled by
# DEC-20260923-f25b97 NA-5, re-based by DEC-20260924-e61f3b na5_ruling and
# specified there as NA-3, with the red-team required controls RC-B, RC-C and
# RC-D (RT-20260924-d95e70). The Coordinator records it here so that the
# hypothesis and the contract have a ledger source.
#
# WHY A NEW PROPOSAL AND NOT IDEA-20260923-5d0b8e. That proposal (the trace-
# stability test) lists n = 19 among its Stage-3 cells, but for TRACE retention
# at D in {3, 4}. It defines no mutant closure W_4, no refutation-rate
