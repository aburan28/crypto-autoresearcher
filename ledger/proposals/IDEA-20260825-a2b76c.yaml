  batch: EC-STRUCTURE-20260825
  cluster: 'C3-factor-base: what ''algebraically described'' actually bounds'
  title: 'A SUM-PRODUCT DICHOTOMY FOR INDEX-CALCULUS FACTOR BASES: multiplicative structure makes the
    linear algebra almost free and is forbidden the yield by a THEOREM rather than by a conjecture, additive
    structure gives computable yield and no linear-algebra symmetry -- state the dichotomy, quantify both
    horns, and ask whether any set is approximately both'
  class: theory
  claim_ceiling: unverified_zero_run_structural_proposal_only_no_experiment_no_implementation_no_status_change_no_novelty_conclusion
  status: proposed
  novelty_status: unverified
  novelty_note: 'Sum-product theorems over F_p and bounds on the additive energy of multiplicative subgroups
    are published and recalled, not verified. The proposed contribution is their application as a STAGE-COUPLING
    constraint on index calculus: the observation that the two stages demand incompatible structure and
    that one side of the incompatibility is unconditional.'
  claim:
    semantic_part: If the factor base is a coset of a multiplicative subgroup H of F_p^*, the relation
      incidence is H-equivariant and the relation matrix is a group matrix diagonalized by characters,
      reducing the linear-algebra stage to O~(B) -- but sum-product-type bounds on the additive energy
      of multiplicative subgroups forbid the above-baseline additive concentration that the Betti-Yield
      duality shows is necessary for a sub-rho critical complex.
    evaluator_part: 'Unestablished: the quantitative form. Both horns must be written with explicit constants
      and the incompatibility must be shown to bind in the parameter range index calculus actually uses,
      not merely asymptotically.'
    end_to_end_ecdlp_claim: false
    breakthrough_claim: false
  mechanism:
  - Horn 1 (multiplicative). Take S = a coset of H <= F_p^* with |H| = B. Show the relation matrix is
    H-equivariant and hence block-diagonalized by the characters of H; state the resulting linear-algebra
    cost and the memory it needs.
  - Horn 2 (yield). Invoke sum-product / additive-energy bounds for multiplicative subgroups to bound
    the number of B-decompositions of a target, and compare with the above-baseline yield the Betti-Yield
    duality requires.
  - Horn 3 (additive). Take S = an interval or GAP. Yield is computable and the linear algebra is generic
    sparse; state both.
  - Assemble the dichotomy as a single inequality in one parameter that interpolates between the two structures
    -- for instance the multiplicative energy of S -- and identify whether the inequality has a feasible
    region at all.
  - Test the interpolation empirically at toy scale, since the theorems are asymptotic and the feasible
    region, if any, is a finite-p question.
  lossy_projection_test:
    tracked_object: the pair (additive energy, multiplicative energy) of the factor base
    what_is_discarded: the set itself, keeping only two scalar statistics
    propagation: the two energies control the two stages respectively, which is what makes the pair the
      right object
    verdict: 'PASSES: strongly lossy and both components are decision-relevant, which is unusual and is
      why the pair is proposed rather than either alone.'
  predictions:
  - id: P1
    status: established_formula
    statement: A factor base that is a coset of a multiplicative subgroup gives an equivariant relation
      matrix diagonalizable by characters.
  - id: P2
    status: unestablished
    statement: Sum-product bounds put the decomposition yield of a multiplicative subgroup at or below
      the random baseline for all B in the index-calculus range.
  - id: P3
    status: unestablished
    statement: The feasible region of the assembled inequality is empty for every p and B in the range
      of interest.
  minimal_discriminating_test:
    status: specified_not_run
    test: At toy scale, sweep sets interpolating between a multiplicative subgroup and an interval (for
      example, unions of small cosets), measure both energies, the realized decomposition yield, and the
      realized linear-algebra cost, and plot the feasible region directly.
    pass: The measured region is empty, matching P3, and the two costs trade off monotonically along the
      interpolation.
    fail: A set with both above-baseline yield and usable equivariance at toy scale would be a significant
      positive requiring immediate independent replication.
  controls:
  - A random set of matched size for both energies and both costs.
  - The full group F_p^* (maximal multiplicative structure, trivial as a factor base) and the full interval,
    as the two degenerate endpoints.
  - A set with planted additive structure and no multiplicative structure, to confirm the yield instrument
    responds when structure is genuinely present.
  confounders:
  - Sum-product bounds are asymptotic with unspecified constants; a toy-scale violation may be a constant,
    not a refutation.
  - Equivariance of the incidence requires the SUMMATION relation to respect H, which it does not in general
    -- the exact equivariance claim must be checked, not assumed, and this is the most likely place Horn
    1 fails.
  - Yield measured on too few targets is dominated by target variance.
  falsification:
    semantic: A demonstration that Horn 1's equivariance does not hold for the elliptic summation relation
      would collapse the dichotomy to a single horn and is the most likely failure mode.
    evaluator: Toy-scale constants cannot falsify an asymptotic theorem; any conflict is recorded as a
      range statement.
    not_falsification: Absence of a proof of P3.
  why_this_is_not_a_variant: The ledger records the yield requirement (Betti-Yield, H-PSEUDO) and the
    linear-algebra structure question (KN-OPEN-006, displacement rank) as SEPARATE lanes. The proposed
    contribution is that they are coupled and the coupling is adversarial, with one side unconditional.
    No record in the corpus scan treats the two stages as competing for the same structural budget.
  limits:
  - 'Zero-run: nothing here has been executed, measured, or independently reviewed.'
  - Proposal tier only; claim ceiling is stated in claim_ceiling and is not exceeded.
  - No end-to-end ECDLP algorithm, exponent, or cost claim is made.
  - 'Novelty is unverified: no literature screen was performed for this batch.'
  - Public parameters and toy instances only; no live key, wallet, or deployed target.
  sota_delta:
