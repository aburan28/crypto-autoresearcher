  assumptions:
    - p > 3, short Weierstrass form, f squarefree, m = 3 only.
    - >-
      The symmetric-base group and Frobenius recipe of IDEA-20260830-1a08f9.
      If that record's group is wrong, the class LABELS here are wrong; the
      seven counts and their (p,t,Z)-dependence are not, because they are
      counts of character patterns.
    - >-
      Affine base A^2 in (e1,e2); the projective closure and the point at
      infinity of the x-line are not counted.
    - >-
      Matched non-isomorphic curve pairs with equal (t, Z) exist at the
      chosen p. This is a Stage-0 feasibility check that can terminate the
      line, not an assumption to be carried.

  proof_search_map:
    bottleneck: >-
      The completeness step: that no invariant finer than (p, t, Z) can enter
      any class count. Everything else is a finite sum. If a finer invariant
      does enter, the exceptional-locus question reopens exactly there, and
      finding it would be a better result than confirming the claim.
    baseline_embedding:
      parameter_slice: >-
        Restricting to case A and to the ordered base recovers
        KN-FIND-a8990a Theorem B's m=3 instance: split count S^2 + N^2 with
        the diagonal correction, and the recorded O(1/p) density law.
      reproduction_check: >-
        Emit S^2 + N^2 - (p - Z) from the case-A counts and require exact
        agreement with the committed closed form, as rational numbers, before
        any new cell is measured. A framework that cannot reproduce the
        committed number term for term is not embedding the baseline.
    observation_collision:
      observable: >-
        The seven-tuple of stratum counts, as a function of the curve.
      distinct_preimage_search: >-
        INVERTED, AND DELIBERATELY SO. This record's claim IS that the
        observable has a large fibre: every curve with the same (p, t, Z) is
        a distinct preimage. The collision is therefore not a defect to be
        searched for but the experiment itself, and the risk is the mirror
        one -- that the observable is so lossy it is constant across ALL
        curves at fixed p. It is not: the counts vary with t across the Hasse
        interval and with Z across {0,1,3}, and the run reports that spread
        as its comparator.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The map curve -> (t, Z) -> seven exact stratum counts, replacing a
          per-curve census by a two-parameter formula.
        predicted_gain: >-
          A census over a panel of C curves at cost O(C p^2) becomes a
          formula evaluation at cost O(C log p), and the exceptional-locus
          question becomes a question about a 3-element stratification rather
          than about an unbounded family of curves.
      - transform: observable_fiber
        proposed_object: >-
          The fibre of the observable over a fixed (t, Z), tested by matched
          non-isomorphic curve pairs.
        predicted_gain: >-
          A single matched pair with unequal counts refutes the completeness
          claim and localises the exceptional locus at a finer invariant --
          the outcome that would matter most.
    quantifier_order: >-
      FOR ALL p > 3, FOR ALL pairs (E, E') of non-singular curves over F_p
      with equal trace and equal Z, THE SEVEN STRATUM COUNTS ARE EQUAL AS
      INTEGERS. Not: for generic curves, and not: up to statistical error.
      The universal quantifier over pairs is what makes one counterexample
      decisive.
    method_ceiling:
      strongest_certifiable_claim: >-
        The seven counts of the m=3 symmetric-base cover over the affine base
        are functions of (p, t, Z). NOT certifiable by this method: any
        statement about statistics that depend on the factor base (coverage
        of targets, relation rank), about m >= 4, about solve cost, or about
        the group structure of E(F_p) beyond its order.
      nearby_object_control: >-
        The number of points of order 3 on E(F_p) is NOT a function of
        (p, t, Z); a matched pair can differ on it. Reporting it alongside
        the counts is mandatory, because a matched pair that agrees on
        EVERYTHING is probably two models of the same curve and the equality
        test would be vacuous.
    proof_obligations:
      - claim: The case-A counts sum to binom(p,2) identically.
        responsibility: correctness
      - claim: >-
          M = (p^2 + 2p - t^2 - Z')/2 - (p - Z) counts case-B elements with
          f a square in F_{p^2}.
        responsibility: correctness
      - claim: Z' is determined by Z for a cubic over F_p.
        responsibility: strictness
      - claim: >-
          The ramified stratum has density about 2Z/p, so the Z-footprint is
          O(1/p).
        responsibility: size
      - claim: >-
          Matched non-isomorphic pairs exist at the tested p.
        responsibility: feasibility

  predictions:
    - metric: >-
        integer residual between the measured seven stratum counts and the
        closed forms in (p, t, Z), per curve, exhaustive over all p^2 base
        points
      direction: lower
      minimum_effect: >-
        EXACTLY 0 in integer arithmetic, on every stratum of every curve. Not
        "small". A single nonzero residual falsifies the mechanism's
        arithmetic and halts the record.
    - metric: >-
        difference between the seven counts of two NON-ISOMORPHIC curves over
        the same p with equal (t, Z)
      direction: same
      minimum_effect: >-
        EXACTLY 0 on all seven, for every matched pair tested (at least 3
        pairs, at least one involving j = 0 or j = 1728 where such a pair
        exists). A nonzero difference is the exceptional locus the question
        hunts, found at a finer invariant, and routes to its own record.
    - metric: >-
        control invariant on the same matched pairs (number of points of
        order 3, and j)
      direction: different
      minimum_effect: >-
        j must differ (that is what non-isomorphic means) and at least one
        matched pair must differ in its order-3 point count. If no matched
        pair differs on any reported invariant, the equality test is vacuous
        and NO conclusion may be drawn from it.
    - metric: >-
        F_p-point count of the ramified stratum { f(t1) f(t2) = 0 } as a
        function of Z
      direction: different
      minimum_effect: >-
        FORCED LADDER with three interior points: 0 for Z = 0, about p for
        Z = 1, about 3p for Z = 3, with the exact values
        Z(p - Z) + binom(Z,2) + (Z' - Z)/2 emitted before the run. This is
        the entire measurable footprint of the exceptional locus and it is
        two-sided: a Z = 0 curve with any ramified base point falsifies the
        claim.
    - metric: >-
        relative size of the total curve-dependent deviation in class
        densities across the whole panel at fixed p
      direction: lower
      minimum_effect: >-
        Bounded by 4/p + 2Z/p, hence under 1 percent at p = 1009. A measured
        panel spread exceeding that bound, with the residual check passing,
        would mean the deviation is not cover-sourced and must be attributed
        elsewhere.
    - metric: >-
        scale trend of the panel spread across p in {101, 211, 1009}
      direction: lower
      minimum_effect: >-
        Must decay like 1/p, i.e. by a factor of about 10 from p = 101 to
        p = 1009. A spread that does not decay when p grows is the canonical
        artifact tell and voids the O(1/p) footprint claim.

  minimal_test:
    design: >-
      STAGE 0, zero compute, can terminate the line: for each p in
      {101, 211, 1009}, enumerate curves, compute (t, Z, j, order-3 point
      count), and find at least 3 matched non-isomorphic pairs with equal
      (t, Z); emit the seven closed-form counts for every panel curve BEFORE
      any base point is enumerated. That table is the pre-registration. If no
      matched pair exists at a p, that p carries no matched-pair cell and the
      fact is reported rather than worked around. STAGE 1, minutes: exhaustive
      enumeration of all p^2 base points per curve at p = 101 and p = 211,
      classifying each by the character triple, and comparing the seven counts
      against the pre-registered table. STAGE 2: p = 1009 exhaustively if
      affordable (about 10^6 classifications) or by a declared uniform sample
      with its own binomial error, stated in advance which. STAGE 3: the
      matched-pair equality test and the control invariants.
    controls:
      - >-
        MATCHED-PAIR CONTROL WITH A NON-VACUITY CHECK (MANDATORY). The pair
        must be non-isomorphic (different j) and must be shown to differ on
        at least one reported invariant outside (t, Z). Without that, an
        equality result is unfalsifiable and NO conclusion may be drawn.
      - >-
        INTERNAL SUM CHECK, FORCED AND FREE. The four case-A counts must sum
        to binom(p,2) and the three case-B counts to p(p-1)/2 exactly; the
        double-root stratum must have exactly p points. A failure here is an
        implementation defect and voids the cell.
      - >-
        BASELINE REPRODUCTION. The case-A counts must reproduce
        KN-FIND-a8990a Theorem B's committed m=3 closed form exactly, on the
        same curves; this is a control against the framework being a
        look-alike rather than an embedding.
      - >-
        GRADED CONTROL IN Z, three interior points {0, 1, 3}, monotonicity
        reported, with forced ramified-stratum counts 0, about p, about 3p.
      - >-
        GRADED CONTROL IN p, three interior points {101, 211, 1009}, with the
        forced 1/p decay of the panel spread.
      - >-
        SPECIAL-j ARM REPORTED SEPARATELY, never pooled, per RQ-MONO-001
        constraint 2; the prediction is that it is unremarkable given its
        (t, Z), and that is exactly what makes it informative if it is not.
    required_metrics:
      - pre-registered closed-form table per curve, emitted before enumeration
      - measured seven stratum counts per curve, with integer residuals
      - matched-pair count differences, per stratum, as integers
      - control invariants (j, order-3 point count) per matched pair
      - internal sum checks with their forced totals
      - panel spread per p and its fitted decay exponent in p
      - artifact manifest with hashes and a rebuild receipt

  falsification_conditions:
    - >-
      Any nonzero integer residual against the closed forms. The mechanism's
      arithmetic is wrong; the record is withdrawn by a superseding record,
      never edited.
    - >-
      Any matched non-isomorphic pair with unequal stratum counts. The
      completeness claim is false and a finer curve invariant enters -- the
      most valuable possible outcome, and it must be reported as such rather
      than absorbed.
    - >-
      A Z = 0 curve exhibiting a ramified base point, or a Z = 3 curve
      exhibiting materially fewer than 3p of them.
    - >-
      Panel spread failing to decay like 1/p across the p-ladder while the
      residual check passes.
    - >-
      No matched pair existing at any tested p, or every matched pair being
      indistinguishable on all control invariants. Then the equality test is
      not available and the record's central prediction is untested; that is
      an instrument outcome and must be reported as one, never as
      confirmation.

  confounders:
    - >-
      VACUOUS MATCHING. Two curves given by different equations may be
      isomorphic over F_p or twists that coincide; then equality of counts is
      forced for trivial reasons. The non-vacuity control exists solely for
      this and it is the single most likely way this record produces a
      meaningless pass.
    - >-
      Z' IS A FUNCTION OF Z ONLY FOR A CUBIC. The argument that no third
      invariant enters uses deg f = 3. It does not survive to hyperelliptic
      analogues and no such extension is implied.
    - >-
      THE CLAIM IS ABOUT THE COVER, NOT ABOUT INDEX CALCULUS. Coverage of
      TARGETS by factor-base decompositions depends on the factor base and is
      outside the (t, Z) claim entirely. Conflating the two would turn a
      correct statement into a false one.
    - >-
      TOY SCALE AND A VANISHING EFFECT. The measured footprint is O(1/p) and
      has no asymptotic content. It is a stratification statement at toy
      scale, and any citation must carry that.
    - >-
      SAMPLING AT p = 1009. If the largest cell is sampled rather than
      exhaustive, the integer-residual prediction becomes a statistical one
      for that cell and must be relabelled; mixing the two would launder a
      weaker check as an exact one.

  interpretation_limits:
    - >-
      CLAIM TIER toy for the measurements; the closed forms are a DERIVATION
      and must be cited as one.
    - >-
      NO ECDLP CLAIM. No exponent moves in either direction, and (C3) says
      the effect is O(1/p), which cannot change any collection cost by more
      than a 1 + O(1/p) factor.
    - >-
      THIS IS NOT A CLOSURE OF KN-OPEN-009. It closes, at the section-4
      standard, only the COVER-SOURCED half of the relation-rate clause at
      m = 3, with the redirection written out in (C5). Coverage, rank,
      recognizability and solve cost remain open and are named.
    - >-
      IT DOES NOT SUPERSEDE IDEA-20260805-90df50. That record measures a
      rate; this one claims a classification that PREDICTS the rate's
      dependence on tau = Z + 1. If the two disagree, the classification is
      wrong.
    - >-
      NO STATUS CHANGE to any record is proposed or implied.

  heuristic_assumptions:
    - id: HEUR-TZ-1
      statement: >-
        NONE IS LOAD-BEARING FOR THE COUNTS. The seven closed forms are exact
        finite counts derived from the character recipe and the point counts
        #E(F_p) = p + 1 - t and #E(F_{p^2}) = p^2 + 1 - (t^2 - 2p); no
        distribution assumption, no asymptotics, no error term. This entry
        records that the headline is unconditional, which is why the
        prediction is an exact integer residual rather than a confidence
        interval.
      rigorous_support: >-
        The two point-count formulas are the Weil/Hasse relation for an
        elliptic curve over F_p and its quadratic extension; the character
        recipe is IDEA-20260830-1a08f9 (S6); the tallies S, N, Z are
        KN-FIND-a8990a's own.
      validation_plan: >-
        Stage 1 exhaustive enumeration at p = 101 and p = 211 with residual
        required to be exactly 0, plus the internal sum checks, which are free
        and cannot be fitted.
    - id: HEUR-TZ-2
      statement: >-
        Non-isomorphic curves over F_p with equal (t, Z) exist at every
        tested p, and at least one such pair differs on some invariant
        outside (t, Z).
      rigorous_support: >-
        Deuring's class-number formula for the number of curves with a given
        trace makes this overwhelmingly expected for ordinary t, but it is
        RECALLED, NOT FETCHED, and it is a statement about counts rather than
        about a specific small p. THE GAP: at p = 101 a particular (t, Z)
        cell may contain a single isomorphism class.
      validation_plan: >-
        SAMPLE: enumerate all curves over F_p up to isomorphism at
        p in {101, 211} (about p^2 Weierstrass pairs, trivially affordable),
        tabulate (t, Z, j, order-3 count), and report the matched-pair census
        including cells with no pair. COMPARISON: the observed number of
        classes per (t, Z) cell against the Deuring expectation, reported as
        an observation, not as a check of Deuring. TAIL CHECK: the most
        sparsely populated (t, Z) cell used in the test.
    - id: HEUR-TZ-3
      statement: >-
        The relation-rate consequence of the exceptional stratification is
        confined to coverage and multiplicity and is bounded by the ramified
        density 2Z/p plus the class-density correction 4/p.
      rigorous_support: >-
        The mean is exactly fixed by KN-FIND-007 and cannot deviate; the
        ramified density is the exact count divided by p^2; the t-dependence
        of the class densities enters as t^2/p^2 <= 4/p by Hasse. THE GAP:
        "confined to coverage and multiplicity" is a statement about which
        quantities the cover can influence at all, and a quantity nobody has
        named could fall outside the trichotomy.
      validation_plan: >-
        SAMPLE: on the same curves, measure the root-coincidence rate of
        IDEA-20260805-90df50 at m = 4 and check that its measured tau
        dependence matches the prediction implied here (rate linear in
        tau - 1 = Z). COMPARISON: the two records' forced values against each
        other; they were derived independently and a disagreement falsifies
        one of them. TAIL CHECK: the Z = 3 curve, where both effects are
        largest. TRANSFER: none; toy p only.

  target_complexity:
    time_exponent: >-
      NO ATTACK AND NO EXPONENT, stated plainly. The measured footprint is
      O(1/p) relative and therefore cannot change any relation-collection
      cost by more than a 1 + O(1/p) factor; dressing it as an exponent
      result would be exactly the cofactor polishing
      docs/target-result-profile.md forbids. Instrument cost is O(p^2)
      classifications per curve for the exhaustive arm and O(log p) per curve
      for the closed-form arm -- the latter is the point, since it replaces a
      census by a formula.
    memory_exponent: Negligible; seven counters per curve.
    best_known: >-
      Pollard rho at p^{1/2} time and O(1) memory (KN-OPEN-001) remains the
      prime-field baseline and is untouched. On the question axis the
      incumbents are KN-FIND-a8990a Theorem B (exact counts over the ordered
      base) and IDEA-20260805-90df50 (a tau-driven rate); this record claims
      a completeness statement neither makes.
    hidden_overhead: >-
      None charged; no algorithm is proposed. The honest disclosure is that
      the exhaustive arm at p = 1009 is about 10^6 classifications per curve
      and may be sampled instead, which downgrades that cell's prediction
      from exact to statistical.
    tradeoff_note: >-
      More curves buys matched pairs (the decisive test); more base points
      buys nothing once the arm is exhaustive, because the prediction is an
      identity rather than a density. That asymmetry is why the budget goes
      to Stage 0.

  dominated_by: >-
    n/a (no result claimed on any attack axis), checked row by row rather
    than asserted. TIME: Pollard rho p^{1/2}; van Oorschot-Wiener parallel
    collision; the prime-field index-calculus family of KN-OPEN-001/002 --
    no competitor proposed. MEMORY: rho at O(1); this record's instrument
    memory is seven integers. DATA/QUERIES/ADVICE: none; public curve data
    only, no oracle. On the question axis: KN-FIND-a8990a Theorem B computes
    exact counts over the ORDERED base and is strictly broader in m; it does
    not compute the symmetric-base counts and makes no completeness claim, so
    neither record dominates the other. IDEA-20260805-90df50 measures one
    rate whose curve dependence this record predicts; complementary, not
    dominating in either direction.
  sota_delta: >-
    Zero on every attack axis. On the question: KN-OPEN-009 asks whether an
    exceptional family (naming CM curves) has deviant relation rates. This
    record replaces an unbounded search over curve families with a
    3-element stratification computable in O(log p) from the factorization
    type of f, and bounds the whole cover-sourced deviation by 4/p + 2Z/p --
    under 1 percent at p = 1009 -- against a prior state in which no bound
    of any size was on record. It also converts the lane's standing
    j = 0 / 1728 caveat into a prediction with an exact-integer falsifier.
    Quantitatively: from "expected but unproven" to seven exact closed forms
    and one universally quantified equality with a one-counterexample
    falsifier.

  estimated_cost:
    implementation: low
    compute: low
    basis: >-
      Pure-Python integer arithmetic over F_p and F_{p^2}; the curve
      enumeration at p = 101 and p = 211 is about p^2 Weierstrass pairs with
      a point count each, and the base enumeration is p^2 character triples
      per curve. No CAS, no solver, no external library beyond what the
      harness already uses.
  recommended_priority: medium
