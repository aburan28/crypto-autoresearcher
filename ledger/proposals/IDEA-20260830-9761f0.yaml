idea:
  id: IDEA-20260830-9761f0
  question_id: RQ-MONO-001
  added: '2026-08-30'
  status: proposed
  proposed_by: idea-generator
  class: measurement

  title: >-
    THE EXCEPTIONAL LOCUS IS NOT EMPTY AND IT IS NOT WHERE THE QUESTION LOOKS.
    Every Frobenius class count of the m=3 Semaev cover is an EXACT function
    of (p, t, Z) alone -- field size, trace, number of rational 2-torsion
    x-coordinates -- so j, CM, and the automorphism group cannot enter; the
    only curve-dependence is the mod-2 stratification, its footprint is the
    ramified divisor of density about 2Z/p, and the deviation axis is
    COVERAGE and MULTIPLICITY, never the mean.

  claim: >-
    THE COMPLETENESS STATEMENT. Fix p > 3 and E/F_p : y^2 = f(x) non-singular,
    with trace t (so #E(F_p) = p + 1 - t) and Z = #{x in F_p : f(x) = 0} in
    {0,1,3}. Consider the m=3 summation cover over the SYMMETRIC base
    (e1,e2) = (t1+t2, t1 t2) and the Frobenius class of the four-point fibre
    { P in E : x(P)^2 - e1 x(P) + e2 = 0 } in the wreath group Z/2 wr S_2
    (the group is IDEA-20260830-1a08f9's claim and is used here, not
    re-derived). Then the count of base points in each of the five conjugacy
    classes, and the counts of each excluded stratum, are EXACT POLYNOMIAL
    FUNCTIONS OF (p, t, Z) -- written out in the mechanism below -- and of
    nothing else. Consequently:
    (C1) TWO NON-ISOMORPHIC CURVES OVER THE SAME p WITH THE SAME (t, Z) HAVE
    BITWISE IDENTICAL CLASS COUNTS. Not statistically indistinguishable:
    identical integers. This is a strong, cheap, per-instance falsifiable
    prediction, and it converts RQ-MONO-001's own constraint 2 ("exclude
    j = 0 / 1728 automorphism artifacts") from a caveat into a test: the
    prediction is that j = 0 and j = 1728 contribute NOTHING beyond their
    own (t, Z).
    (C2) THE EXCEPTIONAL LOCUS, NAMED. It is exactly the mod-2
    stratification: the F_p-factorization type of f, equivalently Z in
    {0,1,3}, equivalently the image of the mod-2 Galois representation. It is
    NON-EMPTY (curves with rational 2-torsion are a positive-density family),
    it is decidable in O(log p) per curve by factoring f -- no census is
    needed to find it -- and it is the ONLY place a curve can differ. This
    answers the question's disjunction in a way neither branch anticipated:
    the monodromy group is full and uniform (no exceptional locus for the
    GROUP), while the cover's arithmetic does have an exceptional
    stratification (for the DIVISOR).
    (C3) THE FOOTPRINT IS O(1/p), AND ON A NAMED AXIS. The Z-dependence lives
    on the ramified stratum { f(t1) f(t2) = 0 }, whose F_p-point count is
    exactly Z(2p - Z - 1)/2 + (Z' - Z)/2 out of about p^2/1 base points, i.e.
    density about 2Z/p; the t-dependence enters the five class densities only
    at order t^2/p^2, which is at most 4/p by Hasse. So any relation-rate
    deviation SOURCED FROM THIS COVER'S GALOIS STRUCTURE is O(1/p) relative.
    (C4) WHICH DEVIATION AXIS, STATED BECAUSE THE QUESTION FORCES IT.
    KN-FIND-007 fixes the mean decomposition yield at binom(B+m-1,m)/N
    exactly, for every factor base of every geometry, so a "deviant relation
    rate" can never be a deviation in the MEAN. The deviations this record
    predicts are in COVERAGE (which base points are ramified, hence carry
    degenerate rather than usable fibres) and MULTIPLICITY (root coincidence,
    which IDEA-20260805-90df50 shows is driven by tau = Z + 1). It makes NO
    claim about VARIANCE, which is factor-base-sourced rather than
    cover-sourced and is IDEA-20260805-a9a95d's object.
    (C5) A SCOPED CLOSURE, AT THE SECTION-4 STANDARD, FOR THE COVER-SOURCED
    HALF ONLY. NAMED OBSTRUCTION: every curve-dependent invariant of the m=3
    Semaev cover factors through (t, Z); the group part is constant in the
    curve; the (t, Z) part is supported on a divisor of density O(1/p) and on
    corrections of order t^2/p^2. ARGUMENT: the class of a base point is
    determined by the character triple, whose distribution is counted exactly
    by S = (p - t - Z)/2, N = (p + t - Z)/2 and the F_{p^2} analogue, all
    functions of (p, t, Z). REDIRECTION: what remains open, and is NOT closed
    by this, is coverage and rank as functions of the FACTOR BASE rather than
    the curve; the solve cost, which KN-FIND-a8990a names as the place index
    calculus's cost actually sits; m >= 4, where the wreath group grows to
    Z/2 wr S_{m-1} and the counting done here does not apply; and the
    extension-field setting, where Gal(F_{q^n}/F_q) is a second group this
    argument never touches.

  mechanism: >-
    DERIVED HERE, using IDEA-20260830-1a08f9's Frobenius recipe and
    KN-FIND-a8990a's Theorem B counting method; the arithmetic below is this
    record's own.

    NOTATION. S = #{x in F_p : f(x) is a nonzero square} = (p - t - Z)/2;
    N = #{x : f(x) is a non-square} = (p + t - Z)/2; S + N + Z = p. Let Z' =
    #{x in F_{p^2} : f(x) = 0}; because f is a cubic over F_p, Z' is a
    function of Z alone: Z = 0 gives Z' = 0 (roots in F_{p^3}), Z = 1 gives
    Z' = 3, Z = 3 gives Z' = 3. THAT is why no third invariant appears.

    SPLIT OF THE BASE. A base point (e1,e2) in F_p^2 has
    x^2 - e1 x + e2 either (A) split with distinct roots t1 != t2 in F_p --
    exactly binom(p,2) points, in bijection with unordered pairs; or (B)
    inert, roots t1, t1^p in F_{p^2} minus F_p -- exactly p(p-1)/2 points; or
    (D) a double root, e1^2 = 4 e2 -- exactly p points, the degree-drop
    stratum KN-FIND-a8990a identifies as S_2 = 0 and which is excluded.

    CASE A COUNTS (Frobenius fixes both blocks; the class is read off
    chi(f(t1)), chi(f(t2))):
      identity class            binom(S,2)
      {sigma_1, sigma_2}        S * N
      sigma_1 sigma_2           binom(N,2)
      ramified (some f(t_i)=0)  Z(p - Z) + binom(Z,2)
    and these four sum to binom(p,2) identically, which is a zero-cost
    internal consistency check the run must report.

    CASE B COUNTS (Frobenius swaps the blocks; by
    IDEA-20260830-1a08f9 (S6) the class is an involution iff
    chi(f(t1) f(t2)) = +1 and a 4-cycle iff it is -1). Since
    f(t1) f(t2) = Norm_{F_{p^2}/F_p}(f(t1)), the involution case is exactly
    "f(t1) is a square in F_{p^2}". Let
      M = #{ t in F_{p^2} minus F_p : f(t) is a nonzero square in F_{p^2} }
        = ( p^2 + 2p - t^2 - Z' )/2 - (p - Z),
    using #E(F_{p^2}) = p^2 + 1 - (t^2 - 2p) and subtracting the x in F_p,
    all of which have f(x) a square in F_{p^2}. Then
      block-swap involutions   M/2
      ramified in case B       (Z' - Z)/2
      4-cycles                 p(p-1)/2 - M/2 - (Z' - Z)/2.
    EVERY ONE OF THESE SEVEN NUMBERS IS A FUNCTION OF (p, t, Z) AND OF
    NOTHING ELSE. That is the whole claim, and it is arithmetic, not
    statistics.

    WHY NO FINER INVARIANT CAN ENTER. The class of a base point depends only
    on quadratic characters of f evaluated at the roots of a quadratic, so
    the counts depend only on how many x in F_p (and in F_{p^2}) have f(x) a
    square, a non-square, or zero. Those tallies are exactly (S, N, Z) and
    their F_{p^2} analogues, which are determined by point counts on E over
    F_p and F_{p^2} and by the factorization type of f. Point counts over
    both fields are determined by t; the factorization type by Z. There is no
    slot in the computation for j, for the CM order, for the automorphism
    group, or for the group structure of E(F_p) beyond its order.

    WHERE THE CLAIM STOPS, AND THIS IS THE NEARBY OBJECT THAT MAKES IT
    NON-VACUOUS. Statistics that depend on the GROUP STRUCTURE of E(F_p)
    rather than its order are NOT functions of (p, t, Z): the number of
    points of order 3, for example, depends on whether 3 divides the
    exponent, which two curves of the same order can differ on. So the
    matched-pair test below is not trivially satisfiable, and the control
    that proves it is not trivially satisfiable is to exhibit some OTHER
    invariant on which the matched pair does differ.

  novelty_status: unverified

