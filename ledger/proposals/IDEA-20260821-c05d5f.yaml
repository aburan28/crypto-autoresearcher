      from ML-KEM to FrodoKEM. Outside the repository: FrodoKEM's deployment surface is real
      and newer than the corpus knows - a LAMPS X.509 algorithm-identifier draft exists
      (draft-smyslov-lamps-frodokem-certificates-01, 6 July 2026, individual submission), and
      a fetched rendering of it states no limit on decapsulations per certified key and
      defers FrodoKEM-specific security considerations to draft-longa-cfrg-frodokem-security-considerations,
      which is itself where the retrieved eFrodoKEM clause '(e)FrodoKEM ... must not be used in
      applications in which a single public key may produce 2^8 ciphertexts or more' lives.
