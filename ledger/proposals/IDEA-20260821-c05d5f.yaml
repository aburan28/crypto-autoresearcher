  assumptions:
    - >-
      The transcribed bound exists before this record is executed. Without it the variable set
      is unknown. This is a hard dependency on GOAL-FRODO-002 BATCH-001, not a soft one.
    - >-
      The six-way provenance taxonomy is frozen before retrieval begins and is not revised
      after any document is read; a taxonomy tuned post hoc can classify anything as anything.
    - >-
      'Dominant term' is well defined at each evaluation point, i.e. no tie within the
      arithmetic precision used. Ties are reported as ties, not broken.
    - >-
      A stated absence established by named full-text search terms is a different epistemic
      object from an acquisition failure, and the two are never merged.
    - >-
      No conclusion transfers to any scheme other than FrodoKEM, and none transfers to a
      deployment mode not enumerated in the census.
  proof_search_map:
    bottleneck: >-
      The substitution step: the exact point in the published accounting where a numeric
      query, user or ciphertext count is inserted into the bound to produce a bit figure. If
      that number has no source, every figure downstream of it inherits the absence, and this
      is the step whose removal changes what the published category assignment means.
    baseline_embedding:
      parameter_slice: >-
        The published inputs at which draft-longa-cfrg-frodokem-security-considerations-00
        reports 149.8 / 212.6 / 266.8 bits for (e)FrodoKEM-640/976/1344. The census's STAGE 5
        evaluation must reproduce those three figures at those inputs before any sourced
        evaluation point is reported. This is GOAL-FRODO-002's gating control and it is
        inherited unchanged.
      reproduction_check: >-
        Frozen regression fixture: the three figures, the inputs they were computed at as
        transcribed, and the tolerance. A pipeline that cannot recover them has not earned the
        right to report a sourced evaluation anywhere.
    observation_collision:
      observable: >-
        The dominant-term provenance signature: an ordered tuple of classes over the variables
        of the largest term.
      distinct_preimage_search: >-
        Search for two deployment profiles with the SAME signature but materially different
        reachable bit security - for example a static certified FrodoKEM key (unbounded C, no
        stated count) and an ephemeral-per-handshake key (C = 1, huge U). If both project to
        the same signature, the signature is not identifying and the record must report the
        collision and add the distinguishing coordinate (the variable's monotonicity direction
        in the dominant term) rather than suppress it.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the numeric grid by the class lattice P1..P6 ordered by 'has a
          document-sourced finite supremum', so that the question 'is the category floor
          crossed' becomes 'does any monotone-increasing dominant term contain a variable with
          no finite sourced supremum' - an exact condition rather than a swept table.
        predicted_gain: >-
          Converts an infinite sweep into a finite documentary decision per parameter set. The
          gain is in what can be CONCLUDED, not in compute: no exponent is claimed.
      - transform: observable_fiber
        proposed_object: >-
          Hold the class signature fixed and vary the underlying deployment, to exhibit the
          fiber and show what the signature forgets.
        predicted_gain: >-
          A named limit on the census's resolution, reported as part of the deliverable.
    quantifier_order: >-
      The published figure is quoted as 'FrodoKEM-640 has 149.8 bits of security'. Written
      out, a category claim should read: FORALL adversaries A with resources (t, q_G, q_H,
      q_D) in a stated region, FORALL deployments with (U, C) in a stated region, EXISTS a
      reduction B such that Adv(A) <= f(...). The audit question is whether the published
      figure instead instantiates EXISTS (q_G, q_H, q_D, U, C) - i.e. whether the analyst's
      chosen point was universally quantified in the text and existentially quantified in the
      arithmetic. This record does not assume the answer; it records which of the two the
      primary text states, and IDEA-20260816-9bec34's linter is the natural instrument for it.
    method_ceiling:
      strongest_certifiable_claim: >-
        'No document in the enumerated retrieval set states a numeric bound on variable X,
        and every delegation chain from those documents terminates without a value.' That is
        the ceiling. The method can NEVER certify that X is unbounded in the world, that a
        large X is reachable, that any attacker exists, or that FrodoKEM is insecure. It also
        cannot certify that the enumerated retrieval set is complete - see H1.
      nearby_object_control: >-
        ML-KEM, where the same census has already been run and returned 'no specification
        states any numeric M greater than 1' while ML-KEM is nonetheless a FIPS standard in
        wide deployment. That is the nearby object on which the hoped-for reading - 'an
        unsourced variable means a real security problem' - demonstrably FAILS. Any run of
        this record that reads its own absences as a security consequence has been refuted in
        advance by its own control.
    proof_obligations:
      - claim: The transcribed bound's variable list is complete and each symbol is bound to its printed definition.
        responsibility: interface
      - claim: The published bit figures reproduce from the transcribed bound at the published inputs.
        responsibility: baseline
      - claim: Each 'not stated' row is supported by named full-text search terms over a retrieved document.
        responsibility: correctness
      - claim: Acquisition failures are enumerated separately and never counted as absences.
        responsibility: scope
      - claim: The dominant term is identified correctly at each evaluation point in exact or interval arithmetic.
        responsibility: correctness
    not_applicable_reason: null
  predictions:
    - metric: >-
        number of DOMINANT-TERM free variables carrying class P5 or P6 (no finite
        document-sourced supremum), per parameter set
      direction: higher
      minimum_effect: >-
        at least 1 at each of Frodo-640/976/1344. Zero at all three is the clean negative and
        means the sweep collapses to a finite sourced point set.
    - metric: >-
        number of delegation chains that terminate in a document stating no number, with the
        full path recorded
      direction: higher
      minimum_effect: 1
    - metric: >-
        number of distinct provenance classes represented among the variables of a SINGLE
        dominant term (the heterogeneity sub-claim)
      direction: higher
      minimum_effect: 2
    - metric: >-
        signed gap, in bits, between the bit figure at the largest SOURCED value of each P2
        variable and the published category figure for that parameter set
      direction: different
      minimum_effect: >-
        report the number with its sign and its interval; no minimum magnitude is declared
        because a gap of zero is a meaningful result (the sourced point is the published
        point)
    - metric: >-
        count of acquisition failures, reported separately with HTTP status and attempt count
      direction: different
      minimum_effect: >-
        reported whatever its value; a census with zero acquisition failures and a paywalled
        ISO amendment in its source list is not credible and must be re-examined
  minimal_test:
    design: >-
      SCOPE-REDUCED FIRST PASS, executable without waiting for the ISO amendment. Take the
      variable list from the GOAL-FRODO-002 BATCH-001 transcription. Freeze the six-way
      taxonomy. Classify every variable using ONLY the four documents this session has
      already reached (the CiC/ePrint FrodoKEM paper, draft-longa-cfrg-frodokem,
      draft-longa-cfrg-frodokem-security-considerations, draft-smyslov-lamps-frodokem-certificates),
      plus the FrodoKEM standard proposal PDF. Run NULL-1, NULL-2 and NULL-3 first and abort
      if any fails. Then evaluate the bound at the published inputs (gating baseline
      reproduction of 149.8 / 212.6 / 266.8) and at the sourced supremum of every P2
      variable, in exact or interval arithmetic. Report the five metrics above plus the
      acquisition-failure table. THIS DISCRIMINATES because the two competing explanations
      make opposite predictions on metric 1: if the published accounting is anchored to
      deployment quantities, every dominant-term variable is P1 or P2 and metric 1 is zero;
      if it is anchored to a modelling convention, at least one dominant-term variable is P6
      and no document can move it. Budget: retrieval and reading dominate; arithmetic is
      seconds. Estimated 4-8 hours of agent time, no meaningful compute.
    controls:
      - NULL-1 positive control on the retrieved eFrodoKEM 2^8 clause; must return P2 with the value.
      - NULL-2 positive control on a spec-fixed length parameter; must return P1, not P5.
      - NULL-3 negative control on q_G; must return P6, and a numeric answer voids the run.
      - >-
        Gating baseline reproduction of the three published bit figures before any sourced
        evaluation point is reported (GOAL-FRODO-002 completion criterion 2, inherited).
      - >-
        Mutation control inherited from the goal: perturb one exponent of the transcribed
        bound and confirm the evaluation registers it.
      - >-
        Acquisition-failure table maintained separately, with the CNSA-2.0 precedent named in
        the artifact so a later reader cannot read MISSING as EMPTY.
    required_metrics:
      - per-variable provenance class with the citing clause or the named absence-establishing search terms
      - dominant-term provenance signature per parameter set and per evaluation point
      - count of P5/P6 variables in the dominant term
      - delegation chains with full path and terminating document
      - baseline reproduction outcome for each of the three published figures, with residual
      - acquisition-failure table (source, URL, HTTP status, attempts, timestamp)
  falsification_conditions:
    - >-
      Every dominant-term variable classifies P1 or P2 at all three parameter sets. The claim
      is refuted; the correct reading is that the published accounting IS anchored to sourced
      quantities, the sweep collapses to a small finite set of points, and the lane should
      report a verdict at those points. This is a strong positive outcome for FrodoKEM and
      must be reported as such rather than buried.
    - >-
      NULL-1 or NULL-2 fails: the procedure cannot recognize a bound that is stated, so no
      absence it reports is admissible and the record produces nothing.
    - >-
      NULL-3 returns a numeric bound for q_G: the procedure is treating a modelling
      convention as a source and the whole taxonomy is void.
    - >-
      The baseline reproduction fails: no census result may be published on top of an
      unreproduced baseline (RQ-FRODO-a2dbe2.constraints). The discrepancy becomes the
      deliverable and this record is suspended.
    - >-
      The dominant term changes identity across the region an unsourced variable ranges over,
      so that 'the dominant-term variables' is not a well-defined set. The record must then
      report a dominance-region decomposition instead of a single signature, or withdraw.
    - >-
      All three controls return the same class, showing the taxonomy does not discriminate on
      its own control set.
  confounders:
    - >-
      FrodoKEM's deployment surface is thinner and younger than ML-KEM's. An absence may
      record immaturity of the standardization track rather than a structural gap in the
      accounting, and the census cannot tell those apart. It must say so in every conclusion.
    - >-
      The ISO/IEC amendment is very likely paywalled. Its absence from the census is an
      acquisition failure and may hide exactly the clause that would flip a row.
    - >-
      The classification depends entirely on the transcription. If BATCH-001 transcribes a
      variable under a different name or folds two variables into one, the class signature
      changes without anything in the world changing.
    - >-
      Retrieval-model paraphrase risk: the two datatracker readings in this record were
      produced by a fetching model summarizing a page, not by a full-text search. Treating
      those summaries as census rows would import a paraphrase as a source.
    - >-
      Publication lag: a clause added to a draft after the retrieval date can invalidate a
      row. Every row carries a retrieval timestamp for this reason.
    - >-
      Confirmation pressure: 'not stated' is the interesting answer and is also the answer a
      lazy search returns. The named-search-terms requirement exists specifically to make a
      lazy absence checkable.
  interpretation_limits:
    - >-
      An unsourced variable is an ABSENCE OF A STATED NUMBER, symmetric in both directions.
      It is not a ceiling, not a permission, not evidence that a large value is reachable, and
      not evidence that it is not.
    - >-
      Nothing here is a statement about any attacker. A gap in what the published accounting
      anchors is a statement about the accounting, per RQ-FRODO-a2dbe2.constraints[3].
    - >-
      No LWE hardness estimate is produced or consumed beyond taking the published figure as
      a given input, per GOAL-FRODO-002.non_duplication[1].
    - >-
      No statement is made about whether any published failure rate is correct; the failure
      rate is a symbol here, per GOAL-FRODO-002.non_duplication[0].
    - >-
      The claim tier is SPLIT: crypto tier for the documentary and arithmetic content
      (a document either states a number or does not; an inequality either evaluates to a
      figure or does not), and NOTHING above toy tier for any reading about FrodoKEM's actual
      security.
    - >-
      The census's own nearby-object control (ML-KEM) demonstrates that unsourced variables
      coexist with widely deployed standards. Any security reading is refuted by that control
      before it is made.
  heuristic_assumptions:
    - id: H1
      statement: >-
        (Retrieval completeness.) The set of documents that could normatively bound a
        FrodoKEM deployment variable is exhausted by: the FrodoKEM specification and its
        companion paper, the CFRG drafts, the LAMPS certificate profile, the ISO/IEC 18033-2
        amendment, and the governing NIST/IETF clauses a FrodoKEM deployment inherits. FOR
        ALL variables v of the bound, if any normative document states a numeric bound on v,
        it is in that set.
      rigorous_support: >-
        Not a theorem and cannot be one. The rigorous part it imitates is the delegation
        structure actually observed in the ML-KEM census: every deployment document that
        declined to state a count DELEGATED, and every delegation terminated inside a small,
        enumerable set of governing documents. That is an observed structural fact over 24
        rows in one scheme, not a proof, and its transfer to FrodoKEM is an assumption.
      validation_plan: >-
        Adversarial completeness search: (i) follow every 'refer to' and 'see' cross-reference
        in every retrieved document to fixpoint, recording the closure; (ii) search the IETF
        datatracker for every draft citing FrodoKEM and check each for a use bound; (iii)
        check the two national-agency recommendations that name FrodoKEM (BSI, ENISA - both
        currently RECALLED from a search summary and unverified) for a stated limit;
        (iv) declare the closure size and report any document reached at depth greater than
        two, since a bound hiding three hops away falsifies the 'small enumerable set'
        structure the heuristic rests on. TRANSFER ASSUMPTION, stated explicitly: the ML-KEM
        delegation structure is assumed to transfer to FrodoKEM's thinner and younger
        standardization surface; it may not, and a FrodoKEM-specific closure of a different
        shape is itself a reportable finding.
    - id: H2
      statement: >-
        (Dominance stability.) FOR EACH parameter set P and FOR EACH unsourced variable v,
        the identity of the dominant additive term is constant over the declared ladder of v.
      rigorous_support: >-
        Each term of an FO-style bound is a monomial-like monotone function of the query and
        target counts, so the dominance partition of a sum of such terms is a union of
        connected cells - the structural fact IDEA-20260816-d270bc is built to test. If that
        proposal's cell-structure check passes, H2 is checkable directly rather than assumed.
      validation_plan: >-
        Evaluate the dominance label at both endpoints and at a declared interior ladder of
        every unsourced variable, at every parameter set, in interval arithmetic; report the
        breakpoints found rather than a single signature if the label moves. Sampled
        parameters to be recorded: the exact ladder, the parameter sets, and the arithmetic
        precision. If d270bc has already run, reuse its label field and cite the run rather
        than recomputing.
  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED, and no attack is described. The record's own cost is
      dominated by document retrieval and reading; the arithmetic is O(number of terms x
      number of evaluation points) exact-rational or interval evaluations, i.e. seconds. What
      the record can move is not an exponent but the QUANTIFIER of the published figure: from
      'at a chosen query point' to 'at the largest sourced query point', which is a change in
      what the figure means, not in what it costs an adversary.
    memory_exponent: >-
      No attack memory exponent is claimed. Artifact storage is the census table, kilobytes.
    best_known: >-
      There is no incumbent for FrodoKEM. The nearest incumbent in the program is
      GOAL-MLKEM-005's 24-row ML-KEM census of a single variable M, which is the acknowledged
      parent and dominates this record on maturity for a different scheme and a different
      variable. Externally, Glabush-Hövelmanns-Stebila (CiC 3(1), 2026) supplies the only
      published quantitative multi-target statement this record is aware of - 62 bits
      recoverable by salting at the 128-bit level, attacks feasible at circa 2^64 challenge
      ciphertexts - and it is a statement about the BOUND, not about deployment reachability,
      so it does not dominate a census.
    hidden_overhead: >-
      The hidden cost is entirely epistemic and it is H1: the census's central claim is a
      NEGATIVE EXISTENTIAL over a document set, and the cost of raising confidence in it grows
      with the closure depth searched, without bound and without a stopping rule that any
      theorem supplies. Declaring the closure and its depth is the only honest mitigation.
      A second hidden cost is the transcription dependency, which can invalidate every row at
      no notice.
    tradeoff_note: >-
      Not applicable in the time-memory sense; no search is performed. The relevant tradeoff
      is retrieval breadth against confidence in H1, and it is reported as closure depth
      versus rows changed at each depth.
  dominated_by: >-
    n/a (no attack or cost result is claimed, so no Pareto frontier row over time, memory and
    data/queries applies; writing 'null' here would be a fabrication under AGENTS.md rule 5).
    Checked explicitly against the only cost-bearing rows this session could reach: the
    Glabush-Hövelmanns-Stebila multi-target attack figure (feasible at circa 2^64 challenge
    ciphertexts, 62 bits recoverable by salting) is an attack-side statement on a DIFFERENT
    axis and neither dominates nor is dominated by a documentary census; the ML-KEM M census
    is on the same axis but a different scheme and one variable. On the census axis for
    FrodoKEM there is no existing row at all, so there is nothing to be dominated by.
  sota_delta: >-
    No attack; documentary-plus-arithmetic contribution only. Quantitatively: the repository
    contains zero sourced values for any FrodoKEM deployment variable and zero rows of any
    FrodoKEM census, so the delta is the creation of a first sourced evaluation-point set with
    its absences made checkable, plus the first per-variable provenance classification of an
    FO bound in this program. Against the external literature the delta is smaller and is
    stated as such: the multi-target sensitivity of FO bounds at 128-bit message spaces is
    published, and this record supplies reachability documentation for it rather than new
    cryptanalysis.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    By part. (i) That the transcription arrives and the variable list is stable enough to
    classify: 0.7 - the source gate is shut and GOAL-FRODO-002 has not run BATCH-001.
    (ii) That the three controls pass and the instrument is admissible: 0.85.
    (iii) That at least one dominant-term variable classifies P6 (offline hash queries):
    0.9 - this is close to structural for any FO bound and is the least surprising part.
    (iv) That at least one dominant-term variable classifies P5 (a delegation terminating
    without a value), which is the interesting documentary finding: 0.55, and the LAMPS draft
    already looks like one.
    (v) That the heterogeneity sub-claim holds, i.e. a single dominant term contains at least
    two distinct provenance classes: 0.6.
    (vi) That the gating baseline reproduction of 149.8/212.6/266.8 succeeds: 0.5, and I would
    bet against it more readily than against anything else here, because the published figures
    may be LWE-estimator outputs that the reduction's loss was never subtracted from - which,
    if true, is a larger finding than this record's own claim and belongs to whoever finds it.
