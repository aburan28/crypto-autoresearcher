      a dominance-region decomposition instead of a single signature, or withdraw.
    - >-
      All controls return the same class, showing the taxonomy does not discriminate on its own
      control set.
  confounders:
    - >-
      FrodoKEM's deployment surface is thinner and younger than ML-KEM's. An absence may record
      immaturity of the standardization track rather than a structural gap in the accounting,
      and the census cannot tell those apart. It must say so in every conclusion.
    - >-
      Two Internet-Drafts at revisions 00 and 01 are moving targets, and a difference in
      normative shape between them may be editorial lag rather than a substantive divergence.
      Every C3 row must carry both revision numbers and a retrieval timestamp, and the record
      must check for newer revisions before reporting.
    - >-
      The ISO/IEC amendment is very likely paywalled. Its absence from the census is an
      acquisition failure and may hide exactly the clause that would flip a row.
    - >-
      The classification depends entirely on the transcription. If BATCH-001 transcribes a
      variable under a different name or folds two variables into one, the class signature
      changes without anything in the world changing.
    - >-
      Retrieval-model paraphrase risk: every datatracker reading in this record was produced by
      a fetching model summarizing or quoting a page, not by a full-text search. Treating those
      as census rows without re-establishment would import a paraphrase as a source. This is the
      single largest threat to the seeded C3 row and is why it is marked as a seed requiring
      confirmation.
    - >-
      Publication lag: a clause added to a draft after the retrieval date can invalidate a row.
    - >-
      Confirmation pressure: 'not stated' is the interesting answer and is also the answer a
      lazy search returns. The named-search-terms requirement exists specifically to make a lazy
      absence checkable. Symmetrically, 'the documents disagree' is now the interesting answer,
      and the mitigation is that both readings must be printed side by side so a reader can
      judge the normalization.
  interpretation_limits:
    - >-
      An unsourced variable is an ABSENCE OF A STATED NUMBER, symmetric in both directions. It
      is not a ceiling, not a permission, not evidence that a large value is reachable, and not
      evidence that it is not.
    - >-
      A difference in normative shape between two drafts is a documentary observation about two
      drafts at stated revisions. It is not a defect claim and not a security claim, and drafts
      are revised routinely.
    - >-
      Nothing here is a statement about any attacker. A gap in what the published accounting
      anchors is a statement about the accounting, per RQ-FRODO-a2dbe2.constraints[3].
    - >-
      No LWE hardness estimate is produced or consumed beyond taking the published figure as a
      given input, per GOAL-FRODO-002.non_duplication[1]. In particular 149.8 / 212.6 / 266.8
      are beyond-core-SVP cryptanalysis outputs and are never re-derived here.
    - >-
      No statement is made about whether any published failure rate is correct; the failure rate
      is a symbol here, per GOAL-FRODO-002.non_duplication[0].
    - >-
      The claim tier is SPLIT: crypto tier for the documentary and arithmetic content (a
      document either states a number or does not; an inequality either evaluates to a figure or
      does not), and NOTHING above toy tier for any reading about FrodoKEM's actual security.
    - >-
      The census's own nearby-object control (ML-KEM) demonstrates that unsourced variables
      coexist with widely deployed standards. Any security reading is refuted by that control
      before it is made.
  heuristic_assumptions:
    - id: H1
      statement: >-
        (Retrieval completeness.) The set of documents that could normatively bound a FrodoKEM
        deployment variable is exhausted by: the FrodoKEM specification and its companion paper,
        the CFRG drafts, the LAMPS certificate profile, the ISO/IEC 18033-2 amendment, and the
        governing NIST/IETF clauses a FrodoKEM deployment inherits. FOR ALL variables v of the
        bound, if any normative document states a numeric bound on v, it is in that set.
      rigorous_support: >-
        Not a theorem and cannot be one. The rigorous part it imitates is the delegation
        structure actually observed in the ML-KEM census: every deployment document that
        declined to state a count DELEGATED, and every delegation terminated inside a small,
        enumerable set of governing documents. That is an observed structural fact over 24 rows
        in one scheme, not a proof, and its transfer to FrodoKEM is an assumption. ONE FrodoKEM
        chain has now been followed to depth two by this agent (LAMPS profile ->
        security-considerations -> I-D.FrodoKEM), and it terminated in a value, which is weak
        evidence for enumerability and weak evidence against the ML-KEM pattern transferring.
      validation_plan: >-
        Adversarial completeness search: (i) follow every 'refer to' and 'see' cross-reference
        in every retrieved document to fixpoint, recording the closure and, for each
        termination, whether it ends in a value, in silence, or in a differently-shaped clause;
        (ii) search the IETF datatracker for every draft citing FrodoKEM and check each for a
        use bound; (iii) check the national-agency recommendations that name FrodoKEM (BSI,
        ENISA - both currently RECALLED from a search summary and unverified) for a stated
        limit; (iv) declare the closure size and report any document reached at depth greater
        than two, since a bound hiding three hops away falsifies the 'small enumerable set'
        structure the heuristic rests on. TRANSFER ASSUMPTION, stated explicitly: the ML-KEM
        delegation structure is assumed to transfer to FrodoKEM's thinner and younger
        standardization surface; it may not, and a FrodoKEM-specific closure of a different
        shape is itself a reportable finding.
    - id: H2
      statement: >-
        (Dominance stability.) FOR EACH parameter set P and FOR EACH unsourced variable v, the
        identity of the dominant additive term is constant over the declared ladder of v.
      rigorous_support: >-
        Each term of an FO-style bound is a monomial-like monotone function of the query and
        target counts, so the dominance partition of a sum of such terms is a union of connected
        cells - the structural fact IDEA-20260816-d270bc is built to test. If that proposal's
        cell-structure check passes, H2 is checkable directly rather than assumed. AT LIVE RISK,
        DISCLOSED AT REPAIR: the red-team screen reports that the FrodoKEM bound carries a
        Renyi-divergence factor exp(s*D_alpha)^(1-1/alpha) multiplying a bracketed sum, which is
        not a monomial in any query or target count, so the monomial premise may not hold and
        the term-by-term check below is not a formality.
      validation_plan: >-
        Evaluate the dominance label at both endpoints and at a declared interior ladder of
        every unsourced variable, at every parameter set, in interval arithmetic; report the
        breakpoints found rather than a single signature if the label moves, and report
        separately any factor that is not a monomial in the counts. Sampled parameters to be
        recorded: the exact ladder, the parameter sets, and the arithmetic precision. If d270bc
        has already run, reuse its label field and cite the run rather than recomputing.
  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED, and no attack is described. The record's own cost is
      dominated by document retrieval and reading; the arithmetic is O(number of terms x number
      of evaluation points) exact-rational or interval evaluations, i.e. seconds. What the
      record can move is not an exponent but the QUANTIFIER of the published figure: from 'at a
      chosen query point' to 'at the largest sourced query point', which is a change in what the
      figure means, not in what it costs an adversary.
    memory_exponent: >-
      No attack memory exponent is claimed. Artifact storage is the census table, kilobytes.
    best_known: >-
      There is no incumbent census for FrodoKEM. The nearest incumbent in the program is
      GOAL-MLKEM-005's 24-row ML-KEM census of a single variable M, which is the acknowledged
      parent and dominates this record on maturity for a different scheme and variable.
      Externally, Glabush-Hovelmanns-Stebila (CiC 3(1), 2026) supplies the only published
      quantitative multi-target statement this record is aware of - 62 bits recoverable by
      salting at the 128-bit level, attacks feasible at circa 2^64 challenge ciphertexts - and
      it is a statement about the BOUND, not about deployment reachability, so it does not
      dominate a census.
    hidden_overhead: >-
      The hidden cost is epistemic and it is H1: the census's central claim is a NEGATIVE
      EXISTENTIAL over a document set, and the cost of raising confidence in it grows with the
      closure depth searched, without bound and without a stopping rule that any theorem
      supplies. Declaring the closure and its depth is the only honest mitigation. A second
      hidden cost is the transcription dependency, which can invalidate every row at no notice.
      A third, disclosed at repair: two of this record's six metrics had values forced by its
      own taxonomy and controls, which is a hidden overhead in the DESIGN rather than the
      compute, and forced_value_derivation exists so it is paid up front.
    tradeoff_note: >-
      Not applicable in the time-memory sense; no search is performed. The relevant tradeoff is
      retrieval breadth against confidence in H1, reported as closure depth versus rows changed
      at each depth.
  dominated_by: >-
    n/a (no attack or cost result is claimed, so no Pareto frontier row over time, memory and
    data/queries applies; writing 'null' here would be a fabrication under AGENTS.md rule 5).
    Checked explicitly against the only cost-bearing rows this session could reach: the
    Glabush-Hovelmanns-Stebila multi-target attack figure (feasible at circa 2^64 challenge
    ciphertexts, 62 bits recoverable by salting) is an attack-side statement on a DIFFERENT axis
    and neither dominates nor is dominated by a documentary census; the ML-KEM M census is on
    the same axis but a different scheme and one variable. On the census axis for FrodoKEM there
    is no existing row at all, so there is nothing to be dominated by. ADDED AT REPAIR: on the
    narrower question of what the FrodoKEM bound's dominant terms contain, the primary text
    itself dominates this record - the red-team screen reports the terms verbatim - so the
    record's value lies in the documentary sourcing, not in identifying the terms.
  sota_delta: >-
    No attack; documentary-plus-arithmetic contribution only. Quantitatively: the repository
    contains zero sourced values for any FrodoKEM deployment variable and zero rows of any
    FrodoKEM census, so the delta is the creation of a first sourced evaluation-point set with
    its absences made checkable, plus the first per-variable provenance classification of an FO
    bound in this program. Against the external literature the delta is smaller and is stated as
    such: the multi-target sensitivity of FO bounds at 128-bit message spaces is published, and
    this record supplies reachability documentation rather than new cryptanalysis. REDUCED AT
    REPAIR: the headline metric as originally written had a forced value and contributed no
    delta at all; what remains is the delegation structure, the heterogeneity among cappable
    variables, and the normative-force comparison, of which one row is already established and
    is credited as a seed rather than as an output.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: >-
    By part, re-scored after the red-team screen and this agent's own re-reading of two drafts.
    (i) That the transcription arrives and the variable list is stable enough to classify: 0.7 -
    the source gate is shut and GOAL-FRODO-002 has not run BATCH-001.
    (ii) That the four controls pass and the instrument is admissible: 0.75, lowered from 0.85
