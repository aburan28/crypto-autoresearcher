    results: >-
      Inside the repository: the eight existing RQ-FRODO-a2dbe2 proposals are the salt as a
      hash-input partition (32c366), the ROM-QROM gap as an integer exponent vector (583998),
      instrument certification with unstructured FrodoKEM as the free control (72e5e5),
      interval rather than point propagation (7b9457), the ledger of forgiven constants
      (8596af), a quantifier-order linter (9bec34), implicit versus explicit rejection as two
      functions (adf2a2), and the dominant-term label field over a five-dimensional grid
      (d270bc). Every one of them takes the bound's input values as SWEPT or SYMBOLIC. None
      asks where a value could come from, none cites a normative document, and none contains
      a census. The nearest artifact in the program is GOAL-MLKEM-005's M census, which is a
      different scheme and exactly ONE variable (ciphertexts decapsulable under one ML-KEM
      encapsulation key); its structural finding - every static row bounds the key in TIME or
      by a rate-limiting SHOULD and never by a count, and the one delegation
      (draft-ietf-tls-hybrid-design-16 Sec. 2) terminates at FIPS 203, which states none - is
