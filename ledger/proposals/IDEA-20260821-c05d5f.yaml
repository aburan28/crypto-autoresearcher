idea:
  id: IDEA-20260821-c05d5f
  question_id: RQ-FRODO-a2dbe2
  added: '2026-08-21'
  title: >-
    Every free variable in the FrodoKEM IND-CCA bound has a PROVENANCE CLASS, and only some
    of them are deployment quantities: classify each symbol by the kind of authority that
    could fix its value (spec-fixed constant, normatively bounded by count, bounded only in
    time, bounded only by a rate-limiting SHOULD, delegated to a document that states
    nothing, or bounded only by the adversary's own compute budget), source each class
    against FrodoKEM's actual standardization surface, and report whether any variable
    appearing in the DOMINANT term of the bound is bounded by no retrieved document at all.
  class: measurement
  claim: >-
    (A) THE OBJECT. GOAL-FRODO-002 plans to sweep query count, user count, ciphertext count
    and failure rate over a grid. A sweep produces a table; a verdict needs to know which
    cells of that grid a deployment can actually occupy, and that is a documentary question
    about where a number for each symbol could come from. The tracked object is therefore not
    the value of a variable but its PROVENANCE CLASS: the kind of authority that fixes it.
    (B) THE CLAIM, FALSIFIABLE. For at least one variable appearing in the dominant additive
    term of the transcribed FrodoKEM IND-CCA bound, at each of Frodo-640/976/1344, no
    retrieved normative document states a numeric bound, and every delegation chain that
    could supply one terminates without a value. If that holds, the published
    category-level bit-security figures are not a function of any sourced deployment
    quantity for that variable, and any bit figure quoted at a chosen value of it is a
    figure about the analyst's choice. (C) THE STRUCTURAL SUB-CLAIM, WHICH IS THE PART MOST
    LIKELY TO BE WRONG AND IS THE MOST USEFUL EITHER WAY. The variables of an FO-style bound
    do not all have the same kind of ceiling. Hash-oracle query counts (q_G, q_H) are offline
    quantities: the adversary computes hashes on its own hardware and no protocol clause can
    cap them, so their ceiling is the adversary's compute budget and is a modelling choice,
    not a deployment fact. Decapsulation-query counts (q_D), user counts (U) and per-key
    ciphertext counts (C) are online quantities that a protocol CAN cap. The claim is that
    the bound's dominant term at deployment-plausible inputs contains at least one variable
    of each kind, so that no single sourcing strategy fixes the grid, and that the mixed
    provenance is invisible in a bit figure. (D) WHAT IS NOT CLAIMED. No attack, no break, no
    statement that FrodoKEM is insecure, no re-estimation of LWE hardness, and no assertion
    that any published failure rate is right or wrong. An absence of a stated bound is an
    ABSENCE, not a ceiling and not a permission: it is symmetric, exactly as
    GOAL-MLKEM-005's census recorded, and reading it as either is the specific error this
    record is written to prevent. A tightness or sourcing gap is a statement about what the
    published accounting establishes, never about an attacker.
  mechanism: >-
    STAGE 0 (GATE, inherited): this record consumes the transcription that GOAL-FRODO-002
    BATCH-001 is chartered to produce. Until the bound exists as an explicit inequality with
    every symbol bound to a definition, the variable list is unknown and the census has
    nothing to classify. This record does not perform the transcription and must not be run
    ahead of it. STAGE 1: enumerate the free variables of the transcribed bound, verbatim,
    with the symbol, its definition as printed, and the quantifier it sits under. STAGE 2:
    assign each variable a provenance class from a fixed, pre-declared six-way taxonomy:
    P1 spec-fixed constant (len_mu, len_sec, len_salt, len_seedSE); P2 normatively bounded by
    a COUNT in a retrieved document; P3 bounded only in TIME (certificate validity,
    cryptoperiod, rotation recommendation); P4 bounded only by a rate-limiting SHOULD;
    P5 delegated to another document that states no number (a terminating delegation chain);
    P6 bounded only by the adversary's own compute budget, i.e. offline and uncappable by any
    protocol clause. The taxonomy is frozen before retrieval so the classification cannot be
    tuned to the answer. STAGE 3: source each P2-P5 candidate against the FrodoKEM
    standardization surface in a declared preference order - the FrodoKEM standard proposal
    and the CiC/ePrint paper, draft-longa-cfrg-frodokem, draft-longa-cfrg-frodokem-security-considerations,
    draft-smyslov-lamps-frodokem-certificates, the ISO/IEC 18033-2 amendment, and any
    governing NIST or IETF clause that a FrodoKEM deployment would inherit - recording for
    every 'not stated' the exact full-text search terms used to establish the absence, so
    that the absence is checkable rather than asserted. STAGE 4: separate ACQUISITION
    FAILURES from STATED ABSENCES in their own table with HTTP status and attempt count. This
    is not bookkeeping pedantry: GOAL-MLKEM-005's census lost CNSA 2.0 to a 403 and recorded
    it as MISSING rather than empty, and a paywalled ISO amendment is the obvious repeat.
    STAGE 5: evaluate the transcribed bound at the sourced supremum of every P1/P2 variable
    and at a declared ladder for every P3-P6 variable, and record WHICH TERM DOMINATES at
    each point and which provenance classes its variables carry. STAGE 6: report the
    dominant-term provenance signature per parameter set, the count of dominant-term
    variables that are unsourced, and every delegation chain that terminated without a value,
    with its full path.
  novelty_status: unverified
