    2^8 clauses into one row fails both.
    (iii) That at least one dominant-term variable classifies P6: 0.9 in the previous revision,
    now RESTATED AS FORCED rather than priced - see forced_value_derivation. A probability was
    the wrong instrument for a derivable quantity, and pricing it at 0.9 while calling it 'close
    to structural' was the warning this record did not act on.
    (iv) That at least one delegation chain terminates without a value (C1): 0.5, lowered from
    0.55, because the one chain this agent actually followed terminated WITH a value.
    (v) That the heterogeneity sub-claim holds among CAPPABLE variables, i.e. a single dominant
    term contains at least two distinct classes outside P1 and P6: 0.4, lowered from 0.6 under
