    message-space, which would return zero.
    (vi) That the gating baseline reproduction succeeds: the previous revision priced this at
    0.5 and said 'I would bet against it more readily than against anything else here, because
    the published figures may be LWE-estimator outputs that the reduction's loss was never
    subtracted from'. THAT GUESS WAS CORRECT AND IS NOW DOCUMENTED: the CFRG draft attributes
    149.8 / 212.6 / 266.8 to the beyond-core-SVP methodology. The gate has been repaired
