    verdict: >-
      ADAPTATION, stated honestly. The METHOD is not new: it is GOAL-MLKEM-005's census
      method, and that provenance is declared rather than hidden. What is new relative to
      this repository is (i) applying it to FrodoKEM, whose deployment surface no record in
      the corpus has examined, (ii) applying it to a VARIABLE SET rather than to one variable,
      with a frozen six-way provenance taxonomy, and (iii) the structural sub-claim that the
      classes are heterogeneous within a single dominant term, which is a claim about the
      bound and not about the documents. What is NOT claimed as new: the observation that FO
      bounds carry a q_G-linear loss (recalled prior art), and the multi-target message-space
      issue at 128-bit message spaces, which is PUBLISHED (Glabush-Hövelmanns-Stebila, CiC
      3(1), 2026) and is cited here rather than rediscovered.
      LABEL FORCED TO `unverified` BY RULE, NOT BY DOUBT: this record rests on citation(s) marked
      provenance `recalled`, and AGENTS.md rule 9 -- enforced by tools/validate_ledger.py
      check_citations -- requires novelty_status `unverified` until such a source is actually read.
      The crypto-kb retrieval index answers nothing this session (in-memory Qdrant), so no record in
      this batch may assert a checked literature negative. The substantive assessment above is
      unchanged.
  object_first_candidate:
    tracked_object: >-
      The provenance class of each free variable of the transcribed bound: a map from symbol
      to the KIND of authority that could fix its value, over the frozen six-element taxonomy
      P1..P6 defined in the mechanism. What is followed through the computation is not a
      number but the type of ceiling a number would have to come from.
    lossiness: >-
      GENUINELY LOSSY, and the discard is the point. The projection keeps the symbol's
      binding-authority type and discards its numeric value entirely: a variable capped at
      2^8 by a normative MUST NOT and one capped at 2^64 by a normative MUST NOT map to the
      SAME object. It also discards the coefficient the variable carries in the bound. The
      discard is compatible with the target's operation - substitution into a monotone
      inequality - because the supremum of a monotone term over the reachable region is
      determined by the binding constraint's TYPE in exactly one respect that survives:
      classes P5 and P6 have no finite supremum from any document, so a monotone-increasing
      term containing a P5 or P6 variable has no document-sourced ceiling at all, whatever
      its coefficient. That is a deterministic propagation law on the retained part alone.
      The projection is NOT a change of coordinates: from the class alone one cannot
      reconstruct the value, and two bounds with identical class signatures can have
      bit-security figures differing by any amount.
    propagation: >-
      One step is: substitute one variable's class-supremum into the bound and ask which term
      dominates. The law is: a P1/P2 variable contributes a finite sourced ceiling; a P3/P4
      variable contributes a ceiling only after a conversion (time to count) that requires a
      RATE no document supplies, so it propagates as 'unsourced with a named missing
      quantity'; a P5 variable propagates as 'unsourced with a named terminating chain'; a P6
      variable propagates as 'unsourced by construction, because the quantity is offline'.
      These four outcomes are distinguishable in the output and each is a different remedy.
    survival_score: >-
      Survives one full evaluation of the bound and dissolves at the second. The class
      determines the outcome only while every term is monotone increasing in the variable;
      the moment two variables of the same class enter with opposite monotonicity - which
      happens in FO bounds, where a larger message space helps and a larger query count hurts
      - the class stops determining anything and the numbers must be read. Reporting the
      exact term at which this happens is part of the deliverable, not a caveat.
  null_object_control: >-
    THREE controls, all of which CAN FAIL, run before any 'not stated' row is admissible.
    NULL-1, POSITIVE CONTROL ON A KNOWN-STATED BOUND: the census procedure is run against a
    variable whose numeric bound this session has already retrieved verbatim - the eFrodoKEM
    per-public-key ciphertext cap of 2^8 in draft-longa-cfrg-frodokem-security-considerations-00.
    The procedure MUST return class P2 with the value 2^8 and the citing clause. If it returns
    'not stated', the instrument under-reports and no absence it reports means anything.
    NULL-2, POSITIVE CONTROL ON A SPEC-FIXED CONSTANT: a length parameter (len_mu or
    len_salt) must come back P1 with the value from the specification, not P5. A procedure
    that cannot distinguish 'the specification fixes this' from 'nobody bounds this' is
    measuring its own retrieval failures. NULL-3, NEGATIVE CONTROL, A VARIABLE THAT MUST
    COME BACK UNSOURCED: the number of offline hash evaluations q_G. No protocol clause can
    cap an offline computation, so the correct answer is P6. If the procedure returns a
    numeric bound for q_G, it has mistaken a modelling convention (an analyst's chosen
    2^64 or 2^128) for a sourced deployment quantity, which is precisely the error the whole
    record exists to detect, and the run is void. SPREAD CHECK, per KN-TECH-1a5b7e: the
    controls span at least three distinct classes, so the classification's output is not
    constant across its own control set; if all three controls return the same class the
    taxonomy is decorative.
  discriminated_from:
    - >-
      IDEA-20260816-d270bc records WHICH additive term is largest over a five-dimensional
      grid and asks whether the dominance partition has the cell structure a correct
      transcription must have. It is a self-consistency check on the transcription and it
      never leaves the grid. This record asks which cells of that grid a deployment can
      occupy and answers with documents, not arithmetic. The two compose - d270bc supplies
      the dominance map this record's STAGE 5 reads - and neither substitutes for the other.
    - >-
      IDEA-20260816-7b9457 propagates an uncertainty INTERVAL on the correctness error
      through the bound in certified interval arithmetic. Its object is numerical uncertainty
      in one value; this record's object is the absence of any value, which is not an
      interval and cannot be represented as one. An unsourced P6 variable has no interval.
    - >-
      IDEA-20260816-72e5e5 certifies the evaluation pipeline as an instrument by feeding it
      matched and mismatched schemes. That is a control on the arithmetic; this is a control
      on the inputs. A pipeline can be perfectly certified and still be evaluated at a query
      count nobody can justify.
    - >-
      IDEA-20260816-32c366 simulates multi-target hash search at toy digest widths to measure
      a target-hit growth exponent. It explicitly makes no statement about reachability and
      no statement about FrodoKEM's salt. This record supplies exactly the reachability
      statement 32c366 disclaims, and does it documentarily rather than by simulation.
    - >-
      GOAL-MLKEM-005's census (internal, BATCH-a51f91, TASK-20260805-e6a153) is the
      acknowledged parent. It is one variable, one scheme, and it deliberately reports no bit
      figure and no derived quantity. This record is a different scheme, a variable SET, a
      frozen provenance taxonomy, and it does evaluate the bound at the sourced points -
      which is the step that turns a census into a verdict and is also the step that makes
      the claim-tier split load-bearing.
    - >-
      IDEA-20260821-c2242b (this batch) audits the BINDER SCOPE of one stated restriction.
      That is a question about a quantifier; this is a question about whether any number
      exists at all. c2242b is well-defined only for variables this record classifies P2.
