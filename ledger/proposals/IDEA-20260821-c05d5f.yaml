  assumptions:
    - >-
      The transcribed bound exists before this record is executed. Without it the variable set
      is unknown. This is a hard dependency on GOAL-FRODO-002 BATCH-001, not a soft one.
    - >-
      The six-way provenance taxonomy is frozen before retrieval begins and is not revised after
      any document is read; a taxonomy tuned post hoc can classify anything as anything. The
      modality coordinate added at repair is an ADDITIONAL recorded field, not a revision of the
      six classes, and it is frozen here before the run.
    - >-
      'Dominant term' is well defined at each evaluation point, i.e. no tie within the
      arithmetic precision used. Ties are reported as ties, not broken.
    - >-
      A stated absence established by named full-text search terms is a different epistemic
      object from an acquisition failure, and the two are never merged.
    - >-
      No conclusion transfers to any scheme other than FrodoKEM, and none transfers to a
      deployment mode not enumerated in the census.
    - >-
      Every clause is bound to a document revision and a retrieval timestamp; a later revision
      may harmonize two clauses and thereby close the C3 question by itself.
  proof_search_map:
    bottleneck: >-
      The substitution step: the exact point in the published accounting where a numeric query,
      user or ciphertext count is inserted into the bound to produce a bit figure. If that
      number has no source - or has two sources that disagree in shape - every figure downstream
      inherits the defect, and this is the step whose removal changes what the published
      category assignment means.
    baseline_embedding:
      parameter_slice: >-
        The paper's own stated inputs for its own stated IND-CCA (ROM) figure per parameter set.
        The census's STAGE 5 evaluation must reproduce that figure at those inputs before any
        sourced evaluation point is reported.
      reproduction_check: >-
        REPAIRED AT 2026-08-24, and this is BLOCKING-1 in this record. The inherited gate
        formerly read 'the census's STAGE 5 evaluation must reproduce 149.8 / 212.6 / 266.8 at
        the inputs at which draft-longa-cfrg-frodokem-security-considerations-00 reports them'.
        THAT GATE IS WITHDRAWN AS A CATEGORY ERROR: the same draft, re-read verbatim this
        session, attributes those three figures to the 'beyond-core-SVP' methodology, i.e. to
        LWE cryptanalysis of the FrodoKEM instances. They are therefore not outputs of any
        FO/SFO bound; a pipeline that reproduced them from the transcribed bound would be wrong,
        and the roughly ten-bit discrepancy such a gate would emit would be an artefact of
        comparing a cryptanalysis estimate with a reduction bound.
        REPLACEMENT, TWO ARMS. (i) REDUCTION ARM: the transcribed bound, evaluated at the
        paper's own stated inputs, must reproduce the paper's own stated IND-CCA (ROM) bit
        figure per parameter set, held as a frozen regression fixture with the inputs and the
        tolerance. THE NUMERIC TARGET IS DELIBERATELY LEFT UNFILLED HERE: it is a required
        BATCH-001 transcription output, and although the red-team screen reports the values from
        the paper's Table 4, this agent has not read that table and will not copy an unverified
        number into a frozen fixture. (ii) CRYPTANALYSIS ARM: 149.8 / 212.6 / 266.8 enter as
        GIVEN INPUT SYMBOLS with their beyond-core-SVP provenance recorded; re-deriving them is
        forbidden by GOAL-FRODO-002.non_duplication[1] and is not this lane's work. A pipeline
        that cannot recover the reduction-arm figure has not earned the right to report a
        sourced evaluation anywhere.
        COORDINATOR NOTE, not an action by this agent: GOAL-FRODO-002.completion_criteria[1]
        carries the same ambiguity and needs the same repair. Changing it is not this agent's
        authority.
    observation_collision:
      observable: >-
        The dominant-term provenance signature: an ordered tuple of classes over the variables
        of the largest term.
      distinct_preimage_search: >-
        Search for two deployment profiles with the SAME signature but materially different
        reachable bit security - for example a static certified FrodoKEM key (unbounded per-key
        ciphertext count, no stated count) and an ephemeral-per-handshake key (one ciphertext
        per key, very many keys). If both project to the same signature, the signature is not
        identifying and the record must report the collision and add the distinguishing
        coordinate (the variable's monotonicity direction in the dominant term) rather than
        suppress it. ADDED AT REPAIR: a second live collision is that a variable sourced by two
        documents with different modality projects to the same class P2 under the six-way
        taxonomy alone, which is exactly why the modality coordinate is recorded alongside.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the numeric grid by the class lattice P1..P6 ordered by 'has a
          document-sourced finite supremum', so that the question 'is the category floor
          crossed' becomes 'does any monotone-increasing dominant term contain a variable with
          no finite sourced supremum' - an exact condition rather than a swept table.
        predicted_gain: >-
          Converts an infinite sweep into a finite documentary decision per parameter set. The
          gain is in what can be CONCLUDED, not in compute; no exponent is claimed. DISCLOSED
          AT REPAIR: for the FO family that exact condition has a forced answer (see
          forced_value_derivation), so the gain is realized on the CAPPABLE variables and on the
          delegation structure, not on the headline yes/no.
      - transform: observable_fiber
        proposed_object: >-
          Hold the class signature fixed and vary the underlying deployment, to exhibit the
          fiber and show what the signature forgets.
        predicted_gain: >-
          A named limit on the census's resolution, reported as part of the deliverable.
    quantifier_order: >-
      The published figure is quoted as 'FrodoKEM-640 has 149.8 bits of security'. Written out,
      a category claim should read: FORALL adversaries A with resources (t, q_G, q_H, q_D) in a
      stated region, FORALL deployments with (user count, per-key ciphertext count) in a stated
      region, EXISTS a reduction B such that Adv(A) <= f(...). The audit question is whether the
      published figure instead instantiates EXISTS over the resource and deployment variables -
      i.e. whether the analyst's chosen point was universally quantified in the text and
      existentially quantified in the arithmetic. This record does not assume the answer; it
      records which of the two the primary text states, and IDEA-20260816-9bec34's linter is the
      natural instrument. NOTE AFTER REPAIR: since 149.8 / 212.6 / 266.8 are cryptanalysis
      outputs rather than bound evaluations, the quantifier question must be asked of the
      paper's own IND-CCA figure, not of those three numbers.
    method_ceiling:
      strongest_certifiable_claim: >-
        'No document in the enumerated retrieval set states a numeric bound on variable X, and
        every delegation chain from those documents terminates without a value or in a clause
        binding a different symbol or modality.' That is the ceiling. The method can NEVER
        certify that X is unbounded in the world, that a large X is reachable, that any attacker
        exists, that FrodoKEM is insecure, or that any draft is defective. It also cannot
        certify that the enumerated retrieval set is complete - see H1.
      nearby_object_control: >-
        ML-KEM, where the same census has already been run and returned 'no specification states
        any numeric M greater than 1' while ML-KEM is nonetheless a FIPS standard in wide
        deployment. That is the nearby object on which the hoped-for reading - 'an unsourced
        variable means a real security problem' - demonstrably FAILS. Any run of this record
        that reads its own absences as a security consequence has been refuted in advance by its
        own control.
    proof_obligations:
      - claim: The transcribed bound's variable list is complete and each symbol is bound to its printed definition.
        responsibility: interface
      - claim: >-
          The paper's own IND-CCA (ROM) figure reproduces from the transcribed bound at the
          paper's own inputs.
        responsibility: baseline
      - claim: Each 'not stated' row is supported by named full-text search terms over a retrieved document.
        responsibility: correctness
      - claim: Acquisition failures are enumerated separately and never counted as absences.
        responsibility: scope
      - claim: The dominant term is identified correctly at each evaluation point in exact or interval arithmetic.
        responsibility: correctness
      - claim: >-
          Every metric whose value is forced by the taxonomy or the controls is labelled as
          forced, with its derivation recorded before the run.
        responsibility: strictness
    not_applicable_reason: null
