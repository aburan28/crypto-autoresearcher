      BY ANY IDEA-GENERATOR SESSION.
    results: >-
      Inside the repository: the eight existing RQ-FRODO-a2dbe2 proposals are the salt as a
      hash-input partition (32c366), the ROM-QROM gap as an integer exponent vector (583998),
      instrument certification with unstructured FrodoKEM as the free control (72e5e5), interval
      rather than point propagation (7b9457), the ledger of forgiven constants (8596af), a
      quantifier-order linter (9bec34), implicit versus explicit rejection as two functions
      (adf2a2), and the dominant-term label field over a five-dimensional grid (d270bc). Every
      one takes the bound's input values as SWEPT or SYMBOLIC. None asks where a value could
      come from, none cites a normative document, none contains a census. The nearest artifact
      in the program is GOAL-MLKEM-005's M census - a different scheme and exactly one variable;
      its structural finding (every static row bounds the key in TIME or by a rate-limiting
      SHOULD and never by a count, and the one delegation, draft-ietf-tls-hybrid-design-16
      Sec. 2, terminates at FIPS 203, which states none) is the precedent this record
      generalizes.
      Outside the repository, and MATERIALLY EXTENDED AT REPAIR: FrodoKEM's deployment surface
      is real and newer than the corpus knows. A LAMPS X.509 algorithm-identifier draft exists
      (draft-smyslov-lamps-frodokem-certificates-01, 6 July 2026, individual submission) whose
      fetched rendering states no limit on decapsulations per certified key and defers
      FrodoKEM-specific security considerations to
      draft-longa-cfrg-frodokem-security-considerations. THAT DELEGATION WAS FOLLOWED ONE HOP
      FURTHER THIS SESSION, and the result is the record's seeded first row: the
      security-considerations draft delegates in turn to [I-D.FrodoKEM] for the 2^8 clause, and
      the target document DOES state a number - but as a variant-SELECTION rule conditioned on
      an EXPECTED count ("Ephemeral FrodoKEM MUST be used for applications in which that same
      figure is expected to be smaller than 2^8", with standard FrodoKEM "recommended" at or
      above 2^8), whereas the citing document renders it as a usage PROHIBITION on the ACTUAL
      count ("ephemeral FrodoKEM must not be used in applications in which a single public key
      may produce 2^8 ciphertexts or more"). Same number, two documents, two normative shapes.
      That is a NEW KIND OF CENSUS ROW relative to the ML-KEM parent, where the delegation
      terminated in silence rather than in a differently-shaped clause.
    verdict: >-
      ADAPTATION, stated honestly. The METHOD is not new: it is GOAL-MLKEM-005's census method,
      and that provenance is declared rather than hidden. What is new relative to this
      repository is (i) applying it to FrodoKEM, whose deployment surface no record in the
      corpus has examined, (ii) applying it to a VARIABLE SET rather than to one variable, with
      a frozen six-way provenance taxonomy, (iii) the modality coordinate added at repair, which
      lets a delegation that terminates in a differently-shaped clause be recorded as something
      other than a hit or a miss, and (iv) the heterogeneity sub-claim restricted to CAPPABLE
      variables, which is what makes it two-sided. What is NOT claimed as new: that FO bounds
      carry a q_G-linear loss (recalled prior art), and the multi-target message-space issue at
      128-bit message spaces, which is PUBLISHED (Glabush-Hovelmanns-Stebila, CiC 3(1), 2026;
      preprint eprint 2025/343) and is cited rather than rediscovered.
      LABEL FORCED TO `unverified` BY RULE, NOT BY DOUBT: this record rests on citation(s) marked
      provenance `recalled`, and AGENTS.md rule 9 -- enforced by tools/validate_ledger.py
      check_citations -- requires novelty_status `unverified` until such a source is actually read.
      The crypto-kb retrieval index answers nothing this session (in-memory Qdrant), so no record in
      this batch may assert a checked literature negative. The substantive assessment above is
      unchanged.
  object_first_candidate:
    tracked_object: >-
      The provenance class of each free variable of the transcribed bound - a map from symbol to
      the KIND of authority that could fix its value, over the frozen six-element taxonomy
      P1..P6 - paired, for every clause that supplies a value, with that clause's deontic
      MODALITY and the symbol it actually binds. What is followed through the computation is not
      a number but the type of ceiling a number would have to come from, and the force with
      which it is imposed.
    lossiness: >-
      GENUINELY LOSSY, and the discard is the point. The projection keeps the symbol's
      binding-authority type and modality and discards its numeric value entirely: a variable
      capped at 2^8 by a normative MUST NOT and one capped at 2^64 by a normative MUST NOT map
      to the SAME object. It also discards the coefficient the variable carries in the bound.
      The discard is compatible with the target's operation - substitution into a monotone
      inequality - because the supremum of a monotone term over the reachable region is
      determined by the binding constraint's TYPE in exactly one respect that survives: classes
      P5 and P6 have no finite supremum from any document, so a monotone-increasing term
      containing a P5 or P6 variable has no document-sourced ceiling at all, whatever its
      coefficient. That is a deterministic propagation law on the retained part alone. The
      projection is NOT a change of coordinates: from the class alone one cannot reconstruct the
      value, and two bounds with identical class signatures can have bit-security figures
      differing by any amount.
    propagation: >-
      One step is: substitute one variable's class-supremum into the bound and ask which term
      dominates. The law: a P1/P2 variable contributes a finite sourced ceiling; a P3/P4
      variable contributes a ceiling only after a conversion (time to count) requiring a RATE no
      document supplies, so it propagates as 'unsourced with a named missing quantity'; a P5
      variable propagates as 'unsourced with a named terminating chain'; a P6 variable
      propagates as 'unsourced by construction, because the quantity is offline'. ADDED AT
      REPAIR, a fifth outcome the original law could not express: a variable whose delegation
      terminates in a clause that states a number under a DIFFERENT binder or modality
      propagates as 'sourced-but-divergent', carrying both readings forward. These five outcomes
      are distinguishable in the output and each is a different remedy.
    survival_score: >-
      Survives one full evaluation of the bound and dissolves at the second. The class
      determines the outcome only while every term is monotone increasing in the variable; the
      moment two variables of the same class enter with opposite monotonicity - which happens in
      FO bounds, where a larger message space helps and a larger query count hurts - the class
      stops determining anything and the numbers must be read. Reporting the exact term at which
      this happens is part of the deliverable, not a caveat.
  forced_value_derivation: >-
    ADDED AT REPAIR, per KN-TECH-1a5b7e obligation 4, and recorded BEFORE any run so that no
    forced value can later be reported as a finding.
    FORCED QUANTITY 1 - THE FORMER HEADLINE METRIC. 'Number of dominant-term free variables
    carrying class P5 or P6, per parameter set' is at least 1 at every parameter set, by
    derivation and not by measurement. Argument in three steps. (a) P6 is DEFINED in this
    record's own frozen taxonomy as 'bounded only by the adversary's own compute budget, i.e.
    offline and uncappable by any protocol clause', and NULL-3 declares that the offline
    hash-query count must return P6 and VOIDS the run if a numeric bound is returned for it - so
    the taxonomy and the control jointly guarantee that any oracle-query count present in a term
    is classified P6. (b) Every bound in the FO family has a dominant term carrying an
    oracle-query count: the red-team screen reports FrodoKEM Eq. (3) carrying 6*q_RO/|M|,
    q_RO*delta(n_u) and q_RO/|M|, and Glabush-Hovelmanns-Stebila Theorem 1 carrying q_H/|M| and
    (q_H+q_D)*delta(n_u). (c) Therefore the count is at least 1 before any document is opened.
    CONSEQUENCE: the original prediction that this count is at least 1, and the original
    falsification condition that every dominant-term variable classifies P1 or P2, describe an
    outcome the record's own control declares impossible. The prediction is demoted to a
    reported quantity with its forced value stated, and the falsification condition is deleted
    and replaced. This record's own honest_prior already priced it at 0.9 and called it 'close
    to structural', which is a warning that was not acted on.
    FORCED QUANTITY 2 - THE HETEROGENEITY METRIC AS ORIGINALLY WRITTEN. 'At least 2 distinct
    provenance classes among the variables of a single dominant term' is also very nearly
    forced, because a term of the shape (constant * q_RO / |M|) already contains a P6 query
    count and a P1 spec-fixed length. The metric is therefore RESTATED to count distinct classes
    among the variables that are NEITHER P1 NOR P6, where zero is a real and reachable outcome.
    ESTABLISHED DATUM, NOT A PREDICTION - THE SEEDED FIRST CENSUS ROW. This agent read, on
    2026-08-24, draft-longa-cfrg-frodokem-security-considerations-00 Section 1.1 ("As stated in
    [I-D.FrodoKEM], ephemeral FrodoKEM must not be used in applications in which a single public
    key may produce 2^8 ciphertexts or more") and draft-longa-cfrg-frodokem-01 ("the use of
    standard FrodoKEM is recommended for applications in which the number of ciphertexts
    produced for a single public key is expected to be equal or greater than 2^8. Ephemeral
    FrodoKEM MUST be used for applications in which that same figure is expected to be smaller
    than 2^8."). The first row of the normative-force-disagreement table is therefore ALREADY
    ESTABLISHED and is entered as a seed with its provenance, so that the census cannot claim
    credit for rediscovering it. What is open is whether the enumerated closure contains any
    further such pairs, and how each reading classifies under the frozen taxonomy.
  null_object_control: >-
    FOUR controls, all of which CAN FAIL, run before any 'not stated' row is admissible.
    NULL-1, POSITIVE CONTROL ON A KNOWN-STATED BOUND, TIGHTENED AT REPAIR. The census procedure
    is run against a variable whose numeric bound this program has already retrieved verbatim -
    the per-public-key ciphertext count at 2^8. The procedure MUST return class P2 with the
    value 2^8 AND, separately for each of the two documents, the citing clause, its deontic
    modality and the symbol it binds. If it returns 'not stated', the instrument under-reports
    and no absence it reports means anything. IF IT RETURNS A SINGLE MERGED ROW FOR THE TWO
    DOCUMENTS, it cannot see the modality coordinate and the C3 metric is void - this is the
    failure mode the original single-document version of NULL-1 could not detect.
    NULL-2, POSITIVE CONTROL ON A SPEC-FIXED CONSTANT: a length parameter (len_mu or len_salt)
    must come back P1 with the value from the specification, not P5. A procedure that cannot
    distinguish 'the specification fixes this' from 'nobody bounds this' is measuring its own
    retrieval failures. Note that len_salt is a good choice because it takes the value 0 for the
    ephemeral parameter sets, so a procedure that treats 0 as missing fails here.
    NULL-3, NEGATIVE CONTROL, A VARIABLE THAT MUST COME BACK UNSOURCED: the number of offline
    hash evaluations q_G. No protocol clause can cap an offline computation, so the correct
    answer is P6. If the procedure returns a numeric bound for q_G, it has mistaken a modelling
    convention (an analyst's chosen 2^64 or 2^128) for a sourced deployment quantity, which is
    the error the whole record exists to detect, and the run is void. DECLARED LIMITATION, ADDED
    AT REPAIR: because this control forces q_G to P6, it also forces the demoted metric of
    claim (B) - see forced_value_derivation - and therefore cannot be cited as evidence for it.
    NULL-4, ADDED AT REPAIR, THE MODALITY-INVARIANCE CONTROL: restate one retrieved clause with
    its RFC-2119 keyword changed and nothing else, and require the procedure to return the SAME
    class and value and a DIFFERENT modality. If the class moves, modality is leaking into the
    classification; if the modality does not move, the instrument cannot see the coordinate the
    C3 metric is built on.
    SPREAD CHECK, per KN-TECH-1a5b7e: the controls span at least three distinct classes, so the
    classification's output is not constant across its own control set; if all controls return
    the same class the taxonomy is decorative.
  discriminated_from:
    - >-
      IDEA-20260816-d270bc records WHICH additive term is largest over a five-dimensional grid
      and asks whether the dominance partition has the cell structure a correct transcription
      must have. It is a self-consistency check on the transcription and never leaves the grid.
      This record asks which cells of that grid a deployment can occupy and answers with
      documents, not arithmetic. The two compose - d270bc supplies the dominance map this
      record's STAGE 5 reads - and neither substitutes for the other.
    - >-
      IDEA-20260816-7b9457 propagates an uncertainty INTERVAL on the correctness error through
      the bound in certified interval arithmetic. Its object is numerical uncertainty in one
      value; this record's object is the absence of any value, which is not an interval and
      cannot be represented as one. An unsourced P6 variable has no interval.
    - >-
      IDEA-20260816-72e5e5 certifies the evaluation pipeline as an instrument by feeding it
      matched and mismatched schemes. That is a control on the arithmetic; this is a control on
      the inputs. A pipeline can be perfectly certified and still be evaluated at a query count
      nobody can justify.
    - >-
      IDEA-20260816-32c366 simulates multi-target hash search at toy digest widths to measure a
      target-hit growth exponent, and explicitly makes no statement about reachability or about
      FrodoKEM's salt. This record supplies exactly the reachability documentation 32c366
      disclaims, and does it documentarily rather than by simulation.
    - >-
      GOAL-MLKEM-005's census (internal, BATCH-a51f91, TASK-20260805-e6a153) is the acknowledged
      parent. It is one variable, one scheme, and deliberately reports no bit figure and no
      derived quantity. This record is a different scheme, a variable SET, a frozen provenance
      taxonomy plus a modality coordinate, and it does evaluate the bound at the sourced points -
      the step that turns a census into a verdict and makes the claim-tier split load-bearing.
    - >-
      IDEA-20260821-c2242b (same batch) audits the BINDER SCOPE of the stated restriction and,
      after its own repair, carries the SAME two clauses this record seeds its C3 table with.
      THE OVERLAP IS NOW REAL AND IS DECLARED: this record classifies the clauses (does a number
      exist, under what authority, with what modality); c2242b composes them against the bound
      and emits the residual. They must be executed as one task or explicitly sequenced, and the
      coordinator should treat them as coupled rather than independent. c2242b is well-defined
      only for variables this record classifies P2 or sourced-but-divergent.
  citations:
    - ref: 'https://datatracker.ietf.org/doc/html/draft-longa-cfrg-frodokem-security-considerations/ (draft-longa-cfrg-frodokem-security-considerations-00)'
      provenance: retrieved
      claim: >-
        Fetched and read 2026-08-21, re-fetched and re-read 2026-08-24. Verbatim, Section 5.2:
        "The results for the "beyond-core-SVP" methodology showed security estimates of 149.8
        bits for (e)FrodoKEM-640, 212.6 bits for (e)FrodoKEM-976 and 266.8 bits for
        (e)FrodoKEM-1344, which support the security level claims for the FrodoKEM parameter
        sets." THIS IS THE SENTENCE THAT REPAIRS THE INHERITED GATE: the three figures are
        attributed to a lattice-cryptanalysis methodology, not to any FO/SFO reduction bound.
        Verbatim, Section 1.1: "As stated in [I-D.FrodoKEM], ephemeral FrodoKEM must not be used
        in applications in which a single public key may produce 2^8 ciphertexts or more" - a
        delegation whose target is the next citation. Verbatim, Section 5.2: "A similar
        (non-tight) proof is given in the QROM." The document states no explicit inequality and
        no concrete oracle-query bound.
      verified_by: idea-generator@2026-08-24
