  minimal_test:
    design: >-
      SCOPE-REDUCED FIRST PASS, executable without waiting for the ISO amendment. Take the
      variable list from the GOAL-FRODO-002 BATCH-001 transcription. Freeze the six-way taxonomy
      and the modality field. WRITE THE forced_value_derivation OUT FIRST, before any document
      is opened, so the demoted metric's value can never be reported as a discovery. Classify
      every variable using ONLY the documents this program has already reached (the CiC/ePrint
      FrodoKEM paper, draft-longa-cfrg-frodokem-01,
      draft-longa-cfrg-frodokem-security-considerations-00,
      draft-smyslov-lamps-frodokem-certificates-01), plus the FrodoKEM standard proposal PDF.
      Run NULL-1 to NULL-4 first and abort if any fails. Then evaluate the bound at the paper's
      own inputs (repaired gating reproduction of the paper's own IND-CCA (ROM) figure) and at
      the sourced supremum of every P2 variable, in exact or interval arithmetic. Report the six
      metrics above plus the acquisition-failure table, each labelled forced or open. THIS
      DISCRIMINATES on the three promoted metrics, each of which can come out zero: C1 is zero
      if every delegation terminates in a value - and the one chain already followed does
      exactly that; C2 is zero if the dominant term contains only spec-fixed lengths and offline
      query counts; C3's additional-row count is zero if the seeded pair is the only one. It
      does NOT discriminate on the demoted metric, and the design says so rather than presenting
      it as the test. Budget: retrieval and reading dominate; arithmetic is seconds. Estimated
      4-8 hours of agent time, no meaningful compute.
    controls:
      - >-
        NULL-1 positive control on the 2^8 clause, run separately against BOTH documents that
        state it; must return P2 with the value, the citing clause, the modality and the bound
        symbol for each, and must not merge them into one row.
      - NULL-2 positive control on a spec-fixed length parameter; must return P1, not P5.
      - >-
        NULL-3 negative control on q_G; must return P6, and a numeric answer voids the run.
        Declared limitation: this control forces the demoted metric and cannot be cited for it.
      - >-
        NULL-4 modality-invariance control; class and value unchanged, modality changed.
      - >-
        Repaired gating baseline reproduction of the paper's OWN IND-CCA (ROM) figure before any
        sourced evaluation point is reported, with 149.8 / 212.6 / 266.8 entering only as given
        cryptanalysis inputs.
      - >-
        Mutation control inherited from the goal: perturb one exponent of the transcribed bound
        and confirm the evaluation registers it.
      - >-
        Acquisition-failure table maintained separately, with the CNSA-2.0 precedent named in
        the artifact so a later reader cannot read MISSING as EMPTY.
    required_metrics:
      - >-
        per-variable provenance class with the citing clause, its modality, or the named
        absence-establishing search terms
      - dominant-term provenance signature per parameter set and per evaluation point
      - count of P5/P6 variables in the dominant term, LABELLED FORCED with its derivation
      - count of non-P1 non-P6 classes in the dominant term
      - delegation chains with full path and terminating document, and how each terminates
      - normative-force disagreement table, with the seeded row marked as seeded
      - baseline reproduction outcome for the paper's own IND-CCA figure, with residual
      - acquisition-failure table (source, URL, HTTP status, attempts, timestamp)
