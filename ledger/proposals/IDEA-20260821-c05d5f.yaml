idea:
  id: IDEA-20260821-c05d5f
  question_id: RQ-FRODO-a2dbe2
  added: '2026-08-21'
  title: >-
    Every free variable in the FrodoKEM IND-CCA bound has a PROVENANCE CLASS, and only some of
    them are deployment quantities: classify each symbol by the kind of authority that could fix
    its value (spec-fixed constant, normatively bounded by count, bounded only in time, bounded
    only by a rate-limiting SHOULD, delegated to a document that states nothing, or bounded only
    by the adversary's own compute budget), source each class against FrodoKEM's actual
    standardization surface, and report - AFTER REPAIR, as the headline - the delegation chains
    that terminate without a value, the class heterogeneity among the CAPPABLE variables of a
    single dominant term, and the pairs of documents that state the same number with different
    normative force.
  class: measurement
  claim: >-
    (A) THE OBJECT. GOAL-FRODO-002 plans to sweep query count, user count, ciphertext count and
    failure rate over a grid. A sweep produces a table; a verdict needs to know which cells of
    that grid a deployment can actually occupy, and that is a documentary question about where a
    number for each symbol could come from. The tracked object is therefore not the value of a
    variable but its PROVENANCE CLASS: the kind of authority that fixes it.
    (B) DEMOTED AT REPAIR, AND ITS VALUE DECLARED FORCED IN ADVANCE. The original headline claim
    was that at least one variable in the dominant additive term is bounded by no retrieved
    normative document. That claim cannot come out negative and is therefore not a
    discriminator: class P6 is DEFINED in this record's own frozen taxonomy as 'bounded only by
    the adversary's own compute budget, i.e. offline and uncappable by any protocol clause',
    NULL-3 requires the offline hash-query count q_G to return P6 and VOIDS the run if a numeric
    bound is returned for it, and every FO-family bound's dominant term carries an oracle-query
    count. The value is entailed before any document is read. It is retained as a REPORTED
    QUANTITY with its forced value derived in advance (see forced_value_derivation), and it is
    removed from the headline.
    (C) THE REPLACEMENT HEADLINE, THREE GENUINELY TWO-SIDED QUANTITIES. (C1) DELEGATION: the
    number of delegation chains from the FrodoKEM standardization surface that terminate in a
    document stating no number for the variable delegated. This can be zero - and one chain this
    agent followed on 2026-08-24 terminates WITH a value, which is exactly why the count is not
    forced: draft-longa-cfrg-frodokem-security-considerations-00 says "As stated in
    [I-D.FrodoKEM], ephemeral FrodoKEM must not be used in applications in which a single public
    key may produce 2^8 ciphertexts or more", and draft-longa-cfrg-frodokem-01 does state a
    number. (C2) HETEROGENEITY AMONG CAPPABLE VARIABLES: the number of distinct provenance
    classes among the variables of a single dominant term AFTER EXCLUDING the two classes whose
    presence is structural - P1 spec-fixed lengths and P6 offline query counts. A dominant term
    of the form (constant * q_RO / |M|) contains only excluded classes and returns zero, which
    is the clean negative; a term additionally consuming a per-key ciphertext count (P2), a user
    count, or a certificate lifetime (P3) returns two or more. (C3) NORMATIVE-FORCE
    DISAGREEMENT: the number of pairs of retrieved documents that state the SAME number for the
    same symbol with different deontic modality or different binder. One such pair is already
    established by this agent's own reading and is recorded as a SEED, not as a prediction (see
    below); whether the closure contains others is open.
    (D) THE STRUCTURAL SUB-CLAIM, RETAINED AND RE-SCOPED. The variables of an FO-style bound do
    not all have the same kind of ceiling. Hash-oracle query counts (q_G, q_H) are offline: the
    adversary computes hashes on its own hardware and no protocol clause can cap them, so their
    ceiling is a modelling choice, not a deployment fact. Decapsulation-query counts (q_D), user
    counts and per-key ciphertext counts are online quantities a protocol CAN cap. THE PART THAT
    REMAINS OPEN after the demotion in (B) is not whether both kinds appear - they do - but
    whether the CAPPABLE ones appear in the dominant term at all, and if so whether the
    documents that cap them agree with each other.
    (E) WHAT IS NOT CLAIMED. No attack, no break, no statement that FrodoKEM is insecure, no
    re-estimation of LWE hardness, and no assertion that any published failure rate is right or
    wrong. An absence of a stated bound is an ABSENCE, not a ceiling and not a permission: it is
    symmetric, exactly as GOAL-MLKEM-005's census recorded, and reading it as either is the
    specific error this record is written to prevent. A disagreement between two drafts is a
    documentary observation about two drafts at stated revisions, not a defect claim.
  mechanism: >-
    STAGE 0 (GATE, inherited and REPAIRED): this record consumes the transcription that
    GOAL-FRODO-002 BATCH-001 is chartered to produce. Until the bound exists as an explicit
    inequality with every symbol bound to a definition, the variable list is unknown and the
    census has nothing to classify. This record does not perform the transcription and must not
    be run ahead of it. The inherited numeric gate is repaired in this revision; see
    baseline_embedding. STAGE 1: enumerate the free variables of the transcribed bound,
    verbatim, with the symbol, its definition as printed, and the quantifier it sits under.
    STAGE 2: assign each variable a provenance class from a fixed, pre-declared six-way
    taxonomy: P1 spec-fixed constant (len_mu, len_sec, len_salt, len_seedSE); P2 normatively
    bounded by a COUNT in a retrieved document; P3 bounded only in TIME (certificate validity,
    cryptoperiod, rotation recommendation); P4 bounded only by a rate-limiting SHOULD;
    P5 delegated to another document that states no number (a terminating delegation chain);
    P6 bounded only by the adversary's own compute budget, i.e. offline and uncappable by any
    protocol clause. The taxonomy is frozen before retrieval so the classification cannot be
    tuned to the answer. RECORD ALSO, ADDED AT REPAIR, the deontic modality of every clause that
    supplies a P2 value (MUST, MUST NOT, RECOMMENDED, informative) and the symbol it binds, so
    that two documents supplying the same number can be compared rather than merged. STAGE 3:
    source each P2-P5 candidate against the FrodoKEM standardization surface in a declared
    preference order - the FrodoKEM standard proposal and the CiC/ePrint paper,
    draft-longa-cfrg-frodokem, draft-longa-cfrg-frodokem-security-considerations,
    draft-smyslov-lamps-frodokem-certificates, the ISO/IEC 18033-2 amendment, and any governing
    NIST or IETF clause a FrodoKEM deployment would inherit - recording for every 'not stated'
    the exact full-text search terms used to establish the absence, so the absence is checkable
    rather than asserted. STAGE 4: separate ACQUISITION FAILURES from STATED ABSENCES in their
    own table with HTTP status and attempt count. This is not bookkeeping pedantry:
    GOAL-MLKEM-005's census lost CNSA 2.0 to a 403 and recorded it as MISSING rather than empty,
    and a paywalled ISO amendment is the obvious repeat. STAGE 5: evaluate the transcribed bound
    at the sourced supremum of every P1/P2 variable and at a declared ladder for every P3-P6
    variable, and record WHICH TERM DOMINATES at each point and which provenance classes its
    variables carry. STAGE 6: report the three headline quantities of claim (C) - delegation
    chains terminating without a value, heterogeneity among cappable variables, and
    normative-force disagreements - together with the demoted and pre-declared P5/P6 count, each
    labelled with whether its value was forced in advance.
  novelty_status: unverified
  novelty_screen:
    method: >-
      ORIGINAL SCREEN (2026-08-21). THE crypto-kb MCP RETRIEVAL INDEX WAS UNAVAILABLE
      (in-memory Qdrant; it answers nothing and says so only in its startup log), so no `kb`
      provenance appears anywhere in this record. Retrieval instrument was (i) the Grep tool
      (ripgrep) over the repository, (ii) the pre-extracted lane inventory, (iii)
      WebSearch/WebFetch. Actual searches, with returned counts:
      Grep 'FrodoKEM|Frodo-640|eFrodoKEM' in knowledge/ -> 7 files (sources.json, SOURCES.md,
      KN-LIT-be0bfd, KN-LIT-3859, KN-LIT-2541, KN-LIT-2088, gathers/GATHER-20260807.md);
      Grep 'eFrodoKEM|ephemeral variant' over the repo root -> 2 files, BOTH the lane's own RQ
      and GOAL records, i.e. NO proposal in the repository mentions eFrodoKEM;
      Grep 'query budget|query count|q_H|hash quer' in ledger/proposals/ -> 74 files (too broad
      to discriminate; recorded as non-discriminating, not as evidence);
      Grep 'message space|message-space|seed space|vacuous|vacuity' in ledger/proposals/ -> 193
      files, dominated by the ordinary word 'message' (non-discriminating);
      Grep 'RFC 8446|KEMTLS|IKEv2|rekey|deployment census|record limit|session ticket' over the
      repo -> 51 files, of which the load-bearing one is
      coordination/goals/GOAL-MLKEM-005/batches/BATCH-a51f91/tasks/TASK-20260805-e6a153/census.md;
      Grep 'multi-target|multi-user|multi-ciphertext' in ledger/proposals/ -> 434 occurrences in
      122 files; Grep 'Glabush|Hovelmanns|Stebila|salted Fujisaki|SFO transform' over the repo ->
      42 files, none a KN-LIT entry for the multi-target KEM paper.
      READ IN FULL: the lane inventory, ledger/questions/RQ-FRODO-a2dbe2.yaml,
      ledger/goals/GOAL-FRODO-002.yaml, the GOAL-MLKEM-005 census.md (114 lines),
      IDEA-20260816-b336a3.yaml, the first 70 lines of IDEA-20260816-32c366.yaml,
      docs/inventor-protocol.md, docs/target-result-profile.md,
      knowledge/techniques/KN-TECH-1a5b7e.md.
      WebFetch (opened and read 2026-08-21): https://eprint.iacr.org/2025/1861 (abstract page);
      https://datatracker.ietf.org/doc/html/draft-longa-cfrg-frodokem-security-considerations/;
      https://cic.iacr.org/p/3/1/20; https://datatracker.ietf.org/doc/draft-smyslov-lamps-frodokem-certificates/.
      ACQUISITION FAILURES then recorded: https://eprint.iacr.org/2025/1861.pdf and the
      Glabush-Hovelmanns-Stebila preprint PDF both returned unreadable compressed-stream
      extractions.
      REPAIR-SESSION SCREEN (2026-08-24), by the repairing idea-generator, and the source of
      this record's seeded census row. WebFetch of
      https://datatracker.ietf.org/doc/html/draft-longa-cfrg-frodokem-security-considerations/
      SUCCEEDED again and returned verbatim both the 2^8 prohibition with its delegation to
      [I-D.FrodoKEM] and the sentence attributing 149.8 / 212.6 / 266.8 to the 'beyond-core-SVP'
      methodology. WebFetch of https://datatracker.ietf.org/doc/html/draft-longa-cfrg-frodokem-01
      SUCCEEDED and returned the corresponding clause in the delegation TARGET, which states a
