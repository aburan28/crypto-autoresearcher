idea:
  id: IDEA-20261017-9cf4b9
  title: Valid 63-bit solver and matched coset-formulation feasibility gate
  class: tooling
  question_id: RQ-ICPERF-94c86e
  area: ICPERF
  goal_ids:
  - GOAL-ICPERF-e6b6a4
  status: proposed
  proposed_by: idea-generator
  added: '2026-10-17'
  claim: A validated 63-bit GF(p) backend can accept the frozen three-arm B=475 m=2..8 S3 grid, pass independent
    arithmetic and planted-root controls, retain bounded outcomes and certify any full-point result. This
    enables later matched cost study; no solver or complete-cost gain is measured.
  mechanism: Use x in c*mu_896 as an implicit high-degree base predicate; eleven multiplication gates
    per x give its quadratic lift. Chained S3 addition is Class I partial-action. Of 896 field roots,
    475 are curve-point x values; exact point checking restores signs and filters the other 421. This
    known coset/Semaev combination needs charged base search, solver and filtering at 63-bit width.
  novelty_status: adaptation
  citations:
  - ref: KR-IC-5a43e5
    provenance: internal
    claim: Summation-polynomial decomposition and chained S3 are established.
    verified_by: idea-generator
  - ref: KN-OPEN-020
    provenance: internal
    claim: The scoped bounded-degree obstruction leaves high-degree implicit bases open.
    verified_by: idea-generator
  - ref: KR-IC-5931ee
    provenance: internal
    claim: Naive prime-field Semaev IC has a known generic-cost obstruction.
    verified_by: idea-generator
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
    - KR-IC-5a43e5
    - KR-IC-5931ee
    - KR-IC-0d2021
    - KR-IC-f3da82
    - KR-IC-73db3f
    nearest:
    - ref: KR-IC-5a43e5
      provenance: internal
      relation: special_case
      delta: One matched 63-bit field, B=475, m=2..8 frozen grid; zero observed solver or full-cost gain.
    searched:
      frontier_review: 25 live index-calculus rows checked at e2263064.
      proposal_index: Ledger index checked; earlier coset IDEA-20260808-9ef88c is distinct.
  assumptions:
  - The 16-seed coset scan, controls and public targets are frozen.
  - Seven common targets are public group-point checks, not planted decompositions.
  - Only 475 of 896 coset roots lift; signs and false roots need exact filtering.
  - m=8 needs S9 or chained S3; the current msolve width guard cannot simply be raised.
  proof_search_map:
    bottleneck: A valid wide-field solver is needed before sparse input can be interpreted as speed.
    baseline_embedding:
      parameter_slice: Same p,r,B=475 and target for coset, random and small-x, m=2..8.
      reproduction_check: Check 21 archived systems in Sage and a <=32-bit complete-engine regression.
    observation_collision:
      observable: Input support of 118 terms at m=8.
      distinct_preimage_search: Test whether false roots and lift variables erase sparse-input savings.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: Degree-896 binomial and quadratic gate lift.
      predicted_gain: A validated 63-bit solver/certificate interface.
    quantifier_order: Freeze bases, backend, target schedule and caps before all arms; no target-conditioned
      choice.
    method_ceiling:
      strongest_certifiable_claim: Backend correctness and bounded solve/certificate feasibility.
      nearby_object_control: Equal-size random and small-x bases plus separately planted positive sums.
    proof_obligations:
    - claim: Exact 63-bit GF(p) and polynomial arithmetic.
      responsibility: correctness
    - claim: Every root lifts to signed curve points summing to target.
      responsibility: interface
    - claim: Price 16 seeds and false roots; full rank/LA/target are later.
      responsibility: runtime
    not_applicable_reason: null
  predictions:
  - metric: wide_backend_arithmetic_and_regressions
    direction: higher
    minimum_effect: All field identities, small-cell regressions, planted-root and altered-root checks
      pass without changing msolve guards.
  - metric: planted_m2_solver_certificate
    direction: higher
    minimum_effect: One separate positive m=2 input per arm returns a full-point certificate inside the
      cap; m=8 positives are separate.
  - metric: matched_arity_grid_solver_outcomes
    direction: different
    minimum_effect: All 21 archived inputs attempted at identical limits with outcome/censoring receipts;
      no speed inference from one target per arity.
  minimal_test:
    design: 'Freeze a genuinely 63-bit-capable backend hash, independent Sage arithmetic vectors, <=32-bit
      regression, options and raw paths. Per call cap: 300 s and 8 GiB RSS; quiet-host total: four hours.
      Check field operations, S3 and altered roots first. Archived seven public group targets are input
      checks, not planted decompositions. Build one positive m=2 sum within each of three bases and separate
      m=8 positives; require exact solver/point certificates. Attempt all 21 archived systems at equal
      caps (27 calls total), retaining false roots, timeouts and memory stops. A later powered panel is
      needed for a speed ratio.'
    controls:
    - 475-point random base
    - 475-point small-x base
    - three separately planted m=2 sums
    - three labelled m=8 positives
    - altered-root checks
    - <=32-bit engine regression
    - independent Sage replay
    required_metrics:
    - wide-arithmetic correctness
    - solver operations and CPU
    - peak RSS
    - auditable solving degree if exposed
    - Macaulay dimensions/bytes if available
    - root/timeout/memory classification
    - full-point certificate status
    - false-root count
    - cold setup cost
  falsification_conditions:
  - An arithmetic mismatch or false-root acceptance fails the valid-wide-backend interface.
  - A planted m=2 positive not solved within the cap fails bounded feasibility for this route; its point
    identity remains true.
  - Unknown or timed-out original systems are censored, not evidence of absent decompositions.
  confounders:
  - 16-seed search
  - 421 false roots
  - input degree and variable count
  - monomial order
  - one target per arity
  - support-to-solving-degree gap
  - fixed-B lower-arity coverage ceiling
  - setup reuse
  - memory cap
  interpretation_limits:
  - One prime curve, B=475 and one public target per m; no speed ratio.
  - False roots, full IC phases and matched rho remain open.
  heuristic_assumptions:
  - id: H1
    statement: Fixed-base m-sums occupy uniform subgroup targets approximately as random draws after collision
      accounting.
    rigorous_support: C(2B+m-1,m) bounds distinct targets; no uniformity theorem.
    validation_plan: Enumerate smaller prime cells; compare occupancy/tails to random-map and cyclic-group
      controls; state 63-bit transfer assumptions.
  target_complexity:
    time_exponent: 'Conditional cold cost: C_FB + B*C_dec/(q_rel*rho_rank) + C_LA + C_target_attempt/q_target
      + C_verify. If B=r^beta, q_rel~B^m/r in a validated sparse regime, C_dec=r^gamma and rho_rank=r^-delta,
      the relation exponent is 1-(m-1)*beta+gamma+delta; the full exponent also includes setup, LA and
      target. No exponent is measured.'
    memory_exponent: Conditional peak max{base, solver, LA, target table}; all r exponents unmeasured.
    best_known: Matched generic rho has r^0.5 group-operation scaling; complete prime IC rows reach only
      32 bits and m<=7 in this engine.
    hidden_overhead: No o(1) suppression; wide arithmetic, all seed scans, false roots, failed calls,
      certificates, rank, LA and target work are explicit.
    tradeoff_note: Cold single-target charges full 16-seed setup; only a separately labelled T-target
      reuse case charges C_FB/T with stated T.
  estimated_cost:
    implementation: high
    compute: high
  recommended_priority: medium
  dominated_by: No attack result; 25 frontier rows checked.
  sota_delta: Zero verified whole-cost gain. At m=8 direct input has 118 coset terms versus 3910/3902
    controls; the 103-variable lift has 294 terms. These are input counts.
