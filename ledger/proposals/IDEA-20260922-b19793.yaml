      in the permutation module (limb B) and, separately, the value of e =
      ord_n(ell) (limb C). Limb (A) is unconditional; limbs (B) and (C) are
      where the record's actual content lives, and both are stated as
      measurable, falsifiable quantities rather than assumed.
    baseline_embedding:
