        "Block Wiedemann/Lanczos on a Frobenius-structured ECDLP relation
        matrix costs X field operations."
      distinct_preimage_search: >-
        COLLISION EXHIBITED. The same measured X is produced by at least three
        distinct states of the world: (i) genuine structure exploited, e small,
        rank confirmed full -- X reflects a real n/e^{kappa-1}-fold saving;
        (ii) structure present but e close to n-1 -- X is indistinguishable
        from the generic baseline even though the module decomposition is
        mathematically real; (iii) the tau-orbit relations are NOT full rank
        (limb B fails) -- X reflects a LARGER B'/R_need than 77bf31 assumed,
        which could coincidentally resemble a "speedup" if compared against
        the wrong baseline. The identifying triple is (measured e, measured
        tau-orbit rank fraction, measured X versus the two baselines at both
        readings of B'), and this record proposes every LA cell in the
        reachability table carry it.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the measured LA cost fixed and vary (e, rank fraction),
          exhibiting the three-way collision above.
        predicted_gain: >-
          Prevents a measured speedup (or its absence) from being misattributed
          to the wrong one of the two independent mechanisms (block structure,
          rank collapse). NO ATTACK EXPONENT IS MOVED.
      - transform: specialization_pack
        proposed_object: >-
          The relation matrix specialised to the equivariant basis for a swept
          range of synthetic e (1, 2, ..., n-1, imposed on a toy matrix by
          construction rather than by the accident of a real ell), isolating
          the block-structure effect from whatever e a real toy curve happens
          to have.
        predicted_gain: >-
          Separates "does the mechanism work when e is favourable" from "is e
          favourable here," which the real-ell-only measurement cannot do
          alone at a handful of toy primes.
    quantifier_order: >-
      CLAIMED, UNCONDITIONAL (limb A). FOR ALL n prime and FOR ALL nontrivial
      tau-stable V of dimension >= 2, tau acts on V with orbit size exactly n
      off at most one fixed point. Two-line proof given.
      CLAIMED, HEURISTIC (limb B). FOR "generic" decompositions (support not
      contained in a proper Z/n-invariant subspace), the n tau-images of a
      relation are linearly independent. NOT proved for every instance;
      measured on toy cells with an exhaustive check where feasible (n <= 23).
      CLAIMED, CONDITIONAL ON e (limb C). FOR ALL (n, ell) with e = ord_n(ell),
      block Wiedemann/Lanczos in the equivariant basis costs a factor
      n/e^{kappa-1} less than the generic baseline on the SAME matrix, subject
      to the swept kappa convention. NOT CLAIMED: any value of e for any named
      deployed curve -- every such row is emitted OPEN. NOT CLAIMED: any
      exponent against rho.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For a specific (n, ell) pair with n prime, gcd(ell,n)=1, e = ord_n(ell)
        computed directly, and a measured tau-orbit rank fraction, the
        equivariant block Wiedemann/Lanczos cost on the toy relation matrix
        equals the formula in limb (C) within the declared kappa range." It can
        NEVER certify a deployed row's e without reading that row's published
        ell from a primary source, or certify that the "generic support"
        heuristic holds beyond the sampled instances.
      nearby_object_control: >-
        THE NULL-CURVE CONTROL IS THE ORDINARY BINARY CURVE (B-m against K-m,
        as RQ-BINSTD-b6f698 itself requires), where tau is not an
        endomorphism of E and no Frobenius-module structure exists on the
        GROUP at all -- the equivariant construction is UNDEFINED there by
        construction, and an instrument that produces a number on the null
        curve is measuring the field's Frobenius on x-coordinates only, not the
        curve, which is a legitimate but differently-scoped finding and must
        be labelled as such. SECOND CONTROL: a SHAPE-MATCHED RANDOM PERMUTATION
        replacing tau (a random order-n permutation of the same column set,
        not derived from any field automorphism) -- the group-ring
        factorisation argument in limb (C) is agnostic to WHICH order-n cyclic
        action is used, so this control's speedup should match limb (C)'s
        formula just as well as the real tau does; if it does NOT, something
        about the specific tau-action (not just its cyclic order) is doing the
        work, and the record's attribution to "Frobenius" specifically is
        wrong and must be corrected to "any order-n symmetry."
    proof_obligations:
      - claim: >-
          Limb (A)'s orbit-order theorem verified exhaustively on toy Koblitz
          cells n in {17, 19, 23} (full enumeration of V \ {0,1}) and by
          sampling 10^4 elements at n in {29, 31, 37, 41}.
        responsibility: correctness
      - claim: >-
          Limb (C)'s block-diagonalisation formula reproduces the e = n-1
          baseline slice symbolically, and matches a hand-computed small-n
          factorisation of x^n - 1 over the toy cell's actual F_ell.
        responsibility: baseline
      - claim: >-
          Measured equivariant-basis Wiedemann/Lanczos field-operation count on
          a real toy relation matrix matches the limb (C) formula within a
          declared tolerance, for at least one toy cell with e < n - 1.
        responsibility: runtime
      - claim: >-
          The shape-matched random-permutation control reproduces the same
          speedup formula as the real tau, isolating "cyclic order n" from
          "Frobenius specifically" as the active ingredient.
        responsibility: correctness
      - claim: >-
          Every deployed row's e is emitted as OPEN, never as a number, absent
          a primary-source ell.
        responsibility: scope

  predictions:
    - metric: >-
        tau-orbit size on V \ {0,1}, toy Koblitz cells, n prime in
        {17,19,23,29,31,37,41}
      direction: higher
      minimum_effect: >-
        FORCED EXACT n, with zero tolerance (per the theorem). Any measured
        orbit size other than n or 1 halts the run as an implementation
        defect, not a finding.
    - metric: >-
        rank fraction of the n tau-images of a single decomposition relation
        within their ambient (n or n-1)-dimensional orbit subspace, measured
        over F_ell on the toy relation matrices, versus the shape-matched
        random-support null (m columns chosen uniformly at random, not from a
        real decomposition)
      direction: higher
      minimum_effect: >-
        PREREGISTERED. Rank fraction >= 0.95 on real decompositions, matching
        the null within sampling noise, confirms the "generic support" limb
        (B) heuristic; a rank fraction materially below the null's (a gap
        exceeding 3 standard errors) means real decompositions are
        systematically LESS generic than random support of the same size --
        a genuine, specific, valuable negative refining 77bf31's R_need = B/g
        assumption downward.
    - metric: >-
        e = ord_n(ell) for each toy cell's actual subgroup order ell, computed
        directly (zero compute, exact integer arithmetic)
      direction: different
      minimum_effect: >-
        Reported exactly for every toy cell, no threshold -- this is arithmetic,
        not a statistical estimate, and every value is informative regardless
        of magnitude.
    - metric: >-
        measured equivariant-basis LA field-operation count divided by measured
        generic-basis LA field-operation count on the SAME real toy relation
        matrix, for cells with e < n - 1
      direction: lower
      minimum_effect: >-
        Must equal n/e^{kappa-1} within a factor 2, for the declared kappa. A
        ratio exceeding 3x the predicted value at ANY tested cell with e < n-1
        falsifies the block-diagonalisation cost model as stated and the
        engineering (not the math) is the suspect.
    - metric: >-
        shape-matched random-permutation control -- same speedup formula
        applied with a random order-n permutation replacing tau
      direction: different
      minimum_effect: >-
        FORCED MATCH within the same factor-2 band as the real-tau measurement.
        A mismatch localises the effect to "Frobenius specifically," which
        would itself be a noteworthy and unexplained finding requiring
        withdrawal of the group-ring attribution as stated.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, hard gate). Verify limb (A)'s theorem statement
      and limb (C)'s e = n-1 collapse symbolically; for one small n (17 or 19),
      hand-factor x^n - 1 over the toy cell's actual F_ell and confirm the
      block count/size matches the formula before touching any matrix.
      STAGE 1 (low compute, minutes). Build the toy tau-stable factor base V
      (ker g(tau) construction, IDEA-20260915-8fe0ef) on Koblitz cells n in
      {17,19,23,29,31,37,41}; enumerate/sample tau-orbits on V and confirm
      limb (A) exhaustively at n <= 23, by sampling above that.
      STAGE 2 (low compute, minutes to an hour). Reuse the toy end-to-end IC
      pipeline (whichever engine RQ-ICPERF-94c86e's boundary table and
      IDEA-20260922-2e2a58's Stage 2 already build or plan; this record adds
      no new decomposition engine) to collect real relations, apply the "free"
      tau-shifted orbit per relation (77bf31's construction), and measure the
      rank fraction of each orbit against the shape-matched random-support
      null, per the second prediction above.
      STAGE 3 (low compute, the shared LA engine from IDEA-20260922-2e2a58's
      Stage 2, reused not rebuilt). Run generic block Wiedemann/Lanczos on the
      real toy relation matrix as the baseline; separately, apply the
      equivariant change of basis (DFT-over-F_ell / number-theoretic transform
      with respect to the computed e) and run block Wiedemann/Lanczos on each
      resulting block; compare total field-operation counts. Repeat with the
      shape-matched random-permutation control in place of tau.
      STAGE 4 (zero compute). Emit the LA-column cells of the reachability
      table: measured e, measured rank fraction, measured speedup ratio versus
      both controls, for every toy cell; OPEN for every deployed row pending a
      primary-source ell.
      MEMORY DISCIPLINE. Largest object is a B' x B' sparse matrix at
      B' <= 2^14 plus its equivariant blocks; under 200 MB. No Groebner engine
      is built or reused; this is pure linear algebra over F_ell and F_{ell^e}.
    controls:
      - >-
        EXHAUSTIVE ORBIT CHECK (blocking): limb (A) verified exactly at n <= 23.
      - >-
        SHAPE-MATCHED RANDOM-SUPPORT NULL (blocking for the rank prediction):
        m columns chosen uniformly at random rather than from a real
        decomposition, same B', same orbit machinery.
      - >-
        SHAPE-MATCHED RANDOM-PERMUTATION CONTROL (blocking for the speedup
        prediction): a random order-n permutation of the columns, NOT derived
        from tau, run through the identical block-diagonalisation pipeline.
      - >-
        NULL-CURVE CONTROL: the ordinary binary curve of the same field, where
        the whole construction is undefined by construction, per
        RQ-BINSTD-b6f698's own null-object requirement.
      - >-
        BASELINE REPRODUCTION: the e = n-1 symbolic slice against the generic
        Wiedemann baseline.
      - >-
        PAIRED INSTANCE SET AND OPERATION-COUNT DISCIPLINE (IDEA-20260815-95fefb,
        IDEA-20260815-66496a): the generic and equivariant LA runs execute on
        the SAME matrix, field-operation counts reported alongside wall clock.
    required_metrics:
      - tau_orbit_size_per_cell
      - rank_fraction_real_versus_random_support_null
      - e_ord_n_ell_per_toy_cell
      - measured_speedup_ratio_versus_predicted_n_over_e_kappa_minus_1
      - speedup_ratio_under_random_permutation_control
      - field_operation_counts_generic_and_equivariant_basis
      - per_cell_LA_column_verdict_with_inputs

  falsification_conditions:
    - >-
      Any measured tau-orbit size on V \ {0,1} is neither 1 nor n. Limb (A)'s
      proof or its implementation is wrong; the record is withdrawn and the
      defect is the finding.
    - >-
      The rank fraction of real decomposition tau-orbits is materially below
      the shape-matched random-support null (a gap exceeding 3 standard
      errors). Limb (B) fails: real decompositions are systematically less
      generic than random support, R_need must be revised upward from 77bf31's
      B/g toward B, and this is reported back to 77bf31's assumption chain by
      ID, not silently absorbed.
    - >-
      The measured equivariant-basis speedup ratio at a cell with e < n-1
      exceeds 3x the predicted n/e^{kappa-1} in either direction. The cost
      model as stated is wrong even though the module theory is sound, and the
      engineering gap (not the mathematics) is named as the open question.
    - >-
      The shape-matched random-permutation control does NOT reproduce the same
      speedup as real tau. The effect is not general to "any order-n cyclic
      symmetry" and the record's attribution to Frobenius specifically must be
      withdrawn or narrowed.
    - >-
      Everything holds. Then the reachability table gains an LA column with, at
      every toy cell, a measured e, a confirmed rank fraction, and a priced,
      bounded speedup ratio against two independent controls -- and every
      deployed row is left explicitly OPEN pending its primary-source ell,
      named as the single next computation that would close it.

  confounders:
    - >-
      e MUST BE COMPUTED FROM THE ACTUAL ell OF EACH TESTED CELL, NOT ASSUMED.
      A toy cell's ell is a specific small prime with no reason to be
      "typical"; the seven toy cells in the design are not a random sample of
      e-values and the record does not claim they are -- the heuristic
      assumption about e's TYPICAL distribution (below) is tested separately
      by construction, not read off these seven cells alone.
    - >-
      KARATSUBA VERSUS SCHOOLBOOK EXTENSION-FIELD ARITHMETIC. kappa is an
      implementation choice, not a property of the mathematics; every reported
      speedup is labelled with its kappa, and a verdict that flips across the
      declared kappa range is reported as implementation-dependent.
    - >-
      SMALL-n DEGENERACY. At n <= 19 the (n-1)/e block count is small enough
      that block-level constant factors (setup cost per block) can dominate
      the asymptotic n/e^{kappa-1} prediction; the largest toy n (41) is the
      most informative cell and is reported explicitly, not averaged with the
      smaller ones.
    - >-
      THE RANK-FRACTION NULL MUST BE SUPPORT-SIZE MATCHED. A random support of
      a DIFFERENT size m' than the real decomposition's m is not a valid
      control; m is held fixed to the real decomposition's arity in the null.
    - >-
      MODEL-RELATIVITY. "Correct within a factor 2" and "n/e^{kappa-1}" are
      correct inside this accounting convention (one F_ell multiplication as
      the unit); a pipeline charging LA differently does not automatically
      inherit this record's numbers.

  interpretation_limits:
    - >-
      NO ATTACK IS PROPOSED AND NO EXPONENT AGAINST RHO IS MOVED. The
      deliverable is a resolved rank question (limb B) and a priced, bounded,
      curve-specific conditional speedup of the LA sub-phase only (limb C).
    - >-
      e IS NOT COMPUTED FOR ANY NAMED DEPLOYED CURVE THIS SESSION. Every such
      row is emitted OPEN with the missing quantity named (e = ord_n(ell) for
      the curve's actual published ell), consistent with the question's
      arithmetic-only-at-deployed-parameters constraint. Quoting a speedup
      number for any named curve from this record is a misreading of it.
    - >-
      The toy measurement is at n <= 41 and B' <= 2^14; no claim is made about
      whether the "generic support" heuristic (limb B) or the block-count
      constant-factor behaviour (confounders) transfers to deployed B' without
      the stated extrapolation-distance discipline this lane's other records
      already carry.
    - >-
      This record does not apply to the five composite-degree c2pnb* rows,
      where the relevant Frobenius structure (if any) lives over F_{2^16}, not
      F_2, and is explicitly out of scope here.
    - >-
      FORWARD GUIDANCE. Left open: reading the actual published ell for at
      least one deployed row (the natural next step, cheap and zero-compute
      once a primary source is opened) to convert one OPEN cell to COMPUTED;
      whether a similar equivariant lever exists for the five c2pnb rows'
      order-k Frobenius structure over F_{2^16} (a natural successor object,
      not attempted here); and whether the rank-fraction finding, if negative,
      changes 2e2a58's B' double-reading in a way that should be fed back to
      that record's own reachability-table emission.

  heuristic_assumptions:
    - id: H-BINSTD-LA-1
      statement: >-
        NONE FOR THE ORBIT-ORDER THEOREM (limb A) -- it is unconditional for n
        prime, dim V >= 2, recorded here so the absence of a heuristic is
        explicit.
      rigorous_support: >-
        Two-line group-theory proof given in claim limb (A); verified
        computationally by the exhaustive/sampled check as a correctness test
        of the implementation, not as evidence for the statement.
      validation_plan: >-
        SAMPLE. Exhaustive at n in {17,19,23}; 10^4-sample at n in
        {29,31,37,41}. COMPARISON. Predicted orbit size exactly n (or 1 for
        the single fixed point). TAIL CHECK. Any violation halts the cell and
        is inspected as an implementation defect. TRANSFER. None needed; the
        statement is a theorem for every n prime, hence for every row of the
        prime-degree half of the population without further sampling.
    - id: H-BINSTD-LA-2
      statement: >-
        A "generic" decomposition's support (its m factor-base summands) is not
        contained in a proper Z/n-invariant subspace of its ambient orbit
        space, so its n tau-images span the full permutation-module orbit and
        are linearly independent over F_ell.
      rigorous_support: >-
        RIGOROUS INGREDIENT: a vector's Z/n-orbit spans a proper invariant
        subspace only if the vector already lies in one of the isotypic
        components' proper sub-sum, an algebraic condition of positive
        codimension in the ambient space for a fixed decomposition of the
        vector space (Schur/semisimplicity, gcd(ell,n)=1). THE GAP: "generic"
        here means "a real decomposition's support behaves like a uniformly
        random size-m subset of the column set with respect to this
        codimension condition," which is NOT proved -- decompositions are
        found by a SOLVER (Groebner/SAT) searching a structured system, and
        solver-found solutions are exactly the kind of object that can be
        systematically non-generic (this is the same caution 77bf31's
        small-orbit-degeneracy confounder and this record's own rank-fraction
        null both exist to catch). The classical distribution theorem this
        imitates is the generic-position / non-degeneracy heuristic for
        Reed-Solomon-type or MDS-code-like structures under a cyclic group
        action: "a uniformly random weight-m vector's Fourier transform under
        Z/n has no more than a negligible probability of a zero coefficient
        at any fixed frequency," the same style of argument as a
        Schwartz-Zippel bound for a low-degree Fourier polynomial not
        vanishing at a fixed point.
      validation_plan: >-
        SAMPLE. Real decomposition relations from the toy IC pipeline at n in
        {17,19,23,29,31,37,41}, at least 10 relations per cell; shape-matched
        random-support null of the same m, 10x oversampled. COMPARISON
        DISTRIBUTION. Rank fraction of real orbits against the null's, with a
        binomial/bootstrap interval. TAIL CHECKS. The distribution of the
        SMALLEST nonzero isotypic-component coefficient magnitude across
        relations, real versus null -- a heavy concentration near zero on real
        relations but not on the null is the signature of systematic
        non-genericity even when the headline rank fraction looks fine.
        TRANSFER. None claimed beyond n <= 41; a measured rank fraction at
        toy scale is NOT evidence about deployed n without a stated,
        separately argued transfer assumption, which this record does not
        supply.
    - id: H-BINSTD-LA-3
      statement: >-
        For a "typical" large prime ell relative to a small fixed n, e =
        ord_n(ell) is heuristically modelled by treating ell mod n as a
        uniformly random element of (Z/n)*, so e is distributed as the order
        statistic of a uniform random element of the cyclic group (Z/n)* of
        order n - 1.
      rigorous_support: >-
        RIGOROUS INGREDIENT: for a genuinely uniformly random residue mod n
        coprime to n, the order distribution is exactly computable from the
        divisor structure of n - 1 (standard cyclic-group counting: the number
        of elements of order d | n-1 is phi(d)). THE GAP: whether a
        CRYPTOGRAPHICALLY CHOSEN ell (selected for the curve's group order to
        satisfy Hasse-bound and primality constraints, not for its residue mod
        a small unrelated n) behaves as "uniformly random mod n" is an
        equidistribution heuristic, not a theorem; it imitates the classical
        Chebotarev/Dirichlet-type expectation that primes are equidistributed
        across residue classes coprime to a fixed modulus, applied here to a
        SINGLE prime rather than to a density statement over many primes,
        which is the usual and disclosed weakness of applying an
        equidistribution heuristic to one fixed instance rather than a family.
      validation_plan: >-
        SAMPLE. For the seven toy cells' actual ell values (exact integers,
        no estimation needed) compute e directly; separately, generate a
        LARGE synthetic sample (10^4) of random primes of the SAME bit length
        as each toy cell's ell (via a standard primality test, not tied to any
        curve) and compute the empirical distribution of e for those, as the
        "uniformly random ell mod n" reference distribution. COMPARISON.
        Whether the seven REAL toy e-values look like typical draws from the
        synthetic reference distribution (a small-sample plausibility check,
        not a hypothesis test with real power at n=7). TAIL CHECK. Whether any
        toy cell's real e is anomalously small (e <= n/10, the STRUCTURE-HELPS
        regime) compared to the reference distribution's lower tail. TRANSFER.
        Explicitly none to deployed rows: this heuristic exists only to
        interpret the toy-cell sample honestly, since the deployed-row e
        values are not computed here at all.

  heuristic_note: >-
    Limb (A) is a theorem and carries no heuristic weight; it is the record's
    only unconditional content and everything else is scoped as conditional on
    it. H-BINSTD-LA-2 (generic support => full-rank tau-orbits) is the record's
    highest-stakes heuristic because its failure would revise 77bf31's R_need
    downward-to-B/g claim across the WHOLE lane, not just this record, and it
    is tested with a matched null specifically because "solver-found solutions
    are non-generic" is a live, named worry rather than a formality.
    H-BINSTD-LA-3 is explicitly the weakest limb (an equidistribution heuristic
    applied to one instance) and is used only to interpret the toy sample, never
    to predict any deployed row's e -- deployed rows are left OPEN by design,
    and the record is honest that this is a real gap in coverage rather than a
    convenient stopping point.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR MOVED. Within the LA sub-phase only:
      generic block Wiedemann/Lanczos on a B' x B' relation matrix with w
      nonzeros/row costs O(B'^2 w) field operations (KN-TECH-008); the
      equivariant construction, CONDITIONAL on e = ord_n(ell) and the rank
      heuristic holding, costs O((B'/n)^2 w n^{2-kappa} e^{kappa-1}) field-
      operation-equivalents, a factor n/e^{kappa-1} improvement that COLLAPSES
      TO NO GAIN (factor 1) when e is close to n-1. This is a sub-phase
      constant/polynomial-factor claim, never an exponent against rho.
    memory_exponent: >-
      Unchanged from the generic baseline: O(B') words for either the generic
      or block-diagonalised representation, since the change of basis is a
      linear transform of the same dimension, not an expansion. The
      (n-1)/e x (B'/n)^2 blocks sum to the same total entry count as the
      original B'^2-scale sparse structure (up to the extension-field
      coordinate blow-up by e, itself amortised across fewer, smaller blocks).
    best_known: >-
      KN-TECH-008's generic block-Wiedemann/Lanczos baseline with no symmetry
      exploited: O(B'^2 w) field operations, O(B') memory. This record's claim
      is measured AGAINST that baseline on the SAME matrix, never against rho.
    hidden_overhead: >-
      DISCLOSED. (i) e is unknown for every named deployed curve this session;
      every deployed row is OPEN. (ii) The rank heuristic (H-BINSTD-LA-2) is
      untested beyond toy scale and could fail specifically because solver-
      found decompositions are non-generic. (iii) kappa (extension-field
      arithmetic cost) is an implementation choice, swept not fixed. (iv) The
      block-count constant-factor overhead at small n is disclosed as a
      confounder and not amortised into the headline formula.
    tradeoff_note: >-
      No time-memory tradeoff is introduced; the change of basis is memory-
      neutral. The genuine tradeoff this record exposes is CURVE-SPECIFIC:
      whether a named curve's actual ell happens to have small multiplicative
      order mod n is a property of that PARTICULAR published group order, not
      a design choice available to an attacker, so this lever (if real) is a
      windfall on curves where it happens to hold and worthless on curves
      where it does not -- and this record's contribution is exactly making
      that distinction computable rather than leaving "linear algebra is
      expensive" as an undifferentiated, curve-blind belief. Parallelisation
      position: the (n-1)/e blocks are EMBARRASSINGLY PARALLEL across each
      other (unlike the sequential Krylov chain WITHIN each block, which
      inherits IDEA-20260922-2e2a58's wall-clock floor at the smaller
      per-block dimension B'/n) -- so this record's structural lever
      COMPOSES with 2e2a58's width axis rather than competing with it, and
      that composition is named as forward guidance, not computed here.

  estimated_cost:
    implementation: medium
    compute: low
    qualification: >-
      Stage 0 is symbolic, an hour. Stage 1 reuses the ker g(tau) constructor
      IDEA-20260915-8fe0ef specifies. Stage 2 reuses whichever toy IC pipeline
      RQ-ICPERF-94c86e / IDEA-20260922-2e2a58 build; no new decomposition
      engine. Stage 3 reuses IDEA-20260922-2e2a58's planned block
      Wiedemann/Lanczos/structured-Gaussian-elimination engine and ADDS the
      equivariant change-of-basis step (a number-theoretic transform over
      F_ell/F_{ell^e}), roughly 200-400 additional lines once that shared
      engine exists. Single machine, minutes to an hour of compute, under
      200 MB peak. The implementation cost is shared with 2e2a58's Stage 2,
      per that record's own next_gate note about building the LA engine once.

  asymptotic_claim:
    problem: >-
      ECDLP on the standardized binary population of RQ-BINSTD-b6f698 -- the
      linear-algebra sub-phase of Frobenius-structured index calculus, and the
      rank question left open by two earlier records in this lane
    prior_best: >-
      KN-TECH-008's generic block-Wiedemann/Lanczos baseline, O(B'^2 w) field
      operations, no symmetry exploited.
    time_exponent: >-
      Unchanged as an attack exponent against rho. Within the LA sub-phase,
      CONDITIONAL on e < n - 1 and the rank heuristic, a factor n/e^{kappa-1}
      reduction versus the generic baseline on the same matrix; unconditional
      when e = n - 1 (no gain, matching the incumbent exactly).
    memory_exponent: Unchanged; O(B') either way.
    hidden_cofactor: >-
      e (curve-specific, unknown for every named row this session), kappa
      (implementation choice), and the rank-fraction discount if
      H-BINSTD-LA-2 fails on real decompositions.
    claim_kind: cost_model_correction
  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES AGAINST EVERY ROW
    THIS QUESTION'S BASELINE CLAUSE ENUMERATES. As an ATTACK this record mounts
    none and every row dominates it: matched rho with negation and the
