  assumptions:
    - >-
      n is prime for every row this record's limb (A) theorem covers -- true,
      by the audit, for every FIPS binary curve, every c2tnb*, every sect* and
      ECC2K-130; the theorem does NOT apply to the five composite-degree
      c2pnb* rows, where the relevant cyclic structure (if any) would be over
      F_{2^16} with a different order and is out of scope here.
    - >-
      gcd(ell, n) = 1, where ell is the curve's large prime subgroup order.
      True for every named row by inspection of scale (ell has hundreds of
      bits, n has at most 10 bits), stated rather than silently assumed.
    - >-
      "Generic support" in limbs (B) and (C): the m factor-base summands of a
      typical decomposition are not themselves a tau-orbit or contained in a
      proper Z/n-invariant subspace of the permutation module. This is the
      record's primary HEURISTIC content (see heuristic_assumptions) and is
      measured, not assumed, in the minimal test.
    - >-
      The orbit-gain factor g used by 77bf31 and consumed here as g = n on
      Koblitz/general-prime-degree rows is an INPUT from that record, cited
      and not re-derived; limb (A)'s theorem independently confirms g = n is
      the correct orbit order (not merely assumed) for l >= 2, which
      strengthens rather than merely reuses 77bf31's choice.
    - >-
      Field-operation costing convention: one F_ell multiplication is the unit;
      an F_{ell^e} multiplication costs e^{kappa} units, kappa in
      {1, 1.585 (Karatsuba), 2 (schoolbook)}, declared and swept, never fixed
      at one value without saying so.
    - >-
      Deployed curves are ARITHMETIC ONLY. e = ord_n(ell) is emitted OPEN for
      every deployed row until a primary-source ell is read; nothing here
      computes or fabricates a deployed-row ell.

  proof_search_map:
