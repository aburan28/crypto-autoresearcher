        Setting e = n - 1 (ell a primitive root mod n) collapses limb (C) to
        "no block-diagonalisation gain, generic Wiedemann baseline," which is
        the corpus's current implicit position (KN-TECH-008's baseline with no
        symmetry exploited) and is therefore an exact parameter slice, not a
        strawman. Setting the tau-orbit rank at 1 instead of n in limb (B)
        collapses to R_need = B (no orbit gain reaches linear algebra at all),
        which is the CONSERVATIVE reading 77bf31 and 2e2a58 both flag as the
        fallback if this record's rank claim fails.
      reproduction_check: >-
        Symbolic, zero compute: at e = n - 1 the block-diagonalisation speedup
        formula in limb (C) must reduce to exactly 1 (no gain). Numeric, on
        toy cells: for a hand-computable small n (e.g. n = 17, 19), directly
        factor x^n - 1 over F_ell for the toy cell's actual ell, compute e, and
        confirm the block sizes and count match the formula before any
        Wiedemann run is trusted.
