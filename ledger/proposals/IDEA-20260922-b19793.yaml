idea:
  id: IDEA-20260922-b19793
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-22'
  status: proposed
  approved_by: null
  title: >-
    THE FROBENIUS ORBIT ON THE FACTOR BASE MAKES THE LINEAR-ALGEBRA MATRIX AN
    F_ell[Z/n]-MODULE MAP, AND THAT SETTLES BOTH THINGS THIS LANE LEFT OPEN AT
    ONCE. For n PRIME (every FIPS/c2tnb/sect/ECC2K-130 row, per the audit), any
    nontrivial tau-stable factor-base subspace has tau acting with orbit size
    EXACTLY n on all but at most one nonzero coordinate -- a two-line group-
    theory fact, not a heuristic -- so the relation matrix a Koblitz or general
    prime-degree row produces is, up to that one exception, equivariant for the
    cyclic group Z/n. That single structural fact (i) answers whether 77bf31's
    "g free tau-shifted relations" are independent rows (R_need = B/g) or not,
    and (ii) gives block Wiedemann/Lanczos a genuine divide-and-conquer lever
    -- price its one open number, e = ord_n(ell), and measure whether the
    belief "the linear-algebra column is expensive here" is a real obstacle at
    these B sizes or an untested import from a different regime.
  class: measurement

  claim: >-
    (A) THE MODULE STRUCTURE, DERIVED HERE, RIGOROUS. By the normal basis
    theorem F_{2^n} is free of rank one over R_n = F_2[T]/(T^n - 1) with T
    acting as tau (IDEA-20260918-9abf42, Proposition read this session); the
    tau-stable F_2-subspaces are exactly the ideals (h) for h | T^n - 1
    (IDEA-20260915-8fe0ef). ADDED HERE: for n PRIME, every nonzero tau-stable
    subspace V of dimension l >= 2 has tau acting on V with order EXACTLY n on
    every vector except possibly the single fixed point v = 1 (if 1 in V).
    Proof: tau^n = id on V forces the order of tau|_V to divide n; n prime
    means the order is 1 or n; order 1 would mean tau fixes V pointwise, i.e.
    V is contained in Fix(tau) = F_2 = {0,1}, impossible for dim V >= 2. So
    every orbit of tau on V \ {0, 1} has size exactly n. This is two lines and
    needs no source beyond the module isomorphism already filed in this
    corpus; it is stated as a theorem, not a heuristic assumption.
    (B) THE PAYLOAD FOR RANK. 77bf31 (this lane, filed earlier today) prices
    the descent phase on the assumption that ONE decomposition success on a
    Koblitz or general-prime-degree row buys g = n "free" tau-shifted
    relations tau^i(R) = sum_j tau^i(P_j), i = 0..n-1, and explicitly defers
    the question "are these n relations independent, i.e. does R_need = B/g
    hold" to THIS record (see its assumptions block, third item, and
    IDEA-20260922-2e2a58's assumptions block, fifth item -- both name this ID).
    Limb (A) answers it: the n row-vectors {tau^i(row(R))} are the orbit of one
    vector under the regular action of Z/n on the (n-1 free + <=1 fixed)-orbit
    structure of the column index set; by (A) this orbit lies in a genuine
    n-dimensional (or (n-1)-dimensional, discounting the fixed coordinate)
    subspace of the permutation module, and for a row whose support is NOT
    itself tau-invariant (the generic case -- the m factor-base summands of a
    decomposition have no reason to form a tau-orbit themselves), the orbit is
    GENERICALLY full rank in that subspace: it fails to be full rank only if
    the row lies in a proper Z/n-invariant subspace of its own ambient orbit
    space, which for a decomposition with support drawn from many distinct
    n-orbits (support size m, factor base size B >> n) is a measure-small
    coincidence, not a generic outcome. CLAIMED CONDITIONALLY: R_need = B/g is
    the right count on Koblitz/general-prime-degree rows, to the same
    "generic, not proved for every instance" standard 77bf31 already carries
    for its own g/B bound, with the exceptional-support case named and tested
    (limb E below), not waved away.
    (C) THE PAYLOAD FOR LINEAR ALGEBRA, THE PART THIS LANE'S SEAM ASKS FOR.
    Because the relation matrix M is (up to the <= 1 fixed coordinate and the
    exceptional-support rows of limb B) a map of F_ell[Z/n]-modules, and
    gcd(ell, n) = 1 generically (ell is the astronomically larger prime), the
    group ring F_ell[Z/n] splits via the factorisation of x^n - 1 over F_ell:
    x^n - 1 = (x - 1) * (product of (n-1)/e irreducible factors of degree
    e = ord_n(ell), the multiplicative order of ell modulo n). So
    F_ell[Z/n] = F_ell (x) (F_{ell^e})^{(n-1)/e} as a ring, and M
    block-diagonalises INTO (n-1)/e blocks of size roughly (B/n) x (B/n) OVER
    THE EXTENSION FIELD F_{ell^e}, plus one residual block over F_ell of
    comparable small size. Solving (n-1)/e independent smaller systems (via
    block Wiedemann/Lanczos on each, KN-TECH-008) instead of one B x B system
    costs, in field operations counted in the SAME F_ell-multiplication unit
    (an F_{ell^e} operation costs O(e^{1.585}) F_ell operations by Karatsuba,
    O(e^2) by schoolbook -- both are declared and swept, never assumed):
    roughly ((n-1)/e) * (B/n)^2 * w * e^{kappa} field-op-equivalents, kappa in
    {1, 1.585, 2} declared, against B^2 * w for the generic (non-equivariant)
    baseline KN-TECH-008 already prices. THE SPEEDUP FACTOR IS THEREFORE
    n / (e^{kappa - 1} * (n-1)/n) -- approximately n/e^{kappa-1} for n large --
    AND IT COLLAPSES TO NO GAIN AT ALL (factor about 1) WHEN e IS CLOSE TO
    n - 1, I.E. WHEN ell HAPPENS TO BE (CLOSE TO) A PRIMITIVE ROOT MODULO n.
    e = ord_n(ell) IS THE ONE OPEN NUMBER THIS RECORD PRICES, and for any
    NAMED standardized curve it is not a heuristic at all -- it is a single
    integer computable exactly once the curve's published subgroup order ell
    is read from the primary standard (NOT done this session; every deployed
    row is therefore emitted OPEN for e until that read happens, per the
    question's own arithmetic-only discipline).
    (D) THE DISCRIMINATING PAIR. Two outcomes, named before any run: OUTCOME
    STRUCTURE-HELPS -- e is small (say e <= n/4) for a standardized row's
    actual ell, block Wiedemann/Lanczos measured in the equivariant basis on a
    matched toy cell costs materially less (within the swept kappa range) than
    the generic baseline on the SAME matrix, and the rank check in limb (B)
    confirms full-rank tau-orbits; this means the belief "linear algebra is a
    fixed, unavoidable B^2-scale cost here" is WRONG for this curve, and the
    lane gains a genuine, priced, honestly-scoped speedup of the LA phase
    specifically (not of the pipeline's exponent against rho). OUTCOME
    NO-STRUCTURE -- e is close to n - 1 (the generic case for a "random" large
    prime relative to a small fixed n, per the heuristic in section
    heuristic_assumptions), OR the toy rank check shows the tau-orbit
    relations are NOT full rank (a systematic dependency this lane's own
    assumption chain has been silently carrying); this means "Frobenius orbit
    gain propagates uniformly from relation collection to linear algebra" is
    FALSE, forces R_need upward from 77bf31's B/g toward B, and closes the
    equivariant-LA lever as a dead end for THIS mechanism (not for the curve,
    not for the method class -- a different g(T) factorisation or a different
    curve's ell could still land in the STRUCTURE-HELPS regime).
    (E) SCOPE CORRECTION TO THE LANE'S OWN BRIEF. The lane assignment names
    "linear algebra over F_2"; that is imprecise for ECDLP index calculus.
    KN-TECH-008 states the relation system is solved "over Z/n (or GF(2))" --
    GF(2) is the NFS/factoring convention, Z/n (here F_ell, ell the prime
    subgroup order) is the DLP convention, and this record uses F_ell
    throughout, stated explicitly so the correction is not silently absorbed.

  mechanism: >-
    OBJECT FRAME. Representation: R1 (RQ-ECDLP-623a32) x-coordinate points,
    UNCHANGED from every sibling record in this lane; this record introduces
    no new point representation. The attack stage whose charged cost is
    claimed is the LINEAR-ALGEBRA STAGE specifically -- the F_ell-linear solve
    for factor-base logarithms after relation collection, KN-TECH-008's
    "half the index-calculus algorithm" -- consumed by neither 77bf31 (descent)
    nor IDEA-20260922-2e2a58 (the wall-clock-floor/parallel-width comparison of
    the SAME phase against rho, a genuinely different question: 2e2a58 asks
    how fast the Krylov chain runs against a clock; this record asks whether
    the chain can be made SHORTER by exploiting the matrix's own symmetry).
    TWO OPERATION SETS ON TWO DIFFERENT OBJECTS, NAMED SEPARATELY.
    (i) On the FACTOR-BASE COLUMN INDEX SET (a set of points, not the group):
    Sigma_tau = <tau>, order n. Tracked object: the tau-orbit partition of the
    column set. TRICHOTOMY: PARTIAL-ACTION -- the orbit partition is exactly
    the block system of <Sigma_tau> on the factor base, licensed by
    IDEA-20260901-863e36 the same way 77bf31's chi indicator is, and it is
    THE SAME licence, not a new claim about it.
    (ii) On the RELATION MATRIX M as an F_ell[Z/n]-MODULE MAP: Sigma is the
    regular representation of Z/n acting simultaneously on rows (via the free
    tau-shifted relations 77bf31 already generates) and columns (via (i)).
    TRICHOTOMY: this is not a lossy projection of a GROUP ELEMENT at all --
    it is a representation-theoretic decomposition of a LINEAR OPERATOR, the
    same kind of object as IDEA-20260916-c38e50's S_m-isotypic block
    decomposition of a Macaulay matrix, placed here for completeness rather
    than forced into the point-trichotomy, which does not natively describe an
    operator decomposition. LOSSY-PROJECTION-STYLE TEST, ADAPTED: what the
    block-diagonal basis discards is the CROSS-TERMS between distinct
    isotypic components, which are EXACTLY ZERO by Z/n-equivariance (Schur's
    lemma for the semisimple group ring, gcd(ell,n)=1) -- so nothing is lost
    at all in the WELL-CONDITIONED case; the change of basis is literally
    exact and reversible. This is therefore closer to a CHANGE OF COORDINATES
    than a lossy projection, and the record says so rather than forcing the
    wrong label: the actual PRICED, LOSSY step is elsewhere -- discarding the
    off-diagonal blocks' COST (not their information) by never computing them,
    which is lossy only in the sense of "never bothering," not of discarding
    recoverable information. This distinction is recorded because misnaming
    it would be exactly the kind of self-flattery the lossy-projection test
    exists to prevent.
    OFF-LIMITS COMPONENTS DECLARED. F2 (factor-base decomposition) is the
    declared component whose downstream LA phase this record targets; no new
    factor base is proposed, so KN-OPEN-020 is not engaged. This is explicitly
    NOT the KN-OPEN-006/RQ-STR-001 structured-matrix line: that line DESIGNS
    relation SUPPORTS (arithmetic progressions on prime fields) to force
    Toeplitz/Hankel displacement-rank structure via translation invariance;
    this record uses NO support design at all and instead exploits a symmetry
    that is ALREADY THERE on binary Koblitz/general-prime-degree curves,
    coming from the field's own Frobenius, via representation theory of a
    finite CYCLIC group rather than displacement rank of a TRANSLATION-
    invariant operator. The two mechanisms are unrelated beyond both living
    inside KN-TECH-008's LA-stage scope, and this distinction is the load-
    bearing content of the overlap_review below.
    WHAT THIS RECORD DOES NOT DO. It does not re-derive C_att, p, R_need's
    baseline value, or the descent-phase accounting (77bf31's business); it
    does not compute the wall-clock crossover against rho (IDEA-20260922-2e2a58's
    business, whose Stage 2 shared LA engine this record explicitly reuses
    rather than rebuilding); it does not claim any exponent against rho.

