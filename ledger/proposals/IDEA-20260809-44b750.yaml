idea:
  id: IDEA-20260809-44b750
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-AEADC-8db132
  goal_id: GOAL-AEADC-001
  title: >-
    From certificate to search: measure how many candidate keys a single
    partitioning query eliminates, and what the total query count becomes
  class: composition
  claim: >-
    A partitioning attack's cost is the product of the per-query key-set size —
    bounded by the k-way construction curve — and the number of queries needed to
    isolate a key from a candidate set. The claim is that composing the measured
    k-way curve with a declared search strategy gives a total query count as a
    function of candidate-set size, and that the resulting curve identifies the
    candidate-set sizes at which the approach is and is not practical, generically
    and with no deployment named.
  mechanism: >-
    Model the oracle as returning one bit per query (the submitted ciphertext
    decrypted successfully under the unknown key or not). With k keys per query,
    each query partitions the candidate set; the query count follows from the
    partition sizes, and the per-query cost from the measured construction curve.
  why_not_a_renamed_known_approach: >-
    The information-theoretic argument is standard and appears in the published
    partitioning work. What this record adds is the composition with THIS
    program's measured k-curve rather than an assumed one, giving a total-cost
    curve whose inputs are all measured here.
  predictions:
  - observable: total cost versus candidate-set size
    metric: queries and construction time versus log candidate-set size
    predicted: Query count near the information-theoretic minimum, with total cost dominated by construction at large k. The crossover point between query-dominated and construction-dominated regimes is the deliverable.
  - observable: sensitivity of total cost to the maximum achievable k
    metric: cost change per unit change in k
    predicted: Strong, which is why the k-curve had to be measured first rather than assumed.
  minimal_test: >-
    Simulate the oracle end to end at small candidate-set sizes with real
    constructed ciphertexts (not simulated ones), measure the actual query count
    and time, and compare against the composed model.
  controls:
  - 'REAL-CERTIFICATE CONTROL: the simulation must use actually constructed multi-key ciphertexts; a simulation with idealized queries would measure the model rather than the mechanism.'
  - 'RANDOM-GUESS NULL: a strategy submitting random ciphertexts must perform at the trivial rate, confirming that the measured advantage comes from the construction.'
  falsification_conditions:
  - Measured query counts diverge from the composed model beyond a declared tolerance.
  - Constructed ciphertexts fail in the end-to-end simulation at k values the curve says are reachable.
  interpretation_limits: >-
    A simulated oracle is not a deployed system. This record describes a generic
    attack shape and names no product, service, protocol implementation or
    deployment, and its numbers are properties of the simulation.
  sota_delta: 'No attack against any system. Delta: an end-to-end cost curve built from this program''s own measurements.'
