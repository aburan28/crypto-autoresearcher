      - claim: A = 0 or A = 1 literally, for the eleven named curves, per the audit dump.
        responsibility: baseline
      - claim: Tr(alpha^j) = 0 for 1 <= j < n - s at any parity of n, for the actual field polynomials of these curves.
        responsibility: correctness
      - claim: pi is a group homomorphism E(F_q) -> Z/2 with kernel 2E, and G subset 2E.
        responsibility: correctness
      - claim: Per-instance SAT/Groebner cost at fixed window dimension does not depend on whether the window is Semaev's V or this record's V', within the tolerance IDEA-20260915-3119c9's H2 states.
