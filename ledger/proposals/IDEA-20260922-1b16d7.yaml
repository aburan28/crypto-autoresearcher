  assumptions:
    - >-
      E has the form y^2 + xy = x^3 + a x^2 + b with a single rational 2-torsion
      point (b != 0); true for every FIPS/SECG binary curve in this population
      (standard Weierstrass form for characteristic-two curves per FIPS 186-4).
    - >-
      Newton's identity giving Tr(alpha^j) = 0 for 1 <= j < n - s holds for the
      actual (pentanomial, not just trinomial) field polynomials of these
      curves, whose non-leading exponents (e.g. s=7 for sect163k1's
      x^163+x^7+x^6+x^3+1) are tiny relative to any realistic window dimension
      k ~ 10-80; this is stated as an assumption because this session did not
      re-derive Newton's identity for the pentanomial case, only cited cedd2f's
      use of it for the (also pentanomial, per RUN-SEMBIN-1b9afe's code)
      trinomial/pentanomial cells it measured.
    - Arithmetic only at deployed parameters. Nothing here runs an attack at m >= 131; the eleven named curves appear as computed census rows.
    - Uses F2 (factor-base decomposition) as the declared component; no new relation-search algorithm is proposed.
  proof_search_map:
    bottleneck: >-
      Whether a factor-base window can be built to lie entirely on the target
      subgroup's parity class, at zero extra design cost, on the SPECIFIC
      deployed curves this program's baselines already price -- and whether that
      construction is even AVAILABLE (not vacuous) on the population it is meant
