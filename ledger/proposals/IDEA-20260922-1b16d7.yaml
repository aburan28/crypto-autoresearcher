        the observation-collision analysis); a null F0 here would mean the
        toy cell is too small to distinguish confinement from a size artefact
        and must be excluded from the reading.
    - metric: per_instance_SAT_UNSAT_cost_ratio_V_prime_over_matched_V
      direction: flat
      minimum_effect: within 10 percent, per IDEA-20260915-3119c9's H2 (adopted, not re-derived); a ratio outside this range means the yield and per-attempt effects are NOT separable as claimed and the cost-separation argument must be withdrawn.
  minimal_test:
    design: >-
      TWO PARTS. PART 1 (arithmetic, zero compute, minutes): re-derive n mod 2
      and the literal A value for the eleven named curves directly from FIPS
      186-4 and the ANSI/SECG primary standards (not from the OpenSSL secondary
      source), confirming the census table of (C); re-derive the field
      polynomial's non-leading exponents for each of the six curves used in
      PART 2 and confirm k-1 is comfortably below n-s for the toy window sizes
      used. PART 2 (toy executable cells, n <= 41): Koblitz curves
      y^2+xy=x^3+ax^2+1 over F_{2^n}, n prime in {17,19,23,29,31,37,41}, at
      BOTH a=0 and a=1 (six matched pairs), with V and V' both built at the
      same nominal k (so |V'|=|V|/2). For each cell and each of the four arms
      (V vs V', a=0 vs a=1): exhaustive decomposition census at m in {2,3},
      recording F0, F1, decompositions per G-target, and (for the
      cost-separation prediction) the per-instance SAT/UNSAT conflict count of
      the exhaustive-core PDP instrument already used by IDEA-20260915-0d8e90 /
      IDEA-20260915-3119c9's step (4), run on V and V' at matched dimension.
    controls:
      - >-
        SIZE-MATCHED RANDOM (k-1)-dimensional subspace, NOT equal to V', at
        every cell: must show F0 roughly |V'|/2, distinguishing genuine
        confinement from a small-window artefact.
      - >-
        EVEN-n NULL: cedd2f's own even-n cells (n in {20,22,24} if reachable
        with the shared harness, else a fresh even-n Koblitz cell), where V is
        already confined by cedd2f's original result and V' must show NO
        additional gain over V.
      - >-
        a=0 versus a=1 ARMS on the SAME field size n, isolating Tr(a) as the
        sole variable (matching the deployed population's own split).
      - >-
        Positive control: targets in the COFACTOR (even-order) subgroup, where
        V' (a=0 rows) must show ZERO decompositions and V (a=1 rows, matching
        the wrong class by construction) must show nonzero ones -- the mirror
        image of the G-target result, confirming the split is about parity
        class and not about V' being simply "worse" or "better" in some
        unrelated sense.
    required_metrics:
      - F0_F1_per_cell_per_arm
      - decompositions_per_G_target_per_arm
      - decompositions_per_cofactor_subgroup_target_per_arm
      - SAT_UNSAT_conflict_count_per_instance_V_vs_V_prime
      - certificate_pass_rate
  falsification_conditions:
    - >-
      Any point of V' with pi(P) != Tr(a), on any toy cell matching the
      deployed curves' field-polynomial shape. Refutes (B)'s Newton's-identity
      application for that shape.
    - >-
      Nonzero F0 for V' on a Tr(a)=0 toy cell, or F0 != |V'| on a Tr(a)=1 toy
      cell. Refutes the census's forced prediction for that arm.
    - >-
      SAT/UNSAT per-instance cost differing by more than 10 percent between V
      and V' at matched dimension. Refutes the cost-separation claim this
      record inherits from IDEA-20260915-3119c9's H2; the yield and per-attempt
      effects would then be confounded and the whole framing must be
      re-examined.
    - >-
      An even-n toy cell showing additional yield gain from V' over cedd2f's
      already-confined V. Would mean the mechanism identified is not what this
      record claims.
  confounders:
    - >-
      TOY VS DEPLOYED FIELD POLYNOMIAL SHAPE. The deployed curves use specific
      pentanomials/trinomials with particular non-leading exponents; toy cells
      must be chosen (or the field-polynomial search constrained) to match that
      shape, or Newton's identity's threshold n-s could differ enough to change
      which j are trace-zero. PART 1 checks this explicitly per curve used in
      PART 2.
    - >-
      QUADRATIC TWIST. As in cedd2f and 3119c9, the twist E' has a' with
      Tr(a') = Tr(a) + 1, flipping which class is confined; every arm must
      record which side (E or twist) each x-coordinate belongs to.
    - >-
      SMALL-WINDOW DEGENERACY. At very small k-1, V' may accidentally contain
      or exclude special points (the unique 2-torsion x-coordinate 0, whose
      trace is Tr(0)=0=Tr(a) exactly when a=0) in a way that is not
      representative of larger deployed windows; report whether x=0 is in V'
      per arm.
    - >-
      The twenty curves excluded from the census (full-length A) may or may not
      share the same Tr(a) values as their 0/1 cousins by coincidence; nothing
      is claimed about them and no extrapolation is attempted.
  interpretation_limits:
    - Proposal only. No experiment, no run, no approval, no result exists here.
    - >-
      This record changes the census and the construction, not the underlying
      mechanism, which is cedd2f's and is cited, not re-derived. Its entire new
      content is: the parity obstruction to cedd2f's own window on the deployed
      population, the one-line fix, and the eleven-curve forced census read
      directly off published parameters.
    - >-
      Nothing here says any resulting index-calculus line is feasible, beats
      matched rho, or moves any exponent. This is a YIELD-only construction: it
      changes which targets a given factor base can reach and how densely, not
      the per-attempt decomposition cost, which is inherited unchanged (subject
      to the falsifiable 10 percent tolerance above).
    - >-
      The toy range is n <= 41 against deployed targets at 163-571 bits; the
      extrapolation distance for any cost reading is a factor of at least
      2^{120} in group size. The Tr(a) values themselves are exact at deployed
      parameters and carry no extrapolation (they are read, not measured); the
      yield MAGNITUDE (decompositions per target, SAT cost) is toy-only and
      transfers under the stated numbered assumptions only.
    - >-
      Twenty of the thirty-one dumped curves are explicitly out of scope for
      this census (A is not literally 0 or 1); this is a disclosed gap, not a
      silent omission.
  heuristic_assumptions:
    - id: H-1b16d7-0
      statement: >-
        NONE FOR THE CENSUS OR THE CONSTRUCTION. Tr(a) for A in {0,1}, the
        parity of n, and Tr(alpha^j)=0 for small j are unconditional finite
        arithmetic given Newton's identity and the published field polynomials.
      rigorous_support: Tr(1) = n mod 2 by definition of the absolute trace; Tr(alpha^j) = 0 for 1 <= j < n-s by Newton's identities on the field polynomial's non-leading exponent s (cedd2f's derivation, cited).
      validation_plan: Part 1 of the minimal test; independent re-derivation from FIPS 186-4 and ANSI X9.62/SECG primary standards, minutes.
    - id: H-1b16d7-1
      statement: >-
        COST-SEPARATION HEURISTIC (inherited from IDEA-20260915-3119c9's H2,
        not re-derived): per-instance SAT/Groebner conflict count at fixed
        window dimension l does not depend on which affine/linear basis is
        used for V, because the leaf count 2^{3l}-style bound is a property of
        block SIZES, not of the specific basis, and the ANF differs only in
        linear terms.
      rigorous_support: >-
        3119c9's Proposition-1 reading of IDEA-20260915-0d8e90; not proved here,
        adopted with credit. The gap: a basis-dependent linear term COULD in
        principle change branching order or conflict structure even if leaf
        count is fixed, and this is exactly what 3119c9's own H2 flags as
        needing measurement, not assumption.
      validation_plan: >-
        Part 2's SAT/UNSAT conflict-count arm, comparing V and V' at matched
        dimension on the same six toy cells; if the ratio exceeds 10 percent,
        this record's cost-separation claim is withdrawn and the yield effect
        must be re-measured jointly with per-attempt cost rather than
        independently. SAMPLE: >= 20 instances per cell per arm.
  heuristic_note: >-
    The record's two hard results (the census and the window construction)
    carry no heuristic. The one heuristic borrowed (H-1) is not this record's
    to validate -- it belongs to IDEA-20260915-3119c9 -- and is re-stated here
    only because this record's central claim (yield separable from per-attempt
    cost) depends on it, so a failure of H-1 in the shared minimal test would
    falsify BOTH records' cost-separation framing simultaneously, which is
    disclosed rather than hidden.
  target_complexity:
    time_exponent: >-
      No exponent moves. This is a factor-base DESIGN choice (which window to
      use), not an algorithm; it changes which targets a fixed-size window can
      reach (yield), inheriting the per-attempt decomposition cost unchanged
      per the H-1b16d7-1 heuristic (falsifiable, see above). No time_exponent
      figure is computed here because no full pipeline cost is charged; that is
      left to a designed EXP-BINSTD-* contract per the question's decision
      target, using the matched-rho baseline convention (0.886 sqrt(r)/sqrt(2n)
      per curve, per KN-TECH-006 / KN-LIT-096's calibration point, NOT
      recomputed in this record for the eleven named curves).
    memory_exponent: >-
      Relations stored ~ |V'| = 2^{k-1}, one bit smaller than a same-nominal-k
      unmodified window V; negligible difference, not a design lever on its
      own.
    best_known: >-
      Matched Pollard rho with negation and the Frobenius class map on the
      Koblitz rows (K-163..K-571, sect239k1); matched rho with negation only
      on the B-curve rows (no Frobenius endomorphism at general a, b). Neither
      is recomputed here; both are the standing convention of
      RQ-BINSTD-b6f698 and prior records in this lane.
    hidden_overhead: >-
      DISCLOSED: this record does not estimate the per-attempt decomposition
      cost at all, deferring entirely to IDEA-20260915-3119c9's and
      IDEA-20260915-0d8e90's instruments; if H-1b16d7-1 fails, the yield gain
      claimed here could be entirely offset by a per-attempt cost increase not
      accounted for anywhere in this record.
    tradeoff_note: >-
      Pure yield lever, no memory-time tradeoff proposed; the window is one
      dimension SMALLER than Semaev's own choice at the same effective F1
      (E-side leg count) on the six Tr(a)=0 rows, which is a small net memory
      win if anything, not a cost.
  estimated_cost:
    implementation: low
    compute: low
    qualification: >-
      Part 1 is eleven parity reads and six re-derivations from primary
      standards: minutes. Part 2 reuses the toy Koblitz decomposition machinery
      and the exhaustive-core PDP instrument this lane already has (cedd2f's
      harness, IDEA-20260915-0d8e90/3119c9's SAT arm) and adds one window
      construction (drop the constant) plus a matched-pair (a=0, a=1) sweep;
      single machine, hours.
  asymptotic_claim:
    problem: >-
      Relation-collection yield of Semaev low-degree windows on the FIPS/SECG
      binary curve population, corrected for a parity obstruction cedd2f's own
      scoping already names but has not been applied to the deployed curves.
    prior_best: >-
      Semaev's unmodified low-degree window V, whose confinement per cedd2f
      applies only at even n and is therefore vacuous on this entire population.
    time_exponent: unchanged (no algorithm proposed; a factor-base design fact)
    memory_exponent: unchanged (window one dimension smaller at matched F1)
    hidden_cofactor: >-
      The per-attempt decomposition constant, inherited and disclosed as
      unestimated here (see hidden_overhead above); the H-1b16d7-1 tolerance
      bounds it only if confirmed by measurement.
    claim_kind: yield_design_plus_structural_emptiness
  dominated_by: >-
    Matched Pollard rho on every named curve, per the question's standing
    convention; not recomputed here (see best_known above). This record makes
    no attack claim and states no attack cost. Other frontier rows checked and
    not addressed: GHS/Weil descent (not applicable to this odd-n prime-degree
    population, per the audit); the Frobenius-stable-subspace line
    (IDEA-20260922-6cf862, 261004, IDEA-20260918-9abf42), a different object;
    the quasi-subfield line (RQ-QSP-f9bbdb), a different mechanism entirely.
  sota_delta:
    time: >-
      Zero exponent; a bounded constant-factor yield claim (Tr(a)=0 rows gain
      the class-alignment factor IDEA-20260915-3119c9 already measured at 2-8x,
      achieved here at dimension k-1 instead of k+1; Tr(a)=1 rows lose the
      construction entirely, a structural-emptiness verdict for this specific
      window). No sota_delta figure is computed for a full pipeline because
      none is charged here.
    memory: One dimension smaller window at matched F1 on the Tr(a)=0 rows; negligible.
    data_queries: Not applicable; single-target design lever, no advice, no preprocessing.
  frontier_check:
    status: pending
    note: >-
      Whether the constant-dropped low-degree window, or the general fact that
      Semaev's canonical window is trace-confined only at even n, appears
      anywhere in the Semaev/Gaudry/Diem/GGMP literature was NOT checked
      against any primary source this session (no web search was run for this
      specific construction). The Fong-Hankerson-Lopez-Menezes and Pornin
      citations are relayed through cedd2f, not independently re-fetched. A
      coordinator literature check is recommended before any part of this
      record is called novel beyond "unverified".
  recommended_priority: high
  priority_rationale: >-
    Cheap (Part 1 costs minutes and closes one specific lane-entry -- cedd2f's
    window is vacuous on the whole deployed population -- to the
    docs/inventor-protocol.md section 4 standard), fills exactly the
    reachability table cells RQ-BINSTD-b6f698 wants for this lever, and gives
    the cost-separation demonstration (yield changed by construction, per-attempt
    cost held to a falsifiable 10 percent tolerance by an EXISTING, cited
    instrument) the brief's seam explicitly asks for. Not "high" because it
    moves any exponent -- it moves none and says so -- but because it directly
    answers "which standardized curve's structure changes yield" with a sharp,
    zero-compute, population-wide, falsifiable split (six curves helped, five
    curves emptied) rather than a single toy-curve demonstration.
  first_deliverable: >-
    A certificate table under analysis/ containing: n mod 2 and the literal A
    value for the eleven named curves, re-derived from FIPS 186-4 / ANSI X9.62
    / SECG primary standards; the field-polynomial non-leading exponent s for
    each and confirmation that realistic window dimensions k-1 sit well below
    n-s; and the forced Tr(a) verdict per curve with its one-line certificate.
  next_gate: >-
    Coordinator decision on whether the certificate table is filed as an
    analysis artefact (a pre-compute falsification check, not evidence) or
