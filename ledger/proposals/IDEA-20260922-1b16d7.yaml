      reproduction_check: >-
        SYMBOLIC, ZERO COMPUTE. At even n the closed form of (B) must reduce to
        cedd2f's original statement with V (constant term included) already
        confined -- i.e. this record's V' is a STRICT SUBSET of cedd2f's
        confined V at even n, changing nothing about which targets are
        reachable, only shrinking the window by one dimension unnecessarily
        (the deliverable at even n is null; the fix matters only at odd n). A
        disagreement with cedd2f's even-n statement refutes this record's
        reading of Newton's identity, not cedd2f's result.
    observation_collision:
      observable: >-
        The count F0 (legs of V' outside G) at each of the eleven census rows,
        and the fraction of G-target decompositions produced by V' versus by
        Semaev's unmodified V of the same dimension k.
      distinct_preimage_search: >-
        A measured F0 = 0 for V' could arise from (i) the genuine trace-parity
        mechanism claimed here, or (ii) an artefact of V' being too small to
        sample both classes at all (a degenerate-base false positive, the same
        failure mode IDEA-20260915-3119c9's confounders section names for its
        own class-aligned slice). The distinguishing preimage is a
        SIZE-MATCHED random (k-1)-dimensional subspace NOT equal to V': its F0
        must be nonzero (roughly half of |V'|) with high probability, exactly
        as 3119c9's H1 predicts for a generic slice, so a null F0 there would
        indicate a degenerate-base artefact rather than confinement.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          V' = span{alpha,...,alpha^{k-1}}, Semaev's canonical window with its
          constant term removed
        predicted_gain: >-
          F0 = 0 (all legs on the G side) on the six Tr(a)=0 rows, at dimension
          k-1 rather than the k+1-dimensional class-aligned affine slice
          IDEA-20260915-3119c9's R1 needs to match |V'_E|; on the five Tr(a)=1
          rows, F0 = |V'| (every leg on the WRONG side), a structural-emptiness
          verdict for this specific window on this specific population.
    quantifier_order: >-
      FOR EACH of the eleven named curves with A in {0,1}, Tr(a) is a FORCED
      integer (n mod 2 for A=1, 0 for A=0), computable with zero arithmetic
      beyond reading n's parity; and FOR EVERY window V' constructed as above,
      EVERY basis vector has Tr = 0, so EVERY point of V' has pi(P) = Tr(a),
      a CONSTANT across the whole window -- the quantifier order is universal
      over the window, not sampled, and a single measured counterexample (one
      point of V' with pi != Tr(a)) refutes the Newton's-identity assumption
      for that curve's field polynomial.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On the eleven named curves with A in {0,1}, the window V' obtained by
        dropping the constant term from Semaev's low-degree window has every
        point on the G side (Tr(a)=0 rows: K-233, K-283, K-409, K-571,
        sect239k1) or every point off the G side (Tr(a)=1 rows: K-163 and every
        NIST B-curve), forced by n's parity and the published A value alone."
        It certifies NOTHING about solving degree, per-attempt SAT/Groebner
        cost (inherited, per 3119c9's H2, and NOT independently re-measured
