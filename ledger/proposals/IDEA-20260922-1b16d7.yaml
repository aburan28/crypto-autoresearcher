idea:
  id: IDEA-20260922-1b16d7
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-22'
  status: proposed
  approved_by: null
  title: >-
    Tr(a) is forced, not measured, on eleven deployed curves whose published A is
    literally 0 or 1: dropping the constant term from Semaev's low-degree window
    revives trace-parity confinement at EVERY odd n (where cedd2f's own scoping
    says the unmodified window is not confined), and splits the FIPS/SECG
    population into six Tr(a)=0 rows (K-233, K-283, K-409, K-571, sect239k1,
    c2pnb208w1) where the constant-free window is free G-alignment at zero extra
    dimension cost and five Tr(a)=1 rows (K-163 and every NIST B-curve) where the
    SAME construction is structurally empty in the target subgroup
  class: mechanism
  claim: >-
    SETTING. Let E: y^2 + xy = x^3 + a x^2 + b over F_q, q = 2^n, with a single
    rational 2-torsion point (b != 0), Tr the absolute trace F_q -> F_2, and
    pi(P) = Tr(x_P) + Tr(a) the index-2 quotient map E(F_q) -> E(F_q)/2E(F_q) =
    Z/2 (IDEA-20260913-cedd2f, facts F1-F2, citing Fong-Hankerson-Lopez-Menezes
    2003 Lemma 4.1 and Pornin ePrint 2022/1325 Section 3, both retrieved and read
    by that record). The odd-order target subgroup G satisfies pi(R) = 0 for every
    R in G (G is contained in 2E, since |G| is odd).

    (A) THE CENSUS THAT HAS NOT BEEN RUN. cedd2f derives its confinement result
    for Semaev's default window V = span{1, alpha, ..., alpha^{k-1}} and states,
    as part of its own scoping, that this specific V is confined ONLY AT EVEN n
    (Tr(1) = n mod 2 = 0 at even n; Tr(alpha^j) = 0 for 1 <= j < n - s by Newton's
    identities on the field polynomial's non-leading exponent s, regardless of
    parity) and NOT at odd n ("at odd n, 1 in V has trace 1 and it is not
    [confined]"). Every FIPS 186-4 binary curve and every SECG sect*k1/r1/r2 curve
    dumped in analysis/binstd-curve-audit/binary-curve-params.txt has n in
    {163, 233, 239, 283, 409, 571} -- ALL ODD (verified here by reading the field
    degrees off that file; the audit's own README records the same set as "prime
    extension degree"). So cedd2f's confinement lever, applied to Semaev's own V,
    is VACUOUS on the entire FIPS/SECG population, by parity alone, zero compute.
    This has not been stated anywhere in this corpus and closes one specific
    lane-entry cleanly (docs/inventor-protocol.md section 4 standard: named
    obstruction -- n odd -- argument -- Tr(1) = n mod 2 -- and forward guidance,
    which is part (B) below).

    (B) THE ONE-LINE FIX, AND WHY IT IS FREE. Drop the constant term: let
    V' = span{alpha, ..., alpha^{k-1}} (dimension k-1, one less than Semaev's V).
    Every basis vector of V' is alpha^j for 1 <= j <= k-1, and Newton's identity
    gives Tr(alpha^j) = 0 there REGARDLESS of the parity of n (only the constant
    term "1" carried the n mod 2 dependence). So V' subset ker(Tr) at EVERY n,
    odd or even, for any k-1 < n - s. This is a one-dimension-smaller window
    obtained by removing exactly the basis vector responsible for the parity
    obstruction; it costs nothing beyond re-reading a window one dimension
    narrower, which IDEA-20260915-3119c9's H2 (per-instance SAT/Groebner cost
    depends on the block sizes of the descended system, not on which basis is
    used) predicts leaves the per-attempt decomposition cost unchanged to within
    the stated tolerance -- the yield effect below is claimed to be separable
    from the per-attempt cost by that existing, cited instrument, not by a new
    model.

    (C) THE DEPLOYED CENSUS, READ DIRECTLY FROM PUBLISHED PARAMETERS, ZERO
    COMPUTE. analysis/binstd-curve-audit/binary-curve-params.txt records the
    OpenSSL-dumped "A" field for every curve. Eleven deployed curves have A
    literally equal to the field element 0 or 1 (not a multi-byte constant whose
    trace would require full field arithmetic to determine) -- Tr(0) = 0 and
    Tr(1) = n mod 2 are then forced with no computation at all beyond reading the
    dump and the field degree:
      Tr(a) = 1 (n odd, a = 1): sect163k1 / K-163 (n=163).
        NIST B-curves (all published A = 1, per the dump): sect163r2 / B-163
        (n=163), sect233r1 / B-233 (n=233), sect283r1 / B-283 (n=283),
        sect409r1 / B-409 (n=409), sect571r1 / B-571 (n=571).
      Tr(a) = 0 (a = 0): sect233k1 / K-233 (n=233), sect283k1 / K-283 (n=283),
        sect409k1 / K-409 (n=409), sect571k1 / K-571 (n=571), sect239k1 / SECG
        K-239 (n=239, cofactor 4), and c2pnb208w1 (one of the five composite
        ANSI curves; A=0 read directly off the dump -- this curve has EVEN
        m=208=16x13, so cedd2f's UNmodified window already applies to it without
        the drop-constant fix; it is noted here only for completeness and its
        Frobenius-stable-subspace structure remains IDEA-20260922-6cf862's and
        IDEA-20260922-261004's territory, not re-litigated).
    Twenty further curves in the same dump (sect131r1/r2, sect193r1/r2, every
    c2tnb*, c2pnb163v1/v2/v3, and the other four composite ANSI curves) have A as
    a full-length, non-{0,1} field element and are OUT OF SCOPE for this
    zero-compute census: determining their Tr(a) needs an actual field-arithmetic
    computation (squaring and reducing mod the field polynomial n times), which
    this session cannot execute and does not claim to have done. This is stated
    as a scope limit, not elided.

    (D) THE FORCED CONSEQUENCE, STATED AS A PREDICTION, NOT A CLAIM OF FEASIBILITY.
    For the six Tr(a)=0 rows, G = 2E = ker(Tr) exactly (pi(P) = Tr(x_P) for those
    curves), so V' -- which is entirely inside ker(Tr) at every n -- has EVERY
    point on the G side: F0 = 0 in IDEA-20260915-3119c9's notation, with no design
    search needed (the class-alignment IDEA-20260915-3119c9's rule R1 achieves by
    searching over affine slices, this record's V' achieves by construction,
    for free, at dimension k-1 rather than k). For the five Tr(a)=1 rows, G =
    {Tr(x)=1}, and V' subset ker(Tr) = {Tr(x)=0} is therefore ENTIRELY on the
    WRONG side: every point of V' has pi(P) = 1, so by cedd2f's parity argument
    (sum of m legs of fixed parity 1 has parity m mod 2; a target in G has
    parity 0) V' at even arity m has zero legs contributing usefully, and worse,
    it is a DIFFERENT structural-emptiness result than IDEA-20260922-6cf862's
    (which empties the subfield-rational base on the composite-degree ANSI
    population via a cofactor-coprimality argument): here the emptying fact is
    Tr(a) = 1 combined with n odd, on the PRIME-degree FIPS/SECG population, an
    entirely different mechanism and a different set of curves.
  mechanism: >-
    OBJECT FRAME. Representation: the x-coordinate of a point of E(F_q) as an
    element of the F_2-vector space F_q, restricted to the window V' (R1 class,
    RQ-ECDLP-623a32: a field-element representation of the point restricted to
    an F_2-subspace). Operation set Sigma: translation by factor-base points
    together with the group law's own index-2 quotient pi (which is a genuine
    group HOMOMORPHISM E(F_q) -> Z/2, not the full translation action). Sigma is
    therefore explicitly NOT the full translation action closed by
    IDEA-20260806-c5d183 / KN-FIND-ffe1df Theorem C; it is the restriction of
    Sigma to the coarsest possible quotient of E(F_q), and it is used to filter
    LEGS (which range over the full, composite-order E(F_q)), never to filter
    TARGETS (which live in G and on which pi is identically zero -- see
    IDEA-20260922-153a90 in this same batch for why that distinction is the
    entire content of the obstruction).

    TRICHOTOMY: PARTIAL-ACTION (Class I). The tracked object is the relation
    vector over the factor base; pi acts on the LABEL of each leg (its parity
    class), not on the relation semantics, exactly as in cedd2f and
    IDEA-20260915-3119c9, whose class this record's V' also belongs to.

    LOSSY-PROJECTION TEST AGAINST THAT SIGMA. pi discards every bit of x_P
    except one (its trace); this is exactly cedd2f's test, reproduced here only
    because the WINDOW being tested is new (V' instead of V) and the POPULATION
    being tested is new (the eleven-curve deployed census instead of a toy
    Trimoska cell or a generic model). The discard is Sigma-compatible because pi
    is a group homomorphism (pi(P+Q) = pi(P) + pi(Q)), so the retained bit
    propagates deterministically under the addition the relation search performs
    -- this is not re-derived here, it is cedd2f's proof, cited and reused.

    WHY THE FIX IS THE MINIMAL ONE. Removing the constant term is the SMALLEST
    possible change to Semaev's window that restores confinement at odd n: it
    drops exactly one dimension (the one vector, "1", whose trace carries the n
    mod 2 dependence) and touches nothing else. A window that instead added a
    dimension, or replaced the whole basis, would confound the yield effect with
    a base-size effect; V' isolates the trace-parity effect from every other
    design variable, which is what "separated from per-attempt cost by a
    measurement rather than a model" (this lane's seam) requires: the minimal
    test below holds |V| - 1 (not the full V) fixed across the confined and
    unconfined arms so the ONLY design variable that changes is confinement.

    WHY THIS IS NOT A RESTATEMENT OF IDEA-20260915-3119c9's RULE R1. R1 selects
    an AFFINE slice {x in W : Tr(x) = Tr(a)} of dimension l+1 by SEARCHING over
    K random slices for one whose E-side count |V'_E| is enriched (an
    extreme-value design problem with a measured 3-8x gain and an 8x cap). This
    record's V' needs NO search: it is Semaev's own canonical window with one
    basis vector removed, achieves F0 = 0 by a one-line algebraic argument
    (Newton's identity), and its content is entirely in WHICH of the eleven named
    curves this free construction helps (Tr(a)=0) versus empties (Tr(a)=1) --
    a population-indexed fact 3119c9 does not state because it works on one toy
    curve (Trimoska, a=1, n=15/17/19) throughout.

    KN-OPEN-020 CLASS DECLARATION. V' is an F_2-linear subspace; its membership
    predicate is a rank-(k-1) linear test in the un-descended model and is
    F_2-linear in the Weil-descended model -- the SAME class as cedd2f's V and
    IDEA-20260918-9abf42's Frobenius-stable subspaces, not a new class. Charged
    costs: description O(k) field elements (a basis of V'); membership one
    F_2-linear test; relation and descent costs inherited unchanged from whatever
    decomposition engine is used (this record proposes no new solver); time and
    memory as in target_complexity below.
