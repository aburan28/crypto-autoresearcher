idea:
  id: IDEA-20260803-202a15
  question_id: RQ-SDEG-001
  title: >-
    The D6 below-freeze collapse - one closed form that must predict BOTH committed n=12
    deficits (7,110 and 17,947) or a named no-go that condemns d_reg cost predictions at
    D >= 6
  class: measurement
  claim: >-
    THIS PROGRAMME HAS EXACTLY ONE LIVE, UNEXPLAINED, POSITIVE-SIGNAL MEASUREMENT IN THE
    ENTIRE ECDLP LINE, AND THREE GOALS ARE BLOCKED ON THE MODEL IT FALSIFIES.
    EV-SIG-008 reports, at n = 12 seed 2, a column-matched generic null with a GENUINE D6
    rank defect of 7,110 against the semi-regular prediction - rank 149,410 against 156,520 -
    falsifying the freeze theory's "null validates at D6 for n >= 12" prediction AT THE EXACT
    CELL RECORDED AS ITS DECISIVE TEST. It is explicitly NOT variety saturation: rank sits far
    below ncols - |V| = 174,031, which is the shape every n = 9 null took. The record names it
    a new failure shape - below-freeze collapse in the top sextic columns - and names nothing
    further. Independently, EV-DREG-008 pins deficit_genuine = 17,947 at the SAME n = 12,
    D = 6 under the support-restricted CTRL-B null. TWO DIFFERENT NULLS, TWO DIFFERENT
    DEFICITS, ONE UNEXPLAINED PHENOMENON, AND NO MODEL THAT PRODUCES EITHER NUMBER.
    THE CLAIM IS THAT THIS IS DECIDABLE BY A LADDER AND THAT ONE MODEL MUST PRODUCE BOTH
    NUMBERS. EV-SIG-006 already supplies the mechanism candidate in its own diagnosis: D6 is
    the FREEZE DEGREE of the semi-regular Hilbert series, at which the model's frozen quotient
    is unrealizable by any generic boolean system - measured variety sizes 0/1/6 against a
    frozen 3,112 dims at n = 9. A Hilbert-series model that TRUNCATES at freeze discards
    information the actual boolean system retains, and the discarded quantity is computable.
    PRE-REGISTERED: a single untruncated boolean/Koszul series, with the field equations
    x_i^2 = x_i carried rather than absorbed, predicts extra_D(n, D, null-family) within 5 per
    cent at every cell of an n = 9..13 by D = 5,6 ladder, AND RETURNS 7,110 FOR THE
    COLUMN-MATCHED NULL AND 17,947 FOR THE SUPPORT-RESTRICTED NULL AT n = 12, D = 6. That is
    two independent point predictions against committed numbers from one model with no free
    parameter fitted to either.
    FALSIFIED IF the closed form misses either committed number by more than 5 per cent, or if
    no candidate form predicts the ladder. AND THE FALSIFICATION IS AS VALUABLE AS THE
    CONFIRMATION: a named no-go says d_reg-derived cost predictions are UNUSABLE at D >= 6,
    which is exactly the regime GOAL-SDEG-001, GOAL-DREG-001 and GOAL-SIG-001 exist to
    measure, and which IDEA-20260803-fa9839 needs in order to convert a solving degree into a
    charged D_trial.
  mechanism: >-
    WHY THIS IS THE HIGHEST-VALUE MEASUREMENT AVAILABLE, STATED AS A DEPENDENCY CHAIN RATHER
    THAN AN OPINION. GOAL-SDEG-001 is a "certificate-backed Semaev solving-degree scaling law"
    held at design PASS. GOAL-DREG-001 is measuring a degree-of-regularity deficit and its
    headline 17,947 is described in its own goal record as QUARANTINED AS CONFOUNDED until
    CTRL-B lands. GOAL-SIG-001 has repaired its protocol to SIG-D6-NULL-RECAL-v2 and defers
    the calibration executor. ALL THREE ARE MEASURING AGAINST A SEMI-REGULARITY MODEL THAT A
    COMMITTED MEASUREMENT SAYS IS WRONG AT D = 6, AND D = 6 IS WHERE THEIR QUESTIONS LIVE.
    Repairing or condemning the model is upstream of all three and consumes none of their
    budgets.
    WHY THE TWO-NUMBER REQUIREMENT IS THE ENTIRE DESIGN. A model fitted to one deficit is a
    fit. A model that produces 7,110 under one null family and 17,947 under another, at the
    same n and D, with no parameter tuned to either, is a mechanism. THE PROGRAMME'S OWN
    HISTORY IS WHY THIS IS NON-NEGOTIABLE: EV-IC-002 retracted a support verdict because its
    success criterion was revised after the prior criterion had been observed to fail, and
    KN-FIND-029 records five false-green escapes across three repairs of one mutation control.
    A single-number target here would be indistinguishable from those failures. Two numbers
    from two null families is a constraint a wrong model cannot satisfy by accident.
    WHAT THE MECHANISM CANDIDATE ACTUALLY IS, SO THAT IT CAN FAIL. The semi-regular Hilbert
    series prediction is the positive part of a truncated series, and the truncation is a
    MODELLING CONVENTION rather than a property of the system. At the freeze degree the
    convention discards a quotient that the boolean system, which carries x_i^2 = x_i as
    genuine relations, does not discard. The candidate closed form is therefore the
    untruncated series with the field-equation contribution carried explicitly, and the
    predicted deficit is the discarded quotient's dimension at degree D. That quantity depends
    on the SUPPORT of the system - which is exactly why the two null families should give
    DIFFERENT deficits, and why EV-SIG-006's finding that "the support asymmetry exists at all
    degrees and is exactly explained by the up-closure law" is the ingredient that connects
    them. IF THE UP-CLOSURE LAW PLUS THE UNTRUNCATED SERIES DOES NOT PRODUCE THE TWO NUMBERS,
    THE CANDIDATE IS WRONG AND THAT IS A CLEAN RESULT.
    WHY THE LADDER AND NOT A SINGLE REPAIR. EV-SIG-008 records that the D5 picture at n = 12
    is CLEAN - support-induced share 0.0 per cent against 40.6 per cent at n = 9 - so the
    phenomenon TURNS ON between n = 9 and n = 12 at D = 6 while D = 5 becomes cleaner over the
    same range. A model must reproduce that crossing, not just one point on one side of it.
    The ladder is what makes the crossing visible and is the cheapest structure that can
    discriminate a mechanism from a coincidence.
  novelty_status: adaptation
  novelty_screen:
    screened_on: '2026-08-03'
    corpus_paths_grepped:
    - ledger/evidence/EV-SIG-006.yaml
    - ledger/evidence/EV-SIG-008.yaml
    - ledger/evidence/EV-DREG-007.yaml
    - ledger/evidence/EV-DREG-008.yaml
    - ledger/goals/GOAL-SIG-001.yaml
    - ledger/goals/GOAL-SDEG-001.yaml
    - ledger/goals/GOAL-DREG-001.yaml
    - knowledge/open-problems/KN-OPEN-002.md
    grep_results:
    - >-
      GOAL-SIG-001's SIG-D6-NULL-RECAL-v2 is a NULL RECALIBRATION protocol - it repairs how
      the null is built. THIS RECORD IS NOT THAT: it asks for a PREDICTIVE MODEL of the
      deficit across a ladder, under BOTH null families, and would consume the recalibrated
      null as an input if one existed. Complementary, and executable against the currently
      committed nulls without waiting for the recalibration.
    - >-
      GOAL-DREG-001's BATCH-004 CTRL-B pins deficit_genuine in [1,931, 17,947] at one cell and
      is explicitly a SINGLE-CELL structural measurement whose own evidence record
      (EV-DREG-008) forbids reading it as an n-ladder law. This record supplies the ladder
      that record says it is not.
    - >-
      KN-OPEN-002 asks about the growth of the Groebner solving degree for prime-field
      summation-polynomial systems. THAT IS THE PARENT QUESTION AND THIS IS A PREREQUISITE FOR
      IT: a growth law cannot be read off a model that is wrong at the degrees measured.
    - >-
      No corpus record proposes a closed form for extra_D, nor requires one model to produce
      both committed n = 12 deficits. Grep across ledger/proposals for "below-freeze",
      "extra_6", "untruncated" returned nothing.
    literature_verified: []
    literature_unverified:
    - >-
      Semi-regular sequences, the Bardet-Faugere-Salvy degree-of-regularity framework, and
      Hilbert series for boolean systems with field equations are the natural home for the
      candidate closed form and ARE NOT RETRIEVED - primary sources are unreachable from this
      environment. THE MODEL MUST THEREFORE BE DERIVED IN-REPO FROM FIRST PRINCIPLES AND
      VALIDATED AGAINST THE COMMITTED NUMBERS, not transcribed. Any recalled form may be used
      only as a candidate to test, never as an authority, and must be labelled as such.
    conclusion: >-
      Adaptation. Measuring Macaulay rank against a Hilbert-series prediction is standard and
      is what EXP-SIG and EXP-DREG already do. The contribution is treating the truncation
      convention as the suspect, requiring one model to produce two committed numbers from two
      null families, and running the n-ladder across the crossing where the phenomenon turns
      on.
  assumptions:
  - >-
    The two committed numbers are read as-is and are NOT re-derived by this work as a way of
    making them agree with a model. 7,110 comes from EV-SIG-008's column-matched generic null;
    17,947 comes from EV-DREG-008's support-restricted CTRL-B. THEY ARE DIFFERENT NULLS AND
    THE MODEL MUST EXPLAIN THE DIFFERENCE, not average them. A record that reconciles them by
    reinterpreting either measurement is inadmissible.
  - >-
    The candidate closed form is FROZEN BEFORE any new cell is computed, with its parameters
    fixed. Fitting a parameter after seeing a ladder cell converts the test into a
    description and is the exact failure EV-IC-002 retracted a verdict for.
  - >-
    Rank computations are exact over the working field with a reproducible pivoting order and
    a persisted system hash, following the EXP-DREG lineage. The EV-DREG-004 incident - a
    destroyed checkpoint at 24.93 per cent of columns, with a measured carrier-codec
    bottleneck - is the reason chunked execution under a fresh write_scope with per-chunk
    receipts is required rather than suggested.
  predictions:
  - metric: two_number_point_prediction
    direction: same
    minimum_effect: >-
      'The frozen closed form returns extra_6 within 5 per cent of 7,110 for the
      column-matched generic null AND within 5 per cent of 17,947 for the support-restricted
      null, both at n = 12, D = 6, with NO parameter fitted to either. Two independent point
      predictions against committed numbers; missing either falsifies the candidate.'
  - metric: ladder_prediction_error
    direction: same
    minimum_effect: >-
      'Median absolute relative error below 5 per cent, and maximum below 15 per cent, across
      the n = 9..13 by D = 5,6 ladder under both null families. A model that hits n = 12 and
      misses the ladder is fitted to a point rather than describing a mechanism.'
  - metric: crossing_reproduction
    direction: same
    minimum_effect: >-
      'The model reproduces the SIGN CROSSING recorded in EV-SIG-008 - D5 support-induced
      share falling from 40.6 per cent at n = 9 to 0.0 per cent at n = 12 while the D6 defect
      turns on over the same range. A model that predicts the magnitudes but not the crossing
      is describing two unrelated regimes and must say so.'
  - metric: saturation_shape_discrimination
    direction: same
    minimum_effect: >-
      'At every cell the model states whether the null saturates at rank = ncols - |V| (the
      n = 9 shape recorded in EV-SIG-006) or collapses below it (the n = 12 shape recorded in
      EV-SIG-008), and is correct at 100 per cent of cells. This is a categorical prediction
      that is much harder to satisfy by accident than a numeric one.'
  - metric: negative_disposition_completeness
    direction: same
    minimum_effect: >-
      'If no candidate form passes, the batch emits an explicit statement of which D and n
      ranges make d_reg-derived cost predictions unusable, in a form IDEA-20260803-fa9839 can
      consume as a NOT-THRESHOLD-CONVERTIBLE finding. A negative that does not produce that
      statement has not finished.'
  minimal_test:
    design: >-
      (1) Derive the candidate untruncated boolean/Koszul closed form in-repo, with the
      up-closure law carried explicitly; FREEZE it with its parameters in a hash-bound
      contract, together with all five predictions, BEFORE any new rank is computed. (2)
      Evaluate the frozen form at the two committed n = 12 cells and record the two-number
      result FIRST - this costs no compute and is the gate. (3) Only if the gate passes,
      compute the ladder: n = 9..13, D = 5,6, both null families, chunked under a fresh
      write_scope with per-chunk receipts and a persisted system hash. (4) n = 14 is OPTIONAL
      and explicitly out of the completion gate; a truncated ladder degrades gracefully and
      reports what it covered. (5) Report the crossing and the saturation-shape
      discrimination. (6) Emit either the validated closed form or the negative disposition in
      fa9839-consumable form.
    controls:
    - >-
      TWO-NUMBER GATE, evaluated with zero compute BEFORE the ladder is authorized. This is
      the cheapest possible falsification of the candidate and it runs first.
    - >-
      FROZEN-PARAMETER CONTROL - the contract records the parameter values and their hash;
      any post-hoc adjustment voids the batch rather than producing a revised model.
    - >-
      DUAL-NULL CONTROL - both null families at every cell, so the model is constrained by the
      DIFFERENCE between them and not only by their levels.
    - >-
      KNOWN-SHAPE CONTROL at n = 9, where EV-SIG-006 records that every histogram-matched
      generic null saturates to rank = ncols - |V|. The model must reproduce that saturation
      before any n = 12 prediction is believed.
    - >-
      RECOMPUTATION CONTROL - one cell per null family recomputed independently with a
      different pivoting order and matched exactly, addressing the EV-DREG-004 lineage.
    required_metrics:
    - the two-number gate result with relative errors against 7,110 and 17,947
    - per-cell extra_D with relative error, both null families, across the ladder
    - saturation-shape classification per cell against the model's categorical prediction
    - the D5 support-induced share across n, reproducing the 40.6 -> 0.0 per cent crossing
    - per-chunk receipts, system hashes, and the independent recomputation residual
  falsification_conditions:
  - >-
    'F1 - the two-number gate misses either committed value by more than 5 per cent: the
    candidate closed form is WRONG. The ladder is NOT authorized on that candidate and the
    batch either proposes a second frozen candidate or reports the negative.'
  - >-
    'F2 - the ladder error exceeds the stated bounds: the form describes n = 12 and not the
    phenomenon; report as a fitted description, not a mechanism.'
  - >-
    'F3 - the saturation-shape prediction is wrong at any cell: the model does not distinguish
    the two regimes and cannot be used to repair d_reg predictions.'
  - >-
    'F4 - the n = 9 known-shape control does not reproduce: the model contradicts a committed
    diagnosis and the contradiction is routed to a correction record.'
  - >-
    'F5 - no candidate passes: THE NEGATIVE DISPOSITION IS THE DELIVERABLE - d_reg-derived
    cost predictions are unusable at D >= 6 over the tested n range, stated with its exact
    boundary and in fa9839-consumable form. This outcome is planned for, not a failure.'
  confounders:
  - >-
    THE TWO COMMITTED NUMBERS COME FROM DIFFERENT EXPERIMENTS WITH DIFFERENT NULL
    CONSTRUCTIONS, AND MAY DIFFER FOR REASONS THAT HAVE NOTHING TO DO WITH THE MECHANISM -
    different seeds, different support histograms, different admission metrics. GOAL-DREG-001's
    own record describes the raw 17,947 as QUARANTINED AS CONFOUNDED. If the model cannot
    explain the difference, the honest reading is that the two numbers are not comparable, not
    that the model failed. THE CONTRACT MUST STATE WHICH READING APPLIES BEFORE THE GATE RUNS.
  - >-
    Single seeds. EV-SIG-008 is explicitly `single_cell` at seed 2. A ladder at one seed per
    cell cannot separate a mechanism from seed variation, and at least two seeds per cell are
    required wherever the budget permits, with single-seed cells marked.
  - >-
    Rank at n = 13, D = 6 is large and the EV-DREG-004 incident shows this lineage has already
    lost a checkpoint at 24.93 per cent of columns to an infrastructure failure. A crash is an
    infrastructure outcome and NEVER mathematical evidence (AGENTS.md rule 5); the chunked
    design exists so that a crash costs a chunk rather than a cell.
  - >-
    Boolean and prime-field systems are different objects. The SIG/DREG lineage is boolean;
    the ECDLP target is prime-field. A repaired boolean d_reg model does not transfer, and any
    citation toward prime-field cost must carry that gap explicitly.
  interpretation_limits:
  - >-
    THIS IS A MODEL REPAIR, NOT AN ATTACK. A validated closed form makes d_reg predictions
    usable; it does not make any system easier to solve and moves no exponent.
  - >-
    Claim tier `toy`. KN-OPEN-002 is NOT closed by a repaired model at n <= 13; a growth law
    needs the growth range, which this ladder does not reach.
  - >-
    Nothing here supports or weakens H-SIG-001, H-DREG-001, or any hypothesis about the
    Semaev cascade. It is about the NULL, which is the instrument, and instrument findings are
    not mechanism findings - EV-STR-003 and EV-DS-004 are this programme's own precedents for
    keeping that distinction.
  heuristic_assumptions:
  - id: HEUR-BF-1
    statement: >-
      The D6 deficit is a deterministic function of (n, D, support histogram, null family) and
      not a stochastic property of the particular random system drawn.
    rigorous_support: >-
      NOT ESTABLISHED. EV-SIG-008 is a single cell at a single seed and explicitly labelled
      `single_cell`. If the deficit is seed-dependent at fixed support, the entire premise
      that a closed form exists is wrong.
    validation_plan: >-
      MEASURE IT FIRST - at least two seeds per cell wherever budget permits, and report the
      seed-to-seed spread BEFORE reporting any model error. A spread comparable to the model
      error means the model is fitting noise and must be reported as such, not as a fit.
  - id: HEUR-BF-2
    statement: >-
      The truncation convention at the freeze degree is the responsible discrepancy, so an
      untruncated series with field equations carried is the right candidate family.
    rigorous_support: >-
      DERIVED FROM EV-SIG-006's OWN DIAGNOSIS - that D6 is the freeze degree and the frozen
      quotient of 3,112 dims is unrealizable by any generic boolean system, with variety sizes
      0/1/6 measured. That is committed and independently reviewed. THE INFERENCE FROM "THE
      CONVENTION IS SUSPECT" TO "THIS PARTICULAR UNTRUNCATED FORM IS RIGHT" IS NOT SUPPORTED
      and is the weakest link.
    validation_plan: >-
      The two-number gate is exactly this heuristic's test and it costs no compute. A candidate
      that fails it is discarded before any ladder is authorized, which bounds the cost of
      being wrong to zero.
  target_complexity:
    time_exponent: >-
      No attack. The object is a predictive closed form for a rank deficit.
    memory_exponent: >-
      Governed by the Macaulay matrix at n = 13, D = 6, which is the batch's real constraint
      and the reason for chunking; the ncols figure at n = 12 D = 6 is already 174,031 from
      the committed record and n = 13 is materially larger.
    best_known: >-
      The semi-regular prediction, which EV-SIG-008 falsifies at the exact cell recorded as its
      decisive test. There is currently NO usable model at D >= 6 for n >= 12, which is the
      state this record addresses.
    hidden_overhead: n/a
    tradeoff_note: n/a
  dominated_by: >-
    Not applicable - no attack, no Pareto point, no cost claim. Written explicitly rather than
    left null.
  sota_delta: >-
    Zero on every attack axis. The model delta is from one falsified prediction and two
    unexplained committed deficits at the same cell, to either a closed form validated against
    both without fitting, or a stated boundary beyond which d_reg cost predictions are unusable
    - which is itself the input IDEA-20260803-fa9839 needs and cannot currently obtain.
  instrument_failure_guards:
    decision_variable: >-
      The relative error of the frozen closed form against extra_D, and the categorical
      saturation-shape classification.
    what_would_make_it_vary: >-
      n and the null family - two externally imposed knobs whose predicted effects are already
      recorded in committed evidence and are OPPOSITE in direction at D5 and D6 (the D5
      support-induced share falls 40.6 -> 0.0 per cent while the D6 defect turns on). An
      instrument that does not reproduce that opposition is not responding to the parameters it
      claims to model.
    power_against: >-
      A wrong truncation convention (the two-number gate), a model fitted to one cell (the
      ladder), and a model that gets magnitudes right for the wrong reason (the categorical
      saturation-shape prediction).
    no_power_against: >-
      Seed-level stochasticity if HEUR-BF-1 fails, which is measured first for that reason.
      Prime-field systems, which are a different object. Any question about whether the Semaev
      cascade is exploitable, which is GOAL-SIG-001's question and is untouched here.
    demonstrated_movement: >-
      By the n = 9 known-shape control, which has a committed expected outcome (saturation at
      rank = ncols - |V|), and by the two-number gate, which is two committed values the model
      must hit without fitting.
    lessons_addressed: >-
      Addresses EV-IC-002 - a criterion revised after the prior criterion was seen to fail - by
      freezing the model's parameters and its five predictions before any new cell is computed
      and voiding the batch on post-hoc adjustment. Addresses EV-DREG-004 - a destroyed
      checkpoint at 24.93 per cent of columns - by chunked execution with per-chunk receipts,
      so an infrastructure failure costs a chunk and is reported as infrastructure under rule 5.
  estimated_cost:
    implementation: medium
    compute: medium
  compute_budget_note: >-
    THE GATE COSTS NOTHING - evaluating a frozen closed form at two committed cells is
    arithmetic, and it is what authorizes the rest. The ladder is exact rank over Macaulay
    matrices at n = 9..13, D = 5,6, two null families, at least two seeds where affordable;
    n = 13 D = 6 dominates and n = 14 is optional and outside the completion gate. Chunked
    under a fresh write_scope so a truncated ladder reports what it covered rather than
    failing.
  recommended_priority: high
  dependencies:
  - >-
    Reads EV-SIG-006, EV-SIG-008, EV-DREG-007, EV-DREG-008 and their committed run artifacts.
    Writes none of them.
  - >-
    Does NOT depend on GOAL-SIG-001's SIG-D6-NULL-RECAL-v2 and does not wait for it; would
    consume a recalibrated null as an additional family if one lands.
  - >-
    FEEDS IDEA-20260803-fa9839 - its negative disposition is the NOT-THRESHOLD-CONVERTIBLE
    finding that record's deferred-measurement ranking requires, and its positive disposition
    is the d_reg-to-D_trial conversion that record leaves as a free parameter.
  status: proposed
  proposed_by: analysis-session
  proposed_at: '2026-08-03'
