      verified_by: idea-generator session 2026-09-30, file read
    - ref: KN-OPEN-020
      provenance: internal
      claim: >-
        Implicit membership is an open class. Rotation against k masks is
        that class. It is not a bounded-degree plane predicate.
      verified_by: idea-generator session 2026-09-30, file read
    - ref: "birthday theorem / balls and bins (classical; no source opened)"
      provenance: recalled
      claim: >-
        Expected colliding pairs of a uniform random function from a set
        of size C into a group of order r equal C(C-1)/(2r). Hedge:
        recalled.
      verified_by: null
  assumptions:
    - >-
      F2 and F6 are components. The lens is the quotient collision count.
    - >-
      The curve is E_0 with trace -1, so the endomorphism polynomial is
      tau^2 + tau + 2, not a general trace. A random binary curve is a
      different kernel and is not a silent substitute.
    - >-
      k-orbit means the union of the <tau, -1> orbits of k subgroup
      points, matching the audit's full-orbit construction at the level
      of physical points. 332/83 = 4 and 498/83 = 6 are noted as the
      archived scales; this record does not assert how those runs
      deduplicated signs beyond the handoff's physical-point counts.
  proof_search_map:
    bottleneck: >-
      The supply of informative F_r-rows among a k-orbit base. If that
      supply is only the birthday supply, no relation phase exists below
      Theta(sqrt(r)) samples, and the tuple ceiling remains a coverage
      bound.
    baseline_embedding:
      parameter_slice: >-
        Archived expectations C(C-1)/(2 r83) = 7.832e-12 and 8.868e-11
        at (B, m) = (332, 3) and (498, 3). Not re-measured. The toy slice
        is n = 19, m = 3, k in {2, 3}, with C chosen so the birthday
        expectation lies in [5, 50].
      reproduction_check: >-
        Verify tau^2(P) + tau(P) + [2]P = O on two random subgroup points
        before counting rows. A failure means the kernel lemma was
        applied to the wrong curve.
    observation_collision:
      observable: >-
        informative rank of the collision rows after deleting the kernel
        spanned by the characteristic relation of each orbit
      distinct_preimage_search: >-
        A kernel vector and a non-kernel collision, if any exists, are
        two preimages of "a linear dependence". The test counts them
        separately. If every dependence is in the kernel, informative
        rank is 0 and the birthday expectation is then checked against
        that zero only when the expectation was below 1; the toy cell
        is chosen so the expectation is in [5, 50], where a pure kernel
        cannot explain the collisions.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          The relation module modulo (tau^2 + tau + 2), rather than the
          raw multiset count.
        predicted_gain: >-
          Removes the trivial rows from the rank. Predicted collision
          count stays the birthday count (delta = 0). A stable delta >=
          0.05 would be an exponent move and is not predicted.
    quantifier_order: >-
      FOR ALL prime degrees of E_0: the characteristic relation is the
      zero log-row. Separately, at the n = 19 cell, the prediction is
      FOR ALL seeds the ratio of informative colliding pairs to
      C_eff(C_eff-1)/(2r) lies in [1/2, 2]. The conditional exponent
      claim has the opposite quantifier and is not asserted.
    method_ceiling:
      strongest_certifiable_claim: >-
        Either the informative collision count matches the birthday
        count at n = 19 to within a factor 2, or it does not. A match
        does not prove the same match at m = 83. A mismatch of factor
        r^{0.05} at one degree does not by itself prove an exponent at
        m = 131.
      nearby_object_control: >-
        n = 17, where ord_17(2) = 8 and the cyclotomic block splits, is
        the nearby object. An excess that appears at n = 17 and not at
        n = 19 is an artifact of the split block, not evidence about
        m = 83 or m = 131. The kernel check must still pass at n = 17;
        if "the kernel is zero on logs" fails there, the lemma was
        mis-stated. A relabelled Z/rZ with a randomly chosen linear
        relation imposed as a fake kernel is the second control: the
        informative count there is the birthday count by construction,
        and an instrument that reports a large delta on it is broken.
    proof_obligations:
      - claim: tau^2 + tau + 2 = 0 on E_0 and the log-row is zero in F_r
        responsibility: correctness
      - claim: birthday expectation C(C-1)/(2r) under a uniform random sum map
        responsibility: success_probability
      - claim: sample count to first collision is Theta(sqrt(r)) when delta = 0
        responsibility: runtime
      - claim: a stable delta >= 0.05 on two irreducible-block degrees moves the exponent to (1-delta)/2
        responsibility: runtime
      - claim: the kernel transfers to every prime degree; delta does not
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: informative_collisions_over_birthday
      direction: lower
      minimum_effect: ratio in [1/2, 2] on every n = 19 seed; a ratio >= r^{0.05} on every seed is the exponent reading and falsifies the prediction
    - metric: kernel_rows_that_are_nonzero_in_F_r
      direction: lower
      minimum_effect: zero such rows; any nonzero kernel row voids the quotient
    - metric: canonicalisation_bit_rotations_per_sample
      direction: lower
      minimum_effect: linear in m = 19, at most 2*m rotations per sample
  minimal_test:
    design: >-
      E_0 over F_{2^19}. Compute r. Choose k = 2 and k = 3, m = 3, and
      the smallest multiset budget whose birthday expectation lies in
      [5, 50]. Enumerate those multisets of the k orbits, reduce rows
      modulo the characteristic relation, and count informative
      colliding pairs and the F_r-rank. Repeat on one holdout seed.
      Run the same instrument on the relabelled Z/rZ control and, as a
      separate nearby object, on E_0 over F_{2^17}, reported apart and
      not pooled. Do not enumerate a base of millions of points. Do not
      solve ECC2K-130. Do not call a Gröbner solver.
    controls:
      - Relabelled Z/rZ with a planted fake kernel, where delta must read as 0
      - n = 17 nearby object, not pooled with n = 19
      - Kernel check tau^2(P) + tau(P) + [2]P = O on two points before the count
    required_metrics:
      - r, C_eff, birthday expectation, informative collision count, ratio, rank
      - kernel-row checksum
      - canonicalisation rotations per sample
      - additions charged
  falsification_conditions:
    - >-
      The kernel check fails on E_0: the quotient is the wrong object and
      no collision count is read.
    - >-
      The Z/rZ control reports a ratio outside [1/2, 2]: the instrument
      invents excess, and the curve cell is not read.
    - >-
      Every n = 19 seed has ratio >= r^{0.05}: the prediction delta = 0
      is false at n = 19. That is a lead only at n = 19. It becomes an
      exponent claim at m = 83 only after the same ratio bound is seen
      at a second irreducible-block degree, which this test does not
      contain.
    - >-
      Every n = 19 seed has ratio in [1/2, 2]: the conditional exponent
      is unsupported at this cell, and the archived m = 83 cells stay
      without a relation phase under this model.
  confounders:
    - >-
      Counting kernel rows as informative inflates the ratio. The output
      must split the two counts.
    - >-
      Orbit size is 2*19 when negation is included, not 19. Using B = k*19
      instead of B = k*38 changes C. The test logs the orbit size it built.
    - >-
      n = 17's split block (ord_17(2) = 8) can create invariant structure
      n = 19 does not have. Pooling them hides the artifact.
  interpretation_limits:
    - >-
      KN-OPEN-020 class of this base: implicit-membership via rotation of
      k masks. Not a high-degree plane factor base, and not a claim that
      every implicit base works.
    - >-
      Predicted exponent remains 1/2. The conditional (1-delta)/2 is a
      falsification branch, not a claimed speedup.
    - >-
      Transfer to m = 83 or m = 131: the kernel identity only. delta
      requires a new measurement. The archived cells cannot supply it
      (expected collisions 7.8e-12 and 8.9e-11).
    - >-
      Full-cost S stays null. A collision among base points is not a
      solved public target.
    - No n = 53 wall-clock ratio is cited.
  heuristic_assumptions:
    - id: H1
      statement: >-
        After quotienting by tau^2 + tau + 2, the sum map on the
        remaining unordered m-multisets of a k-orbit base on E_0 is
        indistinguishable from a uniform random function into the
        prime-order subgroup, as judged by the number of colliding pairs:
        that number is within a factor 2 of C_eff(C_eff-1)/(2r) when the
        expectation lies in [5, 50].
      rigorous_support: >-
        The classical birthday theorem gives the expectation exactly for
        a uniform random function, and concentration about that
        expectation for pairwise-independent hashes. The kernel lemma is
        the rigorous half (an endomorphism identity). The random-function
        half is the imitation, and it is what delta = 0 asserts.
      validation_plan: >-
        Sample k in {2, 3}, one seed and one holdout, at n = 19, m = 3,
        birthday expectation in [5, 50], enumeration of those multisets
        only. Compare the informative collision count to the birthday
        expectation. Tail check: the heaviest fiber among informative
        collisions is at most 4 when the expectation is at most 50; a
        fiber above 10 is a tail failure even if the mean ratio is near 1.
        The Z/rZ control must pass the same tail. Parameters recorded:
        n, r, k, m, orbit size, C_eff. Transfer assumption: none, for
        delta. The kernel identity is checked at n = 19 and n = 17 and
        is claimed for every prime degree of E_0 by the endomorphism
        polynomial, which does not depend on the degree.
  target_complexity:
    time_exponent: >-
      Predicted r^{1/2} samples to the first informative collision
      (delta = 0). Conditional r^{(1-delta)/2} only on the falsification
      branch delta >= 0.05 at two irreducible-block prime degrees, which
      is not claimed.
    memory_exponent: >-
      Distinguished-point memory r^{0} up to the usual polylog store if
      collisions are sought by a walk; the toy test stores the enumerated
      image because C_eff is a few multiples of sqrt(r) at n = 19 only.
    best_known: >-
      Frobenius-class Pollard rho, about sqrt(pi * r / (4 * m))
      iterations. ECC2K-130 about 2^60.9. A delta = 0 outcome is
      dominated by that algorithm on time, memory, and queries.
    hidden_overhead: >-
      The sqrt(pi/2) walk constant, O(m) canonicalisation rotations per
      sample, and m-1 additions per multiset. No o(1) term hides a
      subexponential. The conditional branch would still carry those
      factors.
    tradeoff_note: >-
      Same distinguished-point tradeoff as rho (KR-RHO-6239aa): linear
      parallelism, memory proportional to stored points. A nonzero delta
      would move the time exponent and leave that tradeoff shape. It
      would not create a subexponential memory term by itself.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
