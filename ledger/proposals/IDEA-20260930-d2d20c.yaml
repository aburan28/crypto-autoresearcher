      verified_by: idea-generator session 2026-09-30, file read
    - ref: IDEA-20260926-1db0e8
      provenance: internal
      claim: >-
        Large-prime variants on subspace bases, priced above rho when the
        oracle must locate the large leg. This record has no large prime
