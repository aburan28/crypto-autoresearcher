      - KR-RHO-6239aa
    nearest:
      - ref: KR-IC-b0fcda
        provenance: internal
        relation: adjacent
        delta: >-
          That row is the n^2 linear-algebra saving from a
          Frobenius-invariant factor base on a subfield curve. This
          record does not claim that saving. At prime degree with
          ord_n(2) = n-1 there is no stable subspace of index-calculus
          dimension. The delta is the collision exponent in the quotient
          by tau^2 + tau + 2, which the row does not define. Map row
          read; Galbraith-Granger-Merz-Petit was not opened.
      - ref: KR-RHO-037e22
        provenance: internal
        relation: adjacent
        delta: >-
          Frobenius-class rho is the predicted dominating algorithm
          (delta = 0). Quantitative gap of the conditional branch, if it
          were ever measured: a factor r^{delta/2} on the relation-phase
          sample count only, not on a solved target. Not claimed.
      - ref: KR-IC-f5c584
        provenance: internal
        relation: orthogonal
        delta: >-
          The trace morphism forces a linear equation on the Weil descent
          of S_3. This record's kernel is an endomorphism relation on
          logs, not a descent equation. Different matrix, different field.
      - ref: KR-IC-5931ee
        provenance: recalled
        relation: adjacent
        delta: >-
          The prime-field negative is not this object. That row is E(F_p)
          and a cost at least the generic algorithms there. This record is
          E_0 over F_{2^n} with n prime. It adds the informative-collision
          count of a target-independent k-orbit base after quotienting by
          tau^2 + tau + 2, predicted within a factor 2 of C(C-1)/(2r)
          (exponent still 1/2). At the archived m = 83 cells that count is
          7.832e-12 (B = 332, m = 3) and 8.868e-11 (B = 498, m = 3), so
          those cells have no relation phase under the birthday model. The
          unclaimed branch is a factor r^{delta/2} on the sample count only
          if delta >= 0.05 on two irreducible-block degrees.
      - ref: KR-IC-73db3f
        provenance: internal
        relation: orthogonal
        delta: >-
          Not a subspace choice. That row chooses an F_2-subspace V to
          shrink dim V^{(i)} after Weil descent. This base is a union of
          k Frobenius-negation orbits with membership by normal-basis
          rotation, and the lever is the collision ratio in the quotient
          by tau^2 + tau + 2, predicted in [1/2, 2]. No dim V^{(i)} and
          no Weil-descent variable count moves. The quantitative delta is
          the archived expected colliding pairs, 7.832e-12 and 8.868e-11,
          which that row does not state.
    searched:
