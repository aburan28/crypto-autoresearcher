idea:
  id: IDEA-20260930-d2d20c
  question_id: RQ-CERTBIN-836ce2
  added: '2026-09-30'
  status: proposed
  approved_by: null
  title: >-
    Informative syzygies of a k-orbit base, modulo tau^2 + tau + 2, against
    the birthday count
  class: mechanism
  claim: >-
    Representation class R1 of RQ-ECDLP-623a32 (normal-basis x-coordinate
    of k stored orbit masks). The attack stage is relation collection: the
    rank of informative syzygies among a target-independent k-orbit factor
    base. Predicted time exponent: still 1/2. Conditional exponent: if the
    informative-collision count exceeds the birthday count by r^{delta}
    with delta >= 0.05 on two prime degrees whose nontrivial cyclotomic
    block is irreducible, the first-collision sample count falls from
    r^{1/2} to r^{(1-delta)/2}. That conditional is not the prediction.
    The prediction is delta = 0.

    On E_0: y^2 + xy = x^3 + 1, the Frobenius endomorphism satisfies
    tau^2 + tau + 2 = 0. For each base point P_i in the prime-order
    subgroup, [2]P_i + tau^2(P_i) + tau(P_i) = O, and the corresponding
    log-row is the zero functional because lambda^2 + lambda + 2 = 0 in
    F_r. Those rows do not raise rank. The audit's multiset count
    C(B+m-1, m) counts tuples; it does not subtract this kernel and it
    does not count collisions. At the archived m = 83 full-orbit cells
    the expected number of colliding multiset-pairs is
    C(C-1)/(2 r) = 7.832e-12 at B = 332, m = 3 (C = 6154284) and
    8.868e-11 at B = 498, m = 3 (C = 20708500). A relation phase does
    not exist at those cells under the birthday prediction, which is why
    zero natural hits were the expected coverage statement and, separately,
    why zero syzygies are the expected rank statement. The two statements
    are different. Coverage wants an almost injective sum map. Rank wants
    collisions. The cap locus of IDEA-20260926-3c6a19 prices the first.
    This record prices the second.

    The kernel identity transfers to every prime degree of E_0 with no
    heuristic. The value of delta does not. m = 83 is not an enumerable
    collision cell. The measurement is at n = 19.
  mechanism: >-
    OBJECT FRAME. Representation: R1, k normal-basis masks. A point is in
    the base when its normal-basis x-coordinate is a rotation of one mask
    or the negation of a rotation. Membership is implicit (KN-OPEN-020
    open class: implicit-membership), decided in O(m) rotations without
    listing the subgroup. Operation set Sigma: addition of base-orbit
    points, together with the Frobenius acting as multiplication by
    lambda on logs and as a rotation on masks. Sigma is not the full
    translation action. Trichotomy: partial-action (Class I of
    IDEA-20260806-c5d183). The tracked object is the class of an exponent
    vector in (Z[tau] / (tau^2 + tau + 2))^k, pushed to an F_r-row on the
    k orbit logs. It propagates under translation by base points and does
    not propagate under translation by a general point.

    LOSSY-PROJECTION TEST, against Sigma. The projection discards the
    particular weight-m vector and keeps its class modulo the
    characteristic polynomial. The discard is compatible with Sigma
    because every generator of the kernel is the zero row on logs
    (lambda^2 + lambda + 2 = 0), so addition of base points acts on the
    quotient. The projection is lossy: each orbit contributes a kernel
    vector, and many multisets map to one class. It is not a coordinate
    change: two bases with the same B can have different informative
    rank.

    OPEN NUMBER. Orbit canonicalisation costs O(m) bit-rotations to the
    least normal-basis mask, charged per sample, measured at n = 19
    against a linear fit in m. Branching is not the priced number; this
    is a quotient object.

    OFF-LIMITS COMPONENTS, NAMED. F2 is the relation vector. F6 is the
    Frobenius action on the masks. What is added is the quotient by
    tau^2 + tau + 2 and the exponent delta of the collision count in
    that quotient. This is not KR-IC-b0fcda's claim that a
    Frobenius-invariant factor base speeds linear algebra by n^2: at
    n = 19, 83, and 131 the only Frobenius-stable subspaces have
    dimensions outside the index-calculus range, and this base is an
    orbit union of k points, not one of those subspaces.
    IDEA-20260926-178821 measures coverage redundancy of the
    target-dependent base of conjugates of P and Q, where one
    decomposition solves the logarithm. Here the base is
    target-independent, k is small, and the observable is informative
    rank after the kernel is removed, not coverage. IDEA-20260926-b48c9d
    prices one short tau-adic scalar times one point. Here k >= 2 and
    the observable is a collision count.

    LEMMAS. (Kernel) The characteristic relation is the zero row, as
    above. (Birthday ceiling) If the sum map on the remaining multisets
    is a uniform random function to the subgroup, the expected number of
    informative colliding pairs is C_eff (C_eff - 1) / (2 r), and the
    first collision takes Theta(sqrt(r)) samples. (Conditional exponent)
    A stable excess r^{delta} with delta >= 0.05 on two irreducible-block
    prime degrees cuts that sample count to r^{(1-delta)/2}. The
    prediction is the birthday ceiling, delta = 0. (Transfer) The kernel
    lemma is an identity in End(E_0) and holds at every prime degree.
    delta is not an identity. The archived cells are not where delta can
    be seen, because the expected collision count there is far below 1.

    COROLLARY, IF DELTA IS LATER MEASURED NONZERO. The same kernel lemma
    applies to every prime-degree E_0 challenge (m = 83 gate and m = 131),
    so a measured delta would cascade to those endpoints as a relation-
    phase exponent, still conditional on the collision heuristic at the
    new order. A measured delta of 0 cascades as well: the relation phase
    of a k-orbit base stays a birthday search, and the archived ceilings
    remain coverage statements with no hidden syzygy supply. Neither
    cascade is a discrete-logarithm result.
  novelty_status: unverified
  citations:
