idea:
  id: IDEA-20260801-004
  question_id: RQ-ECTD-001
  title: >-
    Large-conductor vertical barrier: isogeny-chain degrees and the cost of
    forcing a Semaev heavy tail at toy conductors
  class: control
  claim: >-
    For ordinary curves over generic prime fields, forcing a Semaev/Gröbner
    heavy tail by choosing a secret isogeny chain with large-conductor
    vertical steps does not transfer the heavy-tail advantage to the public
    curve's factor base unless the conductor of the public endpoint is itself
    large. A controlled toy experiment on the (2,3)-smooth vs large-conductor
    endpoint pair decides this and bounds the vertical-barrier cost that the
    trapdoor lane must pay.
  mechanism: >-
    The Semaev heavy tail depends on the relation-polynomial degree and the
    factor-base structure, which are governed by the public curve's conductor
    and isogeny class, not by a secret vertical chain. If the heavy tail is a
    public invariant, no secret vertical chain can create it; if it is not,
    the secret chain must make the public endpoint's conductor large, which is
    itself detectable and changes the public instance. The toy control
    measures d_reg and relation yield on an E_pub with a large-conductor
    endpoint vs its (2,3)-smooth twin, with and without a secret vertical
    chain.
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-01'
    corpus_paths_grepped:
      - knowledge/literature
      - ledger/proposals
    grep_results:
      - Prior ECTD batches explicitly deprioritize "large-conductor vertical
        barriers" but no toy control measures the barrier cost; no existing
        proposal runs the endpoint-pair control.
    conclusion: >-
      Control experiment; novelty unverified against full literature on
      conductor-dependent Semaev behavior, which is the point of the control.
  assumptions:
    - A toy endpoint pair with matched order but distinct conductor can be
      built at toy size.
    - Relation yield is measurable at the toy n range.
  predictions:
    - metric: relation_yield_large_vs_smooth_conductor
      direction: different
      minimum_effect: >-
        Any measurable difference in d_reg or relation yield between the
        large-conductor and (2,3)-smooth endpoints, with the secret-chain
        ablation, discriminates the public-invariant hypothesis from the
        secret-chain-transfer hypothesis.
  minimal_test:
    design: >-
      Build E_pub^large (large conductor) and E_pub^smooth (same order,
      (2,3)-smooth conductor). For each: measure d_reg and relation yield with
      and without a short secret vertical chain. Compare the four cells.
    controls:
      - Identical order and field.
      - Identical factor base.
      - Secret chain ablated (public-only) as control.
    required_metrics:
      - d_reg per cell
      - relation yield per cell
      - vertical-chain construction cost per cell
  falsification_conditions:
    - Large-conductor endpoint shows strictly better yield only with the
      secret chain (vertical barrier transfers; trapdoor lane remains open).
    - Yield difference tracks the endpoint's public conductor, not the chain
      (public-invariant; vertical barrier does not transfer).
  confounders:
    - Conductor changes the curve class, not just a parameter (order fixed).
    - Toy n where all systems solve trivially.
  interpretation_limits:
    - Toy control only; no crypto-scale transfer claim.
    - Does not construct a trapdoor; bounds the vertical-barrier cost.
  heuristic_assumptions:
    - id: HEUR-ECTD-VERT-1
      statement: >-
        Relation yield and d_reg on an ordinary F_p curve depend measurably on
        the public endpoint's conductor structure at toy sizes.
      rigorous_support: >-
        None directly; Semaev polynomial theory and prior toy d_reg work
        motivate the dependence. Tested by the four-cell control.
      validation_plan: The four-cell experiment is the validation; also run a
        null random-conductor set to check the detector's sensitivity.
  target_complexity:
    time_exponent: n/a (toy control)
    memory_exponent: n/a
    best_known: n/a
    hidden_overhead: n/a
    tradeoff_note: n/a
  dominated_by: null
  sota_delta: >-
    No attack claimed. Value is a scoped barrier-cost measurement that the
    ECTD lane explicitly listed as priority (2) but never measured.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
