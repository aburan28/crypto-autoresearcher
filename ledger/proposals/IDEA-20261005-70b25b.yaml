  assumptions:
    - Characteristic greater than 3 and f squarefree.
    - Good specializations are those with four distinct points in Psi and with x1 distinct from x2.
    - j=0 and j=1728 stay in the artifact panel.
    - F2 names the summation equation only. The census stores permutations of Psi and no relation matrix.
  predictions:
    - metric: order of the permutation group generated on Psi over U_ord
      direction: different
      minimum_effect: >-
        Order 4, versus order dividing 2, versus order 8. Order 4 on
        every ordinary panel curve is the full group of the degree-4
        closure, with no exceptional curve in the panel. A mix of
        order 4 and order dividing 2 is an exceptional locus in the
        panel. Order 8 means the image escaped the degree-4 closure
        and meets the full wreath already over the ordered base.
    - metric: agreement of the pi_x quotient with the quadratic character split of the T-fibre
      direction: different
      minimum_effect: >-
        On all 64 good draws, the two x-coordinates of Psi are split
        or inert together with chi(f(x1)) chi(f(x2)), versus at least
        one good draw where the x-projection's factorization type
        disagrees with that character product. Agreement means the
        quotient by the blocks reproduces the degree-2 cover.
        Disagreement means pi_x is not that cover.
  minimal_test:
    design: >-
      At p=101, four ordinary curves with j outside {0, 1728}, plus
      j=0 and j=1728 aside. For each curve, 64 good pairs (x1, x2),
      label the four points of Psi over a quadratic extension, and
      record Frobenius in S_4. Generate the subgroup. On the same
      pairs, factor S_3(x1, x2, T) and record split, inert, or
      ramified. Continue one transverse path about f(x1)=0 and one
      about f(x2)=0 and record the two inertia permutations.
    controls:
      - >-
        Character control: the T-polynomial's factorization type
        against chi(f(x1)) chi(f(x2)), which is the degree-2 law.
        Any disagreement on a good pair makes the run inconclusive
        until the labelling is repaired.
      - >-
        Null quartic: same sample size, random monic separable
        quartic, must emit cycle type 3+1 or the draw is inconclusive.
      - Artifact panel: j=0 and j=1728, not entered in the ordinary tally.
    required_metrics:
      - order of the generated subgroup on Psi, per curve
      - number of 4-cycles realized, per curve
      - whether both negation loops preserve the inverse-pair partition
      - number of good pairs whose T-factorization disagrees with the character product
      - whether the null quartic emitted cycle type 3+1
  falsification_conditions:
    - A negation inertia permutation that breaks the inverse-pair partition falsifies the block-system reading for this Sigma.
    - >-
      Order 4 on all four ordinary curves, with the character control
      clean and the null quartic emitting a 3-cycle, is the uniform
      full-degree-4 reading. It falsifies an exceptional drop inside
      this panel.
    - Order dividing 2 on one ordinary curve and order 4 on another, under the same controls, is the exceptional-locus reading.
    - Order 8 on any ordinary curve falsifies the assertion that the coordinates of Psi lie in an extension of degree at most 4.
    - A character-control mismatch, or a null quartic with no 3-cycle, makes the run inconclusive.
  confounders:
    - Pairs with x1 = x2 or with a sum in E[2] shorten the fibre. They are excluded from the 64, not counted as a smaller group.
    - Arithmetic Frobenius over F_p can be strictly larger than the geometric image. Classes that appear only after constant-field extension are reported as that extension, not as a curve locus.
    - j=0 and j=1728 remain automorphism artifacts.
    - Inertia and Frobenius must generate the same subgroup. A disagreement withholds the order reading.
  interpretation_limits:
    - m=3, char > 3, minimal test at p=101. No cryptographic transfer and no m >= 4 claim.
    - An order-4 image here is a statement about U_ord. It does not decide the image over the symmetric base.
    - No relation rate and no decomposition speedup. The rho exponent stays the baseline.
    - Not a factor base. The open factor-base classes are not used.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Frobenius at 64 uniform good pairs (x1, x2) in F_p^2 generates
        the arithmetic image of rho_ord when every class of that image
        has positive density.
      rigorous_support: >-
        Imitates the class-proportional equidistribution recorded in
        KN-LIT-039.md. No effective error term was opened.
      validation_plan: >-
        p=101, N=64, four ordinary curves. Tail check: the character
        control must match on every good pair, and the null quartic
        must emit cycle type 3+1. One redraw at N=256 is allowed if
        the null misses; a second miss stops the reading. No transfer
        from p=101 to cryptographic p is claimed.
    - id: H2
      statement: >-
        The geometric image over U_ord is generated by the inertia
        of f(x1)=0 and of f(x2)=0 together with the inertia of the
        locus where the two sum x-coordinates collide.
      rigorous_support: Imitates tame generation by inertia. Provenance recalled; no source opened.
      validation_plan: >-
        One ordinary curve at p=101. Record the permutations from one
        transverse crossing of each of those three loci and compare
        the generated subgroup with the Frobenius subgroup from the
        64 pairs. Equality supports the generation statement for that
        curve. Inequality withholds the order reading.
