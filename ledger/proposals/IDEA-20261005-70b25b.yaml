idea:
  id: IDEA-20261005-70b25b
  question_id: RQ-MONO-001
  added: '2026-10-05'
  status: proposed
  approved_by: null
  title: >-
    Geometric monodromy of the same four signed sums over the ordered
    base (x1, x2), as a homomorphism into S_4
  class: control
  claim: >-
    R1 affine coordinates; no attack stage is assigned a new charged cost.
    Fix m=3, char > 3, and a nonsingular short Weierstrass curve E. Let
    the base be the ordered configuration space
    U_ord = Spec k[x1, x2] minus x1 = x2 and minus f(x1) f(x2) = 0.
    Let the fibre be the same unordered 4-set
    Psi = {P+Q, -(P+Q), P-Q, -(P-Q)} with x(P) = x1 and x(Q) = x2.
    The monodromy representation is
    rho_ord: pi_1(U_ord) -> S_4,
    the geometric Galois action of k(x1, x2) on the coordinates of Psi.
    The candidate block system is again the inverse-pair partition, with
    wreath stabiliser W of order 8. The coordinates of Psi lie in
    k(x1, x2, y1, y2), an extension of degree at most 4, so an image of
    order 8 would mean that containment failed. The two readings are:
    the image equals the full group of that degree-4 closure, order 4,
    for every ordinary j outside {0, 1728}; or the ordinary locus
    contains a j outside {0, 1728} whose image has order dividing 2
    while another ordinary curve in the panel has image order 4. Order
    8 on this ordered base is a third reading: the swap of x1 and x2 is
    realized by a loop that this base does not have, and the degree-4
    containment is false.
  mechanism: >-
    OBJECT FRAME. Representation: R1 affine (x, y) for P, Q, and each
    point of Psi. Operation set Sigma: negation of P and negation of Q,
    realized as inertia about f(x1) = 0 and f(x2) = 0. The transposition
    of x1 and x2 is not an element of this Sigma, because U_ord keeps
    the coordinates ordered. Sigma is not the translation action of E.
    F2 is a named component only, as the equation that cuts out Psi.
    The tracked object is rho_ord.
    TRICHOTOMY. Coordinate-dependent. Reason: Psi is a function of the
    ordered pair of x-coordinates; translating one summand by a generic
    point leaves U_ord.
    LOSSY-PROJECTION TEST against this Sigma. The projection
    pi_x: Psi -> {x(P+Q), x(P-Q)} discards y-coordinates, the signs
    inside the inverse pairs. Those signs are a block system of
    <negation of P, negation of Q> if and only if both inertia
    permutations preserve the partition. The projection is lossy:
    four points map to two x-coordinates. It is not a change of
    coordinates. A negation loop that mixes the two x-coordinates
    without swapping whole blocks shows the partition is not a block
    system of this Sigma.
    Base U_ord, fibre Psi, homomorphism rho_ord into S_4. This is the
    ordered-base counterpart of the symmetric-base homomorphism: the
    fundamental groups differ by the swap cover of degree 2. The
    degree-2 action on {x(P+Q), x(P-Q)} remains the quotient by pi_x
    and is the instrument check, not the object being measured.
  novelty_status: unverified
