    - 'BOUNDED-PC falsified iff the W_6 refutation rate at s = 7 is <= 0.5 (verified certificates only).'
    - 'The exact-instrument identity falsified iff any instance has 1 in the explicitly built M_D at D < 4 + deg(f^{-1}) or not in it at D = 4 + deg(f^{-1}) (s = 4 fixture); the record is then withdrawn.'
    - 'The null calibration falsified iff null deg(g) < 2s on more than 10 percent of draws at any cell.'
