  minimal_test:
    design: >-
      STAGE 0 (zero run). Commit: the S_3 formula check against point
      addition; the exact-instrument derivation as a note; the column /
      multiplier counts per cell; the null predictions; the rule for p, the
      curve (A, B drawn by seed, order counted by the run, odd-order subgroup
      used for targets) and the inner-target stream.
      STAGE 1 (THE INSTRUMENT, s in {4..8}). For each cell draw targets R
      uniform in the odd-order subgroup and P_3 uniform in B_s by a frozen
      PCG64 stream; form u = x(R - P_3), the digit residual f, evaluate f on
      the cube (exact sat flag, solution count, value spectrum), keep 60
      unsatisfiable and 20 satisfiable inner instances; compute deg(f^{-1})
      by Mobius transform; C-ORACLE on every instance (oracle A agrees);
      the easy control (10) and the same-support null (30, unsat by
      rejection) and the top-form arm (20) per cell. Minutes per cell.
      STAGE 2 (THE MUTANT RUNG, s in {5..8}). F_p Macaulay and W_D at
      D = 5..8 (D = 8 only at s <= 7; s = 8 to D = 7 unless memory allows)
      on 40 unsatisfiable, 10 satisfiable, 20 null and 10 top-form instances
      per cell; certificate h or mutant derivation verified by multiplying
      out in a separate process; ops logged.
      STAGE 3 (THE WRAPPER, s = 5 only). 50 m = 3 attempts; exact sat by the
      prime-field MITM / loop oracle; the per-node pair and the cost law.
      OUTCOME TABLE. FULL + NOT-BOUNDED-PC: the prime-field two-leg residual
      is closed for bounded-degree inner theories with the exact slope as the
      obstruction; 24d827 (B) and da1428 at d = 2 supported by an exact
      measurement; the binary / prime contrast is recorded as generator
      multiplicity (mechanism) pending b26bbc's outcome. BOUNDED-PC: an F_p
      W_D pricing design is seeded, and the mechanism text of this record and
      of b26bbc is revised. HALF only: the structural slope is recorded; no
      exponent. ARTIFACT (any refuted satisfiable control, any failed
      certificate, C-ORACLE mismatch, null deg(g) < 2s on > 10 percent): void.
      FALSIFICATION THRESHOLDS, FIXED NOW. FULL is falsified iff deg(g) < 2s
      on > 10 percent of unsatisfiable instances at any cell with s >= 6;
      BOUNDED-PC is falsified iff the W_6 rate at s = 7 is <= 0.5.
      COST (estimate): implementation low for Stage 1 (about 200 lines on the
      existing prime-field modules), medium for Stage 2 (an F_p dense closure
      engine, about 300 lines); compute: Stage 1 minutes, Stage 2 hours
      (dominated by s = 8 at D = 7: about 2517 x 26333 entries per matrix,
      40 instances), Stage 3 about 50 x 2^5 instrument evaluations, minutes.
    controls:
      - 'C-ORACLE: cube evaluation and oracle A agree on satisfiability for every inner instance.'
      - 'Same-support null per cell with deg(g) = 2s predicted; least W_D rung reported.'
      - 'Top-form arm (degree-4 part kept, lower part randomised) to localise any signal.'
      - 'Planted satisfiable inner instances: any refutation voids the instrument.'
      - 'Easy control f = c + a_1 (c, c + 1 nonzero): deg(g) must be 1, confirming the Mobius instrument sees low degree.'
      - 'Value-spectrum filter: instances with fewer than 4 distinct values of f on the cube are reported and excluded from the primary counts.'
      - 'Seed control: target and null streams fixed by rule before any computation.'
