  confounders:
    - >-
      Degenerate inner instances (f nearly constant on the cube) would show
      low deg(g) for a trivial reason; the value-spectrum filter removes them
      and reports their frequency.
    - >-
      Small p: the Schwartz-Zippel exception has probability O(deg/p); at
      s = 4, p is about 2^13 and the exception fraction is below 10^-2 but
      not zero; the null's measured deg(g) is the calibration, not the bound.
    - >-
      One curve per cell; A, B and p change together along the ladder.
    - >-
      The W_D rung measured to D <= 8 is censored at s = 8; a rung above 8 is
      UNDETERMINED, never "unbounded".
    - >-
      The digit presentation is one of several prime-field presentations
      (coordinate presentation with y_1, y_2 as free F_p variables is
      another); this record measures the d = 2 digit residual only and
      names the coordinate presentation as a successor arm.

  interpretation_limits:
    - >-
      CLAIM TIER toy, s <= 8, p <= 2^26. Nothing about any deployed
      prime-field curve.
    - >-
      No exponent moves unless BOUNDED-PC holds, and even then the claim is
      conditional on a bounded-rung heuristic along s and stays a factor
      2^{n/6} above rho at m = 3 (same arithmetic as IDEA-20260930-b26bbc).
    - >-
      The exact instrument bounds plain Macaulay only; cvc5's Groebner theory
      and F4 can do better than plain Macaulay (they realise bounded-degree
      PC with mutants), which is why the W_D rung is measured separately and
      why neither number is a timing.
    - >-
      Not evidence about the full digit system's first fall (e1e38b) or
      about 84cdb7's ladder; the residual is a different object.
    - >-
      KN-OPEN-020: the interval base is the implicit-description class; this
      record neither escapes nor closes it.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Null genericity.) For f drawn with uniform F_p coefficients on the
        multilinear support of the digit residual and no Boolean zero,
        deg(f^{-1}) = 2s with probability >= 1 - c s/p for an absolute c.
      rigorous_support: >-
        The top Mobius coefficient of f^{-1} is a rational function of the
        coefficients of f, and it is not identically zero: for the explicit
        unit f_0 = 1 + a_1 + ... + a_N (all values in {1, ..., N+1}, nonzero
        for p > N+1) the inverse is g_0(x) = 1/(1 + |x|) and its top Mobius
        coefficient is sum_k C(N, k) (-1)^{N-k}/(k+1) = (-1)^N/(N+1), which
        is nonzero in F_p for p > N+1 (my derivation; the run checks it at
        N = 8). Schwartz-Zippel (recalled) then bounds the exception set for
        random coefficients. The classical statement imitated is that a
        random function on the cube has full multilinear degree.
      validation_plan: >-
        SAMPLE 30 null draws per cell; COMPARE the fraction with deg(g) = 2s
        against 1 - c s/p; TAIL: the minimum deg(g) over all null draws, and
        the explicit f_0 check. TRANSFER: none.
    - id: H2
      statement: >-
        (Bounded rung, the exponent-bearing assumption, expected FALSE.)
        There is D_0 such that 1 lies in W_{D_0} for >= 90 percent of
        unsatisfiable digit residuals at every s.
      rigorous_support: >-
        None rigorous; the exact identity shows plain Macaulay cannot give it
        unless deg(f^{-1}) is bounded, and the published mechanism for the
        binary case (degree-2 falls among n descended generators,
        KN-FIND-c3a917) is absent here by construction. Imitates nothing
        classical; it is the hypothesis under test.
      validation_plan: >-
        SAMPLE the W_D rung at s in {5,6,7,8} (Stage 2); COMPARE the median
        rung's slope in s against 0, 1/2, 1; TAIL: the maximum rung and the
        UNDETERMINED fraction per cell. Extrapolation beyond s = 8 is not
        made.
    - id: H3
      statement: >-
        (Poisson decomposition probability over the interval base.) The
        number of m = 3 decompositions of a uniform target over B_s is Poisson
        with mean C(|B_s|+2, 3)/N.
      rigorous_support: >-
        KN-FIND-007's conservation mean (exact); the Poisson half is the
        standard occupancy heuristic.
      validation_plan: >-
        SAMPLE the exact count distribution at the wrapper cell by the MITM /
        loop oracle (50 attempts); COMPARE to Poisson by chi-squared; TAIL:
        maximum count.

  heuristic_note: >-
    The exact instrument is an identity; H1 calibrates the null; H2 is the
    assumption whose failure is the expected result; H3 enters only the
    wrapper's charge.

