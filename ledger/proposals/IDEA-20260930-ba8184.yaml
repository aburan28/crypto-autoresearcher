idea:
  id: IDEA-20260930-ba8184
  question_id: RQ-ECDLP-f0a7b0
  added: '2026-10-01'
  status: proposed
  approved_by: null
  title: >-
    THE PRIME-FIELD SIBLING OF THE INNER-THEORY SEARCH, WITH AN EXACT
    LINEAR-ALGEBRA-FREE REFUTATION-DEGREE INSTRUMENT: on the digit-presented
    two-leg residual S_3(l(a), l(b), x(R - P_3)) = 0 over F_p (one equation in
    2s Boolean-valued variables) the plain Macaulay refutation degree is
    EXACTLY 4 + deg(f^{-1}) with f^{-1} the pointwise inverse on the cube,
    computable from 2^{2s} evaluations and a Mobius transform; its slope in s
    (0, 1/2 or 1) and the mutant rung W_D decide whether a Groebner-theory
    CDCL(T) can ever prune two free digit blocks, and name why the binary
    case differs (n descended generators against one principal residual)
  class: control

  claim: >-
    OUTCOME CLASS (a), A SEARCH EXPONENT, aimed at and honestly expected to be
    NEGATIVE: the record tests whether the prime-field analogue of the SATIC
    ceiling (IDEA-20260905-24d827 claim (B): no CDCL(T) arm with two free
    digit blocks beats 2^{(m-1)s}/(m-1)!) and the hybrid verdict of
    IDEA-20260808-da1428 (full guessing is optimal under the semi-regular
    null) survive at the one hybrid point those records leave open -- k = m-2
    guessed legs with a bounded-degree closure on the residual -- in the
    digit presentation, where membership has degree 2 and da1428's own
    mechanism says the interior optimum is no longer excluded. Where it would
    escape the ceiling: the ceiling's engine is unit propagation on a
    bit-blasted circuit (24d827's BV arm) or a Groebner theory whose cost
    24d827 bounds under the semi-regular null; the quantity here is the exact
    polynomial-calculus-type refutation degree of the non-null residual. The
    null ladder: same-support random multilinear polynomials, planted
    satisfiable residuals, and a top-form-preserving arm. Representation R1
    (base-2 digit coordinates of the legs, IDEA-20260830-84cdb7); attack
    stage: the per-attempt decomposition solve. CLAIM TIER toy. NO ATTACK.

    THE OBJECT. E: y^2 = x^3 + A x + B over F_p, p the least prime above
    2^{3s+1}; interval factor base B_s = {P : 0 <= x(P) < 2^s}; m = 3. For a
    target R and each P_3 in B_s put u = x(R - P_3) (one group operation);
    the inner instance asks whether u is the abscissa of P_1 + P_2 with
    P_1, P_2 in B_s. With x_1 = l(a) = sum_{i<s} 2^i a_i, x_2 = l(b) and the
    Boolean constraints a_i^2 = a_i, b_i^2 = b_i, the inner instance is ONE
    polynomial f = S_3(l(a), l(b), u) reduced in the function ring
    B_p = F_p[a, b]/(a_i^2 - a_i, b_i^2 - b_i), of multilinear degree <= 4
    (S_3 has degree 2 in each leg; squaring a digit form costs at most two
    multilinear degrees). N = 2s variables, s in {4, ..., 8}.

    THE EXACT INSTRUMENT (derivation, zero linear algebra). B_p is the ring
    of F_p-valued functions on {0,1}^N, every function has a unique
    multilinear representative, and multilinear reduction is a ring map. If f
    has no Boolean zero then f is a unit of B_p with inverse g = f^{-1}
    (pointwise), unique. The plain Macaulay space M_D = span{mu f reduced :
    deg mu <= D - 4} equals {h f : deg h <= D - 4}, so 1 lies in M_D iff
    deg(g) <= D - 4. Hence D_ref^M(f) = 4 + deg(g) EXACTLY, and deg(g) is
    read off the Mobius (ANF) transform of the table of g over the cube:
    2^N evaluations of f (which also decide satisfiability exactly, oracle B),
    2^N inversions, and an N 2^N-operation transform. The mutant closure W_D
    (bounded-degree polynomial calculus with reuse of fallen polynomials,
    EXP-CERTBIN-e94b27's definition ported to F_p) can reach 1 at a lower D
    than 4 + deg(g); its least rung is the second instrument and the one that
    bounds what a Groebner-theory propagator could do.

    THE NULL AND THE THREE READINGS, DECIDED BY PREDEFINED COUNTS. For a
    same-support random f (uniform coefficients on f's multilinear support),
    the top Mobius coefficient of g is a nonzero rational function of the
    coefficients and so is nonzero for all but an O(deg/p) fraction
    (Schwartz-Zippel, recalled standard), i.e. deg(g) = N and
    D_ref^M = 2s + 4: FULL. Readings on the inner object: FULL iff deg(g) = 2s
    on >= 90 percent of unsatisfiable inner instances at every cell (the
    residual is generic for plain Macaulay); HALF iff deg(g) <= s + 2 on
    >= 50 percent at s in {6, 7, 8} (a structural slope 1/2, the shape
    IDEA-20260903-e1e38b derives for the first fall of the full digit
    system); BOUNDED iff deg(g) <= 2 on >= 90 percent (the only reading that
    would make plain Macaulay a poly-time inner oracle). On the mutant rung:
    BOUNDED-PC iff 1 lies in W_6 on >= 90 percent of unsatisfiable inner
    instances at s in {6, 7, 8} while the null's W_6 rate is <= 10 percent;
    otherwise NOT-BOUNDED-PC, with the least rung's slope in s reported.

    WHAT EACH OUTCOME MEANS. FULL and NOT-BOUNDED-PC (honest prior about
    0.8): the prime-field two-leg residual carries no bounded-degree
    refutation, the hybrid optimum stays at full guessing at d = 2 as da1428
    predicts, 24d827 claim (B) is supported with an exact (not timing-based)
    obstruction, and the contrast with IDEA-20260930-b26bbc's binary object
    is localised to the mechanism named below. BOUNDED-PC (prior <= 0.1): the
    per-attempt exponent over F_p drops from 2s to s + O(log s) exactly as in
    b26bbc, contradicting 24d827 (B) and da1428 at d = 2, and the record
    hands the F_p W_D theory to a pricing design. HALF without BOUNDED-PC: a
    structural slope exists but buys no exponent (2^{Theta(s)} closure cost);
    reported as the obstruction with its slope.

  mechanism: >-
    OBJECT FRAME. Representation R1 (digit coordinates). The relation-search
    object is unchanged (Class I partial action, IDEA-20260806-c5d183). The
    solver-side tracked object is the pair (deg(f^{-1}), least W_D rung) of a
    depth-s node's inner residual; operation set Sigma: fix one leg by group
    arithmetic, then the D-bounded ring action of B_p. TRICHOTOMY:
    coordinate-dependent in the weak sense (the pair depends on the SET B_s
    and u; the digit basis is a change of coordinates by the same argument as
    IDEA-20260926-917981 Proposition B(ii), since l(a) is affine in the
    digits and the function ring is basis-free). LOSSY-PROJECTION TEST: the
    pair discards f, g and the certificate; the discard is Sigma-compatible
    because W_D is closed under the D-bounded action and deg(g) is a function
    of f alone; it is lossy because every unit f with the same inverse degree
    collapses to one integer. The projection that fails the test: the table
    of f on the cube, which loses nothing.

    WHY THE BINARY AND PRIME-FIELD OBJECTS SHOULD DIFFER, STATED AS THE
    MECHANISM UNDER TEST. Over F_{2^n} the Weil descent turns the one
    equation S_3(x_1, x_2, u) = 0 into n coordinate equations in 2l variables;
    the certified refutations (KN-FIND-5a8d3e, KN-FIND-c3a917) are carried by
    degree-2 falls among products of those n generators by variables -- a
    phenomenon of MANY low-degree generators sharing a tensor. Over F_p the
    digit map (IDEA-20260830-84cdb7) gives Boolean-shaped VARIABLES but one
    principal residual: every consequence is h f, and low degree must come
    from the field equations alone. The exact formula D_ref^M = 4 + deg(f^{-1})
    makes that precise: plain Macaulay can only win if the pointwise inverse
    of the residual on the cube is a low-degree function, which for a generic
    unit is false. If BOUNDED-PC nevertheless appears, the mechanism is not
    generator multiplicity and the binary explanation must be revisited; if
    FULL appears, the SATIC question's refusal to transfer across the field
    boundary is given its first exact prime-field reason. The trace-morphism
    first fall of the binary case (KR-IC-f5c584, a group morphism E -> F_2)
    has no prime-field analogue, which is the same contrast seen from the
    first-fall side.
    OFF-LIMITS COMPONENT DECLARED: F2 is the family; the interval base is the
    implicit-description class of KN-OPEN-020 (membership x < 2^s is not a
    bounded-degree plane locus), as IDEA-20260830-84cdb7 and
    IDEA-20260906-c8f2f6 already declare; not escaped beyond that.

