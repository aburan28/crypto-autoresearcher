  assumptions:
    - >-
      Satisfiability of every inner instance is decided exactly by the cube
      evaluation (2^{2s} points, s <= 8) and cross-checked by the prime-field
      MITM / loop oracle on the m = 3 attempts; no closure decides SAT.
    - >-
      S_3 over F_p is the standard formula and is verified against point
      addition on the run's curve before use (as the CERTBIN self-tests do
      for the binary S_3).
    - >-
      An F_p Macaulay / mutant closure engine must be written (dense F_p
      arithmetic with p < 2^31, N <= 16, D <= 8); the exact instrument needs
      none.
    - >-
      OFF-LIMITS COMPONENT: F2 as the family; the interval base inside
      KN-OPEN-020's implicit-description class as declared by 84cdb7.

  proof_search_map:
    bottleneck: >-
      Whether the two-free-digit-block residual over F_p admits a
      bounded-degree polynomial-calculus refutation; the exact formula
      D_ref^M = 4 + deg(f^{-1}) makes the plain-Macaulay half a zero-run
      computation and leaves the mutant rung as the only open number.
    baseline_embedding:
      parameter_slice: >-
        Zero guessed legs is the full digit system of IDEA-20260905-24d827
        and IDEA-20260903-e1e38b; m - 1 guessed legs is root-finding
        (24d827's UP arm; KN-FIND-a8990a Theorem C). The record sits at
        m - 2 guessed legs, the one interior point; its boundary check is
        that the inner oracle A (enumerate P_1, test x(U - P_1) < 2^s) and
        the cube evaluation return identical satisfiability on every inner
        instance (C-ORACLE).
      reproduction_check: >-
        Frozen fixtures: (i) D_ref^M computed by the formula equals the least
        D with 1 in the explicitly built M_D on 20 instances at s = 4 (exact
        rank over F_p); (ii) the null's deg(g) = N on 30 draws per cell
        (Schwartz-Zippel prediction); (iii) column counts C(2s, <= D) and
        multiplier counts C(2s, <= D-4) tabulated before any run.
    observation_collision:
      observable: >-
        Per inner instance: sat flag and solution count, deg(f^{-1}), the
        least W_D rung reached (D <= 8), ops and the F_p certificate
        (h with h f = 1, or the mutant derivation).
      distinct_preimage_search: >-
        A low deg(g) could come from (i) structure of the digit-S_3 residual,
        (ii) a degenerate instance (f constant on the cube, e.g. u making
        S_3 independent of the legs), or (iii) small p making the
        Schwartz-Zippel exception likely. (ii) is excluded by reporting the
        value spectrum of f on the cube and discarding instances with fewer
        than 4 distinct values; (iii) by p > 2^{3s+1} >= 2^13 and the null's
        measured deg(g). A low W_D rung with FULL deg(g) is the mutant-
        specific signal and is separated by the null's W_D rung.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "run a Groebner / Macaulay engine and read the degree it
          reached" by the exact equality D_ref^M = 4 + deg(f^{-1}) in the
          function ring. Obligations: ENCODING (the inner instance is
          satisfiable iff f has a Boolean zero; S_3 characterisation plus
          closure of B_s under negation); COMPLETENESS and SOUNDNESS (the
          formula is an identity in B_p; the certificate h = g is checked by
          multiplying out); TRANSFER (exact at every s; the W_D rung is the
          separate, non-closed-form quantity); COST LOSS (2^{2s} evaluations,
          which is the oracle's own cost -- the instrument is for
          measurement, never for solving).
        predicted_gain: >-
          A solver-free, exact refutation-degree ladder in s at zero linear
          algebra, which no timing-based arm can give.
      - transform: observable_fiber
        proposed_object: >-
          Hold deg(g) fixed and vary the forgotten structure: the top-form
          arm (keep f's degree-4 part, randomise the rest) and the
          same-support null; the invariant proposed to separate them is the
          least W_D rung.
        predicted_gain: >-
          Localises any structural signal to the top form or to the lower
          part, mirroring the N-CONV / N-PERT logic of KN-FIND-c3a917 on the
          prime-field side.
    quantifier_order: >-
      Exact: FORALL unsatisfiable inner instances, 1 in M_D iff
      deg(f^{-1}) <= D - 4. Empirical: FOR the cells s in {4..8} with p the
      least prime above 2^{3s+1} and one rule-drawn curve per cell, the
      distributions of deg(g) and of the least W_D rung are as measured with
      CP95; the exponent reading needs EXISTS D_0 FORALL s (bounded rung),
      and the witness may not depend on s.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At the named cells the inner residuals have deg(f^{-1}) and least
        W_D rung distributed as measured, against the null's; the plain
        Macaulay refutation degree is 4 + deg(f^{-1}) exactly." It certifies
        nothing about F4 timings, about cvc5, about s > 8, or about any ECDLP
        cost; a bounded rung at s <= 8 is a toy observation and the exponent
        reading would still be conditional.
      nearby_object_control: >-
        The same-support random residual (deg(g) = N predicted; the object on
        which the bounded conclusion must fail) and the planted satisfiable
        residual (no inverse exists; any refutation voids the instrument).
        The deliberately easy object -- a unit whose inverse is low-degree by
        construction, e.g. f' = c + a_1 (nonzero constant plus one digit, with
        c and c + 1 nonzero) -- must show deg(g) = 1, confirming the Mobius
        instrument sees low degree.
    proof_obligations:
      - claim: The inner Boolean system is satisfiable iff u is the abscissa of a signed two-leg sum over B_s (S_3; closure under negation).
        responsibility: correctness
      - claim: D_ref^M = 4 + deg(f^{-1}) in B_p for every unit f of multilinear degree 4 (identity in a product of fields; uniqueness of multilinear representatives).
        responsibility: correctness
      - claim: For the same-support null, deg(g) = N except on an O(deg/p) fraction of coefficient vectors.
        responsibility: success_probability
      - claim: Column counts C(2s, <= D) and the F_p engine's memory at N = 16, D = 8 (about 2517 x 39203 entries, under 1 GB at 8 bytes) are as tabulated.
        responsibility: memory
      - claim: The W_D rung is an upper bound on the polynomial-calculus degree and a lower bound on nothing; stated so.
        responsibility: strictness
      - claim: Nothing transfers to binary fields, to s > 8, or to any deployed curve.
        responsibility: scope
    not_applicable_reason: null

