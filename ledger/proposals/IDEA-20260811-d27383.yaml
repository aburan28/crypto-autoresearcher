    null in the inventor-protocol sense. 0.10 that the ECDL polynomial shows a
    non-scalar shortcut at the tested depths, which is the only outcome that
    would change a priority and is where the value of running (F) at all lives.
    0.05 that Class B is ever prosecuted by this program, because explicit
    non-scalar lower bounds are a known hard problem and the record says so.
    MEDIUM priority: the closure is cheap and prevents a plausible misinvestment
    in exactly the model the axis brief invites, but it enables nothing directly
    and its measurement is a long shot with a small, honest upside.

