    (3) `^  question_id: RQ-GGMB-6eaabc` -> 9 lane records; none charges degree
    to an adversary. IDEA-20260806-530fdd (AOM_d) charges degree to the
    SIMULATOR and is explicitly excluded rather than closed.
    (4) `docs/target-result-profile.md` and DECOMPOSITION.md contain no
