  discriminated_from: >-
    IDEA-20260806-530fdd / H-AOM-8d4a83 (degree-budgeted algebraic oracle model)
    is the nearest record and the relationship is EXCLUSION, not closure. AOM_d
    charges the DEGREE of the variety defining an oracle to the SIMULATOR's
