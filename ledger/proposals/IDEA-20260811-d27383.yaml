    EXTERNAL NOVELTY IS NOT ESTABLISHED AND EXTERNAL CITATIONS ARE NOT VERIFIED:
    WebSearch and WebFetch both failed this session with a backend model error.
    Every attribution in (A) and (E) is from recall and is marked as such. The
