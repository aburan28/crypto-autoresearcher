idea:
  id: IDEA-20260811-d27383
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-GGMB-6eaabc
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-aeeb17
  task_id: TASK-20260811-c439c2
  axis: A4
  claim_tier: toy
  title: >-
    THE DEGREE CEILING -- a closure, with its obstruction named, of the entire
    family of R1-fitted lower bounds that charge ALGEBRAIC DEGREE. A straight-line
    program of length l over F_p computes a rational function of degree at most
    2^l, and every degree over F_p is at most p; therefore ANY degree lower bound
    on a polynomial representation of the elliptic-curve discrete logarithm --
    the Coppersmith-Shparlinski / Lange-Winterhof / Kiltz-Winterhof
    interpolation family, and every generic-ring-model argument of that shape --
    can certify at most l >= log_2 p = O(log N) operations, which is
    exponentially below sqrt(N) and can never be the R1-fitted analogue of
    Shoup's bound. The obstruction is that DEGREE DOUBLES PER MULTIPLICATION, so
    degree is a LOGARITHMIC complexity measure. Forward guidance names the one
    surviving charge -- NON-SCALAR MULTIPLICATIVE COMPLEXITY -- and the cheap
    tiny-scale measurement that would say whether it is worth chasing
  class: mechanism

  claim: >-
    (A) THE FAMILY BEING CLOSED, NAMED PRECISELY SO THE CLOSURE HAS A SCOPE. A
    natural response to "Shoup's model does not cover index calculus because
    index calculus reads x-coordinates as field elements" (resource R1) is to
    build a model in which the adversary IS allowed field arithmetic on
    coordinates, and to charge it by ALGEBRAIC DEGREE -- the degree of the
    polynomial or rational map it computes, or the degree of the variety
    defining an oracle it queries. Concretely this family contains
      (a1) polynomial-interpolation lower bounds for the discrete logarithm: any
        polynomial f over F_p agreeing with the DL on many inputs must have large
        degree [recall-confident that such results exist for F_p^* and for
        elliptic curves -- Coppersmith and Shparlinski on polynomial
        approximation of the discrete logarithm and the Diffie-Hellman mapping;
        Lange and Winterhof, and Kiltz and Winterhof, on polynomial interpolation
        of the elliptic-curve discrete logarithm. NOT VERIFIED THIS SESSION: web
        search failed with a backend error and no citation here is confirmed];
      (a2) generic-ring-model arguments, which charge an adversary restricted to
        ring operations on encoded elements [recall-uncertain: Aggarwal and
        Maurer on breaking RSA generically; attribution NOT verified];
      (a3) the campaign's own IDEA-20260806-530fdd / H-AOM-8d4a83 degree-budgeted
        algebraic oracle model AOM_d, IN ITS ADVERSARY-CHARGING READING ONLY --
        see (D), which explains why AOM_d's actual reading is NOT closed here.

    (B) THEOREM C-1, THE CEILING, AND IT IS THREE LINES. Let a straight-line
    program over F_p compute a sequence of values from inputs and constants using
    +, -, *, and division. After l operations the computed value is a rational
    function of the inputs of degree at most 2^l, since degree at most doubles
    per multiplication or division and is subadditive under addition. Suppose a
    degree lower bound says: any polynomial representation of the target map has
    degree at least D. Then any straight-line program computing it has length
      l >= log_2 D.
    Over F_p every function F_p -> F_p is a polynomial of degree at most p-1, so
    D <= p and
      l >= log_2 D >= ... but also l >= log_2 D is at most log_2 p = O(log N).
    THE ENTIRE FAMILY IS CAPPED AT Omega(log N) OPERATIONS. Shoup's bound is
    Omega(N^{1/2}). The gap is exponential and it is not a matter of tightening
    constants.

    (C) THE OBSTRUCTION, NAMED. DEGREE DOUBLES PER MULTIPLICATION. Degree is
    therefore a LOGARITHMIC complexity measure for straight-line programs: it can
    separate "computable by a short formula" from "not computable by a short
    formula" and nothing more. The elementary witness that no repair is available
    within the measure is X^{p-1}: it has the maximum possible degree p-1 and is
    computed by about log_2 p squarings. A measure on which the hardest-degree
    object is among the cheapest objects cannot support a sqrt(N) bound. THAT IS
    THE ARGUMENT, and it is why this is a closure rather than a fatigue report:
    it names a mechanism, it exhibits the witness that realises it, and it
    applies uniformly to every member of the family in (A).

    (D) WHAT IS NOT CLOSED, STATED BEFORE THE CLOSURE IS USED. Three exclusions,
    and getting them wrong would turn a correct closure into a false one.
      (d1) AOM_d IS NOT CLOSED. IDEA-20260806-530fdd charges the SIMULATOR's
        overhead by the degree of the variety defining an oracle, and for a
        simulator that performs one Bezout-bounded solve, degree IS the right
        unit because the simulator does not get to use repeated squaring to
        shortcut a root count. This record closes only the use of degree as an
        ADVERSARY complexity measure. The two readings are different and the
        distinction is the single most important sentence in this record.
      (d2) DEGREE BOUNDS RETAIN A REAL, SCOPED, UNCONDITIONAL CONSEQUENCE: they
        rule out a CLOSED-FORM LOW-DEGREE FORMULA for the discrete logarithm.
        That is not nothing -- it is a genuine impossibility for one attack
        family, it needs no model, and it should be recorded as such rather than
        discarded with the rest.
      (d3) NOTHING HERE SAYS AN R1-FITTED LOWER-BOUND MODEL IS IMPOSSIBLE. It
        says degree cannot be its charge. Two charges survive and are named in
        (E).

    (E) FORWARD GUIDANCE, AT THE INVENTOR-PROTOCOL SECTION 4 STANDARD, WITH THE
    SURVIVING CLASSES NAMED.
      CLASS A -- CHARGE THE BRANCHING, NOT THE DEGREE. Count the operations a
        straight-line program CANNOT do: producing a point from field data
        requires a square root, and producing a relation requires a system solve.
        Charging those and idealising everything else is exactly
        IDEA-20260811-a28c44's FB-GGM, which has a bound (Theorem FB-1), and
        IDEA-20260811-a343de's answer-branching floor, which has another. Both are
        in this batch and both survive C-1 because neither charges degree.
      CLASS B -- CHARGE NON-SCALAR MULTIPLICATIVE COMPLEXITY, AND THIS IS THE
        ONE WITH THE RIGHT TARGET PROFILE. The number of non-scalar
        multiplications is NOT a logarithmic measure: for a polynomial of degree
        D with algebraically independent coefficients, about sqrt(D) non-scalar
        multiplications are necessary and about sqrt(2D) suffice
        [recall-confident: Paterson-Stockmeyer for the upper bound and a
        Motzkin/Paterson-Stockmeyer-style counting argument for the lower bound;
        NOT VERIFIED THIS SESSION]. IF the interpolation polynomial of the
        elliptic-curve discrete logarithm over F_p had non-scalar complexity
        p^{1/2 - o(1)}, THAT WOULD BE AN UNCONDITIONAL sqrt(N)-SCALE LOWER BOUND
        FOR ALGEBRAIC ALGORITHMS -- a result of exactly the shape
        docs/target-result-profile.md asks for, on the central problem, with no
        oracle idealisation at all. THE OBSTRUCTION IS EQUALLY CLEAR AND IS
        STATED WITH THE OPPORTUNITY: the sqrt(D) lower bound holds for GENERIC
        coefficients and is FALSE for specific polynomials (X^{p-1} again), and
        proving a non-scalar lower bound for one explicit polynomial is a known
        hard problem in algebraic complexity with no general technique. This is
        recorded as an OPEN DIRECTION with its difficulty stated, not as a
        proposal to solve it.
      CLASS C -- CHARGE THE CURVE RANDOMISATION rather than the labeling, which
        is IDEA-20260811-b1b94c's Class 1 and axis A3's territory.

    (F) THE CHEAP MEASUREMENT THAT WOULD SAY WHETHER CLASS B IS WORTH CHASING,
    AND IT IS TINY. At p in {11, 13, 17, 19, 23, 29, 31} with a curve whose group
    is cyclic of prime order N, compute the exact interpolation polynomial of the
    map x(R) |-> log_P(R) (defined on the x-coordinates of points of G, extended
    by 0 elsewhere), and measure (i) its degree, (ii) its number of nonzero
    coefficients, and (iii) its exact non-scalar multiplicative complexity by
    exhaustive search over straight-line programs of length up to 4 or 5.
    MATCHED NULL: a uniformly random function F_p -> F_p, same p, same
    measurements. PREDICTION, PRE-REGISTERED: indistinguishable from the null on
    all three statistics. A MEASURED NON-SCALAR COMPLEXITY BELOW THE NULL'S would
    mean the ECDL polynomial is structured in the one way that matters for Class
    B, and it is the only outcome here that would change any priority. This is
    minutes of computation at p < 32 and it is a genuine two-directional test of
    the surviving class, which is what distinguishes this record from a
    fatigue report.

  resource_label: >-
    R1 (x-coordinates as field elements), AUDITED. The whole family in (A) exists
    to build the R1-fitted analogue of Shoup's model, and this record adjudicates
    the charge those models use. It consumes no resource itself. It also declines
    to add a taxonomy entry: R1 is the correct label for the family, and what is
    wrong is not the resource but the cost function placed on it.
  admissibility: admissible
  admissibility_argument: >-
    Admissible. No endomorphism is applied to any point of G; H-ENDO-001 is
    untouched. KN-FIND-b7e091 is not revisited: this record adjudicates no
    oracle's simulability and changes no oracle verdict. It is a closure of a
    family of COST MODELS, which is squarely lane L12's remit ("for each oracle a
    lane proposes, is it GGM-simulable?" extended to "and if we build a different
    model, what may it charge?").

  object_first_candidate:
    tracked_object: >-
      THE ALGEBRAIC DEGREE of the rational function computed at each step of a
      straight-line program over F_p, followed through the program.
    lossiness: >-
      GENUINELY LOSSY. Discarded: every coefficient, the field elements, the
      curve, the points, and the identity of the function computed. Retained: one
      non-negative integer per step. Every polynomial of degree D shares the same
      value, so the projection is not invertible and is not a change of
      coordinates.
    propagation: >-
      DETERMINISTIC AND WITH AN EXACT RULE -- deg(fg) = deg f + deg g,
      deg(f+g) <= max, capped at p-1 by the field equation. What is discarded is
      discarded COMPATIBLY with the operations, since the degree of a product
      never consults the coefficients. So the inventor-protocol section 2 test is
      PASSED. AND THAT IS EXACTLY THE POINT OF THIS RECORD: passing the
      lossy-projection test is necessary and nowhere near sufficient. The object
      is a legitimate, well-behaved tracked object and it is still useless as a
      complexity measure, because its propagation rule is MULTIPLICATIVE while
      the cost being bounded is ADDITIVE. THE GENERAL LESSON, worth recording
      once for KN-OPEN-019: an object that propagates multiplicatively under the
      operation being counted can only ever certify a logarithmic bound, and this
      is checkable at the moment the object is proposed, before any model is
      built.
    survival_score: >-
      Survives every operation indefinitely -- degree is defined at every step
      and never degenerates -- which is precisely why it looks attractive and
      why the failure is easy to miss. It dies not by dissolving but by
      SATURATING: it reaches its maximum p-1 after log_2 p steps and carries no
      further information, so its useful lifetime is logarithmic in the parameter
      it is meant to bound.

  mechanism: >-
    STEP 1 (zero compute) -- STATE THE FAMILY (A) precisely, listing which
    existing internal records belong to it and which do not.
    STEP 2 (zero compute) -- PROVE C-1 as in (B), including the cap D <= p from
    the field equation, which is the step that makes the ceiling absolute rather
    than relative.
    STEP 3 (zero compute) -- EXHIBIT THE WITNESS X^{p-1}: maximum degree,
    logarithmic cost. This is what converts a bound into an obstruction.
    STEP 4 (zero compute) -- WRITE THE THREE EXCLUSIONS (D), and in particular
    verify against IDEA-20260806-530fdd's actual text that AOM_d charges the
    SIMULATOR and not the adversary. If it charges the adversary, this record
    closes it and must say so; if it charges the simulator, this record must not.
    Getting this backwards is the most likely error in the whole record and it is
    checked explicitly rather than assumed.
    STEP 5 (zero compute) -- WRITE THE FORWARD GUIDANCE (E) with the three
    surviving classes and the Class B opportunity/obstruction pair stated
    together.
    STEP 6 (toy compute, minutes) -- THE (F) MEASUREMENT with its matched
    random-function null.

  why_not_a_renamed_known_approach: >-
    The degree-doubling observation is elementary and standard in algebraic
    complexity and is NOT claimed as new. What is claimed is its APPLICATION
    HERE: this program is actively building degree-graded models (AOM_d) and this
    axis's brief explicitly asks for a better-fitted model granting field
    structure on x-coordinates. The obvious such model charges degree, and the
    ceiling argument says in advance that it cannot reach the target -- which is
    a pre-compute falsification check of exactly the kind
    docs/inventor-protocol.md section 8 exists to run, delivered before the model
    is built rather than after. The record also supplies the AOM_d exclusion,
    which prevents the closure from being over-applied to the program's own live
    work, and a specific surviving charge with a tiny measurement attached.
    EXTERNAL NOVELTY IS NOT CLAIMED and no citation in this record is verified;
    web search failed this session.

  predictions:
  - observable: the ceiling itself
    metric: the maximum operation-count lower bound derivable from any degree
      lower bound over F_p, computed symbolically
    direction: different
    predicted: exactly log_2 p, i.e. O(log N). A derivation producing anything
      superlogarithmic from a degree bound alone means C-1 is wrong.
  - observable: the AOM_d exclusion
    metric: whether IDEA-20260806-530fdd charges degree to the simulator or to
      the adversary, determined by reading its claim and mechanism sections
    direction: different
    predicted: SIMULATOR. If it charges the adversary, this record closes it, and
      that would be a materially different and much more consequential outcome
      that must be routed to the Coordinator rather than absorbed here.
  - observable: interpolation-polynomial degree of the ECDL at tiny p
    metric: exact degree of the interpolating polynomial of x(R) |-> log_P(R)
      over F_p, p in {11, ..., 31}
    direction: different
    predicted: p-1 or p-2 in every case, i.e. maximal, indistinguishable from the
      random-function null. A degree materially below p-1 would be a structural
      finding about the ECDL map and would be escalated rather than absorbed.
  - observable: exact non-scalar multiplicative complexity at tiny p
    metric: the minimum number of non-scalar multiplications in any straight-line
      program computing the ECDL interpolation polynomial, found by exhaustive
      search over programs of length <= 5, versus the same for a matched random
      function
    direction: different
    predicted: EQUAL to the null within the resolution of the search, i.e. no
      structural shortcut. A value BELOW the null at three or more primes is the
      only outcome in this record that would raise Class B's priority, and it
      would need independent replication before any record stated it.
  - observable: sparsity
    metric: number of nonzero coefficients of the interpolation polynomial
    direction: different
    predicted: about p-1 nonzero, matching the null. High sparsity would be a
      structural tell and is the cheapest of the three statistics to compute.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, about thirty minutes, HARD GATE, AND IT IS THE
      CHEAPEST DISCRIMINATOR IN THIS RECORD). Write C-1, including the D <= p cap
      and the X^{p-1} witness, and then attack it once: is there a degree-like
      measure that does NOT double under multiplication -- for instance the
      degree of the IDEAL generated, or the Newton-polytope volume, or the
      individual degree in one distinguished variable -- for which the same style
      of lower bound is available? If such a measure exists and is available, the
      closure is scoped to ordinary total degree and is materially weaker, and
      saying so is the useful outcome. Zero compute, no curve, no solver.
      STAGE 1 (zero compute, 20 minutes, BLOCKING). Read
      IDEA-20260806-530fdd and determine what AOM_d charges. The closure's scope
      depends on the answer and must not be written before it is known.
      STAGE 2 (toy compute, minutes). The (F) measurement at p < 32 with its
      matched random-function null and the exhaustive straight-line-program
      search.
      STAGE 3 (zero compute). Write the closure and the three surviving classes.
    controls:
    - >-
      NULL OBJECT (matched, blocking): a uniformly random function F_p -> F_p at
      the same p, measured by the identical code for degree, sparsity and
      non-scalar complexity. The ECDL polynomial must be indistinguishable from
      it. If the null itself shows low degree or high sparsity, the harness is
      broken and both arms are void.
    - >-
      PLANTED SIGNAL (blocking, opposite direction): a deliberately structured
      function with known low non-scalar complexity, for instance X^{(p-1)/2}
      (the quadratic-residue character up to sign), whose complexity the
      exhaustive search MUST find to be about log_2 p. An instrument that cannot
      detect a planted shortcut cannot certify its absence, and every negative it
      produces is void.
    - >-
      DECAY PARAMETER: the prime p across the ladder {11, 13, 17, 19, 23, 29,
      31}. A structural gap against the null that appears at one prime and
      vanishes at the next is small-p noise; only a gap that persists or grows
      across the ladder is a candidate finding.
    - >-
      Hygiene: G cyclic of prime order N inside E(F_p), N recorded, #E != p, and
      the extension-by-zero convention for x outside G stated explicitly, since
      it changes the interpolation polynomial and a comparison across
      conventions would be meaningless.
    required_metrics:
    - degree, sparsity and exact non-scalar complexity of the ECDL polynomial per
      prime, with the null arm beside each
    - the planted-signal arm's detected complexity
    - the symbolic ceiling log_2 p, recorded as a frozen fixture
    - the AOM_d charging determination, recorded verbatim with its source lines

  controls:
  - >-
    NULL OBJECT: a uniformly random function F_p -> F_p, identical measurements.
    Blocking.
  - >-
    PLANTED SIGNAL: X^{(p-1)/2}, whose low non-scalar complexity the search must
    find. Blocking in the opposite direction.
  - >-
    DECAY LADDER across seven primes, as the small-p artifact test.
  - >-
    The AOM_d reading check as a scope control on the closure itself.

  confounders:
  - >-
    THE CLOSURE IS ABOUT A CHARGE, NOT ABOUT A RESOURCE. R1 is not closed by this
    record and nothing about index calculus follows from it. Citing it as "field
    structure on x-coordinates is closed" would invert its meaning completely,
    and that is the most likely misreading.
  - >-
    THE AOM_d BOUNDARY. If the exclusion (d1) is got backwards, the record either
    falsely closes live internal work or falsely spares a closed family. Stage 1
    exists solely to prevent that and is blocking.
  - >-
    TINY-SCALE MEASUREMENT. At p < 32 the exhaustive straight-line-program search
    covers only programs of length at most 4 or 5, so it can detect a planted
    shortcut and CANNOT certify the absence of a longer one. The negative it
    produces is scoped to that search depth and must be reported with the depth
    attached.
  - >-
    THE EXTENSION-BY-ZERO CONVENTION. The ECDL is defined on the x-coordinates of
    points of G, which is about N/2 of the p field elements; extending by zero,
    by a constant, or interpolating only on the support gives three different
    polynomials with different degrees. The convention must be fixed once and
    reported, and cross-convention comparisons are meaningless.
  - >-
    UNVERIFIED CITATIONS. Every external attribution in (A) and (E) is from
    recall and web search was unavailable this session. If any is misattributed
    the mathematics of C-1 is unaffected -- it is self-contained -- but the
    record's claim about what the FAMILY contains would need correcting.

  falsification_conditions:
  - >-
    A degree-like measure that does not double under multiplication, and for
    which lower bounds of the interpolation kind are available, is exhibited at
    Stage 0. The closure is scoped to ordinary total degree and is materially
    weaker. INTENDED CHEAP DEATH, thirty minutes.
  - >-
    IDEA-20260806-530fdd is found to charge degree to the ADVERSARY rather than
    the simulator. Then this record closes live internal work, which is a
    Coordinator matter and must be routed rather than acted on here.
  - >-
    The X^{p-1} witness is wrong, i.e. maximum degree is not achievable in
    logarithmic operations over F_p. C-1's obstruction has no witness and the
    argument is a bound rather than a closure.
  - >-
    The measured ECDL interpolation polynomial has non-scalar complexity below
    the matched random-function null at three or more primes, with the planted
    control passing. Class B's priority rises sharply; the result must be
    independently replicated before any record states it, and it must NOT be
    described in cost terms (GOAL-ENDO-001 pause condition P3 handling applies if
    a cost is ever attached to it).
  - >-
    The planted signal X^{(p-1)/2} is not detected as cheap by the exhaustive
    search. The instrument is blind and every negative from it is void rather
    than confirming (AGENTS.md rule 3).
  - >-
    The random-function null itself shows low degree or high sparsity. The
    harness is broken; nothing is reported.

  interpretation_limits:
  - >-
    THIS CLOSES A FAMILY OF COST MODELS, NOT A DIRECTION, AND IT NAMES THREE
    SURVIVING CLASSES WITH THEIR OBSTRUCTIONS. Nothing here declares any
    direction impossible, which the Idea Generator contract forbids and which
    inventor protocol section 7 distinguishes from a scoped closure.
  - >-
    C-1 is about STRAIGHT-LINE PROGRAMS. An algorithm with branching, table
    lookup or randomness is not a straight-line program, and the ceiling does not
    bind it directly -- although the family in (A) is about algebraic
    representations, which is why the scope is the right one. Extending the
    ceiling to branching algebraic computation trees is an unexamined question
    and is not claimed here.
  - >-
    Every external citation in this record is UNVERIFIED. C-1 and the X^{p-1}
    witness are self-contained and elementary and do not depend on any of them.
  - >-
    IDEA-20260806-530fdd / H-AOM-8d4a83 is NOT closed by this record under the
    reading the record adopts, and the reading is checked before the closure is
    written. This record changes no hypothesis status, including that one.
  - >-
    Nothing here bears on H-STR-002, on phi-stable factor bases, or on any factor
    base at all. NOT P2-adjacent. Nothing here states any cost; P3 is not
    engaged, and the one measurement that could engage it carries its handling
    instruction in falsification_conditions.
  - >-
    KN-FIND-b7e091 is binding and is not revisited; no oracle is adjudicated.

  assumptions:
  - >-
    Straight-line programs over F_p with inputs, constants, +, -, *, and division
    where defined. Degree at most doubles per multiplication and per division of
    the represented rational function.
  - >-
    Every function F_p -> F_p is a polynomial of degree at most p-1 (the field
    equation X^p = X), so degree lower bounds over F_p are capped at p-1.
  - >-
    N is at most p+1+2 sqrt(p), so log_2 p and log_2 N differ by O(1) and the
    ceiling may be quoted in either.
  - >-
    The interpolation-family results in (a1) and (a2) are cited from recall and
    are NOT verified; the closure's argument does not depend on their exact
    statements, only on their SHAPE (a lower bound on degree).
  - >-
    The Paterson-Stockmeyer style sqrt(D) non-scalar bounds in (E) hold for
    generic coefficients and are cited from recall and NOT verified. The
    OPPORTUNITY they describe is conditional on them; the OBSTRUCTION stated
    beside them (they fail for specific polynomials) is elementary and is
    witnessed by X^{p-1}.

  heuristic_assumptions:
  - id: HA-1
    statement: >-
      ECDL-POLYNOMIAL GENERICITY. The interpolation polynomial of the map
      x(R) |-> log_P(R) over F_p, under a fixed extension convention, is
      statistically indistinguishable from the interpolation polynomial of a
      uniformly random function F_p -> F_p with respect to degree, coefficient
      sparsity, and non-scalar multiplicative complexity at every search depth
      the measurement can reach.
    rigorous_ingredient: >-
      The rigorous neighbour is that a uniformly random function F_p -> F_p has
      interpolation degree exactly p-1 with probability 1 - 1/p and about p-1
      nonzero coefficients, both by direct counting over the p^p functions. What
      is heuristic is that the ECDL map, which is highly structured as a MAP,
      behaves generically as a POLYNOMIAL -- and the record does not assume it:
      HA-1 is the NULL HYPOTHESIS of the (F) measurement, stated so that
      rejecting it is a finding rather than a surprise.
    distribution_imitated: >-
      The uniform distribution on functions F_p -> F_p, the same "this specific
      object behaves like a random object of its size" shape the program uses
      elsewhere.
    validation_route: >-
      This is the (F) measurement itself: p in {11, 13, 17, 19, 23, 29, 31}, one
      cyclic prime-order curve per prime, exact interpolation by Lagrange, exact
      degree and sparsity, and exhaustive non-scalar complexity search to depth
      4-5, each against 100 random-function nulls at the same p. TAIL CHECK: the
      minimum non-scalar complexity observed over the 100 nulls, which is the
      correct comparator for a single ECDL value rather than the null mean.
      SAMPLED PARAMETERS AND TRANSFER: p < 32 only, chosen because exhaustive
      program search is the only way to get an EXACT complexity and it is
      superexponential in depth. NO TRANSFER to larger p is claimed and none is
      possible from this design; a rejection at these primes would be a reason to
      build a better instrument, not a result about cryptographic size.

  proof_search_map:
    bottleneck: >-
      The degree-doubling step in C-1, and specifically whether some other
      algebraic measure escapes it. The rest -- the D <= p cap, the log_2 p
      conclusion, the X^{p-1} witness -- is immediate once doubling is granted.
      Stage 0 attacks exactly that step by asking for a non-doubling measure with
      available lower bounds, and that is where the whole risk sits. Zero compute.
    baseline_embedding:
      parameter_slice: >-
        D = p-1, the maximum possible degree. At this slice C-1 gives
        l >= log_2(p-1), which is the strongest statement the family can ever
        make, so the slice IS the ceiling rather than a point inside it. Second
        slice: D = 1, where the bound is trivial and must be, confirming the
        family is not vacuous only at the top.
      reproduction_check: >-
        SYMBOLIC at both slices. FROZEN FIXTURE: record log_2 p against
        0.886*sqrt(N) for p in {2^32, 2^160, 2^256} once, so the size of the gap
        is a stored number rather than an adjective.
    observation_collision:
      observable: the algebraic degree of the computed function.
      distinct_preimage_search: >-
        REQUIRED AND IT SUCCEEDS, AND THE COLLISION IS THE CLOSURE'S ENTIRE
        CONTENT. X^{p-1} and a "generic" polynomial of degree p-1 have IDENTICAL
        degree and differ in straight-line cost by a factor about p/log p. So the
        observable does not identify cost at all, which is a direct falsifier of
        degree's identifiability as a complexity measure -- and no additional
        condition rescues it, because the collision is between the cheapest and
        the most expensive objects at the same degree. A SECOND collision, in the
        other direction: two polynomials of very different degree (X and X^{p-1})
        have nearly the same straight-line cost, so the map from degree to cost
        is neither injective nor monotone in any useful range.
    constructive_transforms:
    - transform: observable_fiber
      proposed_object: >-
        Hold the degree fixed at p-1 and vary the forgotten structure: the fiber
        contains X^{p-1} (cheap) and generic degree-(p-1) polynomials
        (expensive). Find an intrinsic invariant separating them. The candidate
        is non-scalar multiplicative complexity, which is Class B.
      predicted_gain: >-
        Identifies the invariant the closed measure was failing to capture, and
        it is the one whose lower bounds are NOT logarithmic. That identification
        is the closure's redirection and is what makes it a closure rather than a
        dead end.
    - transform: stronger_invariant
      proposed_object: >-
        Replace degree with the pair (degree, non-scalar multiplication count),
        which preserves more state than the bound requires and is what survives
        the operation -- repeated squaring -- that destroys degree's usefulness.
      predicted_gain: >-
        In principle a sqrt(N)-scale unconditional bound for algebraic
        algorithms. In practice blocked by the known difficulty of non-scalar
        lower bounds for explicit polynomials, which is stated beside the gain
        rather than after it.
    quantifier_order: >-
      C-1: FORALL straight-line programs Pi over F_p of length l, FORALL degree
        lower bounds D on the target map: deg(Pi) <= 2^l, hence l >= log_2 D,
        hence -- since FORALL functions F_p -> F_p, D <= p-1 -- the derivable
        bound is at most log_2(p-1). The universal over D comes LAST and is what
        makes the ceiling absolute: it is not that current degree bounds are
        weak, it is that no degree bound over F_p can be strong enough.
      CLASS B, for contrast: EXISTS a measure (non-scalar count) and FORALL
        polynomials with algebraically independent coefficients of degree D, the
        measure is at least about sqrt(D). The existential over the measure comes
        FIRST -- which is exactly the freedom the closure identifies as
        unexploited -- and the universal is restricted to GENERIC coefficients,
        which is exactly the restriction that makes the direction hard.
      NOT CLAIMED: that no R1-fitted lower-bound model exists. Three classes
      survive and two of them are already instantiated in this batch.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Over F_p, any lower bound on the algebraic degree of a representation of
        the elliptic-curve discrete logarithm certifies at most log_2(p-1)
        straight-line operations, and this ceiling is attained, so the
        degree-charging family cannot certify a bound above O(log N)." It can
        NEVER certify that a degree-graded model is useless for other purposes
        (AOM_d's simulator accounting is explicitly excluded), that no algebraic
        lower-bound model exists, that non-scalar complexity bounds are
        unattainable, or anything about branching algorithms.
      nearby_object_control: >-
        AOM_d in its SIMULATOR-CHARGING reading is the nearest object on which
        the closure's conclusion must FAIL -- degree is the right unit there --
        and the record is designed around checking that boundary before writing
        the closure. A SECOND nearby object: the multiplicative group F_p^*,
        where the same degree family is equally capped and yet the DLP is
        genuinely subexponential; so the ceiling correctly explains nothing about
        which groups are hard, which is the honest statement of what a closure of
        a cost model does and does not buy.
    proof_obligations:
    - claim: Degree at most doubles per multiplication and division.
      responsibility: correctness
    - claim: Every function F_p -> F_p has degree at most p-1.
      responsibility: size
    - claim: X^{p-1} has maximal degree and logarithmic straight-line cost.
      responsibility: strictness
    - claim: >-
        AOM_d charges the simulator, not the adversary, and is therefore outside
        the closure.
      responsibility: scope
    - claim: >-
        The measured ECDL polynomial's statistics match the random-function null
        (HA-1), or the deviation is replicated and escalated.
      responsibility: success_probability
    - claim: >-
        The planted control X^{(p-1)/2} is detected as cheap by the exhaustive
        search.
      responsibility: interface
    - claim: >-
        The record names three surviving classes and declares no direction
        impossible.
      responsibility: scope
    not_applicable_reason: null

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT EXISTS OR MOVES. The exponents in this record are
      CERTIFICATION ceilings: the degree family certifies at most Omega(log N)
      operations, against Shoup's Omega(N^{1/2}) in its own model and against
      0.886*N^{1/2} as the best known algorithm. The surviving Class B would, if
      it succeeded, certify N^{1/2 - o(1)} for algebraic algorithms with no
      oracle idealisation -- stated as the target of an open direction, not as a
      result and not as a plan.
    memory_exponent: >-
      Not applicable to a certification ceiling. The (F) measurement is
      O(p^2) time and O(p) memory at p < 32, plus a superexponential-in-depth
      exhaustive search that is why the depth is capped at 4-5.
    best_known_baseline: >-
      Parallel Pollard rho with distinguished points at 0.886*sqrt(N) group
      operations and O(1) memory (KN-TECH-001, KN-TECH-006); automorphism-
      discounted on CM curves by a constant at most sqrt(6) (KN-TECH-018),
      baseline calibration and never an exponent; BSGS at sqrt(N) time and memory
      (KN-TECH-031). As LOWER bounds the incumbent is Shoup's Omega(sqrt(N)) in
      the generic model (KN-TECH-005), which this record does not approach and
      does not claim to.
    hidden_overhead_disclosure: >-
      TWO DISCLOSURES. First, the ceiling log_2 p is stated for straight-line
      programs; a branching algebraic computation tree is not covered and the
      record does not claim it is, so the closure's scope is narrower than the
      word "algebraic" suggests. Second, the Class B opportunity is stated
      conditionally on unverified recall of the Paterson-Stockmeyer bounds, and
      the obstruction beside it -- that such bounds fail for explicit
      polynomials -- is the reason it is filed as an open direction with its
      difficulty visible rather than as a proposal with a work plan.
    time_memory_tradeoff: >-
      Not applicable; no cost frontier is occupied and none is claimed.

  sota_delta: >-
    ZERO against every attack baseline: 0 time, 0 memory, 0 queries, 0 data. No
    attack is mounted and none is claimed. QUANTITATIVE CONTENT: the
    degree-charging family's certification ceiling is log_2 p, against the
    sqrt(N) target -- a gap of N^{1/2}/log_2 N, which is the number the closure
    delivers and which is stored as a frozen fixture rather than described as
    "far". Against the campaign's state of knowledge the delta is one family of
    cost models closed with a witness, three surviving classes named, and one
    tiny measurement that decides whether the most ambitious of them is worth
    opening.
  dominated_by: >-
    AS AN ATTACK: dominated by every row of the prime-field frontier, checked one
    by one, because it is not an attack -- parallel Pollard rho with
    distinguished points (KN-TECH-001, KN-TECH-006), the automorphism-discounted
    variant (KN-TECH-018), and BSGS (KN-TECH-031) each dominate on every axis.
    `null` would be a fabrication.
    AS A LOWER-BOUND METHOD: dominated on every axis by Shoup's generic bound
    (KN-TECH-005), which certifies sqrt(N) where the closed family certifies
    log N -- that domination is the record's finding rather than a concession.
    The surviving Class B is not dominated by Shoup on GENERALITY, since it would
    need no oracle idealisation, and is dominated by it on EXISTENCE, since Shoup
    is a theorem and Class B is an open direction. Stating both is the honest
    Pareto position.
    AS AN ANALYSIS OF DEGREE-GRADED MODELS: the incumbent is
    IDEA-20260806-530fdd's AOM_d, which dominates this record on constructive
    content (it builds a model and computes with it) and is dominated by it on
    scope discipline (it does not state where degree stops being the right unit).
    The two are complementary and AOM_d is explicitly excluded from the closure.

