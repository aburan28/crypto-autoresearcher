    - >-
      The numerical exhibition is toy tier, claim_tier toy. The ARGUMENT is not
      toy-tier -- it is unconditional given primality -- but it is also not new,
      and the record's status is `known` for that reason.
    - >-
      The claim that per-search success probability is independent of orbit
      structure at matched |V| is used in claim (B). On j = 0 curves it has an
      algebraic justification (IDEA-20260807-4d7e8e); in general it is a
      heuristic and is measured, not assumed, by IDEA-20260807-b42544
      prediction 4.

  reachability_gate: >-
    NOT APPLICABLE TO THE ARGUMENT, WHICH IS CURVE-INDEPENDENT: claim (A) holds
    for every curve with prime-order G, so no isogeny walking, no curve
    selection, and no T5 reachability cost enters. The one place reachability
    would bind is the CLASS 1 boundary instance, which is CONSTRUCTED (choose a
    curve with 3 | h) rather than reached, at cost O(1) trials. T4 does bind on
    the j = 0 specialisation used for the numerical exhibition, but the closure
    itself does not depend on j = 0.

  target_complexity:
    time_exponent: >-
      NO EXPONENT MOVES AND THIS RECORD ASSERTS THAT NO EXPONENT CAN MOVE BY
      THE CLOSED MECHANISM. Quantitatively: at matched |V| the phi-stable base
      needs |V|/r independent relations against |V| for a random base at
      identical per-search success probability, so searches fall by exactly the
      constant r and the arity-2 prime-field total stays about 2 c N / r --
      linear in N. Against rho's 0.886 sqrt(N) that is worse by a factor of
      about sqrt(N) / (0.886 r), which at N = 2^256 is about 2^127. Constants do
      not close that gap and this record states so numerically rather than
      qualitatively.
    memory_exponent: >-
      Unchanged by the closed mechanism. For the record, the reduced relation
      matrix is (|V|/r) x (|V|/r) over Z/N, so the r-fold quotient does divide
      MEMORY by r^2 -- a genuine constant-factor memory saving, and the only
      quantity in this lane that the quotient improves quadratically. It remains
      a constant against rho's O(1) memory, which dominates it absolutely.
    best_known: >-
      Parallel rho with distinguished points at 0.886 sqrt(N) group operations
      and O(1) memory (KN-TECH-001, KN-TECH-006); the automorphism-discounted
      variant on CM curves at 0.886 sqrt(N)/sqrt(|Aut|), i.e. divided by sqrt(6)
      on j = 0 (KN-TECH-018); BSGS at sqrt(N) time and memory. Note the
      asymmetry worth recording: rho gets sqrt(|Aut|) = sqrt(6) from the same
      automorphism group from which index calculus gets r = 3 in the unknown
      count -- and rho gets it on a method that is already sqrt(N), while index
      calculus gets it on a method that is N.
    hidden_overhead: >-
      Nothing hides: no asymptotic claim is made. The one thing worth
      disclosing is that the r-fold unknown reduction is r = |Aut|/2 = 3 and not
      |Aut| = 6, because negation acts trivially on x-coordinates and its saving
      is already taken by the standard {P, -P} factor-base convention. Reporting
      6 here would double-count.
    tradeoff_note: >-
      No tradeoff is introduced. Parallelization is unaffected: dependent rows
      are dependent on every processor.

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES. The closed
    mechanism, taken as an attack, is dominated by every row of the frontier:
    parallel rho with distinguished points (0.886 sqrt(N) time, O(1) memory,
    KN-TECH-001/006); the automorphism-discounted rho on exactly this curve
    family (0.886 sqrt(N)/sqrt(6), O(1) memory, KN-TECH-018); BSGS (sqrt(N)
    time, sqrt(N) memory); and prime-field point-decomposition index calculus
    itself (KN-TECH-003, KN-LIT-006), which is the method the mechanism sits
    inside and which is already dominated by the first three. On data/queries it
    is dominated as well, at O(N/r) decomposition attempts. As a CLOSURE the
    incumbent is KN-FIND-b7e091, which dominates it in generality (all
    generic-group algorithms, not just relation collection) and is dominated by
    it in sharpness (exponent 1/2 versus rank increment exactly 0).
  sota_delta: >-
    Zero speedup, asserted rather than merely observed: the closed mechanism's
    contribution to independent relations is exactly 0. The surviving constant
    is r = 3 in searches and r^2 = 9 in relation-matrix memory, against a
    prime-field arity-2 collection cost that is linear in N, i.e. worse than rho
    by about sqrt(N)/(0.886 * 3). Against the published external state of the
    art, the same quotient is reported by Tsakou-Ionica for F_{q^n}, n > 1 (a
    factor 4 for their genus-2 setting including the {D, -D} class), a setting
    in which the obstruction here does not bind because those groups need not
    have prime order with End = Z/N.

