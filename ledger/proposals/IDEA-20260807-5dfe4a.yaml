idea:
  id: IDEA-20260807-5dfe4a
  question_id: RQ-EQIC-8cb959
  added: '2026-08-07'
  title: >-
    CLOSURE WITH A NAMED OBSTRUCTION: on a prime-order subgroup every
    phi-IMAGE of a relation carries rank increment exactly ZERO, so no
    phi-stable factor base can reduce the NUMBER OF DECOMPOSITION SEARCHES; the
    only surviving levers are the unknown count (a constant r, already
    published) and the algebraic cost of the decomposition test -- with forward
    guidance naming the three classes of construction that escape the argument
  class: mechanism

  claim: >-
    (A) THE OBSTRUCTION, NAMED. Let G = <P> have PRIME order N, let phi be any
    endomorphism of E defined over F_p, and let lambda in Z/N be the scalar by
    which phi acts on G (H-ENDO-001: End(G) = Z/N because N is prime, so every
    endomorphism restricts to a scalar; for the j = 0 automorphism
    phi(x,y) = (zeta_3 x, y) the scalar satisfies lambda^2 + lambda + 1 = 0
    mod N, because 1 + phi + phi^2 = 0 in End(E)). Let a relation be any
    identity of the form
      R_t = sum_i eps_i Q_i,   with R_t = a_t P + b_t Q and Q_i in the factor
      base, contributing the equation
      a_t + b_t k = sum_i eps_i * log(Q_i)   (mod N).
    Then applying phi to that identity yields
      phi(R_t) = sum_i eps_i phi(Q_i),  i.e.
      lambda (a_t + b_t k) = sum_i eps_i lambda log(Q_i)  (mod N),
    which is lambda TIMES the original equation. Since lambda is a unit mod N
    (lambda^2 = -lambda - 1 and gcd(lambda, N) = 1 because N is prime and
    lambda != 0), the two equations span the same one-dimensional subspace. THE
    RANK INCREMENT OF A phi-IMAGE RELATION IS EXACTLY ZERO. This holds for every
    endomorphism, every factor base, every arity, and every target, and it is
    unconditional given only that N is prime.

    (B) THE IMMEDIATE COROLLARY THAT CLOSES THE NAIVE LANE. Whatever the factor
    base V, the number of INDEPENDENT relations obtainable is bounded by the
    number of unknowns, and the number of DECOMPOSITION SEARCHES needed to
    obtain them is (number of unknowns) / (probability a search succeeds).
    Making V phi-stable changes the numerator, from |V| to |V| / r where r is
    the order of phi's action on x-coordinates, because the logs of an orbit are
    determined by one representative. It does NOT change the denominator: the
    probability that a random target decomposes over V is a function of |V| and
    the arity, not of whether V is orbit-structured -- and on j = 0 curves that
    is not even a heuristic, since the on-curve condition depends only on x^3
    (IDEA-20260807-4d7e8e). Therefore, AT MATCHED |V|:
      searches(phi-stable) / searches(random) = 1 / r  exactly,
      and this is the whole effect. Emitting phi(R) and phi^2(R) alongside R
      produces r rows and 1 equation, so any metric counting ROWS reads a
      spurious extra factor of r.

    (C) WHY THIS IS A CLOSURE AND NOT A FATIGUE REPORT
    (docs/inventor-protocol.md section 4). It has (i) a NAMED OBSTRUCTION --
    End(G) = Z/N for prime N, so the phi-action on the relation space is a
    scalar and fixes every subspace; (ii) an ARGUMENT -- four lines, above,
    with no heuristic; and (iii) FORWARD GUIDANCE naming what remains open,
    below. It is not "we screened N mechanisms". It states exactly which
    quantity cannot move and why, and it is checkable by a reader in a minute.

    (D) FORWARD GUIDANCE: THE THREE CLASSES THE ARGUMENT DOES NOT REACH. The
    argument uses exactly two hypotheses -- that N is prime, and that a relation
    is a Z-linear identity among factor-base logs. Drop either and it fails:
      CLASS 1 -- LEAVE THE PRIME-ORDER SUBGROUP. If relations are collected in
        E(F_p) of order h*N with cofactor h > 1, or in a group where End is not
        Z/N, then phi is not a scalar and phi-images can be independent. This is
        the honest escape, and it is also why the argument says nothing about
        higher-genus Jacobians or about E(F_{q^n}) with n > 1 -- exactly the
        settings in which the published endomorphism-index-calculus results live
        (Tsakou-Ionica, F_{q^n}, n > 1). Cost note: over prime-field ECDLP the
        cryptographically relevant subgroup IS prime-order by construction, so
        this class is empty for the campaign's target family and non-empty only
        for the toy or structured instances.
      CLASS 2 -- CHANGE WHAT A RELATION IS. The argument bounds Z-LINEAR
        relations among logs. A "relation" that is not of that form -- a
        multiplicative relation, a relation among x-coordinates as field
        elements, an algebraic identity used as a constraint rather than as a
        row -- is outside its scope. This is the class that
        IDEA-20260807-1ea327, IDEA-20260807-eeb226 and IDEA-20260807-e57607
        occupy: they change the ALGEBRAIC COST of finding a relation, which the
        obstruction does not bound at all.
      CLASS 3 -- USE phi ON SOMETHING THAT IS NOT A POINT OF G. The obstruction
        is about the action on G. phi also acts on the x-line, on the function
        field, on E[l] for l != N, on the isogeny graph, and on the curve
        equation. Lanes L2, L5, L7 and L11 of DECOMPOSITION.md occupy that
        space, and this closure says nothing about them.
      NOT A CLASS, STATED SO IT IS NOT MISREAD AS ONE: "use more endomorphisms".
      Adding r independent endomorphisms adds r scalars, r coordinates and no
      new congruence; the index stays N (H-ENDO-001).

    (E) WHAT THIS RECORD DELIBERATELY DOES NOT CLOSE. It does not close L4. It
    closes ONE mechanism inside L4 -- "use phi to manufacture extra independent
    relations" -- and it does so in order to protect the lane's budget for the
    mechanisms in CLASS 2, which it explicitly leaves open. It also does not
    declare any direction impossible: CLASS 1 and CLASS 3 name concrete settings
    in which the same phi does produce independent relations.

  resource_label: >-
    R3 applied to points of G only, which is precisely why the mechanism closed
    here is inadmissible; the surviving classes named in claim (D) consume R1,
    R2 and R5 instead
  admissibility: inadmissible_generic_group
  admissibility_argument: >-
    FILED AS AN INADMISSIBLE MECHANISM WITH ITS OBSTRUCTION NAMED, per the
    BATCH-cb71b5 brief non-negotiable 1. The mechanism this record closes --
    obtaining additional relations by applying phi to collected relations -- uses
    phi ONLY as a map on points of G. Producing phi(R) from R costs one scalar
    multiplication by lambda, which a generic-group simulator performs with
    group operations alone; this is exactly Oracle D of KN-FIND-b7e091, which is
    GGM-simulable and therefore closed at exponent 1/2 by Shoup's bound. The
    closure in claim (A) is the concrete, quantitative form of that abstract
    closure for the relation-collection setting: not merely "no better than
    sqrt(N)" but "rank increment exactly 0". The proposals this record clears
    the way for (IDEA-20260807-1ea327, -eeb226, -5ddccf, -e57607) are admissible
    for the different reason that they operate on x-coordinates as field
    elements and on the polynomial system, which the simulator cannot touch.

  discriminated_from:
    - >-
      H-STR-002 (weakened, DEC-20260727-009; DEFER-BATCH009-001 OPEN). THIS
      RECORD IS NOT EVIDENCE ABOUT H-STR-002 AND MUST NOT BE CITED AS SUCH IN
      EITHER DIRECTION. H-STR-002 claims that a phi-invariant factor base
      induces a relation matrix of O(1) displacement rank and a consequent
      super-constant linear-algebra saving. This record makes no statement about
      displacement rank, about block-circulant structure, or about
      linear-algebra cost. In particular it does NOT assert that a phi-invariant
      factor base fails to produce an equivariant system -- DEC-20260727-009
      records that the mechanism is UNTESTED, NOT REFUTED, and this record
      leaves that exactly as it found it. What it closes is a different claim
      that H-STR-002 never made: that phi-images are additional INDEPENDENT
      relations. Anyone reading a refutation of H-STR-002 out of this record has
      misread it.
    - >-
      KN-FIND-b7e091 and DEC-20260804-3b4258 (GGM closure of the endomorphism-
      image oracle). That closure is a lower-bound statement in the generic
      group model: algorithms using Oracle D need Omega(sqrt(N)) operations.
      This record is a finer, model-free statement about a specific quantity:
      the rank increment is 0, not merely "not helpful enough". The two are
      consistent and neither implies the other -- a rank-increment-0 operation
      could in principle still help by other means (it does not, by claim (B)),
      and a GGM-closed oracle could in principle produce independent relations
      (it does not, by claim (A)).
    - >-
      H-ENDO-001 (approved, carrying no evidential standing). That record states
      the scalar-action fact and its consequence for the witness lattice and the
      meet-in-the-middle exponent. This record applies the same fact to the
      RELATION SYSTEM of index calculus, where the consequence is a rank
      statement rather than a lattice-index statement, and pairs it with the
      forward guidance the campaign needs. It is an application, not a
      duplicate, and it cites H-ENDO-001 as its premise rather than
      re-deriving it as a result.
    - >-
      EV-STR-003 observation O-11 and DEC-20260727-009 R5, which record a
      measured factor of about 3 in searches per relation ROW. This record does
      not adjudicate what that measurement measured; it states what the
      corresponding factor in searches per independent EQUATION must be
      (exactly 1/r at matched |V|) and leaves the empirical question to
      IDEA-20260807-b42544.

  object_first_candidate:
    tracked_object: >-
      THE SUBSPACE OF (Z/N)^{unknowns + 1} SPANNED BY THE COLLECTED RELATIONS --
      the row space of the relation system including its right-hand side --
      followed under the operation "apply phi to a collected relation".
    lossiness: >-
      LOSSY: it forgets which relations were collected, in what order, with what
      supports and what targets; it retains only the span. This is the correct
      projection for the question at hand, because the only thing a relation is
      worth is what it adds to the span.
    propagation: >-
      Deterministic and, here, TRIVIAL -- which is the finding. phi acts on the
      relation space by the scalar lambda, and a scalar fixes every subspace
      pointwise as a set. So the projection propagates by the identity map. THIS
      IS THE PATHOLOGICAL CASE OF THE LOSSY-PROJECTION TEST
      (docs/inventor-protocol.md section 2), read in the opposite direction from
      usual: the failure mode there is a projection that loses nothing (a change
      of coordinates); here the operation itself does nothing to the projection,
      so tracking the object under that operation is guaranteed to be a constant
      function. An object whose propagation is the identity cannot discriminate
      anything, and recognising that costs no compute -- which is precisely the
      argument for filing this record cheaply and early.
    survival_score: >-
      The obstruction survives every change within the stated hypotheses: any
      endomorphism, any factor base, any arity, any target distribution, any
      curve with prime-order G. It dies exactly at the two hypotheses, which is
      what CLASS 1 and CLASS 2 of claim (D) enumerate.

  mechanism: >-
    This record's "mechanism" is the argument itself, plus the minimal numerical
    check that the argument is not a transcription error.

    STEP 1 -- STATE THE SCALAR. For a generated j = 0 instance, compute
    lambda as a root of X^2 + X + 1 mod N (two roots; pick the one matching the
    chosen zeta_3) and verify numerically that phi(P) == [lambda] P and
    phi(Q) == [lambda] Q with the harness point arithmetic. If this fails the
    instance is invalid, not the argument.

    STEP 2 -- EXHIBIT THE ZERO INCREMENT. Collect one genuine relation over a
    phi-stable base, form its reduced row over the m orbit unknowns (entry
    eps_i lambda^{c_i} at column j_i, right-hand side (a_t, b_t)), then form the
    reduced row of phi(R) and check by exact linear algebra over F_N that the
    second row equals lambda times the first, coordinate for coordinate and
    including the right-hand side. Repeat for phi^2. This is a two-line check
    and it converts claim (A) from an argument into an exhibited instance.

    STEP 3 -- EXHIBIT THE FULL-RANK CONSEQUENCE. Collect until the reduced
    system has rank m, recording the rank after every insertion, with orbit
    closure ON. The rank curve must rise by 1 on every base relation and by 0 on
    every closure row, and the total number of rows at full rank must be exactly
    3m while the number of successful searches is exactly m. Report both
    numbers side by side; that pair IS the closure, made visible.

    STEP 4 -- EXHIBIT A CLASS-1 ESCAPE, so the closure's boundary is not merely
    asserted. On a toy curve whose group is E(F_p) of order h*N with h divisible
    by 3 (deliberately chosen), collect relations in the FULL group rather than
    in G. There End(full group) is not Z/N, phi need not act as a scalar, and
    the phi-image row need NOT be a multiple of the original. Measure the rank
    increment. A nonzero increment there is not a contradiction; it is the
    boundary of the closure, exhibited, and it is what makes the closure a
    scoped statement rather than an impossibility claim.

  novelty_status: known
  novelty_screen:
    method: >-
      Repository greps run 2026-08-07 in this session:
      (1) 'orbit representative|factor.base quotient|quotient the factor base|
      reduced factor base|lambda \* l|scalar lambda' over ledger/, content mode;
      (2) 'phi-invariant|phi-orbit|phi-stable|equivariant",' over the
      repository, files_with_matches;
      (3) 'DEFER-BATCH009-001' over the repository, content mode.
      Records read in full: H-ENDO-001 (via DECOMPOSITION.md section 2 and the
      grep context at ledger/hypotheses/H-ENDO-001.yaml line 63),
      KN-FIND-b7e091, DEC-20260727-009, EV-STR-003 (lines 280-340), H-STR-002,
      RQ-EQIC-8cb959, DECOMPOSITION.md. External: eprint 2021/721 abstract
      fetched (Tsakou-Ionica), plus two web searches recorded in
      IDEA-20260807-1ea327.
    results: >-
      The scalar-action fact is ALREADY IN THIS REPOSITORY as H-ENDO-001 and as
      the section 2 admissibility filter of DECOMPOSITION.md, and its
      generic-group consequence is already a promoted finding
      (KN-FIND-b7e091, DEC-20260804-3b4258). DEC-20260727-009 R5 and EV-STR-003
      O-11 already identify the reproducible effect as the known constant-factor
      automorphism quotient. What grep did NOT find anywhere is the rank-
      increment formulation -- the statement that a phi-image relation adds
      exactly 0 to the rank of the reduced system -- nor the CLASS 1 / CLASS 2 /
      CLASS 3 forward guidance in one place. Externally, Tsakou-Ionica's
      abstract confirms the complementary positive statement in the setting
      where the obstruction does not bind (F_{q^n}, n > 1).
    verdict: >-
      KNOWN. The mathematics is elementary and is already carried by
      H-ENDO-001 and KN-FIND-b7e091; nothing here is new mathematics and none is
      claimed. The contribution is bookkeeping of a kind the inventor protocol
      asks for explicitly: a closure written at the section 4 standard, with the
      obstruction named, the argument in four lines, and the escape classes
      enumerated, filed BEFORE the lane spends compute on the mechanism it
      closes. Filing a known negative cheaply is the intended use of this slot,
      and its honest status is `known`, not `novel`.

  null_object_control: >-
    MANDATORY AND SUPPLIED, and for a closure the null runs in the OPPOSITE
    direction from usual: the risk is not a spurious signal but a spurious
    ABSENCE, i.e. a rank meter that reports 0 increment because it is broken.
    MATCHED NULL (anti-null / planted signal): insert into the same rank meter,
    on the same instance, a relation that is genuinely independent -- a fresh
    decomposition of an unrelated target. The meter must report increment 1. A
    meter that reports 0 for both is measuring nothing and the closure is
    unsupported by measurement (though the argument stands on its own).
    DECAY PARAMETER: the cofactor h of the collection group in STEP 4. As h
    grows through values divisible by 3 the phi-image rank increment must become
    ABLE to be nonzero; if it stays identically 0 even in the full group with
    3 | h, the instrument is not distinguishing the two settings and STEP 4's
    boundary exhibition is void. This is the decay parameter that must destroy
    the effect, run in reverse: the parameter whose increase must RESTORE
    independence.
    SECOND NULL: a random unit c in Z/N replacing lambda -- the row c * (row)
    must also give increment 0. This confirms the meter is detecting scalar
    multiplicity rather than something specific to lambda, which is the correct
    behaviour and separates the closure from a numerological coincidence about
    the particular value of lambda.

  assumptions:
    - >-
      N is prime. This is the load-bearing hypothesis and it is stated as such;
      the closure is exactly as strong as it.
    - >-
      A relation is a Z-linear identity among factor-base discrete logs with a
      right-hand side in the (a_t, b_t) coordinates. This is the second
      load-bearing hypothesis and CLASS 2 of claim (D) is its complement.
    - >-
      phi is an endomorphism of E defined over F_p, so it restricts to G. For
      the j = 0 automorphism this requires p = 1 mod 3.
    - >-
      lambda != 0 mod N, which holds because phi is an automorphism (its
      restriction to a nontrivial subgroup is injective) and N > 3.

  proof_search_map:
    bottleneck: >-
      There is no computational bottleneck: the closure is a four-line argument.
      The bottleneck in the SENSE THE AUDIT MEANS -- the step whose removal
      would change the theorem -- is the primality of N. Remove it and the
      conclusion fails, which is why CLASS 1 exists.
    baseline_embedding:
      parameter_slice: >-
        r = 1, i.e. phi = identity (or phi = [1]). Then the phi-image of a
        relation IS the relation, the rank increment is trivially 0, and the
        statement degenerates to a tautology. The claimed statement therefore
        contains the trivial case as an exact slice and gains content only for
        r > 1, which is the honest boundary.
      reproduction_check: >-
        Frozen fixture: with phi = [1] the STEP 2 check must return
        "row equals 1 times row" exactly. With phi = [lambda] for a random
        lambda not coming from an endomorphism, the check must ALSO return
        "row equals lambda times row" -- confirming that the phenomenon is
        scalar multiplication and has nothing to do with phi being an
        endomorphism. That second check is the sharpest possible statement of
        what the closure is about.
    observation_collision:
      observable: >-
        The rank increment of an inserted row (an integer in {0, 1}).
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, and the collision is the POINT rather
        than a defect: the phi-image row and the c-times row for a random unit c
        have the same observable (increment 0) and different preimages. That
        collision establishes that the observable is detecting scalar
        multiplicity, not endomorphism structure -- which is exactly the
        content of the closure. The collision that WOULD falsify the instrument
        is a genuinely independent relation also reading 0, and the anti-null
        hunts for it.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move "does phi give new relations" into linear algebra over F_N, where
          it becomes the exact condition "is the new row in the span of the old
          rows". Encoding: reduced rows over the orbit unknowns with lambda^{c}
          coefficients. Completeness and soundness: exact, since the map from
          decompositions to rows is injective on supports and the span is
          computed exactly. Transfer: the answer is a rank, which is what the
          linear-algebra stage of index calculus actually consumes. Cost loss:
          none -- the reduction is free and is performed on paper.
        predicted_gain: >-
          Converts an open-sounding question ("does phi-stability help relation
          collection") into a one-line answer for one of its two halves, at zero
          compute, and localises the remaining half (the algebraic cost of the
          decomposition test) precisely.
    quantifier_order: >-
      Stated exactly, because the strength of a closure lives here.
      CLAIMED: FOR ALL primes N, FOR ALL curves E/F_p with a subgroup G of order
      N, FOR ALL endomorphisms phi of E over F_p, FOR ALL factor bases V, FOR
      ALL arities m, FOR ALL collected relations R, the row of phi(R) lies in
      the span of the row of R.
      NOT CLAIMED, and the difference matters: FOR ALL ... the row of phi(R) is
      useless (it is not useless -- it is a correct relation, merely a dependent
      one, and it can substitute for the original); and NOT: no use of phi helps
      relation collection (CLASS 2 and CLASS 3 are explicitly open).
    method_ceiling:
      strongest_certifiable_claim: >-
        "For prime-order G and Z-linear relations among factor-base logs, phi
        contributes zero additional independent relations, and the phi-stable
        factor base's entire effect at matched cardinality is the factor r in
        the unknown count." It can NEVER certify: that phi-stability does not
        change the ALGEBRAIC cost of finding a relation; that no other use of
        phi helps; that the ECDLP is hard; or anything about non-prime-order
        groups, higher-genus Jacobians, or extension fields.
      nearby_object_control: >-
        The full group E(F_p) with cofactor h divisible by 3 (STEP 4). This is
        the closest object on which the desired conclusion FAILS, and exhibiting
        a nonzero rank increment there is what proves the argument identified
        the load-bearing structure (primality of N) rather than something
        incidental about phi.
    proof_obligations:
      - claim: phi acts on G as multiplication by a scalar lambda in Z/N.
        responsibility: correctness
      - claim: lambda is a unit mod N.
        responsibility: correctness
      - claim: the row of phi(R) equals lambda times the row of R, RHS included.
        responsibility: correctness
      - claim: a scalar multiple adds zero to the rank.
        responsibility: correctness
      - claim: >-
          per-search success probability is independent of orbit structure at
          matched |V|
        responsibility: scope
      - claim: the CLASS 1 escape is realisable on an exhibited toy instance.
        responsibility: strictness

  predictions:
    - metric: >-
        rank increment over F_N of a phi-image relation row, inserted after its
        source row
      direction: different
      minimum_effect: >-
        Exactly 0, at every instance, every arity, every base. Zero tolerance:
        this is an algebraic prediction, not a statistical one. A single
        counterexample at prime N would falsify claim (A) and would be the most
        significant observation the lane could produce.
    - metric: >-
        rows at full rank divided by successful searches at full rank, phi arm
        with orbit closure on
      direction: higher
      minimum_effect: >-
        Exactly r = 3 (3m rows, m searches). This pair of integers is the
        closure made visible and both are reported, never their ratio alone.
    - metric: >-
        rank increment of a c-times row for a random unit c not arising from an
        endomorphism
      direction: different
      minimum_effect: >-
        Exactly 0, confirming the phenomenon is scalar multiplicity. If this
        reads 1 the linear-algebra code is wrong.
    - metric: >-
        rank increment of a phi-image row collected in the FULL group E(F_p)
        with cofactor h divisible by 3
      direction: higher
      minimum_effect: >-
        At least one instance with increment 1, exhibiting the CLASS 1 boundary.
        If no such instance can be exhibited, the closure's boundary is asserted
        rather than shown, and the record must say so rather than implying the
        boundary was demonstrated.
    - metric: >-
        anti-null: rank increment of a genuinely independent fresh relation
      direction: higher
      minimum_effect: >-
        Exactly 1. Anything else means the meter cannot see independence and no
        zero it reports is informative.

  minimal_test:
    design: >-
      THE CHEAPEST VALID DISCRIMINATOR IS STEP 2 AND IT COSTS SECONDS: on one
      12-bit j = 0 instance, form one relation's reduced row and its phi-image's
      reduced row and check the second equals lambda times the first over F_N,
      right-hand side included. That single check either exhibits the closure or
      destroys it. STEP 1 (lambda verification) is its precondition. STEP 3 (the
      rank curve to full rank at one instance, reporting 3m rows against m
      searches) costs minutes and produces the reportable pair. STEP 4 (the
      CLASS 1 boundary on a cofactor-3 toy curve) costs an hour and is what
      makes the closure scoped rather than absolute; it is the only part that
      needs new instance-generation code. Anti-null and random-unit control are
      two extra lines each.
    controls:
      - anti-null: a genuinely independent relation must give increment 1
      - random unit c in place of lambda must give increment 0
      - phi = identity fixture must give increment 0 trivially
      - >-
        CLASS 1 boundary: full group with 3 | h, where increment 1 must be
        reachable
      - certificate re-verification of every collected relation
      - >-
        lambda verified numerically as phi(P) == [lambda] P on every instance
    required_metrics:
      - rank increment per inserted row, labelled base / phi-image / control
      - rows at full rank and successful searches at full rank, as two integers
      - lambda, its minimal polynomial mod N, and the verification result
      - cofactor h and group order for the CLASS 1 instance
      - the exhibited counterexample row, if any, recorded verbatim

  falsification_conditions:
    - >-
      A phi-image row is NOT lambda times its source row over F_N at prime N.
      Claim (A) is false as stated; the record is superseded, not amended; and
      the instance is preserved verbatim because it would be the single most
      important artifact in this lane.
    - >-
      The anti-null reads 0. The rank meter is broken; no zero it reported is
      informative; the argument in claim (A) still stands on its own, but the
      record must state that its numerical exhibition failed.
    - >-
      No CLASS 1 instance can be constructed within budget. The boundary is then
      ASSERTED, not exhibited, and the record must label it so. This is a
      budget outcome under AGENTS.md rule 5 and is not evidence that the
      boundary does not exist.
    - >-
      Someone demonstrates a relation notion outside CLASS 2 that is nonetheless
      Z-linear in factor-base logs and gains from phi. That would mean the
      enumeration in claim (D) is incomplete, which is a defect in the forward
      guidance rather than in the obstruction, and it should be recorded as
      such.

  confounders:
    - >-
      lambda AMBIGUITY. X^2 + X + 1 has two roots mod N; the one matching the
      chosen zeta_3 must be selected, or STEP 2 will report a mismatch that
      looks like a falsification and is a sign error. The numerical check
      phi(P) == [lambda] P disambiguates and must be run first.
    - >-
      NON-PRIME N. If the harness's factorisation picks an n that is not
      actually prime, End(G) is not Z/N and the argument does not apply. The
      committed _generate_j0_instance takes n = max(sympy.factorint(order)),
      which is prime by construction, but the primality must be recorded per
      instance rather than assumed.
    - >-
      RIGHT-HAND SIDE OMISSION. If the row is stored without (a_t, b_t) -- which
      is the state DEC-20260727-009 R3 records for this line of work -- then
      "row of phi(R) = lambda times row of R" is checked on an incomplete
      object and the check is not the one claimed. The right-hand side must be
      included.
    - >-
      SIGN CONVENTION. Negation acts trivially on x, so the sign eps_i is a
      choice of lift; an inconsistent choice between the source row and the
      phi-image row will break the scalar identity for reasons that have nothing
      to do with claim (A).
    - >-
