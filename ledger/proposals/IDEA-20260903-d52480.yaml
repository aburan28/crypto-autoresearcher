idea:
  id: IDEA-20260903-d52480
  question_id: RQ-PFDR-ae2fba
  handoff_id: TASK-20260903-dc126c
  added: '2026-09-03'
  title: >-
    THE BOUNDED-LAST-FALL-DEGREE THEOREM OF arXiv:2103.07282 RESTS ON ONE
    LEMMA THE DIGIT PRESENTATION CANNOT SUPPLY (Frobenius acts as a cyclic
    shift on Weil-descent coordinates, Lemma 2.1) and on a reducibility
    hypothesis the digit map does not satisfy, so NO bound transfers to
    IDEA-20260830-84cdb7's base-d system; the honest replacement is a
    MEASUREMENT of the pair (first fall, last fall) on the s-ladder, whose
    three outcomes separate semi-regular growth, isolated early falls that do
    not cascade, and the genuinely bounded case, and whose bounded branch is
    the ONLY one that licenses 84cdb7's conditional exponent because the
    invariant that bounds solving cost is the last fall degree, not the first
  class: measurement

  claim: >-
    (A) WHAT THE RETRIEVED SOURCE ACTUALLY PROVES. arXiv:2103.07282 (Ming-Deh
    Huang, sole author per the abstract page; the corpus record KN-LIT-7605
    carries no author) defines the last fall degree as in Huang-Kosters-Yeo:
    with V_{F,i} the smallest k-subspace of R_{<=i} containing F cap R_{<=i}
    and closed under multiplication that stays in degree at most i, the last
    fall degree d_F is the largest d such that V_{F,d} cap R_{<=d-1} differs
    from V_{F,d-1}. For F over k = F_{q^n} with subfield k' = F_q, F_1 = F
    with the field equations x^{q^n} - x, and F'_1 the Weil descent of F with
    the descended field equations X_{ij}^q - X_{ij}, the retrieved Theorem
    1.1 reads max(d_{F_1}, q deg F) = max(d_{F'_1}, q deg F); Theorem 2.6
    reads that if F is reducible for k then d_{F'_1} <= max((q-1)m + 1, q d)
    with m the number of original variables and d = deg F; and the step that
    carries the descent is Lemma 2.1, quoted as "Suppose f = sum a_{ij} x_{ij}
    in S_1. Then f_i^q equiv_q f_{i+1} (mod Q-bar)", i.e. the q-th power of a
    descended linear form is, modulo the field equations, the same form with
    its coordinate index cyclically shifted, because tau: x -> x^q is the
    Frobenius over k'. The paper is stated for general q (not F_2 only), and
    the retrieved text contains NO mention of summation polynomials, Semaev
    or ECDLP; the summation-polynomial application lives in KN-LIT-7607
    (Huang-Kosters-Yeo, recalled), not here. KN-LIT-7605's key-claims block
    ("stated for summation-polynomial systems over F_2 specifically") is
    therefore NOT supported by the retrieved abstract and introduction, and
    this record says so rather than propagating it.
    (B) THE STEP THAT DOES NOT TRANSFER, NAMED. The digit presentation of
    84cdb7 writes x = sum_{i<s} a_i d^i with a_i(a_i - 1) ... (a_i - d + 1) = 0
    over F_p. The formal dictionary to the descent is q <-> d, m <-> m,
    n <-> s, X_{ij} <-> a_{k,i}. Two things the descent has and the digit map
    lacks. (B1) THE FROBENIUS SHIFT. In the descent the map x -> x^q is a
    k'-LINEAR automorphism of k permuting the descended coordinates up to
    the field equations, which is exactly Lemma 2.1 and is what lets a
    relation found in one coordinate block propagate to all n blocks at no
    degree cost. Over F_p the only Frobenius is x -> x^p, which is the
    IDENTITY on F_p and in particular fixes every digit value 0..d-1; there
    is no automorphism of F_p that permutes digit positions, and the digit
    map is not additive (carries), so x -> x^p induces nothing on
    (a_0..a_{s-1}). The lemma has no analogue and the propagation it buys is
    absent. (B2) THE REDUCIBILITY HYPOTHESIS. Theorem 2.6 requires F to be
    "reducible for k", a condition on F being expressible through linearized
    (k'-linear) structure; the base-d expansion is not k'-linear for any
    subfield because F_p has none, so the hypothesis is unavailable.
    CONSEQUENCE: no version of the bounded-last-fall theorem transfers to
    the digit presentation, neither with the same constant nor with a
    different one; the analogue constant max((d-1)m + 1, d * 2m) = 4m at
    d = 2 is a NUMBER WITH NO THEOREM BEHIND IT and is used below only to
    show that the s-ladder cannot even reach it, so the measurement is a
    slope test and not a bound test.
    (C) THE MEASUREMENT THAT REPLACES THE THEOREM. Tracked object: the pair
    (d_ff(s), d_lf(s)) on 84cdb7's ladder d = 2, m in {2, 3}, s in {1..5},
    with d_ff the first-fall degree already defined in 84cdb7 and d_lf the
    last fall degree computed by the V_{F,d} closure of (A) in exact linear
    algebra over F_p, order-independent by construction. By definition
    d_ff <= d_lf. Three pre-registered outcomes. OUTCOME I (semi-regular):
    both grow with slope indistinguishable from m(d-1)/2 = m/2 in s and
    d_lf - d_reg_null in {0,1,2}; the digit presentation is generic and
    afe4ce's escape E1 closes with a slope. OUTCOME II (isolated early
    fall): d_ff flat or sublinear while d_lf keeps slope m/2; the system has
    low-degree falls that do NOT cascade to a solution, which is precisely
    the case in which a first-fall-based cost model is wrong by an
    unbounded factor and KN-LIT-7607's warning is realized in the prime-
    field digit form; 84cdb7's H1 is then TRUE AS STATED and USELESS, and
    this record says so in advance. OUTCOME III (bounded): d_lf flat across
    at least four consecutive s; the only outcome that licenses 84cdb7's
    conditional exponent, with D_0 = the flat value handed to
    IDEA-20260903-dcf857's cost table, which shows that D_0 <= 4..6 is
    needed for the conditional route to matter at 256 bits.
    (D) WHAT A BOUNDED LAST FALL DEGREE WOULD AND WOULD NOT LICENSE. Huang-
    Kosters-Yeo (recalled) show that a Groebner basis, hence the solutions,
    can be obtained by linear algebra in degree governed by max(d_F, deg of
    the generators), so a bounded d_lf bounds ONE complexity measure - the
    Macaulay degree - at binom(ms + D_0, D_0)^omega per solve. It does not
    bound the number of solves, does not touch yield (KN-FIND-007), and
    2103.07282 itself does not conclude any subexponential ECDLP algorithm
    from its bound; the same restraint binds here.

  mechanism: >-
    THE LAST-FALL CLOSURE AS AN INSTRUMENT. Fix a degree bound D. Start from
    W_0 = the degree-<=D Macaulay row space of the generators (monomial
    multiples m f with deg(m f) <= D), computed by exact row reduction over
    F_p on the multilinear-reduced monomial basis (the digit field equations
    are applied as the reduction rule a^d -> lower terms, so the ambient
    space is the quotient by them). Iterate: extract a basis of W_t cap
    R_{<=D-1} (the elements whose leading form dropped), multiply each by all
    monomials keeping degree <= D, add to W_t, reduce, obtain W_{t+1}; stop
    when the dimension stabilises; the result is V_{F,D}. A FALL AT D means
    V_{F,D} cap R_{<=D-1} strictly contains V_{F,D-1}. d_ff is the least D
    with a fall (this coincides with 84cdb7's definition at the first
    iteration and is reported through the same code path as a consistency
    check); d_lf is the largest D <= D_max with a fall, reported WITH the
    censoring flag "no fall observed in (d, D_max]" so that a right-censored
    value is never quoted as a bound. The iteration is at most binom(ms+D,D)
    rank computations of a matrix with that many columns, so the cost is a
    small multiple of 84cdb7's own per-cell cost and the memory envelope of
    84cdb7 (pre-flight column count, abort above 50,000 columns or 4 GiB,
    the (m,d,s,D) = (2,2,6,8) cell excluded by name) is inherited verbatim.
    WHY THE PAIR AND NOT EITHER NUMBER. d_ff alone is 84cdb7 and cannot
    distinguish Outcome II from Outcome III; d_lf alone cannot distinguish
    Outcome I from Outcome II. The pair is the lossy projection of the whole
    fall history to its two endpoints and it is exactly what the three
    mechanisms differ on.
    WHY THE LADDER IS A SLOPE TEST. At m = 2, d = 2 the semi-regular null is
    d_reg = s + 2 (84cdb7's ceil((ms(d-1) + 2m)/2)), taking the values
    3,4,5,6,7 at s = 1..5, while the formal analogue constant 4m = 8 is not
    reached until s = 6 (and s = 6 needs the excluded 125,970-column cell at
    D = 8). At m = 3 the null is ceil((3s + 6)/2) = 5,6,8,9,11 at s = 1..5
    against a formal constant 12, again not separable on the ladder. So the
    ladder CANNOT test "d_lf <= 4m"; it CAN test slope 0 against slope m/2
    at resolution 0.25 with four to five points, which is what Outcome III
    asks. This is disclosed so that a flat d_lf at s <= 5 is reported as a
    slope, never as a bound in s.

