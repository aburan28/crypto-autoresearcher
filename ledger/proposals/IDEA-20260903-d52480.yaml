      KN-LIT-024, KN-LIT-029, KN-OPEN-002; first 80 lines of
      IDEA-20260830-ad0be4 and first 70 of -cb8e46. WEB: WebFetch of
      https://arxiv.org/abs/2103.07282 (abstract page, retrieved), of the PDF
      twice (the tool could not decode it), and of the ar5iv HTML rendering,
      which returned verbatim quotations of the definition, Theorem 1.1,
      Theorems 2.5 and 2.6, Lemma 2.1 and the field-setting sentences; the
      proof bodies were NOT read line by line.
    results: >-
      No corpus record computes a last fall degree on any prime-field system;
      afe4ce derives a FLOOR on it for the direct presentation and 84cdb7
      measures d_ff only. No record names the Frobenius-shift lemma as the
      non-transferring step. KN-LIT-7605's claim that the result is stated
      for summation polynomials over F_2 is contradicted by the retrieved
      text of 2103.07282 (general q, no Semaev mention); that discrepancy is
      recorded here and in the session accounting as a literature pointer.
      All absences are floors.
    verdict: >-
      UNVERIFIED. The last-fall machinery is Huang-Kosters-Yeo's; the
      transfer analysis in (B) is elementary once the lemma is in view and
      may exist as a remark in KN-LIT-7607 or in later work by the same
      authors, neither of which was opened in full. The record's value is
      the named non-transferring step, the (d_ff, d_lf) pair as the tracked
      object, and the correction of which invariant licenses 84cdb7's
      conditional claim.

