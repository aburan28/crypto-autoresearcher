  minimal_test:
    design: >-
      STAGE 0 (zero compute, hard gate): write the dictionary of claim (B)
      and the two non-transferring steps; evaluate the null formula and the
      formal analogue constant on the ladder and record that they do not
      separate at s <= 5 (this is the record's first deliverable and is
      complete here). STAGE 1 (hours): implement the V_{F,D} closure on top
      of 84cdb7's exact graded-rank engine; validate on the s = 1 slice
      against afe4ce's floor and on an F_2 Weil-descent fixture against the
      retrieved bound. STAGE 2 (hours): the m = 2, d = 2, s in {1..5} ladder
      at p in {2^12, 2^14, 2^16}, 8 generic-j curves, 5 seeds, planted
      targets, D_max = 7, recording the fall history; NULL-1 and NULL-2 and
      the non-curve cubic at every cell. STAGE 3 (hours, optional under the
      memory contract): m = 3, d = 2, s in {2, 3}. STAGE 4 (zero compute):
      slopes, intervals, outcome label, censoring report. The cheapest valid
      discriminator is STAGE 2 at s in {2,3,4} only: three uncensored cells
