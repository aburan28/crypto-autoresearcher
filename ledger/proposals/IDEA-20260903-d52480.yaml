  novelty_screen:
    method: >-
      KB RETRIEVAL UNAVAILABLE (empty embedded store, per the handoff);
      search_knowledge was not called. Grep over ledger/ for 'last fall|
      last-fall' (11 files, all opened at least at the title level: the two
