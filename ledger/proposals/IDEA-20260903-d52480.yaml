  heuristic_assumptions:
    - id: H1
      statement: >-
        LAST-FALL SEMI-REGULARITY OF THE NULL. For the random-generator digit
        system at fixed (m, d), the last fall degree satisfies
        d_lf = ceil((ms(d-1) + 2m)/2) + c with c in {0, 1, 2}, uniformly in
        s on the tested ladder and in p >= 2^12.
      rigorous_support: >-
        RIGOROUS: the digit field equations form a regular sequence whose
        quotient has Hilbert series (1 + ... + z^{d-1})^{ms} exactly; the
        first fall of a semi-regular sequence is at the first non-positive
        coefficient. CLASSICAL DISTRIBUTION IMITATED: Froberg /
        Bardet-Faugere-Salvy semi-regularity for the one extra generator,
        plus the expectation that for a zero-dimensional semi-regular system
        the falls cascade to completion within O(1) degrees of the first.
        The O(1) is the heuristic content and is why c is a band.
      validation_plan: >-
        SAMPLE: NULL-1 and NULL-2 at every Stage 2 cell, 5 seeds each.
        COMPARISON: the integer band above. TAIL CHECK: the largest observed
        c across the ladder and whether it grows with s (a growing c means
        the null's own last fall is not O(1) past d_reg and the band must be
        widened before the Semaev arm is read). SAMPLED PARAMETERS RECORDED:
        p, m, d, s, seed, D_max, iteration counts. TRANSFER: none.
    - id: H2
      statement: >-
        BOUNDED LAST FALL, DIGIT FORM (the hypothesis Outcome III would
        support and Outcomes I and II refute). There exists D_0 depending on
        (m, d) but not on s, p or the curve such that d_lf(m, d, s) <= D_0.
      rigorous_support: >-
        NONE TRANSFERS, and that is claim (B): the descent theorem's lemma
        has no F_p analogue. The classical statement imitated is the
        retrieved Theorem 2.6 with the dictionary q <-> d, n <-> s. The
        honest prior is AGAINST H2 (KN-LIT-7607's doubt adopted, and the
        semi-regular null contradicts it).
      validation_plan: >-
        SAMPLE: the Stage 2 ladder. There is NO shortcut that reaches
        cryptographic s for this quantity and none is claimed; unlike
        the p-axis (IDEA-20260903-26aa81), the s-axis is where the matrices
        grow. COMPARISON: slope 0 against slope m/2 at resolution 0.25.
        TAIL CHECK: the top two uncensored cells. TRANSFER: a flat d_lf at
        s <= 5 is a slope statement, never a bound in s.

  target_complexity:
    time_exponent: >-
      NO ATTACK IS CLAIMED. The record's own cost is a constant multiple of
      84cdb7's (at most binom(ms+D, D) extra rank computations per cell,
      typically 2-4). CONDITIONAL ON H2 AND ON 84cdb7's COST MODEL: the
      decomposition oracle costs binom(ms + D_0, D_0)^omega and the index-
      calculus total is N^{2/(m+1)+o(1)}, with the o(1) priced in
      IDEA-20260903-dcf857 at 256 bits as 2^{93} (D_0 = 8, m = 4, omega = 2)
      down to 2^{52} (D_0 = 4), which is the difference between losing and
      tying with rho.
    memory_exponent: >-
      Instrument: as 84cdb7, at most about 350 MB per cell with the 4 GiB
      abort. Conditional: N^{1/(m+1)+o(1)} for the relation matrix, far above
      rho's O(1).
    best_known: >-
      Pollard rho at 0.886 sqrt(N) with O(1) memory; BSGS at (N^{1/2},
      N^{1/2}); kangaroo; automorphism-discounted rho; Pohlig-Hellman;
      generic preprocessing S T^2 = N; algebra-free MITM index calculus at
      N^{1/2+1/m}. For the invariant itself: Huang-Kosters-Yeo and
      2103.07282 over extension fields; no prime-field last-fall measurement
      exists in this corpus.
    hidden_overhead: >-
      (1) D_0 is unknown and, by claim (B), unbounded by any theorem. (2) The
      closure's iteration count is a hidden constant in the instrument cost.
      (3) Outcome III at s <= 5 cannot exclude growth beyond the ladder.
    tradeoff_note: >-
      None for the instrument. For the conditional line, as 84cdb7: time
      N^{2/(m+1)} against memory N^{1/(m+1)}, not dominating rho on memory.

