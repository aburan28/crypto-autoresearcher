  assumptions:
    - >-
      Same construction as 84cdb7: p > 3, d^s <= p, planted targets, the
      y^2 = f(x) soundness arm run on a subsample; nothing about yield is
      read off this battery.
    - >-
      The V_{F,D} closure is computed to a fixed point at each D by exact
      arithmetic; termination is guaranteed because the ambient space at
      degree D is finite-dimensional.
    - >-
      d_lf is reported with a censoring flag whenever no fall is observed
      in (d, D_max]; a censored cell may not enter a slope fit.

  proof_search_map:
    bottleneck: >-
      The step of 2103.07282's argument that lets a fall found in one
      descended coordinate block propagate to all blocks at no degree cost:
      Lemma 2.1, the Frobenius cyclic shift. Its absence over F_p is the
      exact reason no bound transfers.
    baseline_embedding:
      parameter_slice: >-
        Two slices. (i) s = 1, where the digit system IS the direct
        presentation and afe4ce's floor d_lf >= B must be reproduced exactly
        by the closure instrument (B = d there). (ii) The Weil-descent system
        itself over F_2 at small n, where the instrument must reproduce a
        last fall degree at or below the retrieved bound max((q-1)m+1, qd)
        with q = 2, as a known-answer check of the closure implementation
        against a theorem.
      reproduction_check: >-
        Symbolic at s = 1 (generator lists identical to 84cdb7's s = 1 slice)
        and numeric on the F_2 descent fixture (bound respected at every
        tested n, with the fall history logged).
    observation_collision:
      observable: >-
        The pair (d_ff(s), d_lf(s)) and the full fall history {D : fall at D}.
      distinct_preimage_search: >-
        REQUIRED AND BLOCKING: the support-matched random generator null of
        84cdb7 (same digit field equations, random polynomial of the same
        multidegree support in place of the substituted S_{m+1}) must be run
        through the identical closure; if its (d_ff, d_lf) pair coincides
        with the Semaev arm's at every cell, the observable carries no
        summation-polynomial information and every conclusion is about
        degree-d complete intersections. Second collision search: the
        equal-d^s presentations (2,6), (4,3), (8,2) at B = 64 have the same
        ideal and may have different d_lf; their spread is the presentational
        artifact budget, as in 84cdb7.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace the single integer d_ff by the pair (d_ff, d_lf), and where
          budget allows the whole fall history, because the pair is what
          survives the passage from "a fall exists" to "the solve is
          bounded".
        predicted_gain: >-
          Separates three mechanisms that d_ff alone merges; in particular
          exposes Outcome II, the case that would make 84cdb7's H1 true and
          worthless.
      - transform: observable_fiber
        proposed_object: >-
          Hold the shape (m, d, s) fixed and vary the forgotten structure:
          Semaev generator versus random same-support generator versus the
          non-curve cubic nearby object of 84cdb7.
        predicted_gain: >-
          Attributes any bounded d_lf to the curve or to the digit complete
          intersection before it is believed.
    quantifier_order: >-
      NOT CLAIMED (the theorem does not transfer): EXISTS D_0 FORALL s such
      that d_lf(m,d,s) <= D_0. MEASURED: FORALL cells of the declared ladder,
      the fitted slopes of d_ff and d_lf in s with 95 percent intervals at
      resolution 0.25, the outcome label by the pre-registered rule, and the
      count of censored cells. The dangerous reading FORALL s EXISTS D_0 is
      vacuous and is not what Outcome III means.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On the tested (m, d, s, p, curve) ladder and the frozen closure
        convention, the last fall degree of the digit-presented prime-field
        decomposition system has fitted slope beta_lf with interval I_lf, and
        the first fall degree has slope beta_ff with interval I_ff." It
        cannot certify a bound uniform in s, cannot reach the formal analogue
        constant 4m, and cannot certify any solver's actual cost.
      nearby_object_control: >-
        The Weil-descent system over F_2, where a bounded last fall degree IS
        a theorem: the instrument must see the bound there. A closure
        implementation that reports growth on the F_2 descent fixture is
        broken, and one that reports boundedness on the random-generator
        digit null is measuring the complete intersection.
    proof_obligations:
      - claim: >-
          Lemma 2.1 of 2103.07282 has no analogue over F_p because x -> x^p
          fixes every digit and does not permute digit positions.
        responsibility: correctness
      - claim: >-
          The closure instrument reproduces afe4ce's floor at s = 1 and the
          retrieved bound on the F_2 descent fixture.
        responsibility: baseline
      - claim: >-
          d_ff computed by the closure agrees with 84cdb7's graded-rank d_ff
          on every cell.
        responsibility: interface
      - claim: >-
          Censored cells never enter a slope fit; Outcome III is not declared
          from a ladder with censored or aborted cells at its top.
        responsibility: scope
      - claim: >-
          The per-cell cost is at most a constant multiple of 84cdb7's
          per-cell cost under the same memory contract.
        responsibility: memory
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: >-
      The pair (d_ff, d_lf) of the digit-presented decomposition system, and
      behind it the fall history, followed along the s-ladder at fixed (m, d).
    lossiness: >-
      GENUINELY LOSSY: the entire graded rank filtration and every polynomial
      in it is projected to two integers; the fibre over a pair is enormous.
      NOT a change of coordinates: the pair takes different values on the
      three mechanisms in (C) by construction. This is the same object class
      as IDEA-20260806-7ea402's d_solve (one integer) and IDEA-20260815-
      05c761's three degrees, restricted to the two fall endpoints.
    propagation: >-
      Deterministic under degree increment: V_{F,D} is computed from the
      generators at each D, falls are monotone events in the sense that once
      V_{F,D} contains a lower-degree element every V_{F,D'} for D' >= D
      contains it, and the two endpoints are read off the fall history.
    survival_score: >-
      Survives changes of solver and monomial order (order-independent by
      Huang-Kosters-Yeo). Dies at a change of generating set (84cdb7 and
      ad0be4: generator-level invariant), which is disclosed and is why the
      equal-d^s arm is run.

  null_object_control: >-
    NULL-1 (blocking): 84cdb7's support-matched random generator with the
    same digit field equations; forced value under semi-regularity
    d_ff = d_lf - {0,1,2} = ceil((ms(d-1) + 2m)/2). NULL-2 (blocking, per the
    handoff): a uniformly random MULTILINEAR polynomial in the ms digit
    variables of the same per-block degree as the multilinear reduction of
    the substituted S_{m+1}; forced value as NULL-1. NEARBY OBJECT: the
    non-curve cubic of 84cdb7. KNOWN-ANSWER: the F_2 Weil-descent fixture,
    where the bound of Theorem 2.6 must be respected. STRUCTURAL TELL
    (inventor-protocol section 3): a d_lf that is flat in s while the null's
    d_lf rises, at absolute value equal to the s = 1 value, is the canonical
    artifact signature (a closure that never iterates); the iteration count
    per cell is a required metric so that a non-iterating closure is visible.

  discriminated_from:
    - >-
      IDEA-20260830-84cdb7: measures d_ff on the same ladder. This record
      adds d_lf by the V_{F,d} closure, uses the pair to separate Outcome II
      from III, and corrects which invariant licenses 84cdb7's conditional
      exponent. Operation-level difference: the closure iterates the
      Macaulay row space to a fixed point at each degree; 84cdb7 takes one
      rank per degree.
    - >-
      IDEA-20260808-afe4ce: a last-fall FLOOR for the direct presentation,
      derived from membership degree B. Here the floor is vacuous (degree d)
      and the last fall degree is measured, not bounded.
    - >-
      Lane B corner B1 (p-ary algebraic immunity of the multilinear Semaev
      reduction, FIRST fall): not filed on here; d_ff enters this record only
      as the lower endpoint of the pair, through 84cdb7's definition, with no
      immunity mechanism proposed.
    - >-
      IDEA-20260815-05c761: measures solving degree, degree of regularity and
      Castelnuovo-Mumford regularity on S_3 systems in the direct
      presentation; none of the three is the last fall degree and the direct
      presentation's floor pre-decides them.
    - >-
      IDEA-20260806-e4f96e: polynomial-calculus refutation degree on
      unsatisfiable instances; here instances are satisfiable (planted) and
      the object is the fall history, not a refutation.

