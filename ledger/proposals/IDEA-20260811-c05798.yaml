  id: IDEA-20260811-c05798
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  title: >-
    THE CLOSURE, WITH A NAMED OBSTRUCTION AND A TWO-LINE PROOF -
    O-SEMICONTINUITY. The Macaulay matrix of the Semaev system has entries
    polynomial in (a, b), so its rank is LOWER semicontinuous; therefore at every
    special j the ideal is SMALLER in each degree, the quotient algebra is
    BIGGER, and the solving degree, Groebner-basis size and Betti numbers are all
    at least their generic values. DEGENERATION MOVES ALGEBRAIC COST IN THE WRONG
    DIRECTION AS A MATTER OF THEOREM - which explains, for the first time, why
    the committed j = 1728 measurement showed gb_size moving the WRONG WAY by
    +3.41% while the support dropped 23.1%
  class: mechanism

  object: >-
    OBJ-SEMICONT, the rank function of the degree-d Macaulay matrix of the
    Semaev system as a function on the (a, b)-plane, and its descent to the
    j-line. The tracked object is a RANK, and its defining property is that it
    is a lower semicontinuous integer-valued function on an algebraic base -
    which is what converts an open-ended search over special j into a bounded
    statement with a direction.

  resource: >-
    R1 and R2. H-ENDO-001 admissibility: no endomorphism acts on any point of G,
    and the argument never leaves the polynomial system.

  claim: >-
    (A) THE THEOREM, WITH ITS PROOF. Fix m, a monomial degree d, and the Semaev
    system in the variables x_1..x_m (with or without the factor-base membership
    polynomials f_V, which do not depend on (a, b)). The degree-d Macaulay matrix
    M_d(a, b) has entries that are POLYNOMIALS in a and b. For any matrix family
    with polynomial entries, rank is LOWER SEMICONTINUOUS in the Zariski topology:
    rank M_d(a_0, b_0) >= r is an open condition, cut out by the non-vanishing of
    some r x r minor. Hence:
      (i) there is a dense open subset U of the (a, b)-plane on which
          rank M_d is constant and MAXIMAL, and
      (ii) on the complement, a proper closed subset, rank M_d can only DROP.
    Since the dimension of the degree-d part of the ideal is exactly rank M_d,
    the ideal is SMALLER at every special point, the quotient algebra is LARGER,
    and every functional monotone in the quotient - the Hilbert function, the
    degree of regularity, the first-fall degree, the size of the reduced Groebner
    basis, the graded Betti numbers - is at least its generic value.
    THEREFORE NO DEGENERATION OF THE CURVE EQUATION CAN REDUCE ANY OF THEM. The
    direction of the inequality is the whole content, and it is the opposite of
    the direction this lane has been implicitly hoping for.
    [Derived in this record. Elementary; the only ingredients are that minors are
    polynomials and that the ideal's graded piece is the row space of M_d. To be
    re-verified symbolically as the experiment's first act.]
    (B) IT EXPLAINS THE CAMPAIGN'S STANDING ANOMALY, WHICH IS THE STRONGEST
    EVIDENCE FOR IT. The committed pair has always read as paradoxical: at
    j = 1728 the S_3 support drops 23.1% - the input polynomial gets SPARSER -
    and gb_size moves the WRONG WAY, +3.41% (red_team_notes.md section 11,
    committed). Under O-SEMICONTINUITY that is not a paradox, it is the
    prediction: a sparser generator generates a SMALLER ideal, the quotient is
    bigger, and the Groebner basis of a bigger quotient is bigger. THE SIGN OF
    THE COMMITTED ANOMALY IS THE SIGN THE THEOREM PREDICTS. No record in this
    campaign has offered any explanation of that sign, and this one does, with a
    direction that was fixed before the data was re-examined and that can be
    checked against every other locus.
    (C) COMPOSED WITH THE CENSUS, THIS CLOSES THE ALGEBRAIC HALF OF THE LANE.
    O-SEMICONTINUITY says any algebraic-rank advantage is confined to a proper
    closed subset of the j-line, hence to a FINITE set of j. IDEA-20260811-3e08e0
    shows a finite set of j has density Theta(1/p) among curves and, by T4, is
    unreachable from an instance whose class does not already contain one. AND
    (A) SAYS THE ADVANTAGE AT THOSE POINTS IS NEGATIVE ANYWAY. The three
    statements compose into a closure at the inventor-protocol standard:
      OBSTRUCTION - O-SEMICONTINUITY: rank-defined cost functionals of an
        algebraic family are minimal generically and can only worsen on
        degeneration loci.
      ARGUMENT - lower semicontinuity of matrix rank over a polynomial base,
        plus T4 fixing the class's j-set, plus the finite-divisor density bound.
      FORWARD GUIDANCE - see (D). This is not a fatigue report and does not count
        rejected mechanisms; it names a mechanism and says exactly what it does
        not cover.
    (D) WHAT ESCAPES, NAMED PRECISELY. O-SEMICONTINUITY binds only functionals
    that are ranks or dimensions of polynomially-parametrised objects. IT DOES
    NOT BIND:
      E1 - COUNTS OF F_p-RATIONAL POINTS. The number of F_p-solutions of the
        Semaev system in the factor-base window is not a rank; it can jump in
        EITHER direction on a special fibre. Relation density lives here, which
        is why IDEA-20260811-473c2e is not closed by this argument.
      E2 - FACTORISATION TYPE OVER F_p and anything Galois-theoretic, which is
        not semicontinuous in the naive sense; IDEA-20260811-6034d0 lives here.
      E3 - THE AUTOMORPHISM GROUP, an integer that is not a rank of this family;
        the automorphism discount is real, and is capped at sqrt(6) by
        KN-TECH-018 for entirely different reasons.
      E4 - CONSTANTS AND IMPLEMENTATION EFFECTS - sparse-matrix cost charged per
        non-zero entry falls with support even when the rank does not, giving at
        most a constant factor of 439/391 = 1.12 at the largest known block.
      E5 - MULTI-INSTANCE AND PREPROCESSING STRUCTURE (R8), which changes the
        model rather than the fibre.
      E6 - ANY FUNCTIONAL OF A DIFFERENT FAMILY, e.g. one parametrised by the
        factor base or by the model rather than by (a, b).

  mechanism: >-
    Genericity is maximality for ranks. A polynomial system with generic
    coefficients has the largest possible ideal in every degree, because the
    minors that certify rank are non-zero polynomials and vanish only on a proper
    closed set. Specialising the coefficients - which is exactly what fixing a
    special j does - can only kill minors, never create them. So the search for a
    "computationally easier special curve" among algebraic rank functionals is
    searching in the direction the inequality forbids. The mechanism is not
    subtle and its very simplicity is the point: it is available before any
    compute, and the campaign has spent two batches measuring quantities it
    predicts the sign of.

  novelty_status: adaptation
  novelty_note: >-
    Lower semicontinuity of matrix rank and upper semicontinuity of Betti numbers
    under specialisation are standard (Hartshorne, Eisenbud; CITATIONS TO BE
    VERIFIED in the run record with theorem numbers, never paraphrased from
    memory). THE ADAPTATION is applying them to the Semaev family over the
    (a, b)-plane to obtain a DIRECTIONAL closure for this lane, and observing
    that the direction matches the committed gb_size anomaly. Corpus grep: no
    record in ledger/ or knowledge/ mentions semicontinuity, generic ideals, or
    any directional argument about special fibres; the campaign's own
    interpretation of the +3.41% is that gb_size "moves the WRONG WAY", recorded
    as an anomaly with no explanation. External literature NOT checked for a
    published semicontinuity analysis of summation polynomials.
  not_a_duplicate_of: >-
    NOT IDEA-20260807-f00729, which is the OTHER closure in this lane and is
    about the automorphism quotient failing to be a group homomorphism - a
    statement about propagation through the group law, on a different object,
    with a different obstruction, covering E3 and nothing else. NOT
    IDEA-20260811-97e244, which predicts that support drops do not change the
    Newton polytope; that is a combinatorial statement about a specific
    functional, this is a directional statement about ALL rank functionals at
    once, and 97e244's predicted O-INTERIOR is logically independent - a polytope
    could be unchanged while the rank drops, and vice versa. NOT
    IDEA-20260811-6034d0, which this record explicitly declares OUTSIDE its scope
    under E2.

  assumptions:
  - >-
    The Macaulay matrix entries are polynomial in (a, b). True by construction
    for the Semaev system in any fixed degree and monomial order; verified
    symbolically as gate 1.
  - >-
    The base is the (a, b)-plane over an algebraically closed field for the
    semicontinuity statement; over F_p the conclusion holds for the F_p-points of
    the open set, and the contract must state that the "dense open subset" is
    dense in the Zariski sense and that its F_p-points are all but O(p) of the
    p^2 pairs - which at toy p is a meaningful caveat and must be quantified, not
    waved.
  - >-
    Monotonicity of the SOLVER's cost in the quotient algebra's size is
    assumed for the practical reading and is NOT part of the theorem. The theorem
    bounds Hilbert functions, degrees of regularity, Betti numbers and reduced
    Groebner basis sizes; the step from those to wall-clock is empirical and is
    exactly where the campaign's committed -0.44% shows the relation is weak.

  proof_search_map:
    bottleneck: >-
      The exact bottleneck is the degree of regularity of the Semaev system,
      whose reduction would change both the theorem and the cost. This record
      shows the bottleneck cannot be reduced by moving along the j-line, which is
      a statement about the whole lane rather than about one experiment.
    baseline_embedding:
      parameter_slice: >-
        The generic curve is the exact old-method boundary: the theorem asserts
        the generic fibre is OPTIMAL, so the baseline is not merely reproduced,
        it is proved to be the best member of the family. The parameter slice
        that reproduces it is any (a, b) outside the eight known loci.
      reproduction_check: >-
        Symbolic: compute rank M_d(a, b) at a generic point and at each of the
        eight loci, for m = 3 at several degrees d, and confirm the generic rank
        is maximal. A frozen fixture pins the generic rank profile.
    observation_collision:
      observable: The rank profile d -> rank M_d, equivalently the Hilbert function.
      distinct_preimage_search: >-
        PERFORMED AND POSITIVE. The rank profile is J-measurable
        (IDEA-20260811-bbcd68) hence collides on twist pairs and carries no
        isogeny-class information. THE SEPARATING CONDITION: this record makes no
        class claim at all - it is a statement about the (a, b)-plane. A second,
        more interesting collision: the generic rank profile is shared by an
        open dense set of curves, which is the theorem, not a defect.
    constructive_transforms:
    - transform: boundary_lift
      proposed_object: >-
        Rather than searching for a curve that beats the generic one, PROVE the
        generic one is the boundary and that the family cannot be pushed inward.
        This is the baseline-as-boundary transform used in the negative
        direction: establishing that the boundary is tight rather than lifting it.
      predicted_gain: >-
        Converts an unbounded search over the j-line into a proved optimum plus a
        named list of escapes, which is the difference between a closure and an
        indefinite programme.
    quantifier_order: >-
      FOR ALL m, FOR ALL degrees d, FOR ALL monomial orders, and FOR ALL (a, b),
      rank M_d(a, b) <= rank M_d(generic), with equality on a dense open set.
      THERE IS NO WITNESS ANY PARTY MAY CHOOSE - the inequality holds pointwise
      and uniformly. That total absence of an exploitable existential is exactly
      what makes it a closure rather than a difficulty.
    method_ceiling:
      strongest_certifiable_claim: >-
        That every rank-defined cost functional of the Semaev family is minimised
        generically. It CANNOT certify anything about E1-E6, and in particular
        cannot certify that special j confers no advantage whatsoever - only that
        the advantage cannot come from a rank.
      nearby_object_control: >-
        The nearby object where the desired conclusion fails is a functional in
        class E1 - the count of F_p-rational solutions in a window. Applying the
        method there must FAIL to give a direction, because point counts are not
        semicontinuous; a version of the argument that "proved" a direction for
        point counts would be proving too much and would be wrong. That control
        is the cheapest test that the argument is tracking the right structure.
    proof_obligations:
    - claim: Macaulay matrix entries are polynomial in (a, b)
      responsibility: correctness
    - claim: Rank is lower semicontinuous over a polynomial base
      responsibility: baseline
    - claim: The generic rank is attained off a proper closed subset
      responsibility: correctness
    - claim: gb_size and Betti numbers are at least generic at all eight loci
      responsibility: feasibility
    - claim: The escapes E1-E6 are genuinely outside the argument
      responsibility: scope
    - claim: The F_p-point density of the open set is quantified at toy p
      responsibility: scope

  predictions:
  - metric: rank_of_macaulay_matrix_at_each_locus_versus_generic
    direction: lower
    minimum_effect: >-
      LESS THAN OR EQUAL at every locus, every degree, every order - EIGHT OF
      EIGHT, with no exception. A single locus with rank STRICTLY GREATER than
      generic falsifies the theorem outright and would indicate an error in the
      derivation or the implementation.
  - metric: gb_size_at_each_locus_versus_generic
    direction: higher
    minimum_effect: >-
      GREATER THAN OR EQUAL at every locus. The committed +3.41% at j = 1728 is
      the one existing data point and it has the predicted sign; the prediction
      is that all eight share it. A locus with strictly SMALLER gb_size is a
      pre-registered falsification and would be the most interesting outcome in
      the batch.
  - metric: degree_of_regularity_at_each_locus_versus_generic
    direction: higher
    minimum_effect: >-
      GREATER THAN OR EQUAL. NOTE THE INSTRUMENT CAVEAT, WHICH IS COMMITTED: the
      campaign's groebner_basis_max_degree is annotated in source as "proxy, NOT
      degree of regularity" (harness/semaev.py line 85), and the campaign has
      never measured d_reg, d_ff, a Macaulay rank or a Betti table. THIS RECORD
      PROPOSES TO MEASURE THE MACAULAY RANK DIRECTLY, which is the quantity the
      theorem is about and which requires no resolution backend - so the D1
      precondition that paused EXP-ICINV-e0cd8f does not bind it.
  - metric: hilbert_function_at_each_locus_versus_generic
    direction: higher
    minimum_effect: >-
      Coefficientwise GREATER THAN OR EQUAL for the quotient in every degree, at
      every locus.
  - metric: nonzero_entry_count_versus_rank
    direction: lower
    minimum_effect: >-
      Reported as the E4 contrast: the non-zero entry count FALLS while the rank
      also falls, so the two move in the same direction while their COST
      consequences move in opposite directions. This single table is the clearest
      possible statement of why sparsity and hardness are not the same axis.
  - metric: point_count_control_direction
    direction: different
    minimum_effect: >-
      NO CONSISTENT DIRECTION for the count of F_p-solutions across the eight
      loci - some up, some down. If the point counts DID move consistently in one
      direction, either the argument proves more than it should or the point
      counts are not measuring what they claim.

  minimal_test:
    design: >-
      SYMBOLIC AND EXACT, NO TIMING REQUIRED FOR THE PRIMARY CLAIM. (1) Verify
      the entries of M_d are polynomial in (a, b) and pin the construction. (2)
      For m = 3 and, if budget allows, m = 4, and for degrees d up to the point
      where the rank stabilises, compute rank M_d symbolically at a generic
      (a, b) over QQ(a,b), and then at each of the eight loci by substitution.
      Report the full rank profile per locus. (3) Compute the Hilbert function of
      the quotient at each locus. (4) Compute gb_size and the max-degree proxy at
      each locus at p = 4001 and at one prime above 2^20, reported under their
      true names. (5) Run the E1 point-count control. (6) Quantify the F_p-point
      density of the generic open set at p = 4001: the eight loci carry
      8 * (p - 1) points out of p^2 - hence about 8/p ~ 0.2% - and the contract
      must state this rather than saying "dense". (7) Cite the semicontinuity
      theorems with theorem numbers and record whether the source was opened.
    controls:
    - >-
      C-GENERIC-MAXIMAL (BLOCKING). The generic rank must be the maximum over all
      sampled (a, b); sample 1000 random pairs and confirm none exceeds it. A
      random pair exceeding the "generic" rank means the generic computation was
      done at a special point.
    - >-
      C-POINT-COUNT (the escape control). E1 must show no consistent direction.
    - >-
      C-ORDER. Two monomial orders; the rank of M_d is order-independent for a
      fixed degree and monomial basis, so a disagreement is an implementation
      error.
    - >-
      C-NULL-LOCUS. Ten random weight-12 loci; the rank must be GENERIC at all
      ten, confirming that specialising to a locus does not by itself drop the
      rank and that the eight are the actual degeneration set.
    - >-
      C-CITATION. Every external theorem cited with a theorem number and an
      honest opened/not-opened status.
    required_metrics:
    - macaulay_rank_profile_per_locus_per_m_per_degree
    - hilbert_function_of_quotient_per_locus
    - gb_size_and_max_degree_proxy_per_locus_per_prime
    - nonzero_entry_count_per_locus
    - f_p_solution_count_per_locus_in_a_fixed_window
    - generic_maximality_check_over_1000_random_pairs
    - f_p_point_density_of_the_degeneration_set
    - citation_status_per_external_theorem

  lossy_projection_answer: >-
    THIS RECORD IS THE THEORETICAL COMPANION TO THE LANE'S LOSSY-PROJECTION
    FAILURE, AND IT SUPPLIES THE MISSING SIGN. The chain is
    (a, b) -> coefficients -> Macaulay matrix -> rank -> ideal size -> quotient
    size -> Groebner cost. The projection onto SUPPORT is lossy and, as
    IDEA-20260811-97e244 argues, cost-invisible. The projection onto RANK is also
    lossy - it discards everything but an integer - but it is compatible with
    specialisation in the strongest possible way, because rank behaves
    monotonically under it. And the monotone direction is the UNFAVOURABLE one.
    So the honest summary of this lane's algebraic half is: the functional you
    can compute cheaply (support) tells you nothing about cost, and the
    functional that does control cost (rank) is provably worst at exactly the
    points you hoped were best. That is a sharper statement than "no effect
    found" and it is available for the price of a symbolic rank computation.

  t5_reachability_answer: >-
    T5 IS NOT REACHED BECAUSE THERE IS NOTHING TO REACH, AND THAT IS STRONGER
    THAN A REACHABILITY FAILURE. Under O-SEMICONTINUITY the minimiser of every
    rank-defined cost functional is the GENERIC curve, which is where a random
    walk already is - a random vertex of a class lies in the open set with
    probability 1 - O(1/p). So clause (i) of T5 is satisfied trivially and
    uselessly: goodness is not rare, it is universal, and it is what you already
    have. The special vertices are the BAD ones. Composed with
    IDEA-20260811-3e08e0's census this gives the complete picture: about twelve
    curves per prime are algebraically special, they are unreachable from almost
    every instance, and they would be worse if you got there.

  null_object: >-
    C-NULL-LOCUS (ten random weight-12 loci, predicted to show generic rank) is
    the matched null; C-GENERIC-MAXIMAL (1000 random (a,b), none exceeding the
    generic rank) is the second null and is the one that catches the most likely
    implementation error; C-POINT-COUNT is the escape control that prevents the
    argument from proving too much.

  falsification_conditions:
  - >-
    rank M_d at any locus STRICTLY EXCEEDS the generic rank at any degree. The
    theorem is contradicted; check whether the "generic" point was itself special
    before concluding anything, since that is the overwhelmingly likely cause.
  - >-
    gb_size at any locus is STRICTLY SMALLER than generic. The practical reading
    of the theorem fails - the monotonicity from quotient size to Groebner basis
    size is not what it appears - and the lane has a real, direction-correct
    effect to chase. This is the outcome that would reopen the algebraic half.
  - >-
    A random pair in C-GENERIC-MAXIMAL exceeds the computed generic rank. The
    generic computation was performed at a special point and everything is void.
  - >-
    A random locus in C-NULL-LOCUS drops the rank. Specialisation itself drops
    the rank and the eight loci are not distinguished; the framing collapses.
  - >-
    The E1 point counts move consistently in one direction across all eight loci.
    Either the escape classification is wrong or the point counting is; both are
    checked before either is believed.
  - >-
    The cited semicontinuity theorems cannot be verified at the stated theorem
    numbers. The argument's external support is unconfirmed and the record's
    status drops to `unverified` rather than being asserted anyway.

  confounders:
  - >-
    "Generic" over F_p is not "generic" over an algebraically closed field. At
    p = 4001 the degeneration set carries about 8*(p-1) of p^2 points, i.e. about
    0.2%, so the open set is genuinely dominant - but the contract must compute
    that number rather than invoke density, and at very small p the argument
    would be vacuous.
  - >-
    Degree truncation. Rank is computed degree by degree; a conclusion drawn at
    degrees below where the rank stabilises is about a truncation, not about the
    ideal. The contract must show the profile has stabilised.
  - >-
    f_V-bearing versus f_V-free. The theorem holds for both, since f_V does not
    depend on (a, b), but the MAGNITUDES differ enormously because the f_V-bearing
    system's solving degree is pinned by |V| (EV-ICINV-6b6264 boundary 2). Both
    are reported and never pooled.
  - >-
    The step from Hilbert function to wall-clock is empirical and weak, as the
    committed -0.44% shows. The theorem's practical force is therefore a
    DIRECTION, not a magnitude, and the record claims only the direction.
  - >-
    Characteristic-specific rank drops. A minor that is non-zero over QQ can
    vanish mod p, creating loci that exist only in characteristic p. Those are
    reported separately and are not part of the char-0 statement.

  interpretation_limits:
  - >-
    THE CLOSURE IS SCOPED TO RANK-DEFINED FUNCTIONALS OF THE (a, b)-FAMILY, and
    the escapes E1-E6 are listed precisely so that the closure is not over-read.
    In particular it does NOT close relation density, factorisation type, the
    automorphism discount, sparse-matrix constants, or the multi-instance model.
  - >-
    It is a statement about the family, not about ECDLP. No cost model, no
    exponent, no attack.
  - >-
    Under docs/inventor-protocol.md section 4 this qualifies as a closure only if
    the obstruction, the argument AND the forward guidance are all delivered;
    the forward guidance is limb (D) and it is not optional.
  - >-
    claim_tier toy for the measured half; the theorem half carries no
    experimental tier and must be recorded as a derivation.

  heuristic_assumptions:
  - id: H1
    statement: >-
      NO DISTRIBUTIONAL HEURISTIC IS LOAD-BEARING IN LIMB (A). Lower
      semicontinuity of matrix rank over a polynomial base is a theorem with a
      one-line proof by minors.
    rigorous_support: >-
      The vanishing locus of all r x r minors is Zariski-closed; rank >= r is its
      complement, hence open. The companion statements for Betti numbers and
      Hilbert functions under specialisation are standard (Hartshorne, Eisenbud;
      theorem numbers to be recorded in the run record).
    validation_plan: >-
      Symbolic verification of the rank profile at a generic point and at all
      eight loci in two independent engines, plus C-GENERIC-MAXIMAL over 1000
      random pairs. No sampling distribution applies. Tail check: the highest
      degree at which the rank has not yet stabilised, since a conclusion drawn
      before stabilisation is the most likely error mode.
  - id: H2
    statement: >-
      Solver wall-clock is monotone non-decreasing in the size of the quotient
      algebra, so the theorem's direction transfers to measured cost.
    rigorous_support: >-
      NONE. This is the weak link and it is named as such. The committed evidence
      is one supporting data point (gb_size +3.41% at j = 1728, the predicted
      direction) and one uninformative one (Groebner time -0.44%, a
      near-zero change of the opposite sign whose magnitude is within plausible
      run-to-run noise that the campaign has never characterised).
    validation_plan: >-
      Sample: the eight loci plus 20 generic curves at p = 4001 and at one prime
      above 2^20, at three factor-base densities, with the run-to-run
      distribution of solve time measured FIRST on repeated identical inputs so
      that a minimum detectable effect exists before any comparison. Comparison:
      the sign of the gb_size and time differences against the predicted
      non-negative direction, reported per locus, never pooled. Tail check: the
      locus with the largest coefficient block (48 at a^3 + 8b^2) should show the
      largest effect if any effect exists, and a large effect at the 1-coefficient
      locus with none at the 48-coefficient locus would refute the mechanism.
      THIS ARM IS GATED ON HOST LOAD (DEC-20260810-d70ece NA6) and a degraded run
      is an infrastructure receipt, never a result.

  target_complexity:
    time_exponent: >-
      NONE CLAIMED, AND THE RECORD ARGUES NONE IS AVAILABLE FROM THIS AXIS. The
      strongest statement is negative: no j-line degeneration reduces a
      rank-defined cost functional, so the exponent of any algebraic
      relation-collection method is unchanged by the choice of j within a class.
    memory_exponent: >-
      NONE CLAIMED. The same argument applies to Macaulay matrix size, which is
      the memory driver of an F4/F5 solve: the matrix is no smaller at a special
      fibre in rank, and its non-zero count falls by at most 439/391 = 1.12.
    best_known: >-
      0.886*sqrt(N) group operations and O(1) memory for parallel rho
      (KN-TECH-001, KN-TECH-006); automorphism-discounted on CM curves
      (KN-TECH-018). Prime-field index calculus is not competitive at any tested
      scale here.
    hidden_overhead: >-
      Nothing hides in an o(1) because there is no positive asymptotic claim. The
      NEGATIVE claim's hidden weakness is H2 - the step from algebra size to
      wall-clock - and it is named rather than buried.
    tradeoff_note: >-
      Not applicable to a claim. Note for completeness that the E4 escape - sparse
      linear algebra charged per non-zero entry - is a genuine time-memory-relevant
      constant of at most 1.12 at the largest known block, and a constant of that
      size is far below the sqrt(6) automorphism threshold that the lane's own
      decision target calls baseline calibration.

  dominated_by: >-
    n/a as an attack - this record claims no attack result and produces no
    solver, so every row of the frontier (parallel rho with distinguished points,
    BSGS, kangaroo, prime-field index calculus) trivially dominates it. As a
    CLOSURE it is dominated by nothing in the corpus: the only other closure in
    this lane, IDEA-20260807-f00729, covers the automorphism-quotient object and
    is logically independent of this one.
  sota_delta: >-
    ZERO on every axis, and the record's own claim is that zero is provably the
    best this axis can do for rank-defined functionals.

  estimated_cost:
    implementation: low
