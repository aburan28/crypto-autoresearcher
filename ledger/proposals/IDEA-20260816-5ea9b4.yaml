idea:
  id: IDEA-20260816-5ea9b4
  question_id: RQ-FBG-001
  added: '2026-08-16'
  title: 'Audit what a matched random factor base actually is: measure how much of every recorded
    structured-geometry excess is produced by the choice among three defensible matched nulls - matched
    nominal size, matched negation-collapsed effective size, and matched total multiset count - by
    computing all three in one invocation'
  class: control
  claim: '(A) THE HIDDEN DEGREE OF FREEDOM. Every geometry measurement in this bucket is a ratio against
    a matched random base, and the word matched is doing unexamined work. Three definitions are each
    defensible. MATCHED NOMINAL: the null has the same number of listed elements B. MATCHED EFFECTIVE:
    the null has the same number of distinct group elements after collapsing the negation pairs that
    share an x-coordinate and after deduplication, which is the number that actually enters the counting
    identity. MATCHED MULTISET COUNT: the null is sized so that the total number of size-m multisets,
    binomial(B+m-1, m), agrees, which is the quantity the exact counting identity forces to be equal
    across bases. These three differ, and they differ systematically by geometry: an x-line geometry
    is automatically closed under negation and so has fewer distinct group elements per listed element
    than an exponent-side geometry does. (B) THE CLAIM. The claim is that the choice among the three
    nulls changes measured excess by an amount comparable to the excesses this program has recorded
    - that is, that a reported excess near 1.001 to 1.03 can be moved into or out of significance
    by the null definition alone, while a large excess such as the ceiling-attaining 1.1071 survives
    all three. If so, the null definition is not a detail but a reporting requirement, and every geometry
    measurement should publish all three ratios. (C) THE DELIVERABLE. A table with one row per geometry
    and three excess columns, plus the negation-collapse fraction per geometry which is the mechanism
    by which the definitions diverge. The negative outcome - all three nulls agreeing within intervals
    for every geometry - is equally valuable and closes the question with a measured bound on the
    null-choice sensitivity. (D) WHAT IS NOT CLAIMED. No attack, no break, no speedup, no security
    consequence. It is NOT claimed that any recorded result is wrong; the contract computes a sensitivity,
    not a correction, and cannot revise a record it does not re-run. It is NOT claimed that one of
    the three nulls is correct - the contract''s position is that the right null depends on what is
    being asked and that publishing all three is what honesty requires. It is NOT a measurement of
    yield, relation rate, decomposition or linear algebra.'
  mechanism: 'STAGE 1. For each geometry in a fixed panel, construct the base and compute three numbers:
    nominal listed size, effective distinct-group-element size after negation collapse and deduplication,
    and total multiset count binomial(B_eff + m - 1, m). Record the negation-collapse fraction, meaning
    the ratio of effective to nominal size. STAGE 2. Construct three matched random nulls in the same
    invocation: one at matched nominal size, one at matched effective size, one sized so its total
    multiset count agrees. Each is drawn by the same sampler under recorded seeds. STAGE 3. Measure
    exact coverage over the complete target space for the geometry and for all three nulls, and form
    three excess ratios. STAGE 4. Report the spread across the three ratios per geometry, and compare
    that spread to the recorded excesses in this program. STAGE 5. Sweep group size and geometry so
    the spread is a curve rather than a point. STAGE 6. Refutation route. If the three ratios agree
    within intervals for every geometry at every size, the null choice is immaterial in the tested
    scope and the question is closed with a measured bound. If they disagree by more than the smallest
    recorded excess, then every single-null excess in this bucket is under-specified and the contract
    says so without asserting that any specific recorded verdict flips - which would require re-running
    that battery, which this contract does not do.'
  novelty_status: unverified
  novelty_screen:
    method: Read EV-FBG-001 in full, noting its explicit statement that the matched random null draws
      from range [1, N) while the convention string says [0, N) - a validation finding about the null's
      definition, at a different level than this contract's question - and its record of exact coverage
      ratios. Read H-FBG-001, RQ-FBG-001, KN-OPEN-020. Greps over ledger/proposals and ledger/hypotheses
      for 'matched random base' (8-plus hits including IDEA-20260807-e57607, IDEA-20260808-726aa3,
      IDEA-20260807-f8a045, IDEA-20260808-9ef88c, IDEA-20260805-a25f11, IDEA-20260807-5ddccf, IDEA-20260807-1ea327,
      IDEA-20260805-4ddd8c), 'negation', 'twist', 'effective size', 'deduplication'.
    results: Matched random controls are pervasive, appearing in at least eight proposals plus the
      frozen battery, and negation and twist symmetry are discussed in KN-OPEN-006 as a threat to
      translation invariance. EV-FBG-001's validation notes record a null-range discrepancy of [1,
      N) versus [0, N), which shows the program already treats the null's exact definition as auditable
      - but at the level of sampling range, not at the level of what quantity is being matched. I
      found no record that computes multiple matched-null definitions in one invocation and reports
      the excess spread across them, and no record that publishes a negation-collapse fraction per
      geometry.
    verdict: 'UNVERIFIED. Nothing is asserted about external literature; control matching is ordinary
      experimental practice and no publication claim is made. What is claimed new here is treating
      the matched-null definition as an independent variable with three declared levels and reporting
      the induced spread as the deliverable, together with the negation-collapse fraction as the mechanism.
      Assembled from known parts: the exact counting pipeline and matched random control from the
      frozen battery; the counting identity forcing total multiset count; the negation symmetry noted
      in KN-OPEN-006.'
  object_first_candidate:
    tracked_object: THE PAIR (nominal size, effective size) of the factor base - the listed count
      alongside the count of distinct group elements surviving negation collapse and deduplication
      - carried through the coverage computation and used to index the three null definitions.
    lossiness: 'Lossy. The pair discards which elements collapsed, the curve, the field, the actual
      point coordinates and the entire count vector, retaining two integers and their ratio. That
      is discarded compatibly with the target operation, because the counting identity that governs
      coverage depends on the base only through its number of distinct group elements: the total multiset
      count is binomial(B_eff + m - 1, m) and is blind to which elements those are. So the retained
      pair determines exactly the quantity that distinguishes the three nulls. Enormous numbers of
      bases share the pair. What the projection cannot see - and the contract states this - is the
      arrangement of the surviving elements, which is precisely what produces coverage excess above
      the null; the pair explains the null''s position, not the geometry''s excess.'
    propagation: 'One step of the target operation - admitting one more candidate element into the
      base - acts on the retained pair as: nominal size increases by 1 always, effective size increases
      by 1 only if the candidate is not the negation of an element already present and is not a duplicate.
      So the pair propagates as a two-counter automaton whose divergence rate is exactly the collision
      rate of the geometry''s construction with its own negation image. For an x-line geometry that
      admits both points over each accepted x, the divergence is deterministic and equals a factor
      of 2; for an exponent-side geometry it is near zero. That deterministic divergence is the whole
      mechanism.'
    survival_score: 'The pair remains informative while nominal and effective sizes differ measurably,
      which for x-line geometries is the entire range and for exponent-side geometries is nowhere.
      Concretely: the object separates geometries into two classes with collapse fractions near 0.5
      and near 1.0 across every tested size, and it dissolves as an explanatory object exactly when
      a geometry''s collapse fraction is near 1.0, at which point the three null definitions coincide
      and the object has nothing left to say - which is itself the reportable outcome for that geometry.'
  null_object_control: 'The null objects here are the three matched random bases themselves, and the
    control that makes the comparison meaningful is a CONSISTENCY CHECK among them: a random base
    has collapse fraction determined only by the birthday-style collision rate at size B in a group
    of order N, so the three nulls must differ from each other by a predictable and small amount,
    computable in closed form before the run. For the signal arm to mean anything, the three nulls
    measured against each other must reproduce that closed-form spread within intervals; if they do
    not, the samplers differ in some way other than size and the whole comparison is void. A second
    control is required: a geometry with collapse fraction exactly 1.0 by construction, for which
    all three nulls must give identical excess to within interval width. If they do not, the null
    construction itself carries a size-independent bias.'
  discriminated_from:
  - 'EV-FBG-001''s recorded validation finding about the null sampling range [1, N) versus [0, N):
    that is an implementation-fidelity defect about how the null is drawn. This contract asks what
    quantity the null is matched on, which is a design question that would remain even with a perfect
    sampler.'
  - 'IDEA-20260815-c13ef4 and the other designed-versus-sampled comparisons: they use one matched
    null and compare geometries. This holds the geometry fixed and varies the null.'
  - 'EXP-RELN-0a979f: measures the collision deficit against derived ceilings and floors, using the
    mean as a forced reference. That contract already exploits the counting identity; this one uses
    the identity to define a third null and measures the spread the choice induces.'
  - 'The planted-structure detection-floor calibration: that measures the smallest resolvable effect
    under one fixed null. This measures how much the effect itself moves when the null is redefined.
    The two are complementary and neither substitutes for the other.'
  - 'KN-OPEN-006''s remark that negation and twist symmetry can break translation invariance: a statement
    about the linear-algebra structure. Here negation enters as an effective-size bookkeeping term
    with no linear algebra involved.'
  assumptions:
  - Negation collapse and deduplication are the only two mechanisms by which nominal and effective
    size diverge at these parameters; any curve with extra automorphisms is excluded from the panel
    or reported separately.
  - The counting identity depends on the base only through its number of distinct group elements,
    which the closed-form total check verifies per cell.
  - Three matched nulls drawn by the same sampler under different size rules differ only in size;
    the consistency check is the guard for this.
  - Coverage is the free coordinate, mean yield being size-forced, so an excess ratio is a meaningful
    thing to compute at all.
  predictions:
  - metric: negation-collapse fraction for x-line-defined geometries
    direction: lower
    minimum_effect: 0.55
  - metric: spread in excess ratio across the three null definitions, for geometries with collapse
      fraction near 0.5
    direction: higher
    minimum_effect: 0.01
  - metric: spread in excess ratio across the three null definitions, for a geometry with collapse
      fraction exactly 1.0
    direction: different
    minimum_effect: 'forced value: below the interval half-width at every size; a larger spread indicates
      a size-independent bias in the null construction and voids the comparison'
  - metric: whether the ceiling-attaining geometry's excess remains above 1.05 under all three null
      definitions
    direction: different
    minimum_effect: 'explicit refusal to pre-commit a threshold beyond the stated 1.05: whether a
      large excess survives redefinition is the substantive question and pre-committing a survival
      margin would prejudge it'
  minimal_test:
    design: One curve, one size, four geometries, three nulls, one invocation. Take a toy prime-order
      curve with N near 2^16 and set nominal B equal to ceiling of (6N) to the one-third power. Build
      four bases spanning the collapse range - a high-bit x-line interval expected near 0.5, a quadratic-residue
      x-line set, an exponent-side arithmetic progression expected near 1.0, and a ceiling-attaining
      exponent-side construction. For each, compute nominal size, effective size after negation collapse
      and deduplication, and the total multiset count. Then draw the three matched random nulls in
      the same invocation and measure exact coverage over the complete target space for all bases
      and all nulls. Emit a four-row table with three excess columns and the collapse fraction. The
      discriminating output is the spread within each row compared with the interval half-width. First
      verify the three nulls reproduce their closed-form mutual spread; if they do not, stop. Cost
      is four geometries plus three nulls times one exact count each, which is minutes at this size.
    controls:
    - Closed-form mutual-spread check among the three nulls, computed before the run and verified
      after.
    - A geometry with collapse fraction exactly 1.0 by construction, for which the three nulls must
      agree within interval width.
    - A deliberately negation-doubled base - every element paired with its negation - which must show
      the maximum possible divergence between nominal and effective size.
    - 'Closed-form total check per cell: summed multiset count equals binomial(B_eff + m - 1, m) exactly.'
    - Identical sampler, identical seed discipline and identical coverage code across all three nulls,
      run in one process.
    required_metrics:
    - nominal size, effective size and negation-collapse fraction per geometry
    - exact coverage per base and per null
    - three excess ratios per geometry with bootstrap intervals
    - spread across the three ratios per geometry
    - closed-form mutual-spread residual among the three nulls
    - closed-form total residual per cell, which must be exactly zero
  falsification_conditions:
  - The three nulls do not reproduce their closed-form mutual spread, showing the samplers differ
    in more than size.
  - The collapse-fraction-1.0 control shows spread beyond interval width, showing a size-independent
    bias in the null construction.
  - All three null definitions agree within intervals for every geometry at every size, refuting the
    claim and closing the question with a measured bound on null-choice sensitivity.
  - Any closed-form total residual is nonzero, voiding the counter.
  - The negation-doubled control does not show the maximum divergence, showing the effective-size
    computation is wrong.
  - A curve in the panel turns out to carry extra automorphisms, making negation collapse an incomplete
    account of divergence for that cell.
  confounders:
  - Curves with extra automorphisms collapse more than negation alone predicts, and if one enters
    the panel unnoticed it produces a divergence attributed to the wrong mechanism.
  - Deduplication and negation collapse interact with the trimming rule used to reach a target size,
    so trimming can manufacture or hide divergence.
  - At small B the closed-form mutual spread among the nulls is itself within interval width, making
    the consistency check vacuous exactly where the measurement is cheapest.
  - Sampling range conventions - the [1, N) versus [0, N) issue already recorded in this program -
    would bias all three nulls together and would not show up as spread.
  - Coverage saturation compresses all three ratios toward each other at small N, understating the
    spread.
  interpretation_limits:
  - A measured spread is a statement about reporting under-specification, not a correction to any
    recorded verdict; no record is re-run and none is revised.
  - The contract takes no position on which null is correct and explicitly declines to designate one.
  - Nothing here bears on yield, relation rate, decomposition or linear algebra.
  - Toy sizes only, and the spread is reported per tested size rather than extrapolated.
  target_complexity:
    time_exponent: No attack exponent is claimed. The measurement costs one exact coverage computation
      per base and per null, order N times B squared at arity 3.
    memory_exponent: No attack memory exponent is claimed. Peak memory is one count vector of length
      N plus the discrete-logarithm table where an exponent-side geometry needs one.
    best_known: 'The incumbent is current practice: a single matched random base at matched nominal
      size, as used in the frozen battery and in the eight-plus proposals the screen found. There
      is no recorded measurement of null-choice sensitivity in this repository, so there is no incumbent
      number to beat and the contribution is the sensitivity''s existence.'
    hidden_overhead: The hidden cost is that publishing three ratios per geometry triples the reporting
      surface and invites selective quotation - an agent can cite whichever of the three supports
      the reading it prefers. The contract's only defence is requiring all three to be published together
      in every downstream citation, which is a discipline, not a mechanism. A second overhead is that
      effective-size computation on curves with extra automorphisms needs a different account, and
      screening for them is manual.
  dominated_by: 'n/a (no result claimed) on attack axes; the contract yields no algorithm, so no attack
    frontier row is displaced. On the measurement''s own axes the check is real and I ran it against
    every coverage row this repository records: the frozen battery''s coset_union at 1.0012 and greedy_optimized
    interval [1.00105, 1.00456] at 2^18 are the rows most exposed to a null-definition spread of the
    size this contract predicts, and both are dominated on robustness by the ceiling-attaining Bose-Chowla
    row at 1.1071, which is large enough that no plausible null redefinition moves it below 1.0; the
    whole-group greedy row at 1.0269 sits in between and is the interesting case. On cost, single-null
    practice dominates this contract everywhere, since it does one third of the work.'
  sota_delta: 'No attack; control-validity contribution only. Quantitatively: this program currently
    reports coverage excesses against exactly one null definition, with recorded values of 1.0012,
    1.0269 and 1.1071 and no sensitivity figure. A completed run would attach a three-value spread
    to each geometry it measures and would state which of the recorded magnitudes lie inside and outside
    that spread. No attack cost, relation rate, solve time or exponent changes.'
  estimated_cost:
    implementation: low
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'Negation-collapse fraction near 0.5 for x-line geometries: about 0.9
    - this is close to arithmetic, since accepting an x-coordinate admits two points unless the point
    is 2-torsion. The three nulls reproducing their closed-form mutual spread: about 0.8, with the
    risk concentrated in whether my closed form for the deduplication collision rate is right at these
    small sizes. Spread exceeding 0.01 in excess ratio for high-collapse geometries: about 0.6 - I
    believe the mechanism is real but I am unsure the magnitude reaches the recorded excesses rather
    than sitting an order below them, and the honest possibility is that the spread is around 0.002,
    which would still bracket the 1.0012 row and not the 1.0269 one. The collapse-fraction-1.0 control
    agreeing across nulls: about 0.85. The large ceiling-attaining excess surviving all three definitions:
    about 0.85, since a 10 percent effect is far above any plausible bookkeeping spread. Overall probability
    the run produces a defensible sensitivity table rather than a consistency-check failure: about
    0.65, and probability the sensitivity turns out large enough to change how this bucket reports
    results: about 0.4.'
