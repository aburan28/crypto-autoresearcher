  heuristic_assumptions:
    - id: H1
      statement: >-
        For each (e_1..e_{n-1}) in the generic specialised support of
        S_n(., x_R), the sum over e_n of coeff(e_1..e_n) x_R^{e_n},
        restricted to a = 0 (resp. b = 0), is not the zero polynomial in
        (b, x_R) (resp. (a, x_R)); i.e. cancellation across the e_n-fibre does
        not occur.
      rigorous_support: >-
        RIGOROUS: at n = 3 this is H-JINV-0e8819's nine-coefficient check,
        and the fibre sums are polynomials with integer coefficients whose
        vanishing is decidable exactly. CLASSICAL STATEMENT IMITATED: 'a
        generic linear combination of nonzero polynomials with distinct
        x_R-degrees is nonzero' -- here the summands have DISTINCT
        x_R-degrees e_n by construction, so cancellation can only occur if
        every individual coefficient vanishes, which reduces H1 to the
        statement that each fibre contains a coefficient surviving a = 0.
        The heuristic content is therefore zero; it is listed because it is
        the one place (T3)'s support-equality clause can fail and it is
        checked, not assumed.
      validation_plan: >-
        SAMPLE: every (e_1..e_{n-1}) at n = 4 and n = 5, exact symbolic
        computation over Q[a, b, x_R]; COMPARISON: the generic support set;
        TAIL CHECK: the monomials with the fewest contributing e_n (the
        extreme corners of the polytope), which are the only candidates for a
        one-element fibre. No sampling, no transfer.
    - id: H2
      statement: >-
        Per-target solver cost on the ladder follows a single power law in B
        over B in [8, 18] at m = 3, so a log-log fit over six B values
        estimates sigma to the reported interval; and paired timings at fixed
        input have a coefficient of variation small enough that 20 targets
        detect a 0.10 shift in sigma at 80 percent power.
      rigorous_support: >-
        RIGOROUS: cost is bounded below by output size and above by
        exhaustive enumeration times the engine's per-step cost. CLASSICAL
        STATEMENT IMITATED: exponent fitting from a bounded range with
        residual diagnostics (the same H2 as IDEA-20260727-007 and the pilot
        requirement of IDEA-20260811-18bbf9's H2).
      validation_plan: >-
        SAMPLE: a pilot of 40 repetitions of one fixed cell per arm to
        measure the coefficient of variation and the achieved minimum
        detectable sigma shift BEFORE the ladder; COMPARISON: linear against
        quadratic log-log fit by an F test; TAIL CHECK: the ratio of the
        slowest target to the mean, bounded across B. If the achieved MDE
        exceeds 0.10 the band is widened before the run and recorded.

