  assumptions:
    - >-
      p congruent to 1 mod 3 for the j = 0 crater (p = 19717: 19717 = 3 *
      6572 + 1, satisfied; to be re-checked), curves ordinary by point count.
    - >-
      The crater's a = 0 model is used (the census returns j = 0; the
      Weierstrass model y^2 = x^3 + b is chosen and its twist recorded).
    - >-
      Targets drawn with targets_B, r-stratified, x_R = 0 excluded and
      counted (the degenerate stratum of H-JINV-0e8819).
    - >-
      One engine, one monomial order, one machine for every arm; sigma is a
      within-engine slope; a second order on one cell is run as a control.
    - >-
      Toy tier throughout: N = 19507, p = 19717, B <= 18.

  proof_search_map:
    bottleneck: >-
      The step whose removal changes the conclusion is the specialisation
      x_n := x_R: before it the special-j system has a strictly smaller
      support class; after it, by residue coverage, it does not. On the
      measurement side the bottleneck is the per-target solve whose exponent
      sigma is the free parameter of IDEA-20260808-812554.
    baseline_embedding:
      parameter_slice: >-
        n = 3 (m = 2): (T3) must reproduce H-JINV-0e8819's 9/9/9 specialised
        support and the nine coefficients listed there; n = 4 unspecialised
        must reproduce the mod-3 confinement (fraction exactly 1.000) that
        H-JINV-0e8819 pre-registers; the ladder at a generic floor curve must
        reproduce EV-R6-001's slope of about 7 in F over F in {12, 14, 16, 18}
        within the engine constant.
      reproduction_check: >-
        Frozen fixture: exact equality of the expanded S_3 and S_4 with
        harness/semaev.py's s3_expr and s4_expr at a fixed (a, b, p); the
        weight of every monomial computed and asserted; the exhaustive arm's
        count equal to the closed form within 1 percent.
    observation_collision:
      observable: >-
        The specialised support set, and the fitted sigma per arm.
      distinct_preimage_search: >-
        PERFORMED AND PREDICTED TO SUCCEED, TWICE. (i) Crater, floor, sham
        and unmatched curve share the specialised support at every n >= 4 by
        (T3): the support observable cannot separate them, which is the
        theorem. (ii) The sham and the crater share the unspecialised support
        pattern with different coefficient values, so if sigma separates the
        crater from the floor but not the sham from the floor, the separating
        invariant is a coefficient-value invariant of the crater alone; if
        the sham moves with the crater, the invariant is the dense
        representation size, an engine property.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The (1, 2, 3) weight grading as the resource measure; the
          specialisation as the operation that moves the confinement from the
          support to the coefficients' x_R-degree; charges over the disjoint
          residue classes.
        predicted_gain: >-
          A theorem replacing an open question, at every arity, with a
          one-line obstruction O-RESIDUE-COVERAGE.
      - transform: observable_fiber
        proposed_object: >-
          Hold the specialised support fixed (forced by (T3)); vary j, |Aut|
          and coefficient values (crater, floor, sham); measure sigma.
        predicted_gain: >-
          Converts the |Aut| arm of the never-measured matched-order design
          into one slope per arm on the metric that can move an exponent.
    quantifier_order: >-
      (T1)-(T3): FOR ALL n >= 4, FOR ALL curves with a = 0, FOR ALL x_R, the
      residue class of e_1 + ... + e_{n-1} in the specialised support is
      unconstrained by the confinement (support EQUALITY with generic is the
      stronger uniform statement checked by F1 as polynomials in (b, x_R),
      not at sampled points). (T5) E1: FOR ALL B on the ladder and FOR ALL
      targets in the stream, the crater's per-target cost distribution
      matches the floor's; NOT the weaker 'there exists a B or target at
      which the crater is cheaper', which is forbidden by reporting the full
      ladder and stream.
    method_ceiling:
      strongest_certifiable_claim: >-
        (T3): 'no cost functional that factors through the specialised
        support distinguishes special j from generic at any arity' -- a
        theorem. (T5): 'on the tested class, engine, m = 3, B in [8, 18] and
        target stream, the crater's solver exponent equals the floor's and
        the sham's within [interval]'. It cannot certify anything about
        coefficient-value effects outside the interval, about m >= 4 (the
        sibling record), or about the ECDLP.
      nearby_object_control: >-
        The object on which a support confinement DOES survive specialisation:
        the same system with x_R replaced by a variable of weight 1 that is
        itself constrained to a mu_3-orbit-stable set (i.e. never
        specialised), or equivalently the unspecialised S_n restricted to
        a = 0 -- there the fraction of monomials in one residue class is
        exactly 1.000 (H-JINV-0e8819's prediction). The symbolic instrument
        must report 1.000 there and 1/3 (generic fraction) after
        specialisation, or it is not seeing the residue structure.
    proof_obligations:
      - claim: The resultant weight formula and W_n = (n-1) 2^{n-2}.
        responsibility: correctness
      - claim: >-
          Residue coverage kills the confinement under x_n := x_R for
          n >= 4 (a = 0) and n >= 3 (b = 0).
        responsibility: correctness
      - claim: >-
          Specialised support at a = 0, b = 0 and a^3 + 8 b^2 = 0 equals
          generic for S_4 and S_5.
        responsibility: correctness
      - claim: The sham cells pass the dimension and degree gate.
        responsibility: interface
      - claim: The exhaustive arm fits slope 2 at m = 3.
        responsibility: baseline
      - claim: >-
          sigma is reported per arm with an interval from >= 4 completed B.
        responsibility: scope

  object_first_candidate:
    tracked_object: >-
      The specialised summation system's (support, coefficient x_R-grading)
      pair on the j-line, and its solver exponent.
    lossiness: >-
      Genuinely lossy: the support forgets coefficient values, the curve, the
      target and, by (T3), j itself for n >= 4. The coefficient grading
      retains exactly the residue of W_n minus the x-degree and nothing
      else. Both are compatible with specialisation and with the diagonal
      mu_3 action, which act on them deterministically (that is the content
      of (T3)).
    propagation: >-
