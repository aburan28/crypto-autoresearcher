idea:
  id: IDEA-20260902-7952e7
  question_id: RQ-ECDLP-002
  added: '2026-09-02'
  title: >-
    THE OPEN QUESTION OF H-JINV-0e8819 ANSWERED AT ZERO COMPUTE, AND THE |Aut|
    ARM MEASURED ON THE ONLY METRIC THAT CAN MOVE AN EXPONENT: every summation
    polynomial S_n is weighted-homogeneous of weight W_n = (n-1) 2^{n-2} under
    deg(x, a, b) = (1, 2, 3), so at j = 0 its monomials are confined to one
    total-x-degree class mod 3 -- and that confinement is destroyed by
    x_n := x_R for every n >= 4 because e_n ranges over all three residues;
    what survives is a grading of the coefficients in x_R and the equivariance
    that IS relation transport; so the special-j support channel is closed at
    every arity by a theorem, the only open channel is coefficient values, and
    the cheapest test of it is the solver exponent sigma on a B-ladder at
    m = 3 inside the N = 19507 crater-versus-floor class with the sham curve
    as the same-shape null
  class: mechanism

  claim: >-
    Setting: y^2 = x^3 + a x + b over F_p, p > 3; S_n the n-th summation
    polynomial of KN-TECH-002 (deg_{x_i} S_n = 2^{n-2}); arity m = n - 1
    summands; the specialised decomposition system is
    (S_n(x_1..x_{n-1}, x_R), f_V(x_i)); solver exponent sigma defined by
    T_solve = B^{(m-1) sigma} per target as in IDEA-20260808-812554.

    (T1) THE WEIGHT LAW. Assign deg x_i = 1, deg a = 2, deg b = 3. S_3 is
    weighted-homogeneous of weight 4: its thirteen monomials
    (x1-x2)^2 x3^2, -2(x1+x2)(x1 x2 + a) x3, -4 b x3, (x1 x2 - a)^2,
    -4 b (x1+x2) each have weight 4 (e.g. a x1 x3 has weight 2 + 1 + 1).
    For polynomials f, g of t-degrees d_f, d_g and weights w_f, w_g with
    deg t = 1, the coefficient of t^i in f has weight w_f - i, and every term
    of the Sylvester determinant of Res_t(f, g) is a product of d_g
    coefficients of f and d_f coefficients of g whose t-indices sum to
    d_f d_g; hence Res_t(f, g) is weighted-homogeneous of weight
    d_g w_f + d_f w_g - d_f d_g. With KN-TECH-002's recurrence
    S_n = Res_t(S_{n-k+1}, S_{k+1}) and d = 2^{n-2}: W_4 = 2*4 + 2*4 - 4 = 12
    (agreeing with H-JINV-0e8819's independent derivation),
    W_5 = 4*4 + 2*12 - 8 = 32, W_6 = 4*12 + 4*12 - 16 = 80, and the
    alternative split Res(S_3, S_5) gives 8*4 + 2*32 - 16 = 80, consistent;
    by induction W_n = (n-1) 2^{n-2}.

    (T2) THE CONFINEMENT, AT EVERY n. At a = 0 (j = 0), b has weight 3, so
    every monomial of S_n has total x-degree congruent to W_n mod 3 (0 for
    n = 4, 2 for n = 5 and 6, 0 for n = 7), equivalently
    S_n(zeta x_1, ..., zeta x_n) = zeta^{W_n} S_n for a primitive cube root
    zeta. At b = 0 (j = 1728), a has weight 2, so every monomial has even
    total x-degree for n >= 3, equivalently S_n(-x) = S_n(x). These are the
    all-n forms of the m = 2 and m = 3 statements of H-JINV-0e8819 and
    IDEA-20260807-5ddccf.

    (T3) THE ANSWER TO THE OPEN QUESTION: THE CONFINEMENT DOES NOT SURVIVE
    SPECIALISATION AS A SUPPORT STATEMENT, FOR ANY n >= 4. Specialising
    x_n := x_R sends every monomial x_1^{e_1} ... x_n^{e_n} to
    x_R^{e_n} x_1^{e_1} ... x_{n-1}^{e_{n-1}}, so the coefficient of a given
    (e_1..e_{n-1}) in the specialised polynomial collects all e_n in
    0..2^{n-2}. The confinement fixes e_1 + ... + e_n mod 3, so it constrains
    e_1 + ... + e_{n-1} mod 3 only through e_n; once e_n can take all three
    residues -- 2^{n-2} >= 2, i.e. n >= 4 -- every residue class of
    e_1 + ... + e_{n-1} is reachable. For b = 0 parity is free once
    2^{n-2} >= 1, i.e. n >= 3, which is why H-JINV-0e8819's m = 2 check
    found all nine coefficients nonzero. WHAT SURVIVES: (i) a GRADING OF
    COEFFICIENTS -- the coefficient of x_1^{e_1}..x_{n-1}^{e_{n-1}} is a
    polynomial in x_R (and b) whose x_R-exponents all lie in the residue
    class W_n - (e_1 + ... + e_{n-1}) mod 3; (ii) the EQUIVARIANCE
    S_n|_{a=0}(zeta x_1, ..., zeta x_{n-1}, zeta x_R) = zeta^{W_n} S_n|_{a=0},
    which states that decompositions of R over V are in bijection with
    decompositions of phi(R) over zeta V -- the relation transport of
    IDEA-20260807-f8a045 (title-level), worth the constant |Aut|/2 on the
    relation count and nothing at the exponent. Support EQUALITY with the
    generic curve is the stronger statement that, for every (e_1..e_{n-1})
    in the generic specialised support, at least one contributing
    unspecialised coefficient is nonzero at a = 0 (resp. b = 0); it is a
    finite symbolic check at S_4 and S_5 and is falsifier F1. The identical
    residue argument applies to the a^3 + 8 b^2 = 0 locus of
    EV-ICINV-6b6264: a specialised hole needs an entire e_4-fibre of the
    48-coefficient block to vanish.

    (T4) THE CONSEQUENCE FOR THE LANE. Every solver whose cost is a function
    of the specialised support, Newton polytope or BKK bound (the sparse
    family of IDEA-20260811-97e244) cannot distinguish j = 0 or j = 1728
    from a generic curve at ANY arity m >= 3, by (T3), extending the m = 2
    statement of H-JINV-0e8819 without computing a polytope. The support
    axis of RQ-JINV-8fc13a is therefore closed by a theorem rather than by a
    measurement, with the named obstruction O-RESIDUE-COVERAGE: 'the
    specialised variable ranges over every residue class of the grading that
    confines the special-j support'. FORWARD GUIDANCE: what remains is the
    coefficient-value axis (reducibility, singular locus, factorisation type
    of the SPECIALISED system, IDEA-20260811-6034d0 and IDEA-20260811-34f29d)
    and the automorphism constant, and the direct test of the coefficient-
    value axis at the exponent level is the measurement below.

    (T5) THE MEASUREMENT AND ITS TWO OUTCOMES. In the class N = 19507,
    t = 211, p = 19717, D = -3 * 107^2 (one j = 0 crater with |Aut| = 6,
    36 floor curves with |Aut| = 2, identical p, N, t, D_0; EV-JINV-a8c812,
    IDEA-20260811-99cc67), measure sigma at m = 3 on a B-ladder with the
    existing Groebner instrument (feasible: EV-R6-001 completed m = 3 up to
    F = 18) on the crater, on floor curves, and on the sham of
    IDEA-20260811-18bbf9 built from a floor curve. E1 (predicted): sigma is
    the same on crater, floor and sham within the interval, so the special-j
    curve has no exponent-level coefficient effect at m = 3 and the |Aut| arm
    of the matched-order design closes on the solver axis with the sqrt(3)
    rho constant as its whole content. E2: the crater's sigma is below the
    floor's by more than the margin AND the sham does not share it -- a
    coefficient-value effect that (T3) says is not support, to be replicated
    at a second matched family before it is described. E2-SHAM: the crater
    and the sham both differ from the floor -- a dense-representation
    artifact of the engine (fewer nonzero coefficients before specialisation
    feeding a smaller intermediate), a controlled null, not curve structure.

  mechanism: >-
    OBJECT-FIRST. Tracked object: the specialised summation system's monomial
    support together with the residue class of its coefficients' x_R-degrees,
    as a function on the j-line; and, on the measurement side, the solver
    exponent. Families declared off-limits as the primary lens: the
    unspecialised support count (477e40, 0e8819), the Newton polytope
    (97e244), the invariant-coordinate encodings (1ea327, 5ddccf), the
    Aut-quotient coordinate (d329e2), the |D_0| regression (473c2e), the
    rho ratio (99cc67).

    STAGE 0 (zero compute, HARD GATE). Write (T1)-(T3). Check W_4 = 12
    against H-JINV-0e8819. Symbolically (sympy over Q[a, b, x_R], minutes):
    expand S_4 and S_5 via KN-TECH-002's recurrence; verify weights; verify
    the mod-3 confinement at a = 0 and the parity confinement at b = 0 on the
    unspecialised polynomials; specialise x_n := x_R and compute the support
    sets at a = 0, b = 0, a^3 + 8 b^2 = 0 and generic; verify the coefficient
    grading (i). Frozen fixture: term-by-term equality of S_3 and S_4 with
    harness/semaev.py's s3_expr and s4_expr on a fixed (a, b, p), exactly as
    H-JINV-0e8819 requires.

    STAGE 1 (instrument, hours). Re-derive the class (primality of 19507 and
    19717, D, the Hurwitz-Kronecker vertex count 1 + 36); enumerate its
    curves by j-invariant with the certified census of EV-ENDO-e8d3e5; draw
    8 floor curves by seed; build 8 sham systems (one per floor curve, a-block
    deleted from the unspecialised S_4 of that curve, coefficients elsewhere
    untouched) and check per cell that the sham ideal has the same dimension
    and degree as its parent (18bbf9's admissibility gate); draw 4 unmatched
    curves at p = 19717 with N != 19507. NO isogeny transport is needed: the
    functional is per curve.

    STAGE 2 (the ladder, CPU-hours). For each curve and sham, B in
    {8, 10, 12, 14, 16, 18}, 20 targets per cell drawn with targets_B and
    r-stratified, solve (S_4(x1, x2, x3, x_R), f_V(x_i)) with the committed
    Singular degrevlex pipeline of EV-R6-001 (or msolve pinned; one engine
    for all arms), recording operation-count proxies and wall clock; on the
    identical targets run the exhaustive (2B)^2/2 signed-pair enumeration
    with hash closing, charged in group operations. Fit per arm the log-log
    slope of solver cost against B; the exhaustive arm must fit slope 2.
    Report sigma = slope/2 per arm with a 90 percent interval, the crater
    minus floor difference, the sham minus floor difference, and the cost
    ratio solver over exhaustive at every B.

    STAGE 3 (decay and artifact tells). Any crater-floor difference must
    grow with B (it is an exponent claim; a flat offset is a constant and is
    reported as such), must be absent on the sham, and must reproduce on a
    second matched family (the j = 1728 family constructed as in
    IDEA-20260902-2327a5's H3) before any description.

