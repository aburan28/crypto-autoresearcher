idea:
  id: IDEA-20260829-359945
  question_id: RQ-QALG-122b59
  added: '2026-08-29'
  proposed_by: idea-generator
  status: proposed
  title: >-
    WHY QUANTUM TREE SEARCH TRANSFORMED LATTICE ENUMERATION AND HAS NEVER
    APPEARED IN CODE-BASED CRYPTANALYSIS -- Montanaro/Ambainis-Kokainis
    backtracking costs sqrt(TREE SIZE) at POLYNOMIAL quantum memory, so a
    prefix-informative predicate for quasi-cyclic syndrome decoding would give a
    QRAM-FREE algorithm at 2^{tau/2} against Grover-Prange's 2^{w}; measure the
    PREFIX INFORMATION PROFILE I(t) and either find one or name the obstruction
    that forbids it
  class: algorithm

  claim: >-
    Every quantum ISD algorithm known to this corpus sits at one of two points:
    Grover-Prange, which costs 2^{w(1+o(1))} iterations with POLYNOMIAL quantum
    memory and no QRAM, or quantum-walk MMT/BJMM, which may cost less but needs
    QRACM proportional to an exponentially large list. A third point exists in
    principle and has never been evaluated for this target: Montanaro's quantum
    backtracking, with Ambainis-Kokainis tree-size estimation, solves a tree
    search in O(sqrt(T * D)) steps where T is the number of nodes the PRUNED
    tree actually contains and D its depth, using only polynomial quantum
    memory. Writing 2^{tau} for the tree size, such an algorithm costs
    2^{tau/2 + o(w)} at polynomial memory, against Grover-Prange's 2^{w} =
    2^{(2w)/2}: it wins by exactly (2w - tau)/2 bits and it ties when
    tau = 2w. THE CLAIM IS THAT tau IS A MEASURABLE PROPERTY OF A PREDICATE, NOT
    A PROPERTY OF THE PROBLEM, and that the right object to measure is the
    PREFIX INFORMATION PROFILE I(t) -- the mutual information between a
    depth-t partial assignment and the event that it extends to the solution.
    The prediction, stated so that it can fail: for the standard coordinate
    ordering and a dense parity check, I(t) = 0 for every t below 2w - O(1),
    hence tau = 2w and quantum backtracking gives EXACTLY Grover-Prange and not
    one bit more. The reason is a stateable structural tension rather than a
    failure to try, and it is what distinguishes syndrome decoding from lattice
    enumeration, where the same quantum machinery does deliver sqrt(T): lattice
    enumeration's prefix predicate is the partial norm in a TRIANGULAR
    Gram-Schmidt basis, and triangularization there preserves the objective
    function; for syndrome decoding, the row operations that would triangularize
    the parity-check columns simultaneously DELOCALIZE the low-weight constraint
    on the redundancy part, so no basis makes both the constraint and the
    objective prefix-local. The experiment measures I(t) across a declared
    family of orderings and partial-elimination schedules and decides between
    'the tension is absolute for this family' (a closure with a measured
    quantity and named forward guidance) and 'schedule X has I(t) > 0, giving
    tau = 2w - g and a QRAM-free saving of g/2 bits' (an exponent-moving
    positive result that would place a poly-memory algorithm strictly inside the
    quantum-walk row's time-memory Pareto gap).
  mechanism: >-
    THE TREE. Fix the HQC key-recovery instance s = x + h y with
    wt(x) = wt(y) = w, i.e. syndrome decoding of a [2n, n] quasi-cyclic code
    with error weight 2w. A backtracking formulation orders the 2n coordinates,
    and a node at depth t is a partial assignment of the error to the first t
    coordinates that has not yet been pruned. Leaves at depth 2n are complete
    error vectors; the marked leaf is the solution. A PREDICATE P_t maps a
    depth-t prefix to prune or keep. Without any predicate the tree has
    C(2n, 2w) = about 2^{1064} leaves at HQC-128 and quantum backtracking is
    catastrophically worse than Grover-Prange, so the whole question is which
    predicates are simultaneously (a) computable in poly time from the prefix,
    (b) SOUND (never prunes the solution), and (c) INFORMATIVE (prunes a
    constant fraction per level).
    THE QUANTUM INGREDIENT AND WHY IT IS THE RIGHT ONE FOR THIS RQ. Montanaro's
    algorithm walks the tree with phase estimation on a bipartite reflection
    operator and detects a marked leaf in O(sqrt(T D)) applications of the
    predicate, where T counts the nodes of the PRUNED tree; Ambainis-Kokainis
    additionally estimate T online. Both use POLYNOMIAL quantum memory and NO
    QRAM, because the walk's state is a single node, not a list. That is exactly
    the axis on which quantum-walk MMT/BJMM is vulnerable: its advantage over
    Grover-Prange is bought with exponential QRACM, and this RQ's constraints
    require cost accounting that names the memory model. A poly-memory algorithm
    that reached even the SAME time exponent as the walk row would be a Pareto
    improvement without touching the time exponent at all.
    THE EXTERNAL PRECEDENT, AND THE CONTRAST THAT IS THE RECORD'S CONTENT.
    Aono-Nguyen-Shen applied precisely these two tree algorithms to lattice
    enumeration and obtained roughly sqrt(T) where T is the enumeration-tree
    size, affecting NIST-submission security estimates; a follow-up gave a
    concrete quantum-circuit cost for the same construction. Enumeration works
    because the tree is defined by partial norms against a Gram-Schmidt
    triangularization: a depth-t prefix already determines a partial sum of
    squared coefficients, and the pruning bound compares it to a radius. The
    prefix carries real information about the leaf. Syndrome decoding's natural
    predicate has no such property: with parity check H and prefix assigning
    error positions in a set of size t, the residual syndrome s minus the sum of
    t dense columns is, for a random or quasi-cyclic dense H, distributed
    identically for correct and incorrect prefixes until enough coordinates are
    fixed that the remaining columns cannot cover the residual. Formally the
    predicate becomes informative only at t >= 2w - ell where ell is the number
    of coordinates for which a window match is decidable, and that is exactly
    Stern's and Dumer's ell-window -- which is why the classical algorithms are
    MEET-IN-THE-MIDDLE and not depth-first: prefix pruning is impossible, so the
    literature split the problem instead.
    WHAT COULD BREAK THE TENSION, WHICH IS THE POSITIVE BRANCH. One can choose
    the row basis of H freely (row operations do not change the code) and the
    coordinate order freely. A GRADED SCHEDULE performs partial elimination so
    that the first t information columns are supported on the first m(t) rows,
    making the prefix's contribution to those rows complete and hence testable.
    The cost is that the same row operations mix the redundancy block, so the
    weight constraint that made the residual test meaningful is no longer a
    coordinate-local statement. The record's central quantity is whether any
    schedule m(t) buys net information, i.e. whether
    g = 2w - tau = max over schedules of the accumulated prefix information is
    positive and how large it is. This is measurable at toy scale by direct tree
    instrumentation, without any quantum simulation.
  novelty_status: unverified

  novelty_screen:
    corpus_screen: >-
      Greps of knowledge/, ledger/proposals and ledger/hypotheses for
      'backtracking', 'Montanaro', 'Ambainis', 'tree size', 'claw find',
      'van Oorschot', plus full reads of the five records the prior-art file
      lists for this RQ and of KN-LIT-6093, KN-LIT-3072, KN-LIT-f7d7dd,
      KN-LIT-aa3372, KN-LIT-b9e1a8. FOUND: KN-LIT-6093 (Aono-Nguyen-Shen,
      quantum lattice enumeration via Montanaro and Ambainis-Kokainis) and
      KN-LIT-3072 (concrete quantum-circuit analysis of quantum lattice
      enumeration) -- both on the LATTICE side, both cited below as the external
      precedent. NOT FOUND: any record applying quantum tree search, quantum
      backtracking, tree-size estimation or a prefix-pruning predicate to
      syndrome decoding, to ISD, or to any code-based target; and no record
      anywhere in the corpus that measures a prefix information profile.
    discriminated_from:
      - >-
        IDEA-20260813-319645 re-derives the MNRS quantum walk for ISD as an
        electric network. That walk is on a JOHNSON GRAPH OF LISTS and its whole
        cost model presumes exponentially many stored vertices, i.e. QRACM. This
        record's walk is on a SEARCH TREE whose state is one node, with
        polynomial memory. Sharpest separation: cap quantum memory at
        poly(n) and 319645's object does not exist, while this record's is
        unchanged.
      - >-
        IDEA-20260813-c34e09 quotients the walk graph by the code's automorphism
        group -- again a list-graph object. Quotienting a tree by an
        automorphism group is not what this record does; it changes the
        PREDICATE, not the symmetry.
      - >-
        IDEA-20260813-fe3c5e asks which of Grover-Prange and quantum-walk
        BJMM/MMT holds the better exponent at HQC's sublinear weight. That
        question fixes this record's COMPARISON ROW and should be settled in
        parallel; it does not overlap the mechanism, because neither of the two
        algorithms it compares is a tree search.
      - >-
        IDEA-20260818-45b8ea changes the initial amplitude over information
        sets; IDEA-20260829-267a06 changes the coherent oracle's linear algebra.
        Both leave the SEARCH STRUCTURE alone. This record replaces the search
        structure entirely and would have to be re-costed if either is adopted.
      - >-
        IDEA-20260818-d5668d bounds the DUAL family by a secret-window argument.
        This record is on the permutation/primal side and its obstruction, if it
        materializes, is about prefix information rather than about window size.
        The two closures would be independent and neither implies the other.
    web_screen: >-
      One WebSearch run 2026-08-29 ('quantum backtracking algorithm information
      set decoding syndrome decoding tree size speedup'). Returned Kachigar-
      Tillich's quantum ISD algorithms, a 'Memory-Efficient Quantum Information
      Set Decoding Algorithm' (Springer 2023) described in the result summary as
      keeping a smaller exponentially large list in the quantum state and being
      fastest when quantum memory is limited, and a Lee-metric generic
      syndrome-decoding analysis (arXiv 2104.12810). NOT FOUND in that one
      search: any application of quantum backtracking or quantum tree-size
      estimation to syndrome decoding. THE MEMORY-EFFICIENT QUANTUM ISD PAPER IS
      THE MOST LIKELY DOMINATING ROW ON THIS RECORD'S OWN MEMORY AXIS and it was
      NOT opened; it is named in dominated_by and in the minimal test's gating
      pre-step for exactly that reason. One search is not a literature review.
    verdict: >-
      unverified. The ingredients are individually standard (quantum
      backtracking; the impossibility of prefix pruning for dense linear
      constraints is close to folklore among ISD implementers, which is why
      Stern is a meet-in-the-middle). What was not found is the measurement --
      an actual prefix information profile for syndrome decoding, and the
      side-by-side contrast with the lattice-enumeration tree where the same
      quantum machinery works. No novelty is claimed from memory.

