  assumptions:
    - >-
      The target is the [2n, n] quasi-cyclic key-recovery instance at HQC's
      parameters with uniform error support of weight 2w; the ciphertext-side
      instance is a different object and is out of scope here (see
      IDEA-20260829-228ce4).
    - >-
      Full fault-tolerant error correction; the unit of account is the logical
      predicate evaluation for the tree algorithm and the logical iteration for
      Grover-Prange, converted to a common gate unit before any comparison.
    - >-
      Predicates must be SOUND (never prune the solution). An unsound predicate
      trivially shrinks the tree and produces a meaningless tau; soundness is a
      proof obligation, not a test parameter.
    - >-
      Any measured tau is a property of a stated (ordering, elimination
      schedule, predicate) triple. There is no such thing as 'the' tree size of
      syndrome decoding, and the record never claims one.

  object_first_framing:
    established_families_declared_off_limits_as_primary_lens:
      - >-
        Grover-Prange and quantum-walk MMT/BJMM as algorithms, and every
        list-graph object (Johnson graphs, MNRS walks, electric-network
        re-derivations, orbit quotients) -- this record is about a search tree,
        not a list graph.
      - >-
        The ten objects already generated against this RQ, enumerated in
        IDEA-20260829-267a06's own framing.
      - >-
        QRAM-assuming constructions. The record's entire Pareto claim lives at
        polynomial quantum memory, and adopting QRAM anywhere voids it.
    tracked_object: >-
      THE PREFIX INFORMATION PROFILE OF A PRUNING PREDICATE -- the vector
      (I(1), ..., I(2w)) where I(t) is the mutual information between a depth-t
      partial assignment and the indicator that it extends to the solution,
      together with its integral tau = log2 of the resulting pruned tree size.
      An instance is followed not as an error vector and not as a syndrome, but
      as the survival-count profile its predicate induces.
    lossy_projection_test: >-
      PASSES. LOSSY: the projection sends a full search state -- the set of
      surviving prefixes, of size up to 2^{1064} at HQC-128 -- to a vector of
      2w = 132 real numbers and a single exponent tau. The fibres are
      astronomical: any two predicates that prune the same NUMBER of nodes per
      level map to the same profile while keeping completely different nodes.
      COMPATIBLE, the half with teeth: the one operation the algorithm performs
      is 'extend every surviving prefix by one coordinate and apply the
      predicate', and under that operation the profile propagates by
      N_{t+1} = N_t * b_t * q_t with branching b_t and survival probability
      q_t = 2^{-I(t)} determined by the code's local weight enumerator -- a
      deterministic recursion on the retained part alone, with the discarded
      identities of the prefixes not re-entering. FAILING VARIANT, recorded to
      show the test bites: tracking 'the set of surviving prefixes' discards
      NOTHING (it is the computation itself) and is therefore a change of
      representation, not an object; tracking 'the residual syndrome of the best
      prefix' also fails, since for an incorrect prefix the residual is uniform
      and carries no propagating information.
    survival: >-
      The object survives the full depth of the tree whenever the predicate is
      sound, which is unusually far, and it DISSOLVES exactly where the record
      predicts the mechanism dies: at every depth t where I(t) = 0, the profile
      degenerates to pure branching and carries no information about the
      instance at all -- the projection becomes a function of (n, w) alone. That
      degeneracy IS the predicted outcome, and recording where the object
      dissolves is the deliverable if the positive branch fails.

  proof_search_map:
    bottleneck: >-
      The prefix survival probability q_t, equivalently I(t). Every quantity in
      the record is an integral of it: tau = sum over t of log2(b_t q_t), and
      the cost is 2^{tau/2}.
    baseline_embedding:
      parameter_slice: >-
        The trivial predicate P_t = keep for all t < 2w. Then q_t = 1, the tree
        has exactly C(2n, 2w) leaves and no internal pruning, and the cost
        formula 2^{tau/2} must reduce to the exhaustive-search bound
        2^{(1/2) log2 C(2n,2w)}; with the standard information-set formulation
        of the same search the reduction must instead land exactly on
        Grover-Prange's 2^{w}. Both boundaries must be reproduced, and the
        second is the one that matters.
      reproduction_check: >-
        Symbolic: substitute q_t = 1 into the profile recursion and check
        term-by-term equality with the Grover-Prange iteration count under the
        matched formulation. Frozen numeric fixture at (n, w) = (31, 3) and
        (101, 5), where both C(2n, 2w) and the exact Prange probability are
        computable by enumeration; assert the tree walk's measured node count
        equals the predicted one exactly, not approximately. AN IMPLEMENTATION
        THAT CANNOT REPRODUCE THE UNPRUNED COUNT IS DISCARDED BEFORE ANY
        PREDICATE IS TESTED.
    observation_collision:
      observable: 'the profile (I(t)) and its integral tau'
      distinct_preimage_search: >-
        A COLLISION EXISTS AND IT IS THE RECORD'S MAIN INTERPRETIVE RISK: two
        predicates can produce identical profiles while one is SOUND and the
        other silently prunes the solution on some instances. An unsound
        predicate looks like a discovery -- tau drops sharply -- and is the most
        likely way a positive result here would be fabricated by accident.
        SEPARATING CONDITION, mandatory in the protocol: every measured tau is
        accompanied by a solution-retention check on 10^4 seeded instances with
        the planted solution known, and any predicate that prunes a planted
        solution even once is discarded and its tau never reported. A second,
        benign collision: profiles are invariant under relabelling coordinates,
        which is correct and is used as a consistency control.
    constructive_transforms:
      - transform: stronger_compositional_invariant
        proposed_object: >-
          Carry, per prefix, more state than the final test needs: the residual
          syndrome restricted to a growing window m(t) together with a lower
          bound on the weight any completion must add. The stronger state is
          what could survive the recursion and make a prefix predicate sound and
          informative at once.
        predicted_gain: >-
          tau = 2w - g with g = sum over t of I(t); a QRAM-free saving of g/2
          bits. PREDICTED g = 0 for the standard schedule.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable tau fixed and vary the forgotten structure: the
          lattice enumeration tree and the syndrome-decoding tree can be built
          to the same node count while differing in whether their objective is
          prefix-decomposable. The intrinsic invariant distinguishing them is
          whether the constraint matrix admits a triangularization that
          preserves the objective's locality.
        predicted_gain: >-
          Converts 'quantum backtracking has not been applied to codes' from an
          absence into a statement with a mechanism, and hands the exact
          property a future construction must engineer.
    quantifier_order: >-
      FOR ALL sound predicates P in the declared family (orderings x elimination
      schedules x window sizes), THERE EXISTS a profile (I(t)) and a tree size
      2^{tau(P)}, and the quantum backtracking cost is 2^{tau(P)/2 + o(w)} at
      polynomial memory. THE CLAIMED CONCLUSION IS AN EXISTENTIAL OVER THE
      FAMILY -- does there EXIST P with tau(P) < 2w -- and the predicted answer
      is no FOR THE DECLARED FAMILY ONLY. Note carefully what is not quantified
      over: predicates outside the declared family, in particular ones using
      quasi-cyclic ring structure to test a prefix, are OUTSIDE the 'for all'
      and the closure says nothing about them. Stating that boundary is the
      difference between a scoped closure and an impossibility claim, which the
      Idea Generator contract forbids.
    method_ceiling:
      strongest_certifiable_claim: >-
        'Over the declared family of orderings and elimination schedules, at the
        tested toy parameters, the measured prefix information is below epsilon
        per level for all t < 2w - ell, so the pruned tree size satisfies
        tau >= 2w - delta and quantum backtracking cannot beat Grover-Prange by
        more than delta/2 bits at polynomial memory.' The method can NEVER
        certify anything about predicates it did not enumerate, about
        cryptographic n (only extrapolate from toy scale with a stated law), or
        about the hardness of QC-SD.
      nearby_object_control: >-
        THE NEAREST OBJECT WHERE THE HOPED-FOR CONCLUSION MUST FAIL IS THE
        LATTICE ENUMERATION TREE, and it is a POSITIVE control rather than a
        negative one: run the identical instrumentation on a BKZ-style
        enumeration tree of a random lattice at rank 30-50, where the literature
        (KN-LIT-6093, KN-LIT-3072) reports a genuine sqrt(T) speedup. The
        pipeline MUST measure I(t) > 0 and tau well below the leaf count there.
        If it does not, the instrumentation cannot detect prefix information at
        all and the syndrome-decoding null is an artifact of the measurement.
        THIS IS THE SINGLE MOST IMPORTANT CONTROL IN THE RECORD. Second control:
        an artificially triangularized linear system (a random upper-triangular
        constraint matrix with a low-weight solution), where I(t) must be large
        by construction.
    proof_obligations:
      - claim: 'each tested predicate is sound (never prunes the planted solution)'
        responsibility: correctness
      - claim: 'quantum backtracking costs O(sqrt(T D)) predicate evaluations at poly memory'
        responsibility: runtime
      - claim: 'the profile recursion N_{t+1} = N_t b_t q_t predicts measured node counts'
        responsibility: size
      - claim: 'the unpruned tree reproduces the Grover-Prange / exhaustive baselines exactly'
        responsibility: baseline
      - claim: 'I(t) = 0 for t < 2w - ell under the standard schedule, for dense H'
        responsibility: success_probability
      - claim: 'the lattice-enumeration control returns I(t) > 0'
        responsibility: interface
      - claim: 'the closure is scoped to the declared predicate family'
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        prefix information I(t) for the standard coordinate ordering and dense
        parity check, measured at toy (n, w), in bits per level
      direction: lower
      minimum_effect: >-
        PREDICTED indistinguishable from 0 (below the sampling floor
        1/sqrt(number of trials)) for all t < 2w - ell. Any level with
        I(t) >= 0.05 bits sustained across three toy sizes is a positive signal
        and escalates.
    - metric: 'tau / 2w, the tree-size exponent relative to the Grover-Prange exponent'
      direction: different
      minimum_effect: >-
        PREDICTED 1.00 within measurement error for the standard schedule, i.e.
        no gain. A ratio below 0.95 sustained at three toy sizes is an
        exponent-moving positive result at polynomial memory and must be
        escalated to independent review before any further work. A ratio ABOVE 1
        is impossible for a sound predicate and indicates an instrumentation
        bug.
    - metric: 'best tau/2w over the declared family of elimination schedules m(t)'
      direction: lower
      minimum_effect: >-
        PREDICTED still 1.00: the record's structural claim is that graded
        elimination buys prefix locality for the constraint at the exact rate it
        loses it for the weight objective, so the product is conserved. A
        measured schedule with ratio 0.90 would be worth 6.6 bits at HQC-128 and
        would be the record's headline positive outcome.
    - metric: >-
        lattice-enumeration positive control -- measured tau / log2(leaf count)
        on a rank-40 random lattice enumeration tree
      direction: lower
      minimum_effect: >-
        PREDICTED WELL BELOW 1 (the literature reports a genuine sqrt(T)
        speedup, which presupposes T far below the leaf count). If this control
        does not show it, the instrumentation is broken and no syndrome-decoding
        number may be reported.
    - metric: >-
        solution-retention rate of each tested predicate over 10^4 planted
        instances
      direction: different
      minimum_effect: >-
        MUST BE EXACTLY 1. Any predicate below 1 is unsound and is discarded;
        this is a gate, not a measurement.
    - metric: >-
        quantum cost 2^{tau/2} versus Grover-Prange 2^{w} at HQC-128, both at
        polynomial memory, in bits
      direction: different
      minimum_effect: >-
        PREDICTED equal at 2^{66} to within o(w). The deliverable in that case
        is the measured upper bound on the achievable saving, not a failure.
    - metric: >-
        depth of the Montanaro walk, N_predicate * depth_predicate, versus
        Grover-Prange's serial depth at HQC-128
      direction: higher
      minimum_effect: >-
        PREDICTED COMPARABLE OR WORSE. Quantum backtracking is serial in the
        same way Grover is, and its per-step predicate is cheaper than a
        Gaussian elimination but its step count is larger; if the record ever
        reaches a positive tau result, this metric decides whether it survives a
        binding MAXDEPTH, and it must be reported alongside, never after.

  minimal_test:
    design: >-
      Five stages, entirely classical instrumentation of trees -- there is NO
      quantum simulation anywhere, because tau and I(t) are classical
      properties of a predicate and the quantum cost is a cited function of
      them.
      STAGE 0 (literature, GATING): locate and read the 'Memory-Efficient
      Quantum Information Set Decoding Algorithm' (LNCS 2023) and record what
      its limited-memory row actually costs. If it already occupies the
      poly-memory Pareto point this record claims, the record's contribution
      narrows to the profile measurement and the lattice contrast, and it should
      be re-ranked before Stage 2 rather than defended.
      STAGE 1 (hours): implement the tree with the trivial predicate at
      (n, w) = (31, 3), (101, 5), (127, 6) and verify the node count equals
      C(2n, 2w) exactly and that the Grover-Prange embedding reproduces the
      published probability exactly. Discard the implementation if not.
      STAGE 2 (days): enumerate the declared predicate family -- coordinate
      orderings in {natural, random, ring-shift-aligned}, elimination schedules
      m(t) in {none, linear, sqrt, staircase with step sizes 2,4,8}, window
      sizes ell in {0, ..., 2 log2 n} -- and for each, over 10^4 seeded planted
      instances per cell, measure the surviving-node count per level, the
      solution-retention rate, and I(t) estimated by the empirical
      log-likelihood ratio between planted and unplanted prefixes.
      STAGE 3 (hours): the CONTROLS, run with the identical estimator -- the
      lattice enumeration positive control, the triangular-system positive
      control, and the random-code null.
      STAGE 4 (hours): fit tau/2w against n across the toy range, report the
      extrapolation to HQC's parameters explicitly as an extrapolation with the
      fitted residual as its error bar, and emit the poly-memory Pareto table:
      (time exponent, memory, QRAM) for Grover-Prange, quantum-walk BJMM/MMT,
      the memory-efficient row from Stage 0, and this record's tree row.
    controls:
      - >-
        POSITIVE CONTROL 1 (decisive, from the nearby-object audit): lattice
        enumeration trees at rank 30-50. The estimator MUST report I(t) > 0 and
        tau far below the leaf count. A pipeline that reports zero prefix
        information where the literature reports a sqrt(T) speedup is measuring
        its own blindness.
      - >-
        POSITIVE CONTROL 2: a random upper-triangular linear system over F_2
        with a planted low-weight solution, where prefix information is present
        by construction and its magnitude is computable in closed form. The
        estimator must recover the closed-form value to within 10 percent.
      - >-
        NULL OBJECT 1: a random dense (non-quasi-cyclic) [2n, n] code at the
        same (n, w). The measured profile must be statistically
        indistinguishable from the quasi-cyclic one; a difference means the
        record has accidentally found quasi-cyclic prefix structure, which would
        be the more interesting outcome and must be reported as such rather than
        averaged away.
      - >-
        NULL OBJECT 2 (unsatisfiable): a syndrome drawn independently of any
        low-weight vector. The tree must exhaust with no marked leaf, and the
        measured profile must match the planted case at every level below
        2w - ell -- which is the direct operational statement of I(t) = 0.
      - >-
        SOUNDNESS GATE: solution-retention rate exactly 1 on 10^4 planted
        instances, checked BEFORE any tau from that predicate is recorded.
      - >-
        STRUCTURAL TELL (inventor-protocol section 3.1): any measured prefix
        information must GROW as the window ell grows and must VANISH as the
        parity check is made denser by random row mixing. An I(t) that stays
        constant while the code is re-randomized is an artifact of the harness
        (most likely a leaked seed or a planted solution correlated with the
        coordinate order), not a property of syndrome decoding.
    required_metrics:
      - node count per level, per (predicate, n, w) cell, with the exact unpruned reference
      - I(t) with bootstrap 99 percent intervals, per cell
      - tau and tau/2w per cell, and the family minimum
      - solution-retention rate per predicate (gate)
      - lattice-enumeration and triangular-system control values
      - fitted tau/2w versus n with residuals, and the labelled extrapolation to HQC parameters
      - poly-memory Pareto table (time exponent, quantum memory, QRAM) across four algorithm rows
      - predicate evaluation cost and walk depth, converted to the same gate unit as the Grover row

  null_object_control: >-
    Two nulls and two positives, and the record is unusual in that the POSITIVE
    controls are the load-bearing ones. NULL OBJECT 2 (unsatisfiable syndrome)
    operationalizes I(t) = 0: if planted and unplanted prefixes have
    indistinguishable survival profiles, the predicate provably carries no
    information, and that is the closure. POSITIVE CONTROL 1 (lattice
    enumeration) is what stops a null from being a statement about the
    instrumentation: the same estimator on a tree where the same quantum
    algorithm is published to work must light up. Running the syndrome-decoding
    measurement without it would produce exactly the kind of confident,
    unfalsifiable negative that docs/inventor-protocol.md section 4 calls a
    fatigue report.

  falsification_conditions:
    - >-
      POSITIVE CONTROL 1 fails -- the estimator reports no prefix information on
      a lattice enumeration tree. The measurement is void and no
      syndrome-decoding conclusion may be drawn.
    - >-
      Any reported predicate has solution-retention below 1. That predicate is
      unsound; its tau is deleted, not corrected.
    - >-
      The unpruned tree does not reproduce C(2n, 2w) exactly, or the
      Grover-Prange embedding does not reproduce the published probability.
      Falsifies the implementation.
    - >-
      Measured tau/2w below 0.95 for a SOUND predicate at three toy sizes with
      the fitted trend not returning to 1. This falsifies the record's own
      predicted null in the direction that matters: a QRAM-free quantum ISD
      algorithm beating Grover-Prange by (2w - tau)/2 bits. Escalate to
      independent review before any further work.
    - >-
      Measured I(t) > 0 that does NOT vanish under random row mixing of the
      parity check. Falsifies the structural tell and indicates a harness
      artifact rather than a finding.
    - >-
      Stage 0 finds that the published memory-efficient quantum ISD algorithm
      already occupies the poly-memory point at a better time exponent. This
      record is then dominated on its own axis and should be superseded rather
      than argued for.
    - >-
      The tree row's DEPTH, in the same unit as the Grover row, exceeds
      Grover-Prange's by more than the time saving. Any positive tau result is
      then a gate-count result only and must be restated with its MAXDEPTH
      position, per this RQ's cost-model constraint.

  confounders:
    - >-
      UNSOUND PREDICATES LOOK LIKE DISCOVERIES. The single largest risk. The
      soundness gate must run before, not after, the tau measurement, and on
      planted instances whose solutions the predicate cannot see.
    - >-
      TOY SCALE IS THE WRONG REGIME FOR THE VERY PROPERTY BEING MEASURED. At
      n = 101 with w = 5, 2w is comparable to log2 C(2n,2w) and the window
      threshold 2w - ell is not cleanly separated, so a small I(t) may be a
      finite-size effect. The fit must be across at least three sizes and the
      extrapolation stated as such; a single toy size proves nothing here.
    - >-
      The estimator of I(t) as an empirical log-likelihood ratio is biased at
      small sample counts in the direction of POSITIVE information. The bias
      must be measured on NULL OBJECT 2 and subtracted, or the record will
      manufacture a small positive signal at every level.
    - >-
      Coordinate orderings that correlate with the planted solution's support
      (for example, planting supports drawn with the same PRNG that chooses the
      ordering) create spurious prefix information. Use independent PRNG streams
      and record both seeds.
    - >-
      The lattice control uses a different objective and a different notion of
      'leaf', so the comparison is qualitative (does the estimator detect
      information at all) and NOT a quantitative transfer. Any attempt to
      compare tau values across the two domains is meaningless and must be
      refused.
    - >-
      Montanaro's bound is recalled, not read. If the true bound carries an
      extra factor of depth or applies only to detection rather than finding,
      every cost statement here shifts and the poly-memory Pareto claim may
      weaken.

  interpretation_limits:
    - >-
      A measured tau = 2w closes the DECLARED PREDICATE FAMILY at the TESTED
      TOY PARAMETERS, and nothing more. It is not a statement that quantum tree
      search cannot help against syndrome decoding, and must never be quoted as
      one; predicates using quasi-cyclic ring structure, algebraic prefix
      certificates, or nested subcodes are outside the family and remain open.
    - >-
      A measured tau < 2w at toy scale is hypothesis-generating for a scaling
      law only, and is explicitly NOT a statement about standardized HQC per
      this RQ's constraint on toy-instance results.
    - >-
      The record's Pareto claim is on the MEMORY axis. Even a tie in time
      exponent at polynomial memory is a real result against the quantum-walk
      row, but it is not an exponent move and must not be presented as one.
    - >-
      Nothing here bears on HQC's DFR model, on its classical ISD baseline, or
      on the sibling questions RQ-QALG-457b41 and RQ-QALG-74bf20. The lattice
      control is used for INSTRUMENT CALIBRATION ONLY; no lattice number,
      mechanism or conclusion transfers to syndrome decoding, and in particular
      nothing here says anything about ML-KEM.
    - >-
      KN-LIT-3072's attribution is known to be unreliable in this corpus. Its
      CLAIMS are used; its authorship is not asserted, and the record must be
      upgraded by a careful read before any citation of it is published.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a uniformly random [2n, n] binary code with parity check H whose
        columns are independent and uniform, for any coordinate ordering, and
        for any prefix of length t assigning j <= t error positions, the
        residual syndrome s - (sum of the j chosen columns) is uniformly
        distributed on F_2^n conditioned on the prefix being incorrect, and its
        distribution conditioned on the prefix being correct differs in total
        variation by at most 2^{-(n - (2w - j) log2(2n))}; consequently
        I(t) <= 2^{-Omega(n)} for all t < 2w - ell with ell = O(log n).
      rigorous_support: >-
        The rigorous ingredient is exact: for independent uniform columns, any
        fixed subset sum is uniform and independent of the remaining columns
        (the classical statement imitated is the leftover-hash / random-subset-
        sum uniformity used throughout syndrome-decoding security proofs). The
        heuristic is only that HQC's CIRCULANT columns behave like independent
        uniform ones for this statistic -- the same modelling step every ISD
        cost estimate for quasi-cyclic codes already makes, and the reason
        NULL OBJECT 1 compares quasi-cyclic against random directly.
      validation_plan: >-
        At toy n in {31, 101, 127, 257} and w in {3,...,8}, sample 10^5 planted
        and 10^5 unplanted prefixes at each depth t and compare their residual-
        syndrome statistics by a two-sample test on the empirical weight
        distribution and on the first four Walsh moments, at alpha = 0.01 with
        Bonferroni correction over depths. COMPARISON DISTRIBUTION: the exact
        binomial weight law Binomial(n, 1/2) for the uniform null. TAIL CHECK:
        the extreme 0.1 percent of residuals by weight must also be
        indistinguishable, because a prefix predicate would exploit precisely
        the tail; a tail difference with an indistinguishable bulk is the most
        likely shape of a real positive result and the test must be powered for
        it. SAMPLED PARAMETERS AND TRANSFER RECORDED: toy n only, extrapolated
        to n = 17669 by the stated exponential bound and by nothing else.
      falsification_condition: >-
        Any depth t < 2w - O(log n) at which planted and unplanted residual
        statistics differ at alpha = 0.01 after correction, at two or more toy
        sizes. That would falsify H1 and would BE the positive branch of the
        record.
    - id: H2
      statement: >-
        The surviving-node counts concentrate around the profile recursion
        N_{t+1} = N_t * b_t * q_t, in the sense that
        Pr[|N_t - E N_t| > delta E N_t] <= 2 exp(-delta^2 E N_t / 3) uniformly
        over t with E N_t >= polylog(n), so a single seeded run per cell
        estimates tau to within o(1) in the exponent.
      rigorous_support: >-
        The concentration statement is the classical multiplicative Chernoff
        bound for sums of indicator variables; the heuristic is only the
        independence-across-siblings assumption that licenses it, imitating the
        standard branching-process / first-moment analysis used for random
        search trees. Siblings share a parent's residual and are therefore NOT
        independent, which is exactly why the assumption is heuristic and why
        the validation below measures the variance rather than assuming it.
      validation_plan: >-
        Run 200 independent seeds per cell at the smallest toy sizes and compare
        the empirical variance of N_t against the Chernoff prediction; report
        the ratio per depth. TAIL CHECK: the maximum N_t over 200 seeds must lie
        inside the predicted upper tail; a heavier tail means single-run tau
        estimates are unreliable and the protocol must switch to a median of
        many seeds, which is a change to the measurement, not to the mechanism.
      falsification_condition: >-
        Empirical variance exceeding the Chernoff prediction by more than 4x at
        two or more depths, in which case every tau in the run is reported as an
        interval and any conclusion whose sign is not determined by the whole
        interval is withdrawn.
    - id: H3
      statement: >-
        The ratio tau/2w measured at toy sizes n <= 257 extrapolates to
        n = 17669 with a correction of size O(log n / w), i.e. the ratio is
        asymptotically constant in n along the scaling w = Theta(sqrt(n)).
      rigorous_support: >-
        NO RIGOROUS SUPPORT. This is a pure transfer assumption and it is the
        weakest link in the record. It imitates nothing classical, and the only
        thing that can be said for it is that both the branching factor and the
        survival probability are functions of (n, w) through the same
        combinatorial ratios.
      validation_plan: >-
        Measure tau/2w at n in {31, 101, 127, 257, 521} with w chosen to hold
        w/sqrt(n) fixed, and fit the ratio against a + b log n / w. Report the
        fitted b and its confidence interval; require stability of the fit
        across the last two size doublings before any extrapolated number is
        quoted. Record explicitly that no measurement exists between n = 521 and
        n = 17669.
      falsification_condition: >-
        Fitted ratio drifting monotonically across the last two doublings, in
        which case no extrapolation to HQC parameters is reported at all and the
        record's conclusion is restricted to the tested sizes.

  target_complexity:
    time_exponent: >-
      2^{tau/2 + o(w)} predicate evaluations, where 2^{tau} is the measured
      pruned tree size, against Grover-Prange's 2^{w + o(w)} iterations. The two
      coincide at tau = 2w, which is the PREDICTED outcome; the claimed saving
      is exactly (2w - tau)/2 bits and is zero unless the experiment says
      otherwise. At HQC-128 the baseline is 2^{66}; a measured tau/2w of 0.90
      would give 2^{59.4}.
    memory_exponent: >-
      THIS IS THE RECORD'S POINT. POLYNOMIAL quantum memory -- the walk's state
      is a single tree node plus phase-estimation registers, O(n polylog n)
      logical qubits -- and NO QRAM AND NO QRACM anywhere. Compare: Grover-Prange
      also poly memory and no QRAM (so a tie in time is no gain against it), and
      quantum-walk MMT/BJMM requires QRACM proportional to its representation
      list, which is exponential. A poly-memory algorithm matching the WALK's
      time exponent would be a strict Pareto improvement even with no exponent
      move at all. Classical memory: none.
    qubit_and_depth_exponent: >-
      FULL FAULT-TOLERANT ERROR CORRECTION ASSUMED; NISQ excluded by inspection.
      Width O(n polylog n) = about 2^{15}-2^{18} logical qubits at HQC-128,
      dominated by the residual-syndrome register, which is SMALLER than
      Grover-Prange's materialized-matrix width (about 2^{29} per
      IDEA-20260818-e0ce51) and comparable to its recompute variant. Depth: the
      walk is serial, about 2^{tau/2} steps each of predicate depth
      O(log^2 n) -- so per-step depth is far below a coherent Gaussian
      elimination, but the step count is larger, and the record must report the
      product against the Grover row rather than either factor alone. Under a
      binding MAXDEPTH the same N_full * d * g / D accounting applies and must
      be recomputed, not inherited.
    best_known: >-
      Grover-Prange 2^{w(1+o(1))} = about 2^{66} iterations at HQC-128 at
      polynomial memory and no QRAM (this RQ's declared baseline); quantum-walk
      MMT/BJMM (Kachigar-Tillich; improved line KN-LIT-f7d7dd) possibly lower in
      time with exponential QRACM, unverified at HQC's sublinear weight
      (IDEA-20260813-fe3c5e); a published memory-efficient quantum ISD algorithm
      (LNCS 2023, recalled from a search summary, NOT read) reported to be
      fastest when quantum memory is limited, which is the row most likely to
      already occupy this record's claimed Pareto point.
    hidden_overhead: >-
      The o(w) hides: the polynomial factors in Montanaro's bound including the
      depth factor sqrt(D) with D = 2n, worth about 7.5 bits at HQC-128 and NOT
      negligible against a claimed saving of a few bits; the predicate's own
      circuit cost; the cost of the elimination schedule, which must be prepared
      coherently if the ordering depends on the instance; and the phase-
      estimation precision. NOTHING SUPERPOLYNOMIAL, unlike the exemplar's
      o(1) -- but the polynomial overheads here are of the same order as the
      gain the record is hunting, which is disclosed rather than buried.
    tradeoff_note: >-
      There is no list to trade against memory, so the usual ISD time-memory
      curve does not apply; the record sits at the extreme polynomial-memory
      corner by construction, which is precisely its Pareto argument. The
      tradeoff that does exist is TIME AGAINST PREDICATE STRENGTH: a stronger
      predicate lowers tau and raises the per-node cost, and the optimum over
      the declared family is what Stage 2 measures. Parallelization follows the
      Grover pattern (sqrt(P)) for the walk, so the depth-limited degradation is
      the same shape and the saving, if any, survives it.

  dominated_by: >-
    UNDETERMINED ON TIME, NOT DOMINATED ON MEMORY BY ANY ROW CHECKED, and every
    frontier row was checked. (1) GROVER-PRANGE, 2^{66} iterations, poly memory,
    no QRAM: TIES this record on both axes under the predicted outcome
    tau = 2w. A tie is domination in the Pareto sense once the extra polynomial
    overheads are charged, so under the predicted outcome THIS RECORD IS
    DOMINATED BY GROVER-PRANGE, and it says so. (2) QUANTUM-WALK MMT/BJMM
    (Kachigar-Tillich; KN-LIT-f7d7dd): dominates on time if its exponent is
    genuinely lower at sublinear weight (open, IDEA-20260813-fe3c5e), and is
    dominated by this record on memory since it needs exponential QRACM. Neither
    dominates the other outright -- they are two points on a Pareto frontier and
    must be reported as such. (3) MEMORY-EFFICIENT QUANTUM ISD (LNCS 2023,
    recalled, NOT READ): THE MOST LIKELY DOMINATING ROW ON THIS RECORD'S OWN
    AXIS, because its stated selling point is being fastest when quantum memory
    is limited. It is named here rather than discovered later, and the minimal
    test gates on reading it. (4) CLASSICAL ISD + DOOM, about 2^{125}
    iterations, polynomial classical memory: dominated on time by both quantum
    rows in the iteration-count model, and possibly dominating at MAXDEPTH
    2^{40} per IDEA-20260818-e0ce51 -- which applies to this record too and must
    be recomputed for it. (5) RLPN / dual attacks: dominated at R = 1/2 per
    IDEA-20260818-d5668d; not on this frontier. (6) Brute-force enumeration
    2^{1064}: not on the frontier. NO ROW WAS LEFT UNCHECKED, and the honest
    summary is that this record's Pareto position is entirely a function of a
    number (tau) that has never been measured for this problem.
  sota_delta: >-
    PREDICTED ZERO BITS, with the deliverable being a measured upper bound on
    what the entire polynomial-memory quantum-tree family can buy against
    quasi-cyclic syndrome decoding, plus the first prefix-information profile
    for a code-based problem and the explicit contrast with the lattice
    enumeration tree where the identical quantum machinery does deliver sqrt(T).
    ESCALATION THRESHOLD: any sound predicate with tau/2w <= 0.95 sustained
    across three toy sizes, worth (2w - tau)/2 >= 3.3 bits at HQC-128 AT
    POLYNOMIAL MEMORY, which would be the first QRAM-free improvement on
    Grover-Prange for this target. SECONDARY DELIVERABLE, positive in either
    branch: a reusable, calibrated instrument for measuring prefix information,
    validated against a positive control, applicable to any search-tree
    formulation of any hard problem in this program.

  obstruction:
    statement: >-
      To be filled by the run. ANTICIPATED FORM: 'for a rate-1/2 code with dense
      parity check, a depth-t partial assignment leaves a residual syndrome that
      is uniform and therefore independent of whether the assignment extends to
      the solution, for every t below 2w - O(log n); consequently every sound
      prefix predicate in the declared family has zero information and the
      backtracking tree has size exactly the leaf count. The property that makes
      lattice enumeration different is that its constraint matrix is
      TRIANGULARIZED BY THE SAME BASIS THAT DEFINES ITS OBJECTIVE, so a prefix
      determines a partial objective value; for syndrome decoding, the row
      operations that triangularize the columns delocalize the low-weight
      constraint on the redundancy block, and the two localities cannot be had
      at once.' This is a claim about the OBJECT (the joint locality structure of
      a linear constraint and a Hamming-weight objective), not about the
      attempt. FORWARD GUIDANCE, required by the closure standard: what remains
      open is (a) predicates using quasi-cyclic RING structure rather than
      coordinate structure -- a prefix that fixes a ring-algebraic quantity
      rather than a set of positions; (b) predicates on the TRANSFORM domain,
      where IDEA-20260818-f8dc30 has already mapped what is and is not
      available; (c) trees over the information-set index rather than over the
      error support, whose prefix is a set of columns and whose predicate could
      be a partial rank condition.
    quantity: >-
      (q1) the prefix information profile I(t) in bits per level, per predicate;
      (q2) tau/2w, the pruned-tree-size exponent relative to the Grover-Prange
      exponent, dimensionless; (q3) the same ratio for the lattice enumeration
      positive control, which calibrates q2.
    value: >-
      NOT MEASURED. No run exists; this record proposes the measurement.
      PREDICTED q1 = 0 within the sampling floor for t < 2w - O(log n); q2 = 1.00
      with an error bar set by the toy-size fit; q3 well below 1. These are
      predictions with stated derivations and are not to be quoted as
      measurements, per AGENTS rule 5.
    measured_by: []
    scope: >-
      Would be claimed only for the declared predicate family, the tested toy
      parameters, rate-1/2 binary codes with dense parity checks in the Hamming
      metric, and sound predicates. NOT claimed for ring-structured or algebraic
      predicates, for other metrics, for other rates, for cryptographic n
      without the stated extrapolation, or for quantum tree search in general.
    resource_check:
      examined: true
      reading: >-
        THE OBSTRUCTION IS THE HYPOTHESIS OF A TRANSFER THEORY, and the theory
        that wants it is 'which hard problems admit quantum tree speedups'. The
        localization tension -- an objective that is prefix-decomposable in the
        SAME basis that triangularizes the constraint -- is a checkable property
        of a problem, not of an algorithm, and it separates lattice enumeration
        (yes) from syndrome decoding (predicted no) in one sentence. That is a
        SCREENING TEST applicable to every other target in this portfolio before
        anyone spends a batch on quantum backtracking for it, and no record in
        this corpus states it. A SECOND READING: read backwards, the tension is a
        DESIGN criterion -- a scheme whose hard problem has a prefix-decomposable
        objective in a triangularizing basis is exposed to poly-memory quantum
        tree search, which is a property worth checking when a new hard problem
        is proposed. A THIRD READING FAILED and is recorded: I(t) = 0 was
        examined as a possible resource for an information-theoretic lower-bound
        theory (a proof that no poly-memory quantum algorithm beats Grover here),
        and no such theory was found that takes a measured mutual information at
        toy scale as an input; it bounds a family of algorithms, not the problem.
      spawned_ids: []

  estimated_cost:
    implementation: medium
    compute: medium
    basis: >-
      No quantum simulation. Stage 1 and Stage 2 are tree instrumentation over
      F_2 at n <= 521 -- the cell count is (3 orderings x 6 schedules x about 10
      windows x 5 sizes x 10^4 instances) and the per-instance work is bounded
      by the unpruned node count, which is why sizes stay small; a few core-days
      at the top of the range, and the protocol must cap node counts explicitly
      rather than discovering the cap by timeout (AGENTS rule 3). Stage 3's
      lattice control needs an enumeration implementation, which is the main
      implementation risk and the reason implementation is medium rather than
      low; using an existing enumeration library is strongly preferred over
      writing one. Stage 0 is literature work.

  recommended_priority: medium
