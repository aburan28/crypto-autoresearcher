  assumptions:
    - >-
      Exact arithmetic throughout; GF(2) via the archived block-m4ri engine,
      odd characteristic via exact GF(q) rank. No floating point, no solver
      termination heuristics, no CAS degree self-reports.
    - >-
      The column partition can be re-ordered so the degree-exactly-D monomials
      form a prefix. The partition-independence invariant proved in
      experiments/EXP-DREG-001/implementation.md is what licenses this; it must
      be re-verified by the partition-replication control before any number is
      recorded.
    - >-
      Field equations are INCLUDED in the generating set and this is declared
      per cell, because their inclusion changes the fall profile and is exactly
      the true/fake distinction of KN-OPEN-7f0511. Both arms (with and without
      field equations) are run at the smallest cells so the gap is measured
      rather than assumed.
    - >-
      OFF-LIMITS COMPONENT DECLARED: family F2 (factor-base decomposition) of
      IDEA-20260802-002 is used as the underlying system. What is added is not
      a new factor base but a model-free observable on a presentation; no
      escape from KN-OPEN-020 is claimed or needed, because no new factor base
      is proposed.

  proof_search_map:
    bottleneck: >-
      The step "run F4 to completion and read a degree off it", which is the
      unbounded work the slide calls too hard to do. Replacing it by a ladder
      of bounded per-degree rank computations changes what is measurable
      without changing any mathematics; the exact identity in claim (A) is the
      load-bearing step and it is proved, not assumed.
    baseline_embedding:
      parameter_slice: >-
        Two exact reproductions. (i) At D = max_i deg f_i the matrix M_D has
        only the generators as rows with multiplier 1, so falls(D) = dim of the
        space of coefficient vectors c with deg(sum c_i f_i) < D - which is
        exactly KN-FIND-006's named "degeneracy subspace" and must reproduce
        its measured deficit(D=3) = 1 on the chained arm at n = 12,15,18.
        (ii) On a REGULAR SEQUENCE (a generic system with no field equations
        and D below its degree of regularity) new_falls(D) must be 0 at every
        D below the first fall, which is the definitional boundary.
      reproduction_check: >-
        Frozen regression fixture: re-run the archived
        RUN-DREG-001-VALIDATE-N12 and -N12-NULL cells with the degree-sorted
        column partition and require rank(M_D) to reproduce the archived
        integer EXACTLY (29,418 on the n=12 null arm). A mismatch is an
        instrument failure under the KN-OPEN-5b3a08 precedent and halts the
        line; it is never reported as a degree result.
    observation_collision:
      observable: >-
        The integer vector (new_falls(D))_{D = d_min..D_max} for a fixed
        presentation and filtration.
      distinct_preimage_search: >-
        REQUIRED, and expected to succeed, which bounds every conclusion.
        Build two presentations of the SAME ideal - the chained S_3 system and
        the same ideal with one generator replaced by a random invertible
        F_2-recombination of the generators (Nagao's M-recombination of
        KN-OPEN-7f0511, the D_ff^max construction). If the fall profile
        changes, the observable is presentation-dependent and every conclusion
        is scoped to the presentation; if it does NOT change under any of 200
        random M, that is itself the first data anyone has on D_ff^max for a
        descent system and is reported as such. Both outcomes are results.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          The whole fall profile vector rather than a single degree. The
          single-degree quantities (first fall, degree of regularity, solving
          degree) are all lossy summaries of it, and the dispute in the
          literature is precisely about the relation between two of those
          summaries - which is only visible if the vector is retained.
        predicted_gain: >-
          Converts a contested one-number comparison into a per-degree curve
          measurable at every cell where a single level completes, at the cost
          of one extra rank per level. NO ATTACK EXPONENT IS MOVED.
      - transform: observable_fiber
        proposed_object: >-
          Hold the fall profile fixed and vary the forgotten structure (curve,
          target, basis of V, chain topology) to find whether any intrinsic
          invariant separates systems with equal profiles.
        predicted_gain: >-
          A statement of what the meter cannot see, which bounds the
          conclusions of every sibling record that uses it.
    quantifier_order: >-
      CLAIMED: FORALL fields k, FORALL finite ordered generating sets F in
      k[x_1..x_N], FORALL degrees D, the identity falls(D) = rank(M_D) -
      rank(M_D^top) holds, with M_D, M_D^top as defined. This is uniform and
      proved. NOT CLAIMED, and the distinction is the whole scope: that for
      every F there EXISTS a D_max within budget at which the measured
      d_lf^obs equals the true last fall degree. The measurement is a lower
      bound for each fixed budget; no uniform statement over F is available.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For this presentation, at these parameters, with these field
        equations and this filtration, degree falls occur at exactly the
        degrees D in S, with these dimensions, and therefore any last-fall-type
        invariant of this presentation is at least max(S)." It can NEVER
        certify an upper bound on the last fall degree, can never certify the
        solving degree of F4 (a different algorithm with a different
        strategy), and says nothing about any ideal invariant.
      nearby_object_control: >-
        BLOCKING. A planted system with an early fall at D = 4 and a second
        fall planted at D = 7, constructed by taking a generic system and
        adjoining one deliberately chosen high-multiplier relation. The meter
        must report BOTH falls. A meter that reports only the first has not
        identified the load-bearing structure and is just a first-fall
        detector; this is the fixture that separates this record from every
        first-fall instrument already in the corpus.
    proof_obligations:
      - claim: falls(D) = rank(M_D) - rank(M_D^top).
        responsibility: correctness
      - claim: rowspace(M_{D-1}) is contained in the fall space at D, so new_falls(D) >= 0.
        responsibility: correctness
      - claim: >-
          The degree-sorted column prefix yields rank(M_D^top) as an
          intermediate accumulated rank, under the archived partition
          independence invariant.
        responsibility: interface
      - claim: >-
          Per-level matrix dimensions and peak memory stay inside the declared
          envelope, with a pre-flight monomial count that aborts before
          allocation.
        responsibility: memory
      - claim: >-
          The planted two-fall fixture is reported with both falls.
        responsibility: baseline
      - claim: >-
          Whether max{D : new_falls(D) > 0} equals the HKPY last fall degree.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        new_falls(3) on the Weil-descended chained S_3 GF(2) system at
        t = 3, n in {12, 15, 18}, field equations included
      direction: different
      minimum_effect: >-
        FORCED EQUAL to 1 at every n, reproducing KN-FIND-006's
        deficit(D=3) = 1 exactly, because at D = 3 = max_i deg f_i the fall
        space IS the generator-level degeneracy subspace. A value other than 1
        at any n means either KN-FIND-006's number or this identity is wrong,
        and the record commits in advance to hand-deriving the disagreeing
        cell.
    - metric: >-
        new_falls(D) for D = 4,5,6 on the same systems, Semaev arm
      direction: different
      minimum_effect: >-
        REPORTED WITH A PRE-REGISTERED SPLIT, because both directions are
        informative and the record must not be unfalsifiable. Outcome I
        (supports the first-fall picture at these cells): new_falls(D) = 0 for
        every D in {5,6} at every n, i.e. all falls occur at D <= 4. Outcome
        II (refutes it at these cells): new_falls(D) > 0 for some D >= 5 at
        some n, in which case the measured d_lf^obs is >= 5 while the proved
        first fall degree is 4, and the gap is exhibited rather than argued.
        A split outcome (falls at 5 for n = 18 but not n = 12) is the
        boundary-locating result and is the most valuable of the three.
    - metric: >-
        growth of d_lf^obs and of sum_D new_falls(D) in n at fixed (m, n'),
        and separately in m*n' at fixed q
      direction: higher
      minimum_effect: >-
        PRE-REGISTERED DISCRIMINATION BETWEEN THE TWO AXES RQ-DREG-bd6c86
        names. Fit d_lf^obs against n (fixed m,k-ratio) and against m*n' (fixed
        q). The conclusion is scoped to whichever axis shows a slope whose
        bootstrap CI excludes 0 at the 1 percent level; if both do, both are
        reported; if neither does, the reported result is "no growth
        detectable within the tested ladder", which is a null, not a bound.
    - metric: >-
        new_falls(D) on each null arm (T11 support-matched, and the
        structure-matched arms of IDEA-20260916-9d2fa6) at the same (n, D)
      direction: lower
      minimum_effect: >-
        The null arms' fall profiles are the comparison object. The claim
        "Semaev systems fall earlier / more often than random" is admissible
        only as a per-degree difference against a named null with a stated
        effect size; this metric is REQUIRED so that the Semaev profile is
        never reported alone.
    - metric: >-
        fall profile under 200 random invertible F_2-recombinations M of the
        generators (Nagao's D_ff(M))
      direction: different
      minimum_effect: >-
        REPORTED. If max_M d_ff(M) exceeds the identity-M value at any cell,
        that is the first exhibited separation of D_ff from D_ff^max on a
        Weil-descent system and directly addresses KN-OPEN-7f0511(A), which
        records that Nagao could not discharge it. If no M separates them over
        200 draws, that is evidence (not proof) of stability and is reported
        with its sample size.
    - metric: >-
        peak RSS and wall time per level versus the archived single-rank runs
        at the same cell
      direction: different
      minimum_effect: >-
        REQUIRED SO THE CHEAPNESS CLAIM CAN FAIL. Predicted within 1.15x of
        the archived cost (50.4 s / 0.74 GB at n=12; 404.2 s / 2.64 GB at
        n=15). A measured overhead above 1.5x falsifies the "free byproduct"
        claim and the record must be re-costed.

  minimal_test:
    design: >-
      STAGE 0 - ZERO COMPUTE, HARD GATE, one page. Write out the rank-nullity
      proof of falls(D) = rank(M_D) - rank(M_D^top) and the containment
      rowspace(M_{D-1}) subset fall space at D. Check both by hand on a
      three-line fixture: {x^2, xy} at D = 2 and D = 3 over GF(2). If the hand
      fixture disagrees with the identity, stop and report.
      STAGE 1 - PLANTED TWO-FALL FIXTURE, SECONDS. Build the blocking
      nearby-object control: a small generic system with a planted fall at 4
      and a second planted fall at 7. Require the meter to report both. This
      gate runs BEFORE any Semaev number is recorded.
      STAGE 2 - ARCHIVED-CELL REPRODUCTION, MINUTES TO ONE HOUR. Re-run the
      n = 12 Semaev and n = 12 null cells of EXP-DREG-001 with the degree-
      sorted column partition. Require rank(M_D) to reproduce the archived
      integers exactly. Emit the first fall profile.
      STAGE 3 - THE LADDER, SINGLE-DIGIT CPU HOURS. Chained GF(2) arm,
      t = 3, n in {12, 15, 18} (and n = 21 only if Stage 2 timing supports
      it), D = 3..6, field equations in and out, Semaev arm and T11 null arm,
      3 seeds. Every cell that does not complete is recorded as NOT MEASURED
      with its pre-flight monomial count; it is never negative evidence.
      STAGE 4 - THE RECOMBINATION ARM, MINUTES. 200 random invertible M per
      cell at n = 12 only, reporting max_M d_ff(M) versus d_ff(identity).
      STAGE 5 - THE ODD-CHARACTERISTIC ARM, MINUTES. The direct S_{m+1}
      system over F_q, q in {3,5,7}, m in {3,4}, n' in {1,2}, so that the
      binary-only conclusions have a nearby object in a different
      characteristic. Nagao's Proposition 2 (d_F <= 3p+1 for p >= 3 versus
      <= 4 at p = 2, KN-LIT-71b758) is the published prediction this arm
      tests against.
      STAGE 6 - ZERO COMPUTE. Report the profile table, the two-axis fit, the
      null comparison, and the list of not-measured cells. Propose nothing
      about cryptographic parameters.
      MEMORY ENVELOPE. Pre-flight monomial count aborts before allocation if
      the projected working set exceeds the contract; the archived n = 15 cell
      used 2.64 GB and n = 18 more, so D = 6 at n = 18 is expected to be the
      first not-measured cell and is budgeted as such rather than attempted
      and truncated.
    controls:
      - >-
        PLANTED TWO-FALL FIXTURE (blocking). The meter must report a fall at
        both 4 and 7; a first-fall-only report disqualifies the instrument.
      - >-
        REGULAR-SEQUENCE NEGATIVE CONTROL. A generic system known to be a
        regular sequence must give new_falls(D) = 0 for every D below its
        degree of regularity. A nonzero reading there is an implementation
        defect.
      - >-
        T11 SUPPORT-MATCHED NULL ARM at every cell, identical code path.
      - >-
        FIELD-EQUATIONS-OUT ARM at the smallest cells, so the true/fake gap of
        KN-OPEN-7f0511 is measured on this presentation rather than assumed.
      - >-
        PARTITION-REPLICATION CONTROL (archived, mandatory). Three column-block
        widths must give identical ranks, since the prefix read is only valid
        under partition independence.
      - >-
        ARCHIVED-INTEGER REPRODUCTION at n = 12 and n = 15 before any new
        number is reported.
      - >-
        RECOMBINATION CONTROL: identity M is one of the 200 draws and must
        reproduce the plain profile bit for bit.
    required_metrics:
      - 'rank(M_D), rank(M_D^top), rank(M_{D-1}), falls(D), new_falls(D) per cell per degree'
      - 'd_ff and d_lf^obs per cell, with the budget D_max that bounds the latter'
      - 'the same five numbers on every null arm at the identical cell'
      - 'per-cell matrix dimensions, pre-flight monomial count, peak RSS, wall time'
      - 'field-equations in/out difference at the smallest cells'
      - 'max_M d_ff(M) over 200 recombinations, and the identity-M reproduction'
      - 'list of cells recorded as NOT MEASURED, with the reason and the monomial count'

  falsification_conditions:
    - >-
      The hand fixture in Stage 0 disagrees with falls(D) = rank(M_D) -
      rank(M_D^top). The identity is false as stated and the record is
      withdrawn.
    - >-
      The planted two-fall fixture reports only the first fall. The meter is a
      first-fall detector and adds nothing to IDEA-20260807-899c5e's Q3.
    - >-
      Stage 2 fails to reproduce the archived rank integers. Instrument
      failure; the line halts and reports under the KN-OPEN-5b3a08 precedent.
    - >-
      new_falls(3) is not 1 on the chained arm. Either KN-FIND-006's
      deficit(D=3) = 1 or the identification of the D = max-deg fall space
      with the generator degeneracy subspace is wrong; both matter more than
      any growth law.
    - >-
      The measured overhead over the archived single-rank cost exceeds 1.5x.
      The "free byproduct" cost claim is false and the record is re-costed.
    - >-
      The regular-sequence control shows a spurious fall. Implementation
      defect; every number in the battery is void.

  confounders:
    - >-
      COLUMN-ORDER DEPENDENCE. rank(M_D) is order-independent but the PREFIX
      read is not meaningful unless the prefix is exactly the degree-D
      monomials. A partially sorted partition silently measures a different
      quantity. The partition-replication control plus an explicit assertion
      on the prefix boundary are both required.
    - >-
      ROW SET DEFINITION. Whether M_D includes rows m*f_i with
      deg(m*f_i) < D (i.e. under-degree multiples) changes falls(D). This
      record fixes the convention "all m with deg(m*f_i) <= D" and requires it
      to be asserted per run; comparisons across conventions are void.
    - >-
      FIELD EQUATIONS AND BOOLEAN REDUCTION. Over GF(2) with x^2 = x imposed
      by reduction rather than as explicit generators, the degree of a
      reduced representative is not the degree of the polynomial, which is
      exactly the true/fake distinction. The in/out arm exists because this
      confounder cannot be argued away.
    - >-
      DEFICIENT CELLS. KN-FIND-006 records n = 9 and n = 17 as structurally
      deficient (not exactly n quadrics + n cubics in 2n variables). Those
      cells are reported separately and never pooled into a growth fit.
    - >-
      d_lf^obs IS BUDGET-DEPENDENT BY CONSTRUCTION. A larger D_max can only
      raise it. Any comparison of d_lf^obs across cells must hold D_max fixed,
      or it is comparing budgets.
    - >-
      NOT SEMAEV'S d_F4. Semaev reads a degree off MAGMA's F4 verbosity,
      excluding "no pairs to reduce" tail steps (KN-OPEN-d218ec). This meter
      measures something else on a different presentation of possibly the same
      ideal; the map between them is an open item this record does not close.

  interpretation_limits:
    - >-
      This is an INSTRUMENT result. No attack, no exponent, no statement about
      any deployed curve in either direction.
    - >-
      Every number is scoped to the presentation, the generating set, the
      field-equation convention, the row-set convention, the filtration, and
      the tested (m, n', q, n) cell. The fall profile is not an ideal invariant
      and may not be quoted as one (IDEA-20260830-cb8e46's claim-tier warning
      applies verbatim).
    - >-
      d_lf^obs is a LOWER bound on a last-fall-type quantity of this
      presentation. It is not an upper bound on anything, and in particular it
      does not by itself bound any solving degree - the HKPY direction runs the
      other way and requires their definition, which was not read.
    - >-
      A flat profile at the tested cells constrains the first-fall-degree
      assumption AT THOSE CELLS and nowhere else. Semaev's own boundary is
      k > ceil(n/m) (KN-LIT-fa346d Section 4.5.1) and the ladder must cross it
      before anything is said about it.
    - >-
      KN-OPEN-020 class: not applicable - no factor base is proposed, the
      existing one is used unchanged.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (INSTRUMENT HEURISTIC, NOT A MATHEMATICAL ONE.) The fall profile
        measured on a bounded random sample of targets R and factor-base seeds
        at a given cell is representative of the cell: specifically, the
        distribution of new_falls(D) across seeds at fixed (n, m, k, D) is
        concentrated enough that a 3-seed sample determines the profile's
        support (the set of D with new_falls > 0) with probability at least
        0.9.
      rigorous_support: >-
        The rigorous half is that for a FIXED instance every reported number is
        exact - the ranks are exact GF(2) ranks, not estimates, so there is no
        measurement error, only sampling error across instances. The classical
        statement being imitated is the usual concentration of an algebraic
        invariant over a Zariski-open set of instances: the profile is constant
        off a proper closed subvariety of the parameter space, so a finite
        sample misses that subvariety with high probability.
      validation_plan: >-
        SAMPLE - 12 seeds (rather than 3) at the single cheapest cell
        (n = 12, D = 4), recording the empirical distribution of new_falls(D)
        across seeds, and 3 seeds at every other cell. COMPARISON - the
        3-seed support versus the 12-seed support at the calibration cell.
        TAIL CHECKS - (a) report the seed with the LARGEST d_lf^obs
        individually, never only the median; (b) report any seed whose profile
        support differs from the modal support, with its curve, target and
        basis recorded, because a single deviant seed is the interesting
        object here and pooling would hide it. SAMPLED PARAMETERS RECORDED -
        n, m, t, k, q, curve coefficients, target R, F_2-basis of V, seed,
        field-equation convention, row-set convention, D_max. TRANSFER
        ASSUMPTIONS - NONE. Nothing is claimed above the tested ladder; no
        extrapolation to n = 409 or 571 is performed or licensed by this
        record.
    - id: H2
      statement: >-
        The fall profile of the chained presentation is stable under
        invertible F_2-recombination of the generators: for a uniformly random
        invertible l x l matrix M over F_2, Pr[d_ff(M) > d_ff(identity)] is
        below 0.05 at the tested cells.
      rigorous_support: >-
        Rigorously, d_ff(M) >= d_ff(identity) fails in general and
        D_ff^max := max_M D_ff(M) >= D_ff by construction (KN-OPEN-7f0511),
        so the quantity is well defined and one-sided. Nagao states on the
        record that he cannot prove Weil-descent systems have low D_ff^max and
        calls it future work; this assumption is the measurable shadow of that
        gap and is EXPECTED to be the one that breaks.
      validation_plan: >-
        SAMPLE - 200 uniform invertible M at n = 12 (the only cell where 200
        full profiles are affordable), identity included as a control draw.
        COMPARISON DISTRIBUTION - the empirical distribution of d_ff(M) against
        the point mass at d_ff(identity); report the fraction strictly above.
        TAIL CHECKS - the single M achieving the maximum is SERIALISED AND
        ARCHIVED, because an exhibited separating recombination is the cheap
        half of KN-OPEN-7f0511's resolution criterion and is worth more than
        the aggregate. SAMPLED PARAMETERS - as H1 plus the M seed and rank
        check. TRANSFER - none; 200 draws at one cell bound nothing about
        max over all M, and the record says only "no separation found in 200
        draws" if none is found.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR MOVED. As an instrument: measuring the
      fall profile up to degree D costs one exact rank per degree on a matrix
      with C(N + D, D)-order columns, i.e. O(R_D * C_D * min(R_D, C_D) / w)
      bit operations with the archived block engine, plus ONE additional
      prefix read per degree at zero marginal cost. Against the program's
      current practice (one rank per degree, no prefix read) the marginal cost
      is the extra bookkeeping only; the predicted overhead is below 1.15x and
      is a required falsifiable metric.
    memory_exponent: >-
      Unchanged from the archived instrument: peak carrier storage, measured at
      0.74 GB (n = 12) and 2.64 GB (n = 15) in the archived runs. The prefix
      read adds one integer per level. No Macaulay matrix larger than the one
      already built is required, which is the entire point: the measurement is
      bounded in advance by a pre-flight monomial count.
    best_known: >-
      For the QUESTION (how the degree grows): the best known instruments are
      (i) a full F4/Magma solve with per-step degree verbosity, as in
      KN-LIT-fa346d Tables 1-2 (2300 systems, n <= 21, m <= 6, plus one cell at
      n = 40) - unbounded work, and reported by Kosters as costing 111-126 GB
      at n = 45; (ii) this program's single-degree Macaulay rank deficit
      against a semi-regular prediction (KN-FIND-006) - bounded work but
      model-relative; (iii) IDEA-20260905-d76d38's per-consequence persistence
      certificate - bounded but requiring full-column nonexistence certificates
      at every lower degree per consequence, which is strictly more work than
      three ranks. For the ECDLP itself: Pollard rho at 0.886*sqrt(N) group
      operations with O(1) memory, unaffected by anything here.
    hidden_overhead: >-
      Two honest disclosures. (1) The o(1)-free statement "bounded work" is
      bounded PER LEVEL, not over all levels: the number of levels needed to
      see the last fall is exactly what is unknown, so a budget D_max is a
      choice and d_lf^obs is a lower bound relative to that choice. (2) The
      identification of max{D : new_falls(D) > 0} with the HKPY last fall
      degree is unverified and, if false, this record measures a related but
      distinct invariant - the claim text is written so that nothing depends
      on that identification.
    tradeoff_note: >-
      The per-level rank is embarrassingly parallel over column blocks with
      one carrier merge, which is how the archived engine already works; the
      time-memory position is the standard one for exact GF(2) rank (more
      column blocks lowers peak memory and raises carrier I/O). No attack
      time-memory tradeoff is claimed because no attack is proposed.

  dominated_by: >-
    CHECKED ROW BY ROW. As an ATTACK: n/a - none is mounted, so every frontier
    row dominates on every axis (rho N^{1/2} time / O(1) memory; BSGS
    N^{1/2}/N^{1/2}; van Oorschot-Wiener parallel rho; multi-target sqrt(TN);
    preprocessing S*T^2 = Omega~(N); meet-in-the-middle index calculus). Time,
    memory and data/query axes all checked; none approached; none affected.
    As an INSTRUMENT for the degree question: NOT DOMINATED on the axis of
    (information per unit of bounded work) by any in-corpus instrument - a full
    F4 solve dominates it on completeness (it yields the actual solving degree)
    but is unbounded work and is exactly what the slide says cannot be done at
    the parameters of interest; IDEA-20260905-d76d38's persistence certificate
    dominates it on per-consequence resolution and is dominated by it on cost
    (three ranks versus one nonexistence certificate per consequence per
    degree); IDEA-20260807-899c5e's Q3 meter is strictly weaker (model-relative
    and first-fall only). Not null on any axis.
  sota_delta: >-
    Zero on every ECDLP cost axis. Quantified deltas against the prior state of
    THIS program: (1) the program currently has no measurement of any fall
    above the first at any cell - the analysis record states "d_ff null, all n:
    not attempted" - so the delta is the first fall profile in the corpus,
    at a marginal cost predicted below 1.15x of an already-paid computation;
    (2) it converts KN-FIND-006's model-relative deficit into a model-free
    dimension computable identically on Semaev and null arms, which is the
    prerequisite for IDEA-20260916-9d2fa6's null tower; (3) it supplies the
    first data anyone has on Nagao's D_ff^max for a Weil-descent system, which
    KN-OPEN-7f0511 records as author-declared future work. Against the
    EXTERNAL state of the art the delta is a measurement at parameters the
    literature has already measured by other means (n <= 21), so the external
    contribution is the instrument and the null comparison, not the range.

  estimated_cost:
    implementation: low
    compute: low
    basis: >-
      Implementation LOW: the rank engine, the system builder, the T11 null and
      the partition-replication control all exist in
      experiments/EXP-DREG-001/ and src/; the additions are a degree-sorted
      column partition, one accumulated-rank read at the prefix boundary, and
      three arithmetic lines. Compute LOW: single-digit CPU hours to cover
      n in {12,15,18} at D = 3..6 on both arms with 3 seeds, based on the
      archived 50.4 s (n=12) and 404.2 s (n=15) per-cell timings and the
      recorded 10.1x work ratio from n=15 to n=18. The n=18, D=6 cell is
      budgeted as the expected first NOT-MEASURED cell.

  recommended_priority: high

  discriminated_from: >-
    IDEA-20260905-d76d38 tracks INDIVIDUAL consequences and their minimum
    derivation degree, and needs a full-column nonexistence certificate at
    every lower degree per consequence; this record tracks the AGGREGATE
    dimension of the fall space per degree from three ranks, needs no
    nonexistence certificates, and is therefore strictly cheaper and strictly
    coarser. The two are complementary and their outputs are mutually
    checkable: sum over consequences of d76d38's births must equal this
    record's new_falls(D) per degree, which is a cross-instrument control
    neither record can run alone. IDEA-20260807-899c5e's Q3 is defined as
    "rank below the generic Koszul-only prediction" - model-relative and
    first-fall only - whereas new_falls(D) is intrinsic and covers every
    degree. KN-FIND-006 measures deficit against a semi-regular prediction,
    a different quantity with a different failure mode.

