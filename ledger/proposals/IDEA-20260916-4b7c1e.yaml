idea:
  id: IDEA-20260916-4b7c1e
  question_id: RQ-DREG-bd6c86
  added: '2026-09-16'
  proposed_by: idea-generator
  status: proposed
  title: >-
    THE FALL PROFILE IS THREE RANKS AND THE PROGRAM ALREADY PAYS FOR TWO OF
    THEM: new_falls(D) = rank(M_D) - rank(M_D restricted to degree-exactly-D
    columns) - rank(M_{D-1}) turns "how does the degree grow" from an
    unbounded F4 solve into a bounded per-degree linear-algebra measurement,
    yields a CERTIFIED LOWER BOUND on the last fall degree at every cell where
    no solve completes, and is the one observable that separates the first
    fall from every later fall - which is the entire content of the
    Petit-Quisquater / Semaev assumption the slide rests on
  class: measurement

  claim: >-
    (A) THE IDENTITY. Let F = (f_1,...,f_l) be a generating set in a
    polynomial ring over a field, let M_D be the Macaulay matrix at degree D
    (rows m*f_i for every monomial m with deg(m*f_i) <= D; columns all
    monomials of degree <= D), and let M_D^top be the submatrix of M_D whose
    columns are the monomials of degree EXACTLY D. Then

        falls(D)     := dim { v in rowspace(M_D) : v is supported only on
                              columns of degree < D }
                      = rank(M_D) - rank(M_D^top),
        new_falls(D) := falls(D) - rank(M_{D-1}).

    Both equalities are exact and unconditional. The first is rank-nullity
    applied to the projection of rowspace(M_D) onto its degree-D columns; the
    second holds because every row of M_{D-1} is a row of M_D and is supported
    in degree <= D-1, so rowspace(M_{D-1}) sits inside the fall space at D,
    giving new_falls(D) >= 0 with equality exactly when level D produces no
    consequence of degree < D that level D-1 did not already produce.
    (B) THE INSTRUMENT. The program's block-m4ri exact-rank engine
    (experiments/EXP-DREG-001/, src/h012c_block_m4ri.py) already computes
    rank(M_D) column block by column block and checkpoints a carrier per
    block. If the column partition is ordered so that the degree-exactly-D
    monomials form a prefix, then rank(M_D^top) is the accumulated rank at the
    end of that prefix - i.e. a FREE BYPRODUCT OF THE SAME SINGLE PASS. The
    fall profile (new_falls(3), new_falls(4), ..., new_falls(D_max)) therefore
    costs what the program already spends on one rank per degree, plus zero.
    (C) WHAT IT CERTIFIES, AND THE ASYMMETRY, STATED BEFORE THE MEASUREMENT.
    d_ff := min { D : new_falls(D) > 0 } is CERTIFIED EXACTLY once measured
    from D = min_i deg f_i upward with no gaps. The largest measured fall,
    d_lf^obs := max { D <= D_max : new_falls(D) > 0 }, is a CERTIFIED LOWER
    BOUND on any last-fall-type invariant of the same generating set and
    filtration, and NOTHING MORE: falls above D_max are unobserved, so this
    meter can never certify an upper bound. That asymmetry is the useful one
    here. The assumption under audit - that the solving degree stays near the
    FIRST fall degree - is refuted by a growing lower bound and is merely not
    contradicted by a flat one, so the instrument's one-sided power points at
    the direction the literature disputes (KN-LIT-7604, KN-LIT-7607 against;
    KN-LIT-fa346d Assumption 1 and KN-LIT-71b758 Assumption 1 for).
    (D) WHAT IT IS NOT. new_falls is a property of the GENERATING SET and the
    degree filtration, not of the ideal (IDEA-20260830-cb8e46 establishes that
    ideal-invariant observables of this family carry only the grid point set).
    Whether max{D : new_falls(D) > 0} coincides with the Huang-Kosters-Petit-
    Yeo last fall degree as they define it is an UNVERIFIED DEFINITIONAL STEP
    - this session read only the abstract of eprint 2015/573 - and it is the
    fifth entry in the definition zoo KN-OPEN-7f0511 already documents. The
    record therefore reports "fall profile of the stated presentation" and
    upgrades to "last fall degree" only after the definition is read.

  mechanism: >-
    OBJECT FRAME, STATED FIRST BECAUSE THIS IS A MINED LANE. Representation:
    the ordered generating set of the Weil-descended chained/direct Semaev
    system together with its Boolean (or F_q) field equations, presented in a
    degree-graded monomial basis - an R1-class representation (field
    representation of the coordinates) in the RQ-ECDLP-623a32 taxonomy, and
    the attack stage whose charged cost it speaks to is RELATION DECOMPOSITION
    only. Operation set Sigma: multiply a generator by a monomial subject to a
    total-degree cap, and take field-linear combinations - the Macaulay/XL
    step set, NOT the translation action. Trichotomy class (IDEA-20260806-
    c5d183): COORDINATE-DEPENDENT, and provably so - the fall profile changes
    when the same ideal is re-presented, which is exactly why it can see the
    presentation question that ideal invariants cannot.
    LOSSY-PROJECTION TEST AGAINST SIGMA. The tracked object is the pair of
    graded subspaces (rowspace(M_D) modulo its degree-D part, rowspace(M_D)),
    projected to the integer vector (rank(M_D), rank(M_D^top)). The projection
    to integers is genuinely lossy: from the two integers one cannot recover
    the polynomials, the curve, the target, or the solution set. IT DOES NOT
    PROPAGATE DETERMINISTICALLY UNDER Sigma, and this record says so instead
    of hiding it - the dimension at level D does not determine the dimension at
    level D+1; the SUBSPACE does. That is the honest statement, and it is why
    this is a MEASUREMENT record and not an attack object: the meter is read
    once per level from the subspace that Sigma does propagate, and the
    integers are the report, not the state. A record claiming the integers
    themselves propagate would be claiming a Hilbert-series recursion that
    does not hold for a non-regular sequence.
    WHY THE IDENTITY IS THE POINT. The program currently measures
    deficit(D) = semi-regular-prediction(D) - rank(M_D) (KN-FIND-006,
    EV-DREG-001..008). That quantity is a DIFFERENCE AGAINST A MODEL and
    inherits every weakness of the model - it needs a null object to mean
    anything, it is defined only where the prediction formula applies, and it
    conflates "this system has extra syzygies" with "this system produces
    low-degree consequences early". falls(D) needs NO MODEL AT ALL: it is an
    intrinsic dimension of the row space, computable on the Semaev arm and on
    every null arm with identical code, and it is the quantity that the
    first-fall/last-fall dispute is literally about. The two are related but
    not equal, and measuring both on the same matrices costs one extra rank.
    WHY THIS ATTACKS THE SLIDE'S OWN CLAIM. "It also seems to be too hard to
    do experiments at the moment" is a claim about SOLVING. Solving is
    unbounded work: F4 runs until it terminates, and a cell that does not
    terminate yields nothing (and under AGENTS rule 3 may not be read as
    evidence of high degree). Per-degree rank is BOUNDED work: the degree-D
    Macaulay matrix has a known size before it is built, the pre-flight
    monomial count decides feasibility in advance, and every completed level
    is a permanent result independent of whether any later level completes.
    Converting the unbounded question into a ladder of bounded ones is the
    whole proposal.

  novelty_status: unverified

