idea:
  id: IDEA-20260901-133fd3
  question_id: RQ-ECDLP-002
  added: '2026-09-01'
  title: >-
    THE PROMISE-CLASS BALANCE LAW, AND THE ONE RATIO THAT COULD BREAK IT: because
    x -> ax + b is free for the ECDLP, every attack that re-randomises into an
    easy set W costs T(W) * n / |W|, so the ENTIRE re-randomisation family is
    controlled by the single ratio T(W) / sqrt(|W|) -- which is exactly 1 for
    intervals and kangaroo, is the quantity representation-technique knapsack
    algorithms push below 1 in the plain-integer setting, and whose measured
    behaviour on low-weight scalars in a GROUP decides whether the program's
    sum-compatible-filter closure cascades over this family or is broken by it
  class: composition

  claim: >-
    Setting: E/F_p, P of prime order n, Q = [x]P, x unknown and uniform in Z/n.
    Two re-randomisations are FREE and exact: the SHIFT x -> x + b, realised by
    Q -> Q + [b]P, and the SCALE x -> a*x for a invertible mod n, realised by
    Q -> [a]Q. Both are one scalar multiplication and both are invertible, so a
    solution pulls back exactly.

    (A) THE BALANCE LAW (rigorous, no model, no heuristic). Call a subset W of
    Z/n a PROMISE CLASS with solve cost T(W) if there is an algorithm that,
    given (P, Q) with the promise log_P(Q) in W, returns the logarithm in T(W)
    group operations. Consider any attack of the form: draw (a, b) uniformly,
    form Q' = [a]Q + [b]P, run the W-solver, repeat on failure. Since a*x + b is
    uniform on Z/n when (a, b) is uniform, each attempt succeeds with probability
    exactly |W| / n, so the expected total is
        C(W) = T(W) * n / |W|.
    Every known promise class has T(W) >= sqrt(|W|) -- intervals give
    T = 2*sqrt(|W|) by kangaroo, cosets of a subgroup give Pohlig-Hellman, and
    the trivial class W = Z/n gives rho at 0.886*sqrt(n) -- and under that
    inequality C(W) >= n / sqrt(|W|) >= sqrt(n), with equality exactly at
    |W| = n. THE WHOLE FAMILY IS THEREFORE CONTROLLED BY ONE DIMENSIONLESS
    NUMBER,
        R(W) = T(W) / sqrt(|W|),
    because C(W) = R(W) * n / sqrt(|W|). R = 1 for every incumbent, which is why
    the family has produced nothing; R(W) < 1 for a class extending to
    |W| = n^{1-o(1)} would give C = R * n^{1/2+o(1)} and, if R itself decays
    polynomially in |W|, an EXPONENT below 1/2.

    (B) WHY THIS IS NOT A TAUTOLOGY, AND WHERE THE PROGRAM'S OWN RESULTS ENTER.
    R(W) < 1 is not absurd and is not ruled out by the generic lower bound. The
    Shoup bound applies to the UNPROMISED problem; a promise class is a
    restricted input distribution and the bound does not transfer to it -- the
    interval class already shows T can be far below sqrt(n), it just is not
    below sqrt of its OWN size. In the plain-integer world the analogous ratio IS
    pushed below 1: representation-technique knapsack algorithms solve random
    subset-sum instances of search space 2^l in time about 2^{0.29 l} rather
    than the meet-in-the-middle 2^{0.5 l}, i.e. R about 2^{-0.21 l}. The
    corresponding ECDLP promise class is the LOW-HAMMING-WEIGHT class
    W(l, w) = {scalars with exactly w ones in their l-bit expansion}, whose
    solver must find eps in {0,1}^l with the sum of eps_i * [2^i]P equal to Q --
    a subset sum IN THE GROUP. THE HINGE IS THEREFORE EXPLICIT: the
    representation technique's speedup rests on filtering partial sums on a
    prefix of the target, and in a group that filter is precisely a
    sum-compatible statistic. This program has already worked that question --
    analysis/o2-sum-compatible-filters and the finding it cites as KN-FIND-ffe1df
    ('no cheap sum-compatible filter on E(F_p)'), LOCATED BY GREP AND NOT OPENED
    IN THIS SESSION -- and its result, if it says what its cited summary says,
    CASCADES over this whole family through the balance law.

    (C) THE CLAIM THIS RECORD ASKS TO TEST, STATED SO THAT BOTH ANSWERS ARE
    RESULTS. For a declared ladder of promise classes, the measured ratio
    R(W) = T(W) / sqrt(|W|) is at least 1 minus a pre-registered band, at every
    tested size, and does not decrease as |W| grows toward n. THE CASCADE
    PREDICTION: it does not decrease, because every route to R < 1 known to this
    record -- representation splitting, and the k-tree route -- passes through
    the sum-compatible filter that the program's prior lane reports as
    unavailable. THE BREAK: a measured R(W) below 1 that persists or improves as
    |W| grows, on the group instance and not merely on the plain-integer
    instance, is an exponent-relevant lead and falsifies the cascade. Note which
    way the risk runs: the plain-integer low-weight problem is NOT the group
    problem, and a pipeline that accidentally measures the integer version will
    report a spurious break. Separating them is the design's central duty.

    (D) WHAT THE LAW ALSO SETTLES AT ZERO COMPUTE, AND WHY IT MATTERS FOR THIS
    PROGRAM'S DIRECTION. docs/target-result-profile.md holds up a template --
    rigorous size bound, smoothness splitting, keyed-table claw,
    re-randomisation with a mixing bound, per-attempt cost times inverse success
    probability -- and no record states why it does not port to the ECDLP. The
    balance law states it quantitatively. The exemplar's enabling ingredient
    places the witness in a space of size p^{1/3} inside an ambient of size p;
    the ECDLP's best available guaranteed-existence statement is rational
    reconstruction -- every x mod n has x congruent to a times the inverse of b
    with |a|, |b| at most sqrt(n) -- whose witness space has size exactly n,
    a reduction of ZERO. And zero is FORCED for any instance-independent
    representation, by pigeonhole: x is uniform on n values, so a family
    covering all of them has at least n witnesses. The exemplar's A4 ingredient
    therefore has NO instance-independent ECDLP analogue, and the search target
    it leaves behind is stated exactly: a guaranteed-existence theorem placing
    the witness in a space of size n^{1-delta} with delta > 0, or a promise
    class with R < 1. This record measures the second.

  mechanism: >-
    THE TRACKED OBJECT is the PROMISE CLASS itself -- a subset W of the exponent
    group, carried through the computation as a restriction on the input
    distribution rather than as a function of the state. This is a different
    kind of object from every other in the corpus's ECDLP lane, which track
    functions of a point; the lossy-projection test applies to it in a modified
    form and is discussed in object_first_candidate rather than skipped.

    STAGE 1 (ZERO COMPUTE, HARD GATE). Write the balance law with the uniformity
    step in full: a*x + b is uniform on Z/n for (a, b) uniform with a invertible,
    for every fixed x, INCLUDING x = 0, which is the degenerate case the
    derivation must handle rather than assume away. Write claim (D)'s pigeonhole
    argument. Check the law against the object where its conclusion must hold
    with equality -- the interval class -- and against the object where the
    promise is vacuous -- W = Z/n, where C(W) must reduce to plain rho.

    STAGE 2 (INSTRUMENT, AND THE SEPARATION THAT MATTERS). Implement two
    solvers for the low-weight class W(l, w), on the same instances:
      SOLVER-I, the plain MITM with splitting: enumerate half-weight prefixes
        and half-weight suffixes and collide on group elements. Its cost is the
        baseline against which R is measured.
      SOLVER-R, a representation-style variant: allow the two halves to overlap
        in weight, so each solution has many representations, and filter partial
        sums on a declared statistic of the group element. THE DECLARED FILTER
        IS THE EXPERIMENTAL VARIABLE and must be named before the run: a bucket
        of the x-coordinate, a quadratic character, or any other statistic the
        executor declares in advance.
    AND, RUN ALONGSIDE AS THE SEPARATING CONTROL, the same two solvers on the
    PLAIN-INTEGER version of the identical instances, where the filter is a
    prefix of the integer and the representation technique is known to work. The
    integer arm must show R < 1 or the implementation of SOLVER-R is wrong; the
    group arm is the measurement. Reporting a group-arm number without the
    integer arm is prohibited by this record.

    STAGE 3 (THE MEASUREMENT). Sweep w so that |W(l, w)| ranges over at least
    three orders of magnitude at each of three values of l, and record T(W) as
    CERTIFIED group operations to solution, averaged over at least 200 random
    instances per cell, together with |W| computed exactly as a binomial
    coefficient. Report R(W) with a bootstrap interval, and the fitted slope of
    log R against log |W|.

    STAGE 4 (CONTROLS AND NULLS). See null_object_control.

    STAGE 5 (DECAY AND ARTIFACT CHECK). Any measured R below 1 in the group arm
    must be re-run at a larger l. A ratio that does not persist as l grows, or
    that is not accompanied by the corresponding integer-arm ratio, is an
    artifact under docs/inventor-protocol.md section 3 and is reported as a
    controlled null.

  novelty_status: unverified

