      'wagner|k-tree|generalized birthday|k-sum|rational reconstruction|thue',
      for 'bezout|subfield|weil restriction', for 'coppersmith|small root', and
      for 'aubry|does not port|guaranteed-existence|witness space'; plus full
      reads of IDEA-20260807-df906f, KN-TECH-015, KN-TECH-018, KN-TECH-73630e,
      KN-FIND-002, KN-FIND-b7e091 and the claim section of IDEA-20260815-f558e4.
      One web search on prime-field ECDLP algorithms was run; no external source
      was opened and one fetch attempt failed with a transport error.
    results: >-
      The k-tree and sum-compatible-filter cell is ALREADY WORKED, in
      analysis/o2-sum-compatible-filters (a closure document with a red-team and
