  assumptions:
    - >-
      n prime and known. The scale re-randomisation needs a invertible mod n,
      which for prime n is every non-zero a; for composite n the law still holds
      with the invertible residues but the uniformity step changes and the case
      is excluded.
    - >-
      The promise-class solver is charged in GROUP OPERATIONS including the cost
      of building any list it uses. A solver charged only for its collision
      search is measuring an idealised count, which KN-TECH-006 explicitly
      forbids.
    - >-
      (a, b) drawn uniformly and independently per attempt, so attempts are
      independent and the geometric expectation n/|W| is exact rather than
      heuristic.
    - >-
      Toy scale only: l in the 24 to 36 bit range, so that both solvers run to
      completion many times and T(W) is a measured mean rather than an
      extrapolation.

  proof_search_map:
    bottleneck: >-
      Not the balance law, which is one line, but T(W) for the low-weight class
      in the GROUP: whether a representation-style solver with a declared
      group-element filter beats splitting. Every exponent statement here is a
      function of that one measured ratio.
    baseline_embedding:
      parameter_slice: >-
        W = Z/n, the vacuous promise. Then |W| = n, T(W) is plain rho, and the
        law returns C = 0.886*sqrt(n) exactly -- the incumbent baseline. The
        second slice is W = an interval of length L, where T = 2*sqrt(L) by
        kangaroo and C = 2n/sqrt(L), minimised at L = n back to 2*sqrt(n).
      reproduction_check: >-
        Frozen fixture: at a toy n, run the kangaroo solver on intervals of
        three declared lengths and assert the measured T within a stated factor
        of 2*sqrt(L), and run the rho solver on the vacuous promise and assert
        the measured cost within a stated factor of 0.886*sqrt(n). If either
        misses, the cost accounting is wrong and no R value is interpretable.
    observation_collision:
      observable: >-
        The ratio R(W) = T(W) / sqrt(|W|) at a given class size.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, and it is the design's central
        separation: two structurally different instances with the same nominal
        class size and the same nominal solver -- the GROUP low-weight instance
        and the PLAIN-INTEGER low-weight instance. They must NOT give the same
        R. If they do, the group solver is exploiting integer structure that a
        real attacker does not have, most likely through a filter that reads
        something other than the group element, and every group-arm number is
        void. This is the collision the record hunts and the one a rushed
        implementation would produce by accident.
    constructive_transforms:
      - transform: telescoping_potential
        proposed_object: >-
          Charge the whole re-randomisation family to one global budget: per
          attempt cost T(W) against inverse success probability n/|W|, exactly
          the exemplar's bookkeeping, with the promise class as the randomised
          location of the unstable increment.
        predicted_gain: >-
          Collapses an open-ended family to one dimensionless ratio, and makes
          the exemplar's non-portability a computation rather than an intuition.
      - transform: representation_reduction
        proposed_object: >-
          Move the low-weight promise from the group to the plain-integer
          subset-sum model where the representation technique is known to work,
          and identify exactly the interface that fails to transfer: the
          partial-sum filter. Encoding: exact. Completeness: exact.
          Soundness: LOST at the filter, and the loss is delegated to the
          measurement rather than assumed.
        predicted_gain: >-
          Localises the whole question to one named object -- a sum-compatible
          filter -- which the program has already studied in another lane, so
          either the cascade closes this family or the earlier lane's closure is
          in tension with a new measurement.
    quantifier_order: >-
      BALANCE LAW: FOR ALL n prime, FOR ALL W contained in Z/n, FOR ALL solvers
      A with promise W and cost T(W), the shift-and-scale wrapper around A has
      expected cost exactly T(W) * n / |W| on a uniform instance. The solver is
      quantified INSIDE, so the law constrains a family and not one algorithm.
      THE WEAKER READING NOT CLAIMED: that T(W) >= sqrt(|W|) for all W -- that
      is an empirical regularity of the KNOWN classes, it is the very thing the
      measurement probes, and treating it as a theorem would make the record
      unfalsifiable.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: 'for the declared promise classes, the declared solvers, the
        declared filters and the tested sizes, the measured ratio R was [these
        numbers] with [this] slope in log |W|, against [these controls]'. It can
        NEVER certify that no promise class has R < 1, because that quantifies
        over all classes and all solvers; and no outcome here bears on the
        ECDLP's hardness.
      nearby_object_control: >-
        The nearby object where the hoped-for conclusion FAILS is the
        PLAIN-INTEGER low-weight instance, where R < 1 is expected to be
        achievable by the representation technique. A method that cannot
        distinguish the integer instance from the group instance has not
        identified the load-bearing structure, which is the availability of a
        sum-compatible filter. This is the same fixture as the separating
        control, used in the opposite direction.
    proof_obligations:
      - claim: >-
          a*x + b is uniform on Z/n for uniform (a, b) with a invertible, for
          every fixed x including 0.
        responsibility: correctness
      - claim: >-
          The expected number of attempts is exactly n/|W| and attempts are
          independent.
        responsibility: success_probability
      - claim: >-
          T(W) is charged in group operations including list construction.
        responsibility: runtime
      - claim: >-
          The vacuous and interval slices reproduce rho and kangaroo within the
          stated factors.
        responsibility: baseline
      - claim: >-
          The group-arm filter reads only the group element, never the integer
          exponent or the instance's known randomiser.
        responsibility: interface
      - claim: >-
          Any instance-independent representation covering all of Z/n has at
          least n witnesses.
        responsibility: size
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: >-
      The promise class W, a subset of the exponent group, carried as a
      restriction on the input distribution; concretely the low-Hamming-weight
      class W(l, w) and the interval class.
    lossiness: >-
      The lossy-projection test applies in a MODIFIED form and the modification
      is stated rather than glossed. A promise class is not a projection of the
      state, so section 2 of docs/inventor-protocol.md does not apply verbatim;
      the analogous question is whether the promise DISCARDS instances
      compatibly with the free operations, and it does: the shift-and-scale
      group acts transitively on Z/n, so any class can be moved onto any
      instance, which is exactly what makes the law an identity rather than an
      inequality. What the class discards is the n - |W| instances it cannot
      solve, and the discard is charged in full as the factor n/|W|. A promise
      class whose discard were NOT charged would be the failure mode here, and
      it is the one this design guards against by charging list construction.
    propagation: >-
      Not applicable in the one-step sense: the object is not followed through
      the group law. What is followed is the attempt-to-attempt budget, and its
      one-step behaviour is the geometric law with parameter |W|/n, which is
      exact.
    survival_score: >-
      The class survives arbitrarily many re-randomisations by construction.
      What dies is the ADVANTAGE, at exactly the point where R reaches 1, and
      the measurement's job is to find whether any declared class holds R below
      1 as its size grows.

  null_object_control: >-
    NULL-1, THE MATCHED RANDOM CLASS (blocking, primary). Replace W(l, w) by a
    uniformly random subset of Z/n of the same size and solve it by the only
    method available for an unstructured class, plain rho on the whole group,
    charging the same accounting. R must come out at n^{1/2}/sqrt(|W|), i.e.
    far above 1, confirming that any measured R near 1 is about the class's
    STRUCTURE and not about its size.
    NULL-2, THE FILTER NULL (blocking, and specific to this record). Run
    SOLVER-R with the declared group-element filter replaced by a keyed random
    function of the group element with the same image size. If R is unchanged,
    the filter's algebraic content is doing nothing and the result is about
    bucket counts; if SOLVER-R beats SOLVER-I equally with a random filter, the
    speedup is a bookkeeping artifact of the representation counting and not a
    filter effect.
    POSITIVE CONTROL A (blocking). The interval class with the kangaroo solver:
    R must measure at about 2, flat in |W|. An instrument that cannot reproduce
    the one class whose ratio is known cannot be trusted on the others.
    POSITIVE CONTROL B (blocking, in the other direction). The PLAIN-INTEGER
    arm: SOLVER-R on integer subset-sum instances of the same sizes must show
    R < 1 where the recalled literature says it should. If it does not, SOLVER-R
    is not a representation solver and every group-arm negative is inadmissible;
    the cell is reported UNTESTED rather than closed.
    CONTROL C. The vacuous promise W = Z/n, which must return plain rho's cost
    and R about 0.886, closing the law's own boundary case.

  discriminated_from:
    - >-
      analysis/o2-sum-compatible-filters and KN-FIND-ffe1df. THAT LANE OWNS THE
      FILTER QUESTION and this record does NOT re-propose it. The difference is
      the direction of use: that lane asks whether a sum-compatible filter
      exists; this record supplies the balance law that says what the answer
      COSTS, and identifies a second family -- representation-technique promise
      solvers -- that the same answer governs. If that lane's closure holds, the
      cascade closes this family too, which is a result about coverage rather
      than a new closure. Those files were located and NOT opened, and reading
      them is a blocking obligation before any successor acts on the cascade.
    - >-
      IDEA-20260815-f558e4. Same punchline reached in a different lane: that
      record finds the extremal partitions to be intervals in the discrete-log
      coordinate; the balance law finds the interval class extremal at R = 1.
      The agreement is stated as a consistency check, not as independent
      corroboration, because both trace to the same fact about arithmetic
      progressions.
    - >-
      KN-TECH-015 and the windowed-Coppersmith lane. That lane asks whether
      relations CONCENTRATE in an archimedean window, against an equidistribution
      expectation. This record asks about promise classes on the SCALAR, not
      windows on factor-base coordinates, and its free re-randomisation is the
      exact shift-and-scale action rather than a lattice window. Neither implies
      the other.
    - >-
      IDEA-20260901-863e36, filed in the same session. That record quotients the
      search space by an operation group and its bottleneck is canonicalisation
      cost; this one restricts the input distribution and its bottleneck is a
      promise solver's ratio. They share only the observation that the scale
      action is free, and they are independently falsifiable.
    - >-
      KN-FIND-002 and KN-FIND-b7e091, AUTHORITATIVE BUT CONTESTED as of the
      2026-08-31 review round. NOTHING IN THIS RECORD DEPENDS ON EITHER, and the
      dependence question is answered rather than avoided: the balance law is a
      counting identity, the promise solvers are concrete algorithms measured in
      group operations, and no step uses a generic-group model, a simulability
      argument, or the Shoup bound. Claim (B) explicitly notes that the generic
      bound does NOT transfer to a promise class, so even the contested records'
      subject matter is outside this record's dependency set.

  predictions:
    - metric: >-
        Y1 -- R(W) = T(W)/sqrt(|W|) for the GROUP low-weight class, measured
        over at least three class sizes per l and three values of l, with
        SOLVER-I and SOLVER-R reported separately
      direction: different
      minimum_effect: >-
        PRE-REGISTERED TWO-BRANCH RULE. R at or above 0.9 for SOLVER-R at every
        tested cell, with no downward slope in log |W|, records the CASCADE
        branch: the family is controlled and the sum-compatible-filter closure
        governs it. R at or below 0.7 for SOLVER-R, reproduced at all three
        values of l AND accompanied by a passing integer arm AND not reproduced
        by NULL-2, records the BREAK branch and triggers mandatory independent
        review before any interpretation. Between is INCONCLUSIVE in advance.
        BASIS: pre-registered tolerances anchored on R = 1 for splitting and the
        recalled 2^{0.29 l} against 2^{0.5 l} integer figure; UNTESTED
        EXPECTATIONS, not measurements.
    - metric: >-
        Y2 -- the fitted slope of log R against log |W| in the group arm
      direction: different
      minimum_effect: >-
        A slope statistically indistinguishable from 0 records the cascade
        branch. A NEGATIVE slope is what matters and is the only thing that
        could move an exponent, because a fixed R below 1 changes a constant
        while a negative slope changes the exponent. This distinction is
        pre-registered so that a constant-factor result is not reported as an
        exponent result.
    - metric: >-
        Y3 -- the paired difference R(group arm) minus R(integer arm) at matched
        (l, w)
      direction: higher
      minimum_effect: >-
        Strictly positive and large, on the cascade prediction: the group
        instance should be harder relative to its own class size than the
        integer instance. A difference near zero means the group solver is
        seeing integer structure and every group-arm number is void.
    - metric: >-
        Y4 -- the interval-class calibration, measured T against 2*sqrt(L)
      direction: different
      minimum_effect: >-
        Within a factor of 2 at every tested L. KNOWN-ANSWER CALIBRATION; a miss
        means the cost accounting is wrong and nothing else is interpretable.
    - metric: >-
        Y5 -- the vacuous-promise calibration, measured cost against
        0.886*sqrt(n)
      direction: different
      minimum_effect: >-
        Within a factor of 2. Same disposition as Y4.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): write the balance law with the
      uniformity step and the x = 0 case, and claim (D)'s pigeonhole argument.
      STAGE 1 (hours): implement rho, kangaroo, SOLVER-I and SOLVER-R over toy
      curves with prime subgroup order n at l = 24, 30, 36 bits, with a strict
      group-operation counter that charges list construction.
      STAGE 2 (HARD GATE, minutes to an hour): POSITIVE CONTROL A (interval,
      Y4), CONTROL C (vacuous, Y5) and POSITIVE CONTROL B (integer arm shows
      R < 1). All three must pass or the run set is void.
      STAGE 3 (hours): Y1, Y2 and Y3 over the (l, w) grid, at least 200 random
      instances per cell, with the declared filter fixed in advance.
      STAGE 4 (hours): NULL-1 and NULL-2 on the identical accounting.
      STAGE 5 (only if the BREAK branch fires): re-run at a larger l and stop;
      route to independent review. NO ATTACK on any deployed parameter is run,
      every instance is toy and self-generated, and no live key is involved.
    controls:
      - NULL-1 matched random class solved by rho (blocking)
      - NULL-2 declared filter replaced by a keyed random function (blocking)
      - POSITIVE CONTROL A interval class with kangaroo, R about 2 (blocking)
      - POSITIVE CONTROL B plain-integer arm must show R < 1 (blocking)
      - CONTROL C vacuous promise reproduces rho (blocking)
      - group-operation counter charges list construction (blocking accounting check)
      - static check that the group-arm filter never reads the integer exponent (blocking)
      - exclusion of anomalous and smooth-order toy curves per KN-TECH-034
    required_metrics:
      - T(W) in certified group operations per (l, w, solver), mean and bootstrap CI
      - '|W| computed exactly, and R with its interval'
      - fitted slope of log R against log |W| per l, with residuals
      - paired group-minus-integer R difference per cell
      - NULL-1 and NULL-2 ratios on the identical accounting
      - interval and vacuous calibrations against their closed forms
      - wall-clock and peak memory per stage, and pass or fail of every gate

  falsification_conditions:
    - >-
      G1. The uniformity step fails for some x, most plausibly x = 0. The law is
      misstated and the record is superseded rather than amended.
    - >-
      G2. POSITIVE CONTROL B fails: the integer arm does not show R < 1. SOLVER-R
      is not a representation solver, no group-arm negative is admissible, and
      the cell is reported UNTESTED rather than closed. This is the failure mode
      that would turn this record into a fatigue report, and it is blocking for
      exactly that reason.
    - >-
      G3. Y4 or Y5 misses its closed form. The cost accounting is wrong;
      nothing is reported.
    - >-
      G4. R at or below 0.7 in the group arm with a negative slope in log |W|,
      reproduced at three values of l, absent from NULL-2, and accompanied by a
      passing integer arm. THE BREAK: the cascade of claim (B) is false, a
      promise class with a sub-square-root solver exists on an elliptic curve,
      and by the balance law the exponent question reopens. It would still be no
      attack at cryptographic scale and would require independent replication
      and its own cost table.
    - >-
      G5. R at or above 0.9 with slope 0 everywhere. The predicted outcome: the
      re-randomisation family is closed for the declared classes with a
      mechanism -- the balance law plus the unavailability of a sum-compatible
      filter -- and the honest headline is a controlled null plus an identity
      that makes the closure re-checkable by anyone.
    - >-
      G6. NULL-2 reproduces SOLVER-R's advantage with a random filter. The
      advantage is bookkeeping, not structure; recorded as a controlled null.
    - >-
      G7. Budget exhaustion before the grid resolves. INFRASTRUCTURE outcome
      under AGENTS.md rule 5, never evidence about R.

  confounders:
    - >-
      THE INTEGER LEAK, and it is the dominant risk. A group-arm solver that
      filters on anything derived from the known randomiser (a, b) or from the
      integer expansion is measuring the integer problem. The static check and
      the Y3 separation exist for this and both are blocking.
    - >-
      Toy-scale class fraction. At l = 24 a low-weight class can be a large
      fraction of the group, so the n/|W| factor is small and the wrapper's cost
      is dominated by a single solver run, biasing R downward -- TOWARD a false
      break. Disclosed; the l ladder is the only defence.
    - >-
      Memory. SOLVER-R's lists are larger than SOLVER-I's at equal weight, so a
      cost model counting only group operations flatters it. Peak memory is a
      required metric and any R below 1 must be restated in the fully charged
      parallel model KN-TECH-006 demands before it is called a speedup.
    - >-
      Multiple representations inflate the apparent success rate: a solution
      with many representations is found sooner per unit of list, which is the
      technique's entire point and is legitimate, but the counting must not
      also credit it in the n/|W| factor. Double-counting there is the most
      likely route to a spurious break and the derivation must state where the
      representation multiplicity is charged.
    - >-
      Accidental smoothness of n and the anomalous case at toy scale, excluded
      per KN-TECH-034 before a curve enters the run set.

  interpretation_limits:
    - >-
      The balance law is an identity about a FAMILY of attacks, not a lower
      bound on the ECDLP. It says nothing about attacks that do not
      re-randomise, and it must never be cited as a hardness result.
    - >-
      T(W) >= sqrt(|W|) is an empirical regularity of the known classes and is
      NOT claimed as a theorem; the record exists because it might be false.
    - >-
      The cascade of claim (B) is CONDITIONAL on a closure in another lane that
      this session located but did not open, and whose own red team records
      objections. Any successor must read those files first, and until then the
      cascade is a hypothesis about coverage.
    - >-
      Claim (D) is a portability audit of a template, not a statement about
      what any future ingredient could do. It names a search target -- a
      guaranteed-existence theorem with delta > 0, or a promise class with
      R < 1 -- and naming a target is not declaring the direction impossible.
    - >-
      Toy tier throughout; every number is scoped to the tested l, w, curves,
      solvers, filters and budget, and no transfer to cryptographic n is
      licensed.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For the low-Hamming-weight promise class W(l, w) on a prime-order
        elliptic subgroup, the certified solve cost of the best declared solver
        satisfies T(W) = |W|^{1/2 + o(1)}, uniformly for w between l/8 and l/2.
      rigorous_support: >-
        The rigorous half is the meet-in-the-middle upper bound: splitting the
        weight between a prefix and a suffix gives T at most about sqrt(|W|)
        times a polynomial factor, so the assumption is an assertion that the
        upper bound is TIGHT. The classical distribution statement it imitates
        is the standard birthday heuristic for two lists of group elements with
        no exploitable relation between them -- the same heuristic charged for
        BSGS and for splitting attacks generally. It is refutable on its own
        terms and the BREAK branch is exactly its refutation.
      validation_plan: >-
        SAMPLE: 200 or more random instances per (l, w) cell, l in {24, 30, 36},
        w chosen so |W| spans at least three orders of magnitude per l, with T
        measured as certified group operations to solution and no extrapolation.
        SHORTCUT MAKING SAMPLING FEASIBLE: none needed at these sizes; instances
        are generated with a known scalar so success is verified exactly, and
        the scalar is structurally withheld from every solver code path.
        COMPARISON DISTRIBUTION: the measured T against the closed form
        sqrt(|W|), reported as the ratio R with a bootstrap interval, and
        against the interval-class calibration whose closed form is known.
        TAIL CHECK: the minimum T observed over all instances in a cell against
        the minimum over an equal number of NULL-1 replicates -- a real effect
        must shift the whole distribution, not one lucky instance. TRANSFER
        ASSUMPTION, STATED: validated only for l at most 36 and for the declared
        solvers; nothing is claimed for cryptographic l or for solvers outside
        the declared set.
    - id: H2
      statement: >-
        For a declared statistic v of a group element with image size s, the
        probability that v(A + B) is predictable from (v(A), v(B)) exceeds 1/s
        by at most O(n^{-1/2}) times the statistic's defining degree; hence a
        representation-style filter on group elements gains at most a factor
        1 + O(s * n^{-1/2}) per merge.
      rigorous_support: >-
        The rigorous ingredient is square-root cancellation in character sums
        over the points of an elliptic curve, invoked internally in this corpus
        by IDEA-20260815-f558e4 sub-result (E), composed with the majority-
        advantage expansion written there. THE COMPOSITION IS UNWRITTEN and this
        is genuinely a heuristic. The corresponding closure in
        analysis/o2-sum-compatible-filters is LOCATED AND UNREAD, so it is a
        pointer and not support; H2 is stated here at the tier this session can
        justify, which is heuristic.
      validation_plan: >-
        SAMPLE: for each declared filter, 10^5 sampled pairs (A, B) of group
        elements at each of three field sizes, measuring the empirical
        predictability of v(A + B) from (v(A), v(B)) with the same estimator
        IDEA-20260815-f558e4 uses so the numbers are comparable to that
        record's. COMPARISON DISTRIBUTION: the 1/s baseline and the NULL-2
        keyed-random-filter empirical distribution. TAIL CHECK: the largest
        per-bucket excess against the largest over an equal number of NULL-2
        replicates. DECAY PARAMETER: field size -- the excess must shrink like
        n^{-1/2}; an excess flat in n is an artifact. SAMPLED PARAMETERS
        RECORDED: p, n, s, filter id, seed.

  target_complexity:
    time_exponent: >-
      CONDITIONAL AND CURRENTLY UNINHABITED. If a promise class family existed
      with |W| = n^{1-o(1)} and R(W) = |W|^{-eps}, the balance law gives
      C = n^{1/2 - eps + o(1)} group operations. UNCONDITIONALLY CLAIMED BY THIS
      RECORD: nothing below n^{1/2}. The predicted measurement outcome is R
      about 1 with slope 0, which returns C = n^{1/2+o(1)} exactly, i.e. the
      incumbent.
    memory_exponent: >-
      Solver-dependent and stated because the record would otherwise flatter
      itself: rho and kangaroo are O(1) memory; SOLVER-I at weight w uses memory
      about sqrt(|W|); SOLVER-R uses MORE memory than SOLVER-I at equal weight,
      which is the technique's known cost. Any measured R below 1 that is bought
      with memory must be restated on the van Oorschot-Wiener curve before it is
      called an improvement, and the fully charged parallel comparison
      KN-TECH-006 demands is mandatory at that point.
    best_known: >-
      Parallel Pollard rho with distinguished points and the negation map at
      about 0.886*sqrt(n) group operations serial, about sqrt(n)/m wall clock on
      m processors, small per-processor memory (KN-TECH-006); Pollard kangaroo
      at about 2*sqrt(L) for an interval promise of length L; BSGS at 2*sqrt(n)
      time and sqrt(n) memory; Pohlig-Hellman fixing n as the largest prime
      factor (KN-TECH-030); splitting attacks at about sqrt of the class size
      for the low-weight promise.
    hidden_overhead: >-
      The conditional exponent hides (i) the polynomial factors in the splitting
      and representation solvers, which at toy l are NOT negligible and are
      reported explicitly rather than absorbed; (ii) the memory blow-up above;
      (iii) the assumption that attempts are independent, which is exact here
      only because the re-randomisation is exactly uniform. Nothing is hidden in
      an o(1) that is not named.
    tradeoff_note: >-
      The balance law is itself a tradeoff statement: it converts any promise
      solver's cost curve into a whole-problem cost curve, and it shows that
      trading class size against solver cost is a zero-sum exchange precisely
      when R is constant. That is the sharpest form of the negative result and
      it is also what makes the positive branch worth testing.

  dominated_by: >-
    AS AN ATTACK: mounts none. Dominated on every axis by every row of the
    prime-field frontier, checked row by row. (1) Parallel rho with
    distinguished points and negation, 0.886*sqrt(n) operations, O(1) memory per
    processor, linear parallel speedup (KN-TECH-006): dominates on time and
    memory. (2) BSGS, 2*sqrt(n) time, sqrt(n) memory: dominates on time,
    dominated on memory. (3) Pollard kangaroo on an interval promise: not
    comparable, it solves a different problem, and it appears here as the
    record's own positive control at R about 2. (4) Automorphism-discounted rho
    (KN-TECH-018): dominates by up to sqrt(6). (5) Pohlig-Hellman (KN-TECH-030):
    not comparable, it fixes which n is at issue. (6) Generic preprocessing at
    S*T^2 = n: dominates on online time, dominated on advice; note the balance
    law does not apply to it, since advice is not re-randomisation. Data and
    query axis: no oracle queries are issued and no solve beyond toy calibration
    is produced. AS A STRUCTURAL CONTRIBUTION the nearest incumbent is the
    o2-sum-compatible-filters lane, which dominates on depth in the filter
    question and is dominated here on the range of attack families its answer
    governs -- a claim that is CONDITIONAL on reading those files, which this
    session did not.
  sota_delta: >-
    +0 on time, +0 on memory, +0 on data/queries, +0 on the constant factor, in
    the predicted outcome. Quantified deltas actually claimed: (i) an identity
    C(W) = T(W) * n / |W| that reduces an open-ended family to one dimensionless
    ratio, at zero compute, and reproduces rho and kangaroo as its two boundary
    slices; (ii) a portability audit of the program's own exemplar template
    with the missing ingredient named quantitatively -- delta = 0 versus the
    exemplar's 1/3, and delta = 0 forced by pigeonhole for every
    instance-independent representation; (iii) a measured ratio curve R against
    |W| over three class-size decades at three field sizes, with two nulls, two
    blocking positive controls and a group-versus-integer separation, at an
    estimated few CPU-hours. If the BREAK branch fired with a negative slope
    eps, the delta would be n^{1/2} to n^{1/2 - eps} at a memory cost that would
    have to be restated on the van Oorschot-Wiener curve. The honest prior on
    that is low and is stated below.

  estimated_cost:
    implementation: high
    compute: medium
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.97 that the balance law is correct as stated; the residual is the x = 0
    and non-invertible-a bookkeeping. 0.9 that claim (D)'s pigeonhole argument
    survives review. 0.55 that SOLVER-R can be implemented well enough to pass
    POSITIVE CONTROL B within budget -- this is the record's real risk and the
    reason its implementation cost is HIGH and its priority only MEDIUM.
    OUTCOME split: 0.72 cascade branch (R about 1, slope 0), 0.05 break branch,
    0.23 inconclusive or instrument failure on the integer arm. The most likely
    honest headline is 'the re-randomisation family is one identity wide, its
    incumbent members sit exactly at the balance point, and the low-weight
    class does not leave it on an elliptic curve'.

  yaml_parse_disclosure: >-
    NO INTERPRETER WAS AVAILABLE TO THE AUTHORING SESSION and this file was NOT
    machine-parsed by its author; the Coordinator ran the strict parse, it
    FAILED once, and the defect is recorded here so the next author does not
    repeat it. HYGIENE APPLIED: every multi-line value is a folded block scalar,
    so embedded colons and quotation marks cannot break the parse; no key is
    duplicated within a mapping; no block-sequence item carries a bare mapping
    key. THE CLASS THAT WAS MISSING FROM THAT CHECKLIST AND THAT ACTUALLY BROKE
    THE PARSE: a PLAIN scalar whose FIRST character is a YAML indicator --
    '|', '>', '&', '*', '!', '%', '@', or a backtick. A leading '|' or '>' is
    read as a block-scalar header, after which the parser demands a chomping or
    indentation indicator, so the plain sequence item beginning '|W| computed
    exactly ...' failed at the 'W'. Cardinality bars are the obvious trap in a
    record whose spine is the ratio R(W) = T(W)/sqrt(|W|). THE FIX IS TO
    SINGLE-QUOTE THE WHOLE SCALAR, never to reword it around the parser. Two
    positions are SAFE and need no quoting, and were left alone: an indicator
    anywhere other than position one of a plain scalar, and an indicator
    anywhere at all inside a folded block scalar, where it is ordinary text.
    The orchestrator must still run the strict parse and
    tools/validate_ledger.py; a parse claim is not made here.

