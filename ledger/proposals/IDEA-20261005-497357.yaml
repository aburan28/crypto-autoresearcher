idea:
  id: IDEA-20261005-497357
  question_id: RQ-DRINF-6b5a9d
  added: '2026-10-05'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Isogeny-class count of the six rank-2 Drinfeld modules over F_3
    of characteristic (T), by Frobenius characteristic polynomial,
    against the formula in the title-level note KN-LIT-174.
  class: measurement
  claim: >-
    Let q = 3 and let the six modules be Phi_T = g tau + Delta tau^2
    with g in F_3 and Delta in F_3 nonzero, at A-characteristic (T).
    Let N_enum be the number of distinct monic Frobenius characteristic
    polynomials found by exhaustive search of additive-polynomial
    relations, and let N_formula be the number produced by the
    isogeny-class formula once it is read from the local PDF of
    KN-LIT-174. Those two integers are equal. Each rank-2 polynomial
    has degree 2. The rank-1 Carlitz reduction is not in the set. The
    number N_j of distinct j-invariants, using the j formula from that
    same PDF, is at least N_enum. This count is not a torsion
    cardinality and not an ECDLP exponent. Explicit class field theory
    of Hayes is the recalled organising theorem and is not constructed.
  mechanism: >-
    Explicit class field theory and isogeny-class count, not the
    period lattice. KN-LIT-174's abstract, title-level, says the
    characteristic polynomial of a rank-2 Drinfeld module is used to
    calculate the number of isogeny classes, by analogy with elliptic
    curves. Two procedures on the same six modules either return the
    same integer or they do not. Equality means the formula and the
    enumeration describe one partition at this field. Inequality means
    the PDF formula and the relation search disagree, so one of them
    is not the count the abstract names. A separate outcome: N_j > N_enum
    means at least two j-invariants share a polynomial, which is the
    elliptic shape "several curves in one isogeny class"; N_j = N_enum
    means that shape is invisible on these six modules. Hayes,
    recalled and not opened, generates class fields from j-invariants
    of rank-1 or CM rank-2 modules. This test does not build that
    extension. It counts classes. The torsion computation of
    IDEA-20261005-474802 is a different mechanism and is not repeated.
    LOSSY-PROJECTION TEST. Operation set Sigma is isogeny of Drinfeld
    modules, not translation. The map sending a module to its
    Frobenius characteristic polynomial discards (g, Delta) and keeps
    the polynomial. Compatible with Sigma only if isogenous modules
    share the polynomial, which is the statement under test, not an
    assumption used to skip the test. Lossy when N_j > N_enum: two
    j-invariants collapse to one polynomial, so the map is not a
    coordinate change on the set of six modules. If N_j = N_enum the
    map is bijective on this set and the lossy clause fails here; that
    outcome is recorded rather than repaired.
  novelty_status: unverified
  citations:
    - ref: KN-LIT-174
      provenance: internal
      claim: >-
        Title-level note only; abstract thin; PDF not opened. The
        abstract says the characteristic polynomial of a rank-2
        Drinfeld module over a finite field is used to calculate the
        number of isogeny classes, and it discusses the endomorphism
        ring and an Euler-Poincaré characteristic. No count is given.
        The note's author and title lines were parsed heuristically.
      verified_by: idea-generator, this session, via knowledge/literature/KN-LIT-174.md
    - ref: KN-LIT-1515
      provenance: internal
      claim: >-
        Title-level note only; abstract thin; PDF not opened. States
        elliptic analogies, rank, Anderson motives, and SageMath
        implementations. Not the source of the class-count formula.
      verified_by: idea-generator, this session, via knowledge/literature/KN-LIT-1515.md
    - ref: Hayes explicit class field theory for F_q[T]
      provenance: recalled
      claim: >-
        Recalled pointer, not opened: class fields of orders over
        F_q(T) are generated by torsion or j-invariants of Drinfeld
        modules. This idea does not construct a class field.
      verified_by: null
    - ref: Tate 1966 isogeny theorem for abelian varieties over finite fields
      provenance: recalled
      claim: >-
        Recalled pointer, not opened: the elliptic analogy that
        isogeny classes are separated by the Frobenius characteristic
        polynomial. The Drinfeld case is what KN-LIT-174 claims and
        what this test checks at q = 3. Not support.
      verified_by: null
  assumptions:
    - The six pairs (g, Delta) are the full list at q = 3 with Delta nonzero.
    - The Frobenius of F_3 is tau.
    - Degree 2 is the elliptic-analogy prediction for the rank-2 polynomial. If the PDF defines a polynomial of another degree, that degree is the result and the prediction fails.
    - j is whatever normalised invariant the PDF defines. No recalled formula for j is used as input.
  predictions:
    - metric: absolute difference |N_formula - N_enum|
      direction: different
      minimum_effect: 0
    - metric: degree of each rank-2 characteristic polynomial
      direction: different
      minimum_effect: 2
    - metric: N_j - N_enum
      direction: different
      minimum_effect: 0
  minimal_test:
    design: >-
      Read downloads/0412367v3.pdf, the local copy named by
      KN-LIT-174, until the characteristic polynomial, the isogeny-class
      formula, and the j-invariant are defined. The markdown does not
      contain them. Independently, for each of the six modules, search
      additive-polynomial relations for the monic polynomial of least
      degree satisfied by tau, up to the degree bound stated in the
      PDF. Count distinct polynomials and distinct j-invariants.
      Apply the PDF formula to the same six modules. Compare the
      integers. Exclude the rank-1 module Psi_T = tau from the count
      and record its polynomial degree as a control. Do not compute
      |Phi[T+1]|.
    controls:
      - The Carlitz reduction must not be assigned one of the six rank-2 polynomials.
      - Two runs of the relation search, one with the PDF degree bound and one with that bound plus 1, must return the same minimal polynomials. A change means the bound was tight and the search was incomplete.
      - Swapping the labels of two modules with the same (g, Delta) is impossible; the control for double-counting is the set size 6 before any quotient.
    required_metrics:
      - N_formula
      - N_enum
      - degree_of_each_rank2_polynomial
      - N_j
      - carlitz_polynomial_degree
  falsification_conditions:
    - "|N_formula - N_enum| is at least 1."
    - A rank-2 polynomial has degree other than 2.
    - N_j < N_enum. One isomorphism class would then carry two characteristic polynomials, and the polynomial is not a class invariant on this set.
    - The PDF contains no isogeny-class formula. The enumeration still records N_enum, and the agreement prediction is withdrawn rather than replaced by a recalled formula.
  confounders:
    - Isomorphism over F_3 can identify modules before isogeny does. N_j counts the PDF's j, not a recalled normal form.
    - An incomplete degree bound undercounts relations and can split one class into several polynomials. The bound-plus-one control catches that.
    - Supersingular and ordinary modules may be listed together. The test does not drop either. A later split by height would be a different idea.
  interpretation_limits:
    - Equality at q = 3, m = 1, six modules. No asymptotic class-number formula.
    - Hayes is not opened and no class field is built.
    - Not an attack claim. No ECDLP exponent is in scope. The torsion sizes 9 and 3 are not this idea's result.
  heuristic_assumptions:
    - id: HA-1
      statement: >-
        Two rank-2 Drinfeld modules over this finite field lie in the
        same isogeny class if and only if their Frobenius characteristic
        polynomials agree. This imitates Tate's isogeny theorem for
        elliptic curves over finite fields. The sample is the six
        modules at q = 3, characteristic (T). No transfer to larger m
        is claimed.
      rigorous_support: >-
        KN-LIT-174's abstract says the characteristic polynomial is
        used to calculate the number of isogeny classes. The proof was
        not opened. The classical theorem imitated is Tate 1966,
        provenance recalled, not opened. The finite check is agreement
        of N_formula with N_enum, together with N_j >= N_enum.
      validation_plan: >-
        Enumerate all six modules. Compare the PDF formula's count
        with the relation-search count. Record N_j - N_enum. The
        Carlitz degree is the nearby-object control and must not equal
        a rank-2 degree if the degree prediction holds. No sample
        beyond these six.
  target_complexity:
    time_exponent: >-
      Polynomial in q and in deg(T). Named values q = 3, deg(T) = 1,
      and 6 modules. No sub-rho claim.
    memory_exponent: >-
      O(1) coefficients per polynomial, six polynomials, each predicted
      of degree 2.
    best_known: >-
      No ECDLP exponent is in scope. Opened baseline KN-LIT-174 states
      that a count exists and gives no integer for these six modules.
    hidden_overhead: >-
      The PDF read is a one-time cost and is not an asymptotic term.
      The enumeration itself has no o(1) overhead.
    tradeoff_note: No time-memory tradeoff. All six modules are stored.
  estimated_cost:
