idea:
  id: IDEA-20260806-b7fdc3
  question_id: RQ-SSI-001
  added: '2026-08-06'
  title: >-
    A NEW ALGEBRAIC INVARIANT THIS CORPUS ALREADY OWNS AND HAS NEVER USED:
    the oriented self-pairing of Castryck-Houben-Merz (KN-LIT-7489) is a
    computable, orientation-sensitive invariant whose order is FORCED to divide
    the orientation discriminant -- so it is a zero-compute admissibility screen
    over every surviving supersingular assumption, and the screen has never been
    run in this program
  class: mechanism

  claim: >-
    (A) THE GAP. KN-LIT-7489 (Castryck, Houben, Merz, "Weak instances of class
    group action based cryptography via self-pairings") has been in this
    program's literature corpus since 2026-07-24 with citation_verified: read.
    A grep of ledger/proposals and ledger/hypotheses for "self-pairing" returns
    ZERO records. The only self-pairing statement anywhere in the ledger is
    ledger/REVIEW-H100-20260717.md line 146, "H050 (no self-pairing on generic
    E) -- sound -- embedding-degree argument is standard and correctly stated",
    which closes the PLAIN PRIME-FIELD ECDLP case by an embedding-degree
    argument and says nothing whatever about ORIENTED supersingular curves,
    which is the setting KN-LIT-7489 is actually about. So the program closed a
    self-pairing question in one setting and then never asked it in the setting
    where the published answer is non-trivial. That is the failure mode
    docs/inventor-protocol.md section 4 names: a closure in scope A quietly
    read as a closure in scope B.

    (B) THE INVARIANT, AND WHY IT IS AN INVARIANT RATHER THAN A COORDINATE.
    Let E be an elliptic curve with an O-orientation iota: O -> End(E) for an
    imaginary quadratic order O of discriminant Delta_O. KN-LIT-7489's abstract
    (quoted in the corpus entry) states: a non-trivial self-pairing with cyclic
    domain that is COMPATIBLE WITH ISOGENIES between O-oriented curves has order
    m satisfying m | Delta_O (with the stated 2-adic refinements 2m | Delta_O
    when 4 | Delta_O and 4m | Delta_O when 8 | Delta_O), and m is not a multiple
    of the characteristic. Two consequences, and only the second is a research
    claim:
      - FORCED VALUE (derivation, zero compute): for any candidate cyclic
        subgroup of order m with m NOT dividing Delta_O, the isogeny-compatible
        self-pairing on it is trivial. This is the null control the inventor
        protocol demands, and it is available before any experiment: an
        implementation that reports a non-trivial pairing on such a subgroup is
        broken, not interesting.
      - RESEARCH CLAIM: the map "assumption -> (does its public data expose a
        cyclic subgroup of order m > 2 with m | Delta_O, together with the
        O-orientation needed to define the pairing?)" is a COMPUTABLE, CHEAP
        SCREEN, and running it across every surviving supersingular assumption
        in this program's scope has never been done. This proposal is that
        screen plus the toy-scale instrument that makes its verdicts checkable.

    (C) WHY THE INVARIANT IS LOSSY IN THE PROTOCOL'S SENSE, WHICH IS THE POINT.
    A self-pairing sends one point to a root of unity; it forgets almost
    everything about the point and retains only a residue in a group of order
    m | Delta_O. Under docs/inventor-protocol.md section 2 that is a genuine
    lossy projection, not a change of coordinates: the fibre over a pairing
    value has size |domain|/m, which is enormous whenever m is a small divisor
    of Delta_O. What survives is exactly a divisor-of-Delta_O worth of
    information about the ORIENTATION -- and orientation is the secret in
    exactly the class-group-action assumptions this program tracks
    (KN-OPEN-014, KN-TECH-027).

    (D) WHAT THIS IS NOT. It is NOT a claimed break of CSIDH, SQIsign, or CGL.
    It is NOT a claim that KN-LIT-7489's theorem extends beyond oriented curves.
    It is NOT an exponent-moving proposal, and the target_complexity block below
    says so in those words. It is a screen whose most likely outcome is
    "no surviving assumption in scope exposes the required data", which is a
    scoped closure with a named obstruction (the m | Delta_O divisibility
    constraint plus the orientation-availability constraint) and forward
    guidance, and which is worth having precisely because the program currently
    has neither.

  discriminated_from:
    - >-
      H050 / ledger/REVIEW-H100-20260717.md line 146. That entry closes
      "no self-pairing on generic E" by an EMBEDDING-DEGREE argument for plain
      prime-field ECDLP. The oriented supersingular setting has a different
      pairing (compatible with isogenies between oriented curves), a different
      order constraint (m | Delta_O, not the embedding degree), and a published
      non-trivial answer. This proposal explicitly does NOT reopen H050 for
      generic prime-field E, and predicts H050 stays correct in its own scope.
    - >-
      KN-TECH-032 (pairing transfers, MOV / Frey-Ruck). Those transfer a DLP
      from E to a finite field via a NON-degenerate bilinear pairing between
      DISTINCT arguments, and are governed by the embedding degree. A
      self-pairing is a quadratic map on a single cyclic group and is governed
      by the orientation discriminant. Different object, different constraint,
      different failure mode.
    - >-
      IDEA-20260725-002 (effective orientation from a known small-degree
      endomorphism). That proposal asks whether a KNOWN small endomorphism
      accelerates path-finding against KN-TECH-050 baselines. It uses the
      orientation as a search accelerator. This proposal uses the orientation as
      the DOMAIN of a computable invariant, and its deliverable is an
      admissibility table, not a path-finding speedup.

  object_first_candidate:
    tracked_object: >-
      THE ISOGENY-COMPATIBLE SELF-PAIRING VALUE: for an O-oriented curve E and a
      cyclic subgroup C of order m | Delta_O, the element s(E, C) in mu_m
      obtained from the KN-LIT-7489 construction. It is followed through
      horizontal isogenies (the class-group action), which is the computation
      the surviving assumptions actually perform.
    lossiness: >-
      LOSSY. The fibre over a value has size |C-choices| / m; the map forgets
      the point entirely and retains a residue mod m. Section 2 of the inventor
      protocol is satisfied non-vacuously, and the reason it is satisfied is
      that the pairing is a quadratic form, not a bijection.
    propagation: >-
      DETERMINISTIC UNDER THE HORIZONTAL (CLASS-GROUP) ACTION, by the paper's
      own compatibility statement -- which is what "compatible with isogenies
      between oriented curves" means. Under the FULL isogeny graph action
      (vertical / non-O-preserving steps) propagation is NOT claimed and must
      not be assumed. Recording this split is mandatory: it is precisely the
      Class I "partial action" cell of IDEA-20260806-c5d183's trichotomy, and
      the partial action here is the class group, not a factor base.
    survival_score: >-
      Survives every horizontal step by construction. Dies at any step that
      changes the orientation. Dies immediately if m does not divide Delta_O
      (forced value, zero compute) -- which is the null and is what makes the
      screen able to fail.

  mechanism: >-
    STEP 1 -- RE-READ BEFORE ANY COMPUTE. knowledge/literature/KN-LIT-7489.md
    carries only a Contribution paragraph. Its exact hypotheses (which orders,
    which cyclic domains, what "compatible with isogenies" quantifies over,
    whether the pairing is computable in polynomial time given the orientation)
    are NOT in this corpus and are NOT assumed here. Stage 0 of the minimal test
    is to obtain and read the primary text and write the exact criterion into a
    knowledge entry. If the criterion turns out to require data no surviving
    assumption publishes, the proposal ends at Stage 0 at zero compute, and that
    is a legitimate and cheap outcome.

    STEP 2 -- THE FORCED-VALUE CONTROL, DERIVED BEFORE MEASURING. From the
    stated divisibility m | Delta_O: pick any m coprime to Delta_O. The
    isogeny-compatible self-pairing on a cyclic group of that order must be
    trivial. This is a contrast whose correct value is known in advance, so the
    instrument can fail -- which is the KN-TECH-1a5b7e / KN-TECH-6c0e15 null
    sufficiency requirement, and it is the reason this proposal has a control at
    all rather than a demonstration.

    STEP 3 -- THE SCREEN. For each surviving assumption A in this program's
    scope, record five fields: (i) is there an orientation, and by which order
    (CSIDH: O = Z[sqrt(-p)] or its order of discriminant -4p; SQIsign: the curve
    is not O-oriented by public data; CGL: no orientation published); (ii)
    Delta_O and its divisors; (iii) does the public data of A expose a cyclic
    subgroup of order m > 2 with m | Delta_O; (iv) is the orientation
    efficiently EVALUABLE on that subgroup, since the pairing needs the
    endomorphism to act, not merely to exist; (v) verdict: EXPOSED /
    NOT_EXPOSED / UNDETERMINED_PENDING_PRIMARY_TEXT. Field (iv) is the one that
    most plausibly kills every row, and it is stated up front so the screen
    cannot be scored as a success by omitting it.

    STEP 4 -- THE TOY INSTRUMENT. At small p, construct oriented supersingular
    curves with known small-discriminant orientations, implement the pairing per
    the primary text, and check three things in order: the positive control (a
    curve and subgroup where the paper's own criterion says the pairing is
    non-trivial must return a non-trivial value), the forced-value null
    (m coprime to Delta_O must return 1), and the compatibility law (walking one
    horizontal step must transport the value by the law the paper states). Any
    of the three failing halts the line before a single verdict is reported.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      grep -ril over ledger/, knowledge/, docs/ for "self-pairing", "self
      pairing", "Castryck", "oriented", and cross-check of KN-TECH-024..029 and
      KN-TECH-050/051, performed 2026-08-06 against merge-base 0c856274.
    results: >-
      "self-pairing" occurs in exactly six files: knowledge/sources.json,
      knowledge/INDEX.md, knowledge/SOURCES.md (all generated or index files),
      knowledge/literature/KN-LIT-7489.md and KN-LIT-1400.md (literature notes),
      and ledger/REVIEW-H100-20260717.md (the H050 line, prime-field ECDLP
      scope). ZERO proposals, ZERO hypotheses, ZERO experiments, ZERO findings.
      "Castryck" occurs in IDEA-20260805-c4ae3d and H-SQISIGN-c0488f, neither of
      which concerns self-pairings.
    verdict: >-
      ADAPTATION, not a new conjecture. The mathematics is published and is
      already in this corpus. What is new is that no record in this program has
      ever pointed a proposal at it, and the screen it licenses has never been
      run. The novelty claim is about THIS PROGRAM'S COVERAGE and is stated as
      such; no claim of novelty against the external literature is made, and the
      primary text has NOT been read in this session.

  null_object_control: >-
    TWO NULLS, BOTH FORCED BEFORE MEASUREMENT. (1) ARITHMETIC NULL: a cyclic
    subgroup whose order m is coprime to Delta_O. Correct value: trivial
    pairing. (2) STRUCTURE-DESTRUCTION NULL: a supersingular curve with NO
    O-orientation supplied (only j published, as in CGL). Correct value: the
    construction has no input, so the screen must return NOT_EXPOSED, and any
    implementation that returns a value has invented an orientation. Reporting
    any positive result without both nulls having run and passed is prohibited.

  assumptions:
    - >-
      KN-LIT-7489's stated divisibility constraint is correctly transcribed in
      the corpus entry. NOT verified in this session; Stage 0 verifies it.
    - >-
      Evaluating the pairing requires the orientation to be efficiently
      computable on the relevant torsion, not merely to exist abstractly. Stated
      as an assumption because it is the field most likely to make every row of
      the screen NOT_EXPOSED.
    - >-
      "Surviving assumption" means the post-SIDH set already scoped in
      RQ-SSI-001: CGL path-finding, SQIsign's endomorphism-ring foundation, and
      the CSIDH class-group action. No claim is made about schemes outside that
      set.

  proof_search_map:
    bottleneck: >-
      Whether any surviving assumption's PUBLIC data simultaneously supplies
      (a) an O-orientation evaluable on torsion and (b) a cyclic subgroup of
      order m > 2 dividing Delta_O. If no assumption supplies both, the
      invariant is real mathematics with no attack surface in this scope.
    baseline_embedding:
      parameter_slice: >-
        m = 1 or 2 reproduces the trivial/known case and must return the trivial
        pairing; this is the exact old-method boundary and the regression
        fixture.
      reproduction_check: >-
        Frozen fixture at the smallest declared p: the m | Delta_O criterion
        evaluated symbolically for every divisor of Delta_O, compared against
        the implementation's verdict for every divisor. Exact integer
        comparison, no tolerance.
    observation_collision:
      observable: >-
        The self-pairing value s(E, C) in mu_m.
      distinct_preimage_search: >-
        MANDATORY AND EXPECTED TO SUCCEED: since the map is lossy by
        construction, two oriented curves in the same class-group orbit with
        different secret ideals will frequently share a pairing value. The
        search is therefore not a falsifier of the invariant but a MEASUREMENT
        of its resolution: the collision rate directly bounds how many bits of
        the secret the invariant can ever supply, and that bound is the honest
        ceiling on any attack built from it. Report the measured rate against
        the 1/m prediction.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          The self-pairing value together with its transport law under the
          horizontal action -- i.e. the pair (value, class-group cocycle),
          preserving more state than a single value because the cocycle is what
          survives composition.
        predicted_gain: >-
          At most log2(m) bits of the secret ideal class per exposed subgroup,
          m | Delta_O. For CSIDH-512 with Delta_O = -4p, p a 512-bit prime, the
          divisors of Delta_O available at small m are 1, 2, 4 and the divisors
          of p, so the predicted gain is AT MOST 2 bits unless p itself has
          exploitable structure. THIS IS A SMALL NUMBER AND IT IS STATED
          UP FRONT: the honest prior is that the screen returns NOT_EXPOSED.
    quantifier_order: >-
      FOR ALL surviving assumptions A, FOR ALL orientations O admitted by A's
      public data, FOR ALL cyclic subgroups C of order m exposed by A's public
      data, IF m | Delta_O AND the orientation is evaluable on C, THEN a
      non-trivial isogeny-compatible self-pairing exists on C. The witness
      (the pairing) is allowed to depend on (A, O, C); no uniformity over
      assumptions is claimed, and the screen is therefore per-row.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Assumption A exposes a computable invariant leaking at most log2(m)
        bits about the orientation, m | Delta_O." It can NEVER certify a full
        key recovery, because the invariant's fibre is of size |domain|/m.
      nearby_object_control: >-
        A supersingular curve with NO orientation (plain CGL vertex). The method
        must return NOT_EXPOSED there. If the implemented screen reports a
        non-trivial invariant for an unoriented curve, it is not tracking
        orientation and the whole line is withdrawn.
    proof_obligations:
      - claim: The m | Delta_O constraint as transcribed matches the primary text.
        responsibility: baseline
      - claim: The pairing is evaluable in time poly(log p, m) given the orientation.
        responsibility: runtime
      - claim: The transport law under one horizontal step holds as implemented.
        responsibility: correctness
      - claim: Collision rate matches 1/m, bounding extractable bits.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        number of surviving assumptions in RQ-SSI-001 scope with verdict EXPOSED
      direction: different
      minimum_effect: >-
        Stated prior: 0 of 3. A single EXPOSED row is a material result and
        would justify a follow-on experiment; 0 of 3 with all five fields filled
        is a scoped closure. Both outcomes are reportable and the record commits
        to reporting either.
    - metric: >-
        self-pairing value on a cyclic subgroup of order m coprime to Delta_O
      direction: different
      minimum_effect: >-
        Exactly trivial, with zero exceptions across all tested (p, m). Any
        exception halts the line as an instrument failure.
    - metric: >-
        collision rate of the pairing value across distinct secret ideal classes
      direction: different
      minimum_effect: >-
        Within a factor 2 of 1/m. A rate materially below 1/m would mean the
        invariant separates more than the divisibility bound allows and is the
        one observation that would make this line exponent-relevant.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): obtain and read KN-LIT-7489 primary text; write
      the exact criterion, its hypotheses, and its computability statement into
      a new knowledge/techniques entry. Halt here if the criterion needs data no
      assumption in scope publishes.
      STAGE 1 (minutes): build O-oriented supersingular curves at p in
      {103, 251, 419, 1019} with small-discriminant orientations constructed by
      CM, using two independent constructions that must agree exactly on the
      vertex set.
      STAGE 2 (minutes, HARD GATE): run the positive control, the arithmetic
      null (m coprime to Delta_O -> trivial), and the unoriented-curve null.
      All three must pass before any verdict is looked at.
      STAGE 3 (minutes): measure the collision rate against the 1/m prediction
      and the transport law under one horizontal step.
      STAGE 4 (zero compute): fill the five-field screen table for CGL, SQIsign
      and CSIDH and record every UNDETERMINED with the exact missing fact.
    controls:
      - arithmetic null - m coprime to Delta_O must give the trivial pairing
      - unoriented-curve null - screen must return NOT_EXPOSED with no value
      - >-
        positive control - a curve/subgroup pair the primary text's own
        criterion says is non-trivial must return non-trivial
      - >-
        two independent constructions of the supersingular vertex set must agree
        exactly before any pairing is computed
    required_metrics:
      - per-(p, m) pairing value and its multiplicative order
      - pass/fail of each of the three gate controls
      - collision rate of pairing values across distinct secret classes
      - five-field screen table with an explicit verdict per assumption
      - wall-clock and memory per stage

  falsification_conditions:
    - >-
      Stage 0 finds the transcribed m | Delta_O constraint is wrong or does not
      apply to the setting assumed here. The record is withdrawn by a
      superseding record, not amended.
    - >-
      The arithmetic null returns a non-trivial pairing. Instrument failure;
      nothing is reported and the line halts.
    - >-
      The unoriented-curve null returns any value. The screen is not tracking
      orientation; the line halts.
    - >-
      All three surviving assumptions score NOT_EXPOSED with field (iv)
      supplying the obstruction. That is the closure outcome: named obstruction
      (the orientation is not evaluable on published torsion), argument, and
      forward guidance (oriented variants and OSIDH-style schemes that DO
      publish orientation data remain open and are the successor scope).

  confounders:
    - >-
      Confusing "an orientation exists" with "an orientation is computable from
      public data". Every supersingular curve is oriented by SOME order; the
      screen is about what the ADVERSARY can evaluate. Field (iv) exists to
      catch exactly this and must not be omitted from any reported row.
    - >-
      Toy-scale orientations have small discriminants with many divisors, so the
      EXPOSED rate at p ~ 10^3 will be far higher than at cryptographic p. Toy
      results are hypothesis-generating for the instrument only and may never be
      quoted as evidence about a deployed parameter set.
    - >-
      The corpus entry for KN-LIT-7489 is marked citation_verified: read, but
      KN-OPEN-3f7a21 records that 7457 of 7666 literature entries claim read
      against a downloads tree that has never existed in this repository. That
      mark must not be treated as verification; Stage 0 exists because of it.

  interpretation_limits:
    - >-
      A NOT_EXPOSED verdict closes the exact assumption, parameter set, and
      published-data inventory examined, and nothing else. It is not a hardness
      claim about the underlying problem.
    - >-
      An EXPOSED verdict is a leakage bound of at most log2(m) bits, not an
      attack. Converting it into an attack requires a separate proposal with its
      own full-cost accounting.
    - >-
      Nothing here bears on plain prime-field ECDLP; H050 remains this program's
      standing answer in that scope.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a fixed p and a fixed O-orientation, the self-pairing value
        s(E, C) is distributed as a uniformly random element of mu_m as the
        secret ideal class varies over Cl(O).
      rigorous_support: >-
        The isogeny-compatibility law makes the value a class function on the
        orbit, and the orbit is a torsor under Cl(O); the assumption is that the
        induced map Cl(O) -> mu_m is close to equidistributed, imitating the
        equidistribution of a non-trivial character on a large cyclic group.
        This is an assumption about the induced character, NOT a theorem quoted
        here, and it is the only place a distributional claim enters.
      validation_plan: >-
        At p in {103, 251, 419, 1019} enumerate the full class-group orbit,
        compute the value for every element, and compare the empirical
        distribution with uniform on mu_m by exact multiset counts (the orbits
        are small enough for exact enumeration, so no sampling error is
        involved). Tail check: the most frequent value's multiplicity against
        the uniform prediction |Cl(O)|/m. Toy scale only, and labelled so; no
        crypto-scale distributional claim is made or implied.

  target_complexity:
    time_exponent: >-
      NOT AN EXPONENT PROPOSAL, AND THE TITLE SAYS SO. The screen is O(1)
      analysis per assumption; the toy instrument is seconds. No time exponent
      against any hard problem is claimed or targeted.
    memory_exponent: >-
      Negligible; the largest object is the supersingular vertex set at
      p <= 1019.
    best_known: >-
      For supersingular path-finding the standing baselines are
      KN-TECH-058 (corrected classical figure) and the p^{1/3+o(1)} result in
      inputs/P13-WESOLOWSKI-2026/. This proposal does not compete with them.
    hidden_overhead: >-
      None claimed, because no complexity claim is made. The honest overhead is
      human: Stage 0 requires obtaining a paper this repository does not hold.
    tradeoff_note: >-
      Not applicable. If a row ever scores EXPOSED, the resulting leakage would
      have to be costed against KN-TECH-050/051 memory-charged and quantum cost
      models in a separate proposal before any security claim is made.

  dominated_by: >-
    For the purpose of ATTACKING any assumption in scope: dominated on every
    axis by every existing baseline, because this proposal mounts no attack.
    Checked against the frontier rows this program records for supersingular
    problems: KN-TECH-029/KN-TECH-058 classical path-finding, KN-TECH-050
    memory-charged variants, KN-TECH-051 quantum CSIDH costs, and the
    p^{1/3+o(1)} exemplar. All dominate a screen that produces no algorithm.
    For the purpose of ANSWERING "does this corpus's own self-pairing literature
    have an attack surface in scope": nothing dominates it, because no record in
    this program has ever asked.
  sota_delta: >-
    Zero speedup against any baseline; the deliverable is a five-field
    admissibility table over 3 assumptions plus a toy instrument with 3 gate
    controls, and a leakage ceiling of log2(m) bits with m | Delta_O -- which
    for CSIDH-512 is at most 2 bits absent structure in p. Stated numerically
    because "could leak information" is not a value.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.15 that any surviving assumption in RQ-SSI-001 scope scores EXPOSED. High
    (0.8) that Stage 0-3 produce a working instrument and three passing controls,
    which is what makes the 0-of-3 outcome a closure rather than a fatigue
    report. The value of the record is concentrated in the closure branch.

  id_allocation_provenance: >-
    python3 tools/allocate_id.py --next idea --date 20260806 (random token, no
    state scanned), then --check IDEA-20260806-b7fdc3 returned
    "well-formed and free across the union" before this file was written.

