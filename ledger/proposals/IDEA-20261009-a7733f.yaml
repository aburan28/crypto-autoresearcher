  title: Algebraic factor bases over F_p have about p points (dimension obstruction)
  class: control
  claim: |-
    For every tested algebraic factor base (x in the image of a degree-d map P^1 -> P^1; curves in E x E such as graphs of endomorphisms or Frobenius twists; pullbacks from covers), |F| >= p / (d * O(1)); pushing |F| below p^0.9 requires genus about p^0.4, where the defining equations are themselves exponential-size.
  mechanism: |-
    Index calculus needs |F| <= p^(1/2). Any algebraic condition on the 1-dimensional E cuts out a finite set or a curve, and a curve over F_p has p + O(g sqrt p) points. Over F_{p^n} Weil restriction supplies dimension n and x in F_p is a legitimate half-dimensional condition; over F_p nothing is.
  novelty_status: known
  citations:
  - ref: KN-LIT-7621
    source_text: Hasse-Weil
    provenance: kb
    claim: a curve of genus g over F_p has p + 1 + O(2g sqrt p) points
    verified_by: intake-session-20261009 (coordinator role) opened KN-LIT-7621
  - ref: KN-LIT-003
    source_text: Diem 2011 Weil-restriction index calculus
    provenance: kb
