  confounders:
    - >-
      'Approximately p^{n'} roots' in Definition 2 is not a fixed threshold;
      (B) is stated for exact complete splitting and for N >= p^{n'}/c with
      c < p^{r-1}. At r = 1 and c >= 2 the corollary is empty and the record
      says so; at the n = 131 cells of interest r = n' - 1 and the slack is
      irrelevant.
    - >-
      The cost model. (B)'s 'cannot beat generic' is relative to Proposition
      8; a reviewer who rejects that model should read (A) alone, which
      bounds |F| and needs no model.
    - >-
      Multiple roots. The bound counts distinct roots of H; L may have
      repeated roots when lambda' = 0 (lambda a square); the distinct-root
      count is what matters for |F| and is what is bounded.
    - >-
      The isogeny-L reading in (D)(iii) is a reconstruction from the words of
      Section 5; if [20] means something else, that sub-item is open, not
