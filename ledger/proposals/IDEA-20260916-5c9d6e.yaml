  minimal_test:
    design: >-
      STAGE 0 - ZERO COMPUTE. Hand re-derivation of (A) in the twisted form,
      and the symbolic checks of baseline_embedding (i)-(iii) and
      method_ceiling (i)-(iii).
      STAGE 1 - TOY FIXTURES, SECONDS. The F_2 exhaustive sweep at (11, 6),
      (13, 7), (23, 12) and the K-coefficient random sweep at (11, 6); brute
      gcd versus H-count at every cell; tightness search (which lambda
      attain the bound).
      STAGE 2 - THE COMPLETE-SPLITTING SWEEP, MINUTES. For n prime in
      {7, 11, 13, 17, 19, 23, 29, 31}, n' <= 12, all lambda in F_2[X] of
      degree 2..8: list every L with N >= 2^{n'-1}, its (n', d, r), and
      beta; check every one against (B). Type 2 at n = 7 and n = 31 must
      appear; nothing with beta < n/(n + n' - r) may.
      STAGE 3 - THE n = 131 INSTANCE is IDEA-20260916-3f7a1c.
      STAGE 4 - RATIONAL LAMBDA, SECONDS. At (11, 6) and (23, 12), 200 random
      lambda = a/b with deg a, deg b <= 3 over F_2: count x in K with
      x^{2^{n'}} b(x) = a(x), compare with d^{q+1} + p^{n'-r} + q d^q; write
      out the pole bookkeeping or record the extension as withdrawn.
      STAGE 5 - REPORT with the closure block below filled from Stage 1-2
      numbers, and the scope stated exactly.
    controls:
      - 'r = 0 cells (n composite, n'' | n, lambda = X): N = p^{n''}, the bound vacuous -- proves-too-much.'
      - 'Type 2 at n = 7 and n = 31: bound admitted, beta equals the corollary at n = 7 -- tightness.'
      - 'Random K-coefficient lambda: null object under the same ceiling.'
      - 'Linearized lambda at r >= 1: Theorem 1 and Lemma 2 decide independently; every count must be consistent with both bounds.'
    required_metrics:
