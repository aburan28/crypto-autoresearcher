  assumptions:
    - >-
      d >= 1 and H is not identically zero. The degenerate case
      lambda o Lambda_q^{(r)} = Y^{p^{n'-r}} is handled by noting it forces
      lambda to be a monomial c X^{p^j}, i.e. L a p^j-th power of a subfield
      polynomial, whose root set is F_{p^{n'-j}} meet K.
    - >-
      'Beats generic algorithms' means alpha_beta > 1 in Proposition 8 of
      KN-LIT-4fe9d2 with kappa the exponent of the solver; the closure in (B)
      is a closure UNDER THAT COST MODEL and is stated as such. A solver
      model in which the cost does not grow with d is not excluded by (B);
      it is excluded by (A) directly, since (A) is a statement about |F|, not
      about cost.
    - >-
      OFF-LIMITS COMPONENTS DECLARED: F2 is the algorithm priced; the
      Frobenius orbit reduction (RQ-FROB-7d8dd4) appears only inside the
      quoted table rows; F6 (endomorphism orbit) appears in (D)(iii) only as
      the reason an endomorphism-defined factor base is a subgroup.

  proof_search_map:
    bottleneck: >-
      Lemma 4.1's dependence on n mod n', which left the r = n' - 1 cells
      (131 = -1 mod n') open with beta as low as 0.03 on paper. Removing it
      moves the QSP line at prime n from 'open at three cells' to 'closed
      under the paper's cost model at every n' not dividing n'.
    baseline_embedding:
      parameter_slice: >-
        (i) Lemma 4.1 is the slice of the same first line where sigma^r is
        applied on the right; the record reproduces it symbolically and
        records that the two bounds are incomparable, combining to
        q l + min(l, r) >= n' - 1. (ii) Theorem 1's equality case and Type 2
        at n = 7 are the tightness slices: (B) must give exactly 3/4 and
        7/9 there, and does. (iii) r = 0 is the vacuity slice.
      reproduction_check: >-
        Symbolic on (i)-(iii), zero compute, plus the exhaustive toy fixture
        of IDEA-20260916-3f7a1c Stage 1 (n = 11, n' = 6, all 252 lambda of
        degree 2..7 over F_2, brute count = H-count <= max(2, d^2)) and a
        K-coefficient fixture: n = 11, n' = 6, 200 random lambda in
        F_{2^11}[X] of degree 3, brute count versus the twisted H-count with
        Lambda_1^{(5)}.
    observation_collision:
      observable: >-
        The bound d^{q+1} + p^{n'-r} and the corollary beta >= n/(n + n' - r).
      distinct_preimage_search: >-
        Search for two shapes with the same (n, n', d) and different N: they
        exist trivially (most lambda give N ~ 2, a Type 2 lambda gives
        p^{n'}); the bound is an upper bound and does not identify N, and
        does not claim to. The collision that WOULD matter: a completely
        splitting L with r >= 1 and d^{q+1} < p^{n'} - p^{n'-r}. The record
        predicts none exists; IDEA-20260916-3f7a1c's census and the toy
        fixtures search for one.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Track the PAIR (x, x^{p^r}) rather than x: the stronger state is
          what makes the K-rationality condition a low-degree polynomial
          relation instead of a degree-p^n one.
        predicted_gain: >-
          Replaces the degree-comparison of Lemma 4.1 (d^q p^r vs p^{n'}) by
          a Bezout count (d^{q+1} + p^{n'-r} vs p^{n'}) that is strong exactly
          where Lemma 4.1 is weak.
      - transform: observable_fiber
        proposed_object: >-
          Hold N = p^{n'} fixed and vary r: the fibre is {r = 0} union
          {r >= 1, d >= p^{(n'-1)/(q+1)}}; the separating invariant is
          divisibility n' | n.
        predicted_gain: >-
          Converts the paper's question 'does a small-d QSP exist at some
          exceptional (q, n)' into 'only at n' | n, up to the beta >= 1/2
          floor'.
    quantifier_order: >-
      FORALL p, n, n' with n' not dividing n, FORALL lambda in F_{p^n}[X] of
      degree d >= 1 with H nonzero: N <= d^{q+1} + p^{n'-r}. Consequently
      FORALL completely splitting such L: beta >= n/(n + n' - r). No witness
      depends on an instance. The closure (E) is claimed only for the shapes
      enumerated in (D) and only under the cost model named in assumptions.
    method_ceiling:
      strongest_certifiable_claim: >-
        'Under the cost model of Theorem 3.2 / Proposition 8, no factor base
        of the form {x : x^{p^{n'}} = lambda(x)} (lambda polynomial in
        F_{p^n}[X], or rational subject to the pole bookkeeping) with n' not
        dividing n beats generic algorithms, for any p, n, n'.' It cannot
        certify anything about n' | n, about factor bases that are not such
        root sets, or about a solver whose cost is independent of d.
      nearby_object_control: >-
        (i) n' | n, where the conclusion is KNOWN FALSE (Diem): the argument
        must and does become vacuous. (ii) Type 2 at n = 127 (the card's
        named nearby object, where a published QSP family exists with
        beta = 1 - 2^5/63^2 = 0.992): the bound must admit it -- n' = 63,
        q = 2, r = 1, d = 2^31: d^3 = 2^93 >= 2^63, admitted, and
        beta = 0.992 >= 127/(127 + 63 - 1) = 0.672, consistent. (iii) n = 129
        = 3 * 43: n' = 43 divides n, so the subfield F_{2^43} exists and the
        bound is vacuous there, correctly; at n' = 33 (129 = 3*33 + 30, r =
        30) the bound bites: N <= d^4 + 8.
    proof_obligations:
      - claim: f(z)^{p^k} = f^{(k)}(z^{p^k}) for f in F_{p^n}[X].
        responsibility: correctness
      - claim: x^{p^{(k+1)n'}} = Lambda_{k+1}(x) for every root x of L.
        responsibility: correctness
      - claim: >-
          x in K implies x = Lambda_q^{(r)}(x^{p^r}); and L(x) = 0 implies
          (x^{p^r})^{p^{n'-r}} = lambda(x).
        responsibility: correctness
      - claim: deg H <= d^{q+1} + p^{n'-r} and H != 0 outside the monomial case.
        responsibility: size
      - claim: >-
          Complete splitting with r >= 1 forces d^{q+1} >= p^{n'} - p^{n'-r},
          hence beta >= n (n' - 1)/(n' (n + n' - r)) exactly and
          beta >= n/(n + n' - r) asymptotically.
        responsibility: strictness
      - claim: The bound is attained on Theorem 1's equality case and on Type 2 at n = 7.
        responsibility: baseline
      - claim: The bound is vacuous at r = 0 and admits Types 1, 1bis, 2 and the multiplicative example.
        responsibility: scope
      - claim: The rational-lambda extension's pole bookkeeping is written out or the extension is withdrawn.
        responsibility: feasibility

