  obstruction:
    statement: >-
      The K-rational fibre of a quasi-subfield factor base
      V = {x : x^{p^{n'}} = lambda(x)} with n' not dividing n is bounded by
      the Bezout number of two low-degree curves in the (x, x^{p^r})-plane.
    quantity: >-
      N_K(L) = #{x in F_{p^n} : x^{p^{n'}} = lambda(x)}, bounded by
      d^{q+1} + p^{n'-r}.
    value: >-
      At n = 131, n' = 33, d <= 7: N <= 2401 (exact bound, no error bar);
      at n' = 66: N <= 51; at n' = 44: N <= 345. Measured values pending
      IDEA-20260916-3f7a1c.
    measured_by: []
    scope: >-
      Every lambda in F_{p^n}[X] (polynomial), every p, n, n' with n' not
      dividing n; conjecturally rational lambda. Claimed nowhere else.
    resource_check:
      examined: true
      reading: >-
        The bound is a fixed-point count of a Frobenius-twisted
        correspondence, and the theory that WANTS it is the one that varies
        the correspondence's degree in the conjugate variable: for a
        correspondence R(x, sigma^a x) = 0 of bidegree (d_0, d_1) the same
        count is d_0^{q+1} + d_1^{q+1} p^{a-r}, which has ROOM for a
        2^{a}-sized factor base exactly when (q+1) log_p d_1 >= r. That is the
        hypothesis of IDEA-20260916-a17f43, and it is where the obstruction
        becomes an asset: it says which (a, d_1) pairs at n = 131 are not
        excluded, and it prices the resulting decomposition system.
      spawned_ids: [IDEA-20260916-a17f43]

