idea:
  id: IDEA-20260916-5c9d6e
  question_id: RQ-QSP-f9bbdb
  added: '2026-09-16'
  proposed_by: idea-generator
  session: TASK-20260916-a93a2a
  status: proposed
  title: >-
    A FROBENIUS-INJECTION BOUND FOR EVERY QUASI-SUBFIELD SHAPE WITH n' NOT
    DIVIDING n: the F_{p^n}-roots of X^{p^{n'}} - lambda(X), lambda in
    F_{p^n}[X] of degree d, number at most d^{q+1} + p^{n'-r} (n = q n' + r,
    r >= 1), so every completely splitting QSP has beta >= n/(n + n' - r) >
    1/2, the n = 131 cells with 131 = -1 mod n' have beta >= 131/132, Lemma
    4.1's 'n mod n'' term is removable in the sense Section 5 of KN-LIT-0a321c
    asked, and the polynomial-lambda, rational-lambda and K-coefficient
    generalisations are closed by the same three lines -- filed as a
    derivation with tightness and proves-too-much controls, not as a result
  class: mechanism

  claim: >-
    (A) THEOREM-SHAPED CLAIM, DERIVATION TIER. Let K = F_{p^n}, sigma the
    p-Frobenius, f^{(k)} the polynomial f with coefficients raised to p^k,
    so f(z)^{p^k} = f^{(k)}(z^{p^k}). Let lambda in K[X], d = deg lambda >= 1,
    L = X^{p^{n'}} - lambda(X), and n = q n' + r with 0 <= r < n'. Define the
    twisted iterates Lambda_1 = lambda, Lambda_{k+1} = Lambda_k^{(n')} o lambda
    (degree d^{k+1}). For a root x of L: x^{p^{n'}} = lambda(x), hence
    x^{p^{(k+1)n'}} = Lambda_k(x)^{p^{n'}} = Lambda_k^{(n')}(x^{p^{n'}}) =
    Lambda_k^{(n')}(lambda(x)) = Lambda_{k+1}(x), and
    x^{p^n} = Lambda_q(x)^{p^r} = Lambda_q^{(r)}(x^{p^r}). Put y = x^{p^r}.
    Then x in K iff x = Lambda_q^{(r)}(y), and L(x) = 0 iff
    y^{p^{n'-r}} = lambda(x). So every K-root of L is carried by the
    injection x -> x^{p^r} to a root of
        H(Y) := Y^{p^{n'-r}} - lambda(Lambda_q^{(r)}(Y)),   deg H <= d^{q+1} + p^{n'-r},
    and N_K(L) <= d^{q+1} + p^{n'-r} whenever H is not identically zero
    (H = 0 forces lambda o Lambda_q^{(r)} to be the monomial Y^{p^{n'-r}}; for
    d not a power of p this cannot happen, and for d a power of p it is the
    degenerate subfield-power case L = (X^{p^{n'-j}} - X)^{p^j}, handled
    separately). In intersection-theoretic form: the K-roots are the
    intersection in the (x, y)-plane of the curve y^{p^{n'-r}} = lambda(x)
    (bidegree (d, p^{n'-r})) with the curve x = Lambda_q^{(r)}(y) (bidegree
    (1, d^q)); the bound is the Bezout number d * d^q + p^{n'-r} * 1.
    (B) THE BETA COROLLARY. If r >= 1 and L splits completely (N = p^{n'})
    then d^{q+1} >= p^{n'} - p^{n'-r} >= p^{n'}/2 (p = 2) so
    (q+1) l >= n' - 1 exactly, and asymptotically (q+1) l >= n'; since
    (q+1) n' = n + n' - r,
        beta = l n / n'^2 >= n / (n + n' - r) > 1/2   for every n' not dividing n.
    If only N >= p^{n'}/c is required (Definition 2's 'approximately') and
    c < p^{r-1}, then d^{q+1} >= p^{n'}/(2c) and beta >= n (n' - log_p(2c)) /
    (n' (n + n' - r)). At n = 131: complete splitting at n' in {2, 3, 4, 6,
    11, 12, 22, 33, 44, 66} (r = n' - 1) forces beta >= 131/132 = 0.992;
    at every n' in 2..130, beta >= 131/(130 + n') >= 0.504; the generic-
    beating threshold of KN-LIT-4fe9d2 Remark 1 (beta < 0.103 at kappa =
    4.876, and beta < 1/2 for ANY kappa >= 1) is unreachable for every
    n' not dividing n, under the paper's own cost model. The RQ's premise
    (4), that 131 = -1 mod n' is the best case, is inverted: it is the worst.
    (C) RELATION TO THE PUBLISHED BOUNDS. Lemma 4.1 (KN-LIT-0a321c) gives
    q l + r >= n' from the degree of G = Lambda_q^{(r)}(X^{p^r}) - X; (A)
    gives (q+1) l >= n' - 1 from the degree of H. They are incomparable
    ((A) is stronger iff l < r) and combine to q l + min(l, r) >= n' - 1.
    Theorem 1 of KN-LIT-4fe9d2 (beta >= 3/4) is for LINEARIZED lambda with
    any n'; (A) is for ANY lambda with n' not dividing n, and is attained
    with equality on Theorem 1's equality example (X^{p^2} + X^p + X over
    F_{p^3}: beta = 3/4 = 3/(3 + 2 - 1)) and on Type 2 at n = 7 (beta = 7/9
    = 7/(7 + 3 - 1)), and it is consistent with the multiplicative example
    X^8 - X^3 over F_{2^4} (beta = 0.70 >= 4/(4 + 3 - 1) = 0.667). Section 5
    of KN-LIT-0a321c asks whether Lemma 4.1 is tight and notes that
    'removing the term n mod n'' would show the approach cannot beat generic
    algorithms; (B) is that removal, with r replaced by the +1 in q + 1.
    (D) THE GENERALISATIONS OF SECTION 5, PRICED. (i) lambda in K[X] rather
    than F_p[X]: covered by (A) as stated (the twists change nothing about
    degrees). (ii) Rational lambda = a/b: the iterates are rational of degree
    d^k and the same injection gives N_K(L) <= d^{q+1} + p^{n'-r} + (number of
    poles met along the chain, at most q d^q); stated as a CONJECTURE with
    the same verification route, since the pole bookkeeping was not written
    out. (iii) An 'isogeny map for L' (Section 5 citing [20]): a factor base
    {P : x(psi(sigma^{n'} P)) = lambda(x(P))} is a correspondence of bidegree
    (d, deg psi) between x and sigma^{n'}(x) and falls under the
    correspondence form of (A) (see IDEA-20260916-a17f43): N <= d^{q+1} +
    (deg psi)^{q+1} p^{n'-r}. When the correspondence is an ENDOMORPHISM
    relation (psi sigma^{n'} = [a] on the curve) the factor base is the
    subgroup ker(psi sigma^{n'} - [a]) meet E(K), which on ECC2K-130
    (|E(K)| = 4 * prime) has order <= 4 or >= the prime: the rigidity of
    IDEA-20260806-c5d183 in its most literal form. (iv) Double-large-prime,
    unsymmetrised and unbalanced variants change the relation bookkeeping,
    not the factor base; (A) applies unchanged. (v) Large p, n prime: (A)
    holds for every p; the only escape is n' | n.
    (E) THE CLOSURE, AT THE SECTION 4 STANDARD. Named obstruction: the
    K-rational fibre of the quasi-subfield relaxation is bounded by the
    Bezout number of two low-degree curves, d^{q+1} + p^{n'-r}. Argument: (A).
    Forward guidance: what survives is (1) n' | n (Diem's subfield family;
    n = 131 prime, so n' in {1, 131} only); (2) factor bases defined by a
    correspondence of degree >= 2 in the Frobenius conjugate with
    (q+1) log_p d_1 >= r, where the bound has room -- the successor object of
    IDEA-20260916-a17f43; (3) factor bases that are not root sets of a
    single X^{p^{n'}} - lambda at all (the Weil-descent subspaces of SEMBIN,
    whose 'lambda' has l = n' - 1 and are outside the beta framework).

  mechanism: >-
    OBJECT FRAME. Representation: the x-coordinate in F_{p^n} together with
    its Frobenius shift y = x^{p^r} (R1 class). Operation set Sigma =
    {sigma^{n'}, substitution by lambda}, the two generators of the chain map
    phi of KN-LIT-0a321c Section 3.1. Attack stage: factor-base membership.
    Trichotomy: the quantity is coordinate-dependent (Class III) -- it is a
    property of the field representation's Frobenius, not of any group
    element -- and the algorithm it prices is Class I partial-action.
    LOSSY-PROJECTION TEST AGAINST SIGMA. The quasi-subfield algorithm's object
    is K[X]/(L), the projection of K[X]/(X^{p^n} - X) that forgets every root
    outside V. Sigma-compatible: sigma^{n'} acts on K[X]/(L) as phi, which is
    the identity f^{p^{n'}} = phi(f) mod L the paper proves. Lossy: it keeps
    only |V| of the p^n points. The theorem says the projection is lossy in
    the wrong direction -- its K-rational content is at most d^{q+1} +
    p^{n'-r} points -- unless the projection is a subfield (r = 0), in which
    case it is Diem's object. No new object is proposed by this record; it
    prices the membership fibre of the existing one, and the successor object
    is filed separately.
    WHY THE PROOF IS THREE LINES AND WHY THAT IS THE POINT. Lemma 4.1's proof
    already contains x^{p^{kn'}} = Lambda_k(x); the only addition is to
    apply sigma^r to the equation x^{p^{qn'}} = Lambda_q(x) on the LEFT
    (obtaining x^{p^n}, hence x itself for x in K) instead of on the right
    (obtaining a polynomial of degree d^q p^r). The substitution y = x^{p^r}
    then makes the L-equation a relation of degree p^{n'-r}, which is tiny
    exactly when r is close to n' -- the regime the paper identified as the
    attacker's best case. Bezout does the rest.
    WHY IT CANNOT PROVE TOO MUCH. At r = 0 the bound reads N <= d^{q+1} +
    p^{n'} >= deg L and is vacuous, so subfield polynomials (d = 1, N = p^{n'})
    are untouched; Type 1, Type 1bis and Type 2 all satisfy the bound with
    room or with equality; the multiplicative example satisfies it. These are
    the proves-too-much controls and they pass symbolically.

  novelty_status: unverified

