idea:
  id: IDEA-20260816-8cb64b
  question_id: RQ-POLYMAC-7c89e4
  added: '2026-08-16'
  title: 'Count the weak-key structure of both authentication-key spaces exactly rather than citing
    it: the multiplicative-order divisor lattice of a binary extension field against the clamped residue
    set of a prime field, reported as densities at the same target exposure and as a paired asymmetry'
  class: measurement
  claim: '(A) The authentication key of each construction lives in a finite set whose structure is
    fully enumerable in principle: for the binary arm the nonzero elements of GF(2^n) under a cyclic
    group of order 2^n - 1, for the prime arm a CLAMPED subset of residues modulo a prime. The claim
    is that the weak-key exposure of each construction can be COUNTED - not cited, not estimated -
    as the exact density of keys satisfying each of a declared list of predicates, and that the two
    counts can be placed side by side at matched target exposure. (B) The declared predicates are:
    multiplicative order dividing d for each divisor d of the group order; the key lying in a proper
    subfield or subgroup; the key being a root of a low-degree sparse polynomial; and, for the prime
    arm only, the key surviving the clamping mask. (C) The counting is exact and needs no approximation:
    for cyclic groups the number of elements of order dividing d is exactly d when d divides the group
    order, so the density of low-order keys is a statement about the DIVISOR LATTICE of 2^n - 1 and
    of p - 1, and those lattices are computable from the factorisations. The clamped set''s cardinality
    is a product of bit-constraint counts and is exact by construction. (D) The paired claim is the
    asymmetry: the two group orders have entirely different divisor lattices, and clamping applies
    to one arm and not the other, so the two constructions do NOT inherit the same exposure even though
    they are the same construction. The deliverable is the quantified asymmetry, at matched bit width,
    with each arm''s count reproducible from its factorisation alone. (E) WHAT IS NOT CLAIMED: that
    any deployed key is weak, that any count implies a probability that a real deployment holds such
    a key beyond what the count itself literally states, that low order implies a feasible forgery,
    or anything at all about AES-GCM or ChaCha20-Poly1305 as deployed. A density is a density.'
  mechanism: 'STAGE 1 factors the two relevant group orders at each tested bit width. At toy widths
    this is instant; at deployed widths the factorisations are large integers whose factorisation
    must either be computed within budget or declared unavailable, and the contract must not quote
    a remembered factorisation - that prohibition is explicit and is the single largest honesty risk
    in this entry. STAGE 2 builds the divisor lattice of each order and, for each divisor d, records
    d as the exact count of elements of order dividing d, converting to a density by dividing by the
    group order. STAGE 3 defines the clamping map for the prime arm at each width via the declared
    scaling rule, enumerates or counts the surviving residue set exactly by bit arithmetic, and intersects
    it with each order class - this intersection is the part that cannot be read off the lattice and
    must be counted, exhaustively at toy width and by structure-preserving argument at larger width.
    STAGE 4 places the two arms at matched log-cardinality and reports, for a ladder of target exposures,
    the density of keys at or below that exposure in each arm and the ratio between arms. STAGE 5
    runs the null: a cyclic group of the same order with a randomly relabelled generator, and a random
    subset of the prime field of the same cardinality as the clamped set, both processed by the identical
    counting code. Refutation of the counting itself: if the enumerated count at toy width disagrees
    with the lattice-derived count by a single element, the counter is wrong and the run halts.'
  novelty_status: unverified
  novelty_screen:
    method: 'Same repository-wide greps as recorded for the ratio-surface entry in this batch: POLYMAC,
      GHASH, Poly1305, ghash, poly1305 across ledger/proposals, ledger/hypotheses, knowledge/ and
      experiments/; plus targeted greps for weak key, weak-key, multiplicative order, subgroup, and
      clamping across ledger/proposals and knowledge/. Read the anchor question''s weak-key target
      paragraph in full and the front matter and claims of knowledge/literature/KN-LIT-4060.md.'
    results: 'KN-LIT-4060 (GCM, GHASH and Weak Keys) is present in the corpus at confidence reported,
      citation_verified read, added in the 2026-07-24 bulk seeding pass, with its own Not verified
      here section stating claims are relayed from the abstract without independent verification;
      its relayed claims mention wider classes of weak keys in multiplicative subgroups. No ledger
      record COUNTS anything: no proposal, hypothesis, evidence record or experiment directory in
      the repository contains a weak-key density for either field. Clamping appears in the ledger
      only inside IDEA-20260809-3a39bc as an ablation target for commitment-certificate cost, not
      as a counted constraint on a key space. Ed25519 clamping is a separate and blacklisted area
      (RQ-EDDSA-9b8473) and is not this object: that clamping constrains a scalar for a group operation,
      this one constrains a polynomial evaluation point.'
    verdict: 'UNVERIFIED. Nothing here asserts what the literature does or does not contain, and KN-LIT-4060''s
      relayed abstract is treated as an unverified pointer rather than as a result. What is claimed
      new WITHIN THIS REPOSITORY: an exact, reproducible COUNT rather than a citation, and specifically
      the intersection of the clamped residue set with the order classes, which is the quantity that
      makes the two arms comparable and which no record here holds. What is assembled from known parts:
      the fact that a cyclic group of order N has exactly d elements of order dividing d for each
      divisor d is elementary group theory and is used here as an arithmetic tool, not claimed as
      a contribution.'
  object_first_candidate:
    tracked_object: 'The DIVISOR LATTICE of the authentication key group''s order, decorated at each
      divisor with two numbers: the count of keys of order dividing that divisor, and the count of
      those keys that survive the construction''s key constraint (clamping in the prime arm, none
      in the binary arm).'
    lossiness: 'The projection is lossy. It discards the identity of every individual key, the field''s
      additive structure entirely, the message space, the mask, and all of the mode above the key.
      It retains only a finite partially ordered set with two integer labels per node. This is compatible
      with the target operation because the predicates of interest - low multiplicative order, membership
      in a subgroup, containment in a proper subfield - are all invariant under the group structure
      and are exactly the predicates the lattice records. It is emphatically NOT a change of coordinates:
      two fields with the same cardinality and different order factorisations have different lattices,
      and two keys of the same order are indistinguishable here even though they behave differently
      under any specific forgery.'
    propagation: 'One step of the target operation - raising the key to a power, which is exactly
      what a polynomial evaluation does block by block - acts on the lattice by moving a key from
      its order class to the class of the quotient order: a key of order t raised to the k-th power
      has order t divided by gcd(t, k). So the operation acts on the lattice as a divisor-quotient
      map, and the number of distinct powers a key can take is exactly its order. That is the whole
      mechanism by which low order matters: the power sum defining the digest collapses to a short
      cyclic sum when the key''s order is small, and the size of the collapse is read directly off
      the lattice node.'
    survival_score: 'The object survives exactly and forever within the hash layer, because it is
      a statement about the group and the group does not change. It DISSOLVES at three named places.
      First, at the boundary where the clamping constraint is not a subgroup condition: the clamped
      set is a union of bit-patterns and is not closed under multiplication, so the second label on
      each node is a genuine intersection count and not a group-theoretic quantity, and it has no
      lattice structure of its own. Second, at any question about how many messages exploit a low-order
      key, which the lattice cannot answer. Third, at the deployed bit widths if the group-order factorisation
      is not available within budget - at which point the object exists but its labels are not computable
      and the record must say so rather than quoting remembered factors.'
  null_object_control: 'Two nulls, both run by the identical counting code in the same invocation.
    NULL A: a cyclic group of the same order with a randomly chosen generator relabelling - the lattice
    and every count must come out IDENTICAL, because the counts are generator-independent; any difference
    is a bug in the counter, and this is the sharpest available check that the counter counts structure
    and not representation. NULL B: a uniformly random subset of the prime field with exactly the
    cardinality of the clamped set, intersected with the same order classes - the intersection densities
    must match the unconstrained densities to within hypergeometric sampling error. For the signal
    arm to mean anything, NULL B must show NO enrichment: if the random subset shows the same intersection
    profile as the clamped set, then clamping contributes nothing beyond its cardinality and that
    is the finding. If clamping shows a departure from NULL B beyond the hypergeometric interval,
    the departure is the measured structure.'
  discriminated_from:
  - KN-LIT-4060, a corpus entry at confidence reported whose relayed abstract mentions weak-key classes
    in multiplicative subgroups. This record does not restate it, depend on it, or verify it; it produces
    counts that a reader can recompute from a factorisation, which a relayed abstract does not provide.
  - 'IDEA-20260809-3a39bc: ablates clamping as a cost factor in constructing commitment certificates.
    Here clamping is not ablated but COUNTED, as a set cardinality and an intersection profile, and
    no certificate is built.'
  - 'RQ-EDDSA-9b8473''s clamping proposals (12 on that question, blacklisted for this bucket): those
    constrain a scalar multiplier acting on an elliptic-curve group. The object here is a polynomial
    evaluation point in a field, and the relevant structure is multiplicative order in the field''s
    unit group, not cofactor clearing.'
  - 'A generic statement that fields contain elements of low order: that is true of every field and
    carries no information. The content here is the pair of divisor lattices at matched bit width,
    whose asymmetry is a specific arithmetic fact about the two group orders and is not shared by
    fields in general.'
  - 'The ratio-surface entry in this same batch: that one measures acceptance probability over the
    whole key space, averaging over exactly the structure this entry counts. The two are complementary
    and the counted lattice is what would explain any departure the ratio surface shows.'
  assumptions:
  - The group orders at the tested widths can be factored within budget, or the record reports the
    lattice as partial and says which divisors are unknown. No factorisation is quoted from memory
    under any circumstances.
  - The scaled-down clamping rule is a faithful analogue of the full clamping rule in the sense of
    constraining the same fractional bit positions. The rule is declared and frozen before counting.
  - Multiplicative order is the right first coordinate for weak-key structure. This is an assumption
    about which predicate matters and is not established here; other predicates are included in the
    declared list precisely because this assumption may be wrong.
  - Counts at toy width and structural counts at larger width are the same kind of object. Where a
    count is derived rather than enumerated, the derivation is stated and checked against enumeration
    at the largest width where enumeration is possible.
  predictions:
  - metric: agreement between enumerated and lattice-derived counts of elements of order dividing
      d, at every toy width
    direction: different
    minimum_effect: exact agreement, zero discrepancy in every divisor class; a single-element discrepancy
      halts the run
  - metric: NULL A count difference under generator relabelling
    direction: different
    minimum_effect: exactly zero at every node
  - metric: clamped-set intersection density versus NULL B random-subset intersection density, per
      order class
    direction: different
    minimum_effect: 'no pre-commitment on direction or size. Reason: the scaled-down clamping rule
      is a declared analogue and this record holds no prior for how a bit-pattern constraint interacts
      with an order class; pre-committing a number here would be inventing one.'
  - metric: density of keys of order at most a target T, binary arm versus prime arm at matched log-cardinality
    direction: different
    minimum_effect: a factor of at least 2 separation at some T in the tested ladder, or the record
      states that the two lattices give indistinguishable exposure at every tested T - both outcomes
      are reportable results
  minimal_test:
    design: The cheapest discriminating run needs no forgery machinery at all and is close to zero
      compute. Fix bit widths 8, 12, 16 and 20. For the binary arm, factor 2^n - 1 at each width;
      for the prime arm, pick the largest prime below 2^n and factor p - 1. Build both divisor lattices.
      For each, enumerate the entire multiplicative group and directly compute every element's order
      by repeated multiplication - at 2^20 this is seconds - and check the enumerated per-divisor
      counts against the lattice prediction exactly. Apply the declared toy clamping mask to the prime
      arm, count the survivors, and compute the intersection of the clamped set with each order class
      by direct enumeration. Run NULL A and NULL B in the same script. The discriminating output is
      a two-column table of exposure density versus target order for the two arms at matched log-cardinality,
      plus the clamped-versus-random intersection comparison. If the two arms' curves coincide, the
      asymmetry claim is refuted at these widths and that is a clean measured result about the pairing;
      if they separate, the separation is quantified and the divisor lattices explain it arithmetically.
    controls:
    - 'NULL A: generator relabelling of the same cyclic group, counts must be bit-identical.'
    - 'NULL B: uniformly random subset of the prime field with the clamped set''s exact cardinality,
      same intersection code.'
    - Enumeration-versus-lattice cross-check at every toy width, required exact.
    - A deliberately wrong reduction polynomial for the binary arm, which yields a ring rather than
      a field, must produce a count that violates the cyclic-group prediction - a positive control
      that the counter can detect non-field structure.
    - Independent second implementation of the order computation (by factoring the group order and
      testing divisors) cross-checked against the naive repeated-multiplication order computation
      on all elements at n = 12.
    required_metrics:
    - factorisation of each group order, or an explicit statement that it was not obtained
    - per-divisor count of elements of order dividing d, enumerated and lattice-derived, both arms
    - cardinality of the clamped residue set, exact
    - intersection count of clamped set with each order class
    - cumulative exposure density versus target order T, both arms, at matched log-cardinality
    - NULL A discrepancy (required zero) and NULL B intersection profile with hypergeometric interval
  falsification_conditions:
  - Enumerated and lattice-derived counts disagree in any divisor class at any tested width.
  - NULL A shows any nonzero discrepancy under generator relabelling.
  - The clamped-set cardinality computed by bit arithmetic disagrees with the cardinality obtained
    by direct enumeration at toy width.
  - The wrong-reduction-polynomial positive control fails to violate the cyclic prediction, indicating
    the counter cannot detect non-field structure.
  - The two arms' exposure curves coincide at every tested T, which refutes the asymmetry claim at
    these widths and is recorded as such rather than as a null result.
  - A group-order factorisation is unobtainable within budget at a width the contract declared it
    would cover, in which case that width is reported as unmeasured rather than filled in.
  confounders:
  - 'Matched bit width is not matched cardinality: 2^n - 1 and p - 1 differ, and a naive comparison
    at matched n manufactures a difference. All comparisons must be at matched log-cardinality with
    the mismatch reported.'
  - 'The choice of prime at each width changes p - 1''s factorisation dramatically; a single prime
    per width makes the prime arm''s lattice an accident of that choice. Mitigation: repeat over the
    five largest primes below 2^n and report the spread.'
  - The toy clamping rule is a designed analogue; any intersection structure it shows may be an artifact
    of how the rule was scaled rather than of clamping as such.
  - Low multiplicative order is one predicate among several, and choosing it as the headline coordinate
    could make the arms look asymmetric when a different predicate would make them look identical.
  - Enumeration at n = 20 over a prime field requires care with the largest-prime choice; an off-by-one
    in the residue range shifts every intersection count.
  interpretation_limits:
  - A density is a count divided by a cardinality. It says nothing about the probability that any
    real key generation process produces such a key, and nothing about whether a low-order key admits
    a cheaper forgery in practice - that link is not measured here and must not be asserted.
  - Results at bit widths at most 20 are about those widths. The divisor lattices at deployed widths
    are different objects and are only reported if their factorisations are actually computed in the
    run.
  - 'A one-arm result is materially weaker: counting only the binary arm produces a fact about one
    field''s order factorisation, and the entire point of the pairing is that such a fact is not a
    property of the construction.'
  target_complexity:
    time_exponent: No attack exponent is claimed. The counting cost is O(2^n) multiplications for
      full enumeration at toy width, plus the cost of factoring the two group orders, which is the
      only step whose cost is not bounded a priori and is subject to the stopping rule.
    memory_exponent: No attack memory exponent is claimed. Storage is O(2^n) small integers for the
      enumerated order table, a few megabytes at n = 20, plus a divisor lattice of size equal to the
      number of divisors.
    best_known: The incumbent is the current practice of citing weak-key existence rather than counting
      it. Within this repository the named incumbent is KN-LIT-4060, an entry at confidence reported
      carrying relayed abstract claims about weak-key classes and no density anyone here can recompute.
    hidden_overhead: The factorisation step is where unbounded cost hides, and it is also where the
      temptation to quote a remembered factorisation is strongest - that is a human-cost and honesty
      overhead, not a compute one. Second, the prime-choice spread multiplies the run by five and
      is easy to omit, which would silently turn an accident into a finding.
  dominated_by: n/a (no result claimed). Pareto check performed against every polymac-relevant row
    this repository holds - KN-LIT-4060, KN-LIT-5652, KN-LIT-7035, KN-LIT-1337, KN-LIT-4188, KN-LIT-1445,
    and the nine RQ-AEADC-8db132 proposals - and none of them states a key-space density in any cost
    coordinate, so there is no time, memory or query frontier row this record competes with. It claims
    no attack and therefore occupies no frontier.
  sota_delta: No attack; measurement contribution only. The quantitative delta is from zero counted
    weak-key densities in 419 evidence records to a per-divisor exposure table for two fields at four
    bit widths with two nulls and a five-prime spread.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'By part. That the counts are exactly obtainable and the enumeration-versus-lattice
    cross-check passes at toy widths: about 0.97, since this is elementary and self-checking. That
    the clamped-versus-random intersection shows any departure at all: about 0.3, because a bit-pattern
    constraint and a multiplicative order class have no obvious reason to correlate, and the honest
    expectation is that clamping acts as a cardinality reduction and nothing more - which is itself
    a clean reportable result. That the two arms'' exposure curves separate by a factor of at least
    2 at some tested T: about 0.7, because the factorisations of 2^n - 1 and p - 1 differ structurally,
    though the prime-choice spread may swamp it. That the record survives red team as a statement
    about the constructions rather than about arithmetic accidents of the chosen primes: about 0.45,
    and the prime-spread control is the part carrying that risk.'
