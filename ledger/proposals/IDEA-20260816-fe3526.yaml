idea:
  id: IDEA-20260816-fe3526
  question_id: RQ-ALPF-001
  added: '2026-08-16'
  title: 'Compose the screen''s measured error rates into the number a Coordinator actually needs:
    given a false-positive rate, a detection power and an assumed base rate of real candidates, report
    the posterior odds that a fired ALPF cell is real, and attribute the discrimination stage by stage
    across the pipeline.'
  class: composition
  claim: '(A) A screening decision needs three numbers and this lane has none of them written down
    together: how often the screen fires when nothing is there, how often it fires when something
    is there, and how often something is there at all. The archived campaign reports verdicts; EV-ALPF-001
    reports a neutral direction at preliminary strength; and no record composes these into the quantity
    a Coordinator uses when deciding whether a fired cell justifies an expensive follow-up. (B) The
    claim is that the composition is arithmetic once the inputs exist and that its OUTPUT is the useful
    artifact: a posterior-odds surface over the plausible range of base rates, with contours showing
    where a fired cell is more likely real than not. Because the base rate of genuinely decomposition-favourable
    representations among screened candidates is unknown and unmeasurable from inside the lane, the
    deliverable is deliberately a surface rather than a number, with the base rate as an explicit
    free axis a Coordinator must choose on the record. (C) The claim is further that the ALPF pipeline
    is a COMPOSITION of stages -- meter self-validation gate, degree-profile computation, first-fall
    comparison, cost comparison against rho -- and that the discrimination can be attributed across
    them by ablation: rerun the decision with each stage removed and measure how much the posterior-odds
    surface moves. A stage that moves it not at all is doing no work and can be dropped from future
    campaigns, which is a concrete, actionable output that no single-stage measurement produces. (D)
    NOT CLAIMED: that any particular base rate is correct; that any fired cell is or is not real;
    that the screen should or should not be trusted. A posterior surface is a decision aid whose inputs
    are stated, and an ablation table is a description of a pipeline, not a verdict on the science
    it screened.'
  mechanism: 'STAGE 1: consume three measured inputs -- the per-profile false-positive rate from the
    null-ensemble measurement, the detection curve from the graded planted-positive control, and the
    certificate prevalence from the proxy-versus-endpoint control. Each is a separate committed measurement;
    this entry computes nothing about elliptic curves itself. STAGE 2: compose them: for each profile
    and each assumed base rate pi on a grid from 0.001 to 0.5, posterior odds = (power * pi) / (fpr
    * (1 - pi)), reported with uncertainty propagated from the input intervals by Monte Carlo over
    their posteriors. STAGE 3: produce the contour where posterior odds equal 1, per profile, giving
    the minimum base rate at which a fired cell of that profile is more likely real than not. STAGE
    4: ablation -- reimplement the ALPF decision as an explicit four-stage pipeline and, for each
    stage, recompute the posterior surface with that stage bypassed, using the same underlying instance
    data. STAGE 5: report the surface shift per ablated stage as the stage''s discrimination contribution,
    with a bootstrap interval. STAGE 6: emit a decision table: given a Coordinator''s declared base
    rate, which profiles and which stages justify follow-up compute. Refutation: if the posterior
    surface is flat in the base rate over the whole plausible range, the screen carries no decision-relevant
    information and the composition says so; if one stage''s ablation moves nothing, that stage is
    measured as inert.'
  novelty_status: unverified
  novelty_screen:
    method: grep -ril 'positive predictive|PPV|base rate' ledger/proposals/ ; grep -ril 'ablation'
      ledger/proposals/ ; grep -ril 'ALPF' ledger/proposals/ ; read ledger/evidence/EV-ALPF-001.yaml
      direction and strength fields, experiments/EXP-ALPF-006/analysis.md gate structure, experiments/EXP-ALPF-010/analysis.md
      cost comparison stage, docs/inventor-protocol.md sections 3 and 5, docs/claims-and-verification.md
      reference in CLAUDE.md.
    results: Zero proposals reference ALPF. The base-rate nouns match IDEA-20260815-143d6e, IDEA-20260805-2f2863,
      IDEA-20260805-db5afa, IDEA-20260805-250e50, IDEA-20260807-caf061, IDEA-20260815-5f2a58, IDEA-20260805-51996a
      and IDEA-20260815-c13ef4; the closest, IDEA-20260815-5f2a58, states a proposal batch's prior
      of survival against the program's historical yield, and the blacklisted IDEA-20260815-bc26a3
      owns the program-wide false-positive-rate question. Neither composes an instrument's measured
      specificity and power into a posterior surface for one screen, and neither performs a stage
      ablation of a screening pipeline. Inside the ALPF artifacts the pipeline stages are visible
      and separable -- EXP-ALPF-006 shows an explicit GATE VERDICT stage that can FAIL independently
      of the science, EXP-ALPF-010 shows a distinct cost-comparison stage against rho -- but no record
      measures how much each stage contributes.
    verdict: 'UNVERIFIED. No literature claim is made. Assembled from known parts: Bayes'' rule on
      a screening test, Monte Carlo uncertainty propagation, and stagewise ablation, all standard,
      plus three measurements that this batch''s companion entries would supply. Claimed new relative
      to this repository: (i) making the OUTPUT a base-rate surface with the base rate as an explicit
      declared axis rather than a hidden assumption, which forces a Coordinator''s prior onto the
      record; (ii) treating the ALPF screen as a four-stage composition and measuring per-stage discrimination
      by ablation, which no record does for any screen in this program; (iii) emitting a follow-up
      decision table keyed to the declared base rate. Distinct from portfolio-yield accounting (IDEA-20260815-5f2a58,
      bc26a3), which never conditions on a per-cell instrument''s measured operating characteristics.'
  object_first_candidate:
    tracked_object: 'The decision function of the screen: the map from (measured false-positive rate,
      measured power, assumed base rate) to posterior odds that a fired cell is real, followed as
      pipeline stages are removed one at a time.'
    lossiness: 'Genuinely lossy. The decision function retains three scalars per profile and discards
      every instance, every polynomial, every degree and every timing that produced them. This is
      compatible with the operation of interest -- deciding whether to spend follow-up compute on
      a fired cell -- because that decision is, by construction, a function of exactly those three
      scalars under Bayes'' rule. The projection is heavily non-injective: any screen with the same
      three numbers has the same decision function, which is precisely why the composition transfers
      across profiles and why the ablation is meaningful, since a removed stage changes the scalars
      and nothing else the decision can see.'
    propagation: 'One step of the target operation is the removal of one pipeline stage. Acting on
      the tracked object it maps (fpr, power) to a new pair measured on the same instances with that
      stage bypassed, and hence maps the whole posterior surface to a new surface. The propagation
      is therefore explicit and computable: the shift in the odds-equals-one contour is the stage''s
      contribution, and stages compose in a stated order so the ablations are not independent -- removing
      the gate stage changes what the first-fall stage sees. The experiment reports both single-stage
      ablations and the full cumulative sequence so the non-independence is visible rather than assumed
      away.'
    survival_score: The decision function survives exactly as far as its three inputs are measured.
      With all three available it is defined over the full base-rate grid; with only the false-positive
      rate it collapses to a specificity statement and the entry says so and stops. Concretely, the
      object dissolves if the detection curve is flat at the null rate -- the graded planted-positive
      control's own falsification condition -- because then power equals fpr and the posterior odds
      equal the prior odds at every base rate, meaning the screen carries zero decision information.
      That degenerate case is a real possibility given EXP-ALPF-006's committed 0-of-3 detection result,
      and it is the most important thing this composition can report.
  null_object_control: The null object is a screen whose fire decisions are drawn independently of
    the instance, at the measured marginal fire rate -- a coin of the right bias. The IDENTICAL composition
    and IDENTICAL ablation procedure run on it in the same invocation. For the composition to mean
    anything the null screen must produce a posterior surface identically equal to the prior odds
    at every base rate, and every ablation must move it by zero within Monte Carlo error. If the null
    screen's surface departs from the prior, the composition code is wrong and no result may be reported.
    A second null re-runs the ablation with a stage replaced by a coin of matched fire rate rather
    than removed, which distinguishes 'this stage carries information' from 'removing this stage changes
    the pipeline's marginal fire rate'.
  discriminated_from:
  - IDEA-20260815-5f2a58 states a batch's prior of survival against the program's historical yield.
    That is a portfolio prior with no instrument attached; this composes a specific instrument's measured
    specificity and power and reports a surface over the unknown prior rather than asserting one.
  - IDEA-20260815-bc26a3 (blacklisted, named deliberately) owns the program's own false-positive rate
    across campaigns. This entry computes nothing at program level and produces a per-profile decision
    surface for one screen.
  - The null-ensemble measurement and the graded planted-positive control in this same batch each
    produce ONE of the three inputs. This entry produces none of them and adds only the composition
    and the ablation; it is explicitly downstream and degrades to a specificity statement if its inputs
    are missing.
  - EXP-ALPF-006's GATE VERDICT is a binary pass/fail on the meter. The ablation here measures how
    much that gate stage contributes to discrimination in odds terms, which a pass/fail flag cannot
    express.
  - IDEA-20260815-143d6e prices deferred lanes across the tier ladder to rank unblocking cost. This
    produces a follow-up decision rule for cells within one lane, conditioned on an instrument's measured
    characteristics, and makes no portfolio ranking.
  assumptions:
  - The three input measurements are available as committed records with intervals; without them the
    entry reports only what it has and says so explicitly.
  - Bayes' rule with a single base rate per profile is an adequate model of the screening decision,
    which ignores any dependence between cells and is stated as a simplification.
  - The ALPF pipeline can be reimplemented as four separable stages faithful to the archived procedure,
    which is checked by reproducing the archived verdicts before any ablation.
  - The base-rate grid from 0.001 to 0.5 covers the plausible range; values outside it are reported
    as outside the studied range rather than extrapolated.
  - Monte Carlo propagation over the input posteriors is adequate uncertainty accounting at the precision
    the inputs support.
  predictions:
  - metric: posterior surface of the null screen relative to the prior odds
    direction: different
    minimum_effect: 'forced: must equal the prior odds at every base rate within Monte Carlo error,
      or the composition code is wrong and nothing is reported'
  - metric: minimum base rate at which a fired cell of the most favourable profile has posterior odds
      above 1
    direction: different
    minimum_effect: 'refuse to pre-commit: this value is a direct function of the two input measurements,
      which are not yet made, and predicting it would be predicting them'
  - metric: discrimination contribution of the meter self-validation gate stage under ablation
    direction: higher
    minimum_effect: 0
  - metric: number of pipeline stages whose ablation moves the odds-equals-one contour by less than
      the Monte Carlo error
    direction: higher
    minimum_effect: 1
  minimal_test:
    design: 'No new elliptic-curve computation at all. Take the two input measurements as parameters
      and sweep them: false-positive rate over 0.01 to 0.30 and power over 0.05 to 0.99, base rate
      over 0.001 to 0.5, and compute the posterior-odds surface on that grid with Monte Carlo propagation
      from stated intervals. In the same invocation compute the null screen''s surface, which must
      equal the prior odds everywhere. This alone produces the decision artifact and shows a Coordinator
      exactly which combinations of instrument characteristics make a fired cell worth following up.
      The ablation half then needs only the stagewise reimplementation run on already-generated instance
      data, with each stage bypassed in turn. The discriminating output is whether any realistic (fpr,
      power) pair in the swept region yields posterior odds above 1 at a base rate a Coordinator would
      defend on the record.'
    controls:
    - Null screen firing independently of the instance at the matched marginal rate, whose posterior
      surface must equal the prior odds everywhere.
    - 'Stage-replacement control: each ablated stage replaced by a coin of matched fire rate rather
      than removed, separating information loss from marginal-rate change.'
    - 'Archived-verdict reproduction: the stagewise reimplementation must reproduce the archived cell
      verdicts before any ablation is trusted.'
    - 'Monte Carlo convergence control: the surface recomputed at two Monte Carlo sample sizes with
      the difference reported.'
    - 'Input-degradation control: the composition rerun with each input replaced by its interval endpoints,
      so the surface''s sensitivity to input uncertainty is visible.'
    required_metrics:
    - posterior-odds surface over (false-positive rate, power, base rate) per profile
    - odds-equals-one contour per profile with its Monte Carlo interval
    - per-stage discrimination contribution from ablation, with bootstrap intervals
    - null-screen surface deviation from the prior odds
    - archived-verdict reproduction rate by the stagewise reimplementation
    - surface sensitivity to each input's interval endpoints
    - follow-up decision table keyed to declared base rate
  falsification_conditions:
  - The null screen's posterior surface departs from the prior odds, indicating a composition error
    and voiding all output.
  - Power measured equal to the false-positive rate, in which case the posterior equals the prior
    at every base rate and the screen carries no decision information -- the single most important
    thing this entry can report.
  - The stagewise reimplementation fails to reproduce the archived verdicts, in which case no ablation
    is reported.
  - Every stage's ablation moves the contour by less than Monte Carlo error, indicating the pipeline's
    discrimination is not attributable to any stage as decomposed.
  - The odds-equals-one contour lies above base rate 0.5 for every profile, meaning no defensible
    prior makes a fired cell more likely real than not, which is a scoped and usable obstruction.
  - Input intervals so wide that the surface is uninformative across their endpoints, in which case
    the entry reports that the inputs need tightening before the composition is worth computing.
  confounders:
  - A single base rate per profile ignores dependence between screened cells, which the multiplicity
    entry shows is substantial; the two entries must be read together and this one states the simplification.
  - Power measured against planted structure may not equal power against natural structure, so the
    composition inherits the planted-positive entry's stated assumption.
  - The four-stage decomposition of the pipeline is an interpretation of an archived procedure, and
    a different decomposition would attribute discrimination differently.
  - Ablations are not independent because stages compose in order, so single-stage contributions do
    not sum to the total.
  - The base-rate axis is a free parameter that a motivated reader can choose to reach a desired conclusion,
    which is why the artifact is a surface and the declared value is required to be on the record.
  interpretation_limits:
  - A posterior surface is a decision aid conditioned on inputs measured elsewhere and on a base rate
    nobody has measured; it is not evidence about any curve, representation or decomposition.
  - Stage ablation describes a pipeline's information flow at these profiles and sizes and does not
    generalise to a differently constructed screen.
  - Nothing here revises any archived ALPF verdict, and no attack, speedup or security consequence
    follows.
  - The composition is only as good as its inputs, and if those inputs are wide the honest output
    is that the screen's operating characteristics are not yet resolved.
  target_complexity:
    time_exponent: No attack exponent is claimed. This entry performs no cryptographic computation;
      its cost is arithmetic over a parameter grid plus Monte Carlo sampling.
    memory_exponent: No attack memory exponent is claimed. The surface is a modest three-dimensional
      grid.
    best_known: 'The incumbent is the campaign''s implicit decision rule: a fired cell is followed
      up because it fired, with no specificity, power or base rate stated anywhere in EV-ALPF-001
      or the individual analyses. No competing decision artifact for this screen exists in the repository.
      The underlying-problem incumbent, Pollard rho at roughly sqrt(n) group operations, is untouched.'
    hidden_overhead: 'The base rate is unknowable from inside the lane and the surface makes that
      unavoidable rather than convenient; the human cost is a Coordinator having to declare a prior
      on the record, which is exactly the friction this entry is for and is the reason it may be unpopular.
      Lower-order term: the four-stage decomposition is an interpretive act that will be argued about
      more than it is computed.'
  dominated_by: 'n/a (no result claimed on any attack frontier). Pareto check performed across time,
    memory and data/queries: no attack point is produced, so no frontier row applies. Against the
    incumbent implicit decision rule this dominates on transparency at near-zero compute cost and
    is dominated by it only on the human cost of having to state a prior explicitly.'
  sota_delta: 'No attack; decision-support and measurement-composition contribution only. Quantitatively:
    the incumbent states zero of the three numbers a screening decision needs; this yields a posterior-odds
    surface over a three-dimensional grid with Monte Carlo intervals, an odds-equals-one contour per
    profile, and a per-stage discrimination table with bootstrap intervals. Zero change to any ECDLP
    time or memory exponent.'
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'That the composition and its null control are implemented correctly and
    the null surface matches the prior odds: 0.9, since this is arithmetic. That the three input measurements
    exist in committed form when this runs: 0.4 -- they are companion entries in this same batch and
    none is approved, so the realistic case is that this entry runs in its parameter-swept form without
    measured inputs, which is still useful and is specified as the minimal design. That the stagewise
    reimplementation reproduces the archived verdicts: 0.45, since the archived pipeline is documented
    in prose and its stage boundaries are inferred. That at least one stage is measured as inert:
    0.5, and that outcome would be the most actionable single result the entry can produce. That the
    entry''s honest conclusion is ''the inputs are too wide to decide'': 0.35, and that is reported
    as such rather than dressed up.'
