idea:
  id: IDEA-20260904-796ff3
  question_id: RQ-SIMSPK-f6a6c0
  handoff_id: null
  goal_id: GOAL-SIMSPK-001
  added: '2026-09-04'

  title: >-
    BEFORE GOAL-SIMSPK-001 ADDS DIFFERENTIAL-LINEAR REACH TO ITS PORTFOLIO IT MUST
    ESTABLISH THAT THE MEASURE IS WELL DEFINED - the same 18-round Speck128/128
    distinguisher is analysed as 5+8+5 in one paper and 5+9+4 in another, so a DL
    score depends on a decomposition boundary that is a FREE PARAMETER, and a
    constant-space ranking that flips when the boundary moves is not a measurement
    of the constants

  class: audit

  claim: >-
    RQ-SIMSPK-f6a6c0 proposes to score SIMON and SPECK rotation constants against
    the full computable cryptanalytic portfolio - differential, linear, impossible,
    integral, and for SPECK rotational-XOR. Differential-linear is the obvious
    omission and the natural next measure, and KN-LIT-824baa supplies a working
    pipeline for it. That same paper also exposes the hazard: the 18-round
    Speck128/128 distinguisher of Chen-Bao-Yu is decomposed 5+8+5 there, and
    Gong et al. re-decompose the IDENTICAL distinguisher as 5+9+4, under which the
    intermediate mask {77,5} propagates one further round to the singleton {5}.
    Same cipher, same rounds, same distinguisher, two different intermediate objects
    and two different middle correlations.
    A portfolio measure whose value depends on an analyst's choice of boundary is
    not a property of the cipher. Before any DL number enters a constant-space
    ranking, this proposal establishes whether the RANKING is boundary-sensitive.
    If it is not, DL reach is admissible with the boundary declared. If it is, the
    measure must be redefined as an optimization OVER boundaries, at a cost that
    must be charged before the goal commits to it - or DL must be dropped from the
    portfolio with the reason recorded.

  mechanism: >-
    Reduce to a scale where the whole thing is enumerable, then check whether the
    conclusion is stable. Work on Speck32/64, where the block is 32 bits, exhaustive
    or near-exhaustive mask handling is affordable, and KN-LIT-824baa supplies two
    reproducible anchors: the 9-round distinguisher at correlation 2^-7.3 and its
    5-round tail at 2^-1.
    Take a small declared set of rotation-constant pairs (alpha, beta) including
    the standardized (7,2), a handful of alternatives, and a random-constant null
    family drawn under a declared rule. For each pair, and for EACH admissible
    decomposition r_1 + r_m + r_2 of a fixed total round count R with r_m in a
    declared range, compute the best DL distinguisher score reachable by the same
    fixed pipeline: differential probability p over r_1 by trail search, middle
    correlation r over r_m by direct measurement, and linear correlation q over
    r_2 by minimum-weight trail search.
    That yields, per constant pair, a VECTOR of scores indexed by boundary rather
    than a scalar. Then ask the only question that matters for admissibility:
    is the RANKING of constant pairs the same under every boundary, and is it the
    same as the ranking by the boundary-optimized maximum? Rank agreement is
    Kendall tau between the per-boundary rankings; disagreement is measured, not
    argued.

  novelty_status: unverified

  novelty_note: >-
    That differential-linear analysis depends on the chosen split is elementary and
    well known; this record claims nothing novel about it. What is proposed is an
    ADMISSIBILITY AUDIT for a specific planned use - DL reach as a scoring measure
    over a rotation-constant space - and this program has no record that such an
    audit has been performed for that use. KN-LIT-2112 (a methodology for
    differential-linear) is the corpus entry most likely to already answer part of
    this and has NOT been read here; reading it first is cheaper than running this.

  citations:
    - ref: KN-LIT-824baa
      provenance: internal
      claim: >-
        States that Gong et al. re-decompose the same 18-round Speck128/128
        distinguisher as 5+9+4, under which the two-bit intermediate mask {77,5}
        propagates one further round to the single-bit mask {5}, and that the
        authors retain the 5+8+5 split deliberately so that the neural boundary
        carries a multi-bit mask. Supplies p = 2^-30, r = 2^-5.81, q = 2^-10 for
        the 5+8+5 reading.
      verified_by: >-
        Top-level orchestrating session, 2026-09-04. Full text supplied by the user
        in-session and read in full; the paper's own bibliographic identifier is
        unresolved, and the Gong et al. re-decomposition is relayed as this paper
        reports it and has NOT been read in primary text by this program.
    - ref: KN-TECH-065
      provenance: internal
      claim: >-
        The three-part E_2 . E_m . E_1 framework and the p q^2 correlation model
        whose middle term is exactly what the boundary choice relocates.
      verified_by: Top-level orchestrating session, 2026-09-04.
    - ref: KN-OPEN-7f0d85
      provenance: internal
      claim: This proposal is question Q6 of that open problem.
      verified_by: Top-level orchestrating session, 2026-09-04.

  assumptions:
    - >-
      Speck32/64 is a valid proxy for the boundary-sensitivity question at larger
      block sizes. IT MAY NOT BE, and this record does not assume it is: the finding
      is scoped to Speck32/64 and any transfer to Speck128/128 or to SIMON is an
      explicit extrapolation that must be stated and, ideally, spot-checked on one
      larger cell before the portfolio decision is taken.
    - >-
      The pipeline used to score each boundary is IDENTICAL across constant pairs
      and boundaries. A pipeline that is tuned per cell measures the tuning. This is
      RQ-SIMSPK-f6a6c0's own "no measurement made only where an effect is expected"
      constraint applied to the boundary axis.

  predictions:
    - >-
      PRIMARY. The ranking of constant pairs by best-DL-score IS boundary-sensitive:
      Kendall tau between rankings at different r_m falls materially below 1.
      Consequence if true: DL reach is admissible as a portfolio measure ONLY as a
      boundary-optimized maximum, and the goal must charge that optimization.
    - >-
      The boundary maximizing the score differs across constant pairs, which is the
      mechanism that would produce the ranking flip and is a sharper, separately
      checkable claim.
    - >-
      The standardized (7,2) is not extremal under DL reach at any boundary - i.e.
      DL behaves like the other portfolio measures and does not single out the
      published constants. This is the prediction the goal most needs tested and
      the one whose NEGATION would matter most.

  minimal_test:
    design: >-
      (a) Pin and validate a Speck32/64 implementation against specification test
      vectors. (b) Reproduce the two published anchors - the 9-round DL at 2^-7.3
      and the 5-round tail at 2^-1 - for the standardized (7,2). A failure here is
      an implementation-fidelity failure and stops the audit. (c) Fix R = 9 and
      sweep r_m over a declared range with r_1 + r_m + r_2 = R. (d) Score a declared
      set of constant pairs - the standardized (7,2), at least five alternatives
      chosen by a stated rule, and at least ten random-constant null members - at
      every boundary. (e) Report per-boundary rankings, pairwise Kendall tau, and
      the boundary-optimized ranking.
      Deliberately SMALL: nine rounds, one block size, a dozen-odd constant pairs.
      The audit's job is to decide admissibility of a measure, not to produce the
      portfolio; scaling it up before that decision would be spending the goal's
      budget on a measure that may not be usable.
    controls:
    - >-
      RANDOM-CONSTANT NULL FAMILY, as RQ-SIMSPK-f6a6c0 requires. Boundary
      sensitivity that also appears at random constants is a property of the
      measure. Here that is not a caveat but the EXPECTED outcome, and the null
      family is what makes it reportable rather than surprising.
    - >-
      IDENTICAL-PIPELINE CHECK. Verify by construction that the differential search,
      middle measurement, and linear search use the same encodings, budgets, and
      sample sizes in every cell, and record the per-cell budgets in the run record.
    - >-
      DEGENERATE-BOUNDARY ARM. Include r_m = 0 (pure differential-linear with no
      measured middle) and r_1 = 0, so the sweep spans the whole family rather than
      an interior window chosen after seeing results.
    required_metrics:
    - per-boundary score vector per constant pair
    - pairwise Kendall tau between boundary rankings, and against the optimized ranking
    - argmax boundary per constant pair
    - the same four for the random-constant null family
    - reproduction status of both Speck32/64 anchors

  falsification_conditions:
    - >-
      Kendall tau is at or near 1 across all boundaries. The measure is then
      boundary-robust at this scale, DL reach is admissible with a single declared
      boundary, and the goal saves the cost of optimizing over boundaries. This is
      the cheap good outcome and it closes the audit.
    - >-
      The standardized (7,2) IS extremal under DL reach at some boundary while the
      null family is not. That is a portfolio-relevant observation for
      RQ-SIMSPK-f6a6c0 and must be recorded strictly as a position in a
      distribution under a named measure at a named round count and budget - never
      as a statement about the design, the designers, or intent, which that
      question's constraints forbid absolutely.
    - >-
      The anchors do not reproduce. The audit asserts nothing and is superseded.

  confounders:
    - >-
      With R = 9 the boundary sweep has few interior points, so a ranking flip could
      be small-sample noise in the trail searches rather than boundary structure.
      Report the search's own determinism check and repeat the flip at R = 10 before
      believing it.
    - >-
      Alternative constant pairs chosen by an unstated rule will smuggle in the
      answer. Declare the selection rule before scoring, and prefer a rule that is
      exhaustive over a small subspace to one that picks interesting-looking pairs.
    - >-
      The middle correlation r is measured while p and q are searched. Mixing a
      measured term with two searched terms means the three cells' errors are not
      comparable; report each term separately as well as the product.

  interpretation_limits: >-
    Scoped to Speck32/64, R = 9, the declared constant set, the declared boundary
    range, and single-trail correlations. It decides whether a DL score is
    ADMISSIBLE as a portfolio measure at this scale - nothing more. It is not an
    attack, not a security statement about any variant, and not a statement about
    any constant's quality. RQ-SIMSPK-f6a6c0's absolute prohibition on any claim
    about designer intent binds every record produced under this proposal.

  dominated_by: >-
    Dominated by simply reading KN-LIT-2112 and the Gong et al. paper in primary
    text if either already establishes boundary sensitivity for this measure. That
    is a literature task costing hours rather than solver-days and SHOULD be
    attempted first; this record is the fallback for when the literature does not
    settle it.

  sota_delta: >-
    None. No distinguisher is produced or improved. The deliverable is an
    admissibility verdict that prevents GOAL-SIMSPK-001 from spending its budget on
    an ill-defined measure - value realized as cost avoided, not as an advance.

  estimated_cost:
    compute: >-
      Low by this program's standards and deliberately so. Speck32/64 trail searches
      at R <= 10 are fast; the middle measurements are single sampling passes. The
      dominant term is the cell count: boundaries x constant pairs x null members.
      A 6-boundary, 16-pair sweep is ~96 differential searches and ~96 linear
      searches at small R, which should fit inside the GOAL-SIMSPK-001 budget of
      10800 s at max_concurrent 3 - the only proposal in this batch of which that is
      true without qualification.
    implementation: >-
      Medium. Needs a Speck32/64 trail-search encoding parameterized by (alpha,
      beta), which GOAL-SIMSPK-001 requires for its whole portfolio regardless, so
      the cost is shared rather than incurred here.
    memory: Low.

  recommended_priority: high

  honest_prior_of_survival: >-
    High, perhaps 0.75, that the primary prediction holds - the DL score is a product
    of three terms with different round-count dependences and there is little reason
    for the argmax boundary to be constant across constants. That the prediction is
    LIKELY is not an argument against running it: the goal needs the verdict on
    record before it commits budget, and a confirmed boundary sensitivity changes
    what the portfolio measure IS rather than merely adding a caveat.

  status: proposed
  proposed_by: top-level-session
  proposed_at: '2026-09-04'
  source_refs: [KN-LIT-824baa, KN-TECH-065, KN-TECH-d64293, KN-OPEN-7f0d85, KN-LIT-2112]
  scope_note: >-
    The most directly goal-serving record in this batch and the one that should run
    first if GOAL-SIMSPK-001 is activated: it is small, it fits the declared budget,
    it reuses infrastructure the goal needs anyway, and its outcome determines
    whether the other four proposals are even relevant to that goal.
