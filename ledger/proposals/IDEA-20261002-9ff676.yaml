  title: >-
    AFTER COLLAPSING FROBENIUS×NEGATION ORBITS, DOES UNIQUE-ORBIT RELATION
    YIELD STAY ≥ ρ OF RAW YIELD? On toy Koblitz n∈{17,23,31} with frozen V,
    collect relations and test whether |orbit-unique relations| /
    |raw relations| ≥ ρ with ρ frozen.

  class: heuristic_validation

  claim: >-
    KR-IC-b0fcda states that Frobenius-invariant factor bases can cut the
    number of systems by 1/n and speed LA by up to n²; it does not freeze
    a unique-orbit yield retention band after collapsing each collected
    relation under the Frobenius×negation group action. CLAIM: for each
    admitted toy cell n∈{17,23,31} with frozen V, across a surplus schedule
    s∈{1.0,1.5,2.0}×|#FB|, the retention ratio
    R := |orbit_unique| / |raw| satisfies R ≥ ρ with ρ frozen at Stage 0 —
    OR the band fails and is recorded as orbit-collapse-destroys-yield at
    this scale. CLAIM TIER: heuristic_validation. NO break. NO exponent.
    NO n≥131 transfer. Distinct from IDEA-20261001-0fcbe2 (τ-closed FB
    yield raise), cb6a72 (orbit-attempt counting on non-stable V), 833e78
    (Frobenius-class walk √(2n)), and 9d8520 (orphan absorption).

  mechanism: >-
    OBJECT FRAME. Representation: relation list over FB {P : x(P)∈V};
    Operation: collect raw relations to frozen surplus, then collapse each
    relation to a canonical representative under ⟨Frobenius, negation⟩;
    Observable: retention R = |orbit_unique| / |raw| at each surplus.
    Trichotomy: Class I instrument (post-collection uniqueness meter).
    Lossy-projection: R discards which orbits were large; null is a
    matched list of random sparse vectors with the same length whose
    "orbit" is the identity action (R ≡ 1 by construction). OFF-LIMITS:
    τ-closed FB yield (0fcbe2); counting decomposition attempts along
    orbits (cb6a72); rho walk constants (833e78); orphan absorption
    (9d8520). WHAT IS NEW: a frozen ρ unique-orbit retention band on
    RQ-BINSTD toys.

