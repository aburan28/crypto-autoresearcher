  assumptions:
    - Frozen V, ρ, surplus schedule, seeds, orbit group ⟨Frob, negation⟩.
    - Relation collector already admitted or cell is failed_infrastructure
      (do not provision curve libs mid-tick).
    - Retention R ≠ τ-closed yield raise ≠ walk-constant meter.
    - R ≥ ρ ≠ practical binary IC (KR-IC-1fcdbc).

  heuristic_assumptions:
    - id: HEUR-BINSTD-9ff676-H1
      formal_statement: >-
        FORALL n∈{17,23,31} and surplus s∈{1.0,1.5,2.0}×|#FB|:
        R := |orbit_unique|/|raw| ≥ ρ with ρ frozen at Stage 0.
      random_model_justification: >-
        Rigorous: KR-IC-b0fcda argues Frobenius action identifies
        equivalent relations on Koblitz curves. Classical: if orbits are
        typically small (size O(1) or O(n) with low multiplicity),
        retention stays above a positive ρ independent of surplus; if
        most raw relations are high-multiplicity duplicates under the
        group action, the band fails. The ρ band is the pre-registered
        transfer hypothesis at toys — not a claim that IC beats rho.
      supporting_results:
        - KR-IC-b0fcda
        - KR-IC-1fcdbc
        - KR-RHO-fb88e6
      validation_experiment_ids: []
      falsification_condition: >-
        R < ρ at a completed (n,s) cell (orbit-collapse-destroys-yield),
        OR collector absent (infrastructure stop), OR raw count below
        the surplus floor after the budgeted catalog (inconclusive;
        expand or stop).

